semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.RESOLUCION_PROBLEMA
resumen_inicial: La resolución del problema consiste en despejar la ecuación planteada
  y calcular el valor cuantitativo de la incógnita.
explicacion_simple: 'Una vez que hemos planteado correctamente la ecuación lineal
  a partir del problema verbal, procedemos a resolverla algebraicamente.

  Aplicamos la eliminación de paréntesis, la transposición de términos y la reducción
  de términos semejantes hasta obtener el valor numérico exacto de la incógnita $x$.'
explicacion_formal: 'El **proceso de resolución de problemas lineales** ejecuta la
  secuencia algorítmica completa:


  $$\text{Planteamiento: } A(x) = B(x) \implies \text{Despeje: } a x = b \implies
  \text{Solución: } x = \frac{b}{a}$$


  **Desglose de la fórmula:**

  - Carga operativa de resolución donde se aplican las propiedades de transposición
  vistas en el bloque de ecuaciones.'
definiciones_clave: '- **Resolución del modelo lineal**: Ejecución de las operaciones
  algebraicas necesarias para despejar la incógnita de la ecuación planteada.'
propiedades_relaciones: '- **Certeza matemática**: La solución algebraica obtenida
  $x = c$ satisface rigurosamente el sistema formal de la ecuación.'
ejemplo_guiado:
  enunciado: Resuelve el problema planteado en la ecuación $3(x + 4) = 2x + 20$ para
    hallar la edad actual de Maria y evalúa su valor.
  pasos:
  - 'Paso 1: Expandir el primer miembro: $3x + 12 = 2x + 20$.Paso 2: Trasponer el
    término $2x$ al primer miembro: $3x - 2x + 12 = 20$.Paso 3: Trasponer $+12$ al
    segundo miembro: $3x - 2x = 20 - 12$.Paso 4: Reducir términos semejantes: $x =
    8$.Paso 5: Comprobar en el enunciado: en $4$ años Maria tendrá $8 + 4 = 12$ años,
    su triple es $3(12) = 36$. El doble de su edad actual ($16$) aumentado en $20$
    es $16 + 20 = 36$ ($36 = 36$).'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la ecuación $3(x + 4) = 2x + 20$, ¿cuál es la solución para
    la incógnita $x$?
  choices:
  - text: $x = 8$
    is_correct: true
  - text: $x = 12$
    is_correct: false
  - text: $x = 16$
    is_correct: false
  - text: $x = 32$
    is_correct: false
  explanation: La alternativa correcta es '$x = 8$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar la solución $x = 8$ en el contexto del problema, ¿cuál es
    la edad que tendrá Maria dentro de 4 años?
  choices:
  - text: $12\text{ años}$
    is_correct: true
  - text: $8\text{ años}$
    is_correct: false
  - text: $16\text{ años}$
    is_correct: false
  - text: $36\text{ años}$
    is_correct: false
  explanation: La alternativa correcta es '$12\text{ años}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación lineal planteada desde el enunciado.'
- 'Paso 2: Aplicar la propiedad distributiva para suprimir los paréntesis.'
- 'Paso 3: Reagrupar las variables en un miembro y las constantes en el otro.'
- 'Paso 4: Reducir los términos semejantes.'
- 'Paso 5: Dividir entre el coeficiente principal para hallar el número solución $x$.'
errores_correccion: '- **Error común:** Dar por terminado el trabajo al obtener el
  valor $x = 8$ sin responder la pregunta específica del problema.

  - **Cómo corregirlo:** Revisa siempre la pregunta del enunciado para responder exactamente
  lo que se pide (por ejemplo, si pedían la edad en 4 años, la respuesta es $12$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El primer paso para resolver un problema verbal es definir la incógnita?
  respuesta: Sí
  solucion_pasos:
  - Sí, declarar la variable $x$ es indispensable.
- titulo: ¿Pueden existir soluciones matemáticas que se descarten por ser incompatibles
    con el contexto real?
  respuesta: Sí
  solucion_pasos:
  - Sí, como edades o cantidades de objetos negativas.
errores_frecuentes:
- Operar números del enunciado al azar sin definir la incógnita $x$.
- Olvidar los paréntesis al traducir frases como 'el triple de un número aumentado
  en 5'.
- Dar por terminado el problema al despejar $x$ sin responder la pregunta específica
  del enunciado.
- Omitir las unidades de medida en la respuesta final del problema.
- Aceptar soluciones negativas o decimales incompatibles con la realidad física del
  contexto.
afirmaciones_verdaderas:
- El modelamiento lineal traduce relaciones del lenguaje verbal a una ecuación de
  primer grado.
- Las soluciones obtenidas al modelar deben ser verificadas frente a las restricciones
  físicas del contexto real.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar la incógnita,
  plantear, resolver e interpretar problemas contextualizados mediante ecuaciones
  lineales.
