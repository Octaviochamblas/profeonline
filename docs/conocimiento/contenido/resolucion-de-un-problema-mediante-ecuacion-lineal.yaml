  question: ¿Cuál es la regla fundamental para mantener la igualdad al resolver resolución
    de un problema mediante ecuación lineal?
  choices:
  - text: Aplicar las propiedades aditiva y multiplicativa para despejar la incógnita
      en modelamiento con ecuaciones lineales
    is_correct: true
  - text: Sumar una cantidad en un miembro y restarla en el otro
    is_correct: false
  - text: Multiplicar un solo lado de la igualdad por cero
    is_correct: false
  - text: Cambiar el signo de los coeficientes sin moverlos de miembro
    is_correct: false
  explanation: 'La alternativa correcta es: Aplicar las propiedades aditiva y multiplicativa
    para despejar la incógnita en modelamiento con ecuaciones lineales. Es la regla
    de la igualdad en resolución de un problema mediante ecuación lineal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al obtener el valor de la incógnita en resolución de un problema mediante
    ecuación lineal, ¿qué paso final se recomienda?
  choices:
  - text: Verificar la solución sustituyendo el valor hallado en la ecuación original
    is_correct: true
  - text: Igualar la solución a cero inmediatamente
    is_correct: false
  - text: Borrar los términos constantes de la ecuación
    is_correct: false
  - text: Dividir el resultado final entre la variable
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar la solución sustituyendo el
    valor hallado en la ecuación original. Garantiza que no se hayan cometido errores
    aritméticos en resolución de un problema mediante ecuación lineal.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Aisla la ecuación del contexto verbal.
- Aplica la reducción de términos semejantes.
- Transpón los términos numéricos a un lado y la incógnita al otro.
- Divide por el coeficiente de la incógnita para obtener el valor numérico de 'x'.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución de un problema mediante ecuación lineal.
ejemplos:
- titulo: $3x = 30$ y $x = 10$
  enunciado: Justifica el procedimiento adecuado para el caso $3x = 30$ y $x = 10$.
  solucion_pasos:
  - 'Te concentras puramente en el álgebra: reduces términos semejantes ($3x = 30$)
    y despejas ($x = 10$).'
  - Aisla la ecuación del contexto verbal.
- titulo: $x + 2x = 30$
  enunciado: Determina qué debe hacerse en $x + 2x = 30$ y fundamenta cada transformación.
  solucion_pasos:
  - Este es el paso mecánico. Tienes tu ecuación $x + 2x = 30$. Ahora te olvidas de
    Juan, de Pedro y de las palabras.
  - Aplica la reducción de términos semejantes.
- titulo: 'Respecto de «Resolución de un problema mediante ecuación lineal»: ¿La siguiente
    formulación'
  enunciado: 'Respecto de «Resolución de un problema mediante ecuación lineal»: ¿La
    siguiente formulación es correcta? «Este es el paso mecánico»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Este es el paso mecánico.'
- titulo: 'Respecto de «Resolución de un problema mediante ecuación lineal»: ¿La siguiente
    conclusión e'
  enunciado: 'Respecto de «Resolución de un problema mediante ecuación lineal»: ¿La
    siguiente conclusión es correcta? «Puede omitirse esta condición sin cambiar el
    resultado: «Aisla la ecuación del contexto verbal»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Este es el paso mecánico.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Aisla la ecuación del
  contexto verbal».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Aplica la reducción
  de términos semejantes».'
- La definición sigue cumpliéndose aunque no se considere que este es el paso mecánico.
  Tienes tu ecuación $x + 2x = 30$. Ahora te olvidas de Juan, de Pedro y de las palabras.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Divide
  por el coeficiente de la incógnita para obtener el valor numérico de 'x'».
- La comprobación del resultado vuelve innecesaria la condición «Aisla la ecuación
  del contexto verbal».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando resolución
  de un problema mediante ecuación lineal.
