semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.RESOLUCION_PROBLEMA
resumen_inicial: La resolución del problema consiste en ejecutar el despeje algebraico de la ecuación planteada para hallar el valor numérico de la incógnita.
explicacion_simple: |
  Una vez que hemos planteado correctamente la ecuación lineal a partir del texto del problema verbal, procedemos a su resolución algebraica.

  Aplicamos en orden la eliminación de paréntesis por distributividad, la transposición de términos y la reducción de términos semejantes hasta obtener el valor numérico exacto de la incógnita $x$.

  Obtenido el valor de $x$, debemos verificar numéricamente que la solución obtenida cumpla las condiciones estipuladas en la igualdad inicial.
explicacion_formal: |
  ### Definición formal
  El **algoritmo de resolución del modelo lineal** ejecuta la secuencia operacional canónica:

  $$\text{Ecuación planteada: } A(x) = B(x) \implies \text{Forma reducida: } a x = b \implies \text{Solución: } x = \frac{b}{a}$$

  ### Desglose de la fórmula
  - $A(x) = B(x)$: Igualdad algebraica que relaciona las expresiones traducidas del enunciado.
  - $x = \frac{b}{a}$: Valor numérico obtenido tras despejar el coeficiente $a \neq 0$.

  ### Síntesis didáctica
  Resolver la ecuación representa la fase algebraica del modelamiento, la cual debe ser complementada posteriormente con la interpretación contextual de la respuesta.
definiciones_clave: |
  - **Resolución del modelo lineal**: Aplicación de las técnicas algebraicas de despeje sobre la ecuación planteada para calcular el valor numérico de $x$.
  - **Certeza matemática del modelo**: Comprobación aritmética de que la raíz obtenida satisface la ecuación lineal construida.
propiedades_relaciones: |
  - **Unicidad de la solución**: Toda ecuación lineal de primer grado bien planteada ($a \neq 0$) posee una única solución numérica real.
  - **Coherencia algebraica**: Las transformaciones equivalentes conservan exactamente el mismo valor de la incógnita a lo largo de todos los pasos.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación planteada $3(x + 4) = 2x + 20$ correspondiente al problema de la edad de María y evalúa su valor.'
  pasos:
    - 'Paso 1: Expandir el paréntesis en el primer miembro aplicando la propiedad distributiva: $3x + 12 = 2x + 20$.'
    - 'Paso 2: Trasponer el término $2x$ restando al primer miembro: $3x - 2x + 12 = 20$.'
    - 'Paso 3: Trasponer la constante $+12$ restando al segundo miembro: $3x - 2x = 20 - 12$.'
    - 'Paso 4: Reducir términos semejantes para obtener el valor de la incógnita: $x = 8$.'
    - 'Paso 5: Comprobar la solución en la ecuación: $3(8 + 4) = 3(12) = 36$ y $2(8) + 20 = 16 + 20 = 36$, confirmando $36 = 36$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al resolver la ecuación lineal $3(x + 4) = 2x + 20$, ¿cuál es el valor obtenido para la incógnita $x$?'
    choices:
      - {text: '$x = 8$', is_correct: true}
      - {text: '$x = 12$', is_correct: false}
      - {text: '$x = 16$', is_correct: false}
      - {text: '$x = 32$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 8$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al sustituir la solución $x = 8$ en el contexto donde la edad dentro de 4 años es $x + 4$, ¿cuál es ese valor futuro?'
    choices:
      - {text: '$12\text{ años}$', is_correct: true}
      - {text: '$8\text{ años}$', is_correct: false}
      - {text: '$16\text{ años}$', is_correct: false}
      - {text: '$36\text{ años}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$12\text{ años}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la ecuación lineal estructurada en el planteamiento del problema.'
  - 'Paso 2: Eliminar paréntesis agrupadores aplicando la propiedad distributiva.'
  - 'Paso 3: Trasponer los términos con la variable $x$ al primer miembro y las constantes al segundo miembro.'
  - 'Paso 4: Reducir los términos semejantes en ambos miembros.'
  - 'Paso 5: Dividir entre el coeficiente de $x$ para calcular su valor numérico.'
errores_correccion: |
  - **Error 1:** Dar por terminado el problema al despejar el valor $x = 8$ sin responder la pregunta específica formulada en el texto. **Cómo corregirlo:** Revisar siempre **LA PREGUNTA DEL ENUNCIADO PARA CALCULAR LA MAGNITUD SOLICITADA (POR EJEMPLO, SI PIDEN LA EDAD EN 4 AÑOS, LA RESPUESTA ES $8 + 4 = 12$)**.
  - **Error 2:** Modificar erróneamente los signos al trasponer términos semejantes durante la resolución. **Cómo corregirlo:** Aplicar estrictamente **LA REGLA DE TRANSPOSICIÓN: TODO SUMANDO QUE CAMBIA DE MIEMBRO PASA CON SU OPERACIÓN INVERSA ($+a \implies -a$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Resuelve la ecuación $2x + 1500 = 4500$ y determina el valor de $x$.'
    alternativas:
      - '$x = 1500$'
      - '$x = 3000$'
      - '$x = 1000$'
    respuesta: '$x = 1500$'
    solucion_pasos:
      - '1. Trasponer $1500$: $2x = 4500 - 1500 = 3000$.'
      - '2. Despejar $x$: $x = \frac{3000}{2} = 1500$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la ecuación de números consecutivos $3x + 3 = 45$.'
    alternativas:
      - '$x = 14$'
      - '$x = 15$'
      - '$x = 16$'
    respuesta: '$x = 14$'
    solucion_pasos:
      - '1. $3x = 45 - 3 = 42$.'
      - '2. $x = \frac{42}{3} = 14$.'
  - titulo: 'Reducción de términos'
    enunciado: '¿La reducción de términos semejantes se aplica tras eliminar paréntesis y trasponer variables?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, simplifica la ecuación a la forma canónica $ax = b$.'
  - titulo: 'Comprobación algebraica'
    enunciado: '¿Reemplazar $x$ en la ecuación inicial confirma la veracidad de la solución hallada?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, demuestra que ambos miembros equivalen a la misma cantidad.'
errores_frecuentes:
  - 'Concluir el problema con el valor de $x$ omitiendo responder la pregunta específica del texto.'
  - 'Cometer errores de signos al despejar $x$ tras eliminar los paréntesis.'
  - 'Olvidar dividir entre el coeficiente principal $a$ al finalizar la reducción.'
  - 'Confundir el valor de la incógnita $x$ con los datos secundarios del enunciado.'
  - 'Omitir la comprobación numérica en la ecuación planteada.'
afirmaciones_verdaderas:
  - 'La resolución de un problema lineal aplica las reglas de despeje algebraico sobre la ecuación planteada.'
  - 'El valor de la incógnita $x$ debe utilizarse para responder exactamente la magnitud solicitada en el enunciado.'
al_terminar_debes_poder: |
  QUÉ: Resolver algebraicamente problemas modelados mediante ecuaciones lineales de primer grado.
  CÓMO: Ejecutar la supresión de paréntesis, trasponer términos, reducir términos semejantes, calcular la incógnita $x$ y responder a la pregunta del enunciado.
