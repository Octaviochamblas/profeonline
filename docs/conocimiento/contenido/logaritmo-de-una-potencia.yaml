semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA
resumen_inicial: 'El logaritmo de una potencia es igual al exponente multiplicado por el logaritmo de la base del argumento: $\log_b(x^k) = k \cdot \log_b(x)$ ($x > 0, k \in \mathbb{R}$).'
explicacion_simple: '![Propiedad del logaritmo de una potencia](/static/img/nodos/logaritmo-de-una-potencia-intro.svg)


  Esta propiedad se conoce popularmente como la **regla de la potencia o del sombrerito**:

  - Cuando el argumento tiene un exponente como $\log_2(8^5)$, el exponente $5$ puede *bajar* al frente multiplicando: $5 \cdot \log_2(8) = 5 \cdot 3 = 15$.

  - En sentido inverso, cualquier número que multiplique al frente de un logaritmo puede *subir* como exponente del argumento: $3 \cdot \log(2) = \log(2^3) = \log(8)$.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$, $x \in \mathbb{R}^+$ y $k \in \mathbb{R}$. La **propiedad del logaritmo de una potencia** establece que:


  $$\log_b(x^k) = k \cdot \log_b(x)$$


  **Demostración Analítica:**

  1. Sea $u = \log_b(x) \implies x = b^u$.

  2. Elevando ambos miembros a la potencia $k$: $x^k = (b^u)^k = b^{k \cdot u}$.

  3. Aplicando el operador logaritmo: $\log_b(x^k) = k \cdot u$.

  4. Reemplazando $u$: $\log_b(x^k) = k \cdot \log_b(x)$. $\blacksquare$'
definiciones_clave: '- **Logaritmo de una potencia**: Identidad $\log_b(x^k) = k \cdot \log_b(x)$.

  - **Coeficiente multiplicativo**: Factor $k$ que antecede al logaritmo tras extraer el exponente.

  - **Linealidad con potencias**: Propiedad que convierte exponenciales internas en productos externos.'
propiedades_relaciones: '- **Exponentes enteros, negativos y fraccionarios**: Válido para todo $k \in \mathbb{R}$.

  - **Preparación para condensar**: Antes de sumar o restar logaritmos, se deben subir los coeficientes como exponentes.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de una potencia](/static/img/nodos/logaritmo-de-una-potencia-ejemplos.svg)


    Calcule el valor de $\log_5(25^4)$ y simplifique la expresión $\log_2(16^{-3})$.'
  pasos:
  - 'Paso 1: Para $\log_5(25^4)$: Bajar el exponente 4 al frente: $4 \cdot \log_5(25)$.'
  - 'Paso 2: Calcular $\log_5(25) = 2 \implies 4 \cdot 2 = 8$.'
  - 'Paso 3: Para $\log_2(16^{-3})$: Bajar el exponente negativo $-3$: $-3 \cdot \log_2(16)$.'
  - 'Paso 4: Calcular $\log_2(16) = 4 \implies -3 \cdot 4 = -12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con el exponente $k$ en la expresión $\log_b(x^k)$?
  choices:
  - text: 'Pasa al frente multiplicando al logaritmo: $k \cdot \log_b(x)$'
    is_correct: true
  - text: Se convierte en la nueva base del logaritmo
    is_correct: false
  - text: 'Se suma al logaritmo: $k + \log_b(x)$'
    is_correct: false
  - text: 'Eleva a todo el logaritmo: $[\log_b(x)]^k$'
    is_correct: false
  explanation: 'La alternativa correcta es ''Pasa al frente multiplicando al logaritmo: $k \cdot \log_b(x)$''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el valor de $\log_5(25^4)$?
  choices:
  - text: $8$, porque $4 \cdot \log_5(25) = 4 \cdot 2 = 8$
    is_correct: true
  - text: $100$
    is_correct: false
  - text: $16$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$8$, porque $4 \cdot \log_5(25) = 4 \cdot 2 = 8$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $k$ que afecta al argumento $x$.'
- 'Paso 2: Extraer el exponente colocándolo como coeficiente multiplicativo: $k \cdot \log_b(x)$.'
- 'Paso 3: Evaluar el logaritmo resultante y realizar el producto numérico final.'
errores_correccion: '- **Error 1: Confundir $\log_b(x^k)$ con $[\log_b(x)]^k$.** **Cómo corregirlo:** La propiedad solo se aplica si el exponente afecta **exclusivamente al argumento $x$**, no a todo el logaritmo.

  - **Error 2: Condensar sumas con coeficientes al frente sin subirlos primero.** **Cómo corregirlo:** En $2\log(x) + \log(y)$, primero se transforma en $\log(x^2) + \log(y) = \log(x^2 y)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $3 \cdot \log_2(4)$?
  alternativas:
  - $6$
  - $12$
  - $8$
  respuesta: $6$
  solucion_pasos:
  - $3 \cdot \log_2(4) = 3 \cdot 2 = 6$ (o bien $\log_2(4^3) = \log_2(64) = 6$).
- titulo: Ejemplo 2
  enunciado: Si $\log(x) = 1,5$, ¿cuánto vale $\log(x^4)$?
  alternativas:
  - $6$
  - $5,0625$
  - $4,5$
  respuesta: $6$
  solucion_pasos:
  - $\log(x^4) = 4 \cdot \log(x) = 4 \cdot 1,5 = 6$.
- titulo: ¿Es log(10⁵) = 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\log(10^5) = 5 \cdot \log(10) = 5 \cdot 1 = 5$.
  alternativas:
  - texto: Sí, 5 · log(10) = 5
    es_correcta: true
    retroalimentacion: ¡Correcto! Bajada directa del exponente.
  - texto: No, es 50
    es_correcta: false
    retroalimentacion: Incorrecto, $\log(10) = 1$.
  - texto: No, es 10
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente es 5.
- titulo: ¿Equivale 2 · log(5) a log(25)?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, subiendo el coeficiente: $\log(5^2) = \log(25)$.'
  alternativas:
  - texto: Sí, log(5²) = log(25)
    es_correcta: true
    retroalimentacion: ¡Correcto! Coeficiente ingresa como exponente.
  - texto: No, es log(10)
    es_correcta: false
    retroalimentacion: Incorrecto, el 2 no multiplica al 5 adentro, lo eleva.
  - texto: No, es 25
    es_correcta: false
    retroalimentacion: Incorrecto, conserva el operador logarítmico.
errores_frecuentes:
- Bajar exponentes que afectan a toda la expresión $[\log_b(x)]^k$.
- Multiplicar el argumento por el coeficiente en lugar de elevarlo.
- Olvidar los signos negativos en exponentes inversos.
- No subir los coeficientes antes de condensar sumas y restas.
afirmaciones_verdaderas:
- El logaritmo de una potencia es igual al exponente multiplicado por el logaritmo de la base.
- La propiedad es válida para cualquier exponente real $k \in \mathbb{R}$.
- Permite simplificar argumentos con exponentes elevados de manera inmediata.
al_terminar_debes_poder: '![Síntesis de logaritmo de una potencia](/static/img/nodos/logaritmo-de-una-potencia-resumen.svg)


  QUÉ: Aplicar con precisión la propiedad del logaritmo de una potencia $\log_b(x^k) = k \cdot \log_b(x)$.


  CÓMO: Extrayendo exponentes multiplicando al frente o ingresando coeficientes como exponentes del argumento, para todo $x > 0$ y $k \in \mathbb{R}$.'
fuente: Texto escolar MINEDUC — Matemática 2° Medio / PAES.
