semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA
resumen_inicial: El logaritmo de una potencia es igual al exponente multiplicado por
  el logaritmo de la base ($\log_b(x^n) = n \cdot \log_b(x)$).
explicacion_simple: 'Esta es la propiedad más famosa de los logaritmos: **el exponente
  de adentro pasa multiplicando adelante del logaritmo** (el exponente ''baja'' a
  multiplicar):

  $$\log_2(8^5) = 5 \cdot \log_2(8) = 5 \cdot 3 = 15$$

  Esto permite resolver ecuaciones donde la incógnita está en el exponente.'
explicacion_formal: 'Para $b > 0, b \neq 1$, $x > 0$ y $n \in \mathbb{R}$, se cumple:

  $$\log_b(x^n) = n \cdot \log_b(x)$$

  Deriva de la aplicación iterada del logaritmo de un producto o de las leyes de exponentes.'
definiciones_clave: '- **Bajada del exponente**: Propiedad que transforma potencias
  internas en coeficientes multiplicadores.'
propiedades_relaciones: '- **Herramienta de despeje**: Es el método estándar para
  bajar incógnitas que están en el exponente.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\log_3(9^4)$.
  pasos:
  - 'Bajar el exponente $4$ a multiplicar adelante del logaritmo: $4 \cdot \log_3(9)$.'
  - Calcular $\log_3(9) = 2$ (pues $3^2 = 9$).
  - 'Multiplicar: $4 \cdot 2 = 8$.'
  - Concluir que $\log_3(9^4) = 8$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\log_5(x^3)$?
  choices:
  - text: 3 · \log_5(x)
    is_correct: true
  - text: (\log_5(x))^3
    is_correct: false
  - text: \log_5(3x)
    is_correct: false
  - text: x^3 \log(5)
    is_correct: false
  explanation: 'La correcta es: 3 · \log_5(x). El exponente 3 pasa a multiplicar adelante.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $\log(a) = 0{,}5$, calcula $\log(a^6)$.
  choices:
  - text: '3'
    is_correct: true
  - text: 0,5^6
    is_correct: false
  - text: 6,5
    is_correct: false
  - text: '30'
    is_correct: false
  explanation: 'La correcta es: 3. $\log(a^6) = 6 \cdot \log(a) = 6 \cdot 0{,}5 =
    3$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $n$ dentro del argumento del logaritmo.'
- 'Paso 2: Mover el exponente a la posición de coeficiente multiplicador frontal.'
- 'Paso 3: Evaluar el logaritmo base y efectuar la multiplicación final.'
errores_correccion: No confundas $\log_b(x^n)$ con $(\log_b(x))^n$. En $\log_b(x^n)$
  solo el argumento está elevado a $n$; en $(\log_b(x))^n$ toda la función está elevada
  a $n$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_2(2^{10})$.
  alternativas:
  - '10'
  - '20'
  - '1024'
  respuesta: '10'
  solucion_pasos:
  - $10 \cdot \log_2(2) = 10 \cdot 1 = 10$.
errores_frecuentes:
- Confundir el exponente del argumento con elevar todo el logaritmo.
afirmaciones_verdaderas:
- $\log_b(x^n) = n \log_b(x)$.
al_terminar_debes_ponder: Bajar exponentes de argumentos aplicando la propiedad del
  logaritmo de una potencia.
fuente: Texto escolar MINEDUC.
estado: publicado
