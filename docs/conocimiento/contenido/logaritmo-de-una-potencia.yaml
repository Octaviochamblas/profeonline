semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA
resumen_inicial: 'El logaritmo de una potencia es igual al exponente multiplicado por el logaritmo de la base del argumento: $\log_b(x^k) = k \cdot \log_b(x)$ ($x > 0$).'
explicacion_simple: |
  Esta es una de las propiedades más poderosas de los logaritmos. Si dentro del argumento tienes una potencia (como $\log_2(8^5)$), no necesitas calcular $8^5$ (que da 32768). Simplemente "bajas" el exponente $5$ y lo pones a multiplicar por delante de todo el logaritmo: $5 \cdot \log_2(8) = 5 \cdot 3 = 15$. El exponente que estaba atrapado arriba pasa abajo multiplicando.
explicacion_formal: |
  ### Definición formal
  La **propiedad del logaritmo de una potencia** establece que para toda base real $b > 0, b \neq 1$, un argumento positivo $x \in \mathbb{R}^+$ y cualquier exponente real $k \in \mathbb{R}$:
  $$\log_b(x^k) = k \cdot \log_b(x)$$

  ### Demostración analítica
  Sea $u = \log_b(x)$. Por la definición exponencial:
  1. $x = b^u$.
  2. Elevando ambos miembros a la potencia $k$: $x^k = (b^u)^k = b^{k \cdot u}$.
  3. Aplicando la definición de logaritmo a la potencia resultante $x^k = b^{k \cdot u}$:
     $$\log_b(x^k) = k \cdot u$$
  4. Sustituyendo $u = \log_b(x)$: $\log_b(x^k) = k \cdot \log_b(x)$.

  ### Síntesis didáctica
  - Regla del sombrero: El exponente $k$ "baja" a multiplicar al coeficiente del logaritmo.
  - Ámbito de aplicación: Funciona para cualquier exponente $k$ real (entero, negativo o fraccionario).
definiciones_clave: |
  - **Logaritmo de una potencia**: Propiedad de simplificación que convierte exponentes sublogarítmicos en factores multiplicativos exteriores.
  - **Exponente factor multiplicativo**: Transformación del exponente $k$ en coeficiente constante que multiplica al operador $\log_b(x)$.
  - **Subida de coeficientes**: Propiedad inversa $k \cdot \log_b(x) = \log_b(x^k)$ que convierte coeficientes multiplicativos en exponentes del argumento.
propiedades_relaciones: |
  - **Herramienta principal en ecuaciones exponenciales**: Permite despejar incógnitas atrapadas en exponentes al tomar logaritmo a ambos lados ($\log(a^x) = x \cdot \log(a)$).
  - **Caso particular con exponente $k = 1$**: $\log_b(x^1) = 1 \cdot \log_b(x) = \log_b(x)$.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico exacto de la expresión $P = \log_3(9^7)$ aplicando la propiedad del logaritmo de una potencia.'
  pasos:
    - 'Paso 1: Identificamos el argumento $x = 9$ y el exponente sublogarítmico $k = 7$ en la expresión $\log_3(9^7)$.'
    - 'Paso 2: Aplicamos la propiedad bajando el exponente $7$ a multiplicar por delante del logaritmo: $P = 7 \cdot \log_3(9)$.'
    - 'Paso 3: Calculamos el logaritmo simple $\log_3(9)$ buscando el exponente $3^c = 9 \implies c = 2$.'
    - 'Paso 4: Multiplicamos el coeficiente por el resultado obtenido: $P = 7 \cdot 2 = 14$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se transforma el logaritmo de una potencia $\log_b(x^k)$ según las propiedades de los logaritmos?'
    choices:
      - {text: '$k \cdot \log_b(x)$, pasando el exponente $k$ a multiplicar por delante de la expresión', is_correct: true}
      - {text: '$\log_b(x) + k$, sumando el exponente al logaritmo', is_correct: false}
      - {text: '$\log_b(x)^k$, elevando todo el logaritmo a la potencia $k$', is_correct: false}
      - {text: '$\frac{\log_b(x)}{k}$, dividiendo el logaritmo por el exponente', is_correct: false}
    explanation: 'La alternativa correcta es ''$k \cdot \log_b(x)$, pasando el exponente $k$ a multiplicar por delante de la expresión''. El exponente interno baja como coeficiente multiplicativo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la expresión $\log_2(8^{10})$?'
    choices:
      - {text: '$30$, ya que $10 \cdot \log_2(8) = 10 \cdot 3 = 30$', is_correct: true}
      - {text: '$80$, multiplicando $8 \cdot 10$', is_correct: false}
      - {text: '$13$, sumando $10 + 3$', is_correct: false}
      - {text: '$3^{10}$, elevando 3 a la 10', is_correct: false}
    explanation: 'La alternativa correcta es ''$30$, ya que $10 \cdot \log_2(8) = 10 \cdot 3 = 30$''. Bajamos el 10 a multiplicar por $\log_2(8) = 3 \implies 10 \cdot 3 = 30$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente $k$ que afecta al argumento en $\log_b(x^k)$.'
  - 'Paso 2: Colocar el exponente $k$ multiplicando por fuera a la izquierda del símbolo $\log_b(x)$.'
  - 'Paso 3: Calcular el valor del logaritmo simplificado $\log_b(x)$.'
  - 'Paso 4: Multiplicar el coeficiente $k$ por el valor obtenido.'
errores_correccion: |
  - **Error 1:** Elevar todo el logaritmo a la potencia en lugar de multiplicar por ella (ej: confundir $\log_b(x^k)$ con $[\log_b(x)]^k$). **Cómo corregirlo:** La expresión $\log_b(x^k)$ sólo tiene el argumento elevado a $k$, por lo que se convierte en la **multiplicación** $k \cdot \log_b(x)$. La expresión $[\log_b(x)]^k$ representa la potencia del logaritmo completo y no se puede bajar el exponente.
  - **Error 2:** Sumar el exponente en lugar de multiplicarlo (ej: $\log_b(x^k) = k + \log_b(x)$). **Cómo corregirlo:** El exponente interno baja a **multiplicar** al logaritmo: $k \cdot \log_b(x)$.
ejemplos:
  - titulo: 'Cálculo con exponente entero'
    enunciado: '¿El valor de $\log_5(25^4)$ es igual a $8$?'
    alternativas:
      - 'Sí, pues $4 \cdot \log_5(25) = 4 \cdot 2 = 8$'
      - 'No, es igual a 100'
      - 'No, es igual a 16'
    respuesta: 'Sí, pues $4 \cdot \log_5(25) = 4 \cdot 2 = 8$'
    solucion_pasos:
      - '1. Bajamos el exponente 4: $4 \cdot \log_5(25)$.'
      - '2. Evaluamos $\log_5(25) = 2 \implies 4 \cdot 2 = 8$.'
  - titulo: 'Despeje de exponente desconocido'
    enunciado: 'Al tomar logaritmo a $\log(2^x)$, ¿se obtiene la expresión $x \cdot \log(2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la técnica clave para resolver ecuaciones exponenciales.'
  - titulo: 'Exponente negativo en argumento'
    enunciado: '¿La expresión $\log(x^{-3})$ equivale a $-3 \cdot \log(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El exponente negativo $-3$ baja a multiplicar: $-3 \log(x)$.'
  - titulo: 'Subida de coeficiente a exponente'
    enunciado: '¿La expresión $3 \cdot \log_2(5)$ se puede reescribir como $\log_2(5^3) = \log_2(125)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Aplicando la propiedad en sentido inverso.'
errores_frecuentes:
  - 'La expresión $\log_b(x^k)$ es idéntica a la potencia completa del logaritmo $[\log_b(x)]^k$.'
  - 'Al bajar el exponente $k$ de un logaritmo, este pasa sumando al operador logarítmico.'
  - 'Multiplicar la base del logaritmo por el exponente $k$ al simplificar.'
  - 'Bajar exponentes que afectan a toda la expresión logarítmica y no sólo al argumento.'
  - 'Elevar el resultado del logaritmo al exponente $k$ en lugar de multiplicar.'
afirmaciones_verdaderas:
  - 'El logaritmo de una potencia es igual al exponente multiplicado por el logaritmo de la base del argumento: $\log_b(x^k) = k \cdot \log_b(x)$.'
  - 'La propiedad del logaritmo de una potencia es el mecanismo algebraico fundamental para despejar incógnitas que se encuentran en el exponente de ecuaciones exponenciales.'
al_terminar_debes_poder: 'Aplicar la propiedad del logaritmo de una potencia para bajar o subir exponentes como factores multiplicativos.'
