resumen_inicial: 'El logaritmo de una potencia $\log_b(x^k)$ es igual al exponente
  $k$ multiplicado por el logaritmo de la base del argumento: $k \cdot \log_b(x)$
  ($x > 0$).'
explicacion_simple: Cuando dentro de un logaritmo hay una potencia, el exponente de
  esa potencia puede 'bajar' a multiplicarse al frente de todo el logaritmo.
explicacion_formal: 'Para todo $x > 0$, $k \in \mathbb{R}$ y base $b > 0, b \neq 1$,
  el **Logaritmo de una Potencia** satisface la identidad:


  $$\log_b\left(x^k\right) = k \cdot \log_b(x)$$


  **Demostración:**

  Sea $u = \log_b(x) \implies b^u = x$.

  Elevando a la potencia $k$: $(b^u)^k = x^k \implies b^{k \cdot u} = x^k$.

  Aplicando logaritmo: $\log_b(x^k) = k \cdot u = k \cdot \log_b(x)$.


  > **Complemento didáctico:** Esta propiedad es la herramienta fundamental para despejar
  variables ubicadas en exponentes.'
definiciones_clave: '- **Logaritmo de una potencia**: Identidad $\log_b(x^k) = k \cdot
  \log_b(x)$ que traslada exponentes a coeficientes multiplicativos.'
propiedades_relaciones: '- **Bajada del exponente**: El exponente $k$ pasa a multiplicar
  por fuera del operador.'
ejemplo_guiado:
  enunciado: Calcule el valor de $\log_2(8^4)$ aplicando la propiedad de la potencia.
  pasos:
  - 'Paso 1: Aplicar la propiedad bajando el exponente $4$: $4 \cdot \log_2(8)$.'
  - 'Paso 2: Evaluar el logaritmo interno: $\log_2(8) = 3$.'
  - 'Paso 3: Multiplicar los valores: $4 \cdot 3 = 12$.'
  - 'Conclusión: $\log_2(8^4) = \log_2(4096) = 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con el exponente k al calcular el logaritmo de una potencia
    log_b(x^k)?
  choices:
  - text: Baja a multiplicar al frente del logaritmo (k · log_b(x))
    is_correct: true
  - text: Se eleva al cuadrado
    is_correct: false
  - text: Se resta a la base
    is_correct: false
  - text: Se convierte en dividendo
    is_correct: false
  explanation: La alternativa correcta es 'Baja a multiplicar al frente del logaritmo
    (k · log_b(x))'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para log_2(8^4), ¿cuál fue el resultado final?
  choices:
  - text: 12 (porque 4 · 3 = 12)
    is_correct: true
  - text: '32'
    is_correct: false
  - text: '7'
    is_correct: false
  - text: '64'
    is_correct: false
  explanation: La alternativa correcta es '12 (porque 4 · 3 = 12)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar logaritmos de potencias
  $\log_b(x^k) = k \cdot \log_b(x)$, trasladando exponentes a factores multiplicativos.
semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA
procedimiento:
- 'Paso 1: Identificar la propiedad logarítmica correspondiente a la estructura del
  argumento o las bases.'
- 'Paso 2: Aplicar la ley algebraica transformando el logaritmo según la regla.'
- 'Paso 3: Evaluar y reducir numéricamente la expresión simplificada.'
errores_correccion: '- **Error 1: Confundir el logaritmo de una suma con la suma de
  logaritmos (escribir $\log(x+y) = \log(x) + \log(y)$).** **Cómo corregirlo:** El
  logaritmo NO es distributivo sobre la suma; la suma de logaritmos proviene del PRODUCTO
  ($\log(x \cdot y) = \log(x) + \log(y)$).


  - **Error 2: Confundir el cociente de logaritmos con el logaritmo del cociente.**
  **Cómo corregirlo:** $\log\left(\frac{x}{y}\right) = \log(x) - \log(y)$, mientras
  $\frac{\log(x)}{\log(y)}$ es la fórmula de cambio de base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de aplicación de MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de validez formal.
  alternativas:
  - Cumple la propiedad
  - No cumple
  - Indeterminado
  respuesta: Cumple la propiedad
  solucion_pasos:
  - Demostración de equivalencia en R.
- titulo: ¿Es distributivo el logaritmo respecto a la adición?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(x+y) \neq \log(x) + \log(y)$.
- titulo: ¿Conserva el resultado la igualdad matemática original?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las propiedades de los logaritmos.
errores_frecuentes:
- Distribuir el logaritmo sobre los términos de una suma escribiendo $\log_b(x+y)
  = \log_b(x) + \log_b(y)$.
- Multiplicar los logaritmos individuales al calcular el logaritmo de un producto.
- Dividir los logaritmos individuales al calcular el logaritmo de un cociente.
- La expresión $\log(x^2)$ equivale numéricamente a elevar al cuadrado todo el logaritmo
  $(\log(x))^2$.
- Restar las bases al aplicar el cambio de base en un logaritmo.
afirmaciones_verdaderas:
- Las propiedades de los logaritmos transforman productos en sumas, cocientes en restas
  y potencias en multiplicaciones.
- 'El logaritmo de un producto es la suma de los logaritmos de sus factores: $\log_b(x
  \cdot y) = \log_b(x) + \log_b(y)$ ($x,y>0$).'
