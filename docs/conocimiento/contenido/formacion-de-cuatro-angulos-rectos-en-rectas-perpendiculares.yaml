semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.RECTAS_PERPENDICULARES_ANGULOS_RECTOS
resumen_inicial: Si dos rectas son perpendiculares, los cuatro ángulos que se forman
  en su punto de intersección son ángulos rectos de exactamente 90° cada uno.
explicacion_simple: '![Cuatro Ángulos Rectos en Perpendiculares](/static/img/nodos/formacion-de-cuatro-angulos-rectos-en-rectas-perpendiculares-intro.svg)


  Cuando dos rectas perpendiculares se cruzan, no forman un solo ángulo recto: forman
  cuatro ángulos rectos iguales. Es como una cruz que divide el espacio en cuatro
  esquinas exactamente iguales de 90° cada una.'
explicacion_formal: '### Teorema formal

  Si dos rectas $L_1$ y $L_2$ son perpendiculares en su punto de intersección $O$,
  entonces los cuatro ángulos determinados alrededor del punto $O$ son todos rectos
  ($90^\circ$):


  $$L_1 \perp L_2 \implies \alpha_1 = \alpha_2 = \alpha_3 = \alpha_4 = 90^\circ$$


  $$\sum_{i=1}^4 \alpha_i = 4 \times 90^\circ = 360^\circ$$


  ### Desglose simbólico y geométrico

  - $\alpha_1 = 90^\circ$ (por hipótesis de perpendicularidad).

  - $\alpha_2 = 180^\circ - 90^\circ = 90^\circ$ (por par lineal suplementario).

  - $\alpha_3 = \alpha_1 = 90^\circ$ y $\alpha_4 = \alpha_2 = 90^\circ$ (por ángulos
  opuestos por el vértice).


  ### Síntesis didáctica

  Una única condición de ángulo recto en una intersección de rectas garantiza automáticamente
  la formación de 4 cuadrantes ortogonales idénticos en el plano.'
definiciones_clave: '- **Cuadrantes ortogonales**: Las cuatro regiones angulares de
  $90^\circ$ en que queda dividido el plano.

  - **Suma total perigonal**: La suma de los cuatro ángulos es $4 \times 90^\circ
  = 360^\circ$. '
propiedades_relaciones: '- **Congruencia cuádruple**: Todos los ángulos formados son
  congruentes entre sí.

  - **Simetría axial cuádruple**: Las rectas actúan como ejes de simetría perpendicular
  mutua. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cuatro Ángulos Rectos](/static/img/nodos/formacion-de-cuatro-angulos-rectos-en-rectas-perpendiculares-ejemplos.svg)


    Dos rectas $L_1$ y $L_2$ son perpendiculares y se cruzan en el punto $O$. Demuestra
    por qué el ángulo adyacente a uno de los ángulos de $90^\circ$ también mide obligatoriamente
    $90^\circ$.'
  pasos:
  - 'Paso 1: Identificar que dos ángulos contiguos sobre una línea recta forman un
    par lineal.'
  - 'Paso 2: Aplicar la propiedad del par lineal: la suma de ambos ángulos debe ser
    $180^\circ$.'
  - 'Paso 3: Plantear la resta: $\text{Ángulo adyacente} = 180^\circ - 90^\circ$.'
  - 'Paso 4: Obtener el resultado: $180^\circ - 90^\circ = 90^\circ$.'
  - 'Paso 5: Concluir que el ángulo adyacente es obligatoriamente recto.'
