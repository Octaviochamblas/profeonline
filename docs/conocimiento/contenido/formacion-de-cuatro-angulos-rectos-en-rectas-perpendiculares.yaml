semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.RECTAS_PERPENDICULARES_ANGULOS_RECTOS
resumen_inicial: El ángulo recto de 90° define la perpendicularidad entre líneas,
  siendo la piedra angular de los sistemas rectangulares, la arquitectura y el Teorema
  de Pitágoras.
explicacion_simple: Mira la esquina del marco de una puerta o la esquina de una hoja
  de papel. Esa esquina perfecta en forma de 'L' es un ángulo recto y mide exactamente
  90°.
explicacion_formal: Un ángulo $\theta$ se clasifica como **recto** si su medida es
  exactamente $\theta = 90^\circ$. Sus lados son dos rayos perpendiculares ($\vec{OA}
  \perp \vec{OB}$). Gráficamente se denota con un pequeño cuadrado en el vértice.
definiciones_clave: '- **Formación de cuatro ángulos rectos en rectas perpendiculares**:
  Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en formación de cuatro ángulos rectos en rectas perpendiculares se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Las líneas del centro de una cancha de fútbol se cruzan de forma perpendicular.
    Demuestra algebraicamente que los 4 ángulos formados alrededor del cruce miden
    $90^\circ$ cada uno.
  pasos:
  - 'Paso 1: Por definición de perpendicularidad, al menos un ángulo mide $90^\circ$.'
  - 'Paso 2: Usar ángulos suplementarios sobre cada línea recta para deducir que los
    ángulos adyacentes miden $180^\circ - 90^\circ = 90^\circ$.'
  - 'Paso 3: Concluir que los 4 ángulos son rectos de $90^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de formación de cuatro ángulos
    rectos en rectas perpendiculares?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al cruzarse dos líneas perpendiculares en el centro de la cancha, ¿cuál
    es la medida de los 4 ángulos formados?
  choices:
  - text: 90° cada uno
    is_correct: true
  - text: 45° cada uno
    is_correct: false
  - text: 180° en total entre los 4
    is_correct: false
  - text: 60° cada uno
    is_correct: false
  explanation: La alternativa correcta es '90° cada uno', pues la perpendicularidad
    define cuatro ángulos rectos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en formación de cuatro ángulos rectos en rectas
  perpendiculares.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en formación de cuatro
  ángulos rectos en rectas perpendiculares sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 86^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 94°
  - 86°
  - 90°
  respuesta: 94°
  solucion_pasos:
  - Despejando $x = 180 - 86 = 94^\circ$.
- titulo: Ejemplo 2
  enunciado: En formación de cuatro ángulos rectos en rectas perpendiculares, si dos
    ángulos son suplementarios y uno mide 86°, ¿cuánto mide el otro?
  alternativas:
  - 94°
  - 84°
  - 360°
  respuesta: 94°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 86 = 94^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en formación de
    cuatro ángulos rectos en rectas perpendiculares?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en formación de cuatro ángulos rectos
    en rectas perpendiculares es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de formación de cuatro ángulos rectos en rectas
  perpendiculares.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
