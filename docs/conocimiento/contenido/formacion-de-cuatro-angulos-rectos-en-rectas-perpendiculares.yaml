procedimiento:
- 'Paso 1: Identificar que las dos rectas son perpendiculares ($L_1 \perp L_2$).'
- 'Paso 2: Concluir que los cuatro ángulos generados miden $90^\circ$.'
- 'Paso 3: Aplicar este valor para resolver problemas y calcular sumas angulares.'
errores_correccion: Recuerda que si un ángulo en el cruce de dos rectas mide 90°,
  automáticamente los otros tres también miden 90°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $L_1 \perp L_2$, ¿cuánto mide la suma de dos ángulos adyacentes en
    su cruce?
  alternativas:
  - $180^\circ$
  - $90^\circ$
  - $360^\circ$
  respuesta: $180^\circ$
  solucion_pasos:
  - Dos ángulos rectos adyacentes suman $90^\circ + 90^\circ = 180^\circ$.
- titulo: Ejemplo 2
  enunciado: Si uno de los ángulos formados por el cruce de dos rectas mide 90°, ¿qué
    se puede afirmar de los otros tres ángulos?
  alternativas:
  - Los otros tres también miden 90°
  - Los otros tres miden 45°
  - Depende de la orientación
  respuesta: Los otros tres también miden 90°
  solucion_pasos:
  - Por suplementariedad y opuestos por el vértice, todos miden obligatoriamente $90^\circ$.
- titulo: ¿Las rectas perpendiculares dividen el plano en 4 ángulos congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, los cuatro ángulos son congruentes y miden 90° cada uno.
- titulo: ¿Puede un cruce de rectas tener un solo ángulo recto y los demás no rectos?
  respuesta: 'No'
  solucion_pasos:
  - No, si uno mide 90°, por par lineal sus adyacentes miden 180° - 90° = 90°, forzando
    a los cuatro a ser rectos.
errores_frecuentes:
- Creer que solo el ángulo marcado con el cuadrado mide $90^\circ$ y los otros son
  variables.
- Confundir con rectas secantes oblicuas que forman dos pares de ángulos distintos.
- Olvidar que la suma total alrededor del vértice de cruce es $360^\circ$.
- No aplicar la propiedad de suplementos para justificar por qué los adyacentes son
  rectos.
- Asumir que la perpendicularidad no se cumple si las rectas están inclinadas.
afirmaciones_verdaderas:
- Al cortarse dos rectas perpendiculares, los cuatro ángulos resultantes son rectos.
- La suma de los cuatro ángulos formados es exactamente $360^\circ$.
al_terminar_debes_poder: '**QUÉ:** Demostrar y aplicar el teorema de formación de
  cuatro ángulos rectos por rectas perpendiculares.


  **CÓMO:** Comprobando la igualdad $\angle 1 = \angle 2 = \angle 3 = \angle 4 = 90^\circ$
  mediante pares lineales y ángulos opuestos por el vértice.


  ![Resumen de Cuatro Ángulos Rectos](/static/img/nodos/formacion-de-cuatro-angulos-rectos-en-rectas-perpendiculares-resumen.svg)'
