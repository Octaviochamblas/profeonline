procedimiento:
- 'Paso 1: Identifica la medida del ángulo en radianes.'
- 'Paso 2: Multiplica por $\dfrac{180}{\pi}$, cancelando el símbolo $\pi$ si aparece
  en la expresión.'
- 'Paso 3: Simplifica el resultado numérico final.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en conversión de radianes
  a grados sexagesimales.
ejemplos:
- titulo: Conversión de un ángulo notable
  enunciado: Convierte $\dfrac{\pi}{3}$ radianes a grados.
  solucion_pasos:
  - 'Se multiplica: $\dfrac{\pi}{3}\cdot\dfrac{180}{\pi}$.'
  - 'Se simplifica: $60°$.'
- titulo: Conversión de un ángulo mayor a $\pi$
  enunciado: Convierte $\dfrac{5\pi}{3}$ radianes a grados.
  solucion_pasos:
  - 'Se multiplica: $\dfrac{5\pi}{3}\cdot\dfrac{180}{\pi}$.'
  - 'Se simplifica: $300°$.'
- titulo: ¿$\pi$ radianes equivale a $180°$?
  enunciado: ¿La conversión de $\pi$ radianes a grados da como resultado $180°$?
  respuesta: Sí
  solucion_pasos:
  - $\pi\cdot\dfrac{180}{\pi}=180$.
- titulo: ¿Se cancela siempre el símbolo $\pi$ al convertir de radianes a grados?
  enunciado: ¿El símbolo $\pi$ se cancela siempre al convertir correctamente de radianes
    a grados?
  respuesta: Sí
  solucion_pasos:
  - Como la conversión multiplica por $180/\pi$, el $\pi$ del radián se cancela con
    el del denominador.
errores_frecuentes:
- Multiplicar por $\pi/180$ en vez de $180/\pi$, invirtiendo la fórmula.
- Dejar el símbolo $\pi$ en el resultado final, cuando debería cancelarse.
- Confundir esta conversión con la de grados a radianes.
- Cometer errores aritméticos al simplificar la fracción resultante.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  conversión de radianes a grados sexagesimales.
