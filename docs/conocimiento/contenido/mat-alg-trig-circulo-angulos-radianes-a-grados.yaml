semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.RADIANES_A_GRADOS
resumen_inicial: 'Conversión de medidas angulares de radianes a grados sexagesimales mediante el factor de conversión $\frac{180^\circ}{\pi \text{ rad}}$.'
explicacion_simple: |
  Cuando tienes una expresión matemática medida en radianes (usualmente escrita con el símbolo $\pi$, como $\frac{\pi}{3}$ o $\frac{5\pi}{6}$) y quieres saber cuántos grados sexagesimales del transportador representa, debes hacer la operación inversa a la conversión de grados. La regla rápida y directa consiste en reemplazar el símbolo $\pi$ por el número $180^\circ$ y realizar las divisiones numéricas indicadas, o bien multiplicar todo el valor por el factor $\frac{180^\circ}{\pi}$.
explicacion_formal: |
  ### Definición formal
  La **transformación de radianes a grados sexagesimales** es la conversión recíproca de unidades angulares definida por la igualdad fundamental $\pi \text{ rad} = 180^\circ$:
  $$\theta_{\text{deg}} = \theta_{\text{rad}} \cdot \left(\frac{180^\circ}{\pi \text{ rad}}\right)$$

  ### Desglose simbólico
  - $\theta_{\text{rad}}$: Medida del ángulo en radianes.
  - $\theta_{\text{deg}}$: Medida del ángulo expresada en grados sexagesimales ($^\circ$).
  - $\frac{180^\circ}{\pi}$: Factor recíproco de conversión que cancela la constante $\pi$ del numerador y devuelve un número en grados.

  ### Síntesis didáctica
  Multiplicar por el factor $\frac{180^\circ}{\pi}$ simplifica la constante $\pi$ que acompaña a la fracción y escala el resultado al sistema sexagesimal de $360^\circ$. Facilita visualizar la apertura geométrica concreta en un círculo convencional.
definiciones_clave: |
  - **Factor recíproco de conversión**: Fracción unitaria $\frac{180^\circ}{\pi \text{ rad}}$ que convierte radianes en grados.
  - **Sustitución directa de $\pi$**: Método simplificado mediante el cual se reemplaza la constante $\pi$ por el número $180^\circ$ en expresiones fraccionarias.
  - **Equivalencia sexagesimal**: Valor en grados obtenido tras realizar la simplificación aritmética de los radianes.
propiedades_relaciones: |
  - **Conversiones recíprocas notables**:
    - $\frac{\pi}{6} \text{ rad} \to \frac{180^\circ}{6} = 30^\circ$
    - $\frac{\pi}{4} \text{ rad} \to \frac{180^\circ}{4} = 45^\circ$
    - $\frac{\pi}{3} \text{ rad} \to \frac{180^\circ}{3} = 60^\circ$
    - $\frac{\pi}{2} \text{ rad} \to \frac{180^\circ}{2} = 90^\circ$
ejemplo_guiado:
  enunciado: 'Convierte el ángulo $\theta = \frac{5\pi}{4} \text{ rad}$ a grados sexagesimales.'
  pasos:
    - 'Paso 1: Aplicar la sustitución directa reemplazando la constante $\pi$ por $180^\circ$: $\theta = \frac{5 \cdot 180^\circ}{4}$.'
    - 'Paso 2: Dividir la constante $180^\circ$ por el denominador $4$: $\frac{180^\circ}{4} = 45^\circ$.'
    - 'Paso 3: Multiplicar por el numerador $5$: $5 \cdot 45^\circ = 225^\circ$.'
    - 'Paso 4: Escribir la respuesta: $\frac{5\pi}{4} \text{ rad} = 225^\circ$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el factor de conversión para transformar un ángulo de radianes a grados sexagesimales?'
    choices:
      - {text: '$\frac{180^\circ}{\pi}$', is_correct: true}
      - {text: '$\frac{\pi}{180^\circ}$', is_correct: false}
      - {text: '$\frac{360^\circ}{2}$', is_correct: false}
      - {text: '$\frac{\pi}{360^\circ}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{180^\circ}{\pi}$''. Cancela la constante $\pi$ y entrega el resultado expresado en grados.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A cuántos grados sexagesimales equivale el ángulo de $\frac{2\pi}{3} \text{ rad}$?'
    choices:
      - {text: '$120^\circ$', is_correct: true}
      - {text: '$60^\circ$', is_correct: false}
      - {text: '$150^\circ$', is_correct: false}
      - {text: '$240^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es ''$120^\circ$''. Calculando: $\frac{2 \cdot 180^\circ}{3} = \frac{360^\circ}{3} = 120^\circ$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar la expresión angular dada en radianes $\theta_{\text{rad}}$.'
  - 'Paso 2: Reemplazar el símbolo $\pi$ por el número $180^\circ$ (o multiplicar por $\frac{180^\circ}{\pi}$).'
  - 'Paso 3: Dividir $180^\circ$ entre el denominador de la fracción.'
  - 'Paso 4: Multiplicar el resultado obtenido por el número entero del numerador para hallar los grados finales.'
errores_correccion: |
  - **Error 1:** Multiplicar por el factor equivocado $\frac{\pi}{180^\circ}$ al pasar de radianes a grados. **Cómo corregirlo:** Para eliminar $\pi$ del numerador, el símbolo $\pi$ debe ir obligatoriamente en el denominador del factor de conversión ($\frac{180^\circ}{\pi}$).
  - **Error 2:** Conservar el símbolo $\pi$ en la respuesta expresada en grados sexagesimales. **Cómo corregirlo:** En grados sexagesimales la unidad es el símbolo de grado ($^\circ$) y la constante $\pi$ queda totalmente simplificada.
ejemplos:
  - titulo: 'Conversión de pi tercios'
    enunciado: '¿A cuántos grados equivale el ángulo $\frac{\pi}{3} \text{ rad}$?'
    alternativas:
      - '$60^\circ$'
      - '$30^\circ$'
      - '$45^\circ$'
    respuesta: '$60^\circ$'
    solucion_pasos:
      - '1. Sustituimos $\pi = 180^\circ$.'
      - '2. $\frac{180^\circ}{3} = 60^\circ$.'
  - titulo: 'Conversión de tres pi medios'
    enunciado: '¿Cuántos grados sexagesimales representa el ángulo $\frac{3\pi}{2} \text{ rad}$?'
    alternativas:
      - '$270^\circ$'
      - '$180^\circ$'
      - '$300^\circ$'
    respuesta: '$270^\circ$'
    solucion_pasos:
      - '1. Sustituimos: $\frac{3 \cdot 180^\circ}{2}$.'
      - '2. $3 \cdot 90^\circ = 270^\circ$.'
  - titulo: 'Conversión de pi radianes'
    enunciado: '¿El ángulo de $\pi \text{ rad}$ equivale a $180^\circ$ sexagesimales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por definición fundamental: $\pi \text{ rad} = 180^\circ$.'
  - titulo: 'Conversión de 1 radián aproximado'
    enunciado: '¿Un ángulo de $1 \text{ rad}$ sin el símbolo $\pi$ equivale aproximadamente a $57.3^\circ$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\frac{180^\circ}{\pi} \approx \frac{180}{3.14159} \approx 57.2958^\circ$.'
errores_frecuentes:
  - 'La afirmación de que la conversión de radianes a grados sexagesimales se realiza aplicando la fracción $\frac{\pi}{180^\circ}$.'
  - 'La afirmación de que el ángulo $\frac{\pi}{6} \text{ rad}$ equivale a $60^\circ$ sexagesimales.'
  - 'La afirmación de que una respuesta en grados sexagesimales debe llevar escrito el símbolo $\pi$.'
  - 'La afirmación de que un ángulo de $2\pi \text{ rad}$ equivale a $180^\circ$.'
  - 'La afirmación de que la conversión de radianes a grados altera el cuadrante en que se ubica el ángulo.'
afirmaciones_verdaderas:
  - 'Para convertir un ángulo expresado en radianes a grados sexagesimales se multiplica la medida por el factor $\frac{180^\circ}{\pi \text{ rad}}$.'
  - 'La sustitución de la constante $\pi$ por $180^\circ$ permite calcular de manera directa el valor en grados de cualquier fracción de $\pi$.'
al_terminar_debes_poder: |
  QUÉ: Convertir medidas de ángulos desde radianes a grados sexagesimales.
  CÓMO: Reemplazar $\pi$ por $180^\circ$ o multiplicar por el factor recíproco $\frac{180^\circ}{\pi}$ y resolver las operaciones aritméticas.
