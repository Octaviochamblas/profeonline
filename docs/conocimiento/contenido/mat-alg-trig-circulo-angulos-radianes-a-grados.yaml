semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.RADIANES_A_GRADOS
resumen_inicial: 'Conversión de radianes a grados sexagesimales: círculo unitario,
  amplitud, período y transformaciones de Círculo unitario y sistemas de medida.'
explicacion_simple: Así como se puede pasar de grados a radianes, también es posible
  hacer el camino inverso usando la fórmula recíproca.
explicacion_formal: '### Definición formal


  Dado que $2\pi$ radianes $=360°$, se cumple $1$ radián $=\dfrac{360}{2\pi}=\dfrac{180}{\pi}$
  grados. Por lo tanto, para convertir un ángulo de $r$ radianes a grados, se calcula
  $r\cdot\dfrac{180}{\pi}$.


  ### Desarrollo didáctico


  Para convertir $\dfrac{\pi}{6}$ radianes a grados: $\dfrac{\pi}{6}\cdot\dfrac{180}{\pi}=\dfrac{180}{6}=30°$.
  Para convertir $\dfrac{3\pi}{4}$: $\dfrac{3\pi}{4}\cdot\dfrac{180}{\pi}=\dfrac{3\cdot180}{4}=135°$.'
definiciones_clave: '- **Conversión de radianes a grados sexagesimales**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a conversión de radianes a grados sexagesimales.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    conversión de radianes a grados sexagesimales.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de conversión de radianes a grados sexagesimales.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
