semantic_id: MAT.ALG.ECUACION_BASE.CONCEPTO_RAIZ
resumen_inicial: 'La raíz de una ecuación es equivalente a su solución: representa el valor numérico de la incógnita que anula la forma canónica polinomial.'
explicacion_simple: |
  En álgebra, el término **raíz** de una ecuación se utiliza convencionalmente como sinónimo de solución.

  Específicamente, si se transponen todos los términos al primer miembro dejando cero en el segundo miembro ($ax + b = 0$), la raíz es el valor de $x$ que hace que el polinomio valga exactamente cero.

  Por lo tanto, encontrar la raíz de una ecuación lineal es equivalente a determinar el valor numérico que resuelve la igualdad.
explicacion_formal: |
  ### Definición formal
  Dada la forma canónica reducida de una ecuación polinomial $P(x) = 0$, un número $r \in \mathbb{R}$ es una **raíz del polinomio / ecuación** si y solo si:

  $$P(r) = 0$$

  ### Desglose de la fórmula
  - $r$: Valor constante denominado raíz o cero del polinomio $P(x)$.
  - $P(r) = 0$: Condición de anulación por la cual la función polinomial evaluada en $r$ resulta ser cero.

  ### Síntesis didáctica
  En el contexto de ecuaciones lineales de primer grado, el término "raíz" y "solución" se emplean indistintamente para designar al valor numérico que anula la expresión.
definiciones_clave: |
  - **Raíz de una ecuación**: Valor numérico de la variable que anula el polinomio del primer miembro en la forma canónica $P(x) = 0$.
  - **Cero de un polinomio**: Valor del dominio que produce una evaluación numéricamente igual a cero.
propiedades_relaciones: |
  - **Sinonimia terminológica**: Decir "la raíz de la ecuación es 5" equivale rigurosamente a "la solución de la ecuación es 5".
  - **Teorema fundamental**: Todo polinomio de grado 1 posee exactamente una raíz real en el cuerpo $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Halla la raíz de la ecuación $2x - 10 = 0$ evaluando su forma reducida y confirma para qué valor de $x$ el polinomio se anula.'
  pasos:
    - 'Paso 1: Identificar la forma canónica $P(x) = 2x - 10 = 0$.'
    - 'Paso 2: Igualar a cero para despejar $x$: $2x = 10 \implies x = 5$.'
    - 'Paso 3: Sustituir la raíz candidata $r = 5$ en el polinomio: $P(5) = 2(5) - 10 = 10 - 10 = 0$.'
    - 'Paso 4: Concluir que la raíz de la ecuación es $r = 5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué relación matemática existe entre el concepto de ''raíz'' de una ecuación $P(x) = 0$ y su ''solución''?'
    choices:
      - {text: 'Son conceptos equivalentes: la raíz es el valor numérico que anula a $P(x)$.', is_correct: true}
      - {text: 'La raíz representa siempre la raíz cuadrada de la solución.', is_correct: false}
      - {text: 'La raíz se aplica únicamente a números irracionales.', is_correct: false}
      - {text: 'Son valores numéricos de signos opuestos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Son conceptos equivalentes: la raíz es el valor numérico que anula a $P(x)$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la ecuación $2x - 10 = 0$, ¿cuál es la raíz $r$ que anula la expresión?'
    choices:
      - {text: '$r = 5$', is_correct: true}
      - {text: '$r = -5$', is_correct: false}
      - {text: '$r = 10$', is_correct: false}
      - {text: '$r = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$r = 5$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Expresar la ecuación en su forma canónica reducida $P(x) = 0$.'
  - 'Paso 2: Despejar la variable $x$ determinando el valor numérico $r$.'
  - 'Paso 3: Sustituir $r$ en $P(x)$ y calcular la evaluación $P(r)$.'
  - 'Paso 4: Verificar que el resultado de la evaluación sea exactamente igual a $0$.'
errores_correccion: |
  - **Error 1:** Considerar que el término "raíz" exige aplicar la operación de radicación ($\sqrt{x}$). **Cómo corregirlo:** En álgebra de ecuaciones, **LA RAÍZ CORRESPONDE AL VALOR SOLUCIÓN QUE ANULA LA EXPRESIÓN, NO A LA OPERACIÓN RADICAL**.
  - **Error 2:** Confundir la raíz de un polinomio con su término independiente $b$. **Cómo corregirlo:** El término independiente $b$ es una constante, **MIENTRAS QUE LA RAÍZ ES EL VALOR DESPEJADO $x = -b/a$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la raíz del polinomio $3x + 12 = 0$?'
    alternativas:
      - '$r = -4$'
      - '$r = 4$'
      - '$r = -12$'
    respuesta: '$r = -4$'
    solucion_pasos:
      - '1. Igualar: $3x = -12$.'
      - '2. Despejar: $x = \frac{-12}{3} = -4$.'
      - '3. Verificar: $3(-4) + 12 = -12 + 12 = 0 \implies r = -4$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Si la raíz de una ecuación lineal es $r = 2$, ¿cuál de las siguientes ecuaciones es la adecuada?'
    alternativas:
      - '$5x - 10 = 0$'
      - '$5x + 10 = 0$'
      - '$x + 2 = 0$'
    respuesta: '$5x - 10 = 0$'
    solucion_pasos:
      - '1. Evaluar $x = 2$ en $5x - 10$: $5(2) - 10 = 0$.'
      - '2. Por lo tanto, $r = 2$ es su raíz.'
  - titulo: 'Cero de la función'
    enunciado: '¿La raíz de la ecuación $P(x) = 0$ coincide con la intersección con el eje $x$ de su gráfica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el eje $x$ el valor de la función se anula ($y = 0$).'
  - titulo: 'Ecuación idénticamente nula'
    enunciado: '¿La constante $0 = 0$ posee una única raíz finita?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la identidad $0 = 0$ se anula para todo número real.'
errores_frecuentes:
  - 'La raíz de una ecuación lineal $2x - 10 = 0$ exige aplicar la operación de radicación cuadrada $\sqrt{10}$.'
  - 'En la forma canónica $ax + b = 0$, la raíz del polinomio coincide con la constante independiente $b$.'
  - 'Al despejar la raíz de $3x + 12 = 0$, el signo del término $+12$ se mantiene constante produciendo $r = 4$.'
  - 'Un número real negativo como $r = -4$ no puede constituir una raíz válida de una ecuación de primer grado.'
  - 'Una ecuación lineal de primer grado $ax + b = 0$ con $a \neq 0$ posee dos raíces reales distintas.'
afirmaciones_verdaderas:
  - 'La raíz de una ecuación $P(x) = 0$ es el valor de la variable que anula la expresión polinomial.'
  - 'Toda ecuación lineal de primer grado no trivial posee exactamente una raíz en $\mathbb{R}$.'
al_terminar_debes_poder: |
  QUÉ: Definir e identificar la raíz de una ecuación de primer grado.
  CÓMO: Expresar la ecuación en su forma canónica $P(x) = 0$, despejar la variable $x$ y verificar que la evaluación anule el polinomio.
