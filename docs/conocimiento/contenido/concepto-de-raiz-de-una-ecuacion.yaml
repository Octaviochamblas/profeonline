procedimiento:
- 'Paso 1: Cuando leas ''Encuentra la raíz'', tradúcelo en tu mente a ''Encuentra
  la solución''.'
- 'Paso 2: Resuelve la ecuación despejando la incógnita.'
- 'Paso 3: El valor numérico final obtenido es la raíz.'
- Raíz y solución son sinónimos en este contexto.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en concepto de raíz de una ecuación.
ejemplos:
- titulo: 'Pregunta de examen: ¿Cuál es la raíz de $4x = 20$'
  enunciado: 'Pregunta de examen: ¿Cuál es la raíz de $4x = 20$?'
  solucion_pasos:
  - 'Traducimos: ¿Cuál es la solución de $4x = 20$?'
  - 'Despejamos: El 4 pasa dividiendo, $x = 20/4$.'
  - $x = 5$.
  - La raíz es 5.
- titulo: ¿Cuántas raíces máximo puede tener una ecuación de grado 1 (lineal)?
  solucion_pasos:
  - Las ecuaciones lineales (x elevada a 1) solo tienen una solución o raíz.
- titulo: 'Respecto de «Concepto de raíz de una ecuación»: ¿Describe adecuadamente
    el concepto esta fra'
  enunciado: 'Respecto de «Concepto de raíz de una ecuación»: ¿Describe adecuadamente
    el concepto esta frase? «En el contexto de ecuaciones, la palabra ''raíz'' es
    un sinónimo directo de ''solución''»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En el contexto de ecuaciones,
    la palabra ''raíz'' es un sinónimo directo de ''solución''.'
- titulo: 'Respecto de «Concepto de raíz de una ecuación»: ¿Se puede aceptar esta
    afirmación? «Extraer'
  enunciado: 'Respecto de «Concepto de raíz de una ecuación»: ¿Se puede aceptar esta
    afirmación? «Extraer raíz cuadrada a los términos de la ecuación pensando que
    a eso se refiere la instrucción ''halla la raíz''»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En el contexto de ecuaciones,
    la palabra ''raíz'' es un sinónimo directo de ''solución''.'
errores_frecuentes:
- Extraer raíz cuadrada a los términos de la ecuación pensando que a eso se refiere
  la instrucción 'halla la raíz'.
- El exponente de la incógnita.
- La operación de raíz cuadrada.
- El coeficiente que acompaña a la 'x'.
- Para «Encuentra la raíz de la ecuación $x + 8 = 15$.», la respuesta correcta es
  $23$.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando concepto
  de raíz de una ecuación.
