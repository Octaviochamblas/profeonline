semantic_id: MAT.ALG.ECUACION_BASE.CONCEPTO_RAIZ
resumen_inicial: 'Concepto de raíz de una ecuación: propiedades, resolución y modelamiento
  en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: En álgebra, las palabras importan. Si un ejercicio de examen te
  pide 'Encuentra las raíces de la ecuación', no te lances a calcular raíces cuadradas.
  Te están pidiendo otra cosa.
explicacion_formal: '### Definición formal


  El valor numérico (solución) que hace verdadera la igualdad.


  ### Desarrollo didáctico


  Históricamente, los matemáticos se referían al número de origen que generaba el
  equilibrio de la ecuación como la ''raíz'' del problema (de ahí crecía el árbol
  de la ecuación).


  - Ecuación de primer grado (lineal): Ej. $2x - 6 = 0$. Tiene **una sola raíz** ($x=3$).

  - Ecuación de segundo grado (cuadrática): Ej. $x^2 - 9 = 0$. Puede tener **dos raíces**
  (soluciones). En este caso, $x=3$ y $x=-3$.

  - Ecuación de tercer grado (cúbica): Puede tener hasta **tres raíces**.


  Por lo tanto, la cantidad máxima de ''raíces'' o soluciones que tiene un polinomio
  depende de su grado mayor (Teorema Fundamental del Álgebra). Cuando te pidan raíces,
  solo despeja la ''x''.'
definiciones_clave: '- **Concepto de raíz de una ecuación**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a concepto de raíz de una ecuación.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando concepto de raíz
    de una ecuación.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de concepto de raíz de
    una ecuación.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
