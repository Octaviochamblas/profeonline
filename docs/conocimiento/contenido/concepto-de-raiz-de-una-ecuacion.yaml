semantic_id: MAT.ALG.ECUACION_BASE.CONCEPTO_RAIZ
resumen_inicial: 'La raíz de una ecuación es equivalente a su solución: el valor numérico
  que anula la forma canónica de la ecuación.'
explicacion_simple: 'En álgebra, el término **raíz** de una ecuación se utiliza como
  un sinónimo de solución.

  Específicamente, si pasamos todos los términos al primer miembro dejando un cero
  al lado derecho ($a x + b = 0$), la raíz es el número que hace que el polinomio
  valga cero.'
explicacion_formal: 'Dada la forma canónica reducida $P(x) = 0$, el número $r \in
  \mathbb{R}$ es una **raíz del polinomio / ecuación** si y solo si:


  $$P(r) = 0$$


  **Desglose de la fórmula:**

  - $r$: Raíz o cero del polinomio $P(x)$.

  - $P(r) = 0$: Condición por la cual la evaluación polinomial se anula.'
definiciones_clave: '- **Raíz de una ecuación**: Valor numérico de la variable que
  anula el polinomio del primer miembro en la forma canónica $P(x) = 0$.

  - **Cero de una función/polinomio**: Punto donde la expresión toma el valor cero.'
propiedades_relaciones: '- **Equivalencia de términos**: Decir ''la raíz de la ecuación
  es 3'' equivale exactamente a decir ''la solución de la ecuación es 3''.'
ejemplo_guiado:
  enunciado: Halla la raíz de la ecuación $2x - 10 = 0$ evaluando su forma reducida
    y confirma para qué valor de $x$ el polinomio se anula.
  pasos:
  - 'Paso 1: Escribir la forma canónica $P(x) = 2x - 10 = 0$.Paso 2: Igualar a cero
    para encontrar $x$: $2x = 10 \implies x = 5$.Paso 3: Sustituir la raíz candidate
    $r = 5$ en el polinomio: $P(5) = 2(5) - 10 = 10 - 10 = 0$.Paso 4: Concluir que
    la raíz de la ecuación es $r = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación existe entre la 'raíz' de una ecuación $P(x) = 0$ y su 'solución'?
  choices:
  - text: 'Son conceptos equivalentes: la raíz es el valor que anula $P(x)$.'
    is_correct: true
  - text: La raíz es siempre la raíz cuadrada de la solución.
    is_correct: false
  - text: La raíz solo aplica si la solución es un número irracional.
    is_correct: false
  - text: Son conceptos opuestos de signo inverso.
    is_correct: false
  explanation: 'La alternativa correcta es ''Son conceptos equivalentes: la raíz es
    el valor que anula $P(x)$.''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la ecuación $2x - 10 = 0$, ¿cuál es la raíz $r$ que anula la expresión?
  choices:
  - text: $r = 5$
    is_correct: true
  - text: $r = -5$
    is_correct: false
  - text: $r = 10$
    is_correct: false
  - text: $r = 2$
    is_correct: false
  explanation: La alternativa correcta es '$r = 5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar la ecuación en su forma reducida $P(x) = 0$.'
- 'Paso 2: Encontrar el valor $x = r$ que hace cero al polinomio $P(x)$.'
- 'Paso 3: Evaluar $P(r)$ y verificar que el resultado sea exactamente $0$.'
errores_correccion: '- **Error común:** Pensar que hallar la raíz exige calcular una
  raíz cuadrada $\sqrt{x}$.

  - **Cómo corregirlo:** En álgebra, ''raíz'' significa el VALOR SOLUCIÓN de una ecuación
  polinómica, no una operación de radicación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
