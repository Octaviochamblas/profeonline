semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.BARICENTRO_INTERSECCION
resumen_inicial: El baricentro ($G$), también llamado centroide o centro de gravedad,
  es el punto notable donde se intersectan las tres transversales de gravedad de un
  triángulo. En cualquier triángulo, el baricentro siempre se ubica estrictamente
  en el interior.
explicacion_simple: '![Baricentro de un Triángulo](/static/img/nodos/definicion-de-baricentro-como-punto-de-interseccion-de-las-transversales-de-gravedad-intro.svg)


  Si trazas las tres transversales de gravedad de un triángulo:


  - **Se cruzan en un solo punto**: Las tres líneas coinciden exactamente en el **baricentro**
  ($G$).

  - **Siempre queda adentro**: Da igual si el triángulo es agudo, recto o muy abierto
  (obtuso), el punto $G$ **siempre está en el interior**.

  - **Promedio de las tres esquinas**: Si sumas las coordenadas de los 3 vértices
  y divides entre 3, obtienes la posición exacta de $G$.

  '
explicacion_formal: '### Definición formal y teorema de concurrencia

  En todo triángulo $\Delta ABC$, las tres transversales de gravedad concurren en
  un único punto $G$, denominado **baricentro** (o centroide):


  $$\{G\} = t_a \cap t_b \cap t_c \iff G = \frac{A + B + C}{3}$$


  ### Desglose simbólico y geométrico

  - $G$: Baricentro del triángulo.

  - Promedio aritmético de vértices: En geometría analítica, sus coordenadas cartesianas
  son el promedio exacto: $(x_G, y_G) = \left(\frac{x_A+x_B+x_C}{3}, \frac{y_A+y_B+y_C}{3}\right)$.

  - Siempre interior: $G$ reside estrictamente en el interior del triángulo para todo
  tipo de triángulos.


  ### Síntesis didáctica

  El baricentro es el centroide isostático del triángulo, determinado algebraicamente
  como la media de las coordenadas de sus tres vértices.'
definiciones_clave: '- **Baricentro (Centroide, $G$)**: Punto de concurrencia de las
  tres transversales de gravedad.

  - **Centro de gravedad geométrico**: Punto promedio de la superficie de una figura
  homogénea.

  - **Concurrencia de medianas**: Teorema euclidiano demostrado formalmente mediante
  el Teorema de Ceva.

  '
propiedades_relaciones: '- **Concurrencia**: $t_a \cap t_b \cap t_c = \{G\}$.

  - **Interioridad universal**: $G \in \text{Int}(\Delta ABC)$ en todo triángulo acutángulo,
  rectángulo y obtusángulo.

  - **Fórmula de coordenadas**: $x_G = \frac{x_A + x_B + x_C}{3}$, $y_G = \frac{y_A
  + y_B + y_C}{3}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Baricentro](/static/img/nodos/definicion-de-baricentro-como-punto-de-interseccion-de-las-transversales-de-gravedad-ejemplos.svg)


    Los vértices de un triángulo en el plano cartesiano son $A(1, 6)$, $B(2, 1)$ y
    $C(6, 2)$. Calcula las coordenadas $(x_G, y_G)$ de su baricentro $G$.

    '
  pasos:
  - 'Paso 1: Aplicar la fórmula de coordenadas del baricentro: $x_G = \frac{x_A +
    x_B + x_C}{3}$ y $y_G = \frac{y_A + y_B + y_C}{3}$.'
  - 'Paso 2: Calcular la coordenada $x$: $x_G = \frac{1 + 2 + 6}{3} = \frac{9}{3}
    = 3$.'
  - 'Paso 3: Calcular la coordenada $y$: $y_G = \frac{6 + 1 + 2}{3} = \frac{9}{3}
    = 3$.'
  - 'Paso 4: Concluir que el baricentro se ubica exactamente en el punto $G(3, 3)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica el baricentro en un triángulo obtusángulo?
  choices:
  - text: Siempre en el interior del triángulo
    is_correct: true
  - text: En el exterior del triángulo
    is_correct: false
  - text: En el vértice del ángulo obtuso
    is_correct: false
  - text: En el punto medio del lado mayor
    is_correct: false
  explanation: El baricentro se ubica siempre en el interior del triángulo, sin importar
    la medida de sus ángulos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los vértices de un triángulo son A(0, 0), B(6, 0) y C(0, 9), ¿cuáles
    son las coordenadas de su baricentro?
  choices:
  - text: $(2, 3)$
    is_correct: true
  - text: $(3, 4.5)$
    is_correct: false
  - text: $(6, 9)$
    is_correct: false
  - text: $(3, 3)$
    is_correct: false
  explanation: Las coordenadas son $(2, 3)$, ya que $x_G = \frac{0+6+0}{3} = 2$ y
    $y_G = \frac{0+0+9}{3} = 3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los tres vértices $A, B, C$ del triángulo.'
- 'Paso 2: Trazar las transversales de gravedad desde al menos dos vértices hasta
  los puntos medios opuestos.'
- 'Paso 3: Marcar el punto de cruce como el baricentro $G$.'
- 'Paso 4: En geometría analítica, calcular $G = \frac{A + B + C}{3}$.'
errores_correccion: No confundas el baricentro (transversales) con el ortocentro (alturas)
  ni con el circuncentro (simetrales).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántas transversales de gravedad es necesario trazar como mínimo para
    ubicar el baricentro?
  alternativas:
  - $2\text{ transversales}$
  - $3\text{ transversales}$
  - $1\text{ transversal}$
  respuesta: $2\text{ transversales}$
  solucion_pasos:
  - Dos transversales se cortan en un punto único, por el cual pasará obligatoriamente
    la tercera.
- titulo: Ejemplo 2
  enunciado: Si los vértices son $(3, 2), (5, 8), (4, 5)$, ¿cuál es la suma de las
    coordenadas $x_G + y_G$ del baricentro?
  alternativas:
  - $9$
  - $12$
  - $6$
  respuesta: $9$
  solucion_pasos:
  - '$x_G = \frac{3+5+4}{3} = 4$, $y_G = \frac{2+8+5}{3} = 5$. Suma: $4 + 5 = 9$.'
- titulo: ¿El baricentro de un triángulo puede quedar ubicado en el exterior de la
    figura?
  respuesta: 'No'
  solucion_pasos:
  - No, el baricentro siempre es estrictamente interior en todo tipo de triángulos.
- titulo: ¿El baricentro es el punto donde se intersectan las tres transversales de
    gravedad?
  respuesta: Sí
  solucion_pasos:
  - Sí, esa es la definición geométrica fundamental del baricentro.
errores_frecuentes:
- Creer que en triángulos obtusángulos el baricentro queda en el exterior.
- Confundir las transversales de gravedad con las alturas o bisectrices.
- Dividir entre 2 al calcular el promedio de coordenadas (se debe dividir entre 3).
- Pensar que el baricentro equidista de los tres lados.
- Confundir la letra $G$ (baricentro) con $H$ (ortocentro) u $O$ (circuncentro).
afirmaciones_verdaderas:
- El baricentro es el punto de concurrencia de las tres transversales de gravedad
  de un triángulo.
- En todo triángulo el baricentro se ubica estrictamente en la región interior.
al_terminar_debes_poder: '**QUÉ:** Definir, identificar y calcular las coordenadas
  del baricentro de un triángulo.


  **CÓMO:** Determinando el punto de corte de las transversales de gravedad y aplicando
  la fórmula de coordenadas $G = \frac{A+B+C}{3}$.


  ![Resumen de Baricentro](/static/img/nodos/definicion-de-baricentro-como-punto-de-interseccion-de-las-transversales-de-gravedad-resumen.svg)

  '
