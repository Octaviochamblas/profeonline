semantic_id: MAT.ALG.INECUACIONES_LINEALES.MULTIPLICACION_NEGATIVA_DESPEJE
resumen_inicial: 'Cambio de sentido al multiplicar por negativo durante el despeje:
  relaciones de orden, intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: En el trabajo con inecuaciones, una de las diferencias más importantes
  respecto a las ecuaciones es el comportamiento ante operaciones con números negativos,
  lo que garantiza la conservación de las relaciones de orden.
explicacion_formal: '### Definición formal

  Dada una inecuación de la forma $a x < b$, si $a < 0$, al dividir ambos miembros
  por $a$ (lo que equivale a multiplicar por $1/a$, siendo $1/a < 0$), la relación
  de orden se invierte, resultando en $x > b/a$. En general, si $x < y$ y $c < 0$,
  entonces $x \\cdot c > y \\cdot c$.


  ### Desarrollo didáctico

  Las inecuaciones representan balanzas en desequilibrio. Cuando aplicamos una operación
  que preserva el orden, el desequilibrio se mantiene en la misma dirección. Sin embargo,
  los números negativos invierten la posición relativa de los números en la recta
  numérica. Por ello, una desigualdad verdadera como $2 < 5$ se transforma en $-2
  > -5$ al multiplicar por $-1$. Este principio se extiende al despejar variables:
  si tenemos un coeficiente negativo multiplicando a la incógnita, debemos revertir
  la dirección de la desigualdad al pasarlo dividiendo (o multiplicando) para encontrar
  el intervalo solución correcto.'
definiciones_clave: '- **Cambio de sentido al multiplicar por negativo durante el
  despeje**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a cambio de sentido al multiplicar por
  negativo durante el despeje.'
ejemplo_guiado:
