semantic_id: MAT.ALG.INECUACIONES_LINEALES.MULTIPLICACION_NEGATIVA_DESPEJE
resumen_inicial: Multiplicar o dividir una inecuación por un coeficiente negativo
  invierte inmediatamente el sentido del operador de orden.
explicacion_simple: 'Si en el último paso del despeje de una inecuación nos queda
  un número negativo acompañando a la $x$ (como en $-5x < 20$), al pasar ese $-5$
  a dividir **DEBEMOS DAR VUELTA EL SÍMBOLO**.

  El símbolo $<$ se convierte en $>$ y la respuesta correcta es $x > \frac{20}{-5}
  \implies x > -4$.'
explicacion_formal: 'Dada la inecuación lineal con coeficiente principal negativo
  $-a x \ R \ b$ con $a > 0$, la **regla de inversión por coeficiente negativo** establece:


  $$-a x < b \iff x > \frac{b}{-a} \quad \land \quad -a x \ge b \iff x \le \frac{b}{-a}$$


  **Desglose de la fórmula:**

  - Inversión simultánea del operador de orden al trasponer el factor escalar negativo
  $-a$ como divisor.'
definiciones_clave: '- **Inversión de operador por despeje negativo**: Transformación
  obligatoria del operador de orden al trasponer factores o divisores negativos.'
propiedades_relaciones: '- **Reflejo en el origen**: Preserva la equivalencia lógica
  del conjunto solución en la recta real.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación $-3x + 4 \le 19$ invirtiendo el sentido del operador
    en el momento adecuado.
  pasos:
  - 'Paso 1: Trasponer $+4$ restando: $-3x \le 19 - 4 \implies -3x \le 15$.Paso 2:
    Trasponer el coeficiente $-3$ dividiendo e INVERTIR el símbolo $\le$ a $\ge$:
    $x \ge \frac{15}{-3}$.Paso 3: Calcular la división: $x \ge -5$.Paso 4: Escribir
    el conjunto solución: $S = [-5, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $-3x \le 15$, ¿cuál es la solución correcta al invertir el
    sentido?
  choices:
  - text: $x \ge -5$
    is_correct: true
  - text: $x \le -5$
    is_correct: false
  - text: $x \ge 5$
    is_correct: false
  - text: $x \le 5$
    is_correct: false
  explanation: La alternativa correcta es '$x \ge -5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al expresar $x \ge -5$ en notación de intervalo, ¿cuál es el intervalo
    correcto?
  choices:
  - text: $[-5, +\infty[$
    is_correct: true
  - text: $]-5, +\infty[$
    is_correct: false
  - text: $]-\infty, -5]$
    is_correct: false
  - text: $[-5, 5]$
    is_correct: false
  explanation: La alternativa correcta es '$[-5, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trasponer las constantes al segundo miembro.'
- 'Paso 2: Identificar que el coeficiente de $x$ es negativo.'
- 'Paso 3: Pasar el coeficiente negativo a dividir al segundo miembro.'
- 'Paso 4: Dar vuelta la dirección del símbolo de desigualdad.'
errores_correccion: '- **Error común:** Cambiar el signo del número en el divisor
  y olvidar voltear el símbolo de la inecuación.

  - **Cómo corregirlo:** La regla exige DOS cosas: pasar el número negativo a dividir
  Y voltear la flecha del símbolo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Olvidar invertir el sentido del símbolo de desigualdad al dividir o multiplicar
  por un coeficiente negativo.
- Confundir la solución de una inecuación con una solución puntual única propia de
  una ecuación.
- Multiplicar por el m.c.m. los términos fraccionarios pero omitir los términos enteros
  independientes.
- Poner corchete cerrado en las cotas infinitas $+\infty$ ó $-\infty$.
- Confundir una inecuación sin solución ($S = \emptyset$) con una que tiene solución
  real total ($S = \mathbb{R}$).
afirmaciones_verdaderas:
- Una inecuación lineal de primer grado es una desigualdad algebraica cuya solución
  se expresa comúnmente como un intervalo real.
- Si las variables se cancelan por completo y resulta una constante numérica verdadera,
  el conjunto solución abarca a todos los números reales ($S = \mathbb{R}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver analíticamente
  cualquier inecuación lineal, expresando su conjunto solución en notación de intervalo
  y gráfica.
