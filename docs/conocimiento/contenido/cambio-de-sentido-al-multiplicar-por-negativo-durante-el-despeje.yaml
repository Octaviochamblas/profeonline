  - Aplicar las propiedades algebraicas de cambio de sentido al multiplicar por negativo
    durante el despeje, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
