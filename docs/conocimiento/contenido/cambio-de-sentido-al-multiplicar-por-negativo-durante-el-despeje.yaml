procedimiento:
- Aislar el término que contiene la variable en uno de los lados de la inecuación
  usando sumas o restas.
- Identificar el coeficiente que multiplica a la variable.
- Si el coeficiente es negativo, multiplicar o dividir ambos lados por dicho coeficiente
  e invertir inmediatamente el sentido del signo de desigualdad.
- Simplificar el resultado y expresar la solución en forma de intervalo o conjunto,
  según sea requerido.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en cambio de sentido al multiplicar
  por negativo durante el despeje.
ejemplos:
- titulo: Despeje con coeficiente negativo simple
  enunciado: Resuelve la inecuación $-3x < 12$.
  solucion_pasos:
  - Dividimos ambos lados por $-3$.
  - Como $-3$ es negativo, invertimos el signo de menor que a mayor que.
  - Obtenemos $x > -4$.
- titulo: Inecuación con términos compuestos
  enunciado: Encuentra el conjunto solución para $5 - 2x \\geq 11$.
  solucion_pasos:
  - Restamos $5$ en ambos lados - $-2x \\geq 6$.
  - Dividimos entre $-2$ y simultáneamente invertimos el signo de desigualdad.
  - La solución final es $x \\leq -3$.
- titulo: ¿Se mantiene la desigualdad?
  respuesta: Falso
  solucion_pasos:
  - '{"Observamos la proposición": "Si $-x < 4$, entonces $x < -4$."}'
  - Al multiplicar por $-1$, debemos invertir el signo de desigualdad.
  - El resultado correcto es $x > -4$.
- titulo: ¿Es correcto el sentido de la desigualdad?
  respuesta: Verdadero
  solucion_pasos:
  - '{"Evaluamos": "Si $-5x \\\\geq -15$, entonces $x \\\\leq 3$."}'
  - Al dividir ambos lados entre $-5$ (número negativo), el signo $\\geq$ debe cambiar
    a $\\leq$.
  - Operando se obtiene $x \\leq 3$, por lo que el proceso es correcto.
errores_frecuentes:
- Pasar dividiendo un número negativo sin cambiar el sentido de la desigualdad.
- Invertir la desigualdad al restar un número negativo en ambos lados.
- Cambiar el signo de la desigualdad cuando se divide por un número positivo si el
  otro lado es negativo.
- Creer que el signo de desigualdad se invierte solo al trabajar con fracciones negativas.
- Olvidar el signo negativo al realizar la división y además no invertir la desigualdad.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  cambio de sentido al multiplicar por negativo durante el despeje.
