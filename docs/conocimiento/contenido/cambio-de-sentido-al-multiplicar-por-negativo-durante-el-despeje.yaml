semantic_id: MAT.ALG.INECUACIONES_LINEALES.MULTIPLICACION_NEGATIVA_DESPEJE
resumen_inicial: Multiplicar o dividir una inecuación por un coeficiente negativo invierte inmediatamente el sentido del operador de orden.
explicacion_simple: |
  Si en el último paso del despeje de una inecuación nos queda un número negativo acompañando a la $x$ (como en $-5x < 20$), al pasar ese $-5$ a dividir **DEBEMOS DAR VUELTA EL SÍMBOLO**.

  El símbolo $<$ se convierte en $>$ y la respuesta correcta es $x > \frac{20}{-5} \implies x > -4$.
explicacion_formal: |
  Dada la inecuación lineal con coeficiente principal negativo $-a x \ R \ b$ con $a > 0$, la **regla de inversión por coeficiente negativo** establece:

  $$-a x < b \iff x > \frac{b}{-a} \quad \land \quad -a x \ge b \iff x \le \frac{b}{-a}$$

  **Desglose de la fórmula:**
  - Inversión simultánea del operador de orden al trasponer el factor escalar negativo $-a$ como divisor.
definiciones_clave: |
  - **Inversión de operador por despeje negativo**: Transformación obligatoria del operador de orden al trasponer factores o divisores negativos.
propiedades_relaciones: |
  - **Reflejo en el origen**: Preserva la equivalencia lógica del conjunto solución en la recta real.
ejemplo_guiado:
  enunciado: Resuelve la inecuación $-3x + 4 \le 19$ invirtiendo el sentido del operador en el momento adecuado.
  pasos:
    - 'Paso 1: Trasponer $+4$ restando: $-3x \le 19 - 4 \implies -3x \le 15$.'
    - 'Paso 2: Trasponer el coeficiente $-3$ dividiendo e INVERTIR el símbolo $\le$ a $\ge$: $x \ge \frac{15}{-3}$.'
    - 'Paso 3: Calcular la división: $x \ge -5$.'
    - 'Paso 4: Escribir el conjunto solución: $S = [-5, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: Al despejar $-3x \le 15$, ¿cuál es la solución correcta al invertir el sentido?
    choices:
      - {text: '$x \ge -5$', is_correct: true}
      - {text: '$x \le -5$', is_correct: false}
      - {text: '$x \ge 5$', is_correct: false}
      - {text: '$x \le 5$', is_correct: false}
    explanation: La alternativa correcta es '$x \ge -5$'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: Al expresar $x \ge -5$ en notación de intervalo, ¿cuál es el intervalo correcto?
    choices:
      - {text: '$[-5, +\infty[$', is_correct: true}
      - {text: '$]-5, +\infty[$', is_correct: false}
      - {text: '$]-\infty, -5]$', is_correct: false}
      - {text: '$[-5, 5]$', is_correct: false}
    explanation: La alternativa correcta es '$[-5, +\infty[$'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Trasponer las constantes al segundo miembro.'
  - 'Paso 2: Identificar que el coeficiente de $x$ es negativo.'
  - 'Paso 3: Pasar el coeficiente negativo a dividir al segundo miembro.'
  - 'Paso 4: Dar vuelta la dirección del símbolo de desigualdad.'
errores_correccion: |
  - **Error común:** Cambiar el signo del número en el divisor y olvidar voltear el símbolo de la inecuación.
  - **Cómo corregirlo:** La regla exige DOS cosas: pasar el número negativo a dividir Y voltear la flecha del símbolo.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de inecuaciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de inecuaciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Al despejar la inecuación $-3x < 12$ dividiendo por $-3$, el operador de orden se mantiene produciendo la solución $x < -4$.'
  - 'Multiplicar ambos lados de $-x \ge 5$ por $-1$ genera como resultado directo $x \ge -5$.'
  - 'La regla de cambio de sentido del operador aplica al restar una constante negativa como $-4$ a ambos miembros.'
  - 'Al dividir $-5x \le -20$ entre $-5$, la inecuación resultante se escribe como $x \le 4$.'
  - 'Invertir el símbolo de desigualdad al dividir por un coeficiente negativo invalida la verificación numérica en $\mathbb{R}$.'
afirmaciones_verdaderas:
  - 'Dividir o multiplicar ambos miembros de una inecuación lineal por una cantidad negativa exige invertir el sentido del símbolo de desigualdad.'
  - 'Las operaciones aditivas de suma y resta no alteran el sentido del operador de orden sin importar el signo de las constantes.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la regla de cambio de sentido al multiplicar o dividir por coeficientes negativos durante el despeje de inecuaciones.
  CÓMO: Identificar escalares negativos que multiplican o dividen a la incógnita, invertir el símbolo de orden ($< \leftrightarrow >$, $\le \leftrightarrow \ge$) y determinar el conjunto solución.
fuente: 'Texto escolar MINEDUC — Álgebra / Inecuaciones Lineales'
estado: publicado
