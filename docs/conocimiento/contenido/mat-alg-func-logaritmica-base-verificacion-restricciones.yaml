semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.VERIFICACION_RESTRICCIONES
resumen_inicial: 'Verificación de restricciones de dominio en soluciones logarítmicas:
  conceptos, asíntotas, propiedades e inversidad en Análisis de la función logarítmica.'
explicacion_simple: Resolver la ecuación es solo la mitad del trabajo. Antes de dar
  por válida una solución, hay que confirmar que el argumento del logaritmo original
  quede positivo.
explicacion_formal: '### Definición formal


  Si $x_0$ es una solución obtenida al resolver $\log_b(g(x))=c$, entonces $x_0$ es
  una solución válida solo si $g(x_0)>0$. Cuando $g(x_0)\leq0$, la expresión $\log_b(g(x_0))$
  no está definida y $x_0$ debe descartarse del conjunto solución.


  ### Desarrollo didáctico


  Al resolver $\log_2(x-3)=2$ se obtiene $x-3=2^2=4$, es decir $x=7$. Se verifica
  reemplazando: $x-3=7-3=4>0$, por lo que la solución es válida. Si en cambio se hubiese
  obtenido un valor que hiciera $x-3\leq0$, esa solución debería descartarse aunque
  el despeje algebraico fuera correcto.'
definiciones_clave: '- **Verificación de restricciones de dominio en soluciones logarítmicas**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a verificación de restricciones de dominio en soluciones logarítmicas.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de verificación
    de restricciones de dominio en soluciones logarítmicas.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de verificación de restricciones
    de dominio en soluciones logarítmicas.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    verificación de restricciones de dominio en soluciones logarítmicas?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en verificación de restricciones de dominio en soluciones logarítmicas?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resuelve la ecuación logarítmica aplicando la definición o las propiedades
  correspondientes.'
- 'Paso 2: Reemplaza cada solución obtenida en el argumento del logaritmo original.'
- 'Paso 3: Descarta toda solución que haga el argumento menor o igual a $0$.'
- 'Paso 4: Declara como conjunto solución únicamente los valores que superan la verificación.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en verificación
  de restricciones de dominio en soluciones logarítmicas.
ejemplos:
- titulo: Verificación de una solución válida
  enunciado: Verifica si $x=7$ es solución válida de $\log_2(x-3)=2$.
  solucion_pasos:
  - Se reemplaza en el argumento: $x-3=7-3=4$.
  - Como $4>0$, la solución $x=7$ es válida.
- titulo: Descarte de una solución inválida
  enunciado: Al resolver $\log_3(x-5)=1$ se obtiene algebraicamente $x=8$; ¿qué ocurre
    si en otra ecuación similar el despeje diera $x=4$ para el mismo argumento $x-5$?
  solucion_pasos:
  - Se reemplaza en el argumento: $x-5=4-5=-1$.
  - Como $-1\leq0$, esa solución debería descartarse por no cumplir el dominio del
    logaritmo.
- titulo: ¿Puede una ecuación logarítmica tener soluciones que se deben descartar?
  enunciado: ¿Es posible que el despeje algebraico de una ecuación logarítmica entregue
    una solución que deba rechazarse?
  respuesta: Sí
  solucion_pasos:
  - Si la solución hace el argumento del logaritmo menor o igual a $0$, no es válida
    y debe descartarse.
- titulo: ¿Basta con resolver la ecuación algebraicamente sin más pasos?
  enunciado: ¿Es suficiente despejar la incógnita para garantizar que la solución
    sea correcta?
  respuesta: 'No'
  solucion_pasos:
  - Siempre debe verificarse que el argumento del logaritmo original quede positivo
    con esa solución.
errores_frecuentes:
- Aceptar como válida cualquier solución del despeje algebraico sin comprobar el dominio.
- Verificar el signo de la incógnita en vez del signo del argumento completo del logaritmo.
- Olvidar que un argumento igual a $0$ también invalida la solución, no solo los negativos.
- No repetir la verificación cuando la ecuación tiene más de una solución candidata.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando verificación de restricciones de dominio en soluciones logarítmicas.
