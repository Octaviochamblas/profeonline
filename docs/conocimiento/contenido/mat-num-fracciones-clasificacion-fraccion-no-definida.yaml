semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_NO_DEFINIDA
resumen_inicial: "Una fracción no definida es aquella cuyo denominador es cero y su numerador es distinto de cero, careciendo de valor en los números reales."
explicacion_simple: |
  Imagina que tienes una torta y te dicen: 'divídela en 0 partes iguales'. ¿Tiene sentido esa instrucción? Ninguno. No puedes partir algo en 'cero pedazos'. Por eso, cuando en una fracción el número de abajo (el denominador) es 0 y el de arriba es distinto de 0 (como $\frac{5}{0}$), la matemática dice que la fracción **no está definida**. No es que valga cero, ni que valga infinito: simplemente la operación no existe.
explicacion_formal: |
  Formalmente, una expresión de la forma $\frac{a}{0}$ con $a \neq 0$ (donde $a \in \mathbb{R}$) se clasifica como una **fracción no definida** o división por cero no permitida.

  Supóngase por contradicción que $\frac{a}{0} = x$ para algún $x \in \mathbb{R}$. Por la definición fundamental de la división como operación inversa de la multiplicación, esta igualdad implicaría que:
  $$a = x \cdot 0$$
  Sin embargo, en la estructura de cuerpo de los números reales, el producto de cualquier número por cero es cero ($x \cdot 0 = 0$). Dado que se definió $a \neq 0$, se obtiene la contradicción insostenible $a = 0$. Por lo tanto, no existe ningún número real $x$ que satisfaga la igualdad, declarando a $\frac{a}{0}$ como **indefinida**.
definiciones_clave: |
  - **Fracción no definida**: Expresión $\frac{a}{0}$ con $a \neq 0$ que no posee solución dentro de los números reales.
  - **Imposibilidad de división por cero**: Principio estructural que excluye al $0$ como divisor en $\mathbb{R}$.
  - **Inexistencia de resultado**: Ausencia de elemento en el conjunto de los números reales que satisfaga $a = x \cdot 0$.
propiedades_relaciones: |
  - **Diferencia con $\frac{0}{b}$ ($b \neq 0$)**: Si el cero está en el numerador ($\frac{0}{b}$ con $b \neq 0$), la fracción es definida y vale exactamente $0$. Si el cero está en el denominador ($\frac{a}{0}$ con $a \neq 0$), la fracción es no definida.
  - **Diferencia con $\frac{0}{0}$**: La forma $\frac{0}{0}$ es una forma **indeterminada** (posee infinitas soluciones algebraicas), mientras que $\frac{a}{0}$ ($a \neq 0$) es **no definida** (posee cero soluciones algebraicas).
  - **Asíntota vertical**: En análisis de funciones reales $f(x) = \frac{g(x)}{h(x)}$, los valores $x$ donde $h(x) = 0$ y $g(x) \neq 0$ representan restricciones del dominio y generan asíntotas verticales.
ejemplo_guiado:
  enunciado: "Analiza las expresiones $A = \\frac{0}{8}$, $B = \\frac{8}{0}$ y $C = \\frac{8}{8}$. Clasifica cada una indicando su valor numérico o si no está definida."
  pasos:
    - 'Evaluar $A = \frac{0}{8}$: el denominador es $8 \neq 0$ y el numerador es $0$. Cero partes tomadas de $8$ resulta en el valor numérico $0$ (fracción aparente definida).'
    - 'Evaluar $B = \frac{8}{0}$: el denominador es $0$ y el numerador es $8 \neq 0$. La división por cero es imposible, por lo que $B$ es una **fracción no definida**.'
    - 'Evaluar $C = \frac{8}{8}$: el numerador y denominador son iguales y no nulos. Representa la unidad entera $1$ (fracción aparente definida).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué la prueba por contradicción demuestra que la expresión $\\frac{a}{0}$ (con $a \\neq 0$) no puede ser igual a ningún número real $x$?"
    choices:
      - {text: "Porque la ecuación $a = x \\cdot 0$ requeriría que $a = 0$, contradiciendo que $a \\neq 0$.", is_correct: true}
      - {text: 'Porque el producto $x \cdot 0$ siempre da como resultado $1$.', is_correct: false}
      - {text: "Porque en los números reales todo cociente debe dar como resultado un número negativo.", is_correct: false}
      - {text: "Porque el numerador $a$ debe ser obligatoriamente un número par.", is_correct: false}
    explanation: 'La correcta es Porque la ecuación $a = x \cdot 0$ requeriría que $a = 0$, contradiciendo que $a \neq 0$.: al ser $x \cdot 0 = 0$, es imposible obtener un valor $a \neq 0$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Dada la función $f(x) = \\frac{5}{x - 4}$, ¿para qué valor de $x$ la fracción queda no definida?"
    choices:
      - {text: "Para $x = 4$, porque invalida el denominador volviéndolo cero.", is_correct: true}
      - {text: 'Para $x = 0$, porque $5 \div -4$ no se puede calcular.', is_correct: false}
      - {text: "Para $x = -5$, porque iguala al numerador.", is_correct: false}
      - {text: "La función está definida para absolutamente todos los números reales.", is_correct: false}
    explanation: "La correcta es Para $x = 4$, porque invalida el denominador volviéndolo cero.: si $x = 4$, el denominador $x - 4 = 0$ y $f(4) = \\frac{5}{0}$ no está definida."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el denominador de la fracción dada."
  - "Paso 2: Verificar si el denominador es igual a $0$."
  - 'Paso 3: Comprobar que el numerador sea distinto de $0$ ($a \neq 0$).'
  - "Paso 4: Concluir que la expresión es una fracción no definida y declarar que no pertenece a los números reales."
errores_correccion: |
  Un error sumamente común es afirmar que $\frac{5}{0} = 0$ o que $\frac{5}{0} = 5$. Recuerda que dividir por cero es imposible en aritmética: no da cero ni el numerador, la expresión simplemente no está definida.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál de las siguientes expresiones representa una fracción no definida?"
    alternativas:
      - '\$\frac{12}{0}$'
      - '\$\frac{0}{12}$'
      - '\$\frac{12}{12}$'
    respuesta: '\$\frac{12}{0}$'
    solucion_pasos:
      - 'Analizamos $\frac{12}{0}$: tiene denominador 0 y numerador 12 nonulo.'
      - 'Por la imposibilidad de división por cero, $\frac{12}{0}$ no está definida.'
  - titulo: "Ejemplo 2"
    enunciado: "En un programa de cálculo se ingresa la fórmula $y = \\frac{10}{2 - k}$. ¿Qué ocurre cuando el usuario ingresa $k = 2$?"
    alternativas:
      - "El programa arroja un error de división por cero porque la expresión no está definida."
      - "El programa entrega el resultado 0."
      - "El programa entrega el resultado 10."
    respuesta: "El programa arroja un error de división por cero porque la expresión no está definida."
    solucion_pasos:
      - 'Sustituyendo $k = 2$: $2 - 2 = 0$, resultando $\frac{10}{0}$.'
      - "Dado que la división por cero no está definida en los reales, el sistema genera un error."
  - titulo: "¿Es diferente la expresión $\\frac{0}{9}$ de la expresión $\\frac{9}{0}$?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, $\frac{0}{9} = 0$ es un número real perfectamente definido, mientras que $\frac{9}{0}$ no está definida.'
  - titulo: "¿Se dice que una fracción no definida carece de resultado en los números reales?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, no existe ningún número real que al multiplicarse por cero dé como resultado el numerador no nulo."
errores_frecuentes:
  - 'Decir que $\frac{a}{0} = 0$ confundiendo la posición del cero entre numerador y denominador.'
  - 'Decir que $\frac{a}{0} = a$ asumiendo que el cero no altera al numerador.'
  - 'Confundir fracción no definida ($\frac{a}{0}$ con $a \neq 0$) con forma indeterminada ($\frac{0}{0}$).'
  - "Creer que la expresión no definida equivale al infinito como número real ordinario."
  - "Intentar simplificar o realizar operaciones algebraicas con términos cuyo denominador es cero."
afirmaciones_verdaderas:
  - 'Toda expresión de la forma $\frac{a}{0}$ con $a \neq 0$ no está definida dentro del conjunto de los números reales.'
  - 'Mientras que $\frac{0}{a} = 0$ (con $a \neq 0$) es una fracción definida, la expresión $\frac{a}{0}$ carece de resultado numérico.'
al_terminar_debes_ponder: |
  Debes ser capaz de identificar inmediatamente cuándo una fracción no está definida debido a un denominador cero ($a \neq 0, b = 0$), justificar la imposibilidad algebraica de la división por cero y restringir dominios algebraicos adecuadamente.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
