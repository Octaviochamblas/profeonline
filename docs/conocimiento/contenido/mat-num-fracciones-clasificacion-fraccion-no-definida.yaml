semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_NO_DEFINIDA
resumen_inicial: Una fracción de la forma $\frac{a}{0}$ con $a \neq 0$ es una expresión no definida pues la división por cero no existe.
explicacion_simple: 'Cualquier fracción que tenga un número distinto de cero en el numerador y un cero en el denominador es una expresión no definida. No representa ningún número racional ni real porque en matemáticas no es posible repartir una cantidad entre cero partes.


  ![Fracción no definida con denominador cero](/static/img/nodos/fraccion-no-definida-con-denominador-cero-intro.svg)'
explicacion_formal: 'Para todo $a \in \mathbb{Z} \setminus \{0\}$, la expresión $\frac{a}{0}$ es **Indefinida** en el cuerpo de los racionales:


  $$\nexists x \in \mathbb{Q} \quad \text{tal que } x \cdot 0 = a \quad (a \neq 0)$$


  **Desglose de la fórmula:**

  - $x \cdot 0 = 0 \neq a$: Demuestra por contradicción que ningún número multiplicado por 0 puede dar $a$.

  - Indefinición estructural: La división por cero carece de resultado en la aritmética ordinaria.


  > **Complemento didáctico:** No se debe confundir ''no definida'' con ''cero''. La expresión $\frac{5}{0}$ no es igual a 0, simplemente NO EXISTE.'
definiciones_clave: '- **Fracción no definida**: Expresión $\frac{a}{0}$ ($a \neq 0$) que carece de valor numérico.'
propiedades_relaciones: '- **Inexistencia de inverso**: El cero no posee inverso multiplicativo.'
ejemplo_guiado:
  enunciado: 'Explique por qué la expresión $\frac{7}{0}$ se clasifica como una fracción no definida en los números racionales.


    ![Ejemplo Fracción no definida con denominador cero](/static/img/nodos/fraccion-no-definida-con-denominador-cero-ejemplos.svg)'
  pasos:
  - 'Paso 1: Supongamos por contradicción que la fracción equivale a un número $x$, es decir, $\frac{7}{0} = x$.'
  - 'Paso 2: Al despejar la división como multiplicación tendríamos: $7 = x \cdot 0$.'
  - 'Paso 3: Analizar el producto: todo número multiplicado por $0$ da siempre $0$ ($x \cdot 0 = 0$).'
  - 'Paso 4: Llegamos a la contradicción absurda $7 = 0$.'
  - 'Conclusión: Ningún número $x$ satisface la ecuación, por ende $\frac{7}{0}$ es una fracción no definida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la expresión a/0 con a != 0 es una fracción no definida?
  choices:
  - text: Porque ningún número multiplicado por 0 da como resultado a
    is_correct: true
  - text: Porque el resultado siempre es igual a 100
    is_correct: false
  - text: Porque se convierte en un número primo
    is_correct: false
  - text: Porque da como resultado cero
    is_correct: false
  explanation: La alternativa correcta es 'Porque ningún número multiplicado por 0 da como resultado a'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7/0, ¿cuál fue la contradicción obtenida al suponer que daba x?
  choices:
  - text: Llegar a la afirmación falsa de que 7 = 0
    is_correct: true
  - text: Llegar a que 7 = 7
    is_correct: false
  - text: Que 7 fuera un número par
    is_correct: false
  - text: Ninguna contradicción
    is_correct: false
  explanation: La alternativa correcta es 'Llegar a la afirmación falsa de que 7 = 0'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar el denominador de la fracción dada.'
- 'Paso 2: Comprobar si el denominador equivale a cero y el numerador a un valor distinto de cero.'
- 'Paso 3: Declarar la fracción como no definida sin asignarle ningún valor numérico.'
errores_correccion: '- **Error 1: Escribir que $\frac{9}{0} = 0$.** **Cómo corregirlo:** $\frac{9}{0}$ NO es cero; no existe en los racionales.


  - **Error 2: Escribir que $\frac{9}{0} = 9$.** **Cómo corregirlo:** La división por cero es imposible, no devuelve el numerador.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué valor numérico le corresponde a $\frac{-15}{0}$?
  alternativas:
  - Ninguno (es una expresión no definida)
  - '0'
  - '-15'
  respuesta: Ninguno (es una expresión no definida)
  solucion_pasos:
  - El denominador cero no está definido en matemáticas.
- titulo: Ejemplo 2
  enunciado: ¿Es posible simplificar la expresión $\frac{4}{x-3}$ cuando $x = 3$?
  alternativas:
  - No, porque el denominador se hace cero y la fracción se indefine
  - Sí, da 4
  - Sí, da 0
  respuesta: No, porque el denominador se hace cero y la fracción se indefine
  solucion_pasos:
  - Si $x=3 \implies \frac{4}{0}$ que no existe.
- titulo: ¿Carece de valor numérico cualquier fracción de la forma a/0 con a != 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, la división por cero carece de sentido numérico.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación y propiedades de la fracción analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de clasificación fraccionaria determinan una solución unívoca.
  - texto: No es posible clasificar la fracción
    es_correcta: false
    retroalimentacion: Incorrecto, la comparación entre numerador y denominador permite clasificarla rigurosamente.
- titulo: ¿Es la fracción 5/0 igual a la fracción 0/5?
  respuesta: 'No'
  solucion_pasos:
  - No, $0/5 = 0$ (definida), mientras que $5/0$ es no definida.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación y propiedades de la fracción analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de clasificación fraccionaria determinan una solución unívoca.
  - texto: No es posible clasificar la fracción
    es_correcta: false
    retroalimentacion: Incorrecto, la comparación entre numerador y denominador permite clasificarla rigurosamente.
errores_frecuentes:
- Cualquier número entero dividido por cero entrega como resultado el entero cero.
- Dividir un número $a$ por cero devuelve como resultado el propio número $a$.
- Las expresiones de la forma $a/0$ son números racionales con valor infinito entero.
- La fracción $0/5$ y la fracción $5/0$ representan exactamente la misma cantidad.
- El número cero puede dividirse entre sí mismo produciendo el entero 10.
afirmaciones_verdaderas:
- Una fracción con numerador no nulo y denominador cero no está definida en los números racionales.
- La división por cero es una operación aritméticamente imposible porque no existe ningún número que multiplicado por cero dé un valor no nulo.
al_terminar_debes_poder: '**QUÉ:** Reconocer y fundamentar la imposibilidad matemática de la división por cero en expresiones fraccionarias.


  **CÓMO:** Identificando que $\frac{k}{0}$ ($k \neq 0$) no tiene solución en $\mathbb{R}$ debido a que ningún número real satisface $x \cdot 0 = k$, y determinando las restricciones del dominio algebraico.


  ![Resumen Fracción no definida con denominador cero](/static/img/nodos/fraccion-no-definida-con-denominador-cero-resumen.svg)'
