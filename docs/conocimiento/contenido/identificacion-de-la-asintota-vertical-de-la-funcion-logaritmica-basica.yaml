semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.ASINTOTA_VERTICAL
resumen_inicial: La identificación de la asíntota vertical en la función logarítmica básica establece que la recta $x = 0$ (el eje $Y$) actúa como una barrera asintótica vertical hacia la cual la curva diverge hacia $-\infty$ (si $b > 1$) o hacia $+\infty$ (si $0 < b < 1$) cuando $x \to 0^+$.
explicacion_simple: "![La identificación de la asíntota vertical en la función logarítmica básica establece que la recta $x = 0$ (el eje $Y$) actúa como una barrera asintótica vertical hacia la cual la curva diverge hacia $-\\infty$ (si $b > 1$) o hacia $+\\infty$ (si $0 < b < 1$) cuando $x \\to 0^+$](/static/img/nodos/identificacion-de-la-asintota-vertical-de-la-funcion-logaritmica-basica-intro.svg)\n\n\nLa gráfica de la función logarítmica básica $f(x) = \\log_b(x)$ tiene una **pared vertical invisible**: el **eje $Y$ (la recta $x = 0$)**:\n\n$$\\mathcal{A}_V: \\mathbf{x = 0} \\quad (\\text{Asíntota Vertical})$$\n\n- **¿Qué le pasa a la curva cuando te acercas al eje $Y$?**\n  - Si $b > 1$ (ej: $\\log_2(x)$): La curva se cae a un pozo sin fondo hacia **$-\\infty$**.\n  - Si $0 < b < 1$ (ej: $\\log_{0,5}(x)$): La curva se dispara hacia las nubes hacia **$+\\infty$**.\n- **¡Regla de oro!** La curva se acerca infinitamente a la recta $x = 0$, **pero NUNCA la toca, NUNCA la cruza y NUNCA existe\
  \ a la izquierda de ella**."
explicacion_formal: 'Sea $f(x) = \log_b(x)$ con $b \in \mathbb{R}^+ \setminus \{1\}$. El comportamiento en la frontera izquierda del dominio se define mediante el límite lateral por la derecha:

  $$\lim_{x \to 0^+} \log_b(x) = \begin{cases} -\infty & \text{si } b > 1 \\ +\infty & \text{si } 0 < b < 1 \end{cases}$$

  Por la definición topológica de asíntota vertical, la recta $\mathcal{A}_V: x = 0$ es la única asíntota de la función básica.


  **Comportamiento en funciones trasladadas**:

  Para $g(x) = \log_b(x - h)$, el límite lateral se traslada a $x \to h^+$:

  $$\lim_{x \to h^+} \log_b(x - h) = \pm\infty \Longleftrightarrow \mathcal{A}_V: x = h$$'
definiciones_clave: '- **Asíntota vertical logarítmica**: Recta vertical $x = h$ donde el argumento se anula y la función diverge sin límite.

  - **Límite lateral asintótico**: Tendencia $\lim_{x \to 0^+} \log_b(x) = \pm\infty$.'
propiedades_relaciones: '- **Inexistencia de asíntota horizontal**: A diferencia de la función exponencial (que tiene $\mathcal{A}_H: y = 0$), el logaritmo solo tiene asíntota vertical.

  - **Unilateralidad**: La curva solo existe a la derecha de la asíntota ($x > 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de la asíntota vertical en la función logarítmica básica establece que la recta $x = 0$ (el eje $Y$) actúa como una barrera asintótica vertical hacia la cual la curva diverge hacia $-\infty$ (si $b > 1$) o hacia $+\infty$ (si $0 < b < 1$) cuando $x \to 0^+$](/static/img/nodos/identificacion-de-la-asintota-vertical-de-la-funcion-logaritmica-basica-ejemplos.svg)



    Determina la ecuación de la asíntota vertical para las siguientes funciones:

    1) $f(x) = \ln(x)$

    2) $g(x) = \log_2(x - 7)$

    3) $h(x) = \log_5(2x + 6)$'
  pasos:
  - 'Paso 1: Para $f(x) = \ln(x)$:

    - Función básica $\implies$ Argumento $x = 0$.

    - **Asíntota: $\mathbf{x = 0}$ (Eje $Y$)**.'
  - 'Paso 2: Para $g(x) = \log_2(x - 7)$:

    - Igualar argumento a cero: $x - 7 = 0 \implies \mathbf{x = 7}$.

    - **Asíntota: $\mathbf{x = 7}$**.'
  - 'Paso 3: Para $h(x) = \log_5(2x + 6)$:

    - Igualar argumento a cero: $2x + 6 = 0 \implies 2x = -6 \implies \mathbf{x = -3}$.

    - **Asíntota: $\mathbf{x = -3}$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación de la asíntota vertical de la función básica $f(x) = \log_{10}(x)$?
  choices:
  - text: x = 0 (el eje Y)
    is_correct: true
  - text: y = 0 (el eje X)
    is_correct: false
  - text: x = 1
    is_correct: false
  - text: y = 1
    is_correct: false
  explanation: La alternativa correcta es 'x = 0 (el eje Y)'. La recta vertical del eje Y es la asíntota de la función logarítmica básica.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la asíntota vertical de $f(x) = \log_3(x - 4) + 5$?
  choices:
  - text: x = 4
    is_correct: true
  - text: y = 5
    is_correct: false
  - text: x = -4
    is_correct: false
  - text: x = 0
    is_correct: false
  explanation: La alternativa correcta es 'x = 4'. El argumento se anula en $x - 4 = 0 \implies x = 4$. El valor +5 es un desplazamiento vertical que no afecta a la recta vertical.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer la expresión contenida en el argumento del logaritmo.'
- 'Paso 2: Igualar dicha expresión estrictamente a cero: $\operatorname{Arg}(x) = 0$.'
- 'Paso 3: Despejar el valor de $x = h$.'
- 'Paso 4: Escribir formalmente la recta como $\mathcal{A}_V: x = h$.'
errores_correccion: '- **Error común:** Escribir $y = 0$ en lugar de $x = 0$ para la asíntota vertical.

  - **Cómo corregirlo:** Las rectas verticales se escriben siempre con **$x = \text{número}$**: $\mathcal{A}_V: \mathbf{x = 0}$.'
ejemplos:
- titulo: 'Ejemplo 1: Asíntota canónica'
  enunciado: ¿Qué recta representa la asíntota vertical de $f(x) = \log_2(x)$?
  alternativas:
  - x = 0
  - y = 0
  - x = 1
  - y = 1
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: Argumento $x = 0 \implies \mathcal{A}_V: x = 0$.'
- titulo: 'Ejemplo 2: Asíntota con traslación positiva'
  enunciado: ¿Cuál es la asíntota vertical de $g(x) = \log(x - 12)$?
  alternativas:
  - x = 12
  - x = -12
  - y = 12
  - x = 0
  respuesta: x = 12
  solucion_pasos:
  - 'Paso 1: $x - 12 = 0 \implies x = 12$.'
- titulo: 'Ejemplo 3: Asíntota con coeficiente'
  enunciado: 'Halla la asíntota vertical de $h(x) = \ln(3x - 15)$:'
  alternativas:
  - x = 5
  - x = 15
  - x = 3
  - y = 5
  respuesta: x = 5
  solucion_pasos:
  - 'Paso 1: $3x - 15 = 0 \implies 3x = 15 \implies x = 5$.'
- titulo: 'Ejemplo 4: Límite divergente'
  enunciado: Si $f(x) = \log_5(x)$, ¿hacia dónde tiende la curva cuando $x \to 0^+$?
  alternativas:
  - -infinito
  - +infinito
  - '0'
  - '1'
  respuesta: -infinito
  solucion_pasos:
  - 'Paso 1: Como la base $5 > 1$, $\lim_{x \to 0^+} \log_5(x) = -\infty$.'
errores_frecuentes:
- Escribir la ecuación de la asíntota con la variable y en vez de x.
- Creer que la traslación vertical k desplaza la asíntota vertical.
- Asumir que la curva puede cruzar la asíntota vertical.
afirmaciones_verdaderas:
- La asíntota vertical de f(x) = log_b(x) es la recta x = 0 (el eje Y).
- La curva logarítmica básica se aproxima infinitamente al eje Y por la derecha sin intersectarlo.
al_terminar_debes_poder: '**QUÉ:** Identificar y formular la ecuación de la asíntota vertical en funciones logarítmicas.


  **CÓMO:** Igualando el argumento del logaritmo a cero para obtener la recta vertical x = h.


