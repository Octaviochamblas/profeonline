semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DOMINIO
resumen_inicial: 'Identificación del dominio de una función: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: No todos los números pueden entrar en una función sin causar problemas
  (como dividir por cero). El dominio es la lista de entradas permitidas.
explicacion_formal: '### Definición formal


  El dominio de una función $f\colon A \to B$, denotado $\text{Dom}(f)$, es el subconjunto
  de $A$ formado por todos los valores $x$ para los cuales existe $f(x) \in B$. Cuando
  $f$ está dada por una fórmula sin restricción explícita de conjunto de partida,
  $\text{Dom}(f)$ es el mayor subconjunto de $\mathbb{R}$ donde la fórmula produce
  un valor real definido.


  ### Desarrollo didáctico


  Para hallar el dominio de una fórmula, busca las operaciones que "rompen" la definición:
  divisiones (el denominador no puede ser cero) y raíces de índice par (el radicando
  no puede ser negativo).


  Si $f(x) = \frac{1}{x-3}$, el valor $x=3$ anula el denominador, así que $\text{Dom}(f)
  = \mathbb{R} - \{3\}$.

  Si $f(x) = \sqrt{x-2}$, se exige $x-2 \geq 0$, es decir $\text{Dom}(f) = [2, +\infty[$.'
definiciones_clave: '- **Identificación del dominio de una función**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación del dominio de una función.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación del
    dominio de una función.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación del dominio de
    una función.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    identificación del dominio de una función?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en identificación del dominio de una función.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en identificación del dominio
    de una función, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observa la fórmula de la función en busca de divisiones o raíces de índice
  par.'
- 'Paso 2: Si hay una división, iguala el denominador a cero y excluye esos valores
  del dominio.'
- 'Paso 3: Si hay una raíz de índice par, exige que el radicando sea mayor o igual
  a cero y resuelve la inecuación.'
- 'Paso 4: Si no hay restricciones, el dominio es todo $\mathbb{R}$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación del dominio de una función.
ejemplos:
- titulo: Restricción por división
  enunciado: Determina el dominio de $f(x) = \frac{5}{x+2}$.
  solucion_pasos:
  - El denominador no puede ser cero: $x + 2 \neq 0 \Rightarrow x \neq -2$.
  - 'Dominio: $\mathbb{R} - \{-2\}$.'
- titulo: Restricción por raíz cuadrada
  enunciado: Determina el dominio de $f(x) = \sqrt{5-x}$.
  solucion_pasos:
  - El radicando debe ser no negativo: $5 - x \geq 0 \Rightarrow x \leq 5$.
  - 'Dominio: $]-\infty, 5]$.'
- titulo: ¿El dominio de $f(x) = x^2 + 3x - 1$ es todo $\mathbb{R}$?
  enunciado: ¿El dominio de $f(x) = x^2 + 3x - 1$ es todo $\mathbb{R}$?
  respuesta: Verdadero
  solucion_pasos:
  - Es un polinomio; no tiene divisiones ni raíces, por lo que no hay valores prohibidos.
- titulo: ¿$x=3$ pertenece al dominio de $f(x) = \frac{2}{x-3}$?
  enunciado: ¿$x=3$ pertenece al dominio de $f(x) = \frac{2}{x-3}$?
  respuesta: Falso
  solucion_pasos:
  - En $x=3$ el denominador se anula, dejando la expresión indefinida.
errores_frecuentes:
- Olvidar restringir el dominio cuando hay una variable en el denominador.
- Exigir que el radicando sea estrictamente positivo en vez de mayor o igual a cero.
- Confundir el dominio con el recorrido de la función.
- Asumir que el dominio de todo polinomio tiene restricciones, sin verificar que no
  las tiene.
- No combinar todas las restricciones cuando hay más de una operación conflictiva
  en la misma fórmula.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando identificación
  del dominio de una función.
