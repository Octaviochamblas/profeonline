semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DOMINIO
resumen_inicial: El dominio de una función $\operatorname{Dom}(f)$ es el conjunto
  de todos los valores de entrada para los cuales la función está matemáticamente
  definida.
explicacion_simple: 'El **dominio** (denotado $\operatorname{Dom}(f)$) es el conjunto
  de todas las ''entradas'' válidas que podemos meter en la función sin que se rompa
  la matemática.

  Por ejemplo:

  - No se puede dividir entre cero ($/0$).

  - No se pueden extraer raíces de índice par a números negativos ($\sqrt{-\text{negativo}}$
  en los reales).

  El dominio son todos los números reales excepto aquellos que provocan estos errores.'
explicacion_formal: "El **dominio maximal real** de una función $f: A \\to B$ se define\
  \ como el subconjunto de números reales:\n\n$$\\operatorname{Dom}(f) = \\{x \\in\
  \ \\mathbb{R} \\mid f(x) \\in \\mathbb{R}\\}\\subset \\mathbb{R}$$\n\n**Desglose\
  \ de la fórmula:**\n- Restricciones algebraicas usuales:\n  1. $f(x) = \\frac{P(x)}{Q(x)}\
  \ \\implies Q(x) \\neq 0$.\n  2. $f(x) = \\sqrt[2k]{g(x)} \\implies g(x) \\ge 0$."
definiciones_clave: '- **Dominio ($\operatorname{Dom}(f)$)**: Conjunto de partida
  de todos los elementos $x \in \mathbb{R}$ que tienen imagen real bien definida.

  - **Restricción de dominio**: Condición algebraica que excluye valores de $x$ que
  anulan denominadores o producen radicales pares negativos.'
propiedades_relaciones: '- **Proyección horizontal**: En el plano cartesiano, el dominio
  corresponde a la proyección del gráfico sobre el eje $X$.'
ejemplo_guiado:
  enunciado: Determina el dominio de la función racional $f(x) = \frac{5}{x - 4}$
    en los números reales.
  pasos:
  - 'Paso 1: Identificar la restricción algebraica: la división por cero no está definida
    en $\mathbb{R}$.Paso 2: Igualar el denominador a cero para hallar el valor prohibido:
    $x - 4 = 0 \implies x = 4$.Paso 3: Excluir el valor $4$ del conjunto de los números
    reales.Paso 4: Escribir el dominio en notación de conjuntos: $\operatorname{Dom}(f)
    = \mathbb{R} \setminus \{4\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al determinar el dominio de la función $f(x) = \frac{5}{x - 4}$, ¿cuál
    es el conjunto solución correcto?
  choices:
  - text: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{4\}$
    is_correct: true
  - text: $\operatorname{Dom}(f) = \mathbb{R}$
    is_correct: false
  - text: $\operatorname{Dom}(f) = \{4\}$
    is_correct: false
  - text: $\operatorname{Dom}(f) = ]4, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Dom}(f) = \mathbb{R} \setminus
    \{4\}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el valor $x = 4$ debe ser excluido del dominio de $f(x) = \frac{5}{x
    - 4}$?
  choices:
  - text: Porque anula el denominador produciendo una división por cero indeterminada.
    is_correct: true
  - text: Porque 4 es un número par.
    is_correct: false
  - text: Porque el resultado da un número imaginario.
    is_correct: false
  - text: Porque la función no acepta números enteros.
    is_correct: false
  explanation: La alternativa correcta es 'Porque anula el denominador produciendo
    una división por cero indeterminada.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analizar la estructura algebraica de la función.'
- 'Paso 2: Detectar denominadores e igualarlos a cero para hallar valores prohibidos.'
- 'Paso 3: Detectar raíces pares e imponer que la expresión interior sea $\ge 0$.'
- 'Paso 4: Escribir el dominio como $\mathbb{R} \setminus \{\text{valores prohibidos}\}$
  o como intervalo.'
errores_correccion: '- **Error común:** Creer que todas las funciones tienen dominio
  igual a todo $\mathbb{R}$.

  - **Cómo corregirlo:** Si la función tiene fracciones o raíces pares, debes buscar
  obligatoriamente sus restricciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
