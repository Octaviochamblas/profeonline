semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DOMINIO
resumen_inicial: El dominio de una función es el conjunto de todos los valores de entrada para los cuales la función está matemáticamente definida.
explicacion_simple: |
  El **dominio** representa todos los números $x$ "permitidos" que se pueden ingresar en una función sin romper las reglas matemáticas.

  Las dos prohibiciones principales en los números reales son:
  1. **No dividir por cero**: En $f(x) = \frac{1}{x - 2}$, el valor $x = 2$ está prohibido.
  2. **No sacar raíz cuadrada de números negativos**: En $g(x) = \sqrt{x - 3}$, requerimos $x \ge 3$.
explicacion_formal: |
  Dada una función real $f(x)$, el **dominio de definición** $\text{Dom}(f)$ es el subconjunto de números reales para los cuales la regla $f(x)$ produce un número real bien definido:

  $$\text{Dom}(f) = \{x \in \mathbb{R} \mid f(x) \in \mathbb{R}\}$$

  **Desglose de las restricciones principales:**
  - Fracciones: Denominador $\neq 0$.
  - Raíces pares: Radicando $\ge 0$.
definiciones_clave: |
  - **Dominio ($\text{Dom}(f)$)**: Conjunto de valores reales de la variable independiente $x$ que poseen imagen bien definida.
propiedades_relaciones: |
  - **Dominio natural**: Cuando no se especifica el conjunto de partida, se asume el mayor subconjunto de $\mathbb{R}$ compatible con las operaciones.
ejemplo_guiado:
  enunciado: Determina el dominio de la función $f(x) = \frac{\sqrt{x - 1}}{x - 5}$.
  pasos:
    - 'Paso 1: Identificar la restricción de la raíz par: el radicando debe ser no negativo $\implies x - 1 \ge 0 \implies x \ge 1$.'
    - 'Paso 2: Identificar la restricción de la fracción: el denominador no puede ser cero $\implies x - 5 \neq 0 \implies x \neq 5$.'
    - 'Paso 3: Intersecar las condiciones: $x \in [1, +\infty[$ excluyendo el valor $5$.'
    - 'Paso 4: Escribir el dominio en notación de conjuntos/intervalos: $\text{Dom}(f) = [1, 5[ \ \cup \ ]5, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es el dominio de la función $f(x) = \frac{1}{x - 4}$?
    choices:
      - {text: '$\mathbb{R} \setminus \{4\}$', is_correct: true}
      - {text: '$\mathbb{R}$', is_correct: false}
      - {text: '$]4, +\infty[$', is_correct: false}
      - {text: '$\{4\}$', is_correct: false}
    explanation: La alternativa correcta es '$\mathbb{R} \setminus \{4\}$'. El denominador se anula en $x = 4$.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Cuál es el dominio de la función $g(x) = \sqrt{x + 3}$ en los números reales?
    choices:
      - {text: '$[-3, +\infty[$', is_correct: true}
      - {text: '$]3, +\infty[$', is_correct: false}
      - {text: '$\mathbb{R} \setminus \{-3\}$', is_correct: false}
      - {text: '$]-\infty, -3]$', is_correct: false}
    explanation: La alternativa correcta es '$[-3, +\infty[$'. El radicando $x + 3 \ge 0 \implies x \ge -3$.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Examinar la expresión algebraica de la función.'
  - 'Paso 2: Plantear desigualdades para radicandos de índice par ($\ge 0$).'
  - 'Paso 3: Plantear inecuaciones/ecuaciones de exclusión para denominadores ($\neq 0$).'
  - 'Paso 4: Intersecar las condiciones y escribir el conjunto $\text{Dom}(f)$.'
errores_correccion: |
  - **Error común:** Olvidar incluir los extremos cerrados al despejar inecuaciones de raíces cuadradas en el numerador.
  - **Cómo corregirlo:** La condición de la raíz cuadrada es NO NEGATIVA ($\ge 0$), por lo que el valor que hace cero al radicando SÍ pertenece al dominio si está en el numerador.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El dominio de la función racional $f(x) = \frac{1}{x - 3}$ incluye al número real $x = 3$.'
  - 'El dominio de la función raíz cuadrada $f(x) = \sqrt{x + 2}$ es el conjunto de todos los números reales $\mathbb{R}$.'
  - 'El dominio de una función corresponde al conjunto de valores de salida obtenidos en el eje $Y$.'
  - 'Restricciones de división por cero permiten definir valores reales en el dominio de una función.'
  - 'El dominio de cualquier función definida sobre la recta real es siempre el intervalo abierto $]0, +\infty[$.'
afirmaciones_verdaderas:
  - 'El dominio de una función es el conjunto de todos los valores de entrada para los cuales la regla de correspondencia está bien definida en $\mathbb{R}$.'
  - 'Para determinar el dominio real se deben excluir las restricciones algebraicas como denominadores nulos y radicandos negativos de índice par.'
al_terminar_debes_poder: |
  QUÉ: Determinar el dominio de definición de funciones algebraicas en $\mathbb{R}$.
  CÓMO: Plantear las restricciones algebraicas (denominadores $\neq 0$, radicandos pares $\ge 0$), resolver las inecuaciones/ecuaciones y declarar el conjunto $\text{Dom}(f)$.
