semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DOMINIO
resumen_inicial: El dominio de una función es el conjunto de todos los valores reales de entrada para los cuales la función está matemáticamente definida.
explicacion_simple: '![El dominio de una función es el conjunto de todos los valores reales de entrada para los cuales la función está matemáticamente definida](/static/img/nodos/identificacion-del-dominio-de-una-funcion-intro.svg)



  El **dominio** representa todos los números $x$ que puedes introducir en la función sin que se produzcan operaciones matemáticas inválidas o prohibidas.


  En los números reales $\mathbb{R}$, las dos restricciones más habituales son:

  1. **División por cero**: El denominador nunca puede ser $0$.

  2. **Raíces cuadradas (o de índice par) de números negativos**: La cantidad dentro de la raíz debe ser mayor o igual a $0$.


  Si una función no tiene ninguna restricción, su dominio son **todos los números reales** ($\mathbb{R}$).'
explicacion_formal: 'Sea $f: A \to B$ una función real de variable real. El **dominio** de $f$, denotado por $\text{Dom}(f)$, es el conjunto:

  $$\text{Dom}(f) = \{x \in \mathbb{R} \mid f(x) \in \mathbb{R}\}$$


  **Criterios de restricción de dominio:**

  - **Fracciones algebraicas**: Si $f(x) = \frac{P(x)}{Q(x)}$, entonces $\text{Dom}(f) = \{x \in \mathbb{R} \mid Q(x) \neq 0\}$.

  - **Radicales de índice par**: Si $f(x) = \sqrt[2n]{g(x)}$, entonces $\text{Dom}(f) = \{x \in \mathbb{R} \mid g(x) \ge 0\}$.

  - **Polinomios**: Para cualquier función polinomial $P(x)$, $\text{Dom}(P) = \mathbb{R}$.'
definiciones_clave: "- **Dominio ($\text{Dom}(f)$)**: Conjunto de todas las preimágenes admisibles en los reales.\n- **Restricción de dominio**: Condición algebraica que excluye ciertos números reales para evitar indeterminaciones."
propiedades_relaciones: '- **Lectura en el plano**: En el gráfico cartesiano, el dominio corresponde a la proyección de la curva sobre el eje horizontal $X$.

  - **Intersección de restricciones**: Si una función combina varias operaciones restringidas, su dominio es la intersección de todas las condiciones individuales.'
ejemplo_guiado:
  enunciado: '![Ejemplo El dominio de una función es el conjunto de todos los valores reales de entrada para los cuales la función está matemáticamente definida](/static/img/nodos/identificacion-del-dominio-de-una-funcion-ejemplos.svg)



    Determina el dominio de la función racional $f(x) = \frac{2x + 1}{x - 4}$.'
  pasos:
  - 'Paso 1: Identificar la restricción: por ser una fracción, el denominador no puede anularse.'
  - 'Paso 2: Plantear la condición de no nulidad: $x - 4 \neq 0$.'
  - 'Paso 3: Resolver la desigualdad: $x \neq 4$.'
  - 'Paso 4: Expresar el dominio en notación de conjuntos o intervalos: $\text{Dom}(f) = \mathbb{R} \setminus \{4\} = ]-\infty, 4[ \cup ]4, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función racional $f(x) = \frac{5}{x + 7}$?
  choices:
  - text: Todos los reales excepto -7 (R \ {-7})
    is_correct: true
  - text: Todos los reales excepto 7 (R \ {7})
    is_correct: false
  - text: Todos los reales positivos
    is_correct: false
  - text: Todos los reales R
    is_correct: false
  explanation: La alternativa correcta es 'Todos los reales excepto -7 (R \ {-7})'. El denominador se anula en $x = -7$, por lo que debe excluirse del dominio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el dominio de la función con raíz cuadrada $g(x) = \sqrt{x - 6}$?
  choices:
  - text: '[6, +inf['
    is_correct: true
  - text: ']6, +inf['
    is_correct: false
  - text: ']-inf, 6]'
    is_correct: false
  - text: R \ {6}
    is_correct: false
  explanation: 'La alternativa correcta es ''[6, +inf[''. La cantidad subradical debe ser no negativa: $x - 6 \geq 0 \implies x \geq 6$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar la expresión algebraica en busca de denominadores o raíces de índice par.'
- 'Paso 2: Si hay denominadores, igualarlos a cero y excluir esas raíces de $\mathbb{R}$.'
- 'Paso 3: Si hay raíces pares, plantear la inecuación $\text{radicando} \ge 0$ y resolver el intervalo.'
- 'Paso 4: Intersectar las condiciones obtenidas y redactar el dominio final.'
errores_correccion: '- **Error común:** Excluir valores que anulan el numerador en vez del denominador.

  - **Cómo corregirlo:** El numerador puede ser cero sin ningún inconveniente (daría resultado $0$); la única operación no permitida es que el denominador sea cero.'
ejemplos:
- titulo: 'Ejemplo 1: Función polinomial'
  enunciado: Determina el dominio de $f(x) = 4x^2 - 5x + 9$.
  alternativas:
  - Todos los reales R
  - R \ {0}
  - '[0, +inf['
  - R \ {9}
  respuesta: Todos los reales R
  solucion_pasos:
  - 'Paso 1: $f(x)$ es una función cuadrática polinomial.'
  - 'Paso 2: No presenta denominadores con variables ni raíces.'
  - 'Paso 3: $\text{Dom}(f) = \mathbb{R}$.'
- titulo: 'Ejemplo 2: Denominador cuadrático factorizable'
  enunciado: ¿Cuál es el dominio de $f(x) = \frac{1}{x^2 - 9}$?
  alternativas:
  - R \ {-3, 3}
  - R \ {9}
  - R \ {3}
  - ']-3, 3['
  respuesta: R \ {-3, 3}
  solucion_pasos:
  - 'Paso 1: Factorizar el denominador: $x^2 - 9 = (x - 3)(x + 3) \neq 0$.'
  - 'Paso 2: Los valores prohibidos son $x = 3$ y $x = -3$.'
  - 'Paso 3: $\text{Dom}(f) = \mathbb{R} \setminus \{-3, 3\}$.'
- titulo: 'Ejemplo 3: Raíz en el denominador'
  enunciado: Halla el dominio de $h(x) = \frac{1}{\sqrt{x - 2}}$.
  alternativas:
  - ']2, +inf['
  - '[2, +inf['
  - R \ {2}
  - ']-inf, 2['
  respuesta: ']2, +inf['
  solucion_pasos:
  - 'Paso 1: Por estar dentro de una raíz cuadrada debe ser $\ge 0$, pero por estar en el denominador no puede ser $0$.'
  - 'Paso 2: Condición estricta: $x - 2 > 0 \implies x > 2$.'
  - 'Paso 3: $\text{Dom}(h) = ]2, +\infty[$.'
- titulo: 'Ejemplo 4: Gráfica con extremos acotados'
  enunciado: Una función está graficada desde $x = -3$ (círculo cerrado) hasta $x = 5$ (círculo abierto). ¿Cuál es su dominio?
  alternativas:
  - '[-3, 5['
  - '[-3, 5]'
  - ']-3, 5['
  - ']-3, 5]'
  respuesta: '[-3, 5['
  solucion_pasos:
  - 'Paso 1: Círculo cerrado en $-3$ indica corchete hacia adentro: $[-3$.'
  - 'Paso 2: Círculo abierto en $5$ indica corchete hacia afuera: $5[$.'
  - 'Paso 3: $\text{Dom}(f) = [-3, 5[$.'
errores_frecuentes:
- Confundir los valores del eje Y con el dominio de la función.
- Olvidar que las raíces cúbicas o de índice impar no imponen restricciones de signo.
- Cerrar el corchete cuando la raíz cuadrada se ubica en el denominador.
afirmaciones_verdaderas:
- El dominio está constituido por el conjunto de todas las preimágenes para las cuales la función existe en los números reales.
- Para una función polinomial cualquiera, el dominio natural es siempre el conjunto completo de los números reales.
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular analíticamente el dominio de una función real.


  **CÓMO:** Detectando restricciones algebraicas por división por cero y raíces pares para escribir el conjunto solución en notación de intervalos.


  ![Resumen El dominio de una función es el conjunto de todos los valores reales de entrada para los cuales la función está matemáticamente definida](/static/img/nodos/identificacion-del-dominio-de-una-funcion-resumen.svg)'
