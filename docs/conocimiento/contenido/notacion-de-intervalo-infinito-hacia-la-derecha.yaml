semantic_id: MAT.ALG.INTERVALOS.INTERVALO_INFINITO_POSITIVO
resumen_inicial: Un intervalo infinito hacia la derecha comprende todos los números
  mayores que un valor inicial $a$ y se extiende hasta $+\infty$.
explicacion_simple: 'Cuando una desigualdad no tiene límite superior (como $x > 3$
  o $x \ge 3$), significa que la solución se extiende infinitamente hacia la derecha
  en la recta numérica.

  Usamos el símbolo de infinito positivo ($+\infty$) en el lado derecho del intervalo.

  Importante: el símbolo del infinito SIEMPRE lleva corchete abierto $ [ $ porque
  el infinito no es un número que se pueda alcanzar o incluir.'
explicacion_formal: 'El **intervalo no acotado superiormente** sobre $\mathbb{R}$
  se define como:


  $$]a, +\infty[ \ = (a, +\infty) = \{x \in \mathbb{R} \mid x > a\}$$

  $$[a, +\infty[ \ = [a, +\infty) = \{x \in \mathbb{R} \mid x \ge a\}$$


  **Desglose de la fórmula:**

  - $+\infty$: Símbolo de cota infinita positiva siempre abierto por la derecha ($+\infty[$).'
definiciones_clave: '- **Intervalo no acotado superiormente**: Intervalo real sin
  límite superior finito.

  - **Símbolo de infinito ($+\infty$)**: Concepto que representa el crecimiento ilimitado
  hacia la derecha de la recta real.'
propiedades_relaciones: '- **Apertura del infinito**: El infinito jamás lleva corchete
  cerrado.'
ejemplo_guiado:
  enunciado: Traduce las desigualdades $x > 5$ y $x \ge 5$ a notación de intervalo
    no acotado.
  pasos:
  - 'Paso 1: Analizar $x > 5$: la variable es estrictamente mayor que $5$, luego inicia
    en $5$ (excluido) y va a $+\infty$.Paso 2: Escribir en intervalo abierto: $]5,
    +\infty[$.Paso 3: Analizar $x \ge 5$: incluye al $5$, luego inicia en $5$ (incluido)
    y va a $+\infty$.Paso 4: Escribir en intervalo cerrado por la izquierda: $[5,
    +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe en notación de intervalo el conjunto de todos los números
    mayores o iguales a 5 ($\{x \in \mathbb{R} \mid x \ge 5\}$)?
  choices:
  - text: $[5, +\infty[$
    is_correct: true
  - text: $]5, +\infty]$
    is_correct: false
  - text: $]-\infty, 5]$
    is_correct: false
  - text: $[5, +\infty]$
    is_correct: false
  explanation: La alternativa correcta es '$[5, +\infty[$'. (El infinito SIEMPRE es
    abierto).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el símbolo $+\infty$ lleva siempre un corchete abierto por la
    derecha ($+\infty[$)?
  choices:
  - text: Porque el infinito es una noción de crecimiento ilimitado y no un número
      cerrado alcanzable.
    is_correct: true
  - text: Porque todos los números positivos son abiertos.
    is_correct: false
  - text: Es una convención que depende del problema.
    is_correct: false
  - text: Porque solo se usa para números enteros.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el infinito es una noción de crecimiento
    ilimitado y no un número cerrado alcanzable.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cota inferior $a$.'
- 'Paso 2: Decidir si $a$ lleva corchete cerrado $[$ (si es $\ge$) u abierto $]$ (si
  es $>$).'
- 'Paso 3: Escribir $+\infty$ en la posición derecha.'
- 'Paso 4: Cerrar SIEMPRE con corchete abierto por la derecha $ [ $.'
errores_correccion: '- **Error común:** Colocar un corchete cerrado en el infinito
  (escribir $[5, +\infty]$).

  - **Cómo corregirlo:** El infinito NUNCA se cierra con corchete. Escribe siempre
  $+\infty[$ o $+\infty)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- Usar corchetes cerrados $[ ]$ para traducir desigualdades estrictas que no incluyen
  el signo igual.
- Colocar un corchete cerrado en los símbolos de infinito $+ \infty$ o $-\infty$.
- Escribir las fronteras del intervalo al revés colocando el número mayor a la izquierda.
- Creer que un intervalo real solo contiene a los números enteros de la zona.
- Olvidar sombrear la línea continua al dibujar la gráfica en la recta numérica.
afirmaciones_verdaderas:
- Un intervalo cerrado $[a, b]$ incluye a ambos extremos $a$ y $b$ dentro del conjunto
  de soluciones.
- El símbolo de infinito siempre lleva corchete abierto ya que representa una cota
  ilimitada no alcanzable.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, traducir y representar
  gráficamente intervalos reales abiertos, cerrados e infinitos.
fuente: Texto escolar MINEDUC — Álgebra / Intervalos Reales
