semantic_id: MAT.ALG.INTERVALOS.INTERVALO_INFINITO_POSITIVO
resumen_inicial: Un intervalo infinito hacia la derecha comprende todos los números mayores que un valor inicial $a$ y se extiende hasta $+\infty$.
explicacion_simple: '![Notación de intervalo infinito hacia la derecha](/static/img/nodos/notacion-de-intervalo-infinito-hacia-la-derecha-intro.svg)


  Cuando una desigualdad no tiene límite superior (como $x > 3$ o $x \ge 3$), significa que la solución se extiende infinitamente hacia la derecha en la recta numérica.

  Usamos el símbolo de infinito positivo ($+\infty$) en el lado derecho del intervalo.

  Importante: el símbolo del infinito SIEMPRE lleva corchete abierto $ [ $ porque el infinito no es un número que se pueda alcanzar o incluir.'
explicacion_formal: 'El **intervalo no acotado superiormente** sobre $\mathbb{R}$ se define como:


  $$]a, +\infty[ \ = (a, +\infty) = \{x \in \mathbb{R} \mid x > a\}$$

  $$[a, +\infty[ \ = [a, +\infty) = \{x \in \mathbb{R} \mid x \ge a\}$$


  **Desglose de la fórmula:**

  - $+\infty$: Símbolo de cota infinita positiva siempre abierto por la derecha ($+\infty[$).'
definiciones_clave: '- **Intervalo no acotado superiormente**: Intervalo real sin límite superior finito.

  - **Símbolo de infinito ($+\infty$)**: Concepto que representa el crecimiento ilimitado hacia la derecha de la recta real.'
propiedades_relaciones: '- **Apertura del infinito**: El infinito jamás lleva corchete cerrado.'
ejemplo_guiado:
  enunciado: '![Ejemplo Notación de intervalo infinito hacia la derecha](/static/img/nodos/notacion-de-intervalo-infinito-hacia-la-derecha-ejemplos.svg)


    Traduce las desigualdades $x > 5$ y $x \ge 5$ a notación de intervalo no acotado.'
  pasos:
  - 'Paso 1: Analizar $x > 5$: la variable es estrictamente mayor que $5$, luego inicia en $5$ (excluido) y va a $+\infty$.Paso 2: Escribir en intervalo abierto: $]5, +\infty[$.Paso 3: Analizar $x \ge 5$: incluye al $5$, luego inicia en $5$ (incluido) y va a $+\infty$.Paso 4: Escribir en intervalo cerrado por la izquierda: $[5, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe en notación de intervalo el conjunto de todos los números mayores o iguales a 5 ($\{x \in \mathbb{R} \mid x \ge 5\}$)?
  choices:
  - text: $[5, +\infty[$
    is_correct: true
  - text: $]5, +\infty]$
    is_correct: false
  - text: $]-\infty, 5]$
    is_correct: false
  - text: $[5, +\infty]$
    is_correct: false
  explanation: La alternativa correcta es '$[5, +\infty[$'. (El infinito SIEMPRE es abierto).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el símbolo $+\infty$ lleva siempre un corchete abierto por la derecha ($+\infty[$)?
  choices:
  - text: Porque el infinito es una noción de crecimiento ilimitado y no un número cerrado alcanzable.
    is_correct: true
  - text: Porque todos los números positivos son abiertos.
    is_correct: false
  - text: Es una convención que depende del problema.
    is_correct: false
  - text: Porque solo se usa para números enteros.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el infinito es una noción de crecimiento ilimitado y no un número cerrado alcanzable.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cota inferior $a$.'
- 'Paso 2: Decidir si $a$ lleva corchete cerrado $[$ (si es $\ge$) u abierto $]$ (si es $>$).'
- 'Paso 3: Escribir $+\infty$ en la posición derecha.'
- 'Paso 4: Cerrar SIEMPRE con corchete abierto por la derecha $ [ $.'
errores_correccion: '- **Error común:** Colocar un corchete cerrado en el infinito (escribir $[5, +\infty]$).

  - **Cómo corregirlo:** El infinito NUNCA se cierra con corchete. Escribe siempre $+\infty[$ o $+\infty)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- La notación para la desigualdad no estricta $x \ge 4$ se escribe con corchete cerrado en el infinito como $[4, +\infty]$.
- El símbolo de infinito positivo $+\infty$ representa un número real concreto que puede cerrarse con corchete $[$.
- La inecuación $x > 4$ se expresa mediante el intervalo cerrado $[4, +\infty[$.
- El intervalo $[4, +\infty[$ excluye al número $4$ de su conjunto solución.
- La cota $+\infty$ en un intervalo indica que los valores de $x$ están limitados superiormente por un entero.
afirmaciones_verdaderas:
- Los intervalos infinitos hacia la derecha del tipo $[a, +\infty[$ o $]a, +\infty[$ llevan siempre corchete abierto en el símbolo $+\infty$.
- La desigualdad $x \ge a$ se traduce en notación de intervalo como $[a, +\infty[$.
al_terminar_debes_poder: '**QUÉ:** Expresar semirrectas no acotadas superiormente $[a, +\infty[$ o $]a, +\infty[$.


  **CÓMO:** Escribiendo la cota inferior $a$ y cerrando siempre con el símbolo $+\infty$ con corchete abierto ($x \ge a$ o $x > a$).


  ![Resumen Notación de intervalo infinito hacia la derecha](/static/img/nodos/notacion-de-intervalo-infinito-hacia-la-derecha-resumen.svg)'
