semantic_id: MAT.GEO.VECTORES_OPERATORIA.SUMA_GEOMETRICA
resumen_inicial: 'Adición de vectores mediante método geométrico: conceptos, teoremas,
  propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'Sumar vectores geométricamente es como seguir dos instrucciones
  de desplazamiento seguidas: primero recorres el vector u, luego el vector v desde
  donde terminaste; el vector suma es el camino directo desde el inicio hasta el final.'
explicacion_formal: '![Adición de vectores mediante método geométrico](/static/img/geometria/cartesiano-vectores/vectores-suma-geometrica.svg)


  ### Definición formal


  El método del triángulo para sumar $\vec{u}+\vec{v}$ consiste en trasladar $\vec{v}$
  para que su origen coincida con el extremo de $\vec{u}$ (sin cambiar su módulo,
  dirección ni sentido); el vector resultante es el que va desde el origen de $\vec{u}$
  hasta el extremo final de $\vec{v}$.


  ### Desarrollo didáctico


  En la figura, el vector $\vec{u}=(3,1)$ se traza primero, y luego $\vec{v}=(1,3)$
  se traslada para comenzar donde termina $\vec{u}$. El vector suma $\vec{u}+\vec{v}$
  (en un tercer color) va directamente desde el origen hasta el extremo final.'
definiciones_clave: '- **Adición de vectores mediante método geométrico**: Elemento
  o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a adición de vectores mediante método geométrico.'
