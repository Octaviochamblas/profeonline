procedimiento:
- 'Paso 1: Traza el vector u desde su origen.'
- 'Paso 2: Traslada el vector v (sin cambiar módulo, dirección ni sentido) de modo
  que su origen coincida con el extremo de u.'
- 'Paso 3: Traza el vector suma u+v desde el origen de u hasta el extremo final de
  v (ya trasladado).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con adición de vectores mediante método geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de adición de vectores mediante método geométrico
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
