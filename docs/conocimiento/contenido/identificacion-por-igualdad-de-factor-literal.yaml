semantic_id: MAT.ALG.SIMILARIDAD.IGUALDAD_FACTOR_LITERAL
resumen_inicial: 'Identificación por igualdad de factor literal: procedimiento y reglas
  en Términos semejantes.'
explicacion_simple: La matemática es un idioma preciso. Una 'x' no es lo mismo que
  una 'y', así como un auto no es lo mismo que un barco. Si intentas mezclarlos operativamente,
  crearás caos.
explicacion_formal: '### Definición formal


  El factor literal debe ser un clon exacto. Si falta o sobra una variable, la semejanza
  se rompe.


  ### Desarrollo didáctico


  Comparemos $8m$ y $5n$.

  - El primer término pertenece al grupo de las ''m''.

  - El segundo término pertenece al grupo de las ''n''.

  Como no comparten la misma letra, no son semejantes. No se pueden reducir. La expresión
  $8m + 5n$ queda exactamente así, no se puede simplificar a $13mn$ (ese es un error
  garrafal).'
definiciones_clave: '- **Identificación por igualdad de factor literal**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a identificación por igualdad de factor literal.'
ejemplo_guiado:
  enunciado: Aplica identificación por igualdad de factor literal en una expresión
    algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de identificación por igualdad
    de factor literal.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
checkpoints:
