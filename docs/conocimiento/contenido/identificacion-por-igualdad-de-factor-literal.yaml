    por igualdad de factor literal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al desarrollar un ejercicio de identificación por igualdad de factor literal,
    ¿qué paso es indispensable?
  choices:
  - text: Respetar la ley de signos al reducir términos o eliminar paréntesis
    is_correct: true
  - text: Eliminar la parte literal sin operar los coeficientes
    is_correct: false
  - text: Cambiar los signos al azar
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Respetar la ley de signos al reducir términos
