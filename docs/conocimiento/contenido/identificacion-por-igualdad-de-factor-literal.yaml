resumen_inicial: La identificación de términos semejantes por igualdad de factor literal
  analiza la coincidencia estructural del bloque de variables independientemente del
  orden de los factores.
explicacion_simple: Para saber si dos términos son semejantes, miramos el bloque completo
  de letras (el factor literal). Por ejemplo, en $5a^2b$ y $-9a^2b$, el factor literal
  es $a^2b$ en ambos. Al ser exactamente igual, los términos son semejantes.
explicacion_formal: 'Sea $L(T) = \prod_{j=1}^m x_j^{e_j}$ el factor literal del término
  $T$. La **Identificación por Factor Literal** establece:


  $$L(T_1) = L(T_2) \implies T_1 \sim T_2$$


  > **Complemento didáctico:** El factor literal opera como el identificador genérico
  que agrupa términos dentro de la adición polinomial.'
definiciones_clave: '- **Factor literal $L(T)$**: Producto unificado de potencias
  de variables presentes en el término.'
propiedades_relaciones: '- **Agrupación aditiva**: $c_1 L + c_2 L = (c_1 + c_2)L$.'
ejemplo_guiado:
  enunciado: Verifique la semejanza entre $T_1 = \frac{2}{3}u^4v^3$ y $T_2 = -7u^4v^3$
    identificando su factor literal.
  pasos:
  - 'Paso 1: Factor literal de $T_1$: $L_1 = u^4v^3$.

    - Paso 2: Factor literal de $T_2$: $L_2 = u^4v^3$.'
  - 'Paso 3: Comprobar la igualdad: $L_1 = L_2 = u^4v^3$.'
  - 'Conclusión: Comparten el mismo factor literal, luego son términos semejantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué elemento determina la semejanza al aplicar el criterio del factor
    literal?
  choices:
  - text: La coincidencia del producto unificado de potencias literales L(T1) = L(T2)
    is_correct: true
  - text: La suma de los coeficientes numéricos
    is_correct: false
  - text: El número de signos negativos en el término
    is_correct: false
  - text: Que los términos sean constantes
    is_correct: false
  explanation: La alternativa correcta es 'La coincidencia del producto unificado
    de potencias literales L(T1) = L(T2)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (2/3)u^4v^3 y -7u^4v^3, ¿cuál fue el factor
    literal compartido?
  choices:
  - text: u^4v^3
    is_correct: true
  - text: 2/3
    is_correct: false
  - text: '-7'
    is_correct: false
  - text: u v
    is_correct: false
  explanation: La alternativa correcta es 'u^4v^3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer el factor literal completo del primer término.'
- 'Paso 2: Extraer el factor literal del segundo término.'
- 'Paso 3: Verificar que ambos factores literales sean numéricamente idénticos para
  todo valor del dominio.'
errores_correccion: '- **Error 1: Excluir a los exponentes como parte del factor literal.**
  **Cómo corregirlo:** El factor literal comprende a las variables junto con sus exponentes
  correspondientes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Tienen 14m^3n^2 y -m^3n^2 el mismo factor literal?
  alternativas:
  - Sí, m^3n^2
  - No, difieren en el coeficiente
  - No, difieren en m
  - Indeterminado
  respuesta: Sí, m^3n^2
  solucion_pasos:
  - 1. Ambas expresiones tienen como factor literal a m^3n^2. Son semejantes.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el factor literal en el término -19x^5y^8?
  alternativas:
  - x^5y^8
  - '-19'
  - 5 8
  - x y
  respuesta: x^5y^8
  solucion_pasos:
  - 1. Quitar el coeficiente -19 deja el factor literal x^5y^8.
- titulo: ¿Es el factor literal de -a^4b^2 idéntico al de 10a^4b^2?
  respuesta: Sí
  solucion_pasos:
  - Sí, en ambos términos el factor literal es a^4b^2.
- titulo: ¿Cambia el factor literal de un término si se le cambia el signo al coeficiente
    numérico?
  respuesta: 'No'
  solucion_pasos:
  - No, el signo pertenece al coeficiente escalar y no altera el factor literal.
errores_frecuentes:
- Declarar que el coeficiente numérico forma parte del factor literal del término.
- Declarar que términos con distinto factor literal se pueden sumar como semejantes.
- Omitir las potencias al escribir la respuesta del factor literal.
- Declarar el factor literal de un monomio con la constante que lo acompaña.
- Declarar que los factores literales de expresiones con fracciones son diferentes.
afirmaciones_verdaderas:
- El factor literal de un término está formado por sus variables con sus exponentes
  respectivos.
- Términos con igual factor literal se pueden factorizar agrupando sus coeficientes
  escalarmente.
al_terminar_debes_poder: Al terminar serás capaz de identificar el factor literal
  común entre varios términos algebraicos para establecer su semejanza.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.
estado: publicado
