semantic_id: MAT.ALG.SIMILARIDAD.IGUALDAD_FACTOR_LITERAL
resumen_inicial: La identificación por igualdad de factor literal consiste en verificar analíticamente que las bases y exponentes de las letras constituyan una identidad completa para declarar la semejanza de monomios.
explicacion_simple: "Para determinar si dos términos algebraicos son semejantes, debes enfocar toda tu atención en su **factor literal**:\n- **Factor literal**: Es el bloque entero formado por las variables y sus exponentes (ignorando los coeficientes).\n- **Regla de verificación**:\n  1. Las **mismas letras** deben estar presentes en ambos términos.\n  2. Cada letra debe tener **el mismo exponente** en ambos términos.\n- **Ejemplo 1**: $6a^3 b^2$ y $-10a^3 b^2$\n  - Factor literal 1: $a^3 b^2$.\n  - Factor literal 2: $a^3 b^2$.\n  - ¡Son idénticos! $\\implies$ **Semejantes**.\n- **Ejemplo 2**: $6a^3 b^2$ y $6a^2 b^3$\n  - Factor literal 1: $a^3 b^2$.\n  - Factor literal 2: $a^2 b^3$.\n  - Los exponentes de $a$ y $b$ cambiaron de posición $\\implies$ **NO son semejantes**.\n\n![Identificación por Igualdad de Factor Literal](/static/img/nodos/identificacion-por-igualdad-de-factor-literal-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $FL: \mathcal{M} \to \mathcal{P}(\mathbb{V} \times \mathbb{N}_0)$ el operador proyectivo que mapea un monomio $M = c \prod x_i^{a_i}$ en su conjunto ordenado de pares base-exponente (factor literal). Dos monomios $M_1$ y $M_2$ cumplen la **igualdad de factor literal** si y solo si sus proyecciones bajo $FL$ son formalmente idénticas:


  $$M_1 \sim M_2 \iff FL(M_1) = FL(M_2) \iff \prod_{i=1}^k x_i^{a_i} = \prod_{i=1}^k x_i^{b_i}$$


  ### Criterio de Coincidencia de Estructura Multivariable

  Para que $FL(M_1) = FL(M_2)$, se deben verificar simultáneamente dos condiciones algebraicas:

  1. **Coincidencia de Dominios de Variables**: $\operatorname{Vars}(M_1) = \operatorname{Vars}(M_2)$.

  2. **Coincidencia Puntual de Exponentes**: $\deg_{x_i}(M_1) = \deg_{x_i}(M_2)$ para toda variable $x_i$.


  ### Síntesis didáctica

  La igualdad del factor literal es la propiedad que garantiza que los términos representen las mismas dimensiones o unidades de medida en ecuaciones de física y geometría.

  '
definiciones_clave: '- **Igualdad de factor literal**: Coincidencia total en el conjunto de variables y sus potencias correspondientes.

  - **Grado relativo por variable ($\deg_{x_i}(M)$)**: Exponente exacto al que está elevada una variable específica dentro del monomio.

  - **Dominio de variables ($\operatorname{Vars}(M)$)**: Conjunto de letras distintas que componen la parte literal.

  '
propiedades_relaciones: '- **Invarianza por permutación de factores**: Por la conmutatividad del producto, el factor literal $x^2 y^3$ es idéntico a $y^3 x^2$.

  - **Independencia del dominio de coeficientes**: El tipo de número del coeficiente (entero, racional, irracional) no altera la igualdad del factor literal.

  '
ejemplo_guiado:
  enunciado: Verifica si los términos $\frac{5}{3}m^4 n$ y $-8m^4 n$ poseen igualdad de factor literal.
  pasos:
  - 'Paso 1: Extraemos el factor literal del primer término: $FL(T_1) = m^4 n$.'
  - 'Paso 2: Extraemos el factor literal del segundo término: $FL(T_2) = m^4 n$.'
  - 'Paso 3: Comprobamos la variable $m$: Tiene exponente $4$ en ambos términos.'
  - 'Paso 4: Comprobamos la variable $n$: Tiene exponente $1$ implícito en ambos términos.'
  - 'Conclusión: Como $FL(T_1) = FL(T_2) = m^4 n$, los términos **tienen igualdad de factor literal y son semejantes**.'
  imagen: /static/img/nodos/identificacion-por-igualdad-de-factor-literal-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué dos condiciones deben cumplirse simultáneamente para afirmar que existe igualdad de factor literal entre dos monomios?
  choices:
  - text: Deben tener las mismas variables y cada variable debe tener el mismo exponente en ambos monomios
    is_correct: true
  - text: Deben tener los mismos coeficientes y el mismo signo
    is_correct: false
  - text: Deben estar ordenados alfabéticamente y tener coeficientes enteros
    is_correct: false
  - text: Deben ser números impares
    is_correct: false
  explanation: La alternativa correcta es 'Deben tener las mismas variables y cada variable debe tener el mismo exponente en ambos monomios'. Coincidencia de letras y exponentes.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Poseen igualdad de factor literal los términos $3u^2 v^5$ y $-7u^2 v^5$?
  choices:
  - text: Sí, ambos tienen el factor literal $u^2 v^5$
    is_correct: true
  - text: No, porque sus coeficientes $3$ y $-7$ no son iguales
    is_correct: false
  - text: No, porque el segundo término es negativo
    is_correct: false
  - text: No, porque las variables no son $x$ e $y$
    is_correct: false
  explanation: La alternativa correcta es 'Sí, ambos tienen el factor literal $u^2 v^5$'. Coincidencia $u^2 v^5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los factores literales de ambos monomios aislándolos de sus coeficientes.'
- 'Paso 2: Comprobar que todas las variables del primer término estén presentes en el segundo.'
- 'Paso 3: Verificar que los exponentes de cada variable coincidan uno a uno.'
- 'Paso 4: Declarar que existe igualdad de factor literal y por ende semejanza.'
errores_correccion: '- **Error 1:** Considerar que $x^2 y^3$ e $x^3 y^2$ tienen igualdad de factor literal por tener las mismas letras. **Cómo corregirlo:** Los exponentes de cada letra **DEBEN COINCIDIR EXACTAMENTE ($x$ tiene exponente 2 en uno y 3 en el otro)**.

  - **Error 2:** Ignorar exponentes implícitos iguales a $1$ ($x$ equivale a $x^1$). **Cómo corregirlo:** Una letra sin exponente explícito **TIENE EXPONENTE 1 ($x = x^1$)**.

  '
ejemplos:
- titulo: Igualdad exacta
  enunciado: ¿Poseen los términos $-4x y^3$ y $11x y^3$ la misma parte literal?
  alternativas:
  - Sí, ambos poseen $x y^3$
  - No, difieren en los coeficientes
  - No, difieren en las letras
  respuesta: Sí, ambos poseen $x y^3$
  solucion_pasos:
  - 1. $FL_1 = x y^3$. $FL_2 = x y^3$.
  - 2. Identidad de factor literal.
- titulo: Exponente unitario implícito
  enunciado: ¿Tienen igualdad de factor literal los términos $2a b^4$ y $-9a^1 b^4$?
  alternativas:
  - Sí, $a$ y $a^1$ son idénticos
  - No, falta el 1 en el primero
  - No, difieren en la letra b
  respuesta: Sí, $a$ y $a^1$ son idénticos
  solucion_pasos:
  - 1. $a = a^1$.
  - 2. Ambos factores literales coinciden en $a^1 b^4$.
- titulo: Invarianza de orden
  enunciado: ¿Es el factor literal de $3x^2 y$ idéntico al factor literal de $-5y x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la conmutatividad de la multiplicación ($x^2 y = y x^2$).
- titulo: Incompatibilidad de exponentes
  enunciado: ¿Carecen de igualdad de factor literal los términos $x^4 y$ y $x y^4$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^4 y \neq x y^4$ porque los exponentes están invertidos.
errores_frecuentes:
- Declarar la igualdad del factor literal considerando únicamente las letras e ignorando los exponentes.
- Considerar que la letra x sin exponente escrito posee exponente cero en lugar de exponente uno.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que el cambio de orden de las variables invalida la igualdad del factor literal.
- Incluir el coeficiente numérico como parte del factor literal.
afirmaciones_verdaderas:
- La igualdad de factor literal requiere la coincidencia exacta de todas las variables y sus respectivos exponentes.
- El orden en que se escriben las variables multiplicadas no altera la igualdad de su factor literal.
al_terminar_debes_poder: '![Resumen de factor literal](/static/img/nodos/identificacion-por-igualdad-de-factor-literal-resumen.svg)


  QUÉ: Reconocer la semejanza de términos a partir de la correspondencia exacta de su repertorio de variables.


  CÓMO: Verificar que ambos términos compartan las mismas letras $\operatorname{Var}(T_1) = \operatorname{Var}(T_2)$, descartando monomios con variables extra o faltantes.'
