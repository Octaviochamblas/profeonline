semantic_id: MAT.GEO.AREAS_TRIANGULOS.TRIANGULOS_IGUAL_BASE
resumen_inicial: 'Todos los triángulos que tienen la misma base y cuyos vértices opuestos están sobre una recta paralela a la base tienen exactamente la misma área, porque comparten la misma altura.'
explicacion_simple: |
  ![Triángulos entre Paralelas: Áreas Equivalentes](/static/img/nodos/igualdad-de-areas-de-triangulos-con-igual-base-entre-paralelas-intro.svg)

  Si fijas la base en el piso y mueves la punta del triángulo hacia los lados a lo largo de una línea horizontal paralela al piso, el área nunca cambia porque la altura sigue siendo la misma.
explicacion_formal: |
  ### Teorema formal (Euclides I.37)
  Sean dos rectas paralelas $\mathcal{L}_1 \parallel \mathcal{L}_2$ en el plano euclidiano. Si un segmento $\overline{AB} \subset \mathcal{L}_1$ actúa como base común de una familia de triángulos con vértices $C_i \in \mathcal{L}_2$, entonces todos los triángulos de la familia poseen **áreas estrictamente iguales** (figuras equivalentes):

  $$\forall C_1, C_2 \in \mathcal{L}_2, \quad \operatorname{Área}(\Delta ABC_1) = \operatorname{Área}(\Delta ABC_2) = \frac{1}{2} \|\overline{AB}\| \cdot d(\mathcal{L}_1, \mathcal{L}_2)$$

  ### Desglose simbólico y geométrico
  - $\overline{AB}$: Base común de longitud constante $b$.
  - $h = d(\mathcal{L}_1, \mathcal{L}_2)$: Distancia constante entre las rectas paralelas.
  - Deformación por cizalla (shear mapping): Una transformación afín de cizallamiento conserva el determinante Jacobiano $|J| = 1$, manteniendo el área constante.

  ### Síntesis didáctica
  Este teorema permite transformar triángulos oblicuos en triángulos rectángulos de igual área para simplificar demostraciones y cálculos de áreas complejas.
definiciones_clave: |
  - **Área**: Medida bidimensional de la superficie encerrada por un polígono o curva cerrada.
  - **Base ($b$)**: Lado de referencia sobre el cual se mide la altura perpendicular.
  - **Altura ($h$)**: Distancia ortogonal más corta entre el vértice y la recta que contiene a la base.
propiedades_relaciones: |
  - **Invarianza**: El área de una figura es la misma sin importar el método o base utilizada.
  - **Aditividad**: El área de una región compuesta es la suma de las áreas de sus partes disjuntas.
  - **Unidades cuadradas**: Toda área se expresa en unidades de longitud elevadas al cuadrado ($[L]^2$).
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Triángulos entre Paralelas: Áreas Equivalentes](/static/img/nodos/igualdad-de-areas-de-triangulos-con-igual-base-entre-paralelas-ejemplos.svg)

    Aplica el procedimiento geométrico para resolver y verificar el cálculo del área correspondiente a este concepto.
  pasos:
  - 'Paso 1: Identificar las magnitudes lineales dadas y verificar que compartan la misma unidad de medida.'
  - 'Paso 2: Seleccionar la fórmula geométrica adecuada según los datos disponibles.'
  - 'Paso 3: Sustituir los valores numéricos en la expresión algebraica.'
  - 'Paso 4: Realizar las operaciones aritméticas y simplificar el resultado.'
  - 'Paso 5: Registrar el resultado final acompañado de sus unidades cuadradas ($[L]^2$).'
checkpoints:
- placement: after_explicacion_formal
  question: Si dos triángulos comparten la misma base y sus terceros vértices están en una recta paralela a dicha base, ¿qué se puede afirmar sobre sus áreas?
  choices:
  - text: Tienen exactamente la misma área
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'Se afirma que Tienen exactamente la misma área porque al estar entre paralelas comparten la misma altura perpendicular $h$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Dos triángulos con la misma área tienen obligatoriamente el mismo perímetro?
  choices:
  - text: No, pueden tener la misma área pero perímetros completamente distintos
    is_correct: true
  - text: $10\text{ cm}^2$
    is_correct: false
  - text: $100\text{ cm}^2$
    is_correct: false
  - text: $5\text{ cm}^2$
    is_correct: false
  explanation: 'No, pueden tener la misma área pero perímetros completamente distintos; dos figuras equivalentes en área no son necesariamente isoperimétricas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos geométricos disponibles (base y altura, tres lados, dos lados y ángulo, o coordenadas).'
- 'Paso 2: Seleccionar la fórmula correspondiente ($b h / 2$, Herón, trigonométrica o determinante).'
- 'Paso 3: Homogeneizar todas las unidades de longitud a la misma escala métrica.'
- 'Paso 4: Evaluar algebraicamente la fórmula y simplificar radicales o fracciones.'
- 'Paso 5: Expresar la respuesta con su unidad de superficie al cuadrado.'
errores_correccion: 'Verifica siempre que la altura utilizada sea perpendicular a la base elegida y no olvides dividir por 2 en las fórmulas de área triangular.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de aplicar la fórmula de área correspondiente con los datos dados?
  alternativas:
  - 'No, pueden tener la misma área pero perímetros completamente distintos'
  - 'Valor alternativo incorrecto 1'
  - 'Valor alternativo incorrecto 2'
  respuesta: 'No, pueden tener la misma área pero perímetros completamente distintos'
  solucion_pasos:
  - 'No, pueden tener la misma área pero perímetros completamente distintos; dos figuras equivalentes en área no son necesariamente isoperimétricas.'
- titulo: Ejemplo 2
  enunciado: ¿El área de un triángulo se expresa en unidades lineales simples (como cm o m) o en unidades cuadradas (como cm² o m²)?
  alternativas:
  - En unidades cuadradas (como cm² o m²)
  - En unidades lineales simples
  - En unidades cúbicas
  respuesta: En unidades cuadradas (como cm² o m²)
  solucion_pasos:
  - 'El área es una magnitud bidimensional que se mide siempre en unidades cuadradas.'
- titulo: ¿El área de un triángulo depende de la base que se elija?
  respuesta: 'No'
  solucion_pasos:
  - 'No, el área es invariante: cualquier par de base y su altura homóloga entrega exactamente la misma área.'
- titulo: ¿Dos triángulos con igual base y altura tienen la misma área aunque tengan formas diferentes?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, porque $A = (b \cdot h)/2$, dependiendo únicamente de las magnitudes numéricas de la base y la altura.'
errores_frecuentes:
- 'Olvidar dividir por 2 al calcular el área de un triángulo ($b \times h$).'
- 'Multiplicar bases y alturas que no son perpendiculares entre sí.'
- 'Mezclar unidades métricas sin convertir previamente (ej: sumar cm con metros).'
- 'Confundir el perímetro (longitud del contorno) con el área (superficie encerrada).'
- 'Olvidar el valor absoluto en la fórmula de Gauss por coordenadas.'
afirmaciones_verdaderas:
- 'El área de un triángulo es igual al semiproducto de la base por su altura relativa ($A = \frac{b \cdot h}{2}$).'
- 'El área es una magnitud escalar bidimensional estrictamente no negativa.'
al_terminar_debes_poder: |
  **QUÉ:** Calcular y analizar el área de triángulos y regiones poligonales mediante diversas fórmulas geométricas y analíticas.

  **CÓMO:** Aplicando las fórmulas $A = \frac{bh}{2}$, $A = \frac{L^2\sqrt{3}}{4}$, Herón $A = \sqrt{s(s-a)(s-b)(s-c)}$, $A = \frac{1}{2}ab\sin\gamma$ y determinante cartesiano.

  ![Resumen de Áreas de Triángulos](/static/img/nodos/igualdad-de-areas-de-triangulos-con-igual-base-entre-paralelas-resumen.svg)
