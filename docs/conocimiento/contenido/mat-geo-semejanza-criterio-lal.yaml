procedimiento:
- 'Paso 1: Identifica dos lados de cada triángulo y calcula la razón entre ellos.'
- 'Paso 2: Verifica que el ángulo comprendido entre esos dos lados sea igual en ambos
  triángulos.'
- 'Paso 3: Si la razón de lados coincide y el ángulo comprendido es igual, concluye
  semejanza por LAL.'
