semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CRITERIO_LAL
resumen_inicial: 'Criterio de semejanza LAL: dos pares de lados proporcionales y ángulo
  comprendido congruente: conceptos, teoremas, propiedades geométricas y cálculo en
  Congruencia, Semejanza y Homotecia.'
explicacion_simple: El tercer criterio abreviado de semejanza combina proporcionalidad
  de lados con igualdad de un ángulo, de forma análoga al LAL de congruencia.
explicacion_formal: '![Criterio de semejanza LAL](/static/img/geometria/congruencia-semejanza/semejanza-criterio-lal.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C'' se cumple $\frac{AB}{A''''B''''$}$=\frac{AC}{A''C''}$
  y $\angle A=\angle A''$ (el ángulo comprendido entre esos lados), entonces $\triangle
  ABC\sim\triangle A''B''C''$.


  ### Desarrollo didáctico


  Este criterio es útil cuando se conocen solo dos lados y el ángulo entre ellos,
  sin necesidad de calcular o medir el tercer lado; la condición clave es que el ángulo
  debe ser exactamente el comprendido entre los dos lados usados en la proporción.'
definiciones_clave: '- **Criterio de semejanza LAL: dos pares de lados proporcionales
  y ángulo comprendido congruente**: Elemento o propiedad fundamental en el estudio
  de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a criterio de semejanza lal: dos pares de lados
  proporcionales y ángulo comprendido congruente.'
