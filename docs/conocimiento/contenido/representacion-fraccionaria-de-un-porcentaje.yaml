procedimiento:
- 'Paso 1: Escribe el porcentaje como fracción $x/100$.'
- 'Paso 2: Simplifica dividiendo por 2, 5 o múltiplos de 10 hasta que sea irreductible.'
- 'Paso 3: Utiliza esa fracción multiplicando por el numerador y dividiendo por el denominador.'
errores_correccion: Evita confundir los datos de entrada al operar con representación fraccionaria
  de un porcentaje.
ejemplos:
- titulo: Uso de la fracción equivalente
  enunciado: Calcula el 25% de 800.
  solucion_pasos:
  - Sabemos que 25% es $1/4$.
  - Multiplicamos $800 \cdot (1/4)$.
  - 'Es lo mismo que dividir por 4: $800 / 4 = 200$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la fracción irreducible equivalente a 75%?
  alternativas:
  - 3/4
  - 3/40
  - 75/4
  respuesta: 3/4
  solucion_pasos:
  - 75/100 simplificado dividiendo por 25 es igual a 3/4.
- titulo: Ejemplo 3
  enunciado: Usando fracciones, ¿cuál es el 50% de 90?
  alternativas:
  - '45'
  - '30'
  - '60'
  respuesta: '45'
  solucion_pasos:
  - 50% es 1/2; 90 dividido entre 2 es igual a 45.
- titulo: ¿10% equivale a la fracción 1/10?
  respuesta: Sí
  solucion_pasos:
  - Porque 10/100 simplificado dividiendo por 10 es igual a 1/10.
errores_frecuentes:
- Creer que $20\%$ es $1/20$ (es $1/5$, porque $100/20 = 5$).
- Creer que $10\%$ equivale a dividir por 100 (equivale a dividir por 10).
- Tratar de simplificar porcentajes como $17\%$ que son primos y no se pueden simplificar
  (queda $17/100$).
- Creer que 20% equivale a 1/20, cuando en realidad equivale a 1/5.
- Intentar simplificar porcentajes primos, como 17%, que no tienen una fracción irreducible
  más simple que 17/100.
afirmaciones_verdaderas:
- La propiedad de representación fraccionaria de un porcentaje preserva la consistencia lógica.
- Toda fracción equivalente de un porcentaje debe simplificarse dividiendo numerador y denominador
  por su máximo común divisor.
al_terminar_debes_poder: Resolver problemas aplicados que involucren representación fraccionaria
  de un porcentaje.
