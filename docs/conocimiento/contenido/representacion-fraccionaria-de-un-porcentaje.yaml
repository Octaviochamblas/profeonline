semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_FRACCIONARIA
resumen_inicial: 'Representación fraccionaria de un porcentaje: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: Trabajar el 75% de un número multiplicando por 0.75 es válido, pero ¿no
  es más rápido multiplicar por 3 y dividir por 4? Las fracciones irreductibles son los 'atajos
  ninja' de los porcentajes.
explicacion_formal: 'Todo porcentaje es la fracción $x/100$. Muchas veces, esa fracción se
  puede simplificar dividiendo numerador y denominador por un factor común.


  Estas **fracciones irreductibles equivalentes** te permiten hacer cálculos mentalmente mucho
  más rápido que usando decimales.

  - $10\% = 10/100 = 1/10$ (dividir por 10)

  - $20\% = 20/100 = 1/5$ (dividir por 5)

  - $25\% = 25/100 = 1/4$ (dividir por 4)

  - $50\% = 50/100 = 1/2$ (la mitad)

  - $75\% = 75/100 = 3/4$ (tres cuartas partes)'
definiciones_clave: '- **Representación fraccionaria de un porcentaje**: Elemento central
  dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a representación fraccionaria de un porcentaje.'
ejemplo_guiado:
  enunciado: Calcula el 20% de 350 usando la fracción equivalente irreducible.
  pasos:
  - Identifico que 20% equivale a la fracción 20/100, que simplificada es 1/5.
  - 'Aplico la fracción a la cantidad: 350 dividido entre 5.'
  - 'Calculo el resultado: 70. El 20% de 350 es 70.'
