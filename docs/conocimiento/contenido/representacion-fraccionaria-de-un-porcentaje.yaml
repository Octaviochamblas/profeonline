resumen_inicial: La representación fraccionaria de un porcentaje $P\%$ consiste en
  expresar $\frac{P}{100}$ y simplificarla a su fracción irreducible $\frac{a}{b}$.
explicacion_simple: Para escribir un porcentaje como fracción simplificada, ponemos
  el número sobre 100 y simplificamos arriba y abajo dividiendo por el mismo divisor.
  Por ejemplo, el 50% es $50/100$, que al simplificarse por 50 da $1/2$.
explicacion_formal: 'Para todo porcentaje $P \in \mathbb{N}$, la **Forma Fraccionaria
  Irreducible** se define simplificando el cociente por su Máximo Común Divisor (MCD):


  $$P\% = \frac{P}{100} = \frac{P : \text{MCD}(P, 100)}{100 : \text{MCD}(P, 100)}
  = \frac{a}{b}$$


  **Fracciones notables de referencia:**

  - $25\% = 1/4$, $50\% = 1/2$, $75\% = 3/4$, $20\% = 1/5$.'
definiciones_clave: '- **Representación fraccionaria**: Fracción simplificada $\frac{a}{b}$
  equivalente a $\frac{P}{100}$.'
propiedades_relaciones: '- **Fracción irreducible**: Reducción por el $\text{MCD}(P,
  100)$.'
ejemplo_guiado:
  enunciado: Exprese el $40\%$ como fracción irreducible.
  pasos:
  - 'Paso 1: Formar la fracción de base cien: $\frac{40}{100}$.'
  - 'Paso 2: Determinar el $\text{MCD}(40, 100) = 20$.'
  - 'Paso 3: Simplificar dividiendo numerador y denominador por $20$: $\frac{40:20}{100:20}
    = \frac{2}{5}$.'
  - 'Conclusión: La fracción irreducible del $40\%$ es $\frac{2}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se obtiene la representación fraccionaria irreducible de un porcentaje
    P%?
  choices:
  - text: Escribiendo P/100 y simplificando la fracción dividiendo por el MCD
    is_correct: true
  - text: Invirtiendo la fracción a 100/P
    is_correct: false
  - text: Multiplicando P por 100
    is_correct: false
  - text: Sumando P + 100
    is_correct: false
  explanation: La alternativa correcta es 'Escribiendo P/100 y simplificando la fracción
    dividiendo por el MCD'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 40%, ¿cuál fue la fracción irreducible resultante?
  choices:
  - text: 2/5
    is_correct: true
  - text: 4/10
    is_correct: false
  - text: 1/4
    is_correct: false
  - text: 3/5
    is_correct: false
  explanation: La alternativa correcta es '2/5'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de convertir porcentajes a su fracción
  irreducible $\frac{a}{b}$ dividiendo por el $\text{MCD}(P, 100)$.
semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_FRACCIONARIA
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.REPRESENTACION_FRACCIONARIA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
