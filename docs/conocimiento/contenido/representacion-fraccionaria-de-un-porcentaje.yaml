semantic_id: MAT.NUM.PORCENTAJES.REP_FRACCION
resumen_inicial: La representación fraccionaria de un porcentaje $p\%$ se obtiene
  escribiendo la razón $\frac{p}{100}$ y simplificándola hasta su forma irreducible
  dividiendo numerador y denominador por su MCD.
explicacion_simple: '![Representación fraccionaria de un porcentaje](/static/img/nodos/representacion-fraccionaria-de-un-porcentaje-intro.svg)


  Convertir un porcentaje a fracción irreducible te permite hacer cálculos mentales
  instantáneos sin necesidad de usar calculadora. Solo debes escribir el porcentaje
  sobre $100$ y simplificar. Por ejemplo, $50\% = \frac{50}{100} = \frac{1}{2}$ (la
  mitad), $25\% = \frac{25}{100} = \frac{1}{4}$ (la cuarta parte), y $20\% = \frac{20}{100}
  = \frac{1}{5}$ (la quinta parte).

  '
explicacion_formal: '### Algoritmo de simplificación canónica

  Dado un porcentaje $p\% \in \mathbb{Q}^+$, su representación fraccionaria irreducible
  $\frac{a}{b}$ se obtiene mediante:

  $$p\% = \frac{p}{100} = \frac{p \div \operatorname{mcd}(p, 100)}{100 \div \operatorname{mcd}(p,
  100)} = \frac{a}{b} \quad \text{con } \operatorname{mcd}(a,b) = 1$$


  ### Porcentajes con decimales a fracción

  Si el porcentaje posee parte decimal $p = \frac{N}{10^k}$, se amplifica previamente
  por $10^k$:

  $$p\% = \frac{p}{100} = \frac{p \cdot 10^k}{100 \cdot 10^k} = \frac{N}{100 \cdot
  10^k}$$

  y luego se simplifica por el MCD correspondiente.


  ### Tabla de equivalencias fundamentales

  - $10\% = \frac{1}{10}$

  - $20\% = \frac{1}{5}$

  - $25\% = \frac{1}{4}$

  - $50\% = \frac{1}{2}$

  - $75\% = \frac{3}{4}$

  '
definiciones_clave: '- **Fracción irreducible**: Fracción $\frac{a}{b}$ donde $a$
  y $b$ son coprimos (su MCD es $1$).

  - **Fracción generatriz de porcentaje**: Forma simplificada que representa la razón
  de partes sobre 100.

  - **Amplificación decimal previa**: Multiplicación por potencias de 10 para eliminar
  decimales del numerador antes de simplificar.

  '
propiedades_relaciones: '- **Unicidad de la fracción irreducible**: Cada porcentaje
  racional posee una única representación fraccionaria irreducible.

  - **Operador de división rápida**: Calcular el $25\%$ de una cantidad equivale exactamente
  a dividirla entre $4$.

  '
ejemplo_guiado:
  enunciado: Convierte el $75\%$ a fracción irreducible y luego determina a qué porcentaje
    equivale la fracción $\frac{2}{5}$.
  pasos:
  - 'Paso 1: Escribimos el $75\%$ como fracción con denominador 100: $\frac{75}{100}$.'
  - 'Paso 2: Hallamos el $\operatorname{mcd}(75, 100) = 25$ y simplificamos: $\frac{75
    \div 25}{100 \div 25} = \frac{3}{4}$.'
  - 'Paso 3: Para la fracción $\frac{2}{5}$, amplificamos para que el denominador
    sea 100 (multiplicamos por 20): $\frac{2 \cdot 20}{5 \cdot 20} = \frac{40}{100}$.'
  - 'Paso 4: Conclusión: $75\% = \frac{3}{4}$ y $\frac{2}{5} = 40\%$.'
  imagen: /static/img/nodos/representacion-fraccionaria-de-un-porcentaje-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fracción irreducible equivalente al $20\%$?
  choices:
  - text: $\frac{1}{5}$
    is_correct: true
  - text: $\frac{2}{10}$
    is_correct: false
  - text: $\frac{20}{100}$
    is_correct: false
  - text: $\frac{1}{4}$
    is_correct: false
  explanation: La alternativa correcta es $\frac{1}{5}$. $\frac{20}{100} = \frac{20
    \div 20}{100 \div 20} = \frac{1}{5}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué porcentaje equivale exactamente la fracción $\frac{3}{8}$?
  choices:
  - text: $37,5\%$
    is_correct: true
  - text: $38\%$
    is_correct: false
  - text: $30\%$
    is_correct: false
  - text: $3,75\%$
    is_correct: false
  explanation: La alternativa correcta es $37,5\%$. $\frac{3}{8} = 0,375 \implies
    0,375 \cdot 100\% = 37,5\%$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el número del porcentaje sobre 100 en forma de fracción: $\frac{p}{100}$.'
- 'Paso 2: Si $p$ tiene decimales, amplificar numerador y denominador por $10, 100$,
  etc., para obtener números enteros.'
- 'Paso 3: Calcular el $\operatorname{mcd}(\text{numerador}, \text{denominador})$.'
- 'Paso 4: Dividir ambos términos por el MCD para obtener la fracción irreducible
  $\frac{a}{b}$.'
errores_correccion: '- **Error 1:** No simplificar hasta la fracción irreducible (ej:
  dejar $\frac{50}{100}$ o $\frac{5}{10}$ en vez de $\frac{1}{2}$).

  - **Error 2:** Invertir la fracción al calcular (ej: multiplicar por $4$ en lugar
  de dividir entre $4$ para hallar el $25\% = \frac{1}{4}$).

  '
ejemplos:
- titulo: Simplificación a fracción notable
  enunciado: ¿A qué fracción irreducible equivale el $60\%$?
  alternativas:
  - $\frac{3}{5}$
  - $\frac{6}{10}$
  - $\frac{3}{4}$
  - $\frac{60}{100}$
  respuesta: $\frac{3}{5}$
  solucion_pasos:
  - 1. Escribimos $\frac{60}{100}$.
  - '2. Dividimos entre $\operatorname{mcd}(60, 100) = 20$: $\frac{60 \div 20}{100
    \div 20} = \frac{3}{5}$.'
- titulo: Equivalencia de 50%
  enunciado: ¿El $50\%$ de una cantidad equivale a multiplicarla por la fracción $\frac{1}{2}$
    (o dividirla entre 2)?
  respuesta: Sí
  solucion_pasos:
  - Sí. $50\% = \frac{50}{100} = \frac{1}{2}$.
- titulo: Porcentaje con decimal a fracción
  enunciado: ¿El $12,5\%$ equivale a la fracción irreducible $\frac{1}{8}$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $\frac{12,5}{100} = \frac{125}{1000} = \frac{1}{8}$ (al simplificar por 125).
- titulo: Fracción a porcentaje
  enunciado: ¿La fracción $\frac{3}{4}$ equivale al $75\%$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $\frac{3}{4} = 0,75 \implies 0,75 \cdot 100\% = 75\%$.
errores_frecuentes:
- No simplificar completamente la fracción dejando factores comunes residuales.
- Confundir 1/5 (20%) con 1/4 (25%) o 1/8 (12,5%).
- Olvidar amplificar por potencias de 10 cuando el porcentaje contiene cifras decimales.
afirmaciones_verdaderas:
- Toda fracción irreducible equivalente a un porcentaje se obtiene simplificando la
  razón p/100 por el MCD.
- El 25% equivale exactamente a la cuarta parte (1/4) de la cantidad total.
al_terminar_debes_poder: '![Resumen de representación fraccionaria de un porcentaje](/static/img/nodos/representacion-fraccionaria-de-un-porcentaje-resumen.svg)


  QUÉ: Convertir porcentajes a fracciones irreductibles y viceversa para agilizar
  el cálculo aritmético.

  CÓMO: Escribiendo la razón $\frac{p}{100}$, amplificando si hay decimales y dividiendo
  por el $\operatorname{mcd}(p, 100)$ para obtener la fracción canónica $\frac{a}{b}$.

  '
