semantic_id: MAT.FUND.TABLAS_VERDAD.CONTRADICCION
resumen_inicial: 'Definición, identificación y propiedades de las contradicciones lógicas como proposiciones falsas en todas sus interpretaciones posibles.'
explicacion_simple: |
  Una **contradicción** (o falsedad lógica) es lo opuesto exacto a una tautología: es una afirmación que resulta **siempre Falsa ($F$)**, sin importar los valores de las proposiciones simples que la forman. Cuando construyes su tabla de verdad, **todas las filas de la columna final son $F$**. Un ejemplo clásico es: "Hoy llueve y hoy no llueve" ($p \land \neg p$); es imposible que ambas cosas ocurran al mismo tiempo, por lo que la afirmación es universalmente falsa.

  ![Infografía: Contradicción](/static/img/nodos/contradiccion-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, una fórmula bien formada $\Phi(p_1, \dots, p_n)$ es una **contradicción** (o falsedad lógica formal, o fórmula insatisfacible), denotada formalmente como:
  $$\Phi \equiv \bot$$
  si y solo si para toda asignación veritativa o modelo $\mathcal{M} \in \mathbb{V}^n$, la función de verdad asigna el valor falso:
  $$\forall \mathcal{M}, \quad v_\mathcal{M}(\Phi) = F$$
  En el álgebra de Boole, el vector columna principal satisface $\mathbf{v}(\Phi) = \mathbf{0} = [F, F, \dots, F]^T$.

  ### Desglose simbólico
  - Símbolo canónico: $\bot$ (falsedad o *bottom*).
  - Contradicción básica de no contradicción: $p \land \neg p \equiv \bot$.
  - Contradicción por bicondicional opuesto: $p \leftrightarrow \neg p \equiv \bot$.
  - Insatisfacibilidad: Ninguna asignación de verdad logra satisfacer a $\Phi$.

  ### Síntesis didáctica
  Una contradicción es una imposibilidad estructural del pensamiento deductivo. Afirmar una contradicción invalida cualquier argumento matemático formal.
definiciones_clave: |
  - **Contradicción ($\Phi \equiv \bot$)**: Proposición compuesta que es falsa en el 100% de las filas de su tabla de verdad.
  - **Insatisfacibilidad**: Ausencia total de modelos o combinaciones que hagan verdadera a la fórmula.
  - **Antilogía**: Denominación alternativa utilizada en lógica clásica para referirse a una contradicción estructural.
propiedades_relaciones: |
  - **Principio de Explosión (*Ex contradictione quodlibet*)**: De una contradicción se puede deducir válidamente cualquier proposición $(\bot \to q \equiv V)$.
  - **Dualidad con la tautología**: La negación de una contradicción es una tautología ($\neg \bot \equiv \top$).
ejemplo_guiado:
  enunciado: |
    Demuestra mediante tabla de verdad que la fórmula $\Phi = (p \lor q) \land (\neg p \land \neg q)$ es una contradicción.

    ![Diagrama: Contradicción](/static/img/nodos/contradiccion-ejemplos.svg)

  pasos:
    - 'Paso 1: Disponer las $4$ combinaciones canónicas para $p$ y $q$.'
    - 'Paso 2: Calcular la subcolumna $(p \lor q)$: $[V, V, V, F]^T$.'
    - 'Paso 3: Calcular la subcolumna $(\neg p \land \neg q)$:
      - Fila 1 ($F \land F$): $F$
      - Fila 2 ($F \land V$): $F$
      - Fila 3 ($V \land F$): $F$
      - Fila 4 ($V \land V$): $V$. Vector: $[F, F, F, V]^T$.'
    - 'Paso 4: Evaluar la conjunción principal entre ambas columnas:
      - Fila 1: $V \land F = F$
      - Fila 2: $V \land F = F$
      - Fila 3: $V \land F = F$
      - Fila 4: $F \land V = F$'
    - 'Paso 5: Concluir que el vector resultante es $[F, F, F, F]^T$, demostrando formalmente que la fórmula es una contradicción lógica.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué valor deben tener todas las celdas de la columna principal de una tabla de verdad para clasificarla como contradicción?'
    choices:
      - {text: 'Falso ($F$) en la totalidad de las filas', is_correct: true}
      - {text: 'Verdadero ($V$) en la totalidad de las filas', is_correct: false}
      - {text: 'Al menos un valor Verdadero y un valor Falso', is_correct: false}
      - {text: 'Verdadero en las filas pares y Falso en las impares', is_correct: false}
    explanation: 'La alternativa correcta es ''Falso ($F$) en la totalidad de las filas''. Una contradicción es universalmente falsa en toda interpretación.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes fórmulas representa una contradicción lógica fundamental?'
    choices:
      - {text: '$p \land \neg p$', is_correct: true}
      - {text: '$p \lor \neg p$', is_correct: false}
      - {text: '$p \to p$', is_correct: false}
      - {text: '$p \leftrightarrow p$', is_correct: false}
    explanation: 'La alternativa correcta es ''$p \land \neg p$''. Afirmar simultáneamente una proposición y su negación es imposible, dando siempre $F$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Construir la tabla de verdad completa con todas sus interpretaciones posibles ($2^n$ filas).'
  - 'Paso 2: Calcular metódicamente las columnas intermedias de las subfórmulas.'
  - 'Paso 3: Evaluar la columna del conectivo principal.'
  - 'Paso 4: Verificar la columna principal; si el $100\%$ de los valores son $F$, clasificar la fórmula como contradicción.'
errores_correccion: |
  - **Error 1:** Clasificar una fórmula como contradicción si tiene en su mayoría valores $F$ pero al menos un $V$. **Cómo corregirlo:** Si existe una sola fila con valor $V$, la fórmula ya no es contradicción sino una contingencia.
  - **Error 2:** Creer que una contradicción es simplemente una afirmación falsa sobre el mundo real. **Cómo corregirlo:** En lógica, una contradicción es formalmente falsa por su estructura sintáctica independientemente de los hechos empíricos.
ejemplos:
  - titulo: 'Contradicción básica'
    enunciado: '¿Cuál es la columna de $p \land \neg p$?'
    alternativas:
      - '$[F, F]^T$'
      - '$[V, V]^T$'
      - '$[V, F]^T$'
    respuesta: '$[F, F]^T$'
    solucion_pasos:
      - '1. Fila 1 ($V \land F = F$).'
      - '2. Fila 2 ($F \land V = F$).'
      - '3. Todas las filas son $F$.'
  - titulo: 'Negación de tautología'
    enunciado: '¿La negación de una tautología es siempre una contradicción?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al negar un vector compuesto exclusivamente por $V$ se obtiene un vector compuesto exclusivamente por $F$.'
  - titulo: 'Bicondicional contradictorio'
    enunciado: '¿La fórmula $p \leftrightarrow \neg p$ genera el vector $[F, F]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $V \leftrightarrow F = F$ y $F \leftrightarrow V = F$.'
  - titulo: 'Insatisfacibilidad'
    enunciado: '¿Existe algún modelo en el que una contradicción sea verdadera?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, por definición carece de asignaciones que la satisfagan.'
errores_frecuentes:
  - 'La afirmación de que una fórmula con 3 resultados falsos y 1 verdadero se clasifica como contradicción.'
  - 'La afirmación de que la fórmula $p \lor \neg p$ constituye una contradicción.'
  - 'La afirmación de que una contradicción puede poseer al menos un modelo satisfactorio.'
  - 'La afirmación de que la negación de una contradicción resulta en una contingencia.'
  - 'La afirmación de que una contradicción en una tabla de 3 variables puede contener 7 filas falsas y 1 verdadera.'
afirmaciones_verdaderas:
  - 'Una fórmula proposicional es una contradicción ($\bot$) si y solo si su columna principal en la tabla de verdad contiene exclusivamente valores falsos ($F$) en todas sus filas.'
  - 'Toda contradicción lógica es una fórmula insatisfacible y su negación formal constituye una tautología universal.'
al_terminar_debes_poder: |
  QUÉ: Identificar, demostrar y clasificar fórmulas proposicionales contradictorias ($\Phi \equiv \bot$).
  CÓMO: Construir la tabla de verdad y comprobar que el vector de la columna principal esté compuesto enteramente por valores $F$.

  ![Cuadro resumen: Contradicción](/static/img/nodos/contradiccion-resumen.svg)
