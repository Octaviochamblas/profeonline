semantic_id: MAT.ALG.CUADRADO_BINOMIO.REGLA_SUMA
resumen_inicial: 'La aplicación de la regla del cuadrado de binomio suma consiste en ejecutar el algoritmo directo de tres
  pasos: elevar el primer término al cuadrado, sumar el doble del producto de ambos términos y sumar el segundo al cuadrado.'
explicacion_simple: "Para expandir cualquier binomio suma $(a + b)^2$ sin necesidad de hacer multiplicaciones largas término\
  \ a término, aplicamos la **regla directa de 3 pasos**:\n- **FÓRMULA ALGORÍTMICA**: $(a + b)^2 = \\mathbf{a^2 + 2ab + b^2}$.\n\
  - **Pasos mecánicos**:\n  1. **Cuadrado del primero**: Eleva todo el primer término al cuadrado (coeficiente y exponentes\
  \ de letras).\n  2. **Doble producto**: Multiplica los dos términos entre sí y duplica el resultado ($2 \\cdot a \\cdot\
  \ b$).\n  3. **Cuadrado del segundo**: Eleva todo el segundo término al cuadrado.\n- **Ejemplo con coeficientes y variables**:\
  \ $(4x^2 + 3y)^2$:\n  - Paso 1: $(4x^2)^2 = 4^2 \\cdot (x^2)^2 = \\mathbf{16x^4}$.\n  - Paso 2: $2 \\cdot (4x^2) \\cdot\
  \ (3y) = 2 \\cdot 4 \\cdot 3 \\cdot x^2 y = \\mathbf{+24x^2 y}$.\n  - Paso 3: $(3y)^2 = 3^2 \\cdot y^2 = \\mathbf{+9y^2}$.\n\
  \  - Resultado final unificado: **$16x^4 + 24x^2 y + 9y^2$**.\n\n![Regla del cuadrado de binomio suma](/static/img/nodos/aplicacion-de-la-regla-del-cuadrado-de-binomio-suma-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea un binomio suma $B(x) = (c_1 x^{\alpha} + c_2 x^{\beta}) \in \mathbb{R}[x]$. La **regla de aplicación del cuadrado de
  binomio suma** define el mapeo algorítmico $\Phi_{\text{suma}}: \mathbb{R}[x] \to \mathbb{R}[x]$ dado por:


  $$\Phi_{\text{suma}}(c_1 x^{\alpha} + c_2 x^{\beta}) = (c_1^2) x^{2\alpha} + (2 c_1 c_2) x^{\alpha + \beta} + (c_2^2) x^{2\beta}$$


  ### Homogeneidad de Potencias en Exponentes Compuestos

  La regla extiende la ley de potencias de una potencia $(x^\alpha)^2 = x^{2\alpha}$ sobre los términos extremos y la adición
  lineal de exponentes $x^\alpha \cdot x^\beta = x^{\alpha+\beta}$ sobre el término central.


  ### Síntesis didáctica

  Aplicar la regla algorítmica automatiza la resolución reduciendo la carga cognitiva y evitando errores de cálculo en multiplicaciones
  compuestas.

  '
definiciones_clave: '- **Algoritmo directo de 3 pasos**: Procedimiento simplificado para resolver cuadrados de binomio mediante
  la estructura $(a)^2 + 2(a)(b) + (b)^2$.

  - **Potencia de una potencia en términos extremos**: Aplicación de la ley $(x^\alpha)^2 = x^{2\alpha}$ al elevar los componentes
  del binomio.

  - **Escalamiento del término central ($2 c_1 c_2$)**: Producto de los coeficientes numéricos de los términos multiplicado
  por la constante de duplicación 2.

  '
propiedades_relaciones: '- **Preservación del grado polinómico**: El grado del trinomio expandido es estrictamente igual al
  doble del grado máximo del binomio original: $\operatorname{deg}(TCP) = 2 \cdot \operatorname{deg}(B)$.

  - **Invarianza por ordenamiento de términos**: $(a + b)^2 = (b + a)^2 = b^2 + 2ba + a^2$.

  '
ejemplo_guiado:
  enunciado: Aplica la regla algorítmica para desarrollar el cuadrado de binomio $(5a^3 + 2b^2)^2$.
  pasos:
  - 'Paso 1: Identificamos los dos términos: $T_1 = 5a^3$ y $T_2 = 2b^2$.'
  - 'Paso 2: Aplicamos la regla para el primer término al cuadrado: $(5a^3)^2 = 5^2 \cdot (a^3)^2 = \mathbf{25a^6}$.'
  - 'Paso 3: Aplicamos la regla para el doble producto del primero por el segundo: $2 \cdot (5a^3) \cdot (2b^2) = (2 \cdot
    5 \cdot 2) a^3 b^2 = \mathbf{+20a^3 b^2}$.'
  - 'Paso 4: Aplicamos la regla para el segundo término al cuadrado: $(2b^2)^2 = 2^2 \cdot (b^2)^2 = \mathbf{+4b^4}$.'
  - 'Paso 5: Unimos los tres resultados parciales: $25a^6 + 20a^3 b^2 + 4b^4$.'
  - 'Conclusión: El trinomio cuadrado perfecto expandido es **$25a^6 + 20a^3 b^2 + 4b^4$**.'
  imagen: /static/img/nodos/aplicacion-de-la-regla-del-cuadrado-de-binomio-suma-ejemplos.svg
