resumen_inicial: La aplicación de la regla del cuadrado de binomio suma permite expandir
  de forma directa expresiones con coeficientes numéricos y potencias compuestas.
explicacion_simple: Cuando los términos de un binomio tienen números o exponentes
  mayores como $(3x^2 + 2y)^2$, elevamos todo el primer bloque al cuadrado, multiplicamos
  $2$ por ambos bloques y elevamos el segundo bloque al cuadrado.
explicacion_formal: 'Para monomios generales $A = c_1 x^m$ y $B = c_2 y^n$, el desarrollo
  de $(A + B)^2$ sigue la identidad de estructura:


  $$(A + B)^2 = A^2 + 2AB + B^2 = (c_1 x^m)^2 + 2(c_1 x^m)(c_2 y^n) + (c_2 y^n)^2
  = c_1^2 x^{2m} + 2c_1c_2 x^m y^n + c_2^2 y^{2n}$$


  **Desglose simbólico:**

  - $c_1^2 x^{2m}$: Aplicación de propiedad de potencias $(x^m)^2 = x^{2m}$ al primer
  término.

  - $2c_1c_2 x^m y^n$: Coeficiente compuesto multiplicando los dos coeficientes por
  2.

  - $c_2^2 y^{2n}$: Cuadrado del segundo monomio.


  > **Complemento didáctico:** Permite algebraizar potencias algebraicas complejas
  sin realizar multiplicaciones horizontales reiteradas.'
definiciones_clave: '- **Monomio compuesto**: Expresión con coeficiente y variables
  con exponentes superiores.

  - **Regla de potencia de potencia**: $(x^m)^n = x^{m \cdot n}$.'
propiedades_relaciones: '- **Extensión polinomial**: La regla del producto notable
  aplica uniformemente sobre cualquier anillo de polinomios $\mathbb{R}[x, y]$.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(3x^2 + 2y)^2$ aplicando la regla del cuadrado
    de binomio suma.
  pasos:
  - 'Paso 1: Identificar $A = 3x^2$ y $B = 2y$.'
  - 'Paso 2: Elevar el primer término al cuadrado: $(3x^2)^2 = 3^2 \cdot (x^2)^2 =
    9x^4$.'
  - 'Paso 3: Calcular el doble producto: $2 \cdot (3x^2) \cdot (2y) = 12x^2y$.'
  - 'Paso 4: Elevar el segundo término al cuadrado: $(2y)^2 = 4y^2$.'
  - 'Paso 5: Unir los términos: $9x^4 + 12x^2y + 4y^2$.'
  - 'Conclusión: El desarrollo final es $9x^4 + 12x^2y + 4y^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de elevar al cuadrado el término $A = 3x^2$?
  choices:
  - text: $9x^4$
    is_correct: true
  - text: $6x^4$
    is_correct: false
  - text: $9x^2$
    is_correct: false
  - text: $3x^4$
    is_correct: false
  explanation: La alternativa correcta es '$9x^4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expansión de $(3x^2 + 2y)^2$, ¿cuál es el coeficiente del término
    central $x^2y$?
  choices:
  - text: $12$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $5$
    is_correct: false
  - text: $24$
    is_correct: false
  explanation: La alternativa correcta es '$12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar coeficientes y multiplicar exponentes por 2 en el primer término.'
- 'Paso 2: Multiplicar los coeficientes entre sí y por 2 para el término central.'
- 'Paso 3: Elevar coeficientes y multiplicar exponentes por 2 en el segundo término.'
errores_correccion: '- **Error 1: Sumar los exponentes en lugar de multiplicarlos
  por 2 al elevar una potencia.** **Cómo corregirlo:** Usar la propiedad de potencia
  de una potencia $(x^m)^2 = x^{2m}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(2a^3 + 5)^2$.
  alternativas:
  - $4a^6 + 20a^3 + 25$
  - $4a^5 + 20a^3 + 25$
  - $4a^6 + 10a^3 + 25$
  respuesta: $4a^6 + 20a^3 + 25$
  solucion_pasos:
  - 1. $(2a^3)^2 = 4a^6$.
  - 2. $2(2a^3)(5) = 20a^3$.
  - '3. $5^2 = 25$. Resultado: $4a^6 + 20a^3 + 25$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(x^4 + 3y^2)^2$?
  alternativas:
  - $x^8 + 6x^4y^2 + $9$y^4$
  - $x^8 + $9$y^4$
  - $x^6 + 6x^4y^2 + $9$y^4$
  respuesta: $x^8 + 6x^4y^2 + $9$y^4$
  solucion_pasos:
  - 1. $(x^4)^2 = x^8$.
  - 2. $2(x^4)(3y^2) = 6x^4y^2$.
  - '3. $(3y^2)^2 = $9$y^4$. Resultado: $x^8 + 6x^4y^2 + $9$y^4$.'
- titulo: ¿Es $9m^4 + 12m^2 + 4$ la expansión correcta de $(3m^2 + 2)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3m^2)^2 + 2(3m^2)(2) + 2^2 = $9$m^4 + 12m^2 + 4$.
- titulo: ¿El término central de $(2x^2 + 3y)^2$ tiene coeficiente 6?
  respuesta: 'No'
  solucion_pasos:
  - No, el coeficiente es $2 \cdot 2 \cdot 3 = 12$.
errores_frecuentes:
- Al elevar $(3x^2)^2$, la potencia sobre la variable resulta en $x^2$ en lugar de
  $x^4$.
- Declarar que $(3x^2 + 2y)^2$ equivale a $9x^4 + 4y^2$.
- El coeficiente del término central en $(3x^2 + 2y)^2$ equivale a $6$ en lugar de
  $12$.
- Sumar 2 al exponente de la variable en lugar de multiplicarlo por 2.
- Declarar que el desarrollo de un binomio con coeficientes no es un trinomio.
afirmaciones_verdaderas:
- Al aplicar la regla sobre potencias, el exponente de las variables se multiplica
  por 2.
- El coeficiente del término central resulta de multiplicar 2 por el producto de los
  coeficientes iniciales.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla del cuadrado
  de binomio suma sobre monomios con coeficientes y exponentes avanzados.
