  question: ¿Qué ocurre con los exponentes de las variables de los términos extremos al aplicar la regla del cuadrado de binomio?
  choices:
  - text: Se multiplican por 2 aplicando la ley de potencia de una potencia ($(x^\alpha)^2 = x^{2\alpha}$)
    is_correct: true
  - text: Se les suma 2 a cada exponente
    is_correct: false
  - text: Se dividen entre 2
    is_correct: false
  - text: Se mantienen sin cambios
    is_correct: false
  explanation: La alternativa correcta es 'Se multiplican por 2 aplicando la ley de potencia de una potencia ($(x^\alpha)^2
    = x^{2\alpha}$)'. Potencia de una potencia $(x^\alpha)^2 = x^{2\alpha}$.
  reinforcement_section: Explicación formal
