semantic_id: MAT.ALG.CUADRADO_BINOMIO.REGLA_SUMA
resumen_inicial: 'Aplicación de la regla del cuadrado de binomio suma: fórmula, regla
  de expansión y aplicaciones en Cuadrado de binomio.'
explicacion_simple: Una vez que entendemos de dónde sale $(a+b)^2$, no necesitamos
  multiplicar término por término cada vez. Hay una regla rápida que te ahorrará mucho
  tiempo.
explicacion_formal: '### Definición formal


  El doble producto es la multiplicación del primer por el segundo término, multiplicada
  por 2: $2ab$.


  ### Desarrollo didáctico


  La regla del cuadrado de un binomio suma es un atajo (o *producto notable*) para
  no tener que multiplicar término a término cada vez que vemos una expresión de la
  forma $(a+b)^2$.


  **Fórmula de la regla:** $(a+b)^2 = a^2 + 2ab + b^2$


  **Regla en palabras (para memorizar):**

  1. **El cuadrado del primer término:** $(a)^2$

  2. **Más el doble del producto del primero por el segundo:** $2(a)(b)$

  3. **Más el cuadrado del segundo término:** $(b)^2$


  **¿Cómo aplicarla?**

  Si tienes $(3x + 5)^2$:

  - El primer término es $3x$. Su cuadrado es $(3x)^2 = 9x^2$.

  - El doble del producto es $2(3x)(5) = 30x$.

  - El cuadrado del segundo término es $(5)^2 = 25$.

  - Juntando todo: $9x^2 + 30x + 25$. Rápido y sin multiplicar polinomios largos.'
definiciones_clave: '- **Aplicación de la regla del cuadrado de binomio suma**: Producto
  notable con estructura fija de desarrollo directo.'
propiedades_relaciones: '- **Reglas de expansión**: Fórmulas de productos notables
