errores_frecuentes:
- Olvidar elevar al cuadrado el coeficiente numérico del término (ej. decir que $(3x)^2
  = 3x^2$ en vez de $9x^2$).
- Para «En la regla del cuadrado de binomio $(a+b)^2 = a^2 + 2ab + b^2$, la frase
  'el doble producto' se refiere al término:», la respuesta correcta es $a^2$.
- Para «En la regla del cuadrado de binomio $(a+b)^2 = a^2 + 2ab + b^2$, la frase
  'el doble producto' se refiere al término:», la respuesta correcta es $b^2$.
