  choices:
  - text: El resultado es $9x^4 + 6x^2 + 1$, elevando $(3x^2)^2 = 9x^4$, doble producto $2(3x^2)(1) = 6x^2$ y $1^2 = 1$
    is_correct: true
  - text: El resultado es $9x^4 + 1$
    is_correct: false
  - text: El resultado es $9x^2 + 6x^2 + 1$
    is_correct: false
  - text: El resultado es $6x^4 + 6x^2 + 1$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $9x^4 + 6x^2 + 1$, elevando $(3x^2)^2 = 9x^4$, doble producto $2(3x^2)(1)
    = 6x^2$ y $1^2 = 1$'. $(3x^2)^2 + 2(3x^2)(1) + 1^2 = 9x^4 + 6x^2 + 1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado el coeficiente numérico y multiplicar por 2 los exponentes de las variables del primer término.'
- 'Paso 2: Multiplicar por 2 el producto de los coeficientes de ambos términos y conservar las variables con la suma de sus
  exponentes.'
- 'Paso 3: Elevar al cuadrado el coeficiente numérico y multiplicar por 2 los exponentes de las variables del segundo término.'
- 'Paso 4: Escribir los tres términos resultantes como un trinomio ordenado.'
errores_correccion: '- **Error 1:** Elevar la variable al cuadrado excluyendo la elevación al cuadrado del coeficiente numérico
  (escribir $(3x)^2 = 3x^2$). **Cómo corregirlo:** Se debe **ELEVAR AL CUADRADO TANTO EL NÚMERO COMO LA LETRA ($(3x)^2 = 9x^2$)**.

  - **Error 2:** Multiplicar los exponentes por 2 en lugar de elevar el coeficiente al cuadrado (escribir $(4x)^2 = 8x^2$).
  **Cómo corregirlo:** El coeficiente **SE ELEVA AL CUADRADO ($4^2 = 16 \implies 16x^2$)**.

  '
ejemplos:
- titulo: Desarrollo con coeficientes
  enunciado: ¿Cuál es el trinomio de $(2x + 5)^2$?
  alternativas:
  - $4x^2 + 20x + 25$
  - $4x^2 + 25$
  - $4x^2 + 10x + 25$
  respuesta: $4x^2 + 20x + 25$
  solucion_pasos:
  - 1. $(2x)^2 = 4x^2$.
  - 2. $2(2x)(5) = 20x$.
  - 3. $5^2 = 25$.
  - '4. Resultado: $4x^2 + 20x + 25$.'
- titulo: Variables de exponente mayor
  enunciado: ¿Cuál es el desarrollo de $(x^3 + 2)^2$?
  alternativas:
  - $x^6 + 4x^3 + 4$
  - $x^5 + 4x^3 + 4$
  - $x^6 + 4$
  respuesta: $x^6 + 4x^3 + 4$
  solucion_pasos:
  - 1. $(x^3)^2 = x^6$.
  - 2. $2(x^3)(2) = 4x^3$.
  - 3. $2^2 = 4$.
  - '4. Resultado: $x^6 + 4x^3 + 4$.'
- titulo: Doble de coeficientes
  enunciado: En el término medio de $(3a + 4b)^2$, ¿se calcula $2 \cdot 3 \cdot 4 = 24$ para obtener $+24ab$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el coeficiente central es el doble del producto de los números.
- titulo: Cálculo de coeficientes extremos
  enunciado: Para $(5x^2 + 1)^2$, ¿es el término inicial $25x^4$ y el término final $+1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(5x^2)^2 = 25x^4$ y $1^2 = 1$.
errores_frecuentes:
- Elevar la variable al cuadrado conservando el coeficiente numérico sin elevar.
- Multiplicar el coeficiente numérico por 2 en lugar de elevarlo a la potencia 2 en los términos extremos.
- Sumar los coeficientes al calcular el término central en lugar de multiplicarlos por 2.
- Perder exponentes de variables compuestas durante la duplicación del término central.
- Olvidar sumar los exponentes de bases iguales al multiplicar las partes literales del término central.
afirmaciones_verdaderas:
- La regla del cuadrado de binomio suma requiere elevar coeficientes al cuadrado en los extremos y duplicar su producto en
  el medio.
- Al elevar al cuadrado una variable con exponente $\alpha$, su nuevo exponente es $2\alpha$.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/aplicacion-de-la-regla-del-cuadrado-de-binomio-suma-resumen.svg)


  QUÉ: Aplicar la regla del cuadrado de binomio suma sobre expresiones algebraicas con coeficientes numéricos y potencias
  compuestas.

  CÓMO: Elevar coeficientes numéricos al cuadrado, duplicar los exponentes literales en los extremos ($(x^\alpha)^2 = x^{2\alpha}$)
  y duplicar el producto de los términos para el término central.

  '
