procedimiento:
- 'Paso 1: Descompón cada lado del rectángulo en los términos del binomio correspondiente.'
- 'Paso 2: Dibuja o imagina la partición del rectángulo en celdas, una por cada combinación
  entre base y altura.'
- 'Paso 3: Asigna a cada celda el producto del término horizontal por el término vertical.'
- 'Paso 4: Suma algebraicamente las áreas parciales para obtener el área total.'
- 'Paso 5: Reduce los términos semejantes y compara el resultado con la expansión
  distributiva del producto.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en interpretación geométrica del producto de binomios mediante área.
ejemplos:
- titulo: En un diagrama de área para $(kx - 1)(x + k)$, una celda interior es $4x^2$.
    ¿Cuál es el áre
  enunciado: 'En un diagrama de área para $(kx - 1)(x + k)$, una celda interior es
    $4x^2$. ¿Cuál es el área total del rectángulo asumiendo $k>0$?


    Opciones: A) $4x^2 + 15x - 4$ · B) $4x^2 + 16x - 4$ · C) $4x^2 + 17x - 4$ · D)
    $4x^2 - 15x - 4$'
  solucion_pasos:
  - $kx \cdot x = 4x^2 \Rightarrow k=4$. Entonces $(4x-1)(x+4) = 4x^2 + 16x - x -
    4 = 4x^2 + 15x - 4$.
  - 'Respuesta: $4x^2 + 15x - 4$'
- titulo: Un modelo de área de $2 \times 2$ tiene como suma de celdas $x^2 + px +
    q$. Si la suma de la
  enunciado: 'Un modelo de área de $2 \times 2$ tiene como suma de celdas $x^2 + px
    + q$. Si la suma de las áreas de las dos celdas de la diagonal principal (sup-izq
    e inf-der) es $x^2 + 12$, y la suma de la diagonal secundaria es $7x$, halla $p+q$.


    Opciones: A) $19$ · B) $7$ · C) $12$ · D) $5$'
  solucion_pasos:
  - La suma total es $(x^2+12) + 7x = x^2+7x+12$. Luego $p=7, q=12$. $p+q = 19$.
  - 'Respuesta: $19$'
