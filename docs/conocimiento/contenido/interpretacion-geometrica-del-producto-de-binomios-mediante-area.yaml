semantic_id: MAT.ALG.MULT_POLINOMIOS.MODELO_AREA_BINOMIOS
resumen_inicial: 'Interpretación geométrica del producto de binomios mediante área:
  leyes, procedimiento y aplicación en Multiplicación de polinomios.'
explicacion_simple: El área de un rectángulo puede descomponerse en regiones menores.
  Esa misma partición permite visualizar por qué cada término de un binomio multiplica
  a todos los del otro.
explicacion_formal: '### Definición formal


  Si un rectángulo tiene lados descompuestos como $a+b$ y $c+d$, su partición en subrectángulos
  determina la identidad

  $$(a+b)(c+d)=ac+ad+bc+bd.$$

  Cada subregión corresponde al producto de un término de la base por un término de
  la altura. Por tanto, el modelo de área representa geométricamente la distributividad:
  el área total es la suma de las áreas parciales. En contexto algebraico, este esquema
  también se usa con términos con signo para organizar todos los productos parciales
  del binomio.


  ### Desarrollo didáctico


  Los términos semejantes suelen quedar en la diagonal que va desde abajo-izquierda
  hasta arriba-derecha.


  Geométricamente el área no es negativa, pero el modelo tabular algebraico admite
  celdas con valores negativos sin problema.


  Las 4 celdas sin reducir: $(x)(x)$, $(x)(4)$, $(3)(x)$, $(3)(4)$.'
definiciones_clave: '- **Interpretación geométrica del producto de binomios mediante
  área**: Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
