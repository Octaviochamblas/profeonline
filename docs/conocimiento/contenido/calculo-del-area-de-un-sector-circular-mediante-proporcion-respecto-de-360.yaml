semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_SECTOR_GRADOS
resumen_inicial: El área de un sector circular se calcula multiplicando el área total del círculo πr² por la proporción angular α / 360°, o alternativamente mediante A = (s · r) / 2.
explicacion_simple: 'Un **sector circular** es la rebanada completa de una pizza redonda: está delimitado por dos radios rectos y un arco curvo en el borde.


  Para calcular cuánta superficie tiene esa rebanada, usamos la misma lógica que con el arco, pero ahora multiplicando por el **área completa del círculo** ($\pi r^2$) en vez de por el perímetro. La fórmula es: **$A_{\text{sector}} = \frac{\alpha}{360^\circ} \cdot \pi r^2$**.


  Y hay un atajo genial: si ya calculaste o conoces la longitud del arco curvo ($s$), ¡el área de la rebanada se puede calcular exactamente como el área de un triángulo (base por altura partido en 2)!: **$A = \frac{s \cdot r}{2}$**, donde la base es el arco $s$ y la altura es el radio $r$.


  ![Área de sector circular en grados](/static/img/nodos/calculo-del-area-de-un-sector-circular-mediante-proporcion-respecto-de-360-intro.svg)

  '
explicacion_formal: '### Deducción por proporcionalidad de área superficial

  Sea $\mathcal{D}$ un disco circular de radio $r$ con área total $\pi r^2$, correspondiente a una rotación de $360^\circ$. Un sector circular de ángulo central $\alpha$ en grados sexagesimales encierra un área directamente proporcional a $\alpha$:

  $$A_{\text{sector}} = \frac{\alpha}{360^\circ} \cdot \pi r^2$$


  ### Equivalencia con la longitud de arco (Fórmula del triángulo curvo)

  Sustituyendo $\alpha = \frac{180^\circ s}{\pi r}$ en la fórmula del área:

  $$A_{\text{sector}} = \frac{\frac{180^\circ s}{\pi r}}{360^\circ} \cdot \pi r^2 = \frac{s}{2\pi r} \cdot \pi r^2 = \frac{s \cdot r}{2}$$

  Esta fórmula demuestra que el sector circular puede considerarse como un triángulo de base curvilínea $s$ y altura radial $r$.


  > **Complemento didáctico:** Si en la PAES te dan el arco $s$ y el radio $r$, ¡NO pierdas tiempo calculando el ángulo $\alpha$! Aplica directamente la fórmula triangular $A = \frac{s \cdot r}{2}$. Ahorras más de un minuto de cálculos algebraicos.

  '
definiciones_clave: '- **Sector circular**: Porción de superficie del círculo comprendida entre dos radios y el arco que subtienden.

  - **Área del sector ($A_{\text{sector}}$)**: Medida superficial bidimensional de la rebanada circular.

  - **Fórmula triangular ($A = \frac{s \cdot r}{2}$)**: Relación que conecta directamente el área con la longitud de arco.

  '
propiedades_relaciones: '- **Cuadrantes y semicírculos**: $\alpha = 180^\circ \implies A = \pi r^2 / 2$; $\alpha = 90^\circ \implies A = \pi r^2 / 4$.

  - **Comportamiento cuadrático**: Si el radio se duplica a ángulo constante, el área del sector se cuadruplica ($4\times$).

  - **Despeje de ángulo**: $\alpha = \frac{360^\circ \cdot A_{\text{sector}}}{\pi r^2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de área de sector en grados](/static/img/nodos/calculo-del-area-de-un-sector-circular-mediante-proporcion-respecto-de-360-ejemplos.svg)


    Calcula el área de un sector circular de radio $r = 12\text{ cm}$ cuyo ángulo central mide $\alpha = 30^\circ$. Además, halla el área de otro sector cuyo radio es $r = 5\text{ cm}$ y su arco curvo mide $s = 8\text{ cm}$.'
  pasos:
  - 'Paso 1: Calcular la fracción de giro para $\alpha = 30^\circ$: $\frac{30^\circ}{360^\circ} = \frac{1}{12}$.'
  - 'Paso 2: Calcular el área del círculo completo: $A_{\text{total}} = \pi(12^2) = 144\pi\text{ cm}^2$.'
  - 'Paso 3: Multiplicar por la fracción: $A = \frac{1}{12} \cdot 144\pi = 12\pi\text{ cm}^2$.'
  - 'Paso 4: Para el segundo sector, aplicar directamente la fórmula triangular con $s = 8$ y $r = 5$: $A = \frac{s \cdot r}{2} = \frac{8 \cdot 5}{2} = \frac{40}{2} = 20\text{ cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el área de un sector circular a partir del ángulo central α en grados?
  choices:
  - text: A = (α / 360°) · πr².
    is_correct: true
  - text: A = (α / 360°) · 2πr.
    is_correct: false
  - text: A = (α / 180°) · πr².
    is_correct: false
  - text: A = (α · πr) / 360°.
    is_correct: false
  explanation: La alternativa correcta es 'A = (α / 360°) · πr².' El área del sector es proporcional al área total del círculo $\pi r^2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un sector circular tiene un radio de r = 10 cm y un arco de longitud s = 6 cm, ¿cuál es su área?
  choices:
  - text: 30 cm².
    is_correct: true
  - text: 60 cm².
    is_correct: false
  - text: 15 cm².
    is_correct: false
  - text: 30π cm².
    is_correct: false
  explanation: La alternativa correcta es '30 cm².' Usando $A = \frac{s \cdot r}{2} = \frac{6 \cdot 10}{2} = 30$ cm².
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el ángulo central $\alpha$ en grados y el radio $r$.

  2. Calcular la fracción angular $\frac{\alpha}{360^\circ}$.

  3. Calcular el área del círculo completo: $\pi r^2$.

  4. Multiplicar la fracción por el área total: $A = \frac{\alpha}{360^\circ} \cdot \pi r^2$.

  5. Si se conoce el arco $s$ y el radio $r$, aplicar alternativamente $A = \frac{s \cdot r}{2}$.

  '
errores_correccion: '- **Error común 1:** Multiplicar por $2\pi r$ creyendo que se calcula el área. **Corrección:** $2\pi r$ calcula la longitud de arco; para área siempre se usa $\pi r^2$.

  - **Error común 2:** Olvidar elevar el radio al cuadrado. **Corrección:** El área es cuadrática, no olvides calcular $r^2$ antes de multiplicar.

  '
ejemplos:
- tipo: A
  titulo: Sector de 90 grados (cuadrante)
  enunciado: ¿Cuál es el área de un sector circular de $90^\circ$ en un círculo de radio $r = 6\text{ cm}$?
  alternativas:
  - text: $9\pi\text{ cm}^2$.
    is_correct: true
  - text: $18\pi\text{ cm}^2$.
    is_correct: false
  - text: $36\pi\text{ cm}^2$.
    is_correct: false
  - text: $3\pi\text{ cm}^2$.
    is_correct: false
  explicacion: $A = \frac{90^\circ}{360^\circ} \cdot \pi(6^2) = \frac{1}{4} \cdot 36\pi = 9\pi\text{ cm}^2$.
- tipo: B
  titulo: Fórmula triangular del sector
  enunciado: ¿Es el área de un sector circular siempre equivalente a (s · r) / 2, donde s es el arco y r es el radio?
  respuesta: Sí
  explicacion: Sí. Al sustituir la longitud de arco $s = \frac{\alpha \pi r}{180^\circ}$ en $\frac{s \cdot r}{2}$, se recupera idénticamente la fórmula $\frac{\alpha}{360^\circ} \pi r^2$.
errores_frecuentes:
- '''Confundir el área del sector circular con la longitud de arco.'''
- '''Olvidar dividir entre dos al utilizar la fórmula $A = \frac{s \cdot r}{2}$.'''
- '''Dividir entre $180^\circ$ en lugar de $360^\circ$ al usar la fórmula en grados.'''
afirmaciones_verdaderas:
- '''El área de un sector circular es directamente proporcional a su ángulo central respecto a $360^\circ$.'''
- "'El área de un sector circular puede calcularse como $A = \frac{s \\cdot r}{2}$ conocida la longitud de su arco.'"
- '''Un cuadrante circular de $90^\circ$ encierra exactamente un cuarto del área del círculo completo.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el área de sectores circulares en grados y mediante la fórmula triangular del arco.


  **CÓMO:** Aplicando $A = \frac{\alpha}{360^\circ} \cdot \pi r^2 = \frac{s \cdot r}{2}$.


  ![Síntesis de área de sector en grados](/static/img/nodos/calculo-del-area-de-un-sector-circular-mediante-proporcion-respecto-de-360-resumen.svg)

  '
