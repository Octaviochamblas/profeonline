semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CLAUSURA_MULTIPLICACION
resumen_inicial: 'La propiedad de clausura multiplicativa establece que el producto de cualesquiera dos números racionales es siempre otro número racional: $\forall q_1, q_2 \in \mathbb{Q}, \, q_1 \cdot q_2 \in \mathbb{Q}$.'
explicacion_simple: 'Al igual que en la suma, al multiplicar dos números racionales entre sí obtenemos como resultado un nuevo número que pertenece estrictamente al conjunto de los racionales. El producto de dos fracciones jamás dará un número fuera de $\mathbb{Q}$.


  ![Clausura de Q en la multiplicación](/static/img/nodos/clausura-de-q-en-la-multiplicacion-intro.svg)'
explicacion_formal: 'El conjunto $(\mathbb{Q}, \cdot)$ satisface el axioma de **Clausura o Cerradura Multiplicativa**:


  $$\forall \frac{a}{b}, \frac{c}{d} \in \mathbb{Q}, \quad \frac{a}{b} \cdot \frac{c}{d} = \frac{a \cdot c}{b \cdot d} \in \mathbb{Q}$$


  **Desglose de la fórmula:**

  - $a \cdot c \in \mathbb{Z}$: Producto entero del numerador.

  - $b \cdot d \in \mathbb{Z} \setminus \{0\}$: Producto de denominadores no nulos que pertenece a $\mathbb{Z} \setminus \{0\}$.

  - $\frac{a \cdot c}{b \cdot d} \in \mathbb{Q}$: Expresión que satisface la definición canónica del conjunto $\mathbb{Q}$.


  > **Complemento didáctico:** Multiplicar un racional por cero da $0 = \frac{0}{1} \in \mathbb{Q}$, preservando la clausura multiplicativa.'
definiciones_clave: '- **Clausura multiplicativa en $\mathbb{Q}$**: Propiedad por la cual $\cdot : \mathbb{Q} \times \mathbb{Q} \to \mathbb{Q}$ es una operación interna.'
propiedades_relaciones: '- **Estructura de Semigrupo Multiplicativo**: Constituye la propiedad básica del producto en $(\mathbb{Q}, \cdot)$.'
ejemplo_guiado:
  enunciado: 'Verifique la clausura multiplicativa calculando el producto $\frac{4}{5} \cdot \left(-\frac{3}{2}\right)$.


    ![Ejemplo Clausura de Q en la multiplicación](/static/img/nodos/clausura-de-q-en-la-multiplicacion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar que $\frac{4}{5} \in \mathbb{Q}$ y $-\frac{3}{2} \in \mathbb{Q}$.'
  - 'Paso 2: Multiplicar en línea recta: $\frac{4 \cdot (-3)}{5 \cdot 2} = \frac{-12}{10} = \frac{-6}{5}$.'
  - 'Paso 3: Comprobar pertenencia: $-6, 5 \in \mathbb{Z}$ con $5 \neq 0 \implies -\frac{6}{5} \in \mathbb{Q}$.'
  - 'Conclusión: El producto dio un número racional, confirmando la clausura multiplicativa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué garantiza la propiedad de clausura multiplicativa en Q?
  choices:
  - text: Que el producto de dos números racionales pertenece SIEMPRE a Q
    is_correct: true
  - text: Que el producto siempre es igual a 1
    is_correct: false
  - text: Que se pueden sumar los denominadores
    is_correct: false
  - text: Que el producto siempre da cero
    is_correct: false
  explanation: La alternativa correcta es 'Que el producto de dos números racionales pertenece SIEMPRE a Q'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4/5 · (-3/2) = -6/5, ¿por qué el resultado confirma la clausura multiplicativa?
  choices:
  - text: Porque -6/5 es una fracción con numerador y denominador entero no nulo perteneciente a Q
    is_correct: true
  - text: Porque dio positivo
    is_correct: false
  - text: Because es mayor que 100
    is_correct: false
  - text: No la confirma
    is_correct: false
  explanation: La alternativa correcta es 'Porque -6/5 es una fracción con numerador y denominador entero no nulo perteneciente a Q'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar dos racionales $q_1, q_2 \in \mathbb{Q}$.'
- 'Paso 2: Calcular el producto en línea recta $q_1 \cdot q_2 = \frac{a \cdot c}{b \cdot d}$.'
- 'Paso 3: Verificar que la fracción resultante pertenece al conjunto $\mathbb{Q}$.'
errores_correccion: '- **Error 1: Creer que multiplicar dos fracciones puede dar un número irracional.** **Cómo corregirlo:** $\mathbb{Q}$ es cerrado bajo la multiplicación; el producto es SIEMPRE racional.


  - **Error 2: Pensar que multiplicar por cero rompe la clausura porque da 0.** **Cómo corregirlo:** $0 = 0/1 \in \mathbb{Q}$, por ende pertenece al conjunto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $q_1 = 3/8$ y $q_2 = 2/5$, ¿a qué conjunto pertenece $q_1 \cdot q_2$?
  alternativas:
  - Al conjunto Q (racionales)
  - Únicamente a los enteros
  - A los irracionales
  respuesta: Al conjunto Q (racionales)
  solucion_pasos:
  - $3/8 \cdot 2/5 = 6/40 = 3/20 \in \mathbb{Q}$.
- titulo: Ejemplo 2
  enunciado: ¿Es $0 \in \mathbb{Q}$ la prueba de que el producto por cero cumple clausura multiplicativa?
  alternativas:
  - Sí, porque 0 = 0/1 pertenece a Q
  - No, el cero no es racional
  - Solo si es un entero positivo
  respuesta: Sí, porque 0 = 0/1 pertenece a Q
  solucion_pasos:
  - $q \cdot 0 = 0 \in \mathbb{Q}$, demostrando la clausura.
- titulo: ¿Es el producto de dos números racionales siempre un número racional?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el axioma de clausura multiplicativa.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
- titulo: ¿Puede el producto de dos racionales dar un número decimal infinito no periódico?
  respuesta: 'No'
  solucion_pasos:
  - No, los decimales infinitos no periódicos son irracionales, y $\mathbb{Q}$ es cerrado.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
errores_frecuentes:
- Multiplicar dos números racionales entrega en ciertos casos un número irracional como $\pi$.
- El producto de dos fracciones negativas no pertenece al conjunto de los racionales.
- La propiedad de clausura multiplicativa solo se cumple para fracciones propias.
- Multiplicar una fracción por cero produce un resultado no definido fuera de $\mathbb{Q}$.
- La clausura multiplicativa exige que el resultado sea un número entero siempre.
afirmaciones_verdaderas:
- El conjunto de los números racionales $\mathbb{Q}$ es cerrado bajo la operación de multiplicación.
- Para todos los elementos $q_1, q_2 \in \mathbb{Q}$, el producto $q_1 \cdot q_2$ pertenece a $\mathbb{Q}$.
al_terminar_debes_poder: '**QUÉ:** Explicar y aplicar el axioma de clausura de la multiplicación en el conjunto de los números racionales.


  **CÓMO:** Verificando que para todo par de elementos $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ con $b, d \neq 0$, el producto directo $\left(\frac{a}{b}\right) \cdot \left(\frac{c}{d}\right) = \frac{a \cdot c}{b \cdot d}$ pertenece estrictamente a $\mathbb{Q}$ al ser $ac, bd \in \mathbb{Z}$.


  ![Resumen Clausura de Q en la multiplicación](/static/img/nodos/clausura-de-q-en-la-multiplicacion-resumen.svg)'
