semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CLAUSURA_MULTIPLICACION
resumen_inicial: "La propiedad de clausura o cierre de la multiplicación establece que el producto de dos números racionales cualesquiera es siempre otro número racional."
explicacion_simple: |
  Igual que sucede con la suma, la multiplicación también es una operación 'cerrada' dentro del conjunto de las fracciones. Si tomas dos fracciones cualesquiera y las multiplicas entre sí (numerador con numerador y denominador con denominador), el resultado resultante **siempre es otra fracción**. Por ejemplo, al multiplicar $\frac{2}{3} \times \frac{4}{5} = \frac{8}{15}$, el resultado $\frac{8}{15}$ no se sale del universo de los racionales.
explicacion_formal: |
  Formalmente, el conjunto de los números racionales $\mathbb{Q}$ satisface el axioma de **clausura o cierre algebraico** respecto de la operación de multiplicación $\cdot$, expresado simbólicamente como:
  $$\forall q_1, q_2 \in \mathbb{Q}, \quad (q_1 \cdot q_2) \in \mathbb{Q}$$

  Demostración: sean $q_1 = \frac{a}{b}$ y $q_2 = \frac{c}{d}$ con $a, c \in \mathbb{Z}$ y $b, d \in \mathbb{Z} \setminus \{0\}$. Su producto es:
  $q_1 \cdot q_2 = \frac{a \cdot c}{b \cdot d}$
  Puesto que los enteros $\mathbb{Z}$ son cerrados bajo el producto, el numerador $N = a \cdot c \in \mathbb{Z}$ y el denominador $D = b \cdot d \in \mathbb{Z} \setminus \{0\}$. Por lo tanto, $\frac{N}{D} \in \mathbb{Q}$.
definiciones_clave: |
  - **Propiedad de clausura multiplicativa**: Axioma por el cual el producto $q_1 \cdot q_2$ entre elementos de $\mathbb{Q}$ pertenece sin excepción a $\mathbb{Q}$.
  - **Operador producto $\cdot: \mathbb{Q} \times \mathbb{Q} \to \mathbb{Q}$**: Aplicación binaria que asigna a cada par de racionales su producto racional.
  - **Cierre bajo potencias enteras**: Consecuencia directa de la clausura multiplicativa por la cual $q^n \in \mathbb{Q}$ para todo $q \in \mathbb{Q}$ y $n \in \mathbb{Z}^+$.
propiedades_relaciones: |
  - **Estructura de Cuerpo**: La clausura de la multiplicación es un axioma fundamental para definir a $(\mathbb{Q}, +, \cdot)$ como un cuerpo algebraico.
  - **Invarianza por el cero**: Multiplicar por $0 = \frac{0}{1} \in \mathbb{Q}$ produce $0 \in \mathbb{Q}$, preservando la clausura.
  - **Contrastación con irracionales**: Multiplicar dos números irracionales puede dar un número racional (por ejemplo $\sqrt{2} \cdot \sqrt{2} = 2 \in \mathbb{Q}$), pero multiplicar dos racionales JAMÁS da un irracional.
ejemplo_guiado:
  enunciado: "Demuestra la clausura multiplicativa al calcular el producto entre los racionales $q_1 = -\\frac{6}{7}$ y $q_2 = \\frac{14}{9}$."
  pasos:
    - 'Plantear el producto: $\left(-\frac{6}{7}\right) \cdot \left(\frac{14}{9}\right)$.'
    - "Multiplicar en línea recta o simplificar cruzadamente previamente:"
    - "Dividir $6$ y $9$ entre $3$ (quedan $2$ y $3$); dividir $14$ y $7$ entre $7$ (quedan $2$ y $1$)."
    - 'Calcular el resultado final: $-\frac{2 \cdot 2}{1 \cdot 3} = -\frac{4}{3}$.'
    - 'Verificar pertenencia a $\mathbb{Q}$: $-4 \in \mathbb{Z}$ y $3 \in \mathbb{Z} \setminus \{0\} \implies -\frac{4}{3} \in \mathbb{Q}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué garantiza la propiedad de clausura de la multiplicación en $\\mathbb{Q}$?"
    choices:
      - {text: "Garantiza que el producto de dos números racionales cualesquiera es siempre otro número racional.", is_correct: true}
      - {text: "Garantiza que el producto de dos racionales siempre es igual a 1.", is_correct: false}
      - {text: "Garantiza que multiplicar por cero da como resultado un número positivo.", is_correct: false}
      - {text: "Garantiza que la multiplicación se realiza en cruz.", is_correct: false}
    explanation: 'La correcta es Garantiza que el producto de dos números racionales cualesquiera es siempre otro número racional.: define la pertenencia del resultado al conjunto $\mathbb{Q}$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al elevar una fracción $\\frac{a}{b} \\in \\mathbb{Q}$ al cuadrado ($\\left(\\frac{a}{b}\\right)^2 = \\frac{a}{b} \\cdot \\frac{a}{b}$), ¿por qué el resultado sigue perteneciendo a $\\mathbb{Q}$?"
    choices:
      - {text: "Por la propiedad de clausura de la multiplicación aplicada a $q_1 = q_2 = \\frac{a}{b}$.", is_correct: true}
      - {text: "Porque elevar al cuadrado convierte las fracciones en números irracionales.", is_correct: false}
      - {text: "Porque se eliminan los denominadores.", is_correct: false}
      - {text: "Solo pertenece a $\\mathbb{Q}$ si $a$ y $b$ son pares.", is_correct: false}
    explanation: 'La correcta es Por la propiedad de clausura de la multiplicación aplicada a $q_1 = q_2 = \frac{a}{b}$.: la potencia cuadrada no es más que multiplicar la fracción por sí misma dentro de $\mathbb{Q}$.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Tomar dos racionales $q_1, q_2 \in \mathbb{Q}$ expresados en forma fraccionaria $\frac{a}{b}$ y $\frac{c}{d}$.'
  - 'Paso 2: Calcular el producto de numeradores $a \cdot c$ y el producto de denominadores $b \cdot d$.'
  - 'Paso 3: Formar la fracción resultante $\frac{a \cdot c}{b \cdot d}$.'
  - 'Paso 4: Verificar que la fracción obtenida posee numerador entero y denominador entero no nulo, demostrando que pertenece a $\mathbb{Q}$.'
errores_correccion: |
  Un error conceptual es suponer que multiplicar una fracción positiva por una fracción negativa podría generar un valor no definido o salirse de $\mathbb{Q}$. La regla de signos $(- \cdot + = -)$ produce un número racional negativo perfectamente contenido en $\mathbb{Q}$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $\\frac{3}{8} \\cdot 0$ y determina si el resultado satisface la clausura."
    alternativas:
      - 'Da 0, y $0 = \frac{0}{1} \in \mathbb{Q}$, por lo que satisface la clausura.'
      - "No satisface la clausura porque 0 no es racional."
      - 'Da $\frac{3}{8}$.'
    respuesta: "Da 0, y $0 = \\frac{0}{1} \\in \\mathbb{Q}$, por lo que satisface la clausura."
    solucion_pasos:
      - '$\frac{3}{8} \cdot 0 = 0$.'
      - 'Como $0 = \frac{0}{1}$, el cero pertenece a $\mathbb{Q}$.'
      - "Se verifica la clausura."
  - titulo: "Ejemplo 2"
    enunciado: "Si $x, y \\in \\mathbb{Q}$, ¿qué se puede afirmar sobre el producto $3 \\cdot x \\cdot y$?"
    alternativas:
      - 'Es un número racional en $\mathbb{Q}$.'
      - "Es un número irracional."
      - "Solo es racional si $x$ e $y$ son enteros."
    respuesta: "Es un número racional en $\\mathbb{Q}$."
    solucion_pasos:
      - '$3 = \frac{3}{1} \in \mathbb{Q}$.'
      - 'Por clausura multiplicativa sucesiva, el producto de tres números en $\mathbb{Q}$ pertenece a $\mathbb{Q}$.'
  - titulo: "¿Se cumple la clausura multiplicativa si multiplicamos dos números racionales decimales periódicos?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, al transformar los decimales periódicos a fracciones de $\mathbb{Q}$, su producto es otra fracción de $\mathbb{Q}$.'
  - titulo: "¿Es la división entre cualquier par de racionales siempre un racional?"
    respuesta: "No (excepto si el divisor es cero)"
    solucion_pasos:
      - 'No en el caso del divisor cero, pues la división por cero no está definida. La clausura para la división exige divisor no nulo ($\mathbb{Q} \setminus \{0\}$).'
errores_frecuentes:
  - "Pensar que multiplicar por cero viola la propiedad de clausura."
  - "Confundir la clausura de la multiplicación con la del cociente (que requiere excluir al cero)."
  - "Creer que la multiplicación de fracciones puede resultar en un número irracional."
  - "Olvidar aplicar la regla de signos al multiplicar fracciones negativas."
  - 'Asumir que al simplificar la fracción producto se modifica su pertenencia a $\mathbb{Q}$.'
afirmaciones_verdaderas:
  - "El producto de dos números racionales cualesquiera es siempre otro número racional."
  - 'El conjunto de los números racionales $\mathbb{Q}$ es cerrado respecto de la multiplicación.'
al_terminar_debes_ponder: |
  Debes ser capaz de explicar la clausura multiplicativa en $\mathbb{Q}$ y justificar que el producto de fracciones o racionales permanece siempre dentro del conjunto.
