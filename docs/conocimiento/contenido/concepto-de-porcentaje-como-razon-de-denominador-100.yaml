semantic_id: MAT.NUM.PORCENTAJES.RAZON_CIEN
resumen_inicial: 'Concepto de porcentaje como razón de denominador 100: concepto y
  propiedades fundamentales en Porcentajes.'
explicacion_simple: Cuando decimos que tu teléfono tiene 100% de batería, significa
  que está completamente lleno. El número 100 es el 'total perfecto' inventado por
  la humanidad para comparar cualquier cosa de forma fácil.
explicacion_formal: 'La palabra **porcentaje** viene del latín *per centum*, que significa
  literalmente ''por cada cien''.


  Matemáticamente, el símbolo $\%$ es una abreviatura para ''$\div 100$''. Un porcentaje
  es una **razón** (una fracción) donde el denominador, es decir el total de referencia,
  siempre es el número 100.

  - $50\%$ significa $50/100$ (la mitad de algo).

  - $25\%$ significa $25/100$ (la cuarta parte de algo).

  - $100\%$ significa $100/100$ (el total completo, equivalente a 1).'
definiciones_clave: '- **Concepto de porcentaje como razón de denominador 100**: Elemento
  central dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
