semantic_id: MAT.NUM.PORCENTAJES.RAZON_CIEN
resumen_inicial: 'Un porcentaje $p\%$ es una razón especial con consecuente fijo 100 ($p\% = \frac{p}{100}$), que representa la cantidad de partes tomadas de un total dividido en 100 partes iguales.'
explicacion_simple: |
  El símbolo de porcentaje ($\%$) significa simplemente *"de cada cien"*. Cuando dices que el $25\%$ de los estudiantes juega fútbol, estás diciendo que por cada $100$ estudiantes, exactamente $25$ juegan fútbol. Matemáticamente, cualquier porcentaje $p\%$ es la fracción $\frac{p}{100}$. El total completo siempre se representa por el $100\%$, que equivale a la unidad entera ($100/100 = 1$).
explicacion_formal: |
  ### Definición formal
  El **porcentaje** (o tanto por ciento) $p\%$ es una razón adimensional cuyo consecuente de referencia está estandarizado en $100$:
  $$p\% = \frac{p}{100} \quad (p \in \mathbb{R}^+)$$

  ### Interpretación operacional
  Aplicar un tanto por ciento $p\%$ sobre un valor de referencia $C$ equivale a dividir dicha cantidad en $100$ partes iguales y tomar $p$ de esas partes:
  $$p\% \text{ de } C = \left(\frac{p}{100}\right) \cdot C = \frac{p \cdot C}{100}$$

  ### Concepto de Base o Total ($100\%$)
  La base sobre la cual se calcula el porcentaje representa la totalidad absoluta:
  $$100\% \text{ de } C = \frac{100}{100} \cdot C = 1 \cdot C = C$$

  ### Síntesis didáctica
  - Definición: $p\% = \frac{p}{100}$.
  - Equivalencia del total: $100\% = 1$.
definiciones_clave: |
  - **Porcentaje ($p\%$)**: Razón matemática con denominador fijo igual a 100.
  - **Base ($100\%$)**: Cantidad de referencia total sobre la cual se calcula el porcentaje.
  - **Porcentaje de referencia**: Factor adimensional que indica la proporción tomada de 100 unidades.
propiedades_relaciones: |
  - **Complementariedad al 100%**: La suma de una parte $p\%$ y su complemento $(100 - p)\%$ completa la totalidad ($100\%$).
  - **Conmutatividad de porcentajes**: El $a\%$ de $b$ es numéricamente igual al $b\%$ de $a$: $\left(\frac{a}{100}\right) \cdot b = \left(\frac{b}{100}\right) \cdot a = \frac{a \cdot b}{100}$.
ejemplo_guiado:
  enunciado: 'Expresa el $35\%$ como una razón de denominador 100 e interpreta su significado si se aplica a un grupo de $200$ personas.'
  pasos:
    - 'Paso 1: Escribimos el porcentaje como razón fraccionaria con denominador 100: $35\% = \frac{35}{100}$.'
    - 'Paso 2: Interpretamos la razón: significa tomar $35$ unidades por cada $100$ unidades del total.'
    - 'Paso 3: Calculamos las personas correspondientes para un grupo de $200$ ($2$ cientos): $\frac{35}{100} \cdot 200 = 35 \cdot 2 = 70$.'
    - 'Paso 4: Conclusión: El $35\%$ de $200$ personas corresponde a **70 personas**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se define matemáticamente el porcentaje $p\%$ como una razón de denominador 100?'
    choices:
      - {text: 'Como la fracción de denominador fijo igual a 100 ($p\% = \frac{p}{100}$)', is_correct: true}
      - {text: 'Como la multiplicación del número por 100 ($p \cdot 100$)', is_correct: false}
      - {text: 'Como la resta de 100 menos $p$', is_correct: false}
      - {text: 'Como una fracción con denominador variable según los datos', is_correct: false}
    explanation: 'La alternativa correcta es ''Como la fracción de denominador fijo igual a 100 ($p\% = \frac{p}{100}$)''. Es la definición fundamental de porcentaje.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un frasco contiene $40\%$ de alcohol, ¿qué fracción representa la cantidad de alcohol respecto al total?'
    choices:
      - {text: 'La fracción $\frac{40}{100}$, que se simplifica a $\frac{2}{5}$', is_correct: true}
      - {text: 'La fracción $\frac{100}{40}$', is_correct: false}
      - {text: 'La cantidad entera $40$', is_correct: false}
      - {text: 'La fracción $\frac{4}{100}$', is_correct: false}
    explanation: 'La alternativa correcta es ''La fracción $\frac{40}{100}$, que se simplifica a $\frac{2}{5}$''. $40\% = 40/100 = 2/5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el número $p$ acompañado del símbolo de porcentaje $\%$.'
  - 'Paso 2: Escribir la razón manteniendo a $p$ como antecedente (numerador) y a 100 como consecuente (denominador): $\frac{p}{100}$.'
  - 'Paso 3: Si se requiere calcular sobre una cantidad $C$, multiplicar la razón por la cantidad ($p\% \text{ de } C = \frac{p}{100} \cdot C$).'
  - 'Paso 4: Simplificar la fracción si es necesario.'
errores_correccion: |
  - **Error 1:** Multiplicar por 100 en lugar de dividir por 100 al convertir un porcentaje a razón. **Cómo corregirlo:** El porcentaje representa partes de cien, por lo que **SIEMPRE se divide por 100: $\frac{p}{100}$**.
  - **Error 2:** Creer que un porcentaje no puede ser mayor que $100\%$. **Cómo corregirlo:** Porcentajes superiores al $100\%$ (ej: $150\% = \frac{150}{100} = 1.5$) representan cantidades mayores que el total de referencia original.
ejemplos:
  - titulo: 'Razón de porcentaje simple'
    enunciado: '¿El $15\%$ equivale a la razón $\frac{15}{100}$?'
    alternativas:
      - 'Sí, por definición de porcentaje'
      - 'No, es $150/100$'
      - 'No, es $1.5/100$'
    respuesta: 'Sí, por definición de porcentaje'
    solucion_pasos:
      - '1. Aplicamos la fórmula $p\% = \frac{p}{100}$.'
      - '2. Para $p=15 \implies \frac{15}{100}$.'
  - titulo: 'Porcentaje mayor al 100%'
    enunciado: '¿El $250\%$ representa la razón $\frac{250}{100} = 2.5$ veces el total original?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $250 / 100 = 2.5$.'
  - titulo: 'Conmutatividad de porcentajes'
    enunciado: '¿El $20\%$ de $50$ es igual al $50\%$ de $20$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(20/100) \cdot 50 = 10$, y $(50/100) \cdot 20 = 10$.'
  - titulo: 'Porcentaje nulo'
    enunciado: '¿El $0\%$ de cualquier cantidad es igual a $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0/100) \cdot C = 0$.'
errores_frecuentes:
  - 'Multiplicar por 100 en lugar de dividir por 100 al transformar un tanto por ciento en razón.'
  - 'La cantidad correspondiente al 100% puede ser diferente a la base original del problema.'
  - 'Sumar 100 al número del porcentaje en lugar de colocarlo como denominador.'
  - 'Los porcentajes mayores al 100% carecen de sentido matemático en comparaciones proporcionales.'
  - 'Invertir la fracción escribiendo 100 en el numerador $100 / p$.'
afirmaciones_verdaderas:
  - 'Un porcentaje $p\%$ es una razón de consecuente fijo igual a 100 expresada por la fracción $\frac{p}{100}$.'
  - 'El $100\%$ de una cantidad equivale a la totalidad del valor de referencia ($100\% \text{ de } C = C$).'
al_terminar_debes_poder: 'Expresar y comprender porcentajes como razones de denominador 100 mediante la fórmula $p\% = \frac{p}{100}$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
