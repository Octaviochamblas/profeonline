resumen_inicial: 'Un porcentaje $P\%$ es una razón de denominador fijo $100$ que indica
  cuántas partes se consideran de un total dividido en cien partes iguales: $P\% =
  \frac{P}{100}$.'
explicacion_simple: El porcentaje es una forma de comparar cantidades dividiendo cualquier
  total como si tuviera 100 partes iguales. Si decimos que el 25% de los alumnos usa
  anteojos, significa que de cada 100 estudiantes, exactamente 25 los utilizan.
explicacion_formal: 'Para todo valor real $P \ge 0$, el **Porcentaje como Razón de
  Base Cien** se define como:


  $$P\% = \frac{P}{100} = P : 100$$


  **Propiedad de escala estándar:**

  - Permite unificar y comparar razones de distinta base sobre una escala común normalizada
  de $100$ unidades.'
definiciones_clave: '- **Porcentaje $P\%$**: Razón de denominador cien $P\% = \frac{P}{100}$.'
propiedades_relaciones: '- **Normalización a base 100**: Expresa relaciones de partes
  sobre una referencia fija de 100.'
ejemplo_guiado:
  enunciado: Exprese como razón de denominador $100$ los porcentajes $15\%$, $50\%$
    y $120\%$.
  pasos:
  - 'Paso 1: Para $15\%$, colocar como numerador $15$ sobre $100 \implies \frac{15}{100}$.'
  - 'Paso 2: Para $50\%$, colocar como numerador $50$ sobre $100 \implies \frac{50}{100}$.'
  - 'Paso 3: Para $120\%$, colocar como numerador $120$ sobre $100 \implies \frac{120}{100}$.'
  - 'Conclusión: Se expresan como $\frac{15}{100}$, $\frac{50}{100}$ y $\frac{120}{100}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente el porcentaje P% como razón?
  choices:
  - text: Como la razón de denominador cien P / 100
    is_correct: true
  - text: Como la multiplicación P · 100
    is_correct: false
  - text: Como la resta 100 - P
    is_correct: false
  - text: Como P / 1.000
    is_correct: false
  explanation: La alternativa correcta es 'Como la razón de denominador cien P / 100'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 15%, ¿cuál es su expresión como razón de base
    cien?
  choices:
  - text: 15 / 100
    is_correct: true
  - text: 1,5 / 100
    is_correct: false
  - text: 150 / 100
    is_correct: false
  - text: 100 / 15
    is_correct: false
  explanation: La alternativa correcta es '15 / 100'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir e interpretar cualquier
  porcentaje $P\%$ como una razón de denominador cien $P\% = \frac{P}{100}$.
semantic_id: MAT.NUM.PORCENTAJES.RAZON_CIEN
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.RAZON_CIEN.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
