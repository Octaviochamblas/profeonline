procedimiento:
- 'Paso 1: Identifica el número que acompaña al símbolo de porcentaje (%).'
- 'Paso 2: Escribe ese número como el numerador de una fracción.'
- 'Paso 3: Escribe el número 100 como denominador. Esa es su forma de razón.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de porcentaje
  como razón de denominador 100.
ejemplos:
- titulo: Conversión directa
  enunciado: ¿Qué significa matemáticamente un 42%?
  solucion_pasos:
  - Significa que si dividimos algo en 100 partes iguales, tomamos 42 de ellas.
  - En fracción se escribe $42/100$.
  - Si lo divides, es $0.42$ en decimal.
- titulo: Ejemplo 2
  enunciado: ¿Qué fracción representa un 78%?
  alternativas:
  - 78/100
  - 100/78
  - 78/1
  respuesta: 78/100
  solucion_pasos:
  - El porcentaje siempre tiene como denominador 100.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el equivalente en porcentaje de la razón 9/100?
  alternativas:
  - 9%
  - 90%
  - 0,9%
  respuesta: 9%
  solucion_pasos:
  - El numerador de una razón con denominador 100 es directamente el porcentaje.
- titulo: ¿Un porcentaje puede ser mayor a 100%?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo, un 200% representa el doble de un total.
errores_frecuentes:
- Creer que 100% es el número máximo que existe (se puede tener 200%, que es el doble de un
  total).
- Escribir $50\%$ como la fracción $100/50$.
- Olvidar que el % es solo una notación y no un número en sí mismo para operar sin convertirlo.
- Creer que un porcentaje no puede superar el 100%, cuando en realidad puede representar más
  de un total, por ejemplo un aumento del 150%.
- Tratar el símbolo % como una unidad de medida física en vez de una notación matemática.
afirmaciones_verdaderas:
- La propiedad de concepto de porcentaje como razón de denominador 100 preserva la consistencia
  lógica.
- El símbolo % siempre indica una división implícita entre 100, sin importar el contexto del
  problema.
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de porcentaje
  como razón de denominador 100.
