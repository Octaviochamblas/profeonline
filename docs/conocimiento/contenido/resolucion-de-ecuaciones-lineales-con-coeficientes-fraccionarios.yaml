semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: Una ecuación lineal con coeficientes fraccionarios se simplifica multiplicando todos sus términos por el m.c.m. de los denominadores numéricos.
explicacion_simple: |
  Cuando una ecuación presenta términos fraccionarios cuyos denominadores son números constantes (como $\frac{x}{3} + \frac{x}{2} = 5$), la mejor estrategia de resolución consiste en enterizar la ecuación.

  Calculamos el mínimo común múltiplo (m.c.m.) de todos los denominadores numéricos presentes y multiplicamos **cada término** de la ecuación por dicho valor.

  Este procedimiento transforma la ecuación fraccionaria en una ecuación entera equivalente, mucho más sencilla de despejar.
explicacion_formal: |
  ### Definición formal
  Dada una ecuación con coeficientes fraccionarios $\frac{a_1}{d_1} x + \frac{a_2}{d_2} = \frac{a_3}{d_3}$, sea $M = \operatorname{mcm}(d_1, d_2, d_3)$ el mínimo común múltiplo de los denominadores. La **homogeneización entera** establece:

  $$M \cdot \left(\frac{a_1}{d_1} x + \frac{a_2}{d_2}\right) = M \cdot \left(\frac{a_3}{d_3}\right) \implies A_1 x + A_2 = A_3$$

  donde $A_i = a_i \cdot \frac{M}{d_i}$ son coeficientes numéricos enteros.

  ### Desglose de la fórmula
  - $M$: Mínimo común múltiplo de los denominadores $d_1, d_2, d_3$.
  - $A_i$: Coeficientes enteros obtenidos al dividir $M$ entre el denominador $d_i$ y multiplicar por el numerador $a_i$.

  ### Síntesis didáctica
  Puesto que los denominadores son números conocidos no nulos ($d_i \neq 0$), estas ecuaciones están bien definidas para todo $x \in \mathbb{R}$ sin requerir restricciones de dominio.
definiciones_clave: |
  - **Ecuación con coeficientes fraccionarios**: Ecuación donde la variable está en los numeradores y los denominadores son constantes numéricas reales.
  - **Enterización por m.c.m.**: Multiplicación de todos los miembros por el m.c.m. para eliminar denominadores.
propiedades_relaciones: |
  - **Ausencia de soluciones extrañas**: Al no contener la variable en los denominadores, toda solución real obtenida es válida.
  - **Preservación de equivalencia**: La propiedad multiplicativa con factor $M \neq 0$ genera una ecuación equivalente.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación lineal con coeficientes fraccionarios $\frac{x}{3} + \frac{x}{4} = 7$ multiplicando por el m.c.m. de los denominadores y evalúa la solución.'
  pasos:
    - 'Paso 1: Determinar el m.c.m. de los denominadores $3$ y $4$: $\operatorname{mcm}(3, 4) = 12$.'
    - 'Paso 2: Multiplicar cada término de la ecuación por $12$: $12 \cdot \frac{x}{3} + 12 \cdot \frac{x}{4} = 12 \cdot 7$.'
    - 'Paso 3: Simplificar los cocientes numéricos: $4x + 3x = 84$.'
    - 'Paso 4: Reducir los términos semejantes: $7x = 84$.'
    - 'Paso 5: Trasponer $7$ dividiendo al segundo miembro: $x = \frac{84}{7} = 12$.'
    - 'Paso 6: Comprobar sustituyendo $x = 12$: $\frac{12}{3} + \frac{12}{4} = 4 + 3 = 7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación entera equivalente obtenida al multiplicar $\frac{x}{3} + \frac{x}{4} = 7$ por el m.c.m. $12$?'
    choices:
      - {text: '$4x + 3x = 84$', is_correct: true}
      - {text: '$3x + 4x = 7$', is_correct: false}
      - {text: '$x + x = 84$', is_correct: false}
      - {text: '$12x + 12x = 84$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4x + 3x = 84$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación $\frac{x}{3} + \frac{x}{4} = 7$, ¿cuál es el valor de $x$ obtenido?'
    choices:
      - {text: '$x = 12$', is_correct: true}
      - {text: '$x = 7$', is_correct: false}
      - {text: '$x = 14$', is_correct: false}
      - {text: '$x = 84$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 12$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todos los denominadores numéricos de las fracciones de la ecuación.'
  - 'Paso 2: Calcular el mínimo común múltiplo (m.c.m.) de dichos denominadores.'
  - 'Paso 3: Multiplicar TODOS los términos de ambos miembros (tanto fraccionarios como enteros) por el m.c.m.'
  - 'Paso 4: Dividir el m.c.m. entre cada denominador y multiplicar el resultado por su respectivo numerador.'
  - 'Paso 5: Resolver la ecuación lineal entera resultante mediante transposición de términos.'
errores_correccion: |
  - **Error 1:** Multiplicar por el m.c.m. solo los términos con fracción y olvidar multiplicarlo por los términos enteros (ejemplo: escribir $4x + 3x = 7$ en vez de $84$). **Cómo corregirlo:** La propiedad multiplicativa **EXIGE MULTIPLICAR ABSOLUTAMENTE TODOS LOS TÉRMINOS DE LA ECUACIÓN POR EL M.C.M., INCLUYENDO CONSTANTES ENTERAS**.
  - **Error 2:** Multiplicar el m.c.m. por los denominadores en lugar de simplificarlos. **Cómo corregirlo:** El m.c.m. **DEBE DIVIDIRSE ENTRE EL DENOMINADOR DE CADA FRACCIÓN PARA ELIMINAR LA FRACCIÓN ($12 \cdot \frac{x}{3} = 4x$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la versión enterizada de $\frac{x}{2} - \frac{x}{5} = 3$ al multiplicar por el m.c.m. $10$?'
    alternativas:
      - '$5x - 2x = 30$'
      - '$5x - 2x = 3$'
      - '$2x - 5x = 30$'
    respuesta: '$5x - 2x = 30$'
    solucion_pasos:
      - '1. $\operatorname{mcm}(2, 5) = 10$.'
      - '2. $10 \cdot \frac{x}{2} - 10 \cdot \frac{x}{5} = 10 \cdot 3 \implies 5x - 2x = 30$.'
      - '3. $3x = 30 \implies x = 10$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la ecuación $\frac{x}{4} + 1 = \frac{x}{2}$.'
    alternativas:
      - '$x = 4$'
      - '$x = 2$'
      - '$x = 8$'
    respuesta: '$x = 4$'
    solucion_pasos:
      - '1. Multiplicar por m.c.m. $4$: $4 \cdot \frac{x}{4} + 4 \cdot 1 = 4 \cdot \frac{x}{2}$.'
      - '2. $x + 4 = 2x$.'
      - '3. Trasponer $x$: $2x - x = 4 \implies x = 4$.'
  - titulo: 'Constantes enteras y m.c.m.'
    enunciado: '¿La constante $5$ en la ecuación $\frac{x}{2} + 5 = 9$ debe ser multiplicada por el m.c.m. $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, produce $x + 10 = 18$.'
  - titulo: 'Dominio en coeficientes fraccionarios'
    enunciado: '¿Una ecuación con coeficientes fraccionarios puede tener restringido algún número de $\mathbb{R}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, pues no contiene a la variable en el denominador.'
errores_frecuentes:
  - 'Multiplicar por el m.c.m. solo las fracciones y no los sumandos enteros.'
  - 'Multiplicar el m.c.m. por el denominador en lugar de simplificarlo por división.'
  - 'Olvidar colocar paréntesis al multiplicar un m.c.m. por un numerador compuesto ($a + b$).'
  - 'Calcular un m.c.m. erróneo que no elimine todos los denominadores numéricos.'
  - 'Restringir valores de $x$ en ecuaciones donde la variable solo está en los numeradores.'
afirmaciones_verdaderas:
  - 'Multiplicar una ecuación con coeficientes fraccionarios por el m.c.m. de sus denominadores la transforma en una ecuación entera equivalente.'
  - 'Las ecuaciones con coeficientes fraccionarios no poseen restricciones en su dominio real.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones lineales de primer grado con coeficientes fraccionarios.
  CÓMO: Determinar el m.c.m. de los denominadores numéricos, multiplicar cada término por dicho valor, enterizar la ecuación y despejar la incógnita.
