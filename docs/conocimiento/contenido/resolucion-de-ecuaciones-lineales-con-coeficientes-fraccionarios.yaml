procedimiento:
- Calcula el MCM de todos los números que están en los denominadores.
- Multiplica TODA la ecuación (cada término, a la izquierda y derecha) por el MCM.
- Simplifica cruzado cada término. La ecuación ahora será plana (sin fracciones).
- Resuelve la ecuación lineal normal resultante.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución de ecuaciones lineales con coeficientes fraccionarios.
ejemplos:
- titulo: $x$ y $\frac{1}{2}x + \frac{3}{4} = \frac{x}{3}$
  enunciado: Justifica el procedimiento adecuado para el caso $x$ y $\frac{1}{2}x
    + \frac{3}{4} = \frac{x}{3}$.
  solucion_pasos:
  - Estas son ecuaciones donde la $x$ permanece en el numerador o a un lado, pero
    está acompañada de fracciones numéricas molestas, como $\frac{1}{2}x + \frac{3}{4}
    = \frac{x}{3}$.
  - Calcula el MCM de todos los números que están en los denominadores.
- titulo: $x$ y $\frac{1}{2}x + \frac{3}{4} = \frac{x}{3}$
  enunciado: Determina qué debe hacerse en $x$ y $\frac{1}{2}x + \frac{3}{4} = \frac{x}{3}$
    y fundamenta cada transformación.
  solucion_pasos:
  - Estas son ecuaciones donde la $x$ permanece en el numerador o a un lado, pero
    está acompañada de fracciones numéricas molestas, como $\frac{1}{2}x + \frac{3}{4}
    = \frac{x}{3}$.
  - Multiplica TODA la ecuación (cada término, a la izquierda y derecha) por el MCM.
