semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: Una ecuación con coeficientes fraccionarios se simplifica multiplicando
  todos sus términos por el m.c.m. de los denominadores numéricos.
explicacion_simple: 'Cuando una ecuación tiene fracciones compuestas solo por números
  en el denominador (como $\frac{x}{3} + \frac{x}{2} = 5$), la mejor estrategia para
  resolverla es ''eliminar las fracciones''.

  Calculamos el m.c.m. de los números de abajo y multiplicamos cada término de la
  ecuación por ese m.c.m.

  Esto transforma la ecuación con fracciones en una ecuación entera mucho más fácil
  de resolver.'
explicacion_formal: 'Dada una ecuación con coeficientes fraccionarios $\frac{a_1}{d_1}
  x + \frac{a_2}{d_2} = \frac{a_3}{d_3}$, sea $M = \operatorname{lcm}(d_1, d_2, d_3)$.
  La **homogeneización entera** se expresa como:


  $$M \cdot \left(\frac{a_1}{d_1} x + \frac{a_2}{d_2}\right) = M \cdot \left(\frac{a_3}{d_3}\right)
  \implies A_1 x + A_2 = A_3$$


  donde $A_i = a_i \cdot \frac{M}{d_i}$ son coeficientes enteros.'
definiciones_clave: '- **Ecuación con coeficientes fraccionarios**: Ecuación donde
  las incógnitas están en los numeradores y los denominadores son constantes numéricas.

  - **Enterización de la ecuación**: Proceso de convertir coeficientes fraccionarios
  en coeficientes enteros multiplicando por el m.c.m.'
propiedades_relaciones: '- **Sin restricciones de dominio**: Como los denominadores
  son números no nulos conocidos ($d_i \neq 0$), el dominio de estas ecuaciones es
  todo el conjunto $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación lineal con coeficientes fraccionarios $\frac{x}{3}
    + \frac{x}{4} = 7$ multiplicando por el m.c.m. de los denominadores y evalúa la
    solución.
  pasos:
  - 'Paso 1: Determinar el m.c.m. de los denominadores $3$ y $4$: $\operatorname{lcm}(3,
    4) = 12$.Paso 2: Multiplicar cada término de la ecuación por $12$: $12 \cdot \frac{x}{3}
    + 12 \cdot \frac{x}{4} = 12 \cdot 7$.Paso 3: Simplificar los productos: $4x +
    3x = 84$.Paso 4: Reducir términos semejantes: $7x = 84$.Paso 5: Trasponer $7$
    dividiendo: $x = \frac{84}{7} = 12$.Paso 6: Comprobar: $\frac{12}{3} + \frac{12}{4}
    = 4 + 3 = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación entera equivalente al multiplicar $\frac{x}{3} +
    \frac{x}{4} = 7$ por el m.c.m. $12$?
  choices:
  - text: $4x + 3x = 84$
    is_correct: true
  - text: $3x + 4x = 7$
    is_correct: false
  - text: $x + x = 84$
    is_correct: false
  - text: $12x + 12x = 84$
    is_correct: false
  explanation: La alternativa correcta es '$4x + 3x = 84$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver la ecuación $\frac{x}{3} + \frac{x}{4} = 7$, ¿cuál es el valor
    de $x$?
  choices:
  - text: $x = 12$
    is_correct: true
  - text: $x = 7$
    is_correct: false
  - text: $x = 14$
    is_correct: false
  - text: $x = 84$
    is_correct: false
  explanation: La alternativa correcta es '$x = 12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los denominadores numéricos de todas las fracciones de la ecuación.'
- 'Paso 2: Calcular el m.c.m. de esos denominadores.'
- 'Paso 3: Multiplicar TODOS los términos de ambos miembros por el m.c.m.'
- 'Paso 4: Simplificar cada término cancelando los denominadores para obtener una
  ecuación entera.'
- 'Paso 5: Despejar la incógnita de forma habitual.'
errores_correccion: '- **Error común:** Multiplicar por el m.c.m. solo los términos
  que tienen fracción y olvidar multiplicarlo por los términos enteros (ejemplo: escribir
  $4x + 3x = 7$ en vez de $84$).

  - **Cómo corregirlo:** La propiedad multiplicativa exige multiplicar TODOS los términos
  de la ecuación por el m.c.m. sin excepción.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
