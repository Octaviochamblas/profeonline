semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Resolución de ecuaciones lineales con coeficientes fraccionarios:
  propiedades, resolución y modelamiento en Ecuaciones fraccionarias de primer grado.'
explicacion_simple: 'El secreto del éxito aquí es el ''multiplicación por el mínimo
  común múltiplo'': multiplicar toda la balanza (ambos miembros) por el **MCM numérico
  de los denominadores**.'
explicacion_formal: '### Definición formal


  Una ecuación lineal con coeficientes fraccionarios $\frac{a_1}{b_1}x + \frac{a_2}{b_2}
  = \frac{a_3}{b_3}x + \dots$ se reduce a una ecuación de coeficientes enteros multiplicando
  ambos miembros por el Mínimo Común Múltiplo de los denominadores $b_1, b_2, b_3,
  \dots$, pues ese producto es divisible exactamente por cada uno de ellos.


  ### Desarrollo didáctico


  El secreto del éxito aquí es el ''multiplicación por el mínimo común múltiplo'':
  multiplicar toda la balanza (ambos miembros) por el **MCM numérico de los denominadores**.


  Ejemplo: Denominadores 2, 4 y 3. El MCM es 12. Si multiplicas cada término de la
  ecuación por 12, de manera directa todas las fracciones se convertirán en números
  enteros, porque el 12 se dividirá exactamente por el 2, el 4 y el 3.'
definiciones_clave: '- **Resolución de ecuaciones lineales con coeficientes fraccionarios**:
