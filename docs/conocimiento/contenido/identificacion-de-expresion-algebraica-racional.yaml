semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_RACIONAL
resumen_inicial: 'Identificación de expresión algebraica racional: concepto y propiedades
  en Clasificación técnica de expresiones algebraicas.'
explicacion_simple: 'En el reino animal, tanto los leones como los tigres son felinos.
  En el álgebra, tanto las expresiones enteras como las fraccionarias pertenecen a
  una misma gran familia: Las Racionales.'
explicacion_formal: "### Definición formal\n\nLas racionales son la gran familia matriz\
  \ que acepta divisiones por letras, pero prohíbe las raíces sobre las letras.\n\n\
  ### Desarrollo didáctico\n\nLa palabra 'racional' en matemáticas suele estar asociada\
  \ a la idea de proporción o fracción sin componentes infinitos no periódicos. \n\
  - $3x^2 + 5$ es racional (y además, entera).\n- $\\frac{2}{x}$ es racional (y además,\
  \ fraccionaria).\n- $\\sqrt{5} \\cdot x$ es racional. (Ojo: La raíz afecta al número\
  \ 5, no a la 'x'.).\n\n¿Quién no entra a la fiesta? Las expresiones donde la *variable*\
  \ está atrapada dentro de un radical, como $\\sqrt{x}$. Esas son la otra gran familia\
  \ (Irracionales)."
definiciones_clave: '- **Identificación de expresión algebraica racional**: Elemento
  fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de expresión algebraica
  racional**: Reglas de notación y clasificación en clasificación técnica de expresiones
  algebraicas.'
ejemplo_guiado:
  enunciado: Identifica o calcula los elementos correspondientes a identificación
