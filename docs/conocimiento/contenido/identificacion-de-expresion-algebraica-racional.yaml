semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_RACIONAL
resumen_inicial: 'Una expresión algebraica es racional cuando ninguna de sus variables está afectada por signos de radicación o exponentes fraccionarios.'
explicacion_simple: |
  - Una expresión algebraica es **racional** cuando las variables tienen **exponentes enteros** (positivos, negativos o cero: $\dots, -2, -1, 0, 1, 2, \dots$).
  - **La regla de oro:** ¡No puede haber letras dentro de raíces ($\sqrt{x}$) ni letras con exponentes en fracción ($x^{1/2}$)!
  - El gran conjunto de las expresiones racionales se divide en dos grupos:
    1. **Racionales Enteras:** No tienen letras en el denominador (ej. $3x^2 - 5x + 1$).
    2. **Racionales Fraccionarias:** Tienen letras en el denominador (ej. $\frac{2x+1}{x-3}$).
  - Ambas son racionales porque ninguna tiene a la letra dentro de una raíz.

  ![Expresión Algebraica Racional](/static/img/nodos/identificacion-de-expresion-algebraica-racional-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica $E(x_1, \dots, x_n)$ es **racional** si se puede expresar como el cociente de dos polinomios con coeficientes en el cuerpo $\mathbb{K}$:

  $$E(x_1, \dots, x_n) = \frac{P(x_1, \dots, x_n)}{Q(x_1, \dots, x_n)}, \quad P, Q \in \mathbb{K}[x_1, \dots, x_n], \quad Q \neq \mathbf{0}$$

  Es decir, todas las operaciones algebraicas aplicadas sobre las variables se limitan exclusivamente a la **adición, sustracción, multiplicación y división**.

  ### Estructura de conjuntos
  $$\text{Expresiones Racionales} = \text{Racionales Enteras (Polinomios)} \;\cup\; \text{Racionales Fraccionarias}$$
  $$\mathbb{K}[x_1, \dots, x_n] \subset \mathbb{K}(x_1, \dots, x_n)$$
definiciones_clave: |
  - **Expresión algebraica racional**: Expresión construida únicamente mediante las cuatro operaciones aritméticas básicas sobre variables.
  - **Cuerpo de fracciones $\mathbb{K}(x)$**: Estructura algebraica de todas las funciones racionales.
  - **Exponente entero ($e_i \in \mathbb{Z}$)**: Condición de que ninguna variable posee potencias fraccionarias irreducibles.
propiedades_relaciones: |
  - **Operaciones cerradas**: La suma, resta, producto y cociente (por expresiones no nulas) de expresiones racionales genera siempre otra expresión racional.
  - **Diferencia con irracionales**: Una expresión es racional si y solo si no es irracional.
ejemplo_guiado:
  enunciado: 'Clasifica las siguientes expresiones algebraicas en racionales enteras, racionales fraccionarias o no racionales: a) $P(x) = \frac{5x^3 - 2}{4}$, b) $Q(x) = \frac{3x + 1}{x^2 + 5}$, c) $R(x) = 4\sqrt{x} - 7$.'
  imagen: '/static/img/nodos/identificacion-de-expresion-algebraica-racional-ejemplos.svg'
  pasos:
    - 'Paso 1: Analizamos $P(x) = \frac{5x^3 - 2}{4}$: las potencias de $x$ son $3$ y $0$ (enteras $\ge 0$) y el divisor es constante $\implies$ **Racional Entera**.'
    - 'Paso 2: Analizamos $Q(x) = \frac{3x + 1}{x^2 + 5}$: las potencias de $x$ son $1, 0, 2$ (enteras en $\mathbb{Z}$) y el divisor contiene a $x$ $\implies$ **Racional Fraccionaria**.'
    - 'Paso 3: Analizamos $R(x) = 4\sqrt{x} - 7$: la variable $x$ se encuentra bajo el signo de raíz ($x^{1/2}$) $\implies$ **No racional (es Irracional)**.'
    - 'Paso 4: Conclusión: $P(x)$ y $Q(x)$ son expresiones racionales; $R(x)$ es irracional.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición que define a una expresión algebraica como racional?'
    choices:
      - text: 'Que todas sus variables tengan exponentes enteros ($e_i \in \mathbb{Z}$), sin variables bajo signos radicales'
        is_correct: true
      - text: 'Que obligatoriamente tenga una línea de fracción'
        is_correct: false
      - text: 'Que todos sus coeficientes numéricos sean números enteros'
        is_correct: false
      - text: 'Que tenga una sola variable'
        is_correct: false
    explanation: 'La alternativa correcta es ''Que todas sus variables tengan exponentes enteros ($e_i \in \mathbb{Z}$), sin variables bajo signos radicales''. Las expresiones racionales involucran solo operaciones racionales (suma, resta, producto, cociente).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Es la expresión $\sqrt{7}x^3 - \frac{2}{x}$ una expresión algebraica racional?'
    choices:
      - text: 'Sí, porque la raíz afecta únicamente al número 7 y las potencias de $x$ son $3$ y $-1$ (ambas en $\mathbb{Z}$)'
        is_correct: true
      - text: 'No, porque tiene el símbolo de raíz cuadrada $\sqrt{7}$'
        is_correct: false
      - text: 'No, porque tiene un término negativo'
        is_correct: false
      - text: 'Es un polinomio entero'
        is_correct: false
    explanation: 'La alternativa correcta es ''Sí, porque la raíz afecta únicamente al número 7 y las potencias de $x$ son $3$ y $-1$ (ambas en $\mathbb{Z}$)''. Los coeficientes reales no alteran el carácter racional respecto a las variables.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar todas las apariciones de las variables en la expresión.'
  - 'Paso 2: Comprobar que ninguna variable esté dentro de radicales ni tenga exponentes no enteros.'
  - 'Paso 3: Si los exponentes de las variables son todos enteros ($e_i \in \mathbb{Z}$), clasificar como expresión racional.'
  - 'Paso 4: Subclasificar en entera (si no hay variables dividiendo) o fraccionaria (si hay variables dividiendo).'
errores_correccion: |
  - **Error 1:** Creer que una expresión racional debe ser obligatoriamente una fracción. **Cómo corregirlo:** Los polinomios como $x^2 + 5x$ **son expresiones racionales enteras**.
  - **Error 2:** Confundir constantes irracionales con expresiones irracionales. **Cómo corregirlo:** En $\sqrt{3}x$, la raíz es del número; la variable $x$ tiene potencia 1, por lo que **es racional**.
ejemplos:
  - titulo: 'Polinomio como expresión racional'
    enunciado: '¿Es el trinomio $P(x) = 2x^2 - 3x + 5$ una expresión algebraica racional?'
    alternativas:
      - 'Sí, es una expresión racional entera'
      - 'No, porque no es una fracción'
      - 'Es una expresión irracional'
    respuesta: 'Sí, es una expresión racional entera'
    solucion_pasos:
      - '1. Las potencias de $x$ son 2, 1, 0 $\in \mathbb{Z}$.'
      - '2. No hay variables en raíces ni denominadores.'
      - '3. Es racional entera.'
  - titulo: 'Cociente racional'
    enunciado: '¿Es $\frac{x^2 - 4}{x + 2}$ una expresión racional?'
    alternativas:
      - 'Sí, es una expresión racional fraccionaria'
      - 'No, es irracional'
      - 'Es un número entero'
    respuesta: 'Sí, es una expresión racional fraccionaria'
    solucion_pasos:
      - '1. Cociente de dos polinomios.'
      - '2. Potencias de $x$ enteras.'
      - '3. Es racional fraccionaria.'
  - titulo: 'Inclusión de polinomios'
    enunciado: '¿Todo polinomio es una expresión algebraica racional?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por definición, los polinomios forman el subconjunto de racionales enteras.'
      - '2. $\mathbb{K}[x] \subset \mathbb{K}(x)$.'
  - titulo: 'Variable bajo raíz'
    enunciado: '¿Es la expresión $3\sqrt{x} + 2$ racional?'
    respuesta: 'No'
    solucion_pasos:
      - '1. La variable $x$ está afectada por la raíz ($x^{1/2}$).'
      - '2. Es una expresión algebraica irracional.'
errores_frecuentes:
  - 'Creer que el término racional exige que la expresión deba contener obligatoriamente una fracción.'
  - 'Confundir raíces de constantes numéricas (ej: $\sqrt{2}$) con expresiones algebraicas irracionales.'
  - 'Ignorar que las expresiones racionales engloban tanto a polinomios enteros como a fracciones algebraicas.'
  - 'Clasificar expresiones con potencias negativas como irracionales en vez de racionales fraccionarias.'
  - 'Olvidar que las operaciones permitidas en expresiones racionales son solo suma, resta, producto y división.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es racional si y solo si todas sus variables poseen exponentes enteros en $\mathbb{Z}$.'
  - 'El conjunto de expresiones racionales está formado por la unión de las racionales enteras y las racionales fraccionarias.'
al_terminar_debes_poder: |
  ![Resumen de Expresión Racional](/static/img/nodos/identificacion-de-expresion-algebraica-racional-resumen.svg)

  QUÉ: Identificar y clasificar expresiones algebraicas racionales distinguiendo entre su forma entera y fraccionaria.
  CÓMO: Verificando que todas las variables tengan potencias enteras ($e_i \in \mathbb{Z}$) sin la presencia de radicales sobre las letras.
