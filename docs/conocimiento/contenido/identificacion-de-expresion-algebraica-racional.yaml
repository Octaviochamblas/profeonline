procedimiento:
- 'Paso 1: Revisa toda la expresión buscando símbolos de raíz (cuadrada, cúbica, etc.)
  o exponentes en forma de fracción (ej. x^(1/2)).'
- 'Paso 2: Si ves alguna raíz, fíjate qué hay adentro.'
- 'Paso 3: Si dentro de la raíz SOLO hay números, y ninguna letra, la expresión sigue
  siendo Racional.'
- 'Paso 4: Si no hay raíces afectando letras, puedes clasificarla con seguridad como
  Racional.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de expresión algebraica racional.
ejemplos:
- titulo: El club racional
  enunciado: Verifica si la expresión x^2 + 3/x - √7 es racional.
  solucion_pasos:
  - El primer término no tiene raíz. Es racional.
  - El segundo tiene una fracción (letra en denominador), pero no tiene raíz. Es racional.
  - El tercero es √7. Es una raíz, pero adentro solo hay un número (el 7). No afecta
    a las variables.
  - 'Conclusión: La expresión completa es Racional.'
- titulo: Un sistema de cálculo pide que solo se ingresen 'Expresiones Racionales'
    (permitiendo tanto
  enunciado: 'Un sistema de cálculo pide que solo se ingresen ''Expresiones Racionales''
    (permitiendo tanto enteras como fraccionarias) porque no tiene el módulo para
    procesar raíces variables. Si un usuario ingresa la fórmula física del periodo
    del péndulo $T = 2\pi \sqrt{\frac{L}{g}}$ (donde $L$ y $g$ son variables), ¿qué
    hará el sistema? (v1)


    Opciones: A) La rechazará, porque las variables $L$ y $g$ están dentro de un radical,
    convirtiendo la expresión en Irracional. · B) La aceptará, porque es una expresión
    fraccionaria ($L/g$). · C) La aceptará, porque el número $2$ y $\pi$ están fuera
    de la raíz. · D) La rechazará exclusivamente por tener la letra $\pi$.'
  solucion_pasos:
  - Las variables $L$ y $g$ están bajo el techo de la raíz cuadrada. Esto la expulsa
    automáticamente de la familia Racional.
  - 'Respuesta: La rechazará, porque las variables $L$ y $g$ están dentro de un radical,
    convirtiendo la expresión en Irracional.'
- titulo: 'Respecto de «Identificación de expresión algebraica racional»: ¿Se ajusta
    a la definición es'
  enunciado: 'Respecto de «Identificación de expresión algebraica racional»: ¿Se ajusta
    a la definición esta afirmación? «Una **Expresión Algebraica Racional** es el
    conjunto mayor que engloba tanto a las expresiones enteras como a las fraccionarias»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una **Expresión Algebraica Racional**
    es el conjunto mayor que engloba tanto a las expresiones enteras como a las fraccionarias.'
- titulo: 'Respecto de «Identificación de expresión algebraica racional»: ¿Es compatible
    con el procedi'
  enunciado: 'Respecto de «Identificación de expresión algebraica racional»: ¿Es compatible
    con el procedimiento esta afirmación? «Creer que la presencia de un número irracional
    (como $\sqrt{2}$ o $\pi$) vuelve a la expresión algebraica irracional. La clasificación
    depende del estado de las *variables*, no de las constantes numéricas»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una **Expresión Algebraica Racional**
    es el conjunto mayor que engloba tanto a las expresiones enteras como a las fraccionarias.'
errores_frecuentes:
- Creer que la presencia de un número irracional (como $\sqrt{2}$ o $\pi$) vuelve
  a la expresión algebraica irracional. La clasificación depende del estado de las
  *variables*, no de las constantes numéricas.
- Pensar que una expresión no puede ser simultáneamente 'Fraccionaria' y 'Racional'.
  (Fraccionaria es un subtipo de Racional).
- Para «¿Qué macro-clasificación engloba conjuntamente a las 'Expresiones Algebraicas
  Enteras' y a las 'Expresiones Algebraicas Fraccionarias', exigiendo únicamente que
  las variables no estén dentro de una raíz? (v1)», la respuesta correcta es Expresiones
  Algebraicas Irracionales.
- Polinomios Homogéneos.
- Para «¿Qué macro-clasificación engloba conjuntamente a las 'Expresiones Algebraicas
  Enteras' y a las 'Expresiones Algebraicas Fraccionarias', exigiendo únicamente que
  las variables no estén dentro de una raíz? (v1)», la respuesta correcta es Ecuaciones
  Lineales.
afirmaciones_verdaderas:
- La notación de identificación de expresión algebraica racional sigue las convenciones
  del lenguaje algebraico.
