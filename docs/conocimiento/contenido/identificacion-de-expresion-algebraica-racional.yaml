resumen_inicial: Una expresión algebraica racional es aquella en la que las variables
  literales no están sometidas a operaciones de radicación ni a exponentes fraccionarios.
explicacion_simple: Una expresión es 'racional' si sus letras están libres de signos
  de raíz (como $\sqrt{x}$ o $\sqrt[3]{y}$). Puede ser entera (sin letras en denominadores)
  o fraccionaria (con letras en denominadores), pero NUNCA debe tener letras atrapadas
  en raíces.
explicacion_formal: 'Una **Expresión Algebraica Racional** $R(X)$ comprende el conjunto
  de expresiones enteras y fraccionarias donde los exponentes $e_j$ de todas las variables
  son números enteros $e_j \in \mathbb{Z}$:


  $$R(X) \in \mathbb{R}(X) \iff \forall j, \quad x_j^{e_j} \quad \text{con } e_j \in
  \mathbb{Z}$$


  > **Complemento didáctico:** Las expresiones racionales forman el cuerpo de fracciones
  de los polinomios, cerradas bajo adición, sustracción, multiplicación y división.'
definiciones_clave: '- **Expresión racional**: Expresión con variables libres de radicandos
  (exponentes enteros en $\mathbb{Z}$).

  - **Clasificación interna**: Se dividen en racionales enteras y racionales fraccionarias.'
propiedades_relaciones: '- **Cierre algebraico**: Las operaciones $+,-,\cdot,/$ sobre
  expresiones racionales producen otra expresión racional.'
ejemplo_guiado:
  enunciado: Clasifique si $A = \frac{x^2 - 3}{x + 1}$ y $B = x^2 + \sqrt{x}$ son
    expresiones racionales.
  pasos:
  - 'Paso 1: Analizar $A = \frac{x^2 - 3}{x + 1}$: no contiene letras en raíces, exponentes
    son enteros $\to$ SÍ es racional (racional fraccionaria).'
  - 'Paso 2: Analizar $B = x^2 + \sqrt{x}$: contiene la variable $x$ dentro de la
    raíz $\sqrt{x} = x^{1/2} \to$ NO es racional (es irracional).'
  - 'Conclusión: Únicamente $A$ es una expresión algebraica racional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición excluye a una expresión del conjunto de las expresiones
    algebraicas racionales?
  choices:
  - text: Tener variables atrapadas bajo signos de radicación (exponentes fraccionarios)
    is_correct: true
  - text: Tener variables en denominadores
    is_correct: false
  - text: Tener coeficientes negativos
    is_correct: false
  - text: Contener constantes fraccionarias
    is_correct: false
  explanation: La alternativa correcta es 'Tener variables atrapadas bajo signos de
    radicación (exponentes fraccionarios)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué x^2 + sqrt(x) NO es racional?
  choices:
  - text: Porque contiene la variable x bajo un signo de raíz cuadrada (sqrt(x))
    is_correct: true
  - text: Porque tiene 2 términos
    is_correct: false
  - text: Porque su coeficiente es 1
    is_correct: false
  - text: Porque se puede simplificar
    is_correct: false
  explanation: La alternativa correcta es 'Porque contiene la variable x bajo un signo
    de raíz cuadrada (sqrt(x))'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Revisar si existen signos de raíz afectando a las letras.'
- 'Paso 2: Confirmar que todos los exponentes de las variables pertenezcan a los enteros
  $\mathbb{Z}$.'
- 'Paso 3: Declarar la expresión como algebraica racional.'
errores_correccion: '- **Error 1: Declarar que $\sqrt{5}x$ no es racional porque tiene
  raíz.** **Cómo corregirlo:** La raíz $\sqrt{5}$ está en el coeficiente numérico,
  no en la variable $x$; la expresión sigue siendo racional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes es una expresión racional?
  alternativas:
  - (2x + 1)/(x^2 + 4)
  - sqrt(3x) + 5
  - x^(3/2) - 1
  - 2x + sqrt(y)
  respuesta: (2x + 1)/(x^2 + 4)
  solucion_pasos:
  - 1. (2x + 1)/(x^2 + 4) no tiene variables dentro de raíces. Es una expresión racional
    fraccionaria.
- titulo: Ejemplo 2
  enunciado: La expresión sqrt(7)x^3 + 4, ¿es racional?
  alternativas:
  - Sí, porque la raíz afecta al número 7 y no a la variable x
  - No, porque tiene una raíz
  - No, porque es fraccionaria
  - Indeterminado
  respuesta: Sí, porque la raíz afecta al número 7 y no a la variable x
  solucion_pasos:
  - 1. Al no estar la variable x bajo la raíz, la expresión es plenamente racional.
- titulo: ¿Son las expresiones enteras y fraccionarias subconjuntos de las expresiones
    racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, las expresiones racionales agrupan a las enteras y fraccionarias (variables
    libres de raíces).
- titulo: ¿Es la expresión 3x^2 + sqrt(x) una expresión racional?
  respuesta: 'No'
  solucion_pasos:
  - No, la presencia de sqrt(x) la convierte en una expresión irracional.
errores_frecuentes:
- Declarar la presencia de raíces en coeficientes numéricos (como sqrt(2)x) con expresiones
  irracionales.
- Declarar que las expresiones fraccionarias no son racionales.
- Declarar que el grado de una expresión racional no se puede determinar.
- Declarar la clasificación racional de expresiones con los números racionales.
- Omitir verificar si una raíz sobre una variable se puede simplificar.
afirmaciones_verdaderas:
- Una expresión racional no contiene variables afectadas por operaciones de radicación.
- Tanto las expresiones enteras como las fraccionarias son expresiones algebraicas
  racionales.
al_terminar_debes_poder: Al terminar serás capaz de identificar una expresión algebraica
  racional verificando que sus variables no contengan exponentes fraccionarios ni
  estén en radicandos.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Clasificación de Expresiones.
estado: publicado
