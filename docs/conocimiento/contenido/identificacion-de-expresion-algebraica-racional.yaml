semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_RACIONAL
resumen_inicial: 'La identificación de expresión algebraica racional consiste en reconocer aquellas expresiones cuyas variables no están sometidas a operaciones de radicación (raíces) ni poseen exponentes fraccionarios.'
explicacion_simple: |
  Una **expresión algebraica racional** es aquella en la que **las letras NO están dentro de ninguna raíz**:
  - Las operaciones permitidas sobre sus letras son únicamente **suma, resta, multiplicación, división y potencias enteras**.
  - Las expresiones racionales se dividen en **dos grupos**:
    1. **Racionales Enteras**: Sin letras en el denominador (ejemplo: $3x^2 - 5x + 1$).
    2. **Racionales Fraccionarias**: Con letras en el denominador (ejemplo: $\frac{4}{x - 2}$).
  - **¿Qué la excluye?** Si ves una letra dentro de una raíz (como $\sqrt{x}$) o con un exponente fraccionario (como $x^{2/3}$), **deja de ser racional** y pasa a ser *irracional*.
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica $E(x_1, \dots, x_k)$ es **racional** si es representable como un elemento del cuerpo de fracciones racionales $\mathbb{R}(x_1, \dots, x_k)$, lo que exige que todas las potencias de sus variables sean números enteros:

  $$E(x_1, \dots, x_k) \in \mathbb{R}(x_1, \dots, x_k) \iff \forall x_i, \quad \operatorname{exp}(x_i) \in \mathbb{Z}$$

  ### Clasificación y Árbol Taxonómico

  $$\text{Expresión Racional } \mathbb{R}(x) \begin{cases} \text{Racional Entera } \mathbb{R}[x] & (\text{Sin } x \text{ en denominador, } \operatorname{exp}(x) \in \mathbb{N}_0) \\ \text{Racional Fraccionaria } \mathbb{R}(x) \setminus \mathbb{R}[x] & (\text{Con } x \text{ en denominador, } \operatorname{exp}(x) \in \mathbb{Z} \setminus \mathbb{N}_0) \end{cases}$$

  ### Síntesis didáctica
  La racionalidad algebraica asegura que no existan exponentes fraccionarios en las variables. Permite operar mediante las reglas estándar de polinomios y fracciones sin recurrir a la radicación.
definiciones_clave: |
  - **Expresión algebraica racional**: Expresión cuyas variables están afectadas únicamente por operaciones de adición, sustracción, multiplicación, división y potencias enteras.
  - **Racional entera**: Subcategoría racional sin variables en el denominador (polinomios puros).
  - **Racional fraccionaria**: Subcategoría racional con variables en el denominador.
propiedades_relaciones: |
  - **Cierre algebraico**: La suma, resta, multiplicación y división de expresiones racionales produce siempre otra expresión racional.
  - **Diferencia con coeficiente irracional**: Una expresión como $\sqrt{5} \cdot x$ es **racional**, pues la raíz afecta únicamente al número $5$, no a la variable $x$.
ejemplo_guiado:
  enunciado: 'Clasifica la naturaleza de las siguientes expresiones algebraicas indicando si son racionales (enteras o fraccionarias) o no racionales: a) $\frac{3x^2 + 1}{x}$, b) $\sqrt{2} \cdot x^3$, c) $5\sqrt{x} - 4$.'
  pasos:
    - 'Paso 1: Analizamos a) $\frac{3x^2 + 1}{x}$: La variable no está bajo raíz y tiene exponente entero; tiene $x$ en el denominador $\implies$ **Es una Expresión Racional Fraccionaria**.'
    - 'Paso 2: Analizamos b) $\sqrt{2} \cdot x^3$: La raíz afecta sólo al número $2$, la variable $x$ tiene exponente entero $3$ sin denominador $\implies$ **Es una Expresión Racional Entera**.'
    - 'Paso 3: Analizamos c) $5\sqrt{x} - 4$: La variable $x$ está dentro de una raíz cuadrada ($x^{1/2}$) $\implies$ **No es racional** (es una expresión irracional).'
    - 'Conclusión: **a) es Racional Fraccionaria, b) es Racional Entera y c) No es Racional**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación NO puede estar afectando a las variables en una expresión para que se clasifique como racional?'
    choices:
      - {text: 'La radicación o extracción de raíz (exponentes fraccionarios en las letras)', is_correct: true}
      - {text: 'La multiplicación por un coeficiente constante', is_correct: false}
      - {text: 'La adición o sustracción de términos', is_correct: false}
      - {text: 'La división por un número entero', is_correct: false}
    explanation: 'La alternativa correcta es ''La radicación o extracción de raíz (exponentes fraccionarios en las letras)''. Las letras no pueden estar dentro de raíces.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'La expresión algebraica $\sqrt{7} \cdot x^2 + \frac{x}{3}$, ¿es una expresión racional entera?'
    choices:
      - {text: 'Sí, porque la raíz $\sqrt{7}$ afecta sólo al coeficiente constante y la variable $x$ tiene exponentes enteros sin estar en el denominador', is_correct: true}
      - {text: 'No, porque aparece la raíz cuadrada de 7', is_correct: false}
      - {text: 'No, porque la variable está en el denominador', is_correct: false}
      - {text: 'Se clasifica como expresión fraccionaria irracional', is_correct: false}
    explanation: 'La alternativa correcta es ''Sí, porque la raíz $\sqrt{7}$ afecta sólo al coeficiente constante y la variable $x$ tiene exponentes enteros sin estar en el denominador''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todas las variables o letras que figuran en la expresión.'
  - 'Paso 2: Comprobar que ninguna de las letras esté bajo un signo de radical ($\sqrt{x}, \sqrt[3]{y}$) o exponente fraccionario.'
  - 'Paso 3: Si no hay letras bajo raíz, declarar la expresión como **Racional**.'
  - 'Paso 4: Subclasificar: Si no tiene letras en el denominador es **Racional Entera**; si tiene letras en el denominador es **Racional Fraccionaria**.'
errores_correccion: |
  - **Error 1:** Clasificar como irracional a una expresión como $\sqrt{3} \cdot x$ por tener una raíz. **Cómo corregirlo:** Si la raíz afecta **sólo a una constante numérica** (y no a la letra), la expresión **SÍ ES RACIONAL**.
  - **Error 2:** Declarar que las expresiones fraccionarias no son racionales. **Cómo corregirlo:** Las expresiones fraccionarias **SÍ SON RACIONALES** (son la subcategoría racional fraccionaria).
ejemplos:
  - titulo: 'Clasificación de expresión racional'
    enunciado: '¿Es la expresión $6x^3 - 4x + 9$ una expresión racional entera?'
    alternativas:
      - 'Sí, es racional entera porque no hay raíces ni denominadores en las variables'
      - 'No, es una expresión irracional'
      - 'No, es fraccionaria'
    respuesta: 'Sí, es racional entera porque no hay raíces ni denominadores en las variables'
    solucion_pasos:
      - '1. Variables sin raíces ni denominadores.'
      - '2. Es una expresión racional entera.'
  - titulo: 'Expresión racional fraccionaria'
    enunciado: '¿En qué categoría cae la expresión $\frac{x + 2}{x - 3}$?'
    alternativas:
      - 'Expresión Racional Fraccionaria'
      - 'Expresión Racional Entera'
      - 'Expresión Irracional'
    respuesta: 'Expresión Racional Fraccionaria'
    solucion_pasos:
      - '1. No tiene raíces en las variables y tiene $x$ en el denominador.'
      - '2. Es racional fraccionaria.'
  - titulo: 'Constante irracional en término racional'
    enunciado: 'En la expresión $\pi x^2$, ¿la presencia del número $\pi$ impide que la expresión sea racional?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, $\pi$ es un coeficiente escalar; la variable $x$ tiene exponente entero $2 \implies$ es racional.'
  - titulo: 'Suma de racionales'
    enunciado: '¿Es racional la suma de una expresión racional entera con una racional fraccionaria?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el conjunto de expresiones racionales es cerrado bajo la adición.'
errores_frecuentes:
  - 'Una expresión con un coeficiente constante irracional como la raíz de 5 se clasifica como una expresión irracional.'
  - 'Las expresiones algebraicas fraccionarias no pertenecen al conjunto de expresiones racionales.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Elevar una expresión racional al cuadrado la transforma automáticamente en irracional.'
  - 'Las expresiones racionales no admiten coeficientes numéricos negativos.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es racional si sus variables no se encuentran afectadas por raíces ni exponentes fraccionarios.'
  - 'Las expresiones racionales se dividen en racionales enteras (sin variables en el denominador) y racionales fraccionarias (con variables en el denominador).'
al_terminar_debes_poder: 'Identificar expresiones algebraicas racionales comprobando la ausencia de raíces en sus variables y subclasificándolas en enteras o fraccionarias.'
