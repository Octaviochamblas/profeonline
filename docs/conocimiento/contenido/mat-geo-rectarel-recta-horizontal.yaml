semantic_id: MAT.GEO.RECTA_RELACIONES.RECTA_HORIZONTAL
resumen_inicial: 'Identificación de rectas horizontales a partir de su pendiente:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Cuando la pendiente de una recta es 0, significa que y no cambia
  sin importar el valor de x, lo que geométricamente corresponde a una línea horizontal.
explicacion_formal: '![Recta horizontal](/static/img/geometria/analitica/rectarel-recta-horizontal.svg)


  ### Definición formal


  Si $m=0$, la ecuación $y=mx+b$ se reduce a $y=b$, una constante independiente de
  $x$: la recta horizontal.


  ### Desarrollo didáctico


  La recta $y=3$ es horizontal: para cualquier valor de $x$ (positivo, negativo o
  cero), el valor de $y$ siempre es 3.'
