semantic_id: MAT.GEO.TRIANGULOS_NOTABLES_METRICA.RELACION_LADOS_30_60_90
resumen_inicial: 'Relación de lados en el triángulo 30°-60°-90°: cateto opuesto 30°=
  ½ hipotenusa, cateto opuesto 60°= hipotenusa·√3/2: conceptos, teoremas, propiedades
  geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Al igual que el 45-45-90, el triángulo 30-60-90 tiene una proporción
  fija entre sus lados, pero en este caso los tres lados son distintos entre sí.
explicacion_formal: '![Relación de lados en el triángulo 30°-60°-90°](/static/img/geometria/areas-pitagoras/notables-relacion-lados-30-60-90.svg)


  ### Definición formal


  Si la hipotenusa mide $h$, el cateto menor (opuesto a 30°) mide $\frac{h}{2}$, y
  el cateto mayor (opuesto a 60°) mide $\frac{h}{2}\times\sqrt3=\frac{h\sqrt3}{2}$;
  esta relación se verifica con Pitágoras: $\left(\frac{h}{2}\right)^2+\left(\frac{h\sqrt3}{2}\right)^2=\frac{h^2}{4}+\frac{3h^2}{4}=h^2$.


  ### Desarrollo didáctico


  Un triángulo 30-60-90 con hipotenusa 10 cm tiene cateto menor $\frac{10}{2}=5$ cm
  (opuesto a 30°) y cateto mayor $\frac{10\sqrt3}{2}=5\sqrt3\approx8,66$ cm (opuesto
  a 60°).'
