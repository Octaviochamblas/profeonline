resumen_inicial: La multiplicación de monomios con coeficientes fraccionarios aplica
  rigurosamente las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con multiplicación de monomios con coeficientes fraccionarios,
  multiplicamos los coeficientes numéricos, aplicamos la regla de signos y sumamos
  los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Multiplicación de monomios
  con coeficientes fraccionarios** viene dada por:


  $$\text{"el producto (2/3 x^2) · (9/4 x^3)"} \implies (3/2)x^5$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Multiplicación de monomios con coeficientes fraccionarios**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule multiplicación de monomios con coeficientes fraccionarios para:
    ''el producto (2/3 x^2) · (9/4 x^3)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es (3/2)x^5.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar multiplicación de monomios con coeficientes
    fraccionarios a 'el producto (2/3 x^2) · (9/4 x^3)'?
  choices:
  - text: (3/2)x^5
    is_correct: true
  - text: (11/7)x^5
    is_correct: false
  - text: (18/12)x^6
    is_correct: false
  - text: (3/2)x^6
    is_correct: false
  explanation: La alternativa correcta es '(3/2)x^5'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto (2/3 x^2) · (9/4 x^3)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: (3/2)x^5
    is_correct: true
  - text: (11/7)x^5
    is_correct: false
  - text: (18/12)x^6
    is_correct: false
  - text: (3/2)x^6
    is_correct: false
  explanation: La alternativa correcta es '(3/2)x^5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante multiplicación de monomios con coeficientes fraccionarios.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de multiplicación de monomios con coeficientes
    fraccionarios en 'el producto (2/3 x^2) · (9/4 x^3)'?
  alternativas:
  - (3/2)x^5
  - (11/7)x^5
  - (18/12)x^6
  - (3/2)x^6
  respuesta: (3/2)x^5
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener (3/2)x^5.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto (2/3 x^2) · (9/4 x^3)' por multiplicación de
    monomios con coeficientes fraccionarios, ¿qué expresión resulta?
  alternativas:
  - (3/2)x^5
  - (11/7)x^5
  - (18/12)x^6
  - (3/2)x^6
  respuesta: (3/2)x^5
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir (3/2)x^5.
- titulo: ¿Es la multiplicación en 'el producto (2/3 x^2) · (9/4 x^3)' equivalente
    a (3/2)x^5?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene (3/2)x^5.
- titulo: ¿Da el producto de 'el producto (2/3 x^2) · (9/4 x^3)' un resultado igual
    a (11/7)x^5?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es (3/2)x^5.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar multiplicación de monomios
  con coeficientes fraccionarios.
- Omitir distribuir el monomio o término sobre todos los sumandos en multiplicación
  de monomios con coeficientes fraccionarios.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La multiplicación de monomios con coeficientes fraccionarios requiere sumar los
  exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la multiplicación de
  monomios con coeficientes fraccionarios aplicando distributividad, ley de signos
  y suma de exponentes.
