procedimiento:
- 'Paso 1: Multiplica las fracciones de los coeficientes (numerador × numerador y
  denominador × denominador).'
- 'Paso 2: Simplifica la fracción resultante a su mínima expresión.'
- 'Paso 3: Para las variables de igual base, suma sus exponentes.'
- 'Paso 4: Escribe el resultado combinando la fracción simplificada y las variables
  resultantes.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación de monomios con coeficientes fraccionarios.
ejemplos:
- titulo: Fracciones combinadas
  enunciado: 'Multiplica: (1/2 a)(2/5 b).'
  solucion_pasos:
  - 'Coeficientes: 1/2 × 2/5 = 2/10 = 1/5.'
  - 'Letras: a × b = ab.'
  - 'Resultado: 1/5 ab.'
- titulo: Un laboratorio químico mezcla dos disoluciones. La concentración total está
    dada por el prod
  enunciado: 'Un laboratorio químico mezcla dos disoluciones. La concentración total
    está dada por el producto de $(\frac{1}{4}c)$ y $(\frac{2}{5}d^2)$. ¿Cuál es la
    concentración resultante simplificada? (v1)


    Opciones: A) $\frac{1}{10}cd^2$ · B) $\frac{2}{20}cd^2$ · C) $\frac{3}{9}cd^2$
    · D) $\frac{1}{20}cd^2$'
  solucion_pasos:
  - 'Producto: $(\frac{1}{4}c)(\frac{2}{5}d^2) = (\frac{1}{4} \cdot \frac{2}{5})(cd^2)
    = \frac{2}{20}cd^2 = \frac{1}{10}cd^2$.'
  - 'Respuesta: $\frac{1}{10}cd^2$'
- titulo: 'Respecto de «Multiplicación de monomios con coeficientes fraccionarios»:
    ¿Describe adecuadam'
  enunciado: 'Respecto de «Multiplicación de monomios con coeficientes fraccionarios»:
    ¿Describe adecuadamente el concepto esta frase? «Al multiplicar monomios con **Coeficientes
    Fraccionarios**, se multiplican los numeradores entre sí y los denominadores entre
    sí para obtener el nuevo coeficiente, simplificando la fracción al final»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al multiplicar monomios con
    **Coeficientes Fraccionarios**, se multiplican los numeradores entre sí y los
    denominadores entre sí para obtener el nuevo coeficiente, simplificando la fracción
    al final.'
- titulo: 'Respecto de «Multiplicación de monomios con coeficientes fraccionarios»:
    ¿Se puede aceptar e'
  enunciado: 'Respecto de «Multiplicación de monomios con coeficientes fraccionarios»:
    ¿Se puede aceptar esta afirmación? «Sumar las fracciones en lugar de multiplicarlas»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al multiplicar monomios con
