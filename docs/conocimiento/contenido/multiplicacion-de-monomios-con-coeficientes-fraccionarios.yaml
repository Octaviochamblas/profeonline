semantic_id: MAT.ALG.MULT_MONOMIOS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Multiplicación de monomios con coeficientes fraccionarios: leyes,
  procedimiento y aplicación en Multiplicación de monomios.'
explicacion_simple: 'Los coeficientes fraccionarios en los monomios no cambian las
  reglas algebraicas. La multiplicación de fracciones se realiza directamente: numerador
  por numerador, y denominador por denominador. Las variables se operan como siempre.'
explicacion_formal: "### Definición formal\n\nMultiplicamos: $\\frac{3}{4} \\times\
  \ \\frac{2}{3} = \\frac{6}{12}$. Al simplificar por 6, queda $\\frac{1}{2}$.\n\n\
  ### Desarrollo didáctico\n\nMultiplica: $(\\frac{2}{3}x^2y)(\\frac{3}{4}xy^2)$.\n\
  \n1. Multiplicamos coeficientes:\n   $\\frac{2}{3} \\times \\frac{3}{4} = \\frac{2\
  \ \\cdot 3}{3 \\cdot 4} = \\frac{6}{12} = \\frac{1}{2}$.\n2. Parte literal:\n  \
  \ $x^2 \\cdot x = x^3$.\n   $y \\cdot y^2 = y^3$.\n3. Resultado final: $\\frac{1}{2}x^3y^3$."
definiciones_clave: '- **Multiplicación de monomios con coeficientes fraccionarios**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación de monomios con coeficientes fraccionarios.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de multiplicación de monomios
    con coeficientes fraccionarios.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de multiplicación de monomios con coeficientes
    fraccionarios.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
