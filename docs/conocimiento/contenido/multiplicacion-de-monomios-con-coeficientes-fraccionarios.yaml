semantic_id: MAT.ALG.MULT_MONOMIOS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: La multiplicación de monomios con coeficientes fraccionarios consiste en multiplicar numerador con numerador y denominador con denominador simplificando la fracción y sumando exponentes.
explicacion_simple: "Cuando los monomios tienen **coeficientes fraccionarios** (ej: $\\left(\\frac{2}{3}x^2\\right) \\cdot \\left(\\frac{3}{5}x^4\\right)$):\n- **Procedimiento**:\n  1. **Multiplica las fracciones**: Numerador por numerador y denominador por denominador.\n     - $\\frac{2}{3} \\cdot \\frac{3}{5} = \\frac{2 \\cdot 3}{3 \\cdot 5} = \\frac{6}{15}$.\n  2. **Simplifica la fracción** si se puede dividir por un mismo número:\n     - $\\frac{6}{15} = \\mathbf{\\frac{2}{5}}$ (dividiendo por 3 arriba y abajo).\n  3. **Suma los exponentes** de las variables comunes:\n     - $x^2 \\cdot x^4 = x^{2+4} = \\mathbf{x^6}$.\n  4. **Resultado unificado**: **$\\frac{2}{5}x^6$**.\n- **Truco de simplificación cruzada**: Si ves números iguales en el numerador y denominador antes de multiplicar, ¡puedes simplificarlos directamente!\n\n![Multiplicación con Coeficientes Fraccionarios](/static/img/nodos/multiplicacion-de-monomios-con-coeficientes-fraccionarios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $M_1 = \frac{a_1}{b_1} \prod x_i^{\alpha_i}$ y $M_2 = \frac{a_2}{b_2} \prod x_i^{\beta_i}$ dos monomios en $\mathbb{Q}[x_1, \dots, x_n]$ con $a_1, a_2, b_1, b_2 \in \mathbb{Z}$ y $b_1, b_2 \neq 0$. El **producto monómico racional** se define como:


  $$M_1 \cdot M_2 = \left( \frac{a_1 \cdot a_2}{b_1 \cdot b_2} \right) \prod x_i^{\alpha_i + \beta_i}$$


  ### Simplificación Racional Canónica via MCD

  Para garantizar la representación canónica en $\mathbb{Q}[x_1, \dots, x_n]$, el coeficiente numérico $\frac{N}{D} = \frac{a_1 a_2}{b_1 b_2}$ se simplifica dividiendo entre $g = \gcd(N, D)$:


  $$\frac{N/g}{D/g} \cdot \prod x_i^{\alpha_i + \beta_i}$$


  ### Síntesis didáctica

  La simplificación cruzada de numeradores y denominadores simplifica los números antes de elevar o sumar exponentes literales.

  '
definiciones_clave: '- **Producto monómico racional**: Multiplicación de monomios donde los coeficientes son números racionales de la forma $\frac{a}{b}$.

  - **Multiplicación directa de fracciones**: Operación $\frac{a}{b} \cdot \frac{c}{d} = \frac{ac}{bd}$.

  - **Simplificación cruzada previa**: Cancelación del máximo común divisor entre cualquier numerador y cualquier denominador de los factores antes de multiplicar.

  '
propiedades_relaciones: '- **Absorción del denominador 1**: Si el producto de denominadores es 1, el coeficiente se convierte en un número entero.

  - **Independencia operacional de exponentes**: La fracción del coeficiente no afecta en absoluto a las reglas de adición de exponentes.

  '
ejemplo_guiado:
  enunciado: Calcula el producto de los monomios $M_1 = -\frac{4}{9}x^3 y$ y $M_2 = \frac{3}{8}x^2 y^4$.
  pasos:
  - 'Paso 1: Determinamos el signo del producto: Un negativo (impar) $\implies$ Signo **negativo ($-$)**.'
  - 'Paso 2: Planteamos la multiplicación de coeficientes: $\frac{4}{9} \cdot \frac{3}{8}$.'
  - 'Paso 3: Aplicamos simplificación cruzada: - Cancelamos el $4$ arriba con el $8$ abajo (dividiendo por 4): $4 \to 1$ y $8 \to 2$. - Cancelamos el $3$ arriba con el $9$ abajo (dividiendo por 3): $3 \to 1$ y $9 \to 3$. - Multiplicamos los términos simplificados: $\frac{1 \cdot 1}{3 \cdot 2} = \mathbf{\frac{1}{6}}$.'
  - 'Paso 4: Sumamos los exponentes de $x$: $x^3 \cdot x^2 = x^{3+2} = \mathbf{x^5}$.'
  - 'Paso 5: Sumamos los exponentes de $y$: $y^1 \cdot y^4 = y^{1+4} = \mathbf{y^5}$.'
  - 'Conclusión: El monomio producto es **$-\frac{1}{6}x^5 y^5$**.'
  imagen: /static/img/nodos/multiplicacion-de-monomios-con-coeficientes-fraccionarios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se efectúa la multiplicación de los coeficientes numéricos al multiplicar dos monomios con fracciones $\frac{a}{b}$ y $\frac{c}{d}$?
  choices:
  - text: Multiplicando numerador por numerador y denominador por denominador ($\frac{a \cdot c}{b \cdot d}$) y simplificando
    is_correct: true
  - text: Multiplicando en cruz ($a \cdot d$ y $b \cdot c$)
    is_correct: false
  - text: Sumando numeradores y manteniendo un solo denominador
    is_correct: false
  - text: Buscando el MCM de los denominadores
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando numerador por numerador y denominador por denominador ($\frac{a \cdot c}{b \cdot d}$) y simplificando'. Producto de fracciones.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $\left(\frac{1}{2}x^3\right) \cdot \left(\frac{4}{5}x^2\right)$?
  choices:
  - text: El resultado es $\frac{2}{5}x^5$, al multiplicar $\frac{1 \cdot 4}{2 \cdot 5} = \frac{4}{10} = \frac{2}{5}$ y sumar $3 + 2 = 5$
    is_correct: true
  - text: El resultado es $\frac{4}{7}x^5$
    is_correct: false
  - text: El resultado es $\frac{2}{5}x^6$
    is_correct: false
  - text: El resultado es $\frac{5}{10}x^5$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $\frac{2}{5}x^5$, al multiplicar $\frac{1 \cdot 4}{2 \cdot 5} = \frac{4}{10} = \frac{2}{5}$ y sumar $3 + 2 = 5$'. Fracción $\frac{4}{10}=\frac{2}{5}$, exponente $3+2=5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los numeradores entre sí y los denominadores entre sí para obtener la nueva fracción coeficiente.'
- 'Paso 2: Simplificar la fracción coeficiente dividiendo por su Máximo Común Divisor (MCD).'
- 'Paso 3: Identificar las variables comunes y sumar sus exponentes respectivos.'
- 'Paso 4: Escribir el monomio resultante con su coeficiente fraccionario irreductible.'
errores_correccion: '- **Error 1:** Multiplicar en cruz los coeficientes fraccionarios como en una división (escribir $\frac{1}{2} \cdot \frac{3}{4} = \frac{4}{6}$). **Cómo corregirlo:** La multiplicación de fracciones **ES DIRECTA (numerador con numerador, denominador con denominador: $\frac{1 \cdot 3}{2 \cdot 4} = \frac{3}{8}$)**.

  - **Error 2:** Buscar MCM de los denominadores al multiplicar coeficientes fraccionarios. **Cómo corregirlo:** El MCM **ES PARA SUMA Y RESTA**; en multiplicación se multiplica directamente $\frac{ac}{bd}$.

  '
ejemplos:
- titulo: Multiplicación directa simple
  enunciado: ¿Cuál es el producto de $\left(\frac{1}{3}a\right) \cdot \left(\frac{2}{5}a^2\right)$?
  alternativas:
  - $\frac{2}{15}a^3$
  - $\frac{3}{8}a^3$
  - $\frac{2}{15}a^2$
  respuesta: $\frac{2}{15}a^3$
  solucion_pasos:
  - '1. Numeradores: $1 \cdot 2 = 2$.'
  - '2. Denominadores: $3 \cdot 5 = 15$.'
  - '3. Exponentes: $1 + 2 = 3 \implies \frac{2}{15}a^3$.'
- titulo: Simplificación total a entero
  enunciado: ¿Cuál es el producto de $\left(\frac{3}{4}x^2\right) \cdot \left(\frac{4}{3}x\right)$?
  alternativas:
  - $x^3$
  - $\frac{12}{12}x^2$
  - $\frac{7}{7}x^3$
  respuesta: $x^3$
  solucion_pasos:
  - 1. $\frac{3 \cdot 4}{4 \cdot 3} = \frac{12}{12} = 1$.
  - '2. Exponentes: $2 + 1 = 3 \implies 1x^3 = x^3$.'
- titulo: Entero por fracción
  enunciado: Para $6x \cdot \left(\frac{1}{3}x^2\right)$, ¿es el resultado $2x^3$ ya que $\frac{6}{1} \cdot \frac{1}{3} = 2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{6}{3} = 2 \implies 2x^3$.
- titulo: Conservación de ley de potencias
  enunciado: ¿Se mantienen las reglas de adición de exponentes exactamente iguales cuando los coeficientes son racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, la naturaleza del coeficiente no altera las leyes de exponentes.
errores_frecuentes:
- Multiplicar los coeficientes fraccionarios en cruz por asociar la regla con la división de fracciones.
- Buscar el mínimo común múltiplo (MCM) entre denominadores al multiplicar coeficientes fraccionarios.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- La fracción resultante no es simplificada a su forma irreductible.
- Multiplicar los exponentes de las variables por los denominadores de las fracciones.
afirmaciones_verdaderas:
- La multiplicación de coeficientes fraccionarios en monomios se realiza multiplicando numeradores con numeradores y denominadores con denominadores.
- Los exponentes de la parte literal se suman de forma independiente al cálculo numérico fraccionario.
al_terminar_debes_poder: '![Resumen de monomios fraccionarios](/static/img/nodos/multiplicacion-de-monomios-con-coeficientes-fraccionarios-resumen.svg)


  QUÉ: Multiplicar monomios cuyos coeficientes escalares son fracciones racionales.


  CÓMO: Multiplicar numeradores entre sí y denominadores entre sí $\frac{a \cdot c}{b \cdot d}$, simplificar factores comunes y aplicar producto de potencias de igual base.'
