procedimiento:
- 'Paso 1: Recuerda que en cualquier triángulo rectángulo, la hipotenusa es siempre
  el lado de mayor longitud.'
- 'Paso 2: Reconoce que el cateto adyacente a un ángulo agudo es siempre menor que
  esa hipotenusa.'
- 'Paso 3: Concluye que la razón (cateto adyacente)/(hipotenusa) siempre está entre
  0 y 1 para ángulos agudos verdaderos.'
