semantic_id: MAT.GEO.TRIG_FUNDAMENTAL.COSENO_RANGO_AGUDO
resumen_inicial: 'Restricción del valor del coseno de un ángulo agudo entre 0 y 1:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo
  Rectángulo.'
explicacion_simple: El coseno de un ángulo agudo, al igual que el seno, nunca puede
  ser cero ni uno, y mucho menos negativo o mayor que uno.
explicacion_formal: '![Rango del coseno de un ángulo agudo](/static/img/geometria/trigonometria/trig-coseno-rango-agudo.svg)


  ### Definición formal


  Como el cateto adyacente a un ángulo agudo siempre es menor que la hipotenusa (el
  lado más largo del triángulo rectángulo), la razón $\cos\theta=\dfrac{\text{cateto
  adyacente}}{\text{hipotenusa}}$ siempre resulta en un valor entre 0 y 1, sin alcanzar
  ninguno de esos extremos.


  ### Desarrollo didáctico


  En la figura, el cateto adyacente ($AB$) es siempre menor que la hipotenusa ($BC$).
  Por lo tanto, $\cos\theta=\dfrac{AB}{BC}$ siempre da un valor menor que 1 y mayor
  que 0.'
