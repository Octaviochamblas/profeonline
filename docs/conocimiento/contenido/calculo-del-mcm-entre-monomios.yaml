semantic_id: MAT.ALG.MCM_ALGEBRAICO.MCM_MONOMIOS
resumen_inicial: El m.c.m. completo entre monomios se obtiene multiplicando el m.c.m.
  de sus coeficientes numéricos por el m.c.m. de sus partes literales.
explicacion_simple: 'Para calcular el Mínimo Común Múltiplo entre dos o más monomios
  completos, unimos la parte numérica y la parte literal:

  1. Obtenemos el m.c.m. numérico entre los coeficientes (menor múltiplo entero común
  positivo).

  2. Obtenemos el m.c.m. literal (todas las variables presentes elevadas a su mayor
  exponente).

  3. Multiplicamos el coeficiente numérico resultante por la parte literal m.c.m.'
explicacion_formal: 'Dado un conjunto de monomios $\{M_1, M_2, \dots, M_k\}$ donde
  $M_i = c_i \cdot \prod_j x_j^{e_{i,j}}$, el **m.c.m. de monomios** es la expresión
  monomia $M$ dada por:


  $$M = \operatorname{lcm}(|c_1|, |c_2|, \dots, |c_k|) \cdot \prod_{x_j \text{ en
  algún monomio}} x_j^{\max_i(e_{i,j})}$$


  **Desglose de la fórmula:**

  - $\operatorname{lcm}(|c_1|, \dots, |c_k|)$: Representa el m.c.m. de los coeficientes
  numéricos.

  - $\prod_{x_j} x_j^{\max_i(e_{i,j})}$: Representa el m.c.m. literal formado por
  todas las variables presentes a su mayor exponente.'
definiciones_clave: '- **m.c.m. de monomios**: Monomio de menor grado y coeficiente
  positivo que es divisible por cada uno de los monomios originales.

  - **Múltiplo común monomio**: Expresión monomia divisible entre varios monomios
  de forma simultánea.'
propiedades_relaciones: '- **Divisibilidad de monomios**: Al dividir el m.c.m. por
  cualquiera de los monomios originales se obtiene otro monomio con exponentes enteros
  no negativos.

  - **Mínimo Común Denominador**: El m.c.m. de monomios constituye el mínimo común
  denominador al sumar o restar fracciones algebraicas con denominadores monomios.'
ejemplo_guiado:
  enunciado: Calcula el m.c.m. completo entre los monomios $12x^3y^2$ y $18xy^4z$
    ($36x^3y^4z$) y evalúa su valor numérico para $x = 2$, $y = 1$ y $z = 3$.
  pasos:
  - 'Paso 1: m.c.m. numérico de $12$ y $18$: $12 = 2^2 \cdot 3$, $18 = 2 \cdot 3^2
    \implies \operatorname{lcm}(12, 18) = 2^2 \cdot 3^2 = 36$.Paso 2: m.c.m. literal:
    variables $x, y, z$. Mayores exponentes: $x^3$, $y^4$ y $z^1$. La parte literal
    es $x^3y^4z$.'
  - 'Paso 3: Unir coeficiente y parte literal: $m.c.m. = 36x^3y^4z$.'
  - 'Paso 4: Sustituir $x = 2$, $y = 1$ y $z = 3$: $36 \cdot (2)^3 \cdot (1)^4 \cdot
    (3) = 36 \cdot 8 \cdot 1 \cdot 3 = 864$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el m.c.m. entre los monomios $12x^3y^2$ y $18xy^4z$?
  choices:
  - text: $36x^3y^4z$
    is_correct: true
  - text: $6x^2y^2$
    is_correct: false
  - text: $36x^3y^4$
    is_correct: false
  - text: $72x^4y^6z$
    is_correct: false
  explanation: La alternativa correcta es '$36x^3y^4z$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el m.c.m. $36x^3y^4z$ para $x = 2$, $y = 1$ y $z = 3$, ¿cuál
    es el resultado numérico?
  choices:
  - text: $864$
    is_correct: true
  - text: $432$
    is_correct: false
  - text: $288$
    is_correct: false
  - text: $1728$
    is_correct: false
  explanation: La alternativa correcta es '$864$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar el Mínimo Común Múltiplo de los coeficientes numéricos.'
- 'Paso 2: Reunir todas las variables distintas que aparezcan en los monomios.'
- 'Paso 3: Elevar cada variable a su mayor exponente registrado.'
- 'Paso 4: Multiplicar el m.c.m. numérico por el producto de las variables a su mayor
  exponente.'
errores_correccion: '- **Error común:** Confundir el m.c.m. completo con el M.C.D.
  completo, mezclando menores y mayores exponentes.

  - **Cómo corregirlo:** Recuerda: M.C.D. = Factores comunes al MENOR exponente. m.c.m.
  = Todos los factores al MAYOR exponente.'
ejemplos:
- titulo: 'Ejemplo 1: m.c.m. entre tres monomios'
  enunciado: Calcula el m.c.m. entre $4a^2b$, $6ab^3$ y $10a^3c$.
  alternativas:
  - $60a^3b^3c$
  - $2a$
  - $120a^3b^3c$
  respuesta: $60a^3b^3c$
  solucion_pasos:
  - '1. Coeficientes: $\operatorname{lcm}(4, 6, 10) = 60$.'
  - '2. Variables: $a$ (mayor exponente $3$), $b$ (mayor exponente $3$), $c$ (mayor
    exponente $1$).'
  - '3. m.c.m. completo: $60a^3b^3c$.'
- titulo: 'Ejemplo 2: Monomios con coeficientes negativos'
  enunciado: Determina el m.c.m. entre $-5x^3y$ y $15x^2z^2$.
  alternativas:
  - $15x^3yz^2$
  - $-15x^3yz^2$
  - $5x^2$
  respuesta: $15x^3yz^2$
  solucion_pasos:
  - '1. Coeficientes: $\operatorname{lcm}(|-5|, 15) = 15$.'
  - '2. Variables: $x$ (mayor exp $3$), $y$ (mayor exp $1$), $z$ (mayor exp $2$).'
  - '3. m.c.m. completo: $15x^3yz^2$.'
- titulo: ¿El m.c.m. entre $3x^2$ y $4y^3$ es $12x^2y^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Coeficientes m.c.m.(3,4)=12 y variables al mayor exponente $x^2y^3$.
- titulo: ¿El m.c.m. de dos monomios es siempre divisible por cada uno de los monomios
    originales?
  respuesta: Sí
  solucion_pasos:
  - Sí. Por definición de múltiplo común, la división resulta en un monomio entero.
errores_frecuentes:
- El m.c.m. entre $10x^2y$ y $15xy^3$ es $5xy$.
- El m.c.m. entre $8a^3$ y $12b^2$ omite la variable $b^2$ por no estar en el primer
  monomio.
- Para calcular el m.c.m. entre monomios se deben sumar sus coeficientes numéricos.
- El m.c.m. entre $-4x^2$ y $6x$ es $-24x^3$.
- El m.c.m. entre $x^3$ y $x^2$ es $x^6$.
afirmaciones_verdaderas:
- El m.c.m. entre monomios resulta de multiplicar el m.c.m. de sus coeficientes por
  todas las variables presentes a su mayor exponente.
- El m.c.m. de varios monomios contiene a cada uno de los monomios como factor divisor
  exacto.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular el m.c.m. completo
  de cualquier grupo de monomios unificando la parte numérica y la parte literal.
