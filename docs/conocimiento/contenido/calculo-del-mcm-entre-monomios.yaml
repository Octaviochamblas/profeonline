semantic_id: MAT.ALG.MCM_ALGEBRAICO.MCM_MONOMIOS
resumen_inicial: 'El cálculo del m.c.m. entre monomios consiste en multiplicar el m.c.m. de los coeficientes numéricos por el m.c.m. de las partes literales para integrar el monomio múltiplo común de menor grado.'
explicacion_simple: |
  Para calcular el **m.c.m. total** entre dos o más monomios completos (ej: $12x^3y^2$ y $18x^2y^4z$):
  - **FÓRMULA DE INTEGRACIÓN**:
    $$\mathbf{\text{m.c.m. Total} = (\text{m.c.m. numérico}) \cdot (\text{m.c.m. literal})}$$
  - **Integración en 3 Pasos**:
    1. **Calcula el m.c.m. numérico de los coeficientes ($12$ y $18$)**:
       - $\operatorname{mcm}(12, 18) = \mathbf{36}$.
    2. **Calcula el m.c.m. literal reuniendo TODAS las letras con el MAYOR exponente**:
       - Letra $x$: $\max(3, 2) \implies \mathbf{x^3}$.
       - Letra $y$: $\max(2, 4) \implies \mathbf{y^4}$.
       - Letra $z$: sólo en el segundo, ¡se incluye igual! $\implies \mathbf{z^1}$.
       - Parte literal: $\mathbf{x^3y^4z}$.
    3. **Multiplica ambos resultados**:
       - $\mathbf{\text{m.c.m. Total} = 36x^3y^4z}$.
explicacion_formal: |
  ### Definición formal
  Sean $M_1, M_2, \dots, M_k \in \mathbb{Z}[x_1, x_2, \dots, x_n]$ monomios no nulos dados por $M_i = c_i \prod_{j=1}^n x_j^{e_{i,j}}$. El **Mínimo Común Múltiplo monómico total** es la estructura algebraica:

  $$\operatorname{mcm}(M_1, M_2, \dots, M_k) = \operatorname{mcm}(|c_1|, |c_2|, \dots, |c_k|) \cdot \prod_{j=1}^n x_j^{\max_i(e_{i,j})}$$

  ### Garantía de Divisibilidad
  Para cada monomio $M_i$, la división $\frac{\operatorname{mcm}(M_1, \dots, M_k)}{M_i}$ resulta en un monomio exacto con coeficiente entero y exponentes enteros no negativos:

  $$\frac{\operatorname{mcm}(M_1, \dots, M_k)}{M_i} = \left(\frac{\operatorname{mcm}(|c_1|, \dots, |c_k|)}{|c_i|}\right) \cdot \prod_{j=1}^n x_j^{\max_m(e_{m,j}) - e_{i,j}} \in \mathbb{Z}[x_1, \dots, x_n]$$

  ### Síntesis didáctica
  Integrar el m.c.m. numérico de los coeficientes con todas las variables de mayor exponente genera el monomio múltiplo común de menor tamaño posible.
definiciones_clave: |
  - **m.c.m. entre monomios**: Monomio de menor coeficiente positivo y grado que es divisible exactamente por cada monomio del conjunto.
  - **Monomio múltiplo exacto**: Monomio cuyo cociente con cada uno de los monomios evaluados es un monomio entero sin fracciones.
  - **Integración monómica**: Ensamblaje del coeficiente del m.c.m. numérico con las variables del m.c.m. literal.
propiedades_relaciones: |
  - **Denominador común en suma de fracciones de monomios**: El m.c.m. entre monomios es el denominador común perfecto para sumar fracciones cuyos denominadores son monomios.
ejemplo_guiado:
  enunciado: 'Calcula el m.c.m. entre los tres monomios $M_1 = 15x^4y^2$, $M_2 = -20x^2y^5z$ y $M_3 = 24x^3z^4w$.'
  pasos:
    - 'Paso 1: Calculamos el m.c.m. numérico de los coeficientes en valor absoluto ($15, 20, 24$):
       - $15 = 3 \cdot 5$.
       - $20 = 2^2 \cdot 5$.
       - $24 = 2^3 \cdot 3$.
       - $\operatorname{mcm}(15, 20, 24) = 2^3 \cdot 3 \cdot 5 = 8 \cdot 3 \cdot 5 = \mathbf{120}$.'
    - 'Paso 2: Calculamos el m.c.m. literal reuniendo todas las letras con su **mayor exponente**:
       - $x$: exponentes $4, 2, 3 \implies \mathbf{x^4}$.
       - $y$: exponentes $2, 5 \implies \mathbf{y^5}$.
       - $z$: exponentes $1, 4 \implies \mathbf{z^4}$.
       - $w$: exponente $1 \implies \mathbf{w^1}$.
       - Parte literal: $\mathbf{x^4y^5z^4w}$.'
    - 'Paso 3: Unimos el m.c.m. numérico con el m.c.m. literal:
       $\text{m.c.m. Total} = 120 \cdot x^4y^5z^4w = \mathbf{120x^4y^5z^4w}$.'
    - 'Conclusión: El m.c.m. entre los tres monomios es **$120x^4y^5z^4w$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el m.c.m. entre los monomios $18a^3b^2$ y $12a^2b^5c$?'
    choices:
      - {text: 'El m.c.m. es $36a^3b^5c$, combinando $\operatorname{mcm}(18,12)=36$ y la parte literal con mayores exponentes $a^3b^5c$', is_correct: true}
      - {text: 'El m.c.m. es $6a^2b^2$', is_correct: false}
      - {text: 'El m.c.m. es $216a^5b^7c$', is_correct: false}
      - {text: 'El m.c.m. es $36a^2b^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''El m.c.m. es $36a^3b^5c$, combinando $\operatorname{mcm}(18,12)=36$ y la parte literal con mayores exponentes $a^3b^5c$''. $\operatorname{mcm}(18, 12) = 36$ y mayores exponentes $a^3b^5c$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si dividimos el m.c.m. total obtenido entre cualquiera de los monomios originales, ¿qué tipo de expresión debemos obtener siempre?'
    choices:
      - {text: 'Debemos obtener siempre un monomio entero con coeficientes enteros y exponentes no negativos', is_correct: true}
      - {text: 'Debemos obtener una fracción irreductible con variables en el denominador', is_correct: false}
      - {text: 'Debemos obtener siempre el número 0', is_correct: false}
      - {text: 'Debemos obtener un número negativo', is_correct: false}
    explanation: 'La alternativa correcta es ''Debemos obtener siempre un monomio entero con coeficientes enteros y exponentes no negativos''. Definición de divisibilidad de múltiplos comunes en $\mathbb{Z}[x_1, \dots, x_n]$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el m.c.m. numérico de los coeficientes tomando sus valores absolutos y extrayendo las mayores potencias de sus factores primos.'
  - 'Paso 2: Reunir todas las variables presentes en cualquier monomio e identificarlas con su mayor exponente.'
  - 'Paso 3: Multiplicar el coeficiente del m.c.m. numérico por el producto de variables del m.c.m. literal.'
  - 'Paso 4: Comprobar que el monomio m.c.m. sea divisible exactamente entre cada uno de los monomios de la lista.'
errores_correccion: |
  - **Error 1:** Calcular el M.C.D. numérico o literal en lugar del m.c.m. **Cómo corregirlo:** El m.c.m. **DEBE SER DIVISIBLE POR LOS MONOMIOS (por ende su coeficiente y exponentes son mayores o iguales a los originales)**.
  - **Error 2:** Asignar un signo negativo al m.c.m. total cuando algún monomio es negativo. **Cómo corregirlo:** El coeficiente del m.c.m. entre monomios **SE TOMA OBLIGATORIAMENTE COMO UN VALOR ENTERO POSITIVO**.
ejemplos:
  - titulo: 'm.c.m. completo'
    enunciado: 'Para $6x^2y$ y $8xy^3$, ¿es el m.c.m. igual a $24x^2y^3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{mcm}(6,8)=24$ y letras $x^2y^3$.'
  - titulo: 'Variable no común en m.c.m.'
    enunciado: 'Entre $5a^2b$ y $10a^3c$, ¿se incluye la letra $c$ dando $10a^3bc$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $c$ se incluye en el m.c.m.'
  - titulo: 'Comprobación por división'
    enunciado: 'Al dividir $24x^2y^3 \div 6x^2y$, ¿resulta el monomio entero $4y^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la división es exacta.'
  - titulo: 'Tres monomios'
    enunciado: 'Para $2x$, $3y$ y $4z$, ¿es el m.c.m. $12xyz$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{mcm}(2,3,4)=12$ y $xyz$.'
errores_frecuentes:
  - 'Calcular el M.C.D. de los coeficientes en lugar de calcular su m.c.m.'
  - 'Las variables no comunes no son incluidas en el monomio m.c.m. final.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Seleccionar los menores exponentes de las variables en lugar de los mayores exponentes.'
  - 'Asignar un coeficiente negativo al monomio m.c.m. resultante.'
afirmaciones_verdaderas:
  - 'El m.c.m. entre monomios se obtiene multiplicando el m.c.m. numérico de los coeficientes por el m.c.m. de las partes literales.'
  - 'El monomio m.c.m. resultante es exactamente divisible por cada uno de los monomios originales.'
al_terminar_debes_poder: 'Calcular el m.c.m. completo entre cualquier conjunto de monomios integrando coeficientes y variables.'
