procedimiento:
- 'Paso 1: Calcula el MCM aritmético de los coeficientes numéricos.'
- 'Paso 2: Extrae todas las letras diferentes que encuentres.'
- 'Paso 3: Colócale a cada letra el exponente mayor con el que aparezca en el grupo.'
- 'Paso 4: Multiplica la parte numérica y la parte literal.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cálculo del m.c.m. entre monomios.
ejemplos:
- titulo: Halla el MCM de $10x^3 y$, $15x y^2$ y $5y^3 z$
  enunciado: Halla el MCM de $10x^3 y$, $15x y^2$ y $5y^3 z$.
  solucion_pasos:
  - 'Números: MCM de 10, 15 y 5. El mayor múltiplo mínimo común es 30.'
  - 'Letras presentes: x, y, z.'
  - 'Exp. mayores: $x^3$, $y^3$, $z^1$.'
  - 'Resultado final: $30x^3 y^3 z$.'
- titulo: Calcula el MCM de $3p$ y $4q$.
  solucion_pasos:
  - 'MCM de 3 y 4 es 12. Letras p y q. Todo junto: 12pq.'
- titulo: 'Respecto de «Cálculo del m.c.m. entre monomios»: ¿La siguiente formulación
    es correcta? «El'
  enunciado: 'Respecto de «Cálculo del m.c.m. entre monomios»: ¿La siguiente formulación
    es correcta? «El MCM completo de dos o más monomios se obtiene multiplicando el
    MCM de sus coeficientes por las letras comunes y no comunes elevadas a su mayor
    exponente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El MCM completo de dos o más
    monomios se obtiene multiplicando el MCM de sus coeficientes por las letras comunes
    y no comunes elevadas a su mayor exponente.'
- titulo: 'Respecto de «Cálculo del m.c.m. entre monomios»: ¿La siguiente conclusión
    es correcta? «Inte'
  enunciado: 'Respecto de «Cálculo del m.c.m. entre monomios»: ¿La siguiente conclusión
    es correcta? «Intercambiar la regla numérica con la literal (sacar MCM de letras
    pero MCD de números)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El MCM completo de dos o más
    monomios se obtiene multiplicando el MCM de sus coeficientes por las letras comunes
    y no comunes elevadas a su mayor exponente.'
errores_frecuentes:
- Intercambiar la regla numérica con la literal (sacar MCM de letras pero MCD de números).
- Olvidar escribir una variable solitaria que estaba escondida en un rincón del último
  monomio.
- Para «Al dividir el MCM algebraico recién calculado entre cualquiera de los monomios
  originales, el resultado será:», la respuesta correcta es Siempre 0.
- Una fracción algebraica.
- Para «Al dividir el MCM algebraico recién calculado entre cualquiera de los monomios
  originales, el resultado será:», la respuesta correcta es El MCD.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando cálculo
  del m.c.m. entre monomios.
