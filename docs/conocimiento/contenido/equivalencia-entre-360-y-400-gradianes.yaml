semantic_id: MAT.GEO.MEDICION_ANGULAR.EQUIVALENCIA_CENTESIMAL
resumen_inicial: La relación universal entre los tres sistemas de medición angular
  establece que una vuelta completa equivale a 360° = 400g = 2π rad, lo que simplifica
  la conversión a la fórmula S/180 = C/200 = R/π.
explicacion_simple: '![Equivalencia entre Sistemas](/static/img/nodos/equivalencia-entre-360-y-400-gradianes-intro.svg)


  Una vuelta entera mide $360^\circ$ en grados, $400^\text{g}$ en gradianes y $2\pi\text{
  rad}$ en radianes. De ahí sale la regla rápida entre grados y gradianes: **cada
  9 grados equivalen exactamente a 10 gradianes** ($9^\circ = 10^\text{g}$).'
explicacion_formal: '### Teorema formal

  La relación proporcional entre los tres sistemas principales de medición angular
  (sexagesimal $S$, centesimal $C$ y radial $R$) satisface la **ecuación de equivalencia
  general**:


  $$\frac{S}{180} = \frac{C}{200} = \frac{R}{\pi} \iff \frac{S}{9} = \frac{C}{10}$$


  $$360^\circ = 400^{\text{g}} = 2\pi \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $S$: Medida en grados sexagesimales ($360^\circ$).

  - $C$: Medida en gradianes centesimales ($400^{\text{g}}$).

  - Razón de conversión rápida entre $S$ y $C$: $S = \frac{9}{10} C \iff C = \frac{10}{9}
  S$.


  ### Síntesis didáctica

  La relación $9^\circ = 10^{\text{g}}$ proporciona una regla de conversión mental
  exacta entre los grados sexagesimales y los gradianes topográficos.'
definiciones_clave: '- **Fórmula general**: $\frac{S}{180} = \frac{C}{200} = \frac{R}{\pi}$.

  - **Relación 9-10**: $9^\circ = 10^\text{g}$ (factor de conversión rápida entre
  sexagesimal y centesimal). '
propiedades_relaciones: '- **Tabla de ángulos notables en los 3 sistemas**: - Nulo:
  $0^\circ = 0^\text{g} = 0\text{ rad}$ - Recto: $90^\circ = 100^\text{g} = \frac{\pi}{2}\text{
  rad}$ - Llano: $180^\circ = 200^\text{g} = \pi\text{ rad}$ - Completo: $360^\circ
  = 400^\text{g} = 2\pi\text{ rad}$ '
ejemplo_guiado:
  enunciado: '![Ejemplo de Conversión Triple](/static/img/nodos/equivalencia-entre-360-y-400-gradianes-ejemplos.svg)


    Convierte un ángulo de $150^\text{g}$ centesimales a grados sexagesimales y a
    radianes.'
  pasos:
  - 'Paso 1: Aplicar la relación sexagesimal-centesimal: $S = \frac{9}{10}C$.'
  - 'Paso 2: Calcular en grados: $S = \frac{9}{10} \times 150 = 9 \times 15 = 135^\circ$.'
  - 'Paso 3: Aplicar la relación centesimal-radial: $R = \frac{C \cdot \pi}{200}$.'
  - 'Paso 4: Simplificar: $R = \frac{150\pi}{200} = \frac{3\pi}{4}\text{ rad}$.'
  - 'Paso 5: Concluir que $150^\text{g} = 135^\circ = \frac{3\pi}{4}\text{ rad}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A cuántos gradianes equivalen 9 grados sexagesimales?
  choices:
  - text: Exactamente 10 gradianes (porque S/9 = C/10)
    is_correct: true
  - text: Exactamente 9 gradianes
    is_correct: false
  - text: Exactamente 100 gradianes
    is_correct: false
  - text: Exactamente 20 gradianes
    is_correct: false
  explanation: Por la proporción simplificada S/9 = C/10, 9° equivalen a exactamente
    10 gradianes (porque S/9 = C/10).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos grados sexagesimales equivale un ángulo de 200 gradianes?
  choices:
  - text: 180° (por ser ambos el ángulo llano de media vuelta)
    is_correct: true
  - text: 200°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 360°
    is_correct: false
  explanation: 200 gradianes representan media vuelta, equivalente a 180° (por ser
    ambos el ángulo llano de media vuelta).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las unidades de origen y destino.'
- 'Paso 2: Utilizar la igualdad correspondiente de la fórmula universal $\frac{S}{180}
  = \frac{C}{200} = \frac{R}{\pi}$.'
- 'Paso 3: Despejar la incógnita y simplificar el resultado.'
errores_correccion: 'Recuerda que 9° = 10g: los gradianes siempre tienen un número
  ligeramente mayor que los grados.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A cuántos gradianes equivale un ángulo de $90^\circ$?
  alternativas:
  - $100^{\text{g}}$
  - $90^{\text{g}}$
  - $200^{\text{g}}$
  respuesta: $100^{\text{g}}$
  solucion_pasos:
  - $90 \times \frac{10}{9} = 100^{\text{g}}$.
- titulo: Ejemplo 2
  enunciado: ¿A cuántos grados sexagesimales equivalen $50^{\text{g}}$?
  alternativas:
  - $45^\circ$
  - $50^\circ$
  - $40^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $50 \times \frac{9}{10} = 45^\circ$.
- titulo: ¿La fórmula S/180 = C/200 = R/π relaciona los tres sistemas angulares?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la proporción universal de conversión angular.
- titulo: ¿Un ángulo de 360° equivale a 200 gradianes?
  respuesta: 'No'
  solucion_pasos:
  - No, equivale a $400^{\text{g}}$ ($200^{\text{g}}$ equivale a $180^\circ$).
errores_frecuentes:
- Invertir la relación (hacer $S = \frac{10}{9}C$ en lugar de $\frac{9}{10}C$).
- Confundir los denominadores de la fórmula general (usar 360, 400 y $2\pi$ sin simplificar
  adecuadamente).
- Olvidar que el número en gradianes siempre es mayor que en grados para el mismo
  ángulo físico.
- No simplificar las fracciones con $\pi$.
- Mezclar unidades intermedias.
afirmaciones_verdaderas:
- $\frac{S}{180^\circ} = \frac{C}{200^\text{g}} = \frac{R}{\pi\text{ rad}}$.
- $9^\circ$ sexagesimales equivalen a $10^\text{g}$ centesimales.
al_terminar_debes_poder: '**QUÉ:** Integrar y convertir medidas angulares entre los
  tres sistemas principales (Sexagesimal, Centesimal y Radial).


  **CÓMO:** Aplicando la proporción universal $\frac{S}{180} = \frac{C}{200} = \frac{R}{\pi}$
  y la regla simplificada $\frac{S}{9} = \frac{C}{10}$.


  ![Resumen de Equivalencia entre Sistemas](/static/img/nodos/equivalencia-entre-360-y-400-gradianes-resumen.svg)'
