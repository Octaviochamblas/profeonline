semantic_id: MAT.GEO.MEDICION_ANGULAR.EQUIVALENCIA_CENTESIMAL
resumen_inicial: 'Comprensión Didáctica y Aplicación Práctica de Equivalencia entre
  360° y 400 gradianes: Importancia de su Medida y Relaciones en Geometría Plana.'
explicacion_simple: Al trabajar con equivalencia entre 360° y 400 gradianes, analizamos
  la relación entre aberturas angulares y cómo se aplican las reglas geométricas para
  encontrar valores desconocidos.
explicacion_formal: En la teoría geométrica de equivalencia entre 360° y 400 gradianes,
  se aplican teoremas y relaciones algebraicas sobre rectas y vértices para estructurar
  demostraciones e igualdades angulares precisas.
definiciones_clave: '- **Equivalencia entre 360° y 400 gradianes**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en equivalencia entre 360° y 400 gradianes se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Convierte un ángulo de $45^\circ$ sexagesimales al sistema centesimal
    ($^g$) usando la equivalencia $\frac{\text{grados}}{180^\circ} = \frac{\text{gons}}{200^g}$.
  pasos:
  - 'Paso 1: Sustituir $45^\circ$ en la relación: $\frac{45}{180} = \frac{\text{gons}}{200}
    \implies \frac{1}{4} = \frac{\text{gons}}{200}$.'
  - 'Paso 2: Despejar los gons: $\text{gons} = \frac{200}{4} = 50^g$.'
  - 'Paso 3: Concluir que $45^\circ$ equivale a $50^g$ en el sistema centesimal.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de equivalencia entre 360° y
    400 gradianes?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos grados centesimales (gons) equivale un ángulo de 45°?
  choices:
  - text: 50g
    is_correct: true
  - text: 45g
    is_correct: false
  - text: 100g
    is_correct: false
  - text: 25g
    is_correct: false
  explanation: La alternativa correcta es '50g', ya que $45 / 180 = 50 / 200$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en equivalencia entre 360° y 400 gradianes.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en equivalencia entre
  360° y 400 gradianes sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 69^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 111°
  - 69°
  - 90°
  respuesta: 111°
  solucion_pasos:
  - Despejando $x = 180 - 69 = 111^\circ$.
- titulo: Ejemplo 2
  enunciado: En equivalencia entre 360° y 400 gradianes, si dos ángulos son suplementarios
    y uno mide 69°, ¿cuánto mide el otro?
  alternativas:
  - 111°
  - 21°
  - 360°
  respuesta: 111°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 69 = 111^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en equivalencia
    entre 360° y 400 gradianes?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en equivalencia entre 360° y 400
    gradianes es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de equivalencia entre 360° y 400 gradianes.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
