semantic_id: MAT.GEO.RECTA_RELACIONES.SISTEMA_SIN_SOLUCION
resumen_inicial: 'Interpretación de sistema sin solución como rectas paralelas distintas:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Cuando dos rectas mantienen exactamente la misma inclinación pero
  parten de alturas distintas, nunca llegan a encontrarse, y esto se refleja algebraicamente
  en la ausencia de solución del sistema.
explicacion_formal: '![Sistema sin solución](/static/img/geometria/analitica/rectarel-sistema-sin-solucion.svg)


  ### Definición formal


  Si $m_1=m_2$ pero $b_1\neq b_2$, al intentar igualar $m_1x+b_1=m_2x+b_2$ se obtiene
  $b_1=b_2$, una contradicción, indicando que el sistema no tiene solución.


  ### Desarrollo didáctico


  El sistema formado por $y=x+1$ e $y=x-2$ no tiene solución: al igualar, $x+1=x-2$,
  se obtiene $1=-2$, una contradicción, confirmando que las rectas (paralelas) nunca
  se cruzan.'
definiciones_clave: '- **Interpretación de sistema sin solución como rectas paralelas
