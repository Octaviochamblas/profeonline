semantic_id: MAT.ALG.TRIG_COORDENADAS.VALORES_CUADRANTALES_SENO
resumen_inicial: 'Determinación de los valores del seno en los ángulos cuadrantales $0^\circ, 90^\circ, 180^\circ, 270^\circ$ y $360^\circ$.'
explicacion_simple: |
  Para determinar el seno de los ángulos cuadrantales (los que caen justo sobre los ejes cartesiano), debemos observar la coordenada vertical $y$ de los puntos de intersección en el círculo unitario:
  - En $0^\circ$ (punto $(1,0)$): la altura es cero, por lo que el seno vale $0$.
  - En $90^\circ$ (punto $(0,1)$): la altura es máxima, el seno vale $1$.
  - En $180^\circ$ (punto $(-1,0)$): vuelve al eje horizontal, el seno vale $0$.
  - En $270^\circ$ (punto $(0,-1)$): alcanza la posición inferior máxima, el seno vale $-1$.
  - En $360^\circ$ (punto $(1,0)$): vuelve a valer $0$.
explicacion_formal: |
  ### Definición formal
  Los **valores del seno en ángulos cuadrantales** $\theta = k \cdot 90^\circ = k \cdot \frac{\pi}{2}$ ($k \in \mathbb{Z}$) se obtienen evaluando la ordenada $y$ en los puntos axiales del círculo unitario:
  $$\sin\left(k \cdot \frac{\pi}{2}\right) = \begin{cases} 0 & \text{si } k \equiv 0, 2 \pmod 4 \\ 1 & \text{si } k \equiv 1 \pmod 4 \\ -1 & \text{si } k \equiv 3 \pmod 4 \end{cases}$$

  ### Desglose simbólico
  - $\sin(0) = \sin(0^\circ) = 0$: Ordenada del punto $(1,0)$.
  - $\sin\left(\frac{\pi}{2}\right) = \sin(90^\circ) = 1$: Ordenada del punto $(0,1)$.
  - $\sin(\pi) = \sin(180^\circ) = 0$: Ordenada del punto $(-1,0)$.
  - $\sin\left(\frac{3\pi}{2}\right) = \sin(270^\circ) = -1$: Ordenada del punto $(0,-1)$.

  ### Síntesis didáctica
  El seno se anula ($0$) en los ejes horizontales (múltiplos enteros de $180^\circ$ o $\pi$) y alcanza sus valores extremos ($\pm 1$) en los ejes verticales (múltiplos impares de $90^\circ$ o $\frac{\pi}{2}$).
definiciones_clave: |
  - **Seno cuadrantal**: Valor de la coordenada $y$ para ángulos que se detienen sobre los ejes coordenados.
  - **Ceros del seno**: Ángulos de la forma $k \cdot 180^\circ$ ($k\pi$) donde la ordenada es nula.
  - **Extremos del seno**: Ángulos de la forma $90^\circ + k \cdot 180^\circ$ ($\frac{\pi}{2} + k\pi$) donde el seno alcanza $1$ o $-1$.
propiedades_relaciones: |
  - **Periodicidad de ceros**: El seno es cero cada $\pi$ radianes partiendo desde $0$ ($\dots, -\pi, 0, \pi, 2\pi, \dots$).
  - **Alternancia de extremos**: El seno alterna entre $1$ y $-1$ en los semiejes verticales: $\sin(90^\circ) = 1$ y $\sin(270^\circ) = -1$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto de $\sin(630^\circ)$ reduciéndolo a un ángulo cuadrantal básico del primer giro.'
  pasos:
    - 'Paso 1: Restar un giro completo para hallar el ángulo coterminal en $[0^\circ, 360^\circ[$: $630^\circ - 360^\circ = 270^\circ$.'
    - 'Paso 2: Identificar el punto de intersección del ángulo $270^\circ$ con el círculo unitario: $(0, -1)$.'
    - 'Paso 3: Extraer la ordenada cartesiana $y$: $y = -1$.'
    - 'Paso 4: Concluir que $\sin(630^\circ) = \sin(270^\circ) = -1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuáles de los siguientes ángulos cuadrantales el seno alcanza su valor máximo de $+1$?'
    choices:
      - {text: '$90^\circ$ ($\frac{\pi}{2}$ rad)', is_correct: true}
      - {text: '$180^\circ$ ($\pi$ rad)', is_correct: false}
      - {text: '$270^\circ$ ($\frac{3\pi}{2}$ rad)', is_correct: false}
      - {text: '$0^\circ$ ($0$ rad)', is_correct: false}
    explanation: 'La alternativa correcta es ''$90^\circ$ ($\frac{\pi}{2}$ rad)''. En el semieje $+Y$, el punto $(0,1)$ tiene ordenada $y = 1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor exacto de $\sin(180^\circ)$ o $\sin(\pi)$?'
    choices:
      - {text: '$0$', is_correct: true}
      - {text: '$1$', is_correct: false}
      - {text: '$-1$', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''$0$''. En el punto $(-1, 0)$ sobre el semieje $-X$, la ordenada es $y = 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si el ángulo es un cuadrantal de la forma $k \cdot 90^\circ$ ($k \cdot \frac{\pi}{2}$).'
  - 'Paso 2: Ubicar la intersección cartesiana sobre el círculo unitario: $(1,0)$, $(0,1)$, $(-1,0)$ o $(0,-1)$.'
  - 'Paso 3: Tomar la coordenada vertical $y$ de ese punto.'
  - 'Paso 4: Asignar el valor $0$, $1$ o $-1$ como el seno del ángulo.'
errores_correccion: |
  - **Error 1:** Confundir el valor del seno en $0^\circ$ asignándole $1$ en lugar de $0$. **Cómo corregirlo:** En $0^\circ$ el punto es $(1,0)$; la ordenada $y$ es cero, por lo que $\sin(0^\circ) = 0$.
  - **Error 2:** Creer que $\sin(270^\circ) = 1$. **Cómo corregirlo:** En $270^\circ$ el punto está en el semieje negativo $Y$ ($(0,-1)$), por lo que la ordenada es $y = -1$.
ejemplos:
  - titulo: 'Seno de noventa grados'
    enunciado: '¿Cuál es el valor de $\sin(90^\circ)$?'
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. El punto sobre el semieje $+Y$ es $(0,1)$.'
      - '2. La ordenada $y = 1 \implies \sin(90^\circ) = 1$.'
  - titulo: 'Seno de tres pi medios'
    enunciado: '¿Cuánto vale $\sin\left(\frac{3\pi}{2}\right)$?'
    alternativas:
      - '$-1$'
      - '$0$'
      - '$1$'
    respuesta: '$-1$'
    solucion_pasos:
      - '1. $\frac{3\pi}{2}$ equivale a $270^\circ$, punto $(0,-1)$.'
      - '2. La ordenada $y = -1 \implies \sin\left(\frac{3\pi}{2}\right) = -1$.'
  - titulo: 'Seno de dos pi'
    enunciado: '¿El seno del ángulo cuadrantal $2\pi$ ($360^\circ$) es igual a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2\pi$ es coterminal con $0^\circ$, punto $(1,0) \implies y = 0$.'
  - titulo: 'Seno de ángulo negativo cuadrantal'
    enunciado: '¿El valor de $\sin(-90^\circ)$ es igual a $-1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-90^\circ$ cae sobre el punto $(0,-1)$, donde la ordenada $y = -1$.'
errores_frecuentes:
  - 'La afirmación de que el seno del ángulo de $0^\circ$ es igual a $1$.'
  - 'La afirmación de que el seno de $270^\circ$ toma el valor positivo de $+1$.'
  - 'La afirmación de que en $180^\circ$ el seno vale $-1$.'
  - 'La afirmación de que el seno es una función indefinida en los ejes coordenados.'
  - 'La afirmación de que $\sin(90^\circ)$ y $\sin(270^\circ)$ tienen exactamente el mismo signo.'
afirmaciones_verdaderas:
  - 'El seno se anula ($\sin \theta = 0$) en los ángulos cuadrantales horizontales $0^\circ$ ($0$), $180^\circ$ ($\pi$) y $360^\circ$ ($2\pi$).'
  - 'El seno alcanza sus valores extremos de $1$ y $-1$ en los ángulos cuadrantales verticales $90^\circ$ ($\frac{\pi}{2}$) y $270^\circ$ ($\frac{3\pi}{2}$).'
al_terminar_debes_poder: |
  QUÉ: Evaluar e interpretar los valores exactos del seno en todos los ángulos cuadrantales.
  CÓMO: Extraer la ordenada $y$ del punto de intersección cartesiana $(1,0)$, $(0,1)$, $(-1,0)$ o $(0,-1)$.
