procedimiento:
- 'Paso 1: Identifica el punto cuadrantal asociado al ángulo dado.'
- 'Paso 2: Lee la coordenada $y$ de ese punto.'
- 'Paso 3: Esa coordenada es el valor del seno buscado.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en determinación de valores
  de seno en ángulos cuadrantales.
ejemplos:
- titulo: Cálculo directo de $\sin(90°)$
  enunciado: Determina $\sin(90°)$.
  solucion_pasos:
  - El punto asociado es $(0,1)$.
  - Se obtiene $\sin(90°)=1$.
- titulo: Cálculo directo de $\sin(270°)$
  enunciado: Determina $\sin(270°)$.
  solucion_pasos:
  - El punto asociado es $(0,-1)$.
  - Se obtiene $\sin(270°)=-1$.
- titulo: ¿$\sin(0°)=\sin(180°)$?
  enunciado: ¿$\sin(0°)$ tiene el mismo valor que $\sin(180°)$?
  respuesta: Sí
  solucion_pasos:
  - Ambos valen $0$, ya que ambos puntos están sobre el eje $x$.
- titulo: ¿El seno alcanza su valor máximo en $90°$?
  enunciado: ¿El seno alcanza su valor máximo posible ($1$) en el ángulo $90°$?
  respuesta: Sí
  solucion_pasos:
  - La coordenada $y$ del punto $(0,1)$ es el mayor valor posible dentro del círculo
    unitario.
errores_frecuentes:
- Declarar los valores del seno con los del coseno en los ángulos cuadrantales.
- Invertir el signo al recordar $\sin(270°)$, olvidando que es $-1$ y no $1$.
- Suponer que el seno nunca puede valer $0$.
- No relacionar el valor con la coordenada $y$ del punto correspondiente.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  determinación de valores de seno en ángulos cuadrantales.
