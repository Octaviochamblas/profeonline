semantic_id: MAT.ALG.TRIG_COORDENADAS.VALORES_CUADRANTALES_SENO
resumen_inicial: 'Determinación de valores de seno en ángulos cuadrantales: círculo
  unitario, amplitud, período y transformaciones de Seno y coseno en el círculo unitario.'
explicacion_simple: Del mismo modo que con el coseno, los ángulos cuadrantales permiten
  obtener valores exactos y simples del seno leyendo la coordenada correspondiente.
explicacion_formal: '### Definición formal


  Como $\sin(\theta)$ es la coordenada $y$ del punto asociado, y los puntos cuadrantales
  son $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$ para $0°$, $90°$, $180°$ y $270°$ respectivamente,
  se obtienen directamente los valores $0$, $1$, $0$ y $-1$.


  ### Desarrollo didáctico


  En $0°$ y $180°$, el punto está sobre el eje $x$, así que su coordenada $y$ es siempre
  $0$. En $90°$, la coordenada $y$ alcanza su máximo posible, $1$; en $270°$, alcanza
  su mínimo, $-1$.'
definiciones_clave: '- **Determinación de valores de seno en ángulos cuadrantales**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación de valores de seno en ángulos cuadrantales.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación de valores de seno en ángulos cuadrantales.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación de valores de seno en ángulos cuadrantales.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
