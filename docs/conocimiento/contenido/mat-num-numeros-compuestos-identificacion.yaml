semantic_id: MAT.NUM.NUMEROS_PRIMOS.COMPUESTO_IDENTIFICACION
resumen_inicial: 'Un entero $c > 1$ se identifica como compuesto si posee al menos
  tres divisores positivos: $|D(c)| \ge 3$.'
explicacion_simple: Para probar si un número es compuesto, basta con encontrar un
  solo divisor propio adicional además de 1 y de sí mismo. Al hallar cualquier tercer
  número que lo divida de forma exacta, queda inmediatamente demostrado que el número
  es compuesto.
explicacion_formal: 'Para un entero $n > 1$, la **Identificación de Compuesto** se
  satisface si existe al menos un entero $d$ tal que:


  $$1 < d < n \quad \land \quad d \mid n \implies |D(n)| \ge 3$$


  **Desglose de la fórmula:**

  - $1 < d < n$: Divisor propio o estricto del número $n$.

  - $d \mid n$: División exacta sin residuo en el algoritmo euclidiano.

  - $|D(n)| \ge 3$: Cardinalidad del conjunto de divisores suficiente para catalogar
  como compuesto.


  > **Complemento didáctico:** Si al probar la divisibilidad por los primos $p \le
  \sqrt{n}$ se encuentra al menos uno que divida a $n$, el número queda identificado
  inmediatamente como compuesto.'
definiciones_clave: '- **Divisor propio**: Todo divisor $d$ de $n$ que cumple la desigualdad
  $1 < d < n$.

  - **Identificación por divisor propio**: Criterio que prueba composicionalidad al
  hallar un tercer divisor.'
propiedades_relaciones: '- **Criterios de divisibilidad**: Herramientas rápidas para
  hallar divisores propios en números grandes.'
ejemplo_guiado:
  enunciado: Demuestre que el número $91$ es compuesto identificando al menos un divisor
    propio.
  pasos:
  - 'Paso 1: Probar criterios rápidos: 91 es impar (no div por 2), suma de dígitos
    $9+1=10$ (no div por 3), no termina en 0 o 5 (no div por 5).'
  - 'Paso 2: Probar divisibilidad por el primo 7: $91 : 7 = 13$ exacto.'
  - 'Paso 3: Identificar el divisor propio encontrado: $d = 7$ cumple $1 < 7 < 91$.'
  - 'Conclusión: Como se halló el divisor propio 7, $91$ es un número compuesto ($D(91)
    = \{1, 7, 13, 91\}$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué se necesita para demostrar que un número mayor que 1 es compuesto?
  choices:
  - text: Encontrar al menos un divisor propio d tal que 1 < d < n
    is_correct: true
  - text: Demostrar que es divisible por todos los números del 1 al 10
    is_correct: false
  - text: Demostrar que es un número par
    is_correct: false
  - text: Contar exactamente 2 divisores
    is_correct: false
  explanation: La alternativa correcta es 'Encontrar al menos un divisor propio d
    tal que 1 < d < n'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con 91, ¿cuál fue el divisor propio que demostró
    que es compuesto?
  choices:
  - text: 7 (o 13)
    is_correct: true
  - text: '2'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '7 (o 13)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar criterios de divisibilidad o pruebas de división por primos $p
  \le \sqrt{n}$.'
- 'Paso 2: Si se encuentra al menos un divisor exacto $d$ con $1 < d < n$, detener
  la prueba.'
- 'Paso 3: Concluir que el número es compuesto por poseer 3 o más divisores.'
errores_correccion: '- **Error 1: Creer que para probar que un número es compuesto
  hay que encontrar TODOS sus divisores.** **Cómo corregirlo:** Basta con encontrar
  UN SOLO divisor propio para clasificarlo como compuesto.


  - **Error 2: Pensar que si un número no termina en 2, 3 o 5 debe ser primo.** **Cómo
  corregirlo:** Puede ser divisible por 7, 11, 13, etc. (como $91 = 7 \cdot 13$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demuestre que 87 es un número compuesto.
  alternativas:
  - Es divisible por 3 (8+7=15)
  - Es divisible por 2
  - Es divisible por 5
  respuesta: Es divisible por 3 (8+7=15)
  solucion_pasos:
  - $8+7=15$, por criterio del 3 es divisible por 3, lo que demuestra que es compuesto.
- titulo: Ejemplo 2
  enunciado: ¿Es 51 un número primo o compuesto?
  alternativas:
  - Compuesto (divisible por 3)
  - Primo
  - Neutro
  respuesta: Compuesto (divisible por 3)
  solucion_pasos:
  - '$51 : 3 = 17$ exacto, por ende es un número compuesto.'
- titulo: ¿Es 119 un número compuesto?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $119 : 7 = 17$ exacto ($119 = 7 \cdot 17$).'
- titulo: ¿Basta hallar un tercer divisor positivo para confirmar que un entero mayor
    a 1 es compuesto?
  respuesta: Sí
  solucion_pasos:
  - Sí, poseer 3 o más divisores define a los números compuestos.
errores_frecuentes:
- Para identificar un número compuesto se deben calcular obligatoriamente todos sus
  divisores.
- Si un número termina en 7 o en 9 queda demostrado de inmediato que es un número
  primo.
- Los números compuestos tienen una cantidad finita máxima de 4 divisores.
- Encontrar que un número es divisible por 3 no es suficiente para declarar que es
  compuesto.
- Un número que no es divisible por 2 es automáticamente un número primo.
afirmaciones_verdaderas:
- Para clasificar un entero mayor a 1 como compuesto, basta con hallar un solo divisor
  propio $1 < d < n$.
- La presencia de al menos tres divisores positivos ($|D(n)| \ge 3$) confirma la composicionalidad.
al_terminar_debes_ponder: Al terminar serás capaz de identificar si un entero es compuesto,
  hallando al menos un divisor propio $1 < d < n$ que confirme la existencia de tres
  o más divisores positivos.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
