semantic_id: MAT.NUM.NUMEROS_PRIMOS.COMPUESTO_IDENTIFICACION
resumen_inicial: "Para identificar un número compuesto basta con encontrar un divisor distinto de 1 y de sí mismo; luego se listan todos sus divisores en parejas de factores."
explicacion_simple: |
  ¿Cómo podemos saber si un número es compuesto de forma rápida? Es como desarmar un
  juguete en piezas más pequeñas. Si puedes encontrar aunque sea una sola pieza de
  multiplicación (por ejemplo, ver que 20 se puede hacer como 4 por 5), ¡ya sabes que es
  un número compuesto! Luego podemos hacer la lista de todas las "piezas" o divisores que
  lo componen.
explicacion_formal: |
  Identificar un número compuesto consiste en demostrar que tiene divisores adicionales
  además de la unidad y de sí mismo, apoyándose en los criterios de divisibilidad básicos.
  Una vez determinado que $N$ es compuesto, se listan todos sus divisores en parejas de
  factores: para $N=18$, $1\cdot18$, $2\cdot9$, $3\cdot6$, de donde
  $D(18)=\{1,2,3,6,9,18\}$.
definiciones_clave: |
  **Pareja de factores**: dos números que multiplicados dan el número original; listarlas
  de forma ordenada asegura no omitir divisores.
propiedades_relaciones: |
  Las parejas de factores se buscan desde los extremos hacia el centro (1 y N, luego 2 y
  N/2, etc.), lo que evita saltarse divisores intermedios.
ejemplo_guiado:
  enunciado: "Identifica si 28 es compuesto y lista todos sus divisores."
  pasos:
    - "28 es par y mayor que 2, por lo que es divisible por 2: es compuesto."
    - 'Buscamos parejas de factores: $1\cdot28$, $2\cdot14$, $4\cdot7$.'
    - 'Conclusión: $D(28)=\{1,2,4,7,14,28\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cómo se listan de forma ordenada todos los divisores de un número compuesto?"
    choices:
      - {text: "Buscando parejas de factores desde los extremos hacia el centro", is_correct: true}
      - {text: "Sumando todos los múltiplos del número", is_correct: false}
      - {text: "Solo con el 1 y el número mismo", is_correct: false}
      - {text: "No existe un método ordenado", is_correct: false}
    explanation: "La correcta es Buscando parejas de factores desde los extremos hacia el centro: así se evita omitir divisores intermedios."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuántos divisores tiene 45?"
    choices:
      - {text: "6: {1, 3, 5, 9, 15, 45}", is_correct: true}
      - {text: "4: {1, 5, 9, 45}", is_correct: false}
      - {text: "2: {1, 45}", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 6: {1, 3, 5, 9, 15, 45}: las parejas de factores son $1\\cdot45$, $3\\cdot15$, $5\\cdot9$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
- 'Paso 1: Aplica criterios de divisibilidad rápidos (2, 3, 5) para encontrar algún divisor intermedio. Si el número es par mayor que 2, o termina en 5 o 0 mayor que 5, es compuesto.'
- 'Paso 2: Si no cumple criterios rápidos, verifica dividiendo por primos sucesivos (7, 11, etc.) hasta la raíz cuadrada del número.'
- 'Paso 3: Para listar todos sus divisores, busca parejas de números que multiplicadas den el número original, comenzando desde el 1 en orden ascendente.'
errores_correccion: |
  Un error frecuente es olvidar incluir las parejas del medio (como 4 y 6 en el caso de
  24). Otro error es omitir el propio número o el 1 en la lista final de divisores.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Identifica si el número $24$ es compuesto y enlista todos sus divisores.
  alternativas:
    - "Sí, es compuesto: {1, 2, 3, 4, 6, 8, 12, 24}"
    - "Sí, es compuesto: {1, 2, 3, 4, 6, 8, 24}"
    - "No, es primo"
  respuesta: "Sí, es compuesto: {1, 2, 3, 4, 6, 8, 12, 24}"
  solucion_pasos:
  - 'Paso a: El número $24$ es par y mayor que $2$, por lo que es divisible por $2$. Esto prueba que es compuesto.'
  - 'Paso b: Buscamos las parejas de factores: $1 \cdot 24$, $2 \cdot 12$, $3 \cdot 8$, $4 \cdot 6$.'
  - 'Paso c: Escribimos el conjunto ordenado de divisores de $24$: $\{1, 2, 3, 4, 6, 8, 12, 24\}$.'
- titulo: Ejemplo 2
  enunciado: Identifica si el número $35$ es compuesto y enlista todos sus divisores.
  alternativas:
    - "Sí, es compuesto: {1, 5, 7, 35}"
    - "No, es primo"
    - "Sí, es compuesto: {1, 35}"
  respuesta: "Sí, es compuesto: {1, 5, 7, 35}"
  solucion_pasos:
  - 'Paso a: El número $35$ termina en $5$ y es mayor que $5$, por lo que es divisible por $5$. Esto demuestra que es compuesto.'
  - 'Paso b: Buscamos las parejas de factores: $1 \cdot 35$, $5 \cdot 7$.'
  - 'Paso c: Escribimos el conjunto ordenado de divisores de $35$: $\{1, 5, 7, 35\}$.'
- titulo: ¿Es el número $49$ compuesto y sus divisores incluyen al $7$?
  respuesta: Sí
  solucion_pasos:
  - 'Probamos divisibilidad: $49$ no es divisible por $2$, $3$ ni $5$.'
  - 'Al probar por $7$: $49 \div 7 = 7$ (o $7 \cdot 7 = 49$). Esto demuestra que es compuesto.'
  - 'Sus divisores son $\{1, 7, 49\}$. Efectivamente, el $7$ forma parte de ellos.'
- titulo: ¿El número $20$ tiene exactamente $4$ divisores en total?
  respuesta: No
  solucion_pasos:
  - 'El número $20$ es compuesto.'
  - 'Busquemos todas sus parejas de divisores: $1 \cdot 20$, $2 \cdot 10$, $4 \cdot 5$.'
  - 'Los divisores de $20$ son $\{1, 2, 4, 5, 10, 20\}$, lo que hace un total de $6$ divisores, no $4$.'
errores_frecuentes:
- 'Olvidar incluir algunos divisores en la lista (generalmente las parejas del medio, como
    4 y 6 en el caso de 24).'
- 'Creer que si un número tiene muchos dígitos es compuesto, sin verificar divisores
    (existen primos muy grandes).'
- 'Omitir el propio número o el 1 en la lista final de divisores.'
- 'Repetir un divisor cuando el número es un cuadrado perfecto (por ejemplo, contar el 6 dos veces en los divisores de 36).'
- 'No usar un método ordenado (ir de extremos a centro) al buscar parejas de divisores, lo
    que facilita omitir elementos.'
afirmaciones_verdaderas:
  - "Los divisores de un número compuesto se pueden buscar en parejas de factores."
  - "El número 28 es compuesto."
al_terminar_debes_poder: |
  Identificar si un número es compuesto y listar de forma ordenada todos sus divisores.
fuente: Teoría de Números
estado: publicado
