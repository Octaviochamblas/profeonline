semantic_id: MAT.NUM.RAZONES_PROPORCIONES.TEOREMA_FUNDAMENTAL
resumen_inicial: 'El Teorema Fundamental de las Proporciones establece que en toda proporción geométrica, el producto de los extremos es igual al producto de los medios: $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$ ($b, d \neq 0$).'
explicacion_simple: "![Producto cruzado](/static/img/nodos/aplicacion-del-producto-cruzado-en-una-proporcion-intro.svg)\n\nEl **producto cruzado** (o Teorema Fundamental de las Proporciones) es la regla más importante de este tema:\n- **«El producto de los extremos es igual al producto de los medios»**:\n$$\\frac{a}{b} = \\frac{c}{d} \\iff a \\cdot d = b \\cdot c$$\n- **¿Cómo se aplica?** Se multiplica cruzado: el de arriba a la izquierda por el de abajo a la derecha, y se iguala al de abajo a la izquierda por el de arriba a la derecha.\n- **¿Para qué sirve?**\n  1. Para saber si dos razones forman una proporción ($8 \\cdot 15 = 120$ y $12 \\cdot 10 = 120 \\implies$ ¡Sí es proporción!).\n  2. Para **despejar cualquier incógnita** en una ecuación proporcional."
explicacion_formal: '**Teorema Fundamental de las Proporciones:**

  Sean $a, b, c, d \in \mathbb{R}$ con $b, d \neq 0$. La igualdad $\frac{a}{b} = \frac{c}{d}$ es válida si y solo si:


  $$a \cdot d = b \cdot c$$


  **Demostración:**

  Partiendo de $\frac{a}{b} = \frac{c}{d}$, multiplicamos ambos miembros por el producto de los denominadores $b \cdot d$ ($b \cdot d \neq 0$):

  $$\left(\frac{a}{b}\right) \cdot (b \cdot d) = \left(\frac{c}{d}\right) \cdot (b \cdot d)$$

  Simplificando los factores correspondientes:

  $$a \cdot d = c \cdot b = b \cdot c \quad \blacksquare$$


  **Despeje Universal de Incógnitas:**

  - $a = \frac{b \cdot c}{d}$

  - $b = \frac{a \cdot d}{c}$

  - $c = \frac{a \cdot d}{b}$

  - $d = \frac{b \cdot c}{a}$'
definiciones_clave: '- **Teorema Fundamental**: Identidad $a \cdot d = b \cdot c$.

  - **Multiplicación en cruz**: Operación cruzada entre numeradores y denominadores opuestos.

  - **Ecuación proporcional**: Ecuación racional resoluble linealmente mediante producto cruzado.'
propiedades_relaciones: '- **Linealización**: Convierte una ecuación racional con fracciones en una ecuación lineal entera sin denominadores.

  - **Criterio de no proporcionalidad**: Si $a \cdot d \neq b \cdot c$, entonces $\frac{a}{b} \neq \frac{c}{d}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de producto cruzado](/static/img/nodos/aplicacion-del-producto-cruzado-en-una-proporcion-ejemplos.svg)


    Verifique mediante producto cruzado si $\frac{8}{12} = \frac{10}{15}$ es una proporción válida, y resuelva la ecuación proporcional $\frac{x}{5} = \frac{12}{15}$.'
  pasos:
  - 'Paso 1: Para la verificación: Multiplicar extremos: $8 \cdot 15 = 120$.'
  - 'Paso 2: Multiplicar medios: $12 \cdot 10 = 120$.'
  - 'Paso 3: Comparar: Como $120 = 120$, el teorema confirma que sí es una proporción legítima.'
  - 'Paso 4: Para la ecuación: Aplicar producto cruzado: $15 \cdot x = 5 \cdot 12 \implies 15x = 60$.'
  - 'Paso 5: Despejar $x$: $x = \frac{60}{15} = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece el Teorema Fundamental de las Proporciones para $\frac{a}{b} = \frac{c}{d}$?
  choices:
  - text: $a \cdot d = b \cdot c$ (producto de extremos igual a producto de medios)
    is_correct: true
  - text: $a \cdot c = b \cdot d$
    is_correct: false
  - text: $a + d = b + c$
    is_correct: false
  - text: $a - d = b - c$
    is_correct: false
  explanation: La alternativa correcta es '$a \cdot d = b \cdot c$ (producto de extremos igual a producto de medios)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se despejó la incógnita en $\frac{x}{5} = \frac{12}{15}$?
  choices:
  - text: Multiplicando en cruz $15 \cdot x = 5 \cdot 12$ y dividiendo por 15
    is_correct: true
  - text: Sumando 5 y 12
    is_correct: false
  - text: Restando 15 menos 12
    is_correct: false
  - text: Dividiendo 5 entre 15 directamente
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando en cruz $15 \cdot x = 5 \cdot 12$ y dividiendo por 15'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los extremos ($a, d$) y los medios ($b, c$) en la proporción $\frac{a}{b} = \frac{c}{d}$.'
- 'Paso 2: Plantear la ecuación lineal multiplicando en cruz: $a \cdot d = b \cdot c$.'
- 'Paso 3: Despejar la incógnita dividiendo por el coeficiente correspondiente y simplificar el resultado.'
errores_correccion: '- **Error 1: Multiplicar horizontalmente ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** La multiplicación DEBE ser en cruz: numerador de un lado con denominador del otro ($a \cdot d = b \cdot c$).

  - **Error 2: Sumar en lugar de multiplicar.** **Cómo corregirlo:** El teorema fundamental es ESTRICTAMENTE multiplicativo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $x$ en la proporción $\frac{3}{7} = \frac{x}{28}$?
  alternativas:
  - $12$
  - $14$
  - $21$
  respuesta: $12$
  solucion_pasos:
  - $7 \cdot x = 3 \cdot 28 = 84 \implies x = \frac{84}{7} = 12$.
- titulo: Ejemplo 2
  enunciado: Si $4 \cdot 15 = 6 \cdot 10 = 60$, ¿cuál es la proporción correspondiente?
  alternativas:
  - $\frac{4}{6} = \frac{10}{15}$
  - $\frac{4}{10} = \frac{15}{6}$
  - $\frac{4}{15} = \frac{6}{10}$
  respuesta: $\frac{4}{6} = \frac{10}{15}$
  solucion_pasos:
  - Extremos $4$ y $15$, medios $6$ y $10$ $\implies \frac{4}{6} = \frac{10}{15}$.
- titulo: ¿Es el producto cruzado aplicable a cualquier ecuación con dos fracciones igualadas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la técnica algebraica universal para eliminar denominadores en proporciones.
  alternativas:
  - texto: Sí, transforma la proporción en una ecuación lineal entera equivalente
    es_correcta: true
    retroalimentacion: ¡Correcto! Aplicable universalmente con denominadores no nulos.
  - texto: No, solo funciona si los números son enteros
    es_correcta: false
    retroalimentacion: Incorrecto, aplica para cualquier número real.
  - texto: No, solo sirve para verificar, no para despejar
    es_correcta: false
    retroalimentacion: Incorrecto, es la herramienta principal de despeje.
- titulo: ¿Forman proporción 3/5 y 6/11 si 3 · 11 ≠ 5 · 6?
  respuesta: 'No'
  solucion_pasos:
  - No, $3 \cdot 11 = 33 \neq 5 \cdot 6 = 30$, por lo que no es una proporción.
  alternativas:
  - texto: No, al fallar el producto cruzado no existe proporción
    es_correcta: true
    retroalimentacion: ¡Correcto! Criterio de validación.
  - texto: Sí, porque 6 es el doble de 3
    es_correcta: false
    retroalimentacion: Incorrecto, 11 no es el doble de 5.
  - texto: Sí, con un margen de error
    es_correcta: false
    retroalimentacion: Incorrecto, la igualdad matemática debe ser exacta.
errores_frecuentes:
- Multiplicar en paralelo en vez de en cruz.
- Dividir el producto por el número equivocado al despejar.
- Cometer errores aritméticos en la multiplicación de dos dígitos.
- Olvidar verificar la solución obtenida en la proporción original.
afirmaciones_verdaderas:
- En toda proporción $\frac{a}{b} = \frac{c}{d}$, se cumple estrictamente que $a \cdot d = b \cdot c$.
- El producto cruzado permite despejar unívocamente cualquier término desconocido.
- Si el producto de extremos no coincide con el producto de medios, las razones no son proporcionales.
al_terminar_debes_poder: '![Síntesis de producto cruzado](/static/img/nodos/aplicacion-del-producto-cruzado-en-una-proporcion-resumen.svg)


  QUÉ: Aplicar el Teorema Fundamental de las Proporciones para validar igualdades y despejar incógnitas.


  CÓMO: Planteando la igualdad multiplicativa cruzada $a \cdot d = b \cdot c$ y despejando el término desconocido mediante división por el coeficiente opuesto.'
