semantic_id: MAT.NUM.PROPORCIONES.PRODUCTO_CRUZADO
resumen_inicial: La propiedad fundamental de las proporciones establece que en toda
  proporción el producto de los extremos es igual al producto de los medios ($a \cdot
  d = b \cdot c$).
explicacion_simple: 'Esta es la regla del **multiplicado cruzado**:

  $$\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$$

  Ejemplo en $\frac{3}{4} = \frac{6}{8}$:

  - Producto de extremos: $3 \cdot 8 = 24$.

  - Producto de medios: $4 \cdot 6 = 24$.

  Como $24 = 24$, la propiedad se cumple exactamente.'
explicacion_formal: Para $a, b, c, d \in \mathbb{R}$ con $b, d \neq 0$, la equivalencia
  de razones $\frac{a}{b} = \frac{c}{d}$ se satisface si y solo si $a \cdot d = b
  \cdot c$. Es el teorema central para verificar o despejar proporciones.
definiciones_clave: '- **Producto cruzado**: $a \cdot d = b \cdot c$ (producto de
  extremos = producto de medios).'
propiedades_relaciones: '- **Regla de tres**: Permite despejar cualquiera de las cuatro
  variables si se conocen las otras tres.'
ejemplo_guiado:
  enunciado: Verifica mediante la propiedad fundamental si $\frac{5}{8} = \frac{15}{24}$
    es una proporción.
  pasos:
  - Identificar extremos ($5$ y $24$) y medios ($8$ y $15$).
  - 'Calcular el producto de extremos: $5 \cdot 24 = 120$.'
  - 'Calcular el producto de medios: $8 \cdot 15 = 120$.'
  - Como $120 = 120$, se verifica que la propiedad fundamental se cumple.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad del producto cruzado en proporciones?
  choices:
  - text: El producto de los extremos es igual al producto de los medios (a · d =
      b · c)
    is_correct: true
  - text: La suma de los extremos es igual a la suma de los medios
    is_correct: false
  - text: Los cuatro números deben ser iguales
    is_correct: false
  - text: El primer término es igual al último
    is_correct: false
  explanation: 'La correcta es: El producto de los extremos es igual al producto de
    los medios (a · d = b · c). Teorema fundamental de proporciones.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $a \cdot 10 = 4 \cdot 15$, ¿cuál es el valor de $a$?
  choices:
  - text: '6'
    is_correct: true
  - text: '60'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: '15'
    is_correct: false
  explanation: 'La correcta es: 6. $a = \frac{4 \cdot 15}{10} = \frac{60}{10} = 6$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar en cruz: primer término por cuarto término ($a \cdot d$).'
- 'Paso 2: Multiplicar el segundo término por el tercer término ($b \cdot c$).'
- 'Paso 3: Igualar ambos productos: $a \cdot d = b \cdot c$.'
errores_correccion: No multipliques de frente (numerador por numerador). Debes multiplicar
  **cruzado**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Verifica si $2 \cdot 12 = 3 \cdot 8$.
  alternativas:
  - Sí, 24 = 24
  - 'No'
  respuesta: Sí, 24 = 24
  solucion_pasos:
  - Ambos productos dan 24.
errores_frecuentes:
- Multiplicar de forma horizontal en vez de cruzada.
afirmaciones_verdaderas:
- $a/b = c/d \iff ad = bc$.
al_terminar_debes_ponder: Aplicar la propiedad fundamental para comprobar igualdades
  proporcionales.
fuente: Texto escolar MINEDUC.
estado: publicado
