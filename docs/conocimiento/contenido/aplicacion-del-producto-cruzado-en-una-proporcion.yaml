semantic_id: MAT.NUM.PROPORCIONES.PRODUCTO_CRUZADO
resumen_inicial: 'La regla del producto cruzado establece que en toda proporción geométrica $\frac{a}{b} = \frac{c}{d}$, el producto de las diagonales cruzadas es idéntico: $a \cdot d = b \cdot c$.'
explicacion_simple: |
  El producto cruzado (o multiplicación en X) es la regla más famosa para resolver cualquier ecuación con proporciones. Consiste en multiplicar el número de arriba a la izquierda por el de abajo a la derecha ($a \cdot d$), e igualarlo al número de abajo a la izquierda multiplicado por el de arriba a la derecha ($b \cdot c$). Por ejemplo, si tienes $\frac{x}{6} = \frac{4}{3}$, multiplicas en cruz: $x \cdot 3 = 6 \cdot 4 \implies 3x = 24 \implies x = 8$.
explicacion_formal: |
  ### Definición formal
  El **Teorema Fundamental de las Proporciones (Regla del Producto Cruzado)** establece que para cualesquiera $a, b, c, d \in \mathbb{R}$ con $b, d \neq 0$:
  $$\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$$

  ### Demostración por eliminación de denominadores
  Multiplicando ambos miembros de la ecuación $\frac{a}{b} = \frac{c}{d}$ por el producto de los denominadores $b \cdot d$:
  $$(b \cdot d) \cdot \frac{a}{b} = (b \cdot d) \cdot \frac{c}{d} \implies a \cdot d = b \cdot c$$

  ### Despeje universal de cualquier incógnita
  La regla del producto cruzado permite despejar de forma sistemática cualquier término desconocido $x$:
  1. Si $\frac{x}{b} = \frac{c}{d} \implies x = \frac{b \cdot c}{d}$.
  2. Si $\frac{a}{x} = \frac{c}{d} \implies x = \frac{a \cdot d}{c}$.
  3. Si $\frac{a}{b} = \frac{x}{d} \implies x = \frac{a \cdot d}{b}$.
  4. Si $\frac{a}{b} = \frac{c}{x} \implies x = \frac{b \cdot c}{a}$.

  ### Síntesis didáctica
  - Ecuación cruzada: $a \cdot d = b \cdot c$.
  - Regla de tres simple: Multiplicar la diagonal conocida y dividir entre el término restante.
definiciones_clave: |
  - **Producto cruzado**: Operación de multiplicación entre los términos diagonalmente opuestos de dos fracciones igualadas.
  - **Teorema Fundamental de Proporciones**: Principio que garantiza la equivalencia entre el producto de extremos y el producto de medios.
  - **Ecuación proporcional**: Ecuación lineal obtenida al aplicar el producto cruzado a una igualdad de razones.
propiedades_relaciones: |
  - **Validación instantánea**: El producto cruzado permite verificar en 1 paso si dos razones dadas forman una proporción sin necesidad de calcular decimales.
  - **Base de la regla de tres**: La regla de tres simple directa es la aplicación algorítmica inmediata del producto cruzado.
ejemplo_guiado:
  enunciado: 'En la proporción $\frac{x}{15} = \frac{8}{10}$, despeja y calcula el valor exacto de la incógnita $x$ aplicando la regla del producto cruzado.'
  pasos:
    - 'Paso 1: Planteamos la multiplicación en cruz igualando los productos diagonales: $x \cdot 10 = 15 \cdot 8$.'
    - 'Paso 2: Resolvemos la multiplicación del lado derecho: $10x = 120$.'
    - 'Paso 3: Despejamos la incógnita $x$ dividiendo entre 10: $x = \frac{120}{10}$.'
    - 'Paso 4: Concluimos que $x = 12$. Verificación: $\frac{12}{15} = 0.8$ y $\frac{8}{10} = 0.8$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué igualdad algebraica se obtiene al aplicar el producto cruzado a la proporción $\frac{a}{b} = \frac{c}{d}$?'
    choices:
      - {text: '$a \cdot d = b \cdot c$, igualando el producto de la diagonal principal con la secundaria', is_correct: true}
      - {text: '$a + d = b + c$, sumando en cruz', is_correct: false}
      - {text: '$a \cdot b = c \cdot d$, multiplicando en horizontal', is_correct: false}
      - {text: '$a \cdot c = b \cdot d$, multiplicando los numeradores', is_correct: false}
    explanation: 'La alternativa correcta es ''$a \cdot d = b \cdot c$, igualando el producto de la diagonal principal con la secundaria''. Es la expresión formal del producto cruzado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $\frac{4}{x} = \frac{2}{9}$, ¿cuál es el valor numérico de la incógnita $x$?'
    choices:
      - {text: '$18$, mediante la multiplicación cruzada $2x = 4 \cdot 9 \implies 2x = 36 \implies x = 18$', is_correct: true}
      - {text: '$4.5$, dividiendo $9 / 2$', is_correct: false}
      - {text: '$7$, sumando $4 + 3$', is_correct: false}
      - {text: '$36$, multiplicando $4 \cdot 9$ sin dividir entre 2', is_correct: false}
    explanation: 'La alternativa correcta es ''$18$, mediante la multiplicación cruzada $2x = 4 \cdot 9 \implies 2x = 36 \implies x = 18$''. Planteamos $2x = 36 \implies x = 18$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos diagonales cruzadas en la igualdad de razones $\frac{a}{b} = \frac{c}{d}$.'
  - 'Paso 2: Formar la ecuación multiplicando el término superior izquierdo por el inferior derecho ($a \cdot d$).'
  - 'Paso 3: Formar el otro miembro de la ecuación multiplicando el término inferior izquierdo por el superior derecho ($b \cdot c$).'
  - 'Paso 4: Resolver la ecuación lineal resultante para despejar el valor de la incógnita deseada.'
errores_correccion: |
  - **Error 1:** Multiplicar en horizontal (numerador con numerador y denominador con denominador) al despejar una proporción. **Cómo corregirlo:** Las proporciones no son multiplicaciones de fracciones; el despeje exige **multiplicación CRUZADA en X**: $a \cdot d = b \cdot c$.
  - **Error 2:** Olvidar dividir por el coeficiente de la incógnita tras realizar el producto cruzado. **Cómo corregirlo:** Si obtienes $5x = 40$, debes hacer el último paso de **dividir $x = 40 / 5 = 8$** para despejar completamente $x$.
ejemplos:
  - titulo: 'Despeje de numeradores'
    enunciado: 'En la proporción $\frac{x}{12} = \frac{5}{4}$, ¿el valor de $x$ es $15$?'
    alternativas:
      - 'Sí, pues $4x = 60 \implies x = 15$'
      - 'No, es 20'
      - 'No, es 3'
    respuesta: 'Sí, pues $4x = 60 \implies x = 15$'
    solucion_pasos:
      - '1. Producto cruzado: $4x = 12 \cdot 5 = 60$.'
      - '2. Despejamos: $x = 60 / 4 = 15$.'
  - titulo: 'Despeje de denominadores'
    enunciado: 'En $\frac{6}{x} = \frac{3}{7}$, ¿se cumple que $x = 14$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $3x = 6 \cdot 7 = 42 \implies x = 42 / 3 = 14$.'
  - titulo: 'Verificación de proporción con decimales'
    enunciado: '¿La igualdad $\frac{1.5}{3} = \frac{4.5}{9}$ cumple el producto cruzado $1.5 \cdot 9 = 3 \cdot 4.5 = 13.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1.5 \cdot 9 = 13.5$ y $3 \cdot 4.5 = 13.5$.'
  - titulo: 'Despeje en contexto de escala'
    enunciado: 'En un mapa con escala $\frac{1}{500} = \frac{4}{x}$, ¿la distancia real $x$ es $2000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 \cdot x = 500 \cdot 4 = 2000$.'
errores_frecuentes:
  - 'Multiplicar en línea horizontal en lugar de multiplicar diagonalmente las expresiones.'
  - 'Sumar los términos diagonales en lugar de efectuar su producto multiplicativo.'
  - 'Restar las fracciones en lugar de despejar la ecuación multiplicativa resultante.'
  - 'Asignar un signo negativo al despejar productos de términos positivos.'
  - 'Dividir entre la diagonal conocida en lugar de dividir por el acompañante de la incógnita.'
afirmaciones_verdaderas:
  - 'La regla del producto cruzado establece que en toda proporción $\frac{a}{b} = \frac{c}{d}$ se cumple que $a \cdot d = b \cdot c$.'
  - 'Para despejar una incógnita $x$ en una proporción, se multiplican las dos cantidades de la diagonal conocida y se divide por la tercera cantidad restante.'
al_terminar_debes_poder: 'Aplicar la regla del producto cruzado $a \cdot d = b \cdot c$ para despejar y resolver incógnitas en cualquier proporción.'
