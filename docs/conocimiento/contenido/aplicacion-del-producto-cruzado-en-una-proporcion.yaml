resumen_inicial: 'El Teorema Fundamental de las Proporciones establece que en toda
  proporción $\frac{a}{b} = \frac{c}{d}$, el producto de los extremos es igual al
  producto de los medios: $a \cdot d = b \cdot c$.'
explicacion_simple: La propiedad del producto cruzado dice que al multiplicar en diagonal
  en una proporción (el de arriba a la izquierda por el de abajo a la derecha), nos
  da exactamente el mismo número que multiplicar la otra diagonal (el de abajo a la
  izquierda por el de arriba a la derecha).
explicacion_formal: 'Para todo $a, c \in \mathbb{R}$ y $b, d \in \mathbb{R} \setminus
  \{0\}$, el **Teorema Fundamental de las Proporciones** (Producto Cruzado) se expresa
  como:


  $$\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$$


  **Demostración por simplificación de denominadores:**

  Multiplicando la ecuación $\frac{a}{b} = \frac{c}{d}$ por el producto de denominadores
  $(b \cdot d)$:

  $$\frac{a}{b} \cdot (b \cdot d) = \frac{c}{d} \cdot (b \cdot d) \implies a \cdot
  d = c \cdot b$$'
definiciones_clave: '- **Producto cruzado**: Propiedad $a \cdot d = b \cdot c$ indispensable
  para resolver ecuaciones de proporción.'
propiedades_relaciones: '- **Igualdad de productos diagonalizados**: Producto de extremos
  $=$ Producto de medios.'
ejemplo_guiado:
  enunciado: Verifique el producto cruzado en la proporción $\frac{5}{8} = \frac{15}{24}$.
  pasos:
  - 'Paso 1: Multiplicar los términos extremos: $5 \cdot 24 = 120$.'
  - 'Paso 2: Multiplicar los términos medios: $8 \cdot 15 = 120$.'
  - 'Paso 3: Comparar productos: como $120 = 120$, la propiedad se satisface perfectamente.'
  - 'Conclusión: El producto cruzado confirma que la proporción es válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece el Teorema Fundamental de las Proporciones (producto cruzado)
    para a/b = c/d?
  choices:
  - text: Que el producto de los extremos es igual al producto de los medios (a ·
      d = b · c)
    is_correct: true
  - text: Que la suma a + d es igual a b + c
    is_correct: false
  - text: Que a / d = b / c
    is_correct: false
  - text: Que los cuatro términos deben ser impares
    is_correct: false
  explanation: La alternativa correcta es 'Que el producto de los extremos es igual
    al producto de los medios (a · d = b · c)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5/8 = 15/24, ¿cuál fue el valor del producto
    cruzado coincidente?
  choices:
  - text: '120'
    is_correct: true
  - text: '40'
    is_correct: false
  - text: '200'
    is_correct: false
  - text: '60'
    is_correct: false
  explanation: La alternativa correcta es '120'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de aplicar el producto cruzado $a
  \cdot d = b \cdot c$ para verificar la validez de proporciones y despejar incógnitas.
semantic_id: MAT.NUM.PROPORCIONES.PRODUCTO_CRUZADO
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.PRODUCTO_CRUZADO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
