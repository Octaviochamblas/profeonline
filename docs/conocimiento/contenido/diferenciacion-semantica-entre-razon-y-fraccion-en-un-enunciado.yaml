  - text: 3 + 4
    is_correct: false
  - text: 3 * 4
    is_correct: false
  - text: 4 / 3
    is_correct: false
  explanation: La alternativa correcta es '3 / 4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir la diferenciación
  semántica entre razón y fracción.** **Cómo corregirlo:** Mantener el orden sintáctico
  adecuado de los operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'la razón entre 3 y 4'?
  alternativas:
  - 3 / 4
  - 3 + 4
  - 3 * 4
  - 4 / 3
  respuesta: 3 / 4
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo 3 / 4.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de la diferenciación
    semántica entre razón y fracción 'la razón entre 3 y 4'?
  alternativas:
  - 3 / 4
  - 3 + 4
  - 3 * 4
  - 4 / 3
  respuesta: 3 / 4
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es 3 / 4.
- titulo: ¿Representa 3 / 4 el enunciado 'la razón entre 3 y 4'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a 3 / 4?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de la diferenciación semántica
  entre razón y fracción.
- Multiplicar en lugar de dividir o restar según corresponda en la diferenciación
  semántica entre razón y fracción.
- Representar la adición de términos mediante la elevación a exponentes en la diferenciación
  semántica entre razón y fracción.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de la diferenciación
  semántica entre razón y fracción.
afirmaciones_verdaderas:
- La expresión 3 / 4 representa la traducción fiel de la diferenciación semántica
  entre razón y fracción.
- Las variables permiten modelar cualquier caso en la diferenciación semántica entre
  razón y fracción.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre la diferenciación
  semántica entre razón y fracción construyendo la expresión algebraica 3 / 4 de manera
  correcta.
