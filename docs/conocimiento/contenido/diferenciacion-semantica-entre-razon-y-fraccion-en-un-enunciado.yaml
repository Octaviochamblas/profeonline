procedimiento:
- 'Paso 1: Lee el enunciado. ¿Se están comparando dos partes distintas (ej. autos
  rojos vs autos azules)? Es una razón.'
- 'Paso 2: ¿Se está comparando una parte contra todo el conjunto (ej. autos rojos
  vs el total del estacionamiento)? Es una fracción de un total.'
- 'Paso 3: Si es una razón (a:b), para saber qué fracción del total representa ''a'',
  debes sumar a+b y colocarlo como denominador: a/(a+b).'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  diferenciación semántica entre razón y fracción en un enunciado.
ejemplos:
- titulo: De razón a fracción total
  enunciado: Si la razón entre agua y jarabe es de 4 a 1, ¿qué fracción de la mezcla
    total es agua?
  solucion_pasos:
  - 'Partes de agua: 4.'
  - 'Partes de jarabe: 1.'
  - 'Total de partes en la mezcla: 4 + 1 = 5.'
  - 'Fracción de agua respecto al total: 4/5 de la mezcla.'
- titulo: Un inversionista inyecta capital en una empresa bajo la condición de que
    'la razón entre mi
  enunciado: 'Un inversionista inyecta capital en una empresa bajo la condición de
    que ''la razón entre mi inversión y la del fundador sea de $2$ a $3$''. Al momento
    de repartir los dividendos totales ($D$), el inversionista exige los $\frac23
    D$. El abogado del fundador le dice que su exigencia es matemáticamente incorrecta.
    ¿Qué fracción del total de dividendos le corresponde realmente al inversionista
    según su contrato? (v1)


    Opciones: A) Le corresponden los $\frac{2}{5} D$. · B) Le corresponde exactamente
    $\frac{1}{2} D$. · C) Le corresponden los $\frac{3}{2} D$. · D) Le corresponden
    los $\frac{3}{5} D$.'
  solucion_pasos:
  - La inversión tiene la forma 2k (inversionista) y 3k (fundador). El capital total
    es 5k. Por lo tanto, al inversionista le corresponden 2 partes de las 5 totales,
    es decir, 2/5 del dividendo. Exigir los 2/3 es confundir la razón con la fracción
    del total.
  - 'Respuesta: Le corresponden los $\frac{2}{5} D$.'
