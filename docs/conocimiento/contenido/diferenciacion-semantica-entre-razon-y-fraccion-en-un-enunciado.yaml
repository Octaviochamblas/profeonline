semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.RAZON_FRENTE_FRACCION
resumen_inicial: La diferenciación semántica entre razón y fracción en un enunciado consiste en distinguir cuándo una expresión cociente $\frac{A}{B}$ representa una relación de comparación entre dos magnitudes independientes (razón) o una relación parte-todo de una misma magnitud (fracción).
explicacion_simple: "Aunque tanto una **razón** como una **fracción** se escriben como una división ($\\frac{a}{b}$), **significan cosas distintas en un problema**:\n- **Fracción (Relación Parte - Todo)**:\n  - Compara una **parte tomada respecto a un todo completo** del mismo tipo.\n  - Ejemplo: \"Me comí $\\frac{3}{4}$ de una pizza\" $\\implies$ El $4$ es el total de trozos y el $3$ son los trozos comidos.\n- **Razón (Relación Comparativa de Magnitudes)**:\n  - Compara **dos cantidades distintas e independientes** que pueden tener unidades diferentes o referirse a grupos distintos.\n  - Ejemplo: \"La razón entre autos ($a$) y motos ($m$) es $\\frac{3}{2}$\" $\\implies$ Por cada 3 autos hay 2 motos (ninguna es \"el todo\" del otro; se comparan dos grupos).\n- **Diferencia clave en álgebra**: En la razón $\\frac{a}{b} = \\frac{3}{2}$, los grupos reales se representan parametrizados como **$a = 3k$** y **$b = 2k$** con su constante $k$.\n\n![Razón vs Fracción](/static/img/nodos/diferenciacion-semantica-entre-razon-y-fraccion-en-un-enunciado-intro.svg)\n"
explicacion_formal: "### Definición formal\n1. **Fracción como Parte-Todo**: Es la medida racional $f \\in [0, 1]$ que expresa el tamaño relativo de un subconjunto $S \\subset U$ respecto al universo total $U$:\n   $$f = \\frac{|S|}{|U|} \\quad \\text{donde } S \\text{ y } U \\text{ pertenecen a la misma magnitud o universo}$$\n2. **Razón como Comparación Proporcional**: Es una relación cociente $R: M_1 \\times M_2 \\to \\mathbb{R}$ entre dos magnitudes independientes $M_1$ y $M_2$:\n   $$R = \\frac{m_1}{m_2} \\quad \\text{donde } m_1 \\in M_1, \\quad m_2 \\in M_2$$\n\n### Matriz de Diferenciación Semántica\n\n$$\\begin{array}{|c|c|c|}\n\\hline\n\\text{\\textbf{Criterio}} & \\text{\\textbf{Fracción (Parte-Todo)}} & \\text{\\textbf{Razón (Comparación)}} \\\\\n\\hline\n\\text{Universo} & \\text{Mismo objeto o conjunto} & \\text{Conjuntos o magnitudes distintas} \\\\\n\\text{Dominio de valores} & \\text{Frecuentemente } \\le 1 & \\text{Cualquier valor real } > 0 \\\\\n\\text{Unidades} & \\\
  text{Adimensional (se cancelan)} & \\text{Pueden tener distintas unidades (km/h)} \\\\\n\\text{Parametrización} & x = \\frac{p}{q} \\cdot \\text{Total} & a = p \\cdot k, \\quad b = q \\cdot k \\\\\n\\hline\n\\end{array}$$\n\n### Síntesis didáctica\nReconocer si una tasa es parte-todo o comparación directa es fundamental para determinar si el problema exige multiplicar por un total o aplicar constantes de proporcionalidad $k$.\n"
definiciones_clave: '- **Relación parte-todo (Fracción)**: Comparación de una porción extraída respecto a la totalidad de una misma entidad.

  - **Relación de comparación (Razón)**: Comparación por cociente entre dos magnitudes independientes o distintas.

  - **Constante de proporcionalidad ($k$)**: Factor introducido al trabajar con razones para representar las magnitudes reales en problemas aplicados.

  '
propiedades_relaciones: '- **Conversión de Razón a Fracción del Total**: Si la razón de hombres a mujeres es $3:2$, la fracción de hombres respecto al **total de personas** es $\frac{3}{3+2} = \frac{3}{5}$.

  - **Tasas compuestas**: Cuando una razón compara magnitudes de diferente especie (ej: distancia y tiempo, $\frac{\text{km}}{\text{h}}$), la razón adquiere dimensiones físicas (velocidad).

  '
ejemplo_guiado:
  enunciado: 'En una fiesta, la razón entre el número de hombres ($h$) y mujeres ($m$) es de $4 : 5$. Si en total hay $90$ personas, clasifica la relación $4:5$ y calcula la fracción del total de personas que son mujeres.'
  pasos:
  - 'Paso 1: Clasificamos la relación $4:5$: Compara dos grupos distintos (hombres y mujeres) $\implies$ **Es una Razón de comparación**.'
  - 'Paso 2: Parametrizamos usando la constante $k$: $h = 4k$ y $m = 5k$.'
  - 'Paso 3: Expresamos el total: $h + m = 4k + 5k = 9k = 90 \implies k = 10$.'
  - 'Paso 4: Calculamos la cantidad real de mujeres: $m = 5(10) = 50$ de un total de $90$.'
  - 'Paso 5: Expresamos la relación parte-todo de mujeres sobre el total: $\frac{50}{90} = \frac{5}{9}$.'
  - 'Conclusión: La relación $4:5$ es una **razón** y las mujeres representan los **$\frac{5}{9}$ del total de personas**.'
  imagen: /static/img/nodos/diferenciacion-semantica-entre-razon-y-fraccion-en-un-enunciado-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué diferencia semántica esencial distingue a una fracción (parte-todo) de una razón de comparación?
  choices:
  - text: La fracción compara una parte extraída respecto al total del mismo conjunto, mientras que la razón compara dos cantidades o conjuntos independientes
    is_correct: true
  - text: La fracción se escribe con números primos y la razón con números pares
    is_correct: false
  - text: La razón sólo admite números enteros negativos
    is_correct: false
  - text: No existe ninguna diferencia semántica entre ambas
    is_correct: false
  explanation: La alternativa correcta es 'La fracción compara una parte extraída respecto al total del mismo conjunto, mientras que la razón compara dos cantidades o conjuntos independientes'. Parte-Todo vs Comparación.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la razón de agua a jugo en una mezcla es de $1$ a $3$, ¿cuál es la fracción del total de la mezcla que corresponde al agua?
  choices:
  - text: La fracción del total que corresponde al agua es $\frac{1}{4}$ (obtenida de $\frac{1}{1 + 3}$)
    is_correct: true
  - text: La fracción del total que corresponde al agua es $\frac{1}{3}$
    is_correct: false
  - text: La fracción del total que corresponde al agua es $\frac{3}{4}$
    is_correct: false
  - text: La fracción del total que corresponde al agua es $3$
    is_correct: false
  explanation: La alternativa correcta es 'La fracción del total que corresponde al agua es $\frac{1}{4}$ (obtenida de $\frac{1}{1 + 3}$)'. El total de partes es $1+3=4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analizar el enunciado y determinar si las cantidades comparadas forman parte del mismo todo o son entidades distintas.'
- 'Paso 2: Si es una parte sobre la totalidad del mismo objeto, clasificar como **Fracción Parte-Todo** ($\frac{\text{Parte}}{\text{Total}}$).'
- 'Paso 3: Si compara dos entidades independientes, clasificar como **Razón de Comparación** ($a : b$).'
- 'Paso 4: Para calcular la fracción de un subgrupo respecto al universo en una razón $p:q$, sumar los términos ($p+q$) y formar la fracción $\frac{p}{p+q}$.'
errores_correccion: '- **Error 1:** Tomar los términos de una razón como si fueran las partes del total (ej: en una razón de hombres a mujeres de $2:3$, declarar que los hombres son $\frac{2}{3}$ del total). **Cómo corregirlo:** Los hombres son **$\frac{2}{2+3} = \frac{2}{5}$ del total**; $\frac{2}{3}$ es la razón comparativa con las mujeres.

  - **Error 2:** Declarar que las razones no pueden llevar unidades distintas. **Cómo corregirlo:** Las razones **SÍ pueden comparar magnitudes distintas** como distancia y tiempo ($\frac{\text{km}}{\text{h}}$).

  '
ejemplos:
- titulo: Clasificación de razón
  enunciado: En la frase "Por cada 2 manzanas rojas hay 3 manzanas verdes", ¿es una razón de comparación o una fracción del total?
  alternativas:
  - Es una razón de comparación entre dos tipos de manzanas ($2:3$)
  - Es una fracción parte-todo de $\frac{2}{3}$
  - Es una resta de manzanas
  respuesta: Es una razón de comparación entre dos tipos de manzanas ($2:3$)
  solucion_pasos:
  - '1. Compara dos subgrupos independientes: rojas y verdes.'
  - 2. Es una razón de comparación $2:3$.
- titulo: Conversión a fracción del total
  enunciado: 'Si la razón entre aprobados y reprobados es de $7 : 1$, ¿qué fracción del total aprobó el examen?'
  alternativas:
  - $\frac{7}{8}$ del total
  - $\frac{7}{1}$ del total
  - $\frac{1}{7}$ del total
  respuesta: $\frac{7}{8}$ del total
  solucion_pasos:
  - '1. Total de partes: $7 + 1 = 8$.'
  - '2. Fracción del total aprobada: $\frac{7}{8}$.'
- titulo: Razón con unidades
  enunciado: La expresión de velocidad $\frac{100 \text{ km}}{2 \text{ h}} = 50 \text{ km/h}$, ¿es una razón entre magnitudes distintas?
  respuesta: Sí
  solucion_pasos:
  - Sí, compara distancia en kilómetros y tiempo en horas.
- titulo: Fracción del mismo objeto
  enunciado: En la frase "Me queda $\frac{1}{4}$ de estanque de bencina", ¿se trata de una fracción parte-todo?
  respuesta: Sí
  solucion_pasos:
  - Sí, mide la porción de bencina respecto a la capacidad total del mismo estanque.
errores_frecuentes:
- Intercambiar la razón entre dos partes con la fracción del total en problemas de mezclas.
- Declarar que las razones no pueden comparar magnitudes con diferentes unidades físicas.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Sumar directamente las razones de dos grupos sin considerar el número total de elementos.
- La constante de proporcionalidad k no es añadida al parametrizar los términos de una razón.
afirmaciones_verdaderas:
- Una fracción expresa una relación parte-todo dentro de un mismo conjunto universo.
- Una razón expresa una comparación por cociente entre dos magnitudes o conjuntos independientes.
al_terminar_debes_poder: '![Resumen de diferenciación razón vs fracción](/static/img/nodos/diferenciacion-semantica-entre-razon-y-fraccion-en-un-enunciado-resumen.svg)


  QUÉ: Distinguir rigurosamente entre una relación parte-a-parte (razón) y una relación parte-al-todo (fracción).


  CÓMO: Calcular el total como suma de las partes ($T = A + B$) para transformar razones $\frac{A}{B} = \frac{a}{b}$ en fracciones del universo total $\frac{A}{T} = \frac{a}{a + b}$.'
