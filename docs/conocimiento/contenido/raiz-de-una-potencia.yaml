semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_POTENCIA
resumen_inicial: Para calcular la raíz de una potencia $\sqrt[n]{a^m}$, se puede simplificar
  dividiendo el exponente $m$ por el índice $n$ ($a^{m/n}$). Si $m = n$, entonces
  $\sqrt[n]{a^n} = |a|$ (o $a$ si $a \ge 0$).
explicacion_simple: 'Cuando la potencia dentro de la raíz tiene un exponente que se
  puede dividir por el índice:

  $$\sqrt[3]{2^6} = 2^{6 \div 3} = 2^2 = 4$$

  Si el exponente y el índice son iguales, la raíz y la potencia se cancelan: $\sqrt[4]{5^4}
  = 5$.'
explicacion_formal: Para todo $a \in \mathbb{R}^+$ y $m, n \in \mathbb{N}$ con $n
  \ge 2$, se cumple $\sqrt[n]{a^m} = a^{m/n}$. Si $n$ es par, $\sqrt[n]{a^n} = |a|$.
  Si $n$ es impar, $\sqrt[n]{a^n} = a$.
definiciones_clave: '- **Simplificación de índice y exponente**: División del exponente
  $m$ y del índice $n$ por un factor común.'
propiedades_relaciones: '- **Cancelación**: Si $m = n$, el operador raíz cancela la
  potencia del radicando.'
ejemplo_guiado:
  enunciado: Calcula A) $\sqrt[5]{3^{10}}$ y B) $\sqrt{(-7)^2}$.
  pasos:
  - 'Para A: Dividir el exponente 10 por el índice 5: $3^{10 \div 5} = 3^2 = 9$.'
  - 'Para B: Como el índice 2 es par, aplicamos valor absoluto: $\sqrt{(-7)^2} = |-7|
    = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\sqrt[4]{x^8}$ para $x \ge 0$?
  choices:
  - text: x^2
    is_correct: true
  - text: x^4
    is_correct: false
  - text: x^{32}
    is_correct: false
  - text: 2x
    is_correct: false
  explanation: 'La correcta es: x^2. Dividimos el exponente por el índice: $8 \div
    4 = 2 \implies x^2$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\sqrt[3]{(-4)^3}$.
  choices:
  - text: '-4'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: No existe
    is_correct: false
  explanation: 'La correcta es: -4. Como el índice es impar (3), la raíz preserva
    el signo: $\sqrt[3]{(-4)^3} = -4$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ y el exponente $m$ del radicando.'
- 'Paso 2: Dividir el exponente entre el índice ($m \div n$).'
- 'Paso 3: Si $n$ es par y el número es real general, aplicar valor absoluto.'
- 'Paso 4: Escribir el resultado simplificado.'
errores_correccion: 'No olvides el valor absoluto en índices pares: $\sqrt{(-5)^2}
  = |-5| = 5$, NUNCA $-5$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\sqrt[3]{2^9}$.
  alternativas:
  - '8'
  - '16'
  - '64'
  respuesta: '8'
  solucion_pasos:
  - $2^{9 \div 3} = 2^3 = 8$.
errores_frecuentes:
- Olvidar aplicar valor absoluto cuando el índice es par.
afirmaciones_verdaderas:
- $\sqrt[n]{a^m} = a^{m/n}$.
al_terminar_debes_poder: Simplificar raíces de potencias dividiendo sus exponentes
  e índices.
fuente: Texto escolar MINEDUC.
estado: publicado
