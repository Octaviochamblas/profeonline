semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_POTENCIA
resumen_inicial: 'La raíz de una potencia permite expresar un radical como una potencia de exponente fraccionario dividiendo el exponente interno por el índice: $\sqrt[n]{a^m} = a^{m/n}$.'
explicacion_simple: |
  Una raíz y una potencia se pueden combinar dividiendo el exponente que está dentro de la raíz por el número del índice de afuera. El exponente de adentro ($m$) queda arriba en la fracción (numerador) y el índice de la raíz ($n$) queda abajo (denominador). Por ejemplo, $\sqrt[3]{2^6} = 2^{6/3} = 2^2 = 4$.
explicacion_formal: |
  ### Definición formal
  La **propiedad de la raíz de una potencia** establece la equivalencia fundamental entre la forma radical y la forma de potencia fraccionaria para todo $a \in \mathbb{R}^+$ y $m, n \in \mathbb{Z}^+$ ($n \ge 2$):
  $$\sqrt[n]{a^m} = \left(\sqrt[n]{a}\right)^m = a^{\frac{m}{n}}$$

  ### Casos particulares fundamentales
  1. **Simplificación exacta ($m = n$)**:
     $$\sqrt[n]{a^n} = a \quad (\text{para } a \ge 0, \text{ o } |a| \text{ si } n \text{ es par})$$
  2. **Exponentes múltiplos del índice ($m = k \cdot n$)**:
     $$\sqrt[n]{a^{k \cdot n}} = a^k$$

  ### Síntesis didáctica
  - Posición del exponente subradical $m$: Pasa a ser el **numerador** de la fracción.
  - Posición del índice radical $n$: Pasa a ser el **denominador** de la fracción.
definiciones_clave: |
  - **Raíz de una potencia**: Transformación analítica de un radical con exponente subradical en una potencia de exponente racional.
  - **Exponente fraccionario $\frac{m}{n}$**: Razón entre el exponente del radicando y el índice de la raíz.
  - **Cancelación índice-exponente**: Simplificación directa $\sqrt[n]{a^n} = a$ que ocurre cuando el exponente coincide con el índice.
propiedades_relaciones: |
  - **Intercambiabilidad de operaciones**: El orden de la potencia y la raíz se puede intercambiar: $\sqrt[n]{a^m} = (\sqrt[n]{a})^m$.
  - **Simplificación de fracciones en exponentes**: Permite reducir los valores numéricos simplificando la fracción $\frac{m}{n}$ antes de calcular.
ejemplo_guiado:
  enunciado: 'Simplifica la expresión radical $S = \sqrt[4]{3^{12}}$ transformándola a su forma de potencia fraccionaria y calcula su resultado numérico.'
  pasos:
    - 'Paso 1: Identificamos la base $a = 3$, el exponente interno $m = 12$ y el índice radical $n = 4$.'
    - 'Paso 2: Expresamos el radical como una potencia de exponente fraccionario: $S = 3^{\frac{12}{4}}$.'
    - 'Paso 3: Simplificamos la división del exponente: $\frac{12}{4} = 3 \implies S = 3^3$.'
    - 'Paso 4: Calculamos el valor de la potencia resultante: $3^3 = 27 \implies S = 27$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se representa la raíz de una potencia $\sqrt[n]{a^m}$ como una potencia de exponente fraccionario?'
    choices:
      - {text: '$a^{\frac{m}{n}}$, dividiendo el exponente interno $m$ entre el índice $n$', is_correct: true}
      - {text: '$a^{m \cdot n}$, multiplicando el exponente por el índice', is_correct: false}
      - {text: '$a^{n - m}$, restando el índice del exponente', is_correct: false}
      - {text: '$a^{\frac{n}{m}}$, colocando el índice en el numerador', is_correct: false}
    explanation: 'La alternativa correcta es ''$a^{\frac{m}{n}}$, dividiendo el exponente interno $m$ entre el índice $n$''. El exponente subradical es el numerador y el índice radical es el denominador.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la expresión $\sqrt[3]{2^6}$?'
    choices:
      - {text: '$4$, pues $2^{6/3} = 2^2 = 4$', is_correct: true}
      - {text: '$8$, multiplicando los exponentes', is_correct: false}
      - {text: '$64$, calculando $2^6$ sin simplificar la raíz', is_correct: false}
      - {text: '$2$, dividiendo $6/6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4$, pues $2^{6/3} = 2^2 = 4$''. Dividimos el exponente 6 por el índice 3 dando $2^2 = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la base $a$, el exponente interno $m$ y el índice radical $n$.'
  - 'Paso 2: Escribir la base $a$ elevada a la fracción $\frac{m}{n}$.'
  - 'Paso 3: Simplificar la fracción del exponente dividiendo el numerador por el denominador.'
  - 'Paso 4: Evaluar la potencia entera resultante para obtener la respuesta final.'
errores_correccion: |
  - **Error 1:** Invertir la fracción del exponente escribiendo $a^{n/m}$ en lugar de $a^{m/n}$. **Cómo corregirlo:** El número que está **adentro** de la raíz ($m$) siempre va **arriba** (numerador); el número del índice ($n$) siempre va **abajo** (denominador).
  - **Error 2:** Olvidar el valor absoluto cuando $n$ es par en $\sqrt[n]{a^n}$. **Cómo corregirlo:** Para índices pares, $\sqrt[n]{a^n} = |a|$. Por ejemplo, $\sqrt{(-5)^2} = \sqrt{25} = 5 = |-5|$.
ejemplos:
  - titulo: 'Simplificación con exponente divisible'
    enunciado: '¿La expresión $\sqrt[5]{x^{10}}$ equivale a $x^2$?'
    alternativas:
      - 'Sí, pues $10 / 5 = 2 \implies x^2$'
      - 'No, equivale a $x^5$'
      - 'No, equivale a $x^{50}$'
    respuesta: 'Sí, pues $10 / 5 = 2 \implies x^2$'
    solucion_pasos:
      - '1. Convertimos a exponente racional: $x^{10/5}$.'
      - '2. Dividimos $10 / 5 = 2 \implies x^2$.'
  - titulo: 'Cancelación directa de raíz e índice'
    enunciado: 'Para $a > 0$, ¿la expresión $\sqrt[3]{a^3}$ simplifica directamente a $a$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a^{3/3} = a^1 = a$.'
  - titulo: 'Intercambio de operaciones'
    enunciado: '¿Es correcto afirmar que $\sqrt[3]{8^2} = (\sqrt[3]{8})^2 = 2^2 = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El orden entre potencia y raíz no altera el resultado.'
  - titulo: 'Evaluación numérica'
    enunciado: '¿El valor de $\sqrt{5^4}$ es igual a $25$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $5^{4/2} = 5^2 = 25$.'
errores_frecuentes:
  - 'La raíz de una potencia $\sqrt[n]{a^m}$ se convierte en la potencia $a^{n/m}$ invirtiendo la fracción.'
  - 'Al simplificar $\sqrt[n]{a^n}$ con $n$ par y $a < 0$, el resultado es el número negativo $a$.'
  - 'Multiplicar el exponente interno por el índice de la raíz para eliminar el signo radical.'
  - 'La expresión $\sqrt{x^2}$ es siempre igual a $x$ sin importar si $x$ es negativo.'
  - 'La potencia $a^{m/n}$ no se puede representar en forma de radical.'
afirmaciones_verdaderas:
  - 'La propiedad de la raíz de una potencia establece que $\sqrt[n]{a^m} = a^{m/n}$, donde el exponente subradical es el numerador y el índice de la raíz es el denominador.'
  - 'Para cualquier número real $a$, la expresión $\sqrt{a^2}$ equivale al valor absoluto $|a|$.'
al_terminar_debes_poder: 'Convertir y simplificar raíces de potencias expresando el radical en forma de potencia de exponente fraccionario.'
