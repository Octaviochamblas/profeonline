resumen_inicial: 'La raíz $n$-ésima de una potencia $m$-ésima $\sqrt[n]{a^m}$ puede
  simplificarse dividiendo el exponente por el índice: $a^{m/n}$.'
explicacion_simple: Si dentro de una raíz hay un número elevado a un exponente, podemos
  simplificar la raíz dividiendo el exponente de adentro por el índice de afuera.
explicacion_formal: 'Para todo $a > 0$ y $m, n \in \mathbb{N}_{\ge 2}$, la **Raíz
  de una Potencia** cumple:


  $$\sqrt[n]{a^m} = \left(\sqrt[n]{a}\right)^m = a^{\frac{m}{n}}$$


  **Simplificación cuando $m = n$:**

  $$\sqrt[n]{a^n} = a \quad (a \ge 0)$$'
definiciones_clave: '- **Raíz de una potencia**: Identidad $\sqrt[n]{a^m} = a^{m/n}$
  de simplificación racional del exponente.'
propiedades_relaciones: '- **Exponente fraccionario**: Transforma el índice en denominador
  del exponente.'
ejemplo_guiado:
  enunciado: Simplifique la raíz $\sqrt[3]{2^6}$.
  pasos:
  - 'Paso 1: Identificar el exponente $m=6$ y el índice $n=3$.'
  - 'Paso 2: Dividir el exponente por el índice: $6 : 3 = 2$.'
  - 'Paso 3: Elevar la base al resultado: $2^2 = 4$.'
  - 'Conclusión: $\sqrt[3]{2^6} = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación simplifica la expresión sqrt[n]{a^m} a una potencia simple?
  choices:
  - text: Dividir el exponente interno m por el índice n (a^{m/n})
    is_correct: true
  - text: Multiplicar el exponente por el índice
    is_correct: false
  - text: Restar el índice al exponente
    is_correct: false
  - text: Eliminar la base a
    is_correct: false
  explanation: La alternativa correcta es 'Dividir el exponente interno m por el índice
    n (a^{m/n})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt[3]{2^6}, ¿cuál fue el resultado?
  choices:
  - text: 4 (porque 2^2 = 4)
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '4 (porque 2^2 = 4)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar raíces de potencias
  $\sqrt[n]{a^m} = a^{m/n}$, dividiendo el exponente interno entre el índice de la
  raíz.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_POTENCIA
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_POTENCIA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
