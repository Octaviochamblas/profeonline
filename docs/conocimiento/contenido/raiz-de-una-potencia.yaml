semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_POTENCIA
resumen_inicial: 'En la raíz de una potencia, el exponente del radicando y el índice del radical pueden intercambiarse o simplificarse dividiendo ambos por su máximo común divisor: $\sqrt[n]{a^m} = (\sqrt[n]{a})^m = a^{m/n}$.'
explicacion_simple: '![Raíz de una potencia](/static/img/nodos/raiz-de-una-potencia-intro.svg)


  Cuando tienes una potencia dentro de una raíz (como $\sqrt[3]{27^2}$), puedes elegir el camino más fácil:

  - **Estrategia inteligente:** En lugar de calcular $27^2 = 729$ y luego sacarle raíz cúbica, ¡extrae la raíz primero y luego eleva al cuadrado!

  $$(\sqrt[3]{27})^2 = 3^2 = 9$$

  - Además, si el exponente y el índice se pueden simplificar (como en $\sqrt[6]{x^4}$), simplifies la fracción $\frac{4}{6} = \frac{2}{3}$, convirtiéndola en $\sqrt[3]{x^2}$.'
explicacion_formal: "Sean $a \\in \\mathbb{R}^+$, $m \\in \\mathbb{Z}$ y $n \\in \\mathbb{N}$ con $n \\ge 2$. La **Propiedad de la Potencia Radical** establece la equivalencia funcional:\n\n$$\\sqrt[n]{a^m} = (\\sqrt[n]{a})^m = a^{m/n}$$\n\n**Propiedades analíticas:**\n1. **Intercambiabilidad de operadores:** Se puede aplicar la potenciación antes o después de la radicación sin alterar el valor final en $\\mathbb{R}^+$.\n2. **Simplificación por factor común $k$:**\n   $$\\sqrt[n \\cdot k]{a^{m \\cdot k}} = a^{\\frac{m \\cdot k}{n \\cdot k}} = a^{m/n} = \\sqrt[n]{a^m} \\quad (k \\in \\mathbb{N})$$\n3. **Cancelación exacta ($m = n$):** $\\sqrt[n]{a^n} = a$ (con valor absoluto $|a|$ si $n$ es par y $a \\in \\mathbb{R}$)."
definiciones_clave: '- **Potencia subradical**: Potencia $a^m$ sobre la que opera el radical.

  - **Intercambio de orden**: Capacidad de resolver $(\sqrt[n]{a})^m$ para evitar números grandes.

  - **Reducción de orden radical**: Simplificación del índice mediante división por el MCD.'
propiedades_relaciones: '- **Exponente divisible por índice**: $\sqrt[3]{x^9} = x^{9/3} = x^3$.

  - **Reducción a raíz cuadrada**: $\sqrt[4]{a^2} = a^{2/4} = a^{1/2} = \sqrt{a}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de raíz de una potencia](/static/img/nodos/raiz-de-una-potencia-ejemplos.svg)


    Calcule el valor de $\sqrt[3]{27^2}$, evalúe $\sqrt{2^8}$ y simplifique $\sqrt[6]{x^9}$.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt[3]{27^2}$: Intercambiar orden $(\sqrt[3]{27})^2 = 3^2 = 9$.'
  - 'Paso 2: Evaluar $\sqrt{2^8}$: Dividir exponente por índice $2^{8/2} = 2^4 = 16$.'
  - 'Paso 3: Simplificar $\sqrt[6]{x^9}$: Exponente fraccionario $x^{9/6} = x^{3/2} = \sqrt{x^3} = x\sqrt{x}$.'
  - 'Conclusión: Los resultados son $9$, $16$ y $x\sqrt{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma más rápida de calcular $\sqrt[4]{16^3}$?
  choices:
  - text: Calcular primero $(\sqrt[4]{16})^3 = 2^3 = 8$
    is_correct: true
  - text: Calcular $16^3 = 4096$ y luego buscar su raíz cuarta a mano
    is_correct: false
  - text: Multiplicar $16 \times 3 = 48$
    is_correct: false
  - text: 'Dividir $16 : 4 = 4$'
    is_correct: false
  explanation: La alternativa correcta es 'Calcular primero $(\sqrt[4]{16})^3 = 2^3 = 8$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se simplificó $\sqrt[6]{x^9}$?
  choices:
  - text: Dividiendo el índice $6$ y el exponente $9$ por $3$, resultando en $\sqrt{x^3} = x\sqrt{x}$
    is_correct: true
  - text: Restando $9 - 6 = 3$
    is_correct: false
  - text: Multiplicando $6 \times 9$
    is_correct: false
  - text: Eliminando la raíz
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo el índice $6$ y el exponente $9$ por $3$, resultando en $\sqrt{x^3} = x\sqrt{x}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar la raíz como exponente fraccionario $a^{m/n}$.'
- 'Paso 2: Simplificar la fracción $m/n$ dividiendo por el MCD de $m$ y $n$.'
- 'Paso 3: Para el cálculo numérico, evaluar primero la raíz $(\sqrt[n]{a})$ y luego elevar a la potencia resultante $m$.'
errores_correccion: '- **Error 1: Elevar primero a potencias enormes antes de extraer la raíz.** **Cómo corregirlo:** Usar la equivalencia $(\sqrt[n]{a})^m$ para trabajar con números pequeños.

  - **Error 2: Invertir exponente e índice al formar la fracción.** **Cómo corregirlo:** Numerador $=$ potencia ($m$), Denominador $=$ índice ($n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\sqrt[5]{32^2}$?
  alternativas:
  - $4$
  - $8$
  - $64$
  respuesta: $4$
  solucion_pasos:
  - $(\sqrt[5]{32})^2 = 2^2 = 4$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale simplificar $\sqrt[8]{a^4}$?
  alternativas:
  - $\sqrt{a}$
  - $\sqrt[4]{a}$
  - $a^2$
  respuesta: $\sqrt{a}$
  solucion_pasos:
  - $a^{4/8} = a^{1/2} = \sqrt{a}$.
- titulo: ¿Es √(9³) igual a 27?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\sqrt{9})^3 = 3^3 = 27$.
  alternativas:
  - texto: Sí, (√9)³ = 3³ = 27
    es_correcta: true
    retroalimentacion: ¡Correcto! Se extrae la raíz cuadrada y se eleva al cubo.
  - texto: No, es igual a 81
    es_correcta: false
    retroalimentacion: Incorrecto, $3^3 = 27$.
  - texto: No, es igual a 9
    es_correcta: false
    retroalimentacion: Incorrecto, la potencia 3 modifica el valor.
- titulo: ¿Es ∛(x⁶) igual a x²?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^{6/3} = x^2$.
  alternativas:
  - texto: Sí, 6 / 3 = 2 dando x²
    es_correcta: true
    retroalimentacion: ¡Correcto! División exacta de exponentes.
  - texto: No, es igual a x³
    es_correcta: false
    retroalimentacion: 'Incorrecto, $6 : 3 = 2$.'
  - texto: No, es igual a x¹⁸
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes se dividen, no se multiplican.
errores_frecuentes:
- Calcular potencias gigantescas antes de extraer la raíz.
- Invertir la fracción del exponente racional.
- Multiplicar índice por exponente en vez de simplificarlos por división.
- Olvidar que $\sqrt[n]{a^n} = a$ para bases positivas.
- Confundir la simplificación de exponentes con la resta de términos.
afirmaciones_verdaderas:
- La raíz de una potencia permite calcular $(\sqrt[n]{a})^m$ o $\sqrt[n]{a^m}$ indistintamente en $\mathbb{R}^+$.
- El índice y el exponente se pueden simplificar dividiendo ambos por su divisor común.
- Si el exponente es múltiplo del índice, el resultado es una potencia entera exacta.
al_terminar_debes_poder: '![Síntesis de raíz de una potencia](/static/img/nodos/raiz-de-una-potencia-resumen.svg)


  QUÉ: Simplificar, operar y evaluar raíces de potencias mediante exponentes racionales.


  CÓMO: Aplicando la equivalencia $\sqrt[n]{a^m} = (\sqrt[n]{a})^m = a^{m/n}$, reduciendo la fracción $m/n$ por el MCD y extrayendo la raíz antes de elevar para agilizar el cálculo.'
