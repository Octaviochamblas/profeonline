semantic_id: MAT.GEO.RECTA_ECUACIONES.ECUACION_PARAMETRICA
resumen_inicial: 'Reconocimiento de la ecuación paramétrica de la recta en el plano:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La ecuación paramétrica separa la ecuación vectorial en dos ecuaciones
  escalares, una para x y otra para y, ambas dependientes del mismo parámetro t.
explicacion_formal: '![Ecuación paramétrica de la recta](/static/img/geometria/analitica/rectaeq-ecuacion-parametrica.svg)


  ### Definición formal


  A partir de la ecuación vectorial $(x,y)=(x_0,y_0)+t(d_1,d_2)$, se separan las coordenadas:
  $x=x_0+td_1$ y $y=y_0+td_2$, formando el sistema paramétrico.


  ### Desarrollo didáctico


  Para la recta con punto $(0,1)$ y vector director $(4,3)$: $x=4t$, $y=1+3t$. Al
  sustituir $t=1$, se obtiene $x=4$, $y=4$, coincidiendo con el punto $(4,4)$.'
