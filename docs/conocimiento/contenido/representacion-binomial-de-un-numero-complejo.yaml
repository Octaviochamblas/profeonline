resumen_inicial: 'La representación binomial de un número complejo $z$ expresa la
  cantidad como la suma algebraica de dos términos: $z = a + bi$.'
explicacion_simple: La forma binomial es la manera clásica de escribir un número complejo
  usando un signo de suma o resta entre su parte real y su parte imaginaria, como
  si fuera un binomio algebraico con la letra $i$.
explicacion_formal: 'La **Forma Binomial** o rectangular de $z \in \mathbb{C}$ se
  escribe mediante la combinación lineal:


  $$z = a + bi \quad (a, b \in \mathbb{R})$$


  **Operaciones algebraicas directas:**

  - Adición/Sustracción: Se opera como binomios algebraicos agrupando términos semejantes.

  - $(a + bi) + (c + di) = (a + c) + (b + d)i$.'
definiciones_clave: '- **Forma binomial**: Expresión $z = a + bi$ constituida por
  dos sumandos.'
propiedades_relaciones: '- **Agrupación de binomio**: Separa el término libre $a$
  del término con unidad $bi$.'
ejemplo_guiado:
  enunciado: Exprese en forma binomial la suma de $z_1 = 3 + 4i$ y $z_2 = 2 - 6i$.
  pasos:
  - 'Paso 1: Sumar las partes reales: $3 + 2 = 5$.'
  - 'Paso 2: Sumar las partes imaginarias: $4 + (-6) = -2$.'
  - 'Paso 3: Unir en forma binomial: $5 + (-2)i = 5 - 2i$.'
  - 'Conclusión: $z_1 + z_2 = 5 - 2i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se estructuran los dos términos en la representación binomial de
    un número complejo?
  choices:
  - text: Como la suma algebraica de un término real y un término imaginario (a +
      bi)
    is_correct: true
  - text: Como la división entre a y b
    is_correct: false
  - text: Como una multiplicación triple
    is_correct: false
  - text: Como una raíz cuadrada
    is_correct: false
  explanation: La alternativa correcta es 'Como la suma algebraica de un término real
    y un término imaginario (a + bi)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (3 + 4i) + (2 - 6i), ¿cuál fue la forma binomial
    resultante?
  choices:
  - text: 5 - 2i
    is_correct: true
  - text: 5 + 10i
    is_correct: false
  - text: 1 - 2i
    is_correct: false
  - text: 3 - 2i
    is_correct: false
  explanation: La alternativa correcta es '5 - 2i'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de representar y operar números complejos
  en su forma binomial $z = a + bi$.
semantic_id: MAT.NUM.COMPLEJOS.FORMA_BINOMIAL
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.FORMA_BINOMIAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
