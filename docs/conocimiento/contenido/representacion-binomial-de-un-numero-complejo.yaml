semantic_id: MAT.NUM.COMPLEJOS.FORMA_BINOMIAL
resumen_inicial: 'La representación binomial expresa a todo número complejo como la suma algebraica de dos términos: un término real y un término imaginario en la forma $z = a + bi$.'
explicacion_simple: |
  La forma binomial es la manera más común de escribir un número complejo. Se llama "binomial" porque consta de dos partes (como un binomio en álgebra): el primer término es un número real solo ($a$) y el segundo término es un número acompañado por la letra $i$ ($bi$). Por ejemplo, $z = 5 - 3i$ está escrito en forma binomial, donde $5$ es el término real y $-3i$ es el término imaginario.
explicacion_formal: |
  ### Definición formal
  La **forma binomial (o canónica)** de un número complejo $z \in \mathbb{C}$ es la expresión algebraica estándar de dos sumando:
  $$z = a + bi$$
  donde:
  - **$a \in \mathbb{R}$**: Coeficiente del término real.
  - **$b \in \mathbb{R}$**: Coeficiente del término imaginario.
  - **$i$**: Unidad imaginaria ($i = \sqrt{-1}$).

  ### Operaciones fundamentales en forma binomial
  Dada la representación $z_1 = a + bi$ y $z_2 = c + di$:
  1. **Suma/Resta**: Se operan por separado las partes reales y las partes imaginarias:
     $$z_1 \pm z_2 = (a \pm c) + (b \pm d)i$$
  2. **Multiplicación**: Se aplica la propiedad distributiva teniendo en cuenta que $i^2 = -1$:
     $$z_1 \cdot z_2 = (ac - bd) + (ad + bc)i$$

  ### Síntesis didáctica
  - Notación estándar de trabajo: $z = a + bi$.
  - Facilidad operativa: Permite sumar y multiplicar complejos como si fueran polinomios de grado 1 en la variable $i$.
definiciones_clave: |
  - **Forma binomial $z = a + bi$**: Estructura canónica compuesta por la adición de un término real y un término imaginario puro.
  - **Suma por componentes**: Regla algebraica que combina reales con reales e imaginarios con imaginarios.
  - **Reucción de términos semejantes**: Agrupación de coeficientes escalares multiplicados por la unidad $i$.
propiedades_relaciones: |
  - **Conversión a par ordenado**: La forma binomial $a + bi$ equivale directamente a la forma cartesiana $(a, b)$.
  - **Álgebra polinomial**: Hereda todas las propiedades conmutativas, asociativas y distributivas del álgebra de polinomios.
ejemplo_guiado:
  enunciado: 'Escribe en forma binomial el número complejo resultante de realizar la suma $Z = (4 - 7i) + (-2 + 5i)$.'
  pasos:
    - 'Paso 1: Agrupamos los términos reales por un lado y los términos imaginarios por otro: $Z = (4 + (-2)) + (-7i + 5i)$.'
    - 'Paso 2: Sumamos algebraicamente los coeficientes de los términos reales: $4 - 2 = 2$.'
    - 'Paso 3: Sumamos algebraicamente los coeficientes de los términos imaginarios: $-7 + 5 = -2$, conservando la unidad $i$: $-2i$.'
    - 'Paso 4: Unificamos ambas partes para obtener la forma binomial final: $Z = 2 - 2i$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué manera se efectúa la adición de dos números complejos $z_1 = a + bi$ y $z_2 = c + di$ en forma binomial?'
    choices:
      - {text: '$(a + c) + (b + d)i$, sumando la parte real con la real y la parte imaginaria con la imaginaria', is_correct: true}
      - {text: '$(a + b) + (c + d)i$, sumando los coeficientes de cada complejo entre sí', is_correct: false}
      - {text: '$(a \cdot c) + (b \cdot d)i$, multiplicando las componentes', is_correct: false}
      - {text: '$(a + d) + (b + c)i$, cruzando las partes reales e imaginarias', is_correct: false}
    explanation: 'La alternativa correcta es ''$(a + c) + (b + d)i$, sumando la parte real con la real y la parte imaginaria con la imaginaria''. La suma en forma binomial opera término a término.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma binomial simplificada del producto de $(2 + i) \cdot (3 - i)$?'
    choices:
      - {text: '$7 + i$, aplicando la propiedad distributiva y la sustitución $i^2 = -1$', is_correct: true}
      - {text: '$6 - i$, multiplicando solo los primeros y últimos términos', is_correct: false}
      - {text: '$5 + 5i$, sumando los términos', is_correct: false}
      - {text: '$6 + i^2$, omitiendo los productos cruzados', is_correct: false}
    explanation: 'La alternativa correcta es ''$7 + i$, aplicando la propiedad distributiva y la sustitución $i^2 = -1$''. $(2)(3) + (2)(-i) + (i)(3) + (i)(-i) = 6 - 2i + 3i - i^2 = 6 + i - (-1) = 7 + i$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las partes reales $a, c$ y las partes imaginarias $b, d$ de los números complejos.'
  - 'Paso 2: Operar las partes reales para obtener el primer término del binomio.'
  - 'Paso 3: Operar las partes imaginarias agrupando los coeficientes de la unidad $i$.'
  - 'Paso 4: Expresar el resultado final en el orden canónico $a + bi$.'
errores_correccion: |
  - **Error 1:** Mezclar sumando la parte real con la parte imaginaria en un solo término (ej: reducir $3 + 4i$ a $7i$). **Cómo corregirlo:** La parte real y la imaginaria son **inconmensurables directamente en la suma**; la forma binomial $3 + 4i$ es una expresión irreducible en dos términos.
  - **Error 2:** Olvidar aplicar $i^2 = -1$ al multiplicar en forma binomial (ej: $(1 + i)(2 + i) = 2 + 3i + i^2 = 2 + 3i$). **Cómo corregirlo:** El término $i^2$ **debe reemplazarse por $-1$**, convirtiéndose en parte real: $2 + 3i + (-1) = 1 + 3i$.
ejemplos:
  - titulo: 'Suma de expresiones binomiales'
    enunciado: '¿La suma $(5 + 2i) + (3 - 6i)$ equivale a $8 - 4i$?'
    alternativas:
      - 'Sí, pues $(5+3) + (2-6)i = 8 - 4i$'
      - 'No, es igual a 4i'
      - 'No, es igual a 8 + 4i'
    respuesta: 'Sí, pues $(5+3) + (2-6)i = 8 - 4i$'
    solucion_pasos:
      - '1. Reales: $5 + 3 = 8$.'
      - '2. Imaginarios: $2 - 6 = -4 \implies 8 - 4i$.'
  - titulo: 'Resta de expresiones binomiales'
    enunciado: '¿La resta $(6 - 3i) - (2 + 4i)$ resulta en $4 - 7i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(6 - 2) + (-3 - 4)i = 4 - 7i$.'
  - titulo: 'Multiplicación en forma binomial'
    enunciado: '¿El producto $(3i) \cdot (2 - 5i)$ es igual a $15 + 6i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $6i - 15i^2 = 6i - 15(-1) = 15 + 6i$.'
  - titulo: 'Forma canónica de imaginario puro'
    enunciado: '¿Un número imaginario puro $-8i$ está escrito en forma binomial como $0 - 8i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con parte real $a = 0$.'
errores_frecuentes:
  - 'Sumar el término escalar real con el coeficiente imaginario reduciéndolos a un solo término $ab \cdot i$.'
  - 'El término cuadrático $i^2$ se conserva en el resultado final del producto sin sustituirse por $-1$.'
  - 'Restar binomios complejos sin cambiar los signos de todo el segundo paréntesis.'
  - 'Escribir la parte imaginaria delante de la parte real invirtiendo el orden canónico $a + bi$.'
  - 'Considerar que la presencia del signo menos en $a - bi$ anula el carácter binomial.'
afirmaciones_verdaderas:
  - 'La representación binomial expresa a un número complejo como la suma canónica $z = a + bi$, donde $a, b \in \mathbb{R}$.'
  - 'La adición y sustracción de números complejos en forma binomial se realiza sumando o restando por separado sus componentes reales e imaginarias.'
al_terminar_debes_poder: 'Representar y operar números complejos en forma binomial $z = a + bi$ aplicando la suma y multiplicación de componentes.'
