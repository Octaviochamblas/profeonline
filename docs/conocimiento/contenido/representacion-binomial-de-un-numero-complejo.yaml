semantic_id: MAT.NUM.COMPLEJOS.FORMA_BINOMIAL
resumen_inicial: La representación binomial de un número complejo es la suma algebraica
  $z = a + bi$, donde $a$ es la parte real y $bi$ el término imaginario.
explicacion_simple: 'Se le llama **forma binomial** porque está escrita como un binomio
  (dos términos conectados por un signo $+$ o $-$):

  $$z = 6 - 8i$$

  Primer término (real): $6$.

  Segundo término (imaginario): $-8i$.'
explicacion_formal: La expresión $z = a + bi$ con $a, b \in \mathbb{R}$ se denomina
  forma binomial o canónica de $z$. Permite operar números complejos aplicando las
  reglas habituales del álgebra de polinomios considerando $i^2 = -1$.
definiciones_clave: '- **Forma binomial / canónica**: Expresión $z = a + bi$.'
propiedades_relaciones: '- **Igualdad de complejos**: $a + bi = c + di \iff a = c$
  y $b = d$.'
ejemplo_guiado:
  enunciado: Dados $z_1 = 3 + 2i$ y $z_2 = 1 - 5i$, calcula la suma $z_1 + z_2$ en
    forma binomial.
  pasos:
  - 'Sumar las partes reales entre sí: $3 + 1 = 4$.'
  - 'Sumar las partes imaginarias entre sí: $2 + (-5) = -3$.'
  - 'Escribir la suma resultante en forma binomial: $4 - 3i$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $z = -4 + 7i$, ¿cuál es su representación en forma binomial?
  choices:
  - text: -4 + 7i
    is_correct: true
  - text: (-4, 7)
    is_correct: false
  - text: 3i
    is_correct: false
  - text: 7 - 4i
    is_correct: false
  explanation: 'La correcta es: -4 + 7i. Esa es la escritura binomial explícita.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $(2 + 3i) + (4 - i)$ en forma binomial.
  choices:
  - text: 6 + 2i
    is_correct: true
  - text: 6 + 4i
    is_correct: false
  - text: 8 + 2i
    is_correct: false
  - text: 6 - 2i
    is_correct: false
  explanation: 'La correcta es: 6 + 2i. $(2+4) + (3-1)i = 6 + 2i$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la componente real $a$.'
- 'Paso 2: Acompañar de la componente imaginaria $b$ multiplicada por $i$.'
- 'Paso 3: Unir ambas componentes con su correspondiente signo ($a + bi$ o $a - bi$).'
errores_correccion: No sumes la parte real con la imaginaria para dar un solo término.
  $3 + 4i \neq 7i$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Escribe en forma binomial el complejo de parte real -1 y parte imaginaria
    5.
  alternativas:
  - -1 + 5i
  - 5 - i
  - 4i
  respuesta: -1 + 5i
  solucion_pasos:
  - $z = -1 + 5i$.
errores_frecuentes:
- Sumar la parte real e imaginaria como si fuesen términos semejantes.
afirmaciones_verdaderas:
- En la forma binomial $a + bi$, $a$ y $b$ son números reales.
al_terminar_debes_poder: Expresar y operar números complejos en su forma binomial.
fuente: Texto escolar MINEDUC.
estado: publicado
