semantic_id: MAT.NUM.NUMEROS_COMPLEJOS.FORMA_BINOMIAL
resumen_inicial: La representación binomial o binómica de un número complejo es la suma algebraica $z = a + bi$, donde $a$ es la parte real y $bi$ es el término imaginario.
explicacion_simple: '![Representación binomial de un número complejo](/static/img/nodos/representacion-binomial-de-un-numero-complejo-intro.svg)


  La forma más natural de escribir un número complejo es como un **binomio** algebraico:

  - Se escribe $z = a + bi$ (por ejemplo: $3 + 2i$, $-5 - 7i$, $4 - i$).

  - Permite sumar y restar números complejos de manera idéntica al álgebra de polinomios: se suman términos semejantes reales con reales e imaginarios con imaginarios.

  - Ejemplo: $(2 + 3i) + (5 - 8i) = (2 + 5) + (3 - 8)i = 7 - 5i$.'
explicacion_formal: 'La **forma binómica o binomial** de un número complejo $z \in \mathbb{C}$ corresponde a su descomposición canónica en la base canónica $\{1, i\}$ del espacio vectorial real $\mathbb{R}^2$:


  $$z = a + bi \quad (a, b \in \mathbb{R})$$


  **Operaciones Elementales en Forma Binomial:**

  1. **Adición y Sustracción:**

  $$(a + bi) \pm (c + di) = (a \pm c) + (b \pm d)i$$

  2. **Multiplicación:**

  $$(a + bi)(c + di) = (ac - bd) + (ad + bc)i \quad (\text{usando } i^2 = -1)$$'
definiciones_clave: '- **Forma binómica ($a + bi$)**: Notación estándar en suma de términos reales e imaginarios.

  - **Base canónica $\{1, i\}$**: Generadores lineales del espacio de los números complejos sobre $\mathbb{R}$.

  - **Términos semejantes**: Agrupación separada de partes reales e imaginarias.'
propiedades_relaciones: '- **Isomorfismo con $\mathbb{R}^2$**: Correspondencia biyectiva $a + bi \longleftrightarrow (a, b)$.

  - **Distributividad**: La multiplicación cumple la propiedad distributiva estándar aplicando $i^2 = -1$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de forma binomial](/static/img/nodos/representacion-binomial-de-un-numero-complejo-ejemplos.svg)


    Exprese el par ordenado $(4, -5)$ en forma binómica y calcule la suma $(2 + 3i) + (5 - 8i)$.'
  pasos:
  - 'Paso 1: Para $(4, -5)$: El primer término es la parte real $a = 4$ y el segundo es $b = -5 \implies 4 - 5i$.'
  - 'Paso 2: Para la suma: Agrupar partes reales: $2 + 5 = 7$.'
  - 'Paso 3: Agrupar partes imaginarias: $3i + (-8i) = -5i$.'
  - 'Conclusión: La suma en forma binomial es $7 - 5i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma binomial equivalente al par ordenado $(-8, 3)$?
  choices:
  - text: $-8 + 3i$
    is_correct: true
  - text: $3 - 8i$
    is_correct: false
  - text: $-8 - 3i$
    is_correct: false
  - text: $8 + 3i$
    is_correct: false
  explanation: La alternativa correcta es '$-8 + 3i$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado de sumar $(2 + 3i) + (5 - 8i)$?
  choices:
  - text: $7 - 5i$
    is_correct: true
  - text: $7 + 11i$
    is_correct: false
  - text: $2i$
    is_correct: false
  - text: $7 - 5$
    is_correct: false
  explanation: La alternativa correcta es '$7 - 5i$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las componentes real $a$ e imaginaria $b$.'
- 'Paso 2: Escribir la suma formal $a + bi$ respetando los signos de cada coeficiente.'
- 'Paso 3: Para operar, agrupar y reducir términos reales entre sí y términos imaginarios entre sí.'
errores_correccion: '- **Error 1: Olvidar la letra ''i'' en el término imaginario (escribir $4 - 5$ en vez de $4 - 5i$).** **Cómo corregirlo:** La forma binomial exige explícitamente la presencia de la unidad imaginaria $i$ en el segundo término.

  - **Error 2: Multiplicar incorrectamente los signos.** **Cómo corregirlo:** Si $b = -3$, el binomio se escribe $a - 3i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se escribe en forma binomial el complejo con $\operatorname{Re}(z) = 0$ e $\operatorname{Im}(z) = -9$?
  alternativas:
  - $-9i$
  - $0 - 9$
  - $9i$
  respuesta: $-9i$
  solucion_pasos:
  - $z = 0 + (-9)i = -9i$.
- titulo: Ejemplo 2
  enunciado: 'Calcule la resta $(6 + 4i) - (2 - 5i)$ en forma binomial:'
  alternativas:
  - $4 + 9i$
  - $4 - i$
  - $8 - i$
  respuesta: $4 + 9i$
  solucion_pasos:
  - $(6 - 2) + (4 - (-5))i = 4 + 9i$.
- titulo: ¿Equivale (a + bi) a un binomio algebraico con i² = -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, se opera con las reglas ordinarias de polinomios sustituyendo $i^2 = -1$.
  alternativas:
  - texto: Sí, opera con álgebra de binomios y sustitución i² = -1
    es_correcta: true
    retroalimentacion: ¡Correcto! Es la base del álgebra compleja.
  - texto: No, no se pueden sumar números complejos
    es_correcta: false
    retroalimentacion: Incorrecto, la suma y resta están perfectamente definidas.
  - texto: No, los binomios solo usan variables reales
    es_correcta: false
    retroalimentacion: Incorrecto, la forma binomial es la notación algebraica estándar.
- titulo: ¿Es (3 + 2i) + (3 - 2i) = 6 un número real puro?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3 + 3) + (2 - 2)i = 6 + 0i = 6$.
  alternativas:
  - texto: Sí, la suma de complejos conjugados es un número real
    es_correcta: true
    retroalimentacion: ¡Correcto! Las partes imaginarias opuestas se anulan.
  - texto: No, es 6 + 4i
    es_correcta: false
    retroalimentacion: Incorrecto, $2i + (-2i) = 0$.
  - texto: No, el resultado siempre debe tener i
    es_correcta: false
    retroalimentacion: Incorrecto, los reales son complejos con parte imaginaria nula.
errores_frecuentes:
- Omitir el factor $i$ en la expresión.
- Sumar coeficientes reales e imaginarios sin distinción.
- Olvidar distribuir los signos negativos en sustracciones de binomios.
- Confundir la forma binómica con la forma cartesiana.
afirmaciones_verdaderas:
- La forma binómica expresa a todo número complejo como $z = a + bi$.
- Permite efectuar sumas y restas agrupando directamente términos semejantes.
- La multiplicación binómica aplica la distributividad y la identidad $i^2 = -1$.
al_terminar_debes_poder: '![Síntesis de forma binomial](/static/img/nodos/representacion-binomial-de-un-numero-complejo-resumen.svg)


  QUÉ: Expresar y operar números complejos en su forma binomial canónica $z = a + bi$.


  CÓMO: Identificando los coeficientes $a, b \in \mathbb{R}$, aplicando operaciones algebraicas de suma, resta y producto de binomios, y sustituyendo $i^2 = -1$.'
