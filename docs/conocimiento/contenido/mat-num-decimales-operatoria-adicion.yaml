semantic_id: MAT.NUM.DECIMALES_OPERATORIA.ADICION
resumen_inicial: La adición de números decimales exige disponer los sumandos verticalmente
  de modo que las comas decimales queden perfectamente alineadas en la misma columna.
explicacion_simple: Para sumar números decimales de forma directa, debemos escribir
  los números uno debajo de otro de tal manera que todas las comas queden exactamente
  en la misma línea vertical. Así nos aseguramos de estar sumando unidades con unidades,
  décimas con décimas y centésimas con centésimas.
explicacion_formal: 'Dada la suma de decimales $d_1 = \sum a_i \cdot 10^i$ y $d_2
  = \sum b_i \cdot 10^i$ en $\mathbb{Q}$, la **Adición Posicional Decimal** se efectúa
  mediante:


  $$d_1 + d_2 = \sum_{i=-k}^{m} (a_i + b_i) \cdot 10^i$$


  **Desglose de la fórmula:**

  - Alineación vertical: Garantiza que el coeficiente de $10^i$ del primer número
  coincida de forma posicional con el coeficiente de $10^i$ del segundo.

  - Relleno de ceros: Las posiciones sin dígitos a la derecha de la coma se completan
  con ceros a la derecha ($a_i = 0$ para $i < -k$).


  > **Complemento didáctico:** La coma en el resultado final se ubica directamente
  en la misma posición de la columna vertical de las comas de los sumandos.'
definiciones_clave: '- **Alineación de coma decimal**: Disposición en columna donde
  las comas de todos los sumandos coinciden verticalmente.'
propiedades_relaciones: '- **Preservación del valor de posición**: Asegura la adición
  estricta entre dígitos del mismo valor posicional.'
ejemplo_guiado:
  enunciado: Calcule la suma decimal $12,45 + 3,8$.
  pasos:
  - 'Paso 1: Alinear los números verticalmente por su coma decimal.'
  - 'Paso 2: Rellar con cero a la derecha para igualar decimales: $3,80$.'
  - "Paso 3: Disponer la suma vertical:\n  12,45\n+  3,80\n------\n  16,25"
  - 'Conclusión: $12,45 + 3,8 = 16,25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla fundamental para colocar los números al sumar decimales
    verticalmente?
  choices:
  - text: Alinear de forma exacta la coma decimal de todos los sumandos en la misma
      columna
    is_correct: true
  - text: Alinear todos los números a la derecha sin importar la coma
    is_correct: false
  - text: Eliminar todas las comas antes de sumar
    is_correct: false
  - text: Colocar los números de mayor a menor según la cantidad de dígitos
    is_correct: false
  explanation: La alternativa correcta es 'Alinear de forma exacta la coma decimal
    de todos los sumandos en la misma columna'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 12,45 + 3,8, ¿cuál fue el resultado de la suma
    alineada?
  choices:
  - text: 16,25
    is_correct: true
  - text: 15,53
    is_correct: false
  - text: 16,30
    is_correct: false
  - text: 12,83
    is_correct: false
  explanation: La alternativa correcta es '16,25'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los sumandos verticalmente haciendo coincidir las comas en una
  misma columna.'
- 'Paso 2: Completar con ceros a la derecha los lugares decimales faltantes.'
- 'Paso 3: Sumar cifra por cifra de derecha a izquierda y situar la coma en el resultado
  respetando la columna.'
errores_correccion: '- **Error 1: Alinear los números a la derecha como si fueran
  enteros (sumar $12,45 + 3,8$ como si fuera $1245 + 38 = 1283$).** **Cómo corregirlo:**
  La referencia de alineación es la COMA DECIMAL, no la última cifra.


  - **Error 2: Olvidar ubicar la coma en la suma resultante.** **Cómo corregirlo:**
  La coma desciende verticalmente a la misma posición en la línea del resultado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 4,56 + 2,1.
  alternativas:
  - 6,66
  - 6,57
  - 4,77
  respuesta: 6,66
  solucion_pasos:
  - $4,56 + 2,10 = 6,66$.
- titulo: Ejemplo 2
  enunciado: Calcule 0,78 + 15,2.
  alternativas:
  - 15,98
  - 9,3
  - 15,86
  respuesta: 15,98
  solucion_pasos:
  - $0,78 + 15,20 = 15,98$.
- titulo: ¿Se recomienda agregar ceros a la derecha para igualar la cantidad de dígitos
    decimales?
  respuesta: Sí
  solucion_pasos:
  - Sí, facilita el cálculo por columna posicional.
- titulo: ¿Es 3,5 + 1,25 igual a 4,75?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3,50 + 1,25 = 4,75$.
errores_frecuentes:
- Alinear los números decimales justificando a la derecha en lugar de guiar la alineación
  por la coma.
- Sumar la parte entera con las décimas al no alinear adecuadamente las columnas.
- Completar los espacios decimales vacíos agregando ceros a la izquierda de la parte
  entera.
- Mover la coma del resultado dos posiciones a la izquierda tras realizar la suma.
- La adición de dos decimales finitos positivos siempre produce un número entero.
afirmaciones_verdaderas:
- Para sumar números decimales es obligatorio alinear las comas decimales en una misma
  columna vertical.
- Agregar ceros a la derecha de la parte decimal no altera el valor del número y facilita
  la alineación.
al_terminar_debes_poder: Al terminar serás capaz de sumar números decimales mediante
  la alineación vertical estricta de sus comas decimales y el relleno de ceros a la
  derecha.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
