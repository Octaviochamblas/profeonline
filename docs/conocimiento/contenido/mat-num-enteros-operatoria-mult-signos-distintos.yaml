semantic_id: MAT.NUM.ENTEROS_OPERATORIA.MULT_SIGNOS_DISTINTOS
resumen_inicial: 'La multiplicación de dos enteros de distinto signo resulta siempre
  en un producto negativo: $(+) \cdot (-) = -$ y $(-) \cdot (+) = -$.'
explicacion_simple: Cuando multiplicamos un número positivo por uno negativo (o viceversa),
  el resultado final es siempre un número negativo. Esto se debe a que estamos repitiendo
  una cantidad negativa varias veces (como acumular varias deudas) o invirtiendo el
  sentido de un número positivo.
explicacion_formal: 'Para dos enteros $a, b \in \mathbb{Z} \setminus \{0\}$ tales
  que $\operatorname{sgn}(a) \neq \operatorname{sgn}(b)$, el **Producto de Signos
  Distintos** se define como:


  $$a \cdot b = -\left( |a| \cdot |b| \right) < 0$$


  **Desglose de la fórmula:**

  - $|a| \cdot |b|$: Producto de las magnitudes absolutas.

  - $-(\dots)$: Signo negativo resultante garantizado por la diferencia de polaridad.


  > **Complemento didáctico:** $5 \cdot (-4) = -20$, pues sumar 5 veces la deuda $-4$
  da una deuda total de $-20$.'
definiciones_clave: '- **Regla de signos distintos**: Norma donde $(+) \cdot (-) =
  -$ y $(-) \cdot (+) = -$.'
propiedades_relaciones: '- **Potencias impares**: Una base negativa elevada a un exponente
  impar resulta negativa por esta regla ($(-x)^3 = -x^3$).'
ejemplo_guiado:
  enunciado: Calcule el producto de enteros de distinto signo $8 \cdot (-5)$.
  pasos:
  - 'Paso 1: Identificar los signos de ambos factores: $8$ es positivo y $-5$ es negativo.'
  - 'Paso 2: Aplicar la regla de signos distintos: $(+) \cdot (-) = -$.'
  - 'Paso 3: Multiplicar las magnitudes: $8 \cdot 5 = 40$.'
  - 'Conclusión: $8 \cdot (-5) = -40$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la multiplicación (-7) · 6?
  choices:
  - text: '-42'
    is_correct: true
  - text: '42'
    is_correct: false
  - text: '-1'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '-42', ya que la multiplicación de signos
    distintos da resultado negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado 8 · (-5), ¿cuál es el resultado final?
  choices:
  - text: '-40'
    is_correct: true
  - text: '40'
    is_correct: false
  - text: '-13'
    is_correct: false
  - text: '3'
    is_correct: false
  explanation: La alternativa correcta es '-40'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los valores absolutos de los factores.'
- 'Paso 2: Comprobar que los factores tengan signos opuestos (uno positivo y otro
  negativo).'
- 'Paso 3: Asignar un signo negativo ($-$) al producto final.'
errores_correccion: '- **Error 1: Creer que el signo del producto lo impone el número
  de mayor valor absoluto.** **Cómo corregirlo:** En la multiplicación de distinto
  signo el resultado es SIEMPRE negativo, sin importar qué número sea mayor en módulo.


  - **Error 2: Olvidar el signo negativo al multiplicar una variable por un entero
  negativo.** **Cómo corregirlo:** $(-3) \cdot x = -3x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-12) \cdot 3$.
  alternativas:
  - '-36'
  - '36'
  - '-9'
  respuesta: '-36'
  solucion_pasos:
  - $(-) \cdot (+) = -$. $12 \cdot 3 = 36 \implies -36$.
- titulo: Ejemplo 2
  enunciado: Una empresa pierde $4.000$ dólares cada mes durante 5 meses. ¿Cuál es
    la variación total?
  alternativas:
  - -20.000 dólares
  - 20.000 dólares
  - -9.000 dólares
  respuesta: -20.000 dólares
  solucion_pasos:
  - $5 \cdot (-4000) = -20000$ dólares.
- titulo: ¿La multiplicación de un entero positivo por uno negativo resulta siempre
    en un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(+) \cdot (-) = -$.
- titulo: ¿El producto de (-2) · 9 es igual a +18?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-2) \cdot 9 = -18$.
errores_frecuentes:
- La multiplicación de dos enteros de distinto signo da como resultado un número positivo
  si el mayor es positivo.
- El producto de un entero negativo por un entero positivo da siempre como resultado
  el número cero.
- Multiplicar un entero positivo por uno negativo depende del orden en que se coloquen
  los factores.
- La regla de signos distintos exige sumar los valores absolutos de los factores.
- Multiplicar un entero negativo por 1 invierte su signo a positivo.
afirmaciones_verdaderas:
- La multiplicación de dos enteros de distinto signo resulta siempre en un número
  negativo.
- Tanto $(+) \cdot (-)$ como $(-) \cdot (+)$ producen un producto de signo negativo.
al_terminar_debes_poder: Al terminar serás capaz de calcular la multiplicación de
  dos enteros de distinto signo, aplicando la regla de signos distintos para obtener
  un producto estrictamente negativo.
