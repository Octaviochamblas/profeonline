semantic_id: MAT.NUM.ENTEROS_OPERATORIA.MULT_SIGNOS_DISTINTOS
resumen_inicial: "Al multiplicar dos enteros de distinto signo, el resultado siempre es negativo: $(+)\\cdot(-)=(-)$."
explicacion_simple: |
  Si pagas $5 cada mes ($-5$) durante 3 meses ($+3$), habrás perdido $15 en total: $3 \cdot
  (-5) = -15$. Multiplicar signos distintos es como acumular deudas o pérdidas: el
  resultado siempre es negativo.
explicacion_formal: |
  $(+a) \cdot (-b) = -(a \cdot b)$ y $(-a) \cdot (+b) = -(a \cdot b)$. Puede interpretarse
  como suma repetida de un número negativo: $3 \cdot (-5) = (-5)+(-5)+(-5) = -15$.
definiciones_clave: |
  **Signos distintos en la multiplicación**: un factor positivo y otro negativo, cuyo
  producto siempre es negativo.
propiedades_relaciones: |
  Multiplicar cualquier entero por $-1$ produce su opuesto: $(-1) \cdot a = -a$, sin
  importar el signo original de $a$.
ejemplo_guiado:
  enunciado: "Calcula $(-13) \\cdot (+5)$."
  pasos:
    - "Los factores tienen signos distintos: $-13$ y $+5$."
    - "Se multiplican los valores absolutos: $13 \\cdot 5 = 65$."
    - "El resultado es negativo: $-65$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué signo tiene siempre el producto de un entero positivo por uno negativo?"
    choices:
      - {text: "Positivo", is_correct: false}
      - {text: "Negativo", is_correct: true}
      - {text: "Depende de cuál sea mayor", is_correct: false}
      - {text: "Siempre cero", is_correct: false}
    explanation: "La correcta es Negativo: multiplicar signos distintos siempre da un resultado negativo, sin importar la magnitud."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-6) \\cdot (+9)$?"
    choices:
      - {text: "$-54$", is_correct: true}
      - {text: "$54$", is_correct: false}
      - {text: "$-15$", is_correct: false}
      - {text: "$15$", is_correct: false}
    explanation: "La correcta es $-54$: se multiplican los valores absolutos $6\\cdot9=54$ y el resultado es negativo por tener signos distintos."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los dos factores y verificar que tienen signos diferentes (uno es positivo y el otro es negativo)."
  - "Paso 2: Calcular el valor absoluto de cada factor."
  - "Paso 3: Multiplicar los valores absolutos obtenidos."
  - "Paso 4: Escribir el resultado final precedido por el signo negativo ($-$)."
errores_correccion: |
  Un error frecuente es decidir el signo del resultado según cuál factor tiene mayor valor
  absoluto (eso solo aplica en la suma, no en la multiplicación). Otro error es sumar los
  factores en vez de multiplicarlos.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: 'Calcular el producto: $(+9) \cdot (-4)$.'
    alternativas:
      - "$-36$"
      - "$36$"
      - "$-5$"
    respuesta: "$-36$"
    solucion_pasos:
      - "Identificar los signos: el primer factor es positivo ($+9$) y el segundo es negativo ($-4$)."
      - "Calcular valores absolutos: $|+9| = 9$ y $|-4| = 4$."
      - 'Multiplicar los valores absolutos: $9 \cdot 4 = 36$.'
      - "Dado que tienen signos distintos, colocamos el signo menos: $-36$."
  - titulo: "Ejemplo 2"
    enunciado: 'Calcular el resultado de $(-15) \cdot (+3)$.'
    alternativas:
      - "$-45$"
      - "$45$"
      - "$-12$"
    respuesta: "$-45$"
    solucion_pasos:
      - "Identificar los signos: los factores tienen signos opuestos."
      - "Calcular valores absolutos: $|-15| = 15$ y $|+3| = 3$."
      - 'Multiplicar los valores absolutos: $15 \cdot 3 = 45$.'
      - "El resultado final es negativo: $-45$."
  - titulo: "¿El producto de un número entero negativo por uno positivo puede dar un número positivo?"
    respuesta: "No"
    solucion_pasos:
      - "Por la regla de los signos, el producto de dos números con distinto signo siempre es negativo."
      - "No existe ninguna combinación de números distintos de cero con signos contrarios cuyo producto sea positivo."
      - "Si uno de los números fuera cero, el producto sería cero, que tampoco es positivo."
  - titulo: '¿La expresión $(-1) \cdot a$ da como resultado el opuesto de $a$ para cualquier entero $a$?'
    respuesta: "Sí"
    solucion_pasos:
      - 'Si multiplicamos $(-1) \cdot a$ por un entero positivo $a$, el resultado es $-a$ (el opuesto de $a$).'
      - 'Si multiplicamos $(-1) \cdot a$ por un entero negativo $a$ (digamos $a = -x$ con $x > 0$), el resultado es $+x$ (el opuesto de $-x$).'
      - "Si $a = 0$, el resultado es $0$, que es el opuesto de $0$."
      - "Por lo tanto, multiplicar por $-1$ siempre equivale a calcular el opuesto del número."
errores_frecuentes:
  - 'Decidir el signo del producto según el número con mayor valor absoluto (ej: creer que $(-10) \cdot (+2) = -20$ porque $10$ es mayor, pero que $(-2) \cdot (+10) = +20$ lo cual es un error).'
  - 'Sumar los números en lugar de multiplicarlos (ej: decir que $(-5) \cdot (+3) = -2$ en vez de $-15$).'
  - "Aplicar la regla de signos de la adición, asumiendo que el resultado puede ser positivo si el número positivo es más grande."
  - "Olvidar escribir el signo negativo en el resultado."
  - "Creer que la multiplicación por un número negativo siempre disminuye el valor absoluto del número original."
afirmaciones_verdaderas:
  - "El producto de un número positivo y uno negativo siempre es negativo."
  - "5·(-3) da como resultado un número negativo."
al_terminar_debes_poder: |
  Multiplicar dos enteros de distinto signo aplicando correctamente la regla de que el
  resultado siempre es negativo.
fuente: "Enteros"
estado: publicado
