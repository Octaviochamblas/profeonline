semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MONOTONIA
resumen_inicial: La determinación de la monotonía clasifica la variación estricta de la función exponencial comparando su base $b$ con el valor crítico $1$.
explicacion_simple: |
  La **monotonía** es la propiedad que nos dice si una función **SIEMPRE SUBE** (creciente) o **SIEMPRE BAJA** (decreciente) sin cambiar de rumbo:

  - Para la función exponencial canónica $f(x) = b^x$:
    - **Si la base es $b > 1$**: La función es **estrictamente creciente** en todo $\mathbb{R}$.
    - **Si la base es $0 < b < 1$**: La función es **estrictamente decreciente** en todo $\mathbb{R}$.
  - **A diferencia de las parábolas cuadráticas**, las funciones exponenciales **NO TIENEN VÉRTICE NI CAMBIAN DE SENTIDO**: mantienen el mismo tipo de monotonía a lo largo de todo el dominio real.
explicacion_formal: |
  Sea la función exponencial $f: \mathbb{R} \to \mathbb{R}^+$ definida por $f(x) = a \cdot b^x$ con $a > 0$ y $b \in \mathbb{R}^+ \setminus \{1\}$. El estudio de su **monotonía global** se formaliza mediante el análisis del signo de su primera derivada:

  $$f'(x) = \frac{d}{dx}\left(a \cdot b^x\right) = a \cdot \ln(b) \cdot b^x$$

  Dado que $a > 0$ y $b^x > 0$ para todo $x \in \mathbb{R}$, el signo de $f'(x)$ depende exclusivamente de $\ln(b)$:
  1. **Si $b > 1 \implies \ln(b) > 0 \implies f'(x) > 0, \, \forall x \in \mathbb{R}$:** La función es **estrictamente creciente en $\mathbb{R}$**. Es una inyección donde $x_1 < x_2 \iff f(x_1) < f(x_2)$.
  2. **Si $0 < b < 1 \implies \ln(b) < 0 \implies f'(x) < 0, \, \forall x \in \mathbb{R}$:** La función es **estrictamente decreciente en $\mathbb{R}$**. Es una inyección donde $x_1 < x_2 \iff f(x_1) > f(x_2)$.
definiciones_clave: |
  - **Monotonía exponencial**: Condición analítica global que establece que la función exponencial es estrictamente creciente ($b > 1$) o estrictamente decreciente ($0 < b < 1$) en la totalidad de $\mathbb{R}$.
propiedades_relaciones: |
  - **Inyectividad y biyectividad**: Debido a su monotonía estricta sin puntos críticos ni extremos locales, la función exponencial $f: \mathbb{R} \to \mathbb{R}^+$ es biyectiva y por ende invertible.
ejemplo_guiado:
  enunciado: 'Determina la monotonía de la función $f(x) = (3/5)^x$ comprobando la relación de orden entre las imágenes $f(1)$ y $f(2)$.'
  pasos:
    - 'Paso 1: Identificar la base del modelo: $b = 3/5 = 0.6$.'
    - 'Paso 2: Comparar la base con 1: como $0 < 0.6 < 1$, la función debe ser estrictamente decreciente.'
    - 'Paso 3: Evaluar las imágenes: $f(1) = (3/5)^1 = 0.6$ y $f(2) = (3/5)^2 = 9/25 = 0.36$.'
    - 'Paso 4: Comprobar la definición: $1 < 2$, pero $f(1) = 0.6 > 0.36 = f(2)$. Se confirma que la función es **estrictamente decreciente**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si para una función exponencial $f(x) = b^x$ se cumple que la primera derivada $f''(x) > 0$ para todo $x \in \mathbb{R}$, ¿qué condición satisface su base $b$?'
    choices:
      - {text: 'La base es estrictamente mayor que uno ($b > 1$)', is_correct: true}
      - {text: 'La base se encuentra entre cero y uno ($0 < b < 1$).', is_correct: false}
      - {text: 'La base es exactamente igual a uno ($b = 1$).', is_correct: false}
      - {text: 'La base es un número negativo.', is_correct: false}
    explanation: 'La alternativa correcta es ''La base es estrictamente mayor que uno ($b > 1$)''. $f''(x) > 0 \iff \ln(b) > 0 \iff b > 1$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada la función $g(x) = (1.02)^x$, si $x_1 = 5$ y $x_2 = 10$, ¿cuál es la relación de orden correcta entre sus imágenes $g(5)$ y $g(10)$?'
    choices:
      - {text: '$g(5) < g(10)$ porque la base es mayor que uno ($b = 1.02 > 1$)', is_correct: true}
      - {text: '$g(5) > g(10)$ porque la función decrece con el tiempo.', is_correct: false}
      - {text: '$g(5) = g(10)$ porque es una función constante.', is_correct: false}
      - {text: 'No es posible comparar las imágenes.', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(5) < g(10)$ porque la base es mayor que uno ($b = 1.02 > 1$)''. Al ser creciente, a mayor $x$, mayor $y$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Aislar la base $b$ en la función de la forma $f(x) = a \cdot b^x$.'
  - 'Paso 2: Comparar $b$ con el valor crítico 1.'
  - 'Paso 3: Declarar monotonía estrictamente creciente si $b > 1$.'
  - 'Paso 4: Declarar monotonía strictly decreciente si $0 < b < 1$.'
errores_correccion: |
  - **Error común:** Buscar máximos o mínimos locales (vértices) en la función exponencial como si fuera una parábola.
  - **Cómo corregirlo:** La función exponencial **NO TIENE MÁXIMOS NI MÍNIMOS LOCALES**: su monotonía es uniforme y estricta en todo el dominio.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Monotonía de base e (2.718...).
    alternativas:
      - 'Estrictamente creciente en todo \mathbb{R} (e > 1)'
      - 'Decreciente en los reales negativos'
      - 'Posee un mínimo en el origen'
    respuesta: 'Estrictamente creciente en todo \mathbb{R} (e > 1)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Monotonía de base fraccionaria 2/3.
    alternativas:
      - 'Estrictamente decreciente en todo \mathbb{R} (0 < 2/3 < 1)'
      - 'Creciente para x > 0'
      - 'Constante'
    respuesta: 'Estrictamente decreciente en todo \mathbb{R} (0 < 2/3 < 1)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 8^x$, la afirmación de que presenta un punto máximo en el intervalo $[-5, 5]$.'
  - 'La afirmación errónea de que una función exponencial decreciente en un tramo pasa a ser creciente en otro tramo.'
  - 'La afirmación de que el signo de $x$ altera la monotonía global de la función básica.'
  - 'La afirmación de que la función es constante en las cercanías de su asíntota horizontal.'
  - 'Equiparar la monotonía de la función exponencial con la de una función cuadrática.'
afirmaciones_verdaderas:
  - 'La función exponencial $f(x) = b^x$ posee monotonía estricta y uniforme en la totalidad del conjunto de los números reales $\mathbb{R}$.'
  - 'La primera derivada de la función exponencial canónica no se anula jamás en $\mathbb{R}$, descartando la existencia de puntos críticos o extremos locales.'
al_terminar_debes_poder: |
  QUÉ: Determinar y clasificar la monotonía de cualquier función exponencial $f(x) = a \cdot b^x$.
  CÓMO: Comparar la base $b$ con $1$, evaluar el signo de la derivada $a \cdot \ln(b) \cdot b^x$ y declarar el tipo de variación en $\mathbb{R}$.
