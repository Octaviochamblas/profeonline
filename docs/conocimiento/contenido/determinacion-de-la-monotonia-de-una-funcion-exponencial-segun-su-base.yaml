semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MONOTONIA
resumen_inicial: 'La determinación de la monotonía de una función exponencial $f(x) = a \cdot b^x$ combina el valor de la base $b$ con el signo del coeficiente $a$: si $a > 0$, la función es creciente para $b > 1$ y decreciente para $0 < b < 1$; mientras que si $a < 0$, la reflexión invierte la monotonía.'
explicacion_simple: "![La determinación de la monotonía de una función exponencial $f(x) = a \\cdot b^x$ combina el valor de la base $b$ con el signo del coeficiente $a$: si $a > 0$, la función es creciente para $b > 1$ y decreciente para $0 < b < 1$; mientras que si $a < 0$, la reflexión invierte la monotonía](/static/img/nodos/determinacion-de-la-monotonia-de-una-funcion-exponencial-segun-su-base-intro.svg)\n\n\nLa **monotonía** te dice si la curva sube o baja a lo largo de todo el camino. Para saberlo, solo mira dos cosas:\n\n- **1. La base $b$ (La regla base):**\n  - $b > 1 \\implies$ Quiere **subir** (creciente).\n  - $0 < b < 1 \\implies$ Quiere **bajar** (decreciente).\n- **2. El signo del coeficiente $a$ (El interruptor que da vuelta todo):**\n  - Si $a > 0$ (positivo): Mantiene la regla normal.\n  - Si $a < 0$ (negativo): **¡Invierte la dirección!**\n    - Un crecimiento ($b > 1$) con $a < 0$ se vuelve **DECRECIENTE** (ej: $-3 \\cdot 2^x$).\n    - Un decaimiento ($0 < b < 1$) con\
  \ $a < 0$ se vuelve **CRECIENTE** (ej: $-2 \\cdot (0,5)^x$)."
explicacion_formal: 'Sea $f(x) = a \cdot b^x$ con $a \in \mathbb{R} \setminus \{0\}$ y $b \in \mathbb{R}^+ \setminus \{1\}$. El signo de la primera derivada determina la monotonía global:

  $$f''(x) = a \cdot \ln(b) \cdot b^x$$

  Como $b^x > 0$ para todo $x \in \mathbb{R}$, $\operatorname{sgn}(f''(x)) = \operatorname{sgn}(a) \cdot \operatorname{sgn}(\ln(b))$.


  **Tabla de Monotonía Cuadrante Analítico**:

  1. **$a > 0 \land b > 1$**: $\operatorname{sgn}(f'') = (+) \cdot (+) = + \implies$ **Estrictamente Creciente**.

  2. **$a > 0 \land 0 < b < 1$**: $\operatorname{sgn}(f'') = (+) \cdot (-) = - \implies$ **Estrictamente Decreciente**.

  3. **$a < 0 \land b > 1$**: $\operatorname{sgn}(f'') = (-) \cdot (+) = - \implies$ **Estrictamente Decreciente**.

  4. **$a < 0 \land 0 < b < 1$**: $\operatorname{sgn}(f'') = (-) \cdot (-) = + \implies$ **Estrictamente Creciente**.'
definiciones_clave: '- **Monotonía global**: Sentido de variación constante de una función en todo su dominio sin puntos críticos ni cambios de concavidad.

  - **Inversión por reflexión vertical**: Cambio del signo de la derivada al multiplicar por un escalar negativo.'
propiedades_relaciones: '- **Ausencia de extremos locales**: Como $f''(x) \neq 0$ en todo $\mathbb{R}$, las funciones exponenciales nunca tienen máximos ni mínimos relativos.

  - **Inyectividad universal**: Toda función exponencial de la forma $a \cdot b^x$ es estrictamente inyectiva en $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación de la monotonía de una función exponencial $f(x) = a \cdot b^x$ combina el valor de la base $b$ con el signo del coeficiente $a$: si $a > 0$, la función es creciente para $b > 1$ y decreciente para $0 < b < 1$; mientras que si $a < 0$, la reflexión invierte la monotonía](/static/img/nodos/determinacion-de-la-monotonia-de-una-funcion-exponencial-segun-su-base-ejemplos.svg)



    Determina la monotonía justificando analíticamente para:

    1) $f(x) = 5 \cdot (1{,}4)^x$

    2) $g(x) = -2 \cdot 3^x$

    3) $h(x) = -4 \cdot (0{,}6)^x$'
  pasos:
  - 'Paso 1: Para $f(x) = 5 \cdot (1{,}4)^x$:

    - $a = 5 > 0$ y $b = 1{,}4 > 1 \implies f''(x) > 0$.

    - **Estrictamente creciente**.'
  - 'Paso 2: Para $g(x) = -2 \cdot 3^x$:

    - $a = -2 < 0$ y $b = 3 > 1$.

    - El signo negativo de $a$ invierte el crecimiento $\implies f''(x) < 0$.

    - **Estrictamente decreciente**.'
  - 'Paso 3: Para $h(x) = -4 \cdot (0{,}6)^x$:

    - $a = -4 < 0$ y $b = 0{,}6 < 1$.

    - Como $\ln(0{,}6) < 0$ y $a < 0$, $(-)(-) = + \implies f''(x) > 0$.

    - **Estrictamente creciente** (se acerca a cero desde valores negativos).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la monotonía de la función f(x) = -5 · 2ˣ?
  choices:
  - text: Estrictamente decreciente (porque el coeficiente negativo a = -5 invierte la base b = 2)
    is_correct: true
  - text: Estrictamente creciente
    is_correct: false
  - text: Constante
    is_correct: false
  - text: Tiene un máximo en x = 0
    is_correct: false
  explanation: La alternativa correcta es 'Estrictamente decreciente (porque el coeficiente negativo a = -5 invierte la base b = 2)'. Para $x = 0 \implies -5$; para $x = 1 \implies -10 < -5$, la curva baja hacia $-\infty$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En f(x) = -3 · (0,2)ˣ, al aumentar x, ¿qué ocurre con los valores de la función?
  choices:
  - text: Aumentan haciéndose menos negativos (función estrictamente creciente hacia 0)
    is_correct: true
  - text: Disminuyen haciéndose más negativos
    is_correct: false
  - text: Se mantienen constantes
    is_correct: false
  - text: Oscilan
    is_correct: false
  explanation: La alternativa correcta es 'Aumentan haciéndose menos negativos (función estrictamente creciente hacia 0)'. Para $x = 0 \implies -3$; para $x = 1 \implies -0,6 > -3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor y signo del coeficiente multiplicativo $a$.'
- 'Paso 2: Identificar si la base cumple $b > 1$ o $0 < b < 1$.'
- 'Paso 3: Calcular el signo conjunto de $a \cdot \ln(b)$.'
- 'Paso 4: Concluir formalmente si la función es estrictamente creciente o estrictamente decreciente.'
errores_correccion: '- **Error común:** Concluir que toda función con $b = 2$ es creciente, olvidando revisar el signo de $a$.

  - **Cómo corregirlo:** Si hay un signo negativo delante (ej: $-2^x$), **la gráfica se invierte y pasa a ser DECRECIENTE**.'
ejemplos:
- titulo: 'Ejemplo 1: Base mayor a 1 positiva'
  enunciado: ¿Cómo es la monotonía de $f(x) = 8 \cdot 4^x$?
  alternativas:
  - Estrictamente creciente
  - Estrictamente decreciente
  - Constante
  - Parabólica
  respuesta: Estrictamente creciente
  solucion_pasos:
  - 'Paso 1: $a = 8 > 0, b = 4 > 1 \implies$ creciente.'
- titulo: 'Ejemplo 2: Inversión por escala negativa'
  enunciado: En $g(x) = -7 \cdot (1{,}5)^x$, ¿cuál es la monotonía?
  alternativas:
  - Estrictamente decreciente
  - Estrictamente creciente
  - Oscilante
  - No tiene monotonía
  respuesta: Estrictamente decreciente
  solucion_pasos:
  - 'Paso 1: $a = -7 < 0, b = 1{,}5 > 1 \implies$ decreciente.'
- titulo: 'Ejemplo 3: Doble negativo creciente'
  enunciado: En $h(x) = -10 \cdot (0{,}3)^x$, ¿cuál es la monotonía?
  alternativas:
  - Estrictamente creciente
  - Estrictamente decreciente
  - Constante
  - Tiene un mínimo
  respuesta: Estrictamente creciente
  solucion_pasos:
  - 'Paso 1: $a = -10 < 0, b = 0{,}3 < 1 \implies$ creciente.'
- titulo: 'Ejemplo 4: Detección de extremos'
  enunciado: ¿Puede una función exponencial $f(x) = a \cdot b^x$ tener un valor máximo local en $\mathbb{R}$?
  alternativas:
  - No, porque su monotonía es estricta en todo ℝ sin puntos críticos
  - Sí, en el vértice
  - Sí, en x = 0
  - Solo si b < 1
  respuesta: No, porque su monotonía es estricta en todo ℝ sin puntos críticos
  solucion_pasos:
  - 'Paso 1: $f''(x) \neq 0$ para todo $x \implies$ no existen máximos ni mínimos.'
errores_frecuentes:
- Ignorar el signo del parámetro a al clasificar la monotonía.
- Pensar que las funciones que se acercan a cero son siempre decrecientes (si son negativas y suben a cero, son crecientes).
- Buscar vértices o extremos en funciones exponenciales.
afirmaciones_verdaderas:
- La monotonía de f(x) = a · bˣ depende del producto del signo de a por el signo de ln(b).
- Una función exponencial elemental nunca cambia de sentido de crecimiento en su dominio real.
al_terminar_debes_poder: '**QUÉ:** Determinar con precisión la monotonía de una función exponencial.


  **CÓMO:** Evaluando conjuntamente el valor de la base b y el signo del coeficiente multiplicativo a.


