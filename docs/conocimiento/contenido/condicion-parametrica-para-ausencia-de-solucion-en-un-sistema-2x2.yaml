semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.PARAMETROS_SIN_SOLUCION
resumen_inicial: La ausencia de solución paramétrica exige que las razones de coeficientes de las variables se igualen entre sí pero sean distintas de la razón de constantes.
explicacion_simple: '![Condición paramétrica para ausencia de solución en un sistema 2x2](/static/img/nodos/condicion-parametrica-para-ausencia-de-solucion-en-un-sistema-2x2-intro.svg)


  Para que un sistema con parámetro $k$ sea **incompatible (sin solución)**, requerimos que las dos rectas sean paralelas no coincidentes.

  Igualamos las razones de los coeficientes de $x$ e $y$ para forzar la misma pendiente, pero exigimos que esta razón sea DIFERENTE de la razón entre las constantes independientes.'
explicacion_formal: 'Dado el sistema con parámetro $k \in \mathbb{R}$:


  $$\begin{cases} a_1(k) x + b_1(k) y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$$


  La **condición de ausencia de solución** (Incompatible) requiere la combinación:


  $$\frac{a_1(k)}{a_2} = \frac{b_1(k)}{b_2} \neq \frac{c_1}{c_2}$$


  $$\iff \Delta(k) = 0 \quad \land \quad (\Delta_x \neq 0 \quad \lor \quad \Delta_y \neq 0)$$'
definiciones_clave: '- **Condición paramétrica de incompatibilidad**: Igualdad entre las razones de coeficientes combinada con la desigualdad de la razón de constantes.

  - **Paralelismo estricto de rectas paramétricas**: Inclinaciones iguales ($m_1 = m_2$) con ordenadas al origen distintas ($n_1 \neq n_2$).'
propiedades_relaciones: '- **Efecto de las constantes**: La diferencia en la razón de las constantes garantiza que las rectas no se solapen.'
ejemplo_guiado:
  enunciado: '![Ejemplo Condición paramétrica para ausencia de solución en un sistema 2x2](/static/img/nodos/condicion-parametrica-para-ausencia-de-solucion-en-un-sistema-2x2-ejemplos.svg)


    Determina el valor del parámetro $k$ para el cual el sistema $\begin{cases} kx + 4y = 9 \\ 3x + 2y = 5 \end{cases}$ no posee solución en los números reales.'
  pasos:
  - 'Paso 1: Plantear la condición de paralelismo no coincidente: $\frac{k}{3} = \frac{4}{2} \neq \frac{9}{5}$.Paso 2: Notar que la razón de coeficientes de $y$ es $\frac{4}{2} = 2$.Paso 3: Verificar que $2 \neq \frac{9}{5}$ (se satisface la desigualdad de las constantes).Paso 4: Igualar la razón de $x$ a $2$: $\frac{k}{3} = 2 \implies k = 6$.Paso 5: Concluir que para $k = 6$ el sistema carece de solución.'
checkpoints:
- placement: after_explicacion_formal
  question: Para el sistema $\begin{cases} kx + 4y = 9 \\ 3x + 2y = 5 \end{cases}$, ¿cuál es el valor de $k$ para que no tenga solución?
  choices:
  - text: $k = 6$
    is_correct: true
  - text: $k = 3$
    is_correct: false
  - text: $k = 9$
    is_correct: false
  - text: $k = 2$
    is_correct: false
  explanation: La alternativa correcta es '$k = 6$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al sustituir $k = 6$, se obtiene la razón $\frac{6}{3} = \frac{4}{2} = 2 \neq \frac{9}{5}$. ¿Qué figura representan las rectas?
  choices:
  - text: Dos rectas paralelas que jamás se intersectan.
    is_correct: true
  - text: Dos rectas coincidentes exactamente en la misma posición.
    is_correct: false
  - text: Dos rectas secantes perpendiculares.
    is_correct: false
  - text: Una única recta tangente a la parábola.
    is_correct: false
  explanation: La alternativa correcta es 'Dos rectas paralelas que jamás se intersectan.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la condición $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$.'
- 'Paso 2: Resolver la ecuación entre las razones de coeficientes $\frac{a_1}{a_2} = \frac{b_1}{b_2}$ para despejar $k$.'
- 'Paso 3: Sustituir el valor de $k$ obtenido en la constante y confirmar que $\frac{a_1}{a_2} \neq \frac{c_1}{c_2}$.'
- 'Paso 4: Presentar el valor paramétrico final que produce ausencia de solución.'
errores_correccion: '- **Error común:** Confundir las condiciones de sin solución y de infinitas soluciones.

  - **Cómo corregirlo:** Si la razón de constantes es IGUAL a las anteriores, hay infinitas soluciones. Si es DIFERENTE, no hay solución.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Para que un sistema $2 \times 2$ carezca de solución, la razón entre las constantes independientes $\frac{c_1}{c_2}$ debe ser igual a la razón entre coeficientes.
- La condición de ausencia de solución en $\begin{cases} kx + 4y = 9 \\ 3x + 2y = 5 \end{cases}$ exige que el determinante principal del sistema sea distinto de cero $\Delta \neq 0$.
- Al obtener el parámetro $k = 6$ que iguala las pendientes de dos rectas con distintas constantes, se concluye que el sistema posee infinitas soluciones.
- Dos rectas paralelas no coincidentes representadas en un sistema de ecuaciones se intersecan en el origen $(0, 0)$.
- La ausencia de solución en un sistema $2 \times 2$ permite transformar arbitrariamente las constantes para forzar un punto de cruce.
afirmaciones_verdaderas:
- Un sistema 2x2 parametrizado carece de solución si y solo si la razón entre coeficientes de $x$ e $y$ es igual entre sí pero distinta a la de las constantes.
- Si la razón de constantes difiere de las razones de coeficientes de las variables, las rectas asociadas son paralelas no coincidentes.
al_terminar_debes_poder: '**QUÉ:** Determinar los valores de un parámetro $k$ para que un sistema 2x2 carezca de solución.


  **CÓMO:** Haciendo nulo el determinante principal ($\Delta(k) = 0$) y verificando que la razón de términos libres rompa la proporción ($\frac{c_1}{c_2} \neq \lambda$).


  ![Resumen Condición paramétrica para ausencia de solución en un sistema 2x2](/static/img/nodos/condicion-parametrica-para-ausencia-de-solucion-en-un-sistema-2x2-resumen.svg)'
