semantic_id: MAT.ALG.VALORIZACION.RACIONALES
resumen_inicial: 'Valorización con números racionales (fracciones y decimales): traducción,
  reglas y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: 'Las fracciones en álgebra no son más que divisiones pospuestas.
  Valorizar una expresión racional es como calcular el peso de dos trenes distintos:
  uno arriba (numerador) y otro abajo (denominador), y luego ver si podemos simplificarlos.'
explicacion_formal: '### Definición formal


  El denominador representa ''entre cuántas partes se divide algo''. No se puede dividir
  entre cero partes.


  ### Desarrollo didáctico


  Toma la expresión: $\frac{2x + 4}{x - 1}$, para $x=3$.

  Regla del bloque: Jamás intentes cruzar operaciones entre el piso de arriba y el
  de abajo antes de que sean un solo número.

  - Arriba: $2(3) + 4 = 6 + 4 = 10$.

  - Abajo: $(3) - 1 = 2$.

  - Nueva fracción: $\frac{10}{2}$.

  - División final: $5$.


  *Advertencia crítica:* Si al evaluar el denominador obtienes un $0$ (ej. en $\frac{5}{x-2}$
  con $x=2$, quedaría $\frac{5}{0}$), la expresión es **indeterminada** o ''no existe''
  en los números reales. El cero en el divisor es el apocalipsis matemático.'
definiciones_clave: '- **Valorización con números racionales (fracciones y decimales)**:
  Herramienta clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de valorización con números racionales (fracciones y decimales).'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de valorización
    con números racionales (fracciones y decimales).
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a valorización con números racionales
    (fracciones y decimales).
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
