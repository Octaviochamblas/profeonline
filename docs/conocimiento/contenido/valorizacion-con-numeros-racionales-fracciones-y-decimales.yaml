semantic_id: MAT.ALG.VALORIZACION.RACIONALES
resumen_inicial: 'La valorización con números racionales consiste en calcular el valor de expresiones algebraicas cuando las variables se sustituyen por fracciones o decimales, aplicando operativa racional.'
explicacion_simple: |
  Cuando las variables son **fracciones o números decimales** ($\mathbb{Q}$), el proceso de valorización es el mismo, pero exige aplicar la aritmética de números racionales:
  - **Sustitución con fracciones**: Envolver la fracción completa entre paréntesis $\left(\frac{a}{b}\right)$.
  - **Potencia de una fracción**: Eleva tanto el numerador como el denominador $\left(\frac{a}{b}\right)^2 = \frac{a^2}{b^2}$.
  - **Multiplicación por un entero**: El entero multiplica únicamente al numerador $c \cdot \frac{a}{b} = \frac{c \cdot a}{b}$.
  - **Ejemplo**: Valorizar $3x^2$ para $x = \frac{1}{2}$:
    - Sustitución: $3\left(\frac{1}{2}\right)^2$.
    - Potencia: $\left(\frac{1}{2}\right)^2 = \frac{1^2}{2^2} = \frac{1}{4}$.
    - Multiplicación: $3 \cdot \frac{1}{4} = \mathbf{\frac{3}{4}}$ (o $0,75$).
explicacion_formal: |
  ### Definición formal
  Sea $E(x) \in \mathbb{R}[x]$ una expresión algebraica. La valorización racional es la evaluación sobre una constante racional $q = \frac{p}{d} \in \mathbb{Q}$ (con $p, d \in \mathbb{Z}, d \neq 0$):

  $$\operatorname{ev}_{x = p/d}(E) = E\left(\frac{p}{d}\right) \in \mathbb{Q}$$

  ### Distribución de la Potencia en el Cuerpo de Fracciones $\mathbb{Q}$
  Para todo elemento racional $\frac{p}{d} \in \mathbb{Q}$ y exponente $n \in \mathbb{N}$:

  $$\left(\frac{p}{d}\right)^n = \frac{p^n}{d^n} \quad \text{con } d^n \neq 0$$

  ### Simplificación y Conversión Decimal-Fracción
  Se recomienda simplificar las fracciones a su forma irreductible antes de operar o convertir decimales finitos a fracción: $0,5 = \frac{1}{2}$, $0,25 = \frac{1}{4}$, $0,2 = \frac{1}{5}$.

  ### Síntesis didáctica
  La valorización racional es indispensable en problemas de proporciones, tasas porcentuales y cálculo de probabilidades.
definiciones_clave: |
  - **Valorización racional**: Evaluación de expresiones algebraicas mediante la sustitución de variables por elementos del conjunto $\mathbb{Q}$.
  - **Potencia de fracción ($\frac{p^n}{d^n}$)**: Aplicación del exponente al numerador y denominador de forma independiente.
  - **Fracción irreductible**: Expresión racional simplificada a su mínima representación entera común.
propiedades_relaciones: |
  - **Homogeneidad de representación**: Valorizar con la fracción $\frac{1}{2}$ o con su equivalente decimal $0,5$ produce exactamente el mismo resultado numérico.
  - **Multiplicación escalar**: Multiplicar un coeficiente entero por una fracción sólo afecta al numerador: $c \cdot \frac{p}{d} = \frac{c p}{d}$.
ejemplo_guiado:
  enunciado: 'Calcula el valor de la expresión $4x^2 - 2x + 1$ para $x = \frac{3}{2}$.'
  pasos:
    - 'Paso 1: Sustituimos $x = \frac{3}{2}$ con paréntesis: $4\left(\frac{3}{2}\right)^2 - 2\left(\frac{3}{2}\right) + 1$.'
    - 'Paso 2: Calculamos la potencia $\left(\frac{3}{2}\right)^2 = \frac{3^2}{2^2} = \frac{9}{4}$.'
    - 'Paso 3: Multiplicamos el primer término: $4 \cdot \frac{9}{4} = \frac{36}{4} = 9$.'
    - 'Paso 4: Multiplicamos el segundo término: $-2 \cdot \frac{3}{2} = -\frac{6}{2} = -3$.'
    - 'Paso 5: Sumamos y restamos los resultados: $9 - 3 + 1 = 7$.'
    - 'Conclusión: El valor numérico es **$7$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se eleva una fracción $\frac{a}{b}$ al cuadrado en la valorización de una expresión?'
    choices:
      - {text: 'Se eleva tanto el numerador como el denominador al cuadrado: $\frac{a^2}{b^2}$', is_correct: true}
      - {text: 'Se eleva únicamente el numerador dejando el denominador igual', is_correct: false}
      - {text: 'Se multiplica la fracción por dos', is_correct: false}
      - {text: 'Se eleva únicamente el denominador al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''Se eleva tanto el numerador como el denominador al cuadrado: $\frac{a^2}{b^2}$''. Potencia distribuida en numerador y denominador.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de valorizar $6x$ para $x = \frac{2}{3}$?'
    choices:
      - {text: 'El resultado es $4$, obtenido mediante $6 \cdot \frac{2}{3} = \frac{12}{3} = 4$', is_correct: true}
      - {text: 'El resultado es $\frac{12}{18}$', is_correct: false}
      - {text: 'El resultado es $9$', is_correct: false}
      - {text: 'El resultado es $12$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $4$, obtenido mediante $6 \cdot \frac{2}{3} = \frac{12}{3} = 4$''. Multiplicación escalar $6 \cdot 2 / 3 = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sustituir la variable por la fracción o número decimal asignado entre paréntesis.'
  - 'Paso 2: Calcular las potencias afectando tanto al numerador como al denominador de las fracciones.'
  - 'Paso 3: Realizar las multiplicaciones simplificando factores comunes entre numeradores y denominadores.'
  - 'Paso 4: Sumar o restar las fracciones buscando un denominador común si es necesario.'
errores_correccion: |
  - **Error 1:** Elevar únicamente el numerador de la fracción (escribir $\left(\frac{1}{3}\right)^2 = \frac{1}{3}$ en vez de $\frac{1}{9}$). **Cómo corregirlo:** El exponente afecta a **AMBOS TÉRMINOS ($\frac{1^2}{3^2} = \frac{1}{9}$)**.
  - **Error 2:** Multiplicar el coeficiente entero por el numerador Y el denominador (escribir $4 \cdot \frac{1}{2} = \frac{4}{8}$). **Cómo corregirlo:** El entero multiplica **ÚNICAMENTE AL NUMERADOR ($4 \cdot \frac{1}{2} = \frac{4}{2} = 2$)**.
ejemplos:
  - titulo: 'Valorización con fracción simple'
    enunciado: '¿Cuál es el valor de $8x$ para $x = \frac{3}{4}$?'
    alternativas:
      - '$6$'
      - '$\frac{24}{32}$'
      - '$12$'
    respuesta: '$6$'
    solucion_pasos:
      - '1. Sustitución: $8 \cdot \frac{3}{4}$.'
      - '2. Producto: $\frac{24}{4} = 6$.'
  - titulo: 'Fracción al cuadrado'
    enunciado: '¿Cuál es el valor de $x^2$ para $x = \frac{2}{5}$?'
    alternativas:
      - '$\frac{4}{25}$'
      - '$\frac{4}{5}$'
      - '$\frac{2}{25}$'
    respuesta: '$\frac{4}{25}$'
    solucion_pasos:
      - '1. Sustitución: $\left(\frac{2}{5}\right)^2$.'
      - '2. Potencia: $\frac{2^2}{5^2} = \frac{4}{25}$.'
  - titulo: 'Equivalencia decimal'
    enunciado: '¿Produce $x = 0,5$ el mismo resultado que $x = \frac{1}{2}$ al valorizar $4x + 1$ dando $3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $4(0,5) + 1 = 2 + 1 = 3$ y $4(1/2) + 1 = 2 + 1 = 3$.'
  - titulo: 'Simplificación de producto'
    enunciado: 'Para $x = \frac{1}{3}$, ¿es el valor de $9x^2$ igual a $9 \cdot \frac{1}{9} = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $9(1/9) = 1$.'
errores_frecuentes:
  - 'Elevar únicamente el numerador de la fracción al resolver una potencia omitiendo el denominador.'
  - 'Multiplicar el coeficiente entero tanto por el numerador como por el denominador de la fracción.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Sumar directamente numeradores con distintos denominadores sin buscar el mínimo común múltiplo.'
  - 'Declarar que la sustitución con un número decimal produce un resultado algebraicamente distinto a su fracción equivalente.'
afirmaciones_verdaderas:
  - 'Al elevar una fracción a una potencia se debe aplicar el exponente tanto al numerador como al denominador.'
  - 'Multiplicar un entero por una fracción modifica únicamente el numerador de la expresión fraccionaria.'
al_terminar_debes_poder: 'Valorizar expresiones algebraicas sustituyendo variables por números racionales (fracciones y decimales) resolviendo potencias y operaciones fraccionarias.'
