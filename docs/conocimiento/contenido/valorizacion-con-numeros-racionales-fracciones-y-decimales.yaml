  enunciado: 'Respecto de «Valorización con números racionales (fracciones y decimales)»:
    ¿La siguiente formulación es correcta? «Al valorizar **Expresiones Racionales**
    (fracciones), se debe tratar al **numerador y al denominador como polinomios independientes**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al valorizar **Expresiones Racionales**
    (fracciones), se debe tratar al **numerador y al denominador como polinomios independientes**.'
- titulo: 'Respecto de «Valorización con números racionales (fracciones y decimales)»:
    ¿La siguiente co'
  enunciado: 'Respecto de «Valorización con números racionales (fracciones y decimales)»:
    ¿La siguiente conclusión es correcta? «Simplificar variables o números entre el
    numerador y denominador ANTES de terminar las sumas/restas (ej. ''cancelar'' una
    $x$ de arriba con una $x$ de abajo si están sumando)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al valorizar **Expresiones Racionales**
    (fracciones), se debe tratar al **numerador y al denominador como polinomios independientes**.'
errores_frecuentes:
- Simplificar variables o números entre el numerador y denominador ANTES de terminar
  las sumas/restas (ej. 'cancelar' una $x$ de arriba con una $x$ de abajo si están
  sumando).
- No notar que un denominador igual a 0 invalida todo el problema.
- Para «Al valorar una expresión algebraica racional (fraccionaria), ¿qué condición
  matemática sobre el resultado del denominador haría que el valor de la expresión
  se considere 'indeterminado' o 'inexistente'? (v1)», la respuesta correcta es Que
  el resultado del numerador sea igual a $0$.
- Que el denominador resulte en un número negativo.
- Que el denominador sea una fracción irreducible.
afirmaciones_verdaderas:
- La traducción de valorización con números racionales (fracciones y decimales) preserva
  el significado matemático del enunciado.
al_terminar_debes_poder: Traducir y evaluar expresiones que involucren valorización
