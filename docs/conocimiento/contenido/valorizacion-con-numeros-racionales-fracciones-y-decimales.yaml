procedimiento:
- 'Paso 1: Valoriza y calcula completamente el numerador como si fuera un ejercicio
  solitario.'
- 'Paso 2: Valoriza y calcula el denominador de igual manera.'
- 'Paso 3: Construye la fracción con ambos resultados finales (ej. 15 / 3).'
- 'Paso 4: Divide si es un resultado entero, o simplifica la fracción si no lo es.'
- 'Paso 5: Si el denominador dio cero, declara que la expresión está indeterminada.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  valorización con números racionales (fracciones y decimales).
ejemplos:
- titulo: Pisos independientes
  enunciado: Valora (x^2 - 1) / (x + 1) para x = 4.
  solucion_pasos:
  - 'Numerador: (4)^2 - 1 = 16 - 1 = 15.'
  - 'Denominador: (4) + 1 = 5.'
  - 'Fracción final: 15 / 5.'
  - 'División: 3.'
- titulo: La ley de gravitación indica que la fuerza es $F = \frac{G m_1 m_2}{r^2}$.
    Si en un modelo s
  enunciado: 'La ley de gravitación indica que la fuerza es $F = \frac{G m_1 m_2}{r^2}$.
    Si en un modelo simplificado asignamos $G=10$, las masas $m_1=5$ y $m_2=2$, y
    la distancia es $r=5$, ¿cuál es el valor de la fuerza $F$ en este escenario estático?
    (v1)


    Opciones: A) $4$ · B) $20$ · C) $100$ · D) $10$'
  solucion_pasos:
  - 'Numerador: $10 \cdot 5 \cdot 2 = 100$. Denominador: $5^2 = 25$. Fracción: $\frac{100}{25}$.
    Dividimos: $4$.'
- titulo: 'Respecto de «Valorización con números racionales (fracciones y decimales)»:
