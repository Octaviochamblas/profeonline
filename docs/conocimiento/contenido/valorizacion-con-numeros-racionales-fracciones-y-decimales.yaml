resumen_inicial: La valorización con números racionales calcula el resultado escalar
  sustituyendo números específicos en las variables correspondientes.
explicacion_simple: Al trabajar con valorización con números racionales, reemplazamos
  las letras por los valores dados respetando el orden de operaciones (potencias,
  raíces, multiplicaciones y sumas).
explicacion_formal: 'Dada una expresión $E(X)$, su **Valorización con números racionales**
  para los valores $X = V$ se formaliza por:


  $$\text{"la expresión 2x + 1/2 para x = 3/4"} \implies 2$$


  > **Complemento didáctico:** La evaluación rigurosa preserva la estructura de los
  operadores sobre el cuerpo de los números reales.'
definiciones_clave: '- **Valorización con números racionales**: Cálculo numérico escalar
  tras reemplazar variables por números.'
propiedades_relaciones: '- **Jerarquía operacional**: Las potencias y raíces anteceden
  a los productos y adiciones.'
ejemplo_guiado:
  enunciado: 'Calcule valorización con números racionales para: ''la expresión 2x
    + 1/2 para x = 3/4''.'
  pasos:
  - 'Paso 1: Sustituir las variables por sus valores respectivos.'
  - 'Paso 2: Resolver potencias o raíces presentes.'
  - 'Paso 3: Multiplicar y sumar para obtener el resultado final.'
  - 'Conclusión: El resultado es 2.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor numérico resultante al efectuar valorización con números
    racionales en 'la expresión 2x + 1/2 para x = 3/4'?
  choices:
  - text: '2'
    is_correct: true
  - text: 3/2
    is_correct: false
  - text: 5/4
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la expresión 2x + 1/2 para x = 3/4', ¿cuál
    fue el valor obtenido?
  choices:
  - text: '2'
    is_correct: true
  - text: 3/2
    is_correct: false
  - text: 5/4
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar las variables utilizando paréntesis.'
- 'Paso 2: Resolver operaciones según su jerarquía.'
- 'Paso 3: Obtener el valor escalar final.'
errores_correccion: '- **Error 1: Alterar la jerarquía de operaciones al ejecutar
  valorización con números racionales.** **Cómo corregirlo:** Resolver potencias y
  raíces antes que las multiplicaciones y adiciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué valor se obtiene al calcular valorización con números racionales
    en 'la expresión 2x + 1/2 para x = 3/4'?
  alternativas:
  - '2'
  - 3/2
  - 5/4
  - '1'
  respuesta: '2'
  solucion_pasos:
  - 1. Sustituir los valores dados.
  - 2. Calcular la expresión dando 2.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de la evaluación para valorización con números
    racionales en 'la expresión 2x + 1/2 para x = 3/4'?
  alternativas:
  - '2'
  - 3/2
  - 5/4
  - '1'
  respuesta: '2'
  solucion_pasos:
  - 1. Aplicar la sustitución.
  - 2. Obtener 2.
- titulo: ¿Es el resultado de la valorización para 'la expresión 2x + 1/2 para x =
    3/4' igual a 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, evaluando paso a paso obtenemos 2.
- titulo: ¿Da la valorización de 'la expresión 2x + 1/2 para x = 3/4' un valor igual
    a 3/2?
  respuesta: 'No'
  solucion_pasos:
  - No, el valor correcto es 2.
errores_frecuentes:
- Alterar la jerarquía de operaciones al efectuar valorización con números racionales.
- Omitir los paréntesis al sustituir términos en valorización con números racionales.
- Multiplicar bases por exponentes en lugar de calcular la potencia.
- Sumar fracciones de distinto denominador sin igualarlas previamente.
- Declarar que la evaluación de una raíz cuadrada puede dar un radicando negativo
  real.
afirmaciones_verdaderas:
- La valorización respeta estrictamente la jerarquía operacional de potencias, productos
  y adiciones.
- Sustituir correctamente las variables permite calcular el valor escalar exacto de
  la expresión.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la valorización con números
  racionales respetando el orden operacional sobre el conjunto numérico asignado.
