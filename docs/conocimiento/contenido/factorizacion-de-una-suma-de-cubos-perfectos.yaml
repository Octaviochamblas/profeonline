resumen_inicial: 'La factorización de una suma de cubos perfectos descompone $a^3
  + b^3$ en el producto de un binomio suma por un trinomio de signos alternados: $(a
  + b)(a^2 - ab + b^2)$.'
explicacion_simple: 'Para factorizar $x^3 + 8$, usas las bases $x$ y $2$. Armas dos
  paréntesis: 1) Un binomio con las bases sumadas $(x + 2)$, y 2) Un trinomio con
  el cuadrado del primero, MENOS la multiplicación de ambos, MÁS el cuadrado del segundo:
  $(x^2 - 2x + 4)$. El resultado es $(x + 2)(x^2 - 2x + 4)$.'
explicacion_formal: 'Dada la suma de cubos $A^3 + B^3$, el **Teorema de Factorización
  de Suma de Cubos** establece la identidad algebraica exacta en $\mathbb{R}$:


  $$A^3 + B^3 = (A + B)(A^2 - AB + B^2)$$


  **Desglose simbólico:**

  - $(A + B)$: Factor binomio suma compuesto por las bases cúbicas.

  - $(A^2 - AB + B^2)$: Factor trinomio cuadrático no perfecto. Note el signo negativo
  obligatorio en el término central $-AB$.

  - Discriminante de $(A^2 - AB + B^2)$: $\Delta = (-B)^2 - 4(1)(B^2) = -3B^2 < 0$,
  demostrando que el trinomio es irreducible en $\mathbb{R}$.


  > **Complemento didáctico:** La regla mnemotécnica SOAP (Same, Opposite, Always
  Positive) describe los signos: $(A \text{ SAME } B)(A^2 \text{ OPPOSITE } AB \text{
  ALWAYS POSITIVE } B^2)$.'
definiciones_clave: '- **Factor binomio suma**: Expresión de primer grado $(A + B)$
  que contiene la suma de las bases.

  - **Trinomio irreducible**: Expresión cuadrática $(A^2 - AB + B^2)$ con discriminante
  negativo que no admite más factorizaciones reales.'
propiedades_relaciones: '- **Sin doble producto**: El término central del trinomio
  es $-AB$ (producto simple), NO $-2AB$ como en un cuadrado de binomio.'
ejemplo_guiado:
  enunciado: Factorice completamente la suma de cubos $x^3 + 27$.
  pasos:
  - 'Paso 1: Identificar las bases cúbicas $A = x$ y $B = 3$.'
  - 'Paso 2: Construir el factor binomio suma $(A + B)$: $(x + 3)$.'
  - 'Paso 3: Construir los tres términos del factor trinomio:'
  - '  - Cuadrado de la primera base: $A^2 = x^2$.'
  - '  - Menos producto de las bases: $-AB = -3x$.'
  - '  - Más cuadrado de la segunda base: $B^2 = 3^2 = 9$.'
  - 'Paso 4: Multiplicar el binomio por el trinomio: $(x + 3)(x^2 - 3x + 9)$.'
  - 'Conclusión: La factorización de $x^3 + 27$ es $(x + 3)(x^2 - 3x + 9)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la estructura algebraica factorizada de la suma de cubos $A^3
    + B^3$?
  choices:
  - text: $(A + B)(A^2 - AB + B^2)$
    is_correct: true
  - text: $(A + B)(A^2 + AB + B^2)$
    is_correct: false
  - text: $(A - B)(A^2 + 2AB + B^2)$
    is_correct: false
  - text: $(A + B)^3$
    is_correct: false
  explanation: La alternativa correcta es '$(A + B)(A^2 - AB + B^2)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $x^3 + 27$ con bases $A = x$ y $B = 3$, ¿cuál es el trinomio
    obtenido en el segundo paréntesis?
  choices:
  - text: $x^2 - 3x + 9$
    is_correct: true
  - text: $x^2 + 3x + 9$
    is_correct: false
  - text: $x^2 - 6x + 9$
    is_correct: false
  - text: $x^2 - 9$
    is_correct: false
  explanation: La alternativa correcta es '$x^2 - 3x + 9$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar las bases cúbicas $A = \sqrt[3]{T_1}$ y $B = \sqrt[3]{T_2}$.'
- 'Paso 2: Escribir el primer paréntesis binomio con la suma de las bases: $(A + B)$.'
- 'Paso 3: Escribir el segundo paréntesis trinomio alternando los signos: $(A^2 -
  AB + B^2)$.'
errores_correccion: '- **Error 1: Colocar un doble producto $-2AB$ en el término central
  del trinomio resultando en $(A+B)(A^2 - 2AB + B^2)$.** **Cómo corregirlo:** El término
  central de la suma de cubos es el producto simple $-AB$, nunca un doble producto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice $8y^3 + 1$.
  alternativas:
  - $(2y + 1)(4y^2 - 2y + 1)$
  - $(2y + 1)(4y^2 + 2y + 1)$
  - $(2y - 1)(4y^2 + 2y + 1)$
  respuesta: $(2y + 1)(4y^2 - 2y + 1)$
  solucion_pasos:
  - 1. Bases $A = 2y, B = 1$.
  - '2. Factorización: $(2y + 1)((2y)^2 - (2y)(1) + 1^2) = (2y + 1)(4y^2 - 2y + 1)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la expresión factorizada de $m^3 + 64$?
  alternativas:
  - $(m + 4)(m^2 - 4m + 16)$
  - $(m + 4)(m^2 + 4m + 16)$
  - $(m - 4)(m^2 + 4m + 16)$
  respuesta: $(m + 4)(m^2 - 4m + 16)$
  solucion_pasos:
  - 1. Bases $A = m, B = 4$.
  - 2. $(m + 4)(m^2 - 4m + 16)$.
- titulo: En la factorización de $a^3 + b^3$, ¿el término central del trinomio debe
    llevar signo negativo ($-ab$)?
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla establece $(a + b)(a^2 - ab + b^2)$.
- titulo: ¿Es el trinomio $(A^2 - AB + B^2)$ factorizable en binomios reales simples?
  respuesta: 'No'
  solucion_pasos:
  - No, su discriminante es $-3B^2 < 0$, por lo que es irreducible en $\mathbb{R}$.
errores_frecuentes:
- Colocar un doble producto $-2AB$ en el término central del trinomio como si fuera
  un cuadrado de binomio.
- Escribir signo positivo en el término central $+AB$ resultando en el producto falso
  $(A+B)(A^2 + AB + B^2)$.
- Declarar que la suma de cubos se simplifica como el cubo de un binomio $(A + B)^3$.
- Dejar sin elevar al cuadrado los coeficientes numéricos de las bases al calcular
  $A^2$ y $B^2$.
- Asignar signo negativo al término independiente final $-B^2$ dentro del trinomio.
afirmaciones_verdaderas:
- La factorización de $A^3 + B^3$ produce el producto $(A + B)(A^2 - AB + B^2)$.
- El trinomio $A^2 - AB + B^2$ es strictly irreducible en el conjunto de los números
  reales.
al_terminar_debes_poder: Al terminar serás capaz de factorizar una suma de cubos perfectos
  aplicando la fórmula $(A + B)(A^2 - AB + B^2)$.
