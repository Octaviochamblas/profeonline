semantic_id: MAT.ALG.FACTOR_CUBOS.FACTORIZACION_SUMA_CUBOS
resumen_inicial: La factorización de una suma de cubos perfectos establece la identidad $A^3 + B^3 = (A + B)(A^2 - AB + B^2)$
  compuesta por el producto de un binomio suma y un trinomio irreducible con término central restado.
explicacion_simple: "Para factorizar una **Suma de Cubos** $A^3 + B^3$ (ej: $x^3 + 8$, con $A = x$ y $B = 2$):\n- **FÓRMULA\
  \ MAESTRA DE SUMA DE CUBOS**:\n  $$\\mathbf{A^3 + B^3 = (A + B)(A^2 - AB + B^2)}$$\n- **Estructura de los 2 factores resultantes**:\n\
  \  1. **Binomio Suma $(A + B)$**: Contiene la suma directa de las dos raíces cúbicas extracted: **$(x + 2)$**.\n  2. **Trinomio\
  \ con término central negativo $(A^2 - AB + B^2)$**:\n     - Primer término al cuadrado: $A^2 \\implies \\mathbf{x^2}$.\n\
  \     - Menos el producto de las dos bases: $-AB \\implies \\mathbf{-2x}$ (¡este signo menos es crucial!).\n     - Más el\
  \ segundo término al cuadrado: $+B^2 \\implies +2^2 = \\mathbf{+4}$.\n  3. **Resultado final**: $\\mathbf{(x + 2)(x^2 -\
  \ 2x + 4)}$.\n\n![Factorización de suma de cubos](/static/img/nodos/factorizacion-de-una-suma-de-cubos-perfectos-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la suma de cubos $P(A, B) = A^3 + B^3 \in \mathbb{R}[A, B]$. El **Teorema de Factorización de Cubos Sumados** establece
  la descomposición unívoca en factores de menor grado sobre $\mathbb{R}$:


  $$\mathbf{A^3 + B^3 = (A + B)(A^2 - AB + B^2)}$$


  ### Demostración por Multiplicación Distributiva

  Multiplicando el miembro derecho:


  $$(A + B)(A^2 - AB + B^2) = A(A^2 - AB + B^2) + B(A^2 - AB + B^2)$$

  $$= (A^3 - A^2B + AB^2) + (A^2B - AB^2 + B^3)$$


  Cancelando los términos opuestos en la suma cruzada ($-A^2B + A^2B = 0$ y $+AB^2 - AB^2 = 0$):


  $$= A^3 + 0 + 0 + B^3 = \mathbf{A^3 + B^3}$$


  ### Irreducibilidad del Trinomio

  El trinomio cuadrático resultante $Q(A) = A^2 - AB + B^2$ tiene un discriminante estrictamente negativo $\Delta = (-B)^2
  - 4(1)(B^2) = -3B^2 < 0$ para todo $B \neq 0$, garantizando que es **irreducible sobre el cuerpo de los números reales $\mathbb{R}$**.


  ### Síntesis didáctica

  La suma de cubos se factoriza en la suma de las bases multiplicada por el cuadrado de la primera base, menos su producto,
  más el cuadrado de la segunda base.

  '
definiciones_clave: '- **Factor binomio suma ($(A+B)$)**: Primer factor de la descomposicón formado por la adición de las
  bases cúbicas.

  - **Factor trinomio alternado ($(A^2 - AB + B^2)$)**: Segundo factor de la descomposición cuyo término lineal posee el signo
  negativo opuesto.

  - **Irreducibilidad cuadrática en $\mathbb{R}$**: Propiedad del trinomio $A^2 - AB + B^2$ por la cual no puede factorizarse
  en más factores de primer grado en los números reales.

  '
propiedades_relaciones: "- **Patrón de signos S.O.A.P.**:\n  - **S**ame (Mismo signo en el binomio: $+$).\n  - **O**pposite\
  \ (Signo opuesto en el término central: $-$).\n  - **A**lways **P**ositive (Siempre positivo el último término: $+$).\n"
ejemplo_guiado:
  enunciado: Factoriza completamente la suma de cubos $27x^3 + 64$.
  pasos:
  - 'Paso 1: Extraemos las bases cúbicas: - $A = \sqrt[3]{27x^3} = 3x$. - $B = \sqrt[3]{64} = 4$.'
  - 'Paso 2: Armamos el binomio suma $(A + B)$: $(3x + 4)$.'
  - 'Paso 3: Armamos el trinomio $(A^2 - AB + B^2)$: - $A^2 = (3x)^2 = 9x^2$. - $-AB = -(3x \cdot 4) = -12x$. - $+B^2 = 4^2
    = 16$. - Trinomio: $(9x^2 - 12x + 16)$.'
  - 'Paso 4: Multiplicamos ambos factores: $(3x + 4)(9x^2 - 12x + 16)$.'
  - 'Conclusión: La respuesta factorizada es **$(3x + 4)(9x^2 - 12x + 16)$**.'
  imagen: /static/img/nodos/factorizacion-de-una-suma-de-cubos-perfectos-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el término central del trinomio en la suma de cubos $A^3 + B^3 = (A + B)(A^2 - AB + B^2)$ lleva un signo
    negativo ($-AB$)?
  choices:
  - text: Porque el signo negativo de $-AB$ es indispensable para cancelar los términos cruzados $+A^2B$ y $-AB^2$ al multiplicar
      distributivamente
    is_correct: true
  - text: Por un error de signos de la fórmula
    is_correct: false
  - text: Porque B siempre es un número negativo
    is_correct: false
  - text: Para que el trinomio se pueda volver a factorizar
    is_correct: false
  explanation: La alternativa correcta es 'Porque el signo negativo de $-AB$ es indispensable para cancelar los términos cruzados
    $+A^2B$ y $-AB^2$ al multiplicar distributivamente'. Cancelación de términos cruzados $-A^2B + A^2B = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la factorización correcta de la suma de cubos $y^3 + 125$?
  choices:
  - text: La factorización es $(y + 5)(y^2 - 5y + 25)$, aplicando la fórmula con $A = y$ y $B = 5$
    is_correct: true
  - text: La factorización es $(y + 5)(y^2 + 5y + 25)$
    is_correct: false
  - text: La factorización es $(y - 5)(y^2 + 5y + 25)$
    is_correct: false
  - text: La factorización es $(y + 5)^3$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $(y + 5)(y^2 - 5y + 25)$, aplicando la fórmula con $A = y$
    y $B = 5$'. Fórmula $A^3+B^3 = (A+B)(A^2 - AB + B^2)$ con $A=y, B=5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener las raíces cúbicas $A$ y $B$ del primer y segundo término.'
- 'Paso 2: Escribir el primer factor binómico como la suma de las bases: $(A + B)$.'
- 'Paso 3: Calcular los tres términos del trinomio: el cuadrado de la primera base ($A^2$), el producto negativo de las bases
  ($-AB$) y el cuadrado de la segunda base ($B^2$).'
- 'Paso 4: Expresar la solución como el producto del binomio por el trinomio: $(A + B)(A^2 - AB + B^2)$.'
errores_correccion: '- **Error 1:** Colocar un signo de suma en el término central del trinomio (escribir $(A+B)(A^2 + AB
  + B^2)$). **Cómo corregirlo:** En la suma de cubos **EL TÉRMINO CENTRAL DEL TRINOMIO LLEVA OBLIGATORIAMENTE SIGNO MENOS
  ($-AB$)**.

  - **Error 2:** Colocar un doble producto en el término central del trinomio (escribir $-2AB$ como si fuera un TCP). **Cómo
  corregirlo:** En la factorización de cubos **EL TÉRMINO CENTRAL ES SIMPLEMENTE EL PRODUCTO DE LAS BASES ($-AB$), SIN MULTIPLICAR
  POR 2**.

  '
ejemplos:
- titulo: Suma de cubos básica
  enunciado: Para $x^3 + 1$, ¿es la factorización $(x + 1)(x^2 - x + 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, con $A = x$ y $B = 1$.
- titulo: Término central simple
  enunciado: En $(a + b)(a^2 - ab + b^2)$, ¿es el término medio $-ab$ y no $-2ab$?
  respuesta: Sí
  solucion_pasos:
  - Sí, no lleva el número 2.
- titulo: Suma con variable y número
  enunciado: Para $m^3 + 27$, ¿obtenemos $(m + 3)(m^2 - 3m + 9)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $B = 3 \implies 3^2 = 9$.
- titulo: Comprobación por multiplicación
  enunciado: ¿Recupera $(x+2)(x^2 - 2x + 4) = x^3 + 8$ el valor original?
  respuesta: Sí
  solucion_pasos:
  - Sí, cancela $-2x^2+2x^2$ y $4x-4x$.
errores_frecuentes:
- Escribir el término central del trinomio con signo positivo en lugar de signo negativo.
- Multiplicar por 2 el término central del trinomio como si fuese un trinomio cuadrado perfecto.
- Intercambiar la suma de cubos con el cubo de un binomio (escribir $(A+B)^3$).
- Colocar un signo de resta en el último término del trinomio ($B^2$).
- Olvidar que el trinomio factor $A^2 - AB + B^2$ es irreducible sobre los números reales.
afirmaciones_verdaderas:
- La suma de cubos $A^3 + B^3$ factoriza en $(A + B)(A^2 - AB + B^2)$.
- El trinomio factor resultante $A^2 - AB + B^2$ es irreducible sobre los números reales.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/factorizacion-de-una-suma-de-cubos-perfectos-resumen.svg)


  QUÉ: Factorizar sumas de cubos perfectos aplicando la fórmula (A+B)(A² - AB + B²).

  CÓMO: Escribir $(A + B)(A^2 - AB + B^2)$ con el binomio suma de las bases $A$ y $B$, el término medio restado $-AB$ y el
  trinomio irreducible en $\mathbb{R}$.

  '
