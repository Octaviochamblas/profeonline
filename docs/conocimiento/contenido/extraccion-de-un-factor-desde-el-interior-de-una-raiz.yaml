resumen_inicial: 'Para extraer un factor de una raíz $\sqrt[n]{a^n \cdot b}$, se saca
  la base $a$ fuera del radical dividiendo su exponente por el índice: $a \cdot \sqrt[n]{b}$.'
explicacion_simple: Cuando dentro de una raíz hay un factor con un exponente igual
  o mayor que el índice de afuera, ese factor puede 'salir' de la raíz perdiendo su
  exponente al dividirse por el índice.
explicacion_formal: 'Para todo $a, b \ge 0$ e índice $n \ge 2$, la **Extracción de
  Factores** utiliza la distributividad del producto:


  $$\sqrt[n]{a^n \cdot b} = \sqrt[n]{a^n} \cdot \sqrt[n]{b} = a \cdot \sqrt[n]{b}$$


  > **Complemento didáctico:** El exponente interno se divide por el índice: el cociente
  entero sale y el resto queda dentro.'
definiciones_clave: '- **Extracción de factores**: Operación $a \cdot \sqrt[n]{b}$
  que simplifica el radicando extrayendo potencias $n$-ésimas perfectas.'
propiedades_relaciones: '- **Simplificación radical**: Extrae el factor base dividiendo
  su exponente por el índice.'
ejemplo_guiado:
  enunciado: Extraiga factores del radical $\sqrt{12}$.
  pasos:
  - 'Paso 1: Descomponer el radicando $12$ en un producto con un cuadrado perfecto:
    $12 = 4 \cdot 3 = 2^2 \cdot 3$.'
  - 'Paso 2: Aplicar la raíz a la descomposición: $\sqrt{2^2 \cdot 3} = \sqrt{2^2}
    \cdot \sqrt{3}$.'
  - 'Paso 3: Extraer el número $2$ fuera de la raíz: $2\sqrt{3}$.'
  - 'Conclusión: $\sqrt{12} = 2\sqrt{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se extrae una potencia perfecta a^n fuera de una raíz enésima sqrt[n]{a^n
    · b}?
  choices:
  - text: Sale como el factor a multiplicando por fuera a la raíz residual (a · sqrt[n]{b})
    is_correct: true
  - text: Sale como a^n fuera de la raíz
    is_correct: false
  - text: Se divide b entre a
    is_correct: false
  - text: Se elimina b del interior
    is_correct: false
  explanation: La alternativa correcta es 'Sale como el factor a multiplicando por
    fuera a la raíz residual (a · sqrt[n]{b})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(12), ¿cuál fue la forma simplificada final?
  choices:
  - text: 2 · sqrt(3)
    is_correct: true
  - text: 4 · sqrt(3)
    is_correct: false
  - text: 3 · sqrt(2)
    is_correct: false
  - text: 6 · sqrt(2)
    is_correct: false
  explanation: La alternativa correcta es '2 · sqrt(3)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de extraer factores subradicales
  $a \cdot \sqrt[n]{b}$, reduciendo la complejidad del radicando.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.EXTRACCION_FACTOR_SUBRADICAL
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.EXTRACCION_FACTOR_SUBRADICAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
