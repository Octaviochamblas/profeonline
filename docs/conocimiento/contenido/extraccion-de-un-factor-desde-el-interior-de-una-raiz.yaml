semantic_id: MAT.NUM.RAICES_PROPIEDADES.EXTRACCION_FACTOR_SUBRADICAL
resumen_inicial: 'Para extraer factores de una raíz, se descompone el radicando en factores cuyas potencias sean múltiplos del índice $n$, sacando fuera de la raíz la base elevada al cociente de la división: $\sqrt[n]{k^n \cdot c} = k \cdot \sqrt[n]{c}$.'
explicacion_simple: "![Extracción de factores de una raíz](/static/img/nodos/extraccion-de-un-factor-desde-el-interior-de-una-raiz-intro.svg)\n\nExtraer factores es el método principal para simplificar raíces:\n1. **Regla de la división:** Divides el exponente del número de adentro por el índice de la raíz.\n   - El **cociente** te dice el exponente con el que el número **SALE** de la raíz.\n   - El **resto** te dice el exponente con el que el número **SE QUEDA** adentro.\n2. Por ejemplo, en $\\sqrt{50}$, descompones $50 = 25 \\cdot 2 = 5^2 \\cdot 2$. Como el $5$ tiene exponente $2$ igual al índice, sale como $5$ y el $2$ se queda adentro: $\\sqrt{50} = 5\\sqrt{2}$."
explicacion_formal: 'Sea el radical $\sqrt[n]{x^p}$ con $p \ge n$ ($x > 0$). Por el algoritmo de la división euclídea, existen enteros únicos $q, r \in \mathbb{N}_0$ tales que:


  $$p = n \cdot q + r \quad \text{con } 0 \le r < n$$


  **Teorema de Extracción:**

  $$\sqrt[n]{x^p} = \sqrt[n]{x^{n \cdot q + r}} = \sqrt[n]{(x^q)^n \cdot x^r} = \sqrt[n]{(x^q)^n} \cdot \sqrt[n]{x^r} = x^q \cdot \sqrt[n]{x^r}$$


  - $q = \lfloor p/n \rfloor$: Exponente del factor exterior extraído.

  - $r = p \bmod n$: Exponente del factor residual que permanece bajo el radical.'
definiciones_clave: '- **Extracción subradical**: Proceso de simplificación que retira potencias perfectas de grado $\ge n$.

  - **Radical irreducible**: Raíz cuyo radicando no contiene ningún factor con exponente $\ge n$.

  - **División euclídea de exponentes**: Algoritmo $p = nq + r$ que determina qué sale y qué queda.'
propiedades_relaciones: '- **Radicales numéricos**: $\sqrt{72} = \sqrt{36 \cdot 2} = 6\sqrt{2}$.

  - **Variables algebraicas**: $\sqrt[3]{x^7} = x^2 \sqrt[3]{x}$ (porque $7 = 3 \cdot 2 + 1$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de extracción de factores](/static/img/nodos/extraccion-de-un-factor-desde-el-interior-de-una-raiz-ejemplos.svg)


    Simplifique extrayendo todos los factores posibles en $\sqrt{50}$, $\sqrt[3]{24}$ y $\sqrt{a^5}$.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt{50}$: Descomponer $50 = 25 \cdot 2 = 5^2 \cdot 2$. Extraer $5^2 \implies 5\sqrt{2}$.'
  - 'Paso 2: Evaluar $\sqrt[3]{24}$: Descomponer $24 = 8 \cdot 3 = 2^3 \cdot 3$. Extraer $2^3 \implies 2\sqrt[3]{3}$.'
  - 'Paso 3: Evaluar $\sqrt{a^5}$: División $5 : 2 = 2$ (resto $1$). Sale $a^2$, queda $a^1 \implies a^2\sqrt{a}$.'
  - 'Conclusión: Las formas simplificadas son $5\sqrt{2}$, $2\sqrt[3]{3}$ y $a^2\sqrt{a}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la simplificación de $\sqrt{75}$ tras extraer factores?
  choices:
  - text: $5\sqrt{3}$ (porque $75 = 25 \cdot 3 = 5^2 \cdot 3$)
    is_correct: true
  - text: $3\sqrt{5}$
    is_correct: false
  - text: $25\sqrt{3}$
    is_correct: false
  - text: $15\sqrt{5}$
    is_correct: false
  explanation: La alternativa correcta es '$5\sqrt{3}$ (porque $75 = 25 \cdot 3 = 5^2 \cdot 3$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué en $\sqrt{a^5}$ sale $a^2$ y queda $a$?
  choices:
  - text: Porque $5$ dividido por el índice $2$ da cociente $2$ (sale $a^2$) y resto $1$ (queda $a^1$)
    is_correct: true
  - text: Porque se resta $5 - 2 = 3$
    is_correct: false
  - text: Porque $a$ es una variable
    is_correct: false
  - text: Porque se multiplica $5 \times 2$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $5$ dividido por el índice $2$ da cociente $2$ (sale $a^2$) y resto $1$ (queda $a^1$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer el radicando en factores primos y potencias de variables.'
- 'Paso 2: Dividir cada exponente $p$ por el índice radical $n$.'
- 'Paso 3: Escribir la base afuera elevada al cociente $q$ y mantener la base adentro elevada al resto $r$.'
errores_correccion: '- **Error 1: Extraer el factor sin sacarle la raíz ($\sqrt{50} = 25\sqrt{2}$).** **Cómo corregirlo:** Al salir de la raíz cuadrada, $25$ se convierte en $\sqrt{25} = 5$ ($5\sqrt{2}$).

  - **Error 2: No buscar el mayor cuadrado perfecto ($\sqrt{72} = 2\sqrt{18}$ incompleto).** **Cómo corregirlo:** Continuar simplificando o usar el mayor cuadrado: $72 = 36 \cdot 2 \implies 6\sqrt{2}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma simplificada de $\sqrt{12}$?
  alternativas:
  - $2\sqrt{3}$
  - $3\sqrt{2}$
  - $4\sqrt{3}$
  respuesta: $2\sqrt{3}$
  solucion_pasos:
  - $\sqrt{12} = \sqrt{4 \cdot 3} = 2\sqrt{3}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la simplificación de $\sqrt[3]{x^8}$?
  alternativas:
  - $x^2 \sqrt[3]{x^2}$
  - $x^2 \sqrt[3]{x}$
  - $x^4$
  respuesta: $x^2 \sqrt[3]{x^2}$
  solucion_pasos:
  - '$8 : 3 = 2$ resto $2 \implies x^2 \sqrt[3]{x^2}$.'
- titulo: ¿Es √32 igual a 4√2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $32 = 16 \cdot 2 = 4^2 \cdot 2 \implies 4\sqrt{2}$.
  alternativas:
  - texto: Sí, √32 = √(16 · 2) = 4√2
    es_correcta: true
    retroalimentacion: ¡Correcto! Mayor cuadrado 16.
  - texto: No, es igual a 2√8
    es_correcta: false
    retroalimentacion: Incorrecto, $2\sqrt{8}$ no está completamente simplificado.
  - texto: No, es igual a 16√2
    es_correcta: false
    retroalimentacion: Incorrecto, olvidaste sacar la raíz a 16.
- titulo: ¿Es √200 igual a 10√2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $200 = 100 \cdot 2 \implies \sqrt{100} \cdot \sqrt{2} = 10\sqrt{2}$.
  alternativas:
  - texto: Sí, √200 = 10√2
    es_correcta: true
    retroalimentacion: ¡Correcto! 100 sale como 10.
  - texto: No, es igual a 100√2
    es_correcta: false
    retroalimentacion: Incorrecto, no se sacó la raíz cuadrada a 100.
  - texto: No, es igual a 2√10
    es_correcta: false
    retroalimentacion: Incorrecto, $2\sqrt{10} = \sqrt{40} \neq \sqrt{200}$.
errores_frecuentes:
- Olvidar extraer la raíz al factor que sale del radical.
- Dejar radicandos que aún contienen cuadrados o cubos perfectos.
- Dividir el radicando en vez de los exponentes.
- Confundir el cociente con el resto en la división euclídea.
- Sumar factores en vez de multiplicarlos al salir.
afirmaciones_verdaderas:
- Un factor sale del radical si su exponente es mayor o igual al índice de la raíz.
- El exponente del factor exterior es el cociente entero de dividir su exponente original por el índice.
- El exponente del factor residual interior es el resto de dicha división.
al_terminar_debes_poder: '![Síntesis de extracción de factores](/static/img/nodos/extraccion-de-un-factor-desde-el-interior-de-una-raiz-resumen.svg)


  QUÉ: Extraer factores desde el interior de una raíz para obtener su forma irreducible canónica.


  CÓMO: Descomponiendo el radicando en potencias primas, aplicando la división euclídea $p = nq + r$ sobre los exponentes y escribiendo la base con exponente $q$ afuera y exponente $r$ adentro.'
