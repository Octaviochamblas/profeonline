semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DEFINICION
resumen_inicial: El discriminante es la expresión $\Delta = b^2 - 4ac$ ubicada dentro
  de la raíz cuadrada de la fórmula general, la cual predice la naturaleza de sus
  raíces.
explicacion_simple: "El **discriminante** (representado por la letra griega Delta\
  \ **$\\Delta$**) es un 'indicador mágico':\n- Se calcula con la fórmula: **$\\Delta\
  \ = b^2 - 4ac$**.\n- Sin necesidad de resolver la ecuación completa, su valor nos\
  \ dice exactamente el tipo de soluciones que tiene:\n  - Si $\\Delta > 0 \\implies$\
  \ 2 soluciones reales y distintas.\n  - Si $\\Delta = 0 \\implies$ 1 solución real\
  \ doble (dos raíces iguales).\n  - Si $\\Delta < 0 \\implies$ 0 soluciones reales\
  \ (soluciones complejas conjugadas)."
explicacion_formal: 'Dada la ecuación de segundo grado $a x^2 + b x + c = 0$, se define
  su **discriminante** $\Delta \in \mathbb{R}$ como el invariante algebraico de la
  subexpresión radical:


  $$\Delta = b^2 - 4ac$$


  **Desglose de la fórmula:**

  - Determinante del carácter real o complejo de las raíces a través del signo del
  argumento de la función raíz cuadrada de la fórmula resolvente.'
definiciones_clave: '- **Discriminante ($\Delta = b^2 - 4ac$)**: Valor numérico real
  que clasifica cuantitativa y cualitativamente el conjunto solución de una ecuación
  cuadrática.'
propiedades_relaciones: '- **Naturaleza de raíces**: $\operatorname{signo}(\Delta)$
  determina unívocamente la intersección geométrica de la parábola asociada con el
  eje $X$.'
ejemplo_guiado:
  enunciado: Calcula el valor del discriminante $\Delta$ para la ecuación cuadrática
    $3x^2 - 5x + 2 = 0$ e indica qué tipo de raíces posee.
  pasos:
  - 'Paso 1: Identificar coeficientes: $a = 3$, $b = -5$, $c = 2$.Paso 2: Escribir
    la fórmula del discriminante: $\Delta = b^2 - 4ac$.Paso 3: Sustituir los datos:
    $\Delta = (-5)^2 - 4(3)(2) = 25 - 24 = 1$.Paso 4: Analizar el signo del resultado:
    como $\Delta = 1 > 0$, la ecuación tiene 2 soluciones reales y distintas.'
checkpoints:
- placement: after_explicacion_formal
  question: Al calcular el discriminante $\Delta$ para la ecuación $3x^2 - 5x + 2
    = 0$, ¿cuál es el resultado obtenido?
  choices:
  - text: $\Delta = 1$, indicando dos soluciones reales y distintas.
    is_correct: true
  - text: $\Delta = -1$, indicando ausencia de soluciones reales.
    is_correct: false
  - text: $\Delta = 0$, indicando una solución real doble.
    is_correct: false
  - text: $\Delta = 49$
    is_correct: false
  explanation: La alternativa correcta es '$\Delta = 1$, indicando dos soluciones
    reales y distintas.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué fórmula matemática define el discriminante $\Delta$ de una ecuación
    cuadrática $a x^2 + b x + c = 0$?
  choices:
  - text: $\Delta = b^2 - 4ac$
    is_correct: true
  - text: $\Delta = b^2 + 4ac$
    is_correct: false
  - text: $\Delta = \frac{-b}{2a}$
    is_correct: false
  - text: $\Delta = \sqrt{b - ac}$
    is_correct: false
  explanation: La alternativa correcta es '$\Delta = b^2 - 4ac$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordenar la ecuación cuadrática en la forma general $a x^2 + b x + c = 0$.'
- 'Paso 2: Extraer los coeficientes numéricos $a$, $b$ y $c$.'
- 'Paso 3: Reemplazar los valores en la fórmula $\Delta = b^2 - 4ac$.'
- 'Paso 4: Evaluar si el discriminante resultante es positivo, cero o negativo.'
errores_correccion: '- **Error común:** Incluir la raíz cuadrada dentro del valor
  del discriminante (decir $\Delta = \sqrt{1} = 1$).

  - **Cómo corregirlo:** El discriminante $\Delta$ es la subexpresión interna $b^2
  - 4ac$ SIN incluir la raíz cuadrada externa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica del discriminante cuadrático.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de naturaleza de raíces.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El discriminante b^2 - 4ac determina la cantidad de soluciones reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo de Delta predice si hay 2, 1 o 0 soluciones reales.
- titulo: ¿Si Delta < 0 la ecuación carece de soluciones en el conjunto R?
  respuesta: Sí
  solucion_pasos:
  - Sí, la raíz de un número negativo no es un número real.
errores_frecuentes:
- Incluir la raíz cuadrada dentro del valor del discriminante (definir $\Delta = \sqrt{b^2
  - 4ac}$ en vez de $b^2 - 4ac$).
- Calculas $(-4)^2 = -16$ en lugar de $+16$ al sustituir un coeficiente lineal negativo.
- Confundir la condición de dos raíces reales distintas ($\Delta > 0$) con tener raíces
  reales cualesquiera ($\Delta \ge 0$).
- Concluir que $\Delta < 0$ significa que la ecuación no tiene solución en ningún
  sistema numérico (sí tiene en $\mathbb{C}$).
- Olvidar multiplicar por el signo negativo $-4ac$ cuando $c$ es un número negativo.
afirmaciones_verdaderas:
- 'El discriminante $\Delta = b^2 - 4ac$ predice la naturaleza de las raíces: $\Delta
  > 0$ (2 reales distintas), $\Delta = 0$ (1 real doble), $\Delta < 0$ (0 reales).'
- Para que una ecuación de segundo grado posea al menos una solución real se debe
  cumplir la condición $\Delta \ge 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular e interpretar el
  discriminante Delta = b^2 - 4ac, determinar la naturaleza de las raíces y resolver
  condiciones sobre parámetros.
