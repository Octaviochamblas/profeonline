semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DEFINICION
resumen_inicial: El discriminante $\Delta = b^2 - 4ac$ es el número bajo la raíz cuadrada en la fórmula general que determina la cantidad y naturaleza de las soluciones de una ecuación cuadrática.
explicacion_simple: |
  El **discriminante** es un "detector" o indicador matemático representado por la letra griega mayúscula delta $\Delta$:

  $$\Delta = b^2 - 4ac$$

  - Su nombre viene de "discriminar" (distinguir): sin necesidad de resolver toda la ecuación, el valor numérico de $\Delta$ te dice inmediatamente cuántas respuestas reales tiene la ecuación:
    - **Si $\Delta > 0$**: La ecuación tiene **2 soluciones reales distintas**.
    - **Si $\Delta = 0$**: La ecuación tiene **1 solución real doble** ($x_1 = x_2$).
    - **Si $\Delta < 0$**: La ecuación **no tiene soluciones reales** (corta en cero veces al eje $X$).
explicacion_formal: |
  Sea la ecuación cuadrática reducida $ax^2 + bx + c = 0$ con $a, b, c \in \mathbb{R}$ y $a \neq 0$. El **discriminante $\Delta$** (o $D$) del polinomio de segundo grado es la función escalar de los coeficientes:

  $$\Delta = b^2 - 4ac$$

  **Interpretación geométrica de las raíces de $f(x) = ax^2 + bx + c$:**
  - $\Delta > 0 \iff$ La gráfica intercepta al eje $X$ en dos puntos distintos $(x_1, 0)$ y $(x_2, 0)$.
  - $\Delta = 0 \iff$ La gráfica es tangente al eje $X$ en un único punto de contacto (su vértice).
  - $\Delta < 0 \iff$ La gráfica no intercepta al eje $X$ en ningún punto.
definiciones_clave: |
  - **Discriminante ($\Delta$)**: Expresión escalar $\Delta = b^2 - 4ac$ que determina el carácter y número de raíces de una ecuación polinómica cuadrática.
propiedades_relaciones: |
  - **Cuadrados perfectos**: Si $a, b, c \in \mathbb{Q}$ y el discriminante $\Delta > 0$ es un cuadrado perfecto en los racionales (ej. $16, 25, 49$), las dos soluciones $x_1, x_2$ son números racionales exactos.
ejemplo_guiado:
  enunciado: 'Calcula el discriminante de la ecuación $x^2 - 6x + 9 = 0$ e interpreta la naturaleza de sus soluciones.'
  pasos:
    - 'Paso 1: Identificar los coeficientes: $a = 1$, $b = -6$, $c = 9$.'
    - 'Paso 2: Plantear la fórmula del discriminante: $\Delta = b^2 - 4ac = (-6)^2 - 4(1)(9)$.'
    - 'Paso 3: Calcular las operaciones: $\Delta = 36 - 36 = 0$.'
    - 'Paso 4: Concluir que al ser $\Delta = 0$, la ecuación posee una única solución real doble.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula algebraica del discriminante $\Delta$ en la ecuación $ax^2 + bx + c = 0$?'
    choices:
      - {text: '$\Delta = b^2 - 4ac$', is_correct: true}
      - {text: '$\Delta = b^2 + 4ac$', is_correct: false}
      - {text: '$\Delta = 2a - 4bc$', is_correct: false}
      - {text: '$\Delta = \sqrt{b - ac}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\Delta = b^2 - 4ac$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué indica un discriminante de valor negativo ($\Delta < 0$) sobre las soluciones de una ecuación cuadrática real?'
    choices:
      - {text: 'Indica la ausencia total de soluciones en el conjunto de los números reales $\mathbb{R}$.', is_correct: true}
      - {text: 'Indica que existen dos soluciones reales enteras positivas.', is_correct: false}
      - {text: 'Indica que existe una única solución real igual a cero.', is_correct: false}
      - {text: 'Indica que el coeficiente cuadrático $a$ debe ser nulo.', is_correct: false}
    explanation: 'La alternativa correcta es ''Indica la ausencia total de soluciones en el conjunto de los números reales $\mathbb{R}$.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la ecuación en la forma canónica $ax^2 + bx + c = 0$.'
  - 'Paso 2: Extraer los coeficientes $a$, $b$ y $c$ con sus respectivos signos.'
  - 'Paso 3: Sustituir los valores en la fórmula del discriminante $\Delta = b^2 - 4ac$.'
  - 'Paso 4: Evaluar el signo del valor numérico obtenido ($\Delta > 0$, $\Delta = 0$ o $\Delta < 0$) y determinar la naturaleza de las raíces.'
errores_correccion: |
  - **Error común:** Confundir el discriminante $\Delta = b^2 - 4ac$ con la raíz del discriminante $\sqrt{\Delta}$.
  - **Cómo corregirlo:** El discriminante $\Delta$ **ES SOLO LA CANTIDAD SUBRADICAL $b^2 - 4ac$**; no incluye el símbolo de la raíz cuadrada.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Discriminante positivo.
    alternativas:
      - '$\Delta = 16 > 0$ (2 soluciones reales distintas)'
      - '$\Delta = 0$ (1 solución real)'
      - '$\Delta = -4 < 0$ (sin soluciones reales)'
    respuesta: '$\Delta = 16 > 0$ (2 soluciones reales distintas)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Discriminante nulo.
    alternativas:
      - '$\Delta = 0$ (1 solución real doble)'
      - '$\Delta = 25 > 0$ (2 soluciones reales)'
      - '$\Delta = -10 < 0$ (sin soluciones)'
    respuesta: '$\Delta = 0$ (1 solución real doble)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El discriminante $\Delta$ incluye de forma obligatoria el símbolo de la raíz cuadrada $\sqrt{b^2 - 4ac}$.'
  - 'Un discriminante $\Delta = 0$ implica que la única solución de la ecuación cuadrática es el número cero.'
  - 'Un discriminante negativo $\Delta = -9$ genera soluciones reales negativas en el conjunto $\mathbb{R}$.'
  - 'La fórmula del discriminante se calcula evaluando los coeficientes de una ecuación que no ha sido igualada a cero.'
  - 'El valor numérico del discriminante depende de la variable $x$ que se sustituya en el polinomio.'
afirmaciones_verdaderas:
  - 'El discriminante es la expresión escalar $\Delta = b^2 - 4ac$ que permite conocer el número de soluciones reales de $ax^2 + bx + c = 0$ sin resolverla.'
  - 'El signo de $\Delta$ discrimina tres casos: dos soluciones reales distintas ($\Delta > 0$), una solución real doble ($\Delta = 0$) o ausencia de soluciones reales ($\Delta < 0$).'
al_terminar_debes_poder: |
  QUÉ: Definir y calcular el discriminante $\Delta = b^2 - 4ac$ en ecuaciones de segundo grado.
  CÓMO: Isolar $a, b, c$, evaluar $b^2 - 4ac$ e interpretar su signo para determinar la naturaleza de las soluciones reales.
