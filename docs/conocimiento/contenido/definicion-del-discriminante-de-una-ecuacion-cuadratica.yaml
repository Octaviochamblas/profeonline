procedimiento:
- 'Paso 1: Identifica los coeficientes $a$, $b$ y $c$ de la ecuación en forma general.'
- 'Paso 2: Sustituye esos valores en la expresión $\Delta=b^2-4ac$.'
- 'Paso 3: Calcula el resultado; su signo determinará la naturaleza de las soluciones.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en definición del discriminante de una ecuación cuadrática.
ejemplos:
- titulo: Cálculo directo del discriminante
  enunciado: Calcula el discriminante de $2x^2+3x-2=0$.
  solucion_pasos:
  - $a=2$, $b=3$, $c=-2$.
  - $\Delta=3^2-4(2)(-2)=9+16=25$.
- titulo: Cálculo del discriminante con coeficientes negativos
  enunciado: Calcula el discriminante de $x^2-4x+4=0$.
  solucion_pasos:
  - $a=1$, $b=-4$, $c=4$.
  - $\Delta=(-4)^2-4(1)(4)=16-16=0$.
- titulo: ¿El discriminante depende del signo de los tres coeficientes?
  enunciado: ¿El discriminante depende del signo de los tres coeficientes?
  respuesta: Sí
  solucion_pasos:
  - La fórmula $b^2-4ac$ combina los tres coeficientes, por lo que su signo afecta
    el resultado final.
- titulo: ¿Se necesita resolver la ecuación completa para calcular el discriminante?
  enunciado: ¿Se necesita resolver la ecuación completa para calcular el discriminante?
  respuesta: 'No'
  solucion_pasos:
  - Basta con identificar $a$, $b$ y $c$ y sustituirlos en $b^2-4ac$, sin aplicar
    la fórmula general completa.
errores_frecuentes:
- Confundir el orden de la resta, calculando $4ac-b^2$ en vez de $b^2-4ac$.
- Olvidar elevar $b$ al cuadrado antes de restar $4ac$.
- Usar coeficientes de una ecuación que no está en forma general.
- Cometer errores de signo al sustituir coeficientes negativos en la fórmula.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando definición
  del discriminante de una ecuación cuadrática.
