semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DEFINICION
resumen_inicial: El discriminante de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) es la expresión algebraica $\Delta = b^2 - 4ac$ que permite conocer la cantidad y tipo de soluciones reales sin necesidad de resolver la ecuación.
explicacion_simple: "![El discriminante de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \\neq 0$) es la expresión algebraica $\\Delta = b^2 - 4ac$ que permite conocer la cantidad y tipo de soluciones reales sin necesidad de resolver la ecuación](/static/img/nodos/definicion-del-discriminante-de-una-ecuacion-cuadratica-intro.svg)\n\n\nImagina que tienes una prueba diagnóstica rápida para una ecuación cuadrática: en vez de hacer todo el desarrollo largo, calculas un solo número llamado **discriminante ($\\Delta$)**:\n$$\\Delta = b^2 - 4ac$$\n\n- Es exactamente lo que está **adentro de la raíz** en la fórmula general.\n- Su signo te revela el destino de la ecuación:\n  - Si $\\Delta > 0$ (positivo) $\\implies$ la ecuación tiene **2 soluciones reales distintas** (la parábola corta al eje X en dos puntos).\n  - Si $\\Delta = 0$ (cero) $\\implies$ tiene **1 solución real doble** (la parábola toca al eje X en un solo punto).\n  - Si $\\Delta < 0$ (negativo) $\\implies$ tiene **0 soluciones reales**\
  \ (la parábola flota sin tocar el eje X)."
explicacion_formal: 'Sea el polinomio cuadrático $P(x) = ax^2 + bx + c$ con $a, b, c \in \mathbb{R}$ y $a \neq 0$. El **discriminante polinomial** $\Delta$ (o $D$) se define formalmente como el producto ponderado de las diferencias al cuadrado de sus raíces complejas:

  $$\Delta = a^2 (x_1 - x_2)^2 = b^2 - 4ac$$


  **Clasificación espectral de la resolvente:**

  - Como la fórmula general es $x = \frac{-b \pm \sqrt{\Delta}}{2a}$, la pertenencia de $\sqrt{\Delta}$ al cuerpo real $\mathbb{R}$ determina la topología del conjunto solución $\mathcal{S} = \{x \in \mathbb{R} \mid P(x) = 0\}$.'
definiciones_clave: '- **Discriminante $\Delta$**: Invariante algebraico $\Delta = b^2 - 4ac$ que clasifica las raíces de un polinomio de grado 2.

  - **Naturaleza de las raíces**: Caracterización del conjunto solución según su cardinalidad en $\mathbb{R}$ (dos distintas, una doble o ninguna real).'
propiedades_relaciones: '- **Invarianza por traslación**: Las traslaciones horizontales del polinomio no modifican el valor de $\Delta$.

  - **Relación con la concavidad y el vértice**: La ordenada del vértice es $y_v = -\frac{\Delta}{4a}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El discriminante de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) es la expresión algebraica $\Delta = b^2 - 4ac$ que permite conocer la cantidad y tipo de soluciones reales sin necesidad de resolver la ecuación](/static/img/nodos/definicion-del-discriminante-de-una-ecuacion-cuadratica-ejemplos.svg)



    Calcula el discriminante de la ecuación cuadrática $3x^2 - 5x + 1 = 0$ y determina la naturaleza de sus soluciones.'
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 3, b = -5, c = 1$.'
  - 'Paso 2: Escribir la fórmula del discriminante: $\Delta = b^2 - 4ac$.'
  - 'Paso 3: Sustituir los valores numéricos: $\Delta = (-5)^2 - 4(3)(1) = 25 - 12 = 13$.'
  - 'Paso 4: Analizar el signo de $\Delta$: $13 > 0$, es estrictamente positivo.'
  - 'Paso 5: Concluir: La ecuación posee exactamente dos soluciones reales y distintas (irracionales, ya que 13 no es cuadrado perfecto).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula del discriminante Δ de una ecuación cuadrática $ax^2 + bx + c = 0$?
  choices:
  - text: Δ = b² - 4ac
    is_correct: true
  - text: Δ = √(b² - 4ac)
    is_correct: false
  - text: Δ = b² + 4ac
    is_correct: false
  - text: Δ = -b ± √(b² - 4ac)
    is_correct: false
  explanation: La alternativa correcta es 'Δ = b² - 4ac'. El discriminante es la cantidad subradical, sin el símbolo de raíz cuadrada.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el discriminante de una ecuación cuadrática es Δ = 16, ¿qué se puede afirmar sobre sus raíces?
  choices:
  - text: Tiene 2 soluciones reales y distintas (y racionales).
    is_correct: true
  - text: Tiene 16 soluciones reales.
    is_correct: false
  - text: Tiene una raiz doble igual a 4.
    is_correct: false
  - text: No tiene solucion en los reales.
    is_correct: false
  explanation: La alternativa correcta es 'Tiene 2 soluciones reales y distintas (y racionales).'. Al ser $\Delta > 0$ y cuadrado perfecto, posee 2 soluciones reales distintas racionales.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Llevar la ecuación a la forma general $ax^2 + bx + c = 0$.'
- 'Paso 2: Extraer los coeficientes numéricos $a, b, c$.'
- 'Paso 3: Evaluar la fórmula $\Delta = b^2 - 4ac$.'
- 'Paso 4: Clasificar el resultado según sea $\Delta > 0$, $\Delta = 0$ o $\Delta < 0$.'
errores_correccion: '- **Error común:** Escribir $\Delta = \sqrt{b^2 - 4ac}$ incluyendo la raíz cuadrada.

  - **Cómo corregirlo:** El discriminante es **solo el número que está adentro**: $\Delta = b^2 - 4ac$ (sin raíz).'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de coeficientes y Δ'
  enunciado: En $x^2 - 6x + 8 = 0$, ¿cuál es el valor de Δ?
  alternativas:
  - '4'
  - '68'
  - '-4'
  - '2'
  respuesta: '4'
  solucion_pasos:
  - 'Paso 1: $\Delta = (-6)^2 - 4(1)(8) = 36 - 32 = 4$.'
- titulo: 'Ejemplo 2: Ecuación incompleta pura'
  enunciado: Para $2x^2 - 18 = 0$, ¿cuánto vale Δ?
  alternativas:
  - '144'
  - '-144'
  - '36'
  - '0'
  respuesta: '144'
  solucion_pasos:
  - 'Paso 1: $b = 0 \implies \Delta = 0^2 - 4(2)(-18) = +144$.'
- titulo: 'Ejemplo 3: Ecuación incompleta binomia'
  enunciado: En $5x^2 - 10x = 0$, ¿cuánto vale Δ?
  alternativas:
  - '100'
  - '-100'
  - '50'
  - '0'
  respuesta: '100'
  solucion_pasos:
  - 'Paso 1: $c = 0 \implies \Delta = (-10)^2 - 4(5)(0) = 100$.'
- titulo: 'Ejemplo 4: Clasificación rápida'
  enunciado: Si $\Delta = -7$, ¿cuántas soluciones reales tiene la ecuación?
  alternativas:
  - 0 soluciones reales
  - 2 soluciones reales
  - 1 solución real
  - 7 soluciones
  respuesta: 0 soluciones reales
  solucion_pasos:
  - 'Paso 1: $\Delta < 0 \implies$ no tiene raíces en $\mathbb{R}$.'
errores_frecuentes:
- Incluir el símbolo de raíz en la definición del discriminante.
- Confundir el valor del discriminante con el valor de las soluciones.
- Olvidar que a y c multiplican a -4.
afirmaciones_verdaderas:
- El discriminante Δ = b² - 4ac caracteriza la cantidad de raíces reales de una ecuación cuadrática.
- El discriminante es estrictamente un valor numérico real escalar.
al_terminar_debes_poder: '**QUÉ:** Definir y reconocer el discriminante Δ = b² - 4ac de una ecuación cuadrática.


  **CÓMO:** Identificando sus coeficientes y comprendiendo su rol clasificador sobre la naturaleza de las raíces.


