semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DEFINICION
resumen_inicial: 'Definición del discriminante de una ecuación cuadrática: concepto,
  discriminante, soluciones y modelamiento en El discriminante y la naturaleza de
  las raíces.'
explicacion_simple: Antes de resolver por completo una ecuación cuadrática, existe
  un solo número que ya te adelanta cuántas soluciones reales tendrá, sin necesidad
  de calcularlas.
explicacion_formal: '### Definición formal


  Dada la ecuación $ax^2+bx+c=0$ con $a \neq 0$, se define el discriminante como $\Delta
  = b^2-4ac$. Este valor proviene directamente de la expresión bajo la raíz cuadrada
  en la fórmula general, y su signo determina si existen soluciones reales y cuántas.


  ### Desarrollo didáctico


  El discriminante actúa como un "indicador previo": antes de resolver completamente
  la ecuación, calculando solo $b^2-4ac$ ya se sabe si habrá dos soluciones distintas,
  una solución doble, o ninguna solución real.


  En $x^2-5x+6=0$: $\Delta=(-5)^2-4(1)(6)=25-24=1$, un valor positivo, lo que anticipa
  dos soluciones reales distintas.'
definiciones_clave: '- **Definición del discriminante de una ecuación cuadrática**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en definición
  del discriminante de una ecuación cuadrática.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando definición del discriminante
    de una ecuación cuadrática.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a definición del discriminante
    de una ecuación cuadrática.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
