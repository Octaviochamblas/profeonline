procedimiento:
- 'Paso 1: Identifica a qué entidad se le está aplicando el ''cubo''.'
- 'Paso 2: Si es a una variable simple, agrégale el exponente 3 ($a^3$).'
- 'Paso 3: Si es a un polinomio o a un resultado de una operación (ej. la suma de
  dos números), agrupa primero la operación entre paréntesis y pon el exponente 3
  fuera del grupo ($(a+b)^3$).'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción del cubo de un número.
ejemplos:
- titulo: Volumen algebraico
  enunciado: 'Traduce algebraicamente: ''El cubo de la suma entre un número y dos''.'
  solucion_pasos:
  - 'La base que será elevada es la suma de un número y dos: (x + 2).'
  - Se nos pide 'el cubo' de toda esa suma.
  - 'Traducción correcta: (x + 2)^3.'
- titulo: El algoritmo de un software financiero penaliza el riesgo ($R$) según la
    siguiente política
  enunciado: 'El algoritmo de un software financiero penaliza el riesgo ($R$) según
    la siguiente política textual: ''La penalidad es igual al cubo de la diferencia
    entre el riesgo actual y el riesgo base ($B$)''. Si un programador escribió la
    fórmula de penalidad como $P = R^3 - B^3$, ¿qué ocurrirá con el cálculo? (v1)


    Opciones: A) El cálculo será erróneo porque el programador modeló ''la diferencia
    de los cubos''. La traducción correcta para ''el cubo de la diferencia'' requería
    paréntesis: $P = (R - B)^3$. · B) El cálculo será correcto porque $(R - B)^3$
    es idéntico a $R^3 - B^3$. · C) El cálculo fallará porque la penalidad nunca puede
    ser negativa. · D) El cálculo será erróneo porque debió multiplicar por 3.'
  solucion_pasos:
  - La frase 'el cubo de...' exige que el cubo sea la operación principal (exterior).
    Lo de adentro es 'la diferencia'. Queda $(R - B)^3$. El error del programador
    es clásico en álgebra.
  - 'Respuesta: El cálculo será erróneo porque el programador modeló ''la diferencia
    de los cubos''. La traducción correcta para ''el cubo de la diferencia'' requería
    paréntesis: $P = (R - B)^3$.'
- titulo: 'Respecto de «Traducción del cubo de un número»: ¿Describe adecuadamente
    el concepto esta fra'
  enunciado: 'Respecto de «Traducción del cubo de un número»: ¿Describe adecuadamente
    el concepto esta frase? «El **Cubo de un Número** se traduce elevando la variable
    a la potencia de tres ($x^3$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Cubo de un Número** se
    traduce elevando la variable a la potencia de tres ($x^3$).'
- titulo: 'Respecto de «Traducción del cubo de un número»: ¿Se puede aceptar esta
    afirmación? «Confundi'
  enunciado: 'Respecto de «Traducción del cubo de un número»: ¿Se puede aceptar esta
    afirmación? «Confundir el triple ($3x$) con el cubo ($x^3$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Cubo de un Número** se
    traduce elevando la variable a la potencia de tres ($x^3$).'
errores_frecuentes:
- Confundir el triple ($3x$) con el cubo ($x^3$).
- 'Escribir mal el orden de operaciones por falta de paréntesis. (Ej: ''el cubo del
  doble de x'' escrito como $2x^3$ en lugar de $(2x)^3$).'
- Ambas expresiones significan lo mismo en álgebra básica.
- El cubo representa una raíz cúbica, mientras que el triple es una multiplicación.
- El cubo requiere multiplicar la variable por un número impar.
afirmaciones_verdaderas:
- La traducción de traducción del cubo de un número preserva el significado matemático
  del enunciado.
