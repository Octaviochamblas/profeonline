semantic_id: MAT.ALG.LENGUAJE_RELACIONES.CUBO_NUMERO
resumen_inicial: 'Traducción del cubo de un número: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Si el cuadrado era el área de una figura plana, el cubo nos da
  el volumen, la tercera dimensión. Es un crecimiento exponencial aún más acelerado.
explicacion_formal: '### Definición formal


  El triple aumenta el valor de forma progresiva. El cubo ($x \cdot x \cdot x$) lo
  hace de forma volumétrica o exponencial.


  ### Desarrollo didáctico


  Al igual que con el cuadrado, no debemos confundir el múltiplo con la potencia:

  - ''El triple de un número'' $\rightarrow$ $3x$ (multiplicación).

  - ''El cubo de un número'' $\rightarrow$ $x^3$ (potenciación).


  Y la regla de los paréntesis sigue siendo sagrada:

  - ''El cubo de la diferencia'' $\rightarrow$ $(x - y)^3$.

  - ''La diferencia de los cubos'' $\rightarrow$ $x^3 - y^3$.'
definiciones_clave: '- **Traducción del cubo de un número**: Herramienta clave para
  pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción del cubo de un número.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    del cubo de un número.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción del cubo de un número.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
