resumen_inicial: La traducción del cubo de un número permite representar estructuras
  matemáticas de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con traducción del cubo de un número, transformamos
  frases sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Traducción
  del cubo de un número** viene dada por:


  $$\text{"el cubo de un número y disminuido en 8"} \implies y^3 - 8$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Traducción del cubo de un número**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: y^3 - 8 define la estructura
  requerida.'
ejemplo_guiado:
  enunciado: 'Traduzca o exprese según traducción del cubo de un número: ''el cubo
    de un número y disminuido en 8''.'
  pasos:
