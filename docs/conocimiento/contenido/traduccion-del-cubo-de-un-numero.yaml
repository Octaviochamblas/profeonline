errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir traducción
  del cubo de un número.
- Invertir el orden de las variables al construir la expresión de traducción del cubo
  de un número.
- Usar una suma cuando el enunciado de traducción del cubo de un número exige una
  resta o división.
- Omitir paréntesis al multiplicar expresiones en traducción del cubo de un número.
- Declarar que la expresión de traducción del cubo de un número es válida sólo para
  números pares.
afirmaciones_verdaderas:
- La traducción simbólica de traducción del cubo de un número preserva la relación
