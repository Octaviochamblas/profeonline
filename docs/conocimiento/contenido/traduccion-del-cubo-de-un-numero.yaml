semantic_id: MAT.ALG.LENGUAJE_RELACIONES.CUBO_NUMERO
resumen_inicial: La traducción del cubo de un número consiste en representar simbólicamente la elevación de una variable o expresión a la potencia de exponente tres $x^3$.
explicacion_simple: "El **cubo de un número** expresa la multiplicación de esa cantidad por sí misma tres veces mediante una **potencia de exponente 3**:\n- Frases verbales: *\"Un número al cubo\"*, *\"El cubo de $x$\"*, *\"Elevar $x$ a la tercera potencia\"*.\n- Traducción: **$x^3$**.\n- Ejemplo 1: \"El cubo de $x$\" $\\implies **x^3**$.\n- Ejemplo 2: \"El cubo de la suma entre $a$ y $b$\" $\\implies **(a + b)^3**$.\n- Ejemplo 3: \"La suma de los cubos de $a$ y $b$\" $\\implies **a^3 + b^3**$.\n- ** Conservación del signo**: A diferencia del cuadrado, el cubo de un número negativo **sigue siendo NEGATIVO**:\n  - Para $x = -2 \\implies (-2)^3 = (-2)(-2)(-2) = -8$.\n\n![Cubo de un Número](/static/img/nodos/traduccion-del-cubo-de-un-numero-intro.svg)\n"
explicacion_formal: '### Definición formal

  La **operación de elevación al cubo** mapea una cantidad variable $x \in \mathbb{R}$ en la potencia de exponente tres $C(x) \in \mathbb{R}[x]$:


  $$C(x) = x^3 = x \cdot x \cdot x$$


  ### Preservación de la Signatura de la Base

  Dado que el exponente $3$ es un entero impar, la función cubo conserva estrictamente el signo de la base real $x$:


  $$\operatorname{sgn}(x^3) = \operatorname{sgn}(x) \implies \begin{cases} x > 0 \implies x^3 > 0 \\ x < 0 \implies x^3 < 0 \end{cases}$$


  ### Distinción Sintáctica Fundamental

  - **Cubo de la suma de dos cantidades**: $(A + B)^3 = A^3 + 3A^2 B + 3A B^2 + B^3$.

  - **Suma de los cubos de dos cantidades**: $A^3 + B^3 = (A + B)(A^2 - AB + B^2)$.


  ### Síntesis didáctica

  El cubo algebraico representa el volumen de un cubo geométrico de arista $x$, siendo la base de las expresiones cúbicas y la suma o diferencia de cubos notables.

  '
definiciones_clave: '- **Cubo de un número ($x^3$)**: Potencia obtenida al multiplicar una variable o expresión $x$ por sí misma tres veces.

  - **Exponente tres ($3$)**: Cifra en superíndice que indica la tercera potencia de la base.

  - **Preservación del signo**: Propiedad de las potencias impares por la cual la base conserva su signo positivo o negativo.

  '
propiedades_relaciones: '- **Inversión de signo en opuestos**: El cubo de un opuesto es el opuesto del cubo ($(-x)^3 = -x^3$).

  - **Distribución sobre el producto**: El cubo del producto es el producto de los cubos ($(xy)^3 = x^3 y^3$).

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El triple del cubo de un número $a$ disminuido en el cubo de la suma entre $b$ y $c$".'
  pasos:
  - 'Paso 1: Traducimos "El triple del cubo de $a$": El $3$ multiplica al cubo de $a \implies 3a^3$.'
  - 'Paso 2: Traducimos "La suma entre $b$ y $c$": $(b + c)$.'
  - 'Paso 3: Traducimos "El cubo de la suma entre $b$ y $c$": Elevar el paréntesis al cubo $\implies (b + c)^3$.'
  - 'Paso 4: Unimos ambas partes con la resta "disminuido en" $\implies 3a^3 - (b + c)^3$.'
  - 'Conclusión: La expresión traducida es **$3a^3 - (b + c)^3$**.'
  imagen: /static/img/nodos/traduccion-del-cubo-de-un-numero-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué notación algebraica representa la frase verbal "El cubo de un número $x$"? '
  choices:
  - text: 'Se representa elevando la variable al exponente tres: $x^3$'
    is_correct: true
  - text: 'Se representa multiplicando la variable por tres: $3x$'
    is_correct: false
  - text: 'Se representa dividiendo la variable entre tres: $\frac{x}{3}$'
    is_correct: false
  - text: 'Se representa sumando tres a la variable: $x + 3$'
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa elevando la variable al exponente tres: $x^3$''. Potencia cúbica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el cubo de un número negativo como $(-3)^3 = -27$ conserva su signo negativo?
  choices:
  - text: Porque al multiplicar tres factores negativos, el producto de los dos primeros da positivo y al multiplicar por el tercero vuelve a ser negativo
    is_correct: true
  - text: Porque todos los exponentes convierten los números en positivos
    is_correct: false
  - text: Porque el número 3 es un número par
    is_correct: false
  - text: Because $(-3)^3$ es igual a $3 \cdot (-3) = -9$
    is_correct: false
  explanation: La alternativa correcta es 'Porque al multiplicar tres factores negativos, el producto de los dos primeros da positivo y al multiplicar por el tercero vuelve a ser negativo'. Regla de los signos en potencias impares.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable o expresión que actúa como base de la potencia.'
- 'Paso 2: Escribir el superíndice $3$ inmediatamente a la derecha de la base.'
- 'Paso 3: Si la frase expresa "el cubo de [una suma/resta]", colocar primero la suma o resta entre paréntesis $(A \pm B)^3$.'
- 'Paso 4: Si la frase expresa "la suma/resta de los cubos", elevar cada variable individualmente al cubo $A^3 \pm B^3$.'
errores_correccion: '- **Error 1:** Escribir el producto por tres $3x$ al traducir "el cubo de $x$". **Cómo corregirlo:** "El cubo" **eleva al exponente 3 ($x^3$)**; "el triple" multiplica por 3 ($3x$).

  - **Error 2:** Escribir $a^3 + b^3$ al traducir "el cubo de la suma de $a$ y $b$". **Cómo corregirlo:** "El cubo de la suma" **exige paréntesis $(a + b)^3$**, cuya expansión incluye los términos centrales $3a^2 b + 3ab^2$.

  '
ejemplos:
- titulo: Cubo simple
  enunciado: ¿Cuál es la traducción del "Cubo de un número $n$"?
  alternativas:
  - $n^3$
  - $3n$
  - $\frac{n}{3}$
  respuesta: $n^3$
  solucion_pasos:
  - '1. Variable: $n$.'
  - '2. Cubo: $n^3$.'
- titulo: Cubo de una resta
  enunciado: ¿Cuál es la traducción de "El cubo de la diferencia entre $x$ e $y$"?
  alternativas:
  - $(x - y)^3$
  - $x^3 - y^3$
  - $3(x - y)$
  respuesta: $(x - y)^3$
  solucion_pasos:
  - '1. Diferencia: $(x - y)$.'
  - '2. Cubo de la diferencia: $(x - y)^3$.'
- titulo: Evaluación negativa
  enunciado: Para $x = -2$, ¿es el cubo $x^3 = (-2)^3 = -8$ un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, el exponente 3 impar conserva el signo negativo de la base.
- titulo: Triple del cubo
  enunciado: La frase "El triple del cubo de $z$", ¿se traduce como $3z^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el 3 multiplica a la potencia cúbica $z^3 \implies 3z^3$.
errores_frecuentes:
- Escribir la multiplicación por tres 3x al traducir la frase el cubo de un número.
- Escribir a^3 + b^3 al traducir el enunciado el cubo de la suma entre a y b.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que elevar un número negativo al cubo produce siempre un resultado positivo.
- Los paréntesis son excluidos al elevar al cubo la suma de dos variables independientes.
afirmaciones_verdaderas:
- La traducción del cubo de un número eleva a la variable o expresión al exponente 3.
- El cubo de un número negativo conserva el signo negativo de su base real.
al_terminar_debes_poder: '![Resumen de cubo de un número](/static/img/nodos/traduccion-del-cubo-de-un-numero-resumen.svg)


  QUÉ: Traducir la potenciación al cubo de una cantidad simple o binomio.


  CÓMO: Elevar la expresión base al exponente 3 ($x^3$), agrupando binomios entre paréntesis $(a-b)^3$ para preservar la precedencia operacional.'
