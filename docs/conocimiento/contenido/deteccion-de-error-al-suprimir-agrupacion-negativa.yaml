semantic_id: MAT.ALG.AGRUPACION.ERROR_SIGNO_NEGATIVO
resumen_inicial: 'Detección de error al suprimir agrupación negativa: procedimiento
  y reglas en Signos de agrupación.'
explicacion_simple: 'El error más clásico del álgebra pre-universitaria: ver un paréntesis
  con signo negativo, cambiar el primer signo, y dejar los demás igual. Es como detener
  una avalancha solo a la mitad.'
explicacion_formal: '### Definición formal


  La respuesta correcta es $10-4a+2b-c$. El $-$ externo invierte absolutamente todos
  los signos.


  ### Desarrollo didáctico


  La operación errónea más frecuente:

  $5 - (3x - 4y + 2) = 5 - 3x - 4y + 2$ ← INCORRECTO.


  El $-$ delante del paréntesis actúa sobre TODO lo que está adentro:

  $5 - (3x - 4y + 2) = 5 - 3x + 4y - 2$ ← CORRECTO.


  Verificación: $-(+3x) = -3x$, $-(-4y) = +4y$, $-(+2) = -2$.


  Resumen final: $3 - 3x + 4y$.'
definiciones_clave: '- **Detección de error al suprimir agrupación negativa**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a detección de error al suprimir agrupación negativa.'
ejemplo_guiado:
