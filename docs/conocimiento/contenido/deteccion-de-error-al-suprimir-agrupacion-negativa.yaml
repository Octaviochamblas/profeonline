resumen_inicial: La detección de error al suprimir agrupación negativa simplifica
  expresiones complejas eliminando adecuadamente los bloques de agrupación.
explicacion_simple: Al trabajar con detección de error al suprimir agrupación negativa,
  resolvemos primero los signos de agrupación más internos y avanzamos hacia afuera
  cambiando o manteniendo signos según corresponda.
explicacion_formal: 'Dada una estructura anidada o con vínculo, la **Detección de
  error al suprimir agrupación negativa** aplica la regla distributiva progresiva:


  $$\text{"el error en -(3x - 5) = -3x - 5"} \implies El error es no invertir el signo
  de -5 a +5$$


  > **Complemento didáctico:** La resolución rigurosa en niveles respeta el orden
  de alcance de los operadores de agrupación.'
definiciones_clave: '- **Detección de error al suprimir agrupación negativa**: Proceso
  ordenado de eliminación de símbolos de agrupación.'
propiedades_relaciones: '- **Regla de alcance**: Los signos exteriores afectan a la
  totalidad del subárbol de expresiones interiores.'
ejemplo_guiado:
  enunciado: 'Aplique la detección de error al suprimir agrupación negativa a: ''el
    error en -(3x - 5) = -3x - 5''.'
  pasos:
  - 'Paso 1: Identificar el signo de agrupación más interno.'
  - 'Paso 2: Suprimir respetando el signo que lo antecede.'
  - 'Paso 3: Reducir y suprimir los signos de agrupación exteriores.'
  - 'Conclusión: El resultado final es El error es no invertir el signo de -5 a +5.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar detección de error al suprimir agrupación
    negativa en 'el error en -(3x - 5) = -3x - 5'?
  choices:
  - text: El error es no invertir el signo de -5 a +5
    is_correct: true
  - text: El error es cambiar 3x
    is_correct: false
  - text: El error es restar
    is_correct: false
  - text: No hay error
    is_correct: false
  explanation: La alternativa correcta es 'El error es no invertir el signo de -5
    a +5'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el error en -(3x - 5) = -3x - 5', ¿qué expresión
    reducida se obtuvo?
  choices:
  - text: El error es no invertir el signo de -5 a +5
    is_correct: true
  - text: El error es cambiar 3x
    is_correct: false
  - text: El error es restar
    is_correct: false
  - text: No hay error
    is_correct: false
  explanation: La alternativa correcta es 'El error es no invertir el signo de -5
    a +5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Eliminar el nivel más interno de agrupación.'
- 'Paso 2: Cambiar o mantener signos según el signo precedente.'
- 'Paso 3: Continuar hacia los niveles exteriores y reducir.'
errores_correccion: '- **Error 1: Omitir la inversión de signos en niveles internos
  durante detección de error al suprimir agrupación negativa.** **Cómo corregirlo:**
  Verificar el signo de cada nivel al suprimir el bloque correspondiente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de detección de error al suprimir agrupación negativa
    en 'el error en -(3x - 5) = -3x - 5'?
  alternativas:
  - El error es no invertir el signo de -5 a +5
  - El error es cambiar 3x
  - El error es restar
  - No hay error
  respuesta: El error es no invertir el signo de -5 a +5
  solucion_pasos:
  - 1. Eliminar paréntesis de adentro hacia afuera.
  - 2. Obtener El error es no invertir el signo de -5 a +5.
- titulo: Ejemplo 2
  enunciado: Al simplificar 'el error en -(3x - 5) = -3x - 5' por detección de error
    al suprimir agrupación negativa, ¿qué resultado se obtiene?
  alternativas:
  - El error es no invertir el signo de -5 a +5
  - El error es cambiar 3x
  - El error es restar
  - No hay error
  respuesta: El error es no invertir el signo de -5 a +5
  solucion_pasos:
  - 1. Aplicar las reglas de supresión de signos.
  - 2. Concluir El error es no invertir el signo de -5 a +5.
- titulo: ¿Es la simplificación de 'el error en -(3x - 5) = -3x - 5' igual a El error
    es no invertir el signo de -5 a +5?
  respuesta: Sí
  solucion_pasos:
  - Sí, suprimiendo los signos en orden da El error es no invertir el signo de -5
    a +5.
- titulo: ¿Da la supresión en 'el error en -(3x - 5) = -3x - 5' un valor igual a El
    error es cambiar 3x?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es El error es no invertir el signo de -5 a +5.
errores_frecuentes:
- Omitir cambiar los signos interiores al suprimir bloques en detección de error al
  suprimir agrupación negativa.
- Resolver de afuera hacia adentro alterando la prioridad en detección de error al
  suprimir agrupación negativa.
- Multiplicar coeficientes en lugar de distribuir signos negativos.
- Declarar la barra de vínculo con una operación de división.
- Declarar que los corchetes anulan los signos negativos anteriores.
afirmaciones_verdaderas:
- La detección de error al suprimir agrupación negativa exige eliminar primero los
  niveles internos antes que los externos.
- Un signo menos exterior distribuye la inversión de signo a todos los elementos del
  bloque agrupado.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la detección de error
  al suprimir agrupación negativa suprimiendo signos de agrupación ordenadamente de
  adentro hacia afuera.
