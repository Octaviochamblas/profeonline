semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_SECTOR_RADIANES
resumen_inicial: El área de un sector circular con ángulo central en radianes se calcula mediante la fórmula canónica A = (1/2)θr² = (θr²) / 2, equivalente a A = (s · r) / 2.
explicacion_simple: 'Cuando trabajas con ángulos en radianes, la fórmula del área del sector circular se vuelve súper compacta y elegante: **$A = \frac{1}{2} \theta r^2$** (o **$\frac{\theta r^2}{2}$**).


  ¿De dónde sale? Como una vuelta completa son $2\pi$ radianes, la fracción $\frac{\theta}{2\pi} \cdot \pi r^2$ cancela el número $\pi$ por completo, dejando solo el ángulo $\theta$ multiplicado por el radio al cuadrado y dividido entre dos. Y como la longitud de arco en radianes es $s = \theta r$, si sustituyes, recuperas la misma fórmula triangular: **$A = \frac{s \cdot r}{2}$**.


  ![Área de sector en radianes](/static/img/nodos/calculo-del-area-de-un-sector-circular-en-radianes-usando-a-r2-2-intro.svg)

  '
explicacion_formal: '### Deducción analítica en el sistema radial

  Sea $\theta$ la medida en radianes del ángulo central de un sector circular de radio $r$. La proporción respecto al ángulo de revolución completa ($2\pi\text{ rad}$) es:

  $$\frac{A_{\text{sector}}}{\pi r^2} = \frac{\theta}{2\pi} \implies A_{\text{sector}} = \frac{\theta}{2\pi} \cdot \pi r^2 = \frac{1}{2} \theta r^2 = \frac{\theta r^2}{2}$$


  ### Vínculo con la longitud de arco

  Dado que $s = \theta \cdot r$, reescribiendo la expresión:

  $$A_{\text{sector}} = \frac{1}{2} (\theta r) r = \frac{1}{2} s \cdot r = \frac{s \cdot r}{2}$$


  ### Despeje del ángulo central en radianes

  Si se conoce el área del sector $A$ y la longitud del radio $r$:

  $$\theta = \frac{2A}{r^2}$$


  > **Complemento didáctico:** ¡No olvides nunca el factor $\frac{1}{2}$! Muchos estudiantes escriben apurados $A = \theta r^2$, lo que duplica el área real. Recuerda que es idéntica al área de un triángulo: $\frac{\text{base} \times \text{altura}}{2} = \frac{s \cdot r}{2} = \frac{\theta r^2}{2}$.

  '
definiciones_clave: '- **Fórmula $A = \frac{1}{2}\theta r^2$**: Expresión canónica del área del sector en radianes.

  - **Cancelación de pi**: Propiedad notable del sistema radial donde $\pi$ se simplifica en el cociente.

  - **Despeje $\theta = \frac{2A}{r^2}$**: Cálculo del ángulo en radianes a partir del área y el radio.

  '
propiedades_relaciones: '- **Consistencia dimensional**: Como $\theta$ es adimensional, $\theta r^2$ tiene dimensión de área $[L^2]$.

  - **Equivalencia total**: $\frac{1}{2}\theta r^2 = \frac{s \cdot r}{2} = \frac{\alpha}{360^\circ}\pi r^2$.

  - **Razón de áreas**: Dos sectores de igual radio tienen áreas proporcionales a sus ángulos en radianes: $\frac{A_1}{A_2} = \frac{\theta_1}{\theta_2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de área de sector en radianes](/static/img/nodos/calculo-del-area-de-un-sector-circular-en-radianes-usando-a-r2-2-ejemplos.svg)


    Un sector circular tiene un radio de $r = 8\text{ cm}$ y su ángulo central mide $\theta = \frac{\pi}{4}\text{ rad}$. Calcula su área exacta. Además, determina el ángulo central $\theta$ de un sector de radio $r = 6\text{ cm}$ cuya superficie es de $27\text{ cm}^2$.'
  pasos:
  - 'Paso 1: Elevar el radio al cuadrado: $r^2 = 8^2 = 64\text{ cm}^2$.'
  - 'Paso 2: Multiplicar por $\theta = \frac{\pi}{4}$: $64 \cdot \frac{\pi}{4} = 16\pi$.'
  - 'Paso 3: Dividir entre 2: $A = \frac{16\pi}{2} = 8\pi\text{ cm}^2$.'
  - 'Paso 4: Para el segundo ejercicio, despejar $\theta = \frac{2A}{r^2}$: $\theta = \frac{2(27)}{6^2} = \frac{54}{36} = 1,5\text{ radianes}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el área de un sector circular cuando el ángulo central θ está en radianes?
  choices:
  - text: A = (1/2)θr².
    is_correct: true
  - text: A = θr².
    is_correct: false
  - text: A = (1/2)θ²r.
    is_correct: false
  - text: A = 2θr².
    is_correct: false
  explanation: La alternativa correcta es 'A = (1/2)θr².' En el sistema de radianes el área es el semiproducto del ángulo por el radio al cuadrado.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un sector circular tiene un radio de 4 cm y su ángulo mide 2 radianes, ¿cuál es su área?
  choices:
  - text: 16 cm².
    is_correct: true
  - text: 32 cm².
    is_correct: false
  - text: 8 cm².
    is_correct: false
  - text: 16π cm².
    is_correct: false
  explanation: La alternativa correcta es '16 cm².' Aplicando $A = \frac{1}{2}(2)(4^2) = \frac{1}{2}(2)(16) = 16$ cm².
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Asegurarse de que el ángulo central $\theta$ esté en radianes.

  2. Elevar el radio al cuadrado: $r^2$.

  3. Multiplicar $\theta$ por $r^2$ y dividir entre 2: $A = \frac{\theta r^2}{2}$.

  4. Para despejar el ángulo conociendo el área, aplicar $\theta = \frac{2A}{r^2}$.

  '
errores_correccion: '- **Error común 1:** Olvidar dividir por 2 y calcular $\theta r^2$. **Corrección:** La fórmula siempre lleva el factor $1/2$: $A = \frac{1}{2}\theta r^2$.

  - **Error común 2:** Usar la fórmula con ángulos en grados sexagesimales. **Corrección:** Esta fórmula solo es válida en radianes; si está en grados usa $\frac{\alpha}{360^\circ}\pi r^2$.

  '
ejemplos:
- tipo: A
  titulo: Área de sector con ángulo pi tercios
  enunciado: ¿Cuál es el área de un sector circular con radio $r = 6\text{ cm}$ y ángulo central $\theta = \frac{\pi}{3}\text{ rad}$?
  alternativas:
  - text: $6\pi\text{ cm}^2$.
    is_correct: true
  - text: $12\pi\text{ cm}^2$.
    is_correct: false
  - text: $36\pi\text{ cm}^2$.
    is_correct: false
  - text: $3\pi\text{ cm}^2$.
    is_correct: false
  explicacion: $A = \frac{1}{2} \left(\frac{\pi}{3}\right) (6^2) = \frac{1}{6}\pi(36) = 6\pi\text{ cm}^2$.
- tipo: B
  titulo: Relación de área y arco
  enunciado: ¿Es el área de un sector circular en radianes igual a (s · r) / 2, donde s = θr es la longitud del arco?
  respuesta: Sí
  explicacion: Sí. Sustituyendo $\theta r = s$ en $A = \frac{1}{2}\theta r^2$ se obtiene directamente $A = \frac{s \cdot r}{2}$.
errores_frecuentes:
- '''Olvidar dividir entre dos calculando $\theta r^2$ en lugar de $\frac{1}{2}\theta r^2$.'''
- '''Introducir ángulos en grados en la fórmula $A = \frac{1}{2}\theta r^2$ sin convertirlos a radianes.'''
- '''Elevar al cuadrado el ángulo en lugar del radio ($A \neq \frac{1}{2}\theta^2 r$).'''
afirmaciones_verdaderas:
- '''El área de un sector circular con ángulo central en radianes es $A = \frac{1}{2}\theta r^2$.'''
- '''El área del sector circular en radianes equivale al semiproducto de la longitud de su arco y su radio ($A = \frac{s \cdot r}{2}$).'''
- "'El ángulo central en radianes se obtiene duplicando el área y dividiendo por el radio al cuadrado ($\theta = \\frac{2A}{r^2}$).'"
al_terminar_debes_poder: '**QUÉ:** Calcular el área de sectores circulares en radianes y despejar el ángulo central correspondiente.


  **CÓMO:** Aplicando $A = \frac{1}{2}\theta r^2 = \frac{s \cdot r}{2}$ y $\theta = \frac{2A}{r^2}$.


  ![Síntesis de área en radianes](/static/img/nodos/calculo-del-area-de-un-sector-circular-en-radianes-usando-a-r2-2-resumen.svg)

  '
