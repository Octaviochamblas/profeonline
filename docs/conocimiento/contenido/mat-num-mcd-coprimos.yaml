semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.COPRIMOS_CONCEPTO
resumen_inicial: "Dos números son coprimos (o primos entre sí) si su único divisor común es el 1, es decir, si su MCD es 1."
explicacion_simple: |
  Imagina que tienes dos llaves diferentes y quieres ver si alguna de sus ranuras coincide.
  A veces no encuentras ningún patrón común. En matemáticas, cuando dos números no
  comparten ningún divisor más que el 1, les llamamos **números coprimos**. Esto no
  significa que sean primos individualmente: el 8 y el 9 son compuestos, pero su único
  divisor común es 1, así que son coprimos.
explicacion_formal: |
  Dos números $a$ y $b$ son **coprimos** (o primos relativos) si $\text{MCD}(a,b)=1$, es
  decir, no existe ningún primo que divida a ambos a la vez. No requiere que los números
  sean individualmente primos: para $8$ y $15$, divisores $\{1,2,4,8\}$ y $\{1,3,5,15\}$,
  el único común es $1$. Dos números consecutivos siempre son coprimos, y una fracción
  $\frac{a}{b}$ es irreducible si y solo si $a$ y $b$ son coprimos.
definiciones_clave: |
  **Coprimos (primos relativos)**: dos números cuyo único divisor común positivo es el 1,
  sin importar si son individualmente primos o compuestos.
propiedades_relaciones: |
  Cualquier pareja de números primos distintos es siempre coprima. Dos números pares
  nunca pueden ser coprimos, porque ambos comparten al 2 como divisor.
ejemplo_guiado:
  enunciado: "Determina si 21 y 25 son coprimos."
  pasos:
    - "Divisores de 21: $\\{1,3,7,21\\}$. Divisores de 25: $\\{1,5,25\\}$."
    - "El único divisor común es 1."
    - "Conclusión: $\\text{MCD}(21,25)=1$, por lo que 21 y 25 son coprimos."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Es necesario que ambos números sean individualmente primos para ser coprimos?"
    choices:
      - {text: "No, basta con que su único divisor común sea el 1", is_correct: true}
      - {text: "Sí, ambos deben ser primos", is_correct: false}
      - {text: "Solo uno de los dos debe ser primo", is_correct: false}
      - {text: "Deben ser ambos pares", is_correct: false}
    explanation: "La correcta es No, basta con que su único divisor común sea el 1: por ejemplo, 8 y 9 son compuestos pero coprimos."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿son 16 y 24 coprimos?"
    choices:
      - {text: "No, su MCD es 8", is_correct: true}
      - {text: "Sí, su MCD es 1", is_correct: false}
      - {text: "Sí, porque ambos son compuestos", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, su MCD es 8: divisores de 16 son $1,2,4,8,16$ y de 24 son $1,2,3,4,6,8,12,24$; comparten más de solo el 1."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica los dos números que deseas analizar.'
  - 'Paso 2: Calcula el Máximo Común Divisor (MCD) de ambos números utilizando cualquier método (listado, tabla o descomposición prima).'
  - 'Paso 3: Si el MCD es igual a 1, concluye que los números son coprimos (primos entre sí). Si el MCD es mayor que 1, concluye que no son coprimos.'
errores_correccion: |
  Un error frecuente es creer que ambos números deben ser individualmente primos para
  ser coprimos. Otro error es pensar que dos números impares son automáticamente coprimos
  sin verificar su MCD.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Determina si los números $9$ y $16$ son coprimos.
    alternativas:
      - "Sí, su MCD es 1"
      - "No, su MCD es 3"
      - "No se puede determinar"
    respuesta: "Sí, su MCD es 1"
    solucion_pasos:
      - 'Paso a: Listamos los divisores de $9$: $\{1, 3, 9\}$.'
      - 'Paso b: Listamos los divisores de $16$: $\{1, 2, 4, 8, 16\}$.'
      - 'Paso c: Buscamos los divisores comunes, que es únicamente el $\{1\}$.'
      - 'Paso d: Dado que el $\text{MCD}(9, 16) = 1$, los números $9$ y $16$ son coprimos.'
  - titulo: Ejemplo 2
    enunciado: Verifica si $12$ y $21$ son coprimos.
    alternativas:
      - "No, su MCD es 3"
      - "Sí, su MCD es 1"
      - "No se puede determinar"
    respuesta: "No, su MCD es 3"
    solucion_pasos:
      - 'Paso a: Buscamos los divisores comunes de $12$ y $21$.'
      - 'Paso b: Vemos que el número $3$ divide de forma exacta a ambos ($12 \div 3 = 4$ y $21 \div 3 = 7$).'
      - 'Paso c: Al ser $3$ un divisor común mayor que $1$, el $\text{MCD}(12, 21)$ es al menos $3$ (de hecho, es exactamente $3$).'
      - 'Paso d: Como el MCD es diferente de $1$, concluimos que $12$ y $21$ no son coprimos.'
  - titulo: '¿Son los números consecutivos $14$ y $15$ coprimos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Los divisores de $14$ son $\{1, 2, 7, 14\}$.'
      - 'Los divisores de $15$ son $\{1, 3, 5, 15\}$.'
      - 'El único divisor que comparten es el $1$. Su MCD es $1$, por lo que son coprimos.'
      - 'Esto cumple con la propiedad general de que dos números consecutivos cualesquiera siempre son coprimos.'
  - titulo: '¿Dos números pares distintos pueden ser coprimos?'
    respuesta: 'No'
    solucion_pasos:
      - 'Todos los números pares son divisibles por $2$.'
      - 'Si tomamos dos números pares distintos, ambos tendrán al menos al $2$ como divisor común.'
      - 'Por lo tanto, su MCD será como mínimo $2$, lo que impide que sea $1$. Así, nunca pueden ser coprimos.'
errores_frecuentes:
  - Creer que para ser coprimos, ambos números deben ser individualmente números primos (por ejemplo, pensar erróneamente que 8 y 9 no son coprimos porque son compuestos).
  - Pensar que si dos números son impares, automáticamente son coprimos (por ejemplo, 9 y 15 son impares pero no coprimos, ya que su MCD es 3).
  - Confundir el concepto de coprimos con el de números primos en general.
  - Asegurar que el MCD de dos números coprimos es 0 en lugar de 1.
  - Olvidar verificar todos los divisores comunes, concluyendo que son coprimos al no detectar un factor común oculto (como el 7 en 14 y 35).
afirmaciones_verdaderas:
  - "Dos números coprimos tienen MCD igual a 1."
  - "8 y 15 son números coprimos, aunque ambos sean compuestos."
al_terminar_debes_poder: |
  Determinar si dos números son coprimos calculando su MCD, y explicar por qué no
  necesitan ser individualmente primos.
fuente: Teoría de Números
estado: publicado
