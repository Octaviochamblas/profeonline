semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.COPRIMOS_CONCEPTO
resumen_inicial: 'Dos enteros $a$ y $b$ son coprimos (o primos relativos) si su único
  divisor común positivo es el 1: $\operatorname{MCD}(a, b) = 1$.'
explicacion_simple: Dos números son coprimos o primos entre sí cuando no comparten
  ningún divisor aparte del 1. Esto no exige que los números sean primos por separado;
  por ejemplo, el 8 y el 9 son números compuestos, pero son coprimos entre sí porque
  no comparten ningún factor común excepto el 1.
explicacion_formal: 'Dos enteros $a, b \in \mathbb{Z}$ se definen formalmente como
  **Coprimos** (o Primos Relativos) si y solo si:


  $$\operatorname{MCD}(a, b) = 1 \quad \iff \quad D^+(a) \cap D^+(b) = \{1\}$$


  **Desglose de la fórmula:**

  - $\operatorname{MCD}(a, b) = 1$: El máximo común divisor es exactamente la unidad.

  - $D^+(a) \cap D^+(b) = \{1\}$: Intersección trivial compuesta únicamente por el
  número 1.


  > **Complemento didáctico:** Dos números consecutivos cualesquiera $n$ y $n+1$ son
  siempre coprimos ($\operatorname{MCD}(n, n+1) = 1$).'
definiciones_clave: '- **Números coprimos (primos relativos)**: Par de enteros cuyo
  M.C.D. es estrictamente igual a 1.

  - **Intersección trivial**: Situación donde la única coincidencia entre los divisores
  es el número 1.'
ejemplo_guiado:
  enunciado: Verifique si los enteros $8$ y $15$ son coprimos calculando su $\operatorname{MCD}$.
  pasos:
  - 'Paso 1: Obtener los divisores de 8: $D^+(8) = \{1, 2, 4, 8\}$.'
  - 'Paso 2: Obtener los divisores de 15: $D^+(15) = \{1, 3, 5, 15\}$.'
  - 'Paso 3: Intersectar conjuntos de divisores: $D^+(8) \cap D^+(15) = \{1\}$.'
  - 'Paso 4: Calcular el M.C.D.: $\operatorname{MCD}(8, 15) = 1$.'
  - 'Conclusión: Como su único divisor común es 1, $8$ y $15$ son números coprimos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir dos enteros a y b para clasificarse como
    coprimos?
  choices:
  - text: Que su máximo común divisor sea exactamente igual a 1 (MCD = 1)
    is_correct: true
  - text: Que ambos sean números primos
    is_correct: false
  - text: Que su suma sea un número par
    is_correct: false
  - text: Que uno sea divisible por el otro
    is_correct: false
  explanation: La alternativa correcta es 'Que su máximo común divisor sea exactamente
    igual a 1 (MCD = 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 8 y 15 son coprimos si ambos son números
    compuestos?
  choices:
  - text: Porque no comparten ningún divisor en común excepto la unidad 1
    is_correct: true
  - text: Porque 8 es par y 15 es impar
    is_correct: false
  - text: Porque la resta entre ellos da 7
    is_correct: false
  - text: Es un error, no pueden ser coprimos
    is_correct: false
  explanation: La alternativa correcta es 'Porque no comparten ningún divisor en común
    excepto la unidad 1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular los conjuntos de divisores de ambos números.'
- 'Paso 2: Determinar la intersección de divisores comunes.'
- 'Paso 3: Declarar que son coprimos si la intersección contiene únicamente al número
  1.'
errores_correccion: '- **Error 1: Creer que para ser coprimos ambos números deben
  ser primos individuales.** **Cómo corregirlo:** Números compuestos como 8 y 9 son
  coprimos entre sí porque $\operatorname{MCD}(8,9)=1$.


  - **Error 2: Pensar que dos números pares pueden ser coprimos.** **Cómo corregirlo:**
  Dos números pares comparten al menos el divisor 2, por lo que NUNCA son coprimos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Son 14 y 25 números coprimos?
  alternativas:
  - Sí, porque MCD(14, 25) = 1
  - No, porque no son primos
  - No, porque ambos son pares
  respuesta: Sí, porque MCD(14, 25) = 1
  solucion_pasos:
  - 'Divisores 14: {1,2,7,14}. Divisores 25: {1,5,25}. Su único divisor común es 1.'
- titulo: Ejemplo 2
  enunciado: ¿Son dos enteros consecutivos cualesquiera siempre coprimos?
  alternativas:
  - Sí, MCD(n, n+1) = 1 siempre
  - No, solo si son impares
  - Nunca
  respuesta: Sí, MCD(n, n+1) = 1 siempre
  solucion_pasos:
  - La diferencia entre dos consecutivos es 1, por lo que ningún entero $>1$ puede
    dividirlos a ambos.
- titulo: ¿Son 20 y 21 números coprimos?
  respuesta: Sí
  solucion_pasos:
  - Sí, son enteros consecutivos por lo que $\operatorname{MCD}(20, 21) = 1$.
- titulo: ¿Pueden dos números pares distintos ser coprimos?
  respuesta: 'No'
  solucion_pasos:
  - No, al ser pares ambos son divisibles por 2, por ende su $\operatorname{MCD} \ge
    2$.
errores_frecuentes:
- Dos números son coprimos solo si cada uno de ellos es individualmente un número
  primo.
- Dos números pares consecutivos pueden clasificarse como números coprimos.
- Si dos números son coprimos su mínimo común múltiplo da como resultado cero.
- El concepto de números coprimos se aplica únicamente a números menores que 10.
- La fracción formada por dos números coprimos no se encuentra simplificada al máximo.
afirmaciones_verdaderas:
- Dos enteros son coprimos (primos relativos) si su único divisor común positivo es
  el 1.
- Dos números enteros consecutivos $n$ y $n+1$ son siempre números coprimos.
al_terminar_debes_poder: Al terminar serás capaz de identificar y justificar si dos
  enteros son coprimos, verificando que su máximo común divisor sea estrictamente
  igual a 1.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
