semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.SUMA_ANGULOS_SENO
resumen_inicial: 'Identidad del seno de una suma de ángulos: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: El seno de una suma de ángulos no es la suma de los senos; existe
  una fórmula específica que combina seno y coseno de ambos ángulos.
explicacion_formal: '![Seno de una suma de ángulos](/static/img/geometria/trigonometria/trigid-suma-angulos-seno.svg)


  ### Definición formal


  Para ángulos $\alpha$ y $\beta$ cualesquiera, $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$.


  ### Desarrollo didáctico


  En la figura, α=20° y β=35°, con suma α+β=55°. Se puede verificar que sin55°=sin20°cos35°+cos20°sin35°,
  en vez de sumar directamente sin20°+sin35° (que daría un resultado distinto e incorrecto).'
definiciones_clave: '- **Identidad del seno de una suma de ángulos**: Elemento o propiedad
  fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identidad del seno de una suma de ángulos.'
ejemplo_guiado:
  enunciado: Para analizar identidad del seno de una suma de ángulos, considera un
    ángulo $\alpha = 16^\circ$ ubicado en la posición dada. Determina el valor de
    la medida asociada sabiendo que $x + 1395^\circ = 16^\circ$.
  pasos:
  - Identificar la propiedad de identidad del seno de una suma de ángulos referida
    a $\alpha = 16^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1395 = 16 \implies x = 16 - 1395$.'
  - Concluir que la medida calculada para identidad del seno de una suma de ángulos
    es $x = -1379^\circ$.
