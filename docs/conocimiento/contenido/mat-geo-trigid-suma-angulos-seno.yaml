procedimiento:
- 'Paso 1: Identifica los dos ángulos α y β que se están sumando.'
- 'Paso 2: Aplica la fórmula sin(α+β)=sinα·cosβ+cosα·sinβ, sustituyendo los valores
  conocidos.'
- 'Paso 3: Calcula el resultado, verificando que no sea simplemente la suma de los
  senos por separado.'
