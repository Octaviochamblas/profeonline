semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.SEIS_AREAS_EQUIVALENTES
resumen_inicial: 'División del triángulo en seis áreas equivalentes por sus transversales
  de gravedad: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: Al trazar las tres transversales de gravedad de un triángulo,
  la figura queda dividida en seis regiones triangulares que, sorprendentemente, tienen
  todas exactamente la misma área.
explicacion_formal: '![División en seis triángulos de área equivalente](/static/img/geometria/elementos-secundarios/transversal-baricentro-seis-areas-equivalentes.svg)


  ### Definición formal


  Si se trazan las tres transversales de gravedad de un triángulo ABC, los seis triángulos
  formados (con vértice común en el baricentro G) tienen todos la misma área, igual
  a 1/6 del área del triángulo original.


  ### Desarrollo didáctico


  Si el triángulo original tiene área 24, cada uno de los seis triángulos formados
  por las transversales de gravedad tiene área 24/6=4.'
definiciones_clave: '- **División del triángulo en seis áreas equivalentes por sus
  transversales de gravedad**: Elemento o propiedad fundamental en el estudio de elementos
  secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
