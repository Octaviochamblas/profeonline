semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_11
resumen_inicial: Un número es divisible por 11 si la diferencia entre la suma de las cifras de posición par e impar es 0 o un múltiplo de 11.
explicacion_simple: 'El criterio de divisibilidad por 11 nos permite determinar rápidamente si un número entero se puede dividir exactamente por dicho valor sin necesidad de realizar la división larga completa. Aplicamos una regla sobre las cifras del número.


  ![Criterio de divisibilidad por 11](/static/img/nodos/criterio-de-divisibilidad-por-11-intro.svg)'
explicacion_formal: 'Un entero $n$ es divisible por $11$ si y solo si la suma alterna de sus dígitos $S_a = a_0 - a_1 + a_2 - a_3 + \dots$ es divisible por $11$.


  $$S_a = \sum_{i=0}^k (-1)^i a_i \equiv 0 \pmod{11}$$


  > **Complemento didáctico:** Los criterios de divisibilidad son simplificaciones algebraicas basadas en la aritmética modular sobre las potencias de 10.'
definiciones_clave: '- **Criterio de divisibilidad**: Regla rápida sobre las cifras de un número para verificar si la división es exacta.'
propiedades_relaciones: '- **Aritmética modular**: Simplificación de cálculos al trabajar con residuos de potencias de 10.'
ejemplo_guiado:
  enunciado: 'Aplique el criterio de divisibilidad por 11 para verificar si la cifra dada cumple la condición.


    ![Ejemplo Criterio de divisibilidad por 11](/static/img/nodos/criterio-de-divisibilidad-por-11-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el procedimiento del criterio: calcular la suma alterna de cifras.'
  - 'Paso 2: Aplicar la prueba: 2.816 es divisible por 11 porque $(6 + 8) - (1 + 2) = 14 - 3 = 11$, y 11 es múltiplo de 11..'
  - 'Conclusión: El número cumple el criterio de divisibilidad.'
