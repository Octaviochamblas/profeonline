- titulo: Ejemplo 2
  enunciado: Verifique si la afirmación 'El número 1.331 es divisible por 11.' es verdadera o falsa.
  alternativas:
  - Verdadera
  - Falsa
  - Depende del día
  respuesta: Verdadera
  solucion_pasos:
  - Se aplica el criterio para corroborar la validez de la proposición.
- titulo: ¿Permite este criterio evaluar la divisibilidad sin realizar la división larga?
  respuesta: Sí
  solucion_pasos:
  - Sí, los criterios simplifican el proceso de verificación de divisibilidad.
  alternativas:
  - texto: Sí
    es_correcta: true
