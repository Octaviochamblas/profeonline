- titulo: ¿Aplica la regla de sumar dígitos para el criterio de divisibilidad por 2?
  respuesta: 'No'
  solucion_pasos:
  - No, el criterio del 2 evalúa únicamente la última cifra par, no la suma de dígitos.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
errores_frecuentes:
- Un número es divisible por 11 si sus dos últimas cifras son 11.
- Los criterios de divisibilidad se pueden aplicar únicamente a números enteros de dos dígitos.
- El criterio de divisibilidad por 11 requiere realizar la división larga completa en todos los casos.
- Un número impar puede ser divisible por un número par según los criterios de divisibilidad.
- Aplicar un criterio de divisibilidad cambia el valor numérico del número original.
afirmaciones_verdaderas:
- Un número es divisible por 11 si la diferencia entre la suma de sus dígitos en posiciones pares e impares es 0 o múltiplo de 11.
- Los criterios de divisibilidad permiten verificar la divisibilidad exacta de forma rápida sin hacer la división larga.
al_terminar_debes_ponder: Al terminar serás capaz de aplicar el criterio de divisibilidad por 11, calculando la diferencia entre la suma de cifras en posiciones pares e impares y verificando que sea 0 o múltiplo de 11.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
al_terminar_debes_poder: '**QUÉ:** Evaluar la divisibilidad por 11 mediante el algoritmo de suma con signos alternados.


  **CÓMO:** Calculando la diferencia entre la suma de cifras de posición impar y la suma de cifras de posición par (desde la derecha) y verificando que el resultado sea 0 o múltiplo de 11.


  ![Resumen Criterio de divisibilidad por 11](/static/img/nodos/criterio-de-divisibilidad-por-11-resumen.svg)'
