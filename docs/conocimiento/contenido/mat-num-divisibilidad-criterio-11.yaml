procedimiento:
- 'Paso 1: Aplicar la regla específica del criterio: calcular la suma alterna de cifras.'
- 'Paso 2: Evaluar el resultado simplificado obtenido.'
- 'Paso 3: Concluir que el número es divisible si el resultado simplificado cumple la norma.'
errores_correccion: '- **Error 1: Un número es divisible por 11 si sus dos últimas cifras son 11.** **Cómo corregirlo:** Aplicar estrictamente la regla del criterio sobre las cifras especificadas en la definición formal.


  - **Error 2: Confundir los criterios de distintos números.** **Cómo corregirlo:** Memorizar la regla específica de cada divisor.'
