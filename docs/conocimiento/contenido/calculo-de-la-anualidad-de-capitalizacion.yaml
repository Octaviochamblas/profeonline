procedimiento:
- 'Paso 1: Identifica si el problema involucra un único movimiento de dinero (fórmula
  de interés compuesto tradicional) o pagos/depósitos repetitivos constantes.'
- 'Paso 2: Si son cuotas fijas repetitivas a lo largo del tiempo, clasifícalo conceptualmente
  como una Anualidad.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de
  la anualidad de capitalización.
ejemplos:
- titulo: Identificando la anualidad
  enunciado: Si depositas $2.000.000 hoy y no lo tocas en 5 años, ¿es una anualidad?
    Si depositas $50.000 mensuales por 5 años, ¿es una anualidad?
  solucion_pasos:
  - El depósito de $2.000.000 es un pago único. NO es anualidad.
  - El depósito de $50.000 mensuales es una sucesión de pagos constantes. SÍ es una
    anualidad (anualidad mensual).
errores_frecuentes:
- Creer que la palabra 'Anualidad' solo se aplica a pagos que ocurren en diciembre
  o una vez al año.
- Tratar de calcular el monto final de depósitos sucesivos usando la fórmula simple
  $M = C(1+i)^t$.
afirmaciones_verdaderas:
- La propiedad de cálculo de la anualidad de capitalización preserva la consistencia
  lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren cálculo de la
  anualidad de capitalización.
