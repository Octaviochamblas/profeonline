procedimiento:
- 'Paso 1: Identifica si el problema involucra un único movimiento de dinero (fórmula de interés
  compuesto tradicional) o pagos/depósitos repetitivos constantes.'
- 'Paso 2: Si son cuotas fijas repetitivas a lo largo del tiempo, clasifícalo conceptualmente
  como una Anualidad.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de la anualidad
  de capitalización.
ejemplos:
- titulo: Identificando la anualidad
  enunciado: Si depositas $2.000.000 hoy y no lo tocas en 5 años, ¿es una anualidad? Si depositas
    $50.000 mensuales por 5 años, ¿es una anualidad?
  solucion_pasos:
  - El depósito de $2.000.000 es un pago único. NO es anualidad.
  - El depósito de $50.000 mensuales es una sucesión de pagos constantes. SÍ es una anualidad
    (anualidad mensual).
- titulo: Ejemplo 2
  enunciado: ¿Cuál situación describe una anualidad?
  alternativas:
  - El pago mensual del dividendo de una casa
  - Un depósito único de 5.000.000 de pesos
  - La venta de un auto usado
  respuesta: El pago mensual del dividendo de una casa
  solucion_pasos:
  - Es una serie de pagos periódicos iguales.
- titulo: ¿El descuento mensual de un sueldo para la AFP es un ejemplo de anualidad?
  respuesta: Sí
  solucion_pasos:
  - Es un aporte periódico constante, aunque se descuente mes a mes y no una vez al año.
- titulo: ¿Un único depósito de dinero que se deja creciendo por años sin más aportes es una
    anualidad?
  respuesta: 'No'
  solucion_pasos:
  - Una anualidad requiere una serie de pagos o depósitos repetidos, no un solo movimiento.
errores_frecuentes:
- Creer que la palabra 'Anualidad' solo se aplica a pagos que ocurren en diciembre o una vez
  al año.
- Tratar de calcular el monto final de depósitos sucesivos usando la fórmula simple $M = C(1+i)^t$.
- Creer que la palabra anualidad solo se aplica a pagos que ocurren una vez al año.
- Tratar de calcular el monto final de depósitos sucesivos usando la fórmula simple del interés
  compuesto de un único monto.
- Confundir un pago único grande con una serie de pagos periódicos constantes.
afirmaciones_verdaderas:
- La propiedad de cálculo de la anualidad de capitalización preserva la consistencia lógica.
- Una anualidad no significa necesariamente un pago anual; es el nombre matemático para cualquier
  serie de pagos o depósitos periódicos iguales.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de la anualidad
  de capitalización.
