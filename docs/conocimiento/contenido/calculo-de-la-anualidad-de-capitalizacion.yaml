semantic_id: MAT.NUM.INTERES_COMPUESTO.ANUALIDAD_CAPITALIZACION
resumen_inicial: 'El cálculo de la anualidad de capitalización determina la cuota fija periódica $R$ depositada regularmente para acumular un valor futuro meta $M$ a interés compuesto: $R = M \cdot \frac{i}{(1 + i)^n - 1}$.'
explicacion_simple: |
  Una **anualidad o imposición de capitalización** es un plan de ahorro donde depositas una cuota fija de dinero $R$ (por ejemplo, todos los meses o todos los años) para alcanzar una meta de dinero al final ($M$).
  - Como cada depósito entra en momentos distintos, las cuotas más antiguas ganan más intereses que las más nuevas.
  - La suma de todas las cuotas con sus respectivos intereses acumulados da el **monto final de la anualidad**:
    $$M = R \cdot \left[\frac{(1 + i)^n - 1}{i}\right]$$
  - Si quieres saber **cuánto debes depositar en cada cuota $R$** para juntar $M$, despejas: $R = M \cdot \frac{i}{(1 + i)^n - 1}$.
explicacion_formal: |
  ### Definición formal
  Una **anualidad ordinaria de capitalización (o imposición)** es una serie uniforme de $n$ depósitos de cuantía constante $R$ realizados al término de cada período, que se acumulan a una tasa de interés efectiva $i$:
  $$M = R + R(1 + i) + R(1 + i)^2 + \dots + R(1 + i)^{n-1}$$
  Esta expresión es la suma de los $n$ términos de una **progresión geométrica** de primer término $R$ y razón $q = 1 + i$:
  $$M = R \cdot \left[\frac{(1 + i)^n - 1}{i}\right]$$

  ### Despeje de la Cuota Periódica ($R$)
  Invertiendo el factor de la serie geométrica de acumulación:
  $$R = M \cdot \left[\frac{i}{(1 + i)^n - 1}\right]$$
  donde:
  - $R$ es la **cuota fija constante por período**.
  - $M$ es el **monto futuro acumulado deseado**.
  - $i$ es la tasa de interés periódica efectiva.
  - $n$ es el número total de depósitos o cuotas.

  ### Síntesis didáctica
  - Ecuación del monto total acumulado: $M = R \cdot \frac{(1 + i)^n - 1}{i}$.
  - Ecuación de la cuota periódica: $R = M \cdot \frac{i}{(1 + i)^n - 1}$.
definiciones_clave: |
  - **Anualidad de capitalización ($R$)**: Depósito constante y periódico realizado con el propósito de formar un capital futuro.
  - **Factor de imposición ($\frac{(1+i)^n - 1}{i}$)**: Operador multiplicativo de la serie geométrica de ahorro.
  - **Suma de progresión geométrica**: Herramienta matemática empleada para consolidar el valor futuro de depósitos múltiples.
propiedades_relaciones: |
  - **Efecto multiplicativo del ahorro sostenido**: El monto total acumulado $M$ es estrictamente mayor que la suma simple de los depósitos ($M > n \cdot R$) debido a los intereses ganados por cada cuota.
  - **Ventaja de las cuotas tempranas**: La primera cuota depositada es la que genera la mayor cantidad de interés acumulado por permanecer expuesta durante $n-1$ períodos.
ejemplo_guiado:
  enunciado: 'Una persona desea juntar un monto de $\$3.100.000$ en $3$ años mediante depósitos anuales iguales $R$ al final de cada año, a una tasa del $10\%$ anual de interés compuesto. Datos: $(1,10)^3 = 1,331$. Calcula el valor de la cuota anual $R$.'
  pasos:
    - 'Paso 1: Identificamos $M = 3.100.000$, $i = 0,10$ y $n = 3$.'
    - 'Paso 2: Evaluamos el factor de imposición: $\frac{(1,10)^3 - 1}{0,10} = \frac{1,331 - 1}{0,10} = \frac{0,331}{0,10} = 3,31$.'
    - 'Paso 3: Sustituimos en $M = R \cdot 3,31 \implies 3.100.000 = R \cdot 3,31$.'
    - 'Paso 4: Despejamos la cuota $R = \frac{3.100.000}{3,31} \approx 936.556$. Debe depositar **apróximadamente $\$936.556$ anuales**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la cuota constante periódica $R$ necesaria para acumular un monto objetivo $M$ a interés compuesto?'
    choices:
      - {text: 'Multiplicar el monto por la tasa y dividir por el factor neto ($R = M \cdot \frac{i}{(1 + i)^n - 1}$)', is_correct: true}
      - {text: 'Dividir el monto entre el número de años únicamente', is_correct: false}
      - {text: 'Multiplicar el monto por el número de cuotas $n$', is_correct: false}
      - {text: 'Restar la tasa decimal al monto objetivo', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar el monto por la tasa y dividir por el factor neto ($R = M \cdot \frac{i}{(1 + i)^n - 1}$)''. Se despeja $R$ de la suma geométrica.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se realizan $2$ depósitos anuales de $\$100.000$ al $10\%$ anual compuesto, ¿cuál es el monto final acumulado al término del segundo año?'
    choices:
      - {text: '$\$210.000$, pues la primera cuota rinde $\$110.000$ y la segunda cuota recién ingresada aporta $\$100.000$', is_correct: true}
      - {text: '$\$200.000$, sumando sin intereses', is_correct: false}
      - {text: '$\$220.000$, aplicando el 10% a ambas cuotas por dos años', is_correct: false}
      - {text: '$\$100.000$, considerando solo una cuota', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$210.000$, pues la primera cuota rinde $\$110.000$ y la segunda cuota recién ingresada aporta $\$100.000$''. $M = 100.000(1,10) + 100.000 = 210.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el monto objetivo $M$, la tasa por período $i$ y el número total de depósitos $n$.'
  - 'Paso 2: Calcular el factor de imposición $\frac{(1 + i)^n - 1}{i}$.'
  - 'Paso 3: Dividir el monto objetivo $M$ entre el factor de imposición para despejar la cuota $R$.'
  - 'Paso 4: Verificar que el total abonado $n \cdot R$ sea inferior al monto acumulado $M$.'
errores_correccion: |
  - **Error 1:** Dividir el monto objetivo $M$ simplemente por el número de cuotas $n$ ($M/n$). **Cómo corregirlo:** Las cuotas ganan intereses; **debes aplicar la fórmula de la serie geométrica de capitalización**.
  - **Error 2:** Asumir que todas las cuotas ganan la misma cantidad de interés. **Cómo corregirlo:** La primera cuota pasa más tiempo guardada y **gana más intereses que las cuotas posteriores**.
ejemplos:
  - titulo: 'Monto acumulado con 2 cuotas de $100'
    enunciado: 'Para $R = \$100$ e $i = 10\%$ a 2 períodos, ¿el monto es $M = 100 \cdot \frac{1,10^2 - 1}{0,10} = 100 \cdot 2,1 = \$210$?'
    alternativas:
      - 'Sí, pues $100 \cdot 2,1 = 210$'
      - 'No, es $\$200$'
      - 'No, es $\$220$'
    respuesta: 'Sí, pues $100 \cdot 2,1 = 210$'
    solucion_pasos:
      - '1. Factor: $(1,21 - 1) / 0,10 = 0,21 / 0,10 = 2,1$.'
      - '2. Monto: $100 \cdot 2,1 = \$210$.'
  - titulo: 'Cuota para alcanzar $210'
    enunciado: 'En el caso anterior, para juntar $M = \$210$ en 2 períodos al $10\%$, ¿la cuota es $R = 210 / 2,1 = \$100$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $R = M / 2,1 = \$100$.'
  - titulo: 'Ahorro simple vs compuesto en cuotas'
    enunciado: '¿El monto acumulado $M$ supera a la suma de depósitos $n \cdot R$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La diferencia $M - n \cdot R$ representa los intereses ganados por las cuotas.'
  - titulo: 'Efecto de aumentar la cuota'
    enunciado: 'Si la cuota $R$ se duplica manteniendo la tasa y el plazo, ¿el monto final acumulado se duplica exactamente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $M$ es directamente proporcional a la cuota $R$.'
errores_frecuentes:
  - 'Dividir el monto acumulado directamente entre el número de cuotas omitiendo los intereses generados.'
  - 'Aplicar la potencia $(1+i)^n$ a la suma completa de depósitos $n \cdot R$ en lugar de usar la serie geométrica.'
  - 'Todas las cuotas periódicas devengan exactamente la misma cantidad de interés al término del plazo.'
  - 'El numerador de la fórmula de imposición se calcula manteniendo la potencia $(1+i)^n$ sin restar 1.'
  - 'Considerar que las cuotas pagadas al inicio del plan generan menos interés que las pagadas al final.'
afirmaciones_verdaderas:
  - 'El monto acumulado por una anualidad de capitalización se calcula mediante $M = R \cdot \left[\frac{(1 + i)^n - 1}{i}\right]$.'
  - 'La cuota periódica $R$ requerida para alcanzar una meta $M$ es $R = M \cdot \left[\frac{i}{(1 + i)^n - 1}\right]$.'
al_terminar_debes_poder: 'Calcular la cuota constante $R$ y el monto acumulado $M$ de una anualidad de capitalización aplicando la suma de progresiones geométricas.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
