semantic_id: MAT.NUM.INTERES_COMPUESTO.ANUALIDAD_CAPITALIZACION
resumen_inicial: 'Cálculo de la anualidad de capitalización: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: A diferencia de un depósito único que dejas años en el banco, en la vida
  real pagamos el dividendo de la casa o guardamos dinero para la jubilación mes a mes. Esa
  'cuota constante' se llama anualidad.
explicacion_formal: 'El término **Anualidad** puede ser engañoso, porque **no significa necesariamente
  que se pague una vez al año**. Es el nombre matemático para **pagos o depósitos periódicos
  iguales**.


  Ejemplos clásicos de Anualidades:

  - El pago mensual del dividendo de una casa (crédito hipotecario).

  - El descuento mensual de tu sueldo para la AFP o salud.

  - Depositar $\$50.000$ fijos cada mes en una cuenta de ahorro para el pie de una casa.


  El modelamiento matemático de las anualidades mezcla la suma de muchos cálculos de interés
  compuesto (se usan fórmulas de series geométricas), pero conceptualmente debes reconocer
  que una ''cuota fija'' implica que una parte del dinero paga los intereses generados ese
  mes, y el resto amortiza (disminuye) la deuda original.'
definiciones_clave: '- **Cálculo de la anualidad de capitalización**: Elemento central dentro
  del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de la anualidad de capitalización.'
ejemplo_guiado:
  enunciado: Una persona deposita 2.500.000 pesos hoy sin tocarlo por 3 años. Otra persona
    deposita 40.000 pesos mensuales durante 3 años. Determina cuál de los dos casos es una
    anualidad.
  pasos:
  - 'Analizo el primer caso: es un único depósito de 2.500.000, sin repeticiones, por lo tanto
    no es una anualidad.'
  - 'Analizo el segundo caso: son depósitos de 40.000 que se repiten todos los meses durante
    3 años.'
  - Concluyo que el segundo caso sí es una anualidad, específicamente una anualidad mensual,
    porque implica pagos periódicos constantes.
