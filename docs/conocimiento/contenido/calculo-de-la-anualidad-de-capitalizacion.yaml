resumen_inicial: 'Una anualidad o imposición de capitalización calcula el valor futuro
  acumulado mediante aportes periódicos constantes $R$ al final de cada período: $M_n
  = R \cdot \left[ \frac{(1 + i)^n - 1}{i} \right]$.'
explicacion_simple: Cuando ahorras una cuota fija todos los meses en una cuenta que
  te paga interés compuesto, usas la fórmula de anualidades para saber cuánto juntarás
  en total. Cada cuota que vas depositando tiene un tiempo distinto para ganar intereses.
explicacion_formal: 'Para un depósito constante $R$ realizado al final de cada uno
  de los $n$ períodos a una tasa $i$, el **Monto Acumulado de la Anualidad $M_n$**
  (serie geométrica de razón $(1+i)$) es:


  $$M_n = R + R(1+i) + R(1+i)^2 + \dots + R(1+i)^{n-1} = R \cdot \left[ \frac{(1 +
  i)^n - 1}{i} \right]$$'
definiciones_clave: '- **Anualidad de capitalización**: Fondo acumulado $M_n = R \cdot
  \left[ \frac{(1 + i)^n - 1}{i} \right]$ por depósitos periódicos de cuota $R$.'
propiedades_relaciones: '- **Suma de progresión geométrica**: Integra el valor futuro
  individual de cada depósito periódico.'
ejemplo_guiado:
  enunciado: Un ahorrante deposita una cuota fija de $R = \$100.000$ al final de cada
    año durante $3$ años en una cuenta con tasa compuesta del $10\%$ anual. Calcule
    el fondo acumulado.
  pasos:
  - 'Paso 1: Identificar $R = 100.000$, $i = 0,10$ y $n = 3$.'
  - 'Paso 2: Calcular el factor $(1,10^3 - 1) / 0,10 = (1,331 - 1) / 0,10 = 0,331
    / 0,10 = 3,31$.'
  - 'Paso 3: Multiplicar la cuota por el factor: $M_3 = 100.000 \cdot 3,31 = 331.000$.'
  - 'Conclusión: El fondo acumulado al tercer año es \$331.000 (\$300.000 de aportes
    + \$31.000 de intereses).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el valor futuro Mn acumulado por una
    anualidad de imposición fija R?
  choices:
  - text: Mn = R · [((1 + i)^n - 1) / i]
    is_correct: true
  - text: Mn = R · (1 + i)^n
    is_correct: false
  - text: Mn = R · n · i
    is_correct: false
  - text: Mn = R / (1 + i)^n
    is_correct: false
  explanation: La alternativa correcta es 'Mn = R · [((1 + i)^n - 1) / i]'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de la cuota de $100.000 al 10% en 3 años, ¿cuál fue
    el fondo acumulado final?
  choices:
  - text: 331.000 $
    is_correct: true
  - text: 300.000 $
    is_correct: false
  - text: 310.000 $
    is_correct: false
  - text: 350.000 $
    is_correct: false
  explanation: La alternativa correcta es '331.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el saldo acumulado $M_n
  = R \cdot \left[ \frac{(1 + i)^n - 1}{i} \right]$ en una anualidad de imposición
  periódica constante.
semantic_id: MAT.NUM.INTERES_COMPUESTO.ANUALIDAD_CAPITALIZACION
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.ANUALIDAD_CAPITALIZACION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
