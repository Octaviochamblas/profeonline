procedimiento:
- 'Paso 1: Plantear la proposición $x \in (A \cap B) \iff x \in A \land x \in B$.'
- 'Paso 2: Aplicar la propiedad conmutativa lógica para reordenar a $x \in B \land x \in A$.'
- 'Paso 3: Traducir a la notación de conjuntos $x \in (B \cap A)$.'
- 'Paso 4: Concluir la igualdad de conjuntos $A \cap B = B \cap A$ por el axioma de extensionalidad.'
errores_correccion: '- **Error 1:** Creer que la intersección depende de qué conjunto tenga mayor tamaño. **Cómo corregirlo:** La intersección busca exclusivamente elementos comunes; $|A \cap B| = |B \cap A|$ sin importar las diferencias de tamaño de los conjuntos originales.

  - **Error 2:** Creer que si $A \cap B = \emptyset$ entonces $B \cap A \neq \emptyset$. **Cómo corregirlo:** La disyunción es simétrica; si $A$ no comparte elementos con $B$, $B$ tampoco comparte elementos con $A$.

  '
