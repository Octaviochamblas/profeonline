errores_frecuentes:
- La afirmación de que la intersección no es conmutativa cuando un conjunto es subconjunto propio del otro.
- La afirmación de que el conjunto con mayor cantidad de elementos altera el resultado de la intersección si se coloca al inicio.
- La afirmación de que la conmutatividad de la intersección no se cumple para conjuntos no numéricos.
- La afirmación de que la intersección $A \cap B$ produce un conjunto diferente a $B \cap A$ al evaluar complementos.
- La afirmación de que la cardinalidad de $A \cap B$ puede ser diferente de la cardinalidad de $B \cap A$.
afirmaciones_verdaderas:
- La intersección de conjuntos es estrictamente conmutativa para cualquier par de conjuntos ($A \cap B = B \cap A$).
- La equivalencia $A \cap B = B \cap A$ se fundamenta en la conmutatividad del conectivo lógico de conjunción ($P \land Q \equiv Q \land P$).
al_terminar_debes_poder: 'QUÉ: Enunciar, demostrar y aplicar la propiedad conmutativa de la intersección ($A \cap B = B \cap A$).

  CÓMO: Traducir la intersección a conjunción lógica ($\land$), conmutar las proposiciones y aplicar el axioma de extensionalidad.


