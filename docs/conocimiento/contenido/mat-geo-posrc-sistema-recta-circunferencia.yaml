semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.SISTEMA_RECTA_CIRCUNFERENCIA
resumen_inicial: 'Resolución de sistemas para hallar intersecciones entre recta y
  circunferencia: conceptos, teoremas, propiedades geométricas y cálculo en Geometría
  Analítica Ampliada.'
explicacion_simple: Los puntos de intersección entre una recta y una circunferencia
  se obtienen sustituyendo la ecuación de la recta en la de la circunferencia, resultando
  en una ecuación cuadrática en una sola variable.
explicacion_formal: '![Sistema recta-circunferencia](/static/img/geometria/analitica/posrc-sistema-recta-circunferencia.svg)


  ### Definición formal


  Sustituyendo $y=mx+b$ en $(x-h)^2+(y-k)^2=r^2$, se obtiene una ecuación cuadrática
  $Ax^2+Bx+C=0$, cuyas soluciones (si existen) dan las coordenadas x de los puntos
  de intersección.


  ### Desarrollo didáctico


  Para la recta $y=3$ y la circunferencia $x^2+y^2=25$: sustituyendo, $x^2+9=25$,
  por lo que $x^2=16$, dando $x=4$ o $x=-4$. Los puntos de intersección son $(4,3)$
  y $(-4,3)$.'
