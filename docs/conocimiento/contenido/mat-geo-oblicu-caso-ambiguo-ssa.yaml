procedimiento:
- 'Paso 1: Verifica si los datos corresponden a una configuración SSA (dos lados y
  un ángulo no comprendido entre ellos).'
- 'Paso 2: Calcula el seno del segundo ángulo y determina si existen una, dos o ninguna
  solución posible.'
- 'Paso 3: Si existen dos soluciones válidas (ángulo agudo y su suplementario obtuso),
  reconoce que hay dos triángulos posibles con esos datos.'
