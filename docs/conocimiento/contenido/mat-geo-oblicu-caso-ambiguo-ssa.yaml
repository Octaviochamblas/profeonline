  ley de senos.'
ejemplo_guiado:
  enunciado: Para analizar reconocimiento del caso ambiguo ssa en la ley de senos,
    considera un ángulo $\alpha = 165^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1142^\circ = 165^\circ$.
  pasos:
  - Identificar la propiedad de reconocimiento del caso ambiguo ssa en la ley de senos
    referida a $\alpha = 165^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1142 = 165 \implies x = 165 - 1142$.'
  - Concluir que la medida calculada para reconocimiento del caso ambiguo ssa en la
    ley de senos es $x = -977^\circ$.
