semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.CASO_AMBIGUO_SSA
resumen_inicial: 'Reconocimiento del caso ambiguo SSA en la ley de senos: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Cuando los datos conocidos son dos lados y un ángulo no comprendido
  entre ellos (SSA), a diferencia de otras configuraciones, puede que existan dos
  triángulos válidos, uno solo, o ninguno, dependiendo de los valores específicos.
explicacion_formal: '![Caso ambiguo SSA](/static/img/geometria/trigonometria/oblicu-caso-ambiguo-ssa.svg)


  ### Definición formal


  Dados el lado $a$, el lado $b$ y el ángulo $A$ (no comprendido entre ellos), al
  calcular $\sin B=\dfrac{b\cdot\sin A}{a}$ pueden existir dos valores válidos de
  $B$ (agudo y obtuso) que completen un triángulo válido, dando lugar a dos triángulos
  distintos: $ABC$ y $ABC''$.


  ### Desarrollo didáctico


  En la figura, el vértice $C$ puede ubicarse en dos posiciones distintas (C y C'',
  mostrado con línea punteada) que satisfacen los mismos datos de lado $a$, lado $b$
  y ángulo $A$, generando dos triángulos válidos y distintos.'
definiciones_clave: '- **Reconocimiento del caso ambiguo SSA en la ley de senos**:
