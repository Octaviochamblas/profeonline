semantic_id: MAT.NUM.IRRACIONALES.RAIZ_NO_EXACTA
resumen_inicial: La raíz $n$-ésima de un número entero positivo $\sqrt[n]{A}$ que
  no da como resultado un número entero es un número irracional.
explicacion_simple: Cuando calculamos la raíz de un número entero que no da un resultado
  entero perfecto (como $\sqrt{2}$, $\sqrt{3}$, $\sqrt{5}$ o $\sqrt[3]{4}$), el número
  resultante es obligatoriamente un número irracional. Por el contrario, si la raíz
  da un entero exacto (como $\sqrt{4} = 2$), el número es un racional.
explicacion_formal: 'Para todo entero $A \in \mathbb{Z}^+$ y orden $n \in \mathbb{N},
  \, n \ge 2$, se cumple el **Teorema de Irracionalidad de Radicals**:


  $$\sqrt[n]{A} \notin \mathbb{Z} \implies \sqrt[n]{A} \in \mathbb{I}$$


  **Desglose del teorema:**

  - Raíz no entera: Si $A$ no es una potencia $n$-ésima perfecta en $\mathbb{Z}$ ($A
  \neq k^n$), entonces $\sqrt[n]{A}$ es un número irracional.

  - Densidad de radicales irracionales: Existen infinitas raíces no exactas entre
  cualquier par de números enteros.


  > **Complemento didáctico:** Raíces como $\sqrt{9} = 3$ o $\sqrt[3]{8} = 2$ son
  racionales porque son exactas; pero $\sqrt{8} = 2\sqrt{2}$ es irracional.'
definiciones_clave: '- **Raíz no exacta**: Expresión radical $\sqrt[n]{A}$ cuyo valor
  numérico no es un entero, perteneciendo a $\mathbb{I}$.'
propiedades_relaciones: '- **Criterio de radicando perfecto**: $\sqrt[n]{A} \in \mathbb{Q}
  \iff A = k^n$ para algún entero $k$.'
ejemplo_guiado:
  enunciado: Determine si las expresiones $\sqrt{16}$ y $\sqrt{20}$ corresponden a
    números racionales o irracionales.
  pasos:
  - 'Paso 1: Evaluar $\sqrt{16}$: como $4^2 = 16$, entonces $\sqrt{16} = 4 \in \mathbb{Z}
    \subset \mathbb{Q}$ (racional).'
  - 'Paso 2: Evaluar $\sqrt{20}$: descomponer el radicando $20 = 4 \cdot 5 \implies
    \sqrt{20} = 2\sqrt{5}$.'
  - 'Paso 3: Como $5$ no es un cuadrado perfecto en los enteros, $\sqrt{5}$ es un
    radical no exacto.'
  - 'Conclusión: $\sqrt{16}$ es un número racional, mientras que $\sqrt{20}$ es un
    número irracional.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el radicando de una raíz cuadrada no es un cuadrado perfecto, ¿a qué
    conjunto pertenece el resultado?
  choices:
  - text: Al conjunto de los números irracionales I
    is_correct: true
  - text: Al conjunto de los números enteros
    is_correct: false
  - text: Es una fracción exacta
    is_correct: false
  - text: Al conjunto de los números primos
    is_correct: false
  explanation: La alternativa correcta es 'Al conjunto de los números irracionales
    I'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(16) y sqrt(20), ¿cuál de ellas es un número
    irracional?
  choices:
  - text: sqrt(20), porque 20 no es un cuadrado perfecto
    is_correct: true
  - text: sqrt(16), porque es par
    is_correct: false
  - text: Ambas son irracionales
    is_correct: false
  - text: Ninguna
    is_correct: false
  explanation: La alternativa correcta es 'sqrt(20), porque 20 no es un cuadrado perfecto'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar la expresión radical reduciendo factores del radicando.'
- 'Paso 2: Comprobar si el radicando resultante es una potencia perfecta del índice
  de la raíz.'
- 'Paso 3: Si no es una potencia perfecta, declarar la raíz como un número irracional.'
errores_correccion: '- **Error 1: Creer que todas las raíces cuadradas son números
  irracionales.** **Cómo corregirlo:** Las raíces cuadradas de cuadrados perfectos
  (como $\sqrt{1}=1, \sqrt{4}=2, \sqrt{9}=3, \sqrt{16}=4$) SON RACIONALES.


  - **Error 2: Confundir la raíz de una fracción con un irracional sin simplificar.**
  **Cómo corregirlo:** Ejemplo $\sqrt{\frac{4}{9}} = \frac{2}{3} \in \mathbb{Q}$ es
  un racional exacto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt[3]{10}$ un número irracional?
  alternativas:
  - Sí, porque 10 no es un cubo perfecto en los enteros
  - No, porque 10 es par
  - No, es racional
  respuesta: Sí, porque 10 no es un cubo perfecto en los enteros
  solucion_pasos:
  - $10 \neq k^3 \implies \sqrt[3]{10} \in \mathbb{I}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué conjunto pertenece $\sqrt{25}$?
  alternativas:
  - Al conjunto de los racionales Q (y enteros Z)
  - Al conjunto de los irracionales I
  - Al conjunto complejo imaginario puro
  respuesta: Al conjunto de los racionales Q (y enteros Z)
  solucion_pasos:
  - $\sqrt{25} = 5 \in \mathbb{Z} \subset \mathbb{Q}$.
- titulo: ¿Es la suma de un entero y una raíz no exacta un número irracional?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $z + \text{irracional} = \text{irracional}$ (ej: $3 + \sqrt{2} \in \mathbb{I}$).'
- titulo: ¿Es sqrt(8) igual a un racional?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{8} = 2\sqrt{2} \in \mathbb{I}$.
errores_frecuentes:
- Toda raíz cuadrada calculada sobre un número entero se clasifica como un número
  irracional.
- La raíz cuadrada del entero 9 es un número irracional por tener el símbolo de radical.
- Multiplicar una raíz no exacta por un entero produce un número racional entero.
- Las raíces cúbicas de enteros impares son siempre números enteros exactos.
- La expresión $\sqrt{0,25}$ representa un número irracional por tener coma.
afirmaciones_verdaderas:
- La raíz $n$-ésima de un entero positivo es irracional si el radicando no es una
  potencia $n$-ésima perfecta.
- Las raíces cuadradas de enteros como 2, 3, 5, 6, 7, 8 son números irracionales.
al_terminar_debes_poder: Al terminar serás capaz de identificar raíces no exactas,
  clasificándolas como números irracionales al comprobar que el radicando no es una
  potencia perfecta del índice.
