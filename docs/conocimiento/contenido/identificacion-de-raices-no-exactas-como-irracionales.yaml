semantic_id: MAT.NUM.IRRACIONALES.RAIZ_NO_EXACTA
resumen_inicial: La raíz n-ésima de un número entero positivo es un número irracional si el radicando no es una potencia n-ésima perfecta en los números enteros.
explicacion_simple: '![Raíces no exactas como irracionales](/static/img/nodos/identificacion-de-raices-no-exactas-como-irracionales-intro.svg)


  Cuando calculamos una raíz cuadrada, cúbica o de cualquier índice sobre un número entero positivo, solo pueden ocurrir dos cosas: o el resultado es un número entero exacto (como $\sqrt{9} = 3$), o el resultado es un número irracional con infinitos decimales no periódicos (como $\sqrt{2}, \sqrt{5}, \sqrt[3]{7}$). ¡Nunca dará una fracción no entera!'
explicacion_formal: 'Sea $A \in \mathbb{Z}^+$ y un índice radical $n \in \mathbb{N}$ con $n \ge 2$, el radical $\sqrt[n]{A}$ satisface la **Dicotomía de Radicales Enteros**:


  $$\sqrt[n]{A} \in \mathbb{Z} \quad \lor \quad \sqrt[n]{A} \in \mathbb{I}$$


  **Fundamentación por el Teorema Fundamental de la Aritmética:**

  - Si en la factorización prima $A = p_1^{e_1} p_2^{e_2} \cdots p_k^{e_k}$, existe al menos un exponente $e_i$ que **no sea múltiplo exacto de $n$**, entonces $\sqrt[n]{A}$ no puede ser un número racional $\frac{a}{b}$.

  - **Demostración euclidiana clásica ($\sqrt{2} \notin \mathbb{Q}$):** Suponer $\sqrt{2} = \frac{a}{b}$ irreducible $\implies 2b^2 = a^2 \implies a$ es par $\implies a = 2k \implies 2b^2 = 4k^2 \implies b^2 = 2k^2 \implies b$ es par, lo que contradice la irreductibilidad de $\frac{a}{b}$.


  > **Complemento didáctico:** Toda raíz cuadrada de un número primo ($\sqrt{2}, \sqrt{3}, \sqrt{5}, \sqrt{7}, \dots$) es estrictamente irracional.'
definiciones_clave: '- **Raíz no exacta**: Radical $\sqrt[n]{A}$ cuyo radicando no es potencia $n$-ésima de ningún número entero.

  - **Irracional algebraico**: Número irracional que es solución de una ecuación polinómica con coeficientes enteros ($x^n - A = 0$).

  - **Radical irreducible**: Expresión radical que no puede simplificarse a un número racional.'
propiedades_relaciones: '- **Primalidad**: Para todo primo $p$, $\sqrt[n]{p} \in \mathbb{I}$ para todo $n \ge 2$.

  - **Combinaciones lineales**: Si $A$ no es cuadrado perfecto y $a, b \in \mathbb{Q}$ con $b \neq 0$, entonces $a + b\sqrt{A} \in \mathbb{I}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de raíces no exactas](/static/img/nodos/identificacion-de-raices-no-exactas-como-irracionales-ejemplos.svg)


    Determine si $\sqrt{48}$ y $\sqrt[3]{10}$ son números racionales o irracionales, justificando algebraicamente.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{48}$: Descomponer en factores primos: $48 = 16 \cdot 3 = 4^2 \cdot 3$.'
  - 'Paso 2: Simplificar el radical: $\sqrt{48} = \sqrt{4^2 \cdot 3} = 4\sqrt{3}$. Como $3$ es primo, $\sqrt{3} \in \mathbb{I} \implies 4\sqrt{3} \in \mathbb{I}$.'
  - 'Paso 3: Analizar $\sqrt[3]{10}$: Factorizar $10 = 2 \cdot 5$. Los exponentes son $1$, ninguno es múltiplo del índice radical $3$.'
  - 'Paso 4: Concluir para $\sqrt[3]{10}$: Al no ser $10$ un cubo perfecto ($2^3 = 8 < 10 < 27 = 3^3$), $\sqrt[3]{10} \in \mathbb{I}$.'
  - 'Conclusión: Tanto $\sqrt{48}$ como $\sqrt[3]{10}$ son números irracionales ($\mathbb{I}$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre si la raíz de un número entero positivo no es un número entero exacto?
  choices:
  - text: Es necesariamente un número irracional
    is_correct: true
  - text: Es una fracción decimal exacta
    is_correct: false
  - text: Es un número periódico puro
    is_correct: false
  - text: Es un número negativo
    is_correct: false
  explanation: La alternativa correcta es 'Es necesariamente un número irracional'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $\sqrt{48}$, ¿cuál fue su forma simplificada?
  choices:
  - text: $4\sqrt{3}$ (un número irracional)
    is_correct: true
  - text: $7$ (un número entero)
    is_correct: false
  - text: $\frac{24}{5}$ (un número racional)
    is_correct: false
  - text: $16\sqrt{3}$
    is_correct: false
  explanation: La alternativa correcta es '$4\sqrt{3}$ (un número irracional)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el radicando $A$ y el índice radical $n$.'
- 'Paso 2: Descomponer $A$ en factores primos y comprobar si todos sus exponentes son múltiplos exactos de $n$.'
- 'Paso 3: Si todos los exponentes son múltiplos de $n$, la raíz es un número entero ($\mathbb{Q}$); de lo contrario, el resultado es un número irracional ($\mathbb{I}$).'
errores_correccion: '- **Error 1: Creer que una raíz inexacta puede dar una fracción común (como 7/3).** **Cómo corregirlo:** La raíz de un entero NUNCA da una fracción de enteros no entera; si no es entero, es obligatoriamente irracional.

  - **Error 2: Confundir la raíz cuadrada con dividir por 2 (ej: pensar que $\sqrt{10} = 5$).** **Cómo corregirlo:** La raíz busca un número que multiplicado por sí mismo dé el radicando ($5^2 = 25 \neq 10$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt[3]{10}$ un número irracional?
  alternativas:
  - Sí, porque 10 no es un cubo perfecto en los enteros
  - No, porque es igual a 3,33
  - No, porque 10 es par
  respuesta: Sí, porque 10 no es un cubo perfecto en los enteros
  solucion_pasos:
  - $2^3 = 8$ y $3^3 = 27$, 10 no tiene raíz cúbica entera $\implies \sqrt[3]{10} \in \mathbb{I}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué conjunto numérico pertenece $\sqrt{64}$?
  alternativas:
  - Al conjunto de los racionales Q (y enteros Z) porque es igual a 8
  - Al conjunto de los irracionales I
  - Solo a los números imaginarios
  respuesta: Al conjunto de los racionales Q (y enteros Z) porque es igual a 8
  solucion_pasos:
  - $8^2 = 64 \implies \sqrt{64} = 8 \in \mathbb{Z} \subset \mathbb{Q}$.
- titulo: ¿Es la suma de un entero y una raíz no exacta un número irracional?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de un número racional y un irracional siempre es irracional ($q + i \in \mathbb{I}$).
  alternativas:
  - texto: Sí, siempre resulta un número irracional
    es_correcta: true
    retroalimentacion: ¡Correcto! La propiedad de traslación preserva la irracionalidad ($3 + \sqrt{2} \in \mathbb{I}$).
  - texto: No, se transforma en racional
    es_correcta: false
    retroalimentacion: Incorrecto, un número entero no puede eliminar los decimales aperiódicos de la raíz.
  - texto: Solo si el entero es positivo
    es_correcta: false
    retroalimentacion: Incorrecto, aplica para cualquier número entero positivo o negativo.
- titulo: ¿Es $\sqrt{8}$ igual a un racional?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{8} = 2\sqrt{2}$, que es un número irracional.
  alternativas:
  - texto: No, es un número irracional ($2\sqrt{2}$)
    es_correcta: true
    retroalimentacion: ¡Correcto! 8 no es un cuadrado perfecto, por lo que su raíz es irracional.
  - texto: Sí, es igual a 4
    es_correcta: false
    retroalimentacion: Incorrecto, $4^2 = 16$, no 8.
  - texto: Sí, es igual a 2,8
    es_correcta: false
    retroalimentacion: Incorrecto, $2,8$ es solo una aproximación decimal.
errores_frecuentes:
- 'Confundir la raíz cuadrada con la mitad del número (ej: afirmar que $\sqrt{8} = 4$).'
- Pensar que $\sqrt{2} + \sqrt{3} = \sqrt{5}$.
- Creer que al simplificar una raíz no exacta (como $\sqrt{12} = 2\sqrt{3}$) se obtiene un número racional.
- Asumir que si un número termina en 4 o 9 su raíz cuadrada es siempre exacta.
- Afirmar que $\sqrt{2}$ es una fracción porque se puede escribir como $\frac{\sqrt{2}}{1}$.
afirmaciones_verdaderas:
- La raíz cuadrada de cualquier número primo es un número irracional.
- Si un número entero positivo no es un cuadrado perfecto, su raíz cuadrada es estrictamente irracional.
- El producto de un número racional no nulo por una raíz no exacta es siempre un número irracional.
al_terminar_debes_poder: '![Síntesis de raíces no exactas](/static/img/nodos/identificacion-de-raices-no-exactas-como-irracionales-resumen.svg)


  QUÉ: Identificar y clasificar raíces no exactas como números irracionales algebraicos.


  CÓMO: Factorizando el radicando en factores primos, verificando si sus potencias coinciden con el índice radical y deduciendo que toda raíz no entera de un entero positivo pertenece estrictamente a $\mathbb{I}$ ($\sqrt[n]{A} \notin \mathbb{Z} \implies \sqrt[n]{A} \in \mathbb{I}$).'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
