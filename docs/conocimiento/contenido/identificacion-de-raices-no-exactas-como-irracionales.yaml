guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.01.03'
  title: 'Identificación de raíces no exactas como irracionales'
  description: 'Determina y demuestra cuándo una raíz n-ésima de un entero positivo representa un número irracional.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'identificacion-de-raices-no-exactas-como-irracionales'
semantic_id: 'MAT.NUM.IRRACIONALES.RAIZ_NO_EXACTA'
titulo: 'Identificación de raíces no exactas como irracionales'
objetivo: 'Decidir si una raíz cuadrada o n-ésima de un entero positivo es un número irracional analizando si el radicando es o no una potencia perfecta.'
introduccion: 'La calculadora muestra $\sqrt{7} \approx 2{,}645751311\dots$, pero esos dígitos son solo una aproximación trunca. El símbolo radical $\sqrt{7}$ conserva el valor exacto de una cantidad que no cabe en ninguna fracción ni decimal finito/periódico. Como regla general en la aritmética, la raíz $n$-ésima de un número entero positivo es un número entero o es un número irracional: no existen casos intermedios que resulten en fracciones no enteras.'
resumen: 'Si $k$ es un entero positivo y $n \ge 2$, la raíz $\sqrt[n]{k}$ es un número irracional a menos que $k$ sea una potencia $n$-ésima perfecta (es decir, $k = m^n$ para algún entero $m$). Por lo tanto, raíces como $\sqrt{2}, \sqrt{3}, \sqrt{5}, \sqrt{7}, \sqrt[3]{2}$ son todas irracionales.'
requisitos:
  - 'Concepto de potencia exacta y cuadrados o cubos perfectos.'
  - 'Definición de números racionales e irracionales.'
objetivos:
  - 'Identificar si el radicando de una raíz dada es una potencia perfecta.'
  - 'Clasificar raíces enteras como racionales (enteros) o irracionales.'
que_aprenderas:
  - 'La regla de clasificación de raíces de números enteros.'
  - 'Por qué aproximar una raíz con decimales no la transforma en un número racional.'
  - 'Cómo acotar el valor de una raíz irracional entre dos enteros consecutivos.'
al_terminar_debes_poder:
  - 'Distinguir inmediatamente raíces exactas (racionales) de raíces no exactas (irracionales).'
  - 'Demostrar por qué expresiones como $\sqrt{12}$ son irracionales.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿En cuál de los siguientes casos la raíz cuadrada $\sqrt{x}$ de un entero positivo $x$ es un número RACIONAL?'
    choices:
      - {text: 'Cuando $x$ es un número primo.', is_correct: false}
      - {text: 'Cuando $x$ es un cuadrado perfecto (como $1, 4, 9, 16, 25\dots$).', is_correct: true}
      - {text: 'Cuando $x$ es un número impar no primo.', is_correct: false}
      - {text: 'Siempre es racional independientemente del valor de $x$.', is_correct: false}
    explanation: 'La correcta es: Cuando $x$ es un cuadrado perfecto (como $1, 4, 9, 16, 25\dots$). En tal caso $\sqrt{m^2} = m \in \mathbb{Z} \subset \mathbb{Q}$. Si no es cuadrado perfecto, $\sqrt{x}$ es irracional.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: '¿Cuál de las siguientes opciones describe correctamente la naturaleza del número $\sqrt{20}$?'
    choices:
      - {text: 'Es racional porque $20$ se puede dividir entre $4$.', is_correct: false}
      - {text: 'Es irracional porque $20$ no es un cuadrado perfecto.', is_correct: true}
      - {text: 'Es igual exactamente a $4{,}47$.', is_correct: false}
      - {text: 'No es un número real.', is_correct: false}
    explanation: 'La correcta es: Es irracional porque $20$ no es un cuadrado perfecto. Los cuadrados perfectos más cercanos son $16$ ($\sqrt{16}=4$) y $25$ ($\sqrt{25}=5$). Al estar $20$ entre $16$ y $25$, $\sqrt{20}$ es irracional y su valor está entre $4$ y $5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el índice $n$ y el radicando $k$ en la expresión $\sqrt[n]{k}$.'
  - 'Paso 2: Comprobar si $k$ se puede escribir de la forma $m^n$ para algún entero $m \in \mathbb{Z}^+$.'
  - 'Paso 3: Si $k = m^n$, la raíz vale $m$ y es racional. Si $k$ no es una potencia $n$-ésima perfecta, concluir que $\sqrt[n]{k}$ es un número irracional.'
errores_frecuentes:
  - 'Pensar que porque la calculadora muestra un número finito de decimales (como $2{,}6457513$), la raíz se convirtió en racional.'
  - 'Confundir la simplificación de un radical (como $\sqrt{12} = 2\sqrt{3}$) con haber obtenido un número racional.'
errores_correccion: 'Un error habitual es suponer que si simplificamos una raíz (como $\sqrt{8} = 2\sqrt{2}$), el resultado es más racional. Recuerda: multiplicar un número racional no nulo ($2$) por un número irracional ($\sqrt{2}$) da siempre como resultado un número irracional.'
ejemplos:
  - titulo: 'Clasificación de raíces cuadradas'
    enunciado: 'Determina cuáles de las siguientes raíces cuadradas corresponden a números irracionales: $R_1 = \sqrt{49}$, $R_2 = \sqrt{50}$, $R_3 = \sqrt{81}$.'
    alternativas:
      - 'Solo $R_1$'
      - 'Solo $R_2$'
      - '$R_2$ y $R_3$'
      - 'Todas son irracionales'
    respuesta: 'Solo $R_2$'
    solucion_pasos:
      - '$R_1 = \sqrt{49} = 7$ (puesto que $7^2 = 49$), luego es entero y racional.'
      - '$R_3 = \sqrt{81} = 9$ (puesto que $9^2 = 81$), luego es entero y racional.'
      - '$R_2 = \sqrt{50}$: los cuadrados perfectos adyacentes son $49$ y $64$. Como $50$ no es cuadrado perfecto, $\sqrt{50} = 5\sqrt{2}$ es irracional.'
  - titulo: 'Raíces cúbicas en los irracionales'
    enunciado: '¿Cuál de las siguientes raíces cúbicas es un número RACIONAL?'
    alternativas:
      - '$\sqrt[3]{9}$'
      - '$\sqrt[3]{16}$'
      - '$\sqrt[3]{27}$'
      - '$\sqrt[3]{30}$'
    respuesta: '$\sqrt[3]{27}$'
    solucion_pasos:
      - '$\sqrt[3]{9}$: $9$ no es cubo perfecto ($2^3=8, 3^3=27$), por ende es irracional.'
      - '$\sqrt[3]{16}$: $16$ no es cubo perfecto, por ende es irracional.'
      - '$\sqrt[3]{27} = 3$ pues $3^3 = 27$. Al dar un entero exacto, es un número racional.'
      - '$\sqrt[3]{30}$ es irracional.'
comprobacion_rapida:
  - afirmacion: 'La raíz cuadrada de cualquier número primo es siempre un número irracional.'
    respuesta: true
    explicacion: 'Correcto. Ningún número primo es un cuadrado perfecto.'
  - afirmacion: 'La expresión $\sqrt{0{,}25}$ es un número irracional.'
    respuesta: false
    explicacion: 'Falso. $\sqrt{0{,}25} = \sqrt{\frac{1}{4}} = \frac{1}{2} = 0{,}5$, que es un número racional.'
  - afirmacion: 'La suma de un entero y una raíz no exacta (como $3 + \sqrt{2}$) es un número irracional.'
    respuesta: true
    explicacion: 'Correcto. Sumar o restar un número racional con uno irracional resulta siempre en un irracional.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales e irracionales.'
estado: 'publicado'
