semantic_id: MAT.NUM.IRRACIONALES.RAIZ_NO_EXACTA
resumen_inicial: Cualquier raíz $n$-ésima de un entero positivo que no sea una potencia
  $n$-ésima perfecta es un número irracional.
explicacion_simple: 'Si intentas calcular una raíz como $\sqrt{2}, \sqrt{3}, \sqrt{5},
  \sqrt{7}$ o $\sqrt[3]{4}$ y el número dentro no es un cuadrado/cubo perfecto, **el
  resultado es un número irracional**:

  - $\sqrt{4} = 2$ (Exacta, Racional).

  - $\sqrt{5} = 2{,}2360679...$ (No exacta, Irracional).'
explicacion_formal: 'Teorema: Para todo $k, n \in \mathbb{N}$ con $n \ge 2$, $\sqrt[n]{k}
  \in \mathbb{Q} \iff k = m^n$ para algún $m \in \mathbb{N}$. Si $k$ no es una potencia
  $n$-ésima perfecta, entonces $\sqrt[n]{k} \in \mathbb{I}$.'
definiciones_clave: '- **Teorema de irracionalidad de radicales**: Raíces de enteros
  no potencias perfectas son irracionales.'
propiedades_relaciones: '- **Densidad de radicales irracionales**: Existen infinitas
  raíces no exactas entre cualquier par de enteros.'
ejemplo_guiado:
  enunciado: Determina si A) $\sqrt{36}$ y B) $\sqrt{50}$ son números racionales o
    irracionales.
  pasos:
  - 'Para A: $36 = 6^2$ (cuadrado perfecto), luego $\sqrt{36} = 6 \in \mathbb{Q}$
    (Racional).'
  - 'Para B: $50$ no es un cuadrado perfecto ($7^2=49, 8^2=64$), luego $\sqrt{50}
    \in \mathbb{I}$ (Irracional).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes raíces representa un número IRRACIONAL?
  choices:
  - text: \sqrt{7}
    is_correct: true
  - text: \sqrt{9}
    is_correct: false
  - text: \sqrt{16}
    is_correct: false
  - text: \sqrt{25}
    is_correct: false
  explanation: 'La correcta es: \sqrt{7}. Puesto que 7 no es cuadrado perfecto, su
    raíz es no exacta e irracional.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué conjunto numérico pertenece $\sqrt[3]{16}$?
  choices:
  - text: Al conjunto de los números irracionales (I)
    is_correct: true
  - text: Al conjunto de los números enteros (Z)
    is_correct: false
  - text: Al conjunto de los números racionales (Q)
    is_correct: false
  - text: No es un número real
    is_correct: false
  explanation: 'La correcta es: Al conjunto de los números irracionales (I). 16 no
    es cubo perfecto ($2^3=8, 3^3=27$), luego $\sqrt[3]{16} \in \mathbb{I}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el radicando $k$ y el índice $n$.'
- 'Paso 2: Comprobar si $k$ se puede escribir como $m^n$ para algún entero $m$.'
- 'Paso 3: Si no es posible, clasificar el radical como número irracional.'
errores_correccion: No confundas simplificar un radical ($5\sqrt{2}$) con volverlo
  racional. $5\sqrt{2}$ sigue siendo un número irracional.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt{10}$ irracional?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - 10 no es cuadrado perfecto $\implies \sqrt{10} \in \mathbb{I}$.
errores_frecuentes:
- Asumir que si se puede simplificar un radical deja de ser irracional.
afirmaciones_verdaderas:
- Las raíces no exactas de enteros son números irracionales.
al_terminar_debes_ponder: Reconocer raíces no exactas como elementos del conjunto
  de los números irracionales.
fuente: Texto escolar MINEDUC.
estado: publicado
