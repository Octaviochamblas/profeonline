semantic_id: MAT.ALG.LENGUAJE_RELACIONES.MENOR_QUE
resumen_inicial: 'Traducción de la relación menor que: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Los límites de velocidad en las carreteras son un ejemplo clásico.
  Nadie te prohíbe ir más lento, la regla es ser inferior al límite. El álgebra modela
  los 'techos' con el símbolo menor que.
explicacion_formal: '### Definición formal


  El símbolo $<$ es estricto. Si $x < 10$, $x$ jamás podrá ser 10.


  ### Desarrollo didáctico


  Palabras clave:

  - A es menor que B: $A < B$

  - Es inferior a

  - No alcanza a

  - Está por debajo de


  Ejemplos:

  - ''La edad de María es menor que la de Juan'': $M < J$

  - ''El costo de producción no alcanzó los mil dólares'': $C < 1000$


  Nuevamente, hablamos de desigualdad **estricta**. Si una velocidad límite es de
  100 km/h y te dicen que vayas a una velocidad ''menor que'' 100, ir a 100 exactos
  está prohibido. Debe ser 99.9 o menos.'
definiciones_clave: '- **Traducción de la relación menor que**: Herramienta clave
  para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de la relación menor que.'
