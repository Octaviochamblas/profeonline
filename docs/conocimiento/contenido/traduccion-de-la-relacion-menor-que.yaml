semantic_id: MAT.ALG.LENGUAJE_RELACIONES.MENOR_QUE
resumen_inicial: La traducción de la relación menor que consiste en representar simbólicamente la desigualdad estricta $A < B$ donde la primera expresión es estrictamente menor en magnitud que la segunda.
explicacion_simple: "En matemáticas, el símbolo **$<$** significa **\"es menor que\"**:\n- Frases verbales: *\"$A$ es menor que $B$\"*, *\"$A$ es estrictamente menor que $B$\"*, *\"$A$ es inferior a $B$\"*.\n- Traducción: **$A < B$**.\n- **Regla del símbolo $<$**: La punta fina del símbolo señala siempre al número o expresión MENOR; la boca abierta apunta al MAYOR.\n- Ejemplos:\n  - \"Un número $x$ es menor que $50$\" $\\implies **x < 50**$.\n  - \"La mitad de $a$ es menor que $b$\" $\\implies **\\frac{a}{2} < b**$.\n  - \"El doble de $n$ es menor que veinte\" $\\implies **2n < 20**$.\n\n![Relación Menor Que](/static/img/nodos/traduccion-de-la-relacion-menor-que-intro.svg)\n"
explicacion_formal: "### Definición formal\nLa **relación de orden estricto menor que** es una relación binaria no simétrica $< \\subset \\mathbb{R} \\times \\mathbb{R}$ definida sobre el cuerpo ordenado de los reales $\\mathbb{R}$:\n\n$$\\forall A, B \\in \\mathbb{R}, \\quad A < B \\iff A - B < 0 \\iff (A - B) \\in \\mathbb{R}^-$$\n\n### Propiedades de las Inecuaciones con Orden Estricto ($<$)\n1. **Propiedad Transitiva**: Si $A < B$ y $B < C$, entonces $A < C$.\n2. **Equivalencia de Inversión**: $A < B \\iff B > A$.\n3. **Inversión por Multiplicador Negativo**: Si $A < B$ y $c < 0$, al multiplicar por $c$ se invierte el sentido de la desigualdad:\n   $$A < B \\land c < 0 \\implies A \\cdot c > B \\cdot c$$\n\n### Síntesis didáctica\nLa relación menor que define intervalos abiertos en la recta real del tipo $]-\\infty, B[$ y rige los límites inferiores de capacidad y cotas de error.\n"
definiciones_clave: '- **Desigualdad estricta menor que ($<$)**: Relación de orden que establece que la cantidad a la izquierda es estrictamente inferior en valor a la derecha.

  - **Punta del símbolo**: Extremo puntiagudo del signo que señala a la cantidad de menor valor.

  - **Intervalo abierto $]-\infty, B[$**: Conjunto solución real compuesto por todos los números estrictamente menores que $B$.

  '
propiedades_relaciones: '- **Equivalencia con el opuesto**: Multiplicar la desigualdad $A < B$ por $-1$ invierte los signos y el operador: $-A > -B$.

  - **Strictness**: No incluye la igualdad $A = B$ (para incluir la igualdad se utiliza $\le$).

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "La tercera parte de la edad de Ana ($a$) disminuida en dos años es menor que la mitad de la edad de Beatriz ($b$)".'
  pasos:
  - 'Paso 1: Traducimos el primer miembro (izquierdo): "La tercera parte de la edad de Ana disminuida en dos" $\implies \frac{a}{3} - 2$.'
  - 'Paso 2: Traducimos la relación de orden: "es menor que" $\implies <$.'
  - 'Paso 3: Traducimos el segundo miembro (derecho): "La mitad de la edad de Beatriz" $\implies \frac{b}{2}$.'
  - 'Paso 4: Unimos los componentes: $\frac{a}{3} - 2 < \frac{b}{2}$.'
  - 'Conclusión: La inecuación traducida es **$\frac{a}{3} - 2 < \frac{b}{2}$**.'
  imagen: /static/img/nodos/traduccion-de-la-relacion-menor-que-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué notación algebraica representa la relación de orden estricto " $A$ es menor que $B$ "?
  choices:
  - text: 'Se representa ubícando la punta del símbolo hacia la izquierda: $A < B$'
    is_correct: true
  - text: Se representa mediante la estructura $A > B$
    is_correct: false
  - text: Se representa mediante la estructura $A \le B$
    is_correct: false
  - text: Se representa mediante la igualdad $A = B$
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa ubícando la punta del símbolo hacia la izquierda: $A < B$''. Definición de menor que.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿A qué inecuación equivale decir que la temperatura $T$ es estrictamente inferior a cero grados? '
  choices:
  - text: Se traduce como la inecuación $T < 0$
    is_correct: true
  - text: Se traduce como la inecuación $T > 0$
    is_correct: false
  - text: Se traduce como la inecuación $T \le 0$
    is_correct: false
  - text: Se traduce como la ecuación $T = 0$
    is_correct: false
  explanation: La alternativa correcta es 'Se traduce como la inecuación $T < 0$'. Temperatura negativa $T < 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión que figura antes de las palabras "es menor que" o "es inferior a" (miembro izquierdo).'
- 'Paso 2: Escribir el símbolo de orden estricto $<$.'
- 'Paso 3: Identificar la expresión que figura después de las palabras "es menor que" (miembro derecho).'
- 'Paso 4: Verificar que no se añada el signo igual en desigualdades estrictas.'
errores_correccion: '- **Error 1:** Usar el símbolo menor o igual $\le$ cuando el enunciado exige orden estricto ("es menor que"). **Cómo corregirlo:** "Menor que" **exige el símbolo estricto ($<$)** sin la barra de igual.

  - **Error 2:** Escribir $A > B$ al traducir "A es menor que B". **Cómo corregirlo:** La punta del símbolo **debe señalar SIEMPRE a la cantidad menor ($A < B$)**.

  '
ejemplos:
- titulo: Menor que básico
  enunciado: ¿Cuál es la traducción de "Un número $n$ es menor que 100"?
  alternativas:
  - $n < 100$
  - $n > 100$
  - $n \le 100$
  respuesta: $n < 100$
  solucion_pasos:
  - '1. Variable: $n$.'
  - '2. Relación: menor que $<$.'
  - '3. Resultado: $n < 100$.'
- titulo: Equivalencia de orden
  enunciado: ¿Es la inecuación $a < b$ exactamente equivalente a $b > a$?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos expresan que $b$ es la cantidad mayor.
- titulo: Menor que entre expresiones
  enunciado: La frase "El doble de $x$ es menor que $x + 8$", ¿se traduce como $2x < x + 8$?
  respuesta: Sí
  solucion_pasos:
  - Sí, miembro izquierdo $2x <$ miembro derecho $(x+8)$.
- titulo: Inversión por signo negativo
  enunciado: Dada la inecuación $x < 5$, si multiplicamos por $-1$, ¿se invierte a $-x > -5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación por una constante negativa invierte el operador.
errores_frecuentes:
- Escribir el símbolo menor o igual \le al traducir la frase de orden estricto menor que.
- Apuntar la punta del símbolo hacia la cantidad mayor en lugar de la menor.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- El sentido del símbolo no es invertido al multiplicar la inecuación por un número negativo.
- Intercambiar la relación menor que con una operación de resta directa.
afirmaciones_verdaderas:
- La traducción de la relación menor que utiliza el símbolo de desigualdad estricta < apuntando con su vértice hacia la cantidad menor.
- La inecuación A < B es totalmente equivalente a la expresión B > A.
al_terminar_debes_poder: '![Resumen de relación menor que](/static/img/nodos/traduccion-de-la-relacion-menor-que-resumen.svg)


  QUÉ: Traducir desigualdades estrictas y no estrictas de menor cuantía al lenguaje algebraico.


  CÓMO: Utilizar el símbolo de desigualdad estricta $<$ ($A < B$) o no estricta $\leq$ ($A \leq B$) orientando el vértice hacia el término de menor magnitud.'
