errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir traducción
  de la relación menor que.
- Invertir el orden de las variables al construir la expresión de traducción de la
  relación menor que.
- Usar una suma cuando el enunciado de traducción de la relación menor que exige una
  resta o división.
- Omitir paréntesis al multiplicar expresiones en traducción de la relación menor
  que.
- Declarar que la expresión de traducción de la relación menor que es válida sólo
  para números pares.
afirmaciones_verdaderas:
