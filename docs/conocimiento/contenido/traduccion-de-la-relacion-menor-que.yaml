resumen_inicial: La traducción de la relación menor que permite representar estructuras
  matemáticas de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con traducción de la relación menor que, transformamos
  frases sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Traducción
  de la relación menor que** viene dada por:


  $$\text{"la frase ''un número x disminuido en 4 es menor que 10''"} \implies x -
  4 < 10$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Traducción de la relación menor que**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: x - 4 < 10 define la estructura
  requerida.'
ejemplo_guiado:
  enunciado: 'Traduzca o exprese según traducción de la relación menor que: ''la frase
    ''un número x disminuido en 4 es menor que 10''''.'
  pasos:
