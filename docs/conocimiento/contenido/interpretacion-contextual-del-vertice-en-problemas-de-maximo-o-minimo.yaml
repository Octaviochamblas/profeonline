semantic_id: MAT.ALG.FUNC_CUADR_MODELO.INTERPRETACION_VERTICE_CONTEXTO
resumen_inicial: 'La interpretación contextual del vértice asigna significado real al par ordenado $V(h, k)$, donde $h$ es la variable de control y $k$ es el resultado óptimo alcanzado.'
explicacion_simple: |
  En los problemas de la vida real, el vértice $V(h, k)$ entrega dos respuestas separadas en un solo punto cartesiano. La primera coordenada $h$ responde a la pregunta de causa (*¿cuántos artículos vender?, ¿a qué segundo ocurre?*), mientras que la segunda coordenada $k$ responde a la pregunta de consecuencia (*¿cuál es la ganancia máxima?, ¿cuál es la altura alcanzada?*).
explicacion_formal: |
  ### Definición formal
  Dado un modelo cuadrático contextualizado $y = f(x) = ax^2 + bx + c$, el vértice $V(h, k) = \left(-\frac{b}{2a}, f\left(-\frac{b}{2a}\right)\right)$ constituye el **par de interpretación contextual**:
  - **Componente de control $h \in D_{\text{contexto}}$**: Representa la condición de entrada física, temporal, geométrica o económica que causa el estado extremo.
  - **Componente de respuesta $k \in \operatorname{Rec}(f)$**: Representa el valor límite (máximo o mínimo) alcanzado por la magnitud de salida observada.

  ### Desglose simbólico
  - Contexto Físico (Lanzamiento): $V(t_{\text{máx}}, h_{\text{máx}}) \implies h = \text{segundos para la cima}, k = \text{metros de altura máxima}$.
  - Contexto Económico (Ganancia): $V(x_{\text{óptimo}}, G_{\text{máx}}) \implies h = \text{unidades producidas/vendidas}, k = \text{pesos de ganancia máxima}$.
  - Contexto Geométrico (Superficie): $V(l_{\text{óptimo}}, A_{\text{máx}}) \implies h = \text{metros de ancho}, k = \text{metros cuadrados de área máxima}$.

  ### Síntesis didáctica
  Leer un problema con precisión exige verificar qué unidad pide la pregunta del enunciado antes de elegir si la respuesta es $h$ o $k$.
definiciones_clave: |
  - **Componente de control $h$**: Abscisa del vértice que señala el valor operativo de la variable independiente.
  - **Componente de respuesta $k$**: Ordenada del vértice que señala la cota extrema del indicador modelado.
  - **Traducción contextual**: Decodificación de los números del par cartesiano en unidades de medida reales.
propiedades_relaciones: |
  - **Relación causa-efecto**: La componente $h$ actúa como causa de entrada, y la componente $k = f(h)$ es su efecto medido en la salida.
  - **Eje de simetría contextual**: La recta $x = h$ marca el instante o valor central a partir del cual el comportamiento del fenómeno se invierte.
ejemplo_guiado:
  enunciado: 'Un estudio determina que el beneficio de una empresa de transportes viene dado por $B(x) = -x^2 + 12x - 20$, donde $x$ es el número de buses en circulación y $B(x)$ es la ganancia en millones de pesos. Interpreta el vértice $V(6, 16)$ en el contexto del problema.'
  pasos:
    - 'Paso 1: Identificamos la primera coordenada $h = 6$. Como la variable $x$ representa buses, $h = 6$ indica que la empresa debe poner 6 buses en circulación.'
    - 'Paso 2: Identificamos la segunda coordenada $k = 16$. Como $B(x)$ representa la ganancia en millones, $k = 16$ indica una ganancia de 16 millones de pesos.'
    - 'Paso 3: Identificamos que $a = -1 < 0$, lo que confirma que $k = 16$ es un beneficio máximo.'
    - 'Paso 4: Interpretación completa: Poner 6 buses en circulación (causa $h$) genera la ganancia máxima posible de 16 millones de pesos (efecto $k$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un problema de rendimiento de combustible $R(v) = -0.01v^2 + 1.2v + 4$, donde $v$ es la velocidad en km/h y $R$ es el rendimiento en km/L, el vértice es $V(60, 40)$. ¿Qué significa la coordenada $60$?'
    choices:
      - {text: 'La velocidad de 60 km/h a la que se logra el máximo rendimiento', is_correct: true}
      - {text: 'El rendimiento máximo alcanzado de 60 km/L', is_correct: false}
      - {text: 'La cantidad de litros consumidos por hora', is_correct: false}
      - {text: 'La aceleración constante del vehículo', is_correct: false}
    explanation: 'La alternativa correcta es ''La velocidad de 60 km/h a la que se logra el máximo rendimiento''. La primera coordenada del vértice representa la variable independiente $v = 60\text{ km/h}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un objeto lanzado en el aire sigue la función $h(t) = -5t^2 + 20t + 2$, con vértice $V(2, 22)$. ¿Cuál es la altura máxima alcanzada?'
    choices:
      - {text: '22 metros', is_correct: true}
      - {text: '2 segundos', is_correct: false}
      - {text: '20 metros', is_correct: false}
      - {text: '5 metros', is_correct: false}
    explanation: 'La alternativa correcta es ''22 metros''. La altura máxima es la ordenada del vértice $k = 22$ metros, mientras que 2 segundos es el tiempo en que ocurre.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular o identificar las coordenadas del vértice $V(h, k)$.'
  - 'Paso 2: Asociar $h$ con la variable de la abscisa (eje horizontal) observando su unidad de medida.'
  - 'Paso 3: Asociar $k$ con la variable de la ordenada (eje vertical) observando su unidad de medida.'
  - 'Paso 4: Redactar la conclusión vinculando $h$ como la condición optimizadora y $k$ como el resultado extremo alcanzado.'
errores_correccion: |
  - **Error 1:** Intercambiar las unidades de las coordenadas, afirmando que $h$ representa pesos y $k$ artículos. **Cómo corregirlo:** La abscisa $h$ lleva siempre las unidades del eje $x$ (artículos, segundos, metros), mientras que $k$ lleva las unidades del eje $y$ (pesos, altura, ganancia).
  - **Error 2:** Responder con el valor $h$ cuando la pregunta pide la magnitud óptima $k$. **Cómo corregirlo:** Si la pregunta consulta por el resultado extremo (*¿cuál es la ganancia?, ¿cuál es el área?*), la respuesta es la ordenada $k$.
ejemplos:
  - titulo: 'Interpretación en contexto económico'
    enunciado: 'En la función de ganancia $G(x)$ con vértice $V(50, 8000)$ en miles de pesos, ¿qué representa el número $8000$?'
    alternativas:
      - 'La ganancia máxima de 8.000.000 de pesos'
      - 'La venta de 8000 artículos'
      - 'El costo fijo de 8000 pesos'
    respuesta: 'La ganancia máxima de 8.000.000 de pesos'
    solucion_pasos:
      - '1. La ordenada $k = 8000$ representa el valor de la función dependiente $G(x)$.'
      - '2. Como la unidad es miles de pesos, corresponde a un beneficio máximo de 8.000.000 pesos.'
  - titulo: 'Interpretación en contexto de tiro vertical'
    enunciado: 'Si el vértice de la trayectoria de un dron es $V(4, 30)$, ¿cuánto tiempo tarda en alcanzar su altura máxima?'
    alternativas:
      - '4 segundos'
      - '30 segundos'
      - '34 segundos'
    respuesta: '4 segundos'
    solucion_pasos:
      - '1. El tiempo es la variable independiente $t = h = 4$ segundos.'
      - '2. La altura máxima alcanzada es de 30 metros.'
  - titulo: 'Naturaleza extrema según la concavidad'
    enunciado: 'Si $a = -2 < 0$, ¿la ordenada $k$ del vértice representa obligatoriamente una cota máxima?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al abrir la parábola hacia abajo, la ordenada $k$ representa la cota superior o máxima del fenómeno.'
  - titulo: 'Eje de simetría en contexto'
    enunciado: '¿El valor $h$ del vértice marca el punto medio de simetría entre el ascenso y el descenso en un modelo parabólico?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La abscisa $h$ marca el eje de simetría donde el fenómeno invierte su monotonía.'
errores_frecuentes:
  - 'En una función de costo con vértice $V(15, 300)$, el costo mínimo alcanzado es de 15 pesos.'
  - 'La primera coordenada del vértice $h$ indica siempre la altura máxima alcanzada por un objeto.'
  - 'En el vértice $V(h, k)$, las unidades de $h$ y $k$ son idénticas.'
  - 'Si el vértice es $V(3, 40)$, se necesitan 40 artículos para lograr una ganancia de 3 pesos.'
  - 'La ordenada del vértice $k$ representa el instante de tiempo en que se lanza un proyectil.'
afirmaciones_verdaderas:
  - 'En el vértice $V(h, k)$, la coordenada $h$ representa el valor de la variable independiente que produce el extremo, y $k$ es el resultado máximo o mínimo alcanzado.'
  - 'La interpretación contextual del vértice requiere vincular las magnitudes y unidades del problema a la causa $h$ y a la consecuencia $k$.'
al_terminar_debes_poder: 'Interpretar en lenguaje natural el significado de las coordenadas del vértice en problemas contextualizados de máximo o mínimo.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
