semantic_id: MAT.ALG.FUNC_CUADR_MODELO.INTERPRETACION_VERTICE_CONTEXTO
resumen_inicial: 'Interpretación contextual del vértice en problemas de máximo o mínimo:
  parábola, vértice, concavidad y formas de Modelamiento y aplicaciones.'
explicacion_simple: Calcular correctamente el vértice no es suficiente; hay que traducir
  sus dos coordenadas al lenguaje específico del problema, incluyendo qué representa
  cada una y sus unidades.
explicacion_formal: '### Definición formal


  Si $f(x)$ modela una cantidad en función de una variable $x$, y su vértice es $(h,k)$,
  entonces $h$ es el valor de $x$ (con sus unidades correspondientes) donde se alcanza
  el óptimo, y $k=f(h)$ es el valor óptimo de la cantidad modelada (también con sus
  propias unidades).


  ### Desarrollo didáctico


  Es fundamental distinguir las unidades de cada coordenada: si $x$ representa tiempo
  en segundos y $f(x)$ representa altura en metros, entonces $h$ se interpreta en
  segundos y $k$ en metros, nunca al revés.


  Si el vértice de $h(t)=-5t^2+20t$ es $(2,20)$: la coordenada $2$ significa que el
  objeto alcanza su altura máxima a los $2$ segundos, y la coordenada $20$ significa
  que esa altura máxima es de $20$ metros.'
definiciones_clave: '- **Interpretación contextual del vértice en problemas de máximo
  o mínimo**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  interpretación contextual del vértice en problemas de máximo o mínimo.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando interpretación
    contextual del vértice en problemas de máximo o mínimo.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a interpretación
    contextual del vértice en problemas de máximo o mínimo.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
