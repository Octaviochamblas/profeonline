procedimiento:
- 'Paso 1: Calcula el vértice $(h,k)$ de la función que modela el problema.'
- 'Paso 2: Identifica las unidades correspondientes a la variable independiente (coordenada
  $h$) y a la función (coordenada $k$).'
- 'Paso 3: Expresa ambos valores en el lenguaje del problema, con sus unidades correspondientes.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en interpretación contextual del vértice en problemas
  de máximo o mínimo.
ejemplos:
- titulo: Interpretación de un vértice de altura máxima
  enunciado: El vértice de $h(t)=-4{,}9t^2+29{,}4t$ es $(3,44{,}1)$. Interpreta este
    resultado.
  solucion_pasos:
  - La coordenada $3$ representa el tiempo, en segundos, en que se alcanza la altura
    máxima.
  - La coordenada $44{,}1$ representa la altura máxima, en metros, alcanzada por el
    objeto.
- titulo: Interpretación de un vértice de área máxima
  enunciado: El vértice de $A(x)=-x^2+30x$ es $(15,225)$, donde $x$ es el ancho en
    metros. Interpreta este resultado.
  solucion_pasos:
  - Con un ancho de $15$ metros se alcanza el área máxima posible.
  - Esa área máxima es de $225$ metros cuadrados.
- titulo: ¿La coordenada $h$ del vértice siempre representa el valor óptimo de la
    cantidad modelada?
  enunciado: ¿La coordenada $h$ del vértice siempre representa el valor óptimo de
    la cantidad modelada?
  respuesta: 'No'
  solucion_pasos:
  - $h$ representa el valor de la variable independiente donde ocurre el óptimo; $k=f(h)$
    es quien representa el valor óptimo de la cantidad modelada.
- titulo: ¿Es importante distinguir las unidades de cada coordenada del vértice?
  enunciado: ¿Es importante distinguir las unidades de cada coordenada del vértice?
  respuesta: Sí
  solucion_pasos:
  - Cada coordenada representa una magnitud distinta (por ejemplo, tiempo y altura),
    con unidades propias que no deben confundirse.
errores_frecuentes:
- Confundir cuál coordenada del vértice representa la variable y cuál representa el
  valor óptimo de la función.
- Omitir las unidades correspondientes a cada coordenada al interpretar el resultado.
- Interpretar el vértice sin relacionarlo con la pregunta específica del problema.
- Reportar solo una de las dos coordenadas cuando el problema pide información sobre
  ambas.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
