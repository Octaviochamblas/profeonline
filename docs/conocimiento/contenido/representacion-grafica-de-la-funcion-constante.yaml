semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_GRAFICO
resumen_inicial: La gráfica de una función constante $f(x) = c$ es una línea recta horizontal que corta al eje $Y$ en el punto $(0, c)$ y es paralela al eje $X$.
explicacion_simple: '![La gráfica de una función constante $f(x) = c$ es una línea recta horizontal que corta al eje $Y$ en el punto $(0, c)$ y es paralela al eje $X$](/static/img/nodos/representacion-grafica-de-la-funcion-constante-intro.svg)



  Al dibujar una **función constante** $f(x) = c$ en el plano cartesiano:

  - Obtienes una **recta perfectamente horizontal**.

  - Todos los puntos de la recta están a la misma altura $y = c$.

  - Corta al eje vertical $Y$ en el punto $(0, c)$.

  - Si $c \neq 0$, nunca toca al eje horizontal $X$ (son paralelas).

  - Si $c = 0$, la recta es exactamente el eje $X$.'
explicacion_formal: "La gráfica cartesiana de $f(x) = c$ es el conjunto geométrico:\n$$\\text{Graf}(f) = \\{(x, y) \\in \\mathbb{R}^2 \\mid y = c\\}$$\n\n**Propiedades geométricas:**\n- **Inclinación**: Ángulo $\\theta = 0^\\circ$ respecto a la horizontal.\n- **Intersección con eje $Y$**: Punto $(0, c)$.\n- **Intersección con eje $X$**:\n  - Si $c \\neq 0$: $\\text{Graf}(f) \\cap \\text{Eje } X = \\emptyset$ (sin ceros reales).\n  - Si $c = 0$: $\\text{Graf}(f) \\cap \\text{Eje } X = \\text{Eje } X$ (infinitos ceros reales)."
definiciones_clave: '- **Recta horizontal**: Línea recta en el plano con pendiente $m = 0$ y ecuación $y = c$.

  - **Paralelismo axial**: Condición geométrica por la cual la recta $y = c$ mantiene una distancia constante $|c|$ respecto al eje $X$.'
propiedades_relaciones: '- **Criterio de la recta vertical**: Cumple perfectamente la prueba cortando en exactamente 1 punto a cada vertical.

  - **Prueba de la recta horizontal**: La recta $y = c$ coincide en infinitos puntos con la gráfica, demostrando que no es inyectiva.'
ejemplo_guiado:
  enunciado: '![Ejemplo La gráfica de una función constante $f(x) = c$ es una línea recta horizontal que corta al eje $Y$ en el punto $(0, c)$ y es paralela al eje $X$](/static/img/nodos/representacion-grafica-de-la-funcion-constante-ejemplos.svg)



    Traza e identifica las características principales de la gráfica de la función $f(x) = -3$.'
  pasos:
  - 'Paso 1: Identificar la altura fija: $y = -3$.'
  - 'Paso 2: Determinar el corte con el eje Y: $(0, -3)$.'
  - 'Paso 3: Identificar puntos auxiliares: $(-2, -3)$, $(1, -3)$, $(4, -3)$.'
  - 'Paso 4: Trazar una línea recta horizontal continua 3 unidades por debajo del eje X.'
  - 'Paso 5: Concluir que no intersecta al eje X.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje Y la gráfica de la función $f(x) = 7$?
  choices:
  - text: (0, 7)
    is_correct: true
  - text: (7, 0)
    is_correct: false
  - text: (7, 7)
    is_correct: false
  - text: No corta al eje Y
    is_correct: false
  explanation: La alternativa correcta es '(0, 7)'. Toda función $f(x) = c$ corta al eje Y en $(0, c)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál de las siguientes ecuaciones describe una recta horizontal?
  choices:
  - text: y = -4
    is_correct: true
  - text: x = -4
    is_correct: false
  - text: y = -4x
    is_correct: false
  - text: y = x - 4
    is_correct: false
  explanation: La alternativa correcta es 'y = -4'. Las rectas horizontales tienen la forma $y = c$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor de la constante $c$ en la ecuación $y = c$.'
- 'Paso 2: Ubicar el punto $(0, c)$ sobre el eje de ordenadas $Y$.'
- 'Paso 3: Trazar una recta paralela al eje horizontal $X$ que pase por dicho punto.'
- 'Paso 4: Verificar que para cualquier valor de $x$ la altura $y$ se mantenga invariablemente en $c$.'
errores_correccion: '- **Error común:** Confundir la recta horizontal $y = c$ con la recta vertical $x = c$.

  - **Cómo corregirlo:** Recuerda: $y = c$ fija la **altura** (recta horizontal); $x = c$ fija el **ancho** (recta vertical, que no representa una función).'
ejemplos:
- titulo: 'Ejemplo 1: Corte con ejes'
  enunciado: La gráfica de $f(x) = -5$, ¿cuántos cortes tiene con el eje X?
  alternativas:
  - 0 cortes
  - 1 corte
  - Infinitos cortes
  - 2 cortes
  respuesta: 0 cortes
  solucion_pasos:
  - 'Paso 1: La recta $y = -5$ es paralela al eje X ($y = 0$).'
  - 'Paso 2: Como $-5 \neq 0$, nunca se intersectan (0 cortes).'
- titulo: 'Ejemplo 2: Puntos pertenecientes'
  enunciado: ¿Cuál de los siguientes puntos pertenece a la gráfica de $y = 3$?
  alternativas:
  - (-10, 3)
  - (3, -10)
  - (0, 0)
  - (3, 0)
  respuesta: (-10, 3)
  solucion_pasos:
  - 'Paso 1: La condición es que la segunda coordenada sea $3$.'
  - 'Paso 2: El punto $(-10, 3)$ cumple la ecuación.'
- titulo: 'Ejemplo 3: Gráfica del eje X'
  enunciado: ¿Qué función constante representa la recta del propio eje X?
  alternativas:
  - f(x) = 0
  - f(x) = 1
  - f(x) = x
  - x = 0
  respuesta: f(x) = 0
  solucion_pasos:
  - 'Paso 1: Sobre el eje X la ordenada es siempre cero ($y = 0$).'
  - 'Paso 2: La función es $f(x) = 0$.'
- titulo: 'Ejemplo 4: Posición en cuadrantes'
  enunciado: ¿Por cuáles cuadrantes pasa la gráfica de $f(x) = -2$?
  alternativas:
  - Cuadrantes III y IV
  - Cuadrantes I y II
  - Cuadrantes I y III
  - Solo cuadrante IV
  respuesta: Cuadrantes III y IV
  solucion_pasos:
  - 'Paso 1: Al estar por debajo del eje X ($y < 0$), se ubica en el tercer ($x < 0, y < 0$) y cuarto cuadrante ($x > 0, y < 0$).'
errores_frecuentes:
- Trazar una recta vertical en lugar de horizontal.
- Asignar inclinación a la recta cuando los valores de x crecen.
- Confundir las coordenadas del punto de corte $(0, c)$ con $(c, 0)$.
afirmaciones_verdaderas:
- La gráfica de una función constante es siempre una recta horizontal paralela al eje X.
- Una recta horizontal y = c no corta al eje X salvo en el caso especial en que c = 0.
al_terminar_debes_poder: '**QUÉ:** Graficar y caracterizar geométricamente funciones constantes en el plano cartesiano.


  **CÓMO:** Ubicando la ordenada fija (0, c) y trazando una línea recta horizontal con pendiente nula.


  ![Resumen La gráfica de una función constante $f(x) = c$ es una línea recta horizontal que corta al eje $Y$ en el punto $(0, c)$ y es paralela al eje $X$](/static/img/nodos/representacion-grafica-de-la-funcion-constante-resumen.svg)'
