semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_GRAFICO
resumen_inicial: La gráfica de una función constante $f(x) = c$ es una recta horizontal
  continua que corta al eje $Y$ en $(0, c)$.
explicacion_simple: 'Para graficar $f(x) = c$:

  1. Ubicamos el número $c$ en el eje vertical $Y$.

  2. Trazamos una línea recta completamente horizontal que pase por el punto $(0,
  c)$.

  3. Observamos que para cualquier valor de $x$ a lo largo de la recta horizontal,
  la altura $y$ siempre vale $c$.'
explicacion_formal: 'La **gráfica cartesiana de la función constante** es el lugar
  geométrico:


  $$G(f) = \{(x, c) \in \mathbb{R}^2 \mid x \in \mathbb{R}\}\subset \mathbb{R}^2$$


  **Desglose de la fórmula:**

  - Recta de ecuación cartesiana $y = c$, paralela al eje de las abscisas $X$ con
  intersección única en el eje de las ordenadas $(0, c)$.'
definiciones_clave: '- **Recta horizontal**: Geometría plana del trazo de $f(x) =
  c$ en $\mathbb{R}^2$.

  - **Intersección $(0, c)$**: Coordenada puntual sobre el eje $Y$ donde cruza la
  recta constante.'
propiedades_relaciones: '- **Sin intersección con el eje $X$**: Si $c \neq 0$, la
  gráfica jamás corta al eje $X$. Si $c = 0$, coincide exactamente con el eje $X$.'
ejemplo_guiado:
  enunciado: Describe la representación gráfica de la función constante $f(x) = 3$
    e indica su intersección con los ejes $X$ e $Y$.
  pasos:
  - 'Paso 1: Identificar la constante $c = 3$.Paso 2: Trazar una recta horizontal
    paralela al eje $X$ a una altura de 3 unidades sobre el origen.Paso 3: Identificar
    el punto de corte con el eje $Y$: $(0, 3)$.Paso 4: Notar que como $c = 3 \neq
    0$, la recta no corta al eje $X$ en ningún punto.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje vertical $Y$ la gráfica de la función constante
    $f(x) = 3$?
  choices:
  - text: $(0, 3)$
    is_correct: true
  - text: $(3, 0)$
    is_correct: false
  - text: $(0, 0)$
    is_correct: false
  - text: No corta al eje Y.
    is_correct: false
  explanation: La alternativa correcta es '$(0, 3)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuándo la gráfica de una función constante $f(x) = c$ se solapa exactamente
    sobre el eje horizontal $X$?
  choices:
  - text: Cuando la constante vale cero ($c = 0$).
    is_correct: true
  - text: Cuando la constante es mayor que 10.
    is_correct: false
  - text: Cuando la constante es un número negativo.
    is_correct: false
  - text: Jamás puede solaparse.
    is_correct: false
  explanation: La alternativa correcta es 'Cuando la constante vale cero ($c = 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el valor $c$ sobre el eje vertical $Y$.'
- 'Paso 2: Marcar el punto de intersección $(0, c)$.'
- 'Paso 3: Trazar una recta horizontal que atraviese ese punto de izquierda a derecha.'
errores_correccion: '- **Error común:** Dibujar una línea vertical pasando por $x
  = c$.

  - **Cómo corregirlo:** La función constante $f(x) = c$ es una recta HORIZONTAL $y
  = c$, nunca una vertical.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
