semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_GRAFICO
resumen_inicial: La representación gráfica de la función constante $f(x) = c$ es una recta horizontal paralela al eje $X$ que cruza al eje $Y$ en $(0, c)$.
explicacion_simple: |
  Para graficar una **función constante** $f(x) = c$:

  1. Buscas el número $c$ en el eje vertical $Y$.
  2. Dibujas una **línea recta totalmente horizontal** (plana) que pase por ese número $c$.
  3. La recta es perfectamente paralela al suelo (eje $X$).
explicacion_formal: |
  Sea la función constante $f(x) = c$. Su conjunto gráfico $\text{Graf}(f) \subset \mathbb{R}^2$ viene dado por el lugar geométrico:

  $$\text{Graf}(f) = \{(x, c) \in \mathbb{R}^2 \mid x \in \mathbb{R}\}$$

  **Características geométricas:**
  - Recta paralela al eje $X$ de ecuación $y = c$.
  - Intercepto en el eje $Y$: Punto único $(0, c)$.
  - Pendiente geométrica: $m = 0$.
definiciones_clave: |
  - **Gráfica de función constante**: Recta horizontal cuyo valor de ordenada $y$ permanece invariable para toda abscisa $x$.
propiedades_relaciones: |
  - **Caso particular $c = 0$**: La gráfica de $f(x) = 0$ coincide exactamente con la recta del eje horizontal $X$.
ejemplo_guiado:
  enunciado: "Grafica la función constante $f(x) = -4$ y determina las coordenadas de tres puntos pertenecientes a su recta."
  pasos:
    - 'Paso 1: Identificar la constante de salida: $c = -4$.'
    - 'Paso 2: Ubicar el punto $(0, -4)$ sobre el eje $Y$.'
    - 'Paso 3: Trazar la recta horizontal paralela al eje $X$ que pasa por $(0, -4)$.'
    - 'Paso 4: Seleccionar tres puntos arbitrarios de la recta, por ejemplo: $(-2, -4)$, $(0, -4)$ y $(3, -4)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cómo es la trayectoria gráfica de la función constante $f(x) = -4$ en el plano cartesiano?"
    choices:
      - {text: "Una recta horizontal paralela al eje $X$ que pasa por $(0, -4)$.", is_correct: true}
      - {text: "Una recta vertical paralela al eje $Y$ que pasa por $(-4, 0)$.", is_correct: false}
      - {text: "Una recta inclinada que pasa por el origen $(0, 0)$.", is_correct: false}
      - {text: "Una curva parabólica abierta hacia abajo.", is_correct: false}
    explanation: "La alternativa correcta es 'Una recta horizontal paralela al eje $X$ que pasa por $(0, -4)$.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿En qué punto corta al eje $Y$ la gráfica de la función constante $f(x) = 7$?"
    choices:
      - {text: "$(0, 7)$", is_correct: true}
      - {text: "$(7, 0)$", is_correct: false}
      - {text: "$(0, 0)$", is_correct: false}
      - {text: "$(-7, 0)$", is_correct: false}
    explanation: "La alternativa correcta es '$(0, 7)$'. El intercepto en el eje $Y$ siempre es $(0, c)$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el valor constante $c$ de la regla $f(x) = c$.'
  - 'Paso 2: Ubicar la ordenada $c$ en el eje vertical $Y$.'
  - 'Paso 3: Trazar una recta horizontal paralela al eje $X$ que atraviese $(0, c)$.'
  - 'Paso 4: Verificar que todos los puntos graficados tengan la forma $(x, c)$.'
errores_correccion: |
  - **Error común:** Dibujar una línea vertical que pasa por $x = c$.
  - **Cómo corregirlo:** La función constante $f(x) = c$ genera una recta **HORIZONTAL** ($y = c$). Una recta vertical no es función ($x = c$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La gráfica de la función constante $f(x) = 3$ es una recta vertical que pasa por $x = 3$.'
  - 'La gráfica de la función constante $f(x) = c$ corta al eje $X$ en el punto $(c, 0)$ cuando $c \neq 0$.'
  - 'Graficar una función constante requiere calcular la inclinación mediante una tabla de 10 puntos.'
  - 'La recta $y = -2$ no se puede dibujar en el plano cartesiano porque las constantes son invisibles.'
  - 'Una función constante genera una recta inclinada a $45^\circ$ que pasa por el origen.'
afirmaciones_verdaderas:
  - 'La gráfica de la función constante $f(x) = c$ es una recta horizontal paralela al eje $X$ que intersecta al eje $Y$ en el punto $(0, c)$.'
  - 'Todos los puntos de la recta tienen la misma ordenada $y = c$, independientemente del valor de la abscisa $x$.'
al_terminar_debes_poder: |
  QUÉ: Representar e interpretar gráficamente funciones constantes en el plano cartesiano.
  CÓMO: Identificar la constante $c$, marcar el intercepto $(0, c)$ en el eje $Y$ y trazar una recta horizontal paralela al eje $X$.
