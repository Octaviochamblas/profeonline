semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_GRAFICO
resumen_inicial: 'Representación gráfica de la función constante: conceptos, representación
  y propiedades en Función constante y función lineal.'
explicacion_simple: Si el resultado nunca cambia, la línea que dibujas tampoco sube
  ni baja. La gráfica de una función constante es siempre plana.
explicacion_formal: '### Definición formal


  La gráfica de $f(x) = c$ es el conjunto $\{(x, c) : x \in \mathbb{R}\}$, que geométricamente
  corresponde a una recta paralela al eje $x$, ubicada a una distancia $|c|$ de él
  (por encima si $c>0$, por debajo si $c<0$, coincidente con el eje si $c=0$).


  ### Desarrollo didáctico


  Como todo punto de la gráfica tiene la misma ordenada $c$, cualquier par de puntos
  de la recta comparten esa altura: $(0,c)$, $(5,c)$, $(-3,c)$, etc.


  Graficar es sencillo: basta marcar el punto $(0,c)$ y trazar una recta horizontal
  que pase por él, extendiéndola en ambas direcciones.'
definiciones_clave: '- **Representación gráfica de la función constante**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a representación gráfica de la función constante.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a representación gráfica
    de la función constante.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a representación gráfica de la función
    constante.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    representación gráfica de la función constante?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en función constante y función lineal
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en función constante y función lineal. Es la condición
    de existencia y unicidad en representación gráfica de la función constante.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en representación gráfica
    de la función constante, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el valor constante $c$ de la función.'
- 'Paso 2: Marca el punto $(0, c)$ en el eje vertical.'
- 'Paso 3: Traza una recta horizontal que pase por ese punto, paralela al eje $x$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar representación gráfica de la función constante.
ejemplos:
- titulo: Gráfica de una constante positiva
  enunciado: Grafica $f(x) = 3$.
  solucion_pasos:
  - Se marca el punto $(0,3)$.
  - Se traza una recta horizontal a la altura $y=3$.
- titulo: Gráfica de una constante negativa
  enunciado: Grafica $f(x) = -2$.
  solucion_pasos:
  - Se marca el punto $(0,-2)$.
  - Se traza una recta horizontal a la altura $y=-2$, bajo el eje $x$.
- titulo: ¿La gráfica de $f(x)=0$ coincide con el eje $x$?
  enunciado: ¿La gráfica de $f(x)=0$ coincide con el eje $x$?
  respuesta: Sí
  solucion_pasos:
  - Todo punto de la gráfica tiene ordenada 0, que es exactamente el eje horizontal.
- titulo: ¿La gráfica de una función constante puede ser una recta vertical?
  enunciado: ¿La gráfica de una función constante puede ser una recta vertical?
  respuesta: 'No'
  solucion_pasos:
  - Una recta vertical no representaría una función (viola el criterio de la línea
    vertical); la constante es siempre horizontal.
errores_frecuentes:
- Confundir la gráfica horizontal (función constante) con una vertical.
- Ubicar el punto $(c, 0)$ en vez de $(0, c)$ al iniciar el trazo.
- Asumir que toda recta horizontal pasa necesariamente por el origen.
- Trazar la recta con inclinación en vez de perfectamente horizontal.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando representación
  gráfica de la función constante.
