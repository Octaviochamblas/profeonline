resumen_inicial: La aplicación de la regla de diferencia de cuadrados permite multiplicar
  directamente binomios conjugados con coeficientes, fracciones y potencias compuestas.
explicacion_simple: 'Para resolver expresiones más avanzadas como $(5x^3 + 2y^2)(5x^3
  - 2y^2)$, elevamos el primer bloque al cuadrado ($(5x^3)^2 = 25x^6$), elevamos el
  segundo bloque al cuadrado ($(2y^2)^2 = 4y^4$) y colocamos un signo menos entre
  ellos: $25x^6 - 4y^4$.'
explicacion_formal: 'Para monomios generales $A = c_1 x^m$ y $B = c_2 y^n$, el producto
  $(A + B)(A - B)$ sigue la regla canónica:


  $$(A + B)(A - B) = A^2 - B^2 = (c_1 x^m)^2 - (c_2 y^n)^2 = c_1^2 x^{2m} - c_2^2
  y^{2n}$$


  **Desglose simbólico:**

  - $c_1^2 x^{2m}$: Elevación del primer monomio al cuadrado (coeficiente al cuadrado
  y exponente $\cdot 2$).

  - $-$: Signo de resta estructural de la diferencia de cuadrados.

  - $c_2^2 y^{2n}$: Elevación del segundo monomio al cuadrado.


  > **Complemento didáctico:** Esta regla ahorra $4$ multiplicaciones distributivas
  horizontales al operar directamente sobre la estructura cuadrática.'
definiciones_clave: '- **Diferencia de cuadrados con potencias**: Expresión $c_1^2
  x^{2m} - c_2^2 y^{2n}$ obtenida al multiplicar monomios de grado $m$ y $n$.

  - **Simplificación directa**: Proceso de resolver $(A+B)(A-B)$ en un solo paso algebraico.'
propiedades_relaciones: '- **Racionalización de denominadores**: Técnica en cálculo
  donde se multiplica numerador y denominador por el conjugado para eliminar raíces
  cuadradas.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(5x^3 + 2y^2)(5x^3 - 2y^2)$ aplicando la regla
    de diferencia de cuadrados.
  pasos:
  - 'Paso 1: Identificar los monomios $A = 5x^3$ y $B = 2y^2$.'
  - 'Paso 2: Elevar el primer monomio al cuadrado: $(5x^3)^2 = 5^2 \cdot (x^3)^2 =
    25x^6$.'
  - 'Paso 3: Elevar el segundo monomio al cuadrado: $(2y^2)^2 = 2^2 \cdot (y^2)^2
    = 4y^4$.'
  - 'Paso 4: Escribir la resta de los cuadrados: $25x^6 - 4y^4$.'
  - 'Conclusión: El desarrollo simplificado es $25x^6 - 4y^4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de elevar el monomio $A = 5x^3$ al cuadrado?
  choices:
  - text: $25x^6$
    is_correct: true
  - text: $10x^6$
    is_correct: false
  - text: $25x^5$
    is_correct: false
  - text: $5x^6$
    is_correct: false
  explanation: La alternativa correcta es '$25x^6$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de $(5x^3 + 2y^2)(5x^3 - 2y^2)$, ¿cuál es el término
    restado?
  choices:
  - text: $4y^4$
    is_correct: true
  - text: $2y^4$
    is_correct: false
  - text: $4y^2$
    is_correct: false
  - text: $8y^4$
    is_correct: false
  explanation: La alternativa correcta es '$4y^4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado el coeficiente y multiplicar por 2 el exponente del
  primer monomio.'
- 'Paso 2: Elevar al cuadrado el coeficiente y multiplicar por 2 el exponente del
  segundo monomio.'
- 'Paso 3: Unir ambos resultados mediante el operador de resta: $A^2 - B^2$.'
errores_correccion: '- **Error 1: Sumar 2 a los exponentes en lugar de multiplicarlos
  por 2 al elevar monomios al cuadrado.** **Cómo corregirlo:** Aplicar la propiedad
  de potencia de potencia $(x^m)^2 = x^{2m}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(\frac{1}{2}a + 3b)(\frac{1}{2}a - 3b)$.
  alternativas:
  - $\frac{1}{4}a^2 - 9b^2$
  - $\frac{1}{2}a^2 - 9b^2$
  - $\frac{1}{4}a^2 + 9b^2$
  respuesta: $\frac{1}{4}a^2 - 9b^2$
  solucion_pasos:
  - 1. $(\frac{1}{2}a)^2 = \frac{1}{4}a^2$.
  - 2. $(3b)^2 = 9b^2$.
  - '3. Resultado: $\frac{1}{4}a^2 - 9b^2$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el producto de $(4x^4 + 3)(4x^4 - 3)$?
  alternativas:
  - $16x^8 - 9$
  - $16x^8 + 9$
  - $8x^8 - 9$
  respuesta: $16x^8 - 9$
  solucion_pasos:
  - 1. $(4x^4)^2 = 16x^8$.
  - 2. $3^2 = 9$.
  - '3. Resultado: $16x^8 - 9$.'
- titulo: ¿Es $9a^4 - 16b^6$ el desarrollo directo de $(3a^2 + 4b^3)(3a^2 - 4b^3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3a^2)^2 - (4b^3)^2 = 9a^4 - 16b^6$.
- titulo: ¿El producto $(\sqrt{x} + 2)(\sqrt{x} - 2)$ resulta en un número racional
    para todo $x > 0$ entero?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\sqrt{x})^2 - 2^2 = x - 4$, que elimina la raíz cuadrada.
errores_frecuentes:
- Multiplicar por 2 los exponentes en lugar de aplicar la regla de potencia de potencia.
- Declarar que $(5x^3 + 2y^2)(5x^3 - 2y^2)$ es igual a $25x^6 + 4y^4$.
- Elevar al cuadrado solo las variables dejando los coeficientes numéricos sin elevar.
- Sumar 2 al exponente de los monomios al aplicar la diferencia de cuadrados.
- Declarar que el resultado de multiplicar monomios fraccionarios contiene término
  central.
afirmaciones_verdaderas:
- Al aplicar la regla sobre monomios con exponentes, los exponentes de las variables
  se duplican.
- El resultado de multiplicar dos binomios conjugados de cualquier grado es una diferencia
  de cuadrados.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla de diferencia
  de cuadrados sobre monomios con fracciones, exponentes altos y raíces.
