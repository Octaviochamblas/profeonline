procedimiento:
- 'Paso 1: Pasos para aplicar la regla:'
- 'Paso 2: Identifica que es una suma por diferencia.'
- 'Paso 3: Ubica el término que NO cambia de signo (el término estable). Ése será
  tu $A$.'
- 'Paso 4: Ubica el término que SÍ cambia de signo (el término opuesto). Ése será
  tu $B$.'
- 'Paso 5: El resultado es $A^2 - B^2$. (Siempre es menos.).'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en aplicación de la regla de diferencia de cuadrados.
ejemplos:
- titulo: Aplicación directa
  enunciado: Calcula $(y - 8)(y + 8)$.
  solucion_pasos:
  - 'Término estable: $y$. Su cuadrado es $y^2$.'
  - 'Término que cambia: $8$. Su cuadrado es $64$.'
  - 'Resultado: $y^2 - 64$.'
- titulo: Variables en ambos términos
  enunciado: Desarrolla $(5x + 3y^2)(5x - 3y^2)$.
  solucion_pasos:
  - 'Cuadrado del primero: $(5x)^2 = 25x^2$.'
  - 'Cuadrado del segundo: $(3y^2)^2 = 9y^4$.'
  - 'Resultado: $25x^2 - 9y^4$.'
- titulo: 'Respecto de «Aplicación de la regla de diferencia de cuadrados»: ¿Es correcta
    esta caracteri'
  enunciado: 'Respecto de «Aplicación de la regla de diferencia de cuadrados»: ¿Es
    correcta esta caracterización? «La regla de la suma por diferencia es: **''El
    cuadrado del término idéntico, menos el cuadrado del término que cambia de signo.''**
    Fórmula: $(a+b)(a-b) = a^2 - b^2$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La regla de la suma por diferencia
    es: **''El cuadrado del término idéntico, menos el cuadrado del término que cambia
    de signo.''** Fórmula: $(a+b)(a-b) = a^2 - b^2$'
- titulo: 'Respecto de «Aplicación de la regla de diferencia de cuadrados»: ¿Es válida
    esta afirmación?'
  enunciado: 'Respecto de «Aplicación de la regla de diferencia de cuadrados»: ¿Es
    válida esta afirmación? «Poner un signo más en el resultado final: $(x-2)(x+2)
    = x^2 + 4$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La regla de la suma por diferencia
    es: **''El cuadrado del término idéntico, menos el cuadrado del término que cambia
    de signo.''** Fórmula: $(a+b)(a-b) = a^2 - b^2$'
errores_frecuentes:
- 'Poner un signo más en el resultado final: $(x-2)(x+2) = x^2 + 4$.'
- Porque la multiplicación de un positivo y un negativo siempre anula la variable.
- Porque es una regla preestablecida sin demostración algebraica.
- Porque los términos centrales se dividen por $1$.
- $4m^2 + 25n^2$.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
al_terminar_debes_ponder: Reconocer y expandir expresiones utilizando aplicación de
  la regla de diferencia de cuadrados.
