procedimiento:
- 'Paso 1: Cuenta los términos. Si son 4, es un candidato ideal.'
- 'Paso 2: Descarta que exista un factor común para toda la expresión.'
- 'Paso 3: Compara la razón (división) entre los coeficientes del primer par con los
  del segundo par.'
- 'Paso 4: Si las proporciones coinciden, procede con confianza a agrupar.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reconocimiento de estructura factorizable por agrupación.
ejemplos:
- titulo: Es factorizable por agrupación $3x^3 + 4x^2 + 6x + 8$
  enunciado: ¿Es factorizable por agrupación $3x^3 + 4x^2 + 6x + 8$?
  solucion_pasos:
  - 'Términos: 4. (Candidato)'
  - 'Factor global: No hay.'
  - 'Proporcionalidad: Par 1 (3 y 4). Par 2 (6 y 8).'
  - La fracción 3/4 es igual a 6/8. ¡Sí, la agrupación funcionará perfectamente!
- titulo: Un polinomio de 5 términos se puede agrupar en grupos de tamaño igual
  enunciado: ¿Un polinomio de 5 términos se puede agrupar en grupos de tamaño igual?
  solucion_pasos:
  - 5 es primo, no se puede dividir en grupos simétricos como pares o tríos.
  - 'Respuesta: Falso'
- titulo: 'Respecto de «Reconocimiento de estructura factorizable por agrupación»:
    ¿La siguiente formul'
  enunciado: 'Respecto de «Reconocimiento de estructura factorizable por agrupación»:
    ¿La siguiente formulación es correcta? «La factorización por agrupación suele
    ser viable en polinomios de 4 o 6 términos que carecen de un factor común global,
    y cuyos coeficientes mantienen una razón de proporcionalidad entre pares»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La factorización por agrupación
    suele ser viable en polinomios de 4 o 6 términos que carecen de un factor común
    global, y cuyos coeficientes mantienen una razón de proporcionalidad entre pares.'
- titulo: 'Respecto de «Reconocimiento de estructura factorizable por agrupación»:
    ¿La siguiente conclu'
  enunciado: 'Respecto de «Reconocimiento de estructura factorizable por agrupación»:
    ¿La siguiente conclusión es correcta? «Intentar agrupar polinomios de 3 términos
    dividiendo un término por la mitad sin aplicar métodos especiales»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La factorización por agrupación
    suele ser viable en polinomios de 4 o 6 términos que carecen de un factor común
    global, y cuyos coeficientes mantienen una razón de proporcionalidad entre pares.'
errores_frecuentes:
- Intentar agrupar polinomios de 3 términos dividiendo un término por la mitad sin
  aplicar métodos especiales.
- Forzar la agrupación en 4 términos que no son proporcionales (el resultado serán
  paréntesis diferentes que no sirven).
- Que todos los términos sean pares.
- Para «¿Cuál es la pista visual más evidente para intentar factorizar por agrupación»,
  la respuesta correcta es Que el polinomio sea de grado 2.
- Que tenga un factor común numérico en todos los términos.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando reconocimiento de estructura factorizable por agrupación.
