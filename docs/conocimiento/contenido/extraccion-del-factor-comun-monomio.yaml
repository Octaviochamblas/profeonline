resumen_inicial: La extracción del factor común monomio es el algoritmo que divide
  cada término de una expresión por el monomio común para reescribir el polinomio
  como un producto $F \cdot (T_1 + T_2 + \dots + T_n)$.
explicacion_simple: Una vez hallado el factor común (por ejemplo $3x$), divides cada
  término del polinomio original entre $3x$ para obtener lo que queda entre paréntesis.
  Si el polinomio es $3x^2 + 6x$, divides $3x^2 / 3x = x$ y $6x / 3x = 2$, obteniendo
  $3x(x + 2)$.
explicacion_formal: 'Dada la expresión $P = t_1 + t_2 + \dots + t_n$ con factor común
  monomio $F \neq 0$, la **Extracción del Factor Común Monomio** responde a la identidad:


  $$P = F \cdot \left( \frac{t_1}{F} + \frac{t_2}{F} + \dots + \frac{t_n}{F} \right)$$


  **Desglose simbólico:**

  - $F$: Factor común monomio previo.

  - $\frac{t_i}{F}$: Cociente de cada término dividido por $F$, aplicando leyes de
  cociente de potencias $\frac{x^a}{x^b} = x^{a-b}$.

  - El número de términos dentro del paréntesis es EXACTAMENTE igual al número de
  términos del polinomio original.


  > **Complemento didáctico:** Conserva el elemento neutro multiplicativo de modo
  que si $t_i = F$, el cociente $\frac{t_i}{F} = 1$ no desaparece.'
definiciones_clave: '- **Extracción de factor común**: Algoritmo de división término
  a término por el monomio común.

  - **Conservación de cantidad de términos**: Regla que exige que el paréntesis interior
  mantenga el número de sumandos iniciales.'
propiedades_relaciones: '- **Elemento neutro $1$**: Si un término es idéntico al factor
  común $F$, el residuo dentro del paréntesis es $1$, no $0$.'
ejemplo_guiado:
  enunciado: Factorice completamente el polinomio $12x^4 - 8x^3 + 4x^2$ mediante extracción
    de factor común monomio.
  pasos:
  - 'Paso 1: Identificar el factor común monomio: $\text{MCD}(12, 8, 4) = 4$ y menor
    exponente $x^2 \to F = 4x^2$.'
  - 'Paso 2: Dividir el primer término: $\frac{12x^4}{4x^2} = 3x^{4-2} = 3x^2$.'
  - 'Paso 3: Dividir el segundo término: $\frac{-8x^3}{4x^2} = -2x^{3-2} = -2x$.'
  - 'Paso 4: Dividir el tercer término: $\frac{4x^2}{4x^2} = 1$.'
  - 'Paso 5: Escribir el producto: $4x^2(3x^2 - 2x + 1)$.'
  - 'Conclusión: El polinomio factorizado es $4x^2(3x^2 - 2x + 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si se extrae $4x^2$ como factor común del término $4x^2$, ¿cuál es el
    residuo que queda dentro del paréntesis?
  choices:
  - text: $1$, porque $\frac{4x^2}{4x^2} = 1$
    is_correct: true
  - text: $0$
    is_correct: false
  - text: $x$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$1$, porque $\frac{4x^2}{4x^2} = 1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la factorización de $12x^4 - 8x^3 + 4x^2$, ¿cuál es la expresión entre
    paréntesis resultante?
  choices:
  - text: $3x^2 - 2x + 1$
    is_correct: true
  - text: $3x^2 - 2x$
    is_correct: false
  - text: $3x^2 - 2x + 0$
    is_correct: false
  - text: $4x^2 - 2x + 1$
    is_correct: false
  explanation: La alternativa correcta es '$3x^2 - 2x + 1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el factor común monomio $F$.'
- 'Paso 2: Dividir cada término del polinomio original entre $F$.'
- 'Paso 3: Encerrar los cocientes entre paréntesis y anteponer el factor $F$.'
errores_correccion: '- **Error 1: Reemplazar por 0 el residuo de un término cuando
  este coincide con el factor común.** **Cómo corregirlo:** La división de un término
  por sí mismo da $\frac{F}{F} = 1$; el número $1$ DEBE incluirse en el paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice la expresión $5x^3 - 5x$.
  alternativas:
  - $5x(x^2 - 1)$
  - $5x(x^2)$
  - $5(x^3 - x^2)$
  respuesta: $5x(x^2 - 1)$
  solucion_pasos:
  - '1. Factor común: $5x$.'
  - '2. Dividiendo: $\frac{5x^3}{5x} = x^2$ y $\frac{-5x}{5x} = -1$.'
  - '3. Resultado: $5x(x^2 - 1)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la factorización de $6a^2b + 3ab$?
  alternativas:
  - $3ab(2a + 1)$
  - $3ab(2a)$
  - $3ab(2a + 3ab)$
  respuesta: $3ab(2a + 1)$
  solucion_pasos:
  - '1. Factor común: $3ab$.'
  - '2. Cocientes: $\frac{6a^2b}{3ab} = 2a$ y $\frac{3ab}{3ab} = 1$.'
  - '3. Resultado: $3ab(2a + 1)$.'
- titulo: ¿El desarrollo de $2x(3x - 4)$ reconstruye exactamente el polinomio $6x^2
    - 8x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2x \cdot 3x - 2x \cdot 4 = 6x^2 - 8x$.
- titulo: ¿Disminuye la cantidad de sumandos dentro del paréntesis al extraer un factor
    común?
  respuesta: 'No'
  solucion_pasos:
  - No, la cantidad de términos dentro del paréntesis debe ser igual a la del polinomio
    original.
errores_frecuentes:
- Reemplazar por 0 el término cuyo valor coincide exactamente con el factor común
  monomio extraído.
- Restar los coeficientes numéricos en lugar de dividirlos al realizar la extracción
  del factor.
- Sumar los exponentes de las variables en lugar de restarlos al dividir entre el
  factor común.
- Eliminar sumandos del interior del paréntesis reduciendo el número total de términos.
- Declarar que la extracción del factor común requiere que todos los coeficientes
  sean positivos.
afirmaciones_verdaderas:
- Al extraer el factor común monomio, los exponentes del paréntesis se obtienen restando
  el exponente extraído.
- La cantidad de términos dentro del paréntesis coincide con la cantidad de términos
  del polinomio inicial.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar el algoritmo de extracción
  del factor común monomio sin omitir términos neutros.
