procedimiento:
- Es la unión del MCD numérico y las variables comunes.
- Toda cantidad dividida por sí misma es 1.
- El MCD de 14 y 7 es 7. El menor exponente de x es 2.
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en extracción del factor común monomio.
ejemplos:
- titulo: El factor común monomio de $5x^2y - 10xy^2$ es $5xy$
  enunciado: ¿El factor común monomio de $5x^2y - 10xy^2$ es $5xy$?
  solucion_pasos:
  - MCD 5, letras comunes x e y con exponente 1.
  - 'Respuesta: Verdadero'
- titulo: Al extraer $4m$ de $4m^2 - 4m$, queda $4m(m)$
  enunciado: ¿Al extraer $4m$ de $4m^2 - 4m$, queda $4m(m)$?
  solucion_pasos:
  - Falta el 1. Lo correcto es 4m(m - 1).
  - 'Respuesta: Falso'
- titulo: 'Respecto de «Extracción del factor común monomio»: ¿Describe adecuadamente
    el concepto esta'
  enunciado: 'Respecto de «Extracción del factor común monomio»: ¿Describe adecuadamente
    el concepto esta frase? «Coeficiente numérico y parte literal»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Coeficiente numérico y parte
    literal.'
- titulo: 'Respecto de «Extracción del factor común monomio»: ¿Se puede aceptar esta
    afirmación? «Solo'
  enunciado: 'Respecto de «Extracción del factor común monomio»: ¿Se puede aceptar
    esta afirmación? «Solo números»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Coeficiente numérico y parte
    literal.'
errores_frecuentes:
- Solo números.
- Para «¿De qué está compuesto un factor común monomio», la respuesta correcta es
  Solo letras.
- Para «¿De qué está compuesto un factor común monomio», la respuesta correcta es
  Dos sumandos.
- Para «Si divides un término por su factor común y son idénticos, ¿qué debes colocar
  en el paréntesis», la respuesta correcta es 0.
- Para «Si divides un término por su factor común y son idénticos, ¿qué debes colocar
  en el paréntesis», la respuesta correcta es La misma variable.
afirmaciones_verdaderas:
