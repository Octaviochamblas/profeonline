semantic_id: MAT.ALG.FACTOR_COMUN.EXTRACCION_MONOMIO
resumen_inicial: 'Extracción del factor común monomio: concepto, método de descomposición
  y reglas en Factor común.'
explicacion_simple: Extraer un monomio común equivale a aplicar la distributividad
  en sentido inverso. Cada término se divide por el factor elegido y los cocientes
  quedan dentro del paréntesis.
explicacion_formal: '### Definición formal


  Extraer el factor común monomio $M$ de un polinomio $P = c_1x^{e_1} + c_2x^{e_2}
  + \dots + c_nx^{e_n}$ consiste en escribir $P = M \left( \frac{c_1}{M}x^{e_1-k}
  + \frac{c_2}{M}x^{e_2-k} + \dots \right)$, donde $M$ es el producto entre el MCD
  de los coeficientes y la variable elevada al menor exponente común $k$.


  ### Desarrollo didáctico


  Es la unión del MCD numérico y las variables comunes.


  Toda cantidad dividida por sí misma es 1.


  El MCD de 14 y 7 es 7. El menor exponente de x es 2.'
definiciones_clave: '- **Extracción del factor común monomio**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en extracción del factor común monomio.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de extracción
    del factor común monomio.
  pasos:
  - Identificar la estructura o los factores comunes en los términos del polinomio.
  - Aplicar la regla o método correspondiente a extracción del factor común monomio.
  - Expresar el polinomio como un producto de dos o más factores.
  - Verificar multiplicando los factores resultantes.
