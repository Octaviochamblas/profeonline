semantic_id: MAT.ALG.FACTOR_COMUN.EXTRACCION_MONOMIO
resumen_inicial: La extracción del factor común monomio consiste en dividir cada término del polinomio entre el monomio común
  reconocido y escribir el resultado como el producto del factor común por el paréntesis divisor.
explicacion_simple: "Para **extraer el factor común monomio** y dejar la expresión completamente factorizada (ej: $10x^3 +\
  \ 15x^2$):\n- **PROCEDIMIENTO DE 3 PASOS**:\n  1. **Reconoce el Factor Común Monomio**: Para $10x^3$ y $15x^2$, el común\
  \ es **$5x^2$**.\n  2. **Divide CADA término por el factor común**:\n     - Primer término: $\frac{10x^3}{5x^2} = \\mathbf{2x}$\
  \ (¡los coeficientes se dividen $10 \\div 5 = 2$ y los exponentes se restan $3 - 2 = 1$!).\n     - Segundo término: $\\\
  frac{15x^2}{5x^2} = \\mathbf{3}$ (¡$15 \\div 5 = 3$ y $x^2 \\div x^2 = 1$!).\n  3. **Escribe el resultado final**: Pon el\
  \ factor común afuera y los cocientes adentro entre paréntesis:\n     $$\\mathbf{5x^2 (2x + 3)}$$\n\n![Extracción del factor\
  \ común monomio](/static/img/nodos/extraccion-del-factor-comun-monomio-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el polinomio $P(x) = \sum_{i=1}^k T_i \in \mathbb{R}[x]$ y $M$ su factor común monomio de máxima dimensión. La **extracción
  del factor común monomio** define el mapa de descomposición factorizada $f: \mathbb{R}[x] \to \mathbb{R}[x] \times \mathbb{R}[x]$
  dado por:


  $$P(x) = M \cdot Q(x) = M \cdot \left( \sum_{i=1}^k \frac{T_i}{M} \right)$$


  donde $Q(x) = \sum_{i=1}^k q_i$ es el polinomio cociente cuyas componentes se obtienen por división monomial $q_i = \frac{T_i}{M}$.


  ### Leyes de Exponentes y Coeficientes en la División

  Para cada término monómico $T_i = c_i x_1^{\alpha_{i,1}} \dots x_m^{\alpha_{i,m}}$ dividido entre $M = c_M x_1^{\beta_1}
  \dots x_m^{\beta_m}$:

  - **Cociente de coeficientes**: $c_{q_i} = \frac{c_i}{c_M}$.

  - **Resta de exponentes**: El exponente de cada variable $x_j$ en el cociente es $\alpha_{i,j} - \beta_j \ge 0$.


  ### Síntesis didáctica

  Extraer un factor común equivale a efectuar la división exacta de cada término del polinomio por dicho monomio, colocando
  los cocientes resultantes dentro de un paréntesis.

  '
definiciones_clave: '- **Extracción de factor común**: Proceso de reescribir un polinomio $P(x)$ como el producto $M \cdot
  Q(x)$.

  - **Polinomio cociente ($Q(x)$)**: Expresión encerrada entre paréntesis obtenida al dividir cada término de la suma original
  entre el factor común $M$.

  - **Resta de exponentes en división**: Propiedad de potencias $\frac{x^a}{x^b} = x^{a-b}$ aplicada al calcular las variables
  del polinomio cociente.

  '
propiedades_relaciones: '- **Conservación del número de términos**: El polinomio cociente $Q(x)$ dentro del paréntesis debe
  tener **exactamente la misma cantidad de términos** que el polinomio original $P(x)$.

  - **Término constante 1**: Si un término $T_k$ es exactamente igual al factor común $M$, su cociente $\frac{M}{M} = \mathbf{1}$
  debe escribirse dentro del paréntesis.

  '
ejemplo_guiado:
  enunciado: Extrae el factor común monomio y factoriza completamente la expresión $12a^4 b^3 - 8a^2 b^2 + 4a^2 b$.
  pasos:
  - 'Paso 1: Reconocemos el factor común monomio $M$: - MCD de coeficientes ($12, 8, 4$) = **$4$**. - Menor exponente de $a$
    ($a^4, a^2, a^2$) = **$a^2$**. - Menor exponente de $b$ ($b^3, b^2, b$) = **$b$**. - Factor común $M = \mathbf{4a^2 b}$.'
  - 'Paso 2: Dividimos cada término del polinomio por $4a^2 b$: - Término 1: $\frac{12a^4 b^3}{4a^2 b} = (12 \div 4) a^{4-2}
    b^{3-1} = \mathbf{3a^2 b^2}$. - Término 2: $\frac{-8a^2 b^2}{4a^2 b} = (-8 \div 4) a^{2-2} b^{2-1} = \mathbf{-2b}$. -
    Término 3: $\frac{+4a^2 b}{4a^2 b} = (+4 \div 4) a^{2-2} b^{1-1} = \mathbf{+1}$ (¡jamás se omite!).'
  - 'Paso 3: Unimos el factor común con el cociente dentro del paréntesis: $4a^2 b (3a^2 b^2 - 2b + 1)$.'
  - 'Conclusión: La expresión factorizada es **$4a^2 b (3a^2 b^2 - 2b + 1)$**.'
  imagen: /static/img/nodos/extraccion-del-factor-comun-monomio-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si dividimos un término $T_i = 18x^5 y^3$ por el factor común monomio $M = 6x^2 y$, ¿cuál es el término cociente
    resultante dentro del paréntesis?
  choices:
  - text: El cociente es $3x^3 y^2$, dividiendo los coeficientes $18 \div 6 = 3$ y restando los exponentes $x^{5-2}=x^3$,
      $y^{3-1}=y^2$
    is_correct: true
  - text: El cociente es $3x^7 y^4$
    is_correct: false
  - text: El cociente es $12x^3 y^2$
    is_correct: false
  - text: El cociente es $3x^{2.5} y^3$
    is_correct: false
  explanation: La alternativa correcta es 'El cociente es $3x^3 y^2$, dividiendo los coeficientes $18 \div 6 = 3$ y restando
    los exponentes $x^{5-2}=x^3$, $y^{3-1}=y^2$'. División de coeficientes y resta de exponentes.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al extraer el factor común monomio en la expresión $5x^2 + 5x$, ¿qué término queda en el segundo lugar del paréntesis?
  choices:
  - text: Queda el número $+1$, obteniendo la factorización $5x(x + 1)$, porque $\frac{5x}{5x} = 1$
    is_correct: true
  - text: Queda $0$, obteniendo $5x(x)$
    is_correct: false
  - text: Queda $5$, obteniendo $5x(x + 5)$
    is_correct: false
  - text: Desaparece el segundo término
    is_correct: false
  explanation: 'La alternativa correcta es ''Queda el número $+1$, obteniendo la factorización $5x(x + 1)$, porque $\frac{5x}{5x}
    = 1$''. Conservación del número de términos: $\frac{M}{M} = 1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el factor común monomio reconocido fuera de un paréntesis.'
- 'Paso 2: Dividir el coeficiente de cada término del polinomio por el coeficiente del factor común.'
- 'Paso 3: Restar los exponentes de cada variable común para obtener los exponentes del cociente.'
- 'Paso 4: Escribir los cocientes resultantes dentro del paréntesis conservando el número total de términos.'
errores_correccion: '- **Error 1:** Excluir el número 1 dentro del paréntesis cuando un término es idéntico al factor común
  (escribir $5x^2 + 5x = 5x(x)$). **Cómo corregirlo:** La división de un término por sí mismo **DA COMO RESULTADO 1 ($5x /
  5x = 1 \implies 5x(x+1)$)**.

  - **Error 2:** Sumar los exponentes en lugar de restarlos al dividir por el factor común (escribir $x^5 / x^2 = x^7$). **Cómo
  corregirlo:** En la división de potencias **LOS EXPONENTES SE RESTAN ($x^{5-2} = x^3$)**.

  '
ejemplos:
- titulo: Término 1 obligatorio
  enunciado: Al factorizar $3a + 3b$, ¿es el resultado $3(a + b)$ conservando dos términos dentro del paréntesis?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3a/3 = a$ y $3b/3 = b$.
- titulo: Resta de exponentes
  enunciado: Al dividir $14x^4$ entre $7x^2$, ¿obtenemos $2x^2$ restando $4 - 2 = 2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $14/7=2$ y $x^{4-2}=x^2$.
- titulo: Conservación de cantidad de términos
  enunciado: Si un polinomio original tiene 4 términos, ¿debe tener el paréntesis factorizado exactamente 4 términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cociente conserva el número de sumandos.
- titulo: Comprobación distributiva
  enunciado: ¿Demuestra $4x(2x - 3) = 8x^2 - 12x$ que $4x(2x - 3)$ es la extracción correcta de $8x^2 - 12x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicar valida la extracción.
errores_frecuentes:
- La escritura del número 1 dentro del paréntesis no se realiza cuando un término del polinomio coincide con el factor común.
- Sumar los exponentes de las variables al realizar la división monomial en lugar de restarlos.
- Reducir el número de términos del paréntesis obteniendo menos sumandos que el polinomio original.
- Multiplicar los coeficientes al calcular los términos del cociente en lugar de dividirlos.
- Olvidar conservar los signos originales de cada término en el cociente.
afirmaciones_verdaderas:
- Para extraerme el factor común monomio se divide cada término del polinomio por dicho monomio restando sus exponentes.
- Si un término coincide exactamente con el factor común, en el paréntesis debe figurar un 1 en su lugar.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/extraccion-del-factor-comun-monomio-resumen.svg)


  QUÉ: Extraer el factor común monomio dividiendo cada término y conservando el número de sumandos en el paréntesis.

  CÓMO: Escribir $P(x) = M \cdot \left( \sum \frac{T_i}{M} \right)$ dividiendo coeficientes numéricos y restando exponentes
  de variables ($\alpha_i - \min$), colocando $+1$ cuando un término coincide con $M$.

  '
