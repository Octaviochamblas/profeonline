semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.MULTIPLICACION_IGUAL_EXPONENTE
resumen_inicial: 'Al multiplicar potencias de distintas bases pero igual exponente
  $a^n \cdot b^n$, se multiplican las bases y se conserva el exponente común: $a^n
  \cdot b^n = (a \cdot b)^n$.'
explicacion_simple: Si estamos multiplicando potencias que tienen bases diferentes
  pero el mismo exponente arriba, podemos juntar las bases multiplicándolas dentro
  de un paréntesis y mantener ese único exponente por fuera.
explicacion_formal: 'Para todo $a, b \in \mathbb{R}$ y exponente común $n \in \mathbb{R}$,
  la **Agrupación por Igual Exponente** satisface:


  $$a^n \cdot b^n = (a \cdot b)^n$$


  **Desglose:**

  - Agrupación factorial: Permite simplificar multiplicaciones complejas agrupando
  bases en una base compuesta única.

  - Simetría: Es la lectura inversa de la propiedad de potencia de un producto.


  > **Complemento didáctico:** Ejemplo: $2^4 \cdot 5^4 = (2 \cdot 5)^4 = 10^4 = 10.000$.'
definiciones_clave: '- **Multiplicación de potencias de igual exponente**: Regla $a^n
  \cdot b^n = (a \cdot b)^n$ de multiplicación de bases bajo un mismo exponente.'
propiedades_relaciones: '- **Agrupación de bases**: $a^n \cdot b^n = (a \cdot b)^n$.'
ejemplo_guiado:
  enunciado: Calcule rápidamente el valor de $2^4 \cdot 5^4$.
  pasos:
  - 'Paso 1: Observar que los exponentes son iguales ($n=4$) y las bases son distintas
    ($2$ y $5$).'
  - 'Paso 2: Multiplicar las bases dentro de un paréntesis conservando el exponente:
    $(2 \cdot 5)^4$.'
  - 'Paso 3: Calcular el producto interno: $10^4 = 10.000$.'
  - 'Conclusión: $2^4 \cdot 5^4 = 10.000$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento se aplica al multiplicar potencias de distintas bases
    pero con el mismo exponente n (a^n · b^n)?
  choices:
  - text: Se multiplican las bases y se conserva el exponente común ((a · b)^n)
    is_correct: true
  - text: Se suman las bases y se suman los exponentes
    is_correct: false
  - text: Se multiplican los exponentes
    is_correct: false
  - text: Se restan las bases
    is_correct: false
  explanation: La alternativa correcta es 'Se multiplican las bases y se conserva
    el exponente común ((a · b)^n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2^4 · 5^4, ¿cuál fue el resultado final obtenido?
  choices:
  - text: 10.000 (10^4)
    is_correct: true
  - text: '1.000'
    is_correct: false
  - text: '40'
    is_correct: false
  - text: '100.000'
    is_correct: false
  explanation: La alternativa correcta es '10.000 (10^4)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que los exponentes de todas las potencias sean idénticos.'
- 'Paso 2: Multiplicar las bases entre sí dentro de un paréntesis.'
- 'Paso 3: Elevar el producto de las bases al exponente común ($ (a \cdot b)^n $).'
errores_correccion: '- **Error 1: Sumar o multiplicar los exponentes al agrupar bases
  ($2^3 \cdot 3^3 = 6^6$).** **Cómo corregirlo:** El exponente común se MANTIENE intacto
  ($2^3 \cdot 3^3 = 6^3$).


  - **Error 2: Sumar las bases en lugar de multiplicarlas ($2^3 \cdot 3^3 = 5^3$).**
  **Cómo corregirlo:** Las bases se MULTIPLICAN ($2 \cdot 3 = 6 \implies 6^3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifique $3^2 \cdot 4^2$.
  alternativas:
  - 12^2 = 144
  - 12^4
  - 7^2
  respuesta: 12^2 = 144
  solucion_pasos:
  - $(3 \cdot 4)^2 = 12^2 = 144$.
- titulo: Ejemplo 2
  enunciado: Simplifique $a^5 \cdot b^5$.
  alternativas:
  - (ab)^5
  - ab^{10}
  - (a+b)^5
  respuesta: (ab)^5
  solucion_pasos:
  - $(a \cdot b)^5 = (ab)^5$.
- titulo: ¿Es 4^3 · 2^3 igual a 8^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(4 \cdot 2)^3 = 8^3$.
- titulo: ¿Se conserva el exponente común al agrupar la multiplicación de bases?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a^n \cdot b^n = (a \cdot b)^n$.
errores_frecuentes:
- Sumar los exponentes al multiplicar potencias que comparten el mismo exponente pero
  tienen bases distintas.
- Sumar las bases entre sí manteniendo el exponente común en el resultado final.
- Multiplicar los exponentes entre sí cambiando la notación de la potencia agrupada.
- La multiplicación $3^3 \cdot 2^3$ equivale a la expresión $5^6$ por suma total.
- Aplicar la regla de igual exponente sobre la adición de términos $a^n + b^n$.
afirmaciones_verdaderas:
- Al multiplicar potencias de igual exponente se multiplican las bases y se conserva
  el exponente común ($a^n \cdot b^n = (a \cdot b)^n$).
- Esta propiedad facilita el cálculo mental agrupando factores en potencias de base
  10.
al_terminar_debes_poder: Al terminar serás capaz de simplificar multiplicaciones de
  potencias de igual exponente $a^n \cdot b^n = (a \cdot b)^n$, agrupando las bases
  bajo el exponente común.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
