semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.MULTIPLICACION_IGUAL_EXPONENTE
resumen_inicial: 'Para multiplicar potencias de distinta base pero igual exponente, se multiplican las bases entre sí y se conserva el exponente común: $a^n \cdot b^n = (a \cdot b)^n$.'
explicacion_simple: '![Multiplicación de potencias de igual exponente](/static/img/nodos/multiplicacion-de-potencias-de-igual-exponente-intro.svg)


  Cuando tienes una multiplicación de potencias donde las bases son distintas pero los números de arriba (los exponentes) son exactamente iguales, puedes juntar las bases multiplicándolas dentro de un solo paréntesis y dejar el exponente afuera. Por ejemplo, en lugar de calcular $2^4 = 16$ y $5^4 = 625$ para luego multiplicar $16 \cdot 625$, simplemente juntas $(2 \cdot 5)^4 = 10^4 = 10\,000$. ¡Es un truco poderosísimo para ahorrar tiempo!'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ y $n \in \mathbb{R}$. El **Teorema del Producto de Potencias de Igual Exponente** establece que:


  $$a^n \cdot b^n = (a \cdot b)^n$$


  **Demostración para $n \in \mathbb{N}$:**

  $$a^n \cdot b^n = \left(\underbrace{a \cdot a \dots a}_{n \text{ factores}}\right) \cdot \left(\underbrace{b \cdot b \dots b}_{n \text{ factores}}\right)$$

  Reordenando los factores en $n$ pares $(a \cdot b)$ por conmutatividad:

  $$a^n \cdot b^n = \underbrace{(a \cdot b) \cdot (a \cdot b) \dots (a \cdot b)}_{n \text{ factores}} = (a \cdot b)^n$$


  **Diferencia estructural clave:**

  - **Igual base ($a^m \cdot a^n$):** Se conserva la base $a$ y se suman los exponentes ($a^{m+n}$).

  - **Igual exponente ($a^n \cdot b^n$):** Se multiplican las bases ($a \cdot b$) y se conserva el exponente común ($n$).'
definiciones_clave: '- **Exponente común ($n$)**: Grado idéntico que se conserva inalterado al unificar factores.

  - **Unificación de bases**: Agrupación multiplicativa $(a \cdot b)^n$.'
propiedades_relaciones: '- **Descomposición en factores primos**: $6^n = (2 \cdot 3)^n = 2^n \cdot 3^n$.

  - **Formación de potencias de diez**: $2^k \cdot 5^k = (2 \cdot 5)^k = 10^k$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de multiplicación de igual exponente](/static/img/nodos/multiplicacion-de-potencias-de-igual-exponente-ejemplos.svg)


    Calcule el valor exacto de $2^3 \cdot 5^3$, $(-3)^2 \cdot 4^2$ y $\left(\frac{1}{2}\right)^3 \cdot 6^3$ aplicando la propiedad de igual exponente.'
  pasos:
  - 'Paso 1: Evaluar $2^3 \cdot 5^3$: Exponente común $3$. Multiplicar bases: $(2 \cdot 5)^3 = 10^3 = 1000$.'
  - 'Paso 2: Evaluar $(-3)^2 \cdot 4^2$: Exponente común $2$. Multiplicar bases: $[(-3) \cdot 4]^2 = (-12)^2 = 144$.'
  - 'Paso 3: Evaluar $\left(\frac{1}{2}\right)^3 \cdot 6^3$: Exponente común $3$. Multiplicar bases: $\left(\frac{1}{2} \cdot 6\right)^3 = 3^3 = 27$.'
  - 'Conclusión: Los resultados son $1000$, $144$ y $27$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma más rápida de calcular $2^4 \cdot 5^4$?
  choices:
  - text: Agrupar como $(2 \cdot 5)^4 = 10^4 = 10\,000$
    is_correct: true
  - text: Calcular $16 \cdot 625$ a mano
    is_correct: false
  - text: 'Sumar los exponentes y multiplicar bases: $10^8$'
    is_correct: false
  - text: 'Multiplicar los exponentes: $10^{16}$'
    is_correct: false
  explanation: La alternativa correcta es 'Agrupar como $(2 \cdot 5)^4 = 10^4 = 10\,000$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado de $\left(\frac{1}{2}\right)^3 \cdot 6^3$?
  choices:
  - text: $27$ (porque $\frac{1}{2} \cdot 6 = 3$ y $3^3 = 27$)
    is_correct: true
  - text: $18$
    is_correct: false
  - text: $216$
    is_correct: false
  - text: $9$
    is_correct: false
  explanation: La alternativa correcta es '$27$ (porque $\frac{1}{2} \cdot 6 = 3$ y $3^3 = 27$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que las potencias tengan bases distintas pero el mismo exponente $n$.'
- 'Paso 2: Multiplicar las bases entre sí dentro de un paréntesis: $(a \cdot b)$.'
- 'Paso 3: Conservar el exponente común $n$ y calcular la potencia resultante $(a \cdot b)^n$.'
errores_correccion: '- **Error 1: Sumar los exponentes al tener igual exponente ($3^2 \cdot 4^2 = 12^4$).** **Cómo corregirlo:** El exponente se MANTIENE idéntico; solo se multiplican las bases ($(3 \cdot 4)^2 = 12^2 = 144$).

  - **Error 2: Confundir con la regla de igual base.** **Cómo corregirlo:** En igual base ($2^3 \cdot 2^4 = 2^7$) la base no cambia. En igual exponente ($2^4 \cdot 3^4 = 6^4$) el exponente no cambia.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $3^3 \cdot 2^3$?
  alternativas:
  - $6^3 = 216$
  - $6^6$
  - $6^9$
  respuesta: $6^3 = 216$
  solucion_pasos:
  - $3^3 \cdot 2^3 = (3 \cdot 2)^3 = 6^3 = 216$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $(0,5)^4 \cdot 20^4$?
  alternativas:
  - $10^4 = 10000$
  - $100$
  - $1000$
  respuesta: $10^4 = 10000$
  solucion_pasos:
  - $(0,5 \cdot 20)^4 = 10^4 = 10000$.
- titulo: ¿Es 4² · 5² igual a 20²?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(4 \cdot 5)^2 = 20^2 = 400$.
  alternativas:
  - texto: Sí, se multiplican las bases 4·5=20 y se conserva el exponente 2
    es_correcta: true
    retroalimentacion: ¡Correcto! $a^n \cdot b^n = (a \cdot b)^n$.
  - texto: No, es igual a 20⁴
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes no se suman cuando las bases son distintas.
  - texto: No, es igual a 9²
    es_correcta: false
    retroalimentacion: Incorrecto, las bases se multiplican, no se suman.
- titulo: ¿Es 2³ · 3³ igual a 6⁶?
  respuesta: 'No'
  solucion_pasos:
  - No, $2^3 \cdot 3^3 = 6^3 = 216$, mientras que $6^6 = 46656$.
  alternativas:
  - texto: No, el exponente común se conserva (da 6³ = 216)
    es_correcta: true
    retroalimentacion: ¡Correcto! No se deben sumar los exponentes.
  - texto: Sí, porque se multiplican las bases y se suman exponentes
    es_correcta: false
    retroalimentacion: Incorrecto, no se pueden aplicar ambas reglas a la vez.
  - texto: No, es igual a 5³
    es_correcta: false
    retroalimentacion: Incorrecto, las bases se multiplican (2·3=6).
errores_frecuentes:
- Sumar los exponentes además de multiplicar las bases ($2^3 \cdot 3^3 = 6^6$).
- Sumar las bases en lugar de multiplicarlas ($2^3 \cdot 3^3 = 5^3$).
- Multiplicar exponentes entre sí ($2^3 \cdot 3^3 = 6^9$).
- Confundir las reglas de igual base con las de igual exponente.
- Desarmar factores primos erróneamente ($12^n = 6^n \cdot 6^n$ en vez de $3^n \cdot 4^n$).
afirmaciones_verdaderas:
- Para toda base $a, b$ y exponente $n$, $a^n \cdot b^n = (a \cdot b)^n$.
- Al multiplicar potencias de igual exponente, el exponente permanece constante.
- Permite simplificar productos formando potencias de base diez ($2^n \cdot 5^n = 10^n$).
al_terminar_debes_poder: '![Síntesis de multiplicación de igual exponente](/static/img/nodos/multiplicacion-de-potencias-de-igual-exponente-resumen.svg)


  QUÉ: Multiplicar potencias de igual exponente y distinta base.


  CÓMO: Multiplicando las bases entre sí y conservando inalterado el exponente común ($a^n \cdot b^n = (a \cdot b)^n$), distinguiéndolo rigurosamente de la regla de igual base y utilizándolo para agrupar potencias de 10 o descomponer factores primos.'
