semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.MULTIPLICACION_IGUAL_EXPONENTE
resumen_inicial: Al multiplicar potencias de distinto número de base pero IGUAL exponente,
  se multiplican las bases y se conserva el exponente común ($a^n \cdot b^n = (a \cdot b)^n$).
explicacion_simple: 'Si tienes dos potencias que se multiplican y comparten el mismo exponente,
  puedes multiplicar sus bases primero y dejar un solo exponente afuera:

  $$2^3 \cdot 5^3 = (2 \cdot 5)^3 = 10^3 = 1000$$

  Comprobando de forma individual: $2^3 = 8$ y $5^3 = 125$, y $8 \cdot 125 = 1000$.'
explicacion_formal: 'Para todo $a, b \in \mathbb{R}$ y $n \in \mathbb{R}$, se cumple la propiedad
  recíproca de la potencia de un producto:

  $$a^n \cdot b^n = (a \cdot b)^n$$'
definiciones_clave: '- **Agrupación de bases**: Producto de las bases $a \cdot b$ bajo un
  único exponente $n$.'
propiedades_relaciones: '- **Simetría**: Es la lectura de derecha a izquierda de la propiedad
  $(ab)^n = a^n b^n$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $4^3 \cdot 0,25^3$.
  pasos:
  - Observar que los exponentes son iguales ($n = 3$) y las bases son distintas ($4$ y $0{,}25$).
  - 'Agrupar el producto de las bases bajo el exponente común: $(4 \cdot 0{,}25)^3$.'
  - 'Multiplicar las bases: $4 \cdot 0{,}25 = 1$.'
  - 'Calcular la potencia resultante: $1^3 = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué expresión equivale el producto $2^4 \cdot 3^4$?
  choices:
  - text: 6^4
    is_correct: true
  - text: 6^8
    is_correct: false
  - text: 5^4
    is_correct: false
  - text: 6^{16}
    is_correct: false
  explanation: 'La correcta es: 6^4. Multiplicamos las bases ($2 \cdot 3 = 6$) y conservamos
    el exponente 4.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $5^2 \cdot 2^2$.
  choices:
  - text: '100'
    is_correct: true
  - text: '20'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: '50'
    is_correct: false
  explanation: 'La correcta es: 100. $(5 \cdot 2)^2 = 10^2 = 100$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los exponentes de los factores sean idénticos.'
- 'Paso 2: Multiplicar las bases entre sí.'
- 'Paso 3: Elevar el producto obtenido al exponente común.'
- 'Paso 4: Calcular el resultado final.'
errores_correccion: No sumes los exponentes al multiplicar potencias de distintas bases. $2^3
  \cdot 5^3$ es $(2 \cdot 5)^3 = 10^3$, no $10^6$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $x^5 \cdot y^5$.
  alternativas:
  - (xy)^5
  - (xy)^{10}
  - x^5 y
  respuesta: (xy)^5
  solucion_pasos:
  - $(x \cdot y)^5 = (xy)^5$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale 3^4 · 2^4?
  alternativas:
  - 6^4
  - 5^4
  - 6^8
  respuesta: 6^4
  solucion_pasos:
  - 'Se multiplican las bases y se conserva el exponente: (3·2)^4 = 6^4.'
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de a^3 · b^3?
  alternativas:
  - (ab)^3
  - (a+b)^3
  - a^3+b^3
  respuesta: (ab)^3
  solucion_pasos:
  - Se agrupan las bases bajo el exponente común 3.
- titulo: ¿Es 2^5 · 3^4 simplificable usando esta propiedad?
  respuesta: 'No'
  solucion_pasos:
  - Los exponentes 5 y 4 son distintos; la propiedad exige exponentes iguales.
errores_frecuentes:
- Sumar los exponentes cuando las bases son diferentes.
- Sumar los exponentes en lugar de multiplicar las bases al aplicar esta propiedad.
- Aplicar esta regla cuando los exponentes de las potencias son distintos.
- Confundir esta propiedad con la de multiplicación de potencias de igual base.
- Olvidar mantener el exponente común afuera del paréntesis al agrupar las bases.
afirmaciones_verdaderas:
- $a^n \cdot b^n = (a \cdot b)^n$.
- Esta propiedad requiere que el exponente sea idéntico en ambas potencias, sin importar que
  las bases sean distintas.
al_terminar_debes_poder: Agrupar y simplificar multiplicaciones de potencias con igual exponente.
fuente: Texto escolar MINEDUC.
estado: publicado
