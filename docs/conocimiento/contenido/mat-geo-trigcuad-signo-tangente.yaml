semantic_id: MAT.GEO.TRIG_CUADRANTES.SIGNO_TANGENTE
resumen_inicial: 'Identificación del signo de la tangente según el cuadrante: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: 'Como tanθ=sinθ/cosθ, su signo se obtiene combinando los signos
  de seno y coseno en cada cuadrante: si ambos tienen el mismo signo, la tangente
  es positiva; si tienen signos distintos, es negativa.'
explicacion_formal: '![Signo de la tangente por cuadrante](/static/img/geometria/trigonometria/trigcuad-signo-tangente.svg)


  ### Definición formal


  Como $\tan\theta=\dfrac{\sin\theta}{\cos\theta}$, su signo es el producto de los
  signos de $\sin\theta$ y $\cos\theta$. En el cuadrante I ambos son positivos (tan
  positiva); en el II, seno positivo y coseno negativo (tan negativa); en el III,
  ambos negativos (tan positiva); en el IV, seno negativo y coseno positivo (tan negativa).


  ### Desarrollo didáctico


  Esta relación es consecuencia directa de la identidad tangente=seno/coseno: basta
  con conocer los signos de seno y coseno en cada cuadrante para deducir el signo
  de la tangente, sin necesidad de memorizarlo por separado.'
definiciones_clave: '- **Identificación del signo de la tangente según el cuadrante**:
