semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.LLANO
resumen_inicial: El término 'ángulo llano' es sinónimo exacto de 'ángulo extendido',
  designando un ángulo de medida 180° cuyos lados forman una recta continua.
explicacion_simple: '![Ángulo Llano](/static/img/nodos/uso-del-termino-angulo-llano-como-equivalente-de-angulo-extendido-intro.svg)


  En diferentes libros y países se usan las palabras "ángulo llano" o "ángulo extendido".
  Significan exactamente lo mismo: una abertura de 180° que forma una línea recta
  horizontal o plana (llana).'
explicacion_formal: '### Definición formal

  En la taxonomía geométrica formal, los términos **ángulo llano** y **ángulo extendido**
  son estrictamente sinónimos y designan al ángulo colineal de medida $\pi$:


  $$\operatorname{Ángulo\_Llano} \equiv \operatorname{Ángulo\_Extendido} \iff \mu(\angle
  AOB) = 180^\circ = \pi \text{ rad}$$


  ### Desglose simbólico y geométrico

  - Equivalencia léxica: Ambos términos identifican la colinealidad de los rayos con
  sentidos opuestos.

  - Notación internacional: En la literatura hispanoamericana e internacional (PAES/MINEDUC)
  se usan de forma indistinta.

  - Puntos en línea recta: $A, O, B$ son colineales con $O$ estrictamente entre $A$
  y $B$.


  ### Síntesis didáctica

  Dominar la equivalencia terminológica entre ángulo llano y ángulo extendido evita
  confusiones conceptuales en pruebas estandarizadas y evaluaciones formales.'
definiciones_clave: '- **Ángulo llano**: Nombre tradicional para el ángulo de $180^\circ$.

  - **Ángulo extendido**: Denominación formal contemporánea para el ángulo de $180^\circ$. '
propiedades_relaciones: '- **Identidad métrica**: $\text{Ángulo Llano} = \text{Ángulo
  Extendido} = 180^\circ$.

  - **Suma de ángulos en triángulos**: La suma de los tres ángulos interiores de cualquier
  triángulo es igual a un ángulo llano ($180^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Llano](/static/img/nodos/uso-del-termino-angulo-llano-como-equivalente-de-angulo-extendido-ejemplos.svg)


    Un enunciado de un examen plantea: "Calcula el complemento de un ángulo que mide
    la tercera parte de un ángulo llano". Resuelve el problema identificando la medida
    del ángulo llano.'
  pasos:
  - 'Paso 1: Reconocer que un ángulo llano mide exactamente $180^\circ$.'
  - 'Paso 2: Calcular la tercera parte del ángulo llano: $\frac{180^\circ}{3} = 60^\circ$.'
  - 'Paso 3: Calcular el complemento de $60^\circ$: $90^\circ - 60^\circ = 30^\circ$.'
  - 'Paso 4: Concluir que la respuesta es un ángulo agudo de $30^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué medida equivale un ángulo llano?
  choices:
  - text: Exactamente 180° (igual al ángulo extendido)
    is_correct: true
  - text: Exactamente 360° (igual al ángulo completo)
    is_correct: false
  - text: Exactamente 90° (igual al ángulo recto)
    is_correct: false
  - text: Exactamente 0° (igual al ángulo nulo)
    is_correct: false
  explanation: Un ángulo llano equivale a exactamente 180° (igual al ángulo extendido).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la relación entre los términos 'ángulo llano' y 'ángulo extendido'?
  choices:
  - text: Son términos sinónimos equivalentes para un ángulo de 180°
    is_correct: true
  - text: El ángulo llano mide 90° y el extendido 180°
    is_correct: false
  - text: El ángulo llano mide 180° y el extendido 360°
    is_correct: false
  - text: No tienen relación geométrica
    is_correct: false
  explanation: Son términos sinónimos equivalentes para un ángulo de 180°.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la mención de "ángulo llano" en el enunciado.'
- 'Paso 2: Asignar el valor numérico exacto de $180^\circ$ ($\pi\text{ rad}$).'
- 'Paso 3: Resolver las relaciones algebraicas o geométricas requeridas.'
errores_correccion: Recuerda que llano y extendido son exactamente la misma medida
  de 180°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto mide la mitad de un ángulo llano?
  alternativas:
  - $90^\circ$ (un ángulo recto)
  - $45^\circ$ (un ángulo agudo)
  - $180^\circ$ (un ángulo extendido)
  respuesta: $90^\circ$ (un ángulo recto)
  solucion_pasos:
  - $\frac{180^\circ}{2} = 90^\circ$, que corresponde a un ángulo recto.
- titulo: Ejemplo 2
  enunciado: Si $\alpha$ es un ángulo llano y $\beta$ es un ángulo recto, ¿cuánto
    vale $\alpha - \beta$?
  alternativas:
  - $90^\circ$
  - $0^\circ$
  - $180^\circ$
  respuesta: $90^\circ$
  solucion_pasos:
  - $\alpha - \beta = 180^\circ - 90^\circ = 90^\circ$.
- titulo: ¿Ángulo llano y ángulo extendido son sinónimos?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos términos se refieren exactamente a un ángulo de 180°.
- titulo: ¿Un ángulo llano mide 360°?
  respuesta: 'No'
  solucion_pasos:
  - No, mide 180°. 360° corresponde al ángulo completo.
errores_frecuentes:
- Pensar que "ángulo llano" es un ángulo de $90^\circ$.
- Confundir "ángulo llano" con "ángulo completo" ($360^\circ$).
- Creer que el término "extendido" reemplaza al concepto y que miden distinto.
- Olvidar que un ángulo llano forma una línea recta.
- No reconocer que dos ángulos rectos adyacentes forman un ángulo llano.
afirmaciones_verdaderas:
- Un ángulo llano mide exactamente $180^\circ$.
- El término ángulo llano es sinónimo de ángulo extendido.
al_terminar_debes_poder: '**QUÉ:** Reconocer y utilizar indistintamente los términos
  "ángulo llano" y "ángulo extendido" ($180^\circ$).


  **CÓMO:** Aplicando la igualdad $\text{Ángulo Llano} = 180^\circ$ en problemas algebraicos
  y geométricos.


  ![Resumen de Ángulo Llano](/static/img/nodos/uso-del-termino-angulo-llano-como-equivalente-de-angulo-extendido-resumen.svg)'
