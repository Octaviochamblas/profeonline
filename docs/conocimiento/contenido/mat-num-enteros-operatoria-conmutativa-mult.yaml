semantic_id: MAT.NUM.ENTEROS_OPERATORIA.CONMUTATIVA_MULT
resumen_inicial: "La propiedad conmutativa dice que al multiplicar enteros, el orden de los factores no altera el producto: $a\\cdot b=b\\cdot a$."
explicacion_simple: |
  "El orden de los factores no altera el producto" — seguro conoces esta frase. Tener 4
  cajas con 3 chocolates negativos cada una ($4 \cdot (-3)=-12$) es exactamente lo mismo
  que tener 3 cajas con 4 chocolates negativos cada una ($(-3) \cdot 4=-12$). No importa
  en qué orden multipliques, el resultado siempre es el mismo.
explicacion_formal: |
  Para todo $a, b \in \mathbb{Z}$: $a \cdot b = b \cdot a$. Esta propiedad permite elegir
  el orden más conveniente para el cálculo mental, y se cumple sin importar el signo de
  los factores.
definiciones_clave: |
  **Propiedad conmutativa de la multiplicación**: el orden de los factores no altera el
  producto. Se cumple para la multiplicación, pero no para la división.
propiedades_relaciones: |
  La propiedad conmutativa de la multiplicación se cumple siempre en $\mathbb{Z}$,
  incluyendo cuando uno de los factores es cero. No se cumple para la división.
ejemplo_guiado:
  enunciado: "Verifica la propiedad conmutativa para $(-7) \\cdot (+6)$."
  pasos:
    - 'Orden original: $(-7) \cdot (+6) = -42$.'
    - 'Orden invertido: $(+6) \cdot (-7) = -42$.'
    - "Ambos resultados coinciden: se cumple la propiedad conmutativa."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estas operaciones NO cumple la propiedad conmutativa en $\\mathbb{Z}$?"
    choices:
      - {text: "La multiplicación", is_correct: false}
      - {text: "La división", is_correct: true}
      - {text: "Ambas la cumplen", is_correct: false}
      - {text: "Ninguna la cumple", is_correct: false}
    explanation: "La correcta es La división: $a:b$ no es igual a $b:a$ en general, a diferencia de la multiplicación."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿coinciden $(-5)\\cdot(+8)$ y $(+8)\\cdot(-5)$?"
    choices:
      - {text: "Sí, ambos dan $-40$", is_correct: true}
      - {text: "No, dan resultados distintos", is_correct: false}
      - {text: "Sí, pero solo dan cero", is_correct: false}
      - {text: "No se puede saber sin calcular", is_correct: false}
    explanation: "La correcta es Sí, ambos dan $-40$: la propiedad conmutativa garantiza que el orden no cambia el producto."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los dos factores enteros en una multiplicación ($a$ y $b$)."
  - 'Paso 2: Escribir la multiplicación en el orden original $a \cdot b$ y calcular su resultado.'
  - 'Paso 3: Escribir la multiplicación con el orden invertido $b \cdot a$ y calcular su resultado.'
  - "Paso 4: Comprobar que ambos resultados coinciden plenamente."
errores_correccion: |
  Un error frecuente es creer que la división también es conmutativa; no lo es, porque
  invertir el orden de un cociente cambia su resultado. Otro error es cambiar el signo de
  los factores al invertir su orden.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: 'Demostrar que se cumple la propiedad conmutativa para el producto: $(-9) \cdot (-12)$.'
    alternativas:
      - "$108$ en ambos órdenes"
      - "$108$ y $-108$ según el orden"
      - "$-3$ en ambos órdenes"
    respuesta: "$108$ en ambos órdenes"
    solucion_pasos:
      - "Identificar los factores: $a = -9$ y $b = -12$."
      - 'Calcular el producto original: $(-9) \cdot (-12) = 108$ (mismo signo da positivo).'
      - 'Calcular el producto con orden inverso: $(-12) \cdot (-9) = 108$.'
      - "Dado que ambos productos son iguales a $108$, se demuestra la propiedad conmutativa."
  - titulo: "Ejemplo 2"
    enunciado: 'Reescribir el producto $(-250) \cdot (+8)$ usando la propiedad conmutativa para facilitar el cálculo.'
    alternativas:
      - "$-2000$"
      - "$2000$"
      - "$-258$"
    respuesta: "$-2000$"
    solucion_pasos:
      - 'Aplicar la propiedad conmutativa para alternar el orden de los factores: la expresión se convierte en $(+8) \cdot (-250)$.'
      - 'Resolver el nuevo producto: multiplicamos los valores absolutos $8 \cdot 250 = 2000$.'
      - "Como los factores tienen signos contrarios, el resultado es negativo: $-2000$."
  - titulo: "¿La división (cociente) de enteros cumple con la propiedad conmutativa?"
    respuesta: "No"
    solucion_pasos:
      - "Tomemos un contraejemplo: $a = -10$ y $b = 2$."
      - "Calculamos en orden original: $(-10) : 2 = -5$."
      - "Calculamos en orden inverso: $2 : (-10) = -0{,}2$."
      - 'Como $-5 \neq -0{,}2$, la división no cumple con la propiedad conmutativa.'
  - titulo: "¿Se cumple la propiedad conmutativa al multiplicar un entero por cero?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sea $a = -34$."
      - 'El producto en orden original es: $(-34) \cdot 0 = 0$.'
      - 'El producto en orden inverso es: $0 \cdot (-34) = 0$.'
      - "Ambos dan cero, por lo que la propiedad se cumple perfectamente."
errores_frecuentes:
  - "Creer que la división también es conmutativa (ej: pensar que $8 : 4$ es igual a $4 : 8$)."
  - "Cambiar el signo de los factores al cambiar su orden."
  - "Confundir la propiedad conmutativa con la asociativa, la cual involucra tres o más factores agrupados con paréntesis."
  - "Creer que el orden de los factores altera el signo del resultado."
  - "Pensar que la propiedad conmutativa solo funciona con enteros positivos."
afirmaciones_verdaderas:
  - "El orden de los factores no altera el producto."
  - "4·6 es igual a 6·4."
al_terminar_debes_poder: |
  Reordenar factores usando la propiedad conmutativa para facilitar el cálculo, y explicar
  por qué no aplica a la división.
fuente: "Enteros"
estado: publicado
