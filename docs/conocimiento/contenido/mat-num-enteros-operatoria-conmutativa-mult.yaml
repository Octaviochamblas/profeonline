semantic_id: MAT.NUM.ENTEROS_OPERATORIA.CONMUTATIVA_MULT
resumen_inicial: 'El orden de los factores no altera el producto: $a \cdot b = b \cdot a$ para todo $a, b \in \mathbb{Z}$.'
explicacion_simple: 'La propiedad conmutativa de la multiplicación garantiza que podemos multiplicar dos números enteros en cualquier orden y obtendremos exactamente el mismo producto. Multiplicar 3 por $-4$ da el mismo resultado que multiplicar $-4$ por 3.


  ![Propiedad conmutativa de la multiplicación](/static/img/nodos/propiedad-conmutativa-de-la-multiplicacion-intro.svg)'
explicacion_formal: 'Para todo par de enteros $a, b \in \mathbb{Z}$, la **Propiedad Conmutativa de la Multiplicación** establece la identidad:


  $$a \cdot b = b \cdot a$$


  **Desglose de la fórmula:**

  - $a \cdot b$: Producto de $a$ por $b$.

  - $b \cdot a$: Producto de $b$ por $a$.

  - $=$: Igualdad estricta de ambos productos.


  > **Complemento didáctico:** $(-5) \cdot 6 = 6 \cdot (-5) = -30$, demostrando que la inversión de factores no cambia el producto.'
definiciones_clave: '- **Propiedad conmutativa multiplicativa**: Independencia del producto respecto al orden de los factores.'
propiedades_relaciones: '- **Validez en $\mathbb{Z}$**: Cumplida en suma y multiplicación; falsa en resta y división.'
ejemplo_guiado:
  enunciado: 'Verifique la propiedad conmutativa evaluando ambos lados de $(-7) \cdot 5 = 5 \cdot (-7)$.


    ![Ejemplo Propiedad conmutativa de la multiplicación](/static/img/nodos/propiedad-conmutativa-de-la-multiplicacion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Calcular el lado izquierdo: $(-7) \cdot 5 = -35$.'
  - 'Paso 2: Calcular el lado derecho: $5 \cdot (-7) = -35$.'
  - 'Conclusión: Ambos lados resultan en $-35$, confirmando la propiedad.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad conmutativa de la multiplicación de enteros?
  choices:
  - text: Que el orden de los factores no altera el producto (a · b = b · a)
    is_correct: true
  - text: Que al multiplicar por cero el resultado es cero
    is_correct: false
  - text: Que todo número multiplicado por 1 da 0
    is_correct: false
  - text: Que la división de enteros es conmutativa
    is_correct: false
  explanation: La alternativa correcta es 'Que el orden de los factores no altera el producto (a · b = b · a)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el producto idéntico obtenido en ambos lados?
  choices:
  - text: '-35'
    is_correct: true
  - text: '35'
    is_correct: false
  - text: '-12'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '-35'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los factores en el orden inicial $a \cdot b$.'
- 'Paso 2: Multiplicar los factores en el orden invertido $b \cdot a$.'
- 'Paso 3: Comprobar la igualdad exacta de los dos productos.'
errores_correccion: '- **Error 1: Intentar aplicar la propiedad conmutativa a la división ($a : b = b : a$).** **Cómo corregirlo:** La división no es conmutativa ($12 : 3 \neq 3 : 12$).


  - **Error 2: Cambiar el signo de un factor al conmutar.** **Cómo corregirlo:** Los factores se mueven conservando íntegramente sus signos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $(-8) \cdot (-4) = 32$, ¿cuánto vale $(-4) \cdot (-8)$?
  alternativas:
  - '32'
  - '-32'
  - '12'
  respuesta: '32'
  solucion_pasos:
  - Por conmutatividad, $(-4) \cdot (-8) = 32$.
- titulo: Ejemplo 2
  enunciado: '¿Aplica la propiedad conmutativa para la división $20 : (-4)$ y $(-4) : 20$?'
  alternativas:
  - No, la división no es conmutativa
  - Sí, dan lo mismo
  - Solo si ambos son positivos
  respuesta: No, la división no es conmutativa
  solucion_pasos:
  - '$20 : (-4) = -5$, pero $(-4) : 20 = -0.2$. No son iguales.'
- titulo: ¿El producto (-6) · 9 da el mismo resultado que 9 · (-6)?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación en $\mathbb{Z}$ es conmutativa.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
- titulo: ¿Es conmutativa la división de enteros?
  respuesta: 'No'
  solucion_pasos:
  - No, la división no cumple la propiedad conmutativa.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
errores_frecuentes:
- Invertir el orden de los términos en una división mantiene intacto el resultado final.
- La propiedad conmutativa de la multiplicación exige que ambos factores tengan el mismo signo.
- Cambiar el orden de los factores en $(-4) \cdot 7$ invierte el signo del producto a positivo.
- La conmutatividad multiplicativa solo aplica cuando los factores son números enteros pares.
- La propiedad conmutativa de la multiplicación no es válida para enteros negativos.
afirmaciones_verdaderas:
- En la multiplicación de enteros, $a \cdot b = b \cdot a$ para todo par de elementos.
- La propiedad conmutativa no aplica a la división de números enteros.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad conmutativa de la multiplicación en el conjunto de los enteros.


  **CÓMO:** Intercambiando el orden de los factores según $a \cdot b = b \cdot a$ para facilitar el cálculo mental y el ordenamiento de términos algebraicos.


  ![Resumen Propiedad conmutativa de la multiplicación](/static/img/nodos/propiedad-conmutativa-de-la-multiplicacion-resumen.svg)'
