semantic_id: MAT.ALG.POLINOMIOS.GRADO_ABSOLUTO_POLINOMIO
resumen_inicial: 'El grado absoluto de un polinomio es el mayor grado absoluto entre todos los términos monomios no nulos que lo componen.'
explicacion_simple: |
  - Para calcular el **grado absoluto (GA)** de un polinomio:
    1. Se calcula el grado absoluto de **cada uno de sus términos** por separado (sumando los exponentes de las letras en cada término).
    2. Se elige el **número mayor** de todos.
  - Por ejemplo, en $P(x, y) = 4x^3y^2 - 7x^2y^4 + 9xy$:
    - Primer término: $3 + 2 = 5$.
    - Segundo término: $2 + 4 = 6$.
    - Tercer término: $1 + 1 = 2$.
    - El grado absoluto del polinomio es el número mayor: **$6$ ($6^{\circ}$ grado)**.
  - **¡Importante!** No se suman los grados entre los distintos términos (no se hace $5 + 6 + 2$).

  ![Grado Absoluto de un Polinomio](/static/img/nodos/calculo-del-grado-absoluto-de-un-polinomio-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $P(x_1, \dots, x_n) = \sum_{j=1}^m T_j$ un polinomio no nulo en $\mathbb{K}[x_1, \dots, x_n]$, donde cada $T_j = c_j x_1^{e_{j,1}} \cdots x_n^{e_{j,n}}$ es un monomio con $c_j \neq 0$.
  El **grado absoluto de $P$**, denotado $\operatorname{GA}(P)$ o $\operatorname{gr}(P)$, es el supremo de los grados absolutos de sus monomios constitutivos:

  $$\operatorname{GA}(P) = \max_{1 \le j \le m} \operatorname{GA}(T_j) = \max_{1 \le j \le m} \left( \sum_{i=1}^n e_{j,i} \right)$$

  ### Propiedades algebraicas del grado
  1. **Grado de la suma:** $\operatorname{gr}(P + Q) \le \max(\operatorname{gr}(P), \operatorname{gr}(Q))$ (con igualdad estricta si $\operatorname{gr}(P) \neq \operatorname{gr}(Q)$).
  2. **Grado del producto:** $\operatorname{gr}(P \cdot Q) = \operatorname{gr}(P) + \operatorname{gr}(Q)$.
  3. **Grado de la potencia:** $\operatorname{gr}(P^k) = k \cdot \operatorname{gr}(P)$ para $k \in \mathbb{N}$.
definiciones_clave: |
  - **Grado absoluto de un polinomio**: Máximo grado monomio entre todos los términos de la expresión.
  - **Término principal**: Monomio que alcanza el grado absoluto máximo del polinomio.
  - **Polinomio homogéneo**: Polinomio donde todos sus términos poseen idéntico grado absoluto.
propiedades_relaciones: |
  - **Independencia de la cantidad de términos**: Un polinomio de alto grado puede tener pocos términos ($x^{10} + 1$ tiene grado 10 con solo 2 términos).
  - **Invarianza bajo reordenamiento**: El grado no cambia si se permutan las posiciones de los monomios.
ejemplo_guiado:
  enunciado: 'Calcula el grado absoluto del polinomio multivariable $P(x, y, z) = 5x^4y^2z - 8x^3y^5 + 2x^2y^2z^3 - 11$.'
  imagen: '/static/img/nodos/calculo-del-grado-absoluto-de-un-polinomio-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos el grado absoluto del primer término $5x^4y^2z$: $4 + 2 + 1 = **7$**.'
    - 'Paso 2: Calculamos el grado absoluto del segundo término $-8x^3y^5$: $3 + 5 = **8$**.'
    - 'Paso 3: Calculamos el grado absoluto del tercer término $2x^2y^2z^3$: $2 + 2 + 3 = **7$**.'
    - 'Paso 4: Calculamos el grado del término independiente $-11$: **$0$**.'
    - 'Paso 5: Tomamos el valor máximo: $\operatorname{GA}(P) = \max(7, 8, 7, 0) = **8$**.'
    - 'Paso 6: Conclusión: El polinomio es de **octavo grado ($8^{\circ}$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el grado absoluto del polinomio $P(x, y) = 3x^5y^2 - 4x^3y^6 + 2x^8$?'
    choices:
      - text: '$9$, porque el término $-4x^3y^6$ tiene grado $3 + 6 = 9$'
        is_correct: true
      - text: '$8$, porque es el mayor exponente de $x$'
        is_correct: false
      - text: '$7$, correspondiente al primer término'
        is_correct: false
      - text: '$24$, sumando todos los exponentes'
        is_correct: false
    explanation: 'La alternativa correcta es ''$9$, porque el término $-4x^3y^6$ tiene grado $3 + 6 = 9$''. El grado absoluto del polinomio es el máximo grado entre todos sus términos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si multiplicamos un polinomio de grado 3 con un polinomio de grado 4, ¿cuál es el grado del polinomio resultante?'
    choices:
      - text: '$7$, porque los grados de los factores se suman en la multiplicación ($3 + 4 = 7$)'
        is_correct: true
      - text: '$12$, porque se multiplican los grados'
        is_correct: false
      - text: '$4$, porque es el grado mayor'
        is_correct: false
      - text: '$1$, porque se restan'
        is_correct: false
    explanation: 'La alternativa correcta es ''$7$, porque los grados de los factores se suman en la multiplicación ($3 + 4 = 7$)''. $\operatorname{gr}(P \cdot Q) = \operatorname{gr}(P) + \operatorname{gr}(Q)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sumar los exponentes de las variables en cada monomio individual.'
  - 'Paso 2: Registrar el grado absoluto obtenido para cada término.'
  - 'Paso 3: Identificar el mayor de todos los grados calculados.'
  - 'Paso 4: Enunciar el valor máximo como el grado absoluto global del polinomio.'
errores_correccion: |
  - **Error 1:** Sumar los grados de todos los términos del polinomio. **Cómo corregirlo:** El grado del polinomio es el **máximo individual**, no la suma de todos.
  - **Error 2:** Olvidar sumar el exponente 1 de las variables sin superíndice escrito. **Cómo corregirlo:** En $x^3y$, el grado es $3 + 1 = 4$.
ejemplos:
  - titulo: 'Grado en una variable desordenado'
    enunciado: '¿Cuál es el grado del polinomio $P(x) = 6 - 2x^3 + 5x^7 - x^4$?'
    alternativas:
      - '$7$, porque es el mayor exponente de la variable'
      - '$3$, porque es el primer término con $x$'
      - '$14$, sumando todos los exponentes'
    respuesta: '$7$, porque es el mayor exponente de la variable'
    solucion_pasos:
      - '1. Los exponentes presentes son 0, 3, 7 y 4.'
      - '2. El exponente máximo es 7.'
      - '3. El grado del polinomio es 7.'
  - titulo: 'Grado del producto de polinomios'
    enunciado: 'Si $P(x) = x^3 - 1$ y $Q(x) = x^2 + 4$, ¿cuál es el grado de $P(x) \cdot Q(x)$?'
    alternativas:
      - '$5$'
      - '$6$'
      - '$3$'
    respuesta: '$5$'
    solucion_pasos:
      - '1. $\operatorname{gr}(P) = 3$ y $\operatorname{gr}(Q) = 2$.'
      - '2. $\operatorname{gr}(P \cdot Q) = 3 + 2 = 5$.'
  - titulo: 'Grado absoluto multivariable'
    enunciado: '¿Tiene el polinomio $x^4y + y^3$ un grado absoluto igual a 5?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Grado de $x^4y = 4 + 1 = 5$.'
      - '2. Grado de $y^3 = 3$.'
      - '3. El máximo es 5.'
  - titulo: 'Suma de exponentes de distintos términos'
    enunciado: '¿Es el grado del polinomio $x^3 + x^2 + x$ igual a 6?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Los grados de los términos no se suman entre sí.'
      - '2. El grado del polinomio es $\max(3, 2, 1) = 3$.'
errores_frecuentes:
  - 'Sumar los grados de todos los términos en vez de seleccionar el valor máximo.'
  - 'Asumir que el grado es siempre el exponente del primer término en polinomios no ordenados.'
  - 'Omitir el exponente 1 de las variables sin superíndice al calcular el grado de cada monomio.'
  - 'Multiplicar los grados al calcular el grado del producto en lugar de sumarlos.'
  - 'Confundir el coeficiente numérico mayor con el término de mayor grado.'
afirmaciones_verdaderas:
  - 'El grado absoluto de un polinomio es el mayor grado absoluto entre todos sus términos componentes.'
  - 'El grado del producto de dos polinomios no nulos es igual a la suma de los grados de cada factor.'
al_terminar_debes_poder: |
  ![Resumen de Grado Absoluto](/static/img/nodos/calculo-del-grado-absoluto-de-un-polinomio-resumen.svg)

  QUÉ: Determinar con exactitud el grado absoluto de cualquier polinomio en una o más variables y aplicar las propiedades de grado en operaciones algebraicas.
  CÓMO: Calculando el grado de cada monomio ($\sum e_{j,i}$) y seleccionando el valor máximo $\operatorname{GA}(P) = \max(\operatorname{GA}(T_j))$.
