semantic_id: MAT.ALG.POLINOMIOS.GRADO_ABSOLUTO_POLINOMIO
resumen_inicial: 'El cálculo del grado absoluto de un polinomio consiste en determinar el mayor de los grados absolutos de sus términos algebraicos componentes.'
explicacion_simple: |
  El **grado absoluto de un polinomio** mide la potencia máxima global que alcanza la expresión:
  - Para calcularlo:
    1. Calculas el grado absoluto de **cada término por separado** (sumando los exponentes de sus letras).
    2. Comparas los resultados obtenidos.
    3. El **número mayor** es el grado absoluto de todo el polinomio.
  - Ejemplo: En $P(x,y) = 5x^2 y^3 - 7x^4 y^2 + 2x y^6$:
    - Primer término: $2 + 3 = 5$.
    - Segundo término: $4 + 2 = 6$.
    - Tercer término: $1 + 6 = 7$.
    - El mayor de todos es $7 \implies$ Grado absoluto del polinomio = **$7$**.
explicacion_formal: |
  ### Definición formal
  Dado un polinomio no nulo $P(x_1, \dots, x_k) = \sum_{i=1}^n M_i \in \mathbb{R}[x_1, \dots, x_k]$, el **grado absoluto del polinomio** $\operatorname{grabs}(P)$ es el máximo entre los grados absolutos de sus términos monómicos componentes no nulos:

  $$\operatorname{grabs}(P) = \max_{i \in \{1, \dots, n\}} (\operatorname{grabs}(M_i))$$

  donde $\operatorname{grabs}(M_i)$ representa la suma de los exponentes del $i$-ésimo monomio.

  ### Grado de Polinomios en Una Variable
  En polinomios de una sola variable $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_0$ con $a_n \neq 0$, el grado absoluto coincide con el exponente del término principal:

  $$\operatorname{grabs}(P) = n = \deg(P)$$

  ### Síntesis didáctica
  El grado absoluto establece la complejidad de comportamiento de la función polinómica, determinando el número máximo de raíces reales o complejas que puede tener.
definiciones_clave: |
  - **Grado absoluto de un polinomio**: Máximo valor numérico entre los grados absolutos de todos sus términos constituyentes.
  - **Término principal**: Término algebraico no nulo que posee el mayor grado absoluto en el polinomio.
  - **Polinomio cuadrático / cúbico**: Polinomios cuyo grado absoluto es igual a $2$ y $3$ respectivamente.
propiedades_relaciones: |
  - **Grado de la suma**: $\operatorname{grabs}(P + Q) \le \max(\operatorname{grabs}(P), \operatorname{grabs}(Q))$.
  - **Grado del producto**: $\operatorname{grabs}(P \cdot Q) = \operatorname{grabs}(P) + \operatorname{grabs}(Q)$.
ejemplo_guiado:
  enunciado: 'Calcula el grado absoluto del polinomio multivariable $P(a,b) = 9a^3 b^4 - 2a^6 b + 11a^2 b^2 - 15$.'
  pasos:
    - 'Paso 1: Calculamos el grado del 1.er término $9a^3 b^4$: Sumamos exponentes $3 + 4 = 7$.'
    - 'Paso 2: Calculamos el grado del 2.º término $-2a^6 b$: Sumamos exponentes $6 + 1 = 7$.'
    - 'Paso 3: Calculamos el grado del 3.er término $11a^2 b^2$: Sumamos exponentes $2 + 2 = 4$.'
    - 'Paso 4: Calculamos el grado del 4.º término $-15$: Al ser constante sin letras, su grado es $0$.'
    - 'Paso 5: Tomamos el valor máximo entre $\{7, 7, 4, 0\}$, que resulta ser $7$.'
    - 'Conclusión: El grado absoluto del polinomio es **$7$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se determina el grado absoluto de un polinomio compuesto por varios términos algebraicos?'
    choices:
      - {text: 'Identificando el término con el mayor grado absoluto y tomando dicho valor como el grado del polinomio', is_correct: true}
      - {text: 'Sumando los grados de todos los términos que componen la expresión', is_correct: false}
      - {text: 'Multiplicando los coeficientes de los términos principales', is_correct: false}
      - {text: 'Restando el grado menor al grado mayor', is_correct: false}
    explanation: 'La alternativa correcta es ''Identificando el término con el mayor grado absoluto y tomando dicho valor como el grado del polinomio''. Criterio del grado máximo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el grado absoluto del polinomio $Q(x,y) = 4x^3 y^2 - 8x^5 y^4 + 10x y^3$?'
    choices:
      - {text: 'El grado absoluto es $9$, correspondiente al término $-8x^5 y^4$ ($5 + 4 = 9$)', is_correct: true}
      - {text: 'El grado absoluto es $5$, sumando $3 + 2$', is_correct: false}
      - {text: 'El grado absoluto es $18$, sumando todos los exponentes', is_correct: false}
      - {text: 'El grado absoluto es $-8$, igual a su coeficiente principal', is_correct: false}
    explanation: 'La alternativa correcta es ''El grado absoluto es $9$, correspondiente al término $-8x^5 y^4$ ($5 + 4 = 9$)''. Término de mayor grado: $5+4=9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el grado absoluto de cada término del polinomio sumando sus exponentes literales.'
  - 'Paso 2: Comparar los grados absolutos de todos los términos.'
  - 'Paso 3: Seleccionar el número más alto entre los valores calculados.'
  - 'Paso 4: Declarar ese valor máximo como el grado absoluto del polinomio.'
errores_correccion: |
  - **Error 1:** Sumar los grados de todos los términos del polinomio juntos. **Cómo corregirlo:** El grado del polinomio **es el MAYOR de los grados**, no la suma de todos.
  - **Error 2:** Excluir el exponente implícito $1$ de una letra al evaluar los términos (ej: en $x^4 y$ contar grado $4$ en vez de $4+1=5$). **Cómo corregirlo:** Las letras sin exponente escrito **aportan $1$ al cálculo del término**.
ejemplos:
  - titulo: 'Grado en una variable'
    enunciado: '¿Cuál es el grado absoluto del polinomio $P(x) = 3x^2 - 5x^8 + 12x^4 - 1$?'
    alternativas:
      - '$8$'
      - '$2$'
      - '$14$'
    respuesta: '$8$'
    solucion_pasos:
      - '1. El mayor exponente de $x$ es $8$ (en $-5x^8$).'
      - '2. El grado del polinomio es $8$.'
  - titulo: 'Grado en polinomio de dos variables'
    enunciado: 'En el polinomio $u^3 v^5 - u^7 v + u^2 v^2$, ¿cuál es el grado absoluto?'
    alternativas:
      - '$8$'
      - '$7$'
      - '$4$'
    respuesta: '$8$'
    solucion_pasos:
      - '1. Grados: $3+5=8$, $7+1=8$, $2+2=4$.'
      - '2. El grado máximo es $8$.'
  - titulo: 'Grado de suma de polinomios'
    enunciado: 'Al sumar un polinomio de grado $3$ con uno de grado $5$, ¿el grado absoluto resultante es como máximo $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{grabs}(P+Q) \le \max(\operatorname{grabs}(P), \operatorname{grabs}(Q))$.'
  - titulo: 'Grado de polinomio cuadrático'
    enunciado: '¿Es el polinomio $2x^2 + 3x - 5$ de grado absoluto igual a $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la mayor potencia es $x^2$.'
errores_frecuentes:
  - 'El grado absoluto de un polinomio se calcula sumando los grados de todos sus términos juntos.'
  - 'El coeficiente numérico principal de un polinomio determina directamente su grado absoluto.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El grado absoluto de un polinomio disminuye si este contiene un término independiente negativo.'
  - 'Sumar dos polinomios de grado N genera siempre un polinomio de grado 2N.'
afirmaciones_verdaderas:
  - 'El grado absoluto de un polinomio es el mayor grado absoluto entre todos sus términos algebraicos.'
  - 'En un polinomio de una sola variable, el grado absoluto coincide con el exponente más alto de la variable.'
al_terminar_debes_poder: 'Calcular el grado absoluto de cualquier polinomio identificando el término algebraico con la suma de exponentes máxima.'
