procedimiento:
- 'Paso 1: Calcula mentalmente el grado absoluto de cada término por separado (sumando
  los exponentes de sus letras).'
- 'Paso 2: Compara los resultados obtenidos.'
- 'Paso 3: El número mayor encontrado es el grado absoluto de todo el polinomio.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar cálculo del grado absoluto de un polinomio.
ejemplos:
- titulo: Buscando al campeón
  enunciado: Halla el grado absoluto del polinomio a^4b - a^3b^3 + ab^5.
  solucion_pasos:
  - 'Término 1: a^4b. Grado = 4 + 1 = 5.'
  - 'Término 2: -a^3b^3. Grado = 3 + 3 = 6.'
  - 'Término 3: ab^5. Grado = 1 + 5 = 6.'
  - El mayor grado encontrado es 6. El polinomio es de sexto grado.
- titulo: Un modelo de costos de manufactura obedece a la función $C(x,y) = x^3 +
    5x^2y^2 - y^3$. Un i
  enunciado: 'Un modelo de costos de manufactura obedece a la función $C(x,y) = x^3
    + 5x^2y^2 - y^3$. Un ingeniero novato clasifica el modelo como ''de tercer grado''
    porque ve que el exponente máximo escrito sobre una letra es un $3$. ¿Cuál es
    el error en su clasificación? (v1)


    Opciones: A) No sumó los exponentes de las variables mixtas dentro de los términos
    compuestos; el término central tiene grado cuatro ($2+2$), por lo que el polinomio
    es de cuarto grado. · B) Olvidó sumar todos los exponentes de la expresión para
    obtener el grado total, que sería ocho. · C) Se equivocó al tomar los negativos;
    el grado real es dos. · D) El modelo no es clasificable porque tiene dos letras
    distintas.'
  solucion_pasos:
  - En $5x^2y^2$, el grado del término es $2+2=4$. Como 4 es mayor que 3 (grado de
    los otros términos), el polinomio es de 4to grado absoluto.
  - 'Respuesta: No sumó los exponentes de las variables mixtas dentro de los términos
    compuestos; el término central tiene grado cuatro ($2+2$), por lo que el polinomio
    es de cuarto grado.'
