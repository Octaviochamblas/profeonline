semantic_id: MAT.ALG.POLINOMIOS.GRADO_ABSOLUTO_POLINOMIO
resumen_inicial: 'Cálculo del grado absoluto de un polinomio: concepto y propiedades
  en Grado, ordenamiento e igualdad de polinomios.'
explicacion_simple: Si el grado absoluto de un término es su peso individual, el Grado
  Absoluto de un Polinomio no es la suma de todos los pesos, sino el peso del vagón
  más pesado de todo el tren.
explicacion_formal: '### Definición formal


  El grado del polinomio es heredado por su término de mayor grado absoluto, como
  un representante.


  ### Desarrollo didáctico


  No se suman los grados de todos los términos juntos. Se evalúa cada término por
  separado, como en un concurso, y el que tenga el mayor grado absoluto le hereda
  su grado a todo el polinomio.


  Ejemplo: $x^4 - 5x^3y^2 + 8x^2$

  1. Evaluamos el primer vagón ($x^4$): Su grado absoluto es $4$.

  2. Evaluamos el segundo vagón ($-5x^3y^2$): Su grado absoluto es $3+2 = 5$.

  3. Evaluamos el tercer vagón ($8x^2$): Su grado absoluto es $2$.


  El vagón ganador es el segundo (grado 5). Por lo tanto, decimos que todo el polinomio
  es de quinto grado absoluto.'
