  - 'La afirmación de que la fila $p=F$ y $q=F$ produce un resultado verdadero en la disyunción exclusiva.'
  - 'La afirmación de que la disyunción exclusiva posee la misma tabla de verdad que el condicional.'
  - 'La afirmación de que el orden de las columnas de entrada altera el vector de salida de la disyunción exclusiva.'
afirmaciones_verdaderas:
