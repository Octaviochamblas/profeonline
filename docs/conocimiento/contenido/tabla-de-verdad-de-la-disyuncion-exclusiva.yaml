semantic_id: MAT.FUND.TABLAS_VERDAD.TABLA_DISYUNCION_EXCLUSIVA
resumen_inicial: 'Estructura canónica de la tabla de verdad de la disyunción exclusiva ($p \oplus q$), con dos filas verdaderas intermedias y dos filas falsas en los extremos.'
explicacion_simple: |
  La **tabla de verdad de la disyunción exclusiva** ($p \oplus q$) describe la situación de "o uno o el otro, pero no ambos". En sus $4$ combinaciones, las filas del centro (donde las variables son diferentes: $V, F$ o $F, V$) dan como resultado **Verdadero ($V$)**. En cambio, en las filas de los extremos (donde ambas variables son iguales: $V, V$ o $F, F$), el resultado es **Falso ($F$)**.
explicacion_formal: |
  ### Definición formal
  La **tabla de verdad de la disyunción exclusiva binaria** es la matriz veritativo-funcional booleana correspondiente a la suma módulo 2 sobre $\mathbb{Z}_2$:
  $$\begin{array}{|c|c|c|} \hline p & q & p \oplus q \\ \hline V & V & F \\ V & F & V \\ F & V & V \\ F & F & F \\ \hline \end{array}$$
  donde el vector columna de salida canónico es $\mathbf{v}(p \oplus q) = [F, V, V, F]^T$.

  ### Desglose simbólico
  - Fila 1 ($V, V$): $V \oplus V = F$ (se descarta la coexistencia de verdad).
  - Fila 2 ($V, F$): $V \oplus F = V$ (disparidad veritativa válida).
  - Fila 3 ($F, V$): $F \oplus V = V$ (disparidad veritativa válida).
  - Fila 4 ($F, F$): $F \oplus F = F$ (ausencia total de verdad).

  ### Síntesis didáctica
  La disyunción exclusiva es exactamente la inversa lógica del bicondicional: su vector $[F, V, V, F]^T$ niega punto a punto el vector $[V, F, F, V]^T$ de $p \leftrightarrow q$.
definiciones_clave: |
  - **Tabla de verdad de la disyunción exclusiva**: Matriz de 4 filas que exhibe dos resultados verdaderos simétricos ($[F, V, V, F]^T$).
  - **Detector de imparidad**: Función que devuelve 1 cuando la suma de bits de entrada es impar.
  - **Vector complementario del bicondicional**: Relación vectorial $\mathbf{v}(p \oplus q) = \mathbf{1} - \mathbf{v}(p \leftrightarrow q)$.
propiedades_relaciones: |
  - **Simetría antipodal**: Los extremos superior ($V,V$) e inferior ($F,F$) son falsos, y los términos cruzados ($V,F$ y $F,V$) son verdaderos.
  - **Conmutatividad**: $p \oplus q \equiv q \oplus p$ confirmado por la igualdad de las filas 2 y 3.
ejemplo_guiado:
  enunciado: 'Construye la tabla de verdad para la fórmula $(p \oplus q) \leftrightarrow \neg(p \leftrightarrow q)$ y verifica si es una tautología.'
  pasos:
    - 'Paso 1: Colocar las 4 filas estándar de entrada para $p$ y $q$.'
    - 'Paso 2: Calcular la subcolumna $p \oplus q$: $[F, V, V, F]^T$.'
    - 'Paso 3: Calcular la subcolumna $p \leftrightarrow q$: $[V, F, F, V]^T$.'
    - 'Paso 4: Calcular la negación $\neg(p \leftrightarrow q)$: Invertir la columna anterior, obteniendo $[F, V, V, F]^T$.'
    - 'Paso 5: Evaluar el bicondicional entre ambas columnas: Comparar $[F, V, V, F]^T$ con $[F, V, V, F]^T$. Como coinciden fila por fila, el resultado es $[V, V, V, V]^T$, confirmando que es una tautología.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles filas de la tabla canónica de $p \oplus q$ tienen como resultado Verdadero ($V$)?'
    choices:
      - {text: 'Las filas 2 y 3, donde las variables tienen valores de verdad distintos ($V, F$ y $F, V$)', is_correct: true}
      - {text: 'Las filas 1 y 4, donde las variables tienen valores iguales', is_correct: false}
      - {text: 'Únicamente la fila 1', is_correct: false}
      - {text: 'Las 4 filas completas', is_correct: false}
    explanation: 'La alternativa correcta es ''Las filas 2 y 3, donde las variables tienen valores de verdad distintos ($V, F$ y $F, V$)''. La disyunción exclusiva exige disparidad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor en la fila 1 de la tabla de verdad de $p \oplus q$ (donde $p=V$ y $q=V$)?'
    choices:
      - {text: 'Falso ($F$)', is_correct: true}
      - {text: 'Verdadero ($V$)', is_correct: false}
      - {text: 'Indeterminado', is_correct: false}
      - {text: 'Tautológico', is_correct: false}
    explanation: 'La alternativa correcta es ''Falso ($F$)''. Al ser ambas verdaderas, la condición de exclusividad mutua se incumple.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Disponer las 4 combinaciones canónicas de entrada ($p: V, V, F, F$ y $q: V, F, V, F$).'
  - 'Paso 2: Rotular la columna de salida como $p \oplus q$.'
  - 'Paso 3: Colocar $F$ en la primera fila ($V, V$) y en la cuarta fila ($F, F$).'
  - 'Paso 4: Colocar $V$ en las filas intermedias ($V, F$ y $F, V$).'
errores_correccion: |
  - **Error 1:** Asignar $V$ en la fila $1$ ($V, V$). **Cómo corregirlo:** La disyunción exclusiva no tolera simultaneidad de verdad; si $p=V$ y $q=V$, entonces $p \oplus q = F$.
  - **Error 2:** Creer que la fila $4$ ($F, F$) es verdadera. **Cómo corregirlo:** Para que la disyunción exclusiva sea verdadera debe existir al menos una verdad exclusiva; si ambas son falsas, el resultado es estrictamente $F$.
ejemplos:
  - titulo: 'Fila de verdad 1'
    enunciado: '¿Cuánto vale $p \oplus q$ en la fila $p=V, q=F$?'
    alternativas:
      - '$V$'
      - '$F$'
      - '$1/2$'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $V \oplus F = V$.'
  - titulo: 'Fila de verdad 2'
    enunciado: '¿Cuánto vale $p \oplus q$ en la fila $p=F, q=V$?'
    alternativas:
      - '$V$'
      - '$F$'
      - 'Nulo'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $F \oplus V = V$.'
  - titulo: 'Porcentaje de verdad'
    enunciado: '¿El porcentaje de combinaciones verdaderas en la tabla de la disyunción exclusiva es exactamente del 50%?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, exactamente 2 de 4 filas son verdaderas (50%).'
  - titulo: 'Relación con el bicondicional'
    enunciado: '¿La suma booleana de los vectores de $p \oplus q$ y $p \leftrightarrow q$ es el vector $[1, 1, 1, 1]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, son vectores estrictamente complementarios fila por fila.'
