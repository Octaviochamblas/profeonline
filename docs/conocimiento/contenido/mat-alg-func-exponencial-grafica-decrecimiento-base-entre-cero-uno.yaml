semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: 'El decrecimiento exponencial ocurre cuando la base satisface $0 < b < 1$, haciendo que la gráfica baje desde $+\infty$ a la izquierda y se pegue asintóticamente a $y = 0$ a la derecha.'
explicacion_simple: |
  Cuando la base de una función exponencial es una fracción decimal comprimida entre 0 y 1 (como $b = 0.5$ o $b = \frac{1}{3}$), la función representa un decaimiento o reducción progresiva. A la izquierda del gráfico (con exponentes negativos), la curva viene cayendo desde alturas gigantescas. Tras cruzar el eje vertical en $(0, a)$, la curva continúa descendiendo cada vez más despacio, aplanándose sobre la línea del eje $x$ sin llegar a tocarla jamás.
explicacion_formal: |
  ### Definición formal
  Para una función exponencial $f(x) = a \cdot b^x$ con $a > 0$, la condición $0 < b < 1$ establece un **modelo de decaimiento exponencial estrictamente decreciente** caracterizado por:
  $$\forall x_1, x_2 \in \mathbb{R}, \quad x_1 < x_2 \implies f(x_1) > f(x_2)$$
  con derivada primera estrictamente negativa $f'(x) = a \cdot b^x \cdot \ln(b) < 0$ (dado que $\ln(b) < 0$ para $0 < b < 1$).

  ### Desglose simbólico
  - Comportamiento asintótico a la derecha: $\lim_{x \to +\infty} a \cdot b^x = 0^+$. La recta $y = 0$ es asíntota horizontal a la derecha.
  - Comportamiento divergente a la izquierda: $\lim_{x \to -\infty} a \cdot b^x = +\infty$ (pues al evaluar $x = -k$, $b^{-k} = \left(\frac{1}{b}\right)^k \to +\infty$ con $\frac{1}{b} > 1$).
  - Convexidad permanente: La curva es convexa ($f''(x) > 0$), suavizando su caída a medida que $x$ avanza hacia la derecha.

  ### Síntesis didáctica
  Reconocer la simetría con la curva de crecimiento: La gráfica de decaimiento $f(x) = (0.5)^x$ es exactamente la gráfica de crecimiento $g(x) = 2^x$ reflejada de izquierda a derecha respecto al eje $y$.
definiciones_clave: |
  - **Decaimiento exponencial ($0 < b < 1$)**: Reducción multiplicativa constante donde los valores de salida disminuyen a una razón $b < 1$.
  - **Aproximación asintótica superior derecha**: Tendencia de la curva a aproximarse infinitamente a $y = 0$ a medida que $x \to +\infty$.
  - **Divergencia izquierda a $+\infty$**: Crecimiento ilimitado de la curva al retroceder hacia valores negativos de $x$.
propiedades_relaciones: |
  - **Semivida o vida media**: En procesos de decaimiento radiactivo $M(t) = M_0 \cdot (0.5)^{t/T}$, el parámetro $T$ representa el tiempo exacto requerido para reducir la cantidad a la mitad.
  - **Rapidez de decaimiento**: Cuanto más cercana a cero es la base $b \in ]0, 1[$, más rápida y abrupta es la caída de la gráfica hacia la asíntota $y = 0$.
ejemplo_guiado:
  enunciado: 'Dada la función exponencial de decaimiento $f(x) = 8 \cdot (0.5)^x$, halla sus valores para $x = -2, 0, 2$ y determina la ecuación de su asíntota horizontal.'
  pasos:
    - 'Paso 1: Identificamos la base $b = 0.5 = \frac{1}{2}$. Como $0 < 0.5 < 1$ y $a = 8 > 0$, la función es estrictamente decreciente.'
    - 'Paso 2: Evaluamos en $x = -2 \implies f(-2) = 8 \cdot (0.5)^{-2} = 8 \cdot 2^2 = 8 \cdot 4 = 32$.'
    - 'Paso 3: Evaluamos en $x = 0 \implies f(0) = 8 \cdot (0.5)^0 = 8 \cdot 1 = 8$.'
    - 'Paso 4: Evaluamos en $x = 2 \implies f(2) = 8 \cdot (0.5)^2 = 8 \cdot \frac{1}{4} = 2$.'
    - 'Paso 5: La asíntota horizontal es la recta $y = 0$, a la cual se aproxima a la derecha cuando $x \to +\infty$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para una función exponencial $f(x) = a \cdot b^x$ con $a > 0$, ¿qué sucede con el comportamiento gráfico a la derecha ($x \to +\infty$) si la base cumple $0 < b < 1$?'
    choices:
      - {text: 'La gráfica es estrictamente decreciente y se aproxima asintóticamente al eje $x$ (recta $y = 0$)', is_correct: true}
      - {text: 'La gráfica es estrictamente creciente y tiende a $+\infty$', is_correct: false}
      - {text: 'La gráfica se transforma en una parábola con vértice en el origen', is_correct: false}
      - {text: 'La gráfica cruza el eje $x$ pasando a tener valores negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''La gráfica es estrictamente decreciente y se aproxima asintóticamente al eje $x$ (recta $y = 0$)''. Una base entre 0 y 1 genera decaimiento hacia la asíntota $y = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si comparamos las funciones de decaimiento $f(x) = (0.8)^x$ y $g(x) = (0.1)^x$ para $x > 0$, ¿cuál de las dos curvas cae más rápidamente hacia el eje $x$?'
    choices:
      - {text: 'La función $g(x) = (0.1)^x$, porque su base está más cercana a cero', is_correct: true}
      - {text: 'La función $f(x) = (0.8)^x$, porque su base está más cercana a uno', is_correct: false}
      - {text: 'Ambas caen a la misma velocidad exacta', is_correct: false}
      - {text: 'La función $g(x) = (0.1)^x$ es una curva creciente', is_correct: false}
    explanation: 'La alternativa correcta es ''La función $g(x) = (0.1)^x$, porque su base está más cercana a cero''. A menor valor de la base $b \in ]0, 1[$, más abrupto es el decaimiento hacia cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la base $b$ y verificar que satisfaga $0 < b < 1$.'
  - 'Paso 2: Confirmar la monotonía estrictamente decreciente para $a > 0$.'
  - 'Paso 3: Trazar la asíntota horizontal $y = 0$ en el extremo derecho ($x \to +\infty$).'
  - 'Paso 4: Trazar la curva descendiendo desde $+\infty$ a la izquierda, pasando por $(0, a)$ y aplanándose sobre $y = 0$ a la derecha.'
errores_correccion: |
  - **Error 1:** Afirmar que una función decreciente como $f(x) = (0.5)^x$ pasa a ser negativa para $x$ grandes. **Cómo corregirlo:** Toda potencia $(0.5)^x$ es estrictamente positiva. La gráfica decrece aproximándose a cero por arriba, pero nunca toma valores negativos.
  - **Error 2:** Confundir la asíntota de decaimiento (que ocurre a la derecha $x \to +\infty$) con la de crecimiento (que ocurre a la izquierda $x \to -\infty$). **Cómo corregirlo:** En el decaimiento ($0 < b < 1$), el aplastamiento asintótico contra $y = 0$ ocurre al avanzar hacia la derecha.
ejemplos:
  - titulo: 'Reconocimiento de decaimiento'
    enunciado: '¿La función $f(x) = 3 \cdot \left(\frac{1}{4}\right)^x$ representa decaimiento exponencial?'
    alternativas:
      - 'Sí, porque $0 < \frac{1}{4} < 1$'
      - 'No, porque el coeficiente 3 es mayor que 1'
      - 'No, es una recta decreciente'
    respuesta: 'Sí, porque $0 < \frac{1}{4} < 1$'
    solucion_pasos:
      - '1. La base es $b = \frac{1}{4} = 0.25$.'
      - '2. Al ser $0 < 0.25 < 1$ y $a = 3 > 0$, la curva es estrictamente decreciente.'
  - titulo: 'Evaluación en exponentes negativos'
    enunciado: 'Para $g(x) = (0.2)^x$, ¿evaluar $x = -3$ resulta $125$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0.2)^{-3} = \left(\frac{1}{5}\right)^{-3} = 5^3 = 125$.'
  - titulo: 'Comportamiento en el infinito positivo'
    enunciado: '¿El límite de $f(x) = (0.9)^x$ cuando $x \to +\infty$ es igual a 0?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0.9)^{1000} \approx 0$. La asíntota a la derecha es $y = 0$.'
  - titulo: 'Simetría con curva creciente'
    enunciado: '¿Reemplazar $x$ por $-x$ en la función creciente $f(x) = 2^x$ produce la función decreciente $g(x) = (0.5)^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2^{-x} = (2^{-1})^x = \left(\frac{1}{2}\right)^x = (0.5)^x$.'
errores_frecuentes:
  - 'Una función exponencial con base $0 < b < 1$ corta al eje $x$ cuando $x$ es suficientemente grande.'
  - 'Las funciones exponenciales de decaimiento tienden a $-\infty$ cuando $x \to +\infty$.'
  - 'Si la base es $b = 0.5$, la función exponencial es una recta con pendiente negativa $-0.5$.'
  - 'Una función exponencial decreciente alcanza su valor mínimo en $x = 0$.'
  - 'La gráfica de decaimiento $f(x) = (0.1)^x$ es más lenta en caer hacia cero que la gráfica de $g(x) = (0.9)^x$.'
afirmaciones_verdaderas:
  - 'Para $a > 0$, una base $0 < b < 1$ origina una curva de decaimiento exponencial estrictamente decreciente que se aproxima asintóticamente a $y = 0$ cuando $x \to +\infty$.'
  - 'La función de decaimiento exponencial $f(x) = b^x$ con $0 < b < 1$ equivale a la función de crecimiento con exponente negativo $\left(\frac{1}{b}\right)^{-x}$.'
al_terminar_debes_poder: 'Analizar y graficar el decaimiento exponencial para bases $0 < b < 1$ identificando su comportamiento asintótico y de monotonía.'
