semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: 'Análisis del decrecimiento exponencial para bases entre cero y uno:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: Cuando la base es una fracción propia (menor que 1), cada incremento
  unitario en $x$ reduce el valor anterior, generando una curva que se acerca cada
  vez más a cero sin llegar a alcanzarlo.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot b^x$ con $a>0$ y $0<b<1$: si $x_1<x_2$, entonces $f(x_1)>f(x_2)$,
  es decir, la función es estrictamente decreciente en todo $\mathbb{R}$. La tasa
  de decrecimiento (el cociente entre valores consecutivos) es constante e igual a
  $b$.


  ### Desarrollo didáctico


  Este comportamiento es característico de fenómenos de desintegración o decaimiento:
  la cantidad se reduce siempre en la misma proporción, aunque el valor absoluto de
  esa reducción disminuya con el tiempo.


  Para $f(x)=(1/2)^x$: entre $x=0$ y $x=1$, la función pasa de $1$ a $0{,}5$ (reducción
  de $0{,}5$); entre $x=3$ y $x=4$, pasa de $0{,}125$ a $0{,}0625$ (reducción de $0{,}0625$),
  un decrecimiento cada vez más pequeño en magnitud absoluta.'
definiciones_clave: '- **Análisis del decrecimiento exponencial para bases entre cero
  y uno**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a análisis del decrecimiento exponencial para bases entre cero y uno.'
ejemplo_guiado:
