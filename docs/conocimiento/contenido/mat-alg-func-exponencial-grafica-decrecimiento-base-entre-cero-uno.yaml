procedimiento:
- 'Paso 1: Verifica que la base $b$ esté entre 0 y 1, y que $a$ sea positivo.'
- 'Paso 2: Concluye que la función es estrictamente decreciente en todo su dominio.'
- 'Paso 3: Observa que la función se acerca cada vez más a cero sin nunca alcanzarlo.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en análisis
  del decrecimiento exponencial para bases entre cero y uno.
ejemplos:
- titulo: Verificación de decrecimiento
  enunciado: ¿Cómo se comporta $f(x)=5\cdot0{,}3^x$ a medida que $x$ aumenta?
  solucion_pasos:
  - $b=0{,}3$, con $0<0{,}3<1$, y $a=5>0$.
  - La función decrece, aproximándose cada vez más a cero.
- titulo: Comparación de tasas de decrecimiento
  enunciado: ¿Cuál de $f(x)=0{,}5^x$ y $g(x)=0{,}1^x$ decrece más rápido para $x$
    grande?
  solucion_pasos:
  - Ambas tienen base entre 0 y 1, por lo que ambas son decrecientes.
  - $g(x)=0{,}1^x$ decrece más rápido, ya que su base ($0{,}1$) es menor que la de
    $f(x)$ ($0{,}5$).
- titulo: ¿Una función exponencial decreciente puede tomar valores negativos si $a>0$?
  enunciado: ¿Una función exponencial decreciente puede tomar valores negativos si
    $a>0$?
  respuesta: 'No'
  solucion_pasos:
  - La función se acerca a cero pero siempre permanece positiva, sin llegar nunca
    a ser negativa.
- titulo: ¿El decrecimiento exponencial con $0<b<1$ implica que la función alcanza
    el valor cero?
  enunciado: ¿El decrecimiento exponencial con $0<b<1$ implica que la función alcanza
    el valor cero?
  respuesta: 'No'
  solucion_pasos:
  - La función se aproxima indefinidamente a cero, pero nunca lo alcanza exactamente.
errores_frecuentes:
- Confundir el decrecimiento exponencial con un decrecimiento lineal de reducción
  constante.
- Asumir incorrectamente que la función eventualmente alcanza o cruza el valor cero.
- No verificar el signo del coeficiente $a$ antes de concluir que la función es decreciente.
- Confundir la condición $0<b<1$ con $b<0$, que no corresponde a una base válida.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando análisis del decrecimiento exponencial para bases entre cero y uno.
