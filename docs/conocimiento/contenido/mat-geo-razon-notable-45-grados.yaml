procedimiento:
- 'Paso 1: Dibuja un triángulo rectángulo isósceles con ambos catetos de longitud
  1.'
- 'Paso 2: Calcula la hipotenusa usando el teorema de Pitágoras: √(1²+1²)=√2.'
- 'Paso 3: Aplica las definiciones de seno, coseno y tangente usando estas tres medidas
  (1, 1, √2).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con razones trigonométricas del ángulo de 45°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de razones trigonométricas del ángulo de 45° para
