semantic_id: MAT.GEO.TRIG_NOTABLES.RAZONES_45_GRADOS
resumen_inicial: 'Razones trigonométricas del ángulo de 45°: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría en el Triángulo Rectángulo.'
explicacion_simple: El ángulo de 45° aparece en un triángulo rectángulo isósceles
  (con ambos catetos iguales), lo que permite calcular sus razones trigonométricas
  de forma exacta.
explicacion_formal: '![Razones trigonométricas de 45°](/static/img/geometria/trigonometria/razon-notable-45-grados.svg)


  ### Definición formal


  En un triángulo rectángulo isósceles, ambos catetos miden lo mismo (por ejemplo,
  1), y por el teorema de Pitágoras la hipotenusa mide $\sqrt{1^2+1^2}=\sqrt{2}$.
  Como los dos ángulos agudos son iguales (45° cada uno), $\sin45°=\cos45°=\dfrac{1}{\sqrt2}=\dfrac{\sqrt2}{2}\approx0{,}707$,
  y $\tan45°=\dfrac{1}{1}=1$.


  ### Desarrollo didáctico


  Este triángulo notable (45°-45°-90°) es uno de los dos triángulos base para memorizar
  los valores trigonométricos exactos, junto con el triángulo 30°-60°-90°.'
definiciones_clave: '- **Razones trigonométricas del ángulo de 45°**: Elemento o propiedad
  fundamental en el estudio de trigonometría en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a razones trigonométricas del ángulo de 45°.'
ejemplo_guiado:
  enunciado: En el estudio de razones trigonométricas del ángulo de 45°, un triángulo
    posee ángulos interiores de medidas $15^\circ$, $4850^\circ$ y $\gamma$. Halla
    el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de razones trigonométricas del ángulo de 45° y la suma
    de ángulos interiores.
  - 'Plantear la suma: $15^\circ + 4850^\circ + \gamma = 180^\circ \implies 4865^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4865^\circ = -4685^\circ$.
