  - 'Plantear la ecuación de cálculo: $x + 1136 = 123 \implies x = 123 - 1136$.'
  - Concluir que la medida calculada para aplicación del factor de escala para calcular
    lados en triángulos notables no unitarios es $x = -1013^\circ$.
