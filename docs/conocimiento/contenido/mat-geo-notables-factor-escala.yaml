semantic_id: MAT.GEO.TRIANGULOS_NOTABLES_METRICA.FACTOR_ESCALA_NOTABLES
resumen_inicial: 'Aplicación del factor de escala para calcular lados en triángulos
  notables no unitarios: conceptos, teoremas, propiedades geométricas y cálculo en
  Perímetros, Áreas y Teoremas.'
explicacion_simple: 'Las relaciones de los triángulos notables no están limitadas
  a un solo tamaño: cualquier triángulo semejante a un 45-45-90 o a un 30-60-90 conserva
  las mismas proporciones, multiplicadas por un factor de escala k.'
explicacion_formal: '![Factor de escala en triángulos notables](/static/img/geometria/areas-pitagoras/notables-factor-escala.svg)


  ### Definición formal


  Un triángulo 45-45-90 con catetos $k$ tiene hipotenusa $k\sqrt2$; un triángulo 30-60-90
  con cateto menor $k$ tiene cateto mayor $k\sqrt3$ e hipotenusa $2k$. El valor de
  $k$ es el factor de escala del triángulo específico.


  ### Desarrollo didáctico


  Un triángulo 45-45-90 con catetos de 9 cm corresponde a $k=9$ (ya que la forma base
  tiene catetos de longitud 1), por lo que su hipotenusa es $9\sqrt2\approx12,73$
  cm. De igual modo, un triángulo 30-60-90 con cateto menor de 4 cm corresponde a
  $k=4$, con cateto mayor $4\sqrt3\approx6,93$ cm e hipotenusa $8$ cm.'
