- titulo: ¿Se cumple siempre la propiedad principal de aplicación del factor de escala
    para calcular lados en triángulos notables no unitarios en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede aplicación del factor de escala para calcular lados en triángulos
    notables no unitarios asumir un valor negativo cuando representa una longitud
    geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
