semantic_id: MAT.NUM.COMPLEJOS.PARTE_REAL
resumen_inicial: 'La parte real de un número complejo $z = a + bi$ es la componente numérica escalar $a$ no acompañada por la unidad imaginaria $i$, denotada por $\operatorname{Re}(z) = a$.'
explicacion_simple: |
  En cualquier número complejo como $z = 8 - 3i$, la parte real es simplemente el número que está "suelto", sin la letra $i$ pegada a él. En este caso, la parte real es 8. Los matemáticos usan el símbolo $\operatorname{Re}(z)$ para referirse a la parte real, de modo que escribimos $\operatorname{Re}(8 - 3i) = 8$. Si el número es un imaginario puro como $z = 5i$, su parte real es 0.
explicacion_formal: |
  ### Definición formal
  La **función parte real** $\operatorname{Re}: \mathbb{C} \to \mathbb{R}$ asigna a cada número complejo $z = a + bi$ su primera componente escalar real:
  $$\operatorname{Re}(z) = a \quad (a \in \mathbb{R})$$

  ### Casos particulares de evaluación de $\operatorname{Re}(z)$
  1. **Para un número real $x \in \mathbb{R}$**: $\operatorname{Re}(x) = x$ (puesto que $x = x + 0i$).
  2. **Para un número imaginario puro $bi \in \mathbb{I}$**: $\operatorname{Re}(bi) = 0$ (puesto que $bi = 0 + bi$).
  3. **Mediante la fórmula del conjugado**: $\operatorname{Re}(z) = \frac{z + \bar{z}}{2}$.

  ### Propiedad de linealidad
  Para cualesquiera números complejos $z_1, z_2 \in \mathbb{C}$ y constante real $k \in \mathbb{R}$:
  $$\operatorname{Re}(z_1 + z_2) = \operatorname{Re}(z_1) + \operatorname{Re}(z_2) \quad \text{y} \quad \operatorname{Re}(k \cdot z) = k \cdot \operatorname{Re}(z)$$

  ### Síntesis didáctica
  - Operador matemático: $\operatorname{Re}(z)$ o $\operatorname{Re}(a + bi) = a$.
  - Naturaleza del resultado: Siempre devuelve un **número real escalar** (jamás contiene a la letra $i$).
definiciones_clave: |
  - **Parte real $\operatorname{Re}(z)$**: Escalar real $a$ que constituye el término independiente de la unidad imaginaria.
  - **Operador $\operatorname{Re}(\cdot)$**: Función que proyecta un punto del plano complejo sobre el eje real horizontal.
  - **Eje real**: Eje horizontal $X$ del plano de Argand donde se representa gráficamente el valor de $\operatorname{Re}(z)$.
propiedades_relaciones: |
  - **Representación gráfica**: $\operatorname{Re}(z)$ corresponde a la abcisa $x$ en las coordenadas cartesianas $(x, y)$ del número complejo.
  - **Cero de la parte real**: Si $\operatorname{Re}(z) = 0$, el número complejo $z$ se encuentra exactamente situado sobre el eje imaginario vertical.
ejemplo_guiado:
  enunciado: 'Dado el número complejo $z = \frac{3 - 8i}{5}$, determina el valor exacto de su parte real $\operatorname{Re}(z)$.'
  pasos:
    - 'Paso 1: Distribuimos el denominador común 5 entre los dos términos del numerador para expresar $z$ en forma canónica: $z = \frac{3}{5} - \frac{8}{5}i$.'
    - 'Paso 2: Comparamos la expresión con la estructura estándar $z = a + bi$.'
    - 'Paso 3: Identificamos el término escalar libre de la unidad $i$: $a = \frac{3}{5}$.'
    - 'Paso 4: Aplicamos el operador para concluir: $\operatorname{Re}(z) = \frac{3}{5}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor de la parte real $\operatorname{Re}(z)$ para un número imaginario puro como $z = -14i$?'
    choices:
      - {text: '$0$, ya que los números imaginarios puros no tienen componente real independiente ($a = 0$)', is_correct: true}
      - {text: '$-14$, tomando el coeficiente del imaginario', is_correct: false}
      - {text: '$-14i$, conservando la letra i', is_correct: false}
      - {text: '$14$, cambiando el signo', is_correct: false}
    explanation: 'La alternativa correcta es ''$0$, ya que los números imaginarios puros no tienen componente real independiente ($a = 0$)''. Todo imaginario puro es de la forma $0 + bi$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor de $\operatorname{Re}(z)$ para el número complejo $z = -9 + 4i$?'
    choices:
      - {text: '$-9$', is_correct: true}
      - {text: '$4$', is_correct: false}
      - {text: '$4i$', is_correct: false}
      - {text: '$-5$, sumando los coeficientes', is_correct: false}
    explanation: 'La alternativa correcta es ''$-9$''. La parte real $\operatorname{Re}(z)$ es el escalar libre de $i$, que corresponde a $-9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Expresar el número complejo en su forma canónica separada $a + bi$.'
  - 'Paso 2: Localizar el término escalar $a$ que no está multiplicado por la unidad $i$.'
  - 'Paso 3: Extraer dicho término $a$ conservando su signo algebraico original.'
  - 'Paso 4: Escribir el resultado final mediante la notación $\operatorname{Re}(z) = a$.'
errores_correccion: |
  - **Error 1:** Afirmar que la parte real incluye a la unidad $i$ cuando se escribe en forma de binomio. **Cómo corregirlo:** La parte real es un **escalar real único** $a \in \mathbb{R}$; jamás lleva la letra $i$.
  - **Error 2:** Creer que en un número complejo desordenado $z = 5i - 2$, la parte real es el primer número escrito (5). **Cómo corregirlo:** La parte real no es el primer número, sino el número que **NO acompaña a $i$**. Reordenando a canónica $z = -2 + 5i$, se ve claramente que $\operatorname{Re}(z) = -2$.
ejemplos:
  - titulo: 'Parte real en número complejo desordenado'
    enunciado: 'Para $z = 7i + 12$, ¿el valor de $\operatorname{Re}(z)$ es igual a $12$?'
    alternativas:
      - 'Sí, pues 12 es el escalar libre de i'
      - 'No, es igual a 7'
      - 'No, es igual a 7i'
    respuesta: 'Sí, pues 12 es el escalar libre de i'
    solucion_pasos:
      - '1. Ordenamos la expresión a forma canónica: $z = 12 + 7i$.'
      - '2. Extraemos el escalar libre: $\operatorname{Re}(z) = 12$.'
  - titulo: 'Parte real de un número real'
    enunciado: 'Para el número real $z = -15$, ¿se cumple que $\operatorname{Re}(-15) = -15$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Todo número real tiene parte real igual a sí mismo.'
  - titulo: 'Parte real con fracción'
    enunciado: '¿La parte real de $z = \frac{1 - 4i}{2}$ es igual a $1/2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Separando la fracción $z = 1/2 - 2i \implies \operatorname{Re}(z) = 1/2$.'
  - titulo: 'Suma de partes reales'
    enunciado: 'Si $z_1 = 3 + 2i$ y $z_2 = 5 - 4i$, ¿se cumple $\operatorname{Re}(z_1 + z_2) = 8$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad de linealidad $3 + 5 = 8$.'
errores_frecuentes:
  - 'Tomar el primer término escrito en una expresión desordenada como la parte real del número complejo.'
  - 'Incluir la unidad imaginaria $i$ al escribir el resultado numérico de $\operatorname{Re}(z)$.'
  - 'Asignar un valor distinto de cero a la parte real de un número imaginario puro.'
  - 'El operador parte real $\operatorname{Re}(z)$ calcula la distancia o norma euclidiana del número complejo al origen.'
  - 'Restar la parte imaginaria a la parte real al calcular $\operatorname{Re}(z)$.'
afirmaciones_verdaderas:
  - 'La parte real de un número complejo $z = a + bi$ es el escalar real $a \in \mathbb{R}$ denotado por $\operatorname{Re}(z) = a$.'
  - 'La parte real de cualquier número imaginario puro $bi$ es estrictamente igual a cero ($\operatorname{Re}(bi) = 0$).'
al_terminar_debes_poder: 'Identificar y calcular la parte real $\operatorname{Re}(z) = a$ de cualquier número complejo dado en forma canónica o desordenada.'
