semantic_id: MAT.NUM.COMPLEJOS.PARTE_REAL
resumen_inicial: La parte real de un número complejo $z = a + bi$ es el escalar real
  $a$, denotado por $\text{Re}(z) = a$.
explicacion_simple: 'La parte real es el número independiente que **no tiene la letra
  $i$** a su lado:

  - En $z = 7 + 2i$, $\text{Re}(z) = 7$.

  - En $z = -4i$, no hay número solo, por lo que $\text{Re}(z) = 0$.

  - En $z = 12$, $\text{Re}(z) = 12$.'
explicacion_formal: 'Dada la representación binomial $z = a + bi$, se define el operador
  parte real $\text{Re}: \mathbb{C} \to \mathbb{R}$ tal que $\text{Re}(a + bi) = a$.
  También se puede calcular como $\text{Re}(z) = \frac{z + \bar{z}}{2}$.'
definiciones_clave: '- **Parte real ($\text{Re}(z)$)**: Componente escalar libre de
  la unidad imaginaria en un número complejo.'
propiedades_relaciones: '- **Fórmula mediante conjugado**: $\text{Re}(z) = \frac{z
  + \bar{z}}{2}$.'
ejemplo_guiado:
  enunciado: Halla la parte real de $z_1 = -9 + 4i$ y $z_2 = 6i$.
  pasos:
  - 'Para $z_1 = -9 + 4i$: el término libre de $i$ es $-9$, luego $\text{Re}(z_1)
    = -9$.'
  - 'Para $z_2 = 6i = 0 + 6i$: el término libre de $i$ es $0$, luego $\text{Re}(z_2)
    = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la parte real de $z = 15 - 8i$?
  choices:
  - text: '15'
    is_correct: true
  - text: '-8'
    is_correct: false
  - text: '8'
    is_correct: false
  - text: -8i
    is_correct: false
  explanation: 'La correcta es: 15. El término sin $i$ es 15.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $\text{Re}(z) = 0$, ¿qué tipo de número es $z$?
  choices:
  - text: Un número imaginario puro (o cero)
    is_correct: true
  - text: Un número real positivo
    is_correct: false
  - text: Un número irracional
    is_correct: false
  - text: No existe
    is_correct: false
  explanation: 'La correcta es: Un número imaginario puro (o cero). Si $a=0$, $z =
    bi$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el complejo en forma $a + bi$.'
- 'Paso 2: Identificar el número que no está multiplicado por $i$.'
- 'Paso 3: Retornar dicho número como $\text{Re}(z)$.'
errores_correccion: No confundas el orden de escritura. En $z = 3i - 5$, la parte
  real es $-5$, no $3$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\text{Re}(8i - 2)$.
  alternativas:
  - '-2'
  - '8'
  - 8i
  respuesta: '-2'
  solucion_pasos:
  - La parte sin $i$ es $-2$.
errores_frecuentes:
- Asumir que el primer término escrito es siempre la parte real.
afirmaciones_verdaderas:
- $\text{Re}(a+bi) = a$.
al_terminar_debes_ponder: Identificar con precisión la parte real de un número complejo.
fuente: Texto escolar MINEDUC.
estado: publicado
