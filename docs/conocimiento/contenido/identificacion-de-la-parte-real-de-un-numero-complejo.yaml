semantic_id: MAT.NUM.COMPLEJOS.PARTE_REAL
resumen_inicial: La parte real de un número complejo $z = a + bi$ es el número real $a$, denotado formalmente por $\operatorname{Re}(z) = a$, correspondiente al término no multiplicado por $i$.
explicacion_simple: '![Identificación de la parte real](/static/img/nodos/identificacion-de-la-parte-real-de-un-numero-complejo-intro.svg)


  Para identificar la **parte real** de un número complejo:

  - Buscas el número que está completamente libre y no tiene la letra $i$ al lado.

  - Se escribe como $\operatorname{Re}(z)$.

  - En $z = 5 - 3i$, la parte real es $\operatorname{Re}(z) = 5$.

  - En $z = 7i - 12$, cuidado con el orden: la parte real es $\operatorname{Re}(z) = -12$.

  - En un imaginario puro como $z = 9i$, la parte real es $\operatorname{Re}(z) = 0$.'
explicacion_formal: 'Sea $z = a + bi \in \mathbb{C}$ con $a, b \in \mathbb{R}$. Se define el operador de **proyección real** $\operatorname{Re}: \mathbb{C} \to \mathbb{R}$ mediante:


  $$\operatorname{Re}(z) = a = \frac{z + \overline{z}}{2}$$

  donde $\overline{z} = a - bi$ es el conjugado de $z$.


  **Propiedades Algebraicas:**

  1. $\operatorname{Re}(z_1 \pm z_2) = \operatorname{Re}(z_1) \pm \operatorname{Re}(z_2)$.

  2. $z \in \mathbb{R} \iff \operatorname{Re}(z) = z \iff \operatorname{Im}(z) = 0$.

  3. $|\operatorname{Re}(z)| \le |z|$ para todo $z \in \mathbb{C}$.'
definiciones_clave: '- **Parte real ($\operatorname{Re}(z)$)**: Valor escalar $a \in \mathbb{R}$ independiente de la unidad imaginaria.

  - **Operador de proyección**: Transformación lineal $\operatorname{Re}(z) = \frac{z + \overline{z}}{2}$.

  - **Número real puro**: Complejo con $\operatorname{Im}(z) = 0$ tal que $z = \operatorname{Re}(z)$.'
propiedades_relaciones: '- **Eje horizontal (Eje Real)**: La parte real define la coordenada $X$ en el plano complejo de Argand-Gauss.

  - **Desigualdad básica**: $-|z| \le \operatorname{Re}(z) \le |z|$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de parte real](/static/img/nodos/identificacion-de-la-parte-real-de-un-numero-complejo-ejemplos.svg)


    Determine la parte real $\operatorname{Re}(z)$ para $z_1 = 7i - 12$ y $z_2 = \frac{6 - 4i}{2}$.'
  pasos:
  - 'Paso 1: Para $z_1 = 7i - 12$: Reordenar en forma canónica $a + bi \implies -12 + 7i$.'
  - 'Paso 2: Extraer el término independiente: $\operatorname{Re}(z_1) = -12$.'
  - 'Paso 3: Para $z_2 = \frac{6 - 4i}{2}$: Distribuir el denominador: $\frac{6}{2} - \frac{4}{2}i = 3 - 2i$.'
  - 'Paso 4: Identificar la parte real: $\operatorname{Re}(z_2) = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la parte real del número complejo $z = 4i - 15$?
  choices:
  - text: $-15$ (el término independiente de $i$, reordenando a $-15 + 4i$)
    is_correct: true
  - text: $4$
    is_correct: false
  - text: $4i$
    is_correct: false
  - text: $15$
    is_correct: false
  explanation: La alternativa correcta es '$-15$ (el término independiente de $i$, reordenando a $-15 + 4i$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la parte real de $z_2 = \frac{6 - 4i}{2}$?
  choices:
  - text: $3$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $-2$
    is_correct: false
  - text: $3i$
    is_correct: false
  explanation: La alternativa correcta es '$3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el número complejo separando claramente los términos reales de los imaginarios.'
- 'Paso 2: Si hay denominadores o productos, simplificar la expresión a la forma canónica $a + bi$.'
- 'Paso 3: Extraer el número real $a = \operatorname{Re}(z)$ con su signo correspondiente.'
errores_correccion: '- **Error 1: Tomar siempre el primer número sin fijarse en la ''i'' (en $5i + 2$, decir $\operatorname{Re}(z) = 5$).** **Cómo corregirlo:** La parte real es la que **NO tiene $i$**: en $5i + 2$, $\operatorname{Re}(z) = 2$.

  - **Error 2: Olvidar el signo negativo del término.** **Cómo corregirlo:** Extraer el signo completo del coeficiente: $\operatorname{Re}(-8 + 3i) = -8$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la parte real de $z = -23i$?
  alternativas:
  - $0$
  - $-23$
  - $-23i$
  respuesta: $0$
  solucion_pasos:
  - $z = 0 - 23i \implies \operatorname{Re}(z) = 0$.
- titulo: Ejemplo 2
  enunciado: Si $z = (2 + i)^2$, ¿cuánto vale $\operatorname{Re}(z)$?
  alternativas:
  - $3$
  - $4$
  - $5$
  respuesta: $3$
  solucion_pasos:
  - $(2 + i)^2 = 4 + 4i + i^2 = 4 + 4i - 1 = 3 + 4i \implies \operatorname{Re}(z) = 3$.
- titulo: ¿Es Re(z) = (z + z̄) / 2 una fórmula válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{(a+bi) + (a-bi)}{2} = \frac{2a}{2} = a$.
  alternativas:
  - texto: Sí, es la fórmula de proyección real mediante el conjugado
    es_correcta: true
    retroalimentacion: ¡Correcto! Identidad analítica de la parte real.
  - texto: No, eso calcula el módulo
    es_correcta: false
    retroalimentacion: Incorrecto, el módulo es una raíz cuadrada.
  - texto: No, da como resultado un número imaginario
    es_correcta: false
    retroalimentacion: Incorrecto, el resultado es el número real $a$.
- titulo: ¿Es la parte real de cualquier número real el mismo número?
  respuesta: Sí
  solucion_pasos:
  - Sí, para todo $x \in \mathbb{R}$, $\operatorname{Re}(x) = x$.
  alternativas:
  - texto: Sí, Re(x) = x para todo real
    es_correcta: true
    retroalimentacion: ¡Correcto! Proyección idéntica sobre los reales.
  - texto: No, es siempre cero
    es_correcta: false
    retroalimentacion: Incorrecto, la que es cero es la parte imaginaria.
  - texto: No, depende del signo
    es_correcta: false
    retroalimentacion: Incorrecto, se conserva para positivos y negativos.
errores_frecuentes:
- Confundir la parte real con el primer término cuando la expresión no está ordenada.
- Asignar parte real no nula a un imaginario puro.
- Olvidar simplificar expresiones antes de extraer $\operatorname{Re}(z)$.
- Cambiar el signo de la parte real al identificarla.
afirmaciones_verdaderas:
- La parte real de $z = a + bi$ es el número real $a = \operatorname{Re}(z)$.
- 'Se calcula analíticamente mediante la semisuma con su conjugado: $\operatorname{Re}(z) = \frac{z + \overline{z}}{2}$.'
- Un número imaginario puro tiene parte real idénticamente igual a cero.
al_terminar_debes_poder: '![Síntesis de parte real](/static/img/nodos/identificacion-de-la-parte-real-de-un-numero-complejo-resumen.svg)


  QUÉ: Identificar y extraer con precisión la parte real $\operatorname{Re}(z)$ de cualquier número complejo.


  CÓMO: Reordenando la expresión a la forma canónica $a + bi$, distribuyendo denominadores y seleccionando el término independiente real $a \in \mathbb{R}$.'
