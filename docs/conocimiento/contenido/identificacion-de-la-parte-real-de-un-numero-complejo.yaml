resumen_inicial: La parte real de un número complejo $z = a + bi$ es el número real
  $a$ no acompañado por la unidad imaginaria, denotándose como $\text{Re}(z) = a$.
explicacion_simple: La parte real es simplemente el número que está solo, sin la letra
  $i$. En el complejo $7 - 3i$, la parte real es el número 7 positivo.
explicacion_formal: 'Para todo $z = a + bi \in \mathbb{C}$, la **Función Parte Real
  $\text{Re}(z)$** asigna el escalar:


  $$\text{Re}(z) = a \in \mathbb{R}$$


  **Propiedad de proyección:**

  - Corresponde a la proyección ortogonal sobre el eje horizontal $X$ del plano complejo.'
definiciones_clave: '- **Parte real $\text{Re}(z)$**: Valor real $a$ en $z = a + bi$.'
propiedades_relaciones: '- **Proyección horizontal**: Representa la coordenada del
  eje real $X$.'
ejemplo_guiado:
  enunciado: Determine la parte real $\text{Re}(z)$ en $z_1 = -4 + 9i$ y $z_2 = 8i$.
  pasos:
  - 'Paso 1: Para $z_1 = -4 + 9i$, el término sin la letra $i$ es $-4 \implies \text{Re}(z_1)
    = -4$.'
  - 'Paso 2: Para $z_2 = 8i$, se puede escribir $0 + 8i \implies \text{Re}(z_2) =
    0$.'
  - 'Conclusión: $\text{Re}(z_1) = -4$ y $\text{Re}(z_2) = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa Re(z) en el número complejo z = a + bi?
  choices:
  - text: El coeficiente real a que no lleva la letra i
    is_correct: true
  - text: El coeficiente b que multiplica a i
    is_correct: false
  - text: La letra i completa
    is_correct: false
  - text: El módulo del vector
    is_correct: false
  explanation: La alternativa correcta es 'El coeficiente real a que no lleva la letra
    i'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para z_1 = -4 + 9i, ¿cuál fue la parte real Re(z)?
  choices:
  - text: '-4'
    is_correct: true
  - text: '9'
    is_correct: false
  - text: 9i
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '-4'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar la parte real $\text{Re}(z)
  = a$ de cualquier número complejo.
semantic_id: MAT.NUM.COMPLEJOS.PARTE_REAL
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.PARTE_REAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
estado: publicado
