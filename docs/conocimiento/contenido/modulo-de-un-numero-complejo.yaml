semantic_id: MAT.NUM.COMPLEJOS.MODULO
resumen_inicial: El módulo de un número complejo $z = a + bi$ es la distancia desde
  el origen de coordenadas $(0,0)$ hasta su afijo en el plano complejo, calculándose
  mediante $|z| = \sqrt{a^2 + b^2}$.
explicacion_simple: 'El **módulo** $|z|$ es la longitud o tamaño del número complejo.
  Se calcula aplicando el Teorema de Pitágoras con las componentes $a$ y $b$:

  $$|z| = \sqrt{a^2 + b^2}$$

  Ejemplo: Para $z = 3 + 4i \implies |z| = \sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25}
  = 5$.

  El módulo es siempre un número real mayor o igual a cero.'
explicacion_formal: 'Para $z = a + bi \in \mathbb{C}$, el módulo $|z|: \mathbb{C}
  \to \mathbb{R}_{\ge 0}$ se define por $|z| = \sqrt{z \cdot \bar{z}} = \sqrt{a^2
  + b^2}$. Representa la norma euclidiana del vector $(a,b)$.'
definiciones_clave: '- **Módulo ($|z|$)**: Distancia euclidiana del complejo al origen
  del plano de Argand.'
propiedades_relaciones: '- **No negatividad**: $|z| \ge 0$, siendo $|z| = 0 \iff z
  = 0$.

  - **Multiplicatividad**: $|z_1 \cdot z_2| = |z_1| \cdot |z_2|$.'
ejemplo_guiado:
  enunciado: Calcula el módulo del número complejo $z = -5 + 12i$.
  pasos:
  - Identificar $\text{Re}(z) = a = -5$ y $\text{Im}(z) = b = 12$.
  - 'Aplicar la fórmula del módulo: $|z| = \sqrt{(-5)^2 + 12^2}$.'
  - 'Calcular los cuadrados: $(-5)^2 = 25$ y $12^2 = 144$.'
  - 'Sumar y extraer la raíz: $\sqrt{25 + 144} = \sqrt{169} = 13$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el módulo del complejo $z = 6 - 8i$?
  choices:
  - text: '10'
    is_correct: true
  - text: '14'
    is_correct: false
  - text: \sqrt{28}
    is_correct: false
  - text: '100'
    is_correct: false
  explanation: 'La correcta es: 10. $|z| = \sqrt{6^2 + (-8)^2} = \sqrt{36 + 64} =
    \sqrt{100} = 10$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el módulo de $z = -4i$.
  choices:
  - text: '4'
    is_correct: true
  - text: '-4'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: 4i
    is_correct: false
  explanation: 'La correcta es: 4. $|z| = \sqrt{0^2 + (-4)^2} = \sqrt{16} = 4$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$.'
- 'Paso 2: Elevar al cuadrado ambas componentes: $a^2$ y $b^2$.'
- 'Paso 3: Sumar los dos valores obtenidos.'
- 'Paso 4: Extraer la raíz cuadrada principal del resultado.'
errores_correccion: No incluyas el signo menos ni la $i$ dentro del cuadrado de $b$.
  En $z = 3 - 4i$, se hace $\sqrt{3^2 + (-4)^2} = \sqrt{9+16} = 5$. **Los cuadrados
  siempre dan valores positivos**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula el módulo de $z = 1 + i$.
  alternativas:
  - \sqrt{2}
  - '2'
  - '1'
  respuesta: \sqrt{2}
  solucion_pasos:
  - $|z| = \sqrt{1^2 + 1^2} = \sqrt{2}$.
errores_frecuentes:
- Incluir la letra $i$ en la suma de cuadrados para el módulo.
afirmaciones_verdaderas:
- $|z| = \sqrt{a^2 + b^2} \ge 0$.
al_terminar_debes_ponder: Calcular el módulo de cualquier número complejo usando la
  fórmula de la norma.
fuente: Texto escolar MINEDUC.
estado: publicado
