semantic_id: MAT.NUM.COMPLEJOS.MODULO
resumen_inicial: 'El módulo de un número complejo $z = a + bi$ es la distancia euclídea desde el origen hasta su afijo en el plano complejo: $|z| = \sqrt{a^2 + b^2}$, cumpliendo $|z| \ge 0$.'
explicacion_simple: "![Módulo de un número complejo](/static/img/nodos/modulo-de-un-numero-complejo-intro.svg)\n\nEl **módulo** de un número complejo es su magnitud o distancia al centro $(0,0)$:\n- Se escribe entre barras verticales: $|z|$.\n- Se calcula aplicando el **Teorema de Pitágoras** con los catetos $a$ y $b$: $|z| = \\sqrt{a^2 + b^2}$.\n- **¡Bajo la raíz NUNCA entra la 'i' y SIEMPRE se suman números positivos!**\n- Ejemplo con el trío pitagórico $3-4-5$:\n  - Si $z = 3 - 4i \\implies |z| = \\sqrt{3^2 + (-4)^2} = \\sqrt{9 + 16} = \\sqrt{25} = 5$."
explicacion_formal: 'Sea $z = a + bi \in \mathbb{C}$ con $a, b \in \mathbb{R}$. Se define el **módulo o norma** de $z$, denotado por $|z|$, como el número real no negativo:


  $$|z| = \sqrt{a^2 + b^2} = \sqrt{z \cdot \overline{z}}$$


  **Propiedades Fundamentales del Módulo:**

  1. **No Negatividad:** $|z| \ge 0$, y $|z| = 0 \iff z = 0$.

  2. **Multiplicatividad:** $|z_1 \cdot z_2| = |z_1| \cdot |z_2|$.

  3. **División:** $\left|\frac{z_1}{z_2}\right| = \frac{|z_1|}{|z_2|}$ ($z_2 \neq 0$).

  4. **Desigualdad Triangular:** $|z_1 + z_2| \le |z_1| + |z_2|$.

  5. **Invarianza por Conjugación:** $|z| = |\overline{z}| = |-z| = |-\overline{z}|$.'
definiciones_clave: '- **Módulo ($|z|$)**: Distancia euclídea desde el origen $(0,0)$ hasta el punto $(a,b)$.

  - **Norma compleja**: Raíz cuadrada del producto con el conjugado $\sqrt{z \cdot \overline{z}}$.

  - **Desigualdad triangular**: $|z_1 + z_2| \le |z_1| + |z_2|$.'
propiedades_relaciones: '- **Módulo de reales e imaginarios**: Para $x \in \mathbb{R}$, $|x + 0i| = \sqrt{x^2} = |x|$; para $bi \in \mathbb{I}$, $|bi| = \sqrt{b^2} = |b|$.

  - **Forma polar y trigonométrica**: El módulo es el radio polar $r = |z|$ en $z = r(\cos\theta + i\sin\theta)$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de módulo de un complejo](/static/img/nodos/modulo-de-un-numero-complejo-ejemplos.svg)


    Calcule el módulo $|z|$ para $z_1 = 3 - 4i$ y $z_2 = -7i$.'
  pasos:
  - 'Paso 1: Para $z_1 = 3 - 4i$: Identificar $a = 3, b = -4$.'
  - 'Paso 2: Aplicar la fórmula: $|z_1| = \sqrt{3^2 + (-4)^2} = \sqrt{9 + 16} = \sqrt{25} = 5$.'
  - 'Paso 3: Para $z_2 = -7i$: Identificar $a = 0, b = -7$.'
  - 'Paso 4: Calcular $|z_2| = \sqrt{0^2 + (-7)^2} = \sqrt{49} = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el módulo del número complejo $z = -6 + 8i$?
  choices:
  - text: $10$ (porque $\sqrt{(-6)^2 + 8^2} = \sqrt{36 + 64} = \sqrt{100} = 10$)
    is_correct: true
  - text: $14$
    is_correct: false
  - text: $2$
    is_correct: false
  - text: $100$
    is_correct: false
  explanation: La alternativa correcta es '$10$ (porque $\sqrt{(-6)^2 + 8^2} = \sqrt{36 + 64} = \sqrt{100} = 10$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(-4)^2 = +16$ bajo la raíz?
  choices:
  - text: Porque el cuadrado de cualquier número real negativo es siempre positivo
    is_correct: true
  - text: Porque se elimina el signo menos con la raíz
    is_correct: false
  - text: Porque $i^2 = -1$
    is_correct: false
  - text: Porque el módulo resta los valores
    is_correct: false
  explanation: La alternativa correcta es 'Porque el cuadrado de cualquier número real negativo es siempre positivo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las partes real $a$ e imaginaria $b$ en $z = a + bi$.'
- 'Paso 2: Elevar ambos coeficientes al cuadrado: $a^2$ y $b^2$ (ambos resultados son $\ge 0$).'
- 'Paso 3: Sumar los cuadrados $a^2 + b^2$ y extraer la raíz cuadrada principal $\sqrt{a^2 + b^2}$.'
errores_correccion: '- **Error 1: Incluir ''i'' dentro de la raíz ($|z| = \sqrt{a^2 + (bi)^2} = \sqrt{a^2 - b^2}$).** **Cómo corregirlo:** La fórmula utiliza **únicamente los coeficientes reales**: $|z| = \sqrt{a^2 + b^2}$.

  - **Error 2: Restar cuadrados cuando $b < 0$ ($(-4)^2 = -16$).** **Cómo corregirlo:** Al elevar al cuadrado, todo número negativo se vuelve positivo: $(-4)^2 = +16$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el módulo de $z = 1 + i$?
  alternativas:
  - $\sqrt{2}$
  - $2$
  - $1$
  respuesta: $\sqrt{2}$
  solucion_pasos:
  - $|z| = \sqrt{1^2 + 1^2} = \sqrt{2}$.
- titulo: Ejemplo 2
  enunciado: Si $z_1 = 3 + 4i$ y $z_2 = 1 - i$, ¿cuánto vale $|z_1 \cdot z_2|$?
  alternativas:
  - $5\sqrt{2}$
  - $5 + \sqrt{2}$
  - $25$
  respuesta: $5\sqrt{2}$
  solucion_pasos:
  - $|z_1 \cdot z_2| = |z_1| \cdot |z_2| = 5 \cdot \sqrt{2} = 5\sqrt{2}$.
- titulo: ¿Es |z| = |z̄| para todo número complejo?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $|a - bi| = \sqrt{a^2 + (-b)^2} = \sqrt{a^2 + b^2} = |a + bi|$.
  alternativas:
  - texto: Sí, el módulo del conjugado es igual al módulo original
    es_correcta: true
    retroalimentacion: ¡Correcto! Simetría de distancias al origen.
  - texto: No, el conjugado tiene módulo negativo
    es_correcta: false
    retroalimentacion: Incorrecto, el módulo siempre es no negativo.
  - texto: No, se restan los módulos
    es_correcta: false
    retroalimentacion: Incorrecto, las distancias euclídeas coinciden.
- titulo: ¿Es el módulo de z = -9 igual a 9?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|-9 + 0i| = \sqrt{(-9)^2 + 0^2} = \sqrt{81} = 9$.
  alternativas:
  - texto: Sí, coincide con el valor absoluto real
    es_correcta: true
    retroalimentacion: ¡Correcto! Extensión directa del valor absoluto.
  - texto: No, es -9
    es_correcta: false
    retroalimentacion: Incorrecto, las distancias nunca son negativas.
  - texto: No, es 0
    es_correcta: false
    retroalimentacion: Incorrecto, solo el número 0 tiene módulo 0.
errores_frecuentes:
- Introducir la letra $i$ en la raíz del módulo.
- Restar términos cuando la parte imaginaria es negativa.
- Asignar valores negativos al módulo.
- Olvidar extraer la raíz cuadrada tras sumar los cuadrados.
afirmaciones_verdaderas:
- El módulo de un número complejo es la distancia euclídea $|z| = \sqrt{a^2 + b^2}$.
- El módulo es siempre un número real no negativo ($|z| \ge 0$).
- El módulo del producto es igual al producto de los módulos ($|z \cdot w| = |z| \cdot |w|$).
al_terminar_debes_poder: '![Síntesis de módulo](/static/img/nodos/modulo-de-un-numero-complejo-resumen.svg)


  QUÉ: Calcular y aplicar las propiedades del módulo $|z|$ en números complejos.


  CÓMO: Evaluando la norma pitagórica $|z| = \sqrt{a^2 + b^2}$ con los coeficientes reales $a, b \in \mathbb{R}$ y utilizando su multiplicatividad y relación con el conjugado $|z|^2 = z \cdot \overline{z}$.'
