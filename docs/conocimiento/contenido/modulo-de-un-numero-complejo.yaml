semantic_id: MAT.NUM.COMPLEJOS.MODULO
resumen_inicial: 'El módulo o norma de un número complejo $z = a + bi$ es la distancia geométrica real desde el origen $(0, 0)$ hasta su afijo en el plano complejo, dada por $|z| = \sqrt{a^2 + b^2}$.'
explicacion_simple: |
  El módulo de un número complejo es su "tamaño" o distancia al punto $(0,0)$ en el plano complejo. Se escribe entre dos barras verticales, como el valor absoluto: $|z|$. Para calcularlo, usas el Teorema de Pitágoras con la parte real ($a$) y la parte imaginaria ($b$): $|z| = \sqrt{a^2 + b^2}$. Por ejemplo, para $z = 3 + 4i$, su módulo es $|z| = \sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$. El módulo SIEMPRE es un número real positivo o cero.
explicacion_formal: |
  ### Definición formal
  El **módulo (o valor absoluto)** de un número complejo $z = a + bi \in \mathbb{C}$ es la función $| \cdot |: \mathbb{C} \to \mathbb{R}^+_0$ definida por la distancia euclidiana:
  $$|z| = \sqrt{a^2 + b^2} \quad (a, b \in \mathbb{R})$$

  ### Propiedades del módulo
  Para cualesquiera números complejos $z, z_1, z_2 \in \mathbb{C}$:
  1. **No negatividad**: $|z| \ge 0$, y $|z| = 0 \iff z = 0$.
  2. **Igualdad con el conjugado y el opuesto**: $|z| = |\bar{z}| = |-z| = |-\bar{z}|$.
  3. **Relación con el producto del conjugado**: $|z|^2 = z \cdot \bar{z} \implies |z| = \sqrt{z \cdot \bar{z}}$.
  4. **Multiplicatividad**: $|z_1 \cdot z_2| = |z_1| \cdot |z_2|$.
  5. **Divisibilidad**: $\left|\frac{z_1}{z_2}\right| = \frac{|z_1|}{|z_2|} \quad (z_2 \neq 0)$.
  6. **Desigualdad triangular**: $|z_1 + z_2| \le |z_1| + |z_2|$.

  ### Síntesis didáctica
  - Interpretación geométrica: Longitud del vector de posición que une el origen $(0, 0)$ con el punto $(a, b)$.
  - Naturaleza del resultado: Siempre devuelve un **número real no negativo escalar** $|z| \in \mathbb{R}^+_0$.
definiciones_clave: |
  - **Módulo $|z|$**: Distancia euclidiana desde el origen $(0,0)$ al afijo $(a, b)$ expresada por la raíz $\sqrt{a^2 + b^2}$.
  - **Desigualdad triangular**: Propiedad que establece que la longitud de la suma de dos complejos no supera la suma de sus módulos.
  - **Norma euclidiana**: Medida de la longitud vectorial en el plano complejo bidimensional.
propiedades_relaciones: |
  - **Ecuación del círculo en $\mathbb{C}$**: La expresión $|z - z_0| = r$ representa el conjunto de todos los complejos que forman una circunferencia de centro $z_0$ y radio $r > 0$.
  - **Módulo de número real puro**: Si $b = 0 \implies |z| = \sqrt{a^2 + 0^2} = |a|$ (coincide exactamente con el valor absoluto de un número real).
ejemplo_guiado:
  enunciado: 'Calcula el módulo exacto del número complejo $z = -5 + 12i$.'
  pasos:
    - 'Paso 1: Identificamos la parte real $a = -5$ y la parte imaginaria $b = 12$.'
    - 'Paso 2: Elevamos ambas componentes escalares al cuadrado: $a^2 = (-5)^2 = 25$ y $b^2 = (12)^2 = 144$.'
    - 'Paso 3: Sumamos los cuadrados obtenidos dentro de la raíz cuadrada real: $a^2 + b^2 = 25 + 144 = 169$.'
    - 'Paso 4: Extraemos la raíz cuadrada positiva final para obtener el módulo: $|z| = \sqrt{169} = 13$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué fórmula se utiliza para calcular el módulo o distancia $|z|$ de un número complejo $z = a + bi$?'
    choices:
      - {text: '$|z| = \sqrt{a^2 + b^2}$, aplicando la raíz de la suma de los cuadrados de sus componentes reales', is_correct: true}
      - {text: '$|z| = a + b$, sumando directamente sus componentes', is_correct: false}
      - {text: '$|z| = \sqrt{a^2 - b^2}$, restando los cuadrados', is_correct: false}
      - {text: '$|z| = a^2 + b^2 \cdot i$, manteniendo la unidad imaginaria', is_correct: false}
    explanation: 'La alternativa correcta es ''$|z| = \sqrt{a^2 + b^2}$, aplicando la raíz de la suma de los cuadrados de sus componentes reales''. Por Teorema de Pitágoras en el plano complejo, $|z| = \sqrt{a^2 + b^2}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor del módulo $|z|$ para el número complejo $z = 6 - 8i$?'
    choices:
      - {text: '$10$, pues $\sqrt{6^2 + (-8)^2} = \sqrt{36 + 64} = \sqrt{100} = 10$', is_correct: true}
      - {text: '$-2$, restando los coeficientes', is_correct: false}
      - {text: '$\sqrt{28}$, restando los cuadrados', is_correct: false}
      - {text: '$14$, sumando $6 + 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$10$, pues $\sqrt{6^2 + (-8)^2} = \sqrt{36 + 64} = \sqrt{100} = 10$''. Elevamos al cuadrado ambas componentes, sumamos 100 y extraemos la raíz.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$ del número complejo $z = a + bi$.'
  - 'Paso 2: Elevar al cuadrado de forma independiente ambos números escalares: $a^2$ y $b^2$ (ambos darán resultados $\ge 0$).'
  - 'Paso 3: Sumar los dos valores cuadráticos: $a^2 + b^2$.'
  - 'Paso 4: Extraer la raíz cuadrada principal del resultado obteniendo $|z| = \sqrt{a^2 + b^2}$.'
errores_correccion: |
  - **Error 1:** Incluir la letra $i$ al elevar al cuadrado la parte imaginaria dentro de la raíz (ej: escribir $|z| = \sqrt{a^2 + (bi)^2} = \sqrt{a^2 - b^2}$). **Cómo corregirlo:** La fórmula utiliza el **coeficiente escalar real** $b$; jamás se incluye la unidad $i$. Se debe calcular **siempre como una suma de cuadrados positivos**: $\sqrt{a^2 + b^2}$.
  - **Error 2:** Asignar un módulo negativo a un número complejo que tiene componentes negativas. **Cómo corregirlo:** El módulo representa una **distancia física** en el plano y por definición es **siempre un número real mayor o igual a cero** ($|z| \ge 0$).
ejemplos:
  - titulo: 'Módulo de trinomio pitagórico'
    enunciado: '¿El módulo del complejo $z = 3 + 4i$ es igual a $5$?'
    alternativas:
      - 'Sí, pues $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = 5$'
      - 'No, es igual a 7'
      - 'No, es igual a 25'
    respuesta: 'Sí, pues $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = 5$'
    solucion_pasos:
      - '1. Elevamos al cuadrado: $3^2 = 9$ y $4^2 = 16$.'
      - '2. Sumamos y extraemos raíz: $\sqrt{9+16} = \sqrt{25} = 5$.'
  - titulo: 'Módulo de un número real negativo'
    enunciado: '¿El módulo del número complejo real $z = -9$ es igual a $9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{(-9)^2 + 0^2} = \sqrt{81} = 9$.'
  - titulo: 'Módulo de un imaginario puro'
    enunciado: '¿El módulo del complejo $z = -7i$ equivale a $7$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{0^2 + (-7)^2} = \sqrt{49} = 7$.'
  - titulo: 'Módulo del producto de complejos'
    enunciado: 'Si $|z_1| = 3$ y $|z_2| = 4$, ¿el módulo de su producto $|z_1 \cdot z_2|$ es igual a $12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad multiplicativa $|z_1 \cdot z_2| = |z_1| \cdot |z_2| = 3 \cdot 4 = 12$.'
errores_frecuentes:
  - 'Elevar al cuadrado la unidad imaginaria $i$ dentro de la fórmula del módulo obteniendo una resta de cuadrados.'
  - 'Obtener valores negativos para el módulo cuando la parte real o imaginaria son negativas.'
  - 'Sumar los coeficientes $a + b$ directamente sin elevarlos al cuadrado ni aplicar la raíz.'
  - 'Mantener la letra $i$ en el resultado final del módulo del número complejo.'
  - 'La fórmula del módulo $|z|$ se calcula exactamente igual que el producto por el conjugado mediante $a^2 + b^2$ sin extraer raíz.'
afirmaciones_verdaderas:
  - 'El módulo de un número complejo $z = a + bi$ es la distancia euclidiana real no negativa desde el origen hasta su afijo en el plano, calculada por $|z| = \sqrt{a^2 + b^2}$.'
  - 'El módulo de cualquier número complejo es igual al módulo de su conjugado y de su opuesto: $|z| = |\bar{z}| = |-z|$.'
al_terminar_debes_poder: 'Calcular el módulo $|z| = \sqrt{a^2 + b^2}$ de un número complejo e interpretarlo como su distancia al origen en el plano complejo.'
