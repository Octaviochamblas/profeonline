resumen_inicial: 'El módulo de un número complejo $z = a + bi$ es la distancia euclidiana
  desde el origen $(0,0)$ hasta el punto $(a,b)$ en el plano complejo: $|z| = \sqrt{a^2
  + b^2}$.'
explicacion_simple: 'El módulo mide qué tan largo es el vector del número complejo
  desde el centro del plano. Se calcula aplicando el Teorema de Pitágoras con las
  dos partes del número: $\sqrt{a^2 + b^2}$.'
explicacion_formal: 'Para todo $z = a + bi \in \mathbb{C}$, el **Módulo $|z|$** se
  define como el valor real no negativo:


  $$|z| = \sqrt{a^2 + b^2} = \sqrt{z \cdot \bar{z}}$$


  **Propiedades clave del módulo:**

  - $|z| \ge 0$ para todo $z$, y $|z| = 0 \iff z = 0$.

  - $|z| = |\bar{z}| = |-z|$.'
definiciones_clave: '- **Módulo $|z|$**: Distancia al origen $|z| = \sqrt{a^2 + b^2}
  \ge 0$.'
propiedades_relaciones: '- **Distancia Pitagórica**: $|z| = \sqrt{a^2 + b^2}$.'
ejemplo_guiado:
  enunciado: Calcule el módulo del número complejo $z = 5 - 12i$.
  pasos:
  - 'Paso 1: Identificar $a = 5$ y $b = -12$.'
  - 'Paso 2: Elevar ambos términos al cuadrado: $a^2 = 25$ y $b^2 = (-12)^2 = 144$.'
  - 'Paso 3: Sumar los cuadrados y extraer la raíz: $|z| = \sqrt{25 + 144} = \sqrt{169}
    = 13$.'
  - 'Conclusión: El módulo es $|z| = 13$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el módulo |z| de un número complejo
    z = a + bi?
  choices:
  - text: '|z| = sqrt(a^2 + b^2)'
    is_correct: true
  - text: '|z| = a + b'
    is_correct: false
  - text: '|z| = a^2 - b^2'
    is_correct: false
  - text: '|z| = sqrt(a + b)'
    is_correct: false
  explanation: La alternativa correcta es '|z| = sqrt(a^2 + b^2)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para z = 5 - 12i, ¿cuál fue el módulo |z| obtenido?
  choices:
  - text: 13 (porque sqrt(25 + 144) = 13)
    is_correct: true
  - text: '-7'
    is_correct: false
  - text: '169'
    is_correct: false
  - text: '17'
    is_correct: false
  explanation: La alternativa correcta es '13 (porque sqrt(25 + 144) = 13)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el módulo $|z| = \sqrt{a^2
  + b^2}$ de cualquier número complejo, interpretándolo como la distancia al origen
  en el plano complejo.
semantic_id: MAT.NUM.COMPLEJOS.MODULO
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.MODULO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
