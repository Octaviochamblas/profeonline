procedimiento:
- 'Paso 1: Sumar las tres cardinalidades individuales: $S_1 = |A| + |B| + |C|$.'
- 'Paso 2: Sumar las tres intersecciones de pares: $S_2 = |A \cap B| + |A \cap C| + |B \cap C|$.'
- 'Paso 3: Identificar el valor de la triple intersección: $S_3 = |A \cap B \cap C|$.'
- 'Paso 4: Aplicar la alternancia de signos: $|A \cup B \cup C| = S_1 - S_2 + S_3$.'
- 'Paso 5: Si la incógnita es la triple intersección o un conjunto individual, despejar algebraicamente.'
errores_correccion: '- **Error 1:** Restar la triple intersección al final en lugar de sumarla. **Cómo corregirlo:** Las intersecciones dobles restan al centro tres veces; para restaurarlo exactamente una vez se debe sumar $+|A \cap B \cap C|$.

  - **Error 2:** Sumar directamente los tres conjuntos individuales sin restar las parejas comunes. **Cómo corregirlo:** La adición simple genera sobreconteo en todas las áreas solapadas; la deducción de las dobles es obligatoria.

  '
ejemplos:
- titulo: Cálculo de unión triple básica
  enunciado: Si $S_1 = 60, S_2 = 24, S_3 = 4$, ¿cuánto vale $|A \cup B \cup C|$?
  alternativas:
  - $40$
  - $32$
  - $44$
  respuesta: $40$
  solucion_pasos:
  - 1. $|A \cup B \cup C| = 60 - 24 + 4 = 40$.
- titulo: Despeje de la triple intersección
  enunciado: Si $|A \cup B \cup C| = 50, S_1 = 70, S_2 = 25$, ¿cuánto vale $|A \cap B \cap C|$?
  respuesta: $5$
  solucion_pasos:
  - $50 = 70 - 25 + x \implies 50 = 45 + x \implies x = 5$.
  alternativas:
  - texto: $5$
