semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.DIAMETRO_DOBLE_RADIO
resumen_inicial: La relación fundamental entre el diámetro y el radio establece que d = 2r y, recíprocamente, r = d / 2.
explicacion_simple: 'La relación más famosa de toda la geometría circular es: **el diámetro mide el doble del radio**, o dicho al revés, **el radio mide la mitad del diámetro**.


  Si tienes un compás abierto a 4 cm, estás fijando un radio de $r = 4\text{ cm}$. El círculo resultante tendrá de lado a lado un diámetro de $d = 2 \times 4 = 8\text{ cm}$. Tener clarísima esta regla te salvará de muchos errores en las fórmulas: el perímetro se puede escribir como **$P = 2\pi r = \pi d$**, pero para el área debes tener mucho cuidado: si usas el diámetro, la fórmula es **$A = \frac{\pi d^2}{4}$**, ¡porque el radio al cuadrado es $(d/2)^2 = d^2/4$!


  ![Relación d = 2r](/static/img/nodos/relacion-entre-diametro-y-radio-como-d-2r-intro.svg)

  '
explicacion_formal: '### Teorema métrico de la colinealidad radial

  Sea $\mathcal{C}(O, r)$ una circunferencia. Todo diámetro $\overline{AB}$ contiene al centro $O$ como punto interior entre $A$ y $B$. Dado que los segmentos $\overline{OA}$ y $\overline{OB}$ son radios colineales opuestos:

  $$\text{long}(AB) = \text{long}(OA) + \text{long}(OB) = r + r = 2r$$

  Por lo tanto, se establece la equivalencia lineal biyectiva:

  $$d = 2r \iff r = \frac{d}{2}$$


  ### Transformación de fórmulas fundamentales

  1. **Perímetro en función del diámetro:**

  $$P = 2\pi r = 2\pi \left(\frac{d}{2}\right) = \pi d$$

  De aquí se desprende la definición histórica de $\pi$ como la razón constante entre el perímetro y el diámetro: $\pi = \frac{P}{d}$.


  2. **Área en función del diámetro:**

  $$A = \pi r^2 = \pi \left(\frac{d}{2}\right)^2 = \frac{\pi d^2}{4}$$

  Nótese rigurosamente que el denominador es $4$ y no $2$, debido a la elevación al cuadrado del cociente.


  > **Complemento didáctico:** La trampa reina de la PAES es darte el diámetro (ej. ''un plato de $20\text{ cm}$ de diámetro'') y pedirte el área. El error automático es hacer $\pi \cdot 20^2 = 400\pi$. ¡MAL! Lo primero que debes hacer SIEMPRE es dividir entre 2 para sacar el radio: $r = 10\text{ cm}$, y luego $A = \pi \cdot 10^2 = 100\pi\text{ cm}^2$.

  '
definiciones_clave: '- **Relación lineal $d = 2r$**: Proporción constante donde el diámetro duplica al radio.

  - **Constante Pi ($\pi$)**: Razón geométrica invariable dada por $\pi = \frac{P}{d} \approx 3{,}14159...$

  - **Cuarto de Pi en el área**: Coeficiente $\frac{\pi}{4}$ que relaciona el área con el cuadrado del diámetro.

  '
propiedades_relaciones: '- **Crecimiento cuadrático del área vs lineal del diámetro**: Duplicar el diámetro duplica el perímetro, pero cuadruplica el área.

  - **Despeje rápido de radios**: Si el diámetro es $14\text{ cm}$, el radio es directamente $7\text{ cm}$.

  - **Escala en figuras semejantes**: La razón entre radios es exactamente idéntica a la razón entre diámetros: $\frac{r_1}{r_2} = \frac{d_1}{d_2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de d = 2r](/static/img/nodos/relacion-entre-diametro-y-radio-como-d-2r-ejemplos.svg)


    Un estanque circular tiene un diámetro de $d = 14\text{ m}$. Calcula su perímetro y su área superficial exacta expresados en términos de $\pi$.'
  pasos:
  - 'Paso 1: Calcular el perímetro usando la relación directa $P = \pi d$: $P = 14\pi\text{ m}$.'
  - 'Paso 2: Calcular el radio necesario para el área dividiendo entre 2: $r = \frac{d}{2} = \frac{14}{2} = 7\text{ m}$.'
  - 'Paso 3: Aplicar la fórmula del área $A = \pi r^2$: $A = \pi (7)^2 = 49\pi\text{ m}^2$.'
  - 'Paso 4: Verificación con la fórmula directa en $d$: $A = \frac{\pi d^2}{4} = \frac{\pi (14)^2}{4} = \frac{196\pi}{4} = 49\pi\text{ m}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula correcta para calcular el área de un círculo directamente a partir de su diámetro d?
  choices:
  - text: A = (pi · d²) / 4.
    is_correct: true
  - text: A = pi · d².
    is_correct: false
  - text: A = (pi · d²) / 2.
    is_correct: false
  - text: A = 2 · pi · d.
    is_correct: false
  explanation: La alternativa correcta es 'A = (pi · d²) / 4.' Como $r = d / 2$, al elevar al cuadrado resulta $(d/2)^2 = d^2 / 4$, quedando $A = \frac{\pi d^2}{4}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el diámetro de una rueda aumenta de 10 cm a 20 cm (se duplica), ¿en qué factor aumenta su área?
  choices:
  - text: Se multiplica por 4.
    is_correct: true
  - text: Se duplica (se multiplica por 2).
    is_correct: false
  - text: Se multiplica por 8.
    is_correct: false
  - text: Permanece igual.
    is_correct: false
  explanation: 'La alternativa correcta es ''Se multiplica por 4.'' Al depender del cuadrado de la dimensión lineal: $2^2 = 4$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si el enunciado entrega el radio o el diámetro.

  2. Convertir inmediatamente entre ambas magnitudes usando $d = 2r$ o $r = d / 2$.

  3. Para el perímetro, aplicar indistintamente $P = 2\pi r$ o $P = \pi d$.

  4. Para el área, asegurar utilizar el radio al cuadrado: $A = \pi r^2$ (o $\frac{\pi d^2}{4}$).

  '
errores_correccion: '- **Error común 1:** Introducir directamente el diámetro en $\pi r^2$ resultando $\pi d^2$. **Corrección:** Esto produce un área 4 veces mayor a la real; debes dividir primero entre 2.

  - **Error común 2:** Creer que duplicar el diámetro duplica el área. **Corrección:** El perímetro se duplica, pero el área se cuadruplica ($2^2 = 4$).

  '
ejemplos:
- tipo: A
  titulo: Conversión directa de diámetro a radio
  enunciado: Si una pista circular tiene un diámetro de $50\text{ m}$, ¿cuánto mide su radio?
  alternativas:
  - text: $25\text{ m}$.
    is_correct: true
  - text: $100\text{ m}$.
    is_correct: false
  - text: $50\text{ m}$.
    is_correct: false
  - text: $12{,}5\text{ m}$.
    is_correct: false
  explicacion: $r = d / 2 = 50 / 2 = 25\text{ m}$.
- tipo: B
  titulo: Razón de Pi
  enunciado: ¿Es la constante Pi (π) igual al cociente entre el perímetro de una circunferencia y su diámetro?
  respuesta: Sí
  explicacion: Sí. Por definición de la constante matemática, $\pi = \frac{P}{d} = \frac{2\pi r}{2r}$.
errores_frecuentes:
- '''Confundir el valor del radio con el del diámetro en fórmulas de áreas.'''
- '''Dividir entre 2 el área creyendo erróneamente que $A = (\pi d^2) / 2$.'''
- '''Olvidar que $d = 2r$ es una relación lineal estricta.'''
afirmaciones_verdaderas:
- '''El diámetro mide el doble de la longitud del radio ($d = 2r$).'''
- '''El perímetro de cualquier circunferencia equivale al producto de $\pi$ por su diámetro ($P = \pi d$).'''
- '''El área de un círculo en función de su diámetro es $A = \frac{\pi d^2}{4}$.'''
al_terminar_debes_poder: '**QUÉ:** Convertir fluidamente entre radio y diámetro y calcular perímetros y áreas circulares sin errores de escala.


  **CÓMO:** Utilizando $d = 2r$, $P = \pi d$ y $A = \frac{\pi d^2}{4}$.


  ![Síntesis de d = 2r](/static/img/nodos/relacion-entre-diametro-y-radio-como-d-2r-resumen.svg)

  '
