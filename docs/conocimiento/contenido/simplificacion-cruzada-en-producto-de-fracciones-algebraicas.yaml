semantic_id: MAT.ALG.FRACCIONES_MULT.SIMPLIFICACION_CRUZADA
resumen_inicial: En la multiplicación de fracciones algebraicas se puede simplificar
  cualquier factor del numerador con cualquier factor del denominador.
explicacion_simple: 'Una propiedad fantástica de la multiplicación de fracciones es
  la simplificación cruzada:

  No estás obligado a simplificar únicamente el numerador y denominador de la MISMA
  fracción.

  Puedes cancelar un factor situado en el numerador de la primera fracción con un
  factor idéntico situado en el denominador de la segunda fracción (o viceversa),
  porque al final todos los numeradores se multiplican juntos y todos los denominadores
  se multiplican juntos.'
explicacion_formal: 'Dada la propiedad asociativa y conmutativa de la multiplicación
  sobre los números reales y polinomios, la **simplificación cruzada** se justifica
  formalmente como:


  $$\frac{A(x)}{B(x)} \cdot \frac{C(x)}{D(x)} = \frac{A(x) \cdot C(x)}{B(x) \cdot
  D(x)} = \frac{A(x) \cdot C(x)}{D(x) \cdot B(x)} = \frac{A(x)}{D(x)} \cdot \frac{C(x)}{B(x)}$$


  **Desglose de la fórmula:**

  - La conmutatividad de los denominadores $B(x) \cdot D(x) = D(x) \cdot B(x)$ permite
  reagrupar $A(x)$ con $D(x)$ y $C(x)$ con $B(x)$, autorizando la simplificación en
  diagonal entre fracciones distintas.'
definiciones_clave: '- **Simplificación cruzada**: Cancelación de factores comunes
  entre el numerador de una fracción y el denominador de otra fracción en un producto.

  - **Reagrupación de denominadores**: Cambio en el orden de los factores del denominador
  global permitido por la conmutatividad.'
propiedades_relaciones: '- **Cancelación diagonal**: Válida en MULTIPLICACIÓN. Totalmente
  PROHIBIDA en suma o resta de fracciones.

  - **Invarianza del producto**: El resultado final reducido es idéntico sin importar
  el orden en que se apliquen las simplificaciones cruzadas o directas.'
ejemplo_guiado:
  enunciado: Aplica simplificación cruzada a la multiplicación $\frac{x - 5}{3x +
    6} \cdot \frac{x + 2}{x - 5}$ y evalúa el resultado para $x = 4$.
  pasos:
  - 'Paso 1: Factorizar el denominador de la primera fracción $3x + 6 = 3(x + 2)$.Paso
    2: Escribir el producto: $\frac{x - 5}{3(x + 2)} \cdot \frac{x + 2}{x - 5}$.Paso
    3: Aplicar simplificación cruzada: cancelar el factor $(x - 5)$ del primer numerador
    con el $(x - 5)$ del segundo denominador.Paso 4: Cancelar el factor $(x + 2)$
    del segundo numerador con el $(x + 2)$ del primer denominador.Paso 5: El resultado
    es $\frac{1}{3}$ (una constante independiente de $x$, para $x \neq 5$ y $x \neq
    -2$).Paso 6: Para $x = 4$, el valor evaluado es $\frac{1}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es matemáticamente válida la simplificación cruzada (en diagonal)
    en el producto de dos fracciones algebraicas?
  choices:
  - text: Porque la conmutatividad de la multiplicación permite reordenar los denominadores
      bajo una misma barra.
    is_correct: true
  - text: Porque las fracciones algebraicas se suman antes de simplificar.
    is_correct: false
  - text: Porque la multiplicación invierte automáticamente los signos de los denominadores.
    is_correct: false
  - text: Solo es válida si los coeficientes numéricos son iguales a 1.
    is_correct: false
  explanation: La alternativa correcta es 'Porque la conmutatividad de la multiplicación
    permite reordenar los denominadores bajo una misma barra.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar simplificación cruzada en $\frac{x - 5}{3(x + 2)} \cdot \frac{x
    + 2}{x - 5}$, ¿cuál es el resultado simplificado?
  choices:
  - text: $\frac{1}{3}$
    is_correct: true
  - text: $3$
    is_correct: false
  - text: $\frac{x + 2}{3}$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{3}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente todos los numeradores y denominadores.'
- 'Paso 2: Comparar el numerador de la primera fracción con el denominador de la segunda
  fracción.'
- 'Paso 3: Cancelar los factores comunes que aparezcan en esa diagonal cruzada.'
- 'Paso 4: Repetir la comparación y cancelación para la otra diagonal.'
- 'Paso 5: Multiplicar los factores sobrantes para escribir el producto final.'
errores_correccion: '- **Error común:** Intentar hacer simplificación cruzada en la
  SUMA o RESTA de fracciones (ejemplo en $\frac{A}{B} + \frac{C}{A}$ tachar las $A$).

  - **Cómo corregirlo:** La simplificación cruzada solo está permitida en la MULTIPLICACIÓN.
  Jamás la apliques cuando hay signos de suma o resta entre las fracciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Es válida la regla?
  respuesta: Sí
  solucion_pasos:
  - Sí, por propiedad.
- titulo: ¿Se pueden cancelar sumandos?
  respuesta: 'No'
  solucion_pasos:
  - No, solo factores.
errores_frecuentes:
- Multiplicar en cruz las fracciones al realizar un producto.
- Sumar los denominadores en lugar de multiplicarlos.
- Cancelar términos sumandos en lugar de factores multiplicativos.
- Olvidar declarar las restricciones de los denominadores originales.
- Desarrollar polinomios largos antes de intentar simplificar.
afirmaciones_verdaderas:
- En la multiplicación de fracciones algebraicas se multiplican numeradores entre
  sí y denominadores entre sí.
- La simplificación previa mediante factorización evita trabajar con polinomios de
  grado innecesariamente alto.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular y simplificar productos
  de fracciones algebraicas expresando el resultado en su forma irreducible.
