semantic_id: MAT.ALG.FRACCIONES_MULT.SIMPLIFICACION_CRUZADA
resumen_inicial: 'Simplificación cruzada en producto de fracciones algebraicas: concepto,
  reglas operativas y simplificación en Multiplicación de fracciones algebraicas.'
explicacion_simple: Una vez que todo está factorizado, comienza el juego de emparejar.
  Cualquier factor idéntico que esté arriba puede cancelar a uno que esté abajo, no
  importa en qué fracción estén.
explicacion_formal: '### Definición formal


  Es como si ya fueran una sola fracción, por lo tanto cualquier factor arriba cancela
  a uno abajo.


  ### Desarrollo didáctico


  La simplificación cruzada es tu herramienta útil para evitar cálculos extensos.
  Se basa en una propiedad adecuado de la multiplicación de fracciones: como todos
  los numeradores terminan multiplicándose juntos arriba y los denominadores abajo,
  **puedes tachar cualquier factor de arriba con cualquier factor igual de abajo**,
  sin importar si estaban originalmente en la misma fracción o en fracciones cruzadas.


  Ejemplo:

  Tienes $\frac{(x-2)}{x+1} \cdot \frac{x+1}{(x-2)(x+3)}$.


  En lugar de multiplicar todo, observa:

  - Tienes un $(x-2)$ arriba (en la 1ra) y uno abajo (en la 2da). Se tachan.

  - Tienes un $(x+1)$ abajo (en la 1ra) y uno arriba (en la 2da). Se tachan.


  ¿Qué sobrevivió a la masacre? Arriba se canceló todo (queda un 1). Abajo sobrevivió
  $(x+3)$.

  Resultado final inmediato: $\frac{1}{x+3}$.'
definiciones_clave: '- **Simplificación cruzada en producto de fracciones algebraicas**:
