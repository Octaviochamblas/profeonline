semantic_id: MAT.ALG.FRACCIONES_MULT.SIMPLIFICACION_CRUZADA
resumen_inicial: 'La simplificación cruzada en producto de fracciones algebraicas consiste en cancelar o reducir factores idénticos o compatibles situados entre el numerador de una fracción y el denominador de otra.'
explicacion_simple: |
  En la multiplicación de fracciones (ej: $\frac{A}{B} \cdot \frac{C}{D}$), existe una superpropiedad matemática:
  - **CANCELACIÓN CRUZADA (DIAGONAL)**:
    $$\mathbf{\text{Puedes simplificar CUALQUIER FACTOR de CUALQUIER NUMERADOR con CUALQUIER DENOMINADOR.}}$$
  - **¿Cómo funciona?**:
    - Si tienes: $\frac{x - 3}{y + 2} \cdot \frac{5}{x - 3}$.
    - El factor $(x - 3)$ está en el **numerador de la 1ª fracción** y en el **denominador de la 2ª fracción**.
    - ¡Puedes tacharlos (cancelarlos en cruz) directamente!:
      $$\frac{\cancel{x - 3}}{y + 2} \cdot \frac{5}{\cancel{x - 3}} = \mathbf{\frac{5}{y + 2}}$$
  - **REGLA DE ORO DE UBICACIÓN**:
    - SÓLO puedes simplificar si **UN FACTOR ESTÁ ARRIBA** y **EL OTRO FACTOR ESTÁ ABAJO**.
    - NUNCA puedes simplificar dos factores que estén los dos arriba o los dos abajo.
explicacion_formal: |
  ### Definición formal
  Sea la multiplicación de fracciones algebraicas $f(x) = \frac{P_1(x)}{Q_1(x)} \cdot \frac{P_2(x)}{Q_2(x)}$. Debido a la conmutatividad de la multiplicación en el anillo de polinomios $\mathbb{K}[x]$, se cumple la reordenación estructural:

  $$f(x) = \frac{P_1(x) \cdot P_2(x)}{Q_1(x) \cdot Q_2(x)} = \frac{P_1(x) \cdot P_2(x)}{Q_2(x) \cdot Q_1(x)} = \frac{P_1(x)}{Q_2(x)} \cdot \frac{P_2(x)}{Q_1(x)}$$

  ### Teorema de Cancelación Mixta / Cruzada
  Si $D(x) = \operatorname{MCD}(P_1, Q_2)$, con $P_1(x) = D(x) A(x)$ y $Q_2(x) = D(x) B(x)$, entonces:

  $$\frac{D(x) A(x)}{Q_1(x)} \cdot \frac{P_2(x)}{D(x) B(x)} = \frac{A(x) P_2(x)}{Q_1(x) B(x)} \cdot \mathbf{\frac{D(x)}{D(x)}} = \frac{A(x) P_2(x)}{Q_1(x) B(x)}$$

  con la restricción $D(x) \neq 0$.

  ### Síntesis didáctica
  La conmutatividad del producto de polinomios permite cancelar o simplificar factores comunes situados en diagonal (numerador de una fracción con el denominador de otra).
definiciones_clave: |
  - **Simplificación cruzada / diagonal**: Cancelación de factores o paréntesis comunes entre numeradores y denominadores de fracciones distintas en un producto.
  - **Conmutatividad de denominadores**: Propiedad $Q_1 \cdot Q_2 = Q_2 \cdot Q_1$ que justifica matemáticamente la simplificación en diagonal.
  - **Factores en posiciones opuestas**: Condición necesaria que exige que un factor esté en el nivel superior y el otro en el inferior.
propiedades_relaciones: |
  - **Invarianza por reordenamiento**: El orden en que se cancelan los factores en cruz no altera el producto simplificado final.
ejemplo_guiado:
  enunciado: 'Aplica la simplificación cruzada para calcular el producto $\frac{3x^2}{x + 4} \cdot \frac{x^2 - 16}{9x}$.'
  pasos:
    - 'Paso 1: Factorizamos todos los componentes:
       - Numerador 1: $3x^2$.
       - Denominador 1: $(x + 4)$.
       - Numerador 2: $x^2 - 16 = (x - 4)(x + 4)$.
       - Denominador 2: $9x$.'
    - 'Paso 2: Escribimos el producto con los factores descompuestos:
       $\frac{3x^2}{x + 4} \cdot \frac{(x - 4)(x + 4)}{9x}$.'
    - 'Paso 3: **SIMPLIFICAMOS EN CRUZ (diagonal)**:
       - Cancelamos $(x + 4)$ del denominador 1 con $(x + 4)$ del numerador 2.
       - Simplificamos $\frac{3x^2}{9x}$ en cruz (numerador 1 con denominador 2): $\frac{3x^2 \div 3x}{9x \div 3x} = \mathbf{\frac{x}{3}}$.'
    - 'Paso 4: Multiplicamos los factores sobrevivientes:
       $\frac{x \cdot (x - 4)}{1 \cdot 3} = \mathbf{\frac{x(x - 4)}{3}}$.'
    - 'Conclusión: El producto simplificado es **$\frac{x(x - 4)}{3}$** con $x \neq -4$ y $x \neq 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el producto $\frac{x + 2}{5} \cdot \frac{10}{x + 2}$, ¿qué se obtiene al aplicar la simplificación cruzada?'
    choices:
      - {text: 'Se obtiene 2, porque $(x + 2)$ se cancela en cruz arriba y abajo, y $10 / 5 = 2$', is_correct: true}
      - {text: 'Se obtiene 5', is_correct: false}
      - {text: 'Se obtiene $\frac{x + 2}{5}$', is_correct: false}
      - {text: 'Se obtiene 10', is_correct: false}
    explanation: 'La alternativa correcta es ''Se obtiene 2, porque $(x + 2)$ se cancela en cruz arriba y abajo, y $10 / 5 = 2$''. Cancelación cruzada de $(x+2)$ y simplificación numérica $10/5 = 2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Es posible simplificar en cruz dos factores que se encuentran ambos en los numeradores (arriba)?'
    choices:
      - {text: 'No, la simplificación exige estrictamente que un factor esté en un numerador y el otro en un denominador', is_correct: true}
      - {text: 'Sí, siempre que sean del mismo grado', is_correct: false}
      - {text: 'Sí, si se multiplican por 2', is_correct: false}
      - {text: 'Solo si son monomios', is_correct: false}
    explanation: 'La alternativa correcta es ''No, la simplificación exige estrictamente que un factor esté en un numerador y el otro en un denominador''. Condición obligatoria de posición opuesta.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar completamente todos los numeradores y denominadores del producto.'
  - 'Paso 2: Buscar factores o coeficientes numéricos comunes entre el numerador de una fracción y el denominador de otra.'
  - 'Paso 3: Cancelar o simplificar los factores coincidentes dividiendo por su M.C.D.'
  - 'Paso 4: Multiplicar horizontalmente los factores restantes que no se hayan cancelado.'
errores_correccion: |
  - **Error 1:** Cancelar dos factores que se encuentran ambos en el numerador o ambos en el denominador (cancelar "en línea"). **Cómo corregirlo:** La simplificación **SÓLO ES VÁLIDA ENTRE UN FACTOR DEL NUMERADOR Y UN FACTOR DEL DENOMINADOR; NUNCA ENTRE DOS ELEMENTOS DEL MISMO NIVEL**.
  - **Error 2:** Realizar simplificación cruzada en sumas o restas de fracciones. **Cómo corregirlo:** La simplificación cruzada **ES UNA PROPIEDAD EXCLUSIVA DE LA MULTIPLICACIÓN DE FRACCIONES**.
ejemplos:
  - titulo: 'Monomios cruzados'
    enunciado: 'Para $\frac{x}{3} \cdot \frac{6}{y}$, ¿da $\frac{2x}{y}$ al simplificar $6/3 = 2$ en cruz?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $6$ arriba y $3$ abajo se reducen a $2/1$.'
  - titulo: 'Binomios cruzados'
    enunciado: 'En $\frac{a-b}{c} \cdot \frac{d}{a-b}$, ¿se cancela $(a-b)$ en cruz dando $\frac{d}{c}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(a-b)$ está arriba y abajo.'
  - titulo: 'Error en mismo nivel'
    enunciado: 'En $\frac{x}{2} \cdot \frac{x}{3}$, ¿se pueden simplificar las $x$ entre sí?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, ambas están en el numerador.'
  - titulo: 'Factores opuestos en cruz'
    enunciado: 'Para $\frac{x - y}{2} \cdot \frac{4}{y - x}$, ¿da $-2$ al simplificar opuestos y $4/2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(-1) \cdot 2 = -2$.'
errores_frecuentes:
  - 'Cancelar dos factores situados ambos en el numerador o ambos en el denominador.'
  - 'Aplicar la simplificación cruzada en sumas o restas de fracciones en lugar de productos.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Tachar términos que están sumando dentro de los paréntesis al realizar la cancelación cruzada.'
  - 'El coeficiente 1 no es escrito cuando un numerador o denominador se cancela por completo.'
afirmaciones_verdaderas:
  - 'La simplificación cruzada permite cancelar factores comunes entre el numerador de una fracción y el denominador de otra.'
  - 'Solo se pueden simplificar elementos ubicados en niveles opuestos (uno en el numerador y otro en el denominador).'
al_terminar_debes_ponder: 'Aplicar la simplificación cruzada en productos de fracciones algebraicas reduciendo factores diagonales.'
