semantic_id: MAT.ALG.FRACCIONES_MULT.SIMPLIFICACION_CRUZADA
resumen_inicial: La simplificación cruzada en producto de fracciones algebraicas consiste en cancelar o reducir factores idénticos o compatibles situados entre el numerador de una fracción y el denominador de otra.
explicacion_simple: |
  En la multiplicación de fracciones (por ejemplo: $\frac{A}{B} \cdot \frac{C}{D}$), existe una propiedad fundamental:

  **Cancelación cruzada (diagonal):** es posible simplificar cualquier factor común situado en un numerador con cualquier factor idéntico situado en un denominador, independientemente de la fracción a la que pertenezcan.

  Por ejemplo:
  $$\frac{x - 3}{y + 2} \cdot \frac{5}{x - 3}$$

  El factor $(x - 3)$ está en el numerador de la primera fracción y en el denominador de la segunda. Podemos cancelarlos directamente:
  $$\frac{\cancel{x - 3}}{y + 2} \cdot \frac{5}{\cancel{x - 3}} = \frac{5}{y + 2}$$

  **Regla de posición:** la simplificación exige estrictamente que un factor esté arriba (numerador) y el otro abajo (denominador). Jamás se simplifican dos factores que están en el mismo nivel.
explicacion_formal: |
  ### Definición formal
  Sea la multiplicación de fracciones algebraicas $f(x) = \frac{P_1(x)}{Q_1(x)} \cdot \frac{P_2(x)}{Q_2(x)}$. Debido a la conmutatividad del producto de polinomios en $\mathbb{R}[x]$, se verifica la reordenación estructural:

  $$f(x) = \frac{P_1(x) \cdot P_2(x)}{Q_1(x) \cdot Q_2(x)} = \frac{P_1(x) \cdot P_2(x)}{Q_2(x) \cdot Q_1(x)} = \frac{P_1(x)}{Q_2(x)} \cdot \frac{P_2(x)}{Q_1(x)}$$

  ### Teorema de Cancelación Cruzada
  Si $D(x) = \operatorname{MCD}(P_1, Q_2)$, con $P_1(x) = D(x) A(x)$ y $Q_2(x) = D(x) B(x)$, entonces para $D(x) \neq 0$:

  $$\frac{D(x) A(x)}{Q_1(x)} \cdot \frac{P_2(x)}{D(x) B(x)} = \frac{A(x) P_2(x)}{Q_1(x) B(x)} \cdot \frac{D(x)}{D(x)} = \frac{A(x) P_2(x)}{Q_1(x) B(x)}$$

  ### Síntesis didáctica
  La conmutatividad del producto de polinomios permite cancelar o simplificar factores comunes situados en diagonal (numerador de una fracción con el denominador de otra).
definiciones_clave: |
  - **Simplificación cruzada / diagonal**: Cancelación de factores o paréntesis comunes entre numeradores y denominadores de fracciones distintas en un producto.
  - **Conmutatividad de denominadores**: Propiedad $Q_1 \cdot Q_2 = Q_2 \cdot Q_1$ que justifica matemáticamente la simplificación en diagonal.
  - **Factores en posiciones opuestas**: Condición necesaria que exige que un factor esté en el nivel superior y el otro en el inferior.
propiedades_relaciones: |
  - **Invarianza por reordenamiento**: El orden en que se cancelan los factores en cruz no altera el producto simplificado final.
  - **Preservación de restricciones**: Al cancelar $(x - a)$ en cruz, la restricción $x \neq a$ se mantiene activa en el dominio real.
ejemplo_guiado:
  enunciado: 'Aplica la simplificación cruzada para calcular el producto $\frac{3x^2}{x + 4} \cdot \frac{x^2 - 16}{9x}$.'
  pasos:
    - 'Paso 1: Factorizar todos los componentes: $x^2 - 16 = (x - 4)(x + 4)$.'
    - 'Paso 2: Escribir el producto con los factores descompuestos: $\frac{3x^2}{x + 4} \cdot \frac{(x - 4)(x + 4)}{9x}$.'
    - 'Paso 3: Cancelar en cruz el factor $(x + 4)$ del denominador 1 con $(x + 4)$ del numerador 2.'
    - 'Paso 4: Simplificar en cruz los coeficientes numéricos y las variables monómicas $\frac{3x^2}{9x} = \frac{x}{3}$.'
    - 'Paso 5: Multiplicar los factores sobrevivientes obteniendo el resultado simplificado $\frac{x(x - 4)}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el producto $\frac{x + 2}{5} \cdot \frac{10}{x + 2}$, ¿qué resultado se obtiene tras aplicar la simplificación cruzada?'
    choices:
      - {text: '$2$', is_correct: true}
      - {text: '$5$', is_correct: false}
      - {text: '$\frac{x + 2}{5}$', is_correct: false}
      - {text: '$10$', is_correct: false}
    explanation: 'La alternativa correcta es ''$2$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Es posible simplificar en cruz dos factores que se encuentran ambos en los numeradores?'
    choices:
      - {text: 'No, la simplificación exige estrictamente que un factor esté en un numerador y el otro en un denominador', is_correct: true}
      - {text: 'Sí, siempre que sean del mismo grado', is_correct: false}
      - {text: 'Sí, si se multiplican por 2', is_correct: false}
      - {text: 'Solo si corresponden a monomios', is_correct: false}
    explanation: 'La alternativa correcta es ''No, la simplificación exige estrictamente que un factor esté en un numerador y el otro en un denominador''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar completamente todos los numeradores y denominadores del producto.'
  - 'Paso 2: Identificar factores o coeficientes numéricos comunes entre el numerador de una fracción y el denominador de otra.'
  - 'Paso 3: Cancelar o simplificar los factores coincidentes dividiendo por su M.C.D.'
  - 'Paso 4: Multiplicar horizontalmente los factores restantes que no se hayan cancelado.'
errores_correccion: |
  - **Error 1:** Cancelar dos factores que se encuentran ambos en el numerador o ambos en el denominador (cancelar "en línea"). **Cómo corregirlo:** La simplificación **SÓLO ES VÁLIDA ENTRE UN FACTOR DEL NUMERADOR Y UN FACTOR DEL DENOMINADOR; NUNCA ENTRE DOS ELEMENTOS DEL MISMO NIVEL**.
  - **Error 2:** Realizar simplificación cruzada en sumas o restas de fracciones. **Cómo corregirlo:** La simplificación cruzada **ES UNA PROPIEDAD EXCLUSIVA DE LA MULTIPLICACIÓN DE FRACCIONES**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Al simplificar en cruz la expresión $\frac{3x^2}{x + 4} \cdot \frac{(x - 4)(x + 4)}{9x}$, ¿cuál es el resultado simplificado?'
    alternativas:
      - '$\frac{x(x - 4)}{3}$'
      - '$\frac{x(x + 4)}{3}$'
      - '$\frac{x^2 - 16}{3x}$'
    respuesta: '$\frac{x(x - 4)}{3}$'
    solucion_pasos:
      - '1. Cancelar $(x + 4)$ del denominador 1 con $(x + 4)$ del numerador 2.'
      - '2. Simplificar en cruz $\frac{3x^2}{9x} = \frac{x}{3}$.'
      - '3. Multiplicar factores restantes: $\frac{x(x - 4)}{3}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En el producto $\frac{a-b}{c} \cdot \frac{5c}{a-b}$, ¿qué valor se obtiene tras cancelar en cruz?'
    alternativas:
      - '$5$'
      - '$\frac{5}{c}$'
      - '$5(a-b)$'
    respuesta: '$5$'
    solucion_pasos:
      - '1. Cancelar $(a-b)$ del numerador 1 con $(a-b)$ del denominador 2.'
      - '2. Cancelar $c$ del denominador 1 con $c$ del numerador 2.'
      - '3. Resultado final: $5$.'
  - titulo: 'Error en mismo nivel'
    enunciado: 'En $\frac{x}{2} \cdot \frac{x}{3}$, ¿se pueden simplificar las variables $x$ entre sí?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, ambas están en el numerador y deben multiplicarse como $x^2$.'
  - titulo: 'Factores opuestos en cruz'
    enunciado: 'Para $\frac{x - y}{2} \cdot \frac{4}{y - x}$, ¿resulta $-2$ al simplificar opuestos y la constante $4/2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(x-y)/(y-x) = -1$ y $4/2 = 2$, dando producto $-2$.'
errores_frecuentes:
  - 'Cancelar dos factores situados ambos en el numerador o ambos en el denominador.'
  - 'Aplicar la simplificación cruzada en sumas o restas de fracciones en lugar de productos.'
  - 'Tachar términos que están sumando dentro de los paréntesis al realizar la cancelación cruzada.'
  - 'Omitir el coeficiente 1 cuando un numerador o denominador se cancela por completo.'
  - 'Intentar simplificar expresiones sin haber factorizado previamente todos los polinomios.'
afirmaciones_verdaderas:
  - 'La simplificación cruzada permite cancelar factores comunes entre el numerador de una fracción y el denominador de otra.'
  - 'Solo se pueden simplificar elementos ubicados en niveles opuestos (uno en el numerador y otro en el denominador).'
al_terminar_debes_poder: |
  QUÉ: Aplicar la simplificación cruzada en productos de fracciones algebraicas.
  CÓMO: Cancelar o dividir por su M.C.D. los factores y coeficientes comunes ubicados en diagonal entre numeradores y denominadores.
