  question: En el ejemplo guiado, ¿por qué $2\sqrt{5} - 7\sqrt{5}$ dio como resultado $-5\sqrt{5}$?
  choices:
  - text: Porque al restar los coeficientes $2 - 7$ se obtiene $-5$, manteniendo el radical $\sqrt{5}$
    is_correct: true
  - text: Porque las raíces no se pueden restar
    is_correct: false
  - text: Porque el $7$ cancela la raíz
    is_correct: false
  - text: Fue un error de signo
    is_correct: false
  explanation: La alternativa correcta es 'Porque al restar los coeficientes $2 - 7$ se obtiene $-5$, manteniendo el radical $\sqrt{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar cada radical extrayendo todos los factores posibles a su forma canónica.'
- 'Paso 2: Confirmar que los términos compartan idéntico índice y radicando base $\sqrt[n]{c}$.'
- 'Paso 3: Restar los coeficientes escalares $(p - q)$ y conservar la parte radical común.'
errores_correccion: "- **Error 1: Restar los radicandos dentro de la raíz ($\\sqrt{25} - \\sqrt{9} = \\sqrt{16} = 4$).** **Cómo corregirlo:** Evaluar cada término: $5 - 3 = 2 \neq 4$. ¡No restar radicandos!\n- **Error 2: Olvidar el coeficiente 1 implícito ($4\\sqrt{2} - \\sqrt{2} = 4$).** **Cómo corregirlo:** $\\sqrt{2}$ tiene coeficiente $1$: $(4 - 1)\\sqrt{2} = 3\\sqrt{2}$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $7\sqrt{3} - \sqrt{3}$?
  alternativas:
  - $6\sqrt{3}$
  - $7$
  - $6$
  respuesta: $6\sqrt{3}$
  solucion_pasos:
  - $(7 - 1)\sqrt{3} = 6\sqrt{3}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\sqrt{48} - \sqrt{27}$?
  alternativas:
  - $\sqrt{3}$
  - $\sqrt{21}$
  - $2\sqrt{3}$
  respuesta: $\sqrt{3}$
  solucion_pasos:
  - $4\sqrt{3} - 3\sqrt{3} = 1\sqrt{3} = \sqrt{3}$.
- titulo: ¿Es 3√2 - 5√2 igual a -2√2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3 - 5)\sqrt{2} = -2\sqrt{2}$.
  alternativas:
  - texto: Sí, 3 - 5 = -2 dando -2√2
    es_correcta: true
    retroalimentacion: ¡Correcto! Resta algebraica con coeficiente negativo.
  - texto: No, los coeficientes no pueden ser negativos
    es_correcta: false
    retroalimentacion: Incorrecto, los coeficientes en ℝ pueden ser negativos.
  - texto: No, es igual a 2√2
    es_correcta: false
    retroalimentacion: Incorrecto, $3 - 5 = -2$.
- titulo: ¿Es √100 - √64 igual a √36?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{100} - \sqrt{64} = 10 - 8 = 2$, mientras que $\sqrt{36} = 6$ ($2 \neq 6$).
  alternativas:
  - texto: No, 10 - 8 = 2 y √36 = 6 (2 ≠ 6)
    es_correcta: true
    retroalimentacion: ¡Correcto! Los radicandos nunca se restan.
  - texto: Sí, 100 - 64 = 36
    es_correcta: false
    retroalimentacion: Incorrecto, la radicación no es distributiva respecto a la resta.
  - texto: Sí, por propiedad de potencias
    es_correcta: false
    retroalimentacion: Incorrecto, la resta de raíces no permite fusionar radicandos.
errores_frecuentes:
- Restar los números dentro del radical.
- Olvidar restar el coeficiente 1 cuando el radical no lleva número escrito.
- Errores de signo al restar coeficientes mayores a menores.
- Intentar restar raíces no semejantes.
- Olvidar simplificar los radicales antes de realizar la resta.
afirmaciones_verdaderas:
- Para restar radicales semejantes se restan sus coeficientes y se mantiene el radical común.
- La radicación no es distributiva respecto a la sustracción ($\sqrt{a} - \sqrt{b} \neq \sqrt{a-b}$).
- Si dos términos idénticos se restan, el resultado es exactamente cero ($p\sqrt[n]{c} - p\sqrt[n]{c} = 0$).
al_terminar_debes_poder: '![Síntesis de sustracción de radicales](/static/img/nodos/sustraccion-de-radicales-semejantes-resumen.svg)


  QUÉ: Restar expresiones radicales mediante la identificación y reducción de términos semejantes.


  CÓMO: Simplificando cada radical a su forma canónica, agrupando los que compartan el radical base $\sqrt[n]{c}$ y restando sus coeficientes numéricos mediante la propiedad distributiva.'
