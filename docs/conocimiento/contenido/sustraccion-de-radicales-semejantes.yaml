semantic_id: MAT.NUM.RAICES_PROPIEDADES.SUSTRACCION_RADICALES_SEMEJANTES
resumen_inicial: Para restar radicales semejantes, se restan sus coeficientes exteriores y
  se conserva el radical común ($a\sqrt[n]{x} - b\sqrt[n]{x} = (a-b)\sqrt[n]{x}$).
explicacion_simple: 'La resta de radicales semejantes sigue exactamente la misma regla que
  la suma:

  - $9\sqrt{3} - 4\sqrt{3} = (9 - 4)\sqrt{3} = 5\sqrt{3}$

  Restas únicamente los números de afuera y dejas la raíz intacta.'
explicacion_formal: 'Por la propiedad distributiva del factor común radical $\sqrt[n]{x}$,
  para $a, b \in \mathbb{R}$:

  $$a \sqrt[n]{x} - b \sqrt[n]{x} = (a - b) \sqrt[n]{x}$$'
definiciones_clave: '- **Resta de coeficientes**: Diferencia $(a - b)$ entre los términos
  exteriores.'
propiedades_relaciones: '- **Conservación del radical**: El término $\sqrt[n]{x}$ se mantiene
  constante.'
ejemplo_guiado:
  enunciado: Calcula $\sqrt{50} - \sqrt{18}$.
  pasos:
  - 'Simplificar cada radical: $\sqrt{50} = 5\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2}$.'
  - Verificar que son semejantes (comparten $\sqrt{2}$).
  - 'Restar los coeficientes: $(5 - 3)\sqrt{2} = 2\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de $10\sqrt{6} - 7\sqrt{6}$?
  choices:
  - text: 3\sqrt{6}
    is_correct: true
  - text: 3\sqrt{0}
    is_correct: false
  - text: '3'
    is_correct: false
  - text: 17\sqrt{6}
    is_correct: false
  explanation: 'La correcta es: 3\sqrt{6}. Restamos coeficientes ($10 - 7 = 3$) y mantenemos
    $\sqrt{6}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\sqrt{75} - \sqrt{12}$.
  choices:
  - text: 3\sqrt{3}
    is_correct: true
  - text: \sqrt{63}
    is_correct: false
  - text: 2\sqrt{3}
    is_correct: false
  - text: 5\sqrt{3}
    is_correct: false
  explanation: 'La correcta es: 3\sqrt{3}. $5\sqrt{3} - 2\sqrt{3} = 3\sqrt{3}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar los radicales expresando sus radicandos al mínimo.'
- 'Paso 2: Agrupar los términos que tengan radicales semejantes.'
- 'Paso 3: Restar los coeficientes exteriores.'
- 'Paso 4: Escribir el resultado conservando el radical común.'
errores_correccion: No restes los radicandos. $\sqrt{50} - \sqrt{18}$ NO es $\sqrt{32} = 4\sqrt{2}$.
  La respuesta correcta es $5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $8\sqrt{5} - 3\sqrt{5}$.
  alternativas:
  - 5\sqrt{5}
  - '5'
  - 5\sqrt{0}
  respuesta: 5\sqrt{5}
  solucion_pasos:
  - $(8-3)\sqrt{5} = 5\sqrt{5}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de 9 por raíz cuadrada de 5 menos 4 por raíz cuadrada de
    5?
  alternativas:
  - 5 por raíz cuadrada de 5
  - 5 por raíz cuadrada de 0
  - 13 por raíz cuadrada de 5
  respuesta: 5 por raíz cuadrada de 5
  solucion_pasos:
  - 'Se restan los coeficientes: 9-4=5, y se mantiene el radical.'
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de raíz cuadrada de 45 menos raíz cuadrada de 20?
  alternativas:
  - raíz cuadrada de 5
  - raíz cuadrada de 25
  - 5 por raíz cuadrada de 5
  respuesta: raíz cuadrada de 5
  solucion_pasos:
  - raíz cuadrada de 45 = 3 raíz cuadrada de 5 y raíz cuadrada de 20 = 2 raíz cuadrada de
    5; 3-2=1.
- titulo: ¿Es correcto restar los radicandos al calcular raíz cuadrada de 50 menos raíz cuadrada
    de 18?
  respuesta: 'No'
  solucion_pasos:
  - Se deben simplificar y restar los coeficientes exteriores, no los radicandos.
errores_frecuentes:
- Restar los radicandos dentro de la raíz.
- Restar los radicandos en vez de restar los coeficientes exteriores.
- Intentar restar radicales que no son semejantes sin simplificarlos primero.
- Invertir el orden de la resta de los coeficientes, cambiando el signo del resultado.
- Olvidar simplificar los radicales antes de determinar si son semejantes.
afirmaciones_verdaderas:
- $a\sqrt[n]{x} - b\sqrt[n]{x} = (a-b)\sqrt[n]{x}$.
- 'El orden de los coeficientes en la resta de radicales semejantes importa: cambia el signo
  del resultado si se invierte.'
al_terminar_debes_poder: Restar radicales semejantes simplificando los términos previamente.
fuente: Texto escolar MINEDUC.
estado: publicado
