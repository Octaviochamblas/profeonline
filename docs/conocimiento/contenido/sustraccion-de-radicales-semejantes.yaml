semantic_id: MAT.NUM.RAICES_PROPIEDADES.SUSTRACCION_RADICALES_SEMEJANTES
resumen_inicial: Para restar radicales semejantes, se restan sus coeficientes exteriores
  y se conserva el radical común ($a\sqrt[n]{x} - b\sqrt[n]{x} = (a-b)\sqrt[n]{x}$).
explicacion_simple: 'La resta de radicales semejantes sigue exactamente la misma regla
  que la suma:

  - $9\sqrt{3} - 4\sqrt{3} = (9 - 4)\sqrt{3} = 5\sqrt{3}$

  Restas únicamente los números de afuera y dejas la raíz intacta.'
explicacion_formal: 'Por la propiedad distributiva del factor común radical $\sqrt[n]{x}$,
  para $a, b \in \mathbb{R}$:

  $$a \sqrt[n]{x} - b \sqrt[n]{x} = (a - b) \sqrt[n]{x}$$'
definiciones_clave: '- **Resta de coeficientes**: Diferencia $(a - b)$ entre los términos
  exteriores.'
propiedades_relaciones: '- **Conservación del radical**: El término $\sqrt[n]{x}$
  se mantiene constante.'
ejemplo_guiado:
  enunciado: Calcula $\sqrt{50} - \sqrt{18}$.
  pasos:
  - 'Simplificar cada radical: $\sqrt{50} = 5\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2}$.'
  - Verificar que son semejantes (comparten $\sqrt{2}$).
  - 'Restar los coeficientes: $(5 - 3)\sqrt{2} = 2\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de $10\sqrt{6} - 7\sqrt{6}$?
  choices:
  - text: 3\sqrt{6}
    is_correct: true
  - text: 3\sqrt{0}
    is_correct: false
  - text: '3'
    is_correct: false
  - text: 17\sqrt{6}
    is_correct: false
  explanation: 'La correcta es: 3\sqrt{6}. Restamos coeficientes ($10 - 7 = 3$) y
    mantenemos $\sqrt{6}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\sqrt{75} - \sqrt{12}$.
  choices:
  - text: 3\sqrt{3}
    is_correct: true
  - text: \sqrt{63}
    is_correct: false
  - text: 2\sqrt{3}
    is_correct: false
  - text: 5\sqrt{3}
    is_correct: false
  explanation: 'La correcta es: 3\sqrt{3}. $5\sqrt{3} - 2\sqrt{3} = 3\sqrt{3}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar los radicales expresando sus radicandos al mínimo.'
- 'Paso 2: Agrupar los términos que tengan radicales semejantes.'
- 'Paso 3: Restar los coeficientes exteriores.'
- 'Paso 4: Escribir el resultado conservando el radical común.'
errores_correccion: No restes los radicandos. $\sqrt{50} - \sqrt{18}$ NO es $\sqrt{32}
  = 4\sqrt{2}$. La respuesta correcta es $5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $8\sqrt{5} - 3\sqrt{5}$.
  alternativas:
  - 5\sqrt{5}
  - '5'
  - 5\sqrt{0}
  respuesta: 5\sqrt{5}
  solucion_pasos:
  - $(8-3)\sqrt{5} = 5\sqrt{5}$.
errores_frecuentes:
- Restar los radicandos dentro de la raíz.
afirmaciones_verdaderas:
- $a\sqrt[n]{x} - b\sqrt[n]{x} = (a-b)\sqrt[n]{x}$.
al_terminar_debes_ponder: Restar radicales semejantes simplificando los términos previamente.
fuente: Texto escolar MINEDUC.
estado: publicado
