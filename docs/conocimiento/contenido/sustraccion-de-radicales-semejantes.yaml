resumen_inicial: 'Para restar radicales semejantes $a \sqrt[n]{x} - b \sqrt[n]{x}$,
  se restan sus coeficientes exteriores $(a - b)$ y se conserva el radical común:
  $(a - b) \sqrt[n]{x}$.'
explicacion_simple: Para restar raíces semejantes, restamos los coeficientes de afuera
  y mantenemos exactamente la misma raíz idéntica ($8\sqrt{5} - 3\sqrt{5} = 5\sqrt{5}$).
explicacion_formal: 'Para todo coeficiente $a, b \in \mathbb{R}$ y radical común $\sqrt[n]{x}$,
  la **Sustracción de Radicales** cumple:


  $$a \sqrt[n]{x} - b \sqrt[n]{x} = (a - b) \sqrt[n]{x}$$


  > **Complemento didáctico:** NUNCA se restan los radicandos: $\sqrt{a} - \sqrt{b}
  \neq \sqrt{a-b}$.'
definiciones_clave: '- **Sustracción de radicales semejantes**: Operación $(a - b)
  \sqrt[n]{x}$ de diferencia entre coeficientes.'
propiedades_relaciones: '- **Resta de coeficientes**: $(a-b)\sqrt[n]{x}$ conserva
  el radical común.'
ejemplo_guiado:
  enunciado: Calcule la diferencia $9\sqrt{2} - 4\sqrt{2}$.
  pasos:
  - 'Paso 1: Verificar que sean radicales semejantes (índice $2$, radicando $2$).'
  - 'Paso 2: Restar los coeficientes exteriores: $9 - 4 = 5$.'
  - 'Paso 3: Multiplicar por la raíz común: $5\sqrt{2}$.'
  - 'Conclusión: $9\sqrt{2} - 4\sqrt{2} = 5\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento se aplica al restar radicales semejantes a · sqrt[n]{x}
    - b · sqrt[n]{x}?
  choices:
  - text: Se restan los coeficientes (a - b) y se conserva la raíz común (sqrt[n]{x})
    is_correct: true
  - text: Se restan los radicandos x - x dejando cero adentro
    is_correct: false
  - text: Se dividen los coeficientes
    is_correct: false
  - text: Se eliminan las raíces
    is_correct: false
  explanation: La alternativa correcta es 'Se restan los coeficientes (a - b) y se
    conserva la raíz común (sqrt[n]{x})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 9 · sqrt(2) - 4 · sqrt(2), ¿cuál fue el resultado?
  choices:
  - text: 5 · sqrt(2)
    is_correct: true
  - text: 5 · sqrt(0)
    is_correct: false
  - text: 13 · sqrt(2)
    is_correct: false
  - text: 36 · sqrt(2)
    is_correct: false
  explanation: La alternativa correcta es '5 · sqrt(2)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de efectuar la sustracción de radicales
  semejantes $(a - b)\sqrt[n]{x}$, restando los coeficientes exteriores y conservando
  el radical común.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.SUSTRACCION_RADICALES_SEMEJANTES
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.SUSTRACCION_RADICALES_SEMEJANTES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
