semantic_id: MAT.NUM.RAICES_PROPIEDADES.SUSTRACCION_RADICALES_SEMEJANTES
resumen_inicial: 'La sustracción de radicales semejantes se efectúa restando los coeficientes exteriores y conservando intacto el radical común: $a\sqrt[n]{x} - b\sqrt[n]{x} = (a - b)\sqrt[n]{x}$.'
explicacion_simple: |
  Restar raíces semejantes sigue exactamente la misma regla que la suma: sólo restas los números de afuera y mantienes la raíz común tal como está. Si tienes 8 raíces de tres ($8\sqrt{3}$) y le quitas 3 raíces de tres ($3\sqrt{3}$), te quedan 5 raíces de tres ($5\sqrt{3}$). Si los números dentro de la raíz parecen distintos al principio, primero los descompones para buscar la raíz común.
explicacion_formal: |
  ### Definición formal
  La **sustracción de radicales semejantes** se basa en la propiedad distributiva del producto respecto a la resta en los números reales $\mathbb{R}$:
  $$a \cdot \sqrt[n]{x} - b \cdot \sqrt[n]{x} = (a - b) \cdot \sqrt[n]{x}$$

  ### Algoritmo de resta con simplificación previa
  1. Simplificar cada término radical a su forma irreducible: $R_1 = a \sqrt[n]{x}$ y $R_2 = b \sqrt[n]{x}$.
  2. Verificar que los términos simplificados compartan el mismo radical $\sqrt[n]{x}$.
  3. Restar los coeficientes del minuendo y sustraendo: $(a - b)$.
  4. Multiplicar la diferencia resultante por el radical común: $(a - b)\sqrt[n]{x}$.

  ### Síntesis didáctica
  - Coeficiente diferencia: $(a - b)$ (puede dar como resultado números positivos, negativos o cero).
  - Radical resultante: Permanece **inalterado** como $\sqrt[n]{x}$.
definiciones_clave: |
  - **Sustracción de radicales semejantes**: Resta algebraica de expresiones radicales que comparten índice y radicando.
  - **Coeficiente resta $(a - b)$**: Diferencia entre los coeficientes del minuendo y sustraendo exterior.
  - **Resultado nulo**: Ocurre cuando se restan dos radicales idénticos: $a\sqrt[n]{x} - a\sqrt[n]{x} = 0$.
propiedades_relaciones: |
  - **Imposibilidad de resta subradical directa**: En general, $\sqrt[n]{a} - \sqrt[n]{b} \neq \sqrt[n]{a - b}$. La raíz no es distributiva sobre la resta.
  - **Combinación de operaciones**: Permite resolver polinomios radicales combinando sumas y restas simultáneas: $a\sqrt[n]{x} + b\sqrt[n]{x} - c\sqrt[n]{x} = (a + b - c)\sqrt[n]{x}$.
ejemplo_guiado:
  enunciado: 'Calcula el resultado de la sustracción de radicales $D = \sqrt{75} - \sqrt{12}$.'
  pasos:
    - 'Paso 1: Simplificamos el minuendo $\sqrt{75}$: descomponemos $75 = 25 \cdot 3 \implies \sqrt{25 \cdot 3} = 5\sqrt{3}$.'
    - 'Paso 2: Simplificamos el sustraendo $\sqrt{12}$: descomponemos $12 = 4 \cdot 3 \implies \sqrt{4 \cdot 3} = 2\sqrt{3}$.'
    - 'Paso 3: Reescribimos la resta con los términos semejantes: $D = 5\sqrt{3} - 2\sqrt{3}$.'
    - 'Paso 4: Restamos los coeficientes manteniendo la raíz común: $D = (5 - 2)\sqrt{3} = 3\sqrt{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se realiza la sustracción de dos radicales semejantes $a\sqrt[n]{x} - b\sqrt[n]{x}$?'
    choices:
      - {text: 'Se restan los coeficientes exteriores $(a - b)$ conservando intacto el radical común $\sqrt[n]{x}$', is_correct: true}
      - {text: 'Se restan los radicandos dentro de una sola raíz obteniendo $\sqrt[n]{x - x}$', is_correct: false}
      - {text: 'Se dividen los coeficientes exteriores entre el índice', is_correct: false}
      - {text: 'Se elimina la raíz y se restan únicamente los interiores', is_correct: false}
    explanation: 'La alternativa correcta es ''Se restan los coeficientes exteriores $(a - b)$ conservando intacto el radical común $\sqrt[n]{x}$''. La propiedad distributiva factoriza la raíz común $(a-b)\sqrt[n]{x}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la resta $\sqrt{50} - \sqrt{18}$?'
    choices:
      - {text: '$2\sqrt{2}$, ya que $5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$', is_correct: true}
      - {text: '$\sqrt{32}$, restando los radicandos directamente', is_correct: false}
      - {text: '$8\sqrt{2}$, sumando los coeficientes en lugar de restar', is_correct: false}
      - {text: '$4$, elevando los términos al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''$2\sqrt{2}$, ya que $5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$''. Descomponemos $\sqrt{50} = 5\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2}$, restando $5 - 3 = 2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Simplificar cada uno de los radicales a su forma canónica irreducible mediante descomposición.'
  - 'Paso 2: Verificar que el minuendo y el sustraendo contengan exactamente el mismo radical $\sqrt[n]{x}$.'
  - 'Paso 3: Restar los coeficientes del minuendo y sustraendo ($a - b$).'
  - 'Paso 4: Escribir el coeficiente resultado multiplicando a la raíz común $\sqrt[n]{x}$.'
errores_correccion: |
  - **Error 1:** Restar los radicandos dentro de la raíz (ej: escribir $\sqrt{50} - \sqrt{18} = \sqrt{32}$). **Cómo corregirlo:** La raíz **no es distributiva respecto a la resta**. Debes simplificar primero $\sqrt{50} = 5\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2}$, y luego restar coeficientes: $5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$.
  - **Error 2:** Restar dos radicales no semejantes sin antes descomponerlos (ej: decir que $4\sqrt{3} - \sqrt{12}$ no se puede restar). **Cómo corregirlo:** Primero simplifica $\sqrt{12} = 2\sqrt{3}$; al hacerlo descubres que son semejantes: $4\sqrt{3} - 2\sqrt{3} = 2\sqrt{3}$.
ejemplos:
  - titulo: 'Sustracción directa de radicales'
    enunciado: '¿La resta $8\sqrt{5} - 3\sqrt{5}$ equivale a $5\sqrt{5}$?'
    alternativas:
      - 'Sí, pues $(8 - 3)\sqrt{5} = 5\sqrt{5}$'
      - 'No, equivale a $\sqrt{5}$'
      - 'No, equivale a $5\sqrt{0}$'
    respuesta: 'Sí, pues $(8 - 3)\sqrt{5} = 5\sqrt{5}$'
    solucion_pasos:
      - '1. Verificamos la semejanza: ambos contienen $\sqrt{5}$.'
      - '2. Restamos coeficientes: $8 - 3 = 5 \implies 5\sqrt{5}$.'
  - titulo: 'Sustracción con descomposición previa'
    enunciado: '¿La diferencia $\sqrt{45} - \sqrt{20}$ resulta en $\sqrt{5}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{45} = 3\sqrt{5}$ y $\sqrt{20} = 2\sqrt{5} \implies (3 - 2)\sqrt{5} = 1\sqrt{5} = \sqrt{5}$.'
  - titulo: 'Resta de radicales idénticos'
    enunciado: '¿El resultado de restar $7\sqrt{2} - 7\sqrt{2}$ es igual a $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(7 - 7)\sqrt{2} = 0 \cdot \sqrt{2} = 0$.'
  - titulo: 'Combinación de adición y sustracción'
    enunciado: '¿La expresión $5\sqrt{3} + 2\sqrt{3} - 4\sqrt{3}$ equivale a $3\sqrt{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Operamos coeficientes: $5 + 2 - 4 = 3 \implies 3\sqrt{3}$.'
errores_frecuentes:
  - 'La resta de dos raíces $\sqrt{a} - \sqrt{b}$ se simplifica restando directamente sus interiores $\sqrt{a - b}$.'
  - 'Restar dos radicales semejantes elimina la raíz dejando sólo la diferencia de coeficientes.'
  - 'Restar los índices de dos radicales al realizar una sustracción.'
  - 'Afirmar que no es posible restar $\sqrt{27} - \sqrt{12}$ porque sus radicandos son diferentes.'
  - 'Cambiar el signo del radicando al restar dos expresiones radicales.'
afirmaciones_verdaderas:
  - 'La sustracción de radicales semejantes se efectúa restando los coeficientes exteriores y conservando intacto el radical común: $a\sqrt[n]{x} - b\sqrt[n]{x} = (a-b)\sqrt[n]{x}$.'
  - 'Si se restan dos radicales idénticos $a\sqrt[n]{x} - a\sqrt[n]{x}$, el resultado numérico es exactamente igual a cero.'
al_terminar_debes_poder: 'Efectuar sustracciones de expresiones radicales restando sus coeficientes exteriores tras simplificar los términos a radicales semejantes.'
