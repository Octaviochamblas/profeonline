procedimiento:
- 'Paso 1: Identifica el ángulo conocido y los lados involucrados (el conocido y el
  que se busca).'
- 'Paso 2: Elige la razón trigonométrica (seno, coseno o tangente) que relacione esos
  dos lados con el ángulo.'
- 'Paso 3: Despeja el lado desconocido y calcula su valor usando la calculadora.'
