- titulo: ¿Se cumple siempre la propiedad principal de cálculo de lados desconocidos
    de un triángulo rectángulo usando razones trigonométricas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede cálculo de lados desconocidos de un triángulo rectángulo usando razones
    trigonométricas asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
