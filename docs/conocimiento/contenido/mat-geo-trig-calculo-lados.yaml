semantic_id: MAT.GEO.TRIGONOMETRIA_BASICA.CALCULO_LADOS
resumen_inicial: 'Cálculo de lados desconocidos de un triángulo rectángulo usando
  razones trigonométricas: conceptos, teoremas, propiedades geométricas y cálculo
  en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'Con las tres razones trigonométricas ya definidas, es posible
  resolver un problema muy común: encontrar un lado desconocido de un triángulo rectángulo
  cuando se conoce un ángulo agudo y otro lado.'
explicacion_formal: '![Cálculo de lados con razones trigonométricas](/static/img/geometria/areas-pitagoras/trig-calculo-lados.svg)


  ### Definición formal


  Si se conoce el ángulo α y el cateto adyacente, y se busca el cateto opuesto x,
  se usa $\tan(\alpha)=\frac{x}{\text{adyacente}}$, despejando $x=\text{adyacente}\times\tan(\alpha)$.


  ### Desarrollo didáctico


  Con α=37° y cateto adyacente de 8 cm, el cateto opuesto es $x=8\times\tan(37°)\approx8\times0,754\approx6,03$
  cm. La elección de qué razón usar depende de cuáles dos lados (de los tres posibles)
  están involucrados: si se busca la hipotenusa con un cateto, se usa seno o coseno;
  si se relacionan los dos catetos, se usa tangente.'
definiciones_clave: '- **Cálculo de lados desconocidos de un triángulo rectángulo
  usando razones trigonométricas**: Elemento o propiedad fundamental en el estudio
  de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
