semantic_id: MAT.ALG.TERMINO.SIGNO_TERMINO
resumen_inicial: 'El signo de un término algebraico indica si la cantidad es positiva (+) o negativa (-), precediendo siempre al coeficiente numérico.'
explicacion_simple: |
  - Todo término algebraico tiene un signo que determina su polaridad numérica:
    - **Signo negativo ($-$)**: Se escribe obligatoriamente delante del coeficiente (ej. $-8x^2$).
    - **Signo positivo ($+$)**: Puede escribirse explícitamente ($+5a$) o bien omitirse si el término está al inicio de la expresión ($5a$ equivale a $+5a$).
  - Si un término no tiene signo visible a la izquierda, **su signo es siempre positivo ($+$)**.

  ![Signo de un Término](/static/img/nodos/identificacion-del-signo-de-un-termino-intro.svg)
explicacion_formal: |
  ### Fundamento de la polaridad del término
  Sea $T = c \cdot X$ un término algebraico con $c \in \mathbb{R} \setminus \{0\}$ y parte literal $X$. El **signo de $T$** está definido por el signo algebraico de su coeficiente escalar $c$:

  $$\operatorname{sgn}(T) = \begin{cases} + & \text{si } c > 0 \\ - & \text{si } c < 0 \end{cases}$$

  ### Reglas de notación canónica
  1. **Término inicial positivo:** $+ax^n \equiv ax^n$ (el signo $+$ inicial se suprime por economía notacional).
  2. **Término inicial negativo:** $-ax^n$ (el signo $-$ nunca se omite).
  3. **Términos intermedios:** En un polinomio $P(x) = 3x^2 - 7x + 2$, los signos operativos $+$ y $-$ indican simultáneamente la operación y el signo de cada término individual ($T_1 = +3x^2$, $T_2 = -7x$, $T_3 = +2$).
definiciones_clave: |
  - **Signo del término**: Cualidad que clasifica al monomio como positivo o negativo según el valor de su coeficiente.
  - **Signo tácito**: Signo positivo omitido al comienzo de una expresión algebraica.
  - **Signo explícito**: Signo $+$ o $-$ escrito expresamente delante del coeficiente numérico.
propiedades_relaciones: |
  - **Invarianza del signo de la base:** El signo del término precede a todo el bloque y no debe confundirse con los signos de los exponentes de las letras (ej. $-3x^{-2}$ tiene signo negativo, independientemente del exponente $-2$).
  - **Multiplicación de signos:** Al multiplicar dos términos, el signo resultante sigue estrictamente la ley de los signos: $(+) \cdot (+) = +$, $(+) \cdot (-) = -$, $(-) \cdot (-) = +$.
ejemplo_guiado:
  enunciado: 'En el trinomio $P(x) = 4x^3 - 9x^2 + x$, determina el signo de cada uno de los tres términos que lo componen.'
  imagen: '/static/img/nodos/identificacion-del-signo-de-un-termino-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el primer término: $4x^3$. No tiene signo visible al frente, por lo que su signo es **positivo ($+$)**.'
    - 'Paso 2: Identificamos el segundo término: $-9x^2$. Tiene un signo menos que le precede, por lo que su signo es **negativo ($-$)**.'
    - 'Paso 3: Identificamos el tercer término: $+x$. Tiene un signo más que le precede, por lo que su signo es **positivo ($+$)**.'
    - 'Paso 4: Conclusión: Los signos respectivos son **positivo ($+$)**, **negativo ($-$)** y **positivo ($+$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el signo del término algebraico $14a^2b^3$ que no presenta ningún signo escrito a la izquierda?'
    choices:
      - text: 'Positivo ($+$), porque el signo más inicial se omite por convención'
        is_correct: true
      - text: 'Negativo ($-$), porque carece de signo explícito'
        is_correct: false
      - text: 'Neutro o cero'
        is_correct: false
      - text: 'Indeterminado'
        is_correct: false
    explanation: 'La alternativa correcta es ''Positivo ($+$), porque el signo más inicial se omite por convención''. Los términos sin signo visible son siempre positivos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término algebraico $-5x^{-3}$, ¿qué elemento determina el signo del término?'
    choices:
      - text: 'El signo menos delante del coeficiente 5, que hace al término negativo'
        is_correct: true
      - text: 'El exponente $-3$'
        is_correct: false
      - text: 'La variable $x$'
        is_correct: false
      - text: 'La base de la potencia'
        is_correct: false
    explanation: 'La alternativa correcta es ''El signo menos delante del coeficiente 5, que hace al término negativo''. El signo del término lo fija su coeficiente, no el exponente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar el inicio del término algebraico.'
  - 'Paso 2: Observar si existe un signo menos ($-$) escrito a la izquierda.'
  - 'Paso 3: Si existe un signo menos, el término es negativo ($-$).'
  - 'Paso 4: Si no hay signo escrito o figura un signo más ($+$), el término es positivo ($+$).'
errores_correccion: |
  - **Error 1:** Pensar que un término sin signo escrito no tiene signo o es negativo. **Cómo corregirlo:** Por convención universal, un término sin signo visible es **siempre positivo ($+$)**.
  - **Error 2:** Confundir el signo del término con el signo del exponente. **Cómo corregirlo:** En $-2x^3$, el signo del término es **negativo**; en $+2x^{-3}$, el signo del término es **positivo**.
ejemplos:
  - titulo: 'Identificación de signos en polinomio'
    enunciado: '¿Cuáles son los signos de los términos del binomio $-7x^4 + 2x$ en orden de aparición?'
    alternativas:
      - 'Negativo ($-$) y Positivo ($+$)'
      - 'Positivo ($+$) y Negativo ($-$) Ambos son positivos'
      - 'Ambos son negativos'
    respuesta: 'Negativo ($-$) y Positivo ($+$)'
    solucion_pasos:
      - '1. El primer término es $-7x^4$, con signo negativo ($-$).'
      - '2. El segundo término es $+2x$, con signo positivo ($+$).'
  - titulo: 'Signo de monomio con letra sola'
    enunciado: '¿Cuál es el signo del término $-y^3$?'
    alternativas:
      - 'Negativo ($-$), con coeficiente $-1$'
      - 'Positivo ($+$), porque la letra no tiene número'
      - 'No tiene signo'
    respuesta: 'Negativo ($-$), con coeficiente $-1$'
    solucion_pasos:
      - '1. El signo $-$ antecede a la variable.'
      - '2. Equivale a $-1 \cdot y^3$, por lo que es negativo.'
  - titulo: 'Signo tácito al inicio'
    enunciado: '¿Es el monomio $8ab$ equivalente a $+8ab$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por convención notacional, el signo $+$ al inicio de una expresión se omite.'
      - '2. $8ab$ y $+8ab$ son idénticos.'
  - titulo: 'Dependencia del exponente'
    enunciado: '¿Hace el exponente negativo en $3x^{-2}$ que el término completo tenga signo negativo?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El coeficiente $3$ es positivo ($+3$).'
      - '2. El exponente $-2$ indica un recíproco ($\frac{3}{x^2}$), no el signo del término.'
errores_frecuentes:
  - 'Creer que un término inicial sin signo escrito carece de signo o tiene signo negativo.'
  - 'Confundir el signo del coeficiente numérico con el signo del exponente literal.'
  - 'Ignorar el signo menos al separar los términos de un polinomio para operarlos.'
  - 'Afirmar que el signo de un término cambia según el valor asignado a una variable positiva.'
  - 'Tratar al signo menos como un término separado en lugar de unirlo a su coeficiente.'
afirmaciones_verdaderas:
  - 'Todo término algebraico es estrictamente positivo o negativo según el signo de su coeficiente.'
  - 'Si un término algebraico no presenta ningún signo escrito a la izquierda, su signo es positivo.'
al_terminar_debes_poder: |
  ![Resumen de Signo de un Término](/static/img/nodos/identificacion-del-signo-de-un-termino-resumen.svg)

  QUÉ: Identificar con precisión inmediata el signo positivo (+) o negativo (-) de cualquier término algebraico monomio o dentro de un polinomio.
  CÓMO: Reconociendo signos explícitos ($-$) y aplicando la regla del signo positivo tácito ($+$) en monomios como $+7x^2y$ y $-4a^3b$.
