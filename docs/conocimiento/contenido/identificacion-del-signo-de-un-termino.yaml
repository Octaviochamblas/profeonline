resumen_inicial: El signo de un término algebraico indica su polaridad positiva (+)
  o negativa (-) en el cuerpo de los números reales.
explicacion_simple: Todo término algebraico lleva un signo delante de él. Si tiene
  un signo menos (como $-4x^2$), su signo es negativo. Si no tiene ningún signo escrito
  o lleva un signo más (como $3y$ o $+3y$), su signo es implícitamente positivo.
explicacion_formal: 'Para un término $T = c \prod x_j^{e_j}$ con $c \in \mathbb{R}
  \setminus \{0\}$, el **Signo del Término** se define por la función signo del coeficiente
  escalar:


  $$\text{sgn}(T) = \text{sgn}(c) = \begin{cases} + & \text{si } c > 0 \\ - & \text{si
  } c < 0 \end{cases}$$


  > **Complemento didáctico:** El signo fija la orientación del término en la adición
  o sustracción de polinomios.'
definiciones_clave: '- **Signo positivo (+)**: Polaridad de un término cuyo coeficiente
  $c > 0$.

  - **Signo negativo (-)**: Polaridad de un término cuyo coeficiente $c < 0$.'
propiedades_relaciones: '- **Convención de omisión**: El signo positivo se omite cuando
  el término ocupa la primera posición de una expresión.'
ejemplo_guiado:
  enunciado: Determine el signo de los términos $T_1 = -9ab^2$ y $T_2 = 5x^3$.
  pasos:
  - 'Paso 1: Analizar $T_1 = -9ab^2$: posee un signo menos explícito $\to$ Signo negativo
    ($-$).'
  - 'Paso 2: Analizar $T_2 = 5x^3$: no lleva signo escrito al inicio $\to$ Signo positivo
    ($+$).'
  - 'Conclusión: $T_1$ es negativo y $T_2$ es positivo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo se le asigna convencionalmente a un término algebraico que
    no lleva ningún signo explícito escrito a su izquierda?
  choices:
  - text: Signo positivo (+)
    is_correct: true
  - text: Signo negativo (-)
    is_correct: false
  - text: Signo neutro cero
    is_correct: false
  - text: Indeterminado
    is_correct: false
  explanation: La alternativa correcta es 'Signo positivo (+)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el signo del término -9ab^2?
  choices:
  - text: Signo negativo (-)
    is_correct: true
  - text: Signo positivo (+)
    is_correct: false
  - text: Sin signo
    is_correct: false
  - text: Signo nulo
    is_correct: false
  explanation: La alternativa correcta es 'Signo negativo (-)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el prefijo a la izquierda del coeficiente del término.'
- 'Paso 2: Si aparece un signo $-$, el término es negativo.'
- 'Paso 3: Si aparece un signo $+$ o no hay signo escrito al inicio, el término es
  positivo.'
errores_correccion: '- **Error 1: Confundir el signo del exponente con el signo del
  término ($x^{-2}$ no es un término negativo).** **Cómo corregirlo:** El signo del
  término depende exclusivamente del signo que precede a su coeficiente numérico.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el signo del término algebraico -14x^3y^5?
  alternativas:
  - Negativo (-)
  - Positivo (+)
  - Neutro
  - Nulo
  respuesta: Negativo (-)
  solucion_pasos:
  - '1. El prefijo es un signo menos: -14.'
  - 2. El signo del término es negativo.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el signo del término 8a^2b que aparece al inicio de una expresión?
  alternativas:
  - Positivo (+)
  - Negativo (-)
  - Cero
  - Indefinido
  respuesta: Positivo (+)
  solucion_pasos:
  - 1. Por convención, un término sin signo al inicio es positivo (+).
- titulo: ¿Es el término +10x^4 de signo positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, su coeficiente lleva el signo explícito +.
- titulo: ¿Hace que un exponente negativo como x^-3 convierta al término en negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, el exponente negativo indica un recíproco, no la polaridad del coeficiente.
errores_frecuentes:
- Declarar que un término con exponente negativo es un término de signo negativo.
- Omitir el signo negativo al extraer el coeficiente numérico de un término.
- Declarar que los términos sin signo explícito carecen de polaridad en los reales.
- Declarar el signo de la operación anterior con el signo propio del término.
- Declarar que cambiar el orden de las letras altera el signo del término.
afirmaciones_verdaderas:
- El signo de un término algebraico lo determina el signo que precede a su coeficiente
  numérico.
- Por convención, el signo positivo (+) se omite en el primer término de una expresión.
al_terminar_debes_poder: Al terminar serás capaz de identificar el signo positivo
  o negativo de un término algebraico observando el prefijo del coeficiente.
