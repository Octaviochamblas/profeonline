semantic_id: MAT.ALG.TERMINO.SIGNO_TERMINO
resumen_inicial: 'La identificación del signo de un término algebraico consiste en determinar la polaridad positiva ($+$) o negativa ($-$) del coeficiente numérico que antecede al término.'
explicacion_simple: |
  El **signo de un término algebraico** indica si la cantidad expresada se suma o se resta en un cálculo:
  - **Signo Negativo ($-$)**: Se escribe siempre de forma explícita justo antes del número o la letra (ejemplo: $-3x^2$, $-ab$).
  - **Signo Positivo ($+$)**: Puede escribirse explícitamente (ejemplo: $+7y$) o bien **omitirse cuando el término es el primero de una expresión** (ejemplo: $5x$ es lo mismo que $+5x$).
  - Regla clave: El signo que le pertenece a un término es **siempre el que está ubicado inmediatamente a su izquierda**.
explicacion_formal: |
  ### Definición formal
  El **signo** de un término algebraico $M(x) = c \cdot X$ es la función signo $\operatorname{sgn}: \mathbb{R} \setminus \{0\} \to \{-1, +1\}$ aplicada sobre su coeficiente escalar $c$:

  $$\operatorname{sgn}(c) = \begin{cases} +1 & \text{si } c > 0 \\ -1 & \text{si } c < 0 \end{cases}$$

  ### Convención Notacional de Omisión
  En la sintaxis del lenguaje algebraico, el operador aditivo inicial $+1$ goza de la propiedad de elisión:

  $$+ c X \equiv c X \quad (\text{para el término inicial de una expresión})$$

  Por el contrario, el operador aditivo $-1$ es estrictamente no elidible:

  $$- c X \neq c X$$

  ### Síntesis didáctica
  El signo es una propiedad intrínseca del coeficiente numérico. Determina la posición del término en la recta numérica respecto al origen y su efecto aditivo o sustractivo al reducir polinomios.
definiciones_clave: |
  - **Signo de un término**: Operador de polaridad ($+$ o $-$) que precede al coeficiente escalar de un monomio.
  - **Signo implícito (Positivo)**: Ausencia de signo a la izquierda del primer término de una expresión, interpretada automáticamente como $+$.
  - **Término negativo**: Monomio cuyo coeficiente escalar es menor que cero ($c < 0$).
propiedades_relaciones: |
  - **Efecto en la multiplicación de términos**: El signo del producto de dos términos se rige estrictamente por la ley de los signos ($+ \cdot + = +$, $- \cdot - = +$, $+ \cdot - = -$).
  - **Términos opuestos**: Dos términos algebraicos son opuestos si tienen la misma parte literal y el mismo coeficiente en valor absoluto pero con signos contrarios (ej: $4x^2$ y $-4x^2$).
ejemplo_guiado:
  enunciado: 'En la expresión polinómica $8a^2 - 5ab + c - 12$, identifica el signo de cada uno de los 4 términos algebraicos presentes.'
  pasos:
    - 'Paso 1: Primer término $8a^2$: Como no tiene un signo escrito a la izquierda, su signo es **positivo ($+$)**.'
    - 'Paso 2: Segundo término $-5ab$: El signo ubicado a su izquierda es **negativo ($-$)**.'
    - 'Paso 3: Tercer término $+c$: El signo escrito inmediatamente a su izquierda es **positivo ($+$)**.'
    - 'Paso 4: Cuarto término $-12$: El signo escrito inmediatamente a su izquierda es **negativo ($-$)**.'
    - 'Conclusión: Los signos son **$+$, $-$, $+$ y $-$** respectivamente.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un término algebraico se encuentra al inicio de una expresión y no tiene ningún signo escrito a su izquierda, ¿qué signo le corresponde por convención?'
    choices:
      - {text: 'Signo positivo ($+$)', is_correct: true}
      - {text: 'Signo negativo ($-$) ', is_correct: false}
      - {text: 'Signo neutro igual a cero', is_correct: false}
      - {text: 'Signo multiplicativo ($\cdot$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Signo positivo ($+$)''. Por convención notacional, el signo $+$ inicial se omite.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la expresión $-3x^2 + 7x - 9$, ¿cuáles son los signos de los coeficientes de los términos en $x^2$, $x$ y el término independiente?'
    choices:
      - {text: 'Negativo ($-$) para $x^2$, positivo ($+$) para $x$ y negativo ($-$) para el independiente', is_correct: true}
      - {text: 'Positivo ($+$) para todos los términos', is_correct: false}
      - {text: 'Negativo ($-$) para todos los términos', is_correct: false}
      - {text: 'Positivo ($+$) para $x^2$ y negativo ($-$) para los demás', is_correct: false}
    explanation: 'La alternativa correcta es ''Negativo ($-$) para $x^2$, positivo ($+$) para $x$ y negativo ($-$) para el independiente''. Corresponden a $-3x^2$, $+7x$ y $-9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar el término algebraico cuya polaridad se desea analizar.'
  - 'Paso 2: Mirar el operador ubicado inmediatamente a la izquierda del coeficiente o letra del término.'
  - 'Paso 3: Si aparece un signo $-$, clasificar el término como negativo.'
  - 'Paso 4: Si aparece un signo $+$ o no aparece ningún signo por estar al inicio de la expresión, clasificar el término como positivo.'
errores_correccion: |
  - **Error 1:** Considerar que el signo de un término es el que está a su derecha en vez de su izquierda. **Cómo corregirlo:** El signo de un término **SIEMPRE se ubica a su izquierda**.
  - **Error 2:** Declarar que un término sin signo escrito como $4x$ carece de signo o es igual a cero. **Cómo corregirlo:** La ausencia de signo inicial **representa un signo positivo implícito ($+4x$)**.
ejemplos:
  - titulo: 'Identificación de signo negativo'
    enunciado: '¿Cuál es el signo del término $-15x^3 y$?'
    alternativas:
      - 'Negativo ($-$)'
      - 'Positivo ($+$)'
      - 'Indeterminado'
    respuesta: 'Negativo ($-$)'
    solucion_pasos:
      - '1. El operador a la izquierda es $-$.'
      - '2. El signo del término es negativo.'
  - titulo: 'Signo implícito inicial'
    enunciado: 'En la expresión $6a - 2b$, ¿cuál es el signo del término $6a$?'
    alternativas:
      - 'Positivo ($+$)'
      - 'Negativo ($-$)'
      - 'Cero'
    respuesta: 'Positivo ($+$)'
    solucion_pasos:
      - '1. Es el término inicial y carece de signo escrito.'
      - '2. Por convención su signo es positivo ($+$).'
  - titulo: 'Cambio de signo al multiplicar por -1'
    enunciado: 'Si multiplicamos el término positivo $+5x$ por $-1$, ¿el nuevo término tiene signo negativo ($-5x$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la ley de los signos: $+ \cdot - = -$.'
  - titulo: 'Signo del término en un polinomio'
    enunciado: 'En el trinomio $x^2 - 4x + 4$, ¿el signo del término central es negativo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el término es $-4x$, cuyo operador a la izquierda es $-$.'
errores_frecuentes:
  - 'El signo de un término algebraico es el operador escrito inmediatamente a su derecha.'
  - 'Un término algebraico sin signo inicial escrito posee un coeficiente negativo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El signo negativo de un término se elimina al elevar su coeficiente al cuadrado en una suma.'
  - 'Dos términos con la misma parte literal y signos distintos no se pueden sumar o restar.'
afirmaciones_verdaderas:
  - 'El signo de un término algebraico siempre se encuentra ubicado inmediatamente a su izquierda.'
  - 'Por convención notacional, cuando el primer término de una expresión es positivo, su signo $+$ se omite.'
al_terminar_debes_poder: 'Identificar el signo positivo o negativo de cualquier término algebraico analizando el operador situado inmediatamente a su izquierda.'
