semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.VERIFICACION_COMPOSICION_IDENTIDAD
resumen_inicial: 'Verificación de inversa mediante composición identidad: conceptos,
  representación y propiedades en Tipos de funciones y función inversa.'
explicacion_simple: Existe una prueba infalible para confirmar que calculaste bien
  una inversa, componerla con la original y comprobar que el resultado sea simplemente
  "devolver lo mismo que entró".
explicacion_formal: '### Definición formal


  Dadas funciones $f$ y $g$, $g=f^{-1}$ si y solo si $(f \circ g)(x) = x$ para todo
  $x$ en el dominio de $g$, y $(g \circ f)(x) = x$ para todo $x$ en el dominio de
  $f$. Ambas condiciones deben cumplirse simultáneamente.


  ### Desarrollo didáctico


  Esta verificación es la forma más rigurosa de confirmar un cálculo de inversa, ya
  que no depende de "confiar" en el proceso algebraico, sino de comprobar el resultado
  directamente.


  Si $f(x)=5x-2$ y se propone $g(x)=\frac{x+2}{5}$: se calcula $f(g(x))=5\left(\frac{x+2}{5}\right)-2=(x+2)-2=x$.
  Se confirma que $g$ es efectivamente la inversa de $f$.'
definiciones_clave: '- **Verificación de inversa mediante composición identidad**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
