procedimiento:
- 'Paso 1: Calcula la composición $f(g(x))$, sustituyendo $g(x)$ dentro de $f$.'
- 'Paso 2: Simplifica y verifica si el resultado es exactamente $x$.'
- 'Paso 3: Calcula la composición $g(f(x))$ y verifica también que dé $x$.'
- 'Paso 4: Si ambas composiciones dan $x$, se confirma que $g$ es la inversa de $f$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar verificación de inversa mediante composición identidad.
ejemplos:
- titulo: Verificación completa de una inversa
  enunciado: Verifica que $g(x)=\frac{x-3}{2}$ es la inversa de $f(x)=2x+3$.
  solucion_pasos:
  - $f(g(x)) = 2\left(\frac{x-3}{2}\right)+3 = (x-3)+3 = x$.
  - $g(f(x)) = \frac{(2x+3)-3}{2} = \frac{2x}{2} = x$.
  - Ambas composiciones dan $x$, se confirma que $g=f^{-1}$.
- titulo: Detección de un cálculo incorrecto de inversa
  enunciado: Verifica si $g(x)=\frac{x}{3}$ es la inversa de $f(x)=3x+1$.
  solucion_pasos:
  - $f(g(x)) = 3\left(\frac{x}{3}\right)+1 = x+1 \neq x$.
  - La composición no da $x$, así que $g$ NO es la inversa correcta de $f$.
- titulo: ¿Basta con verificar solo $f(g(x))=x$ para confirmar que $g$ es la inversa
    de $f$?
  enunciado: ¿Basta con verificar solo $f(g(x))=x$ para confirmar que $g$ es la inversa
    de $f$?
  respuesta: 'No'
  solucion_pasos:
  - Se deben verificar ambas composiciones, $f(g(x))=x$ y $g(f(x))=x$, para una confirmación
    rigurosa.
- titulo: ¿Componer una función con su verdadera inversa siempre produce la función
    identidad?
  enunciado: ¿Componer una función con su verdadera inversa siempre produce la función
    identidad?
  respuesta: Sí
  solucion_pasos:
  - Esa es precisamente la propiedad que define y caracteriza a la función inversa.
errores_frecuentes:
- Verificar solo una de las dos composiciones y dar por válida la inversa sin comprobar
  la otra.
- Cometer errores algebraicos al simplificar la composición, concluyendo erróneamente
  que no es la inversa.
- Confundir la composición $f(g(x))$ con el producto $f(x)\cdot g(x)$.
- No simplificar completamente la expresión antes de comparar con $x$.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando verificación
