semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_RECTANGULO
resumen_inicial: 'Ubicación del ortocentro en el vértice del ángulo recto de un triángulo
  rectángulo: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: En un triángulo rectángulo, los dos catetos ya son perpendiculares
  entre sí, así que actúan directamente como dos de las alturas, y su punto de encuentro
  es el propio vértice recto.
explicacion_formal: '![Ortocentro en el vértice recto](/static/img/geometria/elementos-secundarios/altura-ortocentro-ortocentro-rectangulo.svg)


  ### Definición formal


  Si un triángulo ABC tiene ángulo recto en A, entonces los catetos AB y AC son las
  alturas relativas a AC y AB respectivamente, y ambas se cruzan en A; por lo tanto,
  el ortocentro H coincide con A.


  ### Desarrollo didáctico


  En un triángulo rectángulo con ángulo recto en A, el cateto AB ya es perpendicular
  a AC (y viceversa), así que cada cateto ES la altura relativa al otro; ambas alturas
  concurren exactamente en A.'
definiciones_clave: '- **Ubicación del ortocentro en el vértice del ángulo recto de
  un triángulo rectángulo**: Elemento o propiedad fundamental en el estudio de elementos
  secundarios del triángulo.'
