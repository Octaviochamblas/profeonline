semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.RAZON_AREAS
resumen_inicial: 'Relación entre áreas de figuras semejantes como cuadrado de la razón
  de semejanza: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: A diferencia de los perímetros (que escalan linealmente), las
  áreas de figuras semejantes se comportan de forma distinta, ya que involucran dos
  dimensiones a la vez.
explicacion_formal: '![Razón entre áreas de figuras semejantes](/static/img/geometria/congruencia-semejanza/semejanza-razon-areas.svg)


  ### Definición formal


  Si dos figuras son semejantes con razón de semejanza $k$, entonces $\frac{A_2}{A_1}=k^2$,
  donde $A_1$ y $A_2$ son sus áreas respectivas.


  ### Desarrollo didáctico


  Esto ocurre porque el área depende del producto de dos longitudes (por ejemplo,
  base×altura), y cada una de esas longitudes se multiplica por $k$, por lo que el
  área total se multiplica por $k\times k=k^2$. Por ejemplo, si un triángulo se amplía
  al doble ($k=2$), su área se cuadruplica ($k^2=4$).'
definiciones_clave: '- **Relación entre áreas de figuras semejantes como cuadrado
  de la razón de semejanza**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
