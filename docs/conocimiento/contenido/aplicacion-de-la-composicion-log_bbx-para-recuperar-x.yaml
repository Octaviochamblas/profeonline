semantic_id: MAT.ALG.RELACION_EXP_LOG.COMPOSICION_EXP_LOG
resumen_inicial: La aplicación de la composición $\log_b(b^x) = x$ establece la propiedad cancelativa para todo $x \in \mathbb{R}$, donde el operador logaritmo anula la base exponencial y recupera idénticamente el exponente original.
explicacion_simple: "![La aplicación de la composición $\\log_b(b^x) = x$ establece la propiedad cancelativa para todo $x \\in \\mathbb{R}$, donde el operador logaritmo anula la base exponencial y recupera idénticamente el exponente original](/static/img/nodos/aplicacion-de-la-composicion-log_bbx-para-recuperar-x-intro.svg)\n\n\nCuando metes una **potencia dentro de un logaritmo con la misma base**, ¡ambos operadores se destruyen mutuamente y **te devuelven el exponente $x$ intacto**!:\n\n$$\\log_b(b^{\\mathbf{x}}) = \\mathbf{x} \\quad (\\text{Válido para TODO } x \\in \\mathbb{R})$$\n\n- **¿Por qué sirve tanto?**\n  - Es la herramienta número uno para **despejar incógnitas que están atrapadas en el exponente**:\n    - Si tienes $2^x = 16$, aplicas $\\log_2$ a ambos lados:\n      $$\\log_2(2^x) = \\log_2(16) \\implies \\mathbf{x = 4}$$\n- **Funciona con cualquier número real:** positivo, negativo, fraccionario o cero (ej: $\\log_3(3^{-5}) = -5$)."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$ y sea $x \in \mathbb{R}$. Por definición de composición de la aplicación inversa con la aplicación directa $(\exp_b^{-1} \circ \exp_b): \mathbb{R} \to \mathbb{R}$:

  $$(\log_b \circ \exp_b)(x) = \log_b\left(b^x\right)$$

  Por la propiedad del logaritmo de una potencia, el exponente $x$ baja como factor escalar:

  $$\log_b\left(b^x\right) = x \cdot \log_b(b)$$

  Como $\log_b(b) = 1$ por la propiedad de identidad:

  $$\log_b\left(b^x\right) = x \cdot 1 = x$$

  Demostrando la recuperación idéntica del elemento para todo el espacio vectorial $\mathbb{R}$.'
definiciones_clave: '- **Propiedad de composición inversa directa**: Identidad $(\log_b \circ \exp_b)(x) = x$.

  - **Cancelación de base**: Eliminación del operador exponencial mediante logaritmo homólogo.'
propiedades_relaciones: '- **Universalidad real**: La identidad $\log_b(b^x) = x$ es válida para todo $x \in \mathbb{R}$ sin restricción de signo.

  - **Cancelación natural**: $\ln(e^x) = x$ y $\log(10^x) = x$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La aplicación de la composición $\log_b(b^x) = x$ establece la propiedad cancelativa para todo $x \in \mathbb{R}$, donde el operador logaritmo anula la base exponencial y recupera idénticamente el exponente original](/static/img/nodos/aplicacion-de-la-composicion-log_bbx-para-recuperar-x-ejemplos.svg)



    Aplica la composición cancelativa para simplificar y resolver:

    1) $\log_4(4^{2x + 5})$

    2) $\ln(e^{\sin(x)})$

    3) Resuelve aplicando logaritmos: $3^{x - 2} = 81$'
  pasos:
  - 'Paso 1: Para $\log_4(4^{2x + 5})$:

    - Las bases coinciden $\implies$ cancelación directa $\implies \mathbf{2x + 5}$.'
  - 'Paso 2: Para $\ln(e^{\sin(x)})$:

    - Como $\ln$ es base $e$ $\implies \mathbf{\sin(x)}$.'
  - 'Paso 3: Para resolver $3^{x - 2} = 81$:

    - Aplicar $\log_3$ a ambos miembros: $\log_3(3^{x - 2}) = \log_3(81)$.

    - Cancelar base izquierda: $x - 2 = 4$.

    - Despejar: $\mathbf{x = 6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado simplificado de $\log_7(7^{k - 3})$?
  choices:
  - text: k - 3 (cancelación directa)
    is_correct: true
  - text: 7(k - 3)
    is_correct: false
  - text: '7'
    is_correct: false
  - text: k
    is_correct: false
  explanation: La alternativa correcta es 'k - 3 (cancelación directa)'. Por la propiedad $\log_b(b^x) = x$, la base 7 se cancela y sobrevive el exponente $k - 3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto vale $\ln(e^{-10})$?
  choices:
  - text: '-10'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: 1/e¹⁰
    is_correct: false
  - text: '-1'
    is_correct: false
  explanation: La alternativa correcta es '-10'. $\ln(e^x) = x$ es válida para todo número real, incluidos los negativos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que la base del logaritmo coincida exactamente con la base de la potencia.'
- 'Paso 2: Aplicar la identidad cancelativa $\log_b(b^u) = u$.'
- 'Paso 3: Aislar el exponente algebraico resultante.'
- 'Paso 4: Continuar con la resolución de la ecuación si procede.'
errores_correccion: '- **Error común:** Intentar cancelar cuando las bases no son iguales (ej: $\log_2(3^x) = x$).

  - **Cómo corregirlo:** La base del logaritmo y la de la potencia **DEBEN SER EXACTAMENTE IGUALES**: $\log_{\mathbf{b}}(\mathbf{b}^x) = x$.'
ejemplos:
- titulo: 'Ejemplo 1: Cancelación con base 10'
  enunciado: 'Simplifica $\log_{10}(10^9)$:'
  alternativas:
  - '9'
  - '90'
  - '10'
  - '1'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: $\log_{10}(10^9) = 9$.'
- titulo: 'Ejemplo 2: Exponente negativo fraccionario'
  enunciado: ¿Cuánto vale $\log_2(2^{-3/4})$?
  alternativas:
  - -3/4
  - 3/4
  - '-3'
  - '2'
  respuesta: -3/4
  solucion_pasos:
  - 'Paso 1: $\log_2(2^{-3/4}) = -3/4$.'
- titulo: 'Ejemplo 3: Cancelación con monomio'
  enunciado: 'Simplifica $\ln(e^{5x})$:'
  alternativas:
  - 5x
  - '5'
  - x
  - e⁵
  respuesta: 5x
  solucion_pasos:
  - 'Paso 1: $\ln(e^{5x}) = 5x$.'
- titulo: 'Ejemplo 4: Resolución de ecuación'
  enunciado: Si $\log_5(5^{x + 1}) = 12$, ¿cuál es el valor de $x$?
  alternativas:
  - x = 11
  - x = 12
  - x = 13
  - x = 60
  respuesta: x = 11
  solucion_pasos:
  - 'Paso 1: $x + 1 = 12 \implies x = 11$.'
errores_frecuentes:
- Creer que la propiedad solo se cumple para exponentes positivos.
- Cancelar bases numéricas diferentes sin igualarlas antes.
- Multiplicar la base por el exponente.
afirmaciones_verdaderas:
- La composición log_b(bˣ) = x es una identidad válida para cualquier número real x.
- Esta propiedad fundamenta el método general de resolución de ecuaciones exponenciales.
al_terminar_debes_poder: '**QUÉ:** Aplicar la composición cancelativa log_b(bˣ) = x para simplificar y resolver ecuaciones.


  **CÓMO:** Utilizando la anulación mutua de bases idénticas para aislar exponentes reales.


