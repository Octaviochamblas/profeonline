semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.VOLUMENES_GEOMETRICOS
resumen_inicial: 'El volumen de cualquier cuerpo geométrico semejante en función de su dimensión lineal $x$ responde a una función potencia cúbica $V(x) = a x^3$.'
explicacion_simple: |
  Todas las fórmulas de volumen en geometría tridimensional (como el volumen de un cubo $V = s^3$, de una esfera $V = \frac{4}{3}\pi r^3$ o de un tetraedro) son funciones potencia con exponente $3$. Como el volumen mide la capacidad en tres dimensiones (ancho, alto y profundidad), cuando la longitud lineal $x$ se multiplica por un número $c$, el volumen se multiplica por $c^3$. Por ejemplo, si duplicamos el radio de una pelota ($2r$), su capacidad o volumen interno aumenta 8 veces ($2^3 = 8$).
explicacion_formal: |
  ### Definición formal
  El **modelamiento de volúmenes de cuerpos tridimensionales semejantes** en función de una dimensión lineal característica $x > 0$ se define por la **función potencia cúbica**:
  $$V(x) = a \cdot x^3$$
  donde:
  - **$x$**: Longitud o dimensión lineal característica (arista, radio, altura).
  - **$V(x)$**: Volumen del cuerpo tridimensional.
  - **$a$**: Factor de forma tridimensional constante ($a > 0$).

  ### Factores de Forma Tridimensionales Típicos ($a$)
  1. **Cubo de arista $s$**: $V(s) = 1 \cdot s^3 \implies a = 1$.
  2. **Esfera de radio $r$**: $V(r) = \frac{4}{3}\pi \cdot r^3 \implies a = \frac{4}{3}\pi \approx 4.1888$.
  3. **Cilindro Equilátero ($h = 2r$)**: $V(r) = 2\pi \cdot r^3 \implies a = 2\pi$.
  4. **Tetraedro Regular de arista $s$**: $V(s) = \frac{\sqrt{2}}{12} \cdot s^3 \implies a = \frac{\sqrt{2}}{12}$.

  ### Teorema de Escalamiento de Volumen
  Para dos cuerpos tridimensionales semejantes $C_1$ y $C_2$ con razón de semejanza lineal $c = \frac{x_2}{x_1}$:
  $$\frac{\text{Volumen}(C_2)}{\text{Volumen}(C_1)} = \frac{a x_2^3}{a x_1^3} = \left(\frac{x_2}{x_1}\right)^3 = c^3$$
  La razón entre los volúmenes de dos cuerpos semejantes es igual al cubo de la razón de semejanza lineal.
definiciones_clave: |
  - **Función volumen cúbica $V(x) = a x^3$**: Modelo potencia de exponente 3 que describe capacidades tridimensionales.
  - **Factor de forma tridimensional $a$**: Constante que depende exclusivamente de la geometría espacial del cuerpo.
  - **Razón de volúmenes $c^3$**: Cubo de la razón de semejanza entre dimensiones lineales de cuerpos semejantes.
propiedades_relaciones: |
  - **Dominio geométrico**: $x \in ]0, +\infty[$, exigido por la existencia de medidas lineales reales.
  - **Relación Masa-Volumen**: Si la densidad $\rho$ es constante, la masa $m(x) = \rho \cdot V(x) = (\rho \cdot a) x^3$ es también una función potencia cúbica de la dimensión lineal.
ejemplo_guiado:
  enunciado: 'Un tanque de agua esférico tiene un radio de $r_1 = 3 \text{ m}$ y alberga un volumen $V_1$. Se desea construir un nuevo tanque esférico con el triple de radio $r_2 = 9 \text{ m}$. Utiliza el modelo $V(r) = \frac{4}{3}\pi r^3$ para calcular cuántas veces más agua albergará el nuevo tanque.'
  pasos:
    - 'Paso 1: Identificamos la razón de semejanza lineal entre radios: $c = \frac{r_2}{r_1} = \frac{9}{3} = 3$.'
    - 'Paso 2: Evaluamos el volumen inicial: $V(3) = \frac{4}{3}\pi (3)^3 = \frac{4}{3}\pi (27) = 36\pi \text{ m}^3$.'
    - 'Paso 3: Evaluamos el nuevo volumen: $V(9) = \frac{4}{3}\pi (9)^3 = \frac{4}{3}\pi (729) = 972\pi \text{ m}^3$.'
    - 'Paso 4: Calculamos la razón de volúmenes: $\frac{V(9)}{V(3)} = \frac{972\pi}{36\pi} = 27 = 3^3$. El nuevo tanque alberga $27$ veces más agua.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la arista de un contenedor cúbico se duplica (razón $c = 2$), ¿por qué factor se multiplica la capacidad de almacenamiento en volumen del nuevo cubo?'
    choices:
      - {text: 'Por un factor de $8$, ya que la razón entre volúmenes en modelos cúbicos es $c^3 = 2^3 = 8$', is_correct: true}
      - {text: 'Por un factor de $2$', is_correct: false}
      - {text: 'Por un factor de $4$', is_correct: false}
      - {text: 'Por un factor de $6$', is_correct: false}
    explanation: 'La alternativa correcta es ''Por un factor de $8$, ya que la razón entre volúmenes en modelos cúbicos es $c^3 = 2^3 = 8$''. El volumen de cuerpos semejantes escala con el cubo de las dimensiones lineales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la función de volumen de una esfera $V(r) = \frac{4}{3}\pi r^3$, ¿cuál es el factor de forma $a$ de la función potencia?'
    choices:
      - {text: '$a = \frac{4}{3}\pi$, que es el coeficiente constante que multiplica a la base $r^3$', is_correct: true}
      - {text: '$a = 3$', is_correct: false}
      - {text: '$a = r$', is_correct: false}
      - {text: '$a = 4\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = \frac{4}{3}\pi$, que es el coeficiente constante que multiplica a la base $r^3$''. El parámetro $a$ es la constante multiplicativa de la potencia.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la dimensión lineal $x$ (arista, radio) y el modelo de volumen $V(x) = a x^3$.'
  - 'Paso 2: Determinar el factor de forma $a$ del cuerpo geométrico.'
  - 'Paso 3: Sustituir la dimensión dada en la base $x$ y elevar al cubo $x^3$.'
  - 'Paso 4: Aplicar el factor $c^3$ para responder preguntas de proporcionalidad volumétrica.'
errores_correccion: |
  - **Error 1:** Confundir el modelo de volumen (exponente 3) con el modelo de área (exponente 2). **Cómo corregirlo:** Las áreas miden superficies planas ($x^2$), mientras que los volúmenes miden espacio tridimensional ($x^3$).
  - **Error 2:** Multiplicar por 3 la constante $a$ al triplicar la arista. **Cómo corregirlo:** Triplicar la arista ($c = 3$) multiplica el volumen por $3^3 = 27$, afectando a la potencia $x^3$ y no al coeficiente de forma $a$.
ejemplos:
  - titulo: 'Escalamiento de volumen de cubo'
    enunciado: 'En $V(s) = s^3$, ¿si la arista $s$ se triplica el volumen aumenta 27 veces?'
    alternativas:
      - 'Sí, por el factor $3^3 = 27$'
      - 'No, aumenta 3 veces'
      - 'No, aumenta 9 veces'
    respuesta: 'Sí, por el factor $3^3 = 27$'
    solucion_pasos:
      - '1. $V(3s) = (3s)^3 = 27 s^3 = 27 V(s)$.'
      - '2. El volumen aumenta 27 veces.'
  - titulo: 'Cálculo de volumen esférico'
    enunciado: '¿Cuál es el volumen de una esfera de radio $r = 3 \text{ cm}$?'
    respuesta: '36 \pi cm³'
    solucion_pasos:
      - '1. $V(3) = \frac{4}{3}\pi (3)^3 = \frac{4}{3}\pi (27) = 36\pi \text{ cm}^3$.'
  - titulo: 'Reducción de arista a la mitad'
    enunciado: 'Si la arista de un dado se reduce a la mitad ($s/2$), ¿el volumen cae a $\frac{1}{8}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1/2)^3 = 1/8 \implies$ el volumen cae a la octava parte.'
  - titulo: 'Factor de forma en cubos'
    enunciado: '¿El factor de forma de un cubo $V(s) = s^3$ es $a = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $V(s) = 1 \cdot s^3$, el coeficiente $a = 1$.'
errores_frecuentes:
  - 'El volumen de un cuerpo geométrico tridimensional sigue un modelo de función potencia cuadrático $V(x) = a x^2$.'
  - 'Duplicar la arista de un cubo duplica su capacidad en volumen.'
  - 'En la función de volumen $V(r) = \frac{4}{3}\pi r^3$, el parámetro de escala cambia al aumentar el radio.'
  - 'Triplicar el radio de una esfera aumenta su volumen por un factor de 9.'
  - 'Las razones de volumen entre cuerpos semejantes son iguales a la razón entre sus lados.'
afirmaciones_verdaderas:
  - 'El volumen de cualquier cuerpo geométrico semejante en función de su dimensión lineal $x$ es una función potencia cúbica $V(x) = a x^3$.'
  - 'La razón entre los volúmenes de dos cuerpos tridimensionales semejantes es igual al cubo de la razón de semejanza lineal entre sus dimensiones ($c^3$).'
al_terminar_debes_poder: |
  QUÉ: Modelar variaciones de volumen geométrico mediante funciones potencia cúbicas $V(r) = c \cdot r^3$.
  CÓMO: Aplicar el factor de escala cúbico $k^3$ al modificar proporcionalmente el radio o arista por un factor $k$.
