semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.VOLUMENES_GEOMETRICOS
resumen_inicial: 'Modelamiento de volúmenes de cuerpos geométricos mediante funciones
  potencia cúbicas: forma general $f(x) = a x^n$, simetría, dominio y recorrido en
  Modelamiento y aplicaciones en contexto.'
explicacion_simple: Al igual que el área escala con el cuadrado, el volumen de un
  sólido que crece manteniendo su forma escala con el cubo de su dimensión lineal.
explicacion_formal: '### Definición formal


  Para sólidos semejantes con dimensión lineal $x$, el volumen se modela como $V(x)=a\cdot
  x^3$, con $a$ una constante geométrica (por ejemplo, $a=1$ para un cubo de arista
  $x$, o $a=\frac{4}{3}\pi$ para una esfera de radio $x$). Es un caso particular de
  función potencia con $n=3$.


  ### Desarrollo didáctico


  Si se duplica la arista de un cubo, de $x$ a $2x$, su volumen pasa de $x^3$ a $(2x)^3=8x^3$:
  se multiplica por $8$, no se duplica. Esta relación cúbica explica por qué objetos
  ligeramente más grandes pesan desproporcionadamente más.'
definiciones_clave: '- **Modelamiento de volúmenes de cuerpos geométricos mediante
  funciones potencia cúbicas**: Función de la forma $f(x) = a x^n$ con $a \neq 0$
  y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a modelamiento de volúmenes de cuerpos geométricos mediante
  funciones potencia cúbicas.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de modelamiento de volúmenes de cuerpos geométricos mediante funciones potencia
    cúbicas.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de modelamiento de volúmenes
    de cuerpos geométricos mediante funciones potencia cúbicas.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
