al_terminar_debes_poder: '**QUÉ:** Explicar y fundamentar algebraicamente por qué el número 1 no es primo ni compuesto.


  **CÓMO:** Demostrando que $\tau(1) = 1$ (no cumple $\tau(p)=2$ ni $\tau(c)\ge 3$) y justificando su estatus como unidad para garantizar la unicidad del Teorema Fundamental de la Aritmética.


  ![Resumen Caso del número 1 frente a la primalidad](/static/img/nodos/caso-del-numero-1-frente-a-la-primalidad-resumen.svg)'
