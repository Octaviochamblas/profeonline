semantic_id: MAT.NUM.NUMEROS_PRIMOS.UNO_NO_PRIMO_NO_COMPUESTO
resumen_inicial: "El número 1 es el único entero positivo que no es primo ni compuesto: solo tiene un divisor."
explicacion_simple: |
  Imagínate que en el reino de los números hay dos grandes clubes: el club de los Primos
  (números con exactamente 2 divisores) y el club de los Compuestos (números con más de 2
  divisores). El número 1 no puede entrar a ninguno de los dos, porque solo tiene un único
  divisor (él mismo). Es el rey solitario de los números, ¡un caso único y especial!
explicacion_formal: |
  El número $1$ no es primo porque la definición exige exactamente dos divisores
  distintos, y $1$ solo tiene uno. Tampoco es compuesto porque eso exige más de dos
  divisores. Si se considerara primo, la factorización prima perdería su unicidad: $6$
  podría escribirse como $2\cdot3$, $2\cdot3\cdot1$, $2\cdot3\cdot1^2$, etc. Por eso el $1$
  se clasifica como la **unidad** (elemento neutro multiplicativo).
definiciones_clave: |
  **Unidad**: en álgebra, el elemento neutro multiplicativo. El $1$ ocupa esta categoría
  especial, distinta de primo y de compuesto.
propiedades_relaciones: |
  El Teorema Fundamental de la Aritmética exige que cada número mayor que 1 tenga una
  única factorización prima; excluir al 1 de la definición de primo es lo que garantiza
  esa unicidad.
ejemplo_guiado:
  enunciado: "Explica por qué el número 1 no es primo ni compuesto."
  pasos:
    - "Contamos los divisores del 1: su único divisor es él mismo."
    - "Como no tiene dos divisores distintos, no es primo. Como no tiene más de dos, no es compuesto."
    - "Conclusión: el 1 es un caso especial, la unidad."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué pasaría con la factorización prima si el 1 se considerara primo?"
    choices:
      - {text: "Perdería su unicidad, ya que se podrían agregar infinitos factores de 1", is_correct: true}
      - {text: "No cambiaría nada", is_correct: false}
      - {text: "Todos los números dejarían de tener factorización prima", is_correct: false}
      - {text: "Solo afectaría a los números pares", is_correct: false}
    explanation: "La correcta es Perdería su unicidad, ya que se podrían agregar infinitos factores de 1: por ejemplo, $6=2\\cdot3=2\\cdot3\\cdot1=2\\cdot3\\cdot1^2\\ldots$"
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, ¿por qué el 0 no se clasifica igual que el 1?"
    choices:
      - {text: "Porque el 0 tiene infinitos divisores, mientras que el 1 tiene solo uno", is_correct: true}
      - {text: "Porque el 0 es primo", is_correct: false}
      - {text: "Porque el 0 es compuesto", is_correct: false}
      - {text: "Ambos se clasifican exactamente igual", is_correct: false}
    explanation: "La correcta es Porque el 0 tiene infinitos divisores, mientras que el 1 tiene solo uno: son casos especiales distintos."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
- 'Paso 1: Recuerda la definición de número primo: debe tener exactamente dos divisores distintos.'
- 'Paso 2: Recuerda la definición de número compuesto: debe tener tres o más divisores.'
- 'Paso 3: Analiza el número 1. Identifica que su único divisor es el 1. Al tener solo 1 divisor, concluye que no cumple ninguna de las dos definiciones.'
errores_correccion: |
  Un error frecuente es decir que el 1 es primo "porque solo se puede dividir por 1 y por
  sí mismo", sin notar que ambos son el mismo número. Otro error es clasificar al 1 como
  compuesto solo porque "no es primo".
ejemplos:
- titulo: Ejemplo 1
  enunciado: Explica detalladamente por qué el número $1$ no califica como número primo.
  alternativas:
    - "Porque tiene un solo divisor, no dos distintos"
    - "Porque es un número muy pequeño"
    - "Porque no es un número entero"
  respuesta: "Porque tiene un solo divisor, no dos distintos"
  solucion_pasos:
  - 'Paso a: Recordamos la definición de número primo: es un número entero mayor que $1$ que tiene exactamente dos divisores positivos distintos (el $1$ y él mismo).'
  - 'Paso b: Contamos los divisores del número $1$. Su único divisor es el $1$.'
  - 'Paso c: Dado que $1$ no tiene dos divisores distintos, no cumple la condición y por lo tanto no es un número primo.'
- titulo: Ejemplo 2
  enunciado: Explica por qué el número $1$ no califica como número compuesto.
  alternativas:
    - "Porque tiene un solo divisor, no más de dos"
    - "Porque es impar"
    - "Porque no tiene divisores"
  respuesta: "Porque tiene un solo divisor, no más de dos"
  solucion_pasos:
  - 'Paso a: Un número compuesto es un número natural que tiene más de dos divisores distintos.'
  - 'Paso b: Como el número $1$ solo tiene un divisor ($1$), no tiene más de dos divisores.'
  - 'Paso c: Al no cumplir con esta condición, concluimos que $1$ no es un número compuesto.'
- titulo: ¿Es el número $1$ el único entero positivo que no es primo ni compuesto?
  respuesta: Sí
  solucion_pasos:
  - 'Todos los números enteros mayores que $1$ ($2, 3, 4, 5, ...$) tienen al menos dos divisores ($1$ y sí mismos).'
  - 'Si un número mayor que $1$ tiene exactamente dos divisores, es primo. Si tiene más de dos, es compuesto.'
  - 'El número $1$ es el único entero positivo que tiene un solo divisor, por lo que queda fuera de ambas definiciones. Por ende, es el único caso especial.'
- titulo: ¿Si el número $1$ fuera primo, se mantendría la unicidad en la factorización de los números?
  respuesta: No
  solucion_pasos:
  - 'Si el $1$ fuera primo, podríamos agregar factores de $1$ infinitamente a cualquier descomposición prima (por ejemplo, escribir $10 = 2 \cdot 5 = 2 \cdot 5 \cdot 1 = 2 \cdot 5 \cdot 1 \cdot 1$, etc.).'
  - 'Esto destruiría la propiedad de unicidad del Teorema Fundamental de la Aritmética.'
  - 'Por lo tanto, la respuesta es No, la unicidad no se mantendría.'
errores_frecuentes:
- Decir que el 1 es primo "porque solo se puede dividir por 1 y por sí mismo", sin notar que ambos son el mismo número.
- Clasificar al 1 como compuesto argumentando que "como no es primo, debe ser compuesto".
- Olvidar la importancia de la unicidad del Teorema Fundamental de la Aritmética al justificar esta convención.
- Confundir el concepto de elemento neutro multiplicativo (unidad) con el concepto de número primo.
- Creer que el 0 y el 1 tienen la misma clasificación (ambos son casos especiales, pero el 0 no es un número natural o entero positivo en muchos contextos y tiene infinitos divisores, mientras que el 1 tiene solo uno).
afirmaciones_verdaderas:
  - "El número 1 es el único entero positivo que no es primo ni compuesto."
  - "El 1 se clasifica en álgebra como la unidad."
al_terminar_debes_poder: |
  Explicar por qué el número 1 no es primo ni compuesto, y justificar su importancia para
  la unicidad de la factorización prima.
fuente: Teoría de Números
estado: publicado
