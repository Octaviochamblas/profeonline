semantic_id: MAT.ALG.FACTOR_COMUN.RECONOCIMIENTO_MONOMIO
resumen_inicial: 'Reconocimiento del factor común monomio: concepto, método de descomposición
  y reglas en Factor común.'
explicacion_simple: Antes de extraer un factor común hay que identificar qué número
  y qué letras dividen exactamente a todos los términos del polinomio.
explicacion_formal: '### Definición formal


  Dado un polinomio con coeficientes $c_1, c_2, \dots, c_n$ y partes literales $x^{e_1},
  x^{e_2}, \dots, x^{e_n}$, el factor común monomio es el producto entre el Máximo
  Común Divisor de los coeficientes y la variable elevada al menor exponente presente
  en todos los términos.


  ### Desarrollo didáctico


  5 es el MCD de los coeficientes, y luego falta analizar las variables.


  La variable ''a'' se visualiza presente en los tres términos de la suma.


  4 es el MCD de 8, 4, y 12. y^2 es el menor exponente.'
definiciones_clave: '- **Reconocimiento del factor común monomio**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en reconocimiento del factor común monomio.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de reconocimiento
    del factor común monomio.
  pasos:
  - Identificar la estructura o los factores comunes en los términos del polinomio.
  - Aplicar la regla o método correspondiente a reconocimiento del factor común monomio.
  - Expresar el polinomio como un producto de dos o más factores.
  - Verificar multiplicando los factores resultantes.
