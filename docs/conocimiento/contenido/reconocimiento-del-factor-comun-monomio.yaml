resumen_inicial: El reconocimiento del factor común monomio consiste en identificar
  los coeficientes numéricos y las variables algebraicas presentes en todos los términos
  de un polinomio.
explicacion_simple: Para saber cuál es el factor común en un polinomio como $6x^3
  + 12x^2$, buscas el divisor común más grande de las cifras ($6$ y $12 \to 6$) y
  la variable que esté en todos los términos con su menor exponente ($x^3$ y $x^2
  \to x^2$). El factor común monomio es $6x^2$.
explicacion_formal: 'Sea $P(x_1, \dots, x_k) = \sum_{i=1}^m c_i M_i$ un polinomio
  con términos $c_i M_i$. El **Factor Común Monomio** $F$ se define como:


  $$F = \text{MCD}(c_1, c_2, \dots, c_m) \cdot \prod_{j=1}^p x_j^{\min(e_{j1}, e_{j2},
  \dots, e_{jm})}$$


  **Desglose simbólico:**

  - $\text{MCD}(c_1, \dots, c_m)$: Máximo común divisor numérico entre los coeficientes
  enteros.

  - $x_j^{\min(e_{ji})}$: Cada variable común elevada al menor de sus exponentes presentes
  en el polinomio.


  > **Complemento didáctico:** Permite aislar la estructura monomial común de mayor
  grado que divide exactamente a cada término.'
definiciones_clave: '- **Factor común monomio**: Monomio de mayor coeficiente y exponente
  que divide a cada término del polinomio.

  - **Variable común**: Letra contenida simultáneamente en la totalidad de los sumandos.'
propiedades_relaciones: '- **Criterio de pertenencia**: Si una variable falta en al
  menos un sumando, su exponente mínimo es 0 y no forma parte del factor común.'
ejemplo_guiado:
  enunciado: Determine el factor común monomio del polinomio $15a^4b^2 - 10a^3b^3
    + 20a^2b^4$.
  pasos:
  - 'Paso 1: Obtener el MCD de los coeficientes $15, 10, 20 \to \text{MCD} = 5$.'
  - 'Paso 2: Analizar la variable $a$: los exponentes son $4, 3, 2 \to \text{menor}
    = a^2$.'
  - 'Paso 3: Analizar la variable $b$: los exponentes son $2, 3, 4 \to \text{menor}
    = b^2$.'
  - 'Paso 4: Multiplicar el factor numérico y literal: $5 \cdot a^2 \cdot b^2 = 5a^2b^2$.'
  - 'Conclusión: El factor común monomio es $5a^2b^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se elige el exponente de una variable común para formar el factor
    común monomio?
  choices:
  - text: Se selecciona el menor exponente con el que aparece la variable en el polinomio
    is_correct: true
  - text: Se selecciona el mayor exponente
    is_correct: false
  - text: Se suman todos los exponentes
    is_correct: false
  - text: Se calcula el promedio de los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Se selecciona el menor exponente con el
    que aparece la variable en el polinomio'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el polinomio $15a^4b^2 - 10a^3b^3 + 20a^2b^4$, ¿cuál es el factor común
    monomio?
  choices:
  - text: $5a^2b^2$
    is_correct: true
  - text: $10a^3b^3$
    is_correct: false
  - text: $5ab$
    is_correct: false
  - text: $20a^4b^4$
    is_correct: false
  explanation: La alternativa correcta es '$5a^2b^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el MCD de los coeficientes numéricos.'
- 'Paso 2: Identificar las variables que se repitan en todos los términos.'
- 'Paso 3: Asignar a cada variable común su menor exponente y multiplicar los resultados.'
errores_correccion: '- **Error 1: Incluir en el factor común variables que no están
  presentes en la totalidad de los términos.** **Cómo corregirlo:** Una variable solo
  pertenece al factor común si aparece en TODOS los sumandos del polinomio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el factor común monomio en $8x^3y + 12x^2z$?
  alternativas:
  - $4x^2$
  - $4x^2yz$
  - $8x^2$
  respuesta: $4x^2$
  solucion_pasos:
  - 1. MCD(8, 12) = 4.
  - '2. Variable $x$: menor exponente $x^2$. Variables $y, z$ no son comunes.'
  - '3. Factor común: $4x^2$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el factor común en $9m^2n^3 - 3mn^2$?
  alternativas:
  - $3mn^2$
  - $9mn^2$
  - $3m^2n^3$
  respuesta: $3mn^2$
  solucion_pasos:
  - 1. MCD(9, 3) = 3.
  - 2. Menor exponente de $m$ es 1 ($m$), de $n$ es 2 ($n^2$).
  - '3. Factor común: $3mn^2$.'
- titulo: ¿Es $x^2$ el factor común monomio en $x^5 - x^3 + x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, MCD es 1 y el menor exponente de $x$ es 2 ($x^2$).
- titulo: ¿Puede formar parte del factor común monomio una variable que no aparezca
    en todos los términos?
  respuesta: 'No'
  solucion_pasos:
  - No, debe ser compartida por la totalidad de los sumandos.
errores_frecuentes:
- Seleccionar el mayor exponente de una variable en lugar del menor exponente común.
- Incluir en el factor común variables que solo aparecen en algunos términos del polinomio.
- Usar la suma de los coeficientes numéricos en lugar del Máximo Común Divisor (MCD).
- Declarar que los coeficientes primos entre sí impiden la existencia de factor común
  literal.
- Declarar que el factor común monomio debe tener el mismo número de términos que
  el polinomio.
afirmaciones_verdaderas:
- El factor común monomio utiliza el menor exponente de cada variable presente en
  todos los términos.
- El coeficiente numérico del factor común monomio es el Máximo Común Divisor (MCD)
  de los coeficientes.
al_terminar_debes_poder: Al terminar serás capaz de identificar el factor común monomio
  de cualquier polinomio algebraico.
