semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_PAR_A_NEGATIVO
resumen_inicial: 'El conjunto recorrido de una función potencia de exponente entero par positivo con coeficiente negativo ($a < 0$) son los reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$.'
explicacion_simple: |
  En una función potencia con exponente par (como $x^2, x^4, x^6$) y coeficiente negativo (como $a = -2$), la potencia $x^n$ produce siempre un número no negativo ($y \ge 0$). Sin embargo, al multiplicarlo por el número negativo $a$, el resultado final invierte su signo haciéndose siempre cero o negativo. La mayor altura posible en la gráfica es cero (en el origen $(0, 0)$), y desde ahí la curva cae hacia abajo. Por ende, su recorrido son los números reales menores o iguales a cero: $]-\infty, 0]$.
explicacion_formal: |
  ### Definición formal
  Para toda función potencia $f(x) = a x^n$ definida en $\mathbb{R}$ con exponente par positivo $n = 2k (k \in \mathbb{Z}^+)$ y coeficiente estrictamente negativo **$a < 0$**, el **conjunto recorrido o conjunto imagen** está acotado superiormente por cero:
  $$\operatorname{Rec}(f) = ]-\infty, 0] = \{y \in \mathbb{R} \mid y \le 0\}$$

  ### Demostración analítica
  1. **Acotación superior**: Dado que $x^{2k} \ge 0$ para todo $x \in \mathbb{R}$ y $a < 0$, el producto $a x^{2k} \le 0$ para todo $x$. El valor máximo absoluto es $f(0) = a(0)^{2k} = 0$.
  2. **Divergencia inferior**: Cuando $x \to \pm\infty$, $f(x) \to -\infty$.
  3. **Continuidad e Invarianza por el Teorema del Valor Intermedio**: Al ser $f$ continua en $\mathbb{R}$ con máximo en 0 y límite en $-\infty$, la función adopta todos los valores del intervalo semicerrado $]-\infty, 0]$.

  ### Síntesis didáctica
  Relación de cota: El vértice $(0, 0)$ actúa como el **máximo absoluto global** de la función, fijando la cota superior cerrada $0]$ del intervalo recorrido.
definiciones_clave: |
  - **Recorrido $]-\infty, 0]$**: Conjunto de valores de salida $y$ menores o iguales a cero.
  - **Máximo absoluto global**: Punto $(0, 0)$ donde la función alcanza su mayor ordenada posible $y = 0$.
  - **Acotación superior**: Propiedad por la cual la función no adopta valores reales estrictamente positivos ($y > 0$).
propiedades_relaciones: |
  - **Inversión por el signo de $a$**: El conjunto recorrido $]-\infty, 0]$ (para $a < 0$) es la reflexión exacta del conjunto $[0, +\infty[$ (para $a > 0$) a través del punto cero.
  - **Efecto de traslaciones verticales**: Si se suma una constante $k$ ($f(x) = a x^{2m} + k$ con $a < 0$), el recorrido se transforma al intervalo $]-\infty, k]$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de las funciones potencia $f(x) = -3x^2$ y $g(x) = -0.1x^4$, justificando a partir del valor de su máximo absoluto.'
  pasos:
    - 'Paso 1: Para $f(x) = -3x^2$, $n = 2$ es par y $a = -3 < 0$. Evaluando en $x = 0$: $f(0) = -3(0)^2 = 0$. Para todo $x \neq 0$, $f(x) < 0$. Recorrido: $\operatorname{Rec}(f) = ]-\infty, 0]$.'
    - 'Paso 2: Para $g(x) = -0.1x^4$, $n = 4$ es par y $a = -0.1 < 0$. Evaluando en $x = 0$: $g(0) = 0$. Para todo $x \neq 0$, $g(x) < 0$. Recorrido: $\operatorname{Rec}(g) = ]-\infty, 0]$.'
    - 'Paso 3: Conclusión: En ambas funciones, el máximo absoluto se ubica en $y = 0$, determinando el intervalo recorrido de los reales no positivos $]-\infty, 0]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función potencia $f(x) = -5x^6$ con exponente par positivo y coeficiente negativo $a = -5 < 0$?'
    choices:
      - {text: 'El intervalo de reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$', is_correct: true}
      - {text: 'El intervalo de reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$', is_correct: false}
      - {text: 'El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
      - {text: 'El intervalo abierto $]-\infty, -5[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo de reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$''. Con exponente par y $a < 0$, las ordenadas $y$ son siempre menores o iguales a cero.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $f(x) = -2x^4$ jamás puede arrojar como resultado un valor positivo como $y = 8$?'
    choices:
      - {text: 'Porque para todo $x \in \mathbb{R}$, $x^4 \ge 0$, y al multiplicarlo por $a = -2 < 0$, la salida es siempre $y \le 0$', is_correct: true}
      - {text: 'Porque el número 8 no pertenece al dominio', is_correct: false}
      - {text: 'Porque el exponente 4 convierte el resultado en negativo', is_correct: false}
      - {text: 'Porque las funciones potencia no se pueden evaluar en números positivos', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque para todo $x \in \mathbb{R}$, $x^4 \ge 0$, y al multiplicarlo por $a = -2 < 0$, la salida es siempre $y \le 0$''. La multiplicación por un coeficiente negativo invierte el signo de todas las salidas no negativas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que el exponente $n$ sea un número entero positivo par ($n = 2, 4, 6\dots$).'
  - 'Paso 2: Comprobar que el coeficiente multiplicativo sea estrictamente negativo ($a < 0$).'
  - 'Paso 3: Identificar el máximo absoluto en el punto cartesiano $(0, 0)$ donde $f(0) = 0$.'
  - 'Paso 4: Declarar que el conjunto recorrido es el intervalo cerrado por la derecha $\operatorname{Rec}(f) = ]-\infty, 0]$.'
errores_correccion: |
  - **Error 1:** Afirmar que el recorrido son los reales positivos $[0, +\infty[$ por tener exponente par. **Cómo corregirlo:** El exponente par hace que $x^n \ge 0$, pero multiplicar por $a < 0$ invierte las salidas a negativas ($y \le 0$). El recorrido es $]-\infty, 0]$.
  - **Error 2:** Escribir el recorrido con intervalo abierto en cero $]-\infty, 0[$. **Cómo corregirlo:** El valor cero sí se alcanza en el origen $f(0) = 0$. El corchete en el cero debe ser cerrado: $]-\infty, 0]$.
ejemplos:
  - titulo: 'Recorrido en exponente par negativo multiplicativo'
    enunciado: '¿El recorrido de $f(x) = -x^2$ es $]-\infty, 0]$?'
    alternativas:
      - 'Sí, $]-\infty, 0]$'
      - 'No, es $[0, +\infty[$'
      - 'No, es $\mathbb{R}$'
    respuesta: 'Sí, $]-\infty, 0]$'
    solucion_pasos:
      - '1. Exponente par $n = 2$ y $a = -1 < 0$.'
      - '2. El máximo es $y = 0 \implies \operatorname{Rec}(f) = ]-\infty, 0]$.'
  - titulo: 'Recorrido con coeficiente decimal negativo'
    enunciado: '¿La función $g(x) = -0.25 x^4$ tiene recorrido $]-\infty, 0]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -0.25 < 0$ y $n=4$ par, $\operatorname{Rec}(g) = ]-\infty, 0]$.'
  - titulo: 'Imposibilidad de salidas positivas'
    enunciado: '¿Existe algún $x \in \mathbb{R}$ tal que $f(x) = -3x^8 = 12$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Puesto que el recorrido es $]-\infty, 0]$, el valor $+12$ no posee preimagen real.'
  - titulo: 'Cota superior en el origen'
    enunciado: '¿El punto $(0, 0)$ marca el valor máximo del recorrido de $f(x) = -7x^6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(0) = 0$ es la mayor altura alcanzada en la función.'
errores_frecuentes:
  - 'El conjunto recorrido de la función potencia $f(x) = -4x^2$ es el intervalo $[0, +\infty[$.'
  - 'El recorrido de $f(x) = -x^4$ es el intervalo abierto $]-\infty, 0[$ excluyendo al cero.'
  - 'Una función potencia de exponente par con $a < 0$ arroja resultados positivos para entradas $x > 0$.'
  - 'El coeficiente $a = -5$ fija el máximo del recorrido en $y = -5$.'
  - 'El conjunto recorrido de $f(x) = -2x^6$ abarca todos los números reales $\mathbb{R}$.'
afirmaciones_verdaderas:
  - 'El conjunto recorrido de toda función potencia de exponente entero par positivo con $a < 0$ es el conjunto de los reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$.'
  - 'El origen $(0, 0)$ representa el máximo absoluto global de la función, fijando la cota superior cerrada del recorrido en $y = 0$.'
al_terminar_debes_poder: |
  QUÉ: Calcular el recorrido de una función potencia de exponente par positivo con $a < 0$.
  CÓMO: Identificar el valor máximo absoluto $y = 0$ en el origen declarando $\text{Rec} = ]-\infty, 0]$.
