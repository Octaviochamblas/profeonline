semantic_id: MAT.NUM.RAICES_PROPIEDADES.DESCOMPOSICION_RADICANDO
resumen_inicial: 'La descomposición del radicando permite simplificar raíces no exactas factorizando el número interno como el producto de una potencia perfecta y un residuo irreducible.'
explicacion_simple: |
  Muchas raíces no son números enteros exactos (como $\sqrt{72}$ o $\sqrt{50}$), pero pueden simplificarse descomponiendo su interior. Buscas el cuadrado perfecto más grande (como 4, 9, 16, 25, 36, 49, 64, 81, 100) que divida exactamente al número de adentro. Luego extraes la raíz de ese cuadrado perfecto y dejas el resto adentro. Por ejemplo, en $\sqrt{72}$, descompones $72 = 36 \cdot 2$, extraes $\sqrt{36} = 6$ y obtienes $6\sqrt{2}$.
explicacion_formal: |
  ### Definición formal
  La **descomposición del radicando** es el método aritmético de simplificación que factoriza un radicando entero $K \in \mathbb{Z}^+$ en un producto de la forma:
  $$K = A^n \cdot B$$
  donde $A^n$ es la mayor potencia $n$-ésima perfecta divisible por $K$, y $B$ es un entero libre de factores potencia $n$-ésimas, permitiendo simplificar el radical según:
  $$\sqrt[n]{K} = \sqrt[n]{A^n \cdot B} = A \cdot \sqrt[n]{B}$$

  ### Algoritmo de Descomposición mediante Primos
  1. Realizar la **descomposición en factores primos** del radicando $K = p_1^{e_1} \cdot p_2^{e_2} \cdots p_k^{e_k}$.
  2. Expresar los exponentes como $e_i = q_i \cdot n + r_i$.
  3. Extraer las bases con exponentes cocientes $q_i$ y conservar dentro los residuos $r_i$.

  ### Síntesis didáctica
  - Factor potencia perfecta $A^n$: Se simplifica saliendo como el coeficiente $A$.
  - Factor residuo irreducible $B$: Permanece dentro del radical $\sqrt[n]{B}$.
definiciones_clave: |
  - **Descomposición del radicando**: Factorización estratégica del contenido de una raíz para extraer cuadrados o potencias perfectas.
  - **Potencia perfecta divisible**: Número entero (ej: 4, 9, 16, 25, 27, 64) que divide exactamente al radicando.
  - **Radical irreducible $\sqrt[n]{B}$**: Forma canónica final donde el radicando $B$ no contiene divisores que sean potencias perfectas.
propiedades_relaciones: |
  - **Requisito para operar radicales**: Es el paso previo indispensable para sumar o restar raíces que inicialmente no parecen semejantes (ej: $\sqrt{12} + \sqrt{27} = 2\sqrt{3} + 3\sqrt{3} = 5\sqrt{3}$).
  - **Forma canónica estandarizada**: Permite expresar respuestas en la forma irreducible simplificada exigida en pruebas estandarizadas (PAES).
ejemplo_guiado:
  enunciado: 'Simplifica la raíz cuadrada $\sqrt{200}$ descomponiendo el radicando en sus factores de mayor cuadrado perfecto.'
  pasos:
    - 'Paso 1: Buscamos divisores de $200$ que sean cuadrados perfectos ($4, 25, 100$). Identificamos el mayor: $100$.'
    - 'Paso 2: Factorizamos el radicando como producto: $200 = 100 \cdot 2 = 10^2 \cdot 2$.'
    - 'Paso 3: Aplicamos la raíz a cada factor: $\sqrt{200} = \sqrt{10^2 \cdot 2} = \sqrt{10^2} \cdot \sqrt{2}$.'
    - 'Paso 4: Extraemos la raíz exacta de $10^2$: resultado $10\sqrt{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué consiste el método de descomposición del radicando para simplificar una raíz $\sqrt[n]{K}$?'
    choices:
      - {text: 'En expresar el radicando como producto de una potencia perfecta $A^n$ y un residuo $B$, extrayendo $A$ fuera de la raíz ($A \cdot \sqrt[n]{B}$)', is_correct: true}
      - {text: 'En dividir el radicando por 2 e igualar la raíz a un entero', is_correct: false}
      - {text: 'En sumar los factores primos dentro de la raíz', is_correct: false}
      - {text: 'En restar el índice del número interno', is_correct: false}
    explanation: 'La alternativa correcta es ''En expresar el radicando como producto de una potencia perfecta $A^n$ y un residuo $B$, extrayendo $A$ fuera de la raíz ($A \cdot \sqrt[n]{B}$)''. Se factoriza $K = A^n \cdot B$ y se saca $A$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma simplificada irreducible de la raíz cuadrada $\sqrt{72}$?'
    choices:
      - {text: '$6\sqrt{2}$, pues $72 = 36 \cdot 2 \implies \sqrt{36} \cdot \sqrt{2} = 6\sqrt{2}$', is_correct: true}
      - {text: '$2\sqrt{6}$, factorizando incorrectamente', is_correct: false}
      - {text: '$3\sqrt{8}$, sin usar el mayor cuadrado perfecto', is_correct: false}
      - {text: '$36\sqrt{2}$, sin extraer la raíz cuadrada a 36', is_correct: false}
    explanation: 'La alternativa correcta es ''$6\sqrt{2}$, pues $72 = 36 \cdot 2 \implies \sqrt{36} \cdot \sqrt{2} = 6\sqrt{2}$''. Elegir $36$ como mayor cuadrado perfecto da la forma irreducible $6\sqrt{2}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el mayor cuadrado o potencia perfecta ($4, 9, 16, 25, 36, 49\dots$) que divida exactamente al radicando.'
  - 'Paso 2: Escribir el radicando como el producto del cuadrado perfecto por el factor restante.'
  - 'Paso 3: Separar la raíz utilizando la propiedad distributiva del producto.'
  - 'Paso 4: Calcular la raíz exacta de la potencia perfecta y colocar el resultado multiplicando por fuera del radical irreducible.'
errores_correccion: |
  - **Error 1:** No seleccionar el **mayor** cuadrado perfecto al descomponer (ej: descomponer $\sqrt{72} = \sqrt{4 \cdot 18} = 2\sqrt{18}$ y detenerse ahí). **Cómo corregirlo:** Si el radicando residual (18) aún contiene cuadrados perfectos ($9 \cdot 2$), debes continuar simplificando hasta que no queden factores extraíbles: $2 \cdot 3\sqrt{2} = 6\sqrt{2}$.
  - **Error 2:** Descomponer el radicando en una suma en lugar de un producto (ej: $\sqrt{25 + 9} = 5 + 3 = 8$). **Cómo corregirlo:** La raíz **no es distributiva respecto a la suma**. La descomposición del radicando exige estrictamente una **multiplicación**: $\sqrt{A \cdot B}$.
ejemplos:
  - titulo: 'Descomposición de raíz de 48'
    enunciado: '¿La descomposición simplificada de $\sqrt{48}$ es $4\sqrt{3}$?'
    alternativas:
      - 'Sí, usando $48 = 16 \cdot 3 \implies 4\sqrt{3}$'
      - 'No, es $2\sqrt{12}$'
      - 'No, es $3\sqrt{4}$'
    respuesta: 'Sí, usando $48 = 16 \cdot 3 \implies 4\sqrt{3}$'
    solucion_pasos:
      - '1. Buscamos el mayor cuadrado perfecto divisor: $16$.'
      - '2. Factorizamos $48 = 16 \cdot 3 \implies \sqrt{16} \cdot \sqrt{3} = 4\sqrt{3}$.'
  - titulo: 'Descomposición de raíz de 300'
    enunciado: '¿La simplificación de $\sqrt{300}$ equivale a $10\sqrt{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $300 = 100 \cdot 3 \implies \sqrt{100} \cdot \sqrt{3} = 10\sqrt{3}$.'
  - titulo: 'Descomposición en raíz cúbica'
    enunciado: '¿La simplificación de la raíz cúbica $\sqrt[3]{40}$ resulta en $2\sqrt[3]{5}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El mayor cubo perfecto divisor es $8 \implies \sqrt[3]{8 \cdot 5} = 2\sqrt[3]{5}$.'
  - titulo: 'Forma irreducible'
    enunciado: '¿Una raíz está completamente simplificada cuando el radicando no tiene divisores cuadrados mayores que 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la definición de la forma canónica irreducible.'
errores_frecuentes:
  - 'Descomponer el radicando en una suma de dos enteros y aplicar la raíz a cada sumando individual.'
  - 'Detener el proceso de simplificación cuando el radicando restante aún contiene un cuadrado perfecto divisible.'
  - 'Dividir el radicando entre 2 y sacar la mitad del número fuera de la raíz.'
  - 'La descomposición del radicando se realiza dividiendo por factores primos en lugar de divisores cuadrados perfectos.'
  - 'Restar el cuadrado perfecto del radicando en lugar de dividir por él.'
afirmaciones_verdaderas:
  - 'La descomposición del radicando consiste en expresar el número interno como producto de la mayor potencia perfecta posible y un factor residual para extraer dicha potencia fuera del radical.'
  - 'Una raíz está en su forma canónica más simplificada cuando el radicando interior no posee divisores que sean potencias perfectas del mismo índice.'
al_terminar_debes_poder: 'Descomponer el radicando en potencias perfectas divisibles para reducir cualquier raíz a su forma canónica simplificada irreducible.'
