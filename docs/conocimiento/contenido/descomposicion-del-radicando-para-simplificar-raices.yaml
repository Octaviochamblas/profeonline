semantic_id: MAT.NUM.RAICES_PROPIEDADES.DESCOMPOSICION_RADICANDO
resumen_inicial: La descomposición del radicando consiste en expresar el número interno
  como producto de un cuadrado (o potencia) perfecto y otro factor, para simplificar
  el radical.
explicacion_simple: 'Para simplificar una raíz como $\sqrt{50}$ que no es exacta:

  1. Buscas dos números que multiplicados den $50$, donde uno de ellos tenga raíz
  cuadrada exacta ($50 = 25 \cdot 2$).

  2. Separas las raíces: $\sqrt{25 \cdot 2} = \sqrt{25} \cdot \sqrt{2}$.

  3. Calculas la raíz exacta: $5\sqrt{2}$.'
explicacion_formal: Para $\sqrt[n]{A}$, se descompone $A = m^n \cdot k$ donde $m^n$
  es la mayor potencia $n$-ésima perfecta que divide a $A$. Luego $\sqrt[n]{A} = \sqrt[n]{m^n
  \cdot k} = m\sqrt[n]{k}$.
definiciones_clave: '- **Descomposición en factor potencia perfecta**: Búsqueda del
  mayor factor $m^n$ divisible en el radicando.'
propiedades_relaciones: '- **Forma simplificada de un radical**: Expresión $m\sqrt[n]{k}$
  donde $k$ no contiene ningún factor potencia $n$-ésima perfecta.'
ejemplo_guiado:
  enunciado: Simplifica la raíz $\sqrt{72}$ mediante la descomposición de su radicando.
  pasos:
  - 'Buscamos el mayor cuadrado perfecto que divida a 72: $36$ (pues $36 \cdot 2 =
    72$).'
  - 'Descomponer: $\sqrt{72} = \sqrt{36 \cdot 2}$.'
  - 'Separar radicales: $\sqrt{36} \cdot \sqrt{2}$.'
  - 'Calcular la raíz exacta $\sqrt{36} = 6$ y mantener $\sqrt{2}$: $6\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la simplificación de $\sqrt{12}$?
  choices:
  - text: 2\sqrt{3}
    is_correct: true
  - text: 3\sqrt{2}
    is_correct: false
  - text: 4\sqrt{3}
    is_correct: false
  - text: 6\sqrt{2}
    is_correct: false
  explanation: 'La correcta es: 2\sqrt{3}. $\sqrt{12} = \sqrt{4 \cdot 3} = 2\sqrt{3}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Simplifica $\sqrt{200}$.
  choices:
  - text: 10\sqrt{2}
    is_correct: true
  - text: 20\sqrt{2}
    is_correct: false
  - text: 5\sqrt{8}
    is_correct: false
  - text: 2\sqrt{10}
    is_correct: false
  explanation: 'La correcta es: 10\sqrt{2}. $\sqrt{200} = \sqrt{100 \cdot 2} = 10\sqrt{2}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Buscar el mayor cuadrado (o cubo) perfecto que divida exactamente al radicando.'
- 'Paso 2: Escribir el radicando como el producto de dicho número por el residuo.'
- 'Paso 3: Extraer la raíz del cuadrado perfecto y colocarla como coeficiente multiplicador
  exterior.'
- 'Paso 4: Dejar el residuo dentro de la raíz.'
errores_correccion: Asegúrate de elegir el **mayor** cuadrado perfecto. Si en $\sqrt{32}$
  usas $4 \cdot 8$ te dará $2\sqrt{8}$, la cual aún se puede seguir simplificando.
  Usa $16 \cdot 2 = 32$ para obtener directamente $4\sqrt{2}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $\sqrt{48}$.
  alternativas:
  - 4\sqrt{3}
  - 2\sqrt{12}
  - 16\sqrt{3}
  respuesta: 4\sqrt{3}
  solucion_pasos:
  - $\sqrt{16 \cdot 3} = 4\sqrt{3}$.
errores_frecuentes:
- No utilizar el mayor cuadrado perfecto posible en la descomposición.
afirmaciones_verdaderas:
- $\sqrt{A} = m\sqrt{k}$ si $A = m^2 \cdot k$.
al_terminar_debes_ponder: Simplificar radicales descomponiendo el radicando en factores
  convenientes.
fuente: Texto escolar MINEDUC.
estado: publicado
