resumen_inicial: La descomposición del radicando consiste en factorizar el número
  interno como producto de un cuadrado (o potencia) perfecto y un factor no simplificable
  para reducir la raíz.
explicacion_simple: 'Simplificar una raíz grande como $\sqrt{50}$ consiste en descomponer
  $50$ en $25 \cdot 2$. Como $25$ tiene raíz cuadrada exacta ($5$), sacamos el $5$
  afuera y dejamos el $2$ atrapado adentro: $5\sqrt{2}$.'
explicacion_formal: 'Para simplificar $\sqrt[n]{x}$, se realiza la **Factorización
  por Potencias Perfectas**:


  $$x = a^n \cdot b \implies \sqrt[n]{x} = \sqrt[n]{a^n \cdot b} = a \cdot \sqrt[n]{b}$$


  **Pasos clave:**

  - Identificar el mayor factor potencia $n$-ésima perfecta de $x$.

  - Extraer su raíz e incorporar el resto bajo el radical.'
definiciones_clave: '- **Descomposición del radicando**: Técnica de factorización
  $x = a^n \cdot b$ para expresar raíces en forma irreducible.'
propiedades_relaciones: '- **Factorización por potencias perfectas**: Reduce el radicando
  a su menor entero equivalente.'
ejemplo_guiado:
  enunciado: Descomponga y simplifique el radical $\sqrt{72}$.
  pasos:
  - 'Paso 1: Buscar el mayor cuadrado perfecto que divida a $72$: $72 = 36 \cdot 2$.'
  - 'Paso 2: Aplicar la propiedad distributiva: $\sqrt{36 \cdot 2} = \sqrt{36} \cdot
    \sqrt{2}$.'
  - 'Paso 3: Extraer la raíz exacta del cuadrado perfecto: $6\sqrt{2}$.'
  - 'Conclusión: $\sqrt{72} = 6\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la descomposición del radicando para simplificar una
    raíz?
  choices:
  - text: En expresar el radicando como producto de una potencia perfecta y extraer
      su raíz (a · sqrt[n]{b})
    is_correct: true
  - text: En restar el índice al radicando
    is_correct: false
  - text: En dividir por 100
    is_correct: false
  - text: En cambiar la raíz por una adición
    is_correct: false
  explanation: La alternativa correcta es 'En expresar el radicando como producto
    de una potencia perfecta y extraer su raíz (a · sqrt[n]{b})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(72), ¿cuál fue la expresión irreducible
    obtenida?
  choices:
  - text: 6 · sqrt(2)
    is_correct: true
  - text: 36 · sqrt(2)
    is_correct: false
  - text: 2 · sqrt(6)
    is_correct: false
  - text: 9 · sqrt(8)
    is_correct: false
  explanation: La alternativa correcta es '6 · sqrt(2)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de descomponer el radicando en factores
  potencias perfectas, expresando raíces en su forma más simplificada irreducible.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.DESCOMPOSICION_RADICANDO
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.DESCOMPOSICION_RADICANDO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
