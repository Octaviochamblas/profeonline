semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.DEFINICION
resumen_inicial: 'Reconocimiento de inecuación con valor absoluto: relaciones de orden,
  intervalos y resolución en Inecuaciones con valor absoluto.'
explicacion_simple: El valor absoluto representa una distancia. Cuando resolvemos
  inecuaciones con valor absoluto, estamos buscando todos los puntos cuya distancia
  a un cierto valor cumple una condición determinada, como ser menor o mayor a cierta
  cantidad.
explicacion_formal: "### Definición formal\nUna inecuación con valor absoluto es una\
  \ desigualdad que contiene a la incógnita dentro de barras de valor absoluto. Las\
  \ formas básicas son $|x| < a$, $|x| \\\\le a$, $|x| > a$ y $|x| \\\\ge a$, donde\
  \ $a$ es un número real positivo. \n\nPor las propiedades del valor absoluto, estas\
  \ inecuaciones se traducen de la siguiente manera:\n1. Si $|x| < a$ (con $a > 0$),\
  \ entonces $-a < x < a$.\n2. Si $|x| > a$ (con $a > 0$), entonces $x < -a$ o $x\
  \ > a$.\n\n### Desarrollo didáctico\nPiensa en $|x|$ como la distancia desde el\
  \ número $x$ hasta el cero en la recta numérica. Si decimos $|x| < 3$, estamos pidiendo\
  \ todos los números cuya distancia al cero sea menor que $3$. Visualmente, esto\
  \ incluye todos los números entre $-3$ y $3$.\n\nPor otro lado, si decimos $|x|\
  \ > 3$, buscamos aquellos números que estén a una distancia mayor que $3$ del cero.\
  \ Esto ocurre para números menores que $-3$ (como el $-4, -5$) y también para números\
  \ mayores que $3$ (como el $4, 5$).\n\nCuando la inecuación involucra una expresión\
  \ más compleja, como $|x - b| < a$, esto se interpreta como \"la distancia entre\
  \ $x$ y $b$ es menor que $a$\". Aplicar las propiedades nos permite eliminar el\
  \ valor absoluto y resolver las inecuaciones resultantes como lo haríamos normalmente."
definiciones_clave: '- **Reconocimiento de inecuación con valor absoluto**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a reconocimiento de inecuación con valor
  absoluto.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de reconocimiento
    de inecuación con valor absoluto.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de reconocimiento de inecuación con valor
    absoluto, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
