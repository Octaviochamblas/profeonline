semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.DEFINICION
resumen_inicial: Una inecuación con valor absoluto condiciona la distancia de una
  expresión matemática respecto a un origen o valor de referencia.
explicacion_simple: 'El **valor absoluto** $|x|$ representa la distancia de un número
  $x$ al cero en la recta numérica.

  Una **inecuación con valor absoluto** (como $|x| < 4$ o $|x - 3| \ge 5$) impone
  restricciones sobre esa distancia.

  Por ejemplo, $|x| < 4$ significa ''todos los números cuya distancia al cero es estrictamente
  menor a 4 unidades'', lo que corresponde al intervalo entre $-4$ y $4$.'
explicacion_formal: 'Una **inecuación con valor absoluto** involucra la función distancia
  $d(x, 0) = |x|$ o $d(x, c) = |x - c|$ formulada como:


  $$|P(x)| \ R \ k \quad \text{con } R \in \{<, >, \le, \ge\} \quad \text{y } k \in
  \mathbb{R}$$


  **Desglose de la fórmula:**

  - $|P(x)|$: Valor absoluto del polinomio algebraico que mide la magnitud sin signo.

  - $k$: Constante real de comparación de la distancia.'
definiciones_clave: '- **Valor absoluto ($|x|$)**: Función distancia real definida
  como $|x| = x$ si $x \ge 0$ y $|x| = -x$ si $x < 0$.

  - **Distancia entre puntos**: La expresión $|x - c|$ mide la distancia geométrica
  entre los puntos $x$ y $c$ sobre la recta real.'
propiedades_relaciones: '- **No negatividad intrínseca**: El valor absoluto de cualquier
  expresión real es siempre mayor o igual a cero ($|P(x)| \ge 0$).'
ejemplo_guiado:
  enunciado: Interpreta la inecuación $|x - 2| < 3$ como una distancia en la recta
    numérica y determina los valores de $x$ que la satisfacen.
  pasos:
  - 'Paso 1: Interpretar geométricamente: la distancia entre el número $x$ y el centro
    $2$ debe ser menor a $3$ unidades.'
  - 'Paso 2: Calcular el límite izquierdo: $2 - 3 = -1$.Paso 3: Calcular el límite
    derecho: $2 + 3 = 5$.Paso 4: Concluir que el conjunto solución es el intervalo
    abierto $S = ]-1, 5[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa geométricamente la expresión $|x - 2| < 3$ en la recta
    numérica?
  choices:
  - text: El conjunto de números $x$ cuya distancia al punto $2$ es estrictamente
      menor que $3$ unidades.
    is_correct: true
  - text: La suma de los números $x$ y $2$ multiplicada por $3$.
    is_correct: false
  - text: Un sistema de tres ecuaciones cuadráticas.
    is_correct: false
  - text: La distancia fija exacta igual a cero.
    is_correct: false
  explanation: La alternativa correcta es 'El conjunto de números $x$ cuya distancia
    al punto $2$ es estrictamente menor que $3$ unidades.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la distancia $|x - 2| < 3$, ¿cuál es el intervalo solución
    obtenido?
  choices:
  - text: $S = ]-1, 5[$
    is_correct: true
  - text: $S = [-1, 5]$
    is_correct: false
  - text: $S = ]2, 3[$
    is_correct: false
  - text: $S = ]-\infty, 3[$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-1, 5[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión dentro del valor absoluto y la constante de comparación
  $k$.'
- 'Paso 2: Determinar si la desigualdad condiciona un acotamiento cerrado (menor que)
  o una separación (mayor que).'
- 'Paso 3: Traducir a las desigualdades sin valor absoluto equivalentes.'
- 'Paso 4: Resolver y presentar la solución en notación de intervalo.'
errores_correccion: '- **Error común:** Quitar las barras de valor absoluto sin descomponer
  en los dos casos de distancia.

  - **Cómo corregirlo:** Las barras de valor absoluto NUNCA se eliminan sin aplicar
  la propiedad formal correspondiente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
fuente: Texto escolar MINEDUC — Álgebra / Inecuaciones con Valor Absoluto
