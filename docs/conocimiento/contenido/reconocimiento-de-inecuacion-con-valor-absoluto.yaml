procedimiento:
- Identificar la expresión con valor absoluto y aislarla a un lado de la desigualdad,
  si es necesario.
- Verificar que la constante del otro lado sea positiva. Si es un número negativo
  y tenemos un menor que, la solución es vacía; si es mayor que, son todos los reales.
- 'Aplicar la propiedad correspondiente: transformar en una desigualdad doble si es
  ''<'' o en dos desigualdades separadas por ''o'' si es ''>''.'
- Resolver la inecuación o el par de inecuaciones resultantes para encontrar el intervalo
  solución final.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en reconocimiento de inecuación
  con valor absoluto.
ejemplos:
- titulo: Inecuación de tipo menor que
  enunciado: Resolver la inecuación $|x - 2| < 5$.
  solucion_pasos:
  - Identificamos que tiene la forma $|X| < a$, donde $X = x - 2$ y $a = 5$.
  - Aplicamos la propiedad - $-5 < x - 2 < 5$.
  - Sumamos 2 a todos los miembros de la desigualdad - $-5 + 2 < x - 2 + 2 < 5 + 2$.
  - Obtenemos $-3 < x < 7$. El intervalo solución es $(-3, 7)$.
- titulo: Inecuación de tipo mayor o igual que
  enunciado: Resolver la inecuación $|2x + 1| \\ge 7$.
  solucion_pasos:
  - Tiene la forma $|X| \ge a$, lo que se descompone en $X \le -a$ o $X \ge a$.
  - Planteamos las dos desigualdades - $2x + 1 \le -7$ o $2x + 1 \ge 7$.
  - Resolvemos la primera - $2x \le -8$, lo que da $x \le -4$.
  - Resolvemos la segunda - $2x \ge 6$, lo que da $x \ge 3$.
  - La solución final es la unión de ambos intervalos - $(-\infty, -4] \cup [3, \infty)$.
- titulo: ¿Es correcto que $|x| < -2$ no tiene solución real?
  respuesta: Verdadero
  solucion_pasos:
  - El valor absoluto de cualquier número real siempre es mayor o igual a cero (nunca
    es negativo).
  - Por lo tanto, la expresión $|x|$ nunca puede ser estrictamente menor que $-2$.
  - Concluimos que no hay ningún valor real de $x$ que satisfaga la inecuación, por
    lo que no tiene solución en los reales.
- titulo: ¿La inecuación $|x| > -5$ tiene como solución todos los números reales?
  respuesta: Verdadero
  solucion_pasos:
  - Sabemos que $|x| \ge 0$ para cualquier número real $x$.
  - Dado que $0 > -5$, se cumple que $|x| \ge 0 > -5$.
  - Como cualquier número positivo o cero es mayor que $-5$, la inecuación es verdadera
    para todo $x \in \mathbb{R}$.
errores_frecuentes:
- Resolver $|x| > a$ escribiendo la desigualdad compuesta como $-a > x > a$, lo cual
  es lógicamente inconsistente.
- Olvidar cambiar el sentido de la desigualdad cuando se plantea el caso negativo
  en inecuaciones tipo mayor que.
- Ignorar el caso cuando la inecuación se iguala a un número negativo y proceder mecánicamente,
  obteniendo soluciones falsas.
- Tratar el valor absoluto como paréntesis y simplemente suprimirlo, escribiendo $x
  - 2 < 5$ como única inecuación al resolver $|x - 2| < 5$.
- Afirmar que la solución a $|x| < 0$ es todo número real negativo.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  reconocimiento de inecuación con valor absoluto.
