semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.DEFINICION
resumen_inicial: Reconocer una inecuación con valor absoluto consiste en identificar desigualdades algebraicas que contienen a la variable encorchetada por barras de distancia $| \cdot |$.
explicacion_simple: '![Reconocimiento de inecuación con valor absoluto](/static/img/nodos/reconocimiento-de-inecuacion-con-valor-absoluto-intro.svg)


  Una inecuación contiene valor absoluto cuando la variable $x$ está encerrada entre dos barras verticales $|x|$.


  Estas barras representan una **distancia no negativa** en la recta numérica.


  Por ejemplo, $|x - 5| \le 2$ se lee como "los números cuya distancia al 5 es menor o igual a 2 unidades".'
explicacion_formal: 'Una **inecuación lineal con valor absoluto** en la variable $x \in \mathbb{R}$ adopta una de las cuatro formas canónicas:


  1. $|a x + b| < k$

  2. $|a x + b| \le k$

  3. $|a x + b| > k$

  4. $|a x + b| \ge k$


  **Desglose de la fórmula:**

  - $a, b, k \in \mathbb{R}$ con $a \neq 0$.

  - Las barras $| \cdot |$ aplican la función distancia no negativa al argumento $a x + b$.

  '
definiciones_clave: '- **Barras de valor absoluto ($| \cdot |$)**: Operador que devuelve la magnitud sin signo de la expresión contenida en su interior.

  '
propiedades_relaciones: '- **Métrica de distancia**: $|x - y|$ mide la distancia entre los números reales $x$ e $y$ en el eje real.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Reconocimiento de inecuación con valor absoluto](/static/img/nodos/reconocimiento-de-inecuacion-con-valor-absoluto-ejemplos.svg)


    Identifica el centro $a$ y el radio de tolerancia $r$ en la inecuación de valor absoluto $|x - 7| \le 3$.'
  pasos:
  - 'Paso 1: Comparar la inecuación dada con la forma canónica de distancia $|x - a| \le r$.'
  - 'Paso 2: Identificar el centro: $a = 7$.'
  - 'Paso 3: Identificar el radio o tolerancia: $r = 3$.'
  - 'Paso 4: Concluir que representa el intervalo de centro $7$ con alcance de $3$ unidades a cada lado ($[4, 10]$).'
checkpoints:
- placement: after_explicacion_formal
  question: En la inecuación $|x - 7| \le 3$, ¿qué representan los valores $7$ y $3$ geométricamente?
  choices:
  - text: El centro es $7$ y el radio de distancia es $3$.
    is_correct: true
  - text: El centro es $3$ y el radio es $7$.
    is_correct: false
  - text: Son las dos soluciones puntuales de la ecuación.
    is_correct: false
  - text: Representan el origen de coordenadas.
    is_correct: false
  explanation: La alternativa correcta es 'El centro es $7$ y el radio de distancia es $3$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué símbolo gráfico indica la presencia de valor absoluto en una inecuación?
  choices:
  - text: Barras verticales paralelas $| \cdot |$ encerrando la variable.
    is_correct: true
  - text: Corchetes cuadrados de intervalo $[ \cdot ]$.
    is_correct: false
  - text: Paréntesis redondos $( \cdot )$.
    is_correct: false
  - text: Llaves de conjunto $\{ \cdot \}$.
    is_correct: false
  explanation: La alternativa correcta es 'Barras verticales paralelas $| \cdot |$ encerrando la variable.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar la presencia de barras verticales $| \cdot |$ envolviendo términos con la incógnita.'
- 'Paso 2: Identificar el operador de orden ($<, \le, >, \ge$).'
- 'Paso 3: Identificar si la constante es positiva, nula o negativa.'
- 'Paso 4: Seleccionar el algoritmo de resolución correspondiente.'
errores_correccion: '- **Error común:** Confundir las barras de valor absoluto $| \cdot |$ con corchetes de intervalo $[ \cdot ]$.

  - **Cómo corregirlo:** Las barras de valor absoluto son líneas verticales rectas $| \cdot |$ que encierran una expresión algebraica, no definen un intervalo predeterminado.

  '
ejemplos:
- titulo: 'Ejemplo 1: Identificación de tipo'
  enunciado: ¿Qué representa geométricamente la inecuación $|x - 3| < 2$ en la recta real?
  alternativas:
  - Todos los números a distancia menor que $2$ del centro $3$
  - Todos los números mayores que $5$
  - Solo los números $1$ y $5$
  - Todos los números a distancia mayor que $3$
  respuesta: Todos los números a distancia menor que $2$ del centro $3$
  solucion_pasos:
  - 'Paso 1: $|x - c| < r$ es el conjunto de puntos a distancia $< r$ de $c$.'
  - 'Paso 2: Aquí $c = 3$ y $r = 2$, luego $x \in ]1, 5[$.'
- titulo: 'Ejemplo 2: Desdoblamiento de tipo menor'
  enunciado: ¿Cuál es el desdoblamiento algebraico correcto de $|u| < 6$?
  alternativas:
  - $-6 < u < 6$
  - $u < -6$ o $u > 6$
  - $u < 6$
  - $-6 \leq u \leq 6$
  respuesta: $-6 < u < 6$
  solucion_pasos:
  - 'Paso 1: Por propiedad de cercanía, $|u| < k \iff -k < u < k$.'
  - 'Paso 2: $-6 < u < 6$.'
- titulo: 'Ejemplo 3: Desdoblamiento de tipo mayor'
  enunciado: ¿Cuál es el desdoblamiento algebraico correcto de $|u| \geq 4$?
  alternativas:
  - $u \leq -4$ o $u \geq 4$
  - $-4 \leq u \leq 4$
  - $u \geq 4$
  - $u \leq 4$
  respuesta: $u \leq -4$ o $u \geq 4$
  solucion_pasos:
  - 'Paso 1: Por propiedad de lejanía, $|u| \ge k \iff u \le -k \lor u \ge k$.'
  - 'Paso 2: $u \le -4$ o $u \ge 4$.'
- titulo: 'Ejemplo 4: Propiedad de no negatividad'
  enunciado: ¿Puede el valor absoluto de una expresión real ser estrictamente menor que cero ($|A| < 0$)?
  alternativas:
  - No, porque $|A| \geq 0$ para todo número real
  - Sí, si $A$ es negativo
  - Sí, si $A = 0$
  - Depende del signo de los coeficientes
  respuesta: No, porque $|A| \geq 0$ para todo número real
  solucion_pasos:
  - 'Paso 1: Por definición de magnitud, $|A| \ge 0$.'
  - 'Paso 2: Nunca puede ser menor estricto que cero.'
errores_frecuentes:
- Una inecuación con valor absoluto es equivalente a una ecuación cuadrática de dos raíces reales.
- Las barras de valor absoluto en una inecuación actúan simplemente como un par de paréntesis ordinarios.
- El término $|x - a|$ en un problema geométrico representa la pendiente de la recta real.
- Reconocer una inecuación con valor absoluto exige reemplazar las barras por corchetes de intervalo.
- La expresión $|x| \ge 0$ no es una inecuación porque se cumple para todo número real.
afirmaciones_verdaderas:
- Una inecuación con valor absoluto es una desigualdad donde la incógnita se encuentra contenida dentro de barras de valor absoluto $| \cdot |$.
- Geométricamente, la expresión $|x - a| < r$ representa el conjunto de números $x$ cuya distancia al centro $a$ es estrictamente menor que el radio $r$.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar la estructura de una inecuación con valor absoluto.


  **CÓMO:** Asociando el valor absoluto $|ax + b|$ con la distancia geométrica sobre la recta numérica y distinguiendo entre relaciones de cercanía ($<, \le$) y lejanía ($>, \ge$).


  ![Resumen Reconocimiento de inecuación con valor absoluto](/static/img/nodos/reconocimiento-de-inecuacion-con-valor-absoluto-resumen.svg)'
