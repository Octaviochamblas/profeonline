semantic_id: MAT.NUM.SUCESIONES_BASE.SUCESION_RECURSIVA
resumen_inicial: 'Concepto de sucesión definida por recurrencia simple: concepto y
  desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: 'Imagina una cadena de favores: solo puedes hacer un favor si
  alguien te hizo uno primero. En matemáticas, hay fórmulas que te obligan a conocer
  el número anterior para poder calcular el siguiente. Eso es la recurrencia.'
explicacion_formal: "Hasta ahora vimos el **Término General**, que funciona como un\
  \ teletransportador (pones $n=100$ y viajas directo al valor cien). \n\nPero muchas\
  \ sucesiones se definen de forma **Recursiva**. Esta notación funciona como subir\
  \ escalones: no puedes saltar al escalón 100 sin pisar el 99 antes.\n\nUna definición\
  \ recursiva SIEMPRE tiene dos partes:\n1. **Una semilla (condición inicial):** Te\
  \ deben decir cómo empieza. Ej: $a_1 = 2$.\n2. **La regla de dependencia:** Una\
  \ fórmula que usa **$a_{n-1}$**. (Recuerda: si '$a_n$' es el término de ahora, '$a_{n-1}$'\
  \ significa 'el término anterior').\n\nEjemplo: $a_1 = 2$,  $a_n = a_{n-1} + 3$\n\
  Traducción al español: 'Empieza en 2. Para calcular cualquier número, toma el resultado\
  \ anterior y súmale 3'.\n- $a_2 = a_1 + 3 = 2 + 3 = 5$\n- $a_3 = a_2 + 3 = 5 + 3\
  \ = 8$"
definiciones_clave: '- **Concepto de sucesión definida por recurrencia simple**: Concepto
