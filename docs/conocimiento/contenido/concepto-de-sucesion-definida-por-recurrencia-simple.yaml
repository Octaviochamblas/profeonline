semantic_id: MAT.NUM.SUCESIONES_BASE.SUCESION_RECURSIVA
resumen_inicial: 'Una sucesión por recurrencia simple define cada término en función del término anterior $a_n = g(a_{n-1})$ junto a una condición inicial obligatoria $a_1 = c$.'
explicacion_simple: |
  En una **sucesión por recurrencia**, cada número se calcula usando el número que vino justo antes (efecto cadena):
  - **Paso 1 (Condición inicial)**: Te dan el primer número para empezar, por ejemplo: $a_1 = 3$.
  - **Paso 2 (Regla de paso)**: Te dicen qué hacerle al anterior para obtener el siguiente, por ejemplo: $a_n = a_{n-1} + 5$.
    - $a_2 = a_1 + 5 = 3 + 5 = 8$
    - $a_3 = a_2 + 5 = 8 + 5 = 13$
    - $a_4 = a_3 + 5 = 13 + 5 = 18$
  - Sin el punto de partida ($a_1$), la regla no puede empezar a calcular nada.

  ![Concepto de sucesión por recurrencia simple](/static/img/nodos/concepto-de-sucesion-definida-por-recurrencia-simple-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una **relación de recurrencia simple de primer orden** para una sucesión $(a_n)_{n \ge 1}$ es un sistema inductivo compuesto por:
  $$\begin{cases} a_1 = c & (\text{Condición inicial o caso base}) \\ a_n = g(a_{n-1}) & (\text{Ecuación de recurrencia para } n \ge 2) \end{cases}$$
  donde $g: \mathbb{R} \to \mathbb{R}$ es una función de transición real y $c \in \mathbb{R}$ es una constante prefijada.

  ### Principio de Inducción y Unicidad
  Por el Principio de Inducción Matemática, el par $(c, g)$ define de manera única y bien determinada la sucesión completa $(a_n)_{n \in \mathbb{N}}$. La ausencia de la condición inicial $a_1 = c$ deja infinitas trayectorias posibles.

  ### Tipos Principales de Recurrencia Simple
  - **Aditiva (Aritmética)**: $a_n = a_{n-1} + d \implies a_n = a_1 + (n-1)d$.
  - **Multiplicativa (Geométrica)**: $a_n = r \cdot a_{n-1} \implies a_n = a_1 \cdot r^{n-1}$.
  - **Afín**: $a_n = r \cdot a_{n-1} + d$.

  ### Síntesis didáctica
  - Estructura: Caso base $a_1$ + Paso inductivo $a_n = g(a_{n-1})$.
  - Cálculo: Encadenado término a término.
definiciones_clave: |
  - **Relación de recurrencia**: Ecuación que expresa el término $n$-ésimo en función de términos precedentes.
  - **Condición inicial ($a_1$)**: Valor asignado al término de partida indispensable para evaluar la recurrencia.
  - **Paso recursivo**: Aplicación de la regla $g$ sobre el valor anterior para generar el nuevo término.
propiedades_relaciones: |
  - **Dependencia secuencial**: Para calcular $a_k$ por el método recursivo directo, se deben calcular obligatoriamente todos los términos $a_2, a_3, \dots, a_{k-1}$.
  - **Resolución de recurrencias**: Proceso algebraico mediante el cual se transforma una definición recurrente en una fórmula explícita de término general $a_n = f(n)$.
ejemplo_guiado:
  enunciado: 'Dada la sucesión definida por la recurrencia $a_1 = 4$ y $a_n = 2a_{n-1} - 1$ para $n \ge 2$, calcula los primeros cuatro términos.'
  imagen: '/static/img/nodos/concepto-de-sucesion-definida-por-recurrencia-simple-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el término inicial dado: **$a_1 = 4$**.'
    - 'Paso 2: Calculamos $a_2$ usando $a_1$: $a_2 = 2a_1 - 1 = 2(4) - 1 = 8 - 1 = **7$**.'
    - 'Paso 3: Calculamos $a_3$ usando $a_2$: $a_3 = 2a_2 - 1 = 2(7) - 1 = 14 - 1 = **13$**.'
    - 'Paso 4: Calculamos $a_4$ usando $a_3$: $a_4 = 2a_3 - 1 = 2(13) - 1 = 26 - 1 = **25$**.'
    - 'Conclusión: Los cuatro primeros términos son **$4, 7, 13, 25$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué es indispensable contar con una condición inicial (ej: $a_1 = c$) en una relación de recurrencia?'
    choices:
      - {text: 'Porque sin un valor inicial de partida no es posible iniciar el cálculo de los términos siguientes', is_correct: true}
      - {text: 'Para cambiar el signo de todos los términos', is_correct: false}
      - {text: 'Para asegurar que la sucesión sea finita', is_correct: false}
      - {text: 'Porque la condición inicial reemplaza a la regla de paso', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque sin un valor inicial de partida no es posible iniciar el cálculo de los términos siguientes''. La condición inicial ancla la regla recursiva en un valor numérico concreto.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $a_1 = 10$ y $a_n = a_{n-1} - 3$, ¿cuál es el valor de $a_3$?'
    choices:
      - {text: '$4$, calculando $a_2 = 10 - 3 = 7$ y $a_3 = 7 - 3 = 4$', is_correct: true}
      - {text: '$7$, calculando únicamente $a_2$', is_correct: false}
      - {text: '$1$, restando $3$ tres veces', is_correct: false}
      - {text: '$10$, manteniéndose constante', is_correct: false}
    explanation: 'La alternativa correcta es ''$4$, calculando $a_2 = 10 - 3 = 7$ y $a_3 = 7 - 3 = 4$''. Se encadena la resta término a término.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el valor numérico del término inicial $a_1$.'
  - 'Paso 2: Sustituir $a_1$ en la regla de recurrencia para calcular $a_2 = g(a_1)$.'
  - 'Paso 3: Sustituir el resultado obtenido $a_2$ para calcular $a_3 = g(a_2)$.'
  - 'Paso 4: Repetir el procedimiento secuencialmente hasta alcanzar la posición $n$ requerida.'
errores_correccion: |
  - **Error 1:** Omitir la condición inicial $a_1$ al intentar resolver una relación recurrente. **Cómo corregirlo:** Toda recurrencia requiere obligatoriamente **el valor de partida $a_1$** para poder operar.
  - **Error 2:** Confundir el subíndice $n-1$ con restar 1 al valor del término ($a_n - 1$). **Cómo corregirlo:** $a_{n-1}$ significa **el valor del término anterior**, no restarle 1 al término actual.
ejemplos:
  - titulo: 'Recurrencia aditiva simple'
    enunciado: 'Para $a_1 = 5$ y $a_n = a_{n-1} + 4$, ¿cuál es el valor de $a_3$?'
    alternativas:
      - '$13$'
      - '$9$'
      - '$17$'
    respuesta: '$13$'
    solucion_pasos:
      - '1. $a_1 = 5$.'
      - '2. $a_2 = 5 + 4 = 9$.'
      - '3. $a_3 = 9 + 4 = 13$.'
  - titulo: 'Recurrencia multiplicativa'
    enunciado: 'Para $a_1 = 2$ y $a_n = 3a_{n-1}$, ¿cuál es el valor de $a_4$?'
    alternativas:
      - '$54$'
      - '$18$'
      - '$162$'
    respuesta: '$54$'
    solucion_pasos:
      - '1. $a_1 = 2, a_2 = 6, a_3 = 18, a_4 = 54$.'
  - titulo: 'Dependencia encadenada'
    enunciado: '¿Para calcular $a_5$ mediante la fórmula $a_n = 2a_{n-1} + 1$ es necesario conocer previamente $a_4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. La regla recurrente exige el valor inmediato anterior $a_4$.'
  - titulo: 'Sucesión de Fibonacci elemental'
    enunciado: '¿Una sucesión donde cada término se calcula sumando los dos anteriores ($a_n = a_{n-1} + a_{n-2}$) es un tipo de sucesión por recurrencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Corresponde a una recurrencia lineal de segundo orden.'
errores_frecuentes:
  - 'Una relación de recurrencia puede generar valores numéricos sin necesidad de definir una condición inicial.'
  - 'La notación $a_{n-1}$ equivale a restarle el número uno al valor del término $a_n$.'
  - 'En una definición recurrente es posible calcular directamente el término cincuenta sin calcular ninguno de los anteriores.'
  - 'La condición inicial $a_1$ de una recurrencia debe ser obligatoriamente igual a cero.'
  - 'Las sucesiones por recurrencia no pueden modelar crecimientos multiplicativos ni geométricos.'
afirmaciones_verdaderas:
  - 'Una relación de recurrencia define cada término $a_n$ en función del término precedente $a_{n-1}$ a partir de una condición inicial $a_1$.'
  - 'El cálculo recursivo directo opera mediante una cadena inductiva término a término.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/concepto-de-sucesion-definida-por-recurrencia-simple-resumen.svg)

  QUÉ: Comprender y calcular términos de sucesiones definidas mediante relaciones de recurrencia simple.
  CÓMO: Aplicar el paso recursivo $a_n = g(a_{n-1})$ de forma encadenada a partir de la condición inicial fijada $a_1 = c$.
