procedimiento:
- 'Paso 1: Identifica el valor inicial o semilla ($a_1$).'
- 'Paso 2: Lee la fórmula de recurrencia. Donde veas ''$a_{n-1}$'', reemplázalo por
  el valor del número que calculaste en el paso anterior.'
- 'Paso 3: Repite el ciclo (iteración) hasta llegar a la posición deseada.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en concepto de sucesión definida por recurrencia simple.
ejemplos:
- titulo: El ciclo sin fin
  enunciado: Si $a_1 = 10$ y la recurrencia es $a_n = a_{n-1} \cdot 2$. Calcula el
    tercer término ($a_3$).
  solucion_pasos:
  - Empezamos con a1 = 10.
  - 'Calculamos a2 reemplazando el valor de a1: $a_2 = 10 \cdot 2 = 20$.'
  - 'Calculamos a3 reemplazando el valor de a2: $a_3 = 20 \cdot 2 = 40$.'
  - El tercer término es 40.
errores_frecuentes:
- Reemplazar la letra '$n$' por la posición directamente en el lugar de '$a_{n-1}$'.
  (Ej. pensar que $a_{n-1}$ vale 4 si estás en la posición 5). ¡$a_{n-1}$ representa
  el VALOR de la casilla anterior, no la posición!
- Olvidar la condición inicial y no saber de dónde arrancar.
afirmaciones_verdaderas:
- La formulación de concepto de sucesión definida por recurrencia simple mantiene
  la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando concepto de sucesión
  definida por recurrencia simple.
