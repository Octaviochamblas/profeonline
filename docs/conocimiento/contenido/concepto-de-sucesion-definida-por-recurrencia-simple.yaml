procedimiento:
- 'Paso 1: Identifica el valor inicial o semilla ($a_1$).'
- 'Paso 2: Lee la fórmula de recurrencia. Donde veas ''$a_{n-1}$'', reemplázalo por el valor
  del número que calculaste en el paso anterior.'
- 'Paso 3: Repite el ciclo (iteración) hasta llegar a la posición deseada.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en concepto de sucesión definida por recurrencia simple.
ejemplos:
- titulo: El ciclo sin fin
  enunciado: Si $a_1 = 10$ y la recurrencia es $a_n = a_{n-1} \cdot 2$. Calcula el tercer
    término ($a_3$).
  solucion_pasos:
  - Empezamos con a1 = 10.
  - 'Calculamos a2 reemplazando el valor de a1: $a_2 = 10 \cdot 2 = 20$.'
  - 'Calculamos a3 reemplazando el valor de a2: $a_3 = 20 \cdot 2 = 40$.'
  - El tercer término es 40.
- titulo: Ejemplo 1
  enunciado: Si a_1 es igual a 1 y a_n es igual a a_(n-1) más 7, ¿cuánto vale a_3?
  alternativas:
  - '15'
  - '8'
  - '22'
  respuesta: '15'
  solucion_pasos:
  - a_1 es 1, a_2 es 1 más 7 igual a 8, y a_3 es 8 más 7 igual a 15.
- titulo: Ejemplo 2
  enunciado: Con a_1 igual a 2 y a_n igual a a_(n-1) por 3, ¿cuánto vale a_3?
  alternativas:
  - '18'
  - '6'
  - '9'
  respuesta: '18'
  solucion_pasos:
  - a_1 es 2, a_2 es 2 por 3 igual a 6, y a_3 es 6 por 3 igual a 18.
- titulo: ¿Se puede calcular a_10 conociendo solo la fórmula recursiva y a_1?
  respuesta: Sí
  solucion_pasos:
  - Hay que calcular todos los términos intermedios uno por uno hasta llegar al décimo.
- titulo: ¿a_(n-1) representa el valor del término anterior, y no su posición?
  respuesta: Sí
  solucion_pasos:
  - a_(n-1) siempre indica el valor numérico que tiene la sucesión un lugar antes de la posición
    actual.
errores_frecuentes:
- Reemplazar la letra '$n$' por la posición directamente en el lugar de '$a_{n-1}$'. (Ej.
  pensar que $a_{n-1}$ vale 4 si estás en la posición 5). ¡$a_{n-1}$ representa el VALOR de
  la casilla anterior, no la posición!
- Olvidar la condición inicial y no saber de dónde arrancar.
- Intentar calcular un término lejano, como el número 50, sin pasar por todos los términos
  anteriores.
- Olvidar definir la condición inicial o semilla antes de aplicar la regla de recurrencia.
- Confundir el término anterior con 'restar 1 al término actual' en vez de referirse al valor
  calculado previamente.
afirmaciones_verdaderas:
- La formulación de concepto de sucesión definida por recurrencia simple mantiene la regularidad
  de la sucesión.
- En una sucesión recursiva siempre se necesita conocer el término anterior para calcular
  el siguiente.
al_terminar_debes_poder: Resolver problemas prácticos utilizando concepto de sucesión definida
  por recurrencia simple.
