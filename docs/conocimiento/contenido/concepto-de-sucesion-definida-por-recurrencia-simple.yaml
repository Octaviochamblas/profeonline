semantic_id: MAT.NUM.SUCESIONES_BASE.SUCESION_RECURSIVA
resumen_inicial: 'Concepto de sucesión definida por recurrencia simple: concepto y desarrollo
  dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: 'Imagina una cadena de favores: solo puedes hacer un favor si alguien
  te hizo uno primero. En matemáticas, hay fórmulas que te obligan a conocer el número anterior
  para poder calcular el siguiente. Eso es la recurrencia.'
explicacion_formal: "Hasta ahora vimos el **Término General**, que funciona como un teletransportador\
  \ (pones $n=100$ y viajas directo al valor cien). \n\nPero muchas sucesiones se definen\
  \ de forma **Recursiva**. Esta notación funciona como subir escalones: no puedes saltar\
  \ al escalón 100 sin pisar el 99 antes.\n\nUna definición recursiva SIEMPRE tiene dos partes:\n\
  1. **Una semilla (condición inicial):** Te deben decir cómo empieza. Ej: $a_1 = 2$.\n2.\
  \ **La regla de dependencia:** Una fórmula que usa **$a_{n-1}$**. (Recuerda: si '$a_n$'\
  \ es el término de ahora, '$a_{n-1}$' significa 'el término anterior').\n\nEjemplo: $a_1\
  \ = 2$,  $a_n = a_{n-1} + 3$\nTraducción al español: 'Empieza en 2. Para calcular cualquier\
  \ número, toma el resultado anterior y súmale 3'.\n- $a_2 = a_1 + 3 = 2 + 3 = 5$\n- $a_3\
  \ = a_2 + 3 = 5 + 3 = 8$"
definiciones_clave: '- **Concepto de sucesión definida por recurrencia simple**: Concepto
  fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Concepto de sucesión definida por recurrencia
  simple**: Relaciones de cambio y fórmulas estructurales de conceptos fundamentales de sucesiones.'
ejemplo_guiado:
  enunciado: Una sucesión se define por a_1 igual a 4 y a_n igual a a_(n-1) más 5. Calcula
    el cuarto término, a_4.
  pasos:
  - 'Parto del valor inicial: a_1 es igual a 4.'
  - 'Calculo a_2 sumando 5 al término anterior: 4 más 5 es igual a 9. Calculo a_3: 9 más 5
    es igual a 14.'
  - 'Calculo a_4: 14 más 5 es igual a 19, por lo tanto el cuarto término es 19.'
