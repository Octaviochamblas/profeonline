resumen_inicial: Una sucesión recursiva define sus términos $a_n$ en función de uno
  o más términos anteriores, requiriendo indispensablemente uno o más términos iniciales
  de partida (condición base).
explicacion_simple: 'Una regla recursiva es como una cadena: para saber el número
  de hoy necesitas conocer el número de ayer. Por ejemplo, decir que cada término
  es el anterior más 5 ($a_n = a_{n-1} + 5$), sabiendo que el primero es 2.'
explicacion_formal: 'Una **Sucesión Definida por Recurrencia** se especifica mediante
  la relación funcional y la condición inicial:


  $$a_n = g(a_{n-1}) \quad \text{con } a_1 = C_0 \quad \forall n \ge 2$$


  **Proceso iterativo en cadena:**

  - Para hallar $a_4$ se debe calcular previamente en orden encadenado $a_1 \to a_2
  \to a_3 \to a_4$.'
definiciones_clave: '- **Sucesión recursiva**: Definición $a_n = g(a_{n-1})$ condicionada
  por un valor inicial $a_1$.'
propiedades_relaciones: '- **Dependencia secuencial**: Exige calcular los términos
  previos para obtener una posición lejana.'
ejemplo_guiado:
  enunciado: Dada la sucesión recursiva $a_1 = 4$ y $a_n = a_{n-1} + 3$ para $n \ge
    2$, halle los primeros $4$ términos.
  pasos:
  - 'Paso 1: $a_1 = 4$ (dado por condición inicial).'
  - 'Paso 2: $a_2 = a_1 + 3 = 4 + 3 = 7$.'
  - 'Paso 3: $a_3 = a_2 + 3 = 7 + 3 = 10$.'
  - 'Paso 4: $a_4 = a_3 + 3 = 10 + 3 = 13$.'
  - 'Conclusión: Los primeros $4$ términos son $(4, 7, 10, 13)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué elemento es indispensable especificar para que una relación de recurrencia
    an = g(an-1) pueda calcularse?
  choices:
  - text: Un término o condición inicial de partida (como a1)
    is_correct: true
  - text: La suma total de 100 términos
    is_correct: false
  - text: El límite en el infinito
    is_correct: false
  - text: Una constante de integración
    is_correct: false
  explanation: La alternativa correcta es 'Un término o condición inicial de partida
    (como a1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con a1 = 4 y an = an-1 + 3, ¿cuál fue el cuarto término
    a4?
  choices:
  - text: '13'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '12'
    is_correct: false
  - text: '16'
    is_correct: false
  explanation: La alternativa correcta es '13'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y calcular términos de
  sucesiones recursivas $a_n = g(a_{n-1})$ a partir de su término inicial.
semantic_id: MAT.NUM.SUCESIONES_BASE.SUCESION_RECURSIVA
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.SUCESION_RECURSIVA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
fuente: Texto escolar MINEDUC — Números / Álgebra 1° Medio / PAES.
