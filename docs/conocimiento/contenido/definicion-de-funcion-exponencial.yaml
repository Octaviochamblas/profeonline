semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DEFINICION
resumen_inicial: La función exponencial básica es una función real de la forma $f(x) = b^x$, donde la base $b$ es una constante real positiva distinta de uno ($b > 0, b \neq 1$) y la variable independiente $x$ se ubica en el exponente.
explicacion_simple: "![La función exponencial básica es una función real de la forma $f(x) = b^x$, donde la base $b$ es una constante real positiva distinta de uno ($b > 0, b \\neq 1$) y la variable independiente $x$ se ubica en el exponente](/static/img/nodos/definicion-de-funcion-exponencial-intro.svg)\n\n\nUna **función exponencial** es aquella donde la incógnita o variable $x$ está en el **exponente (en el tejado)**, y la base es un número fijo:\n$$f(x) = b^x$$\n\n- **¿Cómo distinguirla de una función potencia?**\n  - En $x^2$ o $x^3$ (potencias), la $x$ está abajo en la base.\n  - En $2^x$ o $3^x$ (exponenciales), el número está abajo y la **$x$ está arriba**.\n- **Reglas obligatorias para la base $b$:**\n  - Debe ser **positiva** ($b > 0$) para que siempre existan las raíces.\n  - Debe ser **distinta de 1** ($b \\neq 1$) porque $1^x = 1$ es una línea plana aburrida."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$. Se define la **función exponencial canónica** como la aplicación biyectiva $f: \mathbb{R} \to \mathbb{R}^+$ dada por:

  $$f(x) = b^x = \exp_b(x) = e^{x \ln(b)}$$


  **Axiomas y propiedades analíticas**:

  1. **Propiedad homomórfica aditiva**: Transforma sumas en productos: $f(x + y) = b^{x+y} = b^x \cdot b^y = f(x) \cdot f(y)$.

  2. **Inyectividad estricta**: $b^{x_1} = b^{x_2} \Longleftrightarrow x_1 = x_2$.

  3. **Monotonía estricta**: Si $b > 1$, $f$ es estrictamente creciente; si $0 < b < 1$, $f$ es estrictamente decreciente.'
definiciones_clave: '- **Función exponencial**: Función trascendente donde el exponente es la variable independiente.

  - **Base de la exponencial**: Constante real positiva $b \neq 1$ que define la razón de cambio.'
propiedades_relaciones: '- **Homomorfismo $(\mathbb{R}, +) \to (\mathbb{R}^+, \cdot)$**: Es el único tipo de función continua no nula que convierte sumas del dominio en productos del codominio.

  - **Inversa logarítmica**: La función inversa de $f(x) = b^x$ es la función logaritmo $f^{-1}(x) = \log_b(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función exponencial básica es una función real de la forma $f(x) = b^x$, donde la base $b$ es una constante real positiva distinta de uno ($b > 0, b \neq 1$) y la variable independiente $x$ se ubica en el exponente](/static/img/nodos/definicion-de-funcion-exponencial-ejemplos.svg)



    Determina si las siguientes expresiones corresponden a funciones exponenciales justificando formalmente:

    1) $f(x) = 4^x$

    2) $g(x) = x^4$

    3) $h(x) = (-3)^x$'
  pasos:
  - 'Paso 1: Para $f(x) = 4^x$:

    - La base es la constante $b = 4 > 0, b \neq 1$, y la variable está en el exponente.

    - **Sí es una función exponencial**.'
  - 'Paso 2: Para $g(x) = x^4$:

    - La variable está en la base y el exponente es una constante (4).

    - **No es exponencial**, es una función potencia polinómica.'
  - 'Paso 3: Para $h(x) = (-3)^x$:

    - La base es negativa ($b = -3 < 0$), lo cual genera valores no reales para exponentes racionales como $x = 1/2$ ($\sqrt{-3} \notin \mathbb{R}$).

    - **No es una función exponencial real**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones es una función exponencial válida en los números reales?
  choices:
  - text: f(x) = (0,5)ˣ
    is_correct: true
  - text: f(x) = x⁵
    is_correct: false
  - text: f(x) = 1ˣ
    is_correct: false
  - text: f(x) = (-2)ˣ
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = (0,5)ˣ'. Su base $b = 0,5$ es positiva y distinta de 1 ($b \in \mathbb{R}^+ \setminus \{1\}$) y la variable está en el exponente.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué propiedad fundamental distingue a la función exponencial f(x + y)?
  choices:
  - text: f(x + y) = f(x) · f(y) (convierte sumas en productos)
    is_correct: true
  - text: f(x + y) = f(x) + f(y)
    is_correct: false
  - text: f(x + y) = f(x) / f(y)
    is_correct: false
  - text: f(x + y) = [f(x)]ʸ
    is_correct: false
  explanation: 'La alternativa correcta es ''f(x + y) = f(x) · f(y) (convierte sumas en productos)''. Por leyes de potencias: $b^{x+y} = b^x \cdot b^y$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la posición de la variable independiente $x$.'
- 'Paso 2: Verificar que $x$ se encuentre en el exponente.'
- 'Paso 3: Analizar el valor de la base constante $b$.'
- 'Paso 4: Comprobar que se cumpla estrictamente $b > 0$ y $b \neq 1$.'
errores_correccion: '- **Error común:** Confundir $2^x$ con $x^2$.

  - **Cómo corregirlo:** En la función exponencial la variable **está en el EXPONENTE ($2^x$)**, no en la base ($x^2$).'
ejemplos:
- titulo: 'Ejemplo 1: Base entera'
  enunciado: ¿Es $f(x) = 7^x$ una función exponencial?
  alternativas:
  - Sí, base constante 7 > 0, 7 ≠ 1 y variable en exponente
  - No, es una función lineal
  - No, la base debe ser e
  - Es una función cuadrática
  respuesta: Sí, base constante 7 > 0, 7 ≠ 1 y variable en exponente
  solucion_pasos:
  - 'Paso 1: $b = 7 > 0, b \neq 1$ con $x$ en el exponente $\implies$ exponencial.'
- titulo: 'Ejemplo 2: Base fraccionaria propia'
  enunciado: ¿Es $g(x) = \left(\frac{1}{4}\right)^x$ una función exponencial?
  alternativas:
  - Sí, base constante 1/4 > 0, 1/4 ≠ 1
  - No, las fracciones no son bases válidas
  - No, es una hipérbola
  - Es una raíz
  respuesta: Sí, base constante 1/4 > 0, 1/4 ≠ 1
  solucion_pasos:
  - 'Paso 1: $b = 1/4 > 0, b \neq 1 \implies$ función exponencial decreciente.'
- titulo: 'Ejemplo 3: Identificación de base no permitida'
  enunciado: ¿Por qué $h(x) = 1^x$ no se considera función exponencial?
  alternativas:
  - Porque 1ˣ = 1 para todo x, degenerando en una función constante
  - Porque 1 no es un número real
  - Porque no se puede elevar a potencias negativas
  - Porque su gráfica es vertical
  respuesta: Porque 1ˣ = 1 para todo x, degenerando en una función constante
  solucion_pasos:
  - 'Paso 1: Con $b = 1$ la función es la constante $y = 1$, perdiendo la naturaleza exponencial.'
- titulo: 'Ejemplo 4: Clasificación comparativa'
  enunciado: ¿Cuál de las siguientes NO es una función exponencial?
  alternativas:
  - f(x) = x³
  - f(x) = 3ˣ
  - f(x) = (0,2)ˣ
  - f(x) = 10ˣ
  respuesta: f(x) = x³
  solucion_pasos:
  - 'Paso 1: $x^3$ tiene la variable en la base $\implies$ es función potencia.'
errores_frecuentes:
- Confundir la función exponencial con la función potencia.
- Considerar bases negativas como exponenciales en los reales.
- Olvidar que la base 1 está excluida por generar una función constante.
afirmaciones_verdaderas:
- En la función exponencial f(x) = bˣ, la variable independiente x se ubica en el exponente.
- La base b debe ser estrictamente positiva y distinta de 1 para estar definida en todo ℝ.
al_terminar_debes_poder: '**QUÉ:** Reconocer y definir la función exponencial básica f(x) = bˣ.


  **CÓMO:** Identificando la variable en el exponente y verificando la condición b > 0 con b ≠ 1.


