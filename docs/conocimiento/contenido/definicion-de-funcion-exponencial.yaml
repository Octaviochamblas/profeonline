semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DEFINICION
resumen_inicial: La función exponencial es una relación matemática de la forma $f(x) = b^x$, donde la variable independiente $x$ actúa como exponente de una base constante $b > 0$ y $b \neq 1$.
explicacion_simple: |
  En las funciones que estudiaste antes (como las lineales $y = 2x$ o cuadráticas $y = x^2$), la variable $x$ estaba abajo en la base.

  En la **función exponencial**, la variable **$x$ SUBE AL EXPONENTE**:

  $$f(x) = b^x$$

  - La base $b$ es un **número positivo fijo** que no puede ser 1 (por ejemplo, $b = 2$, $b = 3$, $b = 0.5$).
  - Cada vez que $x$ aumenta en 1 unidad, el resultado de la función **se multiplica por la base $b$** (crecimiento rápido o decrecimiento continuo).
explicacion_formal: |
  Sea $b \in \mathbb{R}^+ \setminus \{1\}$ una constante real positiva distinta de uno. Se define la **función exponencial estándar** $f: \mathbb{R} \to \mathbb{R}^+$ como la aplicación:

  $$f(x) = b^x \quad \text{con } x \in \mathbb{R}$$

  **Propiedades estructurales básicas:**
  1. **Dominio y Recorrido:** $\text{Dom}(f) = \mathbb{R}$ y $\text{Rec}(f) = \mathbb{R}^+ = ]0, +\infty[$.
  2. **Intersección con el eje Y:** $f(0) = b^0 = 1$. La gráfica siempre corta al eje Y en el punto cartesiano $(0, 1)$.
  3. **Asíntota horizontal:** La recta $y = 0$ (el eje X) es asíntota horizontal hacia $-\infty$ si $b > 1$ o hacia $+\infty$ si $0 < b < 1$.
definiciones_clave: |
  - **Función exponencial**: Función matemática de la forma $f(x) = b^x$ donde la variable independiente $x$ se ubica en la posición del exponente.
propiedades_relaciones: |
  - **Relación con la potencia**: La evaluación de $f(x)$ para valores enteros o racionales de $x$ satisface las leyes axiomáticas de las potencias de igual base.
ejemplo_guiado:
  enunciado: 'Dada la función exponencial $f(x) = 3^x$, calcula las imágenes para $x = -1$, $x = 0$ y $x = 2$.'
  pasos:
    - 'Paso 1: Evaluar en $x = -1$: $f(-1) = 3^{-1} = \frac{1}{3}$.'
    - 'Paso 2: Evaluar en $x = 0$: $f(0) = 3^0 = 1$.'
    - 'Paso 3: Evaluar en $x = 2$: $f(2) = 3^2 = 9$.'
    - 'Paso 4: Concluir que los pares ordenados son $(-1, 1/3)$, $(0, 1)$ y $(2, 9)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué posición de la expresión matemática se encuentra la variable independiente $x$ en una función exponencial?'
    choices:
      - {text: 'En el exponente de la potencia ($b^x$)', is_correct: true}
      - {text: 'En la base de la potencia ($x^b$).', is_correct: false}
      - {text: 'Como coeficiente multiplicativo ($x \cdot b$).', is_correct: false}
      - {text: 'Dentro del índice de una raíz.', is_correct: false}
    explanation: 'La alternativa correcta es ''En el exponente de la potencia ($b^x$)''. Es la característica definitoria de la función exponencial.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la función exponencial $f(x) = 5^x$, ¿cuál es el valor de la imagen $f(2)$?'
    choices:
      - {text: '$f(2) = 25$', is_correct: true}
      - {text: '$f(2) = 10$.', is_correct: false}
      - {text: '$f(2) = 7$.', is_correct: false}
      - {text: '$f(2) = 1/25$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(2) = 25$''. Calculando $5^2 = 5 \cdot 5 = 25$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la base constante $b$ y verificar que $b > 0$ y $b \neq 1$.'
  - 'Paso 2: Ubicar la variable de entrada $x$ en el exponente de la potencia.'
  - 'Paso 3: Sustituir el valor numérico de $x$ aplicando propiedades de exponentes.'
  - 'Paso 4: Registrar las coordenadas $(x, b^x)$ e interpretar la salida.'
errores_correccion: |
  - **Error común:** Confundir la función exponencial $f(x) = 2^x$ con la función potencia $g(x) = x^2$.
  - **Cómo corregirlo:** En la función **potencia** la base es variable ($x^2$); en la función **exponencial** la base es fija y el exponente cambia ($2^x$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Evaluación en base entera.
    alternativas:
      - 'f(3) = 8'
      - 'f(3) = 6'
      - 'f(3) = 1/8'
    respuesta: 'f(3) = 8'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Evaluación con exponente nulo.
    alternativas:
      - 'f(0) = 1'
      - 'f(0) = 0'
      - 'f(0) = 7'
    respuesta: 'f(0) = 1'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 4^x$, la afirmación de que $f(3) = 12$ por efectuar la operación $4 \cdot 3$ en lugar de la potencia $4^3$.'
  - 'La equivalencia errónea entre la función exponencial $f(x) = b^x$ y la función potencia $g(x) = x^b$.'
  - 'La afirmación de que el resultado de $b^0$ es igual a cero para bases exponenciales válidas.'
  - 'La consideración del valor $b = 1$ como una base válida para definir una función exponencial cambiante.'
  - 'Afirmar que la gráfica de la función exponencial básica $f(x) = b^x$ cruza el eje X en alguna coordenada real.'
afirmaciones_verdaderas:
  - 'En una función exponencial $f(x) = b^x$, la variable independiente $x$ figura siempre como el exponente de la base constante.'
  - 'La gráfica de la función exponencial básica $f(x) = b^x$ contiene de forma inalterable al punto $(0, 1)$ para cualquier base $b > 0, b \neq 1$.'
al_terminar_debes_poder: |
  QUÉ: Definir y caracterizar la función exponencial $f(x) = b^x$.
  CÓMO: Identificar la posición de la variable en el exponente, verificar la validez de la base $b > 0, b \neq 1$ y evaluar imágenes numéricas.
