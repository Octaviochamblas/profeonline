semantic_id: MAT.ALG.FACTOR_COMUN.RECONOCIMIENTO_POLINOMIO
resumen_inicial: 'El reconocimiento del factor común polinomio consiste en identificar un paréntesis completo $(a+b)$ que se repite exactamente como un bloque o factor multiplicativo común en varios términos de una expresión.'
explicacion_simple: |
  A veces, el elemento que se repite en varios términos no es sólo un número o una letra, sino **un paréntesis entero (un polinomio)**:
  - **CONCEPTO DE FACTOR COMÚN POLINOMIO**:
    - Considera la expresión: $a\mathbf{(x + 2)} + b\mathbf{(x + 2)}$.
    - Observas que el bloque **$(x + 2)$** está multiplicando tanto a la $a$ como a la $b$.
    - ¡El paréntesis **$(x + 2)$** es el **Factor Común Polinomio**!
  - **Ejemplos con Signos y Agrupación**:
    - $3x\mathbf{(a - b)} - 2y\mathbf{(a - b)} \implies$ Factor común polinomio: **$(a - b)$**.
    - $m\mathbf{(2x + 1)} + \mathbf{(2x + 1)} \implies$ Factor común polinomio: **$(2x + 1)$** (¡multiplica a $m$ y a $+1$!).
explicacion_formal: |
  ### Definición formal
  Sea la expresión algebraica $E = \sum_{i=1}^k T_i \in \mathbb{R}[x_1, \dots, x_m]$ donde cada término $T_i = M_i \cdot B$ está expresado como el producto de un monomio o coeficiente $M_i$ y una componente polinómica común $B = (c_1 x_1^{\alpha_1} + \dots + c_p x_m^{\alpha_p})$. Se define la **relación de factor común polinomio** si:

  $$B \mid T_i \quad \forall i \in \{1, \dots, k\}$$

  donde $B$ representa una estructura binómica, trinomial o multinomial idéntica en variables, coeficientes y signos a lo largo de los $k$ bloques multiplicativos.

  ### Invarianza por Reordenamiento de Términos Internos
  Puesto que la adición es conmutativa en $\mathbb{R}$, los paréntesis $(x + y)$ y $(y + x)$ son equivalentes y representan la **misma componente de factor común polinomio**.

  ### Síntesis didáctica
  Tratar a un paréntesis completo como un bloque unificado o "macro-variable" facilita la extensión de las técnicas de factorización monómica a polinomios compuestos.
definiciones_clave: |
  - **Factor común polinomio**: Paréntesis o expresión compuestas $B = (a+b+\dots)$ que actúa como multiplicador idéntico en dos o más sumandos.
  - **Bloque estructural o macro-variable**: Técnica de sustitución mental $u = (a+b)$ para tratar un paréntesis como un único término simple.
  - **Conmutatividad interna del paréntesis**: Equivalencia por la cual $(a+b)$ e $(y+a)$ representan el mismo factor común si sus términos son idénticos.
propiedades_relaciones: |
  - **Factor implícito 1**: En expresiones como $x(a+b) + (a+b)$, el segundo paréntesis tiene como coeficiente multiplicativo implícito el número $+1$, es decir, $+1 \cdot (a+b)$.
ejemplo_guiado:
  enunciado: 'Reconoce el factor común polinomio en la expresión $2x(3a - 5b) + 7y(3a - 5b) - (3a - 5b)$.'
  pasos:
    - 'Paso 1: Identificamos las partes multiplicativas de cada término:
       - Término 1: $2x \cdot (3a - 5b)$.
       - Término 2: $7y \cdot (3a - 5b)$.
       - Término 3: $-1 \cdot (3a - 5b)$.'
    - 'Paso 2: Observamos la estructura compartida: El bloque en paréntesis **$(3a - 5b)$** está presente en los tres términos con la misma magnitud y signos.'
    - 'Conclusión: El factor común polinomio reconocido es el paréntesis completo **$(3a - 5b)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la expresión $5x(a - b) + 2y(a - b)$, ¿cuál es el factor común polinomio?'
    choices:
      - {text: 'El factor común polinomio es el paréntesis completo $(a - b)$, que multiplica tanto a $5x$ como a $2y$', is_correct: true}
      - {text: 'El factor común polinomio es sólo la letra $a$', is_correct: false}
      - {text: 'El factor común polinomio es $5x + 2y$', is_correct: false}
      - {text: 'El factor común polinomio es sólo la letra $b$', is_correct: false}
    explanation: 'La alternativa correcta es ''El factor común polinomio es el paréntesis completo $(a - b)$, que multiplica tanto a $5x$ como a $2y$''. Paréntesis bloque idéntico en ambos sumandos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la expresión $x(m + n) + (m + n)$, ¿cuál es el coeficiente multiplicativo implícito del segundo paréntesis $(m + n)$?'
    choices:
      - {text: 'Su coeficiente multiplicativo implícito es $+1$, expresándose como $+1 \cdot (m + n)$', is_correct: true}
      - {text: 'Su coeficiente es $0$', is_correct: false}
      - {text: 'Su coeficiente es $x$', is_correct: false}
      - {text: 'No tiene ningún coeficiente', is_correct: false}
    explanation: 'La alternativa correcta es ''Su coeficiente multiplicativo implícito es $+1$, expresándose como $+1 \cdot (m + n)$''. Elemento neutro del producto $+1 \cdot B = B$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar la expresión buscando bloques agrupados entre paréntesis.'
  - 'Paso 2: Verificar que el paréntesis sea exactamente idéntico en términos, coeficientes y signos en todos los bloques.'
  - 'Paso 3: Identificar los coeficientes exteriores que multiplican a cada paréntesis (recordar el $+1$ o $-1$ implícito si el paréntesis está solo).'
  - 'Paso 4: Declarar el paréntesis unificado como el factor común polinomio.'
errores_correccion: |
  - **Error 1:** Declarar que $(x-y)$ y $(y-x)$ son el mismo factor común sin ajustar los signos. **Cómo corregirlo:** Para que sean idénticos **SE DEBE FACTORIZAR UN SIGNO MENOS DEBIDO A QUE $(y-x) = -(x-y)$**.
  - **Error 2:** Ignorar el coeficiente 1 en un paréntesis suelto (tratar $+ (a+b)$ como si tuviese coeficiente 0). **Cómo corregirlo:** Todo paréntesis sin número visible **TIENE COMO FACTOR EL NÚMERO 1 ($+1 \cdot (a+b)$)**.
ejemplos:
  - titulo: 'Paréntesis idéntico'
    enunciado: 'En $m(x + y) - n(x + y)$, ¿es el paréntesis $(x + y)$ el factor común polinomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es el multiplicador común.'
  - titulo: 'Conmutatividad interna'
    enunciado: '¿Representan $(a + b)$ y $(b + a)$ exactamente el mismo factor común polinomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la suma es conmutativa.'
  - titulo: 'Signo menos en resta interna'
    enunciado: '¿Es $(x - y)$ diferente de $(y - x)$ a menos que se extraiga un signo $-1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(y-x) = -(x-y)$.'
  - titulo: 'Coeficiente 1 implícito'
    enunciado: 'En $a(x + 1) + (x + 1)$, ¿es $+1$ el coeficiente del segundo paréntesis?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $1 \cdot (x+1) = (x+1)$.'
errores_frecuentes:
  - 'Considerar que $(x-y)$ e $(y-x)$ son idénticos sin realizar la extracción de un signo negativo.'
  - 'El coeficiente 1 no es incluido en paréntesis que no están precedidos por una variable o número explícito.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Tomar sólo un término dentro del paréntesis como factor común e ignorar los demás sumandos internos.'
  - 'Mezclar variables exteriores con los términos internos del paréntesis.'
afirmaciones_verdaderas:
  - 'Un factor común polinomio es una expresión entre paréntesis que se repite como multiplicador en varios términos.'
  - 'Un paréntesis suelto sin coeficiente visible posee el factor implícito 1.'
al_terminar_debes_poder: 'Reconocer el factor común polinomio en expresiones algebraicas identificando bloques entre paréntesis y coeficientes implícitos.'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
