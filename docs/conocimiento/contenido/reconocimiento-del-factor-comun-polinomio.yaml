semantic_id: MAT.ALG.FACTOR_COMUN.RECONOCIMIENTO_POLINOMIO
resumen_inicial: 'Reconocimiento del factor común polinomio: concepto, método de descomposición
  y reglas en Factor común.'
explicacion_simple: A veces el elemento repetido no es una sola letra, sino un binomio
  o un polinomio completo. Tratar ese grupo como una unidad permite reconocer el factor
  común.
explicacion_formal: '### Definición formal


  Un polinomio $Q$ es factor común de una suma $c_1 Q + c_2 Q + \dots + c_kQ$ si aparece
  multiplicando íntegramente a cada término. Cuando dos bloques son opuestos, $(a-b)
  = -(b-a)$, se pueden igualar extrayendo el signo $-1$ de uno de ellos antes de factorizar.


  ### Desarrollo didáctico


  A diferencia de la resta, a+b = b+a naturalmente.


  Ese factor -1 extraído multiplica al coeficiente q, transformándolo en -q.


  Al extraer el -1 del (1-m), el signo menos exterior pasa a ser +. Nos queda +1(m-1).
  Por tanto, la respuesta es (m-1)(x+1).'
definiciones_clave: '- **Reconocimiento del factor común polinomio**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en reconocimiento del factor común polinomio.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de reconocimiento
    del factor común polinomio.
  pasos:
  - Identificar la estructura o los factores comunes en los términos del polinomio.
  - Aplicar la regla o método correspondiente a reconocimiento del factor común polinomio.
  - Expresar el polinomio como un producto de dos o más factores.
  - Verificar multiplicando los factores resultantes.
