resumen_inicial: El reconocimiento del factor común polinomio es la identificación
  de una expresión agrupada entre paréntesis $(A + B)$ que actúa como un factor único
  repetido en varios términos.
explicacion_simple: A veces el factor común no es una sola letra o número, sino todo
  un paréntesis. Por ejemplo, en $x(a + b) + y(a + b)$, la expresión $(a + b)$ se
  repite en ambos bloques. Ese paréntesis completo es el factor común polinomio.
explicacion_formal: 'Sea una expresión compuesta por bloques de términos $P = M_1(Q)
  + M_2(Q) + \dots + M_k(Q)$ donde $Q = (c_1 x^m + \dots)$ representa una expresión
  polinomial. El **Factor Común Polinomio** es la subexpresión compuesta $Q$ que satisface:


  $$P = Q \cdot (M_1 + M_2 + \dots + M_k)$$


  **Desglose simbólico:**

  - $Q = (a + b)$: Factor común estructural compuesto por una suma o diferencia de
  términos.

  - $M_1(a + b) + M_2(a + b)$: Estructura donde $(a + b)$ actúa como un bloque algebraico
  indecomposable durante el reconocimiento.


  > **Complemento didáctico:** Aplica el principio de sustitución de variable $U =
  Q$, convirtiendo $M_1 U + M_2 U$ en la forma monomial estándar $U(M_1 + M_2)$.'
definiciones_clave: '- **Factor común polinomio**: Bloque entre paréntesis que se
  repite idénticamente como multiplicador de varios sumandos.

  - **Sustitución de variable**: Técnica que reemplaza un paréntesis $(a+b)$ por una
  variable auxiliar $U$.'
propiedades_relaciones: '- **Agrupación de residuos**: Los factores restantes de cada
  bloque se agrupan en un nuevo paréntesis $(M_1 + M_2)$.'
ejemplo_guiado:
  enunciado: Reconozca el factor común polinomio y exprese en forma de producto la
    expresión $2x(m - n) + 3y(m - n)$.
  pasos:
  - 'Paso 1: Observar los sumandos principales: $2x(m - n)$ y $3y(m - n)$.'
  - 'Paso 2: Identificar el paréntesis que se repite en ambos bloques: $(m - n)$.'
  - 'Paso 3: Sustituir mentalmente $U = (m - n) \implies 2x U + 3y U$.'
  - 'Paso 4: Extraer $U$: $U(2x + 3y)$.'
  - 'Paso 5: Reemplazar $U$ por el binomio original: $(m - n)(2x + 3y)$.'
  - 'Conclusión: El factor común polinomio es $(m - n)$ y la expresión factorizada
    es $(m - n)(2x + 3y)$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la expresión $a(x + 1) - b(x + 1)$, ¿cuál es el factor común polinomio?
  choices:
  - text: $(x + 1)$
    is_correct: true
  - text: $(a - b)$
    is_correct: false
  - text: $x$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$(x + 1)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $2x(m - n) + 3y(m - n)$, ¿cuál es el segundo factor resultante
    de agrupar los residuos?
  choices:
  - text: $(2x + 3y)$
    is_correct: true
  - text: $(2x - 3y)$
    is_correct: false
  - text: $(m - n)$
    is_correct: false
  - text: $(6xy)$
    is_correct: false
  explanation: La alternativa correcta es '$(2x + 3y)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el bloque polinómico entre paréntesis que aparece repetido
  en los términos.'
- 'Paso 2: Agrupar los coeficientes o monomios externos que acompañan a cada paréntesis
  repetido.'
- 'Paso 3: Escribir el producto entre el paréntesis común y el paréntesis de residuos.'
errores_correccion: '- **Error 1: Desarrollar los paréntesis multiplicando antes de
  factorizar.** **Cómo corregirlo:** Para extraer el factor común polinomio NO se
  deben expandir los paréntesis; se debe extraer el bloque $(a + b)$ directamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice la expresión $x(a + 2) + (a + 2)$.
  alternativas:
  - $(a + 2)(x + 1)$
  - $(a + 2)(x)$
  - $(a + 2)(x + 2)$
  respuesta: $(a + 2)(x + 1)$
  solucion_pasos:
  - '1. Factor común polinomio: $(a + 2)$.'
  - '2. Residuos: $x$ en el primer término y $1$ en el segundo.'
  - '3. Resultado: $(a + 2)(x + 1)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada de $3m(x - y) - 2n(x - y)$?
  alternativas:
  - $(x - y)(3m - 2n)$
  - $(x - y)(3m + 2n)$
  - $(x + y)(3m - 2n)$
  respuesta: $(x - y)(3m - 2n)$
  solucion_pasos:
  - '1. Factor común: $(x - y)$.'
  - '2. Agrupando coeficientes externos: $(3m - 2n)$.'
  - '3. Resultado: $(x - y)(3m - 2n)$.'
- titulo: ¿Es $(p + q)$ el factor común polinomio en $4(p + q) - z(p + q)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el bloque binomial $(p + q)$ multiplica tanto a 4 como a $-z$.
- titulo: ¿Es necesario que los signos dentro del paréntesis sean idénticos para constituir
    un factor común polinomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a - b)$ y $(a + b)$ no son idénticos; deben ser exactamente iguales.
errores_frecuentes:
- Expandir los paréntesis mediante multiplicación en lugar de extraer el bloque común.
- Declarar que $(a + b)$ y $(a - b)$ son factores idénticos independientemente de
  los signos internos.
- Reemplazar por 0 el residuo cuando un paréntesis no posee coeficiente numérico explícito.
- Declarar que un factor común solo puede ser un monomio de una sola variable.
- Sumar los términos dentro del paréntesis en lugar de multiplicarlos como factores
  agrupados.
afirmaciones_verdaderas:
- Un binomio o trinomio completo encerrado entre paréntesis puede actuar como factor
  común.
- La extracción del factor común polinomio produce un producto de dos o más expresiones
  entre paréntesis.
al_terminar_debes_poder: Al terminar serás capaz de reconocer factores comunes polinomiales
  en expresiones compuestas.
