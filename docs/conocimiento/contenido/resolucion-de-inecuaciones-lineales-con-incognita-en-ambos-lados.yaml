semantic_id: MAT.ALG.INECUACIONES_LINEALES.INCOGNITA_AMBOS_LADOS
resumen_inicial: Cuando la incógnita figura en ambos lados, se agrupan las variables
  en un miembro y las constantes en el otro.
explicacion_simple: 'Si la variable $x$ aparece a la izquierda y a la derecha del
  símbolo (como $5x - 3 > 2x + 9$):

  Reunimos todas las $x$ en un solo lado (conviene moverlas al lado donde el coeficiente
  resultante quede positivo) y movemos todos los números al lado opuesto.'
explicacion_formal: 'Dada la inecuación bilateral $a x + b > c x + d$, el **agrupamiento
  algebraico** establece:


  $$a x - c x > d - b \implies (a - c)x > d - b$$


  $$x > \frac{d - b}{a - c} \quad \text{si } a - c > 0$$

  $$x < \frac{d - b}{a - c} \quad \text{si } a - c < 0$$'
definiciones_clave: '- **Inecuación lineal bilateral**: Inecuación con términos algebraicos
  dependientes de la incógnita en ambos miembros.'
propiedades_relaciones: '- **Independencia del miembro seleccionado**: Agrupar a la
  izquierda o a la derecha da exactamente el mismo intervalo solución.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación $5x - 3 > 2x + 9$ agrupando la incógnita en el
    primer miembro y determina el conjunto solución $S$.
  pasos:
  - 'Paso 1: Trasponer $2x$ restando al primer miembro: $5x - 2x - 3 > 9$.Paso 2:
    Trasponer $-3$ sumando al segundo miembro: $5x - 2x > 9 + 3$.Paso 3: Reducir ambos
    miembros: $3x > 12$.Paso 4: Trasponer el coeficiente positivo $3$ dividiendo:
    $x > \frac{12}{3} \implies x > 4$.Paso 5: Escribir la solución en intervalo: $S
    = ]4, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reducir la inecuación $5x - 3 > 2x + 9$, ¿cuál es la inecuación simplificada
    obtenida?
  choices:
  - text: $3x > 12$
    is_correct: true
  - text: $7x > 12$
    is_correct: false
  - text: $3x > 6$
    is_correct: false
  - text: $3x < 12$
    is_correct: false
  explanation: La alternativa correcta es '$3x > 12$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver la inecuación $5x - 3 > 2x + 9$, ¿cuál es el conjunto solución
    $S$?
  choices:
  - text: $S = ]4, +\infty[$
    is_correct: true
  - text: $S = [4, +\infty[$
    is_correct: false
  - text: $S = ]-\infty, 4[$
    is_correct: false
  - text: $S = ]3, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]4, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los términos con la variable $x$ en ambos miembros.'
- 'Paso 2: Trasponer las $x$ al miembro deseado invirtiendo sus signos.'
- 'Paso 3: Trasponer las constantes numéricas al miembro opuesto invirtiendo sus signos.'
- 'Paso 4: Reducir términos semejantes y dividir entre el coeficiente principal.'
errores_correccion: '- **Error común:** Trasponer $2x$ al otro lado sin cambiarle
  el signo (escribir $5x + 2x > 12$).

  - **Cómo corregirlo:** Los términos que suman pasan RESTANDO al cruzar el símbolo
  de inecuación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
  - 'Al resolver $5x - 3 < 2x + 9$, se pueden sumar directamente los términos $5x$ y $2x$ en el lado izquierdo obteniendo $7x$.'
  - 'Transponer el término $2x$ al lado izquierdo en $5x - 3 < 2x + 9$ exige invertir la dirección de la desigualdad.'
  - 'Agrupar incógnitas en el miembro derecho de una inecuación invalida el procedimiento de resolución.'
  - 'Al restar $5x$ en ambos lados de $3x + 1 \ge 5x - 7$, el resultado es $-2x + 1 \ge -7$ con inversión obligatoria inmediata del operador.'
  - 'Tener incógnitas en ambos miembros exige resolver dos inecuaciones independientes por separado.'
afirmaciones_verdaderas:
  - 'Para resolver inecuaciones con incógnita en ambos lados, se agrupan los términos algebraicos en un miembro y las constantes en el otro mediante adición/sustracción.'
  - 'Agrupar términos semejantes mediante adición o sustracción mantiene siempre la dirección original del operador de orden.'
al_terminar_debes_poder: |
  QUÉ: Resolver inecuaciones lineales con la incógnita en ambos miembros de la desigualdad.
  CÓMO: Agrupar los términos con la variable en un miembro y los números en el otro, simplificar términos semejantes, despejar la incógnita y declarar el conjunto solución.
fuente: 'Texto escolar MINEDUC — Álgebra / Inecuaciones Lineales'
