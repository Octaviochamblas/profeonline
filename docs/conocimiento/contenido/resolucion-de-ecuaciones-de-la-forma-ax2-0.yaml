procedimiento:
- 'Paso 1: Verifica que la ecuación tenga la forma $ax^2=0$, sin términos lineales
  ni independientes.'
- 'Paso 2: Divide ambos lados por $a$ para obtener $x^2=0$.'
- 'Paso 3: Extrae raíz cuadrada, concluyendo que $x=0$ es la única solución (raíz
  doble).'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en resolución de ecuaciones de la forma ax² = 0.
ejemplos:
- titulo: Resolución directa
  enunciado: Resuelve $5x^2=0$.
  solucion_pasos:
  - 'Dividiendo por $5$: $x^2=0$.'
  - $x=0$ (raíz doble).
- titulo: Resolución con coeficiente negativo
  enunciado: Resuelve $-3x^2=0$.
  solucion_pasos:
  - 'Dividiendo por $-3$: $x^2=0$.'
  - $x=0$ (raíz doble).
- titulo: ¿La ecuación $ax^2=0$ tiene dos soluciones reales distintas?
  enunciado: ¿La ecuación $ax^2=0$ tiene dos soluciones reales distintas?
  respuesta: 'No'
  solucion_pasos:
  - Tiene una única solución real, $x=0$, considerada raíz doble por su multiplicidad
    2.
- titulo: ¿El signo del coeficiente $a$ afecta la solución de $ax^2=0$?
  enunciado: ¿El signo del coeficiente $a$ afecta la solución de $ax^2=0$?
  respuesta: 'No'
  solucion_pasos:
  - Sin importar el signo de $a$ (siempre que sea distinto de cero), la única solución
    sigue siendo $x=0$.
errores_frecuentes:
- Reportar dos soluciones distintas en vez de reconocer que $x=0$ es una raíz doble.
- Aplicar innecesariamente la fórmula general en vez de despejar directamente.
- Olvidar dividir por $a$ antes de concluir que $x^2=0$.
- Confundir esta ecuación con una incompleta binomia o pura, que tienen un término
  adicional.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando resolución
  de ecuaciones de la forma ax² = 0.
