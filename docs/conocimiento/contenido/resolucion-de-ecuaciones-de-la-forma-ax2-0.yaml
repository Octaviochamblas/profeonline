semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_MONOMIA
resumen_inicial: La resolución de ecuaciones monomias $a x^2 = 0$ conduce siempre
  a la solución única doble $x = 0$.
explicacion_simple: 'Para resolver una **ecuación monomia $a x^2 = 0$** (con $a \neq
  0$):

  1. Dividimos toda la ecuación por el número $a$: $x^2 = \frac{0}{a} \implies x^2
  = 0$.

  2. Extraemos raíz cuadrada a ambos lados: $x = \pm \sqrt{0} = 0$.

  3. La única solución es **$x = 0$** (repetida dos veces).'
explicacion_formal: 'La **resolución analítica de la monomia cuadrática** $a x^2 =
  0$ con $a \in \mathbb{R}^*$ se formaliza por cancelación escalar:


  $$a x^2 = 0 \implies x^2 = 0 \implies x_1 = x_2 = 0$$


  **Desglose de la fórmula:**

  - Axioma de anulación por multiplicidad 2 en el anillo polinómico.'
definiciones_clave: '- **Solución trivial doble**: Solución única de valor cero con
  multiplicidad algebraíca igual a 2.'
propiedades_relaciones: '- **Independencia del coeficiente $a$**: El valor numérico
  de $a$ no altera la solución de la ecuación; para cualquier $a \neq 0$, la solución
  siempre es $x = 0$.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación cuadrática $-8x^2 = 0$.
  pasos:
  - 'Paso 1: Dividir ambos lados por el coeficiente $-8$: $x^2 = \frac{0}{-8}$.Paso
    2: Simplificar la división: $x^2 = 0$.Paso 3: Aplicar raíz cuadrada: $x = 0$.Paso
    4: Concluir que la solución es $x = 0$ (raíz doble).'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la ecuación cuadrática $-8x^2 = 0$, ¿cuál es el conjunto solución?
  choices:
  - text: $S = \{0\}$
    is_correct: true
  - text: $S = \{-8, 0\}$
    is_correct: false
  - text: $S = \{8\}$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = \{0\}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre si dividimos la ecuación $\sqrt{3}x^2 = 0$ por $\sqrt{3}$?
  choices:
  - text: Obtenemos $x^2 = 0$, cuya solución es $x = 0$.
    is_correct: true
  - text: Obtenemos $x = \sqrt{3}$.
    is_correct: false
  - text: Se anula la ecuación sin solución.
    is_correct: false
  - text: La raíz se traslada al exponente.
    is_correct: false
  explanation: La alternativa correcta es 'Obtenemos $x^2 = 0$, cuya solución es $x
    = 0$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la ecuación en la forma $a x^2 = 0$.'
- 'Paso 2: Dividir por el coeficiente $a$ para obtener $x^2 = 0$.'
- 'Paso 3: Concluir que la solución única doble es $x = 0$.'
errores_correccion: '- **Error común:** Creer que si el coeficiente $a$ es negativo
  (como $-8$), la solución no existe en los reales.

  - **Cómo corregirlo:** $0 / -8 = 0$, lo cual es perfectamente válido y produce $x^2
  = 0 \implies x = 0$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución por factorización.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La propiedad del producto nulo exige que A * B = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, exige que el miembro derecho sea exactamente cero.
- titulo: ¿Toda ecuación incompleta ax^2 + bx = 0 admite la solución x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, al factorizar x(ax + b) = 0 se obtiene siempre x_1 = 0.
errores_frecuentes:
- Intentar aplicar la propiedad del producto nulo a una ecuación igualada a un número
  distinto de cero.
- Dividir una ecuación cuadrática entre la incógnita $x$ perdiendo la solución fundamental
  $x = 0$.
- Olvidar anteponer el doble signo $\pm$ al extraer raíz cuadrada en la resolución
  de $x^2 = k$.
- Confundir los números de los factores $(x+m)(x+n)$ con las soluciones reales de
  la ecuación (que tienen signos invertidos).
- Violar la jerarquía de operaciones al verificar raíces calculando multiplicaciones
  antes que potencias.
afirmaciones_verdaderas:
- La propiedad del producto nulo establece que $A \cdot B = 0 \iff A = 0 \lor B =
  0$.
- Toda ecuación incompleta binomia $a x^2 + b x = 0$ se resuelve por factor común
  $x(a x + b) = 0$ produciendo siempre la raíz $x = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones cuadráticas
  completas e incompletas mediante factorización de monomio común, trinomios simples,
  trinomios generales y verificación de raíces.
