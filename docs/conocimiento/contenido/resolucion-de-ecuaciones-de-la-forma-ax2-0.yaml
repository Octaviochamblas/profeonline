semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_MONOMIA
resumen_inicial: 'Resolución de ecuaciones de la forma ax² = 0: concepto, discriminante,
  soluciones y modelamiento en Resolución por factorización.'
explicacion_simple: 'Este es el tipo de ecuación cuadrática más simple de resolver:
  solo tiene un término, y despejarlo es casi inmediato.'
explicacion_formal: '### Definición formal


  Dada la ecuación $ax^2=0$ con $a \neq 0$, dividiendo ambos lados por $a$ se obtiene
  $x^2=0$, cuya única solución real es $x=0$, considerada raíz de multiplicidad 2
  (raíz doble).


  ### Desarrollo didáctico


  No es necesario aplicar la fórmula general ni completar el cuadrado: basta con despejar
  $x^2$ y luego extraer raíz cuadrada, notando que $\sqrt{0}=0$ produce un único valor,
  no dos.


  Para $9x^2=0$: dividiendo por $9$, $x^2=0$, por lo que $x=0$ es la única solución
  (raíz doble).'
definiciones_clave: '- **Resolución de ecuaciones de la forma ax² = 0**: Elemento
  o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones de la forma ax² = 0.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando resolución de ecuaciones
    de la forma ax² = 0.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a resolución de ecuaciones
    de la forma ax² = 0.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
