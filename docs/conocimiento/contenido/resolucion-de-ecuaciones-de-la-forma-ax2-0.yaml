errores_frecuentes:
  - 'En la ecuación $-7x^2 = 0$, el signo negativo del coeficiente hace que no existan soluciones reales.'
  - 'La resolución de la ecuación monomia $4x^2 = 0$ entrega como solución principal al número $x = 4$.'
  - 'Una ecuación de la forma $ax^2 = 0$ requiere el uso obligatorio de la fórmula general cuadrática.'
  - 'El conjunto solución de la ecuación $10x^2 = 0$ está formado por dos raíces reales distintas.'
  - 'Dividir el cero entre un coeficiente negativo genera una indefinición matemática.'
afirmaciones_verdaderas:
  - 'La resolución de la ecuación monomia $ax^2 = 0$ conduce siempre a $x^2 = 0$, teniendo como única raíz real a $x = 0$.'
  - 'El valor numérico o signo del coeficiente $a \neq 0$ no afecta la solución nula $x = 0$ en ecuaciones monomias.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones cuadráticas incompletas monomias $ax^2 = 0$.
  CÓMO: Dividir por el coeficiente cuadrático $a$, simplificar $x^2 = 0$ y establecer que la única raíz doble es $x = 0$.
