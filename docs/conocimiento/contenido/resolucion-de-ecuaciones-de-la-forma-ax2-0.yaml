semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_MONOMIA
resumen_inicial: La resolución de una ecuación cuadrática monomia $ax^2 = 0$ ($a \neq 0$) se efectúa dividiendo por el coeficiente principal $a$, obteniendo siempre a $x = 0$ como única solución real doble.
explicacion_simple: '![La resolución de una ecuación cuadrática monomia $ax^2 = 0$ ($a \neq 0$) se efectúa dividiendo por el coeficiente principal $a$, obteniendo siempre a $x = 0$ como única solución real doble](/static/img/nodos/resolucion-de-ecuaciones-de-la-forma-ax2-0-intro.svg)



  La ecuación cuadrática **$ax^2 = 0$** es la más directa de todas:

  - Tienes un número cualquiera $a$ multiplicando a $x^2$ e igualado a cero (por ejemplo, $8x^2 = 0$ o $-3x^2 = 0$).

  - Como el número $a$ no es cero, pasas dividiendo: $x^2 = \frac{0}{a} = 0$.

  - El único número que elevado al cuadrado da cero es el **cero** ($0^2 = 0$).

  - Por eso, **la respuesta es siempre $x = 0$ (raíz doble)**.'
explicacion_formal: 'Sea $ax^2 = 0$ con $a \in \mathbb{R} \setminus \{0\}$. Por la existencia del inverso multiplicativo $a^{-1} = \frac{1}{a}$:

  $$ax^2 = 0 \Longleftrightarrow \frac{1}{a}(ax^2) = \frac{1}{a}(0) \Longleftrightarrow x^2 = 0$$

  $$x \cdot x = 0 \Longleftrightarrow x_1 = 0 \quad \lor \quad x_2 = 0$$


  **Propiedades algebraicas y geométricas:**

  - **Multiplicidad algebraica**: $x = 0$ es una raíz de multiplicidad $m = 2$.

  - **Discriminante**: $\Delta = b^2 - 4ac = 0^2 - 4(a)(0) = 0$.

  - **Geometría de la parábola**: El vértice $V(0, 0)$ es el punto de tangencia con el eje $X$.'
definiciones_clave: '- **Ecuación cuadrática monomia**: Ecuación con un único término cuadrático $ax^2 = 0$.

  - **Solución doble**: Raíz repetida con multiplicidad dos proveniente de $(x - 0)^2 = 0$.'
propiedades_relaciones: '- **Invarianza por signo**: El signo de $a$ no altera la raíz $x = 0$ (aplica tanto a $5x^2 = 0$ como a $-5x^2 = 0$).

  - **Conjunto solución unitario**: $\mathcal{S} = \{0\}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de una ecuación cuadrática monomia $ax^2 = 0$ ($a \neq 0$) se efectúa dividiendo por el coeficiente principal $a$, obteniendo siempre a $x = 0$ como única solución real doble](/static/img/nodos/resolucion-de-ecuaciones-de-la-forma-ax2-0-ejemplos.svg)



    Resuelve la ecuación $-\frac{5}{8}x^2 = 0$ justificando analíticamente su conjunto solución.'
  pasos:
  - 'Paso 1: Identificar el coeficiente cuadrático: $a = -\frac{5}{8} \neq 0$.'
  - 'Paso 2: Multiplicar ambos lados por el recíproco $-\frac{8}{5}$: $x^2 = 0 \cdot \left(-\frac{8}{5}\right) = 0$.'
  - 'Paso 3: Aplicar la raíz cuadrada: $x = \pm \sqrt{0} = 0$.'
  - 'Paso 4: Declarar la solución real doble: $x_1 = x_2 = 0$.'
  - 'Paso 5: Escribir el conjunto solución: $\mathcal{S} = \{0\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la solución de la ecuación $-12x^2 = 0$?
  choices:
  - text: x = 0 (solucion doble)
    is_correct: true
  - text: x = 12 y x = -12
    is_correct: false
  - text: No tiene solucion real por ser negativo el coeficiente.
    is_correct: false
  - text: x = -12
    is_correct: false
  explanation: La alternativa correcta es 'x = 0 (solucion doble)'. Dividiendo entre $-12$ se obtiene $x^2 = 0 \implies x = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor del discriminante Δ en cualquier ecuación de la forma $ax^2 = 0$?
  choices:
  - text: Δ = 0
    is_correct: true
  - text: Δ > 0
    is_correct: false
  - text: Δ < 0
    is_correct: false
  - text: Depende del signo de a.
    is_correct: false
  explanation: La alternativa correcta es 'Δ = 0'. Con $b = 0$ y $c = 0$, $\Delta = 0^2 - 4(a)(0) = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la ecuación tenga la forma monomia $ax^2 = 0$.'
- 'Paso 2: Dividir ambos miembros entre el coeficiente $a$ para aislar $x^2 = 0$.'
- 'Paso 3: Extraer la raíz cuadrada obteniendo la solución única $x = 0$.'
- 'Paso 4: Registrar $x = 0$ como raíz con multiplicidad 2.'
errores_correccion: '- **Error común:** Pensar que si $a$ es negativo (como en $-4x^2 = 0$), la ecuación no tiene solución real.

  - **Cómo corregirlo:** Al pasar dividiendo el número negativo, $x^2 = \frac{0}{-4} = 0$, lo que **SÍ tiene solución real ($x = 0$)**.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente entero positivo'
  enunciado: Resuelve $6x^2 = 0$.
  alternativas:
  - x = 0
  - x = 6 y x = -6
  - x = 6
  - Sin solución
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: $x^2 = 0/6 = 0 \implies x = 0$.'
- titulo: 'Ejemplo 2: Coeficiente negativo'
  enunciado: Resuelve $-9x^2 = 0$.
  alternativas:
  - x = 0
  - x = 3 y x = -3
  - x = -9
  - No es real
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: $x^2 = 0/(-9) = 0 \implies x = 0$.'
- titulo: 'Ejemplo 3: Coeficiente fraccionario'
  enunciado: Resuelve $\frac{4}{9}x^2 = 0$.
  alternativas:
  - x = 0
  - x = 2/3 y x = -2/3
  - x = 4/9
  - x = 9/4
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: $x^2 = 0 \implies x = 0$.'
- titulo: 'Ejemplo 4: Monomio mónic'
  enunciado: ¿Cuál es la solución de $x^2 = 0$?
  alternativas:
  - x = 0 (raíz doble)
  - x = 1 y x = -1
  - x = 1
  - Sin solución
  respuesta: x = 0 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $x = 0$ con multiplicidad dos.'
errores_frecuentes:
- Asumir que no hay solución por falta de términos lineales o libres.
- Confundir ax² = 0 con ax² + c = 0.
- Pensar que a pasa restando en lugar de dividiendo.
afirmaciones_verdaderas:
- Toda ecuación cuadrática monomia ax² = 0 posee a x = 0 como su única solución real doble.
- El valor numérico del coeficiente cuadrático no modifica la raíz nula de ax² = 0.
al_terminar_debes_poder: '**QUÉ:** Resolver con fluidez ecuaciones cuadráticas monomias de la forma ax² = 0.


  **CÓMO:** Aislando la potencia x² = 0 y determinando la raíz doble x = 0.


