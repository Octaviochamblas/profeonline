semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CRITERIO_AA
resumen_inicial: 'El Criterio de Semejanza AA (Ángulo-Ángulo) establece que si dos triángulos tienen dos pares de ángulos correspondientes congruentes, entonces son semejantes.'
explicacion_simple: |
  ![Criterio de Semejanza AA (Ángulo - Ángulo)](/static/img/nodos/criterio-de-semejanza-aa-dos-angulos-correspondientes-congruentes-intro.svg)

  Si dos triángulos comparten dos ángulos iguales, automáticamente tienen la misma forma y son semejantes.
explicacion_formal: |
  ### Teorema formal (Criterio AA)
  Sean $\Delta ABC$ y $\Delta DEF$ dos triángulos en $\mathbb{R}^2$. Si:

  $$\angle A \cong \angle D \quad \land \quad \angle B \cong \angle E$$

  Entonces:

  $$\Delta ABC \sim \Delta DEF$$

  ### Desglose simbólico y geométrico
  - Consecuencia euclidiana: $\angle C = 180^\circ - (\angle A + \angle B) = 180^\circ - (\angle D + \angle E) = \angle F$. Por tanto, el criterio AA es equivalente a AAA (Ángulo-Ángulo-Ángulo).
  - Teorema del Seno: $\frac{a}{\sin A} = \frac{b}{\sin B} = \frac{c}{\sin C}$ y $\frac{d}{\sin D} = \frac{e}{\sin E} = \frac{f}{\sin F}$. Al ser los senos iguales, los lados homólogos son estrictamente proporcionales: $\frac{d}{a} = \frac{e}{b} = \frac{f}{c} = k$.

  ### Síntesis didáctica
  Es el criterio más potente y rápido para demostrar semejanza en pruebas y problemas geométricos.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Criterio de Semejanza AA (Ángulo - Ángulo)](/static/img/nodos/criterio-de-semejanza-aa-dos-angulos-correspondientes-congruentes-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
