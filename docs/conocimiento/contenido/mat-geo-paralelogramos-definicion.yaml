semantic_id: MAT.GEO.PARALELOGRAMOS.DEFINICION
resumen_inicial: 'Definición de paralelogramo como cuadrilátero con dos pares de lados
  paralelos: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y
  Cuadriláteros.'
explicacion_simple: 'Dentro de la familia de los cuadriláteros, existe un grupo especial
  caracterizado por una propiedad de paralelismo entre sus lados opuestos: los paralelogramos.'
explicacion_formal: '![Paralelogramo: dos pares de lados paralelos](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-definicion.svg)


  ### Definición formal


  Un cuadrilátero $ABCD$ es un paralelogramo si $AB\parallel CD$ y $BC\parallel AD$
  (los dos pares de lados opuestos son paralelos).


  ### Desarrollo didáctico


  El cuadrado, el rectángulo, el rombo y el romboide son todos casos particulares
  de paralelogramo, cada uno con propiedades adicionales específicas. Un trapecio,
  en cambio, no es un paralelogramo, ya que solo tiene un par de lados paralelos,
  no dos.'
definiciones_clave: '- **Definición de paralelogramo como cuadrilátero con dos pares
  de lados paralelos**: Elemento o propiedad fundamental en el estudio de polígonos
  y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
