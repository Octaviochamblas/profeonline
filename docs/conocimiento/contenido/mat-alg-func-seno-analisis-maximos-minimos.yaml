procedimiento:
- 'Paso 1: Identifica el primer máximo dentro de un período, en $x=\pi/2$.'
- 'Paso 2: Suma múltiplos de $2\pi$ para encontrar todos los demás máximos.'
- 'Paso 3: Repite el proceso con $x=3\pi/2$ para encontrar todos los mínimos.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en identificación de máximos
  y mínimos de la función seno base.
ejemplos:
- titulo: Verificación de un máximo
  enunciado: ¿Es $x=5\pi/2$ un máximo de $f(x)=\sin(x)$?
  solucion_pasos:
  - 'Se verifica: $5\pi/2=\pi/2+2\pi$.'
  - Sí, es un máximo, ya que corresponde a un período completo después de $\pi/2$.
- titulo: Verificación de un mínimo
  enunciado: ¿Es $x=-\pi/2$ un mínimo de $f(x)=\sin(x)$?
  solucion_pasos:
  - Se calcula $\sin(-\pi/2)=-1$.
  - Sí, es un mínimo de la función.
- titulo: ¿La distancia entre un máximo y el siguiente máximo es igual al periodo?
  enunciado: ¿La distancia entre dos máximos consecutivos de $f(x)=\sin(x)$ es igual
    al periodo $2\pi$?
  respuesta: Sí
  solucion_pasos:
  - Al repetirse el patrón cada $2\pi$, los máximos también se repiten con esa misma
    separación.
- titulo: ¿El máximo y el mínimo están separados por medio periodo?
  enunciado: ¿La distancia entre un máximo y el mínimo más cercano es la mitad del
    periodo?
  respuesta: Sí
  solucion_pasos:
  - Entre $\pi/2$ y $3\pi/2$ hay exactamente $\pi$, la mitad del periodo $2\pi$.
errores_frecuentes:
- Declarar la posición del máximo con la del mínimo.
- Omitir sumar múltiplos de $2\pi$ para encontrar todos los máximos y mínimos posibles.
- Declarar estos valores con los ceros de la función.
- Aplicar la fórmula del seno a la función coseno, donde las posiciones son distintas.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  identificación de máximos y mínimos de la función seno base.
