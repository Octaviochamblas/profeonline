semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.MAXIMOS_MINIMOS
resumen_inicial: 'Identificación de los puntos máximos (crestas a $y=1$) y mínimos (valles a $y=-1$) de la función seno base $f(x) = \sin(x)$.'
explicacion_simple: |
  La onda del seno oscila continuamente entre su punto más alto y su punto más bajo. Los **puntos máximos** (crestas) son los lugares donde la altura llega al techo $y = 1$; en el primer giro, esto sucede en $x = \frac{\pi}{2}$ ($90^\circ$). Los **puntos mínimos** (valles) son los lugares donde la altura cae al piso $y = -1$; en el primer giro, esto ocurre en $x = \frac{3\pi}{2}$ ($270^\circ$). Como la onda se repite infinitamente, estos picos y valles vuelven a aparecer periódicamente cada $2\pi$ unidades.
explicacion_formal: |
  ### Definición formal
  Los **puntos extremos locales y absolutos** de la función seno fundamental $f(x) = \sin(x)$ en el conjunto de los números reales $\mathbb{R}$ se clasifican en:

  1. **Máximos absolutos**: Puntos donde $f(x) = 1$:
     $$\mathcal{M}_{\max} = \left\{\left(\frac{\pi}{2} + 2k\pi, 1\right) : k \in \mathbb{Z}\right\}$$

  2. **Mínimos absolutos**: Puntos donde $f(x) = -1$:
     $$\mathcal{M}_{\min} = \left\{\left(\frac{3\pi}{2} + 2k\pi, -1\right) : k \in \mathbb{Z}\right\}$$

  ### Desglose simbólico
  - $x = \frac{\pi}{2}$ ($k = 0$): Primer máximo en $\left(\frac{\pi}{2}, 1\right)$.
  - $x = \frac{3\pi}{2}$ ($k = 0$): Primer mínimo en $\left(\frac{3\pi}{2}, -1\right)$.
  - $x = \frac{5\pi}{2}$ ($k = 1$): Segundo máximo en $\left(\frac{5\pi}{2}, 1\right)$.
  - $x = -\frac{\pi}{2}$ ($k = -1$): Mínimo en el sentido negativo en $\left(-\frac{\pi}{2}, -1\right)$.

  ### Síntesis didáctica
  La distancia horizontal entre un máximo consecutivo y un mínimo consecutivo de la función seno base es exactamente $\pi$ unidades ($180^\circ$). En cada máximo o mínimo la recta tangente a la curva es perfectamente horizontal (pendiente nula $f'(x) = \cos x = 0$).
definiciones_clave: |
  - **Máximo absoluto**: Valor supremo $y = 1$ que alcanza la función sobre su dominio.
  - **Mínimo absoluto**: Valor ínfimo $y = -1$ que alcanza la función sobre su dominio.
  - **Puntos críticos horizontales**: Puntos donde la pendiente de la recta tangente se anula ($\cos x = 0$).
propiedades_relaciones: |
  - **Simetría entre extremos**: El punto medio entre un máximo $\left(\frac{\pi}{2}, 1\right)$ y un mínimo $\left(\frac{3\pi}{2}, -1\right)$ es un cero de la función $(\pi, 0)$.
  - **Desfase respecto al coseno**: Los máximos del seno ocurren exactamente donde el coseno se anula.
ejemplo_guiado:
  enunciado: 'Encuentra las coordenadas del primer punto máximo y del primer punto mínimo positivos de la función $f(x) = 4\sin(x)$.'
  pasos:
    - 'Paso 1: Recordar las abscisas de los máximos y mínimos de la función seno base: máximo en $x = \frac{\pi}{2}$ y mínimo en $x = \frac{3\pi}{2}$.'
    - 'Paso 2: Calcular el valor máximo multiplicando por la amplitud $A = 4$: $y_{\max} = 4 \cdot 1 = 4$. Coordenadas del máximo: $\left(\frac{\pi}{2}, 4\right)$.'
    - 'Paso 3: Calcular el valor mínimo multiplicando por la amplitud $A = 4$: $y_{\min} = 4 \cdot (-1) = -4$. Coordenadas del mínimo: $\left(\frac{3\pi}{2}, -4\right)$.'
    - 'Paso 4: Concluir que la onda oscila entre la cresta $\left(\frac{\pi}{2}, 4\right)$ y el valle $\left(\frac{3\pi}{2}, -4\right)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué abscisas se alcanzan todos los puntos máximos de la función seno base $f(x) = \sin(x)$?'
    choices:
      - {text: '$x = \frac{\pi}{2} + 2k\pi$ con $k \in \mathbb{Z}$', is_correct: true}
      - {text: '$x = k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = \frac{3\pi}{2} + 2k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = 2k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{\pi}{2} + 2k\pi$ con $k \in \mathbb{Z}$''. La función alcanza $y = 1$ en $\frac{\pi}{2}$ repetido cada período de $2\pi$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la ordenada del punto mínimo de la función base $y = \sin(x)$?'
    choices:
      - {text: '$-1$', is_correct: true}
      - {text: '$0$', is_correct: false}
      - {text: '$1$', is_correct: false}
      - {text: '$-2\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$''. La cota mínima que alcanza el seno base es la ordenada $y = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las abscisas donde el seno se iguala a $+1$ (máximos) y a $-1$ (mínimos).'
  - 'Paso 2: Evaluar la función $f(x)$ en dichas abscisas para obtener las ordenadas extremas.'
  - 'Paso 3: Añadir la periodicidad $2k\pi$ ($k \in \mathbb{Z}$) para registrar todos los puntos infinitos de la gráfica.'
  - 'Paso 4: Escribir las coordenadas completas $(x_{\max}, y_{\max})$ y $(x_{\min}, y_{\min})$.'
errores_correccion: |
  - **Error 1:** Afirmar que el punto máximo del seno ocurre en $x = \pi$. **Cómo corregirlo:** En $x = \pi$ la función vale cero. El máximo ocurre en $x = \frac{\pi}{2}$ ($90^\circ$).
  - **Error 2:** Creer que la distancia entre un máximo y el siguiente máximo es de $\pi$ radianes. **Cómo corregirlo:** La distancia entre dos máximos consecutivos es de **un período completo** ($2\pi$). La distancia de $\pi$ corresponde al trayecto de un máximo al mínimo siguiente.
ejemplos:
  - titulo: 'Primer máximo positivo'
    enunciado: '¿Cuáles son las coordenadas del primer máximo positivo de $y = \sin(x)$?'
    alternativas:
      - '$\left(\frac{\pi}{2}, 1\right)$'
      - '$(\pi, 1)$'
      - '$(0, 1)$'
    respuesta: '$\left(\frac{\pi}{2}, 1\right)$'
    solucion_pasos:
      - '1. $\sin\left(\frac{\pi}{2}\right) = 1$.'
      - '2. El punto es $\left(\frac{\pi}{2}, 1\right)$.'
  - titulo: 'Primer mínimo positivo'
    enunciado: '¿En qué punto alcanza su primer mínimo positivo la curva $y = \sin(x)$?'
    alternativas:
      - '$\left(\frac{3\pi}{2}, -1\right)$'
      - '$\left(\frac{\pi}{2}, -1\right)$'
      - '$(2\pi, -1)$'
    respuesta: '$\left(\frac{3\pi}{2}, -1\right)$'
    solucion_pasos:
      - '1. $\sin\left(\frac{3\pi}{2}\right) = -1$.'
      - '2. El punto es $\left(\frac{3\pi}{2}, -1\right)$.'
  - titulo: 'Mínimo en ángulo negativo'
    enunciado: '¿El punto $\left(-\frac{\pi}{2}, -1\right)$ es un punto mínimo de la función seno base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\sin\left(-\frac{\pi}{2}\right) = -\sin\left(\frac{\pi}{2}\right) = -1$.'
  - titulo: 'Distancia entre máximo y mínimo'
    enunciado: '¿La distancia horizontal entre el máximo en $\frac{\pi}{2}$ y el mínimo en $\frac{3\pi}{2}$ es igual a $\pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\frac{3\pi}{2} - \frac{\pi}{2} = \frac{2\pi}{2} = \pi$.'
errores_frecuentes:
  - 'La afirmación de que el punto máximo de la función seno base se alcanza en $x = \pi$.'
  - 'La afirmación de que los puntos máximos de la función seno ocurren a la distancia de un solo radián.'
  - 'La afirmación de que la ordenada del punto mínimo de la función seno base es igual a cero.'
  - 'La afirmación de que existen únicamente dos puntos máximos en toda la gráfica del seno.'
  - 'La afirmación de que la pendiente de la sinusoide es inclinada en sus crestas y valles.'
afirmaciones_verdaderas:
  - 'Los máximos absolutos de la función seno base $f(x) = \sin(x)$ ocurren en los puntos $\left(\frac{\pi}{2} + 2k\pi, 1\right)$ para todo $k \in \mathbb{Z}$.'
  - 'Los mínimos absolutos de la función seno base ocurren en los puntos $\left(\frac{3\pi}{2} + 2k\pi, -1\right)$ para todo $k \in \mathbb{Z}$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y ubicar los puntos máximos y mínimos de la función seno base y de sus transformaciones.
  CÓMO: Hallar las abscisas donde $\sin(\text{argumento}) = \pm 1$ y calcular las ordenadas extremas correspondientes.
