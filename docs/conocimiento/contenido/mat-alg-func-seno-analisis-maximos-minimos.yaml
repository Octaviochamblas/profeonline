semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.MAXIMOS_MINIMOS
resumen_inicial: 'Identificación de máximos y mínimos de la función seno base: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función seno.'
explicacion_simple: La curva del seno alcanza su punto más alto y más bajo en posiciones
  específicas y regularmente espaciadas dentro de cada período.
explicacion_formal: '### Definición formal


  El máximo de $\sin(x)$ ocurre cuando el punto asociado es $(0,1)$, es decir, cuando
  $x=\pi/2+2n\pi$. El mínimo ocurre cuando el punto asociado es $(0,-1)$, es decir,
  cuando $x=3\pi/2+2n\pi$ (equivalente a $-\pi/2+2n\pi$).


  ### Desarrollo didáctico


  Dentro de un período, el máximo se alcanza en $x=\pi/2$ y el mínimo en $x=3\pi/2$.
  Sumando múltiplos de $2\pi$ se obtienen todos los demás máximos y mínimos: $x=\pi/2+2\pi=5\pi/2$
  también es un máximo.'
definiciones_clave: '- **Identificación de máximos y mínimos de la función seno base**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de máximos y mínimos de la función seno base.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de máximos y mínimos de la función seno base.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de máximos y mínimos de la función seno
    base.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
