resumen_inicial: La aplicación de la regla del cubo de binomio diferencia permite
  expandir restas de monomios complejos $(c_1 x^m - c_2 y^n)^3$ aplicando el patrón
  de signos $+ - + -$.
explicacion_simple: 'Para resolver $(4a^2 - 3b^3)^3$, aplicamos los cuatro bloques
  con los signos $+ - + -$: elevamos el primer bloque al cubo ($(4a^2)^3 = 64a^6$),
  restamos el primer triple producto ($-144a^4b^3$), sumamos el segundo triple producto
  ($+108a^2b^6$), y restamos el cubo del segundo bloque ($-27b^9$).'
explicacion_formal: 'Para cualesquiera monomios $A = c_1 x^m$ y $B = c_2 y^n$, el
  desarrollo de $(A - B)^3$ se rige por la identidad:


  $$(A - B)^3 = A^3 - 3A^2B + 3AB^2 - B^3$$

  $$= (c_1 x^m)^3 - 3(c_1 x^m)^2(c_2 y^n) + 3(c_1 x^m)(c_2 y^n)^2 - (c_2 y^n)^3$$

  $$= c_1^3 x^{3m} - 3c_1^2 c_2 x^{2m} y^n + 3c_1 c_2^2 x^m y^{2n} - c_2^3 y^{3n}$$


  **Desglose simbólico:**

  - $+c_1^3 x^{3m}$: Cubo del primer monomio (signo positivo).

  - $-3c_1^2 c_2 x^{2m} y^n$: Término mixto de grado $2m+n$ con signo negativo.

  - $+3c_1 c_2^2 x^m y^{2n}$: Término mixto de grado $m+2n$ con signo positivo.

  - $-c_2^3 y^{3n}$: Cubo del segundo monomio con signo negativo.


  > **Complemento didáctico:** Esta regla combina la potencia de exponentes con la
  alternancia de signos aditivos sin cometer errores de signo en los coeficientes.'
definiciones_clave: '- **Signo alternado en monomios**: Estructura de signos $+ -
  + -$ adaptada a monomios compuestos.

  - **Leyes de exponentes cúbicos**: $(x^m)^3 = x^{3m}$ y $(x^m)^2 = x^{2m}$.'
propiedades_relaciones: '- **Forma canónica de 4 términos**: Todo cubo de binomio
  diferencia con $A, B \neq 0$ resulta en un polinomio de 4 términos no nulos.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(4a^2 - 3b^3)^3$ aplicando la regla del cubo
    de binomio diferencia.
  pasos:
  - 'Paso 1: Identificar $A = 4a^2$ y $B = 3b^3$.'
  - 'Paso 2: Elevar $A$ al cubo: $(4a^2)^3 = 64a^6$.'
  - 'Paso 3: Calcular el primer triple producto negativo: $-3(4a^2)^2(3b^3) = -3(16a^4)(3b^3)
    = -144a^4b^3$.'
  - 'Paso 4: Calcular el segundo triple producto positivo: $+3(4a^2)(3b^3)^2 = +3(4a^2)(9b^6)
    = +108a^2b^6$.'
  - 'Paso 5: Elevar $B$ al cubo restando: $-(3b^3)^3 = -27b^9$.'
  - 'Paso 6: Ensamblar la expresión: $64a^6 - 144a^4b^3 + 108a^2b^6 - 27b^9$.'
  - 'Conclusión: El desarrollo simplificado es $64a^6 - 144a^4b^3 + 108a^2b^6 - 27b^9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de elevar el segundo monomio $B = 3b^3$ al cubo
    en $(4a^2 - 3b^3)^3$?
  choices:
  - text: $-27b^9$
    is_correct: true
  - text: $+27b^9$
    is_correct: false
  - text: $-9b^9$
    is_correct: false
  - text: $-27b^6$
    is_correct: false
  explanation: La alternativa correcta es '$-27b^9$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $(4a^2 - 3b^3)^3$, ¿cuál es el coeficiente del
    término $a^4b^3$?
  choices:
  - text: $-144$, obtenido de $-3 \cdot 16 \cdot 3$
    is_correct: true
  - text: $+108$
    is_correct: false
  - text: $-36$
    is_correct: false
  - text: $+144$
    is_correct: false
  explanation: La alternativa correcta es '$-144$, obtenido de $-3 \cdot 16 \cdot
    3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cubo el coeficiente y multiplicar por 3 el exponente del primer
  monomio ($+A^3$).'
- 'Paso 2: Calcular $-3 \cdot c_1^2 \cdot c_2$ y ajustar exponentes para el término
  negativo.'
- 'Paso 3: Calcular $+3 \cdot c_1 \cdot c_2^2$ y ajustar exponentes para el término
  positivo.'
- 'Paso 4: Elevar al cubo el coeficiente y multiplicar por 3 el exponente del segundo
  monomio ($-B^3$).'
errores_correccion: '- **Error 1: Cambiar a negativo el signo del tercer término $+3AB^2$.**
  **Cómo corregirlo:** El tercer término incluye $(-B)^2 = +B^2$, lo que obliga a
  tener un signo POSITIVO.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle la expresión $(5x - 2y^2)^3$.
  alternativas:
  - $125x^3 - 150x^2y^2 + 60xy^4 - 8y^6$
  - $125x^3 - 8y^6$
  - $125x^3 - 150x^2y^2 - 60xy^4 - 8y^6$
  respuesta: $125x^3 - 150x^2y^2 + 60xy^4 - 8y^6$
  solucion_pasos:
  - 1. $(5x)^3 = 125x^3$.
  - 2. $-3(25x^2)(2y^2) = -150x^2y^2$.
  - 3. $+3(5x)(4y^4) = +60xy^4$.
  - '4. $-(2y^2)^3 = -8y^6$. Resultado: $125x^3 - 150x^2y^2 + 60xy^4 - 8y^6$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(2m^2 - 1)^3$?
  alternativas:
  - $8m^6 - 12m^4 + 6m^2 - 1$
  - $8m^6 - 1$
  - $8m^6 - 6m^4 + 6m^2 - 1$
  respuesta: $8m^6 - 12m^4 + 6m^2 - 1$
  solucion_pasos:
  - 1. $(2m^2)^3 = 8m^6$.
  - 2. $-3(4m^4)(1) = -12m^4$.
  - 3. $+3(2m^2)(1) = +6m^2$.
  - '4. $-1^3 = -1$. Resultado: $8m^6 - 12m^4 + 6m^2 - 1$.'
- titulo: ¿Es $27x^3 - 27x^2 + 9x - 1$ la expansión correcta de $(3x - 1)^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3x)^3 - 3(9x^2)(1) + 3(3x)(1) - 1 = 27x^3 - 27x^2 + 9x - 1$.
- titulo: ¿El tercer término de $(a - 2b)^3$ lleva signo negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, lleva signo positivo por ser $+3a(-2b)^2 = +12ab^2$.
errores_frecuentes:
- Asignar signo negativo al tercer término del desarrollo del cubo de diferencia.
- Declarar que $(4a^2 - 3b^3)^3$ es equivalente a $64a^6 - 27b^9$.
- Multiplicar por 3 los coeficientes en lugar de elevarlos al cubo en los extremales.
- Sumar 3 a los exponentes de las variables al elevar a la potencia cúbica.
- Asignar todos los signos negativos en la expansión de monomios complejos.
afirmaciones_verdaderas:
- El patrón de signos $+ - + -$ se mantiene invariable independiente de la complejidad
  de los monomios.
- El grado total del último término es tres veces el grado del segundo monomio.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla del cubo de binomio
  diferencia sobre monomios complejos sin cometer errores de signo.
