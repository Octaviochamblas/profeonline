semantic_id: MAT.ALG.CUBO_BINOMIO.REGLA_DIFERENCIA
resumen_inicial: 'La aplicación de la regla del cubo de binomio diferencia consiste en expandir expresiones del tipo $(ax^n - by^m)^3$ combinando el cálculo de coeficientes y potencias monómicas con la alternancia estricta de signos $(+, -, +, -)$.'
explicacion_simple: |
  Para expandir binomios resta con coeficientes y exponentes grandes como $(3x^2 - 2)^3$:
  - **FÓRMULA PASO A PASO CON SIGNOS (+, -, +, -)**:
    $$(a - b)^3 = \mathbf{+a^3 - 3a^2 b + 3ab^2 - b^3}$$
  - **Pasos detallados con $(3x^2 - 2)^3$**:
    1. **Término $+a^3$**: $(3x^2)^3 = 3^3 \cdot (x^2)^3 = \mathbf{+27x^6}$.
    2. **Término $-3a^2b$**: $-3 \cdot (3x^2)^2 \cdot 2 = -3 \cdot (9x^4) \cdot 2 = \mathbf{-54x^4}$.
    3. **Término $+3ab^2$**: $+3 \cdot (3x^2) \cdot 2^2 = +3 \cdot (3x^2) \cdot 4 = \mathbf{+36x^2}$.
    4. **Término $-b^3$**: $-(2)^3 = \mathbf{-8}$.
  - **Resultado unificado**: **$27x^6 - 54x^4 + 36x^2 - 8$**.
explicacion_formal: |
  ### Definición formal
  Sea la diferencia de monomios multivariables $B = (c_1 x^{\alpha} - c_2 y^{\beta})$ en $\mathbb{R}[x,y]$. La regla del cubo de binomio diferencia aplica la forma cerrada:

  $$\mathbf{(c_1 x^{\alpha} - c_2 y^{\beta})^3 = +c_1^3 x^{3\alpha} - 3 c_1^2 c_2 x^{2\alpha} y^{\beta} + 3 c_1 c_2^2 x^{\alpha} y^{2\beta} - c_2^3 y^{3\beta}}$$

  ### Preservación de la Signatura Alternada
  Las cuatro componentes monómicas preservan invariante el patrón de signatura $(+, -, +, -)$ independientemente del grado $\alpha, \beta$ o magnitud de los coeficientes reales $c_1, c_2 > 0$.

  ### Síntesis didáctica
  Consolidar por separado los coeficientes absolutos y luego adosar el vector de signos $(+, -, +, -)$ simplifica el desarrollo y evita errores de arrastre de signos negativos.
definiciones_clave: |
  - **Vector de signatura alternada $(+, -, +, -)$**: Asignación prefijada de signos para los cuatro términos del cubo de la diferencia.
  - **Coeficiente mónico de potencia ($c_1^3, 3c_1^2c_2, 3c_1c_2^2, c_2^3$)**: Valores numéricos absolutos que escalan cada uno de los cuatro términos.
  - **Grado graduado del tetranomio**: Disminución progresiva del grado en la variable principal $3\alpha, 2\alpha, \alpha, 0$.
propiedades_relaciones: |
  - **Invarianza del patrón de signos**: La secuencia $(+, -, +, -)$ aplica para cualquier binomio resta, sin importar la complejidad de sus componentes monómicas.
ejemplo_guiado:
  enunciado: 'Desarrolla mediante la regla del cubo de binomio diferencia la expresión $(2x^4 - 3y^2)^3$.'
  pasos:
    - 'Paso 1: Identificamos $a = 2x^4$ y $b = 3y^2$.'
    - 'Paso 2: Calculamos $+a^3$: $(2x^4)^3 = 2^3 \cdot (x^4)^3 = \mathbf{+8x^{12}}$.'
    - 'Paso 3: Calculamos $-3a^2b$: $-3 \cdot (2x^4)^2 \cdot (3y^2) = -3 \cdot (4x^8) \cdot (3y^2) = \mathbf{-36x^8 y^2}$.'
    - 'Paso 4: Calculamos $+3ab^2$: $+3 \cdot (2x^4) \cdot (3y^2)^2 = +3 \cdot (2x^4) \cdot (9y^4) = \mathbf{+54x^4 y^4}$.'
    - 'Paso 5: Calculamos $-b^3$: $-(3y^2)^3 = -3^3 \cdot (y^2)^3 = \mathbf{-27y^6}$.'
    - 'Paso 6: Unimos los 4 términos: $8x^{12} - 36x^8 y^2 + 54x^4 y^4 - 27y^6$.'
    - 'Conclusión: El desarrollo es **$8x^{12} - 36x^8 y^2 + 54x^4 y^4 - 27y^6$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la expansión de $(3a^2 - 4b)^3$, ¿qué signo y coeficiente tendrá el tercer término $+3ab^2$?'
    choices:
      - {text: 'Tendrá signo positivo (+) y coeficiente $3 \cdot (3a^2) \cdot (4b)^2 = 3 \cdot 3 \cdot 16 = \mathbf{+144 a^2 b^2}$', is_correct: true}
      - {text: 'Tendrá signo negativo (-)', is_correct: false}
      - {text: 'Tendrá coeficiente 36', is_correct: false}
      - {text: 'Tendrá signo cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Tendrá signo positivo (+) y coeficiente $3 \cdot (3a^2) \cdot (4b)^2 = 3 \cdot 3 \cdot 16 = \mathbf{+144 a^2 b^2}$''. Signo positivo por exponente par en el segundo término.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la expansión completa del binomio diferencia $(x^2 - 3)^3$?'
    choices:
      - {text: 'El resultado es $x^6 - 9x^4 + 27x^2 - 27$, alternando signos $(+, -, +, -)$', is_correct: true}
      - {text: 'El resultado es $x^6 - 27$', is_correct: false}
      - {text: 'El resultado es $x^6 - 9x^4 - 27x^2 - 27$', is_correct: false}
      - {text: 'El resultado es $x^6 + 9x^4 + 27x^2 + 27$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $x^6 - 9x^4 + 27x^2 - 27$, alternando signos $(+, -, +, -)$''. $x^6 - 3(x^4)(3) + 3(x^2)(9) - 27 = x^6 - 9x^4 + 27x^2 - 27$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Elevar el primer término al cubo asignándole signo positivo.'
  - 'Paso 2: Elevar al cuadrado el primer término, multiplicarlo por 3 y por el segundo, asignándole signo negativo.'
  - 'Paso 3: Elevar al cuadrado el segundo término, multiplicarlo por 3 y por el primero, asignándole signo positivo.'
  - 'Paso 4: Elevar el segundo término al cubo asignándole signo negativo.'
errores_correccion: |
  - **Error 1:** Asignar signo negativo al tercer término en binomios resta con coeficientes complejos. **Cómo corregirlo:** El tercer término **LLEVA SIEMPRE SIGNO POSITIVO (+3ab^2)**.
  - **Error 2:** Multiplicar los exponentes por 2 en los términos extremos en lugar de multiplicarlos por 3. **Cómo corregirlo:** En los términos extremos **LOS EXPONENTES SE MULTIPLICAN POR 3 ($(x^n)^3 = x^{3n}$)**.
ejemplos:
  - titulo: 'Cubo diferencia con exponentes'
    enunciado: '¿Cuál es la expansión de $(m^2 - 2)^3$?'
    alternativas:
      - '$m^6 - 6m^4 + 12m^2 - 8$'
      - '$m^6 - 8$'
      - '$m^6 - 6m^4 - 12m^2 - 8$'
    respuesta: '$m^6 - 6m^4 + 12m^2 - 8$'
    solucion_pasos:
      - '1. $+m^6$.'
      - '2. $-3(m^4)(2) = -6m^4$.'
      - '3. $+3(m^2)(4) = +12m^2$.'
      - '4. $-2^3 = -8$.'
      - '5. Resultado: $m^6 - 6m^4 + 12m^2 - 8$.'
  - titulo: 'Término dependiente de y'
    enunciado: 'Para $(x - 2y)^3$, ¿es el término final $-8y^3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-(2y)^3 = -8y^3$.'
  - titulo: 'Preservación de alternancia'
    enunciado: '¿Mantiene la expansión $(3x - 1)^3 = 27x^3 - 27x^2 + 9x - 1$ la alternancia de signos $(+, -, +, -)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, los signos son $+27, -27, +9, -1$.'
  - titulo: 'Segundo término del desarrollo'
    enunciado: 'En $(2a - 5)^3$, ¿es el segundo término $-3(4a^2)(5) = -60a^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-3 \cdot 4a^2 \cdot 5 = -60a^2$.'
errores_frecuentes:
  - 'Asignar signo negativo al tercer término del tetranomio resultante al expandir la resta.'
  - 'La multiplicación por 3 de los exponentes en las potencias extremas no es realizada.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Elevar al cuadrado el coeficiente en lugar de elevarlo al cubo en el último término.'
  - 'Invertir la secuencia de signos del desarrollo.'
afirmaciones_verdaderas:
  - 'La regla del cubo de binomio diferencia sobre monomios complejos aplica el vector de signatura $(+, -, +, -)$.'
  - 'El tercer término es positivo porque el segundo término negativo del binomio se eleva a la potencia par 2.'
al_terminar_debes_poder: 'Aplicar la regla del cubo de binomio diferencia sobre expresiones con coeficientes y exponentes multivariables.'
