semantic_id: MAT.NUM.RAICES_PROPIEDADES.RADICALES_SEMEJANTES
resumen_inicial: Dos o más radicales son semejantes cuando tienen exactamente el MISMO índice
  y el MISMO radicando, pudiendo diferir únicamente en su coeficiente exterior.
explicacion_simple: 'Los radicales semejantes funcionan igual que los términos semejantes
  en álgebra ($3x$ y $5x$):

  - $3\sqrt{2}$ y $7\sqrt{2}$ son **semejantes** (mismo índice 2, mismo radicando 2).

  - $4\sqrt[3]{5}$ y $-2\sqrt[3]{5}$ son **semejantes**.

  - $3\sqrt{2}$ y $3\sqrt{5}$ **NO son semejantes** (diferente radicando).

  - $2\sqrt{3}$ y $2\sqrt[3]{3}$ **NO son semejantes** (diferente índice).'
explicacion_formal: Dos expresiones de la forma $c_1 \sqrt[n_1]{a_1}$ y $c_2 \sqrt[n_2]{a_2}$
  son radicales semejantes si y solo si $n_1 = n_2$ y $a_1 = a_2$ (tras haber sido simplificados
  a su forma irreducible).
definiciones_clave: '- **Radicales semejantes**: Expresiones con coincidencia total de índice
  y radicando.'
propiedades_relaciones: '- **Condición para adición/sustracción**: Solo se pueden sumar o
  restar directamente radicales que sean semejantes.'
ejemplo_guiado:
  enunciado: Determina si $\sqrt{12}$ y $\sqrt{27}$ son radicales semejantes.
  pasos:
  - A simple vista los radicandos 12 y 27 son distintos. Debemos simplificarlos primero.
  - Simplificar $\sqrt{12} = \sqrt{4 \cdot 3} = 2\sqrt{3}$.
  - Simplificar $\sqrt{27} = \sqrt{9 \cdot 3} = 3\sqrt{3}$.
  - Ambos tienen índice 2 y radicando 3 ($2\sqrt{3}$ y $3\sqrt{3}$).
  - Concluir que SÍ son radicales semejantes.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de los siguientes pares contiene radicales SEMEJANTES?
  choices:
  - text: 5\sqrt{3} y -2\sqrt{3}
    is_correct: true
  - text: 3\sqrt{2} y 3\sqrt{5}
    is_correct: false
  - text: 2\sqrt{7} y 2\sqrt[3]{7}
    is_correct: false
  - text: \sqrt{8} y \sqrt{3}
    is_correct: false
  explanation: 'La correcta es: 5\sqrt{3} y -2\sqrt{3}. Ambos comparten índice 2 y radicando
    3.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Son $\sqrt{8}$ y $\sqrt{18}$ radicales semejantes?
  choices:
  - text: Sí, porque simplificados son 2\sqrt{2} y 3\sqrt{2}
    is_correct: true
  - text: No, porque 8 y 18 son números distintos
    is_correct: false
  - text: No, porque sus índices son diferentes
    is_correct: false
  - text: Sí, porque 8 + 18 = 26
    is_correct: false
  explanation: 'La correcta es: Sí, porque simplificados son 2\sqrt{2} y 3\sqrt{2}. Al simplificar
    comparten el radicando 2.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar cada radical al máximo descomponiendo sus radicandos.'
- 'Paso 2: Comparar los índices de las expresiones resultante.'
- 'Paso 3: Comparar los radicandos simplificados.'
- 'Paso 4: Si ambos coinciden, declarar que son radicales semejantes.'
errores_correccion: No juzgues si son semejantes antes de simplificar. $\sqrt{8}$ y $\sqrt{32}$
  parecen distintos, pero son $2\sqrt{2}$ y $4\sqrt{2}$, luego **sí son semejantes**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Son semejantes $4\sqrt{5}$ y $9\sqrt{5}$?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - Mismo índice (2) y mismo radicando (5).
- titulo: Ejemplo 2
  enunciado: ¿Son semejantes raíz cuadrada de 45 y raíz cuadrada de 20?
  alternativas:
  - Sí, ambos se simplifican con raíz cuadrada de 5
  - No, los radicandos son distintos
  - No, los coeficientes son distintos
  respuesta: Sí, ambos se simplifican con raíz cuadrada de 5
  solucion_pasos:
  - raíz cuadrada de 45 = 3 raíz cuadrada de 5, y raíz cuadrada de 20 = 2 raíz cuadrada de
    5.
- titulo: Ejemplo 3
  enunciado: ¿Son semejantes 5 por raíz cúbica de 2 y 5 por raíz cuadrada de 2?
  alternativas:
  - No, tienen distinto índice
  - Sí, tienen el mismo radicando
  - Sí, tienen el mismo coeficiente
  respuesta: No, tienen distinto índice
  solucion_pasos:
  - Uno tiene índice 3 y el otro índice 2.
- titulo: ¿Son semejantes 4 por raíz cuadrada de 7 y 9 por raíz cuadrada de 7?
  respuesta: Sí
  solucion_pasos:
  - Comparten índice 2 y radicando 7; solo difieren en el coeficiente.
errores_frecuentes:
- Determinar si son semejantes sin simplificar primero los radicales.
- Determinar si dos radicales son semejantes sin simplificarlos primero.
- Considerar semejantes dos radicales que comparten el radicando pero tienen distinto índice.
- Considerar semejantes dos radicales que comparten el índice pero tienen distinto radicando.
- Confundir el coeficiente exterior con el radicando al comparar dos radicales.
afirmaciones_verdaderas:
- Radicales semejantes comparten exactamente el mismo índice y el mismo radicando.
- Dos radicales que no lo parecen a simple vista pueden ser semejantes una vez simplificados
  a su forma mínima.
al_terminar_debes_poder: Identificar radicales semejantes en expresiones algebraicas y numéricas.
fuente: Texto escolar MINEDUC.
estado: publicado
