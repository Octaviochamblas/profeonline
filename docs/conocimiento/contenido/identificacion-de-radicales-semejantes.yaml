resumen_inicial: Dos o más radicales son semejantes si tienen exactamente el mismo
  índice y el mismo radicando, pudiendo diferir únicamente en su coeficiente numérico
  exterior.
explicacion_simple: Los radicales semejantes son los términos que tienen la misma
  raíz gemela (mismo índice y mismo número adentro). Por ejemplo, $3\sqrt{2}$ y $5\sqrt{2}$
  son semejantes porque comparten la raíz $\sqrt{2}$.
explicacion_formal: 'Dos expresiones $c_1 \sqrt[n]{a}$ y $c_2 \sqrt[k]{b}$ son **Radicales
  Semejantes** si y solo si sus componentes radicales coinciden estrictamente:


  $$n = k \quad \wedge \quad a = b$$


  **Ejemplo de semejanza:**

  - $4\sqrt{3}$ y $-7\sqrt{3}$ son semejantes.

  - $4\sqrt{3}$ y $4\sqrt[3]{3}$ NO son semejantes (índices distintos).'
definiciones_clave: '- **Radicales semejantes**: Expresiones radicales con igual índice
  $n$ e igual radicando $a$ que permiten la adición/sustracción.'
propiedades_relaciones: '- **Criterio de coincidencia**: Mismo índice $n$ y mismo
  radicando $a$.'
ejemplo_guiado:
  enunciado: 'Determine cuáles de los siguientes pares son semejantes: (A) $5\sqrt{3}$
    y $-2\sqrt{3}$; (B) $4\sqrt{5}$ y $4\sqrt[3]{5}$.'
  pasos:
  - 'Paso 1: Par (A): ambas expresiones tienen índice $2$ y radicando $3 \implies$
    SÍ son semejantes.'
  - 'Paso 2: Par (B): los radicandos son iguales ($5$), pero los índices difieren
    ($2 \neq 3$) \implies$ NO son semejantes.'
  - 'Conclusión: Solo el par (A) se compone de radicales semejantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué dos componentes deben ser exactamente idénticos en dos expresiones
    para que sean radicales semejantes?
  choices:
  - text: Deben tener exactamente el mismo índice y el mismo radicando
    is_correct: true
  - text: Deben tener el mismo coeficiente exterior
    is_correct: false
  - text: Deben ser ambas raíces de índice par
    is_correct: false
  - text: No requieren ser idénticos
    is_correct: false
  explanation: La alternativa correcta es 'Deben tener exactamente el mismo índice
    y el mismo radicando'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 4 · sqrt(5) y 4 · sqrt[3]{5} NO son semejantes?
  choices:
  - text: Porque sus índices son distintos (2 versus 3)
    is_correct: true
  - text: Porque sus coeficientes son distintos
    is_correct: false
  - text: Because sus radicandos son distintos
    is_correct: false
  - text: Sí son semejantes
    is_correct: false
  explanation: La alternativa correcta es 'Porque sus índices son distintos (2 versus
    3)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar radicales semejantes
  verificando la coincidencia simultánea de índice y radicando.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.RADICALES_SEMEJANTES
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.RADICALES_SEMEJANTES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
