semantic_id: MAT.NUM.RAICES_PROPIEDADES.RADICALES_SEMEJANTES
resumen_inicial: Dos o más radicales son semejantes si y solo si, tras ser completamente simplificados, poseen exactamente el mismo índice radical $n$ y el mismo radicando $c$.
explicacion_simple: '![Identificación de radicales semejantes](/static/img/nodos/identificacion-de-radicales-semejantes-intro.svg)


  En álgebra, los **radicales semejantes** son exactamente como los términos semejantes ($3x$ y $5x$). Para que dos raíces sean semejantes deben cumplir dos condiciones obligatorias:

  1. **Tener el mismo índice** (mismo número en el gancho, por ejemplo ambas cuadradas).

  2. **Tener el mismo radicando una vez simplificadas** (mismo número adentro).

  - Por ejemplo, $\sqrt{8}$ y $\sqrt{18}$ parecen distintas, pero al simplificarlas: $\sqrt{8} = 2\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2}$. **¡Ambas tienen base $\sqrt{2}$, por lo que sí son semejantes y se pueden sumar!**'
explicacion_formal: 'Sean dos términos radicales $T_1 = p \sqrt[n_1]{a_1}$ y $T_2 = q \sqrt[n_2]{a_2}$ con $p, q \in \mathbb{R} \setminus \{0\}$. Se define formalmente que $T_1$ y $T_2$ son **Radicales Semejantes** si y solo si sus formas canónicas irreducibles satisfacen:


  $$n_1 = n_2 = n \quad \land \quad C_1 = C_2 = c$$


  Es decir, existen coeficientes $p'', q'' \in \mathbb{R}$ tales que:

  $$T_1 = p'' \sqrt[n]{c} \quad \text{y} \quad T_2 = q'' \sqrt[n]{c}$$


  **Condición de No Semejanza:**

  - Si $n_1 \neq n_2$: $\sqrt{5}$ y $\sqrt[3]{5}$ **NO** son semejantes.

  - Si $C_1 \neq C_2$: $\sqrt{2}$ y $\sqrt{3}$ **NO** son semejantes (no se pueden combinar en un solo término racional multiplicativo).'
definiciones_clave: '- **Radicales semejantes**: Expresiones que difieren a lo más en sus coeficientes escalares.

  - **Forma canónica base ($\sqrt[n]{c}$)**: Núcleo radical común e irreducible.

  - **Semejanza oculta**: Radicales con apariencias distintas que revelan la misma base tras simplificar.'
propiedades_relaciones: '- **Relación de equivalencia**: La semejanza radical es reflexiva, simétrica y transitiva.

  - **Requisito para reducción**: Solo los términos semejantes admiten reducción por suma/resta.'
ejemplo_guiado:
  enunciado: '![Ejemplos de radicales semejantes](/static/img/nodos/identificacion-de-radicales-semejantes-ejemplos.svg)


    Determine si los siguientes pares son radicales semejantes: $\sqrt{8}$ y $\sqrt{18}$; $\sqrt{12}$ y $\sqrt[3]{12}$; $\sqrt{20}$ y $\sqrt{45}$.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{8}$ y $\sqrt{18}$: $\sqrt{8} = 2\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2}$. Mismo índice $2$ y radicando $2 \implies$ Semejantes.'
  - 'Paso 2: Analizar $\sqrt{12}$ y $\sqrt[3]{12}$: Índices distintos ($2 \neq 3$) $\implies$ NO semejantes.'
  - 'Paso 3: Analizar $\sqrt{20}$ y $\sqrt{45}$: $\sqrt{20} = 2\sqrt{5}$ y $\sqrt{45} = 3\sqrt{5}$. Mismo índice $2$ y radicando $5 \implies$ Semejantes.'
  - 'Conclusión: Los pares 1 y 3 son semejantes; el par 2 no lo es.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de los siguientes pares está formado por radicales semejantes?
  choices:
  - text: $\sqrt{12}$ y $\sqrt{27}$ (porque $2\sqrt{3}$ y $3\sqrt{3}$ comparten la base $\sqrt{3}$)
    is_correct: true
  - text: $\sqrt{2}$ y $\sqrt{3}$
    is_correct: false
  - text: $\sqrt{5}$ y $\sqrt[3]{5}$
    is_correct: false
  - text: $3\sqrt{7}$ y $7\sqrt{3}$
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt{12}$ y $\sqrt{27}$ (porque $2\sqrt{3}$ y $3\sqrt{3}$ comparten la base $\sqrt{3}$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué $\sqrt{12}$ y $\sqrt[3]{12}$ NO son semejantes?
  choices:
  - text: Porque tienen diferente índice radical ($2$ y $3$)
    is_correct: true
  - text: Porque tienen diferente radicando
    is_correct: false
  - text: Porque $12$ es par
    is_correct: false
  - text: Porque ambas son números enteros
    is_correct: false
  explanation: La alternativa correcta es 'Porque tienen diferente índice radical ($2$ y $3$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar al máximo cada uno de los radicales extrayendo todos los factores posibles.'
- 'Paso 2: Comparar los índices de las raíces.'
- 'Paso 3: Si los índices son iguales y los radicandos canónicos son idénticos, los términos son semejantes.'
errores_correccion: '- **Error 1: Juzgar la semejanza sin simplificar previamente ($\sqrt{8}$ y $\sqrt{18}$ creídas no semejantes).** **Cómo corregirlo:** Simplificar siempre: $2\sqrt{2}$ y $3\sqrt{2}$ sí son semejantes.

  - **Error 2: Considerar semejantes raíces con igual radicando pero distinto índice ($\sqrt{5}$ y $\sqrt[3]{5}$).** **Cómo corregirlo:** El índice debe ser estrictamente idéntico.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt{32}$ semejante con $\sqrt{50}$?
  alternativas:
  - Sí, ambos tienen base $\sqrt{2}$ ($4\sqrt{2}$ y $5\sqrt{2}$)
  - No, 32 y 50 son distintos
  - No, sus índices difieren
  respuesta: Sí, ambos tienen base $\sqrt{2}$ ($4\sqrt{2}$ y $5\sqrt{2}$)
  solucion_pasos:
  - $\sqrt{32} = 4\sqrt{2}$ y $\sqrt{50} = 5\sqrt{2} \implies$ Semejantes.
- titulo: Ejemplo 2
  enunciado: ¿Es $\sqrt{75}$ semejante con $\sqrt{48}$?
  alternativas:
  - Sí, ambos tienen base $\sqrt{3}$ ($5\sqrt{3}$ y $4\sqrt{3}$)
  - No, son distintos
  - Solo en números enteros
  respuesta: Sí, ambos tienen base $\sqrt{3}$ ($5\sqrt{3}$ y $4\sqrt{3}$)
  solucion_pasos:
  - $\sqrt{75} = 5\sqrt{3}$ y $\sqrt{48} = 4\sqrt{3} \implies$ Semejantes.
- titulo: ¿Son 5√3 y -2√3 radicales semejantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos tienen índice 2 y radicando 3.
  alternativas:
  - texto: Sí, comparten exactamente la misma parte radical (√3)
    es_correcta: true
    retroalimentacion: ¡Correcto! Solo difieren en su coeficiente numérico.
  - texto: No, porque uno es negativo y el otro positivo
    es_correcta: false
    retroalimentacion: Incorrecto, el signo del coeficiente no altera la semejanza.
  - texto: No, porque 5 y -2 no son iguales
    es_correcta: false
    retroalimentacion: Incorrecto, los coeficientes pueden ser distintos.
- titulo: ¿Son √2 y √3 radicales semejantes?
  respuesta: 'No'
  solucion_pasos:
  - No, tienen radicandos distintos irreducibles (2 y 3).
  alternativas:
  - texto: No, tienen diferente radicando irreducible
    es_correcta: true
    retroalimentacion: ¡Correcto! No se pueden combinar en un solo radical.
  - texto: Sí, porque ambos tienen índice 2
    es_correcta: false
    retroalimentacion: Incorrecto, el radicando también debe ser idéntico.
  - texto: Sí, porque ambos son números primos
    es_correcta: false
    retroalimentacion: Incorrecto, ser primos genera radicandos incompatibles.
errores_frecuentes:
- Intentar sumar raíces no semejantes fusionando radicandos.
- No simplificar los radicales antes de verificar si son semejantes.
- Creer que los coeficientes deben ser iguales para que haya semejanza.
- Confundir raíces de distinto índice con radicales semejantes.
- Tratar a $\sqrt{x}$ y $\sqrt{x^2}$ como semejantes sin simplificar.
afirmaciones_verdaderas:
- Dos radicales son semejantes si tienen el mismo índice y el mismo radicando en su forma más simple.
- La simplificación previa es indispensable para descubrir la semejanza oculta entre radicales.
- Solo los términos con radicales semejantes pueden sumarse o restarse directamente.
al_terminar_debes_poder: '![Síntesis de radicales semejantes](/static/img/nodos/identificacion-de-radicales-semejantes-resumen.svg)


  QUÉ: Identificar y verificar radicales semejantes en expresiones numéricas y algebraicas.


  CÓMO: Simplificando cada radical a su forma canónica irreducible $K\sqrt[n]{c}$ y comprobando la igualdad simultánea del índice $n$ y el radicando base $c$.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
