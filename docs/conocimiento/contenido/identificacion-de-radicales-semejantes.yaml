semantic_id: MAT.NUM.RAICES_PROPIEDADES.RADICALES_SEMEJANTES
resumen_inicial: 'Dos o más radicales son semejantes si comparten exactamente el mismo índice y el mismo radicando, pudiendo diferir únicamente en su coeficiente exterior.'
explicacion_simple: |
  En matemáticas, los radicales semejantes son como "manzanas con manzanas": tienen exactamente la misma raíz con el mismo número adentro. Lo único que puede cambiar es el número que va multiplicando por fuera (el coeficiente). Por ejemplo, $3\sqrt{5}$ y $7\sqrt{5}$ son radicales semejantes porque ambos tienen la raíz $\sqrt{5}$. Sin embargo, $3\sqrt{5}$ y $3\sqrt{2}$ NO son semejantes porque los números de adentro son distintos.
explicacion_formal: |
  ### Definición formal
  Dos expresiones radicales $R_1 = a \cdot \sqrt[n]{x}$ y $R_2 = b \cdot \sqrt[m]{y}$ son **radicales semejantes** si y sólo si cumplen simultáneamente las dos condiciones de identidad de estructura:
  1. **Igualdad de índices**: $n = m$.
  2. **Igualdad de radicandos**: $x = y$.

  ### Identificación tras simplificación previa
  Dos radicales que parecen no semejantes en su estado original pueden ser semejantes tras descomponer sus radicandos a su forma irreducible:
  $$R_1 = \sqrt{12} = 2\sqrt{3} \quad \text{y} \quad R_2 = \sqrt{27} = 3\sqrt{3}$$
  Como ambos simplifican a la raíz común $\sqrt{3}$, las expresiones $\sqrt{12}$ y $\sqrt{27}$ son **radicales semejantes**.

  ### Síntesis didáctica
  - Criterio 1: Coincidencia del índice $n$.
  - Criterio 2: Coincidencia del radicando $x$ (o su forma simplificada común).
  - Coeficientes $a, b$: Pueden ser cualesquiera números reales distintos.
definiciones_clave: |
  - **Radicales semejantes**: Términos con raíz que poseen idéntico índice e idéntico radicando.
  - **Coeficiente exterior**: Número real que multiplica por fuera al radical y no afecta la semejanza.
  - **Forma irreducible común**: Estado de simplificación máxima donde se revela la verdadera semejanza entre radicales.
propiedades_relaciones: |
  - **Condición necesaria para sumar/restar**: Únicamente los radicales semejantes pueden sumarse o restarse algebraicamente combinando sus coeficientes.
  - **Analogía con términos semejantes algebraicos**: El radical $\sqrt[n]{x}$ actúa exactamente como una variable $u$ en álgebra ($3u + 7u = 10u \implies 3\sqrt{5} + 7\sqrt{5} = 10\sqrt{5}$).
ejemplo_guiado:
  enunciado: 'Determina si las expresiones radicales $R_1 = 5\sqrt{18}$ y $R_2 = 2\sqrt{50}$ son semejantes simplificando previamente sus radicandos.'
  pasos:
    - 'Paso 1: Simplificamos $R_1 = 5\sqrt{18}$: descomponemos $18 = 9 \cdot 2 \implies 5 \cdot \sqrt{9} \cdot \sqrt{2} = 5 \cdot 3 \cdot \sqrt{2} = 15\sqrt{2}$.'
    - 'Paso 2: Simplificamos $R_2 = 2\sqrt{50}$: descomponemos $50 = 25 \cdot 2 \implies 2 \cdot \sqrt{25} \cdot \sqrt{2} = 2 \cdot 5 \cdot \sqrt{2} = 10\sqrt{2}$.'
    - 'Paso 3: Comparamos las expresiones simplificadas: ambas contienen el radical común $\sqrt{2}$ con índice 2.'
    - 'Paso 4: Conclusión: $R_1$ y $R_2$ son **radicales semejantes**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condiciones obligatorias deben cumplirse simultáneamente para que dos radicales sean clasificados como semejantes?'
    choices:
      - {text: 'Deben tener exactamente el mismo índice y el mismo radicando (o la misma raíz en su forma irreducible)', is_correct: true}
      - {text: 'Deben tener el mismo coeficiente exterior y distinto índice', is_correct: false}
      - {text: 'Deben tener el mismo radicando pero diferentes índices', is_correct: false}
      - {text: 'Deben dar el mismo resultado al elevarse al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''Deben tener exactamente el mismo índice y el mismo radicando (o la misma raíz en su forma irreducible)''. La semejanza exige coincidencia total de índice y radicando.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué las expresiones $\sqrt{8}$ y $\sqrt{18}$ son consideradas radicales semejantes?'
    choices:
      - {text: 'Porque al simplificarlas se obtienen $2\sqrt{2}$ y $3\sqrt{2}$, compartiendo la raíz común $\sqrt{2}$', is_correct: true}
      - {text: 'Porque ambos radicandos son números pares', is_correct: false}
      - {text: 'Porque la suma de sus radicandos da 26', is_correct: false}
      - {text: 'Porque ambas tienen coeficiente igual a 1', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al simplificarlas se obtienen $2\sqrt{2}$ y $3\sqrt{2}$, compartiendo la raíz común $\sqrt{2}$''. Tras descomponer $8 = 4 \cdot 2$ y $18 = 9 \cdot 2$, ambas muestran el radical común $\sqrt{2}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Simplificar cada uno de los radicales a su forma canónica irreducible mediante descomposición.'
  - 'Paso 2: Verificar que el índice de todas las raíces comparadas sea idéntico.'
  - 'Paso 3: Verificar que el número o expresión dentro del radical (radicando) sea idéntico.'
  - 'Paso 4: Concluir si son semejantes (permitiendo adición/sustracción) o no semejantes.'
errores_correccion: |
  - **Error 1:** Afirmar que dos radicales no son semejantes observando sólo su estado inicial sin simplificar (ej: decir que $\sqrt{12}$ y $\sqrt{27}$ no son semejantes). **Cómo corregirlo:** Siempre debes **simplificar previamente** los radicandos: $\sqrt{12} = 2\sqrt{3}$ y $\sqrt{27} = 3\sqrt{3}$, revelando que sí son semejantes.
  - **Error 2:** Confundir la coincidencia de coeficientes con la semejanza de radicales (ej: considerar que $3\sqrt{2}$ y $3\sqrt{5}$ son semejantes porque ambos tienen un 3 afuera). **Cómo corregirlo:** La semejanza depende exclusivamente del **índice y del radicando interior**; los coeficientes exteriores no determinan la semejanza.
ejemplos:
  - titulo: 'Semejanza directa de raíces'
    enunciado: '¿Las expresiones $4\sqrt{7}$ y $-9\sqrt{7}$ son radicales semejantes?'
    alternativas:
      - 'Sí, pues ambas tienen índice 2 y radicando 7'
      - 'No, porque una es negativa'
      - 'No, porque tienen distintos coeficientes'
    respuesta: 'Sí, pues ambas tienen índice 2 y radicando 7'
    solucion_pasos:
      - '1. Verificamos índice: ambos son 2.'
      - '2. Verificamos radicando: ambos son 7.'
      - '3. Son radicales semejantes.'
  - titulo: 'Diferencia de índices'
    enunciado: '¿La raíz cuadrada $\sqrt{5}$ y la raíz cúbica $\sqrt[3]{5}$ son radicales semejantes?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Sus índices son diferentes (2 versus 3), por lo que no son semejantes.'
  - titulo: 'Semejanza oculta tras descomposición'
    enunciado: '¿Son semejantes $\sqrt{20}$ y $\sqrt{45}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{20} = 2\sqrt{5}$ y $\sqrt{45} = 3\sqrt{5}$. Ambos comparten $\sqrt{5}$.'
  - titulo: 'Requisito para operar'
    enunciado: '¿Es la semejanza de radicales un requisito obligatorio para sumar o restar raíces directamente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Sólo se pueden sumar o restar coeficientes de radicales que sean semejantes.'
errores_frecuentes:
  - 'Considerar que dos radicales son semejantes si tienen el mismo coeficiente exterior independientemente del radicando.'
  - 'Afirmar que $\sqrt{8}$ y $\sqrt{18}$ no son semejantes sin intentar simplificar previamente sus radicandos.'
  - 'Clasificar $\sqrt{5}$ y $\sqrt[3]{5}$ como semejantes por tener el mismo número dentro del radical.'
  - 'El signo negativo en el coeficiente exterior de un radical modifica el valor del índice o radicando destruyendo la semejanza.'
  - 'Sumar los radicandos de dos raíces no semejantes directamente.'
afirmaciones_verdaderas:
  - 'Dos o más radicales son semejantes si y sólo si poseen exactamente el mismo índice y el mismo radicando en su forma simplificada irreducible.'
  - 'La semejanza de radicales permite tratar a la raíz como un bloque algebraico común $(a+b)\sqrt[n]{x}$ en operaciones de adición y sustracción.'
al_terminar_debes_poder: 'Identificar y verificar si dos o más expresiones radicales son semejantes simplificando previamente sus radicandos.'
