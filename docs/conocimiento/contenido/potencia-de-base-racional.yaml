semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_RACIONAL
resumen_inicial: Una potencia de base racional $\left(\frac{a}{b}\right)^n$ distribuye el exponente de manera independiente sobre el numerador y el denominador.
explicacion_simple: '![Potencia de base racional](/static/img/nodos/potencia-de-base-racional-intro.svg)


  Elevar una fracción a una potencia es muy sencillo: el exponente eleva tanto al número de arriba (numerador) como al número de abajo (denominador). Por ejemplo, $(2/3)^3 = 2^3 / 3^3 = 8/27$. Es indispensable usar paréntesis para indicar que TODA la fracción se está elevando. Si no usamos paréntesis, como en $2^3 / 3$, solo estaríamos elevando el $2$, dando $8/3$.'
explicacion_formal: "Sea $\\frac{a}{b} \\in \\mathbb{Q}$ un número racional con $b \\neq 0$ y sea $n \\in \\mathbb{Z}$. La **Potencia de Base Racional** se rige por la ley distributiva de la potenciación respecto a la división:\n\n$$\\left(\\frac{a}{b}\\right)^n = \\frac{a^n}{b^n}$$\n\n**Propiedades formales:**\n1. **Multiplicación reiterada en $\\mathbb{Q}$:**\n   $$\\left(\\frac{a}{b}\\right)^n = \\underbrace{\\frac{a}{b} \\cdot \\frac{a}{b} \\cdot \\dots \\cdot \\frac{a}{b}}_{n \\text{ factores}} = \\frac{a \\cdot a \\dots a}{b \\cdot b \\dots b} = \\frac{a^n}{b^n}$$\n2. **Bases decimales:** Todo decimal finito o periódico se transforma a su fracción irreductible antes de elevar:\n   $$(0,2)^3 = \\left(\\frac{1}{5}\\right)^3 = \\frac{1^3}{5^3} = \\frac{1}{125} = 0,008$$\n3. **Paridad de signos en fracciones:**\n   - $\\left(-\\frac{a}{b}\\right)^{\\text{par}} = +\\frac{a^n}{b^n}$\n   - $\\left(-\\frac{a}{b}\\right)^{\\text{impar}} = -\\frac{a^n}{b^n}$"
definiciones_clave: '- **Base racional**: Fracción $\frac{a}{b}$ o número decimal que actúa como factor en la potencia.

  - **Distribución de exponente**: Aplicación independiente de $n$ en numerador y denominador ($a^n / b^n$).'
propiedades_relaciones: '- **Crecimiento en fracciones propias ($0 < a/b < 1$):** Al aumentar $n$, el valor de la potencia DISMINUYE (ej: $(1/2)^1 = 0,5 > (1/2)^2 = 0,25 > (1/2)^3 = 0,125$).

  - **Paréntesis obligatorio**: $(\frac{a}{b})^n \neq \frac{a^n}{b}$ y $\neq \frac{a}{b^n}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencia de base racional](/static/img/nodos/potencia-de-base-racional-ejemplos.svg)


    Calcule el valor exacto de $\left(\frac{3}{4}\right)^2$, $\left(-\frac{1}{2}\right)^3$ y $(0,5)^3$.'
  pasos:
  - 'Paso 1: Evaluar $\left(\frac{3}{4}\right)^2$: Distribuir el exponente $2$: $\frac{3^2}{4^2} = \frac{9}{16}$.'
  - 'Paso 2: Evaluar $\left(-\frac{1}{2}\right)^3$: Base negativa y exponente impar $3$: $-\frac{1^3}{2^3} = -\frac{1}{8}$.'
  - 'Paso 3: Evaluar $(0,5)^3$: Convertir a fracción $0,5 = \frac{1}{2}$. Luego elevar: $\left(\frac{1}{2}\right)^3 = \frac{1^3}{2^3} = \frac{1}{8} = 0,125$.'
  - 'Conclusión: $\left(\frac{3}{4}\right)^2 = \frac{9}{16}$, $\left(-\frac{1}{2}\right)^3 = -\frac{1}{8}$ y $(0,5)^3 = \frac{1}{8}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\left(\frac{2}{5}\right)^3$?
  choices:
  - text: $\frac{8}{125}$ (elevando $2^3$ y $5^3$)
    is_correct: true
  - text: $\frac{6}{15}$
    is_correct: false
  - text: $\frac{8}{5}$
    is_correct: false
  - text: $\frac{2}{125}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{8}{125}$ (elevando $2^3$ y $5^3$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la mejor estrategia para calcular $(0,5)^3$?
  choices:
  - text: Transformar el decimal a la fracción $\frac{1}{2}$ y calcular $\left(\frac{1}{2}\right)^3 = \frac{1}{8}$
    is_correct: true
  - text: Multiplicar $0,5$ por $3$
    is_correct: false
  - text: Sumar $0,5$ tres veces
    is_correct: false
  - text: Elevar solo el $5$ al cubo
    is_correct: false
  explanation: La alternativa correcta es 'Transformar el decimal a la fracción $\frac{1}{2}$ y calcular $\left(\frac{1}{2}\right)^3 = \frac{1}{8}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si la base es un número decimal, convertirlo a su fracción irreductible correspondiente.'
- 'Paso 2: Simplificar la fracción al máximo antes de elevar.'
- 'Paso 3: Aplicar el exponente de forma independiente al numerador y al denominador: $\frac{a^n}{b^n}$, aplicando la regla de signos de paridad.'
errores_correccion: '- **Error 1: Elevar solo el numerador (pensar que $(2/3)^2 = 4/3$).** **Cómo corregirlo:** El paréntesis exige elevar AMBOS términos: $\frac{2^2}{3^2} = \frac{4}{9}$.

  - **Error 2: Multiplicar numerador y denominador por el exponente ($(2/5)^3 = 6/15$).** **Cómo corregirlo:** Es una potencia, se eleva al cubo ($2^3 / 5^3 = 8/125$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $\left(\frac{2}{3}\right)^4$?
  alternativas:
  - $\frac{16}{81}$
  - $\frac{8}{12}$
  - $\frac{16}{3}$
  respuesta: $\frac{16}{81}$
  solucion_pasos:
  - $\frac{2^4}{3^4} = \frac{16}{81}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $(0,2)^2$ en fracción?
  alternativas:
  - $\frac{1}{25}$
  - $\frac{1}{5}$
  - $\frac{4}{10}$
  respuesta: $\frac{1}{25}$
  solucion_pasos:
  - $0,2 = \frac{1}{5} \implies \left(\frac{1}{5}\right)^2 = \frac{1}{25}$.
- titulo: ¿Es (1/3)³ menor que (1/3)²?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(1/3)^3 = 1/27 < 1/9 = (1/3)^2$, las fracciones propias disminuyen al aumentar el exponente.
  alternativas:
  - texto: Sí, las fracciones entre 0 y 1 disminuyen al aumentar el exponente
    es_correcta: true
    retroalimentacion: ¡Correcto! $1/27 < 1/9$.
  - texto: No, mayor exponente siempre da un número mayor
    es_correcta: false
    retroalimentacion: Incorrecto, eso solo ocurre para bases mayores a 1.
  - texto: Son iguales
    es_correcta: false
    retroalimentacion: Incorrecto, $1/27 \neq 1/9$.
- titulo: ¿Es (-2/3)⁴ un número positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, 4 es un número par, por lo que $(-2/3)^4 = +16/81$.
  alternativas:
  - texto: Sí, porque el exponente 4 es par
    es_correcta: true
    retroalimentacion: ¡Correcto! Toda fracción negativa con exponente par resulta positiva.
  - texto: No, es negativo por tener signo menos
    es_correcta: false
    retroalimentacion: Incorrecto, la potencia par anula el signo negativo.
  - texto: No, es igual a -8/12
    es_correcta: false
    retroalimentacion: Incorrecto, es una potencia positiva.
errores_frecuentes:
- Elevar solo el numerador olvidando elevar el denominador.
- Multiplicar la fracción por el exponente en lugar de potenciar.
- Calcular potencias de decimales mediante multiplicaciones largas con errores de comas.
- Creer que $(1/2)^4$ es mayor que $(1/2)^2$.
- Omitir simplificar la fracción antes de elevarla.
afirmaciones_verdaderas:
- Para toda fracción $\frac{a}{b}$ con $b \neq 0$, $(\frac{a}{b})^n = \frac{a^n}{b^n}$.
- Las potencias de fracciones positivas menores a 1 disminuyen su valor a medida que el exponente natural aumenta.
- Transformar números decimales a fracciones irreductibles optimiza el cálculo de potencias.
al_terminar_debes_poder: '![Síntesis de potencia de base racional](/static/img/nodos/potencia-de-base-racional-resumen.svg)


  QUÉ: Calcular y simplificar potencias de base racional fraccionaria y decimal.


  CÓMO: Distribuyendo el exponente sobre el numerador y denominador $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$, convirtiendo decimales a fracciones irreductibles previas, y aplicando las reglas de paridad de signos.'
