semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_RACIONAL
resumen_inicial: Para elevar una fracción $\left(\frac{a}{b}\right)^n$ a una potencia, se
  elevan de forma independiente el numerador y el denominador a dicho exponente.
explicacion_simple: 'Cuando elevas una fracción a una potencia, los paréntesis abarcan tanto
  a la parte de arriba como a la de abajo:

  $$\left(\frac{2}{3}\right)^3 = \frac{2^3}{3^3} = \frac{8}{27}$$

  Si no colocas paréntesis, por ejemplo $\frac{2^3}{3}$, el exponente solo afecta al numerador
  (dando $\frac{8}{3}$).'
explicacion_formal: 'Sean $a, b \in \mathbb{Z}$ con $b \neq 0$, y $n \in \mathbb{N}$. Por
  la propiedad distributiva de la potenciación respecto a la división en $\mathbb{Q}$, se
  define:

  $$\left(\frac{a}{b}\right)^n = \underbrace{\frac{a}{b} \cdot \frac{a}{b} \cdots \frac{a}{b}}_{n
  \text{ factores}} = \frac{a^n}{b^n}$$'
definiciones_clave: '- **Distribución del exponente en fracciones**: $\left(\frac{a}{b}\right)^n
  = \frac{a^n}{b^n}$.'
propiedades_relaciones: '- **Importancia de los paréntesis**: $\left(\frac{a}{b}\right)^n
  \neq \frac{a^n}{b}$ y $\left(\frac{a}{b}\right)^n \neq \frac{a}{b^n}$.'
ejemplo_guiado:
  enunciado: Calcula $\left(\frac{3}{5}\right)^2$ y simplifica si corresponde.
  pasos:
  - 'Aplicar el exponente 2 al numerador y al denominador: $\frac{3^2}{5^2}$.'
  - Calcular $3^2 = 9$ y $5^2 = 25$.
  - Obtener la fracción final $\frac{9}{25}$ (irreductible).
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\left(\frac{4}{3}\right)^3$?
  choices:
  - text: 64/27
    is_correct: true
  - text: 12/9
    is_correct: false
  - text: 64/3
    is_correct: false
  - text: 4/27
    is_correct: false
  explanation: 'La correcta es: 64/27. Elevando numerador y denominador: $\frac{4^3}{3^3}
    = \frac{64}{27}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $\left(-\frac{1}{2}\right)^4$?
  choices:
  - text: 1/16
    is_correct: true
  - text: -1/16
    is_correct: false
  - text: -1/8
    is_correct: false
  - text: 1/8
    is_correct: false
  explanation: 'La correcta es: 1/16. Base negativa con exponente par (4) da signo positivo:
    $\frac{(-1)^4}{2^4} = \frac{1}{16}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los paréntesis encierren a toda la fracción.'
- 'Paso 2: Elevar el numerador al exponente dado.'
- 'Paso 3: Elevar el denominador al mismo exponente.'
- 'Paso 4: Simplificar la fracción resultante a su forma irreductible.'
errores_correccion: No olvides elevar el denominador. Escribir $\left(\frac{2}{5}\right)^3
  = \frac{8}{5}$ es incorrecto; debes hacer $\frac{2^3}{5^3} = \frac{8}{125}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\left(\frac{1}{4}\right)^2$.
  alternativas:
  - 1/16
  - 1/8
  - 2/4
  respuesta: 1/16
  solucion_pasos:
  - $\frac{1^2}{4^2} = \frac{1}{16}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de (2/3)^3?
  alternativas:
  - 8/27
  - 6/9
  - 2/9
  respuesta: 8/27
  solucion_pasos:
  - 2^3 = 8 y 3^3 = 27.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (-3/4)^2?
  alternativas:
  - 9/16
  - -9/16
  - -6/8
  respuesta: 9/16
  solucion_pasos:
  - 'Exponente par: (-3)^2 = 9 y 4^2 = 16.'
- titulo: ¿Es (5/2)^2 igual a 25/4?
  respuesta: Sí
  solucion_pasos:
  - 5^2 = 25 y 2^2 = 4.
errores_frecuentes:
- Elevar solo el numerador y dejar el denominador igual.
- Elevar solo el numerador de la fracción y dejar el denominador sin modificar.
- Elevar solo el denominador de la fracción y dejar el numerador sin modificar.
- Olvidar aplicar la regla de signos cuando la fracción tiene base negativa.
- No simplificar la fracción resultante a su forma irreductible.
afirmaciones_verdaderas:
- $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$ para $b \neq 0$.
- Para elevar una fracción a una potencia, tanto el numerador como el denominador deben elevarse
  al mismo exponente.
al_terminar_debes_poder: Calcular potencias de base racional distribuyendo el exponente correctamente.
fuente: Texto escolar MINEDUC.
estado: publicado
