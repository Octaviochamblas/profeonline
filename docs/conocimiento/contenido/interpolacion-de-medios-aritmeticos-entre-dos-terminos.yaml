semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_ARITMETICA
resumen_inicial: 'Interpolación de medios aritméticos entre dos términos: concepto y desarrollo
  dentro de Comparación y modelamiento con progresiones.'
explicacion_simple: Alguien borró los números del medio en una lista. Tienes el primero y
  el último, y sabes que era una progresión aritmética. Tu misión es construir el puente de
  escalones perfectos entre esos dos extremos. A esto le llamamos 'Interpolar'.
explicacion_formal: 'Visualiza el problema:

  Te dan el número 5 y el número 17. Te piden **interpolar 3 números** en el medio para que
  formen una P.A.

  - La lista se vería así: $5, \_ , \_ , \_ , 17$.

  - Cuentas los saltos: Para pasar del 5 al 17 a través de 3 espacios vacíos, debes dar **4
  saltos** (siempre es $k+1$ saltos, donde ''$k$'' es la cantidad de huecos).


  Cálculo de la diferencia ''d'':

  1. Distancia total = $17 - 5 = 12$.

  2. Cantidad de saltos = $3 + 1 = 4$.

  3. Tamaño de cada salto ($d$) = Distancia Total / Saltos = $12 / 4 = 3$.


  Llenamos los huecos sumando de a 3:

  - $5 + 3 = 8$

  - $8 + 3 = 11$

  - $11 + 3 = 14$

  - ¡Y comprobamos! $14 + 3 = 17$. El puente encaja perfectamente. Los ''medios aritméticos''
  son $8, 11$ y $14$.'
definiciones_clave: '- **Interpolación de medios aritméticos entre dos términos**: Concepto
  fundamental dentro del estudio de Comparación y modelamiento con progresiones.'
propiedades_relaciones: '- **Propiedades de Interpolación de medios aritméticos entre dos
  términos**: Relaciones de cambio y fórmulas estructurales de comparación y modelamiento
  con progresiones.'
ejemplo_guiado:
  enunciado: Interpola 2 medios aritméticos entre 5 y 26.
  pasos:
  - 'Calculo la distancia total: 26 menos 5 es igual a 21.'
  - 'Cuento los saltos: como hay 2 huecos, hay 3 saltos, es decir 2 más 1.'
  - 'Calculo la diferencia: 21 dividido entre 3 es igual a 7. Sumando 7 desde 5 obtengo 5,
    12, 19, 26; los medios aritméticos son 12 y 19.'
