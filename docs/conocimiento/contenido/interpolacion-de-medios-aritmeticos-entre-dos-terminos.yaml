procedimiento:
- 'Paso 1: Resta el extremo final menos el extremo inicial ($B - A$).'
- 'Paso 2: A la cantidad de números a interpolar ($k$), súmale 1 ($k + 1$).'
- 'Paso 3: Divide el resultado del Paso 1 entre el resultado del Paso 2. Esta es tu diferencia
  ''d''.'
- 'Paso 4: Suma ''d'' repetidamente partiendo desde ''A''.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en interpolación de medios aritméticos entre dos términos.
ejemplos:
- titulo: Construyendo la escalera
  enunciado: Interpolar 4 medios aritméticos entre 10 y 40.
  solucion_pasos:
  - A = 10, B = 40. k = 4.
  - Distancia total = 40 - 10 = 30.
  - Número de saltos = 4 + 1 = 5.
  - d = 30 / 5 = 6.
  - 'Interpolar: 10 (+6)-> 16 (+6)-> 22 (+6)-> 28 (+6)-> 34 (+6)-> 40.'
  - 'Los medios son: 16, 22, 28, 34.'
- titulo: Ejemplo 1
  enunciado: Interpola 1 medio aritmético entre 10 y 30. ¿Cuál es?
  alternativas:
  - '20'
  - '15'
  - '25'
  respuesta: '20'
  solucion_pasos:
  - (30 menos 10) dividido entre (1 más 1) es igual a 10; 10 más 10 es igual a 20.
- titulo: Ejemplo 2
  enunciado: Interpola 3 medios aritméticos entre 2 y 22. ¿Cuál es la diferencia d?
  alternativas:
  - '5'
  - '4'
  - '6'
  respuesta: '5'
  solucion_pasos:
  - (22 menos 2) dividido entre (3 más 1) es igual a 20 dividido entre 4, o sea 5.
- titulo: ¿La cantidad de saltos al interpolar 4 medios aritméticos es igual a 5?
  respuesta: Sí
  solucion_pasos:
  - Siempre es la cantidad de medios más 1.
- titulo: ¿Se puede interpolar un número no entero de medios aritméticos?
  respuesta: 'No'
  solucion_pasos:
  - La cantidad de medios a interpolar siempre es un número entero, indicado en el enunciado.
errores_frecuentes:
- Dividir la distancia total simplemente por '$k$' (la cantidad de huecos) en lugar de '$k+1$'
  (los saltos). ¡Si hay 3 huecos, hay 4 espacios/saltos que los conectan!
- Confundirse y restar al revés ($A - B$) obteniendo una diferencia con el signo cambiado.
- Dividir la distancia total por k, la cantidad de huecos, en vez de por k más 1, la cantidad
  de saltos.
- Restar los extremos en el orden equivocado, obteniendo una diferencia con el signo cambiado.
- Olvidar comprobar que sumar la diferencia calculada al último medio efectivamente da el
  extremo final.
afirmaciones_verdaderas:
- La formulación de interpolación de medios aritméticos entre dos términos mantiene la regularidad
  de la sucesión.
- Al interpolar k medios aritméticos entre dos números, la cantidad de saltos siempre es k
  más 1, nunca k.
