resumen_inicial: La interpolación de $m$ medios aritméticos entre dos extremos $A$
  y $B$ calcula los términos intermedios de una P.A. con diferencia $d = \frac{B -
  A}{m + 1}$.
explicacion_simple: Interpolar medios aritméticos significa colocar números intermedios
  entre dos valores dados de modo que toda la lista forme una progresión aritmética
  perfecta. Para hallar el salto $d$, dividimos la distancia total entre los extremos
  por la cantidad de huecos $(m + 1)$.
explicacion_formal: 'Para insertar $m$ medios aritméticos $\{x_1, x_2, \dots, x_m\}$
  entre los extremos $A$ y $B$, el número total de términos es $N = m + 2$. La **Diferencia
  de Interpolación Aritmética $d$** es:


  $$B = A + (m + 1) \cdot d \implies d = \frac{B - A}{m + 1}$$


  **Construcción de los términos intermedios:**

  $$x_1 = A + d, \quad x_2 = A + 2d, \quad \dots, \quad x_m = A + m \cdot d$$'
definiciones_clave: '- **Interpolación aritmética**: Inserción de $m$ números entre
  $A$ y $B$ usando $d = \frac{B - A}{m + 1}$.'
propiedades_relaciones: '- **Número de intervalos**: $m$ medios aritméticos dividen
  la distancia $B-A$ en $m+1$ intervalos iguales.'
ejemplo_guiado:
  enunciado: Interpole $3$ medios aritméticos entre los extremos $A = 5$ y $B = 21$.
  pasos:
  - 'Paso 1: Identificar $m = 3$ medios $\implies m + 1 = 4$ intervalos.'
  - 'Paso 2: Calcular la diferencia de interpolación: $d = \frac{21 - 5}{3 + 1} =
    \frac{16}{4} = 4$.'
  - 'Paso 3: Construir los $3$ medios sumando $d=4$: $x_1 = 5+4=9$, $x_2 = 9+4=13$,
    $x_3 = 13+4=17$.'
  - 'Conclusión: Los medios aritméticos interpolados son $(9, 13, 17)$ (sucesión completa:
    $5, 9, 13, 17, 21$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la diferencia d al interpolar m medios
    aritméticos entre A y B?
  choices:
  - text: d = (B - A) / (m + 1)
    is_correct: true
  - text: d = (B - A) / m
    is_correct: false
  - text: d = (B + A) / 2
    is_correct: false
  - text: d = B · A
    is_correct: false
  explanation: La alternativa correcta es 'd = (B - A) / (m + 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para interpolar 3 medios entre 5 y 21, ¿cuáles fueron
    los medios obtenidos?
  choices:
  - text: (9, 13, 17)
    is_correct: true
  - text: (8, 12, 16)
    is_correct: false
  - text: (10, 15, 20)
    is_correct: false
  - text: (6, 11, 16)
    is_correct: false
  explanation: La alternativa correcta es '(9, 13, 17)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de interpolar $m$ medios aritméticos
  entre dos extremos calculando la diferencia $d = \frac{B - A}{m + 1}$.
semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_ARITMETICA
procedimiento:
- 'Paso 1: Analizar la dinámica de cambio de la sucesión (aditiva vs multiplicativa).'
- 'Paso 2: Formular las ecuaciones de P.A. ($a_n = a_1 + (n-1)d$) o P.G. ($b_n = b_1
  \cdot r^{n-1}$) según corresponda.'
- 'Paso 3: Resolver numéricamente los parámetros despejados o interpolados y verificar
  la consistencia.'
errores_correccion: '- **Error 1: Dividir entre $m$ en lugar de $(m+1)$ al calcular
  la diferencia o razón de interpolación.** **Cómo corregirlo:** Para insertar $m$
  medios intermedios, la distancia se divide en $(m+1)$ intervalos.


  - **Error 2: Usar un modelo aritmético para un problema con crecimiento de tasa
  porcentual constante.** **Cómo corregirlo:** Las tasas de variación porcentual constante
  DEBEN modelarse obligatoriamente con progresiones geométricas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_ARITMETICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del modelo de progresiones.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia o razón de interpolación.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por interpolación.
- titulo: ¿Dividen m medios de interpolación el intervalo en m + 1 partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $m$ términos intermedios generan $m+1$ saltos.
- titulo: ¿Supera el modelo geométrico al aritmético en el largo plazo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la dominancia del crecimiento exponencial sobre el lineal.
errores_frecuentes:
- Dividir el intervalo entre m en lugar de (m + 1) al calcular la diferencia de interpolación
  de m medios.
- Modelar un incremento porcentual constante utilizando una progresión aritmética
  de suma fija.
- Declarar la razón multiplicativa r con la diferencia aditiva d al formular el término
  general.
- Declarar que la interpolación de medios geométricos exige que los extremos tengan
  signos opuestos.
- Restar los extremos en lugar de dividirlos al calcular la razón de interpolación
  geométrica.
afirmaciones_verdaderas:
- La progresión aritmética modela cambios aditivos constantes y la geométrica modela
  cambios multiplicativos constantes.
- Para interpolar $m$ medios entre $A$ y $B$, se divide el intervalo entre $(m+1)$
  saltos.
