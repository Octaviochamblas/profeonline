semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MAYOR_QUE_POSITIVO
resumen_inicial: 'Una inecuación del tipo $|X| > k$ con $k > 0$ equivale a la unión
  de dos ramas separadas: $X < -k$ o $X > k$.'
explicacion_simple: 'Si tenemos una inecuación como $|x| > 5$ con $k = 5$:

  Significa que la distancia de $x$ al cero debe ser **mayor que 5 unidades**.

  Eso empuja a la $x$ hacia los extremos alejados de la recta numérica:

  - O bien la $x$ está muy a la izquierda ($x < -5$).

  - O bien la $x$ está muy a la derecha ($x > 5$).

  Por lo tanto, la solución es la **unión de dos intervalos separados**: $]-\infty,
  -5[ \ \cup \ ]5, +\infty[$.'
explicacion_formal: 'Para toda expresión $X$ y constante $k > 0$:


  $$|X| > k \iff (X < -k) \quad \lor \quad (X > k)$$


  **Desglose de la fórmula:**

  - Conector lógico $\lor$ (disyunción inclusiva / unión de conjuntos $\cup$).

  - Conjunto solución en formato de unión de intervalos: $S = ]-\infty, -k[ \ \cup
  \ ]k, +\infty[$.'
definiciones_clave: '- **Propiedad de separación $|X| > k$**: Regla que convierte
  una inecuación de valor absoluto ''mayor que'' en la unión de dos ramas disjuntas.'
propiedades_relaciones: '- **Disyunción y unión**: Produce dos intervalos no acotados
  separados a la izquierda y derecha de la recta real.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación con valor absoluto $|3x + 1| > 10$ aplicando la
    propiedad de separación.
  pasos:
  - 'Paso 1: Aplicar la propiedad $|X| > k \iff (X < -k) \lor (X > k)$: $(3x + 1 <
    -10) \lor (3x + 1 > 10)$.Paso 2: Resolver la primera rama: $3x < -10 - 1 \implies
    3x < -11 \implies x < -\frac{11}{3}$.Paso 3: Resolver la segunda rama: $3x > 10
    - 1 \implies 3x > 9 \implies x > 3$.Paso 4: Unir las dos soluciones en la respuesta
    final: $S = ]-\infty, -\frac{11}{3}[ \ \cup \ ]3, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué expresión lógica se descompone la inecuación de valor absoluto
    $|X| > k$ con $k > 0$?
  choices:
  - text: $(X < -k) \lor (X > k)$ (unión de dos ramas)
    is_correct: true
  - text: $-k < X < k$ (un solo intervalo)
    is_correct: false
  - text: $X > k$ únicamente
    is_correct: false
  - text: $X = k$
    is_correct: false
  explanation: La alternativa correcta es '$(X < -k) \lor (X > k)$ (unión de dos ramas)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $|3x + 1| > 10$, ¿cuál es el conjunto solución $S$ expresado
    como intervalo?
  choices:
  - text: $S = ]-\infty, -\frac{11}{3}[ \ \cup \ ]3, +\infty[$
    is_correct: true
  - text: $S = ]-\frac{11}{3}, 3[$
    is_correct: false
  - text: $S = [3, +\infty[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-\infty, -\frac{11}{3}[ \ \cup \
    ]3, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la constante $k$ sea positiva ($k > 0$).'
- 'Paso 2: Plantear dos casos separados con la conjunción ''o'' ($\lor$): $\text{expresión}
  < -k$ o $\text{expresión} > k$.'
- 'Paso 3: Despejar la variable $x$ en cada rama por separado.'
- 'Paso 4: Unir las dos soluciones usando el símbolo de unión $\cup$.'
errores_correccion: '- **Error común:** Tratar $|X| > k$ como una desigualdad acotada
  continua $-k > X > k$.

  - **Cómo corregirlo:** Las inecuaciones con ''mayor que'' ($|X| > k$) SE DIVIDEN
  EN DOS RAMAS SEPARADAS unidas por $\cup$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
