procedimiento:
- 'Paso 1: Confirmar que la constante $k$ sea strictly positiva ($k > 0$).'
- 'Paso 2: Plantear la primera desigualdad estricta $E < -k$ y despejar $x$.'
- 'Paso 3: Plantear la segunda desigualdad estricta $E > k$ y despejar $x$.'
- 'Paso 4: Unir los intervalos abiertos $S = S_1 \cup S_2$.'
errores_correccion: '- **Error común:** Incluir las cotas $-8$ y $2$ con corchetes cerrados en una desigualdad estricta ($>$).

  - **Cómo corregirlo:** Si el operador original es estrictamente mayor que ($>$), NINGUNA de las cotas se incluye; todas llevan corchete abierto.

  '
ejemplos:
- titulo: 'Ejemplo 1: Caso simple'
  enunciado: ¿Cuál es el conjunto solución de $|x| > 3$?
  alternativas:
  - $]-\infty, -3[ \cup ]3, +\infty[$
  - $]-3, 3[$
  - $]-\infty, 3[$
  - $[3, +\infty[$
  respuesta: $]-\infty, -3[ \cup ]3, +\infty[$
  solucion_pasos:
  - 'Paso 1: Desdoblar en $x < -3 \lor x > 3$.'
  - 'Paso 2: $S = ]-\infty, -3[ \cup ]3, +\infty[$.'
- titulo: 'Ejemplo 2: Con binomio lineal'
  enunciado: ¿Cuál es la solución de $|x - 2| > 4$?
  alternativas:
  - $]-\infty, -2[ \cup ]6, +\infty[$
  - $]-2, 6[$
  - $]-\infty, 2[ \cup ]4, +\infty[$
  - $]-\infty, -6[ \cup ]2, +\infty[$
  respuesta: $]-\infty, -2[ \cup ]6, +\infty[$
  solucion_pasos:
  - 'Paso 1: $x - 2 < -4 \implies x < -2$.'
  - 'Paso 2: $x - 2 > 4 \implies x > 6$.'
  - 'Paso 3: $S = ]-\infty, -2[ \cup ]6, +\infty[$.'
- titulo: 'Ejemplo 3: Coeficiente de $x$'
  enunciado: Resuelve $|2x| > 10$.
  alternativas:
  - $]-\infty, -5[ \cup ]5, +\infty[$
  - $]-5, 5[$
  - $[5, +\infty[$
  - $]-\infty, -5]$
  respuesta: $]-\infty, -5[ \cup ]5, +\infty[$
  solucion_pasos:
  - 'Paso 1: $2x < -10 \implies x < -5$.'
  - 'Paso 2: $2x > 10 \implies x > 5$.'
  - 'Paso 3: $S = ]-\infty, -5[ \cup ]5, +\infty[$.'
- titulo: 'Ejemplo 4: Unión vs Intersección'
  enunciado: Al resolver $|f(x)| > k$, ¿por qué se usa el conector de unión $\cup$?
  alternativas:
  - Porque los puntos pueden estar a la izquierda O a la derecha del rango central
  - Porque debe cumplirse ambas a la vez
  - Por convención sin justificación
  - Porque es una desigualdad continua
  respuesta: Porque los puntos pueden estar a la izquierda O a la derecha del rango central
  solucion_pasos:
  - 'Paso 1: Un número no puede ser simultáneamente menor que $-k$ y mayor que $k$.'
  - 'Paso 2: La disyunción lógica $\lor$ genera la unión de conjuntos $\cup$.'
errores_frecuentes:
- La inecuación $|x| > 6$ equivale a la condición acotada $-6 < x < 6$.
- Desglosar $|x - 3| > 4$ produce la inecuación estricta $-4 > x - 3 > 4$.
- La rama negativa de $|E| > k$ mantiene la dirección del operador resultando en $E > -k$.
- Al resolver $|x| > 2$, los extremos $-2$ y $2$ se incluyen dentro del conjunto solución con corchetes cerrados.
- La disyunción en $|E| > k$ exige calcular la intersección entre $S_1$ y $S_2$.
afirmaciones_verdaderas:
- 'Para $k > 0$, la desigualdad $|E| > k$ se descompone en dos condiciones disyuntivas: $E < -k \quad \lor \quad E > k$.'
- El conjunto solución resultante es la unión de dos intervalos abiertos inconexos $]-\infty, -k[ \cup ]k, +\infty[$.
al_terminar_debes_poder: '**QUÉ:** Resolver inecuaciones de la forma $|f(x)| > k$ con $k > 0$.


  **CÓMO:** Desdoblando la inecuación en la unión de dos semirrectas disjuntas: $f(x) < -k \lor f(x) > k$.


