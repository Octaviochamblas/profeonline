semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MAYOR_QUE_POSITIVO
resumen_inicial: 'Resolución de inecuación de valor absoluto mayor que una constante
  positiva: relaciones de orden, intervalos y resolución en Inecuaciones con valor
  absoluto.'
explicacion_simple: El valor absoluto de un número real representa su distancia al
  origen en la recta numérica. Cuando se plantea una inecuación del tipo $|x| > a$,
  donde $a$ es un número positivo, se están buscando todos los valores de $x$ cuya
  distancia al cero sea estrictamente mayor que $a$. Geométricamente, esto corresponde
  a los números que se ubican a la derecha de $a$ o a la izquierda de $-a$.
explicacion_formal: '### Definición formal

  Sea $x \in \mathbb{R}$ y un número real $a > 0$. La inecuación con valor absoluto
  $|x| > a$ es equivalente a la proposición lógica $x > a \lor x < -a$. En términos
  de conjuntos, el conjunto solución $S$ está dado por la unión de intervalos - $S
  = ]-\infty, -a[ \cup ]a, +\infty[$. Análogamente, para la inecuación no estricta
  $|x| \geq a$, la equivalencia es $x \geq a \lor x \leq -a$, y el conjunto solución
  corresponde a $S = ]-\infty, -a] \cup [a, +\infty[$.


  ### Desarrollo didáctico

  Para comprender esta propiedad, se puede recurrir a la definición geométrica del
  valor absoluto como distancia. La expresión $|x| > a$ requiere encontrar todos los
  puntos $x$ que se encuentren a una distancia mayor que $a$ unidades del punto central
  (el cero). Si partimos del cero y nos alejamos $a$ unidades en ambas direcciones,
  llegamos a los puntos $-a$ y $a$. Los valores cuya distancia al origen es mayor
  que $a$ se encuentran fuera de este segmento delimitado por $-a$ y $a$. Esto explica
  por qué la solución se divide en dos regiones separadas: los números muy negativos
  (menores que $-a$) y los números muy positivos (mayores que $a$).'
definiciones_clave: '- **Resolución de inecuación de valor absoluto mayor que una
  constante positiva**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a resolución de inecuación de valor absoluto
  mayor que una constante positiva.'
