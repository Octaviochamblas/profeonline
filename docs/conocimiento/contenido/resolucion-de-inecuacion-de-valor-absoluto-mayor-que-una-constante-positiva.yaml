semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MAYOR_QUE_POSITIVO
resumen_inicial: Las inecuaciones del tipo $|E| > k$ con $k > 0$ se resuelven desglosando la propiedad estricta en la unión de dos intervalos abiertos disjuntos.
explicacion_simple: '![Resolución de inecuación de valor absoluto mayor que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-mayor-que-una-constante-positiva-intro.svg)


  Para resolver $|x| > 4$, buscamos los números cuya distancia a cero sea **estrictamente mayor que 4**.


  Esto excluye las cotas $-4$ y $4$:

  1. Rama izquierda: $x < -4 \implies ]-\infty, -4[$.

  2. Rama derecha: $x > 4 \implies ]4, +\infty[$.


  La solución completa es la unión de ambos intervalos abiertos: $]-\infty, -4[ \cup ]4, +\infty[$.'
explicacion_formal: 'Para $k > 0$ y $E(x)$ una expresión algebraica:


  $$|E(x)| > k \iff E(x) < -k \quad \lor \quad E(x) > k$$


  **Desglose de la fórmula:**

  - Desigualdades estrictas: No incluyen los límites $-k$ ni $k$.

  - Conjunto solución global $S = ]-\infty, -k[ \cup ]k, +\infty[$.

  '
definiciones_clave: '- **Descomposición disyuntiva estricta**: Aplicación de la regla de separación para $|E| > k$ con corchetes abiertos en las cotas.

  '
propiedades_relaciones: '- **Exclusión de las cotas**: La condición estricta exige corchetes abiertos $]-k$ y $k[$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución de inecuación de valor absoluto mayor que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-mayor-que-una-constante-positiva-ejemplos.svg)


    Determina la solución de la inecuación $|x + 3| > 5$ y exprésala en notación de intervalo.'
  pasos:
  - 'Paso 1: Formular la disyunción estricta: $x + 3 < -5 \ \lor \ x + 3 > 5$.'
  - 'Paso 2: Resolver la primera rama: $x < -8 \implies S_1 = ]-\infty, -8[$.'
  - 'Paso 3: Resolver la segunda rama: $x > 2 \implies S_2 = ]2, +\infty[$.'
  - 'Paso 4: Unir ambos intervalos: $S = ]-\infty, -8[ \cup ]2, +\infty[$.'
