semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MAYOR_QUE_POSITIVO
resumen_inicial: Las inecuaciones del tipo $|E| > k$ con $k > 0$ se resuelven desglosando la propiedad estricta en la unión de dos intervalos abiertos disjuntos.
explicacion_simple: |
  Para resolver $|x| > 4$, buscamos los números cuya distancia a cero sea **estrictamente mayor que 4**.

  Esto excluye las cotas $-4$ y $4$:
  1. Rama izquierda: $x < -4 \implies ]-\infty, -4[$.
  2. Rama derecha: $x > 4 \implies ]4, +\infty[$.

  La solución completa es la unión de ambos intervalos abiertos: $]-\infty, -4[ \cup ]4, +\infty[$.
explicacion_formal: |
  Para $k > 0$ y $E(x)$ una expresión algebraica:

  $$|E(x)| > k \iff E(x) < -k \quad \lor \quad E(x) > k$$

  **Desglose de la fórmula:**
  - Desigualdades estrictas: No incluyen los límites $-k$ ni $k$.
  - Conjunto solución global $S = ]-\infty, -k[ \cup ]k, +\infty[$.
definiciones_clave: |
  - **Descomposición disyuntiva estricta**: Aplicación de la regla de separación para $|E| > k$ con corchetes abiertos en las cotas.
propiedades_relaciones: |
  - **Exclusión de las cotas**: La condición estricta exige corchetes abiertos $]-k$ y $k[$.
ejemplo_guiado:
  enunciado: Determina la solución de la inecuación $|x + 3| > 5$ y exprésala en notación de intervalo.
  pasos:
    - 'Paso 1: Formular la disyunción estricta: $x + 3 < -5 \ \lor \ x + 3 > 5$.'
    - 'Paso 2: Resolver la primera rama: $x < -8 \implies S_1 = ]-\infty, -8[$.'
    - 'Paso 3: Resolver la segunda rama: $x > 2 \implies S_2 = ]2, +\infty[$.'
    - 'Paso 4: Unir ambos intervalos: $S = ]-\infty, -8[ \cup ]2, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: Al resolver la inecuación $|x + 3| > 5$, ¿cuál es el conjunto solución $S$?
    choices:
      - {text: '$S = ]-\infty, -8[ \cup ]2, +\infty[$', is_correct: true}
      - {text: '$S = ]-8, 2[$', is_correct: false}
      - {text: '$S = [ -8, 2 ]$', is_correct: false}
      - {text: '$S = ]-\infty, -8] \cup [2, +\infty[$', is_correct: false}
    explanation: La alternativa correcta es '$S = ]-\infty, -8[ \cup ]2, +\infty[$'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Por qué en la solución de $|x + 3| > 5$ se utilizan corchetes abiertos en $-8$ y $2$?
    choices:
      - {text: Porque el operador es estrictamente mayor ($>$), excluyendo los extremos., is_correct: true}
      - {text: Porque los números negativos no se incluyen nunca., is_correct: false}
      - {text: Porque la constante $5$ es impar., is_correct: false}
      - {text: Es una convención opcional., is_correct: false}
    explanation: La alternativa correcta es 'Porque el operador es estrictamente mayor ($>$), excluyendo los extremos.'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Confirmar que la constante $k$ sea strictly positiva ($k > 0$).'
  - 'Paso 2: Plantear la primera desigualdad estricta $E < -k$ y despejar $x$.'
  - 'Paso 3: Plantear la segunda desigualdad estricta $E > k$ y despejar $x$.'
  - 'Paso 4: Unir los intervalos abiertos $S = S_1 \cup S_2$.'
errores_correccion: |
  - **Error común:** Incluir las cotas $-8$ y $2$ con corchetes cerrados en una desigualdad estricta ($>$).
  - **Cómo corregirlo:** Si el operador original es estrictamente mayor que ($>$), NINGUNA de las cotas se incluye; todas llevan corchete abierto.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de inecuaciones con valor absoluto.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de inecuaciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La inecuación $|x| > 6$ equivale a la condición acotada $-6 < x < 6$.'
  - 'Desglosar $|x - 3| > 4$ produce la inecuación estricta $-4 > x - 3 > 4$.'
  - 'La rama negativa de $|E| > k$ mantiene la dirección del operador resultando en $E > -k$.'
  - 'Al resolver $|x| > 2$, los extremos $-2$ y $2$ se incluyen dentro del conjunto solución con corchetes cerrados.'
  - 'La disyunción en $|E| > k$ exige calcular la intersección entre $S_1$ y $S_2$.'
afirmaciones_verdaderas:
  - 'Para $k > 0$, la desigualdad $|E| > k$ se descompone en dos condiciones disyuntivas: $E < -k \quad \lor \quad E > k$.'
  - 'El conjunto solución resultante es la unión de dos intervalos abiertos inconexos $]-\infty, -k[ \cup ]k, +\infty[$.'
al_terminar_debes_poder: |
  QUÉ: Resolver inecuaciones de valor absoluto del tipo $|E| > k$ con $k > 0$.
  CÓMO: Aplicar la equivalencia disyuntiva $E < -k \lor E > k$, resolver las inecuaciones por separado y expresar la solución como unión de intervalos abiertos.
