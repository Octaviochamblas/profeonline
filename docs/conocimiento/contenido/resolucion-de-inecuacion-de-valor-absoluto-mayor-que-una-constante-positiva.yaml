procedimiento:
- Identificar la expresión contenida dentro del valor absoluto y asegurarse de que
  la inecuación tenga la forma $|X| > a$ o $|X| \\geq a$, con $a > 0$.
- Aplicar la propiedad del valor absoluto para separar la inecuación original en dos
  inecuaciones independientes conectadas por una disyunción ('o') - $X > a$ y $X <
  -a$ (utilizando $\\geq$ y $\\leq$ si corresponde).
- Resolver cada una de las inecuaciones lineales resultantes despejando la incógnita.
- Determinar el conjunto solución final uniendo los intervalos obtenidos de ambas
  inecuaciones, resultando en $S = S_1 \\cup S_2$.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en resolución de inecuación
  de valor absoluto mayor que una constante positiva.
ejemplos:
- titulo: Inecuación estricta básica
  enunciado: Resuelva la inecuación $|2x - 3| > 5$.
  solucion_pasos:
  - Se aplica la propiedad separando en dos inecuaciones - $2x - 3 > 5 \\lor 2x -
    3 < -5$.
  - Se resuelve la primera inecuación - $2x > 8 \\implies x > 4$. Su intervalo es
    $]4, +\\infty[$.
  - Se resuelve la segunda inecuación - $2x < -2 \\implies x < -1$. Su intervalo es
    $]-\\infty, -1[$.
  - El conjunto solución final es la unión de ambos intervalos - $]-\\infty, -1[ \\cup
    ]4, +\\infty[$.
- titulo: Inecuación no estricta
  enunciado: Encuentre el conjunto solución de $|x + 4| \\geq 2$.
  solucion_pasos:
  - Al ser no estricta, la propiedad indica - $x + 4 \\geq 2 \\lor x + 4 \\leq -2$.
  - Resolviendo la primera inecuación - $x \\geq -2$. Esto corresponde al intervalo
    $[-2, +\\infty[$.
  - Resolviendo la segunda inecuación - $x \\leq -6$. Esto corresponde al intervalo
    $]-\\infty, -6]$.
  - La solución completa es la unión de ambas regiones - $]-\\infty, -6] \\cup [-2,
    +\\infty[$.
- titulo: ¿El número $0$ pertenece al conjunto solución de $|x - 5| > 4$?
  respuesta: Verdadero
  solucion_pasos:
  - Se reemplaza $x = 0$ en la expresión dentro del valor absoluto - $|0 - 5| = |-5|$.
  - Se calcula el valor absoluto - $|-5| = 5$.
  - Se verifica si cumple la inecuación original evaluando la proposición resultante
    - $5 > 4$.
  - Como la desigualdad $5 > 4$ es verdadera, el número $0$ efectivamente pertenece
    al conjunto solución.
- titulo: ¿La inecuación $|x| > 3$ es equivalente al sistema de inecuaciones simultáneas
    $x > 3$ y $x < -3$?
  respuesta: Falso
  solucion_pasos:
  - La propiedad del valor absoluto establece que la solución es la unión, es decir,
    la disyunción lógica 'o' ($x > 3 \\lor x < -3$).
  - Un sistema simultáneo implicaría buscar números que sean mayores a $3$ y menores
    a $-3$ al mismo tiempo.
  - Dado que ningún número real puede ser simultáneamente mayor a $3$ y menor a $-3$,
    la intersección sería el conjunto vacío.
  - Por lo tanto, la expresión equivalente correcta es una disyunción ('o'), no un
    sistema simultáneo ('y').
errores_frecuentes:
- Resolver la inecuación expresando $-a < X < a$, confundiendo la propiedad con la
  correspondiente a las inecuaciones de la forma $|X| < a$.
- Mantener el mismo sentido de la desigualdad al plantear el caso negativo, escribiendo
  $X > -a$ en lugar de $X < -a$.
- Intersectar los conjuntos solución de las dos inecuaciones lineales en lugar de
  unirlos, lo que a menudo resulta erróneamente en un conjunto vacío.
- Olvidar resolver ambos casos, analizando únicamente el caso directo donde el argumento
  del valor absoluto se asume positivo ($X > a$).
- Evaluar un punto interior del intervalo intermedio $[-a, a]$ y considerarlo equivocadamente
  como parte de la solución.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  resolución de inecuación de valor absoluto mayor que una constante positiva.
