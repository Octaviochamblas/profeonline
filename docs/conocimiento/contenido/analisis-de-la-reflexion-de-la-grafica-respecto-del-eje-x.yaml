semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.REFLEXION_EJE_X
resumen_inicial: 'Análisis de la reflexión de la gráfica respecto del eje X: parábola,
  vértice, concavidad y formas de Traslaciones y transformaciones.'
explicacion_simple: 'Multiplicar toda la función por $-1$ produce el mismo efecto
  que si se colocara un espejo horizontal bajo la parábola: cada punto se refleja
  verticalmente.'
explicacion_formal: '### Definición formal


  Dada $f(x)=x^2$, la función $g(x)=-f(x)=-x^2$ es la reflexión de $f$ respecto al
  eje $x$. Para cada valor de $x$, si $f(x)=y$, entonces $g(x)=-y$, invirtiendo el
  signo de la imagen sin alterar el valor de $x$.


  ### Desarrollo didáctico


  Geométricamente, esta reflexión invierte la concavidad de la parábola: una parábola
  que abría hacia arriba ahora abre hacia abajo, y viceversa, manteniendo la misma
  abertura.


  La gráfica de $g(x)=-x^2$ es la reflexión de $f(x)=x^2$ respecto al eje $x$: donde
  $f$ tenía un mínimo en $(0,0)$, $g$ tiene un máximo en el mismo punto.'
definiciones_clave: '- **Análisis de la reflexión de la gráfica respecto del eje X**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  análisis de la reflexión de la gráfica respecto del eje x.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando análisis de
    la reflexión de la gráfica respecto del eje x.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a análisis
    de la reflexión de la gráfica respecto del eje x.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
