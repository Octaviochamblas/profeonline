procedimiento:
- 'Paso 1: Identifica si el coeficiente principal de la función tiene signo negativo
  respecto a una función base positiva.'
- 'Paso 2: Si es así, reconoce que la gráfica es la reflexión respecto al eje $x$
  de la función base.'
- 'Paso 3: Determina cómo cambia la concavidad: de hacia arriba a hacia abajo, o viceversa.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en análisis de la reflexión de la gráfica respecto
  del eje x.
ejemplos:
- titulo: Reflexión de una parábola básica
  enunciado: Describe la relación entre $f(x)=x^2$ y $g(x)=-x^2$.
  solucion_pasos:
  - $g(x)=-f(x)$.
  - La gráfica de $g$ es la reflexión de la de $f$ respecto al eje $x$; $f$ abre hacia
    arriba y $g$ hacia abajo.
- titulo: Reflexión con función desplazada
  enunciado: Describe la relación entre $f(x)=(x-2)^2+3$ y $g(x)=-(x-2)^2-3$.
  solucion_pasos:
  - $g(x)=-f(x)$.
  - La gráfica de $g$ es la reflexión de la de $f$ respecto al eje $x$; el vértice
    pasa de máximo/mínimo a mínimo/máximo con la coordenada $y$ invertida en signo.
- titulo: ¿La reflexión respecto al eje $x$ cambia el vértice de la parábola?
  enunciado: ¿La reflexión respecto al eje $x$ cambia el vértice de la parábola?
  respuesta: Sí
  solucion_pasos:
  - La coordenada $x$ del vértice permanece igual, pero la coordenada $y$ cambia de
    signo.
- titulo: ¿La reflexión respecto al eje $x$ afecta el ancho o abertura de la parábola?
  enunciado: ¿La reflexión respecto al eje $x$ afecta el ancho o abertura de la parábola?
  respuesta: 'No'
  solucion_pasos:
  - Solo invierte la concavidad; el valor absoluto del coeficiente $a$ (que determina
    la abertura) permanece igual.
errores_frecuentes:
- Declarar la reflexión respecto al eje $x$ con una traslación vertical.
- Declarar que la reflexión cambia la coordenada $x$ del vértice, cuando en realidad
  solo cambia la coordenada $y$.
- No reconocer que la reflexión invierte la concavidad de la parábola.
- Declarar la reflexión respecto al eje $x$ con la reflexión respecto al eje $y$.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  análisis de la reflexión de la gráfica respecto del eje x.
