semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.REFLEXION_EJE_X
resumen_inicial: 'La reflexión respecto al eje $x$ es la transformación $g(x) = -f(x)$ que invierte el signo de todas las ordenadas de la parábola, cambiando su concavidad.'
explicacion_simple: |
  Reflejar una parábola respecto al eje $x$ es como colocar un espejo a lo largo del suelo horizontal: todo lo que estaba por arriba del eje se refleja exactamente hacia abajo, y todo lo que estaba por abajo se refleja hacia arriba. Las ramas que abrían hacia arriba pasan a abrir hacia abajo, y un punto mínimo se convierte en un punto máximo a la misma distancia del suelo.
explicacion_formal: |
  ### Definición formal
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, su **reflexión espectral respecto al eje de las abscisas (eje $x$)** es la función $g: \mathbb{R} \to \mathbb{R}$ definida por:
  $$g(x) = -f(x) = -(ax^2 + bx + c) = -ax^2 - bx - c$$

  ### Desglose simbólico
  - Mapeo de puntos: $P(x_0, y_0) \in \text{Graf}(f) \iff P'(x_0, -y_0) \in \text{Graf}(g)$.
  - Inversión de concavidad: Si $f$ tiene coeficiente $a$, $g$ tiene coeficiente $-a$.
  - Transformación del vértice: $V(h, k) \to V'(h, -k)$.
  - Conservación de los ceros reales: Si $f(x_1) = 0 \implies g(x_1) = -0 = 0$. Los puntos de corte con el eje $x$ se mantienen invariantes.

  ### Síntesis didáctica
  Multiplicar **toda la función** por $-1$ invierte los signos de los tres coeficientes $a$, $b$ y $c$. Los puntos ubicados sobre el eje $x$ ($y = 0$) actúan como puntos fijos inmóviles durante la reflexión.
definiciones_clave: |
  - **Reflexión respecto al eje $x$**: Transformación $g(x) = -f(x)$ que invierte el signo de las imágenes $y$.
  - **Puntos invariantes (fijos)**: Intersecciones con el eje $x$ que permanecen inalteradas tras la reflexión.
  - **Inversión de extremo**: Transformación de un mínimo $k$ en un máximo $-k$ (y viceversa).
propiedades_relaciones: |
  - **Simetría especular respecto al eje $x$**: El eje $x$ actúa como mediatriz de los segmentos que unen $P(x_0, y_0)$ con su reflejado $P'(x_0, -y_0)$.
  - **Doble reflexión**: Reflejar dos veces consecutivas una función respecto al eje $x$ recupera la función original: $-(-f(x)) = f(x)$.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = 2(x - 3)^2 + 5$, determina la regla de su función reflejada $g(x) = -f(x)$ respecto al eje $x$, y analiza el cambio en las coordenadas de su vértice.'
  pasos:
    - 'Paso 1: Aplicamos la transformación de reflexión $g(x) = -f(x) = -[2(x - 3)^2 + 5]$.'
    - 'Paso 2: Distribuimos el signo negativo externo: $g(x) = -2(x - 3)^2 - 5$.'
    - 'Paso 3: Identificamos el vértice original de $f(x)$: $V(3, 5)$ (mínimo absoluto).'
    - 'Paso 4: Identificamos el vértice reflejado de $g(x)$: $V(3, -5)$ (máximo absoluto).'
    - 'Paso 5: Comprobamos que la abscisa $h = 3$ se mantiene idéntica, mientras que la ordenada $k = 5$ se ha invertido a $-5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la gráfica de la parábola $f(x) = -5x^2 + 4x - 1$ se refleja respecto al eje de las abscisas (eje $x$), ¿cuál es la regla de la nueva función $g(x)$?'
    choices:
      - {text: '$g(x) = 5x^2 - 4x + 1$', is_correct: true}
      - {text: '$g(x) = 5x^2 + 4x - 1$', is_correct: false}
      - {text: '$g(x) = -5x^2 - 4x + 1$', is_correct: false}
      - {text: '$g(x) = 5x^2 - 4x - 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 5x^2 - 4x + 1$''. Reflejar exige multiplicar toda la expresión por $-1$: $g(x) = -(-5x^2 + 4x - 1) = 5x^2 - 4x + 1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la parábola $f(x)$ interseca al eje $x$ en los puntos $(-2, 0)$ y $(6, 0)$, ¿cuáles son las intersecciones con el eje $x$ de su función reflejada $g(x) = -f(x)$?'
    choices:
      - {text: 'Exactamente los mismos puntos $(-2, 0)$ y $(6, 0)$', is_correct: true}
      - {text: 'Los puntos invertidos $(2, 0)$ y $(-6, 0)$', is_correct: false}
      - {text: 'Los puntos verticales $(0, -2)$ y $(0, 6)$', is_correct: false}
      - {text: 'La función reflejada no posee puntos de corte', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente los mismos puntos $(-2, 0)$ y $(6, 0)$''. Los puntos con $y = 0$ son invariantes bajo la reflexión $-0 = 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Multiplicar la totalidad de la expresión de la función $f(x)$ por el factor $-1$.'
  - 'Paso 2: Distribuir el signo negativo cambiando los signos de todos los términos o parámetros externos.'
  - 'Paso 3: Invertir el signo de la ordenada del vértice $k \to -k$ e invertir la concavidad del coeficiente principal $a \to -a$.'
errores_correccion: |
  - **Error 1:** Multiplicar por $-1$ únicamente el primer término $x^2$ al reflejar la función. **Cómo corregirlo:** La reflexión respecto al eje $x$ exige multiplicar la función completa $g(x) = -f(x) = -(ax^2 + bx + c) = -ax^2 - bx - c$.
  - **Error 2:** Cambiar también el signo de la abscisa del vértice $h$. **Cómo corregirlo:** En la reflexión respecto al eje $x$, las posiciones horizontales $x$ no cambian. El vértice $V(h, k)$ pasa a ser $V'(h, -k)$, manteniendo la misma abscisa $h$.
ejemplos:
  - titulo: 'Reflexión de función mónica simple'
    enunciado: '¿Cuál es la función reflejada respecto al eje $x$ de $f(x) = x^2$?'
    alternativas:
      - '$g(x) = -x^2$'
      - '$g(x) = \frac{1}{x^2}$'
      - '$g(x) = (-x)^2$'
    respuesta: '$g(x) = -x^2$'
    solucion_pasos:
      - '1. Aplicamos $g(x) = -f(x) = -(x^2) = -x^2$.'
      - '2. Las ramas que abrían hacia arriba pasan a abrir hacia abajo.'
  - titulo: 'Reflexión en forma canónica'
    enunciado: '¿Cuál es la reflejada respecto al eje $x$ de $f(x) = 3(x - 4)^2 - 2$?'
    alternativas:
      - '$g(x) = -3(x - 4)^2 + 2$'
      - '$g(x) = -3(x + 4)^2 - 2$'
      - '$g(x) = 3(x - 4)^2 + 2$'
    respuesta: '$g(x) = -3(x - 4)^2 + 2$'
    solucion_pasos:
      - '1. $g(x) = -[3(x - 4)^2 - 2]$.'
      - '2. Distribuimos el signo negativo: $g(x) = -3(x - 4)^2 + 2$.'
  - titulo: 'Invariancia del eje de simetría'
    enunciado: '¿La reflexión respecto al eje $x$ conserva la misma recta del eje de simetría $x = h$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Puesto que la abscisa $h$ no cambia ($V(h, k) \to V(h, -k)$), el eje de simetría $x = h$ permanece inalterado.'
  - titulo: 'Inversión del recorrido'
    enunciado: 'Si $f(x)$ tiene recorrido $[3, +\infty[$, ¿su reflejada $g(x) = -f(x)$ tiene recorrido $]-\infty, -3]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al multiplicar por $-1$, las salidas se invierten cambiando las cotas a $]-\infty, -3]$.'
errores_frecuentes:
  - 'La reflexión respecto al eje $x$ de $f(x) = x^2 - 6x + 5$ es $g(x) = -x^2 - 6x + 5$.'
  - 'Reflejar la parábola de vértice $V(4, 2)$ respecto al eje $x$ traslada el vértice a $V(-4, -2)$.'
  - 'La reflexión respecto al eje $x$ elimina las intersecciones de la parábola con el eje $x$.'
  - 'Reflejar la función $f(x) = -(x - 1)^2$ respecto al eje $x$ produce $g(x) = (x + 1)^2$.'
  - 'Al reflejar una parábola respecto al eje $x$, las ramas se hacen el doble de anclas.'
afirmaciones_verdaderas:
  - 'La reflexión respecto al eje $x$ viene dada por $g(x) = -f(x)$, invirtiendo la concavidad de la parábola y cambiando el signo de la ordenada del vértice a $V(h, -k)$.'
  - 'Las intersecciones con el eje $x$ son puntos fijos invariantes bajo la reflexión respecto al eje de las abscisas.'
al_terminar_debes_poder: 'Analizar y determinar la regla de la función reflejada $g(x) = -f(x)$ respecto al eje $x$ deduciendo sus efectos sobre la concavidad y el vértice.'
