semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.REFLEXION_EJE_X
resumen_inicial: El análisis de la reflexión respecto del eje $X$ transforma la función $f(x)$ en $g(x) = -f(x)$, invirtiendo la orientación de todas las ordenadas $(x, y) \mapsto (x, -y)$, cambiando la concavidad e intercambiando la naturaleza del vértice entre máximo y mínimo.
explicacion_simple: "![El análisis de la reflexión respecto del eje $X$ transforma la función $f(x)$ en $g(x) = -f(x)$, invirtiendo la orientación de todas las ordenadas $(x, y) \\mapsto (x, -y)$, cambiando la concavidad e intercambiando la naturaleza del vértice entre máximo y mínimo](/static/img/nodos/analisis-de-la-reflexion-de-la-grafica-respecto-del-eje-x-intro.svg)\n\n\nLa **reflexión respecto al eje $X$** es como colocar un espejo plano justo sobre la línea horizontal del suelo:\n\n- **¿Qué le pasa a la fórmula?** Se le pone un signo negativo a **toda la función**:\n  $$g(x) = -f(x)$$\n- **Efectos visuales inmediatos:**\n  - Si las ramas apuntaban hacia arriba ($\\cup$), ahora apuntan hacia abajo ($\\cap$).\n  - Si el vértice era un punto mínimo en $(3, 4)$, ahora es un punto **máximo en $(3, -4)$**.\n  - **Los cortes con el eje $X$ no se mueven:** Como están en el espejo (altura $y = 0$), se quedan exactamente en el mismo lugar."
explicacion_formal: 'Sea $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$. La **isometría de reflexión axial especular** respecto a la recta $Y = 0$ se define mediante el operador $\mathcal{R}_X$:

  $$g(x) = (\mathcal{R}_X f)(x) = -f(x) = -ax^2 - bx - c$$


  **Propiedades espectrales de la reflexión**:

  1. **Inversión de curvatura**: $g''''(x) = -f''''(x) = -2a$. Si $f$ es convexa ($a > 0$), $-f$ es estrictamente cóncava ($-a < 0$).

  2. **Transformación del vértice**: $V_f(x_v, y_v) \mapsto V_g(x_v, -y_v)$. La abscisa se conserva ($x_v'' = x_v$) y la ordenada se refleja ($y_v'' = -y_v$).

  3. **Invarianza del conjunto de ceros**: $\mathcal{Z}(g) = \mathcal{Z}(f)$ porque $-f(x) = 0 \iff f(x) = 0$.'
definiciones_clave: '- **Reflexión respecto al eje X**: Simetría axial que envía cada par $(x, y)$ a $(x, -y)$.

  - **Inversión de concavidad**: Cambio de signo del coeficiente principal $a \mapsto -a$.'
propiedades_relaciones: '- **Involución**: Reflejar dos veces consecutivas devuelve la función original: $-(-f(x)) = f(x)$.

  - **Reflexión en forma canónica**: $-[a(x - h)^2 + k] = -a(x - h)^2 - k$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la reflexión respecto del eje $X$ transforma la función $f(x)$ en $g(x) = -f(x)$, invirtiendo la orientación de todas las ordenadas $(x, y) \mapsto (x, -y)$, cambiando la concavidad e intercambiando la naturaleza del vértice entre máximo y mínimo](/static/img/nodos/analisis-de-la-reflexion-de-la-grafica-respecto-del-eje-x-ejemplos.svg)



    Dada la función $f(x) = 2(x - 4)^2 + 3$, encuentra la ecuación de su reflexión respecto al eje X y compara los vértices y concavidades de ambas.'
  pasos:
  - 'Paso 1: Aplicar la definición de reflexión: $g(x) = -f(x)$.'
  - 'Paso 2: Multiplicar toda la expresión por $-1$:

    $g(x) = -[2(x - 4)^2 + 3] = -2(x - 4)^2 - 3$.'
  - 'Paso 3: Analizar la función original $f(x)$:

    - Concavidad: $a = 2 > 0$ (hacia arriba, $\cup$).

    - Vértice: $V_f(4, 3)$, punto mínimo.'
  - 'Paso 4: Analizar la función reflejada $g(x)$:

    - Concavidad: $a = -2 < 0$ (hacia abajo, $\cap$).

    - Vértice: $V_g(4, -3)$, punto máximo.'
  - 'Paso 5: Conclusión: La abscisa $x = 4$ se mantiene igual, la ordenada cambió de $+3$ a $-3$, y el mínimo se convirtió en máximo.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una parábola tiene vértice en (-5, 6) y abre hacia arriba, ¿dónde queda el vértice tras reflejarla respecto al eje X?
  choices:
  - text: En (-5, -6), abriendo hacia abajo
    is_correct: true
  - text: En (5, 6), abriendo hacia abajo
    is_correct: false
  - text: En (-5, 6), abriendo hacia abajo
    is_correct: false
  - text: En (5, -6), abriendo hacia arriba
    is_correct: false
  explanation: La alternativa correcta es 'En (-5, -6), abriendo hacia abajo'. La reflexión respecto al eje X invierte solo el signo de la ordenada ($y \mapsto -y$) y la concavidad.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con los ceros de una función cuando se refleja respecto al eje X?
  choices:
  - text: Permanecen en los mismos puntos exactos (son invariantes)
    is_correct: true
  - text: Cambian de signo
    is_correct: false
  - text: Se duplican
    is_correct: false
  - text: Desaparecen
    is_correct: false
  explanation: La alternativa correcta es 'Permanecen en los mismos puntos exactos (son invariantes)'. Como $-0 = 0$, los cortes con el eje X no se mueven.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar la expresión funcional completa por $-1$: $g(x) = -f(x)$.'
- 'Paso 2: Distribuir el signo negativo tanto al coeficiente cuadrático como a la constante exterior.'
- 'Paso 3: Identificar el nuevo vértice $V(x_v, -y_v)$.'
- 'Paso 4: Invertir la concavidad (si era hacia arriba pasa a ser hacia abajo y viceversa).'
errores_correccion: '- **Error común:** Cambiar también el signo de $x$ dentro del binomio: $-(x + h)^2$.

  - **Cómo corregirlo:** La reflexión respecto al eje X **solo afecta a la salida $y$**; el binomio $(x - h)$ **conserva su término horizontal intacto**.'
ejemplos:
- titulo: 'Ejemplo 1: Reflexión en forma polinómica'
  enunciado: Refleja $f(x) = x^2 - 6x + 8$ respecto al eje X.
  alternativas:
  - -x^2 + 6x - 8
  - -x^2 - 6x + 8
  - x^2 + 6x - 8
  - -x^2 + 6x + 8
  respuesta: -x^2 + 6x - 8
  solucion_pasos:
  - 'Paso 1: $-(x^2 - 6x + 8) = -x^2 + 6x - 8$.'
- titulo: 'Ejemplo 2: Reflexión en forma canónica'
  enunciado: Refleja $g(x) = 3(x - 2)^2 - 5$ respecto al eje X.
  alternativas:
  - -3(x - 2)^2 + 5
  - -3(x + 2)^2 - 5
  - -3(x - 2)^2 - 5
  - 3(x - 2)^2 + 5
  respuesta: -3(x - 2)^2 + 5
  solucion_pasos:
  - 'Paso 1: $-[3(x - 2)^2 - 5] = -3(x - 2)^2 + 5$.'
- titulo: 'Ejemplo 3: Vértice reflejado'
  enunciado: Si $f(x)$ tiene vértice en $(1, -9)$, ¿dónde está el vértice de $-f(x)$?
  alternativas:
  - V(1, 9)
  - V(-1, -9)
  - V(-1, 9)
  - V(1, -9)
  respuesta: V(1, 9)
  solucion_pasos:
  - 'Paso 1: $(x_v, -y_v) = (1, -(-9)) = (1, 9)$.'
- titulo: 'Ejemplo 4: Cambio de naturaleza extremal'
  enunciado: Si $f(x)$ tiene un valor mínimo igual a $-4$, ¿qué valor tiene $-f(x)$?
  alternativas:
  - Un valor máximo igual a 4
  - Un valor mínimo igual a 4
  - Un valor mínimo igual a -4
  - No tiene extremo
  respuesta: Un valor máximo igual a 4
  solucion_pasos:
  - 'Paso 1: El mínimo en $y = -4$ se convierte en un máximo en $y = +4$.'
errores_frecuentes:
- Cambiar el signo de h al reflejar respecto al eje X.
- Olvidar distribuir el signo negativo al término independiente k.
- Creer que los ceros de la función cambian de lugar tras la reflexión.
afirmaciones_verdaderas:
- La reflexión respecto al eje X transforma la función f(x) en -f(x).
- La reflexión respecto al eje X invierte la concavidad y el signo de la ordenada del vértice.
al_terminar_debes_poder: '**QUÉ:** Analizar y formular la reflexión de una parábola respecto al eje X.


  **CÓMO:** Multiplicando la función por -1 para invertir la concavidad y reflejar la ordenada del vértice (x_v, -y_v).


