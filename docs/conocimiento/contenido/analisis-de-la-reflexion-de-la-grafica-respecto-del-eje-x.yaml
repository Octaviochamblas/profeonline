semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.REFLEXION_EJE_X
resumen_inicial: La reflexión respecto del eje X invierte las alturas de la parábola cambiando el signo de la función de $f(x)$ a $-f(x)$.
explicacion_simple: |
  Una **reflexión respecto al eje X** funciona exactamente como el reflejo en el agua de un lago o en un espejo horizontal:

  - Se obtiene multiplicando **TODA LA FUNCIÓN POR UN SIGNO MENOS**:
    $$g(x) = -f(x)$$
  - **Efectos en la parábola**:
    - Las partes que estaban sobre el eje X ($y > 0$) pasan a estar debajo ($y < 0$).
    - Si la parábola era cóncava hacia arriba ($\cup$), ahora es **cóncava hacia abajo ($\cap$)**.
    - La ordenada del vértice cambia de signo: si era $V(h, k)$, ahora pasa a ser **$V'(h, -k)$**.

  **Ejemplo**:
  - Si $f(x) = (x - 2)^2 + 3$, su reflejada respecto al eje X es:
    $$g(x) = -f(x) = -[(x - 2)^2 + 3] = -(x - 2)^2 - 3$$
explicacion_formal: |
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, la transformación isométrica de **reflexión respecto del eje de las abscisas X** define la función $g: \mathbb{R} \to \mathbb{R}$:

  $$g(x) = -f(x) = -ax^2 - bx - c$$

  **Mapeo cartesiano de puntos y propiedades simétricas:**
  - Para todo punto $(x, y) \in G(f)$, su punto reflejado es $(x, -y) \in G(g)$.
  - **Transformación del vértice:** Si el vértice original es $V(h, k)$, el nuevo vértice reflejado es $V'(h, -k)$.
  - **Invariancia de los ceros:** Si $f(x_1) = 0$, entonces $g(x_1) = -f(x_1) = 0$. Las intersecciones con el eje X se mantienen exactamente idénticas en ambas funciones.
definiciones_clave: |
  - **Reflexión respecto del eje X**: Transformación isométrica que invierte la polaridad de las ordenadas produciendo $g(x) = -f(x)$.
propiedades_relaciones: |
  - **Conservación de las raíces reales**: La gráfica reflejada $g(x) = -f(x)$ comparte exactamente los mismos puntos de corte con el eje X que la función original $f(x)$.
ejemplo_guiado:
  enunciado: 'Halla la función reflejada $g(x)$ respecto del eje X para $f(x) = 2(x - 3)^2 + 5$ e indica la nueva posición de su vértice.'
  pasos:
    - 'Paso 1: Identificar el vértice original: de $f(x)$ el vértice es $V(3, 5)$.'
    - 'Paso 2: Multiplicar toda la expresión por $-1$: $g(x) = -[2(x - 3)^2 + 5] = -2(x - 3)^2 - 5$.'
    - 'Paso 3: Identificar el nuevo vértice: $V(3, -5)$.'
    - 'Paso 4: Constatar el cambio de concavidad: de cóncava hacia arriba ($a = 2$) pasa a cóncava hacia abajo ($a_g = -2$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la función $f(x) = x^2 - 4$ se refleja respecto al eje X, ¿cuál es la fórmula de la función reflejada $g(x)$?'
    choices:
      - {text: '$g(x) = -x^2 + 4$', is_correct: true}
      - {text: '$g(x) = -x^2 - 4$.', is_correct: false}
      - {text: '$g(x) = x^2 + 4$.', is_correct: false}
      - {text: '$g(x) = (-x)^2 - 4$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = -x^2 + 4$''. Multiplicando toda la función por $-1$: $-(x^2 - 4) = -x^2 + 4$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué elemento gráfico de una función cuadrática se mantiene totalmente INALTERADO al aplicar una reflexión respecto del eje X?'
    choices:
      - {text: 'Los ceros o puntos de corte con el eje X', is_correct: true}
      - {text: 'La ordenada del vértice $y_v$.', is_correct: false}
      - {text: 'El punto de corte con el eje Y.', is_correct: false}
      - {text: 'El carácter de máximo o mínimo del vértice.', is_correct: false}
    explanation: 'La alternativa correcta es ''Los ceros o puntos de corte con el eje X''. Al ser $y = 0$, su reflejo $-0 = 0$ no cambia de lugar.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Tomar la expresión completa de la función original $f(x)$.'
  - 'Paso 2: Anteponer un signo menos a toda la función $g(x) = -f(x)$.'
  - 'Paso 3: Distribuir el signo menos a cada uno de los términos de la función.'
  - 'Paso 4: Invertir el signo de la ordenada del vértice $k \to -k$ y alternar la concavidad de la parábola.'
errores_correccion: |
  - **Error común:** Cambiar el signo solo al primer término $ax^2$ y no al término independiente $k$ o $c$.
  - **Cómo corregirlo:** La reflexión **MULTI-PLICA A TODA LA FUNCIÓN**: $g(x) = -[ax^2 + bx + c] = -ax^2 - bx - c$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Reflexión de forma canónica.
    alternativas:
      - 'g(x) = -(x - 1)^2 - 9, V(1, -9)'
      - 'g(x) = -(x - 1)^2 + 9, V(1, 9)'
      - 'g(x) = (x + 1)^2 - 9, V(-1, -9)'
    respuesta: 'g(x) = -(x - 1)^2 - 9, V(1, -9)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Reflexión de forma general.
    alternativas:
      - 'g(x) = -3x^2 + 6x - 2'
      - 'g(x) = -3x^2 - 6x + 2'
      - 'g(x) = 3x^2 - 6x - 2'
    respuesta: 'g(x) = -3x^2 + 6x - 2'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = x^2 + 5$, es correcto decir que su reflejada respecto al eje X es $g(x) = -x^2 + 5$.'
  - 'La suposición de que reflejar respecto del eje X altera la abscisa del vértice $h$ o desplaza el eje de simetría.'
  - 'La suposición de que la reflexión respecto del eje X elimina o cambia de posición las raíces reales de la parábola.'
  - 'Equiparar la reflexión respecto al eje X ($g(x) = -f(x)$) con la reflexión respecto al eje Y ($g(x) = f(-x)$).'
  - 'Afirmar que una parábola cóncava hacia abajo reflejada respecto del eje X se mantiene cóncava hacia abajo.'
afirmaciones_verdaderas:
  - 'La reflexión respecto del eje X $g(x) = -f(x)$ invierte el signo de todas las ordenadas, cambiando la concavidad y transformando el vértice $V(h, k)$ en $V(h, -k)$.'
  - 'Las raíces o ceros reales de la función no sufren alteración alguna al reflejar la parábola respecto del eje X.'
al_terminar_debes_poder: |
  QUÉ: Analizar y construir la función reflejada respecto del eje X de una parábola.
  CÓMO: Plantear $g(x) = -f(x)$, distribuir el signo negativo, alternar la concavidad, transformar el vértice a $V(h, -k)$ y mantener los ceros.
