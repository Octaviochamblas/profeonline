semantic_id: MAT.FUND.TABLAS_VERDAD.TABLA_NEGACION
resumen_inicial: 'Estructura canónica de la tabla de verdad de la negación ($\neg p$), compuesta por $2$ filas que alternan estrictamente el valor de verdad.'
explicacion_simple: |
  La **tabla de verdad de la negación** es la más sencilla de todas las tablas de lógica. Como solo tiene una variable ($p$), solo hay dos posibilidades: que $p$ sea Verdadera o que $p$ sea Falsa ($2^1 = 2$ filas). En la columna de la negación ($\neg p$), los valores simplemente se invierten: cuando $p$ vale $V$, $\neg p$ vale **$F$**; y cuando $p$ vale $F$, $\neg p$ vale **$V$**.

  ![Infografía: Tabla de Verdad de la Negación](/static/img/nodos/tabla-de-verdad-de-la-negacion-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **tabla de verdad de la negación unaria** es la representación tabular exhaustiva de la función booleana de complemento $f_\neg: \{V, F\} \to \{V, F\}$:
  $$\begin{array}{|c|c|} \hline p & \neg p \\ \hline V & F \\ F & V \\ \hline \end{array}$$
  donde cada fila $i \in \{1, 2\}$ representa una asignación de modelo $\mathcal{M}_i \models p$.

  ### Desglose simbólico
  - Número de filas: $2^n = 2^1 = 2$ estados atómicos independientes.
  - Inversión biyectiva: $v(\neg p) = 1 - v(p)$ en el álgebra de Boole $(\{0, 1\}, \land, \lor, \neg)$.
  - Involución tabular: La columna resultante de $\neg(\neg p)$ reproduce exactamente la columna inicial de $p$.

  > **Complemento didáctico:** La tabla de la negación opera fila por fila de manera determinística: la salida en cada celda es exactamente el complemento lógico de la celda de entrada.
definiciones_clave: |
  - **Tabla de verdad de la negación**: Arreglo matricial de 2 filas que muestra la inversión veritativa del operador $\neg$.
  - **Columna de entrada**: Columna que lista las combinaciones de verdad de las variables atómicas ($V, F$).
  - **Columna de salida**: Columna evaluada mediante la aplicación del operador lógico.
propiedades_relaciones: |
  - **Complementariedad estricta**: En ninguna fila coinciden los valores de $p$ y $\neg p$.
  - **Base para tablas mayores**: En fórmulas con múltiples variables, la subcolumna de negación se calcula aplicando la regla de 2 filas a cada celda de la variable correspondiente.
ejemplo_guiado:
  enunciado: |
    Construye la tabla de verdad completa para la fórmula $\neg p \lor p$ y clasifica el resultado.

    ![Diagrama: Tabla de Verdad de la Negación](/static/img/nodos/tabla-de-verdad-de-la-negacion-ejemplos.svg)

  pasos:
    - 'Paso 1: Listar la columna base de $p$: Fila 1 = $V$, Fila 2 = $F$.'
    - 'Paso 2: Calcular la columna de $\neg p$: Para Fila 1 $\neg V = F$, para Fila 2 $\neg F = V$.'
    - 'Paso 3: Evaluar la disyunción $\neg p \lor p$: Fila 1 ($F \lor V = V$), Fila 2 ($V \lor F = V$).'
    - 'Paso 4: Concluir la clasificación: Como la columna final contiene únicamente valores $V$, la fórmula es una tautología.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuántas filas posee la tabla de verdad básica del operador de negación sobre una variable proposicional?'
    choices:
      - {text: 'Exactamente $2$ filas ($2^1$)', is_correct: true}
      - {text: '$4$ filas', is_correct: false}
      - {text: '$1$ fila', is_correct: false}
      - {text: '$8$ filas', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente $2$ filas ($2^1$)''. Para una variable atómica $n=1$, el número de filas es $2^1 = 2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la tabla de verdad de la negación, ¿qué valor aparece en la columna $\neg p$ cuando en la fila $p$ se tiene el valor $F$?'
    choices:
      - {text: 'Verdadero ($V$)', is_correct: true}
      - {text: 'Falso ($F$)', is_correct: false}
      - {text: 'Indeterminado', is_correct: false}
      - {text: 'Nulo', is_correct: false}
    explanation: 'La alternativa correcta es ''Verdadero ($V$)''. La negación de la falsedad es la verdad ($\neg F = V$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dibujar una tabla con dos columnas: una para $p$ y otra para $\neg p$.'
  - 'Paso 2: Escribir los valores de $p$ en orden descendente: primera fila $V$, segunda fila $F$.'
  - 'Paso 3: Invertir cada valor en la columna $\neg p$: colocar $F$ en la primera fila y $V$ en la segunda fila.'
  - 'Paso 4: Verificar que no existan contradicciones ni celdas vacías.'
errores_correccion: |
  - **Error 1:** Construir 4 filas para una tabla que solo contiene la variable $p$. **Cómo corregirlo:** El número de filas viene dado por $2^n$; al haber una sola variable ($n=1$), la tabla tiene únicamente $2^1 = 2$ filas.
  - **Error 2:** Asignar el mismo valor de entrada a la columna de salida. **Cómo corregirlo:** La negación siempre cambia el valor; $V$ pasa a ser $F$ y $F$ pasa a ser $V$.
ejemplos:
  - titulo: 'Evaluación de fila 1'
    enunciado: '¿Cuál es el valor en la fila donde $p = V$ para $\neg p$?'
    alternativas:
      - '$F$'
      - '$V$'
      - '$1/2$'
    respuesta: '$F$'
    solucion_pasos:
      - '1. $\neg V = F$.'
  - titulo: 'Evaluación de fila 2'
    enunciado: '¿Cuál es el valor en la fila donde $p = F$ para $\neg p$?'
    alternativas:
      - '$V$'
      - '$F$'
      - '$0$'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $\neg F = V$.'
  - titulo: 'Columna de doble negación'
    enunciado: '¿La columna de $\neg\neg p$ es idéntica a la columna de $p$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la ley de doble negación $\neg\neg V = V$ y $\neg\neg F = F$.'
  - titulo: 'Suma de valores'
    enunciado: '¿En cada fila la suma booleana de $p$ y $\neg p$ es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $1+0 = 1$ y $0+1 = 1$.'
errores_frecuentes:
  - 'La afirmación de que la tabla de verdad de la negación sobre una variable requiere 4 filas.'
  - 'La afirmación de que en la tabla de la negación existe una fila donde $p$ y $\neg p$ son ambos verdaderos.'
  - 'La afirmación de que la negación de $V$ resulta en una salida indeterminada en la tabla.'
  - 'La afirmación de que el orden canónico de asignación de $p$ comienza con falsedad $F$.'
  - 'La afirmación de que la columna resultante de $\neg p$ coincide con la columna de $p$.'
afirmaciones_verdaderas:
  - 'La tabla de verdad de la negación unaria consta de $2^1 = 2$ filas y mapea biyectivamente cada valor veritativo a su complemento estricto.'
  - 'En la tabla de verdad, las columnas de $p$ y $\neg p$ presentan valores disjuntos y complementarios en cada una de sus filas.'
al_terminar_debes_poder: |
  QUÉ: Construir, llenar e interpretar la tabla de verdad del conectivo de negación ($\neg p$).
  CÓMO: Asignar las $2$ filas canónicas de entrada ($V, F$) y generar la columna de complemento ($F, V$).

  ![Cuadro resumen: Tabla de Verdad de la Negación](/static/img/nodos/tabla-de-verdad-de-la-negacion-resumen.svg)
