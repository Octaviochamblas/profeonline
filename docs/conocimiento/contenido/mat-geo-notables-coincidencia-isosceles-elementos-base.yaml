ejemplo_guiado:
  enunciado: En el estudio de coincidencia de altura, bisectriz y transversal de gravedad
    relativas a la base en un triángulo isósceles, un triángulo posee ángulos interiores
    de medidas $116^\circ$, $4542^\circ$ y $\gamma$. Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de coincidencia de altura, bisectriz y transversal de
    gravedad relativas a la base en un triángulo isósceles y la suma de ángulos interiores.
  - 'Plantear la suma: $116^\circ + 4542^\circ + \gamma = 180^\circ \implies 4658^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4658^\circ = -4478^\circ$.
