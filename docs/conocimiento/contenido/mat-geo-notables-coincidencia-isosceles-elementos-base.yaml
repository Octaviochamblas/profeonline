semantic_id: MAT.GEO.NOTABLES_COINCIDENCIA.ISOSCELES_ELEMENTOS_BASE
resumen_inicial: 'Coincidencia de altura, bisectriz y transversal de gravedad relativas
  a la base en un triángulo isósceles: conceptos, teoremas, propiedades geométricas
  y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: En un triángulo cualquiera, altura, bisectriz y transversal de
  gravedad de un mismo vértice suelen ser tres segmentos distintos. Pero en el triángulo
  isósceles, la simetría hace que las tres coincidan exactamente, si se trazan desde
  el vértice apical.
explicacion_formal: '![Coincidencia de rectas notables en isósceles](/static/img/geometria/elementos-secundarios/notables-coincidencia-isosceles-elementos-base.svg)


  ### Definición formal


  En un triángulo isósceles ABC con AC=BC (vértice apical C), el segmento que va desde
  C hasta el punto medio de AB es simultáneamente la altura, la bisectriz del ángulo
  en C, y la transversal de gravedad relativa a la base AB.


  ### Desarrollo didáctico


  Esta coincidencia se debe a la simetría de reflexión del triángulo isósceles respecto
  a ese segmento: refleja el lado AC en el BC (y viceversa), por lo que cualquier
  segmento con esa simetría debe cumplir las tres condiciones a la vez.'
definiciones_clave: '- **Coincidencia de altura, bisectriz y transversal de gravedad
