procedimiento:
- 'Paso 1: Identifica el vértice apical del triángulo isósceles (donde se unen los
  dos lados iguales).'
- 'Paso 2: Traza el segmento desde ese vértice hasta el punto medio de la base.'
- 'Paso 3: Reconoce que ese único segmento es a la vez altura, bisectriz y transversal
  de gravedad.'
