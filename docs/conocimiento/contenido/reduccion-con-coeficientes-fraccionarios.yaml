  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la reducción de la expresión $\frac{1}{2}y + \frac{1}{3}y$?
  choices:
  - text: El resultado es $\frac{5}{6}y$, obteniendo el denominador común $6$ y sumando $3 + 2 = 5$
    is_correct: true
  - text: El resultado es $\frac{2}{5}y$
    is_correct: false
  - text: El resultado es $\frac{1}{6}y$
    is_correct: false
  - text: El resultado es $\frac{5}{6}y^2$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $\frac{5}{6}y$, obteniendo el denominador común $6$ y sumando $3 + 2 = 5$'. MCM(2,3)=6 $\implies 3/6 + 2/6 = 5/6y$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar la semejanza de los términos comprobando la identidad de sus factores literales.'
- 'Paso 2: Expresar la suma/resta de los coeficientes fraccionarios en una sola agrupación parentética.'
- 'Paso 3: Determinar el MCM de todos los denominadores presentes.'
- 'Paso 4: Amplificar las fracciones, operar los numeradores, simplificar la fracción resultante y adjuntar el factor literal.'
errores_correccion: '- **Error 1:** Sumar numeradores con numeradores y denominadores con denominadores (escribir $\frac{1}{2}x + \frac{1}{3}x = \frac{2}{5}x$). **Cómo corregirlo:** Para sumar fracciones **DEBE BUSCARSE UN DENOMINADOR COMÚN ($\frac{3}{6} + \frac{2}{6} = \frac{5}{6}x$)**.

  - **Error 2:** Excluir que un coeficiente entero $c$ equivale a $\frac{c}{1}$ al sumarse con fracciones. **Cómo corregirlo:** Los enteros **SE PONEN SOBRE DENOMINADOR $1$ ($2x + \frac{1}{3}x = \frac{2}{1}x + \frac{1}{3}x = \frac{7}{3}x$)**.

  '
ejemplos:
- titulo: Fracciones con igual denominador
  enunciado: ¿Cuál es la reducción de $\frac{5}{7}a - \frac{2}{7}a$?
  alternativas:
  - $\frac{3}{7}a$
  - $\frac{3}{0}a$
  - $\frac{7}{7}a$
  respuesta: $\frac{3}{7}a$
  solucion_pasos:
  - 1. Mismo denominador $7$.
  - '2. Resta: $5 - 2 = 3 \implies \frac{3}{7}a$.'
- titulo: Entero con fracción
  enunciado: ¿Cuál es la reducción de $x + \frac{1}{2}x$?
  alternativas:
  - $\frac{3}{2}x$
  - $\frac{2}{3}x$
  - $\frac{1}{2}x$
  respuesta: $\frac{3}{2}x$
  solucion_pasos:
  - 1. Coeficiente $1 = \frac{2}{2}$.
  - '2. Suma: $\frac{2}{2} + \frac{1}{2} = \frac{3}{2}x$.'
- titulo: Simplificación final
  enunciado: Para $\frac{1}{6}z + \frac{2}{6}z = \frac{3}{6}z$, ¿se simplifica a $\frac{1}{2}z$?
  respuesta: Sí
  solucion_pasos:
  - Sí, dividiendo numerador y denominador por 3 da $\frac{1}{2}z$.
- titulo: Invarianza del exponente fraccionario
  enunciado: Al reducir $\frac{1}{4}x^3 + \frac{3}{4}x^3 = 1x^3$, ¿se mantiene $x^3$ intacto?
  respuesta: Sí
  solucion_pasos:
  - Sí, el factor literal $x^3$ no se altera por operar coeficientes fraccionarios.
errores_frecuentes:
- Sumar directamente los numeradores entre sí y los denominadores entre sí al reducir coeficientes fraccionarios.
- La conversión de coeficientes enteros a fracciones con denominador uno no se efectúa al combinarlos con fracciones.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- La simplificación a su forma irreductible no se efectúa sobre la fracción resultante de la reducción.
- Modificar las potencias del factor literal al realizar la suma de coeficientes racionales.
afirmaciones_verdaderas:
- La reducción de términos semejantes con coeficientes fraccionarios exige homogeneizar los denominadores mediante el MCM.
- Un coeficiente entero c se expresa como c/1 para sumarse o restarse con coeficientes fraccionarios.
al_terminar_debes_poder: '![Resumen de reducción con coeficientes fraccionarios](/static/img/nodos/reduccion-con-coeficientes-fraccionarios-resumen.svg)


  QUÉ: Reducir monomios semejantes cuyos coeficientes numéricos son números racionales.


  CÓMO: Calcular el MCM de los denominadores, amplificar numeradores, sumar o restar las fracciones resultantes y simplificar a su forma irreductible.'
