semantic_id: MAT.ALG.REDUCCION_OPERATIVA.COEFICIENTES_FRACCIONARIOS
resumen_inicial: La reducción con coeficientes fraccionarios consiste en reducir términos semejantes cuyos coeficientes son números racionales fraccionarios mediante el cálculo del mínimo común múltiplo de sus denominadores.
explicacion_simple: "Cuando los términos semejantes tienen **coeficientes fraccionarios** (ej: $\\frac{1}{2}x + \\frac{1}{3}x$), el proceso sigue los mismos pasos de adición de fracciones:\n- **Paso 1**: Identifica y confirma que los factores literales sean semejantes.\n- **Paso 2**: Extrae la suma/resta de los coeficientes fraccionarios entre paréntesis.\n- **Paso 3**: Busca el **mínimo común múltiplo (MCM)** de los denominadores.\n- **Paso 4**: Amplifica los numeradores, realiza la suma o resta y simplifica la fracción final.\n- **Ejemplo**: Reducir $\\frac{3}{4}a + \\frac{1}{2}a$:\n  - Operación de coeficientes: $\\left(\\frac{3}{4} + \\frac{1}{2}\\right)$.\n  - $\\mathrm{MCM}(4, 2) = 4 \\implies \\frac{3}{4} + \\frac{2}{4} = \\frac{5}{4}$.\n  - Resultado con el factor literal: **$\\frac{5}{4}a$**.\n\n![Reducción con Coeficientes Fraccionarios](/static/img/nodos/reduccion-con-coeficientes-fraccionarios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\mathcal{T} = \left\{ \frac{p_1}{d_1} M, \frac{p_2}{d_2} M, \dots, \frac{p_k}{d_k} M \right\}$ un conjunto de monomios semejantes con coeficientes en $\mathbb{Q}$ ($p_i, d_i \in \mathbb{Z}, d_i \neq 0$). La **reducción fraccionaria** homogeneiza el denominador común $D = \operatorname{mcm}(d_1, d_2, \dots, d_k)$:


  $$\sum_{i=1}^k \frac{p_i}{d_i} M = \left( \sum_{i=1}^k \frac{p_i \cdot \frac{D}{d_i}}{D} \right) M = \left( \frac{\sum_{i=1}^k p_i \cdot \frac{D}{d_i}}{D} \right) M = \frac{P_{\text{total}}}{D} M$$


  ### Normalización a Fracción Irreductible

  Si $\gcd(P_{\text{total}}, D) = g > 1$, la fracción del coeficiente resultante se simplifica dividiendo por $g$:


  $$\frac{P_{\text{total}}}{D} M = \frac{P_{\text{total}} / g}{D / g} M$$


  ### Síntesis didáctica

  La reducción fraccionaria integra la teoría de fracciones equivalentes con la simplificación de modelos algebraicos en probabilidad y cálculo avanzado.

  '
definiciones_clave: '- **Reducción fraccionaria**: Operación de adición aditiva de coeficientes pertenecientes al conjunto $\mathbb{Q}$.

  - **Denominador común ($D = \operatorname{mcm}$)**: Valor numérico positivo que permite homogeneizar las fracciones a reducir.

  - **Numerador homogeneizado**: Transformación del numerador original $p_i \cdot (D / d_i)$ tras la amplificación.

  '
propiedades_relaciones: '- **Invarianza del factor literal**: Las letras y exponentes permanecen absolutamente intactos al sumar fracciones.

  - **Compatibilidad con enteros**: Un término con coeficiente entero $c$ se expresa como la fracción $\frac{c}{1}$ para sumarse con coeficientes fraccionarios.

  '
ejemplo_guiado:
  enunciado: 'Reduce la siguiente expresión: $\frac{2}{3}x^2 - \frac{1}{4}x^2 + \frac{5}{6}x^2$.'
  pasos:
  - 'Paso 1: Verificamos la semejanza: Todos tienen el factor literal $x^2$.'
  - 'Paso 2: Extraemos los coeficientes fraccionarios: $\left(\frac{2}{3} - \frac{1}{4} + \frac{5}{6}\right)x^2$.'
  - 'Paso 3: Calculamos el $\operatorname{mcm}(3, 4, 6) = 12$.'
  - 'Paso 4: Amplificamos cada fracción: $\frac{2 \cdot 4}{12} - \frac{1 \cdot 3}{12} + \frac{5 \cdot 2}{12} = \frac{8 - 3 + 10}{12}$.'
  - 'Paso 5: Sumamos los numeradores: $8 - 3 + 10 = 15 \implies \frac{15}{12}$.'
  - 'Paso 6: Simplificamos dividiendo por $3$: $\frac{15 \div 3}{12 \div 3} = \frac{5}{4}$.'
  - 'Conclusión: La expresión reducida es **$\frac{5}{4}x^2$**.'
  imagen: /static/img/nodos/reduccion-con-coeficientes-fraccionarios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso aritmético requerido para sumar coeficientes fraccionarios con distinto denominador al reducir términos semejantes?
  choices:
  - text: Calcular el mínimo común múltiplo (MCM) de los denominadores para obtener un denominador común
    is_correct: true
  - text: Sumar directamente todos los numeradores y todos los denominadores
    is_correct: false
  - text: Multiplicar las variables entre sí
    is_correct: false
  - text: Eliminar los denominadores de la expresión
    is_correct: false
