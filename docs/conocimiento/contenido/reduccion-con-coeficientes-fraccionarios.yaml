semantic_id: MAT.ALG.REDUCCION_OPERATIVA.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Reducción con coeficientes fraccionarios: procedimiento y reglas
  en Reducción de términos semejantes.'
explicacion_simple: 'Los coeficientes de un término algebraico no siempre son números
  enteros. A veces son fracciones. La buena noticia: la regla de la semejanza no cambia.
  La única diferencia es que la suma de los coeficientes requiere operar con fracciones.'
explicacion_formal: '### Definición formal


  Los denominadores son iguales, sumamos numeradores: $\frac{1+1}{4} = \frac{2}{4}
  = \frac{1}{2}$. Resultado: $\frac{1}{2}m$.


  ### Desarrollo didáctico


  Reduce: $\frac{1}{2}x + \frac{1}{3}x$.


  Ambos son de la familia $x$. Debo sumar los coeficientes $\frac{1}{2}$ y $\frac{1}{3}$.

  Mínimo común denominador (MCD): $6$.

  $\frac{1}{2} = \frac{3}{6}$ y $\frac{1}{3} = \frac{2}{6}$.

  $\frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.

  Resultado: $\frac{5}{6}x$.'
definiciones_clave: '- **Reducción con coeficientes fraccionarios**: Operación o propiedad
  fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a reducción con coeficientes fraccionarios.'
ejemplo_guiado:
  enunciado: Aplica reducción con coeficientes fraccionarios en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de reducción con coeficientes
    fraccionarios.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
