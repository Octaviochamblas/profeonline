semantic_id: MAT.GEO.CIRCULO_TEOREMAS.POTENCIA_PUNTO_CALCULO
resumen_inicial: 'Cálculo de potencia de un punto usando cuerdas, secantes o tangentes:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: 'La potencia de un punto puede calcularse de varias formas equivalentes:
  usando la distancia al centro, o usando los segmentos de cuerdas, secantes o tangentes
  trazadas desde ese punto.'
explicacion_formal: '![Cálculo de la potencia de un punto](/static/img/geometria/circunferencia-circulo/circulo-potencia-punto-calculo.svg)


  ### Definición formal


  Para un punto exterior $P$, la potencia puede calcularse de tres formas equivalentes:
  $\text{pot}(P)=PO^2-r^2$ (usando la distancia al centro), $\text{pot}(P)=PA\times
  PB$ (usando una secante que corta en $A$ y $B$), o $\text{pot}(P)=PT^2$ (usando
  la tangente que toca en $T$). Para un punto interior, la potencia (negativa) se
  calcula como $-(PA\times PB)$ usando dos cuerdas que se cruzan en $P$.


  ### Desarrollo didáctico


  Si un punto $P$ está a 10 cm del centro de una circunferencia de radio 6 cm, su
  potencia es $10^2-6^2=64$. Si además se traza una tangente desde $P$, esta debe
  medir $PT=\sqrt{64}=8$ cm; y si se traza una secante con segmento exterior $PA=4$
  cm, el segmento total debe cumplir $PB=64/4=16$ cm. Los tres métodos son consistentes
  entre sí.'
