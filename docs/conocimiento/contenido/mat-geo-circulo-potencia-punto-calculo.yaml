procedimiento:
- 'Paso 1: Identifica qué información tienes disponible (distancia al centro, segmentos
  de secante/cuerda, o segmento tangente).'
- 'Paso 2: Elige la fórmula correspondiente: PO²-r² (distancia), PA×PB (cuerdas o
  secantes), o PT² (tangente).'
- 'Paso 3: Calcula la potencia y, si es necesario, usa ese valor para encontrar un
  segmento desconocido con otro de los métodos.'
