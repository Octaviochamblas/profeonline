semantic_id: MAT.GEO.AREAS_TRIANGULOS.SEMIPERIM
resumen_inicial: 'Cálculo del semiperímetro de un triángulo: s = (a + b + c) / 2:
  conceptos, teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'Antes de poder calcular el área de un triángulo cuando solo se
  conocen sus tres lados (sin base ni altura directas), es necesario calcular un valor
  intermedio: el semiperímetro.'
explicacion_formal: '![Semiperímetro de un triángulo](/static/img/geometria/areas-pitagoras/areas-triangulos-semiperim.svg)


  ### Definición formal


  Si un triángulo tiene lados $a$, $b$ y $c$, su semiperímetro es $s=\frac{a+b+c}{2}$.


  ### Desarrollo didáctico


  Un triángulo de lados 5, 6 y 7 tiene semiperímetro $s=\frac{5+6+7}{2}=\frac{18}{2}=9$.
  Este valor será fundamental en la fórmula de Herón, estudiada a continuación.'
definiciones_clave: '- **Cálculo del semiperímetro de un triángulo: s = (a + b + c)
  / 2**: Elemento o propiedad fundamental en el estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del semiperímetro de un triángulo:
  s = (a + b + c) / 2.'
ejemplo_guiado:
  enunciado: 'Para analizar cálculo del semiperímetro de un triángulo: s = (a + b
    + c) / 2, considera un ángulo $\alpha = 41^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1010^\circ = 41^\circ$.'
  pasos:
  - 'Identificar la propiedad de cálculo del semiperímetro de un triángulo: s = (a
    + b + c) / 2 referida a $\alpha = 41^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1010 = 41 \implies x = 41 - 1010$.'
  - 'Concluir que la medida calculada para cálculo del semiperímetro de un triángulo:
    s = (a + b + c) / 2 es $x = -969^\circ$.'
