resumen_inicial: 'La distancia real $R$ se calcula multiplicando la distancia dibujada
  en el plano $d$ por el factor denominador de la escala $n$: $R = n \cdot d$.'
explicacion_simple: Para averiguar la medida real de una calle o habitación a partir
  de un dibujo a escala $1:n$, medimos los centímetros con una regla en el papel y
  los multiplicamos por el número $n$ de la escala.
explicacion_formal: 'Dada la distancia representada en la maqueta o plano $d$ y la
  escala de reducción $E = \frac{1}{n}$, la **Longitud Real $R$** se determina mediante
  el despeje inverso:


  $$R = \frac{d}{E} = n \cdot d$$


  **Conversión final de unidades:**

  - El resultado $R$ obtenido en centímetros se debe transformar a metros o kilómetros
  para su correcta interpretación real.'
definiciones_clave: '- **Longitud real $R$**: Distancia verdadera $R = n \cdot d$.'
propiedades_relaciones: '- **Ampliación al mundo real**: Multiplica la medida del
  plano por el denominador de la escala $n$.'
ejemplo_guiado:
  enunciado: 'En un mapa a escala $1 : 25.000$, la distancia entre dos ciudades mide
    $8\text{ cm}$. Calcule la distancia real en kilómetros.'
  pasos:
  - 'Paso 1: Aplicar la fórmula $R = n \cdot d = 25.000 \cdot 8\text{ cm} = 200.000\text{
    cm}$.'
  - 'Paso 2: Convertir centímetros a metros: $200.000 : 100 = 2.000\text{ metros}$.'
  - 'Paso 3: Convertir metros a kilómetros: $2.000 : 1.000 = 2\text{ km}$.'
  - 'Conclusión: La distancia real entre las dos ciudades es $2\text{ km}$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cómo se despeja la distancia real R a partir de la distancia d del plano
    y la escala 1 : n?'
  choices:
  - text: Multiplicando la medida del plano por el denominador de la escala (R = n
      · d)
    is_correct: true
  - text: Dividiendo R = d / n
    is_correct: false
  - text: Restando R = n - d
    is_correct: false
  - text: Sumando R = d + n
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando la medida del plano por el
    denominador de la escala (R = n · d)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para 8 cm a escala 1 : 25.000, ¿cuál fue la distancia
    real obtenida?'
  choices:
  - text: 2 km (o 2.000 m)
    is_correct: true
  - text: 20 km
    is_correct: false
  - text: 200 m
    is_correct: false
  - text: 0,2 km
    is_correct: false
  explanation: La alternativa correcta es '2 km (o 2.000 m)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la longitud real $R =
  n \cdot d$ a partir de la medida $d$ leída en un mapa o plano.
semantic_id: MAT.NUM.REPARTO_ESCALAS.LONGITUD_REAL
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.LONGITUD_REAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
