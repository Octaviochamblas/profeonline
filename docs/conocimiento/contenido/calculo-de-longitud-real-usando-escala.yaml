procedimiento:
- 'Paso 1: Mide con una regla la distancia en el plano (en cm).'
- 'Paso 2: Multiplica esa medida por el factor $E$ de la escala $1:E$.'
- 'Paso 3: El resultado está en centímetros reales. Conviértelo a metros (divide por 100)
  o a km (divide por 100.000).'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de longitud
  real usando escala.
ejemplos:
- titulo: Distancia entre ciudades
  enunciado: En un mapa 1:500.000, dos ciudades están a 4 cm de distancia. ¿Cuál es su distancia
    real?
  solucion_pasos:
  - 'Multiplicamos: $4 \cdot 500.000 = 2.000.000$ cm reales.'
  - 'Convertimos a km: $2.000.000 / 100.000 = 20$ kilómetros.'
  - La distancia real es 20 km.
- titulo: Ejemplo 2
  enunciado: En un mapa 1:100.000, dos ciudades están a 5 cm. ¿Cuál es la distancia real en
    km?
  alternativas:
  - '5'
  - '50'
  - 0,5
  respuesta: '5'
  solucion_pasos:
  - 5 por 100.000 es igual a 500.000 cm; 500.000 dividido entre 100.000 es igual a 5 km.
- titulo: Ejemplo 3
  enunciado: En un plano 1:1.000, una calle mide 8 cm. ¿Cuál es su longitud real en metros?
  alternativas:
  - '80'
  - '8'
  - '800'
  respuesta: '80'
  solucion_pasos:
  - 8 por 1.000 es igual a 8.000 cm; 8.000 dividido entre 100 es igual a 80 m.
- titulo: ¿Para hallar la longitud real se multiplica la medida del plano por el factor E
    de la escala?
  respuesta: Sí
  solucion_pasos:
  - 'Esa es la fórmula: realidad es igual a plano por E.'
errores_frecuentes:
- Creer que el resultado de la multiplicación ya está en kilómetros.
- Dividir por la escala en lugar de multiplicar (hallando medidas microscópicas irreales).
- Equivocarse en los ceros al convertir de centímetros a kilómetros.
- Creer que el resultado de la multiplicación ya está expresado en kilómetros sin haber hecho
  la conversión.
- Dividir por la escala en vez de multiplicar, obteniendo medidas irrealmente pequeñas.
afirmaciones_verdaderas:
- La propiedad de cálculo de longitud real usando escala preserva la consistencia lógica.
- El resultado de multiplicar la medida del plano por el factor E siempre está en la misma
  unidad en que se midió el plano.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de longitud real
  usando escala.
