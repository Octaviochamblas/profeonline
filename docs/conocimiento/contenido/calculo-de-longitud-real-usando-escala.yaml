procedimiento:
- 'Paso 1: Mide con una regla la distancia en el plano (en cm).'
- 'Paso 2: Multiplica esa medida por el factor $E$ de la escala $1:E$.'
- 'Paso 3: El resultado está en centímetros reales. Conviértelo a metros (divide por
  100) o a km (divide por 100.000).'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de
  longitud real usando escala.
ejemplos:
- titulo: Distancia entre ciudades
  enunciado: En un mapa 1:500.000, dos ciudades están a 4 cm de distancia. ¿Cuál es
    su distancia real?
  solucion_pasos:
  - 'Multiplicamos: $4 \cdot 500.000 = 2.000.000$ cm reales.'
  - 'Convertimos a km: $2.000.000 / 100.000 = 20$ kilómetros.'
  - La distancia real es 20 km.
errores_frecuentes:
- Creer que el resultado de la multiplicación ya está en kilómetros.
- Dividir por la escala en lugar de multiplicar (hallando medidas microscópicas irreales).
- Equivocarse en los ceros al convertir de centímetros a kilómetros.
afirmaciones_verdaderas:
- La propiedad de cálculo de longitud real usando escala preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de longitud
