semantic_id: MAT.NUM.REPARTO_ESCALAS.LONGITUD_REAL
resumen_inicial: El cálculo de longitud real a partir de una escala determina la dimensión en el terreno mediante la fórmula $D_{\text{real}} = D_{\text{plano}} \cdot N$, convirtiendo el resultado de centímetros a metros ($\div 100$) o kilómetros ($\div 100.000$).
explicacion_simple: "![Cálculo de longitud real](/static/img/nodos/calculo-de-longitud-real-usando-escala-intro.svg)\n\nPara calcular **cuánto mide en la realidad** un segmento medido con regla en un mapa:\n\n1. **Paso 1: Multiplicar la medida leída en cm por el denominador de la escala ($N$)**:\n$$D_{\\text{real (en cm)}} = D_{\\text{plano (en cm)}} \\cdot N$$\n2. **Paso 2: Convertir los centímetros a una unidad comprensible**:\n   - Para pasar a **metros**: Divide entre $100$ (quita $2$ ceros).\n   - Para pasar a **kilómetros**: Divide entre $100.000$ (quita $5$ ceros).\n- **Ejemplo:** Si dos pueblos están separados por $8\\text{ cm}$ en un mapa $1 : 100.000$:\n  - $D_{\\text{real}} = 8 \\cdot 100.000 = 800.000\\text{ cm}$.\n  - Pasamos a km $\\implies \\frac{800.000}{100.000} = 8\\text{ km}$ en la realidad."
explicacion_formal: 'Sea la escala cartográfica $E = \frac{1}{N}$ y la medida observada en el soporte gráfico $D_{\text{plano}} \in \mathbb{R}^+$.


  **Algoritmo de Extrapolación a Escala Real:**

  1. **Multiplicación Homotética Inversa:**

  $$D_{\text{real}}^{[\text{cm}]} = D_{\text{plano}}^{[\text{cm}]} \cdot N$$

  2. **Normalización a Unidades Geográficas:**

  $$D_{\text{real}}^{[\text{km}]} = \frac{D_{\text{real}}^{[\text{cm}]}}{10^5} = \frac{D_{\text{plano}}^{[\text{cm}]} \cdot N}{100.000}$$

  $$D_{\text{real}}^{[\text{m}]} = \frac{D_{\text{real}}^{[\text{cm}]}}{10^2} = \frac{D_{\text{plano}}^{[\text{cm}]} \cdot N}{100}$$'
definiciones_clave: '- **Longitud real ($D_{\text{real}}$)**: Distancia física en el terreno u objeto tridimensional.

  - **Extrapolación métrica**: Multiplicación por el factor $N$ de reducción.

  - **Normalización de unidades**: Conversión de cm a metros o kilómetros.'
propiedades_relaciones: '- **Ampliación de escala**: La realidad siempre es $N$ veces mayor que la representación gráfica.

  - **Linealidad**: Duplicar la distancia en el papel duplica exactamente la distancia real recorrida.'
ejemplo_guiado:
  enunciado: '![Ejemplos de longitud real](/static/img/nodos/calculo-de-longitud-real-usando-escala-ejemplos.svg)


    Si la distancia entre dos ciudades en un mapa con escala $1 : 100.000$ mide $8\text{ cm}$, ¿cuántos kilómetros las separan en la realidad? Además, en un plano a escala $1 : 75$, una pared mide $6\text{ cm}$, ¿cuál es su largo real en metros?'
  pasos:
  - 'Paso 1: Para las ciudades: Multiplicar por $N = 100.000 \implies 8 \cdot 100.000 = 800.000\text{ cm}$.'
  - 'Paso 2: Convertir a kilómetros: $\frac{800.000}{100.000} = 8\text{ km}$ reales.'
  - 'Paso 3: Para la pared: Multiplicar por $N = 75 \implies 6 \cdot 75 = 450\text{ cm}$.'
  - 'Paso 4: Convertir a metros: $\frac{450}{100} = 4,5\text{ metros}$ reales.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la distancia real a partir de la medida en el mapa?
  choices:
  - text: $D_{\text{real}} = D_{\text{plano (cm)}} \cdot N$ (y luego convertir a m o km)
    is_correct: true
  - text: $D_{\text{real}} = \frac{D_{\text{plano}}}{N}$
    is_correct: false
  - text: $D_{\text{real}} = D_{\text{plano}} + N$
    is_correct: false
  - text: $D_{\text{real}} = \frac{N}{D_{\text{plano}}}$
    is_correct: false
  explanation: La alternativa correcta es '$D_{\text{real}} = D_{\text{plano (cm)}} \cdot N$ (y luego convertir a m o km)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 800.000 cm se convirtieron en 8 km?
  choices:
  - text: Porque 1 km equivale a 100.000 cm, por lo que se divide entre 100.000
    is_correct: true
  - text: Porque se divide entre 100
    is_correct: false
  - text: Porque se le quitan dos ceros
    is_correct: false
  - text: Por una regla de aproximación
    is_correct: false
  explanation: La alternativa correcta es 'Porque 1 km equivale a 100.000 cm, por lo que se divide entre 100.000'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o registrar la distancia en el plano en centímetros $D_{\text{plano}}$.'
- 'Paso 2: Multiplicar por el factor de escala $N$ para obtener la distancia real en centímetros: $D_{\text{real (cm)}} = D_{\text{plano}} \cdot N$.'
- 'Paso 3: Convertir a metros ($\div 100$) o a kilómetros ($\div 100.000$) según el contexto.'
errores_correccion: '- **Error 1: Dejar la respuesta en centímetros sin convertir.** **Cómo corregirlo:** En problemas reales o cartográficos, normalizar siempre a metros o kilómetros.

  - **Error 2: Dividir en vez de multiplicar.** **Cómo corregirlo:** Pasar del plano a la realidad agranda el valor $\implies$ se MULTIPLICA por $N$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'En un mapa $1 : 250.000$, la distancia entre dos cerros es $4\text{ cm}$. ¿Cuántos km hay entre ellos?'
  alternativas:
  - $10\text{ km}$
  - $100\text{ km}$
  - $1\text{ km}$
  respuesta: $10\text{ km}$
  solucion_pasos:
  - $4 \cdot 250.000 = 1.000.000\text{ cm} = 10\text{ km}$.
- titulo: Ejemplo 2
  enunciado: 'En un plano de arquitectura $1 : 20$, una puerta mide $4,5\text{ cm}$ de ancho. ¿Cuál es su ancho real?'
  alternativas:
  - $90\text{ cm}$ ($0,9\text{ m}$)
  - $9\text{ cm}$
  - $900\text{ cm}$
  respuesta: $90\text{ cm}$ ($0,9\text{ m}$)
  solucion_pasos:
  - $4,5 \cdot 20 = 90\text{ cm} = 0,9\text{ metros}$.
- titulo: ¿Se multiplica por N para pasar de la medida en el mapa a la medida real?
  respuesta: Sí
  solucion_pasos:
  - Sí, la medida real es $N$ veces la medida en el dibujo.
  alternativas:
  - texto: Sí, la realidad es N veces más grande que el plano
    es_correcta: true
    retroalimentacion: ¡Correcto! Multiplicación por factor de reducción inverso.
  - texto: No, se divide entre N
    es_correcta: false
    retroalimentacion: Incorrecto, dividir reduciría el tamaño aún más.
  - texto: No, se suma N
    es_correcta: false
    retroalimentacion: Incorrecto, la homotecia es multiplicativa.
- titulo: ¿Se divide entre 100.000 para transformar centímetros a kilómetros?
  respuesta: Sí
  solucion_pasos:
  - Sí, $100.000\text{ cm} = 1\text{ km}$.
  alternativas:
  - texto: Sí, es el factor de conversión exacto
    es_correcta: true
    retroalimentacion: ¡Correcto! Conversión métrica directa.
  - texto: No, se divide entre 1.000
    es_correcta: false
    retroalimentacion: Incorrecto, entre 1.000 pasa de metros a km.
  - texto: No, se multiplica por 100
    es_correcta: false
    retroalimentacion: Incorrecto, multiplicar aumentaría los centímetros.
errores_frecuentes:
- Dividir en lugar de multiplicar por el factor $N$.
- Olvidar convertir la respuesta final de centímetros a metros o kilómetros.
- Equivocarse en la cantidad de ceros al dividir por $100.000$.
- Confundir la escala con una unidad de velocidad o tiempo.
afirmaciones_verdaderas:
- La distancia real se obtiene multiplicando la medida del plano en centímetros por el factor $N$.
- El resultado en centímetros se convierte a metros dividiendo por $100$ o a kilómetros dividiendo por $100.000$.
- La distancia real siempre resulta cuantitativamente mayor que la distancia gráfica en escalas de reducción.
al_terminar_debes_poder: '![Síntesis de cálculo de longitud real](/static/img/nodos/calculo-de-longitud-real-usando-escala-resumen.svg)


  QUÉ: Determinar distancias y dimensiones reales en el terreno a partir de mediciones en mapas o planos.


  CÓMO: Multiplicando la medida gráfica por el denominador de la escala ($D_{\text{real}} = D_{\text{plano}} \cdot N$) y normalizando a metros o kilómetros mediante división por $100$ o $100.000$.'
