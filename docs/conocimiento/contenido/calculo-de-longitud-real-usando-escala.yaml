semantic_id: MAT.NUM.REPARTO_ESCALAS.LONGITUD_REAL
resumen_inicial: 'Cálculo de longitud real usando escala: concepto y propiedades fundamentales
  en Reparto proporcional y escalas.'
explicacion_simple: ¿Alguna vez has puesto una regla sobre un mapa para calcular a cuántos
  kilómetros está una ciudad de otra? Ese acto tan simple encierra la matemática de revertir
  una escala.
explicacion_formal: 'Partiendo de $\frac{\text{Plano}}{\text{Realidad}} = \frac{1}{E}$, si
  despejamos la medida **Real** obtenemos:


  $$\text{Realidad} = \text{Plano} \cdot E$$


  Este cálculo te devolverá un número muy grande, porque estará **en centímetros** (asumiendo
  que mediste el mapa con una regla en cm). Para darle sentido en la vida real, deberás convertirlo:

  - A metros: dividiendo por $100$.

  - A kilómetros: dividiendo por $100.000$.'
definiciones_clave: '- **Cálculo de longitud real usando escala**: Elemento central dentro
  del estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de longitud real usando escala.'
ejemplo_guiado:
  enunciado: En un mapa con escala 1:250.000, dos pueblos están a 6 cm de distancia. ¿Cuál
    es su distancia real en kilómetros?
  pasos:
  - 'Multiplico la medida del plano por el factor E: 6 por 250.000 es igual a 1.500.000 centímetros.'
  - 'Convierto a kilómetros: 1.500.000 dividido entre 100.000 es igual a 15.'
  - Concluyo que la distancia real es de 15 kilómetros.
