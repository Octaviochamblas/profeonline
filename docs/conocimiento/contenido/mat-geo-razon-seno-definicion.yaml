semantic_id: MAT.GEO.TRIG_FUNDAMENTAL.SENO_DEFINICION
resumen_inicial: 'Definición de seno de un ángulo agudo como cateto opuesto sobre
  hipotenusa: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: El seno es una de las tres razones trigonométricas fundamentales,
  y compara el lado 'de enfrente' del ángulo con el lado más largo del triángulo (la
  hipotenusa).
explicacion_formal: '![Definición de seno](/static/img/geometria/trigonometria/trig-seno-definicion.svg)


  ### Definición formal


  En un triángulo rectángulo con ángulo agudo $\theta$, el seno se define como $\sin\theta=\dfrac{\text{cateto
  opuesto}}{\text{hipotenusa}}$, donde el cateto opuesto es el lado que no forma parte
  del ángulo $\theta$, y la hipotenusa es el lado opuesto al ángulo recto.


  ### Desarrollo didáctico


  En la figura, el ángulo $\theta$ está en el vértice $B$. El cateto opuesto a $\theta$
  es el lado $AC$ (vertical), y la hipotenusa es el lado $BC$. Por lo tanto, $\sin\theta=\dfrac{AC}{BC}$.'
definiciones_clave: '- **Definición de seno de un ángulo agudo como cateto opuesto
  sobre hipotenusa**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
