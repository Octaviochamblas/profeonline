procedimiento:
- 'Paso 1: Identifica el ángulo agudo θ en el triángulo rectángulo y ubica el vértice
  donde se encuentra.'
- 'Paso 2: Identifica el cateto opuesto a θ (el lado que no toca ese vértice) y la
  hipotenusa (el lado opuesto al ángulo recto).'
- 'Paso 3: Calcula sinθ como el cociente entre la longitud del cateto opuesto y la
  longitud de la hipotenusa.'
