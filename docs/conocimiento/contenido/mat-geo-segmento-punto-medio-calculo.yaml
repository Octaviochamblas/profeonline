procedimiento:
- 'Paso 1: Suma las abscisas de ambos puntos (x₁+x₂) y divide el resultado entre 2.'
- 'Paso 2: Suma las ordenadas de ambos puntos (y₁+y₂) y divide el resultado entre
  2.'
- 'Paso 3: Escribe el par ordenado resultante como las coordenadas del punto medio
  M.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
