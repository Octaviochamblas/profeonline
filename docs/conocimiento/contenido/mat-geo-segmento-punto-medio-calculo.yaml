semantic_id: MAT.GEO.SEGMENTO_METRICA.PUNTO_MEDIO_CALCULO
resumen_inicial: 'Cálculo de las coordenadas del punto medio de un segmento: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Con la fórmula del punto medio ya conocida, el siguiente paso
  es aplicarla con números concretos para obtener coordenadas precisas.
explicacion_formal: '![Cálculo del punto medio de un segmento](/static/img/geometria/cartesiano-vectores/segmento-punto-medio-calculo.svg)


  ### Definición formal


  Dados $A(-3,-2)$ y $B(4,3)$: $M=\left(\frac{-3+4}{2},\frac{-2+3}{2}\right)=\left(\frac{1}{2},\frac{1}{2}\right)=(0,5;\,0,5)$.


  ### Desarrollo didáctico


  Este procedimiento se repite siempre igual: sumar las abscisas y dividir entre 2,
  sumar las ordenadas y dividir entre 2, sin importar los valores específicos ni sus
  signos.'
