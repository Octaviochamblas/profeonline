procedimiento:
- 'Paso 1: Identifica las dos cuerdas que se intersectan y el punto de intersección
  P.'
- 'Paso 2: Reconoce los dos segmentos en los que P divide a la primera cuerda (PA
  y PB).'
- 'Paso 3: Reconoce los dos segmentos en los que P divide a la segunda cuerda (PC
  y PD).'
