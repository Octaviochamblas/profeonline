semantic_id: MAT.GEO.CIRCULO_TEOREMAS.CUERDAS_SEGMENTOS
resumen_inicial: 'Identificación de segmentos determinados por cuerdas que se intersectan
  dentro de la circunferencia: conceptos, teoremas, propiedades geométricas y cálculo
  en Circunferencia y Círculo.'
explicacion_simple: Cuando dos cuerdas de un círculo se cruzan, el punto de cruce
  divide a cada cuerda en dos segmentos, dando un total de cuatro segmentos por identificar.
explicacion_formal: '![Segmentos determinados por dos cuerdas](/static/img/geometria/circunferencia-circulo/circulo-teorema-cuerdas-segmentos.svg)


  ### Definición formal


  Si las cuerdas $AB$ y $CD$ de una circunferencia se cruzan en un punto interior
  $P$, cada cuerda queda dividida en dos segmentos por el punto $P$: la cuerda $AB$
  en $PA$ y $PB$, y la cuerda $CD$ en $PC$ y $PD$.


  ### Desarrollo didáctico


  En la figura, las cuerdas $AB$ y $CD$ se cruzan en el punto $P$. Los cuatro segmentos
  resultantes ($PA$, $PB$, $PC$, $PD$) son la base para aplicar el teorema de las
  cuerdas, que relaciona sus longitudes mediante un producto.'
definiciones_clave: '- **Identificación de segmentos determinados por cuerdas que
  se intersectan dentro de la circunferencia**: Elemento o propiedad fundamental en
  el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de segmentos determinados por
  cuerdas que se intersectan dentro de la circunferencia.'
