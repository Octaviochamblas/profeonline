procedimiento:
- 'Paso 1: Identifica el valor máximo $M$ y el valor mínimo $m$ del fenómeno.'
- 'Paso 2: Calcula la línea media como $d=(M+m)/2$.'
- 'Paso 3: Interpreta $d$ como el valor de equilibrio del fenómeno.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en interpretación contextual
  de la línea media en un modelo trigonométrico.
ejemplos:
- titulo: Cálculo de la línea media a partir de datos
  enunciado: La altura de una marea varía entre $0{,}5$ m y $2{,}5$ m. Calcula la
    línea media del modelo.
  solucion_pasos:
  - 'Se aplica la fórmula: $d=(0{,}5+2{,}5)/2=1{,}5$.'
  - La línea media es $1{,}5$ metros.
- titulo: Interpretación de la línea media en contexto
  enunciado: Si un modelo de temperatura tiene línea media $18°$C y amplitud $6°$C,
    ¿cuáles son la temperatura máxima y mínima?
  solucion_pasos:
  - 'Se suma y resta la amplitud a la línea media: $18+6=24$ y $18-6=12$.'
  - La temperatura máxima es $24°$C y la mínima es $12°$C.
- titulo: ¿La línea media siempre coincide con uno de los valores observados del fenómeno?
  enunciado: ¿La línea media de un modelo siempre corresponde a un valor efectivamente
    alcanzado por el fenómeno en algún momento?
  respuesta: Sí
  solucion_pasos:
  - La línea media sí se alcanza, en los puntos donde la función cruza su valor promedio.
- titulo: ¿La línea media es siempre igual al promedio aritmético entre máximo y mínimo?
  enunciado: ¿La línea media de un modelo trigonométrico se calcula siempre como el
    promedio aritmético entre el valor máximo y el mínimo?
  respuesta: Sí
  solucion_pasos:
  - Es la fórmula estándar para funciones seno o coseno simétricas alrededor de su
    línea media.
errores_frecuentes:
- Declarar la línea media con la amplitud del modelo.
- No calcular correctamente el promedio entre máximo y mínimo.
- Suponer que la línea media siempre es $0$, sin verificar los datos del contexto.
- Declarar la línea media con el desplazamiento horizontal del modelo.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  interpretación contextual de la línea media en un modelo trigonométrico.
