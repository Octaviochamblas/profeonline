semantic_id: MAT.ALG.FUNC_TRIG_MODELO.INTERPRETACION_LINEA_MEDIA_CONTEXTO
resumen_inicial: 'Interpretación contextual de la línea media $y = D$ como el nivel base de equilibrio o valor promedio constante del fenómeno.'
explicacion_simple: |
  En problemas del mundo real, el término **$D$** (la línea media) representa el **estado de equilibrio o valor promedio** del fenómeno a lo largo del tiempo. Si estás midiendo la temperatura de una ciudad durante un año, la línea media es la temperatura promedio anual. Si estás midiendo el nivel de agua en una represa, es el nivel promedio del embalse. La oscilación sube por encima de la línea media durante las crestas y baja por debajo durante los valles.
explicacion_formal: |
  ### Definición formal
  En un modelo trigonométrico contextual $y(t) = A\sin(Bt + C) + D$ o $y(t) = A\cos(Bt + C) + D$, el parámetro **$D \in \mathbb{R}$** representa la **línea media (o estado de equilibrio)**, definida formalmente como el valor medio integral o promedio aritmético de las cotas extremas del proceso:
  $$D = \frac{y_{\max} + y_{\min}}{2}$$

  ### Desglose simbólico
  - Unidades físicas: Posee las **mismas unidades de medida** que la variable dependiente de salida $y$.
  - Eje de simetría horizontal: La gráfica pasa exactamente el mismo tiempo por encima de la recta $y = D$ que por debajo de ella en cada ciclo completo.

  ### Síntesis didáctica
  La línea media da el "nivel base" alrededor del cual ocurren todas las oscilaciones. Es la recta horizontal a partir de la cual se mide la amplitud $+|A|$ hacia arriba y $-|A|$ hacia abajo.
definiciones_clave: |
  - **Línea media contextual ($y = D$)**: Nivel de equilibrio promedio alrededor del cual oscila la variable dependiente.
  - **Valor promedio anual / diario**: Promedio aritmético continuo registrado en un período de oscilación completo.
  - **Eje de simetría de fluctuación**: Recta de referencia respecto a la cual las desviaciones superiores e inferiores son idénticas en magnitud.
propiedades_relaciones: |
  - **Cálculo de extremos reales**: Conociendo la línea media $D$ y la amplitud $|A|$, los extremos contextuales son $y_{\max} = D + |A|$ e $y_{\min} = D - |A|$.
  - **Invariancia temporal**: El valor de la línea media $D$ permanece constante a lo largo del tiempo si no intervienen factores externos de tendencia.
ejemplo_guiado:
  enunciado: 'El número de clientes que ingresa a un centro comercial en el instante de tiempo $t$ (en horas) se modela mediante $N(t) = 150\sin\left(\frac{\pi}{6}t\right) + 400$. Interpreta el significado contextual del número $400$.'
  pasos:
    - 'Paso 1: Identificar el término constante fuera del seno: $D = 400$.'
    - 'Paso 2: Reconocer que la recta $y = 400$ es la línea media del modelo.'
    - 'Paso 3: Identificar la amplitud del modelo: $|A| = 150$.'
    - 'Paso 4: Redactar la interpretación contextual: El número promedio de clientes en el centro comercial es de $400$ personas. Durante las horas de mayor afluencia el número sube a $550$ ($400+150$) y en las horas de menor afluencia baja a $250$ ($400-150$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la profundidad de agua en un canal varía entre $2$ metros y $8$ metros, ¿cuál es el valor y el significado de la línea media $D$?'
    choices:
      - {text: '$D = 5$ metros, representando la profundidad promedio del agua en el canal', is_correct: true}
      - {text: '$D = 3$ metros, representando la amplitud de la marea', is_correct: false}
      - {text: '$D = 6$ metros, representando la diferencia total de profundidad', is_correct: false}
      - {text: '$D = 10$ metros, representando la profundidad máxima posible', is_correct: false}
    explanation: 'La alternativa correcta es ''$D = 5$ metros, representando la profundidad promedio del agua en el canal''. Calculando el promedio: $D = \frac{8 + 2}{2} = 5$ metros.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el modelo de temperatura $T(t) = -6\cos\left(\frac{\pi}{12}t\right) + 18$, ¿cuál es la temperatura promedio del ambiente?'
    choices:
      - {text: '$18^\circ\text{C}$', is_correct: true}
      - {text: '$12^\circ\text{C}$', is_correct: false}
      - {text: '$24^\circ\text{C}$', is_correct: false}
      - {text: '$6^\circ\text{C}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$18^\circ\text{C}$''. El parámetro $D = 18$ fija la temperatura promedio de equilibrio en $18^\circ\text{C}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término constante $D$ de la función trigonométrica de contexto.'
  - 'Paso 2: O bien, calcular el promedio $D = \frac{y_{\max} + y_{\min}}{2}$ a partir de los datos dados.'
  - 'Paso 3: Asignar a $D$ las unidades físicas de la variable de salida.'
  - 'Paso 4: Redactar la interpretación declarando que $D$ es el estado de equilibrio o promedio del fenómeno.'
errores_correccion: |
  - **Error 1:** Confundir la línea media con el valor mínimo del fenómeno. **Cómo corregirlo:** El valor mínimo es $D - |A|$; la línea media $D$ está ubicada en el centro exacto entre el máximo y el mínimo.
  - **Error 2:** Creer que la línea media cambia en cada hora del día. **Cómo corregirlo:** La línea media $D$ es una constante fija que representa la tendencia central continua de todo el ciclo.
ejemplos:
  - titulo: 'Nivel medio de voltaje'
    enunciado: 'En la corriente alterna $V(t) = 170\sin(120\pi t) + 0$, ¿cuál es el voltaje promedio?'
    alternativas:
      - '$0$ voltios'
      - '$170$ voltios'
      - '$340$ voltios'
    respuesta: '$0$ voltios'
    solucion_pasos:
      - '1. $D = 0$.'
      - '2. El voltaje de equilibrio promedio es de $0$ voltios.'
  - titulo: 'Presión arterial media'
    enunciado: 'Si una presión oscila entre $80$ mmHg y $120$ mmHg, ¿cuál es la línea media $D$?'
    alternativas:
      - '$100$ mmHg'
      - '$40$ mmHg'
      - '$20$ mmHg'
    respuesta: '$100$ mmHg'
    solucion_pasos:
      - '1. Promedio $= \frac{120 + 80}{2} = 100$ mmHg.'
      - '2. La línea media de la presión es $100$ mmHg.'
  - titulo: 'Unidades de la línea media'
    enunciado: '¿La línea media en un modelo de ventas mensuales expresado en millones de pesos se mide en millones de pesos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, conserva las unidades físicas de la variable dependiente de salida.'
  - titulo: 'Centro de oscilación'
    enunciado: '¿El tiempo que la variable pasa por encima de la línea media es igual al tiempo que pasa por debajo en un ciclo completo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, dada la simetría de la función senoidal respecto a su línea media.'
errores_frecuentes:
  - 'La afirmación de que la línea media representa el valor máximo alcanzado por el fenómeno.'
  - 'La afirmación de que la línea media se mide en unidades temporales como horas o días.'
  - 'La afirmación de que la línea media de cualquier proceso físico debe ser siempre igual a cero.'
  - 'La afirmación de que la línea media altera el tiempo que tarda la onda en completar un período.'
  - 'La afirmación de que la línea media se obtiene restando la amplitud del valor mínimo.'
afirmaciones_verdaderas:
  - 'La línea media $y = D$ en un modelo trigonométrico representa el nivel de equilibrio o valor promedio constante alrededor del cual oscila la variable estudiada.'
  - 'La línea media se calcula como el promedio aritmético entre el valor máximo y el valor mínimo del fenómeno $D = \frac{y_{\max} + y_{\min}}{2}$ y se expresa en sus mismas unidades físicas.'
al_terminar_debes_poder: |
  QUÉ: Interpretar el significado físico y contextual de la línea media $D$ en fenómenos reales.
  CÓMO: Explicar $D$ como el valor promedio o nivel de equilibrio del sistema a partir de la fórmula o del cálculo $\frac{y_{\max} + y_{\min}}{2}$.
