semantic_id: MAT.ALG.FUNC_TRIG_MODELO.INTERPRETACION_LINEA_MEDIA_CONTEXTO
resumen_inicial: 'Interpretación contextual de la línea media en un modelo trigonométrico:
  círculo unitario, amplitud, período y transformaciones de Modelamiento trigonométrico
  y extensiones.'
explicacion_simple: La línea media de un modelo aplicado representa el punto de equilibrio
  alrededor del cual oscila el fenómeno estudiado.
explicacion_formal: '### Definición formal


  Si un fenómeno alcanza un valor máximo $M$ y un valor mínimo $m$, la línea media
  del modelo correspondiente es $d=(M+m)/2$. Representa el nivel de equilibrio del
  fenómeno, ni máximo ni mínimo.


  ### Desarrollo didáctico


  Si la temperatura de una ciudad varía entre $10°$C y $30°$C, la línea media es $(10+30)/2=20°$C:
  la temperatura promedio del ciclo, alrededor de la cual oscila con amplitud $10°$C.'
definiciones_clave: '- **Interpretación contextual de la línea media en un modelo
  trigonométrico**: Función periódica fundamentada en las coordenadas del círculo
  unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a interpretación contextual de la línea media en un modelo trigonométrico.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    interpretación contextual de la línea media en un modelo trigonométrico.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de interpretación contextual de la línea media en un modelo
    trigonométrico.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
