semantic_id: MAT.FUND.LOGICA_BASICA.PROPOSICION_SIMPLE
resumen_inicial: 'Identificación de proposiciones simples o atómicas caracterizadas por expresar una sola idea indivisible sin conectivos lógicos ni negaciones.'
explicacion_simple: |
  Una **proposición simple** (o atómica) es el tipo más básico de proposición: expresa una sola afirmación directa y no contiene conectores lógicos (como "y", "o", "si... entonces") ni la palabra "no". Por ejemplo, "El número $7$ es primo" o "$12 > 5$" son proposiciones simples porque no se pueden dividir en oraciones más pequeñas sin que pierdan su sentido. Son los bloques fundamentales con los que se construyen razonamientos más complejos.
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, una **proposición simple (o atómica)** es una fórmula bien formada que carece de operadores o conectivos lógicos proposicionales:
  $$p \in \mathcal{P}_{\text{atómica}} \implies p \text{ no contiene elementos del conjunto de conectivos } \{\neg, \land, \lor, \to, \leftrightarrow, \oplus\}$$
  y posee una estructura predicativa mínima indivisible formada por un sujeto y un predicado o por una relación entre elementos.

  ### Desglose simbólico
  - Proposiciones predicativas simples: Atribuyen una propiedad a un único objeto (ej. $p$: "$11$ es impar").
  - Proposiciones relacionales simples: Expresan una relación indivisible entre dos o más objetos (ej. $q$: "$5 < 9$", $r$: "$A$ es paralela a $B$").
  - Simbolización: Se denotan convencionalmente mediante letras minúsculas $p, q, r, s, t$.

  ### Síntesis didáctica
  Una proposición es simple si al intentar descomponerla en oraciones independientes no se obtienen dos o más afirmaciones completas con sentido propio.
definiciones_clave: |
  - **Proposición simple / atómica**: Enunciado declarativo básico carente de conectores lógicos y de negación.
  - **Proposición relacional**: Proposición simple que vincula dos entidades mediante una relación indivisible (como "$a < b$" o "Juan y María son hermanos").
  - **Operador de negación ($\neg$)**: Conectivo unario que al aplicarse sobre una proposición simple la transforma formalmente en compuesta ($\neg p$).
propiedades_relaciones: |
  - **Indivisibilidad lógica**: Toda proposición simple posee exactamente una asignación atómica de valor de verdad en la tabla de verdad ($2^1 = 2$ filas).
  - **La negación genera compuestos**: La presencia de un "no" o "es falso que" convierte a la proposición en compuesta ($\neg p$).
ejemplo_guiado:
  enunciado: 'Determina si cada enunciado es una proposición simple o compuesta: 1) "$18$ es múltiplo de $3$", 2) "$18$ es múltiplo de $3$ y de $6$", 3) "El número $18$ no es primo".'
  pasos:
    - 'Paso 1: Analizar "$18$ es múltiplo de $3$": Expresa una única afirmación indivisible sin conectores lógicos ni negación. Es una **proposición simple**.'
    - 'Paso 2: Analizar "$18$ es múltiplo de $3$ y de $6$": Contiene la conjunción "y" que enlaza dos proposiciones ("$18$ es múltiplo de $3$" y "$18$ es múltiplo de $6$"). Es una **proposición compuesta**.'
    - 'Paso 3: Analizar "El número $18$ no es primo": Contiene el operador lógico de negación "no". En lógica matemática la negación es un conectivo, por lo que es una **proposición compuesta**.'
    - 'Paso 4: Concluir que solo el primer enunciado es una proposición simple atómica.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de los siguientes enunciados corresponde a una proposición simple (atómica)?'
    choices:
      - {text: 'El número $23$ es un número primo', is_correct: true}
      - {text: 'El número $23$ es primo y es impar', is_correct: false}
      - {text: 'El número $23$ no es un número par', is_correct: false}
      - {text: 'Si un número termina en $0$, entonces es divisible por $5$', is_correct: false}
    explanation: 'La alternativa correcta es ''El número $23$ es un número primo''. Es una afirmación única sin conectivos ni negación.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la afirmación "El triángulo $ABC$ no es equilátero" no es una proposición simple?'
    choices:
      - {text: 'Porque contiene el conectivo lógico de negación "no"', is_correct: true}
      - {text: 'Porque es una afirmación matemáticamente falsa', is_correct: false}
      - {text: 'Porque los triángulos tienen tres lados', is_correct: false}
      - {text: 'Porque carece de un valor de verdad definido', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque contiene el conectivo lógico de negación "no"''. La negación es un operador lógico que estructura proposiciones compuestas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que la expresión es una proposición con valor de verdad definido ($V$ o $F$).'
  - 'Paso 2: Buscar conectivos lógicos binarios ("y", "o", "entonces", "si y solo si").'
  - 'Paso 3: Buscar operadores de negación ("no", "nunca", "es falso que").'
  - 'Paso 4: Si no contiene ningún conectivo ni operador de negación y expresa una sola idea, clasificarla como proposición simple.'
errores_correccion: |
  - **Error 1:** Clasificar proposiciones que contienen "no" como simples debido a su brevedad. **Cómo corregirlo:** La negación es un conectivo lógico unario ($\neg p$); por lo tanto, cualquier proposición negada es formalmente una proposición compuesta.
  - **Error 2:** Confundir conjunciones gramaticales relacionales con conectores lógicos. **Cómo corregirlo:** En frases como "Las rectas $L_1$ y $L_2$ son paralelas", la "y" une términos de una relación indivisible, constituyendo una proposición simple.
ejemplos:
  - titulo: 'Proposición simple aritmética'
    enunciado: '¿Es el enunciado "$12 + 5 = 17$" una proposición simple?'
    alternativas:
      - 'Sí, es una proposición simple'
      - 'No, el signo $+$ es un conectivo lógico'
      - 'No, es una proposición compuesta'
    respuesta: 'Sí, es una proposición simple'
    solucion_pasos:
      - '1. El signo $+$ es un operador aritmético, no un conectivo lógico.'
      - '2. La igualdad afirma una única relación entre dos cantidades.'
  - titulo: 'Proposición con conector lógico'
    enunciado: '¿Es "$4$ es par o $4$ es primo" una proposición simple?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, contiene la disyunción "o", que une dos proposiciones simples.'
  - titulo: 'Relación geométrica simple'
    enunciado: '¿Es "El segmento $AB$ es perpendicular al segmento $CD$" una proposición simple?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, establece una relación geométrica directa e indivisible entre dos segmentos.'
  - titulo: 'Proposición negada'
    enunciado: '¿Es "El cero no es un número positivo" una proposición simple?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la presencia de la negación "no" la convierte formalmente en una proposición compuesta.'
errores_frecuentes:
  - 'La afirmación de que una proposición que contiene la palabra "no" se clasifica como una proposición simple.'
  - 'La afirmación de que los operadores aritméticos como la suma $+$ actúan como conectivos lógicos proposicionales.'
  - 'La afirmación de que las proposiciones relacionales como $x < y$ son proposiciones compuestas.'
  - 'La afirmación de que una proposición simple extensa en palabras se convierte automáticamente en compuesta.'
  - 'La afirmación de que las proposiciones simples carecen de valor de verdad antes de combinarse.'
afirmaciones_verdaderas:
  - 'Una proposición simple o atómica es una afirmación declarativa indivisible que no contiene conectivos lógicos ni operadores de negación.'
  - 'La aplicación del operador unario de negación $\neg$ sobre una proposición simple genera formalmente una proposición compuesta.'
al_terminar_debes_poder: |
  QUÉ: Identificar y diferenciar proposiciones simples (atómicas) de proposiciones compuestas.
  CÓMO: Verificar la ausencia de conectivos lógicos ($\land, \lor, \to, \leftrightarrow$) y del operador de negación ($\neg$) en una afirmación indivisible.
