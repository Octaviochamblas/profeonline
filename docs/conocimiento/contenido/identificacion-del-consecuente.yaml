semantic_id: MAT.NUM.RAZONES.CONSECUENTE
resumen_inicial: El consecuente es el segundo término de una razón (el denominador
  en $\frac{a}{b}$ o el número a la derecha en $a:b$, con $b \neq 0$).
explicacion_simple: 'En la expresión de una razón $a:b$:

  - El número de abajo o de la derecha ($b$) es el **consecuente**.

  - Actúa como el patrón de referencia contra el cual se compara el antecedente.

  Ejemplo: En la razón $3:8$, el consecuente es el $8$.'
explicacion_formal: En la razón geométrica $a:b = \frac{a}{b}$, el elemento $b \in
  \mathbb{R} \setminus \{0\}$ recibe el nombre de consecuente. Cumple el rol de divisor
  en el cociente.
definiciones_clave: '- **Consecuente ($b$)**: Segundo término de la razón ubicado
  en el denominador.'
propiedades_relaciones: '- **Restricción de no nulidad**: El consecuente no puede
  ser cero ($b \neq 0$).'
ejemplo_guiado:
  enunciado: Indica el consecuente de la razón entre 6 y 15.
  pasos:
  - 'Escribir la razón respetando el orden dado: $6:15$.'
  - 'Identificar el segundo término (a la derecha): 15.'
  - Concluir que el consecuente es 15.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el consecuente en la razón $2:7$?
  choices:
  - text: '7'
    is_correct: true
  - text: '2'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: 'La correcta es: 7. El segundo término de la razón es el consecuente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la razón $\frac{10}{23}$, ¿cuál es el consecuente?
  choices:
  - text: '23'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '33'
    is_correct: false
  - text: '13'
    is_correct: false
  explanation: 'La correcta es: 23. El denominador de la fracción es el consecuente.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la razón en notación $a:b$ o $\frac{a}{b}$.'
- 'Paso 2: Extraer el segundo término o el denominador de la fracción.'
errores_correccion: No olvides que el consecuente nunca puede ser igual a cero.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el consecuente en $5:12$?
  alternativas:
  - '12'
  - '5'
  - '17'
  respuesta: '12'
  solucion_pasos:
  - El segundo término es 12.
errores_frecuentes:
- Confundir el consecuente con el antecedente.
afirmaciones_verdaderas:
- El consecuente es el denominador no nulo de la razón.
al_terminar_debes_ponder: Identificar el consecuente en razones numéricas y algebraicas.
fuente: Texto escolar MINEDUC.
estado: publicado
