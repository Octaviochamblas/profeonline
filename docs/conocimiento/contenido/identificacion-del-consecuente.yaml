semantic_id: MAT.NUM.RAZONES.CONSECUENTE
resumen_inicial: 'El consecuente de una razón $a : b$ o $\frac{a}{b}$ es el segundo término de la relación, ubicado en el denominador de la fracción o a la derecha del signo de dos puntos ($b \neq 0$).'
explicacion_simple: |
  En cualquier razón matemática, el número de referencia con el que se compara se llama **consecuente**. En la fracción $\frac{a}{b}$, el consecuente es el número de abajo ($b$). En la notación $a : b$, es el número situado a la derecha ($b$). Por ejemplo, en la razón $5 : 8$, el consecuente es el 8. Representa la unidad o base sobre la cual estamos midiendo al antecedente.
explicacion_formal: |
  ### Definición formal
  En la estructura analítica de una razón geométrica $r = \frac{a}{b} = a : b$:
  - El **consecuente** es el divisor o término inferior de referencia:
    $$\text{Consecuente} = b \quad (b \in \mathbb{R} \setminus \{0\})$$

  ### Restricción de existencia
  Por las propiedades del cuerpo de los números reales, la división por cero no está definida, por lo que **el consecuente jamás puede ser igual a cero ($b \neq 0$)**.

  ### Rol en el cálculo del valor de la razón
  El consecuente actúa como el divisor o patrón de medida. Al despejar la relación:
  $$b = \frac{a}{r} \quad (r \neq 0)$$
  demostrando que el consecuente es igual al cociente entre el antecedente y el valor de la razón.

  ### Identificación lingüística en problemas verbales
  En enunciados del tipo *"La razón de $X$ a $Y$ es..."*, la cantidad correspondiente a la referencia **$Y$** es el **consecuente**.

  ### Síntesis didáctica
  - Posición en fracción $\frac{a}{b}$: Denominador $b$.
  - Posición en puntos $a : b$: Segundo término (derecha) $b$.
definiciones_clave: |
  - **Consecuente**: Segundo elemento de una razón que actúa como base de referencia o divisor.
  - **Divisor de la razón**: Cantidad cuantitativa no nula ($b \neq 0$) entre la cual se divide el antecedente.
  - **Término de referencia**: Magnitud patrón sobre la cual se evalúa la proporción del antecedente.
propiedades_relaciones: |
  - **Variación inversamente proporcional**: Si el antecedente se mantiene constante, el valor de la razón varía en forma inversamente proporcional al aumento del consecuente.
  - **Cálculo del consecuente**: Si se conoce el antecedente $a$ y el valor de la razón $r$, el consecuente se calcula como $b = \frac{a}{r}$.
ejemplo_guiado:
  enunciado: 'En la razón expresada por $7 : 12$, identifica el consecuente y halla su valor numérico si el antecedente es 21 y el valor de la razón se mantiene constante.'
  pasos:
    - 'Paso 1: Identificamos la posición del segundo término en $7 : 12$.'
    - 'Paso 2: Concluimos que el **consecuente es 12** (y el antecedente es 7).'
    - 'Paso 3: Calculamos el valor constante de la razón $r = \frac{7}{12}$.'
    - 'Paso 4: Para un nuevo antecedente $a = 21$, despejamos el nuevo consecuente $b = \frac{a}{r} = \frac{21}{7/12} = 21 \cdot \frac{12}{7} = 3 \cdot 12 = 36$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué restricción analítica fundamental se exige sobre el consecuente $b$ en toda razón $a : b$?'
    choices:
      - {text: 'Que sea estrictamente distinto de cero ($b \neq 0$), porque la división por cero no está definida', is_correct: true}
      - {text: 'Que sea estrictamente mayor que el antecedente ($b > a$)', is_correct: false}
      - {text: 'Que sea un número entero positivo únicamente', is_correct: false}
      - {text: 'Que sea igual a 1 en todos los casos', is_correct: false}
    explanation: 'La alternativa correcta es ''Que sea estrictamente distinto de cero ($b \neq 0$), porque la división por cero no está definida''. El consecuente ocupa el divisor, por lo que $b \neq 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la razón representada por la fracción $\frac{18}{25}$, ¿cuál es el número que actúa como consecuente?'
    choices:
      - {text: '$25$, que se ubica en el denominador de la fracción', is_correct: true}
      - {text: '$18$, por ser el numerador', is_correct: false}
      - {text: '$43$, sumando ambos números', is_correct: false}
      - {text: '$0.72$, dividiendo $18 / 25$', is_correct: false}
    explanation: 'La alternativa correcta es ''$25$, que se ubica en el denominador de la fracción''. El denominador de la fracción es el consecuente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer la expresión de la razón en su notación de puntos $a : b$ o fraccionaria $\frac{a}{b}$.'
  - 'Paso 2: Ubicar el número situado en el denominador o a la derecha del signo de dos puntos.'
  - 'Paso 3: Declarar dicho número como el consecuente de la razón.'
  - 'Paso 4: Comprobar que cumpla la condición de ser distinto de cero ($b \neq 0$).'
errores_correccion: |
  - **Error 1:** Confundir el consecuente con el antecedente (ej: afirmar que en $4 : 9$ el consecuente es 4). **Cómo corregirlo:** El consecuente siempre es el **SEGUNDO número (a la derecha)** o el número de **ABAJO (denominador)**.
  - **Error 2:** Permitir que el consecuente sea igual a cero (ej: escribir una razón como $5 : 0$). **Cómo corregirlo:** La división entre cero **no existe** en matemáticas; el consecuente debe ser siempre un número real distinto de cero ($b \neq 0$).
ejemplos:
  - titulo: 'Identificación en par de puntos'
    enunciado: 'En la razón $11 : 20$, ¿el consecuente es el número $20$?'
    alternativas:
      - 'Sí, por ser el segundo término'
      - 'No, es el 11'
      - 'No, es el cociente'
    respuesta: 'Sí, por ser el segundo término'
    solucion_pasos:
      - '1. Ubicamos el término a la derecha de la relación $11 : 20$.'
      - '2. Concluimos que el consecuente es 20.'
  - titulo: 'Identificación en enunciado de escala'
    enunciado: 'En un plano con escala $1 : 100$, ¿el consecuente es $100$ indicando la medida real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El segundo número es la medida real de referencia (consecuente).'
  - titulo: 'Consecuente fraccionario'
    enunciado: 'En la razón $3 : 0.5$, ¿el consecuente es el número decimal $0.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ocupa el segundo término y es distinto de cero.'
  - titulo: 'Despeje de consecuente'
    enunciado: 'Si el antecedente es $a = 30$ y la razón es $r = 5$, ¿el consecuente es $b = 6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $b = a / r = 30 / 5 = 6$.'
errores_frecuentes:
  - 'Identificar el numerador o primer término como el consecuente de la razón.'
  - 'Utilizar el número cero como consecuente en una razón matemática.'
  - 'El consecuente es numéricamente idéntico al valor final de la razón $r$.'
  - 'El consecuente está restringido a números enteros positivos excluyendo números decimales o fraccionarios.'
  - 'Restar el consecuente al antecedente para determinar la diferencia entre magnitudes.'
afirmaciones_verdaderas:
  - 'El consecuente de una razón es el segundo término $b$ situado en el denominador de $\frac{a}{b}$ o a la derecha de $a : b$, con $b \neq 0$.'
  - 'El consecuente se calcula dividiendo el antecedente por el valor de la razón ($b = \frac{a}{r}$).'
al_terminar_debes_poder: 'Identificar y calcular el consecuente $b$ de una razón $a : b$ aplicando la restricción $b \neq 0$.'
