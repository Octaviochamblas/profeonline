resumen_inicial: 'El consecuente de una razón $a : b$ o $\frac{a}{b}$ es el segundo
  término nombrado o denominador respecto al cual se realiza la comparación ($b \neq
  0$).'
explicacion_simple: El consecuente es el número que va segundo en la razón (a la derecha
  de los dos puntos o abajo en la fracción). Sirve como base o referencia para comparar
  el primer número.
explicacion_formal: 'En la razón $r = \frac{a}{b} = a : b$, el **Consecuente $b$**
  es el divisor de la comparación:


  $$b = \text{Consecuente} \in \mathbb{R} \setminus \{0\}$$


  **Restricción indispensable:**

  - El consecuente $b$ debe ser estrictamente distinto de cero ($b \neq 0$) para que
  la razón por cociente esté matemáticamente definida.'
definiciones_clave: '- **Consecuente**: Segundo término $b$ en la razón $a : b$ o
  denominador en $\frac{a}{b}$ ($b \neq 0$).'
propiedades_relaciones: '- **Divisor de la razón**: Funciona como unidad de patrón
  de referencia.'
ejemplo_guiado:
  enunciado: 'En la razón $4 : 7$, identifique el consecuente y explique su función.'
  pasos:
  - 'Paso 1: Observar el segundo término situado tras los dos puntos: el número $7$.'
  - 'Paso 2: Verificar la función: $7$ es el consecuente que actúa como referencia
    divisor.'
  - 'Conclusión: El consecuente es $7$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué posición y condición cumple el consecuente b en la razón a : b?'
  choices:
  - text: Es el segundo término (denominador) y debe ser distinto de cero (b != 0)
    is_correct: true
  - text: Es el numerador y puede ser cero
    is_correct: false
  - text: Es la resta de los términos
    is_correct: false
  - text: Es el resultado entero
    is_correct: false
  explanation: La alternativa correcta es 'Es el segundo término (denominador) y debe
    ser distinto de cero (b != 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para la razón 4 : 7, ¿cuál es el consecuente?'
  choices:
  - text: '7'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: 4/7
    is_correct: false
  - text: '11'
    is_correct: false
  explanation: La alternativa correcta es '7'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: 'Al terminar serás capaz de identificar el consecuente $b$
  en cualquier razón $a : b = \frac{a}{b}$, verificando que sea distinto de cero.'
semantic_id: MAT.NUM.RAZONES.CONSECUENTE
procedimiento:
- 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la comparación por
  cociente.'
- 'Paso 2: Calcular el valor de la razón $k = a / b$ o aplicar las propiedades de
  series de razones.'
- 'Paso 3: Simplificar y expresar la respuesta en términos del problema planteado.'
errores_correccion: '- **Error 1: Confundir la comparación por cociente con la comparación
  por diferencia (resta).** **Cómo corregirlo:** La razón matemática es multiplicativa
  por división ($a/b$), no por resta ($a-b$).


  - **Error 2: Invertir el orden entre antecedente y consecuente.** **Cómo corregirlo:**
  Respetar estrictamente el orden nombrado en el enunciado ($a:b$ pone a $a$ arriba
  y a $b$ abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAZONES.CONSECUENTE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de razones.
- titulo: Ejemplo 2
  enunciado: Verificación de la relación proporcional.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por cociente.
- titulo: ¿Es el consecuente de una razón siempre distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división por cero.
- titulo: ¿Se conserva la constante k al sumar antecedentes y consecuentes en una
    serie?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de las series de razones.
errores_frecuentes:
- Calcular la razón entre dos magnitudes mediante la resta de sus valores numéricos.
- Invertir la posición del antecedente y del consecuente alterando el valor escalar
  de la razón.
- Utilizar el número cero como el consecuente de una razón matemática.
- La constante de la razón $k$ en una serie de razones cambia al sumar los antecedentes.
- Sumar directamente los términos de la razón sin multiplicar por la constante $k$.
afirmaciones_verdaderas:
- 'Una razón es la comparación por cociente $a : b = \frac{a}{b}$ entre dos magnitudes
  con $b \neq 0$.'
- En una serie de razones iguales $\frac{a}{b} = \frac{c}{d} = k$, la razón entre
  la suma de antecedentes y la suma de consecuentes equivale a $k$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
