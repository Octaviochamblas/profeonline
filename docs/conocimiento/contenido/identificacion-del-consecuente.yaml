semantic_id: MAT.NUM.RAZONES.CONSECUENTE
resumen_inicial: 'El consecuente de una razón $a : b$ o $\frac{a}{b}$ es el segundo término nombrado (el divisor o denominador), que actúa como la unidad de referencia de la comparación ($b \neq 0$).'
explicacion_simple: '![Identificación del consecuente](/static/img/nodos/identificacion-del-consecuente-intro.svg)


  En cualquier razón $a : b$:

  - El **consecuente** es el número que va **segundo** (o **abajo** en la fracción).

  - Es la **base de referencia** con la que comparamos el antecedente.

  - **¡El consecuente NUNCA puede ser cero ($b \neq 0$)!**

  - Ejemplo: En la razón de aciertos a fallos $8 : 15$, el consecuente es **$15$** (los fallos).

  - Si invertimos la pregunta y pedimos «fallos a aciertos», el consecuente pasa a ser **$8$**.'
explicacion_formal: 'Dada una razón geométrica $r = \frac{a}{b}$ con $a, b \in \mathbb{R}$, se define formalmente como **consecuente** al elemento:


  $$b = \operatorname{Cons}(r) \in \mathbb{R} \setminus \{0\}$$


  correspondiente al divisor o denominador de la operación cociente.


  **Propiedad de Despeje:**

  Conociendo el antecedente $a$ y el valor de la razón $k = \frac{a}{b}$ ($k \neq 0$), el consecuente se calcula unívocamente mediante:

  $$b = \frac{a}{k}$$'
definiciones_clave: '- **Consecuente ($b$)**: Segundo término de la razón ($b \neq 0$).

  - **Divisor / Denominador**: Término inferior que actúa como patrón de medida.

  - **Restricción no nula**: Condición indispensable $b \neq 0$ para la existencia de la razón.'
propiedades_relaciones: '- **Despeje algebraico**: $b = \frac{a}{k}$.

  - **Base relativa**: Si el consecuente se duplica manteniendo fijo el antecedente, el valor de la razón se reduce a la mitad.'
ejemplo_guiado:
  enunciado: '![Ejemplos de consecuente](/static/img/nodos/identificacion-del-consecuente-ejemplos.svg)


    Identifique el consecuente en la razón de aciertos a fallos $8 : 15$, y luego en la razón inversa de fallos a aciertos.'
  pasos:
  - 'Paso 1: Para aciertos a fallos ($8 : 15$): El segundo término nombrado son los fallos $\implies$ Consecuente = $15$.'
  - 'Paso 2: En forma fraccionaria $\frac{8}{15}$, el denominador inferior es $15$.'
  - 'Paso 3: Para fallos a aciertos ($15 : 8$): La referencia cambió a los aciertos $\implies$ Consecuente = $8$.'
  - 'Conclusión: Los consecuentes respectivos son $15$ y $8$ según el orden de comparación.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el consecuente en la razón $\frac{11}{20}$?
  choices:
  - text: $20$ (el denominador o segundo término)
    is_correct: true
  - text: $11$
    is_correct: false
  - text: $31$
    is_correct: false
  - text: $0,55$
    is_correct: false
  explanation: La alternativa correcta es '$20$ (el denominador o segundo término)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué puede el consecuente ser mayor que el antecedente?
  choices:
  - text: Porque el consecuente representa la magnitud de referencia, sin importar su tamaño
    is_correct: true
  - text: Porque los números negativos no existen en las razones
    is_correct: false
  - text: Porque siempre se divide por números pares
    is_correct: false
  - text: Porque las razones son siempre mayores a 1
    is_correct: false
  explanation: La alternativa correcta es 'Porque el consecuente representa la magnitud de referencia, sin importar su tamaño'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la segunda magnitud o término que se menciona en la comparación.'
- 'Paso 2: En la expresión $a : b$ o $\frac{a}{b}$, ubicar el número tras los dos puntos o en el denominador.'
- 'Paso 3: Verificar que el consecuente sea estrictamente distinto de cero ($b \neq 0$).'
errores_correccion: '- **Error 1: Asumir que el consecuente puede ser cero ($5 : 0$).** **Cómo corregirlo:** La división por cero está matemáticamente indefinida; el consecuente debe ser $b \neq 0$.

  - **Error 2: Tomar el primer número como consecuente por estar acostumbrado a fracciones propias.** **Cómo corregirlo:** El consecuente es SIEMPRE el segundo término, sin importar si es mayor o menor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Cuál es el consecuente en la razón $3 : 7$?'
  alternativas:
  - $7$
  - $3$
  - $10$
  respuesta: $7$
  solucion_pasos:
  - El segundo término tras los dos puntos es $7$.
- titulo: Ejemplo 2
  enunciado: Si el antecedente es $30$ y el valor de la razón es $k = 5$, ¿cuál es el consecuente?
  alternativas:
  - $6$
  - $150$
  - $25$
  respuesta: $6$
  solucion_pasos:
  - $b = \frac{a}{k} = \frac{30}{5} = 6$.
- titulo: ¿Puede el consecuente de una razón ser un número decimal?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por ejemplo en la razón $3 : 1,5 = 2$.'
  alternativas:
  - texto: Sí, puede ser cualquier real no nulo
    es_correcta: true
    retroalimentacion: ¡Correcto! Admite decimales siempre que $b \neq 0$.
  - texto: No, debe ser un entero estrictamente positivo
    es_correcta: false
    retroalimentacion: Incorrecto, las razones admiten decimales.
  - texto: No, los decimales solo van en el numerador
    es_correcta: false
    retroalimentacion: Incorrecto, pueden ir en cualquier término.
- titulo: ¿Está definida una razón con consecuente igual a 0?
  respuesta: 'No'
  solucion_pasos:
  - No, la división por cero no está definida en ningún conjunto numérico real.
  alternativas:
  - texto: No, está indefinida porque no se puede dividir por cero
    es_correcta: true
    retroalimentacion: ¡Correcto! Restricción $b \neq 0$.
  - texto: Sí, el resultado es 0
    es_correcta: false
    retroalimentacion: Incorrecto, $a / 0$ no da cero ni existe en $\mathbb{R}$.
  - texto: Sí, el resultado es infinito
    es_correcta: false
    retroalimentacion: Incorrecto, no es un valor numérico real.
errores_frecuentes:
- Permitir consecuente igual a cero.
- Confundir la posición del consecuente con el antecedente.
- Invertir la fórmula de cálculo ($b = a \cdot k$ en vez de $b = a / k$).
- Creer que el consecuente solo puede ser un número entero.
afirmaciones_verdaderas:
- 'El consecuente es el segundo término de la razón $a : b$ o el denominador de $\frac{a}{b}$.'
- El consecuente debe ser siempre distinto de cero ($b \neq 0$).
- 'Se calcula dividiendo el antecedente por el valor de la razón: $b = \frac{a}{k}$.'
al_terminar_debes_poder: '![Síntesis de consecuente](/static/img/nodos/identificacion-del-consecuente-resumen.svg)


  QUÉ: Identificar, verificar y calcular el consecuente de una razón matemática.


  CÓMO: Seleccionando el segundo término o denominador $b \neq 0$ en $a : b$, o despejándolo mediante la relación $b = \frac{a}{k}$ a partir del antecedente y el valor de la razón.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
