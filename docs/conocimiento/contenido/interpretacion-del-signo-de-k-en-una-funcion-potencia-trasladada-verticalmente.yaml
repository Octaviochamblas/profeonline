semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.SIGNO_TRASLACION_VERTICAL
resumen_inicial: 'La interpretación del signo de $k$ en una función potencia $f(x) = ax^n + k$ establece una correspondencia directa entre el signo algebraico de la constante y la orientación del desplazamiento vertical: $k > 0$ eleva la curva hacia $+Y$, mientras que $k < 0$ la desciende hacia $-Y$.'
explicacion_simple: "![La interpretación del signo de $k$ en una función potencia $f(x) = ax^n + k$ establece una correspondencia directa entre el signo algebraico de la constante y la orientación del desplazamiento vertical: $k > 0$ eleva la curva hacia $+Y$, mientras que $k < 0$ la desciende hacia $-Y$](/static/img/nodos/interpretacion-del-signo-de-k-en-una-funcion-potencia-trasladada-verticalmente-intro.svg)\n\n\nA diferencia de lo que ocurría con la $h$ horizontal, **en el eje vertical los signos son totalmente intuitivos y directos**:\n\n- **Si $k$ es POSITIVO ($+k$):** La gráfica **SUBE** en $k$ unidades hacia las alturas positivas del eje $Y$.\n- **Si $k$ es NEGATIVO ($-k$):** La gráfica **BAJA** en $|k|$ unidades hacia las profundidades negativas del eje $Y$.\n- **Efecto en las soluciones (raíces):**\n  - Si tienes $y = x^2 - 4$ (bajó 4), la gráfica ahora **cruza el eje $X$ en dos puntos** ($x = \\pm 2$).\n  - Si tienes $y = x^2 + 4$ (subió 4), la gráfica queda flotando arriba y\
  \ **NO cruza jamás el eje $X$**."
explicacion_formal: 'Sea $f(x) = ax^n + k$ con $a \in \mathbb{R}^*$ y $n \in \mathbb{Z}^*$.

  La aplicación del operador traslación vertical sobre las alturas satisface:

  $$\forall x \in \operatorname{Dom}(f): \quad g(x) = ax^n + k$$

  1. Si $k > 0$: $\forall x, \; g(x) > ax^n$, lo que produce una traslación en el sentido del vector unitario positivo $\hat{j} = (0, 1)$, alejando el vértice del eje $X$ hacia el semiplano superior.

  2. Si $k < 0$: $\forall x, \; g(x) < ax^n$, lo que produce una traslación en el sentido de $-\hat{j} = (0, -1)$, desplazando el vértice hacia el semiplano inferior.


  **Existencia de raíces reales en funciones pares ($n$ par, $a > 0$)**:

  - Si $k < 0$: $ax^n + k = 0 \implies x^n = -k/a > 0 \implies 2$ raíces reales $x = \pm \sqrt[n]{-k/a}$.

  - Si $k > 0$: $x^n = -k/a < 0 \implies 0$ raíces reales (sin corte con el eje $X$).'
definiciones_clave: '- **Sentido canónico directo**: Correspondencia de orden donde $\operatorname{sgn}(k)$ coincide con la dirección del vector de traslación.

  - **Discriminante de corte en $X$**: Análisis del signo de $-k/a$ para determinar si la curva intersecta al eje de abscisas.'
propiedades_relaciones: '- **Cortes con el eje $X$**: Para funciones pares con $a > 0$, bajar la función ($k < 0$) crea dos raíces reales; subirla ($k > 0$) elimina los cortes con $X$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación del signo de $k$ en una función potencia $f(x) = ax^n + k$ establece una correspondencia directa entre el signo algebraico de la constante y la orientación del desplazamiento vertical: $k > 0$ eleva la curva hacia $+Y$, mientras que $k < 0$ la desciende hacia $-Y$](/static/img/nodos/interpretacion-del-signo-de-k-en-una-funcion-potencia-trasladada-verticalmente-ejemplos.svg)



    Analiza el signo de $k$ y determina si la curva corta al eje $X$ para:

    1) $f(x) = x^4 - 16$

    2) $g(x) = x^4 + 16$'
  pasos:
  - 'Paso 1: Para $f(x) = x^4 - 16$:

    - $k = -16 < 0 \implies$ Desplazamiento **hacia ABAJO en 16 unidades**.

    - Cortes con $X$: $x^4 - 16 = 0 \implies x^4 = 16 \implies x = \pm 2$. **Corta al eje $X$ en $(-2, 0)$ y $(2, 0)$**.'
  - 'Paso 2: Para $g(x) = x^4 + 16$:

    - $k = +16 > 0 \implies$ Desplazamiento **hacia ARRIBA en 16 unidades**.

    - Cortes con $X$: $x^4 + 16 = 0 \implies x^4 = -16$ (Imposible en $\mathbb{R}$). **NO corta al eje $X$**.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la función $f(x) = x^6 + k$ no intersecta al eje X, ¿qué condición debe cumplir k sabiendo que el vértice está en el semiplano superior?
  choices:
  - text: k > 0
    is_correct: true
  - text: k < 0
    is_correct: false
  - text: k = 0
    is_correct: false
  - text: k ≤ -1
    is_correct: false
  explanation: La alternativa correcta es 'k > 0'. Al ser $k > 0$, el mínimo de la curva es $y = k > 0$, por lo que la gráfica se mantiene estrictamente sobre el eje X sin tocarlo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántas intersecciones con el eje X tiene la curva $f(x) = 2x^4 - 32$?
  choices:
  - text: 2 intersecciones (en x = 2 y x = -2)
    is_correct: true
  - text: 0 intersecciones
    is_correct: false
  - text: 1 intersección
    is_correct: false
  - text: 4 intersecciones
    is_correct: false
  explanation: La alternativa correcta es '2 intersecciones (en x = 2 y x = -2)'. Como $k = -32 < 0$, $2x^4 = 32 \implies x^4 = 16 \implies x = \pm 2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el signo algebraico del término independiente $k$.'
- 'Paso 2: Si $k > 0$, interpretar como desplazamiento vertical ascendente (hacia arriba).'
- 'Paso 3: Si $k < 0$, interpretar como desplazamiento vertical descendente (hacia abajo).'
- 'Paso 4: Resolver $ax^n + k = 0$ para encontrar los puntos de corte con el eje $X$ si existen.'
errores_correccion: '- **Error común:** Pensar que $+k$ baja la gráfica porque $(x - h)$ mueve a la derecha.

  - **Cómo corregirlo:** La inversión de signos **solo ocurre en el eje X**. En el eje Y, **$+k$ sube y $-k$ baja** de forma 100% directa.'
ejemplos:
- titulo: 'Ejemplo 1: Dirección positiva'
  enunciado: 'En $f(x) = x^3 + 25$, la gráfica se desplazó:'
  alternativas:
  - 25 unidades hacia arriba
  - 25 unidades hacia abajo
  - 25 unidades a la derecha
  - 25 unidades a la izquierda
  respuesta: 25 unidades hacia arriba
  solucion_pasos:
  - 'Paso 1: $k = +25 \implies$ 25 unidades hacia arriba.'
- titulo: 'Ejemplo 2: Dirección negativa'
  enunciado: 'En $g(x) = 5x^4 - 40$, la gráfica se desplazó:'
  alternativas:
  - 40 unidades hacia abajo
  - 40 unidades hacia arriba
  - 40 unidades a la izquierda
  - 5 unidades hacia abajo
  respuesta: 40 unidades hacia abajo
  solucion_pasos:
  - 'Paso 1: $k = -40 \implies$ 40 unidades hacia abajo.'
- titulo: 'Ejemplo 3: Cortes con eje X por k negativo'
  enunciado: 'Halla los cortes con el eje X de $y = x^2 - 49$:'
  alternativas:
  - x = 7 y x = -7
  - Solo x = 7
  - x = 49 y x = -49
  - No corta al eje X
  respuesta: x = 7 y x = -7
  solucion_pasos:
  - 'Paso 1: $x^2 = 49 \implies x = \pm 7$.'
- titulo: 'Ejemplo 4: Ausencia de cortes con eje X'
  enunciado: ¿Por qué $y = x^6 + 1$ no corta al eje X?
  alternativas:
  - Porque x⁶ + 1 = 0 no tiene solución real (x⁶ = -1)
  - Porque el exponente es 6
  - Porque corta al eje Y
  - Sí corta en x = -1
  respuesta: Porque x⁶ + 1 = 0 no tiene solución real (x⁶ = -1)
  solucion_pasos:
  - 'Paso 1: $x^6 \ge 0 \implies x^6 + 1 \ge 1 > 0$ para todo $x$.'
errores_frecuentes:
- Invertir la dirección de la traslación vertical creyendo que opera como la horizontal.
- Asumir que todas las funciones trasladadas verticalmente cortan al eje X.
- Olvidar considerar el signo de a al analizar la existencia de raíces reales.
afirmaciones_verdaderas:
- Un valor k > 0 traslada la gráfica hacia arriba y k < 0 hacia abajo de forma directa.
- En funciones pares con a > 0, un término k < 0 genera dos interceptos reales con el eje X.
al_terminar_debes_poder: '**QUÉ:** Interpretar el signo de k y su impacto geométrico en una función potencia trasladada verticalmente.


  **CÓMO:** Asociando sgn(k) con la dirección de traslación y resolviendo axⁿ + k = 0 para hallar posibles intersecciones con el eje X.


