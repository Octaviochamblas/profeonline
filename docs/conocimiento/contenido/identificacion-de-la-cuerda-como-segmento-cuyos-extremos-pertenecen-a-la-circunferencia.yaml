semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CUERDA
resumen_inicial: Una cuerda es cualquier segmento de recta cuyos dos extremos pertenecen a la circunferencia.
explicacion_simple: 'Si marcas dos puntos cualesquiera sobre el borde de una circunferencia (por ejemplo, el punto $A$ y el punto $B$) y tomas una regla para unirlos con una línea recta por dentro, habrás dibujado una **cuerda**.


  A diferencia del radio (que empieza en el centro y va al borde), la cuerda va **de un borde a otro borde**. Una cuerda común no pasa por el centro. Si una cuerda mide mucho, estará cerca del centro; si mide poco, estará arrinconada cerca de la orilla. La regla fundamental es: **ninguna cuerda puede medir más que el diámetro** ($L \le 2r$).


  ![Identificación de la cuerda](/static/img/nodos/identificacion-de-la-cuerda-como-segmento-cuyos-extremos-pertenecen-a-la-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal de cuerda

  Sea $\mathcal{C}$ una circunferencia euclidiana de centro $O$ y radio $r$. Se define una **cuerda** como cualquier segmento de recta $\overline{AB}$ cuyos extremos pertenecen a la circunferencia:

  $$\overline{AB} \text{ es cuerda} \iff A, B \in \mathcal{C}$$


  ### Teorema fundamental de la mediatriz de la cuerda

  La recta mediatriz $\mathcal{M}$ de cualquier cuerda $\overline{AB}$ pasa necesariamente por el centro $O$ de la circunferencia. Como corolario directo:

  1. La recta que pasa por el centro y es perpendicular a una cuerda, **biseca a la cuerda** en dos mitades congruentes ($AM = MB = \frac{AB}{2}$).

  2. La recta que pasa por el centro y por el punto medio de una cuerda es estrictamente perpendicular a ella.


  ### Relación métrica con Pitágoras (Distancia cuerda-centro)

  Al trazar la perpendicular desde el centro $O$ hasta el punto medio $M$ de una cuerda de longitud $L$, se forma un triángulo rectángulo de hipotenusa $r$, cateto base $L/2$ y cateto altura $d$ (distancia del centro a la cuerda):

  $$r^2 = d^2 + \left(\frac{L}{2}\right)^2 \implies d = \sqrt{r^2 - \left(\frac{L}{2}\right)^2}$$


  > **Complemento didáctico:** El triángulo rectángulo que forman el centro $O$, el punto medio de la cuerda y un extremo de la cuerda ($d$, $L/2$, $r$) es una de las figuras más repetidas en la PAES. Con Pitágoras $r^2 = d^2 + (L/2)^2$ calculas cualquiera de los tres datos conociendo los otros dos.

  '
definiciones_clave: '- **Cuerda**: Segmento rectilíneo que conecta dos puntos de una circunferencia.

  - **Distancia del centro a la cuerda ($d$)**: Longitud del segmento perpendicular trazado desde el centro hasta la cuerda.

  - **Punto medio de la cuerda**: Punto que divide a la cuerda en dos segmentos iguales de medida $L/2$.

  '
propiedades_relaciones: '- **Acotación de longitud**: Toda cuerda satisface $0 < \text{long}(AB) \le 2r$.

  - **Relación distancia-longitud**: A menor distancia del centro ($d$), mayor es la longitud de la cuerda ($L$). Si $d = 0$, la cuerda es máxima (diámetro).

  - **Cuerdas congruentes**: Dos cuerdas tienen la misma longitud si y solo si equidistan del centro ($d_1 = d_2$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de cuerda](/static/img/nodos/identificacion-de-la-cuerda-como-segmento-cuyos-extremos-pertenecen-a-la-circunferencia-ejemplos.svg)


    En una circunferencia de radio $r = 10\text{ cm}$, se traza una cuerda de longitud $L = 16\text{ cm}$. Calcula la distancia perpendicular desde el centro $O$ hasta dicha cuerda.'
  pasos:
  - 'Paso 1: Identificar la mitad de la cuerda: La perpendicular que viene del centro biseca la cuerda: $L / 2 = 16 / 2 = 8\text{ cm}$.'
  - 'Paso 2: Reconocer el triángulo rectángulo interior: La hipotenusa es el radio $r = 10\text{ cm}$, un cateto es la semirecta de la cuerda $8\text{ cm}$ y el otro cateto es la distancia buscada $d$.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras: $d^2 + 8^2 = 10^2 \implies d^2 + 64 = 100$.'
  - 'Paso 4: Despejar la distancia $d$: $d^2 = 100 - 64 = 36 \implies d = \sqrt{36} = 6\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué efecto tiene sobre una cuerda la recta perpendicular trazada desde el centro de la circunferencia?
  choices:
  - text: La divide exactamente en dos segmentos congruentes (la biseca).
    is_correct: true
  - text: La divide en una razón de 2 a 1.
    is_correct: false
  - text: La prolonga convirtiéndola en secante exterior.
    is_correct: false
  - text: La hace paralela al diámetro más cercano.
    is_correct: false
  explanation: La alternativa correcta es 'La divide exactamente en dos segmentos congruentes (la biseca).' Por el Teorema de la Mediatriz, el radio perpendicular biseca siempre a la cuerda.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una cuerda dista 4 cm del centro de una circunferencia de radio 5 cm, ¿cuánto mide la cuerda completa?
  choices:
  - text: 6 cm.
    is_correct: true
  - text: 3 cm.
    is_correct: false
  - text: 8 cm.
    is_correct: false
  - text: 10 cm.
    is_correct: false
  explanation: La alternativa correcta es '6 cm.' Por Pitágoras, el semicateto es $\sqrt{5^2 - 4^2} = \sqrt{9} = 3$ cm. La cuerda completa mide $2 \times 3 = 6$ cm.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar los dos extremos $A$ y $B$ sobre la circunferencia.

  2. Unir ambos puntos mediante un segmento rectilíneo.

  3. Si se requiere relacionar con el centro, trazar la distancia perpendicular $d$ hacia el punto medio de la cuerda.

  4. Aplicar el Teorema de Pitágoras con el radio como hipotenusa: $r^2 = d^2 + (L/2)^2$.

  '
errores_correccion: '- **Error común 1:** Confundir una cuerda con una recta secante. **Corrección:** La cuerda es un segmento acotado que termina en la circunferencia; la recta secante es infinita y continúa hacia el exterior.

  - **Error común 2:** Olvidar duplicar el semieje al calcular la cuerda con Pitágoras. **Corrección:** El cateto hallado es $L/2$, por lo que la cuerda total es $2 \times (L/2)$.

  '
ejemplos:
- tipo: A
  titulo: Cuerda y radio congruente
  enunciado: Si una cuerda mide lo mismo que el radio de la circunferencia ($L = r$), ¿cuál es el ángulo que subtiende desde el centro?
  alternativas:
  - text: $60^\circ$.
    is_correct: true
  - text: $90^\circ$.
    is_correct: false
  - text: $45^\circ$.
    is_correct: false
  - text: $120^\circ$.
    is_correct: false
  explicacion: Al tener lados $r, r, r$, se forma un triángulo equilátero cuyos ángulos interiores miden todos $60^\circ$.
- tipo: B
  titulo: Cuerda mayor que diámetro
  enunciado: ¿Puede existir en una circunferencia una cuerda cuya longitud sea estrictamente mayor que el diámetro?
  respuesta: 'No'
  explicacion: No. El diámetro es la cuerda de longitud máxima posible ($L_{\max} = 2r$).
errores_frecuentes:
- '''Confundir el arco (curva) con la cuerda (segmento recto).'''
- '''Olvidar dividir entre 2 la cuerda al armar el triángulo rectángulo con Pitágoras.'''
- '''Creer que todas las cuerdas pasan por el centro de la circunferencia.'''
afirmaciones_verdaderas:
- '''Una cuerda es un segmento cuyos extremos pertenecen a la circunferencia.'''
- '''El radio perpendicular a una cuerda la corta en su punto medio exacto.'''
- '''Toda cuerda satisface la desigualdad $L \le 2r$, alcanzando la igualdad únicamente en el diámetro.'''
al_terminar_debes_poder: '**QUÉ:** Identificar cuerdas y resolver problemas métricos de distancias al centro y longitudes en la circunferencia.


  **CÓMO:** Utilizando el Teorema de Pitágoras en el triángulo rectángulo $r^2 = d^2 + (L/2)^2$.


