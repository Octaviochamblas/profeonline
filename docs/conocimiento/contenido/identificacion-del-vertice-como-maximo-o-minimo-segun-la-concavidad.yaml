semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.MAXIMO_MINIMO
resumen_inicial: 'Identificación del vértice como máximo o mínimo según la concavidad:
  parábola, vértice, concavidad y formas de El vértice, el eje de simetría y el recorrido.'
explicacion_simple: Antes de calcular el vértice, ya se puede anticipar si será el
  punto más alto o más bajo de toda la curva, simplemente observando el signo de $a$.
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2+bx+c$: si $a>0$, la función es cóncava hacia arriba y su vértice
  es un mínimo global, es decir, $f(x) \geq f(x_v)$ para todo $x$; si $a<0$, la función
  es cóncava hacia abajo y su vértice es un máximo global, es decir, $f(x) \leq f(x_v)$
  para todo $x$.


  ### Desarrollo didáctico


  Antes de calcular el valor exacto del vértice, conviene identificar primero si se
  busca un máximo o un mínimo, observando únicamente el signo de $a$; esto ayuda a
  interpretar correctamente el resultado obtenido.


  Para $f(x)=-5x^2+10x+3$, con $a=-5<0$: el vértice será un máximo, el mayor valor
  que puede alcanzar la función.'
definiciones_clave: '- **Identificación del vértice como máximo o mínimo según la
  concavidad**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  identificación del vértice como máximo o mínimo según la concavidad.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando identificación
    del vértice como máximo o mínimo según la concavidad.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a identificación
    del vértice como máximo o mínimo según la concavidad.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
