semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.MAXIMO_MINIMO
resumen_inicial: La identificación del vértice como máximo o mínimo relaciona el signo de $a$ con el valor extremo absoluto $y_v$.
explicacion_simple: |
  Para saber si el vértice representa el **punto más alto (máximo)** o el **punto más bajo (mínimo)** de la parábola:

  - **Cóncava hacia arriba ($a > 0$, positiva $\cup$)**:
    - La parábola tiene forma de valle o copa.
    - El vértice es su piso: la función alcanza su **VALOR MÍNIMO GLOBAL**.
    - La función decrece a la izquierda del vértice y crece a la derecha.
  - **Cóncava hacia abajo ($a < 0$, negativa $\cap$)**:
    - La parábola tiene forma de colina o montaña.
    - El vértice es su cumbre: la función alcanza su **VALOR MÁXIMO GLOBAL**.
    - La función crece a la izquierda del vértice y decrece a la derecha.
explicacion_formal: |
  Sea $f(x) = ax^2 + bx + c$ definida en $\mathbb{R}$ con vértice $V(h, k)$. El **criterio del signo del coeficiente principal $a$** clasifica el extremo global:

  $$\text{Extremo Global de } f = \begin{cases} \text{Mínimo Absoluto en } V(h, k) & \text{si } a > 0 \\ \text{Máximo Absoluto en } V(h, k) & \text{si } a < 0 \end{cases}$$

  **Variación y Monotonía de la función cuadrática:**
  1. Si $a > 0$: $f$ es estrictamente decreciente en $(-\infty, h]$ y estrictamente creciente en $[h, +\infty)$.
  2. Si $a < 0$: $f$ es estrictamente creciente en $(-\infty, h]$ y estrictamente decreciente en $[h, +\infty)$.
definiciones_clave: |
  - **Máximo / Mínimo global**: Extremo absoluto $y_v = k$ alcanzado en la abscisa del vértice $x_v = h$ que limita el recorrido de la función cuadrática.
propiedades_relaciones: |
  - **Relación con la optimización**: En los problemas aplicados de optimización (costos mínimos, ingresos máximos, áreas máximas), la solución corresponde a evaluar la coordenada conveniente del vértice.
ejemplo_guiado:
  enunciado: 'Determina si la función $f(x) = -4x^2 + 16x - 7$ posee un valor máximo o mínimo, indica en qué punto ocurre y calcula dicho valor.'
  pasos:
    - 'Paso 1: Identificar $a = -4$. Como $a < 0$, la parábola se abre hacia abajo, por lo que posee un **máximo global**.'
    - 'Paso 2: Calcular la abscisa del vértice: $h = -\frac{16}{2(-4)} = 2$.'
    - 'Paso 3: Calcular la ordenada del vértice: $k = f(2) = -4(2)^2 + 16(2) - 7 = -16 + 32 - 7 = 9$.'
    - 'Paso 4: Concluir que el valor máximo es $y = 9$ y se alcanza en $x = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una función cuadrática presenta coeficiente cuadrático $a = 3$, ¿qué tipo de valor extremo posee su vértice?'
    choices:
      - {text: 'Un valor mínimo absoluto en su vértice', is_correct: true}
      - {text: 'Un valor máximo absoluto en su vértice.', is_correct: false}
      - {text: 'Un punto de inflexión sin extremo.', is_correct: false}
      - {text: 'No posee valor extremo en los números reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''Un valor mínimo absoluto en su vértice''. Como $a = 3 > 0$, la parábola es cóncava hacia arriba.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada la función $f(x) = -2(x - 5)^2 + 12$, ¿cuál es el valor máximo que puede alcanzar esta función?'
    choices:
      - {text: 'El valor máximo es $12$', is_correct: true}
      - {text: 'El valor máximo es $5$.', is_correct: false}
      - {text: 'El valor máximo es $-2$.', is_correct: false}
      - {text: 'El valor máximo es $-12$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor máximo es $12$''. En la forma canónica $a(x-h)^2 + k$, como $a = -2 < 0$, el máximo es $k = 12$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer el coeficiente $a$ de la función y observar su signo.'
  - 'Paso 2: Si $a > 0$, clasificar el vértice como mínimo; si $a < 0$, clasificar el vértice como máximo.'
  - 'Paso 3: Calcular las coordenadas del vértice $V(h, k)$.'
  - 'Paso 4: Declarar que el valor extremo (máximo o mínimo) es $y = k$ y se produce cuando la variable toma el valor $x = h$.'
errores_correccion: |
  - **Error común:** Decir que si $a > 0$ la función tiene un "máximo" porque el signo es positivo.
  - **Cómo corregirlo:** Recuerda la carita feliz $\cup$: el punto bajo está al fondo, por lo que **$a > 0$ SIGNIFICA MÍNIMO**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Mínimo en función cuadrática mónica.
    alternativas:
      - 'Mínimo global igual a -4 en x = 3'
      - 'Máximo global igual a -4 en x = 3'
      - 'Mínimo global igual a 3 en x = -4'
    respuesta: 'Mínimo global igual a -4 en x = 3'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Máximo en modelo cinemático.
    alternativas:
      - 'Máximo global igual a 45 metros en t = 3 s'
      - 'Mínimo global igual a 45 metros en t = 3 s'
      - 'Máximo en t = 0'
    respuesta: 'Máximo global igual a 45 metros en t = 3 s'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Asociar erróneamente un coeficiente cuadrático positivo $a > 0$ con la presencia de un máximo en la parábola.'
  - 'La equiparación del valor del máximo o mínimo ($y_v$) con la posición en que ocurre dicho valor ($x_v$).'
  - 'Afirmar que una función cuadrática puede tener simultáneamente un punto máximo y un punto mínimo en su gráfica.'
  - 'La creencia de que el valor extremo viene dado únicamente por el término independiente $c$.'
  - 'Ignorar que el cambio de concavidad altera por completo la condición de óptimo en problemas aplicados.'
afirmaciones_verdaderas:
  - 'Una función cuadrática posee un mínimo absoluto en su vértice si $a > 0$ y un máximo absoluto si $a < 0$.'
  - 'El valor numérico del máximo o mínimo corresponde a la ordenada $k = f(h)$, mientras que la abscisa $h$ indica dónde se alcanza.'
al_terminar_debes_poder: |
  QUÉ: Identificar y clasificar el vértice como máximo o mínimo absoluto según la concavidad de la parábola.
  CÓMO: Analizar el signo de $a$, calcular $V(h, k)$, establecer el carácter de máximo o mínimo y distinguir $h$ de $k$.
