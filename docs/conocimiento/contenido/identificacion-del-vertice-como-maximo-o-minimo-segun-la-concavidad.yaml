procedimiento:
- 'Paso 1: Identifica el signo del coeficiente $a$ de la función.'
- 'Paso 2: Si $a>0$, concluye que el vértice es un mínimo.'
- 'Paso 3: Si $a<0$, concluye que el vértice es un máximo.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en identificación del vértice como máximo o mínimo
  según la concavidad.
ejemplos:
- titulo: Identificación de un mínimo
  enunciado: ¿El vértice de $f(x)=4x^2-9x+2$ es un máximo o un mínimo?
  solucion_pasos:
  - $a=4>0$.
  - Es un mínimo.
- titulo: Identificación de un máximo
  enunciado: ¿El vértice de $f(x)=-x^2+6x-1$ es un máximo o un mínimo?
  solucion_pasos:
  - $a=-1<0$.
  - Es un máximo.
- titulo: ¿Un mínimo local puede existir en una función cuadrática además del vértice?
  enunciado: ¿Un mínimo local puede existir en una función cuadrática además del vértice?
  respuesta: 'No'
  solucion_pasos:
  - El vértice es el único punto extremo de toda la parábola; no existen otros máximos
    o mínimos locales.
- titulo: ¿Se puede determinar si el vértice es máximo o mínimo sin calcular sus coordenadas?
  enunciado: ¿Se puede determinar si el vértice es máximo o mínimo sin calcular sus
    coordenadas?
  respuesta: Sí
  solucion_pasos:
  - Basta con observar el signo del coeficiente $a$, sin necesidad de calcular el
    vértice completo.
errores_frecuentes:
- Invertir la interpretación del signo de $a$, confundiendo máximo con mínimo.
- Asumir que toda función cuadrática tiene un mínimo, sin considerar el caso $a<0$.
- Calcular el vértice completo cuando solo se pregunta si es máximo o mínimo.
- Confundir "máximo global" con "máximo local", cuando en una función cuadrática son
  equivalentes.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  identificación del vértice como máximo o mínimo según la concavidad.
