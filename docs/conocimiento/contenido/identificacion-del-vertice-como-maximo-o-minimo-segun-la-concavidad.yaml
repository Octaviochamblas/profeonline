semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.MAXIMO_MINIMO
resumen_inicial: 'La identificación del vértice como máximo o mínimo absoluto se deduce del signo de $a$: si $a > 0$ la parábola es cóncava hacia arriba y el vértice es un punto mínimo absoluto, mientras que si $a < 0$ es cóncava hacia abajo y el vértice es un punto máximo absoluto.'
explicacion_simple: "![La identificación del vértice como máximo o mínimo absoluto se deduce del signo de $a$: si $a > 0$ la parábola es cóncava hacia arriba y el vértice es un punto mínimo absoluto, mientras que si $a < 0$ es cóncava hacia abajo y el vértice es un punto máximo absoluto](/static/img/nodos/identificacion-del-vertice-como-maximo-o-minimo-segun-la-concavidad-intro.svg)\n\n\nPara saber si el vértice es una cima (máximo) o un pozo (mínimo), solo tienes que mirar el signo de $a$:\n\n- **Si $a > 0$ (Positivo):**\n  - Las ramas suben hacia arriba ($\\cup$).\n  - El vértice es el piso más hondo: es un **MÍNIMO ABSOLUTO**.\n  - La función nunca bajará de ese valor: $f(x) \\ge y_v$.\n- **Si $a < 0$ (Negativo):**\n  - Las ramas caen hacia abajo ($\\cap$).\n  - El vértice es la cumbre más alta: es un **MÁXIMO ABSOLUTO**.\n  - La función nunca superará ese valor: $f(x) \\le y_v$."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ con $f(x) = ax^2 + bx + c$ ($a \\neq 0$). Por el criterio de la segunda derivada en el punto crítico $x_v = -\\frac{b}{2a}$:\n$$f''(x_v) = 2a$$\n\n**Teorema de Clasificación de Extremos Globales**:\n1. **Condición de Mínimo Global Absoluto**:\n   $$a > 0 \\implies f''(x_v) > 0 \\implies V(x_v, y_v) \\text{ es un mínimo global estricto}$$\n   $$\\forall x \\in \\mathbb{R}: \\quad f(x) \\ge f(x_v) = y_v$$\n2. **Condición de Máximo Global Absoluto**:\n   $$a < 0 \\implies f''(x_v) < 0 \\implies V(x_v, y_v) \\text{ es un máximo global estricto}$$\n   $$\\forall x \\in \\mathbb{R}: \\quad f(x) \\le f(x_v) = y_v$$"
definiciones_clave: '- **Mínimo absoluto global**: Cota inferior estricta alcanzada por la función en todo su dominio $\mathbb{R}$.

  - **Máximo absoluto global**: Cota superior estricta alcanzada por la función en todo su dominio $\mathbb{R}$.'
propiedades_relaciones: '- **Unicidad del extremo**: Toda función cuadrática posee exactamente un único extremo absoluto en todo $\mathbb{R}$.

  - **Relación con problemas de optimización**: Maximizar ganancias requiere $a < 0$; minimizar costos requiere $a > 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación del vértice como máximo o mínimo absoluto se deduce del signo de $a$: si $a > 0$ la parábola es cóncava hacia arriba y el vértice es un punto mínimo absoluto, mientras que si $a < 0$ es cóncava hacia abajo y el vértice es un punto máximo absoluto](/static/img/nodos/identificacion-del-vertice-como-maximo-o-minimo-segun-la-concavidad-ejemplos.svg)



    Clasifica el vértice de las siguientes funciones como máximo o mínimo justificando formalmente:

    1) $f(x) = 4x^2 - 16x + 25$

    2) $g(x) = -3x^2 + 6x + 1$'
  pasos:
  - 'Paso 1: Para $f(x) = 4x^2 - 16x + 25$:

    - $a = 4 > 0$.

    - Como $a > 0$, la parábola abre hacia arriba ($\cup$).

    - Conclusión: El vértice es un **mínimo absoluto** en $x = 2$, con valor mínimo $y_v = f(2) = 9$.'
  - 'Paso 2: Para $g(x) = -3x^2 + 6x + 1$:

    - $a = -3 < 0$.

    - Como $a < 0$, la parábola abre hacia abajo ($\cap$).

    - Conclusión: El vértice es un **máximo absoluto** en $x = 1$, con valor máximo $y_v = g(1) = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $f(x) = -5x^2 + 20x - 3$, ¿qué tipo de extremo representa el vértice?
  choices:
  - text: Un máximo absoluto (porque a = -5 < 0)
    is_correct: true
  - text: Un mínimo absoluto
    is_correct: false
  - text: Un punto de inflexión
    is_correct: false
  - text: No tiene extremo
    is_correct: false
  explanation: La alternativa correcta es 'Un máximo absoluto (porque a = -5 < 0)'. Al ser $a < 0$, las ramas apuntan hacia abajo y la cúspide es un máximo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una empresa modela sus costos mediante $C(x) = 2x^2 - 12x + 50$, ¿qué representa el vértice de la función?
  choices:
  - text: El costo mínimo de producción (porque a = 2 > 0)
    is_correct: true
  - text: El costo máximo de producción
    is_correct: false
  - text: El punto de equilibrio
    is_correct: false
  - text: La ganancia nula
    is_correct: false
  explanation: La alternativa correcta es 'El costo mínimo de producción (porque a = 2 > 0)'. Con $a > 0$, el vértice define el costo mínimo posible.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el coeficiente principal $a$ que acompaña a $x^2$.'
- 'Paso 2: Analizar su signo algebraico ($a > 0$ o $a < 0$).'
- 'Paso 3: Si $a > 0$, clasificar el vértice como mínimo absoluto.'
- 'Paso 4: Si $a < 0$, clasificar el vértice como máximo absoluto.'
- 'Paso 5: Enunciar el valor del extremo $y_v = f(x_v)$.'
errores_correccion: '- **Error común:** Pensar que si $a > 0$ el vértice es un máximo porque "positivo significa grande".

  - **Cómo corregirlo:** Si abre hacia arriba ($\cup$), el vértice queda en el fondo: **es un MÍNIMO**.'
ejemplos:
- titulo: 'Ejemplo 1: Clasificación directa'
  enunciado: En $f(x) = -2(x - 4)^2 + 10$, ¿qué extremo hay en el vértice?
  alternativas:
  - Máximo en (4, 10)
  - Mínimo en (4, 10)
  - Máximo en (-4, 10)
  - Mínimo en (4, -10)
  respuesta: Máximo en (4, 10)
  solucion_pasos:
  - 'Paso 1: $a = -2 < 0 \implies$ máximo absoluto en $(4, 10)$.'
- titulo: 'Ejemplo 2: Coeficiente fraccionario'
  enunciado: Para $g(x) = \frac{1}{3}x^2 - 2x + 5$, ¿el vértice es máximo o mínimo?
  alternativas:
  - Mínimo absoluto (a = 1/3 > 0)
  - Máximo absoluto
  - Inflexión
  - Ninguno
  respuesta: Mínimo absoluto (a = 1/3 > 0)
  solucion_pasos:
  - 'Paso 1: $a = 1/3 > 0 \implies$ concavidad hacia arriba $\implies$ mínimo.'
- titulo: 'Ejemplo 3: Ganancia máxima'
  enunciado: Si la ganancia es $G(x) = -x^2 + 80x - 700$, ¿por qué existe una ganancia máxima?
  alternativas:
  - Porque a = -1 < 0 y la curva tiene una cumbre en el vértice
  - Porque b = 80 es positivo
  - Porque c = -700
  - Porque tiene dos raíces
  respuesta: Porque a = -1 < 0 y la curva tiene una cumbre en el vértice
  solucion_pasos:
  - 'Paso 1: $a < 0 \implies$ parábola cóncava hacia abajo con valor máximo en el vértice.'
- titulo: 'Ejemplo 4: Desigualdad fundamental'
  enunciado: Si $f(x)$ tiene mínimo en $V(1, -6)$, ¿qué desigualdad se cumple para todo $x \in \mathbb{R}$?
  alternativas:
  - f(x) >= -6
  - f(x) <= -6
  - f(x) >= 1
  - f(x) <= 1
  respuesta: f(x) >= -6
  solucion_pasos:
  - 'Paso 1: Al ser mínimo, $f(x) \ge y_v \implies f(x) \ge -6$.'
errores_frecuentes:
- Asociar concavidad hacia arriba con tener un punto máximo.
- Confundir el signo de b con el criterio de clasificación del extremo.
- Creer que una parábola puede no tener máximo ni mínimo.
afirmaciones_verdaderas:
- El signo de a determina de forma excluyente si el vértice es un mínimo (a > 0) o un máximo (a < 0).
- Si a > 0, la función está acotada inferiormente por y_v; si a < 0, está acotada superiormente por y_v.
al_terminar_debes_poder: '**QUÉ:** Identificar y clasificar el vértice como máximo o mínimo según la concavidad.


  **CÓMO:** Evaluando el signo de a para clasificar el extremo global absoluto de la función cuadrática.


