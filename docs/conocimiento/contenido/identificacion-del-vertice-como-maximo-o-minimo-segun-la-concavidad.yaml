semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.MAXIMO_MINIMO
resumen_inicial: 'El vértice $V(h, k)$ se clasifica como punto mínimo si el coeficiente cuadrático es positivo ($a > 0$) o como punto máximo si es negativo ($a < 0$).'
explicacion_simple: |
  Para saber si el vértice representa una "cima" o un "valle", basta con mirar el signo del número $a$ que multiplica a $x^2$. Si $a$ es positivo, la parábola tiene forma de copa (cóncava hacia arriba) y el vértice es el punto de menor altura (mínimo). Si $a$ es negativo, la parábola tiene forma de montaña (cóncava hacia abajo) y el vértice es el punto de mayor altura (máximo).
explicacion_formal: |
  ### Definición formal
  En la función cuadrática $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = ax^2 + bx + c$, el vértice $V(h, k)$ constituye el **extremo absoluto** de la función en $\mathbb{R}$:
  - **Mínimo absoluto global**: $\iff a > 0 \implies \forall x \in \mathbb{R}, \quad f(x) \ge f(h) = k$.
  - **Máximo absoluto global**: $\iff a < 0 \implies \forall x \in \mathbb{R}, \quad f(x) \le f(h) = k$.

  ### Desglose simbólico
  - Para $a > 0$: La cota inferior de las salidas $y$ es $k$. No existe cota superior.
  - Para $a < 0$: La cota superior de las salidas $y$ es $k$. No existe cota inferior.

  ### Síntesis didáctica
  Diferenciar entre "punto extremo" y "valor extremo": El **punto extremo** son las coordenadas completas $(h, k)$ en el plano cartesiano. El **valor extremo** es el número escalar $k$ (la altura del vértice). El signo de $a$ establece si dicho valor $k$ es el techo o el piso de la función.
definiciones_clave: |
  - **Mínimo absoluto**: Punto $V(h, k)$ de menor cota vertical alcanzado cuando $a > 0$.
  - **Máximo absoluto**: Punto $V(h, k)$ de mayor cota vertical alcanzado cuando $a < 0$.
  - **Cota de la función**: Límite inferior $k$ (si $a > 0$) o superior $k$ (si $a < 0$) que delimita las imágenes reales.
propiedades_relaciones: |
  - **Criterio de la segunda derivada**: La segunda derivada $f''(x) = 2a$. Si $f''(x) > 0$ es un mínimo; si $f''(x) < 0$ es un máximo.
  - **Relación con la concavidad**: La naturaleza extrema del vértice coincide 100% con la concavidad gobernada por el signo de $a$.
ejemplo_guiado:
  enunciado: 'Determina si la función cuadrática $f(x) = -3x^2 + 12x - 5$ posee un punto máximo o mínimo, calcula sus coordenadas de vértice e interpreta el valor extremo obtenido.'
  pasos:
    - 'Paso 1: Identificamos $a = -3 < 0$, de lo cual deducimos que la parábola es cóncava hacia abajo y el vértice es un punto máximo absoluto.'
    - 'Paso 2: Calculamos $h = -\frac{b}{2a} = -\frac{12}{2(-3)} = -\frac{12}{-6} = 2$.'
    - 'Paso 3: Evaluamos $k = f(2) = -3(2)^2 + 12(2) - 5 = -12 + 24 - 5 = 7$.'
    - 'Paso 4: Concluimos que el punto $V(2, 7)$ es el máximo absoluto de la función, siendo $y = 7$ la cota superior máxima alcanzada.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la función cuadrática $g(x) = 4x^2 - 8x + 3$ tiene $a = 4 > 0$, ¿qué tipo de extremo presenta en su vértice $V(1, -1)$?'
    choices:
      - {text: 'Un mínimo absoluto con valor mínimo $y = -1$', is_correct: true}
      - {text: 'Un máximo absoluto con valor máximo $y = 1$', is_correct: false}
      - {text: 'Un punto de inflexión con valor cero', is_correct: false}
      - {text: 'Un máximo absoluto con valor máximo $y = -1$', is_correct: false}
    explanation: 'La alternativa correcta es ''Un mínimo absoluto con valor mínimo $y = -1$''. Al ser $a = 4 > 0$, abre hacia arriba y el vértice es un mínimo de valor $k = -1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una empresa modela sus ingresos en función del precio $x$ mediante $I(x) = -50x^2 + 2000x$. ¿El vértice representa el ingreso máximo o mínimo?'
    choices:
      - {text: 'Representa el ingreso máximo absoluto', is_correct: true}
      - {text: 'Representa el ingreso mínimo absoluto', is_correct: false}
      - {text: 'No representa ningún valor extremo', is_correct: false}
      - {text: 'Representa la pérdida constante', is_correct: false}
    explanation: 'La alternativa correcta es ''Representa el ingreso máximo absoluto''. Puesto que $a = -50 < 0$, la curva es cóncava hacia abajo y el vértice da el ingreso máximo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar el signo del coeficiente cuadrático $a$.'
  - 'Paso 2: Si $a > 0$, clasificar el vértice como mínimo absoluto; si $a < 0$, clasificarlo como máximo absoluto.'
  - 'Paso 3: Calcular las coordenadas $V(h, k)$ indicando que $k$ representa la cota mínima ($a > 0$) o máxima ($a < 0$).'
errores_correccion: |
  - **Error 1:** Asociar un coeficiente $a$ negativo con un valor mínimo. **Cómo corregirlo:** Si $a < 0$, las ramas bajan a $-\infty$, por lo que la curva alcanza su punto más alto (máximo) en el vértice.
  - **Error 2:** Creer que las funciones cuadráticas pueden tener simultáneamente un máximo y un mínimo. **Cómo corregirlo:** La parábola cuadrática posee únicamente un solo extremo global (un máximo o un mínimo, pero nunca ambos a la vez).
ejemplos:
  - titulo: 'Clasificación de extremo por el signo de a'
    enunciado: '¿La función $f(x) = 0.2x^2 + 3x - 1$ tiene un punto máximo o un punto mínimo?'
    alternativas:
      - 'Un punto mínimo absoluto'
      - 'Un punto máximo absoluto'
      - 'No posee extremos'
    respuesta: 'Un punto mínimo absoluto'
    solucion_pasos:
      - '1. El coeficiente cuadrático es $a = 0.2 > 0$.'
      - '2. Como $a > 0$, las ramas abren hacia arriba y el vértice es un mínimo absoluto.'
  - titulo: 'Naturaleza del vértice en proyectiles'
    enunciado: 'En la altura de un balón dada por $h(t) = -5t^2 + 15t$, ¿el vértice representa la altura máxima alcanzada?'
    alternativas:
      - 'Sí, porque $a = -5 < 0$'
      - 'No, representa la altura mínima'
      - 'No, representa el tiempo de vuelo'
    respuesta: 'Sí, porque $a = -5 < 0$'
    solucion_pasos:
      - '1. Coeficiente $a = -5 < 0$.'
      - '2. Al ser $a < 0$, la trayectoria es parabólica cóncava hacia abajo y el vértice es la cota más alta (altura máxima).'
  - titulo: 'Unicidad del tipo de extremo'
    enunciado: '¿Una función cuadrática con $a > 0$ carece de un valor máximo global real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cuando $a > 0$, las ramas de la parábola crecen indefinidamente hacia $+\infty$, por lo que no existe un valor máximo global acotado.'
  - titulo: 'Dependencia exclusiva del signo de a'
    enunciado: '¿El valor del término independiente $c$ afecta si el vértice es máximo o mínimo?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La clasificación del vértice como máximo o mínimo depende única y exclusivamente del signo del coeficiente $a$.'
errores_frecuentes:
  - 'Una función cuadrática con coeficiente $a = 2$ alcanza un valor máximo en su vértice.'
  - 'Si el término independiente $c$ es negativo, el vértice es siempre un punto mínimo.'
  - 'El vértice de toda parábola es simultáneamente un punto máximo y un punto mínimo.'
  - 'En la función $f(x) = -x^2 + 4$, el valor $y = 4$ es el valor mínimo de la función.'
  - 'El signo del coeficiente lineal $b$ decide si el vértice es cóncavo o convexo.'
afirmaciones_verdaderas:
  - 'Si el coeficiente cuadrático es positivo ($a > 0$), el vértice de la parábola representa el punto mínimo absoluto de la función.'
  - 'Si el coeficiente cuadrático es negativo ($a < 0$), el vértice de la parábola representa el punto máximo absoluto de la función.'
al_terminar_debes_poder: 'Clasificar el vértice de cualquier función cuadrática como punto máximo o mínimo absoluto analizando el signo de $a$.'
