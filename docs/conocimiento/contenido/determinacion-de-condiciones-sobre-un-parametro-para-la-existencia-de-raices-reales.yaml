semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CONDICIONES_PARAMETRO
resumen_inicial: La determinación de condiciones sobre un parámetro $k$ para la existencia de raíces reales consiste en formular el discriminante en función del parámetro $\Delta(k) = [b(k)]^2 - 4[a(k)][c(k)]$ y resolver la inecuación $\Delta(k) \ge 0$, $\Delta(k) > 0$ o la ecuación $\Delta(k) = 0$.
explicacion_simple: "![La determinación de condiciones sobre un parámetro $k$ para la existencia de raíces reales consiste en formular el discriminante en función del parámetro $\\Delta(k) = [b(k)]^2 - 4[a(k)][c(k)]$ y resolver la inecuación $\\Delta(k) \\ge 0$, $\\Delta(k) > 0$ o la ecuación $\\Delta(k) = 0$](/static/img/nodos/determinacion-de-condiciones-sobre-un-parametro-para-la-existencia-de-raices-reales-intro.svg)\n\n\nEn muchas preguntas tipo PAES te dan una ecuación con una letra desconocida $k$ (por ejemplo, $x^2 - 6x + k = 0$) y te preguntan: **¿qué valores puede tener $k$ para que tenga soluciones reales?**\n\n**El método en 3 pasos:**\n1. **Calcula el discriminante dejando la letra $k$:**\n   $$\\Delta = (-6)^2 - 4(1)(k) = 36 - 4k$$\n2. **Aplica la condición que te piden:**\n   - Si piden *\"dos soluciones reales distintas\"* $\\implies \\Delta > 0 \\implies 36 - 4k > 0 \\implies k < 9$.\n   - Si piden *\"raíz doble / una sola solución\"* $\\implies \\Delta = 0 \\implies 36\
  \ - 4k = 0 \\implies k = 9$.\n   - Si piden *\"soluciones reales (en general)\"* $\\implies \\Delta \\ge 0 \\implies 36 - 4k \\ge 0 \\implies k \\le 9$.\n   - Si piden *\"sin soluciones reales\"* $\\implies \\Delta < 0 \\implies 36 - 4k < 0 \\implies k > 9$.\n3. **¡Listo! Despejas la $k$ respetando los signos.**"
explicacion_formal: 'Sea una familia de ecuaciones cuadráticas paramétricas $P_k(x) = a(k)x^2 + b(k)x + c(k) = 0$ con $a(k) \neq 0$. La función discriminante paramétrica $\Delta: \mathbb{R} \to \mathbb{R}$ viene definida por:

  $$\Delta(k) = [b(k)]^2 - 4a(k)c(k)$$


  **Tabla formal de condiciones analíticas sobre el parámetro $k$**:

  - **Existencia de raíces reales (general)**: $\Delta(k) \ge 0 \Longleftrightarrow k \in \{k \in \mathbb{R} \mid \Delta(k) \ge 0\}$.

  - **Dos raíces reales y distintas**: $\Delta(k) > 0$.

  - **Raíz real única doble (tangencia con eje X)**: $\Delta(k) = 0$.

  - **Ausencia de raíces reales (curva flotante)**: $\Delta(k) < 0$.


  **Restricción de no degeneración**: Se debe garantizar simultáneamente que el coeficiente principal no se anule ($a(k) \neq 0$).'
definiciones_clave: '- **Ecuación cuadrática paramétrica**: Ecuación donde uno o más coeficientes dependen de un parámetro escalar $k$.

  - **Condición de resolubilidad en R**: Inecuación $\Delta(k) \ge 0$ que delimita el dominio admisible de parámetros para obtener raíces reales.'
propiedades_relaciones: '- **Inecuaciones lineales vs cuadráticas en k**: Si el parámetro aparece en $b$, $\Delta(k)$ resulta una inecuación de segundo grado en $k$.

  - **Inversión de desigualdad**: Al dividir por coeficientes negativos, se debe invertir el sentido de la desigualdad.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación de condiciones sobre un parámetro $k$ para la existencia de raíces reales consiste en formular el discriminante en función del parámetro $\Delta(k) = [b(k)]^2 - 4[a(k)][c(k)]$ y resolver la inecuación $\Delta(k) \ge 0$, $\Delta(k) > 0$ o la ecuación $\Delta(k) = 0$](/static/img/nodos/determinacion-de-condiciones-sobre-un-parametro-para-la-existencia-de-raices-reales-ejemplos.svg)



    Determina todos los valores del parámetro real $k$ para los cuales la ecuación $x^2 + 2kx + (k + 6) = 0$ tiene una única solución real doble.'
  pasos:
  - 'Paso 1: Identificar los coeficientes paramétricos: $a = 1, b = 2k, c = k + 6$.'
  - 'Paso 2: Formular el discriminante $\Delta(k)$:

    $\Delta(k) = (2k)^2 - 4(1)(k + 6) = 4k^2 - 4k - 24$.'
  - 'Paso 3: Imponer la condición de raíz doble: $\Delta(k) = 0$:

    $4k^2 - 4k - 24 = 0$.'
  - 'Paso 4: Dividir toda la ecuación entre 4:

    $k^2 - k - 6 = 0$.'
  - 'Paso 5: Factorizar el trinomio en $k$:

    $(k - 3)(k + 2) = 0 \implies k_1 = 3, \; k_2 = -2$.'
  - 'Paso 6: Concluir: La ecuación tiene raíz doble si y solo si $k = 3$ o $k = -2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Para qué valores de k la ecuación $x^2 - 4x + k = 0$ tiene dos soluciones reales distintas?
  choices:
  - text: k < 4
    is_correct: true
  - text: k > 4
    is_correct: false
  - text: k = 4
    is_correct: false
  - text: k <= 4
    is_correct: false
  explanation: La alternativa correcta es 'k < 4'. $\Delta = 16 - 4k > 0 \implies 16 > 4k \implies k < 4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si se pide que una ecuación tenga "raíces reales" (sin especificar si son distintas o iguales), ¿qué condición se debe plantear?
  choices:
  - text: Δ >= 0
    is_correct: true
  - text: Δ > 0
    is_correct: false
  - text: Δ = 0
    is_correct: false
  - text: Δ < 0
    is_correct: false
  explanation: La alternativa correcta es 'Δ >= 0'. Incluye tanto el caso de dos raíces distintas ($\Delta > 0$) como el de raíz doble ($\Delta = 0$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer los coeficientes $a(k), b(k), c(k)$ en función del parámetro.'
- 'Paso 2: Plantear algebraicamente la expresión del discriminante $\Delta(k) = [b(k)]^2 - 4a(k)c(k)$.'
- 'Paso 3: Establecer la relación adecuada según el enunciado ($\Delta \ge 0$, $\Delta > 0$, $\Delta = 0$ o $\Delta < 0$).'
- 'Paso 4: Resolver la ecuación o inecuación para la incógnita $k$.'
- 'Paso 5: Verificar que no se anule el coeficiente principal $a(k) \neq 0$ y enunciar el intervalo de soluciones.'
errores_correccion: '- **Error común:** Plantear $\Delta > 0$ cuando el enunciado dice "tiene raíces reales".

  - **Cómo corregirlo:** Si no dice "distintas", la condición correcta es **$\Delta \ge 0$** (mayor o igual a cero).'
ejemplos:
- titulo: 'Ejemplo 1: Condición de dos raíces distintas'
  enunciado: ¿Para qué valores de m la ecuación $x^2 - 8x + m = 0$ tiene 2 soluciones reales distintas?
  alternativas:
  - m < 16
  - m > 16
  - m <= 16
  - m = 16
  respuesta: m < 16
  solucion_pasos:
  - 'Paso 1: $\Delta = 64 - 4m > 0 \implies 64 > 4m \implies m < 16$.'
- titulo: 'Ejemplo 2: Condición de raíz doble'
  enunciado: ¿Qué valor debe tener c en $x^2 + 10x + c = 0$ para que tenga una sola solución real?
  alternativas:
  - c = 25
  - c = 100
  - c = 5
  - c = -25
  respuesta: c = 25
  solucion_pasos:
  - 'Paso 1: $\Delta = 100 - 4c = 0 \implies 4c = 100 \implies c = 25$.'
- titulo: 'Ejemplo 3: Parámetro en el coeficiente lineal'
  enunciado: ¿Para qué valores de k la ecuación $x^2 + kx + 9 = 0$ tiene raíz doble?
  alternativas:
  - k = 6 o k = -6
  - Solo k = 6
  - k = 3 o k = -3
  - k = 36
  respuesta: k = 6 o k = -6
  solucion_pasos:
  - 'Paso 1: $\Delta = k^2 - 36 = 0 \implies k^2 = 36 \implies k = \pm 6$.'
- titulo: 'Ejemplo 4: Condición de no existencia real'
  enunciado: ¿Para qué valores de p la ecuación $x^2 + 4x + p = 0$ NO tiene raíces reales?
  alternativas:
  - p > 4
  - p < 4
  - p >= 4
  - p = 4
  respuesta: p > 4
  solucion_pasos:
  - 'Paso 1: $\Delta = 16 - 4p < 0 \implies 16 < 4p \implies p > 4$.'
errores_frecuentes:
- Confundir Δ > 0 con Δ >= 0 al leer el enunciado.
- Olvidar la solución negativa cuando el parámetro está al cuadrado (k² = 36 => k = ±6).
- Invertir incorrectamente las desigualdades al despejar.
afirmaciones_verdaderas:
- La existencia de raíces reales se determina planteando la inecuación Δ(k) >= 0.
- Una ecuación tiene solución real única si y solo si el discriminante paramétrico es nulo Δ(k) = 0.
al_terminar_debes_poder: '**QUÉ:** Determinar condiciones analíticas sobre parámetros para controlar la naturaleza de las raíces.


  **CÓMO:** Formulando el discriminante paramétrico Δ(k) y resolviendo las ecuaciones e inecuaciones asociadas.


