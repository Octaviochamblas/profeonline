semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CONDICIONES_PARAMETRO
resumen_inicial: Para hallar las condiciones de un parámetro $k$ que garanticen la
  existencia de raíces reales en $a x^2 + b x + c = 0$, se plantea la inecuación $\Delta
  \ge 0$.
explicacion_simple: 'En ejercicios con letras desconocidas (parámetros como $k$):

  - Si te piden que la ecuación tenga **raíces reales**: planteas la inecuación **$\Delta
  \ge 0$** (positivo o cero).

  - Si te piden **dos raíces reales distintas**: planteas **$\Delta > 0$**.

  - Si te piden **raíz real única (doble)**: planteas **$\Delta = 0$**.

  - Si te piden **sin soluciones reales**: planteas **$\Delta < 0$**.

  - Luego resuelves la inecuación o ecuación para la letra $k$.'
explicacion_formal: Definición formal e interpretación matemática del discriminante
  en ecuaciones cuadráticas.
definiciones_clave: '- **Discriminante ($\Delta$)**: Invariante algebraico $b^2 -
  4ac$ que clasifica el tipo de soluciones.'
propiedades_relaciones: '- **Relación gráfica**: $\Delta > 0$ (2 cortes con eje X),
  $\Delta = 0$ (1 contacto tangente), $\Delta < 0$ (0 cortes).'
ejemplo_guiado:
  enunciado: Análisis del discriminante y naturaleza de las raíces cuadráticas.
  pasos:
  - 'Paso 1: Identificar los coeficientes a, b y c.'
  - 'Paso 2: Calcular Delta = b^2 - 4ac.'
  - 'Paso 3: Evaluar el signo de Delta.'
  - 'Paso 4: Concluir la naturaleza del conjunto solución.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué indica un discriminante $\Delta = 0$ respecto a las soluciones de
    la ecuación cuadrática?
  choices:
  - text: Que la ecuación posee una única solución real doble ($x_1 = x_2 = -b / 2a$).
    is_correct: true
  - text: Que la ecuación posee dos soluciones reales distintas.
    is_correct: false
  - text: Que la ecuación no tiene soluciones reales.
    is_correct: false
  - text: Que la ecuación se anula completamente.
    is_correct: false
  explanation: La alternativa correcta es 'Que la ecuación posee una única solución
    real doble ($x_1 = x_2 = -b / 2a$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué inecuación se debe plantear para que la ecuación cuadrática tenga
    soluciones en los números reales?
  choices:
  - text: $\Delta \ge 0$
    is_correct: true
  - text: $\Delta < 0$
    is_correct: false
  - text: $\Delta = 1$
    is_correct: false
  - text: $\Delta \le -1$
    is_correct: false
  explanation: La alternativa correcta es '$\Delta \ge 0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer $a, b, c$ de la forma canónica.'
- 'Paso 2: Calcular $\Delta = b^2 - 4ac$.'
- 'Paso 3: Clasificar el signo de $\Delta$ en $>0$, $=0$ o $<0$.'
- 'Paso 4: Declarar la naturaleza de las raíces.'
errores_correccion: '- **Error común:** Confundir tener raíces reales distintas ($\Delta
  > 0$) con tener raíces reales en general ($\Delta \ge 0$).

  - **Cómo corregirlo:** Raíces reales abarca tanto las distintas como la doble, por
  lo que incluye $\Delta > 0$ y $\Delta = 0$ (es decir, $\Delta \ge 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica del discriminante cuadrático.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de naturaleza de raíces.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El discriminante b^2 - 4ac determina la cantidad de soluciones reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo de Delta predice si hay 2, 1 o 0 soluciones reales.
- titulo: ¿Si Delta < 0 la ecuación carece de soluciones en el conjunto R?
  respuesta: Sí
  solucion_pasos:
  - Sí, la raíz de un número negativo no es un número real.
errores_frecuentes:
- Incluir la raíz cuadrada dentro del valor del discriminante (definir $\Delta = \sqrt{b^2
  - 4ac}$ en vez de $b^2 - 4ac$).
- Calculas $(-4)^2 = -16$ en lugar de $+16$ al sustituir un coeficiente lineal negativo.
- Confundir la condición de dos raíces reales distintas ($\Delta > 0$) con tener raíces
  reales cualesquiera ($\Delta \ge 0$).
- Concluir que $\Delta < 0$ significa que la ecuación no tiene solución en ningún
  sistema numérico (sí tiene en $\mathbb{C}$).
- Olvidar multiplicar por el signo negativo $-4ac$ cuando $c$ es un número negativo.
afirmaciones_verdaderas:
- 'El discriminante $\Delta = b^2 - 4ac$ predice la naturaleza de las raíces: $\Delta
  > 0$ (2 reales distintas), $\Delta = 0$ (1 real doble), $\Delta < 0$ (0 reales).'
- Para que una ecuación de segundo grado posea al menos una solución real se debe
  cumplir la condición $\Delta \ge 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular e interpretar el
  discriminante Delta = b^2 - 4ac, determinar la naturaleza de las raíces y resolver
  condiciones sobre parámetros.
fuente: Texto escolar MINEDUC — Álgebra / Discriminante de la Ecuación Cuadrática
estado: publicado
