semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CONDICIONES_PARAMETRO
resumen_inicial: La determinación de condiciones sobre un parámetro $k$ impone desigualdades sobre el discriminante ($\Delta \ge 0$, $\Delta > 0$ o $\Delta < 0$) para forzar un comportamiento específico en las raíces.
explicacion_simple: |
  A veces una ecuación cuadrática tiene una **letra o parámetro desconocido $k$** en lugar de un número fijo, por ejemplo:

  $$x^2 - 4x + k = 0$$

  Si la pregunta te pide: *"¿Qué valor debe tener $k$ para que la ecuación tenga dos soluciones reales distintas?"*:
  1. Calculas el discriminante en función de $k$:
     $$\Delta = (-4)^2 - 4(1)(k) = 16 - 4k$$
  2. Impones la condición de dos soluciones reales distintas ($\Delta > 0$):
     $$16 - 4k > 0 \implies 16 > 4k \implies k < 4$$
  - **Conclusión**: Para que la ecuación tenga 2 soluciones reales distintas, la letra $k$ debe ser un número strictly menor a $4$.
explicacion_formal: |
  Dada la familia de ecuaciones cuadráticas $a(k)x^2 + b(k)x + c(k) = 0$ dependientes del parámetro $k \in \mathbb{R}$, el **análisis paramétrico de existencia de raíces** resuelve inecuaciones respecto a $k$ mediante el discriminante $\Delta(k) = [b(k)]^2 - 4a(k)c(k)$:

  **Criterios de inecuación paramétrica:**
  - **Existencia de soluciones en $\mathbb{R}$ (al menos una raíz real):**
    $$\Delta(k) \ge 0$$
  - **Dos soluciones reales distintas ($x_1 \neq x_2$):**
    $$\Delta(k) > 0$$
  - **Solución real única o doble ($x_1 = x_2$):**
    $$\Delta(k) = 0$$
  - **Ausencia de soluciones reales ($S = \emptyset$):**
    $$\Delta(k) < 0$$
definiciones_clave: |
  - **Análisis paramétrico de raíces**: Método analítico para hallar el rango o intervalo de valores de una constante o parámetro $k$ imponiendo restricciones sobre $\Delta$.
propiedades_relaciones: |
  - **Inversión de desigualdad por coeficiente negativo**: Al despejar la inecuación $\Delta(k) > 0$, multiplicar o dividir por un número negativo invierte el sentido del signo de desigualdad (de $>$ a $<$ o viceversa).
ejemplo_guiado:
  enunciado: 'Determina los valores del parámetro $k$ para los cuales la ecuación $x^2 + kx + 9 = 0$ posee una única solución real doble.'
  pasos:
    - 'Paso 1: Extraer coeficientes: $a = 1$, $b = k$, $c = 9$.'
    - 'Paso 2: Expresar el discriminante: $\Delta = k^2 - 4(1)(9) = k^2 - 36$.'
    - 'Paso 3: Imponer la condición de solución única doble ($\Delta = 0$): $k^2 - 36 = 0$.'
    - 'Paso 4: Resolver la ecuación pura en $k$: $k^2 = 36 \implies k = \pm 6$. Los valores son $k = 6$ o $k = -6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué inecuación debe plantearse sobre el discriminante $\Delta(k)$ para garantizar la existencia de soluciones reales en $ax^2 + bx + c = 0$?'
    choices:
      - {text: '$\Delta(k) \ge 0$', is_correct: true}
      - {text: '$\Delta(k) < 0$', is_correct: false}
      - {text: '$\Delta(k) = -1$', is_correct: false}
      - {text: '$\Delta(k) \le -4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\Delta(k) \ge 0$''. Incluye tanto el caso de 2 soluciones distintas ($\Delta > 0$) como el de 1 solución doble ($\Delta = 0$).'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Para qué valores del parámetro $k$ la ecuación $x^2 - 6x + k = 0$ no tiene soluciones reales?'
    choices:
      - {text: '$k > 9$', is_correct: true}
      - {text: '$k < 9$', is_correct: false}
      - {text: '$k = 9$', is_correct: false}
      - {text: '$k \le 6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k > 9$''. Para no tener soluciones reales se exige $\Delta < 0 \implies 36 - 4k < 0 \implies 36 < 4k \implies k > 9$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar las expresiones dependientes del parámetro $k$ para los coeficientes $a(k)$, $b(k)$ y $c(k)$.'
  - 'Paso 2: Escribir la expresión algebraica del discriminante en función del parámetro $\Delta(k) = [b(k)]^2 - 4a(k)c(k)$.'
  - 'Paso 3: Seleccionar la condición adecuada ($\Delta > 0$, $\Delta = 0$ o $\Delta < 0$) según lo solicitado en el problema.'
  - 'Paso 4: Resolver la ecuación o inecuación resultante en la variable $k$ cuidando la inversión de signos de desigualdad.'
errores_correccion: |
  - **Error común:** Confundir la condición de "raíces reales" ($\Delta \ge 0$) con la condición de "raíces reales y distintas" ($\Delta > 0$).
  - **Cómo corregirlo:** Si el enunciado pide **SIMPLEMENTE "TIENE SOLUCIONES REALES"**, incluye la posibilidad de raíz doble usando **$\Delta \ge 0$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Condición para 2 soluciones distintas.
    alternativas:
      - '$k < 4$'
      - '$k > 4$'
      - '$k = 4$'
    respuesta: '$k < 4$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Condición para solución única.
    alternativas:
      - '$k = \pm 6$'
      - '$k > 6$'
      - '$k < -6$'
    respuesta: '$k = \pm 6$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La exclusión de la igualdad a cero $\Delta = 0$ cuando el problema exige genéricamente que la ecuación tenga soluciones en los reales.'
  - 'La falta de inversión del sentido de una desigualdad al dividir por un número negativo durante el despeje del parámetro $k$.'
  - 'Plantear que para no tener raíces reales el discriminante debe ser mayor que cero $\Delta > 0$.'
  - 'Igualar el parámetro $k$ a cero directamente sin calcular la expresión del discriminante.'
  - 'La creencia de que el parámetro $k$ sólo puede ubicarse en el término independiente $c$.'
afirmaciones_verdaderas:
  - 'Determinar las condiciones de un parámetro $k$ para la existencia de soluciones reales requiere resolver la inecuación $\Delta(k) \ge 0$.'
  - 'Si el despeje del parámetro implica dividir por un coeficiente negativo, el sentido del signo de desigualdad debe invertirse.'
al_terminar_debes_poder: |
  QUÉ: Determinar las condiciones sobre un parámetro $k$ para controlar la existencia y cantidad de raíces reales de una ecuación cuadrática.
  CÓMO: Formular $\Delta(k)$, plantear la ecuación o inecuación adecuada ($\ge 0, > 0, = 0, < 0$) y despejar $k$.
