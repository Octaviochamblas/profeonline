semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CONDICIONES_PARAMETRO
resumen_inicial: 'Determinación de condiciones sobre un parámetro para la existencia
  de raíces reales: concepto, discriminante, soluciones y modelamiento en El discriminante
  y la naturaleza de las raíces.'
explicacion_simple: Cuando uno de los coeficientes de una ecuación cuadrática depende
  de un parámetro, el discriminante se convierte en una expresión con ese parámetro,
  y estudiar su signo revela para qué valores hay soluciones reales.
explicacion_formal: '### Definición formal


  Si los coeficientes de $ax^2+bx+c=0$ dependen de un parámetro $k$, el discriminante
  $\Delta(k)=b(k)^2-4a(k)c(k)$ es una expresión en $k$. Las condiciones sobre $k$
  para que existan soluciones reales se obtienen resolviendo la inecuación $\Delta(k)
  \geq 0$ (dos soluciones o una doble) o $\Delta(k) > 0$ (dos soluciones distintas).


  ### Desarrollo didáctico


  El procedimiento combina dos temas: calcular el discriminante en función del parámetro,
  y luego resolver la inecuación resultante sobre ese parámetro, tal como se resuelve
  cualquier inecuación algebraica.


  Para que $x^2+kx+9=0$ tenga soluciones reales, se plantea $\Delta=k^2-36 \geq 0$,
  cuya solución es $k \leq -6$ o $k \geq 6$.'
definiciones_clave: '- **Determinación de condiciones sobre un parámetro para la existencia
  de raíces reales**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
