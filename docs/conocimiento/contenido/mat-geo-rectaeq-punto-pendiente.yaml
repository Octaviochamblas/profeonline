semantic_id: MAT.GEO.RECTA_ECUACIONES.PUNTO_PENDIENTE
resumen_inicial: 'Obtención de la ecuación de la recta dado un punto y la pendiente:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'Cuando se conoce un punto de la recta y su inclinación (pendiente),
  no es necesario conocer el coeficiente de posición para escribir su ecuación: existe
  una fórmula directa.'
explicacion_formal: '![Ecuación punto-pendiente](/static/img/geometria/analitica/rectaeq-punto-pendiente.svg)


  ### Definición formal


  Si una recta tiene pendiente $m$ y pasa por el punto $(x_1,y_1)$, su ecuación es
  $y-y_1=m(x-x_1)$, que luego puede simplificarse a la forma principal.


  ### Desarrollo didáctico


  Para una recta con pendiente $m=2$ que pasa por $(2,2)$: $y-2=2(x-2)$, que al simplificar
  da $y=2x-2$.'
definiciones_clave: '- **Obtención de la ecuación de la recta dado un punto y la pendiente**:
  Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a obtención de la ecuación de la recta dado
  un punto y la pendiente.'
