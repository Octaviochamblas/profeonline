- titulo: ¿Se cumple siempre la propiedad principal de obtención de la ecuación de
    la recta dado un punto y la pendiente en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede obtención de la ecuación de la recta dado un punto y la pendiente
    asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
