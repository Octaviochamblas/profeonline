semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.RECORRIDO_DESDE_VERTICE
resumen_inicial: La determinación del recorrido (o rango) establece el conjunto de valores $y$ que toma la función a partir de $k$ y la concavidad de $a$.
explicacion_simple: |
  El **recorrido o rango** de una función cuadrática es el conjunto de todos los valores de altura $y$ que la parábola alcanza efectivamente en el gráfico:

  - Depende **solamente de dos datos**: el valor $k$ de la ordenada del vértice $V(h, k)$ y el signo de $a$.
  - **Si $a > 0$ (Cóncava hacia arriba)**:
    - La parábola empieza en la altura del vértice $k$ y sube sin límite hacia $+\infty$.
    - Su recorrido es **$[k, +\infty[$**.
  - **Si $a < 0$ (Cóncava hacia abajo)**:
    - La parábola viene desde $-\infty$ y sube solo hasta la altura máxima del vértice $k$.
    - Su recorrido es **$]-\infty, k]$**.
explicacion_formal: |
  Sea la función cuadrática $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$ y vértice $V(h, k)$. El **recorrido o conjunto imagen** $\text{Rec}(f) \subseteq \mathbb{R}$ es la imagen directa de la recta real:

  $$\text{Rec}(f) = \{y \in \mathbb{R} \mid \exists x \in \mathbb{R}, f(x) = y\}$$

  **Teorema de acotación del recorrido cuadrático:**
  1. **Concavidad positiva ($a > 0$):**
     $$\text{Rec}(f) = [k, +\infty) = \left[\frac{4ac - b^2}{4a}, +\infty\right)$$
  2. **Concavidad negativa ($a < 0$):**
     $$\text{Rec}(f) = (-\infty, k] = \left(-\infty, \frac{4ac - b^2}{4a}\right]$$
definiciones_clave: |
  - **Recorrido de la función cuadrática**: Conjunto de todos los valores reales de llegada $y$ generados por la función cuadrática, acotado por la ordenada del vértice $k$.
propiedades_relaciones: |
  - **Asimetría entre Dominio y Recorrido**: A diferencia del dominio que abarca ilimitadamente $\mathbb{R}$, el recorrido de una función cuadrática es siempre un intervalo semirrecta cerrado en el valor del vértice $k$.
ejemplo_guiado:
  enunciado: 'Calcula el recorrido de la función cuadrática $f(x) = -2x^2 + 8x - 1$.'
  pasos:
    - 'Paso 1: Identificar el signo de $a$: $a = -2 < 0$, la parábola es cóncava hacia abajo.'
    - 'Paso 2: Calcular la abscisa del vértice: $h = -\frac{8}{2(-2)} = 2$.'
    - 'Paso 3: Calcular la ordenada del vértice $k = f(2) = -2(2)^2 + 8(2) - 1 = -8 + 16 - 1 = 7$.'
    - 'Paso 4: Formular el recorrido semirrecta: como $a < 0$, $\text{Rec}(f) = ]-\infty, 7]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el recorrido de la función cuadrática $f(x) = x^2 - 6x + 13$ cuyo vértice se encuentra en $V(3, 4)$?'
    choices:
      - {text: 'El intervalo cerrado por la izquierda $[4, +\infty[$', is_correct: true}
      - {text: 'El intervalo semirrecta $]-\infty, 4]$.', is_correct: false}
      - {text: 'El conjunto de todos los números reales $\mathbb{R}$.', is_correct: false}
      - {text: 'El intervalo acotado $[3, 4]$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo cerrado por la izquierda $[4, +\infty[$''. Como $a = 1 > 0$, el recorrido va desde $k=4$ hasta $+\infty$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si una función cuadrática posee recorrido $\text{Rec}(g) = ]-\infty, -2]$, ¿qué información se deduce sobre su concavidad y su vértice?'
    choices:
      - {text: 'Su concavidad es negativa ($a < 0$) y la ordenada de su vértice es $k = -2$', is_correct: true}
      - {text: 'Su concavidad es positiva ($a > 0$) y la ordenada de su vértice es $k = -2$.', is_correct: false}
      - {text: 'Su concavidad es positiva ($a > 0$) y la abscisa de su vértice es $h = -2$.', is_correct: false}
      - {text: 'No es posible deducir su concavidad.', is_correct: false}
    explanation: 'La alternativa correcta es ''Su concavidad es negativa ($a < 0$) y la ordenada de su vértice es $k = -2$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Determinar el coeficiente $a$ y verificar si la parábola se abre hacia arriba ($a > 0$) o hacia abajo ($a < 0$).'
  - 'Paso 2: Calcular la ordenada del vértice $k = f\left(-\frac{b}{2a}\right)$.'
  - 'Paso 3: Si $a > 0$, escribir el intervalo $[k, +\infty[$.'
  - 'Paso 4: Si $a < 0$, escribir el intervalo $]-\infty, k]$.'
errores_correccion: |
  - **Error común:** Utilizar la abscisa $h$ en lugar de la ordenada $k$ para armar el intervalo del recorrido.
  - **Cómo corregirlo:** El recorrido **MEDIR MÁXIMOS Y MÍNIMOS EN $Y$**; usa siempre la segunda componente del vértice **$k$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Recorrido con a positivo.
    alternativas:
      - 'Rec(f) = [-5, +\infty['
      - 'Rec(f) = ]-\infty, -5]'
      - 'Rec(f) = \mathbb{R}'
    respuesta: 'Rec(f) = [-5, +\infty['
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Recorrido con a negativo.
    alternativas:
      - 'Rec(f) = ]-\infty, 10]'
      - 'Rec(f) = [10, +\infty['
      - 'Rec(f) = [-10, 10]'
    respuesta: 'Rec(f) = ]-\infty, 10]'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La equiparación del dominio de la función ($\mathbb{R}$) con el recorrido acotado por el vértice.'
  - 'Utilizar la coordenada horizontal $h$ para escribir el límite del intervalo del recorrido.'
  - 'El cambio de orientación de los corchetes de los intervalos infiriendo abiertos en el valor finito $k$.'
  - 'La creencia de que si $c = 0$, el recorrido de la función debe comenzar obligatoriamente en 0.'
  - 'Escribir $[-\infty, k]$ con el corchete cerrado en el infinito.'
afirmaciones_verdaderas:
  - 'El recorrido de una función cuadrática depende del signo de $a$ y de la ordenada del vértice $k$, resultando $[k, +\infty[$ si $a > 0$ o $]-\infty, k]$ si $a < 0$.'
  - 'A diferencia del dominio que abarca toda la recta real $\mathbb{R}$, el recorrido se encuentra siempre acotado inferiormente o superiormente por $k$.'
al_terminar_debes_poder: |
  QUÉ: Determinar y expresar el recorrido o conjunto imagen de cualquier función cuadrática.
  CÓMO: Obtener $a$ y la ordenada del vértice $k$, verificar concavidad y construir el intervalo $[k, +\infty[$ o $]-\infty, k]$.
