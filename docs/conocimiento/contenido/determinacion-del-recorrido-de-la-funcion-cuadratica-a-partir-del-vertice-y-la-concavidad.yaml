semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.RECORRIDO_DESDE_VERTICE
resumen_inicial: 'Determinación del recorrido de la función cuadrática a partir del
  vértice y la concavidad: parábola, vértice, concavidad y formas de El vértice, el
  eje de simetría y el recorrido.'
explicacion_simple: A diferencia del dominio (siempre $\mathbb{R}$), el recorrido
  de una función cuadrática sí depende de sus coeficientes, y se determina fácilmente
  combinando el vértice con la dirección de apertura.
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2+bx+c$ con vértice $(x_v,y_v)$: si $a>0$, $\text{Rec}(f)=[y_v,+\infty[$;
  si $a<0$, $\text{Rec}(f)=]-\infty,y_v]$. En ambos casos, el intervalo incluye el
  valor $y_v$ mismo, ya que es alcanzado exactamente en $x=x_v$.


  ### Desarrollo didáctico


  El procedimiento combina dos datos ya conocidos: primero se calcula el vértice (específicamente
  $y_v$), y luego se usa el signo de $a$ para decidir si el intervalo va "hacia arriba"
  o "hacia abajo" desde ese valor.


  Para $f(x)=2x^2-4x+5$, con vértice $(1,3)$ y $a=2>0$: el recorrido es $[3,+\infty[$.'
definiciones_clave: '- **Determinación del recorrido de la función cuadrática a partir
  del vértice y la concavidad**: Elemento o parámetro esencial en la representación
  de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  determinación del recorrido de la función cuadrática a partir del vértice y la concavidad.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando determinación
    del recorrido de la función cuadrática a partir del vértice y la concavidad.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a determinación
    del recorrido de la función cuadrática a partir del vértice y la concavidad.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
