semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.RECORRIDO_DESDE_VERTICE
resumen_inicial: 'La determinación del recorrido (rango) de una función cuadrática se deduce a partir de la ordenada del vértice $y_v$ y del signo de $a$: si $a > 0$, $\text{Rec}(f) = [y_v, +\infty[$, y si $a < 0$, $\text{Rec}(f) = ]-\infty, y_v]$.'
explicacion_simple: "![La determinación del recorrido (rango) de una función cuadrática se deduce a partir de la ordenada del vértice $y_v$ y del signo de $a$: si $a > 0$, $\\text{Rec}(f) = [y_v, +\\infty[$, y si $a < 0$, $\\text{Rec}(f) = ]-\\infty, y_v]$](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-cuadratica-a-partir-del-vertice-y-la-concavidad-intro.svg)\n\n\nEl **recorrido** o **rango** son todas las alturas posibles ($y$) que alcanza la parábola en el plano:\n\n- **Si abre hacia arriba ($a > 0$):**\n  - El vértice es el piso más bajo ($y_v$).\n  - Desde ahí la parábola sube sin límite hasta el infinito.\n  - **Recorrido:** **$[y_v, +\\infty[$**.\n- **Si abre hacia abajo ($a < 0$):**\n  - La parábola viene desde el fondo del infinito negativo y sube hasta el techo del vértice ($y_v$).\n  - **Recorrido:** **$]-\\infty, y_v]$**.\n- **¡Ojo con los corchetes!** El vértice $y_v$ **SIEMPRE lleva corchete cerrado ($[$ o $]$)** porque la parábola sí toca ese punto exacto."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ con $f(x) = ax^2 + bx + c$ ($a \\neq 0$) y vértice $V(x_v, y_v)$ con $y_v = -\\frac{\\Delta}{4a}$. El **conjunto imagen o recorrido** $\\text{Rec}(f) = f(\\mathbb{R})$ se define como:\n$$\\text{Rec}(f) = \\{y \\in \\mathbb{R} \\mid \\exists x \\in \\mathbb{R} \\text{ tal que } f(x) = y\\}$$\n\n**Teorema del Recorrido Cuadrático**:\n1. **Caso $a > 0$ (Función Convexa Acotada Inferiormente)**:\n   $$\\text{Rec}(f) = [y_v, +\\infty[ = \\left[ -\\frac{\\Delta}{4a}, \\; +\\infty \\right[$$\n2. **Caso $a < 0$ (Función Cóncava Acotada Superiormente)**:\n   $$\\text{Rec}(f) = ]-\\infty, y_v] = \\left] -\\infty, \\; -\\frac{\\Delta}{4a} \\right]$$\n\n**Justificación topológica**: Por el Teorema del Valor Intermedio (TVI) aplicado a funciones continuas en $\\mathbb{R}$, la imagen es un intervalo conexo cerrado en el extremo $y_v$ y no acotado hacia el infinito."
definiciones_clave: '- **Recorrido / Rango**: Subconjunto de números reales que son imagen de al menos un elemento del dominio.

  - **Cota del recorrido**: Valor $y_v$ que delimita superior o inferiormente el intervalo de imágenes.'
propiedades_relaciones: '- **Dominio vs Recorrido**: El dominio es siempre $\mathbb{R}$ en toda función cuadrática; el recorrido es siempre un intervalo propio semi-infinito acotado por $y_v$.

  - **Existencia de preimágenes**: La ecuación $f(x) = k$ tiene solución real si y solo si $k \in \text{Rec}(f)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido (rango) de una función cuadrática se deduce a partir de la ordenada del vértice $y_v$ y del signo de $a$: si $a > 0$, $\text{Rec}(f) = [y_v, +\infty[$, y si $a < 0$, $\text{Rec}(f) = ]-\infty, y_v]$](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-cuadratica-a-partir-del-vertice-y-la-concavidad-ejemplos.svg)



    Determina el recorrido de las siguientes funciones cuadráticas:

    1) $f(x) = 2x^2 - 8x + 11$

    2) $g(x) = -x^2 + 6x - 4$'
  pasos:
  - 'Paso 1: Para $f(x) = 2x^2 - 8x + 11$:

    - $a = 2 > 0 \implies$ parábola cóncava hacia arriba ($\cup$).

    - $x_v = -\frac{-8}{2(2)} = 2$.

    - $y_v = f(2) = 2(4) - 8(2) + 11 = 8 - 16 + 11 = 3$.

    - Como $a > 0$, el recorrido va desde $y_v$ hacia $+\infty$:

    $\text{Rec}(f) = [3, +\infty[$.'
  - 'Paso 2: Para $g(x) = -x^2 + 6x - 4$:

    - $a = -1 < 0 \implies$ parábola cóncava hacia abajo ($\cap$).

    - $x_v = -\frac{6}{2(-1)} = 3$.

    - $y_v = g(3) = -(9) + 6(3) - 4 = -9 + 18 - 4 = 5$.

    - Como $a < 0$, el recorrido va desde $-\infty$ hasta $y_v$:

    $\text{Rec}(g) = ]-\infty, 5]$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función $f(x) = -3x^2 + 12$?
  choices:
  - text: ']-∞, 12]'
    is_correct: true
  - text: '[12, +∞['
    is_correct: false
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']-∞, 0]'
    is_correct: false
  explanation: La alternativa correcta es ']-∞, 12]'. Con $a = -3 < 0$, el vértice está en $(0, 12)$ y las ramas abren hacia abajo, dando $\text{Rec}(f) = ]-\infty, 12]$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el valor $y_v$ se escribe siempre con corchete CERRADO en el recorrido?
  choices:
  - text: Porque el valor y_v es alcanzado efectivamente por la función cuando x = x_v.
    is_correct: true
  - text: Porque es una asíntota.
    is_correct: false
  - text: Porque el discriminante es positivo.
    is_correct: false
  - text: Por convención arbitraria.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el valor y_v es alcanzado efectivamente por la función cuando x = x_v.'. Como $f(x_v) = y_v$, el punto pertenece a la imagen.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la abscisa del vértice $x_v = -\frac{b}{2a}$.'
- 'Paso 2: Calcular la ordenada del vértice $y_v = f(x_v)$.'
- 'Paso 3: Determinar el signo del coeficiente principal $a$.'
- 'Paso 4: Si $a > 0$, escribir $\text{Rec}(f) = [y_v, +\infty[$.'
- 'Paso 5: Si $a < 0$, escribir $\text{Rec}(f) = ]-\infty, y_v]$.'
errores_correccion: '- **Error común:** Escribir el recorrido con corchete abierto $]y_v, +\infty[$ o usar la abscisa $x_v$ en vez de la ordenada $y_v$.

  - **Cómo corregirlo:** El recorrido usa **siempre la cota vertical $y_v$ con corchete cerrado**: **$[y_v, +\infty[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido con ramas hacia arriba'
  enunciado: En $f(x) = x^2 - 6x + 10$, ¿cuál es el recorrido?
  alternativas:
  - '[1, +inf['
  - ']-inf, 1]'
  - '[3, +inf['
  - R
  respuesta: '[1, +inf['
  solucion_pasos:
  - 'Paso 1: $V(3, 1)$ con $a = 1 > 0 \implies \text{Rec}(f) = [1, +\infty[$.'
- titulo: 'Ejemplo 2: Recorrido con ramas hacia abajo'
  enunciado: Para $g(x) = -2x^2 + 4x + 1$, ¿cuál es su recorrido?
  alternativas:
  - ']-inf, 3]'
  - '[3, +inf['
  - ']-inf, 1]'
  - '[-2, +inf['
  respuesta: ']-inf, 3]'
  solucion_pasos:
  - 'Paso 1: $x_v = 1, y_v = 3$ con $a = -2 < 0 \implies \text{Rec}(g) = ]-\infty, 3]$.'
- titulo: 'Ejemplo 3: Recorrido de monomio cuadrático'
  enunciado: ¿Cuál es el recorrido de $h(x) = 5x^2$?
  alternativas:
  - '[0, +inf['
  - ']0, +inf['
  - '[5, +inf['
  - R
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: $V(0, 0)$ y $a > 0 \implies [0, +\infty[$.'
- titulo: 'Ejemplo 4: Pertenencia al recorrido'
  enunciado: Si $\text{Rec}(f) = [-4, +\infty[$, ¿cuál valor NO pertenece al recorrido?
  alternativas:
  - '-5'
  - '-4'
  - '0'
  - '10'
  respuesta: '-5'
  solucion_pasos:
  - 'Paso 1: $-5 < -4$, por lo que no pertenece al intervalo $[-4, +\infty[$.'
errores_frecuentes:
- Usar la coordenada x_v en vez de y_v en el intervalo del recorrido.
- Usar corchetes abiertos en y_v.
- Invertir el sentido del intervalo cuando a < 0.
afirmaciones_verdaderas:
- El recorrido de una función cuadrática es un intervalo semi-infinito delimitado por la ordenada del vértice y_v.
- Si a > 0 el recorrido es [y_v, +∞[, y si a < 0 el recorrido es ]-∞, y_v].
al_terminar_debes_poder: '**QUÉ:** Determinar el recorrido de una función cuadrática a partir de su vértice y concavidad.


  **CÓMO:** Calculando y_v = f(-b/(2a)) y formulando el intervalo [y_v, +∞[ si a > 0 o ]-∞, y_v] si a < 0.


