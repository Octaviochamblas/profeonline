procedimiento:
- 'Paso 1: Calcula la coordenada $y_v$ del vértice de la función.'
- 'Paso 2: Identifica el signo de $a$.'
- 'Paso 3: Si $a>0$, el recorrido es $[y_v,+\infty[$; si $a<0$, el recorrido es $]-\infty,y_v]$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en determinación del recorrido de la función cuadrática
  a partir del vértice y la concavidad.
ejemplos:
- titulo: Determinación de recorrido con a positivo
  enunciado: Determina el recorrido de $f(x)=x^2-6x+8$.
  solucion_pasos:
  - 'Vértice: $(3,-1)$; $a=1>0$.'
  - 'Recorrido: $[-1,+\infty[$.'
- titulo: Determinación de recorrido con a negativo
  enunciado: Determina el recorrido de $f(x)=-3x^2+12x-7$.
  solucion_pasos:
  - 'Vértice: $(2,5)$; $a=-3<0$.'
  - 'Recorrido: $]-\infty,5]$.'
- titulo: ¿El recorrido de una función cuadrática incluye siempre el valor $y_v$?
  enunciado: ¿El recorrido de una función cuadrática incluye siempre el valor $y_v$?
  respuesta: Sí
  solucion_pasos:
  - El valor $y_v$ se alcanza exactamente en $x=x_v$, por lo que siempre pertenece
    al recorrido.
- titulo: ¿El recorrido de una función cuadrática puede ser todo $\mathbb{R}$?
  enunciado: ¿El recorrido de una función cuadrática puede ser todo $\mathbb{R}$?
  respuesta: 'No'
  solucion_pasos:
  - Siempre está acotado por un lado (superior o inferior) debido a la existencia
    del vértice.
errores_frecuentes:
- Declarar el recorrido con el dominio, que siempre es $\mathbb{R}$ en una función
  cuadrática.
- Invertir la dirección del intervalo del recorrido según el signo de $a$.
- Usar paréntesis en vez de corchetes en el extremo donde se alcanza $y_v$, excluyéndolo
  incorrectamente.
- No calcular primero el vértice antes de intentar determinar el recorrido.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  determinación del recorrido de la función cuadrática a partir del vértice y la concavidad.
