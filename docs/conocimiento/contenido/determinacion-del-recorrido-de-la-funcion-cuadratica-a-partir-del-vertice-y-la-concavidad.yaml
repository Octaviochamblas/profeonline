semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.RECORRIDO_DESDE_VERTICE
resumen_inicial: 'El recorrido de una función cuadrática no restringida está acotado por la ordenada de su vértice $k$: $\operatorname{Rec}(f) = [k, +\infty[$ si $a > 0$, o $\operatorname{Rec}(f) = ]-\infty, k]$ si $a < 0$.'
explicacion_simple: |
  Mientras que el dominio de una función cuadrática son todos los números reales (las entradas $x$), el recorrido (las salidas $y$) tiene un límite claro marcado por el vértice. Si la parábola abre hacia arriba, la curva parte desde la altura $k$ del vértice y sube al infinito (recorrido desde $k$ hasta $+\infty$). Si abre hacia abajo, la curva viene desde $-\infty$ y sube únicamente hasta la altura $k$ del vértice (recorrido desde $-\infty$ hasta $k$).
explicacion_formal: |
  ### Definición formal
  El **recorrido o imagen** de la función cuadrática $f(x) = ax^2 + bx + c$ de vértice $V(h, k)$ es el conjunto de todos los valores de salida $y \in \mathbb{R}$ para los cuales existe una preimagen $x \in \mathbb{R}$:
  $$\operatorname{Rec}(f) = \{y \in \mathbb{R} \mid \exists x \in \mathbb{R}, f(x) = y\}$$
  Según el signo de $a$, el conjunto recorrido se expresa como un intervalo real semicerrado:
  - **Si $a > 0$**: $\operatorname{Rec}(f) = [k, +\infty[ = \left[\frac{4ac - b^2}{4a}, +\infty\right[$.
  - **Si $a < 0$**: $\operatorname{Rec}(f) = ]-\infty, k] = \left]-\infty, \frac{4ac - b^2}{4a}\right]$.

  ### Desglose simbólico
  - $k$: Límite o cota cerrada que pertenece al recorrido ($k \in \operatorname{Rec}(f)$).
  - Intervalos semicerrados: El corchete en $k$ es siempre **cerrado** porque el vértice es un punto alcanzado por la función ($f(h) = k$).

  ### Síntesis didáctica
  Diferenciar Dominio de Recorrido: El dominio son las entradas (siempre $\mathbb{R}$). El recorrido son las salidas, las cuales están siempre **acotadas por un lado** por la altura $k$ del vértice.
definiciones_clave: |
  - **Recorrido de la función cuadrática**: Conjunto de todos los valores $y$ que la parábola alcanza efectivamente en el plano.
  - **Cota del recorrido**: Valor $k = f(h)$ que actúa como extremo cerrado del intervalo de salidas.
  - **Intervalo semicerrado**: Notación $[k, +\infty[$ o $]-\infty, k]$ utilizada para formalizar el recorrido.
propiedades_relaciones: |
  - **Relación con la inecuación cuadrática**: La imagen $y$ pertenece al recorrido si y solo si el discriminante de la ecuación $ax^2 + bx + (c - y) = 0$ es no negativo ($\Delta_y \ge 0$).
  - **Efecto de la traslación vertical**: Sumar una constante $C$ a la función desplaza el intervalo del recorrido en $C$ unidades ($[k + C, +\infty[$).
ejemplo_guiado:
  enunciado: 'Calcula el recorrido formal de las funciones cuadráticas $f(x) = 2x^2 - 8x + 5$ y $g(x) = -3x^2 + 6x + 1$ determinando previamente sus vértices y concavidades.'
  pasos:
    - 'Paso 1: Para $f(x)$, $a = 2 > 0$. Calculamos $h = -\frac{-8}{2(2)} = 2$ y $k = f(2) = 2(2)^2 - 8(2) + 5 = 8 - 16 + 5 = -3$.'
    - 'Paso 2: Como $a > 0$, la parábola abre hacia arriba. Su recorrido es $\operatorname{Rec}(f) = [-3, +\infty[$.'
    - 'Paso 3: Para $g(x)$, $a = -3 < 0$. Calculamos $h = -\frac{6}{2(-3)} = 1$ y $k = g(1) = -3(1)^2 + 6(1) + 1 = 4$.'
    - 'Paso 4: Como $a < 0$, la parábola abre hacia abajo. Su recorrido es $\operatorname{Rec}(g) = ]-\infty, 4]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una función cuadrática tiene $a = -5 < 0$ y su vértice se encuentra en $V(2, 9)$, ¿cuál es su conjunto recorrido?'
    choices:
      - {text: '$\operatorname{Rec}(f) = ]-\infty, 9]$', is_correct: true}
      - {text: '$\operatorname{Rec}(f) = [9, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Rec}(f) = ]-\infty, 2]$', is_correct: false}
      - {text: '$\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Rec}(f) = ]-\infty, 9]$''. Al ser $a = -5 < 0$, abre hacia abajo y el recorrido va desde $-\infty$ hasta la ordenada $k = 9$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función cuadrática en forma canónica $p(x) = 3(x - 4)^2 - 7$, ¿cuál es su conjunto recorrido?'
    choices:
      - {text: '$\operatorname{Rec}(p) = [-7, +\infty[$', is_correct: true}
      - {text: '$\operatorname{Rec}(p) = [4, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Rec}(p) = ]-\infty, -7]$', is_correct: false}
      - {text: '$\operatorname{Rec}(p) = [-4, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Rec}(p) = [-7, +\infty[$''. La forma canónica da $a = 3 > 0$ y $k = -7$, produciendo el intervalo $[-7, +\infty[$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar el signo del coeficiente cuadrático $a$ ($a > 0$ o $a < 0$).'
  - 'Paso 2: Calcular la ordenada del vértice $k = f(h) = \frac{4ac - b^2}{4a}$.'
  - 'Paso 3: Construir el intervalo del recorrido: si $a > 0 \implies \operatorname{Rec}(f) = [k, +\infty[$; si $a < 0 \implies \operatorname{Rec}(f) = ]-\infty, k]$.'
errores_correccion: |
  - **Error 1:** Utilizar la abscisa del vértice $h$ para definir el intervalo del recorrido (ej: escribir $[h, +\infty[$). **Cómo corregirlo:** El recorrido consta de valores de salida $y$. Se debe utilizar siempre la ordenada del vértice $k = f(h)$, no la abscisa $h$.
  - **Error 2:** Escribir el corchete abierto en la cota del vértice (ej: $]k, +\infty[$). **Cómo corregirlo:** El punto del vértice pertenece a la función ($f(h) = k$), por lo que la cota $k$ debe llevar corchete cerrado $[k$ o $k]$.
ejemplos:
  - titulo: 'Recorrido de función cuadrática básica'
    enunciado: '¿Cuál es el recorrido de $f(x) = x^2 + 6$?'
    alternativas:
      - '$[6, +\infty[$'
      - '$\mathbb{R}$'
      - ']$-\infty, 6]$'
    respuesta: '$[6, +\infty[$'
    solucion_pasos:
      - '1. Coeficientes: $a = 1 > 0$, $b = 0$, $c = 6$.'
      - '2. Vértice: $h = 0$, $k = f(0) = 6$.'
      - '3. Como $a > 0$, $\operatorname{Rec}(f) = [6, +\infty[$.'
  - titulo: 'Recorrido de parábola cóncava hacia abajo'
    enunciado: '¿Cuál es el recorrido de $g(x) = -2x^2 + 8x$?'
    alternativas:
      - ']$-\infty, 8]$'
      - '$[8, +\infty[$'
      - ']$-\infty, 2]$'
    respuesta: ']$-\infty, 8]$'
    solucion_pasos:
      - '1. $a = -2 < 0$, $h = -\frac{8}{2(-2)} = 2$.'
      - '2. $k = g(2) = -2(2)^2 + 8(2) = -8 + 16 = 8$.'
      - '3. Como $a < 0$, $\operatorname{Rec}(g) = ]-\infty, 8]$.'
  - titulo: 'Cota finita en el recorrido'
    enunciado: '¿El recorrido de toda función cuadrática real no restringida está acotado superior e inferiormente a la vez?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. El recorrido de una función cuadrática está acotado únicamente por un solo lado (inferiormente si $a > 0$, o superiormente si $a < 0$).'
  - titulo: 'Pertenencia de la cota al recorrido'
    enunciado: 'Si una función tiene recorrido $[-4, +\infty[$, ¿el valor $y = -4$ pertenece al conjunto recorrido?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El corchete cerrado $[-4$ indica que $y = -4$ es un valor alcanzado en el vértice de la función.'
errores_frecuentes:
  - 'El recorrido de toda función cuadrática es igual al conjunto de los números reales $\mathbb{R}$.'
  - 'En la función $f(x) = x^2 - 4x + 5$, con vértice $V(2, 1)$, el recorrido es $[2, +\infty[$.'
  - 'Si una parábola tiene $a < 0$, su recorrido va desde la ordenada del vértice $k$ hasta $+\infty$.'
  - 'El intervalo del recorrido se escribe con el corchete abierto en el valor del vértice $k$.'
  - 'El término independiente $c$ da por sí solo la cota inferior del recorrido.'
afirmaciones_verdaderas:
  - 'El recorrido de una función cuadrática depende del signo de $a$ y de la ordenada del vértice $k$, siendo $[k, +\infty[$ si $a > 0$, o $]-\infty, k]$ si $a < 0$.'
  - 'A diferencia del dominio que es siempre $\mathbb{R}$, el recorrido de una función cuadrática es siempre un intervalo semicerrado acotado por $k$.'
al_terminar_debes_poder: 'Determinar el conjunto recorrido de cualquier función cuadrática a partir de la ordenada del vértice $k$ y el signo de $a$.'
