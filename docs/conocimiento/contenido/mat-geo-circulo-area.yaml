semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_CIRCULO
resumen_inicial: 'Cálculo del área del círculo usando πr²: conceptos, teoremas, propiedades
  geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Además de la longitud de su contorno (circunferencia), es fundamental
  saber calcular cuánta superficie ocupa un círculo completo.
explicacion_formal: '![Área del círculo: πr²](/static/img/geometria/circunferencia-circulo/circulo-area.svg)


  ### Definición formal


  El área de un círculo de radio $r$ es $A=\pi r^2$, es decir, π multiplicado por
  el cuadrado del radio.


  ### Desarrollo didáctico


  Un círculo de radio 6 cm tiene área $A=\pi\times6^2=36\pi\approx113,1$ cm². A diferencia
  de la longitud (que escala linealmente con r), el área escala con el cuadrado del
  radio, por lo que duplicar el radio cuadruplica el área.'
definiciones_clave: '- **Cálculo del área del círculo usando πr²**: Elemento o propiedad
