semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_PROPIA
resumen_inicial: Una fracción propia es aquella en la que el numerador es estrictamente
  menor que el denominador ($|a| < |b|$), representando un valor estrictamente menor
  que la unidad ($|\frac{a}{b}| < 1$).
explicacion_simple: Una fracción propia es una fracción en la que tomamos menos partes
  de las que componen la unidad entera. Como no alcanzamos a completar un entero completo,
  el número de arriba es más pequeño que el número de abajo y el valor final de la
  fracción es siempre menor que 1.
explicacion_formal: 'Para un racional $q = \frac{a}{b}$ con $a, b \in \mathbb{Z}$
  y $b \neq 0$, se define como **Fracción Propia** si y solo si sus valores absolutos
  cumplen la desigualdad estricta:


  $$|a| < |b| \iff \left| \frac{a}{b} \right| < 1$$


  **Desglose de la fórmula:**

  - $|a|$: Valor absoluto del numerador.

  - $|b|$: Valor absoluto del denominador.

  - $|q| < 1$: La magnitud geométrica del número racional es estrictamente menor que
  $1$.


  > **Complemento didáctico:** Ejemplos clásicos de fracciones propias son $\frac{1}{2},
  \frac{3}{4}, \frac{7}{10}$ y sus opuestos $-\frac{2}{5}$.'
definiciones_clave: '- **Fracción propia**: Fracción con $|a| < |b|$ cuyo valor numérico
  se encuentra en el intervalo $(-1, 1)$.'
propiedades_relaciones: '- **Acotamiento estricto**: Todo número racional propio $q$
  satisface $-1 < q < 1$.'
ejemplo_guiado:
  enunciado: Verifique si la fracción $\frac{5}{8}$ es una fracción propia comparando
    su numerador y su denominador.
  pasos:
  - 'Paso 1: Identificar el numerador ($a = 5$) y el denominador ($b = 8$).'
  - 'Paso 2: Comparar sus valores absolutos: $|5| = 5$ y $|8| = 8$.'
  - 'Paso 3: Verificar la desigualdad estricta: $5 < 8$.'
  - 'Paso 4: Calcular el valor decimal: $5 : 8 = 0,625 < 1$.'
  - 'Conclusión: Como el numerador es estrictamente menor que el denominador, $\frac{5}{8}$
    es una fracción propia.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición cumplen los valores absolutos del numerador y denominador
    en una fracción propia?
  choices:
  - text: '|a| < |b| (numerador menor que el denominador)'
    is_correct: true
  - text: '|a| > |b| (numerador mayor que el denominador)'
    is_correct: false
  - text: '|a| = |b| (numerador igual al denominador)'
    is_correct: false
  - text: '|b| = 0 (denominador cero)'
    is_correct: false
  explanation: La alternativa correcta es '|a| < |b| (numerador menor que el denominador)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con 5/8, ¿por qué se confirmó que es una fracción
    propia?
  choices:
  - text: Porque el numerador 5 es estrictamente menor que el denominador 8 y da 0,625
      < 1
    is_correct: true
  - text: Porque 5 y 8 son números pares
    is_correct: false
  - text: Porque da como resultado 1
    is_correct: false
  - text: Porque no se puede simplificar
    is_correct: false
  explanation: La alternativa correcta es 'Porque el numerador 5 es estrictamente
    menor que el denominador 8 y da 0,625 < 1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener los valores absolutos del numerador $a$ y del denominador $b$.'
- 'Paso 2: Comparar si se cumple $|a| < |b|$.'
- 'Paso 3: Declarar la fracción como propia si el numerador es estrictamente menor.'
errores_correccion: '- **Error 1: Clasificar $\frac{4}{4}$ como fracción propia.**
  **Cómo corregirlo:** En $\frac{4}{4}$ el numerador es IGUAL al denominador ($|a|=|b|$),
  por lo que es una fracción impropia/aparente igual a 1.


  - **Error 2: Pensar que las fracciones negativas no pueden ser propias.** **Cómo
  corregirlo:** La propiedad evalúa valores absolutos ($|-\frac{2}{3}| = \frac{2}{3}
  < 1$, por ende es propia).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes fracciones es una fracción propia?
  alternativas:
  - 3/7
  - 7/3
  - 5/5
  respuesta: 3/7
  solucion_pasos:
  - En 3/7, el numerador 3 es menor que el denominador 7 ($3 < 7$).
- titulo: Ejemplo 2
  enunciado: ¿Es la fracción -4/9 una fracción propia?
  alternativas:
  - Sí, porque |-4| < |9| (4 < 9)
  - No, porque es negativa
  - Solo si se convierte a mixto
  respuesta: Sí, porque |-4| < |9| (4 < 9)
  solucion_pasos:
  - $|-4/9| = 4/9 < 1$, por lo que es una fracción propia.
- titulo: ¿Es el valor numérico de toda fracción propia estrictamente menor que 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición $|a/b| < 1$.
- titulo: ¿Es 9/8 una fracción propia?
  respuesta: 'No'
  solucion_pasos:
  - No, 9 es mayor que 8 por lo que es una fracción impropia.
errores_frecuentes:
- Una fracción cuyo numerador es igual a su denominador se clasifica como fracción
  propia.
- Las fracciones negativas con numerador menor en valor absoluto son fracciones impropias.
- El valor decimal resultante de una fracción propia es siempre mayor o igual a 1.
- Una fracción propia se puede convertir directamente en un número mixto entero.
- El denominador de una fracción propia es siempre menor que su numerador.
afirmaciones_verdaderas:
- Una fracción propia tiene un numerador estrictamente menor que su denominador en
  valor absoluto.
- El valor numérico de toda fracción propia positiva se ubica entre 0 y 1.
al_terminar_debes_poder: Al terminar serás capaz de identificar fracciones propias,
  comprobando que el numerador sea estrictamente menor que el denominador ($|a| <
  |b|$) y su valor menor que 1.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
