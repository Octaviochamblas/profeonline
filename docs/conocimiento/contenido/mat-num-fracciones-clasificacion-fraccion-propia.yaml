semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_PROPIA
resumen_inicial: "Una fracción propia es aquella cuyo numerador es estrictamente menor que su denominador, representando un valor entre 0 y 1."
explicacion_simple: |
  Imagina que tienes una pizza completa dividida en 8 rebanadas iguales. Si te sirves 3 rebanadas, tienes la fracción $\frac{3}{8}$. Como 3 es menor que 8, no alcanzaste a comerte la pizza completa. Eso es una fracción propia: una porción de algo que es más pequeña que la unidad entera. En la recta numérica, todas las fracciones propias positivas se ubican en la franja entre el 0 y el 1.
explicacion_formal: |
  Formalmente, una fracción $\frac{a}{b}$ con $a, b \in \mathbb{Z}^+$ se clasifica como **fracción propia** si el numerador es estrictamente menor que el denominador:
  $$a < b$$

  En términos cuantitativos y geométricos, el valor absoluto de una fracción propia es estrictamente menor que la unidad ($1$):
  $0 < \left|\frac{a}{b}\right| < 1$
  Toda fracción propia representa una parte propia o estricta del entero de referencia, sin llegar a completarlo.
definiciones_clave: |
  - **Fracción propia**: Fracción positivo-positiva en la que el numerador es estrictamente menor que el denominador ($a < b$).
  - **Valor acotado por la unidad**: Propiedad numérica por la cual $0 < \frac{a}{b} < 1$.
  - **Porción propia**: Porción que no alcanza a cubrir la totalidad de la unidad de referencia.
propiedades_relaciones: |
  - **Acotación en la recta**: Toda fracción propia positiva se ubica en el intervalo abierto $]0, 1[$.
  - **Complemento a la unidad**: Para toda fracción propia $\frac{a}{b}$, existe una fracción propia complementaria $\frac{b-a}{b}$ tal que $\frac{a}{b} + \frac{b-a}{b} = 1$.
  - **Comportamiento ante potencias**: Al elevar una fracción propia a un exponente entero positivo $n > 1$, la potencia resultante es menor que la base original ($\left(\frac{a}{b}\right)^n < \frac{a}{b}$).
ejemplo_guiado:
  enunciado: "Analiza la expresión $\\frac{5}{12}$. Determina si corresponde a una fracción propia, calcula su posición respecto a $1$ y halla su fracción propia complementaria."
  pasos:
    - "Comparar numerador y denominador: $a = 5$ y $b = 12$. Como $5 < 12$, se confirma que es una fracción propia."
    - 'Determinar su magnitud respecto a la unidad: su valor decimal es $5 \div 12 \approx 0.4166$, verificando que $0 < 0.4166 < 1$.'
    - 'Calcular la fracción complementaria para llegar al entero: $\frac{12 - 5}{12} = \frac{7}{12}$, donde $\frac{5}{12} + \frac{7}{12} = \frac{12}{12} = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de las siguientes desiguadades define formalmente a una fracción propia $\\frac{a}{b}$ con $a, b > 0$?"
    choices:
      - {text: "El numerador es estrictamente menor que el denominador ($a < b$), lo que implica que $\\frac{a}{b} < 1$.", is_correct: true}
      - {text: "El numerador es estrictamente mayor que el denominador ($a > b$), lo que implica que $\\frac{a}{b} > 1$.", is_correct: false}
      - {text: "El numerador es exactamente igual al denominador ($a = b$), lo que implica que $\\frac{a}{b} = 1$.", is_correct: false}
      - {text: "El denominador es igual a cero ($b = 0$).", is_correct: false}
    explanation: "La correcta es El numerador es estrictamente menor que el denominador ($a < b$), lo que implica que $\\frac{a}{b} < 1$.: es la condición necesaria y suficiente para clasificar una fracción como propia."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Dada la fracción $\\frac{8}{15}$, ¿cuál es su fracción complementaria para completar la unidad entera?"
    choices:
      - {text: '\$\frac{7}{15}$', is_correct: true}
      - {text: '\$\frac{8}{15}$', is_correct: false}
      - {text: '\$\frac{15}{8}$', is_correct: false}
      - {text: '\$\frac{1}{15}$', is_correct: false}
    explanation: "La correcta es \\frac{7}{15}: restando $15 - 8 = 7$, se obtiene la parte faltante $\\frac{7}{15}$ para sumar $\\frac{15}{15} = 1$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el numerador $a$ y el denominador $b$ de la fracción dada."
  - "Paso 2: Comparar cuantitativamente ambos valores ($a$ vs $b$)."
  - "Paso 3: Si $a < b$, clasificar la fracción como propia."
errores_correccion: |
  Un error común es confundir fracción propia con fracción impropia cuando están escritas con denominadores grandes (por ejemplo, dudar si $\frac{99}{100}$ es propia). Recuerda que no importa qué tan grandes sean los números: si el de arriba es menor que el de abajo, sigue siendo propia y menor que $1$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál de las siguientes fracciones es una fracción propia?"
    alternativas:
      - '\$\frac{4}{9}$'
      - '\$\frac{9}{4}$'
      - '\$\frac{9}{9}$'
    respuesta: '\$\frac{4}{9}$'
    solucion_pasos:
      - 'En $\frac{4}{9}$, el numerador 4 es menor que el denominador 9 ($4 < 9$).'
      - 'Por lo tanto, $\frac{4}{9}$ es una fracción propia.'
  - titulo: "Ejemplo 2"
    enunciado: "En un estanque de 20 litros se han vertido 13 litros de agua. ¿La fracción de estanque ocupado es una fracción propia?"
    alternativas:
      - 'Sí, es \$\frac{13}{20}$ y es propia porque 13 < 20.'
      - 'No, es \$\frac{20}{13}$ y es impropia.'
      - "No, porque representa exactamente un entero."
    respuesta: 'Sí, es \$\frac{13}{20}$ y es propia porque 13 < 20.'
    solucion_pasos:
      - 'La fracción de ocupación es $\frac{13}{20}$.'
      - "Como $13 < 20$, la porción es menor al estanque completo ($1$), tratándose de una fracción propia."
  - titulo: "¿Se ubica cualquier fracción propia positiva entre el 0 y el 1 en la recta numérica?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, al ser $a < b$ para números positivos, el cociente siempre se encuentra en el intervalo $]0, 1[$."
  - titulo: "¿Puede una fracción propia ser convertida a número mixto?"
    respuesta: "No"
    solucion_pasos:
      - "No, los números mixtos se reservan para fracciones impropias ($a > b$) que contienen al menos un entero completo."
errores_frecuentes:
  - 'Clasificar como propia una fracción cuyo numerador es igual al denominador (como $\frac{5}{5}$).'
  - 'Creer que si los números son muy grandes (como $\frac{899}{900}$), la fracción deja de ser propia.'
  - "Intentar extraer partes enteras de una fracción propia para transformarla a número mixto."
  - "Confundir la condición de fracción propia con que el numerador deba ser obligatoriamente igual a 1."
  - "Asumir que elevar al cuadrado una fracción propia da como resultado un número más grande."
afirmaciones_verdaderas:
  - 'En toda fracción propia positiva $\frac{a}{b}$, se cumple que el numerador es estrictamente menor que el denominador ($a < b$).'
  - "El valor cuantitativo de una fracción propia positiva es siempre estrictamente menor que $1$."
al_terminar_debes_ponder: |
  Debes ser capaz de identificar inmediatamente una fracción propia $\frac{a}{b}$, verificar la condición $a < b$ y relacionar su valor con el intervalo $]0, 1[$ en la recta numérica.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
