semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_CIRCUNFERENCIA_DIAMETRO
resumen_inicial: 'Cálculo de la longitud de la circunferencia usando πd: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Existe una forma alternativa y equivalente de calcular la longitud
  de una circunferencia, usando directamente el diámetro en vez del radio.
explicacion_formal: '![Longitud de la circunferencia: πd](/static/img/geometria/circunferencia-circulo/circulo-longitud-circunferencia-diametro.svg)


  ### Definición formal


  La longitud de una circunferencia de diámetro $d$ es $L=\pi d$. Esta fórmula es
  equivalente a $L=2\pi r$, ya que $d=2r$.


  ### Desarrollo didáctico


  Una circunferencia de diámetro 14 cm tiene longitud $L=\pi\times14\approx43,98$
  cm. Históricamente, esta es la definición original de π: la razón constante entre
  la longitud de cualquier circunferencia y su diámetro ($\pi=L/d$).'
definiciones_clave: '- **Cálculo de la longitud de la circunferencia usando πd**:
