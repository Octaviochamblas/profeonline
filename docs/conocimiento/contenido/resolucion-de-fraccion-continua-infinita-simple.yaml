semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.FRACCION_CONTINUA_INFINITA
resumen_inicial: Una fracción continua infinita periódica se resuelve sustituyendo el patrón infinito por la propia variable y resolviendo la ecuación cuadrática resultante.
explicacion_simple: |
  Una fracción continua infinita es una torre de fracciones que se repite indefinidamente hacia abajo.

  Aunque a primera vista parezca imposible de calcular, se resuelve aplicando un principio algebraico de auto-similitud:

  Definimos la variable $x$ como el valor completo de la expresión infinita. Dado que la torre no tiene fin, el patrón repetitivo ubicado debajo del primer nivel es EXACTAMENTE equivalente a la misma $x$.

  Esto nos permite plantear una ecuación cuadrática sencilla $x = a + \frac{1}{x}$ y despejar el valor numérico exacto.
explicacion_formal: |
  ### Definición formal
  Sea la **fracción continua infinita pura** definida de forma autorreferencial como:

  $$x = a + \frac{1}{a + \frac{1}{a + \frac{1}{\dots}}} \implies x = a + \frac{1}{x}$$

  ### Resolución de la ecuación cuadrática
  1. Multiplicar por $x > 0$: $x^2 = a x + 1 \implies x^2 - a x - 1 = 0$.
  2. Aplicar la fórmula cuadrática seleccionando la raíz real positiva: $x = \frac{a + \sqrt{a^2 + 4}}{2}$ (puesto que una torre de sumas positivas impone $x > 0$).

  ### Síntesis didáctica
  Explotar la propiedad de auto-similitud sustituyendo el patrón infinito por $x$ convierte la cascada infinita en una ecuación polinomial de segundo grado.
definiciones_clave: |
  - **Fracción continua infinita**: Estructura autorreferencial infinita con patrón periódico de repetibilidad.
  - **Auto-similitud matemática**: Propiedad por la cual una sub-estructura infinita es idéntica a la estructura completa original.
propiedades_relaciones: |
  - **Relación con la Razón Áurea**: Para $a = 1$, la fracción continua infinita $x = 1 + \frac{1}{1 + \dots}$ entrega como solución exacta el Número de Oro $\phi = \frac{1 + \sqrt{5}}{2} \approx 1{,}618$.
ejemplo_guiado:
  enunciado: 'Determina el valor numérico exacto de la fracción continua infinita $x = 2 + \frac{1}{2 + \frac{1}{2 + \dots}}$ resolviendo su ecuación cuadrática asociada.'
  pasos:
    - 'Paso 1: Reconocer la auto-similitud: $x = 2 + \frac{1}{x}$.'
    - 'Paso 2: Multiplicar por $x$ para eliminar el denominador: $x^2 = 2x + 1$.'
    - 'Paso 3: Formular la ecuación cuadrática estándar: $x^2 - 2x - 1 = 0$.'
    - 'Paso 4: Aplicar la fórmula cuadrática con $a = 1, b = -2, c = -1$: $x = \frac{2 \pm \sqrt{(-2)^2 - 4(1)(-1)}}{2} = \frac{2 \pm \sqrt{4 + 4}}{2} = \frac{2 \pm \sqrt{8}}{2} = 1 \pm \sqrt{2}$.'
    - 'Paso 5: Como la fracción con términos positivos exige $x > 0$, la solución real exacta es $x = 1 + \sqrt{2} \approx 2{,}414$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación algebraica que representa a la fracción continua infinita $x = a + \frac{1}{a + \frac{1}{\dots}}$?'
    choices:
      - {text: '$x = a + \frac{1}{x}$', is_correct: true}
      - {text: '$x = a + x$', is_correct: false}
      - {text: '$x^2 = a + 1$', is_correct: false}
      - {text: '$x = \frac{a}{x}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = a + \frac{1}{x}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver $x = 2 + \frac{1}{2 + \frac{1}{\dots}}$, ¿cuál es el valor real positivo exacto obtenido?'
    choices:
      - {text: '$1 + \sqrt{2}$', is_correct: true}
      - {text: '$1 - \sqrt{2}$', is_correct: false}
      - {text: '$\sqrt{5}$', is_correct: false}
      - {text: '$2 + \sqrt{2}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$1 + \sqrt{2}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Asignar la variable $x$ a la fracción continua infinita completa.'
  - 'Paso 2: Identificar el patrón periódico que se repite infinitamente en el denominador.'
  - 'Paso 3: Reemplazar todo el patrón infinito por la variable $x$, formulando la ecuación $x = a + \frac{1}{x}$.'
  - 'Paso 4: Resolver la ecuación cuadrática resultante $x^2 - ax - 1 = 0$.'
  - 'Paso 5: Seleccionar la solución real positiva descartando la raíz negativa.'
errores_correccion: |
  - **Error 1:** Seleccionar la raíz negativa obtenida al aplicar la fórmula cuadrática. **Cómo corregirlo:** Una fracción continua de términos positivos **PRODUCE SIEMPRE UN NÚMERO REAL POSITIVO; SE DEBE DESCARTAR LA RAÍZ NEGATIVA**.
  - **Error 2:** Sustituir la sub-fracción por una variable distinta en lugar de utilizar la misma $x$. **Cómo corregirlo:** Puesto que la torre es infinita, **LA SUB-ESTRUCTURA ES RIGUROSAMENTE IDÉNTICA A LA VARIABLE $x$ ORIGINAL**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el valor exacto de la fracción continua infinita del Número de Oro $x = 1 + \frac{1}{1 + \dots}$?'
    alternativas:
      - '$\frac{1 + \sqrt{5}}{2}$'
      - '$\frac{1 - \sqrt{5}}{2}$'
      - '$\sqrt{5}$'
    respuesta: '$\frac{1 + \sqrt{5}}{2}$'
    solucion_pasos:
      - '1. Ecuación: $x = 1 + \frac{1}{x} \implies x^2 - x - 1 = 0$.'
      - '2. Solución positiva: $x = \frac{1 + \sqrt{5}}{2}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al plantear $x = 3 + \frac{1}{x}$, ¿cuál es la ecuación cuadrática canónica equivalente?'
    alternativas:
      - '$x^2 - 3x - 1 = 0$'
      - '$x^2 + 3x - 1 = 0$'
      - '$x^2 - 3x + 1 = 0$'
    respuesta: '$x^2 - 3x - 1 = 0$'
    solucion_pasos:
      - '1. Multiplicar por $x$: $x^2 = 3x + 1$.'
      - '2. Igualar a cero: $x^2 - 3x - 1 = 0$.'
  - titulo: 'Propiedad de auto-similitud'
    enunciado: '¿El patrón infinito que está en el denominador es idéntico a la expresión completa $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al restar un nivel a una torre infinita esta sigue siendo infinita.'
  - titulo: 'Signo de la solución'
    enunciado: '¿Una fracción continua de términos positivos puede converger a un valor negativo?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la suma de valores positivos es estrictamente mayor que cero.'
errores_frecuentes:
  - 'Aceptar la solución negativa de la ecuación cuadrática asociada.'
  - 'Sustituir el patrón infinito por un número arbitrario en lugar de la variable $x$.'
  - 'Cometer errores de signo al transponer términos para formar la ecuación cuadrática estándar.'
  - 'Omitir la multiplicación por $x$ para deshacer la sub-fracción en el planteamiento.'
  - 'Intentar aproximar por truncamiento en lugar de resolver la ecuación exacta.'
afirmaciones_verdaderas:
  - 'Una fracción continua infinita periódica se convierte en una ecuación cuadrática al aplicar auto-similitud.'
  - 'La solución de una fracción continua de sumandos positivos es siempre la raíz real positiva de la cuadrática.'
al_terminar_debes_poder: |
  QUÉ: Resolver fracciones continuas infinitas simples.
  CÓMO: Reemplazar el patrón infinito por la propia variable $x$, plantear la ecuación cuadrática asociada y determinar su raíz real positiva.
