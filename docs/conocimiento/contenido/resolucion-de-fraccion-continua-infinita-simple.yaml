semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.FRACCION_CONTINUA_INFINITA
resumen_inicial: Una fracción continua infinita periódica se resuelve sustituyendo
  el patrón infinito por la propia variable y resolviendo la ecuación cuadrática resultante.
explicacion_simple: 'Una fracción continua infinita es una torre de fracciones que
  se repite eternamente hacia abajo.

  Aunque parece imposible de calcular por no tener fin, se resuelve con un truco algebraico
  genial:

  Llamamos $x$ a toda la expresión infinita. Como la torre es infinita, el patrón
  que se repite debajo del primer nivel es EXACTAMENTE la misma $x$.

  Esto nos permite escribir una ecuación cuadrática sencilla $x = a + \frac{1}{x}$
  y encontrar el valor exacto de la expresión.'
explicacion_formal: 'Sea la **fracción continua infinita pura** definida de forma
  autorreferencial como:


  $$x = a + \frac{1}{a + \frac{1}{a + \frac{1}{\dots}}} \implies x = a + \frac{1}{x}$$


  **Resolución de la ecuación cuadrática:**

  1. Multiplicar por $x > 0$: $x^2 = a x + 1 \implies x^2 - a x - 1 = 0$.

  2. Aplicar fórmula cuadrática tomando la raíz positiva: $x = \frac{a + \sqrt{a^2
  + 4}}{2}$ (la solución positiva por la condición de la fracción).'
definiciones_clave: '- **Fracción continua infinita**: Estructura autorreferencial
  infinita con patrón periódico de repetibilidad.

  - **Auto-similitud matemática**: Propiedad por la cual una sub-estructura infinita
  es idéntica a la estructura completa original.'
propiedades_relaciones: '- **Relación con la Razón Áurea**: Para $a = 1$, la fracción
  continua infinita $x = 1 + \frac{1}{1 + \dots}$ da como solución exacta el Número
  de Oro $\phi = \frac{1 + \sqrt{5}}{2} \approx 1{,}618$.'
ejemplo_guiado:
  enunciado: Determina el valor numérico exacto de la fracción continua infinita $x
    = 2 + \frac{1}{2 + \frac{1}{2 + \dots}}$ resolviendo su ecuación cuadrática asociada.
  pasos:
  - 'Paso 1: Reconocer la auto-similitud: $x = 2 + \frac{1}{x}$.Paso 2: Multiplicar
    por $x$ para eliminar el denominador: $x^2 = 2x + 1$.Paso 3: Formular la ecuación
    cuadrática estándar: $x^2 - 2x - 1 = 0$.Paso 4: Aplicar la fórmula cuadrática
    con $a = 1, b = -2, c = -1$: $x = \frac{2 \pm \sqrt{(-2)^2 - 4(1)(-1)}}{2} = \frac{2
    \pm \sqrt{4 + 4}}{2} = \frac{2 \pm \sqrt{8}}{2} = 1 \pm \sqrt{2}$.Paso 5: Como
    la fracción con términos positivos exige $x > 0$, la solución real exacta es $x
    = 1 + \sqrt{2} \approx 2{,}414$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación algebraica que representa a la fracción continua
    infinita $x = a + \frac{1}{a + \frac{1}{\dots}}$?
  choices:
  - text: $x = a + \frac{1}{x}$
    is_correct: true
  - text: $x = a + x$
    is_correct: false
  - text: $x^2 = a + 1$
    is_correct: false
  - text: $x = \frac{a}{x}$
    is_correct: false
  explanation: La alternativa correcta es '$x = a + \frac{1}{x}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $x = 2 + \frac{1}{2 + \frac{1}{\dots}}$, ¿cuál es el valor
    real positivo exacto obtenido?
  choices:
  - text: $1 + \sqrt{2}$
    is_correct: true
  - text: $1 - \sqrt{2}$
    is_correct: false
  - text: $\sqrt{5}$
    is_correct: false
  - text: $2 + \sqrt{2}$
    is_correct: false
  explanation: La alternativa correcta es '$1 + \sqrt{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asignar la variable $x$ a la fracción continua infinita completa.'
- 'Paso 2: Identificar el patrón periódico que se repite infinitamente en el denominador.'
- 'Paso 3: Reemplazar todo el patrón infinito por la variable $x$, formulando la ecuación
  $x = a + \frac{1}{x}$.'
- 'Paso 4: Resolver la ecuación cuadrática $x^2 - ax - 1 = 0$.'
- 'Paso 5: Seleccionar la raíz real positiva como la solución válida.'
errores_correccion: '- **Error común:** Tomar la solución negativa de la ecuación
  cuadrática.

  - **Cómo corregirlo:** Una fracción continua compuesta por sumas y términos positivos
  produce siempre un número real POSITIVO. Descarta la raíz negativa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración de fracción compleja.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de fracción compleja.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se aplica extremos y medios en fracciones complejas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla básica de simplificación.
- titulo: ¿Las fracciones continuas infinitas se resuelven con ecuaciones cuadráticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, aprovechando su propiedad de auto-similitud.
errores_frecuentes:
- Confundir la barra principal de división con las barras secundarias.
- Invertir los medios y ponerlos en el numerador en la regla de extremos y medios.
- Multiplicar por el m.c.m. solo algunos términos omitiendo el denominador.
- Intentar resolver fracciones continuas finitas de arriba hacia abajo.
- Aceptar soluciones negativas al resolver fracciones continuas infinitas de términos
  positivos.
afirmaciones_verdaderas:
- Una fracción compleja se simplifica multiplicando extremos con extremos y medios
  con medios.
- Multiplicar numerador y denominador por el m.c.m. de las sub-fracciones elimina
  la complejidad en un solo paso.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, simplificar
  y resolver fracciones algebraicas complejas y continuas expresando el resultado
  en su forma más simple.
