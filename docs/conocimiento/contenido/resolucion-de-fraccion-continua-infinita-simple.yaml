procedimiento:
- 'Paso 1: Asigna una variable (ej. $x$) a toda la fracción infinita.'
- 'Paso 2: Observa el patrón y encuentra el bloque infinito interior que sea idéntico
  a tu fracción original.'
- 'Paso 3: Reemplaza ese bloque interno por la variable $x$.'
- 'Paso 4: Resuelve la ecuación algebraica resultante.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en resolución de fracción continua infinita simple.
ejemplos:
- titulo: Halla el valor de $y = 2 + \frac{3}{2 + \frac{3}{2 + \dots}}$
  enunciado: Halla el valor de $y = 2 + \frac{3}{2 + \frac{3}{2 + \dots}}$
  solucion_pasos:
  - La parte que se repite en el denominador $2 + \frac{3}{\dots}$ es igual a $y$.
  - 'Ecuación: $y = 2 + \frac{3}{y}$.'
  - 'Multiplica por y: $y^2 = 2y + 3$.'
  - 'Cuadrática: $y^2 - 2y - 3 = 0$.'
  - 'Factoriza: $(y-3)(y+1) = 0$.'
  - Como los términos son positivos, el valor es $y=3$.
- titulo: En la expresión $z = 4 - \frac{1}{4 - \dots}$, ¿cuál es la ecuación a resolver?
  solucion_pasos:
  - Todo el denominador se reemplaza por z.
- titulo: 'Respecto de «Resolución de fracción continua infinita simple»: ¿Es correcta
    esta caracteriza'
  enunciado: 'Respecto de «Resolución de fracción continua infinita simple»: ¿Es correcta
    esta caracterización? «Para evaluar una fracción infinita repetitiva $x = 1 +
    \frac{1}{1 + \dots}$, se sustituye la porción repetida por la variable $x$, creando
    una ecuación cuadrática a resolver»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para evaluar una fracción infinita
    repetitiva $x = 1 + \frac{1}{1 + \dots}$, se sustituye la porción repetida por
    la variable $x$, creando una ecuación cuadrática a resolver.'
- titulo: 'Respecto de «Resolución de fracción continua infinita simple»: ¿Es válida
    esta afirmación? «'
  enunciado: 'Respecto de «Resolución de fracción continua infinita simple»: ¿Es válida
    esta afirmación? «Asumir que por ser infinito no tiene un valor o diverge (muchas
    de estas convergen)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para evaluar una fracción infinita
    repetitiva $x = 1 + \frac{1}{1 + \dots}$, se sustituye la porción repetida por
    la variable $x$, creando una ecuación cuadrática a resolver.'
errores_frecuentes:
- Asumir que por ser infinito no tiene un valor o diverge (muchas de estas convergen).
- Reemplazar en el lugar incorrecto perdiendo la estructura de la ecuación.
- Sumar los primeros 100 términos.
- Para «El truco para resolver una fracción continua periódica infinita consiste en:»,
  la respuesta correcta es Dividir por infinito.
- Tachar los números repetidos.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
