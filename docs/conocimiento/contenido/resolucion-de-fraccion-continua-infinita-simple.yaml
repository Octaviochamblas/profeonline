procedimiento:
- 'Paso 1: Asignar la variable $x$ a la fracción continua infinita completa.'
- 'Paso 2: Identificar el patrón periódico que se repite infinitamente en el denominador.'
- 'Paso 3: Reemplazar todo el patrón infinito por la variable $x$, formulando la ecuación $x = a + \frac{1}{x}$.'
- 'Paso 4: Resolver la ecuación cuadrática resultante $x^2 - ax - 1 = 0$.'
- 'Paso 5: Seleccionar la solución real positiva descartando la raíz negativa.'
errores_correccion: '- **Error 1:** Seleccionar la raíz negativa obtenida al aplicar la fórmula cuadrática. **Cómo corregirlo:**
  Una fracción continua de términos positivos **PRODUCE SIEMPRE UN NÚMERO REAL POSITIVO; SE DEBE DESCARTAR LA RAÍZ NEGATIVA**.

  - **Error 2:** Sustituir la sub-fracción por una variable distinta en lugar de utilizar la misma $x$. **Cómo corregirlo:**
  Puesto que la torre es infinita, **LA SUB-ESTRUCTURA ES RIGUROSAMENTE IDÉNTICA A LA VARIABLE $x$ ORIGINAL**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor exacto de la fracción continua infinita del Número de Oro $x = 1 + \frac{1}{1 + \dots}$?
  alternativas:
  - $\frac{1 + \sqrt{5}}{2}$
  - $\frac{1 - \sqrt{5}}{2}$
  - $\sqrt{5}$
  respuesta: $\frac{1 + \sqrt{5}}{2}$
  solucion_pasos:
  - '1. Ecuación: $x = 1 + \frac{1}{x} \implies x^2 - x - 1 = 0$.'
  - '2. Solución positiva: $x = \frac{1 + \sqrt{5}}{2}$.'
- titulo: Ejemplo 2
  enunciado: Al plantear $x = 3 + \frac{1}{x}$, ¿cuál es la ecuación cuadrática canónica equivalente?
  alternativas:
  - $x^2 - 3x - 1 = 0$
  - $x^2 + 3x - 1 = 0$
  - $x^2 - 3x + 1 = 0$
  respuesta: $x^2 - 3x - 1 = 0$
  solucion_pasos:
  - '1. Multiplicar por $x$: $x^2 = 3x + 1$.'
  - '2. Igualar a cero: $x^2 - 3x - 1 = 0$.'
- titulo: Propiedad de auto-similitud
  enunciado: ¿El patrón infinito que está en el denominador es idéntico a la expresión completa $x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, al restar un nivel a una torre infinita esta sigue siendo infinita.
- titulo: Signo de la solución
  enunciado: ¿Una fracción continua de términos positivos puede converger a un valor negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, la suma de valores positivos es strictly mayor que cero.
errores_frecuentes:
- Al resolver la ecuación cuadrática $x^2 - x - 1 = 0$ para $x = 1 + \frac{1}{1 + \dots}$, seleccionar la raíz negativa $\frac{1-\sqrt{5}}{2}$.
- Asumir que la expresión infinita $x = a + \frac{1}{a + \dots}$ equivale a la ecuación lineal $x = a + 1$.
- Al transponer los términos en $x = 2 + \frac{1}{x}$, formular erróneamente $x^2 + 2x + 1 = 0$.
- Reemplazar el patrón repetitivo ubicado en el denominador por una constante fija en lugar de la variable $x$.
- Considerar que una fracción continua de sumandos estrictamente positivos puede converger a un valor negativo.
afirmaciones_verdaderas:
- Una fracción continua infinita periódica se convierte en una ecuación cuadrática al aplicar auto-similitud.
- La solución de una fracción continua de sumandos positivos es siempre la raíz real positiva de la cuadrática.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/resolucion-de-fraccion-continua-infinita-simple-resumen.svg)


  QUÉ: Resolver fracciones continuas infinitas simples.

  CÓMO: Reemplazar el patrón infinito autorreferencial por la propia variable $x$ ($x = a + \frac{1}{x}$), plantear la ecuación
  cuadrática asociada ($x^2 - ax - 1 = 0$) y determinar su raíz real positiva ($x = \frac{a + \sqrt{a^2+4}}{2} > 0$).

  '
