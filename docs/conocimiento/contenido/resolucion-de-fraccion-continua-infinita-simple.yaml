semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.FRACCION_CONTINUA_INFINITA
resumen_inicial: Una fracción continua infinita periódica se resuelve sustituyendo el patrón infinito por la propia variable
  y resolviendo la ecuación cuadrática resultante.
explicacion_simple: 'Una fracción continua infinita es una torre de fracciones que se repite indefinidamente hacia abajo.


  Aunque a primera vista parezca imposible de calcular, se resuelve aplicando un principio algebraico de auto-similitud:


  Definimos la variable $x$ como el valor completo de la expresión infinita. Dado que la torre no tiene fin, el patrón repetitivo
  ubicado debajo del primer nivel es EXACTAMENTE equivalente a la misma $x$.


  Esto nos permite plantear una ecuación cuadrática sencilla $x = a + \frac{1}{x}$ y despejar el valor numérico exacto.


  ![Resolución de fracción continua infinita](/static/img/nodos/resolucion-de-fraccion-continua-infinita-simple-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea la **fracción continua infinita pura** definida de forma autorreferencial como:


  $$x = a + \frac{1}{a + \frac{1}{a + \frac{1}{\dots}}} \implies x = a + \frac{1}{x}$$


  ### Resolución de la ecuación cuadrática

  1. Multiplicar por $x > 0$: $x^2 = a x + 1 \implies x^2 - a x - 1 = 0$.

  2. Aplicar la fórmula cuadrática seleccionando la raíz real positiva: $x = \frac{a + \sqrt{a^2 + 4}}{2}$ (puesto que una
  torre de sumas positivas impone $x > 0$).


  ### Síntesis didáctica

  Explotar la propiedad de auto-similitud sustituyendo el patrón infinito por $x$ convierte la cascada infinita en una ecuación
  polinomial de segundo grado.

  '
definiciones_clave: '- **Fracción continua infinita**: Estructura autorreferencial infinita con patrón periódico de repetibilidad.

  - **Auto-similitud matemática**: Propiedad por la cual una sub-estructura infinita es idéntica a la estructura completa
  original.

  '
propiedades_relaciones: '- **Relación con la Razón Áurea**: Para $a = 1$, la fracción continua infinita $x = 1 + \frac{1}{1
  + \dots}$ entrega como solución exacta el Número de Oro $\phi = \frac{1 + \sqrt{5}}{2} \approx 1{,}618$.

  '
ejemplo_guiado:
  enunciado: Determina el valor numérico exacto de la fracción continua infinita $x = 2 + \frac{1}{2 + \frac{1}{2 + \dots}}$
    resolviendo su ecuación cuadrática asociada.
  pasos:
  - 'Paso 1: Reconocer la auto-similitud: $x = 2 + \frac{1}{x}$.'
  - 'Paso 2: Multiplicar por $x$ para eliminar el denominador: $x^2 = 2x + 1$.'
  - 'Paso 3: Formular la ecuación cuadrática estándar: $x^2 - 2x - 1 = 0$.'
  - 'Paso 4: Aplicar la fórmula cuadrática con $a = 1, b = -2, c = -1$: $x = \frac{2 \pm \sqrt{(-2)^2 - 4(1)(-1)}}{2} = \frac{2
    \pm \sqrt{4 + 4}}{2} = \frac{2 \pm \sqrt{8}}{2} = 1 \pm \sqrt{2}$.'
  - 'Paso 5: Como la fracción con términos positivos exige $x > 0$, la solución real exacta es $x = 1 + \sqrt{2} \approx 2{,}414$.'
  imagen: /static/img/nodos/resolucion-de-fraccion-continua-infinita-simple-ejemplos.svg
