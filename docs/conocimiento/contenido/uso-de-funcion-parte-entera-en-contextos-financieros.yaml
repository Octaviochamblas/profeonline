semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_CONTEXTO_FINANCIERO
resumen_inicial: 'Uso de función parte entera en contextos financieros: conceptos,
  representación y propiedades en Simetrías y funciones especiales.'
explicacion_simple: Los cajeros automáticos, los sistemas de nómina y las conversiones
  de divisas comparten un problema común, muchas veces solo se pueden entregar o registrar
  unidades completas, nunca fracciones.
explicacion_formal: '### Definición formal


  Si una cantidad continua $x$ debe expresarse en unidades discretas indivisibles
  (como billetes de cierto valor, o acciones completas), la cantidad máxima disponible
  sin exceder $x$ es $\lfloor x \rfloor$ (o una variante escalada según el valor de
  la unidad).


  ### Desarrollo didáctico


  El principio financiero detrás de la parte entera es "nunca puedes entregar o registrar
  más de lo que realmente tienes", por lo que siempre se redondea hacia abajo, nunca
  hacia arriba.


  Si un cajero automático solo entrega billetes de \$10.000 y un cliente solicita
  retirar \$47.300, el cajero solo puede entregar $\lfloor 47300/10000 \rfloor = 4$
  billetes, es decir \$40.000 (el resto quedaría como saldo no retirable en esa transacción).'
definiciones_clave: '- **Uso de función parte entera en contextos financieros**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
