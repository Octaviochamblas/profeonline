errores_frecuentes:
  - 'En un contrato bancario sin prorrateo, permanecer 7,9 meses equivale a cobrar intereses por 8 meses enteros.'
  - 'La función parte entera en contextos financieros multiplica el capital inicial por un exponente cuadrático.'
  - 'Vender productos en cajas cerradas de 12 unidades permite vender fracciones decimales de cajas al mismo precio.'
  - 'Aplicar la función parte entera a un saldo bancario negativo devuelve un saldo positivo de mayor valor.'
  - 'Los intereses liquidados por periodos enteros cambian continuamente a cada segundo sin saltos.'
afirmaciones_verdaderas:
  - 'La función parte entera se utiliza en finanzas para modelar liquidaciones de intereses, comisiones o ventas donde las fracciones no generan derechos hasta completar el ciclo entero.'
  - 'El modelo $N = K \cdot \lfloor V / B \rfloor$ asigna beneficios exclusivamente a la cantidad de bloques enteros cumplidos.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas financieros y comerciales mediante el uso de la función parte entera.
  CÓMO: Determinar el número de periodos enteros completos $\lfloor V / B \rfloor$ y calcular el rendimiento o beneficio económico discreto.
