semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_CONTEXTO_FINANCIERO
resumen_inicial: En contextos financieros, la parte entera modela liquidaciones de
  intereses por períodos cumplidos, divisas no fraccionables y tramos tributarios.
explicacion_simple: 'En el mundo financiero y comercial, muchas cosas solo ocurren
  en **unidades enteras**:

  - **Intereses bancarios por mes vencido:** Si un depósito paga intereses cada 30
  días, estar 59 días te paga solo el 1er mes (el 2º mes no se cumple).

  - **Compra de divisas u objetos indivisibles:** No puedes comprar $3{,}7$ billetes
  o $4{,}8$ acciones; debes tomar la parte entera de las unidades que te alcanza la
  plata.'
explicacion_formal: 'La cuantificación discreta de unidades financieras $N(M)$ con
  capital $M$ y costo unitario $P_0$ se rige por el modelo:


  $$N(M) = \left\lfloor \frac{M}{P_0} \right\rfloor$$


  **Desglose de la fórmula:**

  - Aplicación de la función parte entera para restringir a $\mathbb{Z}^+$ la cantidad
  máxima de activos enteros adquiribles con el presupuesto $M$.'
definiciones_clave: '- **Cuantificación financiera discreta**: Modelamiento de variables
  comerciales que no admiten fracciones continuas.'
propiedades_relaciones: '- **Piso presupuestario**: La función parte entera garantiza
  no exceder el presupuesto disponible al comprar unidades enteras.'
ejemplo_guiado:
  enunciado: Un inversionista dispone de $\$1.500.000$ para comprar acciones de una
    empresa que cotizan a $\$340.000$ cada una. Determina cuántas acciones enteras
    puede comprar y el vuelto restante.
  pasos:
  - 'Paso 1: Plantear la división del presupuesto entre el precio unitario: $\frac{1.500.000}{340.000}
    \approx 4{,}4117$.Paso 2: Aplicar la función parte entera para obtener las acciones
    enteras: $N = [4{,}4117] = 4\text{ acciones}$.Paso 3: Calcular el costo de las
    4 acciones: $4 \cdot 340.000 = 1.360.000$.Paso 4: Calcular el dinero restante:
    $1.500.000 - 1.360.000 = \$140.000$.Paso 5: Concluir que puede comprar $4$ acciones
    enteras y le sobran $\$140.000$.'
checkpoints:
- placement: after_explicacion_formal
  question: Con un presupuesto de $\$1.500.000$ y acciones a $\$340.000$, ¿cuántas
    acciones enteras se pueden adquirir usando la función parte entera?
  choices:
  - text: $4\text{ acciones}$
    is_correct: true
  - text: $5\text{ acciones}$
    is_correct: false
  - text: $4.41\text{ acciones}$
    is_correct: false
  - text: $3\text{ acciones}$
    is_correct: false
  explanation: La alternativa correcta es '$4\text{ acciones}$'. (Puesto que $[4{,}4117]
    = 4$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué en este contexto financiero NO se puede aproximar $4{,}41$ al
    entero superior $5$?
  choices:
  - text: Porque 5 acciones costarían $\$1.700.000$, superando el presupuesto disponible
      de $\$1.500.000$.
    is_correct: true
  - text: Porque las acciones no se venden en números impares.
    is_correct: false
  - text: Porque la bolsa de comercio lo prohíbe.
    is_correct: false
  - text: Porque el dinero se duplica.
    is_correct: false
  explanation: La alternativa correcta es 'Porque 5 acciones costarían $\$1.700.000$,
    superando el presupuesto disponible de $\$1.500.000$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el capital disponible entre el costo unitario del activo.'
- 'Paso 2: Aplicar la función parte entera $\lfloor \cdot \rfloor$ al resultado de
  la división.'
- 'Paso 3: Multiplicar las unidades enteras por el costo unitario para hallar el gasto
  real.'
- 'Paso 4: Restar del capital original para hallar el saldo remanente.'
errores_correccion: '- **Error común:** Redondear al entero más cercano (pensar que
  $4{,}7$ daría 5 al comprar con presupuesto limitado).

  - **Cómo corregirlo:** En compras presupuestarias se usa SIEMPRE la parte entera
  hacia abajo ($\lfloor x \rfloor$), porque no puedes comprar lo que no te alcanza
  a pagar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
