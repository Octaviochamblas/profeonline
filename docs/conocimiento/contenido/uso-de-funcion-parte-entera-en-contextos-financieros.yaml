semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_CONTEXTO_FINANCIERO
resumen_inicial: El uso de la función parte entera en contextos financieros modela decisiones discretas como el cálculo de comisiones, intereses periódicos o unidades vendidas.
explicacion_simple: |
  En el **mundo financiero y de los negocios**, las operaciones no siempre son continuas:

  - **Intereses bancarios**: Un depósito paga intereses solo por **meses completos acumulados**. Si dejas el dinero $5{,}8$ meses, te pagan solo por $5$ meses enteros ($\lfloor 5{,}8 \rfloor = 5$).
  - **Empaques de venta**: Si produces $147$ huevos y los vendes en cajas de $12$, puedes formar exactamente $\lfloor 147 / 12 \rfloor = \lfloor 12{,}25 \rfloor = 12$ cajas completas.
  - La función parte entera permite calcular la **cantidad exacta de periodos o productos enteros**.
explicacion_formal: |
  Sea $V$ una variable económica continua (tiempo transcurrido, monto acumulado, unidades producidas) y $B$ la base de capitalización o empaque. La función de beneficio o unidades discretas $N(V)$ se modela mediante:

  $$N(V) = K \cdot \left\lfloor \frac{V}{B} \right\rfloor$$

  donde $K$ es la ganancia o tasa fija asignada a cada bloque completo $B$.

  **Aplicación a intereses por periodos enteros:**
  El capital acumulado $C(t)$ tras $t$ periodos con tasa de interés simple $r$ abonada al final de cada periodo $T$ viene dado por:

  $$C(t) = C_0 \cdot \left(1 + r \cdot \left\lfloor \frac{t}{T} \right\rfloor \right)$$
definiciones_clave: |
  - **Modelamiento financiero discreto**: Aplicación de la función parte entera para representar pagos de intereses, comisiones o unidades completas en economía.
propiedades_relaciones: |
  - **Ausencia de prorrateo**: En contratos donde no existe prorrateo diario, las fracciones de tiempo no generan intereses hasta completar el ciclo entero.
ejemplo_guiado:
  enunciado: 'Un depósito a plazo rinde $\$15.000$ por cada mes completo transcurrido. Si el dinero permanece depositado durante $7{,}8$ meses, calcula los intereses totales cobrados.'
  pasos:
    - 'Paso 1: Aplicar la función parte entera a la cantidad de meses: $\lfloor 7{,}8 \rfloor = 7$ meses enteros.'
    - 'Paso 2: Identificar la ganancia fija por mes completo: $K = 15.000$.'
    - 'Paso 3: Calcular el beneficio acumulado: $I = 15.000 \cdot 7$.'
    - 'Paso 4: Multiplicar: $15.000 \cdot 7 = 105.000$ pesos.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una inversión rinde $15.000 por cada mes completo y el dinero permanece 7,8 meses, ¿cuánto dinero se recibe por concepto de intereses?'
    choices:
      - {text: '$105.000 pesos', is_correct: true}
      - {text: '$117.000 pesos', is_correct: false}
      - {text: '$120.000 pesos', is_correct: false}
      - {text: '$100.000 pesos', is_correct: false}
    explanation: 'La alternativa correcta es ''$105.000 pesos''. Solo se pagan 7 meses completos: $15.000 \cdot \lfloor 7{,}8 \rfloor = 15.000 \cdot 7 = 105.000$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué se utiliza la función parte entera en contratos financieros sin prorrateo diario?'
    choices:
      - {text: 'Porque las fracciones de periodo no generan ganancias hasta completar el ciclo entero.', is_correct: true}
      - {text: 'Porque la tasa de interés se vuelve negativa con los decimales.', is_correct: false}
      - {text: 'Porque el banco cobra una multa por usar números decimales.', is_correct: false}
      - {text: 'Porque el capital inicial se reduce a cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque las fracciones de periodo no generan ganancias hasta completar el ciclo entero.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la unidad o periodo base $B$ y la ganancia/costo por periodo $K$.'
  - 'Paso 2: Dividir la variable continua dada $V$ entre la base $B$.'
  - 'Paso 3: Aplicar el operador parte entera $\lfloor V / B \rfloor$ para obtener los bloques enteros completos.'
  - 'Paso 4: Multiplicar el número de bloques por $K$ para determinar el resultado financiero final.'
errores_correccion: |
  - **Error común:** Prorratear decimalmente los intereses cuando las cláusulas financieras exigen periodos enteros cumplidos.
  - **Cómo corregirlo:** Si el contrato exige **PERIODOS ENTEROS COMPLETOS**, debes aplicar la función parte entera $\lfloor t / T \rfloor$.
