procedimiento:
- 'Paso 1: Identifica el valor de la unidad indivisible (billete, acción, unidad de
  producto).'
- 'Paso 2: Divide la cantidad total disponible por el valor de esa unidad.'
- 'Paso 3: Aplica la función parte entera a ese cociente para obtener el número máximo
  de unidades completas.'
- 'Paso 4: Multiplica por el valor de la unidad si se requiere el monto exacto entregable.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar uso de función parte entera en contextos financieros.
ejemplos:
- titulo: Cálculo de billetes entregables
  enunciado: Un cajero solo tiene billetes de \$5.000. Si se solicitan \$23.700, ¿cuántos
    billetes completos puede entregar?
  solucion_pasos:
  - $\lfloor 23700/5000 \rfloor = \lfloor 4{,}74 \rfloor = 4$ billetes.
  - Puede entregar 4 billetes, es decir \$20.000.
- titulo: Cálculo de acciones adquiribles
  enunciado: Con \$150.000 disponibles, y cada acción cuesta \$18.000, ¿cuántas acciones
    completas se pueden comprar?
  solucion_pasos:
  - $\lfloor 150000/18000 \rfloor = \lfloor 8{,}33 \rfloor = 8$ acciones.
- titulo: ¿Se puede comprar una fracción de acción usando este modelo?
  enunciado: ¿Se puede comprar una fracción de acción usando este modelo?
  respuesta: 'No'
  solucion_pasos:
  - La parte entera precisamente descarta la porción fraccionaria, dejando solo unidades
    completas disponibles.
- titulo: ¿El dinero sobrante tras aplicar la parte entera siempre es cero?
  enunciado: ¿El dinero sobrante tras aplicar la parte entera siempre es cero?
  respuesta: 'No'
  solucion_pasos:
  - Suele quedar un resto (la diferencia entre el monto original y el monto de las
    unidades completas entregadas), salvo que la cantidad sea exactamente un múltiplo
    del valor unitario.
errores_frecuentes:
- Redondear hacia arriba, asumiendo que se puede entregar o registrar una unidad adicional
  incompleta.
- Olvidar calcular el resto o remanente tras aplicar la parte entera en contextos
  que lo requieren.
- Confundir la cantidad de unidades (el resultado de la parte entera) con el monto
  total entregable.
- Aplicar redondeo estándar en vez de la parte entera en situaciones donde solo se
  permite redondeo hacia abajo.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando uso
