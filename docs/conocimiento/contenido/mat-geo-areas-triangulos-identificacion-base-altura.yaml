procedimiento:
- 'Paso 1: Elige cualquiera de los tres lados del triángulo como base.'
- 'Paso 2: Identifica el vértice opuesto a esa base.'
- 'Paso 3: Traza (o identifica) el segmento perpendicular desde ese vértice hasta
  la base: esa es la altura correspondiente.'
