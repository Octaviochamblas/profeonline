semantic_id: MAT.GEO.AREAS_TRIANGULOS.IDENTIFICACION_BASE_ALTURA
resumen_inicial: 'Identificación de la base y la altura correspondiente en distintas
  orientaciones del triángulo: conceptos, teoremas, propiedades geométricas y cálculo
  en Perímetros, Áreas y Teoremas.'
explicacion_simple: Un mismo triángulo puede dibujarse en cualquier orientación, y
  cualquiera de sus tres lados puede tomarse como base; lo esencial es siempre usar
  la altura correspondiente a esa base específica, no cualquier otro segmento.
explicacion_formal: '![Identificación de base y altura](/static/img/geometria/areas-pitagoras/areas-triangulos-identificacion-base-altura.svg)


  ### Definición formal


  Cualquiera de los tres lados de un triángulo puede tomarse como base; la altura
  correspondiente es siempre el segmento perpendicular desde el vértice opuesto a
  esa base (o a su prolongación).


  ### Desarrollo didáctico


  Un mismo triángulo tiene tres pares posibles de base-altura, uno por cada lado;
  los tres dan el mismo valor de área, ya que A=(base×altura)/2 es constante sin importar
  qué lado se elija como base.'
definiciones_clave: '- **Identificación de la base y la altura correspondiente en
  distintas orientaciones del triángulo**: Elemento o propiedad fundamental en el
  estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de la base y la altura correspondiente
  en distintas orientaciones del triángulo.'
ejemplo_guiado:
  enunciado: Para analizar identificación de la base y la altura correspondiente en
    distintas orientaciones del triángulo, considera un ángulo $\alpha = 20^\circ$
    ubicado en la posición dada. Determina el valor de la medida asociada sabiendo
    que $x + 1007^\circ = 20^\circ$.
  pasos:
  - Identificar la propiedad de identificación de la base y la altura correspondiente
    en distintas orientaciones del triángulo referida a $\alpha = 20^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1007 = 20 \implies x = 20 - 1007$.'
  - Concluir que la medida calculada para identificación de la base y la altura correspondiente
    en distintas orientaciones del triángulo es $x = -987^\circ$.
