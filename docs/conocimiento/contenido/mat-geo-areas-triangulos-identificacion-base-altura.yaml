    la altura correspondiente en distintas orientaciones del triángulo en figuras
    congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación de la base y la altura correspondiente en distintas
    orientaciones del triángulo asumir un valor negativo cuando representa una longitud
    geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación de la base y la
