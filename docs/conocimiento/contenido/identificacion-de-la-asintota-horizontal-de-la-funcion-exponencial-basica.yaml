semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.ASINTOTA_HORIZONTAL
resumen_inicial: La identificación de la asíntota horizontal establece que la recta $y = 0$ (eje X) es el límite al que la gráfica se aproxima indefinidamente sin llegar a tocarlo.
explicacion_simple: |
  Una **asíntota horizontal** es una línea recta imaginaria a la cual la curva de la función se **acerca cada vez más y más**, pero **NUNCA LLEGA A TOCAR NI A CRUZAR**:

  - En la función exponencial básica $f(x) = b^x$:
    - Si la función es **creciente ($b > 1$)**: Cuando $x$ se vuelve un número negativo gigante (ej. $x = -100$), $2^{-100} = \frac{1}{2^{100}} \approx 0.00000...1$.
    - La curva se "pega" al eje X por la izquierda, pero jamás vale cero.
  - La **ecuación de la asíntota horizontal de la función básica es la recta $y = 0$** (el propio eje X).
explicacion_formal: |
  Dada la función exponencial canónica $f(x) = b^x$ con $b \in \mathbb{R}^+ \setminus \{1\}$, la recta horizontal $L: y = 0$ constituye su **asíntota horizontal unilateral**:

  **Comportamiento de límites asintóticos:**
  1. **Si $b > 1$ (Crecimiento exponencial):**
     $$\lim_{x \to -\infty} b^x = 0^+ \quad \text{y} \quad \lim_{x \to +\infty} b^x = +\infty$$
     La asíntota horizontal $y = 0$ opera hacia el extremo izquierdo ($x \to -\infty$).
  2. **Si $0 < b < 1$ (Decrecimiento exponencial):**
     $$\lim_{x \to +\infty} b^x = 0^+ \quad \text{y} \quad \lim_{x \to -\infty} b^x = +\infty$$
     La asíntota horizontal $y = 0$ opera hacia el extremo derecho ($x \to +\infty$).
definiciones_clave: |
  - **Asíntota horizontal**: Recta de ecuación $y = c$ a la que se aproxima asintóticamente la gráfica de una función cuando la variable $x$ tiende a $+\infty$ o $-\infty$.
propiedades_relaciones: |
  - **No intersección con la asíntota**: La ecuación $b^x = 0$ no posee soluciones en el conjunto de los números reales $\mathbb{R}$, garantizando que la curva jamás intercepte a la recta asíntota $y = 0$.
ejemplo_guiado:
  enunciado: 'Identifica la ecuación de la asíntota horizontal de la función $f(x) = 6^x$ y explica su comportamiento hacia $-\infty$.'
  pasos:
    - 'Paso 1: Identificar que se trata de una función exponencial básica sin traslación vertical.'
    - 'Paso 2: Formular la ecuación de la asíntota horizontal: es la recta $y = 0$.'
    - 'Paso 3: Analizar el límite hacia $-\infty$: para exponentes negativos grandes, $6^{-n} = \frac{1}{6^n}$, que se aproxima infinitamente a cero.'
    - 'Paso 4: Concluir que la curva se aproxima al eje X ($y = 0$) por encima de él sin tocarlo.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación matemática de la asíntota horizontal de la función exponencial básica $f(x) = 10^x$?'
    choices:
      - {text: 'La recta $y = 0$', is_correct: true}
      - {text: 'La recta $x = 0$.', is_correct: false}
      - {text: 'La recta $y = 1$.', is_correct: false}
      - {text: 'La recta $y = 10$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta $y = 0$''. El eje X es la asíntota horizontal de la función básica.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la función exponencial decreciente $g(x) = (0.4)^x$, ¿hacia qué extremo del eje X la gráfica se aproxima a la asíntota $y = 0$?'
    choices:
      - {text: 'Hacia el infinito positivo ($x \to +\infty$)', is_correct: true}
      - {text: 'Hacia el infinito negativo ($x \to -\infty$).', is_correct: false}
      - {text: 'Hacia el origen $(0,0)$.', is_correct: false}
      - {text: 'Hacia la asíntota vertical $x = 0$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Hacia el infinito positivo ($x \to +\infty$)''. Al ser decreciente, baja hacia cero cuando $x$ crece.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Observar la estructura exponencial básica $f(x) = b^x$ o $a \cdot b^x$.'
  - 'Paso 2: Comprobar que no exista término sumado o restado fuera de la potencia (traslación $k = 0$).'
  - 'Paso 3: Declarar la recta horizontal de referencia como $y = 0$.'
  - 'Paso 4: Explicar la aproximación asintótica según sea creciente ($x \to -\infty$) o decreciente ($x \to +\infty$).'
errores_correccion: |
  - **Error común:** Confundir la asíntota horizontal $y = 0$ con una asíntota vertical de ecuación $x = 0$.
  - **Cómo corregirlo:** La asíntota exponencial es **HORIZONTAL (eje X, ecuación $y = 0$)**; la función exponencial no tiene asíntotas verticales.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Asíntota de función creciente.
    alternativas:
      - 'Asíntota horizontal y = 0 hacia -\infty'
      - 'Asíntota vertical x = 0'
      - 'Asíntota horizontal y = 1'
    respuesta: 'Asíntota horizontal y = 0 hacia -\infty'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Asíntota de función decreciente.
    alternativas:
      - 'Asíntota horizontal y = 0 hacia +\infty'
      - 'Asíntota horizontal y = 0.5'
      - 'Sin asíntota horizontal'
    respuesta: 'Asíntota horizontal y = 0 hacia +\infty'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 5^x$, la afirmación de que su asíntota es la recta vertical $x = 0$.'
  - 'La afirmación errónea de que la gráfica de la función exponencial básica llega a cruzar el eje X y pasar a valores negativos.'
  - 'La afirmación de que una función exponencial creciente tiene su asíntota horizontal hacia la derecha ($x \to +\infty$).'
  - 'La confusión entre la constante de corte con Y ($y = 1$) y la ecuación de la asíntota horizontal ($y = 0$).'
  - 'La afirmación de que modificar el valor de la base $b$ altera la ecuación de la asíntota horizontal básica $y = 0$.'
afirmaciones_verdaderas:
  - 'La asíntota horizontal de la función exponencial básica $f(x) = b^x$ es invariablemente la recta del eje X de ecuación $y = 0$.'
  - 'La gráfica de la función exponencial básica se aproxima infinitamente a la recta $y = 0$ sin llegar a interceptarla jamás en punto alguno.'
al_terminar_debes_poder: |
  QUÉ: Identificar la ecuación y el comportamiento de la asíntota horizontal en funciones exponenciales básicas.
  CÓMO: Reconocer la ausencia de traslación $k = 0$, escribir la recta $y = 0$ y describir la aproximación asintótica según la base.
