semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.ASINTOTA_HORIZONTAL
resumen_inicial: La identificación de la asíntota horizontal de la función exponencial básica $f(x) = a \cdot b^x$ determina la recta horizontal $y = 0$ (el eje $X$), hacia la cual la curva se aproxima indefinidamente sin llegar a intersectarla cuando $x \to \pm\infty$.
explicacion_simple: "![La identificación de la asíntota horizontal de la función exponencial básica $f(x) = a \\cdot b^x$ determina la recta horizontal $y = 0$ (el eje $X$), hacia la cual la curva se aproxima indefinidamente sin llegar a intersectarla cuando $x \\to \\pm\\infty$](/static/img/nodos/identificacion-de-la-asintota-horizontal-de-la-funcion-exponencial-basica-intro.svg)\n\n\nUna **asíntota horizontal** es una línea recta que la curva persigue y roza infinitamente, pero **NUNCA la toca ni la cruza**:\n\n- **¿Cuál es la asíntota de $f(x) = b^x$?**\n  - Es la recta horizontal **$y = 0$** (el propio eje horizontal $X$).\n- **¿Cómo se comporta según la base?**\n  - **Si $b > 1$ (creciente, ej: $2^x$):** Cuando vas hacia la izquierda ($x \\to -\\infty$), $2^{-10} = \\frac{1}{1024} \\approx 0$. La cola izquierda de la curva se aplasta contra el eje $X$.\n  - **Si $0 < b < 1$ (decreciente, ej: $(0,5)^x$):** Cuando vas hacia la derecha ($x \\to +\\infty$), $(0,5)^{10} \\approx 0$. La cola\
  \ derecha de la curva se aplasta contra el eje $X$.\n- **¡Ecuación formal!** Debe escribirse siempre como **$y = 0$** (¡nunca $x = 0$!)."
explicacion_formal: "Sea $f(x) = a \\cdot b^x$ ($a \\neq 0, b > 0, b \\neq 1$). La recta horizontal $\\mathcal{A}_H: y = L$ es una **asíntota horizontal** si satisface la condición de límite en el infinito:\n$$\\lim_{x \\to +\\infty} f(x) = L \\quad \\lor \\quad \\lim_{x \\to -\\infty} f(x) = L$$\n\n**Demostración asintótica según la base**:\n1. **Caso $b > 1$**:\n   $$\\lim_{x \\to -\\infty} a \\cdot b^x = a \\lim_{x \\to -\\infty} e^{x \\ln(b)} = a \\cdot 0 = 0 \\implies \\mathcal{A}_H: y = 0 \\text{ (cuando } x \\to -\\infty)$$\n2. **Caso $0 < b < 1$** (con $\\ln(b) < 0$):\n   $$\\lim_{x \\to +\\infty} a \\cdot b^x = a \\lim_{x \\to +\\infty} e^{-x |\\ln(b)|} = a \\cdot 0 = 0 \\implies \\mathcal{A}_H: y = 0 \\text{ (cuando } x \\to +\\infty)$$\n\n**Propiedad de no intersección**: Para todo $x \\in \\mathbb{R}$, $a \\cdot b^x \\neq 0$, lo que demuestra que la curva no corta a su asíntota en ningún punto finito del plano."
definiciones_clave: '- **Asíntota horizontal**: Recta $y = L$ hacia la cual la distancia euclidiana $|f(x) - L| \to 0$ cuando $|x| \to \infty$.

  - **Comportamiento asintótico unilateral**: Convergencia que ocurre en un solo extremo del infinito ($-\infty$ o $+\infty$).'
propiedades_relaciones: '- **Efecto de la traslación vertical**: Para la función trasladada $g(x) = a \cdot b^x + k$, la asíntota horizontal se desplaza a la recta $y = k$.

  - **Distinción con asíntota vertical**: Las funciones exponenciales NO poseen asíntotas verticales (su dominio es todo $\mathbb{R}$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de la asíntota horizontal de la función exponencial básica $f(x) = a \cdot b^x$ determina la recta horizontal $y = 0$ (el eje $X$), hacia la cual la curva se aproxima indefinidamente sin llegar a intersectarla cuando $x \to \pm\infty$](/static/img/nodos/identificacion-de-la-asintota-horizontal-de-la-funcion-exponencial-basica-ejemplos.svg)



    Determina la ecuación de la asíntota horizontal y explica hacia qué extremo del infinito se aproxima la curva para:

    1) $f(x) = 4^x$

    2) $g(x) = \left(\frac{1}{3}\right)^x$

    3) $h(x) = 2^x + 5$'
  pasos:
  - 'Paso 1: Para $f(x) = 4^x$:

    - Como $b = 4 > 1$, $\lim_{x \to -\infty} 4^x = 0$.

    - Ecuación de la asíntota: recta **$y = 0$** (hacia $-\infty$).'
  - 'Paso 2: Para $g(x) = (1/3)^x$:

    - Como $b = 1/3 < 1$, $\lim_{x \to +\infty} (1/3)^x = 0$.

    - Ecuación de la asíntota: recta **$y = 0$** (hacia $+\infty$).'
  - 'Paso 3: Para $h(x) = 2^x + 5$:

    - La función tiene una traslación vertical de $+5$.

    - $\lim_{x \to -\infty} (2^x + 5) = 0 + 5 = 5$.

    - Ecuación de la asíntota: recta **$y = 5$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación de la asíntota horizontal de la función exponencial básica $f(x) = 8 \cdot 3^x$?
  choices:
  - text: y = 0 (la recta del eje X)
    is_correct: true
  - text: x = 0
    is_correct: false
  - text: y = 8
    is_correct: false
  - text: y = 3
    is_correct: false
  explanation: La alternativa correcta es 'y = 0 (la recta del eje X)'. Como no hay traslación vertical sumada, la asíntota es la recta horizontal $y = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función $f(x) = 5^x$, ¿hacia qué extremo del eje X la gráfica se aproxima a su asíntota y = 0?
  choices:
  - text: Hacia el infinito negativo (x → -∞)
    is_correct: true
  - text: Hacia el infinito positivo (x → +∞)
    is_correct: false
  - text: En ambos infinitos
    is_correct: false
  - text: En el origen
    is_correct: false
  explanation: La alternativa correcta es 'Hacia el infinito negativo (x → -∞)'. Al ser $b = 5 > 1$, cuando $x$ se hace muy negativo ($x \to -\infty$), $5^x$ se acerca a 0.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función exponencial en la forma $f(x) = a \cdot b^x + k$.'
- 'Paso 2: Evaluar el límite cuando $x \to \pm\infty$ del término exponencial $b^x \to 0$.'
- 'Paso 3: Establecer la ecuación de la recta horizontal resultante como $y = k$ (con $k = 0$ en la básica).'
- 'Paso 4: Escribir la respuesta formalmente en la forma lineal horizontal $y = \text{constante}$.'
errores_correccion: '- **Error común:** Escribir la ecuación de la asíntota como $x = 0$.

  - **Cómo corregirlo:** $x = 0$ es una recta vertical (el eje Y); **las asíntotas horizontales se escriben obligatoriamente como $y = 0$**.'
ejemplos:
- titulo: 'Ejemplo 1: Asíntota de función canónica'
  enunciado: ¿Cuál es la asíntota horizontal de $f(x) = 6^x$?
  alternativas:
  - y = 0
  - x = 0
  - y = 6
  - y = 1
  respuesta: y = 0
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to -\infty} 6^x = 0 \implies y = 0$.'
- titulo: 'Ejemplo 2: Asíntota con base decimal'
  enunciado: En $g(x) = (0{,}4)^x$, ¿cuál es su asíntota?
  alternativas:
  - y = 0
  - x = 0
  - y = 0,4
  - x = 0,4
  respuesta: y = 0
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to +\infty} (0{,}4)^x = 0 \implies y = 0$.'
- titulo: 'Ejemplo 3: Asíntota con desplazamiento vertical'
  enunciado: ¿Qué asíntota horizontal tiene $h(x) = 3^x - 4$?
  alternativas:
  - y = -4
  - y = 0
  - x = -4
  - y = 4
  respuesta: y = -4
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to -\infty} (3^x - 4) = 0 - 4 = -4 \implies y = -4$.'
- titulo: 'Ejemplo 4: Intersección con la asíntota'
  enunciado: ¿La función $f(x) = 2^x$ corta a su asíntota horizontal $y = 0$?
  alternativas:
  - No, nunca la corta porque 2ˣ > 0 para todo x real
  - Sí, en el origen (0, 0)
  - Sí, en el infinito
  - Sí, para x negativo
  respuesta: No, nunca la corta porque 2ˣ > 0 para todo x real
  solucion_pasos:
  - 'Paso 1: Como $2^x \neq 0$ para todo $x \in \mathbb{R}$, no existe punto de corte.'
errores_frecuentes:
- Escribir 'x =' en lugar de 'y =' para una asíntota horizontal.
- Confundir el intercepto con el eje Y con la ecuación de la asíntota.
- Creer que la función exponencial tiene asíntotas verticales.
afirmaciones_verdaderas:
- La asíntota horizontal de la función exponencial básica f(x) = a · bˣ es la recta y = 0.
- La gráfica de una función exponencial básica nunca corta a su asíntota horizontal.
al_terminar_debes_poder: '**QUÉ:** Identificar y formular la ecuación de la asíntota horizontal de una función exponencial.


  **CÓMO:** Calculando el límite en el infinito para obtener la recta horizontal y = 0 (o y = k en funciones trasladadas).


