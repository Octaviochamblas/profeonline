semantic_id: MAT.ALG.INTERVALOS.INTERVALO_INFINITO_NEGATIVO
resumen_inicial: 'Notación de intervalo infinito hacia la izquierda: relaciones de
  orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Un intervalo infinito negativo describe un conjunto de números
  reales que son menores (o menores e iguales) a un valor tope, extendiéndose hacia
  la izquierda en la recta numérica.
explicacion_formal: '### Definición formal

  Sea $b \\in \\mathbb{R}$. Un intervalo infinito negativo se define como el conjunto
  de números reales $x$ tales que $x \\leq b$, denotado como $(-\\infty, b]$, o $x
  < b$, denotado como $(-\\infty, b)$.

  ### Desarrollo didáctico

  El símbolo $-\\infty$ indica que los valores del conjunto descienden sin ningún
  límite inferior. En la notación, siempre ocupa la primera posición, y al igual que
  su contraparte positiva, siempre se cierra con un paréntesis, ya que no representa
  un valor alcanzable.'
definiciones_clave: '- **Notación de intervalo infinito hacia la izquierda**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a notación de intervalo infinito hacia
  la izquierda.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de notación de intervalo
    infinito hacia la izquierda.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de notación de intervalo infinito hacia la
    izquierda, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en notación de intervalo infinito hacia la izquierda?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en intervalos reales y su representación
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en intervalos reales y su representación.
    Es la propiedad fundamental de orden en notación de intervalo infinito hacia la
    izquierda.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en notación
    de intervalo infinito hacia la izquierda, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar el valor límite superior $b$ del conjunto.
- Colocar el símbolo $-\\infty$ en el extremo inferior del intervalo, abriéndolo con
  un paréntesis.
- Escribir el valor $b$ en el extremo superior.
- Determinar el cierre en $b$ (paréntesis o corchete) dependiendo de la relación matemática.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en notación de intervalo infinito
  hacia la izquierda.
ejemplos:
- enunciado: La presión de una válvula debe mantenerse por debajo de $50$ pascales.
    Escribe este intervalo.
  solucion_pasos:
  - Identificar que el valor máximo es estrictamente menor a $50$.
  - El conjunto se extiende sin límite hacia los valores negativos o menores.
  - Escribir el extremo inferior como $(-\\infty$.
  - Concluir que el intervalo es $(-\\infty, 50)$.
  titulo: Presión de seguridad
- enunciado: El costo de un componente puede ser a lo sumo $500$ unidades monetarias.
    Escribe este límite como intervalo.
  solucion_pasos:
  - La frase 'a lo sumo' significa que el costo debe ser menor o igual a $500$.
  - El conjunto incluye el $500$.
  - Escribir el extremo superior cerrado como $500]$.
  - Concluir que el intervalo es $(-\\infty, 500]$.
  titulo: Presupuesto máximo
- respuesta: 'No'
  solucion_pasos:
  - En la notación estándar, el límite inferior siempre va primero.
  - Dado que $-\\infty$ representa los valores más pequeños posibles, siempre va a
    la izquierda.
  - La forma correcta sería $(-\\infty, 5]$.
  titulo: ¿Se puede escribir un intervalo negativo empezando por el número como en
    $[5, -\\infty)$?
- respuesta: 'No'
  solucion_pasos:
  - El intervalo contiene a todos los números estrictamente menores que $-2$.
  - Como $0$ es mayor que $-2$, no cumple con la condición.
  - Por lo tanto, no pertenece al conjunto.
  titulo: ¿El valor $0$ está contenido en el intervalo $(-\\infty, -2)$?
errores_frecuentes:
- Usar corchete cerrado junto al menos infinito, escribiendo $[-\\infty, b]$.
- Colocar el $-\\infty$ en la segunda posición del intervalo.
- Asumir que un intervalo infinito negativo sólo contiene números con signo negativo.
- Creer que $(-\\infty, b)$ siempre es un conjunto vacío si $b$ es negativo.
- Confundir la lectura de inecuaciones y usar $+\\infty$ para expresiones como $x
  < b$.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  notación de intervalo infinito hacia la izquierda.
