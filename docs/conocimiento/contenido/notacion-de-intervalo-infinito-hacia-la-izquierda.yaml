semantic_id: MAT.ALG.INTERVALOS.INTERVALO_INFINITO_NEGATIVO
resumen_inicial: Un intervalo infinito hacia la izquierda comprende todos los números
  menores que un valor $b$ y se extiende desde $-\infty$.
explicacion_simple: 'Cuando una desigualdad no tiene límite inferior (como $x < 4$
  o $x \le 4$), la solución viene desde el infinito negativo de la izquierda en la
  recta real.

  Escribimos el símbolo $-\infty$ en la posición izquierda del intervalo.

  El extremo de $-\infty$ SIEMPRE lleva corchete abierto $]$ por la izquierda.'
explicacion_formal: 'El **intervalo no acotado inferiormente** sobre $\mathbb{R}$
  se define como:


  $$]-\infty, b[ \ = (-\infty, b) = \{x \in \mathbb{R} \mid x < b\}$$

  $$]-\infty, b] \ = (-\infty, b] = \{x \in \mathbb{R} \mid x \le b\}$$


  **Desglose de la fórmula:**

  - $-\infty$: Símbolo de cota infinita negativa que siempre lleva corchete abierto
  por la izquierda ($]-\infty$).'
definiciones_clave: '- **Intervalo no acotado inferiormente**: Subconjunto real sin
  límite inferior finito que proviene de $-\infty$.'
propiedades_relaciones: '- **Ubicación del $-\infty$**: Siempre se escribe en el lado
  izquierdo del intervalo por ser menor que cualquier número real.'
ejemplo_guiado:
  enunciado: Traduce las desigualdades $x < 2$ y $x \le 2$ a notación de intervalo
    no acotado inferiormente.
  pasos:
  - 'Paso 1: Analizar $x < 2$: la variable es menor estricta que $2$, luego proviene
    de $-\infty$ hasta $2$ (excluido).Paso 2: Escribir en notación de intervalo: $]-\infty,
    2[$.Paso 3: Analizar $x \le 2$: incluye al $2$, luego va desde $-\infty$ hasta
    $2$ (incluido).Paso 4: Escribir en notación de intervalo: $]-\infty, 2]$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe en notación de intervalo el conjunto de todos los números
    menores o iguales a 2 ($\{x \in \mathbb{R} \mid x \le 2\}$)?
  choices:
  - text: $]-\infty, 2]$
    is_correct: true
  - text: $[-\infty, 2]$
    is_correct: false
  - text: $[2, +\infty[$
    is_correct: false
  - text: $]-\infty, 2[$
    is_correct: false
  explanation: La alternativa correcta es '$]-\infty, 2]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué lado de la notación de intervalo se debe escribir obligatoriamente
    el símbolo $-\infty$?
  choices:
  - text: En el lado izquierdo del intervalo.
    is_correct: true
  - text: En el lado derecho del intervalo.
    is_correct: false
  - text: Indistintamente en cualquier lado.
    is_correct: false
  - text: En el centro del intervalo.
    is_correct: false
  explanation: La alternativa correcta es 'En el lado izquierdo del intervalo.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir $]-\infty$ en la posición izquierda.'
- 'Paso 2: Escribir el número límite $b$ en la posición derecha.'
- 'Paso 3: Colocar corchete cerrado $]$ si la desigualdad es $\le$ o abierto $ [ $
  si la desigualdad es $<$.'
- 'Paso 4: Formar el intervalo $]-\infty, b]$ o $]-\infty, b[$.'
errores_correccion: '- **Error común:** Escribir $[2, -\infty[$ poniendo el número
  mayor a la izquierda.

  - **Cómo corregirlo:** Los intervalos se escriben SIEMPRE de menor a mayor (de izquierda
  a derecha). El $-\infty$ va a la izquierda.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- Usar corchetes cerrados $[ ]$ para traducir desigualdades estrictas que no incluyen
  el signo igual.
- Colocar un corchete cerrado en los símbolos de infinito $+ \infty$ o $-\infty$.
- Escribir las fronteras del intervalo al revés colocando el número mayor a la izquierda.
- Creer que un intervalo real solo contiene a los números enteros de la zona.
- Olvidar sombrear la línea continua al dibujar la gráfica en la recta numérica.
afirmaciones_verdaderas:
- Un intervalo cerrado $[a, b]$ incluye a ambos extremos $a$ y $b$ dentro del conjunto
  de soluciones.
- El símbolo de infinito siempre lleva corchete abierto ya que representa una cota
  ilimitada no alcanzable.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, traducir y representar
  gráficamente intervalos reales abiertos, cerrados e infinitos.
fuente: Texto escolar MINEDUC — Álgebra / Intervalos Reales
