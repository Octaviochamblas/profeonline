semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.SEGUNDO_NIVEL
resumen_inicial: Una fracción compleja de segundo nivel se simplifica multiplicando extremos con extremos y medios con medios.
explicacion_simple: |
  Cuando hemos reducido el numerador a una única fracción $\frac{A}{B}$ y el denominador a una única fracción $\frac{C}{D}$, obtenemos una fracción compleja de segundo nivel.

  Para resolver la estructura $\frac{\frac{A}{B}}{\frac{C}{D}}$, aplicamos la regla de extremos y medios:

  Multiplicamos los dos términos extremos $A$ y $D$ para formar el nuevo numerador, y multiplicamos los dos términos medios $B$ y $C$ para formar el nuevo denominador.
explicacion_formal: |
  ### Definición formal
  Dada la fracción compleja reducida a dos términos racionales $\frac{\frac{A(x)}{B(x)}}{\frac{C(x)}{D(x)}}$, la **regla de los extremos y medios** establece la equivalencia:

  $$\frac{\frac{A(x)}{B(x)}}{\frac{C(x)}{D(x)}} = \frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)} = \frac{A(x) \cdot D(x)}{B(x) \cdot C(x)}$$

  ### Desglose de la fórmula
  - $A(x) \cdot D(x)$: Producto de los extremos (término superior e inferior) que pasa al numerador final.
  - $B(x) \cdot C(x)$: Producto de los medios (términos centrales) que pasa al denominador final.

  ### Síntesis didáctica
  Reducir fracciones de segundo nivel requiere colocar el producto de extremos en el dividendo y el producto de medios en el divisor.
definiciones_clave: |
  - **Regla de extremos y medios**: Algoritmo para resolver la división de dos fracciones $\frac{A/B}{C/D}$ multiplicando $A \cdot D$ arriba y $B \cdot C$ abajo.
  - **Términos extremos**: El numerador de la fracción superior ($A$) y el denominador de la fracción inferior ($D$).
  - **Términos medios**: El denominador de la fracción superior ($B$) y el numerador de la fracción inferior ($C$).
propiedades_relaciones: |
  - **Simplificación previa de medios y extremos**: Se pueden simplificar factores comunes entre los dos numeradores $(A, C)$ o entre los dos denominadores $(B, D)$ antes de multiplicar.
  - **Dominio**: Excluye $B(x) = 0$, $D(x) = 0$ y $C(x) = 0$.
ejemplo_guiado:
  enunciado: 'Simplifica la fracción compleja de segundo nivel $\frac{\frac{x^2 - 4}{3x}}{\frac{x + 2}{6x^2}}$ mediante la regla de extremos y medios, y evalúa para $x = 4$.'
  pasos:
    - 'Paso 1: Identificar extremos $A = x^2 - 4 = (x - 2)(x + 2)$ y $D = 6x^2$; medios $B = 3x$ y $C = x + 2$.'
    - 'Paso 2: Escribir el producto de extremos sobre medios: $\frac{(x^2 - 4) \cdot 6x^2}{3x \cdot (x + 2)}$.'
    - 'Paso 3: Factorizar y simplificar: $\frac{(x - 2)(x + 2) \cdot 6x^2}{3x(x + 2)}$.'
    - 'Paso 4: Cancelar $(x + 2)$, simplificar $6x^2 / 3x = 2x$: resultado $2x(x - 2)$ para $x \notin \{-2, 0\}$.'
    - 'Paso 5: Evaluar para $x = 4$: $2(4)(4 - 2) = 8(2) = 16$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la regla para simplificar la fracción compleja $\frac{\frac{A}{B}}{\frac{C}{D}}$?'
    choices:
      - {text: 'Multiplicar los extremos $A \cdot D$ en el numerador y los medios $B \cdot C$ en el denominador.', is_correct: true}
      - {text: 'Multiplicar $A \cdot C$ arriba y $B \cdot D$ abajo.', is_correct: false}
      - {text: 'Sumar $A + D$ y restar $B - C$.', is_correct: false}
      - {text: 'Invertir la primera fracción $B/A$ y multiplicar por $C/D$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar los extremos $A \cdot D$ en el numerador y los medios $B \cdot C$ en el denominador.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar $\frac{\frac{x^2 - 4}{3x}}{\frac{x + 2}{6x^2}}$ y evaluar la expresión reducida para $x = 4$, ¿cuál es el resultado?'
    choices:
      - {text: '$16$', is_correct: true}
      - {text: '$8$', is_correct: false}
      - {text: '$24$', is_correct: false}
      - {text: '$12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$16$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Asegurarse de que tanto el numerador como el denominador sean una única fracción simple.'
  - 'Paso 2: Multiplicar el numerador superior por el denominador inferior (extremos) para obtener el nuevo numerador.'
  - 'Paso 3: Multiplicar el denominador superior por el numerador inferior (medios) para obtener el nuevo denominador.'
  - 'Paso 4: Factorizar la fracción simple resultante y cancelar términos comunes.'
  - 'Paso 5: Escribir el resultado irreducible indicando las restricciones de dominio.'
errores_correccion: |
  - **Error 1:** Invertir la posición escribiendo el producto de medios en el numerador y el de extremos en el denominador. **Cómo corregirlo:** Recordar siempre: **LOS EXTREMOS $A \cdot D$ VAN EN EL NUMERADOR Y LOS MEDIOS $B \cdot C$ VAN EN EL DENOMINADOR**.
  - **Error 2:** Cancelar términos entre $A$ y $D$ antes de multiplicar (cancelar entre extremos). **Cómo corregirlo:** La simplificación previa **SOLO SE PERMITE ENTRE MEDIOS Y EXTREMOS ($A$ CON $C$ O $B$ CON $D$), NUNCA ENTRE LOS DOS EXTREMOS**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el resultado de simplificar $\frac{\frac{3}{a}}{\frac{9}{a^2}}$?'
    alternativas:
      - '$\frac{a}{3}$'
      - '$\frac{3}{a}$'
      - '$\frac{27}{a^3}$'
    respuesta: '$\frac{a}{3}$'
    solucion_pasos:
      - '1. Extremos: $3 \cdot a^2 = 3a^2$.'
      - '2. Medios: $a \cdot 9 = 9a$.'
      - '3. Cociente: $\frac{3a^2}{9a} = \frac{a}{3}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al reducir $\frac{\frac{x-1}{2}}{\frac{x-1}{4}}$, ¿cuál es el valor constante equivalente?'
    alternativas:
      - '$2$'
      - '$\frac{1}{2}$'
      - '$4$'
    respuesta: '$2$'
    solucion_pasos:
      - '1. Cancelar $(x-1)$ en los numeradores.'
      - '2. Cociente de denominadores: $\frac{4}{2} = 2$.'
  - titulo: 'Ubicación de los extremos'
    enunciado: '¿El producto del numerador superior y el denominador inferior forma el nuevo numerador?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la definición exacta del producto de extremos.'
  - titulo: 'Simplificación cruzada previa'
    enunciado: '¿Se pueden cancelar factores comunes entre los dos numeradores $A$ y $C$ antes de multiplicar?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, simplificar previamente reduce el tamaño de las multiplicaciones.'
errores_frecuentes:
  - 'En la regla de extremos y medios para $\frac{\frac{A}{B}}{\frac{C}{D}}$, el producto de los medios $B \cdot C$ se ubica en el numerador resultante.'
  - 'La simplificación previa de factores comunes permite cancelar directamente el término extremo $A$ con el término extremo $D$.'
  - 'Al resolver la fracción compleja $\frac{\frac{x}{2}}{\frac{y}{3}}$, el producto resultante equivale a $\frac{2x}{3y}$.'
  - 'La fracción de segundo nivel $\frac{\frac{A}{B}}{\frac{C}{D}}$ es equivalente a la suma de fracciones $\frac{A}{B} + \frac{D}{C}$.'
  - 'El conjunto de restricciones de la fracción de segundo nivel ignora los ceros del polinomio $C(x)$.'
afirmaciones_verdaderas:
  - 'En una fracción compleja de segundo nivel, el producto de extremos se ubica en el numerador final.'
  - 'La regla de extremos y medios equivale a multiplicar la primera fracción por el recíproco de la segunda.'
al_terminar_debes_poder: |
  QUÉ: Simplificar fracciones algebraicas complejas de segundo nivel.
  CÓMO: Aplicar el producto de extremos sobre el producto de medios y cancelar factores comunes en la fracción resultante.
