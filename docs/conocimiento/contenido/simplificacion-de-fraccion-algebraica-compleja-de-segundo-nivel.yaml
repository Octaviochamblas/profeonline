semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.SEGUNDO_NIVEL
resumen_inicial: 'Simplificación de fracción algebraica compleja de segundo nivel:
  concepto, reglas operativas y simplificación en Fracciones algebraicas complejas.'
explicacion_simple: Una vez que 'acuestas' la fracción compleja (pasándola a horizontal),
  el problema pasa de ser una torre intimidante a un simple ejercicio de multiplicación
  que ya dominas.
explicacion_formal: '### Definición formal


  Esta regla es equivalente a invertir y multiplicar: (A/B) * (D/C) = AD / BC.


  ### Desarrollo didáctico


  El famoso truco para resolver la fracción compleja en el último paso, una vez que
  lograste aplanar ambos pisos a formas simples, se conoce de múltiples formas: regla
  del sándwich, ley de la oreja, o multiplicación de extremos por medios.


  Tienes la estructura purificada: $\frac{\frac{A}{B}}{\frac{C}{D}}$


  Esto es equivalente a $\frac{A}{B} \div \frac{C}{D}$.

  Si recuerdas la regla de división (Mantener, Cambiar, Voltear), esto se vuelve $\frac{A}{B}
  \cdot \frac{D}{C} = \frac{AD}{BC}$.


  **La Regla del Sándwich visualizada:**

  1. Multiplicas los elementos de afuera (los tapas del pan): El de más arriba ($A$)
  y el de más abajo ($D$). Ellos forman el nuevo Numerador ($AD$).

  2. Multiplicas los elementos del medio (el relleno): Los que están cerca de la línea
  gruesa central ($B$ y $C$). Ellos forman el nuevo Denominador ($BC$).


  Resultado final en un paso: $\frac{AD}{BC}$. Rápido y sin dolor.'
