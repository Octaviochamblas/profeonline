semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.SEGUNDO_NIVEL
resumen_inicial: Una fracción compleja de segundo nivel se simplifica multiplicando
  extremos con extremos y medios con medios.
explicacion_simple: 'Cuando hemos reducido el numerador a una sola fracción A/B y
  el denominador a una sola fracción C/D, tenemos una fracción compleja de segundo
  nivel.

  Para resolver esta estructura $\frac{\frac{A}{B}}{\frac{C}{D}}$, aplicamos la conocida
  regla de extremos y medios:

  Multiplicamos los dos términos externos A y D para formar el nuevo numerador, y
  multiplicamos los dos términos internos B y C para formar el nuevo denominador.'
explicacion_formal: 'Dada la fracción compleja reducida a dos términos racionales
  $\frac{\frac{A(x)}{B(x)}}{\frac{C(x)}{D(x)}}$, la **regla de los extremos y medios**
  establece la equivalencia:


  $$\frac{\frac{A(x)}{B(x)}}{\frac{C(x)}{D(x)}} = \frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)}
  = \frac{A(x) \cdot D(x)}{B(x) \cdot C(x)}$$


  **Desglose de la fórmula:**

  - $A(x) \cdot D(x)$: Producto de los extremos (término superior e inferior) que
  pasa al numerador final.

  - $B(x) \cdot C(x)$: Producto de los medios (términos centrales) que pasa al denominador
  final.'
definiciones_clave: '- **Regla de extremos y medios**: Algoritmo para resolver la
  división de dos fracciones $\frac{A/B}{C/D}$ multiplicando $A \cdot D$ arriba y
  $B \cdot C$ abajo.

  - **Términos extremos**: El numerador de la fracción superior ($A$) y el denominador
  de la fracción inferior ($D$).

  - **Términos medios**: El denominador de la fracción superior ($B$) y el numerador
  de la fracción inferior ($C$).'
propiedades_relaciones: '- **Simplificación previa de medios y extremos**: Se pueden
  simplificar factores comunes entre los dos numeradores $(A, C)$ o entre los dos
  denominadores $(B, D)$ antes de multiplicar.

  - **Dominio**: Excluye $B(x) = 0$, $D(x) = 0$ y $C(x) = 0$.'
ejemplo_guiado:
  enunciado: Simplifica la fracción compleja de segundo nivel $\frac{\frac{x^2 - 4}{3x}}{\frac{x
    + 2}{6x^2}}$ mediante la regla de extremos y medios, y evalúa para $x = 4$.
  pasos:
  - 'Paso 1: Identificar extremos $A = x^2 - 4 = (x - 2)(x + 2)$ y $D = 6x^2$; medios
    $B = 3x$ y $C = x + 2$.Paso 2: Escribir el producto de extremos sobre medios:
    $\frac{(x^2 - 4) \cdot 6x^2}{3x \cdot (x + 2)}$.Paso 3: Factorizar y simplificar:
    $\frac{(x - 2)(x + 2) \cdot 6x^2}{3x(x + 2)}$.Paso 4: Cancelar $(x + 2)$, simplificar
    $6x^2 / 3x = 2x$: resultado $2x(x - 2)$ para $x \notin \{-2, 0\}$.Paso 5: Evaluar
    para $x = 4$: $2(4)(4 - 2) = 8(2) = 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla para simplificar la fracción compleja $\frac{\frac{A}{B}}{\frac{C}{D}}$?
  choices:
  - text: Multiplicar los extremos $A \cdot D$ en el numerador y los medios $B \cdot
      C$ en el denominador.
    is_correct: true
  - text: Multiplicar $A \cdot C$ arriba y $B \cdot D$ abajo.
    is_correct: false
  - text: Sumar $A + D$ y restar $B - C$.
    is_correct: false
  - text: Invertir la primera fracción $B/A$ y multiplicar por $C/D$.
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicar los extremos $A \cdot D$ en
    el numerador y los medios $B \cdot C$ en el denominador.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar $\frac{\frac{x^2 - 4}{3x}}{\frac{x + 2}{6x^2}}$ y evaluar
    la expresión reducida para $x = 4$, ¿cuál es el resultado?
  choices:
  - text: $16$
    is_correct: true
  - text: $8$
    is_correct: false
  - text: $24$
    is_correct: false
  - text: $12$
    is_correct: false
  explanation: La alternativa correcta es '$16$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asegurarse de que tanto el numerador como el denominador sean una única
  fracción.'
- 'Paso 2: Multiplicar el numerador superior por el denominador inferior (extremos)
  para el nuevo numerador.'
- 'Paso 3: Multiplicar el denominador superior por el numerador inferior (medios)
  para el nuevo denominador.'
- 'Paso 4: Factorizar la fracción simple resultante y cancelar términos comunes.'
errores_correccion: '- **Error común:** Invertir la posición escribiendo los medios
  en el numerador y los extremos en el denominador.

  - **Cómo corregirlo:** Grábate la frase: EXTREMOS ARRIBA, MEDIOS ABAJO ($A \cdot
  D$ va en el numerador, $B \cdot C$ va en el denominador).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración de fracción compleja.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de fracción compleja.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se aplica extremos y medios en fracciones complejas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla básica de simplificación.
- titulo: ¿Las fracciones continuas infinitas se resuelven con ecuaciones cuadráticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, aprovechando su propiedad de auto-similitud.
errores_frecuentes:
- Confundir la barra principal de división con las barras secundarias.
- Invertir los medios y ponerlos en el numerador en la regla de extremos y medios.
- Multiplicar por el m.c.m. solo algunos términos omitiendo el denominador.
- Intentar resolver fracciones continuas finitas de arriba hacia abajo.
- Aceptar soluciones negativas al resolver fracciones continuas infinitas de términos
  positivos.
afirmaciones_verdaderas:
- Una fracción compleja se simplifica multiplicando extremos con extremos y medios
  con medios.
- Multiplicar numerador y denominador por el m.c.m. de las sub-fracciones elimina
  la complejidad en un solo paso.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, simplificar
  y resolver fracciones algebraicas complejas y continuas expresando el resultado
  en su forma más simple.
