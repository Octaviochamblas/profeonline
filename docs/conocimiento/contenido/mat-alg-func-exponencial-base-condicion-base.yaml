semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.CONDICION_BASE
resumen_inicial: 'Condición de base positiva y distinta de uno en una función exponencial:
  conceptos, asíntotas, propiedades e inversidad en Conceptos de la función exponencial.'
explicacion_simple: 'Estas dos restricciones sobre la base no son arbitrarias: sin
  ellas, la función dejaría de comportarse como una exponencial genuina, o simplemente
  no estaría bien definida.'
explicacion_formal: '### Definición formal


  La condición $b>0$ es necesaria porque potencias con base negativa y exponente no
  entero (como $(-2)^{0{,}5}$) no están definidas dentro de los números reales. La
  condición $b\neq1$ es necesaria porque $1^x=1$ para todo $x$, lo que convertiría
  a $f(x)=a\cdot1^x=a$ en una función constante, no exponencial.


  ### Desarrollo didáctico


  Ambas condiciones garantizan que la función tenga el comportamiento característico
  esperado: definida para todo $x$ real, y con un crecimiento o decrecimiento genuino,
  no constante.


  Si $f(x)=5\cdot(-2)^x$, la base negativa hace que la función no esté definida para
  exponentes fraccionarios, como $x=0{,}5$, ya que $\sqrt{-2}$ no es un número real.'
definiciones_clave: '- **Condición de base positiva y distinta de uno en una función
  exponencial**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a condición de base positiva y distinta de uno en una función exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de condición
    de base positiva y distinta de uno en una función exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de condición de base positiva
    y distinta de uno en una función exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    condición de base positiva y distinta de uno en una función exponencial?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en conceptos de la
      función exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en conceptos de la función exponencial. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en condición de base positiva y distinta de uno en una función exponencial?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la base $b$ propuesta sea un número positivo.'
- 'Paso 2: Verifica que la base $b$ sea distinta de 1.'
- 'Paso 3: Si ambas condiciones se cumplen, la base es válida para una función exponencial.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en condición
  de base positiva y distinta de uno en una función exponencial.
ejemplos:
- titulo: Verificación de base válida
  enunciado: ¿Es válida la base de $f(x)=3\cdot7^x$ para una función exponencial?
  solucion_pasos:
  - $b=7$ es positivo y distinto de 1.
  - Sí, es una base válida.
- titulo: Verificación de base inválida por ser igual a 1
  enunciado: ¿Es válida la base de $f(x)=3\cdot1^x$ para una función exponencial?
  solucion_pasos:
  - $b=1$ no cumple la condición $b\neq1$.
  - No es una base válida; la función se reduce a la constante $f(x)=3$.
- titulo: ¿Una base negativa puede producir una función definida para todo $x$ real?
  enunciado: ¿Una base negativa puede producir una función definida para todo $x$
    real?
  respuesta: 'No'
  solucion_pasos:
  - Para exponentes fraccionarios, una base negativa produce raíces de números negativos,
    que no son reales.
- titulo: ¿La condición $b\neq1$ evita que la función sea constante?
  enunciado: ¿La condición $b\neq1$ evita que la función sea constante?
  respuesta: Sí
  solucion_pasos:
  - Con $b=1$, la función $f(x)=a\cdot1^x=a$ sería constante, perdiendo el carácter
    exponencial.
errores_frecuentes:
- Aceptar como válida una base negativa sin considerar los problemas de definición
  para exponentes no enteros.
- Aceptar $b=1$ como base válida sin reconocer que produce una función constante.
- Declarar la condición sobre la base $b$ con una condición sobre el coeficiente $a$.
- No verificar ambas condiciones (positividad y distinta de 1) simultáneamente.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando condición de base positiva y distinta de uno en una función exponencial.
