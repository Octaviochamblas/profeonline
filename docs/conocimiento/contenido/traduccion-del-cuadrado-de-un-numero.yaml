semantic_id: MAT.ALG.LENGUAJE_RELACIONES.CUADRADO_NUMERO
resumen_inicial: La traducción del cuadrado de un número consiste en representar simbólicamente la elevación de una variable o expresión a la potencia de exponente dos $x^2$.
explicacion_simple: "El **cuadrado de un número** expresa la multiplicación de esa cantidad por sí misma mediante una **potencia de exponente 2**:\n- Frases verbales: *\"Un número al cuadrado\"*, *\"El cuadrado de $x$\"*, *\"Elevar $x$ a la segunda potencia\"*.\n- Traducción: **$x^2$**.\n- Ejemplo 1: \"El cuadrado de $x$\" $\\implies **x^2**$.\n- Ejemplo 2: \"El cuadrado de la suma entre $a$ y $b$\" $\\implies **(a + b)^2**$.\n- Ejemplo 3: \"La suma de los cuadrados de $a$ y $b$\" $\\implies **a^2 + b^2**$.\n- **¡Atención!** No confundas \"el doble de $x$\" ($2x$) con \"el cuadrado de $x$\" ($x^2$).\n  - Para $x = 5$: El doble es $2(5) = 10$; el cuadrado es $5^2 = 25$.\n\n![Cuadrado de un Número](/static/img/nodos/traduccion-del-cuadrado-de-un-numero-intro.svg)\n"
explicacion_formal: '### Definición formal

  La **operación de elevación al cuadrado** mapea una cantidad variable $x \in \mathbb{R}$ en la potencia de exponente dos $Q(x) \in \mathbb{R}[x]$:


  $$Q(x) = x^2 = x \cdot x$$


  ### Paridad del Cuadrado

  Para todo número real no nulo $x \in \mathbb{R} \setminus \{0\}$, el cuadrado es estrictamente positivo:


  $$\forall x \in \mathbb{R}, \quad x^2 \ge 0$$


  ### Distinción Sintáctica Fundamental

  - **Cuadrado de la suma de dos cantidades**: $(A + B)^2 = A^2 + 2AB + B^2$.

  - **Suma de los cuadrados de dos cantidades**: $A^2 + B^2$.


  ### Síntesis didáctica

  El cuadrado algebraico representa el área de un cuadrado geométrico de lado $x$, siendo la base de las expresiones cuadráticas y el teorema de Pitágoras.

  '
definiciones_clave: '- **Cuadrado de un número ($x^2$)**: Potencia obtenida al multiplicar una variable o expresión $x$ por sí misma.

  - **Exponente dos ($2$)**: Cifra en superíndice que indica la segunda potencia de la base.

  - **No negatividad real ($x^2 \ge 0$)**: Propiedad por la cual elevar cualquier número real al cuadrado produce un resultado no negativo.

  '
propiedades_relaciones: '- **Independencia del signo del argumento**: El cuadrado de un número y el de su opuesto son idénticos ($(-x)^2 = x^2$).

  - **Distribución sobre el producto**: El cuadrado del producto es el producto de los cuadrados ($(xy)^2 = x^2 y^2$).

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El doble del cuadrado de un número $x$ aumentado en el cuadrado del triple de $y$".'
  pasos:
  - 'Paso 1: Traducimos "El doble del cuadrado de $x$": El $2$ multiplica al cuadrado de $x \implies 2x^2$.'
  - 'Paso 2: Traducimos "El triple de $y$": $3y$.'
  - 'Paso 3: Traducimos "El cuadrado del triple de $y$": Elevar el conjunto $(3y)$ al cuadrado $\implies (3y)^2 = 9y^2$.'
  - 'Paso 4: Unimos ambas partes con la adición "aumentado en" $\implies 2x^2 + 9y^2$.'
  - 'Conclusión: La expresión traducida es **$2x^2 + 9y^2$**.'
  imagen: /static/img/nodos/traduccion-del-cuadrado-de-un-numero-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué notación algebraica representa la frase verbal "El cuadrado de un número $x$"? '
  choices:
  - text: 'Se representa elevando la variable al exponente dos: $x^2$'
    is_correct: true
  - text: 'Se representa multiplicando la variable por dos: $2x$'
    is_correct: false
  - text: 'Se representa sumando dos a la variable: $x + 2$'
    is_correct: false
  - text: 'Se representa dividiendo la variable entre dos: $\frac{x}{2}$'
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa elevando la variable al exponente dos: $x^2$''. Potencia cuadrática.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cuál es la diferencia traducida entre "El cuadrado de la suma $(a + b)$" y "La suma de los cuadrados $a$ y $b$"? '
  choices:
  - text: '"El cuadrado de la suma" es $(a + b)^2$, mientras que "la suma de los cuadrados" es $a^2 + b^2$'
    is_correct: true
  - text: Ambas frases se traducen como la misma expresión $a^2 + b^2$
    is_correct: false
  - text: '"El cuadrado de la suma" es $2(a + b)$ y "la suma de cuadrados" es $2a + 2b$'
    is_correct: false
  - text: '"El cuadrado de la suma" es $a^2 b^2$'
    is_correct: false
  explanation: La alternativa correcta es '"El cuadrado de la suma" es $(a + b)^2$, mientras que "la suma de los cuadrados" es $a^2 + b^2$'. Paréntesis en la suma vs cuadrados individuales.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable o expresión que actúa como base de la potencia.'
- 'Paso 2: Escribir el superíndice $2$ inmediatamente a la derecha de la base.'
- 'Paso 3: Si la frase expresa "el cuadrado de [una suma/resta]", colocar primero la suma o resta entre paréntesis $(A \pm B)^2$.'
- 'Paso 4: Si la frase expresa "la suma/resta de los cuadrados", elevar cada variable individualmente al cuadrado $A^2 \pm B^2$.'
errores_correccion: '- **Error 1:** Escribir la multiplicación por dos $2x$ al traducir "el cuadrado de $x$". **Cómo corregirlo:** "El cuadrado" **eleva al exponente 2 ($x^2$)**; "el doble" multiplica por 2 ($2x$).

  - **Error 2:** Escribir $a^2 + b^2$ al traducir "el cuadrado de la suma de $a$ y $b$". **Cómo corregirlo:** "El cuadrado de la suma" **exige paréntesis $(a + b)^2$**, cuyo desarrollo es $a^2 + 2ab + b^2$.

  '
ejemplos:
- titulo: Cuadrado simple
  enunciado: ¿Cuál es la traducción del "Cuadrado de un número $m$"?
  alternativas:
  - $m^2$
  - $2m$
  - $m + 2$
  respuesta: $m^2$
  solucion_pasos:
  - '1. Variable: $m$.'
  - '2. Cuadrado: $m^2$.'
- titulo: Cuadrado de una resta
  enunciado: ¿Cuál es la traducción de "El cuadrado de la diferencia entre $x$ y $3$"?
  alternativas:
  - $(x - 3)^2$
  - $x^2 - 3^2$
  - $2(x - 3)$
  respuesta: $(x - 3)^2$
  solucion_pasos:
  - '1. Diferencia: $(x - 3)$.'
  - '2. Cuadrado de la diferencia: $(x - 3)^2$.'
- titulo: Resultado no negativo
  enunciado: Para $x = -6$, ¿es el cuadrado $x^2 = (-6)^2 = 36$ un número estrictamente positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo número real al cuadrado produce un resultado no negativo.
- titulo: Doble del cuadrado
  enunciado: La frase "El doble del cuadrado de $n$", ¿se traduce como $2n^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el 2 multiplica a la potencia cuadrática $n^2 \implies 2n^2$.
errores_frecuentes:
- Escribir la multiplicación por dos 2x al traducir la frase el cuadrado de un número.
- Escribir a^2 + b^2 al traducir el enunciado el cuadrado de la suma entre a y b.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que elevar un número negativo al cuadrado produce un resultado negativo.
- Los paréntesis no son incluidos al elevar al cuadrado el producto de un número con una variable.
afirmaciones_verdaderas:
- La traducción del cuadrado de un número eleva a la variable o expresión al exponente 2.
- El cuadrado de la suma entre dos números (a+b)^2 difiere de la suma de los cuadrados a^2 + b^2.
al_terminar_debes_poder: '![Resumen de cuadrado de un número](/static/img/nodos/traduccion-del-cuadrado-de-un-numero-resumen.svg)


  QUÉ: Traducir la potenciación al cuadrado de una cantidad simple o compuesta.


  CÓMO: Elevar la expresión base al exponente 2 ($x^2$), distinguiendo rigurosamente el cuadrado de la suma $(a+b)^2$ de la suma de cuadrados $a^2+b^2$.'
