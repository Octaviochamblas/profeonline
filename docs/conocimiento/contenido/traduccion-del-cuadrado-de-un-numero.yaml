resumen_inicial: La traducción del cuadrado de un número permite representar estructuras
  matemáticas de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con traducción del cuadrado de un número, transformamos
  frases sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Traducción
  del cuadrado de un número** viene dada por:


  $$\text{"el cuadrado de un número x aumentado en 3"} \implies x^2 + 3$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Traducción del cuadrado de un número**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: x^2 + 3 define la estructura
  requerida.'
ejemplo_guiado:
  enunciado: 'Traduzca o exprese según traducción del cuadrado de un número: ''el
    cuadrado de un número x aumentado en 3''.'
  pasos:
  - 'Paso 1: Identificar las variables o parámetros del enunciado.'
  - 'Paso 2: Aplicar la regla de traducción correspondiente a traducción del cuadrado
    de un número.'
  - 'Conclusión: La expresión resultante es x^2 + 3.'
