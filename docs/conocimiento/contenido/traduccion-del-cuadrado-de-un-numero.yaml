errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir traducción
  del cuadrado de un número.
- Invertir el orden de las variables al construir la expresión de traducción del cuadrado
  de un número.
- Usar una suma cuando el enunciado de traducción del cuadrado de un número exige
  una resta o división.
- Omitir paréntesis al multiplicar expresiones en traducción del cuadrado de un número.
- Declarar que la expresión de traducción del cuadrado de un número es válida sólo
  para números pares.
afirmaciones_verdaderas:
- La traducción simbólica de traducción del cuadrado de un número preserva la relación
  de orden o sucesión entre cantidades.
- La notación algebraica permite expresar relaciones numéricas complejas de forma
  compacta.
al_terminar_debes_poder: Al terminar serás capaz de traducir expresiones de traducción
