semantic_id: MAT.ALG.LENGUAJE_RELACIONES.CUADRADO_NUMERO
resumen_inicial: 'Traducción del cuadrado de un número: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: En el álgebra, crecer multiplicando no es lo mismo que crecer
  exponencialmente. La diferencia entre el doble y el cuadrado es la diferencia entre
  un edificio y una bomba atómica.
explicacion_formal: "### Definición formal\n\nDoble = factor lineal (coeficiente 2).\
  \ Cuadrado = factor exponencial (exponente 2).\n\n### Desarrollo didáctico\n\nPalabras\
  \ clave:\n- El cuadrado de\n- Elevado a dos\n- Multiplicado por sí mismo\n\nComparación\
  \ crítica:\n- 'El doble de un número' $\\rightarrow$ $2x$ (crecimiento lineal).\n\
  - 'El cuadrado de un número' $\\rightarrow$ $x^2$ (crecimiento cuadrático).\n\n\
  El uso del paréntesis es dictatorial cuando hay más términos. \n- 'El cuadrado de\
  \ la suma de dos números' $\\rightarrow$ Primero sumo, luego elevo: $(x + y)^2$.\n\
  - 'La suma de los cuadrados de dos números' $\\rightarrow$ Primero elevo, luego\
  \ sumo: $x^2 + y^2$."
definiciones_clave: '- **Traducción del cuadrado de un número**: Herramienta clave
  para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción del cuadrado de un número.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    del cuadrado de un número.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción del cuadrado de
    un número.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
