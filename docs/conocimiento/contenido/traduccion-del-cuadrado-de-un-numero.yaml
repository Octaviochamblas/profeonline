procedimiento:
- 'Paso 1: Identifica a qué entidad le aplicarás el cuadrado (a una letra sola, o
  a un grupo de operaciones).'
- 'Paso 2: Si es a una letra sola, colócale el exponente 2 arriba a la derecha (x^2).'
- 'Paso 3: Si es a un grupo u operación (una suma, un producto), envuelve el grupo
  en paréntesis y coloca el exponente 2 fuera de ellos.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción del cuadrado de un número.
ejemplos:
- titulo: El orden del cuadrado
  enunciado: 'Traduce algebraicamente: ''El cuadrado de la diferencia entre a y b''.'
  solucion_pasos:
  - 'Primero analizamos qué es lo que se va a elevar: ''la diferencia entre a y b''.'
  - 'Escribimos esa diferencia: a - b.'
  - 'Ahora aplicamos el cuadrado A TODO ESO, usando paréntesis: (a - b)^2.'
- titulo: Un teorema en física afirma que 'la energía cinética de una partícula es
    proporcional a la m
  enunciado: 'Un teorema en física afirma que ''la energía cinética de una partícula
    es proporcional a la mitad del producto entre su masa ($m$) y el cuadrado de su
    velocidad ($v$)''. ¿Cómo se traduce fielmente esta afirmación al lenguaje algebraico
    para estructurar la ecuación de energía ($E$)? (v1)


    Opciones: A) $E = \frac{1}{2} m v^2$ · B) $E = \frac{1}{2} (mv)^2$ · C) $E = m
    \cdot \left(\frac{v}{2}\right)^2$ · D) $E = \frac{1}{2} m \cdot 2v$'
  solucion_pasos:
  - 'Analizamos: ''la mitad'' (fracción 1/2) del ''producto entre'' (multiplicación
    de) su masa (m) y el ''cuadrado de la velocidad'' ($v^2$). El cuadrado solo afecta
    a la velocidad. Resultado: $E = \frac{1}{2} m v^2$.'
- titulo: 'Respecto de «Traducción del cuadrado de un número»: ¿Se ajusta a la definición
    esta afirmaci'
  enunciado: 'Respecto de «Traducción del cuadrado de un número»: ¿Se ajusta a la
    definición esta afirmación? «El **Cuadrado de un Número** se traduce elevando
    la variable a la potencia de dos ($x^2$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Cuadrado de un Número**
    se traduce elevando la variable a la potencia de dos ($x^2$).'
- titulo: 'Respecto de «Traducción del cuadrado de un número»: ¿Es compatible con
    el procedimiento esta'
  enunciado: 'Respecto de «Traducción del cuadrado de un número»: ¿Es compatible con
    el procedimiento esta afirmación? «Confundir el cuadrado ($x^2$) con el doble
    ($2x$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Cuadrado de un Número**
    se traduce elevando la variable a la potencia de dos ($x^2$).'
errores_frecuentes:
- Confundir el cuadrado ($x^2$) con el doble ($2x$).
- Omitir los paréntesis, traduciendo 'el cuadrado de la suma' como $x + y^2$ (donde
  solo la y quedó elevada al cuadrado).
- Para «En el contexto de modelamiento matemático, ¿cuál es la diferencia operatoria
  entre 'el doble de una variable' y 'el cuadrado de una variable'? (v1)», la respuesta
  correcta es Ambas operaciones son equivalentes algebraicamente.
- El cuadrado implica sumar la variable $4$ veces ($x+x+x+x$).
- El 'doble' implica usar exponentes y el 'cuadrado' usar coeficientes.
afirmaciones_verdaderas:
- La traducción de traducción del cuadrado de un número preserva el significado matemático
  del enunciado.
al_terminar_debes_ponder: Traducir y evaluar expresiones que involucren traducción
  del cuadrado de un número.
