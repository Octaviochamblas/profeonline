resumen_inicial: La interpolación de $m$ medios geométricos entre dos extremos positivos
  $A$ y $B$ calcula los términos intermedios de una P.G. con razón $r = \sqrt[m+1]{\frac{B}{A}}$.
explicacion_simple: Interpolar medios geométricos significa meter varios números entre
  dos extremos de modo que la secuencia resultante sea una progresión geométrica.
  Para encontrar la razón multiplicativa $r$, dividimos el último número entre el
  primero y le sacamos la raíz de orden $(m + 1)$.
explicacion_formal: 'Para insertar $m$ medios geométricos $\{y_1, y_2, \dots, y_m\}$
  entre los extremos positivos $A$ y $B$, el número total de términos es $N = m +
  2$. La **Razón de Interpolación Geométrica $r$** es:


  $$B = A \cdot r^{m+1} \implies r^{m+1} = \frac{B}{A} \implies r = \sqrt[m+1]{\frac{B}{A}}$$


  **Construcción de los términos intermedios:**

  $$y_1 = A \cdot r, \quad y_2 = A \cdot r^2, \quad \dots, \quad y_m = A \cdot r^m$$'
definiciones_clave: '- **Interpolación geométrica**: Inserción de $m$ números entre
  $A$ y $B$ usando $r = \sqrt[m+1]{\frac{B}{A}}$.'
propiedades_relaciones: '- **Razón multiplicativa de interpolación**: Raíz de orden
  $(m+1)$ sobre el cociente de extremos $B/A$.'
ejemplo_guiado:
  enunciado: Interpole $2$ medios geométricos positivos entre los extremos $A = 3$
    y $B = 192$.
  pasos:
  - 'Paso 1: Identificar $m = 2$ medios $\implies m + 1 = 3$ intervalos.'
  - 'Paso 2: Calcular la razón de interpolación: $r = \sqrt[3]{\frac{192}{3}} = \sqrt[3]{64}
    = 4$.'
  - 'Paso 3: Construir los $2$ medios multiplicando por $r=4$: $y_1 = 3 \cdot 4 =
    12$, $y_2 = 12 \cdot 4 = 48$.'
  - 'Conclusión: Los medios geométricos interpolados son $(12, 48)$ (sucesión completa:
    $3, 12, 48, 192$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la razón r al interpolar m medios geométricos
    entre A y B?
  choices:
  - text: r = (B / A)^(1 / (m + 1)) (raíz m+1 de B / A)
    is_correct: true
  - text: r = (B / A) / (m + 1)
    is_correct: false
  - text: r = (B - A) / m
    is_correct: false
  - text: r = B · A
    is_correct: false
  explanation: La alternativa correcta es 'r = (B / A)^(1 / (m + 1)) (raíz m+1 de
    B / A)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para interpolar 2 medios entre 3 y 192, ¿cuáles fueron
    los medios obtenidos?
  choices:
  - text: (12, 48)
    is_correct: true
  - text: (24, 96)
    is_correct: false
  - text: (6, 18)
    is_correct: false
  - text: (16, 64)
    is_correct: false
  explanation: La alternativa correcta es '(12, 48)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de interpolar $m$ medios geométricos
  entre dos extremos calculando la razón $r = \sqrt[m+1]{\frac{B}{A}}$.
semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_GEOMETRICA
procedimiento:
- 'Paso 1: Analizar la dinámica de cambio de la sucesión (aditiva vs multiplicativa).'
- 'Paso 2: Formular las ecuaciones de P.A. ($a_n = a_1 + (n-1)d$) o P.G. ($b_n = b_1
  \cdot r^{n-1}$) según corresponda.'
- 'Paso 3: Resolver numéricamente los parámetros despejados o interpolados y verificar
  la consistencia.'
errores_correccion: '- **Error 1: Dividir entre $m$ en lugar de $(m+1)$ al calcular
  la diferencia o razón de interpolación.** **Cómo corregirlo:** Para insertar $m$
  medios intermedios, la distancia se divide en $(m+1)$ intervalos.


  - **Error 2: Usar un modelo aritmético para un problema con crecimiento de tasa
  porcentual constante.** **Cómo corregirlo:** Las tasas de variación porcentual constante
  DEBEN modelarse obligatoriamente con progresiones geométricas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_GEOMETRICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del modelo de progresiones.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia o razón de interpolación.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por interpolación.
- titulo: ¿Dividen m medios de interpolación el intervalo en m + 1 partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $m$ términos intermedios generan $m+1$ saltos.
- titulo: ¿Supera el modelo geométrico al aritmético en el largo plazo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la dominancia del crecimiento exponencial sobre el lineal.
errores_frecuentes:
- Dividir el intervalo entre m en lugar de (m + 1) al calcular la diferencia de interpolación
  de m medios.
- Modelar un incremento porcentual constante utilizando una progresión aritmética
  de suma fija.
- Declarar la razón multiplicativa r con la diferencia aditiva d al formular el término
  general.
- Declarar que la interpolación de medios geométricos exige que los extremos tengan
  signos opuestos.
- Restar los extremos en lugar de dividirlos al calcular la razón de interpolación
  geométrica.
afirmaciones_verdaderas:
- La progresión aritmética modela cambios aditivos constantes y la geométrica modela
  cambios multiplicativos constantes.
- Para interpolar $m$ medios entre $A$ y $B$, se divide el intervalo entre $(m+1)$
  saltos.
