semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_GEOMETRICA
resumen_inicial: 'Interpolación de medios geométricos entre dos términos: concepto
  y desarrollo dentro de Comparación y modelamiento con progresiones.'
explicacion_simple: 'Ya rellenamos huecos sumando. Ahora rellenaremos huecos multiplicando.
  Cuando la brecha entre el primer y último número es explosiva (ejemplo: de 2 a 162
  en pocos pasos), sabes que estás en territorio geométrico. Las raíces serán tus
  mejores amigas aquí.'
explicacion_formal: "Visualicemos: Interpolar **2 medios geométricos** entre el número\
  \ 3 y el número 192.\n- La lista: $3, \\_ , \\_ , 192$.\n- Hay 2 huecos, lo que\
  \ significa que daremos **3 saltos multiplicativos**. (Multiplicaremos por '$r$'\
  \ tres veces seguidas).\n\nPara hallar 'r', hacemos el camino inverso a la potencia\
  \ (la raíz):\n1. Cociente total = $192 / 3 = 64$.\n2. Cantidad de saltos = $k +\
  \ 1 = 2 + 1 = 3$.\n3. Extraer la raíz: $r = \\sqrt[3]{64}$. \n4. Buscamos qué número\
  \ multiplicado por sí mismo 3 veces da 64. ¡Es el 4!\n5. La razón $r = 4$.\n\nLlenamos\
  \ los huecos multiplicando:\n- $3 \\cdot 4 = 12$\n- $12 \\cdot 4 = 48$\n- Comprobamos\
  \ el puente: $48 \\cdot 4 = 192$. ¡Encaje perfecto! Los medios son 12 y 48."
