semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_GEOMETRICA
resumen_inicial: 'La interpolación de $m$ medios geométricos entre dos extremos positivos $A$ y $B$ determina la razón geométrica mediante $r = \sqrt[m+1]{\frac{B}{A}}$, formando una PG de $N = m + 2$ términos.'
explicacion_simple: |
  **Interpolar $m$ medios geométricos** significa insertar $m$ números entre dos extremos $A$ y $B$, de modo que toda la lista forme una **progresión geométrica**:
  - ¿Cómo se hace?
    1. Si insertas $m$ números entre $A$ y $B$, en total habrá **$N = m + 2$ términos**.
    2. Hay exactamente **$m + 1$ multiplicaciones** o saltos geométricos.
    3. Para hallar la razón $r$, divides el extremo final entre el inicial y extraes la **raíz de índice $(m + 1)$**:
       $$r^{m+1} = \frac{B}{A} \implies r = \sqrt[m+1]{\frac{B}{A}}$$
    4. Multiplicas sucesivamente por $r$ a partir de $A$.
  - Por ejemplo, para interpolar $3$ medios entre $2$ y $162$:
    - $m = 3 \implies m + 1 = 4$ saltos.
    - $r = \sqrt[4]{\frac{162}{2}} = \sqrt[4]{81} = 3$.
    - Los medios son: $2 \cdot 3 = **6$**, $6 \cdot 3 = **18$**, $18 \cdot 3 = **54$**.
    - La PG completa queda: $2, 6, 18, 54, 162$.

  ![Interpolación de medios geométricos](/static/img/nodos/interpolacion-de-medios-geometricos-entre-dos-terminos-intro.svg)
explicacion_formal: |
  ### Demostración formal de la Fórmula de Interpolación Geométrica
  Sean $A, B \in \mathbb{R}^+$ dos valores extremos no nulos. Se desea construir una progresión geométrica $(a_n)_{n=1}^N$ tal que:
  - $a_1 = A$
  - $a_N = B$
  - Con $m$ términos intermedios $\{a_2, a_3, \dots, a_{m+1}\}$ denominados **medios geométricos o proporcionales**.

  El número total de términos es $N = m + 2$. Aplicando el término general:
  $$a_N = a_1 \cdot r^{N-1} \implies B = A \cdot r^{m + 2 - 1} = A \cdot r^{m + 1}$$
  Despejando la razón geométrica $r$:
  $$r^{m+1} = \frac{B}{A} \implies r = \sqrt[m+1]{\frac{B}{A}} = \left(\frac{B}{A}\right)^{\frac{1}{m+1}}$$

  ### Generación de los Medios Geométricos
  Los $m$ medios interpolados se calculan como:
  $$a_{k+1} = A \cdot r^k = A \cdot \left(\sqrt[m+1]{\frac{B}{A}}\right)^k \quad \text{para } k = 1, 2, \dots, m$$

  ### Caso Particular: Un Solo Medio Geométrico ($m = 1$)
  Para $m = 1$, la razón es $r = \sqrt{\frac{B}{A}}$, y el medio proporcional intermedio es:
  $$a_2 = A \cdot \sqrt{\frac{B}{A}} = \sqrt{A^2 \cdot \frac{B}{A}} = \sqrt{A \cdot B} \quad (\text{Media Geométrica Clásica})$$

  ### Síntesis didáctica
  - Ecuación de la razón: $r = \sqrt[m+1]{\frac{B}{A}}$.
  - Raíz: Índice $m + 1$ sobre el cociente $B/A$.
definiciones_clave: |
  - **Medios geométricos (o proporcionales)**: Elementos interpolados que conservan el cociente constante entre extremos.
  - **Factor de raíz ($(m+1)$)**: Índice radical correspondiente a la cantidad de intervalos multiplicativos.
  - **Media geométrica ($\sqrt{AB}$)**: Caso particular de interpolación con un único medio intermedio ($m = 1$).
propiedades_relaciones: |
  - **Producto constante**: El producto de dos términos equidistantes de los extremos es constante e igual a $A \cdot B$.
  - **Relación logarítmica**: La interpolación geométrica de $m$ medios entre $A$ y $B$ equivale a la interpolación aritmética de $m$ medios entre $\ln A$ y $\ln B$.
ejemplo_guiado:
  enunciado: 'Interpola 2 medios geométricos entre el número 3 y el número 192 en los números reales positivos. Encuentra la razón $r$ y escribe la progresión geométrica completa.'
  imagen: '/static/img/nodos/interpolacion-de-medios-geometricos-entre-dos-terminos-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: $A = 3, B = 192, m = 2$.'
    - 'Paso 2: Calculamos el total de términos: $N = m + 2 = 2 + 2 = 4$.'
    - 'Paso 3: Calculamos el índice del radical: $m + 1 = 2 + 1 = 3$.'
    - 'Paso 4: Calculamos el cociente: $\frac{B}{A} = \frac{192}{3} = 64$.'
    - 'Paso 5: Extraemos la raíz cúbica: $r = \sqrt[3]{64} = **4$**.'
    - 'Paso 6: Calculamos los 2 medios geométricos multiplicando por $r = 4$:'
    - '  - $a_2 = 3 \cdot 4 = 12$'
    - '  - $a_3 = 12 \cdot 4 = 48$'
    - 'Paso 7: Conclusión: Los medios son **$12$ y $48$**, y la PG completa es **$3, 12, 48, 192$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la razón $r$ al interpolar $m$ medios geométricos entre $A$ y $B$?'
    choices:
      - {text: '$r = \sqrt[m+1]{\frac{B}{A}}$', is_correct: true}
      - {text: '$r = \frac{B - A}{m + 1}$ (fórmula de interpolación aritmética)', is_correct: false}
      - {text: '$r = \sqrt[m]{\frac{B}{A}}$', is_correct: false}
      - {text: '$r = \frac{B}{A \cdot (m + 1)}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$r = \sqrt[m+1]{\frac{B}{A}}$''. Se divide $B$ entre $A$ y se extrae la raíz de índice $m + 1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se interpola 1 medio geométrico positivo entre 4 y 36, ¿cuál es su valor?'
    choices:
      - {text: '$12$, calculando $\sqrt{4 \cdot 36} = \sqrt{144} = 12$', is_correct: true}
      - {text: '$20$, calculando la media aritmética $\frac{4+36}{2}$', is_correct: false}
      - {text: '$9$', is_correct: false}
      - {text: '$16$', is_correct: false}
    explanation: 'La alternativa correcta es ''$12$, calculando $\sqrt{4 \cdot 36} = \sqrt{144} = 12$''. El medio geométrico único es la media geométrica de los extremos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los extremos positivos $A, B$ y la cantidad de medios geométricos $m$.'
  - 'Paso 2: Calcular el cociente $\frac{B}{A}$.'
  - 'Paso 3: Calcular el índice del radical $m + 1$.'
  - 'Paso 4: Extraer la raíz: $r = \sqrt[m+1]{\frac{B}{A}}$.'
  - 'Paso 5: Generar los medios multiplicando sucesivamente por $r$ a partir de $A$.'
errores_correccion: |
  - **Error 1:** Extraer raíz de índice $m$ en lugar de $(m + 1)$ para la razón $r$. **Cómo corregirlo:** La cantidad de factores multiplicativos **es siempre $(m + 1)$**: $r = \sqrt[m+1]{\frac{B}{A}}$.
  - **Error 2:** Restar los extremos ($B - A$) en vez de dividirlos. **Cómo corregirlo:** En la interpolación geométrica **la relación es multiplicativa (división $\frac{B}{A}$)**, no aditiva.
ejemplos:
  - titulo: 'Interpolación de 3 medios geométricos'
    enunciado: 'Para interpolar 3 medios geométricos entre 1 y 16, ¿cuál es la razón $r$?'
    alternativas:
      - '$r = 2$'
      - '$r = 4$'
      - '$r = 1,5$'
    respuesta: '$r = 2$'
    solucion_pasos:
      - '1. $r = \sqrt[3+1]{16/1} = \sqrt[4]{16} = 2$.'
  - titulo: 'Interpolación de 2 medios con fracciones'
    enunciado: 'Para interpolar 2 medios geométricos entre 54 y 2, ¿cuál es la razón $r$?'
    alternativas:
      - '$r = \frac{1}{3}$'
      - '$r = \frac{1}{2}$'
      - '$r = 3$'
    respuesta: '$r = \frac{1}{3}$'
    solucion_pasos:
      - '1. $r = \sqrt[3]{2/54} = \sqrt[3]{1/27} = 1/3$.'
      - '2. Medios: $54 \cdot 1/3 = 18$, $18 \cdot 1/3 = 6$.'
  - titulo: 'Media geométrica de extremos'
    enunciado: '¿El medio geométrico entre 9 y 25 es igual a 15?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $\sqrt{9 \cdot 25} = 3 \cdot 5 = 15$.'
  - titulo: 'Total de términos en la interpolación'
    enunciado: '¿Interpolar 4 medios geométricos genera una progresión geométrica de 6 términos?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $N = m + 2 = 4 + 2 = 6$.'
errores_frecuentes:
  - 'Extraer la raíz de índice $m$ en lugar de $(m + 1)$ al despejar la razón geométrica.'
  - 'Restar los valores extremos en lugar de dividirlos al calcular los medios geométricos.'
  - 'Calcular la media aritmética en lugar de la media geométrica cuando $m = 1$.'
  - 'Asumir que los medios geométricos siempre deben ser mayores que los extremos.'
  - 'Omitir la comprobación del extremo final al completar la serie multiplicativa.'
afirmaciones_verdaderas:
  - 'La interpolación de $m$ medios geométricos entre los extremos positivos $A$ y $B$ requiere una razón calculada mediante $r = \sqrt[m+1]{\frac{B}{A}}$.'
  - 'Un único medio geométrico interpolado entre dos números positivos coincide exactamente con su media geométrica $\sqrt{A \cdot B}$.'
al_terminar_debes_poder: |
