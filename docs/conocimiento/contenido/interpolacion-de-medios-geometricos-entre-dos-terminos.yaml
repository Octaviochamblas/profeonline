procedimiento:
- 'Paso 1: Divide el término final entre el término inicial ($B / A$).'
- 'Paso 2: A la cantidad de números a interpolar ($k$) súmale 1 ($k + 1$). Este será el índice
  de tu raíz.'
- 'Paso 3: Saca la raíz de índice ''$(k+1)$'' al resultado de la división. Esa es tu razón
  ''r''.'
- 'Paso 4: Multiplica por ''r'' repetidamente partiendo desde ''A'' para llenar los espacios.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en interpolación de medios geométricos entre dos términos.
ejemplos:
- titulo: El eslabón perdido
  enunciado: Interpolar 1 medio geométrico entre 5 y 125.
  solucion_pasos:
  - A = 5, B = 125, k = 1.
  - Índice de la raíz = 1 + 1 = 2 (raíz cuadrada).
  - Cociente = 125 / 5 = 25.
  - r = Raíz Cuadrada de 25 = 5.
  - 'Interpolar: 5 * 5 = 25. Compruebo: 25 * 5 = 125.'
  - El medio geométrico es 25.
- titulo: Ejemplo 1
  enunciado: Interpola 1 medio geométrico entre 3 y 27. ¿Cuál es?
  alternativas:
  - '9'
  - '15'
  - '81'
  respuesta: '9'
  solucion_pasos:
  - La raíz cuadrada de (27 dividido entre 3) es la raíz cuadrada de 9, o sea 3; 3 por 3 es
    igual a 9.
- titulo: Ejemplo 2
  enunciado: Interpola 2 medios geométricos entre 2 y 54. ¿Cuál es la razón r?
  alternativas:
  - '3'
  - '9'
  - '27'
  respuesta: '3'
  solucion_pasos:
  - La raíz cúbica de (54 dividido entre 2) es la raíz cúbica de 27, o sea 3.
- titulo: ¿Si el índice de la raíz es par, puede haber dos razones posibles?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo, la raíz cuadrada de 25 puede ser 5 o -5.
- titulo: ¿Se puede interpolar un medio geométrico usando el mismo procedimiento que uno aritmético?
  respuesta: 'No'
  solucion_pasos:
  - El procedimiento geométrico usa raíces y multiplicación, no restas y divisiones.
errores_frecuentes:
- 'Olvidar que si la cantidad de saltos ($k+1$) es un número PAR (ej: raíz cuadrada o cuarta),
  la razón ''r'' podría ser un número negativo (Ej: $\sqrt{25}$ puede ser 5 o -5), abriendo
  la puerta a dos sucesiones posibles.'
- Aplicar la fórmula de interpolación aritmética por error, terminando con sumas raras en
  vez de raíces.
- Dividir en vez de sacar raíz al buscar la razón entre los dos extremos.
- Olvidar que si el índice de la raíz es par, existen dos razones posibles, una positiva y
  una negativa.
- Aplicar el procedimiento de interpolación aritmética por error, sumando en vez de multiplicar.
afirmaciones_verdaderas:
- La formulación de interpolación de medios geométricos entre dos términos mantiene la regularidad
  de la sucesión.
- Al interpolar k medios geométricos entre dos números positivos, el índice de la raíz que
  se debe extraer siempre es k más 1.
