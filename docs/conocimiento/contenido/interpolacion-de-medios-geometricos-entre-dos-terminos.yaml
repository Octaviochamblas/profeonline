procedimiento:
- 'Paso 1: Divide el término final entre el término inicial ($B / A$).'
- 'Paso 2: A la cantidad de números a interpolar ($k$) súmale 1 ($k + 1$). Este será
  el índice de tu raíz.'
- 'Paso 3: Saca la raíz de índice ''$(k+1)$'' al resultado de la división. Esa es
  tu razón ''r''.'
- 'Paso 4: Multiplica por ''r'' repetidamente partiendo desde ''A'' para llenar los
  espacios.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en interpolación de medios geométricos entre dos términos.
ejemplos:
- titulo: El eslabón perdido
  enunciado: Interpolar 1 medio geométrico entre 5 y 125.
  solucion_pasos:
  - A = 5, B = 125, k = 1.
  - Índice de la raíz = 1 + 1 = 2 (raíz cuadrada).
  - Cociente = 125 / 5 = 25.
  - r = Raíz Cuadrada de 25 = 5.
  - 'Interpolar: 5 * 5 = 25. Compruebo: 25 * 5 = 125.'
  - El medio geométrico es 25.
errores_frecuentes:
- 'Olvidar que si la cantidad de saltos ($k+1$) es un número PAR (ej: raíz cuadrada
  o cuarta), la razón ''r'' podría ser un número negativo (Ej: $\sqrt{25}$ puede ser
  5 o -5), abriendo la puerta a dos sucesiones posibles.'
- Aplicar la fórmula de interpolación aritmética por error, terminando con sumas raras
  en vez de raíces.
afirmaciones_verdaderas:
- La formulación de interpolación de medios geométricos entre dos términos mantiene
  la regularidad de la sucesión.
