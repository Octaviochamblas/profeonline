  QUÉ: Interpolar $m$ medios geométricos entre dos números reales positivos cualesquiera.
  CÓMO: Resolver la ecuación $r = \sqrt[m+1]{\frac{B}{A}}$ y generar secuencialmente la progresión geométrica de $m + 2$ términos.
