semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.INTERPOLACION_GEOMETRICA
resumen_inicial: 'La interpolación de $m$ medios geométricos entre dos extremos positivos $A$ y $B$ consiste en intercalar $m$ números intermedios tales que los $(m+2)$ términos formen una progresión geométrica de razón $r = \sqrt[m+1]{\frac{B}{A}}$.'
explicacion_simple: |
  **Interpolar medios geométricos** es meter números al medio para que la secuencia avance **multiplicando por una razón constante $r$**:
  - Si tienes extremos $A = 3$ y $B = 48$, y deseas **interpolar 3 medios geométricos**:
  - Buscas armar una P.G. de $5$ números: $3, \text{\_\_\_}, \text{\_\_\_}, \text{\_\_\_}, 48$.
  - 1. Divides los extremos: $\frac{48}{3} = 16$.
  - 2. Calculas la raíz con índice $(m+1) = 3+1 = 4$: $r = \sqrt[4]{16} = 2$.
  - 3. Multiplicas sucesivamente por $2$:
    - 1º medio: $3 \cdot 2 = 6$
    - 2º medio: $6 \cdot 2 = 12$
    - 3º medio: $12 \cdot 2 = 24$
  - La secuencia completa es: **$3, 6, 12, 24, 48$**.
explicacion_formal: |
  ### Definición formal
  Dados dos números reales positivos $A, B > 0$, la **interpolación de $m$ medios geométricos** consiste en encontrar el conjunto ordenado de $m$ valores $\{y_1, y_2, \dots, y_m\}$ tales que la secuencia ampliada:
  $$(b_1, b_2, b_3, \dots, b_{m+1}, b_{m+2}) = (A, y_1, y_2, \dots, y_m, B)$$
  sea una progresión geométrica de primer término $b_1 = A$ y término final $b_{m+2} = B$.

  ### Fórmula de la razón geométrica $r$
  Utilizando la fórmula del término general para el término final en la posición $n = m + 2$:
  $$b_{m+2} = b_1 \cdot r^{(m + 2 - 1)} \implies B = A \cdot r^{m+1} \implies r^{m+1} = \frac{B}{A} \implies r = \sqrt[m+1]{\frac{B}{A}} = \left(\frac{B}{A}\right)^{\frac{1}{m+1}}$$

  ### Construcción de los términos interpolados
  - $y_1 = A \cdot r$
  - $y_2 = A \cdot r^2$
  - $\dots$
  - $y_k = A \cdot r^k \quad (1 \le k \le m)$

  ### Síntesis didáctica
  - Número total de términos: $n = m + 2$.
  - Razón geométrica de interpolación: $r = \sqrt[m+1]{\frac{B}{A}}$.
definiciones_clave: |
  - **Medios geométricos**: Términos intercalados entre dos extremos para formar una progresión geométrica.
  - **Razón de interpolación ($r$)**: Raíz del cociente de extremos cuyo índice es la cantidad de medios más uno ($m + 1$).
  - **Media geométrica simple ($\sqrt{A \cdot B}$)**: Único medio geométrico ($m=1$) interpolado entre dos números positivos.
propiedades_relaciones: |
  - **Propiedad de la media geométrica ($m=1$)**: Interpolar un único medio geométrico entre $A$ y $B$ devuelve el producto bajo raíz cuadrada $y_1 = \sqrt{A \cdot B}$.
  - **Existencia en $\mathbb{R}$**: Para valores de $(m+1)$ pares, los extremos $A$ y $B$ deben tener el mismo signo para asegurar que el cociente $\frac{B}{A} > 0$ admita raíz real.
ejemplo_guiado:
  enunciado: 'Interpola $2$ medios geométricos entre los números $A = 5$ y $B = 135$.'
  pasos:
    - 'Paso 1: Identificamos los datos: $A = 5$, $B = 135$ y la cantidad de medios $m = 2$.'
    - 'Paso 2: Calculamos el índice de la raíz: $m + 1 = 2 + 1 = 3$.'
    - 'Paso 3: Calculamos la razón geométrica: $r = \sqrt[3]{\frac{135}{5}} = \sqrt[3]{27} = 3$.'
    - 'Paso 4: Construimos los 2 medios multiplicando por $3$: $y_1 = 5 \cdot 3 = 15$, $y_2 = 15 \cdot 3 = 45$. La secuencia completa es **$5, 15, 45, 135$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la razón geométrica $r$ al interpolar $m$ medios geométricos entre dos números positivos $A$ y $B$?'
    choices:
      - {text: 'Extraer la raíz $(m + 1)$-ésima al cociente de los extremos: $r = \sqrt[m+1]{\frac{B}{A}}$', is_correct: true}
      - {text: 'Dividir la resta de extremos entre $m$', is_correct: false}
      - {text: 'Multiplicar los extremos y elevar al cuadrado', is_correct: false}
      - {text: 'Restar $m$ a la división de los extremos', is_correct: false}
    explanation: 'La alternativa correcta es ''Extraer la raíz $(m + 1)$-ésima al cociente de los extremos: $r = \sqrt[m+1]{\frac{B}{A}}$''. Se despeja $r$ de $B/A = r^{m+1}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si deseas interpolar un único medio geométrico ($m=1$) entre los números positivos $A = 4$ y $B = 36$, ¿cuál es el valor de dicho medio?'
    choices:
      - {text: '$y_1 = 12$, calculando la media geométrica $\sqrt{4 \cdot 36} = \sqrt{144} = 12$', is_correct: true}
      - {text: '$y_1 = 20$, calculando el promedio aritmético', is_correct: false}
      - {text: '$y_1 = 9$, dividiendo $36 / 4$', is_correct: false}
      - {text: '$y_1 = 144$, multiplicando $4 \cdot 36$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y_1 = 12$, calculando la media geométrica $\sqrt{4 \cdot 36} = \sqrt{144} = 12$''. $4 \cdot 3 = 12, 12 \cdot 3 = 36$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los extremos $A$ y $B$, y la cantidad de medios $m$ a interpolar.'
  - 'Paso 2: Dividir el extremo final entre el inicial: $\frac{B}{A}$.'
  - 'Paso 3: Extraer la raíz de índice $(m + 1)$ al cociente obtenido para hallar la razón $r = \sqrt[m+1]{\frac{B}{A}}$.'
  - 'Paso 4: Multiplicar $A$ por $r$ sucesivamente para generar los $m$ medios y verificar que el paso $(m+1)$ dé exactamente $B$.'
errores_correccion: |
  - **Error 1:** Usar la resta $(B - A)$ en lugar de la división $\frac{B}{A}$ al buscar la razón geométrica. **Cómo corregirlo:** La razón geométrica se obtiene **DIVIDIENDO extremos: $\frac{B}{A}$** y extrayendo la raíz.
  - **Error 2:** Restar las posiciones en lugar de sumar 1 a la cantidad de medios ($m+1$) para el índice de la raíz. **Cómo corregirlo:** El número de saltos multiplicativos es **$(m + 1)$**.
ejemplos:
  - titulo: 'Interpolación de 2 medios geométricos'
    enunciado: 'Para $A = 2, B = 54, m = 2$, ¿la razón es $r = \sqrt[3]{54/2} = \sqrt[3]{27} = 3$ y los medios son $6$ y $18$?'
    alternativas:
      - 'Sí, la P.G. es $2, 6, 18, 54$'
      - 'No, la razón es 9'
      - 'No, la razón es 6'
    respuesta: 'Sí, la P.G. es $2, 6, 18, 54$'
    solucion_pasos:
      - '1. $r = \sqrt[3]{54/2} = \sqrt[3]{27} = 3$.'
      - '2. Medios: $2 \cdot 3 = 6$, $6 \cdot 3 = 18$. P.G.: $2, 6, 18, 54$.'
  - titulo: 'Medio geométrico único (m=1)'
    enunciado: 'Entre $A = 2$ y $B = 32$, ¿el medio geométrico único es $y_1 = \sqrt{2 \cdot 32} = \sqrt{64} = 8$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{64} = 8$. P.G.: $2, 8, 32$ con $r=4$.'
  - titulo: 'Interpolación de 3 medios entre 1 y 16'
    enunciado: 'Entre $A = 1$ y $B = 16$, interpolar $m=3$ medios. ¿La razón es $r = \sqrt[4]{16} = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $r = 2$. Los medios son $2, 4, 8$.'
  - titulo: 'Interpolación con razón fraccionaria'
    enunciado: 'Entre $A = 81$ y $B = 1$, interpolar $m=3$ medios. ¿La razón es $r = \sqrt[4]{1/81} = 1/3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $r = 1/3$. Los medios son $27, 9, 3$.'
