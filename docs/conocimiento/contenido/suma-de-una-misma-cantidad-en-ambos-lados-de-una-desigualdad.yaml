semantic_id: MAT.ALG.DESIG_PROPIEDADES.SUMA_MISMA_CANTIDAD
resumen_inicial: Sumar una misma cantidad real a ambos miembros de una desigualdad
  conserva el sentido original de la desigualdad.
explicacion_simple: 'Imagina mover dos pesas situadas en distintos puntos de la recta
  numérica desplazándolas la misma distancia hacia la derecha.

  La que estaba más a la izquierda sigue estando más a la izquierda.

  Por lo tanto, si tenemos $a < b$ y sumamos cualquier número $c$ a ambos lados ($a
  + c < b + c$), el símbolo de desigualdad se mantiene en la misma dirección.'
explicacion_formal: 'Para todas las constantes o expresiones $a, b, c \in \mathbb{R}$,
  la **propiedad aditiva de la desigualdad** establece la equivalencia estricta:


  $$a < b \iff a + c < b + c$$

  $$a \ge b \iff a + c \ge b + c$$


  **Desglose de la fórmula:**

  - La adición de un escalar real $c$ (positivo, negativo o cero) preserva exactamente
  la relación de orden inicial.'
definiciones_clave: '- **Propiedad aditiva de desigualdades**: Ley que permite sumar
  la misma cantidad a ambos miembros conservando el sentido de la desigualdad.

  - **Conservación del sentido**: Mantener la orientación del operador ($<$ sigue
  siendo $<$, $>$ sigue siendo $>$).'
propiedades_relaciones: '- **Independencia del signo de $c$**: Sumar $c$ funciona
  sin importar si $c$ es un número positivo o negativo.'
ejemplo_guiado:
  enunciado: Dada la desigualdad $3 < 7$, suma el número real $c = 5$ a ambos miembros,
    evalúa el resultado y confirma que el sentido se conserva.
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $3 < 7$.Paso 2: Sumar $5$ en el primer
    miembro: $3 + 5 = 8$.Paso 3: Sumar $5$ en el segundo miembro: $7 + 5 = 12$.Paso
    4: Comparar ambos resultados: $8 < 12$.Paso 5: Concluir que el sentido $<$ se
    mantiene inalterado.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué le ocurre al sentido de la desigualdad $a < b$ si se suma un número
    negativo $c = -4$ en ambos miembros?
  choices:
  - text: El sentido se conserva inalterado ($a - 4 < b - 4$).
    is_correct: true
  - text: El sentido se invierte inmediatamente ($a - 4 > b - 4$).
    is_correct: false
  - text: La desigualdad se transforma en una igualdad.
    is_correct: false
  - text: El resultado pasa a ser cero.
    is_correct: false
  explanation: La alternativa correcta es 'El sentido se conserva inalterado ($a -
    4 < b - 4$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al sumar $5$ a ambos lados de $3 < 7$, ¿cuál es la desigualdad numérica
    equivalente obtenida?
  choices:
  - text: $8 < 12$
    is_correct: true
  - text: $8 > 12$
    is_correct: false
  - text: $15 < 35$
    is_correct: false
  - text: $8 = 12$
    is_correct: false
  explanation: La alternativa correcta es '$8 < 12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos miembros de la desigualdad inicial $a$ y $b$.'
- 'Paso 2: Sumar la misma cantidad $c$ al primer y segundo miembro.'
- 'Paso 3: Calcular el resultado numérico en ambos lados.'
- 'Paso 4: Mantener el mismo símbolo de desigualdad sin invertir su sentido.'
errores_correccion: '- **Error común:** Invertir el sentido de la desigualdad al sumar
  un número negativo.

  - **Cómo corregirlo:** La SUMA (o resta) JAMÁS invierte el sentido de una desigualdad,
  sin importar si sumas positivos o negativos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
fuente: Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades
