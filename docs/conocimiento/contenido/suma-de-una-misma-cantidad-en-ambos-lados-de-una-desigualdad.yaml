semantic_id: MAT.ALG.DESIG_PROPIEDADES.SUMA_MISMA_CANTIDAD
resumen_inicial: 'Suma de una misma cantidad en ambos lados de una desigualdad: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Al resolver problemas con desigualdades, a menudo necesitamos
  despejar una variable. Sumar una misma cantidad a ambos lados es una operación fundamental
  que preserva la desigualdad original.
explicacion_formal: '### Definición formal

  Sean $a, b, c \in \mathbb{R}$. Si $a < b$, entonces $a + c < b + c$. Esta propiedad
  aplica de manera análoga para $>, \leq$ y $\geq$.


  ### Desarrollo didáctico

  Al igual que en una balanza, si tienes un lado más liviano que otro y agregas exactamente
  el mismo peso en ambos lados, el lado que era más liviano seguirá siéndolo.'
definiciones_clave: '- **Suma de una misma cantidad en ambos lados de una desigualdad**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a suma de una misma cantidad en ambos lados
  de una desigualdad.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de suma de una misma
    cantidad en ambos lados de una desigualdad.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de suma de una misma cantidad en ambos lados
    de una desigualdad, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
