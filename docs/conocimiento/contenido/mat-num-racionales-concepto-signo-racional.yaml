  - texto: No es posible clasificarlo dentro del conjunto numérico
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de racionalidad y restricciones de denominador permiten clasificar rigurosamente cada caso.
errores_frecuentes:
- Una fracción que tiene signos negativos en el numerador y en el denominador es un racional negativo.
- El signo menos ubicado en el denominador no se puede trasladar al frente de la fracción.
- Cambiar el signo del numerador y del denominador al mismo tiempo invierte la polaridad de la fracción.
- Una fracción con un único signo negativo en el numerador evalúa a un entero positivo.
- El signo de una fracción racional depende de si el numerador es mayor que el denominador.
afirmaciones_verdaderas:
- Una fracción con signos iguales en numerador y denominador es positiva, y con signos distintos es negativa.
- Las expresiones $\frac{-a}{b}$, $\frac{a}{-b}$ y $-\frac{a}{b}$ son todas numéricamente equivalentes.
al_terminar_debes_poder: "**QUÉ:** Determinar, normalizar y transformar el signo de un número racional escrito en notación fraccionaria.\n\n**CÓMO:** Aplicando la equivalencia de signos $-\frac{a}{b} = \frac{-a}{b} = \frac{a}{-b}$ para fracciones negativas y $\frac{-a}{-b} = \frac{a}{b}$ para fracciones positivas según las reglas de los signos.\n\n![Resumen Signo de un número racional escrito como fracción](/static/img/nodos/signo-de-un-numero-racional-escrito-como-fraccion-resumen.svg)"
