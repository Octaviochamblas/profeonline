procedimiento:
- 'Paso 1: Evaluar los signos antecedente del numerador y del denominador.'
- 'Paso 2: Si los signos son iguales, asignar polaridad positiva a la fracción.'
- 'Paso 3: Si los signos son distintos, asignar polaridad negativa a la fracción (colocando el signo frente a la barra).'
errores_correccion: '- **Error 1: Creer que la fracción $\frac{-4}{-5}$ es un número negativo.** **Cómo corregirlo:** Al ser ambos negativos, los signos menos se cancelan dando un valor POSITIVO ($\frac{4}{5}$).


  - **Error 2: Duplicar el signo menos al escribir $-\frac{-a}{b}$.** **Cómo corregirlo:** Un doble signo menos se simplifica a positivo ($-(-\frac{a}{b}) = +\frac{a}{b}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es la fracción $\frac{7}{-10}$ equivalente a $-\frac{7}{10}$?
  alternativas:
  - Sí, son expresiones equivalentes
  - No, porque el signo está abajo
  - No, se convierte en positiva
  respuesta: Sí, son expresiones equivalentes
  solucion_pasos:
  - 'Un único signo menos en el denominador hace negativa a toda la fracción: $\frac{7}{-10} = -\frac{7}{10}$.'
- titulo: Ejemplo 2
  enunciado: Calcule el valor de $\frac{-18}{-6}$.
  alternativas:
  - '3'
  - '-3'
  - '12'
  respuesta: '3'
  solucion_pasos:
  - 'Signos iguales dan positivo: $\frac{-18}{-6} = +3$.'
- titulo: ¿Son equivalentes las expresiones -a/b, a/(-b) y -(a/b)?
  respuesta: Sí
  solucion_pasos:
  - Sí, las tres expresiones representan exactamente el mismo número racional negativo.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la propiedad y definición de los números racionales analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la definición formal de los números racionales entrega un resultado determinista y unívoco.
  - texto: No es posible clasificarlo dentro del conjunto numérico
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de racionalidad y restricciones de denominador permiten clasificar rigurosamente cada caso.
- titulo: ¿Es la fracción (-4)/(-9) un número racional negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, al tener signos iguales en numerador y denominador es un número racional positivo (4/9).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la propiedad y definición de los números racionales analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
