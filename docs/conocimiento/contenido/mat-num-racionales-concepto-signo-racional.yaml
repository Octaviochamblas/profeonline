semantic_id: MAT.NUM.RACIONALES_CONCEPTO.SIGNO_RACIONAL
resumen_inicial: 'El signo de una fracción depende de los signos de sus términos: signos iguales dan positivo, signos distintos dan negativo.'
explicacion_simple: 'El signo de una fracción racional sigue exactamente la misma regla de signos que la división. Si el numerador y el denominador tienen el mismo signo (ambos positivos o ambos negativos), la fracción es positiva; si tienen signos distintos, la fracción es negativa.


  ![Signo de un número racional escrito como fracción](/static/img/nodos/signo-de-un-numero-racional-escrito-como-fraccion-intro.svg)'
explicacion_formal: 'Para un racional $q = \frac{a}{b}$ con $a, b \in \mathbb{Z} \setminus \{0\}$, la **Regla del Signo Racional** establece:


  $$\operatorname{sgn}\left(\frac{a}{b}\right) = \operatorname{sgn}(a) \cdot \operatorname{sgn}(b) \implies \frac{-a}{-b} = \frac{a}{b} \quad \land \quad \frac{-a}{b} = \frac{a}{-b} = -\frac{a}{b}$$


  **Desglose de la fórmula:**

  - $\frac{-a}{-b} = +\frac{a}{b}$: Dos signos negativos se cancelan dando un racional positivo.

  - $\frac{-a}{b} = -\frac{a}{b}$: Un único signo menos en numerador o denominador hace negativa a toda la fracción.


  > **Complemento didáctico:** Es preferible escribir el signo menos frente a la barra principal de la fracción, $- \frac{a}{b}$, para mantener el orden algebraico.'
definiciones_clave: '- **Polaridad racional**: Determina si $\frac{a}{b} > 0$, $\frac{a}{b} < 0$ o $\frac{a}{b} = 0$.

  - **Cancelación de signos**: $\frac{-a}{-b} = \frac{a}{b}$.'
ejemplo_guiado:
  enunciado: 'Determine el signo del número racional $\frac{-15}{-3}$ y simplifique su expresión.


    ![Ejemplo Signo de un número racional escrito como fracción](/static/img/nodos/signo-de-un-numero-racional-escrito-como-fraccion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Observar los signos de numerador y denominador: ambos son negativos.'
  - 'Paso 2: Aplicar la regla de signos $\frac{-a}{-b} = +\frac{a}{b}$.'
  - 'Paso 3: Calcular la división: $\frac{15}{3} = 5$.'
  - 'Conclusión: El número racional $\frac{-15}{-3}$ es positivo y equivale a $+5$.'
