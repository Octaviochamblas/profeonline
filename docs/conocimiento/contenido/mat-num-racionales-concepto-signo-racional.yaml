semantic_id: MAT.NUM.RACIONALES_CONCEPTO.SIGNO_RACIONAL
resumen_inicial: "El signo de una fracción a/b es positivo si numerador y denominador tienen el mismo signo, y negativo si tienen signos distintos."
explicacion_simple: |
  El signo de una fracción no depende únicamente del numerador: depende de la combinación
  de los signos de numerador y denominador, igual que en la multiplicación y la división
  de números enteros. Dos negativos "se cancelan" y dan positivo, igual que con enteros.
explicacion_formal: |
  Para $a,b\in\mathbb{Z}$, $b\neq0$: $\frac{a}{b}>0 \Leftrightarrow (a>0 \wedge b>0) \vee
  (a<0 \wedge b<0)$, y $\frac{a}{b}<0 \Leftrightarrow (a>0 \wedge b<0) \vee (a<0 \wedge
  b>0)$. Esta regla coincide exactamente con la ley de signos de la división de enteros.
definiciones_clave: |
  **Signo de una fracción**: positivo o negativo, determinado por comparar los signos del
  numerador y el denominador, no solo por el signo del numerador.
propiedades_relaciones: |
  Por convención, se prefiere escribir el signo negativo en el numerador: $-\frac{2}{5}$
  en vez de $\frac{2}{-5}$ o $\frac{-2}{-5}$, aunque las tres representen el mismo valor.
ejemplo_guiado:
  enunciado: "Determina el signo de la fracción -9/-3."
  pasos:
    - "Identificamos los signos: el numerador $-9$ es negativo y el denominador $-3$ es negativo."
    - "Ambos signos son iguales, por lo que el resultado es positivo."
    - 'Conclusión: $\frac{-9}{-3}$ es positivo (de hecho, es igual a $3$).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuándo es negativa una fracción a/b?"
    choices:
      - {text: "Cuando el numerador y el denominador tienen signos distintos", is_correct: true}
      - {text: "Cuando el numerador es negativo, sin importar el denominador", is_correct: false}
      - {text: "Cuando el denominador es mayor que el numerador", is_correct: false}
      - {text: "Cuando ambos, numerador y denominador, son negativos", is_correct: false}
    explanation: "La correcta es Cuando el numerador y el denominador tienen signos distintos: si ambos son negativos, la fracción es positiva."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el signo de la fracción 7/-2?"
    choices:
      - {text: "Negativo, porque los signos son distintos", is_correct: true}
      - {text: "Positivo, porque el numerador es positivo", is_correct: false}
      - {text: "Positivo, porque ambos números son distintos de cero", is_correct: false}
      - {text: "No se puede determinar", is_correct: false}
    explanation: "La correcta es Negativo, porque los signos son distintos: numerador positivo y denominador negativo dan una fracción negativa."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identifica por separado el signo del numerador y el del denominador."
  - "Paso 2: Combina los signos: iguales producen positivo y distintos producen negativo."
  - "Paso 3: Normaliza la escritura dejando, de preferencia, el signo menos en el numerador."
errores_correccion: |
  Un error frecuente es mirar solo el signo del numerador para decidir el signo de la
  fracción, ignorando el denominador. Siempre hay que comparar ambos signos.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina el signo de la fracción $\\frac{-4}{9}$."
    alternativas:
      - "Negativo, porque los signos son distintos"
      - "Positivo, porque el denominador es positivo"
      - "No se puede determinar"
    respuesta: "Negativo, porque los signos son distintos"
    solucion_pasos:
      - "Paso a: El numerador $-4$ es negativo y el denominador $9$ es positivo."
      - "Paso b: Como los signos son distintos, el resultado es negativo."
      - 'Paso c: Por lo tanto, $\frac{-4}{9}$ es una fracción negativa.'
  - titulo: "Ejemplo 2"
    enunciado: "Determina el signo de la fracción $\\frac{-6}{-2}$."
    alternativas:
      - "Positivo, porque ambos signos son iguales"
      - "Negativo, porque ambos números son negativos"
      - "No se puede determinar"
    respuesta: "Positivo, porque ambos signos son iguales"
    solucion_pasos:
      - "Paso a: El numerador $-6$ es negativo y el denominador $-2$ también es negativo."
      - "Paso b: Como ambos signos son iguales, el resultado es positivo."
      - 'Paso c: De hecho, $\frac{-6}{-2}=3$, un número positivo.'
  - titulo: "¿Es correcto escribir $\\frac{2}{-5}$ como $-\\frac{2}{5}$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Ambas expresiones tienen numerador y denominador de signos distintos, así que ambas son negativas."
      - "Representan exactamente el mismo valor: $-0{,}4$."
      - "Por convención, se prefiere escribir el signo negativo en el numerador."
  - titulo: "¿Es positiva la fracción $\\frac{-3}{-8}$?"
    respuesta: "Sí"
    solucion_pasos:
      - "El numerador $-3$ y el denominador $-8$ son ambos negativos."
      - "Como los dos signos son iguales, el resultado es positivo."
      - 'Por lo tanto, $\frac{-3}{-8}$ es una fracción positiva.'
errores_frecuentes:
  - "Determinar el signo de la fracción mirando solo el numerador, sin considerar el denominador."
  - "Creer que dos signos negativos en una fracción producen un resultado negativo."
  - "Confundir la ley de signos de fracciones con la de la suma de enteros."
  - 'Pensar que $\frac{2}{-5}$ y $-\frac{2}{5}$ representan valores distintos.'
  - "Olvidar aplicar la regla de signos al comparar o simplificar fracciones negativas."
afirmaciones_verdaderas:
  - "Si el numerador y el denominador de una fracción tienen el mismo signo, la fracción es positiva."
  - 'La fracción $\frac{-9}{-3}$ es positiva y equivale a 3.'
al_terminar_debes_poder: |
  Determinar el signo de una fracción a partir de los signos de su numerador y su
  denominador, y escribirla en su forma convencional.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
