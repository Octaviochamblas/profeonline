semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.SUMA_RAICES
resumen_inicial: 'Cálculo de la suma de las raíces mediante la relación -b/a: concepto,
  discriminante, soluciones y modelamiento en Propiedades de las raíces y relaciones
  de Vieta.'
explicacion_simple: Existe un atajo para saber cuánto suman las dos soluciones de
  una ecuación cuadrática, sin tener que calcular cada una por separado.
explicacion_formal: '### Definición formal


  Si $x_1$ y $x_2$ son las raíces de $ax^2+bx+c=0$ con $a\neq0$, entonces $x_1+x_2=-\dfrac{b}{a}$.
  Esta relación se obtiene sumando directamente las dos soluciones de la fórmula general,
  donde los términos con $\sqrt{\Delta}$ se cancelan.


  ### Desarrollo didáctico


  Esta propiedad permite verificar rápidamente un par de soluciones ya calculadas,
  o encontrar la suma sin resolver la ecuación, simplemente leyendo los coeficientes
  $a$ y $b$.


  Para $x^2-7x+10=0$: $a=1$, $b=-7$, por lo que $x_1+x_2=-\dfrac{-7}{1}=7$. En efecto,
  las raíces son $2$ y $5$, y $2+5=7$.'
definiciones_clave: '- **Cálculo de la suma de las raíces mediante la relación -b/a**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en cálculo
  de la suma de las raíces mediante la relación -b/a.'
