procedimiento:
- 'Paso 1: Identifica los coeficientes $a$ y $b$ de la ecuación en forma general.'
- 'Paso 2: Calcula $-\dfrac{b}{a}$.'
- 'Paso 3: Ese resultado es la suma de las dos raíces, sin necesidad de calcularlas
  individualmente.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en cálculo de la suma de las raíces mediante la relación -b/a.
ejemplos:
- titulo: Cálculo directo de la suma de raíces
  enunciado: Calcula la suma de las raíces de $x^2-5x+6=0$ sin resolver la ecuación.
  solucion_pasos:
  - $a=1$, $b=-5$.
  - $x_1+x_2=-\dfrac{-5}{1}=5$.
- titulo: Cálculo con coeficiente a distinto de 1
  enunciado: Calcula la suma de las raíces de $2x^2+6x-8=0$ sin resolver la ecuación.
  solucion_pasos:
  - $a=2$, $b=6$.
  - $x_1+x_2=-\dfrac{6}{2}=-3$.
- titulo: ¿Se necesita resolver la ecuación para calcular la suma de sus raíces?
  enunciado: ¿Se necesita resolver la ecuación para calcular la suma de sus raíces?
  respuesta: 'No'
  solucion_pasos:
  - Basta con conocer los coeficientes $a$ y $b$, sin necesidad de aplicar la fórmula
    general completa.
- titulo: ¿La suma de las raíces depende del valor de $c$?
  enunciado: ¿La suma de las raíces depende del valor de $c$?
  respuesta: 'No'
  solucion_pasos:
  - La fórmula $-b/a$ no involucra a $c$; el término independiente no afecta la suma
    de las raíces.
errores_frecuentes:
- Olvidar el signo negativo en la fórmula $-b/a$.
- Confundir la suma de las raíces con el producto de las raíces.
- Usar el valor de $c$ en vez de $b$ al calcular la suma.
- Aplicar la fórmula a una ecuación que no está en su forma general, usando coeficientes
  incorrectos.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando cálculo
  de la suma de las raíces mediante la relación -b/a.
