semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.SUMA_RAICES
resumen_inicial: 'La suma de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) se calcula directamente mediante la primera relación de Vieta: $S = x_1 + x_2 = -\frac{b}{a}$.'
explicacion_simple: "![La suma de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) se calcula directamente mediante la primera relación de Vieta: $S = x_1 + x_2 = -\frac{b}{a}$](/static/img/nodos/calculo-de-la-suma-de-las-raices-mediante-la-relacion-ba-intro.svg)\n\n\n¿Sabías que puedes saber cuánto suman las dos soluciones de una ecuación cuadrática **sin resolverla**?\n\n- **La fórmula mágica de Vieta para la suma:**\n  $$x_1 + x_2 = -\frac{b}{a}$$\n- Solo tomas el coeficiente de la $x$ ($b$), le cambias el signo y lo divides por el coeficiente de $x^2$ ($a$).\n- *Ejemplo:* En $2x^2 - 8x + 5 = 0$, $a = 2$ y $b = -8$.\n  $$\text{Suma} = -\frac{-8}{2} = \frac{8}{2} = 4$$\n- ¡Así de rápido! Las dos soluciones suman exactamente 4, sin necesidad de calcular raíces cuadradas ni fórmulas largas."
explicacion_formal: 'Sean $x_1, x_2 \in \mathbb{C}$ las raíces de la ecuación cuadrática $P(x) = ax^2 + bx + c = 0$ con $a \in \mathbb{R} \setminus \{0\}$. Por el Teorema Fundamental del Álgebra:

  $$P(x) = a(x - x_1)(x - x_2) = a\left(x^2 - (x_1 + x_2)x + x_1 x_2\right) = ax^2 - a(x_1 + x_2)x + a(x_1 x_2)$$


  Igualando coeficientes con la forma canónica $ax^2 + bx + c$:

  $$-a(x_1 + x_2) = b \Longleftrightarrow x_1 + x_2 = -\frac{b}{a}$$


  **Demostración mediante la resolvente de Bhaskara**:

  $$x_1 + x_2 = \frac{-b + \sqrt{\Delta}}{2a} + \frac{-b - \sqrt{\Delta}}{2a} = \frac{-b + \sqrt{\Delta} - b - \sqrt{\Delta}}{2a} = \frac{-2b}{2a} = -\frac{b}{a}$$'
definiciones_clave: '- **Primera relación de Vieta**: Teorema que vincula la traza de las raíces con el cociente de coeficientes $-b/a$.

  - **Eje de simetría**: Recta vertical $x = x_v = \frac{x_1 + x_2}{2} = -\frac{b}{2a}$.'
propiedades_relaciones: '- **Independencia de la realidad de las raíces**: La relación $x_1 + x_2 = -b/a$ es válida en $\mathbb{R}$ y en $\mathbb{C}$, incluso cuando $\Delta < 0$.

  - **Doble del vértice**: La suma de las raíces es exactamente el doble de la abscisa del vértice: $S = 2x_v$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La suma de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) se calcula directamente mediante la primera relación de Vieta: $S = x_1 + x_2 = -\frac{b}{a}$](/static/img/nodos/calculo-de-la-suma-de-las-raices-mediante-la-relacion-ba-ejemplos.svg)



    Calcula la suma de las raíces de la ecuación cuadrática $3x^2 + 15x - 7 = 0$ sin resolverla.'
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 3, b = 15, c = -7$.'
  - 'Paso 2: Escribir la relación de Vieta para la suma: $S = x_1 + x_2 = -\frac{b}{a}$.'
  - 'Paso 3: Sustituir los coeficientes: $S = -\frac{15}{3}$.'
  - 'Paso 4: Simplificar la fracción: $S = -5$.'
  - 'Paso 5: Concluir: La suma de las dos raíces es exactamente $-5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la suma de las raíces de la ecuación $2x^2 - 10x + 7 = 0$?
  choices:
  - text: '5'
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: 7/2
    is_correct: false
  - text: '-10'
    is_correct: false
  explanation: La alternativa correcta es '5'. $S = -(-10)/2 = 10/2 = 5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación existe entre la suma de las raíces S y la coordenada x del vértice de la parábola?
  choices:
  - text: S = 2 · x_v
    is_correct: true
  - text: S = x_v / 2
    is_correct: false
  - text: S = x_v
    is_correct: false
  - text: No tienen ninguna relacion.
    is_correct: false
  explanation: La alternativa correcta es 'S = 2 · x_v'. Como $x_v = -b/(2a)$ y $S = -b/a$, la suma es el doble del vértice.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordenar la ecuación cuadrática en la forma $ax^2 + bx + c = 0$.'
- 'Paso 2: Extraer con signo los coeficientes $a$ y $b$.'
- 'Paso 3: Plantear la fórmula $S = -\frac{b}{a}$.'
- 'Paso 4: Realizar la división y simplificación de signos.'
errores_correccion: '- **Error común:** Olvidar el signo menos de la fórmula y responder $b/a$.

  - **Cómo corregirlo:** La suma lleva **siempre signo opuesto**: si $b = 6$ y $a = 2$, la suma es $-\frac{6}{2} = -3$.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente b negativo'
  enunciado: En $x^2 - 9x + 14 = 0$, ¿cuánto vale la suma de sus raíces?
  alternativas:
  - '9'
  - '-9'
  - '14'
  - '-14'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: $S = -(-9)/1 = 9$.'
- titulo: 'Ejemplo 2: Coeficiente cuadrático a = 4'
  enunciado: En $4x^2 + 12x - 5 = 0$, ¿cuál es la suma de las soluciones?
  alternativas:
  - '-3'
  - '3'
  - -5/4
  - '12'
  respuesta: '-3'
  solucion_pasos:
  - 'Paso 1: $S = -12/4 = -3$.'
- titulo: 'Ejemplo 3: Sin término lineal'
  enunciado: ¿Cuánto suman las raíces de $3x^2 - 27 = 0$?
  alternativas:
  - '0'
  - '9'
  - '-9'
  - '3'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $b = 0 \implies S = -0/3 = 0$.'
- titulo: 'Ejemplo 4: Fracción irreductible'
  enunciado: Calcula la suma de raíces en $5x^2 - 7x + 1 = 0$.
  alternativas:
  - 7/5
  - -7/5
  - 1/5
  - -1/5
  respuesta: 7/5
  solucion_pasos:
  - 'Paso 1: $S = -(-7)/5 = 7/5$.'
errores_frecuentes:
- Omitir el signo menos inicial en -b/a.
- Dividir entre b en lugar de entre a.
- Intentar resolver la ecuación completa perdiendo tiempo en una prueba estandarizada.
afirmaciones_verdaderas:
- La suma de las raíces de cualquier ecuación ax² + bx + c = 0 es exactamente igual a -b/a.
- La relación de Vieta para la suma se cumple tanto si las raíces son reales como si son complejas.
al_terminar_debes_poder: '**QUÉ:** Calcular de manera instantánea la suma de las raíces de una ecuación cuadrática.


  **CÓMO:** Aplicando la primera relación de Vieta S = -b/a a partir de los coeficientes algebraicos.


