semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.SUMA_RAICES
resumen_inicial: El cálculo de la suma de las raíces de una ecuación cuadrática utiliza la primera relación de Vieta $x_1 + x_2 = -b / a$ sin necesidad de resolver la ecuación.
explicacion_simple: |
  Las **relaciones de Vieta** te permiten conocer propiedades de las soluciones sin necesidad de calcular la fórmula general:

  - Si tienes la ecuación $ax^2 + bx + c = 0$, la **suma de sus dos raíces** ($x_1 + x_2$) cumple siempre la fórmula:
    $$x_1 + x_2 = -\frac{b}{a}$$

  - **Ejemplo**: En la ecuación $2x^2 - 8x + 5 = 0$:
    - Identificas $a = 2$ y $b = -8$.
    - Calculas la suma directamente:
      $$x_1 + x_2 = -\left(\frac{-8}{2}\right) = -(-4) = 4$$
  - ¡No tuviste que calcular las raíces complejas ni radicales para saber que su suma es $4$!
explicacion_formal: |
  Dada la ecuación cuadrática $ax^2 + bx + c = 0$ con $a, b, c \in \mathbb{R}$ y $a \neq 0$, y raíces $x_1, x_2 \in \mathbb{C}$, el **Primer Teorema de Vieta** establece la relación de suma lineal de las raíces:

  $$x_1 + x_2 = -\frac{b}{a}$$

  **Demostración algebraico-canónica:**
  Por la representación mónica del polinomio $P(x) = a(x - x_1)(x - x_2) = a[x^2 - (x_1 + x_2)x + (x_1 x_2)]$. Igualando coeficientes con $ax^2 + bx + c = a\left[x^2 + \frac{b}{a}x + \frac{c}{a}\right]$:
  $$-(x_1 + x_2) = \frac{b}{a} \iff x_1 + x_2 = -\frac{b}{a}$$
definiciones_clave: |
  - **Relaciones de Vieta (Suma de raíces)**: Teorema algebraico que vincula el coeficiente del término lineal y cuadrático con la suma aditiva de sus soluciones.
propiedades_relaciones: |
  - **Simetría y Raíces Opuestas**: Si $b = 0$ (ecuación pura $ax^2 + c = 0$), las raíces son opuestas $x_1 + x_2 = 0 \implies x_1 = -x_2$.
ejemplo_guiado:
  enunciado: 'Calcula la suma de las soluciones de la ecuación cuadrática $3x^2 + 12x - 7 = 0$ usando la relación de Vieta.'
  pasos:
    - 'Paso 1: Extraer los coeficientes requeridos: $a = 3$ y $b = 12$.'
    - 'Paso 2: Aplicar la fórmula de Vieta para la suma: $x_1 + x_2 = -\frac{b}{a}$.'
    - 'Paso 3: Sustituir los valores: $x_1 + x_2 = -\frac{12}{3} = -4$.'
    - 'Paso 4: Concluir que la suma exacta de las raíces es $-4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la suma de las raíces $x_1 + x_2$ en $ax^2 + bx + c = 0$?'
    choices:
      - {text: '$x_1 + x_2 = -\frac{b}{a}$', is_correct: true}
      - {text: '$x_1 + x_2 = \frac{c}{a}$', is_correct: false}
      - {text: '$x_1 + x_2 = \frac{b}{2a}$', is_correct: false}
      - {text: '$x_1 + x_2 = \sqrt{\frac{b}{a}}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 + x_2 = -\frac{b}{a}$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuánto vale la suma de las raíces de la ecuación $5x^2 - 15x + 8 = 0$?'
    choices:
      - {text: '$x_1 + x_2 = 3$', is_correct: true}
      - {text: '$x_1 + x_2 = -3$', is_correct: false}
      - {text: '$x_1 + x_2 = 8/5$', is_correct: false}
      - {text: '$x_1 + x_2 = -15/5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 + x_2 = 3$''. Aplicando $x_1 + x_2 = -\frac{-15}{5} = +3$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la ecuación cuadrática igualada a cero para obtener $a$ y $b$.'
  - 'Paso 2: Reemplazar los coeficientes en la expresión $x_1 + x_2 = -b/a$.'
  - 'Paso 3: Aplicar la regla de signos para el término del numerador $-b$.'
  - 'Paso 4: Simplificar la fracción resultante para obtener la suma de raíces.'
errores_correccion: |
  - **Error común:** Olvidar el signo negativo inicial de la fórmula y escribir $x_1 + x_2 = b / a$.
  - **Cómo corregirlo:** La fórmula de la suma lleva un **SIGNO NEGATIVO OBLIGATORIO**: $x_1 + x_2 = -\frac{b}{a}$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Suma con b negativo.
    alternativas:
      - '$x_1 + x_2 = 5$'
      - '$x_1 + x_2 = -5$'
      - '$x_1 + x_2 = 2/5$'
    respuesta: '$x_1 + x_2 = 5$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Suma con coeficientes racionales.
    alternativas:
      - '$x_1 + x_2 = -4/3$'
      - '$x_1 + x_2 = 4/3$'
      - '$x_1 + x_2 = -7/3$'
    respuesta: '$x_1 + x_2 = -4/3$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La omisión del signo negativo inicial en la relación de Vieta escribiendo $x_1 + x_2 = b / a$.'
  - 'Dividir el coeficiente lineal entre la constante independiente $b / c$ en lugar de dividir entre $a$.'
  - 'Evaluar la suma de raíces únicamente tras resolver la fórmula general cuadrática completa.'
  - 'La afirmación de que si el término $b$ es negativo, la suma de las soluciones debe dar un número negativo.'
  - 'Aplicar la relación $x_1 + x_2 = -b / a$ en una ecuación que no se encuentra igualada a cero.'
afirmaciones_verdaderas:
  - 'La suma de las raíces de cualquier ecuación de segundo grado $ax^2 + bx + c = 0$ viene dada directamente por la relación $x_1 + x_2 = -b / a$.'
  - 'Si el coeficiente lineal $b = 0$, la suma de las raíces es igual a cero, lo que implica que las soluciones reales son simétricas u opuestas.'
al_terminar_debes_poder: |
  QUÉ: Calcular la suma de las raíces de una ecuación cuadrática mediante la primera relación de Vieta.
  CÓMO: Identificar $a$ y $b$, aplicar la fórmula $x_1 + x_2 = -b/a$ respetando signos y simplificar.
