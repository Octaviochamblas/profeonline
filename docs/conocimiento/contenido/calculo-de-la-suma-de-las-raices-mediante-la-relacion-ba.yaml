semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.SUMA_RAICES
resumen_inicial: La suma de las dos raíces de una ecuación cuadrática $a x^2 + b x
  + c = 0$ viene dada por la relación de Vieta $x_1 + x_2 = -\frac{b}{a}$.
explicacion_simple: "Las **relaciones de Vieta** nos permiten conocer la suma de las\
  \ soluciones sin necesidad de resolver la ecuación:\n- La suma de las dos raíces\
  \ $x_1 + x_2$ siempre es igual al coeficiente lineal $b$ con el signo cambiado,\
  \ dividido entre el coeficiente cuadrático $a$:\n  $$x_1 + x_2 = -\\frac{b}{a}$$\n\
  - Ejemplo: En $2x^2 - 8x + 5 = 0$, $a = 2, b = -8 \\implies x_1 + x_2 = -\\frac{-8}{2}\
  \ = \\frac{8}{2} = 4$."
explicacion_formal: 'Dada la ecuación $a x^2 + b x + c = 0$ con raíces $x_1, x_2 \in
  \mathbb{C}$, el Teorema de Vieta para el coeficiente de grado 1 establece que:


  $$x_1 + x_2 = -\frac{b}{a}$$


  **Desglose de la fórmula:**

  - Igualación de coeficientes obtenida al comparar $a x^2 + b x + c$ con su forma
  factorizada $a(x - x_1)(x - x_2) = a x^2 - a(x_1 + x_2)x + a x_1 x_2$.'
definiciones_clave: '- **Primera relación de Vieta (suma de raíces)**: Identidad que
  relaciona la suma $x_1 + x_2$ con el cociente $-b/a$.

  - **Teorema de Vieta**: Conjunto de relaciones algebraicas entre los coeficientes
  de un polinomio y sus raíces.'
propiedades_relaciones: '- **Simetría funcional**: Permite calcular la suma de las
  raíces de inmediato sin resolver la raíz cuadrada del discriminante.'
ejemplo_guiado:
  enunciado: Sin resolver la ecuación cuadrática $3x^2 + 12x - 7 = 0$, halla el valor
    exacto de la suma de sus raíces $x_1 + x_2$.
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 3$, $b = 12$, $c = -7$.Paso 2: Escribir
    la relación de Vieta para la suma: $x_1 + x_2 = -\frac{b}{a}$.Paso 3: Sustituir
    los coeficientes: $x_1 + x_2 = -\frac{12}{3}$.Paso 4: Simplificar la fracción:
    $x_1 + x_2 = -4$.Paso 5: Concluir que la suma de las raíces es $-4$.'
checkpoints:
- placement: after_explicacion_formal
