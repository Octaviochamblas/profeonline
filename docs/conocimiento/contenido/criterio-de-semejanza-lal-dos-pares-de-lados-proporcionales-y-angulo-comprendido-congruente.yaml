semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CRITERIO_LAL
resumen_inicial: 'El Criterio de Semejanza LAL (Lado-Ángulo-Lado) establece que si dos triángulos tienen dos pares de lados homólogos proporcionales y el ángulo comprendido entre ellos congruente, entonces son semejantes.'
explicacion_simple: |
  ![Criterio de Semejanza LAL (Lado - Ángulo - Lado)](/static/img/nodos/criterio-de-semejanza-lal-dos-pares-de-lados-proporcionales-y-angulo-comprendido-congruente-intro.svg)

  Si tienes dos lados proporcionales y el ángulo que está justo en medio de ellos es idéntico, los dos triángulos son semejantes.
explicacion_formal: |
  ### Teorema formal (Criterio LAL)
  Sean $\Delta ABC$ y $\Delta A'B'C'$ con lados adyacentes $a, b$ y $a', b'$ que forman los ángulos comprendidos $\angle C$ y $\angle C'$ respectivamente. Si:

  $$\frac{a'}{a} = \frac{b'}{b} = k \quad \land \quad \angle C \cong \angle C'$$

  Entonces:

  $$\Delta ABC \sim \Delta A'B'C'$$

  ### Desglose simbólico y geométrico
  - Aplicación del Teorema del Coseno para el tercer lado:
    $$c'^2 = a'^2 + b'^2 - 2a'b'\cos(C') = k^2 a^2 + k^2 b^2 - 2(ka)(kb)\cos(C) = k^2 (a^2 + b^2 - 2ab\cos C) = k^2 c^2 \implies c' = kc$$
  - Al ser el tercer lado proporcional con la misma razón $k$, se cumple LLL y por ende la semejanza total.

  ### Síntesis didáctica
  Verificar siempre la posición del ángulo: debe ser el vértice común a ambos lados conocidos.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Criterio de Semejanza LAL (Lado - Ángulo - Lado)](/static/img/nodos/criterio-de-semejanza-lal-dos-pares-de-lados-proporcionales-y-angulo-comprendido-congruente-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
