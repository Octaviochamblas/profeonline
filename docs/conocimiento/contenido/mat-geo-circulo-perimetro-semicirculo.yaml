semantic_id: MAT.GEO.CIRCULO_METRICA.PERIMETRO_SEMICIRCULO
resumen_inicial: 'Cálculo del perímetro de un semicírculo incluyendo diámetro y arco
  semicircular: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: 'A diferencia del área (que es simplemente la mitad del círculo),
  el perímetro del semicírculo requiere sumar dos partes distintas: una curva y una
  recta.'
explicacion_formal: '![Perímetro de un semicírculo: πr + 2r](/static/img/geometria/circunferencia-circulo/circulo-perimetro-semicirculo.svg)


  ### Definición formal


  El perímetro de un semicírculo de radio $r$ es $P=\pi r+2r$, donde $\pi r$ es la
  longitud del arco semicircular (la mitad de $2\pi r$) y $2r$ es la longitud del
  diámetro que cierra la figura.


  ### Desarrollo didáctico


  Un semicírculo de radio 7 cm tiene perímetro $P=\pi\times7+2\times7=7\pi+14\approx21,99+14=35,99$
  cm. Es un error común olvidar sumar el diámetro, calculando solo la longitud del
  arco curvo.'
definiciones_clave: '- **Cálculo del perímetro de un semicírculo incluyendo diámetro
