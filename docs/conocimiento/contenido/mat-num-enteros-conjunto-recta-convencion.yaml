semantic_id: MAT.NUM.ENTEROS_CONJUNTO.RECTA_CONVENCION
resumen_inicial: El movimiento a la derecha en la recta representa adición e incremento; el movimiento a la izquierda representa sustracción.
explicacion_simple: 'En matemáticas se utiliza la convención universal de orientar la recta de izquierda a derecha. Moverse hacia la derecha significa sumar o aumentar la cantidad, mientras que desplazarse hacia la izquierda representa restar o disminuir el valor.


  ![Convención de sentido en la recta (derecha vs izquierda)](/static/img/nodos/convencion-de-sentido-en-la-recta-derecha-vs-izquierda-intro.svg)'
explicacion_formal: 'Dada la recta real orientada mediante el vector unitario director $\hat{u} = +1$, el **Sentido de Orientación** impone la relación de orden respecto al desplazamiento $d \in \mathbb{R}$:


  $$x_2 = x_1 + d \implies \begin{cases} x_2 \text{ está a la derecha de } x_1 & \iff d > 0 \\ x_2 \text{ está a la izquierda de } x_1 & \iff d < 0 \end{cases}$$


  **Desglose de la fórmula:**

  - $x_1, x_2$: Dos puntos enteros situados sobre la recta numérica.

  - $d > 0$: Vector desplazamiento positivo (hacia la derecha en el sentido de incremento).

  - $d < 0$: Vector desplazamiento negativo (hacia la izquierda en el sentido de decremento).


  > **Complemento didáctico:** Esta convención establece que el movimiento a la derecha incrementa el valor algebraico de la posición.'
definiciones_clave: '- **Orientación positiva**: Dirección hacia la derecha en la recta numérica que representa aumentos de valor.

  - **Desplazamiento**: Cambio de posición $d$ que adiciona o sustrae unidades.'
propiedades_relaciones: '- **Adición y sustracción**: Sumar $+k$ desplaza $k$ unidades a la derecha; restar $-k$ desplaza $k$ unidades a la izquierda.'
ejemplo_guiado:
  enunciado: 'Si una partícula está en el entero $-4$ y se desplaza 7 unidades a la derecha, ¿cuál es su posición final?


    ![Ejemplo Convención de sentido en la recta (derecha vs izquierda)](/static/img/nodos/convencion-de-sentido-en-la-recta-derecha-vs-izquierda-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar la posición inicial: $-4$.'
  - 'Paso 2: Aplicar el convenio de sentido: desplazarse a la derecha implica sumar $+7$.'
  - 'Paso 3: Calcular la suma: $-4 + 7 = 3$.'
  - 'Conclusión: La posición final es el entero 3.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación matemática representa el desplazamiento hacia la izquierda en la recta numérica?
  choices:
  - text: Sustracción (disminución del valor)
    is_correct: true
  - text: Adición (aumento del valor)
    is_correct: false
  - text: Multiplicación por 2
    is_correct: false
  - text: Potenciación
    is_correct: false
  explanation: La alternativa correcta es 'Sustracción (disminución del valor)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado de avanzar 7 unidades a la derecha desde -4?
  choices:
  - text: '3'
    is_correct: true
  - text: '-11'
    is_correct: false
  - text: '11'
    is_correct: false
  - text: '-3'
    is_correct: false
  explanation: La alternativa correcta es '3', calculando $-4 + 7 = 3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar la posición inicial en la recta.'
- 'Paso 2: Sumar unidades si el movimiento es a la derecha, o restar unidades si es a la izquierda.'
- 'Paso 3: Marcar la nueva coordenada entera resultante.'
errores_correccion: '- **Error 1: Asociar desplazamientos hacia la izquierda con incrementos de valor.** **Cómo corregirlo:** Todo movimiento a la izquierda disminuye la posición numérica.


  - **Error 2: Pensar que el sentido de la recta puede invertirse arbitrariamente en un mismo ejercicio.** **Cómo corregirlo:** La orientación positiva hacia la derecha es fija y universal.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desde el punto 2, nos desplazamos 6 unidades a la izquierda. ¿En qué número quedamos?
  alternativas:
  - '-4'
  - '8'
  - '-8'
  respuesta: '-4'
  solucion_pasos:
  - $2 - 6 = -4$.
- titulo: Ejemplo 2
  enunciado: Represente un retroceso de 3 unidades seguido de un avance de 8 unidades a partir de 0.
  alternativas:
  - '5'
  - '-5'
  - '11'
  respuesta: '5'
  solucion_pasos:
  - $0 - 3 + 8 = 5$.
- titulo: ¿Desplazarse hacia la derecha en la recta siempre aumenta el valor de la posición?
  respuesta: Sí
  solucion_pasos:
  - Sí, la orientación hacia la derecha representa el sentido positivo del incremento.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
- titulo: ¿Un movimiento hacia la izquierda desde -2 lleva a un número positivo?
  respuesta: 'No'
  solucion_pasos:
  - No, desplazarse a la izquierda disminuye el valor adentrándose más en los negativos.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
errores_frecuentes:
- Desplazarse 3 unidades hacia la izquierda en la recta numérica equivale a sumar $+3$ a la posición.
- El sentido positivo de la recta numérica se orienta convencionalmente hacia la izquierda del origen.
- Un movimiento de 5 unidades a la derecha desde $-8$ posiciona el resultado en $-13$.
- Moverse hacia la derecha en la región de los enteros negativos disminuye el valor del número.
- Los números enteros aumentan su valor numérico a medida que nos desplazamos hacia la izquierda.
afirmaciones_verdaderas:
- Moverse hacia la derecha en la recta numérica aumenta el valor numérico de la posición.
- Moverse hacia la izquierda equivale a realizar una sustracción.
al_terminar_debes_poder: '**QUÉ:** Interpretar y aplicar la convención de sentido horizontal en la recta numérica.


  **CÓMO:** Reconociendo que los desplazamientos a la derecha representan adición/crecimiento y a la izquierda sustracción/decrecimiento.


  ![Resumen Convención de sentido en la recta (derecha vs izquierda)](/static/img/nodos/convencion-de-sentido-en-la-recta-derecha-vs-izquierda-resumen.svg)'
