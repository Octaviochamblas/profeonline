semantic_id: MAT.NUM.ENTEROS_CONJUNTO.RECTA_CONVENCION
resumen_inicial: "En la recta numérica, los valores aumentan hacia la derecha y disminuyen hacia la izquierda: esta es la convención universal de sentido."
explicacion_simple: |
  En la recta numérica todos seguimos la misma regla: los números más grandes van a la derecha y
  los más chicos a la izquierda. Por eso el 5 está a la derecha del 2, y el -3 está a la izquierda
  del 0. Moverse a la derecha equivale a "sumar" y moverse a la izquierda equivale a "restar".
explicacion_formal: |
  La convención de sentido asocia la dirección del movimiento con el signo del número: hacia la
  derecha del origen los valores crecen (positivos), hacia la izquierda decrecen (negativos). Sumar
  un entero positivo desplaza hacia la derecha; sumar un entero negativo desplaza hacia la izquierda.
definiciones_clave: |
  **Convención de sentido**: acuerdo universal de que la derecha del origen representa valores
  mayores y la izquierda, valores menores. **Desplazamiento**: el movimiento sobre la recta asociado
  a sumar (derecha) o restar (izquierda).
propiedades_relaciones: |
  Al alejarse del cero hacia la izquierda, el valor absoluto del número aumenta, pero el número
  mismo es cada vez menor. Esta convención es consistente con el orden de $\mathbb{Z}$: más a la
  derecha siempre implica mayor.
ejemplo_guiado:
  enunciado: "Un ascensor comienza en el piso 0 y baja 6 pisos. ¿En qué dirección de la recta numérica se movió y en qué número quedó?"
  pasos:
    - "Bajar pisos se interpreta como un desplazamiento hacia la izquierda en la recta."
    - "Se cuentan 6 unidades hacia la izquierda desde el $0$."
    - "El ascensor queda en el número $-6$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Según la convención de sentido, ¿qué representa moverse hacia la izquierda del origen?"
    choices:
      - {text: "Sumar un número positivo", is_correct: false}
      - {text: "Valores decrecientes (negativos)", is_correct: true}
      - {text: "Valores crecientes (positivos)", is_correct: false}
      - {text: "No tiene relación con el signo", is_correct: false}
    explanation: "La correcta es Valores decrecientes (negativos): la izquierda del origen siempre representa números menores."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, un globo sube 5 unidades desde el piso 0. ¿En qué número queda y hacia qué lado se movió?"
    choices:
      - {text: "$-5$, hacia la izquierda", is_correct: false}
      - {text: "$5$, hacia la derecha", is_correct: true}
      - {text: "$5$, hacia la izquierda", is_correct: false}
      - {text: "$0$, no se movió", is_correct: false}
    explanation: "La correcta es $5$, hacia la derecha: subir se traduce como un desplazamiento positivo hacia la derecha."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Establecer el cero como punto de división de sentidos."
  - "Paso 2: Asignar el sentido de la flecha derecha al crecimiento de los valores positivos."
  - "Paso 3: Asignar el sentido hacia la izquierda a valores menores que cero; al alejarse del cero hacia la izquierda, aumenta el valor absoluto, pero el número es menor."
errores_correccion: |
  Un error frecuente es pensar que los números mayores se ubican a la izquierda: siempre es al
  revés, mayor es más a la derecha. Otro error es creer que moverse hacia la izquierda desde un
  negativo da un positivo; alejarse del cero hacia la izquierda siempre aumenta el valor absoluto
  pero disminuye el número.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Si un objeto se mueve 5 unidades a la izquierda desde el cero, ¿en qué número se encuentra?"
    alternativas:
      - "$-5$"
      - "$5$"
      - "$0$"
    respuesta: "$-5$"
    solucion_pasos:
      - "Partir del punto de referencia $0$."
      - "Seguir la convención: movimiento a la izquierda implica signo negativo."
      - "Avanzar 5 marcas hacia la izquierda."
      - "Resultado: El objeto está en el $-5$."
  - titulo: "Ejemplo 2"
    enunciado: "Un termómetro marca una temperatura que sube. ¿Hacia qué dirección se mueve el indicador en una escala horizontal?"
    alternativas:
      - "Hacia la derecha"
      - "Hacia la izquierda"
      - "No se mueve"
    respuesta: "Hacia la derecha"
    solucion_pasos:
      - "Identificar que 'subir' implica un aumento de valor."
      - "Relacionar el aumento con la dirección positiva de la recta."
      - "Conclusión: El indicador se mueve hacia la derecha."
  - titulo: "¿Los números positivos se ubican a la derecha del cero en la recta numérica?"
    respuesta: "Sí"
    solucion_pasos:
      - "La convención establece que el sentido a la derecha corresponde a valores mayores que cero."
      - 'Los enteros positivos ($\mathbb{Z}^+$) están todos ubicados a la derecha del origen.'
      - "Por lo tanto, sí se ubican a la derecha del cero."
  - titulo: "¿Moverse hacia la izquierda en la recta numérica equivale a sumar un número positivo?"
    respuesta: "No"
    solucion_pasos:
      - "Moverse a la izquierda implica alejarse del cero en dirección negativa."
      - "Eso equivale a sumar un número **negativo** (o restar un positivo)."
      - "Por lo tanto, moverse a la izquierda no equivale a sumar un positivo."
errores_frecuentes:
  - "Los números mayores se ubican siempre a la izquierda en la recta numérica."
  - "Moverse hacia la izquierda desde un número negativo da como resultado un número positivo."
  - "El cero se ubica en el extremo derecho de la recta numérica."
  - "La convención de sentido cambia si el número es negativo."
  - "Sumar un número negativo desplaza hacia la derecha en la recta numérica."
afirmaciones_verdaderas:
  - "En la recta numérica, los valores aumentan hacia la derecha."
  - "Los valores disminuyen hacia la izquierda en la recta numérica."
al_terminar_debes_poder: |
  Interpretar un desplazamiento (subir/bajar, avanzar/retroceder) como un movimiento hacia la
  derecha o la izquierda en la recta numérica, y traducirlo al número entero correcto.

fuente: "Matemática 7º Básico Tomo 1 p.209"
estado: publicado
