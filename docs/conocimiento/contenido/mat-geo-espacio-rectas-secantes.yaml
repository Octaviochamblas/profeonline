semantic_id: MAT.GEO.ESPACIO_FUNDAMENTOS.RECTAS_SECANTES_ESPACIO
resumen_inicial: 'Posición relativa de rectas secantes en el espacio: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Dos rectas que se cruzan en un único punto determinan automáticamente
  un plano que las contiene a ambas, algo que no ocurre con las rectas alabeadas.
explicacion_formal: '![Rectas secantes en el espacio](/static/img/geometria/espacio-cuerpos/espacio-rectas-secantes.svg)


  ### Definición formal


  Dos rectas $AB$ y $AD$ son secantes si comparten exactamente un punto en común (en
  este caso, el punto $A$). Dos rectas secantes son siempre coplanares: determinan
  un único plano que las contiene a ambas.


  ### Desarrollo didáctico


  En la figura, las aristas $AB$ y $AD$ de un prisma comparten el vértice $A$: se
  cruzan en ese único punto, por lo que son rectas secantes. Ambas están contenidas
  en la cara frontal del prisma, confirmando que son coplanares.'
definiciones_clave: '- **Posición relativa de rectas secantes en el espacio**: Elemento
  o propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a posición relativa de rectas secantes en el
  espacio.'
