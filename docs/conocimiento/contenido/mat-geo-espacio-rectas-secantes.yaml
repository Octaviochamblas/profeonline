- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en posición relativa
  de rectas secantes en el espacio.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de posición
