semantic_id: MAT.ALG.RESOLUCION_LINEAL.SIGNOS_AGRUPACION
resumen_inicial: Para resolver ecuaciones con paréntesis se aplica la propiedad distributiva
  para eliminarlos y luego se despeja la incógnita.
explicacion_simple: 'Cuando una ecuación contiene signos de agrupación (como paréntesis
  o corchetes) multiplicados por un número o término exterior, debemos resolverlos
  primero.

  Aplicamos la **propiedad distributiva**: multiplicamos el factor de afuera por cada
  uno de los términos que están dentro del paréntesis. Una vez eliminados los paréntesis,
  resolvemos la ecuación de forma habitual.'
explicacion_formal: 'Dada una ecuación con signos de agrupación $k(a x + b) = c$,
  la **eliminación de paréntesis por distribución** se formula como:


  $$k \cdot (a x + b) = c \implies (k \cdot a) x + (k \cdot b) = c$$


  **Desglose de la fórmula:**

  - $k \cdot a$: Producto del factor exterior por el coeficiente de la variable.

  - $k \cdot b$: Producto del factor exterior por el término independiente interior.'
definiciones_clave: '- **Signos de agrupación**: Símbolos como paréntesis $()$, corchetes
  $[]$ o llaves $\{\}$ que encierran expresiones algebraicas.

  - **Eliminación por propiedad distributiva**: Multiplicación del factor externo
  por cada sumando interior para suprimir los paréntesis.'
propiedades_relaciones: '- **Prioridad de operaciones**: Los paréntesis deben eliminarse
  antes de realizar cualquier transposición de términos.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación lineal con paréntesis $3(2x - 5) = 21$ eliminando
    el signo de agrupación por distribución y evalúa para $x = 6$.
  pasos:
  - 'Paso 1: Aplicar la propiedad distributiva en el primer miembro: $3 \cdot 2x -
    3 \cdot 5 = 6x - 15$.Paso 2: Escribir la ecuación sin paréntesis: $6x - 15 = 21$.Paso
    3: Trasponer $-15$ sumando al segundo miembro: $6x = 21 + 15 = 36$.Paso 4: Trasponer
    $6$ dividiendo: $x = \frac{36}{6} = 6$.Paso 5: Comprobar en la ecuación original:
    $3(2(6) - 5) = 3(12 - 5) = 3(7) = 21$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la propiedad distributiva a $3(2x - 5)$, ¿cuál es la expresión
    obtenida?
  choices:
  - text: $6x - 15$
    is_correct: true
  - text: $6x - 5$
    is_correct: false
  - text: $5x - 15$
    is_correct: false
  - text: $6x + 15$
    is_correct: false
  explanation: La alternativa correcta es '$6x - 15$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $3(2x - 5) = 21$, ¿cuál es la solución de $x$?
  choices:
  - text: $x = 6$
    is_correct: true
  - text: $x = 7$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  - text: $x = 3$
    is_correct: false
  explanation: La alternativa correcta es '$x = 6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los números o factores ubicados justo fuera de los paréntesis.'
- 'Paso 2: Multiplicar ese factor externo por TODOS los términos interiores respetando
  la ley de los signos.'
- 'Paso 3: Eliminar los paréntesis de la ecuación.'
- 'Paso 4: Reducir términos semejantes y trasponer los términos para despejar la incógnita.'
errores_correccion: '- **Error común:** Multiplicar el número exterior únicamente
  por el primer término dentro del paréntesis (ejemplo: $3(2x - 5) = 6x - 5$).

  - **Cómo corregirlo:** La distributiva exige multiplicar por TODOS los términos
  dentro del paréntesis ($3 \cdot 2x$ y $3 \cdot (-5) = -15$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
