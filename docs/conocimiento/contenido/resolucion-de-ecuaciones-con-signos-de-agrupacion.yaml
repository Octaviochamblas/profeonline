semantic_id: MAT.ALG.RESOLUCION_LINEAL.SIGNOS_AGRUPACION
resumen_inicial: Para resolver ecuaciones con paréntesis o signos de agrupación, se aplica la propiedad distributiva para
  eliminarlos y luego se despeja la incógnita.
explicacion_simple: 'Cuando una ecuación contiene signos de agrupación (como paréntesis o corchetes) multiplicados por un
  número o constante exterior, debemos eliminarlos en primer lugar.


  Para esto aplicamos la **propiedad distributiva**: multiplicamos el factor exterior por cada uno de los sumandos que se
  encuentran dentro del paréntesis.


  Una vez suprimidos los paréntesis y reducidos los términos semejantes, la ecuación queda expresada en la forma canónica
  para ser despejada.


  ![Resolución con signos de agrupación](/static/img/nodos/resolucion-de-ecuaciones-con-signos-de-agrupacion-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada una ecuación que contiene signos de agrupación con un factor multiplicativo $k(a x + b) = c$, la **eliminación de paréntesis
  por distribución** se formula como:


  $$k \cdot (a x + b) = c \implies (k \cdot a) x + (k \cdot b) = c$$


  ### Desglose de la fórmula

  - $k \cdot a$: Producto entre el factor escalar externo $k$ y el coeficiente interno de la variable $a$.

  - $k \cdot b$: Producto entre el factor escalar externo $k$ y la constante interna $b$.


  ### Síntesis didáctica

  La supresión de signos de agrupación mediante la distribución debe realizarse jerárquicamente antes de efectuar cualquier
  transposición de términos de un miembro a otro.

  '
definiciones_clave: '- **Signos de agrupación**: Símbolos como paréntesis $()$, corchetes $[]$ o llaves $\{\}$ utilizados
  para delimitar una expresión subyacente.

  - **Propiedad distributiva**: Ley algebraica que expresa $k(A + B) = kA + kB$.

  '
propiedades_relaciones: '- **Jerarquía de operaciones**: La eliminación de paréntesis por multiplicación distributiva tiene
  prioridad procedimental sobre la adición y la transposición.

  - **Respeto de la regla de signos**: El signo del factor externo $k$ afecta multiplicativamente a cada sumando interior.

  '
ejemplo_guiado:
  enunciado: Resuelve la ecuación lineal con paréntesis $3(2x - 5) = 21$ eliminando el signo de agrupación por distribución
    y evalúa para $x = 6$.
  pasos:
  - 'Paso 1: Aplicar la propiedad distributiva multiplicando $3$ por cada sumando interior: $3 \cdot 2x - 3 \cdot 5 = 6x -
    15$.'
  - 'Paso 2: Escribir la ecuación simplificada sin paréntesis: $6x - 15 = 21$.'
  - 'Paso 3: Trasponer $-15$ sumando al segundo miembro: $6x = 21 + 15 = 36$.'
  - 'Paso 4: Trasponer $6$ dividiendo al segundo miembro: $x = \frac{36}{6} = 6$.'
  - 'Paso 5: Comprobar sustituyendo $x = 6$ en la ecuación original: $3(2(6) - 5) = 3(12 - 5) = 3(7) = 21$.'
  imagen: /static/img/nodos/resolucion-de-ecuaciones-con-signos-de-agrupacion-ejemplos.svg
