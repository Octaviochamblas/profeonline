procedimiento:
- 'Paso 1: Identificar los factores constantes situados inmediatamente a la izquierda de cada paréntesis.'
- 'Paso 2: Multiplicar dicho factor externo por TODOS los términos interiores respetando estrictamente la regla de los signos.'
- 'Paso 3: Suprimir los paréntesis escribiendo la expresión expandida resultante.'
- 'Paso 4: Reducir los términos semejantes en cada miembro si existiesen.'
- 'Paso 5: Despejar la incógnita aplicando la transposición de términos.'
errores_correccion: '- **Error 1:** Multiplicar el factor exterior únicamente por el primer término del paréntesis (ejemplo:
  escribir $3(2x - 5) = 6x - 5$). **Cómo corregirlo:** La propiedad distributiva **EXIGE MULTIPLICAR EL FACTOR EXTERNO POR
  TODOS Y CADA UNO DE LOS SUMANDOS INTERIORES ($3 \cdot 2x = 6x$ Y $3 \cdot (-5) = -15$)**.

  - **Error 2:** Sumar o restar el factor exterior con el primer término interior antes de multiplicar. **Cómo corregirlo:**
  La multiplicación del factor exterior **TIENE PRIORIDAD ABSOLUTA SOBRE CUALQUIER SUMA O RESTA EN LA ECUACIÓN**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la ecuación equivalente sin paréntesis de $2(4x + 3) = 22$?
  alternativas:
  - $8x + 6 = 22$
  - $8x + 3 = 22$
  - $6x + 5 = 22$
  respuesta: $8x + 6 = 22$
  solucion_pasos:
  - '1. Distribuir $2$: $2 \cdot 4x + 2 \cdot 3 = 8x + 6$.'
  - '2. Ecuación sin paréntesis: $8x + 6 = 22$.'
  - '3. Despejar: $8x = 16 \implies x = 2$.'
- titulo: Ejemplo 2
  enunciado: Al expandir y resolver $5(x - 2) = 15$, ¿cuál es el valor de la solución?
  alternativas:
  - $x = 5$
  - $x = 3$
  - $x = 1$
  respuesta: $x = 5$
  solucion_pasos:
  - '1. Expandir: $5x - 10 = 15$.'
  - '2. Trasponer $-10$: $5x = 25$.'
  - '3. Despejar: $x = \frac{25}{5} = 5$.'
- titulo: Factor negativo exterior
  enunciado: ¿Al multiplicar por $-3(x - 4)$ se obtiene $-3x + 12$?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues $-3 \cdot x = -3x$ y $-3 \cdot (-4) = +12$.
- titulo: Prioridad de la distributiva
  enunciado: ¿Es obligatorio eliminar los paréntesis distributivos antes de reducir términos semejantes entre miembros?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación libera los sumandos atrapados en la agrupación.
errores_frecuentes:
- Multiplicar el factor exterior únicamente por el primer término del interior del paréntesis ($3(2x - 5) = 6x - 5$).
- Al expandir con un factor exterior negativo, omitir la regla de signos en los términos posteriores.
- Efectuar sumas o restas previas con el factor exterior antes de ejecutar la multiplicación distributiva.
- Cambiar de signo a los términos exteriores a la agrupación al momento de expandir los paréntesis.
- Dividir entre el factor exterior únicamente la constante interior omitiendo el término con variable.
afirmaciones_verdaderas:
- La propiedad distributiva exige multiplicar el factor exterior por todos los sumandos dentro del paréntesis.
- La eliminación de paréntesis mediante distribución precede al despeje por transposición de términos.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/resolucion-de-ecuaciones-con-signos-de-agrupacion-resumen.svg)


  QUÉ: Resolver ecuaciones lineales de primer grado que contengan signos de agrupación.

  CÓMO: Aplicar la propiedad distributiva para multiplicar el factor exterior por cada término del paréntesis ($k(a x + b)
  = k a x + k b$), suprimir la agrupación, reducir términos semejantes y despejar la incógnita.

  '
