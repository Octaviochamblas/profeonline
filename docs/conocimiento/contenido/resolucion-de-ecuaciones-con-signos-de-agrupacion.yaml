semantic_id: MAT.ALG.RESOLUCION_LINEAL.SIGNOS_AGRUPACION
resumen_inicial: 'Resolución de ecuaciones con signos de agrupación: propiedades,
  resolución y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: A veces, las manzanas de la ecuación vienen empaquetadas en cajas
  (paréntesis). No puedes organizar tu despensa sin antes abrir las cajas. En álgebra,
  la 'propiedad distributiva' es el cuchillo para abrir esas cajas.
explicacion_formal: '### Definición formal


  El factor se ''distribuye'' a cada uno de los sumandos del interior.


  ### Desarrollo didáctico


  Considera la ecuación: $2(x - 3) = 14$


  No puedes ''pasar'' el $-3$ al otro lado todavía, porque está atrapado dentro de
  la fortaleza del paréntesis, y el $2$ es el guardia en la puerta.


  Para liberar a los términos, el guardia ($2$) multiplica a todos:

  $2 \cdot (x) - 2 \cdot (3) = 14$

  $2x - 6 = 14$


  Listo. El paréntesis desapareció. Ahora es una ecuación normal y corriente.

  - Pasa el $-6$ como $+6$: $2x = 20$

  - Pasa el $2$ dividiendo: $x = 10$


  Si hubiera múltiples signos de agrupación (ej. llaves y corchetes), se destruyen
  de adentro hacia afuera.'
definiciones_clave: '- **Resolución de ecuaciones con signos de agrupación**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución de ecuaciones con signos de agrupación.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando resolución de ecuaciones
    con signos de agrupación.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de resolución de ecuaciones
    con signos de agrupación.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
