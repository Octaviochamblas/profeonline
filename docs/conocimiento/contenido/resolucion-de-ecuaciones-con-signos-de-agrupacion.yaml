procedimiento:
- 'Paso 1: Localiza el número y signo que están inmediatamente a la izquierda del
  paréntesis.'
- 'Paso 2: Multiplica ese número por el primer término de adentro.'
- 'Paso 3: Multiplica ese número por el segundo término (respeta la ley de los signos).'
- 'Paso 4: Escribe la nueva ecuación sin paréntesis y procede a reducir términos semejantes.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución de ecuaciones con signos de agrupación.
ejemplos:
- titulo: 'Resuelve: $3(2x + 1) = 21$'
  enunciado: 'Resuelve: $3(2x + 1) = 21$'
  solucion_pasos:
  - 'Distribuimos el 3: $3(2x) + 3(1) = 21$.'
  - $6x + 3 = 21$.
  - 'Pasamos el 3 restando: $6x = 18$.'
  - 'Dividimos por 6: $x = 3$.'
- titulo: Resuelve la ecuación $4(x - 2) = x + 7$
  solucion_pasos:
  - 'Distribuye: 4x - 8 = x + 7.'
  - 'Trae las x a un lado: 4x - x = 7 + 8.'
  - 'Reduce: 3x = 15.'
  - 'Despeja: x = 5.'
- titulo: 'Respecto de «Resolución de ecuaciones con signos de agrupación»: ¿La siguiente
    formulación e'
  enunciado: 'Respecto de «Resolución de ecuaciones con signos de agrupación»: ¿La
    siguiente formulación es correcta? «Para resolver ecuaciones con paréntesis, se
    debe utilizar la propiedad distributiva: el número o signo que está fuera del
    paréntesis multiplica a CADA UNO de los términos que están adentro»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para resolver ecuaciones con
    paréntesis, se debe utilizar la propiedad distributiva: el número o signo que
    está fuera del paréntesis multiplica a CADA UNO de los términos que están adentro.'
- titulo: 'Respecto de «Resolución de ecuaciones con signos de agrupación»: ¿La siguiente
    conclusión es'
  enunciado: 'Respecto de «Resolución de ecuaciones con signos de agrupación»: ¿La
    siguiente conclusión es correcta? «Distribuir el número solo al primer término
    del paréntesis y olvidar el segundo (ej: $2(x+3)$ -> $2x+3$). ¡Error súper común!»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para resolver ecuaciones con
    paréntesis, se debe utilizar la propiedad distributiva: el número o signo que
    está fuera del paréntesis multiplica a CADA UNO de los términos que están adentro.'
errores_frecuentes:
- 'Distribuir el número solo al primer término del paréntesis y olvidar el segundo
  (ej: $2(x+3)$ -> $2x+3$). ¡Error súper común!'
- Pasar un término que está dentro del paréntesis sumando al otro lado de la ecuación
  antes de eliminar el paréntesis.
- Para «¿Qué propiedad matemática permite 'eliminar' los paréntesis multiplicando
  el factor externo por cada término interno», la respuesta correcta es Propiedad
  Asociativa.
- Para «¿Qué propiedad matemática permite 'eliminar' los paréntesis multiplicando
  el factor externo por cada término interno», la respuesta correcta es Propiedad
  Conmutativa.
- Para «¿Qué propiedad matemática permite 'eliminar' los paréntesis multiplicando
  el factor externo por cada término interno», la respuesta correcta es Propiedad
  Cancelativa.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando resolución
  de ecuaciones con signos de agrupación.
