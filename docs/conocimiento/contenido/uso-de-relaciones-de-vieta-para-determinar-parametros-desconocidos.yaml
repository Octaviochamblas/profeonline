semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.USO_VIETA_PARAMETROS
resumen_inicial: El uso de relaciones de Vieta para determinar parámetros calcula constantes desconocidas $k$ imponiendo condiciones sobre la suma o producto de raíces.
explicacion_simple: |
  En muchos ejercicios del colegio o de la PAES te dan una ecuación con una **incógnita secundaria $k$** y te piden hallarla mediante una condición:

  - **Ejemplo**: En $x^2 - kx + 12 = 0$, te dicen que **una raíz es $x_1 = 3$**. ¿Cuánto vale $k$?
  - Usas la relación del producto de Vieta:
    $$x_1 \cdot x_2 = \frac{c}{a} \implies 3 \cdot x_2 = \frac{12}{1} = 12 \implies x_2 = 4$$
  - Ya tienes las dos raíces ($x_1 = 3$ y $x_2 = 4$).
  - Ahora usas la relación de la suma de Vieta:
    $$x_1 + x_2 = -\frac{b}{a} \implies 3 + 4 = -\left(\frac{-k}{1}\right) \implies 7 = k$$
  - **Resultado**: El parámetro es $k = 7$.
explicacion_formal: |
  Sea la ecuación cuadrática $a(k)x^2 + b(k)x + c(k) = 0$ dependiente del parámetro $k \in \mathbb{R}$. La **determinación paramétrica por relaciones de Vieta** plantea un sistema de ecuaciones algebraicas combinando las condiciones sobre las raíces $x_1, x_2$ con las identidades:

  $$\begin{cases} x_1 + x_2 = -\frac{b(k)}{a(k)} \\ x_1 \cdot x_2 = \frac{c(k)}{a(k)} \end{cases}$$

  **Resolución de sistemas mixtos:**
  Se acopla la condición restricta dada en el enunciado (ej. $x_1 = 2x_2$, $x_1 - x_2 = d$ o $x_1 = 1/x_2$) con las relaciones de Vieta para eliminar las raíces auxiliares y despejar el valor exacto de $k$.
definiciones_clave: |
  - **Determinación paramétrica por Vieta**: Técnica analítica que despeja constantes o coeficientes desconocidos $k$ utilizando las relaciones fundamentales de suma y producto de soluciones.
propiedades_relaciones: |
  - **Raíces recíprocas en parámetros**: Si las raíces son inversas ($x_1 \cdot x_2 = 1$), la condición paramétrica directa es $c(k) = a(k)$.
ejemplo_guiado:
  enunciado: 'En la ecuación $x^2 - 8x + k = 0$, determina el valor de $k$ sabiendo que una de sus soluciones es el triple de la otra ($x_1 = 3x_2$).'
  pasos:
    - 'Paso 1: Aplicar la suma de Vieta: $x_1 + x_2 = -(-8)/1 = 8$.'
    - 'Paso 2: Sustituir la condición $x_1 = 3x_2$ en la suma: $3x_2 + x_2 = 8 \implies 4x_2 = 8 \implies x_2 = 2$.'
    - 'Paso 3: Obtener la primera raíz: $x_1 = 3(2) = 6$.'
    - 'Paso 4: Aplicar el producto de Vieta para hallar $k$: $x_1 \cdot x_2 = k/1 \implies 6 \cdot 2 = k \implies k = 12$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la ecuación $2x^2 + kx + 8 = 0$, las raíces son inversas recíprocas ($x_1 \cdot x_2 = 1$). ¿Qué relación debe cumplir $k$?'
    choices:
      - {text: 'El parámetro $k$ no afecta al producto, ya que $c/a = 8/2 = 4 \neq 1$, haciendo imposible esta condición.', is_correct: true}
      - {text: 'El parámetro $k$ debe ser igual a cero.', is_correct: false}
      - {text: 'El parámetro $k$ debe ser igual a 4.', is_correct: false}
      - {text: 'El parámetro $k$ debe ser igual a $-8$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El parámetro $k$ no afecta al producto, ya que $c/a = 8/2 = 4 \neq 1$, haciendo imposible esta condición.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la ecuación $x^2 - 5x + c = 0$, una de las raíces es $x_1 = 2$. ¿Cuánto valen la otra raíz $x_2$ y la constante $c$?'
    choices:
      - {text: '$x_2 = 3$ y $c = 6$', is_correct: true}
      - {text: '$x_2 = -3$ y $c = -6$', is_correct: false}
      - {text: '$x_2 = 5$ y $c = 10$', is_correct: false}
      - {text: '$x_2 = 2$ y $c = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_2 = 3$ y $c = 6$''. Por la suma $2 + x_2 = 5 \implies x_2 = 3$. Por el producto $c = 2 \cdot 3 = 6$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar las expresiones de $a(k)$, $b(k)$ y $c(k)$ en la ecuación dada.'
  - 'Paso 2: Escribir las dos ecuaciones de Vieta: $x_1 + x_2 = -b/a$ y $x_1 \cdot x_2 = c/a$.'
  - 'Paso 3: Incorporar la relación dada entre las raíces en el problema para formar un sistema de ecuaciones.'
  - 'Paso 4: Resolver el sistema para despejar el parámetro $k$.'
errores_correccion: |
  - **Error común:** Intentar despejar $k$ sustituyendo la raíz dada en una sola fórmula de Vieta errónea sin formar el sistema.
  - **Cómo corregirlo:** Combina **AMBAS FÓRMULAS DE VIETA (SUMA Y PRODUCTO)** para eliminar las variables auxiliares $x_1, x_2$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Determinación de c con raíz dada.
    alternativas:
      - '$c = 12$'
      - '$c = -12$'
      - '$c = 7$'
    respuesta: '$c = 12$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Determinación de k con raíces simétricas.
    alternativas:
      - '$k = 0$'
      - '$k = 5$'
      - '$k = -5$'
    respuesta: '$k = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El despeje del parámetro $k$ sin utilizar las relaciones de Vieta planteando ecuaciones de alto grado incompletas.'
  - 'La confusión entre la condición de raíces opuestas ($x_1 + x_2 = 0$) y la de raíces recíprocas ($x_1 \cdot x_2 = 1$).'
  - 'La falta de aplicación de la ley de signos al reemplazar el coeficiente lineal $b(k)$ en la relación de la suma $-b/a$.'
  - 'Reemplazar el valor de una raíz $x_1$ en el coeficiente cuadrático $a$ en lugar de utilizar el sistema de Vieta.'
  - 'La suposición de que toda relación paramétrica entrega un único valor real para $k$.'
afirmaciones_verdaderas:
  - 'El uso conjunto de las ecuaciones de Vieta ($x_1 + x_2 = -b/a$ y $x_1 \cdot x_2 = c/a$) permite determinar coeficientes o parámetros desconocidos $k$ ante restricciones de las raíces.'
  - 'Si el problema especifica que las raíces son simétricas u opuestas, la condición paramétrica directa es $b(k) = 0$.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas paramétricos determinando coeficientes desconocidos $k$ mediante las relaciones de Vieta.
  CÓMO: Plantear $x_1 + x_2 = -b/a$ y $x_1 \cdot x_2 = c/a$, integrar las condiciones sobre las raíces y despejar $k$.
