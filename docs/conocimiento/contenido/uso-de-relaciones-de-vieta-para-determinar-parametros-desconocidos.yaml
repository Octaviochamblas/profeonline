procedimiento:
- 'Paso 1: Identifica qué condición se da sobre las raíces (suma, producto, o el valor
  de una raíz).'
- 'Paso 2: Traduce esa condición usando $x_1+x_2=-b/a$ o $x_1 \cdot x_2=c/a$, dejando
  el parámetro como incógnita.'
- 'Paso 3: Resuelve la ecuación resultante para determinar el valor del parámetro.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en uso de relaciones de vieta para determinar parámetros desconocidos.
ejemplos:
- titulo: Determinación de parámetro a partir de la suma
  enunciado: Las raíces de $x^2-(m+1)x+12=0$ suman $7$. Determina el valor de $m$.
  solucion_pasos:
  - $x_1+x_2=-\dfrac{-(m+1)}{1}=m+1=7$.
  - $m=6$.
- titulo: Determinación de parámetro a partir del producto
  enunciado: Las raíces de $x^2-5x+(p-2)=0$ tienen producto $6$. Determina el valor
    de $p$.
  solucion_pasos:
  - $x_1 \cdot x_2=\dfrac{p-2}{1}=6$.
  - $p=8$.
- titulo: ¿Las relaciones de Vieta permiten hallar un parámetro sin resolver completamente
    la ecuación cuadrática?
  enunciado: ¿Las relaciones de Vieta permiten hallar un parámetro sin resolver completamente
    la ecuación cuadrática?
  respuesta: Sí
  solucion_pasos:
  - Basta con plantear la relación de suma o producto como una ecuación auxiliar en
    el parámetro.
- titulo: ¿Se puede usar la relación de Vieta si solo se conoce el valor de una raíz,
    no ambas?
  enunciado: ¿Se puede usar la relación de Vieta si solo se conoce el valor de una
    raíz, no ambas?
  respuesta: Sí
  solucion_pasos:
  - Conociendo una raíz y usando la suma o producto, se puede despejar tanto la otra
    raíz como el parámetro.
errores_frecuentes:
- Confundir cuál relación de Vieta (suma o producto) corresponde a la condición dada
  en el problema.
- Cometer errores de signo al identificar $b$ cuando el coeficiente involucra directamente
  al parámetro con signo negativo.
- Resolver la ecuación cuadrática completa en vez de usar directamente las relaciones
  de Vieta, un camino más largo e innecesario.
- No verificar que el valor del parámetro obtenido mantenga la ecuación como cuadrática
  (es decir, que $a$ siga siendo distinto de cero).
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando uso
  de relaciones de vieta para determinar parámetros desconocidos.
