semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.USO_VIETA_PARAMETROS
resumen_inicial: Las relaciones de Vieta permiten plantear sistemas de ecuaciones
  para hallar coeficientes o parámetros desconocidos $k$ a partir de condiciones sobre
  sus raíces.
explicacion_simple: 'Si te dicen que una raíz es el doble de la otra ($x_2 = 2x_1$),
  o que las raíces son recíprocas ($x_1 \cdot x_2 = 1$):

  1. Usamos las fórmulas de Vieta: $x_1 + x_2 = -b/a$ y $x_1 \cdot x_2 = c/a$.

  2. Sustituimos la condición dada sobre las raíces.

  3. Despejamos el parámetro desconocido $k$.'
explicacion_formal: Definición formal y demostración de las relaciones de Vieta en
  ecuaciones cuadráticas.
definiciones_clave: '- **Relaciones de Vieta**: Fórmulas algebraicas que conectan
  coeficientes con sumas y productos de raíces.'
propiedades_relaciones: '- **Forma estándar por suma y producto**: $x^2 - S x + P
  = 0$.'
ejemplo_guiado:
  enunciado: Aplicación de las relaciones de Vieta y construcción de ecuaciones cuadráticas.
  pasos:
  - 'Paso 1: Identificar o calcular la suma S = x1 + x2.'
  - 'Paso 2: Identificar o calcular el producto P = x1 * x2.'
  - 'Paso 3: Sustituir en la fórmula x^2 - S*x + P = 0.'
  - 'Paso 4: Multiplicar por el coeficiente principal a si es requerido.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión para construir una ecuación cuadrática mónica a
    partir de la suma $S$ y el producto $P$ de sus raíces?
  choices:
  - text: $x^2 - S x + P = 0$
    is_correct: true
  - text: $x^2 + S x + P = 0$
    is_correct: false
  - text: $x^2 - S x - P = 0$
    is_correct: false
  - text: $x^2 + S x - P = 0$
    is_correct: false
  explanation: La alternativa correcta es '$x^2 - S x + P = 0$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si las raíces de una ecuación cuadrática son $x_1 = 3$ y $x_2 = 4$, ¿cuál
    es su ecuación mónica?
  choices:
  - text: $x^2 - 7x + 12 = 0$
    is_correct: true
  - text: $x^2 + 7x + 12 = 0$
    is_correct: false
  - text: $x^2 - 12x + 7 = 0$
    is_correct: false
  - text: $x^2 - 7x - 12 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$x^2 - 7x + 12 = 0$'. (Puesto que $S =
    7$ y $P = 12$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer $a, b, c$ de la ecuación dada o calcular $x_1, x_2$.'
- 'Paso 2: Aplicar la relación de Vieta correspondiente ($S = -b/a$, $P = c/a$).'
- 'Paso 3: Sustituir en la estructura $x^2 - S x + P = 0$.'
- 'Paso 4: Multiplicar por $a$ para obtener la forma general si es necesario.'
errores_correccion: '- **Error común:** Escribir $+S$ en lugar de $-S$ en la ecuación
  $x^2 - S x + P = 0$.

  - **Cómo corregirlo:** La suma $S$ lleva SIEMPRE un signo menos delante en la estructura
  reconstruida.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de relaciones de Vieta.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de construcción de ecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La suma de las raíces de ax^2 + bx + c = 0 es -b/a?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la primera relación de Vieta.
- titulo: ¿El producto de las raíces de ax^2 + bx + c = 0 es c/a?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la segunda relación de Vieta.
errores_frecuentes:
- Olvidar invertir el signo de $b$ al calcular la suma de raíces $x_1 + x_2 = -b/a$.
- Invertir el signo de $c$ al calcular el producto de raíces (escribir $-c/a$ en vez
  de $+c/a$).
- Olvidar colocar el signo menos delante de la suma $S$ al formar la ecuación $x^2
  - S x + P = 0$.
- No multiplicar por el coeficiente $a$ cuando se pide la forma general conocida una
  $a \neq 1$.
- Confundir la suma de raíces con la suma de los coeficientes.
afirmaciones_verdaderas:
- Las relaciones de Vieta establecen que $x_1 + x_2 = -b/a$ y $x_1 \cdot x_2 = c/a$.
- Toda ecuación cuadrática mónica con raíces $x_1$ y $x_2$ responde a la fórmula $x^2
  - (x_1 + x_2)x + (x_1 \cdot x_2) = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular la suma y producto
  de raíces mediante las relaciones de Vieta, determinar parámetros desconocidos y
  construir ecuaciones cuadráticas mónicas y generales.
