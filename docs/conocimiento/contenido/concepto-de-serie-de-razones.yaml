semantic_id: MAT.NUM.RAZONES.SERIE_RAZONES
resumen_inicial: 'Una serie de razones iguales es la igualdad continua entre tres o más razones que comparten el mismo valor constante: $\frac{a}{x} = \frac{b}{y} = \frac{c}{z} = k$.'
explicacion_simple: |
  Una serie de razones es como una proporción extendida a tres o más cantidades. Se usa frecuentemente para repartir cantidades entre tres o más personas o partes en una proporción fija. Se escribe $a : b : c = x : y : z$ o en forma de fracciones continuas $\frac{a}{x} = \frac{b}{y} = \frac{c}{z} = k$. Por ejemplo, en una receta para 3 personas la razón de ingredientes puede ser $2 : 3 : 5$ (harina, leche, azúcar).
explicacion_formal: |
  ### Definición formal
  Una **serie de razones iguales (o razones continuas)** es una cadena de igualdades de $n$ razones ($n \ge 3$) que convergen a una misma constante real $k \in \mathbb{R}$:
  $$\frac{a_1}{b_1} = \frac{a_2}{b_2} = \dots = \frac{a_n}{b_n} = k \quad (b_i \neq 0)$$

  ### Notación abreviada de puntos
  La serie se expresa de forma compacta mediante la relación de términos correspondientes:
  $$a_1 : a_2 : \dots : a_n = b_1 : b_2 : \dots : b_n$$

  ### Parametrización en función de la constante $k$
  Cada antecedente se expresa directamente como el producto de su consecuente correspondiente por la constante constante $k$:
  $$a_1 = b_1 \cdot k, \quad a_2 = b_2 \cdot k, \quad \dots \quad a_n = b_n \cdot k$$

  ### Síntesis didáctica
  - Igualdad múltiple: Tres o más razones con la misma constante $k$.
  - Despeje paramétrico: Sustituir las variables en términos de $k$ ($a = xk, b = yk, c = zk$).
definiciones_clave: |
  - **Serie de razones iguales**: Cadena de igualdades de razones que poseen la misma constante de proporcionalidad $k$.
  - **Constante de la serie $k$**: Escalar único compartido por todas las razones de la serie.
  - **Parametrización por $k$**: Técnica algebraica que expresa todas las variables desconocidas en función de una única constante $k$.
propiedades_relaciones: |
  - **Propiedad fundamental de la suma de términos**: En toda serie de razones iguales, la suma de los antecedentes dividida por la suma de los consecuentes es igual a la constante de la serie $k$:
    $$\frac{a_1 + a_2 + \dots + a_n}{b_1 + b_2 + \dots + b_n} = k$$
  - **Reparto proporcional tripartito**: Herramienta principal para dividir un total entre tres o más partes en proporciones dadas.
ejemplo_guiado:
  enunciado: 'Las cantidades $a, b, c$ están en la serie de razones $a : b : c = 2 : 3 : 5$. Si la constante de la serie es $k = 4$, determina los valores numéricos de $a, b$ y $c$.'
  pasos:
    - 'Paso 1: Escribimos la serie en forma de fracciones igualadas a la constante $k$: $\frac{a}{2} = \frac{b}{3} = \frac{c}{5} = k = 4$.'
    - 'Paso 2: Despejamos el primer antecedente $a$: $\frac{a}{2} = 4 \implies a = 2 \cdot 4 = 8$.'
    - 'Paso 3: Despejamos el segundo antecedente $b$: $\frac{b}{3} = 4 \implies b = 3 \cdot 4 = 12$.'
    - 'Paso 4: Despejamos el tercer antecedente $c$: $\frac{c}{5} = 4 \implies c = 5 \cdot 4 = 20$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad caracteriza a una serie de razones iguales $\frac{a}{x} = \frac{b}{y} = \frac{c}{z} = k$?'
    choices:
      - {text: 'Que todas las razones de la serie tienen exactamente el mismo valor constante $k$', is_correct: true}
      - {text: 'Que la suma de los numeradores es igual a cero', is_correct: false}
      - {text: 'Que cada fracción es mayor que la siguiente', is_correct: false}
      - {text: 'Que se debe multiplicar en cruz la primera con la última', is_correct: false}
    explanation: 'La alternativa correcta es ''Que todas las razones de la serie tienen exactamente el mismo valor constante $k$''. Una serie de razones es una cadena de igualdades con constante común $k$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si tres cantidades $x, y, z$ están en la serie $x : y : z = 1 : 4 : 7$ y la constante es $k = 10$, ¿cuál es el valor de $y$?'
    choices:
      - {text: '$40$, pues $y = 4 \cdot k = 4 \cdot 10 = 40$', is_correct: true}
      - {text: '$10$, asignando la constante directamente', is_correct: false}
      - {text: '$14$, sumando $4 + 10$', is_correct: false}
      - {text: '$70$, calculando el valor de z', is_correct: false}
    explanation: 'La alternativa correcta es ''$40$, pues $y = 4 \cdot k = 4 \cdot 10 = 40$''. La variable $y$ corresponde al consecuente 4, por ende $y = 4k = 40$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la serie de razones en la forma de fracciones igualadas a una constante $k$: $\frac{a}{x} = \frac{b}{y} = \frac{c}{z} = k$.'
  - 'Paso 2: Expresar cada variable desconocida como el producto de su consecuente por $k$ ($a = xk, b = yk, c = zk$).'
  - 'Paso 3: Sustituir las expresiones parametrizadas en las ecuaciones secundarias de datos del problema.'
  - 'Paso 4: Calcular la constante $k$ y reemplazarla para hallar los valores definitivos de todas las variables.'
errores_correccion: |
  - **Error 1:** Sumar las razones directamente sin usar la constante $k$ (ej: en $a : b : c = 2 : 3 : 5$, asumir que $a=2, b=3, c=5$ sin multiplicar por $k$). **Cómo corregirlo:** Las cantidades son **proporcionales** a $2, 3$ y $5$, por lo que debes introducir la constante $k$: $a = 2k, b = 3k, c = 5k$.
  - **Error 2:** Multiplicar en cruz términos no contiguos en una serie de 3 o más razones (ej: igualar $a \cdot z = c \cdot x$ en una serie de tres). **Cómo corregirlo:** La forma más segura de resolver series de razones es **parametrizar todas las variables con la constante $k$**.
ejemplos:
  - titulo: 'Parametrización con constante'
    enunciado: 'En la serie $\frac{x}{3} = \frac{y}{5} = \frac{z}{8} = k$, si $k = 2$, ¿el valor de la suma $x + y + z$ es $32$?'
    alternativas:
      - 'Sí, pues $x = 6, y = 10, z = 16 \implies 6 + 10 + 16 = 32$'
      - 'No, es igual a 16'
      - 'No, es igual a 64'
    respuesta: 'Sí, pues $x = 6, y = 10, z = 16 \implies 6 + 10 + 16 = 32$'
    solucion_pasos:
      - '1. Parametrizamos: $x = 6, y = 10, z = 16$.'
      - '2. Sumamos: $6 + 10 + 16 = 32$.'
  - titulo: 'Constante común de la serie'
    enunciado: '¿La serie $\frac{10}{2} = \frac{25}{5} = \frac{40}{8}$ tiene como constante $k = 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10/2 = 5$, $25/5 = 5$, $40/8 = 5$.'
  - titulo: 'Notación abreviada tripartita'
    enunciado: '¿La relación $a : b : c = 3 : 4 : 7$ equivale a $\frac{a}{3} = \frac{b}{4} = \frac{c}{7}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la representación canónica en fracciones.'
  - titulo: 'Identificación de partes proporcionales'
    enunciado: 'Si tres hermanos se reparten dinero en la razón $1 : 2 : 3$, ¿el tercero recibe el triple que el primero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $c = 3k$ y $a = 1k \implies c = 3a$.'
errores_frecuentes:
  - 'Asignar a los antecedentes los valores absolutos de los consecuentes sin multiplicar por la constante $k$.'
  - 'Sumar los consecuentes directamente para obtener el resultado de una variable.'
  - 'Aplicar reglas de tres simples entre términos discontinuos de la serie sin justificación.'
  - 'Las razones individuales de una misma serie pueden poseer constantes $k$ diferentes entre sí.'
  - 'La suma total calculada a partir de las partes puede diferir del valor total del enunciado.'
afirmaciones_verdaderas:
  - 'Una serie de razones iguales es una cadena de razones $\frac{a}{x} = \frac{b}{y} = \frac{c}{z} = k$ que comparten una misma constante de proporcionalidad $k$.'
  - 'La parametrización $a = xk, b = yk, c = zk$ permite expresar todas las incógnitas de una serie en función de una única variable $k$.'
al_terminar_debes_poder: 'Formular y resolver series de razones iguales parametrizando los términos con la constante de proporcionalidad $k$.'
