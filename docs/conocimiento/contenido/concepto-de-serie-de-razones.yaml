semantic_id: MAT.NUM.RAZONES.SERIE_RAZONES
resumen_inicial: 'Una serie de razones iguales es la igualdad encadenada de tres o más razones que comparten la misma constante $k$: $\frac{a}{b} = \frac{c}{d} = \frac{e}{f} = k$, denotada también como $a : c : e = b : d : f$.'
explicacion_simple: "![Concepto de serie de razones](/static/img/nodos/concepto-de-serie-de-razones-intro.svg)\n\nUna **serie de razones iguales** es cuando tres o más razones tienen el mismo resultado $k$:\n- Se escribe: $\\frac{a}{b} = \\frac{c}{d} = \\frac{e}{f} = k$ o bien en línea: $a : c : e = b : d : f$.\n- Ejemplo: $\\frac{6}{2} = \\frac{15}{5} = \\frac{21}{7} = 3$ (todas valen $k = 3$).\n- Esto permite expresar todas las incógnitas en función de una sola constante:\n  - $a = b \\cdot k$, $c = d \\cdot k$, $e = f \\cdot k$.\n- Es la herramienta matemática fundamental para resolver repartos proporcionales."
explicacion_formal: 'Sean $a_1, a_2, \dots, a_n \in \mathbb{R}$ y $b_1, b_2, \dots, b_n \in \mathbb{R} \setminus \{0\}$ con $n \ge 3$. Se define una **serie de razones iguales** (o proporción continua múltiple) como el conjunto de igualdades:


  $$\frac{a_1}{b_1} = \frac{a_2}{b_2} = \dots = \frac{a_n}{b_n} = k$$


  notación equivalente:

  $$a_1 : a_2 : \dots : a_n = b_1 : b_2 : \dots : b_n$$


  **Parametrización Fundamental:**

  Cualquier antecedente $a_i$ se expresa linealmente respecto a la constante común $k$:

  $$a_i = k \cdot b_i \quad (\forall i \in \{1, 2, \dots, n\})$$'
definiciones_clave: '- **Serie de razones iguales**: Igualdad continua $\frac{a}{b} = \frac{c}{d} = \frac{e}{f} = k$.

  - **Notación conjunta ($a:c:e = b:d:f$)**: Expresión compacta de proporcionalidad múltiple.

  - **Constante común ($k$)**: Razón uniforme compartida por todos los pares.'
propiedades_relaciones: '- **Parametrización univariada**: Reduce un sistema de $n$ variables a una única incógnita $k$.

  - **Conservación de relaciones**: $\frac{a_i}{a_j} = \frac{b_i}{b_j}$ para cualesquiera índices $i, j$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de serie de razones](/static/img/nodos/concepto-de-serie-de-razones-ejemplos.svg)


    Compruebe si $\frac{6}{2} = \frac{15}{5} = \frac{21}{7}$ forman una serie de razones y despeje $x, y, z$ si $\frac{x}{3} = \frac{y}{4} = \frac{z}{5} = 10$.'
  pasos:
  - 'Paso 1: Para la comprobación: $\frac{6}{2} = 3$, $\frac{15}{5} = 3$, $\frac{21}{7} = 3$. Como todos dan $3$, sí forman una serie con $k = 3$.'
  - 'Paso 2: Para el sistema con $k = 10$: $x = 3 \cdot k = 3 \cdot 10 = 30$.'
  - 'Paso 3: $y = 4 \cdot k = 4 \cdot 10 = 40$.'
  - 'Paso 4: $z = 5 \cdot k = 5 \cdot 10 = 50$.'
  - 'Conclusión: Las soluciones son $x = 30, y = 40, z = 50$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{a}{2} = \frac{b}{5} = \frac{c}{7} = 4$, ¿cuánto vale $b$?
  choices:
