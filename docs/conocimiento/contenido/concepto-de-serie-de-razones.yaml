semantic_id: MAT.NUM.RAZONES.SERIE_RAZONES
resumen_inicial: Una serie de razones iguales (o serie de razones geométricas) es
  la igualdad entre tres o más razones que poseen el mismo valor $k$ ($\frac{a}{b}
  = \frac{c}{d} = \frac{e}{f} = k$).
explicacion_simple: 'Cuando tienes más de dos cantidades que mantienen la misma relación
  proporcional entre sí, se forma una **serie de razones**:

  $$\frac{2}{4} = \frac{5}{10} = \frac{9}{18} = 0{,}5$$

  Todas las razones valen $0{,}5$. También se suele escribir en forma continua como
  $a:c:e = b:d:f$.'
explicacion_formal: Una serie de $n$ razones iguales es una cadena de igualdades $\frac{a_1}{b_1}
  = \frac{a_2}{b_2} = \dots = \frac{a_n}{b_n} = k$ con $b_i \neq 0$. Por propiedad
  de la constante $k$, se cumple $a_i = k \cdot b_i$ para todo $i$.
definiciones_clave: '- **Serie de razones geométricas**: Cadena de equivalencias de
  tres o más razones.'
propiedades_relaciones: '- **Suma de antecedentes y consecuentes**: $\frac{a_1 + a_2
  + \dots + a_n}{b_1 + b_2 + \dots + b_n} = k$.'
ejemplo_guiado:
  enunciado: Verifica si la serie $\frac{3}{6} = \frac{4}{8} = \frac{10}{20}$ es una
    serie de razones iguales.
  pasos:
  - 'Calcular el valor de la primera razón: $3 \div 6 = 0{,}5$.'
  - 'Calcular el valor de la segunda razón: $4 \div 8 = 0{,}5$.'
  - 'Calcular el valor de la tercera razón: $10 \div 20 = 0{,}5$.'
  - Como todas las razones son iguales a $k = 0{,}5$, se confirma que SÍ es una serie
    de razones iguales.
checkpoints:
- placement: after_explicacion_formal
  question: En la serie de razones $\frac{a}{2} = \frac{b}{3} = \frac{c}{5} = 4$,
    ¿cuál es el valor de $a$?
  choices:
  - text: '8'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '20'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: 'La correcta es: 8. $a = 2 \cdot k = 2 \cdot 4 = 8$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dada la serie $\frac{x}{3} = \frac{y}{5} = 6$, halla el valor de $y$.
  choices:
  - text: '30'
    is_correct: true
  - text: '18'
    is_correct: false
  - text: '11'
    is_correct: false
  - text: 5/6
    is_correct: false
  explanation: 'La correcta es: 30. $y = 5 \cdot 6 = 30$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el valor $k$ de cada razón de la cadena.'
- 'Paso 2: Verificar la igualdad de los cocientes obtenidos.'
- 'Paso 3: Expresar cada antecedente como $a_i = k \cdot b_i$ para resolver incógnitas.'
errores_correccion: No confundas la constante $k$ con la suma de las razones. Cada
  fracción por separado vale $k$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{a}{4} = \frac{b}{7} = 3$, halla $a + b$.
  alternativas:
  - '33'
  - '11'
  - '21'
  respuesta: '33'
  solucion_pasos:
  - $a = 12, b = 21 \implies 12 + 21 = 33$.
errores_frecuentes:
- Olvidar multiplicar el consecuente por la constante $k$.
afirmaciones_verdaderas:
- $\frac{a_1+a_2}{b_1+b_2} = k$ para toda serie de razones iguales.
al_terminar_debes_ponder: Trabajar con series de razones iguales determinando valores
  desconocidos.
fuente: Texto escolar MINEDUC.
estado: publicado
