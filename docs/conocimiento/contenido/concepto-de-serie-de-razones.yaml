    is_correct: false
  - text: Porque hace que todas las variables sean iguales a 10
    is_correct: false
  explanation: La alternativa correcta es 'Porque permite expresar todas las variables desconocidas con una sola letra k'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las razones dadas y verificar que todas sean iguales a una misma constante $k$.'
- 'Paso 2: Expresar cada variable desconocida multiplicando su consecuente por $k$: $a_i = b_i \cdot k$.'
- 'Paso 3: Sustituir estas expresiones en las ecuaciones adicionales del problema (como sumas o perímetros) para hallar $k$.'
errores_correccion: "- **Error 1: Asumir que si $\frac{x}{2} = \frac{y}{3}$, entonces $x=2$ e $y=3$.** **Cómo corregirlo:** $x$ e $y$ son proporcionales a $2$ y $3$: $x = 2k, y = 3k$ (solo valen $2$ y $3$ si $k=1$).\n- **Error 2: Mezclar antecedentes de una razón con consecuentes de otra.** **Cómo corregirlo:** Mantener la correspondencia estricta de cada par $a_i$ con $b_i$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{x}{3} = \frac{y}{5} = \frac{z}{8}$ y $x = 12$, ¿cuánto vale $z$?
  alternativas:
  - $32$
  - $20$
  - $24$
  respuesta: $32$
  solucion_pasos:
  - $k = \frac{12}{3} = 4 \implies z = 8 \cdot k = 8 \cdot 4 = 32$.
- titulo: Ejemplo 2
  enunciado: ¿Qué valor debe tener $w$ para que $\frac{4}{2} = \frac{10}{5} = \frac{w}{9}$ forme una serie de razones?
  alternativas:
  - $18$
  - $14$
  - $9$
  respuesta: $18$
  solucion_pasos:
  - $k = \frac{4}{2} = 2 \implies w = 9 \cdot 2 = 18$.
- titulo: '¿Es a : b : c = 2 : 3 : 5 equivalente a decir a/2 = b/3 = c/5?'
  respuesta: Sí
  solucion_pasos:
  - Sí, son dos formas equivalentes de escribir una serie de razones iguales.
  alternativas:
  - texto: Sí, ambas notaciones representan exactamente la misma relación
    es_correcta: true
    retroalimentacion: ¡Correcto! Notación compacta vs notación fraccionaria.
  - texto: No, una es suma y la otra división
    es_correcta: false
    retroalimentacion: Incorrecto, ambas expresan proporcionalidad múltiple.
  - texto: No, solo aplica para 2 términos
    es_correcta: false
    retroalimentacion: Incorrecto, aplica para 3 o más términos.
- titulo: ¿Tienen todas las razones de una serie el mismo valor k?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la condición que define a una serie de razones iguales.
  alternativas:
  - texto: Sí, por definición comparten la misma constante k
    es_correcta: true
    retroalimentacion: ¡Correcto! Constante común $k$.
  - texto: No, cada fracción tiene su propio valor
    es_correcta: false
    retroalimentacion: Incorrecto, si fueran distintos no formarían una serie de razones iguales.
  - texto: No, solo la primera y la última
    es_correcta: false
    retroalimentacion: Incorrecto, todas son iguales entre sí.
errores_frecuentes:
- Igualar directamente las variables con los consecuentes sin usar $k$.
- Despejar usando sumas en lugar de multiplicaciones.
- Olvidar que todas las razones deben tener el mismo valor $k$.
- Confundir la serie de razones con una suma de fracciones.
afirmaciones_verdaderas:
- 'Una serie de razones iguales encadena tres o más razones con el mismo valor: $\frac{a}{b} = \frac{c}{d} = \frac{e}{f} = k$.'
- Permite parametrizar cada antecedente como $a_i = b_i \cdot k$.
- 'La notación $a : c : e = b : d : f$ es equivalente a la forma fraccionaria encadenada.'
al_terminar_debes_poder: '![Síntesis de serie de razones](/static/img/nodos/concepto-de-serie-de-razones-resumen.svg)


  QUÉ: Comprender y formular series de razones iguales $a_1 : a_2 : \dots = b_1 : b_2 : \dots = k$.


  CÓMO: Expresando cada antecedente en función de la constante común $a_i = b_i \cdot k$ para resolver problemas con múltiples cantidades proporcionales.'
