resumen_inicial: 'Una serie de razones iguales (o razones continuas) es la igualdad
  entre tres o más razones que comparten el mismo valor de razón $k$: $\frac{a}{b}
  = \frac{c}{d} = \frac{e}{f} = k$.'
explicacion_simple: Una serie de razones iguales es cuando tenemos tres o más razones
  que, al calcularlas, dan todas exactamente el mismo resultado constante $k$. Por
  ejemplo, $2/4 = 3/6 = 5/10 = 0,5$.
explicacion_formal: 'Una **Serie de Razones Iguales** de orden $m$ se define como
  la cadena de equivalencias:


  $$\frac{a_1}{b_1} = \frac{a_2}{b_2} = \dots = \frac{a_m}{b_m} = k$$


  **Parametrización individual:**

  Cada antecedente satisface $a_i = k \cdot b_i$ para $i \in \{1, 2, \dots, m\}$.'
definiciones_clave: '- **Serie de razones iguales**: Cadena de igualdades $\frac{a}{b}
  = \frac{c}{d} = \frac{e}{f} = k$.'
propiedades_relaciones: '- **Constante común $k$**: Todas las razones de la serie
  comparten el mismo valor de la razón $k$.'
ejemplo_guiado:
  enunciado: Verifique si las razones $\frac{4}{2}$, $\frac{10}{5}$ y $\frac{18}{9}$
    forman una serie de razones iguales.
  pasos:
  - 'Paso 1: Calcular el valor de la primera razón: $4 : 2 = 2$.'
  - 'Paso 2: Calcular el valor de la segunda razón: $10 : 5 = 2$.'
  - 'Paso 3: Calcular el valor de la tercera razón: $18 : 9 = 2$.'
  - 'Conclusión: Como todas valen $k = 2$, forman la serie $\frac{4}{2} = \frac{10}{5}
    = \frac{18}{9} = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad define a una serie de razones iguales a/b = c/d = e/f?
  choices:
  - text: Todas las razones de la cadena tienen exactamente el mismo valor constante
      k
    is_correct: true
  - text: Todos los antecedentes son iguales entre sí
    is_correct: false
  - text: La suma de los denominadores da cero
    is_correct: false
  - text: No guardan ninguna relación
    is_correct: false
  explanation: La alternativa correcta es 'Todas las razones de la cadena tienen exactamente
    el mismo valor constante k'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4/2, 10/5 y 18/9, ¿cuál fue la constante k compartida?
  choices:
  - text: '2'
    is_correct: true
  - text: '32'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: '10'
    is_correct: false
  explanation: La alternativa correcta es '2'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de reconocer y estructurar una serie
  de razones iguales $\frac{a}{b} = \frac{c}{d} = \frac{e}{f} = k$, verificando la
  constante común $k$.
semantic_id: MAT.NUM.RAZONES.SERIE_RAZONES
procedimiento:
- 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la comparación por
  cociente.'
- 'Paso 2: Calcular el valor de la razón $k = a / b$ o aplicar las propiedades de
  series de razones.'
- 'Paso 3: Simplificar y expresar la respuesta en términos del problema planteado.'
errores_correccion: '- **Error 1: Confundir la comparación por cociente con la comparación
  por diferencia (resta).** **Cómo corregirlo:** La razón matemática es multiplicativa
  por división ($a/b$), no por resta ($a-b$).


  - **Error 2: Invertir el orden entre antecedente y consecuente.** **Cómo corregirlo:**
  Respetar estrictamente el orden nombrado en el enunciado ($a:b$ pone a $a$ arriba
  y a $b$ abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAZONES.SERIE_RAZONES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de razones.
- titulo: Ejemplo 2
  enunciado: Verificación de la relación proporcional.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por cociente.
- titulo: ¿Es el consecuente de una razón siempre distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división por cero.
- titulo: ¿Se conserva la constante k al sumar antecedentes y consecuentes en una
    serie?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de las series de razones.
errores_frecuentes:
- Calcular la razón entre dos magnitudes mediante la resta de sus valores numéricos.
- Invertir la posición del antecedente y del consecuente alterando el valor escalar
  de la razón.
- Utilizar el número cero como el consecuente de una razón matemática.
- La constante de la razón $k$ en una serie de razones cambia al sumar los antecedentes.
- Sumar directamente los términos de la razón sin multiplicar por la constante $k$.
afirmaciones_verdaderas:
- 'Una razón es la comparación por cociente $a : b = \frac{a}{b}$ entre dos magnitudes
  con $b \neq 0$.'
- En una serie de razones iguales $\frac{a}{b} = \frac{c}{d} = k$, la razón entre
  la suma de antecedentes y la suma de consecuentes equivale a $k$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
