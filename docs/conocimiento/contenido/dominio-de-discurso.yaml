semantic_id: MAT.FUND.CUANTIFICADORES.DOMINIO_DE_DISCURSO
resumen_inicial: Definición e importancia del dominio de discurso ($\mathcal{U}$) como el universo de objetos sobre el cual actúan los cuantificadores lógicos.
explicacion_simple: '![Infografía: Dominio de discurso, conjunto universo e impacto en el valor de verdad](/static/img/nodos/dominio-de-discurso-intro.svg)


  El **dominio de discurso** (o conjunto universo, anotado como **$\mathcal{U}$**) es el grupo o contexto de cosas de donde podemos sacar los valores para la variable $x$. Es fundamental porque **una misma frase puede ser verdadera o falsa dependiendo del dominio**. Por ejemplo: la afirmación "Para todo número $x$, $x - 5$ da un número positivo" es **falsa** si trabajamos en todos los enteros ($\mathbb{Z}$), pero es **verdadera** si nuestro dominio son los números mayores que diez ($\mathcal{U} = \{11, 12, 13, \dots\}$).

  '
explicacion_formal: '### Definición formal

  En la semántica de la lógica de primer orden, el **dominio de discurso** (universo de interpretación $\mathcal{U}$) es un conjunto no vacío $\mathcal{U} \neq \emptyset$ sobre el cual se interpretan los términos y las variables ligadas por los cuantificadores:

  $$\mathcal{M} = \langle \mathcal{U}, \mathcal{I} \rangle$$

  donde $\mathcal{I}$ es la función de interpretación que asigna a cada símbolo de predicado $n$-ario $P$ una relación $P^\mathcal{M} \subseteq \mathcal{U}^n$.

  El valor de verdad de una fórmula cerrada cuantificada depende críticamente de $\mathcal{U}$:

  $$v_\mathcal{U}(\forall x \, P(x)) = V \iff P^\mathcal{M} = \mathcal{U}$$

  $$v_\mathcal{U}(\exists x \, P(x)) = V \iff P^\mathcal{M} \neq \emptyset$$


  ### Desglose simbólico

  - Universo estándar: $\mathcal{U} \in \{\mathbb{N}, \mathbb{Z}, \mathbb{Q}, \mathbb{R}, \mathbb{C}\}$.

  - Dependencia contextual: Si $\mathcal{U}_1 \subset \mathcal{U}_2$, una fórmula verdadera en $\mathcal{U}_1$ puede devenir falsa en $\mathcal{U}_2$.


  > **Complemento didáctico:** Ninguna proposición cuantificada posee un valor de verdad intrínseco hasta que su dominio de discurso no ha sido fijado con absoluta precisión.

  '
definiciones_clave: '- **Dominio de discurso ($\mathcal{U}$)**: Conjunto no vacío de entidades sobre el cual se evalúan las variables libres y ligadas.

  - **Conjunto de verdad $P^\mathcal{M}$**: Subconjunto de elementos de $\mathcal{U}$ que hacen verdadero el predicado $P(x)$.

  - **Universo relativo**: Restricción explícita del dominio mediante condiciones algebraicas suplementarias.

  '
propiedades_relaciones: '- **Sensibilidad de la universalidad**: Ampliar el dominio $\mathcal{U}$ puede falsear una proposición universal $\forall x P(x)$.

  - **Sensibilidad de la existencialidad**: Reducir el dominio $\mathcal{U}$ puede falsear una proposición existencial $\exists x P(x)$.

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Evaluación comparativa de proposiciones en distintos dominios de discurso](/static/img/nodos/dominio-de-discurso-ejemplos.svg)


    Evalúa la proposición $\exists x, \; 2x = 1$ en dos dominios distintos: $\mathcal{U}_1 = \mathbb{Z}$ (enteros) y $\mathcal{U}_2 = \mathbb{Q}$ (racionales).'
  pasos:
  - 'Paso 1: Resolver la ecuación del predicado: $2x = 1 \implies x = \frac{1}{2}$.'
  - 'Paso 2: Evaluar en el dominio $\mathcal{U}_1 = \mathbb{Z}$: El valor $x = \frac{1}{2} \notin \mathbb{Z}$. Como no hay ninguna solución entera, la proposición en $\mathcal{U}_1$ es **Falsa ($F$)**.'
  - 'Paso 3: Evaluar en el dominio $\mathcal{U}_2 = \mathbb{Q}$: El valor $x = \frac{1}{2} \in \mathbb{Q}$. Al existir este testigo racional, la proposición en $\mathcal{U}_2$ es **Verdadera ($V$)**.'
  - 'Paso 4: Comparar ambos resultados: Se evidencia que el cambio de dominio invierte por completo el valor de verdad de la fórmula.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es indispensable especificar el dominio de discurso $\mathcal{U}$ al trabajar con proposiciones cuantificadas?
  choices:
  - text: Porque el valor de verdad de la proposición depende directamente de los elementos que pertenezcan a dicho conjunto
    is_correct: true
  - text: Porque sin dominio de discurso no se pueden utilizar paréntesis
    is_correct: false
  - text: Porque el dominio de discurso siempre convierte las fórmulas en tautologías
    is_correct: false
  - text: Porque el dominio de discurso determina el número de conectivos lógicos
    is_correct: false
  explanation: La alternativa correcta es 'Porque el valor de verdad de la proposición depende directamente de los elementos que pertenezcan a dicho conjunto'. Cambiar el dominio altera las interpretaciones válidas.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el dominio $\mathcal{U} = \mathbb{N} = \{1, 2, 3, \dots\}$, ¿cuál es el valor de verdad de $\forall x, \; x \geq 1$?
  choices:
  - text: Verdadero ($V$)
    is_correct: true
  - text: Falso ($F$)
    is_correct: false
  - text: Indeterminado
    is_correct: false
  - text: Nulo
    is_correct: false
  explanation: La alternativa correcta es 'Verdadero ($V$)'. Todo número natural es mayor o igual a 1 en este dominio.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer atentamente el enunciado e identificar el conjunto universo $\mathcal{U}$ especificado.'
- 'Paso 2: Verificar si la variable está restringida a un subconjunto particular (ej. números pares, positivos).'
- 'Paso 3: Resolver algebraicamente el predicado abierto $P(x)$.'
- 'Paso 4: Comprobar si las soluciones halladas pertenecen al conjunto $\mathcal{U}$.'
- 'Paso 5: Asignar el valor de verdad correspondiente en función del cuantificador empleado.'
errores_correccion: '- **Error 1:** Asumir que el dominio siempre son los números reales $\mathbb{R}$ por defecto. **Cómo corregirlo:** En lógica y teoría de números los dominios varían frecuentemente ($\mathbb{N}, \mathbb{Z}, \mathbb{Q}$); siempre se debe verificar el conjunto universo indicado.

  - **Error 2:** Usar soluciones que caen fuera de $\mathcal{U}$ para validar un cuantificador existencial. **Cómo corregirlo:** Un testigo solo es válido si pertenece formalmente al conjunto $\mathcal{U}$.

  '
ejemplos:
- titulo: Dominio de números negativos
  enunciado: En $\mathcal{U} = \mathbb{R}^-$, ¿es verdadera $\forall x, \; x < 0$?
  alternativas:
  - Sí, por definición de los reales negativos
  - No, el cero es una excepción
  - No, los reales son positivos
  respuesta: Sí, por definición de los reales negativos
  solucion_pasos:
  - 1. Todos los elementos de $\mathbb{R}^-$ son estrictamente menores que cero.
- titulo: Cambio de valor por dominio
  enunciado: ¿La afirmación $\forall x, x^2 > 0$ es verdadera en $\mathbb{R} \setminus \{0\}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, al excluir el cero del dominio, todo elemento al cuadrado es estrictamente positivo.
- titulo: Existencial con raíces
  enunciado: ¿Tiene solución $\exists x, x^2 = 2$ en el dominio $\mathbb{Q}$?
  respuesta: 'No'
  solucion_pasos:
  - No, pues $\sqrt{2}$ es irracional ($\sqrt{2} \notin \mathbb{Q}$).
- titulo: Conjunto vacío como dominio
  enunciado: ¿Puede un dominio de discurso ser el conjunto vacío en lógica clásica?
  respuesta: 'No'
  solucion_pasos:
  - No, por definición axiomática el dominio de discurso debe ser un conjunto no vacío ($\mathcal{U} \neq \emptyset$).
errores_frecuentes:
- La afirmación de que el valor de verdad de una fórmula cuantificada no cambia al modificar el conjunto universo.
- La afirmación de que el dominio de discurso siempre abarca todos los números reales si no se escribe explícitamente.
- La afirmación de que un número complejo puede utilizarse como testigo en un dominio restringido a los números enteros.
- La afirmación de que el dominio de discurso en lógica clásica puede ser el conjunto vacío.
- La afirmación de que las propiedades del predicado no interactúan con los límites del conjunto universo.
afirmaciones_verdaderas:
- El dominio de discurso $\mathcal{U}$ es el conjunto no vacío de objetos sobre el cual se evalúan las proposiciones cuantificadas.
- Una misma fórmula proposicional con cuantificadores puede tomar valores de verdad opuestos dependiendo del dominio de discurso fijado.
al_terminar_debes_poder: 'QUÉ: Identificar, contextualizar y aplicar el concepto de dominio de discurso ($\mathcal{U}$).

  CÓMO: Restringir las variables cuantificadas a su conjunto de pertenencia y evaluar el impacto del universo en el valor de verdad.


  ![Cuadro resumen: Universo de interpretación, jerarquía de dominios y sensibilidad semántica](/static/img/nodos/dominio-de-discurso-resumen.svg)

  '
