semantic_id: MAT.FUND.TABLAS_VERDAD.TABLA_BICONDICIONAL
resumen_inicial: 'Estructura canónica de la tabla de verdad del bicondicional ($p \leftrightarrow q$), con valores verdaderos en los extremos y falsos al centro.'
explicacion_simple: |
  La **tabla de verdad del bicondicional** ($p \leftrightarrow q$) muestra la relación "si y solo si". En sus $4$ combinaciones, la columna de salida es **Verdadera ($V$)** en los extremos: en la primera fila (donde $p$ y $q$ son verdaderos) y en la cuarta fila (donde $p$ y $q$ son falsos). En las dos filas del medio (donde una es verdadera y la otra es falsa), el bicondicional resulta **Falso ($F$)**, porque las dos partes no coinciden.
explicacion_formal: |
  ### Definición formal
  La **tabla de verdad del bicondicional binario** es la matriz de evaluación booleana de la coimplicación y equivalencia lógica:
  $$\begin{array}{|c|c|c|} \hline p & q & p \leftrightarrow q \\ \hline V & V & V \\ V & F & F \\ F & V & F \\ F & F & V \\ \hline \end{array}$$
  donde el vector columna de salida canónico es $\mathbf{v}(p \leftrightarrow q) = [V, F, F, V]^T$.

  ### Desglose simbólico
  - Fila 1 ($V, V$): $V \leftrightarrow V = V$ (coincidencia en verdad).
  - Fila 2 ($V, F$): $V \leftrightarrow F = F$ (disparidad veritativa).
  - Fila 3 ($F, V$): $F \leftrightarrow V = F$ (disparidad veritativa).
  - Fila 4 ($F, F$): $F \leftrightarrow F = V$ (coincidencia en falsedad).

  ### Síntesis didáctica
  La tabla del bicondicional es el detector de equivalencia: devuelve Verdadero si y solo si las dos columnas de entrada tienen el mismo valor binario en esa fila.
definiciones_clave: |
  - **Tabla de verdad del bicondicional**: Matriz de 4 filas que mapea la equivalencia lógica ($[V, F, F, V]^T$).
  - **Coincidencia veritativa**: Condición por la cual $p$ y $q$ comparten el mismo valor de verdad ($V, V$ o $F, F$).
  - **Vector complementario de la disyunción exclusiva**: Vector $\mathbf{v}(p \leftrightarrow q) = \mathbf{1} - \mathbf{v}(p \oplus q)$.
propiedades_relaciones: |
  - **Simetría conmutativa perfecta**: Las filas 2 y 3 son idénticas en falsedad ($F$), confirmando que $p \leftrightarrow q \equiv q \leftrightarrow p$.
  - **Descomposición condicional**: La columna $[V, F, F, V]^T$ se obtiene de la conjunción de las columnas $(p \to q) \land (q \to p)$.
ejemplo_guiado:
  enunciado: 'Construye la tabla de verdad de la fórmula $(p \to q) \land (q \to p)$ y verifica que coincide con $p \leftrightarrow q$.'
  pasos:
    - 'Paso 1: Colocar las 4 filas estándar de entrada para $p$ y $q$.'
    - 'Paso 2: Calcular la subcolumna $p \to q$: $[V, F, V, V]^T$.'
    - 'Paso 3: Calcular la subcolumna $q \to p$: $[V, V, F, V]^T$.'
    - 'Paso 4: Evaluar la conjunción $(p \to q) \land (q \to p)$:
      - Fila 1: $V \land V = V$
      - Fila 2: $F \land V = F$
      - Fila 3: $V \land F = F$
      - Fila 4: $V \land V = V$'
    - 'Paso 5: Concluir que el vector resultante $[V, F, F, V]^T$ es exactamente idéntico al vector canónico del bicondicional $p \leftrightarrow q$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuáles filas de la tabla de verdad canónica el bicondicional $p \leftrightarrow q$ es Verdadero ($V$)?'
    choices:
      - {text: 'En las filas 1 y 4, donde $p$ y $q$ coinciden en valor de verdad ($V, V$ y $F, F$)', is_correct: true}
      - {text: 'En las filas 2 y 3, donde $p$ y $q$ son diferentes', is_correct: false}
      - {text: 'Únicamente en la fila 1', is_correct: false}
      - {text: 'En las 4 filas completas', is_correct: false}
    explanation: 'La alternativa correcta es ''En las filas 1 y 4, donde $p$ y $q$ coinciden en valor de verdad ($V, V$ y $F, F$)''. El bicondicional exige igualdad veritativa.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué valor de verdad se obtiene en la fila 4 de la tabla de verdad del bicondicional ($p=F$ y $q=F$)?'
    choices:
      - {text: 'Verdadero ($V$)', is_correct: true}
      - {text: 'Falso ($F$)', is_correct: false}
      - {text: 'Indeterminado', is_correct: false}
      - {text: 'Nulo', is_correct: false}
    explanation: 'La alternativa correcta es ''Verdadero ($V$)''. Como ambas proposiciones son falsas, su valor coincide ($F = F$), por lo que $F \leftrightarrow F = V$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Disponer las 4 combinaciones canónicas de entrada ($p: V, V, F, F$ y $q: V, F, V, F$).'
  - 'Paso 2: Rotular la columna de salida como $p \leftrightarrow q$.'
  - 'Paso 3: Colocar $V$ en las filas 1 ($V, V$) y 4 ($F, F$).'
  - 'Paso 4: Colocar $F$ en las filas intermedias 2 ($V, F$) y 3 ($F, V$).'
errores_correccion: |
  - **Error 1:** Asignar $F$ en la fila $4$ ($F \leftrightarrow F$). **Cómo corregirlo:** Dos falsedades son equivalentes entre sí; por ende, $F \leftrightarrow F$ es formalmente Verdadero ($V$).
  - **Error 2:** Confundir el bicondicional con el condicional simple. **Cómo corregirlo:** El condicional simple solo tiene un $F$ en la fila 2 ($[V, F, V, V]^T$); el bicondicional tiene dos $F$ en las filas 2 y 3 ($[V, F, F, V]^T$).
ejemplos:
  - titulo: 'Evaluación de fila 1'
    enunciado: '¿Cuánto vale $p \leftrightarrow q$ en la fila $p=V, q=V$?'
    alternativas:
      - '$V$'
      - '$F$'
      - '$1/2$'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $V \leftrightarrow V = V$.'
  - titulo: 'Evaluación de fila 4'
    enunciado: '¿Cuánto vale $p \leftrightarrow q$ en la fila $p=F, q=F$?'
    alternativas:
      - '$V$'
      - '$F$'
      - 'Indeterminado'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $F \leftrightarrow F = V$.'
  - titulo: 'Vector canónico'
    enunciado: '¿El vector de salida canónico de $p \leftrightarrow q$ es $[V, F, F, V]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, tiene verdades en los extremos y falsedades al centro.'
  - titulo: 'Inversión de la disyunción exclusiva'
    enunciado: '¿La columna de $\neg(p \oplus q)$ es idéntica a la columna de $p \leftrightarrow q$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas generan el vector $[V, F, F, V]^T$.'
errores_frecuentes:
  - 'La afirmación de que en la combinación $p=F$ y $q=F$ el bicondicional resulta falso.'
  - 'La afirmación de que el bicondicional genera tres combinaciones verdaderas en su tabla.'
  - 'La afirmación de que la tabla del bicondicional no es simétrica respecto a sus variables.'
  - 'La afirmación de que en la combinación $p=V$ y $q=F$ el bicondicional resulta verdadero.'
  - 'La afirmación de que la tabla del bicondicional es idéntica a la del condicional.'
afirmaciones_verdaderas:
  - 'La tabla de verdad del bicondicional $p \leftrightarrow q$ genera el vector de salida canónico $[V, F, F, V]^T$.'
  - 'En la tabla del bicondicional, los resultados verdaderos ocurren exactamente en las filas donde las variables comparten el mismo valor de verdad ($V, V$ y $F, F$).'
al_terminar_debes_poder: |
  QUÉ: Construir, evaluar e interpretar la tabla de verdad canónica del bicondicional ($p \leftrightarrow q$).
  CÓMO: Asignar las $4$ combinaciones de entrada y aplicar el patrón de coincidencia veritativa $[V, F, F, V]^T$.
