semantic_id: MAT.GEO.TRIG_APLICA_REAL.IDENTIFICACION_TRIANGULO_OBLICUANGULO
resumen_inicial: 'Identificación de triángulos oblicuángulos en problemas de contexto:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Muchos problemas reales (dos senderos que forman un ángulo cualquiera,
  dos barcos que se alejan en direcciones distintas) no involucran ángulos rectos,
  por lo que requieren herramientas distintas a las razones trigonométricas básicas.
explicacion_formal: '![Identificación de un triángulo oblicuángulo](/static/img/geometria/trigonometria/trigreal-identificacion-oblicuangulo.svg)


  ### Definición formal


  Un triángulo es oblicuángulo si ninguno de sus tres ángulos mide 90°. Puede clasificarse
  en acutángulo (todos los ángulos menores a 90°) u obtusángulo (un ángulo mayor a
  90°).


  ### Desarrollo didáctico


  Si un problema menciona explícitamente un ángulo recto entre dos elementos, corresponde
  un triángulo rectángulo y se pueden usar seno, coseno y tangente básicos. Si el
  ángulo dado o implícito no es de 90°, y no hay ninguna razón para suponer que exista
  un ángulo recto, el triángulo es oblicuángulo y se requieren las leyes de senos
  o de cosenos.'
