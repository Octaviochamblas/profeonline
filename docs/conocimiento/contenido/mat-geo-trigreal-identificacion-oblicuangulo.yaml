procedimiento:
- 'Paso 1: Lee el problema e identifica todos los ángulos mencionados o implícitos.'
- 'Paso 2: Verifica si alguno de esos ángulos es de 90° (o si la situación garantiza
  perpendicularidad).'
- 'Paso 3: Si ningún ángulo es recto, reconoce que el triángulo es oblicuángulo y
  se debe usar la ley de senos o de cosenos.'
