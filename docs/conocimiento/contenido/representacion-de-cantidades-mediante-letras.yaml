semantic_id: MAT.ALG.FUNDAMENTOS.REPRESENTACION_LETRAS
resumen_inicial: 'En álgebra, las letras del alfabeto se emplean como símbolos para representar cantidades numéricas conocidas, desconocidas, variables o constantes.'
explicacion_simple: |
  - Una letra en álgebra es un **símbolo que contiene un valor numérico**.
  - Si no conocemos el precio de un lápiz, podemos llamarlo $x$. Si compramos $3$ lápices, el costo total será $3x$.
  - Si queremos expresar "el cuadrado de un número más su triple", escribimos $n^2 + 3n$.
  - Las letras permiten traducir frases del lenguaje cotidiano a fórmulas matemáticas precisas sobre las que se puede operar.

  ![Cantidades Mediante Letras](/static/img/nodos/representacion-de-cantidades-mediante-letras-intro.svg)
explicacion_formal: |
  ### Fundamento de la representación literal
  En el lenguaje algebraico formal, una **letra** es un símbolo $x \in S$ que denota un elemento indeterminado o genérico perteneciente a un conjunto numérico estructurado $S \subseteq \mathbb{R}$.

  ### Roles de las letras
  1. **Incógnita:** Representa un valor fijo pero desconocido que satisface una ecuación condicional:
     $$2x + 6 = 14 \implies x = 4$$
  2. **Variable:** Representa un argumento libre en una relación funcional que puede adoptar múltiples valores:
     $$f(x) = x^2 - 1, \quad x \in \mathbb{R}$$
  3. **Parámetro o constante:** Representa un valor fijo pero arbitrario en una familia de funciones o expresiones:
     $$y = mx + b, \quad m, b \in \mathbb{R}$$

  ### Precisión notacional
  Una letra yuxtapuesta a un coeficiente numérico representa una multiplicación: $5a = 5 \cdot a$.
definiciones_clave: |
  - **Símbolo literal**: Letra que representa una cantidad numérica en una expresión matemática.
  - **Incógnita**: Letra cuyo valor numérico específico se busca determinar mediante la resolución de una ecuación.
  - **Variable**: Letra que puede tomar cualquier valor dentro de un dominio numérico establecido.
propiedades_relaciones: |
  - **Independencia del símbolo**: El significado de una relación matemática no cambia al cambiar la letra elegida ($x + 1 = 5 \iff y + 1 = 5$).
  - **Operatividad formal**: Las letras se operan algebraicamente siguiendo las mismas leyes de los números reales (suma de términos semejantes, producto de potencias, etc.).
ejemplo_guiado:
  enunciado: 'Traduce a lenguaje algebraico la siguiente expresión verbal: "El exceso del triple del cuadrado de un número sobre el quíntuple de dicho número".'
  imagen: '/static/img/nodos/representacion-de-cantidades-mediante-letras-ejemplos.svg'
  pasos:
    - 'Paso 1: Asignamos una letra al número desconocido, por ejemplo $x$.'
    - 'Paso 2: Expresamos el "cuadrado del número" como $x^2$.'
    - 'Paso 3: El "triple del cuadrado" corresponde a $3x^2$.'
    - 'Paso 4: El "quíntuple del número" corresponde a $5x$.'
    - 'Paso 5: El "exceso de $A$ sobre $B$" significa la resta $A - B$. Por lo tanto, la expresión algebraica es: **$3x^2 - 5x$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué representa la letra $x$ en la expresión algebraica $P = 4x$ que calcula el perímetro de un cuadrado?'
    choices:
      - text: 'La longitud variable del lado del cuadrado'
        is_correct: true
      - text: 'La cantidad fija de 4 esquinas del cuadrado'
        is_correct: false
      - text: 'El área de la figura geométrica'
        is_correct: false
      - text: 'Una constante invariable igual al número 1'
        is_correct: false
    explanation: 'La alternativa correcta es ''La longitud variable del lado del cuadrado''. El perímetro depende de la medida $x$ del lado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la representación algebraica correcta para la frase: "La mitad de un número disminuida en su tercera parte"?'
    choices:
      - text: '$\frac{x}{2} - \frac{x}{3}$'
        is_correct: true
      - text: '$2x - 3x$'
        is_correct: false
      - text: '$\frac{x - 2}{3}$'
        is_correct: false
      - text: '$\frac{1}{2x} - \frac{1}{3x}$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$\frac{x}{2} - \frac{x}{3}$''. Se toma la mitad del número ($x/2$) y se le resta su tercera parte ($x/3$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer atentamente el enunciado verbal e identificar la cantidad desconocida o variable.'
  - 'Paso 2: Asignar una letra clara a cada cantidad ($x, y, n, t$).'
  - 'Paso 3: Identificar las operaciones mencionadas (doble $\rightarrow 2\cdot$, cuadrado $\rightarrow ()^2$, exceso $\rightarrow -$).'
  - 'Paso 4: Escribir la expresión algebraica resultante respetando la jerarquía de las operaciones.'
errores_correccion: |
  - **Error 1:** Asignar a una letra su posición en el abecedario (creer que $a = 1, b = 2, c = 3$). **Cómo corregirlo:** Las letras **no tienen valores asignados por su posición alfabética**; representan cantidades numéricas arbitrarias.
  - **Error 2:** Confundir "el cuadrado del doble" con "el doble del cuadrado". **Cómo corregirlo:** El cuadrado del doble es $(2x)^2 = 4x^2$, mientras que el doble del cuadrado es $2(x^2) = 2x^2$.
ejemplos:
  - titulo: 'Traducción de suma y cociente'
    enunciado: '¿Cómo se representa algebraicamente "El cociente entre la suma de dos números y su diferencia"?'
    alternativas:
      - '$\frac{a + b}{a - b}$'
      - '$(a + b) \cdot (a - b)$'
      - '$\frac{a \cdot b}{a + b}$'
    respuesta: '$\frac{a + b}{a - b}$'
    solucion_pasos:
      - '1. La suma de los números es $a + b$.'
      - '2. La diferencia de los números es $a - b$.'
      - '3. El cociente es la fracción $\frac{a + b}{a - b}$.'
  - titulo: 'Traducción de edades consecutivas'
    enunciado: 'Si la edad actual de una persona es $E$ años, ¿cuál será su edad dentro de 7 años?'
    alternativas:
      - '$E + 7$'
      - '$7E$'
      - '$E - 7$'
    respuesta: '$E + 7$'
    solucion_pasos:
      - '1. Al transcurrir el tiempo, los años se suman a la edad base.'
      - '2. La expresión es $E + 7$.'
  - titulo: 'Letras como portadoras de valor numérico'
    enunciado: '¿Puede una misma letra $x$ tomar diferentes valores numéricos en distintos problemas o funciones?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Las letras representan variables o incógnitas contextuales.'
      - '2. Su valor numérico depende del problema específico formulado.'
  - titulo: 'Valor fijo por alfabeto'
    enunciado: '¿Tiene la letra $z$ un valor numérico fijo igual a 27 en álgebra por ser la última letra del abecedario?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Las letras no tienen valores predeterminados por el orden alfabético.'
      - '2. $z$ puede representar cualquier número real según la ecuación.'
errores_frecuentes:
  - 'Asignar a cada letra un valor numérico predeterminado según su orden en el abecedario.'
  - 'Confundir el cuadrado de la suma $(a + b)^2$ con la suma de los cuadrados $a^2 + b^2$.'
  - 'Escribir potencias como productos lineales multiplicando la base por el exponente ($x^3 = 3x$).'
  - 'Omitir los paréntesis al aplicar multiplicadores a binomios completos.'
  - 'Tratar a dos letras diferentes ($x$ e $y$) como si obligatoriamente tuvieran el mismo valor.'
afirmaciones_verdaderas:
  - 'Las letras en álgebra representan cantidades numéricas genéricas, variables o incógnitas.'
  - 'El valor numérico de una expresión literal se obtiene al sustituir las letras por números dados.'
al_terminar_debes_poder: |
  ![Resumen de Cantidades Mediante Letras](/static/img/nodos/representacion-de-cantidades-mediante-letras-resumen.svg)

  QUÉ: Representar relaciones cuantitativas, enunciados verbales y fórmulas matemáticas mediante el uso sistemático de símbolos literales.
  CÓMO: Asignando variables ($x, y, n$) a las magnitudes y traduciendo operaciones aritméticas a expresiones algebraicas rigurosas como $3x^2 - 5x$.
