semantic_id: MAT.ALG.FUNDAMENTOS.REPRESENTACION_LETRAS
resumen_inicial: 'Representación de cantidades mediante letras: concepto y propiedades
  en Fundamentos y notación algebraica.'
explicacion_simple: Si ves una '$a$' en un libro de lenguaje, es la primera vocal.
  Si la ves en un libro de matemáticas, es un número disfrazado. Tienes que aprender
  a tratar a las letras con el mismo respeto (y las mismas reglas) que a los números
  de siempre.
explicacion_formal: '### Definición formal


  Como m y n son números, heredan la propiedad conmutativa de la suma: el orden de
  los sumandos no altera la suma.


  ### Desarrollo didáctico


  Como la letra representa un número escondido, debes obedecer las reglas universales:

  1. Propiedad Conmutativa: Así como $2 + 5$ es igual a $5 + 2$, también ocurre que
  $x + y = y + x$.

  2. Propiedad Distributiva: Así como $3 \cdot (4 + 2) = 3\cdot 4 + 3\cdot 2$, también
  ocurre que $a \cdot (b + c) = ab + ac$.


  Si le asignas el valor numérico 10 a la letra $k$, entonces la expresión $k + 5$
  automáticamente vale 15. Las letras son solo ''recipientes'' maleables, y operan
  como si ya tuvieran el número adentro.'
definiciones_clave: '- **Representación de cantidades mediante letras**: Elemento
  fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Representación de cantidades mediante
  letras**: Reglas de notación y clasificación en fundamentos y notación algebraica.'
