procedimiento:
- 'Paso 1: Observa las letras de la expresión.'
- 'Paso 2: Recuerda que son números reales, y aplícales las reglas de la aritmética
  que ya conoces.'
- 'Paso 3: No intentes sumar letras diferentes (como a + b) en un solo término final
  a menos que sepas su valor, porque son recipientes distintos.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar representación de cantidades mediante letras.
ejemplos:
- titulo: Operando a ciegas
  enunciado: Aplica la propiedad conmutativa a la multiplicación de 'p' y 'q'.
  solucion_pasos:
  - En aritmética, 3 * 4 = 4 * 3.
  - En álgebra, p * q = q * p.
  - No importa qué números escondan p y q, el orden de los factores no altera el producto.
- titulo: Una fórmula de física indica que la energía es igual a $m \cdot c \cdot
    c$. Si un estudiante
  enunciado: 'Una fórmula de física indica que la energía es igual a $m \cdot c \cdot
    c$. Si un estudiante reescribe libremente la fórmula de su cuaderno como $c^2
    \cdot m$, ¿ha cometido un error matemático? (v1)


    Opciones: A) No ha cometido error, aplicó la propiedad conmutativa y la definición
    de potencia para reescribir correctamente el equivalente algebraico. · B) Sí,
    porque $m$ debe ir primero obligatoriamente. · C) Sí, porque al multiplicar letras
    repetidas se suma, no se eleva a potencia. · D) Sí, porque $c \cdot c$ es $2c$.'
  solucion_pasos:
  - Como las letras son números, $m \cdot c \cdot c = m \cdot c^2$. Y por propiedad
    conmutativa $m \cdot c^2 = c^2 \cdot m$.
  - 'Respuesta: No ha cometido error, aplicó la propiedad conmutativa y la definición
    de potencia para reescribir correctamente el equivalente algebraico.'
- titulo: 'Respecto de «Representación de cantidades mediante letras»: ¿Es correcta
    esta caracterizació'
  enunciado: 'Respecto de «Representación de cantidades mediante letras»: ¿Es correcta
    esta caracterización? «En álgebra, las **letras representan números**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En álgebra, las **letras representan
    números**.'
- titulo: 'Respecto de «Representación de cantidades mediante letras»: ¿Es válida
    esta afirmación? «Olv'
  enunciado: 'Respecto de «Representación de cantidades mediante letras»: ¿Es válida
    esta afirmación? «Olvidar que las letras son números y tratar de operar fuera
    de las reglas aritméticas (ej. pensar que $a + a = a^2$ en lugar de $2a$, como
    si fueran manzanas en lugar de cantidades)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En álgebra, las **letras representan
    números**.'
errores_frecuentes:
- Olvidar que las letras son números y tratar de operar fuera de las reglas aritméticas
  (ej. pensar que $a + a = a^2$ en lugar de $2a$, como si fueran manzanas en lugar
  de cantidades).
- Creer que letras distintas siempre deben tener valores distintos (a veces $x$ e
  $y$ podrían valer 5 ambas, a menos que el problema diga lo contrario).
- Para «Si en una ecuación algebraica aparece la expresión $m + n$, ¿cuál de las siguientes
  propiedades aritméticas de los números reales garantiza que el resultado es idéntico
  a $n + m$? (v1)», la respuesta correcta es La propiedad distributiva.
- Para «Si en una ecuación algebraica aparece la expresión $m + n$, ¿cuál de las siguientes
  propiedades aritméticas de los números reales garantiza que el resultado es idéntico
  a $n + m$? (v1)», la respuesta correcta es La propiedad del elemento neutro.
- Para «Si en una ecuación algebraica aparece la expresión $m + n$, ¿cuál de las siguientes
  propiedades aritméticas de los números reales garantiza que el resultado es idéntico
  a $n + m$? (v1)», la respuesta correcta es La propiedad asociativa.
afirmaciones_verdaderas:
- La notación de representación de cantidades mediante letras sigue las convenciones
  del lenguaje algebraico.
