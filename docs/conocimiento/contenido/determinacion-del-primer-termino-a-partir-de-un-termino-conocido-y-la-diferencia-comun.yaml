semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_PRIMER_TERMINO
resumen_inicial: 'La determinación del primer término $a_1$ despeja la fórmula del término general mediante $a_1 = a_k - (k - 1)d$, retrocediendo $k - 1$ pasos desde un término conocido $a_k$.'
explicacion_simple: |
  Si conoces un número de la lista (por ejemplo, el término 12) y sabes cuánto sumas en cada paso ($d$), puedes **retroceder en el tiempo** para descubrir con qué número empezó la progresión ($a_1$):
  - Desde el término $k$, retrocedes $(k - 1)$ pasos restando la diferencia:
    $$a_1 = a_k - (k - 1) \cdot d$$
  - Por ejemplo, si el término $12$ vale $47$ y la diferencia es $d = 4$:
    $$a_1 = 47 - (12 - 1) \cdot 4 = 47 - 11 \cdot 4 = 47 - 44 = 3$$
  - ¡El primer término con el que empezó todo es $a_1 = 3$!

  ![Determinación del primer término](/static/img/nodos/determinacion-del-primer-termino-a-partir-de-un-termino-conocido-y-la-diferencia-comun-intro.svg)
explicacion_formal: |
  ### Deducción formal por Despeje
  Dada la ecuación del término general para el índice $k \in \mathbb{N}$:
  $$a_k = a_1 + (k - 1)d$$
  Aplicando las propiedades del inverso aditivo en $\mathbb{R}$, restamos $(k - 1)d$ a ambos miembros:
  $$a_1 = a_k - (k - 1)d$$

  ### Interpretación Geométrica y Operativa
  - Se conoce el punto $(k, a_k)$ y la pendiente $d$.
  - El primer término $a_1$ corresponde a la ordenada en la abscisa $n=1$.
  - Si la progresión es creciente ($d > 0$), el valor inicial $a_1$ es menor que $a_k$.
  - Si la progresión es decreciente ($d < 0$), el valor inicial $a_1$ es mayor que $a_k$.

  ### Síntesis didáctica
  - Ecuación de despeje: $a_1 = a_k - (k-1)d$.
  - Principio: Retroceso de $(k-1)$ pasos diferenciales.
definiciones_clave: |
  - **Primer término ($a_1$)**: Valor de inicio de la secuencia en la posición ordinal $n=1$.
  - **Término de referencia ($a_k$)**: Término conocido en una posición cualquiera $k$.
  - **Retroceso aditivo**: Operación de sustracción de los pasos acumulados $(k-1)d$.
propiedades_relaciones: |
  - **Unicidad de la solución**: Para un término $a_k$ y una diferencia $d$ dados, existe un único primer término $a_1 \in \mathbb{R}$.
  - **Reversibilidad**: Con $a_1$ obtenido, la evaluación de la fórmula general en $n=k$ debe regenerar exactamente el valor $a_k$.
ejemplo_guiado:
  enunciado: 'En una progresión aritmética, el vigésimo término es $a_{20} = 98$ y la diferencia común es $d = 5$. Encuentra el primer término $a_1$ y escribe los tres primeros términos.'
  imagen: '/static/img/nodos/determinacion-del-primer-termino-a-partir-de-un-termino-conocido-y-la-diferencia-comun-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: $k = 20, a_{20} = 98, d = 5$.'
    - 'Paso 2: Aplicamos la fórmula de despeje: $a_1 = a_{20} - (20 - 1) \cdot 5$.'
    - 'Paso 3: Realizamos las operaciones: $a_1 = 98 - 19 \cdot 5 = 98 - 95 = 3$.'
    - 'Paso 4: El primer término es **$a_1 = 3$**, y los tres primeros términos son **$3, 8, 13$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en una PA se conoce que $a_{10} = 45$ y $d = 4$, ¿cuál es la ecuación correcta para hallar el primer término $a_1$?'
    choices:
      - {text: '$a_1 = 45 - 9 \cdot 4 = 45 - 36 = 9$', is_correct: true}
      - {text: '$a_1 = 45 + 9 \cdot 4 = 81$', is_correct: false}
      - {text: '$a_1 = 45 - 10 \cdot 4 = 5$', is_correct: false}
      - {text: '$a_1 = 45 / 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_1 = 45 - 9 \cdot 4 = 45 - 36 = 9$''. Se retroceden $(10-1)=9$ pasos multiplicados por la diferencia 4.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En una PA decreciente con $d = -3$, si el octavo término es $a_8 = -5$, ¿cuál es el valor de $a_1$?'
    choices:
      - {text: '$16$, calculando $-5 - 7(-3) = -5 + 21 = 16$', is_correct: true}
      - {text: '$-26$, restando $-5 - 21 = -26$', is_correct: false}
      - {text: '$19$', is_correct: false}
      - {text: '$-15$', is_correct: false}
    explanation: 'La alternativa correcta es ''$16$, calculando $-5 - 7(-3) = -5 + 21 = 16$''. Al ser decreciente, el primer término debe ser mayor que el término posterior.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término conocido $a_k$, su posición $k$ y la diferencia común $d$.'
  - 'Paso 2: Calcular el número de pasos a retroceder: $k - 1$.'
  - 'Paso 3: Multiplicar $(k - 1) \cdot d$.'
  - 'Paso 4: Restar este producto al valor del término conocido: $a_1 = a_k - (k - 1)d$.'
errores_correccion: |
  - **Error 1:** Sumar $(k-1)d$ en vez de restarlo al despejar $a_1$. **Cómo corregirlo:** Para retroceder hacia el inicio se debe **restar la acumulación de pasos**: $a_1 = a_k - (k-1)d$.
  - **Error 2:** Usar $k$ en vez de $(k-1)$ al retroceder. **Cómo corregirlo:** La distancia en pasos desde $a_1$ hasta $a_k$ es exactamente **$k - 1$**.
ejemplos:
  - titulo: 'Cálculo de $a_1$ con diferencia positiva'
    enunciado: 'Si $a_{15} = 60$ y $d = 4$, ¿cuál es el primer término $a_1$?'
    alternativas:
      - '$4$'
      - '$16$'
      - '$8$'
    respuesta: '$4$'
    solucion_pasos:
      - '1. $a_1 = 60 - (15 - 1) \cdot 4 = 60 - 14 \cdot 4 = 60 - 56 = 4$.'
  - titulo: 'Cálculo de $a_1$ con diferencia negativa'
    enunciado: 'Si $a_6 = 10$ y $d = -5$, ¿cuál es el primer término $a_1$?'
    alternativas:
      - '$35$'
      - '$-15$'
      - '$25$'
    respuesta: '$35$'
    solucion_pasos:
      - '1. $a_1 = 10 - 5(-5) = 10 + 25 = 35$.'
  - titulo: 'Comprobación de valor inicial'
    enunciado: '¿Si $a_4 = 19$ y $d = 5$, el primer término es $a_1 = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_1 = 19 - 3(5) = 19 - 15 = 4$.'
  - titulo: 'Primer término negativo'
    enunciado: '¿Una progresión aritmética puede tener un primer término negativo como $a_1 = -12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. El primer término $a_1$ puede ser cualquier número real.'
errores_frecuentes:
  - 'Para calcular el primer término $a_1$ se suma $(k-1)d$ al término conocido $a_k$ en lugar de restarlo.'
  - 'Al despejar el primer término se retroceden $k$ pasos completos en lugar de $(k-1)$ pasos.'
  - 'El primer término $a_1$ de una PA decreciente es menor que cualquiera de los términos posteriores.'
  - 'En presencia de una diferencia negativa $d$, se cambia el signo del término conocido $a_k$.'
  - 'El primer término no puede ser calculado a partir de un término intermedio sin conocer todos los anteriores.'
afirmaciones_verdaderas:
  - 'El primer término de una PA se calcula mediante $a_1 = a_k - (k - 1)d$ a partir de cualquier término $a_k$ y su diferencia común $d$.'
  - 'En una progresión estrictamente decreciente ($d < 0$), el primer término $a_1$ es estrictamente mayor que cualquier término posterior $a_k$ ($k > 1$).'
