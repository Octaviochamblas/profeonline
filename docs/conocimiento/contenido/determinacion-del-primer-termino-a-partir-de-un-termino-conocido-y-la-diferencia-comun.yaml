procedimiento:
- 'Paso 1: Identifica el valor del término conocido ($a_n$) y qué posición ocupa ($n$).'
- 'Paso 2: Identifica la diferencia ($d$).'
- 'Paso 3: Calcula cuántos pasos hay entre tu posición y el inicio (que es $n-1$).'
- 'Paso 4: Multiplica esos pasos por la diferencia y réstaselo a tu término conocido.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en determinación del primer término a partir de un término conocido y la diferencia
  común.
ejemplos:
- titulo: Buscando las raíces
  enunciado: El décimo término de una P.A. es 5 y la diferencia es -2. ¿Cuánto vale
    el primer término?
  solucion_pasos:
  - 'Datos: a10=5, n=10, d=-2.'
  - 'Fórmula: a1 = a10 - (10-1)*d'
  - a1 = 5 - (9) * (-2)
  - a1 = 5 - (-18)
  - a1 = 5 + 18 = 23.
errores_frecuentes:
- Equivocarse en la regla de los signos al restar un bloque que contiene una diferencia
  negativa, como en $40 - (7 \cdot -4)$.
- Sustituir los datos de '$a_n$' y '$n$' al revés en la ecuación.
afirmaciones_verdaderas:
- La formulación de determinación del primer término a partir de un término conocido
  y la diferencia común mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando determinación del
