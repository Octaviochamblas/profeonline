resumen_inicial: 'El cálculo del primer término $a_1$ despeja la condición inicial
  a partir de un término conocido $a_k$ y la diferencia común $d$: $a_1 = a_k - (k
  - 1) \cdot d$.'
explicacion_simple: Si sabemos cuánto vale un número más adelante en la secuencia
  (por ejemplo, el décimo término) y sabemos de cuánto en cuánto va aumentando, podemos
  retroceder restando las diferencias acumuladas para hallar el primer número.
explicacion_formal: 'Dado el término $a_k$ en la posición $k$ y la diferencia $d$,
  el **Despeje del Primer Término $a_1$** se realiza mediante:


  $$a_k = a_1 + (k - 1) \cdot d \implies a_1 = a_k - (k - 1) \cdot d$$


  **Interpretación de retroceso:**

  - Se restan $(k-1)$ saltos de magnitud $d$ desde la posición $k$ para regresar a
  la posición $1$.'
definiciones_clave: '- **Cálculo del primer término $a_1$**: Despeje $a_1 = a_k -
  (k-1)d$.'
propiedades_relaciones: '- **Retroceso posicional**: Resta $(k-1)$ veces la diferencia
  $d$.'
ejemplo_guiado:
  enunciado: En una P.A. con diferencia $d = 5$, se sabe que el octavo término es
    $a_8 = 42$. Calcule el primer término $a_1$.
  pasos:
  - 'Paso 1: Plantea la fórmula: $a_8 = a_1 + (8 - 1) \cdot d \implies 42 = a_1 +
    7 \cdot 5$.'
  - 'Paso 2: Resolver el producto: $42 = a_1 + 35$.'
  - 'Paso 3: Despejar $a_1 = 42 - 35 = 7$.'
  - 'Conclusión: El primer término es $a_1 = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja el primer término a1 a partir de un término conocido
    ak y la diferencia d?
  choices:
  - text: 'Restando a ak el producto de (k - 1) por la diferencia: a1 = ak - (k -
      1) · d'
    is_correct: true
  - text: Sumando a1 = ak + k · d
    is_correct: false
  - text: Dividiendo a1 = ak / d
    is_correct: false
  - text: Multiplicando a1 = ak · k · d
    is_correct: false
  explanation: 'La alternativa correcta es ''Restando a ak el producto de (k - 1)
    por la diferencia: a1 = ak - (k - 1) · d''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a8 = 42 con d = 5, ¿cuál fue el primer término
    a1?
  choices:
  - text: '7'
    is_correct: true
  - text: '35'
    is_correct: false
  - text: '12'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '7'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el primer término $a_1
  = a_k - (k - 1) \cdot d$ retrocediendo desde un término conocido.
semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_PRIMER_TERMINO
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.CALCULO_PRIMER_TERMINO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
