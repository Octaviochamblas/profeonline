semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_PRIMER_TERMINO
resumen_inicial: 'Determinación del primer término a partir de un término conocido
  y la diferencia común: concepto y desarrollo dentro de Progresión aritmética.'
explicacion_simple: A veces entras al cine cuando la película ya empezó. Te muestran
  el final de la progresión y te piden descubrir cómo empezó. Para esto debemos usar
  nuestra fórmula maestra, pero caminando hacia atrás.
explicacion_formal: "El término general funciona como una ecuación. Si tienes 3 de\
  \ las 4 piezas del rompecabezas, puedes encontrar la faltante despejando la incógnita.\n\
  \nFórmula original: $a_n = a_1 + (n-1)d$\nSi queremos encontrar $a_1$, simplemente\
  \ pasamos todo el bloque de los pasos restando hacia el otro lado:\n**Fórmula despejada:**\
  \ $a_1 = a_n - (n-1)d$\n\nTraducción lógica: 'Al término donde estoy ahora, le RESTO\
  \ todos los pasos que di, y así regreso al inicio'.\n\nEjemplo: Sabemos que el término\
  \ 8 vale 40 ($a_8=40$) y que la sucesión avanza de 4 en 4 ($d=4$). ¿Cuál era el\
  \ primer número?\n- $a_1 = 40 - (8-1) \\cdot 4$\n- $a_1 = 40 - (7) \\cdot 4$\n-\
  \ $a_1 = 40 - 28 = 12$. \n¡La película empezó en el 12!"
definiciones_clave: '- **Determinación del primer término a partir de un término conocido
