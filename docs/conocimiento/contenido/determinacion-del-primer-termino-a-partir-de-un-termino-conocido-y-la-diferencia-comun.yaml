procedimiento:
- 'Paso 1: Identifica el valor del término conocido ($a_n$) y qué posición ocupa ($n$).'
- 'Paso 2: Identifica la diferencia ($d$).'
- 'Paso 3: Calcula cuántos pasos hay entre tu posición y el inicio (que es $n-1$).'
- 'Paso 4: Multiplica esos pasos por la diferencia y réstaselo a tu término conocido.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en determinación del primer término a partir de un término conocido y la diferencia común.
ejemplos:
- titulo: Buscando las raíces
  enunciado: El décimo término de una P.A. es 5 y la diferencia es -2. ¿Cuánto vale el primer
    término?
  solucion_pasos:
  - 'Datos: a10=5, n=10, d=-2.'
  - 'Fórmula: a1 = a10 - (10-1)*d'
  - a1 = 5 - (9) * (-2)
  - a1 = 5 - (-18)
  - a1 = 5 + 18 = 23.
- titulo: Ejemplo 1
  enunciado: El término 4 de una progresión aritmética es 20 y d es 4. ¿Cuánto vale a_1?
  alternativas:
  - '8'
  - '12'
  - '16'
  respuesta: '8'
  solucion_pasos:
  - 20 menos (4 menos 1) por 4 es igual a 20 menos 12, o sea 8.
- titulo: Ejemplo 2
  enunciado: El término 5 es -3 y d es -2. ¿Cuánto vale a_1?
  alternativas:
  - '5'
  - '-11'
  - '1'
  respuesta: '5'
  solucion_pasos:
  - -3 menos (5 menos 1) por (-2) es igual a -3 más 8, o sea 5.
- titulo: ¿Se necesita conocer d para calcular a_1 a partir de otro término?
  respuesta: Sí
  solucion_pasos:
  - Sin d no se puede calcular cuántas veces hay que retroceder desde el término conocido.
- titulo: ¿El primer término siempre es menor que los demás términos?
  respuesta: 'No'
  solucion_pasos:
  - Solo si la progresión es creciente; si es decreciente, a_1 es el mayor de todos los términos.
errores_frecuentes:
- Equivocarse en la regla de los signos al restar un bloque que contiene una diferencia negativa,
  como en $40 - (7 \cdot -4)$.
- Sustituir los datos de '$a_n$' y '$n$' al revés en la ecuación.
- Olvidar cambiar el signo al despejar a_1, dejando una suma en vez de una resta.
- Confundir el término conocido con el primer término al plantear la ecuación.
- Restar (n menos 1) sin multiplicarlo antes por d.
afirmaciones_verdaderas:
- La formulación de determinación del primer término a partir de un término conocido y la
  diferencia común mantiene la regularidad de la sucesión.
- La fórmula del término general se puede despejar para encontrar a_1 cuando se conoce cualquier
  otro término y la diferencia.
al_terminar_debes_poder: Resolver problemas prácticos utilizando determinación del primer
