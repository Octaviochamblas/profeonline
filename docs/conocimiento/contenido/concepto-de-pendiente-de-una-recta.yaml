semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_CONCEPTO
resumen_inicial: La pendiente de una recta es la razón constante entre la variación vertical y la variación horizontal entre dos puntos cualesquiera de ella.
explicacion_simple: '![La pendiente de una recta es la razón constante entre la variación vertical y la variación horizontal entre dos puntos cualesquiera de ella](/static/img/nodos/concepto-de-pendiente-de-una-recta-intro.svg)



  La **pendiente** (que se anota con la letra $m$) mide qué tan inclinada está una recta y en qué dirección se mueve:

  $$m = \frac{\text{cuánto sube o baja (eje Y)}}{\text{cuánto avanza a la derecha (eje X)}} = \frac{\Delta y}{\Delta x}$$


  - Si la recta sube al avanzar a la derecha $\implies m > 0$ (positiva).

  - Si la recta baja al avanzar a la derecha $\implies m < 0$ (negativa).

  - Si la recta es totalmente plana $\implies m = 0$ (nula).'
explicacion_formal: 'Dada una recta no vertical en el plano afín $\mathbb{R}^2$, su **pendiente** $m$ es la constante de proporcionalidad diferencial:

  $$m = \frac{\Delta y}{\Delta x} = \frac{y_2 - y_1}{x_2 - x_1}, \quad \forall P_1(x_1, y_1), P_2(x_2, y_2) \in \mathcal{L} \ (x_1 \neq x_2)$$


  **Propiedades fundamentales:**

  - **Invarianza**: El valor de $m$ es independiente del par de puntos elegidos sobre la recta (por semejanza de triángulos rectángulos de pendiente).

  - **Interpretación como razón de cambio**: $m$ representa la tasa instantánea y constante de cambio de la variable dependiente por unidad de variable independiente.'
definiciones_clave: '- **Pendiente ($m$)**: Razón de cambio geométrica y algebraica de una recta en el plano cartesiano.

  - **Variación diferencial**: $\Delta y = y_2 - y_1$ (desplazamiento vertical) y $\Delta x = x_2 - x_1$ (desplazamiento horizontal).'
propiedades_relaciones: '- **Triángulos de pendiente**: Todos los triángulos rectángulos formados con catetos paralelos a los ejes sobre la misma recta son semejantes.

  - **Unidades de razón**: En problemas aplicados, las unidades de $m$ son $\frac{\text{unidad de } y}{\text{unidad de } x}$ (ej: $\text{km/h}$, $\text{\$/kg}$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La pendiente de una recta es la razón constante entre la variación vertical y la variación horizontal entre dos puntos cualesquiera de ella](/static/img/nodos/concepto-de-pendiente-de-una-recta-ejemplos.svg)



    Si una rampa sube $1.5\text{ m}$ por cada $6\text{ m}$ de avance horizontal, calcula su pendiente y simplifícala a fracción irreductible.'
  pasos:
  - 'Paso 1: Identificar la variación vertical: $\Delta y = 1.5\text{ m}$.'
  - 'Paso 2: Identificar la variación horizontal: $\Delta x = 6\text{ m}$.'
  - 'Paso 3: Plantear el cociente de pendiente: $m = \frac{\Delta y}{\Delta x} = \frac{1.5}{6}$.'
  - 'Paso 4: Multiplicar por 10 para eliminar decimales: $\frac{15}{60}$.'
  - 'Paso 5: Simplificar por 15: $m = \frac{1}{4} = 0.25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula correcta para calcular la pendiente $m$ a partir de las variaciones de los ejes?
  choices:
  - text: m = Delta y / Delta x
    is_correct: true
  - text: m = Delta x / Delta y
    is_correct: false
  - text: m = Delta y * Delta x
    is_correct: false
  - text: m = Delta y + Delta x
    is_correct: false
  explanation: La alternativa correcta es 'm = Delta y / Delta x'. La pendiente es el cociente de la variación vertical sobre la variación horizontal.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una recta avanza 4 unidades en X y baja 8 unidades en Y, ¿cuál es su pendiente?
  choices:
  - text: '-2'
    is_correct: true
  - text: '2'
    is_correct: false
  - text: -1/2
    is_correct: false
  - text: '-4'
    is_correct: false
  explanation: La alternativa correcta es '-2'. $m = \frac{\Delta y}{\Delta x} = \frac{-8}{4} = -2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el cambio en el eje vertical $\Delta y = y_2 - y_1$.'
- 'Paso 2: Identificar el cambio en el eje horizontal $\Delta x = x_2 - x_1$.'
- 'Paso 3: Formar la fracción $m = \frac{\Delta y}{\Delta x}$.'
- 'Paso 4: Simplificar el resultado numérico respetando estrictamente los signos.'
errores_correccion: '- **Error común:** Invertir la fracción colocando $\Delta x$ en el numerador (arriba) y $\Delta y$ en el denominador (abajo).

  - **Cómo corregirlo:** La regla mnemotécnica es **''Y arriba, X abajo''** ($m = \frac{y}{x}$).'
ejemplos:
- titulo: 'Ejemplo 1: Razón de cambio directa'
  enunciado: Si $\Delta y = 12$ y $\Delta x = 3$, ¿cuál es la pendiente?
  alternativas:
  - '4'
  - 1/4
  - '36'
  - '9'
  respuesta: '4'
  solucion_pasos:
  - 'Paso 1: $m = \frac{12}{3} = 4$.'
- titulo: 'Ejemplo 2: Pendiente fraccionaria'
  enunciado: Una recta sube 2 unidades por cada 5 unidades que avanza a la derecha. ¿Cuál es su pendiente?
  alternativas:
  - 2/5
  - 5/2
  - '10'
  - 3/5
  respuesta: 2/5
  solucion_pasos:
  - 'Paso 1: $\Delta y = 2$, $\Delta x = 5 \implies m = \frac{2}{5}$.'
- titulo: 'Ejemplo 3: Razón negativa'
  enunciado: Si $\Delta y = -9$ y $\Delta x = 3$, ¿cuál es la pendiente?
  alternativas:
  - '-3'
  - '3'
  - -1/3
  - '-12'
  respuesta: '-3'
  solucion_pasos:
  - 'Paso 1: $m = \frac{-9}{3} = -3$.'
- titulo: 'Ejemplo 4: Variación nula'
  enunciado: Si $\Delta y = 0$ y $\Delta x = 7$, ¿cuánto vale la pendiente?
  alternativas:
  - '0'
  - '7'
  - Indefinida
  - 1/7
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $m = \frac{0}{7} = 0$.'
errores_frecuentes:
- Invertir el cociente calculando Delta x / Delta y.
- Olvidar el signo negativo cuando la recta desciende.
- Dividir por cero en rectas verticales (pendiente indefinida).
afirmaciones_verdaderas:
- La pendiente es el cociente constante entre el desplazamiento vertical y el desplazamiento horizontal.
- El valor de la pendiente es independiente de los dos puntos específicos seleccionados sobre la recta.
al_terminar_debes_poder: '**QUÉ:** Comprender, definir y calcular el concepto formal de pendiente de una recta.


  **CÓMO:** Determinando la razón de cambio entre variaciones verticales y horizontales m = Δy / Δx.


  ![Resumen La pendiente de una recta es la razón constante entre la variación vertical y la variación horizontal entre dos puntos cualesquiera de ella](/static/img/nodos/concepto-de-pendiente-de-una-recta-resumen.svg)'
