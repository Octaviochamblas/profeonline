errores_frecuentes:
  - 'La pendiente de una recta es la distancia fija desde el origen hasta el punto de corte con el eje $X$.'
  - 'Una recta horizontal paralela al eje $X$ tiene pendiente indefinida o infinita.'
  - 'La pendiente representa el grado de curvatura de una gráfica en el plano cartesiano.'
  - 'Una recta vertical paralela al eje $Y$ posee pendiente nula igual a $m = 0$.'
  - 'El valor de la pendiente de una recta cambia al seleccionar dos puntos distintos sobre la misma recta.'
afirmaciones_verdaderas:
  - 'La pendiente $m$ de una recta representa la razón entre la variación vertical ($\Delta y$) y la variación horizontal ($\Delta x$).'
  - 'La pendiente mide la inclinación y la tasa constante de cambio de la variable dependiente con respecto a la independiente.'
al_terminar_debes_poder: |
  QUÉ: Definir y caracterizar el concepto de pendiente de una recta.
  CÓMO: Interpretar la pendiente como la tasa de variación $\frac{\Delta y}{\Delta x}$ y relacionarla con la inclinación geométrica de la recta.
