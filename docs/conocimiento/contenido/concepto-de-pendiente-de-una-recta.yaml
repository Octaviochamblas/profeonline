semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_CONCEPTO
resumen_inicial: El concepto de pendiente mide la tasa de variación constante y el grado de inclinación de una recta en el plano cartesiano.
explicacion_simple: |
  La **pendiente** de una recta te dice qué tan empinada está la línea:

  - Si sube hacia la derecha, la pendiente es **positiva** ($m > 0$).
  - Si baja hacia la derecha, la pendiente es **negativa** ($m < 0$).
  - Si es completamente plana (horizontal), la pendiente es **cero** ($m = 0$).
  - Si es totalmente vertical, la pendiente **no existe** (es indefinida).
explicacion_formal: |
  La **pendiente** $m$ de una recta no vertical se define analíticamente como la constante de cambio entre la variable dependiente $y$ e independiente $x$:

  $$m = \frac{\Delta y}{\Delta x} = \tan(\alpha)$$

  donde $\alpha \in [0^\circ, 180^\circ[\ \setminus \{90^\circ\}$ representa el ángulo de inclinación formado por la recta con el semi-eje positivo $X$.

  **Propiedades fundamentales:**
  - $m > 0 \iff 0^\circ < \alpha < 90^\circ$ (Recta creciente).
  - $m < 0 \iff 90^\circ < \alpha < 180^\circ$ (Recta decreciente).
  - $m = 0 \iff \alpha = 0^\circ$ (Recta horizontal).
definiciones_clave: |
  - **Pendiente ($m$)**: Magnitud escalar que cuantifica la dirección y la inclinación de una recta.
propiedades_relaciones: |
  - **Constancia de la pendiente**: Toda recta posee una única pendiente fija en toda su extensión a diferencia de las curvas.
ejemplo_guiado:
  enunciado: "Una rampa sube $3$ metros de altura por cada $6$ metros de avance horizontal. Calcula e interpreta la pendiente de la rampa."
  pasos:
    - 'Paso 1: Identificar la variación vertical: $\Delta y = +3$ metros.'
    - 'Paso 2: Identificar la variación horizontal: $\Delta x = +6$ metros.'
    - 'Paso 3: Calcular la pendiente: $m = \frac{\Delta y}{\Delta x} = \frac{3}{6} = \frac{1}{2} = 0{,}5$.'
    - 'Paso 4: Concluir que por cada metro que avanza horizontalmente, la rampa sube $0{,}5$ metros.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Si una recta avanza 6 metros horizontalmente y sube 3 metros verticalmente, ¿cuál es su pendiente?"
    choices:
      - {text: "$m = 1/2$", is_correct: true}
      - {text: "$m = 2$", is_correct: false}
      - {text: "$m = 3$", is_correct: false}
      - {text: "$m = 18$", is_correct: false}
    explanation: "La alternativa correcta es '$m = 1/2$'. $m = \\frac{\\Delta y}{\\Delta x} = \\frac{3}{6} = \\frac{1}{2}$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué ocurre con la inclinación de una recta cuando el valor absoluto de su pendiente $|m|$ aumenta?"
    choices:
      - {text: "La recta se vuelve más empinada (más cercana a la vertical)", is_correct: true}
      - {text: "La recta se vuelve más plana (más cercana a la horizontal)", is_correct: false}
      - {text: "La recta se transforma en un círculo", is_correct: false}
      - {text: "La pendiente se vuelve nula", is_correct: false}
    explanation: "La alternativa correcta es 'La recta se vuelve más empinada (más cercana a la vertical)'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Determinar el cambio en la coordenada $y$ ($\Delta y$).'
  - 'Paso 2: Determinar el cambio en la coordenada $x$ ($\Delta x$).'
  - 'Paso 3: Formar la fracción $m = \frac{\Delta y}{\Delta x}$.'
  - 'Paso 4: Clasificar la pendiente según su signo (positiva, negativa o nula).'
errores_correccion: |
  - **Error común:** Pensar que una recta vertical tiene pendiente igual a cero.
  - **Cómo corregirlo:** La pendiente nula ($m = 0$) es para rectas HORIZONTALES. Las rectas VERTICALES tienen pendiente INDEFINIDA porque dividen por $\Delta x = 0$.
