semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_CONCEPTO
resumen_inicial: La pendiente $m$ de una recta mide la razón de cambio vertical (variación
  en $y$) dividida por la variación horizontal (variación en $x$).
explicacion_simple: 'La **pendiente** $m$ nos dice qué tan empinada o inclinada es
  una recta.

  Se calcula dividiendo la diferencia de alturas $(\Delta y)$ entre la distancia horizontal
  $(\Delta x)$:


  $$m = \frac{\text{Variación en } y}{\text{Variación en } x} = \frac{y_2 - y_1}{x_2
  - x_1}$$


  - Si caminas 1 unidad a la derecha en el eje $X$, la pendiente $m$ indica cuántas
  unidades subes o bajas en el eje $Y$.'
explicacion_formal: 'Para dos puntos distintos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ con
  $x_1 \neq x_2$, la **pendiente $m$** es el cociente incremental:


  $$m = \frac{\Delta y}{\Delta x} = \frac{y_2 - y_1}{x_2 - x_1}$$


  **Desglose de la fórmula:**

  - $\Delta y = y_2 - y_1$: Cambio vertical (elevación o descenso).

  - $\Delta x = x_2 - x_1 \neq 0$: Cambio horizontal (avance a la derecha).'
definiciones_clave: '- **Pendiente ($m$)**: Razón constante de variación entre el
  cambio en la variable dependiente $y$ y la independiente $x$.

  - **Cociente incremental**: Cociente entre las diferencias de las coordenadas $\frac{\Delta
  y}{\Delta x}$.'
propiedades_relaciones: '- **Constancia en rectas**: La pendiente es exactamente la
  misma elegida entre cualquier par de puntos de la recta.'
ejemplo_guiado:
  enunciado: Calcula la pendiente de la recta que pasa por los puntos $P_1(1, 3)$
    y $P_2(4, 9)$ e interpreta su significado.
  pasos:
  - 'Paso 1: Identificar las coordenadas: $x_1 = 1, y_1 = 3, x_2 = 4, y_2 = 9$.Paso
    2: Calcular $\Delta y = 9 - 3 = 6$.Paso 3: Calcular $\Delta x = 4 - 1 = 3$.Paso
    4: Aplicar la fórmula: $m = \frac{6}{3} = 2$.Paso 5: Interpretar: por cada 1 unidad
    que avanza en $X$, la recta sube 2 unidades en $Y$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la fórmula de la pendiente a los puntos $(1, 3)$ y $(4, 9)$,
    ¿cuál es el valor de $m$?
  choices:
  - text: $m = 2$
    is_correct: true
  - text: $m = 3$
    is_correct: false
  - text: $m = \frac{1}{2}$
    is_correct: false
  - text: $m = 6$
    is_correct: false
  explanation: La alternativa correcta es '$m = 2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa en la práctica una pendiente de valor $m = 2$?
  choices:
  - text: Que la recta sube 2 unidades en el eje Y por cada 1 unidad que avanza a
      la derecha en X.
    is_correct: true
  - text: Que la recta es horizontal.
    is_correct: false
  - text: Que la recta pasa por el punto (2,2).
    is_correct: false
  - text: Que la recta baja 2 unidades.
    is_correct: false
  explanation: La alternativa correcta es 'Que la recta sube 2 unidades en el eje
    Y por cada 1 unidad que avanza a la derecha en X.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las coordenadas $(x_1, y_1)$ y $(x_2, y_2)$ de los dos puntos.'
- 'Paso 2: Restar las ordenadas en el numerador: $y_2 - y_1$.'
- 'Paso 3: Restar las abscisas en el denominador manteniendo el mismo orden: $x_2
  - x_1$.'
- 'Paso 4: Dividir o simplificar la fracción resultante.'
errores_correccion: '- **Error común:** Invertir la fórmula y calcular $\frac{\Delta
  x}{\Delta y}$ en lugar de $\frac{\Delta y}{\Delta x}$.

  - **Cómo corregirlo:** La pendiente es SIEMPRE la variación de la $Y$ en el numerador
  dividida por la variación de la $X$ en el denominador.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
