semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_CONCEPTO
resumen_inicial: 'Concepto de pendiente de una recta: conceptos, representación y
  propiedades en Función constante y función lineal.'
explicacion_simple: La pendiente responde a una sola pregunta clave, por cada paso
  que avanzas hacia la derecha, ¿cuánto sube o baja la recta?
explicacion_formal: '### Definición formal


  Para una recta no vertical, la pendiente $m$ se define como el cociente entre el
  cambio en $y$ y el cambio en $x$ entre dos puntos cualesquiera de la recta: $m =
  \dfrac{\Delta y}{\Delta x} = \dfrac{y_2 - y_1}{x_2 - x_1}$, con $x_1 \neq x_2$.
  Este valor es constante para todos los pares de puntos de una misma recta.


  ### Desarrollo didáctico


  La pendiente es una "tasa de cambio": cuánto sube o baja $y$ por cada unidad que
  avanza $x$.


  Si $m=3$, cada vez que $x$ aumenta en 1, $y$ aumenta en 3. Si $m=-2$, cada vez que
  $x$ aumenta en 1, $y$ disminuye en 2. La pendiente resume en un solo número todo
  el comportamiento de crecimiento o decrecimiento de la recta.'
definiciones_clave: '- **Concepto de pendiente de una recta**: Elemento central en
  el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a concepto de pendiente de una recta.'
