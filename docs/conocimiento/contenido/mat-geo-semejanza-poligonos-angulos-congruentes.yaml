semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.POLIGONOS_ANGULOS_CONGRUENTES
resumen_inicial: 'Congruencia de ángulos correspondientes en polígonos semejantes:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: 'Una de las dos condiciones que definen la semejanza de polígonos
  merece atención especial: la igualdad exacta de todos los ángulos correspondientes.'
explicacion_formal: '![Ángulos congruentes en polígonos semejantes](/static/img/geometria/congruencia-semejanza/semejanza-poligonos-angulos-congruentes.svg)


  ### Definición formal


  Si los polígonos $P_1P_2...P_n$ y $P_1''P_2''...P_n''$ son semejantes, entonces
  $\angle P_i=\angle P_i''$ para cada $i$ de 1 a $n$.


  ### Desarrollo didáctico


  Esta igualdad de ángulos es la que garantiza que la "forma" se mantenga: si cambiaran
  los ángulos, la figura se distorsionaría y ya no sería una simple ampliación o reducción
  de la original.'
definiciones_clave: '- **Congruencia de ángulos correspondientes en polígonos semejantes**:
  Elemento o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a congruencia de ángulos correspondientes en
  polígonos semejantes.'
ejemplo_guiado:
  enunciado: Para analizar congruencia de ángulos correspondientes en polígonos semejantes,
    considera un ángulo $\alpha = 18^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1281^\circ = 18^\circ$.
  pasos:
  - Identificar la propiedad de congruencia de ángulos correspondientes en polígonos
    semejantes referida a $\alpha = 18^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1281 = 18 \implies x = 18 - 1281$.'
  - Concluir que la medida calculada para congruencia de ángulos correspondientes
    en polígonos semejantes es $x = -1263^\circ$.
