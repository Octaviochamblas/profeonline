semantic_id: MAT.GEO.TRIANGULOS_DEF.ANGULO_EXTERIOR_ADYACENTE
resumen_inicial: Un ángulo exterior y su correspondiente ángulo interior adyacente
  son suplementarios (suman 180°), cumpliéndose además que el ángulo exterior equivale
  a la suma de los dos ángulos interiores no adyacentes.
explicacion_simple: '![Relación Exterior e Interior Adyacente](/static/img/nodos/relacion-entre-angulo-exterior-y-angulo-interior-adyacente-intro.svg)


  En cualquier esquina del triángulo, el ángulo de adentro y el ángulo de afuera forman
  una línea recta completa, por lo que **suman $180^\circ$** ($\alpha + \alpha'' =
  180^\circ$). Además ocurre una propiedad mágica: el ángulo de afuera mide exactamente
  lo mismo que la suma de los otros dos ángulos de adentro ($\alpha'' = \beta + \gamma$).'
explicacion_formal: '### Teorema formal

  En cada vértice de un triángulo, el ángulo interior y su ángulo exterior adyacente
  forman un par lineal continuo sobre la recta soporte del lado, siendo estrictamente
  **suplementarios**:


  $$\alpha + \alpha'' = 180^\circ \iff \alpha'' = 180^\circ - \alpha \quad \land \quad
  \alpha = 180^\circ - \alpha''$$


  ### Desglose simbólico y geométrico

  - $\alpha$: Ángulo interior en el vértice analizado.

  - $\alpha''$: Ángulo exterior formado con la prolongación del lado.

  - Recta soporte colineal: Comparten un lado y sus otros dos lados son rayos opuestos
  sobre la misma recta soporte.


  ### Síntesis didáctica

  La relación de suplementariedad en cada vértice permite transformar instantáneamente
  datos angulares interiores en exteriores y viceversa.'
definiciones_clave: '- **Par lineal adyacente**: Dos ángulos contiguos sobre una misma
  recta que suman $180^\circ$.

  - **Ángulos interiores no adyacentes**: Los dos ángulos interiores ubicados en los
  vértices opuestos al ángulo exterior analizado.

  - **Teorema del ángulo exterior**: $\alpha'' = \beta + \gamma$. '
propiedades_relaciones: '- **Demostración algebraica**: Como $\alpha + \beta + \gamma
  = 180^\circ$ y $\alpha + \alpha'' = 180^\circ$, igualando ambas expresiones: $\alpha
  + \alpha'' = \alpha + \beta + \gamma \implies \alpha'' = \beta + \gamma$.

  - **Desigualdad del ángulo exterior**: Todo ángulo exterior es estrictamente mayor
  que cualquiera de los dos interiores no adyacentes ($\alpha'' > \beta$ y $\alpha''
  > \gamma$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Relación Angular](/static/img/nodos/relacion-entre-angulo-exterior-y-angulo-interior-adyacente-ejemplos.svg)


    En el triángulo $\triangle ABC$, los ángulos interiores en $B$ y $C$ miden $\beta
    = 55^\circ$ y $\gamma = 65^\circ$. Calcula la medida del ángulo exterior $\alpha''$
    en el vértice $A$ usando los dos métodos.'
  pasos:
  - 'Paso 1: Método 1 (Teorema del ángulo exterior): Sumar los dos interiores no adyacentes:
    $\alpha'' = \beta + \gamma = 55^\circ + 65^\circ = 120^\circ$.'
  - 'Paso 2: Método 2 (Por suplemento del ángulo interior $\alpha$): Calcular primero
    $\alpha = 180^\circ - (55^\circ + 65^\circ) = 180^\circ - 120^\circ = 60^\circ$.'
  - 'Paso 3: Calcular el suplemento: $\alpha'' = 180^\circ - 60^\circ = 120^\circ$.'
  - 'Paso 4: Comprobar que ambos métodos dan el mismo resultado exacto: $\alpha''
    = 120^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual la medida de un ángulo exterior de un triángulo según
    el teorema fundamental?
  choices:
  - text: A la suma de los dos ángulos interiores no adyacentes a él
    is_correct: true
  - text: Al doble del ángulo interior adyacente
    is_correct: false
  - text: A la resta de los ángulos interiores
    is_correct: false
  - text: Siempre a 90°
    is_correct: false
  explanation: Por el teorema del ángulo exterior, su medida es igual a la suma de
    los dos ángulos interiores no adyacentes a él.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los ángulos interiores en B y C son 40° y 80°, ¿cuánto mide el ángulo
    exterior en A?
  choices:
  - text: 120° (porque 40° + 80° = 120°)
    is_correct: true
  - text: 60°
    is_correct: false
  - text: 140°
    is_correct: false
  - text: 100°
    is_correct: false
  explanation: Sumando los dos no adyacentes se obtiene 120° (porque 40° + 80° = 120°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el vértice del ángulo exterior buscado.'
- 'Paso 2: Si se conoce el interior adyacente, calcular $\alpha'' = 180^\circ - \alpha$.'
- 'Paso 3: Si se conocen los dos interiores opuestos, sumar directamente $\alpha''
  = \beta + \gamma$.'
- 'Paso 4: Verificar la coherencia comprobando que $\alpha + \alpha'' = 180^\circ$.'
errores_correccion: Recuerda que el ángulo exterior es igual a la suma de los otros
  dos interiores (no adyacentes), no del adyacente.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el ángulo exterior en un vértice mide $130^\circ$, ¿cuánto mide su
    ángulo interior adyacente?
  alternativas:
  - $50^\circ$
  - $130^\circ$
  - $60^\circ$
  respuesta: $50^\circ$
  solucion_pasos:
  - $\alpha = 180^\circ - 130^\circ = 50^\circ$.
- titulo: Ejemplo 2
  enunciado: En un triángulo, dos ángulos interiores miden $30^\circ$ y $70^\circ$.
    ¿Cuánto mide el ángulo exterior no adyacente a ellos?
  alternativas:
  - $100^\circ$
  - $80^\circ$
  - $110^\circ$
  respuesta: $100^\circ$
  solucion_pasos:
  - $\text{Ángulo exterior} = 30^\circ + 70^\circ = 100^\circ$.
- titulo: ¿Un ángulo interior y su exterior adyacente forman un par lineal que suma
    180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, están sobre la misma recta prolongada y son suplementarios.
- titulo: ¿Un ángulo exterior es igual a la resta de los dos interiores no adyacentes?
  respuesta: 'No'
  solucion_pasos:
  - No, es estrictamente igual a la SUMA de los dos interiores no adyacentes ($\alpha'
    = \beta + \gamma$).
errores_frecuentes:
- Restar los ángulos interiores no adyacentes en lugar de sumarlos.
- Confundir suplemento (180°) con complemento (90°).
- Sumar el ángulo interior adyacente en lugar de los no adyacentes.
- Olvidar que todo ángulo exterior es mayor que cualquiera de los dos interiores no
  adyacentes.
- Equivocarse en la resta de 180°.
afirmaciones_verdaderas:
- El ángulo exterior y su interior adyacente siempre suman $180^\circ$.
- La medida de un ángulo exterior es igual a la suma de los dos interiores no adyacentes.
al_terminar_debes_poder: '**QUÉ:** Aplicar la suplementariedad del par lineal y el
  teorema del ángulo exterior en triángulos.


  **CÓMO:** Calculando ángulos mediante las relaciones $\alpha + \alpha'' = 180^\circ$
  y $\alpha'' = \beta + \gamma$.


  ![Resumen de Relación de Ángulo Exterior](/static/img/nodos/relacion-entre-angulo-exterior-y-angulo-interior-adyacente-resumen.svg)'
