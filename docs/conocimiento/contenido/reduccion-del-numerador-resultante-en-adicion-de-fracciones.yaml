semantic_id: MAT.ALG.FRACCIONES_SUMA.REDUCCION_NUMERADOR
resumen_inicial: Tras sumar los numeradores amplificados, se deben expandir sus paréntesis
  y reducir todos los términos semejantes.
explicacion_simple: 'Una vez que hemos colocado todos los numeradores amplificados
  sobre la barra del denominador común, el trabajo en el numerador no ha terminado.

  Debemos aplicar la propiedad distributiva para eliminar los paréntesis y luego agrupar
  y sumar los términos semejantes (las $x^2$ con las $x^2$, las $x$ con las $x$ y
  los números con los números).

  Esto nos permite obtener un único polinomio ordenado en el numerador.'
explicacion_formal: 'Dada la expresión suma sobre el denominador común $M(x)$:


  $$N_{\text{total}}(x) = \sum_{i=1}^k N_i(x) \cdot C_i(x) \implies \text{Expandir
  y reducir} \implies N_{\text{reducido}}(x)$$


  $$\frac{N_{\text{total}}(x)}{M(x)} = \frac{a_n x^n + a_{n-1} x^{n-1} + \dots + a_0}{M(x)}$$


  **Desglose de la fórmula:**

  - $N_i(x) \cdot C_i(x)$: Productos individuales de numeradores por sus factores
  de amplificación.

  - $N_{\text{reducido}}(x)$: Polinomio canónico en forma estándar ordenado en potencias
  decrecientes tras reducir términos semejantes.'
definiciones_clave: '- **Reducción de términos semejantes**: Agrupación de términos
  algebraicos con la misma parte literal en el numerador.

  - **Polinomio numerador canónico**: Expresión final simplificada del numerador ordenada
  por grado.'
propiedades_relaciones: '- **Conservación del denominador**: Durante todo el proceso
  de expansión y reducción del numerador, el denominador común se mantiene intacto.

  - **Preparación para simplificar**: Un numerador reducido permite aplicar posteriormente
  técnicas de factorización final.'
ejemplo_guiado:
  enunciado: Suma y reduce completamente el numerador de $\frac{x(x + 4)}{x - 1} +
    \frac{3x - 2}{x - 1}$, y evalúa la suma para $x = 2$.
  pasos:
  - 'Paso 1: Como tienen igual denominador $(x - 1)$, escribir los numeradores sumados:
    $\frac{x(x + 4) + (3x - 2)}{x - 1}$.Paso 2: Expandir el producto del numerador:
    $x^2 + 4x + 3x - 2$.Paso 3: Reducir los términos semejantes en $x$: $4x + 3x =
    7x$, dando el numerador reducido $x^2 + 7x - 2$.Paso 4: Escribir la fracción final:
    $\frac{x^2 + 7x - 2}{x - 1}$ para $x \neq 1$.Paso 5: Evaluar para $x = 2$: $\frac{2^2
    + 7(2) - 2}{2 - 1} = \frac{4 + 14 - 2}{1} = 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al expandir y reducir los numeradores de $\frac{x(x + 4)}{x - 1} + \frac{3x
    - 2}{x - 1}$, ¿cuál es la expresión resultante?
  choices:
  - text: $\frac{x^2 + 7x - 2}{x - 1}$
    is_correct: true
  - text: $\frac{x^2 + 4x - 2}{x - 1}$
    is_correct: false
  - text: $\frac{x^2 + 7x + 2}{x - 1}$
    is_correct: false
  - text: $\frac{4x - 2}{x - 1}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{x^2 + 7x - 2}{x - 1}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la expresión reducida $\frac{x^2 + 7x - 2}{x - 1}$ para $x
    = 2$, ¿cuál es el valor obtenido?
  choices:
  - text: $16$
    is_correct: true
  - text: $14$
    is_correct: false
  - text: $18$
    is_correct: false
  - text: $8$
    is_correct: false
  explanation: La alternativa correcta es '$16$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la suma de los productos del numerador sobre la barra del denominador
  común.'
- 'Paso 2: Aplicar la propiedad distributiva para eliminar los paréntesis del numerador.'
- 'Paso 3: Identificar y agrupar los términos semejantes según el exponente de la
  variable.'
- 'Paso 4: Sumar o restar los coeficientes de los términos semejantes.'
- 'Paso 5: Escribir el polinomio resultante ordenado en forma decreciente.'
errores_correccion: '- **Error común:** Dejar paréntesis sin expandir en el numerador
  impidiendo la reducción de términos semejantes.

  - **Cómo corregirlo:** Distribuye y multiplica completamente los numeradores para
  poder agrupar todas las $x$ y constantes en un solo polinomio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de adición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de adición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se conserva el denominador común al sumar?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla fundamental de la adición racional.
- titulo: ¿Se pueden sumar los denominadores entre sí?
  respuesta: 'No'
  solucion_pasos:
  - No, jamás se suman los denominadores.
errores_frecuentes:
- Sumar denominadores al realizar la adición de fracciones algebraicas.
- Sumar numeradores de fracciones con distinto denominador sin homogeneizar.
- Olvidar multiplicar el numerador por el factor de amplificación correspondiente.
- Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos
  semejantes.
- No verificar si el numerador final se puede factorizar para simplificar con el denominador.
afirmaciones_verdaderas:
- Para sumar fracciones algebraicas de igual denominador se suman los numeradores
  y se conserva el denominador común.
- El uso del m.c.m. como denominador común minimiza el grado de los numeradores amplificados.
al_terminar_debes_poder: Al finalizar este recurso podrás realizar la adición de fracciones
  algebraicas de igual y distinto denominador expresando el resultado en su forma
  simplificada.
