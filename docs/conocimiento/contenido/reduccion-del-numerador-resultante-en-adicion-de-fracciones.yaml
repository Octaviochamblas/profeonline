semantic_id: MAT.ALG.FRACCIONES_SUMA.REDUCCION_NUMERADOR
resumen_inicial: Tras sumar los numeradores amplificados, se deben expandir sus paréntesis y reducir todos los términos semejantes.
explicacion_simple: 'Una vez colocados todos los numeradores amplificados sobre la barra del denominador común, el procedimiento
  en el numerador continúa.


  Aplicamos la propiedad distributiva para eliminar los paréntesis y luego agrupamos y sumamos los términos semejantes (las
  $x^2$ con $x^2$, las $x$ con $x$ y los números constantes).


  Esto nos permite consolidar un único polinomio ordenado en el numerador para preparar la simplificación final.


  ![Reducción del numerador en adición de fracciones](/static/img/nodos/reduccion-del-numerador-resultante-en-adicion-de-fracciones-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la expresión suma sobre el denominador común $M(x)$:


  $$N_{\text{total}}(x) = \sum_{i=1}^k N_i(x) \cdot C_i(x) \implies \text{Expandir y reducir} \implies N_{\text{reducido}}(x)$$


  $$\frac{N_{\text{total}}(x)}{M(x)} = \frac{a_n x^n + a_{n-1} x^{n-1} + \dots + a_0}{M(x)}$$


  ### Desglose de la fórmula

  - $N_i(x) \cdot C_i(x)$: Productos individuales de numeradores por sus factores de amplificación.

  - $N_{\text{reducido}}(x)$: Polinomio canónico en forma estándar ordenado en potencias decrecientes tras reducir términos
  semejantes.


  ### Síntesis didáctica

  Reducir el numerador exige multiplicar factores para deshacer paréntesis y sumar coeficientes de términos de igual grado.

  '
definiciones_clave: '- **Reducción de términos semejantes**: Agrupación de términos algebraicos con la misma parte literal
  en el numerador.

  - **Polinomio numerador canónico**: Expresión final simplificada del numerador ordenada por grado.

  '
propiedades_relaciones: '- **Conservación del denominador**: Durante todo el proceso de expansión y reducción del numerador,
  el denominador común se mantiene intacto.

  - **Preparación para simplificar**: Un numerador reducido permite aplicar posteriormente técnicas de factorización final.

  '
ejemplo_guiado:
  enunciado: Suma y reduce completamente el numerador de $\frac{x(x + 4)}{x - 1} + \frac{3x - 2}{x - 1}$, y evalúa la suma
    para $x = 2$.
  pasos:
  - 'Paso 1: Como tienen igual denominador $(x - 1)$, escribir los numeradores sumados: $\frac{x(x + 4) + (3x - 2)}{x - 1}$.'
  - 'Paso 2: Expandir el producto del numerador: $x^2 + 4x + 3x - 2$.'
  - 'Paso 3: Reducir los términos semejantes en $x$: $4x + 3x = 7x$, dando el numerador reducido $x^2 + 7x - 2$.'
  - 'Paso 4: Escribir la fracción final: $\frac{x^2 + 7x - 2}{x - 1}$ para $x \neq 1$.'
  - 'Paso 5: Evaluar para $x = 2$: $\frac{2^2 + 7(2) - 2}{2 - 1} = \frac{4 + 14 - 2}{1} = 16$.'
  imagen: /static/img/nodos/reduccion-del-numerador-resultante-en-adicion-de-fracciones-ejemplos.svg
