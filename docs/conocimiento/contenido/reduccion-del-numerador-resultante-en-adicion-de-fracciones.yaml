procedimiento:
- 'Paso 1: Escribir la suma de los productos del numerador sobre la barra del denominador común.'
- 'Paso 2: Aplicar la propiedad distributiva para eliminar los paréntesis del numerador.'
- 'Paso 3: Identificar y agrupar los términos semejantes según el exponente de la variable.'
- 'Paso 4: Sumar o restar los coeficientes de los términos semejantes.'
- 'Paso 5: Escribir el polinomio resultante ordenado en forma decreciente.'
errores_correccion: '- **Error 1:** Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos semejantes.
  **Cómo corregirlo:** Se deben **DISTRIBUIR COMPLETAMENTE LOS PRODUCTOS DEL NUMERADOR PARA AGRUPAR TÉRMINOS DEL MISMO GRADO**.

  - **Error 2:** Alterar el denominador común al efectuar las expansiones numéricas de los numeradores. **Cómo corregirlo:**
  El denominador común **PERMANECE INTACTO MIENTRAS SE OPERA Y REDUCE EL NUMERADOR**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el numerador reducido tras sumar $2(x+3) + 3(x-1)$?
  alternativas:
  - $5x + 3$
  - $5x + 5$
  - $5x + 6$
  respuesta: $5x + 3$
  solucion_pasos:
  - '1. Distribuir: $2x + 6 + 3x - 3$.'
  - '2. Reducir semejantes: $2x + 3x = 5x$ y $6 - 3 = 3$.'
  - '3. Resultado: $5x + 3$.'
- titulo: Ejemplo 2
  enunciado: Al expandir y reducir $x(x-2) + (2x-5)$, ¿qué polinomio resulta en el numerador?
  alternativas:
  - $x^2 - 5$
  - $x^2 + 4x - 5$
  - $x^2 - 4x - 5$
  respuesta: $x^2 - 5$
  solucion_pasos:
  - '1. Expandir: $x^2 - 2x + 2x - 5$.'
  - 2. Cancelar $-2x + 2x = 0$.
  - '3. Resultado: $x^2 - 5$.'
- titulo: Propiedad distributiva
  enunciado: ¿Es necesario aplicar la propiedad distributiva para deshacer los paréntesis en el numerador unificado?
  respuesta: Sí
  solucion_pasos:
  - Sí, la expansión permite liberar los términos para agrupar los semejantes.
- titulo: Permanencia del denominador
  enunciado: ¿El denominador común se expande y modifica al reducir el numerador?
  respuesta: 'No'
  solucion_pasos:
  - No, el denominador común se mantiene en forma factorizada m.c.m.
errores_frecuentes:
- En la expresión $x(x+4) + (3x-2)$, la suma de los términos semejantes en $x$ resulta $x^2 + 12x - 2$.
- La reducción del numerador $2x^2 + 3x + 4x^2$ equivale al polinomio de mayor grado $9x^4$.
- Al aplicar la propiedad distributiva en $3(x-2)$, se obtiene $3x - 2$ conservando la constante.
- La expansión y reducción del numerador modifica el denominador común m.c.m. a un grado mayor.
- Al agrupar $5x - 8x$ en el numerador unificado, el coeficiente resultante es $+3x$.
afirmaciones_verdaderas:
- La reducción del numerador unificado requiere expandir productos distributivos y sumar coeficientes semejantes.
- El denominador común m.c.m. permanece inalterado durante la reducción del numerador.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/reduccion-del-numerador-resultante-en-adicion-de-fracciones-resumen.svg)


  QUÉ: Reducir el numerador resultante de una adición de fracciones algebraicas.

  CÓMO: Aplicar la propiedad distributiva para expandir los productos del numerador y sumar los coeficientes de los términos
  de igual grado sobre el denominador m.c.m. ($N_{\text{reducido}}(x) = a_n x^n + \dots + a_0$).

  '
