procedimiento:
- 'Paso 1: Observa el numerador resultante gigante.'
- 'Paso 2: Identifica los términos que tienen las mismas variables con los mismos
  exponentes (términos semejantes).'
- 'Paso 3: Suma o resta sus coeficientes numéricos.'
- 'Paso 4: Escribe el polinomio final reducido y ordenado.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en reducción del numerador resultante en adición de fracciones.
ejemplos:
- titulo: Reduce el numerador de $\frac{4x^2 + 3x - 1 + x^2 - 3x + 5}{x}$
  enunciado: Reduce el numerador de $\frac{4x^2 + 3x - 1 + x^2 - 3x + 5}{x}$.
  solucion_pasos:
  - 'Términos con $x^2$: $4x^2 + x^2 = 5x^2$.'
  - 'Términos con $x$: $3x - 3x = 0$ (se anulan).'
  - 'Números: $-1 + 5 = 4$.'
  - 'Resultado final: $\frac{5x^2 + 4}{x}$.'
- titulo: Limpia $\frac{a + 2b - a + b}{c}$.
  solucion_pasos:
  - Las 'a' se cancelan (a - a = 0). Las 'b' se suman (2b + b = 3b).
- titulo: 'Respecto de «Reducción del numerador resultante en adición de fracciones»:
    ¿La siguiente for'
  enunciado: 'Respecto de «Reducción del numerador resultante en adición de fracciones»:
    ¿La siguiente formulación es correcta? «Después de sumar los numeradores amplificados,
    siempre debes reducir términos semejantes (sumar y restar coeficientes de las
    mismas variables)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Después de sumar los numeradores
    amplificados, siempre debes reducir términos semejantes (sumar y restar coeficientes
    de las mismas variables).'
- titulo: 'Respecto de «Reducción del numerador resultante en adición de fracciones»:
    ¿La siguiente con'
  enunciado: 'Respecto de «Reducción del numerador resultante en adición de fracciones»:
    ¿La siguiente conclusión es correcta? «Sumar términos que no son semejantes (ej.
    $2x + 3 = 5x$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Después de sumar los numeradores
    amplificados, siempre debes reducir términos semejantes (sumar y restar coeficientes
    de las mismas variables).'
errores_frecuentes:
- Sumar términos que no son semejantes (ej. $2x + 3 = 5x$).
- Olvidarse de incluir términos que no tienen pareja al transcribir el resultado.
- Dividir todos los términos por un factor común.
- Tachar términos que sean iguales al denominador.
- Para «Reducir términos semejantes en el numerador de una fracción significa:», la
  respuesta correcta es Ordenar de menor a mayor grado.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando reducción
  del numerador resultante en adición de fracciones.
