semantic_id: MAT.ALG.EC_CUADR_METODOS.SUSTITUCION_COEFICIENTES
resumen_inicial: La sustitución ordenada de $a$, $b$ y $c$ en la fórmula general exige el uso riguroso de paréntesis protectores en cada coeficiente ($x = \frac{-(b) \pm \sqrt{(b)^2 - 4(a)(c)}}{2(a)}$) para evitar errores críticos de signos.
explicacion_simple: "![La sustitución ordenada de $a$, $b$ y $c$ en la fórmula general exige el uso riguroso de paréntesis protectores en cada coeficiente ($x = \\frac{-(b) \\pm \\sqrt{(b)^2 - 4(a)(c)}}{2(a)}$) para evitar errores críticos de signos](/static/img/nodos/sustitucion-ordenada-de-a-b-y-c-en-la-formula-general-intro.svg)\n\n\nEl 90% de los errores al usar la fórmula cuadrática ocurre **por los signos al reemplazar los números**.\nPara que nunca te equivoques, usa siempre **paréntesis protectores**:\n- **El término $-b$:** Escribe siempre **$-(b)$**.\n  - Si $b = -6$, queda $-(-6) = +6$ (¡se vuelve positivo!).\n- **El término $b^2$:** Escribe **$(b)^2$**.\n  - Si $b = -6$, queda $(-6)^2 = +36$ (¡siempre da positivo!).\n- **El término $-4ac$:** Escribe **$-4(a)(c)$**.\n  - Si $c$ es negativo (ej: $c = -5$), el producto menos por menos se vuelve más: $-4(2)(-5) = +40$."
explicacion_formal: "Sea la resolvente $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$. La **metodología de sustitución paramétrica protegida** se fundamenta en las reglas algebraicas de signos:\n\n1. **Negación unaria del coeficiente lineal**: $-b = -(b)$. Si $b < 0 \\implies -b = |b| > 0$.\n2. **Cuadrado del coeficiente lineal**: $(b)^2 = (-b)^2 \\ge 0$, siempre no negativo en $\\mathbb{R}$.\n3. **Producto cuadrático cruzado**: $-4ac = -4 \\cdot (a) \\cdot (c)$:\n   $$-4(a)(c) = \\begin{cases} -|4ac| & \\text{si } \\text{sgn}(a) = \\text{sgn}(c) \\quad (ac > 0) \\\\ +|4ac| & \\text{si } \\text{sgn}(a) \\neq \\text{sgn}(c) \\quad (ac < 0) \\end{cases}$$\n4. **Denominador ponderado**: $2(a)$. Si $a < 0$, el denominador invierte el orden algebraico de las ramas."
definiciones_clave: '- **Sustitución protegida**: Técnica de reemplazo algebraico donde cada parámetro se encierra entre paréntesis.

  - **Regla de signos del discriminante**: Determinación precisa del signo del término constante aditivo $-4ac$.'
propiedades_relaciones: '- **Prevención de falsos negativos**: Evita escribir $-3^2 = -9$ en lugar de $(-3)^2 = 9$.

  - **Preservación de la equivalencia**: Mantiene intacta la jerarquía de las operaciones.'
ejemplo_guiado:
  enunciado: '![Ejemplo La sustitución ordenada de $a$, $b$ y $c$ en la fórmula general exige el uso riguroso de paréntesis protectores en cada coeficiente ($x = \frac{-(b) \pm \sqrt{(b)^2 - 4(a)(c)}}{2(a)}$) para evitar errores críticos de signos](/static/img/nodos/sustitucion-ordenada-de-a-b-y-c-en-la-formula-general-ejemplos.svg)



    Sustituye ordenadamente los coeficientes de la ecuación $2x^2 - 7x - 4 = 0$ en la fórmula general y calcula sus soluciones.'
  pasos:
  - 'Paso 1: Identificar coeficientes con signo: $a = 2, b = -7, c = -4$.'
  - 'Paso 2: Escribir la fórmula con paréntesis vacíos: $x = \frac{-(\quad) \pm \sqrt{(\quad)^2 - 4(\quad)(\quad)}}{2(\quad)}$.'
  - 'Paso 3: Insertar los valores: $x = \frac{-(-7) \pm \sqrt{(-7)^2 - 4(2)(-4)}}{2(2)}$.'
  - 'Paso 4: Resolver los signos: $-(-7) = 7$, $(-7)^2 = 49$, y $-4(2)(-4) = +32$.'
  - 'Paso 5: Evaluar el discriminante: $\Delta = 49 + 32 = 81$.'
  - 'Paso 6: Despejar las ramas: $x = \frac{7 \pm 9}{4} \implies x_1 = \frac{16}{4} = 4, \; x_2 = \frac{-2}{4} = -\frac{1}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al sustituir $b = -8$ en la expresión $-b \pm \sqrt{b^2 - 4ac}$, ¿qué valores se obtienen al inicio?
  choices:
  - text: +8 ± √(64 - 4ac)
    is_correct: true
  - text: -8 ± √(-64 - 4ac)
    is_correct: false
  - text: -8 ± √(64 - 4ac)
    is_correct: false
  - text: +8 ± √(-64 - 4ac)
    is_correct: false
  explanation: La alternativa correcta es '+8 ± √(64 - 4ac)'. $-(-8) = +8$ y $(-8)^2 = +64$.
  reinforcement_section: Explicación formal
