  - text: '-15'
    is_correct: false
  explanation: La alternativa correcta es '+60'. $-4(3)(-5) = +60$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer con total claridad la terna de coeficientes con sus signos: $a = \dots, b = \dots, c = \dots$.'
- 'Paso 2: Escribir la estructura de la fórmula general con paréntesis protectores en cada letra.'
- 'Paso 3: Rellenar cada paréntesis con el número correspondiente.'
- 'Paso 4: Efectuar las operaciones de signos: calcular $-(-b)$, $(-b)^2$ y $-4(a)(c)$.'
- 'Paso 5: Sumar las cantidades bajo el radical y calcular la raíz cuadrada.'
errores_correccion: '- **Error común:** Escribir $(-5)^2 = -25$ o $-(-5) = -5$.

  - **Cómo corregirlo:** Recuerda que **menos por menos da más**: $-(-5) = +5$, y $(-5)^2 = (-5)(-5) = +25$.'
ejemplos:
- titulo: 'Ejemplo 1: Sustitución con coeficientes todos negativos'
  enunciado: En $-x^2 - 3x - 2 = 0$, ¿cómo queda correctamente sustituido el numerador?
  alternativas:
  - -(-3) ± √((-3)^2 - 4(-1)(-2)) = 3 ± √(9 - 8)
  - -3 ± √(9 + 8)
  - 3 ± √(-9 - 8)
  - -3 ± √(-9 + 8)
  respuesta: -(-3) ± √((-3)^2 - 4(-1)(-2)) = 3 ± √(9 - 8)
  solucion_pasos:
  - 'Paso 1: $-(-3) = 3$, $(-3)^2 = 9$, $-4(-1)(-2) = -8 \implies 3 \pm \sqrt{1}$.'
- titulo: 'Ejemplo 2: Término c negativo'
  enunciado: Para $x^2 - 2x - 8 = 0$, ¿cuál es el valor de Δ = b² - 4ac?
  alternativas:
  - '36'
  - '-28'
  - '28'
  - '4'
  respuesta: '36'
  solucion_pasos:
  - 'Paso 1: $\Delta = (-2)^2 - 4(1)(-8) = 4 + 32 = 36$.'
- titulo: 'Ejemplo 3: Coeficiente a negativo en denominador'
  enunciado: En $-2x^2 + 7x - 3 = 0$, ¿cuál es el divisor 2a?
  alternativas:
  - '-4'
  - '4'
  - '-2'
  - '2'
  respuesta: '-4'
  solucion_pasos:
  - 'Paso 1: $2a = 2(-2) = -4$.'
- titulo: 'Ejemplo 4: Coeficiente b fraccionario'
  enunciado: Si $b = -\frac{1}{2}$, ¿cuánto vale b²?
  alternativas:
  - 1/4
  - -1/4
  - 1/2
  - -1/2
  respuesta: 1/4
  solucion_pasos:
  - 'Paso 1: $(-1/2)^2 = 1/4$.'
errores_frecuentes:
- Olvidar el cambio de signo de -b cuando b es negativo.
- Considerar negativo el resultado de (-b)².
- Multiplicar erróneamente los signos en -4ac.
afirmaciones_verdaderas:
- El uso de paréntesis al sustituir coeficientes evita errores de cálculo de signos en la resolvente.
- El término (-b)² es siempre un número positivo o nulo en el conjunto de los reales.
al_terminar_debes_poder: '**QUÉ:** Sustituir ordenadamente los coeficientes a, b y c en la fórmula general.


  **CÓMO:** Utilizando paréntesis protectores y aplicando con rigor las leyes de los signos algebraicos.


