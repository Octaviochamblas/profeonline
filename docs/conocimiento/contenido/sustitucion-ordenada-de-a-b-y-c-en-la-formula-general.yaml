semantic_id: MAT.ALG.EC_CUADR_METODOS.SUSTITUCION_COEFICIENTES
resumen_inicial: 'Sustitución ordenada de a, b y c en la fórmula general: concepto,
  discriminante, soluciones y modelamiento en Métodos algebraicos de resolución.'
explicacion_simple: La mayoría de los errores al usar la fórmula general no ocurren
  por no saberla de memoria, sino por sustituir mal un coeficiente, sobre todo cuando
  es negativo.
explicacion_formal: '### Definición formal


  Sustituir en $x=\dfrac{-b\pm\sqrt{b^2-4ac}}{2a}$ significa reemplazar $a$, $b$ y
  $c$ por sus valores numéricos concretos, manteniendo cada uno encerrado entre paréntesis
  para preservar su signo durante las operaciones posteriores (elevar al cuadrado,
  multiplicar).


  ### Desarrollo didáctico


  Escribir cada coeficiente entre paréntesis antes de operar evita el error más común:
  perder o invertir un signo negativo al elevarlo al cuadrado o multiplicarlo.


  Para $-3x^2+2x+8=0$: $a=-3$, $b=2$, $c=8$. Sustituyendo con paréntesis, $x=\dfrac{-(2)\pm\sqrt{(2)^2-4(-3)(8)}}{2(-3)}=\dfrac{-2\pm\sqrt{4+96}}{-6}$.'
definiciones_clave: '- **Sustitución ordenada de a, b y c en la fórmula general**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en sustitución
  ordenada de a, b y c en la fórmula general.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando sustitución ordenada
    de a, b y c en la fórmula general.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a sustitución ordenada
    de a, b y c en la fórmula general.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
