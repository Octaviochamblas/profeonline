procedimiento:
- 'Paso 1: Identifica los valores numéricos de $a$, $b$ y $c$, incluyendo su signo.'
- 'Paso 2: Escribe cada coeficiente entre paréntesis al sustituirlo en la fórmula.'
- 'Paso 3: Resuelve las operaciones (potencias, productos) respetando los paréntesis
  antes de simplificar.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en sustitución ordenada de a, b y c en la fórmula general.
ejemplos:
- titulo: Sustitución con coeficiente b negativo
  enunciado: Sustituye correctamente en la fórmula general para $x^2-6x+5=0$.
  solucion_pasos:
  - $a=1$, $b=-6$, $c=5$.
  - $x=\dfrac{-(-6)\pm\sqrt{(-6)^2-4(1)(5)}}{2(1)}=\dfrac{6\pm\sqrt{36-20}}{2}$.
- titulo: Sustitución con coeficiente a negativo
  enunciado: Sustituye correctamente en la fórmula general para $-2x^2+3x-1=0$.
  solucion_pasos:
  - $a=-2$, $b=3$, $c=-1$.
  - $x=\dfrac{-(3)\pm\sqrt{(3)^2-4(-2)(-1)}}{2(-2)}=\dfrac{-3\pm\sqrt{9-8}}{-4}$.
- titulo: ¿Usar paréntesis al sustituir ayuda a evitar errores de signo?
  enunciado: ¿Usar paréntesis al sustituir ayuda a evitar errores de signo?
  respuesta: Sí
  solucion_pasos:
  - Los paréntesis preservan el signo original de cada coeficiente durante las operaciones
    posteriores.
- titulo: ¿Sustituir $-b$ cuando $b$ es negativo produce un resultado positivo?
  enunciado: ¿Sustituir $-b$ cuando $b$ es negativo produce un resultado positivo?
  respuesta: Sí
  solucion_pasos:
  - $-b$ con $b$ negativo equivale a $-(\text{negativo})$, que es positivo.
errores_frecuentes:
- No usar paréntesis al sustituir un coeficiente negativo, perdiendo su signo en operaciones
  posteriores.
- Olvidar aplicar el signo negativo delante de $b$ en el término $-b$ de la fórmula.
- Confundir el orden de sustitución de $a$, $b$ y $c$, sustituyendo un valor en la
  posición equivocada.
- Elevar $b$ al cuadrado sin encerrarlo en paréntesis, obteniendo un signo incorrecto
  si $b$ es negativo.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando sustitución
  ordenada de a, b y c en la fórmula general.
