semantic_id: MAT.ALG.EC_CUADR_METODOS.SUSTITUCION_COEFICIENTES
resumen_inicial: La sustitución ordenada de $a$, $b$ y $c$ inserta los coeficientes numéricos con sus signos exactos dentro de la fórmula general cuadrática.
explicacion_simple: |
  Para no equivocarte nunca al usar la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$:

  - **Usa siempre paréntesis al reemplazar**: Escribe cada valor de $a$, $b$ y $c$ entre paréntesis dentro de la fórmula.
  - **Ejemplo**: Si $3x^2 - 4x - 2 = 0$, los coeficientes son $a = 3$, $b = -4$, $c = -2$.
  - Reemplazo exacto:
    $$x = \frac{-(-4) \pm \sqrt{(-4)^2 - 4(3)(-2)}}{2(3)}$$
  - **Ojo con los signos**:
    - $-(-4)$ se convierte en $+4$.
    - $(-4)^2$ se convierte en $+16$ (siempre positivo).
    - $-4(3)(-2)$ se convierte en $+24$ (menos por menos da más).
explicacion_formal: |
  Dada una ecuación cuadrática reducida $ax^2 + bx + c = 0$ con vector de coeficientes $(a, b, c) \in (\mathbb{R} \setminus \{0\}) \times \mathbb{R} \times \mathbb{R}$, el operador de **sustitución ordenada** aplica las reglas formales de evaluación de funciones con signos:

  $$x = \frac{-(b) \pm \sqrt{(b)^2 - 4 \cdot (a) \cdot (c)}}{2 \cdot (a)}$$

  **Reglas operatorias de signos:**
  - **Término lineal sustituido:** $-(b) = -b$ si $b > 0$, y $-(b) = +|b|$ si $b < 0$.
  - **Término cuadrático interno:** $(b)^2 \ge 0 \quad \forall b \in \mathbb{R}$.
  - **Término del producto discriminante:** $-4(a)(c) > 0$ si $\text{signo}(a) \neq \text{signo}(c)$, y $-4(a)(c) < 0$ si $\text{signo}(a) = \text{signo}(c)$.
definiciones_clave: |
  - **Sustitución ordenada de coeficientes**: Evaluación sistemática de los coeficientes numéricos $a$, $b$ y $c$ en la fórmula general utilizando paréntesis algebraicos para preservar la ley de signos.
propiedades_relaciones: |
  - **Invariancia bajo ordenación previa**: La extracción correcta de coeficientes para la sustitución exige que la ecuación se encuentre previamente igualada a cero en su forma estándar $ax^2 + bx + c = 0$.
ejemplo_guiado:
  enunciado: 'Realiza la sustitución ordenada de coeficientes para la ecuación cuadrática $-x^2 - 6x + 7 = 0$ en la fórmula general.'
  pasos:
    - 'Paso 1: Extraer coeficientes con signo: $a = -1$, $b = -6$, $c = 7$.'
    - 'Paso 2: Escribir la estructura con paréntesis: $x = \frac{-(b) \pm \sqrt{(b)^2 - 4(a)(c)}}{2(a)}$.'
    - 'Paso 3: Sustituir los valores: $x = \frac{-(-6) \pm \sqrt{(-6)^2 - 4(-1)(7)}}{2(-1)}$.'
    - 'Paso 4: Desarrollar signos: $x = \frac{6 \pm \sqrt{36 + 28}}{-2} = \frac{6 \pm \sqrt{64}}{-2} = \frac{6 \pm 8}{-2}$. Soluciones $x_1 = -7$ y $x_2 = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al sustituir el coeficiente $b = -8$ en el término $-b$ de la fórmula general, ¿qué resultado numérico se obtiene?'
    choices:
      - {text: 'El valor $+8$ (positivo).', is_correct: true}
      - {text: 'El valor $-8$ (negativo).', is_correct: false}
      - {text: 'El valor $-64$.', is_correct: false}
      - {text: 'El valor cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor $+8$ (positivo).''. Al evaluar $-(-8)$, los dos signos menos se multiplican dando $+8$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la sustitución ordenada correcta de $a = 2$, $b = -5$, $c = -3$ en la fórmula general?'
    choices:
      - {text: '$x = \frac{-(-5) \pm \sqrt{(-5)^2 - 4(2)(-3)}}{2(2)}$', is_correct: true}
      - {text: '$x = \frac{-5 \pm \sqrt{-5^2 - 4(2)(3)}}{2(2)}$', is_correct: false}
      - {text: '$x = \frac{5 \pm \sqrt{25 - 24}}{2}$', is_correct: false}
      - {text: '$x = \frac{-(-5) \pm \sqrt{5^2 + 4(2)(3)}}{2}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{-(-5) \pm \sqrt{(-5)^2 - 4(2)(-3)}}{2(2)}$''. Mantiene los paréntesis y signos exactos.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la ecuación en la forma general $ax^2 + bx + c = 0$ identificando $a$, $b$ y $c$.'
  - 'Paso 2: Escribir el esqueleto de la fórmula reemplazando cada variable por paréntesis: $x = \frac{-(b) \pm \sqrt{(b)^2 - 4(a)(c)}}{2(a)}$.'
  - 'Paso 3: Rellenar los paréntesis con los valores de $a$, $b$ y $c$ respetando sus signos positivos o negativos.'
  - 'Paso 4: Aplicar la regla de signos para evaluar $-b$, el cuadrado $b^2$ y el producto $-4ac$.'
errores_correccion: |
  - **Error común:** Escribir $-5^2 = -25$ bajo la raíz en lugar de $(-5)^2 = +25$.
  - **Cómo corregirlo:** El cuadrado de cualquier coeficiente real **SIEMPRE ES POSITIVO**; usa paréntesis $(-b)^2$ al sustituir.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Sustitución con coeficientes negativos.
    alternativas:
      - '$x = \frac{-(-4) \pm \sqrt{(-4)^2 - 4(1)(-5)}}{2(1)}$'
      - '$x = \frac{-4 \pm \sqrt{-4^2 - 4(1)(5)}}{2}$'
      - '$x = \frac{4 \pm \sqrt{16 - 20}}{2}$'
    respuesta: '$x = \frac{-(-4) \pm \sqrt{(-4)^2 - 4(1)(-5)}}{2(1)}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Sustitución con a negativo.
    alternativas:
      - '$x = \frac{-(6) \pm \sqrt{(6)^2 - 4(-2)(8)}}{2(-2)}$'
      - '$x = \frac{-6 \pm \sqrt{36 - 64}}{4}$'
      - '$x = \frac{6 \pm \sqrt{36 + 64}}{-4}$'
    respuesta: '$x = \frac{-(6) \pm \sqrt{(6)^2 - 4(-2)(8)}}{2(-2)}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Evaluar la expresión $-b$ cuando $b = -7$ ingresando directamente el número $-7$ sin cambiar su signo.'
  - 'Escribir la potencia bajo el radical como $-3^2 = -9$ en lugar de utilizar paréntesis $(-3)^2 = 9$.'
  - 'Sustituir los coeficientes $a$, $b$ y $c$ tomándolos de una ecuación desordenada que no ha sido igualada a cero.'
  - 'Ignorar el signo negativo del denominador $2a$ cuando el coeficiente principal $a$ es negativo ($a < 0$).'
  - 'La falta de multiplicación por 4 en el término $-4ac$ del discriminante.'
afirmaciones_verdaderas:
  - 'La sustitución ordenada de coeficientes requiere encerrar $a$, $b$ y $c$ en paréntesis dentro de la fórmula $x = \frac{-(b) \pm \sqrt{(b)^2 - 4(a)(c)}}{2(a)}$.'
  - 'El término de la potencia $(b)^2$ dentro del radical resulta siempre positivo independientemente de si $b$ es positivo o negativo.'
al_terminar_debes_poder: |
  QUÉ: Realizar la sustitución ordenada y sistemática de los coeficientes $a$, $b$ y $c$ en la fórmula general cuadrática.
  CÓMO: Isolar $a, b, c$, escribir la plantilla con paréntesis $x = \frac{-(b) \pm \sqrt{(b)^2 - 4(a)(c)}}{2(a)}$ y aplicar leyes de signos.
