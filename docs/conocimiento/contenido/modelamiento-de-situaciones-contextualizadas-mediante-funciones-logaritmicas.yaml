semantic_id: MAT.ALG.RELACION_EXP_LOG.MODELO_LOGARITMICO_CONTEXTO
resumen_inicial: El modelamiento de situaciones contextualizadas mediante funciones logarítmicas formaliza fenómenos donde incrementos geométricos o exponenciales de la variable física producen respuestas que crecen de manera aditiva y gradual, como la escala Richter de sismos, la escala de decibeles y el pH químico.
explicacion_simple: "![El modelamiento de situaciones contextualizadas mediante funciones logarítmicas formaliza fenómenos donde incrementos geométricos o exponenciales de la variable física producen respuestas que crecen de manera aditiva y gradual, como la escala Richter de sismos, la escala de decibeles y el pH químico](/static/img/nodos/modelamiento-de-situaciones-contextualizadas-mediante-funciones-logaritmicas-intro.svg)\n\n\n¿Por qué la naturaleza y la ciencia usan **modelos logarítmicos**?\n\n- **Para comprimir números gigantescos en escalas fáciles de entender:**\n  1. **Escala Richter (Terremotos):**\n     - La energía de un terremoto se multiplica por $10$ en cada grado de magnitud:\n     - Un sismo de magnitud $7$ no es un poco más fuerte que uno de $5$... **¡Es $10^{7 - 5} = 10^2 = 100\\text{ VECES MÁS POTENTE}!**\n  2. **Escala de Decibeles (Sonido):** $\\beta = 10\\log(I / I_0)$ dB.\n     - El oído humano escucha desde un susurro hasta un avión a reacción (un rango de un billón\
  \ a uno), que el logaritmo comprime entre $0$ y $120$ dB.\n  3. **Química (pH):** $\\text{pH} = -\\log[H^+]$ mide la acidez comprimiendo concentraciones microscópicas."
explicacion_formal: "Sea un sistema dinámico gobernado por la **Ley Psicofísica de Weber-Fechner**:\n$$S(I) = k \\cdot \\ln\\left(\\frac{I}{I_0}\\right)$$\nDonde $S$ es la intensidad de la sensación subjetiva, $I$ es la magnitud del estímulo físico e $I_0$ es el umbral basal de percepción.\n\n**Modelos canónicos estandarizados**:\n1. **Magnitud Sísmica (Richter)**:\n   $$M = \\log\\left(\\frac{A}{A_0}\\right) \\Longleftrightarrow \\frac{A_1}{A_2} = 10^{M_1 - M_2}$$\n2. **Nivel de Presión Sonora (Decibeles)**:\n   $$\\beta = 10 \\log_{10}\\left(\\frac{I}{I_0}\\right), \\quad I_0 = 10^{-12} \\text{ W/m}^2$$\n3. **Potencial de Hidrógeno (pH)**:\n   $$\\text{pH} = -\\log_{10}[H^+] \\Longleftrightarrow [H^+] = 10^{-\\text{pH}}$$"
definiciones_clave: '- **Escala logarítmica**: Sistema de medición donde cada incremento de una unidad representa multiplicar la variable por un factor constante.

  - **Compresión de rango**: Reducción de variaciones de varios órdenes de magnitud a intervalos acotados.'
propiedades_relaciones: '- **Razón de magnitudes**: Una diferencia aditiva $\Delta M = M_1 - M_2$ equivale a un factor multiplicativo $10^{\Delta M}$ en el estímulo real.

  - **Inversión logarítmica de concentración**: A menor pH, mayor es la concentración de iones $[H^+]$ de forma exponencial.'
ejemplo_guiado:
  enunciado: '![Ejemplo El modelamiento de situaciones contextualizadas mediante funciones logarítmicas formaliza fenómenos donde incrementos geométricos o exponenciales de la variable física producen respuestas que crecen de manera aditiva y gradual, como la escala Richter de sismos, la escala de decibeles y el pH químico](/static/img/nodos/modelamiento-de-situaciones-contextualizadas-mediante-funciones-logaritmicas-ejemplos.svg)



    Resuelve los siguientes problemas de modelamiento logarítmico:

    1) ¿Cuántas veces más intenso en amplitud es un terremoto de magnitud 8 comparado con uno de magnitud 5 en la escala de Richter?

    2) Si una solución tiene una concentración de iones $[H^+] = 10^{-4}\text{ M}$, ¿cuál es su pH?

    3) Calcula el nivel sonoro en decibeles de un sonido con intensidad $I = 10^{-5}\text{ W/m}^2$ ($I_0 = 10^{-12}\text{ W/m}^2$).'
  pasos:
  - 'Paso 1: Para el sismo ($M_1 = 8, M_2 = 5$):

    - Diferencia de magnitudes: $\Delta M = 8 - 5 = 3$.

    - Factor de intensidad: $10^3 = \mathbf{1.000\text{ veces más intenso}}$.'
  - 'Paso 2: Para el pH:

    - $\text{pH} = -\log(10^{-4}) = -(-4) = \mathbf{4}$ (ácido).'
  - 'Paso 3: Para los decibeles:

    - $\beta = 10\log\left(\frac{10^{-5}}{10^{-12}}\right) = 10\log(10^7) = 10 \cdot 7 = \mathbf{70\text{ dB}}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas veces más potente en amplitud es un sismo de magnitud 7 respecto a uno de magnitud 6?
  choices:
  - text: 10 veces (10⁷⁻⁶ = 10¹)
    is_correct: true
  - text: 1,16 veces
    is_correct: false
  - text: 1 vez más
    is_correct: false
  - text: 100 veces
    is_correct: false
  explanation: La alternativa correcta es '10 veces (10⁷⁻⁶ = 10¹)'. En la escala logarítmica Richter, cada grado de diferencia multiplica la amplitud por 10.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el pH de una sustancia baja de 6 a 3, ¿qué ocurrió con su concentración de acidez $[H^+]$?
  choices:
  - text: Aumentó 1.000 veces (10⁶⁻³ = 10³)
    is_correct: true
  - text: Disminuyó a la mitad
    is_correct: false
  - text: Aumentó el doble
    is_correct: false
  - text: Aumentó 3 veces
    is_correct: false
  explanation: La alternativa correcta es 'Aumentó 1.000 veces (10⁶⁻³ = 10³)'. Como la escala de pH es logarítmica inversa, bajar 3 unidades multiplica la concentración por $10^3 = 1.000$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el modelo logarítmico aplicable al contexto (Richter, pH, decibeles).'
- 'Paso 2: Sustituir los datos físicos en la fórmula correspondiente.'
- 'Paso 3: Aplicar las propiedades de los logaritmos para simplificar potencias de base 10.'
- 'Paso 4: Interpretar el resultado en el contexto del problema (decibeles, pH o factor multiplicativo).'
errores_correccion: '- **Error común:** Realizar comparaciones lineales en escalas logarítmicas (ej: decir que un sismo de grado 6 es el doble de uno de grado 3).

  - **Cómo corregirlo:** En escalas logarítmicas las diferencias **se elevan como potencias de 10**: $10^{6 - 3} = 10^3 = \mathbf{1.000\text{ veces}}$, ¡no el doble!'
ejemplos:
- titulo: 'Ejemplo 1: Escala Richter con dos grados'
  enunciado: 'Un sismo de magnitud 6 comparado con uno de magnitud 4 es:'
  alternativas:
  - 100 veces más intenso
  - 1,5 veces más intenso
  - 2 veces más intenso
  - 10 veces más intenso
  respuesta: 100 veces más intenso
  solucion_pasos:
  - 'Paso 1: $10^{6 - 4} = 10^2 = 100$ veces más intenso.'
- titulo: 'Ejemplo 2: Cálculo de pH neutro'
  enunciado: El agua pura tiene $[H^+] = 10^{-7}\text{ M}$. ¿Cuál es su pH?
  alternativas:
  - '7'
  - '-7'
  - '10'
  - '0'
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: $\text{pH} = -\log(10^{-7}) = 7$.'
- titulo: 'Ejemplo 3: Nivel sonoro en decibeles'
  enunciado: Si $I = 10^{-2}\text{ W/m}^2$ e $I_0 = 10^{-12}\text{ W/m}^2$, ¿cuántos dB se registran?
  alternativas:
  - 100 dB
  - 10 dB
  - 120 dB
  - 50 dB
  respuesta: 100 dB
  solucion_pasos:
  - 'Paso 1: $\beta = 10\log(10^{10}) = 10 \cdot 10 = 100\text{ dB}$.'
- titulo: 'Ejemplo 4: Comparación de pH'
  enunciado: ¿Cuántas veces más ácida es una sustancia de pH 2 que una de pH 5?
  alternativas:
  - 1.000 veces
  - 3 veces
  - 2,5 veces
  - 100 veces
  respuesta: 1.000 veces
  solucion_pasos:
  - 'Paso 1: $10^{5 - 2} = 10^3 = 1.000$ veces más concentrada.'
errores_frecuentes:
- Interpretar variaciones en escalas logarítmicas como aumentos porcentuales lineales.
- Olvidar que en la escala de pH menor número significa mayor acidez.
- Confundir la unidad de decibeles con una medida lineal de energía sonora.
afirmaciones_verdaderas:
- Las escalas logarítmicas transforman variaciones exponenciales en escalas de lectura lineal accesible.
- Una diferencia de n unidades en una escala logarítmica base 10 representa una razón física de 10ⁿ.
al_terminar_debes_poder: '**QUÉ:** Modelar e interpretar situaciones del mundo real mediante funciones y escalas logarítmicas.


  **CÓMO:** Aplicando modelos de Richter, decibeles y pH para calcular magnitudes y razones de intensidades.


