resumen_inicial: El ordenamiento de un polinomio organiza sus términos en secuencia
  ascendente o descendente según los exponentes de una variable elegida.
explicacion_simple: Ordenar un polinomio respecto a la letra $x$ significa escribir
  sus términos en fila según los exponentes de $x$. Si lo ordenamos de forma **descendente**,
  colocamos primero el exponente más alto y vamos bajando (como $x^3 + 5x^2 - 2x +
  4$). Si lo ordenamos de forma **ascendente**, empezamos por el término independiente
  o exponente más bajo y vamos subiendo.
explicacion_formal: 'Sea $P(x) = c_1 x^{e_1} + c_2 x^{e_2} + \dots + c_n x^{e_n}$.


  - **Orden Descendente (Decreciente):** $e_1 > e_2 > \dots > e_n$.

  - **Orden Ascendente (Creciente):** $e_1 < e_2 < \dots < e_n$.


  > **Complemento didáctico:** El ordenamiento canónico descendente es la disposición
  estándar requerida para ejecutar algoritmos de división polinomial y factorización.'
definiciones_clave: '- **Polinomio ordenado descendente**: Términos dispuestos de
  mayor a menor grado respecto a una variable.

  - **Polinomio ordenado ascendente**: Términos dispuestos de menor a mayor grado
  respecto a una variable.'
propiedades_relaciones: '- **Preservación del valor**: Cambiar el orden de los sumandos
  no altera el valor del polinomio por la conmutatividad aditiva.'
ejemplo_guiado:
  enunciado: Ordene el polinomio $P(x) = 4 - 2x^3 + 7x^5 - x$ de forma descendente.
  pasos:
  - 'Paso 1: Identificar el término de mayor grado: $+7x^5$.'
  - 'Paso 2: Ubicar el siguiente grado en descenso: $-2x^3$.'
  - 'Paso 3: Ubicar el siguiente término: $-x$ (grado 1).'
  - 'Paso 4: Colocar la constante al final: $+4$ (grado 0).'
  - 'Conclusión: El polinomio ordenado de forma descendente es $7x^5 - 2x^3 - x +
    4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste el ordenamiento descendente de un polinomio respecto
    a x?
  choices:
  - text: En escribir los términos de mayor a menor grado según los exponentes de
      x
    is_correct: true
  - text: En escribir los términos de menor a mayor grado
    is_correct: false
  - text: En ordenar los coeficientes de forma alfabética
    is_correct: false
  - text: En eliminar todos los términos de grado par
    is_correct: false
  explanation: La alternativa correcta es 'En escribir los términos de mayor a menor
    grado según los exponentes de x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4 - 2x^3 + 7x^5 - x, ¿cuál fue el orden descendente
    correcto?
  choices:
  - text: 7x^5 - 2x^3 - x + 4
    is_correct: true
  - text: 4 - x - 2x^3 + 7x^5
    is_correct: false
  - text: 7x^5 + 4 - 2x^3 - x
    is_correct: false
  - text: -2x^3 + 7x^5 - x + 4
    is_correct: false
  explanation: La alternativa correcta es '7x^5 - 2x^3 - x + 4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elegir la variable de referencia para el ordenamiento.'
- 'Paso 2: Identificar los exponentes de dicha variable en cada término incluyendo
  su signo.'
- 'Paso 3: Reorganizar los términos en secuencia estricta de mayor a menor (descendente)
  o de menor a mayor (ascendente).'
errores_correccion: '- **Error 1: Perder el signo negativo de un término al moverlo
  de posición.** **Cómo corregirlo:** Cada término se desplaza llevando consigo el
  signo que lo precede.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el orden ascendente del polinomio Q(x) = 8x^3 - 5 + 2x?
  alternativas:
  - -5 + 2x + 8x^3
  - 8x^3 + 2x - 5
  - 2x - 5 + 8x^3
  - -5 + 8x^3 + 2x
  respuesta: -5 + 2x + 8x^3
  solucion_pasos:
  - '1. Grado 0: -5.'
  - '2. Grado 1: +2x.'
  - '3. Grado 3: +8x^3.'
  - '4. Orden ascendente (menor a mayor): -5 + 2x + 8x^3.'
- titulo: Ejemplo 2
  enunciado: Al ordenar descendente el polinomio 3x - 9 + 4x^4, ¿cuál término debe
    ir al inicio?
  alternativas:
  - 4x^4
  - 3x
  - '-9'
  - '9'
  respuesta: 4x^4
  solucion_pasos:
  - '1. En el orden descendente, el término de mayor grado va primero: 4x^4.'
- titulo: ¿Es 9x^4 - 2x^2 + 5x - 1 un polinomio ordenado de forma descendente?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, los exponentes de x descienden continuamente: 4, 2, 1, 0.'
- titulo: ¿Al reordenar los términos de un polinomio cambia el resultado numérico
    de su evaluación?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa de la adición, cambiar el orden de los términos
    no altera el valor del polinomio.
errores_frecuentes:
- Separar los coeficientes de sus signos precedentes al mover los términos del polinomio.
- Guiarse por el valor del coeficiente numérico en lugar del exponente de la variable
  al ordenar.
- Mezclar el orden ascendente de una variable con el orden descendente de otra sin
  fijar criterio.
- Omitir el término independiente al reordenar el polinomio.
- Declarar que el polinomio cambia de signo global al invertir el orden de sus términos.
afirmaciones_verdaderas:
- El ordenamiento descendente ubica en primer lugar el término de mayor exponente.
- La conmutatividad aditiva garantiza que reordenar un polinomio no modifica su valor.
al_terminar_debes_poder: Al terminar serás capaz de ordenar cualquier polinomio en
  forma ascendente o descendente conservando los signos y grados de sus términos.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Polinomios.
