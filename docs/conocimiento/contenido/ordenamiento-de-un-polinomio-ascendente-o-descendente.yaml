semantic_id: MAT.ALG.POLINOMIOS.ORDENAMIENTO
resumen_inicial: 'El ordenamiento de un polinomio consiste en disponer sus términos algebraicos en secuencia creciente (ascendente) o decreciente (descendente) según los exponentes de una variable elegida como referencia.'
explicacion_simple: |
  Para trabajar con polinomios de forma limpia y ordenada, los organizamos siguiendo una **secuencia según sus exponentes**:
  - **Orden Decreciente (de mayor a menor)**: Es el estándar más usado en álgebra. Colocas primero el término con la mayor potencia y vas bajando hasta el término independiente.
    - Ejemplo: $5x^4 - 2x^3 + 7x^2 - x + 9$.
  - **Orden Creciente (de menor a mayor)**: Colocas primero el número constante o la menor potencia y vas subiendo los exponentes.
    - Ejemplo: $9 - x + 7x^2 - 2x^3 + 5x^4$.
  - **¡Regla de oro!** Al mover un término para reordenarlo, **su signo ($+$ o $-$) debe viajar SIEMPRE pegado con él**.
explicacion_formal: |
  ### Definición formal
  Sea $P(x) = \sum_{i=0}^n a_i x^i \in \mathbb{R}[x]$ un polinomio en una variable.

  1. **Ordenamiento Decreciente Canónico**: Disposición de la suma donde los exponentes satisfacen una relación estricta de orden descendente:
     $$P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_1 x + a_0 \quad \text{con } n > n-1 > \dots > 1 > 0$$
  2. **Ordenamiento Creciente**: Disposición de la suma donde los exponentes satisfacen una relación estricta de orden ascendente:
     $$P(x) = a_0 + a_1 x + \dots + a_{n-1} x^{n-1} + a_n x^n \quad \text{con } 0 < 1 < \dots < n-1 < n$$

  ### Ordenamiento en Polinomios Multivariables
  En polinomios con más de una letra como $P(x,y)$, el ordenamiento se especifica **respecto a una variable principal**:
  - Decreciente respecto a $x$: $x^3 y + x^2 y^4 - x y^7 + y^9$.

  ### Síntesis didáctica
  El ordenamiento es el paso previo indispensable para ejecutar los algoritmos de suma por columnas, resta, multiplicación y división polinómica sintética.
definiciones_clave: |
  - **Ordenamiento decreciente**: Disposición de términos algebraicos desde la potencia más alta a la más baja.
  - **Ordenamiento creciente**: Disposición de términos algebraicos desde la potencia más baja a la más alta.
  - **Variable de ordenamiento**: Letra seleccionada cuyos exponentes rigen la secuencia de orden del polinomio.
propiedades_relaciones: |
  - **Invarianza aditiva**: Por la propiedad conmutativa de la suma en $\mathbb{R}$, reordenar los términos de un polinomio no altera su valor numérico ni su grado absoluto.
  - **Estandarización polinómica**: El orden decreciente facilita identificar al instante el grado del polinomio (primer término) y el término independiente (último término).
ejemplo_guiado:
  enunciado: 'Dado el polinomio desordenado $P(x) = 6x - 4 + 2x^4 - 5x^2$, ordénalo en forma decreciente respecto a $x$ conservando los signos intactos.'
  pasos:
    - 'Paso 1: Identificamos los exponentes de cada término: $2x^4 \to 4$, $-5x^2 \to 2$, $+6x \to 1$, $-4 \to 0$.'
    - 'Paso 2: Ubicamos en 1.er lugar la potencia mayor con su signo: $+2x^4$ (o $2x^4$).'
    - 'Paso 3: Ubicamos la siguiente potencia decreciente: $-5x^2$.'
    - 'Paso 4: Ubicamos el término de primer grado: $+6x$.'
    - 'Paso 5: Ubicamos al final el término independiente constante: $-4$.'
    - 'Conclusión: El polinomio ordenado en forma decreciente es **$2x^4 - 5x^2 + 6x - 4$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué consiste el ordenamiento decreciente canónico de un polinomio en una variable?'
    choices:
      - {text: 'En escribir los términos ordenados desde la potencia de mayor exponente hasta el término de menor exponente o constante', is_correct: true}
      - {text: 'En ordenar los coeficientes numéricos de menor a mayor sin importar los exponentes', is_correct: false}
      - {text: 'En eliminar todos los términos de grado impar', is_correct: false}
      - {text: 'En escribir primero el término independiente y al final la potencia mayor', is_correct: false}
    explanation: 'La alternativa correcta es ''En escribir los términos ordenados desde la potencia de mayor exponente hasta el término de menor exponente o constante''. Forma canónica decreciente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si reordenamos el polinomio desordenado $3 - 7x^3 + x$ en forma creciente respecto a $x$, ¿cuál es el resultado correcto?'
    choices:
      - {text: 'El polinomio ordenado en forma creciente es $3 + x - 7x^3$', is_correct: true}
      - {text: 'El polinomio ordenado en forma creciente es $-7x^3 + x + 3$', is_correct: false}
      - {text: 'El polinomio ordenado en forma creciente es $7x^3 - x - 3$', is_correct: false}
      - {text: 'El polinomio ordenado en forma creciente es $x - 7x^3 + 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''El polinomio ordenado en forma creciente es $3 + x - 7x^3$''. Va desde el exponente $0$ ($3$), $1$ ($x$) hasta el $3$ ($-7x^3$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Elegir la variable de referencia respecto a la cual se va a ordenar el polinomio.'
  - 'Paso 2: Identificar el exponente que posee dicha variable en cada uno de los términos.'
  - 'Paso 3: Para orden decreciente, escribir los términos de mayor a menor exponente. Para creciente, de menor a mayor.'
  - 'Paso 4: Asegurarse de que cada término conserve el signo escrito a su izquierda al ser trasladado.'
errores_correccion: |
  - **Error 1:** Alterar o perder el signo de un término al cambiar su posición (ej: transformar $-5x^2 + 3x$ en $3x + 5x^2$). **Cómo corregirlo:** Cada término **traslada obligatoriamente su propio signo** (queda $3x - 5x^2$).
  - **Error 2:** Ordenar los términos basándose en los coeficientes numéricos en lugar de los exponentes. **Cómo corregirlo:** El ordenamiento se rige **exclusivamente por los exponentes de las letras**.
ejemplos:
  - titulo: 'Ordenamiento decreciente'
    enunciado: '¿Cuál es el polinomio $4x^2 - 9 + x^5 - 2x$ ordenado en forma decreciente?'
    alternativas:
      - '$x^5 + 4x^2 - 2x - 9$'
      - '$-9 - 2x + 4x^2 + x^5$'
      - '$x^5 - 9 + 4x^2 - 2x$'
    respuesta: '$x^5 + 4x^2 - 2x - 9$'
    solucion_pasos:
      - '1. Secuencia de exponentes: $5, 2, 1, 0$.'
      - '2. Polinomio decreciente: $x^5 + 4x^2 - 2x - 9$.'
  - titulo: 'Ordenamiento creciente'
    enunciado: '¿Cuál es el polinomio $8x^3 - 5 + 3x$ ordenado en forma creciente?'
    alternativas:
      - '$-5 + 3x + 8x^3$'
      - '$8x^3 + 3x - 5$'
      - '$3x - 5 + 8x^3$'
    respuesta: '$-5 + 3x + 8x^3$'
    solucion_pasos:
      - '1. Secuencia de exponentes: $0, 1, 3$.'
      - '2. Polinomio creciente: $-5 + 3x + 8x^3$.'
  - titulo: 'Conservación del valor'
    enunciado: '¿Mantiene un polinomio exactamente el mismo valor numérico al reordenar sus términos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la propiedad conmutativa de la adición real.'
  - titulo: 'Orden decreciente con término independiente'
    enunciado: 'En un polinomio ordenado en forma decreciente, ¿el término independiente se ubica al final?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser de exponente cero $x^0$, queda posicionado al final.'
errores_frecuentes:
  - 'Reordenar los términos de un polinomio invierte automáticamente los signos positivos y negativos de sus coeficientes.'
  - 'El ordenamiento de un polinomio se realiza ordenando el valor absoluto de sus coeficientes numéricos.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Un polinomio ordenado en forma creciente cambia su grado absoluto respecto al desordenado.'
  - 'Los términos independientes no pueden incluirse en la secuencia de ordenamiento por carecer de letras.'
afirmaciones_verdaderas:
  - 'El ordenamiento decreciente de un polinomio dispone los términos desde el mayor exponente al menor.'
  - 'Reordenar los términos de un polinomio no altera su grado absoluto ni su valor numérico por la conmutatividad aditiva.'
al_terminar_debes_poder: 'Ordenar cualquier polinomio en forma ascendente o descendente según los exponentes de una variable conservando los signos de sus términos.'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Polinomios.'
