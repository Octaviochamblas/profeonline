semantic_id: MAT.ALG.POLINOMIOS.ORDENAMIENTO_POLINOMIO
resumen_inicial: 'Ordenar un polinomio consiste en disponer sus términos de modo que los exponentes de una variable guía crezcan (orden ascendente) o decrezcan (orden descendente).'
explicacion_simple: |
  - Para ordenar un polinomio elegimos una letra como guía y miramos sus exponentes:
    - **Orden descendente (decreciente):** Se colocan los términos desde el exponente **más grande al más chico** (es la forma estándar canónica).
      - Ejemplo: $5x^4 - 3x^3 + 2x^2 + 8x - 1$.
    - **Orden ascendente (creciente):** Se colocan los términos desde el exponente **más chico al más grande** (empezando por el término independiente).
      - Ejemplo: $-1 + 8x + 2x^2 - 3x^3 + 5x^4$.
  - Al mover cada término de lugar, **siempre debemos trasladarlo junto con su propio signo ($+$ o $-$)**.

  ![Ordenamiento de un Polinomio](/static/img/nodos/ordenamiento-de-un-polinomio-ascendente-o-descendente-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $P(x) = \sum_{i=0}^n a_i x^i \in \mathbb{K}[x]$ con $a_n \neq 0$.
  1. **Forma canónica descendente (estándar):**
     $$P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_1 x + a_0$$
     Donde la sucesión de exponentes satisface $n > n-1 > \dots > 1 > 0$.
  2. **Forma canónica ascendente:**
     $$P(x) = a_0 + a_1 x + a_2 x^2 + \dots + a_n x^n$$
     Donde la sucesión de exponentes satisface $0 < 1 < 2 < \dots < n$.

  ### Ordenamiento en varias variables
  En polinomios multivariables $P(x, y)$, se selecciona una variable ordenadora principal (por ejemplo $x$). Los términos se disponen según las potencias de $x$, y en caso de empate en grado relativo, se ordenan respecto a la variable secundaria $y$.
definiciones_clave: |
  - **Orden descendente**: Disposición de mayor a menor exponente (forma canónica para algoritmos de división).
  - **Orden ascendente**: Disposición de menor a mayor exponente (común en series de potencias y aproximaciones).
  - **Variable ordenadora**: Letra de referencia elegida para estructurar la jerarquía de los monomios.
propiedades_relaciones: |
  - **Prerrequisito para la división polinomial**: El algoritmo de división euclídea de polinomios ($D(x) = d(x)q(x) + r(x)$) y la regla de Ruffini exigen que dividendo y divisor estén estrictamente ordenados de forma descendente.
  - **Invarianza algebraica**: Ordenar un polinomio no altera su valor numérico ni sus propiedades intrínsecas (conmutatividad de la adición).
ejemplo_guiado:
  enunciado: 'Dado el polinomio desordenado $P(x) = 7 - 4x^3 + 2x - 5x^4 + x^2$, ordénalo en forma: a) descendente y b) ascendente.'
  imagen: '/static/img/nodos/ordenamiento-de-un-polinomio-ascendente-o-descendente-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos cada término con su signo y su exponente: $+7 (x^0)$, $-4x^3 (x^3)$, $+2x (x^1)$, $-5x^4 (x^4)$, $+x^2 (x^2)$.'
    - 'Paso 2: Para el **orden descendente**, ordenamos los exponentes de mayor a menor ($4, 3, 2, 1, 0$):'
    - '  - **$P(x) = -5x^4 - 4x^3 + x^2 + 2x + 7$**.'
    - 'Paso 3: Para el **orden ascendente**, ordenamos los exponentes de menor a mayor ($0, 1, 2, 3, 4$):'
    - '  - **$P(x) = 7 + 2x + x^2 - 4x^3 - 5x^4$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes opciones representa al polinomio $P(x) = 3 - 2x^2 + 5x^4 - x$ ordenado de forma descendente?'
    choices:
      - text: '$5x^4 - 2x^2 - x + 3$'
        is_correct: true
      - text: '$3 - x - 2x^2 + 5x^4$'
        is_correct: false
      - text: '$5x^4 - 2x^2 + 3 - x$'
        is_correct: false
      - text: '$-2x^2 + 5x^4 - x + 3$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$5x^4 - 2x^2 - x + 3$''. Los exponentes decrecen estrictamente: $4 > 2 > 1 > 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al ordenar un polinomio, ¿qué precaución fundamental se debe mantener con cada término?'
    choices:
      - text: 'Mover cada monomio junto con su respectivo signo positivo o negativo'
        is_correct: true
      - text: 'Cambiar los signos negativos por positivos'
        is_correct: false
      - text: 'Sumar 1 a todos los exponentes'
        is_correct: false
      - text: 'Eliminar el término independiente'
        is_correct: false
    explanation: 'La alternativa correcta es ''Mover cada monomio junto con su respectivo signo positivo o negativo''. El signo pertenece de manera inseparable al coeficiente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Elegir la variable ordenadora si el polinomio tiene varias letras.'
  - 'Paso 2: Listar los exponentes que dicha variable tiene en cada uno de los monomios.'
  - 'Paso 3: Reordenar los términos de mayor a menor (descendente) o de menor a mayor (ascendente).'
  - 'Paso 4: Conservar el signo propio de cada monomio en su nueva posición.'
errores_correccion: |
  - **Error 1:** Separar el signo negativo al cambiar la posición de un término (ej. mover $-5x^3$ y escribir $+5x^3$). **Cómo corregirlo:** El signo menos **viaja con su monomio**.
  - **Error 2:** Mezclar criterios ordenando por una letra en unos términos y por otra letra en otros. **Cómo corregirlo:** Seleccionar **una única variable de referencia principal**.
ejemplos:
  - titulo: 'Orden descendente multivariable'
    enunciado: '¿Cómo se ordena el polinomio $x^2y^3 - 3x^4y + 2xy^4 - 5$ en forma descendente respecto a $x$?'
    alternativas:
      - '$-3x^4y + x^2y^3 + 2xy^4 - 5$'
      - '$2xy^4 + x^2y^3 - 3x^4y - 5$'
      - '$-5 + 2xy^4 + x^2y^3 - 3x^4y$'
    respuesta: '$-3x^4y + x^2y^3 + 2xy^4 - 5$'
    solucion_pasos:
      - '1. Exponentes de $x$: $-3x^4y (4)$, $x^2y^3 (2)$, $2xy^4 (1)$, $-5 (0)$.'
      - '2. Orden decreciente de $x$: $-3x^4y + x^2y^3 + 2xy^4 - 5$.'
  - titulo: 'Orden ascendente canónico'
    enunciado: '¿Cuál es la forma ascendente del polinomio $4x^3 - 7 + 2x^2$?'
    alternativas:
      - '$-7 + 2x^2 + 4x^3$'
      - '$4x^3 + 2x^2 - 7$'
      - '$7 - 2x^2 - 4x^3$'
    respuesta: '$-7 + 2x^2 + 4x^3$'
    solucion_pasos:
      - '1. Exponentes: $-7 (0)$, $2x^2 (2)$, $4x^3 (3)$.'
      - '2. Orden creciente: $-7 + 2x^2 + 4x^3$.'
  - titulo: 'Invarianza del valor numérico'
    enunciado: '¿Cambia el valor numérico de un polinomio al ser ordenado de forma descendente?'
    respuesta: 'No'
    solucion_pasos:
      - '1. La adición es conmutativa ($a + b = b + a$).'
      - '2. El ordenamiento es puramente estético y operacional.'
  - titulo: 'Necesidad de orden en división'
    enunciado: '¿Es obligatorio ordenar los polinomios en forma descendente para aplicar la división clásica y la regla de Ruffini?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. El algoritmo euclídeo compara los términos de mayor grado paso a paso.'
      - '2. Requiere orden descendente estricto.'
errores_frecuentes:
  - 'Dejar atrás los signos negativos al cambiar de posición los monomios.'
  - 'Confundir el orden de los coeficientes con el orden de los exponentes de la variable.'
  - 'Mezclar variables ordenadoras en un polinomio de dos letras sin fijar una jerarquía.'
  - 'Olvidar colocar el término independiente al final en el orden descendente.'
  - 'Creer que un polinomio ordenado debe tener obligatoriamente todos los grados intermedios.'
afirmaciones_verdaderas:
  - 'Ordenar un polinomio consiste en disponer sus monomios según potencias crecientes o decrecientes de una variable guía.'
  - 'La disposición descendente es la forma canónica estándar empleada en la división de polinomios y el método de Ruffini.'
al_terminar_debes_poder: |
  ![Resumen de Ordenamiento](/static/img/nodos/ordenamiento-de-un-polinomio-ascendente-o-descendente-resumen.svg)

  QUÉ: Ordenar polinomios en una o más variables en forma ascendente o descendente conservando la integridad de signos y coeficientes.
  CÓMO: Jerarquizando monomios según los exponentes de la variable de referencia ($n > n-1 > \dots > 0$) para aplicar algoritmos algebraicos estándar.
