    is_correct: false
  explanation: 'La alternativa correcta es: Identificar correctamente los elementos
    de grado, ordenamiento e igualdad de polinomios. Es la regla conceptual clave
    al estudiar ordenamiento de un polinomio (ascendente o descendente).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el análisis práctico de ordenamiento de un polinomio (ascendente o
    descendente), ¿qué paso es indispensable?
  choices:
  - text: Verificar la clasificación según las reglas del álgebra
    is_correct: true
  - text: Omisión de la parte literal
    is_correct: false
  - text: Cambiar el signo de los términos al azar
    is_correct: false
  - text: Eliminar todos los exponentes
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar la clasificación según las reglas
