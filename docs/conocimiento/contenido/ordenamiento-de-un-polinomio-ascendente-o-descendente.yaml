semantic_id: MAT.ALG.POLINOMIOS.ORDENAMIENTO
resumen_inicial: 'Ordenamiento de un polinomio (ascendente o descendente): concepto
  y propiedades en Grado, ordenamiento e igualdad de polinomios.'
explicacion_simple: Tener los términos desordenados es como tener un diccionario sin
  orden alfabético. Para poder trabajar limpiamente con polinomios, la regla de etiqueta
  es ordenarlos.
explicacion_formal: "### Definición formal\n\nEl orden polinomial se basa puramente\
  \ en la secuencia de los exponentes de la variable elegida como referencia.\n\n\
  ### Desarrollo didáctico\n\nExisten dos formas de ordenar un polinomio respecto\
  \ a una variable:\n- **Orden Descendente (El más usado):** Del exponente más grande\
  \ al más pequeño. \n  Ej: $x^4 + x^3 - 2x^2 + 5x - 7$. (Los exponentes bajan: 4,\
  \ 3, 2, 1, y el término independiente que es 0).\n- **Orden Ascendente:** Del exponente\
  \ más pequeño al más grande. \n  Ej: $-7 + 5x - 2x^2 + x^3 + x^4$. (Los exponentes\
  \ suben: 0, 1, 2, 3, 4).\n\nPara ordenar, se mueven los términos completos con todo\
  \ y su signo. El término $-2x^2$ siempre será negativo, sin importar dónde lo coloques."
definiciones_clave: '- **Ordenamiento de un polinomio (ascendente o descendente)**:
  Elemento fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Ordenamiento de un polinomio (ascendente
  o descendente)**: Reglas de notación y clasificación en grado, ordenamiento e igualdad
  de polinomios.'
ejemplo_guiado:
  enunciado: Identifica o calcula los elementos correspondientes a ordenamiento de
    un polinomio (ascendente o descendente) en una expresión dada.
  pasos:
  - Analizar la expresión algebraica dada.
  - Aplicar los criterios de ordenamiento de un polinomio (ascendente o descendente).
  - Efectuar la clasificación o cálculo de grados/coeficientes según corresponda.
  - Escribir la respuesta final de forma ordenada.
checkpoints:
