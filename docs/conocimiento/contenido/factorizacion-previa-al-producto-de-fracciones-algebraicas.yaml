semantic_id: MAT.ALG.FRACCIONES_MULT.FACTORIZACION_PREVIA
resumen_inicial: 'La factorización previa al producto de fracciones algebraicas consiste en descomponer todos los numeradores y denominadores en sus factores primos antes de efectuar las multiplicaciones para simplificar el proceso.'
explicacion_simple: |
  Antes de multiplicar gigantescos polinomios en un producto de fracciones (ej: $\frac{x^2 - 4}{x^2 + 3x} \cdot \frac{x + 3}{x - 2}$):
  - **ESTRATEGIA INTELIGENTE: FACTORIZA PRIMERO**:
    1. **NUNCA multipliques de entrada polinomios desplegados** (crearás polinomios de grado 3 o 4 hiperdifíciles de simplificar).
    2. **Factoriza cada uno de los 4 componentes de las fracciones**:
       - Numerador 1: $x^2 - 4 = \mathbf{(x - 2)(x + 2)}$.
       - Denominador 1: $x^2 + 3x = \mathbf{x(x + 3)}$.
       - Numerador 2: $(x + 3)$.
       - Denominador 2: $(x - 2)$.
    3. **Escribe todo como una gran fracción factorizada única**:
       $$\frac{(x - 2)(x + 2) \cdot (x + 3)}{x(x + 3) \cdot (x - 2)}$$
  - ¡Ahora cancelar los paréntesis idénticos es facilísimo y rapidísimo!
explicacion_formal: |
  ### Definición formal
  Sean $\frac{P_1(x)}{Q_1(x)}$ y $\frac{P_2(x)}{Q_2(x)}$ con descomposiciones canónicas $P_i(x) = c_i \prod F_{i,j}(x)$ y $Q_i(x) = k_i \prod G_{i,j}(x)$. La **Estrategia de Factorización Previa al Producto** transforma la expresión original en la representación multiplicativa extendida:

  $$\frac{P_1(x)}{Q_1(x)} \cdot \frac{P_2(x)}{Q_2(x)} = \frac{\left(c_1 \prod F_{1,j}(x)\right) \cdot \left(c_2 \prod F_{2,j}(x)\right)}{\left(k_1 \prod G_{1,j}(x)\right) \cdot \left(k_2 \prod G_{2,j}(x)\right)}$$

  ### Ventaja Algebraica y Complejidad Reducida
  Multiplicar polinomios antes de factorizar eleva el grado del producto a $\operatorname{deg}(P_1) + \operatorname{deg}(P_2)$, complicando la factorización posterior. La factorización previa mantiene el grado de los factores primos bajo ($\le 2$), optimizando la cancelación exacta de factores.

  ### Síntesis didáctica
  Descomponer en factores primos todos los numeradores y denominadores antes de multiplicar evita expandir polinomios de alto grado y facilita la cancelación directa.
definiciones_clave: |
  - **Factorización previa**: Descomposición algebraica inicial de numeradores y denominadores antes de efectuar el producto fraccionario.
  - **Expresión multiplicativa extendida**: Fracción única que reúne todos los factores descompuestos del numerador y del denominador.
  - **Grado polinomial de factores**: Exponente máximo de las expresiones factorizadas que se mantiene bajo para simplificar la operación.
propiedades_relaciones: |
  - **Conmutatividad de factores multiplicativos**: Los factores dentro de la fracción única extendida pueden reordenarse libremente para cancelar términos idénticos.
ejemplo_guiado:
  enunciado: 'Aplica la factorización previa para preparar el producto $\frac{x^2 - 9}{2x + 6} \cdot \frac{x^2 + 2x}{x - 3}$.'
  pasos:
    - 'Paso 1: Factorizamos el primer numerador $x^2 - 9 = \mathbf{(x - 3)(x + 3)}$.'
    - 'Paso 2: Factorizamos el primer denominador $2x + 6 = \mathbf{2(x + 3)}$.'
    - 'Paso 3: Factorizamos el segundo numerador $x^2 + 2x = \mathbf{x(x + 2)}$.'
    - 'Paso 4: El segundo denominador $(x - 3)$ ya es irreducible.'
    - 'Paso 5: Armamos la fracción factorizada extendida:
       $\frac{(x - 3)(x + 3) \cdot x(x + 2)}{2(x + 3) \cdot (x - 3)}$.'
    - 'Conclusión: La expresión factorizada previa al producto es **$\frac{x(x - 3)(x + 3)(x + 2)}{2(x + 3)(x - 3)}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué se recomienda factorizar los polinomios ANTES de realizar las multiplicaciones de numeradores y denominadores?'
    choices:
      - {text: 'Porque evita elevar el grado de los polinomios resultantes y permite cancelar factores comunes de inmediato de forma simple', is_correct: true}
      - {text: 'Porque multiplicar polinomios no está permitido en matemáticas', is_correct: false}
      - {text: 'Porque cambia el resultado final', is_correct: false}
      - {text: 'Porque elimina las variables de la fracción', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque evita elevar el grado de los polinomios resultantes y permite cancelar factores comunes de inmediato de forma simple''. Eficiencia computacional de la factorización previa.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al preparar el producto $\frac{x^2 - 1}{x} \cdot \frac{x^2}{x + 1}$, ¿cómo se expresa el numerador de la fracción unificada factorizada?'
    choices:
      - {text: 'Se expresa como $(x - 1)(x + 1) \cdot x^2$, factorizando $x^2 - 1 = (x - 1)(x + 1)$', is_correct: true}
      - {text: 'Se expresa como $x^4 - 1$', is_correct: false}
      - {text: 'Se expresa como $x^3 - x$', is_correct: false}
      - {text: 'Se expresa como $(x - 1) x^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se expresa como $(x - 1)(x + 1) \cdot x^2$, factorizando $x^2 - 1 = (x - 1)(x + 1)$''. Factorización previa de la diferencia de cuadrados.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar cada uno de los numeradores y denominadores de las fracciones que se van a multiplicar.'
  - 'Paso 2: Factorizar completamente cada expresión utilizando factor común, diferencia de cuadrados o trinomios.'
  - 'Paso 3: Escribir el producto como una sola fracción colocando todos los factores del numerador arriba y del denominador abajo.'
  - 'Paso 4: Registrar las restricciones del dominio para todos los factores presentes en los denominadores.'
errores_correccion: |
  - **Error 1:** Multiplicar todos los polinomios desplegados creando términos de grado alto difícilmente factorizables. **Cómo corregirlo:** Se debe **FACTORIZAR OBLIGATORIAMENTE CADA POLINOMIO ANTES DE EFECTUAR LAS MULTIPLICACIONES**.
  - **Error 2:** Excluir la extracción del factor común numérico o monómico en los componentes antes de armar la fracción unificada. **Cómo corregirlo:** La factorización previa **DEBE SER COMPLETA, INCLUYENDO FACTORES COMUNES NUMÉRICOS O LITERALES EXTRÍNSECOS**.
ejemplos:
  - titulo: 'Diferencia de cuadrados previa'
    enunciado: 'Para $\frac{x^2 - 4}{3} \cdot \frac{6}{x + 2}$, ¿se factoriza $x^2 - 4 = (x - 2)(x + 2)$ primero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, permite simplificar $(x+2)$ directo.'
  - titulo: 'Trinomio mónico previo'
    enunciado: 'En $\frac{x^2 + 5x + 6}{x} \cdot \frac{1}{x + 3}$, ¿se descompone el trinomio en $(x + 2)(x + 3)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, facilita cancelar $(x+3)$.'
  - titulo: 'Factor común de número'
    enunciado: 'Para $\frac{2x + 4}{5} \cdot \frac{10}{x + 2}$, ¿se extrae 2 del primer numerador?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2(x+2)$.'
  - titulo: 'Componente ya irreducible'
    enunciado: 'Si un binomio es de la forma $x + 7$, ¿se mantiene igual en la fracción unificada?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es un factor primo irreducible.'
errores_frecuentes:
  - 'Multiplicar los polinomios desplegados generando expresiones complejas de grado alto.'
  - 'La extracción de los factores comunes de los términos no es ejecutada antes de unificar la fracción.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intentar simplificar términos sumandos antes de haber completado la factorización de todos los componentes.'
  - 'Los factores numéricos constantes son excluidos al descomponer los polinomios.'
afirmaciones_verdaderas:
  - 'La factorización previa simplifica la multiplicación de fracciones al evitar expandir polinomios de mayor grado.'
  - 'Todos los numeradores y denominadores deben descomposarse en factores primos irreducibles.'
al_terminar_debes_ponder: 'Factorizar completamente los numeradores y denominadores antes de efectuar el producto de fracciones algebraicas.'
