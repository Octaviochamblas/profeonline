semantic_id: MAT.ALG.FRACCIONES_MULT.FACTORIZACION_PREVIA
resumen_inicial: 'Factorización previa al producto de fracciones algebraicas: concepto,
  reglas operativas y simplificación en Multiplicación de fracciones algebraicas.'
explicacion_simple: 'Si multiplicas polinomios grandes directamente, crearás un expresiones
  complejas de alto grado casi imposible de simplificar después. La regla de oro es:
  Factoriza todo primero.'
explicacion_formal: '### Definición formal


  Al tener todo como multiplicaciones, se puede cancelar directo.


  ### Desarrollo didáctico


  Si te lanzas a multiplicar directamente polinomios extensos (ej: $(x^2 - 4) \cdot
  (x^2 + 5x + 6)$), vas a terminar con un expresiones complejas polinómico de grado
  4 que será casi imposible de simplificar al final.


  La ley de oro antes de multiplicar cualquier fracción compleja es **FACTORIZAR TODO
  PRIMERO**.

  Debes desarmar cada numerador y cada denominador en pequeños paréntesis (factores).


  ¿Por qué? Porque al multiplicar, esos pequeños paréntesis quedarán todos juntos,
  pegados por multiplicaciones, en una sola gran fracción. Y como están multiplicando,
  te será muy fácil tachar (simplificar) los paréntesis idénticos de arriba con los
  de abajo antes de calcular nada grande.'
definiciones_clave: '- **Factorización previa al producto de fracciones algebraicas**:
  Procedimiento o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a factorización previa al producto
  de fracciones algebraicas.'
ejemplo_guiado:
  enunciado: Simplifica o resuelve la expresión aplicando factorización previa al
    producto de fracciones algebraicas.
  pasos:
  - Factorizar los numeradores y denominadores involucrados.
  - Identificar restricciones del dominio (denominador no nulo).
  - Aplicar la regla o procedimiento correspondiente a factorización previa al producto
    de fracciones algebraicas.
  - Simplificar los factores comunes y escribir el resultado final irreducible.
