semantic_id: MAT.ALG.FRACCIONES_MULT.FACTORIZACION_PREVIA
resumen_inicial: Factorizar numeradores y denominadores antes de multiplicar simplifica
  el cálculo y evita trabajar con polinomios de grado elevado.
explicacion_simple: 'Si multiplicamos dos fracciones polinomiales directamente sin
  factorizar primero, obtendremos numeradores y denominadores muy largos y difíciles
  de simplificar después.

  La estrategia inteligente consiste en factorizar TODOS los numeradores y denominadores
  ANTES de multiplicar.

  Al tener todos los términos expresados como productos de factores simples entre
  paréntesis, es sumamente fácil identificar y cancelar factores idénticos arriba
  y abajo.'
explicacion_formal: 'Dadas $\frac{P_1(x)}{Q_1(x)}$ y $\frac{P_2(x)}{Q_2(x)}$, la **estrategia
  de factorización previa** transforma la multiplicación en:


  $$\frac{A(x) \cdot C(x)}{B(x) \cdot D(x)} \cdot \frac{E(x) \cdot B(x)}{F(x) \cdot
  C(x)} = \frac{A(x) \cdot E(x)}{D(x) \cdot F(x)}$$


  **Desglose de la fórmula:**

  - $B(x), C(x)$: Factores polinomiales comunes que se identifican gracias a la factorización
  previa y se cancelan antes de desarrollar los productos polinomiales desmesurados.'
definiciones_clave: '- **Factorización previa**: Descomposición en factores irreductibles
  de todas las expresiones involucradas antes de operar.

  - **Optimización del producto**: Reducción del grado polinomial de los términos
  a multiplicar mediante simplificación anticipada.'
propiedades_relaciones: '- **Eficiencia algebraica**: Evita desarrollar productos
  de polinomios de grado $n$ para luego tener que aplicar división sintética o métodos
  complejos de factorización sobre grados mayores.

  - **Preservación de restricciones**: Las restricciones se anotan observando las
  factorizaciones completas de $Q_1(x)$ y $Q_2(x)$.'
ejemplo_guiado:
  enunciado: Aplica factorización previa para resolver la multiplicación $\frac{x^2
    - 9}{x + 2} \cdot \frac{x^2 + 4x + 4}{x - 3}$, y evalúa la expresión simplificada
    para $x = 1$.
  pasos:
  - 'Paso 1: Factorizar el primer numerador $x^2 - 9 = (x - 3)(x + 3)$.Paso 2: Factorizar
    el segundo numerador $x^2 + 4x + 4 = (x + 2)^2$.Paso 3: Escribir el producto con
    los términos factorizados: $\frac{(x - 3)(x + 3)}{x + 2} \cdot \frac{(x + 2)^2}{x
    - 3}$.Paso 4: Cancelar factores comunes en numeradores y denominadores: $(x -
    3)$ y $(x + 2)$.Paso 5: Obtener el producto simplificado: $(x + 3)(x + 2) = x^2
    + 5x + 6$ para $x \neq -2$ y $x \neq 3$.Paso 6: Evaluar para $x = 1$: $(1 + 3)(1
    + 2) = 4 \cdot 3 = 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es recomendable factorizar todos los polinomios antes de efectuar
    la multiplicación de fracciones algebraicas?
  choices:
  - text: Porque permite cancelar factores comunes de inmediato y evita multiplicar
      polinomios de grado elevado.
    is_correct: true
  - text: Porque la multiplicación solo se puede realizar si los polinomios son de
      grado 1.
    is_correct: false
  - text: Porque elimina los coeficientes numéricos de las fracciones.
    is_correct: false
  - text: Porque convierte las fracciones en números enteros sin variables.
    is_correct: false
  explanation: La alternativa correcta es 'Porque permite cancelar factores comunes
    de inmediato y evita multiplicar polinomios de grado elevado.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar la multiplicación $\frac{x^2 - 9}{x + 2} \cdot \frac{x^2
    + 4x + 4}{x - 3}$ y evaluar para $x = 1$, ¿cuál es el valor obtenido?
  choices:
  - text: $12$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $24$
    is_correct: false
  - text: $16$
    is_correct: false
  explanation: La alternativa correcta es '$12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los numeradores.'
- 'Paso 2: Factorizar completamente cada uno de los denominadores.'
- 'Paso 3: Expresar toda la operación como una única barra de fracción con los factores
  del numerador arriba y los del denominador abajo.'
- 'Paso 4: Tachar o cancelar los paréntesis y factores comunes que aparezcan arriba
  y abajo.'
- 'Paso 5: Multiplicar los factores restantes irreductibles.'
errores_correccion: '- **Error común:** Desarrollar los productos polinomiales expandidos
  (ejemplo: multiplicar $(x^2 - 9)(x^2 + 4x + 4)$ obteniendo grado 4) antes de intentar
  factorizar.

  - **Cómo corregirlo:** NUNCA expandas ni multipliques polinomios entre paréntesis
  si antes no has intentado simplificar cancelando factores comunes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Es válida la regla?
  respuesta: Sí
  solucion_pasos:
  - Sí, por propiedad.
- titulo: ¿Se pueden cancelar sumandos?
  respuesta: 'No'
  solucion_pasos:
  - No, solo factores.
errores_frecuentes:
- Multiplicar en cruz las fracciones al realizar un producto.
- Sumar los denominadores en lugar de multiplicarlos.
- Cancelar términos sumandos en lugar de factores multiplicativos.
- Olvidar declarar las restricciones de los denominadores originales.
- Desarrollar polinomios largos antes de intentar simplificar.
afirmaciones_verdaderas:
- En la multiplicación de fracciones algebraicas se multiplican numeradores entre
  sí y denominadores entre sí.
- La simplificación previa mediante factorización evita trabajar con polinomios de
  grado innecesariamente alto.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular y simplificar productos
  de fracciones algebraicas expresando el resultado en su forma irreducible.
