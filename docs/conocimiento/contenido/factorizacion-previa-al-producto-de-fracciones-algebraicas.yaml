semantic_id: MAT.ALG.FRACCIONES_MULT.FACTORIZACION_PREVIA
resumen_inicial: La factorización previa al producto de fracciones algebraicas consiste en descomponer todos los numeradores y denominadores en sus factores primos antes de efectuar las multiplicaciones para simplificar el proceso.
explicacion_simple: |
  Antes de multiplicar polinomios extensos en un producto de fracciones (por ejemplo: $\frac{x^2 - 4}{x^2 + 3x} \cdot \frac{x + 3}{x - 2}$):

  1. **Evitamos multiplicar polinomios desplegados**: si multiplicamos de entrada, generamos polinomios de grado 3 o 4 extremadamente complejos de simplificar después.
  2. **Factorizamos previamente los 4 componentes**:
     - Numerador 1: $x^2 - 4 = (x - 2)(x + 2)$.
     - Denominador 1: $x^2 + 3x = x(x + 3)$.
     - Numerador 2: $(x + 3)$ (irreducible).
     - Denominador 2: $(x - 2)$ (irreducible).
  3. **Escribimos todo en una única fracción factorizada unificada**:
     $$\frac{(x - 2)(x + 2) \cdot (x + 3)}{x(x + 3) \cdot (x - 2)}$$

  De esta forma, la cancelación de factores idénticos entre el numerador y el denominador resulta inmediata.
explicacion_formal: |
  ### Definición formal
  Sean $\frac{P_1(x)}{Q_1(x)}$ y $\frac{P_2(x)}{Q_2(x)}$ con descomposiciones canónicas $P_i(x) = c_i \prod F_{i,j}(x)$ y $Q_i(x) = k_i \prod G_{i,j}(x)$. La **Estrategia de Factorización Previa al Producto** transforma la expresión en una estructura multiplicativa extendida:

  $$\frac{P_1(x)}{Q_1(x)} \cdot \frac{P_2(x)}{Q_2(x)} = \frac{\left(c_1 \prod F_{1,j}(x)\right) \cdot \left(c_2 \prod F_{2,j}(x)\right)}{\left(k_1 \prod G_{1,j}(x)\right) \cdot \left(k_2 \prod G_{2,j}(x)\right)}$$

  ### Ventaja Algebraica
  Multiplicar polinomios antes de factorizar eleva el grado del producto a $\operatorname{deg}(P_1) + \operatorname{deg}(P_2)$. La factorización previa mantiene el grado de los factores en su mínima expresión ($\le 2$), permitiendo la cancelación exacta de factores comunes.

  ### Síntesis didáctica
  Descomponer en factores primos todos los numeradores y denominadores antes de multiplicar evita expandir polinomios de alto grado y facilita la cancelación simplificada.
definiciones_clave: |
  - **Factorización previa**: Descomposición algebraica inicial de numeradores y denominadores antes de efectuar el producto fraccionario.
  - **Expresión multiplicativa extendida**: Fracción unificada que reúne todos los factores descompuestos del numerador y del denominador.
  - **Factor primo irreducible**: Polinomio de grado mínimo que no admite descomposiciones cuadráticas o lineales adicionales sobre el cuerpo real.
propiedades_relaciones: |
  - **Conmutatividad de factores multiplicativos**: Los factores dentro de la fracción única extendida pueden reordenarse libremente para cancelar términos idénticos.
  - **Preservación del conjunto de restricciones**: Las restricciones de los denominadores $Q_1(x) \neq 0$ y $Q_2(x) \neq 0$ deben establecerse sobre los factores iniciales descompuestos.
ejemplo_guiado:
  enunciado: 'Aplica la factorización previa para preparar el producto $\frac{x^2 - 9}{2x + 6} \cdot \frac{x^2 + 2x}{x - 3}$.'
  pasos:
    - 'Paso 1: Factorizar el primer numerador: $x^2 - 9 = (x - 3)(x + 3)$.'
    - 'Paso 2: Factorizar el primer denominador: $2x + 6 = 2(x + 3)$.'
    - 'Paso 3: Factorizar el segundo numerador: $x^2 + 2x = x(x + 2)$.'
    - 'Paso 4: Identificar que el segundo denominador $(x - 3)$ ya es un factor primo irreducible.'
    - 'Paso 5: Armar la fracción factorizada extendida unificada: $\frac{(x - 3)(x + 3) \cdot x(x + 2)}{2(x + 3) \cdot (x - 3)}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué es recomendable factorizar los polinomios ANTES de multiplicar numeradores y denominadores entre sí?'
    choices:
      - {text: 'Porque evita elevar el grado de los polinomios resultantes y facilita la cancelación inmediata de factores comunes', is_correct: true}
      - {text: 'Porque la multiplicación de polinomios desplegados está prohibida en álgebra', is_correct: false}
      - {text: 'Porque la factorización previa altera el resultado numérico final de la fracción', is_correct: false}
      - {text: 'Porque elimina automáticamente todas las variables del denominador', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque evita elevar el grado de los polinomios resultantes y facilita la cancelación inmediata de factores comunes''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al preparar el producto $\frac{x^2 - 1}{x} \cdot \frac{x^2}{x + 1}$, ¿cómo se expresa el numerador de la fracción unificada factorizada?'
    choices:
      - {text: '$(x - 1)(x + 1) \cdot x^2$', is_correct: true}
      - {text: '$x^4 - 1$', is_correct: false}
      - {text: '$x^3 - x$', is_correct: false}
      - {text: '$(x - 1) x^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(x - 1)(x + 1) \cdot x^2$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar individualmente cada uno de los numeradores y denominadores de las fracciones.'
  - 'Paso 2: Factorizar completamente cada expresión utilizando factor común, diferencia de cuadrados o trinomios.'
  - 'Paso 3: Escribir el producto como una sola fracción unificada agrupando todos los factores del numerador arriba y del denominador abajo.'
  - 'Paso 4: Registrar las restricciones del dominio para todos los factores presentes en los denominadores.'
errores_correccion: |
  - **Error 1:** Multiplicar todos los polinomios desplegados creando términos de grado alto difícilmente factorizables. **Cómo corregirlo:** Se debe **FACTORIZAR OBLIGATORIAMENTE CADA POLINOMIO ANTES DE EFECTUAR LAS MULTIPLICACIONES DE NUMERADORES Y DENOMINADORES**.
  - **Error 2:** Omitir la extracción del factor común numérico o monómico en los componentes antes de armar la fracción unificada. **Cómo corregirlo:** La factorización previa **DEBE SER COMPLETA, EX TRAYENDO FACTORES COMUNES NUMÉRICOS O LITERALES DESDE EL INICIO**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Al aplicar la factorización previa a $\frac{x^2 - 9}{2x + 6} \cdot \frac{x^2 + 2x}{x - 3}$, ¿cuál es la expresión factorizada unificada?'
    alternativas:
      - '$\frac{(x-3)(x+3) \cdot x(x+2)}{2(x+3)(x-3)}$'
      - '$\frac{(x-9)(x+2)}{2x(x-3)}$'
      - '$\frac{(x+3)^2}{2(x-3)}$'
    respuesta: '$\frac{(x-3)(x+3) \cdot x(x+2)}{2(x+3)(x-3)}$'
    solucion_pasos:
      - '1. Factorizar $x^2 - 9 = (x-3)(x+3)$.'
      - '2. Factorizar $2x + 6 = 2(x+3)$.'
      - '3. Factorizar $x^2 + 2x = x(x+2)$.'
      - '4. Expresar la fracción unificada: $\frac{(x-3)(x+3) \cdot x(x+2)}{2(x+3)(x-3)}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al preparar $\frac{x^2 - 4}{x} \cdot \frac{3}{x + 2}$, ¿cuál es la descomposición del numerador unificado?'
    alternativas:
      - '$(x-2)(x+2) \cdot 3$'
      - '$(x-4) \cdot 3$'
      - '$(x+2)^2 \cdot 3$'
    respuesta: '$(x-2)(x+2) \cdot 3$'
    solucion_pasos:
      - '1. Factorizar la diferencia de cuadrados: $x^2 - 4 = (x-2)(x+2)$.'
      - '2. Multiplicar por el segundo numerador 3: $(x-2)(x+2) \cdot 3$.'
  - titulo: 'Factor común numérico'
    enunciado: 'Para $\frac{2x + 4}{5} \cdot \frac{10}{x + 2}$, ¿se extrae el factor 2 del primer numerador?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se factoriza como $2(x+2)$ facilitando la cancelación.'
  - titulo: 'Componente irreducible'
    enunciado: 'Si un binomio es de la forma $x + 7$, ¿se conserva exactamente igual en la fracción unificada?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser un factor primo no admite mayor descomposición.'
errores_frecuentes:
  - 'Multiplicar los polinomios desplegados generando expresiones complejas de grado alto.'
  - 'Omitir la extracción de factores comunes numéricos o monómicos antes de unificar la fracción.'
  - 'Expandir los productos de binomios antes de intentar cancelar factores comunes.'
  - 'Intentar simplificar términos sumandos antes de haber completado la factorización de todos los componentes.'
  - 'Excluir los factores numéricos constantes al descomponer los polinomios.'
afirmaciones_verdaderas:
  - 'La factorización previa simplifica la multiplicación de fracciones al evitar expandir polinomios de mayor grado.'
  - 'Todos los numeradores y denominadores deben descomponerse en factores primos irreducibles.'
al_terminar_debes_poder: |
  QUÉ: Descomponer previamente en factores los componentes de un producto de fracciones algebraicas.
  CÓMO: Factorizar individualmente numeradores y denominadores mediante factor común, diferencia de cuadrados o trinomios para armar una fracción unificada.
