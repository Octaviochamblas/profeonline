procedimiento:
- 'Paso 1: Revisa el primer numerador y factorízalo si es posible.'
- 'Paso 2: Revisa el primer denominador y factorízalo.'
- 'Paso 3: Repite para la segunda fracción.'
- 'Paso 4: Reescribe la multiplicación usando solo los factores.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en factorización previa al producto de fracciones algebraicas.
ejemplos:
- titulo: 'Prepara para multiplicar factorizando: $\frac{x^2-9}{x^2+3x} \cdot \frac{5}{x-3}$'
  enunciado: 'Prepara para multiplicar factorizando: $\frac{x^2-9}{x^2+3x} \cdot \frac{5}{x-3}$.'
  solucion_pasos:
  - 'Numerador 1: $(x-3)(x+3)$.'
  - 'Denominador 1: $x(x+3)$.'
  - Fracción 2 ya es irreducible.
  - 'Resultado preparado: $\frac{(x-3)(x+3)}{x(x+3)} \cdot \frac{5}{x-3}$.'
- titulo: 'Factoriza la expresión antes de multiplicar: $\frac{2x+4}{3} \cdot \frac{x}{x+2}$.'
  solucion_pasos:
  - Factor común 2 en 2x+4.
- titulo: 'Respecto de «Factorización previa al producto de fracciones algebraicas»:
    ¿Es correcta esta'
  enunciado: 'Respecto de «Factorización previa al producto de fracciones algebraicas»:
    ¿Es correcta esta caracterización? «Antes de multiplicar fracciones con polinomios,
    factoriza completamente cada numerador y cada denominador»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Antes de multiplicar fracciones
    con polinomios, factoriza completamente cada numerador y cada denominador.'
- titulo: 'Respecto de «Factorización previa al producto de fracciones algebraicas»:
    ¿Es válida esta af'
  enunciado: 'Respecto de «Factorización previa al producto de fracciones algebraicas»:
    ¿Es válida esta afirmación? «Multiplicar los polinomios en forma expandida y perder
    la oportunidad de simplificar»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Antes de multiplicar fracciones
    con polinomios, factoriza completamente cada numerador y cada denominador.'
errores_frecuentes:
- Multiplicar los polinomios en forma expandida y perder la oportunidad de simplificar.
- Para «El propósito principal de factorizar antes de multiplicar fracciones algebraicas
  es:», la respuesta correcta es Aumentar el grado del polinomio.
- Para «El propósito principal de factorizar antes de multiplicar fracciones algebraicas
  es:», la respuesta correcta es Eliminar los denominadores.
- Para «El propósito principal de factorizar antes de multiplicar fracciones algebraicas
  es:», la respuesta correcta es Cambiar los signos.
- $\frac{x^2-16}{x(x+4)} \cdot \frac{x^2}{x-4}$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando factorización
