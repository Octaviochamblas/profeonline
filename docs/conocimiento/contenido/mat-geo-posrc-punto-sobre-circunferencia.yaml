semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.PUNTO_SOBRE_CIRCUNFERENCIA
resumen_inicial: 'Determinación de un punto sobre una circunferencia mediante distancia
  al centro: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: Un punto pertenece a la circunferencia (no está ni dentro ni fuera)
  exactamente cuando su distancia al centro coincide con el radio.
explicacion_formal: '![Punto sobre una circunferencia](/static/img/geometria/analitica/posrc-punto-sobre-circunferencia.svg)


  ### Definición formal


  Un punto pertenece a la circunferencia si su distancia al centro es exactamente
  igual al radio: $d(P,\text{centro})=r$.


  ### Desarrollo didáctico


  Para la circunferencia $x^2+y^2=25$ (centro (0,0), radio 5) y el punto $P(3,4)$:
  $d=\sqrt{9+16}=\sqrt{25}=5=r$, por lo que $P$ está exactamente sobre la circunferencia.'
