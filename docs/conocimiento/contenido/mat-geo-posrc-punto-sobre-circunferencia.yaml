procedimiento:
- 'Paso 1: Identifica el centro y el radio de la circunferencia.'
- 'Paso 2: Calcula la distancia entre el punto dado y el centro de la circunferencia.'
- 'Paso 3: Si esa distancia es exactamente igual al radio, el punto está sobre la
  circunferencia.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
