  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar la variable y el valor máximo permitido.
- Relacionar ambos términos con el símbolo $\\leq$.
- Comprobar que la igualdad es un escenario posible.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en uso del símbolo menor o
  igual que.
