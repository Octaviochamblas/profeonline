errores_frecuentes:
- La desigualdad $a \\leq b$ indica que $a$ debe ser estrictamente menor.
- La notación $\\leq$ no permite resolver inecuaciones.
- Para que $a \\leq b$ sea verdadero, deben cumplirse simultáneamente $a < b$ y $a
  = b$.
- El símbolo $\\leq$ no representa una relación matemática válida.
- Todo número positivo es $\\leq$ cero.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  uso del símbolo menor o igual que.
