semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.SIMBOLO_MENOR_IGUAL
resumen_inicial: 'Uso del símbolo menor o igual que: relaciones de orden, intervalos
  y resolución en Relación de orden y símbolos de desigualdad.'
explicacion_simple: Frecuentemente es necesario establecer que una cantidad no puede
  exceder cierto tope máximo.
explicacion_formal: '### Definición formal

  Para $a, b \\in \\mathbb{R}$, $a \\leq b$ si y solo si $a < b$ o $a = b$. Es una
  relación de orden parcial.


  ### Desarrollo didáctico

  Gráficamente, en intervalos, una desigualdad con $\\leq$ se denota mediante un corchete
  o un punto cerrado en el extremo superior.'
definiciones_clave: '- **Uso del símbolo menor o igual que**: Concepto fundamental
  de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a uso del símbolo menor o igual que.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de uso del símbolo
    menor o igual que.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de uso del símbolo menor o igual que, invirtiendo
    el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
