semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.SIMBOLO_MENOR_IGUAL
resumen_inicial: El símbolo menor o igual que ($\le$) indica que la cantidad de la
  izquierda es inferior o equivalente a la de la derecha.
explicacion_simple: 'El símbolo **menor o igual que** ($\le$) establece un límite
  superior inclusivo.

  Escribir $a \le b$ significa que $a$ es menor que $b$, O bien que $a$ es igual a
  $b$.

  Se utiliza frecuentemente en restricciones del tipo ''como máximo'' o ''no más de''
  (por ejemplo: ''la capacidad $x$ es como máximo 50'' se escribe $x \le 50$).'
explicacion_formal: 'Para toda pareja de números reales $a, b \in \mathbb{R}$, la
  relación **no estricta menor o igual que** se define formalmente como:


  $$a \le b \iff (a < b) \quad \lor \quad (a = b)$$


  **Desglose de la fórmula:**

  - Límite superior no estricto donde el cota derecho $b$ pertenece al conjunto de
  valores permitidos.'
definiciones_clave: '- **Símbolo menor o igual que ($\le$)**: Operador de orden amplio
  que establece una cota superior inclusiva.

  - **Cota superior inclusiva**: Valor máximo $b$ que la variable puede alcanzar o
  igualar.'
propiedades_relaciones: '- **Negación lógica**: La negación formal de $a \le b$ es
  la desigualdad estricta $a > b$.'
ejemplo_guiado:
  enunciado: Evalúa si los valores $x = -4$, $x = 0$ y $x = 3$ satisfacen la restricción
    de límite superior $x \le 0$.
  pasos:
  - 'Paso 1: Evaluar para $x = -4$: $-4 < 0$ es verdadero $\implies -4 \le 0$ es VERDADERO.'
  - 'Paso 2: Evaluar para $x = 0$: $0 = 0$ es verdadero $\implies 0 \le 0$ es VERDADERO.'
  - 'Paso 3: Evaluar para $x = 3$: $3 < 0$ es falso y $3 = 0$ es falso $\implies 3
    \le 0$ es FALSO.'
  - 'Paso 4: Concluir que el conjunto de soluciones incluye a los números negativos
    y al cero exacto.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión verbal que se traduce con el símbolo menor o igual
    que ($\le$)?
  choices:
  - text: '''Como máximo'' o ''a lo sumo''.'
    is_correct: true
  - text: '''Estrictamente mayor que''.'
    is_correct: false
  - text: '''Como mínimo'' o ''al menos''.'
    is_correct: false
  - text: '''Diferente de''.'
    is_correct: false
  explanation: La alternativa correcta es ''Como máximo' o 'a lo sumo'.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar $x = 0$ en la desigualdad $x \le 0$, ¿por qué la relación es
    válida?
  choices:
  - text: Porque incluye la igualdad ($0 = 0$).
    is_correct: true
  - text: Porque 0 es menor que 0.
    is_correct: false
  - text: Porque 0 es un número negativo.
    is_correct: false
  - text: Porque elimina la variable.
    is_correct: false
  explanation: La alternativa correcta es 'Porque incluye la igualdad ($0 = 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si el término de la izquierda es menor que el de la derecha.'
- 'Paso 2: Verificar si el término de la izquierda es igual al de la derecha.'
- 'Paso 3: Confirmar la veracidad si al menos una de las dos condiciones es satisfecha.'
errores_correccion: '- **Error común:** Confundir ''como máximo'' ($\le$) con ''como
  mínimo'' ($\ge$).

  - **Cómo corregirlo:** ''Como máximo 50'' significa que NO puedes superar 50, de
  modo que $x \le 50$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
  - 'La desigualdad no estricta $x \le 8$ excluye el valor límite $x = 8$ del conjunto solución.'
  - 'La proposición numérica $8 \le 8$ se evalúa como falsa por no ser $8$ menor que $8$.'
  - 'La expresión $x \le 8$ en los números reales permite valores mayores a 8 como $x = 8{,}1$.'
  - 'Al graficar $x \le 8$ en la recta numérica, la región pintada se extiende hacia la derecha ilimitadamente.'
  - 'El símbolo $\le$ se traduce en lenguaje verbal mediante las frases "estrictamente menor que" o "por debajo de".'
afirmaciones_verdaderas:
  - 'El símbolo $\le$ expresa la relación "menor o igual que", incluyendo la frontera superior en el conjunto solución.'
  - 'La desigualdad $x \le 8$ equivale al intervalo semirrecta $]-\infty, 8]$.'
al_terminar_debes_poder: |
  QUÉ: Emplear e interpretar el símbolo de desigualdad "menor o igual que" ($\le$).
  CÓMO: Incluir la cota superior en el conjunto solución, graficar el intervalo semirrecta con punto cerrado en la recta real y evaluar restricciones de cota.
fuente: 'Texto escolar MINEDUC — Álgebra / Desigualdades e Inecuaciones'
