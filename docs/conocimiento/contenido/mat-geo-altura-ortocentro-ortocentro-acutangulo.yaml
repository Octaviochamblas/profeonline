semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_ACUTANGULO
resumen_inicial: 'Ubicación interior del ortocentro en un triángulo acutángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: La posición del ortocentro respecto al triángulo depende del tipo
  de triángulo; en el caso acutángulo, cae siempre dentro.
explicacion_formal: '![Ortocentro interior en triángulo acutángulo](/static/img/geometria/elementos-secundarios/altura-ortocentro-ortocentro-acutangulo.svg)


  ### Definición formal


  Si los tres ángulos interiores de un triángulo son agudos (menores que 90°), el
  ortocentro H se ubica en el interior de la región triangular.


  ### Desarrollo didáctico


  En un triángulo acutángulo, las tres alturas caen dentro de la figura (sus pies
  están dentro de los lados correspondientes), por lo que su punto de intersección
  también queda dentro.'
