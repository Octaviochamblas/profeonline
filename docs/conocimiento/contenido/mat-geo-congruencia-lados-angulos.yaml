semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CORRESPONDENCIA_LADOS_ANGULOS
resumen_inicial: 'Correspondencia de lados y ángulos homólogos en triángulos congruentes:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: 'Una vez establecida la correspondencia de vértices, se puede
  dar el siguiente paso: identificar qué lados y qué ángulos son homólogos, y verificar
  que en triángulos congruentes son siempre iguales.'
explicacion_formal: '![Correspondencia de lados y ángulos homólogos](/static/img/geometria/congruencia-semejanza/congruencia-lados-angulos.svg)


  ### Definición formal


  Si $\triangle ABC\cong\triangle A''B''C''$, entonces $AB=A''B''$, $BC=B''C''$, $CA=C''A''$,
  y $\angle A=\angle A''$, $\angle B=\angle B''$, $\angle C=\angle C''$.


  ### Desarrollo didáctico


  Esta propiedad es justamente lo que hace "iguales" a dos triángulos congruentes:
  no solo los vértices se corresponden, sino que cada lado y cada ángulo homólogo
  comparte exactamente la misma medida, sin excepción.'
definiciones_clave: '- **Correspondencia de lados y ángulos homólogos en triángulos
  congruentes**: Elemento o propiedad fundamental en el estudio de congruencia, semejanza
  y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a correspondencia de lados y ángulos homólogos
  en triángulos congruentes.'
ejemplo_guiado:
  enunciado: Para analizar correspondencia de lados y ángulos homólogos en triángulos
    congruentes, considera un ángulo $\alpha = 135^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1092^\circ = 135^\circ$.
  pasos:
  - Identificar la propiedad de correspondencia de lados y ángulos homólogos en triángulos
    congruentes referida a $\alpha = 135^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1092 = 135 \implies x = 135 - 1092$.'
  - Concluir que la medida calculada para correspondencia de lados y ángulos homólogos
    en triángulos congruentes es $x = -957^\circ$.
