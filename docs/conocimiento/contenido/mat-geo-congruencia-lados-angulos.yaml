procedimiento:
- 'Paso 1: Determina la correspondencia de vértices entre los dos triángulos.'
- 'Paso 2: Identifica cada lado homólogo (formado por vértices correspondientes) y
  cada ángulo homólogo.'
- 'Paso 3: Concluye que cada par de lados homólogos y cada par de ángulos homólogos
  son iguales.'
