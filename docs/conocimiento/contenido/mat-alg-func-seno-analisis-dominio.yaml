semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.DOMINIO
resumen_inicial: 'Determinación del dominio de la función seno: círculo unitario,
  amplitud, período y transformaciones de Análisis de la función seno.'
explicacion_simple: A diferencia de otras funciones estudiadas, el seno no tiene ninguna
  restricción sobre los valores que puede tomar su variable independiente.
explicacion_formal: '### Definición formal


  Para cualquier $x\in\mathbb{R}$, existe un ángulo (en radianes) con esa medida,
  y ese ángulo siempre determina un único punto sobre el círculo unitario. Por lo
  tanto, $\sin(x)$ está definido para todo $x$ real, sin excepciones.


  ### Desarrollo didáctico


  A diferencia de $f(x)=\sqrt{x}$ (que excluye negativos) o $f(x)=1/x$ (que excluye
  el $0$), la función $f(x)=\sin(x)$ puede evaluarse en cualquier número, incluidos
  valores muy grandes o muy negativos, como $\sin(1000)$ o $\sin(-50)$.'
definiciones_clave: '- **Determinación del dominio de la función seno**: Función periódica
  fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación del dominio de la función seno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación del dominio de la función seno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación del dominio de la función seno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se definen analíticamente el seno y el coseno en el círculo unitario
    para determinación del dominio de la función seno?
  choices:
  - text: Identificar las coordenadas (cos x, sen x) en el círculo unitario para definir
      análisis de la función seno
    is_correct: true
  - text: Como la suma de los catetos en cualquier triángulo rectángulo no unitario
    is_correct: false
  - text: Igualando la variable del ángulo a cero siempre
    is_correct: false
  - text: Multiplicando el radio por pi elevado a x
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar las coordenadas (cos x, sen
    x) en el círculo unitario para definir análisis de la función seno. Definición
    canónica de las funciones trigonométricas en el círculo unitario.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determinan el período T y la amplitud A de una función de la
    forma f(x) = A sen(Bx + C) + D en determinación del dominio de la función seno?
  choices:
  - text: Calcular el período como T = 2pi / |B| y la amplitud como |A|
    is_correct: true
  - text: Sumando A + B + C + D independientemente
    is_correct: false
  - text: Igualando la amplitud a 2pi y el período a 1
    is_correct: false
  - text: Dividiendo A entre 2pi sin considerar B
    is_correct: false
  explanation: 'La alternativa correcta es: Calcular el período como T = 2pi / |B|
    y la amplitud como |A|. Fórmulas estándar para amplitud y período en funciones
    sinusoidales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Recuerda que cualquier número real representa una medida angular válida.'
- 'Paso 2: Verifica que todo ángulo determina un punto sobre el círculo unitario.'
- 'Paso 3: Concluye que el dominio de $\sin(x)$ es todo $\mathbb{R}$, sin restricciones.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en determinación del dominio
  de la función seno.
ejemplos:
- titulo: Verificación de un valor grande dentro del dominio
  enunciado: ¿Está definido $\sin(1000)$?
  solucion_pasos:
  - $1000$ es un número real, así que representa un ángulo válido (aunque grande).
  - Sí, $\sin(1000)$ está definido, con un valor entre $-1$ y $1$.
- titulo: Verificación de un valor negativo dentro del dominio
  enunciado: ¿Está definido $\sin(-7)$?
  solucion_pasos:
  - $-7$ es un número real, así que representa un ángulo válido.
  - Sí, $\sin(-7)$ está definido.
- titulo: ¿Existe algún número real que no pertenezca al dominio de $\sin(x)$?
  enunciado: ¿Existe algún valor real de $x$ para el cual $\sin(x)$ no esté definido?
  respuesta: 'No'
  solucion_pasos:
  - Todo número real representa una medida angular válida, así que el dominio es completo.
- titulo: ¿El dominio de la función seno es distinto del dominio de la función coseno?
  enunciado: ¿El dominio de $f(x)=\sin(x)$ es distinto del dominio de $g(x)=\cos(x)$?
  respuesta: 'No'
  solucion_pasos:
  - Ambas funciones comparten el mismo dominio: todo $\mathbb{R}$.
errores_frecuentes:
- Suponer que el dominio se restringe a valores entre $0$ y $2\pi$.
- Confundir el dominio con el recorrido, que sí está acotado entre $-1$ y $1$.
- Creer que valores muy grandes de $x$ generan resultados indefinidos.
- No reconocer que cualquier número real representa un ángulo válido.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  determinación del dominio de la función seno.
