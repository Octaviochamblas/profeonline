semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ALTURA_DEFINICION
resumen_inicial: 'Definición de altura como segmento perpendicular desde un vértice
  al lado opuesto o a su prolongación: conceptos, teoremas, propiedades geométricas
  y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: De los tres segmentos notables que se pueden trazar desde un vértice,
  la altura es el que cae perpendicularmente sobre el lado opuesto (o su prolongación).
explicacion_formal: '![Altura de un triángulo](/static/img/geometria/elementos-secundarios/altura-ortocentro-altura-definicion.svg)


  ### Definición formal


  La altura desde el vértice A de un triángulo ABC es el segmento AH'', donde H''
  es el pie de la perpendicular trazada desde A hacia la recta que contiene a BC.


  ### Desarrollo didáctico


  En un triángulo ABC, la altura desde A cae perpendicularmente sobre BC (o su prolongación
  si el triángulo es obtusángulo). Cada triángulo tiene tres alturas, una por cada
  vértice.'
definiciones_clave: '- **Definición de altura como segmento perpendicular desde un
