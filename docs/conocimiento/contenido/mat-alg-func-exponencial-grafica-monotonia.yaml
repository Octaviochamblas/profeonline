semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MONOTONIA
resumen_inicial: 'La monotonía de $f(x) = a \cdot b^x$ (con $a > 0$) depende exclusivamente
  de la base $b$: creciente si $b > 1$ y decreciente si $0 < b < 1$.'
explicacion_simple: 'Para determinar la **monotonía** (si la función sube o baja)
  en $f(x) = b^x$ (con $a > 0$):

  - **$b > 1 \implies$ Creciente** (ej: $y = 5^x$, $y = 1{,}2^x$).

  - **$0 < b < 1 \implies$ Decreciente** (ej: $y = (0{,}8)^x$, $y = (1/4)^x$).

  - La base $b$ NUNCA puede ser $1$ (sería una constante $1^x = 1$) ni negativa.'
explicacion_formal: Definición formal y propiedades matemáticas de análisis gráfico
  y modelamiento de funciones exponenciales.
definiciones_clave: '- **Modelamiento exponencial**: Representación de fenómenos de
  variación acelerada por multiplicación consecutiva.'
propiedades_relaciones: '- **Asíntota horizontal**: Recta de referencia $y = k$ a
  la cual se aproxima la curva exponencial sin tocarla.'
ejemplo_guiado:
  enunciado: Análisis gráfico y modelamiento de funciones exponenciales.
  pasos:
  - 'Paso 1: Identificar los parámetros a, b y k.'
  - 'Paso 2: Determinar la asíntota horizontal y la monotonía.'
  - 'Paso 3: Evaluar los valores en la función o modelo.'
  - 'Paso 4: Concluir el resultado en contexto.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función exponencial trasladada $f(x) = 5 \cdot 2^{x - 3} - 4$, ¿cuál
    es la ecuación de su asíntota horizontal?
  choices:
  - text: La recta horizontal $y = -4$
    is_correct: true
  - text: La recta horizontal $y = 0$
    is_correct: false
  - text: La recta horizontal $y = 5$
    is_correct: false
  - text: La recta vertical $x = 3$
    is_correct: false
  explanation: La alternativa correcta es 'La recta horizontal $y = -4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver la ecuación exponencial $2^{3x - 1} = 16$, ¿cuál es la solución
    real $x$?
  choices:
  - text: $x = \frac{5}{3}$
    is_correct: true
  - text: $x = 5$
    is_correct: false
  - text: $x = 1$
    is_correct: false
  - text: $x = \frac{17}{3}$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{5}{3}$'. (Puesto que $16 = 2^4
    \implies 3x - 1 = 4 \implies 3x = 5 \implies x = 5/3$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar la función o ecuación en forma estándar.'
- 'Paso 2: Identificar la base y verificar si es mayor a 1 o entre 0 y 1.'
- 'Paso 3: Calcular asíntotas, interceptos o igualar exponentes.'
- 'Paso 4: Trazar la gráfica o interpretar el resultado del modelo.'
errores_correccion: '- **Error común:** Confundir la asíntota horizontal $y = k$ con
  el intercepto con el eje Y $f(0) = a + k$.

  - **Cómo corregirlo:** La asíntota es el valor límite $y = k$ al que tiende la curva,
  mientras que el intercepto $Y$ es la evaluación puntual en $x = 0$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de funciones exponenciales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones exponenciales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función exponencial f(x) = b^x con b > 1 es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, a mayor exponente mayor es la potencia resultante cuando la base es mayor
    a 1.
- titulo: ¿La ecuación 2^(3x - 1) = 16 se resuelve igualando 3x - 1 a 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, expresando 16 como 2^4 se igualan directamente los exponentes.
errores_frecuentes:
- Creer que un exponente negativo produce un resultado negativo (evaluar $2^{-2} =
  -4$ en lugar de $0{,}25$).
- Confundir la asíntota horizontal $y = k$ con el intercepto en el eje Y $f(0) = a
  + k$.
- Creer que la gráfica de una función exponencial toca o cruza el eje X cuando no
  tiene traslación vertical ($k = 0$).
- Igualar bases incorrectamente al resolver ecuaciones exponenciales (decir $16 =
  2^3$ en vez de $2^4$).
- Confundir la tasa de crecimiento porcentual $r$ con la base completa del modelo
  $(1 + r)$.
afirmaciones_verdaderas:
- Una función exponencial $f(x) = b^x$ es estrictamente creciente si $b > 1$ y estrictamente
  decreciente si $0 < b < 1$.
- La asíntota horizontal de la función exponencial trasladada $f(x) = a \cdot b^{p
  x + q} + k$ es la recta $y = k$.
al_terminar_debes_poder: Al finalizar este recurso podrás construir tablas de valores,
  analizar crecimiento y monotonía, identificar asíntotas trasladadas, resolver ecuaciones
  de igual base y modelar fenómenos exponenciales.
