semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MONOTONIA
resumen_inicial: 'La monotonía de la función exponencial depende de la combinación del signo del coeficiente $a$ y la magnitud de la base $b$, determinando si la curva es creciente o decreciente.'
explicacion_simple: |
  Determinar si una curva exponencial sube o baja (su monotonía) requiere mirar dos elementos al mismo tiempo: el signo del número de adelante $a$ y el tamaño de la base $b$. Si $a$ es positivo, una base mayor a 1 hace que la curva suba (creciente), mientras que una base entre 0 y 1 hace que baje (decreciente). Pero si $a$ es negativo, el espejo patas arriba invierte el resultado: la base mayor a 1 pasa a ser decreciente y la base menor a 1 pasa a ser creciente.
explicacion_formal: |
  ### Definición formal
  La **monotonía estricta** de la función exponencial $f(x) = a \cdot b^x$ en todo su dominio $\mathbb{R}$ viene dada por el signo de su primera derivada $f'(x) = a \cdot b^x \cdot \ln(b)$:
  1. **Creciente estrictamente ($f'(x) > 0$)**:
     - Caso A: $a > 0 \quad \land \quad b > 1 \implies (+)(+)(+) = +$.
     - Caso B: $a < 0 \quad \land \quad 0 < b < 1 \implies (-)(+)(-) = +$.
  2. **Decreciente estrictamente ($f'(x) < 0$)**:
     - Caso C: $a > 0 \quad \land \quad 0 < b < 1 \implies (+)(+)(-) = -$.
     - Caso D: $a < 0 \quad \land \quad b > 1 \implies (-)(+)(+) = -$.

  ### Desglose simbólico
  - Tabla de Monotonía Combinada:
    - $f(x) = 3 \cdot 2^x \implies a = 3 > 0, b = 2 > 1 \implies$ Creciente.
    - $f(x) = 3 \cdot (0.5)^x \implies a = 3 > 0, b = 0.5 < 1 \implies$ Decreciente.
    - $f(x) = -3 \cdot 2^x \implies a = -3 < 0, b = 2 > 1 \implies$ Decreciente.
    - $f(x) = -3 \cdot (0.5)^x \implies a = -3 < 0, b = 0.5 < 1 \implies$ Creciente.

  ### Síntesis didáctica
  Regla del signo de la derivada: El signo del producto $a \cdot \ln(b)$ dicta la monotonía. Si $a$ y $\ln(b)$ tienen el mismo signo, la función crece. Si tienen signos opuestos, la función decrece.
definiciones_clave: |
  - **Monotonía estricta**: Propiedad de mantener una dirección de variación única (creciente o decreciente) en todo el dominio.
  - **Derivada de la exponencial**: Expresión $f'(x) = a \cdot b^x \cdot \ln(b)$ que determina el signo de la pendiente.
  - **Inversión por signo negativo**: Efecto de $a < 0$ que revierte el sentido de variación original de la base $b$.
propiedades_relaciones: |
  - **Inyectividad garantizada**: Por ser estrictamente monótonas en todo $\mathbb{R}$, todas las funciones exponenciales son funciones inyectivas (uno a uno).
  - **Ausencia de máximos o mínimos locales**: Al no cambiar nunca su sentido de monotonía ($f'(x) \neq 0$), la función exponencial carece de puntos críticos o extremos locales.
ejemplo_guiado:
  enunciado: 'Determina la monotonía estricta de las siguientes cuatro funciones exponenciales justificando según el signo de $a$ y el valor de $b$: A) $f(x) = 5 \cdot 4^x$, B) $g(x) = -2 \cdot 3^x$, C) $h(x) = 6 \cdot (0.2)^x$, D) $p(x) = -4 \cdot (0.5)^x$.'
  pasos:
    - 'Paso 1: Para $f(x) = 5 \cdot 4^x$, $a = 5 > 0$ y $b = 4 > 1$. Es estrictamente **creciente**.'
    - 'Paso 2: Para $g(x) = -2 \cdot 3^x$, $a = -2 < 0$ y $b = 3 > 1$. La reflexión revierte la curva $\implies$ **decreciente**.'
    - 'Paso 3: Para $h(x) = 6 \cdot (0.2)^x$, $a = 6 > 0$ y $0 < b = 0.2 < 1$. Es estrictamente **decreciente**.'
    - 'Paso 4: Para $p(x) = -4 \cdot (0.5)^x$, $a = -4 < 0$ y $0 < b = 0.5 < 1$. La reflexión de una decreciente genera una función **creciente**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la monotonía de la función exponencial $f(x) = -5 \cdot (0.4)^x$ en todo su dominio real?'
    choices:
      - {text: 'Es estrictamente creciente, porque $a = -5 < 0$ y $\ln(0.4) < 0$, haciendo el producto de la derivada $f''(x) > 0$', is_correct: true}
      - {text: 'Es estrictamente decreciente, porque la base $0.4$ es menor que uno', is_correct: false}
      - {text: 'Es constante, porque combina números negativos y decimales', is_correct: false}
      - {text: 'Es creciente para $x > 0$ y decreciente para $x < 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente creciente, porque $a = -5 < 0$ y $\ln(0.4) < 0$, haciendo el producto de la derivada $f''(x) > 0$''. El signo negativo de $a$ invierte el decaimiento de la base produciendo un crecimiento hacia la asíntota $y = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función exponencial se expresa como $g(x) = -8 \cdot 6^x$, ¿cómo se comporta el valor de $g(x)$ a medida que $x$ aumenta?'
    choices:
      - {text: 'Es estrictamente decreciente, tomando valores negativos cada vez más alejados de cero hacia $-\infty$', is_correct: true}
      - {text: 'Es estrictamente creciente hacia $+\infty$', is_correct: false}
      - {text: 'Es una recta horizontal de pendiente nula', is_correct: false}
      - {text: 'Es decreciente hasta $x = 0$ y luego creciente', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente decreciente, tomando valores negativos cada vez más alejados de cero hacia $-\infty$''. Como $a = -8 < 0$ y $b = 6 > 1$, la gráfica cae velozmente hacia $-\infty$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer el coeficiente $a$ y determinar su signo ($a > 0$ o $a < 0$).'
  - 'Paso 2: Extraer la base $b$ y determinar su rango ($b > 1$ o $0 < b < 1$).'
  - 'Paso 3: Evaluar el signo del producto $a \cdot \ln(b)$.'
  - 'Paso 4: Si $a \cdot \ln(b) > 0$, concluir estrictamente creciente. Si $a \cdot \ln(b) < 0$, concluir estrictamente decreciente.'
errores_correccion: |
  - **Error 1:** Mirar únicamente la base $b$ para decidir la monotonía, ignorando el signo de $a$. **Cómo corregirlo:** El parámetro $a < 0$ refleja la gráfica respecto al eje $x$, invirtiendo el sentido de variación. Por ejemplo, $f(x) = -2^x$ es decreciente aunque $b = 2 > 1$.
  - **Error 2:** Creer que la función exponencial puede tener un tramo creciente y otro decreciente en el mismo gráfico. **Cómo corregirlo:** La función exponencial es estrictamente monótona en todo su dominio $\mathbb{R}$. No cambia de sentido ni posee vértices.
ejemplos:
  - titulo: 'Monotonía con a positivo y b > 1'
    enunciado: '¿La función $f(x) = 10 \cdot 3^x$ es creciente?'
    alternativas:
      - 'Sí, estrictamente creciente'
      - 'No, es decreciente'
      - 'Depende del valor de $x$'
    respuesta: 'Sí, estrictamente creciente'
    solucion_pasos:
      - '1. $a = 10 > 0$ y $b = 3 > 1$.'
      - '2. La función es estrictamente creciente.'
  - titulo: 'Monotonía con a negativo y b > 1'
    enunciado: '¿La función $g(x) = -4 \cdot 5^x$ es decreciente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a = -4 < 0$ y $b = 5 > 1 \implies$ La curva cae hacia $-\infty$, luego es decreciente.'
  - titulo: 'Monotonía con a negativo y b < 1'
    enunciado: '¿La función $h(x) = -2 \cdot (0.3)^x$ es estrictamente creciente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a = -2 < 0$ y $b = 0.3 < 1 \implies f''(x) = (-2)(0.3^x)(\ln 0.3) > 0$ (pues $\ln 0.3 < 0$). La curva sube hacia cero, siendo creciente.'
  - titulo: 'Inexistencia de extremos locales'
    enunciado: '¿Una función exponencial de la forma $a \cdot b^x$ posee puntos donde la tangente sea horizontal?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Dado que $a \neq 0, b^x > 0$ y $\ln(b) \neq 0$, la derivada $f''(x) \neq 0$ para todo $x \in \mathbb{R}$.'
errores_frecuentes:
  - 'La función $f(x) = -3 \cdot 2^x$ es creciente porque su base $b = 2$ es mayor que uno.'
  - 'Una función exponencial cambia de decreciente a creciente al cruzar el eje $y$.'
  - 'La monotonía de la función $f(x) = a \cdot b^x$ depende exclusivamente del valor absoluto del coeficiente $a$.'
  - 'La función exponencial $f(x) = -0.5 \cdot (0.2)^x$ es decreciente.'
  - 'Existe un valor de $x$ donde la derivada de la función exponencial se anula.'
afirmaciones_verdaderas:
  - 'La monotonía de la función exponencial $f(x) = a \cdot b^x$ se rige por el signo del producto $a \cdot \ln(b)$.'
  - 'Toda función exponencial básica es estrictamente monótona e inyectiva en todo el conjunto de los números reales $\mathbb{R}$.'
