semantic_id: MAT.NUM.NUMEROS_PRIMOS.PRIMO_IDENTIFICACION
resumen_inicial: "Para identificar si un número es primo, basta con comprobar que no sea divisible por ningún primo menor o igual a su raíz cuadrada."
explicacion_simple: |
  Imagínate que tienes un colador gigante para números. Hace más de 2000 años, un sabio
  griego llamado Eratóstenes inventó un "colador de números" de papel: se escriben los
  números del 1 al 100 y se van tachando los múltiplos de 2, de 3, de 5, de 7... Los
  números que quedan sin tachar son los primos.
explicacion_formal: |
  Para comprobar si $N$ es primo, no es necesario dividirlo por todos los números menores
  a él: basta con comprobar que no sea divisible por ningún primo menor o igual a
  $\sqrt{N}$. Esto ocurre porque si $N$ tuviera un divisor mayor que $\sqrt{N}$, también
  tendría un divisor complementario menor que $\sqrt{N}$, que ya habría sido detectado.
definiciones_clave: |
  **Criba de Eratóstenes**: algoritmo que tacha sistemáticamente los múltiplos de cada
  primo para encontrar todos los primos menores que un número dado.
propiedades_relaciones: |
  Cuantos más primos pequeños se descarten primero (2, 3, 5, 7...), más rápido se llega a
  la conclusión, ya que muchos números compuestos son detectados por los primeros primos.
ejemplo_guiado:
  enunciado: "Determina si 79 es primo usando la regla de la raíz cuadrada."
  pasos:
    - "Como $8^2=64$ y $9^2=81$, $\\sqrt{79}$ está entre 8 y 9."
    - "Primos menores o iguales a 8: $2,3,5,7$. Ninguno divide a 79 de forma exacta."
    - "Conclusión: 79 es un número primo."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué basta con probar divisores hasta la raíz cuadrada de N?"
    choices:
      - {text: "Porque un divisor mayor que la raíz tendría un complementario menor que ya se habría detectado", is_correct: true}
      - {text: "Porque los números grandes nunca son primos", is_correct: false}
      - {text: "Es solo una convención práctica sin razón matemática", is_correct: false}
      - {text: "Porque la raíz cuadrada siempre es un divisor", is_correct: false}
    explanation: "La correcta es Porque un divisor mayor que la raíz tendría un complementario menor que ya se habría detectado: los divisores de N vienen en pares que se cruzan en $\\sqrt{N}$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 77 un número primo?"
    choices:
      - {text: "No, es divisible por 7", is_correct: true}
      - {text: "Sí, no es divisible por 2, 3 ni 5", is_correct: false}
      - {text: "Sí, porque es impar", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, es divisible por 7: $77=7\\times11$, por lo que no es primo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
- 'Paso 1: Estima la raíz cuadrada entera o aproximada del número $N$ que quieres evaluar.'
- 'Paso 2: Haz una lista de todos los números primos que sean menores o iguales a esa raíz cuadrada.'
- 'Paso 3: Divide el número $N$ por cada uno de los primos de la lista. Si alguna división es exacta, el número no es primo. Si ninguna división es exacta, el número es primo.'
errores_correccion: |
  Un error frecuente es olvidar probar la divisibilidad con 7, clasificando erróneamente
  números como 91 como primos. Otro error es confundir la raíz cuadrada con la mitad del
  número al definir el límite de búsqueda.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Identifica si el número $53$ es primo usando la regla de la raíz cuadrada.
  alternativas:
    - "Sí, no es divisible por 2, 3, 5 ni 7"
    - "No, es divisible por 3"
    - "No se puede determinar"
  respuesta: "Sí, no es divisible por 2, 3, 5 ni 7"
  solucion_pasos:
  - 'Paso a: Estimamos la raíz cuadrada de $53$. Como $7^2 = 49$ y $8^2 = 64$, entonces $\sqrt{53}$ está entre $7$ y $8$ (es aproximadamente $7.28$).'
  - 'Paso b: Listamos los números primos menores o iguales a $7$, que son: $2, 3, 5, 7$.'
  - 'Paso c: Probamos la divisibilidad de $53$ por estos primos: no es divisible por $2$ (es impar), ni por $3$ ($5+3=8$), ni por $5$ (termina en $3$), ni por $7$ ($53 \div 7 = 7$ con resto $4$).'
  - 'Paso d: Al no ser divisible por ninguno de ellos, $53$ es un número primo.'
- titulo: Ejemplo 2
  enunciado: Determina si el número $91$ es primo o no.
  alternativas:
    - "No, es divisible por 7"
    - "Sí, no es divisible por 2, 3 ni 5"
    - "No se puede determinar"
  respuesta: "No, es divisible por 7"
  solucion_pasos:
  - 'Paso a: Calculamos la raíz cuadrada aproximada de $91$. Como $9^2 = 81$ y $10^2 = 100$, $\sqrt{91}$ es aproximadamente $9.54$.'
  - 'Paso b: Los primos menores o iguales a $9$ son: $2, 3, 5, 7$.'
  - 'Paso c: Probamos la divisibilidad: $91$ es impar (no por $2$), $9+1=10$ (no por $3$), termina en $1$ (no por $5$).'
  - 'Paso d: Al probar por $7$: $91 \div 7 = 13$ de forma exacta. Por lo tanto, $91$ tiene como divisores a $7$ y $13$. Concluimos que $91$ no es primo.'
- titulo: ¿Es el número $101$ un número primo?
  respuesta: Sí
  solucion_pasos:
  - 'La raíz aproximada de $101$ es un poco más de $10$ ($10^2 = 100$).'
  - 'Los primos menores o iguales a $10$ son $2, 3, 5, 7$.'
  - 'Probamos divisores: $101$ no es divisible por $2$ (impar), ni por $3$ ($1+0+1=2$), ni por $5$ (termina en $1$), ni por $7$ ($101 \div 7 = 14$ residuo $3$).'
  - 'Como no es divisible por ninguno de ellos, $101$ es primo.'
- titulo: ¿Es el número $87$ un número primo?
  respuesta: No
  solucion_pasos:
  - 'La raíz aproximada de $87$ es algo menor que $10$ ($9^2 = 81$).'
  - 'Los primos menores o iguales a $9$ son $2, 3, 5, 7$.'
  - 'Probamos divisibilidad: $87$ es impar, por lo que no es divisible por $2$.'
  - 'Sumamos las cifras: $8 + 7 = 15$. Como $15$ es múltiplo de $3$, el número $87$ es divisible por $3$ ($87 = 3 \cdot 29$). Por lo tanto, no es primo.'
errores_frecuentes:
- Olvidar probar la divisibilidad con el número 7, lo que lleva a clasificar erróneamente números como 91 o 119 como primos.
- Pensar que hay que probar la división por todos los números menores, haciendo el cálculo innecesariamente largo.
- No usar correctamente los criterios de divisibilidad básicos al verificar los posibles divisores.
- Asumir que un número que termina en 1, 3, 7 o 9 es automáticamente primo sin verificar divisores.
- Confundir la raíz cuadrada con la mitad del número en la regla del límite de búsqueda.
al_terminar_debes_poder: |
  Identificar si un número es primo probando su divisibilidad solo hasta la raíz cuadrada
  del número.
fuente: Teoría de Números
estado: publicado
