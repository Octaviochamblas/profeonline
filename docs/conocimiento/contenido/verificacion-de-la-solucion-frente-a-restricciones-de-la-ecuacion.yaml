semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.VERIFICACION_RESTRICCIONES
resumen_inicial: 'Verificación de la solución frente a restricciones de la ecuación:
  propiedades, resolución y modelamiento en Ecuaciones fraccionarias de primer grado.'
explicacion_simple: No debes reemplazarla en tu ecuación 'aplanada', porque esa ecuación
  fue alterada por ti. Debes reemplazarla en la original para estar 100% seguro.
explicacion_formal: '### Definición formal


  Verificar una solución $x=k$ consiste en sustituirla en la ecuación fraccionaria
  original (no en la versión sin denominadores) y comprobar dos condiciones simultáneas:
  que ningún denominador se anule en $x=k$, y que ambos miembros de la igualdad resulten
  numéricamente iguales.


  ### Desarrollo didáctico


  No debes reemplazarla en tu ecuación ''aplanada'', porque esa ecuación fue alterada
  por ti. Debes reemplazarla en la original para estar 100% seguro.

  Si al reemplazar $x$, el lado izquierdo se equilibra perfectamente con el lado derecho,
  y ningún denominador se vuelve cero en el proceso, puedes confirmar la solución.
  Es correcta.'
definiciones_clave: '- **Verificación de la solución frente a restricciones de la
  ecuación**: Herramienta matemática para determinar valores desconocidos que satisfacen
  la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a verificación de la solución frente a restricciones
  de la ecuación.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando verificación de
    la solución frente a restricciones de la ecuación.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de verificación de la
    solución frente a restricciones de la ecuación.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
checkpoints:
