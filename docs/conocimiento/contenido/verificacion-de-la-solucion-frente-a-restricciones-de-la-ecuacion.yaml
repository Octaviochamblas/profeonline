  question: ¿Cuál es la regla fundamental para mantener la igualdad al resolver verificación
    de la solución frente a restricciones de la ecuación?
  choices:
  - text: Aplicar las propiedades aditiva y multiplicativa para despejar la incógnita
      en ecuaciones fraccionarias de primer grado
    is_correct: true
  - text: Sumar una cantidad en un miembro y restarla en el otro
    is_correct: false
  - text: Multiplicar un solo lado de la igualdad por cero
    is_correct: false
  - text: Cambiar el signo de los coeficientes sin moverlos de miembro
    is_correct: false
  explanation: 'La alternativa correcta es: Aplicar las propiedades aditiva y multiplicativa
    para despejar la incógnita en ecuaciones fraccionarias de primer grado. Es la
    regla de la igualdad en verificación de la solución frente a restricciones de
    la ecuación.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al obtener el valor de la incógnita en verificación de la solución frente
    a restricciones de la ecuación, ¿qué paso final se recomienda?
  choices:
  - text: Verificar la solución sustituyendo el valor hallado en la ecuación original
    is_correct: true
  - text: Igualar la solución a cero inmediatamente
    is_correct: false
  - text: Borrar los términos constantes de la ecuación
    is_correct: false
  - text: Dividir el resultado final entre la variable
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar la solución sustituyendo el
    valor hallado en la ecuación original. Garantiza que no se hayan cometido errores
    aritméticos en verificación de la solución frente a restricciones de la ecuación.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Toma la solución final válida.
- Sustituye la 'x' por ese número en la ecuación fraccionaria original.
- Resuelve la aritmética en ambos lados.
- Verifica que ambos lados den el mismo número final.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en verificación de la solución frente a restricciones de la ecuación.
ejemplos:
