- titulo: 'Respecto de «Verificación de la solución frente a restricciones de la ecuación»:
    ¿Describe a'
  enunciado: 'Respecto de «Verificación de la solución frente a restricciones de la
    ecuación»: ¿Describe adecuadamente el concepto esta frase? «La solución obtenida
    debe contrastarse con las restricciones del dominio original; cualquier valor
    que anule un denominador se descarta»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La solución obtenida debe contrastarse
    con las restricciones del dominio original; cualquier valor que anule un denominador
    se descarta.'
- titulo: 'Respecto de «Verificación de la solución frente a restricciones de la ecuación»:
    ¿Se puede a'
  enunciado: 'Respecto de «Verificación de la solución frente a restricciones de la
    ecuación»: ¿Se puede aceptar esta afirmación? «Puede omitirse esta condición sin
    cambiar el resultado: «Toma la solución final válida»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La solución obtenida debe contrastarse
    con las restricciones del dominio original; cualquier valor que anule un denominador
    se descarta.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Toma la solución final
  válida».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Sustituye la ''x''
  por ese número en la ecuación fraccionaria original».'
- La definición sigue cumpliéndose aunque no se considere que el hábito de los maestros
  es la verificación. Una vez que tienes una solución que sobrevivió a la criba de
  las restricciones, el último paso es reemplazarla físicamente en la ecuación original
  (la que tenía fracciones).
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Verifica
  que ambos lados den el mismo número final».
- La comprobación del resultado vuelve innecesaria la condición «Toma la solución
  final válida».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando verificación
  de la solución frente a restricciones de la ecuación.
