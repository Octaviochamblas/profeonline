semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.VERIFICACION_RESTRICCIONES
resumen_inicial: La comprobación final exige sustituir la solución en los denominadores
  iniciales para asegurar que ninguno valga cero.
explicacion_simple: 'Para estar completamente seguros de la respuesta en una ecuación
  fraccionaria, la verificación cumple dos funciones:

  1. Reemplazar la solución en la ecuación inicial para confirmar que el valor del
  lado izquierdo es igual al del lado derecho.

  2. Confirmar que al sustituir la solución, NINGÚN denominador se convierte en cero.

  Si cumple ambas pruebas, la solución es 100% legítima.'
explicacion_formal: 'Dada la solución candidata $x = c$, el **criterio de validez
  en ecuaciones fraccionarias** exige satisfacer la doble condición en $\mathbb{R}$:


  $$\text{1. Existencia en dominio: } \forall i : Q_i(c) \neq 0$$

  $$\text{2. Equivalencia numérica: } \sum_{i=1}^k \frac{P_i(c)}{Q_i(c)} = 0$$


  **Desglose de la fórmula:**

  - Si $Q_i(c) = 0$ para algún $i$, la expresión carece de valor numérico y la prueba
  falla automáticamente.'
definiciones_clave: '- **Doble verificación**: Comprobación simultánea de no-nulidad
  de denominadores y de equivalencia de miembros.'
propiedades_relaciones: '- **Rigores del dominio**: Ningún método algebraico puede
  validar una solución que viole las restricciones de existencia del dominio real.'
ejemplo_guiado:
  enunciado: Verifica si la solución $x = 5$ es válida para la ecuación fraccionaria
    $\frac{x + 1}{x - 2} = 2$.
  pasos:
  - 'Paso 1: Comprobar el denominador para $x = 5$: $5 - 2 = 3 \neq 0$ (cumple la
    condición de existencia).'
  - 'Paso 2: Evaluar el primer miembro en $x = 5$: $\frac{5 + 1}{5 - 2} = \frac{6}{3}
    = 2$.Paso 3: Comparar con el segundo miembro: $2 = 2$.Paso 4: Concluir que la
    solución $x = 5$ está totalmente verificada y pertenece al dominio permitido.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué dos verificaciones deben cumplirse obligatoriamente para validar
    una solución en una ecuación fraccionaria?
  choices:
  - text: Que el denominador no se anule ($Q(c) \neq 0$) y que la igualdad numérica
      sea verdadera.
    is_correct: true
  - text: Que la solución sea un número entero y positiva.
    is_correct: false
  - text: Que el numerador se anule y el denominador sea igual a 1.
    is_correct: false
  - text: Que los coeficientes de la ecuación sean primos entre sí.
    is_correct: false
  explanation: La alternativa correcta es 'Que el denominador no se anule ($Q(c) \neq
    0$) y que la igualdad numérica sea verdadera.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al verificar la solución $x = 5$ en $\frac{x + 1}{x - 2} = 2$, ¿cuál es
    el valor numérico obtenido en el primer miembro?
  choices:
  - text: $2$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $3$
    is_correct: false
  - text: $5$
    is_correct: false
  explanation: La alternativa correcta es '$2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la solución obtenida $x = c$.'
- 'Paso 2: Reemplazar $x = c$ en todos los denominadores de la ecuación inicial y
  verificar que ninguno sea $0$.'
- 'Paso 3: Calcular el valor numérico completo del primer y segundo miembro.'
- 'Paso 4: Confirmar la igualdad de ambos miembros.'
errores_correccion: '- **Error común:** Evaluar la solución únicamente en los numeradores
  sin verificar los denominadores.

  - **Cómo corregirlo:** La verificación en ecuaciones fraccionarias REQUIERE reemplazar
  el valor en los DENOMINADORES PRIMERO.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
