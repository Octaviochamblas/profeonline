procedimiento:
- 'Paso 1: Tomar el valor de la solución obtenida $x = c$.'
- 'Paso 2: Sustituir $x = c$ en todos los denominadores de la ECUACIÓN ORIGINAL comprobando que ninguno resulte igual a $0$.'
- 'Paso 3: Calcular el valor numérico del primer miembro reemplazando $x$ por $c$.'
- 'Paso 4: Calcular el valor numérico del segundo miembro reemplazando $x$ por $c$.'
- 'Paso 5: Confirmar la igualdad entre ambos miembros para validar definitivamente el candidato.'
errores_correccion: '- **Error 1:** Evaluar la solución únicamente en los numeradores omitiendo la verificación previa de
  los denominadores. **Cómo corregirlo:** En ecuaciones fraccionarias **ES OBLIGATORIO SUSTITUIR EN LOS DENOMINADORES PRIMERO
  PARA DESCARTAR CUALQUIER DIVISIÓN POR CERO**.

  - **Error 2:** Realizar la verificación sobre la ecuación entera simplificada en lugar de la ecuación fraccionaria inicial.
  **Cómo corregirlo:** La comprobación **DEBE REALIZARSE SIEMPRE SOBRE LA ESTRUCTURA FRACCIONARIA ORIGINAL DEL PROBLEMA**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al verificar $x = 4$ en la ecuación $\frac{12}{x} = 3$, ¿se satisface la doble condición de validez?
  alternativas:
  - Sí, pues $4 \neq 0$ y $\frac{12}{4} = 3$
  - No, pues $4$ anula el denominador
  - No, pues $\frac{12}{4}$ da $4$
  respuesta: Sí, pues $4 \neq 0$ y $\frac{12}{4} = 3$
  solucion_pasos:
  - '1. Denominador: $4 \neq 0$.'
  - '2. Evaluación: $\frac{12}{4} = 3$.'
  - 3. Puesto que $3 = 3$, la solución está validada.
- titulo: Ejemplo 2
  enunciado: Verifica la validez de $x = 1$ en la ecuación $\frac{2}{x - 1} = 5$.
  alternativas:
  - Es inválida porque anula el denominador ($1 - 1 = 0$)
  - Es válida porque la igualdad da $5$
  - Es válida pero incompleta
  respuesta: Es inválida porque anula el denominador ($1 - 1 = 0$)
  solucion_pasos:
  - '1. Denominador: $1 - 1 = 0$.'
  - 2. La división por cero no está definida.
  - 3. La solución $x = 1$ queda invalidada.
- titulo: Orden de verificación
  enunciado: ¿Revisar la no-nulidad de los denominadores debe preceder a la comprobación de la igualdad de los miembros?
  respuesta: Sí
  solucion_pasos:
  - Sí, si un denominador es cero la expresión carece de valor numérico.
- titulo: Sustitución en la original
  enunciado: ¿Efectuar la verificación en la ecuación original previene errores de simplificación cometidos al eliminar denominadores?
  respuesta: Sí
  solucion_pasos:
  - Sí, garantiza que la solución pertenece al dominio original.
errores_frecuentes:
- Evaluar una solución candidata únicamente en los numeradores sin verificar previamente la no-nulidad de los denominadores.
- Realizar la verificación sobre la ecuación entera simplificada en lugar de sobre la ecuación fraccionaria original.
- Confundir el valor numérico de la verificación ($2 = 2$) con el valor de la incógnita ($x = 2$).
- Aceptar como válida una evaluación numérica idéntica cuando los denominadores resultan ser iguales a cero.
- Modificar arbitrariamente el denominador de una fracción durante la comprobación para evitar una división.
afirmaciones_verdaderas:
- Validar una solución fraccionaria requiere comprobar la no-nulidad de los denominadores y la equivalencia de ambos miembros.
- La sustitución de la solución para su verificación debe realizarse obligatoriamente en la ecuación fraccionaria original.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/verificacion-de-la-solucion-frente-a-restricciones-de-la-ecuacion-resumen.svg)


  QUÉ: Verificar soluciones de ecuaciones fraccionarias de primer grado frente a sus restricciones.

  CÓMO: Reemplazar el candidato en la ecuación fraccionaria original, asegurar que ningún denominador se anule ($Q_i(c) \neq
  0$) y comprobar la igualdad numérica exacta de los miembros ($A_{\text{orig}}(c) \equiv B_{\text{orig}}(c)$).

  '
