semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.VERIFICACION_RESTRICCIONES
resumen_inicial: La comprobación final exige sustituir la solución en los denominadores iniciales para asegurar que ninguno
  valga cero y que la igualdad numérica sea exacta.
explicacion_simple: 'Para certificar con seguridad la respuesta en una ecuación fraccionaria, el proceso de verificación debe
  cumplir dos funciones simultáneas:


  1. Confirmar que al sustituir la solución en la ecuación **original**, ningún denominador adquiere el valor cero.

  2. Evaluar numéricamente ambos miembros para comprobar que el valor del primer miembro es idéntico al del segundo miembro.


  Si la solución superó exitosamente ambas pruebas, queda confirmada como una solución legítima del sistema.


  ![Verificación frente a restricciones](/static/img/nodos/verificacion-de-la-solucion-frente-a-restricciones-de-la-ecuacion-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la solución candidata $x = c$, el **criterio de validez en ecuaciones fraccionarias** exige satisfacer la doble condición
  sobre el cuerpo $\mathbb{R}$:


  $$\text{1. Existencia en el dominio: } \forall i : Q_i(c) \neq 0 \iff c \in \operatorname{Dom}$$


  $$\text{2. Equivalencia numérica: } \sum_{i=1}^k \frac{P_i(c)}{Q_i(c)} = 0$$


  ### Desglose de la fórmula

  - $Q_i(c) \neq 0$: Exigencia de no-nulidad en cada denominador para evitar la indefinición matemática.

  - Igualdad aritmética de los miembros: Prueba de satisfacción de la ecuación tras la sustitución de la incógnita por $c$.


  ### Síntesis didáctica

  La verificación de existencia en el dominio debe realizarse antes de calcular las operaciones numéricas de los miembros.

  '
definiciones_clave: '- **Doble verificación**: Comprobación combinada de existencia en el dominio ($Q_i(c) \neq 0$) y de identidad
  numérica de miembros.

  - **Criterio de validez**: Regla matemática que rechaza cualquier candidato que indefina denominadores o altere la igualdad.

  '
propiedades_relaciones: '- **Inviolabilidad de restricciones**: Ninguna manipulación algebraica previa puede otorgar validez
  a un candidato que anule denominadores originales.

  - **Consistencia aritmética**: La evaluación numérica en la ecuación original previene fallos cometidos al reducir el m.c.m.

  '
ejemplo_guiado:
  enunciado: Verifica si la solución $x = 5$ es totalmente válida para la ecuación fraccionaria $\frac{x + 1}{x - 2} = 2$.
  pasos:
  - 'Paso 1: Evaluar el denominador en $x = 5$: $5 - 2 = 3 \neq 0$, cumpliendo la condición de existencia en el dominio.'
  - 'Paso 2: Sustituir $x = 5$ en el primer miembro: $\frac{5 + 1}{5 - 2} = \frac{6}{3} = 2$.'
  - 'Paso 3: Comparar el resultado con el segundo miembro: $2 = 2$.'
  - 'Paso 4: Concluir que la solución $x = 5$ está verificada y pertenece al conjunto solución $S$.'
  imagen: /static/img/nodos/verificacion-de-la-solucion-frente-a-restricciones-de-la-ecuacion-ejemplos.svg
