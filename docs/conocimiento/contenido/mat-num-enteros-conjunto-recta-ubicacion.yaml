semantic_id: MAT.NUM.ENTEROS_CONJUNTO.RECTA_UBICACION
resumen_inicial: En la recta numérica los enteros ocupan puntos ordenados a distancias
  constantes del cero.
explicacion_simple: La recta numérica es un modelo visual donde cada número entero
  ocupa un punto único a una distancia fija de sus vecinos. Se coloca el cero al centro,
  los números positivos hacia la derecha a intervalos iguales y los enteros negativos
  hacia la izquierda manteniendo exactamente la misma separación.
explicacion_formal: 'La **Representación en la Recta Numérica** es una biyección entre
  $\mathbb{Z}$ y un conjunto discreto de puntos igualmente espaciados sobre una recta
  orientada $L$:


  $$\forall n \in \mathbb{Z}, \quad \text{Pos}(n) = n \cdot \delta \quad \text{con
  } \delta > 0 \text{ (unidad de escala)}$$


  **Desglose de la fórmula:**

  - $\text{Pos}(n)$: Coordenada cartesiana unidimensional asignada al entero $n$.

  - $\delta$: Distancia constante de separación fija entre dos enteros consecutivos
  inmediatos ($n$ y $n+1$).

  - $n > 0 \implies \text{Pos}(n) > 0$ (derecha); $n < 0 \implies \text{Pos}(n) <
  0$ (izquierda).


  > **Complemento didáctico:** La recta numérica fija una escala uniforme donde la
  distancia entre $n$ y $n+1$ es siempre igual a $1$ unidad $\delta$.'
definiciones_clave: '- **Recta numérica**: Línea continua graduada con una escala
  constante donde cada punto entero corresponde a un número real.

  - **Origen**: El punto asignado al valor cero ($0$).'
propiedades_relaciones: '- **Simetría del origen**: Los enteros $n$ y $-n$ se ubican
  a la misma distancia $|n|$ del origen $0$.

  - **Escala constante**: La distancia entre $k$ y $k+1$ es idéntica en toda la recta.'
ejemplo_guiado:
  enunciado: Ubique el entero $-3$ en una recta numérica graduada de unidad $\delta
    = 1\text{ cm}$ e indique a qué distancia y en qué sentido se encuentra del origen.
  pasos:
  - 'Paso 1: Identificar el origen $0$ como punto de partida.'
  - 'Paso 2: Al ser un entero negativo, desplazarse hacia la izquierda.'
  - 'Paso 3: Medir $3\text{ cm}$ hacia la izquierda y marcar el punto $-3$.'
  - 'Conclusión: El punto $-3$ se sitúa a $3\text{ cm}$ a la izquierda del origen.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Hacia dónde se ubican los enteros negativos en la recta numérica respecto
    al cero?
  choices:
  - text: Hacia la izquierda del cero
    is_correct: true
  - text: Hacia la derecha del cero
    is_correct: false
  - text: En el mismo punto que los positivos
    is_correct: false
  - text: Arriba del cero únicamente
    is_correct: false
  explanation: La alternativa correcta es 'Hacia la izquierda del cero'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿a qué distancia del origen se encuentra el entero
    -3?
  choices:
  - text: A 3 unidades de distancia
    is_correct: true
  - text: A -3 unidades de distancia
    is_correct: false
  - text: A 0 unidades de distancia
    is_correct: false
  - text: A 6 unidades de distancia
    is_correct: false
  explanation: La alternativa correcta es 'A 3 unidades de distancia', pues las distancias
    son no negativas.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Marcar el origen $0$ en la recta.'
- 'Paso 2: Determinar la dirección: derecha para positivos, izquierda para negativos.'
- 'Paso 3: Avanzar tantas unidades de escala como indique el valor absoluto del entero.'
errores_correccion: '- **Error 1: Ubicar los números negativos invertidos respecto
  al origen (ej: poner $-1$ muy lejos del cero).** **Cómo corregirlo:** Los negativos
  avanzan hacia la izquierda comenzando con $-1$ pegado al cero.


  - **Error 2: Utilizar distancias desiguales entre enteros consecutivos al graficar.**
  **Cómo corregirlo:** La distancia entre enteros adyacentes debe ser estrictamente
  constante.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué entero se encuentra a 4 unidades a la izquierda del cero?
  alternativas:
  - '-4'
  - '4'
  - '0'
  respuesta: '-4'
  solucion_pasos:
  - Moverse 4 unidades a la izquierda del cero ubica la posición en $-4$.
- titulo: Ejemplo 2
  enunciado: Si estamos en $-2$ y avanzamos 5 unidades a la derecha, ¿en qué número
    nos ubicamos?
  alternativas:
  - '3'
  - '-7'
  - '7'
  respuesta: '3'
  solucion_pasos:
  - $-2 + 5 = 3$. La nueva posición es 3.
- titulo: ¿Se ubican -1 y 1 a la misma distancia del cero en la recta?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos se ubican a 1 unidad de distancia del origen.
- titulo: ¿Se ubica el entero -5 a la derecha del entero -2?
  respuesta: 'No'
  solucion_pasos:
  - No, $-5$ está a la izquierda de $-2$.
errores_frecuentes:
- En la recta numérica, el entero $-5$ se ubica más cerca del cero que el entero $-2$.
- Los números enteros negativos se grafican a la derecha del cero advancing de menor
  a mayor.
- La distancia gráfica entre $0$ y $1$ puede ser diferente a la distancia entre $0$
  y $-1$.
- El entero $-1$ es el punto situado más a la izquierda de toda la recta numérica.
- Al avanzar hacia la izquierda en la recta numérica los valores numéricos aumentan
  su magnitud real.
afirmaciones_verdaderas:
- Los enteros negativos se grafican a la izquierda del cero y los positivos a la derecha.
- La distancia entre enteros consecutivos es constante en toda la recta.
al_terminar_debes_poder: Al terminar serás capaz de graficar y ubicar con precisión
  cualquier número entero en la recta numérica, midiendo distancias equitativas desde
  el origen cero hacia la derecha o la izquierda.
