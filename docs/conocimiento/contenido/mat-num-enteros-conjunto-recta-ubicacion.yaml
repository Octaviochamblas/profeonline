semantic_id: MAT.NUM.ENTEROS_CONJUNTO.RECTA_UBICACION
resumen_inicial: "La recta numérica ubica el cero como origen, los positivos a su derecha y los negativos a su izquierda, siempre a igual distancia entre unidades."
explicacion_simple: |
  Dibuja una línea larga y marca el centro: ese punto es el cero. Hacia la derecha escribe 1, 2,
  3… separando igual cada número; hacia la izquierda escribe -1, -2, -3… con la misma separación.
  Así puedes ver de un vistazo cuál número es mayor y cuál es menor.
explicacion_formal: |
  La recta numérica fija un origen (el $0$) y una unidad de medida constante. Los enteros positivos
  $(\mathbb{Z}^+)$ se ubican a la derecha del origen y los negativos $(\mathbb{Z}^-)$ a la izquierda,
  cumpliendo que la distancia entre $0$ y $1$ es idéntica a la distancia entre $0$ y $-1$
  (equidistancia de opuestos).
definiciones_clave: |
  **Origen**: el punto de la recta asignado al $0$. **Equidistancia**: dos números opuestos ($a$ y
  $-a$) están siempre a la misma distancia del origen, en lados contrarios.
propiedades_relaciones: |
  Sumar un número positivo desplaza hacia la derecha en la recta; sumar un negativo desplaza hacia
  la izquierda. La distancia entre dos enteros consecutivos es siempre la misma unidad, sin importar
  si están en la zona positiva o negativa.
ejemplo_guiado:
  enunciado: "Ubica los números $-2$ y $6$ en una recta numérica e indica cuál está más lejos del origen."
  pasos:
    - "Se traza la recta y se marca el $0$ como origen."
    - "Se cuentan 6 unidades a la derecha del $0$ para marcar el $6$."
    - "Se cuentan 2 unidades a la izquierda del $0$ para marcar el $-2$."
    - "Se comparan las distancias: $6$ unidades vs. $2$ unidades; el $6$ está más lejos del origen."
checkpoints:
  - placement: after_explicacion_formal
    question: "Según la equidistancia de opuestos, ¿a qué distancia del origen está $-7$?"
    choices:
      - {text: "A la misma distancia que $7$", is_correct: true}
      - {text: "El doble de la distancia que $7$", is_correct: false}
      - {text: "A la mitad de la distancia que $7$", is_correct: false}
      - {text: "No se puede determinar", is_correct: false}
    explanation: "La correcta es A la misma distancia que $7$: los opuestos siempre están equidistantes del origen."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Aplicando el mismo procedimiento, ¿cuál de estos dos números está más lejos del origen: $-9$ o $4$?"
    choices:
      - {text: "$-9$", is_correct: true}
      - {text: "$4$", is_correct: false}
      - {text: "Están a la misma distancia", is_correct: false}
      - {text: "No se puede saber sin una recta dibujada", is_correct: false}
    explanation: "La correcta es $-9$, porque está a 9 unidades del origen mientras que $4$ está a solo 4 unidades."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Dibujar una recta horizontal con flechas en ambos extremos para indicar infinitud."
  - "Paso 2: Marcar un punto central para el cero (origen)."
  - 'Paso 3: Definir una escala constante y marcar puntos a la derecha para $1, 2, 3, \ldots$ y a la izquierda para $-1, -2, -3, \ldots$'
  - "Paso 4: Situar el número solicitado sobre la marca correspondiente según su signo y magnitud."
errores_correccion: |
  Un error frecuente es pensar que los números negativos van a la derecha del cero: siempre van a
  la izquierda, sin excepción. Otro error es creer que la distancia entre el cero y el uno puede ser
  distinta de la distancia entre el cero y el menos uno; la escala de la recta debe ser siempre
  constante para que la comparación de magnitudes sea válida.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Ubique los números $-4$ y $3$ en una recta numérica."
    alternativas:
      - "$-4$ a 4 unidades a la izquierda del cero; $3$ a 3 unidades a la derecha"
      - "$-4$ a la derecha del cero y $3$ a la izquierda"
      - "Ambos números se ubican a la derecha del cero"
    respuesta: "$-4$ a 4 unidades a la izquierda del cero; $3$ a 3 unidades a la derecha"
    solucion_pasos:
      - "Se traza la recta y se marca el $0$."
      - "Se cuentan 3 unidades a la derecha del $0$ para marcar el $3$."
      - "Se cuentan 4 unidades a la izquierda del $0$ para marcar el $-4$."
  - titulo: "Ejemplo 2"
    enunciado: "¿Hacia qué lado del cero se ubica un número que representa una deuda de 500 pesos?"
    alternativas:
      - "A la izquierda (número negativo)"
      - "A la derecha (número positivo)"
      - "Exactamente en el cero"
    respuesta: "A la izquierda (número negativo)"
    solucion_pasos:
      - "Se traduce la deuda como el número entero $-500$."
      - "Se reconoce que los números negativos son menores que cero."
      - "Conclusión: Se ubica a la izquierda del cero."
  - titulo: "¿El número $-3$ se ubica a la izquierda del $-1$ en la recta numérica?"
    respuesta: "Sí"
    solucion_pasos:
      - "$-3$ tiene mayor valor absoluto que $-1$, por lo que está más alejado del cero hacia la izquierda."
      - "En la recta numérica, $-3$ se encuentra a 3 unidades del cero y $-1$ a solo 1 unidad."
      - "Por lo tanto, $-3$ sí está a la izquierda de $-1$."
  - titulo: "¿El número $5$ y el número $-5$ se ubican a la misma distancia del cero?"
    respuesta: "Sí"
    solucion_pasos:
      - "$|5| = 5$: el $5$ está a 5 unidades a la derecha del cero."
      - "$|-5| = 5$: el $-5$ está a 5 unidades a la izquierda del cero."
      - "Ambos se encuentran a la misma distancia del origen, pero en lados opuestos."
errores_frecuentes:
  - "Los números negativos se ubican a la derecha del cero en la recta numérica."
  - "La distancia entre el cero y el $1$ puede ser diferente a la distancia entre el cero y el $-1$."
  - "En la recta numérica, los números no tienen un orden fijo: se pueden ubicar en cualquier posición."
  - "$-5$ está más cerca del cero que $-2$ porque $5 > 2$."
  - "La recta numérica solo representa números positivos."
afirmaciones_verdaderas:
  - "El cero se ubica como origen en la recta numérica."
  - "La distancia entre unidades consecutivas en la recta numérica es siempre igual."
al_terminar_debes_poder: |
  Ubicar cualquier entero en la recta numérica respetando el origen, el sentido (derecha/izquierda) y
  la escala constante, y comparar distancias al origen entre dos números dados.

fuente: "Manual Esencial Santillana p.48"
estado: publicado
