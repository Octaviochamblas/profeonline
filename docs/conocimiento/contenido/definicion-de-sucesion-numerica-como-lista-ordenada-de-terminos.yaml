procedimiento:
- 'Paso 1: Observa una lista de números.'
- 'Paso 2: Verifica si el orden importa (si cambiar los números de posición altera el sentido
  de la lista).'
- 'Paso 3: Identifica si es una sucesión finita (termina) o infinita (tiene puntos suspensivos...).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en definición de sucesión numérica como lista ordenada de términos.
ejemplos:
- titulo: El orden importa
  enunciado: ¿Es lo mismo la sucesión 1, 2, 3 que la sucesión 3, 2, 1?
  solucion_pasos:
  - Ambas tienen los mismos elementos matemáticos.
  - Sin embargo, el primer término de la primera es 1, y el de la segunda es 3.
  - Al ser el orden distinto, son sucesiones diferentes.
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes opciones describe correctamente una sucesión?
  alternativas:
  - Una lista ordenada de números donde la posición de cada uno importa
  - Un conjunto de números donde el orden no tiene ninguna importancia
  - Una operación que solo sirve para sumar números pares
  respuesta: Una lista ordenada de números donde la posición de cada uno importa
  solucion_pasos:
  - La definición de sucesión exige que cada número tenga una posición fija dentro de la lista.
  - Un conjunto, en cambio, no distingue el orden de sus elementos.
- titulo: Ejemplo 2
  enunciado: La sucesión 4, 7, 4, 7, 4, 7 y así sucesivamente, ¿es válida como sucesión numérica?
  alternativas:
  - Sí, porque los términos se pueden repetir mientras el orden esté definido
  - No, porque los términos no pueden repetirse nunca
  - No, porque solo existen sucesiones con términos distintos entre sí
  respuesta: Sí, porque los términos se pueden repetir mientras el orden esté definido
  solucion_pasos:
  - Una sucesión no exige que todos los términos sean distintos, solo que estén ordenados.
  - 4, 7, 4, 7 tiene un orden claro (posición impar es 4, posición par es 7), por lo tanto
    es una sucesión válida.
- titulo: ¿La sucesión 5, 3, 1 es la misma que la sucesión 1, 3, 5?
  respuesta: 'No'
  solucion_pasos:
  - Aunque tienen los mismos tres números, el primer término de una es 5 y el de la otra es
    1.
  - Como el orden es distinto, son sucesiones diferentes aunque provengan del mismo conjunto
    de números.
- titulo: ¿Una sucesión puede tener infinitos términos?
  respuesta: Sí
  solucion_pasos:
  - Existen sucesiones finitas, que terminan, como los días de una semana.
  - También existen sucesiones infinitas, que continúan indefinidamente y se indican con puntos
    suspensivos, como 2, 4, 6, 8 y así sucesivamente.
errores_frecuentes:
- Confundir una 'sucesión' con un 'conjunto'. (En los conjuntos el orden no importa, en las
  sucesiones sí).
- Pensar que las sucesiones solo pueden ir en aumento (pueden decrecer, alternar signos o
  incluso ser constantes como 3, 3, 3...).
- Creer que una sucesión debe ser siempre creciente para ser válida.
- Pensar que si dos sucesiones tienen los mismos términos son la misma sucesión, sin importar
  el orden.
- 'Confundir ''término'' con ''posición'': el término es el valor (por ejemplo 15), la posición
  es el lugar que ocupa (por ejemplo la segunda).'
afirmaciones_verdaderas:
- La formulación de definición de sucesión numérica como lista ordenada de términos mantiene
  la regularidad de la sucesión.
- Dos sucesiones con los mismos números pero en distinto orden se consideran sucesiones diferentes.
