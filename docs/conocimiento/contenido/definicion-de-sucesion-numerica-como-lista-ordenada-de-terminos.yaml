procedimiento:
- 'Paso 1: Observa una lista de números.'
- 'Paso 2: Verifica si el orden importa (si cambiar los números de posición altera
  el sentido de la lista).'
- 'Paso 3: Identifica si es una sucesión finita (termina) o infinita (tiene puntos
  suspensivos...).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en definición de sucesión numérica como lista ordenada de términos.
ejemplos:
- titulo: El orden importa
  enunciado: ¿Es lo mismo la sucesión 1, 2, 3 que la sucesión 3, 2, 1?
  solucion_pasos:
  - Ambas tienen los mismos elementos matemáticos.
  - Sin embargo, el primer término de la primera es 1, y el de la segunda es 3.
  - Al ser el orden distinto, son sucesiones diferentes.
errores_frecuentes:
- Confundir una 'sucesión' con un 'conjunto'. (En los conjuntos el orden no importa,
  en las sucesiones sí).
- Pensar que las sucesiones solo pueden ir en aumento (pueden decrecer, alternar signos
  o incluso ser constantes como 3, 3, 3...).
afirmaciones_verdaderas:
- La formulación de definición de sucesión numérica como lista ordenada de términos
  mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando definición de sucesión
