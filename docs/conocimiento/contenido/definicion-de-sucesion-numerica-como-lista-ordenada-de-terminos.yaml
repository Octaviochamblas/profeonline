resumen_inicial: Una sucesión numérica es una secuencia infinita de números reales
  ordenados $(a_n)_{n \in \mathbb{N}} = (a_1, a_2, a_3, \dots)$, donde cada elemento
  ocupa una posición discreta fija $n \in \mathbb{N}^+$.
explicacion_simple: Una sucesión es como una fila interminable de números en la que
  el orden importa completamente. Hay un primer número en la posición 1, un segundo
  en la posición 2, y así sucesivamente sin detenerse jamás.
explicacion_formal: 'Formalmente, una **Sucesión de Números Reales** es una función
  $a: \mathbb{N}^+ \to \mathbb{R}$ que asigna a cada número natural $n$ un único valor
  real $a(n) = a_n$:


  $$(a_n)_{n \in \mathbb{N}^+} = (a_1, a_2, a_3, \dots, a_n, \dots)$$


  **Dominio discreto:**

  - El dominio de entrada está formado estrictamente por los enteros positivos $\mathbb{N}^+
  = \{1, 2, 3, \dots\}$.'
definiciones_clave: '- **Sucesión numérica**: Función $a: \mathbb{N}^+ \to \mathbb{R}$
  representada como lista ordenada de elementos $a_n$.'
propiedades_relaciones: '- **Orden de posición**: La posición $n$ es el orden entero
  positivo del término en la lista.'
ejemplo_guiado:
  enunciado: Dada la sucesión de los números pares positivos $(2, 4, 6, 8, 10, \dots)$,
    identificaciones las posiciones $n=1, 2, 3$.
  pasos:
  - 'Paso 1: Para la posición $n=1$, el valor es $a_1 = 2$.'
  - 'Paso 2: Para la posición $n=2$, el valor es $a_2 = 4$.'
  - 'Paso 3: Para la posición $n=3$, el valor es $a_3 = 6$.'
  - 'Conclusión: Los valores ocupan posiciones correlativas fijas $a_1=2, a_2=4, a_3=6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio formal de entrada de una sucesión numérica?
  choices:
  - text: El conjunto de los números enteros positivos N+ = {1, 2, 3, ...}
    is_correct: true
  - text: Todos los números reales R
    is_correct: false
  - text: Únicamente los números negativos
    is_correct: false
  - text: El número cero solamente
    is_correct: false
  explanation: La alternativa correcta es 'El conjunto de los números enteros positivos
    N+ = {1, 2, 3, ...}'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la sucesión de números pares positivos (2, 4, 6, 8, ...), ¿qué valor
    ocupa la posición n = 3?
  choices:
  - text: '6'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '8'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '6'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir formalmente una sucesión
  numérica como una función de dominio entero positivo $\mathbb{N}^+$ a valores reales.
semantic_id: MAT.NUM.SUCESIONES_BASE.DEFINICION
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.DEFINICION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
