semantic_id: MAT.NUM.SUCESIONES_BASE.DEFINICION
resumen_inicial: 'Definición de sucesión numérica como lista ordenada de términos:
  concepto y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: ¿Has notado que los años bisiestos ocurren cada 4 años? 2020,
  2024, 2028... Estás frente a una sucesión. A diferencia de un grupo de números al
  azar, aquí el orden y el patrón lo son todo.
explicacion_formal: 'Imagina una fila de personas esperando entrar a un concierto.
  Cada persona tiene un número de llegada: el primero, el segundo, el tercero. Una
  **sucesión numérica** es exactamente eso: una fila de números.


  - **Orden:** Es la característica principal. El conjunto $\{2, 4, 6\}$ tiene los
  mismos números que la sucesión $6, 4, 2$, pero como sucesiones son totalmente distintas
  porque el orden cambió.

  - **Términos:** Cada número dentro de la sucesión se llama ''término''.

  - **Patrón:** Casi todas las sucesiones que estudiarás tienen una regla matemática
  que predice el futuro (ej. ''sumar 3 al anterior'').


  Ejemplo: $5, 10, 15, 20, \dots$ es una sucesión donde cada término es múltiplo de
  5, ordenados de menor a mayor.'
definiciones_clave: '- **Definición de sucesión numérica como lista ordenada de términos**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Definición de sucesión numérica como lista
