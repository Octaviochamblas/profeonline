semantic_id: MAT.NUM.SUCESIONES_BASE.DEFINICION
resumen_inicial: 'Definición de sucesión numérica como lista ordenada de términos: concepto
  y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: ¿Has notado que los años bisiestos ocurren cada 4 años? 2020, 2024, 2028...
  Estás frente a una sucesión. A diferencia de un grupo de números al azar, aquí el orden
  y el patrón lo son todo.
explicacion_formal: 'Imagina una fila de personas esperando entrar a un concierto. Cada persona
  tiene un número de llegada: el primero, el segundo, el tercero. Una **sucesión numérica**
  es exactamente eso: una fila de números.


  - **Orden:** Es la característica principal. El conjunto $\{2, 4, 6\}$ tiene los mismos
  números que la sucesión $6, 4, 2$, pero como sucesiones son totalmente distintas porque
  el orden cambió.

  - **Términos:** Cada número dentro de la sucesión se llama ''término''.

  - **Patrón:** Casi todas las sucesiones que estudiarás tienen una regla matemática que predice
  el futuro (ej. ''sumar 3 al anterior'').


  Ejemplo: $5, 10, 15, 20, \dots$ es una sucesión donde cada término es múltiplo de 5, ordenados
  de menor a mayor.'
definiciones_clave: '- **Definición de sucesión numérica como lista ordenada de términos**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Definición de sucesión numérica como lista ordenada
  de términos**: Relaciones de cambio y fórmulas estructurales de conceptos fundamentales
  de sucesiones.'
ejemplo_guiado:
  enunciado: 'Un profesor anota las temperaturas registradas a las 8, 9, 10 y 11 horas, en
    ese orden: 12°C, 15°C, 19°C, 18°C. Determina si esta lista forma una sucesión y explica
    por qué.'
  pasos:
  - Verificar si los datos están ordenados; cada temperatura corresponde a una hora específica
    y consecutiva (8, 9, 10, 11).
  - Confirmar que el orden es relevante; cambiar el orden (por ejemplo, poner primero la de
    las 11 horas) alteraría el sentido de la información registrada.
  - Concluir que sí es una sucesión, 12, 15, 19, 18, aunque no crezca todo el tiempo (baja
    entre la tercera y la cuarta hora).
