semantic_id: MAT.ALG.SIMILARIDAD.DEFINICION_TERMINOS_SEMEJANTES
resumen_inicial: La definición de términos semejantes establece que dos o más monomios son semejantes si y solo si poseen exactamente el mismo factor literal, es decir, las mismas variables elevadas a los mismos exponentes.
explicacion_simple: "En álgebra, dos o más términos son **términos semejantes** cuando tienen **exactamente las mismas letras elevadas a los mismos exponentes**, sin importar qué coeficiente numérico tengan:\n- **Condición única**: Mismo factor literal (mismas variables con mismos exponentes).\n- **Lo que SÍ puede cambiar**: El coeficiente numérico o el signo delante del término.\n- **Ejemplos de términos semejantes**:\n  - $3x$ y $-7x$ $\\implies$ Ambos tienen el factor literal $x$.\n  - $5a^2 b$ y $\\frac{1}{2}a^2 b$ $\\implies$ Ambos tienen el factor literal $a^2 b$.\n  - $-4x^3 y^2$ y $9x^3 y^2$ $\\implies$ Ambos tienen el factor literal $x^3 y^2$.\n- **¿Por qué son importantes?** Únicamente los términos semejantes se pueden **sumar o restar entre sí** para reducir expresiones algebraicas.\n\n![Definición de Términos Semejantes](/static/img/nodos/definicion-de-terminos-semejantes-intro.svg)\n"
explicacion_formal: '### Definición formal

  Dos monomios $M_1(x_1, \dots, x_k) = c_1 \cdot x_1^{a_1} x_2^{a_2} \dots x_k^{a_k}$ y $M_2(x_1, \dots, x_k) = c_2 \cdot x_1^{b_1} x_2^{b_2} \dots x_k^{b_k}$ definidos sobre el mismo conjunto de variables se consideran **semejantes** ($M_1 \sim M_2$) si y solo si sus exponentes respectivos coinciden de forma idéntica para cada variable:


  $$M_1 \sim M_2 \iff a_i = b_i \quad \forall i \in \{1, 2, \dots, k\}$$


  independientemente de los coeficientes $c_1, c_2 \in \mathbb{R}$.


  ### Relación de Equivalencia Algebraica

  La semejanza de monomios es una **relación de equivalencia** sobre el conjunto de los monomios $\mathcal{M}$, cumpliendo:

  1. **Reflexiva**: $M \sim M$.

  2. **Simétrica**: $M_1 \sim M_2 \iff M_2 \sim M_1$.

  3. **Transitiva**: $M_1 \sim M_2 \land M_2 \sim M_3 \implies M_1 \sim M_3$.


  ### Síntesis didáctica

  La clasificación por términos semejantes subdivide las expresiones polinómicas en clases de equivalencia sumables, permitiendo la reducción de expresiones complejas.

  '
definiciones_clave: '- **Términos semejantes**: Monomios que comparten idénticas variables elevadas a idénticos exponentes.

  - **Factor literal**: Conjunto formado por las letras de un monomio junto con sus respectivos exponentes ($x^a y^b$).

  - **Coeficiente numérico**: Factor constante ($c \in \mathbb{R}$) que multiplica al factor literal y puede variar libremente entre términos semejantes.

  '
propiedades_relaciones: '- **Operatividad aditiva exclusiva**: La adición y sustracción algebraica se define exclusivamente sobre la clase de equivalencia de los términos semejantes.

  - **Invarianza por coeficiente**: Cambiar, multiplicar o dividir el coeficiente numérico de un término no altera su semejanza con otro monomio.

  '
ejemplo_guiado:
  enunciado: Determina si los términos $4x^2 y^3$ y $-9x^2 y^3$ son semejantes justificando la respuesta.
  pasos:
  - 'Paso 1: Identificamos el factor literal del primer término $4x^2 y^3 \implies x^2 y^3$.'
  - 'Paso 2: Identificamos el factor literal del segundo término $-9x^2 y^3 \implies x^2 y^3$.'
  - 'Paso 3: Comparamos las variables y sus exponentes: La variable $x$ está elevada a $2$ en ambos; la variable $y$ está elevada a $3$ en ambos.'
  - 'Paso 4: Verificamos los coeficientes: $4$ y $-9$ son distintos, lo cual es permitido.'
  - 'Conclusión: Los términos **SÍ son semejantes** porque comparten exactamente el mismo factor literal $x^2 y^3$.'
  imagen: /static/img/nodos/definicion-de-terminos-semejantes-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición matemática obligatoria deben cumplir dos monomios para ser clasificados como términos semejantes?
  choices:
  - text: Deben tener exactamente el mismo factor literal (mismas variables con mismos exponentes)
    is_correct: true
  - text: Deben tener el mismo coeficiente numérico
    is_correct: false
  - text: Deben tener el mismo signo positivo o negativo
    is_correct: false
  - text: Deben tener distinto número de variables
    is_correct: false
  explanation: La alternativa correcta es 'Deben tener exactamente el mismo factor literal (mismas variables con mismos exponentes)'. Definición de semejanza.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Son semejantes los términos $7a^3 b$ y $-2a^3 b$?
  choices:
  - text: Sí, son semejantes porque ambos comparten el factor literal $a^3 b$
    is_correct: true
  - text: No, porque sus coeficientes $7$ y $-2$ son distintos
    is_correct: false
  - text: No, porque uno es positivo y el otro negativo
    is_correct: false
  - text: No, porque se están restando
    is_correct: false
  explanation: La alternativa correcta es 'Sí, son semejantes porque ambos comparten el factor literal $a^3 b$'. Mismo factor literal $a^3 b$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar el factor literal del primer término excluyendo su coeficiente numérico.'
- 'Paso 2: Aislar el factor literal del segundo término.'
- 'Paso 3: Verificar que cada variable presente en el primer término aparezca en el segundo con la misma potencia.'
- 'Paso 4: Concluir que los términos son semejantes si los factores literales coinciden plenamente.'
errores_correccion: '- **Error 1:** Declarar que dos términos no son semejantes porque sus coeficientes numéricos son distintos (ej: decir que $3x$ y $8x$ no son semejantes). **Cómo corregirlo:** Los coeficientes **PUEDEN SER DIFERENTES**; lo único que debe ser idéntico es el factor literal ($x$).

  - **Error 2:** Exigir que los términos tengan el mismo signo para ser semejantes. **Cómo corregirlo:** El signo forma parte del coeficiente numérico; términos con signos opuestos **SÍ PUEDEN SER SEMEJANTES**.

  '
ejemplos:
- titulo: Semejanza simple
  enunciado: ¿Son semejantes los términos $5m$ y $-12m$?
  alternativas:
  - Sí, ambos comparten el factor literal $m$
  - No, porque $-12$ es negativo
  - No, porque 5 y 12 son distintos
  respuesta: Sí, ambos comparten el factor literal $m$
  solucion_pasos:
  - '1. Factor 1: $m$. Factor 2: $m$.'
  - 2. Mismo factor literal $\implies$ Semejantes.
- titulo: Semejanza con varias variables
  enunciado: ¿Son semejantes los términos $-2p^4 q$ y $9p^4 q$?
  alternativas:
  - Sí, ambos comparten $p^4 q$
  - No, les faltan variables
  - No, por los coeficientes
  respuesta: Sí, ambos comparten $p^4 q$
  solucion_pasos:
  - 1. Coinciden $p^4$ y $q^1$ en ambos.
  - 2. Son términos semejantes.
- titulo: Constantes solas
  enunciado: ¿Se consideran semejantes dos números constantes sin variables como $15$ y $-8$?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos poseen el factor literal $x^0 = 1$.
- titulo: Semejanza con coeficientes fraccionarios
  enunciado: ¿Son semejantes los términos $\frac{3}{4}x^2$ y $-5x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, comparten el factor literal $x^2$.
errores_frecuentes:
- Declarar que dos términos no son semejantes al presentar coeficientes numéricos diferentes.
- Exigir que los términos tengan el mismo signo para ser clasificados como semejantes.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Intercambiar el factor literal con el valor del coeficiente numérico del monomio.
- Declarar que dos constantes numéricas sin letras no son términos semejantes.
afirmaciones_verdaderas:
- Dos monomios son semejantes si y solo si comparten exactamente el mismo factor literal.
- Los coeficientes numéricos de dos términos semejantes pueden ser totalmente distintos en valor y signo.
al_terminar_debes_poder: '![Resumen de términos semejantes](/static/img/nodos/definicion-de-terminos-semejantes-resumen.svg)


  QUÉ: Identificar cuándo dos o más monomios son semejantes en una expresión algebraica.


  CÓMO: Comparar su parte literal, verificando que contengan exactamente las mismas variables elevadas a los mismos exponentes ($T_1 \sim T_2 \Longleftrightarrow \operatorname{PL}(T_1) \equiv \operatorname{PL}(T_2)$).'
