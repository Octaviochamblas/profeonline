semantic_id: MAT.ALG.SIMILARIDAD.DEFINICION_TERMINOS_SEMEJANTES
resumen_inicial: 'Definición de términos semejantes: procedimiento y reglas en Términos
  semejantes.'
explicacion_simple: En la vida diaria, podemos sumar 3 manzanas con 2 manzanas para
  obtener 5 manzanas. Pero no podemos sumar 3 manzanas con 2 peras y decir que tenemos
  '5 manzanaperas'. En álgebra, la regla es exactamente la misma.
explicacion_formal: '### Definición formal


  La semejanza algebraica depende única y exclusivamente del factor literal (letras
  y exponentes). Los coeficientes solo indican cantidad.


  ### Desarrollo didáctico


  Dos términos son ''familia'' (semejantes) única y exclusivamente si sus letras y
  los pequeños números sobre ellas (exponentes) son idénticos.

  - $3a$ y $5a$ son semejantes (ambos son de la familia ''a'').

  - $-2x^2y$ y $7x^2y$ son semejantes (ambos de la familia ''x al cuadrado, y'').


  El coeficiente (el número grande adelante, como el $3$, $5$, $-2$ o $7$) nos dice
  **cuántos** elementos de esa familia tenemos. No define si son familia o no.'
definiciones_clave: '- **Definición de términos semejantes**: Operación o propiedad
  fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a definición de términos semejantes.'
ejemplo_guiado:
  enunciado: Aplica definición de términos semejantes en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de definición de términos semejantes.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
