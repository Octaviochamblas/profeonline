resumen_inicial: Dos o más términos algebraicos son semejantes si tienen exactamente
  las mismas variables literales elevadas a los mismos exponentes respectivos.
explicacion_simple: Los términos semejantes son aquellos que pertenecen a la 'misma
  especie' algebraica. Tienen exactamente las mismas letras y los mismos exponentes
  en cada letra (por ejemplo $4x^2y$ y $-7x^2y$). Los números de adelante (coeficientes)
  pueden ser totalmente distintos, pero las letras y sus exponentes deben ser idénticos.
explicacion_formal: 'Dados dos términos $T_1 = c_1 \cdot L_1$ y $T_2 = c_2 \cdot L_2$
  con $c_1, c_2 \in \mathbb{R} \setminus \{0\}$, la **Semejanza Algebraica** $T_1
  \sim T_2$ se define formalmente como la equivalencia de sus partes literales:


  $$T_1 \sim T_2 \iff L_1 = L_2 \iff \prod_{j=1}^m x_j^{e_{1,j}} = \prod_{j=1}^m x_j^{e_{2,j}}$$


  $$\forall j \in \{1, \dots, m\}, \quad e_{1,j} = e_{2,j}$$


  > **Complemento didáctico:** La semejanza de términos define la relación de equivalencia
  que permite la factorización de la parte literal por la propiedad distributiva.'
definiciones_clave: '- **Términos semejantes**: Términos que poseen idéntica parte
  literal (mismas variables con mismos exponentes).

  - **Factor común literal**: Bloque literal idéntico $L$ compartido por los términos.'
propiedades_relaciones: '- **Relación de equivalencia**: La semejanza es reflexiva
  ($T \sim T$), simétrica ($T_1 \sim T_2 \implies T_2 \sim T_1$) y transitiva.'
ejemplo_guiado:
  enunciado: Determine si los términos $T_1 = 8x^3y^2$ y $T_2 = -5x^3y^2$ son semejantes.
  pasos:
  - 'Paso 1: Extraer la parte literal de $T_1$: $x^3y^2$.

    - Paso 2: Extraer la parte literal de $T_2$: $x^3y^2$.'
  - 'Paso 3: Comparar las variables y exponentes: variable $x$ con exponente $3$ en
    ambos; variable $y$ con exponente $2$ en ambos.'
  - 'Paso 4: Comprobar la igualdad de partes literales: $L_1 = L_2 = x^3y^2$.'
  - 'Conclusión: Dado que poseen idéntica parte literal, $T_1$ y $T_2$ SÍ son términos
    semejantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición exige la definición formal de términos semejantes?
  choices:
  - text: Que compartan exactamente la misma parte literal, con las mismas variables
      e idénticos exponentes
    is_correct: true
  - text: Que tengan coeficientes numéricos iguales
    is_correct: false
  - text: Que sus signos sean positivos de forma obligatoria
    is_correct: false
  - text: Que su grado sea cero
    is_correct: false
  explanation: La alternativa correcta es 'Que compartan exactamente la misma parte
    literal, con las mismas variables e idénticos exponentes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 8x^3y^2 y -5x^3y^2, ¿por qué fueron clasificados
    como términos semejantes?
  choices:
  - text: Porque ambos términos poseen la misma parte literal x^3y^2
    is_correct: true
  - text: Porque 8 y -5 son números impares
    is_correct: false
  - text: Porque se pueden restar dando 3
    is_correct: false
  - text: Porque no tienen coeficientes
    is_correct: false
  explanation: La alternativa correcta es 'Porque ambos términos poseen la misma parte
    literal x^3y^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar la parte literal de cada término dejando fuera los coeficientes
  numéricos.'
- 'Paso 2: Comparar variable por variable sus exponentes respectivos.'
- 'Paso 3: Si coinciden todas las variables y exponentes, declarar que son términos
  semejantes.'
errores_correccion: '- **Error 1: Declarar que $4x^2y$ y $4xy^2$ son semejantes porque
  tienen las mismas letras y los mismos números.** **Cómo corregirlo:** Los exponentes
  deben pertenecer a la misma variable ($x^2$ no es $x^1$), por lo que NO son semejantes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes pares contiene términos semejantes?
  alternativas:
  - -3a^2b^5 y 7a^2b^5
  - 4x^3y y 4x^3y^2
  - 5m y 5n
  - 2a^3 y 3a^2
  respuesta: -3a^2b^5 y 7a^2b^5
  solucion_pasos:
  - 1. Ambos términos tienen la misma parte literal a^2b^5. Son semejantes.
- titulo: Ejemplo 2
  enunciado: En la pareja de términos 12x^4 y -2x^4, ¿qué elemento permite afirmar
    que son semejantes?
  alternativas:
  - La igualdad de su parte literal x^4
  - El coeficiente 12
  - El signo negativo de -2
  - La ausencia de y
  respuesta: La igualdad de su parte literal x^4
  solucion_pasos:
  - 1. Comparten la misma variable x elevada al mismo exponente 4. Son semejantes.
- titulo: ¿Son semejantes los términos 6xy^3 y -11xy^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos poseen la parte literal idéntica xy^3.
- titulo: ¿Son semejantes los términos 3a^2b y 3ab^2?
  respuesta: 'No'
  solucion_pasos:
  - No, en el primer término 'a' está al cuadrado y en el segundo 'b' está al cuadrado.
errores_frecuentes:
- Declarar semejantes a términos que tienen las mismas letras pero con exponentes
  intercambiados.
- Exigir que los coeficientes numéricos sean iguales para que dos términos sean semejantes.
- Declarar que los signos de los términos deben ser iguales para permitir la semejanza.
- Declarar la igualdad de grado absoluto con la semejanza de parte literal.
- Omitir el exponente 1 de una variable al verificar la igualdad de parte literal.
afirmaciones_verdaderas:
- Dos términos son semejantes si tienen exactamente las mismas letras con los mismos
  exponentes.
- Los coeficientes numéricos de dos términos semejantes pueden ser totalmente diferentes.
al_terminar_debes_poder: Al terminar serás capaz de definir y verificar la semejanza
  entre términos algebraicos comprobando la coincidencia exacta de su parte literal.
