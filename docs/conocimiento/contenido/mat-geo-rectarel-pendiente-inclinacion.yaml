- titulo: ¿Se cumple siempre la propiedad principal de relación entre pendiente y
    ángulo de inclinación de una recta en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede relación entre pendiente y ángulo de inclinación de una recta asumir
