semantic_id: MAT.GEO.RECTA_RELACIONES.PENDIENTE_INCLINACION
resumen_inicial: 'Relación entre pendiente y ángulo de inclinación de una recta: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'La pendiente no es un número arbitrario: está directamente relacionada
  con el ángulo que la recta forma con la horizontal, mediante la función tangente.'
explicacion_formal: '![Pendiente y ángulo de inclinación](/static/img/geometria/analitica/rectarel-pendiente-inclinacion.svg)


  ### Definición formal


  El ángulo de inclinación $\alpha$ de una recta (con $0°\le\alpha<180°$) es el ángulo
  que forma con el semieje positivo de las x, medido en sentido antihorario. Se cumple
  $m=\tan\alpha$.


  ### Desarrollo didáctico


  Una recta con pendiente $m=1$ tiene ángulo de inclinación $\alpha=45°$, ya que $\tan45°=1$.
  Una recta con $m=-1$ tiene $\alpha=135°$, ya que $\tan135°=-1$.'
