procedimiento:
- 'Paso 1: Si conoces la pendiente m, calcula el ángulo de inclinación como α=arctan(m),
  ajustando el cuadrante si m es negativo.'
- 'Paso 2: Si conoces el ángulo de inclinación α, calcula la pendiente como m=tanα.'
- 'Paso 3: Recuerda que el ángulo de inclinación está siempre entre 0° y 180° (sin
  incluir 180°).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con relación entre pendiente y ángulo de inclinación de una
  recta.
