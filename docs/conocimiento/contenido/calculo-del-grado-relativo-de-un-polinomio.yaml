semantic_id: MAT.ALG.POLINOMIOS.GRADO_RELATIVO_POLINOMIO
resumen_inicial: 'El grado relativo de un polinomio con respecto a una variable es el mayor exponente que tiene dicha variable en cualquiera de los términos del polinomio.'
explicacion_simple: |
  - El **grado relativo (GR)** se calcula para **una letra a la vez**.
  - **¿Cómo se halla?**
    1. Buscamos esa letra en todos los términos del polinomio.
    2. Miramos sus exponentes y nos quedamos con el **mayor de todos**.
  - Por ejemplo, en $P(x, y) = 5x^4y^2 - 3x^6y + 2xy^5$:
    - Para la letra $x$, los exponentes son $4$, $6$ y $1$. El mayor es **$6$**, así que $\text{GR}(x) = **6$**.
    - Para la letra $y$, los exponentes son $2$, $1$ y $5$. El mayor es **$5$**, así que $\text{GR}(y) = **5$**.

  ![Grado Relativo de un Polinomio](/static/img/nodos/calculo-del-grado-relativo-de-un-polinomio-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $P(x_1, \dots, x_n) = \sum_{j=1}^m T_j$ un polinomio no nulo en $\mathbb{K}[x_1, \dots, x_n]$, donde cada término $T_j$ tiene exponente $e_{j,k}$ en la variable $x_k$.
  El **grado relativo de $P$ respecto a $x_k$**, denotado $\operatorname{GR}_{x_k}(P)$ o $\operatorname{gr}(P, x_k)$, es el supremo de dichos exponentes:

  $$\operatorname{GR}_{x_k}(P) = \max_{1 \le j \le m} e_{j,k}$$

  ### Desigualdad fundamental
  Para todo polinomio multivariable y cualquier variable $x_k$:
  $$\operatorname{GR}_{x_k}(P) \le \operatorname{GA}(P)$$
  La igualdad se alcanza si y solo si el término de mayor grado absoluto es monovariable en $x_k$ o concentra en $x_k$ la totalidad de la potencia del monomio principal.
definiciones_clave: |
  - **Grado relativo de un polinomio**: Mayor exponente de una variable específica presente en la expresión.
  - **Variable ordenadora**: Variable respecto a la cual se mide el grado relativo y se ordena el polinomio.
  - **Grado nulo por ausencia**: Si una variable no figura en ningún término del polinomio, su grado relativo es $0$.
propiedades_relaciones: |
  - **Independencia entre variables**: El grado relativo respecto a una variable no se ve alterado por los exponentes de las otras letras.
  - **Grado relativo de productos**: $\operatorname{GR}_x(P \cdot Q) = \operatorname{GR}_x(P) + \operatorname{GR}_x(Q)$.
ejemplo_guiado:
  enunciado: 'En el polinomio $P(x, y, z) = 7x^3y^6z^2 - 4x^5y^2z^4 + 9x^2y^7z - 12$, calcula el grado relativo respecto a cada una de las variables $x$, $y$ y $z$.'
  imagen: '/static/img/nodos/calculo-del-grado-relativo-de-un-polinomio-ejemplos.svg'
  pasos:
    - 'Paso 1: Evaluamos los exponentes de la variable $x$: figuran $3, 5, 2$. El valor máximo es **$5$** $\implies **\operatorname{GR}(x) = 5$**.'
    - 'Paso 2: Evaluamos los exponentes de la variable $y$: figuran $6, 2, 7$. El valor máximo es **$7$** $\implies **\operatorname{GR}(y) = 7$**.'
    - 'Paso 3: Evaluamos los exponentes de la variable $z$: figuran $2, 4, 1$. El valor máximo es **$4$** $\implies **\operatorname{GR}(z) = 4$**.'
    - 'Paso 4: Conclusión: Los grados relativos son $\operatorname{GR}(x) = 5$, $\operatorname{GR}(y) = 7$ y $\operatorname{GR}(z) = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el polinomio $P(x, y) = 2x^4y^3 - 8x^2y^7 + 5x^6y$, ¿cuál es el grado relativo respecto a la variable $y$?'
    choices:
      - text: '$7$, porque es el mayor exponente que afecta a la letra $y$'
        is_correct: true
      - text: '$9$, sumando $2 + 7$'
        is_correct: false
      - text: '$6$, porque es el mayor exponente de $x$'
        is_correct: false
      - text: '$11$, sumando todos los exponentes de $y$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$7$, porque es el mayor exponente que afecta a la letra $y$''. $\operatorname{GR}(y) = \max(3, 7, 1) = 7$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un polinomio no contiene en ninguno de sus términos a la variable $w$, ¿cuál es su grado relativo respecto a $w$?'
    choices:
      - text: '$0$, porque $w^0 = 1$'
        is_correct: true
      - text: '$1$'
        is_correct: false
      - text: 'No está definido'
        is_correct: false
      - text: '$-1$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$0$, porque $w^0 = 1$''. Una variable ausente tiene exponente implícito cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Fijar la variable de interés.'
  - 'Paso 2: Recorrer todos los términos del polinomio anotando el exponente de dicha variable en cada uno.'
  - 'Paso 3: Seleccionar el exponente máximo de la lista.'
  - 'Paso 4: Enunciar el resultado como el grado relativo respecto a esa variable.'
errores_correccion: |
  - **Error 1:** Sumar los exponentes de una misma letra en los distintos términos. **Cómo corregirlo:** El grado relativo es el **mayor exponente individual**, no la suma.
  - **Error 2:** Confundir grado relativo con grado absoluto. **Cómo corregirlo:** $\operatorname{GR}(x)$ solo evalúa los **exponentes de $x$**, ignorando las demás letras.
ejemplos:
  - titulo: 'Grado relativo de dos variables'
    enunciado: 'En el polinomio $Q(a, b) = 3a^5b^2 - 4a^2b^8 + a^3b^4$, ¿cuáles son los valores de $\operatorname{GR}(a)$ y $\operatorname{GR}(b)$?'
    alternativas:
      - '$\operatorname{GR}(a) = 5$ y $\operatorname{GR}(b) = 8$'
      - '$\operatorname{GR}(a) = 10$ y $\operatorname{GR}(b) = 14$'
      - '$\operatorname{GR}(a) = 8$ y $\operatorname{GR}(b) = 5$'
    respuesta: '$\operatorname{GR}(a) = 5$ y $\operatorname{GR}(b) = 8$'
    solucion_pasos:
      - '1. Exponentes de $a$: 5, 2, 3 $\implies \max = 5$.'
      - '2. Exponentes de $b$: 2, 8, 4 $\implies \max = 8$.'
      - '3. $\operatorname{GR}(a) = 5, \operatorname{GR}(b) = 8$.'
  - titulo: 'Grado relativo de letra con exponente 1'
    enunciado: 'En $P(x, y) = 4x^3y - 2x^2 + 5$, ¿cuál es $\operatorname{GR}(y)$?'
    alternativas:
      - '$1$'
      - '$0$'
      - '$3$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. La variable $y$ solo figura en el primer término con exponente 1 ($y = y^1$).'
      - '2. El grado relativo respecto a $y$ es 1.'
  - titulo: 'Comparación con grado absoluto'
    enunciado: '¿Es siempre el grado relativo de cualquier letra menor o igual al grado absoluto del polinomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Cada término suma los exponentes de todas las letras.'
      - '2. Por definición, $\operatorname{GR}_x(P) \le \operatorname{GA}(P)$.'
  - titulo: 'Suma de exponentes de la misma letra'
    enunciado: 'En $x^4 + x^3 + x^2$, ¿es el grado relativo respecto a $x$ igual a 9?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Los exponentes no se suman entre términos.'
      - '2. $\operatorname{GR}(x) = \max(4, 3, 2) = 4$.'
errores_frecuentes:
  - 'Sumar los exponentes de una variable a lo largo de los diferentes términos del polinomio.'
  - 'Confundir el grado relativo respecto a una variable con el grado absoluto de un monomio.'
  - 'Asignar grado relativo cero a una variable que aparece sin superíndice escrito (su grado es 1).'
  - 'Ignorar términos que contienen la variable de interés si no ocupan la primera posición.'
  - 'Suponer que el grado relativo respecto a una variable depende de los coeficientes de los términos.'
afirmaciones_verdaderas:
  - 'El grado relativo de un polinomio respecto a una variable es el mayor exponente que dicha letra posee en la expresión.'
  - 'El grado relativo respecto a cualquier variable nunca puede superar al grado absoluto del polinomio.'
al_terminar_debes_poder: |
  ![Resumen de Grado Relativo](/static/img/nodos/calculo-del-grado-relativo-de-un-polinomio-resumen.svg)

  QUÉ: Calcular el grado relativo de un polinomio multivariable con respecto a cualquier letra individual y compararlo con el grado absoluto.
  CÓMO: Identificando el exponente máximo de la variable de referencia ($\operatorname{GR}_{x_k}(P) = \max_{j} e_{j,k}$) en polinomios como $5x^4y^2 - 3x^6y + 2xy^5$.
