resumen_inicial: El grado relativo de un polinomio respecto a una variable es el mayor
  exponente que dicha variable alcanza en cualquiera de sus términos.
explicacion_simple: Para hallar el grado relativo respecto a la letra $x$ en un polinomio
  como $3x^2y^4 - 5x^7y + 2x^4y^3$, observamos únicamente los exponentes de la letra
  $x$ ($2$, $7$ y $4$). El mayor exponente de la $x$ es $7$, por lo que el grado relativo
  respecto a $x$ es $7$.
explicacion_formal: 'Dado un polinomio no nulo $P(x_1, x_2, \dots, x_m) = \sum_{k=1}^n
  T_k$ donde $T_k = c_k x_1^{e_{k,1}} x_2^{e_{k,2}} \dots x_m^{e_{k,m}}$, el **Grado
  Relativo respecto a la variable** $x_j$, denotado $G.R.(x_j, P)$, se define por:


  $$G.R.(x_j, P) = \max_{1 \le k \le n} \{ e_{k,j} \}$


  > **Complemento didáctico:** El grado relativo mide el alcance exponencial individual
  de cada variable dentro de la estructura polinómica.'
definiciones_clave: '- **Grado relativo $G.R.(x_j)$**: El mayor exponente asignado
  a la variable $x_j$ en los términos del polinomio.'
propiedades_relaciones: '- **Relación con el grado absoluto**: $G.A.(P) \le \sum_{j=1}^m
  G.R.(x_j, P)$.'
ejemplo_guiado:
  enunciado: Calcule $G.R.(x)$ y $G.R.(y)$ en el polinomio $P(x,y) = 4x^3y^6 - 9x^8y^2
    + 7x^5y^4$.
  pasos:
  - 'Paso 1: Exponentes de $x$ en cada término: $3$, $8$, $5$. Máximo $= 8 \implies
    G.R.(x) = 8$.'
  - 'Paso 2: Exponentes de $y$ en cada término: $6$, $2$, $4$. Máximo $= 6 \implies
    G.R.(y) = 6$.'
  - 'Conclusión: $G.R.(x) = 8$ y $G.R.(y) = 6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se determina el grado relativo de un polinomio respecto a una variable
    específica?
  choices:
  - text: Identificando el mayor exponente que esa variable específica tiene en todo
      el polinomio
    is_correct: true
  - text: Sumando los exponentes de todas las letras en el primer término
    is_correct: false
  - text: Restando los exponentes de las otras variables
    is_correct: false
  - text: Multiplicando los coeficientes de los términos
    is_correct: false
  explanation: La alternativa correcta es 'Identificando el mayor exponente que esa
    variable específica tiene en todo el polinomio'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4x^3y^6 - 9x^8y^2 + 7x^5y^4, ¿cuál fue el G.R.(y)?
  choices:
  - text: '6'
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '14'
    is_correct: false
  explanation: La alternativa correcta es '6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar la variable de interés.'
- 'Paso 2: Listar los exponentes que dicha variable posee en cada monomio del polinomio.'
- 'Paso 3: Seleccionar el número mayor como grado relativo de esa variable.'
errores_correccion: '- **Error 1: Sumar los exponentes de otras variables al buscar
  el grado relativo.** **Cómo corregirlo:** El grado relativo observa únicamente los
  exponentes de la variable consultada.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el grado relativo respecto a y del polinomio P(x, y) = 6x^5y^2
    - 3x^2y^7 + 8xy^4?
  alternativas:
  - '7'
  - '5'
  - '2'
  - '14'
  respuesta: '7'
  solucion_pasos:
  - '1. Exponentes de y: 2, 7, 4.'
  - 2. El máximo exponente es 7. Por lo tanto, G.R.(y) = 7.
- titulo: Ejemplo 2
  enunciado: En el polinomio Q(a, b, c) = 2a^4b^3c^9 - 5a^6b^8c^2, ¿cuál es el G.R.(c)?
  alternativas:
  - '9'
  - '8'
  - '6'
  - '16'
  respuesta: '9'
  solucion_pasos:
  - '1. Exponentes de c: 9 y 2.'
  - 2. El mayor exponente de c es 9.
- titulo: ¿Es el grado relativo de x en el polinomio 5x^4y^2 - 2x^6y idéntico a 6?
  respuesta: Sí
  solucion_pasos:
  - Sí, el mayor exponente de la variable x es 6 en el segundo término.
- titulo: ¿Es el grado relativo respecto a una letra la suma de todos sus exponentes
    en el polinomio?
  respuesta: 'No'
  solucion_pasos:
  - No, es el MAYOR exponente que alcanza esa letra en un solo término, no la suma
    de ellos.
errores_frecuentes:
- Sumar los exponentes de la variable en lugar de seleccionar el mayor de ellos.
- Sumar los exponentes de variables distintas al calcular el grado relativo de una
  sola letra.
- Declarar que el grado relativo de una variable ausente en un término es igual a
  1 en lugar de 0.
- Declarar que el grado relativo respecto a x y el grado absoluto de un polinomio
  son siempre iguales.
- Intercambiar el valor del coeficiente de la variable con su exponente al determinar
  el grado relativo.
afirmaciones_verdaderas:
- El grado relativo respecto a una variable x es el mayor exponente de x en el polinomio.
- La suma de los grados relativos de las variables es mayor o igual que el grado absoluto
  del polinomio.
al_terminar_debes_ponder: Al terminar serás capaz de calcular el grado relativo de
  un polinomio respecto a cualquiera de sus variables determinando su exponente máximo.
