semantic_id: MAT.ALG.POLINOMIOS.GRADO_RELATIVO_POLINOMIO
resumen_inicial: 'El cálculo del grado relativo de un polinomio respecto a una variable consiste en determinar el mayor exponente que posee dicha letra entre todos los términos del polinomio.'
explicacion_simple: |
  Mientras que en un monomio el grado relativo es el exponente de esa letra, en un **polinomio con varios términos**:
  - Buscas la letra de referencia en **todos los términos**.
  - Te fijas en los exponentes que tiene esa letra en cada término.
  - El **exponente más alto** es el grado relativo del polinomio respecto a esa letra.
  - Ejemplo: En $P(x,y) = 4x^3 y^8 - 9x^6 y^2 + 2x^5 y^4$:
    - Respecto a $x$: Los exponentes son $3, 6$ y $5 \implies$ Grado relativo a $x$ = **$6$**.
    - Respecto a $y$: Los exponentes son $8, 2$ y $4 \implies$ Grado relativo a $y$ = **$8$**.
explicacion_formal: |
  ### Definición formal
  Dado un polinomio no nulo $P(x_1, \dots, x_k) = \sum_{i=1}^n M_i \in \mathbb{R}[x_1, \dots, x_k]$, el **grado relativo del polinomio respecto a la variable $x_j$** (denotado $\operatorname{grrel}(P, x_j)$) es el máximo entre los exponentes de la variable $x_j$ en los términos no nulos del polinomio:

  $$\operatorname{grrel}(P, x_j) = \max_{i \in \{1, \dots, n\}} (\operatorname{grrel}(M_i, x_j))$$

  ### Propiedad del Grado de Ordenamiento
  El grado relativo respecto a la variable $x_j$ determina el exponente inicial del polinomio cuando se escribe ordenado en forma decreciente respecto a esa variable:

  $$P(x_j) = a_m x_j^m + a_{m-1} x_j^{m-1} + \dots + a_0 \quad \implies \quad m = \operatorname{grrel}(P, x_j)$$

  ### Síntesis didáctica
  El grado relativo analiza la potencia dominante de una sola letra en expresiones multivariables. Es indispensable para la división sintética y el ordenamiento de polinomios.
definiciones_clave: |
  - **Grado relativo de un polinomio**: Exponente más alto que presenta una variable específica en los términos de un polinomio.
  - **Variable de ordenamiento**: Letra seleccionada respecto a la cual se calcula el grado relativo y se ordena el polinomio.
  - **Grado relativo respecto a variable ausente**: Grado nulo ($0$) atribuido respecto a una letra que no figura en ningún término del polinomio.
propiedades_relaciones: |
  - **Desigualdad respecto al grado absoluto**: El grado relativo respecto a cualquier variable es siempre menor o igual al grado absoluto del polinomio ($\operatorname{grrel}(P, x_j) \le \operatorname{grabs}(P)$).
  - **Grado relativo en una sola variable**: En polinomios de una variable $P(x)$, el grado relativo respecto a $x$ es numéricamente idéntico al grado absoluto del polinomio.
ejemplo_guiado:
  enunciado: 'Dado el polinomio $P(a,b,c) = 7a^4 b^9 c - 3a^8 b^2 + 12a^2 b^5 c^4$, calcula el grado relativo del polinomio respecto a cada una de las variables $a$, $b$, $c$ y $d$.'
  pasos:
    - 'Paso 1: Buscamos la variable $a$: Sus exponentes son $4$ (término 1), $8$ (término 2) y $2$ (término 3). El mayor es $8 \implies \operatorname{grrel}(P, a) = \mathbf{8}$.'
    - 'Paso 2: Buscamos la variable $b$: Sus exponentes son $9$ (término 1), $2$ (término 2) y $5$ (término 3). El mayor es $9 \implies \operatorname{grrel}(P, b) = \mathbf{9}$.'
    - 'Paso 3: Buscamos la variable $c$: Sus exponentes son $1$ (término 1), $0$ (término 2) y $4$ (término 3). El mayor es $4 \implies \operatorname{grrel}(P, c) = \mathbf{4}$.'
    - 'Paso 4: Buscamos la variable $d$: La letra $d$ no aparece en ningún término $\implies \operatorname{grrel}(P, d) = \mathbf{0}$.'
    - 'Conclusión: Grados relativos: **$a \to 8, b \to 9, c \to 4, d \to 0$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se determina el grado relativo de un polinomio respecto a una variable específica?'
    choices:
      - {text: 'Buscando el mayor exponente que posee esa variable en cualquiera de los términos del polinomio', is_correct: true}
      - {text: 'Sumando los exponentes de esa variable en todos los términos', is_correct: false}
      - {text: 'Multiplicando el coeficiente del primer término por el grado absoluto', is_correct: false}
      - {text: 'Contando cuántos términos contienen esa letra', is_correct: false}
    explanation: 'La alternativa correcta es ''Buscando el mayor exponente que posee esa variable en cualquiera de los términos del polinomio''. Exponente máximo de la variable.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el polinomio $P(x,y) = 2x^5 y^3 - 9x^2 y^7 + 4x^8 y$, ¿cuál es el grado relativo respecto a $x$ y cuál respecto a $y$?'
    choices:
      - {text: 'Respecto a $x$ es $8$, y respecto a $y$ es $7$', is_correct: true}
      - {text: 'Respecto a $x$ es $5$, y respecto a $y$ es $3$', is_correct: false}
      - {text: 'Respecto a $x$ es $15$, y respecto a $y$ es $11$', is_correct: false}
      - {text: 'Ambos grados son iguales a $8$', is_correct: false}
    explanation: 'La alternativa correcta es ''Respecto a $x$ es $8$, y respecto a $y$ es $7$''. Mayor exponente de $x$ es 8 (en $4x^8 y$) y de $y$ es 7 (en $-9x^2 y^7$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable de referencia cuya potencia se desea medir.'
  - 'Paso 2: Inspeccionar término por término y extraer el exponente que lleva dicha variable en cada uno de ellos.'
  - 'Paso 3: Seleccionar el exponente numéricamente mayor de la lista.'
  - 'Paso 4: Declarar dicho exponente como el grado relativo del polinomio respecto a esa variable.'
errores_correccion: |
  - **Error 1:** Sumar los exponentes de la misma letra en distintos términos (ej: en $x^3 + x^5$ decir que el grado relativo a $x$ es $3+5=8$). **Cómo corregirlo:** El grado relativo **selecciona el MAYOR exponente**, jamás los suma.
  - **Error 2:** Calcular la suma de potencias de letras distintas en lugar de evaluar una sola variable de referencia. **Cómo corregirlo:** El grado relativo **mide una sola letra a la vez**.
ejemplos:
  - titulo: 'Grado relativo multivariable'
    enunciado: 'En el polinomio $5u^4 v^2 - 3u^2 v^9 + 8u^6 v^3$, ¿cuál es el grado relativo respecto a $v$?'
    alternativas:
      - '$9$'
      - '$6$'
      - '$14$'
    respuesta: '$9$'
    solucion_pasos:
      - '1. Exponentes de $v$: $2, 9, 3$.'
      - '2. El mayor exponente es $9$.'
  - titulo: 'Grado relativo respecto a letra ausente'
    enunciado: 'En el polinomio $3x^4 - 2x + 1$, ¿cuál es el grado relativo respecto a la letra $y$?'
    alternativas:
      - '$0$'
      - '$1$'
      - '$4$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. La letra $y$ no figura en el polinomio.'
      - '2. Su grado relativo es $0$.'
  - titulo: 'Grado relativo en una variable'
    enunciado: 'En un polinomio de una sola variable $P(x)$, ¿el grado relativo respecto a $x$ coincide con el grado absoluto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en una sola variable el grado absoluto y relativo coinciden.'
  - titulo: 'Grado relativo de trinomio'
    enunciado: 'En $a^3 b + a^2 b^4 - 5b^2$, ¿el grado relativo respecto a $b$ es igual a $4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el mayor exponente de $b$ es $4$ (en el término $a^2 b^4$).'
errores_frecuentes:
  - 'El grado relativo de un polinomio respecto a una letra se calcula sumando los exponentes de esa letra en todos los términos.'
  - 'El grado relativo respecto a una letra ausente en un polinomio es igual a uno.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El grado relativo respecto a una variable coincide siempre con el coeficiente del primer término.'
  - 'Cambiar el orden de los términos altera el grado relativo del polinomio.'
afirmaciones_verdaderas:
  - 'El grado relativo de un polinomio respecto a una variable es el mayor exponente que tiene esa letra entre todos los términos.'
  - 'Si una variable no aparece en ningún término del polinomio, su grado relativo respecto a esa letra es igual a cero.'
al_terminar_debes_poder: 'Calcular el grado relativo de un polinomio respecto a cualquier variable seleccionando su exponente máximo entre todos los términos.'
