semantic_id: MAT.NUM.SUCESIONES_BASE.CALCULO_TERMINOS_GENERAL
resumen_inicial: 'El cálculo de términos de una sucesión evalúa la regla explícita $a_n = f(n)$ para valores específicos del índice $n = 1, 2, 3, \dots$, aplicando la jerarquía de las operaciones aritméticas.'
explicacion_simple: |
  Calcular los términos de una sucesión es como usar una calculadora donde introduces la posición ($n$) y la fórmula te entrega el valor ($a_n$):
  - Si la regla es $a_n = \frac{2n - 1}{n + 1}$:
    - En $n = 1$: $a_1 = \frac{2(1) - 1}{1 + 1} = \frac{1}{2}$
    - En $n = 2$: $a_2 = \frac{2(2) - 1}{2 + 1} = \frac{3}{3} = 1$
    - En $n = 3$: $a_3 = \frac{2(3) - 1}{3 + 1} = \frac{5}{4}$
  - Solo debes sustituir la letra $n$ por el número de posición y resolver con cuidado las operaciones.

  ![Cálculo de términos a partir del término general](/static/img/nodos/calculo-de-terminos-de-una-sucesion-a-partir-del-termino-general-intro.svg)
explicacion_formal: |
  ### Definición formal
  El proceso de evaluación de una sucesión definida por su término general $a_n = f(n)$ consiste en la aplicación del operador de sustitución posicional para un conjunto finito de índices $I = \{k_1, k_2, \dots, k_m\} \subset \mathbb{N}$:
  $$k \longmapsto a_k = f(k) \quad (k \in \mathbb{N})$$

  ### Protocolo de Evaluación Algebraica
  1. **Sustitución con paréntesis**: Reemplazar cada aparición de la variable $n$ por el entero positivo $(k)$.
  2. **Jerarquía operacional**:
     - Evaluar potencias y raíces ($k^p, \sqrt{k}$).
     - Evaluar productos y cocientes ($c \cdot k, \frac{P(k)}{Q(k)}$).
     - Evaluar adiciones y sustracciones.
  3. **Manejo de signos alternantes**: Evaluar $(-1)^k$:
     $$(-1)^k = \begin{cases} -1 & \text{si } k \text{ es impar} \\ +1 & \text{si } k \text{ es par} \end{cases}$$

  ### Síntesis didáctica
  - Algoritmo: Reemplazar $n \to k$ y operar según jerarquía estricta.
  - Casos clave: Fracciones algebraicas y signos alternados.
definiciones_clave: |
  - **Evaluación de una sucesión**: Sustitución numérica de la variable independiente $n$ por un número natural específico.
  - **Términos iniciales**: Conjunto de los primeros valores $\{a_1, a_2, a_3, a_4\}$ generados por la fórmula.
  - **Factor alternante ($(-1)^n$)**: Factor que conmuta periódicamente el signo de los términos entre positivo y negativo.
propiedades_relaciones: |
  - **Determinismo estricto**: Para una fórmula $a_n$ dada, cada posición $n$ genera un valor único y reproducible.
  - **Simplificación de términos**: Las fracciones resultantes deben expresarse en su forma irreducible.
ejemplo_guiado:
  enunciado: 'Para la sucesión con término general $a_n = (-1)^n \cdot \frac{3n + 1}{2}$, calcula los tres primeros términos $a_1, a_2, a_3$.'
  imagen: '/static/img/nodos/calculo-de-terminos-de-una-sucesion-a-partir-del-termino-general-ejemplos.svg'
  pasos:
    - 'Paso 1: Evaluamos en $n=1$: $a_1 = (-1)^1 \cdot \frac{3(1) + 1}{2} = (-1) \cdot \frac{4}{2} = -1 \cdot 2 = -2$.'
    - 'Paso 2: Evaluamos en $n=2$: $a_2 = (-1)^2 \cdot \frac{3(2) + 1}{2} = (1) \cdot \frac{7}{2} = \frac{7}{2} = 3,5$.'
    - 'Paso 3: Evaluamos en $n=3$: $a_3 = (-1)^3 \cdot \frac{3(3) + 1}{2} = (-1) \cdot \frac{10}{2} = -1 \cdot 5 = -5$.'
    - 'Paso 4: Los tres primeros términos son **$-2, \frac{7}{2}, -5$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para la sucesión $a_n = 3n^2 - 5$, ¿cuál es el valor del segundo término $a_2$?'
    choices:
      - {text: '$7$, calculando $3(2^2) - 5 = 3(4) - 5 = 12 - 5 = 7$', is_correct: true}
      - {text: '$1$, restando $6 - 5$', is_correct: false}
      - {text: '$31$, elevando $(3 \cdot 2)^2 - 5$', is_correct: false}
      - {text: '$2$, igual a la posición', is_correct: false}
    explanation: 'La alternativa correcta es ''$7$, calculando $3(2^2) - 5 = 3(4) - 5 = 12 - 5 = 7$''. Primero se evalúa la potencia $2^2=4$, luego el producto $3 \cdot 4 = 12$ y finalmente la resta $12 - 5 = 7$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $a_n = \frac{n+2}{2n}$, ¿cuál es el valor de $a_4$ simplificado al máximo?'
    choices:
      - {text: '$\frac{3}{4}$, calculando $\frac{4+2}{2(4)} = \frac{6}{8} = \frac{3}{4}$', is_correct: true}
      - {text: '$\frac{6}{4}$', is_correct: false}
      - {text: '$1$', is_correct: false}
      - {text: '$\frac{1}{2}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{3}{4}$, calculando $\frac{4+2}{2(4)} = \frac{6}{8} = \frac{3}{4}$''. Sustituyendo $n=4$ se obtiene $\frac{6}{8}$, que al simplificar por 2 resulta $\frac{3}{4}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el número de posición $k$ que se desea evaluar.'
  - 'Paso 2: Sustituir cada variable $n$ de la fórmula por el valor $(k)$.'
  - 'Paso 3: Resolver primero las potencias y operaciones dentro de paréntesis.'
  - 'Paso 4: Efectuar multiplicaciones, divisiones y simplificar las fracciones resultantes.'
errores_correccion: |
  - **Error 1:** Errores en la regla de los signos con el factor alternante $(-1)^n$ (creer que $(-1)^2 = -1$). **Cómo corregirlo:** Recordar que **$(-1)^{\text{par}} = +1$** y **$(-1)^{\text{impar}} = -1$**.
  - **Error 2:** Multiplicar la base antes de elevar a la potencia en expresiones como $3n^2$. **Cómo corregirlo:** Por jerarquía de operaciones, **primero se calcula $n^2$ y luego se multiplica por 3**.
ejemplos:
  - titulo: 'Evaluación de término lineal'
    enunciado: 'Para $a_n = 7n - 4$, ¿cuál es el valor de $a_6$?'
    alternativas:
      - '$38$'
      - '$42$'
      - '$34$'
    respuesta: '$38$'
    solucion_pasos:
      - '1. $a_6 = 7(6) - 4 = 42 - 4 = 38$.'
  - titulo: 'Evaluación de término exponencial'
    enunciado: 'Para $a_n = 3 \cdot 2^n$, ¿cuál es el valor de $a_4$?'
    alternativas:
      - '$48$'
      - '$24$'
      - '$96$'
    respuesta: '$48$'
    solucion_pasos:
      - '1. $a_4 = 3 \cdot 2^4 = 3 \cdot 16 = 48$.'
  - titulo: 'Evaluación de signo alternado'
    enunciado: '¿Para $a_n = (-1)^n \cdot n$, el cuarto término $a_4$ es igual a $+4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_4 = (-1)^4 \cdot 4 = 1 \cdot 4 = +4$.'
  - titulo: 'Evaluación fraccionaria'
    enunciado: '¿Para $a_n = \frac{1}{n}$, los primeros tres términos son $1, \frac{1}{2}, \frac{1}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_1 = 1/1 = 1$, $a_2 = 1/2$, $a_3 = 1/3$.'
errores_frecuentes:
  - 'En expresiones de la forma $3n^2$, se multiplica primero tres por $n$ y luego se eleva al cuadrado el resultado.'
  - 'El factor alternante $(-1)^n$ produce un valor negativo cuando el exponente $n$ es un número par.'
  - 'La sustitución de la variable $n$ se efectúa sumando la posición al final de la fórmula sin reemplazar la letra.'
  - 'Las fracciones generadas por una fórmula de sucesión no requieren ser simplificadas.'
  - 'Evaluar una sucesión en la posición $n=1$ siempre produce como resultado el número uno.'
afirmaciones_verdaderas:
  - 'Para calcular un término $a_k$ se sustituye la variable $n$ por el valor $k$ en la expresión algebraica y se opera respetando la jerarquía.'
  - 'El factor alternante $(-1)^n$ asigna signo positivo a las posiciones pares y signo negativo a las posiciones impares.'
