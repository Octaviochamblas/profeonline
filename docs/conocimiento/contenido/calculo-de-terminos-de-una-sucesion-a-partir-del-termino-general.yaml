semantic_id: MAT.NUM.SUCESIONES_BASE.CALCULO_TERMINOS_GENERAL
resumen_inicial: 'El cálculo de términos a partir del término general evalúa la función de la sucesión $a_n = f(n)$ sustituyendo algebraicamente la variable $n$ por números enteros positivos específicos.'
explicacion_simple: |
  Para calcular cualquier término de una sucesión cuando te dan su fórmula general $a_n$:
  1. Identificas qué término te están pidiendo (por ejemplo, el **cuarto término**, lo que significa que $n = 4$).
  2. Remplazas la letra $n$ por el número $4$ en toda la fórmula.
  3. Resuelves las operaciones respetando la jerarquía (primero potencias, luego multiplicaciones y divisiones, y al final sumas y restas).
  Por ejemplo, si $a_n = 2n^2 + 3$, para $n=4$: $a_4 = 2(4^2) + 3 = 2(16) + 3 = 32 + 3 = 35$.
explicacion_formal: |
  ### Definición formal
  El **cálculo numérico de un término** $a_k$ es la evaluación de la función $f: \mathbb{N} \to \mathbb{R}$ en un punto singular del dominio $n = k \in \mathbb{N}$:
  $$a_k = f(k) = \left. f(n) \right|_{n=k}$$

  ### Algoritmo de Evaluación de Términos
  1. **Determinación del valor de entrada**: Fijar el número entero positivo $n = k \ge 1$.
  2. **Sustitución explícita**: Reemplazar cada ocurrencia de la variable $n$ por el valor $k$ utilizando paréntesis para evitar errores de signo o de jerarquía operacional.
  3. **Jerarquía operacional estricta**:
     - Evaluar paréntesis y potencias compuestas.
     - Efectuar productos y cocientes de izquierda a derecha.
     - Realizar adiciones y sustracciones finales.
  4. **Simplificación del resultado**: Reducir fracciones o expresiones radicales si es necesario.

  ### Síntesis didáctica
  - Entrada: Posición $n=k$.
  - Operación: $a_k = f(k)$.
  - Salida: Cifra real $a_k$.
definiciones_clave: |
  - **Sustitución numérica**: Reemplazo explícito de la variable simbólica $n$ por un número constante.
  - **Jerarquía de operaciones**: Orden prioritario obligatorio al resolver una expresión matemática (Paréntesis, Potencias, Multiplicación/División, Suma/Resta).
  - **Evaluación en el dominio**: Acto de asignar un valor entero positivo a la función generadora de la sucesión.
propiedades_relaciones: |
  - **Consistencia algebraica**: Evaluar $a_n$ para una secuencia de enteros consecutivos $n=1, 2, 3, 4$ genera la lista ordenada que caracteriza la sucesión.
  - **Invariancia funcional**: Independientemente de cómo se organice la fórmula algebraica, la sustitución directa de $n=k$ debe arrojar exactamente el mismo resultado único.
ejemplo_guiado:
  enunciado: 'Dada la sucesión con término general $a_n = \frac{n^2 - 1}{2n + 1}$, calcula el valor de los términos $a_1$, $a_3$ y $a_5$.'
  pasos:
    - 'Paso 1: Para $n=1$, sustituimos: $a_1 = \frac{1^2 - 1}{2(1) + 1} = \frac{1 - 1}{2 + 1} = \frac{0}{3} = 0$.'
    - 'Paso 2: Para $n=3$, sustituimos: $a_3 = \frac{3^2 - 1}{2(3) + 1} = \frac{9 - 1}{6 + 1} = \frac{8}{7}$.'
    - 'Paso 3: Para $n=5$, sustituimos: $a_5 = \frac{5^2 - 1}{2(5) + 1} = \frac{25 - 1}{10 + 1} = \frac{24}{11}$.'
    - 'Paso 4: Respuestas: **$a_1 = 0$**, **$a_3 = \frac{8}{7}$** y **$a_5 = \frac{24}{11}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el primer paso obligatorio para calcular el décimo término ($a_{10}$) de una sucesión a partir de su término general?'
    choices:
      - {text: 'Sustituir la variable $n$ por el número 10 en la fórmula del término general', is_correct: true}
      - {text: 'Multiplicar la fórmula del término general por 10', is_correct: false}
      - {text: 'Sumar 10 al resultado del primer término', is_correct: false}
      - {text: 'Igualar la fórmula del término general a 10 y despejar $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Sustituir la variable $n$ por el número 10 en la fórmula del término general''. Para hallar $a_{10}$ se sustituye $n=10$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $a_n = 3^n - 2$, ¿cuál es el valor del tercer término ($a_3$)?'
    choices:
      - {text: 'El número $25$, calculando $3^3 - 2 = 27 - 2 = 25$', is_correct: true}
      - {text: 'El número $7$, multiplicando $3 \cdot 3 - 2$', is_correct: false}
      - {text: 'El número $27$, omitiendo la resta', is_correct: false}
      - {text: 'El número $1$, calculando $3 - 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''El número $25$, calculando $3^3 - 2 = 27 - 2 = 25$''. $3^3 = 27 \implies 27 - 2 = 25$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el número entero de posición $n = k$ que se desea evaluar.'
  - 'Paso 2: Reemplazar todas las apariciones de $n$ por el número $k$ en la fórmula funcional de $a_n$.'
  - 'Paso 3: Resolver las potencias y paréntesis en primer lugar.'
  - 'Paso 4: Efectuar las multiplicaciones, divisiones, sumas y restas finales para obtener el valor simplificado.'
errores_correccion: |
  - **Error 1:** Multiplicar la base por la variable $n$ en lugar de elevar a la potencia (ej: evaluar $2^n$ para $n=3$ como $2 \cdot 3 = 6$ en vez de $2^3 = 8$). **Cómo corregirlo:** La variable $n$ figura como exponente; **debes elevar la base al exponente $n$**: $2^3 = 8$.
  - **Error 2:** Alterar el orden de operaciones al sustituir $n$ (ej: en $5n^2$ con $n=2$, calcular $(5 \cdot 2)^2 = 100$ en lugar de $5 \cdot 2^2 = 20$). **Cómo corregirlo:** Primero se resuelve la **potencia $n^2$** y al final se multiplica por el coeficiente.
ejemplos:
  - titulo: 'Cálculo de término en fórmula cuadrática'
    enunciado: 'Si $a_n = n^2 + 3n$, ¿el segundo término $a_2$ es $10$?'
    alternativas:
      - 'Sí, pues $2^2 + 3(2) = 4 + 6 = 10$'
      - 'No, es $8$'
      - 'No, es $14$'
    respuesta: 'Sí, pues $2^2 + 3(2) = 4 + 6 = 10$'
    solucion_pasos:
      - '1. Sustituimos $n=2$.'
      - '2. $a_2 = 2^2 + 3(2) = 4 + 6 = 10$.'
  - titulo: 'Cálculo de término en fórmula exponencial'
    enunciado: 'Si $a_n = 5 \cdot 2^n$, ¿el tercer término $a_3$ es $40$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_3 = 5 \cdot 2^3 = 5 \cdot 8 = 40$.'
  - titulo: 'Cálculo de los tres primeros términos'
    enunciado: 'Si $a_n = 4n - 1$, ¿los términos para $n=1, 2, 3$ son $3, 7, 11$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_1 = 3, a_2 = 7, a_3 = 11$.'
  - titulo: 'Término con numerador constante'
    enunciado: 'Si $a_n = \frac{12}{n+1}$, ¿el término $a_3$ es $3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_3 = 12 / (3+1) = 12 / 4 = 3$.'
errores_frecuentes:
  - 'Multiplicar los coeficientes por la variable de posición antes de efectuar las potencias indicadas.'
  - 'Reemplazar valores de posición negativos o fraccionarios en el dominio natural de la sucesión.'
  - 'La operación de multiplicación $c \cdot n$ es algebraicamente equivalente a la elevación a la potencia $c^n$.'
  - 'Las fracciones resultantes en la evaluación de términos racionales deben conservarse sin simplificar.'
  - 'Considerar que evaluar $a_n$ para $n=1$ siempre entrega la constante de la fórmula.'
afirmaciones_verdaderas:
  - 'Para calcular el término $a_k$ a partir del término general, se reemplaza la variable $n$ por el número $k$ en la fórmula.'
  - 'En la evaluación de $a_n$, se deben resolver primero las potencias de $n$ antes de realizar la multiplicación por el coeficiente.'
al_terminar_debes_poder: 'Calcular cualquier término de una sucesión $a_k$ mediante la sustitución ordenada de $n=k$ en su término general.'
