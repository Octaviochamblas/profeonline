procedimiento:
- 'Paso 1: Escribe la fórmula general.'
- 'Paso 2: Haz una lista con las posiciones ''n'' que te piden (ej. $n=1, n=2, n=3$).'
- 'Paso 3: Sustituye la ''n'' en la fórmula por cada número de la lista y resuelve
  paso a paso.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en cálculo de términos de una sucesión a partir del término general.
ejemplos:
- titulo: Alternancia de signos
  enunciado: Calcula el primer y el segundo término de la sucesión con fórmula $a_n
    = (-1)^n \cdot 5$.
  solucion_pasos:
  - 'Para n=1: $(-1)^1 \cdot 5 = (-1) \cdot 5 = -5$.'
  - 'Para n=2: $(-1)^2 \cdot 5 = (+1) \cdot 5 = 5$.'
  - 'La sucesión empieza alternando: -5, 5...'
errores_frecuentes:
- Olvidar que $3n$ significa '3 multiplicado por n' y no '3 sumado a n'.
- Cometer errores de signos al elevar a potencias, especialmente cuando $n$ acompaña
  a bases negativas (ej. $(-1)^n$).
afirmaciones_verdaderas:
- La formulación de cálculo de términos de una sucesión a partir del término general
  mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando cálculo de términos
