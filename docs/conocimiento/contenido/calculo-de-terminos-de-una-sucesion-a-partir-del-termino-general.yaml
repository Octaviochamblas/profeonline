procedimiento:
- 'Paso 1: Escribe la fórmula general.'
- 'Paso 2: Haz una lista con las posiciones ''n'' que te piden (ej. $n=1, n=2, n=3$).'
- 'Paso 3: Sustituye la ''n'' en la fórmula por cada número de la lista y resuelve paso a
  paso.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en cálculo de términos de una sucesión a partir del término general.
ejemplos:
- titulo: Alternancia de signos
  enunciado: Calcula el primer y el segundo término de la sucesión con fórmula $a_n = (-1)^n
    \cdot 5$.
  solucion_pasos:
  - 'Para n=1: $(-1)^1 \cdot 5 = (-1) \cdot 5 = -5$.'
  - 'Para n=2: $(-1)^2 \cdot 5 = (+1) \cdot 5 = 5$.'
  - 'La sucesión empieza alternando: -5, 5...'
- titulo: Ejemplo 1
  enunciado: Si a_n es igual a n al cuadrado más 1, ¿cuánto vale a_3?
  alternativas:
  - '10'
  - '7'
  - '9'
  respuesta: '10'
  solucion_pasos:
  - 3 al cuadrado es 9, y 9 más 1 es igual a 10.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el segundo término de la sucesión a_n igual a 5n menos 4?
  alternativas:
  - '6'
  - '1'
  - '10'
  respuesta: '6'
  solucion_pasos:
  - 5 por 2 es 10, y 10 menos 4 es igual a 6.
- titulo: ¿Para calcular a_4 en la fórmula a_n igual a n al cuadrado menos 2n, se reemplaza
    n por 4?
  respuesta: Sí
  solucion_pasos:
  - Se sustituye la letra n por el número de posición que se pide en cada lugar donde aparece.
- titulo: ¿El resultado de menos 2 elevado a 3 es positivo?
  respuesta: 'No'
  solucion_pasos:
  - Menos 2 elevado a 3 es igual a menos 8, un número negativo, porque el exponente es impar.
errores_frecuentes:
- Olvidar que $3n$ significa '3 multiplicado por n' y no '3 sumado a n'.
- Cometer errores de signos al elevar a potencias, especialmente cuando $n$ acompaña a bases
  negativas (ej. $(-1)^n$).
- Sumar o restar antes de elevar al cuadrado, alterando el resultado de la potencia.
- Olvidar aplicar la fórmula a cada valor de n por separado.
- Perder el signo negativo al reemplazar n en fórmulas con potencias impares o restas.
afirmaciones_verdaderas:
- La formulación de cálculo de términos de una sucesión a partir del término general mantiene
  la regularidad de la sucesión.
- Al calcular términos desde el término general se debe respetar la prioridad de las operaciones,
  resolviendo primero las potencias.
