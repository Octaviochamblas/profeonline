resumen_inicial: El cálculo de términos a partir del término general evalúa la función
  sustituyendo la variable $n$ por el entero deseado ($n = 1, 2, 3, \dots$).
explicacion_simple: Para encontrar los primeros números de una sucesión sabiendo su
  fórmula $a_n$, reemplazamos la $n$ primero por 1 para hallar $a_1$, luego por 2
  para hallar $a_2$, y así sucesivamente resolviendo la aritmética.
explicacion_formal: 'Dada la regla de término general $a_n = f(n)$, el **Algoritmo
  de Generación de Términos** efectúa las evaluaciones numéricas discretas:


  $$a_1 = f(1), \quad a_2 = f(2), \quad a_3 = f(3), \dots, a_k = f(k)$$


  **Dominio de sustitución:**

  - La variable $n$ toma únicamente valores enteros positivos mayores o iguales a
  1.'
definiciones_clave: '- **Cálculo por término general**: Sustitución directa $n \to
  k$ en la fórmula $a_n = f(n)$.'
propiedades_relaciones: '- **Generación discreta**: Produce la secuencia ordenada
  $(a_1, a_2, a_3, \dots)$.'
ejemplo_guiado:
  enunciado: Calcule los primeros $3$ términos de la sucesión dada por $a_n = \frac{n}{n+1}$.
  pasos:
  - 'Paso 1: Para $n=1 \implies a_1 = \frac{1}{1+1} = \frac{1}{2}$.'
  - 'Paso 2: Para $n=2 \implies a_2 = \frac{2}{2+1} = \frac{2}{3}$.'
  - 'Paso 3: Para $n=3 \implies a_3 = \frac{3}{3+1} = \frac{3}{4}$.'
  - 'Conclusión: Los tres primeros términos son $\frac{1}{2}, \frac{2}{3}, \frac{3}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calculan los términos numéricos de una sucesión a partir de su
    fórmula an = f(n)?
  choices:
  - text: Sustituyendo n por los enteros consecutivos 1, 2, 3, ... y resolviendo las
      operaciones
    is_correct: true
  - text: Multiplicando siempre por cero
    is_correct: false
  - text: Restando n a la fórmula completa
    is_correct: false
  - text: Dividiendo por cien todos los números
    is_correct: false
  explanation: La alternativa correcta es 'Sustituyendo n por los enteros consecutivos
    1, 2, 3, ... y resolviendo las operaciones'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para an = n / (n + 1), ¿cuál fue el segundo término
    a2 resultante?
  choices:
  - text: 2/3
    is_correct: true
  - text: 1/2
    is_correct: false
  - text: 3/4
    is_correct: false
  - text: 2/2
    is_correct: false
  explanation: La alternativa correcta es '2/3'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular los términos numéricos
  de una sucesión evaluando $n = 1, 2, 3, \dots$ en la fórmula del término general
  $a_n$.
semantic_id: MAT.NUM.SUCESIONES_BASE.CALCULO_TERMINOS_GENERAL
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.CALCULO_TERMINOS_GENERAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
