semantic_id: MAT.NUM.SUCESIONES_BASE.CALCULO_TERMINOS_GENERAL
resumen_inicial: 'Cálculo de términos de una sucesión a partir del término general:
  concepto y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: Ya conocemos la máquina que fabrica números. ¡Ahora aprendamos
  a usarla! Conecta los cables, engrasa las piezas, introduce el número de posición
  y veamos qué sale por el otro lado de la fórmula.
explicacion_formal: 'Construir una sucesión desde su fórmula general es un simple
  ejercicio de **evaluación algebraica**.


  Reglas importantes:

  1. Sustituye la letra $n$ por el número de la posición.

  2. Respeta el **PAPOMUDAS** (Paréntesis, Potencias, Multiplicación/División, Adición/Sustracción).

  3. Cuidado con los signos negativos y las fracciones.


  Ejemplo: Generar los 3 primeros términos de la sucesión $a_n = n^2 - 1$.

  - Para $n=1$: $\rightarrow (1)^2 - 1 \rightarrow 1 - 1 = 0$

  - Para $n=2$: $\rightarrow (2)^2 - 1 \rightarrow 4 - 1 = 3$

  - Para $n=3$: $\rightarrow (3)^2 - 1 \rightarrow 9 - 1 = 8$

  La sucesión comienza así: $0, 3, 8, \dots$'
definiciones_clave: '- **Cálculo de términos de una sucesión a partir del término
