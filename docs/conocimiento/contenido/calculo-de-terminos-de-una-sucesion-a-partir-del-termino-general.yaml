semantic_id: MAT.NUM.SUCESIONES_BASE.CALCULO_TERMINOS_GENERAL
resumen_inicial: 'Cálculo de términos de una sucesión a partir del término general: concepto
  y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: Ya conocemos la máquina que fabrica números. ¡Ahora aprendamos a usarla!
  Conecta los cables, engrasa las piezas, introduce el número de posición y veamos qué sale
  por el otro lado de la fórmula.
explicacion_formal: 'Construir una sucesión desde su fórmula general es un simple ejercicio
  de **evaluación algebraica**.


  Reglas importantes:

  1. Sustituye la letra $n$ por el número de la posición.

  2. Respeta el **PAPOMUDAS** (Paréntesis, Potencias, Multiplicación/División, Adición/Sustracción).

  3. Cuidado con los signos negativos y las fracciones.


  Ejemplo: Generar los 3 primeros términos de la sucesión $a_n = n^2 - 1$.

  - Para $n=1$: $\rightarrow (1)^2 - 1 \rightarrow 1 - 1 = 0$

  - Para $n=2$: $\rightarrow (2)^2 - 1 \rightarrow 4 - 1 = 3$

  - Para $n=3$: $\rightarrow (3)^2 - 1 \rightarrow 9 - 1 = 8$

  La sucesión comienza así: $0, 3, 8, \dots$'
definiciones_clave: '- **Cálculo de términos de una sucesión a partir del término general**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Cálculo de términos de una sucesión a partir del
  término general**: Relaciones de cambio y fórmulas estructurales de conceptos fundamentales
  de sucesiones.'
ejemplo_guiado:
  enunciado: Genera los primeros cuatro términos de la sucesión con término general a_n igual
    a 2n al cuadrado menos 3.
  pasos:
  - 'Para n igual a 1: 2 por 1 al cuadrado menos 3 es igual a 2 menos 3, o sea menos 1.'
  - 'Para n igual a 2: 2 por 4 menos 3 es igual a 5. Para n igual a 3: 2 por 9 menos 3 es
    igual a 15. Para n igual a 4: 2 por 16 menos 3 es igual a 29.'
  - 'La sucesión comienza así: menos 1, 5, 15, 29.'
