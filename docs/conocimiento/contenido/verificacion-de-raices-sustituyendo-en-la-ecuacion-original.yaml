    en verificación de raíces sustituyendo en la ecuación original?
  choices:
  - text: Identificar correctamente los coeficientes a, b, c con sus respectivos signos
      en resolución por factorización
    is_correct: true
  - text: Igualar el coeficiente a a cero
    is_correct: false
  - text: Sumar los coeficientes a y b eliminando la variable x
    is_correct: false
  - text: Multiplicar la ecuación por x^2
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar correctamente los coeficientes
    a, b, c con sus respectivos signos en resolución por factorización. Permite una
    sustitución precisa en verificación de raíces sustituyendo en la ecuación original.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determina el número de soluciones reales al trabajar con verificación
    de raíces sustituyendo en la ecuación original?
  choices:
  - text: Analizar el signo del discriminante b^2 - 4ac para determinar la cantidad
      de soluciones reales
    is_correct: true
  - text: Sumando las constantes b y c
    is_correct: false
  - text: Dividiendo c entre a directamente
    is_correct: false
  - text: Ignorando el término independiente c
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar el signo del discriminante b^2
    - 4ac para determinar la cantidad de soluciones reales. El discriminante indica
    si hay 2, 1 o 0 soluciones reales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Toma la ecuación original antes de resolverla.'
- 'Paso 2: Sustituye el valor de la solución encontrada en cada aparición de la incógnita.'
- 'Paso 3: Calcula el resultado y verifica que sea igual a cero (o al valor correspondiente
  del otro lado de la igualdad).'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en verificación de raíces sustituyendo en la ecuación original.
ejemplos:
- titulo: Verificación de una solución correcta
  enunciado: Verifica que $x=-2$ es solución de $x^2+5x+6=0$.
  solucion_pasos:
  - 'Sustituyendo: $(-2)^2+5(-2)+6=4-10+6=0$.'
  - Se cumple la igualdad, por lo que $x=-2$ es solución.
- titulo: Verificación que revela un error
  enunciado: Verifica si $x=1$ es solución de $x^2-3x+2=0$.
  solucion_pasos:
  - 'Sustituyendo: $1^2-3(1)+2=1-3+2=0$.'
  - Se cumple la igualdad, por lo que $x=1$ sí es solución.
- titulo: ¿Verificar una solución sustituyéndola es siempre posible, sin importar
    el método usado para resolverla?
  enunciado: ¿Verificar una solución sustituyéndola es siempre posible, sin importar
    el método usado para resolverla?
  respuesta: Sí
  solucion_pasos:
  - La verificación por sustitución es independiente del método usado (fórmula general,
    factorización, completar el cuadrado).
- titulo: ¿Si la sustitución no da cero, significa necesariamente que la ecuación
    original estaba mal planteada?
  enunciado: ¿Si la sustitución no da cero, significa necesariamente que la ecuación
    original estaba mal planteada?
  respuesta: 'No'
  solucion_pasos:
  - Generalmente indica un error en el proceso de resolución (cálculo o factorización),
    no en el planteamiento original de la ecuación.
errores_frecuentes:
- Sustituir la solución en una versión ya simplificada de la ecuación, en vez de en
  la ecuación original.
- Cometer errores de signo al sustituir un valor negativo en la expresión.
- Omitir el paso de verificación, dejando pasar errores de cálculo sin detectar.
- Verificar solo una de las dos soluciones, dejando la otra sin comprobar.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando verificación
  de raíces sustituyendo en la ecuación original.
