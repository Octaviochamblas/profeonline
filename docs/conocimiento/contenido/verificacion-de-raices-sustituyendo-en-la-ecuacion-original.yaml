semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.VERIFICACION_RAICES
resumen_inicial: 'Verificación de raíces sustituyendo en la ecuación original: concepto,
  discriminante, soluciones y modelamiento en Resolución por factorización.'
explicacion_simple: Después de resolver una ecuación cuadrática, siempre es posible
  (y recomendable) comprobar que cada solución realmente funciona, sustituyéndola
  de vuelta en la ecuación de partida.
explicacion_formal: '### Definición formal


  Una solución $x=r$ de la ecuación $ax^2+bx+c=0$ es válida si y solo si $ar^2+br+c=0$.
  La verificación consiste en sustituir $r$ en la expresión original y comprobar que
  el resultado sea efectivamente cero.


  ### Desarrollo didáctico


  Este paso final permite detectar errores de cálculo cometidos durante la resolución
  (de signo, de factorización, o de simplificación) antes de dar la respuesta por
  definitiva.


  Para verificar que $x=3$ es solución de $x^2-x-6=0$: se sustituye, $3^2-3-6=9-3-6=0$.
  Se cumple la igualdad, por lo que $x=3$ es efectivamente una solución.'
definiciones_clave: '- **Verificación de raíces sustituyendo en la ecuación original**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en verificación
  de raíces sustituyendo en la ecuación original.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando verificación de raíces
    sustituyendo en la ecuación original.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a verificación de raíces
    sustituyendo en la ecuación original.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
checkpoints:
