semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.VERIFICACION_RAICES
resumen_inicial: Verificar una raíz consiste en reemplazar el valor obtenido en la
  incógnita $x$ de la ecuación original y comprobar que satisfaga la igualdad $0 =
  0$.
explicacion_simple: 'Para comprobar de forma 100% segura si un número $x_0$ es realmente
  una solución válida de una ecuación cuadrática:

  1. Tomas el número $x_0$ y lo sustituyes en cada lugar donde aparezca la letra $x$.

  2. Calculas las potencias, multiplicaciones y sumas respetando la jerarquía de operaciones.

  3. Si el resultado final simplificado es **$0 = 0$ (o miembro izquierdo = miembro
  derecho)**, la raíz es CORRECTA.

  4. Si el resultado da un disparate (ej: $14 = 0$), el número NO es raíz o cometiste
  un error algebraico previo.'
explicacion_formal: 'Sea la ecuación $P(x) = 0$. Un número $r \in \mathbb{C}$ es **raíz
  o solución de la ecuación** si y solo si la evaluación funcional satisface la identidad
  escalar:


  $$P(r) = 0$$


  **Desglose de la fórmula:**

  - Prueba de pertenencia al conjunto solución mediante sustitución directa en el
  polinomio $a(r)^2 + b(r) + c = 0$.'
definiciones_clave: '- **Verificación de raíces**: Procedimiento aritmético de comprobación
  por sustitución directa de un valor candidato en la igualdad original.'
propiedades_relaciones: '- **Detección de raíces extrañas**: Muy útil al resolver
  ecuaciones cuadráticas con fracciones o radicales para descartar valores no permitidos.'
ejemplo_guiado:
  enunciado: Verifica si el valor $x = 3$ es una raíz correcta de la ecuación cuadrática
    $2x^2 - 5x - 3 = 0$.
  pasos:
  - 'Paso 1: Reemplazar $x = 3$ en el miembro izquierdo: $2(3)^2 - 5(3) - 3$.Paso
    2: Resolver la potencia primero: $2(9) - 5(3) - 3 = 18 - 15 - 3$.Paso 3: Realizar
    las restas: $18 - 15 = 3 \implies 3 - 3 = 0$.Paso 4: Comprobar la igualdad: $0
    = 0$ (CUMPLE).Paso 5: Concluir que $x = 3$ es efectivamente una raíz de la ecuación
    dada.'
checkpoints:
- placement: after_explicacion_formal
  question: Al sustituir $x = 3$ en la expresión $2x^2 - 5x - 3$, ¿cuál es la comprobación
    aritmética resultante?
  choices:
  - text: $2(9) - 15 - 3 = 18 - 18 = 0$, demostrando que $x = 3$ es raíz.
    is_correct: true
  - text: $2(6) - 15 - 3 = -6 \neq 0$, demostrando que no es raíz.
    is_correct: false
  - text: $18 + 15 - 3 = 30 \neq 0$
    is_correct: false
  - text: La sustitución no se puede realizar.
    is_correct: false
  explanation: La alternativa correcta es '$2(9) - 15 - 3 = 18 - 18 = 0$, demostrando
    que $x = 3$ es raíz.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué indica obtener la expresión final $14 = 0$ al sustituir un número
    $x = k$ en una ecuación?
  choices:
  - text: Que el número $k$ NO es una solución válida de la ecuación dada.
    is_correct: true
  - text: Que la ecuación es una identidad universal.
    is_correct: false
  - text: Que $x = 14$ es la verdadera solución.
    is_correct: false
  - text: Que la ecuación tiene soluciones infinitas.
    is_correct: false
  explanation: La alternativa correcta es 'Que el número $k$ NO es una solución válida
    de la ecuación dada.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la ecuación en su forma original.'
- 'Paso 2: Reemplazar la incógnita $x$ por el valor de la raíz a comprobar utilizando
  paréntesis.'
- 'Paso 3: Calcular potencias, multiplicaciones y sumas aritméticas.'
- 'Paso 4: Si el resultado es $0 = 0$, validar la solución.'
errores_correccion: '- **Error común:** Elevar al cuadrado multiplicando el coeficiente
  primero (en $2(3)^2$, hacer $(2 \cdot 3)^2 = 6^2 = 36$).

  - **Cómo corregirlo:** La jerarquía de operaciones exige resolver PRIMERO la potencia
  $3^2 = 9$ y LUEGO multiplicar por $2$: $2 \cdot 9 = 18$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución por factorización.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La propiedad del producto nulo exige que A * B = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, exige que el miembro derecho sea exactamente cero.
- titulo: ¿Toda ecuación incompleta ax^2 + bx = 0 admite la solución x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, al factorizar x(ax + b) = 0 se obtiene siempre x_1 = 0.
errores_frecuentes:
- Intentar aplicar la propiedad del producto nulo a una ecuación igualada a un número
  distinto de cero.
- Dividir una ecuación cuadrática entre la incógnita $x$ perdiendo la solución fundamental
  $x = 0$.
- Olvidar anteponer el doble signo $\pm$ al extraer raíz cuadrada en la resolución
  de $x^2 = k$.
- Confundir los números de los factores $(x+m)(x+n)$ con las soluciones reales de
  la ecuación (que tienen signos invertidos).
- Violar la jerarquía de operaciones al verificar raíces calculando multiplicaciones
  antes que potencias.
afirmaciones_verdaderas:
- La propiedad del producto nulo establece que $A \cdot B = 0 \iff A = 0 \lor B =
  0$.
- Toda ecuación incompleta binomia $a x^2 + b x = 0$ se resuelve por factor común
  $x(a x + b) = 0$ produciendo siempre la raíz $x = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones cuadráticas
  completas e incompletas mediante factorización de monomio común, trinomios simples,
  trinomios generales y verificación de raíces.
