semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.VERIFICACION_RAICES
resumen_inicial: La verificación de raíces consiste en sustituir los valores numéricos obtenidos en la ecuación original y evaluar aritméticamente para comprobar que se satisface la identidad numérica $0 = 0$.
explicacion_simple: '![La verificación de raíces consiste en sustituir los valores numéricos obtenidos en la ecuación original y evaluar aritméticamente para comprobar que se satisface la identidad numérica $0 = 0$](/static/img/nodos/verificacion-de-raices-sustituyendo-en-la-ecuacion-original-intro.svg)



  Una vez que encuentras las soluciones de una ecuación cuadrática, **¿cómo puedes estar 100% seguro de que están correctas?**


  **El método de comprobación:**

  1. Tomas el número que encontraste (por ejemplo, $x = 3$).

  2. Vas a la ecuación original y cambias cada $x$ por un paréntesis con ese número: $(3)$.

  3. Haces las cuentas numéricas con cuidado (primero la potencia al cuadrado, luego multiplicaciones y sumas).

  4. **Criterio de éxito:** Si el resultado final da exactamente **$0 = 0$**, ¡la solución está demostrada y correcta!

  5. Si da un número distinto de cero (ej: $4 = 0$), significa que hubo un error de cálculo y debes revisar.'
explicacion_formal: 'Sea $P(x) = ax^2 + bx + c = 0$ una ecuación cuadrática en $\mathbb{R}$ y sea $x_0 \in \mathbb{R}$ un valor candidato a solución. El **procedimiento formal de comprobación** evalúa el valor numérico del polinomio en dicho punto:

  $$P(x_0) = a(x_0)^2 + b(x_0) + c$$


  **Condición necesaria y suficiente de pertenencia**:

  $$x_0 \in \mathcal{S} \Longleftrightarrow P(x_0) = 0$$


  **Jerarquía obligatoria de operaciones en la verificación**:

  1. **Evaluación de potencia**: Calcular $(x_0)^2$ (atención con los signos: $(-k)^2 = +k^2$).

  2. **Evaluación de productos**: Multiplicar $a \cdot (x_0)^2$ y $b \cdot (x_0)$.

  3. **Reducción aditiva**: Sumar algebraicamente todos los términos escalares y constatar la nulidad idéntica.'
definiciones_clave: '- **Verificación de solución**: Comprobación aritmética directa que valida la pertenencia de un valor al conjunto solución.

  - **Identidad numérica**: Igualdad verdadera sin incógnitas de la forma $0 = 0$ o $k = k$.'
propiedades_relaciones: '- **Detección de raíces extrañas**: En ecuaciones que provienen de simplificación de fracciones o radicales, la verificación descarta soluciones que anulan denominadores.

  - **Prueba de autosuficiencia**: Permite al estudiante validar autónomamente sus resultados en evaluaciones formales.'
ejemplo_guiado:
  enunciado: '![Ejemplo La verificación de raíces consiste en sustituir los valores numéricos obtenidos en la ecuación original y evaluar aritméticamente para comprobar que se satisface la identidad numérica $0 = 0$](/static/img/nodos/verificacion-de-raices-sustituyendo-en-la-ecuacion-original-ejemplos.svg)



    Verifica si los valores $x = 2$ y $x = -5$ son soluciones de la ecuación cuadrática $2x^2 + 6x - 20 = 0$.'
  pasos:
  - 'Paso 1: Probar para $x = 2$ sustituyendo con paréntesis:

    $2(2)^2 + 6(2) - 20 = 2(4) + 12 - 20 = 8 + 12 - 20 = 20 - 20 = 0$.

    - Como $0 = 0$, **$x = 2$ es una raíz válida**.'
  - 'Paso 2: Probar para $x = -5$ sustituyendo con paréntesis:

    $2(-5)^2 + 6(-5) - 20 = 2(25) - 30 - 20 = 50 - 30 - 20 = 50 - 50 = 0$.

    - Como $0 = 0$, **$x = -5$ es una raíz válida**.'
  - 'Paso 3: Concluir formalmente que ambos valores forman el conjunto solución de la ecuación.'
checkpoints:
- placement: after_explicacion_formal
  question: Al verificar si $x = -3$ es solución de $x^2 + 5x + 6 = 0$, ¿cuál es el cálculo correcto?
  choices:
  - text: (-3)^2 + 5(-3) + 6 = 9 - 15 + 6 = 0 (valida)
    is_correct: true
  - text: -3^2 + 5(-3) + 6 = -9 - 15 + 6 = -18 (no valida)
    is_correct: false
  - text: 3^2 + 5(3) + 6 = 30
    is_correct: false
  - text: (-3)^2 - 5(-3) + 6 = 30
    is_correct: false
  explanation: La alternativa correcta es '(-3)^2 + 5(-3) + 6 = 9 - 15 + 6 = 0 (valida)'. El cuadrado de $-3$ es $+9$, produciendo la identidad $0 = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si al sustituir un valor $x = k$ en la ecuación original se obtiene $7 = 0$, ¿qué conclusión se deduce?
  choices:
  - text: Que x = k NO es solucion de la ecuacion.
    is_correct: true
  - text: Que la ecuacion tiene 7 soluciones.
    is_correct: false
  - text: Que x = k es una solucion aproximada.
    is_correct: false
  - text: Que el termino independiente es 7.
    is_correct: false
  explanation: La alternativa correcta es 'Que x = k NO es solucion de la ecuacion.'. Al no cumplirse la igualdad $0 = 0$, el valor no satisface la ecuación.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación en su expresión original de partida.'
- 'Paso 2: Reemplazar cada aparición de la variable $x$ por el valor numérico candidato encerrado entre paréntesis.'
- 'Paso 3: Calcular las potencias al cuadrado respetando la regla de signos de números negativos.'
- 'Paso 4: Realizar los productos y multiplicaciones escalares.'
- 'Paso 5: Sumar y restar los términos numéricos para verificar si el resultado final es $0 = 0$.'
errores_correccion: '- **Error común:** Calcular $(-4)^2$ como $-16$ al no colocar paréntesis en la calculadora o en el papel.

  - **Cómo corregirlo:** El cuadrado de cualquier número real negativo es **siempre positivo**: $(-4)^2 = (-4) \times (-4) = +16$.'
ejemplos:
- titulo: 'Ejemplo 1: Verificación de raíz positiva'
  enunciado: ¿Es $x = 4$ solución de $x^2 - 3x - 4 = 0$?
  alternativas:
  - Sí, porque (4)^2 - 3(4) - 4 = 16 - 12 - 4 = 0
  - No, da 8 = 0
  - Solo si x = -4
  - Es una solución incompleta
  respuesta: Sí, porque (4)^2 - 3(4) - 4 = 16 - 12 - 4 = 0
  solucion_pasos:
  - 'Paso 1: $16 - 12 - 4 = 0 \implies 0 = 0$ (es solución válida).'
- titulo: 'Ejemplo 2: Verificación de raíz negativa'
  enunciado: ¿Es $x = -1$ solución de $3x^2 + 5x + 2 = 0$?
  alternativas:
  - Sí, porque 3(-1)^2 + 5(-1) + 2 = 3 - 5 + 2 = 0
  - No, da -4 = 0
  - No, porque es negativa
  - Solo si x = 1
  respuesta: Sí, porque 3(-1)^2 + 5(-1) + 2 = 3 - 5 + 2 = 0
  solucion_pasos:
  - 'Paso 1: $3(1) - 5 + 2 = 0 \implies 0 = 0$ (es válida).'
- titulo: 'Ejemplo 3: Detección de valor incorrecto'
  enunciado: ¿Es $x = 3$ solución de $x^2 - 5x + 8 = 0$?
  alternativas:
  - No, porque (3)^2 - 5(3) + 8 = 9 - 15 + 8 = 2 != 0
  - Sí, es solución exacta
  - Sí, con residuo 2
  - Solo en los complejos
  respuesta: No, porque (3)^2 - 5(3) + 8 = 9 - 15 + 8 = 2 != 0
  solucion_pasos:
  - 'Paso 1: $2 \neq 0$, luego $x = 3$ no es raíz de la ecuación.'
- titulo: 'Ejemplo 4: Verificación de raíz nula'
  enunciado: ¿Es $x = 0$ solución de $7x^2 - 14x = 0$?
  alternativas:
  - Sí, porque 7(0)^2 - 14(0) = 0 - 0 = 0
  - No, porque no se puede evaluar en cero
  - Solo si x = 2
  - No tiene solución
  respuesta: Sí, porque 7(0)^2 - 14(0) = 0 - 0 = 0
  solucion_pasos:
  - 'Paso 1: $0 - 0 = 0 \implies 0 = 0$ (es válida).'
errores_frecuentes:
- Elevar al cuadrado números negativos sin considerar el signo positivo resultante.
- Comprobar en una ecuación simplificada intermedia que ya arrastraba un error.
- Dar por buena una solución sin hacer el cómputo aritmético final.
afirmaciones_verdaderas:
- Un valor es solución de una ecuación si y solo si al sustituirlo produce la identidad 0 = 0.
- La verificación permite descartar soluciones espurias y validar la exactitud del cálculo algebraico.
al_terminar_debes_poder: '**QUÉ:** Verificar y validar soluciones de ecuaciones cuadráticas mediante sustitución directa en la ecuación original.


  **CÓMO:** Evaluando aritméticamente a(x0)² + b(x0) + c y constatando la identidad verdadera 0 = 0.


