semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.REFLEXION_EJE_X
resumen_inicial: El análisis de la reflexión respecto al eje $X$ por cambio de signo de $a$ en $g(x) = -f(x) = -ax^n$ describe una transformación isométrica especular $(x, y) \mapsto (x, -y)$, invirtiendo la concavidad en exponentes pares y el sentido de la monotonía en exponentes impares.
explicacion_simple: "![El análisis de la reflexión respecto al eje $X$ por cambio de signo de $a$ en $g(x) = -f(x) = -ax^n$ describe una transformación isométrica especular $(x, y) \\mapsto (x, -y)$, invirtiendo la concavidad en exponentes pares y el sentido de la monotonía en exponentes impares](/static/img/nodos/analisis-de-la-reflexion-respecto-del-eje-x-por-cambio-de-signo-de-a-intro.svg)\n\n\nCambiar el signo de $a$ de positivo a negativo (multiplicar la función por $-1$) produce un **efecto espejo vertical respecto al eje $X$**:\n\n- **En funciones pares ($x^4 \\to -x^4$):**\n  - Las ramas que apuntaban hacia arriba $(\\cup)$ ahora **apuntan hacia abajo $(\\cap)$**.\n  - El recorrido cambia de $[0, +\\infty[$ a **$]-\\infty, 0]$**.\n- **En funciones impares ($x^3 \\to -x^3$):**\n  - La curva que venía subiendo de abajo a la izquierda hacia arriba a la derecha (estrictamente creciente) ahora **baja de arriba a la izquierda hacia abajo a la derecha (estrictamente decreciente)**.\n- **El\
  \ origen $(0, 0)$:** Como $-0 = 0$, el origen permanece como **punto fijo invariante**."
explicacion_formal: 'Sea $f(x) = ax^n$. La reflexión axial respecto al eje de abscisas se define como la isometría:

  $$\mathcal{R}_{\text{Eje } X}: \mathbb{R}^2 \to \mathbb{R}^2, \quad (x, y) \mapsto (x, -y)$$

  Aplicada a la gráfica de $f$, genera la función $g(x) = -f(x) = -ax^n$.


  **Impacto en derivadas y monotonía**:

  1. **Monotonía**: $g''(x) = -f''(x)$. Si $f$ es estrictamente creciente ($f'' > 0$), $g$ es estrictamente decreciente ($g'' < 0$).

  2. **Concavidad**: $g''''(x) = -f''''(x)$. Si $f$ es cóncava hacia arriba ($f'''' > 0$), $g$ es cóncava hacia abajo ($g'''' < 0$).

  3. **Inversión de extremos**: Un mínimo global en $y = 0$ se transforma en un máximo global en $y = 0$.'
definiciones_clave: '- **Reflexión axial respecto al eje $X$**: Transformación especular vertical donde cada ordenada $y$ pasa a ser $-y$.

  - **Punto fijo invariante**: Puntos donde $y = 0$ (como el origen $(0, 0)$) que no cambian de posición bajo la reflexión.'
propiedades_relaciones: '- **Involución**: Reflejar dos veces consecutivas recupera la función original: $-(-f(x)) = f(x)$.

  - **Diferencia con reflexión en eje $Y$**: La reflexión en $X$ es $-f(x)$; la reflexión en $Y$ es $f(-x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la reflexión respecto al eje $X$ por cambio de signo de $a$ en $g(x) = -f(x) = -ax^n$ describe una transformación isométrica especular $(x, y) \mapsto (x, -y)$, invirtiendo la concavidad en exponentes pares y el sentido de la monotonía en exponentes impares](/static/img/nodos/analisis-de-la-reflexion-respecto-del-eje-x-por-cambio-de-signo-de-a-ejemplos.svg)



    Describe el efecto de la reflexión en el eje $X$ y compara con la función base para:

    1) $f(x) = -4x^6$ respecto a $y = 4x^6$

    2) $g(x) = -x^5$ respecto a $y = x^5$'
  pasos:
  - 'Paso 1: Para $f(x) = -4x^6$:

    - Concavidad: Pasa de convexa (arriba) a cóncava (abajo).

    - Recorrido: Pasa de $[0, +\infty[$ a **$]-\infty, 0]$**.

    - Vértice: Se mantiene en **$(0, 0)$**, pasando de ser un mínimo a ser un **máximo absoluto**.'
  - 'Paso 2: Para $g(x) = -x^5$:

    - Monotonía: Pasa de estrictamente creciente a **estrictamente decreciente** en todo $\mathbb{R}$.

    - Cuadrantes: Las ramas se invierten de cuadrantes I y III a **cuadrantes II y IV**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué le ocurre al recorrido de la función $f(x) = x^4$ cuando se le aplica una reflexión respecto al eje X generando $g(x) = -x^4$?
  choices:
  - text: Cambia de [0, +∞[ a ]-∞, 0]
    is_correct: true
  - text: Se mantiene como [0, +∞[
    is_correct: false
  - text: Pasa a ser todo ℝ
    is_correct: false
  - text: Pasa a ser ℝ \ {0}
    is_correct: false
  explanation: La alternativa correcta es 'Cambia de [0, +∞[ a ]-∞, 0]'. Al multiplicar por $-1$, todas las imágenes positivas se transforman en valores menores o iguales a cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la monotonía de la función reflejada $f(x) = -2x^3$ en el intervalo ]-∞, +∞[?
  choices:
  - text: Estrictamente decreciente
    is_correct: true
  - text: Estrictamente creciente
    is_correct: false
  - text: Creciente y luego decreciente
    is_correct: false
  - text: Constante
    is_correct: false
  explanation: La alternativa correcta es 'Estrictamente decreciente'. Al multiplicar la función cúbica creciente por $-2 < 0$, su monotonía se invierte por completo.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el cambio de signo en el coeficiente principal $a \mapsto -a$.'
- 'Paso 2: Aplicar la transformación de ordenadas $(x, y) \mapsto (x, -y)$.'
- 'Paso 3: En exponentes pares, invertir la concavidad (hacia abajo) y el recorrido a $]-\infty, 0]$.'
- 'Paso 4: En exponentes impares, cambiar la monotonía de creciente a decreciente trasladando las ramas a los cuadrantes II y IV.'
errores_correccion: '- **Error común:** Confundir la reflexión respecto al eje $X$ ($-f(x)$) con la reflexión respecto al eje $Y$ ($f(-x)$).

  - **Cómo corregirlo:** El signo menos **POR FUERA** afecta a la $y$ e invierte verticalmente respecto al **EJE X**.'
ejemplos:
- titulo: 'Ejemplo 1: Concavidad invertida'
  enunciado: 'La gráfica de $y = -7x^4$ es:'
  alternativas:
  - Cóncava hacia abajo con ramas en cuadrantes III y IV
  - Cóncava hacia arriba con ramas en cuadrantes I y II
  - Estrictamente creciente
  - Una hipérbola
  respuesta: Cóncava hacia abajo con ramas en cuadrantes III y IV
  solucion_pasos:
  - 'Paso 1: Par con $a = -7 < 0 \implies$ ramas hacia abajo en C III y C IV.'
- titulo: 'Ejemplo 2: Monotonía invertida'
  enunciado: 'La función $f(x) = -x^7$ es:'
  alternativas:
  - Estrictamente decreciente en todo R
  - Estrictamente creciente en todo R
  - Par
  - No definida en negativos
  respuesta: Estrictamente decreciente en todo R
  solucion_pasos:
  - 'Paso 1: Impar con coeficiente negativo $\implies$ estrictamente decreciente.'
- titulo: 'Ejemplo 3: Punto invariante'
  enunciado: ¿Qué punto no se mueve al reflejar $y = x^n$ respecto al eje X?
  alternativas:
  - (0, 0)
  - (1, 1)
  - (-1, -1)
  - (1, -1)
  respuesta: (0, 0)
  solucion_pasos:
  - 'Paso 1: $(0, -0) = (0, 0)$ es el único punto invariante.'
- titulo: 'Ejemplo 4: Recorrido tras reflexión'
  enunciado: 'El recorrido de $f(x) = -3x^2$ es:'
  alternativas:
  - ']-inf, 0]'
  - '[0, +inf['
  - R
  - ']-inf, -3]'
  respuesta: ']-inf, 0]'
  solucion_pasos:
  - 'Paso 1: $\operatorname{Rec} = ]-\infty, 0]$.'
errores_frecuentes:
- Pensar que la reflexión en X cambia los signos de las x en lugar de las y.
- Olvidar que el vértice (0, 0) sigue siendo (0, 0).
- Creer que la función impar reflejada deja de ser impar.
afirmaciones_verdaderas:
- 'La reflexión respecto al eje X multiplica todas las ordenadas por -1: (x, y) ↦ (x, -y).'
- Invierte la concavidad en potencias pares y la monotonía en potencias impares.
al_terminar_debes_poder: '**QUÉ:** Analizar y aplicar la reflexión respecto al eje X por cambio de signo de a.


  **CÓMO:** Mapeando (x, y) ↦ (x, -y) para deducir la nueva concavidad, recorrido y sentido de monotonía.


