semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_RECTANGULO
resumen_inicial: El trapecio rectángulo es aquel que tiene un lado lateral perpendicular a las bases, formando dos ángulos rectos y coincidiendo con su altura.
explicacion_simple: 'Un **trapecio rectángulo** tiene una pared totalmente vertical y recta: uno de sus lados laterales corta a ambas bases en un ángulo recto perfecto de **$90^\circ$**.


  Gracias a esto, tiene dos ventajas increíbles que facilitan cualquier cálculo: 1) **El lado vertical es exactamente la altura del trapecio** ($h = c_\perp$), ¡no tienes que buscarla ni calcularla por fuera! 2) Si trazas una línea vertical desde la otra esquina, la figura se divide en un rectángulo limpio y un solo triángulo rectángulo al lado derecho.


  ![Definición de trapecio rectángulo](/static/img/nodos/definicion-de-trapecio-rectangulo-intro.svg)

  '
explicacion_formal: '### Definición formal

  Un trapecio $\mathcal{ABCD}$ con bases $\overline{AB} \parallel \overline{CD}$ es **rectángulo** si y solo si uno de sus lados no paralelos es perpendicular a las bases:

  $$\mathcal{ABCD} \text{ es trapecio rectángulo} \iff \overline{AD} \perp \overline{AB} \quad (\angle A = \angle D = 90^\circ)$$


  ### Propiedades métricas fundamentales

  1. **Identidad de la altura:** El lado perpendicular $\overline{AD}$ coincide idénticamente con la altura del trapecio:

  $$h = \text{long}(AD)$$


  2. **Descomposición canónica (Rectángulo + Triángulo Rectángulo):**

  Al trazar la altura interior $\overline{CE} \perp \overline{AB}$ con $CE = h$:

  - La figura queda particionada en un rectángulo $AECD$ de lados $b$ y $h$.

  - Y un triángulo rectángulo $\triangle EBC$ de catetos $h$ y $EB = B - b$.


  3. **Teorema de Pitágoras para el lado oblicuo ($c$):**

  $$c^2 = h^2 + (B - b)^2 \implies c = \sqrt{h^2 + (B - b)^2}$$

  Nótese que a diferencia del trapecio isósceles, aquí la base del triángulo es $(B - b)$ completa, sin dividir entre dos.


  > **Complemento didáctico:** Recuerda bien esta diferencia fundamental: en el trapecio rectángulo la base del triángulo lateral es $(B - b)$ completo. En cambio, en el isósceles se divide en dos: $\frac{B - b}{2}$. Si aplicas la fórmula equivocada, todo tu cálculo de Pitágoras fallará.

  '
definiciones_clave: '- **Trapecio rectángulo**: Trapecio con dos ángulos interiores de $90^\circ$ sobre un mismo lado lateral.

  - **Lado perpendicular ($c_\perp$)**: Lado lateral que satisface $c_\perp = h$.

  - **Lado oblicuo ($c$)**: Hipotenusa del triángulo rectángulo lateral con $c = \sqrt{h^2 + (B - b)^2}$.

  '
propiedades_relaciones: '- **Ángulos restantes**: Los dos ángulos del lado oblicuo son suplementarios: $\angle B + \angle C = 180^\circ$.

  - **Área combinada**: $A = b \cdot h + \frac{(B - b) \cdot h}{2} = \frac{(B + b) \cdot h}{2}$.

  - **Diagonales desiguales**: Las dos diagonales son siempre de distinta longitud métrica ($d_1 \neq d_2$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de trapecio rectángulo](/static/img/nodos/definicion-de-trapecio-rectangulo-ejemplos.svg)


    Un trapecio rectángulo tiene base mayor $B = 13$ cm, base menor $b = 7$ cm y lado perpendicular de $8$ cm. Calcula la longitud de su lado oblicuo y su perímetro total.'
  pasos:
  - 'Paso 1: Identificar la altura y la base del triángulo lateral: La altura es $h = 8$ cm. La base lateral es $B - b = 13 - 7 = 6$ cm.'
  - 'Paso 2: Aplicar el Teorema de Pitágoras para el lado oblicuo $c$: $c = \sqrt{h^2 + (B - b)^2} = \sqrt{8^2 + 6^2} = \sqrt{64 + 36} = \sqrt{100} = 10$ cm.'
  - 'Paso 3: Reunir los cuatro lados: $B = 13$ cm, $b = 7$ cm, lado recto $h = 8$ cm y lado oblicuo $c = 10$ cm.'
  - 'Paso 4: Calcular el perímetro: $P = 13 + 7 + 8 + 10 = 38$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos ángulos rectos tiene obligatoriamente un trapecio rectángulo?
  choices:
  - text: Exactamente dos ángulos rectos.
    is_correct: true
  - text: Un solo ángulo recto.
    is_correct: false
  - text: Cuatro ángulos rectos.
    is_correct: false
  - text: Tres ángulos rectos.
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente dos ángulos rectos.' Por suplementariedad de colaterales, si un lado es perpendicular a una base ($90^\circ$), también lo es a la otra base ($180^\circ - 90^\circ = 90^\circ$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un trapecio rectángulo de bases 15 cm y 10 cm, ¿cuánto mide la base del triángulo rectángulo lateral?
  choices:
  - text: 5 cm.
    is_correct: true
  - text: 2,5 cm.
    is_correct: false
  - text: 10 cm.
    is_correct: false
  - text: 12,5 cm.
    is_correct: false
  explanation: La alternativa correcta es '5 cm.' En el trapecio rectángulo la base lateral es $B - b = 15 - 10 = 5$ cm (no se divide entre dos).
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el lado lateral perpendicular y asignarlo directamente como la altura $h$.

  2. Calcular la base del triángulo rectángulo lateral restando las bases: $B - b$.

  3. Calcular el lado oblicuo aplicando Pitágoras: $c = \sqrt{h^2 + (B - b)^2}$.

  4. Sumar los cuatro lados para el perímetro o aplicar $A = \frac{B + b}{2} \cdot h$ para el área.

  '
errores_correccion: '- **Error común 1:** Dividir $(B - b)$ entre 2 al calcular el lado oblicuo. **Corrección:** En el trapecio rectángulo hay un solo triángulo lateral, por lo que su cateto es $(B - b)$ completo.

  - **Error común 2:** Trazar una altura externa innecesaria. **Corrección:** El lado recto ya es la altura de la figura.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de lado oblicuo
  enunciado: En un trapecio rectángulo, $B = 8\text{ cm}$, $b = 5\text{ cm}$ y $h = 4\text{ cm}$. ¿Cuánto mide el lado oblicuo?
  alternativas:
  - text: $5\text{ cm}$.
    is_correct: true
  - text: $3\text{ cm}$.
    is_correct: false
  - text: $7\text{ cm}$.
    is_correct: false
  - text: $25\text{ cm}$.
    is_correct: false
  explicacion: 'Cateto basal: $8 - 5 = 3\text{ cm}$. Hipotenusa: $c = \sqrt{4^2 + 3^2} = \sqrt{25} = 5\text{ cm}$.'
- tipo: B
  titulo: Ángulos rectos en trapecio
  enunciado: ¿Puede un trapecio tener exactamente tres ángulos rectos?
  respuesta: 'No'
  explicacion: No. Si tuviera tres ángulos de $90^\circ$, el cuarto ángulo sumaría $360^\circ - 270^\circ = 90^\circ$, convirtiéndose en un rectángulo.
errores_frecuentes:
- '''Dividir entre 2 la diferencia de bases en el trapecio rectángulo.'''
- '''Olvidar sumar el lado recto vertical al calcular el perímetro.'''
- '''Creer que las diagonales de un trapecio rectángulo son iguales.'''
afirmaciones_verdaderas:
- '''El trapecio rectángulo posee exactamente dos ángulos interiores de $90^\circ$.'''
- '''El lado lateral perpendicular es igual a la altura del trapecio ($h = c_\perp$).'''
- '''El lado oblicuo de un trapecio rectángulo satisface $c = \sqrt{h^2 + (B - b)^2}$.'''
al_terminar_debes_poder: '**QUÉ:** Resolver problemas métricos y de áreas en trapecios rectángulos descomponiéndolos en rectángulo y triángulo.


  **CÓMO:** Empleando $c = \sqrt{h^2 + (B - b)^2}$ y $A = \frac{B + b}{2} \cdot h$.


  ![Síntesis de trapecio rectángulo](/static/img/nodos/definicion-de-trapecio-rectangulo-resumen.svg)

  '
