semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_RAIZ_IMPAR
resumen_inicial: 'El conjunto dominio de una función potencia con exponente fraccionario de denominador impar $f(x) = a x^{p/q}$ ($q$ impar) es el conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R}$.'
explicacion_simple: |
  Cuando el denominador del exponente fraccionario de una función potencia es un número impar (como $x^{1/3}, x^{2/5}, x^{4/7}$), la función representa una raíz de índice impar ($\sqrt[3]{}, \sqrt[5]{}, \sqrt[7]{}$). A diferencia de las raíces cuadradas, las raíces de índice impar sí se pueden calcular perfectamente para números negativos (por ejemplo, $\sqrt[3]{-8} = -2$ porque $(-2)^3 = -8$). Por esta razón, la función no tiene prohibiciones de entrada y su dominio abarca todos los números reales $\mathbb{R}$.
explicacion_formal: |
  ### Definición formal
  Para toda función potencia $f: \operatorname{Dom}(f) \to \mathbb{R}$ definida por $f(x) = a \cdot x^{p/q} \equiv a \cdot \sqrt[q]{x^p}$ con $p, q \in \mathbb{Z}^+$ (fracción irreductible) y denominador **$q = 2k+1$ (Impar)**, el **dominio máximo de definición real** es irrestricto:
  $$\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$$

  ### Justificación de la existencia en reales negativos
  1. **Propiedad de los Números Reales**: Para todo número real $x < 0$ y todo índice impar $2k+1$, existe una única raíz real negativa dada por $\sqrt[2k+1]{x} = -\sqrt[2k+1]{|x|} \in \mathbb{R}$.
  2. **Continuidad Global**: La función raíz de índice impar $x^{1/(2k+1)}$ es continua en todo el espacio euclidiano $\mathbb{R}$.

  ### Síntesis didáctica
  Diferencia crítica de dominios en exponentes fraccionarios:
  - Denominador $q$ PAR (ej: $x^{1/2}$) $\implies \operatorname{Dom}(f) = [0, +\infty[$.
  - Denominador $q$ IMPAR (ej: $x^{1/3}$) $\implies \operatorname{Dom}(f) = \mathbb{R}$.
definiciones_clave: |
  - **Exponente de denominador impar $p/(2k+1)$**: Potencia fraccionaria equivalente a una raíz de índice impar.
  - **Dominio irrestricto $\mathbb{R}$**: Aceptación de números reales positivos, cero y negativos en la variable $x$.
  - **Existencia de raíces negativas**: Propiedad de los índices impares donde $(-c)^{1/(2k+1)} = -\sqrt[2k+1]{c}$.
propiedades_relaciones: |
  - **Simetría y paridad**: Si el numerador $p$ es impar y el denominador $q$ es impar, la función es impar ($f(-x) = -f(x)$) con simetría al origen. Si $p$ es par y $q$ es impar, la función es par ($f(-x) = f(x)$) con simetría al eje $y$.
  - **Recorrido $\mathbb{R}$**: Si $p$ es impar y $q$ es impar, el conjunto recorrido es también todo el conjunto $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto dominio de definición real de las siguientes funciones potencia justificando analíticamente según el denominador del exponente: A) $f(x) = 2x^{1/3}$, B) $g(x) = -5x^{2/5}$, C) $h(x) = \frac{1}{4}x^{4/3}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 2x^{1/3} = 2\sqrt[3]{x}$, el denominador del exponente es $q = 3$ (impar). Las raíces cúbicas existen para todo número real. Dominio: $\operatorname{Dom}(f) = \mathbb{R}$.'
    - 'Paso 2: Para $g(x) = -5x^{2/5} = -5\sqrt[5]{x^2}$, el denominador es $q = 5$ (impar). Acepta entradas negativas. Dominio: $\operatorname{Dom}(g) = \mathbb{R}$.'
    - 'Paso 3: Para $h(x) = \frac{1}{4}x^{4/3} = \frac{1}{4}\sqrt[3]{x^4}$, el denominador es $q = 3$ (impar). Dominio: $\operatorname{Dom}(h) = \mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio de definición real de la función potencia $f(x) = -4 x^{1/5} = -4\sqrt[5]{x}$ con exponente fraccionario de denominador impar?'
    choices:
      - {text: 'El conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$', is_correct: true}
      - {text: 'El intervalo de reales no negativos $[0, +\infty[$', is_correct: false}
      - {text: 'El conjunto de los reales sin el cero $\mathbb{R} \setminus \{0\}$', is_correct: false}
      - {text: 'El intervalo de reales estrictamente positivos $]0, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$''. Al ser el denominador impar $q = 5$, la función raíz de índice impar está definida para todo número real.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $f(x) = 3 x^{1/3} = 3\sqrt[3]{x}$ sí admite evaluar la entrada negativa $x = -27$?'
    choices:
      - {text: 'Porque las raíces de índice impar sobre números negativos están bien definidas en $\mathbb{R}$, dando $f(-27) = 3\sqrt[3]{-27} = 3(-3) = -9$', is_correct: true}
      - {text: 'Porque el coeficiente 3 convierte al número en positivo', is_correct: false}
      - {text: 'Porque las fracciones se pueden simplificar eliminando el signo negativo', is_correct: false}
      - {text: 'Porque el resultado da cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque las raíces de índice impar sobre números negativos están bien definidas en $\mathbb{R}$, dando $f(-27) = 3\sqrt[3]{-27} = 3(-3) = -9$''. La raíz cúbica de un negativo es un número real negativo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el denominador $q$ en el exponente fraccionario de la función $f(x) = a x^{p/q}$.'
  - 'Paso 2: Comprobar que $q$ sea un número entero impar.'
  - 'Paso 3: Confirmar que la función no contiene divisiones por cero ni radicales de índice par.'
  - 'Paso 4: Declarar que el conjunto dominio de definición real es $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
errores_correccion: |
  - **Error 1:** Limitar el dominio a $[0, +\infty[$ por el simple hecho de que el exponente es fraccionario. **Cómo corregirlo:** La restricción $[0, +\infty[$ aplica únicamente si el **denominador** $q$ es par. Si $q$ es impar (como en $x^{1/3}$), el dominio es todo $\mathbb{R}$.
  - **Error 2:** Confundir la paridad del numerador $p$ con la del denominador $q$. **Cómo corregirlo:** La restricción de existencia de la raíz depende del denominador $q$. Si $q$ es impar, no hay restricción de dominio sin importar si $p$ es par o impar.
ejemplos:
  - titulo: 'Dominio de exponente 1/3'
    enunciado: '¿El dominio de $f(x) = x^{1/3}$ es $\mathbb{R}$?'
    alternativas:
      - 'Sí, $\mathbb{R}$'
      - 'No, es $[0, +\infty[$'
      - 'No, es $\mathbb{R} \setminus \{0\}$'
    respuesta: 'Sí, $\mathbb{R}$'
    solucion_pasos:
      - '1. Denominador $q = 3$ es impar.'
      - '2. La función raíz cúbica se define en todo $\mathbb{R} \implies \operatorname{Dom}(f) = \mathbb{R}$.'
  - titulo: 'Dominio de exponente 2/5'
    enunciado: '¿La función $g(x) = -4x^{2/5}$ tiene dominio $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Denominador $q = 5$ es impar $\implies \operatorname{Dom}(g) = \mathbb{R}$.'
  - titulo: 'Evaluación de abscisa negativa en raíz impar'
    enunciado: '¿Se puede evaluar $x = -8$ en la función $h(x) = x^{1/3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $h(-8) = (-8)^{1/3} = \sqrt[3]{-8} = -2 \in \mathbb{R}$.'
  - titulo: 'Invariancia por coeficientes irracionales'
    enunciado: '¿El dominio de $p(x) = \pi x^{1/7}$ es el conjunto $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con $q = 7$ impar, $\operatorname{Dom}(p) = \mathbb{R}$.'
errores_frecuentes:
  - 'El dominio de la función $f(x) = x^{1/3}$ son únicamente los reales no negativos $[0, +\infty[$.'
  - 'Una función con exponente $1/5$ no se puede evaluar para números negativos.'
  - 'La afirmación de que si el numerador $p$ es par en $x^{p/q}$ con $q$ impar, el dominio se limita a los números positivos.'
  - 'El punto $x = 0$ no pertenece al dominio de $f(x) = x^{2/3}$.'
  - 'Un coeficiente negativo como $a = -3$ altera el dominio de $f(x) = x^{1/3}$ a $]-\infty, 0]$.'
afirmaciones_verdaderas:
  - 'El dominio de definición real de cualquier función potencia con exponente fraccionario de denominador impar $f(x) = a x^{p/(2k+1)}$ es el conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R}$.'
  - 'Las raíces de índice impar sobre números negativos están bien definidas en $\mathbb{R}$ y entregan resultados reales negativos.'
al_terminar_debes_poder: |
  QUÉ: Calcular el dominio de funciones potencia asociadas a raíces de índice impar.
  CÓMO: Justificar la existencia de raíces de índice impar para números negativos declarando $\text{Dom} = \mathbb{R}$.
