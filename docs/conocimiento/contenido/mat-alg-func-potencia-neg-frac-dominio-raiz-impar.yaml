semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_RAIZ_IMPAR
resumen_inicial: 'Determinación del dominio de funciones potencia asociadas a raíces
  de índice impar: forma general $f(x) = a x^n$, simetría, dominio y recorrido en
  Exponentes negativos y fraccionarios.'
explicacion_simple: A diferencia de la raíz cuadrada, la raíz cúbica y otras de índice
  impar sí están definidas para números negativos.
explicacion_formal: '### Definición formal


  Para $q$ impar, existe un único número real $y$ tal que $y^q=x$, para cualquier
  $x\in\mathbb{R}$, ya que una potencia impar conserva el signo de la base. Por lo
  tanto, el dominio de $f(x)=x^{1/q}$ es todo $\mathbb{R}$.


  ### Desarrollo didáctico


  $f(x)=\sqrt[3]{x}$: está definida en $x=8$, dando $f(8)=2$, y también en $x=-8$,
  dando $f(-8)=-2$, porque $(-2)^3=-8$.'
definiciones_clave: '- **Determinación del dominio de funciones potencia asociadas
  a raíces de índice impar**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y
  $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a determinación del dominio de funciones potencia asociadas
  a raíces de índice impar.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de determinación del dominio de funciones potencia asociadas a raíces de índice
    impar.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de determinación del dominio
    de funciones potencia asociadas a raíces de índice impar.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar determinación del dominio de funciones potencia asociadas a raíces
    de índice impar?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en exponentes negativos y fraccionarios
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en exponentes negativos y fraccionarios.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en determinación del dominio de funciones potencia asociadas
    a raíces de índice impar?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el índice $q$ de la raíz en la expresión $x^{1/q}$.'
- 'Paso 2: Verifica si $q$ es impar.'
- 'Paso 3: Si es impar, concluye que el dominio es todo $\mathbb{R}$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en determinación del dominio de funciones potencia asociadas a raíces
  de índice impar.
ejemplos:
- titulo: Determinación del dominio de $x^{1/3}$
  enunciado: Determina el dominio de $f(x)=x^{1/3}$.
  solucion_pasos:
  - El índice de la raíz es $3$, un número impar.
  - El dominio es todo $\mathbb{R}$.
- titulo: Evaluación de la raíz cúbica de un negativo
  enunciado: Evalúa $f(x)=\sqrt[3]{x}$ en $x=-27$.
  solucion_pasos:
  - Se busca un número que elevado al cubo dé $-27$.
  - Como $(-3)^3=-27$, se obtiene $f(-27)=-3$.
- titulo: ¿$x=-16$ pertenece al dominio de $f(x)=\sqrt[5]{x}$?
  enunciado: ¿El valor $x=-16$ pertenece al dominio de $f(x)=\sqrt[5]{x}$?
  respuesta: Sí
  solucion_pasos:
  - Con índice impar, cualquier número real, positivo o negativo, pertenece al dominio.
- titulo: ¿El dominio de una raíz de índice impar se restringe igual que el de índice
    par?
  enunciado: ¿El dominio de $f(x)=\sqrt[q]{x}$ con $q$ impar se restringe de la misma
    forma que con $q$ par?
  respuesta: 'No'
  solucion_pasos:
  - Con índice impar el dominio es todo $\mathbb{R}$; con índice par se restringe
    a $x\geq0$.
errores_frecuentes:
- Restringir innecesariamente el dominio de una raíz con índice impar a los valores
  positivos.
- Confundir el comportamiento de índice impar con el de índice par.
- Suponer que no existe la raíz de un número negativo, sin importar el índice.
- No verificar la paridad del índice antes de determinar el dominio.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  determinación del dominio de funciones potencia asociadas a raíces de índice impar.
