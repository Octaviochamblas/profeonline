guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.01.04'
  title: 'Identificación de pi como número irracional'
  description: 'Comprende el significado geométrico y la irracionalidad de la constante pi (π), diferenciándola de sus valores aproximados.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'identificacion-de-pi-como-numero-irracional'
semantic_id: 'MAT.NUM.IRRACIONALES.PI'
titulo: 'Identificación de pi como número irracional'
objetivo: 'Usar la constante $\pi$ como valor exacto en contextos geométricos y distinguirla formalmente de sus aproximaciones racionales comunes.'
introduccion: 'Al medir cualquier círculo, independientemente de su tamaño, la razón entre el perímetro de la circunferencia ($P$) y su diámetro ($d$) siempre da exactamente el mismo valor constante: $\pi = \frac{P}{d}$. Aunque en los cálculos escolares se utiliza frecuentemente la aproximación $3{,}14$ o $\frac{22}{7}$, el valor exacto de $\pi$ no se puede expresar como una fracción ni como un decimal finito. Es una constante trascendente e irracional con infinitas cifras decimales no periódicas.'
resumen: 'El número $\pi$ (pi) es la razón constante entre la longitud de una circunferencia y su diámetro ($\pi = \frac{P}{d}$). $\pi$ es un número irracional ($\pi \approx 3{,}1415926535\dots$). Expresiones como $3{,}14$ o $\frac{22}{7}$ son solo aproximaciones racionales usadas por conveniencia de cálculo, no el valor real de $\pi$.'
requisitos:
  - 'Perímetro y diámetro de una circunferencia.'
  - 'Definición general de números irracionales.'
objetivos:
  - 'Reconocer la constante $\pi$ como la razón geométrica constante $P/d$.'
  - 'Identificar a $\pi$ como un número irracional de decimales infinitos no periódicos.'
que_aprenderas:
  - 'La definición geométrica exacta de $\pi$.'
  - 'La diferencia entre el valor exacto en términos de $\pi$ y el valor aproximado decimal.'
  - 'Por qué $\frac{22}{7}$ y $3{,}14$ son números racionales mientras que $\pi$ es irracional.'
al_terminar_debes_poder:
  - 'Calcular el perímetro o área exacta de un círculo manteniendo el símbolo $\pi$.'
  - 'Explicar la diferencia conceptual entre la constante matemática $\pi$ y sus aproximaciones numéricas.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: 'Si la longitud de una circunferencia es $10\pi\text{ cm}$, ¿cuál es el valor EXACTO de dicha longitud?'
    choices:
      - {text: '$31{,}4\text{ cm}$.', is_correct: false}
      - {text: '$10\pi\text{ cm}$.', is_correct: true}
      - {text: '$31{,}416\text{ cm}$.', is_correct: false}
      - {text: 'Depende de la aproximación de $\pi$ que se elija.', is_correct: false}
    explanation: 'La correcta es: $10\pi\text{ cm}$. El valor exacto conserva el símbolo $\pi$. Al reemplazar $\pi$ por $3{,}14$ o $3{,}1416$, se obtiene un valor aproximado, no el valor exacto.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: '¿Cuál de las siguientes afirmaciones sobre el número $\pi$ y la fracción $\frac{22}{7}$ es correcta?'
    choices:
      - {text: '$\pi$ es exactamente igual a la fracción $\frac{22}{7}$.', is_correct: false}
      - {text: '$\frac{22}{7}$ es un número racional que sirve como una aproximación muy cercana de $\pi$, que es irracional.', is_correct: true}
      - {text: 'Ambos números son irracionales.', is_correct: false}
      - {text: '$\pi$ es un entero positivo.', is_correct: false}
    explanation: 'La correcta es: $\frac{22}{7}$ es un número racional que sirve como una aproximación muy cercana de $\pi$, que es irracional. $\frac{22}{7} = 3{,}142857\dots$ es racional (fracción de enteros), mientras que $\pi = 3{,}141592\dots$ es irracional.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la fórmula geométrica que involucra $\pi$ (por ejemplo, Perímetro $P = \pi \cdot d$ o Área $A = \pi \cdot r^2$).'
  - 'Paso 2: Sustituir los datos numéricos conocidos (radio o diámetro) manteniendo la constante $\pi$ de forma simbólica para expresar el valor exacto.'
  - 'Paso 3: Si se requiere una respuesta decimal aproximada, sustituir $\pi \approx 3{,}14$ o $3{,}1416$ al final del procedimiento.'
errores_frecuentes:
  - 'Creer que $\pi$ es racional porque se puede escribir como $\frac{P}{d}$ (olvidando que en cualquier circunferencia real, si el diámetro $d$ es entero, el perímetro $P$ es irracional, por lo que no es fracción de dos enteros).'
  - 'Reemplazar $\pi$ por $3{,}14$ prematuramente en cálculos algebraicos exactos.'
errores_correccion: 'Un error conceptual común es argumentar: Si $\pi = \frac{P}{d}$, ¿por qué no es racional?. La respuesta es que $P$ y $d$ nunca pueden ser ambos números enteros al mismo tiempo. Si el diámetro es un entero (ej: $10\text{ cm}$), el perímetro será $10\pi\text{ cm}$ (un número irracional). Por lo tanto, no es una fracción de enteros.'
ejemplos:
  - titulo: 'Área exacta vs aproximada de un círculo'
    enunciado: 'Un círculo tiene radio $r = 5\text{ cm}$. Calcula su área exacta y su área aproximada usando $\pi \approx 3{,}14$.'
    alternativas:
      - 'Exacta: $25\pi\text{ cm}^2$; Aproximada: $78{,}5\text{ cm}^2$'
      - 'Exacta: $78{,}5\text{ cm}^2$; Aproximada: $25\pi\text{ cm}^2$'
      - 'Exacta: $10\pi\text{ cm}^2$; Aproximada: $31{,}4\text{ cm}^2$'
      - 'Exacta: $50\pi\text{ cm}^2$; Aproximada: $157\text{ cm}^2$'
    respuesta: 'Exacta: $25\pi\text{ cm}^2$; Aproximada: $78{,}5\text{ cm}^2$'
    solucion_pasos:
      - 'El área de un círculo se calcula con $A = \pi \cdot r^2$.'
      - 'Sustituyendo $r = 5$: $A = \pi \cdot 5^2 = 25\pi\text{ cm}^2$. Este es el valor exacto.'
      - 'Para la aproximación decimal: $A \approx 25 \cdot 3{,}14 = 78{,}5\text{ cm}^2$.'
  - titulo: 'Pertenencia de expresiones con pi'
    enunciado: '¿Cuál de los siguientes números es un número RACIONAL?'
    alternativas:
      - '$2\pi$'
      - '$\pi + 1$'
      - '$\frac{\pi}{\pi}$'
      - '$\frac{\pi}{2}$'
    respuesta: '$\frac{\pi}{\pi}$'
    solucion_pasos:
      - '$2\pi$, $\pi + 1$ y $\frac{\pi}{2}$ son el resultado de operar el irracional $\pi$ con números racionales, resultando en números irracionales.'
      - 'En cambio, $\frac{\pi}{\pi} = 1$, y $1 \in \mathbb{Z} \subset \mathbb{Q}$, por lo que es un número racional.'
comprobacion_rapida:
  - afirmacion: 'El número $\pi$ es un número racional porque se puede aproximar por la fracción $\frac{22}{7}$.'
    respuesta: false
    explicacion: 'Falso. $\frac{22}{7}$ es solo una aproximación racional de $\pi$. $\pi$ es strictly irracional.'
  - afirmacion: 'Las cifras decimales de $\pi$ continúan infinitamente sin repetirse de forma periódica.'
    respuesta: true
    explicacion: 'Correcto. $\pi = 3{,}141592653589793\dots$ es un número irracional y trascendente.'
  - afirmacion: 'Si el diámetro de un círculo es un número entero, su perímetro será un número irracional.'
    respuesta: true
    explicacion: 'Correcto. Puesto que $P = \pi \cdot d$, al multiplicar el entero $d$ por el irracional $\pi$, se obtiene un perímetro irracional.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales e irracionales.'
estado: 'publicado'
