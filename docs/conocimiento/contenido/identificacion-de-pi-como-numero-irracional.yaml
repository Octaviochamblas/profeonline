semantic_id: MAT.NUM.IRRACIONALES.PI
resumen_inicial: 'El número $\pi$ (pi) es una constante matemática irracional trascendente
  que representa la razón entre la longitud de una circunferencia y su diámetro: $\pi
  \approx 3,14159265...$'
explicacion_simple: El número $\pi$ es la constante más famosa de la geometría. Representa
  cuántas veces cabe el diámetro de cualquier círculo alrededor de su borde o circunferencia.
  Como es un número irracional, sus cifras decimales son infinitas y nunca se repiten
  en un período.
explicacion_formal: 'La constante universal **$\pi$ (Pi)** se define geométricamente
  y analíticamente como:


  $$\pi = \frac{C}{D} = \int_{-1}^{1} \frac{1}{\sqrt{1-x^2}} \, dx \approx 3,1415926535...$$


  **Desglose de la definición:**

  - $C / D$: Cociente entre el perímetro de una circunferencia $C$ y su diámetro $D
  = 2r$.

  - Trascendencia de $\pi$: Demostrado por Ferdinand von Lindemann en 1882; $\pi$
  no es raíz de ningún polinomio no nulo con coeficientes racionales.


  > **Complemento didáctico:** Las fracciones $3,14$ o $\frac{22}{7}$ son solo **aproximaciones
  racionales** útiles para cálculos numéricos, pero no representan el valor exacto
  de $\pi$.'
definiciones_clave: '- **Número $\pi$**: Constante trascendente irracional que define
  la relación perimétrica de la circunferencia ($C = 2\pi r$).'
propiedades_relaciones: '- **Relación geométrica fundamental**: $C = 2\pi r$ y $A
  = \pi r^2$.'
ejemplo_guiado:
  enunciado: Explique la diferencia entre la constante exacta $\pi$ y la aproximación
    usada en física $\pi \approx 3,14$.
  pasos:
  - 'Paso 1: Identificar el valor exacto $\pi$: es un número irracional con infinitas
    cifras decimales no periódicas ($3,14159265...$).'
  - 'Paso 2: Analizar la cifra $3,14$: es un decimal finito exacto igual a la fracción
    $\frac{314}{100} = \frac{157}{50} \in \mathbb{Q}$.'
  - 'Paso 3: Distinguir ambos conceptos: $3,14$ es una estimación racional por redondeo/truncamiento
    a las centésimas.'
  - 'Conclusión: $\pi \in \mathbb{I}$ es exacto e irracional, mientras que $3,14 \in
    \mathbb{Q}$ es solo una aproximación.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el valor 3,14 no es igual al número pi, sino solo una aproximación?
  choices:
  - text: Porque 3,14 es un decimal finito racional (157/50), mientras pi tiene infinitas
      cifras no periódicas
    is_correct: true
  - text: Porque pi es un número entero negativo
    is_correct: false
  - text: Porque 3,14 es una fracción impropia
    is_correct: false
  - text: Son exactamente iguales en todos sus decimales
    is_correct: false
  explanation: La alternativa correcta es 'Porque 3,14 es un decimal finito racional
    (157/50), mientras pi tiene infinitas cifras no periódicas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿a qué conjunto pertenece el valor matemático exacto
    pi?
  choices:
  - text: Al conjunto de los números irracionales I
    is_correct: true
  - text: Al conjunto de los números racionales Q
    is_correct: false
  - text: Al conjunto de los enteros Z
    is_correct: false
  - text: Es un número racional finito
    is_correct: false
  explanation: La alternativa correcta es 'Al conjunto de los números irracionales
    I'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer el símbolo $\pi$ como la constante irracional matemática $C/D$.'
- 'Paso 2: Diferenciar la constante $\pi \in \mathbb{I}$ de sus aproximaciones racionales
  comunes ($3,14$ o $22/7$).'
- 'Paso 3: Aplicar el valor exacto $\pi$ o sus aproximaciones según lo requiera el
  contexto del problema.'
errores_correccion: '- **Error 1: Creer que la fracción $\frac{22}{7}$ es el valor
  exacto de $\pi$.** **Cómo corregirlo:** $\frac{22}{7} = 3,\overline{142857}$ es
  un racional periódico usado históricamente como aproximación.


  - **Error 2: Afirmar que $\pi$ se puede escribir como fracción porque se define
  como $C/D$.** **Cómo corregirlo:** La longitud de la circunferencia $C$ o el diámetro
  $D$ son magnitudes irracionales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el radio de una circunferencia es $5$ cm, ¿cuál es su perímetro exacto?
  alternativas:
  - 10 pi cm
  - 31,4 cm
  - 15,7 cm
  respuesta: 10 pi cm
  solucion_pasos:
  - 'Perímetro exacto: $C = 2\pi r = 2\pi(5) = 10\pi$ cm.'
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de número es $\pi + 2$?
  alternativas:
  - Un número irracional
  - Un número entero
  - Un número racional
  respuesta: Un número irracional
  solucion_pasos:
  - Sumar un entero a un número irracional produce un resultado irracional.
- titulo: ¿Es pi un número trascendente además de ser irracional?
  respuesta: Sí
  solucion_pasos:
  - Sí, fue demostrado por Lindemann en 1882.
- titulo: ¿Tiene el número pi un período repetitivo en sus decimales?
  respuesta: 'No'
  solucion_pasos:
  - No, como todo número irracional, su expansión es infinita no periódica.
errores_frecuentes:
- El valor exacto del número pi equivale a la fracción racional 22/7.
- El número pi se clasifica como un número decimal finito de dos decimales igual a
  3,14.
- La circunferencia de un círculo dividida por su diámetro entrega un número entero
  par.
- El número pi posee un período de repetición de seis dígitos en su desarrollo decimal.
- Multiplicar el número pi por cero da como resultado un número irracional.
afirmaciones_verdaderas:
- El número $\pi$ es una constante irracional trascendente que representa la razón
  entre el perímetro del círculo y su diámetro.
- Las cifras $3,14$ o la fracción $22/7$ son aproximaciones racionales y no el valor
  exacto de $\pi$.
al_terminar_debes_poder: Al terminar serás capaz de identificar el número $\pi$ como
  una constante irracional trascendente, distinguiendo su valor exacto de sus aproximaciones
  racionales en cálculos geométricos.
