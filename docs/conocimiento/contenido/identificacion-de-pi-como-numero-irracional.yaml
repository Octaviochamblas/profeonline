semantic_id: MAT.NUM.IRRACIONALES.PI
resumen_inicial: El número pi (pi) es una constante matemática irracional y trascendente que representa la razón constante entre la longitud de una circunferencia y su diámetro.
explicacion_simple: '![Identificación de pi como irracional](/static/img/nodos/identificacion-de-pi-como-numero-irracional-intro.svg)


  El número $\pi$ (pi) surge de la geometría del círculo: si tomas cualquier circunferencia del mundo y divides su perímetro por su diámetro, el resultado es SIEMPRE el mismo número: $\pi \approx 3,14159265...$. Es un número irracional con infinitos decimales que nunca se repiten en un patrón periódico.'
explicacion_formal: "La constante fundamental **Pi** ($\\pi$) se define geométricamente como la razón euclidiana invariante:\n\n$$\\pi = \\frac{C}{d} = \\frac{\\text{Perímetro de la circunferencia}}{\\text{Diámetro}}$$\n\n**Propiedades analíticas y algebraicas de $\\pi$:**\n- **Irracionalidad:** Demostrada formalmente por Johann Heinrich Lambert en 1761 mediante fracciones continuas. $\\pi \\in \\mathbb{I} \\implies \\pi \\notin \\mathbb{Q}$.\n- **Trascendencia:** Demostrada por Ferdinand von Lindemann en 1882. $\\pi$ no es raíz de ningún polinomio no nulo con coeficientes racionales ($P(x) \\in \\mathbb{Q}[x]$), lo que demostró formalmente la imposibilidad de la *Cuadratura del Círculo* con regla y compás.\n- **Series infinitas canónicas:**\n  $$\\frac{\\pi}{4} = 1 - \\frac{1}{3} + \\frac{1}{5} - \\frac{1}{7} + \\cdots = \\sum_{k=0}^{\\infty} \\frac{(-1)^k}{2k+1}$$\n\n> **Complemento didáctico:** En la prueba PAES y en cálculos matemáticos exactos, los resultados de perímetros y áreas circulares\
  \ se expresan en términos de $\\pi$ (ej: $10\\pi\\text{ cm}$), ya que $3,14$ o $\\frac{22}{7}$ son solo aproximaciones racionales."
definiciones_clave: '- **Constante $\pi$ (pi)**: Razón matemática $\frac{C}{d} \approx 3,14159265...$ entre la circunferencia y el diámetro.

  - **Número trascendente**: Número real que no es solución de ninguna ecuación algebraica con coeficientes enteros.

  - **Aproximación racional de $\pi$**: Valores prácticos de cálculo como $3,14$, $3,1416$ o $\frac{22}{7}$ que NO equivalen exactamente a $\pi$.'
propiedades_relaciones: '- **Perímetro circular**: $C = 2\pi r = \pi d$.

  - **Área del círculo**: $A = \pi r^2$.

  - **Volumen de la esfera**: $V = \frac{4}{3}\pi r^3$.

  - **Irracionalidad preservada**: Si $q \in \mathbb{Q} \setminus \{0\}$, entonces $q\pi \in \mathbb{I}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos con el número pi](/static/img/nodos/identificacion-de-pi-como-numero-irracional-ejemplos.svg)


    Calcule el perímetro exacto de una circunferencia de diámetro $d = 10\text{ cm}$ y el área de un círculo de radio $r = 5\text{ m}$.'
  pasos:
  - 'Paso 1: Para el perímetro: Aplicar la fórmula $C = \pi \cdot d$.'
  - 'Paso 2: Sustituir el diámetro: $C = \pi \cdot 10 = 10\pi\text{ cm}$. Al ser $\pi \in \mathbb{I}$, el valor exacto es $10\pi\text{ cm}$ (irracional).'
  - 'Paso 3: Para el área: Aplicar la fórmula $A = \pi \cdot r^2$.'
  - 'Paso 4: Sustituir el radio: $A = \pi \cdot 5^2 = 25\pi\text{ m}^2$ (valor exacto irracional).'
  - 'Conclusión: El perímetro exacto es $10\pi\text{ cm}$ y el área exacta es $25\pi\text{ m}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la fracción $\frac{22}{7}$ no es el valor exacto del número $\pi$?
  choices:
  - text: Porque 22/7 es un número racional y pi es estrictamente irracional
    is_correct: true
  - text: Porque 22/7 es un número entero
    is_correct: false
  - text: Porque pi no se puede calcular en círculos
    is_correct: false
  - text: Porque 22/7 da un número negativo
    is_correct: false
  explanation: La alternativa correcta es 'Porque 22/7 es un número racional y pi es estrictamente irracional'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se expresa correctamente el valor exacto del perímetro para diámetro 10 cm?
  choices:
  - text: $10\pi\text{ cm}$
    is_correct: true
  - text: $31,4\text{ cm}$
    is_correct: false
  - text: $100\text{ cm}$
    is_correct: false
  - text: $5\pi\text{ cm}$
    is_correct: false
  explanation: La alternativa correcta es '$10\pi\text{ cm}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer el símbolo $\pi$ como la constante universal irracional $\approx 3,14159...$.'
- 'Paso 2: En problemas geométricos, mantener el símbolo $\pi$ en la respuesta para indicar el valor exacto.'
- "Paso 3: Si se requiere una aproximación decimal, reemplazar $\\pi$ por el valor indicado en el enunciado (ej: $3,14$) y usar el signo de aproximación ($\approx$)."
errores_correccion: '- **Error 1: Creer que $\pi$ es exactamente igual a $3,14$ o a $22/7$.** **Cómo corregirlo:** $3,14$ es solo un redondeo a dos decimales y $\frac{22}{7}$ es una aproximación histórica ($3,\overline{142857}$). $\pi$ tiene infinitos decimales aperiódicos.

  - **Error 2: Pensar que multiplicar $\pi$ por un entero lo transforma en racional.** **Cómo corregirlo:** El producto de un racional no nulo por $\pi$ sigue siendo irracional ($2\pi \in \mathbb{I}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el perímetro exacto de una rueda de bicicleta de diámetro $d = 10\text{ cm}$.
  alternativas:
  - $10\pi\text{ cm}$
  - $31,4\text{ cm}$
  - $100\pi\text{ cm}$
  respuesta: $10\pi\text{ cm}$
  solucion_pasos:
  - $C = \pi \cdot d = 10\pi\text{ cm}$ (expresión exacta).
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de número es el área de un círculo de radio $1\text{ cm}$ ($A = \pi\text{ cm}^2$)?
  alternativas:
  - Un número irracional
  - Un número entero
  - Un número racional decimal finito
  respuesta: Un número irracional
  solucion_pasos:
  - $A = \pi \cdot 1^2 = \pi\text{ cm}^2 \in \mathbb{I}$.
- titulo: ¿Es pi un número trascendente además de ser irracional?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\pi$ no es solución de ninguna ecuación polinómica con coeficientes enteros.
  alternativas:
  - texto: Sí, es un número trascendente e irracional
    es_correcta: true
    retroalimentacion: ¡Correcto! Demostrado por Lindemann en 1882.
  - texto: No, es solo una raíz cuadrada
    es_correcta: false
    retroalimentacion: Incorrecto, $\pi$ no proviene de ninguna raíz radical de enteros.
  - texto: No, es un número algebraico
    es_correcta: false
    retroalimentacion: Incorrecto, los números trascendentes son ajenos a los algebraicos.
- titulo: ¿Tiene el número pi un período repetitivo en sus decimales?
  respuesta: 'No'
  solucion_pasos:
  - No, al ser irracional, sus decimales son infinitos y aperiódicos.
  alternativas:
  - texto: No, jamás tiene un período repetitivo
    es_correcta: true
    retroalimentacion: ¡Correcto! Se han calculado billones de dígitos sin encontrar jamás un período.
  - texto: Sí, se repite cada 100 decimales
    es_correcta: false
    retroalimentacion: Incorrecto, si tuviera período sería un número racional.
  - texto: Solo se repite en base 2
    es_correcta: false
    retroalimentacion: Incorrecto, la irracionalidad de $\pi$ es independiente de la base numérica.
errores_frecuentes:
- Afirmar que $\pi$ es un número racional porque se puede aproximar con la fracción 22/7.
- Olvidar colocar el símbolo $\pi$ al calcular áreas y perímetros de figuras circulares.
- Confundir la definición geométrica de $\pi$ con el valor numérico truncado 3,14.
- Pensar que $\pi^2$ es un número racional.
- Asumir que $\frac{\pi}{\pi} = 1$ convierte a $\pi$ en racional.
afirmaciones_verdaderas:
- El número $\pi$ es la razón constante entre la longitud de cualquier circunferencia y su diámetro.
- $\pi$ es un número irracional y trascendente con infinitas cifras decimales no periódicas.
- El valor exacto del perímetro y área de un círculo se expresa mediante el símbolo $\pi$.
al_terminar_debes_poder: '![Síntesis del número pi](/static/img/nodos/identificacion-de-pi-como-numero-irracional-resumen.svg)


  QUÉ: Identificar la constante $\pi$ (pi) como un número irracional y trascendente.


  CÓMO: Comprendiendo su origen geométrico como razón invariante de la circunferencia ($\pi = \frac{C}{d}$), reconociendo que $3,14$ y $\frac{22}{7}$ son solo aproximaciones racionales y expresando resultados exactos en términos de $\pi$.'
