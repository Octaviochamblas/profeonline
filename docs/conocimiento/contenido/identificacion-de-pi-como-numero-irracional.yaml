semantic_id: MAT.NUM.IRRACIONALES.PI
resumen_inicial: El número $\pi$ (pi) es una constante matemática irracional fundamental definida
  como la razón entre la longitud de una circunferencia y su diámetro ($\pi \approx 3{,}14159...$).
explicacion_simple: 'El número $\pi$ es el número irracional más famoso del mundo. Representa
  cuántas veces cabe el diámetro de un círculo alrededor de su borde:

  $$\pi = \frac{\text{Perímetro del círculo}}{\text{Diámetro}} = 3{,}14159265...$$

  Fracciones como $\frac{22}{7}$ o decimales como $3{,}14$ son solo **aproximaciones** a $\pi$,
  no su valor exacto.'
explicacion_formal: El número $\pi \in \mathbb{I}$ es trascendente (y por ende irracional).
  Su demostración de irracionalidad (Lambert, 1761) establece que $\pi \neq \frac{a}{b}$ para
  todo $a,b \in \mathbb{Z}$.
definiciones_clave: '- **Constante $\pi$**: Razón entre el perímetro y el diámetro de un círculo.'
propiedades_relaciones: '- **Trascendencia**: $\pi$ no es raíz de ninguna ecuación polinómica
  no nula con coeficientes racionales.'
ejemplo_guiado:
  enunciado: Determina si el perímetro de una circunferencia de diámetro $d = 5\text{ cm}$
    es un número racional o irracional.
  pasos:
  - 'Fórmula del perímetro: $P = \pi \cdot d = 5\pi$.'
  - Como $5$ es un racional no nulo y $\pi$ es irracional, su producto $5\pi$ es irracional.
  - Concluir que el valor exacto del perímetro es un número irracional.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes afirmaciones sobre el número $\pi$ es CORRECTA?
  choices:
  - text: Es un número irracional de decimales infinitos no periódicos
    is_correct: true
  - text: Es exactamente igual a 3,14
    is_correct: false
  - text: Es un número racional equivalente a 22/7
    is_correct: false
  - text: Es un número entero
    is_correct: false
  explanation: 'La correcta es: Es un número irracional de decimales infinitos no periódicos.
    3,14 y 22/7 son solo aproximaciones.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué conjunto numérico pertenece el resultado exacto del área de un círculo
    de radio $r = 3$? ($A = \pi r^2 = 9\pi$)
  choices:
  - text: Al conjunto de los números irracionales (I)
    is_correct: true
  - text: Al conjunto de los números racionales (Q)
    is_correct: false
  - text: Al conjunto de los números enteros (Z)
    is_correct: false
  - text: Al conjunto de los números naturales (N)
    is_correct: false
  explanation: 'La correcta es: Al conjunto de los números irracionales (I). El producto $9\pi$
    es un número irracional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer el símbolo $\pi$ en la expresión matemática.'
- 'Paso 2: Recordar que $\pi$ es un constante irracional aperiódica.'
- 'Paso 3: Tratar las aproximaciones $3{,}14$ o $22/7$ solo como estimaciones prácticas.'
errores_correccion: No digas que $\pi = 3{,}14$. El valor $3{,}14$ es un racional usado para
  simplificar cálculos, pero $\pi$ es un número irracional **infinito**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\pi$ un número racional?
  alternativas:
  - No, es irracional
  - Sí, es 3,14
  respuesta: No, es irracional
  solucion_pasos:
  - $\pi \in \mathbb{I}$ por definición.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado exacto de 2π, racional o irracional?
  alternativas:
  - Irracional
  - Racional
  - Depende del valor de π que se use
  respuesta: Irracional
  solucion_pasos:
  - El producto de un racional no nulo por π sigue siendo irracional.
- titulo: Ejemplo 3
  enunciado: ¿22/7 es exactamente igual a π?
  alternativas:
  - No, es solo una aproximación
  - Sí, son exactamente iguales
  - Solo para círculos pequeños
  respuesta: No, es solo una aproximación
  solucion_pasos:
  - 22/7 es racional, mientras que π es irracional; no pueden ser exactamente iguales.
- titulo: ¿El valor 3,14159265358979... de π tiene un patrón periódico?
  respuesta: 'No'
  solucion_pasos:
  - Sus decimales son infinitos y no siguen ningún periodo.
errores_frecuentes:
- Confundir las aproximaciones decimales de $\pi$ con su naturaleza irracional.
- Creer que pi es exactamente igual a 3,14 o a 22/7, cuando ambos son solo aproximaciones.
- Pensar que pi tiene un valor exacto que algún día se terminará de calcular.
- Confundir pi con el número de Euler al recordar sus primeras cifras decimales.
- Creer que multiplicar pi por un número racional distinto de cero da como resultado un número
  racional.
afirmaciones_verdaderas:
- $\pi \in \mathbb{I}$ es un número irracional y trascendente.
- El número pi es una constante trascendente, lo que implica que también es irracional.
al_terminar_debes_poder: Identificar el número $\pi$ como una constante irracional.
fuente: Texto escolar MINEDUC.
estado: publicado
