semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.COCIENTE
resumen_inicial: 'La propiedad del logaritmo de un cociente establece que el logaritmo de una división es igual a la resta entre el logaritmo del numerador y el logaritmo del denominador: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$ ($x > 0, y > 0$).'
explicacion_simple: "![La propiedad del logaritmo de un cociente establece que el logaritmo de una división es igual a la resta entre el logaritmo del numerador y el logaritmo del denominador: $\\log_b\\left(\\frac{x}{y}\\right) = \\log_b(x) - \\log_b(y)$ ($x > 0, y > 0$)](/static/img/nodos/aplicacion-de-la-propiedad-del-logaritmo-de-un-cociente-intro.svg)\n\n\nEsta propiedad **convierte divisiones y fracciones en simples restas**:\n\n$$\\log_b\\left(\\frac{x}{y}\\right) = \\log_b(x) - \\log_b(y)$$\n\n- **¿Por qué funciona?**\n  - Por la ley de potencias: al dividir potencias de igual base, **se restan los exponentes** ($\\frac{b^u}{b^v} = b^{u-v}$).\n- **Regla de signos fácil:**\n  - Lo que está **arriba (numerador)** entra con signo **$+$**.\n  - Lo que está **abajo (denominador)** entra con signo **$-$**.\n- **Ejemplos clave:**\n  - $\\log_3(81/9) = \\log_3(81) - \\log_3(9) = 4 - 2 = \\mathbf{2}$.\n  - $\\log_5(500) - \\log_5(4) = \\log_5(500/4) = \\log_5(125) = \\mathbf{3}$."
explicacion_formal: 'Sean $x, y \in \mathbb{R}^+$ y $b \in \mathbb{R}^+ \setminus \{1\}$. Sean $u = \log_b(x)$ y $v = \log_b(y) \iff x = b^u, y = b^v$.

  Por las leyes del álgebra sobre el cociente de potencias en $(\mathbb{R}^+, \cdot)$:

  $$\frac{x}{y} = \frac{b^u}{b^v} = b^{u - v}$$

  Aplicando el operador $\log_b$ a ambos miembros de la ecuación:

  $$\log_b\left(\frac{x}{y}\right) = \log_b\left(b^{u - v}\right) = u - v$$

  Sustituyendo las definiciones iniciales de $u$ y $v$:

  $$\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$$


  **Representación equivalente con potencia inversa**:

  $$\log_b\left(\frac{x}{y}\right) = \log_b(x \cdot y^{-1}) = \log_b(x) + \log_b(y^{-1}) = \log_b(x) - \log_b(y)$$'
definiciones_clave: '- **Logaritmo de un cociente**: Teorema sustractivo que transforma una fracción en resta de logaritmos.

  - **Numerador positivo y denominador sustractivo**: Regla de polaridad de signos según la posición en la fracción.'
propiedades_relaciones: '- **Falso teorema de la resta**: $\log_b(x - y) \neq \log_b(x) - \log_b(y)$ y $\log_b(x/y) \neq \frac{\log_b(x)}{\log_b(y)}$.

  - **Contracción fraccionaria**: Permite fusionar diferencias de logaritmos en una sola fracción simplificable.'
ejemplo_guiado:
  enunciado: '![Ejemplo La propiedad del logaritmo de un cociente establece que el logaritmo de una división es igual a la resta entre el logaritmo del numerador y el logaritmo del denominador: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$ ($x > 0, y > 0$)](/static/img/nodos/aplicacion-de-la-propiedad-del-logaritmo-de-un-cociente-ejemplos.svg)



    Calcula y simplifica aplicando la propiedad del cociente:

    1) $\log_2(48) - \log_2(3)$

    2) Si $\log(2) \approx 0{,}301$, calcula $\log(5)$ sabiendo que $5 = \frac{10}{2}$.'
  pasos:
  - 'Paso 1: Para $\log_2(48) - \log_2(3)$:

    - Condensar la resta en un cociente: $\log_2\left(\frac{48}{3}\right)$.

    - Dividir los argumentos: $\frac{48}{3} = 16$.

    - Calcular el logaritmo resultante: $\log_2(16) = \mathbf{4}$.'
  - 'Paso 2: Para $\log(5)$:

    - Expresar como cociente: $\log(5) = \log\left(\frac{10}{2}\right)$.

    - Aplicar propiedad: $\log(10) - \log(2)$.

    - Como $\log(10) = 1$: $1 - 0{,}301 = \mathbf{0{,}699}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual la resta $\log_3(54) - \log_3(2)$?
  choices:
  - text: 3 (porque log₃(54/2) = log₃(27) = 3)
    is_correct: true
  - text: log₃(52)
    is_correct: false
  - text: '27'
    is_correct: false
  - text: log₃(54) / log₃(2)
    is_correct: false
  explanation: La alternativa correcta es '3 (porque log₃(54/2) = log₃(27) = 3)'. La resta de logaritmos se convierte en el logaritmo del cociente $54/2 = 27$, y $\log_3(27) = 3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Es equivalente $\log(a/b)$ a $\frac{\log(a)}{\log(b)}$?
  choices:
  - text: No, log(a/b) = log(a) - log(b), mientras que log(a)/log(b) es un cambio de base
    is_correct: true
  - text: Sí, son expresiones idénticas
    is_correct: false
  - text: Solo si a > b
    is_correct: false
  - text: Solo para logaritmo natural
    is_correct: false
  explanation: La alternativa correcta es 'No, log(a/b) = log(a) - log(b), mientras que log(a)/log(b) es un cambio de base'. No se debe confundir la resta de logaritmos con la división de dos logaritmos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambos logaritmos tengan la misma base $b$.'
- 'Paso 2: Para expandir, escribir $\log_b(\text{numerador}) - \log_b(\text{denominador})$.'
- 'Paso 3: Para condensar, escribir $\log_b\left(\frac{\text{argumento positivo}}{\text{argumento restado}}\right)$.'
- 'Paso 4: Simplificar la fracción resultante y evaluar el logaritmo.'
errores_correccion: '- **Error común:** Dividir los logaritmos $\frac{\log(x)}{\log(y)}$ en lugar de restarlos.

  - **Cómo corregirlo:** La propiedad establece una **RESTA de logaritmos**: $\log_b\left(\frac{x}{y}\right) = \log_b(x) \mathbf{-} \log_b(y)$.'
ejemplos:
- titulo: 'Ejemplo 1: Condensación de resta'
  enunciado: 'Calcula $\log_4(32) - \log_4(2)$:'
  alternativas:
  - '2'
  - '4'
  - '16'
  - '30'
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: $\log_4(32/2) = \log_4(16) = 2$.'
- titulo: 'Ejemplo 2: Expansión de fracción algebraica'
  enunciado: 'Expande $\log_5\left(\frac{x}{25}\right)$:'
  alternativas:
  - log₅(x) - 2
  - log₅(x) / 2
  - log₅(x) - 25
  - x - 2
  respuesta: log₅(x) - 2
  solucion_pasos:
  - 'Paso 1: $\log_5(x) - \log_5(25) = \log_5(x) - 2$.'
- titulo: 'Ejemplo 3: Cálculo de log(50)'
  enunciado: Si $\log(2) \approx 0{,}301$, ¿cuánto vale $\log(50) = \log(100/2)$?
  alternativas:
  - 1,699
  - 2,301
  - 0,699
  - 1,301
  respuesta: 1,699
  solucion_pasos:
  - 'Paso 1: $\log(100) - \log(2) = 2 - 0{,}301 = 1{,}699$.'
- titulo: 'Ejemplo 4: Cociente unitario'
  enunciado: 'Simplifica $\log_b(x) - \log_b(x)$ usando la propiedad:'
  alternativas:
  - 0 (porque log_b(x/x) = log_b(1) = 0)
  - '1'
  - x
  - b
  respuesta: 0 (porque log_b(x/x) = log_b(1) = 0)
  solucion_pasos:
  - 'Paso 1: $\log_b(x/x) = \log_b(1) = 0$.'
errores_frecuentes:
- Dividir los logaritmos en lugar de restarlos.
- Restar los argumentos directamente dentro del logaritmo (confundir x/y con x - y).
- Invertir el orden restando el numerador del denominador.
afirmaciones_verdaderas:
- El logaritmo de un cociente es igual a la diferencia entre el logaritmo del numerador y el del denominador.
- La resta de dos logaritmos de igual base equivale al logaritmo de la fracción de sus argumentos.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad del logaritmo de un cociente para expandir y condensar fracciones.


  **CÓMO:** Utilizando la identidad log_b(x/y) = log_b(x) - log_b(y) para simplificar operaciones analíticas.


  ![Resumen La propiedad del logaritmo de un cociente establece que el logaritmo de una división es igual a la resta entre el logaritmo del numerador y el logaritmo del denominador: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$ ($x > 0, y > 0$)](/static/img/nodos/aplicacion-de-la-propiedad-del-logaritmo-de-un-cociente-resumen.svg)'
