semantic_id: MAT.ALG.FUNCION_CONCEPTOS.NOTACION_FUNCIONAL
resumen_inicial: La notación funcional $f(x)$ expresa de forma compacta el nombre de la regla operacional y el argumento de entrada a evaluar.
explicacion_simple: |
  Escribir $y = f(x)$ significa que $y$ se calcula aplicando la regla llamada "$f$" al número "$x$".

  - $f$ es el nombre de la función.
  - $(x)$ indica qué variable entra.
  - NO significa "$f$ multiplicado por $x$".
explicacion_formal: |
  La **notación funcional** ideada por Leonhard Euler establece que para una función $f$ y un elemento $x$ de su dominio:

  $$y = f(x)$$

  **Desglose de la notación:**
  - $f$: Identificador o nombre del operador funcional.
  - $x$: Variable o expresión algebraica de entrada (argumento).
  - $f(x)$: Imagen o valor numérico devuelto por la función.
definiciones_clave: |
  - **Notación funcional ($f(x)$)**: Simbolismo matemático estándar para representar la evaluación de una regla operacional en un argumento.
propiedades_relaciones: |
  - **Evaluación compuesta**: $f(a + b)$ indica evaluar la expresión completa $a + b$ en el argumento de $f$, no la suma de $f(a) + f(b)$ salvo en funciones lineales homogéneas.
ejemplo_guiado:
  enunciado: Dada la función $f(x) = x^2 - 3x + 2$, evalúa la expresión funcional $f(x + 1)$.
  pasos:
    - 'Paso 1: Reemplazar cada ocurrencia de $x$ por el binomio completo $(x + 1)$: $f(x + 1) = (x + 1)^2 - 3(x + 1) + 2$.'
    - 'Paso 2: Desarrollar el cuadrado de binomio: $(x + 1)^2 = x^2 + 2x + 1$.'
    - 'Paso 3: Distribuir el producto por $-3$: $-3(x + 1) = -3x - 3$.'
    - 'Paso 4: Sumar y reducir términos semejantes: $f(x + 1) = x^2 + 2x + 1 - 3x - 3 + 2 = x^2 - x$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Qué representa el símbolo $f(x)$ en la matemática moderna?
    choices:
      - {text: La imagen asignada por la función $f$ al argumento $x$., is_correct: true}
      - {text: La multiplicación del factor $f$ por el número $x$., is_correct: false}
      - {text: La recta tangente en el punto $x$., is_correct: false}
      - {text: El valor constante de la función., is_correct: false}
    explanation: La alternativa correcta es 'La imagen asignada por la función $f$ al argumento $x$.'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: Dada $f(x) = x^2 - 3x + 2$, ¿cuál es el resultado simplificado de $f(x + 1)$?
    choices:
      - {text: '$x^2 - x$', is_correct: true}
      - {text: '$x^2 - 3x + 3$', is_correct: false}
      - {text: '$x^2 - 5x + 6$', is_correct: false}
      - {text: '$x^2 + 1$', is_correct: false}
    explanation: La alternativa correcta es '$x^2 - x$'. $(x+1)^2 - 3(x+1) + 2 = x^2+2x+1-3x-3+2 = x^2-x$.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la regla de asignación de $f(x)$.'
  - 'Paso 2: Identificar la constante o expresión sustituta asignada al argumento.'
  - 'Paso 3: Encerrar el nuevo argumento entre paréntesis y sustituir cada aparición de $x$.'
  - 'Paso 4: Simplificar las operaciones algebraicas resultantes.'
errores_correccion: |
  - **Error común:** Asumir que la notación funcional es distributiva y escribir $f(a + b) = f(a) + f(b)$.
  - **Cómo corregirlo:** $f(a + b)$ exige evaluar la suma $(a + b)$ completa dentro de la fórmula de la función.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La expresión $f(x)$ representa la multiplicación algebraica entre la variable $f$ y la variable $x$.'
  - 'En la notación $y = f(x)$, la letra $f$ indica un número constante fijo que multiplica a $x$.'
  - 'La notación $f(a + b)$ es siempre equivalente a la suma $f(a) + f(b)$ para cualquier función $f$.'
  - 'Evaluar la notación $f(3)$ en $f(x) = x^2$ consiste en multiplicar $3$ por el nombre de la función.'
  - 'La notación $f: A \to B$ indica que el conjunto $A$ es la imagen del conjunto $B$.'
afirmaciones_verdaderas:
  - 'La notación $f(x)$ lee "f de x" e indica que $f$ es el nombre de la regla de correspondencia y $x$ es la variable de entrada.'
  - 'El símbolo $f(a)$ representa la imagen específica producida por la función al ser evaluada en la preimagen $x = a$.'
al_terminar_debes_poder: |
  QUÉ: Interpretar y utilizar adecuadamente la notación funcional $f(x)$ en contextos matemáticos.
  CÓMO: Distinguir el nombre de la función de su argumento, reemplazar la variable de entrada por expresiones numéricas/algebraicas y simplificar el resultado.
