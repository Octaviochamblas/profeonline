semantic_id: MAT.ALG.FUNCION_CONCEPTOS.NOTACION_FUNCIONAL
resumen_inicial: La notación funcional $y = f(x)$ expresa la dependencia de la variable $y$ respecto a la entrada $x$ bajo la regla $f$.
explicacion_simple: '![La notación funcional $y = f(x)$ expresa la dependencia de la variable $y$ respecto a la entrada $x$ bajo la regla $f$](/static/img/nodos/interpretacion-de-la-notacion-funcional-intro.svg)



  La notación $f(x)$ se lee **«$f$ de $x$»** o **«la imagen de $x$ mediante $f$»**.


  Representa el número que se obtiene al sustituir $x$ en la fórmula de la función.


  Es fundamental tener claro que $f(x)$ **NO significa $f$ multiplicado por $x$**, sino la aplicación de la regla $f$ sobre el valor $x$.'
explicacion_formal: 'Dada una función $f: A \to B$, el símbolo $f(x)$ denota el único elemento de $B$ asignado al elemento $x \in A$.


  La igualdad $y = f(x)$ establece que el par ordenado $(x, y)$ pertenece al gráfico de la función:

  $$(x, y) \in \text{Graf}(f) \Longleftrightarrow y = f(x)$$


  **Elementos de la notación:**

  - $f$: Nombre asignado a la función o regla de transformación.

  - $x$: Argumento de entrada o variable independiente ($x \in \text{Dom}(f)$).

  - $f(x)$: Valor de salida o imagen resultante ($f(x) \in \text{Rec}(f)$).'
definiciones_clave: '- **Notación $f(x)$**: Expresión simbólica del valor que toma la función al evaluarse en la preimagen $x$.

  - **Evaluación funcional**: Proceso algebraico de sustituir $x$ por un valor numérico o literal específico en la regla de $f$.'
propiedades_relaciones: '- **Equivalencia gráfica**: En el plano cartesiano, el eje vertical $Y$ representa los valores de $f(x)$.

  - **Preimagen vs Imagen**: En $f(a) = b$, $a$ es la preimagen y $b$ es la imagen.'
ejemplo_guiado:
  enunciado: '![Ejemplo La notación funcional $y = f(x)$ expresa la dependencia de la variable $y$ respecto a la entrada $x$ bajo la regla $f$](/static/img/nodos/interpretacion-de-la-notacion-funcional-ejemplos.svg)



    Dada la función lineal $f(x) = 3x - 5$, calcula el valor de $f(4)$ y encuentra el valor de $x$ tal que $f(x) = 16$.'
  pasos:
  - 'Paso 1: Para calcular $f(4)$, sustituir $x = 4$ en la fórmula: $f(4) = 3(4) - 5 = 12 - 5 = 7$.'
  - 'Paso 2: Para resolver $f(x) = 16$, igualar la expresión a 16: $3x - 5 = 16$.'
  - 'Paso 3: Despejar $x$: $3x = 16 + 5 = 21 \implies x = 7$.'
  - 'Paso 4: Concluir que la imagen de $4$ es $7$, y la preimagen de $16$ es $7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué significado tiene la expresión $g(5) = 12$?
  choices:
  - text: Que al ingresar 5 en la función g, el resultado de salida es 12.
    is_correct: true
  - text: Que la variable g multiplicada por 5 es igual a 12.
    is_correct: false
  - text: Que la función g vale 5 cuando y es igual a 12.
    is_correct: false
  - text: Que 5 es la imagen y 12 es la preimagen.
    is_correct: false
  explanation: La alternativa correcta es 'Que al ingresar 5 en la función g, el resultado de salida es 12.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $f(x) = 2x + 3$, ¿cuál es el valor de $f(-2)$?
  choices:
  - text: '-1'
    is_correct: true
  - text: '7'
    is_correct: false
  - text: '-7'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La alternativa correcta es ''-1''. Al evaluar: $f(-2) = 2(-2) + 3 = -4 + 3 = -1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fórmula algebraica de la función $f(x)$.'
- 'Paso 2: Si se pide evaluar una imagen $f(k)$, reemplazar cada aparición de $x$ por $k$ y calcular.'
- 'Paso 3: Si se pide hallar una preimagen para $y_0$, plantear la ecuación $f(x) = y_0$ y despejar $x$.'
- 'Paso 4: Interpretar el resultado en el contexto del problema o gráfica.'
errores_correccion: '- **Error común:** Tratar la notación $f(x)$ como un producto algebraico $f \cdot x$.

  - **Cómo corregirlo:** Recordar que los paréntesis en $f(x)$ encierran el argumento de entrada de la función, no indican multiplicación.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación polinomial'
  enunciado: Si $f(x) = x^2 - 3x + 2$, ¿cuál es el valor de $f(3)$?
  alternativas:
  - '2'
  - '0'
  - '6'
  - '-2'
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: Sustituir $x = 3$ en la expresión: $f(3) = 3^2 - 3(3) + 2$.'
  - 'Paso 2: Calcular potencias y productos: $f(3) = 9 - 9 + 2 = 2$.'
- titulo: 'Ejemplo 2: Evaluación con argumento algebraico'
  enunciado: Si $f(x) = 5x + 1$, ¿a qué es igual $f(a + 2)$?
  alternativas:
  - 5a + 11
  - 5a + 3
  - 5a + 2
  - a + 11
  respuesta: 5a + 11
  solucion_pasos:
  - 'Paso 1: Reemplazar $x$ por $(a + 2)$ en la regla: $f(a + 2) = 5(a + 2) + 1$.'
  - 'Paso 2: Aplicar distributividad: $5a + 10 + 1 = 5a + 11$.'
- titulo: 'Ejemplo 3: Búsqueda de preimagen'
  enunciado: Dada $g(x) = 2x - 7$, ¿cuál es la preimagen de $11$?
  alternativas:
  - '9'
  - '15'
  - '2'
  - '-9'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: Plantear la ecuación $g(x) = 11 \implies 2x - 7 = 11$.'
  - 'Paso 2: Despejar $x$: $2x = 18 \implies x = 9$.'
- titulo: 'Ejemplo 4: Par ordenado en el gráfico'
  enunciado: Si el punto $(3, -4)$ pertenece al gráfico de $y = f(x)$, ¿cuál afirmación es correcta?
  alternativas:
  - f(3) = -4
  - f(-4) = 3
  - f(3) = 4
  - 3 = f(-4)
  respuesta: f(3) = -4
  solucion_pasos:
  - 'Paso 1: En todo par $(x, y)$, la segunda coordenada es la imagen de la primera: $y = f(x)$.'
  - 'Paso 2: Por lo tanto, $f(3) = -4$.'
errores_frecuentes:
- Despejar f dividiendo por x en expresiones como f(x) = 2x.
- Confundir f(x + 1) con f(x) + 1.
- Evaluar el valor en la variable equivocada al buscar preimágenes.
afirmaciones_verdaderas:
- La igualdad y = f(x) indica que y es el valor obtenido al aplicar la regla f a la entrada x.
- El símbolo f(x) representa una función evaluada en x y no un producto entre f y x.
al_terminar_debes_poder: '**QUÉ:** Interpretar y aplicar la notación funcional formal $y = f(x)$.


  **CÓMO:** Evaluando la función en valores numéricos o literales y despejando preimágenes a partir de ecuaciones funcionales.


  ![Resumen La notación funcional $y = f(x)$ expresa la dependencia de la variable $y$ respecto a la entrada $x$ bajo la regla $f$](/static/img/nodos/interpretacion-de-la-notacion-funcional-resumen.svg)'
