semantic_id: MAT.ALG.FUNCION_CONCEPTOS.NOTACION_FUNCIONAL
resumen_inicial: La notación funcional $y = f(x)$ nombra la regla $f$, la variable
  independiente $x$ y el valor de salida $f(x)$.
explicacion_simple: 'En matemáticas, escribimos $y = f(x)$ que se lee **''$y$ es igual
  a $f$ de $x$''**.

  - La letra $f$ es el nombre de la función (o regla).

  - El paréntesis $(x)$ encierra el número de entrada (preimagen).

  - El resultado completo $f(x)$ o $y$ es la salida calculada (imagen).'
explicacion_formal: 'En el formalismo de la **notación de Euler** $y = f(x)$:


  $$f: A \longrightarrow B, \quad x \longmapsto f(x)$$


  **Desglose de la fórmula:**

  - $f$: Nombre del mapeo funcional.

  - $x \in A$: Argumento de entrada o preimagen.

  - $f(x) \in B$: Valor resultante del mapeo asignado al argumento $x$.'
definiciones_clave: '- **Notación funcional ($y = f(x)$)**: Simbología estándar introducida
  por Leonhard Euler para denotar la dependencia entre variables.

  - **Argumento de la función**: Valor introducido dentro del paréntesis de la función
  $f(\cdot)$.'
propiedades_relaciones: '- **Equivalencia simbólica**: El símbolo $y$ y la expresión
  $f(x)$ representan exactamente el mismo valor numérico en el eje de las ordenadas.'
ejemplo_guiado:
  enunciado: Dada la función $g(x) = x^2 - 4$, interpreta la notación $g(3)$ y calcula
    su valor numérico.
  pasos:
  - 'Paso 1: Identificar la notación: $g(3)$ indica que la función $g$ se evalúa en
    el argumento $x = 3$.Paso 2: Reemplazar $x$ por $3$ en la fórmula: $g(3) = 3^2
    - 4$.Paso 3: Calcular el resultado: $g(3) = 9 - 4 = 5$.Paso 4: Concluir que para
    la entrada $3$, la salida $y = g(3)$ vale $5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa exactamente la expresión $f(a)$ en notación funcional?
  choices:
  - text: El valor de salida o imagen asignado a la preimagen $x = a$ por la función
      $f$.
    is_correct: true
  - text: La multiplicación de la letra $f$ por la variable $a$.
    is_correct: false
  - text: Una resta entre los términos $f$ y $a$.
    is_correct: false
  - text: La derivada de la función $f$.
    is_correct: false
  explanation: La alternativa correcta es 'El valor de salida o imagen asignado a
    la preimagen $x = a$ por la función $f$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar $g(x) = x^2 - 4$ en $x = 3$, ¿cuál es el valor numérico obtenido
    para $g(3)$?
  choices:
  - text: $g(3) = 5$
    is_correct: true
  - text: $g(3) = 2$
    is_correct: false
  - text: $g(3) = 13$
    is_correct: false
  - text: $g(3) = -1$
    is_correct: false
  explanation: La alternativa correcta es '$g(3) = 5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el nombre de la función (ejemplo: $f, g, h$).'
- 'Paso 2: Identificar el valor introducido entre paréntesis (el argumento).'
- 'Paso 3: Sustituir dicho argumento en la fórmula de la función.'
- 'Paso 4: Expresar el resultado final como $f(\text{argumento}) = \text{resultado}$.'
errores_correccion: '- **Error común:** Confundir $f(x)$ con una multiplicación algebraica
  de la variable $f$ por la variable $x$.

  - **Cómo corregirlo:** $f(x)$ NO es una multiplicación; los paréntesis indican que
  $x$ es la ENTRADA de la regla $f$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
estado: publicado
