semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_RAIZ
resumen_inicial: Para extraer la raíz de otra raíz, se conserva el radicando y se
  MULTIPLICAN los índices ($\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$).
explicacion_simple: 'Cuando tienes una raíz dentro de otra raíz, multiplicas sus números
  de índice para formar una sola raíz:

  $$\sqrt[2]{\sqrt[3]{64}} = \sqrt[2 \cdot 3]{64} = \sqrt[6]{64} = 2$$

  Comprobación: $\sqrt[3]{64} = 4$, y luego $\sqrt{4} = 2$. Da exacto.'
explicacion_formal: 'Para todo $a \ge 0$ y $m, n \in \mathbb{N}, m, n \ge 2$, se cumple:

  $$\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$$

  Esta propiedad equivale a la potencia de una potencia expresada en exponentes fraccionarios:
  $(a^{1/n})^{1/m} = a^{\frac{1}{m \cdot n}}$.'
definiciones_clave: '- **Multiplicación de índices**: Operación $m \cdot n$ ejecutada
  al anidar radicales.'
propiedades_relaciones: '- **Conmutatividad de índices**: $\sqrt[m]{\sqrt[n]{a}} =
  \sqrt[n]{\sqrt[m]{a}}$.'
ejemplo_guiado:
  enunciado: Simplifica la expresión $\sqrt{\sqrt[3]{729}}$.
  pasos:
  - 'Identificar los índices: el exterior es 2 (raíz cuadrada) y el interior es 3.'
  - 'Multiplicar los índices: $2 \cdot 3 = 6$.'
  - 'Escribir una sola raíz con índice 6: $\sqrt[6]{729}$.'
  - 'Calcular el resultado: $3$ (pues $3^6 = 729$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué expresión equivale $\sqrt[3]{\sqrt[4]{x}}$?
  choices:
  - text: \sqrt[12]{x}
    is_correct: true
  - text: \sqrt[7]{x}
    is_correct: false
  - text: \sqrt[4]{x^3}
    is_correct: false
  - text: 12x
    is_correct: false
  explanation: 'La correcta es: \sqrt[12]{x}. Se multiplicaron los índices: $3 \cdot
    4 = 12$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\sqrt{\sqrt{16}}$.
  choices:
  - text: '2'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '8'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La correcta es: 2. Índices $2 \cdot 2 = 4 \implies \sqrt[4]{16} =
    2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los índices de todas las raíces anidadas.'
- 'Paso 2: Multiplicar los valores de los índices.'
- 'Paso 3: Escribir una única raíz con el índice producto obtenido.'
- 'Paso 4: Simplificar el radical resultante.'
errores_correccion: No sumes los índices en raíz de una raíz. $\sqrt[3]{\sqrt[2]{a}}$
  NO es $\sqrt[5]{a}$, sino $\sqrt[6]{a}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $\sqrt{\sqrt{81}}$.
  alternativas:
  - '3'
  - '9'
  - '27'
  respuesta: '3'
  solucion_pasos:
  - $\sqrt[4]{81} = 3$.
errores_frecuentes:
- Sumar los índices en lugar de multiplicarlos.
afirmaciones_verdaderas:
- $\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$.
al_terminar_debes_ponder: Simplificar raíces anidadas multiplicando sus índices.
fuente: Texto escolar MINEDUC.
estado: publicado
