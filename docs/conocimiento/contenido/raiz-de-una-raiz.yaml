semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_RAIZ
resumen_inicial: 'La propiedad de raíz de una raíz simplifica radicales anidados multiplicando sus índices en una sola raíz: $\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$.'
explicacion_simple: |
  Cuando tienes una raíz adentro de otra raíz (como una raíz cuadrada dentro de una raíz cúbica), no necesitas resolverlas por capas. Puedes fundirlas en una sola raíz multiplicando los dos números pequeñitos de los índices. Por ejemplo, la raíz cúbica de la raíz cuadrada de 64 ($\sqrt[3]{\sqrt{64}}$) se convierte en una sola raíz de índice $3 \cdot 2 = 6$, obteniendo $\sqrt[6]{64} = 2$.
explicacion_formal: |
  ### Definición formal
  La **propiedad de raíz de una raíz** (o radicales anidados) establece que para todo $a \in \mathbb{R}$ y cualesquiera índices $m, n \in \mathbb{Z}^+ \setminus \{1\}$ (con $a \ge 0$ si $m \cdot n$ es par):
  $$\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$$

  ### Demostración mediante exponentes fraccionarios
  Aplicando la propiedad de potencia de una potencia sobre los exponentes fraccionarios:
  $$\sqrt[m]{\sqrt[n]{a}} = \left(a^{1/n}\right)^{1/m} = a^{\frac{1}{n} \cdot \frac{1}{m}} = a^{\frac{1}{m \cdot n}} = \sqrt[m \cdot n]{a}$$

  ### Síntesis didáctica
  - Operación sobre índices: Los índices se **multiplican** entre sí ($m \cdot n$).
  - Operación sobre el radicando: El número interno $a$ permanece **intacto**.
definiciones_clave: |
  - **Raíz de una raíz**: Expresión algebraica compuesta por dos o más radicales anidados uno dentro del otro.
  - **Nuevo índice compuesto $m \cdot n$**: Producto de los índices individualmente encadenados.
  - **Radicando invariable $a$**: Valor subradical que no sufre modificaciones durante la unificación de índices.
propiedades_relaciones: |
  - **Conmutatividad de índices**: El orden de los radicales anidados no altera el resultado final: $\sqrt[m]{\sqrt[n]{a}} = \sqrt[n]{\sqrt[m]{a}} = \sqrt[m \cdot n]{a}$.
  - **Descomposición de índices grandes**: Permite simplificar raíces de elevado índice (ej: $\sqrt[6]{x}$) separándolas en potencias menores ($\sqrt[3]{\sqrt{x}}$).
ejemplo_guiado:
  enunciado: 'Simplifica la expresión de raíces anidadas $R = \sqrt[3]{\sqrt{729}}$ y calcula su valor numérico final.'
  pasos:
    - 'Paso 1: Identificamos los índices de los radicales anidados: el exterior es $m = 3$ y el interior es el de la raíz cuadrada implícita $n = 2$.'
    - 'Paso 2: Multiplicamos los índices para obtener el nuevo índice compuesto: $3 \cdot 2 = 6$.'
    - 'Paso 3: Escribimos la expresión unificada con el nuevo índice: $R = \sqrt[6]{729}$.'
    - 'Paso 4: Calculamos la raíz de sexto grado buscando un número tal que $x^6 = 729$: $3^6 = 729 \implies R = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación matemática debe realizarse entre los índices de una expresión de raíz de una raíz $\sqrt[m]{\sqrt[n]{a}}$?'
    choices:
      - {text: 'Se multiplican los índices obteniendo un nuevo índice compuesto $m \cdot n$ ($\sqrt[m \cdot n]{a}$)', is_correct: true}
      - {text: 'Se suman los índices $m + n$', is_correct: false}
      - {text: 'Se restan los índices $m - n$', is_correct: false}
      - {text: 'Se dividen los índices $m / n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se multiplican los índices obteniendo un nuevo índice compuesto $m \cdot n$ ($\sqrt[m \cdot n]{a}$)''. Al aplicar potencia de una potencia sobre los exponentes fraccionarios, los índices se multiplican.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la expresión $\sqrt{\sqrt{81}}$?'
    choices:
      - {text: '$3$, ya que $\sqrt[2 \cdot 2]{81} = \sqrt[4]{81} = 3$', is_correct: true}
      - {text: '$9$, calculando sólo la primera raíz', is_correct: false}
      - {text: '$\sqrt{81}$, sin modificar la expresión', is_correct: false}
      - {text: '$81$, eliminando ambas raíces', is_correct: false}
    explanation: 'La alternativa correcta es ''$3$, ya que $\sqrt[2 \cdot 2]{81} = \sqrt[4]{81} = 3$''. Multiplicamos los índices cuadráticos $2 \cdot 2 = 4$ y calculamos $\sqrt[4]{81} = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los índices $m$ y $n$ de los radicales anidados.'
  - 'Paso 2: Multiplicar los índices entre sí ($m \cdot n$).'
  - 'Paso 3: Escribir un solo radical con el nuevo índice compuesto $m \cdot n$, conservando el radicando $a$.'
  - 'Paso 4: Extraer la raíz simplificada resultante si el radicando es una potencia exacta.'
errores_correccion: |
  - **Error 1:** Sumar los índices de las raíces anidadas en lugar de multiplicarlos (ej: escribir $\sqrt[3]{\sqrt{a}} = \sqrt[5]{a}$). **Cómo corregirlo:** La regla de exponentes exige **multiplicar** los índices: $3 \cdot 2 = 6 \implies \sqrt[6]{a}$.
  - **Error 2:** Elevar el radicando a la potencia de los índices (ej: $\sqrt[3]{\sqrt{a}} = \sqrt[6]{a^6}$). **Cómo corregirlo:** El radicando $a$ no cambia de potencia en esta propiedad; se mantiene en su estado original.
ejemplos:
  - titulo: 'Raíz cuadrada de raíz cuadrada'
    enunciado: '¿La expresión $\sqrt{\sqrt{16}}$ resulta en $2$?'
    alternativas:
      - 'Sí, pues $\sqrt[4]{16} = 2$'
      - 'No, resulta en 4'
      - 'No, resulta en 8'
    respuesta: 'Sí, pues $\sqrt[4]{16} = 2$'
    solucion_pasos:
      - '1. Multiplicamos índices: $2 \cdot 2 = 4$.'
      - '2. Calculamos $\sqrt[4]{16} = 2$.'
  - titulo: 'Raíz cúbica de raíz cuadrada'
    enunciado: '¿La expresión $\sqrt[3]{\sqrt{64}}$ simplifica a $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Índice compuesto: $3 \cdot 2 = 6 \implies \sqrt[6]{64} = 2$.'
  - titulo: 'Conmutatividad de índices'
    enunciado: '¿Es equivalente $\sqrt[3]{\sqrt[4]{x}}$ a $\sqrt[4]{\sqrt[3]{x}}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas resultan en la raíz doceava $\sqrt[12]{x}$ por conmutatividad del producto $3 \cdot 4 = 4 \cdot 3$.'
  - titulo: 'Invariabilidad del radicando'
    enunciado: '¿El radicando interno $a$ permanece inalterado al unificar la raíz de una raíz?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La unificación afecta únicamente a los índices $m$ y $n$.'
errores_frecuentes:
  - 'En la expresión de raíz de una raíz $\sqrt[m]{\sqrt[n]{a}}$, los índices se suman dando $\sqrt[m+n]{a}$.'
  - 'Al simplificar $\sqrt{\sqrt{x}}$, el resultado es la misma función $x$ sin raíz.'
  - 'La raíz cúbica de una raíz cuadrada da como índice resultante un 5.'
  - 'El orden en que se aplican dos raíces anidadas altera el resultado final.'
  - 'Al unificar raíces anidadas se debe elevar el radicando al cuadrado.'
afirmaciones_verdaderas:
  - 'La propiedad de raíz de una raíz unifica dos o más radicales anidados multiplicando sus índices: $\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$.'
  - 'Debido a la conmutatividad de la multiplicación, invertir el orden de los radicales anidados no altera el valor del resultado final.'
al_terminar_debes_poder: 'Simplificar expresiones de radicales anidados multiplicando sus índices para obtener una sola raíz equivalente.'
