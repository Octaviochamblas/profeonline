resumen_inicial: 'Una raíz dentro de otra raíz $\sqrt[m]{\sqrt[n]{a}}$ se simplifica
  multiplicando sus índices: $\sqrt[m \cdot n]{a}$.'
explicacion_simple: Cuando tenemos una raíz guardada dentro de otra raíz, multiplicamos
  los dos números pequeñitos de los índices para formar una sola raíz con un nuevo
  índice resultante de ese producto.
explicacion_formal: 'Para todo $a \ge 0$ e índices $m, n \in \mathbb{N}_{\ge 2}$,
  la **Raíz de una Raíz** satisface:


  $$\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$$


  **Demostración:**

  $$\sqrt[m]{\sqrt[n]{a}} = \left(a^{\frac{1}{n}}\right)^{\frac{1}{m}} = a^{\frac{1}{n
  \cdot m}} = \sqrt[m \cdot n]{a}$$


  > **Complemento didáctico:** Equivale a la propiedad de potencia de una potencia
  aplicada a exponentes fraccionarios.'
definiciones_clave: '- **Raíz de una raíz**: Regla $\sqrt[m]{\sqrt[n]{a}} = \sqrt[m
  \cdot n]{a}$ de multiplicación de índices.'
propiedades_relaciones: '- **Producto de índices**: Los índices $m$ y $n$ se multiplican
  para crear el nuevo índice $m \cdot n$.'
ejemplo_guiado:
  enunciado: Simplifique a una sola raíz la expresión $\sqrt{\sqrt[3]{64}}$.
  pasos:
  - 'Paso 1: Identificar los índices: la raíz exterior es cuadrada ($m=2$) y la interior
    es cúbica ($n=3$).'
  - 'Paso 2: Multiplicar los índices: $2 \cdot 3 = 6$.'
  - 'Paso 3: Escribir la nueva raíz de índice $6$: $\sqrt[6]{64}$.'
  - 'Conclusión: Como $2^6 = 64 \implies \sqrt[6]{64} = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación se realiza entre los índices m y n al resolver una raíz
    de una raíz sqrt[m]{sqrt[n]{a}}?
  choices:
  - text: Se multiplican los índices obteniendo un nuevo índice m · n (sqrt[m · n]{a})
    is_correct: true
  - text: Se suman los índices
    is_correct: false
  - text: Se restan las raíces
    is_correct: false
  - text: Se eleva a al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Se multiplican los índices obteniendo un
    nuevo índice m · n (sqrt[m · n]{a})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt{sqrt[3]{64}}, ¿cuál fue el resultado final?
  choices:
  - text: 2 (porque sqrt[6]{64} = 2)
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '2 (porque sqrt[6]{64} = 2)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar raíces anidadas $\sqrt[m]{\sqrt[n]{a}}
  = \sqrt[m \cdot n]{a}$, multiplicando adecuadamente sus índices.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_RAIZ
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_RAIZ.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
