errores_frecuentes:
- Sumar los índices en lugar de multiplicarlos.
- Multiplicar el índice por el radicando.
- Olvidar que el radical sin número tiene índice 2.
- Omitir el ingreso de factores situados entre raíces anidadas.
- Confundir raíz de una raíz con producto de raíces.
afirmaciones_verdaderas:
- La raíz de una raíz tiene por índice el producto de los índices originales.
- El orden de los radicales anidados es conmutativo ($\sqrt[m]{\sqrt[n]{a}} = \sqrt[n]{\sqrt[m]{a}}$).
- La composición de $k$ raíces cuadradas sucesivas genera una raíz de índice $2^k$.
al_terminar_debes_poder: '![Síntesis de raíz de una raíz](/static/img/nodos/raiz-de-una-raiz-resumen.svg)


  QUÉ: Reducir y calcular raíces de raíces anidadas en un solo radical.


  CÓMO: Multiplicando algebraicamente los índices radicales $\sqrt[m \cdot n]{a}$, gestionando previamente los factores intermedios si existen y calculando el valor resultante.'
