semantic_id: MAT.NUM.RAICES_PROPIEDADES.RAIZ_DE_RAIZ
resumen_inicial: 'La raíz de una raíz es igual a una única raíz cuyo índice es el producto de los índices originales y cuyo radicando es el mismo: $\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$.'
explicacion_simple: '![Raíz de una raíz](/static/img/nodos/raiz-de-una-raiz-intro.svg)


  Cuando tienes una raíz adentro de otra raíz (como $\sqrt{\sqrt{81}}$), la regla es muy sencilla: **multiplicas los números de los ganchos (los índices)** y dejas el número de adentro igual.

  - Como la raíz cuadrada tiene índice $2$, entonces $\sqrt{\sqrt{81}} = \sqrt[2 \cdot 2]{81} = \sqrt[4]{81} = 3$.

  - De forma similar: $\sqrt[3]{\sqrt{64}} = \sqrt[3 \cdot 2]{64} = \sqrt[6]{64} = 2$.

  - **¡Cuidado!** Los índices se **multiplican**, ¡nunca se suman!'
explicacion_formal: 'Sean $a \in \mathbb{R}^+$ y $m, n \in \mathbb{N}$ con $m, n \ge 2$. La **Propiedad de Composición Radical** establece:


  $$\sqrt[m]{\sqrt[n]{a}} = \sqrt[m \cdot n]{a}$$


  **Demostración analítica:**

  Por la ley de potencia de una potencia sobre exponentes racionales:

  $$\sqrt[m]{\sqrt[n]{a}} = \left(a^{1/n}\right)^{1/m} = a^{\frac{1}{n} \cdot \frac{1}{m}} = a^{\frac{1}{m \cdot n}} = \sqrt[m \cdot n]{a}$$


  **Composición múltiple:**

  $$\sqrt[p]{\sqrt[q]{\sqrt[r]{a}}} = \sqrt[p \cdot q \cdot r]{a} \quad (\forall p, q, r \in \mathbb{N}_{\ge 2})$$'
definiciones_clave: '- **Composición radical**: Anidamiento sucesivo de operadores de radicación.

  - **Índice compuesto**: Producto resultante $m \cdot n$ de los órdenes de las raíces.

  - **Factor intermedio**: Elemento escalar ubicado entre dos radicales consecutivos.'
propiedades_relaciones: '- **Conmutatividad de índices**: $\sqrt[m]{\sqrt[n]{a}} = \sqrt[n]{\sqrt[m]{a}} = \sqrt[m \cdot n]{a}$.

  - **Tratamiento de factores intermedios**: $\sqrt{k \sqrt{a}} = \sqrt{\sqrt{k^2 \cdot a}} = \sqrt[4]{k^2 a}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de raíz de una raíz](/static/img/nodos/raiz-de-una-raiz-ejemplos.svg)


    Calcule y simplifique las expresiones $\sqrt{\sqrt{81}}$, $\sqrt[3]{\sqrt{64}}$ y $\sqrt[4]{\sqrt[3]{x}}$.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt{\sqrt{81}}$: Índices $2$ y $2$. Multiplicar índices: $2 \cdot 2 = 4 \implies \sqrt[4]{81} = 3$.'
  - 'Paso 2: Evaluar $\sqrt[3]{\sqrt{64}}$: Índices $3$ y $2$. Multiplicar índices: $3 \cdot 2 = 6 \implies \sqrt[6]{64} = 2$.'
  - 'Paso 3: Evaluar $\sqrt[4]{\sqrt[3]{x}}$: Índices $4$ y $3$. Multiplicar índices: $4 \cdot 3 = 12 \implies \sqrt[12]{x} = x^{1/12}$.'
  - 'Conclusión: Los resultados son $3$, $2$ y $\sqrt[12]{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión simplificada de $\sqrt{\sqrt{\sqrt{x}}}$?
  choices:
  - text: $\sqrt[8]{x}$ (porque $2 \cdot 2 \cdot 2 = 8$)
    is_correct: true
  - text: $\sqrt[6]{x}$ (porque $2 + 2 + 2 = 6$)
    is_correct: false
  - text: $\sqrt[3]{x}$
    is_correct: false
  - text: $x^8$
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt[8]{x}$ (porque $2 \cdot 2 \cdot 2 = 8$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\sqrt[3]{\sqrt{64}} = 2$?
  choices:
  - text: Porque $3 \cdot 2 = 6$ y $2^6 = 64$, dando $\sqrt[6]{64} = 2$
    is_correct: true
  - text: Porque se suma $3 + 2 = 5$
    is_correct: false
  - text: 'Porque $64 : 6 = 2$'
    is_correct: false
  - text: Porque $\sqrt{64} = 8$ y $\sqrt[3]{8} = 2$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $3 \cdot 2 = 6$ y $2^6 = 64$, dando $\sqrt[6]{64} = 2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar todos los índices anidados ($m, n, \dots$).'
- 'Paso 2: Si hay factores intermedios, introducirlos al radical interior correspondiente.'
- 'Paso 3: Multiplicar los índices radicales para formar una sola raíz $\sqrt[m \cdot n]{a}$ y simplificar.'
errores_correccion: '- **Error 1: Sumar los índices en lugar de multiplicarlos ($\sqrt{\sqrt{x}} = \sqrt[4]{x}$, no $\sqrt[4]{x}$).** **Cómo corregirlo:** Por leyes de potencias se multiplican: $2 \cdot 2 = 4$.

  - **Error 2: Ignorar factores intermedios ($\sqrt{2\sqrt{2}} = \sqrt[4]{2}$).** **Cómo corregirlo:** Ingresar primero el factor: $\sqrt{\sqrt{2^2 \cdot 2}} = \sqrt[4]{8}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué es igual $\sqrt{\sqrt{16}}$?
  alternativas:
  - $2$
  - $4$
  - $\sqrt[4]{4}$
  respuesta: $2$
  solucion_pasos:
  - $\sqrt[2 \cdot 2]{16} = \sqrt[4]{16} = 2$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el índice resultante en $\sqrt[3]{\sqrt[5]{a}}$?
  alternativas:
  - $15$
  - $8$
  - $125$
  respuesta: $15$
  solucion_pasos:
  - $3 \cdot 5 = 15 \implies \sqrt[15]{a}$.
