procedimiento:
- 'Paso 1: Dibujar el rectángulo universal $\mathcal{U}$ y trazar tres círculos secantes rotulados $A, B, C$.'
- 'Paso 2: Colocar en primer lugar el dato de la triple intersección central $|A \cap B \cap C|$.'
- 'Paso 3: Calcular las intersecciones dobles exclusivas restando la triple intersección a cada dato de intersección de pares.'
- 'Paso 4: Calcular las regiones individuales exclusivas (solo $A$, solo $B$, solo $C$) restando las tres zonas adyacentes al total de cada conjunto.'
- 'Paso 5: Sumar las 7 áreas internas para hallar la unión $|A \cup B \cup C|$ y restar de $|\mathcal{U}|$ para obtener la región exterior.'
errores_correccion: '- **Error 1:** Colocar el dato de una intersección doble (ej. $A \cap B$) directamente en la zona doble sin restar la triple intersección. **Cómo corregirlo:** La región doble exclusiva es $(A \cap B) \setminus C = |A \cap B| - |A \cap B \cap C|$; de lo contrario la zona central se contabiliza dos veces.

  - **Error 2:** Restar la triple intersección en la fórmula de inclusión-exclusión final. **Cómo corregirlo:** En la fórmula de Poincaré para 3 conjuntos, la triple intersección se suma al final para compensar que fue restada tres veces en los pares: $+ |A \cap B \cap C|$.

  '
ejemplos:
- titulo: Cálculo de triple intersección
  enunciado: Si $|A|=20, |B|=20, |C|=20$, todas las dobles valen 8, $|A \cup B \cup C|=44$, ¿cuánto vale $|A \cap B \cap C|$?
  alternativas:
  - $8$
  - $5$
  - $2$
  respuesta: $8$
  solucion_pasos:
  - 1. $44 = (20+20+20) - (8+8+8) + x \implies 44 = 60 - 24 + x \implies 44 = 36 + x \implies x = 8$.
- titulo: Exactamente dos materias
  enunciado: En el ejemplo guiado, ¿cuántos alumnos estudian exactamente dos materias?
  respuesta: $22$ estudiantes ($10 + 7 + 5$)
  solucion_pasos:
  - 'Se suman las tres regiones dobles exclusivas: $10 + 7 + 5 = 22$.'
  alternativas:
  - $22$ estudiantes ($10 + 7 + 5$)
  - $27$ estudiantes
  - $15$ estudiantes
  - $12$ estudiantes
- titulo: Exactamente una materia
  enunciado: En el ejemplo guiado, ¿cuántos alumnos estudian exactamente una materia?
  respuesta: $46$ estudiantes ($18 + 15 + 13$)
  solucion_pasos:
  - 'Se suman las tres regiones individuales exclusivas: $18 + 15 + 13 = 46$.'
  alternativas:
  - $46$ estudiantes ($18 + 15 + 13$)
  - $40$ estudiantes
  - $50$ estudiantes
  - $35$ estudiantes
- titulo: Número total de regiones
  enunciado: ¿Cuántas regiones interiores tiene la unión de tres conjuntos en el diagrama?
  respuesta: $7$ regiones internas
  solucion_pasos:
  - La unión particiona el interior en $8 - 1 = 7$ regiones.
  alternativas:
  - $7$ regiones internas
  - $8$ regiones internas
  - $6$ regiones internas
  - $3$ regiones internas
errores_frecuentes:
- La afirmación de que el diagrama de tres conjuntos secantes genera solo seis regiones en el plano.
- La afirmación de que en la fórmula de inclusión-exclusión de tres conjuntos la triple intersección se resta al final.
- La afirmación de que el dato de $A \cap B$ corresponde exclusivamente a la zona donde no interviene $C$.
- La afirmación de que para calcular "solo A" basta deducir una única intersección doble.
- La afirmación de que la región exterior a los tres conjuntos siempre contiene cero elementos.
afirmaciones_verdaderas:
- El diagrama de Venn estándar de tres conjuntos particiona al conjunto universal $\mathcal{U}$ en exactamente $8$ regiones disjuntas ($2^3$).
- 'La fórmula de inclusión-exclusión para tres conjuntos compensa la sobre-resta sumando la triple intersección: $|A \cup B \cup C| = \sum |A_i| - \sum |A_i \cap A_j| + |A \cap B \cap C|$.'
