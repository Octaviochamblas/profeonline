semantic_id: MAT.NUM.IMAGINARIOS.I_CUADRADO
resumen_inicial: 'La propiedad fundamental de la unidad imaginaria establece que $i^2 = -1$, sirviendo de puente algebraico para regresar del plano imaginario al conjunto de los números reales.'
explicacion_simple: |
  La regla más importante cuando trabajas con números imaginarios es que **$i^2$ siempre se convierte en el número real $-1$**. Cuando multiplicas dos números imaginarios puros (como $3i \cdot 4i = 12i^2$), el término $i^2$ desaparece y cambia el signo del número a negativo: $12(-1) = -12$. Esta propiedad es la clave que permite multiplicar y simplificar expresiones complejas.
explicacion_formal: |
  ### Definición formal
  La **propiedad cuadrática de la unidad imaginaria** es la identidad operacional algebraica que define el comportamiento del cuadrado de $i$:
  $$i^2 = (\sqrt{-1})^2 = -1$$

  ### Consecuencia en la multiplicación de imaginarios puros
  Dado cualesquiera dos números reales $a, b \in \mathbb{R}$:
  $$(a \cdot i) \cdot (b \cdot i) = (a \cdot b) \cdot i^2 = (a \cdot b) \cdot (-1) = -(a \cdot b)$$

  ### Regla de cambio de signo
  En cualquier simplificación algebraica dentro del cuerpo de los números complejos $\mathbb{C}$, la presencia del factor $i^2$ se sustituye por $-1$, invirtiendo el signo del término numérico acompañante:
  $$k \cdot i^2 \equiv -k \quad (k \in \mathbb{R})$$

  ### Síntesis didáctica
  - Retorno al conjunto $\mathbb{R}$: La elevación al cuadrado de la unidad imaginaria $i \notin \mathbb{R}$ produce el número entero real $-1 \in \mathbb{R}$.
definiciones_clave: |
  - **Identidad $i^2 = -1$**: Relación algebraica fundamental que define a la unidad imaginaria.
  - **Puente a los reales**: Transición operacional que transforma la multiplicación de imaginarios en un número real negativo.
  - **Inversión de signo de coeficientes**: Efecto multiplicativo por $-1$ producido al simplificar $i^2$.
propiedades_relaciones: |
  - **Operaciones de binomios complejos**: Permite multiplicar números complejos $(a + bi)(c + di) = (ac - bd) + (ad + bc)i$ sustituyendo $i^2 = -1$.
  - **Resolución de ecuaciones**: Justifica por qué el cuadrado de la raíz $(\sqrt{-1})^2 = -1$.
ejemplo_guiado:
  enunciado: 'Calcula el producto de los números imaginarios puros $Z = (5i) \cdot (-3i)$ reduciendo el resultado a su valor numérico real.'
  pasos:
    - 'Paso 1: Multiplicamos los coeficientes numéricos reales entre sí y las unidades imaginarias entre sí: $Z = (5 \cdot (-3)) \cdot (i \cdot i)$.'
    - 'Paso 2: Realizamos la multiplicación de coeficientes reales: $5 \cdot (-3) = -15$.'
    - 'Paso 3: Unificamos las unidades imaginarias como una potencia cuadrática: $i \cdot i = i^2 \implies Z = -15 \cdot i^2$.'
    - 'Paso 4: Aplicamos la propiedad fundamental $i^2 = -1$ y resolvemos el producto final: $Z = -15 \cdot (-1) = 15$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué valor numérico del conjunto de los números reales equivale la potencia cuadrática de la unidad imaginaria $i^2$?'
    choices:
      - {text: '$-1$, invirtiendo el signo del coeficiente que la acompaña', is_correct: true}
      - {text: '$1$, anulando el signo negativo', is_correct: false}
      - {text: '$i$, conservando la unidad imaginaria', is_correct: false}
      - {text: '$0$, anulando el término', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$, invirtiendo el signo del coeficiente que la acompaña''. La propiedad fundamental establece $i^2 = -1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la multiplicación $(4i) \cdot (2i)$?'
    choices:
      - {text: '$-8$, pues $8i^2 = 8(-1) = -8$', is_correct: true}
      - {text: '$8$, de forma positiva', is_correct: false}
      - {text: '$8i$, olvidando el cuadrado', is_correct: false}
      - {text: '$-8i$, agregando la letra i', is_correct: false}
    explanation: 'La alternativa correcta es ''$-8$, pues $8i^2 = 8(-1) = -8$''. Multiplicamos $4 \cdot 2 = 8$ y $i \cdot i = i^2 = -1 \implies -8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las apariciones del factor $i^2$ en la expresión reducida.'
  - 'Paso 2: Reemplazar directamente cada término $i^2$ por el número entre paréntesis $(-1)$.'
  - 'Paso 3: Multiplicar $(-1)$ por el coeficiente constante adjunto.'
  - 'Paso 4: Invertir el signo del término para obtener la parte real resultante.'
errores_correccion: |
  - **Error 1:** Afirmar que $i^2 = 1$ al creer que elevar al cuadrado siempre elimina el signo negativo (ej: resolver $3i^2 = 3(1) = 3$). **Cómo corregirlo:** La propiedad axiomática define que $i^2$ es **estrictamente $-1$**, por lo que $3i^2 = 3(-1) = -3$.
  - **Error 2:** Conservar la letra $i$ tras elevarla al cuadrado (ej: escribir $(2i)^2 = 4i$). **Cómo corregirlo:** Al elevar la unidad imaginaria al cuadrado, la letra $i$ **desaparece por completo** transformándose en el real $-1$: $(2i)^2 = 4i^2 = 4(-1) = -4$.
ejemplos:
  - titulo: 'Cuadrado de imaginario puro'
    enunciado: '¿El resultado de calcular $(6i)^2$ es igual a $-36$?'
    alternativas:
      - 'Sí, pues $36 i^2 = 36(-1) = -36$'
      - 'No, es igual a 36'
      - 'No, es igual a 36i'
    respuesta: 'Sí, pues $36 i^2 = 36(-1) = -36$'
    solucion_pasos:
      - '1. Elevamos al cuadrado ambos factores: $6^2 \cdot i^2 = 36 i^2$.'
      - '2. Sustituimos $i^2 = -1 \implies 36(-1) = -36$.'
  - titulo: 'Producto de raíces de enteros negativos'
    enunciado: '¿El producto $\sqrt{-4} \cdot \sqrt{-9}$ equivale al entero real $-6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(2i) \cdot (3i) = 6i^2 = 6(-1) = -6$.'
  - titulo: 'Suma de un real con término $i^2$'
    enunciado: '¿La expresión $10 + 4i^2$ resulta en $6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10 + 4(-1) = 10 - 4 = 6$.'
  - titulo: 'Desaparición del carácter imaginario'
    enunciado: '¿El cuadrado de cualquier número imaginario puro resulta ser siempre un número real negativo o cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(bi)^2 = b^2 i^2 = -b^2 \le 0$, que es un número real negativo o cero.'
errores_frecuentes:
  - 'Elevar al cuadrado la unidad imaginaria da como resultado el número real positivo 1.'
  - 'Mantener la unidad imaginaria $i$ acompañando al número real tras aplicar $i^2$.'
  - 'Resolver $i^2 = -i$ confundiendo el signo negativo con la letra i.'
  - 'Multiplicar coeficientes imaginarios dejando la expresión expresada como un número imaginario puro.'
  - 'El cuadrado de un número imaginario puro resulta en otro número imaginario con el signo invertido.'
afirmaciones_verdaderas:
  - 'La propiedad fundamental de la unidad imaginaria establece que $i^2 = -1$.'
  - 'El cuadrado de todo número imaginario puro $bi$ (con $b \in \mathbb{R}, b \neq 0$) es un número real estrictamente negativo $-b^2 < 0$.'
al_terminar_debes_poder: 'Simplificar expresiones algebraicas complejas sustituyendo la identidad $i^2 = -1$ para realizar el cambio de signo.'
