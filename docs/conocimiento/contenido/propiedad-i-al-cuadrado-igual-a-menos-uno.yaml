semantic_id: MAT.NUM.IMAGINARIOS.I_CUADRADO
resumen_inicial: La propiedad fundamental $i^2 = -1$ establece que el producto de la unidad imaginaria por sí misma produce el número real negativo $-1$, permitiendo simplificar multiplicaciones algebraicas complejas.
explicacion_simple: '![Propiedad i al cuadrado igual a menos uno](/static/img/nodos/propiedad-i-al-cuadrado-igual-a-menos-uno-intro.svg)


  La regla de oro de los números imaginarios es:

  - **Siempre que veas $i^2$, reemplázalo inmediatamente por $-1$**.

  - Cuando elevas un monomio imaginario como $(4i)^2$, elevas ambos factores: $4^2 \cdot i^2 = 16 \cdot (-1) = -16$.

  - Cuando multiplicas dos números imaginarios como $(3i) \cdot (-5i)$, multiplicas los coeficientes y las $i$: $-15 \cdot i^2 = -15 \cdot (-1) = 15$.'
explicacion_formal: 'En la estructura de anillo de los polinomios con coeficientes reales $\mathbb{R}[x]$ módulo el ideal generado por $x^2 + 1$, el elemento $i = [x]$ satisface por definición la igualdad:


  $$i^2 = -1$$


  **Consecuencia en la Multiplicación de Imaginarios Puros:**

  Para todo $b_1, b_2 \in \mathbb{R}$:

  $$(b_1 i) \cdot (b_2 i) = (b_1 b_2) \cdot i^2 = (b_1 b_2) \cdot (-1) = -(b_1 b_2) \in \mathbb{R}$$


  El producto de dos números imaginarios puros es siempre un **número real**.'
definiciones_clave: '- **Axioma $i^2 = -1$**: Sustitución elemental que convierte potencias cuadráticas imaginarias en reales.

  - **Cuadrado de un imaginario puro**: Identidad $(bi)^2 = -b^2$.

  - **Cierre multiplicativo real**: Propiedad donde $\mathbb{I} \times \mathbb{I} \to \mathbb{R}$.'
propiedades_relaciones: '- **Signo negativo garantizado**: Para todo $b \in \mathbb{R} \setminus \{0\}$, $(bi)^2 < 0$.

  - **Potencia par**: Toda potencia par de la forma $i^{2k} = (i^2)^k = (-1)^k$ es un número real ($\pm 1$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de i al cuadrado](/static/img/nodos/propiedad-i-al-cuadrado-igual-a-menos-uno-ejemplos.svg)


    Calcule el valor de $(4i)^2$ y simplifique el producto $(3i) \cdot (-5i)$.'
  pasos:
  - 'Paso 1: Para $(4i)^2$: Distribuir el exponente: $4^2 \cdot i^2 = 16 \cdot i^2$.'
  - 'Paso 2: Reemplazar $i^2 = -1$: $16 \cdot (-1) = -16$.'
  - 'Paso 3: Para $(3i) \cdot (-5i)$: Multiplicar factores: $(3 \cdot -5) \cdot (i \cdot i) = -15 \cdot i^2$.'
  - 'Paso 4: Aplicar $i^2 = -1$: $-15 \cdot (-1) = 15$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor resultante al calcular $(7i)^2$?
  choices:
  - text: $-49$ (porque $7^2 \cdot i^2 = 49 \cdot (-1) = -49$)
    is_correct: true
  - text: $49$
    is_correct: false
  - text: $-7$
    is_correct: false
  - text: $49i$
    is_correct: false
  explanation: La alternativa correcta es '$-49$ (porque $7^2 \cdot i^2 = 49 \cdot (-1) = -49$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(3i) \cdot (-5i) = 15$ es un número positivo?
  choices:
  - text: Porque $(-15) \cdot i^2 = (-15) \cdot (-1) = 15$
    is_correct: true
  - text: Porque $3 \times 5 = 15$ y se eliminan las $i$
    is_correct: false
  - text: Porque los números imaginarios siempre dan positivo
    is_correct: false
  - text: Porque $i^2 = 1$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $(-15) \cdot i^2 = (-15) \cdot (-1) = 15$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desarrollar las multiplicaciones y potencias algebraicas agrupando los factores reales y las unidades $i$.'
- 'Paso 2: Reunir los términos con $i \cdot i = i^2$.'
- 'Paso 3: Sustituir cada aparición de $i^2$ por $-1$ y simplificar el signo de la expresión resultante.'
errores_correccion: '- **Error 1: No elevar el coeficiente numérico al cuadrado ($(3i)^2 = 3i^2 = -3$).** **Cómo corregirlo:** El exponente afecta a ambos términos: $(3i)^2 = 3^2 \cdot i^2 = 9(-1) = -9$.

  - **Error 2: Pensar que $(-i)^2 = 1$.** **Cómo corregirlo:** $(-i)^2 = (-1)^2 \cdot i^2 = 1 \cdot (-1) = -1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor simplificado de $(-6i)^2$?
  alternativas:
  - $-36$
  - $36$
  - $36i$
  respuesta: $-36$
  solucion_pasos:
  - $(-6)^2 \cdot i^2 = 36 \cdot (-1) = -36$.
- titulo: Ejemplo 2
  enunciado: ¿A qué número real equivale $(2i) \cdot (8i)$?
  alternativas:
  - $-16$
  - $16$
  - $-16i$
  respuesta: $-16$
  solucion_pasos:
  - $16 \cdot i^2 = 16 \cdot (-1) = -16$.
- titulo: ¿Es (√5 · i)² = -5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\sqrt{5})^2 \cdot i^2 = 5 \cdot (-1) = -5$.
  alternativas:
  - texto: Sí, (√5)² · i² = -5
    es_correcta: true
    retroalimentacion: ¡Correcto! Cuadrado del radical por $i^2$.
  - texto: No, es 5
    es_correcta: false
    retroalimentacion: Incorrecto, falta el factor $i^2 = -1$.
  - texto: No, es -25
    es_correcta: false
    retroalimentacion: Incorrecto, $(\sqrt{5})^2 = 5$.
- titulo: ¿Es el producto de dos números imaginarios puros siempre un número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(ai)(bi) = ab \cdot i^2 = -ab \in \mathbb{R}$.
  alternativas:
  - texto: Sí, siempre es un número real
    es_correcta: true
    retroalimentacion: ¡Correcto! Cierre en los números reales.
  - texto: No, siempre da un número imaginario
    es_correcta: false
    retroalimentacion: Incorrecto, $i^2 = -1$ elimina la parte imaginaria.
  - texto: No, depende del valor de los coeficientes
    es_correcta: false
    retroalimentacion: Incorrecto, para todo real da un número real.
errores_frecuentes:
- Olvidar que $i^2 = -1$ y dejar expresiones con $i^2$ sin simplificar.
- Asumir erróneamente que $i^2 = 1$.
- Elevar solo la $i$ y no el coeficiente numérico.
- Creer que $(-i)^2$ da un resultado positivo.
afirmaciones_verdaderas:
- La igualdad $i^2 = -1$ es la propiedad central que permite operar con números imaginarios.
- El cuadrado de cualquier número imaginario puro no nulo es estrictamente negativo.
- El producto de dos números imaginarios puros produce siempre un número real.
al_terminar_debes_poder: '![Síntesis de propiedad i al cuadrado](/static/img/nodos/propiedad-i-al-cuadrado-igual-a-menos-uno-resumen.svg)


  QUÉ: Aplicar sistemáticamente la sustitución $i^2 = -1$ en operaciones algebraicas.


  CÓMO: Desarrollando potencias y productos de monomios imaginarios $(bi)^2 = -b^2$ y reemplazando cada $i^2$ por $-1$ para simplificar a valores reales.'
