semantic_id: MAT.NUM.IMAGINARIOS.I_CUADRADO
resumen_inicial: La identidad $i^2 = -1$ es la propiedad estructural básica de los números
  imaginarios que permite simplificar productos y potencias de $i$.
explicacion_simple: 'Cada vez que en un cálculo algebraico te aparezca $i^2$, debes **reemplazarlo
  inmediatamente por $-1$**:

  - $(3i) \cdot (2i) = 6 i^2 = 6 \cdot (-1) = -6$.

  Esto transforma productos de números imaginarios puros en números reales negativos.'
explicacion_formal: La relación $i^2 = -1$ define el álgebra del cuerpo de los números complejos
  $\mathbb{C}$, garantizando que el producto de dos imaginarios puros resulte en un escalar
  real no positivo.
definiciones_clave: '- **Sustitución $i^2 = -1$**: Regla de reducción algebraica obligatoria
  en $\mathbb{C}$.'
propiedades_relaciones: '- **Producto de imaginarios puros**: $(ai) \cdot (bi) = -ab \in \mathbb{R}$.'
ejemplo_guiado:
  enunciado: Calcula el producto $(4i) \cdot (-5i)$.
  pasos:
  - 'Multiplicar los coeficientes reales: $4 \cdot (-5) = -20$.'
  - 'Multiplicar las unidades imaginarias: $i \cdot i = i^2$.'
  - Obtener el término $-20 i^2$.
  - 'Reemplazar $i^2$ por $-1$: $-20 \cdot (-1) = +20$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la multiplicación $(2i) \cdot (3i)$?
  choices:
  - text: '-6'
    is_correct: true
  - text: '6'
    is_correct: false
  - text: 6i
    is_correct: false
  - text: -6i
    is_correct: false
  explanation: 'La correcta es: -6. $2 \cdot 3 \cdot i^2 = 6 \cdot (-1) = -6$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $(-i)^2$.
  choices:
  - text: '-1'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: i
    is_correct: false
  - text: -i
    is_correct: false
  explanation: 'La correcta es: -1. $(-i)^2 = (-1)^2 \cdot i^2 = 1 \cdot (-1) = -1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Efectuar la multiplicación algebraica agrupando coeficientes y factores $i$.'
- 'Paso 2: Identificar las potencias $i^2$.'
- 'Paso 3: Sustituir cada $i^2$ por $-1$ y multiplicar.'
errores_correccion: No conserves $i^2$ en la respuesta final. Toda expresión simplificada
  debe reemplazar $i^2$ por $-1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(5i)^2$.
  alternativas:
  - '-25'
  - '25'
  - 25i
  respuesta: '-25'
  solucion_pasos:
  - $25 i^2 = 25(-1) = -25$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de (3i)·(4i)?
  alternativas:
  - '-12'
  - '12'
  - 12i
  respuesta: '-12'
  solucion_pasos:
  - 3·4·i al cuadrado = 12·(-1) = -12.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de (-2i)·(6i)?
  alternativas:
  - '12'
  - '-12'
  - 12i
  respuesta: '12'
  solucion_pasos:
  - -2·6·i al cuadrado = -12·(-1) = 12.
- titulo: ¿Es correcto que (7i) al cuadrado es igual a 49?
  respuesta: 'No'
  solucion_pasos:
  - (7i) al cuadrado es 49·i al cuadrado = 49·(-1) = -49, no 49.
errores_frecuentes:
- Olvidar cambiar el signo del coeficiente al sustituir $i^2$.
- Dejar i al cuadrado sin sustituir en el resultado final.
- Confundir el signo al sustituir i al cuadrado por -1, dejando el resultado positivo cuando
  debería ser negativo.
- Multiplicar los coeficientes y olvidar aplicar la sustitución de i al cuadrado.
- Pensar que i al cuadrado es igual a 1 en vez de -1.
afirmaciones_verdaderas:
- $i^2 = -1$.
- Toda vez que aparece i al cuadrado en un cálculo algebraico, debe sustituirse inmediatamente
  por -1 antes de continuar simplificando.
al_terminar_debes_poder: Simplificar multiplicaciones de números imaginarios utilizando $i^2
  = -1$.
fuente: Texto escolar MINEDUC.
estado: publicado
