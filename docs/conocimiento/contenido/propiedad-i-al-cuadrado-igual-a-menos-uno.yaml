resumen_inicial: La propiedad fundamental $i^2 = -1$ establece que el cuadrado de
  la unidad imaginaria es el entero negativo $-1$, permitiendo regresar al conjunto
  real.
explicacion_simple: Aunque la unidad imaginaria $i$ no pertenece a los números reales,
  al multiplicarse por sí misma ($i \cdot i$) produce el número real negativo $-1$.
  Esta regla permite simplificar productos imaginarios de vuelta a números reales
  comunes.
explicacion_formal: 'La **Propiedad del Cuadrado Imaginario** se expresa axiomáticamente
  como:


  $$i^2 = -1$$


  **Consecuencias operativas:**

  - Multiplicación de dos imaginarios puros: $(ai) \cdot (bi) = (a \cdot b) \cdot
  i^2 = -ab \in \mathbb{R}$.

  - Eliminación del símbolo $i$: Transforma potencias pares de $i$ en coeficientes
  reales con cambio de signo.


  > **Complemento didáctico:** Esta identidad puentea el mundo imaginario $\mathbb{I}$
  con el conjunto de los números reales $\mathbb{R}$.'
definiciones_clave: '- **Propiedad $i^2 = -1$**: Igualdad que convierte el producto
  de unidades imaginarias en el entero real $-1$.'
propiedades_relaciones: '- **Puente a los reales**: $(ai) \cdot (bi) = -ab \in \mathbb{R}$.'
ejemplo_guiado:
  enunciado: Calcule el producto de los números imaginarios puros $(4i) \cdot (3i)$.
  pasos:
  - 'Paso 1: Multiplicar los coeficientes reales y las unidades imaginarias: $(4 \cdot
    3) \cdot (i \cdot i) = 12i^2$.'
  - 'Paso 2: Reemplazar la identidad fundamental $i^2 = -1$: $12 \cdot (-1)$.'
  - 'Paso 3: Resolver el producto real: $-12$.'
  - 'Conclusión: $(4i) \cdot (3i) = -12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué número real equivale exactamente el producto i^2 = i · i?
  choices:
  - text: Equivale exactamente al número real negativo -1
    is_correct: true
  - text: Equivale al entero positivo +1
    is_correct: false
  - text: Equivale a 0
    is_correct: false
  - text: Equivale a i
    is_correct: false
  explanation: La alternativa correcta es 'Equivale exactamente al número real negativo
    -1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (4i) · (3i), ¿cuál fue el número real obtenido?
  choices:
  - text: '-12'
    is_correct: true
  - text: 12i
    is_correct: false
  - text: '+12'
    is_correct: false
  - text: '-7'
    is_correct: false
  explanation: La alternativa correcta es '-12'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar productos imaginarios
  aplicando la propiedad $i^2 = -1$, convirtiendo expresiones complejas en números
  reales.
semantic_id: MAT.NUM.IMAGINARIOS.I_CUADRADO
procedimiento:
- 'Paso 1: Identificar las expresiones con raíces negativas o potencias de $i$.'
- 'Paso 2: Aplicar la definición fundamental $i^2 = -1$ o el ciclo periódico modular
  $4$.'
- 'Paso 3: Simplificar la expresión resultando en un número imaginario puro o real.'
errores_correccion: '- **Error 1: Aplicar la propiedad $\sqrt{ab} = \sqrt{a}\sqrt{b}$
  a dos números negativos ($(\sqrt{-2})(\sqrt{-8}) = \sqrt{16} = 4$).** **Cómo corregirlo:**
  Se DEBE pasar primero a forma imaginaria ($i\sqrt{2} \cdot i\sqrt{8} = i^2 \sqrt{16}
  = -4$).


  - **Error 2: Confundir $i^2$ con $+1$.** **Cómo corregirlo:** La definición fundamental
  exige que $i^2 = -1$ (signo negativo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.IMAGINARIOS.I_CUADRADO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de los números imaginarios.
- titulo: Ejemplo 2
  enunciado: Verificación de la unidad imaginaria.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal con i^2 = -1.
- titulo: ¿Es i^4 igual al número entero 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $i^4 = (i^2)^2 = (-1)^2 = 1$.
- titulo: ¿Permite la unidad imaginaria resolver ecuaciones como x^2 + 1 = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2 = -1 \implies x = \pm i$.
errores_frecuentes:
- Afirmar que la elevación de la unidad imaginaria al cuadrado $i^2$ resulta en el
  entero positivo $+1$.
- Multiplicar dos raíces de números negativos aplicando directamente el producto radical
  sin extraer la unidad imaginaria $i$.
- Intentar las potencias de la unidad imaginaria como una secuencia lineal sin periodicidad
  de 4 pasos.
- La expresión $\sqrt{-16}$ equivale numéricamente al entero real $-4$.
- Sumar las potencias de $i$ de exponentes consecutivos sin simplificar sus residuos
  modulares.
afirmaciones_verdaderas:
- La unidad imaginaria $i$ se define mediante la igualdad fundamental $i^2 = -1$ o
  $i = \sqrt{-1}$.
- 'Las potencias enteras de $i$ se repiten en un ciclo periódico de cuatro valores:
  $i, -1, -i, 1$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
