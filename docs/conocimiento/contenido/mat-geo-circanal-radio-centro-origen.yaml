semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.RADIO_CENTRO_ORIGEN
resumen_inicial: 'Identificación del radio en una circunferencia con centro en el
  origen: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: El valor k en la ecuación x²+y²=k no es el radio directamente,
  sino el cuadrado del radio, por lo que se necesita extraer la raíz cuadrada para
  obtenerlo.
explicacion_formal: '![Radio en circunferencia con centro en el origen](/static/img/geometria/analitica/circanal-radio-centro-origen.svg)


  ### Definición formal


  Comparando $x^2+y^2=k$ con la forma general $x^2+y^2=r^2$, se identifica que $r^2=k$,
  por lo que $r=\sqrt{k}$.


  ### Desarrollo didáctico


  Para la ecuación $x^2+y^2=16$: comparando con $r^2=16$, se obtiene $r=\sqrt{16}=4$.'
definiciones_clave: '- **Identificación del radio en una circunferencia con centro
