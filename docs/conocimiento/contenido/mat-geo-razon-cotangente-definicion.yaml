procedimiento:
- 'Paso 1: Identifica el cateto opuesto y el cateto adyacente a θ del triángulo rectángulo.'
- 'Paso 2: Calcula la razón cateto adyacente/cateto opuesto (el orden invertido respecto
  de la tangente).'
- 'Paso 3: Verifica, si es útil, que cot θ = 1/tan θ, calculando el recíproco de la
  tangente.'
