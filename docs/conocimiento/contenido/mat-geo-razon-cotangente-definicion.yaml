semantic_id: MAT.GEO.TRIG_RECIPROCAS.COTANGENTE_DEFINICION
resumen_inicial: 'Definición de cotangente de un ángulo agudo como cateto adyacente
  sobre cateto opuesto: conceptos, teoremas, propiedades geométricas y cálculo en
  Trigonometría en el Triángulo Rectángulo.'
explicacion_simple: 'La cotangente es la tangente ''puesta al revés'': en vez de cateto
  opuesto sobre adyacente, es cateto adyacente sobre opuesto.'
explicacion_formal: '![Definición de cotangente](/static/img/geometria/trigonometria/razon-cotangente-definicion.svg)


  ### Definición formal


  La cotangente de $\theta$ se define como $\cot\theta=\dfrac{\text{cateto adyacente}}{\text{cateto
  opuesto}}$, es decir, el recíproco (inverso multiplicativo) de la tangente: $\cot\theta=\dfrac{1}{\tan\theta}$.


  ### Desarrollo didáctico


  Si $\tan\theta=0{,}75$ (es decir, cateto opuesto=3, cateto adyacente=4), entonces
  $\cot\theta=\dfrac{4}{3}\approx1{,}33$, el recíproco exacto de $0{,}75$.'
definiciones_clave: '- **Definición de cotangente de un ángulo agudo como cateto adyacente
  sobre cateto opuesto**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
