semantic_id: MAT.GEO.TRIG_NOTABLES.TANGENTE_COTANGENTE_COMPLEMENTARIOS
resumen_inicial: 'Relación entre tangente y cotangente de ángulos complementarios:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo
  Rectángulo.'
explicacion_simple: Al igual que con el seno y el coseno, la tangente y la cotangente
  de ángulos complementarios están relacionadas de forma directa.
explicacion_formal: '![Complementariedad tangente-cotangente](/static/img/geometria/trigonometria/razon-notable-tangente-cotangente-complementarios.svg)


  ### Definición formal


  Como $\tan\theta=\dfrac{\text{opuesto}}{\text{adyacente}}$ y $\cot(90°-\theta)=\dfrac{\text{adyacente
  de }(90°-\theta)}{\text{opuesto de }(90°-\theta)}$, y estos catetos se intercambian
  entre ángulos complementarios, resulta $\tan\theta=\cot(90°-\theta)$.


  ### Desarrollo didáctico


  Por ejemplo, $\tan30°=\cot60°=\dfrac{\sqrt3}{3}$, ya que 30° y 60° son ángulos complementarios.'
definiciones_clave: '- **Relación entre tangente y cotangente de ángulos complementarios**:
  Elemento o propiedad fundamental en el estudio de trigonometría en el triángulo
  rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre tangente y cotangente de ángulos
  complementarios.'
ejemplo_guiado:
  enunciado: En el estudio de relación entre tangente y cotangente de ángulos complementarios,
    un triángulo posee ángulos interiores de medidas $43^\circ$, $4866^\circ$ y $\gamma$.
    Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de relación entre tangente y cotangente de ángulos complementarios
    y la suma de ángulos interiores.
  - 'Plantear la suma: $43^\circ + 4866^\circ + \gamma = 180^\circ \implies 4909^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4909^\circ = -4729^\circ$.
