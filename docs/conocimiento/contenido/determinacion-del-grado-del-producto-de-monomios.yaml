semantic_id: MAT.ALG.MULT_MONOMIOS.GRADO_PRODUCTO
resumen_inicial: 'La determinación del grado del producto de monomios establece que el grado absoluto del monomio resultante es exactamente igual a la suma de los grados absolutos de los monomios multiplicandos.'
explicacion_simple: |
  El **grado absoluto de un monomio** es la suma de los exponentes de todas sus variables (ej: el grado de $3x^2 y^3$ es $2 + 3 = \mathbf{5}$).
  - **REGLA DEL GRADO DEL PRODUCTO**:
    - **El grado del monomio resultado ES LA SUMA de los grados de los monomios que se multiplicaron**.
    - **Fórmula**: $\operatorname{Grado}(M_1 \cdot M_2) = \operatorname{Grado}(M_1) + \operatorname{Grado}(M_2)$.
  - **Ejemplo**:
    - Monomio 1: $M_1 = 4x^3 y^2 \implies \text{Grado } = 3 + 2 = \mathbf{5}$.
    - Monomio 2: $M_2 = -2x^4 y \implies \text{Grado } = 4 + 1 = \mathbf{5}$.
    - Monomio Producto: $M_1 \cdot M_2 = -8x^7 y^3 \implies \text{Grado } = 7 + 3 = \mathbf{10}$.
    - Verificación: $\text{Grado } 5 + \text{Grado } 5 = \mathbf{10}$.
explicacion_formal: |
  ### Definición formal
  Sea la función grado absoluto $\operatorname{deg}: \mathbb{R}[x_1, \dots, x_n] \setminus \{0\} \to \mathbb{N}_0$ definida para un monomio $M = c \prod_{i=1}^n x_i^{\alpha_i}$ ($c \neq 0$) como la norma $L_1$ del vector de exponentes:

  $$\operatorname{deg}(M) = \|\boldsymbol{\alpha}\|_1 = \sum_{i=1}^n \alpha_i$$

  Para cualquier par de monomios no nulos $M_1, M_2$, la función grado satisface el **homomorfismo aditivo sobre el producto**:

  $$\operatorname{deg}(M_1 \cdot M_2) = \operatorname{deg}(M_1) + \operatorname{deg}(M_2)$$

  ### Demostración Formal
  Sean $\boldsymbol{\alpha}$ y $\boldsymbol{\beta}$ los vectores de exponentes de $M_1$ y $M_2$ respectivamente. La parte literal de $M_1 \cdot M_2$ tiene vector de exponentes $\boldsymbol{\alpha} + \boldsymbol{\beta}$. Aplicando la linealidad de la norma $L_1$:

  $$\operatorname{deg}(M_1 \cdot M_2) = \|\boldsymbol{\alpha} + \boldsymbol{\beta}\|_1 = \sum_{i=1}^n (\alpha_i + \beta_i) = \sum_{i=1}^n \alpha_i + \sum_{i=1}^n \beta_i = \operatorname{deg}(M_1) + \operatorname{deg}(M_2)$$

  ### Síntesis didáctica
  La adición de grados absolutos en el producto de monomios refleja formalmente la estructura de logaritmo que la función grado cumple sobre la multiplicación.
definiciones_clave: |
  - **Grado absoluto del monomio ($\operatorname{deg}(M)$)**: Suma de todos los exponentes de las variables contenidas en el monomio.
  - **Adición de grados en producto**: Propiedad $\operatorname{deg}(M_1 \cdot M_2) = \operatorname{deg}(M_1) + \operatorname{deg}(M_2)$ por la cual los grados se suman.
  - **Grado relativo respecto a una variable**: Exponente específico que posee una variable seleccionada dentro del monomio producto.
propiedades_relaciones: |
  - **Homomorfismo aditivo**: La función grado transforma el producto de monomios en una suma de números enteros.
  - **Grado de constante no nula**: Una constante numérica pura $c \neq 0$ tiene grado $0$ ($\operatorname{deg}(c) = 0$).
ejemplo_guiado:
  enunciado: 'Calcula el grado absoluto de $M_1 = 5x^4 y^3$ y $M_2 = 2x^2 z^5$, y verifica el grado de su producto.'
  pasos:
    - 'Paso 1: Calculamos el grado absoluto de $M_1$: $\operatorname{deg}(M_1) = 4 + 3 = \mathbf{7}$.'
    - 'Paso 2: Calculamos el grado absoluto de $M_2$: $\operatorname{deg}(M_2) = 2 + 5 = \mathbf{7}$.'
    - 'Paso 3: Calculamos la suma teórica de grados: $7 + 7 = \mathbf{14}$.'
    - 'Paso 4: Multiplicamos los monomios:
       $M_1 \cdot M_2 = (5 \cdot 2) x^{4+2} y^3 z^5 = \mathbf{10x^6 y^3 z^5}$.'
    - 'Paso 5: Calculamos el grado absoluto del monomio producto:
       $\operatorname{deg}(10x^6 y^3 z^5) = 6 + 3 + 5 = \mathbf{14}$.'
    - 'Conclusión: El grado del producto es **$14$**, lo que coincide exactamente con la suma de los grados $7 + 7 = 14$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un monomio de grado 4 se multiplica por un monomio de grado 6, ¿cuál es el grado absoluto del monomio resultante?'
    choices:
      - {text: 'El grado del resultado es 10, porque los grados absolutos de los monomios se suman ($4 + 6 = 10$)', is_correct: true}
      - {text: 'El grado del resultado es 24, porque se multiplican ($4 \cdot 6 = 24$)', is_correct: false}
      - {text: 'El grado del resultado es 6, tomando el mayor', is_correct: false}
      - {text: 'El grado del resultado es 2, restando $6 - 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''El grado del resultado es 10, porque los grados absolutos de los monomios se suman ($4 + 6 = 10$)''. Propiedad de adición de grados $\operatorname{deg}(M_1 \cdot M_2) = \operatorname{deg}(M_1) + \operatorname{deg}(M_2)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el grado absoluto del monomio producto de $(-3x^2 y) \cdot (4x y^3)$?'
    choices:
      - {text: 'El grado es 7, porque el producto es $-12x^3 y^4$ y su grado es $3 + 4 = 7$ (igual a $3 + 4 = 7$ de los factores)', is_correct: true}
      - {text: 'El grado es 12', is_correct: false}
      - {text: 'El grado es 5', is_correct: false}
      - {text: 'El grado es 6', is_correct: false}
    explanation: 'La alternativa correcta es ''El grado es 7, porque el producto es $-12x^3 y^4$ y su grado es $3 + 4 = 7$ (igual a $3 + 4 = 7$ de los factores)''. Grado $M_1=3$, Grado $M_2=4 \implies 3+4=7$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sumar los exponentes del primer monomio para hallar su grado absoluto $\operatorname{deg}(M_1)$.'
  - 'Paso 2: Sumar los exponentes del segundo monomio para hallar su grado absoluto $\operatorname{deg}(M_2)$.'
  - 'Paso 3: Sumar ambos grados absolutos $\operatorname{deg}(M_1) + \operatorname{deg}(M_2)$.'
  - 'Paso 4: Verificar que el monomio producto obtenido cumpla que la suma de sus exponentes coincida con el total calculado.'
errores_correccion: |
  - **Error 1:** Multiplicar los grados absolutos de los monomios en lugar de sumarlos (decir que grado 3 por grado 4 da grado 12). **Cómo corregirlo:** La función grado **SUMA LOS GRADOS ($3 + 4 = 7$)**.
  - **Error 2:** Excluir el exponente 1 de una variable al calcular el grado de un monomio (contar $x^2 y$ como grado 2). **Cómo corregirlo:** La variable sin exponente **TIENE EXPONENTE 1 ($2 + 1 = 3$)**.
ejemplos:
  - titulo: 'Grado de producto simple'
    enunciado: 'Si $M_1$ tiene grado 3 y $M_2$ tiene grado 5, ¿cuál es el grado de $M_1 \cdot M_2$?'
    alternativas:
      - '8'
      - '15'
      - '5'
    respuesta: '8'
    solucion_pasos:
      - '1. Suma de grados: $3 + 5 = 8$.'
      - '2. Resultado: 8.'
  - titulo: 'Grado de producto multivariable'
    enunciado: '¿Cuál es el grado de $(2x^2 y^3) \cdot (-3x y^4)$?'
    alternativas:
      - '10'
      - '24'
      - '9'
    respuesta: '10'
    solucion_pasos:
      - '1. Grado $M_1: 2 + 3 = 5$.'
      - '2. Grado $M_2: 1 + 4 = 5$.'
      - '3. Suma: $5 + 5 = 10$.'
  - titulo: 'Grado con constantes'
    enunciado: 'Al multiplicar el monomio de grado 4 $M_1 = 5x^4$ por el entero 3, ¿se mantiene el grado en 4?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el entero 3 tiene grado 0 $\implies 4 + 0 = 4$.'
  - titulo: 'Grado de producto de tres monomios'
    enunciado: 'Para tres monomios de grados 2, 3 y 1, ¿es el grado del producto $2 + 3 + 1 = 6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, los grados se acumulan aditivamente.'
errores_frecuentes:
  - 'Multiplicar los grados absolutos de los monomios multiplicandos en lugar de sumarlos.'
  - 'Los exponentes igual a 1 de las variables no son considerados al calcular la suma del grado absoluto.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar el grado absoluto del monomio producto con el coeficiente numérico resultante.'
  - 'Declarar que el grado del producto es igual al mayor de los grados sin sumar.'
afirmaciones_verdaderas:
  - 'El grado absoluto del monomio producto es igual a la suma de los grados absolutos de los monomios multiplicandos.'
  - 'Multiplicar un monomio por una constante numérica no altera el grado absoluto del monomio.'
