semantic_id: MAT.ALG.MULT_MONOMIOS.GRADO_PRODUCTO
resumen_inicial: 'Determinación del grado del producto de monomios: leyes, procedimiento
  y aplicación en Multiplicación de monomios.'
explicacion_simple: Cuando multiplicas dos monomios, el 'tamaño' algebraico (su grado)
  aumenta. Si multiplicas algo de grado 2 por algo de grado 3, el resultado es de
  grado 5. Los grados siempre se suman.
explicacion_formal: '### Definición formal


  Como las potencias de igual base se suman ($x^a \cdot x^b = x^{a+b}$), los grados
  absolutos de los factores se suman.


  ### Desarrollo didáctico


  La propiedad del grado en la multiplicación se deriva directamente de la regla de
  los exponentes: $x^a \cdot x^b = x^{a+b}$.


  Si tienes un monomio $M_1$ de grado absoluto $m$ y un monomio $M_2$ de grado absoluto
  $n$, el producto $M_1 \cdot M_2$ tendrá grado absoluto $m + n$.


  Por ejemplo, si $M_1 = 3x^2y^3$ (grado $2+3=5$) y $M_2 = -2x^4y$ (grado $4+1=5$),
  el producto es $-6x^6y^4$. Su grado absoluto es $6+4=10$, que es exactamente $5
  + 5$.'
definiciones_clave: '- **Determinación del grado del producto de monomios**: Propiedad
  o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a determinación del grado del producto de monomios.'
ejemplo_guiado:
