  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evalúa $f(0)$ para confirmar que el origen pertenece a la gráfica.'
- 'Paso 2: Resuelve $f(x)=0$ para determinar todos los interceptos con el eje $x$.'
- 'Paso 3: Verifica que la única solución sea $x=0$, confirmando que es el único intercepto.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en identificación del origen como punto de paso en funciones potencia
  de exponente entero positivo.
ejemplos:
- titulo: Verificación del intercepto en $f(x)=4x^2$
  enunciado: ¿Cuál es el intercepto de $f(x)=4x^2$ con los ejes?
  solucion_pasos:
  - Se evalúa $f(0)=4\\cdot0^2=0$.
  - El único intercepto, tanto en $x$ como en $y$, es el punto $(0,0)$.
- titulo: Verificación del intercepto en $f(x)=-2x^5$
  enunciado: ¿Cuál es el intercepto de $f(x)=-2x^5$ con los ejes?
  solucion_pasos:
  - Se resuelve $-2x^5=0$, obteniendo únicamente $x=0$.
  - El único intercepto es el punto $(0,0)$.
- titulo: ¿Puede $f(x)=a\cdot x^n$ tener un intercepto distinto del origen?
  enunciado: ¿Puede una función $f(x)=a\cdot x^n$, con $n$ entero positivo, cortar
    el eje $x$ en un punto distinto del origen?
  respuesta: 'No'
  solucion_pasos:
  - La ecuación $a\cdot x^n=0$ solo tiene como solución $x=0$, para cualquier $a\neq0$
    y $n$ entero positivo.
- titulo: ¿El intercepto en el origen depende del valor del coeficiente $a$?
  enunciado: ¿La posición del intercepto en el origen cambia según el valor del coeficiente
    $a$?
  respuesta: 'No'
  solucion_pasos:
  - El punto $(0,0)$ es siempre el intercepto, sin importar el valor de $a$ (mientras
    $a\neq0$).
errores_frecuentes:
- Suponer que existen otros interceptos además del origen para funciones básicas de
  este tipo.
- Confundir este resultado con el de funciones potencia con exponente negativo, que
  no pasan por el origen.
- No distinguir entre intercepto en $x$ e intercepto en $y$, cuando en este caso ambos
  coinciden en el mismo punto.
- Olvidar verificar $f(0)$ antes de afirmar que el origen pertenece a la gráfica.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  identificación del origen como punto de paso en funciones potencia de exponente
  entero positivo.
