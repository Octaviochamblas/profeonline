semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.INTERCEPTO_ORIGEN
resumen_inicial: 'Toda función potencia de exponente entero positivo $f(x) = a x^n$ ($n \in \mathbb{Z}^+$) pasa obligatoriamente por el origen de coordenadas cartesiano $(0, 0)$.'
explicacion_simple: |
  Una propiedad fundamental compartida por todas las funciones potencia con exponente entero positivo (como $x^2, x^3, x^4$) es que sus gráficas pasan siempre por el centro exacto del plano cartesiano: el punto $(0, 0)$. Al reemplazar la variable $x$ por cero, elevar cero a cualquier exponente entero positivo da cero ($0^n = 0$), y al multiplicarlo por el número $a$ obtenemos cero ($a \cdot 0 = 0$). Por eso, la curva siempre toca o cruza el origen.
explicacion_formal: |
  ### Definición formal
  El **paso por el origen de coordenadas** $(0, 0)$ en la familia de funciones potencia $f(x) = a x^n$ con $n \in \mathbb{Z}^+$ y $a \neq 0$ es un teorema de intersección cartesiana invariante demostrado por la evaluación directa en $x = 0$:
  $$f(0) = a \cdot 0^n = a \cdot 0 = 0$$
  lo que garantiza que el par ordenado $(0, 0)$ pertenece a la gráfica $\operatorname{Graf}(f)$ y constituye simultáneamente:
  1. El unico **intercepto con el eje $y$** (ordenada al origen): $(0, f(0)) = (0, 0)$.
  2. Un **intercepto con el eje $x$** (raíz o cero de la función): $f(x) = 0 \iff a x^n = 0 \implies x = 0$.

  ### Multiplicidad del cero en el origen
  - Para exponente $n$: El punto $(0, 0)$ es una raíz de multiplicidad $n$.
  - Si $n$ es par: El origen es un punto de tangencia especular (la curva rebota en el eje $x$).
  - Si $n$ es impar: El origen es un punto de inflexión o cruce (la curva atraviesa el eje $x$).

  ### Síntesis didáctica
  Diferencia con funciones trasladadas: Únicamente las funciones potencia canónicas no trasladadas $y = a x^n$ pasan exactamente por $(0, 0)$. Si se suma una constante vertical $+k$, el intercepto se desplaza a $(0, k)$.
definiciones_clave: |
  - **Intercepto en el origen $(0, 0)$**: Punto nodal común donde la gráfica interseca simultáneamente a ambos ejes cartesianos.
  - **Cero de la función $x = 0$**: Raíz única de la ecuación $f(x) = 0$.
  - **Multiplicidad de la raíz $n$**: Grado de aplanamiento de la curva en las inmediaciones del origen.
propiedades_relaciones: |
  - **Invariancia por el parámetro $a$**: El paso por $(0, 0)$ se cumple sin importar la magnitud o el signo del coeficiente multiplicativo $a \neq 0$.
  - **Ausencia para exponentes negativos**: Las funciones potencia de exponente entero negativo ($n < 0$) **jamás** pasan por el origen $(0, 0)$ debido a la indefinición $\frac{a}{0}$.
ejemplo_guiado:
  enunciado: 'Verifica que la función potencia $f(x) = -6x^5$ pasa por el origen $(0, 0)$ determinando sus interceptos con los ejes $x$ e $y$.'
  pasos:
    - 'Paso 1: Evaluamos en $x = 0$ para hallar el intercepto con el eje $y$: $f(0) = -6(0)^5 = -6(0) = 0$. Punto: $(0, 0)$.'
    - 'Paso 2: Igualamos la función a cero para hallar las raíces en el eje $x$: $-6x^5 = 0 \implies x^5 = 0 \implies x = 0$. Punto: $(0, 0)$.'
    - 'Paso 3: Conclusión: El punto $(0, 0)$ es el único intercepto común con ambos ejes cartesianos.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué toda función potencia con exponente entero positivo como $f(x) = 9x^4$ interseca al plano cartesiano en el origen $(0, 0)$?'
    choices:
      - {text: 'Porque al evaluar $x = 0$, $0^n = 0$, lo que resulta en $f(0) = a \cdot 0 = 0$, generando el par ordenado $(0, 0)$', is_correct: true}
      - {text: 'Porque el coeficiente $a = 9$ obliga a que la función sea nula', is_correct: false}
      - {text: 'Porque todas las funciones matemáticas pasan siempre por el origen', is_correct: false}
      - {text: 'Porque el exponente 4 borra los valores de $y$', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al evaluar $x = 0$, $0^n = 0$, lo que resulta en $f(0) = a \cdot 0 = 0$, generando el par ordenado $(0, 0)$''. Cero elevado a cualquier entero positivo resulta en cero.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la diferencia entre el paso por el origen $(0, 0)$ de la función potencia par $f(x) = x^2$ y la función potencia impar $g(x) = x^3$?'
    choices:
      - {text: 'En $f(x) = x^2$ la gráfica rebota en el eje $x$ en $(0, 0)$ sin atravesarlo, mientras que en $g(x) = x^3$ la gráfica atraviesa el eje $x$ en $(0, 0)$', is_correct: true}
      - {text: 'La función $f(x) = x^2$ no pasa por el origen', is_correct: false}
      - {text: 'Ambas funciones atraviesan el eje $x$ de la misma forma', is_correct: false}
      - {text: 'En $g(x) = x^3$ el origen es una asíntota vertical', is_correct: false}
    explanation: 'La alternativa correcta es ''En $f(x) = x^2$ la gráfica rebota en el eje $x$ en $(0, 0)$ sin atravesarlo, mientras que en $g(x) = x^3$ la gráfica atraviesa el eje $x$ en $(0, 0)$''. Las raíces de multiplicidad par rebotan y las impares atraviesan.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el exponente $n$ de la función potencia $f(x) = a x^n$ sea entero positivo ($n \in \mathbb{Z}^+$).'
  - 'Paso 2: Evaluar la función en $x = 0$: $f(0) = a \cdot 0^n = 0$.'
  - 'Paso 3: Declarar que el par ordenado $(0, 0)$ pertenece a la curva como el punto de intersección común con ambos ejes.'
  - 'Paso 4: Si $n$ es par, dibujar tangencia/rebote en $(0, 0)$; si $n$ es impar, dibujar cruce con inflexión en $(0, 0)$.'
errores_correccion: |
  - **Error 1:** Creer que las funciones potencia de exponente entero negativo también pasan por $(0, 0)$. **Cómo corregirlo:** En potencias negativas $f(x) = x^{-n} = \frac{1}{x^n}$, por lo que $x = 0$ indefine la función ($\frac{1}{0}$). El origen no pertenece a la curva.
  - **Error 2:** Confundir la constante $a$ con el intercepto en el eje $y$. **Cómo corregirlo:** En funciones potencia canónicas $a x^n$, $a$ es un factor multiplicativo, no una constante aditiva. La evaluación en $x = 0$ siempre da $f(0) = 0$, no $a$.
ejemplos:
  - titulo: 'Intersección en el origen'
    enunciado: '¿La función $f(x) = -12x^4$ contiene al punto $(0, 0)$?'
    alternativas:
      - 'Sí, por tener exponente entero positivo'
      - 'No, el intercepto es $(0, -12)$'
      - 'No pasa por ningún eje'
    respuesta: 'Sí, por tener exponente entero positivo'
    solucion_pasos:
      - '1. Evaluamos $f(0) = -12(0)^4 = 0$.'
      - '2. El punto $(0, 0)$ pertenece a la función.'
  - titulo: 'Unicidad del intercepto en $y$'
    enunciado: '¿El único punto donde $y = 3x^5$ corta al eje $y$ es $(0, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En el eje $y$, $x = 0 \implies y = 3(0)^5 = 0$.'
  - titulo: 'Diferencia con exponente negativo'
    enunciado: '¿La función $g(x) = 2x^{-1}$ pasa por el origen $(0, 0)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Exponente $-1 < 0$ indefine $x = 0$. El origen no pertenece a la función.'
  - titulo: 'Tangencia en exponentes pares'
    enunciado: '¿La gráfica de $f(x) = x^2$ es tangente al eje $x$ en el origen $(0, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El origen es el punto de mínimo donde la recta tangente es la recta horizontal $y = 0$.'
errores_frecuentes:
  - 'La función potencia $f(x) = 4x^3$ interseca al eje $y$ en el punto $(0, 4)$.'
  - 'Todas las funciones potencia, incluidas las de exponente negativo, pasan por el origen $(0, 0)$.'
  - 'El punto $(0, 0)$ es una asíntota para la función $f(x) = x^2$.'
  - 'Una función potencia con $a < 0$ no puede tocar el origen de coordenadas.'
  - 'Evaluar $x = 0$ en $f(x) = a x^n$ da como resultado $a$.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero positivo $f(x) = a x^n$ ($n \in \mathbb{Z}^+$) pasa obligatoriamente por el origen de coordenadas $(0, 0)$.'
  - 'El punto $(0, 0)$ constituye el único intercepto con el eje $y$ y una raíz de multiplicidad $n$ en el eje $x$.'
al_terminar_debes_poder: |
  QUÉ: Justificar y calcular los interceptos con los ejes cartesianos en funciones potencia no trasladadas.
  CÓMO: Evaluar $f(0) = 0$ e igualar $f(x) = 0$ demostrando que el origen $(0,0)$ es el único punto nodal común.
