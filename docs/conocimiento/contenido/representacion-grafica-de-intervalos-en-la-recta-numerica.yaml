semantic_id: MAT.ALG.INTERVALOS.REPRESENTACION_RECTA
resumen_inicial: 'Representación gráfica de intervalos en la recta numérica: relaciones
  de orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Visualizar intervalos en la recta numérica es una herramienta
  fundamental que permite comprender intuitivamente la magnitud, el tamaño y la continuidad
  de un conjunto de números reales.
explicacion_formal: '### Definición formal

  Sea $I \\subseteq \\mathbb{R}$ un intervalo con extremos $a$ y $b$. Su gráfica geométrica
  es un segmento en la recta real donde el punto $a$ se marca con un punto vacío ($\\circ$)
  si $a \\notin I$ o un punto sólido ($\\bullet$) si $a \\in I$. El crecimiento hacia
  los infinitos se representa con un rayo dirigido y una flecha continua.

  ### Desarrollo didáctico

  La recta numérica traduce los símbolos algebraicos en geometría. Cuando graficamos,
  el relleno del círculo es una pista visual directa sobre la estrictez de las desigualdades:
  relleno significa ''llega exactamente hasta aquí e incluye este punto'', y vacío
  significa ''se acerca infinitamente a este punto pero no lo toca''.'
definiciones_clave: '- **Representación gráfica de intervalos en la recta numérica**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a representación gráfica de intervalos
  en la recta numérica.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de representación
    gráfica de intervalos en la recta numérica.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de representación gráfica de intervalos en
    la recta numérica, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
