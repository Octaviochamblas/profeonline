semantic_id: MAT.ALG.INTERVALOS.REPRESENTACION_RECTA
resumen_inicial: Representar un intervalo en la recta numérica consiste en trazar
  un segmento destacado que une sus extremos marcados.
explicacion_simple: 'Para dibujar un intervalo en la recta numérica:

  1. Trazamos una línea recta y marcamos los números extremos $a$ y $b$.

  2. Dibujamos un círculo sobre cada extremo.

  3. Pintamos o sombreamos el segmento de recta que une ambos círculos.

  Esta gráfica permite visualizar inmediatamente todo el rango continuo de soluciones.'
explicacion_formal: 'La **representación gráfica** es la aplicación isomórfica del
  subconjunto $I \subset \mathbb{R}$ sobre el espacio continuo unidimensional de la
  recta real:


  $$I = [a, b] \implies \text{Segmento continuo sombreado } [a, b] \subset \mathbb{R}$$


  **Desglose de la fórmula:**

  - Utiliza símbolos gráficos estándar en los extremos (círculo relleno o vacío) y
  una línea continua sombreada entre ellos.'
definiciones_clave: '- **Representación gráfica en la recta**: Ilustración visual
  del subconjunto de soluciones sobre el eje real continuado.

  - **Segmento sombreado**: Porción destacada de la recta que contiene a los puntos
  pertenecientes al intervalo.'
propiedades_relaciones: '- **Visualización instantánea**: Permite distinguir de un
  vistazo la condición de acotamiento del conjunto.'
ejemplo_guiado:
  enunciado: Describe el procedimiento gráfico para representar el intervalo $]-1,
    4]$ en la recta numérica real.
  pasos:
  - 'Paso 1: Dibujar la recta numérica marcando los números $-1$ y $4$.Paso 2: Dibujar
    un círculo sin rellenar (vacío) sobre $-1$ por ser abierto por la izquierda.Paso
    3: Dibujar un círculo completamente rellenado (lleno) sobre $4$ por ser cerrado
    por la derecha.Paso 4: Sombrear o destacar la línea continua que va desde $-1$
    hasta $4$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la representación gráfica de $]-1, 4]$, ¿cómo deben dibujarse los círculos
    en los extremos $-1$ y $4$?
  choices:
  - text: Círculo vacío en $-1$ y círculo relleno en $4$.
    is_correct: true
  - text: Círculo relleno en $-1$ y círculo vacío en $4$.
    is_correct: false
  - text: Ambos círculos rellenos.
    is_correct: false
  - text: Ambos círculos vacíos.
    is_correct: false
  explanation: La alternativa correcta es 'Círculo vacío en $-1$ y círculo relleno
    en $4$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa la línea continua sombreada entre los dos extremos de
    la gráfica?
  choices:
  - text: Todos los infinitos números reales pertenecientes al intervalo.
    is_correct: true
  - text: Únicamente los números enteros de la zona.
    is_correct: false
  - text: La distancia en centímetros de la hoja.
    is_correct: false
  - text: Los números prohibidos del conjunto.
    is_correct: false
  explanation: La alternativa correcta es 'Todos los infinitos números reales pertenecientes
    al intervalo.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar el eje horizontal de la recta numérica.'
- 'Paso 2: Ubicar los extremos $a$ y $b$.'
- 'Paso 3: Dibujar las marcas en los bordes (círculo vacío o lleno).'
- 'Paso 4: Trazar una franja o línea destacada entre ambos extremos.'
errores_correccion: '- **Error común:** Olvidar sombrear la línea intermedia y dibujar
  solo los dos círculos extremos.

  - **Cómo corregirlo:** Si no sombreadas la línea, estás representando solo 2 puntos
  en lugar del intervalo continuo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
  - 'La representación gráfica del intervalo $[2, 6]$ en la recta numérica consiste en marcar únicamente los puntos aislados $\{2, 6\}$.'
  - 'Al graficar un intervalo continuo en la recta real, no se requiere trazar la línea sombreada entre los dos extremos.'
  - 'La gráfica del intervalo semiabierto $]1, 5]$ utiliza puntos cerrados rellenados en ambos extremos $1$ y $5$.'
  - 'Un tramo sombreado sobre la recta numérica representa exclusivamente el conjunto de los números enteros.'
  - 'Al graficar el intervalo infinito $]-\infty, 4[$, la flecha sombreada se orienta hacia la derecha del punto $4$.'
afirmaciones_verdaderas:
  - 'La gráfica de un intervalo en la recta real comprende un tramo continuo sombreado entre sus extremos y la indicación de bordes abiertos o cerrados.'
  - 'Un tramo continuo sobre la recta gráfica simboliza la infinitud de números reales contenidos en el intervalo.'
al_terminar_debes_poder: |
  QUÉ: Dibujar e interpretar representaciones gráficas de intervalos en la recta numérica.
  CÓMO: Trazar la recta real, ubicar los extremos $a$ y $b$, marcar los círculos (abiertos o cerrados) y sombrear la porción continua entre ellos.
