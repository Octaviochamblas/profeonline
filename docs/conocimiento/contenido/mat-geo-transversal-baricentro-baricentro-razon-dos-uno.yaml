resumen_inicial: 'Propiedad del baricentro: división de cada transversal de gravedad
  en razón 2:1 desde el vértice: conceptos, teoremas, propiedades geométricas y cálculo
  en Elementos Secundarios del Triángulo.'
explicacion_simple: 'El baricentro no está en cualquier punto de la transversal de
  gravedad: siempre se ubica a dos tercios de la distancia entre el vértice y el punto
  medio del lado opuesto.'
explicacion_formal: '![Baricentro en razón 2:1 sobre la transversal](/static/img/geometria/elementos-secundarios/transversal-baricentro-baricentro-razon-dos-uno.svg)


  ### Definición formal


  Si G es el baricentro y M es el punto medio de BC, entonces AG = 2·GM; es decir,
  la distancia del vértice al baricentro es el doble de la distancia del baricentro
  al punto medio.


  ### Desarrollo didáctico


  Si una transversal de gravedad mide 9 cm en total, el baricentro la divide en dos
  partes: 6 cm (del vértice al baricentro) y 3 cm (del baricentro al punto medio),
  manteniendo la razón 2:1.'
