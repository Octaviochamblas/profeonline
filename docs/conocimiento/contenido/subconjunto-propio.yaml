semantic_id: MAT.FUND.RELACIONES_CONJUNTOS.SUBCONJUNTO_PROPIO
resumen_inicial: 'Definición, características y notación ($\subsetneq$ o $\subset$) de los subconjuntos propios, donde $A \subseteq B$ pero $A \neq B$.'
explicacion_simple: |
  Un conjunto $A$ es un **subconjunto propio** de $B$ (escrito como **$A \subsetneq B$** o $A \subset B$) cuando **todos los elementos de $A$ están en $B$, PERO $B$ tiene al menos un elemento más que no está en $A$** (es decir, $A$ está estrictamente adentro de $B$ y no son iguales). Por ejemplo, si $A = \{1, 2\}$ y $B = \{1, 2, 3\}$, entonces $A$ es subconjunto propio de $B$. La gran diferencia con el subconjunto simple es que **un conjunto NUNCA puede ser subconjunto propio de sí mismo** ($A \not\subsetneq A$).
explicacion_formal: |
  ### Definición formal
  En la teoría de conjuntos, $A$ es un **subconjunto propio (o inclusión estricta)** de $B$, denotado formalmente como $A \subsetneq B$ (o $A \subset B$), si y solo si se verifican simultáneamente dos condiciones:
  $$A \subsetneq B \quad \iff \quad A \subseteq B \quad \land \quad A \neq B$$
  En términos de lógica de predicados:
  $$A \subsetneq B \quad \iff \quad (\forall x \, (x \in A \to x \in B)) \quad \land \quad (\exists y \, (y \in B \land y \notin A))$$

  ### Desglose simbólico
  - Símbolos: $\subsetneq$ (notación rigurosa inequívoca) o $\subset$.
  - Propiedad de Irreflexividad: $\forall A, \, A \not\subsetneq A$.
  - Propiedad de Asimetría: $A \subsetneq B \implies B \not\subsetneq A$.
  - Propiedad de Transitividad: $(A \subsetneq B \land B \subsetneq C) \implies A \subsetneq C$.
  - Cardinalidad en conjuntos finitos: Si $A \subsetneq B$ y $B$ es finito, entonces $|A| < |B|$.

  ### Síntesis didáctica
  El subconjunto propio modela la noción de parte estrictamente menor o contenida sin saturar el conjunto mayor.
definiciones_clave: |
  - **Subconjunto propio ($A \subsetneq B$)**: Subconjunto que no coincide con el conjunto contenedor ($A \neq B$).
  - **Elemento excedente**: Objeto $y \in B$ tal que $y \notin A$, que certifica la desigualdad de los conjuntos.
  - **Orden estricto**: Estructura relacional irreflexiva, asimétrica y transitiva.
propiedades_relaciones: |
  - **Número de subconjuntos propios**: Un conjunto finito de $n$ elementos tiene exactamente $2^n - 1$ subconjuntos propios (se excluye a $A$).
  - **Conjunto vacío**: El conjunto vacío es subconjunto propio de cualquier conjunto no vacío ($\forall A \neq \emptyset, \, \emptyset \subsetneq A$).
ejemplo_guiado:
  enunciado: 'Dado el conjunto $M = \{1, 2, 3\}$, determina si los siguientes conjuntos son subconjuntos propios de $M$: (a) $S_1 = \{1, 3\}$, (b) $S_2 = \{1, 2, 3\}$, (c) $S_3 = \emptyset$.'
  pasos:
    - 'Paso 1: Evaluar (a) $S_1 = \{1, 3\}$:
      - $S_1 \subseteq M$ porque $1, 3 \in M$.
      - $S_1 \neq M$ porque $2 \in M$ y $2 \notin S_1$.
      - Como cumple ambas condiciones, $S_1 \subsetneq M$ es **Verdadero ($V$)**.'
    - 'Paso 2: Evaluar (b) $S_2 = \{1, 2, 3\}$:
      - $S_2 \subseteq M$, pero $S_2 = M$.
      - Al no haber diferencia estricta, $S_2 \subsetneq M$ es **Falso ($F$)** (es subconjunto impropio).'
    - 'Paso 3: Evaluar (c) $S_3 = \emptyset$:
      - $\emptyset \subseteq M$ y como $M \neq \emptyset$, se cumple $\emptyset \neq M$.
      - Por ende, $\emptyset \subsetneq M$ es **Verdadero ($V$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la diferencia conceptual entre $A \subseteq B$ y $A \subsetneq B$?'
    choices:
      - {text: '$A \subseteq B$ permite que $A = B$, mientras que $A \subsetneq B$ exige obligatoriamente que $A \neq B$', is_correct: true}
      - {text: '$A \subseteq B$ exige que $A$ sea infinito y $A \subsetneq B$ que sea finito', is_correct: false}
      - {text: 'Son dos símbolos idénticos sin ninguna diferencia matemática', is_correct: false}
      - {text: '$A \subsetneq B$ significa que $A$ y $B$ son conjuntos disjuntos', is_correct: false}
    explanation: 'La alternativa correcta es ''$A \subseteq B$ permite que $A = B$, mientras que $A \subsetneq B$ exige obligatoriamente que $A \neq B$''. El subconjunto propio prohíbe la igualdad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuántos subconjuntos propios tiene un conjunto con $4$ elementos?'
    choices:
      - {text: '$15$ subconjuntos propios ($2^4 - 1$)', is_correct: true}
      - {text: '$16$ subconjuntos propios', is_correct: false}
      - {text: '$14$ subconjuntos propios', is_correct: false}
      - {text: '$8$ subconjuntos propios', is_correct: false}
    explanation: 'La alternativa correcta es ''$15$ subconjuntos propios ($2^4 - 1$)''. Se resta el propio conjunto para dar $16 - 1 = 15$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que todo elemento de $A$ pertenezca a $B$ ($A \subseteq B$).'
  - 'Paso 2: Si $A \not\subseteq B$, concluir de inmediato que $A \not\subsetneq B$.'
  - 'Paso 3: Si $A \subseteq B$, verificar si existe al menos un elemento en $B$ que no esté en $A$.'
  - 'Paso 4: Si se halla dicho elemento excedente ($A \neq B$), concluir formalmente que $A \subsetneq B$.'
errores_correccion: |
  - **Error 1:** Afirmar que un conjunto es subconjunto propio de sí mismo ($A \subsetneq A$). **Cómo corregirlo:** La relación $\subsetneq$ es estrictamente irreflexiva; $A \subsetneq A$ es siempre falso porque viola la condición $A \neq B$.
  - **Error 2:** Creer que el conjunto vacío no tiene subconjuntos propios. **Cómo corregirlo:** El conjunto vacío no tiene subconjuntos propios (porque su único subconjunto es $\emptyset = \emptyset$), pero el vacío sí es subconjunto propio de cualquier conjunto no vacío.
ejemplos:
  - titulo: 'Subconjunto propio de números naturales'
    enunciado: '¿Es el conjunto de números pares positivos $P$ un subconjunto propio de $\mathbb{N}$?'
    alternativas:
      - 'Sí, pues $P \subseteq \mathbb{N}$ y $1 \in \mathbb{N} \setminus P$'
      - 'No, ambos son infinitos'
      - 'No, $\mathbb{N} = P$'
    respuesta: 'Sí, pues $P \subseteq \mathbb{N}$ y $1 \in \mathbb{N} \setminus P$'
    solucion_pasos:
      - '1. Todo par es natural.'
      - '2. Existen naturales impares que no están en $P$, por lo que $P \subsetneq \mathbb{N}$.'
  - titulo: 'Subconjunto propio del vacío'
    enunciado: '¿Tiene el conjunto vacío $\emptyset$ algún subconjunto propio?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, pues $|\mathcal{P}(\emptyset)| = 1$ y su único subconjunto es el propio $\emptyset$.'
  - titulo: 'Desigualdad de cardinalidad finita'
    enunciado: 'Si $A \subsetneq B$ con $B$ finito, ¿se cumple que $|A| < |B|$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en conjuntos finitos la inclusión estricta implica desigualdad estricta de cardinalidad.'
  - titulo: 'Asimetría'
    enunciado: 'Si $A \subsetneq B$, ¿puede cumplirse $B \subsetneq A$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, por la propiedad de asimetría de la inclusión estricta.'
errores_frecuentes:
  - 'La afirmación de que un conjunto cualquiera $A$ es subconjunto propio de sí mismo ($A \subsetneq A$).'
  - 'La afirmación de que el número de subconjuntos propios de un conjunto de $n$ elementos es $2^n$.'
  - 'La afirmación de que dos conjuntos infinitos no pueden mantener relaciones de subconjunto propio entre sí.'
  - 'La afirmación de que la relación de subconjunto propio es simétrica.'
  - 'La afirmación de que el conjunto vacío es subconjunto propio de sí mismo.'
afirmaciones_verdaderas:
  - 'Un conjunto $A$ es subconjunto propio de $B$ ($A \subsetneq B$) si y solo si $A \subseteq B$ y simultáneamente $A \neq B$.'
  - 'La relación de subconjunto propio es un orden estricto irreflexivo, asimétrico y transitivo.'
al_terminar_debes_poder: |
  QUÉ: Definir, identificar y calcular subconjuntos propios ($A \subsetneq B$).
  CÓMO: Comprobar la inclusión $A \subseteq B$, verificar la existencia de elementos excedentes en $B$ y calcular el total de subconjuntos propios ($2^n - 1$).
