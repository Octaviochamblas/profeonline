procedimiento:
- Escribe el MCM al lado de cada término (fracción o número entero).
- Simplifica el denominador de la fracción tachándolo con su parte correspondiente
  en el MCM.
- Multiplica lo que sobrevivió del MCM por el numerador.
- Mantén los paréntesis al reescribir la nueva ecuación aplanada.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en eliminación de denominadores en una ecuación fraccionaria.
ejemplos:
- titulo: $\frac{3}{x}$ y $3(x-2)$
  enunciado: Justifica el procedimiento adecuado para el caso $\frac{3}{x}$ y $3(x-2)$.
  solucion_pasos:
  - 'El MCM debe visitar a **cada término** de la ecuación (cada término, incluso
    los que no tienen fracción).

    - Al visitar $\frac{3}{x}$, la ''x'' se cancela y queda $3(x-2)$.

    - Al visitar $\frac{1}{x-2}$, el $(x-2)$ se cancela y queda $1(x)$.

    - Al visitar el 2 (no lo olvides.), no se cancela nada, queda $2x(x-2)$.'
  - Escribe el MCM al lado de cada término (fracción o número entero).
- titulo: $x(x-2)$ y $\frac{3}{x} + \frac{1}{x-2} = 2$
  enunciado: Determina qué debe hacerse en $x(x-2)$ y $\frac{3}{x} + \frac{1}{x-2}
    = 2$ y fundamenta cada transformación.
  solucion_pasos:
  - 'Este es el momento de la verdad, y donde la mayoría comete el error frecuente.
    Tienes tu MCM (ej: $x(x-2)$) y vas a multiplicar a la ecuación: $\frac{3}{x} +
    \frac{1}{x-2} = 2$.'
  - Simplifica el denominador de la fracción tachándolo con su parte correspondiente
    en el MCM.
