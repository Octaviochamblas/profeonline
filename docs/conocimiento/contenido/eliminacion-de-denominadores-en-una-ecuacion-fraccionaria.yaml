semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.ELIMINACION_DENOMINADORES
resumen_inicial: 'Eliminación de denominadores en una ecuación fraccionaria: propiedades,
  resolución y modelamiento en Ecuaciones fraccionarias de primer grado.'
explicacion_simple: El MCM debe visitar a **cada término** de la ecuación (cada término,
  incluso los que no tienen fracción).
explicacion_formal: '### Definición formal


  Multiplicar una ecuación fraccionaria por su MCM algebraico $M$ transforma cada
  término $\frac{p_i(x)}{q_i(x)}$ en $\frac{M}{q_i(x)}p_i(x)$, una expresión polinomial
  pues $q_i(x)$ divide exactamente a $M$; el paso debe aplicarse a todos los términos
  de la ecuación, incluidos los que no tienen denominador explícito.


  ### Desarrollo didáctico


  El MCM debe visitar a **cada término** de la ecuación (cada término, incluso los
  que no tienen fracción).

  - Al visitar $\frac{3}{x}$, la ''x'' se cancela y queda $3(x-2)$.

  - Al visitar $\frac{1}{x-2}$, el $(x-2)$ se cancela y queda $1(x)$.

  - Al visitar el 2 (no lo olvides.), no se cancela nada, queda $2x(x-2)$.


  La ecuación plana resultante es: $3(x-2) + x = 2x(x-2)$. Todo el peligro de dividir
  ha desaparecido.'
definiciones_clave: '- **Eliminación de denominadores en una ecuación fraccionaria**:
