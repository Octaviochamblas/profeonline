procedimiento:
- 'Paso 1: Determinar el m.c.m. de todos los denominadores de la ecuación.'
- 'Paso 2: Para cada fracción, dividir el m.c.m. entre su denominador para calcular su factor complementario.'
- 'Paso 3: Escribir cada numerador entre paréntesis multiplicado por su factor complementario.'
- 'Paso 4: Expandir los productos mediante la propiedad distributiva respetando los signos algebraicos.'
- 'Paso 5: Resolver la ecuación lineal entera resultante.'
errores_correccion: '- **Error 1:** Multiplicar el factor complementario solo por el primer término del numerador binomio
  (escribir $3 \cdot (3x - 1)$ como $9x - 1$). **Cómo corregirlo:** El factor complementario **DEBE MULTIPLICAR A TODOS LOS
  TÉRMINOS DEL NUMERADOR MEDIANTE PROPIEDAD DISTRIBUTIVA ($3(3x - 1) = 9x - 3$)**.

  - **Error 2:** Omitir el cambio de signo de los términos del numerador cuando la fracción está precedida por un signo menos
  ($-\frac{A - B}{D}$). **Cómo corregirlo:** El signo negativo precediendo a la fracción **CAMBIA LOS SIGNOS DE TODOS LOS
  TÉRMINOS DEL NUMERADOR AL ELIMINAR EL DENOMINADOR ($-(A - B) = -A + B$)**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al eliminar denominadores en $\frac{x + 2}{4} = \frac{x}{3}$, ¿cuál es la ecuación entera obtenida?
  alternativas:
  - $3(x + 2) = 4x$
  - $4(x + 2) = 3x$
  - $3x + 2 = 4x$
  respuesta: $3(x + 2) = 4x$
  solucion_pasos:
  - 1. m.c.m. de $4$ y $3$ es $12$.
  - 2. $12 \cdot \frac{x + 2}{4} = 3(x + 2)$.
  - 3. $12 \cdot \frac{x}{3} = 4x \implies 3(x + 2) = 4x$.
- titulo: Ejemplo 2
  enunciado: Simplifica la expresión entera equivalente a $-\frac{x - 5}{2} = 3$ tras eliminar denominadores.
  alternativas:
  - $-(x - 5) = 6 \implies -x + 5 = 6$
  - $-x - 5 = 6$
  - $x - 5 = 6$
  respuesta: $-(x - 5) = 6 \implies -x + 5 = 6$
  solucion_pasos:
  - '1. Multiplicar por $2$: $-(x - 5) = 6$.'
  - '2. Distribuir el signo menos: $-x + 5 = 6$.'
- titulo: Paréntesis en numeradores
  enunciado: ¿Proteger los numeradores polinomiales con paréntesis previene errores de distribuciones de signos?
  respuesta: Sí
  solucion_pasos:
  - Sí, garantiza la correcta aplicación de la propiedad distributiva.
- titulo: Cancelación exacta
  enunciado: ¿La división entre el m.c.m. y el denominador de cualquier término debe resultar siempre en un polinomio entero
    sin fracción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de mínimo común múltiplo.
errores_frecuentes:
- Multiplicar el factor complementario únicamente por el primer término de un numerador binomio.
- Omitir el cambio de signo de todos los términos del numerador cuando la fracción está precedida por un signo menos.
- Multiplicar el numerador por su propio denominador en vez de por el factor complementario del m.c.m.
- Omitir la multiplicación por el m.c.m. en los términos enteros independientes de la ecuación.
- Invertir indebidamente numeradores y denominadores al simplificar una proporción fraccionaria.
afirmaciones_verdaderas:
- Al eliminar un denominador, su numerador queda multiplicado por el factor complementario del m.c.m. entre paréntesis.
- Un signo negativo delante de una fracción cambia el signo de todos los términos de su numerador al eliminar el denominador.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/eliminacion-de-denominadores-en-una-ecuacion-fraccionaria-resumen.svg)


  QUÉ: Eliminar denominadores en una ecuación fraccionaria de primer grado.

  CÓMO: Dividir el m.c.m. entre cada denominador para obtener los factores complementarios ($C_i(x) = \frac{M(x)}{D_i(x)}$),
  multiplicar los numeradores usando paréntesis y expandir la ecuación entera resultante.

  '
