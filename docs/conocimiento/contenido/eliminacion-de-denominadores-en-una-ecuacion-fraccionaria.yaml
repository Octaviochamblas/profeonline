semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.ELIMINACION_DENOMINADORES
resumen_inicial: La eliminación de denominadores simplifica las expresiones fraccionarias multiplicando cada numerador por
  los factores complementarios del m.c.m.
explicacion_simple: 'Al multiplicar una ecuación por el m.c.m. de sus denominadores, el denominador de cada fracción se simplifica
  o cancela al dividirse contra el factor correspondiente del m.c.m.


  El numerador de cada término simplemente se multiplica por los factores sobrantes (complementarios) del m.c.m. que su propio
  denominador no poseía.


  Este paso convierte expresiones fraccionarias complejas en productos sencillos entre paréntesis sobre una ecuación entera.


  ![Eliminación de denominadores](/static/img/nodos/eliminacion-de-denominadores-en-una-ecuacion-fraccionaria-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea la fracción $\frac{N_i(x)}{D_i(x)}$ presente en una ecuación fraccionaria multiplicada por $M(x) = \operatorname{mcm}(D_1,
  \dots, D_k)$. La **regla de simplificación de término** se expresa como:


  $$M(x) \cdot \frac{N_i(x)}{D_i(x)} = N_i(x) \cdot \left(\frac{M(x)}{D_i(x)}\right) = N_i(x) \cdot C_i(x)$$


  ### Desglose de la fórmula

  - $\frac{M(x)}{D_i(x)} = C_i(x)$: Factor complementario polinomial obtenido al cancelar $D_i(x)$ dentro de $M(x)$.

  - $N_i(x) \cdot C_i(x)$: Producto entero resultante donde el numerador $N_i(x)$ queda protegido obligatoriamente por paréntesis.


  ### Síntesis didáctica

  El uso de paréntesis al sustituir denominadores por sus factores complementarios previene errores de signos en numeradores
  binomios o polinomios.

  '
definiciones_clave: '- **Factor complementario**: Producto de los factores del m.c.m. que no figuran en el denominador del
  término considerado.

  - **Cancelación de denominador**: División exacta del m.c.m. entre el denominador de la fracción que transforma la expresión
  en entera.

  '
propiedades_relaciones: '- **Producto cruzado en proporciones**: En proporciones de la forma $\frac{A}{B} = \frac{C}{D}$,
  la eliminación de denominadores se reduce directamente a $A \cdot D = B \cdot C$.

  - **Preservación de signos de resta**: En términos restando $-\frac{N(x)}{D(x)}$, el signo negativo afecta a todo el producto
  $-(N(x) \cdot C(x))$.

  '
ejemplo_guiado:
  enunciado: Aplica la eliminación de denominadores en la proporción fraccionaria $\frac{3x - 1}{5} = \frac{2x + 4}{3}$ y
    evalúa la solución.
  pasos:
  - 'Paso 1: Multiplicar en cruz aplicando el m.c.m. $15$: $3(3x - 1) = 5(2x + 4)$.'
  - 'Paso 2: Aplicar la propiedad distributiva en ambos miembros: $9x - 3 = 10x + 20$.'
  - 'Paso 3: Trasponer términos semejantes: $-3 - 20 = 10x - 9x$.'
  - 'Paso 4: Obtener la solución final: $-23 = x \implies x = -23$.'
  - 'Paso 5: Comprobar sustituyendo $x = -23$: $\frac{3(-23) - 1}{5} = \frac{-70}{5} = -14$ y $\frac{2(-23) + 4}{3} = \frac{-42}{3}
    = -14$, confirmando $x = -23$.'
  imagen: /static/img/nodos/eliminacion-de-denominadores-en-una-ecuacion-fraccionaria-ejemplos.svg
