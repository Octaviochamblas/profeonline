semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.ELIMINACION_DENOMINADORES
resumen_inicial: La eliminación de denominadores simplifica las fracciones fraccionarias
  multiplicando cada numerador por los factores restantes del m.c.m.
explicacion_simple: 'Al multiplicar una ecuación por el m.c.m., el denominador de
  cada fracción se ''cancela'' con el factor igual del m.c.m.

  El numerador restante simplemente se multiplica por los factores del m.c.m. que
  su propio denominador NO tenía.

  Este paso convierte fracciones compuestas en productos entre paréntesis sencillos.'
explicacion_formal: 'Sea la fracción $\frac{N_i(x)}{D_i(x)}$ en una ecuación multiplicada
  por $M(x) = \operatorname{mcm}(D_1, \dots, D_k)$. La **regla de simplificación de
  término** establece:


  $$M(x) \cdot \frac{N_i(x)}{D_i(x)} = N_i(x) \cdot \left(\frac{M(x)}{D_i(x)}\right)$$


  **Desglose de la fórmula:**

  - $\frac{M(x)}{D_i(x)}$: Factor complementario del denominador que multiplica al
  numerador $N_i(x)$.'
definiciones_clave: '- **Factor complementario**: Producto de los factores del m.c.m.
  que no están presentes en el denominador de la fracción analizada.'
propiedades_relaciones: '- **Relación con proporciones**: En igualdades de dos fracciones
  $\frac{A}{B} = \frac{C}{D}$, la eliminación de denominadores equivale a la regla
  del producto cruzado $A \cdot D = B \cdot C$.'
ejemplo_guiado:
  enunciado: Aplica eliminación de denominadores en la proporción $\frac{3x - 1}{5}
    = \frac{2x + 4}{3}$ y evalúa la solución.
  pasos:
  - 'Paso 1: Multiplicar en cruz aplicando el m.c.m. $15$: $3(3x - 1) = 5(2x + 4)$.Paso
    2: Aplicar la propiedad distributiva: $9x - 3 = 10x + 20$.Paso 3: Trasponer términos:
    $-3 - 20 = 10x - 9x$.Paso 4: Obtener la solución: $-23 = x \implies x = -23$.Paso
    5: Comprobar: $\frac{3(-23) - 1}{5} = \frac{-69 - 1}{5} = \frac{-70}{5} = -14$
    y $\frac{2(-23) + 4}{3} = \frac{-46 + 4}{3} = \frac{-42}{3} = -14$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la eliminación de denominadores en $\frac{3x - 1}{5} = \frac{2x
    + 4}{3}$, ¿cuál es la ecuación entera obtenida?
  choices:
  - text: $3(3x - 1) = 5(2x + 4)$
    is_correct: true
  - text: $5(3x - 1) = 3(2x + 4)$
    is_correct: false
  - text: $9x - 1 = 10x + 4$
    is_correct: false
  - text: $3x - 1 = 2x + 4$
    is_correct: false
  explanation: La alternativa correcta es '$3(3x - 1) = 5(2x + 4)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $\frac{3x - 1}{5} = \frac{2x + 4}{3}$, ¿cuál es la solución
    de $x$?
  choices:
  - text: $x = -23$
    is_correct: true
  - text: $x = 23$
    is_correct: false
  - text: $x = -14$
    is_correct: false
  - text: $x = -7$
    is_correct: false
  explanation: La alternativa correcta es '$x = -23$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar cada término por el m.c.m. de los denominadores.'
- 'Paso 2: Cancelar el denominador de cada fracción con su equivalente dentro del
  m.c.m.'
- 'Paso 3: Escribir cada numerador dentro de paréntesis multiplicado por el factor
  sobrante.'
- 'Paso 4: Expandir los paréntesis y despejar.'
errores_correccion: '- **Error común:** Olvidar poner paréntesis alrededor del numerador
  al multiplicarlo por el factor sobrante.

  - **Cómo corregirlo:** Pon SIEMPRE el numerador entre paréntesis al eliminar el
  denominador: $3(3x - 1)$ para distribuir a todos sus términos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
