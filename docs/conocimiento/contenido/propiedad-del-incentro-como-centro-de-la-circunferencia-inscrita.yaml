semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.CIRCUNFERENCIA_INSCRITA_CENTRO
resumen_inicial: La circunferencia inscrita (o incírculo) de un triángulo es la única
  circunferencia tangente interiormente a los tres lados de la figura, cuyo centro
  es el incentro ($I$) y su radio es el inradio ($r$).
explicacion_simple: '![Circunferencia Inscrita](/static/img/nodos/propiedad-del-incentro-como-centro-de-la-circunferencia-inscrita-intro.svg)


  Imagina colocar una rueda dentro de un triángulo de modo que toque las tres paredes
  sin salirse:


  - **Centro en el incentro**: El centro exacto de esa rueda es el **incentro** ($I$).

  - **Toca los tres lados**: Roza cada lado en un solo punto (llamado punto de tangencia).

  - **La más grande posible adentro**: Es la circunferencia más grande que cabe completamente
  dentro del triángulo.

  '
explicacion_formal: '### Teorema formal

  El incentro $I$ es el centro de la **circunferencia inscrita** (o incírculo) $\mathcal{C}(I,
  r)$, la cual es tangente interior a los tres lados del triángulo:


  $$\mathcal{C}(I, r) \subset \Delta ABC \quad \land \quad \|\mathcal{C}(I, r) \cap
  \operatorname{Lados}(\Delta ABC)\| = 3$$


  $$\operatorname{Área}(\Delta ABC) = r \cdot s = r \cdot \left( \frac{a + b + c}{2}
  \right)$$


  ### Desglose simbólico y geométrico

  - $\mathcal{C}(I, r)$: Circunferencia inscrita de centro $I$ y radio $r$.

  - $s = \frac{a+b+c}{2}$: Semiperímetro del triángulo.

  - Despeje del inradio: $r = \frac{\operatorname{Área}(\Delta ABC)}{s} = \frac{2A}{a+b+c}$.


  ### Síntesis didáctica

  El incírculo es el círculo máximo contenido dentro del triángulo, y su radio relaciona
  directamente el área con el perímetro de la figura.'
definiciones_clave: '- **Circunferencia inscrita (Incírculo)**: Circunferencia tangente
  interiormente a los tres lados de un triángulo.

  - **Punto de tangencia**: Punto único donde la circunferencia toca a un lado sin
  cortarlo.

  - **Segmentos tangentes**: Segmentos congruentes medidos desde un vértice hasta
  los dos puntos de contacto adyacentes.

  '
propiedades_relaciones: '- **Tangencia y perpendicularidad**: El radio hacia el punto
  de tangencia es perpendicular al lado: $\overline{ID_a} \perp \overline{BC}$.

  - **Segmentos de contacto**: Longitud de tangentes desde los vértices: $x = s -
  a$, $y = s - b$, $z = s - c$.

  - **Existencia y unicidad**: Todo triángulo admite una y solo una circunferencia
  inscrita.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Circunferencia Inscrita](/static/img/nodos/propiedad-del-incentro-como-centro-de-la-circunferencia-inscrita-ejemplos.svg)


    Un triángulo tiene lados de longitudes $a = 7\text{ cm}$, $b = 8\text{ cm}$ y
    $c = 9\text{ cm}$. Calcula el semiperímetro $s$ y la longitud del segmento tangente
    desde el vértice $A$ hacia los puntos de contacto del incírculo.

    '
  pasos:
  - 'Paso 1: Calcular el semiperímetro $s$: $s = \frac{a + b + c}{2} = \frac{7 + 8
    + 9}{2} = \frac{24}{2} = 12\text{ cm}$.'
  - 'Paso 2: Identificar la fórmula del segmento tangente desde el vértice $A$: $x
    = s - a$.'
  - 'Paso 3: Calcular la longitud: $x = 12 - 7 = 5\text{ cm}$.'
  - 'Paso 4: Concluir que los segmentos tangentes desde el vértice $A$ miden $5\text{
    cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué punto del triángulo es el centro de la circunferencia inscrita?
  choices:
  - text: El incentro
    is_correct: true
  - text: El circuncentro
    is_correct: false
  - text: El ortocentro
    is_correct: false
  - text: El baricentro
    is_correct: false
  explanation: El incentro es el centro de la circunferencia inscrita en el triángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo con semiperímetro s = 15 cm y lado opuesto a = 9 cm, ¿cuánto
    mide el segmento tangente desde el vértice A?
  choices:
  - text: $6\text{ cm}$
    is_correct: true
  - text: $15\text{ cm}$
    is_correct: false
  - text: $9\text{ cm}$
    is_correct: false
  - text: $3\text{ cm}$
    is_correct: false
  explanation: Mide $6\text{ cm}$, ya que el segmento tangente es $s - a = 15 - 9
    = 6\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar el incentro $I$ mediante la intersección de las bisectrices.'
- 'Paso 2: Trazar el segmento perpendicular desde $I$ hacia uno de los lados para
  obtener el inradio $r$.'
- 'Paso 3: Con centro en $I$ y radio $r$, trazar la circunferencia inscrita asegurando
  la tangencia con los tres lados.'
- 'Paso 4: Si se requieren longitudes tangentes, aplicar $x = s - a, y = s - b, z
  = s - c$.'
errores_correccion: No confundas el incírculo (dentro del triángulo, centro I) con
  el circuncírculo (fuera del triángulo, pasa por vértices, centro O).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los lados de un triángulo miden $5\text{ cm}$, $6\text{ cm}$ y $7\text{
    cm}$, ¿cuál es la longitud del segmento tangente desde el vértice opuesto al lado
    de $5\text{ cm}$?
  alternativas:
  - $4\text{ cm}$
  - $9\text{ cm}$
  - $5\text{ cm}$
  respuesta: $4\text{ cm}$
  solucion_pasos:
  - Semiperímetro $s = \frac{5 + 6 + 7}{2} = 9\text{ cm}$.
  - 'Segmento tangente: $x = s - a = 9 - 5 = 4\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuántos puntos de tangencia tiene la circunferencia inscrita con el
    triángulo?
  alternativas:
  - $3\text{ puntos}$
  - $1\text{ punto}$
  - $6\text{ puntos}$
  respuesta: $3\text{ puntos}$
  solucion_pasos:
  - Toca exactamente a cada uno de los 3 lados en un punto de tangencia.
- titulo: ¿La circunferencia inscrita toca a los tres lados del triángulo en un único
    punto por lado?
  respuesta: Sí
  solucion_pasos:
  - Sí, es tangente interior a cada uno de los 3 lados.
- titulo: ¿La circunferencia inscrita pasa por los tres vértices del triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, la que pasa por los tres vértices es la circunferencia circunscrita.
errores_frecuentes:
- Confundir circunferencia inscrita con circunferencia circunscrita.
- Creer que la circunferencia inscrita pasa por los vértices del triángulo.
- Pensar que los puntos de tangencia son los pies de las bisectrices.
- Olvidar la fórmula de tangentes $s - a$ al calcular segmentos en los lados.
- Asumir que el radio al punto de tangencia no es perpendicular al lado.
afirmaciones_verdaderas:
- El incentro es el centro de la circunferencia inscrita en el triángulo.
- Los segmentos tangentes trazados desde un vértice hasta los puntos de contacto miden
  $s - a$.
al_terminar_debes_poder: '**QUÉ:** Definir, construir y calcular propiedades métricas
  de la circunferencia inscrita (incírculo).


  **CÓMO:** Ubicando el incentro como centro, trazando los radios de tangencia perpendiculares
  y calculando segmentos tangentes mediante $s - a$.


  ![Resumen de Circunferencia Inscrita](/static/img/nodos/propiedad-del-incentro-como-centro-de-la-circunferencia-inscrita-resumen.svg)

  '
