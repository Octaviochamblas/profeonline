semantic_id: MAT.ALG.FACTOR_CUBOS.DIFERENCIA_POTENCIAS_IMPARES
resumen_inicial: 'La factorización de diferencia de potencias impares iguales establece la generalización de la diferencia
  de cubos para cualquier exponente impar $n$: $A^n - B^n = (A - B)(A^{n-1} + A^{n-2}B + A^{n-3}B^2 + \dots + B^{n-1})$ donde
  todos los términos del cociente son positivos.'
explicacion_simple: "Las diferencias de cubos ($A^3 - B^3$) se generalizan perfectamente para **cualquier exponente impar\
  \ igual** ($A^5 - B^5, A^7 - B^7, \\dots$):\n- **REGLA GENERAL PARA DIFERENCIA DE POTENCIAS IMPARES ($n = 3, 5, 7, \\dots$)**:\n\
  \  $$\\mathbf{A^n - B^n = (A - B)(A^{n-1} + A^{n-2}B + A^{n-3}B^2 + \\dots + B^{n-1})}$$\n- **Características del polinomio\
  \ largo de $n$ términos**:\n  1. **Binomio Resta $(A - B)$**: Empieza siempre con la resta directa de las bases.\n  2. **Los\
  \ exponentes de $A$ bajan**: Empieza en $A^{n-1}$ y disminuye de a 1 hasta llegar a $A^0 = 1$.\n  3. **Los exponentes de\
  \ $B$ suben**: Empieza en $B^0 = 1$ y aumenta de a 1 hasta llegar a $B^{n-1}$.\n  4. **¡TODOS los signos son POSITIVOS!**:\
  \ $+ , + , + , + , + , \\dots$\n- **Ejemplo con $n = 5$ ($x^5 - y^5$)**:\n  $$(x - y)(x^4 + x^3y + x^2y^2 + xy^3 + y^4)$$\n\
  \n![Diferencia de potencias impares iguales](/static/img/nodos/factorizacion-de-diferencia-de-potencias-impares-iguales-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la familia de polinomios binómicos sustractivos $P_n(A, B) = A^n - B^n \in \mathbb{R}[A, B]$ parametrizada por el grado
  impar $n \in \{2k + 1 \mid k \in \mathbb{N}\}$. El **Teorema de Factorización Sustractiva Impar** establece la descomposición:


  $$\mathbf{A^n - B^n = (A - B) \sum_{k=0}^{n-1} A^{n-1-k} B^k}$$


  ### Demostración por Raíz Directa

  Evaluando el polinomio en $A = B$:


  $$P_n(B, B) = B^n - B^n = 0$$


  Por el **Teorema del Factor**, $(A - B)$ es obligatoriamente un factor divisible de $A^n - B^n$ tanto para potencias impares
  como pares. La división de polinomios entrega un cociente exacto de $n$ términos donde **todos los coeficientes y signos
  son estrictamente positivos**: $\sum_{k=0}^{n-1} A^{n-1-k} B^k$.


  ### Síntesis didáctica

  Toda diferencia de potencias impares iguales $A^n - B^n$ se factoriza como la resta de sus bases $(A - B)$ multiplicada
  por un polinomio de $n$ términos positivos con potencias decrecientes de $A$ y crecientes de $B$.

  '
definiciones_clave: '- **Diferencia de potencias impares iguales**: Binomio $A^n - B^n$ con exponente impar $n \in \{3, 5,
  7, 9, \dots\}$.

  - **Cociente positivo de potencias**: Polinomio de $n$ términos compuesto exclusivamente por adiciones ($+ + + \dots$) que
  acompaña a $(A-B)$.

  - **Divisibilidad universal por $(A-B)$**: Propiedad por la cual $A - B$ anula siempre a $A^n - B^n$.

  '
propiedades_relaciones: '- **Generalización de diferencia de cubos**: Cuando $n=3$, la expresión da exactamente $(A-B)(A^2
  + AB + B^2)$.

  '
ejemplo_guiado:
  enunciado: Factoriza la diferencia de quintas potencias $x^5 - 32$.
  pasos:
  - 'Paso 1: Identificamos el exponente impar $n = 5$.'
  - 'Paso 2: Extraemos las bases quintas: - $A = \sqrt[5]{x^5} = x$. - $B = \sqrt[5]{32} = 2$.'
  - 'Paso 3: Escribimos el primer factor binómico resta $(A - B)$: $(x - 2)$.'
  - 'Paso 4: Construimos los 5 términos del segundo factor con todos los signos POSITIVOS: - $+A^4 = +x^4$. - $+A^3 B = +(x^3
    \cdot 2) = +2x^3$. - $+A^2 B^2 = +(x^2 \cdot 2^2) = +4x^2$. - $+A B^3 = +(x \cdot 2^3) = +8x$. - $+B^4 = +2^4 = +16$.'
  - 'Paso 5: Ensamblamos el producto: $(x - 2)(x^4 + 2x^3 + 4x^2 + 8x + 16)$.'
  - 'Conclusión: La factorización es **$(x - 2)(x^4 + 2x^3 + 4x^2 + 8x + 16)$**.'
  imagen: /static/img/nodos/factorizacion-de-diferencia-de-potencias-impares-iguales-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué todos los signos del polinomio cociente en la diferencia de potencias impares $A^n - B^n = (A - B)(\dots)$
    son positivos?
  choices:
  - text: Porque al multiplicar el binomio resta $-B$ por los términos positivos del cociente se generan los opuestos aditivos
      que cancelan automáticamente todos los términos intermedios
    is_correct: true
  - text: Porque los números negativos no existen en esta regla
    is_correct: false
  - text: Por un acuerdo estético
    is_correct: false
  - text: Porque $A^n - B^n$ es siempre un número positivo
    is_correct: false
  explanation: La alternativa correcta es 'Porque al multiplicar el binomio resta $-B$ por los términos positivos del cociente
    se generan los opuestos aditivos que cancelan automáticamente todos los términos intermedios'. Cancelación sistemática
    de términos intermedios en $A^n-B^n$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la factorización de la diferencia $a^7 - b^7$?
  choices:
  - text: La factorización es $(a - b)(a^6 + a^5b + a^4b^2 + a^3b^3 + a^2b^4 + ab^5 + b^6)$, con 7 términos positivos
    is_correct: true
  - text: La factorización es $(a - b)(a^6 - a^5b + a^4b^2 - a^3b^3 + a^2b^4 - ab^5 + b^6)$
    is_correct: false
  - text: La factorización es $(a + b)(a^6 + b^6)$
    is_correct: false
  - text: La factorización es $(a - b)^7$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $(a - b)(a^6 + a^5b + a^4b^2 + a^3b^3 + a^2b^4 + ab^5 + b^6)$,
    con 7 términos positivos'. Aplicación directa de la fórmula general con $n=7$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el exponente común $n$ sea impar ($n = 3, 5, 7, \dots$).'
- 'Paso 2: Calcular las bases $A$ y $B$ de las potencias enésimas.'
- 'Paso 3: Escribir el primer factor como el binomio resta $(A - B)$.'
- 'Paso 4: Escribir el segundo factor como un polinomio de $n$ términos con todos sus signos positivos ($+ + + \dots$), disminuyendo
  el exponente de $A$ y aumentando el de $B$.'
errores_correccion: '- **Error 1:** Alternar los signos del polinomio cociente (escribir $+ - + - \dots$) en lugar de ponerlos
  todos positivos. **Cómo corregirlo:** En la diferencia de potencias impares **TODOS LOS SIGNOS DEL SEGUNDO FACTOR SON STRICTAMENTE
  POSITIVOS ($+ + + \dots$)**.

  - **Error 2:** Colocar el binomio suma $(A + B)$ como primer factor en lugar del binomio resta $(A - B)$. **Cómo corregirlo:**
  Para la diferencia de potencias **EL PRIMER FACTOR DEBE SER SIEMPRE EL BINOMIO RESTA ($(A - B)$)**.

  '
ejemplos:
- titulo: Primer factor en diferencia
  enunciado: Para $a^5 - b^5$, ¿es el primer factor $(a - b)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la resta de las bases.
- titulo: Signos del cociente
  enunciado: En la diferencia de potencias impares, ¿son todos los términos del segundo factor positivos?
  respuesta: Sí
  solucion_pasos:
  - Sí, todos son adiciones.
- titulo: Número de términos
  enunciado: Para $x^5 - 1$, ¿tiene el polinomio cociente exactamente 5 términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $n = 5$.
- titulo: Diferencia con constante
  enunciado: Para $x^5 - 1$, ¿es $(x - 1)(x^4 + x^3 + x^2 + x + 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, con $B = 1$.
errores_frecuentes:
- Alternar los signos en el polinomio cociente al factorizar una diferencia de potencias impares.
- Utilizar el binomio suma (A + B) como divisor inicial en lugar del binomio resta (A - B).
- La potencia $B^{n-1}$ no es escrita en el último término del polinomio cociente.
- Intercambiar las reglas de potencias impares con las de potencias pares.
- Olvidar que las potencias de A descienden de $n-1$ a 0 mientras las de B ascienden de 0 a $n-1$.
afirmaciones_verdaderas:
- Toda diferencia de potencias impares iguales $A^n - B^n$ se factoriza como $(A - B)(A^{n-1} + A^{n-2}B + \dots + B^{n-1})$.
- Todos los términos del polinomio cociente de una diferencia de potencias impares poseen signo positivo.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/factorizacion-de-diferencia-de-potencias-impares-iguales-resumen.svg)


  QUÉ: Factorizar diferencias de potencias impares iguales Aⁿ - Bⁿ para cualquier exponente impar n.

  CÓMO: Aplicar $A^n - B^n = (A - B) \sum_{k=0}^{n-1} A^{n-1-k} B^k$ multiplicando el binomio resta $(A-B)$ por el cociente
  de $n$ términos con todos sus signos positivos ($+ + + \dots$).

  '
