semantic_id: MAT.ALG.FACTOR_CUBOS.DIFERENCIA_POTENCIAS_IMPARES
resumen_inicial: 'Factorización de diferencia de potencias impares iguales: concepto,
  método de descomposición y reglas en Factorización asociada a cubos.'
explicacion_simple: 'Para cerrar el círculo cósmico de los exponentes, abordaremos
  la Diferencia de Potencias Impares. A diferencia de las sumas (que alternan signos),
  las diferencias nos regalan el polinomio largo más amigable y relajado de todos:
  todo es positivo.'
explicacion_formal: '### Definición formal


  A diferencia de la suma, la diferencia genera un polinomio complementario 100% positivo.


  ### Desarrollo didáctico


  Pensemos en $x^5 - y^5$.

  Sabemos que el factor corto mantendrá el signo negativo: $(x - y)$.


  El factor largo seguirá la regla de la escalera que ya conoces:

  - La ''x'' empieza en $x^4$ y va bajando.

  - La ''y'' va subiendo.


  La gran ventaja es que NO hay que alternar signos. Como el binomio ya lleva el signo
  negativo, el polinomio largo compensa siendo pura positividad.


  $x^5 - y^5 = (x - y)(x^4 + x^3 y + x^2 y^2 + x y^3 + y^4)$.


  Este patrón (binomio negativo, todo el resto positivo) es la generalización de la
  regla de Diferencia de Cubos que vimos antes (donde el trinomio tenía signos $+
  + +$).'
definiciones_clave: '- **Factorización de diferencia de potencias impares iguales**:
  Técnica de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización de diferencia de potencias impares
  iguales.'
