resumen_inicial: 'La factorización de diferencia de potencias impares iguales expresa
  $a^n - b^n$ (con $n$ impar) como el producto del binomio resta por un polinomio
  con todos sus términos positivos: $(a - b)(a^{n-1} + a^{n-2}b + \dots + b^{n-1})$.'
explicacion_simple: 'Para factorizar $x^5 - y^5$, el primer paréntesis es la resta
  de las bases $(x - y)$. El segundo paréntesis contiene todos los términos posibles
  de grado 4 con signo MÁS: $(x^4 + x^3 y + x^2 y^2 + x y^3 + y^4)$. ¡Todos los signos
  dentro del segundo paréntesis son positivos!'
explicacion_formal: 'Sea $n \in \mathbb{N}$ un número entero (impar o par). La **Factorización
  de Diferencia de Potencias Iguales** responde a la identidad fundamental de divisibilidad
  polinomial en $\mathbb{R}$:


  $$A^n - B^n = (A - B) \sum_{j=0}^{n-1} A^{n-1-j} B^j$$


  **Desglose simbólico:**

  - $(A - B)$: Factor binomio resta derivado de la raíz trivial $A = B$.

  - $\sum_{j=0}^{n-1} A^{n-1-j} B^j = A^{n-1} + A^{n-2}B + A^{n-3}B^2 + \dots + B^{n-1}$:
  Polinomio completo de grado $n-1$ con todos sus coeficientes y signos strictly positivos.


  > **Complemento didáctico:** A diferencia de la suma, la resta $A^n - B^n$ SIEMPRE
  admite al factor $(A - B)$ tanto para $n$ impar como para $n$ par.'
definiciones_clave: '- **Factor resta universal**: Binomio $(A - B)$ que divide a
  $A^n - B^n$ para cualquier entero $n \ge 1$.

  - **Polinomio positivo de grado $n-1$**: Expresión desarrollada sin alternancia
  de signos (todos $+$).'
propiedades_relaciones: '- **Generalización de diferencia de cubos**: Para $n = 3$,
  $A^3 - B^3 = (A - B)(A^2 + AB + B^2)$, coincidiendo exactamente con la fórmula particular.'
ejemplo_guiado:
  enunciado: Factorice la diferencia de potencias impares iguales $x^5 - 1$.
  pasos:
  - 'Paso 1: Expresar el número 1 como potencia 5: $1 = 1^5 \implies A = x$ y $B =
    1$.'
  - 'Paso 2: Construir el primer factor binomio resta $(A - B)$: $(x - 1)$.'
  - 'Paso 3: Desarrollar el polinomio de grado 4 con todos sus términos positivos:'
  - '  - $x^4 + x^3(1) + x^2(1^2) + x(1^3) + 1^4 = x^4 + x^3 + x^2 + x + 1$.'
  - 'Paso 4: Multiplicar ambos factores: $(x - 1)(x^4 + x^3 + x^2 + x + 1)$.'
  - 'Conclusión: La factorización de $x^5 - 1$ es $(x - 1)(x^4 + x^3 + x^2 + x + 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo son los signos de los términos en el polinomio secundario de grado
    $n-1$ al factorizar $A^n - B^n$?
  choices:
  - text: Todos los términos tienen signo positivo (+)
    is_correct: true
  - text: Los signos se van alternando (+, -, +, -)
    is_correct: false
  - text: Todos los términos tienen signo negativo (-)
    is_correct: false
  - text: Solo el término central es positivo
    is_correct: false
  explanation: La alternativa correcta es 'Todos los términos tienen signo positivo
    (+)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $x^5 - 1$ con $A = x$ y $B = 1$, ¿cuál es el segundo factor
    polinomial obtenido?
  choices:
  - text: $x^4 + x^3 + x^2 + x + 1$
    is_correct: true
  - text: $x^4 - x^3 + x^2 - x + 1$
    is_correct: false
  - text: $x^5 + 1$
    is_correct: false
  - text: $x^4 - 1$
    is_correct: false
  explanation: La alternativa correcta es '$x^4 + x^3 + x^2 + x + 1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar ambos términos en la forma $A^n - B^n$.'
- 'Paso 2: Escribir el primer paréntesis binomio como la resta de las bases $(A -
  B)$.'
- 'Paso 3: Desarrollar el polinomio de grado $n-1$ disminuyendo las potencias de $A$,
  aumentando las de $B$ y colocando signo $+$ a todos los sumandos.'
errores_correccion: '- **Error 1: Alternar los signos en el polinomio secundario al
  factorizar $A^n - B^n$ produciendo $(A - B)(A^4 - A^3B + \dots)$.** **Cómo corregirlo:**
  La diferencia de potencias genera signos estrictamente positivos en todo el polinomio
  secundario.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice $a^5 - b^5$.
  alternativas:
  - $(a - b)(a^4 + a^3b + a^2b^2 + ab^3 + b^4)$
  - $(a - b)(a^4 - a^3b + a^2b^2 - ab^3 + b^4)$
  - $(a + b)(a^4 - a^3b + a^2b^2 - ab^3 + b^4)$
  respuesta: $(a - b)(a^4 + a^3b + a^2b^2 + ab^3 + b^4)$
  solucion_pasos:
  - 1. Binomio resta $(a - b)$.
  - 2. Polinomio de grado 4 con signos positivos.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la expresión factorizada de $x^7 - y^7$?
  alternativas:
  - $(x - y)(x^6 + x^5y + x^4y^2 + x^3y^3 + x^2y^4 + xy^5 + y^6)$
  - $(x + y)(x^6 - x^5y + x^4y^2 - x^3y^3 + x^2y^4 - xy^5 + y^6)$
  - $(x - y)^7$
  respuesta: $(x - y)(x^6 + x^5y + x^4y^2 + x^3y^3 + x^2y^4 + xy^5 + y^6)$
  solucion_pasos:
  - 1. Binomio resta $(x - y)$ y polinomio de grado 6 totalmente positivo.
- titulo: En la diferencia de potencias $A^n - B^n$, ¿el factor $(A - B)$ existe para
    cualquier entero $n \ge 1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la sustitución $A = B$ anula la expresión independientemente de la paridad
    de $n$.
- titulo: ¿El desarrollo del polinomio secundario de $x^5 - y^5$ contiene 5 términos
    de grado 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, contiene $x^4, x^3y, x^2y^2, xy^3, y^4$ (5 términos).
errores_frecuentes:
- Alternar signos $+,-,+,-$ dentro del polinomio secundario de una diferencia de potencias.
- Declarar que la diferencia de potencias impares no se puede factorizar cuando $B
  = 1$.
- Cambiar el primer paréntesis binomio a suma $(A + B)$ en lugar de mantener la resta
  $(A - B)$.
- Escribir exponentes incorrectos en las variables del polinomio de grado $n-1$.
- Declarar que la diferencia de potencias $A^n - B^n$ equivale a la potencia del binomio
  resta $(A - B)^n$.
afirmaciones_verdaderas:
- La diferencia $A^n - B^n$ es siempre divisible por $(A - B)$ para todo entero $n
  \ge 1$.
- El polinomio secundario obtenido de factorizar $A^n - B^n$ posee únicamente términos
  con signos positivos.
al_terminar_debes_poder: Al terminar serás capaz de factorizar diferencias de potencias
  impares iguales expresándolas en la forma $(A - B)(A^{n-1} + \dots + B^{n-1})$.
