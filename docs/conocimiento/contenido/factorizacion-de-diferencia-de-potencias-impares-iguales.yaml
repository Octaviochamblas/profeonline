procedimiento:
- 'Paso 1: Confirma que sea una diferencia (resta) de potencias iguales impares.'
- 'Paso 2: Escribe el factor corto como $(a - b)$.'
- 'Paso 3: Escribe el polinomio largo empezando con $a^{n-1}$.'
- 'Paso 4: Usa SÓLO signos positivos (+).'
- 'Paso 5: Sigue bajando el exponente de ''$a$'' y subiendo el de ''$b$'' en cada
  término.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización de diferencia de potencias impares iguales.
ejemplos:
- titulo: Factoriza $p^7 - q^7$
  enunciado: Factoriza $p^7 - q^7$.
  solucion_pasos:
  - 'Factor corto: $(p - q)$.'
  - El largo empieza en $p^6$ y son 7 términos, todos positivos.
  - 'Respuesta: $(p - q)(p^6 + p^5 q + p^4 q^2 + p^3 q^3 + p^2 q^4 + p q^5 + q^6)$.'
- titulo: Factoriza $x^5 - 1$.
  solucion_pasos:
  - El 1 a cualquier potencia es 1. El binomio es (x-1). El factor largo es la escalera
    decreciente de x hasta 1, todo con signo positivo.
- titulo: 'Respecto de «Factorización de diferencia de potencias impares iguales»:
    ¿Describe adecuadame'
  enunciado: 'Respecto de «Factorización de diferencia de potencias impares iguales»:
    ¿Describe adecuadamente el concepto esta frase? «La expresión $a^n - b^n$ (con
    $n$ impar) siempre es divisible por $(a-b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La expresión $a^n - b^n$ (con
    $n$ impar) siempre es divisible por $(a-b)$.'
- titulo: 'Respecto de «Factorización de diferencia de potencias impares iguales»:
    ¿Se puede aceptar es'
  enunciado: 'Respecto de «Factorización de diferencia de potencias impares iguales»:
    ¿Se puede aceptar esta afirmación? «Alternar los signos en el polinomio largo
    (confundiéndolo con la regla de la suma de potencias)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La expresión $a^n - b^n$ (con
    $n$ impar) siempre es divisible por $(a-b)$.'
errores_frecuentes:
- Alternar los signos en el polinomio largo (confundiéndolo con la regla de la suma
  de potencias).
- Poner un signo $+$ en el factor corto (binomio).
- Para «En la factorización de la diferencia de potencias impares ($a^n - b^n$), ¿qué
  signos lleva el polinomio largo», la respuesta correcta es Alternados.
- Para «En la factorización de la diferencia de potencias impares ($a^n - b^n$), ¿qué
  signos lleva el polinomio largo», la respuesta correcta es Todos negativos.
- Solo el primero y el último son positivos.
afirmaciones_verdaderas:
