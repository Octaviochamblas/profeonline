semantic_id: MAT.ALG.DESIG_PROPIEDADES.MULTIPLICACION_POSITIVA
resumen_inicial: 'Multiplicación de una desigualdad por una cantidad positiva: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Al ampliar o escalar valores en una desigualdad mediante multiplicación,
  es vital entender que los números positivos preservan el orden relativo entre las
  cantidades.
explicacion_formal: '### Definición formal

  Sean $a, b, c \in \mathbb{R}$, con $c > 0$. Si $a < b$, entonces $a \cdot c < b
  \cdot c$. Análogamente para $>, \leq$ y $\geq$.


  ### Desarrollo didáctico

  Multiplicar por un número positivo es como estirar proporcionalmente una recta numérica.
  Las distancias cambian, pero el número que estaba a la derecha seguirá estando a
  la derecha.'
definiciones_clave: '- **Multiplicación de una desigualdad por una cantidad positiva**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a multiplicación de una desigualdad por
  una cantidad positiva.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de multiplicación
    de una desigualdad por una cantidad positiva.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de multiplicación de una desigualdad por una
    cantidad positiva, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
