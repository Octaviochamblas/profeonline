semantic_id: MAT.ALG.DESIG_PROPIEDADES.MULTIPLICACION_POSITIVA
resumen_inicial: Multiplicar ambos miembros de una desigualdad por un número estrictamente
  positivo preserva el sentido de la desigualdad.
explicacion_simple: 'Si duplicas o triplicas las cantidades a ambos lados de una desigualdad
  usando un número positivo (como $+2$ o $+5$), la cantidad que era mayor sigue siendo
  la mayor.

  Por ejemplo, si $3 < 7$ y multiplicamos por $+2$, obtenemos $6 < 14$.

  El sentido de la desigualdad se mantiene exactamente igual.'
explicacion_formal: 'Para todas las constantes $a, b, c \in \mathbb{R}$ con $c > 0$
  (estrictamente positivo):


  $$a < b \iff a \cdot c < b \cdot c \quad (c > 0)$$

  $$a \ge b \iff a \cdot c \ge b \cdot c \quad (c > 0)$$


  **Desglose of la fórmula:**

  - $c > 0$: Homotecia directa sobre la recta numérica que preserva el orden relativo.'
definiciones_clave: '- **Multiplicador positivo ($c > 0$)**: Escalar estrictamente
  mayor que cero que no altera la orientación del orden en $\mathbb{R}$.'
propiedades_relaciones: '- **Preservación del sentido**: El símbolo de orden mantiene
  su orientación original al multiplicar por números positivos.'
ejemplo_guiado:
  enunciado: Dada la desigualdad $-4 < 2$, multiplica ambos miembros por el escalar
    positivo $c = 3$ y verifica el resultado.
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $-4 < 2$.Paso 2: Multiplicar el primer
    miembro por $3$: $(-4) \cdot 3 = -12$.Paso 3: Multiplicar el segundo miembro por
    $3$: $2 \cdot 3 = 6$.Paso 4: Comparar ambos resultados: $-12 < 6$.Paso 5: Concluir
    que la relación $<$ se conserva verdaderamente.'
checkpoints:
- placement: after_explicacion_formal
  question: Al multiplicar una desigualdad $a < b$ por una cantidad $c > 0$, ¿qué
    ocurre con el sentido de la desigualdad?
  choices:
  - text: Permanece en el mismo sentido ($a \cdot c < b \cdot c$).
    is_correct: true
  - text: Se invierte obligatoriamente ($a \cdot c > b \cdot c$).
    is_correct: false
  - text: Se convierte en una igualdad ($a \cdot c = b \cdot c$).
    is_correct: false
  - text: Se anulan ambos miembros.
    is_correct: false
  explanation: La alternativa correcta es 'Permanece en el mismo sentido ($a \cdot
    c < b \cdot c$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al multiplicar $-4 < 2$ por el número positivo $3$, ¿cuál es la desigualdad
    obtenida?
  choices:
  - text: $-12 < 6$
    is_correct: true
  - text: $-12 > 6$
    is_correct: false
  - text: $12 < 6$
    is_correct: false
  - text: $-12 = 6$
    is_correct: false
  explanation: La alternativa correcta es '$-12 < 6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el número multiplicador $c$ sea estrictamente mayor que cero
  ($c > 0$).'
- 'Paso 2: Multiplicar el primer miembro por $c$.'
- 'Paso 3: Multiplicar el segundo miembro por $c$.'
- 'Paso 4: Mantener el mismo símbolo de desigualdad sin invertirlo.'
errores_correccion: '- **Error común:** Invertir el símbolo al multiplicar un número
  negativo por un positivo.

  - **Cómo corregirlo:** La regla de inversión solo se activa si el MULTIPLICADOR
  es negativo. Si el multiplicador es positivo, el símbolo NO SE CAMBIA.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
fuente: Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades
estado: publicado
