  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el signo del número para ubicarlo a la izquierda del origen (negativo) o a la derecha (positivo).'
- 'Paso 2: Acotar el número entre dos enteros consecutivos evaluando cuadrados o aproximaciones decimales conocidas.'
- 'Paso 3: Marcar la posición precisa del número en el segmento correspondiente de la recta real.'
errores_correccion: '- **Error 1: Ubicar números negativos en el orden invertido (pensar que $-4$ está a la derecha de $-3$).** **Cómo corregirlo:** En los negativos, a mayor magnitud absoluta, más a la IZQUIERDA queda el número ($-4 < -3$).

  - **Error 2: Pensar que los irracionales solo se pueden ubicar de forma aproximada.** **Cómo corregirlo:** Raíces como $\sqrt{2}$ o $\sqrt{5}$ se pueden ubicar con EXACTITUD geométrica usando regla, compás y el Teorema de Pitágoras.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Entre qué números enteros consecutivos se ubica $\sqrt{11}$ en la recta real?
  alternativas:
  - Entre 3 y 4 ($3 < \sqrt{11} < 4$)
  - Entre 2 y 3 ($2 < \sqrt{11} < 3$)
  - Entre 5 y 6 ($5 < \sqrt{11} < 6$)
  respuesta: Entre 3 y 4 ($3 < \sqrt{11} < 4$)
  solucion_pasos:
  - $3^2 = 9 < 11 < 16 = 4^2 \implies 3 < \sqrt{11} < 4$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la distancia euclidiana en la recta numérica entre $-3$ y $5$?
  alternativas:
  - 8 unidades
  - 2 unidades
  - -8 unidades
  respuesta: 8 unidades
  solucion_pasos:
  - $d(-3, 5) = |5 - (-3)| = |5 + 3| = 8$.
- titulo: ¿Corresponde cada punto de la recta a un único número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, la biyección entre la recta geométrica y $\mathbb{R}$ es total y biunívoca.
  alternativas:
  - texto: Sí, existe una correspondencia biunívoca exacta
    es_correcta: true
    retroalimentacion: ¡Correcto! Es el teorema fundamental de la recta real.
  - texto: No, algunos puntos quedan vacíos
    es_correcta: false
    retroalimentacion: Incorrecto, la completitud de $\mathbb{R}$ asegura que no hay puntos vacíos.
  - texto: Solo para números racionales
    es_correcta: false
    retroalimentacion: Incorrecto, los irracionales también ocupan puntos exactos.
- titulo: ¿Está el número -5 a la derecha de -2 en la recta numérica?
  respuesta: 'No'
  solucion_pasos:
  - No, $-5 < -2$, por lo que $-5$ está a la izquierda de $-2$.
  alternativas:
  - texto: No, está a la izquierda porque es menor
    es_correcta: true
    retroalimentacion: ¡Correcto! En la recta real, los menores están siempre a la izquierda.
  - texto: Sí, porque 5 es mayor que 2
    es_correcta: false
    retroalimentacion: Incorrecto, con signo negativo el orden se invierte ($-5 < -2$).
  - texto: Sí, porque ambos son negativos
    es_correcta: false
    retroalimentacion: Incorrecto, ser negativos no cambia la regla de izquierda/derecha.
errores_frecuentes:
- Invertir el orden de los números negativos en la recta real.
- Asumir que la recta numérica solo contiene números enteros marcados por rayas.
- Confundir la distancia euclidiana con la resta algebraica simple sin valor absoluto.
- Pensar que $\sqrt{2}$ queda ubicado en el 2 de la recta numérica.
- Creer que entre 1 y 2 no existen números irracionales.
afirmaciones_verdaderas:
- Existe una biyección perfecta entre los puntos de la recta y el conjunto de los números reales.
- Un número $a$ es menor que $b$ si y solo si $a$ se ubica a la izquierda de $b$ en la recta.
- La distancia entre dos números $a$ y $b$ en la recta es siempre $|b - a| \ge 0$.
al_terminar_debes_poder: '![Síntesis de la recta numérica real](/static/img/nodos/representacion-de-numeros-reales-en-la-recta-numerica-resumen.svg)


  QUÉ: Representar y ubicar cualquier número real en la recta numérica continua.


  CÓMO: Aplicando la biyección $f: \mathbb{R} \longleftrightarrow \text{Recta}$, acotando números irracionales y fracciones entre enteros consecutivos mediante cuadrados y aproximaciones decimales, y calculando distancias métricas mediante valor absoluto ($d(a, b) = |b - a|$).'
