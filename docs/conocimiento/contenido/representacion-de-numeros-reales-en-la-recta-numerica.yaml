guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.02.04'
  title: 'Representación de números reales en la recta numérica'
  description: 'Ubica y grafica con precisión y aproximación números reales (racionales e irracionales) en la recta numérica continua.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'representacion-de-numeros-reales-en-la-recta-numerica'
semantic_id: 'MAT.NUM.REALES.RECTA_NUMERICA'
titulo: 'Representación de números reales en la recta numérica'
objetivo: 'Ubicar de forma exacta o mediante construcciones geométricas/aproximaciones decimales números racionales e irracionales sobre la recta real.'
introduccion: 'La recta numérica no es solo una ilustración gráfica: es el modelo visual completo de los números reales. Mientras que los números racionales como $\frac{3}{4}$ o $-1{,}5$ se ubican dividiendo segmentos en partes iguales, los números irracionales como $\sqrt{2}$ o $\sqrt{5}$ se pueden ubicar geométricamente con regla y compás aplicando el Teorema de Pitágoras. De esta forma, cada punto de la recta tiene una dirección y distancia única respecto al origen $0$.'
resumen: 'A todo número real $r \in \mathbb{R}$ le corresponde un único punto sobre la recta real, donde el $0$ es el origen de referencia, los números positivos se ubican a la derecha y los negativos a la izquierda. Raíces irracionales de la forma $\sqrt{n}$ se pueden ubicar exactamente construyendo triángulos rectángulos cuyos lados correspondan a números conocidos.'
requisitos:
  - 'Teorema de Pitágoras y construcción de triángulos rectángulos.'
  - 'Ubicación de fracciones y decimales en la recta numérica.'
objetivos:
  - 'Ubicar números irracionales de la forma $\sqrt{n}$ en la recta numérica mediante el Teorema de Pitágoras.'
  - 'Comprender el concepto de la recta real continua como un modelo sin agujeros.'
que_aprenderas:
  - 'Cómo usar catetos enteros para construir geométricamente la posición exacta de $\sqrt{2}, \sqrt{3}, \sqrt{5}$.'
  - 'Cómo acotar irracionales entre dos enteros consecutivos para estimar su posición decimal.'
  - 'La simetría de los números reales positivos y negativos respecto al cero.'
al_terminar_debes_poder:
  - 'Ubicar correctamente un número real arbitrario (como $-\sqrt{3}$ o $1 + \sqrt{2}$) en la recta numérica.'
  - 'Explicar el método geométrico de construcción de raíces por triángulos rectángulos.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: 'Para ubicar de manera EXACTA el número irracional $\sqrt{2}$ sobre la recta numérica partiendo desde el origen $0$, ¿qué triángulo rectángulo se debe construir?'
    choices:
      - {text: 'Un triángulo rectángulo con catetos de longitud $1$ y $2$.', is_correct: false}
      - {text: 'Un triángulo rectángulo con catetos de longitud $1$ y $1$.', is_correct: true}
      - {text: 'Un triángulo rectángulo con hipotenusa $2$ y cateto $1$.', is_correct: false}
      - {text: 'Un triángulo equilátero de lado $1$.', is_correct: false}
    explanation: 'La correcta es: Un triángulo rectángulo con catetos de longitud $1$ y $1$. Por el Teorema de Pitágoras, la hipotenusa mide $h = \sqrt{1^2 + 1^2} = \sqrt{2}$. Al trasladar esa hipotenusa a la recta con un compás, se obtiene la ubicación exacta de $\sqrt{2}$.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: '¿Entre qué dos números enteros consecutivos se encuentra ubicado el número irracional $\sqrt{10}$ en la recta numérica?'
    choices:
      - {text: 'Entre $2$ y $3$.', is_correct: false}
      - {text: 'Entre $3$ y $4$.', is_correct: true}
      - {text: 'Entre $4$ y $5$.', is_correct: false}
      - {text: 'Entre $9$ y $10$.', is_correct: false}
    explanation: 'La correcta es: Entre $3$ y $4$. Como $9 < 10 < 16$, aplicando raíz cuadrada se tiene $\sqrt{9} < \sqrt{10} < \sqrt{16}$, es decir, $3 < \sqrt{10} < 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Para una raíz $\sqrt{k}$, identificar los dos cuadrados perfectos más cercanos para acotar su valor entre dos enteros consecutivos $a < \sqrt{k} < a+1$.'
  - 'Paso 2: Para una ubicación exacta de $\sqrt{k}$, descomponer $k$ como la suma de dos cuadrados $k = a^2 + b^2$.'
  - 'Paso 3: Dibujar sobre el eje un cateto de longitud $a$, en su extremo levantar un cateto perpendicular de longitud $b$, y proyectar la hipotenusa resultante $\sqrt{a^2+b^2}$ sobre la recta mediante un arco de compás.'
errores_frecuentes:
  - 'Confundir la posición de números negativos irracionales (por ejemplo, ubicar $-\sqrt{2} \approx -1{,}41$ a la derecha de $-1$ en lugar de a su izquierda).'
  - 'Creer que las raíces irracionales solo pueden ubicarse mediante estimaciones o aproximaciones decimales, ignorando su construcción geométrica exacta.'
errores_correccion: |
  Un error frecuente al ubicar negativos en la recta real es colocar $-\sqrt{5} \approx -2{,}23$ entre $-1$ y $-2$. Recuerda que en el semieje negativo, al alejarse del cero hacia la izquierda, los valores disminuyen: $-2{,}23$ se ubica **entre $-2$ y $-3$**, a la izquierda de $-2$.
ejemplos:
  - titulo: 'Construcción de raíz de 5'
    enunciado: '¿Cuáles deben ser las longitudes de los catetos de un triángulo rectángulo sobre la recta real para que su hipotenusa mida exactamente $\sqrt{5}$?'
    alternativas:
      - 'Catetos de longitud $1$ y $2$'
      - 'Catetos de longitud $2$ y $3$'
      - 'Catetos de longitud $1$ y $4$'
      - 'Catetos de longitud $2$ y $2$'
    respuesta: 'Catetos de longitud $1$ y $2$'
    solucion_pasos:
      - 'Buscamos dos enteros cuyos cuadrados sumen $5$: $a^2 + b^2 = 5$.'
      - 'Observamos que $2^2 + 1^2 = 4 + 1 = 5$.'
      - 'Por lo tanto, construyendo un cateto horizontal de longitud $2$ sobre la recta y un cateto vertical de longitud $1$, la hipotenusa medirá $h = \sqrt{2^2 + 1^2} = \sqrt{5}$.'
  - titulo: 'Ubicación acotada de irracionales'
    enunciado: 'Ordena de izquierda a derecha en la recta numérica los siguientes números reales: $A = -\sqrt{2}$, $B = 1{,}5$, $C = \pi$, $D = -2$.'
    alternativas:
      - '$D, A, B, C$'
      - '$A, D, B, C$'
      - '$D, B, A, C$'
      - '$A, B, D, C$'
    respuesta: '$D, A, B, C$'
    solucion_pasos:
      - 'Convertimos a valores aproximados:'
      - '$D = -2$'
      - '$A = -\sqrt{2} \approx -1{,}414$'
      - '$B = 1{,}5$'
      - '$C = \pi \approx 3{,}1416$'
      - 'Comparando de menor a mayor: $-2 < -1{,}414 < 1{,}5 < 3{,}1416$.'
      - 'Por lo tanto, el orden de izquierda a derecha en la recta es: $D, A, B, C$.'
comprobacion_rapida:
  - afirmacion: 'A cada número real le corresponde exactamente un único punto sobre la recta numérica.'
    respuesta: true
    explicacion: 'Correcto. Es la propiedad de correspondencia biunívoca entre $\mathbb{R}$ y la recta real.'
  - afirmacion: 'El número $-\sqrt{3}$ se ubica en la recta numérica entre los enteros $-1$ y $-2$.'
    respuesta: true
    explicacion: 'Correcto. Como $\sqrt{3} \approx 1{,}732$, $-\sqrt{3} \approx -1{,}732$, el cual se encuentra entre $-1$ y $-2$.'
  - afirmacion: 'Es imposible ubicar de manera geométricamente exacta el número $\sqrt{2}$ sobre la recta numérica.'
    respuesta: false
    explicacion: 'Falso. Es totalmente posible mediante la construcción de un triángulo rectángulo de catetos $1$ y $1$ y el uso del compás.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales.'
estado: 'publicado'
