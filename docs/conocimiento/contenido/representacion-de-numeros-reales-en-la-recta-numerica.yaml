semantic_id: MAT.NUM.REALES.RECTA_NUMERICA
resumen_inicial: Existe una biyección uno a uno (isomorfismo continuo) entre el conjunto
  de los números reales $\mathbb{R}$ y los puntos de una recta geométrica orientada.
explicacion_simple: La recta numérica real es como una regla infinita sin espacios
  en blanco. A cada número real (ya sea entero, fracción o raíz irracional) le corresponde
  un punto exacto en la recta, y a cada punto de la recta le corresponde un único
  número real.
explicacion_formal: 'El **Postulado de Cantor-Dedekind** establece la existencia de
  una correspondencia biyectiva $f$ entre el conjunto $\mathbb{R}$ y la recta geométrica
  $\mathcal{L}$:


  $$f: \mathbb{R} \to \mathcal{L} \quad \text{biyectiva y con preservación de orden}
  \quad (x < y \iff f(x) \text{ está a la izq. de } f(y))$$


  **Desglose del postulado:**

  - Inyectividad: No existen dos números reales distintos asignados al mismo punto
  geométrico.

  - Sobreyectividad: No existen puntos vacíos o ''huecos'' en la recta que no tengan
  un número real asociado.


  > **Complemento didáctico:** La completitud de $\mathbb{R}$ garantiza que la recta
  numérica sea una línea continua sin interrupciones.'
definiciones_clave: '- **Recta numérica real**: Representación geométrica continua
  del conjunto $\mathbb{R}$ bajo la biyección de Cantor-Dedekind.'
propiedades_relaciones: '- **Biyección y continuidad**: Asocia biunívocamente cada
  real $x$ a un punto geométrico $P$ de la recta.'
ejemplo_guiado:
  enunciado: Demuestre la ubicación exacta del número irracional $\sqrt{2}$ en la
    recta numérica mediante la construcción del triángulo rectángulo sobre el intervalo
    $[0,1]$.
  pasos:
  - 'Paso 1: Dibujar un triángulo rectángulo catetos de longitud $1$ sobre el segmento
    de $0$ a $1$ en la recta.'
  - 'Paso 2: Aplicar el Teorema de Pitágoras para hallar la hipotenusa $h$: $h^2 =
    1^2 + 1^2 = 2 \implies h = \sqrt{2}$.'
  - 'Paso 3: Con un compás centrado en $0$ y apertura $h = \sqrt{2}$, trazar un arco
    que corte la recta hacia la derecha.'
  - 'Paso 4: El punto de corte exacto sobre el eje es la coordenada exacta de $\sqrt{2}
    \approx 1,414...$'
  - 'Conclusión: Se ubica geométricamente el punto exacto de $\sqrt{2}$ demostrando
    que los irracionales ocupan puntos reales en la recta.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece el postulado de biyección sobre la recta numérica real?
  choices:
  - text: Que a cada número real le corresponde un único punto de la recta y a cada
      punto le corresponde un único número real
    is_correct: true
  - text: Que solo los enteros ocupan puntos en la recta
    is_correct: false
  - text: Que los irracionales no se pueden ubicar en la recta
    is_correct: false
  - text: Que la recta tiene infinitos huecos vacíos
    is_correct: false
  explanation: La alternativa correcta es 'Que a cada número real le corresponde un
    único punto de la recta y a cada punto le corresponde un único número real'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para ubicar sqrt(2), ¿qué teorema geométrico permitió
    construir la longitud exacta sqrt(2)?
  choices:
  - text: El Teorema de Pitágoras en un triángulo de catetos 1 y 1
    is_correct: true
  - text: El Teorema de Tales
    is_correct: false
  - text: La regla de tres simple
    is_correct: false
  - text: La división por 2
    is_correct: false
  explanation: La alternativa correcta es 'El Teorema de Pitágoras en un triángulo
    de catetos 1 y 1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Fijar el origen cero y la unidad de escala sobre una recta orientada.'
- 'Paso 2: Ubicar números racionales por subdivisión de la unidad o números irracionales
  por construcciones geométricas radicales.'
- 'Paso 3: Marcar el punto geométrico correspondiente al valor real de forma continua.'
errores_correccion: '- **Error 1: Creer que entre dos enteros en la recta solo hay
  una cantidad finita de puntos.** **Cómo corregirlo:** Por la completitud de $\mathbb{R}$,
  en cualquier intervalo continuo hay INFINITOS puntos reales.


  - **Error 2: Pensar que los irracionales como $\sqrt{2}$ son aproximados y por eso
  no tienen lugar exacto en la recta.** **Cómo corregirlo:** Tienen un punto geométrico
  EXACTO determinable por construcciones de compás y Pitágoras.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Entre qué números enteros se ubica $\sqrt{5}$ en la recta?
  alternativas:
  - Entre 2 y 3 (porque 2^2 = 4 y 3^2 = 9)
  - Entre 1 y 2
  - Entre 4 y 5
  respuesta: Entre 2 y 3 (porque 2^2 = 4 y 3^2 = 9)
  solucion_pasos:
  - Como $4 < 5 < 9 \implies \sqrt{4} < \sqrt{5} < \sqrt{9} \implies 2 < \sqrt{5}
    < 3$.
- titulo: Ejemplo 2
  enunciado: ¿Dónde se ubica $-\pi$ en la recta real?
  alternativas:
  - A la izquierda del cero entre -3 y -4
  - A la derecha del cero entre 3 y 4
  - En el cero exacto
  respuesta: A la izquierda del cero entre -3 y -4
  solucion_pasos:
  - $-\pi \approx -3,14159...$ ubicado a la izquierda entre $-3$ y $-4$.
- titulo: ¿Es la recta numérica real una línea perfectamente continua sin huecos?
  respuesta: Sí
  solucion_pasos:
  - Sí, gracias a la completitud del conjunto $\mathbb{R}$.
- titulo: ¿Se ubican los números reales mayores a la derecha en la recta orientada?
  respuesta: Sí
  solucion_pasos:
  - Sí, el orden del eje $X$ aumenta hacia la derecha.
errores_frecuentes:
- Los números irracionales no poseen una ubicación geométrica en la recta numérica.
- Entre dos números enteros consecutivos en la recta real existen únicamente cinco
  puntos numéricos.
- Ubicarse a la izquierda del cero en la recta numérica indica tener un valor absoluto
  mayor.
- La recta numérica real presenta agujeros en las coordenadas donde se ubican las
  raíces no exactas.
- Ubicar el número pi en la recta requiere dividir la recta por el entero 100.
afirmaciones_verdaderas:
- Existe una biyección perfecta entre el conjunto de los números reales $\mathbb{R}$
  y los puntos de la recta orientada.
- Tanto racionales como irracionales tienen una posición geométrica continua exacta
  en la recta numérica.
al_terminar_debes_poder: Al terminar serás capaz de ubicar números reales (racionales
  e irracionales) en la recta numérica continua, aplicando acotaciones enteras y construcciones
  geométricas radicales.
