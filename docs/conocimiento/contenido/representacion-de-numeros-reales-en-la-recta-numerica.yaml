semantic_id: MAT.NUM.REALES.RECTA_NUMERICA
resumen_inicial: Existe una correspondencia biunívoca (uno a uno) entre los números reales
  y los puntos de una recta geométrica continua (la recta real).
explicacion_simple: 'Cada número real tiene un punto exacto en la recta numérica:

  - Los enteros están a distancias regulares ($... -2, -1, 0, 1, 2 ...$).

  - Las fracciones están entre los enteros (ej: $1/2$ a la mitad entre $0$ y $1$).

  - Los irracionales también tienen su posición exacta (ej: $\sqrt{2} \approx 1{,}414$ un
  poco antes de $1{,}5$).

  No queda ningún hueco vacío en la recta.'
explicacion_formal: El axioma de la recta real establece un isomorfismo ordenado entre el
  conjunto $\mathbb{R}$ y una recta geométrica $L$. A cada número $x \in \mathbb{R}$ le corresponde
  un único punto $P \in L$ y a cada punto le corresponde un único número real.
definiciones_clave: '- **Recta real**: Representación gráfica continua del conjunto $\mathbb{R}$.

  - **Origen (0)**: Punto de referencia que separa reales positivos y negativos.'
propiedades_relaciones: '- **Biyección**: Relación uno a uno entre números reales y puntos
  geométricos.'
ejemplo_guiado:
  enunciado: Ubica de forma aproximada los números $-1{,}5$; $\sqrt{2}$ y $3$ en la recta
    numérica.
  pasos:
  - Trazar una recta graduada marcando el origen $0$.
  - $-1{,}5$ se ubica a la izquierda de $0$, exactamente en el punto medio entre $-1$ y $-2$.
  - $\sqrt{2} \approx 1{,}414$ se ubica a la derecha de $0$, entre $1$ y $2$, cerca del $1{,}4$.
  - $3$ se ubica a la derecha de $0$, en la marca del entero $3$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la correspondencia biunívoca de la recta real?
  choices:
  - text: A cada número real le corresponde un único punto en la recta y viceversa
    is_correct: true
  - text: Solo los enteros se pueden ubicar en la recta
    is_correct: false
  - text: Los números irracionales ocupan dos puntos a la vez
    is_correct: false
  - text: Quedan espacios vacíos en la recta que no son números
    is_correct: false
  explanation: 'La correcta es: A cada número real le corresponde un único punto en la recta
    y viceversa. Es la propiedad de la recta real.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Entre qué dos enteros consecutivos de la recta numérica se ubica el número $\pi$?
  choices:
  - text: Entre 3 y 4
    is_correct: true
  - text: Entre 2 y 3
    is_correct: false
  - text: Entre 4 y 5
    is_correct: false
  - text: Entre 3 y 3,5
    is_correct: false
  explanation: 'La correcta es: Entre 3 y 4. Puesto que $\pi \approx 3{,}14159...$, está justo
    a la derecha del 3.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar una recta horizontal y marcar el origen $0$.'
- 'Paso 2: Asignar sentido positivo hacia la derecha y negativo hacia la izquierda.'
- 'Paso 3: Convertir números fraccionarios o irracionales a su aproximación decimal.'
- 'Paso 4: Marcar el punto correspondiente en la recta.'
errores_correccion: 'No olvides mantener la escala. Los valores más negativos van más a la
  izquierda (ej: $-5$ está a la izquierda de $-2$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Qué número está más a la izquierda en la recta: $-4$ o $-1$?'
  alternativas:
  - '-4'
  - '-1'
  respuesta: '-4'
  solucion_pasos:
  - $-4 < -1 \implies -4$ está más a la izquierda.
- titulo: Ejemplo 2
  enunciado: ¿Entre qué enteros se ubica √10?
  alternativas:
  - Entre 3 y 4
  - Entre 2 y 3
  - Entre 4 y 5
  respuesta: Entre 3 y 4
  solucion_pasos:
  - √9 = 3 y √16 = 4, y 10 está entre 9 y 16.
- titulo: Ejemplo 3
  enunciado: '¿Qué número está más a la derecha en la recta: -0,5 o -2?'
  alternativas:
  - -0,5
  - '-2'
  - Están en el mismo punto
  respuesta: -0,5
  solucion_pasos:
  - -0,5 > -2, por lo tanto se ubica más a la derecha.
- titulo: ¿Tiene √3 una posición exacta en la recta numérica, aunque no se pueda escribir
    con una cantidad finita de decimales?
  respuesta: Sí
  solucion_pasos:
  - Todo número real, racional o irracional, tiene un punto exacto en la recta.
errores_frecuentes:
- Ubicar los números negativos en orden invertido en la recta.
- Ubicar los números irracionales fuera de la recta por no tener una expresión decimal exacta.
- Invertir el orden de los números negativos al ubicarlos en la recta.
- Creer que solo los números racionales tienen un lugar exacto en la recta.
- No usar una aproximación decimal al ubicar un número irracional, dejándolo sin posición.
afirmaciones_verdaderas:
- La recta real es continua y no posee agujeros ni saltos.
- A cada número real le corresponde exactamente un punto de la recta numérica, sin excepciones.
al_terminar_debes_poder: Representar y comparar números reales en la recta numérica.
fuente: Texto escolar MINEDUC.
estado: publicado
