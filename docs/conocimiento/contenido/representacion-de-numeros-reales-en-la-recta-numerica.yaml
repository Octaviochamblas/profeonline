semantic_id: MAT.NUM.REALES.RECTA_NUMERICA
resumen_inicial: Cada número real corresponde a un único punto en la recta geométrica continua y cada punto de la recta representa un único número real.
explicacion_simple: '![Representación de reales en la recta numérica](/static/img/nodos/representacion-de-numeros-reales-en-la-recta-numerica-intro.svg)


  La recta numérica real es una línea continua infinita donde no queda ningún hueco vacío. Cada número real (ya sea un entero como $-2$, una fracción como $3/4$ o una raíz como $\sqrt{2}$) tiene una ubicación geométrica exacta e indiscutible. El cero divide a los reales negativos (a la izquierda) de los reales positivos (a la derecha).'
explicacion_formal: "La **Biyección Fundamental de la Recta Real** establece una correspondencia biunívoca entre el cuerpo algebraico $\\mathbb{R}$ y el espacio geométrico unidimensional $\\mathcal{E}^1$:\n\n$$f: \\mathbb{R} \\longleftrightarrow \\text{Recta Numérica Geometrica}$$\n\n**Propiedades de la representación en la recta:**\n1. **Continuidad y completitud:** A diferencia de la recta de los racionales $\\mathbb{Q}$, la recta real $\\mathbb{R}$ no presenta discontinuidades ni 'agujeros'.\n2. **Construcción euclidiana de radicales:** Mediante el Teorema de Pitágoras sobre triángulos rectángulos de catetos enteros (ej: catetos $1$ y $1 \\implies$ hipotenusa $\\sqrt{2}$) y el transporte con compás, se determina la posición exacta de números irracionales algebraicos.\n3. **Métrica y distancia:** La distancia euclidiana entre dos puntos $a, b \\in \\mathbb{R}$ está dada por el valor absoluto de su diferencia:\n   $$d(a, b) = |b - a|$$"
definiciones_clave: '- **Recta real**: Representación gráfica continua y completa de todos los números reales $\mathbb{R}$.

  - **Origen ($0$)**: Punto de referencia que separa los reales negativos ($\mathbb{R}^-$) de los positivos ($\mathbb{R}^+$).

  - **Distancia euclidiana**: Longitud del segmento $|b - a|$ que separa a dos números en la recta.'
propiedades_relaciones: '- **Orden geométrico**: $a < b \iff$ el punto $a$ se encuentra estrictamente a la izquierda del punto $b$.

  - **Densidad de la recta**: En cualquier intervalo abierto $(a, b)$ con $a < b$, existen infinitos números reales.'
ejemplo_guiado:
  enunciado: '![Ejemplos de representación en la recta numérica](/static/img/nodos/representacion-de-numeros-reales-en-la-recta-numerica-ejemplos.svg)


    Determine la posición relativa en la recta numérica y las cotas enteras consecutivas de los números $\sqrt{2}$, $-\pi$ y $\frac{5}{2}$.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{2}$: Como $1^2 = 1 < 2 < 4 = 2^2$, se tiene que $1 < \sqrt{2} < 2$ (aprox. $1,414$). Se ubica en el semieje positivo entre $1$ y $2$.'
  - 'Paso 2: Analizar $-\pi$: Como $\pi \approx 3,1416$, al anteponer el signo negativo queda $-4 < -\pi < -3$. Se ubica en el semieje negativo entre $-4$ y $-3$.'
  - 'Paso 3: Analizar $\frac{5}{2}$: Como $\frac{5}{2} = 2,5$, se ubica exactamente en el punto medio entre $2$ y $3$ en el semieje positivo.'
  - 'Paso 4: Ordenar de izquierda a derecha: $-\pi < 1 < \sqrt{2} < 2 < \frac{5}{2}$.'
  - 'Conclusión: Las posiciones de izquierda a derecha son $-\pi$ (entre $-4$ y $-3$), $\sqrt{2}$ (entre $1$ y $2$) y $\frac{5}{2}$ (entre $2$ y $3$).'
checkpoints:
