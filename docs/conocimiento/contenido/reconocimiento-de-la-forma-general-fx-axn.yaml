semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.FORMA_GENERAL
resumen_inicial: El reconocimiento de la forma general $f(x) = a \cdot x^n$ permite identificar y reescribir algebraicamente cocientes con potencias en el denominador $a / x^k = a x^{-k}$ y expresiones radicales $c \sqrt[m]{x^k} = c x^{k/m}$ en su estructura canónica de monomio potencia.
explicacion_simple: "![El reconocimiento de la forma general $f(x) = a \\cdot x^n$ permite identificar y reescribir algebraicamente cocientes con potencias en el denominador $a / x^k = a x^{-k}$ y expresiones radicales $c \\sqrt[m]{x^k} = c x^{k/m}$ en su estructura canónica de monomio potencia](/static/img/nodos/reconocimiento-de-la-forma-general-fx-axn-intro.svg)\n\n\nMuchas funciones parecen fracciones difíciles o raíces complicadas, pero en realidad **son funciones potencia disfrazadas**:\n\n- **Caso 1: La $x$ está abajo (fracción):**\n  $$f(x) = \\frac{3}{x^4} = \\mathbf{3 \\cdot x^{-4}} \\quad \\implies a = 3, \\; n = -4$$\n  - Subes la $x$ cambiándole el signo al exponente.\n- **Caso 2: La $x$ está dentro de una raíz:**\n  $$g(x) = 2 \\cdot \\sqrt[5]{x^3} = \\mathbf{2 \\cdot x^{3/5}} \\quad \\implies a = 2, \\; n = \\frac{3}{5}$$\n  - El índice de la raíz pasa al denominador del exponente.\n- **Caso 3: Coeficiente fraccionario:**\n  $$h(x) = \\frac{x^3}{6} = \\mathbf{\\frac{1}{6}\
  \ \\cdot x^3} \\quad \\implies a = \\frac{1}{6}, \\; n = 3$$"
explicacion_formal: "Sea $E(x)$ una expresión algebraica univariable. La reducción a la forma canónica $f(x) = a \\cdot x^n$ se rige por los siguientes isomorfismos de exponentes en cuerpos algebraicos:\n1. **Inversión multiplicativa**:\n   $$\\frac{c}{k \\cdot x^p} = \\left(\\frac{c}{k}\\right) x^{-p} \\implies a = \\frac{c}{k}, \\quad n = -p$$\n2. **Radicación a exponente fraccionario**:\n   $$c \\sqrt[m]{x^p} = c \\cdot x^{p/m} \\implies a = c, \\quad n = \\frac{p}{m}$$\n3. **Composición de cociente y raíz**:\n   $$\\frac{c}{\\sqrt[m]{x^p}} = c \\cdot x^{-p/m} \\implies a = c, \\quad n = -\\frac{p}{m}$$"
definiciones_clave: '- **Forma canónica de monomio potencia**: Representación unificada $a \cdot x^n$ con un único coeficiente y un único exponente.

  - **Exponente racional / fraccionario**: Representación de radicales como potencias con exponente $p/q$.'
propiedades_relaciones: '- **Separación de coeficientes numéricos**: En $\frac{1}{2x^3}$, el coeficiente es $a = 1/2$, no $a = 2$.

  - **Propiedades de las potencias**: $x^{-n} = 1/x^n$ y $x^{m/n} = \sqrt[n]{x^m}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento de la forma general $f(x) = a \cdot x^n$ permite identificar y reescribir algebraicamente cocientes con potencias en el denominador $a / x^k = a x^{-k}$ y expresiones radicales $c \sqrt[m]{x^k} = c x^{k/m}$ en su estructura canónica de monomio potencia](/static/img/nodos/reconocimiento-de-la-forma-general-fx-axn-ejemplos.svg)



    Reescribe en la forma canónica $f(x) = a \cdot x^n$ e identifica los valores exactos de $a$ y $n$ para:

    1) $f(x) = -\frac{5}{2x^3}$

    2) $g(x) = 4\sqrt{x}$

    3) $h(x) = \frac{3}{\sqrt[4]{x^3}}$'
  pasos:
  - 'Paso 1: Para $f(x) = -\frac{5}{2x^3}$:

    - Separar coeficiente numérico y subir $x$: $-\frac{5}{2} x^{-3}$.

    - **$a = -5/2 = -2{,}5, \quad n = -3$**.'
  - 'Paso 2: Para $g(x) = 4\sqrt{x}$:

    - Reescribir la raíz cuadrada: $4 x^{1/2}$.

    - **$a = 4, \quad n = 1/2 = 0{,}5$**.'
  - 'Paso 3: Para $h(x) = \frac{3}{\sqrt[4]{x^3}}$:

    - Raíz a exponente fraccionario en denominador: $\frac{3}{x^{3/4}}$.

    - Subir con signo negativo: $3 x^{-3/4}$.

    - **$a = 3, \quad n = -3/4 = -0{,}75$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros a y n en la función $f(x) = \frac{1}{3x^2}$?
  choices:
  - text: a = 1/3, n = -2
    is_correct: true
  - text: a = 3, n = -2
    is_correct: false
  - text: a = 1/3, n = 2
    is_correct: false
  - text: a = 1, n = -2/3
    is_correct: false
  explanation: La alternativa correcta es 'a = 1/3, n = -2'. El 3 está en el denominador ($1/3$) y $x^2$ sube como $x^{-2}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al reescribir $g(x) = 6\sqrt[3]{x}$ en forma de potencia, ¿cuánto vale el exponente n?
  choices:
  - text: n = 1/3
    is_correct: true
  - text: n = 3
    is_correct: false
  - text: n = -3
    is_correct: false
  - text: n = 2/3
    is_correct: false
  explanation: La alternativa correcta es 'n = 1/3'. La raíz cúbica $\sqrt[3]{x}$ equivale al exponente fraccionario $x^{1/3}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Separar la parte numérica constante (coeficiente $a$) de la parte con la variable $x$.'
- 'Paso 2: Si $x$ está en el denominador, aplicar la ley $1/x^k = x^{-k}$.'
- 'Paso 3: Si $x$ está bajo un radical, aplicar la ley $\sqrt[m]{x^k} = x^{k/m}$.'
- 'Paso 4: Escribir la forma canónica final $a \cdot x^n$ y registrar $a$ y $n$.'
errores_correccion: '- **Error común:** Tomar el denominador completo como coeficiente (ej: en $\frac{1}{5x^2}$, decir $a = 5$).

  - **Cómo corregirlo:** La constante sigue estando en el denominador: **$a = \frac{1}{5}$**, por lo que $f(x) = \mathbf{\frac{1}{5} x^{-2}}$.'
ejemplos:
- titulo: 'Ejemplo 1: Subida de potencia'
  enunciado: 'Reescribe $f(x) = -\frac{7}{x^6}$:'
  alternativas:
  - -7 x⁻⁶
  - 7 x⁻⁶
  - -7 x⁶
  - -1/7 x⁶
  respuesta: -7 x⁻⁶
  solucion_pasos:
  - 'Paso 1: $-\frac{7}{x^6} = -7 x^{-6} \implies a = -7, n = -6$.'
- titulo: 'Ejemplo 2: Raíz en denominador'
  enunciado: 'Reescribe $g(x) = \frac{2}{\sqrt{x}}$:'
  alternativas:
  - 2 x^(-1/2)
  - 2 x^(1/2)
  - 1/2 x⁻¹
  - -2 x^(1/2)
  respuesta: 2 x^(-1/2)
  solucion_pasos:
  - 'Paso 1: $\frac{2}{x^{1/2}} = 2 x^{-1/2} \implies a = 2, n = -1/2$.'
- titulo: 'Ejemplo 3: Coeficiente fraccionario simple'
  enunciado: En $h(x) = \frac{x^7}{10}$, ¿cuánto vale $a$?
  alternativas:
  - 1/10 (o 0,1)
  - '10'
  - '7'
  - 7/10
  respuesta: 1/10 (o 0,1)
  solucion_pasos:
  - 'Paso 1: $h(x) = \frac{1}{10} x^7 \implies a = 1/10$.'
- titulo: 'Ejemplo 4: Raíz de índice compuesto'
  enunciado: 'Reescribe $p(x) = -\sqrt[5]{x^4}$:'
  alternativas:
  - -1 x^(4/5)
  - -1 x^(5/4)
  - 4/5 x⁻¹
  - -4/5 x
  respuesta: -1 x^(4/5)
  solucion_pasos:
  - 'Paso 1: $-\sqrt[5]{x^4} = -1 x^{4/5} \implies a = -1, n = 4/5$.'
errores_frecuentes:
- Olvidar que los coeficientes en el denominador se transforman en fracciones 1/k.
- Invertir el numerador y denominador al convertir raíces a fracciones (es exponente/índice).
- No colocar el signo menos en el exponente cuando la variable sube del denominador.
afirmaciones_verdaderas:
- Toda expresión con potencias en el denominador se puede escribir como a · x⁻ᵏ.
- Toda expresión con radicales se puede representar en forma de potencia con exponente fraccionario x^(k/m).
al_terminar_debes_poder: '**QUÉ:** Reconocer y convertir expresiones algebraicas a la forma general f(x) = a · xⁿ.


  **CÓMO:** Aplicando leyes de potencias negativas y fraccionarias para extraer los parámetros a y n.


