  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determinan el período T y la amplitud A de una función de la
    forma f(x) = A sen(Bx + C) + D en identificación del coseno como coordenada x
    en el círculo unitario?
  choices:
  - text: Calcular el período como T = 2pi / |B| y la amplitud como |A|
    is_correct: true
  - text: Sumando A + B + C + D independientemente
    is_correct: false
  - text: Igualando la amplitud a 2pi y el período a 1
    is_correct: false
  - text: Dividiendo A entre 2pi sin considerar B
    is_correct: false
  explanation: 'La alternativa correcta es: Calcular el período como T = 2pi / |B|
    y la amplitud como |A|. Fórmulas estándar para amplitud y período en funciones
    sinusoidales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubica el punto $(x,y)$ donde el lado terminal de $\theta$ corta al círculo
  unitario.'
- 'Paso 2: Identifica la coordenada $x$ de ese punto.'
- 'Paso 3: Esa coordenada $x$ es el valor de $\cos(\theta)$.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en identificación del coseno
  como coordenada x en el círculo unitario.
ejemplos:
- titulo: Cálculo del coseno en un ángulo cuadrantal
  enunciado: Calcula $\cos(180°)$.
  solucion_pasos:
  - El punto asociado a $180°$ es $(-1,0)$.
  - Se obtiene $\cos(180°)=-1$.
- titulo: Cálculo del coseno en otro ángulo cuadrantal
  enunciado: Calcula $\cos(270°)$.
  solucion_pasos:
  - El punto asociado a $270°$ es $(0,-1)$.
  - Se obtiene $\cos(270°)=0$.
- titulo: ¿El coseno puede tomar valores mayores que $1$?
  enunciado: ¿Puede $\cos(\theta)$ tomar un valor mayor que $1$?
  respuesta: 'No'
  solucion_pasos:
  - Como $(x,y)$ pertenece al círculo unitario, $x$ nunca puede superar $1$ en valor
    absoluto.
- titulo: ¿El coseno de un ángulo cuadrantal siempre es $0$ o $\pm1$?
  enunciado: ¿El coseno de cualquier ángulo cuadrantal es siempre $0$, $1$ o $-1$?
  respuesta: Sí
  solucion_pasos:
  - Los puntos cuadrantales tienen coordenada $x$ igual a $0$, $1$ o $-1$.
errores_frecuentes:
- Declarar el coseno con la coordenada $y$, que corresponde al seno.
- Suponer que el coseno puede tomar cualquier valor real, sin restricción.
- No verificar que el punto usado realmente pertenezca al círculo unitario.
- Declarar esta definición general con la limitada al triángulo rectángulo (solo ángulos
  agudos).
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  identificación del coseno como coordenada x en el círculo unitario.
