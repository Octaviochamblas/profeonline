semantic_id: MAT.ALG.TRIG_COORDENADAS.COSENO_COORDENADA_X
resumen_inicial: 'Identificación del coseno como coordenada x en el círculo unitario:
  círculo unitario, amplitud, período y transformaciones de Seno y coseno en el círculo
  unitario.'
explicacion_simple: En vez de memorizar razones entre lados de un triángulo, el círculo
  unitario permite definir el coseno directamente a partir de la posición de un punto.
explicacion_formal: '### Definición formal


  Si el lado terminal del ángulo $\theta$ corta al círculo unitario en el punto $(x,y)$,
  entonces $\cos(\theta)=x$. Esta definición extiende el coseno a cualquier ángulo,
  no solo a los agudos de un triángulo rectángulo.


  ### Desarrollo didáctico


  Para $\theta=0°$, el punto asociado es $(1,0)$, así que $\cos(0°)=1$. Para $\theta=90°$,
  el punto es $(0,1)$, así que $\cos(90°)=0$.'
definiciones_clave: '- **Identificación del coseno como coordenada x en el círculo
  unitario**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación del coseno como coordenada x en el círculo unitario.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación del coseno como coordenada x en el círculo unitario.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación del coseno como coordenada x en el círculo
    unitario.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
