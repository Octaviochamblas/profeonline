semantic_id: MAT.ALG.TRIG_COORDENADAS.COSENO_COORDENADA_X
resumen_inicial: 'Identificación del coseno de un ángulo como la abscisa horizontal $x$ del punto sobre el círculo unitario.'
explicacion_simple: |
  En el círculo unitario, la posición de cualquier punto $P$ depende del ángulo de giro $\theta$. La coordenada horizontal $x$ de ese punto coincide exactamente con el valor del coseno ($\cos \theta$). Si te mueves a la derecha del origen, el coseno es positivo; si te mueves a la izquierda, el coseno es negativo. Como el radio del círculo es 1, el valor del coseno nunca puede ser mayor que 1 ni menor que $-1$.
explicacion_formal: |
  ### Definición formal
  En la circunferencia goniométrica $\mathcal{C}: x^2 + y^2 = 1$, la función **coseno** se define formalmente como la proyección cartesiana sobre el eje de las abscisas del punto intersección $P(x,y)$ correspondiente al ángulo orientativo $\theta$:
  $$\cos \theta = x = \operatorname{proy}_X(P)$$
  con dominio $\theta \in \mathbb{R}$ y recorrido acotado $\cos \theta \in [-1, 1]$.

  ### Desglose simbólico
  - $x$: Abscisa horizontal del punto $P(x,y)$ en el círculo unitario.
  - $\theta$: Ángulo en posición estándar en radianes o grados.
  - $\operatorname{proy}_X(P)$: Cateto horizontal adyacente dividido por la hipotenusa $r = 1$.

  ### Síntesis didáctica
  Identificar al coseno como la coordenada $x$ permite visualizar de manera inmediata el signo y la magnitud del coseno observando la distancia horizontal desde el eje $Y$ hasta el punto sobre la circunferencia.
definiciones_clave: |
  - **Coseno goniométrico**: Abscisa cartesiana $x$ del punto de intersección en el círculo unitario.
  - **Proyección horizontal**: Distancia dirigida con signo desde el eje vertical $Y$ hasta el punto $P$.
  - **Recorrido del coseno**: Intervalo cerrado $[-1, 1]$ que limita los valores posibles del coseno.
propiedades_relaciones: |
  - **Comportamiento por ejes**:
    - En $+X$ ($\theta = 0^\circ$): $\cos(0^\circ) = 1$.
    - En $+Y$ ($\theta = 90^\circ$): $\cos(90^\circ) = 0$.
    - En $-X$ ($\theta = 180^\circ$): $\cos(180^\circ) = -1$.
    - En $-Y$ ($\theta = 270^\circ$): $\cos(270^\circ) = 0$.
ejemplo_guiado:
  enunciado: 'Dado el punto $P\left(-\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$ perteneciente al círculo unitario para un ángulo del segundo cuadrante, determina el valor de $\cos \theta$.'
  pasos:
    - 'Paso 1: Identificar las coordenadas del punto: $x = -\frac{1}{2}$ e $y = \frac{\sqrt{3}}{2}$.'
    - 'Paso 2: Aplicar la definición funcional del coseno en el círculo unitario: $\cos \theta = x$.'
    - 'Paso 3: Tomar el valor de la abscisa horizontal: $\cos \theta = -\frac{1}{2}$.'
    - 'Paso 4: Concluir que el coseno es negativo debido a la ubicación del punto a la izquierda del eje Y.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el círculo unitario, ¿qué elemento del punto cartesiano $P(x,y)$ representa al coseno del ángulo $\theta$?'
    choices:
      - {text: 'La abscisa horizontal $x$', is_correct: true}
      - {text: 'La ordenada vertical $y$', is_correct: false}
      - {text: 'La longitud del radio $r$', is_correct: false}
      - {text: 'La suma $x + y$', is_correct: false}
    explanation: 'La alternativa correcta es ''La abscisa horizontal $x$''. Por definición goniométrica, $\cos \theta = x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto en el círculo unitario para un ángulo de $180^\circ$ es $(-1, 0)$, ¿cuál es el valor de $\cos(180^\circ)$?'
    choices:
      - {text: '$-1$', is_correct: true}
      - {text: '$0$', is_correct: false}
      - {text: '$1$', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$''. Corresponde a la coordenada horizontal $x = -1$ en el punto $(-1, 0)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las coordenadas $(x, y)$ del punto sobre el círculo unitario.'
  - 'Paso 2: Aislar la primera coordenada del par ordenado (la abscisa $x$).'
  - 'Paso 3: Asignar $\cos \theta = x$.'
  - 'Paso 4: Verificar que el resultado pertenezca al intervalo $[-1, 1]$.'
errores_correccion: |
  - **Error 1:** Confundir el coseno con la coordenada vertical $y$. **Cómo corregirlo:** La coordenada vertical $y$ corresponde al seno. El coseno representa siempre la proyección horizontal $x$.
  - **Error 2:** Creer que el coseno puede ser mayor que $1$ en el círculo unitario. **Cómo corregirlo:** Al ser el radio igual a $1$, la abscisa máxima sobre la circunferencia es $x = 1$.
ejemplos:
  - titulo: 'Coseno de cero grados'
    enunciado: 'Para el punto $(1, 0)$ en $\theta = 0^\circ$, ¿cuál es el valor de $\cos(0^\circ)$?'
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. En $(1, 0)$, la abscisa $x = 1$.'
      - '2. Por lo tanto, $\cos(0^\circ) = 1$.'
  - titulo: 'Coseno en el tercer cuadrante'
    enunciado: 'Si un punto en el círculo unitario es $P\left(-\frac{\sqrt{2}}{2}, -\frac{\sqrt{2}}{2}\right)$, ¿cuánto vale su coseno?'
    alternativas:
      - '$-\frac{\sqrt{2}}{2}$'
      - '$\frac{\sqrt{2}}{2}$'
      - '$1$'
    respuesta: '$-\frac{\sqrt{2}}{2}$'
    solucion_pasos:
      - '1. La abscisa $x$ es $-\frac{\sqrt{2}}{2}$.'
      - '2. $\cos \theta = x = -\frac{\sqrt{2}}{2}$.'
  - titulo: 'Coseno en el semieje Y positivo'
    enunciado: '¿El coseno del ángulo de $90^\circ$ vale cero porque la coordenada $x$ del punto $(0,1)$ es cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $(0,1)$, $x = 0 \implies \cos(90^\circ) = 0$.'
  - titulo: 'Acotación del coseno'
    enunciado: '¿Es imposible que el coseno de un ángulo sobre el círculo unitario valga $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las abscisas del círculo unitario están acotadas en $[-1, 1]$.'
errores_frecuentes:
  - 'La afirmación de que el coseno de un ángulo corresponde a la coordenada vertical $y$ del círculo unitario.'
  - 'La afirmación de que el coseno de un ángulo en el círculo unitario puede tomar el valor de $1.8$.'
  - 'La afirmación de que el coseno en el segundo cuadrante es un número positivo.'
  - 'La afirmación de que en el punto $(0, -1)$ el valor del coseno es $-1$.'
  - 'La afirmación de que el coseno se calcula dividiendo la ordenada por el radio en el círculo unitario.'
afirmaciones_verdaderas:
  - 'En el círculo unitario, el coseno de un ángulo equivale exactamente a la abscisa cartesiana $x$ del punto correspondiente.'
  - 'El conjunto recorrido de la función coseno en el círculo unitario está acotado en el intervalo $[-1, 1]$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular el coseno de cualquier ángulo en el círculo unitario.
  CÓMO: Extraer la abscisa cartesiana $x$ del punto intersección correspondiente en el círculo unitario.
