semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CONMUTATIVA_MULTIPLICACION
resumen_inicial: "La propiedad conmutativa de la multiplicación establece que el orden en que se multiplican dos números racionales no altera el producto final."
explicacion_simple: |
  La famosa frase 'el orden de los factores no altera el producto' aplica perfectamente a la multiplicación de fracciones. Si multiplicas $\frac{2}{3} \times \frac{4}{5}$, obtienes $\frac{8}{15}$. Si inviertes el orden y multiplicas $\frac{4}{5} \times \frac{2}{3}$, obtienes exactamente el mismo resultado: $\frac{8}{15}$. Geométricamente, calcular los $\frac{2}{3}$ de $\frac{4}{5}$ representa la misma porción de superficie que calcular los $\frac{4}{5}$ de $\frac{2}{3}$.
explicacion_formal: |
  Formalmente, la multiplicación sobre el conjunto de los números racionales $\mathbb{Q}$ satisface la **propiedad conmutativa**:
  $$\forall q_1, q_2 \in \mathbb{Q}, \quad q_1 \cdot q_2 = q_2 \cdot q_1$$

  Demostración: sean $q_1 = \frac{a}{b}$ y $q_2 = \frac{c}{d}$ con $a, c \in \mathbb{Z}$ y $b, d \in \mathbb{Z} \setminus \{0\}$.
  1. Lado izquierdo: $q_1 \cdot q_2 = \frac{a}{b} \cdot \frac{c}{d} = \frac{a \cdot c}{b \cdot d}$.
  2. Lado derecho: $q_2 \cdot q_1 = \frac{c}{d} \cdot \frac{a}{b} = \frac{c \cdot a}{d \cdot b}$.
  Dado que los enteros $\mathbb{Z}$ cumplen la conmutatividad del producto ($a \cdot c = c \cdot a$ y $b \cdot d = d \cdot b$), se tiene $\frac{a \cdot c}{b \cdot d} = \frac{c \cdot a}{d \cdot b}$, demostrando que $q_1 \cdot q_2 = q_2 \cdot q_1$.
definiciones_clave: |
  - **Propiedad conmutativa multiplicativa**: Invarianza del producto de fracciones ante la permutación de los factores: $q_1 \cdot q_2 = q_2 \cdot q_1$.
  - **Factores permutables**: Racionales multiplicandos cuya posición en la cadena de productos se puede cambiar libremente.
  - **Conmutador multiplicativo**: Identidad algebraicamente equivalente $q_1 \cdot q_2 - q_2 \cdot q_1 = 0$.
propiedades_relaciones: |
  - **Simplificación cruzada flexible**: Gracias a la conmutatividad del producto en el numerador y denominador, cualquier numerador puede simplificarse con cualquier denominador de la cadena.
  - **Ausencia de conmutatividad en la división**: La división en $\mathbb{Q}$ NO es conmutativa ($\frac{a}{b} \div \frac{c}{d} \neq \frac{c}{d} \div \frac{a}{b}$ salvo si las fracciones son iguales a $\pm 1$).
  - **Estructura de Cuerpo Conmutativo**: Es indispensable para consagrar a $(\mathbb{Q}, +, \cdot)$ como un cuerpo algebraico conmutativo.
ejemplo_guiado:
  enunciado: "Demuestra la propiedad conmutativa multiplicativa calculando de dos modos el producto entre $q_1 = -\\frac{5}{6}$ y $q_2 = \\frac{9}{10}$."
  pasos:
    - "Modo 1 ($q_1 \\cdot q_2$): calcular $\\left(-\\frac{5}{6}\\right) \\cdot \\left(\\frac{9}{10}\\right)$."
    - "Multiplicar y simplificar: $-\\frac{5 \\cdot 9}{6 \\cdot 10} = -\\frac{45}{60} = -\\frac{3}{4}$."
    - "Modo 2 ($q_2 \\cdot q_1$): calcular $\\left(\\frac{9}{10}\\right) \\cdot \\left(-\\frac{5}{6}\\right)$."
    - "Multiplicar y simplificar: $-\\frac{9 \\cdot 5}{10 \\cdot 6} = -\\frac{45}{60} = -\\frac{3}{4}$."
    - "Concluir: como $-\\frac{3}{4} = -\\frac{3}{4}$, queda demostrada la igualdad conmutativa."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué establece la propiedad conmutativa para el producto de dos fracciones $\\frac{a}{b}$ y $\\frac{c}{d}$?"
    choices:
      - {text: "Que $\\frac{a}{b} \\cdot \\frac{c}{d} = \\frac{c}{d} \\cdot \\frac{a}{b}$, el orden de los factores no altera el producto.", is_correct: true}
      - {text: "Que $\\frac{a}{b} \\cdot \\frac{c}{d} = \\frac{a+c}{b+d}$.", is_correct: false}
      - {text: "Que el producto siempre debe ser 1.", is_correct: false}
      - {text: "Que se deben sumar las fracciones antes de multiplicar.", is_correct: false}
    explanation: "La correcta es Que $\\frac{a}{b} \\cdot \\frac{c}{d} = \\frac{c}{d} \\cdot \\frac{a}{b}$, el orden de los factores no altera el producto.: establece la invariancia del resultado final."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si el producto $\\frac{7}{12} \\cdot \\frac{4}{15} = \\frac{7}{45}$, ¿cuánto es el producto $\\frac{4}{15} \\cdot \\frac{7}{12}$?"
    choices:
      - {text: "\\frac{7}{45}", is_correct: true}
      - {text: "\\frac{45}{7}", is_correct: false}
      - {text: "-\\frac{7}{45}", is_correct: false}
      - {text: "\\frac{28}{180}", is_correct: false}
    explanation: "La correcta es \\frac{7}{45}: por la propiedad conmutativa de la multiplicación, el producto resultante es exactamente el mismo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los dos factores racionales $q_1$ y $q_2$."
  - 'Paso 2: Calcular el producto en el orden original $q_1 \cdot q_2 = \frac{a \cdot c}{b \cdot d}$.'
  - 'Paso 3: Calcular el producto invirtiendo el orden $q_2 \cdot q_1 = \frac{c \cdot a}{d \cdot b}$.'
  - "Paso 4: Verificar la coincidencia de ambos resultados simplificados."
errores_correccion: |
  Un error frecuente es intentar aplicar esta propiedad a la división de fracciones (pensar que $\frac{a}{b} \div \frac{c}{d} = \frac{c}{d} \div \frac{a}{b}$). ¡Recuerda que **la división NO es conmutativa**! (por ejemplo, $6 \div 2 = 3$, pero $2 \div 6 = \frac{1}{3}$).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula de manera eficiente $\\frac{7}{11} \\cdot \\frac{5}{3} \\cdot \\frac{11}{7}$ aplicando conmutatividad."
    alternativas:
      - "\\frac{5}{3} (o 1\\frac{2}{3})."
      - "\\frac{385}{231}."
      - "\\frac{35}{33}."
    respuesta: "\\frac{5}{3} (o 1\\frac{2}{3})."
    solucion_pasos:
      - "Permutamos factores: $\\left(\\frac{7}{11} \\cdot \\frac{11}{7}\\right) \\cdot \\frac{5}{3}$."
      - "Como $\\frac{7}{11} \\cdot \\frac{11}{7} = 1$, resulta $1 \\cdot \\frac{5}{3} = \\frac{5}{3}$."
  - titulo: "Ejemplo 2"
    enunciado: "¿Es la multiplicación de tres fracciones $q_1 \\cdot q_2 \\cdot q_3$ totalmente conmutativa?"
    alternativas:
      - "Sí, se pueden multiplicar en los 6 órdenes posibles obteniendo el mismo producto."
      - "No, solo se pueden permutar los dos primeros."
      - "No, depende del signo."
    respuesta: "Sí, se pueden multiplicar en los 6 órdenes posibles obteniendo el mismo producto."
    solucion_pasos:
      - "La conmutatividad sobre $\\mathbb{Q}$ extiende la permutabilidad a cualquier cantidad finita de factores."
  - titulo: "¿Se cumple la propiedad conmutativa multiplicativa entre un número entero y una fracción?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, $n \\cdot \\frac{a}{b} = \\frac{a}{b} \\cdot n = \\frac{n \\cdot a}{b}$."
  - titulo: "¿Cambia el signo del producto si permutamos dos fracciones negativas en una multiplicación?"
    respuesta: "No"
    solucion_pasos:
      - 'No, $(-q_1) \cdot (-q_2) = (-q_2) \cdot (-q_1) = + (q_1 \cdot q_2)$.'
errores_frecuentes:
  - "Intentar aplicar la conmutatividad a la división de fracciones."
  - "Confundir la conmutatividad multiplicativa con el cálculo del recíproco."
  - "Pensar que permutar factores altera la posibilidad de realizar simplificación cruzada."
  - "Creer que la propiedad conmutativa solo aplica a fracciones positivas."
  - "Confundir la conmutatividad con la asociatividad."
afirmaciones_verdaderas:
  - "La multiplicación de números racionales es conmutativa: $q_1 \\cdot q_2 = q_2 \\cdot q_1$."
  - "El orden en que se multiplican dos o más números racionales no altera el producto final."
al_terminar_debes_ponder: |
  Debes ser capaz de utilizar la propiedad conmutativa multiplicativa para simplificar cadenas de productos racionales y justificar su validez.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
