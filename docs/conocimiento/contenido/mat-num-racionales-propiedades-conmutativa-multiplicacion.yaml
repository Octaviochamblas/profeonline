semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CONMUTATIVA_MULTIPLICACION
resumen_inicial: 'La propiedad conmutativa de la multiplicación establece que el orden
  de los factores racionales no altera el producto: $q_1 \cdot q_2 = q_2 \cdot q_1$.'
explicacion_simple: Al multiplicar dos números racionales, el orden en que los multipliquemos
  no altera el producto final. Multiplicar una primera fracción por una segunda da
  exactamente el mismo valor que multiplicar la segunda por la primera.
explicacion_formal: 'Para cualesquiera dos racionales $q_1 = \frac{a}{b}$ y $q_2 =
  \frac{c}{d}$ en $\mathbb{Q}$, la **Conmutatividad Multiplicativa** exige:


  $$q_1 \cdot q_2 = q_2 \cdot q_1 \iff \frac{a \cdot c}{b \cdot d} = \frac{c \cdot
  a}{d \cdot b}$$


  **Desglose de la fórmula:**

  - $a \cdot c = c \cdot a$ y $b \cdot d = d \cdot b$: Conmutatividad del producto
  de enteros en $\mathbb{Z}$.


  > **Complemento didáctico:** Esta propiedad vale para la multiplicación, pero **NO**
  para la división de racionales ($q_1 : q_2 \neq q_2 : q_1$).'
definiciones_clave: '- **Conmutatividad multiplicativa**: Invarianza del producto
  frente al cambio de orden de los factores.'
propiedades_relaciones: '- **Invarianza de factores**: $q_1 \cdot q_2 = q_2 \cdot
  q_1$.'
ejemplo_guiado:
  enunciado: Verifique la conmutatividad multiplicativa entre $\frac{2}{3}$ y $\frac{5}{7}$.
  pasos:
  - 'Paso 1: Multiplicar en el primer orden: $\frac{2}{3} \cdot \frac{5}{7} = \frac{2
    \cdot 5}{3 \cdot 7} = \frac{10}{21}$.'
  - 'Paso 2: Multiplicar en el segundo orden: $\frac{5}{7} \cdot \frac{2}{3} = \frac{5
    \cdot 2}{7 \cdot 3} = \frac{10}{21}$.'
  - 'Paso 3: Comparar productos: $\frac{10}{21} = \frac{10}{21}$.'
  - 'Conclusión: Se cumple $\frac{2}{3} \cdot \frac{5}{7} = \frac{5}{7} \cdot \frac{2}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué afirma la propiedad conmutativa de la multiplicación en Q?
  choices:
  - text: Que q1 · q2 = q2 · q1 (el orden de los factores no altera el producto)
    is_correct: true
  - text: Que q1 · q2 = q1 + q2
    is_correct: false
  - text: 'Que q1 : q2 = q2 : q1'
    is_correct: false
  - text: Que el producto siempre es cero
    is_correct: false
  explanation: La alternativa correcta es 'Que q1 · q2 = q2 · q1 (el orden de los
    factores no altera el producto)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2/3 · 5/7, ¿cuál fue el producto equivalente
    en ambos órdenes?
  choices:
  - text: 10/21
    is_correct: true
  - text: 7/10
    is_correct: false
  - text: 10/10
    is_correct: false
  - text: 14/15
    is_correct: false
  explanation: La alternativa correcta es '10/21'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar $q_1 \cdot q_2$.'
- 'Paso 2: Multiplicar $q_2 \cdot q_1$.'
- 'Paso 3: Comprobar la igualdad exacta de ambos productos.'
errores_correccion: '- **Error 1: Afirmar que la división de fracciones es conmutativa
  ($q_1 : q_2 = q_2 : q_1$).** **Cómo corregirlo:** La división NO es conmutativa;
  $\frac{1}{2} : \frac{1}{4} = 2$ pero $\frac{1}{4} : \frac{1}{2} = \frac{1}{2}$.


  - **Error 2: Invertir las fracciones al conmutar su multiplicación.** **Cómo corregirlo:**
  Conmutar solo cambia el orden de las fracciones intactas sin invertirlas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $3/5 \cdot 4/9 = 4/15$, ¿cuánto resulta $4/9 \cdot 3/5$?
  alternativas:
  - 4/15
  - 15/4
  - 7/14
  respuesta: 4/15
  solucion_pasos:
  - 'Por conmutatividad multiplicativa: $4/9 \cdot 3/5 = 3/5 \cdot 4/9 = 4/15$.'
- titulo: Ejemplo 2
  enunciado: ¿Es conmutativa la división de fracciones en Q?
  alternativas:
  - No, el orden altera el cociente resultante
  - Sí, siempre
  - Solo para números enteros
  respuesta: No, el orden altera el cociente resultante
  solucion_pasos:
  - '$a : b \neq b : a$ en general.'
- titulo: ¿Se cumple q1 · q2 = q2 · q1 para todos los números racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación en $\mathbb{Q}$ es siempre conmutativa.
- titulo: ¿Es 1/2 · 3/4 igual a 3/4 · 1/2?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambas dan 3/8.
errores_frecuentes:
- El orden de los factores en la multiplicación de fracciones altera el producto obtenido.
- La división de dos fracciones racionales es una operación estrictamente conmutativa.
- Conmutar una multiplicación de fracciones exige invertir el numerador por el denominador.
- Multiplicar una fracción por una fracción negativa invierte la regla conmutativa.
- La propiedad conmutativa multiplicativa solo funciona si los denominadores son iguales.
afirmaciones_verdaderas:
- 'La multiplicación en $\mathbb{Q}$ es conmutativa: $q_1 \cdot q_2 = q_2 \cdot q_1$.'
- La división en $\mathbb{Q}$ no satisface la propiedad conmutativa.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad conmutativa
  multiplicativa en $\mathbb{Q}$, reordenando factores sin alterar el resultado del
  producto.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
