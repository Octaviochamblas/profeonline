procedimiento:
- 'Paso 1: Desglosar el diagrama en sus 8 regiones atómicas numéricas.'
- 'Paso 2: Identificar la cota solicitada en el enunciado ("exactamente $k$", "al menos $k$", "a lo sumo $k$").'
- 'Paso 3: Seleccionar las regiones que satisfacen dicha condición.'
- 'Paso 4: Sumar las cantidades numéricas de las regiones seleccionadas.'
- 'Paso 5: Verificar que la suma no exceda la cardinalidad de la unión o del universo.'
errores_correccion: '- **Error 1:** Incluir la triple intersección al calcular "exactamente dos". **Cómo corregirlo:** "Exactamente dos" exige que no pertenezca al tercer conjunto; la triple intersección solo se añade en "al menos dos".

  - **Error 2:** Omitir la región exterior al calcular "a lo sumo dos". **Cómo corregirlo:** "A lo sumo dos" incluye 0 conjuntos (la región exterior), 1 conjunto y 2 conjuntos; equivale a $|\mathcal{U}| - |A \cap B \cap C|$.

  '
ejemplos:
- titulo: Exactamente un conjunto
  enunciado: Si solo $A = 5$, solo $B = 4$ y solo $C = 3$, ¿cuánto vale "exactamente uno"?
  alternativas:
  - $12$
  - $5$
  - $15$
  respuesta: $12$
  solucion_pasos:
  - '1. Se suman las 3 exclusivas: $5 + 4 + 3 = 12$.'
- titulo: A lo sumo dos
  enunciado: ¿Cuál es la fórmula para calcular "a lo sumo dos conjuntos"?
  respuesta: $|\mathcal{U}| - |A \cap B \cap C|$
  solucion_pasos:
  - Equivale a todo el universo excepto aquellos que están en los tres a la vez.
  alternativas:
  - $|\mathcal{U}| - |A \cap B \cap C|$
  - $|A \cup B \cup C|$
  - $|A| + |B| + |C|$
  - $|A \cap B \cap C|$
- titulo: Al menos uno
  enunciado: ¿A qué operación equivale "al menos un conjunto"?
  respuesta: $A \cup B \cup C$
  solucion_pasos:
  - Es la unión completa de los tres conjuntos.
  alternativas:
  - $A \cup B \cup C$
  - $A \cap B \cap C$
  - $(A \cup B \cup C)^c$
  - $A \triangle B \triangle C$
- titulo: Suma total de regiones
  enunciado: ¿La suma de los 8 átomos booleanos reconstruye el universo $\mathcal{U}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, los 8 átomos forman una partición exhaustiva de $\mathcal{U}$.
errores_frecuentes:
- La afirmación de que la frase "al menos dos conjuntos" no incluye la triple intersección central.
- La afirmación de que la expresión "exactamente dos conjuntos" incluye a los elementos que están en los tres conjuntos.
- La afirmación de que "a lo sumo dos conjuntos" excluye a los elementos de la región exterior.
- La afirmación de que "solo A y B" incluye a los elementos que también pertenecen a C.
- La afirmación de que la suma de las regiones de "exactamente uno" es equivalente a la unión total $A \cup B \cup C$.
afirmaciones_verdaderas:
- La frase "al menos dos conjuntos" comprende las tres intersecciones dobles exclusivas más la triple intersección central ($R_{110} \cup R_{101} \cup R_{011} \cup R_{111}$).
- La expresión "a lo sumo dos conjuntos" es el complemento de la triple intersección y equivale a $\mathcal{U} \setminus (A \cap B \cap C)$.
