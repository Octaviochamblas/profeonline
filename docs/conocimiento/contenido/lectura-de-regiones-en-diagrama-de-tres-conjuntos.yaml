semantic_id: MAT.FUND.DIAGRAMAS_VENN.REGIONES_TRES_CONJUNTOS
resumen_inicial: Interpretación formal, traducción entre lenguaje natural y operaciones booleanas para cada una de las 8 regiones de un diagrama de Venn de tres conjuntos.
explicacion_simple: '![Infografía: Capas de profundidad y operaciones compuestas en 3 conjuntos](/static/img/nodos/lectura-de-regiones-en-diagrama-de-tres-conjuntos-intro.svg)


  En un diagrama de Venn de **tres conjuntos** ($A, B, C$), existen frases clave que debemos saber ubicar en el dibujo:

  - **"Los tres a la vez"**: es la región del centro mismo ($A \cap B \cap C$).

  - **"Solo $A$ y $B$"**: es la zona donde se cruzan $A$ y $B$, pero quitando el centro $C$ ($(A \cap B) \setminus C$).

  - **"Solo $A$"**: es la zona exclusiva de $A$ sin tocar ni a $B$ ni a $C$ ($A \setminus (B \cup C)$).

  - **"Exactamente dos"**: es la suma de las 3 zonas dobles exclusivas.

  - **"Exactamente uno"**: es la suma de las 3 zonas individuales exclusivas (solo $A$ + solo $B$ + solo $C$).

  - **"Al menos dos"**: abarca las 3 zonas dobles MÁS la triple central.

  - **"Al menos uno"**: es toda la unión completa ($A \cup B \cup C$).

  '
explicacion_formal: "### Definición formal\nEn la lógica proposicional y la teoría combinatoria, la **lectura de regiones de orden 3** es la descomposición del álgebra de Boole generada por $\\{A, B, C\\}$ sobre las $8$ regiones atómicas disjuntas:\n$$\\begin{array}{|l|l|l|} \\hline \\text{Enunciado en lenguaje natural} & \\text{Expresión conjuntista} & \\text{Regiones atómicas} \\\\ \\hline \\text{Solo } A & A \\setminus (B \\cup C) & R_{100} \\\\ \\text{Solo } A \\text{ y } B \\text{ (no } C\\text{)} & (A \\cap B) \\setminus C & R_{110} \\\\ \\text{Los tres simultáneamente} & A \\cap B \\cap C & R_{111} \\\\ \\text{Exactamente uno} & R_{100} \\cup R_{010} \\cup R_{001} & 3 \\text{ átomos} \\\\ \\text{Exactamente dos} & R_{110} \\cup R_{101} \\cup R_{011} & 3 \\text{ átomos} \\\\ \\text{Al menos dos} & (A \\cap B) \\cup (A \\cap C) \\cup (B \\cap C) & R_{110} \\cup R_{101} \\cup R_{011} \\cup R_{111} \\\\ \\text{A lo sumo dos} & (A \\cap B \\cap C)^c & \\mathcal{U} \\setminus R_{111} \\\
  \\ \\text{Al menos uno} & A \\cup B \\cup C & \\mathcal{U} \\setminus R_{000} \\\\ \\text{Ninguno de los tres} & (A \\cup B \\cup C)^c & R_{000} \\\\ \\hline \\end{array}$$\n\n### Desglose simbólico\n- \"Exactamente $k$ conjuntos\": Suma de regiones con peso de Hamming $w(b) = k$.\n  - $k = 1$: $|R_{100}| + |R_{010}| + |R_{001}|$.\n  - $k = 2$: $|R_{110}| + |R_{101}| + |R_{011}|$.\n  - $k = 3$: $|R_{111}|$.\n- \"Al menos $k$ conjuntos\": Suma de regiones con peso $w(b) \\geq k$.\n\n### Síntesis didáctica\nIdentificar con precisión los cuantificadores lingüísticos de cota (\"exactamente\", \"al menos\", \"a lo sumo\") permite resolver problemas complejos de tres conjuntos sin ambigüedades.\n"
definiciones_clave: '- **"Exactamente uno"**: Pertenencia a un único conjunto con exclusión de los otros dos.

  - **"Exactamente dos"**: Pertenencia a dos conjuntos simultáneos con exclusión estricta del tercero.

  - **"Al menos dos"**: Pertenencia a 2 o a los 3 conjuntos a la vez (unión de dobles y triple).

  - **"A lo sumo dos"**: Pertenencia a 0, 1 o 2 conjuntos (todo el universo excepto la triple intersección).

  '
propiedades_relaciones: '- **Complementariedad**: "Al menos dos" ($w \geq 2$) y "A lo sumo uno" ($w \leq 1$) son conjuntos mutuamente disjuntos y complementarios en $\mathcal{U}$.

  - **Partición por pesos**: Los 8 átomos se agrupan en cuatro niveles de conteo: 0 conjuntos (1 átomo), 1 conjunto (3 átomos), 2 conjuntos (3 átomos) y 3 conjuntos (1 átomo).

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Cálculo de al menos dos y exactamente una sola categoría](/static/img/nodos/lectura-de-regiones-en-diagrama-de-tres-conjuntos-ejemplos.svg)


    En un diagrama de tres conjuntos se tienen las siguientes cardinalidades: Solo $A = 12$, Solo $B = 10$, Solo $C = 8$, Solo $A$ y $B = 6$, Solo $A$ y $C = 4$, Solo $B$ y $C = 5$, los tres = $3$, y ninguno = $7$. Calcula: (a) cuántos pertenecen a exactamente dos conjuntos, (b) cuántos pertenecen a al menos dos conjuntos, y (c) cuántos pertenecen a exactamente un conjunto.'
  pasos:
  - 'Paso 1: Identificar las regiones dobles exclusivas: - Solo $A$ y $B = 6$, Solo $A$ y $C = 4$, Solo $B$ y $C = 5$.'
  - 'Paso 2: Calcular (a) "Exactamente dos conjuntos": - Suma de las dobles exclusivas: $6 + 4 + 5 = 15$ elementos.'
  - 'Paso 3: Calcular (b) "Al menos dos conjuntos": - Suma de exactamente dos ($15$) más los tres conjuntos ($3$): - $15 + 3 = 18$ elementos.'
  - 'Paso 4: Calcular (c) "Exactamente un conjunto": - Suma de las tres regiones individuales exclusivas: - $12 + 10 + 8 = 30$ elementos.'
  - 'Paso 5: Comprobar el universo total: - $|\mathcal{U}| = 30 \text{ (uno)} + 15 \text{ (dos)} + 3 \text{ (tres)} + 7 \text{ (cero)} = 55$ elementos.'
checkpoints:
