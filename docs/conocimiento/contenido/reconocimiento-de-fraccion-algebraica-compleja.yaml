semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.DEFINICION
resumen_inicial: Una fracción algebraica compleja es aquella que contiene una o más fracciones algebraicas dentro de su numerador, su denominador o ambos.
explicacion_simple: |
  Una fracción algebraica compleja (o compuesta) es esencialmente una "fracción de fracciones".

  Se reconoce visualmente porque en su parte superior (numerador global) o en su parte inferior (denominador global) figuran adiciones, sustracciones o divisiones entre sub-fracciones secundarias.

  Para trabajar con ellas, el objetivo central es simplificarlas operando paso a paso hasta transformarlas en una única fracción racional simple.
explicacion_formal: |
  ### Definición formal
  Una **fracción algebraica compleja** se define como el cociente racional de dos expresiones $N(x)$ y $D(x)$ donde al menos uno de los términos pertenece al cuerpo de funciones racionales $\mathbb{R}(x)$:

  $$F(x) = \frac{N(x)}{D(x)} = \frac{\frac{A(x)}{B(x)} \pm \frac{C(x)}{E(x)}}{\frac{P(x)}{Q(x)} \pm \frac{R(x)}{S(x)}}$$

  ### Desglose de la fórmula
  - $N(x), D(x)$: Expresiones compuestas que incluyen sumas o restas de sub-fracciones.
  - $B(x), E(x), Q(x), S(x) \neq 0$: Exigen que todos los denominadores de las sub-fracciones sean no nulos en su dominio de definición.

  ### Síntesis didáctica
  Identificar la barra divisoria principal permite separar el numerador y denominador global para reducir las sub-fracciones secundarias.
definiciones_clave: |
  - **Fracción algebraica compleja**: Estructura racional que posee fracciones secundarias en su numerador y/o denominador.
  - **Barra principal de fracción**: Línea divisoria de mayor longitud que separa el numerador global del denominador global.
propiedades_relaciones: |
  - **Métodos de resolución**: Se pueden resolver homogeneizando el numerador y denominador por separado o multiplicando toda la expresión por el m.c.m. de todos los denominadores secundarios.
  - **Dominio extendido**: Excluye los ceros de las sub-fracciones y los ceros del denominador global completo.
ejemplo_guiado:
  enunciado: 'Dada la expresión $F(x) = \frac{1 + \frac{1}{x}}{1 - \frac{1}{x^2}}$, identifica por qué es una fracción compleja, simplifícala a una fracción simple y evalúa para $x = 3$.'
  pasos:
    - 'Paso 1: Identificar las sub-fracciones en el numerador $\frac{1}{x}$ y en el denominador $\frac{1}{x^2}$, lo cual confirma que es una fracción compleja.'
    - 'Paso 2: Sumar el numerador: $1 + \frac{1}{x} = \frac{x + 1}{x}$.'
    - 'Paso 3: Restar el denominador: $1 - \frac{1}{x^2} = \frac{x^2 - 1}{x^2} = \frac{(x - 1)(x + 1)}{x^2}$.'
    - 'Paso 4: Expresar la división: $\frac{\frac{x + 1}{x}}{\frac{(x - 1)(x + 1)}{x^2}} = \frac{x + 1}{x} \cdot \frac{x^2}{(x - 1)(x + 1)} = \frac{x}{x - 1}$ para $x \notin \{-1, 0, 1\}$.'
    - 'Paso 5: Evaluar para $x = 3$: $\frac{3}{3 - 1} = \frac{3}{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica define a una expresión como una fracción algebraica compleja?'
    choices:
      - {text: 'Que contiene una o más fracciones en su numerador, en su denominador o en ambos.', is_correct: true}
      - {text: 'Que sus variables pertenecen a los números complejos imaginarios.', is_correct: false}
      - {text: 'Que el grado del numerador es estrictamente igual al del denominador.', is_correct: false}
      - {text: 'Que no se puede simplificar mediante ningún método algebraico.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que contiene una o más fracciones en su numerador, en su denominador o en ambos.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar la fracción compleja $\frac{1 + \frac{1}{x}}{1 - \frac{1}{x^2}}$ y evaluar para $x = 3$, ¿cuál es el resultado?'
    choices:
      - {text: '$\frac{3}{2}$', is_correct: true}
      - {text: '$\frac{2}{3}$', is_correct: false}
      - {text: '$3$', is_correct: false}
      - {text: '$\frac{3}{4}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{3}{2}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la barra principal de división de la fracción alineada con el signo de igualdad.'
  - 'Paso 2: Identificar las sub-fracciones secundarias presentes en el numerador y en el denominador.'
  - 'Paso 3: Operar la suma o resta del numerador para obtener una sola fracción superior.'
  - 'Paso 4: Operar la suma o resta del denominador para obtener una sola fracción inferior.'
  - 'Paso 5: Aplicar la división entre la fracción superior y la fracción inferior (regla de los extremos y medios).'
errores_correccion: |
  - **Error 1:** Confundir la barra principal de la fracción con las barras secundarias al simplificar. **Cómo corregirlo:** La barra principal **ES DE MAYOR LONGITUD Y ALINEA LA OPERACIÓN GLOBAL; RESUELVE NUMERADOR Y DENOMINADOR POR SEPARADO RESPECTO A ELLA**.
  - **Error 2:** Omitir restricciones del dominio provenientes de los denominadores de las sub-fracciones. **Cómo corregirlo:** Las restricciones del dominio **INCLUYEN LOS CEROS DE TODOS LOS DENOMINADORES SECUNDARIOS Y DEL DENOMINADOR GLOBAL**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la forma simple de $\frac{\frac{2}{x}}{\frac{4}{x^2}}$?'
    alternativas:
      - '$\frac{x}{2}$'
      - '$\frac{2}{x}$'
      - '$\frac{8}{x^3}$'
    respuesta: '$\frac{x}{2}$'
    solucion_pasos:
      - '1. Extremos: $2 \cdot x^2 = 2x^2$.'
      - '2. Medios: $x \cdot 4 = 4x$.'
      - '3. Cociente: $\frac{2x^2}{4x} = \frac{x}{2}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al simplificar $\frac{1 + \frac{1}{a}}{a + 1}$, ¿cuál es la expresión reducida resultante?'
    alternativas:
      - '$\frac{1}{a}$'
      - '$a$'
      - '$\frac{a+1}{a}$'
    respuesta: '$\frac{1}{a}$'
    solucion_pasos:
      - '1. Numerador homogeneizado: $\frac{a+1}{a}$.'
      - '2. Dividir por $(a+1)$: $\frac{\frac{a+1}{a}}{a+1} = \frac{a+1}{a(a+1)} = \frac{1}{a}$.'
  - titulo: 'Sub-fracciones secundarias'
    enunciado: '¿La presencia de una suma de fracciones en el numerador convierte a la expresión en una fracción compleja?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, basta que contenga una sub-fracción en el numerador o denominador para ser compleja.'
  - titulo: 'Constante entera como numerador global'
    enunciado: '¿Una expresión con numerador entero y denominador con sub-fracciones es una fracción compleja?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues posee expresiones fraccionarias secundarias en el denominador.'
errores_frecuentes:
  - 'Confundir la barra de división principal con las barras secundarias de las sub-fracciones.'
  - 'Omitir la suma previa de los términos en el numerador antes de aplicar extremos y medios.'
  - 'Cancelar directamente términos entre el numerador global y denominadores secundarios.'
  - 'Olvidar declarar las restricciones de dominio de los denominadores secundarios.'
  - 'Multiplicar los medios en el numerador y los extremos en el denominador por inversión errónea.'
afirmaciones_verdaderas:
  - 'Una fracción compleja contiene sub-fracciones secundarias operadas en su numerador, denominador o ambos.'
  - 'La simplificación de una fracción compleja la transforma en una fracción racional irreducible simple.'
al_terminar_debes_poder: |
  QUÉ: Reconocer la estructura de una fracción algebraica compleja.
  CÓMO: Identificar su barra principal y reducir sus sub-fracciones secundarias a una fracción simple equivalente.
