semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.DEFINICION
resumen_inicial: Una fracción algebraica compleja es aquella que contiene una o más
  fracciones algebraicas dentro de su numerador, su denominador o ambos.
explicacion_simple: 'Una fracción algebraica compleja (o compuesta) es simplemente
  una fracción de fracciones.

  Se reconoce de inmediato porque en su parte superior (numerador) o en su parte inferior
  (denominador) aparecen operaciones de suma, resta o división entre otras fracciones
  menores.

  Para resolverlas, el objetivo principal es simplificarlas hasta convertirlas en
  una única fracción simple tradicional.'
explicacion_formal: 'Una **fracción algebraica compleja** se define como el cociente
  racional de dos expresiones $N(x)$ y $D(x)$ donde al menos uno de los términos pertenece
  al cuerpo de funciones racionales $\mathbb{R}(x)$:


  $$F(x) = \frac{N(x)}{D(x)} = \frac{\frac{A(x)}{B(x)} \pm \frac{C(x)}{E(x)}}{\frac{P(x)}{Q(x)}
  \pm \frac{R(x)}{S(x)}}$$


  **Desglose de la fórmula:**

  - $N(x), D(x)$: Expresiones compuestas que incluyen sumas o restas de sub-fracciones.

  - $B(x), E(x), Q(x), S(x) \neq 0$: Exigen que todos los denominadores de las sub-fracciones
  sean no nulos en su dominio de definición.'
definiciones_clave: '- **Fracción algebraica compleja**: Estructura racional que posee
  fracciones secundarias en su numerador y/o denominador.

  - **Barra principal de fracción**: Línea divisoria de mayor longitud que separa
  el numerador global del denominador global.'
propiedades_relaciones: '- **Métodos de resolución**: Se pueden resolver homogeneizando
  el numerador y denominador por separado o multiplicando toda la expresión por el
  m.c.m. de todos los denominadores secundarios.

  - **Dominio extendido**: Excluye los ceros de las sub-fracciones y los ceros del
  denominador global completo.'
ejemplo_guiado:
  enunciado: Dada la expresión $F(x) = \frac{1 + \frac{1}{x}}{1 - \frac{1}{x^2}}$,
    identifica por qué es una fracción compleja, simplifícala a una fracción simple
    y evalúa para $x = 3$.
  pasos:
  - 'Paso 1: Identificar las sub-fracciones en el numerador $\frac{1}{x}$ y en el
    denominador $\frac{1}{x^2}$, lo cual confirma que es una fracción compleja.'
  - 'Paso 2: Sumar el numerador: $1 + \frac{1}{x} = \frac{x + 1}{x}$.Paso 3: Restar
    el denominador: $1 - \frac{1}{x^2} = \frac{x^2 - 1}{x^2} = \frac{(x - 1)(x + 1)}{x^2}$.Paso
    4: Expresar la división: $\frac{\frac{x + 1}{x}}{\frac{(x - 1)(x + 1)}{x^2}} =
    \frac{x + 1}{x} \cdot \frac{x^2}{(x - 1)(x + 1)} = \frac{x}{x - 1}$ para $x \notin
    \{-1, 0, 1\}$.Paso 5: Evaluar para $x = 3$: $\frac{3}{3 - 1} = \frac{3}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué característica define a una expresión como una fracción algebraica
    compleja?
  choices:
  - text: Que contiene una o más fracciones en su numerador, en su denominador o en
      ambos.
    is_correct: true
  - text: Que sus variables pertenecen a los números complejos imaginarios.
    is_correct: false
  - text: Que el grado del numerador es estrictamente igual al del denominador.
    is_correct: false
  - text: Que no se puede simplificar mediante ningún método algebraico.
    is_correct: false
  explanation: La alternativa correcta es 'Que contiene una o más fracciones en su
    numerador, en su denominador o en ambos.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar la fracción compleja $\frac{1 + \frac{1}{x}}{1 - \frac{1}{x^2}}$
    y evaluar para $x = 3$, ¿cuál es el resultado?
  choices:
  - text: $\frac{3}{2}$
    is_correct: true
  - text: $\frac{2}{3}$
    is_correct: false
  - text: $3$
    is_correct: false
  - text: $\frac{3}{4}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{3}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la barra principal de división de la fracción.'
- 'Paso 2: Identificar las sub-fracciones secundarias presentes en el numerador y
  en el denominador.'
- 'Paso 3: Operar la suma o resta del numerador para obtener una sola fracción superior.'
- 'Paso 4: Operar la suma o resta del denominador para obtener una sola fracción inferior.'
- 'Paso 5: Aplicar la división entre la fracción superior y la fracción inferior (regla
  de los extremos y medios).'
errores_correccion: '- **Error común:** Confundir la barra principal de la fracción
  con las barras secundarias al simplificar.

  - **Cómo corregirlo:** La barra principal es más larga y está alineada con el signo
  igual. Resuelve primero el numerador y el denominador por separado respecto a esa
  barra.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración de fracción compleja.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de fracción compleja.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se aplica extremos y medios en fracciones complejas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla básica de simplificación.
- titulo: ¿Las fracciones continuas infinitas se resuelven con ecuaciones cuadráticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, aprovechando su propiedad de auto-similitud.
errores_frecuentes:
- Confundir la barra principal de división con las barras secundarias.
- Invertir los medios y ponerlos en el numerador en la regla de extremos y medios.
- Multiplicar por el m.c.m. solo algunos términos omitiendo el denominador.
- Intentar resolver fracciones continuas finitas de arriba hacia abajo.
- Aceptar soluciones negativas al resolver fracciones continuas infinitas de términos
  positivos.
afirmaciones_verdaderas:
- Una fracción compleja se simplifica multiplicando extremos con extremos y medios
  con medios.
- Multiplicar numerador y denominador por el m.c.m. de las sub-fracciones elimina
  la complejidad en un solo paso.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, simplificar
  y resolver fracciones algebraicas complejas y continuas expresando el resultado
  en su forma más simple.
