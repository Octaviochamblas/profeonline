semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.DEFINICION
resumen_inicial: Una fracción algebraica compleja contiene una o más sub-fracciones en su numerador, denominador o en ambos.
explicacion_simple: |
  Una **fracción algebraica compleja** (o compuesta) es una expresión donde el numerador o el denominador principales contienen a su vez otras fracciones algebraicas secundarias.

  La clave para identificarlas radica en ubicar la **barra de división principal**, la cual suele ser más larga y se encuentra alineada con el signo igual.

  Simplificar una fracción compleja consiste en transformar esa estructura de varios niveles en una sola fracción algebraica simple con numeradores y denominadores polinomiales enteros.
explicacion_formal: |
  ### Definición formal
  Sea $E(x)$ una expresión racional. $E(x)$ es una **fracción algebraica compleja** si adopta una de las siguientes formas estructurales:

  $$E(x) = \frac{\frac{P_1(x)}{Q_1(x)}}{P_2(x)} \quad \lor \quad E(x) = \frac{P_1(x)}{\frac{P_2(x)}{Q_2(x)}} \quad \lor \quad E(x) = \frac{\frac{P_1(x)}{Q_1(x)} \pm \frac{P_2(x)}{Q_2(x)}}{\frac{P_3(x)}{Q_3(x)} \pm \frac{P_4(x)}{Q_4(x)}}$$

  ### Desglose de la fórmula
  - Barra principal de fracción: Define el dividendo global (numerador) y el divisor global (denominador).
  - Sub-fracciones $\frac{P_i(x)}{Q_i(x)}$: Fracciones secundarias operadas dentro de cada nivel.

  ### Síntesis didáctica
  Reconocer una fracción compleja exige discriminar la barra divisoria principal de las barras secundarias presentes en los sub-niveles.
definiciones_clave: |
  - **Fracción compleja**: Expresión con sub-fracciones secundarias en el numerador o en el denominador.
  - **Barra de división principal**: Trazo fraccionario central que separa el numerador global del denominador global.
propiedades_relaciones: |
  - **Jerarquía operacional**: Las operaciones dentro del numerador y denominador secundarios tienen prioridad antes de realizar la división principal.
  - **Dominio compuesto**: El dominio debe excluir los ceros de todos los denominadores secundarios y del denominador global resultante.
ejemplo_guiado:
  enunciado: 'Identifica la estructura de la fracción compleja $\frac{1 + \frac{1}{x}}{1 - \frac{1}{x^2}}$, redúcela a una fracción simple y evalúa para $x = 3$.'
  pasos:
    - 'Paso 1: Numerador global: $1 + \frac{1}{x} = \frac{x + 1}{x}$.'
    - 'Paso 2: Denominador global: $1 - \frac{1}{x^2} = \frac{x^2 - 1}{x^2}$.'
    - 'Paso 3: Expresar como cociente de fracciones: $\frac{\frac{x + 1}{x}}{\frac{x^2 - 1}{x^2}}$.'
    - 'Paso 4: Aplicar extremos y medios: $\frac{(x + 1) \cdot x^2}{x \cdot (x^2 - 1)} = \frac{(x + 1)x^2}{x(x - 1)(x + 1)}$.'
    - 'Paso 5: Cancelar términos comunes: $\frac{x}{x - 1}$ para $x \notin \{-1, 0, 1\}$.'
    - 'Paso 6: Evaluar para $x = 3$: $\frac{3}{3 - 1} = \frac{3}{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué caracteriza estructuralmente a una fracción algebraica compleja?'
    choices:
      - {text: 'Contiene sub-fracciones en su numerador, denominador o en ambos.', is_correct: true}
      - {text: 'Tiene únicamente numeradores de grado 3 o mayor.', is_correct: false}
      - {text: 'Posee denominadores que no se pueden factorizar.', is_correct: false}
      - {text: 'Es la suma de dos números enteros positivos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Contiene sub-fracciones en su numerador, denominador o en ambos.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar $\frac{1 + \frac{1}{x}}{1 - \frac{1}{x^2}}$ y evaluar la forma reducida en $x = 3$, ¿cuál es el valor obtenido?'
    choices:
      - {text: '$\frac{3}{2}$', is_correct: true}
      - {text: '$\frac{2}{3}$', is_correct: false}
      - {text: '$3$', is_correct: false}
      - {text: '$\frac{4}{3}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{3}{2}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la barra de división principal.'
  - 'Paso 2: Sumar o restar las fracciones presentes en el numerador global para obtener una sola fracción.'
  - 'Paso 3: Sumar o restar las fracciones presentes en el denominador global para obtener una sola fracción.'
  - 'Paso 4: Aplicar la regla de división de fracciones (multiplicar por el recíproco o extremos con medios).'
  - 'Paso 5: Factorizar y simplificar el resultado final.'
errores_correccion: |
  - **Error 1:** Confundir la barra principal con una barra secundaria y multiplicar términos en orden incorrecto. **Cómo corregirlo:** La barra principal siempre es más larga y está alineada con el signo igual o con la operación principal.
  - **Error 2:** Cancelar términos entre el numerador global y denominadores secundarios antes de unificar. **Cómo corregirlo:** Nunca se cancela directamente; primero se debe reducir el numerador y el denominador a fracciones únicas.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la forma simple equivalente de $\frac{\frac{2x}{3}}{4}$?'
    alternativas:
      - '$\frac{x}{6}$'
      - '$\frac{8x}{3}$'
      - '$\frac{2x}{12}$'
    respuesta: '$\frac{x}{6}$'
    solucion_pasos:
      - '1. Convertir 4 a fracción: $\frac{4}{1}$.'
      - '2. Extremos y medios: $\frac{2x \cdot 1}{3 \cdot 4} = \frac{2x}{12}$.'
      - '3. Simplificar: $\frac{x}{6}$.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿La expresión $\frac{x}{\frac{2}{x}}$ es una fracción compleja de segundo nivel?'
    alternativas:
      - 'Sí, equivale a $\frac{x^2}{2}$.'
      - 'No, es un polinomio entero.'
      - 'Sí, equivale a $\frac{2}{x^2}$.'
    respuesta: 'Sí, equivale a $\frac{x^2}{2}$.'
    solucion_pasos:
      - '1. Numerador: $\frac{x}{1}$.'
      - '2. Extremos y medios: $\frac{x \cdot x}{1 \cdot 2} = \frac{x^2}{2}$.'
  - titulo: 'Constante entera como numerador global'
    enunciado: '¿Una expresión con numerador entero y denominador con sub-fracciones es una fracción compleja?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues posee expresiones fraccionarias secundarias en el denominador.'
  - titulo: 'Jerarquía operacional'
    enunciado: '¿Tienen prioridad las operaciones dentro de los niveles secundarios antes de la división principal?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se deben unificar numeradores y denominadores antes de dividir.'
errores_frecuentes:
  - 'En una fracción compleja $\frac{\frac{A}{B}}{\frac{C}{D}}$, la barra de división principal no influye en la jerarquía de las operaciones.'
  - 'Al simplificar la fracción compleja $\frac{1 + \frac{1}{x}}{2}$, se pueden cancelar directamente el $1$ entero del numerador con el $2$ del denominador.'
  - 'Una expresión algebraica con sub-fracciones en el denominador equivale a la resta directa de sus términos.'
  - 'Las restricciones de dominio de una fracción compleja consideran únicamente la anulación del denominador global.'
  - 'Al aplicar la regla de extremos y medios en $\frac{\frac{A}{B}}{\frac{C}{D}}$, el resultado es $\frac{A \cdot C}{B \cdot D}$.'
afirmaciones_verdaderas:
  - 'Una fracción compleja contiene sub-fracciones secundarias operadas en su numerador, denominador o ambos.'
  - 'La simplificación de una fracción compleja la transforma en una fracción racional irreducible simple.'
al_terminar_debes_poder: |
  QUÉ: Reconocer la estructura de una fracción algebraica compleja.
  CÓMO: Identificar su barra principal de división y reducir sus sub-fracciones secundarias para obtener una fracción racional simple equivalente.
