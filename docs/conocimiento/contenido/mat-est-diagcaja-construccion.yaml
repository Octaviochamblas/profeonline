semantic_id: MAT.EST.DIAGRAMA_CAJA.CONSTRUCCION
titulo: Construir un diagrama de caja a partir del resumen de cinco números
objetivo: Construir un diagrama de caja y bigotes a partir del resumen de cinco números
  de un conjunto de datos.
introduccion: Con los cinco números clave ya calculados, dibujar el diagrama de caja
  es solo cuestión de ubicarlos en una recta numérica y unirlos con los trazos correctos.
resumen: Para construir un diagrama de caja se dibuja una caja entre $Q_1$ y $Q_3$
  con una línea en la mediana, y bigotes que se extienden hasta el mínimo y el máximo.
explicacion: '![Construcción del diagrama de caja](/static/img/estadistica/diagcaja/diagcaja-construccion.svg)


  ### Definición formal


  Se traza una recta numérica, se dibuja una caja rectangular con extremos en $Q_1$
  y $Q_3$, se marca una línea vertical

  en la mediana dentro de la caja, y se extienden bigotes desde los bordes de la caja
  hasta el mínimo y el máximo.


  ### Desarrollo didáctico


  El orden correcto es siempre el mismo: primero calcular el resumen de cinco números,
  luego trazar la caja, y por

  último agregar los bigotes hacia los valores extremos.'
procedimiento:
- 'Paso 1: Calcula el resumen de cinco números del conjunto de datos.'
- 'Paso 2: Dibuja una caja rectangular con extremos en $Q_1$ y $Q_3$, marcando la
  mediana en su interior.'
- 'Paso 3: Traza los bigotes desde los bordes de la caja hasta el mínimo y el máximo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el resumen de cinco números es mínimo 5, $Q_1=10$, mediana 15, $Q_3=20$,
    máximo 25, ¿dónde se dibuja la caja?
  solucion_pasos:
  - La caja se dibuja entre 10 y 20 (entre $Q_1$ y $Q_3$).
  - La línea de la mediana se marca en 15, dentro de la caja.
- titulo: Ejemplo 2
  enunciado: ¿Hasta dónde se extienden los bigotes en un diagrama de caja construido
    a partir del resumen anterior?
  solucion_pasos:
  - El bigote inferior se extiende desde $Q_1=10$ hasta el mínimo, 5.
  - El bigote superior se extiende desde $Q_3=20$ hasta el máximo, 25.
- titulo: ¿La caja del diagrama se dibuja siempre entre $Q_1$ y $Q_3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, esos dos valores son los bordes de la caja.
- titulo: ¿Los bigotes se dibujan entre $Q_1$ y $Q_3$?
  respuesta: 'No'
  solucion_pasos:
  - No, los bigotes van desde los bordes de la caja hasta el mínimo y el máximo.
errores_frecuentes:
- Dibujar la caja entre el mínimo y el máximo en vez de entre $Q_1$ y $Q_3$.
- Omitir la línea de la mediana dentro de la caja.
- Declarar el orden de construcción y dibujar los bigotes antes que la caja.
- Ubicar mal la posición de la mediana dentro de la caja.
- No calcular correctamente el resumen de cinco números antes de dibujar.
fuente: Elaboración propia.
estado: publicado
