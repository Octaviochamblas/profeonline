semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_DECRECIMIENTO
resumen_inicial: 'El modelamiento de decaimiento exponencial aplica la función $Q(t) = Q_0 \cdot (1 - r)^t$ para representar la reducción de masa, sustancias o valores a una tasa $0 < r < 1$.'
explicacion_simple: |
  En muchos fenómenos naturales y económicos, las cantidades disminuyen a un ritmo proporcional a lo que queda de ellas. Por ejemplo, una medicina en la sangre se elimina poco a poco, un elemento radiactivo pierde masa con el tiempo, o un automóvil pierde valor (depreciación) cada año. Estos procesos se modelan con $Q(t) = Q_0 \cdot (1 - r)^t$, donde $Q_0$ es la cantidad inicial, $r$ es el porcentaje de reducción por periodo, y la base resulta un número entre 0 y 1.
explicacion_formal: |
  ### Definición formal
  El **modelo de decaimiento o desintegración exponencial** en función del tiempo $t \ge 0$ se define analíticamente mediante la ecuación de reducción porcentual constante $0 < r < 1$:
  $$Q(t) = Q_0 \cdot (1 - r)^t$$
  donde $Q_0 = Q(0) > 0$ es la cantidad inicial en el origen y $b = 1 - r \in ]0, 1[$ es la base de decaimiento relativo.

  ### Desglose simbólico
  - Tasa de reducción porcentual $r = 1 - b \in ]0, 1[$. Si un vehículo se deprecia un $15\%$ anual $\implies r = 0.15 \implies b = 1 - 0.15 = 0.85$.
  - Modelo de vida media o semivida: $Q(t) = Q_0 \cdot \left(\frac{1}{2}\right)^{t / T_{1/2}}$, donde $T_{1/2}$ es el **periodo de semivida** (tiempo necesario para reducir la masa a la mitad).
  - Tasa instantánea de disminución: $\frac{dQ}{dt} = -k \cdot Q(t)$, $k > 0$, expresando que la rapidez de pérdida es proporcional a la masa remanente.

  ### Síntesis didáctica
  Diferenciar pérdida por resta fija de pérdida por porcentaje: Si un estanque pierde 10 litros cada hora, es un modelo lineal $Q(t) = Q_0 - 10t$. Si pierde un $10\%$ de su contenido cada hora, es un modelo exponencial $Q(t) = Q_0 \cdot (0.9)^t$.
definiciones_clave: |
  - **Cantidad inicial $Q_0$**: Masa, población o valor económico presente en el instante $t = 0$.
  - **Tasa de decaimiento $r$**: Porcentaje de reducción relativa expresado como fracción decimal por unidad de tiempo.
  - **Periodo de semivida $T_{1/2}$**: Tiempo requerido para que la cantidad inicial se reduzca exactamente a la mitad ($Q = \frac{1}{2}Q_0$).
propiedades_relaciones: |
  - **Invariancia de la semivida**: El tiempo necesario para reducir cualquier masa remanente a su mitad es constante e independiente de la masa inicial.
  - **Inalcanzabilidad del valor cero**: En el modelo teórico continuo $Q(t) = Q_0 \cdot b^t$, la cantidad remanente se aproxima a cero sin llegar a ser exactamente cero en un tiempo finito.
ejemplo_guiado:
  enunciado: 'Un medicamento se elimina del cuerpo a razón de una semivida de 4 horas. Si un paciente ingiere una dosis inicial de 160 mg, formula la función de masa remanente $M(t)$ en horas, y calcula cuántos mg quedan en el cuerpo al cabo de 12 horas.'
  pasos:
    - 'Paso 1: Identificamos la dosis inicial $M_0 = 160\text{ mg}$ y la semivida $T_{1/2} = 4\text{ horas}$.'
    - 'Paso 2: Formulamos la función de semivida: $M(t) = 160 \cdot \left(\frac{1}{2}\right)^{t/4}$.'
    - 'Paso 3: Para $t = 12\text{ horas}$, calculamos el exponente de ciclos de semivida: $\frac{12}{4} = 3$ periodos de 4 horas.'
    - 'Paso 4: Evaluamos $M(12) = 160 \cdot \left(\frac{1}{2}\right)^3 = 160 \cdot \frac{1}{8} = 20\text{ mg}$.'
    - 'Paso 5: Conclusión: Al cabo de 12 horas quedan 20 mg de medicamento en el cuerpo.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Un automóvil comprado en 10.000.000 de pesos se deprecia a una tasa del $12\%$ anual. ¿Cuál es la función de valor $V(t)$ en pesos al cabo de $t$ años?'
    choices:
      - {text: '$V(t) = 10000000 \cdot (0.88)^t$', is_correct: true}
      - {text: '$V(t) = 10000000 \cdot (0.12)^t$', is_correct: false}
      - {text: '$V(t) = 10000000 - 1200000t$', is_correct: false}
      - {text: '$V(t) = 10000000 \cdot (1.12)^t$', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(t) = 10000000 \cdot (0.88)^t$''. La base se calcula restando la tasa a la unidad: $b = 1 - 0.12 = 0.88$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una muestra de 64 gramos de un isótopo radiactivo tiene una semivida de 5 días. ¿Cuántos gramos de sustancia quedarán sin desintegrar al cabo de 15 días?'
    choices:
      - {text: '8 gramos', is_correct: true}
      - {text: '16 gramos', is_correct: false}
      - {text: '32 gramos', is_correct: false}
      - {text: '0 gramos', is_correct: false}
    explanation: 'La alternativa correcta es ''8 gramos''. Transcurren $15/5 = 3$ semividas. Calculamos $64 \cdot (0.5)^3 = 64 \cdot \frac{1}{8} = 8\text{ gramos}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la cantidad inicial $Q_0 = Q(0)$ del enunciado.'
  - 'Paso 2: Calcular la base $b = 1 - r$ si se indica el porcentaje de reducción $r$, o usar $b = 0.5$ para semivida.'
  - 'Paso 3: Formular la función exponencial de decaimiento $Q(t) = Q_0 \cdot b^{t / T}$.'
  - 'Paso 4: Sustituir el tiempo $t$ y calcular la cantidad remanente solicitada.'
errores_correccion: |
  - **Error 1:** Usar el porcentaje de pérdida $r$ directamente como la base (ej: para una pérdida del $10\%$ escribir $Q_0 \cdot (0.1)^t$). **Cómo corregirlo:** La base representa lo que **queda**, calculándose como $b = 1 - r = 1 - 0.10 = 0.90$.
  - **Error 2:** Restar la cantidad perdida al exponente. **Cómo corregirlo:** El porcentaje se descuenta de la base $(1-r)$. El exponente $t$ representa exclusivamente el paso del tiempo.
ejemplos:
  - titulo: 'Cálculo de base de depreciación'
    enunciado: '¿Cuál es la base de decaimiento para una maquinaria que se deprecia un $25\%$ anual?'
    alternativas:
      - '$b = 0.75$'
      - '$b = 0.25$'
      - '$b = 1.25$'
    respuesta: '$b = 0.75$'
    solucion_pasos:
      - '1. Tasa de pérdida $r = 25\% = 0.25$.'
      - '2. Base remanente $b = 1 - 0.25 = 0.75$.'
  - titulo: 'Semivida de un elemento'
    enunciado: 'Si $M(t) = 100 \cdot (0.5)^t$ en días, ¿cuál era la masa inicial?'
    respuesta: '100 gramos'
    solucion_pasos:
      - '1. Evaluamos $t = 0 \implies M(0) = 100 \cdot (0.5)^0 = 100$ gramos.'
  - titulo: 'Dos semividas completas'
    enunciado: 'Si transcurren 2 semividas completas, ¿la masa se reduce a la cuarta parte ($\frac{1}{4}$) de la original?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0.5)^2 = \frac{1}{4} = 0.25$ (queda el $25\%$ de la masa inicial).'
  - titulo: 'Positivismo permanente de la masa'
    enunciado: '¿Puede un modelo de decaimiento exponencial arrojar una masa negativa?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Dado que $Q_0 > 0$ y $b > 0$, la función $Q_0 \cdot b^t$ es estrictamente positiva para todo $t$.'
errores_frecuentes:
  - 'Un objeto que pierde un $20\%$ de su valor al año tiene una función de depreciación $V(t) = V_0 \cdot (0.2)^t$.'
  - 'Tras transcurrir 2 semividas completas, la cantidad de sustancia radiactiva se reduce a cero.'
  - 'El modelo de decaimiento exponencial representa pérdidas por cantidades fijas iguales en cada periodo.'
  - 'En un modelo de semivida $M(t) = M_0 \cdot (0.5)^{t/3}$, el valor 3 representa la masa inicial.'
  - 'La masa remanente en un modelo de decaimiento pasa a ser negativa cuando $t$ es muy grande.'
afirmaciones_verdaderas:
  - 'El modelo de decaimiento exponencial $Q(t) = Q_0 \cdot (1 - r)^t$ utiliza una base $b = 1 - r \in ]0, 1[$ que representa la fracción remanente de cada periodo.'
  - 'En el modelo de semivida $Q(t) = Q_0 \cdot (0.5)^{t/T_{1/2}}$, la masa se reduce a la mitad cada vez que el tiempo avanza en un intervalo $T_{1/2}$.'
