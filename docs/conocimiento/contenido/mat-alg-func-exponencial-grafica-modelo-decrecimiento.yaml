semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_DECRECIMIENTO
resumen_inicial: 'Modelamiento de fenómenos de decaimiento mediante funciones exponenciales:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: Así como una población puede crecer multiplicándose por un factor
  fijo, una cantidad también puede reducirse en la misma proporción cada período,
  como ocurre con la depreciación de un vehículo o la desintegración radiactiva.
explicacion_formal: '### Definición formal


  Un fenómeno que disminuye una tasa fija $r$ (expresada como decimal) por cada unidad
  de tiempo se modela como $C(t)=C_0\cdot(1-r)^t$, donde la base $b=1-r$ cumple $0<b<1$
  (suponiendo $0<r<1$), garantizando decrecimiento.


  ### Desarrollo didáctico


  Para plantear el modelo, se identifica el valor inicial y la tasa de decrecimiento
  porcentual, restándola de 1 (en su forma decimal) para obtener la base.


  Un vehículo de $\$10.000.000$ se deprecia un $15\%$ anual: el modelo es $V(t)=10.000.000\cdot(0{,}85)^t$,
  con base $b=1-0{,}15=0{,}85$.'
definiciones_clave: '- **Modelamiento de fenómenos de decaimiento mediante funciones
  exponenciales**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a modelamiento de fenómenos de decaimiento mediante funciones exponenciales.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de modelamiento
    de fenómenos de decaimiento mediante funciones exponenciales.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de modelamiento de fenómenos
    de decaimiento mediante funciones exponenciales.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    modelamiento de fenómenos de decaimiento mediante funciones exponenciales?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis gráfico
      y modelamiento exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis gráfico y modelamiento exponencial. Es la condición
    de existencia para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en modelamiento de fenómenos de decaimiento mediante funciones exponenciales?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el valor inicial $C_0$ y la tasa de decrecimiento porcentual
  $r\%$.'
- 'Paso 2: Convierte la tasa a decimal y calcula la base $b=1-r$.'
- 'Paso 3: Plantea el modelo $C(t)=C_0\cdot b^t$.'
- 'Paso 4: Evalúa el modelo en el tiempo solicitado.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en modelamiento
  de fenómenos de decaimiento mediante funciones exponenciales.
ejemplos:
- titulo: Cálculo de valor tras depreciación
  enunciado: Un computador de $\$800.000$ se deprecia un $20\%$ anual. Calcula su
    valor después de $3$ años.
  solucion_pasos:
  - 'Modelo: $V(t)=800.000\cdot(0{,}8)^t$.'
  - $V(3)=800.000\cdot(0{,}8)^3=800.000\cdot0{,}512=\$409.600$.
- titulo: Cálculo de masa restante en desintegración
  enunciado: Una muestra radiactiva de $100$ g pierde un $10\%$ de su masa cada hora.
    Calcula la masa después de $2$ horas.
  solucion_pasos:
  - 'Modelo: $M(t)=100\cdot(0{,}9)^t$.'
  - $M(2)=100\cdot(0{,}9)^2=100\cdot0{,}81=81$ g.
- titulo: ¿La base de un modelo de decaimiento con tasa $r\%$ es siempre $1-r$ (en
    decimal)?
  enunciado: ¿La base de un modelo de decaimiento con tasa $r\%$ es siempre $1-r$
    (en decimal)?
  respuesta: Sí
  solucion_pasos:
  - Restar la tasa decimal a 1 representa el 100% original menos el porcentaje que
    se pierde.
- titulo: ¿Un valor que se reduce a la mitad cada período corresponde a una base igual
    a $0{,}5$?
  enunciado: ¿Un valor que se reduce a la mitad cada período corresponde a una base
    igual a $0{,}5$?
  respuesta: Sí
  solucion_pasos:
  - Reducirse a la mitad significa multiplicar por 0,5 en cada unidad de tiempo, lo
    que corresponde a $b=0{,}5$.
errores_frecuentes:
- Sumar la tasa en vez de restarla al construir la base del modelo de decaimiento.
- Declarar la tasa de decrecimiento $r$ con la base $b=1-r$ del modelo.
- Usar directamente el porcentaje (por ejemplo, 20) en vez de su forma decimal (0,2).
- No verificar que la tasa $r$ sea menor que 1, lo que produciría una base negativa
  inválida.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando modelamiento de fenómenos de decaimiento mediante funciones exponenciales.
