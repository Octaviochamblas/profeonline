semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_CRECIMIENTO
resumen_inicial: El modelamiento de crecimiento poblacional utiliza la estructura $P(t) = P_0 \cdot (1 + r)^t$ para representar la proliferación de especies en el tiempo.
explicacion_simple: |
  Cuando una población de bacterias, animales o personas **crece a un porcentaje constante $r$** en cada periodo de tiempo $t$:

  - Usamos el **modelo de crecimiento exponencial**:

  $$P(t) = P_0 \cdot (1 + r)^t$$

  - **$P_0$ es la población inicial**: Cantidad de individuos en $t = 0$.
  - **$r$ es la tasa de crecimiento porcentual**: Expresada en decimal (ej. $5\% \implies r = 0.05$).
  - **$b = 1 + r$ es el factor de crecimiento**: Como $r > 0$, la base $b = 1 + r > 1$, lo que genera un **crecimiento acelerado**.
explicacion_formal: |
  Sea $P: \mathbb{R}^+ \cup \{0\} \to \mathbb{R}^+$ el modelo dinámico continuo o discreto de la abundancia de una población. El **modelo de crecimiento exponencial malthusiano** viene dado por la ecuación diferencial lineal homogénea:

  $$\frac{dP}{dt} = k \cdot P \quad \text{con } k > 0$$

  **Solución y reformulación algebraica:**
  1. **Solución Continua:** $P(t) = P_0 \cdot e^{kt}$, donde $k$ es la tasa intrínseca de incremento instantáneo.
  2. **Forma Discreta por Periodo de Tasa $r$:**
     $$P(t) = P_0 \cdot (1 + r)^t \quad \text{donde base } b = 1 + r > 1$$
  3. **Multiplicación Periódica (Duplicación):** Si la población se duplica cada $T$ periodos, $P(t) = P_0 \cdot 2^{t/T}$.
definiciones_clave: |
  - **Modelo de crecimiento poblacional**: Función exponencial $P(t) = P_0 \cdot b^t$ que describe la evolución de la cantidad de miembros de una población en el tiempo $t$.
propiedades_relaciones: |
  - **Tiempo de duplicación ($T_d$)**: Intervalo de tiempo constante requerido para que la población inicial $P_0$ se multiplique por dos, dado por $T_d = \frac{\ln(2)}{\ln(1+r)}$.
ejemplo_guiado:
  enunciado: 'Una colonia de bacterias inicia con 500 individuos y crece a una tasa del 20% cada hora. Determina la función modelo $P(t)$ y calcula la población a las 3 horas.'
  pasos:
    - 'Paso 1: Identificar la población inicial $P_0 = 500$ y la tasa $r = 20\% = 0.20$.'
    - 'Paso 2: Construir la base de crecimiento $b = 1 + r = 1 + 0.20 = 1.20$.'
    - 'Paso 3: Formular la función modelo: $P(t) = 500 \cdot (1.2)^t$.'
    - 'Paso 4: Evaluar para $t = 3 \implies P(3) = 500 \cdot (1.2)^3 = 500 \cdot 1.728 = 864$ bacterias.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una población de aves de $1.200$ ejemplares se duplica cada 4 años, ¿cuál es la función exponencial que modela la población $P(t)$ en función de los años $t$?'
    choices:
      - {text: '$P(t) = 1200 \cdot 2^{t/4}$', is_correct: true}
      - {text: '$P(t) = 1200 \cdot 4^t$.', is_correct: false}
      - {text: '$P(t) = 2400 \cdot 2^t$.', is_correct: false}
      - {text: '$P(t) = 1200 \cdot (1.2)^t$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$P(t) = 1200 \cdot 2^{t/4}$''. La base es 2 y el exponente escala el periodo $t/4$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En el modelo poblacional $P(t) = 3000 \cdot (1.08)^t$, ¿cuál es la tasa porcentual de crecimiento por periodo?'
    choices:
      - {text: 'La tasa de crecimiento es del 8% por periodo', is_correct: true}
      - {text: 'La tasa de crecimiento es del 80% por periodo.', is_correct: false}
      - {text: 'La tasa de crecimiento es del 1.08% por periodo.', is_correct: false}
      - {text: 'La tasa de crecimiento es del 3000% por periodo.', is_correct: false}
    explanation: 'La alternativa correcta es ''La tasa de crecimiento es del 8% por periodo''. $b = 1 + r = 1.08 \implies r = 0.08 = 8\%$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer la cantidad inicial $P_0 = P(0)$ del enunciado del problema.'
  - 'Paso 2: Convertir la tasa porcentual $r\%$ a su equivalente decimal $r = \text{porcentaje}/100$.'
  - 'Paso 3: Armar la base multiplicativa de incremento $b = 1 + r$.'
  - 'Paso 4: Escribir la función $P(t) = P_0 \cdot (1 + r)^t$ y sustituir el tiempo $t$ solicitado.'
errores_correccion: |
  - **Error común:** Usar el porcentaje directo en la base (ej. poner $b = 20$ en lugar de $b = 1.20$ para el 20%).
  - **Cómo corregirlo:** La base es siempre **$1 + r$**, donde $r$ es la fracción decimal de la tasa ($20\% = 0.20 \implies b = 1.20$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Crecimiento bacteriano del 50%.
    alternativas:
      - 'P(t) = 100 \cdot (1.5)^t, P(2) = 225'
      - 'P(t) = 100 \cdot (50)^t'
      - 'P(t) = 150 \cdot 2^t'
    respuesta: 'P(t) = 100 \cdot (1.5)^t, P(2) = 225'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Duplicación cada 6 horas.
    alternativas:
      - 'P(t) = 80 \cdot 2^{t/6}'
      - 'P(t) = 80 \cdot 6^t'
      - 'P(t) = 160 \cdot t/6'
    respuesta: 'P(t) = 80 \cdot 2^{t/6}'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada una tasa de incremento del $15\%$, la afirmación de que la base del modelo exponencial es $0.15$ en lugar de $1.15$.'
  - 'La confusión entre agregar la tasa $r$ de forma aditiva directa y aplicar el factor $(1 + r)$.'
  - 'La afirmación de que el crecimiento poblacional ilimitado se mantiene indefinidamente en ecosistemas reales con recursos finitos.'
  - 'La omisión de dividir el tiempo $t$ por el periodo de duplicación $T$ al usar bases de multiplicación fija.'
  - 'La afirmación de que la población inicial $P_0$ varía a medida que cambia la tasa $r$.'
afirmaciones_verdaderas:
  - 'En el modelo de crecimiento poblacional $P(t) = P_0 \cdot (1 + r)^t$, la base es estrictamente mayor que uno ($1 + r > 1$).'
  - 'El valor inicial $P_0$ representa la cantidad exacta de la población en el instante cero $t = 0$.'
al_terminar_debes_poder: |
  QUÉ: Modelar y resolver problemas de crecimiento poblacional mediante funciones exponenciales $P(t) = P_0 \cdot (1 + r)^t$.
  CÓMO: Identificar $P_0$, calcular la base $b = 1 + r$, evaluar para el tiempo $t$ y justificar la tasa de incremento.
