resumen_inicial: 'Al dividir raíces que comparten el mismo índice $\frac{\sqrt[n]{a}}{\sqrt[n]{b}}$,
  se dividen los radicandos dentro de un único radical conservando el índice común:
  $\sqrt[n]{\frac{a}{b}}$ ($b > 0$).'
explicacion_simple: Para dividir dos raíces con el mismo índice, podemos agrupar la
  división de los números de adentro dentro de una gran raíz que mantenga ese mismo
  índice.
explicacion_formal: 'Para todo $a \ge 0$, $b > 0$ y $n \in \mathbb{N}_{\ge 2}$, el
  **Cociente de Raíces de Igual Índice** cumple:


  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$$


  **Demostración:**

  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \frac{a^{\frac{1}{n}}}{b^{\frac{1}{n}}} = \left(\frac{a}{b}\right)^{\frac{1}{n}}
  = \sqrt[n]{\frac{a}{b}}$$


  > **Complemento didáctico:** Exige que el divisor sea strictly positivo $b > 0$
  para evitar la división por cero.'
definiciones_clave: '- **División de raíces de igual índice**: Regla $\frac{\sqrt[n]{a}}{\sqrt[n]{b}}
  = \sqrt[n]{\frac{a}{b}}$ para $b > 0$.'
propiedades_relaciones: '- **Agrupación de cociente**: Divide $a / b$ bajo el símbolo
  radical único.'
ejemplo_guiado:
  enunciado: Divida y simplifique la expresión $\frac{\sqrt{50}}{\sqrt{2}}$.
  pasos:
  - 'Paso 1: Verificar que ambas raíces tengan el mismo índice $2$.'
  - 'Paso 2: Dividir los radicandos dentro de una sola raíz: $\sqrt{\frac{50}{2}}
    = \sqrt{25}$.'
  - 'Paso 3: Calcular el resultado: $\sqrt{25} = 5$.'
  - 'Conclusión: $\frac{\sqrt{50}}{\sqrt{2}} = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento se aplica al dividir raíces que tienen el mismo índice
    n (b > 0)?
  choices:
  - text: Se dividen los radicandos dentro de una sola raíz conservando el índice
      (sqrt[n]{a/b})
    is_correct: true
  - text: Se restan los índices
    is_correct: false
  - text: Se restan los radicandos
    is_correct: false
  - text: Se elimina la raíz del denominador únicamente
    is_correct: false
  explanation: La alternativa correcta es 'Se dividen los radicandos dentro de una
    sola raíz conservando el índice (sqrt[n]{a/b})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(50) / sqrt(2), ¿cuál fue el resultado?
  choices:
  - text: 5 (porque sqrt(25) = 5)
    is_correct: true
  - text: '25'
    is_correct: false
  - text: sqrt(48)
    is_correct: false
  - text: '10'
    is_correct: false
  explanation: La alternativa correcta es '5 (porque sqrt(25) = 5)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar cocientes de raíces
  de igual índice $\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$, dividiendo
  sus radicandos bajo un índice común.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.DIVISION_IGUAL_INDICE
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.DIVISION_IGUAL_INDICE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
