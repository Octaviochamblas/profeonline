semantic_id: MAT.NUM.RAICES_PROPIEDADES.DIVISION_IGUAL_INDICE
resumen_inicial: Al dividir raíces del mismo índice, se mantiene el índice común y
  se dividen los radicandos ($\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$
  para $b > 0$).
explicacion_simple: 'Cuando divides dos raíces del mismo tipo (ejemplo: dos raíces
  cuadradas), puedes escribir una sola raíz grande y dividir los números adentro:

  $$\frac{\sqrt{18}}{\sqrt{2}} = \sqrt{\frac{18}{2}} = \sqrt{9} = 3$$

  Esto simplifica divisiones que parecen complejas.'
explicacion_formal: 'Para todo $a \ge 0$, $b > 0$ (o $a, b \in \mathbb{R}, b \neq
  0$ si $n$ es impar) y $n \in \mathbb{N}, n \ge 2$, se cumple:

  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$$ matrices'
definiciones_clave: '- **División subradical**: Cociente $\frac{a}{b}$ protegido bajo
  el mismo índice $n$.'
propiedades_relaciones: '- **Distributividad sobre el cociente**: $\sqrt[n]{\frac{a}{b}}
  = \frac{\sqrt[n]{a}}{\sqrt[n]{b}}$.'
ejemplo_guiado:
  enunciado: Calcula $\frac{\sqrt[3]{54}}{\sqrt[3]{2}}$.
  pasos:
  - Verificar que los índices sean iguales ($n = 3$).
  - 'Agrupar la división en una sola raíz cúbica: $\sqrt[3]{\frac{54}{2}}$.'
  - 'Dividir los radicandos: $54 \div 2 = 27$.'
  - 'Calcular la raíz resultante: $\sqrt[3]{27} = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la cociente $\frac{\sqrt{50}}{\sqrt{2}}$?
  choices:
  - text: '5'
    is_correct: true
  - text: '25'
    is_correct: false
  - text: \sqrt{48}
    is_correct: false
  - text: '10'
    is_correct: false
  explanation: 'La correcta es: 5. $\sqrt{\frac{50}{2}} = \sqrt{25} = 5$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Simplifica $\frac{\sqrt[4]{162}}{\sqrt[4]{2}}$.
  choices:
  - text: '3'
    is_correct: true
  - text: '81'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: '27'
    is_correct: false
  explanation: 'La correcta es: 3. $\sqrt[4]{\frac{162}{2}} = \sqrt[4]{81} = 3$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que ambas raíces tengan el mismo índice.'
- 'Paso 2: Dividir el radicando del numerador entre el del denominador.'
- 'Paso 3: Escribir el resultado bajo el radical del mismo índice.'
- 'Paso 4: Simplificar la raíz resultante.'
errores_correccion: No intentes restar los radicandos. $\frac{\sqrt{10}}{\sqrt{2}}$
  NO es $\sqrt{8}$, sino $\sqrt{5}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\frac{\sqrt{36}}{\sqrt{4}}$.
  alternativas:
  - '3'
  - '9'
  - '6'
  respuesta: '3'
  solucion_pasos:
  - $\sqrt{36/4} = \sqrt{9} = 3$.
errores_frecuentes:
- Restar los radicandos al dividir raíces.
afirmaciones_verdaderas:
- $\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$.
al_terminar_debes_ponder: Dividir raíces de igual índice simplificando las fracciones
  subradicales.
fuente: Texto escolar MINEDUC.
estado: publicado
