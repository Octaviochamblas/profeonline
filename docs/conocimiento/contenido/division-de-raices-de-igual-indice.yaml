semantic_id: MAT.NUM.RAICES_PROPIEDADES.DIVISION_IGUAL_INDICE
resumen_inicial: 'La división de raíces de igual índice simplifica el cociente dividiendo los radicandos bajo un mismo radical común: $\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$ ($b > 0$).'
explicacion_simple: |
  Dividir dos raíces que tienen el mismo índice (como dos raíces cuadradas o dos raíces cúbicas) es tan sencillo como unir la división bajo un solo signo de raíz. Tomas el número de arriba y lo divides por el de abajo dentro del radical. Por ejemplo, $\frac{\sqrt{50}}{\sqrt{2}} = \sqrt{\frac{50}{2}} = \sqrt{25} = 5$.
explicacion_formal: |
  ### Definición formal
  La **propiedad de división de radicales de igual índice** establece que para $a \in \mathbb{R}$, $b \in \mathbb{R}^+$ y todo índice $n \in \mathbb{Z}^+ \setminus \{1\}$ (con $a \ge 0$ si $n$ es par):
  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}} \quad (b \neq 0)$$

  ### Demostración mediante exponentes fraccionarios
  Expresando la división como cociente de potencias de igual exponente y aplicando la propiedad distributiva de la potencia sobre el cociente:
  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \frac{a^{1/n}}{b^{1/n}} = \left(\frac{a}{b}\right)^{1/n} = \sqrt[n]{\frac{a}{b}}$$

  ### Síntesis didáctica
  - Requisito esencial: Los índices deben ser idénticos ($n = n$) y el denominador no nulo ($b \neq 0$).
  - Operación subradical: Se mantiene el índice $n$ y se efectúa la división de radicandos $\frac{a}{b}$.
definiciones_clave: |
  - **División de igual índice**: Propiedad de unificación de cocientes de raíces de igual grado en una sola fracción subradical.
  - **Radicando cociente $\frac{a}{b}$**: Resultado de la división entre el radicando numerador y el denominador.
  - **Restricción de denominador no nulo**: Exigencia matemática $b \neq 0$ para evitar la división por cero.
propiedades_relaciones: |
  - **Distribución de la raíz sobre el cociente**: La propiedad opera en sentido inverso para separar fracciones dentro de un radical: $\sqrt[n]{\frac{a}{b}} = \frac{\sqrt[n]{a}}{\sqrt[n]{b}}$.
  - **Relación con la racionalización**: Permite eliminar radicales de denominadores dividiendo directamente si la división es exacta.
ejemplo_guiado:
  enunciado: 'Simplifica la expresión fraccionaria de raíces cúbicas $Q = \frac{\sqrt[3]{192}}{\sqrt[3]{3}}$ y determina su valor numérico.'
  pasos:
    - 'Paso 1: Verificamos que ambas raíces compartan el mismo índice cúbico ($n = 3$).'
    - 'Paso 2: Unificamos el cociente en una sola raíz cúbica: $Q = \sqrt[3]{\frac{192}{3}}$.'
    - 'Paso 3: Realizamos la división interna de los radicandos: $\frac{192}{3} = 64 \implies Q = \sqrt[3]{64}$.'
    - 'Paso 4: Calculamos la raíz cúbica exacta $4^3 = 64 \implies Q = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se simplifica el cociente de dos raíces del mismo índice $\frac{\sqrt[n]{a}}{\sqrt[n]{b}}$?'
    choices:
      - {text: 'Se dividen los radicandos dentro de una sola raíz conservando el índice común $\sqrt[n]{\frac{a}{b}}$', is_correct: true}
      - {text: 'Se restan los radicandos y se dividen los índices', is_correct: false}
      - {text: 'Se dividen los índices conservando los radicandos intactos', is_correct: false}
      - {text: 'Se multiplican las raíces por el índice $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se dividen los radicandos dentro de una sola raíz conservando el índice común $\sqrt[n]{\frac{a}{b}}$''. Se unifica la fracción en un solo radical de grado $n$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la expresión $\frac{\sqrt{75}}{\sqrt{3}}$?'
    choices:
      - {text: '$5$, ya que $\sqrt{\frac{75}{3}} = \sqrt{25} = 5$', is_correct: true}
      - {text: '$\sqrt{72}$, restando los radicandos', is_correct: false}
      - {text: '$25$, olvidando extraer la raíz cuadrada', is_correct: false}
      - {text: '$\sqrt{3}$, dividiendo los índices', is_correct: false}
    explanation: 'La alternativa correcta es ''$5$, ya que $\sqrt{\frac{75}{3}} = \sqrt{25} = 5$''. Dividimos $75 / 3 = 25$ y extraemos $\sqrt{25} = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comprobar que los índices del numerador y denominador sean idénticos ($n$).'
  - 'Paso 2: Escribir una sola raíz principal conservando el índice común $n$.'
  - 'Paso 3: Colocar la división de los radicandos $\frac{a}{b}$ como una fracción subradical.'
  - 'Paso 4: Dividir los números y extraer la raíz si resulta una potencia exacta.'
errores_correccion: |
  - **Error 1:** Restar los radicandos al dividir raíces (ej: escribir $\frac{\sqrt{50}}{\sqrt{2}} = \sqrt{48}$). **Cómo corregirlo:** En la división de raíces **los radicandos se dividen**, no se restan: $\sqrt{\frac{50}{2}} = \sqrt{25} = 5$.
  - **Error 2:** Restar o dividir los índices de las raíces (ej: $\frac{\sqrt[4]{a}}{\sqrt[4]{b}} = \sqrt[1]{\frac{a}{b}}$). **Cómo corregirlo:** El índice común $n$ no sufre alteraciones matemáticas; se mantiene constante en el resultado.
ejemplos:
  - titulo: 'División de raíces cuadradas exactas'
    enunciado: '¿Cuál es el resultado de $\frac{\sqrt{98}}{\sqrt{2}}$?'
    alternativas:
      - '$7$, pues $\sqrt{49} = 7$'
      - '$\sqrt{96}$'
      - '$49$'
    respuesta: '$7$, pues $\sqrt{49} = 7$'
    solucion_pasos:
      - '1. Unificamos la fracción: $\sqrt{\frac{98}{2}} = \sqrt{49}$.'
      - '2. Calculamos $\sqrt{49} = 7$.'
  - titulo: 'División de raíces cúbicas'
    enunciado: '¿El cociente $\frac{\sqrt[3]{54}}{\sqrt[3]{2}}$ equivale a $3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt[3]{\frac{54}{2}} = \sqrt[3]{27} = 3$.'
  - titulo: 'División con coeficientes exteriores'
    enunciado: '¿La expresión $\frac{10\sqrt{12}}{2\sqrt{3}}$ simplifica a $10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividimos coeficientes $(10 / 2 = 5)$ y raíces ($\sqrt{12 / 3} = \sqrt{4} = 2) \implies 5 \cdot 2 = 10$.'
  - titulo: 'Conservación del índice en cociente'
    enunciado: '¿El índice $n$ se mantiene invariable al unificar un cociente de raíces?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Se conserva el índice común $n$ en la expresión $\sqrt[n]{a/b}$.'
errores_frecuentes:
  - 'La división de raíces $\frac{\sqrt{a}}{\sqrt{b}}$ equivale a la resta de sus radicandos $\sqrt{a - b}$.'
  - 'Al dividir dos raíces cuadradas, el índice 2 de las raíces se divide dando exponente 1.'
  - 'Se pueden unificar en una sola raíz cocientes de radicales con índices distintos.'
  - 'El resultado de dividir $\frac{\sqrt{20}}{\sqrt{5}}$ es igual a la raíz $\sqrt{15}$.'
  - 'Es posible aplicar la propiedad de división de raíces cuando el radicando del denominador es igual a cero.'
afirmaciones_verdaderas:
  - 'La división de raíces de igual índice permite escribir el cociente de los radicandos bajo un solo radical común: $\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$.'
  - 'La propiedad de división exige que el denominador sea diferente de cero ($b \neq 0$) y que ambas raíces tengan el mismo índice.'
al_terminar_debes_poder: 'Simplificar y resolver cocientes de raíces de igual índice unificando la división de sus radicandos bajo un mismo signo radical.'
