semantic_id: MAT.NUM.RAICES_PROPIEDADES.DIVISION_IGUAL_INDICE
resumen_inicial: 'El cociente de dos raíces de igual índice es igual a la raíz del cociente de sus radicandos: $\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$, con $b \neq 0$, conservando el índice común.'
explicacion_simple: '![División de raíces de igual índice](/static/img/nodos/division-de-raices-de-igual-indice-intro.svg)


  Dividir raíces con el mismo índice es igual de directo que multiplicarlas: **mantienes el mismo índice y divides los números de adentro**.

  Por ejemplo, $\sqrt{50}$ y $\sqrt{2}$ son números irracionales inexactos, pero al dividirlos:

  $$\frac{\sqrt{50}}{\sqrt{2}} = \sqrt{\frac{50}{2}} = \sqrt{25} = 5$$

  ¡Obtenemos $5$ exacto! Esta propiedad también funciona al revés para calcular raíces de fracciones: $\sqrt{\frac{9}{49}} = \frac{\sqrt{9}}{\sqrt{49}} = \frac{3}{7}$.'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ con $b \neq 0$ y $n \in \mathbb{N}$ con $n \ge 2$, donde $a \ge 0$ y $b > 0$ si $n$ es par. La **Propiedad del Cociente de Radicales Homogéneos** establece:


  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \sqrt[n]{\frac{a}{b}}$$


  **Demostración analítica:**

  $$\frac{\sqrt[n]{a}}{\sqrt[n]{b}} = \frac{a^{1/n}}{b^{1/n}} = \left(\frac{a}{b}\right)^{1/n} = \sqrt[n]{\frac{a}{b}}$$


  **Extensión con coeficientes escalares:**

  $$\frac{p \sqrt[n]{a}}{q \sqrt[n]{b}} = \left(\frac{p}{q}\right) \sqrt[n]{\frac{a}{b}} \quad (q \neq 0, b \neq 0)$$'
definiciones_clave: '- **Cociente homogéneo**: División de raíces que poseen el mismo índice $n$.

  - **Fusión fraccionaria**: Agrupación del numerador y denominador bajo un solo radical.

  - **Distribución sobre cocientes**: Extracción de raíz independiente al numerador y denominador.'
propiedades_relaciones: '- **Inversa de fracciones**: $\sqrt[n]{\frac{1}{b}} = \frac{1}{\sqrt[n]{b}}$.

  - **División de raíz por sí misma**: $\frac{\sqrt[n]{a}}{\sqrt[n]{a}} = 1$ para todo $a > 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de división de raíces](/static/img/nodos/division-de-raices-de-igual-indice-ejemplos.svg)


    Calcule y simplifique $\frac{\sqrt{48}}{\sqrt{3}}$, $\frac{\sqrt[3]{54}}{\sqrt[3]{2}}$ y $\frac{6\sqrt{75}}{2\sqrt{3}}$.'
  pasos:
  - 'Paso 1: Evaluar $\frac{\sqrt{48}}{\sqrt{3}}$: Unir bajo una sola raíz cuadrada: $\sqrt{\frac{48}{3}} = \sqrt{16} = 4$.'
  - 'Paso 2: Evaluar $\frac{\sqrt[3]{54}}{\sqrt[3]{2}}$: Unir bajo raíz cúbica: $\sqrt[3]{\frac{54}{2}} = \sqrt[3]{27} = 3$.'
  - 'Paso 3: Evaluar $\frac{6\sqrt{75}}{2\sqrt{3}}$: Dividir coeficientes $(6/2 = 3)$ y raíces $(\sqrt{75/3} = \sqrt{25} = 5) \implies 3 \cdot 5 = 15$.'
  - 'Conclusión: Los resultados son $4$, $3$ y $15$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\frac{\sqrt{72}}{\sqrt{2}}$?
  choices:
  - text: $6$ (porque $\sqrt{72/2} = \sqrt{36} = 6$)
    is_correct: true
  - text: $\sqrt{70}$
    is_correct: false
  - text: $36$
    is_correct: false
  - text: $18$
    is_correct: false
  explanation: La alternativa correcta es '$6$ (porque $\sqrt{72/2} = \sqrt{36} = 6$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se calculó $\frac{6\sqrt{75}}{2\sqrt{3}}$?
  choices:
  - text: Dividiendo coeficientes $6:2 = 3$ y raíces $\sqrt{75:3} = \sqrt{25} = 5$, obteniendo $3 \cdot 5 = 15$
    is_correct: true
  - text: Restando los radicandos
    is_correct: false
  - text: Multiplicando $6 \times 2$
    is_correct: false
  - text: Cancelando las raíces directamente
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo coeficientes $6:2 = 3$ y raíces $\sqrt{75:3} = \sqrt{25} = 5$, obteniendo $3 \cdot 5 = 15$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que numerador y denominador tengan el mismo índice radical $n$.'
- 'Paso 2: Dividir los coeficientes escalares externos $p/q$.'
- 'Paso 3: Dividir los radicandos $a/b$ bajo el radical común $\sqrt[n]{a/b}$ y simplificar.'
errores_correccion: '- **Error 1: Restar radicandos en la división ($\sqrt{20} / \sqrt{5} = \sqrt{15}$).** **Cómo corregirlo:** Se dividen los números: $\sqrt{20/5} = \sqrt{4} = 2$.

  - **Error 2: Dividir los índices radicales entre sí.** **Cómo corregirlo:** El índice $n$ se conserva inalterado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\frac{\sqrt{18}}{\sqrt{2}}$?
  alternativas:
  - $3$
  - $9$
  - $\sqrt{16}$
  respuesta: $3$
  solucion_pasos:
  - $\sqrt{18/2} = \sqrt{9} = 3$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de $\frac{\sqrt[3]{32}}{\sqrt[3]{4}}$?
  alternativas:
  - $2$
  - $4$
  - $\sqrt[3]{8}$
  respuesta: $2$
  solucion_pasos:
  - $\sqrt[3]{32/4} = \sqrt[3]{8} = 2$.
- titulo: ¿Es (8√20) / (2√5) igual a 8?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(8/2) \cdot \sqrt{20/5} = 4 \cdot \sqrt{4} = 4 \cdot 2 = 8$.
  alternativas:
  - texto: Sí, 4 · 2 = 8
    es_correcta: true
    retroalimentacion: ¡Correcto! División de coeficientes y raíces.
  - texto: No, es igual a 4√4
    es_correcta: false
    retroalimentacion: Incorrecto, falta calcular $\sqrt{4} = 2$ para dar 8.
  - texto: No, es igual a 16
    es_correcta: false
    retroalimentacion: Incorrecto, $4 \cdot 2 = 8$.
- titulo: ¿Es √a / √b igual a √(a - b)?
  respuesta: 'No'
  solucion_pasos:
  - No, $\frac{\sqrt{a}}{\sqrt{b}} = \sqrt{\frac{a}{b}}$, los radicandos se dividen, nunca se restan.
  alternativas:
  - texto: No, es igual a √(a / b)
    es_correcta: true
    retroalimentacion: ¡Correcto! Ley de cociente de radicales.
  - texto: Sí, se restan los radicandos
    es_correcta: false
    retroalimentacion: Incorrecto, la división no genera restas subradicales.
  - texto: Sí, por propiedad de potencias
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes se restan en potencias de igual base, pero aquí las bases se dividen.
errores_frecuentes:
- Restar radicandos en vez de dividirlos.
- Dividir los índices de las raíces.
- Olvidar considerar que el denominador no puede ser cero.
- No simplificar la fracción resultante antes de extraer la raíz.
- Confundir $\sqrt{a}/b$ con $\sqrt{a/b}$.
afirmaciones_verdaderas:
- El cociente de raíces de igual índice es igual a la raíz de la división de sus radicandos.
- La raíz de una fracción es igual a la raíz del numerador dividida por la raíz del denominador.
- Los coeficientes escalares se dividen de manera independiente al operador radical.
al_terminar_debes_poder: '![Síntesis de división de raíces](/static/img/nodos/division-de-raices-de-igual-indice-resumen.svg)


  QUÉ: Dividir y simplificar raíces que comparten el mismo índice radical.


  CÓMO: Conservando el índice común $n$, dividiendo los coeficientes escalares $(p/q)$ y dividiendo los radicandos bajo un único radical $\sqrt[n]{a/b}$ para su simplificación exacta.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
