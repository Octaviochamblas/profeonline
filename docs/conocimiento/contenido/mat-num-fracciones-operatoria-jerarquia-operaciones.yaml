semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.JERARQUIA_OPERACIONES
resumen_inicial: "La jerarquía de operaciones determina el orden estricto de resolución de combinaciones de operaciones con fracciones: paréntesis, potencias, multiplicación/división y adición/sustracción."
explicacion_simple: |
  Cuando te encuentras con un ejercicio que combina varias operaciones con fracciones (como $\frac{1}{2} + \frac{3}{4} \times \frac{2}{5}$), no puedes resolver de izquierda a derecha sin pensar. Existe una regla de prioridad universal conocida como **PEMDAS**:
  1. Primero resuelves lo que está entre **Paréntesis**.
  2. Luego las **Potencias**.
  3. Después las **Multiplicaciones y Divisiones** (de izquierda a derecha).
  4. Y al final las **Sumas y Restas** (de izquierda a derecha).
  Por ejemplo, en $\frac{1}{2} + \frac{3}{4} \times \frac{2}{5}$, debes multiplicar primero ($\frac{3}{4} \times \frac{2}{5} = \frac{6}{20} = \frac{3}{10}$) y luego sumar $\frac{1}{2} + \frac{3}{10} = \frac{8}{10} = \frac{4}{5}$.
explicacion_formal: |
  Formalmente, la resolución de expresiones combinadas en el cuerpo numérico $(\mathbb{Q}, +, \cdot)$ se rige por el orden de precedencia estándar de los operadores algebraicos:

  $$\text{Nivel 1: Paréntesis y signos de agrupación } (\quad), [\quad], \{\quad\}$$
  $$\text{Nivel 2: Potencias y raíces } a^b, \sqrt[b]{a}$$
  $$\text{Nivel 3: Multiplicación y División } \cdot, \div \quad (\text{igual jerarquía, de izquierda a derecha})$$
  $$\text{Nivel 4: Adición y Sustracción } +, - \quad (\text{igual jerarquía, de izquierda a derecha})$$

  La presencia de paréntesis modifica la precedencia natural evaluando la subexpresión interna como una unidad numérica aislada.
definiciones_clave: |
  - **Jerarquía de operaciones (Precedencia)**: Regla formal que define el orden de evaluación de múltiples operadores en una sola expresión.
  - **Signos de agrupación**: Símbolos (paréntesis, corchetes, llaves, barras horizontales de fracción) que fuerzan la prioridad de resolución.
  - **Evaluación de izquierda a derecha**: Criterio de desempate para operadores pertenecientes al mismo nivel de jerarquía.
propiedades_relaciones: |
  - **Distributividad**: Permite eliminar paréntesis multiplicativos mediante $a \cdot (b \pm c) = a \cdot b \pm a \cdot c$.
  - **Barra de fracción como agrupador**: La línea principal de división en una fracción compleja actúa implícitamente como paréntesis envolventes para todo el numerador y todo el denominador: $\frac{A + B}{C + D} = (A + B) \div (C + D)$.
  - **Propiedad de clausura operacional**: Cada paso de la jerarquía reduce dos operandos racionales a uno solo manteniendo la pertenencia a $\mathbb{Q}$.
ejemplo_guiado:
  enunciado: "Evalúa la expresión combinada con fracciones: $\\frac{5}{6} - \\frac{1}{2} \\cdot \\left(\\frac{1}{3} + \\frac{1}{4}\\right)$."
  pasos:
    - "Nivel 1 (Paréntesis): resolver el paréntesis interior $\\frac{1}{3} + \\frac{1}{4}$."
    - "Homogenizar a $12$: $\\frac{4}{12} + \\frac{3}{12} = \\frac{7}{12}$."
    - "Sustituir en la expresión: $\\frac{5}{6} - \\frac{1}{2} \\cdot \\frac{7}{12}$."
    - "Nivel 3 (Multiplicación): calcular $\\frac{1}{2} \\cdot \\frac{7}{12} = \\frac{7}{24}$."
    - "Sustituir en la expresión: $\\frac{5}{6} - \\frac{7}{24}$."
    - 'Nivel 4 (Sustracción): homogenizar a $24 \implies \frac{20}{24} - \frac{7}{24} = \frac{13}{24}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "En la expresión $\\frac{3}{4} + \\frac{1}{2} \\cdot \\frac{4}{5}$, ¿cuál operación se debe realizar en primer lugar según la jerarquía de operaciones?"
    choices:
      - {text: "La multiplicación $\\frac{1}{2} \\cdot \\frac{4}{5}$, por tener mayor jerarquía que la suma.", is_correct: true}
      - {text: "La suma $\\frac{3}{4} + \\frac{1}{2}$, por estar escrita a la izquierda.", is_correct: false}
      - {text: "Se pueden realizar ambas operaciones simultáneamente de cualquier forma.", is_correct: false}
      - {text: "La suma de los denominadores.", is_correct: false}
    explanation: "La correcta es La multiplicación $\\frac{1}{2} \\cdot \\frac{4}{5}$, por tener mayor jerarquía que la suma.: las multiplicaciones poseen precedencia sobre las adiciones salvo paréntesis en contrario."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el valor final de la expresión $\\left(\\frac{3}{5} + \\frac{2}{5}\\right) \\cdot \\frac{7}{9}$?"
    choices:
      - {text: "\\frac{7}{9}", is_correct: true}
      - {text: "\\frac{35}{45}", is_correct: false}
      - {text: "\\frac{1}{9}", is_correct: false}
      - {text: "\\frac{14}{45}", is_correct: false}
    explanation: "La correcta es \\frac{7}{9}: resolvemos primero el paréntesis $\\frac{3}{5} + \\frac{2}{5} = \\frac{5}{5} = 1$, y luego $1 \\cdot \\frac{7}{9} = \\frac{7}{9}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar y resolver las expresiones contenidas dentro de paréntesis o signos de agrupación."
  - "Paso 2: Calcular potencias o raíces fraccionarias si existen."
  - "Paso 3: Resolver multiplicaciones y divisiones en orden estricto de izquierda a derecha."
  - "Paso 4: Resolver sumas y restas en orden estricto de izquierda a derecha."
  - "Paso 5: Simplificar el resultado final."
errores_correccion: |
  Un error clásico es resolver de izquierda a derecha ignorando los operadores (por ejemplo, en $\frac{1}{2} + \frac{1}{2} \cdot \frac{1}{2}$, sumar primero para obtener $1 \cdot \frac{1}{2} = \frac{1}{2}$). ¡El resultado correcto es multiplicar primero $\frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$ y luego sumar $\frac{1}{2} + \frac{1}{4} = \frac{3}{4}$!
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $\\frac{1}{2} + \\frac{1}{4} \\div \\frac{1}{2}$."
    alternativas:
      - "1"
      - "\\frac{3}{8}"
      - "\\frac{3}{4}"
    respuesta: "1"
    solucion_pasos:
      - "División primero: $\\frac{1}{4} \\div \\frac{1}{2} = \\frac{1}{4} \\cdot 2 = \\frac{2}{4} = \\frac{1}{2}$."
      - "Suma después: $\\frac{1}{2} + \\frac{1}{2} = 1$."
  - titulo: "Ejemplo 2"
    enunciado: "Calcula $\\frac{2}{3} \\cdot \\left(\\frac{3}{4} - \\frac{1}{4}\\right)$."
    alternativas:
      - "\\frac{1}{3}"
      - "\\frac{1}{2}"
      - "\\frac{2}{4}"
    respuesta: "\\frac{1}{3}"
    solucion_pasos:
      - "Paréntesis primero: $\\frac{3}{4} - \\frac{1}{4} = \\frac{2}{4} = \\frac{1}{2}$."
      - "Multiplicación: $\\frac{2}{3} \\cdot \\frac{1}{2} = \\frac{2}{6} = \\frac{1}{3}$."
  - titulo: "¿La barra horizontal de una fracción grande actúa como signo de agrupación para el numerador y denominador?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, en $\\frac{A}{B}$ se resuelve de forma independiente todo el bloque del numerador $A$ y todo el bloque del denominador $B$ antes de efectuar la división final."
  - titulo: "¿Tienen la multiplicación y la división el mismo nivel de jerarquía?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, cuando aparecen juntas sin paréntesis se resuelven estrictamente de izquierda a derecha."
errores_frecuentes:
  - "Sumar o restar antes de multiplicar o dividir."
  - "Ignorar el orden de izquierda a derecha en operaciones de igual jerarquía (como en divisiones consecutivas)."
  - "Eliminar paréntesis sin haber resuelto completamente las operaciones internas."
  - "Olvidar que la línea principal de una fracción compleja encierra paréntesis implícitos."
  - "Cometer errores aritméticos al cambiar entre denominadores."
afirmaciones_verdaderas:
  - "En la jerarquía de operaciones, las multiplicaciones y divisiones se ejecutan antes que las sumas y restas, salvo presencia de paréntesis."
  - "Los signos de agrupación (paréntesis, corchetes y barras de fracción) tienen la máxima prioridad de resolución."
al_terminar_debes_ponder: |
  Debes ser capaz de evaluar cualquier expresión combinada con fracciones aplicando rigurosamente el orden de precedencia y el uso de paréntesis.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
