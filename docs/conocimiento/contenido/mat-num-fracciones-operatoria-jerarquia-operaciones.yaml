semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.JERARQUIA_OPERACIONES
resumen_inicial: 'La jerarquía de operaciones con fracciones resuelve en orden: paréntesis internos, potencias, multiplicaciones/divisiones de izquierda a derecha y adiciones/sustracciones.'
explicacion_simple: 'Cuando tenemos un ejercicio combinado con varias fracciones y operaciones distintas, debemos respetar un orden estricto: primero resolvemos los paréntesis más internos, luego las potencias, después las multiplicaciones y divisiones en el orden en que aparecen de izquierda a derecha, y finalmente las sumas y restas.


  ![Jerarquía de operaciones con fracciones](/static/img/nodos/jerarquia-de-operaciones-con-fracciones-intro.svg)'
explicacion_formal: 'Dada una expresión combinada en $\mathbb{Q}$, la **Precedencia Operacional Estándar (PEMDAS/BODMAS)** establece el orden de evaluación:


  $$1. \text{ Paréntesis (de dentro hacia afuera)} \longrightarrow 2. \text{ Potencias} \longrightarrow 3. \text{ Multiplicación / División (izq. a der.)} \longrightarrow 4. \text{ Adición / Sustracción}$$


  **Desglose de la regla:**

  - Igual nivel de prioridad: Multiplicaciones y divisiones tienen igual jerarquía y se resuelven en estricto orden de aparición de izquierda a derecha.

  - Barras de fracción como agrupadotes: Una línea horizontal actuará como un paréntesis implícito evaluando numerador y denominador por separado.


  > **Complemento didáctico:** La barra principal de una fracción compleja actúa agrupando todo el numerador y todo el denominador antes de efectuar la división final.'
definiciones_clave: '- **Jerarquía de operaciones combinadas**: Regla de prioridad PEMDAS/BODMAS aplicada a expresiones numéricas racionales.'
propiedades_relaciones: '- **Invarianza estructural de prioridad**: Mantiene las mismas reglas de precedencia operacional que en $\mathbb{Z}$ y $\mathbb{N}$.'
ejemplo_guiado:
  enunciado: 'Resuelva la expresión combinada $\frac{1}{2} + \frac{3}{4} \cdot \frac{2}{3}$.


    ![Ejemplo Jerarquía de operaciones con fracciones](/static/img/nodos/jerarquia-de-operaciones-con-fracciones-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar las operaciones presentes: adición y multiplicación.'
  - 'Paso 2: Aplicar la jerarquía: la multiplicación se resuelve ANTES que la suma.'
  - 'Paso 3: Resolver la multiplicación: $\frac{3}{4} \cdot \frac{2}{3} = \frac{1}{2} \cdot \frac{1}{1} = \frac{1}{2}$.'
  - 'Paso 4: Realizar la adición final: $\frac{1}{2} + \frac{1}{2} = \frac{2}{2} = 1$.'
  - 'Conclusión: $\frac{1}{2} + \frac{3}{4} \cdot \frac{2}{3} = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la expresión 1/2 + 3/4 · 2/3, ¿qué operación debe resolverse en primer lugar según la jerarquía?
  choices:
  - text: La multiplicación (3/4 · 2/3)
    is_correct: true
  - text: La suma (1/2 + 3/4)
    is_correct: false
  - text: La simplificación del 2 con el 2
    is_correct: false
  - text: Cualquiera en cualquier orden
    is_correct: false
  explanation: La alternativa correcta es 'La multiplicación (3/4 · 2/3)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado de la expresión combinada?
  choices:
  - text: '1'
    is_correct: true
  - text: 5/6
    is_correct: false
  - text: 3/4
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver las expresiones contenidas dentro de paréntesis.'
- 'Paso 2: Resolver las potencias existentes.'
- 'Paso 3: Resolver las multiplicaciones y divisiones de izquierda a derecha.'
- 'Paso 4: Resolver las adiciones y sustracciones de izquierda a derecha.'
errores_correccion: '- **Error 1: Sumar primero antes de multiplicar (hacer $\frac{1}{2} + \frac{3}{4}$ primero en $\frac{1}{2} + \frac{3}{4} \cdot \frac{2}{3}$).** **Cómo corregirlo:** La multiplicación tiene mayor prioridad que la suma.


  - **Error 2: Resolver una división antes que una multiplicación cuando esta última aparece a la izquierda.** **Cómo corregirlo:** Multiplicaciones y divisiones comparten prioridad y se resuelven estrictamente de izquierda a derecha.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(1/3 + 2/3) \cdot 5/8$.
  alternativas:
  - 5/8
  - 15/8
  - 1/8
  respuesta: 5/8
  solucion_pasos:
  - 'Paréntesis: $(1/3 + 2/3) = 3/3 = 1$. Producto: $1 \cdot 5/8 = 5/8$.'
- titulo: Ejemplo 2
  enunciado: 'Calcule 3/4 : 1/2 · 2/3.'
  alternativas:
  - '1'
  - 1/4
  - 9/16
  respuesta: '1'
  solucion_pasos:
  - 'De izq a der: $3/4 : 1/2 = 3/4 \cdot 2/1 = 6/4 = 3/2$. Luego $3/2 \cdot 2/3 = 1$.'
- titulo: ¿Tienen los paréntesis la máxima prioridad en la jerarquía de operaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo contenido entre paréntesis debe evaluarse en primer lugar.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
- titulo: ¿Se resuelve la suma antes que la multiplicación si no hay paréntesis?
  respuesta: 'No'
  solucion_pasos:
  - No, la multiplicación tiene mayor prioridad que la suma.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
errores_frecuentes:
- Las adiciones y sustracciones se deben calcular antes que las multiplicaciones en ejercicios combinados.
- Resolver una expresión de izquierda a derecha sin importar los símbolos de paréntesis es válido.
- Los paréntesis no modifican el orden ni la prioridad de las operaciones con fracciones.
- La división tiene siempre una prioridad superior a la multiplicación independientemente de su posición.
- La barra principal de una fracción compleja no actúa agrupando términos.
afirmaciones_verdaderas:
- La jerarquía de operaciones exige resolver paréntesis, potencias, productos/divisiones (de izq. a der.) y sumas/restas.
- Multiplicaciones y divisiones tienen la misma prioridad y se evalúan en el orden de izquierda a derecha.
al_terminar_debes_poder: '**QUÉ:** Evaluar expresiones fraccionarias combinadas respetando la prioridad de operaciones.


  **CÓMO:** Siguiendo estrictamente el orden PEMDAS: 1. Paréntesis de adentro hacia afuera, 2. Potencias, 3. Multiplicaciones y Divisiones de izquierda a derecha, 4. Adiciones y Sustracciones.


  ![Resumen Jerarquía de operaciones con fracciones](/static/img/nodos/jerarquia-de-operaciones-con-fracciones-resumen.svg)'
