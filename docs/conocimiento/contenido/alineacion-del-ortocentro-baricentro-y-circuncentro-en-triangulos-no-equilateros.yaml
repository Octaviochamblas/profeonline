semantic_id: MAT.GEO.RECTA_EULER.ALINEACION_PUNTOS_NOTABLES
resumen_inicial: La alineación de los puntos notables ortocentro ($H$), baricentro
  ($G$) y circuncentro ($O$) se verifica en todo triángulo no equilátero. En el triángulo
  rectángulo la recta coincide con la mediana a la hipotenusa, en el isósceles coincide
  con el eje de simetría (incluyendo al incentro), y en el equilátero los puntos coinciden
  en uno solo.
explicacion_simple: '![Alineación de Puntos Notables](/static/img/nodos/alineacion-del-ortocentro-baricentro-y-circuncentro-en-triangulos-no-equilateros-intro.svg)


  La recta de Euler se comporta de formas muy interesantes según el tipo de triángulo:


  - **En el triángulo rectángulo**: El ortocentro $H$ está en la esquina de $90^\circ$
  y el circuncentro $O$ está en la mitad de la hipotenusa; la recta de Euler es la
  **mediana a la hipotenusa**.

  - **En el triángulo isósceles**: La recta de Euler es el **eje de simetría** del
  triángulo, y en este caso único el **incentro $I$ también se une a la fila**.

  - **En el triángulo equilátero**: Como los tres puntos están en el mismo lugar ($H=G=O$),
  no hay una recta, sino un **único punto central**.

  '
explicacion_formal: '### Teorema de la Recta de Euler según el tipo de triángulo

  La colinealidad de $\{H, G, O\}$ se verifica en todo triángulo no equilátero, adoptando
  configuraciones notables según la simetría de la figura:


  $$\begin{cases} \text{Triángulo Rectángulo:} & H = C, \; O = M_{\text{hip}} \implies
  \mathcal{L}_E \equiv \text{Mediana } m_c \\ \text{Triángulo Isósceles:} & H, I,
  G, O \in \mathcal{L}_E \equiv \text{Eje de Simetría} \\ \text{Triángulo Equilátero:}
  & H = G = O = I \implies \mathcal{L}_E \text{ degenera en un punto} \end{cases}$$


  ### Desglose simbólico y geométrico

  - En rectángulos: La recta de Euler coincide con la transversal de gravedad a la
  hipotenusa.

  - En isósceles: El incentro $I$ también pertenece a la recta de Euler (coincide
  con el eje de simetría).

  - En equiláteros: Los puntos colapsan en un único centroide, por lo que no existe
  una recta de Euler unívoca.


  ### Síntesis didáctica

  La recta de Euler unifica la teoría de centros notables en todos los triángulos,
  manifestando la armonía geométrica tanto en figuras simétricas como asimétricas.'
definiciones_clave: '- **Colinealidad universal**: Propiedad de concurrencia lineal
  de $H, G, O$ en cualquier triángulo no equilátero.

  - **Eje de simetría en isósceles**: Recta notable que contiene a los cuatro puntos
  notables ($H, I, G, O$).

  - **Degeneración en equilátero**: Condición en la cual la recta colapsa en un punto
  debido a la coincidencia $H = G = O$.

  '
propiedades_relaciones: '- **Triángulo rectángulo**: $\mathcal{L}_E = \overleftrightarrow{CM_{AB}}$
  (recta de la mediana $m_c$).

  - **Triángulo isósceles**: $H, I, G, O \in \mathcal{L}_E$ (coincide con el eje de
  simetría de la base).

  - **Triángulo obtusángulo**: La recta de Euler conecta el ortocentro exterior con
  el circuncentro exterior pasando por el baricentro interior.

  - **Triángulo equilátero**: $H = G = O \implies \mathcal{L}_E$ indeterminada (es
  un punto).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Alineación](/static/img/nodos/alineacion-del-ortocentro-baricentro-y-circuncentro-en-triangulos-no-equilateros-ejemplos.svg)


    En un triángulo rectángulo, los catetos miden $a = 6\text{ cm}$ y $b = 8\text{
    cm}$. Determina las posiciones del ortocentro $H$ y del circuncentro $O$, y calcula
    la longitud del segmento $HO$ sobre la recta de Euler.

    '
  pasos:
  - 'Paso 1: Identificar la posición de $H$: en el triángulo rectángulo, el ortocentro
    $H$ es el vértice del ángulo recto.'
  - 'Paso 2: Calcular la hipotenusa por Pitágoras: $c = \sqrt{6^2 + 8^2} = \sqrt{36
    + 64} = 10\text{ cm}$.'
  - 'Paso 3: Identificar la posición de $O$: el circuncentro $O$ es el punto medio
    de la hipotenusa.'
  - 'Paso 4: Calcular la distancia $HO$: es la longitud de la mediana a la hipotenusa
    $m_c = \frac{c}{2} = \frac{10}{2} = 5\text{ cm}$.'
  - 'Paso 5: Concluir que el segmento $HO$ sobre la recta de Euler mide $5\text{ cm}$
    (con $HG = \frac{10}{3}\text{ cm}$ y $GO = \frac{5}{3}\text{ cm}$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué tipo de triángulo el incentro I también pertenece a la recta de
    Euler?
  choices:
  - text: En el triángulo isósceles
    is_correct: true
  - text: En el triángulo escaleno acutángulo
    is_correct: false
  - text: En el triángulo escaleno rectángulo
    is_correct: false
  - text: En ningún triángulo
    is_correct: false
  explanation: El incentro pertenece a la recta de Euler en el triángulo isósceles,
    donde coincide con el eje de simetría.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo con hipotenusa de 12 cm, ¿cuánto mide la distancia
    HO entre el ortocentro y el circuncentro?
  choices:
  - text: $6\text{ cm}$
    is_correct: true
  - text: $12\text{ cm}$
    is_correct: false
  - text: $4\text{ cm}$
    is_correct: false
  - text: $3\text{ cm}$
    is_correct: false
  explanation: Mide $6\text{ cm}$, ya que la distancia HO es la mediana a la hipotenusa
    ($12 / 2 = 6\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Clasificar el triángulo según sus lados y ángulos (escaleno, isósceles,
  rectángulo u obtusángulo).'
- 'Paso 2: Si es rectángulo, hacer coincidir $H$ con el vértice recto y $O$ con el
  punto medio de la hipotenusa.'
- 'Paso 3: Si es isósceles, hacer coincidir la recta de Euler con el eje de simetría
  de la base (incluyendo a $I$).'
- 'Paso 4: Si es equilátero, señalar que los puntos coinciden en un solo centro y
  no hay recta única.'
errores_correccion: No confundas el comportamiento de la recta de Euler en el isósceles
  (contiene a I) con el caso escaleno (I queda afuera).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué ocurre con la recta de Euler en un triángulo equilátero?
  alternativas:
  - No está unívocamente definida porque los puntos H, G y O coinciden en un solo
    punto
  - Es perpendicular a la base
  - Pasa por los tres vértices
  respuesta: No está unívocamente definida porque los puntos H, G y O coinciden en
    un solo punto
  solucion_pasos:
  - Al ser $H = G = O$, existe un único punto y por un solo punto pasan infinitas
    rectas.
- titulo: Ejemplo 2
  enunciado: En un triángulo rectángulo, ¿con qué elemento secundario coincide la
    recta de Euler?
  alternativas:
  - Con la transversal de gravedad (mediana) relativa a la hipotenusa
  - Con la hipotenusa
  - Con el cateto menor
  respuesta: Con la transversal de gravedad (mediana) relativa a la hipotenusa
  solucion_pasos:
  - Une el vértice recto ($H$) con el punto medio de la hipotenusa ($O$), que es la
    definición de la mediana $m_c$.
- titulo: ¿En todo triángulo no equilátero el ortocentro, baricentro y circuncentro
    están alineados?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el teorema de la recta de Euler aplicable a todo triángulo no equilátero.
- titulo: ¿En un triángulo escaleno el incentro pertenece a la recta de Euler?
  respuesta: 'No'
  solucion_pasos:
  - No, en triángulos escalenos el incentro queda estrictamente fuera de la recta
    de Euler.
errores_frecuentes:
- Creer que en el triángulo equilátero hay una recta de Euler bien definida.
- Olvidar que en el triángulo rectángulo la recta de Euler es la mediana a la hipotenusa.
- Pensar que en triángulos obtusángulos la recta de Euler se curva (sigue siendo una
  línea recta perfecta).
- Asumir que el incentro siempre está en la recta de Euler (solo en el isósceles).
- Confundir las posiciones de $H$ y $O$ en el triángulo rectángulo.
afirmaciones_verdaderas:
- En todo triángulo no equilátero el ortocentro, baricentro y circuncentro son colineales.
- En el triángulo rectángulo la recta de Euler coincide con la mediana relativa a
  la hipotenusa.
al_terminar_debes_poder: '**QUÉ:** Analizar y describir el comportamiento de la recta
  de Euler en diferentes tipos de triángulos (escalenos, rectángulos, isósceles y
  equiláteros).


  **CÓMO:** Identificando las posiciones particulares de $H, G, O$ en cada caso (mediana
  en rectángulos, eje en isósceles, degeneración puntual en equiláteros).


  ![Resumen de Alineación](/static/img/nodos/alineacion-del-ortocentro-baricentro-y-circuncentro-en-triangulos-no-equilateros-resumen.svg)

  '
