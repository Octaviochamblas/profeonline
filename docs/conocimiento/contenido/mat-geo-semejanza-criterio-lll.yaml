semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CRITERIO_LLL
resumen_inicial: 'Criterio de semejanza LLL: tres pares de lados correspondientes
  proporcionales: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: Un segundo criterio abreviado de semejanza, análogo al de congruencia
  pero con proporcionalidad en vez de igualdad, permite comparar triángulos usando
  exclusivamente sus tres lados.
explicacion_formal: '![Criterio de semejanza LLL](/static/img/geometria/congruencia-semejanza/semejanza-criterio-lll.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C'' se cumple $\frac{AB}{A''''B''''$}$=\frac{BC}{B''C''}=\frac{CA}{C''A''}$,
  entonces $\triangle ABC\sim\triangle A''B''C''$.


  ### Desarrollo didáctico


  A diferencia del criterio LLL de congruencia (que exige lados exactamente iguales),
  este criterio exige que las tres razones entre lados correspondientes coincidan;
  no importa el tamaño relativo, solo que la proporción se mantenga constante en los
  tres pares.'
definiciones_clave: '- **Criterio de semejanza LLL: tres pares de lados correspondientes
  proporcionales**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
