semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_DOS_PUNTOS
resumen_inicial: El cálculo de la pendiente a partir de dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ se realiza mediante la fórmula $m = \frac{y_2 - y_1}{x_2 - x_1}$.
explicacion_simple: '![El cálculo de la pendiente a partir de dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ se realiza mediante la fórmula $m = \frac{y_2 - y_1}{x_2 - x_1}$](/static/img/nodos/calculo-de-la-pendiente-dados-dos-puntos-intro.svg)



  Para calcular la pendiente de una recta cuando conoces dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$:

  1. Restas las **alturas** (segundas coordenadas) en el numerador: $y_2 - y_1$.

  2. Restas los **avances** (primeras coordenadas) en el denominador: $x_2 - x_1$.

  3. Divides ambos resultados: $m = \frac{y_2 - y_1}{x_2 - x_1}$.


  **Regla de oro:** ¡Debes restar en el mismo orden arriba y abajo! (Si empiezas con $P_2$ arriba, debes empezar con $P_2$ abajo).'
explicacion_formal: 'Dados dos puntos distintos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ en el plano cartesiano con $x_1 \neq x_2$, la pendiente de la recta única que los contiene es:

  $$m = \frac{y_2 - y_1}{x_2 - x_1} = \frac{y_1 - y_2}{x_1 - x_2}$$


  **Propiedades analíticas:**

  - **Invarianza de sentido**: Restar $P_2 - P_1$ o $P_1 - P_2$ entrega exactamente el mismo valor de $m$.

  - **Colinealidad de tres puntos**: Tres puntos $A, B, C$ están alineados si y solo si $m_{AB} = m_{BC}$.'
definiciones_clave: '- **Fórmula de pendiente**: Expresión algebraica analítica para cuantificar la inclinación entre pares de coordenadas.

  - **Condición no vertical**: Requisito de que $x_1 \neq x_2$ para asegurar un denominador no nulo.'
propiedades_relaciones: '- **Cuidado de signos**: Si una coordenada es negativa, la resta introduce doble signo: $x_2 - (-x_1) = x_2 + x_1$.

  - **Fracción irreductible**: La pendiente debe expresarse en su forma simplificada o número entero.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo de la pendiente a partir de dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ se realiza mediante la fórmula $m = \frac{y_2 - y_1}{x_2 - x_1}$](/static/img/nodos/calculo-de-la-pendiente-dados-dos-puntos-ejemplos.svg)



    Calcula la pendiente de la recta que pasa por los puntos $P_1(-3, 7)$ y $P_2(2, -8)$.'
  pasos:
  - 'Paso 1: Identificar coordenadas: $x_1 = -3, y_1 = 7$ y $x_2 = 2, y_2 = -8$.'
  - 'Paso 2: Calcular la resta en el numerador: $y_2 - y_1 = -8 - 7 = -15$.'
  - 'Paso 3: Calcular la resta en el denominador: $x_2 - x_1 = 2 - (-3) = 2 + 3 = 5$.'
  - 'Paso 4: Dividir numerador entre denominador: $m = \frac{-15}{5} = -3$.'
  - 'Paso 5: Concluir que la pendiente de la recta es $m = -3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la pendiente de la recta que pasa por $(1, 3)$ y $(5, 11)$?
  choices:
  - text: '2'
    is_correct: true
  - text: 1/2
    is_correct: false
  - text: '8'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '2'. $m = \frac{11 - 3}{5 - 1} = \frac{8}{4} = 2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una recta pasa por $(-2, 4)$ y $(3, 4)$, ¿cuál es su pendiente?
  choices:
  - text: '0'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: Indefinida
    is_correct: false
  explanation: La alternativa correcta es '0'. $m = \frac{4 - 4}{3 - (-2)} = \frac{0}{5} = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar claramente las coordenadas $(x_1, y_1)$ y $(x_2, y_2)$.'
- 'Paso 2: Escribir la fórmula $m = \frac{y_2 - y_1}{x_2 - x_1}$ protegiendo números negativos con paréntesis.'
- 'Paso 3: Resolver las sustracciones aplicando la regla de signos.'
- 'Paso 4: Simplificar la fracción resultante a su expresión mínima.'
errores_correccion: '- **Error común:** Mezclar el orden de resta (calcular $\frac{y_2 - y_1}{x_1 - x_2}$).

  - **Cómo corregirlo:** Mantén siempre el orden fijo: si el primer término arriba es del punto 2, el primer término abajo debe ser obligatoriamente del punto 2.'
ejemplos:
- titulo: 'Ejemplo 1: Puntos positivos estándar'
  enunciado: Calcula la pendiente entre $A(2, 5)$ y $B(6, 17)$.
  alternativas:
  - '3'
  - 1/3
  - '4'
  - '12'
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $m = \frac{17 - 5}{6 - 2} = \frac{12}{4} = 3$.'
- titulo: 'Ejemplo 2: Coordenadas con signo negativo'
  enunciado: Halla la pendiente que une $P(-4, -1)$ y $Q(2, -4)$.
  alternativas:
  - -1/2
  - 1/2
  - '-2'
  - '2'
  respuesta: -1/2
  solucion_pasos:
  - 'Paso 1: Numerador: $-4 - (-1) = -4 + 1 = -3$.'
  - 'Paso 2: Denominador: $2 - (-4) = 2 + 4 = 6$.'
  - 'Paso 3: $m = \frac{-3}{6} = -\frac{1}{2}$.'
- titulo: 'Ejemplo 3: Puntos con misma abscisa'
  enunciado: ¿Qué pendiente tiene la recta que pasa por $(5, 2)$ y $(5, 8)$?
  alternativas:
  - Indefinida (recta vertical)
  - '0'
  - '6'
  - '1'
  respuesta: Indefinida (recta vertical)
  solucion_pasos:
  - 'Paso 1: El denominador es $5 - 5 = 0$.'
  - 'Paso 2: La división por cero es indefinida; es una recta vertical.'
- titulo: 'Ejemplo 4: Paso por el origen'
  enunciado: Calcula la pendiente de la recta que une $(0, 0)$ con $(-3, 9)$.
  alternativas:
  - '-3'
  - '3'
  - -1/3
  - '9'
  respuesta: '-3'
  solucion_pasos:
  - 'Paso 1: $m = \frac{9 - 0}{-3 - 0} = \frac{9}{-3} = -3$.'
errores_frecuentes:
- Invertir el orden de los puntos entre numerador y denominador.
- Equivocarse en la regla de signos al restar números negativos.
- Colocar las coordenadas x en el numerador y las y en el denominador.
afirmaciones_verdaderas:
- La fórmula de la pendiente m = (y2 - y1) / (x2 - x1) requiere mantener el mismo orden de puntos en numerador y denominador.
- Si dos puntos tienen la misma ordenada (y1 = y2), la pendiente es exactamente cero.
al_terminar_debes_poder: '**QUÉ:** Calcular algebraicamente la pendiente de una recta a partir de dos puntos cualesquiera.


  **CÓMO:** Aplicando la fórmula m = (y2 - y1) / (x2 - x1) con riguroso manejo de signos y reducción fraccionaria.


