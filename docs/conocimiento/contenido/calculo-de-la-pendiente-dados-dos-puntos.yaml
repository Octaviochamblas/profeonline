semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_DOS_PUNTOS
resumen_inicial: Dados dos puntos cualesquiera de una recta $(x_1, y_1)$ y $(x_2,
  y_2)$, la pendiente se calcula mediante $m = \frac{y_2 - y_1}{x_2 - x_1}$.
explicacion_simple: 'Para calcular la pendiente teniendo dos puntos (por ejemplo $A(2,
  5)$ y $B(6, 13)$):

  1. Identificamos las coordenadas: $x_1 = 2, y_1 = 5, x_2 = 6, y_2 = 13$.

  2. Restamos las $y$ arriba: $13 - 5 = 8$.

  3. Restamos las $x$ abajo respetando el mismo orden: $6 - 2 = 4$.

  4. Dividimos el resultado: $m = \frac{8}{4} = 2$.'
explicacion_formal: 'Para todo par de puntos $P_1(x_1, y_1), P_2(x_2, y_2) \in \mathbb{R}^2$
  con $x_1 \neq x_2$:


  $$m = \frac{y_2 - y_1}{x_2 - x_1} = \frac{y_1 - y_2}{x_1 - x_2}$$


  **Desglose de la fórmula:**

  - Invariancia por simetría de orden: El resultado es exactamente idéntico si se
  restan las coordenadas de $P_1$ menos $P_2$ o de $P_2$ menos $P_1$, siempre que
  se mantenga el orden en ambos miembros.'
definiciones_clave: '- **Fórmula de la pendiente dados dos puntos**: $m = \frac{y_2
  - y_1}{x_2 - x_1}$.'
propiedades_relaciones: '- **Invariancia del orden de resta**: $\frac{y_2 - y_1}{x_2
  - x_1} = \frac{y_1 - y_2}{x_1 - x_2}$.'
ejemplo_guiado:
  enunciado: Calcula la pendiente de la recta que pasa por los puntos $A(-2, 7)$ y
    $B(3, -3)$.
  pasos:
  - 'Paso 1: Identificar las coordenadas: $x_1 = -2, y_1 = 7, x_2 = 3, y_2 = -3$.Paso
    2: Calcular el numerador (diferencia de ordenadas): $y_2 - y_1 = -3 - 7 = -10$.Paso
    3: Calcular el denominador (diferencia de abscisas): $x_2 - x_1 = 3 - (-2) = 3
    + 2 = 5$.Paso 4: Aplicar la división: $m = \frac{-10}{5} = -2$.Paso 5: Concluir
    que la pendiente de la recta es $m = -2$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la fórmula de la pendiente a los puntos $(-2, 7)$ y $(3, -3)$,
    ¿cuál es el valor de $m$?
  choices:
  - text: $m = -2$
    is_correct: true
  - text: $m = 2$
    is_correct: false
  - text: $m = -\frac{1}{2}$
    is_correct: false
  - text: $m = 4$
    is_correct: false
  explanation: La alternativa correcta es '$m = -2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al calcular la diferencia de abscisas $x_2 - x_1$ para $x_1 = -2$ y $x_2
    = 3$, ¿por qué el resultado es $5$?
  choices:
  - text: 'Porque al restar un número negativo se aplica menos por menos dando más:
      $3 - (-2) = 3 + 2 = 5$.'
    is_correct: true
  - text: Porque $3 - 2 = 1$.
    is_correct: false
  - text: Porque la distancia se multiplica.
    is_correct: false
  - text: Porque el resultado siempre es positivo.
    is_correct: false
  explanation: 'La alternativa correcta es ''Porque al restar un número negativo se
    aplica menos por menos dando más: $3 - (-2) = 3 + 2 = 5$.''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Rotular los puntos como $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$.'
- 'Paso 2: Escribir la resta $y_2 - y_1$ en el numerador.'
- 'Paso 3: Escribir la resta $x_2 - x_1$ en el denominador utilizando paréntesis para
  los números negativos.'
- 'Paso 4: Calcular ambas restas y simplificar la fracción.'
errores_correccion: '- **Error común:** Mezclar el orden de los puntos (hacer $y_2
  - y_1$ arriba y $x_1 - x_2$ abajo).

  - **Cómo corregirlo:** Si empiezas restando el punto 2 arriba ($y_2 - y_1$), estás
  OBLIGADO a empezar restando el punto 2 abajo ($x_2 - x_1$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
