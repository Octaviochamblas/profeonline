semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_DOS_PUNTOS
resumen_inicial: 'Cálculo de la pendiente dados dos puntos: conceptos, representación
  y propiedades en Función constante y función lineal.'
explicacion_simple: Con solo dos puntos de una recta puedes calcular exactamente su
  pendiente, sin necesidad de ver el gráfico completo.
explicacion_formal: '### Definición formal


  Dados dos puntos distintos $(x_1,y_1)$ y $(x_2,y_2)$ pertenecientes a una recta,
  con $x_1 \neq x_2$, la pendiente de la recta que los contiene es $m = \dfrac{y_2-y_1}{x_2-x_1}$.
  Este valor es independiente del orden en que se etiqueten los puntos, siempre que
  se mantenga la consistencia entre numerador y denominador.


  ### Desarrollo didáctico


  Es fundamental restar las coordenadas en el mismo orden en numerador y denominador:
  si empiezas restando $y_2-y_1$, debes seguir con $x_2-x_1$, no $x_1-x_2$.


  Para los puntos $(2,3)$ y $(5,12)$: $m = \frac{12-3}{5-2} = \frac{9}{3} = 3$. Si
  invirtieras el orden consistentemente, $m = \frac{3-12}{2-5} = \frac{-9}{-3} = 3$,
  el mismo resultado.'
definiciones_clave: '- **Cálculo de la pendiente dados dos puntos**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a cálculo de la pendiente dados dos puntos.'
