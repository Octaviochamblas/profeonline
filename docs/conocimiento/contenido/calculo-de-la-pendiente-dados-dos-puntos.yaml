semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_DOS_PUNTOS
resumen_inicial: El cálculo de la pendiente a partir de dos puntos determina la razón de cambio entre la variación vertical y la variación horizontal de una recta.
explicacion_simple: |
  La **pendiente** $m$ mide cuánto sube o baja una recta por cada paso a la derecha.

  Dados dos puntos $(x_1, y_1)$ y $(x_2, y_2)$:
  1. Restas las alturas (las $y$): $y_2 - y_1$.
  2. Restas las posiciones horizontales (las $x$): $x_2 - x_1$.
  3. Divides ambos resultados: $m = \frac{y_2 - y_1}{x_2 - x_1}$.
explicacion_formal: |
  Sean $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ dos puntos distintos en el plano cartesiano con $x_1 \neq x_2$. La **pendiente** $m$ de la recta que pasa por $P_1$ y $P_2$ es:

  $$m = \frac{\Delta y}{\Delta x} = \frac{y_2 - y_1}{x_2 - x_1}$$

  **Desglose de la fórmula:**
  - $\Delta y = y_2 - y_1$: Variación vertical u ordenada.
  - $\Delta x = x_2 - x_1$: Variación horizontal u abscisa.
definiciones_clave: |
  - **Fórmula de la pendiente**: Razón entre el incremento vertical y el incremento horizontal entre dos puntos cualesquiera de una recta.
propiedades_relaciones: |
  - **Independencia del orden**: $\frac{y_2 - y_1}{x_2 - x_1} = \frac{y_1 - y_2}{x_1 - x_2}$. El orden de los puntos no altera el valor de $m$ siempre que se mantenga el mismo orden en numerador y denominador.
ejemplo_guiado:
  enunciado: "Calcula la pendiente de la recta que pasa por los puntos $P_1(2, 5)$ y $P_2(6, 13)$."
  pasos:
    - 'Paso 1: Identificar las coordenadas: $x_1 = 2, y_1 = 5$ y $x_2 = 6, y_2 = 13$.'
    - 'Paso 2: Calcular la variación vertical: $\Delta y = 13 - 5 = 8$.'
    - 'Paso 3: Calcular la variación horizontal: $\Delta x = 6 - 2 = 4$.'
    - 'Paso 4: Dividir las variaciones: $m = \frac{8}{4} = 2$.'
    - 'Paso 5: Concluir que la pendiente de la recta es $m = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la pendiente de la recta que pasa por los puntos $P_1(2, 5)$ y $P_2(6, 13)$?"
    choices:
      - {text: "$m = 2$", is_correct: true}
      - {text: "$m = 1/2$", is_correct: false}
      - {text: "$m = 8$", is_correct: false}
      - {text: "$m = -2$", is_correct: false}
    explanation: "La alternativa correcta es '$m = 2$'. $m = \\frac{13 - 5}{6 - 2} = \\frac{8}{4} = 2$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si los dos puntos tienen la misma ordenada $y_1 = y_2 = 4$, ¿cuál es el valor de la pendiente?"
    choices:
      - {text: "$m = 0$", is_correct: true}
      - {text: "$m = 4$", is_correct: false}
      - {text: "$m = 1$", is_correct: false}
      - {text: "La pendiente es indefinida.", is_correct: false}
    explanation: "La alternativa correcta es '$m = 0$'. $\\Delta y = 4 - 4 = 0 \\implies m = 0$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar las coordenadas $(x_1, y_1)$ y $(x_2, y_2)$ de ambos puntos.'
  - 'Paso 2: Calcular la diferencia de ordenadas $\Delta y = y_2 - y_1$.'
  - 'Paso 3: Calcular la diferencia de abscisas $\Delta x = x_2 - x_1$.'
  - 'Paso 4: Dividir $\frac{\Delta y}{\Delta x}$ y simplificar la fracción resultante.'
errores_correccion: |
  - **Error común:** Invertir la fórmula escribiendo $m = \frac{x_2 - x_1}{y_2 - y_1}$.
  - **Cómo corregirlo:** La pendiente es siempre **cambio en $Y$ dividido por cambio en $X$** ($\frac{\text{vertical}}{\text{horizontal}}$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La pendiente entre $(x_1, y_1)$ y $(x_2, y_2)$ se calcula como la resta de abscisas entre ordenadas $m = \frac{x_2 - x_1}{y_2 - y_1}$.'
  - 'Al calcular la pendiente entre $(2, 5)$ y $(4, 1)$, se omite la resta de signos resultando en $m = \frac{1 - 5}{2 - 4} = -2$.'
  - 'La pendiente de la recta que pasa por $(3, 4)$ y $(3, 9)$ es $m = 0$.'
  - 'Intercambiar el orden de los puntos en el denominador $m = \frac{y_2 - y_1}{x_1 - x_2}$ genera la misma pendiente exacta.'
  - 'La pendiente de una recta se calcula sumando las coordenadas de ambos puntos y dividiendo entre 2.'
afirmaciones_verdaderas:
  - 'La pendiente $m$ de una recta no vertical que pasa por $(x_1, y_1)$ y $(x_2, y_2)$ es la razón de cambio $m = \frac{y_2 - y_1}{x_2 - x_1}$.'
  - 'Mantener la consistencia en el orden de los puntos al restar ordenadas y abscisas es indispensable para no alterar el signo de la pendiente.'
al_terminar_debes_poder: |
  QUÉ: Calcular e interpretar la pendiente de una recta dados dos puntos pertenecientes a ella.
  CÓMO: Aplicar la fórmula $m = \frac{y_2 - y_1}{x_2 - x_1}$, verificar signos y simplificar la fracción resultante.
