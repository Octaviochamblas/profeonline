semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.EVALUACION_NUMERICA
resumen_inicial: 'Evaluación numérica de una función compuesta: conceptos, representación
  y propiedades en Composición de funciones.'
explicacion_simple: 'Antes de buscar la fórmula general de una composición, conviene
  practicar con números concretos: el proceso es exactamente el mismo, solo que más
  corto.'
explicacion_formal: '### Definición formal


  Para evaluar $(f \circ g)(a)$, se calcula $b = g(a)$ y luego se calcula $f(b)$;
  el resultado final es $(f \circ g)(a) = f(g(a))$. Cada paso es una evaluación numérica
  ordinaria de una función.


  ### Desarrollo didáctico


  El truco es hacerlo en dos pasos separados y nunca simultáneos: primero termina
  completamente de calcular $g(a)$, y solo después sustituye ese número en $f$.


  Si $f(x)=x^2+1$ y $g(x)=x-4$, para calcular $(f\circ g)(6)$: primero $g(6)=6-4=2$;
  luego $f(2)=2^2+1=5$. Por tanto $(f\circ g)(6)=5$.'
definiciones_clave: '- **Evaluación numérica de una función compuesta**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a evaluación numérica de una función compuesta.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a evaluación numérica
    de una función compuesta.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a evaluación numérica de una función
    compuesta.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
