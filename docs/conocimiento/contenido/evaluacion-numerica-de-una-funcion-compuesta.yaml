semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.EVALUACION_NUMERICA
resumen_inicial: Evaluar numéricamente $(f \circ g)(a)$ consiste en calcular el número
  $b = g(a)$ y luego evaluar la función externa $f(b)$.
explicacion_simple: 'Para evaluar $(f \circ g)(3)$ con números concretos:

  1. Reemplazamos $3$ en la función de adentro $g$, obteniendo por ejemplo $g(3) =
  10$.

  2. Reemplazamos ese resultado $10$ en la función de afuera $f$, obteniendo por ejemplo
  $f(10) = 45$.

  3. El valor numérico final de $(f \circ g)(3)$ es $45$.'
explicacion_formal: 'Dada una constante $a \in \operatorname{Dom}(f \circ g)$:


  $$(f \circ g)(a) = \left. f(u) \right|_{u = g(a)}$$


  **Desglose de la fórmula:**

  - Proceso aritmético de dos etapas: 1) $u_0 = g(a)$, 2) $y_0 = f(u_0)$.'
definiciones_clave: '- **Evaluación numérica puntual**: Obtención del valor numérico
  final de una composición sin necesidad de construir la fórmula algebraica completa.'
propiedades_relaciones: '- **Eficiencia de cálculo**: Evaluar numéricamente paso a
  paso resulta más rápido que simplificar la fórmula algebraica de la composición.'
ejemplo_guiado:
  enunciado: Dadas $f(x) = 3x - 4$ y $g(x) = x^2 + 2$, evalúa el valor de $(f \circ
    g)(-1)$ y el valor de $(g \circ f)(-1)$.
  pasos:
  - 'Paso 1: Para $(f \circ g)(-1)$: calcular $g(-1) = (-1)^2 + 2 = 1 + 2 = 3$.Paso
    2: Evaluar $f$ en el resultado $3$: $f(3) = 3(3) - 4 = 9 - 4 = 5 \implies (f \circ
    g)(-1) = 5$.Paso 3: Para $(g \circ f)(-1)$: calcular $f(-1) = 3(-1) - 4 = -3 -
    4 = -7$.Paso 4: Evaluar $g$ en $-7$: $g(-7) = (-7)^2 + 2 = 49 + 2 = 51 \implies
    (g \circ f)(-1) = 51$.Paso 5: Notar que $(f \circ g)(-1) = 5 \neq 51 = (g \circ
    f)(-1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $(f \circ g)(-1)$ con $g(x) = x^2 + 2$ y $f(x) = 3x - 4$, ¿cuál
    es el resultado numérico?
  choices:
  - text: $(f \circ g)(-1) = 5$
    is_correct: true
  - text: $(f \circ g)(-1) = 51$
    is_correct: false
  - text: $(f \circ g)(-1) = -5$
    is_correct: false
  - text: $(f \circ g)(-1) = 0$
    is_correct: false
  explanation: La alternativa correcta es '$(f \circ g)(-1) = 5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comparar los resultados de $(f \circ g)(-1) = 5$ y $(g \circ f)(-1)
    = 51$, ¿qué propiedad se demuestra?
  choices:
  - text: Que la composición de funciones NO es una operación conmutativa en general.
    is_correct: true
  - text: Que las funciones no están bien definidas.
    is_correct: false
  - text: Que los números negativos cambian la ley de asociatividad.
    is_correct: false
  - text: Que la respuesta depende del día.
    is_correct: false
  explanation: La alternativa correcta es 'Que la composición de funciones NO es una
    operación conmutativa en general.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar la preimagen dada $a$ en la función interna $g(a)$.'
- 'Paso 2: Registrar el número resultante de la primera evaluación.'
- 'Paso 3: Sustituir ese número dentro de la función externa $f(\cdot)$.'
- 'Paso 4: Resolver la aritmética final para obtener el resultado numérico.'
errores_correccion: '- **Error común:** Evaluar la constante en la función externa
  $f$ primero y luego meter el resultado en $g$.

  - **Cómo corregirlo:** La preimagen se introduce SIEMPRE en la función que está
  al lado derecho de la notación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
