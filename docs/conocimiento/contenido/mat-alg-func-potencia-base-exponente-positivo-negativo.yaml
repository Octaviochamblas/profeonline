semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_POSITIVO_NEGATIVO
resumen_inicial: 'El signo del exponente $n$ clasifica a la función potencia en modelos de crecimiento directo ($n > 0$) o de variación recíproca asintótica ($n < 0$).'
explicacion_simple: |
  El signo del exponente $n$ cambia radicalmente la forma de la función potencia. Cuando $n$ es positivo ($n > 0$, como $x^2$ o $x^3$), la curva pasa libremente por el punto $(0, 0)$ y es una línea o curva continua. Cuando $n$ es negativo ($n < 0$, como $x^{-1} = 1/x$ o $x^{-2} = 1/x^2$), la variable pasa al denominador. Esto hace que la función explote hacia el infinito cerca de $x = 0$ (creando una asíntota vertical) y jamás toque el punto cero.
explicacion_formal: |
  ### Definición formal
  El **signo del exponente** $n \in \mathbb{R}^*$ establece el tipo de dominio y comportamiento asintótico de la función potencia $f(x) = a x^n$:
  - **Exponente Positivo ($n > 0$)**:
    - Dominio continuo que incluye el origen: $\operatorname{Dom}(f) \supseteq [0, +\infty[$.
    - Pasa por el origen: $f(0) = a \cdot 0^n = 0$.
    - Comportamiento no acotado: $|f(x)| \to +\infty$ cuando $|x| \to +\infty$.
  - **Exponente Negativo ($n < -k < 0$)**:
    - Reescribible como cociente: $f(x) = a x^{-k} = \frac{a}{x^k}$.
    - Exclusión del origen: $0 \notin \operatorname{Dom}(f)$.
    - Asíntota vertical en $x = 0$: $\lim_{x \to 0^+} |f(x)| = +\infty$.
    - Asíntota horizontal en $y = 0$: $\lim_{x \to \pm\infty} f(x) = 0$.

  ### Comparativa estructural
  - $n > 0$: Curvas polinomiales directas o radicales continuas.
  - $n < 0$: Curvas hiperbólicas recíprocas con discontinuidad asintótica.

  ### Síntesis didáctica
  Diferenciar $x = 0$: En $n > 0$, el punto $(0, 0)$ es parte de la curva. En $n < 0$, la recta $x = 0$ es una asíntota impenetrable.
definiciones_clave: |
  - **Exponente positivo ($n > 0$)**: Condición que genera funciones continuas en el origen.
  - **Exponente negativo ($n < 0$)**: Condición que genera funciones de variación inversa con asíntota en $x = 0$.
  - **Curva recíproca**: Gráfica de la forma $y = \frac{a}{x^k}$ producida por exponentes negativos.
propiedades_relaciones: |
  - **Comportamiento en los extremos**: Para $n > 0$, si $x \to +\infty \implies y \to \pm\infty$. Para $n < 0$, si $x \to +\infty \implies y \to 0$.
  - **Punto nodal en $x = 1$**: Ambas familias de funciones se cruzan en la abscisa $x = 1$, donde $f(1) = a$ independientemente de si $n$ es positivo o negativo.
ejemplo_guiado:
  enunciado: 'Clasifica y compara las propiedades de dominio y comportamiento asintótico para: A) $f(x) = 3x^4$, B) $g(x) = 3x^{-4} = \frac{3}{x^4}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 3x^4$, el exponente $n=4 > 0$ es positivo. Dominio: $\mathbb{R}$, pasa por $(0, 0)$ y no tiene asíntotas.'
    - 'Paso 2: Para $g(x) = 3x^{-4}$, el exponente es negativo $n = -4 < 0$. Dominio: $\mathbb{R} \setminus \{0\}$.'
    - 'Paso 3: Identificar asíntotas en $g(x)$: asíntota vertical en $x = 0$ y asíntota horizontal en $y = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué diferencia principal de dominio existe entre $f(x) = 2x^3$ y $g(x) = 2x^{-3}$?'
    choices:
      - {text: 'El dominio de $f(x)$ es todo $\mathbb{R}$, mientras que el dominio de $g(x)$ excluye al cero ($\mathbb{R} \setminus \{0\}$)', is_correct: true}
      - {text: 'Ambas funciones tienen el mismo dominio $\mathbb{R}$', is_correct: false}
      - {text: 'El dominio de $f(x)$ excluye al cero y el de $g(x)$ es $\mathbb{R}$', is_correct: false}
      - {text: 'El dominio de $g(x)$ incluye solo números negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''El dominio de $f(x)$ es todo $\mathbb{R}$, mientras que el dominio de $g(x)$ excluye al cero ($\mathbb{R} \setminus \{0\}$)''. Con exponente negativo, la variable pasa al denominador $g(x) = \frac{2}{x^3}$, incalculable en $x = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con los valores de $h(x) = 5x^{-2}$ a medida que $x$ crece indefinidamente hacia $+\infty$?'
    choices:
      - {text: 'Se aproximan cada vez más a cero ($y \to 0$)', is_correct: true}
      - {text: 'Crecen indefinidamente hacia $+\infty$', is_correct: false}
      - {text: 'Se aproximan a 5', is_correct: false}
      - {text: 'Se vuelven números negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''Se aproximan cada vez más a cero ($y \to 0$)''. Al reescribir $h(x) = \frac{5}{x^2}$, al dividir por números gigantescos el resultado tiende a cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el signo del exponente $n$ en $f(x) = a x^n$.'
  - 'Paso 2: Si $n > 0$, verificar que $f(0) = 0$ y declarar continuidad en el origen.'
  - 'Paso 3: Si $n < 0$, reescribir la potencia como fracción $f(x) = \frac{a}{x^{|n|}}$.'
  - 'Paso 4: Excluir $x = 0$ del dominio e identificar las asíntotas $x = 0$ e $y = 0$.'
errores_correccion: |
  - **Error 1:** Creer que un exponente negativo produce valores $y$ negativos. **Cómo corregirlo:** El signo del exponente indica inversión de la base ($x^{-n} = \frac{1}{x^n}$), no de la salida $y$. El signo de $y$ lo determina únicamente el coeficiente $a$ y la paridad de $n$.
  - **Error 2:** Evaluar $x = 0$ en exponentes negativos y decir que da cero. **Cómo corregirlo:** En $n < 0$, $0^{-n} = \frac{1}{0^n}$ representa una división por cero, la cual está indefinida en $\mathbb{R}$.
ejemplos:
  - titulo: 'Evaluación en el origen'
    enunciado: '¿La función $f(x) = 7x^3$ pasa por $(0, 0)$, pero $g(x) = 7x^{-3}$ no?'
    alternativas:
      - 'Sí'
      - 'No, ambas pasan por $(0, 0)$'
      - 'No, ninguna pasa por $(0, 0)$'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. En $f(x)$: $7(0)^3 = 0 \implies (0, 0)$.'
      - '2. En $g(x)$: $7 / 0^3$ está indefinido.'
  - titulo: 'Asíntota horizontal en exponente negativo'
    enunciado: '¿La recta $y = 0$ es asíntota horizontal para $h(x) = -4x^{-2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cuando $x \to \pm\infty \implies \frac{-4}{x^2} \to 0$.'
  - titulo: 'Dominio de exponente negativo'
    enunciado: '¿El dominio de $p(x) = -2x^{-1}$ es el conjunto $\mathbb{R} \setminus \{0\}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Excluye únicamente al valor $x = 0$ que indefine la división.'
errores_frecuentes:
  - 'La afirmación de que una función potencia con exponente negativo como $f(x) = x^{-3}$ produce siempre resultados negativos.'
  - 'La afirmación de que las funciones potencia con exponente positivo $n > 0$ poseen asíntotas verticales en $x = 0$.'
  - 'La afirmación de que evaluar $x = 0$ en la función $f(x) = \frac{1}{x^2}$ da como resultado cero.'
  - 'La afirmación de que el dominio de la función $f(x) = x^{-1}$ es todo el conjunto de los números reales $\mathbb{R}$.'
  - 'La afirmación de que al hacer crecer $x \to +\infty$, las salidas de $f(x) = x^{-2}$ crecen hacia $+\infty$.'
afirmaciones_verdaderas:
  - 'Los exponentes enteros positivos $n > 0$ generan funciones potencia continuas en $\mathbb{R}$ que pasan por el origen $(0, 0)$, mientras que los exponentes negativos $n < 0$ generan curvas recíprocas excluidas en $x = 0$ con asíntotas cartesianas.'
  - 'Para exponente negativo $n < 0$, a medida que $x$ se aleja hacia $\pm\infty$, los valores de la función se aproximan a cero ($y \to 0$), bordeando el eje $x$.'
al_terminar_debes_poder: |
  QUÉ: Clasificar las funciones potencia según el signo de su exponente $n$.
  CÓMO: Distinguir curvas polinomiales continuas ($n > 0$) de curvas asintóticas discontinuas en el origen ($n < 0$).
