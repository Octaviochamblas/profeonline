semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_POSITIVO_NEGATIVO
resumen_inicial: 'Distinción entre exponentes positivos y negativos en funciones potencia:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Definición y análisis
  de parámetros.'
explicacion_simple: 'El signo del exponente cambia por completo el comportamiento
  de la función cuando $x$ crece: unas crecen sin límite y otras se acercan a $0$.'
explicacion_formal: '### Definición formal


  Para $n>0$, $|x^n|\to\infty$ cuando $|x|\to\infty$: la función crece sin límite.
  Para $n<0$, $x^n=1/x^{|n|}$, y como $|x^{|n|}|\to\infty$ cuando $|x|\to\infty$,
  se cumple que $|x^n|\to0$: la función decrece hacia $0$.


  ### Desarrollo didáctico


  Con $n=2$: $f(10)=100$, $f(100)=10\,000$, crece sin límite. Con $n=-2$: $f(10)=1/100=0{,}01$,
  $f(100)=1/10\,000=0{,}0001$, se acerca cada vez más a $0$.'
definiciones_clave: '- **Distinción entre exponentes positivos y negativos en funciones
  potencia**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a distinción entre exponentes positivos y negativos en funciones
  potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de distinción entre exponentes positivos y negativos en funciones potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de distinción entre exponentes
    positivos y negativos en funciones potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar distinción entre exponentes positivos y negativos en funciones
    potencia?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en definición y análisis de parámetros
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en definición y análisis de parámetros.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en distinción entre exponentes positivos y negativos en funciones
    potencia?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determina si el exponente $n$ es positivo o negativo.'
- 'Paso 2: Si es positivo, anticipa que la función crece en valor absoluto al aumentar
  $|x|$.'
- 'Paso 3: Si es negativo, anticipa que la función se acerca a $0$ al aumentar $|x|$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en distinción entre exponentes positivos y negativos en funciones
  potencia.
ejemplos:
- titulo: Comportamiento con exponente positivo
  enunciado: Evalúa $f(x)=x^3$ en $x=5$ y $x=10$ y describe la tendencia.
  solucion_pasos:
  - $f(5)=125$ y $f(10)=1000$.
  - El resultado crece rápidamente a medida que $x$ aumenta.
- titulo: Comportamiento con exponente negativo
  enunciado: Evalúa $f(x)=x^{-3}$ en $x=5$ y $x=10$ y describe la tendencia.
  solucion_pasos:
  - $f(5)=1/125=0{,}008$ y $f(10)=1/1000=0{,}001$.
  - El resultado se acerca cada vez más a $0$ a medida que $x$ aumenta.
- titulo: ¿$x^{-n}$ con $n>0$ puede tomar valores mayores que $1$?
  enunciado: ¿Puede $x^{-n}$ (con $n>0$) tomar valores mayores que $1$ cuando $x$
    es cercano a $0$?
  respuesta: Sí
  solucion_pasos:
  - Al acercarse el argumento a $0$, la función con exponente negativo crece sin límite.
- titulo: ¿El comportamiento de crecimiento/decrecimiento depende del signo del exponente
    $n$?
  enunciado: ¿La tendencia de la función cuando $|x|$ crece depende directamente del
    signo del exponente $n$?
  respuesta: Sí
  solucion_pasos:
  - Un exponente positivo produce crecimiento en valor absoluto, y uno negativo produce
    acercamiento a $0$.
errores_frecuentes:
- Confundir el comportamiento de exponente negativo con el de un coeficiente $a$ negativo.
- Suponer que toda función potencia crece sin límite, ignorando el caso de exponente
  negativo.
- No distinguir el comportamiento cerca de $x=0$ del comportamiento cuando $|x|$ es
  grande.
- Olvidar que el exponente negativo introduce una restricción de dominio ($x\neq0$).
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  distinción entre exponentes positivos y negativos en funciones potencia.
