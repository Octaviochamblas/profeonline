semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_POSITIVO_NEGATIVO
resumen_inicial: 'El signo del exponente $n$ determina la continuidad y la estructura de la función potencia: $n > 0$ genera curvas polinomiales continuas que pasan por el origen, mientras que $n < 0$ genera curvas recíprocas hiperbólicas con asíntota en $x = 0$.'
explicacion_simple: |
  El signo del exponente $n$ cambia completamente el tipo de función potencia $f(x) = a x^n$. Si el exponente es positivo (como $x^2$ o $x^3$), la variable $x$ se encuentra multiplicando en el numerador; la curva es continua, suave y pasa siempre por el punto $(0, 0)$. Si el exponente es negativo (como $x^{-1} = \frac{1}{x}$ o $x^{-2} = \frac{1}{x^2}$), la potencia baja al denominador como una fracción; la curva se parte en dos ramas y jamás puede tocar el eje $y$ (recta $x = 0$), el cual actúa como una línea frontera insuperable (asíntota vertical).
explicacion_formal: |
  ### Definición formal
  La **dicotomía del signo del exponente** $n \in \mathbb{Z} \setminus \{0\}$ en la función potencia $f(x) = a x^n$ define dos regímenes analíticos disjuntos:

  1. **Exponente Entero Positivo ($n \in \mathbb{Z}^+$)**:
     - **Dominio Máximo**: $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.
     - **Continuidad en el Origen**: $f(0) = a \cdot 0^n = 0$. El origen $(0, 0)$ es un punto continuo de la gráfica.
     - **Comportamiento Infinito**: Crecimiento ilimitado cuando $|x| \to \infty$.

  2. **Exponente Entero Negativo ($n = -m, m \in \mathbb{Z}^+$)**:
     - **Reescritura Recíproca**: $f(x) = \frac{a}{x^m}$.
     - **Dominio Máximo**: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$.
     - **Asíntotas**:
       - Asíntota Vertical: Recta $x = 0$ (eje $y$), con $\lim_{x \to 0} |f(x)| = +\infty$.
       - Asíntota Horizontal: Recta $y = 0$ (eje $x$), con $\lim_{x \to \pm\infty} f(x) = 0$.

  ### Síntesis didáctica
  Diferencia en el origen $x = 0$:
  - Exponente positivo ($n > 0$) $\implies$ La curva **atraviesa o toca** el punto $(0, 0)$.
  - Exponente negativo ($n < 0$) $\implies$ La curva **huye** del eje $y$ volviéndose asintótica a $\pm\infty$.
definiciones_clave: |
  - **Exponente positivo ($n > 0$)**: Grado multiplicativo directo con dominio completo $\mathbb{R}$.
  - **Exponente negativo ($n < 0$)**: Grado recíproco divisor $a / x^m$ con asíntotas en los ejes cartesianos.
  - **Punto continuo $(0, 0)$ frente a Asíntota vertical $x = 0$**: Comportamiento límite contrapuesto en el origen.
propiedades_relaciones: |
  - **Inversión de tendencias en el infinito**: Con $n > 0$, al alejarse del origen ($|x| \to \infty$), las salidas $|y| \to \infty$. Con $n < 0$, al alejarse del origen ($|x| \to \infty$), las salidas $|y| \to 0$ (bordeando el eje $x$).
  - **Inversión de tendencias cerca de cero**: Con $n > 0$, al acercarse a cero ($x \to 0$), $|y| \to 0$. Con $n < 0$, al acercarse a cero ($x \to 0$), $|y| \to \infty$.
ejemplo_guiado:
  enunciado: 'Compara la gráfica, dominio y comportamiento en $x = 0$ de las siguientes funciones potencia: A) $f(x) = 2x^3$, B) $g(x) = 2x^{-3}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 2x^3$, el exponente $n=3 > 0$ es positivo. Dominio: $\mathbb{R}$. Evaluando en $x = 0$: $f(0) = 2(0)^3 = 0$. La curva pasa continuamente por $(0, 0)$.'
    - 'Paso 2: Para $g(x) = 2x^{-3} = \frac{2}{x^3}$, el exponente $n=-3 < 0$ es negativo. Dominio: $\mathbb{R} \setminus \{0\}$. Evaluando en $x = 0$: $g(0) = \frac{2}{0}$ no existe.'
    - 'Paso 3: Analizamos límites para $g(x)$: cuando $x \to 0^+$, $g(x) \to +\infty$; cuando $x \to \pm\infty$, $g(x) \to 0$.'
    - 'Paso 4: Conclusión: $f(x)$ es una curva polinomial continua que pasa por el origen; $g(x)$ es una hipérbola discontinua de dos ramas con asíntota vertical en $x = 0$ y asíntota horizontal en $y = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes afirmaciones describe con exactitud el comportamiento de la función potencia $f(x) = 5x^{-4}$ cerca del origen $x = 0$?'
    choices:
      - {text: 'El valor $x = 0$ no pertenece a su dominio y la recta $x = 0$ actúa como asíntota vertical hacia la cual la curva se dispara a $+\infty$', is_correct: true}
      - {text: 'La función pasa por el punto $(0, 0)$ de forma continua', is_correct: false}
      - {text: 'La función alcanza un valor mínimo en el punto $(0, 5)$', is_correct: false}
      - {text: 'La función se transforma en una recta horizontal', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor $x = 0$ no pertenece a su dominio y la recta $x = 0$ actúa como asíntota vertical hacia la cual la curva se dispara a $+\infty$''. Al ser $x^{-4} = \frac{1}{x^4}$, la división por valores cercanos a cero produce divergencia asintótica.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con los valores de salida de la función potencia $f(x) = 3x^{-1} = \frac{3}{x}$ cuando la variable $x$ toma valores extremadamente grandes ($x \to +\infty$)?'
    choices:
      - {text: 'Los valores de salida se aproximan a cero ($y \to 0$), bordeando la asíntota horizontal del eje $x$', is_correct: true}
      - {text: 'Los valores de salida crecen indefinidamente hacia $+\infty$', is_correct: false}
      - {text: 'Los valores de salida se mantienen constantes en $y = 3$', is_correct: false}
      - {text: 'Los valores de salida cambian a números negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''Los valores de salida se aproximan a cero ($y \to 0$), bordeando la asíntota horizontal del eje $x$''. Dividir un número constante 3 por valores gigantescos entrega resultados tendientes a cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el signo del exponente $n$ en la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Si $n > 0$, establecer el dominio como $\mathbb{R}$, declarar continuidad en el origen y confirmar el paso por el punto $(0, 0)$.'
  - 'Paso 3: Si $n < 0$, reescribir como fracción $f(x) = \frac{a}{x^{|n|}}$, establecer el dominio como $\mathbb{R} \setminus \{0\}$.'
  - 'Paso 4: Para $n < 0$, declarar la asíntota vertical en $x = 0$ y la asíntota horizontal en $y = 0$.'
errores_correccion: |
  - **Error 1:** Evaluar $x = 0$ en funciones con exponente negativo escribiendo $f(0) = 0$. **Cómo corregirlo:** En exponente negativo, $x^n$ está en el denominador. Evaluar en cero daría una división por cero ($\frac{a}{0}$), la cual está indefinida en $\mathbb{R}$.
  - **Error 2:** Creer que un exponente negativo hace que el resultado de la función sea negativo. **Cómo corregirlo:** Un exponente negativo invierte la base ($\frac{1}{x^m}$), pero no altera el signo del coeficiente $a$. Por ejemplo, para $x = 2$, $x^{-2} = \frac{1}{4} > 0$.
ejemplos:
  - titulo: 'Identificación de asíntota en exponente negativo'
    enunciado: '¿La función $f(x) = 4x^{-2}$ tiene como asíntota vertical a la recta $x = 0$?'
    alternativas:
      - 'Sí, por tener exponente negativo'
      - 'No, pasa por $(0, 0)$'
      - 'No, la asíntota es $y = 4$'
    respuesta: 'Sí, por tener exponente negativo'
    solucion_pasos:
      - '1. Reescribimos $f(x) = \frac{4}{x^2}$.'
      - '2. El denominador se anula en $x = 0$, generando una asíntota vertical en la recta $x = 0$.'
  - titulo: 'Paso por el origen en exponente positivo'
    enunciado: '¿La función $g(x) = 7x^3$ contiene al punto $(0, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como el exponente $3 > 0$, $g(0) = 7(0)^3 = 0$, pasando por $(0, 0)$.'
  - titulo: 'Tendencia en el infinito para exponente negativo'
    enunciado: 'Para $h(x) = x^{-5}$, ¿el límite cuando $x \to +\infty$ es igual a 0?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $h(x) = \frac{1}{x^5}$. Al crecer $x$, la fracción tiende a 0.'
  - titulo: 'Dominio de exponente negativo'
    enunciado: '¿El dominio de $p(x) = -2x^{-1}$ es el conjunto $\mathbb{R} \setminus \{0\}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Excluye únicamente al valor $x = 0$ que indefine la división.'
errores_frecuentes:
  - 'Una función potencia con exponente negativo como $f(x) = x^{-3}$ produce siempre resultados negativos.'
  - 'Las funciones potencia con exponente positivo $n > 0$ poseen asíntotas verticales en $x = 0$.'
  - 'Evaluar $x = 0$ en la función $f(x) = \frac{1}{x^2}$ da como resultado cero.'
  - 'El dominio de la función $f(x) = x^{-1}$ es todo el conjunto de los números reales $\mathbb{R}$.'
  - 'Al hacer crecer $x \to +\infty$, las salidas de $f(x) = x^{-2}$ crecen hacia $+\infty$.'
afirmaciones_verdaderas:
  - 'Los exponentes enteros positivos $n > 0$ generan funciones potencia continuas en $\mathbb{R}$ que pasan por el origen $(0, 0)$, mientras que los exponentes negativos $n < 0$ generan curvas recíprocas excluidas en $x = 0$ con asíntotas cartesianas.'
  - 'Para exponente negativo $n < 0$, a medida que $x$ se aleja hacia $\pm\infty$, los valores de la función se aproximan a cero ($y \to 0$), bordeando el eje $x$.'
al_terminar_debes_poder: 'Diferenciar el comportamiento analítico, continuidad y asíntotas de funciones potencia con exponente positivo frente a exponente negativo.'
