semantic_id: MAT.NUM.PROG_GEOMETRICA.MODELO_CRECIMIENTO_PORCENTUAL
resumen_inicial: 'El modelamiento de crecimiento y decrecimiento porcentual mediante progresiones geométricas aplica factores multiplicativos $r = 1 \pm \frac{p}{100}$ a magnitudes que varían a tasas relativas constantes por período.'
explicacion_simple: |
  Cuando una cantidad aumenta o disminuye en un **porcentaje fijo** en cada período de tiempo, estamos frente a una **progresión geométrica**:
  - **Aumento porcentual (crecimiento)**: Si una población o inversión crece un $10\%$ cada año:
    $$r = 1 + \frac{10}{100} = 1 + 0,10 = 1,10$$
  - **Disminución porcentual (decaimiento/descuento)**: Si el valor de una máquina cae un $15\%$ cada año:
    $$r = 1 - \frac{15}{100} = 1 - 0,15 = 0,85$$
  - **Fórmula de evolución**: Si empiezas con una cantidad inicial $M_0$, al cabo de $t$ períodos tienes:
    $$M_t = M_0 \cdot r^t$$

  ![Modelamiento de crecimiento porcentual mediante PG](/static/img/nodos/modelamiento-de-crecimiento-porcentual-mediante-progresiones-geometricas-intro.svg)
explicacion_formal: |
  ### Definición formal del Factor de Capitalización / Decaimiento
  Sea $M_0$ la magnitud en el instante inicial $t=0$, y sea $p\%$ la tasa porcentual constante por período:
  - **Para incremento periódico de $p\%$**:
    $$M_1 = M_0 + M_0\left(\frac{p}{100}\right) = M_0\left(1 + \frac{p}{100}\right)$$
    $$M_t = M_0\left(1 + \frac{p}{100}\right)^t \quad (r = 1 + i, \; i = p/100)$$
  - **Para decremento periódico de $p\%$**:
    $$M_t = M_0\left(1 - \frac{p}{100}\right)^t \quad (r = 1 - i, \; i = p/100)$$

  ### Correspondencia con la Notación de Progresiones
  - Si indexamos desde $t=0$, el término inicial es $M_0$ y el valor en el período $t$ es $M(t) = M_0 \cdot r^t$.
  - Si indexamos como términos de sucesión $a_n$ donde $a_1$ es el valor al finalizar el período 1 ($a_1 = M_0 \cdot r$), entonces el término general $a_n = a_1 \cdot r^{n-1} = (M_0 \cdot r) \cdot r^{n-1} = M_0 \cdot r^n$.

  ### Síntesis didáctica
  - Crecimiento porcentual: $r = 1 + \frac{p}{100} > 1$.
  - Decrecimiento porcentual: $r = 1 - \frac{p}{100} < 1$.
definiciones_clave: |
  - **Factor de variación ($r$)**: Multiplicador $1 \pm \frac{p}{100}$ que transforma el valor de un período al siguiente.
  - **Tasa periódica ($i$)**: Proporción decimal $i = \frac{p}{100}$ de incremento o reducción por unidad de tiempo.
  - **Interés compuesto**: Modelo financiero geométrico donde los intereses generados se incorporan al capital para producir nuevos intereses.
propiedades_relaciones: |
  - **Efecto acumulativo exponencial**: El crecimiento porcentual continuo genera curvas convexas donde el incremento absoluto en dinero o unidades es cada vez mayor en cada período.
  - **Principio del interés sobre interés**: A diferencia del interés simple (PA lineal), el interés compuesto (PG exponencial) reinvierte la totalidad de los rendimientos.
ejemplo_guiado:
  enunciado: 'Un capital inicial de $\$100.000$ se deposita en una cuenta bancaria que rinde un $8\%$ de interés compuesto anual. Escribe la razón geométrica del modelo y calcula el monto acumulado al cabo de 3 años.'
  imagen: '/static/img/nodos/modelamiento-de-crecimiento-porcentual-mediante-progresiones-geometricas-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el capital inicial $M_0 = \$100.000$ y la tasa $p = 8\%$.'
    - 'Paso 2: Calculamos la razón geométrica: $r = 1 + \frac{8}{100} = 1 + 0,08 = 1,08$.'
    - 'Paso 3: Aplicamos la fórmula exponencial para $t = 3$ años: $M_3 = M_0 \cdot (1,08)^3$.'
    - 'Paso 4: Calculamos la potencia: $(1,08)^3 = 1,259712$.'
    - 'Paso 5: Multiplicamos por el capital inicial: $M_3 = \$100.000 \cdot 1,259712 = **\$125.971,20$** (o $\$125.971$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una población de peces disminuye a una tasa del $12\%$ anual, ¿cuál es la razón geométrica $r$ que modela la población cada año?'
    choices:
      - {text: '$r = 1 - 0,12 = 0,88$', is_correct: true}
      - {text: '$r = 0,12$', is_correct: false}
      - {text: '$r = 1,12$', is_correct: false}
      - {text: '$r = -0,12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$r = 1 - 0,12 = 0,88$''. En una disminución porcentual, la razón es $r = 1 - \frac{p}{100} = 1 - 0,12 = 0,88$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un bosque tiene $10.000$ árboles y aumenta un $5\%$ su masa forestal cada año ($r=1,05$). ¿Cuántos árboles habrá tras 2 años?'
    choices:
      - {text: '$11.025$ árboles, calculando $10.000 \cdot (1,05)^2 = 10.000 \cdot 1,1025 = 11.025$', is_correct: true}
      - {text: '$11.000$ árboles (usando modelo lineal simple)', is_correct: false}
      - {text: '$10.500$ árboles', is_correct: false}
      - {text: '$12.000$ árboles', is_correct: false}
    explanation: 'La alternativa correcta es ''$11.025$ árboles, calculando $10.000 \cdot (1,05)^2 = 10.000 \cdot 1,1025 = 11.025$''. El segundo año se calcula el 5% sobre los 10.500 del primer año.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el valor inicial $M_0$ y la tasa porcentual periódica $p\%$.'
  - 'Paso 2: Determinar si es aumento ($r = 1 + p/100$) o disminución ($r = 1 - p/100$).'
  - 'Paso 3: Formular la ecuación exponencial $M(t) = M_0 \cdot r^t$.'
  - 'Paso 4: Evaluar para el número de períodos $t$ y contextualizar con las unidades correspondientes.'
errores_correccion: |
  - **Error 1:** Usar la tasa $p/100$ directamente como razón (ej: usar $r=0,08$ en vez de $1,08$). **Cómo corregirlo:** La razón de crecimiento **siempre suma la base 1**: $r = 1 + 0,08 = 1,08$.
  - **Error 2:** Modelar crecimientos porcentuales con sumas lineales (interés simple/PA). **Cómo corregirlo:** Las variaciones en porcentaje **son multiplicativas (PG)**, no adiciones fijas.
ejemplos:
  - titulo: 'Crecimiento de inversión con interés compuesto'
    enunciado: 'Un depósito de $\$50.000$ gana $10\%$ compuesto anual. ¿Cuál es el monto tras 2 años?'
    alternativas:
      - '$\$60.500$'
      - '$\$60.000$'
      - '$\$55.000$'
    respuesta: '$\$60.500$'
    solucion_pasos:
      - '1. $r = 1 + 0,10 = 1,10$.'
      - '2. $M_2 = 50.000 \cdot (1,10)^2 = 50.000 \cdot 1,21 = \$60.500$.'
  - titulo: 'Decaimiento de valor por uso'
    enunciado: 'Una computadora de $\$400.000$ pierde $20\%$ de su valor por año. ¿Cuál es su valor al año 2?'
    alternativas:
      - '$\$256.000$'
      - '$\$240.000$'
      - '$\$320.000$'
    respuesta: '$\$256.000$'
    solucion_pasos:
      - '1. $r = 1 - 0,20 = 0,80$.'
      - '2. $M_2 = 400.000 \cdot (0,80)^2 = 400.000 \cdot 0,64 = \$256.000$.'
  - titulo: 'Modelo de duplicación'
    enunciado: '¿Una población que crece un $100\%$ cada período tiene una razón geométrica $r = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $r = 1 + 100/100 = 1 + 1 = 2$.'
  - titulo: 'Diferenciación entre PA y PG porcentual'
    enunciado: '¿Un aumento constante del $6\%$ por período se modela mediante una progresión aritmética?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Las variaciones porcentuales constantes corresponden a progresiones geométricas.'
errores_frecuentes:
  - 'Utilizar la tasa porcentual directa $p/100$ como razón geométrica sin sumar la unidad base.'
  - 'Modelar los aumentos porcentuales periódicos sumando una cantidad constante como en una progresión aritmética.'
  - 'En decrecimientos porcentuales se resta la tasa porcentual al valor inicial de forma lineal en cada paso.'
  - 'Asumir que el interés compuesto genera el mismo saldo final que el régimen de interés simple.'
  - 'Confundir el número de períodos transcurridos $t$ con el monto final acumulado.'
afirmaciones_verdaderas:
  - 'Toda variación porcentual periódica constante $p\%$ se modela mediante una progresión geométrica con razón $r = 1 \pm \frac{p}{100}$.'
  - 'El crecimiento porcentual periódico genera un efecto exponencial compuesto donde cada incremento absoluto supera al anterior.'
