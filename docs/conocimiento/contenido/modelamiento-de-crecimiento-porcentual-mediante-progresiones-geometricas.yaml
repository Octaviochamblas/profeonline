procedimiento:
- 'Paso 1: Identifica si el problema habla de un aumento (interés, crecimiento) o disminución
  (descuento, depreciación) porcentual.'
- 'Paso 2: Convierte ese porcentaje a decimal dividiéndolo por 100.'
- 'Paso 3: Si es aumento, suma 1 (ej: 1 + 0.05 = 1.05). Si es disminución, réstaselo a 1 (ej:
  1 - 0.05 = 0.95). Ese número es tu razón ''r''.'
- 'Paso 4: Aplica la fórmula de progresión geométrica multiplicando el valor inicial por $r^n$.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en modelamiento de crecimiento porcentual mediante progresiones geométricas.
ejemplos:
- titulo: El auto que pierde valor
  enunciado: Un auto cuesta $10.000.000 y se deprecia un 10% cada año. ¿Cuál será su valor
    tras 3 años?
  solucion_pasos:
  - Es disminución del 10%. Razón r = 1 - (10/100) = 1 - 0.10 = 0.90.
  - Valor inicial = 10.000.000.
  - Valor tras 3 años = 10.000.000 * (0.90)^3
  - 0.90^3 = 0.729.
  - 10.000.000 * 0.729 = $7.290.000.
- titulo: Ejemplo 1
  enunciado: Una población de bacterias crece un 20 por ciento cada hora. ¿Cuál es la razón
    r?
  alternativas:
  - 1,2
  - 0,2
  - 1,02
  respuesta: 1,2
  solucion_pasos:
  - 1 más 0,20 es igual a 1,20.
- titulo: Ejemplo 2
  enunciado: Un producto se deprecia un 15 por ciento cada año. ¿Cuál es la razón r?
  alternativas:
  - 0,85
  - 1,15
  - 0,15
  respuesta: 0,85
  solucion_pasos:
  - 1 menos 0,15 es igual a 0,85.
- titulo: ¿Un crecimiento porcentual constante se modela con una progresión geométrica?
  respuesta: Sí
  solucion_pasos:
  - Porque el factor de cambio se multiplica en cada periodo, no se suma.
- titulo: ¿Aumentar un 10 por ciento durante 2 años seguidos equivale a aumentar un 20 por
    ciento de una sola vez?
  respuesta: 'No'
  solucion_pasos:
  - El segundo aumento se calcula sobre el nuevo monto ya aumentado, por lo que el resultado
    final es mayor que un 20 por ciento simple.
errores_frecuentes:
- Creer que si algo aumenta un 10% cada año por 3 años, aumenta un 30% en total (Falso, los
  porcentajes se aplican sobre el nuevo monto acumulado cada año).
- 'Usar el porcentaje directo como razón (ej: multiplicar por 0.10 en vez de por 1.10 para
  un aumento).'
- Usar directamente el porcentaje como razón, en vez de sumarle 1, por ejemplo usar 0,08 en
  vez de 1,08.
- Creer que un aumento del 8 por ciento durante 3 años seguidos equivale a un aumento total
  del 24 por ciento.
- Aplicar la fórmula de disminución, restando el porcentaje a 1, cuando el problema describe
  un aumento.
afirmaciones_verdaderas:
- La formulación de modelamiento de crecimiento porcentual mediante progresiones geométricas
  mantiene la regularidad de la sucesión.
- Cuando una cantidad crece un mismo porcentaje en cada periodo, la razón geométrica se calcula
  como 1 más el porcentaje en decimal.
