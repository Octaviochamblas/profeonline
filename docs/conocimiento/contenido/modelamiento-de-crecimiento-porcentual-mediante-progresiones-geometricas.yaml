semantic_id: MAT.NUM.PROG_GEOMETRICA.MODELO_CRECIMIENTO_PORCENTUAL
resumen_inicial: 'Modelamiento de crecimiento porcentual mediante progresiones geométricas:
  concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: Si tu dinero crece un 5% cada año, no está creciendo sumando la misma
  cantidad, está creciendo sumando un porcentaje del nuevo total. Esta es la magia del interés
  compuesto, y es una Progresión Geométrica en estado puro.
explicacion_formal: "Cuando algo aumenta o disminuye en un porcentaje fijo, no es una progresión\
  \ aritmética (lineal), sino geométrica (exponencial).\n\nPara hallar la Razón Geométrica\
  \ ($r$) a partir de un porcentaje:\n1. **Aumento porcentual ($+p\\%$):** Tu nuevo total\
  \ es el $100\\%$ original MÁS el $p\\%$. En decimales, esto es $r = 1 + \\frac{p}{100}$.\n\
  \   - *Ejemplo:* Si aumenta un $15\\%$ anual, la razón es $r = 1 + 0.15 = 1.15$.\n2. **Disminución\
  \ porcentual ($-p\\%$):** Tu nuevo total es el $100\\%$ MENOS el $p\\%$. En decimales, esto\
  \ es $r = 1 - \\frac{p}{100}$.\n   - *Ejemplo:* Si un auto pierde un $20\\%$ de su valor\
  \ anual, la razón es $r = 1 - 0.20 = 0.80$.\n\nLa fórmula general queda: $Capital_{final}\
  \ = Capital_{inicial} \\cdot r^n$ (Nota: en finanzas suele usarse exponente '$n$' directo\
  \ porque se cuenta desde el periodo cero, a diferencia de la P.G. estricta que empieza en\
  \ 1)."
definiciones_clave: '- **Modelamiento de crecimiento porcentual mediante progresiones geométricas**:
  Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Modelamiento de crecimiento porcentual mediante
  progresiones geométricas**: Relaciones de cambio y fórmulas estructurales de progresión
  geométrica.'
ejemplo_guiado:
  enunciado: Una inversión de 500.000 pesos crece un 8 por ciento cada año. ¿Cuánto dinero
    habrá después de 3 años?
  pasos:
  - 'Calculo la razón: como es un aumento del 8 por ciento, r es igual a 1 más 0,08, o sea
    1,08.'
  - 'Aplico la fórmula: capital final igual a 500.000 por 1,08 elevado a 3.'
  - Calculo 1,08 elevado a 3, aproximadamente 1,2597, y 500.000 por 1,2597 es aproximadamente
    629.850. Habrá cerca de 629.850 pesos.
