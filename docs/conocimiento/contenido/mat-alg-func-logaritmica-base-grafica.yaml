semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.GRAFICA
resumen_inicial: 'La construcción de la gráfica de la función logarítmica requiere ubicar la asíntota vertical, el intercepto con el eje $x$ en $(1, 0)$ y el punto nodal $(b, 1)$.'
explicacion_simple: |
  Para dibujar la curva de una función logarítmica básica en el plano cartesiano, seguimos tres pasos sencillos: primero marcamos la línea vertical asíntota en el eje $y$ (recta $x = 0$); segundo ubicamos el punto clave por donde siempre pasa la curva en el suelo, que es el par $(1, 0)$; y tercero marcamos el punto $(b, 1)$ a la altura 1. Luego unimos estos puntos con una curva suave que bordea la línea vertical sin tocarla.
explicacion_formal: |
  ### Definición formal
  El **trazado cartesiano de la función logarítmica** $f(x) = a \cdot \log_b(cx + d) + k$ es la representación geométrica continua del conjunto ordenado de puntos $G = \{(x, f(x)) \in \mathbb{R}^2 \mid x \in \operatorname{Dom}(f)\}$ definido por los elementos notables:
  1. **Asíntota Vertical**: Recta $x = -\frac{d}{c}$.
  2. **Punto Nodal de Abscisa 1**: $P_1 = (1, 0)$ para la forma básica $f(x) = \log_b(x)$.
  3. **Punto Nodal de la Base**: $P_b = (b, 1)$ para la forma básica $f(x) = \log_b(x)$.
  4. **Punto Nodal Recíproco**: $P_{1/b} = \left(\frac{1}{b}, -1\right)$ para la forma básica.

  ### Desglose simbólico
  - Trazado para $b > 1$: Curva naciente en $-\infty$ que bordea $x = 0$, atraviesa $(1, 0)$, pasa por $(b, 1)$ y diverge suavemente a $+\infty$.
  - Trazado para $0 < b < 1$: Curva naciente en $+\infty$ que bordea $x = 0$, atraviesa $(1, 0)$, pasa por $(b, 1)$ y desciende hacia $-\infty$.

  ### Síntesis didáctica
  Técnica de los tres puntos pivote para graficar $\log_b(x)$:
  - $x = 1/b \implies y = -1$
  - $x = 1 \implies y = 0$
  - $x = b \implies y = 1$
definiciones_clave: |
  - **Trazado logarítmico**: Representación continua y suave de la función logarítmica en el plano cartesiano.
  - **Puntos nodales pivote**: Conjunto de pares ordenados $\{(1/b, -1), (1, 0), (b, 1)\}$ que determinan la curvatura.
  - **Eje asíntota $x = 0$**: Eje vertical que marca el límite izquierdo del gráfico para la función básica.
propiedades_relaciones: |
  - **Simetría respecto a $y = x$**: Todo punto $(x_0, y_0)$ de la gráfica logarítmica corresponde exactamente al punto $(y_0, x_0)$ de la gráfica exponencial $y = b^x$.
  - **Invariancia por la base**: El punto $(1, 0)$ pertenece a todas las gráficas logarítmicas de la forma $y = \log_b(x)$.
ejemplo_guiado:
  enunciado: 'Construye el esquema gráfico de la función logarítmica $f(x) = \log_2(x)$, identificando la asíntota vertical y sus tres puntos pivote fundamentales.'
  pasos:
    - 'Paso 1: Identificamos la asíntota vertical en la recta $x = 0$ (el eje $y$).'
    - 'Paso 2: Evaluamos el punto nodal de abscisa 1: $x = 1 \implies f(1) = \log_2(1) = 0 \implies (1, 0)$.'
    - 'Paso 3: Evaluamos el punto nodal de la base: $x = 2 \implies f(2) = \log_2(2) = 1 \implies (2, 1)$.'
    - 'Paso 4: Evaluamos el punto recíproco: $x = 1/2 = 0.5 \implies f(0.5) = \log_2(2^{-1}) = -1 \implies (0.5, -1)$.'
    - 'Paso 5: Trazamos la curva suave continua partiendo desde $-\infty$ pegada al eje $y$, pasando por $(0.5, -1)$, $(1, 0)$, $(2, 1)$ y ascendiendo hacia la derecha.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las coordenadas del punto nodal por el que pasa obligatoriamente la gráfica de la función logarítmica $f(x) = \log_6(x)$ a la altura $y = 1$?'
    choices:
      - {text: '$(6, 1)$', is_correct: true}
      - {text: '$(1, 6)$', is_correct: false}
      - {text: '$(0, 6)$', is_correct: false}
      - {text: '$(6, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(6, 1)$''. Al evaluar $x = b = 6$, $f(6) = \log_6(6) = 1$, determinando el punto nodal $(6, 1)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si queremos bosquejar la gráfica de la función logarítmica $g(x) = \log_{0.2}(x)$, ¿cuáles son los puntos pivote por donde transita la curva?'
    choices:
      - {text: '$(5, -1)$, $(1, 0)$ y $(0.2, 1)$', is_correct: true}
      - {text: '$(0, 0)$, $(1, 1)$ y $(2, 2)$', is_correct: false}
      - {text: '$(0, 0.2)$, $(1, 0.2)$ y $(2, 0.2)$', is_correct: false}
      - {text: '$(-0.2, 1)$, $(0, 1)$ y $(1, 1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(5, -1)$, $(1, 0)$ y $(0.2, 1)$''. Evaluamos: $g(0.2) = \log_{0.2}(0.2) = 1$, $g(1) = 0$, y $g(5) = \log_{0.2}(0.2^{-1}) = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Trazar la asíntota vertical en la recta $x = 0$ (o $x = -d/c$ si está trasladada).'
  - 'Paso 2: Marcar el intercepto con el eje $x$ en el punto $(1, 0)$.'
  - 'Paso 3: Marcar el punto nodal de la base en $(b, 1)$ y el recíproco en $(1/b, -1)$.'
  - 'Paso 4: Unir los puntos trazados con una curva suave continua respetando la asíntota vertical.'
errores_correccion: |
  - **Error 1:** Dibujar la gráfica de la función logarítmica atravesando el eje $y$. **Cómo corregirlo:** El eje $y$ (recta $x = 0$) es una asíntota vertical infranqueable. La gráfica debe bordearla sin tocarla ni cruzarla jamás.
  - **Error 2:** Unir los puntos nodales mediante segmentos rectos en zigzag. **Cómo corregirlo:** La función logarítmica es una curva continua de curvatura suave permanente. Debe dibujarse con trazo curvo uniforme.
ejemplos:
  - titulo: 'Puntos pivote en base 3'
    enunciado: '¿Cuáles son los tres puntos principales para graficar $f(x) = \log_3(x)$?'
    alternativas:
      - '$(1/3, -1)$, $(1, 0)$ y $(3, 1)$'
      - '$(0, 0)$, $(1, 3)$ y $(3, 3)$'
      - '$(3, 0)$, $(1, 1)$ y $(0, 3)$'
    respuesta: '$(1/3, -1)$, $(1, 0)$ y $(3, 1)$'
    solucion_pasos:
      - '1. Para $x = 1/3 \implies f(1/3) = -1$.'
      - '2. Para $x = 1 \implies f(1) = 0$.'
      - '3. Para $x = 3 \implies f(3) = 1$.'
  - titulo: 'Ubicación de la asíntota vertical'
    enunciado: '¿En qué recta se dibuja la asíntota vertical de $f(x) = \log(x)$?'
    respuesta: 'En la recta $x = 0$'
    solucion_pasos:
      - '1. La asíntota es el eje $y$, de ecuación cartesiana $x = 0$.'
  - titulo: 'Punto de altura 1 en logaritmo natural'
    enunciado: '¿La gráfica de $y = \ln(x)$ pasa por el punto $(e, 1) \approx (2.718, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\ln(e) = 1$, determinando el punto $(e, 1)$.'
  - titulo: 'Construcción por reflexión'
    enunciado: '¿Se puede graficar $y = \log_2(x)$ intercambiando las coordenadas $(x, y)$ de los puntos de la curva $y = 2^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como son funciones inversas, invierte los pares $(0, 1) \to (1, 0)$, $(1, 2) \to (2, 1)$, $(2, 4) \to (4, 2)$.'
errores_frecuentes:
  - 'Al graficar $f(x) = \log_2(x)$, la curva cruza al eje $y$ en el punto $(0, 1)$.'
  - 'Los puntos de la gráfica logarítmica deben unirse mediante segmentos rectos con esquinas marcadas.'
  - 'La gráfica de la función logarítmica mónica pasa por el origen de coordenadas $(0, 0)$.'
  - 'La asíntota vertical de la función logarítmica básica se dibuja como una línea horizontal.'
  - 'Graficar una función logarítmica con base decimal $b = 0.5$ produce una curva que sube hacia $+\infty$ a la derecha.'
afirmaciones_verdaderas:
  - 'La construcción de la gráfica logarítmica básica $f(x) = \log_b(x)$ se realiza utilizando los puntos pivote $(1/b, -1)$, $(1, 0)$ y $(b, 1)$ bordeando la asíntota vertical $x = 0$.'
  - 'La gráfica de la función logarítmica es la curva obtenida al reflejar la gráfica de la función exponencial correspondiente a través de la diagonal $y = x$.'
al_terminar_debes_poder: 'Bosquejar la gráfica de cualquier función logarítmica utilizando sus asíntotas y puntos nodales característicos.'
