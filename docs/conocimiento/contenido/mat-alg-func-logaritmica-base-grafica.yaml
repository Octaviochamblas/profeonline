semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.GRAFICA
resumen_inicial: 'Construcción de la gráfica de la función logarítmica según su base:
  conceptos, asíntotas, propiedades e inversidad en Análisis de la función logarítmica.'
explicacion_simple: Ya conoces por separado el dominio, la asíntota y el comportamiento
  creciente o decreciente de la función logarítmica. Ahora se combinan todas esas
  piezas en una sola curva.
explicacion_formal: '### Definición formal


  La gráfica de $f(x)=\log_b(x)$, con $b>0$ y $b\neq1$, es el conjunto de puntos $(x,\log_b(x))$
  con $x>0$. Se aproxima a la recta $x=0$ sin tocarla, corta el eje $x$ únicamente
  en $(1,0)$, y es estrictamente monótona (creciente si $b>1$, decreciente si $0<b<1$)
  en todo su dominio.


  ### Desarrollo didáctico


  Para trazar la curva de $f(x)=\log_2(x)$: se ubica la asíntota vertical en $x=0$;
  se marca el punto fijo $(1,0)$; se calculan puntos adicionales como $(2,1)$, $(4,2)$
  y $(0{,}5,-1)$; finalmente se une todo con una curva creciente que se aplana a medida
  que $x$ crece.'
definiciones_clave: '- **Construcción de la gráfica de la función logarítmica según
  su base**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a construcción de la gráfica de la función logarítmica según su base.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de construcción
    de la gráfica de la función logarítmica según su base.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de construcción de la gráfica
    de la función logarítmica según su base.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    construcción de la gráfica de la función logarítmica según su base?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en construcción de la gráfica de la función logarítmica según su base?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibuja la asíntota vertical en $x=0$ como línea guía (no forma parte de
  la curva).'
- 'Paso 2: Marca el punto fijo $(1,0)$, común a toda función logarítmica.'
- 'Paso 3: Calcula 2 o 3 puntos adicionales evaluando la función en valores de $x$
  mayores y menores que $1$.'
- 'Paso 4: Une los puntos con una curva suave, creciente si $b>1$ o decreciente si
  $0<b<1$, sin cruzar la asíntota.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en construcción
  de la gráfica de la función logarítmica según su base.
ejemplos:
- titulo: Trazado de $f(x)=\log_2(x)$
  enunciado: Describe los elementos clave para graficar $f(x)=\log_2(x)$.
  solucion_pasos:
  - Asíntota vertical en $x=0$, punto fijo $(1,0)$ y base $b=2>1$, por lo que la curva
    es creciente.
  - Puntos de apoyo: $(2,1)$, $(4,2)$ y $(0{,}5,-1)$.
- titulo: Trazado de $f(x)=\log_{0,5}(x)$
  enunciado: Describe los elementos clave para graficar $f(x)=\log_{0,5}(x)$.
  solucion_pasos:
  - Asíntota vertical en $x=0$, punto fijo $(1,0)$ y base $b=0{,}5<1$, por lo que
    la curva es decreciente.
  - Puntos de apoyo: $(2,-1)$, $(4,-2)$ y $(0{,}5,1)$.
- titulo: ¿La gráfica de toda función logarítmica pasa por el mismo punto fijo?
  enunciado: ¿Todas las funciones $f(x)=\log_b(x)$ pasan por el punto $(1,0)$ sin
    importar la base?
  respuesta: Sí
  solucion_pasos:
  - $\log_b(1)=0$ se cumple para cualquier base válida $b$.
- titulo: ¿La gráfica de la función logarítmica cruza la asíntota vertical?
  enunciado: ¿La curva de $f(x)=\log_b(x)$ llega a cruzar la asíntota vertical en
    algún punto?
  respuesta: 'No'
  solucion_pasos:
  - La asíntota vertical representa un límite que la curva se aproxima pero nunca
    alcanza.
errores_frecuentes:
- Dibujar la curva cruzando el eje $y$, ignorando la asíntota vertical.
- Olvidar marcar el punto fijo $(1,0)$ como referencia obligatoria.
- Trazar una curva creciente cuando $0<b<1$, invirtiendo la monotonía real.
- Extender la curva hacia valores de $x$ negativos o iguales a cero.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando construcción de la gráfica de la función logarítmica según su base.
