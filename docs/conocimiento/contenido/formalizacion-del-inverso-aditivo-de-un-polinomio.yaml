procedimiento:
- 'Paso 1: Dado un polinomio $P$, define $-P$ invirtiendo el signo de cada término.'
- 'Paso 2: Suma $P + (-P)$ para verificar que el resultado sea el polinomio cero.'
- 'Paso 3: Usa esta equivalencia para transformar cualquier sustracción en suma: $A
  - B = A + (-B)$.'
- 'Paso 4: Resuelve la suma resultante aplicando reducción de semejantes.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en formalización del inverso aditivo de un polinomio.
ejemplos:
- titulo: El neutralizador algebraico
  enunciado: Verifica que P = 2x - 3 es el inverso aditivo de Q = -2x + 3.
  solucion_pasos:
  - P + Q = (2x - 3) + (-2x + 3).
  - 'Familia x: 2x - 2x = 0.'
  - 'Constante: -3 + 3 = 0.'
  - 'Resultado: 0. Confirmado: son inversos aditivos.'
- titulo: En ingeniería de control, un sistema está en equilibrio cuando la señal
    de entrada $E$ y su
  enunciado: 'En ingeniería de control, un sistema está en equilibrio cuando la señal
    de entrada $E$ y su inverso aditivo se anulan. Si $E = 4v - 3w + 1$, ¿cuál debe
    ser la señal de contrarresto para lograr el equilibrio? (v1)


    Opciones: A) $-4v + 3w - 1$ · B) $4v - 3w + 1$ · C) $4v + 3w - 1$ · D) $-4v -
    3w - 1$'
  solucion_pasos:
  - 'El inverso aditivo de $E = 4v - 3w + 1$ es $-E = -4v + 3w - 1$. Verificamos:
    $E + (-E) = 0$.'
  - 'Respuesta: $-4v + 3w - 1$'
- titulo: 'Respecto de «Formalización del inverso aditivo de un polinomio»: ¿Se ajusta
    a la definición'
  enunciado: 'Respecto de «Formalización del inverso aditivo de un polinomio»: ¿Se
    ajusta a la definición esta afirmación? «El **Inverso Aditivo** de un polinomio
    $P$ es el polinomio $-P$ tal que $P + (-P) = 0$ (el polinomio cero)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Inverso Aditivo** de un
    polinomio $P$ es el polinomio $-P$ tal que $P + (-P) = 0$ (el polinomio cero).'
- titulo: 'Respecto de «Formalización del inverso aditivo de un polinomio»: ¿Es compatible
    con el proce'
  enunciado: 'Respecto de «Formalización del inverso aditivo de un polinomio»: ¿Es
    compatible con el procedimiento esta afirmación? «Confundir el inverso aditivo
    ($-P$, que suma y da cero) con el inverso multiplicativo ($\frac{1}{P}$, que multiplica
    y da uno)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Inverso Aditivo** de un
    polinomio $P$ es el polinomio $-P$ tal que $P + (-P) = 0$ (el polinomio cero).'
errores_frecuentes:
- Confundir el inverso aditivo ($-P$, que suma y da cero) con el inverso multiplicativo
  ($\frac{1}{P}$, que multiplica y da uno).
- Creer que el inverso aditivo solo existe para monomios, no para polinomios con múltiples
  términos.
- $-5x^2 + 3x - 8$ (el mismo).
- $\frac{1}{-5x^2+3x-8}$.
- $5x^2 + 3x + 8$.
afirmaciones_verdaderas:
- La reducción en formalización del inverso aditivo de un polinomio conserva los exponentes
  de la parte literal.
