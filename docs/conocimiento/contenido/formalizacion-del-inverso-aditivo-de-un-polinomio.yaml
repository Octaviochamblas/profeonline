resumen_inicial: La formalización del inverso aditivo de un polinomio aplica las reglas
  formales de la sustracción e inversión de signos en expresiones polinómicas.
explicacion_simple: Al trabajar con formalización del inverso aditivo de un polinomio,
  aseguramos cambiar correctamente los signos de todos los términos restados para
  obtener el resultado simplificado exacto.
explicacion_formal: 'Dados polinomios con la estructura dada, la **Formalización del
  inverso aditivo de un polinomio** establece:


  $$\text{"el inverso aditivo de P(x) = ax^2 + bx + c"} \implies -ax^2 - bx - c$$


  > **Complemento didáctico:** La formalización rigurosa previene equivocaciones estructurales
  al operar con inversos aditivos.'
definiciones_clave: '- **Formalización del inverso aditivo de un polinomio**: Aplicación
  exacta de las reglas de resta y supresión de signos sobre polinomios.'
propiedades_relaciones: '- **Distributividad del signo menos**: El operador $-$ afecta
  individualmente a cada sumando del bloque.'
ejemplo_guiado:
  enunciado: 'Efectúe la formalización del inverso aditivo de un polinomio para: ''el
    inverso aditivo de P(x) = ax^2 + bx + c''.'
  pasos:
  - 'Paso 1: Identificar el sustraendo o los términos a restar.'
  - 'Paso 2: Invertir el signo de todos los elementos involucrados.'
  - 'Paso 3: Reducir los términos semejantes.'
  - 'Conclusión: El resultado es -ax^2 - bx - c.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar formalización del inverso aditivo de
    un polinomio a 'el inverso aditivo de P(x) = ax^2 + bx + c'?
  choices:
  - text: -ax^2 - bx - c
    is_correct: true
  - text: ax^2 - bx + c
    is_correct: false
  - text: -ax^2 + bx - c
    is_correct: false
  - text: 1/P(x)
    is_correct: false
  explanation: La alternativa correcta es '-ax^2 - bx - c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el inverso aditivo de P(x) = ax^2 + bx + c',
    ¿qué expresión reducida se obtuvo?
  choices:
  - text: -ax^2 - bx - c
    is_correct: true
  - text: ax^2 - bx + c
    is_correct: false
  - text: -ax^2 + bx - c
    is_correct: false
  - text: 1/P(x)
    is_correct: false
  explanation: La alternativa correcta es '-ax^2 - bx - c'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar paréntesis al sustraendo.'
- 'Paso 2: Distribuir el signo menos invirtiendo cada signo.'
- 'Paso 3: Agrupar y reducir términos semejantes.'
errores_correccion: '- **Error 1: Invertir sólo parte de los signos en formalización
  del inverso aditivo de un polinomio.** **Cómo corregirlo:** Cambiar obligatoriamente
  los signos de todos los términos contenidos en el sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la solución correcta para formalización del inverso aditivo
    de un polinomio en 'el inverso aditivo de P(x) = ax^2 + bx + c'?
  alternativas:
  - -ax^2 - bx - c
  - ax^2 - bx + c
  - -ax^2 + bx - c
  - 1/P(x)
  respuesta: -ax^2 - bx - c
  solucion_pasos:
  - 1. Aplicar la inversión de signos.
  - 2. Obtener -ax^2 - bx - c.
- titulo: Ejemplo 2
  enunciado: Al simplificar 'el inverso aditivo de P(x) = ax^2 + bx + c' por formalización
    del inverso aditivo de un polinomio, ¿qué resultado se obtiene?
  alternativas:
  - -ax^2 - bx - c
  - ax^2 - bx + c
  - -ax^2 + bx - c
  - 1/P(x)
  respuesta: -ax^2 - bx - c
  solucion_pasos:
  - 1. Operar los coeficientes resultantes.
  - 2. Concluir -ax^2 - bx - c.
- titulo: ¿Es el resultado de la sustracción en 'el inverso aditivo de P(x) = ax^2
    + bx + c' igual a -ax^2 - bx - c?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando el cambio de signos se obtiene -ax^2 - bx - c.
- titulo: ¿Da la resta en 'el inverso aditivo de P(x) = ax^2 + bx + c' una diferencia
    igual a ax^2 - bx + c?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es -ax^2 - bx - c.
errores_frecuentes:
- Omitir la inversión de signo en términos secundarios en formalización del inverso
  aditivo de un polinomio.
- Sumar los exponentes al restar términos en formalización del inverso aditivo de
  un polinomio.
- Omitir encfallar el sustraendo entre paréntesis en formalización del inverso aditivo
  de un polinomio.
- Declarar el inverso aditivo de un polinomio con su recíproco multiplicativo.
- Declarar que restar un término negativo da como resultado un valor negativo.
afirmaciones_verdaderas:
- La formalización del inverso aditivo de un polinomio exige la distribución completa
  del signo negativo sobre todo el sustraendo.
- El inverso aditivo de un polinomio se forma cambiando el signo a cada uno de sus
  términos.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la formalización del
  inverso aditivo de un polinomio aplicando rigurosamente la regla del inverso aditivo
  sobre los términos restados.
