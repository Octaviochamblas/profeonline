semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_FORMULA
resumen_inicial: 'Determinación de paridad de una función desde su fórmula: conceptos,
  representación y propiedades en Simetrías y funciones especiales.'
explicacion_simple: No toda función es par ni impar; muchas simplemente no cumplen
  ninguna de las dos condiciones. El procedimiento algebraico revela cuál es el caso.
explicacion_formal: '### Definición formal


  Dada una función $f$, se calcula $f(-x)$ mediante sustitución algebraica. Si $f(-x)=f(x)$,
  la función es par. Si $f(-x)=-f(x)$, la función es impar. Si no se cumple ninguna
  de las dos igualdades, la función no es ni par ni impar.


  ### Desarrollo didáctico


  El proceso completo tiene tres posibles conclusiones, y es fundamental revisar ambas
  comparaciones antes de descartar totalmente la paridad.


  Si $f(x)=x^2+x$: $f(-x)=x^2-x$. Esto no coincide con $f(x)=x^2+x$ (no es par) ni
  con $-f(x)=-x^2-x$ (no es impar). Se concluye que no es ni par ni impar.'
definiciones_clave: '- **Determinación de paridad de una función desde su fórmula**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
