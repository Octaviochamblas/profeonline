semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_FORMULA
resumen_inicial: 'Para determinar analíticamente la paridad de $f(x)$ se calcula $f(-x)$
  y se clasifica en: Par si $f(-x)=f(x)$, Impar si $f(-x)=-f(x)$, o Sin Paridad si
  no cumple ninguna.'
explicacion_simple: "Para saber si una función cualquiera es **par, impar o sin paridad**\
  \ desde su fórmula:\n1. Reemplazamos cada $x$ por $(-x)$.\n2. Simplificamos la expresión.\n\
  3. Comparamos el resultado:\n   - Si da la MISMA función original $\\implies$ es\
  \ **PAR**.\n   - Si da la función original con TODOS los signos cambiados $\\implies$\
  \ es **IMPAR**.\n   - Si no da ninguna de las dos cosas $\\implies$ es **SIN PARIDAD**\
  \ (ni par ni impar)."
explicacion_formal: 'Dada $f: D \to \mathbb{R}$, el **algoritmo de paridad analítica**
  establece la tricotomía de paridad:


  $$\text{Clasificación} = \begin{cases} \text{PAR} & \iff f(-x) = f(x) \\ \text{IMPAR}
  & \iff f(-x) = -f(x) \\ \text{SIN PARIDAD} & \iff f(-x) \neq f(x) \quad \land \quad
  f(-x) \neq -f(x) \end{cases}$$


  **Desglose de la fórmula:**

  - La inmensa mayoría de las funciones arbitrarias reales no poseen paridad definida
  (son sin paridad).'
definiciones_clave: '- **Sin paridad (ni par ni impar)**: Función real que no satisface
  ninguna de las dos identidades de simetría.'
propiedades_relaciones: '- **Suma de funciones**: La suma de dos funciones pares es
  par; la suma de dos funciones impares es impar; pero la suma de una par y una impar
  no tiene paridad.'
ejemplo_guiado:
  enunciado: Determina la paridad de la función $f(x) = 2x + 3$.
  pasos:
  - 'Paso 1: Evaluar $f(-x) = 2(-x) + 3 = -2x + 3$.Paso 2: Comparar con $f(x) = 2x
    + 3$: no son iguales ($-2x + 3 \neq 2x + 3 \implies$ NO ES PAR).Paso 3: Comparar
    con $-f(x) = -(2x + 3) = -2x - 3$: no son iguales ($-2x + 3 \neq -2x - 3 \implies$
    NO ES IMPAR).Paso 4: Concluir que la función afín $f(x) = 2x + 3$ es SIN PARIDAD
    (ni par ni impar).'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $f(-x)$ en la función afín $f(x) = 2x + 3$, ¿cuál es la clasificación
    de su paridad?
  choices:
  - text: Es una función SIN PARIDAD (ni par ni impar).
    is_correct: true
  - text: Es una función par.
    is_correct: false
  - text: Es una función impar.
    is_correct: false
  - text: Es una función biyectiva par.
    is_correct: false
  explanation: La alternativa correcta es 'Es una función SIN PARIDAD (ni par ni impar).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre al evaluar $f(-x)$ en la función polinómica $f(x) = x^3 +
    x^2$?
  choices:
  - text: Como $f(-x) = -x^3 + x^2$, no es ni par ni impar (sin paridad).
    is_correct: true
  - text: Es estrictamente par.
    is_correct: false
  - text: Es estrictamente impar.
    is_correct: false
  - text: Se convierte en una recta.
    is_correct: false
  explanation: La alternativa correcta es 'Como $f(-x) = -x^3 + x^2$, no es ni par
    ni impar (sin paridad).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la expresión de $f(-x)$.'
- 'Paso 2: Calcular la expresión de $-f(x)$.'
- 'Paso 3: Comparar $f(-x)$ contra $f(x)$ y contra $-f(x)$.'
- 'Paso 4: Declarar ''Par'', ''Impar'' o ''Sin paridad''.'
errores_correccion: '- **Error común:** Creer que toda función en matemáticas debe
  ser obligatoriamente par o impar.

  - **Cómo corregirlo:** La gran mayoría de las funciones reales son ''sin paridad''
  (no cumplen ninguna de las dos condiciones).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
