semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_FORMULA
resumen_inicial: La determinación de paridad desde la fórmula analiza la respuesta algebraica al evaluar $f(-x)$ para clasificar la función como par, impar o sin paridad.
explicacion_simple: |
  Para determinar la paridad de una función desde su fórmula:

  1. Reemplazas cada $x$ por $(-x)$.
  2. Simplificas la expresión.
  3. Comparas la nueva expresión con la fórmula original $f(x)$:
     - **Si queda IDÉNTICA a $f(x)$** $\implies$ la función es **PAR**.
     - **Si queda EXACTAMENTE OPUESTA $-f(x)$** (con todos los signos cambiados) $\implies$ la función es **IMPAR**.
     - **Si no queda ni idéntica ni opuesta** $\implies$ la función **NO TIENE PARIDAD** (ni par ni impar).
explicacion_formal: |
  Dada la función $f(x)$ con dominio simétrico $D$, el algoritmo analítico de **determinación de paridad** evalúa la transformación $x \mapsto -x$:

  $$\text{Resultado de } f(-x) = \begin{cases} f(x) & \implies f \text{ es Par} \\ -f(x) & \implies f \text{ es Impar} \\ \text{otro} & \implies f \text{ no posee paridad} \end{cases}$$

  **Criterio polinómico rápido:**
  - Si un polinomio contiene **únicamente exponentes pares** en sus términos (incluyendo constantes $x^0$), es **Par**.
  - Si contiene **únicamente exponentes impares** sin término independiente constante, es **Impar**.
  - Si combina exponentes pares e impares, **no posee paridad**.
definiciones_clave: |
  - **Determinación analítica de paridad**: Clasificación de la simetría algebraica de una función mediante la sustitución $f(-x)$.
propiedades_relaciones: |
  - **Función nula**: La función constante $f(x) = 0$ es la única función matemática que es simultáneamente par e impar.
ejemplo_guiado:
  enunciado: 'Determina la paridad de las funciones: a) $f(x) = 5x^3 - x$, b) $g(x) = x^2 + 3x + 1$.'
  pasos:
    - 'Paso 1: Para $f(x)$, evaluar $f(-x) = 5(-x)^3 - (-x) = -5x^3 + x = -(5x^3 - x) = -f(x) \implies f$ es IMPAR.'
    - 'Paso 2: Para $g(x)$, evaluar $g(-x) = (-x)^2 + 3(-x) + 1 = x^2 - 3x + 1$.'
    - 'Paso 3: Comparar $g(-x)$ con $g(x) = x^2 + 3x + 1$ y $-g(x) = -x^2 - 3x - 1$.'
    - 'Paso 4: Como $g(-x) \neq g(x)$ y $g(-x) \neq -g(x)$, se concluye que $g(x)$ NO POSEE PARIDAD.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si al evaluar $f(-x)$ se obtiene una expresión distinta a $f(x)$ y distinta a $-f(x)$, ¿cuál es la conclusión?'
    choices:
      - {text: 'La función no posee paridad (ni par ni impar).', is_correct: true}
      - {text: 'La función es obligatoriamente par e impar a la vez.', is_correct: false}
      - {text: 'La función es una función constante.', is_correct: false}
      - {text: 'La función no está definida en los reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''La función no posee paridad (ni par ni impar).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué paridad presenta la función polinómica $g(x) = x^2 + 3x + 1$?'
    choices:
      - {text: 'No posee paridad.', is_correct: true}
      - {text: 'Es una función par.', is_correct: false}
      - {text: 'Es una función impar.', is_correct: false}
      - {text: 'Es una función lineal pura.', is_correct: false}
    explanation: 'La alternativa correcta es ''No posee paridad.''. Al evaluar $g(-x) = x^2 - 3x + 1$, no equivale a $g(x)$ ni a $-g(x)$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la expresión original de la función $f(x)$.'
  - 'Paso 2: Calcular $f(-x)$ sustituyendo cada $x$ por $(-x)$ y simplificando.'
  - 'Paso 3: Comparar la expresión simplificada con $f(x)$ y con $-f(x)$.'
  - 'Paso 4: Clasificar el resultado en: Par, Impar o Sin paridad.'
errores_correccion: |
  - **Error común:** Creer que toda función matemática debe ser obligatoriamente Par o Impar (falsa dicotomía).
  - **Cómo corregirlo:** La gran mayoría de las funciones arbitrarias **NO TIENEN PARIDAD** (no son ni pares ni impares).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Toda función matemática real debe ser obligatoriamente clasificada como par o como impar.'
  - 'Un polinomio que combina términos de grado 2 y grado 1 es una función par.'
  - 'Si una función tiene un término constante $b = 5$, entonces es una función impar.'
  - 'Evaluar $f(-x)$ equivale a multiplicar la función completa por el número $-1$.'
  - 'La paridad de una función cambia según el valor numérico $x$ que se elija para evaluar.'
afirmaciones_verdaderas:
  - 'La paridad analítica de una función se determina comparando $f(-x)$ con $f(x)$ (para paridad) y con $-f(x)$ (para imparidad).'
  - 'Existen funciones algebraicas que no satisfacen $f(-x) = f(x)$ ni $f(-x) = -f(x)$, perteneciendo a la categoría sin paridad.'
al_terminar_debes_poder: |
  QUÉ: Determinar analíticamente la paridad de una función a partir de su regla algebraica.
  CÓMO: Evaluar $f(-x)$, simplificar signos, comparar con $f(x)$ y $-f(x)$ y clasificar en Par, Impar o Sin paridad.
