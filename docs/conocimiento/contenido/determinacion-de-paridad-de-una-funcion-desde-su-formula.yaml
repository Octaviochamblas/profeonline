procedimiento:
- 'Paso 1: Calcula $f(-x)$ sustituyendo $-x$ en la fórmula.'
- 'Paso 2: Compara el resultado con $f(x)$; si coinciden, es par.'
- 'Paso 3: Si no coincide, compara con $-f(x)$; si coinciden, es impar.'
- 'Paso 4: Si no coincide con ninguna, la función no es ni par ni impar.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar determinación de paridad de una función desde su fórmula.
ejemplos:
- titulo: Determinación de función par
  enunciado: Determina la paridad de $f(x)=3x^4-2x^2$.
  solucion_pasos:
  - $f(-x)=3x^4-2x^2=f(x)$.
  - Es par.
- titulo: Determinación de función impar
  enunciado: Determina la paridad de $f(x)=7x^5-x$.
  solucion_pasos:
  - $f(-x)=-7x^5+x=-(7x^5-x)=-f(x)$.
  - Es impar.
- titulo: ¿Puede una función no ser ni par ni impar?
  enunciado: ¿Puede una función no ser ni par ni impar?
  respuesta: Sí
  solucion_pasos:
  - Muchas funciones, especialmente las que mezclan términos pares e impares con constantes,
    no cumplen ninguna de las dos condiciones.
- titulo: ¿La función constante distinta de cero es impar?
  enunciado: ¿La función constante distinta de cero es impar?
  respuesta: 'No'
  solucion_pasos:
  - $f(-x)=c$ pero $-f(x)=-c$, que solo coinciden si $c=0$; para $c\neq0$ no es impar
    (aunque sí es par).
errores_frecuentes:
- Concluir imparidad al observar solo exponentes impares, sin comparar formalmente
  con $-f(x)$.
- Detenerse tras descartar paridad sin verificar la posibilidad de imparidad.
- Cometer errores de signo al calcular $f(-x)$ en términos con exponentes impares.
- Confundir "no es par" con "es impar", cuando en realidad puede no ser ninguna de
  las dos.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando determinación
