semantic_id: MAT.GEO.MEDICION_ANGULAR.MINUTOS_SEGUNDOS
resumen_inicial: El grado sexagesimal se subdivide en 60 minutos angulares (60') y
  cada minuto se subdivide en 60 segundos angulares (60''), de forma análoga a la
  medición del tiempo.
explicacion_simple: '![Minutos y Segundos Sexagesimales](/static/img/nodos/subunidades-sexagesimales-del-grado-minutos-y-segundos-angulares-intro.svg)


  Así como 1 hora tiene 60 minutos y 1 minuto tiene 60 segundos, en geometría $1^\circ$
  tiene $60$ minutos angulares ($60''$) y cada minuto tiene $60$ segundos angulares
  ($60''''$). Esto permite medir ángulos con extrema precisión (usado en navegación
  y astronomía).'
explicacion_formal: '### Definición formal

  Para mediciones de alta precisión, el grado sexagesimal se subdivide en base 60
  en **minutos angulares** ($''$) y **segundos angulares** ($''''$):


  $$1^\circ = 60'' \quad (\text{minutos}) \quad \land \quad 1'' = 60'''' \quad (\text{segundos})
  \implies 1^\circ = 3.600''''$$


  ### Desglose simbólico y geométrico

  - $'' $: Símbolo de minuto sexagesimal ($1'' = \frac{1}{60}^\circ$).

  - $''''$: Símbolo de segundo sexagesimal ($1'''' = \frac{1}{3600}^\circ$).

  - Notación compuesta: $D^\circ \, M'' \, S'''' = D + \frac{M}{60} + \frac{S}{3600}$
  grados decimales.


  ### Síntesis didáctica

  Las subunidades sexagesimales permiten expresar coordenadas geográficas (latitud/longitud)
  y mediciones astronómicas con precisión milimétrica.'
definiciones_clave: '- **Minuto angular ($1''$)**: $1/60$ de grado sexagesimal.

  - **Segundo angular ($1''''$)**: $1/60$ de minuto o $1/3600$ de grado sexagesimal. '
propiedades_relaciones: '- **Relación multiplicativa**: Para pasar de grados a minutos
  se multiplica por 60; de minutos a segundos por 60; de grados a segundos por 3600.

  - **Relación divisiva**: Para pasar de segundos a minutos se divide por 60; de minutos
  a grados se divide por 60. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Minutos y Segundos](/static/img/nodos/subunidades-sexagesimales-del-grado-minutos-y-segundos-angulares-ejemplos.svg)


    Un astrónomo registra una desviación angular de $4^\circ 15''$. ¿Cuántos minutos
    angulares en total representa este ángulo?'
  pasos:
  - 'Paso 1: Identificar los grados enteros: $4^\circ$.'
  - 'Paso 2: Convertir los $4^\circ$ a minutos multiplicando por 60: $4 \times 60''
    = 240''$.'
  - 'Paso 3: Sumar los $15''$ adicionales: $240'' + 15'' = 255''$.'
  - 'Paso 4: Concluir que el ángulo total equivale a $255''$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos segundos angulares hay en 1 grado sexagesimal?
  choices:
  - text: 3600 segundos angulares (porque 60 × 60 = 3600)
    is_correct: true
  - text: 60 segundos angulares
    is_correct: false
  - text: 100 segundos angulares
    is_correct: false
  - text: 360 segundos angulares
    is_correct: false
  explanation: Cada grado tiene 60 minutos y cada minuto 60 segundos, por lo que 1°
    = 3600 segundos angulares (porque 60 × 60 = 3600).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos minutos angulares equivalen 5 grados sexagesimales?
  choices:
  - text: 300 minutos angulares (porque 5 × 60 = 300)
    is_correct: true
  - text: 500 minutos angulares
    is_correct: false
  - text: 50 minutos angulares
    is_correct: false
  - text: 150 minutos angulares
    is_correct: false
  explanation: Multiplicando 5 por 60 se obtienen 300 minutos angulares (porque 5
    × 60 = 300).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si se requiere convertir hacia una unidad menor (multiplicar
  por 60) o mayor (dividir por 60).'
- 'Paso 2: Aplicar los factores: $\times 60$ para grado $\to$ minuto y minuto $\to$
  segundo; $\times 3600$ para grado $\to$ segundo.'
- 'Paso 3: Sumar o restar las unidades compuestas según corresponda.'
errores_correccion: Recuerda que 1 grado equivale a 60 minutos (no a 100) y a 3600
  segundos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos minutos angulares equivalen a $2{,}5^\circ$?
  alternativas:
  - $150'$
  - $250'$
  - $120'$
  respuesta: $150'$
  solucion_pasos:
  - $2{,}5 \times 60' = 150'$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos grados equivalen a $180'$?
  alternativas:
  - $3^\circ$
  - $2^\circ$
  - $6^\circ$
  respuesta: $3^\circ$
  solucion_pasos:
  - $\frac{180'}{60} = 3^\circ$.
- titulo: ¿Un minuto angular equivale a 60 segundos angulares?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición sexagesimal $1' = 60''$.
- titulo: ¿Un grado sexagesimal tiene 100 minutos angulares?
  respuesta: 'No'
  solucion_pasos:
  - No, tiene exactamente 60 minutos angulares (base 60).
errores_frecuentes:
- Multiplicar por 100 creyendo que el sistema es decimal.
- Confundir la simbología de minutos ($'$) y segundos ($''$).
- Olvidar que $1^\circ = 3600''$.
- Sumar minutos directamente a grados sin convertir previamente.
- No reagrupar los minutos al superar $60'$.
afirmaciones_verdaderas:
- $1^\circ = 60'$ y $1' = 60''$.
- $1^\circ = 3600''$.
al_terminar_debes_poder: '**QUÉ:** Manejar con fluidez las subunidades de minutos
  y segundos angulares en el sistema sexagesimal.


  **CÓMO:** Aplicando conversiones directas con factores de 60 y 3600 entre grados,
  minutos y segundos.


  ![Resumen de Minutos y Segundos](/static/img/nodos/subunidades-sexagesimales-del-grado-minutos-y-segundos-angulares-resumen.svg)'
