ejemplo_guiado:
  enunciado: Para analizar demostración geométrica de la ley de cosenos mediante descomposición
    del triángulo, considera un ángulo $\alpha = 12^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1143^\circ =
    12^\circ$.
  pasos:
  - Identificar la propiedad de demostración geométrica de la ley de cosenos mediante
    descomposición del triángulo referida a $\alpha = 12^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1143 = 12 \implies x = 12 - 1143$.'
  - Concluir que la medida calculada para demostración geométrica de la ley de cosenos
    mediante descomposición del triángulo es $x = -1131^\circ$.
