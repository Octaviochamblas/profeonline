semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.DEMOSTRACION_LEY_COSENOS
resumen_inicial: 'Demostración geométrica de la ley de cosenos mediante descomposición
  del triángulo: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  Ampliada.'
explicacion_simple: Al trazar la altura desde un vértice, el lado opuesto queda dividido
  en dos segmentos, y aplicando Pitágoras a ambos triángulos rectángulos se puede
  deducir algebraicamente la ley de cosenos.
explicacion_formal: '![Demostración de la ley de cosenos](/static/img/geometria/trigonometria/oblicu-demostracion-ley-cosenos.svg)


  ### Definición formal


  Sea $H$ el pie de la altura desde $C$. En el triángulo $ACH$, $AH=b\cos A$ y $CH=b\sin
  A$. Como $HB=c-b\cos A$, aplicando Pitágoras en el triángulo $BCH$: $a^2=CH^2+HB^2=(b\sin
  A)^2+(c-b\cos A)^2$. Expandiendo: $a^2=b^2\sin^2A+c^2-2bc\cos A+b^2\cos^2A=b^2(\sin^2A+\cos^2A)+c^2-2bc\cos
  A=b^2+c^2-2bc\cos A$.


  ### Desarrollo didáctico


  Esta demostración combina la altura de un triángulo, el teorema de Pitágoras y la
  identidad pitagórica $\sin^2A+\cos^2A=1$, mostrando que la ley de cosenos surge
  naturalmente de estas tres herramientas básicas.'
definiciones_clave: '- **Demostración geométrica de la ley de cosenos mediante descomposición
