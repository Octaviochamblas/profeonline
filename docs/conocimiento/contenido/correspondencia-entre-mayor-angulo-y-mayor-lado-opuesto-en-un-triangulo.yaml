semantic_id: MAT.GEO.TRIANGULOS_METRICA.ANGULO_MAYOR_LADO_MAYOR
resumen_inicial: En todo triángulo euclidiano, al ángulo interior de mayor medida
  se opone el lado de mayor longitud, y en general, el orden de las medidas angulares
  determina el orden de las longitudes de sus lados opuestos.
explicacion_simple: '![Mayor Ángulo a Mayor Lado](/static/img/nodos/correspondencia-entre-mayor-angulo-y-mayor-lado-opuesto-en-un-triangulo-intro.svg)


  Imagina una tijera o una puerta: cuanto más abres el ángulo de la esquina, **más
  se separan los extremos y más largo se vuelve el lado que queda al frente**. Por
  eso, en cualquier triángulo, **la esquina más abierta (mayor ángulo) siempre tiene
  enfrente al lado más largo**.'
explicacion_formal: '### Teorema formal (Euclides I.18)

  En cualquier triángulo $\Delta ABC$, a mayor medida de un ángulo interior se opone
  estrictamente un lado de mayor longitud:


  $$\alpha > \beta \iff a > b$$


  $$\alpha > \beta > \gamma \iff a > b > c$$


  ### Desglose simbólico y geométrico

  - Monotonía estricta: El orden de las medidas angulares se traslada fielmente al
  orden de las longitudes de los lados opuestos.

  - Demostración por la Ley de Senos: $\frac{a}{\sin \alpha} = \frac{b}{\sin \beta}
  = 2R$. Como el seno es estrictamente creciente en $(0, \pi/2]$, a mayor abertura
  angular corresponde mayor cuerda o lado opuesto.


  ### Síntesis didáctica

  El principio de correspondencia ángulo-lado permite ordenar los lados de un triángulo
  conociendo únicamente el orden de sus ángulos interiores.'
definiciones_clave: '- **Teorema ángulo-lado**: Al mayor ángulo interior se opone
  el lado de mayor longitud.

  - **Lado opuesto**: Segmento que no contiene al vértice del ángulo considerado.

  - **Monotonía de correspondencia**: El orden $\alpha \ge \beta \ge \gamma$ se preserva
  en $a \ge b \ge c$. '
propiedades_relaciones: '- **Caso del triángulo rectángulo**: Como el ángulo de $90^\circ$
  es el mayor de los tres ángulos en un triángulo rectángulo, la hipotenusa (opuesta
  a $90^\circ$) es siempre el lado más largo.

  - **Caso del triángulo obtusángulo**: El lado opuesto al ángulo obtuso ($> 90^\circ$)
  es siempre el lado más largo de la figura. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Correspondencia Ángulo-Lado](/static/img/nodos/correspondencia-entre-mayor-angulo-y-mayor-lado-opuesto-en-un-triangulo-ejemplos.svg)


    En un triángulo $\triangle ABC$, los ángulos interiores miden $\angle A = 75^\circ$
    y $\angle B = 65^\circ$. Determina cuál es el lado más largo y cuál es el lado
    más corto del triángulo.'
  pasos:
  - 'Paso 1: Calcular el tercer ángulo interior: $\angle C = 180^\circ - (75^\circ
    + 65^\circ) = 180^\circ - 140^\circ = 40^\circ$.'
  - 'Paso 2: Ordenar los tres ángulos de mayor a menor: $\angle A (75^\circ) > \angle
    B (65^\circ) > \angle C (40^\circ)$.'
  - 'Paso 3: Identificar los lados opuestos: frente a $\angle A$ está el lado $\overline{BC}$
    ($a$); frente a $\angle B$ está $\overline{AC}$ ($b$); frente a $\angle C$ está
    $\overline{AB}$ ($c$).'
  - 'Paso 4: Aplicar el teorema de correspondencia: $\overline{BC} > \overline{AC}
    > \overline{AB}$.'
  - 'Paso 5: Concluir que el lado más largo es $\overline{BC}$ y el lado más corto
    es $\overline{AB}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un triángulo con ángulos interiores de 80°, 60° y 40°, ¿dónde se ubica
    el lado más largo?
  choices:
  - text: Justo enfrente del ángulo de 80° (lado opuesto al mayor ángulo)
    is_correct: true
  - text: Justo enfrente del ángulo de 40°
    is_correct: false
  - text: Al lado del ángulo de 80°
    is_correct: false
  - text: Los tres lados miden lo mismo
    is_correct: false
  explanation: Por el teorema de correspondencia, el lado más largo se ubica justo
    enfrente del ángulo de 80° (lado opuesto al mayor ángulo).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en el triángulo PQR los ángulos son P = 30°, Q = 110° y R = 40°, ¿cuál
    es el lado más corto?
  choices:
  - text: El lado QR (opuesto al menor ángulo P = 30°)
    is_correct: true
  - text: El lado PR (opuesto a Q = 110°)
    is_correct: false
  - text: El lado PQ (opuesto a R = 40°)
    is_correct: false
  - text: Todos los lados son iguales
    is_correct: false
  explanation: Al menor ángulo P = 30° se opone el lado QR (opuesto al menor ángulo
    P = 30°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular los tres ángulos interiores del triángulo.'
- 'Paso 2: Ordenar los ángulos de mayor a menor.'
- 'Paso 3: Identificar el lado opuesto a cada vértice.'
- 'Paso 4: Asignar el orden correspondiente a los lados: al mayor ángulo le corresponde
  el mayor lado opuesto.'
errores_correccion: 'No confundas el lado opuesto con los lados que tocan al ángulo:
  el lado opuesto está enfrente, sin tocar el vértice.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo rectángulo con ángulos agudos de $30^\circ$ y $60^\circ$,
    ¿cuál es el orden de los lados de menor a mayor?
  alternativas:
  - $\text{Opuesto a } 30^\circ < \text{Opuesto a } 60^\circ < \text{Hipotenusa}$
  - $\text{Hipotenusa} < \text{Opuesto a } 60^\circ < \text{Opuesto a } 30^\circ$
  - $\text{Opuesto a } 60^\circ < \text{Opuesto a } 30^\circ < \text{Hipotenusa}$
  respuesta: $\text{Opuesto a } 30^\circ < \text{Opuesto a } 60^\circ < \text{Hipotenusa}$
  solucion_pasos:
  - Como $30^\circ < 60^\circ < 90^\circ$, los lados opuestos siguen estrictamente
    ese mismo orden.
- titulo: Ejemplo 2
  enunciado: Si $\angle A = 50^\circ$ y $\angle B = 70^\circ$, ¿cuál segmento es mayor
    entre $\overline{BC}$ (opuesto a $A$) y $\overline{AC}$ (opuesto a $B$)?
  alternativas:
  - $\overline{AC} > \overline{BC}$
  - $\overline{BC} > \overline{AC}$
  - $\overline{BC} = \overline{AC}$
  respuesta: $\overline{AC} > \overline{BC}$
  solucion_pasos:
  - Como $\angle B = 70^\circ > \angle A = 50^\circ$, su lado opuesto $\overline{AC}$
    es mayor que $\overline{BC}$.
- titulo: ¿Al ángulo de 90° de un triángulo rectángulo se le opone el lado más largo?
  respuesta: Sí
  solucion_pasos:
  - Sí, la hipotenusa está frente a 90° y es el lado mayor.
- titulo: ¿Al menor ángulo de un triángulo se le opone el lado más largo?
  respuesta: 'No'
  solucion_pasos:
  - No, al menor ángulo se le opone el lado más corto.
errores_frecuentes:
- Confundir el lado opuesto con los lados adyacentes.
- Ordenar los lados fijándose solo en dos ángulos sin calcular el tercero.
- Pensar que en un triángulo escaleno el lado más largo puede estar frente al ángulo
  menor.
- Asumir que la relación es directamente proporcional lineal (el doble de ángulo no
  implica el doble de lado, solo mayor).
- Olvidar que si dos ángulos son iguales sus lados opuestos son iguales.
afirmaciones_verdaderas:
- Al ángulo de mayor medida en un triángulo siempre se le opone el lado de mayor longitud.
- En un triángulo rectángulo la hipotenusa es el lado mayor porque está opuesta al
  ángulo recto de $90^\circ$.
al_terminar_debes_poder: '**QUÉ:** Ordenar y comparar lados de un triángulo a partir
  de sus ángulos interiores.


  **CÓMO:** Aplicando el teorema de correspondencia al relacionar cada ángulo con
  su lado opuesto ($\alpha > \beta \implies a > b$).


  ![Resumen de Correspondencia Ángulo-Lado](/static/img/nodos/correspondencia-entre-mayor-angulo-y-mayor-lado-opuesto-en-un-triangulo-resumen.svg)'
