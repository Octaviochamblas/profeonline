semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.DECIMAL_SEMIPERIODICO
resumen_inicial: "Un decimal infinito semiperiódico es aquel número racional cuya parte decimal contiene una o más cifras que no se repiten (anteperíodo) seguidas de un bloque de cifras que se repite indefinidamente (período)."
explicacion_simple: |
  Un **decimal infinito semiperiódico** es una combinación entre un decimal finito y uno periódico. Después de la coma hay una zona 'fija' de cifras que no se repiten (llamada **anteperíodo**), y justo después comienza la zona con cifras que se repiten para siempre (llamada **período**). Por ejemplo, en $0.16666\dots = 0.1\overline{6}$, el $1$ es el anteperíodo y el $6$ es el período.
explicacion_formal: |
  Formalmente, un **número decimal infinito semiperiódico** es un desarrollo de la forma:
  $$d = a_k \dots a_0 , a_1' a_2' \dots a_n' \overline{p_1 p_2 \dots p_m}$$
  donde $A = a_1' a_2' \dots a_n'$ es una secuencia finita de $n \ge 1$ dígitos que no se repite (**anteperíodo**) y $P = p_1 \dots p_m$ es el **período** de $m \ge 1$ dígitos repetidos infinitamente.

  Criterio de existencia fraccionaria: una fracción irreductible $\frac{a}{b} \in \mathbb{Q}$ origina un decimal semiperiódico si y solo si su denominador $b$ contiene en su descomposición prima a $2$ y/o $5$, Y ADEMÁS a al menos otro factor primo diferente de $2$ y $5$ (como $3, 7, 11$, etc.):
  $$b = 2^{\alpha} \cdot 5^{\beta} \cdot k, \quad \text{con } \alpha + \beta \ge 1 \text{ y } \text{MCD}(k, 10) = 1 \text{ con } k > 1$$
definiciones_clave: |
  - **Decimal semiperiódico**: Número con parte decimal mixta formada por anteperíodo seguido de período.
  - **Anteperíodo**: Cifras decimales ubicadas entre la coma y el período que no forman parte de la repetición.
  - **Período**: Cifras decimales bajo la barra que se repiten de forma ilimitada.
propiedades_relaciones: |
  - **Regla de conversión a fracción (Nueves y Ceros)**: El numerador es igual al número completo sin coma menos todo lo que está antes del período (parte entera y anteperíodo). El denominador consta de tantos nueves como cifras tenga el período, seguidos de tantos ceros como cifras tenga el anteperíodo.
  - **Demostración algebraica de restas de ecuaciones**: Se multiplica por $10^{n+m}$ y por $10^n$, restando ambas expresiones para eliminar el período.
  - **Pertenece a $\mathbb{Q}$**: Es la tercera forma válida de representación de números racionales en formato decimal.
ejemplo_guiado:
  enunciado: 'Convierte el decimal semiperiódico $0.1\overline{6}$ a fracción irreductible utilizando la regla de los nueves y ceros, y mediante la demostración algebraica por ecuaciones.'
  pasos:
    - "Identificar partes: anteperíodo $1$ (1 cifra), período $6$ (1 cifra)."
    - "Método 1 (Regla): Numerador = todo sin coma menos no periódico = $16 - 1 = 15$."
    - "Denominador = 1 nueve (por período 6) y 1 cero (por anteperíodo 1) = $90$."
    - "Formar la fracción y simplificar: $\\frac{15}{90} = \\frac{15 \\div 15}{90 \\div 15} = \\frac{1}{6}$."
    - "Método 2 (Algebraico): Sea $x = 0.16666\\dots$"
    - "Multiplicar por $100$: $100x = 16.6666\\dots$"
    - "Multiplicar por $10$: $10x = 1.6666\\dots$"
    - "Restar ecuaciones: $100x - 10x = 16.6666\\dots - 1.6666\\dots \\implies 90x = 15 \\implies x = \\frac{15}{90} = \\frac{1}{6}$."
    - "Concluir: en ambos métodos el resultado es $\\frac{1}{6}$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué elementos componen la parte decimal de un número decimal semiperiódico?"
    choices:
      - {text: "Un anteperíodo (cifras fijas) seguido de un período (cifras que se repiten infinitamente).", is_correct: true}
      - {text: "Solo cifras finitas que terminan en cero.", is_correct: false}
      - {text: "Únicamente cifras bajo la barrita de período desde la coma.", is_correct: false}
      - {text: "Solo ceros y nueves.", is_correct: false}
    explanation: "La correcta es Un anteperíodo (cifras fijas) seguido de un período (cifras que se repiten infinitamente).: define la estructura mixta del desarrollo semiperiódico."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la fracción irreductible correspondiente al decimal semiperiódico $0.2\overline{3}$?'
    choices:
      - {text: "$\\frac{7}{30}$", is_correct: true}
      - {text: "$\\frac{23}{90}$", is_correct: false}
      - {text: "$\\frac{21}{90}$", is_correct: false}
      - {text: "$\\frac{23}{99}$", is_correct: false}
    explanation: "La correcta es \\frac{7}{30}: Numerador $= 23 - 2 = 21$. Denominador $= 90$. Fracción $= \\frac{21}{90} = \\frac{7}{30}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el anteperíodo (cifras entre la coma y la barra) y contar sus dígitos $n$."
  - "Paso 2: Identificar el período (cifras bajo la barra) y contar sus dígitos $m$."
  - "Paso 3: Construir el numerador restando al número completo (sin coma) toda la parte no periódica (entero + anteperíodo)."
  - 'Paso 4: Construir el denominador escribiendo $m$ nueves seguidos de $n$ ceros ($99\dots00\dots$).'
  - "Paso 5: Simplificar la fracción resultante a su forma irreductible."
errores_correccion: |
  Un error muy frecuente al armar el denominador es invertir el orden de los nueves y ceros (poner los ceros antes que los nueves, por ejemplo $090$ o $009$). Recuerda siempre la regla nemotécnica: **LOS NUEVES VAN PRIMERO y los ceros van después a la derecha** ($90$, $990$, $900$, etc.).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: 'Convierte el decimal semiperiódico $1.2\overline{4}$ a fracción irreductible.'
    alternativas:
      - "$\\frac{56}{45}$"
      - "$\\frac{112}{90}$"
      - "$\\frac{124}{99}$"
    respuesta: "$\\frac{56}{45}$"
    solucion_pasos:
      - "Numerador: $124 - 12 = 112$."
      - "Denominador: $1$ nueve y $1$ cero $= 90$."
      - "Fracción: $\\frac{112}{90} = \\frac{56}{45}$."
  - titulo: "Ejemplo 2"
    enunciado: "¿Qué tipo de decimal genera la fracción $\\frac{7}{60}$?"
    alternativas:
      - "Decimal infinito semiperiódico."
      - "Decimal finito."
      - "Decimal infinito periódico puro."
    respuesta: "Decimal infinito semiperiódico."
    solucion_pasos:
      - "Factorizar denominador $60 = 2^2 \\cdot 3 \\cdot 5$."
      - "Tiene los factores $2$ y $5$ (que generan anteperíodo) y el factor $3$ (que genera período)."
      - 'Por lo tanto, es un decimal semiperiódico ($0.11666\dots = 0.11\overline{6}$).'
  - titulo: '¿Tiene el decimal $0.05\overline{2}$ un anteperíodo de 2 cifras?'
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, el anteperíodo comprende los dígitos $05$ (dos cifras no repetidas tras la coma)."
  - titulo: "¿Es todo decimal semiperiódico un número racional?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, se puede representar exactamente como un cociente entre enteros de la forma $\frac{a}{b} \in \mathbb{Q}$.'
errores_frecuentes:
  - "Poner ceros antes que los nueves en el denominador."
  - "Olvidar restar la parte no periódica en el numerador."
  - "Confundir las cifras del anteperíodo con las cifras de la parte entera al contar los ceros del denominador."
  - "No simplificar la fracción resultante."
  - "Pensar que los ceros del anteperíodo no cuentan al determinar la cantidad de ceros en el denominador."
afirmaciones_verdaderas:
  - "Un decimal infinito semiperiódico posee anteperíodo no repetido entre la coma y el período."
  - "La conversión de un decimal semiperiódico a fracción requiere colocar en el denominador nueves por el período seguidos de ceros por el anteperíodo."
al_terminar_debes_ponder: |
  Debes ser capaz de reconocer decimales semiperiódicos, aplicar la fórmula con nueves y ceros y convertirlos a fracciones irreductibles en $\mathbb{Q}$.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
