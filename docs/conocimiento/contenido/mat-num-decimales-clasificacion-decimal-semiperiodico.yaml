semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.DECIMAL_SEMIPERIODICO
resumen_inicial: 'Un decimal infinito semiperiódico posee una parte no repetitiva (anteperíodo) entre la coma y el comienzo del bloque repetitivo (período): $a_0, a_1 \dots a_m \overline{p_1 \dots p_k}$.'
explicacion_simple: 'Un decimal semiperiódico es un número decimal infinito donde después de la coma hay algunos números que NO se repiten (llamados anteperíodo), y luego viene un grupo de números que SÍ se repiten para siempre con barra (llamados período).


  ![Identificación de decimal infinito semiperiódico](/static/img/nodos/identificacion-de-decimal-infinito-semiperiodico-intro.svg)'
explicacion_formal: 'Un racional $d \in \mathbb{Q}$ es un **Decimal Infinito Semiperiódico** si su desarrollo adopta la forma:


  $$d = a_0, c_1 c_2 \dots c_m \overline{p_1 p_2 \dots p_k}$$


  **Desglose de la fórmula:**

  - $c_1 c_2 \dots c_m$: Anteperíodo de $m$ dígitos no repetitivos ubicado inmediatamente tras la coma.

  - $\overline{p_1 p_2 \dots p_k}$: Período de $k$ dígitos repetitivos infintamente con barra superior.

  - Criterio de fracción irreductible: $\frac{a}{b}$ es semiperiódico $\iff$ el denominador $b$ tiene al menos un factor de $\{2,5\}$ Y al menos un factor ajeno a $\{2,5\}$.


  > **Complemento didáctico:** El denominador de su fracción generatriz se compone de nueves (por el período) seguidos de ceros (por el anteperíodo).'
definiciones_clave: '- **Decimal infinito semiperiódico**: Número con parte decimal mixta compuesta por anteperíodo no repetitivo y período repetitivo con barra.'
propiedades_relaciones: '- **Estructura Mixta**: Combina anteperíodo (cifras fijas) y período (cifras con barra).'
ejemplo_guiado:
  enunciado: 'Clasifique el número decimal $0,1666... = 0,1\overline{6}$ e identifique sus partes.


    ![Ejemplo Identificación de decimal infinito semiperiódico](/static/img/nodos/identificacion-de-decimal-infinito-semiperiodico-ejemplos.svg)'
  pasos:
  - 'Paso 1: Analizar los dígitos a la derecha de la coma.'
  - 'Paso 2: Identificar el dígito no repetitivo: la cifra $1$ justo tras la coma es el anteperíodo.'
  - 'Paso 3: Identificar la cifra repetitiva con barra: la cifra $6$ bajo la barra $\overline{6}$ es el período.'
  - 'Conclusión: Es un decimal infinito semiperiódico con anteperíodo $1$ y período $6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué elementos componen la parte decimal de un número semiperiódico?
  choices:
  - text: Un anteperíodo (cifras no repetidas) seguido de un período (cifras repetidas con barra)
    is_correct: true
  - text: Únicamente cifras repetidas sin anteperíodo
    is_correct: false
  - text: Solo ceros y unos
    is_correct: false
  - text: Una cantidad finita de tres dígitos sin repetición
    is_correct: false
  explanation: La alternativa correcta es 'Un anteperíodo (cifras no repetidas) seguido de un período (cifras repetidas con barra)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "En el ejemplo guiado para 0,1666... = 0,1\bar{6}, ¿cuáles fueron sus componentes?"
  choices:
  - text: Anteperíodo 1 y Período 6
    is_correct: true
  - text: Anteperíodo 6 y Período 1
    is_correct: false
  - text: Período 16
    is_correct: false
  - text: Es decimal finito
    is_correct: false
  explanation: La alternativa correcta es 'Anteperíodo 1 y Período 6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar la parte decimal después de la coma.'
- 'Paso 2: Identificar las cifras que no se repiten inmediatamente a la derecha de la coma (anteperíodo).'
- 'Paso 3: Identificar las cifras repetitivas bajo la barra (período) y clasificar como decimal semiperiódico.'
errores_correccion: '- **Error 1: Colocar la barra del período sobre el anteperíodo.** **Cómo corregirlo:** La barra DEBE cubrir únicamente los dígitos que se repiten al infinito.


  - **Error 2: Pensar que el anteperíodo forma parte del número entero.** **Cómo corregirlo:** El anteperíodo se ubica A LA DERECHA de la coma decimal.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Clasifique el decimal 2,458888... = 2,45\overline{8}.
  alternativas:
  - Decimal infinito semiperiódico
  - Decimal finito
  - Decimal periódico puro
  respuesta: Decimal infinito semiperiódico
  solucion_pasos:
  - Tiene anteperíodo $45$ y período $8 \implies$ semiperiódico.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de decimal genera la fracción 7/15?
  alternativas:
  - Decimal semiperiódico (0,4666... = 0,4\overline{6})
  - Decimal finito
  - Decimal periódico puro
  respuesta: Decimal semiperiódico (0,4666... = 0,4\overline{6})
  solucion_pasos:
  - $15 = 3 \cdot 5 \implies$ al tener el factor 5 y el factor 3 genera un semiperiódico ($0,4\overline{6}$).
- titulo: ¿Es 0,12333... un decimal semiperiódico?
  respuesta: Sí
  solucion_pasos:
  - Sí, anteperíodo $12$ y período $3$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
- titulo: ¿Es 0,555... un decimal semiperiódico?
  respuesta: 'No'
  solucion_pasos:
  - No, es periódico puro porque no tiene anteperíodo.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
errores_frecuentes:
- Un decimal semiperiódico es un número que carece de parte periódica con barra.
- El anteperíodo en un decimal semiperiódico se encuentra situado a la izquierda de la coma.
- Colocar la barra del período sobre las cifras del anteperíodo no altera la clasificación.
- Los decimales semiperiódicos son números irracionales incompatibles con las fracciones.
- Un decimal con un solo dígito decimal no repetido es siempre un decimal finito.
afirmaciones_verdaderas:
- Un decimal semiperiódico contiene cifras decimales no repetitivas (anteperíodo) antes del período.
- Todos los decimales semiperiódicos representan números racionales expresables como fracción.
al_terminar_debes_poder: '**QUÉ:** Distinguir y clasificar números decimales infinitos semiperiódicos.


  **CÓMO:** Identificando la presencia de un anteperíodo $a_1 \dots a_m$ situado entre la coma y el período $E.a_1 \dots a_m \overline{p_1 \dots p_k}$, o verificando que el denominador de su fracción irreducible contenga factores de $2$ o $5$ combinados con otros números primos.


  ![Resumen Identificación de decimal infinito semiperiódico](/static/img/nodos/identificacion-de-decimal-infinito-semiperiodico-resumen.svg)'
