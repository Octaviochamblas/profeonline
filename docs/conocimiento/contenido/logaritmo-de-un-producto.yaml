semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.PRODUCTO
resumen_inicial: El logaritmo de un producto es igual a la suma de los logaritmos de los factores
  en la misma base ($\log_b(x \cdot y) = \log_b(x) + \log_b(y)$).
explicacion_simple: 'Cuando tienes la multiplicación de dos números dentro de un logaritmo,
  puedes separarla en la **suma** de dos logaritmos individuales:

  $$\log_2(4 \cdot 8) = \log_2(4) + \log_2(8) = 2 + 3 = 5$$

  Comprobación directa: $\log_2(4 \cdot 8) = \log_2(32) = 5$.'
explicacion_formal: 'Para $b > 0, b \neq 1$ y $x, y > 0$, se cumple:

  $$\log_b(x \cdot y) = \log_b(x) + \log_b(y)$$

  Esta propiedad es la versión logarítmica de la regla de exponentes $b^m \cdot b^n = b^{m+n}$.'
definiciones_clave: '- **Transformación de producto a suma**: Propiedad fundamental que convierte
  multiplicaciones subradicales en adiciones simples.'
propiedades_relaciones: '- **Inaplicabilidad a la suma**: $\log_b(x + y) \neq \log_b(x) +
  \log_b(y)$ (jamás separes una suma en el argumento).'
ejemplo_guiado:
  enunciado: Sabiendo que $\log(2) \approx 0{,}301$ y $\log(3) \approx 0{,}477$, calcula $\log(6)$.
  pasos:
  - Expresar el argumento $6$ como el producto $2 \cdot 3$.
  - 'Aplicar la propiedad del logaritmo de un producto: $\log(2 \cdot 3) = \log(2) + \log(3)$.'
  - 'Sustituir los valores dados: $0{,}301 + 0{,}477 = 0{,}778$.'
  - Concluir que $\log(6) \approx 0{,}778$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\log_5(a \cdot b)$ para $a, b > 0$?
  choices:
  - text: \log_5(a) + \log_5(b)
    is_correct: true
  - text: \log_5(a) \cdot \log_5(b)
    is_correct: false
  - text: \log_5(a + b)
    is_correct: false
  - text: \log_5(a) - \log_5(b)
    is_correct: false
  explanation: 'La correcta es: \log_5(a) + \log_5(b). El logaritmo de un producto se convierte
    en la suma de los logaritmos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\log_6(2) + \log_6(18)$.
  choices:
  - text: '2'
    is_correct: true
  - text: '36'
    is_correct: false
  - text: \log_6(20)
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La correcta es: 2. $\log_6(2) + \log_6(18) = \log_6(2 \cdot 18) = \log_6(36)
    = 2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la multiplicación esté dentro del argumento de un único logaritmo.'
- 'Paso 2: Descomponer en la suma de dos o más logaritmos en la misma base.'
- 'Paso 3: Evaluar o simplificar cada término resultante.'
errores_correccion: No confundas $\log(x \cdot y)$ con $\log(x) \cdot \log(y)$. Los logaritmos
  **se suman**, no se multiplican.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_2(8) + \log_2(4)$.
  alternativas:
  - '5'
  - '6'
  - '12'
  respuesta: '5'
  solucion_pasos:
  - $\log_2(8 \cdot 4) = \log_2(32) = 5$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale log base 3 de (9·27)?
  alternativas:
  - '5'
  - log base 3 de 36
  - '6'
  respuesta: '5'
  solucion_pasos:
  - log base 3 de 9 + log base 3 de 27 = 2+3=5.
- titulo: Ejemplo 3
  enunciado: Sabiendo que log(4)≈0,602, ¿cuál es el valor de log(16)?
  alternativas:
  - ≈1,204
  - ≈0,602
  - ≈2,408
  respuesta: ≈1,204
  solucion_pasos:
  - log(4·4)=log(4)+log(4)=0,602+0,602=1,204.
- titulo: ¿Es correcto que log(x+y) es igual a log(x)+log(y)?
  respuesta: 'No'
  solucion_pasos:
  - Esa propiedad solo aplica a productos, no a sumas.
errores_frecuentes:
- Separar $\log(x+y)$ como suma de logaritmos.
- Separar el logaritmo de una suma como si fuera el logaritmo de un producto.
- Multiplicar los logaritmos individuales en vez de sumarlos.
- Aplicar esta propiedad cuando alguno de los factores es negativo.
- Olvidar que ambos logaritmos deben tener la misma base para poder sumarse.
afirmaciones_verdaderas:
- $\log_b(xy) = \log_b(x) + \log_b(y)$.
- Esta propiedad exige que ambos factores del producto sean estrictamente positivos, ya que
  el logaritmo no está definido para argumentos negativos.
al_terminar_debes_poder: Aplicar la propiedad del logaritmo de un producto en ambas direcciones.
fuente: Texto escolar MINEDUC.
estado: publicado
