semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.PRODUCTO
resumen_inicial: 'El logaritmo de un producto es igual a la suma de los logaritmos de los factores: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$ ($x, y > 0$).'
explicacion_simple: |
  Los logaritmos convierten multiplicaciones complejas en sumas sencillas. Si dentro del argumento de un logaritmo tienes dos números multiplicándose (como $\log_2(4 \cdot 8)$), puedes separar la multiplicación en dos logaritmos individuales sumándose: $\log_2(4) + \log_2(8) = 2 + 3 = 5$. Esto concuerda con la propiedad de las potencias donde al multiplicar potencias de igual base los exponentes se suman ($2^2 \cdot 2^3 = 2^{2+3} = 2^5$).
explicacion_formal: |
  ### Definición formal
  La **propiedad del logaritmo de un producto** establece que para toda base real $b > 0, b \neq 1$ y números reales estrictamente positivos $x, y \in \mathbb{R}^+$:
  $$\log_b(x \cdot y) = \log_b(x) + \log_b(y)$$

  ### Demostración analítica
  Sean $u = \log_b(x)$ y $v = \log_b(y)$. Por la definición exponencial:
  1. $x = b^u$ y $y = b^v$.
  2. Multiplicando ambas igualdades: $x \cdot y = b^u \cdot b^v = b^{u + v}$.
  3. Aplicando la definición de logaritmo a la potencia resultante $x \cdot y = b^{u + v}$:
     $$\log_b(x \cdot y) = u + v$$
  4. Sustituyendo $u$ y $v$: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$.

  ### Síntesis didáctica
  - Transformación operacional: El producto interno $x \cdot y$ se convierte en la suma externa $\log_b(x) + \log_b(y)$.
  - Restricción de positividad: $x > 0$ y $y > 0$.
definiciones_clave: |
  - **Logaritmo de un producto**: Propiedad expansiva que descompone el logaritmo de una multiplicación en la suma de logaritmos individuales.
  - **Propiedad expansiva**: Dirección de la propiedad que desglosa un solo logaritmo compuesto en varios sumandos.
  - **Propiedad de condensación**: Dirección inversa $\log_b(x) + \log_b(y) = \log_b(x \cdot y)$ que agrupa la suma en un solo producto.
propiedades_relaciones: |
  - **Generalización a $n$ factores**: $\log_b(x_1 \cdot x_2 \cdots x_k) = \log_b(x_1) + \log_b(x_2) + \dots + \log_b(x_k)$.
  - **Relación con productos notables de exponentes**: Es la manifestación directa de la regla de potencias de igual base $b^u \cdot b^v = b^{u+v}$.
ejemplo_guiado:
  enunciado: 'Calcula el valor de $\log_6(12) + \log_6(3)$ condensando la suma en un solo logaritmo de un producto.'
  pasos:
    - 'Paso 1: Verificamos que ambos logaritmos compartan la misma base $b = 6$ y estén unidos por una suma.'
    - 'Paso 2: Aplicamos la propiedad de condensación del producto: $\log_6(12) + \log_6(3) = \log_6(12 \cdot 3)$.'
    - 'Paso 3: Realizamos el producto de los argumentos: $12 \cdot 3 = 36 \implies \log_6(36)$.'
    - 'Paso 4: Calculamos el logaritmo resultante buscando la potencia $6^c = 36 \implies c = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se desglosa el logaritmo de un producto $\log_b(x \cdot y)$ según las propiedades fundamentales?'
    choices:
      - {text: '$\log_b(x) + \log_b(y)$, transformando el producto interno en la suma de dos logaritmos', is_correct: true}
      - {text: '$\log_b(x) \cdot \log_b(y)$, multiplicando los dos logaritmos', is_correct: false}
      - {text: '$\log_b(x + y)$, sumando los argumentos dentro de una sola raíz', is_correct: false}
      - {text: '$\log_b(x^y)$, elevando el argumento $x$ al exponente $y$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\log_b(x) + \log_b(y)$, transformando el producto interno en la suma de dos logaritmos''. El logaritmo de un producto convierte la multiplicación sublogarítmica en suma de logaritmos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor numérico de la expresión $\log_2(4) + \log_2(8)$?'
    choices:
      - {text: '$5$, ya que $\log_2(4 \cdot 8) = \log_2(32) = 5$', is_correct: true}
      - {text: '$6$, multiplicando los logaritmos $2 \cdot 3$', is_correct: false}
      - {text: '$12$, sumando directamente los argumentos', is_correct: false}
      - {text: '$32$, olvidando calcular el logaritmo', is_correct: false}
    explanation: 'La alternativa correcta es ''$5$, ya que $\log_2(4 \cdot 8) = \log_2(32) = 5$''. Sumar $\log_2(4) + \log_2(8) = 2 + 3 = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comprobar que los logaritmos tengan la misma base $b$ y estén conectados por una adición.'
  - 'Paso 2: Multiplicar los argumentos individuales $x \cdot y$ para formar un único argumento.'
  - 'Paso 3: Escribir la expresión condensada en la forma $\log_b(x \cdot y)$.'
  - 'Paso 4: Calcular el valor del logaritmo unificado si el argumento resultante es una potencia exacta de la base.'
errores_correccion: |
  - **Error 1:** Creer que el logaritmo de una suma es la suma de los logaritmos (ej: escribir $\log_b(x + y) = \log_b(x) + \log_b(y)$). **Cómo corregirlo:** La propiedad se aplica al **producto interno**: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$. El logaritmo de una suma $\log_b(x+y)$ **no se puede desglosar**.
  - **Error 2:** Multiplicar los logaritmos al condensar la suma (ej: $\log_b(x) + \log_b(y) = \log_b(x) \cdot \log_b(y)$). **Cómo corregirlo:** La suma de dos logaritmos se condensa en un solo logaritmo cuyos **argumentos se multiplican**: $\log_b(x \cdot y)$.
ejemplos:
  - titulo: 'Condensación con logaritmo decimal'
    enunciado: '¿La suma $\log(2) + \log(5)$ es igual a $1$?'
    alternativas:
      - 'Sí, pues $\log(2 \cdot 5) = \log(10) = 1$'
      - 'No, es igual a $\log(7)$'
      - 'No, es igual a 10'
    respuesta: 'Sí, pues $\log(2 \cdot 5) = \log(10) = 1$'
    solucion_pasos:
      - '1. Aplicamos condensación: $\log(2 \cdot 5) = \log(10)$.'
      - '2. Como la base es 10, $\log_{10}(10) = 1$.'
  - titulo: 'Expansión de un logaritmo'
    enunciado: '¿La expresión $\log_3(a \cdot b)$ equivale a $\log_3(a) + \log_3(b)$ para $a,b > 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la propiedad expansiva del producto.'
  - titulo: 'Cálculo de suma logarítmica base 4'
    enunciado: '¿El valor de $\log_4(2) + \log_4(8)$ resulta en $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\log_4(2 \cdot 8) = \log_4(16) = 2$.'
  - titulo: 'Restricción de positividad en producto'
    enunciado: 'Para expandir $\log_b(x \cdot y)$ en $\log_b(x) + \log_b(y)$, ¿se exige que $x > 0$ y $y > 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambos factores deben ser individualmente positivos para que sus logaritmos existan en $\mathbb{R}$.'
