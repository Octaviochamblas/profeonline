resumen_inicial: 'El logaritmo de un producto de dos o más factores positivos $\log_b(x
  \cdot y)$ es igual a la suma de los logaritmos de cada factor en la misma base:
  $\log_b(x) + \log_b(y)$ ($x, y > 0$).'
explicacion_simple: Cuando tenemos una multiplicación dentro del argumento de un logaritmo,
  podemos separar ese trabajo convirtiéndolo en la suma de dos logaritmos separados
  con la misma base.
explicacion_formal: 'Para todo $x, y > 0$ y base $b > 0, b \neq 1$, el **Logaritmo
  de un Producto** satisface la identidad:


  $$\log_b(x \cdot y) = \log_b(x) + \log_b(y)$$


  **Demostración exponencial:**

  Sean $u = \log_b(x)$ y $v = \log_b(y) \implies b^u = x$ y $b^v = y$.

  El producto es $x \cdot y = b^u \cdot b^v = b^{u+v}$.

  Aplicando logaritmo: $\log_b(x \cdot y) = u + v = \log_b(x) + \log_b(y)$.


  > **Complemento didáctico:** El logaritmo convierte la multiplicación de los argumentos
  en una adición de exponentes.'
definiciones_clave: '- **Logaritmo de un producto**: Identidad $\log_b(x \cdot y)
  = \log_b(x) + \log_b(y)$ para $x, y > 0$.'
propiedades_relaciones: '- **Transformación de producto a suma**: Convierte multiplicaciones
  internas en adiciones de logaritmos.'
ejemplo_guiado:
  enunciado: Calcule el valor de $\log_2(4 \cdot 8)$ aplicando la propiedad del producto.
  pasos:
  - 'Paso 1: Desarrollar el logaritmo del producto en suma: $\log_2(4) + \log_2(8)$.'
  - 'Paso 2: Evaluar cada logaritmo: $\log_2(4) = 2$ (porque $2^2=4$) y $\log_2(8)
    = 3$ (porque $2^3=8$).'
  - 'Paso 3: Sumar los resultados: $2 + 3 = 5$.'
  - 'Conclusión: $\log_2(4 \cdot 8) = \log_2(32) = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se expande el logaritmo de un producto log_b(x · y) para argumentos
    positivos?
  choices:
  - text: Como la suma de logaritmos log_b(x) + log_b(y)
    is_correct: true
  - text: Como la multiplicación log_b(x) · log_b(y)
    is_correct: false
  - text: Como la resta log_b(x) - log_b(y)
    is_correct: false
  - text: Como log_b(x + y)
    is_correct: false
  explanation: La alternativa correcta es 'Como la suma de logaritmos log_b(x) + log_b(y)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para log_2(4 · 8), ¿cuál fue el resultado de la suma
    de logaritmos?
  choices:
  - text: 5 (porque 2 + 3 = 5)
    is_correct: true
  - text: 6 (porque 2 · 3 = 6)
    is_correct: false
  - text: '32'
    is_correct: false
  - text: '12'
    is_correct: false
  explanation: La alternativa correcta es '5 (porque 2 + 3 = 5)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de expandir y agrupar logaritmos
  de un producto $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$, transformando multiplicaciones
  en adiciones.
semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.PRODUCTO
procedimiento:
- 'Paso 1: Identificar la propiedad logarítmica correspondiente a la estructura del
  argumento o las bases.'
- 'Paso 2: Aplicar la ley algebraica transformando el logaritmo según la regla.'
- 'Paso 3: Evaluar y reducir numéricamente la expresión simplificada.'
errores_correccion: '- **Error 1: Confundir el logaritmo de una suma con la suma de
  logaritmos (escribir $\log(x+y) = \log(x) + \log(y)$).** **Cómo corregirlo:** El
  logaritmo NO es distributivo sobre la suma; la suma de logaritmos proviene del PRODUCTO
  ($\log(x \cdot y) = \log(x) + \log(y)$).


  - **Error 2: Confundir el cociente de logaritmos con el logaritmo del cociente.**
  **Cómo corregirlo:** $\log\left(\frac{x}{y}\right) = \log(x) - \log(y)$, mientras
  $\frac{\log(x)}{\log(y)}$ es la fórmula de cambio de base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de aplicación de MAT.NUM.LOGARITMOS_PROPIEDADES.PRODUCTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de validez formal.
  alternativas:
  - Cumple la propiedad
  - No cumple
  - Indeterminado
  respuesta: Cumple la propiedad
  solucion_pasos:
  - Demostración de equivalencia en R.
- titulo: ¿Es distributivo el logaritmo respecto a la adición?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(x+y) \neq \log(x) + \log(y)$.
- titulo: ¿Conserva el resultado la igualdad matemática original?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las propiedades de los logaritmos.
errores_frecuentes:
- Distribuir el logaritmo sobre los términos de una suma escribiendo $\log_b(x+y)
  = \log_b(x) + \log_b(y)$.
- Multiplicar los logaritmos individuales al calcular el logaritmo de un producto.
- Dividir los logaritmos individuales al calcular el logaritmo de un cociente.
- La expresión $\log(x^2)$ equivale numéricamente a elevar al cuadrado todo el logaritmo
  $(\log(x))^2$.
- Restar las bases al aplicar el cambio de base en un logaritmo.
afirmaciones_verdaderas:
- Las propiedades de los logaritmos transforman productos en sumas, cocientes en restas
  y potencias en multiplicaciones.
- 'El logaritmo de un producto es la suma de los logaritmos de sus factores: $\log_b(x
  \cdot y) = \log_b(x) + \log_b(y)$ ($x,y>0$).'
