semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.PRODUCTO
resumen_inicial: 'El logaritmo de un producto es igual a la suma de los logaritmos de los factores: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$ para $b > 0, b \neq 1$ y $x, y > 0$.'
explicacion_simple: '![Propiedad del logaritmo de un producto](/static/img/nodos/logaritmo-de-un-producto-intro.svg)


  Los logaritmos transforman multiplicaciones en sumas:

  - Si dentro del logaritmo tienes un producto como $\log_2(4 \cdot 8)$, puedes separarlo en dos logaritmos que se suman: $\log_2(4) + \log_2(8) = 2 + 3 = 5$.

  - Esto ocurre porque al multiplicar potencias de igual base, sus exponentes se suman: $2^2 \cdot 2^3 = 2^{2+3} = 2^5$.

  - En sentido inverso (condensación), una suma de logaritmos de igual base se agrupa multiplicando los argumentos: $\log_6(12) + \log_6(3) = \log_6(12 \cdot 3) = \log_6(36) = 2$.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$ y $x, y \in \mathbb{R}^+ = ]0, +\infty[$. La **propiedad del logaritmo de un producto** establece que:


  $$\log_b(x \cdot y) = \log_b(x) + \log_b(y)$$


  **Demostración Analítica:**

  1. Sean $u = \log_b(x)$ y $v = \log_b(y)$. Por definición exponencial: $x = b^u$ y $y = b^v$.

  2. Multiplicando miembro a miembro: $x \cdot y = b^u \cdot b^v = b^{u + v}$.

  3. Aplicando la definición de logaritmo: $\log_b(x \cdot y) = u + v$.

  4. Sustituyendo $u$ y $v$: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$. $\blacksquare$'
definiciones_clave: '- **Logaritmo de un producto**: Identidad $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$.

  - **Sentido expansivo**: Desglose de un producto interno en sumas individuales.

  - **Sentido de condensación**: Agrupación de sumas de igual base en un único producto.'
propiedades_relaciones: '- **Generalización a $n$ factores**: $\log_b(x_1 \cdot x_2 \cdots x_k) = \sum_{i=1}^k \log_b(x_i)$.

  - **Isomorfismo**: El logaritmo es un isomorfismo de grupos entre $(\mathbb{R}^+, \cdot)$ y $(\mathbb{R}, +)$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de un producto](/static/img/nodos/logaritmo-de-un-producto-ejemplos.svg)


    Calcule el valor de $\log(2) + \log(5)$ y expanda la expresión $\log_3(9 \cdot 27)$.'
  pasos:
  - 'Paso 1: Para $\log(2) + \log(5)$: Condensar en base 10 común: $\log(2 \cdot 5) = \log(10)$.'
  - 'Paso 2: Como $\log_{10}(10) = 1$, el resultado es $1$.'
  - 'Paso 3: Para $\log_3(9 \cdot 27)$: Separar en $\log_3(9) + \log_3(27)$.'
  - 'Paso 4: Evaluar cada sumando: $2 + 3 = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿De qué forma se desglosa el logaritmo de un producto $\log_b(x \cdot y)$?
  choices:
  - text: $\log_b(x) + \log_b(y)$ (suma de los logaritmos de cada factor)
    is_correct: true
  - text: $\log_b(x) \cdot \log_b(y)$
    is_correct: false
  - text: $\log_b(x + y)$
    is_correct: false
  - text: $\log_b(x)^y$
    is_correct: false
  explanation: La alternativa correcta es '$\log_b(x) + \log_b(y)$ (suma de los logaritmos de cada factor)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\log(2) + \log(5) = 1$?
  choices:
  - text: Porque se condensan en $\log(2 \times 5) = \log(10) = 1$
    is_correct: true
  - text: Porque $2 + 5 = 7$
    is_correct: false
  - text: Porque $\log(2) \times \log(5) = 1$
    is_correct: false
  - text: Porque los logaritmos decimales siempre suman 1
    is_correct: false
  explanation: La alternativa correcta es 'Porque se condensan en $\log(2 \times 5) = \log(10) = 1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los logaritmos a sumar compartan la misma base $b$ y tengan argumentos positivos.'
- 'Paso 2: Multiplicar los argumentos para formar un único argumento $x \cdot y$.'
- 'Paso 3: Escribir la expresión condensada $\log_b(x \cdot y)$ y simplificar su valor numérico si es exacto.'
errores_correccion: '- **Error 1: Creer que el logaritmo de una suma es la suma de logaritmos ($\log_b(x+y) = \log_b(x) + \log_b(y)$).** **Cómo corregirlo:** La suma ocurre AFUERA cuando los argumentos se multiplican ADENTRO: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$.

  - **Error 2: Multiplicar los logaritmos ($\log_b(x) + \log_b(y) = \log_b(x) \cdot \log_b(y)$).** **Cómo corregirlo:** Se multiplican los argumentos, no las funciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale la suma $\log_4(2) + \log_4(8)$?
  alternativas:
  - $2$
  - $16$
  - $4$
  respuesta: $2$
  solucion_pasos:
  - $\log_4(2 \cdot 8) = \log_4(16) = 2$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se expande $\log(10x)$ para $x > 0$?
  alternativas:
  - $1 + \log(x)$
  - $10 + \log(x)$
  - $\log(10) \cdot \log(x)$
  respuesta: $1 + \log(x)$
  solucion_pasos:
  - $\log(10 \cdot x) = \log(10) + \log(x) = 1 + \log(x)$.
- titulo: ¿Es log(20) + log(5) = 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\log(20 \cdot 5) = \log(100) = 2$.
  alternativas:
  - texto: Sí, log(20 · 5) = log(100) = 2
    es_correcta: true
    retroalimentacion: ¡Correcto! Condensación en logaritmo decimal.
  - texto: No, es log(25)
    es_correcta: false
    retroalimentacion: Incorrecto, los argumentos se multiplican, no se suman.
  - texto: No, es 100
    es_correcta: false
    retroalimentacion: Incorrecto, falta calcular el logaritmo de 100.
- titulo: ¿Es log_b(x · y) = log_b(x) + log_b(y) válido si x < 0 e y < 0?
  respuesta: 'No'
  solucion_pasos:
  - No, porque individualmente $\log_b(x)$ y $\log_b(y)$ no existen en $\mathbb{R}$ si $x, y < 0$.
  alternativas:
  - texto: No, cada argumento debe ser positivo individualmente
    es_correcta: true
    retroalimentacion: ¡Correcto! Ambos factores deben ser estrictamente positivos en $\mathbb{R}$.
  - texto: Sí, porque (-x) · (-y) es positivo
    es_correcta: false
    retroalimentacion: Incorrecto, aunque el producto sea positivo, la suma separada no existe en $\mathbb{R}$.
  - texto: Sí, para cualquier número real
    es_correcta: false
    retroalimentacion: Incorrecto, viola el dominio real de los logaritmos.
errores_frecuentes:
- Intentar desglosar $\log_b(x + y)$ en sumas.
- Multiplicar los resultados de los logaritmos en vez de sumar.
- Sumar logaritmos de bases distintas sin cambiar de base primero.
- Olvidar que ambos factores deben ser estrictamente positivos.
afirmaciones_verdaderas:
- El logaritmo de un producto es igual a la suma de los logaritmos de los factores.
- La propiedad proviene de la suma de exponentes al multiplicar potencias de igual base.
- Permite condensar sumas de logaritmos de igual base en un solo logaritmo.
al_terminar_debes_poder: '![Síntesis de logaritmo de un producto](/static/img/nodos/logaritmo-de-un-producto-resumen.svg)


  QUÉ: Aplicar con fluidez la propiedad del logaritmo de un producto en sentido expansivo y condensado.


  CÓMO: Transformando $\log_b(x \cdot y)$ en $\log_b(x) + \log_b(y)$ y viceversa, verificando siempre las condiciones $b > 0, b \neq 1$ y $x, y > 0$.'
