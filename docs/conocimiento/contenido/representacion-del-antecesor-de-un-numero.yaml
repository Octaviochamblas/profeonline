semantic_id: MAT.ALG.LENGUAJE_RELACIONES.ANTECESOR_NUMERO
resumen_inicial: La representación del antecesor de un número consiste en expresar algebraicamente el entero inmediatamente anterior a una cantidad dada mediante la sustracción de una unidad $n - 1$.
explicacion_simple: "El **antecesor de un número entero** es el número que le antecede inmediatamente hacia la izquierda en la recta numérica (el número \"anterior\"):\n- Para encontrar el antecesor de cualquier entero, **simplemente le restas $1$**.\n- Si el número desconocido es $n$, su **antecesor** es **$n - 1$**.\n- Ejemplos:\n  - El antecesor de $9 \\implies 9 - 1 = 8$.\n  - El antecesor de $-5 \\implies -5 - 1 = -6$.\n  - El antecesor de un número $x \\implies **x - 1**$.\n  - El triple del antecesor de $x \\implies **3(x - 1)**$.\n  - El antecesor del triple de $x \\implies **3x - 1**$.\n\n![Antecesor de un Número](/static/img/nodos/representacion-del-antecesor-de-un-numero-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $n \in \mathbb{Z}$ un número entero. La **función antecesor** (o consecutividad anterior) $A: \mathbb{Z} \to \mathbb{Z}$ asigna a cada elemento $n$ el valor único determinado por el descuento del elemento neutro aditivo $1$:


  $$A(n) = n - 1$$


  ### Relación de Inversión con la Función Sucesor

  La función antecesor es el operador inverso multiplicativo/aditivo de la función sucesor:


  $$A(S(n)) = S(A(n)) = n \iff (n + 1) - 1 = (n - 1) + 1 = n$$


  ### Distinción Sintáctica: Antecesor del Múltiplo vs Múltiplo del Antecesor

  - **El antecesor del triple de $n$**: $A(3n) = 3n - 1$.

  - **El triple del antecesor de $n$**: $3 \cdot A(n) = 3(n - 1) = 3n - 3$.


  ### Síntesis didáctica

  La representación del antecesor es fundamental para el estudio de secuencias decrecientes, sistemas de conteo y resolución de problemas de edades pasadas.

  '
definiciones_clave: '- **Antecesor de un entero ($n - 1$)**: Número entero contiguo menor en $1$ unidad respecto a la cantidad dada.

  - **Función antecesor ($A(n)$)**: Operación elemental $n \mapsto n-1$ sobre el conjunto de los enteros $\mathbb{Z}$.

  - **Inverso del sucesor**: Operador de retroceso unitario en la recta numérica.

  '
propiedades_relaciones: '- **Diferencia constante**: La diferencia entre el número original y su antecesor es siempre igual a $1$ ($n - A(n) = 1$).

  - **Composición de antecesores**: El antecesor del antecesor de $n$ equivale a $A(A(n)) = (n - 1) - 1 = n - 2$.

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El cuádruple del antecesor de un número $y$ disminuido en cinco equivale a veinte".'
  pasos:
  - 'Paso 1: Expresamos el antecesor de la variable $y$: $A(y) = (y - 1)$.'
  - 'Paso 2: Aplicamos "el cuádruple" multiplicando toda la expresión entre paréntesis: $4(y - 1)$.'
  - 'Paso 3: Restamos las 5 unidades "disminuido en cinco": $4(y - 1) - 5$.'
  - 'Paso 4: Igualamos a $20$: $4(y - 1) - 5 = 20$.'
  - 'Conclusión: La ecuación traducida es **$4(y - 1) - 5 = 20$**.'
  imagen: /static/img/nodos/representacion-del-antecesor-de-un-numero-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica genérica que representa el antecesor de un número entero $n$?
  choices:
  - text: 'Se representa restando una unidad a la variable: $n - 1$'
    is_correct: true
  - text: 'Se representa sumando una unidad a la variable: $n + 1$'
    is_correct: false
  - text: 'Se representa dividiendo la variable entre dos: $\frac{n}{2}$'
    is_correct: false
  - text: 'Se representa multiplicando la variable por menos uno: $-n$'
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa restando una unidad a la variable: $n - 1$''. Definición de antecesor.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cuál es la traducción al lenguaje algebraico de "El antecesor del cubo de $y$"? '
  choices:
  - text: Se traduce como la expresión $y^3 - 1$
    is_correct: true
  - text: Se traduce como la expresión $(y - 1)^3$
    is_correct: false
  - text: Se traduce como la expresión $3y - 1$
    is_correct: false
  - text: Se traduce como la expresión $y - 3$
    is_correct: false
  explanation: La alternativa correcta es 'Se traduce como la expresión $y^3 - 1$'. Primero el cubo $y^3$ y luego su antecesor $- 1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable que representa al número inicial.'
- 'Paso 2: Restar $- 1$ inmediatamente a la derecha de dicha variable.'
- 'Paso 3: Si el enunciado aplica un multiplicador u otra operación SOBRE el antecesor, encerrar $(n - 1)$ entre paréntesis.'
- 'Paso 4: Si el enunciado pide el antecesor DE una operación, calcular la operación y restar $- 1$ al final.'
errores_correccion: '- **Error 1:** Sumar $1$ en lugar de restar $1$ al buscar el antecesor (escribir $n + 1$). **Cómo corregirlo:** El **antecesor RESTA $1$ ($n - 1$)**; sumar 1 da el sucesor.

  - **Error 2:** Excluir los paréntesis al aplicar un producto sobre el antecesor (escribir $3n - 1$ para "el triple del antecesor de $n$"). **Cómo corregirlo:** Debe escribirse **$3(n - 1)$ con paréntesis**; $3n - 1$ es "el antecesor del triple de $n$".

  '
ejemplos:
- titulo: Antecesor simple
  enunciado: ¿Cuál es la traducción del "Antecesor de un número $x$"?
  alternativas:
  - $x - 1$
  - $x + 1$
  - $-x$
  respuesta: $x - 1$
  solucion_pasos:
  - '1. Variable: $x$.'
  - '2. Antecesor resta 1: $x - 1$.'
- titulo: Antecesor del antecesor
  enunciado: ¿Cuál es la expresión simplificada del antecesor del antecesor de $m$?
  alternativas:
  - $m - 2$
  - $m - 1$
  - $2m - 2$
  respuesta: $m - 2$
  solucion_pasos:
  - 1. Antecesor de $m \to m-1$.
  - 2. Antecesor de $(m-1) \to (m-1)-1 = m-2$.
- titulo: Antecesor de número negativo
  enunciado: ¿Es el número $-11$ el antecesor de $-10$ por la operación $-10 - 1 = -11$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-10 - 1 = -11$.
- titulo: Cubo del antecesor
  enunciado: La frase "El cubo del antecesor de $a$", ¿se traduce como $(a - 1)^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, primero el antecesor $(a-1)$ y luego elevado al cubo.
errores_frecuentes:
- Escribir n + 1 al traducir el antecesor de un número en lugar de restar una unidad.
- Los paréntesis no son incluidos al traducir el triple del antecesor escribiendo 3n - 1 en lugar de 3(n - 1).
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Dividir entre dos la variable en lugar de restar uno para obtener el número anterior.
- Declarar que el antecesor de un número negativo aumenta su valor numérico en la recta.
afirmaciones_verdaderas:
- El antecesor de cualquier entero n se expresa algebraicamente como n - 1.
- Las funciones sucesor S(n) = n + 1 y antecesor A(n) = n - 1 son funciones inversas entre sí.
al_terminar_debes_poder: '![Resumen de antecesor de un número](/static/img/nodos/representacion-del-antecesor-de-un-numero-resumen.svg)


  QUÉ: Representar algebraicamente el antecesor o número entero inmediatamente anterior.


  CÓMO: Restar una unidad a la variable de referencia ($n - 1$), manteniendo el orden correcto y agrupando $(n - 1)$ ante operadores compuestos.'
