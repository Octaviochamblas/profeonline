procedimiento:
- 'Paso 1: Identifica a quién se le está calculando el antecesor.'
- 'Paso 2: Escribe esa variable (o expresión).'
- 'Paso 3: Réstale 1.'
- 'Paso 4: Si toda esta nueva expresión (x-1) va a sufrir alguna otra operación (multiplicarse
  o dividirse), enciérrala entre paréntesis.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  representación del antecesor de un número.
ejemplos:
- titulo: Protegiendo al antecesor
  enunciado: 'Traduce: ''La mitad del antecesor de un número''.'
  solucion_pasos:
  - El antecesor del número es (x - 1).
  - Se pide la mitad de esa cantidad completa.
  - 'Traducción: (x - 1) / 2.'
- titulo: 'Un juego de acertijos computacionales pide al usuario: ''Ingresa un número
    entero $N$. La máq'
  enunciado: 'Un juego de acertijos computacionales pide al usuario: ''Ingresa un
    número entero $N$. La máquina calculará el cuadrado del antecesor de tu número''.
    ¿Qué expresión algebraica evalúa internamente la máquina? (v1)


    Opciones: A) $(N - 1)^2$ · B) $N^2 - 1$ · C) $N - 1^2$ · D) $2(N - 1)$'
  solucion_pasos:
  - 'Primero hallamos el antecesor, que es $(N-1)$. Luego, le aplicamos el cuadrado
    a toda esa entidad, requiriendo paréntesis: $(N - 1)^2$. La opción B sería ''el
    antecesor del cuadrado''.'
- titulo: 'Respecto de «Representación del antecesor de un número»: ¿Es correcta esta
    caracterización?'
  enunciado: 'Respecto de «Representación del antecesor de un número»: ¿Es correcta
    esta caracterización? «El **Antecesor** de un número entero se traduce algebraicamente
    restando una unidad a dicho número»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Antecesor** de un número
    entero se traduce algebraicamente restando una unidad a dicho número.'
- titulo: 'Respecto de «Representación del antecesor de un número»: ¿Es válida esta
    afirmación? «Olvida'
  enunciado: 'Respecto de «Representación del antecesor de un número»: ¿Es válida
    esta afirmación? «Olvidar los paréntesis. Traducir ''el doble del antecesor''
    como $2x - 1$ en lugar de $2(x - 1)$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Antecesor** de un número
    entero se traduce algebraicamente restando una unidad a dicho número.'
errores_frecuentes:
- Olvidar los paréntesis. Traducir 'el doble del antecesor' como $2x - 1$ en lugar
  de $2(x - 1)$.
- Confundir antecesor con número negativo (ej. pensar que el antecesor de $x$ es $-x$).
- La división por dos ($x/2$).
- La multiplicación por menos uno ($-x$).
- La adición de la unidad ($x + 1$).
afirmaciones_verdaderas:
- La traducción de representación del antecesor de un número preserva el significado
  matemático del enunciado.
al_terminar_debes_ponder: Traducir y evaluar expresiones que involucren representación
  del antecesor de un número.
fuente: Álgebra de Baldor.
