  - Escribir la expresión algebraica correspondiente a representación del antecesor
    de un número.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
