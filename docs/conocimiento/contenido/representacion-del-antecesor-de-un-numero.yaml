semantic_id: MAT.ALG.LENGUAJE_RELACIONES.ANTECESOR_NUMERO
resumen_inicial: 'Representación del antecesor de un número: traducción, reglas y
  aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: En la fila del supermercado, la persona que está justo delante
  de ti es tu antecesor. En la recta numérica de los números enteros, ocurre exactamente
  lo mismo.
explicacion_formal: '### Definición formal


  El antecesor es el número que está inmediatamente a la izquierda en la recta entera,
  lo cual siempre se calcula restando 1.


  ### Desarrollo didáctico


  Esta regla aplica para cualquier número entero, independientemente de si es positivo,
  negativo o cero.

  - El antecesor de $5$ es $5 - 1 = 4$.

  - El antecesor de $0$ es $0 - 1 = -1$.

  - El antecesor de $x$ es $x - 1$.

  - El antecesor del doble de un número ($2x$) es $2x - 1$.


  Es fundamental usar paréntesis cuando el antecesor se va a multiplicar. Por ejemplo,
  ''el triple del antecesor de x'' se escribe $3(x - 1)$. Si no pones paréntesis y
  escribes $3x - 1$, la matemática entenderá ''el antecesor del triple de x''.'
definiciones_clave: '- **Representación del antecesor de un número**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de representación del antecesor de un número.'
ejemplo_guiado:
