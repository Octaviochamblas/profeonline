resumen_inicial: El antecesor de un número entero es la cantidad inmediatamente anterior
  obtenida al restar 1 al número original.
explicacion_simple: El antecesor de un número es el número que está justo antes que
  él en la recta numérica. Si el número es $n$, su antecesor se escribe $n - 1$. Por
  ejemplo, el antecesor de $9$ es $9 - 1 = 8$.
explicacion_formal: 'Dada la función antecesor $A: \mathbb{Z} \to \mathbb{Z}$, el
  **Antecesor de** $n$ se define formalmente como:


  $$A(n) = n - 1 \quad \forall n \in \mathbb{Z}$$


  > **Complemento didáctico:** La función antecesor es el operador inverso de la función
  sucesor: $A(S(n)) = n$.'
definiciones_clave: '- **Antecesor $n-1$**: Número entero inmediatamente anterior
  en la recta numérica.'
propiedades_relaciones: '- **Composición identidad**: $A(S(n)) = (n + 1) - 1 = n$.'
ejemplo_guiado:
  enunciado: Exprese algebraicamente el cuadrado del antecesor de un número $m$.
  pasos:
  - 'Paso 1: Identificar el antecesor de $m$: $m - 1$.'
  - 'Paso 2: Elevar el bloque completo al cuadrado mediante paréntesis: $(m - 1)^2$.'
  - 'Conclusión: La expresión traducida es $(m - 1)^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa algebraicamente el antecesor de un número entero n?
  choices:
  - text: n - 1
    is_correct: true
  - text: n + 1
    is_correct: false
  - text: n / 2
    is_correct: false
  - text: 1 - n
    is_correct: false
  explanation: La alternativa correcta es 'n - 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue la representación del cuadrado del antecesor
    de m?
  choices:
  - text: (m - 1)^2
    is_correct: true
  - text: m^2 - 1
    is_correct: false
  - text: 2(m - 1)
    is_correct: false
  - text: (m + 1)^2
    is_correct: false
  explanation: La alternativa correcta es '(m - 1)^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cantidad base.'
- 'Paso 2: Restar la unidad $1$ a la cantidad base.'
- 'Paso 3: Utilizar paréntesis si se realiza una operación posterior sobre el antecesor.'
errores_correccion: '- **Error 1: Escribir ''el antecesor del cuadrado de $m$'' ($m^2
  - 1$) como ''el cuadrado del antecesor'' ($(m - 1)^2$).** **Cómo corregirlo:** Si
  se eleva el antecesor al cuadrado, los paréntesis $(m - 1)^2$ son indispensables.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la expresión algebraica para el antecesor de la mitad de un
    número x?
  alternativas:
  - x/2 - 1
  - (x - 1)/2
  - 2x - 1
  - x - 2
  respuesta: x/2 - 1
  solucion_pasos:
  - '1. Mitad de x: x/2.'
  - '2. Antecesor de esa mitad: x/2 - 1.'
- titulo: Ejemplo 2
  enunciado: Si a = -8, ¿cuál es su antecesor a - 1 en los números enteros?
  alternativas:
  - '-9'
  - '-7'
  - '7'
  - '9'
  respuesta: '-9'
  solucion_pasos:
  - 1. -8 - 1 = -9. El antecesor de -8 es -9.
- titulo: ¿Es el antecesor de un entero n siempre 1 unidad menor que n?
  respuesta: Sí
  solucion_pasos:
  - Sí, n - 1 dista en 1 unidad hacia la izquierda en la recta numérica.
- titulo: ¿Es la composición del antecesor del sucesor de n igual a n?
  respuesta: Sí
  solucion_pasos:
  - Sí, (n + 1) - 1 = n.
errores_frecuentes:
- Sumar 1 en lugar de restar 1 al calcular el antecesor de una expresión.
- Omitir los paréntesis al aplicar exponentes o multiplicaciones sobre el antecesor
  de una variable.
- Declarar que el antecesor de un número negativo es más cercano a cero (decir que
  el antecesor de -8 es -7).
- Declarar la expresión n - 1 con 1 - n.
- Declarar que el antecesor de cero no está definido en los enteros.
afirmaciones_verdaderas:
- El antecesor de cualquier número entero n es n - 1.
- En la recta numérica, el antecesor se ubica inmediatamente a la izquierda del número
  original.
al_terminar_debes_ponder: Al terminar serás capaz de representar algebraicamente el
  antecesor de cualquier número o expresión restando la unidad constante.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Sucesiones.
estado: publicado
