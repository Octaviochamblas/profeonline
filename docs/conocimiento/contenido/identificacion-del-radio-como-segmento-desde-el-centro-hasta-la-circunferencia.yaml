semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.RADIO
resumen_inicial: El radio es el segmento de recta que une el centro con cualquier punto de la circunferencia, y todos tienen igual longitud.
explicacion_simple: 'El **radio** es como cada uno de los rayos de una rueda de bicicleta: un segmento que nace en el centro $O$ y viaja en línea recta hasta tocar el borde exterior de la circunferencia en un punto $P$ (segmento $\overline{OP}$).


  No importa hacia qué dirección traces el radio (hacia arriba, hacia la derecha o en diagonal): **todos los radios de una misma circunferencia miden exactamente lo mismo** ($r = \text{constante}$). El radio es la medida más importante de la figura, porque conociendo solo el radio puedes calcular al instante su diámetro ($2r$), su contorno ($2\pi r$) y su área interior ($\pi r^2$).


  ![Identificación del radio](/static/img/nodos/identificacion-del-radio-como-segmento-desde-el-centro-hasta-la-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición geométrica del radio

  Sea $\mathcal{C}$ una circunferencia con centro $O$. Se denomina **radio** a cualquier segmento rectilíneo $\overline{OP}$ cuyos extremos son el centro $O$ y un punto $P$ perteneciente a la circunferencia:

  $$\overline{OP} \text{ es radio} \iff P \in \mathcal{C} \implies \text{long}(OP) = r$$


  ### Propiedades métricas y congruencia universal

  1. **Congruencia de radios:** Para cualesquiera dos puntos $P_1, P_2 \in \mathcal{C}$, los segmentos radiales son estrictamente congruentes:

  $$\overline{OP_1} \cong \overline{OP_2} \iff \text{long}(OP_1) = \text{long}(OP_2) = r$$

  2. **Triángulos isósceles radiales:** Al trazar radios desde el centro hacia los extremos de cualquier cuerda $\overline{AB}$, el triángulo $\triangle OAB$ formado es invariablemente isósceles (con $OA = OB = r$).

  3. **Perpendicularidad con la recta tangente:** El radio que conecta el centro con el punto de tangencia $T$ es estrictamente perpendicular a la recta tangente $\mathcal{L}_T$:

  $$\overline{OT} \perp \mathcal{L}_T \iff \angle(OT, \mathcal{L}_T) = 90^\circ$$


  > **Complemento didáctico:** En problemas de geometría con circunferencias, cuando no sepas por dónde empezar, traza los radios hacia los vértices o puntos de contacto. Como todos los radios miden $r$, inmediatamente aparecerán triángulos isósceles y ángulos rectos que destraban el ejercicio.

  '
definiciones_clave: '- **Radio (segmento)**: Segmento que conecta el centro con un punto de la circunferencia.

  - **Radio (magnitud $r$)**: Longitud escalar del segmento radial.

  - **Triángulo radial**: Triángulo con dos lados de longitud $r$ que resulta isósceles.

  - **Radio de tangencia**: Radio trazado hacia el punto de contacto que forma un ángulo de $90^\circ$.

  '
propiedades_relaciones: '- **Mitad del diámetro**: Se relaciona con el diámetro mediante la igualdad estricta $r = d / 2$.

  - **Factor generador de métricas**: Determina la longitud $P = 2\pi r$ y el área $A = \pi r^2$.

  - **Apotema de polígonos inscritos**: La apotema de un polígono regular inscrito y el lado forman un triángulo rectángulo con la hipotenusa igual al radio $r$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de radio](/static/img/nodos/identificacion-del-radio-como-segmento-desde-el-centro-hasta-la-circunferencia-ejemplos.svg)


    En una circunferencia de centro $O$, se trazan dos radios $OA$ y $OB$ tales que el ángulo del centro mide $\angle AOB = 60^\circ$. Si el radio mide $r = 10\text{ cm}$, calcula la longitud de la cuerda $\overline{AB}$.'
  pasos:
  - 'Paso 1: Analizar el triángulo $\triangle OAB$: Como $OA = OB = r = 10\text{ cm}$, el triángulo es isósceles con base $AB$.'
  - 'Paso 2: Calcular los ángulos basales: La suma interna es $180^\circ$. Con $\angle AOB = 60^\circ$, los dos ángulos restantes suman $180^\circ - 60^\circ = 120^\circ$.'
  - 'Paso 3: Determinar cada ángulo basal: Como son iguales, miden $120^\circ / 2 = 60^\circ$.'
  - 'Paso 4: Concluir el tipo de triángulo: Como los tres ángulos miden $60^\circ$, $\triangle OAB$ es equilátero, luego la cuerda mide $AB = r = 10\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tipo de triángulo se forma siempre al unir el centro de una circunferencia con los extremos de una cuerda de longitud menor a 2r?
  choices:
  - text: Un triángulo isósceles (o equilátero si el ángulo es de 60°).
    is_correct: true
  - text: Un triángulo escaleno obligatoriamente.
    is_correct: false
  - text: Un triángulo obtusángulo en todos los casos.
    is_correct: false
  - text: Un triángulo que carece de lados iguales.
    is_correct: false
  explanation: La alternativa correcta es 'Un triángulo isósceles (o equilátero si el ángulo es de 60°).' Como dos de sus lados son radios congruentes ($OA = OB = r$), siempre tiene al menos dos lados iguales.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una circunferencia tiene un perímetro de 24π cm, ¿cuánto mide su radio?
  choices:
  - text: 12 cm.
    is_correct: true
  - text: 24 cm.
    is_correct: false
  - text: 6 cm.
    is_correct: false
  - text: 48 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''12 cm.'' Despejando: $P = 2\pi r \implies 24\pi = 2\pi r \implies r = 24 / 2 = 12$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el centro $O$ y el punto periférico $P$.

  2. Trazar el segmento $\overline{OP}$ correspondiente al radio.

  3. Utilizar la propiedad $r = d / 2$ si se dispone del diámetro.

  4. En polígonos o cuerdas, aprovechar que todos los radios trazados tienen la misma longitud $r$ para formar triángulos isósceles.

  '
errores_correccion: '- **Error común 1:** Confundir el radio con el diámetro. **Corrección:** El radio va desde el centro al borde; el diámetro cruza de borde a borde pasando por el centro ($d = 2r$).

  - **Error común 2:** Creer que radios orientados en diferentes direcciones tienen medidas distintas. **Corrección:** Todos los radios de una circunferencia son rigurosamente idénticos.

  '
ejemplos:
- tipo: A
  titulo: Radio a partir del área
  enunciado: Un círculo tiene un área de $64\pi\text{ cm}^2$. ¿Cuánto mide su radio?
  alternativas:
  - text: $8\text{ cm}$.
    is_correct: true
  - text: $16\text{ cm}$.
    is_correct: false
  - text: $32\text{ cm}$.
    is_correct: false
  - text: $4\text{ cm}$.
    is_correct: false
  explicacion: $A = \pi r^2 \implies 64\pi = \pi r^2 \implies r^2 = 64 \implies r = 8\text{ cm}$.
- tipo: B
  titulo: Congruencia de radios
  enunciado: ¿Tienen todos los radios de una misma circunferencia exactamente la misma medida?
  respuesta: Sí
  explicacion: Sí. Por la propia definición de circunferencia, la distancia desde el centro al borde es una constante $r$ idéntica para todos los puntos.
errores_frecuentes:
- '''Confundir el radio con el diámetro ($r$ frente a $2r$).'''
- '''Olvidar que dos radios forman un triángulo isósceles con cualquier cuerda.'''
- '''Creer que el radio depende de la posición angular en que se trace.'''
afirmaciones_verdaderas:
- '''El radio es el segmento que une el centro con cualquier punto de la circunferencia.'''
- '''Todos los radios de una misma circunferencia son congruentes entre sí.'''
- '''El radio es perpendicular a la recta tangente en el punto de contacto.'''
al_terminar_debes_poder: '**QUÉ:** Identificar el radio de una circunferencia y utilizar su congruencia para resolver problemas métricos y angulares.


  **CÓMO:** Aplicando las relaciones $r = \frac{d}{2}$, $OA = OB = r$ y triángulos isósceles.


  ![Síntesis de radio](/static/img/nodos/identificacion-del-radio-como-segmento-desde-el-centro-hasta-la-circunferencia-resumen.svg)

  '
