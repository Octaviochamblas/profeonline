semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.LEY_COSENOS_LAL
resumen_inicial: 'Cálculo del tercer lado conocidos dos lados y el ángulo comprendido:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: A diferencia de la ley de senos, que requiere un par lado-ángulo
  opuesto completo, la ley de cosenos permite resolver directamente una configuración
  lado-ángulo-lado (LAL), sin ambigüedad.
explicacion_formal: '![Ley de cosenos: caso LAL](/static/img/geometria/trigonometria/oblicu-ley-cosenos-lal.svg)


  ### Definición formal


  De la ley de cosenos $a^2=b^2+c^2-2bc\cos A$, se obtiene directamente $a=\sqrt{b^2+c^2-2bc\cos
  A}$, sin necesidad de despejar ningún ángulo previamente.


  ### Desarrollo didáctico


  Si $b=7$, $c=9$ y $A=50°$, entonces $a=\sqrt{49+81-2\times7\times9\times\cos50°}\approx\sqrt{130-90{,}9}\approx\sqrt{39{,}1}\approx6{,}25$.'
definiciones_clave: '- **Cálculo del tercer lado conocidos dos lados y el ángulo comprendido**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del tercer lado conocidos dos lados
  y el ángulo comprendido.'
ejemplo_guiado:
  enunciado: Para analizar cálculo del tercer lado conocidos dos lados y el ángulo
    comprendido, considera un ángulo $\alpha = 40^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1147^\circ = 40^\circ$.
  pasos:
  - Identificar la propiedad de cálculo del tercer lado conocidos dos lados y el ángulo
    comprendido referida a $\alpha = 40^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1147 = 40 \implies x = 40 - 1147$.'
  - Concluir que la medida calculada para cálculo del tercer lado conocidos dos lados
    y el ángulo comprendido es $x = -1107^\circ$.
