- titulo: ¿Se cumple siempre la propiedad principal de cálculo del tercer lado conocidos
    dos lados y el ángulo comprendido en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede cálculo del tercer lado conocidos dos lados y el ángulo comprendido
