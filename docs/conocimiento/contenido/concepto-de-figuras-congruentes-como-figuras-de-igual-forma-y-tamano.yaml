semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.FIGURAS_CONGRUENTES_CONCEPTO
resumen_inicial: 'Dos figuras planas son congruentes si tienen exactamente la misma forma y el mismo tamaño, lo que significa que pueden coincidir punto a punto mediante un movimiento rígido (traslación, rotación o reflexión).'
explicacion_simple: |
  ![Concepto de Figuras Congruentes: Isometría e Igualdad](/static/img/nodos/concepto-de-figuras-congruentes-como-figuras-de-igual-forma-y-tamano-intro.svg)

  Son figuras idénticas como dos piezas de puzzle iguales: tienen la misma forma, el mismo tamaño y la misma área, aunque estén giradas o en otra posición.
explicacion_formal: |
  ### Definición formal
  En el espacio métrico euclidiano $(\mathbb{R}^2, d)$, dos figuras geométricas $F_1, F_2 \subset \mathbb{R}^2$ son **congruentes**, denotado $F_1 \cong F_2$, si y solo si existe una transformación isométrica $T: \mathbb{R}^2 \to \mathbb{R}^2$ tal que:

  $$T(F_1) = F_2 \quad \land \quad \forall P, Q \in \mathbb{R}^2, \ d(T(P), T(Q)) = d(P, Q)$$

  ### Desglose simbólico y geométrico
  - $T$: Isometría del plano (composición finita de traslaciones, rotaciones y reflexiones).
  - Conservación métrica: Conserva distancias ($\|\overline{T(A)T(B)}\| = \|\overline{AB}\|$) y ángulos ($\angle T(A)T(B)T(C) \cong \angle ABC$).
  - Relación de equivalencia: La congruencia es reflexiva ($F \cong F$), simétrica ($F_1 \cong F_2 \implies F_2 \cong F_1$) y transitiva ($F_1 \cong F_2 \land F_2 \cong F_3 \implies F_1 \cong F_3$).

  ### Síntesis didáctica
  La congruencia es el concepto más estricto de igualdad geométrica, garantizando la réplica exacta de piezas mecánicas, patrones arquitectónicos y figuras poligonales.
definiciones_clave: |
  - **Congruencia de figuras ($\cong$)**: Relación geométrica donde dos figuras tienen idéntica forma y tamaño.
  - **Isometría**: Transformación del plano (traslación, rotación o reflexión) que conserva distancias y ángulos.
  - **Vértices homólogos**: Vértices que ocupan la misma posición relativa en figuras congruentes.
  - **Lados y ángulos homólogos**: Elementos correspondientes que tienen exactamente la misma medida.
propiedades_relaciones: |
  - **CPCTC**: Las partes correspondientes de triángulos congruentes son congruentes entre sí.
  - **Invarianza métrica**: Si $\Delta ABC \cong \Delta DEF$, entonces $P(\Delta ABC) = P(\Delta DEF)$ y $\text{Área}(\Delta ABC) = \text{Área}(\Delta DEF)$.
  - **Cuatro Criterios Básicos**: LLL, LAL, ALA y $\text{LLA}_{>}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Concepto de Figuras Congruentes: Isometría e Igualdad](/static/img/nodos/concepto-de-figuras-congruentes-como-figuras-de-igual-forma-y-tamano-ejemplos.svg)

    Identifica la correspondencia de vértices y aplica los criterios de congruencia para deducir las medidas y relaciones solicitadas.
  pasos:
  - 'Paso 1: Analizar los datos geométricos dados (lados, ángulos y su posición relativa).'
  - 'Paso 2: Establecer la correspondencia de vértices homólogos entre ambos triángulos.'
  - 'Paso 3: Verificar qué criterio de congruencia (LLL, LAL, ALA o $\text{LLA}_{>}$) se cumple.'
  - 'Paso 4: Concluir formalmente $\Delta ABC \cong \Delta DEF$.'
  - 'Paso 5: Transferir las medidas incógnitas mediante el principio CPCTC.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición define formalmente que dos figuras sean congruentes?
  choices:
  - text: Tienen la misma forma, el mismo tamaño y existe una isometría que las superpone
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'Se define porque Tienen la misma forma, el mismo tamaño y existe una isometría que las superpone conservando distancias y ángulos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos triángulos son congruentes y el primero tiene área de 24 cm², ¿cuál es el área del segundo?
  choices:
  - text: $24\text{ cm}^2$
    is_correct: true
  - text: Opción incorrecta secundaria 1
    is_correct: false
  - text: Opción incorrecta secundaria 2
    is_correct: false
  - text: Opción incorrecta secundaria 3
    is_correct: false
  explanation: 'El área es $24\text{ cm}^2$, ya que toda transformación isométrica conserva invariantemente el área.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Registrar las longitudes de los lados y amplitudes angulares dadas en cada triángulo.'
- 'Paso 2: Comprobar si se cumple LLL (3 lados), LAL (2 lados y ángulo entre ellos), ALA (2 ángulos y lado entre ellos) o $\text{LLA}_{>}$ (2 lados y ángulo opuesto al mayor).'
- 'Paso 3: Declarar la congruencia con la notación $\cong$ respetando el orden de los vértices.'
- 'Paso 4: Deducir las igualdades restantes de lados y ángulos homólogos.'
- 'Paso 5: Comprobar la coherencia geométrica global.'
errores_correccion: 'No confundas semejanza con congruencia: el criterio AAA solo asegura que tienen la misma forma, no el mismo tamaño.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la conclusión correcta a partir de los datos de congruencia?
  alternativas:
  - '$24\text{ cm}^2$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$24\text{ cm}^2$'
  solucion_pasos:
  - 'El área es $24\text{ cm}^2$, ya que toda transformación isométrica conserva invariantemente el área.'
- titulo: Ejemplo 2
  enunciado: ¿Dos triángulos con los mismos tres ángulos (AAA) son siempre congruentes?
  alternativas:
  - No, solo son semejantes pero pueden tener distinto tamaño
  - Sí, son siempre congruentes
  - Solo si son triángulos rectángulos
  respuesta: No, solo son semejantes pero pueden tener distinto tamaño
  solucion_pasos:
  - 'Tener los mismos ángulos conserva la forma pero no fija el tamaño (por ejemplo, dos triángulos equiláteros de lados 2 cm y 10 cm tienen ángulos de 60° pero no son congruentes).'
- titulo: ¿Si dos triángulos son congruentes sus áreas son necesariamente iguales?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, como una isometría conserva todas las distancias y dimensiones, el área encerrada es estrictamente la misma.'
- titulo: ¿El criterio LAL permite que el ángulo esté en cualquier posición del triángulo?
  respuesta: 'No'
  solucion_pasos:
  - 'No, en el criterio LAL el ángulo DEBE estar obligatoriamente comprendido entre los dos lados dados.'
errores_frecuentes:
- 'Escribir la congruencia sin respetar el orden de los vértices homólogos (ej: escribir ΔABC ≅ ΔEDF en vez de ΔDEF).'
- 'Asumir que AAA garantiza congruencia cuando solo garantiza semejanza.'
- 'Aplicar LAL cuando el ángulo conocido no es el ángulo comprendido entre los dos lados.'
- 'Olvidar que en LLA el ángulo debe oponerse obligatoriamente al lado mayor para evitar el caso ambiguo.'
- 'Confundir igualdad numérica de medidas (AB = DE) con congruencia de figuras (ΔABC ≅ ΔDEF).'
afirmaciones_verdaderas:
- 'Dos figuras son congruentes si y solo si existe una isometría que las superpone exactamente.'
- 'Los cuatro criterios válidos de congruencia de triángulos son LLL, LAL, ALA y $\text{LLA}_{>}$.'
al_terminar_debes_poder: |
  **QUÉ:** Identificar, enunciar y aplicar los criterios y propiedades de congruencia de triángulos (LLL, LAL, ALA y $\text{LLA}_{>}$).

  **CÓMO:** Analizando los elementos homólogos, ordenando rigurosamente los vértices y deduciendo medidas con el principio CPCTC.

