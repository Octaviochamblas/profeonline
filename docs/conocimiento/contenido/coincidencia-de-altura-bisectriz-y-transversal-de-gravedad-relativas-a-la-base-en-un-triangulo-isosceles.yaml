semantic_id: MAT.GEO.NOTABLES_COINCIDENCIA.ISOSCELES_ELEMENTOS_BASE
resumen_inicial: 'En todo triángulo isósceles, el segmento trazado desde el vértice
  principal hacia la base desigual cumple simultáneamente cuatro funciones: es altura
  ($h_a$), bisectriz interior ($b_a$), transversal de gravedad ($t_a$) y pertenece
  a la simetral ($S_a$).'
explicacion_simple: '![Coincidencia en Isósceles](/static/img/nodos/coincidencia-de-altura-bisectriz-y-transversal-de-gravedad-relativas-a-la-base-en-un-triangulo-isosceles-intro.svg)


  En un triángulo isósceles (que tiene 2 lados iguales y una base diferente), la línea
  recta que baja desde la punta hasta la base es un **segmento "4 en 1"**:


  - **Es Altura**: Cae formando una escuadra perfecta de $90^\circ$ con la base.

  - **Es Bisectriz**: Parte el ángulo de la punta en dos mitades exactamente iguales.

  - **Es Transversal de Gravedad**: Llega justo al centro (punto medio) de la base
  ($BD = DC$).

  - **Es Simetral**: Es el espejo o eje de simetría que divide al triángulo en dos
  mitades gemelas.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo isósceles $\Delta ABC$ con lados congruentes $AB = AC$, el segmento
  trazado desde el vértice principal $A$ perpendicular a la base desigual $\overline{BC}$
  cumple simultáneamente las cuatro funciones de líneas notables:


  $$h_a \equiv b_a \equiv t_a \subset S_a \quad (\text{Eje de Simetría Axial})$$


  $$\Delta ABD \cong \Delta ACD \implies h_a = \sqrt{b^2 - (a/2)^2}$$


  ### Desglose simbólico y geométrico

  - Es altura: $h_a \perp \overline{BC}$.

  - Es bisectriz: $\angle BAD = \angle CAD = \alpha/2$.

  - Es transversal de gravedad: $BD = DC = a/2$.

  - Es simetral: Su recta soporte es perpendicular a la base en su punto medio.

  - Exclusividad: Esta coincidencia cuádruple ocurre únicamente en el segmento relativo
  a la base desigual.


  ### Síntesis didáctica

  En el triángulo isósceles la recta que pasa por el vértice principal es el eje de
  simetría de la figura, fusionando los cuatro roles en un solo segmento.'
definiciones_clave: '- **Triángulo isósceles**: Triángulo con al menos dos lados de
  igual longitud.

  - **Vértice principal**: Vértice común entre los dos lados congruentes de un triángulo
  isósceles.

  - **Eje de simetría axial**: Recta respecto de la cual una figura es invariante
  bajo una reflexión especular.

  '
propiedades_relaciones: '- **Identidad cuádruple en la base**: $h_a = b_a = t_a =
  S_a$.

  - **Congruencia bipartita**: $\Delta ABD \cong \Delta ACD$ (dos triángulos rectángulos
  simétricos).

  - **Cálculo de altura por Pitágoras**: $h_a = \sqrt{b^2 - (a/2)^2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Isósceles](/static/img/nodos/coincidencia-de-altura-bisectriz-y-transversal-de-gravedad-relativas-a-la-base-en-un-triangulo-isosceles-ejemplos.svg)


    En un triángulo isósceles $ABC$, los lados iguales miden $AB = AC = 13\text{ cm}$
    y la base mide $BC = 10\text{ cm}$. Se traza la altura $\overline{AD}$ hacia la
    base. Calcula la longitud de los segmentos $BD$ y $DC$, la medida de la altura
    $h_a$ y el área del triángulo.

    '
  pasos:
  - 'Paso 1: Aplicar la propiedad de coincidencia: la altura $\overline{AD}$ es también
    transversal de gravedad, luego divide la base en dos partes iguales.'
  - 'Paso 2: Calcular $BD = DC = \frac{BC}{2} = \frac{10}{2} = 5\text{ cm}$.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras en el triángulo rectángulo $\Delta ABD$:
    $h_a = \sqrt{13^2 - 5^2} = \sqrt{169 - 25} = \sqrt{144} = 12\text{ cm}$.'
  - 'Paso 4: Calcular el área total: $\text{Área} = \frac{\text{base} \times \text{altura}}{2}
    = \frac{10 \times 12}{2} = 60\text{ cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué líneas notables coinciden en la base de un triángulo isósceles?
  choices:
  - text: La altura, la bisectriz, la transversal de gravedad y la simetral
    is_correct: true
  - text: Solo la altura y la transversal de gravedad
    is_correct: false
  - text: Las tres alturas del triángulo
    is_correct: false
  - text: Ninguna, todas son diferentes
    is_correct: false
  explanation: En la base del isósceles coinciden la altura, la bisectriz, la transversal
    de gravedad y la simetral.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo isósceles de lados iguales a 5 cm la base mide 6 cm,
    ¿cuánto mide la altura relativa a la base?
  choices:
  - text: $4\text{ cm}$
    is_correct: true
  - text: $3\text{ cm}$
    is_correct: false
  - text: $5\text{ cm}$
    is_correct: false
  - text: $2.5\text{ cm}$
    is_correct: false
  explanation: La altura mide $4\text{ cm}$, ya que la mitad de la base es $3\text{
    cm}$ y por Pitágoras $h = \sqrt{5^2 - 3^2} = \sqrt{16} = 4\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el triángulo isósceles y ubicar el vértice principal y la base
  desigual.'
- 'Paso 2: Trazar el segmento desde el vértice principal hacia la base.'
- 'Paso 3: Utilizar simultáneamente que el segmento cae a $90^\circ$, llega al punto
  medio ($a/2$) y divide el ángulo ($\alpha/2$).'
- 'Paso 4: Aplicar el teorema de Pitágoras en uno de los dos triángulos rectángulos
  resultantes.'
errores_correccion: Recuerda que la coincidencia de las 4 líneas solo ocurre en el
  segmento relativo a la base desigual, no en los segmentos que van a los lados iguales.
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo isósceles, el ángulo en el vértice principal mide $70^\circ$.
    Si se traza la altura relativa a la base, ¿cuánto mide cada uno de los dos ángulos
    formados en dicho vértice?
  alternativas:
  - $35^\circ$
  - $70^\circ$
  - $90^\circ$
  respuesta: $35^\circ$
  solucion_pasos:
  - 'Por la propiedad de coincidencia, la altura hacia la base es también bisectriz
    interior: $70^\circ / 2 = 35^\circ$.'
- titulo: Ejemplo 2
  enunciado: ¿La altura trazada desde uno de los vértices de la base hacia uno de
    los lados iguales es también bisectriz?
  alternativas:
  - No, solo coincide en el segmento que va hacia la base desigual
  - Sí, siempre coincide en las tres alturas
  - Solo si el triángulo es rectángulo
  respuesta: No, solo coincide en el segmento que va hacia la base desigual
  solucion_pasos:
  - En el triángulo isósceles la coincidencia cuádruple ocurre únicamente en la recta
    de simetría relativa a la base.
- titulo: ¿En un triángulo isósceles la altura hacia la base llega siempre al punto
    medio de dicha base?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque coincide con la transversal de gravedad.
- titulo: ¿En un triángulo escaleno la altura hacia la base es también la bisectriz?
  respuesta: 'No'
  solucion_pasos:
  - No, en triángulos escalenos todas las líneas notables son rectas distintas.
errores_frecuentes:
- Asumir que las tres alturas del isósceles coinciden con sus bisectrices (solo la
  de la base).
- Olvidar que la altura a la base divide a la base en dos mitades ($a/2$).
- Confundir los lados iguales con la base al aplicar Pitágoras.
- Creer que la coincidencia solo ocurre en triángulos rectángulos.
- No reconocer que la línea es el eje de simetría axial del triángulo.
afirmaciones_verdaderas:
- En un triángulo isósceles, la altura, bisectriz, transversal de gravedad y simetral
  relativas a la base coinciden en un único segmento.
- El segmento notable relativo a la base divide al triángulo isósceles en dos triángulos
  rectángulos congruentes.
al_terminar_debes_poder: '**QUÉ:** Aplicar la coincidencia cuádruple de líneas notables
  relativas a la base en triángulos isósceles.


  **CÓMO:** Reconociendo que el segmento cumple $h_a = b_a = t_a = S_a$ y utilizando
  la partición simétrica en dos triángulos rectángulos congruentes ($h_a = \sqrt{b^2
  - (a/2)^2}$).


  ![Resumen de Isósceles](/static/img/nodos/coincidencia-de-altura-bisectriz-y-transversal-de-gravedad-relativas-a-la-base-en-un-triangulo-isosceles-resumen.svg)

  '
