semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.RESTRICCION_FUNCION_EXTERNA
resumen_inicial: 'Análisis de restricción de dominio de la función externa sobre la
  imagen intermedia: conceptos, representación y propiedades en Composición de funciones.'
explicacion_simple: Además de respetar las reglas de la función interna, el resultado
  que ella entrega debe también ser aceptable para la función externa que lo recibe
  a continuación.
explicacion_formal: '### Definición formal


  Además de exigir $x \in \text{Dom}(g)$, se debe exigir $g(x) \in \text{Dom}(f)$.
  Esta segunda condición se traduce en una restricción sobre $x$ que depende de la
  fórmula específica de $g$ y del dominio de $f$, y que suele expresarse resolviendo
  una inecuación o ecuación auxiliar.


  ### Desarrollo didáctico


  Esta es la restricción que más se olvida: no basta con que $x$ sea válido para $g$,
  el resultado de $g$ también debe ser digerible por $f$.


  Si $g(x)=x-7$ y $f(x)=\sqrt{x}$ (dominio $[0,+\infty[$): se necesita que el resultado
  intermedio $g(x)=x-7$ sea mayor o igual a cero, es decir $x\geq7$. Esta restricción
  proviene exclusivamente de la función externa $f$, no de $g$.'
definiciones_clave: '- **Análisis de restricción de dominio de la función externa
  sobre la imagen intermedia**: Elemento central en el estudio de funciones y modelos
  algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a análisis de restricción de dominio de la
  función externa sobre la imagen intermedia.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a análisis de restricción
    de dominio de la función externa sobre la imagen intermedia.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a análisis de restricción de dominio
    de la función externa sobre la imagen intermedia.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    análisis de restricción de dominio de la función externa sobre la imagen intermedia?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en composición de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en composición de funciones. Es la condición de
    existencia y unicidad en análisis de restricción de dominio de la función externa
    sobre la imagen intermedia.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en análisis de restricción
    de dominio de la función externa sobre la imagen intermedia, ¿qué procedimiento
    se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el dominio de la función externa $f$.'
- 'Paso 2: Plantea la condición $g(x) \in \text{Dom}(f)$, sustituyendo la fórmula
  de $g$.'
- 'Paso 3: Resuelve la ecuación o inecuación resultante para obtener la restricción
  sobre $x$.'
- 'Paso 4: Combina esta restricción con las propias de la función interna.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar análisis de restricción de dominio de la función externa sobre la imagen
  intermedia.
ejemplos:
- titulo: Restricción impuesta por una raíz externa
  enunciado: Si $g(x)=x+1$ y $f(x)=\sqrt{x}$, determina la restricción que $f$ impone
    sobre $g(x)$.
  solucion_pasos:
  - Se exige que $g(x)\geq0$, es decir $x+1\geq0$.
  - $x\geq-1$.
- titulo: Restricción impuesta por una fracción externa
  enunciado: Si $g(x)=2x$ y $f(x)=\frac{1}{x-6}$, determina la restricción que $f$
    impone sobre $g(x)$.
  solucion_pasos:
  - Se exige que $g(x)\neq6$, es decir $2x\neq6$.
  - $x\neq3$.
- titulo: ¿La restricción de la función externa depende de la fórmula de la función
    interna?
  enunciado: ¿La restricción de la función externa depende de la fórmula de la función
    interna?
  respuesta: Sí
  solucion_pasos:
  - La condición se traduce sustituyendo la fórmula de $g$ en la restricción del dominio
    de $f$.
- titulo: ¿Basta con conocer el dominio de $f$ como conjunto abstracto sin sustituir
    $g(x)$?
  enunciado: ¿Basta con conocer el dominio de $f$ como conjunto abstracto sin sustituir
    $g(x)$?
  respuesta: 'No'
  solucion_pasos:
  - Se debe sustituir la expresión de $g(x)$ en la restricción de $f$ para obtener
    una condición concreta sobre $x$.
errores_frecuentes:
- Olvidar por completo la restricción impuesta por la función externa, considerando
  solo la interna.
- Aplicar la restricción de $f$ directamente sobre $x$ en vez de sobre $g(x)$.
- No resolver correctamente la ecuación o inecuación auxiliar generada por la sustitución.
- Confundir esta restricción con la del dominio propio de $g$.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando análisis
  de restricción de dominio de la función externa sobre la imagen intermedia.
