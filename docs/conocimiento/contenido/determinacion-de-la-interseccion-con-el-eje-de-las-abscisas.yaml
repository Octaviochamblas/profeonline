semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_X
resumen_inicial: La intersección con el eje $X$ de una función afín se calcula haciendo
  $y = 0$, obteniendo el punto $\left(-\frac{n}{m}, 0\right)$.
explicacion_simple: 'El **eje de las abscisas** es el eje horizontal $X$.

  Para hallar el punto exacto donde la gráfica de una función afín $f(x) = m x + n$
  cruza este eje:

  1. Hacemos la salida $y = 0$ (planteando la ecuación $m x + n = 0$).

  2. Despejamos la variable $x$: $m x = -n \implies x = -\frac{n}{m}$.

  3. Escribimos el punto de corte cartesiano completo: $\left(-\frac{n}{m}, 0\right)$.'
explicacion_formal: 'La **intersección gráfica con el eje de las abscisas $X$** es
  el conjunto nivel cero:


  $$G(f) \cap \{(x, 0) \in \mathbb{R}^2 \mid x \in \mathbb{R}\} = \left\{\left(-\frac{n}{m},
  0\right)\right\}$$


  **Desglose de la fórmula:**

  - Resolución de la ecuación de primer grado $f(x) = 0 \implies m x + n = 0 \implies
  x = -\frac{n}{m}$ (con $m \neq 0$).'
definiciones_clave: '- **Intersección eje X (raíz de la función)**: Punto cartesiano
  $\left(-\frac{n}{m}, 0\right)$ donde el gráfico atraviesa el eje horizontal.'
propiedades_relaciones: '- **Cero de la función**: El valor $x = -\frac{n}{m}$ representa
  el cero o raíz real de la función afín.'
ejemplo_guiado:
  enunciado: Determina las coordenadas del punto de corte con el eje $X$ para la función
    afín $f(x) = 3x - 12$.
  pasos:
  - 'Paso 1: Igualar la función a cero: $3x - 12 = 0$.Paso 2: Trasponer el $-12$ sumando:
    $3x = 12$.Paso 3: Trasponer el $3$ dividiendo: $x = \frac{12}{3} = 4$.Paso 4:
    Escribir las coordenadas del punto de corte con el eje $X$: $(4, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $3x - 12 = 0$, ¿cuál es el punto de intersección de $f(x)
    = 3x - 12$ con el eje horizontal X?
  choices:
  - text: $(4, 0)$
    is_correct: true
  - text: $(0, 4)$
    is_correct: false
  - text: $(-12, 0)$
    is_correct: false
  - text: $(0, -12)$
    is_correct: false
  explanation: La alternativa correcta es '$(4, 0)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de la segunda coordenada (ordenada $y$) en la intersección
    con el eje de las abscisas?
  choices:
  - text: Siempre vale cero ($y = 0$).
    is_correct: true
  - text: Vale lo mismo que el coeficiente de posición $n$.
    is_correct: false
  - text: Vale 1.
    is_correct: false
  - text: Es igual a la pendiente $m$.
    is_correct: false
  explanation: La alternativa correcta es 'Siempre vale cero ($y = 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $f(x) = 0 \implies m x + n = 0$.'
- 'Paso 2: Despejar la variable $x = -\frac{n}{m}$.'
- 'Paso 3: Formar el par ordenado $\left(-\frac{n}{m}, 0\right)$.'
errores_correccion: '- **Error común:** Escribir $(0, 4)$ para la intersección con
  el eje $X$.

  - **Cómo corregirlo:** En el eje $X$, la coordenada de la $Y$ vale cero, por lo
  que el punto es $(4, 0)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
