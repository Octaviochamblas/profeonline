procedimiento:
- 'Paso 1: Iguala la función a cero, $mx+n=0$.'
- 'Paso 2: Despeja $x$, obteniendo $x = -n/m$.'
- 'Paso 3: El punto de intersección con el eje $x$ es $(-n/m, 0)$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar determinación de la intersección con el eje de las abscisas.
ejemplos:
- titulo: Cálculo directo
  enunciado: Determina la intersección con el eje $x$ de $f(x) = 3x - 9$.
  solucion_pasos:
  - Se resuelve $3x-9=0$.
  - $x=3$.
  - 'Punto de intersección: $(3, 0)$.'
- titulo: Intersección con pendiente negativa
  enunciado: Determina la intersección con el eje $x$ de $f(x) = -2x + 8$.
  solucion_pasos:
  - Se resuelve $-2x+8=0$.
  - $x=4$.
  - 'Punto de intersección: $(4, 0)$.'
- titulo: ¿La intersección con el eje $x$ de una función afín siempre tiene ordenada
    cero?
  enunciado: ¿La intersección con el eje $x$ de una función afín siempre tiene ordenada
    cero?
  respuesta: Sí
  solucion_pasos:
  - Por definición, el eje $x$ contiene exactamente los puntos con $y=0$.
- titulo: ¿Se puede calcular la intersección con el eje $x$ si $m=0$?
  enunciado: ¿Se puede calcular la intersección con el eje $x$ si $m=0$?
  respuesta: Depende
  solucion_pasos:
  - Si $m=0$ la función es constante; si $n=0$ toda la recta coincide con el eje x,
    y si $n\neq0$ la recta nunca lo corta.
errores_frecuentes:
- Confundir la intersección con el eje $x$ con la intersección con el eje $y$.
- Olvidar cambiar el signo al despejar $x$ en la ecuación $mx+n=0$.
- Dividir por $m$ sin verificar primero que $m \neq 0$.
- Expresar solo el valor de $x$ sin formar el punto completo $(x,0)$.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando determinación
  de la intersección con el eje de las abscisas.
