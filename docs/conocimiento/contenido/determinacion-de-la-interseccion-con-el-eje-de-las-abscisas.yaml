semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_X
resumen_inicial: La intersección con el eje de las abscisas ($X$) ocurre en el punto $(x_0, 0)$, donde la salida de la función afín se anula ($f(x_0) = 0$).
explicacion_simple: |
  El **eje de las abscisas** es el eje horizontal $X$:

  - Para encontrar dónde la recta cruza el suelo (eje $X$), debes hacer la altura **$y = 0$**.
  - Igualas la fórmula de la función a cero: $mx + b = 0$.
  - Despejas $x$: $x = -\frac{b}{m}$.
  - El punto de corte es de la forma $(-\frac{b}{m}, 0)$.
explicacion_formal: |
  Sea $f(x) = mx + b$ una función afín con $m \neq 0$. El conjunto intersección de su gráfica $\text{Graf}(f)$ con el eje de las abscisas $X = \{(x, 0) \mid x \in \mathbb{R}\}$ es el par ordenado único:

  $$\text{Graf}(f) \cap X = \left\{ \left(-\frac{b}{m}, 0\right) \right\}$$

  **Desglose de la abscisa al origen:**
  - $f(x) = 0 \iff mx + b = 0 \iff x = -\frac{b}{m}$
definiciones_clave: |
  - **Intersección con eje $X$**: Punto cartesiano de coordenadas $(x_0, 0)$ donde la recta afín corta al eje horizontal de las abscisas.
propiedades_relaciones: |
  - **Relación con el cero de la función**: La abscisa de intersección $x_0 = -\frac{b}{m}$ es numéricamente idéntica a la raíz o cero de la función.
ejemplo_guiado:
  enunciado: "Calcula el punto de intersección con el eje de las abscisas para la función afín $f(x) = 3x - 12$."
  pasos:
    - 'Paso 1: Hacer la variable dependiente $y = 0$: $3x - 12 = 0$.'
    - 'Paso 2: Sumar $12$ a ambos lados de la ecuación: $3x = 12$.'
    - 'Paso 3: Dividir entre $3$: $x = \frac{12}{3} = 4$.'
    - 'Paso 4: Escribir el punto cartesiano de intersección: $(4, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué punto corta al eje de las abscisas ($X$) la función afín $f(x) = 3x - 12$?'
    choices:
      - {text: '$(4, 0)$', is_correct: true}
      - {text: '$(0, -12)$', is_correct: false}
      - {text: '$(-4, 0)$', is_correct: false}
      - {text: '$(0, 4)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(4, 0)$''. $3x - 12 = 0 \implies 3x = 12 \implies x = 4$, por lo tanto el punto es $(4, 0)$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué coordenada de todo punto situado sobre el eje de las abscisas es siempre igual a cero?'
    choices:
      - {text: 'La ordenada $y = 0$.', is_correct: true}
      - {text: 'La abscisa $x = 0$.', is_correct: false}
      - {text: 'La pendiente $m = 0$.', is_correct: false}
      - {text: 'El coeficiente de posición $b = 0$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La ordenada $y = 0$.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Plantear la ecuación $f(x) = 0 \implies mx + b = 0$.'
  - 'Paso 2: Restar la constante $b$ a ambos lados: $mx = -b$.'
  - 'Paso 3: Dividir entre la pendiente $m$: $x = -\frac{b}{m}$.'
  - 'Paso 4: Expresar el resultado como par ordenado de la forma $(-\frac{b}{m}, 0)$.'
errores_correccion: |
  - **Error común:** Escribir el punto de corte con el eje $X$ como $(0, x_0)$ intercambiando las coordenadas.
  - **Cómo corregirlo:** En el eje de las **abscisas $X$**, la segunda componente (ordenada $y$) es SIEMPRE CERO: $(x_0, 0)$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La intersección de $f(x) = mx + b$ con el eje de las abscisas ocurre en el punto $(0, b)$.'
  - 'Para hallar la intersección con el eje $X$ se debe evaluar $f(0)$ en la función afín.'
  - 'La coordenada de la intersección con el eje $X$ de la función $f(x) = 2x + 6$ es $(0, -3)$.'
  - 'Una función afín con pendiente positiva no puede intersectar al eje de las abscisas.'
  - 'El punto de corte con el eje $X$ se calcula dividiendo la pendiente $m$ entre el coeficiente de posición $b$.'
afirmaciones_verdaderas:
  - 'El punto de intersección de una función afín $f(x) = mx + b$ con el eje de las abscisas ($X$) es de la forma $(x_0, 0)$, donde $x_0 = -\frac{b}{m}$.'
  - 'Todo punto situado sobre el eje de las abscisas tiene su ordenada igual a cero ($y = 0$).'
al_terminar_debes_poder: |
  QUÉ: Calcular las coordenadas exactas del punto de intersección de una función afín con el eje $X$.
  CÓMO: Resolver la ecuación $mx + b = 0$, hallar $x_0 = -\frac{b}{m}$ y redactar el par ordenado $(x_0, 0)$.
