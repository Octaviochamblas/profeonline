semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_X
resumen_inicial: 'Determinación de la intersección con el eje de las abscisas: conceptos,
  representación y propiedades en Función afín.'
explicacion_simple: Mientras que la intersección con el eje $y$ se lee directamente,
  la intersección con el eje $x$ exige resolver una pequeña ecuación.
explicacion_formal: '### Definición formal


  Dada $f(x) = mx+n$ con $m \neq 0$, su gráfica corta al eje $x$ en el punto donde
  $f(x)=0$: resolviendo $mx+n=0$ se obtiene $x = -\dfrac{n}{m}$, por lo que el punto
  de intersección es $\left(-\dfrac{n}{m}, 0\right)$.


  ### Desarrollo didáctico


  A diferencia de la intersección con el eje $y$ (que se lee directamente), esta requiere
  resolver la ecuación lineal $mx+n=0$, despejando $x$.


  Si $f(x) = 4x - 20$: se resuelve $4x-20=0$, obteniendo $x=5$. La intersección con
  el eje $x$ es el punto $(5, 0)$.'
definiciones_clave: '- **Determinación de la intersección con el eje de las abscisas**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación de la intersección con el
  eje de las abscisas.'
