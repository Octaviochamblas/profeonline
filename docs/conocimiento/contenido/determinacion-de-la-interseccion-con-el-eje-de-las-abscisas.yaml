semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_X
resumen_inicial: La intersección con el eje de las abscisas (eje X) es el punto cartesiano $\left(-\frac{n}{m}, 0\right)$ obtenido al resolver la ecuación $f(x) = 0$.
explicacion_simple: '![La intersección con el eje de las abscisas (eje X) es el punto cartesiano $\left(-\frac{n}{m}, 0\right)$ obtenido al resolver la ecuación $f(x) = 0$](/static/img/nodos/determinacion-de-la-interseccion-con-el-eje-de-las-abscisas-intro.svg)



  Para encontrar dónde corta la recta al **eje horizontal $X$**:

  1. Haces que la altura sea cero ($y = 0$).

  2. Igualas la fórmula de la función a cero: $mx + n = 0$.

  3. Despejas la $x$: $x = -\frac{n}{m}$.

  4. Escribes el punto de corte cartesiano: **$\left(-\frac{n}{m}, 0\right)$**.


  Este punto siempre tiene un $0$ en la segunda posición.'
explicacion_formal: "Dada una función afín $f(x) = mx + n$ con $m \\neq 0$, su intersección con el eje de abscisas $X = \\{(x, 0) \\in \\mathbb{R}^2 \\mid x \\in \\mathbb{R}\\}$ es el conjunto unitario:\n$$\\text{Graf}(f) \\cap \\text{Eje } X = \\left\\{ \\left(-\\frac{n}{m}, 0\\right) \\right\\}$$\n\n**Propiedades analíticas:**\n- **Existencia única**: Como $m \\neq 0$, la ecuación lineal $mx + n = 0$ posee solución única real $x = -\\frac{n}{m}$.\n- **Diferencia entre cero y punto de corte**:\n  - El **cero** de la función es el número real $x_0 = -\\frac{n}{m}$.\n  - El **punto de corte** es el par ordenado $\\left(-\\frac{n}{m}, 0\\right)$."
definiciones_clave: '- **Intersección con eje X**: Par cartesiano $(x_0, 0)$ donde la recta cruza la horizontal $y = 0$.

  - **Ordenada nula**: Condición obligatoria ($y = 0$) de todo punto sobre el eje $X$.'
propiedades_relaciones: '- **Trazado por cortes**: Conocer el corte en $Y$ $(0, n)$ y el corte en $X$ $(-n/m, 0)$ permite trazar la recta afín de forma inmediata.

  - **Triángulo fundamental**: Los dos cortes y el origen forman un triángulo rectángulo de catetos $|-n/m|$ y $|n|$ y área $A = \frac{n^2}{2|m|}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La intersección con el eje de las abscisas (eje X) es el punto cartesiano $\left(-\frac{n}{m}, 0\right)$ obtenido al resolver la ecuación $f(x) = 0$](/static/img/nodos/determinacion-de-la-interseccion-con-el-eje-de-las-abscisas-ejemplos.svg)



    Calcula el punto de intersección con el eje de las abscisas para la función afín $f(x) = -3x + 12$.'
  pasos:
  - 'Paso 1: Plantear la condición de corte con el eje X igualando a cero: $-3x + 12 = 0$.'
  - 'Paso 2: Restar 12 a ambos lados: $-3x = -12$.'
  - 'Paso 3: Dividir entre $-3$: $x = \frac{-12}{-3} = 4$.'
  - 'Paso 4: Escribir el punto de corte en formato cartesiano: $(4, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje X la función $f(x) = 2x - 10$?
  choices:
  - text: (5, 0)
    is_correct: true
  - text: (0, -10)
    is_correct: false
  - text: (-5, 0)
    is_correct: false
  - text: (0, 5)
    is_correct: false
  explanation: La alternativa correcta es '(5, 0)'. $2x - 10 = 0 \implies 2x = 10 \implies x = 5$, por lo que el punto es $(5, 0)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la recta $4x + 3y = 24$, ¿cuál es su intersección con el eje X?
  choices:
  - text: (6, 0)
    is_correct: true
  - text: (0, 8)
    is_correct: false
  - text: (-6, 0)
    is_correct: false
  - text: (8, 0)
    is_correct: false
  explanation: La alternativa correcta es '(6, 0)'. Haciendo $y = 0 \implies 4x = 24 \implies x = 6$, obteniendo $(6, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar la fórmula de la función afín a cero: $mx + n = 0$.'
- 'Paso 2: Trasponer el término constante: $mx = -n$.'
- 'Paso 3: Despejar la variable $x$: $x = -\frac{n}{m}$.'
- 'Paso 4: Expresar el resultado final como el par ordenado $\left(-\frac{n}{m}, 0\right)$.'
errores_correccion: '- **Error común:** Escribir el punto de corte con el eje X como $(0, x)$ en lugar de $(x, 0)$.

  - **Cómo corregirlo:** Sobre el eje horizontal $X$, **la altura $Y$ siempre es cero**, por lo que el cero va en segundo lugar: $(x, 0)$.'
ejemplos:
- titulo: 'Ejemplo 1: Corte con pendiente fraccionaria'
  enunciado: Halla el corte con el eje X de $f(x) = \frac{1}{2}x - 3$.
  alternativas:
  - (6, 0)
  - (0, -3)
  - (-6, 0)
  - (3/2, 0)
  respuesta: (6, 0)
  solucion_pasos:
  - 'Paso 1: $\frac{1}{2}x - 3 = 0 \implies \frac{1}{2}x = 3 \implies x = 6$.'
  - 'Paso 2: El punto es $(6, 0)$.'
- titulo: 'Ejemplo 2: Corte fraccionario'
  enunciado: Calcula el corte en el eje X de $g(x) = 5x + 7$.
  alternativas:
  - (-7/5, 0)
  - (7/5, 0)
  - (0, 7)
  - (-5/7, 0)
  respuesta: (-7/5, 0)
  solucion_pasos:
  - 'Paso 1: $5x + 7 = 0 \implies 5x = -7 \implies x = -\frac{7}{5}$.'
  - 'Paso 2: Punto: $(-\frac{7}{5}, 0)$.'
- titulo: 'Ejemplo 3: Doble signo negativo'
  enunciado: Determina el corte con el eje X de $h(x) = -4x - 20$.
  alternativas:
  - (-5, 0)
  - (5, 0)
  - (0, -20)
  - (-20, 0)
  respuesta: (-5, 0)
  solucion_pasos:
  - 'Paso 1: $-4x - 20 = 0 \implies -4x = 20 \implies x = -5$.'
  - 'Paso 2: Punto: $(-5, 0)$.'
- titulo: 'Ejemplo 4: Corte desde gráfica'
  enunciado: Si la gráfica de una función afín corta al eje horizontal en 3 unidades a la izquierda del origen, ¿cuál es el punto?
  alternativas:
  - (-3, 0)
  - (0, -3)
  - (3, 0)
  - (0, 3)
  respuesta: (-3, 0)
  solucion_pasos:
  - 'Paso 1: A la izquierda del origen en el eje X es $x = -3$, luego el punto es $(-3, 0)$.'
errores_frecuentes:
- Invertir las coordenadas escribiendo (0, -n/m).
- Olvidar el cambio de signo al trasponer n.
- Dividir n entre m sin el signo negativo de la fórmula general.
afirmaciones_verdaderas:
- La intersección con el eje X es el punto (-n/m, 0) donde la gráfica corta al eje horizontal.
- Toda función afín con m != 0 posee exactamente un punto de corte con el eje de las abscisas.
al_terminar_debes_poder: '**QUÉ:** Determinar el punto de corte con el eje de las abscisas en funciones afines.


  **CÓMO:** Resolviendo la ecuación f(x) = 0 y expresando el resultado formalmente como el par cartesiano (-n/m, 0).


  ![Resumen La intersección con el eje de las abscisas (eje X) es el punto cartesiano $\left(-\frac{n}{m}, 0\right)$ obtenido al resolver la ecuación $f(x) = 0$](/static/img/nodos/determinacion-de-la-interseccion-con-el-eje-de-las-abscisas-resumen.svg)'
