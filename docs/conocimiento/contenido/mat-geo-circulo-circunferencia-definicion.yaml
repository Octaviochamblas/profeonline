semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CIRCUNFERENCIA_DEFINICION
resumen_inicial: 'Definición de circunferencia como línea curva cerrada formada por
  puntos equidistantes de un centro: conceptos, teoremas, propiedades geométricas
  y cálculo en Circunferencia y Círculo.'
explicacion_simple: Antes de estudiar sus propiedades y elementos, es fundamental
  comprender qué es exactamente una circunferencia desde un punto de vista matemático
  preciso.
explicacion_formal: '![Circunferencia: puntos equidistantes del centro](/static/img/geometria/circunferencia-circulo/circulo-circunferencia-definicion.svg)


  ### Definición formal


  Dado un punto $O$ (centro) y una distancia $r$ (radio), la circunferencia es el
  conjunto de puntos $P$ del plano tales que $\overline{OP}=r$.


  ### Desarrollo didáctico


  La circunferencia es solo la LÍNEA (el borde), no la región interior; esto la distingue
  del círculo, que sí incluye la región interior. Es la misma diferencia entre el
  borde de una moneda y la moneda completa.'
definiciones_clave: '- **Definición de circunferencia como línea curva cerrada formada
  por puntos equidistantes de un centro**: Elemento o propiedad fundamental en el
  estudio de circunferencia y círculo.'
