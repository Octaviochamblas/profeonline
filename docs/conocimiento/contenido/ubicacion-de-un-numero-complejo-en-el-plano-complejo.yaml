semantic_id: MAT.NUM.COMPLEJOS.PLANO_COMPLEJO
resumen_inicial: El plano complejo (o Plano de Argand) representa los números complejos
  ubicando la parte real en el eje horizontal (Eje Real) y la parte imaginaria en
  el eje vertical (Eje Imaginario).
explicacion_simple: 'Para graficar un complejo $z = a + bi$ en el **Plano Complejo**:

  1. Mueves $a$ unidades horizontalmente en el **Eje Real (Re)**.

  2. Mueves $b$ unidades verticalmente en el **Eje Imaginario (Im)**.

  3. El punto $(a, b)$ o el vector dibujado desde el origen $(0,0)$ representa al
  número complejo $z$.'
explicacion_formal: El plano complejo es una representación geométrica de $\mathbb{C}$
  donde cada número $z = a + bi$ se ubica como un afijo o vector posición $\vec{v}
  = (a, b)$ en el sistema de ejes ortogonales $\text{Re}(z)$ (eje $X$) e $\text{Im}(z)$
  (eje $Y$).
definiciones_clave: '- **Eje Real (Re)**: Eje horizontal del plano complejo.

  - **Eje Imaginario (Im)**: Eje vertical del plano complejo.

  - **Afijo**: Punto $(a,b)$ que representa a $z$ en el plano.'
propiedades_relaciones: '- **Simetrías**: El conjugado $\bar{z} = a - bi$ es la reflexión
  de $z$ respecto al eje real.'
ejemplo_guiado:
  enunciado: Describe en qué cuadrante del plano complejo se ubica $z = -3 - 4i$.
  pasos:
  - Identificar $\text{Re}(z) = -3$ (negativo, a la izquierda en eje Re).
  - Identificar $\text{Im}(z) = -4$ (negativo, hacia abajo en eje Im).
  - Ubicar las coordenadas $(-3, -4)$.
  - Concluir que el punto se encuentra en el **Tercer Cuadrante (III C)**.
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué eje se ubica un número imaginario puro de la forma $z = 5i$?
  choices:
  - text: En el Eje Imaginario (eje vertical)
    is_correct: true
  - text: En el Eje Real (eje horizontal)
    is_correct: false
  - text: En el origen de coordenadas
    is_correct: false
  - text: En el primer cuadrante
    is_correct: false
  explanation: 'La correcta es: En el Eje Imaginario (eje vertical). Al ser parte
    real 0, se sitúa sobre el eje de las ordenadas (Im).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué cuadrante del plano complejo está $z = 4 - 2i$?
  choices:
  - text: Cuarto Cuadrante (IV C)
    is_correct: true
  - text: Primer Cuadrante (I C)
    is_correct: false
  - text: Segundo Cuadrante (II C)
    is_correct: false
  - text: Tercer Cuadrante (III C)
    is_correct: false
  explanation: 'La correcta es: Cuarto Cuadrante (IV C). Parte real positiva (+4)
    y parte imaginaria negativa (-2).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar los ejes Re (horizontal) e Im (vertical).'
- 'Paso 2: Ubicar la parte real $a$ sobre el eje Re.'
- 'Paso 3: Ubicar la parte imaginaria $b$ sobre el eje Im.'
- 'Paso 4: Marcar el punto de intersección $(a,b)$.'
errores_correccion: No confundas los ejes. El eje horizontal representa la parte REAL
  y el vertical la parte IMAGINARIA.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Dónde se ubica $z = -6$?
  alternativas:
  - En el Eje Real
  - En el Eje Imaginario
  - En el cuadrante II
  respuesta: En el Eje Real
  solucion_pasos:
  - Parte imaginaria 0 $\implies$ sobre el Eje Real.
errores_frecuentes:
- Invertir la posición de los ejes real e imaginario.
afirmaciones_verdaderas:
- El Eje Real es horizontal y el Eje Imaginario es vertical.
al_terminar_debes_poder: Ubicar números complejos en el plano de Argand identificando
  sus cuadrantes o ejes.
fuente: Texto escolar MINEDUC.
estado: publicado
