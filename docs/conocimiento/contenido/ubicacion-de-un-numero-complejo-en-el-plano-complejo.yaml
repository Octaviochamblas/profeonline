semantic_id: MAT.NUM.NUMEROS_COMPLEJOS.PLANO_COMPLEJO
resumen_inicial: Un número complejo $z = a + bi$ se representa en el plano complejo de Argand-Gauss mediante su punto afijo $P(a, b)$ o como un vector posición que va desde el origen $(0,0)$ hasta $(a,b)$.
explicacion_simple: "![Ubicación en el plano complejo](/static/img/nodos/ubicacion-de-un-numero-complejo-en-el-plano-complejo-intro.svg)\n\nEl **plano complejo** (o plano de Argand-Gauss) es similar al plano cartesiano tradicional:\n- El **eje horizontal** es el **Eje Real** (donde se ubica $a = \\operatorname{Re}(z)$).\n- El **eje vertical** es el **Eje Imaginario** (donde se ubica $b = \\operatorname{Im}(z)$).\n- El punto que representa al número complejo se llama **afijo**: $P(a, b)$.\n- Cuadrantes:\n  - **I:** $a > 0, b > 0$\n  - **II:** $a < 0, b > 0$\n  - **III:** $a < 0, b < 0$\n  - **IV:** $a > 0, b < 0$"
explicacion_formal: 'El **plano complejo de Argand-Gauss** es una representación geométrica bidimensional donde se establece una biyección entre $\mathbb{C}$ y los puntos del plano $\mathbb{R}^2$:


  $$z = a + bi \longleftrightarrow P(a, b) \in \mathbb{R}^2$$


  **Elementos Geométricos:**

  1. **Afijo:** Punto geométrico $P(a, b)$.

  2. **Vector Posición:** Vector $\vec{v} = \langle a, b \rangle$ con origen en $(0, 0)$ y extremo en $P$.

  3. **Eje Real (Re):** Recta $y = 0$ que contiene a todos los números reales ($z = a + 0i$).

  4. **Eje Imaginario (Im):** Recta $x = 0$ que contiene a los números imaginarios puros ($z = 0 + bi$).'
definiciones_clave: '- **Plano de Argand-Gauss**: Sistema coordenado bidimensional con eje horizontal Real y vertical Imaginario.

  - **Afijo ($P(a, b)$)**: Punto en el plano que representa al número complejo.

  - **Vector posición**: Segmento orientado desde el origen hasta el afijo.'
propiedades_relaciones: '- **Suma como regla del paralelogramo**: La suma $z_1 + z_2$ corresponde a la suma vectorial en el plano.

  - **Módulo como longitud**: La longitud del vector posición es exactamente el módulo $|z| = \sqrt{a^2 + b^2}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de plano complejo](/static/img/nodos/ubicacion-de-un-numero-complejo-en-el-plano-complejo-ejemplos.svg)


    Determine el cuadrante del plano donde se ubica $z_1 = -5 - 2i$ e identifique la posición de $z_2 = 4$ y $z_3 = -3i$.'
  pasos:
  - 'Paso 1: Para $z_1 = -5 - 2i$: $\operatorname{Re}(z_1) = -5 < 0$ (izquierda) e $\operatorname{Im}(z_1) = -2 < 0$ (abajo).'
  - 'Paso 2: Ambos signos negativos sitúan el afijo $P(-5, -2)$ en el **III Cuadrante**.'
  - 'Paso 3: Para $z_2 = 4 = (4, 0)$: Se ubica sobre el **Eje Real positivo**.'
  - 'Paso 4: Para $z_3 = -3i = (0, -3)$: Se ubica sobre el **Eje Imaginario negativo**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué cuadrante del plano complejo se ubica el número $z = -4 + 6i$?
  choices:
  - text: II Cuadrante (parte real negativa y parte imaginaria positiva)
    is_correct: true
  - text: I Cuadrante
    is_correct: false
  - text: III Cuadrante
    is_correct: false
  - text: IV Cuadrante
    is_correct: false
  explanation: La alternativa correcta es 'II Cuadrante (parte real negativa y parte imaginaria positiva)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿dónde se ubica el número complejo $z_3 = -3i$?
  choices:
  - text: Sobre el eje imaginario negativo (eje vertical inferior)
    is_correct: true
  - text: En el III Cuadrante
    is_correct: false
  - text: Sobre el eje real negativo
    is_correct: false
  - text: En el origen $(0,0)$
    is_correct: false
  explanation: La alternativa correcta es 'Sobre el eje imaginario negativo (eje vertical inferior)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las coordenadas $(a, b) = (\operatorname{Re}(z), \operatorname{Im}(z))$.'
- 'Paso 2: Ubicar $a$ sobre el eje horizontal Real y $b$ sobre el eje vertical Imaginario.'
- 'Paso 3: Trazar el punto afijo $P(a, b)$ y el vector desde el origen $(0,0)$ si se requiere.'
errores_correccion: '- **Error 1: Invertir los ejes (ubicar la parte real en el eje vertical).** **Cómo corregirlo:** El eje horizontal es SIEMPRE el Real y el eje vertical es SIEMPRE el Imaginario.

  - **Error 2: Ubicar números imaginarios puros fuera del eje vertical.** **Cómo corregirlo:** Si $a = 0$, el punto está exactamente sobre el eje imaginario ($Y$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿En qué cuadrante se encuentra el afijo de $z = 7 - 9i$?
  alternativas:
  - IV Cuadrante
  - I Cuadrante
  - II Cuadrante
  respuesta: IV Cuadrante
  solucion_pasos:
  - $a = 7 > 0$ (derecha) y $b = -9 < 0$ (abajo) $\implies$ IV Cuadrante.
- titulo: Ejemplo 2
  enunciado: ¿Dónde se localiza el número complejo $z = -8 + 0i$ en el plano?
  alternativas:
  - Sobre el Eje Real negativo
  - Sobre el Eje Imaginario
  - En el II Cuadrante
  respuesta: Sobre el Eje Real negativo
  solucion_pasos:
  - Como $b = 0$, su afijo $(-8, 0)$ está sobre el eje horizontal.
- titulo: ¿Se denomina afijo al punto P(a, b) que representa a z en el plano?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de geometría analítica compleja.
  alternativas:
  - texto: Sí, el afijo es el punto P(a, b)
    es_correcta: true
    retroalimentacion: ¡Correcto! Término geométrico formal.
  - texto: No, se llama módulo
    es_correcta: false
    retroalimentacion: Incorrecto, el módulo es la distancia.
  - texto: No, se llama argumento
    es_correcta: false
    retroalimentacion: Incorrecto, el argumento es el ángulo.
- titulo: ¿Tiene el origen (0, 0) módulo cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|0| = \sqrt{0^2 + 0^2} = 0$.
  alternativas:
  - texto: Sí, es el único complejo con módulo cero
    es_correcta: true
    retroalimentacion: ¡Correcto! Elemento nulo en el origen.
  - texto: No, el módulo siempre es estrictamente positivo
    es_correcta: false
    retroalimentacion: Incorrecto, el cero tiene módulo 0.
  - texto: No, está indefinido
    es_correcta: false
    retroalimentacion: Incorrecto, el módulo de 0 es 0.
errores_frecuentes:
- Invertir los ejes de coordenadas al graficar.
- Confundir cuadrantes por errores en los signos de $a$ o $b$.
- Ubicar números reales sobre el eje vertical en vez del horizontal.
- Asumir que el plano complejo incluye una tercera dimensión.
afirmaciones_verdaderas:
- El plano complejo de Argand-Gauss representa a $\operatorname{Re}(z)$ en el eje horizontal y a $\operatorname{Im}(z)$ en el eje vertical.
- El punto $P(a, b)$ se denomina afijo del número complejo $z = a + bi$.
- Los números reales ocupan el eje horizontal y los imaginarios puros el eje vertical.
al_terminar_debes_poder: '![Síntesis de plano complejo](/static/img/nodos/ubicacion-de-un-numero-complejo-en-el-plano-complejo-resumen.svg)


  QUÉ: Representar y ubicar números complejos en el plano de Argand-Gauss.


  CÓMO: Graficando el afijo $P(a, b)$ sobre el eje horizontal Real y el eje vertical Imaginario, y determinando el cuadrante o eje correspondiente.'
