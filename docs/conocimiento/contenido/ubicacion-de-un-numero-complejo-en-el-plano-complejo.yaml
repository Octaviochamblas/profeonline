resumen_inicial: El plano complejo (o diagrama de Argand) ubica la parte real $\text{Re}(z)$
  sobre el eje horizontal $X$ y la parte imaginaria $\text{Im}(z)$ sobre el eje vertical
  $Y$.
explicacion_simple: El plano complejo es un plano cartesiano especial. En el eje horizontal
  (eje real) medimos la parte real $a$, y en el eje vertical (eje imaginario) medimos
  el coeficiente $b$ de la parte imaginaria.
explicacion_formal: 'El **Plano de Argand-Gauss** representa cada $z = a + bi$ como
  un vector o punto geométrico de posición:


  $$P(z) = (a, b) \quad \text{con Eje Real } X \text{ y Eje Imaginario } Y$$


  **Cuadrantes geométricos:**

  - Cuadrante I: $a > 0, b > 0$.

  - Cuadrante II: $a < 0, b > 0$.

  - Cuadrante III: $a < 0, b < 0$.

  - Cuadrante IV: $a > 0, b < 0$.'
definiciones_clave: '- **Plano complejo**: Sistema de ejes cartesianos con Eje Real
  $X$ y Eje Imaginario $Y$.'
propiedades_relaciones: '- **Representación vectorial**: Vector posición con origen
  $(0,0)$ y extremo $(a,b)$.'
ejemplo_guiado:
  enunciado: Determine el cuadrante del plano complejo donde se ubica $z = -4 + 5i$.
  pasos:
  - 'Paso 1: Identificar $\text{Re}(z) = -4$ (coordenada $X$ negativa).'
  - 'Paso 2: Identificar $\text{Im}(z) = 5$ (coordenada $Y$ positiva).'
  - 'Paso 3: Unir coordenadas $(-4, 5) \implies$ Cuadrante II.'
  - 'Conclusión: $z = -4 + 5i$ se ubica en el Cuadrante II.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ejes componen el plano complejo o de Argand?
  choices:
  - text: Eje horizontal Real (X) y eje vertical Imaginario (Y)
    is_correct: true
  - text: Eje horizontal Imaginario y vertical Real
    is_correct: false
  - text: Dos ejes imaginarios
    is_correct: false
  - text: Un solo eje unidimensional
    is_correct: false
  explanation: La alternativa correcta es 'Eje horizontal Real (X) y eje vertical
    Imaginario (Y)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para z = -4 + 5i, ¿en qué cuadrante quedó ubicado?
  choices:
  - text: Cuadrante II (X < 0, Y > 0)
    is_correct: true
  - text: Cuadrante I
    is_correct: false
  - text: Cuadrante III
    is_correct: false
  - text: Cuadrante IV
    is_correct: false
  explanation: La alternativa correcta es 'Cuadrante II (X < 0, Y > 0)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de ubicar números complejos $z =
  a + bi$ en el plano complejo de Argand, determinando su cuadrante o posición sobre
  los ejes.
semantic_id: MAT.NUM.COMPLEJOS.PLANO_COMPLEJO
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.PLANO_COMPLEJO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
estado: publicado
