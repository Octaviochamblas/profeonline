semantic_id: MAT.NUM.COMPLEJOS.PLANO_COMPLEJO
resumen_inicial: 'El plano complejo o de Argand es un sistema bidimensional de ejes ortogonales donde la parte real $a$ se ubica en el eje horizontal y la parte imaginaria $b$ en el eje vertical.'
explicacion_simple: |
  Para dibujar o graficar números complejos en geometría, se usa un plano especial llamado **Plano de Argand**. Funciona exactamente como el plano cartesiano del colegio, con una sola diferencia en el nombre de los ejes: el eje horizontal (eje X) se llama **Eje Real** y el eje vertical (eje Y) se llama **Eje Imaginario**. Para ubicar $z = 3 - 2i$, avanzas 3 unidades a la derecha en el eje horizontal y bajas 2 unidades en el eje vertical, marcando el punto $(3, -2)$.
explicacion_formal: |
  ### Definición formal
  El **plano complejo (o plano de Argand-Gauss)** es la representación geométrica del conjunto $\mathbb{C}$ mediante un sistema de coordenadas cartesianas bidimensionales:
  - **Eje Real ($\operatorname{Re}$)**: Eje de abscisas horizontal donde se posiciona la parte real $a$.
  - **Eje Imaginario ($\operatorname{Im}$)**: Eje de ordenadas vertical donde se posiciona la parte imaginaria $b$.

  ### Representación dual punto-vector
  Todo número complejo $z = a + bi \equiv (a, b)$ admite dos representaciones geométricas en el plano:
  1. **Afiio de $z$**: El punto puntual de coordenadas $(a, b)$ en el plano.
  2. **Vector de posición**: El vector cuyo origen es el punto $(0, 0)$ y cuyo extremo es el afijo $(a, b)$.

  ### Cuadrantes y ejes especiales
  - **Eje Real**: Contiene a todos los números reales puros de la forma $(a, 0)$.
  - **Eje Imaginario**: Contiene a todos los números imaginarios puros de la forma $(0, b)$.
  - **Cuadrante I**: $a > 0, b > 0$.
  - **Cuadrante II**: $a < 0, b > 0$.
  - **Cuadrante III**: $a < 0, b < 0$.
  - **Cuadrante IV**: $a > 0, b < 0$.

  ### Síntesis didáctica
  - Eje horizontal: Parte real $a$.
  - Eje vertical: Coeficiente imaginario $b$.
definiciones_clave: |
  - **Plano de Argand**: Sistema cartesiano bidimensional donde el eje X es real y el eje Y es imaginario.
  - **Afijo de un número complejo**: Punto geométrico $(a, b)$ en el plano que representa al complejo $z = a + bi$.
  - **Vector de posición**: Flecha orientada dirigida desde el origen $(0, 0)$ hasta el afijo $(a, b)$.
propiedades_relaciones: |
  - **Geometría de la suma**: La suma de números complejos $z_1 + z_2$ equivale geométricamente a la regla del paralelogramo para la adición de vectores en $\mathbb{R}^2$.
  - **Simetría del conjugado**: El conjugado $\bar{z} = a - bi$ es la simetría especular del afijo $(a, b)$ respecto al eje real horizontal.
ejemplo_guiado:
  enunciado: 'Determina en qué cuadrante del plano complejo se ubica el afijo del número complejo $z = -4 - 5i$ e indica sus coordenadas cartesianas.'
  pasos:
    - 'Paso 1: Identificamos la parte real del complejo: $a = \operatorname{Re}(z) = -4$.'
    - 'Paso 2: Identificamos la parte imaginaria del complejo: $b = \operatorname{Im}(z) = -5$.'
    - 'Paso 3: Construimos el afijo o par ordenado cartesiano: $(-4, -5)$.'
    - 'Paso 4: Evaluamos los signos de las componentes: Como la parte real es negativa ($a < 0$) y la parte imaginaria es negativa ($b < 0$), el número se ubica en el **Tercer Cuadrante (III Cuadrante)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Sobre qué eje especial del plano de Argand se ubican los números imaginarios puros de la forma $z = 0 + bi$?'
    choices:
      - {text: 'Sobre el eje imaginario vertical ($Y$)', is_correct: true}
      - {text: 'Sobre el eje real horizontal ($X$)', is_correct: false}
      - {text: 'Sobre la bisectriz del primer cuadrante', is_correct: false}
      - {text: 'En el origen de coordenadas únicamente', is_correct: false}
    explanation: 'La alternativa correcta es ''Sobre el eje imaginario vertical ($Y$)''. Al ser $a=0$, las coordenadas $(0, b)$ se posicionan directamente sobre el eje vertical.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué cuadrante del plano complejo se encuentra posicionado el afijo de $z = 6 - 3i$?'
    choices:
      - {text: 'Cuadrante IV, por tener parte real positiva ($a > 0$) y parte imaginaria negativa ($b < 0$)', is_correct: true}
      - {text: 'Cuadrante I, por tener números', is_correct: false}
      - {text: 'Cuadrante II, por el signo menos', is_correct: false}
      - {text: 'Cuadrante III, por la resta', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuadrante IV, por tener parte real positiva ($a > 0$) y parte imaginaria negativa ($b < 0$)''. Coordenadas $(6, -3)$ están en el cuarto cuadrante.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la parte real $a$ y la parte imaginaria $b$ del número complejo.'
  - 'Paso 2: Dibujar o identificar los ejes ortogonales (Eje Real horizontal y Eje Imaginario vertical).'
  - 'Paso 3: Desplazarse $a$ unidades horizontalmente sobre el eje real y $b$ unidades verticalmente sobre el eje imaginario.'
  - 'Paso 4: Marcar el punto o afijo $(a, b)$ y trazar opcionalmente el vector desde el origen $(0, 0)$.'
errores_correccion: |
  - **Error 1:** Ubicar la parte imaginaria en el eje horizontal y la parte real en el eje vertical. **Cómo corregirlo:** En el plano complejo, la convención universal fija el **eje horizontal para la parte real** ($a$) y el **eje vertical para la parte imaginaria** ($b$).
  - **Error 2:** Creer que un número real puro como $z = -5$ no se puede graficar en el plano complejo. **Cómo corregirlo:** Todo número real puro se grafica como un punto sobre el **eje real horizontal** en la coordenada $(-5, 0)$.
ejemplos:
  - titulo: 'Ubicación en el Cuadrante II'
    enunciado: '¿El afijo del complejo $z = -2 + 7i$ se ubica en el Cuadrante II?'
    alternativas:
      - 'Sí, pues $a = -2 < 0$ y $b = 7 > 0$'
      - 'No, está en el Cuadrante I'
      - 'No, está en el Cuadrante III'
    respuesta: 'Sí, pues $a = -2 < 0$ y $b = 7 > 0$'
    solucion_pasos:
      - '1. Coordenadas: $(-2, 7)$.'
      - '2. Abscisa negativa y ordenada positiva $\implies$ Cuadrante II.'
  - titulo: 'Ubicación de un número real puro en el plano'
    enunciado: '¿El afijo del número $z = 4$ se sitúa sobre el eje real a la derecha del origen?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Coordenadas $(4, 0)$ sobre el eje real positivo.'
  - titulo: 'Ubicación de un imaginario puro negativo'
    enunciado: '¿El afijo del número $z = -3i$ se sitúa sobre el eje imaginario por debajo del origen?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Coordenadas $(0, -3)$ sobre el eje imaginario negativo.'
  - titulo: 'Vector de posición del origen'
    enunciado: '¿El vector de posición del complejo $z = 0$ tiene longitud igual a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Se ubica exactamente en el origen $(0, 0)$.'
errores_frecuentes:
  - 'Invertir la posición de los ejes colocando la parte real en el eje vertical y la imaginaria en el horizontal.'
  - 'Ubicar los números imaginarios puros fuera de los ejes cartesianos principal.'
  - 'El afijo o punto $(a, b)$ en el plano representa numéricamente la distancia o magnitud escalar del número complejo.'
  - 'Graficar la parte imaginaria considerando la letra $i$ como una unidad de distancia física.'
  - 'Asignar incorrectamente el cuadrante debido a la falta de atención en los signos de las componentes $a$ y $b$.'
afirmaciones_verdaderas:
  - 'En el plano de Argand, la parte real $a$ se representa en el eje horizontal (eje real) y la parte imaginaria $b$ en el eje vertical (eje imaginario).'
  - 'El afijo de un número complejo $z = a + bi$ es el punto de coordenadas cartesianas $(a, b)$ en el plano complejo.'
al_terminar_debes_poder: 'Ubicar y graficar el afijo $(a, b)$ de cualquier número complejo en el plano cartesiano complejo (Plano de Argand).'
