semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_CIRCUNFERENCIA_RADIO
resumen_inicial: La longitud de una circunferencia se calcula mediante la fórmula lineal P = 2πr, midiendo el perímetro del contorno exterior a partir de su radio.
explicacion_simple: 'Imagina que tomas una cuerda, la colocas siguiendo todo el borde de una rueda redonda hasta dar una vuelta completa, y luego estiras la cuerda en una línea recta sobre una huincha de medir. La longitud de esa cuerda estirada es el **perímetro** o **longitud de la circunferencia**.


  La fórmula matemática para calcularlo directamente conociendo el radio ($r$) es **$P = 2\pi r$**. El número $\pi$ (aproximadamente $3,1416$) es la constante que relaciona el radio con el giro completo. Como es una distancia de contorno, se mide en unidades lineales simples como centímetros ($\text{cm}$) o metros ($\text{m}$), ¡sin exponentes al cuadrado!


  ![Longitud de la circunferencia con 2πr](/static/img/nodos/calculo-de-la-longitud-de-la-circunferencia-usando-2r-intro.svg)

  '
explicacion_formal: '### Definición métrica de la longitud de la circunferencia

  Sea $\mathcal{C}(O, r)$ una circunferencia en el plano euclidiano $\mathbb{R}^2$ de centro $O$ y radio $r > 0$. La **longitud** o **perímetro** $P$ de $\mathcal{C}$ se define formalmente como la integral de línea del elemento de arco a lo largo de la curva cerrada parametrizada $\gamma(t) = (r\cos t, r\sin t)$ para $t \in [0, 2\pi]$:

  $$P = \oint_{\mathcal{C}} ds = \int_0^{2\pi} \|\gamma''(t)\|\, dt = \int_0^{2\pi} r\, dt = 2\pi r$$


  ### Relación de proporcionalidad y despejes métricos

  La longitud es estrictamente proporcional al radio de la figura:

  - Si el radio se multiplica por un factor de escala $k$ ($r'' = k \cdot r$), el perímetro se escala por el mismo factor lineal: $P'' = k \cdot P$.

  - Conociendo el perímetro total $P$, el radio se despeja unívocamente mediante la ecuación lineal:

  $$r = \frac{P}{2\pi}$$


  > **Complemento didáctico:** Para no confundirte jamás en la PAES: en el perímetro el $2$ va **multiplicando al frente** ($P = 2\pi r$) porque es una longitud lineal en $\text{cm}$. En el área el $2$ va **arriba como exponente** ($A = \pi r^2$) porque es una superficie en $\text{cm}^2$.

  '
definiciones_clave: '- **Longitud de la circunferencia ($P$)**: Medida lineal 1D del contorno curvo cerrado que delimita al círculo.

  - **Número Pi ($\pi$)**: Constante matemática trascendente ($\approx 3,14159265...$) que representa la razón entre el perímetro y el diámetro.

  - **Despeje radial ($r = \frac{P}{2\pi}$)**: Expresión para determinar el radio conociendo el perímetro.

  '
propiedades_relaciones: '- **Dimensión lineal**: Unidades estándar en $\text{mm}$, $\text{cm}$, $\text{m}$, $\text{km}$ (dimensión $[L^1]$).

  - **Relación con el diámetro**: Como $d = 2r$, $P = 2\pi r = \pi d$.

  - **Invarianza de escala**: La razón $\frac{P}{r} = 2\pi$ es constante para todas las circunferencias del universo euclidiano.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de longitud con 2πr](/static/img/nodos/calculo-de-la-longitud-de-la-circunferencia-usando-2r-ejemplos.svg)


    Una pista circular para bicicletas tiene un radio de $r = 7\text{ m}$. Calcula la longitud exacta de una vuelta completa y halla cuánto mide el radio de otra pista cuyo contorno mide $30\pi\text{ m}$.'
  pasos:
  - 'Paso 1: Aplicar la fórmula con $r = 7\text{ m}$: $P = 2\pi r = 2\pi(7)$.'
  - 'Paso 2: Calcular el perímetro exacto de la primera pista: $P = 14\pi\text{ m}$ (aproximadamente $43,98\text{ m}$).'
  - 'Paso 3: Plantear la ecuación lineal para la segunda pista: $2\pi r = 30\pi$.'
  - 'Paso 4: Cancelar el factor $\pi$ y despejar $r$: $2r = 30 \implies r = \frac{30}{2} = 15\text{ m}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la longitud del perímetro de una circunferencia a partir de su radio r?
  choices:
  - text: P = 2πr.
    is_correct: true
  - text: P = πr².
    is_correct: false
  - text: P = 4πr.
    is_correct: false
  - text: P = (πr) / 2.
    is_correct: false
  explanation: La alternativa correcta es 'P = 2πr.' La longitud del contorno de una circunferencia es el producto de 2 por pi por el radio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una circunferencia tiene un perímetro de 18π cm, ¿cuánto mide su radio?
  choices:
  - text: 9 cm.
    is_correct: true
  - text: 18 cm.
    is_correct: false
  - text: 36 cm.
    is_correct: false
  - text: 4,5 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''9 cm.'' Despejando: $r = \frac{P}{2\pi} = \frac{18\pi}{2\pi} = 9$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la medida del radio $r$ y sus unidades de longitud.

  2. Sustituir en la fórmula lineal $P = 2\pi r$.

  3. Efectuar el producto numérico $2 \cdot r$ manteniendo el símbolo $\pi$ para un valor exacto.

  4. Si la pregunta exige decimales, multiplicar por la aproximación de $\pi$ solicitada (ej. $3,14$).

  '
errores_correccion: '- **Error común 1:** Confundir perímetro con área y escribir $\pi r^2$. **Corrección:** El perímetro es una longitud lineal ($2\pi r$); el área es una superficie ($\pi r^2$).

  - **Error común 2:** Olvidar el factor 2 y calcular solo $\pi r$. **Corrección:** $\pi r$ es la longitud de media circunferencia (semicircunferencia), la vuelta completa es $2\pi r$.

  '
ejemplos:
- tipo: A
  titulo: Perímetro con radio entero
  enunciado: Una moneda redonda tiene un radio de $12\text{ mm}$. ¿Cuál es la longitud exacta de su borde?
  alternativas:
  - text: $24\pi\text{ mm}$.
    is_correct: true
  - text: $144\pi\text{ mm}$.
    is_correct: false
  - text: $12\pi\text{ mm}$.
    is_correct: false
  - text: $48\pi\text{ mm}$.
    is_correct: false
  explicacion: $P = 2\pi(12) = 24\pi\text{ mm}$.
- tipo: B
  titulo: Unidades de medida de longitud
  enunciado: ¿Se mide la longitud de la circunferencia en unidades lineales simples como centímetros o metros?
  respuesta: Sí
  explicacion: Sí. Por ser una magnitud unidimensional de contorno, se expresa en unidades lineales ($[L]$) y no en unidades cuadradas.
errores_frecuentes:
- '''Confundir la fórmula del perímetro $P = 2\pi r$ con la del área $A = \pi r^2$.'''
- '''Olvidar duplicar el radio y calcular $\pi r$ creyendo que es la vuelta completa.'''
- '''Reportar la longitud de la circunferencia en unidades cuadradas (como $\text{cm}^2$).'''
afirmaciones_verdaderas:
- '''La longitud de una circunferencia de radio $r$ es exactamente igual a $2\pi r$.'''
- '''El radio de una circunferencia se obtiene dividiendo su perímetro entre $2\pi$ ($r = \frac{P}{2\pi}$).'''
- '''Si el radio de una circunferencia se triplica, su longitud también se triplica por proporcionalidad directa.'''
al_terminar_debes_poder: '**QUÉ:** Calcular la longitud de una circunferencia a partir de su radio y despejar el radio conocido el perímetro.


  **CÓMO:** Aplicando las relaciones métricas $P = 2\pi r$ y $r = \frac{P}{2\pi}$.


  ![Síntesis de longitud 2πr](/static/img/nodos/calculo-de-la-longitud-de-la-circunferencia-usando-2r-resumen.svg)

  '
