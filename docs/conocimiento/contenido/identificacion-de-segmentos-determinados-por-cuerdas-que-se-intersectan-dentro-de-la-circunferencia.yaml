semantic_id: MAT.GEO.CIRCULO_TEOREMAS.CUERDAS_SEGMENTOS
resumen_inicial: Al cruzarse dos cuerdas dentro de una circunferencia, el punto de intersección común determina dos segmentos medidos sobre cada cuerda desde dicho punto hacia los extremos.
explicacion_simple: 'Imagina dos palitos rectos (dos cuerdas $\overline{AB}$ y $\overline{CD}$) cruzados formando una ''X'' dentro de una pizza redonda. El punto donde se tocan los palitos es el punto de cruce $P$.


  Ese punto $P$ parte a cada palito en dos trozos:

  - El palito $AB$ queda dividido en dos partes: el trozo **$PA$** y el trozo **$PB$**.

  - El palito $CD$ queda dividido en dos partes: el trozo **$PC$** y el trozo **$PD$**.


  ¡El secreto para no equivocarse nunca en la PAES es que **todos los trozos se miden saliendo desde el punto de cruce $P$**! La longitud total del palito es simplemente la suma de sus dos trozos: $AB = PA + PB$ y $CD = PC + PD$.


  ![Segmentos determinados por cuerdas](/static/img/nodos/identificacion-de-segmentos-determinados-por-cuerdas-que-se-intersectan-dentro-de-la-circunferencia-intro.svg)

  '
explicacion_formal: '### Partición de cuerdas por intersección interior

  Sean $\overline{AB}$ y $\overline{CD}$ dos cuerdas de una circunferencia $\mathcal{C}(O, r)$ que se intersecan en un punto interior $P$ ($P \in \text{Int}(\mathcal{C})$). Por el axioma de ordenación lineal de los puntos en el plano euclidiano:

  - El punto $P$ pertenece al segmento abierto $(A, B)$, determinando los segmentos componentes $\overline{PA}$ y $\overline{PB}$ colineales y disjuntos en su interior, tales que:

  $$AB = PA + PB$$

  - Análogamente, $P \in (C, D)$, determinando los segmentos componentes $\overline{PC}$ y $\overline{PD}$ con:

  $$CD = PC + PD$$


  ### Parámetro de origen común en $P$

  En las relaciones métricas del círculo, el punto $P$ actúa como el **origen común** de los cuatro vectores o distancias escalares $d(P, A)$, $d(P, B)$, $d(P, C)$ y $d(P, D)$. La identificación correcta exige no mezclar segmentos pertenecientes a distintas cuerdas ni medir distancias que no tengan a $P$ como uno de sus extremos.


  > **Complemento didáctico:** Pon tu lápiz en el punto de cruce $P$. Desde allí, dibuja cuatro flechas hacia los cuatro extremos de la circunferencia: $P \to A$, $P \to B$, $P \to C$ y $P \to D$. ¡Esos cuatro caminos son exactamente los cuatro segmentos que usarás en las fórmulas!

  '
definiciones_clave: '- **Punto de intersección interior ($P$)**: Punto coplanar donde se cortan dos cuerdas dentro del círculo.

  - **Segmentos de una cuerda ($\overline{PA}, \overline{PB}$)**: Las dos subdivisiones generadas por $P$ sobre la cuerda $\overline{AB}$.

  - **Longitud total aditiva**: Relación métrica $AB = PA + PB$.

  '
propiedades_relaciones: '- **Colinealidad**: $A, P, B$ son colineales y $C, P, D$ son colineales.

  - **Invarianza del centro**: El punto $P$ no tiene por qué coincidir con el centro $O$.

  - **Punto medio**: Si $P$ es el punto medio de $\overline{AB}$, entonces $PA = PB = \frac{AB}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de segmentos de cuerdas](/static/img/nodos/identificacion-de-segmentos-determinados-por-cuerdas-que-se-intersectan-dentro-de-la-circunferencia-ejemplos.svg)


    Una cuerda $\overline{AB}$ de $14\text{ cm}$ se corta con otra cuerda en el punto interior $P$. Si el segmento $PA$ mide $5\text{ cm}$, determina la longitud del segmento $PB$. Si en la otra cuerda $PC = 3\text{ cm}$ y $CD = 10\text{ cm}$, determina $PD$.'
  pasos:
  - 'Paso 1: Identificar la suma total para la primera cuerda: $AB = PA + PB = 14\text{ cm}$.'
  - 'Paso 2: Despejar el segmento desconocido $PB$: $PB = AB - PA = 14 - 5 = 9\text{ cm}$.'
  - 'Paso 3: Identificar la suma total para la segunda cuerda: $CD = PC + PD = 10\text{ cm}$.'
  - 'Paso 4: Despejar $PD$: $PD = CD - PC = 10 - 3 = 7\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una cuerda AB de longitud 16 cm se corta con otra en el punto P y se sabe que PA = 6 cm, ¿cuánto mide el segmento PB?
  choices:
  - text: 10 cm.
    is_correct: true
  - text: 6 cm.
    is_correct: false
  - text: 16 cm.
    is_correct: false
  - text: 8 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''10 cm.'' El punto de corte divide la cuerda en dos partes aditivas: $PB = AB - PA = 16 - 6 = 10\text{ cm}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Desde qué punto deben medirse los cuatro segmentos determinados por dos cuerdas que se cruzan?
  choices:
  - text: Desde el punto de intersección P hacia cada extremo en la circunferencia.
    is_correct: true
  - text: Desde el centro O hacia cada extremo de la cuerda.
    is_correct: false
  - text: Entre los extremos de distintas cuerdas en forma cruzada.
    is_correct: false
  - text: Desde el punto medio de cada radio.
    is_correct: false
  explanation: La alternativa correcta es 'Desde el punto de intersección P hacia cada extremo en la circunferencia.' $P$ es el origen común de medición para aplicar teoremas métricos.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Localizar el punto de cruce $P$ de las dos cuerdas en el interior de la circunferencia.

  2. Identificar los dos extremos de la primera cuerda ($A$ y $B$) y definir sus segmentos $PA$ y $PB$.

  3. Identificar los dos extremos de la segunda cuerda ($C$ y $D$) y definir sus segmentos $PC$ y $PD$.

  4. Verificar que la suma de segmentos coincida con la longitud total de cada cuerda.

  '
errores_correccion: '- **Error común 1:** Medir los segmentos desde el centro $O$ cuando el cruce está en otro punto $P$. **Corrección:** Los segmentos se miden siempre desde el punto de cruce $P$.

  - **Error común 2:** Mezclar extremos de cuerdas distintas (ej. considerar $AC$ como segmento de cuerda). **Corrección:** Los segmentos deben ser partes colineales de la misma cuerda.

  '
ejemplos:
- tipo: A
  titulo: Identificación de segmentos colineales
  enunciado: Si dos cuerdas $AB$ y $CD$ se cortan en $P$, ¿cuáles son los segmentos que pertenecen a la cuerda $AB$?
  alternativas:
  - text: $PA$ y $PB$.
    is_correct: true
  - text: $PA$ y $PC$.
    is_correct: false
  - text: $AB$ y $CD$.
    is_correct: false
  - text: $PB$ y $PD$.
    is_correct: false
  explicacion: Los segmentos determinados sobre la cuerda $AB$ con origen en $P$ son estrictamente $PA$ y $PB$.
- tipo: B
  titulo: Aditividad de la cuerda
  enunciado: ¿Es la longitud de la cuerda completa igual a la suma de los dos segmentos determinados por el punto de cruce $P$?
  respuesta: Sí
  explicacion: Sí. Por ordenación de puntos, $AB = PA + PB$.
errores_frecuentes:
- '''Medir los segmentos desde el centro $O$ en vez de medirlos desde el punto de cruce $P$.'''
- '''Confundir las distancias entre extremos de distintas cuerdas con los segmentos de una misma cuerda.'''
- '''Restar en lugar de sumar para obtener la longitud total de la cuerda ($AB = PA + PB$).'''
afirmaciones_verdaderas:
- '''El punto de intersección $P$ divide a cada cuerda en dos segmentos colineales.'''
- '''La longitud total de una cuerda es la suma de los dos segmentos determinados por $P$ ($AB = PA + PB$).'''
- '''Todos los segmentos de cuerdas tienen como origen de medición el punto común de corte $P$.'''
al_terminar_debes_poder: '**QUÉ:** Identificar con precisión los segmentos determinados por dos cuerdas que se cruzan en un punto interior $P$.


  **CÓMO:** Verificando el origen común $P$ y las sumas $AB = PA + PB$, $CD = PC + PD$.


  ![Síntesis de segmentos de cuerdas](/static/img/nodos/identificacion-de-segmentos-determinados-por-cuerdas-que-se-intersectan-dentro-de-la-circunferencia-resumen.svg)

  '
