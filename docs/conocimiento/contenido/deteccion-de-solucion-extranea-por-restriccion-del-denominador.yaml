semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.SOLUCION_EXTRANEA
resumen_inicial: Una solución extraña es un valor obtenido algebraicamente que anula
  el denominador de la ecuación original y debe ser descartado.
explicacion_simple: 'A veces, al resolver una ecuación fraccionaria multiplicando
  por el m.c.m., obtenemos un número como candidato a respuesta.

  Pero si al reemplazar ese candidato en la ecuación ORIGINAL nos encontramos con
  que produce una división por cero (anula un denominador), ese número es una **solución
  extraña o falsa**.

  Las soluciones extrañas no pertenecen al dominio y se eliminan inmediatamente de
  la respuesta final.'
explicacion_formal: 'Sea el candidato $x = c$ obtenido al resolver la ecuación reducida
  entera $P(x) = 0$. El número $c$ es una **solución extraña** si y solo si:


  $$c \in V_p \iff \exists i : Q_i(c) = 0$$


  $$\text{Conjunto solución final: } S = \{x \mid P(x) = 0\} \setminus V_p$$


  **Desglose de la fórmula:**

  - $V_p$: Conjunto de valores prohibidos que anulan denominadores originales.'
definiciones_clave: '- **Solución extraña / aparente**: Raíz de la ecuación entera
  equivalente que no pertenece al dominio de la ecuación fraccionaria original.

  - **Descarte de soluciones**: Eliminación de cualquier candidato $c \in V_p$ del
  conjunto solución final $S$.'
propiedades_relaciones: '- **Origen de la anomalía**: Multiplicar la ecuación por
  una expresión con variable $M(x)$ introduce falsas raíces cuando $M(x) = 0$.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación fraccionaria $\frac{x^2}{x - 3} = \frac{9}{x - 3}$,
    detecta si existe alguna solución extraña y determina el conjunto solución $S$.
  pasos:
  - 'Paso 1: Registrar restricción del denominador: $x - 3 \neq 0 \implies x \neq
    3$ (luego $V_p = \{3\}$).Paso 2: Multiplicar por el denominador común $(x - 3)$:
    $x^2 = 9$.Paso 3: Obtener los candidatos resolviendo $x^2 = 9 \implies x = 3$
    y $x = -3$.Paso 4: Comparar candidatos con $V_p = \{3\}$. El candidato $x = 3$
    es una **solución extraña** porque anula el denominador original ($3 - 3 = 0$)
    y se descarta.Paso 5: Concluir que la única solución válida es $x = -3$, de modo
    que el conjunto solución es $S = \{-3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $\frac{x^2}{x - 3} = \frac{9}{x - 3}$, ¿por qué el candidato
    $x = 3$ es considerado una solución extraña?
  choices:
  - text: Porque anula el denominador original de la ecuación generando una división
      por cero.
    is_correct: true
  - text: Porque es un número entero positivo.
    is_correct: false
  - text: Porque no es una raíz del numerador $x^2 - 9$.
    is_correct: false
  - text: Porque las ecuaciones fraccionarias solo aceptan respuestas negativas.
    is_correct: false
  explanation: La alternativa correcta es 'Porque anula el denominador original de
    la ecuación generando una división por cero.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Con base en el descarte de soluciones extrañas para $\frac{x^2}{x - 3}
    = \frac{9}{x - 3}$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = \{-3\}$
    is_correct: true
  - text: $S = \{3, -3\}$
    is_correct: false
  - text: $S = \{3\}$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = \{-3\}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Anotar todas las restricciones del dominio $x \neq V_p$ de la ecuación
  original.'
- 'Paso 2: Resolver la ecuación multiplicando por el m.c.m. para obtener los valores
  candidatos.'
- 'Paso 3: Comparar cada candidato obtenido con la lista de valores prohibidos $V_p$.'
- 'Paso 4: Tachar y descartar cualquier candidato que coincida con un valor prohibido.'
- 'Paso 5: Escribir el conjunto solución $S$ únicamente con las respuestas permitidas
  restantes.'
errores_correccion: '- **Error común:** Aceptar $x = 3$ como solución válida de la
  ecuación solo porque al resolver la ecuación entera dió $x^2 = 9$.

  - **Cómo corregirlo:** Comprueba SIEMPRE tus candidatos en la ecuación inicial.
  Si hacen cero al denominador, descártalos inmediatamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
