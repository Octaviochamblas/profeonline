semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.SOLUCION_EXTRANEA
resumen_inicial: Una solución extraña es un valor numérico obtenido algebraicamente que anula algún denominador de la ecuación original y debe ser descartado del conjunto solución.
explicacion_simple: |
  Al resolver una ecuación fraccionaria multiplicando por el m.c.m. de sus denominadores, obtenemos valores numéricos que funcionan como candidatos a solución.

  Sin embargo, si al verificar un candidato en la **ecuación original** descubrimos que genera una división por cero (anulando algún denominador), dicho valor constituye una **solución extraña o falsa**.

  Las soluciones extrañas no forman parte del dominio de definición de la ecuación y deben desecharse e identificarse formalmente en la respuesta final.
explicacion_formal: |
  ### Definición formal
  Sea $x = c$ una raíz obtenida al resolver la ecuación entera simplificada $P(x) = 0$. El valor $c$ se define como una **solución extraña** si y solo si pertenece al conjunto de valores prohibidos:

  $$c \in V_p \iff \exists i : Q_i(c) = 0$$

  $$\text{Conjunto solución real válido: } S = \{x \in \mathbb{R} \mid P(x) = 0\} \setminus V_p$$

  ### Desglose de la fórmula
  - $V_p$: Conjunto de ceros de los denominadores originales $Q_i(x)$.
  - $S$: Conjunto solución estricto formado exclusivamente por las raíces algebraicas que pertenecen al dominio permitido $\operatorname{Dom}$.

  ### Síntesis didáctica
  La aparición de soluciones extrañas se produce porque la multiplicación por un m.c.m. polinomial $M(x)$ añade artificialmente los ceros de $M(x)$ al dominio de la ecuación entera equivalente.
definiciones_clave: |
  - **Solución extraña (aparente)**: Raíz de la ecuación entera asociada que no pertenece al dominio $\operatorname{Dom}$ de la ecuación fraccionaria original.
  - **Descarte de soluciones**: Exclusión del conjunto solución $S$ de todo candidato $c$ que verifique $c \in V_p$.
propiedades_relaciones: |
  - **Origen algebraico de la anomalía**: Multiplicar la ecuación por $M(x)$ anula el denominador pero expande el dominio al incorporar soluciones de $M(x) = 0$.
  - **Conjunto solución vacío**: Si todos los candidatos algebraicos resultan ser soluciones extrañas, el conjunto solución de la ecuación fraccionaria es $S = \emptyset$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación fraccionaria $\frac{x^2}{x - 3} = \frac{9}{x - 3}$, detecta si existe alguna solución extraña y determina el conjunto solución $S$.'
  pasos:
    - 'Paso 1: Identificar la restricción del denominador: $x - 3 \neq 0 \implies x \neq 3$, de modo que $V_p = \{3\}$.'
    - 'Paso 2: Multiplicar ambos miembros por el denominador común $(x - 3)$: $x^2 = 9$.'
    - 'Paso 3: Obtener los candidatos algebraicos despejando la ecuación: $x_1 = 3$ y $x_2 = -3$.'
    - 'Paso 4: Comparar los candidatos con $V_p = \{3\}$: el candidato $x_1 = 3$ es una **solución extraña** porque anula el denominador original ($3 - 3 = 0$), por lo que se descarta.'
    - 'Paso 5: Concluir que únicamente $x_2 = -3$ pertenece al dominio, por lo que el conjunto solución es $S = \{-3\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al resolver $\frac{x^2}{x - 3} = \frac{9}{x - 3}$, ¿por qué el candidato algebraico $x = 3$ se clasifica como una solución extraña?'
    choices:
      - {text: 'Porque anula el denominador de la ecuación original provocando una división entre cero.', is_correct: true}
      - {text: 'Porque es un número entero positivo.', is_correct: false}
      - {text: 'Porque no anula el numerador de la ecuación entera $x^2 - 9 = 0$.', is_correct: false}
      - {text: 'Porque las ecuaciones fraccionarias solo admiten respuestas negativas.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque anula el denominador de la ecuación original provocando una división entre cero.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Tras descartar la solución extraña en la ecuación $\frac{x^2}{x - 3} = \frac{9}{x - 3}$, ¿cuál es el conjunto solución $S$?'
    choices:
      - {text: '$S = \{-3\}$', is_correct: true}
      - {text: '$S = \{3, -3\}$', is_correct: false}
      - {text: '$S = \{3\}$', is_correct: false}
      - {text: '$S = \emptyset$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = \{-3\}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Declarar los valores prohibidos $V_p$ de los denominadores en la ecuación fraccionaria original.'
  - 'Paso 2: Multiplicar por el m.c.m. y resolver la ecuación entera resultante para hallar todas las raíces candidatas.'
  - 'Paso 3: Evaluar individualmente cada candidato comprobando si pertenece o no a $V_p$.'
  - 'Paso 4: Tachar y descartar las raíces candidatas que pertenezcan a $V_p$.'
  - 'Paso 5: Definir el conjunto solución $S$ reuniendo solo las raíces válidas no prohibidas.'
errores_correccion: |
  - **Error 1:** Aceptar $x = 3$ como solución válida de la ecuación $\frac{x^2}{x - 3} = \frac{9}{x - 3}$ simplemente porque satisface la ecuación entera $x^2 = 9$. **Cómo corregirlo:** Toda raíz obtenida **DEBE COMPROBARSE EN LA ECUACIÓN ORIGINAL; SI ANULA UN DENOMINADOR, DEBE DESCARTARSE INMEDIATAMENTE PUES NO PERTENECE AL DOMINIO**.
  - **Error 2:** Declarar conjunto solución vacío $S = \emptyset$ cuando solo una de las múltiples raíces obtenidas es extraña. **Cómo corregirlo:** El descarte **AFECTA ÚNICAMENTE A LA RAÍZ PROHIBIDA; LAS DEMÁS RAÍCES VÁLIDAS PERMANECEN EN EL CONJUNTO SOLUCIÓN $S$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Al resolver $\frac{x + 1}{x - 1} = \frac{2}{x - 1}$, se obtiene la raíz $x = 1$. ¿Cuál es el conjunto solución $S$?'
    alternativas:
      - '$S = \emptyset$'
      - '$S = \{1\}$'
      - '$S = \{2\}$'
    respuesta: '$S = \emptyset$'
    solucion_pasos:
      - '1. Restricción: $x \neq 1 \implies V_p = \{1\}$.'
      - '2. Ecuación entera: $x + 1 = 2 \implies x = 1$.'
      - '3. Puesto que $1 \in V_p$, $x = 1$ es solución extraña.'
      - '4. Por lo tanto, $S = \emptyset$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En la ecuación $\frac{x - 2}{x} = 0$, ¿el valor $x = 2$ es una solución extraña o válida?'
    alternativas:
      - 'Es una solución válida'
      - 'Es una solución extraña'
      - 'No es raíz de la ecuación'
    respuesta: 'Es una solución válida'
    solucion_pasos:
      - '1. Restricción del denominador: $x \neq 0$.'
      - '2. Numerador nulo: $x - 2 = 0 \implies x = 2$.'
      - '3. Como $2 \neq 0$, $x = 2$ es una solución totalmente válida.'
  - titulo: 'Descarte obligatorio'
    enunciado: '¿Una raíz de la ecuación entera que anula un denominador original debe ser descartada sin excepciones?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la división entre cero no está definida en los números reales.'
  - titulo: 'Solución no prohibida'
    enunciado: '¿Si una raíz no pertenece a $V_p$ y satisface la ecuación original, integra el conjunto solución $S$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las raíces válidas conforman el conjunto solución $S$.'
errores_frecuentes:
  - 'En la ecuación $\frac{x^2}{x - 3} = \frac{9}{x - 3}$, la raíz algebraicamente obtenida $x = 3$ se acepta como solución válida a pesar de anular el denominador.'
  - 'Al detectar una solución extraña $x = 3$ en la ecuación $\frac{x^2}{x - 3} = \frac{9}{x - 3}$, el conjunto solución entero se declara vacío $S = \emptyset$ ignorando la raíz válida $x = -3$.'
  - 'Al analizar la ecuación $\frac{x - 2}{x} = 0$, la raíz válida $x = 2$ se descarta por confundir la anulación del numerador con la del denominador.'
  - 'La presencia de una solución extraña en la resolución de una ecuación fraccionaria evidencia obligatoriamente un error procedimental en la transposición.'
  - 'Las restricciones de dominio $x \neq 3$ de la ecuación $\frac{x^2}{x - 3} = \frac{9}{x - 3}$ equivalen numéricamente al conjunto solución $S = \{3\}$.'
afirmaciones_verdaderas:
  - 'Una solución extraña es un valor numérico algebraico que produce una división por cero en la ecuación fraccionaria original.'
  - 'Si todas las raíces candidatas de una ecuación fraccionaria anulan sus denominadores, el conjunto solución es vacío ($S = \emptyset$).'
al_terminar_debes_poder: |
  QUÉ: Detectar y descartar soluciones extrañas en ecuaciones fraccionarias de primer grado.
  CÓMO: Resolver la ecuación entera asociada, comparar cada raíz candidata con los valores prohibidos del dominio $V_p$ y estructurar el conjunto solución final $S$.
