procedimiento:
- 'Paso 1: Identifica el ángulo central θ del sector (en grados) y el radio r del
  círculo.'
- 'Paso 2: Calcula la fracción θ/360° que representa el sector respecto al círculo
  completo.'
- 'Paso 3: Multiplica esa fracción por el área total del círculo (πr²).'
