semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_SECTOR_GRADOS
resumen_inicial: 'Cálculo del área de un sector circular mediante proporción respecto
  de 360°: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: 'Un sector circular es como una ''porción de pizza'': su área
  es una fracción del área total del círculo, determinada por su ángulo central.'
explicacion_formal: '![Área de sector circular en grados](/static/img/geometria/circunferencia-circulo/circulo-area-sector-grados.svg)


  ### Definición formal


  Un sector circular es la región plana limitada por dos radios y el arco comprendido
  entre ellos. Su área es proporcional a su ángulo central: $A=\frac{\theta}{360°}\times\pi
  r^2$, donde $\pi r^2$ es el área del círculo completo.


  ### Desarrollo didáctico


  Un sector de 90° en un círculo de radio 8 cm tiene área $A=\frac{90}{360}\times\pi\times8^2=\frac{1}{4}\times64\pi=16\pi\approx50,27$
  cm², exactamente un cuarto del área total del círculo.'
