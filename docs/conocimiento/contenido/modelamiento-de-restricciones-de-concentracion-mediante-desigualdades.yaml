semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.RESTRICCION_CONCENTRACION
resumen_inicial: El modelamiento de mezclas y concentraciones utiliza desigualdades para garantizar un porcentaje mínimo o máximo de soluto.
explicacion_simple: '![Modelamiento de restricciones de concentración mediante desigualdades](/static/img/nodos/modelamiento-de-restricciones-de-concentracion-mediante-desigualdades-intro.svg)


  Al mezclar líquidos con distintas concentraciones de un ingrediente (por ejemplo, ácido o azúcar):

  1. Multiplicamos el volumen de cada solución por su porcentaje de concentración para hallar la cantidad de soluto puro.

  2. La concentración de la mezcla final es la suma de los solutos puros dividida por el volumen total.

  3. Planteamos una inecuación para exigir que esa concentración final no supere o sea al menos el porcentaje deseado.'
explicacion_formal: 'Dadas dos soluciones de volúmenes $V_1$ y $V_2$ con concentraciones $c_1$ y $c_2$, el **modelo de concentración límite** $C_{\text{meta}}$ impone:


  $$\frac{c_1 V_1 + c_2 V_2}{V_1 + V_2} \ R \ C_{\text{meta}} \quad \text{con } R \in \{\le, \ge\}$$


  **Desglose de la fórmula:**

  - $c_1 V_1 + c_2 V_2$: Masa o volumen total de soluto puro en la mezcla.

  - $V_1 + V_2$: Volumen total final del recipiente.'
definiciones_clave: '- **Concentración de mezcla**: Proporción del componente activo respecto al volumen total mezclado.

  - **Inecuación de concentración**: Desigualdad que condiciona la pureza porcentual de una mezcla fluida.'
propiedades_relaciones: '- **Conservación de la masa**: La cantidad total de soluto puro se obtiene sumando los aportes individuales de cada ingrediente.'
ejemplo_guiado:
  enunciado: '![Ejemplo Modelamiento de restricciones de concentración mediante desigualdades](/static/img/nodos/modelamiento-de-restricciones-de-concentracion-mediante-desigualdades-ejemplos.svg)


    Se tienen $4\text{ litros}$ de jugo al $20\%$ de pulpa. ¿Cuántos litros $x$ de pulpa pura al $100\%$ se deben agregar para que la mezcla final tenga una concentración de al menos el $40\%$ de pulpa?'
  pasos:
  - 'Paso 1: Expresar la pulpa inicial: $0{,}20 \cdot 4 = 0{,}8\text{ litros}$.Paso 2: Expresar la pulpa agregada: $1{,}00 \cdot x = x\text{ litros}$.Paso 3: Formular la concentración final: $\frac{0{,}8 + x}{4 + x} \ge 0{,}40$.Paso 4: Multiplicar por $(4 + x) > 0$: $0{,}8 + x \ge 0{,}4(4 + x) \implies 0{,}8 + x \ge 1{,}6 + 0{,}4x$.Paso 5: Despejar $x$: $0{,}6x \ge 0{,}8 \implies x \ge \frac{0{,}8}{0{,}6} = \frac{4}{3} \approx 1{,}33\text{ litros}$.Paso 6: Concluir que se deben agregar al menos $\frac{4}{3}\text{ litros}$ de pulpa pura.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar la inecuación de mezcla de pulpa $0{,}8 + x \ge 1{,}6 + 0{,}4x$, ¿cuál es la cantidad mínima de pulpa pura $x$ a agregar?
  choices:
  - text: Al menos $\frac{4}{3}\text{ litros}$ (aprox $1{,}33\text{ L}$)
    is_correct: true
  - text: Exactamente $2\text{ litros}$
    is_correct: false
  - text: Como máximo $0{,}8\text{ litros}$
    is_correct: false
  - text: No se requiere agregar nada
    is_correct: false
  explanation: La alternativa correcta es 'Al menos $\frac{4}{3}\text{ litros}$ (aprox $1{,}33\text{ L}$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el volumen total de la mezcla en el denominador se expresa como $4 + x$?
  choices:
  - text: Porque es la suma del volumen inicial ($4\text{ L}$) más los $x\text{ litros}$ agregados.
    is_correct: true
  - text: Porque $4$ y $x$ son números primos.
    is_correct: false
  - text: Es una constante arbitraria.
    is_correct: false
  - text: Porque se evapora el agua.
    is_correct: false
  explanation: La alternativa correcta es 'Porque es la suma del volumen inicial ($4\text{ L}$) más los $x\text{ litros}$ agregados.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar la masa de soluto puro en cada componente.'
- 'Paso 2: Sumar la masa total de soluto y dividir entre el volumen total de la mezcla.'
- 'Paso 3: Plantear la inecuación con el porcentaje límite.'
- 'Paso 4: Despejar $x$ y redactar la respuesta.'
errores_correccion: '- **Error común:** Sumar directamente los porcentajes de concentración ($20\% + 100\% = 120\%$).

  - **Cómo corregirlo:** Los PORCENTAJES NO SE SUMAN directamente; se calcula la masa de soluto puro dividida por el volumen total.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento con desigualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Frases como 'como máximo' se traducen con la desigualdad no estricta \\le?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'como máximo' fija un límite superior inclusivo ($\\le$).
- titulo: ¿Es necesario descartar soluciones negativas al modelar magnitudes físicas reales como masa o personas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el dominio físico impone restricciones de no negatividad ($x \\ge 0$).
errores_frecuentes:
- Al mezclar soluciones químicas, la concentración final es el promedio aritmético simple de los porcentajes iniciales sin importar los volúmenes.
- Añadir agua pura (concentración $0\%$) a una solución de volumen $V$ no altera la concentración de soluto en la mezcla.
- La restricción "concentración máxima del $15\%$" en un volumen total de mezcla $V_T$ se modela algebraicamente como $V_{soluto} \ge 0{,}15 V_T$.
- Diluir una solución ácida mediante adición de solvente incrementa la concentración porcentual del ácido en la mezcla.
- El cálculo de concentración en inecuaciones ignora el volumen final del recipiente.
afirmaciones_verdaderas:
- El modelamiento de concentración química calcula la proporción entre la cantidad pura de soluto y el volumen total de la mezcla mediante inecuaciones.
- Al agregar solvente puro, la cantidad de soluto permanece constante mientras el volumen total aumenta, reduciendo la concentración.
al_terminar_debes_poder: '**QUÉ:** Modelar problemas de mezclas y concentraciones químicas mediante desigualdades.


  **CÓMO:** Planteando el balance de solutos $\frac{c_1 V_1 + c_2 x}{V_1 + x} \ge c_{\min}$ y despejando el volumen requerido para alcanzar la pureza deseada.


  ![Resumen Modelamiento de restricciones de concentración mediante desigualdades](/static/img/nodos/modelamiento-de-restricciones-de-concentracion-mediante-desigualdades-resumen.svg)'
