semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.RECTA_SECANTE_CIRCUNFERENCIA
resumen_inicial: 'Identificación de recta secante a una circunferencia: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'Una recta puede relacionarse con una circunferencia de tres maneras:
  cruzándola en dos puntos (secante), tocándola en uno solo (tangente), o sin tocarla
  (exterior). El caso secante se distingue por la posición del centro respecto de
  la recta.'
explicacion_formal: '![Recta secante a una circunferencia](/static/img/geometria/analitica/posrc-recta-secante-circunferencia.svg)


  ### Definición formal


  Una recta $Ax+By+C=0$ es secante a una circunferencia de centro $(h,k)$ y radio
  $r$ si $\dfrac{|Ah+Bk+C|}{\sqrt{A^2+B^2}}<r$, cortándola en exactamente dos puntos.


  ### Desarrollo didáctico


  Para la circunferencia $x^2+y^2=9$ (centro (0,0), radio 3) y la recta horizontal
  $y=1$: la distancia del centro a la recta es 1 (la diferencia vertical), que es
  menor que 3, por lo que la recta es secante, cruzando la circunferencia en dos puntos.'
