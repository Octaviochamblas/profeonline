semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_PURA
resumen_inicial: 'La resolución de una ecuación cuadrática pura $ax^2 + c = 0$ mediante despeje consiste en aislar la potencia $x^2 = -c/a$ y aplicar la raíz cuadrada con doble signo: $x = \pm \sqrt{-c/a}$ si $-c/a \ge 0$.'
explicacion_simple: "![La resolución de una ecuación cuadrática pura $ax^2 + c = 0$ mediante despeje consiste en aislar la potencia $x^2 = -c/a$ y aplicar la raíz cuadrada con doble signo: $x = \\pm \\sqrt{-c/a}$ si $-c/a \\ge 0$](/static/img/nodos/resolucion-de-ecuaciones-de-la-forma-ax2-c-0-mediante-despeje-intro.svg)\n\n\nPara resolver **$ax^2 + c = 0$** (cuando no hay término con $x$):\n1. **Paso 1 (Despejar):** Pasas el número al lado derecho y divides por $a$: **$x^2 = -\\frac{c}{a}$**.\n2. **Paso 2 (Raíz cuadrada):** Sacas raíz cuadrada a ambos lados recordando colocar el **doble signo $\\pm$**:\n   $$x = \\pm \\sqrt{-\\frac{c}{a}}$$\n3. **Casos posibles:**\n   - Si el número de la derecha es **positivo** (ej: $x^2 = 9$) $\\implies$ tiene dos respuestas opuestas: **$x = \\pm 3$**.\n   - Si el número de la derecha es **negativo** (ej: $x^2 = -16$) $\\implies$ **no tiene solución real** (ningún número real al cuadrado da negativo)."
explicacion_formal: "Dada la ecuación incompleta pura $ax^2 + c = 0$ con $a \\neq 0, c \\neq 0$:\n\n**Algoritmo analítico de despeje**:\n$$ax^2 = -c \\Longleftrightarrow x^2 = -\\frac{c}{a}$$\n\n**Análisis del conjunto solución según el radicando**:\n1. **Si $-\\frac{c}{a} > 0$** ($a$ y $c$ de signos opuestos):\n   $$\\mathcal{S} = \\left\\{ -\\sqrt{-\\frac{c}{a}}, \\; +\\sqrt{-\\frac{c}{a}} \\right\\} \\quad (\\text{Dos raíces reales simétricas opuestas})$$\n2. **Si $-\\frac{c}{a} < 0$** ($a$ y $c$ del mismo signo):\n   $$\\mathcal{S} = \\emptyset \\quad (\\text{Sin solución en el cuerpo } \\mathbb{R})$$\n\n**Factorización equivalente por diferencia de cuadrados** (cuando $-c/a = k^2 > 0$):\n$$x^2 - k^2 = (x - k)(x + k) = 0 \\implies x = k \\quad \\lor \\quad x = -k$$"
definiciones_clave: '- **Ecuación cuadrática pura**: Ecuación donde $b = 0$, que carece de término lineal.

  - **Raíces simétricas opuestas**: Par de soluciones reales que satisfacen $x_1 = -x_2$, con suma nula $x_1 + x_2 = 0$.'
propiedades_relaciones: '- **Eje de simetría coincidente con el eje Y**: Al ser $b = 0$, el eje de simetría de la parábola es exactamente $x = 0$.

  - **Discriminante**: $\Delta = 0^2 - 4ac = -4ac$. Si $ac < 0 \implies \Delta > 0$ (dos soluciones reales).'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de una ecuación cuadrática pura $ax^2 + c = 0$ mediante despeje consiste en aislar la potencia $x^2 = -c/a$ y aplicar la raíz cuadrada con doble signo: $x = \pm \sqrt{-c/a}$ si $-c/a \ge 0$](/static/img/nodos/resolucion-de-ecuaciones-de-la-forma-ax2-c-0-mediante-despeje-ejemplos.svg)



    Resuelve las siguientes ecuaciones cuadráticas puras en el conjunto de los números reales $\mathbb{R}$:

    1) $5x^2 - 80 = 0$

    2) $3x^2 + 27 = 0$'
  pasos:
  - 'Paso 1: Para $5x^2 - 80 = 0$:

    - Despejar $x^2$: $5x^2 = 80 \implies x^2 = \frac{80}{5} = 16$.

    - Aplicar raíz cuadrada con doble signo: $x = \pm \sqrt{16} = \pm 4$.

    - Conjunto solución: $\mathcal{S} = \{-4, 4\}$.'
  - 'Paso 2: Para $3x^2 + 27 = 0$:

    - Despejar $x^2$: $3x^2 = -27 \implies x^2 = \frac{-27}{3} = -9$.

    - Analizar el valor: $-9 < 0$; en $\mathbb{R}$ no existen raíces cuadradas de números negativos.

    - Concluir que no tiene solución real: $\mathcal{S} = \emptyset$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las soluciones reales de la ecuación $2x^2 - 50 = 0$?
  choices:
  - text: x = 5 y x = -5
    is_correct: true
  - text: Solo x = 5
    is_correct: false
  - text: x = 25 y x = -25
    is_correct: false
  - text: No tiene solucion real.
    is_correct: false
  explanation: La alternativa correcta es 'x = 5 y x = -5'. $x^2 = 50/2 = 25 \implies x = \pm 5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántas soluciones reales tiene la ecuación $4x^2 + 100 = 0$?
  choices:
  - text: Ninguna solucion real (conjunto vacio).
    is_correct: true
  - text: 'Dos soluciones: x = 5 y x = -5.'
    is_correct: false
  - text: Una solucion doble x = 0.
    is_correct: false
  - text: Infinitas soluciones.
    is_correct: false
  explanation: La alternativa correcta es 'Ninguna solucion real (conjunto vacio).'. $x^2 = -100/4 = -25 < 0$, sin solución en $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Transponer el término independiente al miembro derecho de la ecuación ($ax^2 = -c$).'
- 'Paso 2: Dividir ambos lados entre el coeficiente cuadrático $a$ ($x^2 = -c/a$).'
- 'Paso 3: Verificar el signo del número resultante.'
- 'Paso 4: Si es positivo, extraer la raíz cuadrada colocando el doble signo $\pm \sqrt{-c/a}$.'
- 'Paso 5: Si es negativo, declarar que no posee soluciones reales.'
errores_correccion: '- **Error común:** Escribir solo la raíz positiva ($x^2 = 16 \implies x = 4$).

  - **Cómo corregirlo:** Toda potencia par admite **dos raíces opuestas**: $x = \pm \sqrt{16} = \pm 4$.'
ejemplos:
- titulo: 'Ejemplo 1: Cuadrado perfecto'
  enunciado: Resuelve $x^2 - 49 = 0$.
  alternativas:
  - x = 7 y x = -7
  - Solo x = 7
  - x = 49 y x = -49
  - No tiene solución
  respuesta: x = 7 y x = -7
  solucion_pasos:
  - 'Paso 1: $x^2 = 49 \implies x = \pm 7$.'
- titulo: 'Ejemplo 2: Raíz irracional'
  enunciado: Resuelve $2x^2 - 10 = 0$.
  alternativas:
  - x = sqrt(5) y x = -sqrt(5)
  - x = 5 y x = -5
  - x = 2.5 y x = -2.5
  - Solo x = sqrt(5)
  respuesta: x = sqrt(5) y x = -sqrt(5)
  solucion_pasos:
  - 'Paso 1: $2x^2 = 10 \implies x^2 = 5 \implies x = \pm \sqrt{5}$.'
- titulo: 'Ejemplo 3: Ecuación sin solución real'
  enunciado: ¿Qué soluciones reales tiene $x^2 + 16 = 0$?
  alternativas:
  - No tiene soluciones en R
  - x = 4 y x = -4
  - Solo x = -4
  - x = 0
  respuesta: No tiene soluciones en R
  solucion_pasos:
  - 'Paso 1: $x^2 = -16 < 0$, sin solución real.'
- titulo: 'Ejemplo 4: Fracción en el término cuadrático'
  enunciado: Resuelve $\frac{x^2}{4} - 9 = 0$.
  alternativas:
  - x = 6 y x = -6
  - x = 3 y x = -3
  - x = 36 y x = -36
  - Solo x = 6
  respuesta: x = 6 y x = -6
  solucion_pasos:
  - 'Paso 1: $x^2 = 36 \implies x = \pm 6$.'
errores_frecuentes:
- Olvidar la raíz negativa al extraer raíz cuadrada.
- Intentar resolver raíces de números negativos en reales.
- Confundir la incompleta pura con la incompleta binomia.
afirmaciones_verdaderas:
- Una ecuación cuadrática pura ax² + c = 0 tiene dos raíces simétricas si -c/a > 0.
- Si a y c tienen el mismo signo, ax² + c = 0 no tiene soluciones en los números reales.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones cuadráticas puras de la forma ax² + c = 0 mediante despeje.


  **CÓMO:** Aislando x² = -c/a y extrayendo la raíz cuadrada de doble signo x = ±√(-c/a) en los reales.


