procedimiento:
- 'Paso 1: Verifica que la ecuación tenga la forma $ax^2+c=0$, sin término lineal.'
- 'Paso 2: Despeja $x^2$, aislándolo en un lado de la igualdad.'
- 'Paso 3: Si el resultado es no negativo, extrae raíz cuadrada con signo $\pm$; si
  es negativo, concluye que no hay soluciones reales.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en resolución de ecuaciones de la forma ax² + c = 0 mediante despeje.
ejemplos:
- titulo: Resolución con solución real
  enunciado: Resuelve $2x^2-32=0$.
  solucion_pasos:
  - 'Despejando: $x^2=16$.'
  - $x=\pm4$.
- titulo: Resolución sin solución real
  enunciado: Resuelve $x^2+9=0$.
  solucion_pasos:
  - 'Despejando: $x^2=-9$.'
  - No tiene solución real, ya que ningún cuadrado real es negativo.
- titulo: ¿Las soluciones de una ecuación incompleta pura son siempre un par de números
    opuestos?
  enunciado: ¿Las soluciones de una ecuación incompleta pura son siempre un par de
    números opuestos?
  respuesta: Sí
  solucion_pasos:
  - Al despejar $x=\pm\sqrt{-c/a}$, cuando existen soluciones reales, siempre son
    un par de valores opuestos entre sí.
- titulo: ¿Toda ecuación incompleta pura tiene solución dentro de los números reales?
  enunciado: ¿Toda ecuación incompleta pura tiene solución dentro de los números reales?
  respuesta: 'No'
  solucion_pasos:
  - Si $-c/a$ resulta negativo, no existe ningún número real cuyo cuadrado sea ese
    valor.
errores_frecuentes:
- Olvidar el signo $\pm$ al extraer la raíz cuadrada, perdiendo una de las dos soluciones.
- No verificar si el valor bajo la raíz es negativo antes de intentar calcularla.
- Cometer errores de signo al despejar $x^2$ desde la ecuación original.
- Confundir esta ecuación con la incompleta binomia, que sí requiere factorización
  por término común.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando resolución
