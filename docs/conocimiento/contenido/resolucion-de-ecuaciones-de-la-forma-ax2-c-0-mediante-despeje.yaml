  - titulo: Ejemplo 2
    enunciado: Ausencia de solución real.
    alternativas:
      - '$\emptyset$'
      - '$S = \{-3, 3\}$'
      - '$S = \{0\}$'
    respuesta: '$\emptyset$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La resolución de $x^2 = 49$ entrega como única solución real al número $x = 7$.'
  - 'La ecuación incompleta pura $x^2 + 81 = 0$ posee como soluciones reales a los números $x_1 = 9$ y $x_2 = -9$.'
  - 'Para despejar $x^2$ en la ecuación $2x^2 - 18 = 0$, se debe restar 2 a ambos lados de la igualdad.'
  - 'Extraer la raíz cuadrada de ambos lados de una ecuación cuadrática elimina la necesidad del signo $\pm$.'
  - 'Una ecuación cuadrática pura siempre tiene a $x = 0$ como una de sus soluciones principales.'
afirmaciones_verdaderas:
  - 'El despeje directo de $ax^2 + c = 0$ conduce a $x^2 = -c/a$, requiriendo que $-c/a > 0$ para admitir soluciones reales simétricas $\pm \sqrt{-c/a}$.'
  - 'Si el término independiente y el coeficiente cuadrático poseen el mismo signo, la ecuación $ax^2 + c = 0$ carece de soluciones en el conjunto de los números reales.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones cuadráticas incompletas puras $ax^2 + c = 0$ mediante el método de despeje directo.
  CÓMO: Aislar $x^2 = -c/a$, evaluar la existencia de raíces en $\mathbb{R}$ y extraer la raíz cuadrada con doble signo $\pm$.
