semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_PURA
resumen_inicial: La resolución de $a x^2 + c = 0$ se efectúa despejando la potencia
  $x^2 = -\frac{c}{a}$ y extrayendo la raíz cuadrada $x = \pm \sqrt{-\frac{c}{a}}$.
explicacion_simple: "Para resolver **ecuaciones cuadráticas incompletas puras ($a\
  \ x^2 + c = 0$)**:\n1. Despejamos el término constante al lado derecho: $a x^2 =\
  \ -c$.\n2. Dividimos por $a$: $x^2 = -\\frac{c}{a}$.\n3. Sacamos raíz cuadrada añadiendo\
  \ el signo $\\pm$:\n   - Si $-\\frac{c}{a} > 0 \\implies$ dos soluciones reales\
  \ opuestas: **$x = \\pm \\sqrt{-\\frac{c}{a}}$**.\n   - Si $-\\frac{c}{a} < 0 \\\
  implies$ no tiene soluciones reales (son imaginarias/complejas).\n- Ejemplo: $3x^2\
  \ - 12 = 0 \\implies 3x^2 = 12 \\implies x^2 = 4 \\implies x = \\pm \\sqrt{4} \\\
  implies x = \\pm 2$."
explicacion_formal: 'El **método de extracción de raíz cuadrada para la incompleta
  pura** $a x^2 + c = 0$ es:


  $$x^2 = -\frac{c}{a} \implies x = \pm \sqrt{-\frac{c}{a}} \quad \text{para } -\frac{c}{a}
  \ge 0$$


  **Desglose de la fórmula:**

  - Si $a$ y $c$ poseen signos distintos $\implies -c/a > 0 \implies$ existencias
  de dos soluciones reales simétricas en $\mathbb{R}$.'
definiciones_clave: '- **Extracción de raíz cuadrada**: Operación inversa del cuadrado
  que entrega soluciones reales pares simétricas $x = \pm \sqrt{k}$.'
propiedades_relaciones: '- **Condición de soluciones reales**: La ecuación $a x^2
  + c = 0$ tiene soluciones en $\mathbb{R}$ si y solo si los coeficientes $a$ y $c$
  tienen signos opuestos ($a \cdot c < 0$) o si $c = 0$.'
ejemplo_guiado:
  enunciado: Resuelve en $\mathbb{R}$ las ecuaciones cuadráticas a) $4x^2 - 100 =
    0$ y b) $x^2 + 9 = 0$.
  pasos:
  - 'Paso 1: Para a): despejar $4x^2 = 100 \implies x^2 = \frac{100}{4} = 25$.Paso
    2: Extraer raíz cuadrada con $\pm$: $x = \pm \sqrt{25} = \pm 5 \implies S_a =
    \{-5, 5\}$.Paso 3: Para b): despejar $x^2 = -9$.Paso 4: Observar que ningún número
    real elevado al cuadrado da un resultado negativo ($-9$).Paso 5: Concluir que
    para b) $S_b = \emptyset$ en los números reales.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la ecuación cuadrática $4x^2 - 100 = 0$ en $\mathbb{R}$, ¿cuál
    es el conjunto solución?
  choices:
  - text: $S = \{-5, 5\}$
    is_correct: true
  - text: $S = \{5\}$
    is_correct: false
  - text: $S = \{25\}$
    is_correct: false
  - text: $S = \{-25, 25\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \{-5, 5\}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la ecuación $x^2 + 9 = 0$ NO tiene soluciones en el conjunto
    de los números reales $\mathbb{R}$?
  choices:
  - text: Porque al despejar se obtiene $x^2 = -9$, y la raíz cuadrada de un número
      negativo no es un número real.
    is_correct: true
  - text: Porque 9 es un cuadrado perfecto.
    is_correct: false
  - text: Porque falta el término con x.
    is_correct: false
  - text: Porque el coeficiente a es igual a 1.
    is_correct: false
  explanation: La alternativa correcta es 'Porque al despejar se obtiene $x^2 = -9$,
    y la raíz cuadrada de un número negativo no es un número real.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Despejar la constante $c$ hacia el lado derecho ($a x^2 = -c$).'
- 'Paso 2: Dividir por el coeficiente $a$ para aislar $x^2$.'
- 'Paso 3: Si el número del lado derecho es positivo, extraer la raíz cuadrada anteponiendo
  $\pm$.'
- 'Paso 4: Si el número es negativo, declarar que no posee soluciones reales.'
errores_correccion: '- **Error común:** Escribir $x = 5$ al resolver $x^2 = 25$ perdiendo
  la solución negativa $x = -5$.

  - **Cómo corregirlo:** La ecuación cuadrática de segundo grado $x^2 = k$ con $k
  > 0$ da SIEMPRE dos soluciones: $+\sqrt{k}$ y $-\sqrt{k}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución por factorización.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La propiedad del producto nulo exige que A * B = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, exige que el miembro derecho sea exactamente cero.
- titulo: ¿Toda ecuación incompleta ax^2 + bx = 0 admite la solución x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, al factorizar x(ax + b) = 0 se obtiene siempre x_1 = 0.
errores_frecuentes:
- Intentar aplicar la propiedad del producto nulo a una ecuación igualada a un número
  distinto de cero.
- Dividir una ecuación cuadrática entre la incógnita $x$ perdiendo la solución fundamental
  $x = 0$.
- Olvidar anteponer el doble signo $\pm$ al extraer raíz cuadrada en la resolución
  de $x^2 = k$.
- Confundir los números de los factores $(x+m)(x+n)$ con las soluciones reales de
  la ecuación (que tienen signos invertidos).
- Violar la jerarquía de operaciones al verificar raíces calculando multiplicaciones
  antes que potencias.
afirmaciones_verdaderas:
- La propiedad del producto nulo establece que $A \cdot B = 0 \iff A = 0 \lor B =
  0$.
- Toda ecuación incompleta binomia $a x^2 + b x = 0$ se resuelve por factor común
  $x(a x + b) = 0$ produciendo siempre la raíz $x = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones cuadráticas
  completas e incompletas mediante factorización de monomio común, trinomios simples,
  trinomios generales y verificación de raíces.
