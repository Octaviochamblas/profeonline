semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_PURA
resumen_inicial: La resolución de $ax^2 + c = 0$ mediante despeje directo aísla $x^2 = -c/a$ y extrae la raíz cuadrada con doble signo $\pm \sqrt{-c/a}$.
explicacion_simple: |
  Para resolver ecuaciones cuadráticas incompletas puras (donde falta el término lineal con $x$, es decir $ax^2 + c = 0$):

  1. **Despejas $x^2$** pasando el término independiente al otro lado e invirtiendo el coeficiente $a$:
     $$ax^2 = -c \implies x^2 = -\frac{c}{a}$$
  2. **Extraes la raíz cuadrada en ambos lados** considerando que todo número positivo tiene dos raíces opuestas ($\pm$):
     $$x = \pm \sqrt{-\frac{c}{a}}$$
  - **Ejemplo**: $3x^2 - 12 = 0 \implies 3x^2 = 12 \implies x^2 = 4 \implies x = \pm \sqrt{4} \implies x_1 = 2 \quad \text{y} \quad x_2 = -2$.
  - **Caso sin solución real**: Si te queda $x^2 = -9$, como ningún número real elevado al cuadrado da negativo, la ecuación **no tiene soluciones en los reales** ($S = \emptyset$).
explicacion_formal: |
  Sea la ecuación cuadrática incompleta pura $ax^2 + c = 0$ con $a, c \in \mathbb{R} \setminus \{0\}$. La aplicación de los inversos aditivo y multiplicativo permite el despeje algebraico directo de la potencia cuadrática:

  $$x^2 = -\frac{c}{a}$$

  **Teorema de existencia de raíces reales en $\mathbb{R}$:**
  - Si el valor de la constante $-\frac{c}{a} > 0$ (es decir, $\text{signo}(a) \neq \text{signo}(c)$), la ecuación admite dos soluciones reales simétricas:
    $$S = \left\{+\sqrt{-\frac{c}{a}}, -\sqrt{-\frac{c}{a}}\right\}$$
  - Si $-\frac{c}{a} < 0$ (es decir, $\text{signo}(a) = \text{signo}(c)$), el conjunto solución real es el conjunto vacío $S = \emptyset$.
definiciones_clave: |
  - **Despeje directo de término cuadrático**: Método de resolución aplicable a ecuaciones puras aislando $x^2$ y aplicando la función raíz cuadrada.
propiedades_relaciones: |
  - **Simetría y suma nula de soluciones**: En cualquier ecuación pura con soluciones reales, las raíces son números opuestos, cumpliendo $x_1 + x_2 = 0$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática pura $4x^2 - 100 = 0$ mediante despeje directo.'
  pasos:
    - 'Paso 1: Transponer el término independiente: $4x^2 = 100$.'
    - 'Paso 2: Aislar $x^2$ dividiendo por 4: $x^2 = \frac{100}{4} = 25$.'
    - 'Paso 3: Aplicar la raíz cuadrada a ambos miembros considerando el doble signo: $x = \pm \sqrt{25}$.'
    - 'Paso 4: Escribir el conjunto solución: $x_1 = 5$ y $x_2 = -5 \implies S = \{-5, 5\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre con las soluciones en los números reales de la ecuación $x^2 + 16 = 0$ al despejar $x^2$?'
    choices:
      - {text: 'No tiene soluciones reales ($S = \emptyset$) porque ningún cuadrado real es negativo.', is_correct: true}
      - {text: 'Tiene dos soluciones reales que son $x = 4$ y $x = -4$.', is_correct: false}
      - {text: 'Tiene como solución única al número $x = 0$.', is_correct: false}
      - {text: 'Tiene como solución al número $x = 16$.', is_correct: false}
    explanation: 'La alternativa correcta es ''No tiene soluciones reales ($S = \emptyset$) porque ningún cuadrado real es negativo.''. Al despejar $x^2 = -16$, no existe raíz cuadrada real.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones de la ecuación cuadrática pura $2x^2 - 50 = 0$?'
    choices:
      - {text: '$x_1 = -5$ y $x_2 = 5$', is_correct: true}
      - {text: '$x_1 = 0$ y $x_2 = 25$', is_correct: false}
      - {text: '$x_1 = 25$ y $x_2 = -25$', is_correct: false}
      - {text: '$x_1 = 5$ única solución', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = -5$ y $x_2 = 5$''. Despejando $x^2 = 25$, las raíces son $\pm 5$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Transponer el término independiente al miembro derecho de la ecuación ($ax^2 = -c$).'
  - 'Paso 2: Aislar la potencia $x^2$ dividiendo por el coeficiente cuadrático $a$ ($x^2 = -c/a$).'
  - 'Paso 3: Evaluar el signo del número obtenido: si es positivo, extraer $\sqrt{}$ con signo $\pm$; si es negativo, declarar $S = \emptyset$.'
  - 'Paso 4: Escribir las dos raíces simétricas $x_1 = +\sqrt{-c/a}$ y $x_2 = -\sqrt{-c/a}$.'
errores_correccion: |
  - **Error común:** Escribir solo una solución positiva al extraer la raíz cuadrada (decir $x = 5$ en lugar de $x = \pm 5$).
  - **Cómo corregirlo:** La ecuación cuadrática $x^2 = k$ exige **AMBOS SIGNOS $\pm$**, ya que tanto $(+5)^2$ como $(-5)^2$ dan $25$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Despeje directo positivo.
    alternativas:
      - '$S = \{-6, 6\}$'
