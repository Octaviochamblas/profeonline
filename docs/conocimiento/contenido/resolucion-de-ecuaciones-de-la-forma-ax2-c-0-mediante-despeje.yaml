semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_PURA
resumen_inicial: 'Resolución de ecuaciones de la forma ax² + c = 0 mediante despeje:
  concepto, discriminante, soluciones y modelamiento en Resolución por factorización.'
explicacion_simple: 'Cuando falta el término lineal, no hace falta factorizar como
  en otros casos: basta con despejar $x^2$ y luego extraer raíz cuadrada, con cuidado
  del signo $\pm$.'
explicacion_formal: '### Definición formal


  Dada la ecuación $ax^2+c=0$ con $a \neq 0$ y $c \neq 0$, se despeja $x^2=-\dfrac{c}{a}$.
  Si $-\dfrac{c}{a} \geq 0$, las soluciones son $x=\pm\sqrt{-c/a}$; si $-\dfrac{c}{a}<0$,
  la ecuación no tiene soluciones reales.


  ### Desarrollo didáctico


  El procedimiento consiste en aislar el término cuadrático, despejar $x^2$, y luego
  decidir si el valor obtenido permite extraer raíz cuadrada real.


  Para $3x^2-27=0$: despejando, $x^2=9$, por lo que $x=\pm3$. Para $x^2+4=0$: despejando,
  $x^2=-4$, que no tiene solución real.'
definiciones_clave: '- **Resolución de ecuaciones de la forma ax² + c = 0 mediante
  despeje**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones de la forma ax² + c = 0 mediante despeje.'
