semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.PERIMETRO_TRAPECIO
resumen_inicial: 'Cálculo del perímetro de un trapecio: conceptos, teoremas, propiedades
  geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: A diferencia del paralelogramo (donde bastan dos lados por la
  congruencia de opuestos), en un trapecio general se necesitan los cuatro lados para
  calcular el perímetro.
explicacion_formal: '![Perímetro de un trapecio: suma de los cuatro lados](/static/img/geometria/poligonos-cuadrilateros/trapecios-perimetro.svg)


  ### Definición formal


  Si un trapecio tiene base mayor $B$, base menor $b$, y lados laterales $l_1$ y $l_2$,
  su perímetro es $P=B+b+l_1+l_2$.


  ### Desarrollo didáctico


  Un trapecio con base mayor 15 cm, base menor 9 cm, y lados laterales de 7 cm y 8
  cm tiene perímetro $P=15+9+7+8=39$ cm. A diferencia del paralelogramo, aquí no se
  puede simplificar la fórmula asumiendo lados iguales, salvo en el caso particular
  del trapecio isósceles.'
definiciones_clave: '- **Cálculo del perímetro de un trapecio**: Elemento o propiedad
