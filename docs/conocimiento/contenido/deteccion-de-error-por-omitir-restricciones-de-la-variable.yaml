semantic_id: MAT.ALG.FRACCIONES_BASE.ERROR_RESTRICCIONES
resumen_inicial: 'Detección de error por omitir restricciones de la variable: concepto,
  reglas operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: Un error muy común es simplificar una fracción algebraicamente
  y olvidarse de dónde venía. Cuando cancelas un factor del denominador, parece que
  el "peligro" ha desaparecido, pero no es así para la función original.
explicacion_formal: '### Definición formal


  Es lo que en funciones se llama una ''discontinuidad evitable'' o ''agujero'', el
  punto sigue sin existir.


  ### Desarrollo didáctico


  Un error conceptual profundo es creer que al simplificar una fracción, sus restricciones
  originales desaparecen o ya no importan.


  Analiza este caso: $\frac{x^2 - 4}{x - 2}$.

  - Restricción inicial mirando el denominador: $x - 2 = 0 \rightarrow x \neq 2$.
  (Si x es 2, la expresión queda indefinida).

  - Ahora simplificamos. Factorizamos arriba como diferencia de cuadrados: $\frac{(x-2)(x+2)}{x-2}$.

  - Tachamos los $(x-2)$. El resultado es bellísimo y simple: $x + 2$.


  Pero cuidado. Aunque el resultado $x + 2$ no tenga denominador aparente, **hereda
  genéticamente la restricción original**. La respuesta matemáticamente rigurosa es:
  ''El resultado es $x+2$, pero con la condición de que $x \neq 2$''.


  Si olvidas arrastrar las restricciones, estás diciendo que la función existe en
  $x=2$, lo cual contradice el problema original.'
definiciones_clave: '- **Detección de error por omitir restricciones de la variable**:
