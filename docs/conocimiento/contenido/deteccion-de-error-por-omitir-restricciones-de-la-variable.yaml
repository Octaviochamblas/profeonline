semantic_id: MAT.ALG.FRACCIONES_BASE.ERROR_RESTRICCIONES
resumen_inicial: Omitir las restricciones del dominio al simplificar fracciones algebraicas
  conduce a soluciones falsas o indeseadas en ecuaciones.
explicacion_simple: 'Cuando resolvemos ecuaciones con fracciones algebraicas, es muy
  común simplificar términos para trabajar más fácil.

  Pero si olvidamos anotar los valores prohibidos del denominador original, podríamos
  llegar a una solución matemática aparente que en realidad es falsa porque divide
  por cero en la ecuación inicial.

  Detectar y evitar este error requiere verificar siempre que las soluciones obtenidas
  pertenezcan al dominio permitido.'
explicacion_formal: 'Sea la ecuación racional $\frac{P(x)}{Q(x)} = 0$. El **conjunto
  solución verdadero** $S$ está restringido por:


  $$S = \{x \in \mathbb{R} \mid P(x) = 0\} \setminus \{x \in \mathbb{R} \mid Q(x)
  = 0\}$$


  **Desglose de la fórmula:**

  - $P(x) = 0$: Raíces obtenidas al resolver el numerador.

  - $\setminus \{Q(x) = 0\}$: Operación de diferencia de conjuntos que elimina formalmente
  las ''soluciones extrañas'' o raíces que anulan el denominador original.'
definiciones_clave: '- **Solución extraña / falsa**: Valor numérico obtenido algebraicamente
  que anula el denominador original y debe descartarse.

  - **Verificación de restricciones**: Comprobación final de que cada solución obtenida
  mantenga el denominador distinto de cero.'
propiedades_relaciones: '- **Indeterminación oculta**: Multiplicar o cancelar por
  una expresión que vale cero altera el conjunto de soluciones válidas de la ecuación.

  - **Descarte obligatorio**: Si una solución candidata coincide con una restricción
  del denominador, la solución se elimina inmediatamente.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación racional $\frac{x^2 - 9}{x - 3} = 0$, detecta la
    restricción del denominador y determina si $x = 3$ es una solución válida.
  pasos:
  - 'Paso 1: Determinar la restricción del denominador original: $x - 3 \neq 0 \implies
    x \neq 3$.Paso 2: Igualar el numerador a cero: $x^2 - 9 = 0 \implies (x - 3)(x
    + 3) = 0$, lo que da como candidatos $x = 3$ y $x = -3$.Paso 3: Comparar los candidatos
    con la restricción $x \neq 3$. El candidato $x = 3$ anula el denominador original
    (división $0/0$) y es una solución falsa que debe descartarse.Paso 4: Concluir
    que la única solución válida de la ecuación es $x = -3$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $\frac{x^2 - 9}{x - 3} = 0$, ¿por qué la raíz $x = 3$ debe
    descartarse como solución?
  choices:
  - text: Porque anula el denominador original generando una indeterminación por cero.
    is_correct: true
  - text: Porque es un número positivo.
    is_correct: false
  - text: Porque $x = 3$ no satisface el numerador.
    is_correct: false
  - text: Porque las ecuaciones racionales solo aceptan soluciones negativas.
    is_correct: false
  explanation: La alternativa correcta es 'Porque anula el denominador original generando
    una indeterminación por cero.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Con base en la verificación de restricciones para $\frac{x^2 - 9}{x -
    3} = 0$, ¿cuál es el conjunto solución verdadero?
  choices:
  - text: $\{ -3 \}$
    is_correct: true
  - text: $\{ 3, -3 \}$
    is_correct: false
  - text: $\{ 3 \}$
    is_correct: false
  - text: Conjunto vacío
    is_correct: false
  explanation: La alternativa correcta es '$\{ -3 \}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar todas las restricciones de los denominadores en la ecuación
  racional original.'
- 'Paso 2: Resolver la ecuación racional mediante simplificación o multiplicación
  de denominadores.'
- 'Paso 3: Obtener la lista de valores candidatos a solución.'
- 'Paso 4: Comparar cada candidato con el conjunto de restricciones del paso 1.'
- 'Paso 5: Descartar los candidatos que violen las restricciones y declarar el conjunto
  solución final.'
errores_correccion: '- **Error común:** Aceptar $x = a$ como solución de una ecuación
  racional solo porque hace cero al numerador, sin revisar si también hace cero al
  denominador.

  - **Cómo corregirlo:** SIEMPRE sustituye tus soluciones candidatas en el DENOMINADOR
  ORIGINAL. Si el denominador da cero, descarta esa solución inmediatamente.'
