semantic_id: MAT.NUM.ENTEROS_CONJUNTO.TRICOTOMIA
resumen_inicial: 'Para dos enteros cualesquiera $a$ y $b$, se cumple exactamente una opción: $a < b$, $a = b$ o $a > b$.'
explicacion_simple: 'Al tomar dos números enteros cualesquiera $a$ y $b$, ocurre exactamente una y solo una de tres posibilidades: que $a$ sea menor que $b$, que $a$ sea igual a $b$, o que $a$ sea mayor que $b$. Esta propiedad garantiza que todos los enteros se puedan comparar entre sí de forma ordenada sin ambigüedades.


  ![Ley de tricotomía para el orden de enteros (<, >, =)](/static/img/nodos/ley-de-tricotomia-para-el-orden-de-enteros-intro.svg)'
explicacion_formal: 'Para todo par de números enteros $a, b \in \mathbb{Z}$, la **Ley de Tricotomía** afirma la validez unívoca de una disyunción exclusiva entre tres relaciones de orden:


  $$\forall a, b \in \mathbb{Z}, \quad (a < b) \quad \oplus \quad (a = b) \quad \oplus \quad (a > b)$$


  **Desglose de la fórmula:**

  - $\oplus$: Disyunción exclusiva (una y solo una de las proposiciones es verdadera).

  - $a < b$: $a$ es estrictamente menor que $b$ ($a$ está a la izquierda de $b$).

  - $a = b$: $a$ y $b$ ocupan exactamente el mismo punto cartesiano en la recta.

  - $a > b$: $a$ es estrictamente mayor que $b$ ($a$ está a la derecha de $b$).


  > **Complemento didáctico:** La tricotomía asegura la comparabilidad total del conjunto $\mathbb{Z}$, impidiendo casos donde dos enteros no puedan ser ordenados.'
definiciones_clave: '- **Ley de tricotomía**: Propiedad lógica que garantiza que para dos enteros cualesquiera solo se cumple una de las tres relaciones ($<$, $=$, $>$).

  - **Disyunción exclusiva**: Estructura donde la verdad de una opción excluye la posibilidad de las otras dos.'
propiedades_relaciones: '- **Comparabilidad total**: Todo par de enteros en $\mathbb{Z}$ es completamente comparable.'
ejemplo_guiado:
  enunciado: 'Aplique la ley de tricotomía para comparar los enteros $a = -4$ y $b = -4$ determinando la única relación válida.


    ![Ejemplo Ley de tricotomía para el orden de enteros (<, >, =)](/static/img/nodos/ley-de-tricotomia-para-el-orden-de-enteros-ejemplos.svg)'
  pasos:
  - 'Paso 1: Evaluar la condición $a < b$: $-4 < -4$ es Falso.'
  - 'Paso 2: Evaluar la condición $a > b$: $-4 > -4$ es Falso.'
  - 'Paso 3: Evaluar la condición $a = b$: $-4 = -4$ es Verdadero.'
  - 'Conclusión: La única relación válida por tricotomía es $-4 = -4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas de las tres relaciones (<, =, >) pueden ser verdaderas al mismo tiempo para un par de enteros?
  choices:
  - text: Exactamente una y solo una
    is_correct: true
  - text: Las tres simultáneamente
    is_correct: false
  - text: Al menos dos
    is_correct: false
  - text: Ninguna
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente una y solo una' por la ley de tricotomía.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con a = -4 y b = -4, ¿cuál fue la relación única que se cumplió?
  choices:
  - text: a = b
    is_correct: true
  - text: a < b
    is_correct: false
  - text: a > b
    is_correct: false
  - text: a ≠ b
    is_correct: false
  explanation: La alternativa correcta es 'a = b'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar los dos enteros a comparar.'
- 'Paso 2: Probar las tres alternativas: si $a$ está a la izquierda ($a < b$), si ocupan el mismo punto ($a = b$), o si está a la derecha ($a > b$).'
- 'Paso 3: Seleccionar la única relación verdadera.'
errores_correccion: '- **Error 1: Creer que dos enteros pueden cumplir simultáneamente $a < b$ y $a = b$.** **Cómo corregirlo:** Las relaciones son mutuamente excluyentes.


  - **Error 2: Confundir los símbolos $<$ (menor que) y $>$ (mayor que).** **Cómo corregirlo:** La apertura del símbolo apunta siempre hacia el número mayor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Determine el operador de tricotomía correcto entre $-8$ y $3$.
  alternativas:
  - -8 < 3
  - -8 > 3
  - -8 = 3
  respuesta: -8 < 3
  solucion_pasos:
  - $-8$ está a la izquierda de $3$, por ende $-8 < 3$.
- titulo: Ejemplo 2
  enunciado: Si $x > 5$, ¿puede cumplirse también que $x = 5$?
  alternativas:
  - No, la tricotomía lo prohíbe
  - Sí, siempre
  - Depende del signo
  respuesta: No, la tricotomía lo prohíbe
  solucion_pasos:
  - Por tricotomía, si $x > 5$ es verdadero, $x = 5$ es estrictamente falso.
- titulo: ¿La ley de tricotomía se aplica a todos los números enteros?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo par de enteros en $\mathbb{Z}$ cumple la ley de tricotomía.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
- titulo: ¿Pueden ser ciertas a la vez las relaciones 4 > 2 y 4 < 2?
  respuesta: 'No'
  solucion_pasos:
  - No, son relaciones mutuamente excluyentes.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
errores_frecuentes:
- Dos números enteros $a$ y $b$ pueden cumplir simultáneamente las relaciones $a > b$ y $a = b$.
- El símbolo $<$ indica que la cantidad de la izquierda es estrictamente mayor que la de la derecha.
- Existen pares de números enteros en $\mathbb{Z}$ que no se pueden comparar usando la ley de tricotomía.
- Si $a$ no es menor que $b$, entonces $a$ debe ser obligatoriamente igual a $b$.
- La tricotomía permite que una misma relación de desigualdad sea verdadera y falsa al mismo tiempo.
afirmaciones_verdaderas:
- La ley de tricotomía garantiza que entre dos enteros solo se cumple una relación entre <, = y >.
- Si $a > b$, es imposible que $a < b$ o $a = b$.
al_terminar_debes_poder: '**QUÉ:** Aplicar la ley de tricotomía para comparar dos enteros cualesquiera $a, b \in \mathbb{Z}$.


  **CÓMO:** Evaluando de forma mutuamente excluyente y exhaustiva las tres posibilidades: $a < b$, $a = b$ o $a > b$.


  ![Resumen Ley de tricotomía para el orden de enteros (<, >, =)](/static/img/nodos/ley-de-tricotomia-para-el-orden-de-enteros-resumen.svg)'
