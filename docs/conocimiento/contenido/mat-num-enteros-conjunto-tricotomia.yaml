semantic_id: MAT.NUM.ENTEROS_CONJUNTO.TRICOTOMIA
resumen_inicial: "Al comparar dos enteros, exactamente una relación es verdadera: el primero es mayor, menor o igual que el segundo. Nunca dos a la vez, nunca ninguna."
explicacion_simple: |
  Cuando comparas dos números, siempre ocurre exactamente una de estas tres cosas: el primero es
  mayor, el primero es menor, o los dos son iguales. Nunca pueden ser dos cosas a la vez, y tampoco
  puede "no ocurrir ninguna". A esta idea se le llama Ley de Tricotomía (del griego "tri" = tres).
explicacion_formal: |
  La Ley de Tricotomía establece que, dados dos enteros cualesquiera $a$ y $b$, se cumple una y solo
  una de estas relaciones: $a > b$, $a < b$, o $a = b$. Esta propiedad garantiza que el orden en
  $\mathbb{Z}$ es total: nunca hay ambigüedad ni exclusión mutua incompleta.
definiciones_clave: |
  **Ley de Tricotomía**: para todo par de enteros $a, b$, exactamente una de $a>b$, $a<b$, $a=b$ es
  verdadera. **Orden total**: propiedad de un conjunto donde cualquier par de elementos es siempre
  comparable.
propiedades_relaciones: |
  Si $a \neq b$, la tricotomía obliga a que ocurra $a > b$ o $a < b$ (una de las dos, nunca ambas).
  Si se descartan dos de las tres opciones por enunciado, la tercera queda determinada sin necesidad
  de más cálculo.
ejemplo_guiado:
  enunciado: "Se sabe que $y$ no es igual a $-3$ y tampoco es mayor que $-3$. ¿Qué relación se cumple entre $y$ y $-3$?"
  pasos:
    - "Las tres opciones posibles son: $y = -3$, $y > -3$, $y < -3$."
    - "Se descarta $y = -3$ por enunciado."
    - "Se descarta $y > -3$ por enunciado."
    - "Por tricotomía, la única opción que queda es $y < -3$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Si se sabe que $a > b$, ¿qué otras relaciones quedan automáticamente descartadas por la Ley de Tricotomía?"
    choices:
      - {text: "Ninguna, pueden coexistir", is_correct: false}
      - {text: "$a = b$ y $a < b$", is_correct: true}
      - {text: "Solo $a = b$", is_correct: false}
      - {text: "Solo $a < b$", is_correct: false}
    explanation: "La correcta es $a = b$ y $a < b$: la tricotomía exige que solo una de las tres relaciones sea verdadera."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, si $z$ no es igual a $8$ y tampoco es menor que $8$, ¿qué se concluye?"
    choices:
      - {text: "$z = 8$", is_correct: false}
      - {text: "$z > 8$", is_correct: true}
      - {text: "$z < 8$", is_correct: false}
      - {text: "No se puede concluir nada", is_correct: false}
    explanation: "La correcta es $z > 8$, porque al descartar $z=8$ y $z<8$ solo queda esa opción por tricotomía."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los dos números enteros a comparar."
  - "Paso 2: Verificar si los valores y signos son idénticos; de ser así, la relación es $a = b$."
  - "Paso 3: Si no son iguales, determinar la posición relativa en la recta para elegir entre $a > b$ o $a < b$."
  - "Paso 4: Asegurar que solo se ha seleccionado una de las tres opciones."
errores_correccion: |
  Un error frecuente es pensar que dos números distintos pueden ser a la vez mayor y menor entre
  sí: la tricotomía prohíbe explícitamente esa combinación. Otro error es creer que si $a$ no es
  mayor que $b$, entonces necesariamente son iguales; también podría ser que $a < b$. Siempre hay
  que evaluar las tres opciones antes de concluir.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Dada la pareja de números $-7$ y $-7$, indique qué relación de la tricotomía se cumple."
    solucion_pasos:
      - "Se observa que ambos números tienen el mismo signo y la misma magnitud."
      - "No hay diferencia de posición en la recta numérica."
      - "Resultado: $-7 = -7$."
  - titulo: "Ejemplo 2"
    enunciado: "Si se sabe que $x$ no es igual a $5$ y tampoco es menor que $5$, ¿qué puede concluirse según la tricotomía?"
    solucion_pasos:
      - "Las tres opciones posibles son: $x = 5$, $x < 5$, $x > 5$."
      - "Se descarta $x = 5$ por enunciado."
      - "Se descarta $x < 5$ por enunciado."
      - "Conclusión única: $x > 5$."
  - titulo: "¿Pueden cumplirse $a > b$ y $a = b$ al mismo tiempo para dos enteros cualesquiera?"
    respuesta: "No"
    solucion_pasos:
      - "La Ley de Tricotomía establece que **solo una** de las tres relaciones puede ser verdadera."
      - "Si $a > b$, queda automáticamente descartado que $a = b$ o $a < b$."
      - "Por lo tanto, es imposible que $a > b$ y $a = b$ se cumplan simultáneamente."
  - titulo: "Dados $a = -3$ y $b = 2$, ¿se cumple que $a < b$?"
    respuesta: "Sí"
    solucion_pasos:
      - "$-3$ se ubica a la izquierda de $2$ en la recta numérica."
      - "Todo número negativo es menor que cualquier número positivo."
      - "Por lo tanto, $-3 < 2$: la relación $a < b$ sí se cumple."
errores_frecuentes:
  - "Dos números enteros distintos pueden ser a la vez mayores y menores entre sí."
  - "Si $a$ no es mayor que $b$, necesariamente $a = b$."
  - "La Ley de Tricotomía solo aplica para números positivos."
  - "Para números negativos, la tricotomía funciona al revés: mayor valor absoluto implica mayor número."
  - 'Si $a \neq b$, es posible que no se pueda determinar cuál es mayor.'
al_terminar_debes_poder: |
  Aplicar la Ley de Tricotomía para determinar por descarte la única relación verdadera entre dos
  enteros, usando la información disponible sin necesidad de calcular ambos valores directamente.

fuente: "Álgebra de Baldor p.33"
estado: publicado
