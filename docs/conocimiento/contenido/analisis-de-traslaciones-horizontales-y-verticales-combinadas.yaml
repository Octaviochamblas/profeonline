semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_COMPUESTA
resumen_inicial: El análisis de traslaciones combinadas en funciones potencia $g(x) = a(x - h)^n + k$ aplica el vector de traslación $\vec{v} = (h, k)$ sobre la curva base $f(x) = ax^n$, situando el nuevo vértice o centro de simetría exactamente en el punto cartesiano $(h, k)$.
explicacion_simple: "![El análisis de traslaciones combinadas en funciones potencia $g(x) = a(x - h)^n + k$ aplica el vector de traslación $\\vec{v} = (h, k)$ sobre la curva base $f(x) = ax^n$, situando el nuevo vértice o centro de simetría exactamente en el punto cartesiano $(h, k)$](/static/img/nodos/analisis-de-traslaciones-horizontales-y-verticales-combinadas-intro.svg)\n\n\nCuando combinas **traslación horizontal y vertical al mismo tiempo**, la función tiene la forma completa canónica:\n\n$$g(x) = a(x - \\mathbf{h})^n + \\mathbf{k} \\quad \\Longleftrightarrow \\quad \\mathbf{\\text{Nuevo Centro / Vértice} = (h, k)}$$\n\n- **¿Cómo encontrar el vértice al instante?**\n  - El número de adentro con el signo cambiado te da la coordenada $X$: **$h$**.\n  - El número de afuera con su mismo signo te da la coordenada $Y$: **$k$**.\n- **Ejemplo clave:** Si tienes $f(x) = 2(x - 3)^4 + 5$:\n  - El vértice está en **$(3, 5)$**.\n  - El eje de simetría es la recta **$x = 3$**.\n  - El recorrido\
  \ es **$[5, +\\infty[$**."
explicacion_formal: "Sea $f(x) = ax^n$ con $a \\in \\mathbb{R}^*$ y $n \\in \\mathbb{Z}^*$. La composición de las traslaciones $\\mathcal{T}_{(h, 0)}$ y $\\mathcal{T}_{(0, k)}$ define la traslación bidimensional por el vector $\\vec{v} = (h, k) \\in \\mathbb{R}^2$:\n$$\\mathcal{T}_{(h, k)}: \\operatorname{Gr}(f) \\to \\operatorname{Gr}(g), \\quad (x, y) \\mapsto (x + h, y + k)$$\nLa ecuación de la función transformada resultante es:\n$$g(x) = a(x - h)^n + k$$\n\n**Elementos geométricos característicos transformados**:\n1. **Centro canónico**: $(0, 0) \\mapsto (h, k)$.\n2. **Eje de simetría (en $n$ par)**: $x = h$.\n3. **Recorrido (en $n$ par)**:\n   $$\\operatorname{Rec}(g) = \\begin{cases} [k, +\\infty[ & \\text{si } a > 0 \\\\ ]-\\infty, k] & \\text{si } a < 0 \\end{cases}$$\n4. **Monotonía por intervalos (en $n$ par con $a > 0$)**: Estrictamente decreciente en $]-\\infty, h]$ y estrictamente creciente en $[h, +\\infty[$."
definiciones_clave: '- **Forma canónica trasladada**: Estructura $a(x - h)^n + k$ que explicita las coordenadas del punto de referencia $(h, k)$.

  - **Vector de traslación**: Vector $\vec{v} = (h, k)$ que define la traslación rígida en el plano.'
propiedades_relaciones: '- **Puntos simétricos**: En pares, $g(h - d) = g(h + d)$ para cualquier distancia $d > 0$.

  - **Cálculo del intercepto en $Y$**: $g(0) = a(-h)^n + k$, el cual difiere de $k$ cuando $h \neq 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de traslaciones combinadas en funciones potencia $g(x) = a(x - h)^n + k$ aplica el vector de traslación $\vec{v} = (h, k)$ sobre la curva base $f(x) = ax^n$, situando el nuevo vértice o centro de simetría exactamente en el punto cartesiano $(h, k)$](/static/img/nodos/analisis-de-traslaciones-horizontales-y-verticales-combinadas-ejemplos.svg)



    Analiza exhaustivamente la función $f(x) = -3(x + 2)^4 + 8$:

    1) Halla el vértice y el eje de simetría.

    2) Determina el dominio y recorrido.

    3) Calcula el punto de corte con el eje $Y$.'
  pasos:
  - 'Paso 1: Identificar parámetros: $a = -3$, $h = -2$, $k = 8$, $n = 4$ (par).

    - Vértice: **$V(-2, 8)$**.

    - Eje de simetría: Recta vertical **$x = -2$**.'
  - 'Paso 2: Dominio y recorrido:

    - **$\operatorname{Dom}(f) = \mathbb{R}$**.

    - Como $a = -3 < 0$, las ramas abren hacia abajo $\implies$ **$\operatorname{Rec}(f) = ]-\infty, 8]$**.'
  - 'Paso 3: Intercepto con el eje $Y$ ($x = 0$):

    - $f(0) = -3(0 + 2)^4 + 8 = -3(16) + 8 = -48 + 8 = \mathbf{-40} \implies (0, -40)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las coordenadas del vértice de la función $f(x) = 5(x - 4)^6 - 12$?
  choices:
  - text: (4, -12)
    is_correct: true
  - text: (-4, -12)
    is_correct: false
  - text: (4, 12)
    is_correct: false
  - text: (-4, 12)
    is_correct: false
  explanation: La alternativa correcta es '(4, -12)'. El valor de $h = +4$ y $k = -12$, ubicando el vértice exactamente en $(4, -12)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el recorrido de la función $g(x) = 2(x + 5)^4 - 7$?
  choices:
  - text: '[-7, +∞['
    is_correct: true
  - text: '[5, +∞['
    is_correct: false
  - text: '[-5, +∞['
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es '[-7, +∞['. Al ser par con $a = 2 > 0$, el mínimo de la función es su ordenada del vértice $k = -7$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer $h$ cambiando el signo del interior del binomio: $(x - h) \implies h$.'
- 'Paso 2: Extraer $k$ conservando el signo exterior: $+ k \implies k$.'
- 'Paso 3: Ubicar el vértice o punto de inflexión en las coordenadas $(h, k)$.'
- 'Paso 4: Trazar el eje de simetría $x = h$ y definir el recorrido acotado por $k$ si la función es par.'
errores_correccion: '- **Error común:** Creer que el corte con el eje $Y$ siempre es igual a $k$.

  - **Cómo corregirlo:** El corte con el eje $Y$ es $k$ **SOLO si $h = 0$**. Si la función está trasladada horizontalmente, debes **evaluar $f(0) = a(-h)^n + k$**.'
ejemplos:
- titulo: 'Ejemplo 1: Vértice completo'
  enunciado: 'El vértice de $f(x) = (x - 7)^4 + 3$ es:'
  alternativas:
  - (7, 3)
  - (-7, 3)
  - (7, -3)
  - (-7, -3)
  respuesta: (7, 3)
  solucion_pasos:
  - 'Paso 1: $(h, k) = (7, 3)$.'
- titulo: 'Ejemplo 2: Inflexión trasladada'
  enunciado: 'El centro de simetría de $g(x) = 2(x + 1)^3 - 6$ es:'
  alternativas:
  - (-1, -6)
  - (1, -6)
  - (-1, 6)
  - (1, 6)
  respuesta: (-1, -6)
  solucion_pasos:
  - 'Paso 1: $(h, k) = (-1, -6)$.'
- titulo: 'Ejemplo 3: Recorrido combinado'
  enunciado: 'El recorrido de $y = -5(x - 2)^2 + 10$ es:'
  alternativas:
  - ']-inf, 10]'
  - '[10, +inf['
  - ']-inf, 2]'
  - '[2, +inf['
  respuesta: ']-inf, 10]'
  solucion_pasos:
  - 'Paso 1: Par negativo con $k = 10 \implies \operatorname{Rec} = ]-\infty, 10]$.'
- titulo: 'Ejemplo 4: Intercepto con Y en traslación compuesta'
  enunciado: ¿Dónde corta al eje Y la función $f(x) = (x - 2)^4 + 1$?
  alternativas:
  - (0, 17)
  - (0, 1)
  - (0, 9)
  - (0, -15)
  respuesta: (0, 17)
  solucion_pasos:
  - 'Paso 1: $f(0) = (0 - 2)^4 + 1 = (-2)^4 + 1 = 16 + 1 = 17 \implies (0, 17)$.'
errores_frecuentes:
- Confundir el vértice (h, k) con el intercepto en Y.
- Invertir los signos de h y k.
- Olvidar que el eje de simetría se desplaza a x = h.
afirmaciones_verdaderas:
- En la forma canónica g(x) = a(x - h)ⁿ + k, el vértice o centro se ubica en el punto (h, k).
- El eje de simetría en funciones potencia pares se traslada a la recta vertical x = h.
al_terminar_debes_poder: '**QUÉ:** Analizar y graficar funciones potencia con traslaciones combinadas g(x) = a(x - h)ⁿ + k.


  **CÓMO:** Identificando el vector (h, k), ubicando el centro transformado y calculando dominio, recorrido y cortes cartesianos.


