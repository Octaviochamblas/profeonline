semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.INTERCEPTO_Y
resumen_inicial: El cálculo del intercepto de la gráfica exponencial con el eje $Y$ se determina evaluando $f(0)$, resultando siempre en el punto cartesiano $(0, a)$ en la forma $f(x) = a \cdot b^x$, y en el punto canónico $(0, 1)$ cuando $a = 1$.
explicacion_simple: "![El cálculo del intercepto de la gráfica exponencial con el eje $Y$ se determina evaluando $f(0)$, resultando siempre en el punto cartesiano $(0, a)$ en la forma $f(x) = a \\cdot b^x$, y en el punto canónico $(0, 1)$ cuando $a = 1$](/static/img/nodos/calculo-del-intercepto-de-la-grafica-exponencial-con-el-eje-y-intro.svg)\n\n\nPara saber en qué punto exacto la gráfica de una función exponencial cruza la línea vertical del eje $Y$:\n\n1. **Solo debes cambiar la $x$ por un $0$:**\n   $$f(0) = a \\cdot b^0$$\n2. **Aplica la regla de oro de las potencias ($b^0 = 1$):**\n   $$f(0) = a \\cdot 1 = \\mathbf{a}$$\n3. **El punto de corte es siempre $(0, a)$:**\n   - Para $f(x) = 2^x \\implies f(0) = 1 \\implies$ Corta en **$(0, 1)$**.\n   - Para $f(x) = 5 \\cdot 3^x \\implies f(0) = 5 \\implies$ Corta en **$(0, 5)$**.\n   - Para $f(x) = -8 \\cdot 4^x \\implies f(0) = -8 \\implies$ Corta en **$(0, -8)$**."
explicacion_formal: 'Sea $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = a \cdot b^x$ ($a \neq 0, b > 0, b \neq 1$). La **intersección con la variedad afín vertical** $\mathcal{L}_Y = \{(x, y) \in \mathbb{R}^2 \mid x = 0\}$ es el conjunto unitario:

  $$\operatorname{Gr}(f) \cap \mathcal{L}_Y = \{(0, f(0))\}$$


  **Cálculo analítico**:

  Por el axioma de potencia de exponente cero en cualquier cuerpo algebraico con $b \neq 0$:

  $$b^0 = 1 \implies f(0) = a \cdot b^0 = a \cdot 1 = a$$

  Por lo tanto, la intersección es el punto cartesiano único e invariante $P_Y(0, a)$.'
definiciones_clave: '- **Intercepto con el eje Y**: Punto cartesiano $(0, f(0))$ donde la curva cruza la recta vertical $x = 0$.

  - **Punto pivote universal**: Punto $(0, 1)$ por el cual transitan todas las funciones exponenciales básicas $f(x) = b^x$.'
propiedades_relaciones: '- **Punto común de la familia básica**: Todas las gráficas del tipo $y = b^x$ (sin importar si $b = 2, 10, 1/3, \pi$) se intersectan mutuamente en el punto común $(0, 1)$.

  - **Invarianza ante cambios de base**: Cambiar la base $b$ no altera la posición del intercepto con el eje $Y$ si el parámetro $a$ se mantiene fijo.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo del intercepto de la gráfica exponencial con el eje $Y$ se determina evaluando $f(0)$, resultando siempre en el punto cartesiano $(0, a)$ en la forma $f(x) = a \cdot b^x$, y en el punto canónico $(0, 1)$ cuando $a = 1$](/static/img/nodos/calculo-del-intercepto-de-la-grafica-exponencial-con-el-eje-y-ejemplos.svg)



    Calcula el intercepto con el eje Y para las siguientes funciones exponenciales:

    1) $f(x) = 9^x$

    2) $g(x) = 4 \cdot (1{,}5)^x$

    3) $h(x) = -6 \cdot \left(\frac{1}{3}\right)^x$'
  pasos:
  - 'Paso 1: Para $f(x) = 9^x$:

    - Evaluar en $x = 0$: $f(0) = 9^0 = 1$.

    - Intercepto con el eje $Y$: **$(0, 1)$**.'
  - 'Paso 2: Para $g(x) = 4 \cdot (1{,}5)^x$:

    - Evaluar en $x = 0$: $g(0) = 4 \cdot (1{,}5)^0 = 4 \cdot 1 = 4$.

    - Intercepto con el eje $Y$: **$(0, 4)$**.'
  - 'Paso 3: Para $h(x) = -6 \cdot (1/3)^x$:

    - Evaluar en $x = 0$: $h(0) = -6 \cdot (1/3)^0 = -6 \cdot 1 = -6$.

    - Intercepto con el eje $Y$: **$(0, -6)$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje Y la función exponencial $f(x) = 11 \cdot 3^x$?
  choices:
  - text: (0, 11)
    is_correct: true
  - text: (0, 33)
    is_correct: false
  - text: (0, 1)
    is_correct: false
  - text: (0, 3)
    is_correct: false
  explanation: La alternativa correcta es '(0, 11)'. $f(0) = 11 \cdot 3^0 = 11 \cdot 1 = 11 \implies (0, 11)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué punto tienen en común las gráficas de $y = 2^x$, $y = 5^x$ e $y = (0,4)^x$?
  choices:
  - text: El punto (0, 1)
    is_correct: true
  - text: El origen (0, 0)
    is_correct: false
  - text: El punto (1, 0)
    is_correct: false
  - text: No tienen puntos en común
    is_correct: false
  explanation: La alternativa correcta es 'El punto (0, 1)'. Como para cualquier base $b^0 = 1$, todas las funciones básicas pasan por $(0, 1)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la función exponencial $f(x) = a \cdot b^x$.'
- 'Paso 2: Sustituir $x = 0$ en la expresión funcional.'
- 'Paso 3: Aplicar la propiedad $b^0 = 1$ para obtener $y = a \cdot 1 = a$.'
- 'Paso 4: Escribir las coordenadas del punto de corte como el par ordenado $(0, a)$.'
errores_correccion: '- **Error común:** Calcular $b^0 = 0$ y decir que el corte es en $(0, 0)$.

  - **Cómo corregirlo:** Todo número elevado a cero da **UNO ($b^0 = 1$)**; por tanto, el corte es **$(0, a)$**.'
ejemplos:
- titulo: 'Ejemplo 1: Función básica'
  enunciado: En $f(x) = 12^x$, ¿cuál es el intercepto Y?
  alternativas:
  - (0, 1)
  - (0, 12)
  - (0, 0)
  - (1, 12)
  respuesta: (0, 1)
  solucion_pasos:
  - 'Paso 1: $f(0) = 12^0 = 1 \implies (0, 1)$.'
- titulo: 'Ejemplo 2: Función con coeficiente'
  enunciado: En $g(x) = 7 \cdot 2^x$, ¿dónde corta al eje Y?
  alternativas:
  - (0, 7)
  - (0, 14)
  - (0, 2)
  - (0, 1)
  respuesta: (0, 7)
  solucion_pasos:
  - 'Paso 1: $g(0) = 7 \cdot 1 = 7 \implies (0, 7)$.'
- titulo: 'Ejemplo 3: Coeficiente negativo'
  enunciado: En $h(x) = -3 \cdot 5^x$, ¿cuál es el corte Y?
  alternativas:
  - (0, -3)
  - (0, 3)
  - (0, -15)
  - (0, 1)
  respuesta: (0, -3)
  solucion_pasos:
  - 'Paso 1: $h(0) = -3 \cdot 1 = -3 \implies (0, -3)$.'
- titulo: 'Ejemplo 4: Identificación inversa'
  enunciado: Si $f(x) = a \cdot 4^x$ corta al eje Y en $(0, 20)$, ¿cuánto vale $a$?
  alternativas:
  - '20'
  - '5'
  - '4'
  - '1'
  respuesta: '20'
  solucion_pasos:
  - 'Paso 1: $f(0) = a = 20$.'
errores_frecuentes:
- Asumir que b⁰ = 0 llevando el corte al origen (0, 0).
- Multiplicar a por b antes de evaluar el exponente cero.
- Confundir la abscisa x = 0 con la ordenada y = 0.
afirmaciones_verdaderas:
- La gráfica de f(x) = a · bˣ corta al eje Y en el punto exacto (0, a).
- Todas las funciones exponenciales básicas f(x) = bˣ comparten el punto de corte canónico (0, 1).
al_terminar_debes_poder: '**QUÉ:** Calcular y localizar el intercepto de una función exponencial con el eje Y.


  **CÓMO:** Evaluando f(0) = a · b⁰ = a para formular el par ordenado (0, a).


  ![Resumen El cálculo del intercepto de la gráfica exponencial con el eje $Y$ se determina evaluando $f(0)$, resultando siempre en el punto cartesiano $(0, a)$ en la forma $f(x) = a \cdot b^x$, y en el punto canónico $(0, 1)$ cuando $a = 1$](/static/img/nodos/calculo-del-intercepto-de-la-grafica-exponencial-con-el-eje-y-resumen.svg)'
