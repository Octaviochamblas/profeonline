semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.INTERCEPTO_Y
resumen_inicial: El cálculo del intercepto con el eje Y evalúa la función en $x = 0$, obteniendo la coordenada cartesiana $(0, a)$.
explicacion_simple: |
  El **intercepto con el eje Y** es el punto exacto donde la gráfica de la función cruza la línea vertical del centro del plano cartesiano:

  - Para encontrarlo, basta con reemplazar la variable $x$ por el número **cero ($x = 0$)**:
    - **En la exponencial básica $f(x) = b^x$**: $f(0) = b^0 = 1 \implies$ Corta siempre en **$(0, 1)$**.
    - **En la exponencial general $f(x) = a \cdot b^x$**: $f(0) = a \cdot b^0 = a \cdot 1 = a \implies$ Corta en **$(0, a)$**.
explicacion_formal: |
  Dada la función exponencial $f(x) = a \cdot b^x$ con $a \neq 0$ y $b \in \mathbb{R}^+ \setminus \{1\}$, la determinación analítica del **punto de intersección con el eje de las ordenadas Y** se define como el conjunto singular:

  $$G(f) \cap \{(0, y) \mid y \in \mathbb{R}\} = \{(0, f(0))\}$$

  **Cálculo explícito:**
  $$f(0) = a \cdot b^0 = a \cdot 1 = a$$

  Por lo tanto, la coordenada cartesiana del intercepto con el eje Y es de forma única el par ordenado:

  $$P_Y = (0, a)$$

  - Para la función exponencial canónica donde $a = 1$, el intercepto se fija invariablemente en $(0, 1)$.
definiciones_clave: |
  - **Intercepto con el eje Y**: Punto cartesiano de la forma $(0, f(0))$ donde la curva exponencial atraviesa el eje vertical de las ordenadas.
propiedades_relaciones: |
  - **Invariancia frente a la base**: La base $b$ no afecta la abscisa ni la ordenada del intercepto inicial $P_Y = (0, a)$, pues $b^0 = 1$ para cualquier base válida.
ejemplo_guiado:
  enunciado: 'Calcula el punto de intersección con el eje Y de la gráfica de la función $f(x) = 14 \cdot (2/5)^x$.'
  pasos:
    - 'Paso 1: Sustituir la variable independiente por cero: $x = 0$.'
    - 'Paso 2: Evaluar la potencia: $(2/5)^0 = 1$.'
    - 'Paso 3: Multiplicar por el coeficiente exterior: $f(0) = 14 \cdot 1 = 14$.'
    - 'Paso 4: Formular el par ordenado del intercepto: el punto es $(0, 14)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué coordenadas corta al eje Y la gráfica de la función exponencial básica $f(x) = 9^x$?'
    choices:
      - {text: 'En el punto cartesiano $(0, 1)$', is_correct: true}
      - {text: 'En el punto cartesiano $(0, 9)$.', is_correct: false}
      - {text: 'En el punto cartesiano $(1, 0)$.', is_correct: false}
      - {text: 'En el punto cartesiano $(9, 0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''En el punto cartesiano $(0, 1)$''. Evaluando $f(0) = 9^0 = 1$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la función exponencial $g(x) = -6 \cdot 3^x$, ¿cuál es la coordenada del intercepto con el eje Y?'
    choices:
      - {text: 'El punto cartesiano $(0, -6)$', is_correct: true}
      - {text: 'El punto cartesiano $(0, 6)$.', is_correct: false}
      - {text: 'El punto cartesiano $(-6, 0)$.', is_correct: false}
      - {text: 'El punto cartesiano $(0, -18)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto cartesiano $(0, -6)$''. $g(0) = -6 \cdot 3^0 = -6 \cdot 1 = -6$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la fórmula de la función exponencial $f(x) = a \cdot b^x$.'
  - 'Paso 2: Asignar el valor $x = 0$ a la variable independiente.'
  - 'Paso 3: Aplicar la ley de exponente cero $b^0 = 1$ y multiplicar por la constante $a$.'
  - 'Paso 4: Escribir la respuesta final en notación de punto cartesiano $(0, a)$.'
errores_correccion: |
  - **Error común:** Escribir el intercepto al revés, como $(a, 0)$ en lugar de $(0, a)$.
  - **Cómo corregirlo:** La intersección con el **EJE Y** tiene **X IGUAL A CERO** ($x = 0$), por lo que el cero va en la **PRIMERA POSICIÓN**: $(0, a)$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Intercepto de función canónica.
    alternativas:
      - 'Intercepto Y en (0, 1)'
      - 'Intercepto Y en (1, 0)'
      - 'Intercepto Y en (0, 5)'
    respuesta: 'Intercepto Y en (0, 1)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Intercepto con coeficiente multiplicativo.
    alternativas:
      - 'Intercepto Y en (0, 80)'
      - 'Intercepto Y en (80, 0)'
      - 'Intercepto Y en (0, 160)'
    respuesta: 'Intercepto Y en (0, 80)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 3^x$, la afirmación de que la gráfica corta al eje Y en el punto cartesiano $(0, 3)$.'
  - 'La confusión de la posición del cero al escribir las coordenadas del intercepto con Y como $(a, 0)$ en lugar de $(0, a)$.'
  - 'La afirmación de que modificar el valor de la base $b$ desplaza la ordenada del intercepto $(0, 1)$.'
  - 'La afirmación de que la función exponencial básica no tiene intercepto con el eje Y por tener asíntota.'
  - 'La afirmación de que evaluar $x = 0$ en la función exponencial produce un resultado igual a cero.'
afirmaciones_verdaderas:
  - 'El intercepto de una función exponencial con el eje Y se calcula evaluando $f(0)$, dando como resultado el punto $(0, a)$.'
  - 'Toda función exponencial básica $f(x) = b^x$ corta al eje Y exactamente en el punto $(0, 1)$, independientemente del valor de la base $b$.'
al_terminar_debes_poder: |
  QUÉ: Calcular y ubicar el intercepto con el eje Y de una función exponencial.
  CÓMO: Evaluar $f(0)$, aplicar $b^0 = 1$, obtener el resultado $a$ y expresar el par ordenado $(0, a)$.
