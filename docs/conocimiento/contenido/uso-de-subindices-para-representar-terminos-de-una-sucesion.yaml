semantic_id: MAT.NUM.SUCESIONES_BASE.NOTACION_SUBINDICE
resumen_inicial: 'El uso de subíndices representa los términos de una sucesión mediante $a_n$, donde la letra principal denota la sucesión y el subíndice inferior $n$ denota su posición ordinal.'
explicacion_simple: |
  Para nombrar los términos de una sucesión sin confundirnos, usamos **subíndices** (números pequeños abajo a la derecha):
  $$a_1, a_2, a_3, a_4, \dots, a_n, a_{n+1}$$
  - $a_1$ se lee *"a sub uno"* y es el primer término.
  - $a_n$ se lee *"a sub n"* y es el término en la posición $n$.
  - $a_{n-1}$ es el **término anterior** y $a_{n+1}$ es el **término siguiente**.
  - El subíndice NO es una multiplicación: $a_3$ **no significa** $a \cdot 3$.

  ![Uso de subíndices](/static/img/nodos/uso-de-subindices-para-representar-terminos-de-una-sucesion-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el lenguaje algebraico formal, la notación de subíndices $x_k$ representa el valor de la función $x$ evaluada en el argumento $k \in \mathbb{N}$:
  $$x_k \equiv x(k)$$
  donde:
  - $x$ es la **variable que nombra a la sucesión**.
  - $k$ es el **subíndice o índice entero positivo**.

  ### Relaciones de Adyacencia Posicional
  - **Término actual**: $a_n$ (posición $n$).
  - **Término anterior**: $a_{n-1}$ (definido para $n \ge 2$).
  - **Término posterior o sucesor**: $a_{n+1}$ (posición $n+1$).

  ### Distinción Crítica: Subíndices vs Operaciones Algebraicas
  - $a_{n+1} \neq a_n + 1$ (el término siguiente no es sumar 1 al valor actual).
  - $a_{2n} \neq 2 \cdot a_n$ (el término en la posición doble no es el doble del término).

  ### Síntesis didáctica
  - Notación: $a_n$ indexa el elemento de posición $n$.
  - Adyacencia: $a_{n-1} \to a_n \to a_{n+1}$.
definiciones_clave: |
  - **Subíndice**: Número o símbolo escrito en tamaño reducido en la parte inferior derecha que especifica la posición ordinal.
  - **Término sucesor ($a_{n+1}$)**: Elemento que ocupa la posición inmediatamente posterior a $n$.
  - **Término predecesor ($a_{n-1}$)**: Elemento que ocupa la posición inmediatamente anterior a $n$.
propiedades_relaciones: |
  - **Ecuaciones en diferencias**: Las relaciones que vinculan $a_{n+1}$ con $a_n$ permiten modelar crecimientos y recurrencias.
  - **Sub-sucesiones**: Expresiones como $a_{2n}$ seleccionan los términos en posiciones pares $(a_2, a_4, a_6, \dots)$.
ejemplo_guiado:
  enunciado: 'En la sucesión $a = (4, 7, 10, 13, 16)$, identifica los términos $a_1, a_4$, el término anterior a $a_3$ y comprueba que $a_{3+1} \neq a_3 + 1$.'
  imagen: '/static/img/nodos/uso-de-subindices-para-representar-terminos-de-una-sucesion-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos cada término por su subíndice: $a_1 = 4, a_2 = 7, a_3 = 10, a_4 = 13, a_5 = 16$.'
    - 'Paso 2: El primer término es **$a_1 = 4$** y el cuarto es **$a_4 = 13$**.'
    - 'Paso 3: El término anterior a $a_3$ es $a_{3-1} = a_2 = **7$**.'
    - 'Paso 4: Evaluamos $a_{3+1} = a_4 = 13$, mientras que $a_3 + 1 = 10 + 1 = 11$. Como $13 \neq 11$, confirmamos que **$a_{n+1} \neq a_n + 1$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué representa la expresión algebraica $a_{n+1}$ en la teoría de sucesiones?'
    choices:
      - {text: 'El término que ocupa la posición inmediatamente siguiente ($n+1$)', is_correct: true}
      - {text: 'Sumar el número 1 al valor del término $a_n$', is_correct: false}
      - {text: 'Multiplicar el término $a_n$ por $(n+1)$', is_correct: false}
      - {text: 'El primer término de la sucesión', is_correct: false}
    explanation: 'La alternativa correcta es ''El término que ocupa la posición inmediatamente siguiente ($n+1$)''. El subíndice $(n+1)$ indexa la posición siguiente en la secuencia.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una sucesión $b_n$ se tiene que $b_5 = 20$, ¿cuál es la notación para el término anterior?'
    choices:
      - {text: '$b_4$, que corresponde a $b_{5-1}$', is_correct: true}
      - {text: '$b_5 - 1 = 19$', is_correct: false}
      - {text: '$b_6$', is_correct: false}
      - {text: '$b_{10}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b_4$, que corresponde a $b_{5-1}$''. El término anterior a la posición 5 es la posición 4 ($b_4$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la letra de la sucesión seguida del subíndice posicional (ej: $a_n$).'
  - 'Paso 2: Utilizar $a_{n-1}$ para el término previo y $a_{n+1}$ para el término posterior.'
  - 'Paso 3: Evitar confundir operaciones sobre el subíndice con operaciones aritméticas sobre el valor del término.'
errores_correccion: |
  - **Error 1:** Interpretar el subíndice como una multiplicación (creer que $a_4 = a \cdot 4$). **Cómo corregirlo:** El subíndice es una **etiqueta de posición**, no un factor multiplicativo.
  - **Error 2:** Confundir $a_{n+1}$ con $a_n + 1$. **Cómo corregirlo:** $a_{n+1}$ es el **siguiente elemento de la lista**, mientras que $a_n + 1$ es **sumar una unidad al número actual**.
ejemplos:
  - titulo: 'Identificación de notación de subíndice'
    enunciado: '¿La notación $x_7$ representa el séptimo término de la sucesión $x$?'
    alternativas:
      - 'Sí, el subíndice 7 indica la séptima posición'
      - 'No, significa la variable x multiplicada por 7'
      - 'No, significa x elevado a la potencia 7'
    respuesta: 'Sí, el subíndice 7 indica la séptima posición'
    solucion_pasos:
      - '1. El subíndice indica la posición ordinal $n=7$.'
  - titulo: 'Término predecesor'
    enunciado: 'Para el término $a_8$, ¿cuál es su término predecesor inmediato?'
    alternativas:
      - '$a_7$'
      - '$a_9$'
      - '$a_8 - 1$'
    respuesta: '$a_7$'
    solucion_pasos:
      - '1. El predecesor de $n=8$ es $n-1 = 7 \implies a_7$.'
  - titulo: 'Distinción entre $a_{n+1}$ y $a_n + 1$'
    enunciado: '¿La expresión $a_{n+1}$ es equivalente algebraicamente a $a_n + 1$ en general?'
    alternativas:
      - 'No, $a_{n+1}$ es el término siguiente y $a_n + 1$ es sumar 1 al valor'
      - 'Sí, siempre representan la misma operación'
      - 'Sí, por propiedad distributiva'
    respuesta: 'No, $a_{n+1}$ es el término siguiente y $a_n + 1$ es sumar 1 al valor'
    solucion_pasos:
      - '1. Son conceptos completamente diferentes: índice versus valor.'
  - titulo: 'Notación de posición par'
    enunciado: '¿El término $a_{2n}$ indexa los términos que ocupan posiciones pares ($n=1 \implies a_2$, $n=2 \implies a_4$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Para $n=1, 2, 3 \implies 2n = 2, 4, 6 \implies a_2, a_4, a_6$.'
errores_frecuentes:
  - 'La expresión con subíndice $a_n$ representa la multiplicación algebraica entre la letra $a$ y el número $n$.'
  - 'El término siguiente $a_{n+1}$ equivale a sumar algebraicamente el número uno al término $a_n$.'
  - 'El término anterior a $a_n$ se representa como $a_n - 1$ en lugar de $a_{n-1}$.'
  - 'El término $a_{2n}$ es exactamente el doble del valor numérico del término $a_n$.'
  - 'El subíndice de una sucesión puede ser un número fraccionario o negativo.'
afirmaciones_verdaderas:
  - 'El subíndice $n$ en $a_n$ indica de forma unívoca la posición ordinal del término dentro de la sucesión.'
  - 'Las expresiones $a_{n-1}$ y $a_{n+1}$ denotan respectivamente el término anterior y posterior a la posición $n$.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/uso-de-subindices-para-representar-terminos-de-una-sucesion-resumen.svg)

  QUÉ: Utilizar la notación de subíndices para representar, indexar y relacionar términos en sucesiones numéricas.
  CÓMO: Representar la posición mediante $a_n$ y diferenciar con precisión las relaciones de adyacencia $a_{n-1}$, $a_n$, $a_{n+1}$ de las operaciones aritméticas sobre los valores.
