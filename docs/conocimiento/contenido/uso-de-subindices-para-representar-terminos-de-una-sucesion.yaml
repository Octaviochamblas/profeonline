resumen_inicial: La notación de subíndice representa el término de la posición $n$
  como $a_n$, donde 'a' es el nombre de la sucesión y 'n' es la variable discreta
  del índice de posición.
explicacion_simple: Para escribir los términos de una sucesión sin confundirnos, usamos
  una letra pequeña abajo a la derecha del nombre. Así, $a_1$ es el primer término,
  $a_5$ es el quinto término y $a_n$ representa la fórmula de cualquier posición $n$.
explicacion_formal: 'En el convenio simbólico, la **Notación con Subíndice** expresa
  la evaluación funcional como:


  $$a_n \equiv a(n) \quad \text{con } n \in \{1, 2, 3, \dots\}$$


  **Componentes del símbolo:**

  - Variable principal $a$: Denomina la secuencia completa.

  - Subíndice $n$: Identifica la ubicación posicional entera.'
definiciones_clave: '- **Notación de subíndice $a_n$**: Símbolo posicional que equivale
  a la función $a(n)$.'
propiedades_relaciones: '- **Límite de índice**: $n \ge 1$ entero para sucesiones
  estándar de secundaria.'
ejemplo_guiado:
  enunciado: Si el término general de una sucesión es $x_n = 2n + 1$, identifique
    qué representa $x_4$ y calcule su valor.
  pasos:
  - 'Paso 1: $x_4$ representa el término en la cuarta posición ($n=4$).'
  - 'Paso 2: Reemplazar $n=4$ en la notación: $x_4 = 2(4) + 1 = 8 + 1 = 9$.'
  - 'Conclusión: El cuarto término es $x_4 = 9$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la notación an, ¿qué representa específicamente la letra n colocada
    como subíndice?
  choices:
  - text: La posición o número entero de orden del término en la lista
    is_correct: true
  - text: El valor numérico final del término
    is_correct: false
  - text: La suma total de la sucesión
    is_correct: false
  - text: La cantidad de ceros de la fórmula
    is_correct: false
  explanation: La alternativa correcta es 'La posición o número entero de orden del
    término en la lista'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para xn = 2n + 1, ¿cuál fue el valor obtenido para
    x4?
  choices:
  - text: '9'
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '7'
    is_correct: false
  explanation: La alternativa correcta es '9'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de interpretar y utilizar la notación
  con subíndice $a_n$ para nombrar y evaluar términos en cualquier posición.
semantic_id: MAT.NUM.SUCESIONES_BASE.NOTACION_SUBINDICE
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.NOTACION_SUBINDICE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
