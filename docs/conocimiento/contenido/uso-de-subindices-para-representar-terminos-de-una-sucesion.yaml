semantic_id: MAT.NUM.SUCESIONES_BASE.NOTACION_SUBINDICE
resumen_inicial: 'Uso de subíndices para representar términos de una sucesión: concepto
  y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: 'Los matemáticos son perezosos para escribir. En lugar de anotar
  ''el quinto número de la fila A es 20'', inventaron un símbolo corto y elegante:
  $a_5 = 20$. Conocer este idioma te ahorrará mucha lectura.'
explicacion_formal: 'En vez de escribir frases largas, usamos la **notación de subíndice**:

  - Se elige una letra para nombrar a la sucesión completa (casi siempre **$a$**,
  a veces $b$, $c$, etc.).

  - Se le añade un número pequeñito abajo a la derecha (**el subíndice**), que indica
  la posición.


  Ejemplo en la sucesión $a$: $7, 14, 21, 28, \dots$

  - **$a_1 = 7$** (Se lee ''a sub uno es igual a siete'').

  - **$a_2 = 14$**

  - **$a_4 = 28$**


  El símbolo mágico es **$a_n$**, que significa ''un término cualquiera que está en
  la posición $n$''. Te permite hablar de las reglas de la sucesión de manera universal
  sin referirte a un número específico.'
definiciones_clave: '- **Uso de subíndices para representar términos de una sucesión**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Uso de subíndices para representar términos
  de una sucesión**: Relaciones de cambio y fórmulas estructurales de conceptos fundamentales
  de sucesiones.'
