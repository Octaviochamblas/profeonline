procedimiento:
- 'Paso 1: Identifica la letra base (por ejemplo ''a'') que nombra la lista.'
- 'Paso 2: Mira el número chiquito (subíndice). Ese es la posición ''n''.'
- 'Paso 3: Busca en la lista el valor numérico que está en esa posición.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en uso de subíndices para representar términos de una sucesión.
ejemplos:
- titulo: Traduciendo el subíndice
  enunciado: 'Dada la sucesión b: 100, 90, 80, 70, 60... ¿Cuánto vale la suma de $b_2
    + b_5$?'
  solucion_pasos:
  - El subíndice indica la posición.
  - $b_2$ es el segundo término, que vale 90.
  - $b_5$ es el quinto término, que vale 60.
  - La suma es 90 + 60 = 150.
errores_frecuentes:
- Creer que el subíndice multiplica a la letra (pensar que $a_3$ significa 'a multiplicado
  por 3').
- Confundir el subíndice (posición) con el exponente (potencia). ¡Van escritos abajo,
  no arriba!
afirmaciones_verdaderas:
- La formulación de uso de subíndices para representar términos de una sucesión mantiene
  la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando uso de subíndices
  para representar términos de una sucesión.
