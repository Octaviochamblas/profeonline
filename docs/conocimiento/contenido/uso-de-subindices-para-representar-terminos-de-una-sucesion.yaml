semantic_id: MAT.NUM.SUCESIONES_BASE.NOTACION_SUBINDICE
resumen_inicial: 'El uso de subíndices en sucesiones es el sistema de notación simbólica $a_n$ donde la letra minúscula representa la sucesión y el subíndice inferior $n$ especifica el número de posición del término.'
explicacion_simple: |
  En matemáticas, para no tener que escribir *"el quinto término de la lista a"*, usamos **subíndices**:
  - Escribimos **$a_5$** (se lee *"a sub cinco"*).
  - La letra minúscula $a$ nombra a la sucesión completa.
  - El numerito pequeño abajo ($5$) nos dice que estamos en la quinta casilla.
  Si la sucesión se llama $b$, el primer término es $b_1$, el segundo es $b_2$, el décimo es $b_{10}$ y el término general se escribe $b_n$.
explicacion_formal: |
  ### Definición formal
  La **notación por subíndice** es la convención algebraica estandarizada para etiquetar los elementos de una secuencia ordenada. Para una función $a: \mathbb{N} \to \mathbb{R}$:
  $$a(n) \equiv a_n$$
  donde:
  - $a$ es el **identificador nominal de la sucesión** (se pueden usar $b, c, x, y, u, v$).
  - $n$ es el **subíndice de posición u orden** ($n \in \mathbb{N}$).

  ### Operaciones con subíndices en expresiones algebraicas
  Los subíndices admiten operaciones aritméticas internas que modifican el puntero posicional de la sucesión:
  - $a_{n+1}$: Término ubicado una posición adelante respecto a $a_n$.
  - $a_{n-1}$: Término ubicado una posición atrás respecto a $a_n$.
  - $a_{2n}$: Término ubicado en las posiciones pares ($a_2, a_4, a_6, a_8, \dots$).
  - $a_{2n-1}$: Término ubicado en las posiciones impares ($a_1, a_3, a_5, a_7, \dots$).

  ### Síntesis didáctica
  - Notación básica: $a_n = \text{Término en la posición } n$.
  - Desplazamiento posicional: $a_{n+k} = \text{Avanzar } k \text{ casillas}$; $a_{n-k} = \text{Retroceder } k \text{ casillas}$.
definiciones_clave: |
  - **Subíndice posicional**: Número o variable en formato pequeño inferior que indica la posición del término.
  - **Identificador nominal**: Letra que distingue a una sucesión de otras en un mismo problema ($a_n, b_n, c_n$).
  - **Subíndice compuesto**: Expresión algebraica en el subíndice que selecciona subsecuencias ($a_{2n}, a_{n+1}$).
propiedades_relaciones: |
  - **Diferencia entre $a_n + 1$ y $a_{n+1}$**:
    - $a_n + 1$: Suma la unidad al **valor** del término $a_n$.
    - $a_{n+1}$: Selecciona el **siguiente término** en la secuencia.
  - **Identidad de notación de función**: $a_n$ es exactamente equivalente a la notación funcional $a(n)$.
ejemplo_guiado:
  enunciado: 'Si una sucesión $b_n$ está dada por $b_n = 2^n + 3$, calcula la diferencia entre la expresión $b_{n+1}$ y la expresión $b_n + 1$. Luego evalúa ambas para $n=2$.'
  pasos:
    - 'Paso 1: Para $b_{n+1}$, reemplazamos $(n+1)$ en la variable $n$: $b_{n+1} = 2^{n+1} + 3$.'
    - 'Paso 2: Para $b_n + 1$, le sumamos 1 a la fórmula completa: $b_n + 1 = (2^n + 3) + 1 = 2^n + 4$.'
    - 'Paso 3: Evaluamos $b_{n+1}$ para $n=2$ (que es el término $b_3$): $b_3 = 2^{2+1} + 3 = 2^3 + 3 = 8 + 3 = 11$.'
    - 'Paso 4: Evaluamos $b_n + 1$ para $n=2$: $b_2 + 1 = (2^2 + 3) + 1 = 7 + 1 = 8$. Comprobamos que **$b_{n+1} \neq b_n + 1$** ($11 \neq 8$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué diferencia existe entre la notación $a_{n+1}$ y la notación $a_n + 1$?'
    choices:
      - {text: '$a_{n+1}$ es el término de la siguiente posición, mientras que $a_n + 1$ le suma 1 al valor del término actual', is_correct: true}
      - {text: 'Ambas expresiones representan exactamente lo mismo', is_correct: false}
      - {text: '$a_{n+1}$ multiplica el término por 2', is_correct: false}
      - {text: '$a_n + 1$ retrocede una posición en la lista', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_{n+1}$ es el término de la siguiente posición, mientras que $a_n + 1$ le suma 1 al valor del término actual''. El subíndice cambia la posición.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en la sucesión $x_n$, el término $x_4 = 15$, ¿cómo se representa simbólicamente el valor del cuarto término de la sucesión $x$?'
    choices:
      - {text: 'Mediante la notación por subíndice $x_4 = 15$', is_correct: true}
      - {text: 'Mediante la potencia $x^4 = 15$', is_correct: false}
      - {text: 'Mediante el producto $x \cdot 4 = 15$', is_correct: false}
      - {text: 'Mediante la división $x / 4 = 15$', is_correct: false}
    explanation: 'La alternativa correcta es ''Mediante la notación por subíndice $x_4 = 15$''. Se usa el subíndice 4.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la letra minúscula asignada a la sucesión ($a, b, c, x$).'
  - 'Paso 2: Escribir la posición deseada en forma de subíndice numérico inferior ($a_1, a_2, a_{10}$).'
  - 'Paso 3: Para sustituir un subíndice compuesto (como $n+1$ o $2n$), reemplazar toda la variable $n$ por la nueva expresión entre paréntesis.'
  - 'Paso 4: Distinguir con precisión los operadores que afectan al subíndice de los que afectan al valor del término.'
errores_correccion: |
  - **Error 1:** Confundir un subíndice con un exponente o potencia (ej: confundir $a_2$ con $a^2$). **Cómo corregirlo:** El subíndice está escrito **abajo en pequeño ($a_2$)** e indica posición; el exponente está arriba ($a^2$) e indica potencia.
  - **Error 2:** Confundir $a_{n+1}$ con $a_n + 1$. **Cómo corregirlo:** En $a_{n+1}$ el $+1$ está dentro del subíndice e indica la **siguiente casilla**; en $a_n + 1$ el $+1$ le suma 1 al **resultado de la cifra**.
ejemplos:
  - titulo: 'Lectura de notación por subíndices'
    enunciado: '¿El símbolo $a_7$ se lee "a sub siete" y representa el séptimo término de la sucesión $a$?'
    alternativas:
      - 'Sí, por convención de subíndices'
      - 'No, significa a elevado a 7'
      - 'No, significa 7 veces a'
    respuesta: 'Sí, por convención de subíndices'
    solucion_pasos:
      - '1. Letra $a$: nombre de la sucesión.'
      - '2. Subíndice $7$: posición 7.'
  - titulo: 'Subíndice para términos pares'
    enunciado: '¿La notación $a_{2n}$ representa la secuencia de términos en posiciones pares ($a_2, a_4, a_6, \dots$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para $n=1 \implies a_2$, para $n=2 \implies a_4$, para $n=3 \implies a_6$.'
  - titulo: 'Sucesión con nombre b'
    enunciado: 'Si una sucesión se denota $b_n = n^2$, ¿el término $b_3 = 3^2 = 9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $b_3 = 3^2 = 9$.'
  - titulo: 'Subíndice del término antecesor'
    enunciado: '¿La notación $x_{n-1}$ representa el término anterior al término $x_n$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $n-1$ indica una casilla atrás.'
errores_frecuentes:
  - 'Escribir el subíndice de posición en la parte superior del término como si fuera un exponente o potencia.'
  - 'Igualar la expresión del sucesor posicional $a_{n+1}$ con la suma del valor $a_n + 1$.'
  - 'Tratar la letra del subíndice como una variable multiplicativa que escala el valor del término.'
  - 'Usar letras mayúsculas para los subíndices de posición por defecto.'
  - 'Considerar que cambiar la letra nominal ($a_n$ por $b_n$) altera la fórmula matemática de la regla.'
afirmaciones_verdaderas:
  - 'La notación por subíndice $a_n$ indica que el término pertenece a la sucesión $a$ y ocupa la posición $n$.'
  - 'La expresión $a_{n+1}$ denota el término en la posición siguiente, mientras que $a_n + 1$ suma 1 al valor de $a_n$.'
al_terminar_debes_poder: 'Utilizar y manipular correctamente la notación de subíndices $a_n, a_{n+1}, a_{n-1}$ en sucesiones numéricas.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
