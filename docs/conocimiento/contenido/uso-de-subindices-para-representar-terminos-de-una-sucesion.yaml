procedimiento:
- 'Paso 1: Identifica la letra base (por ejemplo ''a'') que nombra la lista.'
- 'Paso 2: Mira el número chiquito (subíndice). Ese es la posición ''n''.'
- 'Paso 3: Busca en la lista el valor numérico que está en esa posición.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en uso de subíndices para representar términos de una sucesión.
ejemplos:
- titulo: Traduciendo el subíndice
  enunciado: 'Dada la sucesión b: 100, 90, 80, 70, 60... ¿Cuánto vale la suma de $b_2 + b_5$?'
  solucion_pasos:
  - El subíndice indica la posición.
  - $b_2$ es el segundo término, que vale 90.
  - $b_5$ es el quinto término, que vale 60.
  - La suma es 90 + 60 = 150.
- titulo: Ejemplo 1
  enunciado: ¿Qué representa el subíndice en el término a_7?
  alternativas:
  - La posición 7 del término
  - El valor 7 del término
  - El resultado de multiplicar el término por 7
  respuesta: La posición 7 del término
  solucion_pasos:
  - El subíndice siempre indica el lugar que ocupa el término dentro de la sucesión, no su
    valor.
- titulo: Ejemplo 2
  enunciado: Si b_1 es 5, b_2 es 10 y b_3 es 15, ¿cuánto vale el producto de b_2 por b_3?
  alternativas:
  - '150'
  - '50'
  - '25'
  respuesta: '150'
  solucion_pasos:
  - b_2 vale 10 y b_3 vale 15.
  - Multiplico 10 por 15 y obtengo 150.
- titulo: ¿El subíndice puede ser un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - 'Las posiciones de una sucesión son siempre números naturales positivos: 1, 2, 3 y así
    sucesivamente.'
- titulo: ¿Se puede usar cualquier letra, como a, b o c, para nombrar una sucesión?
  respuesta: Sí
  solucion_pasos:
  - La letra es solo una etiqueta; lo importante es mantener la misma letra para toda la sucesión
    dentro de un mismo problema.
errores_frecuentes:
- Creer que el subíndice multiplica a la letra (pensar que $a_3$ significa 'a multiplicado
  por 3').
- Confundir el subíndice (posición) con el exponente (potencia). ¡Van escritos abajo, no arriba!
- Escribir el subíndice como si fuera un exponente, confundiendo a tres con a elevado a tres.
- Sumar el subíndice al valor del término, pensando que a tres equivale a 'a más 3'.
- Usar letras distintas para referirse a la misma sucesión dentro de un mismo problema.
afirmaciones_verdaderas:
- La formulación de uso de subíndices para representar términos de una sucesión mantiene la
  regularidad de la sucesión.
- El subíndice de un término siempre representa su posición, nunca se suma ni se resta al
  valor del término.
al_terminar_debes_poder: Resolver problemas prácticos utilizando uso de subíndices para representar
  términos de una sucesión.
