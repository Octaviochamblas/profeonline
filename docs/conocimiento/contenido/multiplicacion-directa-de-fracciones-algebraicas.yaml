semantic_id: MAT.ALG.FRACCIONES_MULT.PRODUCTO_DIRECTO
resumen_inicial: 'Multiplicación directa de fracciones algebraicas: concepto, reglas
  operativas y simplificación en Multiplicación de fracciones algebraicas.'
explicacion_simple: 'A diferencia de la suma, la multiplicación no requiere denominadores
  comunes. La multiplicación es directa: los de arriba se multiplican con los de arriba,
  y los de abajo con los de abajo.'
explicacion_formal: '### Definición formal


  El producto de fracciones es directo: numerador por numerador, denominador por denominador.


  ### Desarrollo didáctico


  Multiplicar fracciones algebraicas es paradójicamente mucho más sencillo que sumarlas,
  porque no necesitas buscar denominadores comunes (MCM).


  La regla es el ataque directo:

  - **Numerador por Numerador (Piso de arriba se multiplica con piso de arriba)**

  - **Denominador por Denominador (Piso de abajo se multiplica con piso de abajo)**


  Fórmula general: $\frac{A}{B} \cdot \frac{C}{D} = \frac{A \cdot C}{B \cdot D}$


  Por ejemplo: $\frac{2x}{3y} \cdot \frac{4x^2}{5} = \frac{2x \cdot 4x^2}{3y \cdot
  5} = \frac{8x^3}{15y}$.


  Simplemente aplicas las leyes de los exponentes (bases iguales suman exponentes)
  y multiplicas los números libremente. Es rápido y directo.'
definiciones_clave: '- **Multiplicación directa de fracciones algebraicas**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a multiplicación directa de fracciones
  algebraicas.'
ejemplo_guiado:
