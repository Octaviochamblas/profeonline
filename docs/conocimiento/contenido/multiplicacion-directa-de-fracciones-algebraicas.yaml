semantic_id: MAT.ALG.FRACCIONES_MULT.PRODUCTO_DIRECTO
resumen_inicial: La multiplicación de fracciones algebraicas se realiza multiplicando
  los numeradores entre sí y los denominadores entre sí.
explicacion_simple: 'Para multiplicar dos o más fracciones algebraicas, seguimos la
  misma regla que en la aritmética común:

  Multiplicamos numerador por numerador para obtener el nuevo numerador, y denominador
  por denominador para obtener el nuevo denominador.

  Sin embargo, antes o después de multiplicar, es importante simplificar los factores
  resultantes para expresar el producto en su forma reducida.'
explicacion_formal: 'Dadas dos fracciones algebraicas $\frac{A(x)}{B(x)}$ y $\frac{C(x)}{D(x)}$
  con $B(x) \neq 0$ y $D(x) \neq 0$, el **producto directo** se define formalmente
  como:


  $$\frac{A(x)}{B(x)} \cdot \frac{C(x)}{D(x)} = \frac{A(x) \cdot C(x)}{B(x) \cdot
  D(x)}$$


  **Desglose de la fórmula:**

  - $A(x) \cdot C(x)$: Producto polinomial de los numeradores que conforma el dividendo
  final.

  - $B(x) \cdot D(x)$: Producto polinomial de los denominadores que conforma el divisor
  final no nulo.'
definiciones_clave: '- **Producto directo**: Operación racional donde se efectúa el
  producto horizontal de numeradores y denominadores.

  - **Factorización de producto**: Expresión del resultado como un único cociente
  de polinomios multiplicados.'
propiedades_relaciones: '- **Conmutatividad y Asociatividad**: El producto de fracciones
  algebraicas cumple la propiedad conmutativa $F_1 \cdot F_2 = F_2 \cdot F_1$ y asociativa.

  - **Dominio del producto**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid B(x) \neq
  0 \land D(x) \neq 0\}$.'
ejemplo_guiado:
  enunciado: Multiplica directamente las fracciones algebraicas $\frac{4x}{3y^2}$
    y $\frac{9y}{2x^2}$, simplifica el resultado y evalúalo para $x = 2$ e $y = 3$.
  pasos:
  - 'Paso 1: Multiplicar numeradores y denominadores horizontalmente: $\frac{4x \cdot
    9y}{3y^2 \cdot 2x^2} = \frac{36xy}{6x^2y^2}$.Paso 2: Simplificar los coeficientes
    numéricos $\frac{36}{6} = 6$.Paso 3: Simplificar las variables $\frac{xy}{x^2y^2}
    = \frac{1}{xy}$.Paso 4: Escribir el producto reducido: $\frac{6}{xy}$.Paso 5:
    Evaluar para $x = 2, y = 3$: $\frac{6}{2 \cdot 3} = \frac{6}{6} = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla fundamental para multiplicar las fracciones algebraicas
    $\frac{A(x)}{B(x)}$ y $\frac{C(x)}{D(x)}$?
  choices:
  - text: 'Multiplicar numeradores entre sí y denominadores entre sí: $\frac{A(x)
      \cdot C(x)}{B(x) \cdot D(x)}$.'
    is_correct: true
  - text: Multiplicar en cruz $A(x) \cdot D(x)$ e igualar a $B(x) \cdot C(x)$.
    is_correct: false
  - text: Sumar los numeradores y multiplicar los denominadores.
    is_correct: false
  - text: Dividir el primer numerador entre el segundo denominador.
    is_correct: false
  explanation: 'La alternativa correcta es ''Multiplicar numeradores entre sí y denominadores
    entre sí: $\frac{A(x) \cdot C(x)}{B(x) \cdot D(x)}$.''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al multiplicar $\frac{4x}{3y^2} \cdot \frac{9y}{2x^2}$ y evaluar su forma
    simplificada para $x = 2$ e $y = 3$, ¿cuál es el resultado?
  choices:
  - text: $1$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $\frac{1}{6}$
    is_correct: false
  - text: $3$
    is_correct: false
  explanation: La alternativa correcta es '$1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los polinomios o monomios de los numeradores.'
- 'Paso 2: Multiplicar los polinomios o monomios de los denominadores.'
- 'Paso 3: Escribir la nueva fracción con el producto de numeradores sobre el producto
  de denominadores.'
- 'Paso 4: Factorizar y simplificar la fracción resultante al mínimo.'
errores_correccion: '- **Error común:** Multiplicar en cruz al realizar la multiplicación
  de fracciones (confundir multiplicación directa con división).

  - **Cómo corregirlo:** La multiplicación de fracciones se hace SIEMPRE de forma
  HORIZONTAL (numerador por numerador, denominador por denominador). La multiplicación
  en cruz se usa para la división o verificación de proporción.'
ejemplos:
- titulo: 'Ejemplo 1: Producto directo de monomios'
  enunciado: Calcula el producto de $\frac{3a}{b}$ y $\frac{2a}{5c}$.
  alternativas:
  - $\frac{6a^2}{5bc}$
  - $\frac{5a^2}{5bc}$
  - $\frac{6a}{5bc}$
  respuesta: $\frac{6a^2}{5bc}$
  solucion_pasos:
  - '1. Numeradores: $3a \cdot 2a = 6a^2$.2. Denominadores: $b \cdot 5c = 5bc$.3.
    Producto final: $\frac{6a^2}{5bc}$.'
- titulo: 'Ejemplo 2: Producto con binomio simple'
  enunciado: Multiplica $\frac{x}{x + 1}$ por $\frac{2}{x - 1}$.
  alternativas:
  - $\frac{2x}{x^2 - 1}$
  - $\frac{2x}{x^2 + 1}$
  - $\frac{x + 2}{x^2 - 1}$
  respuesta: $\frac{2x}{x^2 - 1}$
  solucion_pasos:
  - '1. Numerador: $x \cdot 2 = 2x$.2. Denominador: $(x + 1)(x - 1) = x^2 - 1$.3.
    Producto: $\frac{2x}{x^2 - 1}$.'
- titulo: ¿El producto de dos fracciones algebraicas positivas es siempre positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí. Por la ley de signos de la multiplicación, positivo por positivo resulta en
    positivo.
- titulo: ¿Se deben sumar los denominadores al multiplicar fracciones algebraicas?
  respuesta: 'No'
  solucion_pasos:
  - No. En la multiplicación de fracciones, los denominadores se MULTIPLICAN entre
    sí.
errores_frecuentes:
- Multiplicar en cruz numeradores y denominadores al realizar una multiplicación de
  fracciones.
- Sumar los denominadores en lugar de multiplicarlos.
- Simplificar numeradores entre sí sin dividirlos por el denominador.
- Olvidar elevar al cuadrado la variable cuando se multiplica por sí misma ($x \cdot
  x = 2x$ en vez de $x^2$).
- Multiplicar solo el numerador dejando el denominador sin cambiar.
afirmaciones_verdaderas:
- En la multiplicación de fracciones algebraicas, los numeradores se multiplican horizontalmente
  entre sí y los denominadores entre sí.
- El dominio de la fracción producto excluye los valores que anulen cualquiera de
  los denominadores originales.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar la multiplicación
  directa de fracciones algebraicas multiplicando numeradores y denominadores horizontalmente.
