semantic_id: MAT.ALG.FRACCIONES_MULT.PRODUCTO_DIRECTO
resumen_inicial: La multiplicación directa de fracciones algebraicas consiste en multiplicar los numeradores entre sí para
  obtener el nuevo numerador y los denominadores entre sí para obtener el nuevo denominador.
explicacion_simple: 'Para **multiplicar dos o más fracciones algebraicas** (por ejemplo: $\frac{P_1}{Q_1} \cdot \frac{P_2}{Q_2}$):


  1. **Multiplicamos los numeradores entre sí** (arriba por arriba): el producto de las expresiones superiores pasa a ser
  el nuevo numerador.

  2. **Multiplicamos los denominadores entre sí** (abajo por abajo): el producto de las expresiones inferiores pasa a ser
  el nuevo denominador.


  Por ejemplo, con monomios:

  $$\frac{3x^2}{4y} \cdot \frac{2y^3}{5x} = \frac{3x^2 \cdot 2y^3}{4y \cdot 5x} = \frac{6x^2y^3}{20xy}$$


  ![Multiplicación directa de fracciones algebraicas](/static/img/nodos/multiplicacion-directa-de-fracciones-algebraicas-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sean $\frac{P_1(x)}{Q_1(x)}, \frac{P_2(x)}{Q_2(x)}$ dos fracciones algebraicas en el cuerpo de funciones racionales sobre
  $\mathbb{R}$. La **multiplicación de fracciones algebraicas** se define como el producto directo de sus términos:


  $$\frac{P_1(x)}{Q_1(x)} \cdot \frac{P_2(x)}{Q_2(x)} = \frac{P_1(x) \cdot P_2(x)}{Q_1(x) \cdot Q_2(x)}$$


  ### Restricción del Dominio

  El dominio de definición del producto es la intersección de los dominios individuales:


  $$\operatorname{Dom}\left(\frac{P_1 P_2}{Q_1 Q_2}\right) = \{x \in \mathbb{R} \mid Q_1(x) \neq 0 \land Q_2(x) \neq 0\}$$


  ### Síntesis didáctica

  Multiplicar fracciones algebraicas exige operar de forma estrictamente horizontal, multiplicando las expresiones superiores
  para el numerador y las inferiores para el denominador.

  '
definiciones_clave: '- **Multiplicación directa de fracciones**: Operación horizontal que calcula el producto de los numeradores
  y de los denominadores.

  - **Numerador resultante**: Producto $P_1(x) \cdot P_2(x)$ obtenido al multiplicar las expresiones superiores.

  - **Denominador resultante**: Producto $Q_1(x) \cdot Q_2(x)$ obtenido al multiplicar las expresiones inferiores.

  '
propiedades_relaciones: '- **Conmutatividad y asociatividad**: Cumple las propiedades conmutativa ($\frac{A}{B} \cdot \frac{C}{D}
  = \frac{C}{D} \cdot \frac{A}{B}$) y asociativa.

  - **Requisito de dominio conjunto**: Ningún valor que anule cualquiera de los denominadores originales pertenece al dominio
  del producto.

  '
ejemplo_guiado:
  enunciado: Calcula el producto directo entre las fracciones algebraicas $\frac{2x}{3y^2}$ y $\frac{9y}{4x^3}$.
  pasos:
  - 'Paso 1: Plantear la multiplicación horizontal de numeradores y denominadores: $\frac{2x \cdot 9y}{3y^2 \cdot 4x^3}$.'
  - 'Paso 2: Multiplicar los coeficientes y variables del numerador: $2x \cdot 9y = 18xy$.'
  - 'Paso 3: Multiplicar los coeficientes y variables del denominador: $3y^2 \cdot 4x^3 = 12x^3y^2$.'
  - 'Paso 4: Formar la fracción compuesta resultante antes de simplificar: $\frac{18xy}{12x^3y^2}$.'
  - 'Paso 5: Concluir que el producto directo obtenido es $\frac{18xy}{12x^3y^2}$.'
  imagen: /static/img/nodos/multiplicacion-directa-de-fracciones-algebraicas-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al efectuar el producto directo entre las fracciones $\frac{a}{b}$ y $\frac{c}{d}$, ¿cuál es la fórmula resultante?
  choices:
  - text: $\frac{ac}{bd}$
    is_correct: true
  - text: $\frac{ad}{bc}$
    is_correct: false
  - text: $\frac{a+c}{b+d}$
    is_correct: false
  - text: $\frac{ac}{b+d}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{ac}{bd}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo debe realizarse la multiplicación de los denominadores en el producto de fracciones algebraicas?
  choices:
  - text: Multiplicando de forma horizontal el denominador de la primera por el denominador de la segunda
    is_correct: true
  - text: Sumando ambos denominadores
    is_correct: false
  - text: Multiplicando el numerador por el denominador en cruz
    is_correct: false
  - text: Conservando un solo denominador sin modificar
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando de forma horizontal el denominador de la primera por el denominador
    de la segunda'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar la expresión del primer numerador por el segundo numerador para formar el nuevo numerador.'
- 'Paso 2: Multiplicar la expresión del primer denominador por el segundo denominador para formar el nuevo denominador.'
- 'Paso 3: Expresar el resultado como la fracción unificada $\frac{P_1 \cdot P_2}{Q_1 \cdot Q_2}$.'
- 'Paso 4: Declarar las restricciones de dominio acumuladas ($Q_1 \neq 0 \land Q_2 \neq 0$).'
errores_correccion: '- **Error 1:** Multiplicar en cruz los términos al realizar un producto de fracciones algebraicas (escribir
  $\frac{a}{b} \cdot \frac{c}{d} = \frac{ad}{bc}$). **Cómo corregirlo:** La multiplicación de fracciones **SE REALIZA SIEMPRE
  DE FORMA HORIZONTAL (numerador por numerador y denominador por denominador: $\frac{a \cdot c}{b \cdot d}$)**.

  - **Error 2:** Sumar los denominadores en lugar de multiplicarlos. **Cómo corregirlo:** El denominador del producto **ES
  EL PRODUCTO DE LOS DENOMINADORES, NO SU SUMA ($b \cdot d$)**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el producto directo de $\frac{2x}{3y^2} \cdot \frac{9y}{4x^3}$ antes de simplificar?
  alternativas:
  - $\frac{18xy}{12x^3y^2}$
  - $\frac{18x^4y^3}{12}$
  - $\frac{11xy}{7x^3y^2}$
  respuesta: $\frac{18xy}{12x^3y^2}$
  solucion_pasos:
  - '1. Multiplicar numeradores: $2x \cdot 9y = 18xy$.'
  - '2. Multiplicar denominadores: $3y^2 \cdot 4x^3 = 12x^3y^2$.'
  - '3. Formar la fracción: $\frac{18xy}{12x^3y^2}$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el producto directo de $\frac{x+1}{x} \cdot \frac{3}{y}$?
  alternativas:
  - $\frac{3x+3}{xy}$
  - $\frac{3x+1}{xy}$
  - $\frac{x+4}{xy}$
  respuesta: $\frac{3x+3}{xy}$
  solucion_pasos:
  - '1. Multiplicar numeradores: $(x+1) \cdot 3 = 3x + 3$.'
  - '2. Multiplicar denominadores: $x \cdot y = xy$.'
  - '3. Resultado: $\frac{3x+3}{xy}$.'
- titulo: Multiplicación en cruz no válida
  enunciado: Al multiplicar $\frac{1}{x} \cdot \frac{1}{y}$, ¿resulta $\frac{y}{x}$ al operar en cruz?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es $\frac{1}{xy}$ al multiplicar horizontalmente.
- titulo: Tres fracciones
  enunciado: Para $\frac{a}{b} \cdot \frac{c}{d} \cdot \frac{e}{f}$, ¿es el resultado $\frac{ace}{bdf}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, se multiplican todas horizontalmente numeradores con numeradores y denominadores con denominadores.
errores_frecuentes:
- El producto de dos fracciones algebraicas $\frac{a}{b} \cdot \frac{c}{d}$ se obtiene multiplicando en cruz como $\frac{ad}{bc}$.
- Al multiplicar las fracciones $\frac{A}{B} \cdot \frac{C}{D}$, el denominador resultante se calcula sumando ambos denominadores
  como $B + D$.
- El producto de un monomio $k$ por la fracción $\frac{a+b}{c}$ equivale a $\frac{ka+b}{c}$.
- En la multiplicación $\frac{p}{q} \cdot \frac{r}{s}$, el resultado $\frac{pr}{qs}$ solo existe si $q = s$.
- Olvidar acumular las restricciones de ambos denominadores en el dominio resultante.
afirmaciones_verdaderas:
- La multiplicación de fracciones algebraicas se realiza multiplicando numeradores entre sí y denominadores entre sí.
- El dominio del producto excluye los valores que anulan a cualquiera de los denominadores originales.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/multiplicacion-directa-de-fracciones-algebraicas-resumen.svg)


  QUÉ: Multiplicar fracciones algebraicas de forma directa.

  CÓMO: Multiplicar los numeradores entre sí para obtener el nuevo numerador y los denominadores entre sí para obtener el
  nuevo denominador ($\frac{P_1(x) \cdot P_2(x)}{Q_1(x) \cdot Q_2(x)}$), declarando las restricciones $Q_1(x) \neq 0$ y $Q_2(x)
  \neq 0$.

  '
