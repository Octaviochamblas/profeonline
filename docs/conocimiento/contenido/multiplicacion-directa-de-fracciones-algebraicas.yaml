procedimiento:
- 'Paso 1: Multiplica los numeradores entre sí.'
- 'Paso 2: Multiplica los denominadores entre sí.'
- 'Paso 3: Expresa el resultado como una sola fracción.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en multiplicación directa de fracciones algebraicas.
ejemplos:
- titulo: Multiplica $\frac{4}{a} \cdot \frac{b}{7}$
  enunciado: Multiplica $\frac{4}{a} \cdot \frac{b}{7}$.
  solucion_pasos:
  - 'Numerador: $4 \cdot b = 4b$.'
  - 'Denominador: $a \cdot 7 = 7a$.'
  - 'Resultado: $\frac{4b}{7a}$.'
- titulo: Multiplica $\frac{x}{2} \cdot \frac{x}{3}$.
  solucion_pasos:
  - $x \cdot x = x^2$ y $2 \cdot 3 = 6$.
- titulo: 'Respecto de «Multiplicación directa de fracciones algebraicas»: ¿Se ajusta
    a la definición e'
  enunciado: 'Respecto de «Multiplicación directa de fracciones algebraicas»: ¿Se
    ajusta a la definición esta afirmación? «El producto de dos fracciones $\frac{A}{B}$
    y $\frac{C}{D}$ es igual a $\frac{AC}{BD}$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El producto de dos fracciones
    $\frac{A}{B}$ y $\frac{C}{D}$ es igual a $\frac{AC}{BD}$.'
- titulo: 'Respecto de «Multiplicación directa de fracciones algebraicas»: ¿Es compatible
    con el proced'
  enunciado: 'Respecto de «Multiplicación directa de fracciones algebraicas»: ¿Es
    compatible con el procedimiento esta afirmación? «Multiplicar cruzado en lugar
    de directo»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El producto de dos fracciones
    $\frac{A}{B}$ y $\frac{C}{D}$ es igual a $\frac{AC}{BD}$.'
errores_frecuentes:
- Multiplicar cruzado en lugar de directo.
- Sumar los numeradores en lugar de multiplicarlos.
- Para «¿Cómo se obtiene el numerador del producto de dos fracciones algebraicas»,
  la respuesta correcta es Multiplicando cruzado.
- Para «¿Cómo se obtiene el numerador del producto de dos fracciones algebraicas»,
  la respuesta correcta es Sumando los numeradores.
- Para «¿Cómo se obtiene el numerador del producto de dos fracciones algebraicas»,
  la respuesta correcta es Dividiendo los numeradores.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando multiplicación
  directa de fracciones algebraicas.
