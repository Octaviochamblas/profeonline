semantic_id: MAT.ALG.FRACCIONES_MULT.PRODUCTO_DIRECTO
resumen_inicial: 'La multiplicación directa de fracciones algebraicas consiste en multiplicar los numeradores entre sí para obtener el nuevo numerador y los denominadores entre sí para obtener el nuevo denominador.'
explicacion_simple: |
  Para **multiplicar dos o más fracciones algebraicas** (ej: $\frac{P_1}{Q_1} \cdot \frac{P_2}{Q_2}$):
  - **FÓRMULA GENERAL DE MULTIPLICACIÓN**:
    $$\mathbf{\frac{A}{B} \cdot \frac{C}{D} = \frac{A \cdot C}{B \cdot D}}$$
  - **REGLAS DE ORO EN 2 PASOS**:
    1. **Multiplica los numeradores entre sí** (arriba por arriba):
       - $(A) \cdot (C) = AC$.
    2. **Multiplica los denominadores entre sí** (abajo por abajo):
       - $(B) \cdot (D) = BD$.
  - **Ejemplo con monomios**:
    $$\frac{3x^2}{4y} \cdot \frac{2y^3}{5x} = \frac{3x^2 \cdot 2y^3}{4y \cdot 5x} = \frac{6x^2y^3}{20xy}$$
explicacion_formal: |
  ### Definición formal
  Sean $\frac{P_1(x)}{Q_1(x)}, \frac{P_2(x)}{Q_2(x)} \in \mathbb{K}(x)$ dos fracciones algebraicas en el cuerpo de funciones racionales sobre $\mathbb{K}$. La operación de **multiplicación fraccionaria** se define formalmente como el producto directo de los componentes del dominio y codominio:

  $$\frac{P_1(x)}{Q_1(x)} \cdot \frac{P_2(x)}{Q_2(x)} = \frac{P_1(x) \cdot P_2(x)}{Q_1(x) \cdot Q_2(x)}$$

  ### Restricción del Dominio
  El dominio de definición del producto de fracciones es la intersección de los dominios individuales:

  $$\operatorname{Dom}\left(\frac{P_1 P_2}{Q_1 Q_2}\right) = \{x \in \mathbb{R} \mid Q_1(x) \neq 0 \land Q_2(x) \neq 0\}$$

  ### Síntesis didáctica
  Multiplicar fracciones algebraicas exige operar de forma horizontal, multiplicando el conjunto de numeradores en la parte superior y el de denominadores en la inferior.
definiciones_clave: |
  - **Multiplicación directa de fracciones**: Operación horizontal que calcula el producto de los numeradores y de los denominadores.
  - **Numerador resultante**: Producto $P_1(x) \cdot P_2(x)$ obtenido al multiplicar las expresiones superiores.
  - **Denominador resultante**: Producto $Q_1(x) \cdot Q_2(x)$ obtenido al multiplicar las expresiones inferiores.
propiedades_relaciones: |
  - **Conmutatividad y asociatividad del producto**: La multiplicación de fracciones algebraicas cumple la propiedad conmutativa ($\frac{A}{B} \cdot \frac{C}{D} = \frac{C}{D} \cdot \frac{A}{B}$) y asociativa.
ejemplo_guiado:
  enunciado: 'Calcula el producto directo entre las fracciones algebraicas $\frac{2x}{3y^2}$ y $\frac{9y}{4x^3}$.'
  pasos:
    - 'Paso 1: Planteamos la multiplicación horizontal de numeradores y denominadores:
       $\frac{2x \cdot 9y}{3y^2 \cdot 4x^3}$.'
    - 'Paso 2: Multiplicamos los coeficientes y variables en el numerador:
       $2x \cdot 9y = \mathbf{18xy}$.'
    - 'Paso 3: Multiplicamos los coeficientes y variables en el denominador:
       $3y^2 \cdot 4x^3 = \mathbf{12x^3y^2}$.'
    - 'Paso 4: Formamos la fracción compuesta antes de simplificar:
       $\frac{18xy}{12x^3y^2}$.'
    - 'Conclusión: El producto directo es **$\frac{18xy}{12x^3y^2}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al efectuar el producto directo entre $\frac{a}{b}$ y $\frac{c}{d}$, ¿cuál es la fórmula resultante?'
    choices:
      - {text: 'La fórmula es $\frac{ac}{bd}$, multiplicando los numeradores entre sí y los denominadores entre sí', is_correct: true}
      - {text: 'La fórmula es $\frac{ad}{bc}$', is_correct: false}
      - {text: 'La fórmula es $\frac{a+c}{b+d}$', is_correct: false}
      - {text: 'La fórmula es $\frac{ac}{b+d}$', is_correct: false}
    explanation: 'La alternativa correcta es ''La fórmula es $\frac{ac}{bd}$, multiplicando los numeradores entre sí y los denominadores entre sí''. Operación horizontal $\frac{A}{B} \cdot \frac{C}{D} = \frac{AC}{BD}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo debe realizarse la multiplicación de los denominadores en el producto de fracciones algebraicas?'
    choices:
      - {text: 'Multiplicando de forma horizontal el polinomio del primer denominador por el polinomio del segundo denominador', is_correct: true}
      - {text: 'Sumando los denominadores', is_correct: false}
      - {text: 'Multiplicando en cruz', is_correct: false}
      - {text: 'Manteniendo un solo denominador sin cambiar', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicando de forma horizontal el polinomio del primer denominador por el polinomio del segundo denominador''. Regla de multiplicación fraccionaria.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Multiplicar la expresión del primer numerador por el segundo numerador para formar el nuevo numerador.'
  - 'Paso 2: Multiplicar la expresión del primer denominador por el segundo denominador para formar el nuevo denominador.'
  - 'Paso 3: Expresar el resultado como la fracción unificada $\frac{P_1 \cdot P_2}{Q_1 \cdot Q_2}$.'
  - 'Paso 4: Declarar las restricciones de dominio acumuladas ($Q_1 \neq 0 \land Q_2 \neq 0$).'
errores_correccion: |
  - **Error 1:** Multiplicar en cruz los términos al realizar un producto de fracciones algebraicas (escribir $\frac{a}{b} \cdot \frac{c}{d} = \frac{ad}{bc}$). **Cómo corregirlo:** La multiplicación de fracciones **SE REALIZA SIEMPRE DE FORMA HORIZONTAL (numerador por numerador y denominador por denominador)**.
  - **Error 2:** Sumar los denominadores en lugar de multiplicarlos. **Cómo corregirlo:** El denominador del producto **ES EL PRODUCTO DE LOS DENOMINADORES, NO SU SUMA ($b \cdot d$)**.
ejemplos:
  - titulo: 'Monomios simples'
    enunciado: 'Para $\frac{x}{2} \cdot \frac{y}{3}$, ¿es el producto $\frac{xy}{6}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $x \cdot y = xy$ y $2 \cdot 3 = 6$.'
  - titulo: 'Polinomio por entero'
    enunciado: 'Para $\frac{x+1}{4} \cdot 2$, ¿es equivalente a $\frac{2(x+1)}{4}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2 = 2/1$.'
  - titulo: 'Multiplicación en cruz no válida'
    enunciado: 'Al multiplicar $\frac{1}{x} \cdot \frac{1}{y}$, ¿daría $\frac{y}{x}$ si se hace en cruz?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el resultado correcto es $\frac{1}{xy}$.'
  - titulo: 'Tres fracciones'
    enunciado: 'Para $\frac{a}{b} \cdot \frac{c}{d} \cdot \frac{e}{f}$, ¿es el resultado $\frac{ace}{bdf}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se multiplican todas horizontalmente.'
errores_frecuentes:
  - 'Multiplicar en cruz los términos de las fracciones en lugar de multiplicar de forma horizontal.'
  - 'Sumar los denominadores entre sí al efectuar el producto de fracciones algebraicas.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Los paréntesis al multiplicar polinomios compuestos no son conservados.'
  - 'Intercambiar la multiplicación directa de fracciones con el procedimiento de la división.'
afirmaciones_verdaderas:
  - 'La multiplicación de fracciones algebraicas se realiza multiplicando numeradores entre sí y denominadores entre sí.'
  - 'El dominio del producto excluye los valores que anulan a cualquiera de los denominadores originales.'
al_terminar_debes_ponder: 'Multiplicar fracciones algebraicas de forma directa operando numeradores y denominadores horizontalmente.'
