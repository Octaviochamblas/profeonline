- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
  - 'En la recta numérica de los números reales $\mathbb{R}$, el número $-5$ se ubica a la derecha de $-2$ concluyendo que $-5 > -2$.'
  - 'La condición algebraica $a < b$ equivale a que la sustracción de sus elementos sea negativa $b - a < 0$.'
  - 'Entre dos números negativos en $\mathbb{R}$, aquel que posee mayor valor absoluto representa el número de mayor valor real.'
  - 'La relación de orden total en $\mathbb{R}$ permite la existencia de dos números reales distintos que no se pueden comparar.'
  - 'Si la diferencia entre dos números reales cumple $b - a = 3 > 0$, la relación de orden correcta es $a > b$.'
afirmaciones_verdaderas:
  - 'El conjunto de los números reales $\mathbb{R}$ es un conjunto totalmente ordenado donde $a < b \iff b - a > 0$.'
  - 'En la recta numérica real, todo número ubicado a la izquierda de otro es estrictamente menor que él.'
al_terminar_debes_poder: |
  QUÉ: Reconocer la estructura de orden total del conjunto de los números reales $\mathbb{R}$.
  CÓMO: Comparar números reales mediante la resta $b - a > 0$, interpretar sus posiciones relativas en la recta numérica y establecer la relación de orden.
