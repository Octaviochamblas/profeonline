semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.REALES_ORDENADOS
resumen_inicial: 'Reconocimiento del conjunto de los números reales como conjunto
  ordenado: relaciones de orden, intervalos y resolución en Relación de orden y símbolos
  de desigualdad.'
explicacion_simple: Los números reales poseen una estructura que permite compararlos
  y ordenarlos en una recta unidimensional.
explicacion_formal: '### Definición formal

  Para todo $a, b \\in \\mathbb{R}$, se define el orden a partir de los axiomas de
  cuerpo ordenado, garantizando que el conjunto $\\mathbb{R}$ está totalmente ordenado.


  ### Desarrollo didáctico

  Al ubicar los números en la recta real, un número a la derecha es estrictamente
  mayor que cualquier número a su izquierda.'
definiciones_clave: '- **Reconocimiento del conjunto de los números reales como conjunto
  ordenado**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a reconocimiento del conjunto de los números
  reales como conjunto ordenado.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de reconocimiento
    del conjunto de los números reales como conjunto ordenado.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de reconocimiento del conjunto de los números
    reales como conjunto ordenado, invirtiendo el sentido si se multiplica por un
    negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en reconocimiento del conjunto de los números reales como conjunto
    ordenado?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en relación de orden y símbolos de desigualdad
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en relación de orden y símbolos
    de desigualdad. Es la propiedad fundamental de orden en reconocimiento del conjunto
    de los números reales como conjunto ordenado.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en reconocimiento
    del conjunto de los números reales como conjunto ordenado, ¿cómo se debe expresar
    el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Trazar una recta numérica horizontal.
- Ubicar el origen cero.
- Posicionar los números reales según su valor relativo y signo.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en reconocimiento del conjunto
  de los números reales como conjunto ordenado.
