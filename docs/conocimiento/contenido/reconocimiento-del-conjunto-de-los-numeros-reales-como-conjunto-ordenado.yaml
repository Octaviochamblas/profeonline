semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.REALES_ORDENADOS
resumen_inicial: El conjunto de los números reales $\mathbb{R}$ es un conjunto totalmente
  ordenado que permite comparar y ubicar cualquier par de números en la recta numérica.
explicacion_simple: 'Los números reales se organizan en la recta numérica de izquierda
  a derecha.

  Decimos que un número $a$ es menor que $b$ ($a < b$) si $a$ se encuentra situado
  a la izquierda de $b$ en la recta numérica.

  Gracias a este orden continuo, siempre podemos comparar dos números reales cualesquiera
  y determinar cuál es mayor, menor o si son iguales.'
explicacion_formal: 'El conjunto $\mathbb{R}$ posee una **relación de orden total
  estricta** ($<$) y amplia ($\le$) que satisface las propiedades de la recta real:


  $$a < b \iff b - a > 0 \quad \text{para } a, b \in \mathbb{R}$$


  **Propiedades fundamentales de orden:**

  - **Reflexiva:** $a \le a \quad \forall a \in \mathbb{R}$

  - **Antisimétrica:** Si $a \le b \quad \land \quad b \le a \implies a = b$

  - **Transitiva:** Si $a < b \quad \land \quad b < c \implies a < c$'
definiciones_clave: '- **Relación de orden total**: Estructura matemática que permite
  comparar cualquier par de elementos del conjunto sin excepción.

  - **Diferencia positiva**: Criterio por el cual $a < b$ si y solo si la sustracción
  $b - a$ es un número real estrictamente positivo.'
propiedades_relaciones: '- **Disposición en la recta numérica**: Si $a < b$, entonces
  $a$ se ubica a la izquierda de $b$ y la distancia entre ambos es $b - a > 0$.'
ejemplo_guiado:
  enunciado: Compara los números reales $a = -5$ y $b = -2$ calculando su diferencia
    $b - a$ y determina su posición relativa en la recta numérica.
  pasos:
  - 'Paso 1: Ubicar los números en la recta numérica: $-5$ se sitúa a la izquierda
    de $-2$.Paso 2: Calcular la diferencia $b - a = -2 - (-5) = -2 + 5 = 3$.Paso 3:
    Notar que la diferencia $3 > 0$ es estrictamente positiva.Paso 4: Concluir que
    $-5 < -2$ ($-5$ es menor que $-2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición algebraica equivalente para afirmar que $a < b$
    en los números reales?
  choices:
  - text: La diferencia $b - a > 0$ es estrictamente positiva.
    is_correct: true
  - text: El producto $a \cdot b > 0$ es positivo.
    is_correct: false
  - text: La suma $a + b = 0$.
    is_correct: false
  - text: La diferencia $a - b > 0$ es mayor que cero.
    is_correct: false
  explanation: La alternativa correcta es 'La diferencia $b - a > 0$ es estrictamente
    positiva.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comparar $-5$ y $-2$, ¿cuál es la relación de orden verdadera entre
    ambos números?
  choices:
  - text: $-5 < -2$
    is_correct: true
  - text: $-5 > -2$
    is_correct: false
  - text: $-5 = -2$
    is_correct: false
  - text: $-5 \ge -2$
    is_correct: false
  explanation: La alternativa correcta es '$-5 < -2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos números reales $a$ y $b$ que se desean comparar.'
- 'Paso 2: Calcular la resta $b - a$.'
- 'Paso 3: Si $b - a > 0$, escribir $a < b$. Si $b - a < 0$, escribir $a > b$. Si
  $b - a = 0$, escribir $a = b$.'
errores_correccion: '- **Error común:** Creer que el número con mayor valor absoluto
  negativo es mayor (pensar que $-5 > -2$).

  - **Cómo corregirlo:** En la recta numérica, el número que está más a la izquierda
  SIEMPRE es menor. Como $-5$ está a la izquierda de $-2$, resulta $-5 < -2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
