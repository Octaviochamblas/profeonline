semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DOMINIO
resumen_inicial: 'Determinación del dominio real de la función exponencial: conceptos,
  asíntotas, propiedades e inversidad en Conceptos de la función exponencial.'
explicacion_simple: Gracias a que la base es siempre positiva, una potencia con esa
  base está definida sin excepción para cualquier exponente real, por extraño que
  parezca ese exponente.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot b^x$ con $b>0$, la potencia $b^x$ está definida y produce un resultado
  real positivo para cualquier valor de $x \in \mathbb{R}$, incluidos exponentes negativos
  y fraccionarios. Por tanto, $\text{Dom}(f)=\mathbb{R}$.


  ### Desarrollo didáctico


  A diferencia de una potencia con base negativa (que puede no estar definida para
  exponentes fraccionarios), la positividad de la base garantiza que no exista ninguna
  restricción sobre el dominio.


  Para $f(x)=2\cdot5^x$, la potencia $5^x$ está definida para cualquier $x$, incluyendo
  $x=-3$ ($5^{-3}=1/125$) o $x=0{,}5$ ($5^{0{,}5}=\sqrt{5}$).'
definiciones_clave: '- **Determinación del dominio real de la función exponencial**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a determinación del dominio real de la función exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de determinación
    del dominio real de la función exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de determinación del dominio
    real de la función exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
