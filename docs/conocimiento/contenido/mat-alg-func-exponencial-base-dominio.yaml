semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DOMINIO
resumen_inicial: 'El dominio real de una función exponencial básica es el conjunto de todos los números reales $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
explicacion_simple: |
  El dominio de una función representa todos los números que podemos poner en el lugar de la variable $x$ sin que la calculadora arroje un error. En la función exponencial $f(x) = a \cdot b^x$, la variable $x$ se encuentra en el exponente. Como una potencia de base positiva se puede elevar a cualquier número (positivo, negativo, cero, entero o decimal), podemos usar cualquier número real. Por lo tanto, su dominio es $\mathbb{R}$.
explicacion_formal: |
  ### Definición formal
  Para toda función exponencial $f: D \to \mathbb{R}$ definida por $f(x) = a \cdot b^x$, con $a \neq 0$ y $b > 0, b \neq 1$, el **dominio máximo de definición real** es ilimitado y equivale a:
  $$\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$$

  ### Desglose simbólico
  - Evaluación en exponentes positivos ($x > 0$): $b^x = \underbrace{b \cdot b \cdots b}_{x \text{ veces}}$ (potencia continua).
  - Evaluación en cero ($x = 0$): $b^0 = 1 \implies f(0) = a$.
  - Evaluación en exponentes negativos ($x < 0$): $b^{-k} = \frac{1}{b^k} \in \mathbb{R}^+$ (perfectamente definido porque $b^k \neq 0$).
  - Evaluación en exponentes fraccionarios ($x = \frac{p}{q}$): $b^{p/q} = \sqrt[q]{b^p} \in \mathbb{R}^+$ (definido unívocamente porque la base $b > 0$).

  ### Síntesis didáctica
  Reconocer la ausencia de restricciones en el exponente: A diferencia de las funciones racionales (que no permiten denominador cero) o las funciones raíz par (que no permiten radicando negativo), la función exponencial de base positiva no posee ninguna restricción algebraica en su exponente $x$.
definiciones_clave: |
  - **Dominio máximo real**: Conjunto de todos los números $x \in \mathbb{R}$ para los cuales la función está definida.
  - **Exponente real universal**: Propiedad que permite evaluar potencias de base positiva para cualquier número real $x$.
  - **Ausencia de asíntota vertical**: Característica que garantiza que la gráfica se extiende horizontalmente de $-\infty$ a $+\infty$.
propiedades_relaciones: |
  - **Continuidad en $\mathbb{R}$**: La función exponencial es continua y diferenciable en todo su dominio $\mathbb{R}$.
  - **Dominio de composiciones**: Si el exponente es una función $g(x)$ (ej: $f(x) = b^{g(x)}$), el dominio de $f$ equivale al dominio de la función interna $g(x)$.
ejemplo_guiado:
  enunciado: 'Determina el dominio real de las funciones $f(x) = 5 \cdot 2^x$, $g(x) = -3 \cdot (0.4)^{-x}$ y $h(x) = 7^{x^2 - 4}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 5 \cdot 2^x$, es una función exponencial básica con base $b = 2 > 0$. Su dominio es $\operatorname{Dom}(f) = \mathbb{R}$.'
    - 'Paso 2: Para $g(x) = -3 \cdot (0.4)^{-x}$, reescribimos como $-3 \cdot \left(\frac{1}{0.4}\right)^x = -3 \cdot (2.5)^x$. Su dominio es $\operatorname{Dom}(g) = \mathbb{R}$.'
    - 'Paso 3: Para $h(x) = 7^{x^2 - 4}$, el exponente es el polinomio $g(x) = x^2 - 4$, el cual está definido para todo $x \in \mathbb{R}$. Su dominio es $\operatorname{Dom}(h) = \mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio real de la función exponencial $f(x) = 9 \cdot (0.8)^x$?'
    choices:
      - {text: 'El conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R}$', is_correct: true}
      - {text: 'Únicamente los números reales positivos $]0, +\infty[$', is_correct: false}
      - {text: 'El intervalo acotado $[0, 9]$', is_correct: false}
      - {text: 'Los números reales excluyendo el cero $\mathbb{R} \setminus \{0\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R}$''. Las funciones exponenciales de base positiva están definidas para todo $x \in \mathbb{R}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Existe algún número real $x$ para el cual la potencia $3^x$ no se pueda calcular en el conjunto de los números reales?'
    choices:
      - {text: 'No, la potencia $3^x$ se puede calcular para todo $x \in \mathbb{R}$ sin excepción alguna', is_correct: true}
      - {text: 'Sí, para los números enteros negativos', is_correct: false}
      - {text: 'Sí, para el número cero $x = 0$', is_correct: false}
      - {text: 'Sí, para las fracciones irracionales', is_correct: false}
    explanation: 'La alternativa correcta es ''No, la potencia $3^x$ se puede calcular para todo $x \in \mathbb{R}$ sin excepción alguna''. Al ser la base $3 > 0$, la potencia está definida para todo exponente real.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la expresión que actúa como exponente en la función exponencial.'
  - 'Paso 2: Verificar si el exponente presenta alguna restricción algebraica propia (como denominadores o raíces de índice par).'
  - 'Paso 3: Si el exponente es la variable $x$ libre o una expresión polinomial sin restricciones, declarar $\operatorname{Dom}(f) = \mathbb{R}$.'
errores_correccion: |
  - **Error 1:** Confundir el dominio de la función exponencial con su recorrido, afirmando que el dominio son los reales positivos $]0, +\infty[$. **Cómo corregirlo:** Las salidas $y$ de la función exponencial básica son positivas (recorrido), pero las entradas $x$ aceptan cualquier número real (dominio $\mathbb{R}$).
  - **Error 2:** Creer que los exponentes negativos como en $2^{-5}$ no pertenecen al dominio. **Cómo corregirlo:** Un exponente negativo invierte la base: $2^{-5} = \frac{1}{2^5} = \frac{1}{32} \in \mathbb{R}$. Por lo tanto, los números negativos pertenecen al dominio.
ejemplos:
  - titulo: 'Dominio de exponencial mónica'
    enunciado: '¿Cuál es el dominio de $f(x) = e^x$?'
    alternativas:
      - '$\mathbb{R}$'
      - '$]0, +\infty[$'
      - '$[0, +\infty[$'
    respuesta: '$\mathbb{R}$'
    solucion_pasos:
      - '1. La función exponencial natural está definida para todo $x \in \mathbb{R}$.'
      - '2. El dominio es $\operatorname{Dom}(f) = \mathbb{R}$.'
  - titulo: 'Evaluación en exponente cero'
    enunciado: '¿El valor $x = 0$ pertenece al dominio de la función $f(x) = 4^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(0) = 4^0 = 1$, por lo que $x = 0$ pertenece al dominio.'
  - titulo: 'Evaluación en exponente negativo'
    enunciado: '¿El número $x = -10$ forma parte del dominio de $g(x) = 2 \cdot 5^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(-10) = 2 \cdot 5^{-10} = \frac{2}{5^{10}} \in \mathbb{R}$.'
  - titulo: 'Dominio de exponente lineal'
    enunciado: '¿La función $h(x) = 3^{2x - 1}$ tiene como dominio a todos los números reales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La expresión lineal $2x - 1$ está definida para todo $x \in \mathbb{R}$, por lo que $\operatorname{Dom}(h) = \mathbb{R}$.'
errores_frecuentes:
  - 'El dominio de la función exponencial $f(x) = 2^x$ está formado exclusivamente por los números reales positivos $]0, +\infty[$.'
  - 'Los números reales negativos no pertenecen al dominio de una función exponencial porque las potencias con exponente negativo se indefinen.'
  - 'El dominio de la función $f(x) = 5 \cdot 3^x$ excluye al número cero $x = 0$.'
  - 'Una función exponencial con base decimal $b = 0.5$ tiene un dominio restringido a los números enteros.'
  - 'El dominio de $f(x) = b^x$ depende del valor del coeficiente multiplicativo $a$.'
afirmaciones_verdaderas:
  - 'El dominio de definición real de una función exponencial básica $f(x) = a \cdot b^x$ es el conjunto completo de los números reales $\mathbb{R}$.'
  - 'La función exponencial $f(x) = a \cdot b^x$ no posee asíntotas verticales ni puntos de indefinición en $\mathbb{R}$.'
al_terminar_debes_poder: 'Determinar y argumentar que el dominio real de una función exponencial básica es $\operatorname{Dom}(f) = \mathbb{R}$.'
