procedimiento:
- 'Paso 1: Verifica que la base $b$ de la función exponencial sea positiva.'
- 'Paso 2: Concluye que el dominio es $\mathbb{R}$, sin necesidad de excluir ningún
  valor.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en determinación
  del dominio real de la función exponencial.
ejemplos:
- titulo: Determinación del dominio de una función exponencial simple
  enunciado: Determina el dominio de $f(x)=3\cdot2^x$.
  solucion_pasos:
  - La base $2$ es positiva.
  - $\text{Dom}(f)=\mathbb{R}$.
- titulo: Determinación del dominio con base fraccionaria
  enunciado: Determina el dominio de $f(x)=7\cdot(1/3)^x$.
  solucion_pasos:
  - La base $1/3$ es positiva.
  - $\text{Dom}(f)=\mathbb{R}$.
- titulo: ¿Existe algún valor de $x$ excluido del dominio de una función exponencial?
  enunciado: ¿Existe algún valor de $x$ excluido del dominio de una función exponencial?
  respuesta: 'No'
  solucion_pasos:
  - Gracias a que la base es siempre positiva, la potencia está definida para cualquier
    valor real de $x$.
- titulo: ¿El dominio de una función exponencial depende del valor del coeficiente
    $a$?
  enunciado: ¿El dominio de una función exponencial depende del valor del coeficiente
    $a$?
  respuesta: 'No'
  solucion_pasos:
  - El dominio depende únicamente de que la base sea positiva; el coeficiente $a$
    no introduce restricciones.
errores_frecuentes:
- Declarar el dominio (siempre $\mathbb{R}$) con el recorrido, que sí depende de los
  parámetros de la función.
- Buscar restricciones de dominio como si la base pudiera ser negativa.
- Excluir por error el cero u otros valores particulares sin ninguna justificación
  matemática.
- Declarar el dominio matemático con el dominio restringido de un problema aplicado
  (contexto).
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando determinación del dominio real de la función exponencial.
