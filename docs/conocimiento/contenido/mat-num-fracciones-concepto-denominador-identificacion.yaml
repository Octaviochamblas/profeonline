semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.DENOMINADOR_IDENTIFICACION
resumen_inicial: El denominador es el término inferior de la fracción $\frac{a}{b}$
  que indica en cuántas partes iguales se divide la unidad.
explicacion_simple: El denominador es el número escrito debajo de la barra de fracción.
  Su función es denominar o dar nombre al tipo de fracción (como tercios, cuartos
  o quintos), indicando la cantidad total de partes iguales en que se corta la unidad
  entera.
explicacion_formal: 'En la fracción $\frac{a}{b}$, el **Denominador** $b \in \mathbb{Z}
  \setminus \{0\}$ define la escala de subdivisión de la unidad entera $U$:


  $$b = \operatorname{den}\left(\frac{a}{b}\right) \quad \text{tal que } U = \bigcup_{i=1}^b
  u_i$$


  **Desglose de la fórmula:**

  - $\operatorname{den}\left(\frac{a}{b}\right) = b$: Operador de extracción del valor
  inferior de la fracción.

  - $b \neq 0$: Cantidad no nula de particiones en las que se divide la unidad.


  > **Complemento didáctico:** Etimológicamente ''denominador'' proviene del latín
  *nomen*, que significa ''el que da nombre'' o nombra la especie de la fracción.'
definiciones_clave: '- **Denominador**: Término inferior $b \neq 0$ que especifica
  el número total de particiones de la unidad.'
propiedades_relaciones: '- **Restricción de no nulidad**: Debe ser un entero strictly
  distinto de cero ($b \neq 0$).'
ejemplo_guiado:
  enunciado: Identifique el denominador en la fracción $\frac{5}{9}$ y explique su
    función.
  pasos:
  - 'Paso 1: Localizar la línea de fracción y mirar el número situado abajo.'
  - 'Paso 2: El número ubicado abajo es el $9$, por lo tanto el denominador es $9$.'
  - 'Paso 3: Interpretar: el $9$ indica que la unidad fue dividida en $9$ partes exactamente
    iguales.'
  - 'Conclusión: El denominador es $9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué posición de la fracción a/b se ubica el denominador y qué condición
    cumple?
  choices:
  - text: En la parte inferior y debe ser distinto de cero (b ≠ 0)
    is_correct: true
  - text: En la parte superior y puede ser cero
    is_correct: false
  - text: A la izquierda de la fracción
    is_correct: false
  - text: En la parte inferior y debe ser igual a cero
    is_correct: false
  explanation: La alternativa correcta es 'En la parte inferior y debe ser distinto
    de cero (b ≠ 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5/9, ¿cuál es el denominador?
  choices:
  - text: '9'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '14'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la raya o barra de la fracción.'
- 'Paso 2: Identificar el número escrito por debajo de dicha línea.'
- 'Paso 3: Verificar que el valor sea distinto de cero y declararlo como el denominador.'
errores_correccion: '- **Error 1: Ubicar el denominador arriba de la línea de fracción.**
  **Cómo corregirlo:** El DENOMINADOR se encuentra siempre en la parte INFERIOR.


  - **Error 2: Aceptar el número cero como un denominador válido.** **Cómo corregirlo:**
  El denominador JAMÁS puede ser cero ($b \neq 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el denominador en la fracción 11/15?
  alternativas:
  - '15'
  - '11'
  - '26'
  respuesta: '15'
  solucion_pasos:
  - El valor inferior de la fracción es 15.
- titulo: Ejemplo 2
  enunciado: Si en una fracción el numerador es 4 y el denominador es 7, ¿cuál es
    la fracción?
  alternativas:
  - 4/7
  - 7/4
  - 11/7
  respuesta: 4/7
  solucion_pasos:
  - 'El denominador 7 se ubica abajo: 4/7.'
- titulo: ¿Es el denominador el número que le da nombre a la especie de la fracción?
  respuesta: Sí
  solucion_pasos:
  - Sí, indica si la especie es medios, tercios, cuartos, etc.
- titulo: ¿Puede el número 0 ser el denominador de una fracción racional?
  respuesta: 'No'
  solucion_pasos:
  - No, la división por cero no existe en los racionales.
errores_frecuentes:
- El denominador es el término que se coloca arriba de la barra de la fracción.
- El número cero puede funcionar como denominador en números racionales positivos.
- En la fracción $a/b$, el denominador $b$ señala las partes que han sido pintadas.
- El denominador de una fracción debe ser siempre mayor que su numerador.
- El denominador se obtiene multiplicando la fracción por el número 2.
afirmaciones_verdaderas:
- El denominador es el término inferior de la fracción que indica en cuántas partes
  iguales se divide la unidad.
- El denominador de cualquier fracción racional debe ser estrictamente distinto de
  cero ($b \neq 0$).
al_terminar_debes_poder: Al terminar serás capaz de identificar el denominador en
  cualquier fracción, reconociendo su posición inferior y su función de definir las
  partes iguales de la unidad.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
