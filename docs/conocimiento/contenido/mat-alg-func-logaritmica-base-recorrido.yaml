semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.RECORRIDO
resumen_inicial: 'El conjunto recorrido de la función logarítmica es la totalidad de los números reales $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
explicacion_simple: |
  Mientras que el dominio de la función logarítmica acepta solo números positivos a la entrada, sus resultados de salida (el recorrido) pueden ser cualquier número real posible: enteros, fraccionarios, positivos, cero o negativos gigantescos. Esto sucede porque el logaritmo calcula el exponente, y como una potencia puede elevarse a cualquier número real de $-\infty$ a $+\infty$, las respuestas de la función cubren todo el eje vertical $y$.
explicacion_formal: |
  ### Definición formal
  Para toda función logarítmica $f: D \to \mathbb{R}$ definida por $f(x) = a \cdot \log_b(cx + d) + k$ con $a \neq 0, b > 0, b \neq 1, c \neq 0$, el **conjunto recorrido o conjunto imagen** es ilimitado en ambas direcciones y equivale a:
  $$\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$$

  ### Desglose simbólico
  - Demostración por existencia de preimagen: Para cualquier valor de salida deseado $y_0 \in \mathbb{R}$, existe siempre una preimagen $x_0 \in \operatorname{Dom}(f)$ tal que $f(x_0) = y_0$.
  - Despeje explícito de la preimagen:
    $$y_0 = a \cdot \log_b(cx_0 + d) + k \implies \frac{y_0 - k}{a} = \log_b(cx_0 + d) \implies b^{\frac{y_0 - k}{a}} = cx_0 + d$$
    $$x_0 = \frac{b^{\frac{y_0 - k}{a}} - d}{c}$$
    Puesto que la potencia $b^{\frac{y_0 - k}{a}} > 0$ está bien definida para todo $y_0 \in \mathbb{R}$, se confirma que todo $y_0$ posee preimagen en el dominio.

  ### Síntesis didáctica
  Diferenciar recorrido exponencial de recorrido logarítmico: La función exponencial no trasladada tiene un recorrido acotado $]0, +\infty[$ (solo positivos). Su función inversa logarítmica intercambia dominio y recorrido, teniendo un recorrido universal e ilimitado $\mathbb{R}$.
definiciones_clave: |
  - **Conjunto recorrido $\operatorname{Rec}(f) = \mathbb{R}$**: Totalidad de números reales que adopta la variable dependiente $y$.
  - **Ausencia de asíntotas horizontales**: Propiedad por la cual la gráfica logarítmica no tiene topes o techos horizontales.
  - **Superficie infinita del eje $y$**: Extensión ilimitada de la curva desde el extremo inferior $-\infty$ hasta el extremo superior $+\infty$.
propiedades_relaciones: |
  - **Sobreyectividad**: Al considerar el codominio como $\mathbb{R}$, la función logarítmica es una función sobreyectiva (y por tanto biyectiva).
  - **Invariancia del recorrido por traslaciones**: Trasladar la función logarítmica en vertical ($+k$) o en horizontal ($+d$) conserva el recorrido completo en $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de las siguientes funciones logarítmicas e identifica la preimagen $x$ que produce la salida $y = 3$ en cada caso: A) $f(x) = \log_2(x)$, B) $g(x) = 5 \cdot \ln(x - 1) + 3$.'
  pasos:
    - 'Paso 1: Para $f(x) = \log_2(x)$, es una función logarítmica mónica. Su conjunto recorrido es $\operatorname{Rec}(f) = \mathbb{R}$.'
    - 'Paso 2: Buscamos la preimagen para $y = 3$: $\log_2(x) = 3 \implies x = 2^3 = 8$.'
    - 'Paso 3: Para $g(x) = 5 \cdot \ln(x - 1) + 3$, su conjunto recorrido es $\operatorname{Rec}(g) = \mathbb{R}$.'
    - 'Paso 4: Buscamos la preimagen para $y = 3$: $5 \cdot \ln(x - 1) + 3 = 3 \implies 5 \cdot \ln(x - 1) = 0 \implies \ln(x - 1) = 0 \implies x - 1 = e^0 = 1 \implies x = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función logarítmica $f(x) = -4 \cdot \log_3(2x + 1) + 8$?'
    choices:
      - {text: 'El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$', is_correct: true}
      - {text: 'El conjunto de los números reales positivos $]0, +\infty[$', is_correct: false}
      - {text: 'El intervalo acotado $]8, +\infty[$', is_correct: false}
      - {text: 'El intervalo acotado $]-\infty, 8[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$''. Todas las funciones logarítmicas reales tienen como recorrido el conjunto de todos los números reales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Existe algún valor de altura $y \in \mathbb{R}$ que la función logarítmica $f(x) = \ln(x)$ no pueda alcanzar en su gráfica?'
    choices:
      - {text: 'No, la función logarítmica alcanza todos los valores reales de altura $y$ en su gráfico', is_correct: true}
      - {text: 'Sí, los números enteros negativos', is_correct: false}
      - {text: 'Sí, el valor cero $y = 0$', is_correct: false}
      - {text: 'Sí, los números decimales mayores que 100', is_correct: false}
    explanation: 'La alternativa correcta es ''No, la función logarítmica alcanza todos los valores reales de altura $y$ en su gráfico''. Al ser el recorrido $\mathbb{R}$, no existe ninguna cota vertical que la limite.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que la función presentada es una función logarítmica de la forma $f(x) = a \cdot \log_b(g(x)) + k$.'
  - 'Paso 2: Recordar que la función inversa exponencial acepta cualquier exponente real.'
  - 'Paso 3: Declarar directamente que el conjunto recorrido es el conjunto entero de los números reales $\operatorname{Rec}(f) = \mathbb{R}$.'
errores_correccion: |
  - **Error 1:** Confundir el recorrido de la función logarítmica con su dominio, afirmando que el recorrido son los reales positivos $]0, +\infty[$. **Cómo corregirlo:** El dominio (las entradas $x$) son los reales positivos $]0, +\infty[$, pero las salidas $y$ cubren todo $\mathbb{R}$ (el recorrido son todos los reales).
  - **Error 2:** Creer que traslaciones verticales como $+k$ acotan el recorrido de la función logarítmica. **Cómo corregirlo:** A diferencia de las funciones cuadráticas o exponenciales, la función logarítmica no tiene máximos ni mínimos ni asíntotas horizontales. Sumar $k$ desplaza la gráfica pero su recorrido sigue siendo todo $\mathbb{R}$.
ejemplos:
  - titulo: 'Recorrido de logaritmo básico'
    enunciado: '¿Cuál es el recorrido de $f(x) = \log(x)$?'
    alternativas:
      - '$\mathbb{R}$'
      - '$]0, +\infty[$'
      - '$[0, +\infty[$'
    respuesta: '$\mathbb{R}$'
    solucion_pasos:
      - '1. La función logarítmica abarca todas las alturas reales.'
      - '2. El recorrido es $\operatorname{Rec}(f) = \mathbb{R}$.'
  - titulo: 'Salida negativa en logaritmos'
    enunciado: '¿Puede la función $f(x) = \log_2(x)$ dar como resultado un número negativo como $y = -100$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para $x = 2^{-100} > 0$, la función entrega la salida $f(2^{-100}) = -100$.'
  - titulo: 'Recorrido con escala negativa'
    enunciado: '¿El recorrido de $g(x) = -5 \cdot \ln(x) + 2$ es el conjunto $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Los parámetros $-5$ y $+2$ modifican la escala y posición, pero el recorrido permanece como $\mathbb{R}$.'
  - titulo: 'Salida nula en logaritmos'
    enunciado: '¿El valor $y = 0$ pertenece al recorrido de cualquier función logarítmica básica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $x = 1$, $f(1) = \log_b(1) = 0$, por lo que $0 \in \operatorname{Rec}(f)$.'
errores_frecuentes:
  - 'El conjunto recorrido de la función logarítmica $f(x) = \log_2(x)$ consiste en los números reales positivos $]0, +\infty[$.'
  - 'Una función logarítmica no puede producir valores de salida negativos.'
  - 'El recorrido de la función logarítmica $f(x) = \ln(x) + 4$ cambia al intervalo $]4, +\infty[$.'
  - 'La gráfica de la función logarítmica posee una asíntota horizontal que limita su recorrido por arriba.'
  - 'El parámetro de escala $a$ en $f(x) = a \cdot \log_b(x)$ restringe el recorrido a un intervalo cerrado.'
afirmaciones_verdaderas:
  - 'El conjunto recorrido de cualquier función logarítmica $f(x) = a \cdot \log_b(cx + d) + k$ es el conjunto completo de los números reales $\mathbb{R}$.'
  - 'Debido a que la función exponencial acepta cualquier exponente real como entrada, la función logarítmica puede entregar cualquier número real como salida.'
