semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.RECORRIDO
resumen_inicial: 'Determinación del recorrido de la función logarítmica: conceptos,
  asíntotas, propiedades e inversidad en Análisis de la función logarítmica.'
explicacion_simple: Así como el dominio de la logarítmica hereda el recorrido de la
  exponencial, el recorrido de la logarítmica hereda el dominio de la exponencial,
  que no tiene restricciones.
explicacion_formal: '### Definición formal


  Como $f(x)=\log_b(x)$ es la inversa de $g(x)=b^x$, el recorrido de $f$ coincide
  con el dominio de $g$, que es $\mathbb{R}$. Por lo tanto, para cualquier número
  real $y$ (positivo, negativo o cero), existe un $x>0$ tal que $\log_b(x)=y$.


  ### Desarrollo didáctico


  A diferencia del dominio (restringido a positivos), el recorrido no tiene ninguna
  limitación: la función logarítmica puede tomar cualquier valor real, tanto para
  argumentos grandes como para argumentos cercanos a cero.


  Para $f(x)=\log_2(x)$: cuando $x\to0^+$, $f(x)\to-\infty$; cuando $x\to+\infty$,
  $f(x)\to+\infty$, cubriendo así todo $\mathbb{R}$.'
definiciones_clave: '- **Determinación del recorrido de la función logarítmica**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a determinación del recorrido de la función logarítmica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de determinación
    del recorrido de la función logarítmica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de determinación del recorrido
    de la función logarítmica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    determinación del recorrido de la función logarítmica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en determinación del recorrido de la función logarítmica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la función sea una función logarítmica básica, sin transformaciones
  adicionales.'
- 'Paso 2: Concluye que el recorrido es $\mathbb{R}$, sin necesidad de excluir ningún
  valor.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en determinación
  del recorrido de la función logarítmica.
ejemplos:
- titulo: Determinación del recorrido de una función logarítmica simple
  enunciado: Determina el recorrido de $f(x)=\log_4(x)$.
  solucion_pasos:
  - Es una función logarítmica básica.
  - $\text{Rec}(f)=\mathbb{R}$.
- titulo: Verificación de un valor en el recorrido
  enunciado: ¿Existe algún $x$ tal que $\log_3(x)=-5$?
  solucion_pasos:
  - Sí, porque el recorrido de la función logarítmica es todo $\mathbb{R}$, incluyendo
    valores negativos.
  - Ese $x$ es $3^{-5}=1/243$.
- titulo: ¿El recorrido de la función logarítmica básica excluye el cero?
  enunciado: ¿El recorrido de la función logarítmica básica excluye el cero?
  respuesta: 'No'
  solucion_pasos:
  - El recorrido incluye todos los reales, incluido el cero (que se obtiene con $x=1$,
    ya que $\log_b(1)=0$).
- titulo: ¿El recorrido de una función logarítmica depende del valor de la base $b$?
  enunciado: ¿El recorrido de una función logarítmica depende del valor de la base
    $b$?
  respuesta: 'No'
  solucion_pasos:
  - Sin importar la base (siempre que sea válida), el recorrido de la función logarítmica
    básica siempre es $\mathbb{R}$.
errores_frecuentes:
- Confundir el recorrido (siempre $\mathbb{R}$) con el dominio (restringido a positivos).
- Asumir que el recorrido está restringido a valores positivos, como el dominio.
- No reconocer que la función logarítmica puede tomar valores negativos.
- Confundir el recorrido de la función logarítmica con el de la función exponencial.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando determinación del recorrido de la función logarítmica.
