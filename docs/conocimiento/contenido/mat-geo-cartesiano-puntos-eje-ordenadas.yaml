semantic_id: MAT.GEO.CARTESIANO_BASE.PUNTOS_EJE_ORDENADAS
resumen_inicial: 'Identificación de puntos situados sobre el eje de las ordenadas:
  conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Cuando un punto 'no se desplaza' del eje vertical (es decir, su
  distancia horizontal es cero), significa que está exactamente sobre el eje de las
  ordenadas.
explicacion_formal: '![Puntos sobre el eje de las ordenadas](/static/img/geometria/cartesiano-vectores/cartesiano-puntos-eje-ordenadas.svg)


  ### Definición formal


  Un punto pertenece al eje de las ordenadas si y solo si su abscisa es cero: todo
  punto de la forma $(0,y)$, para cualquier valor real de $y$, se ubica sobre este
  eje.


  ### Desarrollo didáctico


  En la figura, los puntos $G(0,4)$ y $H(0,-3)$ están sobre el eje de las ordenadas,
  ya que ambos tienen abscisa igual a 0, sin importar que sus ordenadas sean distintas
  (una positiva y otra negativa).'
definiciones_clave: '- **Identificación de puntos situados sobre el eje de las ordenadas**:
  Elemento o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de puntos situados sobre el
  eje de las ordenadas.'
