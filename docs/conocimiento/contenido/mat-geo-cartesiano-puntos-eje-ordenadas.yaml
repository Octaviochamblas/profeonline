- titulo: ¿Se cumple siempre la propiedad principal de identificación de puntos situados
    sobre el eje de las ordenadas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación de puntos situados sobre el eje de las ordenadas asumir
