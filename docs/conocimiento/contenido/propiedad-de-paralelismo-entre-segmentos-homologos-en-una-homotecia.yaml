  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los extremos del segmento original $A(x_1, y_1)$ y $B(x_2, y_2)$ en el plano cartesiano.'
- 'Paso 2: Calcular la pendiente original mediante la fórmula $m = \frac{y_2 - y_1}{x_2 - x_1}$.'
- 'Paso 3: Aplicar el teorema de paralelismo: la recta homóloga tendrá idéntica pendiente $m'' = m$.'
- 'Paso 4: Calcular las coordenadas de la imagen $A''$ o $B''$ mediante la fórmula homotética.'
- 'Paso 5: Escribir la ecuación punto-pendiente de la recta homóloga: $y - y_{A''} = m(x - x_{A''})$.'
errores_correccion: |
  - **Creer que la pendiente cambia al multiplicar por la razón $k$**: En una homotecia, la pendiente se conserva idéntica ($m' = m$) porque tanto la variación vertical $\Delta y$ como la horizontal $\Delta x$ se multiplican por el mismo factor $k$, cancelándose en el cociente.
  - **Pensar que con razón negativa ($k < 0$) se pierde el paralelismo**: Aunque la figura quede invertida $180^\circ$, las rectas que contienen a los lados siguen siendo estrictamente paralelas ($\overline{AB} \parallel \overline{A'B'}$).
  - **Confundir el movimiento de puntos con el cambio de la recta**: Aunque los puntos individuales $P$ se mueven a nuevas posiciones $P'$, las rectas que pasan por el centro $O$ conservan su orientación espacial completa y se transforman en sí mismas ($H(L) = L$).
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Un cuadrilátero tiene un lado sobre la recta $y = 2x - 5$. Si se le aplica una homotecia con razón $k = -3$, ¿cuál es la pendiente de la recta que contiene al lado homólogo?'
  alternativas:
  - '$m^\prime = 2$'
  - '$m^\prime = -6$'
  - '$m^\prime = -\frac{1}{2}$'
  - '$m^\prime = -3$'
  respuesta: '$m^\prime = 2$'
  solucion_pasos:
  - 'La recta original $y = 2x - 5$ tiene pendiente $m = 2$.'
  - 'Por la propiedad de paralelismo de las homotecias, la recta que contiene al lado homólogo es paralela a la original: $\overline{AB} \parallel \overline{A^\prime B^\prime}$.'
  - 'Dos rectas paralelas tienen idéntica pendiente, por lo que $m^\prime = m = 2$.'
- titulo: Ejemplo 2
  enunciado: 'Si una recta pasa exactamente por el centro de homotecia $O$, ¿cuál de las siguientes afirmaciones es correcta sobre su recta imagen?'
  alternativas:
  - 'Es la misma recta soporte que se transforma en sí misma (recta invariante)'
  - 'Es una recta paralela separada a una distancia $k$'
  - 'Es una recta perpendicular que cruza por el origen'
  - 'Es una recta con pendiente invertida $-\frac{1}{m}$'
  respuesta: 'Es la misma recta soporte que se transforma en sí misma (recta invariante)'
  solucion_pasos:
  - 'Cualquier rayo que parte desde $O$ contiene tanto al punto original $P$ como a su imagen $P^\prime = H(P)$.'
  - 'Por lo tanto, la recta completa que contiene a $O$ no cambia de posición en el plano: $H(L) = L$ (recta invariante).'
- titulo: '¿Una homotecia con razón $k = -2$ genera lados homólogos paralelos a los originales?'
  respuesta: 'Sí'
  solucion_pasos:
  - 'Sí, en toda homotecia (directa o inversa, con cualquier $k \neq 0$), los segmentos homólogos son siempre estrictamente paralelos ($\overline{AB} \parallel \overline{A^\prime B^\prime}$).'
- titulo: '¿La pendiente de un segmento se duplica si la razón de homotecia es $k = 2$?'
  respuesta: 'No'
  solucion_pasos:
  - 'No, la pendiente se mantiene exactamente igual ($m^\prime = m$), ya que las rectas son paralelas.'
errores_frecuentes:
- 'En una homotecia con razón negativa ($k < 0$), los segmentos homólogos dejan de ser paralelos y pasan a ser perpendiculares.'
- 'Si un segmento original tiene pendiente $m = 3$ y se aplica una homotecia con razón $k = 2$, la pendiente del segmento homólogo se duplica a $m'' = 6$.'
- 'Las rectas que pasan por el centro de homotecia $O$ cambian de dirección y se trasladan paralelamente.'
- 'El paralelismo entre segmentos homólogos solo se cumple si el centro de homotecia es el origen $(0, 0)$.'
afirmaciones_verdaderas:
- 'En toda homotecia, cualquier segmento es estrictamente paralelo a su segmento homólogo ($\overline{AB} \parallel \overline{A''B''}$), conservando idéntica pendiente ($m'' = m$).'
- 'Toda recta secante que pasa por el centro de homotecia $O$ es una recta invariante que se transforma en sí misma ($H(L) = L$).'
al_terminar_debes_poder: |
  **QUÉ:** Reconocer, justificar y aplicar la propiedad de paralelismo entre segmentos homólogos e identificar rectas invariantes en cualquier transformación homotética.

  **CÓMO:** Verificando la relación vectorial $\vec{A'B'} = k \cdot \vec{AB}$, igualando pendientes $m' = m$ en el plano cartesiano y reconociendo que las rectas por el centro $O$ cumplen $H(L) = L$.

