semantic_id: MAT.GEO.HOMOTECIA.PARALELISMO_SEGMENTOS_HOMOLOGOS
resumen_inicial: 'Homotecia y transformaciones de escala: Propiedad de paralelismo entre segmentos homólogos.'
explicacion_simple: |
  ![Paralelismo entre Segmentos Homólogos](/static/img/nodos/propiedad-de-paralelismo-entre-segmentos-homologos-en-una-homotecia-intro.svg)

  En toda homotecia, cualquier segmento de la figura original es estrictamente paralelo a su segmento homólogo en la figura transformada ($\overline{AB} \parallel \overline{A'B'}$), conservando idéntica pendiente en el plano cartesiano ($m' = m$).
explicacion_formal: |
  ### Teorema del paralelismo homotético
  Sean $A, B \in \mathbb{R}^2$ con $A \neq B$, y sean $A' = H_{(O, k)}(A)$ y $B' = H_{(O, k)}(B)$ sus puntos homólogos bajo una homotecia de centro $O$ y razón $k \neq 0$. Por definición vectorial:

  $$\vec{A'B'} = B' - A' = [O + k(B - O)] - [O + k(A - O)] = k(B - A) = k \cdot \vec{AB}$$

  Dado que $\vec{A'B'} = k \cdot \vec{AB}$, los vectores $\vec{A'B'}$ y $\vec{AB}$ son colineales y linealmente dependientes. En consecuencia, las rectas que los contienen son paralelas:

  $$\vec{A'B'} \parallel \vec{AB} \implies \overleftrightarrow{AB} \parallel \overleftrightarrow{A'B'}$$

  ### Desglose simbólico y geométrico
  - **Igualdad de pendientes:** En el plano cartesiano, $m_{A'B'} = \frac{y_{B'} - y_{A'}}{x_{B'} - x_{A'}} = \frac{k(y_B - y_A)}{k(x_B - x_A)} = m_{AB}$. La pendiente se mantiene invariante.
  - **Rectas invariantes (secantes por $O$):** Si una recta $L$ pasa por el centro de homotecia $O$ ($O \in L$), todo punto $P \in L$ se transforma en $P' \in L$. La recta se transforma globalmente en sí misma: $H(L) = L$.
  - **Segmentos coincidentes:** Si el segmento $\overline{AB}$ pertenece a una recta que pasa por $O$, el segmento homólogo $\overline{A'B'}$ se ubica sobre la misma recta soporte.

  ### Síntesis didáctica
  El paralelismo entre lados homólogos es la propiedad geométrica distintiva de toda homotecia, garantizando que la figura no rote ni se deforme angularmente.
definiciones_clave: |
  - **Segmentos homólogos**: Pareja de segmentos correspondientes donde uno es la imagen del otro bajo la transformación homotética ($\overline{AB}$ y $\overline{A'B'}$).
  - **Paralelismo homotético**: Propiedad geométrica que establece que $\overline{AB} \parallel \overline{A'B'}$ para cualquier par de puntos no colineales con el centro $O$.
  - **Pendiente invariante**: En el plano cartesiano, la inclinación de cualquier recta soporte se preserva intacta tras la homotecia ($m' = m$).
  - **Recta invariante**: Toda recta que contiene al centro de homotecia $O$ cumple $H(L) = L$, transformándose en sí misma.
propiedades_relaciones: |
  - **Vectorial**: $\vec{A'B'} = k \cdot \vec{AB}$.
  - **Paralelismo estricto**: $\overline{AB} \parallel \overline{A'B'} \quad (\forall A \neq B)$.
  - **Pendientes**: $m_{A'B'} = m_{AB}$.
  - **Rectas por el centro**: $O \in L \implies H(L) = L$.
