  - 'Paso 2: Aplicar la propiedad de paralelismo: los segmentos homólogos conservan la misma pendiente ($m'' = m$).'
  - 'Paso 3: Verificar la posición del centro $O$ para determinar si los segmentos pertenecen a una recta invariante.'
  - 'Paso 4: Calcular la ecuación o inclinación de las rectas homotéticas transformadas.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Si la recta que contiene a un lado $\overline{AB}$ tiene pendiente $m = 3$, ¿cuál es la pendiente de su homólogo $\overline{A''B''}$?'
