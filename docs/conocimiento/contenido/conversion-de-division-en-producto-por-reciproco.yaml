semantic_id: MAT.ALG.FRACCIONES_DIV.PRODUCTO_RECIPROCO
resumen_inicial: La división de dos fracciones algebraicas se realiza multiplicando
  la primera fracción por el inverso multiplicativo de la segunda.
explicacion_simple: 'Para dividir dos fracciones algebraicas, no es necesario hacer
  una división directa complicada.

  En su lugar, conservamos la primera fracción exactamente igual, cambiamos el signo
  de división (÷) por uno de multiplicación (·), y damos vuelta la segunda fracción
  (su recíproco).

  Una vez hecha esta conversión, aplicamos las reglas normales de multiplicación de
  fracciones.'
explicacion_formal: 'Dadas dos fracciones algebraicas $\frac{A(x)}{B(x)}$ y $\frac{C(x)}{D(x)}$
  con $B(x) \neq 0$, $C(x) \neq 0$ y $D(x) \neq 0$, el **algoritmo de división racional**
  establece:


  $$\frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)} = \frac{A(x)}{B(x)} \cdot \frac{D(x)}{C(x)}
  = \frac{A(x) \cdot D(x)}{B(x) \cdot C(x)}$$


  **Desglose de la fórmula:**

  - $\frac{D(x)}{C(x)}$: Inverso multiplicativo de la segunda fracción (el divisor).

  - $A(x) \cdot D(x)$: Producto cruzado equivalente del numerador final.

  - $B(x) \cdot C(x)$: Producto cruzado equivalente del denominador final.'
definiciones_clave: '- **División de fracciones algebraicas**: Operación efectuada
  mediante la multiplicación por el recíproco del divisor.

  - **Fracción dividendo y divisor**: La primera fracción (mantenida intacta) y la
  segunda fracción (invertida en la operación).'
propiedades_relaciones: '- **Multiplicación en cruz**: La conversión $\frac{A}{B}
  \div \frac{C}{D} = \frac{A \cdot D}{B \cdot C}$ equivale a multiplicar los términos
  en diagonal (en cruz).

  - **Restricciones tripartitas**: Los valores excluidos del dominio provienen de
  $B(x) = 0$, $D(x) = 0$ y $C(x) = 0$.'
ejemplo_guiado:
  enunciado: Convierte la división de fracciones algebraicas $\frac{5x}{y^2} \div
    \frac{10x^2}{3y}$ en un producto por el recíproco, simplifica el resultado y evalúalo
    para $x = 3$ e $y = 2$.
  pasos:
  - 'Paso 1: Conservar la primera fracción $\frac{5x}{y^2}$ e invertir la segunda
    fracción $\frac{10x^2}{3y} \implies \frac{3y}{10x^2}$.Paso 2: Escribir el producto:
    $\frac{5x}{y^2} \cdot \frac{3y}{10x^2} = \frac{15xy}{10x^2y^2}$.Paso 3: Simplificar
    coeficientes y variables: $\frac{15}{10} = \frac{3}{2}$ y $\frac{xy}{x^2y^2} =
    \frac{1}{xy}$.Paso 4: Obtener la expresión simplificada: $\frac{3}{2xy}$.Paso
    5: Evaluar para $x = 3, y = 2$: $\frac{3}{2(3)(2)} = \frac{3}{12} = \frac{1}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se convierte la división de fracciones algebraicas $\frac{A(x)}{B(x)}
    \div \frac{C(x)}{D(x)}$ en una multiplicación?
  choices:
  - text: Se mantiene $\frac{A(x)}{B(x)}$ y se multiplica por el recíproco $\frac{D(x)}{C(x)}$.
    is_correct: true
  - text: Se invierten ambas fracciones y se multiplican.
    is_correct: false
  - text: Se invierte solo la primera fracción $\frac{B(x)}{A(x)}$ y se multiplica
      por $\frac{C(x)}{D(x)}$.
    is_correct: false
  - text: Se restan los denominadores $B(x) - D(x)$.
    is_correct: false
  explanation: La alternativa correcta es 'Se mantiene $\frac{A(x)}{B(x)}$ y se multiplica
    por el recíproco $\frac{D(x)}{C(x)}$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $\frac{5x}{y^2} \div \frac{10x^2}{3y}$ y evaluar su forma
    simplificada para $x = 3$ e $y = 2$, ¿cuál es el resultado?
  choices:
  - text: $\frac{1}{4}$
    is_correct: true
  - text: $\frac{3}{4}$
    is_correct: false
  - text: $\frac{1}{2}$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{4}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mantener la primera fracción (dividendo) sin modificar.'
- 'Paso 2: Cambiar el signo de división $\div$ por el signo de multiplicación $\cdot$.'
- 'Paso 3: Invertir la segunda fracción (divisor) intercambiando su numerador y denominador.'
- 'Paso 4: Multiplicar directamente numeradores entre sí y denominadores entre sí.'
- 'Paso 5: Simplificar el producto obtenido al mínimo.'
errores_correccion: '- **Error común:** Invertir la primera fracción en lugar de la
  segunda al convertir la división en multiplicación.

  - **Cómo corregirlo:** La regla exige invertir SIEMPRE la segunda fracción (el divisor).
  La primera fracción (el dividendo) permanece intacta.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de división.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de división.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se invierte la segunda fracción al dividir?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla estándar.
- titulo: ¿La división de fracciones es conmutativa?
  respuesta: 'No'
  solucion_pasos:
  - No, el orden de las fracciones altera el resultado.
errores_frecuentes:
- Invertir la primera fracción en lugar de la segunda al dividir.
- Cambiar de signo los términos en vez de permutar numerador y denominador.
- Olvidar restringir del dominio los ceros del segundo numerador.
- Multiplicar en cruz las fracciones habiendo invertido previamente el divisor.
- Desarrollar productos de polinomios antes de factorizar.
afirmaciones_verdaderas:
- La división de fracciones algebraicas equivale a multiplicar la primera fracción
  por el inverso de la segunda.
- El dominio de una división de fracciones excluye los ceros del primer denominador,
  segundo denominador y segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver divisiones de fracciones
  algebraicas mediante la inversión del divisor y simplificación del cociente.
