semantic_id: MAT.ALG.FRACCIONES_DIV.PRODUCTO_RECIPROCO
resumen_inicial: 'Conversión de división en producto por recíproco: concepto, reglas
  operativas y simplificación en División de fracciones algebraicas.'
explicacion_simple: Dividir fracciones es un mito. Nadie lo hace realmente. Lo que
  hacemos es transformar el problema en una multiplicación, usando el recíproco del
  divisor.
explicacion_formal: '### Definición formal


  Es fundamental invertir únicamente la fracción que viene DESPUÉS del signo de división.


  ### Desarrollo didáctico


  La regla universal para dividir fracciones algebraicas se resume en el mantra de
  tres pasos de la escuela: ''Mantener, Cambiar, Voltear'' (Keep, Change, Flip).


  Si tienes: $\frac{A}{B} \div \frac{C}{D}$


  1. **Mantener:** La primera fracción ($\frac{A}{B}$) se queda exactamente igual.
  No la toques.

  2. **Cambiar:** El signo de división ($\div$) se convierte en multiplicación ($\cdot$).

  3. **Voltear:** Inviertes (das vuelta) la segunda fracción. El numerador pasa a
  ser denominador y viceversa. ($\frac{C}{D}$ se convierte en $\frac{D}{C}$).


  Operación resultante: $\frac{A}{B} \cdot \frac{D}{C}$.


  A partir de aquí, el problema es una simple multiplicación de fracciones. Factorizas,
  simplificas cruzado y resuelves.'
definiciones_clave: '- **Conversión de división en producto por recíproco**: Procedimiento
