semantic_id: MAT.ALG.FRACCIONES_DIV.PRODUCTO_RECIPROCO
resumen_inicial: La división de dos fracciones algebraicas se realiza multiplicando la primera fracción por el inverso multiplicativo de la segunda.
explicacion_simple: |
  Para dividir dos fracciones algebraicas no efectuamos una división directa de polinomios término a término.

  En su lugar, conservamos la primera fracción (dividendo) exactamente igual, cambiamos el operador de división ($\div$) por multiplicación ($\cdot$), e invertimos la segunda fracción (divisor).

  Una vez realizada esta conversión, el problema se reduce a multiplicar horizontalmente numeradores entre sí y denominadores entre sí.
explicacion_formal: |
  ### Definición formal
  Dadas dos fracciones algebraicas $\frac{A(x)}{B(x)}$ y $\frac{C(x)}{D(x)}$ con $B(x) \neq 0$, $C(x) \neq 0$ y $D(x) \neq 0$, el **algoritmo de división racional** establece:

  $$\frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)} = \frac{A(x)}{B(x)} \cdot \frac{D(x)}{C(x)} = \frac{A(x) \cdot D(x)}{B(x) \cdot C(x)}$$

  ### Desglose de la fórmula
  - $\frac{D(x)}{C(x)}$: Inverso multiplicativo de la segunda fracción (el divisor).
  - $A(x) \cdot D(x)$: Producto del numerador resultante.
  - $B(x) \cdot C(x)$: Producto del denominador resultante.

  ### Síntesis didáctica
  La división de fracciones algebraicas se convierte en una multiplicación directa manteniendo intacto el dividendo e invirtiendo el divisor.
definiciones_clave: |
  - **División de fracciones algebraicas**: Operación efectuada mediante la multiplicación por el recíproco del divisor.
  - **Fracción dividendo y divisor**: La primera fracción (mantenida intacta) y la segunda fracción (invertida en la operación).
propiedades_relaciones: |
  - **Multiplicación en cruz**: La conversión $\frac{A}{B} \div \frac{C}{D} = \frac{A \cdot D}{B \cdot C}$ equivale a multiplicar los términos en diagonal.
  - **Restricciones tripartitas**: Los valores excluidos del dominio provienen de $B(x) = 0$, $D(x) = 0$ y $C(x) = 0$.
ejemplo_guiado:
  enunciado: 'Convierte la división de fracciones algebraicas $\frac{5x}{y^2} \div \frac{10x^2}{3y}$ en un producto por el recíproco, simplifica el resultado y evalúalo para $x = 3$ e $y = 2$.'
  pasos:
    - 'Paso 1: Conservar la primera fracción $\frac{5x}{y^2}$ e invertir la segunda fracción $\frac{10x^2}{3y} \implies \frac{3y}{10x^2}$.'
    - 'Paso 2: Escribir el producto: $\frac{5x}{y^2} \cdot \frac{3y}{10x^2} = \frac{15xy}{10x^2y^2}$.'
    - 'Paso 3: Simplificar coeficientes y variables: $\frac{15}{10} = \frac{3}{2}$ y $\frac{xy}{x^2y^2} = \frac{1}{xy}$.'
    - 'Paso 4: Obtener la expresión simplificada: $\frac{3}{2xy}$.'
    - 'Paso 5: Evaluar para $x = 3, y = 2$: $\frac{3}{2(3)(2)} = \frac{3}{12} = \frac{1}{4}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se convierte la división de fracciones algebraicas $\frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)}$ en una multiplicación?'
    choices:
      - {text: 'Se mantiene $\frac{A(x)}{B(x)}$ y se multiplica por el recíproco $\frac{D(x)}{C(x)}$', is_correct: true}
      - {text: 'Se invierten ambas fracciones y se multiplican', is_correct: false}
      - {text: 'Se invierte solo la primera fracción $\frac{B(x)}{A(x)}$ y se multiplica por $\frac{C(x)}{D(x)}$', is_correct: false}
      - {text: 'Se restan los denominadores $B(x) - D(x)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se mantiene $\frac{A(x)}{B(x)}$ y se multiplica por el recíproco $\frac{D(x)}{C(x)}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver $\frac{5x}{y^2} \div \frac{10x^2}{3y}$ y evaluar su forma simplificada para $x = 3$ e $y = 2$, ¿cuál es el resultado?'
    choices:
      - {text: '$\frac{1}{4}$', is_correct: true}
      - {text: '$\frac{3}{4}$', is_correct: false}
      - {text: '$\frac{1}{2}$', is_correct: false}
      - {text: '$4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{1}{4}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Mantener la primera fracción (dividendo) sin modificar.'
  - 'Paso 2: Cambiar el signo de división $\div$ por el signo de multiplicación $\cdot$.'
  - 'Paso 3: Invertir la segunda fracción (divisor) intercambiando su numerador y denominador.'
  - 'Paso 4: Multiplicar directamente numeradores entre sí y denominadores entre sí.'
  - 'Paso 5: Simplificar el producto obtenido dividiendo por el M.C.D.'
errores_correccion: |
  - **Error 1:** Invertir la primera fracción en lugar de la segunda al convertir la división en multiplicación. **Cómo corregirlo:** La regla exige **MANTENER INTACTA LA PRIMERA FRACCIÓN E INVERTIR ÚNICAMENTE LA SEGUNDA FRACCIÓN (EL DIVISOR)**.
  - **Error 2:** Invertir ambas fracciones simultáneamente al cambiar el operador de división a multiplicación. **Cómo corregirlo:** Solo se debe invertir **EL DIVISOR (LA FRACCIÓN A LA DERECHA DEL OPERADOR $\div$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la forma equivalente en producto de la división $\frac{x+2}{x} \div \frac{x-1}{3}$?'
    alternativas:
      - '$\frac{x+2}{x} \cdot \frac{3}{x-1}$'
      - '$\frac{x}{x+2} \cdot \frac{x-1}{3}$'
      - '$\frac{x}{x+2} \cdot \frac{3}{x-1}$'
    respuesta: '$\frac{x+2}{x} \cdot \frac{3}{x-1}$'
    solucion_pasos:
      - '1. Mantener la primera fracción: $\frac{x+2}{x}$.'
      - '2. Cambiar $\div$ por $\cdot$.'
      - '3. Invertir la segunda fracción: $\frac{3}{x-1}$.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Cuál es el producto simplificado de $\frac{4}{x} \div \frac{2}{x^2}$?'
    alternativas:
      - '$2x$'
      - '$\frac{8}{x^3}$'
      - '$\frac{2}{x}$'
    respuesta: '$2x$'
    solucion_pasos:
      - '1. Convertir a producto: $\frac{4}{x} \cdot \frac{x^2}{2}$.'
      - '2. Multiplicar y simplificar: $\frac{4x^2}{2x} = 2x$.'
  - titulo: 'Inversión del divisor'
    enunciado: 'Al dividir fracciones algebraicas, ¿se invierte siempre la segunda fracción?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la regla operativa canónica para transformar la división en multiplicación.'
  - titulo: 'Conmutatividad en división'
    enunciado: '¿La división de fracciones algebraicas cumple la propiedad conmutativa?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el orden de dividendo y divisor altera el resultado final.'
errores_frecuentes:
  - 'Invertir la primera fracción en lugar de la segunda al convertir la división en multiplicación.'
  - 'Invertir ambas fracciones de forma simultánea al transformar el operador.'
  - 'Mantener el operador de división $\div$ después de haber invertido el divisor.'
  - 'Multiplicar en cruz las fracciones habiendo invertido previamente la segunda fracción.'
  - 'Omitir las restricciones del dominio asociadas al numerador de la fracción invertida.'
afirmaciones_verdaderas:
  - 'La división de fracciones algebraicas equivale a multiplicar la primera fracción por el inverso de la segunda.'
  - 'El dominio de una división excluye los ceros del denominador del dividendo, denominador del divisor y numerador del divisor.'
al_terminar_debes_poder: |
  Convertir cualquier división de fracciones algebraicas en un producto equivalente conservando el dividendo e invirtiendo el divisor para simplificar el cociente final.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
