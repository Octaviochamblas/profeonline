procedimiento:
- 'Paso 1: Escribe la primera fracción tal como está.'
- 'Paso 2: Cambia el operador $\div$ a $\cdot$.'
- 'Paso 3: Invierte numerador y denominador de la SEGUNDA fracción.'
- 'Paso 4: Multiplica.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en conversión de división en producto por recíproco.
ejemplos:
- titulo: 'Convierte a multiplicación: $\frac{a^2}{b} \div \frac{a}{c}$'
  enunciado: 'Convierte a multiplicación: $\frac{a^2}{b} \div \frac{a}{c}$.'
  solucion_pasos:
  - Mantenemos $\frac{a^2}{b}$.
  - Cambiamos a multiplicar.
  - Volteamos la segunda a $\frac{c}{a}$.
  - 'Queda: $\frac{a^2}{b} \cdot \frac{c}{a}$.'
- titulo: ¿A qué multiplicación equivale $\frac{1}{x} \div x$?
  solucion_pasos:
  - La segunda 'x' es x/1, se voltea a 1/x.
- titulo: 'Respecto de «Conversión de división en producto por recíproco»: ¿Es correcta
    esta caracteriz'
  enunciado: 'Respecto de «Conversión de división en producto por recíproco»: ¿Es
    correcta esta caracterización? «Dividir una fracción por otra es exactamente lo
    mismo que multiplicar la primera fracción por el recíproco de la segunda ( $\frac{A}{B}
    \div \frac{C}{D} = \frac{A}{B} \cdot \frac{D}{C}$ )»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Dividir una fracción por otra
    es exactamente lo mismo que multiplicar la primera fracción por el recíproco de
    la segunda ( $\frac{A}{B} \div \frac{C}{D} = \frac{A}{B} \cdot$ \frac{D}{C}$ ).'
- titulo: 'Respecto de «Conversión de división en producto por recíproco»: ¿Es válida
    esta afirmación?'
  enunciado: 'Respecto de «Conversión de división en producto por recíproco»: ¿Es
    válida esta afirmación? «Voltear la primera fracción»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Dividir una fracción por otra
    es exactamente lo mismo que multiplicar la primera fracción por el recíproco de
    la segunda ( $\frac{A}{B} \div \frac{C}{D} = \frac{A}{B} \cdot$ \frac{D}{C}$ ).'
errores_frecuentes:
- Voltear la primera fracción.
- Voltear ambas fracciones.
- Multiplicar directo sin voltear.
- Solo la primera fracción (dividendo).
- Para «Al transformar una división en multiplicación, la operación 'Mantener, Cambiar,
  Voltear' indica que debemos voltear:», la respuesta correcta es Ambas fracciones.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando conversión
