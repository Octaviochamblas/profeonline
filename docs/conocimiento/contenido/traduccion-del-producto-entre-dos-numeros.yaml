procedimiento:
- 'Paso 1: Identifica los factores (las entidades que se están multiplicando).'
- 'Paso 2: Asígnales variables distintas si son entidades desconocidas diferentes.'
- 'Paso 3: Escribe las letras juntas, una al lado de la otra, para denotar su multiplicación.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción del producto entre dos números.
ejemplos:
- titulo: El factor invisible
  enunciado: 'Traduce algebraicamente: ''El producto del precio de costo por el margen
    de ganancia''.'
  solucion_pasos:
  - Precio de costo es C.
  - Margen de ganancia es M.
  - La palabra producto exige multiplicar.
  - 'Traducción: CM.'
- titulo: 'Una plataforma calcula el impuesto aduanero a pagar. La regla dice: ''El
    impuesto final es el'
  enunciado: 'Una plataforma calcula el impuesto aduanero a pagar. La regla dice:
    ''El impuesto final es el producto entre la tasa de riesgo aduanero (variable)
    y el costo declarado del envío''. Si la tasa es $T$ y el costo es $C$, ¿cuál es
    el modelo correcto? (v1)


    Opciones: A) Impuesto $= TC$ · B) Impuesto $= T + C$ · C) Impuesto $= T / C$ ·
    D) Impuesto $= C^T$'
  solucion_pasos:
  - 'La palabra ''producto'' exige multiplicar ambas variables: T por C, quedando
    TC.'
  - 'Respuesta: Impuesto $= TC$'
- titulo: 'Respecto de «Traducción del producto entre dos números»: ¿La siguiente
    formulación es correc'
  enunciado: 'Respecto de «Traducción del producto entre dos números»: ¿La siguiente
    formulación es correcta? «El **Producto de Cantidades** se traduce utilizando
    la multiplicación»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Producto de Cantidades**
    se traduce utilizando la multiplicación.'
- titulo: 'Respecto de «Traducción del producto entre dos números»: ¿La siguiente
    conclusión es correct'
  enunciado: 'Respecto de «Traducción del producto entre dos números»: ¿La siguiente
    conclusión es correcta? «Traducir usando el signo de suma. (Ej: pensar que ''el
    producto'' es una adición)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Producto de Cantidades**
    se traduce utilizando la multiplicación.'
errores_frecuentes:
- 'Traducir usando el signo de suma. (Ej: pensar que ''el producto'' es una adición).'
- Usar la misma letra para ambas cantidades, escribiendo $x^2$ cuando el enunciado
  dice 'el producto de *dos* números' (deben ser diferentes, $xy$).
- La separación de las variables mediante un signo más (ej. $x+y$).
- La colocación de la letra 'P' antes de las variables (ej. $P(x,y)$).
- Para «¿Qué convención sintáctica se utiliza predominantemente en el álgebra para
  representar la traducción de 'el producto de dos variables distintas'? (v1)», la
  respuesta correcta es El uso obligatorio de un asterisco entre las letras.
afirmaciones_verdaderas:
- La traducción de traducción del producto entre dos números preserva el significado
  matemático del enunciado.
