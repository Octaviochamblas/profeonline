semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.PRODUCTO_NUMEROS
resumen_inicial: 'Traducción del producto entre dos números: traducción, reglas y
  aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: Cuando varias fuerzas actúan en conjunto multiplicando sus efectos,
  hablamos de producto. En el lenguaje de las letras, la multiplicación es la operación
  más silenciosa y unida de todas.
explicacion_formal: '### Definición formal


  La multiplicación implícita (letras juntas) es el estándar de la notación algebraica.


  ### Desarrollo didáctico


  Palabras clave:

  - El producto de

  - Multiplicado por

  - Veces

  - El área de (en contextos rectangulares)


  Ejemplos:

  - ''El producto de dos números distintos'': $xy$

  - ''Un número multiplicado por otro número'': $ab$

  - ''La base multiplicada por la altura'': $bh$


  No es necesario escribir $x \cdot y$ ni $x \times y$, aunque no es un error formal.
  La norma es escribirlos juntos: $xy$.'
definiciones_clave: '- **Traducción del producto entre dos números**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción del producto entre dos números.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    del producto entre dos números.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción del producto entre
    dos números.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
