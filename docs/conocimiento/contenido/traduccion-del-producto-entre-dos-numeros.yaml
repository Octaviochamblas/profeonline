  choices:
  - text: 12x
    is_correct: true
  - text: 3x + 4
    is_correct: false
  - text: 3x / 4
    is_correct: false
  - text: x + 12
    is_correct: false
  explanation: La alternativa correcta es '12x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir el producto entre
  dos números.** **Cómo corregirlo:** Mantener el orden sintáctico adecuado de los
  operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'el producto entre el triple de x y
    4'?
  alternativas:
  - 12x
  - 3x + 4
  - 3x / 4
  - x + 12
  respuesta: 12x
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo 12x.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de el producto
    entre dos números 'el producto entre el triple de x y 4'?
  alternativas:
  - 12x
  - 3x + 4
  - 3x / 4
  - x + 12
  respuesta: 12x
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es 12x.
- titulo: ¿Representa 12x el enunciado 'el producto entre el triple de x y 4'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a 12x?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de el producto entre dos
  números.
- Multiplicar en lugar de dividir o restar según corresponda en el producto entre
  dos números.
- Representar la adición de términos mediante la elevación a exponentes en el producto
  entre dos números.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de el producto entre
  dos números.
afirmaciones_verdaderas:
- La expresión 12x representa la traducción fiel de el producto entre dos números.
- Las variables permiten modelar cualquier caso en el producto entre dos números.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre el producto
  entre dos números construyendo la expresión algebraica 12x de manera correcta.
