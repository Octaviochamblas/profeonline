    is_correct: true
  - text: 3x + 4
    is_correct: false
  - text: 3x / 4
    is_correct: false
  - text: x + 12
    is_correct: false
  explanation: La alternativa correcta es '12x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto entre el triple de x y 4', ¿cuál
