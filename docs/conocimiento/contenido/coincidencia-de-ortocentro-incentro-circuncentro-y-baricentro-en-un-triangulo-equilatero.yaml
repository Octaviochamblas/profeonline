semantic_id: MAT.GEO.NOTABLES_COINCIDENCIA.EQUILATERO_PUNTOS_NOTABLES
resumen_inicial: 'En todo triángulo equilátero, los cuatro puntos notables (ortocentro
  $H$, incentro $I$, circuncentro $O$ y baricentro $G$) coinciden en un único centro
  de simetría. En consecuencia, las circunferencias inscrita y circunscrita son concéntricas
  y el circunradio es el doble del inradio: $R = 2r$.'
explicacion_simple: '![Puntos Notables en Equilátero](/static/img/nodos/coincidencia-de-ortocentro-incentro-circuncentro-y-baricentro-en-un-triangulo-equilatero-intro.svg)


  En el triángulo equilátero ocurre la coincidencia más perfecta de toda la geometría:


  - **Un solo punto central**: El ortocentro, el incentro, el circuncentro y el baricentro
  se unen en el **mismo punto exacto** ($O = I = H = G$).

  - **Círculos concéntricos**: El círculo de adentro (inscrito) y el círculo de afuera
  (circunscrito) tienen exactamente el mismo centro.

  - **El radio grande es el doble del chico**: El circunradio mide el doble que el
  inradio ($R = 2r$).

  - **División de la altura**: El radio grande ocupa $\frac{2}{3}$ de la altura y
  el chico ocupa $\frac{1}{3}$.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo equilátero $\Delta ABC$ de lado $a$ y altura $h = \frac{a\sqrt{3}}{2}$,
  los cuatro puntos notables coinciden en un único centro de simetría común:


  $$O \equiv I \equiv H \equiv G$$


  $$R = 2r = \frac{2}{3}h = \frac{a\sqrt{3}}{3} \quad \land \quad r = \frac{1}{3}h
  = \frac{a\sqrt{3}}{6}$$


  ### Desglose simbólico y geométrico

  - Circunferencias concéntricas: La circunferencia inscrita $\mathcal{C}(I, r)$ y
  la circunscrita $\mathcal{C}(O, R)$ comparten exactamente el mismo centro.

  - Razón de radios $R = 2r$: El circunradio es exactamente el doble del inradio.

  - Razón de áreas circulares: $\frac{\operatorname{Área}(\mathcal{C}_{\text{ext}})}{\operatorname{Área}(\mathcal{C}_{\text{int}})}
  = \left(\frac{R}{r}\right)^2 = 2^2 = 4$.


  ### Síntesis didáctica

  La coincidencia de los cuatro centros en el triángulo equilátero establece la relación
  concéntrica perfecta $R = 2r$ y una razón de áreas circulares de 4 a 1.'
definiciones_clave: '- **Centro de simetría del equilátero**: Punto único donde coinciden
  $O, I, H, G$.

  - **Circunferencias concéntricas**: Circunferencias de distinto radio que comparten
  el mismo centro.

  - **Relación $R = 2r$**: Teorema euclidiano por el cual el circunradio es exactamente
  el doble del inradio en el equilátero.

  '
propiedades_relaciones: '- **Coincidencia cuádruple**: $O = I = H = G$.

  - **Fórmulas de radios**: $R = \frac{a\sqrt{3}}{3} = \frac{2}{3}h$ y $r = \frac{a\sqrt{3}}{6}
  = \frac{1}{3}h$.

  - **Relación entre radios**: $R = 2r$.

  - **Razón de áreas circulares**: $\frac{\text{Área}(\mathcal{C}_{\text{circ}})}{\text{Área}(\mathcal{C}_{\text{insc}})}
  = \left(\frac{R}{r}\right)^2 = 4$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Puntos Notables](/static/img/nodos/coincidencia-de-ortocentro-incentro-circuncentro-y-baricentro-en-un-triangulo-equilatero-ejemplos.svg)


    Un triángulo equilátero tiene lado $a = 6\text{ cm}$. Calcula su altura $h$, la
    longitud del inradio $r$, la longitud del circunradio $R$ y verifica la relación
    $R = 2r$.

    '
  pasos:
  - 'Paso 1: Calcular la altura total: $h = \frac{a\sqrt{3}}{2} = \frac{6\sqrt{3}}{2}
    = 3\sqrt{3}\text{ cm}$.'
  - 'Paso 2: Calcular el inradio $r$: $r = \frac{1}{3}h = \frac{3\sqrt{3}}{3} = \sqrt{3}\text{
    cm}$.'
  - 'Paso 3: Calcular el circunradio $R$: $R = \frac{2}{3}h = \frac{2 \times 3\sqrt{3}}{3}
    = 2\sqrt{3}\text{ cm}$.'
  - 'Paso 4: Verificar la relación: $R = 2\sqrt{3} = 2(\sqrt{3}) = 2r$.'
  - 'Paso 5: Concluir que $h = 3\sqrt{3}\text{ cm}$, $r = \sqrt{3}\text{ cm}$ y $R
    = 2\sqrt{3}\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación se cumple entre el circunradio R y el inradio r en un triángulo
    equilátero?
  choices:
  - text: $R = 2r$
    is_correct: true
  - text: $R = r$
    is_correct: false
  - text: $R = 3r$
    is_correct: false
  - text: $R = 4r$
    is_correct: false
  explanation: En el triángulo equilátero se cumple que $R = 2r$, ya que el circunradio
    es el doble del inradio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el inradio de un triángulo equilátero es r = 4 cm, ¿cuánto mide la
    altura total h del triángulo?
  choices:
  - text: $12\text{ cm}$
    is_correct: true
  - text: $8\text{ cm}$
    is_correct: false
  - text: $16\text{ cm}$
    is_correct: false
  - text: $6\text{ cm}$
    is_correct: false
  explanation: La altura mide $12\text{ cm}$, ya que $r = \frac{1}{3}h \implies h
    = 3r = 3 \times 4 = 12\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el triángulo equilátero y calcular la altura $h = \frac{a\sqrt{3}}{2}$.'
- 'Paso 2: Ubicar el centro común $O = I = H = G$.'
- 'Paso 3: Calcular el inradio mediante $r = \frac{h}{3} = \frac{a\sqrt{3}}{6}$.'
- 'Paso 4: Calcular el circunradio mediante $R = 2r = \frac{2h}{3} = \frac{a\sqrt{3}}{3}$.'
errores_correccion: Recuerda que la relación $R = 2r$ es exclusiva del triángulo equilátero
  y proviene de la partición 2:1 del baricentro.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el circunradio de un triángulo equilátero es $10\text{ cm}$, ¿cuánto
    mide el inradio?
  alternativas:
  - $5\text{ cm}$
  - $10\text{ cm}$
  - $20\text{ cm}$
  respuesta: $5\text{ cm}$
  solucion_pasos:
  - 'Como $R = 2r$, el inradio es la mitad del circunradio: $r = \frac{10}{2} = 5\text{
    cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuántas veces es más grande el área del círculo circunscrito que la
    del círculo inscrito en un triángulo equilátero?
  alternativas:
  - $4\text{ veces}$
  - $2\text{ veces}$
  - $3\text{ veces}$
  respuesta: $4\text{ veces}$
  solucion_pasos:
  - La razón de áreas circulares es $(R/r)^2 = 2^2 = 4$.
- titulo: ¿En un triángulo equilátero el ortocentro coincide con el circuncentro?
  respuesta: Sí
  solucion_pasos:
  - Sí, los 4 puntos notables ($O, I, H, G$) coinciden exactamente.
- titulo: ¿En un triángulo escaleno el circunradio es siempre el doble del inradio?
  respuesta: 'No'
  solucion_pasos:
  - No, $R = 2r$ se cumple únicamente en el triángulo equilátero (Desigualdad de Euler
    $R \ge 2r$).
errores_frecuentes:
- Aplicar $R = 2r$ a triángulos que no son equiláteros.
- 'Creer que el inradio es $2/3$ y el circunradio $1/3$ (es al revés: $R = 2/3 h$
  y $r = 1/3 h$).'
- Olvidar que las dos circunferencias tienen el mismo centro.
- Confundir el radio de la circunferencia con la altura del triángulo.
- Calcular la razón de áreas como 2 en vez de 4 ($2^2$).
afirmaciones_verdaderas:
- En el triángulo equilátero el ortocentro, incentro, circuncentro y baricentro coinciden
  en un único punto.
- El circunradio de un triángulo equilátero es igual al doble de su inradio ($R =
  2r$).
al_terminar_debes_poder: '**QUÉ:** Calcular y fundamentar la coincidencia de los cuatro
  puntos notables y la relación $R = 2r$ en el triángulo equilátero.


  **CÓMO:** Situando el centro común $O = I = H = G$ y aplicando las proporciones
  $R = \frac{2}{3}h = \frac{a\sqrt{3}}{3}$ y $r = \frac{1}{3}h = \frac{a\sqrt{3}}{6}$.


  ![Resumen de Puntos en Equilátero](/static/img/nodos/coincidencia-de-ortocentro-incentro-circuncentro-y-baricentro-en-un-triangulo-equilatero-resumen.svg)

  '
