semantic_id: MAT.ALG.RELACION_EXP_LOG.SIMETRIA_RECTA_IDENTIDAD
resumen_inicial: El análisis de la simetría entre las gráficas exponencial y logarítmica demuestra que $\operatorname{Gr}(\log_b)$ es la reflexión especular exacta de $\operatorname{Gr}(\exp_b)$ respecto a la recta identidad $y = x$, intercambiando coordenadas $(x, y) \leftrightarrow (y, x)$ y transformando la asíntota horizontal $y = 0$ en la asíntota vertical $x = 0$.
explicacion_simple: "![El análisis de la simetría entre las gráficas exponencial y logarítmica demuestra que $\\operatorname{Gr}(\\log_b)$ es la reflexión especular exacta de $\\operatorname{Gr}(\\exp_b)$ respecto a la recta identidad $y = x$, intercambiando coordenadas $(x, y) \\leftrightarrow (y, x)$ y transformando la asíntota horizontal $y = 0$ en la asíntota vertical $x = 0$](/static/img/nodos/analisis-de-la-simetria-entre-las-graficas-exponencial-y-logaritmica-respecto-de-la-recta-identidad-intro.svg)\n\n\nSi doblas el plano cartesiano a lo largo de la **recta diagonal $y = x$** (como si fuera un espejo), ¡la gráfica de $y = b^x$ coincide exactamente sobre la gráfica de $y = \\log_b(x)$!:\n\n$$\\text{Eje de Simetría Especular: } \\mathbf{y = x}$$\n\n- **¿Cómo se reflejan los elementos clave?**\n  - **El corte con los ejes:** El punto $(0, 1)$ de la exponencial se convierte en el punto $(1, 0)$ del logaritmo.\n  - **El punto de base:** El punto $(1, b)$ se convierte en $(b, 1)$.\n \
  \ - **Las asíntotas:** La asíntota **horizontal $y = 0$** de la exponencial se transforma en la asíntota **vertical $x = 0$** del logaritmo.\n  - **Si se cruzan:** Si las dos curvas llegan a tocarse, el punto de intersección **está obligado a vivir sobre la recta $y = x$**."
explicacion_formal: 'Sea $\sigma: \mathbb{R}^2 \to \mathbb{R}^2$ la isometría ortogonal de reflexión cartesiana respecto a la recta diagonal $\Delta: y = x$, definida por $\sigma(x, y) = (y, x)$.

  Sea $\operatorname{Gr}(\exp_b) = \{(x, b^x) \mid x \in \mathbb{R}\}$ y $\operatorname{Gr}(\log_b) = \{(t, \log_b(t)) \mid t > 0\}$.

  Para cada punto $(x_0, y_0) \in \operatorname{Gr}(\exp_b)$, se tiene $y_0 = b^{x_0}$. Aplicando la reflexión:

  $$\sigma(x_0, y_0) = (y_0, x_0)$$

  Evaluando la función logarítmica en la nueva abscisa $y_0$:

  $$\log_b(y_0) = \log_b(b^{x_0}) = x_0$$

  Lo que demuestra formalmente que $\sigma(x_0, y_0) \in \operatorname{Gr}(\log_b)$ y por ende:

  $$\operatorname{Gr}(\log_b) = \sigma\left(\operatorname{Gr}(\exp_b)\right)$$


  **Mapeo de elementos singulares**:

  - $\sigma(\mathcal{A}_H: y = 0) = \mathcal{A}_V: x = 0$.

  - $\sigma(P_Y(0, 1)) = P_X(1, 0)$.'
definiciones_clave: '- **Recta identidad ($y = x$)**: Diagonal principal que actúa como eje de simetría especular entre funciones inversas.

  - **Isometría de reflexión**: Transformación cartesiana $(x, y) \mapsto (y, x)$.'
propiedades_relaciones: '- **Invarianza de puntos fijos**: Si $b^x = x \implies \log_b(x) = x$, el punto pertenece simultáneamente a ambas curvas sobre $y = x$.

  - **Transformación de asíntotas**: Asíntota horizontal $y = 0$ $\leftrightarrow$ Asíntota vertical $x = 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la simetría entre las gráficas exponencial y logarítmica demuestra que $\operatorname{Gr}(\log_b)$ es la reflexión especular exacta de $\operatorname{Gr}(\exp_b)$ respecto a la recta identidad $y = x$, intercambiando coordenadas $(x, y) \leftrightarrow (y, x)$ y transformando la asíntota horizontal $y = 0$ en la asíntota vertical $x = 0$](/static/img/nodos/analisis-de-la-simetria-entre-las-graficas-exponencial-y-logaritmica-respecto-de-la-recta-identidad-ejemplos.svg)



    Considera la función exponencial $f(x) = 2^x$ y su inversa $g(x) = \log_2(x)$:

    1) Identifica los pares simétricos para $x = -1, 0, 1, 3$.

    2) Describe el reflejo de sus respectivas asíntotas.

    3) Explica por qué la recta $y = x$ es la bisectriz de los segmentos que unen pares reflejados.'
  pasos:
  - 'Paso 1: Pares simétricos:

    - En $2^x$: $(-1, 0{,}5), \; (0, 1), \; (1, 2), \; (3, 8)$.

    - En $\log_2(x)$: **$(0{,}5, -1), \; (1, 0), \; (2, 1), \; (8, 3)$**.

    - Cada par invierte exactamente sus coordenadas $(x, y) \to (y, x)$.'
  - 'Paso 2: Reflejo de asíntotas:

    - Asíntota horizontal de $2^x$: $\mathcal{A}_H: y = 0$ (eje $X$).

    - Reflejo en $y = x$: $\mathcal{A}_V: x = 0$ (eje $Y$, asíntota vertical de $\log_2(x)$).'
  - 'Paso 3: La recta $y = x$ es la mediatriz perpendicular de los segmentos que unen $(a, b)$ con $(b, a)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la recta que actúa como eje de simetría entre las gráficas de $y = b^x$ e $y = \log_b(x)$?
  choices:
  - text: y = x (la recta identidad)
    is_correct: true
  - text: y = -x
    is_correct: false
  - text: El eje Y (x = 0)
    is_correct: false
  - text: El eje X (y = 0)
    is_correct: false
  explanation: La alternativa correcta es 'y = x (la recta identidad)'. Toda pareja de funciones inversas es simétrica respecto a la diagonal principal $y = x$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al reflejar la asíntota horizontal $y = 0$ de la función exponencial respecto a la recta $y = x$, ¿qué se obtiene?
  choices:
  - text: La recta vertical x = 0 (asíntota vertical del logaritmo)
    is_correct: true
  - text: La recta y = 1
    is_correct: false
  - text: La recta x = 1
    is_correct: false
  - text: La misma recta y = 0
    is_correct: false
  explanation: La alternativa correcta es 'La recta vertical x = 0 (asíntota vertical del logaritmo)'. La reflexión en $y = x$ intercambia $y$ por $x$, transformando $y = 0$ en $x = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar la recta identidad $y = x$ con línea segmentada como eje de referencia.'
- 'Paso 2: Graficar la función exponencial $y = b^x$ marcando $(0, 1)$, $(1, b)$ y la asíntota $y = 0$.'
- 'Paso 3: Reflejar ortogonalmente cada punto intercambiando coordenadas $(x, y) \to (y, x)$.'
- 'Paso 4: Trazar la curva logarítmica resultante pasando por $(1, 0)$, $(b, 1)$ con asíntota $x = 0$.'
errores_correccion: '- **Error común:** Pensar que la simetría es respecto al eje $Y$ o al eje $X$.

  - **Cómo corregirlo:** La simetría de funciones inversas **es SIEMPRE respecto a la recta diagonal $y = x$**.'
ejemplos:
- titulo: 'Ejemplo 1: Reflejo del punto (1, 3)'
  enunciado: 'Si $(1, 3)$ pertenece a $y = 3^x$, su punto simétrico en $y = \log_3(x)$ es:'
  alternativas:
  - (3, 1)
  - (-1, -3)
  - (1, -3)
  - (3, -1)
  respuesta: (3, 1)
  solucion_pasos:
  - 'Paso 1: $(1, 3) \leftrightarrow (3, 1)$.'
- titulo: 'Ejemplo 2: Eje de simetría universal'
  enunciado: ¿Qué ecuación tiene el eje de simetría entre $e^x$ y $\ln(x)$?
  alternativas:
  - y = x
  - y = 0
  - x = 0
  - y = -x
  respuesta: y = x
  solucion_pasos:
  - 'Paso 1: La recta identidad es $y = x$.'
- titulo: 'Ejemplo 3: Reflejo de asíntota'
  enunciado: 'La asíntota $y = 0$ de $f(x) = 4^x$ se refleja en $y = x$ como:'
  alternativas:
  - x = 0
  - y = 0
  - x = 4
  - y = 4
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: Intercambio de variables $y = 0 \to x = 0$.'
- titulo: 'Ejemplo 4: Punto sobre el eje de simetría'
  enunciado: Si $b^x$ y $\log_b(x)$ se intersectan en un punto $P(a, b)$, ¿qué relación cumplen sus coordenadas?
  alternativas:
  - a = b (el punto está sobre y = x)
  - a = -b
  - a · b = 1
  - a + b = 0
  respuesta: a = b (el punto está sobre y = x)
  solucion_pasos:
  - 'Paso 1: Toda intersección de funciones inversas continuas ocurre sobre $y = x$.'
errores_frecuentes:
- Confundir la simetría respecto a y = x con una reflexión respecto al origen (0, 0).
- Olvidar que los ejes coordenados se intercambian en la reflexión.
- Trazar la gráfica logarítmica sin respetar la asíntota vertical x = 0.
afirmaciones_verdaderas:
- Las gráficas de y = bˣ e y = log_b(x) son estrictamente simétricas respecto a la recta identidad y = x.
- La reflexión respecto a y = x mapea el punto (0, 1) en (1, 0) y la asíntota y = 0 en x = 0.
al_terminar_debes_poder: '**QUÉ:** Analizar y fundamentar la simetría entre las gráficas exponencial y logarítmica respecto a y = x.


  **CÓMO:** Demostrando la correspondencia isométrica (x, y) ↔ (y, x) y la transformación de asíntotas y cortes.


