semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.FIGURAS_CONGRUENTES_CONCEPTO
resumen_inicial: 'Concepto de figuras congruentes como figuras de igual forma y tamaño:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: 'Cuando se observan dos triángulos que parecen "iguales" —mismo
  tamaño y misma forma, aunque estén en posiciones distintas—, existe un término matemático
  preciso para describir esa relación: congruencia.'
explicacion_formal: '![Figuras congruentes: igual forma y tamaño](/static/img/geometria/congruencia-semejanza/congruencia-figuras-congruentes-concepto.svg)


  ### Definición formal


  Dos figuras son congruentes si una puede superponerse exactamente sobre la otra
  mediante traslaciones, rotaciones y/o reflexiones (sin estirar ni encoger), de modo
  que coincidan por completo.


  ### Desarrollo didáctico


  Dos triángulos recortados de papel son congruentes si, al colocar uno encima del
  otro (permitiendo girarlo o darlo vuelta), coinciden exactamente en todos sus puntos.
  Esta idea intuitiva de "encajar perfectamente" es la base formal de la congruencia.'
definiciones_clave: '- **Concepto de figuras congruentes como figuras de igual forma
  y tamaño**: Elemento o propiedad fundamental en el estudio de congruencia, semejanza
  y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de figuras congruentes como figuras
  de igual forma y tamaño.'
ejemplo_guiado:
  enunciado: Para analizar concepto de figuras congruentes como figuras de igual forma
    y tamaño, considera un ángulo $\alpha = 128^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1091^\circ = 128^\circ$.
  pasos:
  - Identificar la propiedad de concepto de figuras congruentes como figuras de igual
    forma y tamaño referida a $\alpha = 128^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1091 = 128 \implies x = 128 - 1091$.'
  - Concluir que la medida calculada para concepto de figuras congruentes como figuras
    de igual forma y tamaño es $x = -963^\circ$.
