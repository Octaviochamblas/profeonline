semantic_id: MAT.GEO.VECTORES_OPERATORIA.MODULO_VECTOR_GENERAL
resumen_inicial: 'Cálculo del módulo de un vector no anclado en el origen: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Cuando un vector no 'parte desde cero', su longitud se calcula
  igual que la distancia entre dos puntos cualesquiera del plano.
explicacion_formal: '![Módulo de un vector no anclado en el origen](/static/img/geometria/cartesiano-vectores/vector-modulo-general.svg)


  ### Definición formal


  Para un vector $\vec{AB}$ con $A(x_A,y_A)$ y $B(x_B,y_B)$ cualesquiera, el módulo
  se calcula con la fórmula general de distancia: $|\vec{AB}|=\sqrt{(x_B-x_A)^2+(y_B-y_A)^2}$,
  sin importar si el vector está anclado en el origen o no.


  ### Desarrollo didáctico


  En la figura, el vector va de $A(-2,1)$ a $B(4,5)$: $|\vec{AB}|=\sqrt{(4-(-2))^2+(5-1)^2}=\sqrt{6^2+4^2}=\sqrt{52}\approx7,2$.'
definiciones_clave: '- **Cálculo del módulo de un vector no anclado en el origen**:
  Elemento o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
