semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.DECRECIMIENTO_INVERSO
resumen_inicial: La interpretación de relaciones inversas mediante funciones potencia de exponente negativo $f(x) = k \cdot x^{-m} = \frac{k}{x^m}$ ($m > 0$) describe fenómenos de disipación o atenuación donde multiplicar la entrada por $c$ divide la salida por $c^m$, provocando un decaimiento asintótico hacia cero.
explicacion_simple: "![La interpretación de relaciones inversas mediante funciones potencia de exponente negativo $f(x) = k \\cdot x^{-m} = \\frac{k}{x^m}$ ($m > 0$) describe fenómenos de disipación o atenuación donde multiplicar la entrada por $c$ divide la salida por $c^m$, provocando un decaimiento asintótico hacia cero](/static/img/nodos/interpretacion-de-relaciones-inversas-mediante-funciones-potencia-de-exponente-negativo-intro.svg)\n\n\nEn las leyes físicas de disipación (como la luz, el sonido, la fuerza de gravedad o la presión de un gas), **a mayor distancia o volumen, menor es la intensidad**:\n\n- **¿Cómo opera el divisor de escala $c^m$?**\n  - En la **proporcionalidad inversa simple ($m = 1$, Ley de Boyle $P = k/V$):**\n    - Si duplicas el volumen ($c = 2$), la presión se reduce a la **mitad ($1/2$)**.\n  - En la **ley del inverso al cuadrado ($m = 2$, luz, sonido, gravedad $F = k/d^2$):**\n    - Si te alejas al **doble de distancia ($c = 2$)**, la fuerza o luz se divide por\
  \ $2^2 = \\mathbf{4}$ (recibes solo el $25\\%$).\n    - Si te alejas al **triple de distancia ($c = 3$)**, se divide por $3^2 = \\mathbf{9}$ (recibes solo el $11\\%$).\n- **Asíntota:** Por muy lejos que te vayas, la intensidad nunca es cero absoluta ni negativa: **tiende asintóticamente a $y = 0$**."
explicacion_formal: 'Sea $f: \mathbb{R}^+ \to \mathbb{R}^+$ definida por $f(x) = kx^{-m} = \frac{k}{x^m}$ con $k > 0$ y $m \in \mathbb{R}^+$.

  Al escalar la variable independiente por $c > 1$:

  $$f(c \cdot x) = \frac{k}{(cx)^m} = \frac{k}{c^m \cdot x^m} = \frac{1}{c^m} \cdot \frac{k}{x^m} = \frac{1}{c^m} \cdot f(x)$$


  **Comportamiento asintótico disipativo**:

  $$\lim_{x \to +\infty} f(x) = \lim_{x \to +\infty} \frac{k}{x^m} = 0^+$$

  La función es estrictamente decreciente ($f''(x) = -m k x^{-(m+1)} < 0$) y estrictamente convexa ($f''''(x) = m(m+1)k x^{-(m+2)} > 0$), garantizando un decaimiento asintótico sin cortes de eje.'
definiciones_clave: '- **Ley del inverso al cuadrado**: Principio físico donde la densidad de flujo de radiación decrece con $1/d^2$.

  - **Factor de atenuación**: Fracción $1/c^m$ que cuantifica la reducción de intensidad al aumentar la distancia por $c$.'
propiedades_relaciones: '- **Conservación de energía en esferas**: Al expandirse el frente de onda esférico en área $A = 4\pi d^2$, la intensidad $I = P/A$ decae necesariamente proporcional a $d^{-2}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación de relaciones inversas mediante funciones potencia de exponente negativo $f(x) = k \cdot x^{-m} = \frac{k}{x^m}$ ($m > 0$) describe fenómenos de disipación o atenuación donde multiplicar la entrada por $c$ divide la salida por $c^m$, provocando un decaimiento asintótico hacia cero](/static/img/nodos/interpretacion-de-relaciones-inversas-mediante-funciones-potencia-de-exponente-negativo-ejemplos.svg)



    Aplica el factor de atenuación $1/c^m$ para resolver:

    1) La intensidad del sonido de un altavoz es $I(d) = \frac{100}{d^2}$. Si una persona retrocede del punto $d = 2\text{ m}$ al punto $d = 6\text{ m}$ ($c = 3$), ¿a qué fracción se reduce la intensidad?

    2) Un gas ideal a temperatura constante cumple $P(V) = \frac{24}{V}$. Si el gas se expande cuadruplicando su volumen ($c = 4$), ¿cuál es la nueva presión?'
  pasos:
  - 'Paso 1: Para $I(d) = 100 d^{-2}$: El exponente es $m = 2$ y el factor de distancia es $c = 6/2 = 3$. Factor de atenuación: $\frac{1}{c^m} = \frac{1}{3^2} = \mathbf{\frac{1}{9}}$. **La intensidad se reduce a la novena parte ($11{,}1\%$)**.'
  - 'Paso 2: Para $P(V) = 24 V^{-1}$: El exponente es $m = 1$ y $c = 4$. Factor: $\frac{1}{4^1} = \mathbf{\frac{1}{4}}$. **La nueva presión es $24 / 4 = \mathbf{6\text{ atm}}$**.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la fuerza de atracción entre dos imanes sigue la ley $F = k / d²$ y la distancia se triplica, ¿qué ocurre con la fuerza?
  choices:
  - text: Se divide por 9 (se reduce a 1/9 de su valor original)
    is_correct: true
  - text: Se divide por 3
    is_correct: false
  - text: Se multiplica por 9
    is_correct: false
  - text: Se reduce a cero
    is_correct: false
  explanation: La alternativa correcta es 'Se divide por 9 (se reduce a 1/9 de su valor original)'. En una ley del inverso al cuadrado, al triplicar la distancia la fuerza se atenúa por $1/3^2 = 1/9$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un modelo de iluminación $E(d) = k · d⁻²$, ¿cuánto vale el límite de la iluminación cuando la distancia d tiende a infinito?
  choices:
  - text: 0 (tiende asintóticamente a cero sin ser negativa)
    is_correct: true
  - text: -∞
    is_correct: false
  - text: k
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '0 (tiende asintóticamente a cero sin ser negativa)'. $\lim_{d \to +\infty} k/d^2 = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente negativo $-m$ en el modelo $f(x) = k x^{-m} = k / x^m$.'
- 'Paso 2: Determinar el factor de incremento de la variable de entrada $c = x_2 / x_1$.'
- 'Paso 3: Calcular el factor de atenuación $1/c^m$.'
- 'Paso 4: Multiplicar la salida inicial por $1/c^m$ (o dividirla por $c^m$) para hallar el valor atenuado.'
errores_correccion: '- **Error común:** Creer que a gran distancia la magnitud se hace negativa.

  - **Cómo corregirlo:** Las funciones con potencias negativas $k/x^m$ **NUNCA dan valores negativos** si $k > 0$: se acercan infinitesimalmente a **cero asintóticamente**.'
ejemplos:
- titulo: 'Ejemplo 1: Atenuación luminosa cuádruple'
  enunciado: 'Si te alejas a 4 veces la distancia de una bombilla, la iluminación se divide por:'
  alternativas:
  - '16'
  - '4'
  - '8'
  - '64'
  respuesta: '16'
  solucion_pasos:
  - 'Paso 1: $c^m = 4^2 = 16 \implies$ se divide por 16.'
- titulo: 'Ejemplo 2: Gravedad a triple radio'
  enunciado: 'A una altura de 3 radios terrestres ($d = 3R$), la gravedad se reduce a:'
  alternativas:
  - 1/9 de g
  - 1/3 de g
  - 1/6 de g
  - '0'
  respuesta: 1/9 de g
  solucion_pasos:
  - 'Paso 1: $(1/3)^2 = 1/9$.'
- titulo: 'Ejemplo 3: Ley de Boyle décuple'
  enunciado: 'Si un gas se comprime a 1/10 de su volumen, su presión $P \propto 1/V$ se multiplica por:'
  alternativas:
  - '10'
  - '100'
  - 1/10
  - '1.000'
  respuesta: '10'
  solucion_pasos:
  - 'Paso 1: $1 / (1/10) = 10$.'
- titulo: 'Ejemplo 4: Comportamiento en el infinito'
  enunciado: 'En todo modelo de decaimiento inverso $y = k/x^2$, la asíntota horizontal es:'
  alternativas:
  - y = 0
  - x = 0
  - y = k
  - No tiene
  respuesta: y = 0
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to \infty} k/x^2 = 0 \implies y = 0$.'
errores_frecuentes:
- Olvidar elevar al cuadrado el factor de distancia en leyes cuadráticas inversas.
- Asumir que las fuerzas atenuadas se anulan a distancia finita.
- Confundir la proporcionalidad inversa simple (1/x) con la inversa cuadrática (1/x²).
afirmaciones_verdaderas:
- En un modelo de potencia negativo, al multiplicar la entrada por c la salida se divide por cᵐ.
- Las relaciones inversas modelan disipación de energía y convergen asintóticamente a cero en el infinito.
al_terminar_debes_poder: '**QUÉ:** Interpretar y aplicar relaciones inversas modeladas por potencias de exponente negativo.


  **CÓMO:** Calculando el factor de atenuación 1/cᵐ y analizando el comportamiento asintótico hacia cero.


