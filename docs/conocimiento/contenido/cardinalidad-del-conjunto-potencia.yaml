semantic_id: MAT.FUND.CONJUNTOS_BASICOS.CARDINALIDAD_CONJUNTO_POTENCIA
resumen_inicial: 'Fórmula combinatoria y cálculo de la cardinalidad del conjunto potencia: $|\mathcal{P}(A)| = 2^{|A|} = 2^n$ para un conjunto finito de $n$ elementos.'
explicacion_simple: '![Infografía: Fórmula exponencial 2ⁿ para la cardinalidad de la potencia](/static/img/nodos/cardinalidad-del-conjunto-potencia-intro.svg)


  Para saber cuántos subconjuntos tiene un conjunto (es decir, la **cardinalidad de su conjunto potencia**), usamos la regla de las potencias de dos: **$|\mathcal{P}(A)| = 2^n$**, donde **$n$** es el número de elementos del conjunto original. ¿Por qué ocurre esto? Porque al armar un subconjunto, para cada elemento tenemos exactamente **$2$ opciones**: o lo incluimos en el subconjunto, o no lo incluimos. Por ejemplo, si un conjunto tiene $3$ elementos, tendrá **$2^3 = 2 \times 2 \times 2 = 8$ subconjuntos**.

  '
explicacion_formal: '### Definición formal

  En la combinatoria y la teoría de conjuntos finitos, si $A$ es un conjunto finito de cardinalidad $|A| = n \in \mathbb{N}_0$, la cardinalidad del conjunto potencia $\mathcal{P}(A)$ es:

  $$|\mathcal{P}(A)| = 2^n = 2^{|A|}$$

  Demostración combinatoria mediante el Teorema del Binomio de Newton:

  $$|\mathcal{P}(A)| = \sum_{k=0}^{n} \binom{n}{k} = \binom{n}{0} + \binom{n}{1} + \dots + \binom{n}{n} = (1 + 1)^n = 2^n$$

  donde cada término $\binom{n}{k}$ representa la cantidad de subconjuntos de tamaño exacto $k$.


  ### Desglose simbólico

  - Número de subconjuntos totales: $N_{\text{total}} = 2^n$.

  - Número de subconjuntos propios estrictos ($B \subsetneq A$ con $B \neq A$): $N_{\text{propios}} = 2^n - 1$.

  - Número de subconjuntos no vacíos ($B \neq \emptyset$): $N_{\text{no vacíos}} = 2^n - 1$.

  - Número de subconjuntos propios y no vacíos: $N = 2^n - 2$.


  ### Síntesis didáctica

  Cada subconjunto de $A$ corresponde de forma biyectiva a una función característica binaria $\chi_X: A \to \{0, 1\}$, de las cuales existen exactamente $2^{|A|}$ funciones posibles.

  '
definiciones_clave: '- **Cardinalidad del conjunto potencia ($2^n$)**: Total de subconjuntos que pueden formarse a partir de un conjunto finito de $n$ elementos.

  - **Función característica ($\chi_X$)**: Función binaria que asigna 1 si un elemento está en el subconjunto y 0 si no lo está.

  - **Subconjunto propio**: Cualquier subconjunto $B \subseteq A$ que no sea idéntico al conjunto completo $A$.

  '
propiedades_relaciones: '- **Caso del conjunto vacío**: Para $n = 0$, $|\mathcal{P}(\emptyset)| = 2^0 = 1$ (cuyo único elemento es $\emptyset$).

  - **Crecimiento exponencial**: Añadir un solo elemento al conjunto base duplica inmediatamente el tamaño de su conjunto potencia ($2^{n+1} = 2 \cdot 2^n$).

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Subconjuntos propios y desglose combinatorio binomial](/static/img/nodos/cardinalidad-del-conjunto-potencia-ejemplos.svg)


    Un conjunto $A$ tiene $4$ elementos. Calcula: (a) la cardinalidad total de su conjunto potencia $|\mathcal{P}(A)|$, (b) cuántos subconjuntos propios tiene, y (c) cuántos subconjuntos de $2$ elementos pueden formarse.'
  pasos:
  - 'Paso 1: Identificar la cardinalidad del conjunto base: $|A| = n = 4$.'
  - 'Paso 2: Calcular la cardinalidad total del conjunto potencia mediante la fórmula exponencial: - $|\mathcal{P}(A)| = 2^n = 2^4 = 16$ subconjuntos en total.'
  - 'Paso 3: Calcular el número de subconjuntos propios: - Se resta el conjunto completo $A$: $N_{\text{propios}} = 2^4 - 1 = 16 - 1 = 15$ subconjuntos propios.'
  - 'Paso 4: Calcular la cantidad de subconjuntos de $2$ elementos usando el coeficiente binomial $\binom{n}{k}$: - $\binom{4}{2} = \frac{4 \times 3}{2 \times 1} = 6$ subconjuntos de 2 elementos.'
  - 'Paso 5: Concluir que $|\mathcal{P}(A)| = 16$, con $15$ subconjuntos propios y $6$ subconjuntos binarios.'
checkpoints:
- placement: after_explicacion_formal
  question: Si un conjunto $B$ tiene $5$ elementos ($|B| = 5$), ¿cuál es la cardinalidad de su conjunto potencia $|\mathcal{P}(B)|$?
  choices:
  - text: $32$ subconjuntos ($2^5$)
    is_correct: true
  - text: $10$ subconjuntos ($2 \times 5$)
    is_correct: false
  - text: $25$ subconjuntos ($5^2$)
    is_correct: false
  - text: $16$ subconjuntos ($2^4$)
    is_correct: false
  explanation: La alternativa correcta es '$32$ subconjuntos ($2^5$)'. La fórmula de cardinalidad es $2^n = 2^5 = 32$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos subconjuntos propios tiene un conjunto de $3$ elementos?
  choices:
  - text: $7$ subconjuntos propios ($2^3 - 1$)
    is_correct: true
  - text: $8$ subconjuntos propios
    is_correct: false
  - text: $6$ subconjuntos propios
    is_correct: false
  - text: $3$ subconjuntos propios
    is_correct: false
  explanation: La alternativa correcta es '$7$ subconjuntos propios ($2^3 - 1$)'. Se descuenta el propio conjunto para dar $8 - 1 = 7$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Contar la cantidad de elementos únicos $n = |A|$ del conjunto dado.'
- 'Paso 2: Elevar la base $2$ al exponente $n$: $|\mathcal{P}(A)| = 2^n$.'
- 'Paso 3: Si se solicitan subconjuntos propios, restar $1$ al resultado: $2^n - 1$.'
- 'Paso 4: Si se solicitan subconjuntos de un tamaño específico $k$, calcular el combinatorio $\binom{n}{k}$.'
errores_correccion: '- **Error 1:** Multiplicar $2 \times n$ en vez de calcular la potencia $2^n$. **Cómo corregirlo:** Para $n = 3$, $2 \times 3 = 6$ (incorrecto); la fórmula correcta es la potencia $2^3 = 8$.

  - **Error 2:** Olvidar que para el conjunto vacío $n = 0$, $2^0 = 1$. **Cómo corregirlo:** $|\mathcal{P}(\emptyset)| = 2^0 = 1$ (el subconjunto es el propio $\emptyset$).

  '
ejemplos:
- titulo: Cálculo para conjunto de 1 elemento
  enunciado: ¿Cuánto vale $|\mathcal{P}(\{x\})|$?
  alternativas:
  - $2$
  - $1$
  - $0$
  respuesta: $2$
  solucion_pasos:
  - 1. $n = 1$.
  - 2. $|\mathcal{P}(\{x\})| = 2^1 = 2$.
- titulo: Conjunto potencia del vacío
  enunciado: ¿Cuál es la cardinalidad de $\mathcal{P}(\emptyset)$?
  respuesta: $1$
  solucion_pasos:
  - $2^0 = 1$, siendo $\{\emptyset\}$ su único elemento.
  alternativas:
  - $1$
  - $0$
  - $2$
  - Indefinida
- titulo: Duplicación de tamaño
  enunciado: Si a un conjunto de 4 elementos se le añade un quinto elemento, ¿cómo cambia la cantidad de subconjuntos?
  respuesta: Se duplica (pasa de 16 a 32 subconjuntos)
  solucion_pasos:
  - $2^5 = 32 = 2 \times 16$.
  alternativas:
  - Se duplica (pasa de 16 a 32 subconjuntos)
  - Aumenta en 5 subconjuntos
  - Se cuadruplica
  - Permanece igual
- titulo: Subconjuntos propios de 4 elementos
  enunciado: ¿Cuántos subconjuntos propios tiene un conjunto de cardinalidad 4?
  respuesta: $15$
  solucion_pasos:
  - $2^4 - 1 = 16 - 1 = 15$.
  alternativas:
  - $15$
  - $16$
  - $14$
  - $7$
errores_frecuentes:
- La afirmación de que la cardinalidad del conjunto potencia se calcula multiplicando $2 \times n$.
- La afirmación de que el conjunto potencia del conjunto vacío tiene cardinalidad cero.
- La afirmación de que el número de subconjuntos propios de un conjunto de $n$ elementos es igual a $2^n$.
- La afirmación de que elevar la cardinalidad a la potencia de 2 ($n^2$) determina el número de subconjuntos.
- La afirmación de que un conjunto con 6 elementos tiene 12 subconjuntos en total.
afirmaciones_verdaderas:
- La cardinalidad del conjunto potencia de un conjunto finito con $n$ elementos es exactamente $2^n$ ($|\mathcal{P}(A)| = 2^{|A|}$).
- El número de subconjuntos propios de un conjunto finito de cardinalidad $n$ es $2^n - 1$, correspondiente a excluir el conjunto original.
al_terminar_debes_poder: 'QUÉ: Calcular y justificar la cardinalidad del conjunto potencia ($|\mathcal{P}(A)| = 2^n$) y de sus subconjuntos propios ($2^n - 1$).

  CÓMO: Aplicar el modelo exponencial de decisiones binarias ($2^n$) y la sumatoria de combinaciones binomiales $\sum \binom{n}{k}$.


  ![Cuadro resumen: Crecimiento exponencial 2ⁿ y conteo binomial](/static/img/nodos/cardinalidad-del-conjunto-potencia-resumen.svg)

  '
