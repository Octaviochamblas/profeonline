semantic_id: MAT.NUM.NUMEROS_PRIMOS.COMPUESTO_DEFINICION
resumen_inicial: Un número compuesto es un entero mayor que 1 que posee más de dos
  divisores positivos distintos.
explicacion_simple: Un número es compuesto cuando se puede armar multiplicando números
  enteros más pequeños (distintos de 1 y de sí mismo). A diferencia de los números
  primos, los compuestos sí se pueden descomponer en bloques o factores multiplicativos
  menores.
explicacion_formal: 'Un entero $c \in \mathbb{N}$ se define formalmente como un **Número
  Compuesto** si cumple:


  $$c > 1 \quad \land \quad |D(c)| > 2$$


  **Desglose de la fórmula:**

  - $c > 1$: Restricción de magnitud que excluye al $1$, a los enteros negativos y
  al cero.

  - $|D(c)| > 2$: Presencia de tres o más divisores positivos distintos (al menos
  un divisor $a$ tal que $1 < a < c$).


  > **Complemento didáctico:** Por el Teorema Fundamental de la Aritmética, todo número
  compuesto se puede expresar de forma única como un producto de factores primos.'
definiciones_clave: '- **Número compuesto**: Entero $c > 1$ que posee al menos un
  divisor positivo distinto de 1 y de $c$.

  - **Factorización única**: Expresión de un compuesto como producto exclusivo de
  factores primos.'
propiedades_relaciones: '- **Partición de los naturales mayores a 1**: Todo $n > 1$
  es o bien primo o bien compuesto.'
ejemplo_guiado:
  enunciado: Verifique si el número $12$ cumple la definición formal de número compuesto.
  pasos:
  - 'Paso 1: Comprobar la condición $12 > 1$ (cumplida).'
  - 'Paso 2: Calcular el conjunto de divisores positivos: $D(12) = \{1, 2, 3, 4, 6,
    12\}$.'
  - 'Paso 3: Contar los elementos del conjunto: $|D(12)| = 6 > 2$.'
  - 'Conclusión: Como tiene 6 divisores (más de 2), $12$ es un número compuesto.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición para que un número entero c sea compuesto?
  choices:
  - text: Que sea mayor que 1 y tenga más de 2 divisores positivos distintos
    is_correct: true
  - text: Que sea un número negativo
    is_correct: false
  - text: Que sea divisible únicamente por 1
    is_correct: false
  - text: Que tenga solo 2 divisores
    is_correct: false
  explanation: La alternativa correcta es 'Que sea mayor que 1 y tenga más de 2 divisores
    positivos distintos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con 12, ¿cuántos divisores positivos se encontraron?
  choices:
  - text: 6 divisores
    is_correct: true
  - text: 2 divisores
    is_correct: false
  - text: 1 divisor
    is_correct: false
  - text: 0 divisores
    is_correct: false
  explanation: La alternativa correcta es '6 divisores'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que la cantidad sea un entero estrictamente mayor que 1.'
- 'Paso 2: Buscar al menos un divisor positivo distinto de 1 y del número mismo.'
- 'Paso 3: Concluir que el número es compuesto si $|D(c)| \ge 3$.'
errores_correccion: '- **Error 1: Pensar que los números compuestos solo son números
  pares.** **Cómo corregirlo:** Existen números impares compuestos como 9, 15, 21,
  25, 27, etc.


  - **Error 2: Incluir al número 1 como número compuesto.** **Cómo corregirlo:** El
  1 tiene un único divisor, por lo que no es primo ni compuesto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números es un número compuesto?
  alternativas:
  - '15'
  - '13'
  - '7'
  respuesta: '15'
  solucion_pasos:
  - $D(15) = \{1, 3, 5, 15\}$ (4 divisores), por lo tanto 15 es compuesto.
- titulo: Ejemplo 2
  enunciado: Indique el número compuesto más pequeño que existe.
  alternativas:
  - '4'
  - '2'
  - '1'
  respuesta: '4'
  solucion_pasos:
  - '4 es el menor entero positivo con 3 divisores: $D(4) = \{1, 2, 4\}$.'
- titulo: ¿Es el número 9 un número compuesto?
  respuesta: Sí
  solucion_pasos:
  - Sí, $D(9) = \{1, 3, 9\}$, al tener 3 divisores es compuesto.
- titulo: ¿Es el número 11 un número compuesto?
  respuesta: 'No'
  solucion_pasos:
  - No, 11 es un número primo ($D(11) = \{1, 11\}$).
errores_frecuentes:
- Todos los números compuestos son obligatoriamente números pares.
- El número 1 forma parte de la lista de los números compuestos.
- Un número compuesto solo se puede dividir por números pares.
- Los números compuestos tienen exactamente tres divisores en todos los casos.
- Un entero impar no puede descomponerse en factores primos.
afirmaciones_verdaderas:
- Un número compuesto es un entero mayor que 1 con más de dos divisores positivos
  distintos.
- El menor número compuesto que existe en los enteros positivos es el 4.
al_terminar_debes_poder: Al terminar serás capaz de definir y verificar si un entero
  es compuesto, comprobando que sea mayor que 1 y posea más de dos divisores positivos
  distintos.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
