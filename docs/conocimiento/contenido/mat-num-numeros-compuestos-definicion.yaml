semantic_id: MAT.NUM.NUMEROS_PRIMOS.COMPUESTO_DEFINICION
resumen_inicial: "Un número compuesto es un número natural mayor que 1 que tiene más de dos divisores positivos distintos."
explicacion_simple: |
  Imagínate que tienes bloques de construcción y quieres armar diferentes rectángulos. Si
  tienes 6 bloques, ¡puedes hacer muchas cosas! Puedes ponerlos en una fila de 6, o hacer
  dos filas de 3. Los números que se pueden construir multiplicando otros números más
  pequeños, como el 6 (que es 2 por 3), se llaman números compuestos.
explicacion_formal: |
  Un **número compuesto** es cualquier número entero positivo $n>1$ que no es primo, es
  decir, que posee al menos un divisor positivo diferente de $1$ y de sí mismo. Todos los
  números compuestos se pueden descomponer como producto de factores primos (por ejemplo,
  $12=2^2\cdot3$). El número compuesto más pequeño es el $4$.
definiciones_clave: |
  **Número compuesto**: entero mayor que 1 con más de dos divisores positivos distintos
  (es decir, que no es primo).
propiedades_relaciones: |
  A excepción del 2, todos los números pares mayores que 2 son compuestos, ya que siempre
  son divisibles por 2. Por definición, el 1 no es primo ni compuesto.
ejemplo_guiado:
  enunciado: "Determina si el número 14 es compuesto."
  pasos:
    - "Buscamos sus divisores positivos: $1,2,7,14$."
    - "Tiene cuatro divisores, más de dos."
    - "Conclusión: 14 es un número compuesto."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué condición debe cumplir un número para ser compuesto?"
    choices:
      - {text: "Tener más de dos divisores positivos distintos", is_correct: true}
      - {text: "Ser par", is_correct: false}
      - {text: "Ser mayor que 10", is_correct: false}
      - {text: "No tener divisores", is_correct: false}
    explanation: "La correcta es Tener más de dos divisores positivos distintos: eso es justamente lo opuesto a ser primo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 17 un número compuesto?"
    choices:
      - {text: "No, solo tiene dos divisores (1 y 17)", is_correct: true}
      - {text: "Sí, tiene más de dos divisores", is_correct: false}
      - {text: "Sí, porque es impar", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, solo tiene dos divisores (1 y 17): por lo tanto, 17 es primo, no compuesto."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
- 'Paso 1: Verifica si el número es mayor que 1. Si no lo es (como el 1 o negativos), no es compuesto.'
- 'Paso 2: Encuentra los divisores del número.'
- 'Paso 3: Si encuentras al menos un divisor positivo diferente de 1 y del propio número (es decir, tiene 3 o más divisores en total), el número es compuesto.'
errores_correccion: |
  Un error frecuente es pensar que el 1 es compuesto porque no es primo, olvidando que es
  un caso especial que no pertenece a ninguna de las dos categorías.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Determina si el número $6$ es compuesto.
  alternativas:
    - "Sí, tiene cuatro divisores"
    - "No, tiene dos divisores"
    - "No se puede determinar"
  respuesta: "Sí, tiene cuatro divisores"
  solucion_pasos:
  - 'Paso a: Listamos los divisores positivos de $6$. El número $6$ es divisible por $1$, $2$, $3$ y $6$.'
  - 'Paso b: Contamos sus divisores: tiene en total $4$ divisores distintos.'
  - 'Paso c: Al tener más de dos divisores, concluimos que $6$ es un número compuesto.'
- titulo: Ejemplo 2
  enunciado: Determina si el número $11$ es compuesto.
  alternativas:
    - "No, tiene dos divisores"
    - "Sí, tiene tres divisores"
    - "No se puede determinar"
  respuesta: "No, tiene dos divisores"
  solucion_pasos:
  - 'Paso a: Evaluamos los divisores positivos de $11$. Sus únicos divisores son $1$ y $11$.'
  - 'Paso b: Contamos sus divisores: tiene exactamente $2$ divisores.'
  - 'Paso c: Dado que no tiene más de dos divisores, $11$ no es un número compuesto (es un número primo).'
- titulo: ¿Es el número $4$ un número compuesto?
  respuesta: Sí
  solucion_pasos:
  - 'El número $4$ es mayor que $1$.'
  - 'Buscamos sus divisores: $1$, $2$ y $4$.'
  - 'Como tiene tres divisores (más de dos), califica como número compuesto. De hecho, es el número compuesto más pequeño.'
- titulo: ¿Es el número $13$ un número compuesto?
  respuesta: No
  solucion_pasos:
  - 'Los divisores de $13$ son únicamente el $1$ y el $13$.'
  - 'Como solo tiene dos divisores distintos, no cumple la definición de compuesto, la cual requiere tres o más divisores.'
errores_frecuentes:
- 'Pensar que el número 1 es compuesto porque no es primo. El 1 es un caso especial y no
    pertenece a ninguna de las dos categorías.'
- 'Creer que todos los números pares son compuestos, olvidando que el 2 es primo.'
- 'Detenerse tras encontrar un solo divisor adicional sin confirmar el conteo total.'
- 'Confundir múltiplos con divisores al clasificar el número.'
- 'Olvidar que los números compuestos deben ser enteros positivos mayores que 1.'
afirmaciones_verdaderas:
  - "El 4 es el número compuesto más pequeño."
  - "El número 14 es compuesto."
al_terminar_debes_poder: |
  Definir el concepto de número compuesto y determinar si un número dado lo es contando
  sus divisores.
fuente: Teoría de Números
estado: publicado
