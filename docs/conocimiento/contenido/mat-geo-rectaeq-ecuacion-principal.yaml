semantic_id: MAT.GEO.RECTA_ECUACIONES.ECUACION_PRINCIPAL
resumen_inicial: 'Definición de la ecuación principal de la recta y = mx + b: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La forma más utilizada para representar una recta es aquella que
  muestra directamente su inclinación (pendiente) y el punto donde cruza el eje vertical.
explicacion_formal: '![Ecuación principal de la recta](/static/img/geometria/analitica/rectaeq-ecuacion-principal.svg)


  ### Definición formal


  Toda recta no vertical del plano cartesiano puede escribirse en la forma $y=mx+b$,
  donde $m\in\mathbb{R}$ es la pendiente y $b\in\mathbb{R}$ es el coeficiente de posición.


  ### Desarrollo didáctico


  En la figura, la recta $y=1{,}5x+1$ tiene pendiente $m=1{,}5$ y coeficiente de posición
  $b=1$, por lo que cruza el eje y en el punto $(0,1)$.'
