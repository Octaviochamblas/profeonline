semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: 'Análisis del crecimiento de la función logarítmica para bases mayores
  que uno: conceptos, asíntotas, propiedades e inversidad en Análisis de la función
  logarítmica.'
explicacion_simple: Cuando la base de un logaritmo es mayor que $1$, a medida que
  el argumento crece, también crece el valor del logaritmo, aunque cada vez más lentamente.
explicacion_formal: '### Definición formal


  Si $b>1$, entonces para todo par $x_1,x_2\in\mathbb{R}^+$ con $x_1<x_2$ se cumple
  $\log_b(x_1)<\log_b(x_2)$; es decir, $f(x)=\log_b(x)$ es estrictamente creciente
  en todo su dominio.


  ### Desarrollo didáctico


  Con $b=2$: $\log_2(1)=0$, $\log_2(2)=1$, $\log_2(4)=2$, $\log_2(8)=3$. Cada vez
  que $x$ se duplica, $f(x)$ aumenta en $1$ unidad; el valor de la función crece de
  forma sostenida, aunque necesita argumentos cada vez más grandes para seguir subiendo.'
definiciones_clave: '- **Análisis del crecimiento de la función logarítmica para bases
  mayores que uno**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a análisis del crecimiento de la función logarítmica para bases mayores
  que uno.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de análisis
    del crecimiento de la función logarítmica para bases mayores que uno.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de análisis del crecimiento de
    la función logarítmica para bases mayores que uno.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    análisis del crecimiento de la función logarítmica para bases mayores que uno?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en análisis del crecimiento de la función logarítmica para bases mayores que uno?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la base $b$ cumple $b>1$.'
- 'Paso 2: Evalúa la función en al menos dos valores crecientes de $x$.'
- 'Paso 3: Compara los resultados y confirma que $f(x)$ aumenta cuando $x$ aumenta.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en análisis
  del crecimiento de la función logarítmica para bases mayores que uno.
ejemplos:
- titulo: Comparación de valores con base $10$
  enunciado: Compara $\log_{10}(10)$ y $\log_{10}(100)$ para $f(x)=\log_{10}(x)$.
  solucion_pasos:
  - Se calcula $\log_{10}(10)=1$ y $\log_{10}(100)=2$.
  - Como $100>10$ y $2>1$, se confirma que la función es creciente.
- titulo: Verificación de crecimiento con base $3$
  enunciado: Determina si $f(x)=\log_3(x)$ es creciente evaluando $x=9$ y $x=27$.
  solucion_pasos:
  - Se calcula $\log_3(9)=2$ y $\log_3(27)=3$.
  - Como $27>9$ y $3>2$, la función efectivamente crece.
- titulo: ¿Es creciente $f(x)=\log_5(x)$?
  enunciado: ¿La función $f(x)=\log_5(x)$ es creciente en todo su dominio?
  respuesta: Sí
  solucion_pasos:
  - La base $5$ cumple $b>1$, condición suficiente para que la función sea creciente.
- titulo: ¿El crecimiento logarítmico es constante?
  enunciado: ¿La rapidez con que crece $f(x)=\log_b(x)$ se mantiene constante cuando
    $b>1$?
  respuesta: 'No'
  solucion_pasos:
  - El crecimiento se vuelve cada vez más lento a medida que $x$ aumenta, aunque nunca
    se detiene.
errores_frecuentes:
- Confundir "creciente" con "crece rápidamente"; el crecimiento logarítmico es lento
  pero sostenido.
- Aplicar la condición $b>1$ sin verificarla antes de afirmar que la función es creciente.
- Suponer que el crecimiento depende del valor de $x$ en vez de depender de la base
  $b$.
- Confundir el comportamiento creciente de $b>1$ con el decreciente de $0<b<1$.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando análisis del crecimiento de la función logarítmica para bases mayores
  que uno.
