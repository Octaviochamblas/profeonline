semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: 'El crecimiento logarítmico ocurre cuando la base cumple $b > 1$, haciendo que la gráfica suba de izquierda a derecha, desacelerando progresivamente su pendiente.'
explicacion_simple: |
  Cuando la base de una función logarítmica es mayor que 1 (como $b = 2$ o $b = 10$), la función representa un crecimiento que se vuelve cada vez más lento. Cerca del eje vertical $y$ (para valores de $x$ pequeños cercanos a cero), la curva cae velozmente hacia abajo bordeando la asíntota. Tras cruzar el eje horizontal en el punto $(1, 0)$, la curva continúa subiendo hacia la derecha pero inclinándose cada vez más suavemente.
explicacion_formal: |
  ### Definición formal
  Para una función logarítmica mónica $f(x) = \log_b(x)$, la condición de la base **$b > 1$** establece un **modelo estrictamente creciente** en todo su dominio $]0, +\infty[$ caracterizado analíticamente por:
  $$\forall x_1, x_2 \in \mathbb{R}^+, \quad x_1 < x_2 \implies \log_b(x_1) < \log_b(x_2)$$
  con derivada primera estrictamente positiva:
  $$f'(x) = \frac{1}{x \ln(b)} > 0 \quad (\text{dado que } x > 0 \text{ y } \ln(b) > 0 \text{ para } b > 1)$$

  ### Desglose simbólico
  - Comportamiento asintótico a la izquierda: $\lim_{x \to 0^+} \log_b(x) = -\infty$. La recta $x = 0$ es asíntota vertical por la derecha.
  - Comportamiento divergente a la derecha: $\lim_{x \to +\infty} \log_b(x) = +\infty$.
  - Concavidad permanente (Cóncava hacia abajo): La derivada segunda $f''(x) = -\frac{1}{x^2 \ln(b)} < 0$ es estrictamente negativa en todo $]0, +\infty[$, lo que demuestra que la pendiente disminuye continuamente a medida que $x$ crece.

  ### Síntesis didáctica
  Diferenciar crecimiento exponencial de crecimiento logarítmico: La función exponencial con base mayor que 1 es *acelerada* (cóncava hacia arriba, sube cada vez más empinada). La función logarítmica con base mayor que 1 es *desacelerada* (cóncava hacia abajo, sube cada vez más plana).
definiciones_clave: |
  - **Crecimiento logarítmico ($b > 1$)**: Incremento monótono continuo caracterizado por una desaceleración de la tasa instantánea de cambio.
  - **Concavidad hacia abajo ($f''(x) < 0$)**: Curvatura gráfica con forma de arco o puente que suaviza el crecimiento.
  - **Divergencia ilimitada lenta**: Crecimiento continuo de las salidas $y$ hacia $+\infty$ que requiere valores de $x$ exponencialmente más grandes.
propiedades_relaciones: |
  - **Dominación polinomial inversa**: Para $x \to +\infty$, cualquier potencia positiva $x^\varepsilon$ (con $\varepsilon > 0$) crece eventualmente más rápido que $\log_b(x)$ ($\lim_{x \to +\infty} \frac{\log_b(x)}{x^\varepsilon} = 0$).
  - **Efecto de la magnitud de la base**: A mayor magnitud de la base $b > 1$, más aplastada y lenta resulta la gráfica de crecimiento logarítmico para $x > 1$.
ejemplo_guiado:
  enunciado: 'Analiza el crecimiento de la función logarítmica $f(x) = \log_2(x)$, calculando sus valores para $x = 0.25, 0.5, 1, 2, 4, 8, 16$ y comparando las pendientes promedio en los intervalos $[1, 2]$ y $[8, 16]$.'
  pasos:
    - 'Paso 1: Evaluamos puntos: $f(0.25) = -2$, $f(0.5) = -1$, $f(1) = 0$, $f(2) = 1$, $f(4) = 2$, $f(8) = 3$, $f(16) = 4$.'
    - 'Paso 2: Comprobamos que es estrictamente creciente en todo su dominio $]0, +\infty[$.'
    - 'Paso 3: Pendiente promedio en $[1, 2]$: $m_1 = \frac{f(2) - f(1)}{2 - 1} = \frac{1 - 0}{1} = 1$.'
    - 'Paso 4: Pendiente promedio en $[8, 16]$: $m_2 = \frac{f(16) - f(8)}{16 - 8} = \frac{4 - 3}{8} = \frac{1}{8} = 0.125$.'
    - 'Paso 5: Conclusión: La pendiente disminuye de $1$ a $0.125$, confirmando la desaceleración del crecimiento.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para la función logarítmica $f(x) = \log_b(x)$ con base $b > 1$, ¿cómo evoluciona la velocidad de crecimiento de la gráfica a medida que $x$ toma valores cada vez mayores a la derecha?'
    choices:
      - {text: 'La función sigue siendo estrictamente creciente, pero su velocidad de crecimiento se desacelera progresivamente (la pendiente disminuye)', is_correct: true}
      - {text: 'La función se acelera creciendo cada vez más empinada', is_correct: false}
      - {text: 'La función alcanza un valor máximo y empieza a decrecer', is_correct: false}
      - {text: 'La función se transforma en una constante horizontal', is_correct: false}
    explanation: 'La alternativa correcta es ''La función sigue siendo estrictamente creciente, pero su velocidad de crecimiento se desacelera progresivamente (la pendiente disminuye)''. La derivada segunda negativa $f''(x) < 0$ garantiza un crecimiento desacelerado (cóncavo hacia abajo).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si comparamos las funciones de crecimiento logarítmico $f(x) = \log_2(x)$ y $g(x) = \log_{10}(x)$ para $x > 1$, ¿cuál de las dos curvas se eleva a mayor altura?'
    choices:
      - {text: 'La función $f(x) = \log_2(x)$, porque su base menor $b = 2$ produce un crecimiento más empinado que $b = 10$', is_correct: true}
      - {text: 'La función $g(x) = \log_{10}(x)$, porque su base mayor $b = 10$ es diez veces superior', is_correct: false}
      - {text: 'Ambas alcanzan exactamente las mismas alturas en todos los puntos', is_correct: false}
      - {text: 'La función $f(x) = \log_2(x)$ es una curva decreciente', is_correct: false}
    explanation: 'La alternativa correcta es ''La función $f(x) = \log_2(x)$, porque su base menor $b = 2$ produce un crecimiento más empinado que $b = 10$''. En las funciones logarítmicas con base mayor que 1, a menor base la curva se eleva más rápido.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que la base de la función logarítmica satisface $b > 1$.'
  - 'Paso 2: Declarar que la función es estrictamente creciente en todo su dominio $]0, +\infty[$.'
  - 'Paso 3: Trazar la asíntota vertical en $x = 0$ descendiendo hacia $-\infty$ al aproximarse a cero por la derecha.'
  - 'Paso 4: Trazar la curva atravesando el punto $(1, 0)$ y elevándose suavemente hacia $+\infty$ a la derecha en forma cóncava hacia abajo.'
errores_correccion: |
  - **Error 1:** Creer que una función logarítmica creciente alcanza un tope o límite horizontal máximo. **Cómo corregirlo:** Aunque su crecimiento es muy lento, el límite de $\log_b(x)$ cuando $x \to +\infty$ es $+\infty$. La función jamás se estabiliza horizontalmente ni tiene asíntota horizontal.
  - **Error 2:** Asumir que una base mayor (como $b = 100$) produce una gráfica más empinada que una base menor (como $b = 2$). **Cómo corregirlo:** En los logaritmos ocurre lo opuesto a las exponenciales: a mayor base $b > 1$, mayor es la compresión del resultado, resultando en una curva más aplanada.
ejemplos:
  - titulo: 'Monotonía de logaritmo natural'
    enunciado: '¿La función $f(x) = \ln(x)$ es estrictamente creciente?'
    alternativas:
      - 'Sí, porque su base $e \approx 2.718 > 1$'
      - 'No, es decreciente'
      - 'Es constante'
    respuesta: 'Sí, porque su base $e \approx 2.718 > 1$'
    solucion_pasos:
      - '1. La base es $e > 1$.'
      - '2. La función es estrictamente creciente en $]0, +\infty[$.'
  - titulo: 'Comportamiento en la asíntota'
    enunciado: 'Para $f(x) = \log_3(x)$, ¿el límite cuando $x \to 0^+$ es $-\infty$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al aproximarse $x \to 0^+$, los valores del logaritmo caen indefinidamente a $-\infty$.'
  - titulo: 'Signo de la función según el argumento'
    enunciado: 'En la función creciente $f(x) = \log_2(x)$, ¿las salidas son negativas para $0 < x < 1$ y positivas para $x > 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $(1, 0)$ cruza el eje $x$. Para $x \in ]0, 1[$, $f(x) < 0$. Para $x > 1$, $f(x) > 0$.'
  - titulo: 'Desaceleración de pendientes'
    enunciado: '¿La pendiente de la curva de $y = \log(x)$ en $x = 100$ es menor que en $x = 10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La derivada $f''(x) = \frac{1}{x \ln 10}$ disminuye a medida que $x$ aumenta.'
errores_frecuentes:
  - 'Una función logarítmica con base $b > 1$ posee un límite máximo horizontal que frena su crecimiento.'
  - 'La gráfica de la función logarítmica creciente $f(x) = \log_2(x)$ es cóncava hacia arriba.'
  - 'Una base logarítmica grande como $b = 100$ genera un crecimiento logarítmico más rápido que una base pequeña como $b = 2$.'
  - 'Al aproximarse a $x = 0$ por la derecha, la función logarítmica $f(x) = \log_5(x)$ se aproxima a cero.'
  - 'La función logarítmica $f(x) = \log_b(x)$ pasa de ser creciente a decreciente en $x = 1$.'
afirmaciones_verdaderas:
  - 'Para $b > 1$, la función logarítmica $f(x) = \log_b(x)$ es estrictamente creciente y cóncava hacia abajo en todo su dominio $]0, +\infty[$.'
  - 'Al avanzar hacia la derecha ($x \to +\infty$), la pendiente de la función de crecimiento logarítmico disminuye continuamente tendiendo a cero sin detener nunca su elevación hacia $+\infty$.'
al_terminar_debes_poder: |
  QUÉ: Analizar el comportamiento creciente de la función logarítmica cuando $b > 1$.
  CÓMO: Comprobar que a mayores valores del argumento $x_2 > x_1 > 0$ se obtienen mayores valores de la ordenada $f(x_2) > f(x_1)$, identificando su monotonía, concavidad y asíntota.
