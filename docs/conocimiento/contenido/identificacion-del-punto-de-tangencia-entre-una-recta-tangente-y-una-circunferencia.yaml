semantic_id: MAT.GEO.CIRCULO_RECTAS.PUNTO_TANGENCIA
resumen_inicial: El punto de tangencia es el punto único de intersección entre la recta tangente y la circunferencia, coincidiendo con el pie del radio perpendicular.
explicacion_simple: 'El **punto de tangencia** (que casi siempre se dibuja con la letra $T$) es el lugar exacto del ''beso'' geométrico: es el único punto del universo que está **al mismo tiempo** en la recta y en la circunferencia.


  Tiene una importancia colosal en cualquier dibujo geométrico porque es donde aterriza el radio perpendicular: si trazas una línea desde el centro $O$ hasta $T$, esa línea forma un ángulo recto de **$90^\circ$** con la recta. Además, entre todos los infinitos puntos que tiene la recta tangente, el punto $T$ es el más cercano al centro de la circunferencia.


  ![Punto de tangencia](/static/img/nodos/identificacion-del-punto-de-tangencia-entre-una-recta-tangente-y-una-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal del punto de tangencia

  Sea $\mathcal{C}(O, r)$ una circunferencia y $\mathcal{L}$ una recta tangente a $\mathcal{C}$. Se define el **punto de tangencia** $T$ como el único elemento del conjunto intersección:

  $$\{T\} = \mathcal{L} \cap \mathcal{C} \iff T \in \mathcal{L} \quad \wedge \quad T \in \mathcal{C}$$


  ### Caracterización como pie de la perpendicular

  El punto $T$ es idénticamente la proyección ortogonal del centro $O$ sobre la recta tangente $\mathcal{L}$:

  $$T = \text{proy}_{\mathcal{L}}(O) \iff \overline{OT} \perp \mathcal{L} \quad (d(T, O) = r)$$


  ### Propiedad de mínima distancia euclidiana

  Para cualquier otro punto $P$ perteneciente a la recta tangente con $P \neq T$:

  $$d(P, O) = \sqrt{r^2 + PT^2} > r = d(T, O)$$

  Esto demuestra que $T$ es el punto global de mínima distancia desde el centro a la recta tangente.


  > **Complemento didáctico:** En cualquier figura geométrica donde una recta toque a un círculo, ubica inmediatamente el punto de tangencia $T$ y traza el radio $OT$. ¡Ese radio SIEMPRE forma un ángulo recto de $90^\circ$ en $T$! Es el primer paso para aplicar Pitágoras o razones trigonométricas.

  '
definiciones_clave: '- **Punto de tangencia ($T$)**: Punto común único entre la recta tangente y la circunferencia.

  - **Pie de la perpendicular**: Punto de intersección entre una recta y el segmento perpendicular bajado desde un punto exterior.

  - **Proyección ortogonal**: Ubicación del punto más cercano sobre una recta desde un punto dado.

  '
propiedades_relaciones: '- **Pertenencia doble**: Satisface la ecuación de la recta $Ax_T + By_T + C = 0$ y la de la circunferencia $(x_T - h)^2 + (y_T - k)^2 = r^2$.

  - **Perpendicularidad del radio**: El vector radial $\vec{OT}$ es ortogonal al vector director de la recta $\vec{v}_{\mathcal{L}}$.

  - **Ecuación de la recta tangente en $T$**: En el origen, la tangente en $T(x_0, y_0)$ viene dada por la fórmula del desdoblamiento: $x_0 x + y_0 y = r^2$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de punto de tangencia](/static/img/nodos/identificacion-del-punto-de-tangencia-entre-una-recta-tangente-y-una-circunferencia-ejemplos.svg)


    Una circunferencia tiene ecuación $x^2 + y^2 = 25$. Una recta tangente vertical pasa por el semiplano derecho en $x = 5$. Determina las coordenadas del punto de tangencia $T$ y verifica que su distancia al centro es el radio.'
  pasos:
  - 'Paso 1: Sustituir la ecuación de la recta $x = 5$ en la circunferencia: $5^2 + y^2 = 25 \implies 25 + y^2 = 25$.'
  - 'Paso 2: Despejar la ordenada $y$: $y^2 = 0 \implies y = 0$.'
  - 'Paso 3: Obtener las coordenadas del punto de tangencia: $T(5, 0)$.'
  - 'Paso 4: Verificar la distancia al centro $O(0, 0)$: $d(T, O) = \sqrt{(5 - 0)^2 + (0 - 0)^2} = 5 = r$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación geométrica guarda el punto de tangencia T con el centro O y la recta tangente?
  choices:
  - text: Es el punto de la recta donde el radio OT es estrictamente perpendicular a la recta tangente.
    is_correct: true
  - text: Es el punto medio entre el centro O y el punto más lejano de la recta.
    is_correct: false
  - text: Es el punto donde la recta tangente corta al diámetro en un ángulo de 45°.
    is_correct: false
  - text: Es un punto exterior a la circunferencia a distancia 2r del centro.
    is_correct: false
  explanation: La alternativa correcta es 'Es el punto de la recta donde el radio OT es estrictamente perpendicular a la recta tangente.' En $T$ se verifica $d(T, O) = r$ y $\overline{OT} \perp \mathcal{L}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si T es el punto de tangencia de una recta L con una circunferencia de centro O y radio r, ¿cuánto mide la distancia d(T, O)?
  choices:
  - text: Exactamente r.
    is_correct: true
  - text: 2r.
    is_correct: false
  - text: Cero.
    is_correct: false
  - text: Depende de la pendiente de la recta.
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente r.' Como $T$ pertenece a la circunferencia, su distancia al centro es rigurosamente igual al radio $r$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la recta tangente y la circunferencia involucrada.

  2. Localizar el punto de contacto $T$ en el gráfico o resolver algebraicamente el sistema para hallar $(x_T, y_T)$.

  3. Trazar el radio $\overline{OT}$ hacia el punto de tangencia.

  4. Marcar el ángulo recto de $90^\circ$ entre el radio y la recta tangente para futuros cálculos métricos.

  '
errores_correccion: '- **Error común 1:** Ubicar el punto de tangencia fuera de la circunferencia. **Corrección:** $T$ pertenece obligatoriamente a la circunferencia y a la recta.

  - **Error común 2:** Asumir que hay dos puntos de tangencia en una sola recta tangente. **Corrección:** Cada recta tangente tiene un único punto de contacto con la circunferencia.

  '
ejemplos:
- tipo: A
  titulo: Coordenadas del punto de tangencia
  enunciado: La recta $y = -6$ es tangente a la circunferencia $x^2 + y^2 = 36$. ¿Cuáles son las coordenadas del punto de tangencia?
  alternativas:
  - text: $(0, -6)$.
    is_correct: true
  - text: $(-6, 0)$.
    is_correct: false
  - text: $(6, -6)$.
    is_correct: false
  - text: $(0, 6)$.
    is_correct: false
  explicacion: 'Sustituyendo $y = -6$ en $x^2 + y^2 = 36$: $x^2 + 36 = 36 \implies x = 0$, luego $T(0, -6)$.'
- tipo: B
  titulo: Pertenencia del punto de tangencia
  enunciado: ¿Pertenece el punto de tangencia tanto a la recta como a la circunferencia?
  respuesta: Sí
  explicacion: Sí. El punto de tangencia es el elemento común que forma la intersección entre ambos conjuntos geométricos.
errores_frecuentes:
- '''Confundir el punto de tangencia con el centro de la circunferencia.'''
- '''Creer que el punto de tangencia puede estar en el interior del círculo.'''
- '''Olvidar que el radio que llega a T es perpendicular a la recta tangente.'''
afirmaciones_verdaderas:
- '''El punto de tangencia es el único punto común entre la recta tangente y la circunferencia.'''
- '''El punto de tangencia dista exactamente el radio del centro de la circunferencia ($d(T, O) = r$).'''
- '''El radio trazado al punto de tangencia forma un ángulo recto de $90^\circ$ con la recta tangente.'''
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular las coordenadas o propiedades del punto de tangencia en problemas geométricos.


  **CÓMO:** Aplicando la doble pertenencia $T \in \mathcal{L} \cap \mathcal{C}$ y la perpendicularidad $\overline{OT} \perp \mathcal{L}$.


  ![Síntesis de punto de tangencia](/static/img/nodos/identificacion-del-punto-de-tangencia-entre-una-recta-tangente-y-una-circunferencia-resumen.svg)

  '
