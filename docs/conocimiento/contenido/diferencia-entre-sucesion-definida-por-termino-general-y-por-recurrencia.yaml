procedimiento:
- 'Paso 1: Para identificar una fórmula EXPLÍCITA, busca que solo contenga la letra
  ''$n$'' operando con números.'
- 'Paso 2: Para identificar una fórmula RECURSIVA, busca que contenga expresiones
  con subíndices de posiciones relativas, como ''$a_{n-1}$'' o ''$a_{n-2}$''.'
- 'Paso 3: Si te piden un término muy lejano, intenta siempre deducir la explícita.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en diferencia entre sucesión definida por término general y por recurrencia.
ejemplos:
- titulo: Reconociendo el idioma
  enunciado: 'Analiza: Opción 1: $b_n = 2n + 1$. Opción 2: $b_n = b_{n-1} + 2$. ¿Cuál
    es cuál?'
  solucion_pasos:
  - Opción 1 solo usa 'n'. Es explícita (Término General).
  - Opción 2 usa 'b_{n-1}'. Es recursiva.
errores_frecuentes:
- Confundir el concepto de recurrencia con el de término general en preguntas de verdadero/falso.
- Intentar calcular el término cien usando una recurrencia a mano, perdiendo valioso
  tiempo en una prueba.
afirmaciones_verdaderas:
- La formulación de diferencia entre sucesión definida por término general y por recurrencia
  mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando diferencia entre
  sucesión definida por término general y por recurrencia.
