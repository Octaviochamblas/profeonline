semantic_id: MAT.NUM.SUCESIONES_BASE.COMPARACION_EXPLICITA_RECURSIVA
resumen_inicial: 'Diferencia entre sucesión definida por término general y por recurrencia:
  concepto y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: 'Si quieres saber qué número está en la posición 1.000 de una fila, tienes
  dos opciones: o cuentas uno a uno desde el principio (recurrencia), o tomas un atajo matemático
  que te deja ahí instantáneamente (fórmula explícita).'
explicacion_formal: "Una misma sucesión, por ejemplo los múltiplos de cinco ($5, 10, 15, 20\\\
  dots$), puede escribirse en 'dos idiomas':\n\n1. **Idioma Explícito (Término General):**\
  \ $a_n = 5 \\cdot n$\n   - *Ventaja:* Es rápido. Si quieres el término 100, haces $5 \\\
  cdot 100 = 500$. Listo.\n   \n2. **Idioma Recursivo:** $a_1 = 5$ y $a_n = a_{n-1} + 5$\n\
  \   - *Desventaja:* Es lento para el futuro. Si quieres el término 100, primero debes calcular\
  \ los 99 anteriores.\n   - *Ventaja:* Es muy fácil de entender y de programar en un computador.\
  \ La famosa sucesión de Fibonacci ($1, 1, 2, 3, 5, 8\\dots$) es muy fácil de escribir como\
  \ recurrencia ($a_n = a_{n-1} + a_{n-2}$), pero su fórmula explícita es horriblemente compleja."
definiciones_clave: '- **Diferencia entre sucesión definida por término general y por recurrencia**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Diferencia entre sucesión definida por término
  general y por recurrencia**: Relaciones de cambio y fórmulas estructurales de conceptos
  fundamentales de sucesiones.'
ejemplo_guiado:
  enunciado: Una sucesión tiene término general a_n igual a 3n menos 1. Reescríbela en su
    forma recursiva, indicando a_1 y la regla de recurrencia.
  pasos:
  - 'Calculo el primer término con la fórmula explícita: a_1 es igual a 3 por 1 menos 1, es
    decir 2.'
  - Identifico que el coeficiente de n, que es 3, es la cantidad constante que se suma de
    un término al siguiente.
  - 'Escribo la forma recursiva: a_1 igual a 2, y a_n igual a a_(n-1) más 3. Verifico con
    a_2: 3 por 2 menos 1 es 5, y también 2 más 3 es 5.'
