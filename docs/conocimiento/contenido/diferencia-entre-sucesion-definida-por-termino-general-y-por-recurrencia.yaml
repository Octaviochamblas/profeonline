resumen_inicial: La comparación demuestra que la forma explícita $a_n = f(n)$ calcula
  cualquier posición directamente, mientras que la forma recursiva $a_n = g(a_{n-1})$
  requiere calcular todos los términos previos encadenados.
explicacion_simple: La fórmula explícita es un atajo directo a cualquier posición
  $n$ sin pasar por los números anteriores. La fórmula recursiva es un camino paso
  a paso donde debes conocer obligatoriamente los escalones previos para avanzar.
explicacion_formal: 'Para la misma sucesión numérica, las dos representaciones formales
  se contrastan por su complejidad de cálculo:


  $$\text{Forma Explícita (Término General): } a_n = f(n) \implies a_{100} = f(100)$$

  $$\text{Forma Recursiva: } a_n = g(a_{n-1}) \implies a_{100} = g(g(\dots g(a_1)\dots))$$


  **Diferencia de evaluación:**

  - La forma explícita evalúa en $O(1)$ pasos de tiempo.

  - La forma recursiva requiere $O(n)$ evaluaciones encadenadas.'
definiciones_clave: '- **Comparación explícita vs recursiva**: Contraste entre el
  cálculo directo $f(n)$ y el cálculo en cadena $g(a_{n-1})$.'
propiedades_relaciones: '- **Eficiencia de cálculo**: La forma explícita no requiere
  conocer los términos anteriores.'
ejemplo_guiado:
  enunciado: Compare cómo calcular $a_{50}$ en la sucesión de pares usando la regla
    explícita $a_n = 2n$ versus la regla recursiva $a_1 = 2, a_n = a_{n-1} + 2$.
  pasos:
  - 'Paso 1: Vía explícita: sustitución directa $a_{50} = 2(50) = 100$ (un solo paso).'
  - 'Paso 2: Vía recursiva: requiere calcular secuencialmente $a_1=2, a_2=4, a_3=6,
    \dots$ en $50$ pasos hasta $a_{50}$.'
  - 'Conclusión: La forma explícita calcula directamente cualquier término distante
    sin requerir los anteriores.'
checkpoints:
