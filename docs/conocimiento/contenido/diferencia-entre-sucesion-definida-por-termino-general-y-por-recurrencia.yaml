semantic_id: MAT.NUM.SUCESIONES_BASE.COMPARACION_EXPLICITA_RECURSIVA
resumen_inicial: 'Diferencia entre sucesión definida por término general y por recurrencia:
  concepto y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: 'Si quieres saber qué número está en la posición 1.000 de una
  fila, tienes dos opciones: o cuentas uno a uno desde el principio (recurrencia),
  o tomas un atajo matemático que te deja ahí instantáneamente (fórmula explícita).'
explicacion_formal: "Una misma sucesión, por ejemplo los múltiplos de cinco ($5, 10,\
  \ 15, 20\\dots$), puede escribirse en 'dos idiomas':\n\n1. **Idioma Explícito (Término\
  \ General):** $a_n = 5 \\cdot n$\n   - *Ventaja:* Es rápido. Si quieres el término\
  \ 100, haces $5 \\cdot 100 = 500$. Listo.\n   \n2. **Idioma Recursivo:** $a_1 =\
  \ 5$ y $a_n = a_{n-1} + 5$\n   - *Desventaja:* Es lento para el futuro. Si quieres\
  \ el término 100, primero debes calcular los 99 anteriores.\n   - *Ventaja:* Es\
  \ muy fácil de entender y de programar en un computador. La famosa sucesión de Fibonacci\
  \ ($1, 1, 2, 3, 5, 8\\dots$) es muy fácil de escribir como recurrencia ($a_n = a_{n-1}\
  \ + a_{n-2}$), pero su fórmula explícita es horriblemente compleja."
definiciones_clave: '- **Diferencia entre sucesión definida por término general y
  por recurrencia**: Concepto fundamental dentro del estudio de Conceptos fundamentales
  de sucesiones.'
propiedades_relaciones: '- **Propiedades de Diferencia entre sucesión definida por
  término general y por recurrencia**: Relaciones de cambio y fórmulas estructurales
  de conceptos fundamentales de sucesiones.'
