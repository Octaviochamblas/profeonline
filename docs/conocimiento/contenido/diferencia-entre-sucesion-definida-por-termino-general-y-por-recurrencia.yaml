procedimiento:
- 'Paso 1: Para identificar una fórmula EXPLÍCITA, busca que solo contenga la letra ''$n$''
  operando con números.'
- 'Paso 2: Para identificar una fórmula RECURSIVA, busca que contenga expresiones con subíndices
  de posiciones relativas, como ''$a_{n-1}$'' o ''$a_{n-2}$''.'
- 'Paso 3: Si te piden un término muy lejano, intenta siempre deducir la explícita.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en diferencia entre sucesión definida por término general y por recurrencia.
ejemplos:
- titulo: Reconociendo el idioma
  enunciado: 'Analiza: Opción 1: $b_n = 2n + 1$. Opción 2: $b_n = b_{n-1} + 2$. ¿Cuál es cuál?'
  solucion_pasos:
  - Opción 1 solo usa 'n'. Es explícita (Término General).
  - Opción 2 usa 'b_{n-1}'. Es recursiva.
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes fórmulas es explícita?
  alternativas:
  - a_n igual a 6n menos 2
  - a_n igual a a_(n-1) más 6
  - a_1 igual a 4, a_n igual a a_(n-1) por 2
  respuesta: a_n igual a 6n menos 2
  solucion_pasos:
  - Una fórmula explícita solo usa la posición n, sin referirse a términos anteriores.
- titulo: Ejemplo 2
  enunciado: La sucesión de Fibonacci se define como a_n igual a a_(n-1) más a_(n-2). ¿Es
    explícita o recursiva?
  alternativas:
  - Recursiva
  - Explícita
  - Ninguna de las dos
  respuesta: Recursiva
  solucion_pasos:
  - La fórmula usa los dos términos anteriores para calcular el siguiente, lo que la hace
    recursiva.
- titulo: ¿La forma explícita siempre permite calcular un término sin conocer los anteriores?
  respuesta: Sí
  solucion_pasos:
  - 'Esa es su principal ventaja: basta con sustituir la posición n en la fórmula.'
- titulo: ¿Toda sucesión recursiva tiene una fórmula explícita igual de simple?
  respuesta: 'No'
  solucion_pasos:
  - Algunas, como la sucesión de Fibonacci, tienen una fórmula explícita mucho más compleja
    que su forma recursiva.
errores_frecuentes:
- Confundir el concepto de recurrencia con el de término general en preguntas de verdadero/falso.
- Intentar calcular el término cien usando una recurrencia a mano, perdiendo valioso tiempo
  en una prueba.
- Creer que una sucesión solo puede tener una de las dos formas, explícita o recursiva, y
  no ambas a la vez.
- Al pasar de la forma explícita a la recursiva, usar como diferencia el término independiente
  en vez del coeficiente de n.
- Pensar que la forma recursiva siempre es más rápida de calcular que la explícita.
afirmaciones_verdaderas:
- La formulación de diferencia entre sucesión definida por término general y por recurrencia
  mantiene la regularidad de la sucesión.
- Toda sucesión con término general lineal, de la forma a_n igual a a por n más b, se puede
  reescribir en forma recursiva sumando siempre la misma cantidad.
al_terminar_debes_poder: Resolver problemas prácticos utilizando diferencia entre sucesión
  definida por término general y por recurrencia.
