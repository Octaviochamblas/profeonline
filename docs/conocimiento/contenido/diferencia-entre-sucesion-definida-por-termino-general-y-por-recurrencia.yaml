      los 99 términos anteriores
    is_correct: true
  - text: Porque la fórmula recursiva siempre da error
    is_correct: false
  - text: Porque la fórmula explícita no usa números
    is_correct: false
  - text: Porque la recursiva es más corta
    is_correct: false
  explanation: La alternativa correcta es 'Porque permite calcular a100 en un solo
    paso sustituyendo n=100 sin necesitar los 99 términos anteriores'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a50 en los números pares, ¿cuántos pasos requirió
    la vía explícita an = 2n?
  choices:
  - text: Un solo paso de sustitución directa
    is_correct: true
  - text: 50 pasos encadenados
    is_correct: false
  - text: 100 pasos
    is_correct: false
