semantic_id: MAT.NUM.SUCESIONES_BASE.COMPARACION_EXPLICITA_RECURSIVA
resumen_inicial: 'La diferencia entre la definición por término general y por recurrencia radica en que el término general ($a_n = f(n)$) calcula cualquier elemento de forma directa sin requerir valores previos, mientras que la recurrencia ($a_n = g(a_{n-1})$) lo calcula de forma enlazada dependiente.'
explicacion_simple: |
  Existen dos formas principales de definir una misma sucesión numérica:
  - **Fórmula Explícita (Término General)**: $a_n = 3n + 1$.
    - Para saber el término $100$, sólo haces $a_{100} = 3(100) + 1 = 301$. ¡Es un **acceso directo**!
  - **Fórmula de Recurrencia**: $a_1 = 4$, $a_n = a_{n-1} + 3$.
    - Para saber el término $100$, necesitas saber el término $99$, para el cual necesitas el $98$, y así en **cadena** hasta llegar a $a_1$.
  Ambas formas generan exactamente la misma lista de números ($4, 7, 10, 13, \dots$), pero se calculan de manera completamente distinta.
explicacion_formal: |
  ### Definición formal y comparación analítica
  Dada una sucesión $(a_n)_{n \in \mathbb{N}}$, se comparan sus dos representaciones fundamentales:

  | Criterio | Formulación Explícita (Término General) | Formulación por Recurrencia |
  | :--- | :--- | :--- |
  | **Estructura** | $a_n = f(n)$ | $a_n = g(a_{n-1}, \dots, a_1)$ con $a_1 = C$ |
  | **Dependencia** | Depende exclusivamente de la **posición $n$** | Depende del **término o términos anteriores** |
  | **Complejidad de cálculo** | Directa $\mathcal{O}(1)$ para cualquier $n$ | Secuencial $\mathcal{O}(n)$ paso a paso |
  | **Uso principal** | Evaluación instantánea de términos lejanos | Modelamiento paso a paso (ej: algoritmos, crecimiento poblacional) |

  ### Conversión entre representaciones
  - **De recurrencia a explícita**: Resolver la ecuación en diferencias (ej: $a_n = a_{n-1} + d \implies a_n = a_1 + (n-1)d$).
  - **De explícita a recurrencia**: Expresar $a_n$ en términos de $a_{n-1}$ mediante manipulación algebraica (ej: $a_n = 2^n \implies a_n = 2 \cdot 2^{n-1} = 2 a_{n-1}$ con $a_1 = 2$).

  ### Síntesis didáctica
  - Explícita: $a_n = f(n) \implies$ Acceso directo a $a_n$ sin calcular $a_{n-1}$.
  - Recurrencia: $a_n = g(a_{n-1}) \implies$ Cadena encadenada desde la semilla $a_1$.
definiciones_clave: |
  - **Fórmula explícita**: Función $a_n = f(n)$ que relaciona directamente la posición ordinal $n$ con el valor $a_n$.
  - **Fórmula por recurrencia**: Ecuación $a_n = g(a_{n-1})$ que conecta un término con su antecesor inmediato.
  - **Equivalencia de representación**: Propiedad por la cual dos expresiones distintas (una explícita y una recursiva) generan exactamente la misma secuencia de términos.
propiedades_relaciones: |
  - **Eficiencia computacional**: Para $n$ muy grande (ej: $n = 1.000.000$), la fórmula explícita requiere 1 sola operación, mientras que la recurrencia requiere $1.000.000$ de iteraciones.
  - **Complementariedad**: Ciertas sucesiones (como la secuencia de Fibonacci) son más fáciles de definir por recurrencia que mediante su fórmula explícita (Fórmula de Binet).
ejemplo_guiado:
  enunciado: 'Dada la sucesión descrita de forma explícita por $a_n = 5n - 2$, halla su equivalente por recurrencia expresando $a_1$ y la relación entre $a_n$ y $a_{n-1}$. Comprueba que ambos métodos entregan $a_3 = 13$.'
  pasos:
    - 'Paso 1: Evaluamos el término inicial con la explícita: $a_1 = 5(1) - 2 = 3$. La condición inicial es $a_1 = 3$.'
    - 'Paso 2: Hallamos la diferencia consecutiva: $a_n - a_{n-1} = (5n - 2) - (5(n-1) - 2) = 5n - 2 - (5n - 7) = 5$.'
    - 'Paso 3: Escribimos la forma por recurrencia: $a_1 = 3$, $a_n = a_{n-1} + 5$.'
    - 'Paso 4: Evaluamos $a_3$ por ambos caminos: Explícita $a_3 = 5(3) - 2 = 13$. Recurrencia $a_1 = 3 \implies a_2 = 8 \implies a_3 = 13$. Ambas son **idénticas ($a_3 = 13$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la fórmula explícita $a_n = f(n)$ es más eficiente que una fórmula por recurrencia para calcular el término de la posición $n=1.000$?'
    choices:
      - {text: 'Porque permite calcular el valor de $a_{1000}$ en un solo paso sustituyendo $n=1000$, sin calcular los 999 términos anteriores', is_correct: true}
      - {text: 'Porque la fórmula por recurrencia sólo sirve para calcular los primeros 5 términos', is_correct: false}
      - {text: 'Porque la fórmula explícita entrega números enteros mientras que la recurrencia entrega decimales', is_correct: false}
      - {text: 'Porque la recurrencia requiere resolver ecuaciones cuadráticas obligatoriamente', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque permite calcular el valor de $a_{1000}$ en un solo paso sustituyendo $n=1000$, sin calcular los 999 términos anteriores''. Acceso directo vs en cadena.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una sucesión está definida por $a_1 = 5$ y $a_n = 3 a_{n-1}$, ¿cuál es su expresión explícita equivalente?'
    choices:
      - {text: '$a_n = 5 \cdot 3^{n-1}$, pues es una progresión geométrica de primer término 5 y razón 3', is_correct: true}
      - {text: '$a_n = 3n + 5$, sumando 3 veces n', is_correct: false}
      - {text: '$a_n = 5^n$, elevando 5 a la n', is_correct: false}
      - {text: '$a_n = 15n$, multiplicando ambos números', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_n = 5 \cdot 3^{n-1}$, pues es una progresión geométrica de primer término 5 y razón 3''. $a_1=5, a_2=15, a_3=45 \implies 5 \cdot 3^{n-1}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si la definición dada utiliza la posición $n$ (explícita) o el término anterior $a_{n-1}$ (recurrencia).'
  - 'Paso 2: Para calcular términos con la explícita, reemplazar $n$ directamente por la posición deseada.'
  - 'Paso 3: Para calcular términos con la recurrencia, arrancar con $a_1$ e iterar secuencialmente paso a paso.'
  - 'Paso 4: Para convertir de una forma a otra, identificar si se trata de un patrón aditivo (suma constante) o multiplicativo (razón constante).'
errores_correccion: |
  - **Error 1:** Creer que una formulación por recurrencia y una explícita no pueden representar la misma sucesión. **Cómo corregirlo:** Una misma sucesión numérica **puede representarse perfectamente mediante ambas formas**.
  - **Error 2:** Usar la fórmula de recurrencia como si fuera un acceso directo sin tener la semilla $a_1$. **Cómo corregirlo:** La recurrencia **exige siempre la semilla $a_1$** para poder encadenar los cálculos.
ejemplos:
  - titulo: 'Formas equivalentes para pares'
    enunciado: '¿La explícita $a_n = 2n$ y la recurrencia ($a_1=2, a_n = a_{n-1}+2$) generan la misma lista $2, 4, 6, 8, \dots$?'
    alternativas:
      - 'Sí, representan la misma sucesión'
      - 'No, la recurrencia da otros números'
      - 'No, la explícita empieza en 0'
    respuesta: 'Sí, representan la misma sucesión'
    solucion_pasos:
      - '1. Explícita: $a_1=2, a_2=4, a_3=6$.'
      - '2. Recurrencia: $a_1=2, a_2=2+2=4, a_3=4+2=6$. Coinciden.'
  - titulo: 'Formas equivalentes para potencias de 2'
    enunciado: '¿La explícita $a_n = 2^n$ equivale a $a_1=2, a_n = 2a_{n-1}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas generan la secuencia $2, 4, 8, 16, 32, \dots$.'
  - titulo: 'Cálculo de a100'
    enunciado: 'Para hallar $a_{100}$, ¿es más rápido usar la explícita que la recurrencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La explícita realiza 1 sola operación direct de sustitución.'
  - titulo: 'Generación de impares'
    enunciado: '¿$a_n = 2n - 1$ es equivalente a $a_1 = 1, a_n = a_{n-1} + 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas generan $1, 3, 5, 7, 9, \dots$.'
errores_frecuentes:
  - 'Considerar que las expresiones por recurrencia y explícitas son mutuamente excluyentes y no pueden describir la misma sucesión.'
  - 'Intentar calcular la recurrencia sustituyendo directamente el subíndice $n$ sin pasar por el término anterior $a_{n-1}$.'
  - 'La velocidad de cálculo del término $a_{1.000}$ es idéntica en el modelo explícito y en el recursivo.'
  - 'Una relación de recurrencia define unívocamente una sucesión sin necesidad de especificar el valor inicial $a_1$.'
  - 'Evaluar los términos de una relación de recurrencia lineal requiere conocimientos de cálculo avanzado.'
afirmaciones_verdaderas:
  - 'La fórmula explícita $a_n = f(n)$ calcula cualquier término en función de su posición $n$, mientras que la recurrencia $a_n = g(a_{n-1})$ depende del término anterior.'
  - 'Una misma sucesión numérica puede definirse tanto mediante una fórmula explícita como por una relación de recurrencia con condición inicial.'
al_terminar_debes_poder: 'Diferenciar entre las representaciones explícita ($a_n = f(n)$) y por recurrencia ($a_n = g(a_{n-1})$) de una sucesión numérica.'
