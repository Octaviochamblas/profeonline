resumen_inicial: 'La fórmula del término general de una progresión aritmética $a_n$
  permite calcular cualquier posición en función del primer término $a_1$ y la diferencia
  común $d$: $a_n = a_1 + (n - 1) \cdot d$.'
explicacion_simple: 'Para encontrar cualquier número de una progresión aritmética
  sin tener que sumar paso a paso, usamos la fórmula: al primer número le sumamos
  la diferencia multiplicada por la cantidad de pasos que faltan, que es $(n - 1)$.'
explicacion_formal: 'Para una P.A. con primer término $a_1$ y diferencia $d$, la **Fórmula
  del Término General $a_n$** es:


  $$a_n = a_1 + (n - 1) \cdot d$$


  **Fórmula generalizada respecto a la posición $m$:**

  $$a_n = a_m + (n - m) \cdot d$$'
definiciones_clave: '- **Término general P.A. $a_n$**: Expresión $a_n = a_1 + (n-1)d$.'
propiedades_relaciones: '- **Estructura de función afín**: $a_n = d \cdot n + (a_1
  - d)$ representa una función afín discreta de pendiente $d$.'
ejemplo_guiado:
  enunciado: En una P.A. con primer término $a_1 = 5$ y diferencia $d = 3$, halle
    el término de posición $n = 20$.
  pasos:
  - 'Paso 1: Escribir la fórmula del término general: $a_{20} = a_1 + (20 - 1) \cdot
    d$.'
  - 'Paso 2: Sustituir los datos: $a_{20} = 5 + 19 \cdot 3$.'
  - 'Paso 3: Calcular el producto y la suma: $a_{20} = 5 + 57 = 62$.'
  - 'Conclusión: El vigésimo término es $a_{20} = 62$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula del término general an en función de a1 y la diferencia
    d?
  choices:
  - text: an = a1 + (n - 1) · d
    is_correct: true
  - text: an = a1 · d^(n-1)
    is_correct: false
  - text: an = a1 + n · d
    is_correct: false
  - text: an = (a1 + d) / n
    is_correct: false
  explanation: La alternativa correcta es 'an = a1 + (n - 1) · d'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a1 = 5 y d = 3, ¿cuál fue el valor del vigésimo
    término a20?
  choices:
  - text: '62'
    is_correct: true
  - text: '65'
    is_correct: false
  - text: '57'
    is_correct: false
  - text: '60'
    is_correct: false
  explanation: La alternativa correcta es '62'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de aplicar la fórmula del término
  general $a_n = a_1 + (n - 1) \cdot d$ para hallar cualquier posición.
semantic_id: MAT.NUM.PROG_ARITMETICA.TERMINO_GENERAL
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.TERMINO_GENERAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
estado: publicado
