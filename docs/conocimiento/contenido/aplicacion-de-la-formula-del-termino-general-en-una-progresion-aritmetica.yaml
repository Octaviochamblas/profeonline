procedimiento:
- 'Paso 1: Extrae de la serie el valor de a1 (el primer número).'
- 'Paso 2: Calcula la diferencia ''d'' restando el segundo menos el primero.'
- 'Paso 3: Identifica la posición ''n'' que te pide el problema.'
- 'Paso 4: Reemplaza estos tres datos en la fórmula $a_n = a_1 + (n-1)d$ y resuelve, recordando
  multiplicar antes de sumar.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en aplicación de la fórmula del término general en una progresión aritmética.
ejemplos:
- titulo: Retrocediendo en el tiempo
  enunciado: 'Halla el término 15 de la P.A: 100, 95, 90...'
  solucion_pasos:
  - a1 = 100.
  - d = 95 - 100 = -5.
  - n = 15.
  - 'Fórmula: a15 = 100 + (15 - 1) * (-5)'
  - a15 = 100 + (14) * (-5)
  - a15 = 100 - 70 = 30.
- titulo: Ejemplo 1
  enunciado: Si a_1 es 2 y d es 5, ¿cuánto vale a_6?
  alternativas:
  - '27'
  - '25'
  - '30'
  respuesta: '27'
  solucion_pasos:
  - 2 más (6 menos 1) por 5 es igual a 2 más 25, o sea 27.
- titulo: Ejemplo 2
  enunciado: En la progresión 20, 17, 14, ¿cuál es a_8?
  alternativas:
  - '-1'
  - '1'
  - '-4'
  respuesta: '-1'
  solucion_pasos:
  - a_1 es 20 y d es -3; 20 más (8 menos 1) por (-3) es igual a 20 menos 21, o sea -1.
- titulo: ¿Se puede usar la fórmula del término general sin conocer d?
  respuesta: 'No'
  solucion_pasos:
  - d es uno de los tres datos indispensables de la fórmula, junto a a_1 y n.
- titulo: ¿El resultado de la fórmula corresponde siempre a la posición n solicitada?
  respuesta: Sí
  solucion_pasos:
  - 'Esa es justamente la utilidad de la fórmula: entrega el valor exacto del término en la
    posición pedida.'
errores_frecuentes:
- 'Olvidar restar 1 a la ''n'' en el paréntesis. (Ej: multiplicar por 20 pasos en lugar de
  19 para llegar a la posición 20).'
- Sumar $a_1 + (n-1)$ antes de multiplicar por la diferencia 'd' (Error grave de Papomudas).
- Olvidar restar 1 a n dentro del paréntesis de la fórmula.
- Sumar a_1 más (n menos 1) antes de multiplicar por d, sin respetar el orden de las operaciones.
- Usar como d la diferencia entre términos que no son consecutivos.
afirmaciones_verdaderas:
- La formulación de aplicación de la fórmula del término general en una progresión aritmética
  mantiene la regularidad de la sucesión.
- La fórmula del término general de una progresión aritmética permite calcular cualquier término
  conociendo solo a_1, d y n.
al_terminar_debes_poder: Resolver problemas prácticos utilizando aplicación de la fórmula
