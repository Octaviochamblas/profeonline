procedimiento:
- 'Paso 1: Extrae de la serie el valor de a1 (el primer número).'
- 'Paso 2: Calcula la diferencia ''d'' restando el segundo menos el primero.'
- 'Paso 3: Identifica la posición ''n'' que te pide el problema.'
- 'Paso 4: Reemplaza estos tres datos en la fórmula $a_n = a_1 + (n-1)d$ y resuelve,
  recordando multiplicar antes de sumar.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en aplicación de la fórmula del término general en una progresión aritmética.
ejemplos:
- titulo: Retrocediendo en el tiempo
  enunciado: 'Halla el término 15 de la P.A: 100, 95, 90...'
  solucion_pasos:
  - a1 = 100.
  - d = 95 - 100 = -5.
  - n = 15.
  - 'Fórmula: a15 = 100 + (15 - 1) * (-5)'
  - a15 = 100 + (14) * (-5)
  - a15 = 100 - 70 = 30.
errores_frecuentes:
- 'Olvidar restar 1 a la ''n'' en el paréntesis. (Ej: multiplicar por 20 pasos en
  lugar de 19 para llegar a la posición 20).'
- Sumar $a_1 + (n-1)$ antes de multiplicar por la diferencia 'd' (Error grave de Papomudas).
afirmaciones_verdaderas:
- La formulación de aplicación de la fórmula del término general en una progresión
  aritmética mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando aplicación de la
  fórmula del término general en una progresión aritmética.
