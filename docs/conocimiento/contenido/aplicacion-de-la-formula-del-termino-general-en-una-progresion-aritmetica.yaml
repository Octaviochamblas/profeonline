semantic_id: MAT.NUM.PROG_ARITMETICA.TERMINO_GENERAL
resumen_inicial: 'Aplicación de la fórmula del término general en una progresión aritmética:
  concepto y desarrollo dentro de Progresión aritmética.'
explicacion_simple: 'Si tu sueldo sube 10.000 pesos cada mes, ¿cuánto ganarás en el
  mes 48? Contar con los dedos no sirve aquí. Es la hora de usar el cañón pesado:
  la fórmula de la Progresión Aritmética.'
explicacion_formal: 'Anatomía de la fórmula: **$a_n = a_1 + (n - 1) \cdot d$**

  - **$a_n$**: Es el número que quieres descubrir (el ''futuro'').

  - **$a_1$**: Es tu punto de partida. Desde dónde empiezas a contar.

  - **$d$**: Es el tamaño de cada paso que das.

  - **$(n - 1)$**: Es la cantidad de pasos que debes dar. ¿Por qué menos uno? Porque
  ya estás parado en el primer término ($a_1$), así que para llegar a la posición
  10, solo debes dar 9 pasos.


  Ejemplo: Tienes la progresión $5, 8, 11...$ y te piden el término en la posición
  20.

  - $a_1 = 5$

  - $d = 3$ (porque $8-5=3$)

  - $n = 20$

  Fórmula: $a_{20} = 5 + (20 - 1) \cdot 3 \rightarrow 5 + (19) \cdot 3 \rightarrow
  5 + 57 = 62$. ¡Directo al blanco!'
definiciones_clave: '- **Aplicación de la fórmula del término general en una progresión
