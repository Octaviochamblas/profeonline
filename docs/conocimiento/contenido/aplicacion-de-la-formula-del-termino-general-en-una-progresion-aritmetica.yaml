semantic_id: MAT.NUM.PROG_ARITMETICA.TERMINO_GENERAL
resumen_inicial: 'La fórmula del término general de una progresión aritmética es $a_n = a_1 + (n - 1)d$, la cual calcula directamente el valor del término en la posición $n$ conociendo únicamente el primer término $a_1$ y la diferencia común $d$.'
explicacion_simple: |
  Para hallar cualquier término de una progresión aritmética (por ejemplo, el término $100$) sin tener que sumar uno por uno:
  - Partes desde el **primer término ($a_1$)**.
  - Como para llegar a la casilla $n$ debes dar **$(n - 1)$ saltos**, multiplicas la diferencia $d$ por $(n - 1)$.
  - La fórmula es:
    $$a_n = a_1 + (n - 1) \cdot d$$
  Por ejemplo, si $a_1 = 10$ y $d = 3$, para saber el término $a_{50}$:
  $a_{50} = 10 + (50 - 1) \cdot 3 = 10 + 49 \cdot 3 = 10 + 147 = 157$.
explicacion_formal: |
  ### Definición formal
  El **término $n$-ésimo de una progresión aritmética** de primer término $a_1 \in \mathbb{R}$ y diferencia común $d \in \mathbb{R}$ viene dado por la expresión explícita:
  $$a_n = a_1 + (n - 1)d \quad (\forall n \in \mathbb{N})$$

  ### Demostración inductiva por desarrollo lineal
  - $a_1 = a_1 + 0 \cdot d$
  - $a_2 = a_1 + 1 \cdot d$
  - $a_3 = a_2 + d = (a_1 + d) + d = a_1 + 2 \cdot d$
  - $\dots$
  - $a_n = a_1 + (n - 1)d$

  ### Expresión equivalente en forma afín
  Al distribuir la constante $d$:
  $$a_n = d \cdot n + (a_1 - d)$$
  donde $d$ actúa como la pendiente $m$ y $(a_1 - d)$ actúa como el coeficiente de posición $c$.

  ### Síntesis didáctica
  - Ecuación canónica: $a_n = a_1 + (n - 1)d$.
  - Ecuación reducida: $a_n = dn + (a_1 - d)$.
definiciones_clave: |
  - **Fórmula del término general de P.A.**: $a_n = a_1 + (n - 1)d$.
  - **Número de saltos o diferencias ($(n - 1)$)**: Cantidad de veces que se debe sumar la diferencia $d$ para avanzar desde $a_1$ hasta $a_n$.
  - **Representación afín ($dn + c$)**: Forma simplificada de la fórmula tras aplicar la propiedad distributiva.
propiedades_relaciones: |
  - **Linealidad respecto a $n$**: El valor del término $a_n$ crece o decrece a una tasa constante de $d$ unidades por cada incremento unitario en la posición $n$.
  - **Generalización entre posiciones distantes**: La fórmula general entre dos posiciones cualesquiera es $a_n = a_k + (n - k)d$.
ejemplo_guiado:
  enunciado: 'En la progresión aritmética $4, 9, 14, 19, \dots$, determina la fórmula de su término general $a_n$ y calcula el valor del término en la posición $n=30$.'
  pasos:
    - 'Paso 1: Identificamos el primer término $a_1 = 4$ y la diferencia $d = 9 - 4 = 5$.'
    - 'Paso 2: Sustituimos $a_1=4$ y $d=5$ en la fórmula general: $a_n = 4 + (n - 1) \cdot 5$.'
    - 'Paso 3: Simplificamos algebraicamente: $a_n = 4 + 5n - 5 \implies a_n = 5n - 1$.'
    - 'Paso 4: Evaluamos para $n=30$: $a_{30} = 5(30) - 1 = 150 - 1 = 149$. El trigésimo término es **$149$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la fórmula del término general de una P.A. multiplica la diferencia $d$ por $(n - 1)$ en lugar de multiplicarla por $n$?'
    choices:
      - {text: 'Porque para llegar a la posición $n$ partiendo desde la posición 1 se dan exactamente $(n - 1)$ saltos de diferencia', is_correct: true}
      - {text: 'Porque se debe restar 1 al resultado por regla matemática', is_correct: false}
      - {text: 'Porque el primer término siempre es igual a 0', is_correct: false}
      - {text: 'Porque la variable $n$ debe ser siempre un número impar', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque para llegar a la posición $n$ partiendo desde la posición 1 se dan exactamente $(n - 1)$ saltos de diferencia''. Desde $a_1$ hasta $a_n$ hay $n-1$ pasos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una progresión aritmética $a_1 = 12$ y $d = -2$, ¿cuál es el valor del décimo término ($a_{10}$)?'
    choices:
      - {text: '$a_{10} = -6$, calculando $12 + (10 - 1)(-2) = 12 + 9(-2) = 12 - 18 = -6$', is_correct: true}
      - {text: '$a_{10} = -8$, multiplicando por 10 en vez de 9', is_correct: false}
      - {text: '$a_{10} = 30$, sumando 18 en lugar de restar', is_correct: false}
      - {text: '$a_{10} = 0$, calculando $12 - 12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_{10} = -6$, calculando $12 + (10 - 1)(-2) = 12 + 9(-2) = 12 - 18 = -6$''. $12 + 9(-2) = -6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$ y la diferencia común $d$.'
  - 'Paso 2: Escribir la fórmula canónica $a_n = a_1 + (n - 1)d$.'
  - 'Paso 3: Sustituir la posición $n$ requerida y restar $1$ para obtener $(n - 1)$.'
  - 'Paso 4: Multiplicar $(n - 1) \cdot d$ y sumar $a_1$ para obtener la respuesta final.'
errores_correccion: |
  - **Error 1:** Multiplicar la diferencia $d$ por $n$ en lugar de $(n-1)$ en la fórmula canónica (ej: hacer $a_n = a_1 + n \cdot d$). **Cómo corregirlo:** La fórmula exige **multiplicar por $(n-1)$**: $a_n = a_1 + (n-1)d$.
  - **Error 2:** Multiplicar $a_1 + (n-1)$ antes de multiplicar por $d$ violando la jerarquía de operaciones. **Cómo corregirlo:** Primero se resuelve el producto **$(n-1) \cdot d$**, y al resultado final se le suma $a_1$.
ejemplos:
  - titulo: 'Cálculo de a20 en P.A. básica'
    enunciado: 'Para $a_1 = 5$ y $d = 3$, ¿el término $a_{20}$ es $62$?'
    alternativas:
      - 'Sí, pues $5 + 19 \cdot 3 = 5 + 57 = 62$'
      - 'No, es $65$'
      - 'No, es $60$'
    respuesta: 'Sí, pues $5 + 19 \cdot 3 = 5 + 57 = 62$'
    solucion_pasos:
      - '1. $a_{20} = 5 + (20 - 1) \cdot 3$.'
      - '2. $a_{20} = 5 + 19 \cdot 3 = 5 + 57 = 62$.'
  - titulo: 'Cálculo de a15 con diferencia negativa'
    enunciado: 'Para $a_1 = 50$ y $d = -4$, ¿el término $a_{15}$ es $50 + 14(-4) = 50 - 56 = -6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $50 + 14(-4) = -6$.'
  - titulo: 'Forma afín reducida'
    enunciado: 'Para $a_1 = 7$ y $d = 2$, ¿la fórmula reducida es $a_n = 2n + 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_n = 7 + (n-1)2 = 7 + 2n - 2 = 2n + 5$.'
  - titulo: 'Término a100'
    enunciado: 'Para $a_1 = 1$ y $d = 1$ (números naturales), ¿$a_{100} = 100$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_{100} = 1 + 99(1) = 100$.'
errores_frecuentes:
  - 'Multiplicar la diferencia $d$ por la posición $n$ sin restar la unidad en la fórmula canónica.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Sumar el primer término $a_1$ a la posición $n$ antes de efectuar la multiplicación por la diferencia $d$.'
  - 'El producto $(n-1)d$ con diferencia negativa entrega siempre un resultado positivo.'
afirmaciones_verdaderas:
  - 'La fórmula del término general de una progresión aritmética es $a_n = a_1 + (n - 1)d$.'
  - 'La expresión reducida del término general de una P.A. es una función de primer grado $a_n = dn + c$.'
al_terminar_debes_poder: 'Aplicar la fórmula $a_n = a_1 + (n - 1)d$ para hallar cualquier término de una progresión aritmética.'
