semantic_id: MAT.NUM.PROG_ARITMETICA.TERMINO_GENERAL
resumen_inicial: 'La fórmula del término general de una progresión aritmética $a_n = a_1 + (n - 1)d$ calcula directamente el término en la posición $n$ sumando $n - 1$ veces la diferencia común $d$ a partir del primer término $a_1$.'
explicacion_simple: |
  Para hallar cualquier número de una progresión aritmética sin sumar uno por uno:
  - Usamos la **fórmula del término general**:
    $$a_n = a_1 + (n - 1) \cdot d$$
  - ¿Por qué $(n - 1)$? Porque para llegar al primer término das $0$ pasos, para el segundo das $1$ paso, para el tercero das $2$ pasos, y para el término $n$ das **$(n - 1)$ pasos**.
  - Por ejemplo, si $a_1 = 3$ y $d = 4$, el término $20$ es:
    $$a_{20} = 3 + (20 - 1) \cdot 4 = 3 + 19 \cdot 4 = 3 + 76 = 79$$

  ![Aplicación de la fórmula del término general](/static/img/nodos/aplicacion-de-la-formula-del-termino-general-en-una-progresion-aritmetica-intro.svg)
explicacion_formal: |
  ### Demostración inductiva
  Por definición de PA:
  - $a_1 = a_1$
  - $a_2 = a_1 + d$
  - $a_3 = a_2 + d = (a_1 + d) + d = a_1 + 2d$
  - $a_4 = a_3 + d = (a_1 + 2d) + d = a_1 + 3d$
  - En general, para todo $n \in \mathbb{N}$:
    $$a_n = a_1 + (n - 1)d$$

  ### Forma Funcional Canónica (Modelo Afín)
  Desarrollando algebraicamente los términos:
  $$a_n = d \cdot n + (a_1 - d)$$
  - Coeficiente de $n$: La pendiente de crecimiento ($d$).
  - Término independiente: El valor extrapolo en $n=0$ ($a_0 = a_1 - d$).

  ### Síntesis didáctica
  - Ecuación canónica: $a_n = a_1 + (n-1)d$.
  - Sustitución directa: Evaluación en $O(1)$ para cualquier posición $n$.
definiciones_clave: |
  - **Fórmula del término general**: Ecuación explícita que calcula el valor de $a_n$ en función de $a_1$, $n$ y $d$.
  - **Número de incrementos ($(n-1)$)**: Cantidad exacta de pasos de tamaño $d$ necesarios para desplazarse desde $a_1$ hasta $a_n$.
  - **Intersección virtual ($a_1 - d$)**: Valor de la función lineal cuando $n=0$.
propiedades_relaciones: |
  - **Extrapolación directa**: Permite calcular términos arbitrariamente lejanos (ej: $a_{1000}$) sin iteraciones.
  - **Conservación de linealidad**: La relación entre el índice $n$ y el valor $a_n$ es estrictamente de primer grado.
ejemplo_guiado:
  enunciado: 'En la progresión aritmética $(12, 17, 22, 27, \dots)$, determina el término general $a_n$ y calcula el valor del término en la posición $n = 35$.'
  imagen: '/static/img/nodos/aplicacion-de-la-formula-del-termino-general-en-una-progresion-aritmetica-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el primer término: $a_1 = 12$.'
    - 'Paso 2: Calculamos la diferencia común: $d = 17 - 12 = 5$.'
    - 'Paso 3: Construimos el término general: $a_n = 12 + (n - 1) \cdot 5 = 12 + 5n - 5 = 5n + 7$.'
    - 'Paso 4: Calculamos el término 35: $a_{35} = 5(35) + 7 = 175 + 7 = **182$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la fórmula del término general de una PA multiplica a la diferencia $d$ por $(n - 1)$ en lugar de por $n$?'
    choices:
      - {text: 'Porque el primer término $a_1$ ya está establecido y se requieren solo $(n-1)$ pasos adicionales para alcanzar la posición $n$', is_correct: true}
      - {text: 'Porque las matemáticas exigen siempre restar 1 a cualquier variable', is_correct: false}
      - {text: 'Porque la primera posición siempre vale cero', is_correct: false}
      - {text: 'Para evitar números pares', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el primer término $a_1$ ya está establecido y se requieren solo $(n-1)$ pasos adicionales para alcanzar la posición $n$''. Para pasar de la posición 1 a la posición $n$ se dan exactamente $(n-1)$ saltos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una PA tiene $a_1 = 50$ y $d = -4$, ¿cuál es el valor del término $a_{11}$?'
    choices:
      - {text: '$10$, calculando $50 + (11 - 1) \cdot (-4) = 50 - 40 = 10$', is_correct: true}
      - {text: '$6$, multiplicando $50 - 44 = 6$', is_correct: false}
      - {text: '$90$, sumando 40 en lugar de restar', is_correct: false}
      - {text: '$14$, calculando con 9 pasos', is_correct: false}
    explanation: 'La alternativa correcta es ''$10$, calculando $50 + (11 - 1) \cdot (-4) = 50 - 40 = 10$''. Con 10 pasos de $-4$, se resta 40 a 50 obteniendo 10.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Obtener el primer término $a_1$ y la diferencia común $d$.'
  - 'Paso 2: Escribir la fórmula general: $a_n = a_1 + (n - 1)d$.'
  - 'Paso 3: Sustituir el índice $n$ deseado y resolver primero la resta dentro del paréntesis $(n-1)$.'
  - 'Paso 4: Multiplicar por $d$ (respetando la regla de los signos) y sumar algebraicamente con $a_1$.'
errores_correccion: |
  - **Error 1:** Multiplicar $d$ directamente por $n$ (usar erróneamente $a_n = a_1 + n \cdot d$). **Cómo corregirlo:** Para el término $n$ se dan exactamente **$(n - 1)$ pasos**, no $n$.
  - **Error 2:** Olvidar que la multiplicación tiene prioridad sobre la suma al operar $a_1 + (n-1)d$. **Cómo corregirlo:** Primero se calcula el producto **$(n-1) \cdot d$** y al final se suma $a_1$.
ejemplos:
  - titulo: 'Cálculo de término en posición lejana'
    enunciado: 'Para $a_1 = 4$ y $d = 3$, ¿cuál es el valor de $a_{50}$?'
    alternativas:
      - '$151$'
      - '$154$'
      - '$150$'
    respuesta: '$151$'
    solucion_pasos:
      - '1. $a_{50} = 4 + (50 - 1) \cdot 3 = 4 + 49 \cdot 3 = 4 + 147 = 151$.'
  - titulo: 'Término general con diferencia negativa'
    enunciado: 'Para $a_1 = 25$ y $d = -2$, ¿cuál es el término $a_{10}$?'
    alternativas:
      - '$7$'
      - '$5$'
      - '$9$'
    respuesta: '$7$'
    solucion_pasos:
      - '1. $a_{10} = 25 + 9(-2) = 25 - 18 = 7$.'
  - titulo: 'Fórmula simplificada'
    enunciado: '¿La fórmula $a_n = 7 + (n-1)5$ se simplifica a la forma $a_n = 5n + 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $7 + 5n - 5 = 5n + 2$.'
  - titulo: 'PA con primer término fraccionario'
    enunciado: '¿Para $a_1 = \frac{1}{2}$ y $d = \frac{1}{2}$, el término $a_4$ es igual a $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_4 = 1/2 + 3(1/2) = 4/2 = 2$.'
errores_frecuentes:
  - 'La fórmula del término general de una PA se calcula multiplicando $a_1 + n \cdot d$ sin restar uno al índice.'
  - 'En la fórmula $a_n = a_1 + (n-1)d$, se suma $a_1 + n$ antes de multiplicar por la diferencia $d$.'
  - 'El término general de una progresión aritmética siempre tiene exponente cuadrático en la variable $n$.'
  - 'Al aplicar una diferencia común negativa, se ignora la regla de los signos convirtiendo la resta en suma.'
  - 'El primer término $a_1$ se obtiene evaluando la fórmula con $n=0$ en lugar de $n=1$.'
afirmaciones_verdaderas:
  - 'El término general de toda progresión aritmética es $a_n = a_1 + (n - 1)d$, donde $(n-1)$ representa el número de diferencias sumadas.'
  - 'La forma funcional $a_n = d \cdot n + (a_1 - d)$ expresa a la progresión aritmética como una función lineal discreta.'
