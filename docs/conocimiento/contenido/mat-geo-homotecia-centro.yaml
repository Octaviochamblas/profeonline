semantic_id: MAT.GEO.HOMOTECIA.CENTRO
resumen_inicial: 'Identificación del centro de homotecia: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Dada una figura y su imagen homotética, es posible encontrar el
  centro de la transformación que las relaciona, incluso si no se indica explícitamente.
explicacion_formal: '![Identificación del centro de homotecia](/static/img/geometria/congruencia-semejanza/homotecia-centro.svg)


  ### Definición formal


  El centro de homotecia $O$ es el punto de intersección de las rectas $AA''$, $BB''$,
  $CC''$, que unen cada vértice de la figura original con su correspondiente en la
  figura imagen.


  ### Desarrollo didáctico


  Para encontrar el centro de una homotecia entre dos figuras semejantes conocidas,
  basta con trazar al menos dos de estas rectas (por ejemplo, $AA''$ y $BB''$); su
  punto de intersección es el centro $O$ buscado.'
definiciones_clave: '- **Identificación del centro de homotecia**: Elemento o propiedad
  fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del centro de homotecia.'
ejemplo_guiado:
  enunciado: En la aplicación de identificación del centro de homotecia, se establece
    una razón $k = 2.4$ entre dos figuras homólogas de longitud original $L = 50\text{
    cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de identificación del centro de homotecia.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.4 \cdot 50$.'
  - Concluir que la medida obtenida en identificación del centro de homotecia es $L'
    = 120.0\text{ cm}$.
