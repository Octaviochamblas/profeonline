    al fundamento conceptual de identificación del centro de homotecia.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver un problema numérico sobre identificación del centro de homotecia,
    ¿qué paso operativo es esencial?
  choices:
  - text: Sustituir adecuadamente los valores conocidos en la fórmula de identificación
      del centro de homotecia para obtener el resultado
    is_correct: true
  - text: Reemplazar los datos por ceros para simplificar el cálculo
    is_correct: false
  - text: Sumar los lados sin verificar si forman una figura válida
    is_correct: false
  - text: Dividir el resultado entre 100 sin justificación matemática
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir adecuadamente los valores conocidos
    en la fórmula de identificación del centro de homotecia para obtener el resultado.
    Procedimiento estándar de resolución geométrica.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica al menos dos pares de puntos correspondientes entre la figura
  original y su imagen.'
- 'Paso 2: Traza las rectas que unen cada punto con su correspondiente imagen.'
- 'Paso 3: El punto donde se cortan esas rectas es el centro de homotecia.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del centro de homotecia.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del centro de homotecia para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación del centro de homotecia.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del centro de homotecia
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación del centro de homotecia.
- titulo: ¿Se cumple siempre la propiedad principal de identificación del centro de
    homotecia en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del centro de homotecia asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del centro de homotecia.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del centro de homotecia.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del centro de homotecia.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del centro de homotecia.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de identificación
  del centro de homotecia en problemas geométricos.
