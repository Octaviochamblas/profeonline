semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_ACUTANGULO
resumen_inicial: 'Ubicación interior del circuncentro en un triángulo acutángulo:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: La posición del circuncentro respecto al triángulo depende del
  tipo de triángulo; en el caso acutángulo, cae siempre dentro.
explicacion_formal: '![Circuncentro interior en triángulo acutángulo](/static/img/geometria/elementos-secundarios/simetral-circuncentro-circuncentro-acutangulo.svg)


  ### Definición formal


  Si los tres ángulos interiores de un triángulo son agudos, el circuncentro O se
  ubica en el interior de la región triangular.


  ### Desarrollo didáctico


  En un triángulo acutángulo, las tres simetrales se cruzan dentro de la figura, a
  diferencia de lo que ocurre en triángulos obtusángulos.'
