semantic_id: MAT.NUM.APROXIMACIONES.APROXIMACION_EXCESO
resumen_inicial: Una aproximación por exceso (o por cota superior) es un valor mayor o igual al número real original obtenido al sumar una unidad al último orden decimal retenido.
explicacion_simple: '![Aproximación por exceso](/static/img/nodos/aproximacion-por-exceso-intro.svg)


  Aproximar por exceso a un orden decimal determinado significa encontrar un número con la precisión solicitada que sea mayor o igual al número original. Para números positivos, si existen cifras decimales descartadas mayores que cero, se suma una unidad ($+1$) a la última cifra retenida.'
explicacion_formal: 'Dado un número real $x \in \mathbb{R}^+$ y un orden de aproximación $k \in \mathbb{N}_0$, la **Aproximación por Exceso a $k$ decimales** $x_{\text{exc}}$ se define formalmente mediante:


  $$x_{\text{exc}} = \frac{\lceil x \cdot 10^k \rceil}{10^k}$$


  **Desglose formal de la fórmula:**

  - **$\lceil u \rceil$:** Función techo, que devuelve el menor entero mayor o igual a $u$.

  - **Cota superior estricta:** Satisface la desigualdad fundamental $x \le x_{\text{exc}} < x + 10^{-k}$.

  - **Incremento de orden:** Si $x$ no es múltiplo exacto de $10^{-k}$, entonces $x_{\text{exc}} = x_{\text{def}} + 10^{-k}$.


  > **Complemento didáctico:** El valor real $x$ queda encajonado estrictamente entre sus dos cotas: $x_{\text{def}} \le x \le x_{\text{exc}}$.'
definiciones_clave: '- **Aproximación por exceso**: Valor con precisión $10^{-k}$ que sobreestima o iguala al valor original ($x_{\text{exc}} \ge x$).

  - **Cota superior decimal**: Menor múltiplo de $10^{-k}$ que es mayor o igual a $x$.

  - **Intervalo de encajonamiento**: $[x_{\text{def}}, x_{\text{exc}}]$ de longitud $10^{-k}$ que contiene al número real.'
propiedades_relaciones: '- **Monotonía superior**: Para todo $x$, $x \le x_{\text{exc}}$.

  - **Longitud de intervalo**: $x_{\text{exc}} - x_{\text{def}} = 10^{-k}$ (cuando $x \neq x_{\text{def}}$).

  - **Error por exceso**: $E = x_{\text{exc}} - x \in [0, 10^{-k})$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de aproximación por exceso](/static/img/nodos/aproximacion-por-exceso-ejemplos.svg)


    Aproxime por exceso el número $2,314$ a la décima y a la centésima.'
  pasos:
  - 'Paso 1: A la décima ($k=1$): La décima es $3$, y existen decimales posteriores no nulos ($0,014 > 0$). Sumar $+1$ a la décima: $3 + 1 = 4 \implies 2,4$.'
  - 'Paso 2: Comprobar la cota superior: $2,4 \ge 2,314$ (correcto).'
  - 'Paso 3: A la centésima ($k=2$): La centésima es $1$, y existe la milésima $4 > 0$. Sumar $+1$ a la centésima: $1 + 1 = 2 \implies 2,32$.'
  - 'Paso 4: Comprobar la cota superior: $2,32 \ge 2,314$ (correcto).'
  - 'Conclusión: A la décima es $2,4$ y a la centésima es $2,32$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con la última cifra retenida al aproximar por exceso si se descartan cifras no nulas?
  choices:
  - text: Se le suma una unidad (+1)
    is_correct: true
  - text: Se mantiene exactamente igual
    is_correct: false
  - text: Se resta una unidad (-1)
    is_correct: false
  - text: Se transforma siempre en cero
    is_correct: false
  explanation: La alternativa correcta es 'Se le suma una unidad (+1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $2,314$, ¿cuál fue la aproximación por exceso a la décima?
  choices:
  - text: $2,4$
    is_correct: true
  - text: $2,3$
    is_correct: false
  - text: $2,5$
    is_correct: false
  - text: $3,0$
    is_correct: false
  explanation: La alternativa correcta es '$2,4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la posición decimal requerida ($k$ lugares tras la coma).'
- 'Paso 2: Observar si existen cifras no nulas después de dicha posición.'
- 'Paso 3: Si existen cifras no nulas descartadas, sumar $1$ a la cifra de la posición $k$ (propagando reservas si es un 9); si no hay cifras descartadas, dejar el número inalterado.'
errores_correccion: '- **Error 1: Dejar la cifra igual si la siguiente es menor a 5.** **Cómo corregirlo:** En exceso se suma $+1$ SIEMPRE que haya cifras descartadas mayores a 0, sin importar si es 1, 2, 3 o 4.

  - **Error 2: Sumar 1 a la parte entera en lugar de la posición decimal pedida.** **Cómo corregirlo:** La unidad $+1$ se suma específicamente en el orden decimal solicitado ($10^{-k}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aproxime $2,31$ por exceso a la décima.
  alternativas:
  - $2,4$
  - $2,3$
  - $2,5$
  respuesta: $2,4$
  solucion_pasos:
  - 'Como se descarta la centésima $1 > 0$, se suma 1 a la décima: $2,3 + 0,1 = 2,4$.'
- titulo: Ejemplo 2
  enunciado: Aproxime $7,004$ por exceso a la centésima.
  alternativas:
  - $7,01$
  - $7,00$
  - $7,10$
  respuesta: $7,01$
  solucion_pasos:
  - 'Como se descarta la milésima $4 > 0$, se suma 1 a la centésima: $7,00 + 0,01 = 7,01$.'
- titulo: ¿Es la aproximación por exceso de $1,2$ a la unidad igual a $2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, como la décima $2 > 0$ se descarta, la unidad $1$ se incrementa a $2$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! El menor entero mayor o igual a $1,2$ es $2$ ($2 \ge 1,2$).
  - texto: No, es 1
    es_correcta: false
    retroalimentacion: Incorrecto, $1$ es la aproximación por defecto.
  - texto: No, es 1,5
    es_correcta: false
    retroalimentacion: Incorrecto, la unidad solicitada es un número entero.
- titulo: ¿Es la aproximación por exceso siempre mayor o igual que el valor exacto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición $x_{\text{exc}} \ge x$ para todo número real.
  alternativas:
  - texto: Sí, siempre es mayor o igual
    es_correcta: true
    retroalimentacion: ¡Correcto! La aproximación por exceso actúa como una cota superior universal.
  - texto: No, a veces es menor
    es_correcta: false
    retroalimentacion: Incorrecto, si fuera menor sería una aproximación por defecto.
  - texto: Solo para números enteros
    es_correcta: false
    retroalimentacion: Incorrecto, la definición aplica a todos los números reales.
errores_frecuentes:
- No sumar una unidad al último dígito conservado al aproximar por exceso cuando la siguiente cifra es menor que 5.
- Confundir la aproximación por exceso con el redondeo hacia el entero más cercano.
- Sumar una unidad a la parte entera en lugar de la cifra de la posición decimal pedida.
- Afirmar que la aproximación por exceso de un número exacto como $3,5$ a décimas es $3,6$.
- Considerar que la aproximación por exceso produce un error mayor a una unidad del orden de precisión.
afirmaciones_verdaderas:
- La aproximación por exceso de un número decimal es siempre mayor o igual a su valor exacto.
- Si un número posee cifras decimales no nulas más allá de la posición $k$, su aproximación por exceso incrementa en $1$ el dígito de orden $k$.
- La diferencia entre la aproximación por exceso y por defecto a $k$ decimales de un número no exacto es siempre $10^{-k}$.
al_terminar_debes_poder: '![Síntesis de aproximación por exceso](/static/img/nodos/aproximacion-por-exceso-resumen.svg)


  QUÉ: Aproximar números reales por exceso a un orden decimal determinado ($k$ cifras).


  CÓMO: Incrementando en una unidad ($+1$) la cifra de la posición decimal $k$ si existen cifras decimales posteriores mayores que cero, garantizando que el valor aproximado constituya una cota superior válida ($x_{\text{exc}} \ge x$).'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
