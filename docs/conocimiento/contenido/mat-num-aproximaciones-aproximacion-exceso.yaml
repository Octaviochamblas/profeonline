semantic_id: MAT.NUM.APROXIMACIONES.APROXIMACION_EXCESO
resumen_inicial: Una aproximación por exceso (o por cota superior) es un valor cercano
  al número real $x$ tal que la aproximación $x_{\text{exc}}$ es estrictamente mayor
  o igual al valor exacto ($x_{\text{exc}} \ge x$).
explicacion_simple: Aproximar un número por exceso consiste en elegir un valor cercano
  que se pase o quede por encima del valor exacto. Es una aproximación que garantiza
  un techo o límite superior seguro, aumentando en una unidad la última cifra conservada.
explicacion_formal: 'Sea $x \in \mathbb{R}$, una **Aproximación por Exceso a nivel
  $10^{-k}$** se define como el valor $x_{\text{exc}}$ que satisface la cota unilateral
  estricta:


  $$x_{\text{exc}} - 10^{-k} < x \le x_{\text{exc}}$$


  **Desglose de la fórmula:**

  - $x \le x_{\text{exc}}$: La aproximación es siempre mayor o igual que el número
  real $x$.

  - Incrementalismo: Para un decimal positivo truncado $x_{\text{trunc}}$, la aproximación
  por exceso cumple $x_{\text{exc}} = x_{\text{trunc}} + 10^{-k}$.


  > **Complemento didáctico:** El error firmado $E = x - x_{\text{exc}} \le 0$ es
  siempre no positivo en las aproximaciones por exceso.'
definiciones_clave: '- **Aproximación por exceso**: Estimación numérica $x_{\text{exc}}$
  que satisface la condición $x_{\text{exc}} \ge x$.'
propiedades_relaciones: '- **Acotación superior**: $x_{\text{exc}} \ge x$ con error
  $E = x - x_{\text{exc}} \le 0$.'
ejemplo_guiado:
  enunciado: Aproxime el número $4,123$ por exceso a las centésimas ($k=2$).
  pasos:
  - 'Paso 1: Identificar las centésimas en $4,123$: es la cifra $2$.'
  - 'Paso 2: Como es por exceso, se suma 1 a la posición de la centésima: $2 + 1 =
    3$.'
  - 'Paso 3: Escribir el número aproximado por exceso: $4,13$.'
  - 'Paso 4: Comprobar la desigualdad: $4,13 \ge 4,123$.'
  - 'Conclusión: La aproximación por exceso a la centésima de $4,123$ es $4,13$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación de desigualdad satisface la aproximación por exceso x_exc
    respecto del número real x?
  choices:
  - text: x_exc >= x (la aproximación es mayor o igual al valor exacto)
    is_correct: true
  - text: x_exc <= x
    is_correct: false
  - text: x_exc = x - 1
    is_correct: false
  - text: x_exc = 0 siempre
    is_correct: false
  explanation: La alternativa correcta es 'x_exc >= x (la aproximación es mayor o
    igual al valor exacto)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4,123 aproximado por exceso a la centésima,
    ¿cuál fue el resultado?
  choices:
  - text: 4,13
    is_correct: true
  - text: 4,12
    is_correct: false
  - text: 4,10
    is_correct: false
  - text: 4,20
    is_correct: false
  explanation: La alternativa correcta es '4,13'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la unidad o cifra decimal fijada para la aproximación.'
- 'Paso 2: Sumar una unidad a dicha cifra si existen decimales no nulos sobrantes.'
- 'Paso 3: Verificar que el valor resultante sea mayor o igual al número original
  ($x_{\text{exc}} \ge x$).'
errores_correccion: '- **Error 1: Truncar el número creyendo que se aproxima por exceso.**
  **Cómo corregirlo:** Truncar da la aproximación por defecto; por exceso se DEBE
  incrementar en 1 la última cifra retenida.


  - **Error 2: Ignorar las cifras decimales pequeñas en la aproximación por exceso.**
  **Cómo corregirlo:** Cualquier presencia de decimales a la derecha obliga a subir
  en 1 unidad la cifra de corte.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aproxime 2,31 por exceso a la décima.
  alternativas:
  - 2,4
  - 2,3
  - 2,5
  respuesta: 2,4
  solucion_pasos:
  - $2,4 \ge 2,31 \implies$ por exceso a la décima es $2,4$.
- titulo: Ejemplo 2
  enunciado: Aproxime 7,001 por exceso a las centésimas.
  alternativas:
  - 7,01
  - 7,00
  - 7,10
  respuesta: 7,01
  solucion_pasos:
  - $7,01 \ge 7,001 \implies$ por exceso es $7,01$.
- titulo: ¿Es la aproximación por exceso de 1,2 a la unidad igual a 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2 \ge 1,2$.
- titulo: ¿Es la aproximación por exceso siempre mayor o igual que el valor exacto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de la cota por exceso.
errores_frecuentes:
- Aproximar por exceso entrega un número estrictamente menor que el valor real.
- El proceso de aproximar por exceso a la décima es idéntico a truncar las centésimas.
- La aproximación por exceso de $6,12$ a las décimas es el número $6,1$.
- Aproximar por exceso un número entero modifica su cifra sumándole 10.
- El error en la aproximación por exceso resulta en un valor positivo indeterminado.
afirmaciones_verdaderas:
- La aproximación por exceso satisface la desigualdad $x_{\text{exc}} \ge x$.
- Aproximar por exceso exige incrementar en una unidad la cifra de corte si existen
  decimales sobrantes.
al_terminar_debes_ponder: Al terminar serás capaz de aproximar cualquier número por
  exceso a una posición decimal requerida, verificando que la estimación resultante
  $x_{\text{exc}} \ge x$ se mantenga mayor o igual al valor exacto.
al_terminar_debes_poder: Al terminar serás capaz de aproximar cualquier número por
  exceso a una posición decimal requerida, verificando que la estimación resultante
  $x_{\text{exc}} \ge x$ se mantenga mayor o igual al valor exacto.
