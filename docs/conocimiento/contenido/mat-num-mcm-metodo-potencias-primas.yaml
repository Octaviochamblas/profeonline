semantic_id: MAT.NUM.MINIMO_COMUN_MULTIPLO.METODO_POTENCIAS_PRIMAS
resumen_inicial: El m.c.m. mediante factores primos es el producto de todas las bases
  primas comunes y no comunes elevadas a su mayor exponente.
explicacion_simple: Para calcular el m.c.m. usando la descomposición prima, primero
  escribimos cada número como producto de potencias de primos. Luego tomamos absolutamente
  todas las bases primas que aparezcan (hayan o no en todos los números) y a cada
  una le asignamos el exponente más alto con el que aparece.
explicacion_formal: 'Dadas las descomposiciones canónicas de $a$ y $b$ sobre la unión
  de bases primas $p_i$:


  $$a = \prod p_i^{\alpha_i}, \quad b = \prod p_i^{\beta_i} \implies \operatorname{mcm}(a,
  b) = \prod p_i^{\max(\alpha_i, \beta_i)}$$


  **Desglose de la fórmula:**

  - $\alpha_i, \beta_i \ge 0$: Exponentes de la base prima $p_i$ en cada número ($0$
  si no aparece).

  - $\max(\alpha_i, \beta_i)$: Selección obligatoria del exponente máximo para cada
  base prima.


  > **Complemento didáctico:** Para $12 = 2^2 \cdot 3^1$ y $18 = 2^1 \cdot 3^2$, tomamos
  $2^{\max(2,1)} = 2^2$ y $3^{\max(1,2)} = 3^2$, dando $\operatorname{mcm}(12,18)
  = 2^2 \cdot 3^2 = 36$.'
definiciones_clave: '- **Regla del mayor exponente**: Criterio del m.c.m. que selecciona
  el exponente máximo para cada base prima común y no común.'
ejemplo_guiado:
  enunciado: Calcule el $\operatorname{mcm}(18, 24)$ utilizando sus descomposiciones
    en potencias de primos.
  pasos:
  - 'Paso 1: Escribir la descomposición de 18: $18 = 2^1 \cdot 3^2$.'
  - 'Paso 2: Escribir la descomposición de 24: $24 = 2^3 \cdot 3^1$.'
  - 'Paso 3: Seleccionar el mayor exponente para la base 2: $\max(1, 3) = 3 \implies
    2^3$.'
  - 'Paso 4: Seleccionar el mayor exponente para la base 3: $\max(2, 1) = 2 \implies
    3^2$.'
  - 'Paso 5: Multiplicar los factores seleccionados: $2^3 \cdot 3^2 = 8 \cdot 9 =
    72$.'
  - 'Conclusión: $\operatorname{mcm}(18, 24) = 72$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué regla de exponentes se aplica para hallar el m.c.m. a partir de las
    descomposiciones primas?
  choices:
  - text: Tomar todas las bases primas elevadas a su MAYOR exponente
    is_correct: true
  - text: Tomar solo las bases comunes elevadas a su menor exponente
    is_correct: false
  - text: Sumar los exponentes de todas las bases
    is_correct: false
  - text: Multiplicar los exponentes sin usar las bases
    is_correct: false
  explanation: La alternativa correcta es 'Tomar todas las bases primas elevadas a
    su MAYOR exponente'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 18 = 2^1 · 3^2 y 24 = 2^3 · 3^1, ¿cuál fue el
    m.c.m. resultante?
  choices:
  - text: '72'
    is_correct: true
  - text: '6'
    is_correct: false
  - text: '432'
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: La alternativa correcta es '72'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la descomposición prima canónica de cada uno de los números.'
- 'Paso 2: Identificar todas las bases primas que aparezcan en al menos una de las
  descomposiciones.'
- 'Paso 3: Asignar a cada base prima el mayor exponente con el que aparezca y multiplicar
  el conjunto de potencias.'
errores_correccion: '- **Error 1: Elegir el menor exponente en lugar del mayor.**
  **Cómo corregirlo:** El m.c.m. utiliza el MAYOR exponente ($\max(\alpha_i, \beta_i)$);
  el menor exponente se usa en el M.C.D.


  - **Error 2: Omitir los primos que no son comunes a todos los números.** **Cómo
  corregirlo:** El m.c.m. incluye TODAS las bases primas, sean comunes o no comunes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $a = 2^2 \cdot 5$ y $b = 2 \cdot 3 \cdot 5$, halle el m.c.m.(a, b).
  alternativas:
  - 2^2 · 3 · 5 = 60
  - 2 · 5 = 10
  - 2^3 · 3 · 5 = 120
  respuesta: 2^2 · 3 · 5 = 60
  solucion_pasos:
  - 'Bases: 2, 3, 5. Exponentes mayores: $2^2$, $3^1$, $5^1$. mcm $= 4 \cdot 3 \cdot
    5 = 60$.'
- titulo: Ejemplo 2
  enunciado: ¿Qué exponente se elige para la base 2 entre $2^4$ y $2^2$ al calcular
    el m.c.m.?
  alternativas:
  - 2^4 (el mayor exponente)
  - 2^2 (el menor exponente)
  - 2^6 (la suma)
  respuesta: 2^4 (el mayor exponente)
  solucion_pasos:
  - El m.c.m. exige la potencia de mayor exponente ($2^4$).
- titulo: ¿Se deben incluir las bases primas no comunes al calcular el m.c.m. por
    potencias?
  respuesta: Sí
  solucion_pasos:
  - Sí, el m.c.m. toma todas las bases primas comunes y no comunes.
- titulo: ¿Utiliza el m.c.m. los menores exponentes de las bases primas?
  respuesta: 'No'
  solucion_pasos:
  - No, utiliza los mayores exponentes. Los menores se usan en el M.C.D.
errores_frecuentes:
- Al calcular el m.c.m. por potencias primas se deben seleccionar los menores exponentes
  de cada base.
- Las bases primas que no son comunes a todos los números deben descartarse de la
  multiplicación del m.c.m.
- El m.c.m. por potencias se obtiene multiplicando los exponentes entre sí sin usar
  las bases.
- Si un número no tiene una base prima se asume que su exponente es infinito.
- El producto de los mayores exponentes es siempre igual al máximo común divisor.
afirmaciones_verdaderas:
- El m.c.m. se calcula multiplicando todas las bases primas comunes y no comunes elevadas
  a su mayor exponente.
- La regla de potencias primas del m.c.m. selecciona $\max(\alpha_i, \beta_i)$ para
  cada primo $p_i$.
al_terminar_debes_poder: Al terminar serás capaz de calcular el m.c.m. mediante las
  descomposiciones primas, seleccionando todas las bases primas elevadas a su mayor
  exponente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
