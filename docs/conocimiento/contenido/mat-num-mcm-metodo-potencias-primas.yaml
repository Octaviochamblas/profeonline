semantic_id: MAT.NUM.MINIMO_COMUN_MULTIPLO.METODO_POTENCIAS_PRIMAS
resumen_inicial: "El MCM se calcula tomando todos los factores primos (comunes y no comunes) de las descomposiciones, elevados a su mayor exponente, y multiplicándolos."
explicacion_simple: |
  Imagina que eres un coleccionista que quiere armar el set definitivo de bloques. El
  modelo A usa 2 piezas rojas y 1 azul; el modelo B usa 1 roja, 1 azul y 3 verdes. Para
  armar cualquiera de los dos, tu caja debe tener el máximo de cada pieza: 2 rojas, 1
  azul y 3 verdes. Así funciona el método de potencias primas para el MCM.
explicacion_formal: |
  Para calcular el MCM por **potencias primas**: se descompone cada número en factores
  primos, se identifican todas las bases que aparecen (comunes y no comunes), y para cada
  base se toma la potencia con el **mayor exponente**. Multiplicando esas potencias se
  obtiene el MCM. Para $24=2^3\cdot3^1$ y $90=2^1\cdot3^2\cdot5^1$:
  $\text{MCM}(24,90)=2^3\cdot3^2\cdot5^1=360$.
definiciones_clave: |
  **Factor no común**: primo que aparece en la descomposición de solo uno de los números;
  a diferencia del M.C.D., el MCM sí lo incluye obligatoriamente.
propiedades_relaciones: |
  A diferencia del M.C.D. (que solo usa factores comunes con el menor exponente), el MCM
  usa todos los factores, comunes y no comunes, con el mayor exponente.
ejemplo_guiado:
  enunciado: "Calcula el MCM de 20 y 36 por potencias primas."
  pasos:
    - 'Descomposición: $20=2^2\cdot5^1$, $36=2^2\cdot3^2$.'
    - "Bases: $2$, $3$ y $5$. Mayor exponente: $2^2$, $3^2$, $5^1$."
    - 'Conclusión: $\text{MCM}(20,36)=2^2\cdot3^2\cdot5=180$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué exponente se elige para cada factor primo al calcular el MCM por este método?"
    choices:
      - {text: "El mayor exponente entre las descomposiciones", is_correct: true}
      - {text: "El menor exponente entre las descomposiciones", is_correct: false}
      - {text: "La suma de los exponentes", is_correct: false}
      - {text: "Siempre el exponente 1", is_correct: false}
    explanation: "La correcta es El mayor exponente entre las descomposiciones: eso asegura que el resultado sea múltiplo de todos los números."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCM de 12 ($2^2\\cdot3$) y 18 ($2\\cdot3^2$)?"
    choices:
      - {text: "36", is_correct: true}
      - {text: "6", is_correct: false}
      - {text: "216", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 36: $2^2\\cdot3^2=4\\cdot9=36$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Descompón cada número por separado en factores primos y escríbelos usando potencias.'
  - 'Paso 2: Haz una lista de todas las bases de números primos distintas que aparecen en cualquiera de las descomposiciones (factores comunes y no comunes).'
  - 'Paso 3: Para cada base de la lista, busca en cuál de las descomposiciones tiene el exponente más alto y escribe la potencia con ese exponente.'
  - 'Paso 4: Multiplica todas las potencias seleccionadas en el Paso 3 para obtener el MCM.'
errores_correccion: |
  Un error frecuente es elegir el menor exponente en lugar del mayor. Otro error es
  olvidar incluir los factores primos no comunes, dejando el resultado incompleto.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el MCM de $18$ y $30$ mediante el método de potencias primas.'
    alternativas:
      - "90"
      - "6"
      - "540"
    respuesta: "90"
    solucion_pasos:
      - 'Paso a: Obtenemos las descomposiciones: $18 = 2^1 \cdot 3^2$ y $30 = 2^1 \cdot 3^1 \cdot 5^1$.'
      - 'Paso b: Listamos todas las bases que aparecen: $2, 3$ y $5$.'
      - 'Paso c: Seleccionamos el mayor exponente para cada una: para $2$ es $2^1$, para $3$ es $3^2$, y para $5$ es $5^1$.'
      - 'Paso d: Multiplicamos: $\text{MCM} = 2^1 \cdot 3^2 \cdot 5^1 = 2 \cdot 9 \cdot 5 = 90$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Encuentra el MCM de $12$ y $16$ por potencias primas.'
    alternativas:
      - "48"
      - "4"
      - "192"
    respuesta: "48"
    solucion_pasos:
      - 'Paso a: Descomponemos: $12 = 2^2 \cdot 3^1$ y $16 = 2^4$.'
      - 'Paso b: Las bases presentes son $2$ y $3$.'
      - 'Paso c: Tomamos el mayor exponente: para la base $2$ es $2^4$ (ya que $4 > 2$), y para la base $3$ es $3^1$.'
      - 'Paso d: Multiplicamos: $\text{MCM} = 2^4 \cdot 3^1 = 16 \cdot 3 = 48$.'
  - titulo: 'Si las descomposiciones de dos números son $2^3 \cdot 5$ y $2 \cdot 5^2$, ¿es $2^3 \cdot 5^2$ la expresión del MCM?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Las bases que aparecen son $2$ y $5$.'
      - 'El mayor exponente para la base $2$ es $3$ (de $2^3$).'
      - 'El mayor exponente para la base $5$ es $2$ (de $5^2$).'
      - 'Multiplicando estas potencias de mayor exponente obtenemos $2^3 \cdot 5^2$ (que es $8 \cdot 25 = 200$).'
  - titulo: 'En el método de potencias primas para el MCM, ¿debemos descartar los factores primos que no son comunes (los que aparecen en un solo número)?'
    respuesta: 'No'
    solucion_pasos:
      - 'Al contrario que en el Máximo Común Divisor (MCD) donde solo se consideran los factores comunes, para el MCM se deben incluir obligatoriamente todos los factores primos, sean comunes o no comunes.'
      - 'Si los descartáramos, el resultado no sería múltiplo de todos los números originales.'
errores_frecuentes:
  - 'Elegir el menor exponente en lugar del mayor para cada factor primo.'
  - 'Olvidar incluir los factores primos no comunes.'
  - 'Multiplicar los exponentes entre sí o sumar las bases.'
  - 'No escribir las descomposiciones usando potencias.'
  - 'Multiplicar todas las potencias de ambas descomposiciones directamente sin comparar los exponentes de los factores repetidos.'
afirmaciones_verdaderas:
  - "Para calcular el MCM por potencias primas, se toma cada factor con su mayor exponente."
  - "El método de potencias primas incluye tanto los factores comunes como los no comunes."
al_terminar_debes_poder: |
  Calcular el MCM de dos o más números mediante el método de factores primos con mayor
  exponente.
fuente: 'Teoría de Números'
estado: publicado
