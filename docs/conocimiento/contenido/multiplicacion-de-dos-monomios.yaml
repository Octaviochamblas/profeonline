procedimiento:
- 'Paso 1: Determina el signo del producto usando la regla de signos.'
- 'Paso 2: Multiplica los valores numéricos de los coeficientes.'
- 'Paso 3: Identifica las variables repetidas en ambos monomios y suma sus exponentes.'
- 'Paso 4: Conserva intactas las variables que aparezcan en solo uno de los monomios.'
- 'Paso 5: Escribe el término final combinando signo, coeficiente y variables ordenadas
  alfabéticamente.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación de dos monomios.
ejemplos:
- titulo: Variables no compartidas
  enunciado: 'Multiplica: (2a^2b)(-5bc).'
  solucion_pasos:
  - 'Signo: (+)(-) = -.'
  - 'Coeficientes: 2 × 5 = 10.'
  - 'Variable a: a^2 (no se repite, queda igual).'
  - 'Variable b: b^1 · b^1 = b^2.'
  - 'Variable c: c (no se repite, queda igual).'
  - 'Resultado: -10a^2b^2c.'
- titulo: Un terreno rectangular tiene de largo $6a^2b$ metros y de ancho $2ab^3$
    metros. ¿Cuál es su
  enunciado: 'Un terreno rectangular tiene de largo $6a^2b$ metros y de ancho $2ab^3$
    metros. ¿Cuál es su área en metros cuadrados? (v1)


    Opciones: A) $12a^3b^4$ · B) $12a^2b^3$ · C) $8a^3b^4$ · D) $12ab$'
  solucion_pasos:
  - Área = largo × ancho $= (6a^2b)(2ab^3) = (6 \cdot 2)(a^{2+1})(b^{1+3}) = 12a^3b^4$.
  - 'Respuesta: $12a^3b^4$'
