resumen_inicial: La multiplicación de dos monomios aplica rigurosamente las leyes
  distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con multiplicación de dos monomios, multiplicamos
  los coeficientes numéricos, aplicamos la regla de signos y sumamos los exponentes
  de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Multiplicación de dos monomios**
  viene dada por:


  $$\text{"el producto de (5x^2y) · (3xy^4)"} \implies 15x^3y^5$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Multiplicación de dos monomios**: Operación de multiplicación
  sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule multiplicación de dos monomios para: ''el producto de (5x^2y)
    · (3xy^4)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 15x^3y^5.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar multiplicación de dos monomios a 'el
    producto de (5x^2y) · (3xy^4)'?
  choices:
  - text: 15x^3y^5
    is_correct: true
  - text: 8x^3y^5
    is_correct: false
  - text: 15x^2y^4
    is_correct: false
  - text: 15x^3y^4
    is_correct: false
  explanation: La alternativa correcta es '15x^3y^5'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto de (5x^2y) · (3xy^4)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: 15x^3y^5
    is_correct: true
  - text: 8x^3y^5
    is_correct: false
  - text: 15x^2y^4
    is_correct: false
  - text: 15x^3y^4
    is_correct: false
  explanation: La alternativa correcta es '15x^3y^5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante multiplicación de dos monomios.** **Cómo corregirlo:** Al multiplicar potencias
  de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de multiplicación de dos monomios en 'el producto
    de (5x^2y) · (3xy^4)'?
  alternativas:
  - 15x^3y^5
  - 8x^3y^5
  - 15x^2y^4
  - 15x^3y^4
  respuesta: 15x^3y^5
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 15x^3y^5.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto de (5x^2y) · (3xy^4)' por multiplicación de
    dos monomios, ¿qué expresión resulta?
  alternativas:
  - 15x^3y^5
  - 8x^3y^5
  - 15x^2y^4
  - 15x^3y^4
  respuesta: 15x^3y^5
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 15x^3y^5.
- titulo: ¿Es la multiplicación en 'el producto de (5x^2y) · (3xy^4)' equivalente
    a 15x^3y^5?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 15x^3y^5.
- titulo: ¿Da el producto de 'el producto de (5x^2y) · (3xy^4)' un resultado igual
    a 8x^3y^5?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 15x^3y^5.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar multiplicación de dos
  monomios.
- Omitir distribuir el monomio o término sobre todos los sumandos en multiplicación
  de dos monomios.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La multiplicación de dos monomios requiere sumar los exponentes de las variables
  que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la multiplicación de
  dos monomios aplicando distributividad, ley de signos y suma de exponentes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Multiplicación.
