semantic_id: MAT.ALG.MULT_MONOMIOS.DOS_MONOMIOS
resumen_inicial: 'Multiplicación de dos monomios: leyes, procedimiento y aplicación
  en Multiplicación de monomios.'
explicacion_simple: Multiplicar dos monomios es el bloque básico de toda la multiplicación
  algebraica. Consiste simplemente en fusionar dos términos simples en uno solo siguiendo
  tres reglas ordenadas.
explicacion_formal: '### Definición formal


  Signo: $(-)(+)=-$. Coeficientes: $4 \times 3 = 12$. Variable $a$: $a^1 \cdot a^2
  = a^3$. Variable $b$: $b^2$. Variable $c$: $c$. Resultado: $-12a^3b^2c$.


  ### Desarrollo didáctico


  Multiplica: $(5x^2y)(−3xy^3)$.


  Paso 1: Signos. $(+)(-) = -$.

  Paso 2: Coeficientes. $5 \times 3 = 15$.

  Paso 3: Variable $x$. $x^2 \cdot x^1 = x^{2+1} = x^3$.

  Paso 4: Variable $y$. $y^1 \cdot y^3 = y^{1+3} = y^4$.


  Resultado combinado: $-15x^3y^4$.'
definiciones_clave: '- **Multiplicación de dos monomios**: Propiedad o regla fundamental
  del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación de dos monomios.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de multiplicación de dos
    monomios.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de multiplicación de dos monomios.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
