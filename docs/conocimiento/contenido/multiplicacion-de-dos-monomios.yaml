  enunciado: 'Respecto de «Multiplicación de dos monomios»: ¿Es correcta esta caracterización?
    «Para multiplicar **Dos Monomios**, se multiplican sus coeficientes numéricos
    (aplicando la regla de signos) y se suman los exponentes de las letras que tengan
    la misma base»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para multiplicar **Dos Monomios**,
