semantic_id: MAT.ALG.MULT_MONOMIOS.DOS_MONOMIOS
resumen_inicial: La multiplicación de dos monomios consiste en multiplicar sus coeficientes numéricos entre sí y combinar sus factores literales aplicando el producto de potencias de igual base.
explicacion_simple: "Para multiplicar **dos monomios** (expresiones algebraicas de un solo término cada una):\n- **Paso 1: Multiplica los coeficientes numéricos** (los números de adelante) aplicando la regla de los signos.\n- **Paso 2: Suma los exponentes de las letras que son iguales** (misma base $x^a \\cdot x^b = x^{a+b}$).\n- **Paso 3: Conserva las letras que son distintas** poniéndolas una al lado de la otra.\n- **Ejemplo 1**: $(4x^3) \\cdot (5x^2)$:\n  - Coeficientes: $4 \\cdot 5 = \\mathbf{20}$.\n  - Variable $x$: $x^{3+2} = \\mathbf{x^5}$.\n  - Resultado: **$20x^5$**.\n- **Ejemplo 2**: $(-3a^2 b) \\cdot (2a c^3)$:\n  - Coeficientes: $(-3) \\cdot (2) = \\mathbf{-6}$.\n  - Variable $a$: $a^{2+1} = \\mathbf{a^3}$.\n  - Variables $b$ y $c$: $\\mathbf{b c^3}$.\n  - Resultado: **$-6a^3 b c^3$**.\n\n![Multiplicación de Dos Monomios](/static/img/nodos/multiplicacion-de-dos-monomios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $M_1 = a \prod_{i=1}^n x_i^{\alpha_i}$ y $M_2 = b \prod_{i=1}^n x_i^{\beta_i}$ dos monomios en $\mathbb{R}[x_1, \dots, x_n]$ con coeficientes $a, b \in \mathbb{R}$ y vectores de exponentes $\boldsymbol{\alpha}, \boldsymbol{\beta} \in \mathbb{N}_0^n$. El **producto de monomios** se define como el operador bilineal:


  $$M_1 \cdot M_2 = (a \cdot b) \prod_{i=1}^n x_i^{\alpha_i + \beta_i}$$


  ### Grado del Monomio Producto

  El grado absoluto del monomio producto es la suma exacta de los grados absolutos de cada uno de los monomios multiplicandos:


  $$\operatorname{deg}(M_1 \cdot M_2) = \operatorname{deg}(M_1) + \operatorname{deg}(M_2) = \sum_{i=1}^n \alpha_i + \sum_{i=1}^n \beta_i$$


  ### Síntesis didáctica

  La multiplicación de dos monomios es la operación fundamental que desacopla el cálculo en un producto aritmético de escalares y una suma de exponentes vectoriales.

  '
definiciones_clave: '- **Multiplicación de dos monomios**: Operación algebraica que consolida dos términos en un único monomio resultante.

  - **Producto bilineal de coeficientes ($a \cdot b$)**: Multiplicación de las constantes reales preservando la signatura.

  - **Adición vectorial de exponentes ($\alpha_i + \beta_i$)**: Suma de las potencias asociadas a cada variable compartida.

  '
propiedades_relaciones: '- **Cierre bajo la multiplicación**: El producto de dos monomios siempre resulta en un nuevo monomio (nunca en un binomio).

  - **Conmutatividad del producto de monomios**: $M_1 \cdot M_2 = M_2 \cdot M_1$.

  '
ejemplo_guiado:
  enunciado: Calcula el producto de los monomios $M_1 = -6x^4 y^2$ y $M_2 = 3x y^3 z$.
  pasos:
  - 'Paso 1: Multiplicamos los coeficientes numéricos aplicando ley de signos: $(-6) \cdot (3) = \mathbf{-18}$.'
  - 'Paso 2: Sumamos los exponentes para la variable $x$: $x^4 \cdot x^1 = x^{4+1} = \mathbf{x^5}$.'
  - 'Paso 3: Sumamos los exponentes para la variable $y$: $y^2 \cdot y^3 = y^{2+3} = \mathbf{y^5}$.'
  - 'Paso 4: Mantenemos la variable $z$ intacta por pertenecer sólo al segundo factor: $\mathbf{z^1}$.'
  - 'Paso 5: Consolidamos el monomio producto final: $-18x^5 y^5 z$.'
  - 'Conclusión: El producto de los monomios es **$-18x^5 y^5 z$**.'
  imagen: /static/img/nodos/multiplicacion-de-dos-monomios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tipo de expresión algebraica resulta siempre al multiplicar dos monomios entre sí?
  choices:
  - text: Resulta siempre un único monomio cuya parte literal combina la suma de exponentes de las bases comunes
    is_correct: true
  - text: Resulta un binomio con dos términos separados por un signo más
    is_correct: false
  - text: Resulta una fracción sin variables
    is_correct: false
  - text: Resulta siempre cero
    is_correct: false
  explanation: La alternativa correcta es 'Resulta siempre un único monomio cuya parte literal combina la suma de exponentes de las bases comunes'. Cierre bajo la multiplicación de monomios.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $(3a^2 b) \cdot (-4a^3)$?
  choices:
  - text: El resultado es $-12a^5 b$, multiplicando $3 \cdot (-4) = -12$ y sumando $2 + 3 = 5$ en el exponente de $a$
    is_correct: true
  - text: El resultado es $-7a^5 b$
    is_correct: false
  - text: El resultado es $-12a^6 b$
    is_correct: false
  - text: El resultado es $12a^5 b$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $-12a^5 b$, multiplicando $3 \cdot (-4) = -12$ y sumando $2 + 3 = 5$ en el exponente de $a$'. $3 \cdot (-4) = -12$, $a^{2+3}=a^5 \implies -12a^5b$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los coeficientes numéricos de ambos monomios determinando el signo final.'
- 'Paso 2: Identificar las letras comunes en ambos monomios y sumar sus exponentes respectivos.'
- 'Paso 3: Copiar las letras que sólo aparecen en uno de los monomios con su mismo exponente.'
- 'Paso 4: Presentar el monomio resultante con las letras ordenadas alfabéticamente.'
errores_correccion: '- **Error 1:** Sumar los coeficientes numéricos en lugar de multiplicarlos al resolver $2x \cdot 3x$. **Cómo corregirlo:** Los coeficientes **SE MULTIPLICAN ($2 \cdot 3 = 6 \implies 6x^2$)**.

  - **Error 2:** Multiplicar los exponentes de la misma variable en lugar de sumarlos (escribir $x^2 \cdot x^3 = x^6$). **Cómo corregirlo:** Los exponentes de igual base **SE SUMAN ($2 + 3 = 5 \implies x^5$)**.

  '
ejemplos:
- titulo: Monomios de una variable
  enunciado: ¿Cuál es el producto de $(5x^3) \cdot (2x^4)$?
  alternativas:
  - $10x^7$
  - $7x^7$
  - $10x^{12}$
  respuesta: $10x^7$
  solucion_pasos:
  - '1. Coeficientes: $5 \cdot 2 = 10$.'
  - '2. Exponentes: $3 + 4 = 7$.'
  - '3. Resultado: $10x^7$.'
- titulo: Monomios con coeficientes negativos
  enunciado: ¿Cuál es el producto de $(-4a^2) \cdot (-3ab)$?
  alternativas:
  - $12a^3 b$
  - $-12a^3 b$
  - $12a^2 b$
  respuesta: $12a^3 b$
  solucion_pasos:
  - '1. Coeficientes: $(-4) \cdot (-3) = +12$.'
  - '2. Variable $a$: $a^{2+1} = a^3$.'
  - '3. Variable $b$: $b$.'
  - '4. Resultado: $12a^3 b$.'
- titulo: Variable sin exponente explícito
  enunciado: Para $3x \cdot x^2$, ¿se suma el exponente $1 + 2 = 3$ obteniendo $3x^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^1 \cdot x^2 = x^3$.
- titulo: Variables independientes
  enunciado: En el producto $4x^2 \cdot 3y^3$, ¿se obtiene $12x^2 y^3$ manteniendo los exponentes separados?
  respuesta: Sí
  solucion_pasos:
  - Sí, por tener bases variables distintas.
errores_frecuentes:
- Sumar los coeficientes numéricos en lugar de multiplicarlos al calcular el producto.
- Multiplicar los exponentes de las potencias de igual base en lugar de sumarlos.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Las variables presentes en uno solo de los dos monomios son excluidas.
- Declarar que el producto de dos monomios puede generar dos términos separados.
afirmaciones_verdaderas:
- La multiplicación de dos monomios produce un único monomio como resultado.
- En el producto de monomios los coeficientes numéricos se multiplican y los exponentes de bases iguales se suman.
al_terminar_debes_poder: '![Resumen de multiplicación de dos monomios](/static/img/nodos/multiplicacion-de-dos-monomios-resumen.svg)


  QUÉ: Multiplicar dos términos monómicos simples o multivariables.


  CÓMO: Multiplicar los coeficientes numéricos $a \cdot b$ y sumar los exponentes de las letras comunes $x^m \cdot x^n = x^{m+n}$ manteniendo las variables no compartidas.'
