- titulo: 'Respecto de «Multiplicación de dos monomios»: ¿Es válida esta afirmación?
    «Sumar los coefici'
  enunciado: 'Respecto de «Multiplicación de dos monomios»: ¿Es válida esta afirmación?
    «Sumar los coeficientes en lugar de multiplicarlos (ej. $2x \cdot 3x = 5x^2$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para multiplicar **Dos Monomios**,
