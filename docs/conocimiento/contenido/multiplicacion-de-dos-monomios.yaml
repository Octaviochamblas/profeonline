errores_frecuentes:
- Sumar los coeficientes en lugar de multiplicarlos (ej. $2x \cdot 3x = 5x^2$).
- Olvidar sumar los exponentes implícitos que tienen valor 1 (ej. $x^2 \cdot x = x^2$
  en lugar de $x^3$).
- $-12ab^2c$.
- $-1a^3b^2c$.
- $-12a^2b^2c$.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
