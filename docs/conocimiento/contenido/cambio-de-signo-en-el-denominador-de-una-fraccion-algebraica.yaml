procedimiento:
- 'Paso 1: Para mover el signo al denominador, agrupa el denominador entre paréntesis.'
- 'Paso 2: Multiplica todo el paréntesis por el signo negativo.'
- 'Paso 3: Cambia de signo a TODOS los términos. Las restas invertidas ($b-a$) se
  volverán rectas ($a-b$).'
- El signo afecta a toda la expresión como bloque.
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cambio de signo en el denominador de una fracción algebraica.
ejemplos:
- titulo: Mueve el negativo global de $-\frac{x^2}{4 - y}$ hacia el denominador
  enunciado: Mueve el negativo global de $-\frac{x^2}{4 - y}$ hacia el denominador.
  solucion_pasos:
  - 'El signo va hacia abajo: $-(4 - y)$.'
  - 'Distribuimos: $-4 + y$.'
  - 'Reordenamos: $y - 4$.'
  - 'Resultado: $\frac{x^2}{y - 4}$.'
- titulo: ¿Cómo escribir $\frac{5}{-(x+2)}$ sin el paréntesis?
  solucion_pasos:
  - El negativo afecta a la x y al 2.
- titulo: 'Respecto de «Cambio de signo en el denominador de una fracción algebraica»:
    ¿La siguiente fo'
  enunciado: 'Respecto de «Cambio de signo en el denominador de una fracción algebraica»:
    ¿La siguiente formulación es correcta? «Si aplicas un cambio de signo al denominador
    (por ejemplo, pasando el signo global hacia abajo), debes cambiarle el signo a
    TODOS los términos del polinomio del denominador»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si aplicas un cambio de signo
    al denominador (por ejemplo, pasando el signo global hacia abajo), debes cambiarle
    el signo a TODOS los términos del polinomio del denominador.'
- titulo: 'Respecto de «Cambio de signo en el denominador de una fracción algebraica»:
    ¿La siguiente co'
  enunciado: 'Respecto de «Cambio de signo en el denominador de una fracción algebraica»:
    ¿La siguiente conclusión es correcta? «Cambiar el signo solo al primer término
    del denominador»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si aplicas un cambio de signo
    al denominador (por ejemplo, pasando el signo global hacia abajo), debes cambiarle
    el signo a TODOS los términos del polinomio del denominador.'
errores_frecuentes:
- Cambiar el signo solo al primer término del denominador.
- Creer que al darle vuelta a un polinomio sumado ($x+3$ a $3+x$) se necesita un negativo.
  (La suma es conmutativa, la resta no).
- Solo el término mayor cambia.
- Se invierte la fracción.
- El numerador también cambia.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando cambio
