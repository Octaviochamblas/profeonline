semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_DENOMINADOR
resumen_inicial: El cambio de signo en el denominador de una fracción algebraica consiste en factorizar un $-1$ del polinomio
  inferior, trasiriendo el signo negativo a la barra de la fracción o al numerador.
explicacion_simple: "Para cambiar el signo de los términos del **denominador** de una fracción (ej: $\\frac{4x}{2 - x}$):\n\
  - **REGLA DEL FACTOR NEGATIVO EN EL DENOMINADOR**:\n  1. Extraes un factor $-1$ del denominador escribiéndolo entre paréntesis:\n\
  \     - $2 - x = -(x - 2)$.\n  2. Reescribes la fracción aplicando la Ley de Signos:\n     - $\\frac{4x}{-(x - 2)} = \\\
  mathbf{-\\frac{4x}{x - 2}}$.\n- **¿Por qué es utilísimo este procedimiento?**:\n  - ¡Te permite voltear restas invertidas\
  \ como $2 - x \\to x - 2$ para poder **simplificar factores iguales** en el numerador y denominador!\n\n![Cambio de signo\
  \ en el denominador de una fracción](/static/img/nodos/cambio-de-signo-en-el-denominador-de-una-fraccion-algebraica-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la función racional $f(x) = \frac{P(x)}{Q(x)}$ sobre $\mathbb{R}(x)$. La propiedad del inverso multiplicativo del signo
  negativo en el cuerpo de fracciones establece la identidad formal:


  $$f(x) = \frac{P(x)}{Q(x)} = \frac{P(x)}{-(-Q(x))} = -\frac{P(x)}{-Q(x)}$$


  ### Inversión de Términos Sustractivos

  Si el denominador es de la forma $Q(x) = c - d$, su factorización en $-1$ entrega $Q(x) = -(d - c)$. Por consiguiente:


  $$\frac{P(x)}{c - d} = \frac{P(x)}{-(d - c)} = -\frac{P(x)}{d - c}$$


  ### Síntesis didáctica

  Cambiar el signo de todos los términos del denominador exige trasladar un signo negativo al frente de la fracción para no
  alterar la igualdad algebraica.

  '
definiciones_clave: '- **Cambio de signo en el denominador**: Factorización de un $-1$ del polinomio inferior que invierte
  el signo de todos sus términos.

  - **Transformación de denominadores opuestos**: Procedimiento que convierte $b - a$ en $-(a - b)$ para igualar denominadores
  en sumas o simplificaciones.

  - **Ley de los signos fraccionarios**: Regla que establece que $\frac{A}{-B} = -\frac{A}{B} = \frac{-A}{B}$.

  '
propiedades_relaciones: '- **Doble cambio neutro**: Cambiar los signos de todos los términos del numerador Y de todos los
  términos del denominador SIMULTÁNEAMENTE mantiene el signo global positivo: $\frac{-A}{-B} = \frac{A}{B}$.

  '
ejemplo_guiado:
  enunciado: Transforma la fracción $\frac{x + 3}{5 - x}$ de modo que el denominador tenga el término $x$ positivo.
  pasos:
  - 'Paso 1: Observamos el denominador $Q(x) = 5 - x$.'
  - 'Paso 2: Factorizamos $-1$ del denominador para invertir la resta: $5 - x = -(x - 5)$.'
  - 'Paso 3: Sustituimos en la fracción original: $\frac{x + 3}{-(x - 5)}$.'
  - 'Paso 4: Desplazamos el signo negativo hacia el frente de la barra principal: $-\frac{x + 3}{x - 5}$.'
  - 'Conclusión: La fracción equivalente con denominador $x - 5$ es **$-\frac{x + 3}{x - 5}$**.'
  imagen: /static/img/nodos/cambio-de-signo-en-el-denominador-de-una-fraccion-algebraica-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar el cambio de signo en el denominador de $\frac{7}{1 - x}$, ¿cuál es la expresión equivalente correcta?
  choices:
  - text: La expresión equivalente es $-\frac{7}{x - 1}$, factorizando $1 - x = -(x - 1)$ y anteponiendo el signo menos
    is_correct: true
  - text: La expresión equivalente es $\frac{7}{x - 1}$
    is_correct: false
  - text: La expresión equivalente es $-\frac{7}{1 - x}$
    is_correct: false
  - text: La expresión equivalente es $\frac{-7}{1 - x}$
    is_correct: false
  explanation: La alternativa correcta es 'La expresión equivalente es $-\frac{7}{x - 1}$, factorizando $1 - x = -(x - 1)$
    y anteponiendo el signo menos'. $\frac{7}{1-x} = \frac{7}{-(x-1)} = -\frac{7}{x-1}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si cambiamos los signos del numerador Y del denominador al mismo tiempo en $\frac{a - b}{c - d}$, ¿qué ocurre
    con el signo global frente a la fracción?
  choices:
  - text: 'El signo global se mantiene positivo ($+$), porque dos cambios de signo se anulan mutuamente: $\frac{-(b - a)}{-(d
      - c)} = \frac{b - a}{d - c}$'
    is_correct: true
  - text: El signo se vuelve negativo
    is_correct: false
  - text: La fracción se vuelve cero
    is_correct: false
  - text: Queda indefinida
    is_correct: false
  explanation: 'La alternativa correcta es ''El signo global se mantiene positivo ($+$), porque dos cambios de signo se anulan
    mutuamente: $\frac{-(b - a)}{-(d - c)} = \frac{b - a}{d - c}$''. Doble cambio de signo: $\frac{-A}{-B} = \frac{A}{B}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar entre paréntesis el polinomio del denominador.'
- 'Paso 2: Extraer el signo negativo (factor $-1$) del denominador, invirtiendo el signo de todos sus términos internos.'
- 'Paso 3: Pasar el signo menos resultante hacia el frente de la barra fraccionaria o distribuirlo al numerador.'
- 'Paso 4: Comprobar la equivalencia de la nueva fracción obtenida.'
errores_correccion: '- **Error 1:** Cambiar el signo a un solo término del denominador sin afectar a los demás. **Cómo corregirlo:**
  Al extraer el factor $-1$ del denominador **SE DEBE CAMBIAR EL SIGNO DE TODOS Y CADA UNO DE SUS TÉRMINOS**.

  - **Error 2:** Cambiar el signo del denominador sin trasladar el signo negativo al frente de la fracción. **Cómo corregirlo:**
  Para preservar el valor de la fracción **SI CAMBIAS EL DENOMINADOR DEBES COLOCAR UN SIGNO MENOS AL FRENTE DE LA BARRA FRACCIONARIA**.

  '
ejemplos:
- titulo: Inversión de resta en denominador
  enunciado: Para $\frac{x}{3 - x}$, ¿es equivalente a $-\frac{x}{x - 3}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3-x = -(x-3)$.
- titulo: Doble cambio de signo
  enunciado: ¿Es $\frac{x - y}{a - b} = \frac{y - x}{b - a}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, cambia arriba y abajo.
- titulo: Denominador negativo simple
  enunciado: En $\frac{5}{-x}$, ¿es igual a $-\frac{5}{x}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de signos.
- titulo: Reordenamiento
  enunciado: Para $\frac{1}{-x - 4}$, ¿es equivalente a $-\frac{1}{x + 4}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-x-4 = -(x+4)$.
errores_frecuentes:
- Invertir el signo de un único término en el denominador dejando los demás inalterados.
- El signo negativo frente a la barra de la fracción no es escrito al cambiar el denominador.
- "Declarar que $\frac{A}{-B}$ es diferente de $-\frac{A}{B}$."
- Modificar el signo global al realizar un doble cambio de signo arriba y abajo simultáneamente.
- "Olvidar que un doble cambio de signo preserva la fracción idéntica ($\frac{-A}{-B} = \frac{A}{B}$)."
afirmaciones_verdaderas:
- Factorizar $-1$ en el denominador invierte todos sus signos y traslada un menos frente a la fracción.
- Un doble cambio de signo en el numerador y denominador mantiene el signo global positivo.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/cambio-de-signo-en-el-denominador-de-una-fraccion-algebraica-resumen.svg)


  QUÉ: Realizar cambios de signo en el denominador de una fracción algebraica conservando la equivalencia.

  CÓMO: Extraer un factor $-1$ del polinomio inferior ($c - d = -(d - c)$) y transferir la negatividad al signo global frente
  a la fracción ($\frac{P(x)}{c-d} = -\frac{P(x)}{d-c}$).

  '
