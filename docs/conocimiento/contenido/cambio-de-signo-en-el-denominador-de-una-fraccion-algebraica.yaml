semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_DENOMINADOR
resumen_inicial: 'Cambio de signo en el denominador de una fracción algebraica: concepto,
  reglas operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: Al igual que con el piso de arriba, podemos inyectar un signo
  negativo en el subsuelo (el denominador). El mecanismo es exactamente el mismo,
  y es un truco fantástico para arreglar denominadores 'al revés'.
explicacion_formal: '### Definición formal


  Todos los términos del denominador cambian su signo.


  ### Desarrollo didáctico


  Tener un signo negativo o múltiples signos negativos molestos en el denominador
  es visualmente confuso y propenso a generar errores en sumas y restas futuras.


  Afortunadamente, podemos ''limpiar'' el denominador usando la regla de los signos:
  Puedes multiplicar tanto el numerador como el denominador por $-1$. Esto tiene el
  efecto adecuado de invertir todos los signos de la fracción, manteniéndola matemáticamente
  equivalente.


  Ejemplo: Tienes la fracción $\frac{x - 2}{-y + 3}$. El denominador es difícil de
  interpretar.

  Si multiplicas todo por $-1$ (cambias signos arriba y abajo):

  - Arriba: $(x - 2)$ se convierte en $(-x + 2)$ o $(2 - x)$.

  - Abajo: $(-y + 3)$ se convierte en $(y - 3)$.


  La nueva fracción limpia es $\frac{2 - x}{y - 3}$. Mucho más elegante y fácil de
  trabajar.'
definiciones_clave: '- **Cambio de signo en el denominador de una fracción algebraica**:
