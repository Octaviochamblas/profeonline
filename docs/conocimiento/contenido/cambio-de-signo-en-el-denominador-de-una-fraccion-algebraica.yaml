semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_DENOMINADOR
resumen_inicial: Cambiar el signo de todos los términos del denominador altera el
  signo global de la fracción, requiriendo un signo negativo compensatorio.
explicacion_simple: 'Así como podemos cambiar el signo del numerador, también podemos
  multiplicar todos los términos del denominador por -1.

  Al hacer esto en el denominador, el valor total de la fracción se invierte de signo.

  Para mantener la igualdad, debemos colocar un signo menos (-) fuera de la fracción.
  Esto es especialmente útil para igualar denominadores como (b - a) a la forma (a
  - b).'
explicacion_formal: 'Dada una fracción algebraica $F(x) = \frac{P(x)}{Q(x)}$, si se
  multiplica el polinomio denominador por $-1$, la **regla de signos del denominador**
  establece:


  $$\frac{P(x)}{-Q(x)} = -\frac{P(x)}{Q(x)} \quad \implies \quad \frac{P(x)}{Q(x)}
  = -\frac{P(x)}{-Q(x)}$$


  **Desglose de la fórmula:**

  - $-Q(x)$: Denominador resultante de invertir el signo de cada uno de sus términos.

  - $-\frac{P(x)}{-Q(x)}$: Expresión equivalente que mantiene el valor real de la
  fracción mediante un signo negativo externo compensatorio.'
definiciones_clave: '- **Negación del denominador**: Multiplicación de cada término
  del denominador por $-1$.

  - **Reordenamiento de denominador**: Técnica para transformar denominadores de la
  forma $(b - a)$ en $-(a - b)$.'
propiedades_relaciones: '- **Denominadores opuestos**: $\frac{P(x)}{b - a} = -\frac{P(x)}{a
  - b}$.

  - **Doble cambio de signo**: Cambiar el signo al numerador Y al denominador simultáneamente
  no altera el signo global: $\frac{-P(x)}{-Q(x)} = \frac{P(x)}{Q(x)}$.'
ejemplo_guiado:
  enunciado: Transforma la fracción $\frac{5x}{2 - x}$ para que su denominador tenga
    la forma $(x - 2)$ con la variable positiva, y evalúa ambas expresiones para $x
    = 6$.
  pasos:
  - 'Paso 1: Multiplicar el denominador $(2 - x)$ por $-1$: $-(2 - x) = -2 + x = x
    - 2$.Paso 2: Colocar un signo negativo compensatorio delante de la fracción: $\frac{5x}{2
    - x} = -\frac{5x}{x - 2}$.Paso 3: Evaluar la expresión original en $x = 6$: $\frac{5(6)}{2
    - 6} = \frac{30}{-4} = -\frac{15}{2}$.Paso 4: Evaluar la expresión modificada
    en $x = 6$: -\frac{5(6)}{6 - 2} = -\frac{30}{4} = -\frac{15}{2}$ (se verifica
    la igualdad).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a $\frac{5x}{2 - x}$ tras cambiar el
    signo de los términos de su denominador?
  choices:
  - text: $-\frac{5x}{x - 2}$
    is_correct: true
  - text: $\frac{5x}{x - 2}$
    is_correct: false
  - text: $-\frac{5x}{2 + x}$
    is_correct: false
  - text: $\frac{-5x}{x + 2}$
    is_correct: false
  explanation: La alternativa correcta es '$-\frac{5x}{x - 2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar $-\frac{5x}{x - 2}$ para $x = 6$, ¿cuál es el resultado simplificado?
  choices:
  - text: $-\frac{15}{2}$
    is_correct: true
  - text: $\frac{15}{2}$
    is_correct: false
  - text: $-\frac{30}{2}$
    is_correct: false
  - text: $\frac{15}{4}$
    is_correct: false
  explanation: La alternativa correcta es '$-\frac{15}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el polinomio denominador $Q(x)$.'
- 'Paso 2: Cambiar el signo a CADA término del denominador para obtener $-Q(x)$.'
- 'Paso 3: Colocar un signo negativo precediendo a toda la fracción.'
- 'Paso 4: Escribir la expresión equivalente final sobre el nuevo denominador $-Q(x)$.'
errores_correccion: '- **Error común:** Cambiar el signo del denominador sin colocar
  el signo menos compensatorio fuera de la fracción.

  - **Cómo corregirlo:** Si conviertes el denominador de $(b - a)$ a $(a - b)$, estás
  multiplicando por $-1$. Debes anteponer un signo minus a la fracción entera.'
ejemplos:
- titulo: 'Ejemplo 1: Denominador binomio invertido'
  enunciado: Expresa $\frac{x + 1}{4 - x}$ con denominador $(x - 4)$.
  alternativas:
  - $-\frac{x + 1}{x - 4}$
  - $\frac{x + 1}{x - 4}$
  - $-\frac{x + 1}{x + 4}$
  respuesta: $-\frac{x + 1}{x - 4}$
  solucion_pasos:
  - '1. Denominador $4 - x = -(x - 4)$.2. Expresión equivalente: $-\frac{x + 1}{x
    - 4}$.'
- titulo: 'Ejemplo 2: Homogeneización de denominadores opuestos'
  enunciado: Transforma la resta $\frac{3}{x - 2} - \frac{5}{2 - x}$ a denominadores
    iguales.
  alternativas:
  - $\frac{3}{x - 2} + \frac{5}{x - 2}$
  - $\frac{3}{x - 2} - \frac{5}{x - 2}$
  - $\frac{3 - 5}{x - 2}$
  respuesta: $\frac{3}{x - 2} + \frac{5}{x - 2}$
  solucion_pasos:
  - 1. Cambiar signo a $\frac{5}{2 - x} = -\frac{5}{x - 2}$.2. La resta previa $-
    \left(-\frac{5}{x - 2}\right)$ se transforma en suma $+ \frac{5}{x - 2}$.
- titulo: ¿La fracción $\frac{P(x)}{b - a}$ es exactamente igual a $-\frac{P(x)}{a
    - b}$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Invertir la resta $(b - a) = -(a - b)$ requiere anteponer un signo negativo
    global a la fracción.
- titulo: ¿Si cambiamos el signo al numerador Y al denominador al mismo tiempo, la
    fracción mantiene su signo global?
  respuesta: Sí
  solucion_pasos:
  - Sí. Multiplicar arriba y abajo por $-1$ es multiplicar por $(-1)/(-1) = 1$, por
    lo que la fracción no cambia de signo.
errores_frecuentes:
- La expresión $\frac{x}{b - a}$ es igual a $\frac{x}{a - b}$.
- Cambiar de signo el denominador no afecta el valor final de la fracción.
- Al cambiar de signo el denominador $3 - x$ se obtiene $3 + x$.
- La fracción $-\frac{A}{-B}$ es igual a $-\frac{A}{B}$.
- Un signo negativo fuera de la fracción se aplica al numerador y al denominador al
  mismo tiempo.
afirmaciones_verdaderas:
- Cambiar el signo de todos los términos del denominador exige anteponer un signo
  menos a la fracción completa.
- Las expresiones $\frac{P(x)}{1 - x}$ y $-\frac{P(x)}{x - 1}$ son algebraicamente
  idénticas.
al_terminar_debes_poder: Al finalizar este recurso podrás ejecutar el cambio de signo
  en el denominador para igualar y manipular fracciones algebraicas.
