semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DEFINICION
resumen_inicial: 'La función logarítmica básica es una función real de variable real $f: \mathbb{R}^+ \to \mathbb{R}$ definida por $f(x) = \log_b(x)$, con base $b > 0, b \neq 1$, que asigna a cada número positivo su exponente correspondiente, siendo la inversa continua de la función exponencial $b^x$.'
explicacion_simple: "![La función logarítmica básica es una función real de variable real $f: \\mathbb{R}^+ \\to \\mathbb{R}$ definida por $f(x) = \\log_b(x)$, con base $b > 0, b \\neq 1$, que asigna a cada número positivo su exponente correspondiente, siendo la inversa continua de la función exponencial $b^x$](/static/img/nodos/definicion-de-funcion-logaritmica-intro.svg)\n\n\nLa **función logarítmica** es la máquina matemática inversa de la función exponencial:\n\n$$f(x) = \\log_b(x) \\quad \\Longleftrightarrow \\quad y = \\log_b(x) \\iff b^y = x$$\n\n- **¿Cómo funciona?**\n  - Le entregas un número positivo $x > 0$ (el argumento).\n  - Te devuelve la altura $y$ que corresponde al exponente que necesita la base $b$.\n- **Rasgos fundamentales:**\n  - **Dominio:** $\\operatorname{Dom}(f) = ]0, +\\infty[$ (solo acepta números estrictamente positivos).\n  - **Recorrido:** $\\operatorname{Rec}(f) = \\mathbb{R}$ (sus valores van desde $-\\infty$ hasta $+\\infty$).\n  - **Punto fijo canónico:**\
  \ Siempre pasa por $(1, 0)$ porque $\\log_b(1) = 0$."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$. Se define la función logarítmica en base $b$ como la aplicación inversa $f = \exp_b^{-1}: \mathbb{R}^+ \to \mathbb{R}$:

  $$f(x) = \log_b(x) = \frac{\ln(x)}{\ln(b)}$$


  **Propiedades topológicas y analíticas**:

  1. **Continuidad y diferenciabilidad**: $f \in C^\infty(\mathbb{R}^+)$, con derivada primera $f''(x) = \frac{1}{x \ln(b)}$.

  2. **Biyectividad**: $f$ es estrictamente monótona e inyectiva en todo su dominio $\mathbb{R}^+$, con codominio y recorrido $\mathbb{R}$.

  3. **Simetría axial**: La gráfica $\operatorname{Gr}(f)$ es la reflexión especular de $\operatorname{Gr}(\exp_b)$ respecto a la recta identidad $y = x$.'
definiciones_clave: '- **Función logarítmica**: Función inversa de la exponencial con regla $f(x) = \log_b(x)$.

  - **Base logarítmica ($b$)**: Constante real positiva distinta de uno que define la curvatura de la función.

  - **Dominio logarítmico**: Semieje real estrictamente positivo $]0, +\infty[$.'
propiedades_relaciones: '- **Composición cancelativa**: $f(b^x) = x$ para todo $x \in \mathbb{R}$, y $b^{f(x)} = x$ para todo $x > 0$.

  - **Invarianza del cero**: $f(1) = 0$ y $f(b) = 1$ para cualquier base $b$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función logarítmica básica es una función real de variable real $f: \mathbb{R}^+ \to \mathbb{R}$ definida por $f(x) = \log_b(x)$, con base $b > 0, b \neq 1$, que asigna a cada número positivo su exponente correspondiente, siendo la inversa continua de la función exponencial $b^x$](/static/img/nodos/definicion-de-funcion-logaritmica-ejemplos.svg)



    Dada la función $f(x) = \log_3(x)$:

    1) Determina su dominio y recorrido.

    2) Evalúa $f(1)$, $f(3)$, $f(27)$ y $f(1/9)$.

    3) Grafica mentalmente su comportamiento respecto a $y = x$.'
  pasos:
  - 'Paso 1: Dominio y recorrido:

    - $\operatorname{Dom}(f) = ]0, +\infty[$ (todos los números reales mayores que cero).

    - $\operatorname{Rec}(f) = \mathbb{R}$ (todos los números reales).'
  - 'Paso 2: Evaluaciones puntuales:

    - $f(1) = \log_3(1) = \mathbf{0}$ (punto $(1, 0)$).

    - $f(3) = \log_3(3) = \mathbf{1}$ (punto $(3, 1)$).

    - $f(27) = \log_3(3^3) = \mathbf{3}$ (punto $(27, 3)$).

    - $f(1/9) = \log_3(3^{-2}) = \mathbf{-2}$ (punto $(1/9, -2)$).'
  - 'Paso 3: La gráfica es la reflexión de $y = 3^x$ respecto a $y = x$, creciendo lentamente hacia la derecha.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función básica $f(x) = \log_7(x)$?
  choices:
  - text: ']0, +∞[ (reales estrictamente positivos)'
    is_correct: true
  - text: '[0, +∞[ (incluyendo el cero)'
    is_correct: false
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']1, +∞['
    is_correct: false
  explanation: La alternativa correcta es ']0, +∞[ (reales estrictamente positivos)'. El argumento de un logaritmo real debe ser estrictamente mayor que cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $f(x) = \log_2(x)$, ¿cuánto vale $f(0,125)$?
  choices:
  - text: -3 (porque 0,125 = 1/8 = 2⁻³)
    is_correct: true
  - text: '3'
    is_correct: false
  - text: -0,25
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '-3 (porque 0,125 = 1/8 = 2⁻³)'. $2^{-3} = 1/8 = 0,125 \implies f(0,125) = -3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ de la función y verificar que $b > 0, b \neq 1$.'
- 'Paso 2: Declarar el dominio $\operatorname{Dom}(f) = ]0, +\infty[$ y el recorrido $\operatorname{Rec}(f) = \mathbb{R}$.'
- 'Paso 3: Evaluar valores de entrada $x = b^k$ para obtener puntos $(b^k, k)$ exactos.'
- 'Paso 4: Trazar la curva logarítmica pasando por $(1, 0)$ y $(b, 1)$ con asíntota vertical en $x = 0$.'
errores_correccion: '- **Error común:** Intentar evaluar la función en $x = 0$ o números negativos.

  - **Cómo corregirlo:** La función logarítmica **solo acepta números estrictamente positivos**: $\operatorname{Dom}(f) = ]0, +\infty[$.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación directa'
  enunciado: 'Si $f(x) = \log_4(x)$, calcula $f(64)$:'
  alternativas:
  - '3'
  - '16'
  - '4'
  - 1/3
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $f(64) = \log_4(4^3) = 3$.'
- titulo: 'Ejemplo 2: Evaluación con fracción'
  enunciado: Si $g(x) = \log_5(x)$, ¿cuánto vale $g(1/25)$?
  alternativas:
  - '-2'
  - '2'
  - 1/2
  - '-5'
  respuesta: '-2'
  solucion_pasos:
  - 'Paso 1: $g(1/25) = \log_5(5^{-2}) = -2$.'
- titulo: 'Ejemplo 3: Dominio de función básica'
  enunciado: ¿Cuál es el dominio de $h(x) = \ln(x)$?
  alternativas:
  - ']0, +inf['
  - '[0, +inf['
  - R
  - '[1, +inf['
  respuesta: ']0, +inf['
  solucion_pasos:
  - 'Paso 1: Argumento $> 0 \implies ]0, +\infty[$.'
- titulo: 'Ejemplo 4: Recorrido de función básica'
  enunciado: ¿Cuál es el conjunto recorrido de $f(x) = \log_{10}(x)$?
  alternativas:
  - R (todos los reales)
  - ']0, +inf['
  - '[0, +inf['
  - ']-10, 10['
  respuesta: R (todos los reales)
  solucion_pasos:
  - 'Paso 1: El recorrido de la función logarítmica es todo $\mathbb{R}$.'
errores_frecuentes:
- Confundir el dominio ]0, +inf[ con el recorrido R.
- Pensar que la función logarítmica se corta en el eje Y en (0, 1).
- Olvidar que f(1) es siempre igual a cero.
afirmaciones_verdaderas:
- La función logarítmica es la inversa biyectiva continua de la función exponencial de igual base.
- El dominio de la función básica es ]0, +∞[ y su recorrido es ℝ.
al_terminar_debes_poder: '**QUÉ:** Definir, evaluar y caracterizar la función logarítmica básica.


  **CÓMO:** Identificando f(x) = log_b(x) como la inversa de bˣ con dominio ]0, +∞[ y recorrido ℝ.


