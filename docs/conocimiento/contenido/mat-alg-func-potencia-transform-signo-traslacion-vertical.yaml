semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.SIGNO_TRASLACION_VERTICAL
resumen_inicial: 'Interpretación del signo de k en una función potencia trasladada
  verticalmente: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones
  y escalas.'
explicacion_simple: A diferencia de la traslación horizontal, en este caso el signo
  de $k$ coincide directamente con la dirección visual del desplazamiento.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot x^n+k$, un valor $k>0$ suma directamente al resultado de $a\cdot
  x^n$, elevando toda la curva. Un valor $k<0$ resta, bajando toda la curva. A diferencia
  de la traslación horizontal, no hay inversión de signo entre la expresión y la dirección
  del movimiento.


  ### Desarrollo didáctico


  $f(x)=x^3+4$ con $k=4>0$ se desplaza hacia arriba: su punto de paso, antes en $(0,0)$,
  ahora está en $(0,4)$. $f(x)=x^3-4$ con $k=-4<0$ se desplaza hacia abajo: su punto
  de paso ahora está en $(0,-4)$.'
definiciones_clave: '- **Interpretación del signo de k en una función potencia trasladada
  verticalmente**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a interpretación del signo de k en una función potencia trasladada
  verticalmente.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de interpretación del signo de k en una función potencia trasladada verticalmente.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de interpretación del signo
    de k en una función potencia trasladada verticalmente.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
