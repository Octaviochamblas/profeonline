semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.SIGNO_TRASLACION_VERTICAL
resumen_inicial: 'En la expresión de una función potencia trasladada $g(x) = a x^n + k$, un signo positivo $+k$ desplaza la gráfica hacia arriba, y un signo negativo $-k$ la desplaza hacia abajo.'
explicacion_simple: |
  A diferencia de la traslación horizontal donde el signo dentro del paréntesis parece invertido, la traslación vertical sigue exactamente la intuición del signo visual. Cuando sumamos $+k$ por fuera de la potencia (por ejemplo $x^3 + 5$), la gráfica se desplaza 5 unidades hacia **arriba** (dirección $+y$). Cuando restamos $-k$ (por ejemplo $x^3 - 5$), la gráfica se desplaza 5 unidades hacia **abajo** (dirección $-y$). El nuevo vértice u origen pasa de $(0, 0)$ a $(0, k)$.
explicacion_formal: |
  ### Definición formal
  La **regla de los signos para la traslación vertical** en la familia de funciones potencia $g(x) = a x^n + k$ con $k \in \mathbb{R}$ se rige analíticamente por la constante aditiva agregada a la variable dependiente $y$:

  1. **Desplazamiento Hacia Arriba ($k > 0$)**:
     - Estructura algebraica: $g(x) = a x^n + c$ con $c > 0$.
     - Regla geométrica: La gráfica se desplaza $c$ unidades hacia **arriba** ($+y$). El vértice o punto central pasa a $(0, c)$.

  2. **Desplazamiento Hacia Abajo ($k < 0$)**:
     - Estructura algebraica: $g(x) = a x^n - c$ con $c > 0$.
     - Regla geométrica: La gráfica se desplaza $c$ unidades hacia **abajo** ($-y$). El vértice o punto central pasa a $(0, -c)$.

  ### Síntesis didáctica
  Identificación directa en $x = 0$: Dado que $a(0)^n = 0$, la constante externa $k$ representa exactamente la ordenada al origen de la función trasladada:
  $$g(0) = a(0)^n + k = k \implies (0, k)$$
  Si $k > 0 \implies$ traslación vertical hacia arriba. Si $k < 0 \implies$ traslación vertical hacia abajo.
definiciones_clave: |
  - **Constante aditiva $+k$**: Término constante que desplaza la gráfica hacia la parte superior del plano cartesiano ($k > 0$).
  - **Constante sustractiva $-k$**: Término constante que desplaza la gráfica hacia la parte inferior del plano cartesiano ($k < 0$).
  - **Ordenada al origen $y = k$**: Altura del punto de corte de la función con el eje vertical.
propiedades_relaciones: |
  - **Impacto directo en cotas de recorrido**: Para exponentes pares con $a > 0$, la constante $k$ redefine la cota mínima de $[0, +\infty[$ al nuevo recorrido $[k, +\infty[$.
  - **Relación con asíntotas horizontales**: En potencias de exponente negativo $a x^{-m} + k$, la asíntota horizontal se desplaza a la recta $y = k$.
ejemplo_guiado:
  enunciado: 'Determina la dirección, la cantidad de unidades de traslación y las coordenadas del nuevo vértice para las siguientes funciones potencia: A) $f(x) = 4x^2 + 7$, B) $g(x) = -x^3 - 3$.'
  pasos:
    - 'Paso 1: Para $f(x) = 4x^2 + 7$, la constante externa es $k = +7 > 0$.'
    - 'Paso 2: La gráfica se desplaza **7 unidades hacia arriba**. El nuevo vértice se ubica en el punto $(0, 7)$.'
    - 'Paso 3: Para $g(x) = -x^3 - 3$, la constante externa es $k = -3 < 0$.'
    - 'Paso 4: La gráfica se desplaza **3 unidades hacia abajo**. El nuevo punto de inflexión se ubica en el punto $(0, -3)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Hacia qué dirección y en cuántas unidades se desplaza la gráfica de la función potencia $f(x) = -2x^4 - 9$ respecto a la función base $y = -2x^4$?'
    choices:
      - {text: 'Se desplaza 9 unidades hacia abajo, ubicando su vértice en $(0, -9)$', is_correct: true}
      - {text: 'Se desplaza 9 unidades hacia arriba, ubicando su vértice en $(0, 9)$', is_correct: false}
      - {text: 'Se desplaza 9 unidades hacia la izquierda', is_correct: false}
      - {text: 'Se desplaza 9 unidades hacia la derecha', is_correct: false}
    explanation: 'La alternativa correcta es ''Se desplaza 9 unidades hacia abajo, ubicando su vértice en $(0, -9)$''. La constante aditiva $-9$ por fuera de la potencia desplaza la curva 9 unidades en dirección $-y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función potencia recíproca $f(x) = \frac{1}{x^2} + 5$, ¿cuál es la ecuación de su asíntota horizontal?'
    choices:
      - {text: 'La recta horizontal de ecuación $y = 5$, trasladada 5 unidades hacia arriba', is_correct: true}
      - {text: 'La recta horizontal de ecuación $y = 0$', is_correct: false}
      - {text: 'La recta vertical de ecuación $x = 5$', is_correct: false}
      - {text: 'La recta de ecuación $y = -5$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal de ecuación $y = 5$, trasladada 5 unidades hacia arriba''. Sumar la constante $+5$ desplaza la asíntota horizontal de $y = 0$ a $y = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término constante independiente $k$ en la función $f(x) = a x^n + k$.'
  - 'Paso 2: Evaluar $f(0)$ para confirmar la ordenada del nuevo centro de referencia $(0, k)$.'
  - 'Paso 3: Si $k > 0$ (aparece como $+k$), declarar traslación hacia **arriba**.'
  - 'Paso 4: Si $k < 0$ (aparece como $-k$), declarar traslación hacia **abajo**.'
errores_correccion: |
  - **Error 1:** Creer que un término $-k$ por fuera desplaza la curva a la derecha por analogía con la traslación horizontal. **Cómo corregirlo:** La traslación **vertical** sigue el signo directo: $-k$ por fuera resta a las salidas $y$, desplazando la curva hacia abajo.
  - **Error 2:** Sumar $k$ a la variable dentro de la potencia (ej: $(x + k)^n$). **Cómo corregirlo:** Las traslaciones verticales ocurren agregando el término constante $k$ por fuera de la potencia completa: $a x^n + k$.
ejemplos:
  - titulo: 'Dirección en suma externa'
    enunciado: '¿La gráfica de $f(x) = x^3 + 8$ se desplaza 8 unidades hacia arriba?'
    alternativas:
      - 'Sí, hacia arriba'
      - 'No, hacia la derecha'
      - 'No, hacia abajo'
    respuesta: 'Sí, hacia arriba'
    solucion_pasos:
      - '1. La constante externa es $k = +8 > 0$.'
      - '2. Desplazamiento de 8 unidades hacia arriba.'
  - titulo: 'Dirección en resta externa'
    enunciado: '¿La gráfica de $g(x) = x^2 - 4$ tiene su vértice en $(0, -4)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(0) = 0^2 - 4 = -4 \implies$ vértice desplazado 4 unidades hacia abajo.'
  - titulo: 'Recorrido ajustado por el signo de k'
    enunciado: '¿El recorrido de $h(x) = x^4 - 2$ es $[-2, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La constante $-2$ desplaza la cota mínima del recorrido a $y = -2$.'
  - titulo: 'Asíntota trasladada hacia abajo'
    enunciado: '¿La asíntota horizontal de $p(x) = \frac{1}{x} - 6$ es $y = -6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El término $-6$ por fuera traslada la asíntota horizontal de $y = 0$ a $y = -6$.'
errores_frecuentes:
  - 'La función $f(x) = x^2 - 7$ se desplaza 7 unidades hacia arriba en el eje vertical.'
  - 'La afirmación de que añadir $+k$ a la función altera la posición del eje de simetría vertical.'
  - 'El signo negativo de $k = -3$ altera la concavidad de la curva haciéndola abrir hacia abajo.'
  - 'El vértice de la función $f(x) = x^4 + 2$ se ubica en el punto de coordenadas $(2, 0)$.'
  - 'La afirmación de que aplicar una constante $k$ modifica la concavidad o la orientación del signo de $a$.'
afirmaciones_verdaderas:
  - 'En la función potencia $f(x) = a x^n + k$, un signo $+k$ indica un desplazamiento directo de $k$ unidades hacia arriba (dirección $+y$), mientras que $-k$ indica un desplazamiento de $k$ unidades hacia abajo (dirección $-y$).'
  - 'El signo del parámetro de traslación vertical $k$ modifica la cota inferior o superior del recorrido para exponente par, fijándolo en $[k, +\infty[$ para $a > 0$ o en $]-\infty, k]$ para $a < 0$.'
al_terminar_debes_poder: |
  QUÉ: Analizar el desplazamiento del vértice o punto nodal $(0,0) \to (0,k)$ según el signo de $k$.
  CÓMO: Evaluar $f(0) = k$ determinando la nueva ordenada de intersección con el eje Y.
