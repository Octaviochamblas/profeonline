semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.METODO_TABLA_FACTORES_COMUNES
resumen_inicial: El M.C.D. por tabla simultánea divide los números ÚNICAMENTE por primos que dividan a TODOS los números a la vez.
explicacion_simple: 'Para calcular el M.C.D. en una tabla simultánea, dividimos los números en paralelo usando únicamente factores primos que dividan exactamente a TODOS los números de la fila al mismo tiempo. Cuando ya no exista ningún primo que los divida a todos, nos detenemos y multiplicamos los primos anotados.


  ![Cálculo del M.C.D. mediante tabla de factores comunes](/static/img/nodos/calculo-del-mcd-mediante-tabla-de-factores-comunes-intro.svg)'
explicacion_formal: 'En la **Tabla de Factores Primos Comunes**, las divisiones se aplican sobre la fila $(a_1, a_2, \dots, a_k)$ exigiendo estrictamente:


  $$p_j \in \text{Primos} \quad \text{tal que } \forall i \in \{1, \dots, k\}, \, p_j \mid a_i$$


  **Desglose de la fórmula:**

  - Condición de detención: $\operatorname{MCD}\left( \frac{a_1}{\prod p_j}, \dots, \frac{a_k}{\prod p_j} \right) = 1$ (cocientes coprimos).

  - $\operatorname{MCD}(a_1, \dots, a_k) = \prod_{j=1}^m p_j$: Multiplicación exclusiva de los primos comunes aplicados.


  > **Complemento didáctico:** A diferencia del m.c.m. (donde se dividía si al menos uno era divisible), en el M.C.D. es OBLIGATORIO que el primo divida a TODOS los números de la fila simultáneamente.'
definiciones_clave: '- **Tabla de factores comunes (M.C.D.)**: Algoritmo de división colectiva por primos comunes hasta obtener cocientes coprimos.'
ejemplo_guiado:
  enunciado: 'Calcule el $\operatorname{MCD}(36, 48)$ mediante la tabla de factores primos comunes.


    ![Ejemplo Cálculo del M.C.D. mediante tabla de factores comunes](/static/img/nodos/calculo-del-mcd-mediante-tabla-de-factores-comunes-ejemplos.svg)'
  pasos:
  - 'Paso 1: Fila 1 (36, 48). Ambos son divisibles por 2: $36:2=18, 48:2=24 \implies$ Fila 2 (18, 24). Primo: 2.'
  - 'Paso 2: Fila 2 (18, 24). Ambos son divisibles por 2: $18:2=9, 24:2=12 \implies$ Fila 3 (9, 12). Primo: 2.'
  - 'Paso 3: Fila 3 (9, 12). 9 no es divisible por 2, probamos con 3: $9:3=3, 12:3=4 \implies$ Fila 4 (3, 4). Primo: 3.'
  - 'Paso 4: Fila 4 (3, 4). No existe ningún primo que divida a 3 y a 4 al mismo tiempo ($\operatorname{MCD}(3,4)=1$). Detener la tabla.'
  - 'Paso 5: Multiplicar los primos comunes anotados: $2 \cdot 2 \cdot 3 = 12$.'
  - 'Conclusión: $\operatorname{MCD}(36, 48) = 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuándo se detiene la tabla simultánea de factores primos para el M.C.D.?
  choices:
  - text: Cuando ya no existe ningún primo que divida a TODOS los números de la fila a la vez
    is_correct: true
  - text: Cuando el primer número llega a 1
    is_correct: false
  - text: Cuando se hacen 3 divisiones
    is_correct: false
  - text: Cuando el resultado da negativo
    is_correct: false
  explanation: La alternativa correcta es 'Cuando ya no existe ningún primo que divida a TODOS los números de la fila a la vez'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 36 y 48, ¿cuál fue el M.C.D. obtenido?
  choices:
  - text: '12'
    is_correct: true
  - text: '144'
    is_correct: false
  - text: '6'
    is_correct: false
  - text: '24'
    is_correct: false
  explanation: La alternativa correcta es '12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar los números en fila.'
- 'Paso 2: Buscar un primo que divida a TODOS los números de la fila y anotar el resultado en la fila siguiente.'
- 'Paso 3: Repetir hasta que los cocientes de la fila no compartan divisores primos comunes.'
- 'Paso 4: Multiplicar los primos de la columna derecha para calcular el M.C.D.'
errores_correccion: '- **Error 1: Dividir por un primo que solo divide a uno de los números (confundir con m.c.m.).** **Cómo corregirlo:** En el M.C.D., el primo DEBE dividir a TODOS los números de la fila obligatoriamente.


  - **Error 2: Continuar dividiendo cuando los números de la fila son coprimos.** **Cómo corregirlo:** Si $\operatorname{MCD}(a,b)=1$, la tabla se detiene de inmediato.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el M.C.D.(24, 60) por la tabla de factores comunes.
  alternativas:
  - '12'
  - '120'
  - '6'
  respuesta: '12'
  solucion_pasos:
  - 'Fila 1: (24, 60) : 2 -> (12, 30) : 2 -> (6, 15) : 3 -> (2, 5). MCD = $2 \cdot 2 \cdot 3 = 12$.'
- titulo: Ejemplo 2
  enunciado: En la tabla de factores comunes para M.C.D., ¿qué ocurre cuando se llega a los cocientes (3, 5)?
  alternativas:
  - Se detiene el proceso porque 3 y 5 son coprimos
  - Se sigue dividiendo por 3
  - Se multiplican por 0
  respuesta: Se detiene el proceso porque 3 y 5 son coprimos
  solucion_pasos:
  - Al no haber primos que dividan a 3 y 5 al mismo tiempo, el algoritmo termina.
- titulo: ¿Se diferencia la tabla del M.C.D. de la del m.c.m. en que exige división a todos los números?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la diferencia metodológica clave entre ambos.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al mayor divisor común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCD entrega un valor entero único bien determinado.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla común, potencias primas y algoritmo de Euclides son deterministas y exactos.
- titulo: ¿Es el M.C.D.(16, 20) igual a 4 usando la tabla de factores comunes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $16:2=8, 20:2=10 \implies 8:2=4, 10:2=5 \implies MCD = 2 \cdot 2 = 4$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al mayor divisor común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCD entrega un valor entero único bien determinado.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla común, potencias primas y algoritmo de Euclides son deterministas y exactos.
errores_frecuentes:
- En la tabla del M.C.D. se puede dividir por un primo aunque solo divida a uno de los números.
- El algoritmo de la tabla del M.C.D. exige llegar siempre a unos en todas las columnas.
- Si un primo divide a dos de tres números se debe aplicar la división en la tabla del M.C.D.
- El M.C.D. se calcula sumando todos los números de la columna de división.
- La tabla del M.C.D. produce el mismo resultado que multiplicar directamente los números.
afirmaciones_verdaderas:
- La tabla del M.C.D. exige que los divisores primos dividan simultáneamente a todos los números de la fila.
- El algoritmo se detiene cuando los cocientes obtenidos son primos entre sí (coprimos).
al_terminar_debes_poder: '**QUÉ:** Calcular el máximo común divisor de dos o más números mediante la tabla vertical de factores primos comunes.


  **CÓMO:** Dividiendo simultáneamente por factores primos que dividan estrictamente a todos los números a la vez, deteniendo el algoritmo en cuanto los cocientes resultantes sean coprimos, y multiplicando la columna de factores.


  ![Resumen Cálculo del M.C.D. mediante tabla de factores comunes](/static/img/nodos/calculo-del-mcd-mediante-tabla-de-factores-comunes-resumen.svg)'
