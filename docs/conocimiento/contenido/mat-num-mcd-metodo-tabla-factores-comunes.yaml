semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.METODO_TABLA_FACTORES_COMUNES
resumen_inicial: "El método de la tabla de factores comunes calcula el MCD dividiendo simultáneamente varios números por sus factores primos comunes, hasta que ya no comparten ninguno."
explicacion_simple: |
  ¿Te imaginas simplificar el trabajo de calcular divisores para varios números a la vez?
  Existe un método ordenado que consiste en colocar los números en una tabla y dividirlos
  al mismo tiempo. El secreto es que solo podemos usar divisores primos que sirvan para
  todos los números a la vez. En cuanto uno ya no comparta el mismo factor primo, nos
  detenemos y multiplicamos los divisores usados.
explicacion_formal: |
  En el **Método de la Tabla de Factores Comunes**, se colocan los números en fila, se
  busca el menor factor primo que divida a **todos** simultáneamente, se dividen y se
  repite hasta que los cocientes ya no compartan ningún factor primo (sean coprimos entre
  sí). El MCD es el producto de los factores usados. Para $60,90$: dividiendo por $2,3,5$
  se llega a $2,3$ (coprimos), y $\text{MCD}(60,90)=2\cdot3\cdot5=30$.
definiciones_clave: |
  **Factor primo común**: primo que divide a la vez a todos los números de la fila; el
  proceso se detiene cuando ya no existe ninguno.
propiedades_relaciones: |
  A diferencia de la tabla simultánea del MCM (que copia los números no divisibles), aquí
  solo se usan factores que dividen a TODOS los números a la vez; si un factor no divide a
  uno de ellos, no se usa.
ejemplo_guiado:
  enunciado: "Calcula el MCD de 28 y 42 con la tabla de factores comunes."
  pasos:
    - "Ambos son divisibles por 2: $28\\to14$, $42\\to21$."
    - "Ambos son divisibles por 7: $14\\to2$, $21\\to3$. El 2 y el 3 ya no comparten factores."
    - "Conclusión: $\\text{MCD}(28,42)=2\\cdot7=14$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuándo se detiene el proceso de la tabla de factores comunes?"
    choices:
      - {text: "Cuando los cocientes obtenidos ya no comparten ningún factor primo", is_correct: true}
      - {text: "Cuando uno de los cocientes llega a 1", is_correct: false}
      - {text: "Después de exactamente tres divisiones", is_correct: false}
      - {text: "Cuando los cocientes son todos pares", is_correct: false}
    explanation: "La correcta es Cuando los cocientes obtenidos ya no comparten ningún factor primo: en ese punto son coprimos entre sí."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCD de 18 y 24?"
    choices:
      - {text: "6", is_correct: true}
      - {text: "2", is_correct: false}
      - {text: "72", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 6: dividiendo por 2 y luego por 3 se llega a cocientes coprimos, y $2\\cdot3=6$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Coloca los números en una fila horizontal y traza una línea vertical a la derecha de ellos.'
  - 'Paso 2: Divide todos los números de la fila simultáneamente por un factor primo común (como 2, 3, 5, etc.) que los divida exactamente.'
  - 'Paso 3: Escribe los cocientes obtenidos debajo de sus respectivos números y coloca el factor primo utilizado a la derecha de la línea vertical.'
  - 'Paso 4: Repite el proceso con los nuevos cocientes hasta que ya no exista ningún factor primo que sea común a todos ellos.'
  - 'Paso 5: Multiplica todos los factores primos anotados a la derecha de la línea vertical. El resultado es el MCD.'
errores_correccion: |
  Un error frecuente es continuar dividiendo un número de forma individual cuando el
  factor no es común a todos los demás (confundiéndose con el cálculo del MCM). Otro error
  es olvidar multiplicar los factores primos anotados al final.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Calcula el MCD de $36$ y $48$ usando el método de la tabla de factores comunes.
    alternativas:
      - "12"
      - "6"
      - "144"
    respuesta: "12"
    solucion_pasos:
      - 'Paso a: Escribimos los números $36$ y $48$. Ambos son pares, así que dividimos por el factor primo común $2$. Nos quedan $18$ y $24$ a la izquierda, y anotamos $2$ a la derecha.'
      - 'Paso b: $18$ y $24$ también son pares, así que dividimos nuevamente por $2$. Nos quedan $9$ y $12$ a la izquierda, y anotamos otro $2$ a la derecha.'
      - 'Paso c: $9$ y $12$ no son ambos pares, pero ambos son divisibles por $3$. Dividimos por $3$, obteniendo cocientes $3$ y $4$ a la izquierda, y anotando $3$ a la derecha.'
      - 'Paso d: Los cocientes $3$ y $4$ no tienen divisores comunes distintos de $1$. Detenemos el proceso.'
      - 'Paso e: Multiplicamos los factores de la derecha: $2 \cdot 2 \cdot 3 = 12$. Por ende, $\text{MCD}(36, 48) = 12$.'
  - titulo: Ejemplo 2
    enunciado: Encuentra el MCD de $30, 45$ y $75$ mediante la tabla de divisiones simultáneas.
    alternativas:
      - "15"
      - "5"
      - "3"
    respuesta: "15"
    solucion_pasos:
      - 'Paso a: Escribimos $30$, $45$ y $75$. No todos son pares, pero todos son divisibles por el factor primo $3$. Dividimos por $3$, obteniendo $10$, $15$ y $25$. Anotamos $3$ a la derecha.'
      - 'Paso b: $10$, $15$ y $25$ no son divisibles por $3$ simultáneamente. Sin embargo, todos terminan en $0$ o $5$, por lo que son divisibles por $5$. Dividimos por $5$, obteniendo cocientes $2$, $3$ y $5$. Anotamos $5$ a la derecha.'
      - 'Paso c: Los cocientes $2$, $3$ y $5$ no tienen divisores comunes mayores que $1$. Detenemos el proceso.'
      - 'Paso d: Multiplicamos los factores de la derecha: $3 \cdot 5 = 15$. Por ende, $\text{MCD}(30, 45, 75) = 15$.'
  - titulo: 'Si usamos el método de la tabla de factores comunes para $24$ y $36$, ¿el primer cociente que obtenemos al dividir por $2$ es $12$ y $18$ respectivamente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Colocamos los números $24$ y $36$ y dividimos entre el factor común $2$.'
      - 'Al realizar $24 \div 2$ obtenemos $12$, y al realizar $36 \div 2$ obtenemos $18$.'
      - 'Por lo tanto, la afirmación es correcta.'
  - titulo: '¿Debemos continuar dividiendo en la tabla de factores comunes de $12$ y $18$ si llegamos a los cocientes $2$ y $3$?'
    respuesta: 'No'
    solucion_pasos:
      - 'Los cocientes obtenidos son $2$ y $3$.'
      - 'Dado que $2$ y $3$ son números primos entre sí (coprimos) y no comparten factores comunes mayores que $1$, el proceso se detiene en este paso.'
errores_frecuentes:
  - Continuar dividiendo un número de forma individual cuando el factor no es común a todos los demás números de la fila (este es un error típico al confundirse con el cálculo del MCM).
  - Olvidar multiplicar los factores primos anotados al final a la derecha para obtener el MCD, dejando solo la lista de factores.
  - Usar números compuestos a la derecha en lugar de factores primos (aunque funciona si se hace con cuidado, es propenso a errores de división).
  - No detectar que un factor común existe y detener la tabla antes de tiempo, obteniendo un MCD menor al real.
  - Colocar factores en la columna derecha que no dividen de manera exacta a alguno de los números del conjunto a la izquierda.
al_terminar_debes_poder: |
  Calcular el MCD de dos o más números mediante el método de la tabla de factores comunes.
fuente: Teoría de Números
estado: publicado
