semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.INTERCEPTO_X
resumen_inicial: El cálculo del intercepto de la función logarítmica con el eje $X$ determina el punto cartesiano $(x_0, 0)$ donde la curva corta al eje horizontal, obtenido al resolver $f(x) = 0 \Longleftrightarrow \operatorname{Arg}(x) = 1$, siendo el punto canónico universal $(1, 0)$ para funciones básicas.
explicacion_simple: "![El cálculo del intercepto de la función logarítmica con el eje $X$ determina el punto cartesiano $(x_0, 0)$ donde la curva corta al eje horizontal, obtenido al resolver $f(x) = 0 \\Longleftrightarrow \\operatorname{Arg}(x) = 1$, siendo el punto canónico universal $(1, 0)$ para funciones básicas](/static/img/nodos/calculo-del-intercepto-de-la-funcion-logaritmica-con-el-eje-x-intro.svg)\n\n\nEl **intercepto con el eje horizontal $X$** es el lugar donde la altura de la curva es cero ($y = 0$):\n\n$$\\log_b(x) = 0 \\quad \\Longleftrightarrow \\quad x = b^0 = \\mathbf{1} \\quad \\implies \\quad P_X(\\mathbf{1, 0})$$\n\n- **¿Por qué pasa siempre por $(1, 0)$?**\n  - Porque cualquier base elevada a cero da 1 ($b^0 = 1$).\n  - $\\log_2(1) = 0, \\quad \\log_{10}(1) = 0, \\quad \\ln(1) = 0, \\quad \\log_{0,5}(1) = 0$.\n- **¿Y si la función está trasladada?**\n  - Solo igualas el argumento a 1: en $f(x) = \\log_3(x - 4)$, haces $x - 4 = 1 \\implies x = 5 \\implies (5, 0)$."
explicacion_formal: 'Sea $f(x) = a \log_b(g(x)) + k$ con $a \neq 0$. El intercepto con el eje de abscisas se define como el conjunto de ceros o raíces $\mathcal{Z}(f) = \{x \in \operatorname{Dom}(f) \mid f(x) = 0\}$:

  $$a \log_b(g(x)) + k = 0 \implies \log_b(g(x)) = -\frac{k}{a} \implies g(x) = b^{-k/a}$$


  **Caso elemental ($a = 1, k = 0, g(x) = x$)**:

  $$\log_b(x) = 0 \Longleftrightarrow x = b^0 = 1 \implies P_X(1, 0)$$

  Este punto $P_0(1, 0)$ es el cero invariante universal de todas las funciones logarítmicas canónicas.'
definiciones_clave: '- **Intercepto con el eje $X$ / Cero canónico**: Punto $(1, 0)$ donde la función logarítmica básica cruza el eje de abscisas.

  - **Ecuación de raíz**: Condición $f(x) = 0$ que produce el corte horizontal.'
propiedades_relaciones: '- **Punto pivote universal**: Todas las funciones logarítmicas básicas $y = \log_b(x)$ se cortan mutuamente en $(1, 0)$.

  - **Dualidad con la exponencial**: La exponencial corta al eje $Y$ en $(0, 1)$; el logaritmo corta al eje $X$ en $(1, 0)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo del intercepto de la función logarítmica con el eje $X$ determina el punto cartesiano $(x_0, 0)$ donde la curva corta al eje horizontal, obtenido al resolver $f(x) = 0 \Longleftrightarrow \operatorname{Arg}(x) = 1$, siendo el punto canónico universal $(1, 0)$ para funciones básicas](/static/img/nodos/calculo-del-intercepto-de-la-funcion-logaritmica-con-el-eje-x-ejemplos.svg)



    Calcula el intercepto con el eje $X$ de las siguientes funciones:

    1) $f(x) = \log_6(x)$

    2) $g(x) = \log_2(x - 5)$

    3) $h(x) = 2\log_3(x + 1) - 4$'
  pasos:
  - 'Paso 1: Para $f(x) = \log_6(x)$:

    - $\log_6(x) = 0 \implies x = 6^0 = 1$.

    - **Punto: $\mathbf{(1, 0)}$**.'
  - 'Paso 2: Para $g(x) = \log_2(x - 5)$:

    - $x - 5 = 1 \implies x = 6$.

    - **Punto: $\mathbf{(6, 0)}$**.'
  - 'Paso 3: Para $h(x) = 2\log_3(x + 1) - 4$:

    - $2\log_3(x + 1) = 4 \implies \log_3(x + 1) = 2$.

    - $x + 1 = 3^2 = 9 \implies x = 8$.

    - **Punto: $\mathbf{(8, 0)}$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje X la función básica $f(x) = \ln(x)$?
  choices:
  - text: (1, 0)
    is_correct: true
  - text: (0, 1)
    is_correct: false
  - text: (e, 0)
    is_correct: false
  - text: (0, 0)
    is_correct: false
  explanation: La alternativa correcta es '(1, 0)'. Como $\ln(1) = 0$, el punto de corte con el eje horizontal es exactamente $(1, 0)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el corte con el eje X de la función $f(x) = \log_5(x + 3)$?
  choices:
  - text: (-2, 0) (porque x + 3 = 1 ⟹ x = -2)
    is_correct: true
  - text: (2, 0)
    is_correct: false
  - text: (1, 0)
    is_correct: false
  - text: (-3, 0)
    is_correct: false
  explanation: 'La alternativa correcta es ''(-2, 0) (porque x + 3 = 1 ⟹ x = -2)''. El argumento debe ser igual a 1 para que el logaritmo se anule: $x + 3 = 1 \implies x = -2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $f(x) = 0$.'
- 'Paso 2: Despejar el término logarítmico $\log_b(g(x)) = c$.'
- 'Paso 3: Pasar a forma exponencial $g(x) = b^c$ y despejar la incógnita $x_0$.'
- 'Paso 4: Escribir las coordenadas del intercepto como $(x_0, 0)$.'
errores_correccion: '- **Error común:** Confundir las coordenadas escribiendo $(0, 1)$ en lugar de $(1, 0)$.

  - **Cómo corregirlo:** En el eje $X$, **la altura es CERO ($y = 0$)**: el punto es **$(1, 0)$**.'
ejemplos:
- titulo: 'Ejemplo 1: Corte básico'
  enunciado: ¿Cuál es el intercepto con el eje X de $f(x) = \log_{10}(x)$?
  alternativas:
  - (1, 0)
  - (0, 1)
  - (10, 0)
  - (0, 0)
  respuesta: (1, 0)
  solucion_pasos:
  - 'Paso 1: $\log_{10}(1) = 0 \implies (1, 0)$.'
- titulo: 'Ejemplo 2: Corte con traslación horizontal'
  enunciado: 'Calcula el corte con el eje X de $g(x) = \log_2(x - 9)$:'
  alternativas:
  - (10, 0)
  - (9, 0)
  - (1, 0)
  - (8, 0)
  respuesta: (10, 0)
  solucion_pasos:
  - 'Paso 1: $x - 9 = 1 \implies x = 10 \implies (10, 0)$.'
- titulo: 'Ejemplo 3: Corte con traslación vertical'
  enunciado: 'Halla el intercepto en X de $h(x) = \log_3(x) - 2$:'
  alternativas:
  - (9, 0)
  - (1, 0)
  - (3, 0)
  - (6, 0)
  respuesta: (9, 0)
  solucion_pasos:
  - 'Paso 1: $\log_3(x) = 2 \implies x = 3^2 = 9 \implies (9, 0)$.'
- titulo: 'Ejemplo 4: Corte con base fraccionaria'
  enunciado: ¿En qué punto corta al eje X la función $p(x) = \log_{1/3}(x)$?
  alternativas:
  - (1, 0)
  - (1/3, 0)
  - (3, 0)
  - (0, 1)
  respuesta: (1, 0)
  solucion_pasos:
  - 'Paso 1: $(1/3)^0 = 1 \implies (1, 0)$.'
errores_frecuentes:
- Intercambiar las coordenadas escribiendo (0, 1) en vez de (1, 0).
- Igualar x a cero para buscar el intercepto con el eje X.
- Olvidar sumar el desplazamiento h al calcular el nuevo intercepto.
afirmaciones_verdaderas:
- Toda función logarítmica básica f(x) = log_b(x) intersecta al eje X en el punto (1, 0).
- El intercepto con el eje X se obtiene resolviendo la ecuación f(x) = 0.
al_terminar_debes_poder: '**QUÉ:** Calcular e interpretar el intercepto de la función logarítmica con el eje X.


  **CÓMO:** Resolviendo f(x) = 0 para determinar las coordenadas del punto de corte (x₀, 0).


