procedimiento:
- 'Paso 1: Identificar el incentro $I$ del triángulo.'
- 'Paso 2: Trazar segmentos perpendiculares ($90^\circ$) desde $I$ hacia cada uno
  de los tres lados.'
- 'Paso 3: Aplicar la igualdad métrica fundamental: $d_1 = d_2 = d_3 = r$.'
- 'Paso 4: Utilizar este valor $r$ para cálculos de inradio o área.'
errores_correccion: No confundas la distancia a los lados (incentro) con la distancia
  a los vértices (circuncentro).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el incentro $I$ de un triángulo está a $5\text{ cm}$ del lado $\overline{AC}$,
    ¿cuál es la suma de las distancias perpendiculares desde $I$ a los tres lados?
  alternativas:
  - $15\text{ cm}$
  - $10\text{ cm}$
  - $5\text{ cm}$
  respuesta: $15\text{ cm}$
  solucion_pasos:
  - Cada distancia mide $5\text{ cm}$. La suma es $5 + 5 + 5 = 15\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se mide formalmente la distancia desde el incentro hasta un lado
    del triángulo?
  alternativas:
  - Mediante un segmento perpendicular al lado
  - Mediante una línea que va al punto medio del lado
  - Mediante la prolongación de la bisectriz
  respuesta: Mediante un segmento perpendicular al lado
  solucion_pasos:
  - La distancia de un punto a una recta es siempre la longitud del segmento perpendicular
    trazado hacia ella.
- titulo: ¿El incentro está a la misma distancia de los tres lados de cualquier triángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad geométrica universal y característica del incentro.
- titulo: ¿El incentro está a la misma distancia de los tres vértices del triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, el punto que equidista de los tres vértices es el circuncentro ($O$), no el
    incentro.
errores_frecuentes:
- Confundir la equidistancia a los lados (incentro) con la equidistancia a los vértices
  (circuncentro).
- Medir la distancia a lo largo de la bisectriz en vez de trazar la perpendicular.
- Asumir que los puntos de proyección perpendicular son los puntos medios de los lados.
- Creer que la equidistancia solo se cumple en triángulos equiláteros.
- Olvidar que la distancia perpendicular es la distancia más corta hacia la recta.
afirmaciones_verdaderas:
- El incentro equidista perpendicularmente de los tres lados del triángulo.
- La distancia constante desde el incentro a cualquiera de los tres lados es el radio
  de la circunferencia inscrita ($r$).
al_terminar_debes_poder: '**QUÉ:** Demostrar y aplicar la propiedad de equidistancia
  del incentro a los lados del triángulo.


  **CÓMO:** Trazando los segmentos perpendiculares de longitud $r$ hacia cada lado
  ($d(I, L) = r$) y utilizándolos en problemas métricos y de congruencia.


  ![Resumen de Equidistancia](/static/img/nodos/propiedad-del-incentro-como-punto-equidistante-de-los-lados-del-triangulo-resumen.svg)

  '
