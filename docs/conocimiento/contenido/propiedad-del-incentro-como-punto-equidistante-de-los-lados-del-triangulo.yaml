semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.INCENTRO_EQUIDISTANCIA_LADOS
resumen_inicial: 'El incentro ($I$) es el único punto del plano que se encuentra a
  la misma distancia perpendicular de los tres lados del triángulo: $d(I, \overline{AB})
  = d(I, \overline{BC}) = d(I, \overline{CA}) = r$.'
explicacion_simple: '![Equidistancia del Incentro](/static/img/nodos/propiedad-del-incentro-como-punto-equidistante-de-los-lados-del-triangulo-intro.svg)


  Si te paras en el incentro $I$ y caminas en línea recta hacia cualquiera de las
  tres paredes (lados) del triángulo formando un ángulo recto ($90^\circ$):


  - **Caminas exactamente la misma distancia**: La distancia más corta hacia el lado
  $AB$, hacia el lado $BC$ y hacia el lado $CA$ es idéntica.

  - **Esta distancia es el radio $r$**: A este valor constante se le llama **inradio**.

  - **Es el único punto con esta magia**: Ningún otro punto dentro ni fuera del triángulo
  está a la misma distancia de los 3 lados a la vez.

  '
explicacion_formal: '### Teorema de equidistancia del incentro

  El incentro $I$ es el único punto en el plano del triángulo que **equidista** de
  las tres rectas soportes de los lados del triángulo:


  $$d(I, \overleftrightarrow{BC}) = d(I, \overleftrightarrow{AC}) = d(I, \overleftrightarrow{AB})
  = r$$


  ### Desglose simbólico y geométrico

  - $d(I, L)$: Distancia perpendicular mínima desde el incentro a cada lado.

  - $r$: Inradio o radio común de tangencia interior ($r > 0$).

  - Radios perpendiculares: Los segmentos que unen $I$ con los puntos de tangencia
  en los lados forman ángulos rectos con dichos lados.


  ### Síntesis didáctica

  La equidistancia del incentro a los tres lados garantiza la existencia de una circunferencia
  interior que roza perfectamente los tres bordes del triángulo.'
definiciones_clave: '- **Equidistancia**: Condición geométrica según la cual dos o
  más distancias tienen exactamente el mismo valor numérico.

  - **Distancia a una recta**: Longitud del segmento perpendicular trazado desde un
  punto hacia la recta.

  - **Inradio ($r$)**: Distancia perpendicular constante desde el incentro hasta los
  tres lados del triángulo.

  '
propiedades_relaciones: '- **Igualdad de distancias**: $d(I, \overline{AB}) = d(I,
  \overline{BC}) = d(I, \overline{CA}) = r$.

  - **Pares de congruencia**: $\Delta ID_c A \cong \Delta ID_b A$, $\Delta ID_a B
  \cong \Delta ID_c B$, $\Delta ID_b C \cong \Delta ID_a C$.

  - **Tangencia**: Las distancias $r$ corresponden a los radios de la circunferencia
  inscrita en sus puntos de tangencia.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Equidistancia](/static/img/nodos/propiedad-del-incentro-como-punto-equidistante-de-los-lados-del-triangulo-ejemplos.svg)


    En un triángulo $ABC$, el incentro se ubica en el punto $I$. Se mide la distancia
    perpendicular desde $I$ hasta el lado $\overline{BC}$ resultando $3.8\text{ cm}$.
    ¿Cuál es la distancia perpendicular desde $I$ hacia los lados $\overline{AB}$
    y $\overline{AC}$?

    '
  pasos:
  - 'Paso 1: Reconocer el punto notable dado: $I$ es el incentro del triángulo.'
  - 'Paso 2: Aplicar el teorema de equidistancia: el incentro equidista de los tres
    lados del triángulo.'
  - 'Paso 3: Establecer la igualdad: $d(I, \overline{AB}) = d(I, \overline{AC}) =
    d(I, \overline{BC}) = 3.8\text{ cm}$.'
  - 'Paso 4: Concluir que la distancia perpendicular hacia los lados $\overline{AB}$
    y $\overline{AC}$ es exactamente $3.8\text{ cm}$.'
