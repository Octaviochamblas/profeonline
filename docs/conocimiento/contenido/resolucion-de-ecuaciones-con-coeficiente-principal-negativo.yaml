procedimiento:
- 'Paso 1: Reducir la ecuación a la forma $-a x = b$.'
- 'Paso 2: Multiplicar ambos miembros por $-1$ para transformar el coeficiente principal a positivo ($a x = -b$).'
- 'Paso 3: Trasponer el coeficiente positivo $a$ dividiendo al segundo miembro ($x = \frac{-b}{a}$).'
- 'Paso 4: Calcular la división respetando la ley de los signos para obtener el valor numérico de $x$.'
errores_correccion: '- **Error 1:** Invertir el signo negativo del coeficiente multiplicativo al trasponerlo dividiendo (escribir
  $-4x = 20 \implies x = \frac{20}{4} = 5$). **Cómo corregirlo:** La operación de división **CONSERVA EL SIGNO ORIGINAL DEL
  DIVISOR; SI EL COEFICIENTE ES $-4$, SE DIVIDE ENTRE $-4$ ($x = \frac{20}{-4} = -5$)**.

  - **Error 2:** Multiplicar por $-1$ solo el primer miembro olvidando modificar el signo del segundo miembro. **Cómo corregirlo:**
  Multiplicar por $-1$ **DEBE APLICARSE EN AMBOS MIEMBROS DE LA IGUALDAD SIMULTÁNEAMENTE**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la solución de la ecuación $-3x = -18$?
  alternativas:
  - $x = 6$
  - $x = -6$
  - $x = 15$
  respuesta: $x = 6$
  solucion_pasos:
  - '1. Trasponer $-3$ dividiendo: $x = \frac{-18}{-3}$.'
  - '2. Menos dividido entre menos es más: $x = +6$.'
- titulo: Ejemplo 2
  enunciado: Al resolver $12 - 5x = 32$, ¿cuál es el valor deducido para $x$?
  alternativas:
  - $x = -4$
  - $x = 4$
  - $x = -20$
  respuesta: $x = -4$
  solucion_pasos:
  - '1. Trasponer $+12$: $-5x = 32 - 12 = 20$.'
  - '2. Despejar $-5$: $x = \frac{20}{-5} = -4$.'
- titulo: Inversión por $-1$
  enunciado: ¿Multiplicar $-x = 7$ por $-1$ entrega directamente $x = -7$?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues $(-1)(-x) = x$ y $(-1)(7) = -7$.
- titulo: Signo en la división
  enunciado: ¿La división entre un coeficiente negativo cambia la operación de multiplicación a división sin modificar su
    signo?
  respuesta: Sí
  solucion_pasos:
  - Sí, la división conserva el signo del número que divide.
errores_frecuentes:
- Invertir el signo negativo del coeficiente multiplicativo al trasponerlo dividiendo (escribir $-4x = 20 \implies x = \frac{20}{+4}$).
- Multiplicar por $-1$ únicamente el primer miembro olvidando modificar el signo del segundo miembro.
- Tratar al coeficiente negativo como un sumando y trasponerlo sumando al segundo miembro.
- Al dividir dos números negativos, cometer errores en la regla de signos entregando un cociente negativo.
- Asumir que un coeficiente principal negativo exige obligatoriamente un conjunto solución negativo.
afirmaciones_verdaderas:
- Al trasponer un coeficiente negativo que multiplica, pasa dividiendo al otro miembro conservando su signo.
- Multiplicar ambos miembros por $-1$ invierte los signos de la ecuación manteniendo la equivalencia.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/resolucion-de-ecuaciones-con-coeficiente-principal-negativo-resumen.svg)


  QUÉ: Resolver ecuaciones de primer grado cuyo coeficiente principal sea negativo.

  CÓMO: Multiplicar por $-1$ ambos miembros ($(-1) \cdot (-a x = b) \implies a x = -b$) o trasponer el coeficiente negativo
  dividiendo conservando su signo ($x = \frac{b}{-a} = -\frac{b}{a}$) y aplicar la ley de los signos.

  '
