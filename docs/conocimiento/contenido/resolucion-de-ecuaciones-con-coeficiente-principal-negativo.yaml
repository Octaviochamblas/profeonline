semantic_id: MAT.ALG.RESOLUCION_LINEAL.COEFICIENTE_NEGATIVO
resumen_inicial: Cuando el coeficiente de la incógnita resulta negativo, se multiplican ambos miembros por -1 o se divide
  conservando el signo negativo.
explicacion_simple: 'Si al reducir los términos de una ecuación llegamos a una expresión del tipo $-5x = 20$, la incógnita
  $x$ se encuentra multiplicada por un número negativo ($-5$).


  Para despejar la incógnita de forma rigurosa disponemos de dos caminos operacionales equivalentes:


  1. Multiplicar toda la ecuación por $-1$ para cambiar el signo de ambos miembros simultáneamente ($5x = -20$).

  2. Trasponer el coeficiente $-5$ dividiendo directamente al segundo miembro conservando su signo negativo intacto ($x =
  \frac{20}{-5} = -4$).


  ![Coeficiente principal negativo](/static/img/nodos/resolucion-de-ecuaciones-con-coeficiente-principal-negativo-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la ecuación reducida con coeficiente principal negativo $-a x = b$ con $a > 0$, la **resolución con coeficiente negativo**
  utiliza la propiedad multiplicativa con el escalar $-1$:


  $$-a x = b \iff (-1) \cdot (-a x) = (-1) \cdot b \iff a x = -b \iff x = -\frac{b}{a}$$


  $$\text{o bien alternativamente: } x = \frac{b}{-a} = -\frac{b}{a}$$


  ### Desglose de la fórmula

  - Inversión simultánea e integral de los signos algebraicos de ambos miembros mediante multiplicación por $-1$.


  ### Síntesis didáctica

  Trasponer un coeficiente multiplicativo trasladándolo dividiendo conserva estrictamente el signo del número divisor.

  '
definiciones_clave: '- **Coeficiente principal negativo**: Factor multiplicativo de la incógnita cuyo valor real es menor
  que cero ($-a < 0$).

  - **Multiplicación por $-1$**: Multiplicación de ambos miembros por el escalar $-1$ para obtener una ecuación equivalente
  con coeficiente positivo.

  '
propiedades_relaciones: '- **Ley de signos en división**: El cociente de cantidades con distinto signo resulta ser estrictamente
  negativo ($\frac{+}{-} = -$ y $\frac{-}{+} = -$).

  - **Equivalencia operacional**: Multiplicar por $-1$ ambos miembros produce la misma solución que trasponer dividiendo por
  el coeficiente negativo.

  '
ejemplo_guiado:
  enunciado: Resuelve la ecuación $-4x + 9 = 29$ despejando el coeficiente principal negativo y evalúa la solución.
  pasos:
  - 'Paso 1: Trasponer $+9$ restando al segundo miembro: $-4x = 29 - 9 = 20$.'
  - 'Paso 2: Opción A: Multiplicar toda la ecuación por $-1 \implies 4x = -20$.'
  - 'Paso 3: Trasponer $4$ dividiendo al segundo miembro: $x = \frac{-20}{4} = -5$.'
  - 'Paso 4: Opción B (directa): Trasponer $-4$ dividiendo conservando su signo: $x = \frac{20}{-4} = -5$.'
  - 'Paso 5: Comprobar sustituyendo $x = -5$ en la ecuación inicial: $-4(-5) + 9 = 20 + 9 = 29$.'
  imagen: /static/img/nodos/resolucion-de-ecuaciones-con-coeficiente-principal-negativo-ejemplos.svg
checkpoints:
