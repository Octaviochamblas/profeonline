semantic_id: MAT.ALG.RESOLUCION_LINEAL.COEFICIENTE_NEGATIVO
resumen_inicial: Cuando el coeficiente de la incógnita resulta negativo, se multiplican
  ambos miembros por -1 o se divide conservando el signo negativo.
explicacion_simple: 'Si al reducir los términos de una ecuación llegamos a una expresión
  como $-5x = 20$, la incógnita $x$ está multiplicada por un número negativo ($-5$).

  Para despejar $x$ correctamente tenemos dos opciones equivalentes:

  1. Multiplicar toda la ecuación por $-1$ para cambiar el signo de ambos lados ($5x
  = -20$).

  2. Pasar el $-5$ dividiendo directamente con su signo negativo intacto ($x = \frac{20}{-5}
  = -4$).'
explicacion_formal: 'Dada la ecuación con coeficiente principal negativo $-a x = b$
  con $a > 0$, la **resolución con coeficiente negativo** utiliza el escalar $-1$:


  $$-a x = b \iff (-1) \cdot (-a x) = (-1) \cdot b \iff a x = -b \iff x = -\frac{b}{a}$$


  $$\text{o bien: } x = \frac{b}{-a} = -\frac{b}{a}$$


  **Desglose de la fórmula:**

  - Inversión de signos en ambos miembros por propiedad multiplicativa con factor
  $-1$.'
definiciones_clave: '- **Coeficiente principal negativo**: Coeficiente de la incógnita
  $x$ cuyo valor numérico es un número real negativo ($-a < 0$).

  - **Multiplicación por $-1$**: Técnica para transformar todos los signos de la ecuación
  a su opuesto aditivo.'
propiedades_relaciones: '- **Ley de signos en división**: Positivo dividido entre
  negativo resulta en un número negativo ($\frac{+}{-} = -$).'
ejemplo_guiado:
  enunciado: Resuelve la ecuación $-4x + 9 = 29$ despejando el coeficiente principal
    negativo y evalúa la solución.
  pasos:
  - 'Paso 1: Trasponer $+9$ restando al segundo miembro: $-4x = 29 - 9 = 20$.Paso
    2: Opción A: Multiplicar toda la ecuación por $-1 \implies 4x = -20$.Paso 3: Trasponer
    $4$ dividiendo: $x = \frac{-20}{4} = -5$.Paso 4: Opción B (directa): Trasponer
    $-4$ dividiendo conservando su signo: $x = \frac{20}{-4} = -5$.Paso 5: Comprobar
    en la ecuación inicial: $-4(-5) + 9 = 20 + 9 = 29$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $x$ en la ecuación $-4x = 20$, ¿cuál es el procedimiento correcto?
  choices:
  - text: 'Pasar el $-4$ dividiendo manteniendo su signo negativo: $x = \frac{20}{-4}
      = -5$.'
    is_correct: true
  - text: 'Pasar el $-4$ como $+4$ dividiendo: $x = \frac{20}{4} = 5$.'
    is_correct: false
  - text: 'Restar $-4$ al segundo miembro: $x = 20 - 4 = 16$.'
    is_correct: false
  - text: 'Sumar $4$ en ambos miembros: $x = 24$.'
    is_correct: false
  explanation: 'La alternativa correcta es ''Pasar el $-4$ dividiendo manteniendo
    su signo negativo: $x = \frac{20}{-4} = -5$.''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $-4x + 9 = 29$, ¿cuál es el valor de $x$?
  choices:
  - text: $x = -5$
    is_correct: true
  - text: $x = 5$
    is_correct: false
  - text: $x = -4$
    is_correct: false
  - text: $x = -9$
    is_correct: false
  explanation: La alternativa correcta es '$x = -5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trasponer los términos independientes al segundo miembro dejando el término
  $-ax$ en el primero.'
- 'Paso 2: Multiplicar ambos miembros por $-1$ para convertir la incógnita en positiva.'
- 'Paso 3: Dividir el segundo miembro entre el coeficiente positivo resultante.'
- 'Paso 4: Aplicar la ley de los signos para obtener el valor de $x$.'
errores_correccion: '- **Error común:** Cambiar el signo negativo del coeficiente
  al trasponerlo dividiendo (decir que $-4x = 20 \implies x = \frac{20}{4} = 5$).

  - **Cómo corregirlo:** La división NO cambia el signo del número que divide. Si
  divides entre $-4$, el divisor sigue siendo $-4$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
