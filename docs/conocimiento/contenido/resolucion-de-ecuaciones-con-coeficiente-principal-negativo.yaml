semantic_id: MAT.ALG.RESOLUCION_LINEAL.COEFICIENTE_NEGATIVO
resumen_inicial: 'Resolución de ecuaciones con coeficiente principal negativo: propiedades,
  resolución y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: 'Has hecho todo bien, pero al final del problema te topas con
  que tu ''x'' quedó con un molesto signo negativo (ej: $-x = 8$). No hemos terminado.
  La respuesta debe ser de ''x'', no de ''anti-x''.'
explicacion_formal: '### Definición formal


  Multiplicar todo por -1 es la operación válida que invierte los signos y vuelve
  positiva la incógnita.


  ### Desarrollo didáctico


  Imagínate que al resolver una ecuación llegas a este punto:

  $-3x = 15$


  Tienes dos formas legítimas de proceder:


  **Método 1 (El paso natural):**

  Recuerda que el $-3$ está multiplicando. Simplemente pásalo dividiendo con todo
  y su signo:

  $x = \frac{15}{-3}$

  $x = -5$


  **Método 2 (El truco del -1):**

  A muchos no les gusta mover el negativo. Entonces, multiplicas la ecuación completa
  por $(-1)$.

  $(-1) \cdot (-3x) = (-1) \cdot (15)$

  $3x = -15$

  Ahora el $3$ pasa dividiendo positivo:

  $x = \frac{-15}{3} \rightarrow x = -5$.


  Si llegas a $-x = 7$, el Método 2 es perfecto. Multiplicas todo por $-1$ y queda
  directamente $x = -7$.'
definiciones_clave: '- **Resolución de ecuaciones con coeficiente principal negativo**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución de ecuaciones con coeficiente
  principal negativo.'
