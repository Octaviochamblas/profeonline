semantic_id: MAT.GEO.RELACIONES_TR.CALCULO_ALTURA
resumen_inicial: 'Cálculo de la altura sobre la hipotenusa a partir de las proyecciones
  de los catetos: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: Con la relación h²=m·n ya establecida, se puede aplicar directamente
  para calcular la altura sobre la hipotenusa cuando se conocen las dos proyecciones
  de los catetos.
explicacion_formal: '![Cálculo de la altura desde las proyecciones](/static/img/geometria/areas-pitagoras/relaciones-tr-calculo-altura.svg)


  ### Definición formal


  Si las proyecciones son $m=6$ y $n=24$, la altura es $h=\sqrt{6\times24}=\sqrt{144}=12$.


  ### Desarrollo didáctico


  Este cálculo es una aplicación numérica directa de la relación $h^2=m\cdot n$, útil
  cuando se conocen las dos proyecciones pero no directamente los catetos ni la hipotenusa.'
definiciones_clave: '- **Cálculo de la altura sobre la hipotenusa a partir de las
