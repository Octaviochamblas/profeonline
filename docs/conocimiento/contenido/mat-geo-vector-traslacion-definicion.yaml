procedimiento:
- 'Paso 1: Identifica un punto de la figura original y su correspondiente en la figura
  imagen.'
- 'Paso 2: Traza el vector que va desde el punto original hasta su imagen; ese es
  el vector traslación.'
- 'Paso 3: Verifica que ese mismo vector aplicado a cualquier otro punto de la figura
  produce su imagen correspondiente.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con definición de vector traslación.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de definición de vector traslación para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
