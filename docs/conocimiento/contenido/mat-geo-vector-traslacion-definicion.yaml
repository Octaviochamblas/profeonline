- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de definición de vector traslación y
    elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de definición de vector traslación.
- titulo: ¿Se cumple siempre la propiedad principal de definición de vector traslación
    en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede definición de vector traslación asumir un valor negativo cuando representa
    una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en definición de vector traslación.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en definición
  de vector traslación.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en definición de
  vector traslación.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de definición
  de vector traslación.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
