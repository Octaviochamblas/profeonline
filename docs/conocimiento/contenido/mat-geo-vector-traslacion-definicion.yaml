semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.VECTOR_TRASLACION_DEFINICION
resumen_inicial: 'Definición de vector traslación: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: El vector traslación es como una 'instrucción única' que le dice
  a cada punto de la figura exactamente cuánto y hacia dónde moverse.
explicacion_formal: '![Definición de vector traslación](/static/img/geometria/isometrias/vector-traslacion-definicion.svg)


  ### Definición formal


  Una traslación de vector $\vec{v}$ es una transformación que mueve cada punto $P$
  del plano a un nuevo punto $P''$ tal que $\vec{PP''}=\vec{v}$: todos los puntos
  de la figura se desplazan exactamente la misma distancia, en la misma dirección
  y sentido.


  ### Desarrollo didáctico


  En la figura, el vector $\vec{v}$ conecta un vértice de la figura original con su
  correspondiente en la figura imagen. Este mismo vector, aplicado a cualquier otro
  punto de la figura original, produce su punto correspondiente en la imagen.'
definiciones_clave: '- **Definición de vector traslación**: Elemento o propiedad fundamental
  en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de vector traslación.'
