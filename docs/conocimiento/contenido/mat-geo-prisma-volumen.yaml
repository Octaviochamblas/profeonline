semantic_id: MAT.GEO.POLIEDROS_PRISMAS.PRISMA_VOLUMEN
resumen_inicial: 'Cálculo del volumen de un prisma recto: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El volumen de un prisma se puede imaginar como 'apilar' copias
  del área de la base a lo largo de toda la altura del cuerpo.
explicacion_formal: '![Volumen de un prisma recto](/static/img/geometria/espacio-cuerpos/prisma-volumen.svg)


  ### Definición formal


  El volumen de un prisma recto es el producto entre el área de su base y su altura:
  $V=A_{base}\times h$. Esta fórmula aplica sin importar la forma poligonal de la
  base (triangular, cuadrada, hexagonal, etc.).


  ### Desarrollo didáctico


  Si un prisma tiene base rectangular de área 24 cm² y altura 10 cm, su volumen es
  $V=24\times10=240$ cm³. Esta misma lógica aplica para prismas de cualquier forma
  de base, siempre que se conozca correctamente su área.'
definiciones_clave: '- **Cálculo del volumen de un prisma recto**: Elemento o propiedad
