procedimiento:
- 'Paso 1: Calcula el área de la base del prisma (A_base), según su forma poligonal.'
- 'Paso 2: Identifica la altura del prisma (h), es decir, la distancia perpendicular
  entre las dos bases.'
- 'Paso 3: Multiplica el área de la base por la altura para obtener el volumen: V=A_base×h.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del volumen de un prisma recto.
