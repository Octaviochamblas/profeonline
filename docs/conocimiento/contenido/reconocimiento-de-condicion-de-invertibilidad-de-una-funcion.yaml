procedimiento:
- 'Paso 1: Verifica si la función es inyectiva.'
- 'Paso 2: Verifica si la función es sobreyectiva.'
- 'Paso 3: Si ambas se cumplen, la función es invertible; si no, no tiene inversa
  sobre esos conjuntos.'
- 'Paso 4: Si falla la inyectividad, considera restringir el dominio para lograr invertibilidad.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar reconocimiento de condición de invertibilidad de una función.
ejemplos:
- titulo: Verificación de invertibilidad en función afín
  enunciado: Determina si $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=4x-1$, es invertible.
  solucion_pasos:
  - Es inyectiva (pendiente distinta de cero) y sobreyectiva (recorrido igual a $\mathbb{R}$).
  - Es biyectiva, por lo tanto es invertible.
- titulo: Restricción de dominio para lograr invertibilidad
  enunciado: Explica por qué $f\colon \mathbb{R} \to [0,+\infty[$, $f(x)=x^2$, no
    es invertible, y cómo restringirla para que lo sea.
  solucion_pasos:
  - No es inyectiva en todo $\mathbb{R}$, pues $f(2)=f(-2)=4$.
  - Restringiendo el dominio a $[0,+\infty[$, la función se vuelve inyectiva y por
    tanto invertible.
- titulo: ¿Una función que no es biyectiva puede tener inversa sobre su dominio completo?
  enunciado: ¿Una función que no es biyectiva puede tener inversa sobre su dominio
    completo?
  respuesta: 'No'
  solucion_pasos:
  - La biyectividad es condición necesaria y suficiente para la invertibilidad sobre
    esos conjuntos.
- titulo: ¿Restringir el dominio puede convertir una función no invertible en invertible?
  enunciado: ¿Restringir el dominio puede convertir una función no invertible en invertible?
  respuesta: Sí
  solucion_pasos:
  - Al restringir adecuadamente el dominio, se puede lograr inyectividad y, por tanto,
    invertibilidad.
errores_frecuentes:
- Creer que toda función tiene inversa sin verificar biyectividad.
- Olvidar que restringir el dominio puede cambiar el estatus de invertibilidad de
  una función.
- Confundir la condición de invertibilidad con la simple existencia de una fórmula
  algebraica para $f^{-1}$.
- No verificar sobreyectividad, centrándose solo en la inyectividad.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando reconocimiento
