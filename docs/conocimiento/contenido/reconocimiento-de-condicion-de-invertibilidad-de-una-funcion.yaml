semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.CONDICION_INVERTIBILIDAD
resumen_inicial: 'Reconocimiento de condición de invertibilidad de una función: conceptos,
  representación y propiedades en Tipos de funciones y función inversa.'
explicacion_simple: No toda función merece tener una inversa propia; solo aquellas
  que emparejan perfectamente cada entrada con una única salida, sin dejar a nadie
  sin pareja ni compartiendo pareja.
explicacion_formal: '### Definición formal


  Una función $f\colon A \to B$ admite una función inversa $f^{-1}\colon B \to A$
  si y solo si $f$ es biyectiva. Si $f$ no es inyectiva, algún $y$ tendría más de
  una preimagen, violando la unicidad exigida a $f^{-1}$; si $f$ no es sobreyectiva,
  algún $y \in B$ no tendría preimagen, dejando a $f^{-1}$ sin definir en ese punto.


  ### Desarrollo didáctico


  Para verificar invertibilidad, basta con verificar biyectividad: si falla la inyectividad
  o la sobreyectividad, la función no tiene inversa (sobre esos conjuntos $A$ y $B$).


  $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=x^2$ no es invertible (no es inyectiva),
  pero restringida a $f\colon [0,+\infty[ \to [0,+\infty[$ sí lo es, porque en ese
  dominio restringido se vuelve biyectiva.'
definiciones_clave: '- **Reconocimiento de condición de invertibilidad de una función**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
