semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.CONDICION_INVERTIBILIDAD
resumen_inicial: La condición necesaria y suficiente para que una función admita función inversa es que sea biyectiva (inyectiva y sobreyectiva).
explicacion_simple: '![La condición necesaria y suficiente para que una función admita función inversa es que sea biyectiva (inyectiva y sobreyectiva)](/static/img/nodos/reconocimiento-de-condicion-de-invertibilidad-de-una-funcion-intro.svg)



  Para que una función tenga inversa $f^{-1}$:

  1. **Debe ser inyectiva (uno a uno):** Si dos entradas tuvieran la misma salida (como en $x^2$), al intentar regresar, ¡la máquina no sabría a cuál de los dos números volver!

  2. **Debe ser sobreyectiva (sobre todo $B$):** Si sobrara algún número en la salida, no tendría de dónde regresar.


  Por eso, la regla de oro es: **Una función es invertible si y solo si es BIYECTIVA**.'
explicacion_formal: '**Teorema Fundamental de Invertibilidad:**

  Una función $f: A \to B$ admite una función inversa $f^{-1}: B \to A$ si y solo si $f$ es **biyectiva**:

  $$\exists f^{-1}: B \to A \Longleftrightarrow f \text{ es inyectiva } \land \text{ sobreyectiva}$$


  **Justificación lógica de las condiciones:**

  - **Inyectividad $\implies$ Buena definición de $f^{-1}$**: Asegura que a cada $y \in B$ le corresponda **a lo más una** preimagen $x$ (evita la multivaluación).

  - **Sobreyectividad $\implies$ Dominio completo de $f^{-1}$**: Asegura que a cada $y \in B$ le corresponda **al menos una** preimagen $x$ (evita preimágenes inexistentes en $B$).'
definiciones_clave: '- **Invertibilidad**: Capacidad de una función de poseer una inversa bien definida.

  - **Buena definición funcional**: Exigencia de que cada elemento del dominio tenga exactamente una imagen.'
propiedades_relaciones: '- **Invertibilidad por tramos / restricción**: Funciones no invertibles en $\mathbb{R}$ (como $x^2$, $\sin(x)$) se vuelven invertibles al restringir su dominio a un intervalo monótono.

  - **Unicidad de la inversa**: Si una función es invertible, su función inversa $f^{-1}$ es única.'
ejemplo_guiado:
  enunciado: '![Ejemplo La condición necesaria y suficiente para que una función admita función inversa es que sea biyectiva (inyectiva y sobreyectiva)](/static/img/nodos/reconocimiento-de-condicion-de-invertibilidad-de-una-funcion-ejemplos.svg)



    Determina si la función $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = x^2 - 6x + 8$ es invertible en $\mathbb{R}$, y en caso negativo indica cómo restringir su dominio para hacerla invertible.'
  pasos:
  - 'Paso 1: Analizar la inyectividad: es una parábola con vértice en $x_v = -\frac{-6}{2(1)} = 3$.'
  - 'Paso 2: Como es simétrica respecto a $x = 3$, por ejemplo $f(2) = 0$ y $f(4) = 0$ ($2 \neq 4$), no es inyectiva en $\mathbb{R}$.'
  - 'Paso 3: Como no es inyectiva, no es biyectiva en $\mathbb{R}$ y por ende NO es invertible en $\mathbb{R}$.'
  - 'Paso 4: Para hacerla invertible, se restringe el dominio a $[3, +\infty[$ (o $]-\infty, 3]$) y el codominio a su recorrido $[-1, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición necesaria y suficiente para que una función sea invertible?
  choices:
  - text: Que sea biyectiva (inyectiva y sobreyectiva simultaneamente).
    is_correct: true
  - text: Que sea continua en todo su dominio.
    is_correct: false
  - text: Que pase por el origen de coordenadas.
    is_correct: false
  - text: Que su derivada sea positiva.
    is_correct: false
  explanation: La alternativa correcta es 'Que sea biyectiva (inyectiva y sobreyectiva simultaneamente).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la función constante $f(x) = 8$ NO es invertible?
  choices:
  - text: Porque todas las preimagenes tienen la misma imagen y = 8 (falla inyectividad y sobreyectividad).
    is_correct: true
  - text: Porque es una linea recta.
    is_correct: false
  - text: Porque no tiene pendiente.
    is_correct: false
  - text: Porque no corta al eje X.
    is_correct: false
  explanation: La alternativa correcta es 'Porque todas las preimagenes tienen la misma imagen y = 8 (falla inyectividad y sobreyectividad).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar la inyectividad de la función en su dominio mediante álgebra o la prueba de la recta horizontal.'
- 'Paso 2: Evaluar la sobreyectividad verificando que $\text{Rec}(f) = B$.'
- 'Paso 3: Si cumple ambas, la función es invertible.'
- 'Paso 4: Si no cumple alguna, proponer restricciones de dominio y codominio para lograr la biyectividad e invertibilidad.'
errores_correccion: '- **Error común:** Intentar calcular la inversa algebraica de una función no inyectiva sin restringir su dominio.

  - **Cómo corregirlo:** Antes de despejar, **verifica siempre la biyectividad**; si no es biyectiva, la fórmula resultante no será una función válida.'
ejemplos:
- titulo: 'Ejemplo 1: Función afín'
  enunciado: '¿Es invertible $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = 7x - 2$?'
  alternativas:
  - Sí, porque toda función afín con m != 0 es biyectiva en R
  - No, porque tiene intercepto negativo
  - Solo para números positivos
  - Solo en el origen
  respuesta: Sí, porque toda función afín con m != 0 es biyectiva en R
  solucion_pasos:
  - 'Paso 1: $m = 7 \neq 0 \implies$ es biyectiva en $\mathbb{R} \implies$ es invertible.'
- titulo: 'Ejemplo 2: Función valor absoluto'
  enunciado: '¿Es invertible $g: \mathbb{R} \to \mathbb{R}$ con $g(x) = |x|$?'
  alternativas:
  - No, porque no es inyectiva en R
  - Sí, porque es positiva
  - Sí, porque su inversa es -x
  - Solo para pares
  respuesta: No, porque no es inyectiva en R
  solucion_pasos:
  - 'Paso 1: $g(-3) = g(3) = 3$, al fallar la inyectividad no es invertible en $\mathbb{R}$.'
- titulo: 'Ejemplo 3: Restricción para raíz cuadrada'
  enunciado: Para que $f(x) = x^2$ sea invertible con inversa $f^{-1}(x) = \sqrt{x}$, ¿cómo debe definirse?
  alternativas:
  - 'f: [0, +inf[ -> [0, +inf['
  - 'f: R -> R'
  - 'f: R -> [0, +inf['
  - 'f: ]-inf, 0] -> R'
  respuesta: 'f: [0, +inf[ -> [0, +inf['
  solucion_pasos:
  - 'Paso 1: Restringiendo dominio y codominio a $[0, +\infty[$ se vuelve biyectiva.'
- titulo: 'Ejemplo 4: Función cúbica'
  enunciado: '¿Es invertible $h: \mathbb{R} \to \mathbb{R}$ con $h(x) = x^3 + 1$?'
  alternativas:
  - Sí, es biyectiva en R y su inversa es cuberoot(x - 1)
  - No, porque es de grado 3
  - No, porque está trasladada
  - Solo en [0, 1]
  respuesta: Sí, es biyectiva en R y su inversa es cuberoot(x - 1)
  solucion_pasos:
  - 'Paso 1: Las funciones cúbicas puras son biyectivas en $\mathbb{R}$ y por ende invertibles.'
errores_frecuentes:
- Intentar invertir funciones que no son inyectivas.
- Olvidar restringir el codominio al recorrido.
- Asumir que todas las funciones con fórmula tienen inversa.
afirmaciones_verdaderas:
- Una función posee inversa si y solo si es biyectiva en los conjuntos considerados.
- Restringir el dominio a un intervalo estrictamente monótono permite construir la inversa local de una función.
al_terminar_debes_poder: '**QUÉ:** Reconocer y justificar las condiciones de invertibilidad de funciones reales.


  **CÓMO:** Verificando la biyectividad (inyectividad y sobreyectividad) o determinando las restricciones de dominio requeridas.


  ![Resumen La condición necesaria y suficiente para que una función admita función inversa es que sea biyectiva (inyectiva y sobreyectiva)](/static/img/nodos/reconocimiento-de-condicion-de-invertibilidad-de-una-funcion-resumen.svg)'
