semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.CONDICION_INVERTIBILIDAD
resumen_inicial: Una función admite función inversa si y solo si es biyectiva en los
  conjuntos considerados.
explicacion_simple: 'No todas las funciones tienen inversa.

  - Si una función no fuera inyectiva (dos entradas dan la misma salida, ej: $f(2)=4$
  y $f(-2)=4$), al intentar volver hacia atrás el $4$ no sabría si regresar al $2$
  o al $-2$ (fallaría la unicidad de función).

  - Por eso, la **condición estricta de invertibilidad** es que la función sea **BIYECTIVA**.'
explicacion_formal: 'Teorema fundamental de invertibilidad: Una función $f: A \to
  B$ es **invertible** (posee inversa $f^{-1}: B \to A$) si y solo si:


  $$f \text{ es biyectiva}$$


  **Desglose de la fórmula:**

  - Garantía de existencia y unicidad de la relación inversa $f^{-1} \subset B \times
  A$ como función matemática bien definida.'
definiciones_clave: '- **Condición de invertibilidad**: Requisito de biyectividad
  que permite la construcción de la función inversa.'
propiedades_relaciones: '- **Restricción para invertibilidad**: Funciones no inyectivas
  como $f(x) = x^2$ se vuelven invertibles restringiendo su dominio (ejemplo a $\mathbb{R}^+$).'
ejemplo_guiado:
  enunciado: 'Explica por qué la función $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x)
    = x^2$ NO es invertible y cómo se puede hacer invertible.'
  pasos:
  - 'Paso 1: Comprobar inyectividad: $f(2) = 4$ y $f(-2) = 4 \implies$ no es inyectiva.Paso
    2: Concluir que al no ser inyectiva, NO es biyectiva y por lo tanto NO es invertible
    en todo $\mathbb{R}$.Paso 3: Restringir el dominio a $\mathbb{R}^+ = [0, +\infty[$
    y el codominio a $[0, +\infty[$.Paso 4: Comprobar que $f: [0, +\infty[ \to [0,
    +\infty[$ es biyectiva y su inversa es $f^{-1}(x) = \sqrt{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición matemática obligatoria para que una función posea
    función inversa?
  choices:
  - text: Debe ser estrictamente biyectiva.
    is_correct: true
  - text: Debe ser una función constante.
    is_correct: false
  - text: Debe pasar por el origen de coordenadas.
    is_correct: false
  - text: Debe ser una parábola abierta hacia abajo.
    is_correct: false
  explanation: La alternativa correcta es 'Debe ser estrictamente biyectiva.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la función inversa de $f(x) = x^2$ al restringir su dominio al
    intervalo $[0, +\infty[$?
  choices:
  - text: $f^{-1}(x) = \sqrt{x}$
    is_correct: true
  - text: $f^{-1}(x) = \frac{1}{x^2}$
    is_correct: false
  - text: $f^{-1}(x) = -x^2$
    is_correct: false
  - text: $f^{-1}(x) = 2x$
    is_correct: false
  explanation: La alternativa correcta es '$f^{-1}(x) = \sqrt{x}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar la inyectividad de la función.'
- 'Paso 2: Evaluar la sobreyectividad de la función.'
- 'Paso 3: Si ambas se cumplen, confirmar que es invertible.'
- 'Paso 4: Si falla alguna, restringir el dominio o codominio para lograr invertibilidad.'
errores_correccion: '- **Error común:** Intentar calcular la inversa de una función
  no biyectiva (como una parábola completa en $\mathbb{R}$).

  - **Cómo corregirlo:** Antes de despejar la inversa, debes verificar o aplicar las
  restricciones para garantizar que sea biyectiva.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
