semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.TABLA_VALORES
resumen_inicial: La construcción de una tabla de valores para una función potencia $f(x) = a \cdot x^n$ sistematiza el cálculo cartesiano utilizando un conjunto de valores simétricos $x \in \{-2, -1, 0, 1, 2\}$, identificando los puntos pivote $(0, 0)$, $(1, a)$, $(-1, a(-1)^n)$ y verificando la paridad de la curva.
explicacion_simple: "![La construcción de una tabla de valores para una función potencia $f(x) = a \\cdot x^n$ sistematiza el cálculo cartesiano utilizando un conjunto de valores simétricos $x \\in \\{-2, -1, 0, 1, 2\\}$, identificando los puntos pivote $(0, 0)$, $(1, a)$, $(-1, a(-1)^n)$ y verificando la paridad de la curva](/static/img/nodos/construccion-de-una-tabla-de-valores-para-una-funcion-potencia-intro.svg)\n\n\nPara graficar o analizar una función potencia $f(x) = a \\cdot x^n$ sin cometer errores de signos:\n\n**Usa la tabla simétrica estándar de 5 valores clave**:\n\n| $x$ | $x^n$ | $f(x) = a \\cdot x^n$ | Punto cartesiano $(x, y)$ |\n|---|---|---|---|\n| $-2$ | $(-2)^n$ | $a \\cdot (-2)^n$ | $(-2, a(-2)^n)$ |\n| $-1$ | $(-1)^n$ | $a \\cdot (-1)^n$ | $(-1, a(-1)^n)$ |\n| $0$ | $0$ | $0$ | **$(0, 0)$ (Origen)** (si $n > 0$) |\n| $1$ | $1$ | $a$ | **$(1, a)$ (Punto de escala)** |\n| $2$ | $2^n$ | $a \\cdot 2^n$ | $(2, a \\cdot 2^n)$ |\n\n- **¡Atención a la regla de los paréntesis!**\n\
  \  - $(-2)^4 = +16$ (exponente par $\\implies$ positivo).\n  - $(-2)^3 = -8$ (exponente impar $\\implies$ negativo).\n  - **Primero resuelves la potencia y AL FINAL multiplicas por $a$**."
explicacion_formal: "Sea $f(x) = a \\cdot x^n$ con $a \\in \\mathbb{R}^*$ y $n \\in \\mathbb{Z}^+$. El algoritmo de tabulación en una malla discreta simétrica $\\mathcal{M} = \\{-x_k, \\dots, 0, \\dots, x_k\\}$ se define por:\n$$(x_i, y_i) = (x_i, a \\cdot x_i^n)$$\n\n**Puntos invariantes universales de control**:\n1. **Origen canónico**: $P_0(0, 0)$ para todo $n > 0$.\n2. **Pivote positivo**: $P_1(1, a)$, donde la ordenada coincide idénticamente con el coeficiente $a$.\n3. **Pivote negativo simétrico**:\n   $$P_{-1} = \\begin{cases} (-1, a) & \\text{si } n \\text{ es par} \\\\ (-1, -a) & \\text{si } n \\text{ es impar} \\end{cases}$$\nPermite verificar numéricamente la paridad $f(-x) = \\pm f(x)$ antes del trazado continuo."
definiciones_clave: '- **Tabla de valores simétrica**: Muestreo ordenado de pares $(x, f(x))$ alrededor de $x = 0$.

  - **Punto pivote de calibración**: Par $(1, a)$ que determina visualmente el valor del coeficiente principal.'
propiedades_relaciones: '- **Jerarquía de operaciones**: $f(x) = a \cdot (x^n)$, la potencia tiene prioridad sobre el producto escalar.

  - **Signos en bases negativas**: $(-x)^n = x^n$ para $n$ par y $(-x)^n = -x^n$ para $n$ impar.'
ejemplo_guiado:
  enunciado: '![Ejemplo La construcción de una tabla de valores para una función potencia $f(x) = a \cdot x^n$ sistematiza el cálculo cartesiano utilizando un conjunto de valores simétricos $x \in \{-2, -1, 0, 1, 2\}$, identificando los puntos pivote $(0, 0)$, $(1, a)$, $(-1, a(-1)^n)$ y verificando la paridad de la curva](/static/img/nodos/construccion-de-una-tabla-de-valores-para-una-funcion-potencia-ejemplos.svg)



    Construye la tabla de valores completa para $x \in \{-2, -1, 0, 1, 2\}$ de las siguientes funciones:

    1) $f(x) = 2x^4$

    2) $g(x) = -3x^3$'
  pasos:
  - 'Paso 1: Para $f(x) = 2x^4$ (par):

    - $x = -2 \implies f(-2) = 2(-2)^4 = 2(16) = \mathbf{32} \implies (-2, 32)$.

    - $x = -1 \implies f(-1) = 2(-1)^4 = 2(1) = \mathbf{2} \implies (-1, 2)$.

    - $x = 0 \implies f(0) = 2(0) = \mathbf{0} \implies (0, 0)$.

    - $x = 1 \implies f(1) = 2(1)^4 = \mathbf{2} \implies (1, 2)$.

    - $x = 2 \implies f(2) = 2(2)^4 = \mathbf{32} \implies (2, 32)$.'
  - 'Paso 2: Para $g(x) = -3x^3$ (impar):

    - $x = -2 \implies g(-2) = -3(-2)^3 = -3(-8) = \mathbf{24} \implies (-2, 24)$.

    - $x = -1 \implies g(-1) = -3(-1)^3 = -3(-1) = \mathbf{3} \implies (-1, 3)$.

    - $x = 0 \implies g(0) = \mathbf{0} \implies (0, 0)$.

    - $x = 1 \implies g(1) = -3(1)^3 = \mathbf{-3} \implies (1, -3)$.

    - $x = 2 \implies g(2) = -3(2)^3 = -3(8) = \mathbf{-24} \implies (2, -24)$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $f(x) = -2x^4$, ¿cuánto vale $f(-3)$?
  choices:
  - text: -162 (porque (-3)⁴ = 81 y -2 · 81 = -162)
    is_correct: true
  - text: '+162'
    is_correct: false
  - text: '-24'
    is_correct: false
  - text: '+24'
    is_correct: false
  explanation: La alternativa correcta es '-162 (porque (-3)⁴ = 81 y -2 · 81 = -162)'. Primero se evalúa la potencia $(-3)^4 = +81$ y luego se multiplica por $-2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el punto pivote que siempre contiene la gráfica de $f(x) = a x^n$ cuando se evalúa en x = 1?
  choices:
  - text: (1, a)
    is_correct: true
  - text: (1, 1)
    is_correct: false
  - text: (1, n)
    is_correct: false
  - text: (a, 1)
    is_correct: false
  explanation: La alternativa correcta es '(1, a)'. Como $1^n = 1$ para cualquier exponente $n$, $f(1) = a(1) = a$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Disponer una tabla con columnas para $x$, la potencia $x^n$, el producto $a \cdot x^n$ y el par ordenado $(x, y)$.'
- 'Paso 2: Seleccionar valores simétricos centrados en cero $x \in \{-2, -1, 0, 1, 2\}$.'
- 'Paso 3: Calcular primero la potencia cuidando los signos de bases negativas: $(-x)^n$.'
- 'Paso 4: Multiplicar el resultado de la potencia por el coeficiente principal $a$ y registrar los puntos.'
errores_correccion: '- **Error común:** Elevar al exponente el producto completo (ej: en $2x^3$, calcular $(2x)^3 = 8x^3$).

  - **Cómo corregirlo:** La potencia **SOLO AFECTA A LA BASE $x$**: $f(x) = 2 \cdot (x^3)$. Primero calculas $x^3$ y al final multiplicas por 2.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación con base negativa y potencia par'
  enunciado: 'Si $f(x) = 3x^4$, calcula $f(-2)$:'
  alternativas:
  - '48'
  - '-48'
  - '24'
  - '-24'
  respuesta: '48'
  solucion_pasos:
  - 'Paso 1: $f(-2) = 3(-2)^4 = 3(16) = 48$.'
- titulo: 'Ejemplo 2: Evaluación con base negativa y potencia impar'
  enunciado: 'Si $g(x) = 5x^3$, calcula $g(-2)$:'
  alternativas:
  - '-40'
  - '40'
  - '-30'
  - '30'
  respuesta: '-40'
  solucion_pasos:
  - 'Paso 1: $g(-2) = 5(-2)^3 = 5(-8) = -40$.'
- titulo: 'Ejemplo 3: Punto pivote unitario'
  enunciado: En $f(x) = -6x^5$, ¿cuál es el par ordenado para $x = 1$?
  alternativas:
  - (1, -6)
  - (1, 6)
  - (1, -30)
  - (1, 5)
  respuesta: (1, -6)
  solucion_pasos:
  - 'Paso 1: $f(1) = -6(1)^5 = -6 \implies (1, -6)$.'
- titulo: 'Ejemplo 4: Identificación de simetría en tabla'
  enunciado: Si una tabla muestra $(-2, 12)$ y $(2, 12)$, ¿qué paridad tiene la función potencia?
  alternativas:
  - Par (f(-x) = f(x))
  - Impar (f(-x) = -f(x))
  - No tiene paridad
  - Es exponencial
  respuesta: Par (f(-x) = f(x))
  solucion_pasos:
  - 'Paso 1: $f(-2) = f(2) = 12 \implies$ función par.'
errores_frecuentes:
- Elevar el coeficiente al exponente n por error de agrupación.
- Olvidar colocar paréntesis al calcular potencias de números negativos en calculadoras.
- Invertir las coordenadas escribiendo (f(x), x) en lugar de (x, f(x)).
afirmaciones_verdaderas:
- En la evaluación de f(x) = a · xⁿ, la potencia xⁿ tiene prioridad operativa sobre el producto por a.
- Toda función potencia con n > 0 contiene el origen (0, 0) y el punto pivote (1, a).
