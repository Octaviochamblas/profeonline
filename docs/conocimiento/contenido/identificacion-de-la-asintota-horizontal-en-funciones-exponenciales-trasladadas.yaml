semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ASINTOTA_TRANSFORMADA
resumen_inicial: 'La identificación de la asíntota horizontal en funciones exponenciales trasladadas $f(x) = a \cdot b^{x-h} + k$ extrae directamente el término constante $k$, definiendo la recta horizontal $\mathcal{A}_H: y = k$ gracias a la anulación asintótica del término exponencial.'
explicacion_simple: "![La identificación de la asíntota horizontal en funciones exponenciales trasladadas $f(x) = a \\cdot b^{x-h} + k$ extrae directamente el término constante $k$, definiendo la recta horizontal $\\mathcal{A}_H: y = k$ gracias a la anulación asintótica del término exponencial](/static/img/nodos/identificacion-de-la-asintota-horizontal-en-funciones-exponenciales-trasladadas-intro.svg)\n\n\nPara encontrar la **asíntota horizontal** de cualquier función exponencial por complicada que parezca (con traslaciones horizontales o factores de escala):\n\n1. **Busca el número suelto que esté sumando o restando fuera de la potencia:**\n   $$f(x) = 5 \\cdot 2^{x - 3} \\mathbf{+ 8}$$\n2. **Ese número $k$ es exactamente la altura de la asíntota horizontal:**\n   - Ecuación de la asíntota: **$y = 8$**.\n3. **¿Por qué ocurre esto?**\n   - Porque en el infinito la potencia $2^{x-3}$ se vuelve prácticamente cero ($0$), y solo sobrevive el número constante $+8$.\n4. **¡Cuidado!** El desplazamiento\
  \ horizontal $(x - h)$ no le cambia la altura a la asíntota."
explicacion_formal: 'Sea la familia general de exponenciales rígidas $f(x) = a \cdot b^{\alpha(x - h)} + k$ con $a \neq 0, \alpha \neq 0, b > 0, b \neq 1$. El operador asintótico $\mathbb{A}(f)$ se calcula mediante:

  $$\lim_{x \to \pm\infty} f(x) = \lim_{x \to \pm\infty} \left(a \cdot b^{\alpha(x - h)}\right) + k = 0 + k = k$$


  **Propiedades topológicas de la asíntota horizontal transformada**:

  1. **Independencia del desplazamiento horizontal ($h$)**: $\frac{\partial \mathcal{A}_H}{\partial h} = 0$.

  2. **Independencia del factor de escala ($a$)**: $\frac{\partial \mathcal{A}_H}{\partial a} = 0$.

  3. **Determinación estricta por $k$**: La ecuación lineal afín horizontal es invariablemente $\mathcal{A}_H = \{(x, y) \in \mathbb{R}^2 \mid y = k\}$.'
definiciones_clave: '- **Asíntota horizontal invariante a $h$**: Propiedad por la cual los corrimientos laterales no modifican la posición vertical de la asíntota.

  - **Frontera del recorrido**: Recta $y = k$ que define la frontera topológica del conjunto imagen.'
propiedades_relaciones: '- **Cálculo por inspección visual**: En la expresión canónica $f(x) = a \cdot b^{x-h} + k$, el término independiente es idénticamente la ordenada asintótica.

  - **Línea de aproximación unilateral**: Para $b > 1$, la convergencia a $y = k$ ocurre cuando $x \to -\infty$; para $0 < b < 1$, cuando $x \to +\infty$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de la asíntota horizontal en funciones exponenciales trasladadas $f(x) = a \cdot b^{x-h} + k$ extrae directamente el término constante $k$, definiendo la recta horizontal $\mathcal{A}_H: y = k$ gracias a la anulación asintótica del término exponencial](/static/img/nodos/identificacion-de-la-asintota-horizontal-en-funciones-exponenciales-trasladadas-ejemplos.svg)



    Determina la ecuación de la asíntota horizontal para las siguientes funciones transformadas:

    1) $f(x) = 6 \cdot 3^{x-4} + 10$

    2) $g(x) = -2 \cdot (0{,}5)^{x+1} - 7$

    3) $h(x) = 8^{2x+5}$'
  pasos:
  - 'Paso 1: Para $f(x) = 6 \cdot 3^{x-4} + 10$:

    - El término constante exterior es $k = 10$.

    - Asíntota horizontal: recta **$y = 10$**.'
  - 'Paso 2: Para $g(x) = -2 \cdot (0{,}5)^{x+1} - 7$:

    - El término constante exterior es $k = -7$.

    - Asíntota horizontal: recta **$y = -7$**.'
  - 'Paso 3: Para $h(x) = 8^{2x+5}$:

    - No hay término constante exterior sumado ($k = 0$).

    - Asíntota horizontal: recta **$y = 0$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la asíntota horizontal de la función $f(x) = 9 \cdot 5^{x-7} - 12$?
  choices:
  - text: y = -12
    is_correct: true
  - text: x = 7
    is_correct: false
  - text: y = 7
    is_correct: false
  - text: y = 9
    is_correct: false
  explanation: La alternativa correcta es 'y = -12'. El término constante aditivo exterior es $k = -12$, por lo que la recta asíntota es $y = -12$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Afecta el valor de h en $f(x) = 2^{x - 100} + 4$ a la altura de la asíntota horizontal?
  choices:
  - text: No, la asíntota depende exclusivamente de k = 4 (recta y = 4)
    is_correct: true
  - text: Sí, la asíntota se desplaza a x = 100
    is_correct: false
  - text: Sí, la asíntota pasa a ser y = 104
    is_correct: false
  - text: Sí, anula la asíntota
    is_correct: false
  explanation: La alternativa correcta es 'No, la asíntota depende exclusivamente de k = 4 (recta y = 4)'. Los desplazamientos horizontales solo mueven la curva hacia los lados.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función exponencial en la forma general trasladada $f(x) = a \cdot b^{x-h} + k$.'
- 'Paso 2: Aislar la constante aditiva exterior $k$.'
- 'Paso 3: Si no hay constante escrita, asignar $k = 0$.'
- 'Paso 4: Escribir formalmente la ecuación lineal de la asíntota horizontal como $y = k$.'
errores_correccion: '- **Error común:** Escribir $x = h$ creyendo que hay una asíntota vertical.

  - **Cómo corregirlo:** Las funciones exponenciales **NO TIENEN asíntotas verticales**; solo tienen asíntota **horizontal $y = k$**.'
ejemplos:
- titulo: 'Ejemplo 1: Extracción directa'
  enunciado: En $f(x) = 3^{x+8} + 15$, ¿cuál es la asíntota?
  alternativas:
  - y = 15
  - x = -8
  - y = 8
  - y = 0
  respuesta: y = 15
  solucion_pasos:
  - 'Paso 1: $k = 15 \implies y = 15$.'
- titulo: 'Ejemplo 2: Asíntota negativa'
  enunciado: En $g(x) = 2 \cdot (0{,}4)^{x-1} - 1$, ¿cuál es la asíntota?
  alternativas:
  - y = -1
  - x = 1
  - y = 1
  - y = 2
  respuesta: y = -1
  solucion_pasos:
  - 'Paso 1: $k = -1 \implies y = -1$.'
- titulo: 'Ejemplo 3: Función básica sin término k'
  enunciado: ¿Cuál es la asíntota horizontal de $h(x) = 7 \cdot 2^{x+3}$?
  alternativas:
  - y = 0
  - x = -3
  - y = 7
  - y = 3
  respuesta: y = 0
  solucion_pasos:
  - 'Paso 1: Como $k = 0 \implies y = 0$.'
- titulo: 'Ejemplo 4: Distinción entre variables'
  enunciado: ¿Por qué es incorrecto escribir $x = 5$ como asíntota horizontal?
  alternativas:
  - Porque x = 5 representa una recta vertical, mientras que las horizontales se escriben como y = k
  - Porque 5 es primo
  - Porque las asíntotas no llevan letras
  - Porque x es el dominio
  respuesta: Porque x = 5 representa una recta vertical, mientras que las horizontales se escriben como y = k
  solucion_pasos:
  - 'Paso 1: Las rectas horizontales tienen ecuación $y = \text{cte}$.'
errores_frecuentes:
- Confundir desplazamientos horizontales en el exponente con la posición de la asíntota.
- Escribir x en lugar de y en la ecuación de la recta asintótica.
- Sumar el parámetro a al valor de k al formular la asíntota.
afirmaciones_verdaderas:
- En f(x) = a · b^(x-h) + k, la ecuación de la asíntota horizontal es estrictamente y = k.
- El desplazamiento horizontal h no modifica la altura de la asíntota horizontal.
al_terminar_debes_poder: '**QUÉ:** Identificar y formular la ecuación de la asíntota horizontal en funciones exponenciales trasladadas.


  **CÓMO:** Extrayendo el término constante exterior k para enunciar la recta y = k.


