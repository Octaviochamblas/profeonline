semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ASINTOTA_TRANSFORMADA
resumen_inicial: La identificación de la asíntota horizontal en funciones trasladadas determina la recta $y = k$ que limita inferior o superiormente el recorrido.
explicacion_simple: |
  Cuando la función exponencial incluye una **traslación vertical de la forma $f(x) = a \cdot b^x + k$**:

  - La **asíntota horizontal se desplaza de $y = 0$ a la recta de ecuación $y = k$**.
  - **Identificar $k$ es inmediato**: Es el término número constante que está sumando o restando fuera de la potencia.
    - En $f(x) = 2^x + 5 \implies$ Asíntota horizontal: **$y = 5$**.
    - En $g(x) = 3 \cdot 4^x - 8 \implies$ Asíntota horizontal: **$y = -8$**.
explicacion_formal: |
  Dada la familia de funciones exponenciales transformadas $f(x) = a \cdot b^{c(x - h)} + k$ sobre $\mathbb{R}$ con $a, c \neq 0, b \in \mathbb{R}^+ \setminus \{1\}, k \in \mathbb{R}$, la recta horizontal $L: y = k$ es su **asíntota horizontal única**:

  **Demostración por límites del comportamiento asintótico:**
  1. **Caso Creciente Unilateral ($a \cdot c \cdot \ln(b) > 0$):**
     $$\lim_{x \to -\infty} \left(a \cdot b^{c(x - h)} + k\right) = a \cdot 0 + k = k$$
     La curva se aproxima a la recta $y = k$ cuando $x \to -\infty$.
  2. **Caso Decreciente Unilateral ($a \cdot c \cdot \ln(b) < 0$):**
     $$\lim_{x \to +\infty} \left(a \cdot b^{c(x - h)} + k\right) = a \cdot 0 + k = k$$
     La curva se aproxima a la recta $y = k$ cuando $x \to +\infty$.
definiciones_clave: |
  - **Asíntota horizontal trasladada**: Recta de ecuación $y = k$ correspondiente al valor límite constante al que tiende la función exponencial transformada cuando $x$ se aleja hacia el infinito.
propiedades_relaciones: |
  - **Frontera estricta del recorrido**: La asíntota $y = k$ define la cota infimal o suprema abierta del conjunto recorrido $\text{Rec}(f) = ]k, +\infty[$ (para $a > 0$) o $\text{Rec}(f) = ]-\infty, k[$ (para $a < 0$).
ejemplo_guiado:
  enunciado: 'Encuentra la ecuación de la asíntota horizontal y el recorrido para la función $f(x) = -2 \cdot 3^{x-1} + 12$.'
  pasos:
    - 'Paso 1: Identificar el término constante fuera de la potencia: $k = 12$.'
    - 'Paso 2: Formular la ecuación de la asíntota horizontal: la recta es $y = 12$.'
    - 'Paso 3: Identificar el signo del coeficiente de escala $a = -2 < 0$.'
    - 'Paso 4: Concluir que las ordenadas quedan por debajo de la asíntota, fijando el recorrido en $]-\infty, 12[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación de la asíntota horizontal de la función exponencial $g(x) = 4 \cdot 2^{x+3} - 15$?'
    choices:
      - {text: 'La recta horizontal $y = -15$', is_correct: true}
      - {text: 'La recta horizontal $y = 4$.', is_correct: false}
      - {text: 'La recta horizontal $y = 0$.', is_correct: false}
      - {text: 'La recta vertical $x = -3$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal $y = -15$''. El término de traslación independiente es $k = -15$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si la gráfica de una función exponencial $f(x) = 5^x + k$ tiene como asíntota horizontal a la recta $y = 9$, ¿cuál es el valor de la constante $k$ y cuál su corte con Y?'
    choices:
      - {text: '$k = 9$ y la corte con el eje Y se ubica en $(0, 10)$', is_correct: true}
      - {text: '$k = 0$ y la corte con el eje Y se ubica en $(0, 9)$.', is_correct: false}
      - {text: '$k = 5$ y la corte con el eje Y se ubica en $(0, 14)$.', is_correct: false}
      - {text: '$k = 9$ y la corte con el eje Y se ubica en $(0, 9)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 9$ y la corte con el eje Y se ubica en $(0, 10)$''. $k=9 \implies f(0) = 5^0 + 9 = 1 + 9 = 10$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Inspeccionar la expresión de la función exponencial y aislar la constante independiente $k$.'
  - 'Paso 2: Escribir la ecuación de la asíntota en la forma explícita de recta horizontal $y = k$.'
  - 'Paso 3: Verificar que no haya variables asociadas a la constante $k$.'
  - 'Paso 4: Trazar la recta discontinua $y = k$ en el plano cartesiano como guía asintótica.'
errores_correccion: |
  - **Error común:** Escribir la asíntota como un simple número ($k$) o como una recta vertical ($x = k$).
  - **Cómo corregirlo:** La asíntota es una **RECTA HORIZONTAL**, por lo que su ecuación OBLIGATORIAMENTE lleva la letra $y$: **$y = k$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Asíntota con k positivo.
    alternativas:
      - 'Asíntota horizontal y = 8'
      - 'Asíntota vertical x = 8'
      - 'Asíntota y = 0'
    respuesta: 'Asíntota horizontal y = 8'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Asíntota con k negativo.
    alternativas:
      - 'Asíntota horizontal y = -2.5'
      - 'Asíntota horizontal y = 0'
      - 'Asíntota vertical x = -2.5'
    respuesta: 'Asíntota horizontal y = -2.5'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 3^x - 7$, la afirmación de que su asíntota horizontal es la recta $x = -7$.'
  - 'La confusión entre el valor de la asíntota $y = k$ y la ordenada del intercepto con el eje Y en $(0, a + k)$.'
  - 'La afirmación de que los desplazamientos horizontales en el exponente $(x - h)$ modifican la asíntota horizontal.'
  - 'La afirmación de que una función exponencial trasladada puede tener más de una asíntota horizontal.'
  - 'La afirmación de que si $k < 0$, la asíntota se convierte en vertical.'
afirmaciones_verdaderas:
  - 'La asíntota horizontal de cualquier función exponencial de la forma $f(x) = a \cdot b^{x-h} + k$ es la recta de ecuación $y = k$.'
  - 'La posición de la asíntota horizontal $y = k$ es totalmente independiente de las traslaciones horizontales $h$ o de la base $b$.'
al_terminar_debes_poder: |
  QUÉ: Identificar la ecuación de la asíntota horizontal en funciones exponenciales transformadas $f(x) = a \cdot b^{x-h} + k$.
  CÓMO: Isolar la constante independiente $k$, formular la ecuación de la recta $y = k$ e interpretar la cota del recorrido.
