semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_SECTOR_RADIANES
resumen_inicial: 'Cálculo del área de un sector circular en radianes usando A = θr²
  / 2: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y
  Círculo.'
explicacion_simple: Cuando el ángulo central se mide en radianes, la fórmula del área
  de un sector circular se simplifica de forma similar a la longitud de arco.
explicacion_formal: '![Área de sector circular: A = θr²/2](/static/img/geometria/circunferencia-circulo/circulo-area-sector-radianes.svg)


  ### Definición formal


  Si $\theta$ está expresado en radianes, el área del sector correspondiente es $A=\frac{\theta
  r^2}{2}$, sin necesidad de dividir entre 360° ni multiplicar por π (esos factores
  ya están incorporados en la definición del radián).


  ### Desarrollo didáctico


  Un sector con ángulo central de $\frac{\pi}{2}$ radianes (equivalente a 90°) en
  un círculo de radio 8 cm tiene área $A=\frac{(\pi/2)\times8^2}{2}=\frac{64\pi/2}{2}=16\pi\approx50,27$
  cm², coincidiendo con el resultado usando la fórmula en grados.'
