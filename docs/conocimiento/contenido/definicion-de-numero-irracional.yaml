semantic_id: MAT.NUM.IRRACIONALES.DEFINICION
resumen_inicial: Un número irracional es aquel número real que no se puede expresar
  como una fracción de dos números enteros ($\mathbb{I} = \mathbb{R} \setminus \mathbb{Q}$).
explicacion_simple: 'Un número es **irracional** cuando su representación decimal
  tiene infinitas cifras decimales que nunca se repiten en un patrón o período determinado:

  - $\sqrt{2} = 1{,}41421356...$

  - $\pi = 3{,}14159265...$

  No existe ninguna fracción $\frac{a}{b}$ con $a,b \in \mathbb{Z}$ ($b \neq 0$) que
  equivalga exactamente a un número irracional.'
explicacion_formal: 'El conjunto de los números irracionales $\mathbb{I}$ se define
  como el complemento del conjunto de los números racionales $\mathbb{Q}$ respecto
  al conjunto de los números reales $\mathbb{R}$: $\mathbb{I} = \mathbb{R} \setminus
  \mathbb{Q} = \{x \in \mathbb{R} \mid x \neq \frac{a}{b}, a,b \in \mathbb{Z}, b \neq
  0\}$.'
definiciones_clave: '- **Número irracional ($\mathbb{I}$)**: Número real con expansión
  decimal infinita aperiódica.'
propiedades_relaciones: '- **Disyunción**: $\mathbb{Q} \cap \mathbb{I} = \emptyset$.
  Un número real es racional o irracional, pero nunca ambos.'
ejemplo_guiado:
  enunciado: Determina si el número $x = 0{,}1010010001...$ (donde el número de ceros
    aumenta progresivamente) es racional o irracional.
  pasos:
  - Observar la representación decimal del número.
  - Notar que tiene infinitos decimales, pero NO tiene un período que se repita de
    forma fija.
  - Como no es periódico ni finito, no se puede escribir como fracción.
  - Concluir que es un número **irracional**.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes afirmaciones sobre los números irracionales es
    CORRECTA?
  choices:
  - text: No se pueden expresar como una fracción a/b con a y b enteros
    is_correct: true
  - text: Tienen expansión decimal finita o periódica
    is_correct: false
  - text: Pertenecen al conjunto de los números racionales Q
    is_correct: false
  - text: Son siempre números negativos
    is_correct: false
  explanation: 'La correcta es: No se pueden expresar como una fracción a/b con a
    y b enteros. Por definición de $\mathbb{I} = \mathbb{R} \setminus \mathbb{Q}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Puede un número ser racional e irracional al mismo tiempo?
  choices:
  - text: No, porque Q e I son conjuntos disjuntos (Q ∩ I = ∅)
    is_correct: true
  - text: Sí, si el número es el cero
    is_correct: false
  - text: Sí, si el número es entero
    is_correct: false
  - text: Depende de la base numérica
    is_correct: false
  explanation: 'La correcta es: No, porque Q e I son conjuntos disjuntos (Q ∩ I =
    ∅). Todo número real pertenece exclusivamente a uno de los dos conjuntos.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analizar la representación decimal del número.'
- 'Paso 2: Si los decimales son infinitos sin patrón periódico, declarar que es irracional.'
- 'Paso 3: Si proviene de una fracción de enteros, declarar que es racional.'
errores_correccion: No confundas decimales infinitos periódicos (como $0{,}333...
  = 1/3 \in \mathbb{Q}$) con aperiódicos (como $\sqrt{2} \in \mathbb{I}$).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt{3}$ un número irracional?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - 3 no es cuadrado perfecto $\implies \sqrt{3} \in \mathbb{I}$.
errores_frecuentes:
- Confundir decimales periódicos con números irracionales.
afirmaciones_verdaderas:
- $\mathbb{I} = \mathbb{R} \setminus \mathbb{Q}$.
al_terminar_debes_poder: Definir números irracionales y diferenciarlos de los racionales.
fuente: Texto escolar MINEDUC.
estado: publicado
