guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.01.01'
  title: 'Definición de número irracional'
  description: 'Comprende formal y conceptualmente qué es un número irracional como aquel que no puede expresarse como el cociente de dos enteros.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'definicion-de-numero-irracional'
semantic_id: 'MAT.NUM.IRRACIONALES.DEFINICION'
titulo: 'Definición de número irracional'
objetivo: 'Reconocer y definir un número irracional a partir de su imposibilidad de representación como fracción de enteros y su expansión decimal infinita no periódica.'
introduccion: 'La diagonal de un cuadrado de lado $1$ mide $\sqrt{2}$: una longitud perfectamente concreta en la geometría que ninguna fracción de números enteros puede representar exactamente. Esta tensión entre la geometría y la aritmética motivó el descubrimiento de los números irracionales, el conjunto $\mathbb{I}$ (o $\mathbb{R} \setminus \mathbb{Q}$), que llena los infinitos vacíos o huecos que los números racionales dejan sobre la recta numérica.'
resumen: 'Un número irracional es un número real que no se puede escribir de la forma $\frac{a}{b}$, donde $a, b \in \mathbb{Z}$ y $b \neq 0$. Su representación decimal es siempre infinita no periódica. Junto con los racionales $\mathbb{Q}$, forman el conjunto de los números reales $\mathbb{R}$.'
requisitos:
  - 'Comprensión del conjunto de los números racionales $\mathbb{Q}$ y la representación decimal de una fracción.'
  - 'Diferenciación entre decimales finitos, periódicos y semiperiódicos.'
objetivos:
  - 'Definir formalmente un número irracional en términos de la imposibilidad de expresarlo como cociente de dos enteros.'
  - 'Diferenciar la naturaleza de los números irracionales respecto a los racionales en la recta numérica.'
que_aprenderas:
  - 'La definición matemática exacta del conjunto de los números irracionales.'
  - 'Por qué los números irracionales no se pueden expresar como fracción $\frac{a}{b}$.'
  - 'La relación entre la recta numérica continua y la combinación de $\mathbb{Q}$ e $\mathbb{I}$.'
al_terminar_debes_poder:
  - 'Identificar si un número dado pertenece al conjunto de los números irracionales.'
  - 'Explicar por qué un número con expansión decimal infinita sin período no pertenece a $\mathbb{Q}$.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿Cuál de las siguientes afirmaciones define correctamente a un número irracional?'
    choices:
      - {text: 'Es todo número que se puede expresar como una fracción $\frac{a}{b}$ con $a, b \in \mathbb{Z}$ y $b \neq 0$.', is_correct: false}
      - {text: 'Es un número real que no se puede expresar como el cociente de dos números enteros.', is_correct: true}
      - {text: 'Es cualquier número negativo con decimales infinitos.', is_correct: false}
      - {text: 'Es un número racional cuyo denominador es igual a cero.', is_correct: false}
    explanation: 'La correcta es: Es un número real que no se puede expresar como el cociente de dos números enteros. Por definición, los números irracionales son aquellos elementos de $\mathbb{R}$ que no pertenecen a $\mathbb{Q}$.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: 'Si la representación decimal de un número es infinita y no presenta ningún patrón repetitivo (período), ¿a qué conjunto numérico pertenece con certeza?'
    choices:
      - {text: 'Únicamente al conjunto de los números enteros $\mathbb{Z}$.', is_correct: false}
      - {text: 'Al conjunto de los números racionales $\mathbb{Q}$.', is_correct: false}
      - {text: 'Al conjunto de los números irracionales $\mathbb{I}$.', is_correct: true}
      - {text: 'No es un número real.', is_correct: false}
    explanation: 'La correcta es: Al conjunto de los números irracionales $\mathbb{I}$. Los números racionales siempre generan decimales finitos o periódicos, mientras que los irracionales generan decimales infinitos no periódicos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Analizar la estructura del número (si está dado como fracción, raíz o decimal).'
  - 'Paso 2: Comprobar si es posible expresarlo de la forma $\frac{a}{b}$ con $a, b \in \mathbb{Z}$ y $b \neq 0$.'
  - 'Paso 3: Si la forma $\frac{a}{b}$ no existe y su expansión decimal es infinita no periódica, clasificarlo definitivamente como número irracional.'
errores_frecuentes:
  - 'Creer que todo número con decimales es irracional (olvidando que los decimales finitos y periódicos son racionales).'
  - 'Confundir una aproximación racional (como $3{,}14$ o $\frac{22}{7}$) con el valor exacto de un irracional como $\pi$.'
errores_correccion: 'Un error muy común es pensar que cualquier número decimal largo es irracional. Recuerda que la clave no es la longitud, sino la existencia de un período: si los dígitos se repiten periódicamente (como $0{,}333\dots$), es racional. Solo si continúa indefinidamente sin patrón de repetición es irracional.'
ejemplos:
  - titulo: 'Clasificación de números'
    enunciado: 'Determina cuál de los siguientes números es irracional: $A = \frac{7}{3}$, $B = \sqrt{2}$, $C = 0{,}151515\dots$'
    alternativas:
      - '$A$ y $B$'
      - 'Solo $B$'
      - 'Solo $C$'
      - '$B$ y $C$'
    respuesta: 'Solo $B$'
    solucion_pasos:
      - '$A = \frac{7}{3}$ es una fracción de enteros, por lo que es racional ($A \in \mathbb{Q}$).'
      - '$C = 0{,}151515\dots = 0{,}\overline{15}$ es un decimal periódico, expresable como $\frac{15}{99}$, por lo que es racional ($C \in \mathbb{Q}$).'
      - '$B = \sqrt{2} \approx 1{,}41421356\dots$ no se puede expresar como fracción de enteros, por lo que es irracional ($B \in \mathbb{I}$).'
  - titulo: 'Pertenencia a conjuntos numéricos'
    enunciado: '¿Cuál de los siguientes números pertenece al conjunto $\mathbb{R} \setminus \mathbb{Q}$?'
    alternativas:
      - '$\sqrt{9}$'
      - '$-\frac{4}{5}$'
      - '$\sqrt{5}$'
      - '$2{,}75$'
    respuesta: '$\sqrt{5}$'
    solucion_pasos:
      - '$\sqrt{9} = 3 \in \mathbb{Z} \subset \mathbb{Q}$.'
      - '$-\frac{4}{5} = -0{,}8 \in \mathbb{Q}$.'
      - '$2{,}75 = \frac{11}{4} \in \mathbb{Q}$.'
      - '$\sqrt{5}$ es la raíz de un entero no potencia perfecta, su desarrollo decimal es infinito no periódico, por ende $\sqrt{5} \in \mathbb{R} \setminus \mathbb{Q}$.'
comprobacion_rapida:
  - afirmacion: 'El conjunto de los números irracionales y el de los racionales no tienen ningún elemento en común (son disjuntos).'
    respuesta: true
    explicacion: 'Correcto. La intersección $\mathbb{Q} \cap \mathbb{I} = \emptyset$.'
  - afirmacion: 'Cualquier número real que no sea racional es irracional.'
    respuesta: true
    explicacion: 'Correcto. Los reales se dividen exactamente en racionales e irracionales: $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.'
  - afirmacion: 'El número $3{,}1416$ es un número irracional.'
    respuesta: false
    explicacion: 'Falso. $3{,}1416$ es un decimal finito (igual a $\frac{31416}{10000}$), por lo que es racional. Es solo una aproximación de $\pi$.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales e irracionales.'
estado: 'publicado'
