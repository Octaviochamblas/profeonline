semantic_id: MAT.ALG.POLINOMIOS.IDENTIFICACION_TRINOMIO
resumen_inicial: 'Un trinomio es un polinomio compuesto por la suma o sustracción de exactamente tres términos algebraicos no semejantes.'
explicacion_simple: |
  - Un **trinomio** es un polinomio de **exactamente $3$ términos** que no se pueden reducir entre sí.
  - Ejemplos clásicos:
    - $ax^2 + bx + c$ (trinomio cuadrático general).
    - $x^2 + 6x + 9$ (trinomio cuadrado perfecto).
    - $2a^2 - 3ab + 5b^2$ (trinomio homogéneo).
  - Al igual que con los binomios, primero debemos **reducir todos los términos semejantes** para comprobar que realmente quedan $3$ términos finales.

  ![Identificación de Trinomio](/static/img/nodos/identificacion-de-trinomio-intro.svg)
explicacion_formal: |
  ### Definición formal
  Un **trinomio** es un polinomio $T \in \mathbb{K}[x_1, \dots, x_n]$ expresable de forma irreducible como la suma de exactamente tres monomios no nulos no semejantes:

  $$T = T_1 + T_2 + T_3 = c_1 X_1 + c_2 X_2 + c_3 X_3, \quad c_i \neq 0, \; X_i \not\equiv X_j \; (i \neq j)$$

  ### Familias notables de trinomios
  1. **Trinomio cuadrático de una variable:** $P(x) = ax^2 + bx + c$ ($a \neq 0$).
  2. **Trinomio Cuadrado Perfecto (TCP):** $a^2 \pm 2ab + b^2 = (a \pm b)^2$.
  3. **Trinomio de la forma:** $x^2 + (p+q)x + pq = (x + p)(x + q)$.
definiciones_clave: |
  - **Trinomio**: Polinomio constituido por exactamente tres términos algebraicos no semejantes.
  - **Trinomio Cuadrado Perfecto (TCP)**: Trinomio resultante de elevar un binomio al cuadrado.
  - **Trinomio homogéneo**: Aquel donde sus tres monomios componentes tienen exactamente el mismo grado absoluto.
propiedades_relaciones: |
  - **Factorización de trinomios**: Los trinomios cuadráticos se factorizan en producto de dos binomios lineales según sus raíces.
  - **Discriminante de un trinomio**: $\Delta = b^2 - 4ac$ determina la naturaleza de las raíces del trinomio cuadrático real.
ejemplo_guiado:
  enunciado: 'Simplifica la expresión $E = 4x^2 + 5x - 7 - x^2 + 2x + 1$ y clasifícala según su número de términos.'
  imagen: '/static/img/nodos/identificacion-de-trinomio-ejemplos.svg'
  pasos:
    - 'Paso 1: Agrupamos los términos cuadráticos: $4x^2 - x^2 = **3x^2$**.'
    - 'Paso 2: Agrupamos los términos lineales: $5x + 2x = **7x$**.'
    - 'Paso 3: Agrupamos los términos independientes constantes: $-7 + 1 = **-6$**.'
    - 'Paso 4: Escribimos la expresión reducida final: **$3x^2 + 7x - 6$**.'
    - 'Paso 5: Contamos los términos resultantes: tiene exactamente 3 términos no semejantes ($3x^2$, $7x$ y $-6$), por lo que es un **trinomio cuadrático**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones algebraicas corresponde a un trinomio?'
    choices:
      - text: '$x^2 - 6x + 9$'
        is_correct: true
      - text: '$2x^3 - 5x$'
        is_correct: false
      - text: '$4x^3 - 2x^2 + 7x - 1$'
        is_correct: false
      - text: '$8a^2b^3c$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$x^2 - 6x + 9$''. Posee exactamente tres términos algebraicos no semejantes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al desarrollar el cuadrado de un binomio $(x + 4)^2$, ¿qué tipo de polinomio se obtiene?'
    choices:
      - text: 'Un trinomio cuadrado perfecto: $x^2 + 8x + 16$'
        is_correct: true
      - text: 'Un binomio: $x^2 + 16$'
        is_correct: false
      - text: 'Un monomio: $16x^2$'
        is_correct: false
      - text: 'Un polinomio de 4 términos'
        is_correct: false
    explanation: 'La alternativa correcta es ''Un trinomio cuadrado perfecto: $x^2 + 8x + 16$''. $(a+b)^2 = a^2 + 2ab + b^2$ produce exactamente 3 términos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todos los monomios que integran la expresión.'
  - 'Paso 2: Reducir los términos semejantes agrupando coeficientes de igual parte literal.'
  - 'Paso 3: Contabilizar los términos no nulos en la forma reducida.'
  - 'Paso 4: Si el resultado contiene exactamente tres monomios irreducibles, clasificar como trinomio.'
errores_correccion: |
  - **Error 1:** Afirmar que $(x+3)^2 = x^2 + 9$ es un binomio. **Cómo corregirlo:** El desarrollo correcto es el **trinomio** $x^2 + 6x + 9$, incluyendo el doble producto central.
  - **Error 2:** Contar 4 términos sin reducir en expresiones como $x^2 + 2x + 3x + 5$. **Cómo corregirlo:** Reducir $2x + 3x = 5x$ para obtener el **trinomio** $x^2 + 5x + 5$.
ejemplos:
  - titulo: 'Identificación de TCP'
    enunciado: '¿Es la expresión $a^2 - 10a + 25$ un trinomio cuadrado perfecto?'
    alternativas:
      - 'Sí, equivale al desarrollo de $(a - 5)^2$'
      - 'No, es un binomio'
      - 'No, porque el término central es negativo'
    respuesta: 'Sí, equivale al desarrollo de $(a - 5)^2$'
    solucion_pasos:
      - '1. Tiene 3 términos: $a^2, -10a, 25$.'
      - '2. $\sqrt{a^2} = a$, $\sqrt{25} = 5$, y el doble producto es $2(a)(5) = 10a$.'
      - '3. Equivale a $(a - 5)^2$ (Trinomio Cuadrado Perfecto).'
  - titulo: 'Reducción a trinomio'
    enunciado: '¿Cuál es la forma reducida de $5x^3 - 2x^2 + 4 - 2x^3 + 7$?'
    alternativas:
      - '$3x^3 - 2x^2 + 11$, que es un trinomio'
      - '$7x^3 + 11$, que es un binomio'
      - '$3x^5 + 11$, que es un binomio'
    respuesta: '$3x^3 - 2x^2 + 11$, que es un trinomio'
    solucion_pasos:
      - '1. $5x^3 - 2x^3 = 3x^3$.'
      - '2. Término cuadrático: $-2x^2$.'
      - '3. Término independiente: $4 + 7 = 11$.'
      - '4. Quedan 3 términos: $3x^3 - 2x^2 + 11$ (trinomio).'
  - titulo: 'Trinomio en dos variables'
    enunciado: '¿Es $x^2 + xy + y^2$ un trinomio homogéneo de segundo grado?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Contiene 3 términos no semejantes: $x^2, xy, y^2$.'
      - '2. Cada término tiene grado 2.'
      - '3. Es un trinomio homogéneo.'
  - titulo: 'Expresión reducible a binomio'
    enunciado: '¿Es $2x + 3y - 2x + 8$ un trinomio?'
    respuesta: 'No'
    solucion_pasos:
      - '1. $2x - 2x = 0$.'
      - '2. La expresión se reduce a $3y + 8$, que tiene solo 2 términos (binomio).'
errores_frecuentes:
  - 'Olvidar el término del doble producto al desarrollar cuadrados de binomios, perdiendo la estructura de trinomio.'
  - 'Clasificar expresiones antes de reducir monomios semejantes.'
  - 'Creer que un trinomio debe contener obligatoriamente una variable elevada al cuadrado.'
  - 'Confundir un trinomio de tres variables ($x + y + z$) con un polinomio de grado mayor.'
  - 'Suponer que los tres términos de un trinomio no pueden tener coeficientes fraccionarios.'
afirmaciones_verdaderas:
  - 'Un trinomio es un polinomio constituido por exactamente tres términos algebraicos no semejantes.'
  - 'El cuadrado de cualquier binomio real $(a \pm b)^2$ genera un trinomio cuadrado perfecto irreducible.'
al_terminar_debes_poder: |
  ![Resumen de Trinomio](/static/img/nodos/identificacion-de-trinomio-resumen.svg)

  QUÉ: Identificar, simplificar y caracterizar trinomios algebraicos (incluyendo trinomios cuadráticos y trinomios cuadrados perfectos).
  CÓMO: Agrupando y reduciendo términos semejantes para constatar la presencia de exactamente tres monomios irreducibles ($T = T_1 + T_2 + T_3$).
