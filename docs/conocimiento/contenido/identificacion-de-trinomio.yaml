resumen_inicial: Un trinomio es un polinomio compuesto estrictamente por exactamente
  tres términos monómicos no semejantes.
explicacion_simple: Un trinomio es un polinomio de tres partes o términos (como $x^2
  + 5x + 6$ o $2a^2 - 3ab + b^2$). Sus tres términos deben ser no semejantes entre
  sí para que la expresión no se pueda reducir.
explicacion_formal: 'Un **Trinomio** $T$ se define como la suma algebraica de tres
  monomios $T_1, T_2, T_3$ no semejantes dos a dos:


  $$T = T_1 + T_2 + T_3 \quad \text{con } \text{Lit}(T_i) \neq \text{Lit}(T_j) \quad
  \forall i \neq j$$


  > **Complemento didáctico:** El trinomio es la estructura característica de las
  ecuaciones cuadráticas $ax^2 + bx + c = 0$ y del desarrollo del cuadrado de binomio.'
definiciones_clave: '- **Trinomio**: Polinomio de exactamente 3 términos no semejantes.

  - **Trinomio cuadrado perfecto**: Resultado de elevar un binomio al cuadrado ($a^2
  \pm 2ab + b^2$).'
propiedades_relaciones: '- **Forma cuadrática**: $ax^2 + bx + c$ es la representación
  canónica de una función cuadrática.'
ejemplo_guiado:
  enunciado: Verifique si $P(x) = 2x^2 + 7x - 3$ es un trinomio.
  pasos:
  - 'Paso 1: Identificar término 1: $2x^2$ (grado 2).

    - Paso 2: Identificar término 2: $+7x$ (grado 1).

    - Paso 3: Identificar término 3: $-3$ (grado 0).'
  - 'Paso 4: Comprobar que no son semejantes entre sí $\to$ no se pueden reducir.'
  - 'Conclusión: Tiene exactamente 3 términos no semejantes, por lo que SÍ es un trinomio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos términos no semejantes posee obligatoriamente un trinomio?
  choices:
  - text: Exactamente tres términos no semejantes
    is_correct: true
  - text: Dos términos
    is_correct: false
  - text: Cuatro términos
    is_correct: false
  - text: Un solo término
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente tres términos no semejantes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2x^2 + 7x - 3, ¿por qué se declaró como un trinomio?
  choices:
  - text: Porque contiene tres términos no semejantes de grados 2, 1 y 0
    is_correct: true
  - text: Porque su coeficiente principal es 2
    is_correct: false
  - text: Porque se puede dividir entre 3
    is_correct: false
  - text: Porque todos sus signos son positivos
    is_correct: false
  explanation: La alternativa correcta es 'Porque contiene tres términos no semejantes
    de grados 2, 1 y 0'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reducir cualquier par de términos semejantes dentro de la expresión.'
- 'Paso 2: Contar los términos irreducibles restantes.'
- 'Paso 3: Si la cuenta da exactamente 3, declarar que es un trinomio.'
errores_correccion: '- **Error 1: Declarar $x^2 + 3x + 2x$ como trinomio.** **Cómo
  corregirlo:** Los términos $3x$ y $2x$ son semejantes y se suman ($x^2 + 5x$), resultando
  en un binomio de 2 términos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes polinomios es un trinomio?
  alternativas:
  - m^2 - 4m + 4
  - m^2 - 4
  - 5m^3
  - a + b + c + d
  respuesta: m^2 - 4m + 4
  solucion_pasos:
  - 1. m^2 - 4m + 4 posee 3 términos irreducibles. Es un trinomio.
- titulo: Ejemplo 2
  enunciado: Al desarrollar (x + 3)^2 se obtiene x^2 + 6x + 9. ¿Qué tipo de polinomio
    es este resultado?
  alternativas:
  - Un trinomio (trinomio cuadrado perfecto)
  - Un binomio
  - Un monomio
  - Un tetranomio
  respuesta: Un trinomio (trinomio cuadrado perfecto)
  solucion_pasos:
  - '1. Consta de 3 términos no semejantes: x^2, +6x y +9. Es un trinomio.'
- titulo: ¿Es la expresión 4a^2 - 5ab + b^2 un trinomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, posee 3 términos no semejantes.
- titulo: ¿Es el polinomio x^3 + 2x^2 - x^2 + 5 un trinomio?
  respuesta: 'No'
  solucion_pasos:
  - No, al reducir 2x^2 - x^2 = x^2, queda x^3 + x^2 + 5 (un trinomio)... ¡un momento!
    Al reducir queda x^3 + x^2 + 5 que sigue teniendo 3 términos, por lo que SÍ es
    trinomio. Si la expresión fuera x^3 + x^2 - x^2 se reduciría a x^3 (monomio).
errores_frecuentes:
- Contar cuatro términos sin reducir dos términos semejantes presentes en la expresión.
- Declarar un trinomio con un binomio al ignorar el término independiente.
- Declarar que los coeficientes de un trinomio deben ser todos positivos.
- Declarar que un trinomio sólo puede tener una sola variable.
- Declarar el grado absoluto 3 de un monomio con la cantidad de 3 términos de un trinomio.
afirmaciones_verdaderas:
- Un trinomio es un polinomio compuesto exactamente por tres términos no semejantes.
- El desarrollo del cuadrado de un binomio (a+b)^2 genera siempre un trinomio cuadrado
  perfecto.
al_terminar_debes_poder: Al terminar serás capaz de identificar un trinomio reduciendo
  términos semejantes y verificando la presencia de exactamente tres términos resultantes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Polinomios.
