procedimiento:
- 'Paso 1: Detecta y reduce todos los términos semejantes que existan (suma peras
  con peras).'
- 'Paso 2: Cuenta los bloques que sobrevivieron a la reducción, separados por los
  signos de adición/sustracción.'
- 'Paso 3: Si el conteo final de bloques irreductibles es tres, es un trinomio.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de trinomio.
ejemplos:
- titulo: Contando bloques irreductibles
  enunciado: Verifica si 5x^3 - x^2 - x^2 es un trinomio.
  solucion_pasos:
  - Visualmente tiene tres pedazos.
  - Pero -x^2 y -x^2 son semejantes. Se reducen a -2x^2.
  - La expresión final es 5x^3 - 2x^2.
  - Solo quedaron dos términos. Es un Binomio, no un trinomio.
- titulo: Un sistema geométrico genera polinomios basados en los lados de un terreno.
    Una lectura arro
  enunciado: 'Un sistema geométrico genera polinomios basados en los lados de un terreno.
    Una lectura arroja la expresión de perímetro: $L + L + 2L$. El sistema intenta
    enviarlo al módulo de ''Resolución de Trinomios'' porque cuenta tres separaciones,
    pero la red colapsa. ¿Por qué fue un error de sistema? (v1)


    Opciones: A) Porque todos los términos son semejantes y se reducen a un Monomio
    ($4L$); intentar aplicar métodos de Trinomio a algo que no lo es provoca el fallo.
    · B) Porque el número 2 en el último término lo convierte en Binomio. · C) Porque
    los trinomios requieren al menos dos letras diferentes en su estructura. · D)
    Porque los trinomios no se pueden usar en perímetros.'
  solucion_pasos:
  - Jamás se clasifica una expresión sin antes reducir términos. $L+L+2L = 4L$. Es
    un simple monomio lineal.
  - 'Respuesta: Porque todos los términos son semejantes y se reducen a un Monomio
    ($4L$); intentar aplicar métodos de Trinomio a algo que no lo es provoca el fallo.'
- titulo: 'Respecto de «Identificación de trinomio»: ¿La siguiente formulación es
    correcta? «Un **Trino'
  enunciado: 'Respecto de «Identificación de trinomio»: ¿La siguiente formulación
    es correcta? «Un **Trinomio** es un polinomio compuesto por la suma o diferencia
    de **exactamente tres términos** que no son semejantes entre sí»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Trinomio** es un polinomio
    compuesto por la suma o diferencia de **exactamente tres términos** que no son
    semejantes entre sí.'
- titulo: 'Respecto de «Identificación de trinomio»: ¿La siguiente conclusión es correcta?
    «No reducir'
  enunciado: 'Respecto de «Identificación de trinomio»: ¿La siguiente conclusión es
    correcta? «No reducir términos semejantes y clasificar una expresión larga como
    trinomio solo contando los espacios»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Trinomio** es un polinomio
    compuesto por la suma o diferencia de **exactamente tres términos** que no son
    semejantes entre sí.'
errores_frecuentes:
- No reducir términos semejantes y clasificar una expresión larga como trinomio solo
  contando los espacios.
- Ignorar el término numérico independiente (ej. en $x^2+x+1$, creer que no es trinomio
  porque el 1 no tiene letras. Los tres bloques cuentan).
- Para «¿Cuántos términos independientes no reducibles entre sí requiere poseer un
  polinomio para ser clasificado y nombrado formalmente como un 'Trinomio'? (v1)»,
  la respuesta correcta es Exactamente dos.
- Tres o más.
- Para «¿Cuántos términos independientes no reducibles entre sí requiere poseer un
  polinomio para ser clasificado y nombrado formalmente como un 'Trinomio'? (v1)»,
  la respuesta correcta es Exactamente cuatro.
afirmaciones_verdaderas:
- La notación de identificación de trinomio sigue las convenciones del lenguaje algebraico.
al_terminar_debes_poder: Identificar y operar con conceptos relativos a identificación
  de trinomio.
