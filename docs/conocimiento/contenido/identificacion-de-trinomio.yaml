semantic_id: MAT.ALG.EXPRESIONES.IDENTIFICACION_TRINOMIO
resumen_inicial: 'Identificación de trinomio: concepto y propiedades en Expresiones
  algebraicas y polinomios básicos.'
explicacion_simple: El 'tri' lo vemos en triángulos, triciclos, trípodes. Cuando el
  tren algebraico suma un vagón más y llega a tres piezas fundamentales, lo bautizamos
  como Trinomio.
explicacion_formal: '### Definición formal


  El prefijo Tri determina un número exacto de componentes (3).


  ### Desarrollo didáctico


  Visualmente, un trinomio puro tiene dos ''puentes'' (+ o -) libres en su estructura,
  separando el conjunto en tres bloques.

  - Expresión base: $x^2 + 5x + 6$. (Un bloque cuadrático, un bloque lineal, y un
  bloque numérico independiente). Es el clásico trinomio de la forma general.

  - Expresión: $a + b - c$. Tres variables distintas. Es un trinomio.

  - Expresión engañosa: $x^2 + 2x - 2x$. ¿Es un trinomio? No. El $+2x$ y el $-2x$
  son semejantes y se anulan mutuamente (da $0x$). La expresión real es simplemente
  $x^2$. Era un **monomio** disfrazado de trinomio.'
definiciones_clave: '- **Identificación de trinomio**: Elemento fundamental del lenguaje
  algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de trinomio**: Reglas de
  notación y clasificación en expresiones algebraicas y polinomios básicos.'
ejemplo_guiado:
  enunciado: Identifica o calcula los elementos correspondientes a identificación
    de trinomio en una expresión dada.
  pasos:
  - Analizar la expresión algebraica dada.
  - Aplicar los criterios de identificación de trinomio.
  - Efectuar la clasificación o cálculo de grados/coeficientes según corresponda.
  - Escribir la respuesta final de forma ordenada.
