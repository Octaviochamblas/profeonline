semantic_id: MAT.GEO.TRIANGULOS_NOTABLES.TRIANGULO_30_60_90
resumen_inicial: El triángulo notable 30°-60°-90° es la mitad de un triángulo equilátero;
  si el cateto menor opuesto a 30° mide $k$, la hipotenusa mide $2k$ y el cateto mayor
  mide $k\sqrt{3}$.
explicacion_simple: Imagina cortar un triángulo equilátero justo por la mitad de arriba
  a abajo. El lado de abajo queda partido a la mitad ($k$), la altura mide $k\sqrt{3}$
  y el lado inclinado mide el doble ($2k$).
explicacion_formal: 'En el **triángulo rectángulo notable 30°-60°-90°**, las proporciones
  entre sus lados opuestos a $30^\circ, 60^\circ, 90^\circ$ son proporcionales a $1
  : \sqrt{3} : 2$.


  $$\text{Cateto menor } (30^\circ) = k, \quad \text{Cateto mayor } (60^\circ) = k\sqrt{3},
  \quad \text{Hipotenusa } (90^\circ) = 2k$$'
definiciones_clave: '- **Triángulo 30°-60°-90°**: Triángulo rectángulo escaleno notable
  procedente de la mitad de un equilátero.

  - **Relación $1:\sqrt{3}:2$**: Proporción fija de sus lados.'
propiedades_relaciones: '- **Hipotenusa doble**: La hipotenusa es exactamente el doble
  del cateto menor opuesto a $30^\circ$.

  - **Cateto mayor**: El cateto opuesto a $60^\circ$ equivale al cateto menor multiplicado
  por $\sqrt{3}$.'
ejemplo_guiado:
  enunciado: Una rampa con diseño notable 30°-60°-90° tiene un cateto menor (opuesto
    a 30°) de altura $h = 5\text{ m}$. Calcula la longitud de la rampa (hipotenusa)
    y del cateto mayor en el suelo.
  pasos:
  - 'Paso 1: Aplicar las relaciones del triángulo 30°-60°-90° con cateto menor $k
    = 5$.'
  - 'Paso 2: Calcular la hipotenusa: $\text{hipotenusa} = 2k = 2 \cdot 5 = 10\text{
    m}$.'
  - 'Paso 3: Calcular el cateto mayor: $\text{cateto mayor} = k\sqrt{3} = 5\sqrt{3}\text{
    m}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un triángulo 30°-60°-90°, si el cateto opuesto a 30° mide k, ¿cuánto
    mide la hipotenusa?
  choices:
  - text: 2k
    is_correct: true
  - text: k√3
    is_correct: false
  - text: k√2
    is_correct: false
  - text: 3k
    is_correct: false
  explanation: La alternativa correcta es '2k', pues la hipotenusa es siempre el doble
    del cateto menor.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la altura (cateto menor opuesto a 30°) mide 5 m, ¿cuánto mide la longitud
    de la rampa (hipotenusa)?
  choices:
  - text: 10 m
    is_correct: true
  - text: 5√3 m
    is_correct: false
  - text: 5 m
    is_correct: false
  - text: 15 m
    is_correct: false
  explanation: La alternativa correcta es '10 m', calculada como $2 \cdot 5 = 10\text{
    m}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 56° y 73°, ¿cuánto mide
    el tercero?
  alternativas:
  - 51°
  - 129°
  - 90°
  respuesta: 51°
  solucion_pasos:
  - Despejar $x = 180 - (56 + 73) = 51^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 109 cm y 147 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 254 cm
  - 261 cm
  - 0 cm
  respuesta: 254 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 256 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de relación de lados en el triángulo notable 30°-60°-90° resolviendo
  problemas geométricos con rigurosidad.
