semantic_id: MAT.GEO.ROTACION_PLANO.ANGULO_ROTACION
resumen_inicial: 'Identificación del ángulo de rotación: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: El ángulo de rotación indica 'cuántos grados' se gira la figura
  completa alrededor del centro fijo.
explicacion_formal: '![Ángulo de rotación](/static/img/geometria/isometrias/rotacion-angulo.svg)


  ### Definición formal


  El ángulo de rotación $\theta$ es el mismo para todos los puntos de la figura: es
  la medida del ángulo $\angle POP''$ entre el radio al punto original y el radio
  a su imagen, medido desde el centro de rotación $O$.


  ### Desarrollo didáctico


  En la figura, el punto $P$ gira un ángulo $\theta=70°$ alrededor del centro $O$
  para llegar a su imagen $P''$. Este mismo ángulo se aplica a todos los demás puntos
  de la figura.'
definiciones_clave: '- **Identificación del ángulo de rotación**: Elemento o propiedad
  fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del ángulo de rotación.'
ejemplo_guiado:
  enunciado: Al realizar la transformación isométrica sobre identificación del ángulo
    de rotación, se aplica la regla al punto $P(1, 8)$ con parámetro $v = (6, -5)$.
    Halla las coordenadas de la imagen $P'$.
  pasos:
  - Identificar la función de transformación asociada a identificación del ángulo
    de rotación.
  - Aplicar la operación sobre el punto $P(1, 8)$.
  - Concluir las coordenadas del punto transformado $P'$.
