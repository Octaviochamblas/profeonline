semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.CAMBIO_BASE
resumen_inicial: La fórmula de cambio de base $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ transforma un logaritmo en base $b$ en el cociente de dos logaritmos bajo una nueva base común $c$, permitiendo calcular logaritmos en calculadoras y simplificar cadenas multiplicativas.
explicacion_simple: "![La fórmula de cambio de base $\\log_b(a) = \\frac{\\log_c(a)}{\\log_c(b)}$ transforma un logaritmo en base $b$ en el cociente de dos logaritmos bajo una nueva base común $c$, permitiendo calcular logaritmos en calculadoras y simplificar cadenas multiplicativas](/static/img/nodos/uso-de-la-formula-de-cambio-de-base-en-expresiones-logaritmicas-intro.svg)\n\n\n¿Cómo calculas en tu calculadora un logaritmo como $\\log_8(32)$ si la calculadora solo tiene los botones **LOG** (base 10) y **LN** (base natural $e$)?\n\n- **La fórmula mágica de cambio de base:**\n  $$\\log_{\\mathbf{b}}(\\mathbf{a}) = \\frac{\\log(\\mathbf{a})}{\\log(\\mathbf{b})}$$\n- **Regla mnemotécnica infalible:**\n  - El **argumento $a$** está ARRIBA $\\implies$ va al **numerador** $\\log(a)$.\n  - La **base $b$** está ABAJO $\\implies$ va al **denominador** $\\log(b)$.\n- **Ejemplo con base prima común (base 2):**\n  $$\\log_8(32) = \\frac{\\log_2(32)}{\\log_2(8)} = \\frac{5}{3}$$\n- **Propiedad del espejo:**\
  \ $\\log_b(a) = \\frac{1}{\\log_a(b)}$."
explicacion_formal: 'Sean $a, b, c \in \mathbb{R}^+$ con $b \neq 1$ y $c \neq 1$. Sea $x = \log_b(a) \iff b^x = a$.

  Aplicando el logaritmo en la nueva base $c$ a ambos miembros:

  $$\log_c(b^x) = \log_c(a)$$

  Por la propiedad del logaritmo de una potencia, bajamos el exponente $x$:

  $$x \cdot \log_c(b) = \log_c(a)$$

  Como $b \neq 1 \implies \log_c(b) \neq 0$, despejamos $x$ dividiendo formalmente:

  $$x = \frac{\log_c(a)}{\log_c(b)} \Longleftrightarrow \log_b(a) = \frac{\log_c(a)}{\log_c(b)}$$


  **Corolario de inversión de base y argumento ($c = a$)**:

  $$\log_b(a) = \frac{\log_a(a)}{\log_a(b)} = \frac{1}{\log_a(b)}$$'
definiciones_clave: '- **Fórmula de cambio de base**: Cociente $\frac{\log_c(a)}{\log_c(b)}$ que reescribe la base del operador.

  - **Relación recíproca**: Propiedad $\log_b(a) \cdot \log_a(b) = 1$.'
propiedades_relaciones: '- **Simplificación telescópica en cadena**: $\log_a(b) \cdot \log_b(c) \cdot \log_c(d) = \log_a(d)$.

  - **Universalidad de cálculo**: Permite calcular cualquier logaritmo mediante $\frac{\ln(a)}{\ln(b)}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La fórmula de cambio de base $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ transforma un logaritmo en base $b$ en el cociente de dos logaritmos bajo una nueva base común $c$, permitiendo calcular logaritmos en calculadoras y simplificar cadenas multiplicativas](/static/img/nodos/uso-de-la-formula-de-cambio-de-base-en-expresiones-logaritmicas-ejemplos.svg)



    Calcula el valor exacto de las siguientes expresiones aplicando cambio de base:

    1) $\log_4(32)$ usando base 2

    2) $\log_{27}(9)$ usando base 3

    3) El producto encadenado: $P = \log_2(5) \cdot \log_5(7) \cdot \log_7(16)$'
  pasos:
  - 'Paso 1: Para $\log_4(32)$:

    - Cambiar a base 2: $\frac{\log_2(32)}{\log_2(4)} = \frac{5}{2} = \mathbf{2{,}5}$.'
  - 'Paso 2: Para $\log_{27}(9)$:

    - Cambiar a base 3: $\frac{\log_3(9)}{\log_3(27)} = \mathbf{\frac{2}{3}}$.'
  - "Paso 3: Para el producto encadenado $P$:\n- Pasar todos a base 10:\n  $$P = \\frac{\\log(5)}{\\log(2)} \\cdot \\frac{\\log(7)}{\\log(5)} \\cdot \\frac{\\log(16)}{\\log(7)}$$\n- Cancelar factores cruzados $\\log(5)$ y $\\log(7)$:\n  $$P = \\frac{\\log(16)}{\\log(2)} = \\log_2(16) = \\mathbf{4}$."
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión correcta para calcular $\log_3(20)$ usando logaritmos decimales?
  choices:
  - text: log(20) / log(3)
    is_correct: true
  - text: log(3) / log(20)
    is_correct: false
  - text: log(20) - log(3)
    is_correct: false
  - text: log(20/3)
    is_correct: false
  explanation: La alternativa correcta es 'log(20) / log(3)'. El argumento 20 va al numerador y la base 3 va al denominador.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto vale el producto $\log_3(8) \cdot \log_8(9)$?
  choices:
  - text: 2 (porque se simplifica a log₃(9) = 2)
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '72'
    is_correct: false
  - text: '3'
    is_correct: false
  explanation: La alternativa correcta es '2 (porque se simplifica a log₃(9) = 2)'. $\frac{\log(8)}{\log(3)} \cdot \frac{\log(9)}{\log(8)} = \frac{\log(9)}{\log(3)} = \log_3(9) = 2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el argumento $a$ y la base original $b$.'
- 'Paso 2: Elegir una base conveniente $c$ (base 10, base natural $e$ o una base prima común).'
- 'Paso 3: Formular la fracción $\frac{\log_c(a)}{\log_c(b)}$.'
- 'Paso 4: Evaluar los logaritmos superior e inferior y simplificar la fracción resultante.'
errores_correccion: '- **Error común:** Invertir la fracción colocando la base arriba: $\frac{\log(b)}{\log(a)}$.

  - **Cómo corregirlo:** Recuerda: **El argumento $a$ está arriba $\implies \log(a)$ va en el numerador; la base $b$ está abajo $\implies \log(b)$ va en el denominador**.'
ejemplos:
- titulo: 'Ejemplo 1: Base prima común'
  enunciado: 'Calcula $\log_9(27)$:'
  alternativas:
  - 3/2
  - 2/3
  - '3'
  - '18'
  respuesta: 3/2
  solucion_pasos:
  - 'Paso 1: $\frac{\log_3(27)}{\log_3(9)} = \frac{3}{2}$.'
- titulo: 'Ejemplo 2: Producto de dos logaritmos'
  enunciado: 'Calcula $\log_5(2) \cdot \log_2(25)$:'
  alternativas:
  - '2'
  - '5'
  - '10'
  - 1/2
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: $\log_5(2) \cdot \frac{\log_5(25)}{\log_5(2)} = \log_5(25) = 2$.'
- titulo: 'Ejemplo 3: Inversión de base y argumento'
  enunciado: Si $\log_2(x) = 5$, ¿cuánto vale $\log_x(2)$?
  alternativas:
  - 1/5
  - '-5'
  - '5'
  - '25'
  respuesta: 1/5
  solucion_pasos:
  - 'Paso 1: $\log_x(2) = \frac{1}{\log_2(x)} = \frac{1}{5}$.'
- titulo: 'Ejemplo 4: Cambio a base natural'
  enunciado: 'La expresión $\log_7(x)$ es equivalente a:'
  alternativas:
  - ln(x) / ln(7)
  - ln(7) / ln(x)
  - ln(x - 7)
  - 7 · ln(x)
  respuesta: ln(x) / ln(7)
  solucion_pasos:
  - 'Paso 1: $\log_7(x) = \frac{\ln(x)}{\ln(7)}$.'
errores_frecuentes:
- Poner la base en el numerador y el argumento en el denominador.
- Restar los logaritmos en lugar de dividirlos.
- Olvidar que las bases en el numerador y denominador deben ser idénticas.
afirmaciones_verdaderas:
- La fórmula log_b(a) = log_c(a) / log_c(b) es válida para cualquier base c > 0 con c ≠ 1.
- El producto log_b(a) · log_a(b) es idénticamente igual a 1.
al_terminar_debes_poder: '**QUÉ:** Utilizar la fórmula de cambio de base para calcular y transformar logaritmos.


  **CÓMO:** Aplicando log_b(a) = log_c(a) / log_c(b) para unificar bases y simplificar factores cruzados.


  ![Resumen La fórmula de cambio de base $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ transforma un logaritmo en base $b$ en el cociente de dos logaritmos bajo una nueva base común $c$, permitiendo calcular logaritmos en calculadoras y simplificar cadenas multiplicativas](/static/img/nodos/uso-de-la-formula-de-cambio-de-base-en-expresiones-logaritmicas-resumen.svg)'
