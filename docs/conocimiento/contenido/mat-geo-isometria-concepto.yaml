procedimiento:
- 'Paso 1: Identifica la figura original (preimagen) y la figura resultante (imagen)
  tras la transformación.'
- 'Paso 2: Compara las distancias entre puntos correspondientes de ambas figuras.'
- 'Paso 3: Si las distancias (y por lo tanto los ángulos) se mantienen iguales, la
  transformación es una isometría.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de isometría como transformación que conserva
  medidas.
