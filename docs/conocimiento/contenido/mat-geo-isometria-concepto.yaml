semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.ISOMETRIA_CONCEPTO
resumen_inicial: 'Concepto de isometría como transformación que conserva medidas:
  conceptos, teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Una isometría es como ''mover'' una figura sin deformarla: cambia
  de posición, pero conserva exactamente su tamaño y forma.'
explicacion_formal: '![Concepto de isometría](/static/img/geometria/isometrias/isometria-concepto.svg)


  ### Definición formal


  Una isometría es una transformación del plano que preserva las distancias: si $A$
  y $B$ son dos puntos cualesquiera y $A''$, $B''$ son sus respectivas imágenes, entonces
  $d(A,B)=d(A'',B'')$. Las tres isometrías básicas son la traslación, la simetría
  (reflexión) y la rotación.


  ### Desarrollo didáctico


  En la figura, el triángulo original y su imagen (tras la transformación) tienen
  exactamente el mismo tamaño y forma, solo cambia su posición en el plano. Esto confirma
  que se trata de una isometría.'
definiciones_clave: '- **Concepto de isometría como transformación que conserva medidas**:
  Elemento o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de isometría como transformación
  que conserva medidas.'
