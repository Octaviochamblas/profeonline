resumen_inicial: La traducción de la frase como máximo permite representar estructuras
  matemáticas de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con traducción de la frase como máximo, transformamos
  frases sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Traducción
  de la frase como máximo** viene dada por:


  $$\text{"la frase ''el peso w es como máximo 80''"} \implies w <= 80$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Traducción de la frase como máximo**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: w <= 80 define la estructura
  requerida.'
ejemplo_guiado:
  enunciado: 'Traduzca o exprese según traducción de la frase como máximo: ''la frase
    ''el peso w es como máximo 80''''.'
  pasos:
  - 'Paso 1: Identificar las variables o parámetros del enunciado.'
  - 'Paso 2: Aplicar la regla de traducción correspondiente a traducción de la frase
    como máximo.'
  - 'Conclusión: La expresión resultante es w <= 80.'
