semantic_id: MAT.ALG.LENGUAJE_RELACIONES.COMO_MAXIMO
resumen_inicial: 'Traducción de la frase como máximo: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: 'Si tu madre te dice: ''Puedes gastar como máximo 20 dólares'',
  ¿puedes gastar exactamente 20? Sí. ¿Puedes gastar 19? Sí. ¿Puedes gastar 21? No.
  Este es un límite cerrado superior.'
explicacion_formal: '### Definición formal


  Si te digo ''como máximo 10'', puedes tener 9, 8. es decir, cantidades *menores*
  o iguales a 10. Por eso se usa $\le$.


  ### Desarrollo didáctico


  Palabras clave que se traducen como $\le$:

  - Como máximo

  - A lo más

  - No más de

  - Hasta

  - Tiene un tope de


  Ejemplos:

  - ''El peso soportado ($P$) es como máximo 500 kg'': $P \le 500$

  - ''Gastaré a lo más el doble de mi sueldo ($S$)'': $Gastos \le 2S$


  La diferencia crucial con el ''menor que'' estricto ($<$) es la pequeña línea horizontal
  debajo del símbolo, que significa ''o igual''.'
definiciones_clave: '- **Traducción de la frase como máximo**: Herramienta clave para
  pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
