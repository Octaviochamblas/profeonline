errores_frecuentes:
- Traducir 'como máximo' usando el símbolo de mayor ($>$ o $\ge$) confundidos por
  la palabra 'máximo'. (Si el tope es el máximo, la variable tiene que ser *menor*
  que el tope).
- Usar el símbolo estricto de menor ($<$) perdiendo la posibilidad de igualdad.
- Porque el símbolo $\ge$ solo se usa para ecuaciones de segundo grado.
- Porque 'como máximo' solo permite valores estrictamente menores ($<$), sin incluir
  el límite.
- Porque 'como máximo' significa que la variable debe multiplicarse por el valor máximo
  posible.
afirmaciones_verdaderas:
- La traducción de traducción de la frase como máximo preserva el significado matemático
  del enunciado.
