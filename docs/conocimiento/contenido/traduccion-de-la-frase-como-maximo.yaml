semantic_id: MAT.ALG.LENGUAJE_RELACIONES.COMO_MAXIMO
resumen_inicial: 'La traducción de la frase como máximo consiste en representar simbólicamente la desigualdad no estricta de límite superior $A \le B$ mediante el operador menor o igual que.'
explicacion_simple: |
  En el lenguaje cotidiano y matemático, la frase **"como máximo"** (o **"a lo más"**, **"no más de"**) establece una **cota o límite superior**:
  - Significa que la cantidad **PUEDE SER IGUAL O MENOR** a esa cifra, pero NUNCA mayor.
  - Traducción: **$\le$** (menor o igual que).
  - Ejemplos:
    - *"El peso de la maleta debe ser como máximo $23$ kg"* $\implies **p \le 23**$ (puede pesar 23, 20, 15, pero no 24).
    - *"La capacidad del ascensor es como máximo 6 personas"* $\implies **N \le 6**$.
    - *"El triple de $x$ es a lo más 100"* $\implies **3x \le 100**$.
  - **¡Cuidado con el error común!** La palabra "máximo" suele confundir haciendo pensar en un signo $>$. Al decir "como máximo $B$", estás fijando a $B$ como el TECHO MÁXIMO de la cantidad $\implies \mathbf{A \le B}$.
explicacion_formal: |
  ### Definición formal
  La relación no estricta **límite superior cota cerrada** mapea una cantidad variable $A \in \mathbb{R}$ y una cota constante $B \in \mathbb{R}$ mediante el operador de desigualdad no estricta $\le$:

  $$\Phi(\text{"}A \text{ es como máximo } B\text{"}) = A \le B \iff A - B \le 0 \iff (A < B \lor A = B)$$

  ### Equivalencias Verbales de la Cota Superior ($\le$)

  $$\begin{array}{|c|c|}
  \hline
  \text{\textbf{Frase verbal (Lenguaje Natural)}} & \text{\textbf{Traducción algebraica}} \\
  \hline
  A \text{ es como máximo } B & A \le B \\
  A \text{ es a lo más } B & A \le B \\
  A \text{ no supera a } B & A \le B \\
  A \text{ no excede a } B & A \le B \\
  \hline
  \end{array}$$

  ### Intervalo Solución Semicerrado $]-\infty, B]$
  El conjunto de valores reales que satisfacen la condición "como máximo $B$" forma el intervalo semicerrado que incluye al límite $B$:

  $$\operatorname{Sol} = ]-\infty, B] = \{x \in \mathbb{R} \mid x \le B\}$$

  ### Síntesis didáctica
  La locución "como máximo" rige los techos presupuestarios, normas de seguridad y restricciones de capacidad en problemas de optimización.
definiciones_clave: |
  - **Como máximo ($\le$)**: Operador de desigualdad no estricta que exige que la cantidad sea menor o igual al límite especificado.
  - **Límite superior cota ($B$)**: Valor máximo permitido que está incluido dentro del conjunto solución.
  - **Intervalo semicerrado por la derecha $]-\infty, B]$**: Representación de conjunto para valores no superiores a $B$.
propiedades_relaciones: |
  - **Negación lógica**: La negación de "$A$ es como máximo $B$" es "$A$ es mayor que $B$" ($\neg(A \le B) \iff A > B$).
  - **Inclusión del límite**: La presencia de la barra de igualdad bajo el signo $\le$ indica que el valor tope $B$ satisface la condición.
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El cuádruple del costo de un producto ($c$) aumentado en cinco mil pesos debe ser como máximo de cincuenta mil pesos".'
  pasos:
    - 'Paso 1: Traducimos el miembro izquierdo: "El cuádruple del costo $c$ aumentado en cinco mil" $\implies 4c + 5000$.'
    - 'Paso 2: Traducimos la locución "debe ser como máximo": Significa menor o igual que $\implies \le$.'
    - 'Paso 3: Identificamos el techo máximo: "cincuenta mil" $\implies 50000$.'
    - 'Paso 4: Unimos la inecuación: $4c + 5000 \le 50000$.'
    - 'Conclusión: La inecuación traducida es **$4c + 5000 \le 50000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operador matemático traduce adecuadamente la frase "como máximo" o "a lo más"?'
    choices:
      - {text: 'El operador de desigualdad menor o igual que ($\le$)', is_correct: true}
      - {text: 'El operador de desigualdad estricta mayor que ($>$)', is_correct: false}
      - {text: 'El operador de adición ($+$)', is_correct: false}
      - {text: 'El operador de multiplicación ($\cdot$)', is_correct: false}
    explanation: 'La alternativa correcta es ''El operador de desigualdad menor o igual que ($\le$)''. Como máximo indica un techo superior $\le$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la capacidad de carga $C$ de un vehículo es como máximo 1000 kg, ¿cuáles de los siguientes valores de $C$ son permitidos?'
    choices:
      - {text: 'Cualquier valor real menor o igual a 1000 kg ($C \le 1000$)', is_correct: true}
      - {text: 'Únicamente valores estrictamente mayores a 1000 kg ($C > 1000$)', is_correct: false}
      - {text: 'Únicamente el valor exacto $C = 2000$ kg', is_correct: false}
      - {text: 'Valores infinitos positivos sin límite', is_correct: false}
    explanation: 'La alternativa correcta es ''Cualquier valor real menor o igual a 1000 kg ($C \le 1000$)''. Cota superior $C \le 1000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la expresión que se ubica antes de la frase "como máximo" o "a lo más".'
  - 'Paso 2: Escribir el símbolo de desigualdad no estricta $\le$.'
  - 'Paso 3: Escribir la cantidad o límite máximo ubicado tras la frase.'
  - 'Paso 4: Comprobar que el valor límite tope forma parte de las soluciones válidas.'
errores_correccion: |
  - **Error 1:** Traducir "como máximo" con el símbolo mayor que ($>$) por llevar la palabra "máximo". **Cómo corregirlo:** "Como máximo" significa que la cantidad es **MENOR O IGUAL al techo ($\le$)**; no mayor.
  - **Error 2:** Usar la desigualdad estricta $<$ excluyendo el techo tope. **Cómo corregirlo:** La frase "como máximo $B$" **INCLUYE al número $B$ ($\le$)**.
ejemplos:
  - titulo: 'Como máximo básico'
    enunciado: '¿Cuál es la traducción de "Un número $x$ es como máximo 40"?'
    alternativas:
      - '$x \le 40$'
      - '$x > 40$'
      - '$x \ge 40$'
    respuesta: '$x \le 40$'
    solucion_pasos:
      - '1. Variable: $x$.'
      - '2. Como máximo: $\le$.'
      - '3. Resultado: $x \le 40$.'
  - titulo: 'A lo más'
    enunciado: 'La frase "El triple de $y$ es a lo más 15", ¿se traduce como $3y \le 15$?'
    alternativas:
      - 'Sí, "a lo más" es sinónimo de como máximo ($\le$)'
      - 'No, equivale a $3y \ge 15$'
      - 'No, equivale a $3y > 15$'
    respuesta: 'Sí, "a lo más" es sinónimo de como máximo ($\le$)'
    solucion_pasos:
      - '1. Triple de $y \to 3y$.'
      - '2. A lo más $\to \le 15$.'
      - '3. Inecuación: $3y \le 15$.'
  - titulo: 'Inclusión del techo'
    enunciado: 'Si $x \le 50$, ¿es el valor $x = 50$ una solución permitida?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el signo $\le$ incluye la igualdad en el límite 50.'
  - titulo: 'No supera a'
    enunciado: '¿Es la locución "la cantidad $A$ no supera a $B$" traducida como $A \le B$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, no superar a $B$ significa ser menor o igual a $B$.'
errores_frecuentes:
  - 'Escribir el símbolo mayor que > al traducir la frase como máximo debido a la palabra máximo.'
  - 'La barra de igualdad no es incluida escribiendo una desigualdad estricta < al traducir la cota tope como máximo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Reemplazar la inecuación no estricta por una suma directa con el techo.'
  - 'Declarar que la cota máxima B no forma parte del intervalo solución.'
afirmaciones_verdaderas:
  - 'La locución como máximo o a lo más se traduce al lenguaje algebraico mediante el operador menor o igual que \le.'
  - 'El conjunto solución de una inecuación con como máximo B incluye al número B como límite superior del intervalo.'
al_terminar_debes_poder: 'Traducir la frase como máximo o a lo más al lenguaje algebraico mediante el operador no estricto \le.'
