errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir traducción
  de la frase como máximo.
- Invertir el orden de las variables al construir la expresión de traducción de la
  frase como máximo.
- Usar una suma cuando el enunciado de traducción de la frase como máximo exige una
  resta o división.
- Omitir paréntesis al multiplicar expresiones en traducción de la frase como máximo.
- Declarar que la expresión de traducción de la frase como máximo es válida sólo para
  números pares.
afirmaciones_verdaderas:
- La traducción simbólica de traducción de la frase como máximo preserva la relación
  de orden o sucesión entre cantidades.
- La notación algebraica permite expresar relaciones numéricas complejas de forma
  compacta.
al_terminar_debes_poder: Al terminar serás capaz de traducir expresiones de traducción
