semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.AREA_TRAPECIO
resumen_inicial: 'Cálculo del área de un trapecio: conceptos, teoremas, propiedades
  geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Aprovechando la propiedad de la mediana (semisuma de las bases),
  se puede derivar directamente la fórmula del área de cualquier trapecio.
explicacion_formal: '![Área de un trapecio: (B+b)×h/2](/static/img/geometria/poligonos-cuadrilateros/trapecios-area.svg)


  ### Definición formal


  Si $B$ es la base mayor, $b$ es la base menor, y $h$ es la altura (distancia perpendicular
  entre las bases), el área del trapecio es $A=\frac{(B+b)\times h}{2}$. Equivalentemente,
  $A=\text{mediana}\times h$.


  ### Desarrollo didáctico


  Un trapecio con bases 16 cm y 10 cm, y altura 7 cm, tiene área $A=\frac{(16+10)\times7}{2}=\frac{26\times7}{2}=\frac{182}{2}=91$
  cm². Esta fórmula se puede visualizar duplicando el trapecio y rotándolo 180° para
  formar un paralelogramo con base $(B+b)$ y la misma altura $h$.'
