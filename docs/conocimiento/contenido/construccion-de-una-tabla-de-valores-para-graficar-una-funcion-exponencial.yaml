semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TABLA_VALORES
resumen_inicial: La construcción de una tabla de valores permite tabular pares ordenados $(x, f(x))$ evaluando exponentes negativos, nulos y positivos para trazar la curva.
explicacion_simple: |
  Para dibujar la curva de una **función exponencial $f(x) = b^x$**, construimos una **tabla de valores** eligiendo números sencillos para $x$:

  - **Para $x = -2$**: $f(-2) = b^{-2} = \frac{1}{b^2}$.
  - **Para $x = -1$**: $f(-1) = b^{-1} = \frac{1}{b}$.
  - **Para $x = 0$**: $f(0) = b^0 = 1$ (corte con eje Y).
  - **Para $x = 1$**: $f(1) = b^1 = b$.
  - **Para $x = 2$**: $f(2) = b^2$.

  Al ubicar estos pares en el plano cartesiano y unirlos con una curva suave, observamos cómo la función crece muy rápido por un lado y se pega al eje X por el otro.
explicacion_formal: |
  Sea la función exponencial $f(x) = a \cdot b^x$ definida sobre $\mathbb{R}$ con $b > 0, b \neq 1$. El procedimiento de **tabulación cartesiana** genera un subconjunto finito de puntos pertenecientes al gráfico de la función:

  $$\text{Graf}(f) = \{(x, f(x)) \in \mathbb{R}^2 \mid x \in D \subset \mathbb{R}\}$$

  **Evaluación sistemática de puntos cardinales:**
  1. **Región de asíntota ($x < 0$):** Involucra el uso de exponentes negativos $b^{-n} = \frac{1}{b^n}$, generando ordenadas $0 < y < 1$ para la base canónica.
  2. **Origen de ordenadas ($x = 0$):** Evalúa la propiedad fundamental $f(0) = a \cdot 1 = a$.
  3. **Región de aceleración ($x > 0$):** Potenciación entera $b^n$, produciendo un crecimiento geométrico multiplicativo paso a paso.
definiciones_clave: |
  - **Tabla de valores exponencial**: Matriz de datos de dos columnas $(x, y)$ donde cada ordenada $y$ se obtiene calculando la potencia $a \cdot b^x$.
propiedades_relaciones: |
  - **Factor de cambio constante**: En la tabla de valores, si la variable $x$ avanza en pasos de $1$ en $1$, los valores sucesivos de $y$ forman una progresión geométrica de razón $b$.
ejemplo_guiado:
  enunciado: 'Construye la tabla de valores para la función $f(x) = 2^x$ usando los abscisas $x \in \{-2, -1, 0, 1, 2, 3\}$.'
  pasos:
    - 'Paso 1: Evaluar $x = -2 \implies f(-2) = 2^{-2} = \frac{1}{4} = 0.25$. Par: $(-2, 0.25)$.'
    - 'Paso 2: Evaluar $x = -1 \implies f(-1) = 2^{-1} = \frac{1}{2} = 0.5$. Par: $(-1, 0.5)$.'
    - 'Paso 3: Evaluar $x = 0 \implies f(0) = 2^0 = 1$. Par: $(0, 1)$.'
    - 'Paso 4: Evaluar $x = 1, 2, 3 \implies f(1) = 2$, $f(2) = 4$, $f(3) = 8$. Pares: $(1, 2)$, $(2, 4)$, $(3, 8)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la tabla de valores de la función $f(x) = 3^x$, ¿cuál es el par ordenado correspondiente al valor de entrada $x = -1$?'
    choices:
      - {text: 'El par ordenado $(-1, 1/3)$', is_correct: true}
      - {text: 'El par ordenado $(-1, -3)$.', is_correct: false}
      - {text: 'El par ordenado $(-1, -1/3)$.', is_correct: false}
      - {text: 'El par ordenado $(-1, 3)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El par ordenado $(-1, 1/3)$''. $f(-1) = 3^{-1} = 1/3$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si en una tabla de valores con pasos $\Delta x = 1$ las ordenadas consecutivas son $y_1 = 5$, $y_2 = 20$ y $y_3 = 80$, ¿cuál es la base $b$ del modelo $f(x) = a \cdot b^x$?'
    choices:
      - {text: 'La base es $b = 4$', is_correct: true}
      - {text: 'La base es $b = 15$.', is_correct: false}
      - {text: 'La base es $b = 5$.', is_correct: false}
      - {text: 'La base es $b = 2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La base es $b = 4$''. Se obtiene dividiendo $y_2 / y_1 = 20 / 5 = 4$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Seleccionar un conjunto simétrico de valores de entrada $x$ (ej. $-2, -1, 0, 1, 2$).'
  - 'Paso 2: Calcular las potencias $b^x$ aplicando exponente negativo ($1/b^n$), cero ($1$) y positivo.'
  - 'Paso 3: Multiplicar el resultado por el coeficiente de escala $a$ para obtener $y$.'
  - 'Paso 4: Registrar los pares cartesiano $(x, y)$ en la tabla e identificarlos en el plano.'
errores_correccion: |
  - **Error común:** Escribir valores negativos en las ordenadas $y$ cuando $x$ es negativo (ej. decir que $2^{-2} = -4$).
  - **Cómo corregirlo:** El exponente negativo **INVIERTE LA BASE**, no cambia el signo del resultado: $2^{-2} = \frac{1}{2^2} = \frac{1}{4} > 0$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Tabulación en base 4.
    alternativas:
      - 'f(-1) = 1/4, f(0) = 1, f(1) = 4, f(2) = 16'
      - 'f(-1) = -4, f(0) = 0, f(1) = 4, f(2) = 8'
      - 'f(-1) = 4, f(0) = 1, f(1) = 0, f(2) = -16'
    respuesta: 'f(-1) = 1/4, f(0) = 1, f(1) = 4, f(2) = 16'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Tabulación en base fraccionaria 1/2.
    alternativas:
      - 'f(-2) = 4, f(-1) = 2, f(0) = 1, f(1) = 0.5'
      - 'f(-2) = -1/4, f(-1) = -1/2, f(0) = 1'
      - 'f(-2) = 0, f(-1) = 1, f(0) = 2'
    respuesta: 'f(-2) = 4, f(-1) = 2, f(0) = 1, f(1) = 0.5'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la evaluación en $x = -3$ de $f(x) = 2^x$, la afirmación de que la coordenada $y$ resultante es $-8$.'
  - 'La confusión entre el incremento aditivo constante de las funciones lineales y la razón multiplicativa de la tabla exponencial.'
  - 'La afirmación de que la evaluación en $x = 0$ genera una vacante o punto indeterminado en la tabla.'
  - 'La omisión del cambio de base al trabajar con exponentes fraccionarios en la tabla.'
  - 'La consideración de que evaluar exponentes negativos produce valores fuera del dominio real.'
afirmaciones_verdaderas:
  - 'En la tabla de valores de una función exponencial con pasos unitarios en $x$, el cociente entre ordenadas consecutivas $y_{n+1}/y_n$ es igual a la base $b$.'
  - 'Los exponentes negativos en la tabla de valores producen ordenadas fraccionarias positivas $y = 1/b^n > 0$.'
al_terminar_debes_poder: |
  QUÉ: Construir e interpretar tablas de valores para funciones exponenciales $f(x) = a \cdot b^x$.
  CÓMO: Evaluar exponentes negativos, nulos y positivos, calcular pares ordenados $(x, y)$ y verificar la razón constante $b$.
