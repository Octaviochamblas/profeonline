semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TABLA_VALORES
resumen_inicial: La construcción de una tabla de valores para graficar una función exponencial evalúa valores enteros estratégicos alrededor de cero (como $x \in \{-2, -1, 0, 1, 2\}$), revelando tanto la aproximación asintótica fraccionaria como el crecimiento acelerado de la curva.
explicacion_simple: "![La construcción de una tabla de valores para graficar una función exponencial evalúa valores enteros estratégicos alrededor de cero (como $x \\in \\{-2, -1, 0, 1, 2\\}$), revelando tanto la aproximación asintótica fraccionaria como el crecimiento acelerado de la curva](/static/img/nodos/construccion-de-una-tabla-de-valores-para-graficar-una-funcion-exponencial-intro.svg)\n\n\nPara dibujar una función exponencial (ej: $f(x) = 2^x$) con total precisión en el plano cartesiano, lo mejor es crear una **tabla con 5 puntos clave**:\n\n- **1. Evalúa los negativos ($x = -2, -1$):**\n  - $f(-2) = 2^{-2} = \\frac{1}{2^2} = \\frac{1}{4} = 0,25$.\n  - $f(-1) = 2^{-1} = \\frac{1}{2} = 0,5$.\n  - Te muestran cómo la curva se pega al piso ($y = 0$).\n- **2. Evalúa el origen ($x = 0$):**\n  - $f(0) = 2^0 = 1 \\implies$ marca el punto clave **$(0, 1)$**.\n- **3. Evalúa los positivos ($x = 1, 2$):**\n  - $f(1) = 2^1 = 2$.\n  - $f(2) = 2^2 = 4$.\n  - Te muestran cómo la curva sube como\
  \ un cohete hacia arriba."
explicacion_formal: 'Dada $f: \mathbb{R} \to \mathbb{R}^+$ con $f(x) = b^x$, la discretización sobre el retículo $\mathbb{Z} \cap [-n, n]$ genera el conjunto finito de pares ordenados:

  $$\mathcal{T}_n = \left\{ \left(k, b^k\right) \in \mathbb{Z} \times \mathbb{R}^+ \; \middle| \; k \in \{-n, \dots, 0, \dots, n\} \right\}$$


  **Propiedad de progresión geométrica bidireccional**:

  1. **Para $k \ge 0$**: $y_k = b^k$ crece a razón $y_{k+1} = b \cdot y_k$.

  2. **Para $k < 0$**: $y_{-k} = \frac{1}{b^k}$ converge al límite asintótico $\lim_{k \to \infty} y_{-k} = 0$.

  La unión suave de estos nodos mediante una curva $\mathcal{C}^\infty$ define el gráfico canónico de la función exponencial.'
definiciones_clave: '- **Tabla de tabulación**: Registro ordenado de pares $(x, f(x))$ para la representación gráfica.

  - **Inversión de base por signo**: Regla $b^{-k} = \frac{1}{b^k}$ que transforma potencias negativas en fracciones positivas.'
propiedades_relaciones: '- **Monotonía de pares ordenados**: Si $b > 1$, las ordenadas son estrictamente crecientes: $y_{-2} < y_{-1} < y_0 < y_1 < y_2$.

  - **Curva suave no poligonal**: Los puntos deben unirse mediante una curva convexa continua, no mediante segmentos rectos quebrados.'
ejemplo_guiado:
  enunciado: '![Ejemplo La construcción de una tabla de valores para graficar una función exponencial evalúa valores enteros estratégicos alrededor de cero (como $x \in \{-2, -1, 0, 1, 2\}$), revelando tanto la aproximación asintótica fraccionaria como el crecimiento acelerado de la curva](/static/img/nodos/construccion-de-una-tabla-de-valores-para-graficar-una-funcion-exponencial-ejemplos.svg)



    Construye la tabla de valores para la función $f(x) = 3^x$ evaluando en $x \in \{-2, -1, 0, 1, 2\}$ y enuncia las coordenadas resultantes.'
  pasos:
  - 'Paso 1: Evaluar $x = -2$: $f(-2) = 3^{-2} = \frac{1}{3^2} = \frac{1}{9} \approx 0{,}11 \implies \left(-2, \frac{1}{9}\right)$.'
  - 'Paso 2: Evaluar $x = -1$: $f(-1) = 3^{-1} = \frac{1}{3} \approx 0{,}33 \implies \left(-1, \frac{1}{3}\right)$.'
  - 'Paso 3: Evaluar $x = 0$: $f(0) = 3^0 = 1 \implies (0, 1)$.'
  - 'Paso 4: Evaluar $x = 1$: $f(1) = 3^1 = 3 \implies (1, 3)$.'
  - 'Paso 5: Evaluar $x = 2$: $f(2) = 3^2 = 9 \implies (2, 9)$.'
  - 'Paso 6: Conclusión: Los 5 puntos clave son $\{(-2, 1/9), (-1, 1/3), (0, 1), (1, 3), (2, 9)\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de f(-2) para la función exponencial f(x) = 4ˣ?
  choices:
  - text: 1/16 (o 0,0625)
    is_correct: true
  - text: '-8'
    is_correct: false
  - text: '-16'
    is_correct: false
  - text: 1/8
    is_correct: false
  explanation: La alternativa correcta es '1/16 (o 0,0625)'. $4^{-2} = \frac{1}{4^2} = \frac{1}{16}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la tabla de f(x) = (1/2)ˣ, ¿qué punto se obtiene al evaluar en x = -3?
  choices:
  - text: (-3, 8)
    is_correct: true
  - text: (-3, -8)
    is_correct: false
  - text: (-3, 1/8)
    is_correct: false
  - text: (-3, -1/8)
    is_correct: false
  explanation: La alternativa correcta es '(-3, 8)'. $(1/2)^{-3} = 2^3 = 8 \implies (-3, 8)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar valores enteros simétricos para $x$ ($-2, -1, 0, 1, 2$).'
- 'Paso 2: Aplicar la ley de exponente negativo $b^{-n} = 1/b^n$ para valores menores que cero.'
- 'Paso 3: Evaluar $f(0) = 1$ para fijar el intercepto con el eje $Y$.'
- 'Paso 4: Calcular las potencias directas para $x > 0$ y tabular los pares cartesianos $(x, y)$.'
errores_correccion: '- **Error común:** Escribir que $3^{-2} = -9$ o $-6$.

  - **Cómo corregirlo:** Un exponente negativo **invierte la base como fracción positiva**: $3^{-2} = \frac{1}{3^2} = \frac{1}{9} > 0$.'
ejemplos:
- titulo: 'Ejemplo 1: Tabulación para base 2'
  enunciado: ¿Qué par ordenado corresponde a x = -1 en f(x) = 2ˣ?
  alternativas:
  - (-1, 0,5)
  - (-1, -2)
  - (-1, -0,5)
  - (-1, 2)
  respuesta: (-1, 0,5)
  solucion_pasos:
  - 'Paso 1: $f(-1) = 2^{-1} = 1/2 = 0{,}5 \implies (-1, 0{,}5)$.'
- titulo: 'Ejemplo 2: Tabulación de función con escala'
  enunciado: En $g(x) = 5 \cdot 2^x$, ¿cuál es el valor para $x = 2$?
  alternativas:
  - '20'
  - '100'
  - '10'
  - '25'
  respuesta: '20'
  solucion_pasos:
  - 'Paso 1: $g(2) = 5 \cdot 2^2 = 5 \cdot 4 = 20$.'
- titulo: 'Ejemplo 3: Tabulación con base fraccionaria'
  enunciado: En $h(x) = (1/5)^x$, ¿cuánto vale $h(-2)$?
  alternativas:
  - '25'
  - 1/25
  - '-25'
  - '-10'
  respuesta: '25'
  solucion_pasos:
  - 'Paso 1: $(1/5)^{-2} = 5^2 = 25$.'
- titulo: 'Ejemplo 4: Punto medio en origen'
  enunciado: Para cualquier función exponencial básica $f(x) = b^x$, ¿qué punto está siempre en la tabla?
  alternativas:
  - (0, 1)
  - (0, 0)
  - (1, 0)
  - (1, 1)
  respuesta: (0, 1)
  solucion_pasos:
  - 'Paso 1: $f(0) = b^0 = 1 \implies (0, 1)$.'
errores_frecuentes:
- Cambiar el signo del resultado al evaluar exponentes negativos en vez de invertir la fracción.
- Multiplicar la base por el exponente en lugar de potenciar.
- Unir los puntos tabulados con líneas poligonales rectas.
afirmaciones_verdaderas:
- La tabla de valores de f(x) = bˣ contiene pares con ordenadas estrictamente positivas para todo x real.
- Los exponentes negativos generan fracciones que muestran la aproximación a la asíntota y = 0.
al_terminar_debes_poder: '**QUÉ:** Construir y tabular valores para graficar con precisión una función exponencial.


  **CÓMO:** Evaluando enteros simétricos x ∈ {-2, -1, 0, 1, 2} y aplicando propiedades de potencias fraccionarias e inversas.


