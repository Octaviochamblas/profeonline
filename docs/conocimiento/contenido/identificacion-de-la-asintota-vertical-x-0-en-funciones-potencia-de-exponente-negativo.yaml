semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.ASINTOTA_VERTICAL
resumen_inicial: La identificación de la asíntota vertical $x = 0$ en funciones potencia con exponente negativo $f(x) = \frac{a}{x^k}$ demuestra que $\lim_{x \to 0} |f(x)| = +\infty$, estableciendo que la recta vertical del eje de ordenadas actúa como una frontera asintótica infranqueable.
explicacion_simple: "![La identificación de la asíntota vertical $x = 0$ en funciones potencia con exponente negativo $f(x) = \\frac{a}{x^k}$ demuestra que $\\lim_{x \\to 0} |f(x)| = +\\infty$, estableciendo que la recta vertical del eje de ordenadas actúa como una frontera asintótica infranqueable](/static/img/nodos/identificacion-de-la-asintota-vertical-x-0-en-funciones-potencia-de-exponente-negativo-intro.svg)\n\n\n¿Qué pasa cuando te acercas muchísimo a $x = 0$ en una función como $f(x) = \\frac{1}{x^2}$?\n\n- **Cálculo con números muy chiquititos:**\n  - Si $x = 0{,}1 \\implies 1 / (0{,}1)^2 = 1 / 0{,}01 = \\mathbf{100}$.\n  - Si $x = 0{,}01 \\implies 1 / (0{,}01)^2 = 1 / 0{,}0001 = \\mathbf{10.000}$.\n  - Si $x = 0{,}0001 \\implies 1 / (0{,}0001)^2 = \\mathbf{100.000.000}$ (¡cien millones!).\n- **La Asíntota Vertical:**\n  - A medida que $x$ se acerca a cero, la curva **se dispara violentamente al infinito** pegada a la recta vertical **$x = 0$ (el eje $Y$)**.\n  - La curva se acerca\
  \ infinitamente a la recta vertical pero **NUNCA la toca ni la cruza**."
explicacion_formal: 'Sea $f(x) = \frac{a}{x^k}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Por la definición topológica de asíntota vertical, una recta $\mathcal{A}_V: x = x_0$ es asíntota vertical si al menos uno de los límites laterales satisface $\lim_{x \to x_0^\pm} f(x) = \pm\infty$.


  Evaluando en $x_0 = 0$:

  $$\lim_{x \to 0^+} \frac{a}{x^k} = \operatorname{sgn}(a) \cdot (+\infty)$$

  $$\lim_{x \to 0^-} \frac{a}{x^k} = \operatorname{sgn}(a) \cdot (-1)^k \cdot (+\infty)$$

  En ambos casos, la magnitud satisface $\lim_{x \to 0} |f(x)| = +\infty$, demostrando formalmente que la recta vertical:

  $$\mathcal{A}_V: x = 0$$

  es la asíntota vertical universal de la familia.'
definiciones_clave: '- **Asíntota vertical**: Recta vertical $x = c$ hacia la cual la función diverge sin cota al aproximarse la variable a $c$.

  - **Comportamiento asintótico local**: Crecimiento hiperbólico en una vecindad perforada de cero.'
propiedades_relaciones: '- **Ecuación del eje $Y$**: La recta $x = 0$ coincide exactamente con el eje de ordenadas.

  - **Infranqueabilidad**: Una asíntota vertical nunca puede ser cruzada por la función en el punto de discontinuidad.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de la asíntota vertical $x = 0$ en funciones potencia con exponente negativo $f(x) = \frac{a}{x^k}$ demuestra que $\lim_{x \to 0} |f(x)| = +\infty$, estableciendo que la recta vertical del eje de ordenadas actúa como una frontera asintótica infranqueable](/static/img/nodos/identificacion-de-la-asintota-vertical-x-0-en-funciones-potencia-de-exponente-negativo-ejemplos.svg)



    Analiza los límites laterales en $x = 0$ y determina la ecuación de la asíntota vertical para:

    1) $f(x) = \frac{3}{x^4}$

    2) $g(x) = \frac{2}{x^3}$'
  pasos:
  - 'Paso 1: Para $f(x) = \frac{3}{x^4}$ (par):

    - $\lim_{x \to 0^+} \frac{3}{x^4} = +\infty$ y $\lim_{x \to 0^-} \frac{3}{x^4} = +\infty$.

    - Ambos límites divergen a $+\infty \implies$ **Asíntota Vertical: $\mathcal{A}_V: x = 0$**.'
  - 'Paso 2: Para $g(x) = \frac{2}{x^3}$ (impar):

    - $\lim_{x \to 0^+} \frac{2}{x^3} = +\infty$ y $\lim_{x \to 0^-} \frac{2}{x^3} = -\infty$.

    - Divergen a signos opuestos $\implies$ **Asíntota Vertical: $\mathcal{A}_V: x = 0$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación de la asíntota vertical de cualquier función potencia con exponente negativo $f(x) = a x^{-k}$?
  choices:
  - text: x = 0 (la recta del eje Y)
    is_correct: true
  - text: y = 0 (la recta del eje X)
    is_correct: false
  - text: x = a
    is_correct: false
  - text: y = a
    is_correct: false
  explanation: La alternativa correcta es 'x = 0 (la recta del eje Y)'. Como el denominador se anula en $x = 0$, la asíntota vertical es la recta $x = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué le ocurre a la gráfica de $f(x) = 1/x^2$ cuando x se aproxima a cero desde la izquierda ($x \to 0^-$)?
  choices:
  - text: Sube hacia +∞
    is_correct: true
  - text: Baja hacia -∞
    is_correct: false
  - text: Se acerca a 0
    is_correct: false
  - text: Se mantiene en 1
    is_correct: false
  explanation: La alternativa correcta es 'Sube hacia +∞'. Como $(-x)^2 = x^2 > 0$, la fracción $1/x^2$ se hace infinitamente positiva.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor donde el denominador de la potencia se hace cero ($x = 0$).'
- 'Paso 2: Evaluar el límite cuando $x \to 0^+$ y cuando $x \to 0^-$.'
- 'Paso 3: Verificar que los límites diverjan a $+\infty$ o $-\infty$.'
- 'Paso 4: Escribir la ecuación de la recta asíntota vertical como $\mathcal{A}_V: x = 0$.'
errores_correccion: '- **Error común:** Escribir la ecuación de la asíntota vertical como $y = 0$ en lugar de $x = 0$.

  - **Cómo corregirlo:** Las rectas **verticales** siempre tienen ecuación **$x = \text{constante}$**, por lo que la asíntota vertical en el eje Y es **$x = 0$**.'
ejemplos:
- titulo: 'Ejemplo 1: Ecuación de asíntota vertical'
  enunciado: 'La asíntota vertical de $f(x) = -5x^{-3}$ es:'
  alternativas:
  - x = 0
  - y = 0
  - x = -5
  - y = -5
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: El polo en el origen define la recta vertical $x = 0$.'
- titulo: 'Ejemplo 2: Límite lateral negativo'
  enunciado: 'Calcula $\lim_{x \to 0^+} \left(-\frac{2}{x}\right)$:'
  alternativas:
  - -infinito
  - +infinito
  - '0'
  - '-2'
  respuesta: -infinito
  solucion_pasos:
  - 'Paso 1: $-2 / (+0) = -\infty$.'
- titulo: 'Ejemplo 3: Coincidencia con eje coordenado'
  enunciado: ¿Con qué eje del plano cartesiano coincide la recta asíntota vertical $x = 0$?
  alternativas:
  - Con el eje Y (eje de ordenadas)
  - Con el eje X (eje de abscisas)
  - Con la diagonal y = x
  - No coincide con ningún eje
  respuesta: Con el eje Y (eje de ordenadas)
  solucion_pasos:
  - 'Paso 1: La ecuación $x = 0$ define el eje Y.'
- titulo: 'Ejemplo 4: Intersección con asíntota vertical'
  enunciado: ¿Puede la gráfica de $f(x) = 1/x^4$ cruzar a su asíntota vertical $x = 0$?
  alternativas:
  - No, nunca, porque x = 0 no pertenece al dominio
  - Sí, en un punto muy alto
  - Sí, cuando y = 0
  - Depende del valor de a
  respuesta: No, nunca, porque x = 0 no pertenece al dominio
  solucion_pasos:
  - 'Paso 1: Al no pertenecer al dominio, no existe ningún punto de intersección.'
errores_frecuentes:
- Confundir la ecuación de la recta vertical (x = 0) con la horizontal (y = 0).
- Creer que la función toca la asíntota vertical en el infinito.
- Asumir que las potencias positivas también tienen asíntota vertical.
afirmaciones_verdaderas:
- Toda función potencia con exponente negativo posee una asíntota vertical en la recta x = 0.
- Al aproximarse a x = 0, la gráfica diverge hacia el infinito positivo o negativo según la paridad y el coeficiente.
al_terminar_debes_poder: '**QUÉ:** Identificar y formular la asíntota vertical x = 0 en funciones potencia con exponente negativo.


  **CÓMO:** Calculando los límites laterales lim x→0 |f(x)| = +∞ para establecer la ecuación de la recta x = 0.


