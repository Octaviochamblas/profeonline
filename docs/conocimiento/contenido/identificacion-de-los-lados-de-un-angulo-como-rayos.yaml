semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.ELEMENTO_LADOS
resumen_inicial: Los lados de un ángulo son dos rayos de extensión infinita que delimitan
  su abertura, lo que garantiza que la medida en grados no cambie al alargar o acortar
  su dibujo.
explicacion_simple: '![Identificación de los Lados de un Ángulo](/static/img/nodos/identificacion-de-los-lados-de-un-angulo-como-rayos-intro.svg)


  Piensa en dos rayos de luz que salen de una misma linterna. Cada rayo de luz que
  se aleja hacia el infinito representa uno de los dos lados del ángulo. Alargar o
  acortar el dibujo no cambia la abertura entre ellos.'
explicacion_formal: '### Definición formal

  En la estructura conjuntista de un ángulo $\angle AOB$, los **lados** son las semirrectas
  o rayos infinitos $\vec{OA}$ y $\vec{OB}$ originados en el vértice $O$:


  $$\operatorname{Lados}(\angle AOB) = \{\vec{OA}, \vec{OB}\} \quad \text{donde} \quad
  \vec{OA} = \{P \in \mathbb{R}^2 \mid \vec{OP} = \lambda \vec{OA}, \, \lambda \ge
  0\}$$


  ### Desglose simbólico y geométrico

  - $\vec{OA}$: Rayo inicial o primer lado del ángulo.

  - $\vec{OB}$: Rayo terminal o segundo lado del ángulo.

  - $\lambda \ge 0$: Parámetro no negativo que modela la extensión infinita del rayo
  en una sola dirección.

  - Independencia métrica: La longitud del dibujo de un lado no afecta la medida del
  ángulo (los rayos no tienen longitud finita).


  ### Síntesis didáctica

  Reconocer que los lados de un ángulo son rayos y no segmentos finitos previene el
  error común de creer que alargar las líneas de un dibujo amplía la medida del ángulo.'
definiciones_clave: '- **Lados del ángulo**: Rayos $\vec{OA}$ y $\vec{OB}$ que delimitan
  la abertura angular.

  - **Rayo inicial y final**: En ángulos orientados, el rayo inicial indica dónde
  empieza la medición y el final dónde termina. '
propiedades_relaciones: '- **Infinitud de los lados**: Al ser rayos, los lados no
  poseen longitud finita ni final.

  - **Conservación del ángulo**: Extender o recortar la representación visual de los
  lados no cambia la medida del ángulo. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Identificación de Lados](/static/img/nodos/identificacion-de-los-lados-de-un-angulo-como-rayos-ejemplos.svg)


    Un compás abierto forma un ángulo de $45^\circ$ denotado como $\angle ABC$. Si
    la bisagra del compás se ubica en $B$, escribe la notación simbólica de los dos
    lados del ángulo.'
  pasos:
  - 'Paso 1: Reconocer que la bisagra en $B$ es el punto de origen común de ambas
    patas del compás.'
  - 'Paso 2: Trazar la trayectoria infinita de cada pata desde la bisagra pasando
    por las puntas en $A$ y $C$.'
  - 'Paso 3: Concluir que los lados del ángulo son las semirrectas o rayos $\vec{BA}$
    y $\vec{BC}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué objeto geométrico constituye formalmente cada uno de los lados de
    un ángulo?
  choices:
  - text: Un rayo (semirrecta con origen en el vértice)
    is_correct: true
  - text: Un segmento de longitud fija de 5 cm
    is_correct: false
  - text: Una recta completa sin origen determinado
    is_correct: false
  - text: Un punto en el plano cartesiano
    is_correct: false
  explanation: Cada lado de un ángulo es un rayo (semirrecta con origen en el vértice)
    que se extiende infinitamente en una dirección.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el compás de notación $\angle ABC$ con vértice en B, ¿cuáles son las
    semirrectas que representan sus lados?
  choices:
  - text: Los rayos BA y BC
    is_correct: true
  - text: Los rayos AB y CB
    is_correct: false
  - text: El segmento AC solamente
    is_correct: false
  - text: Los puntos A y C sin origen
    is_correct: false
  explanation: Los lados del ángulo corresponden a los rayos BA y BC que nacen en
    la bisagra central B.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el vértice del ángulo.'
- 'Paso 2: Trazar o nombrar los rayos que parten desde el vértice hacia los otros
  dos puntos de la notación.'
- 'Paso 3: Expresar los lados con la notación de rayo $\vec{VO_1}$ y $\vec{VO_2}$.'
errores_correccion: 'Evita nombrar los lados invirtiendo el orden de las letras: el
  rayo debe comenzar siempre con la letra del vértice (ejemplo: $\vec{BA}$, no $\vec{AB}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En el ángulo $\angle XYZ$, ¿cuál es el rayo que representa uno de sus
    lados?
  alternativas:
  - $\vec{YX}$
  - $\vec{XY}$
  - $\vec{XZ}$
  respuesta: $\vec{YX}$
  solucion_pasos:
  - 'El rayo debe iniciar en el vértice Y e ir hacia X: $\vec{YX}$.'
- titulo: Ejemplo 2
  enunciado: Si alargamos el dibujo del lado $\vec{OA}$ de un ángulo de $45^\circ$,
    ¿cuánto mide el nuevo ángulo?
  alternativas:
  - $45^\circ$
  - $90^\circ$
  - $135^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - La medida del ángulo depende únicamente de la abertura entre los rayos, no de
    la longitud dibujada de los lados.
- titulo: ¿Los lados de un ángulo se extienden infinitamente en una dirección?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque por definición los lados de un ángulo son rayos.
- titulo: ¿Si recortamos el papel donde está dibujado un ángulo, disminuye su medida
    en grados?
  respuesta: 'No'
  solucion_pasos:
  - No, la medida angular representa la rotación y no se altera por recortar el papel.
errores_frecuentes:
- Escribir la notación del rayo $\vec{BA}$ como si fuera un segmento cerrado $BA$.
- Afirmar que si un lado se dibuja más largo que el otro, el ángulo tiene mayor medida.
- Nombrar el lado comenzando por el punto extremo en lugar de comenzar por el vértice.
- Suponer que los lados de un ángulo tienen una longitud medible en centímetros.
- Confundir los lados de un polígono (segmentos finitos) con los lados de un ángulo
  (rayos infinitos).
afirmaciones_verdaderas:
- Los lados de un ángulo son semirrectas o rayos que parten desde el vértice.
- La longitud visual con la que se representan los lados no modifica la medida en
  grados del ángulo.
al_terminar_debes_poder: '**QUÉ:** Identificar y nombrar correctamente los lados de
  un ángulo como rayos que se originan en el vértice.


  **CÓMO:** Reconociendo las semirrectas $\vec{OA}$ y $\vec{OB}$ y verificando que
  la extensión gráfica de los trazos no altera la medida en grados.


  ![Resumen de Identificación de Lados](/static/img/nodos/identificacion-de-los-lados-de-un-angulo-como-rayos-resumen.svg)'
