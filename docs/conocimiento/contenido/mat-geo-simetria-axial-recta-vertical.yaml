procedimiento:
- 'Paso 1: Identifica la recta vertical x=k que actúa como eje de simetría.'
- 'Paso 2: Aplica la fórmula P''=(2k-x, y) al punto original P(x,y).'
- 'Paso 3: Verifica que la distancia de P a la recta sea igual a la distancia de P''
  a la recta.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con simetría axial respecto de rectas verticales.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de simetría axial respecto de rectas verticales
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
