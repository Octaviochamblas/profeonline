semantic_id: MAT.GEO.SIMETRIAS.AXIAL_RECTA_VERTICAL
resumen_inicial: 'Simetría axial respecto de rectas verticales: conceptos, teoremas,
  propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Reflejar respecto de una recta vertical cualquiera (no necesariamente
  el eje Y) sigue la misma lógica de 'espejo', pero centrada en esa recta específica.
explicacion_formal: '![Simetría axial respecto de rectas verticales](/static/img/geometria/isometrias/simetria-axial-recta-vertical.svg)


  ### Definición formal


  Si el eje de simetría es la recta vertical $x=k$, cada punto $P(x,y)$ se transforma
  en $P''(2k-x,\,y)$, generalizando la fórmula del eje Y (que corresponde al caso
  particular $k=0$).


  ### Desarrollo didáctico


  En la figura, respecto de la recta $x=3$, el punto $P(0,2)$ se refleja en $P''(2\times3-0,\,2)=(6,2)$:
  la distancia de $P$ a la recta (3 unidades) es igual a la distancia de $P''$ a la
  recta.'
definiciones_clave: '- **Simetría axial respecto de rectas verticales**: Elemento
  o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
