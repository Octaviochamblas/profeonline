semantic_id: MAT.ALG.TRIG_COORDENADAS.SIGNO_SENO_CUADRANTES
resumen_inicial: 'Análisis del signo del seno según el cuadrante: círculo unitario,
  amplitud, período y transformaciones de Seno y coseno en el círculo unitario.'
explicacion_simple: Como el seno corresponde a la coordenada $y$, su signo cambia
  exactamente igual que el signo de esa coordenada en cada cuadrante.
explicacion_formal: '### Definición formal


  Como $\sin(\theta)=y$, el signo del seno coincide con el signo de la coordenada
  $y$ del punto asociado. En el primer cuadrante ($0°<\theta<90°$) y el segundo ($90°<\theta<180°$),
  $y>0$; en el tercero ($180°<\theta<270°$) y el cuarto ($270°<\theta<360°$), $y<0$.


  ### Desarrollo didáctico


  $\sin(45°)$ (primer cuadrante) es positivo; $\sin(135°)$ (segundo cuadrante) también
  es positivo, con el mismo valor absoluto que $\sin(45°)$; $\sin(225°)$ (tercer cuadrante)
  es negativo.'
definiciones_clave: '- **Análisis del signo del seno según el cuadrante**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a análisis del signo del seno según el cuadrante.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    análisis del signo del seno según el cuadrante.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de análisis del signo del seno según el cuadrante.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
