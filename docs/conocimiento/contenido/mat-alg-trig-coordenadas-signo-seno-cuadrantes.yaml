semantic_id: MAT.ALG.TRIG_COORDENADAS.SIGNO_SENO_CUADRANTES
resumen_inicial: 'Análisis del signo algebráico de la función seno según la ubicación cuadrantal del ángulo en el plano cartesiano.'
explicacion_simple: |
  Como el seno de un ángulo en el círculo unitario equivale a la coordenada vertical $y$ del punto, su signo algebráico depende exclusivamente de si el punto está por encima o por debajo del eje horizontal (eje $X$):
  - En los cuadrantes **I y II** (donde $y > 0$), el seno es **positivo** ($+$).
  - En los cuadrantes **III y IV** (donde $y < 0$), el seno es **negativo** ($-$).
explicacion_formal: |
  ### Definición formal
  La **variación del signo del seno por cuadrante** se deriva de la definición $\sin \theta = y$ en la circunferencia goniométrica $\mathcal{C}: x^2 + y^2 = 1$:
  $$\operatorname{sgn}(\sin \theta) = \operatorname{sgn}(y) = \begin{cases} +1 & \text{si } \theta \in \text{I C} \cup \text{II C} \quad (y > 0) \\ -1 & \text{si } \theta \in \text{III C} \cup \text{IV C} \quad (y < 0) \\ 0 & \text{si } \theta = k\pi \quad (y = 0) \end{cases}$$

  ### Desglose simbólico
  - **Cuadrante I** ($0 < \theta < 90^\circ$): $y > 0 \implies \sin \theta > 0$ (Positivo).
  - **Cuadrante II** ($90^\circ < \theta < 180^\circ$): $y > 0 \implies \sin \theta > 0$ (Positivo).
  - **Cuadrante III** ($180^\circ < \theta < 270^\circ$): $y < 0 \implies \sin \theta < 0$ (Negativo).
  - **Cuadrante IV** ($270^\circ < \theta < 360^\circ$): $y < 0 \implies \sin \theta < 0$ (Negativo).

  ### Síntesis didáctica
  Para recordar el signo del seno solo hace falta visualizar la mitad superior e inferior del plano cartesiano: todo ángulo en el "techo" del plano ($y > 0$) produce seno positivo, y todo ángulo en el "subsuelo" ($y < 0$) produce seno negativo.
definiciones_clave: |
  - **Signo de la ordenada**: Polaridad algebráica del eje vertical $Y$ que gobierna al seno.
  - **Seno positivo**: Intervalo angular $(0, \pi)$ que abarca los cuadrantes I y II.
  - **Seno negativo**: Intervalo angular $(\pi, 2\pi)$ que abarca los cuadrantes III y IV.
propiedades_relaciones: |
  - **Simetría respecto al eje X**: El signo del seno cambia al reflejar un ángulo a través del eje horizontal: $\sin(-\theta) = -\sin(\theta)$.
  - **Continuidad de signos**: El seno permanece positivo durante todo el semicírculo superior ($0$ a $180^\circ$) y negativo durante todo el semicírculo inferior ($180^\circ$ a $360^\circ$).
ejemplo_guiado:
  enunciado: 'Determina el signo algebráico de $\sin(210^\circ)$ justificando la respuesta mediante su ubicación cartesiana.'
  pasos:
    - 'Paso 1: Evaluar la magnitud del ángulo: $180^\circ < 210^\circ < 270^\circ$.'
    - 'Paso 2: Identificar el cuadrante: el lado terminal de $210^\circ$ se ubica en el **Tercer Cuadrante (III C)**.'
    - 'Paso 3: Analizar la coordenada vertical en el III cuadrante: las ordenadas se ubican por debajo del eje horizontal ($y < 0$).'
    - 'Paso 4: Concluir que el signo de $\sin(210^\circ)$ es **negativo** ($-$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuáles cuadrantes del plano cartesiano la función seno toma valores positivos?'
    choices:
      - {text: 'Primer y Segundo cuadrante (I C y II C)', is_correct: true}
      - {text: 'Primer y Tercer cuadrante (I C y III C)', is_correct: false}
      - {text: 'Segundo y Cuarto cuadrante (II C y IV C)', is_correct: false}
      - {text: 'Tercer y Cuarto cuadrante (III C y IV C)', is_correct: false}
    explanation: 'La alternativa correcta es ''Primer y Segundo cuadrante (I C y II C)''. Corresponde a la región superior donde la ordenada $y$ es positiva ($y > 0$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el signo del seno para un ángulo de $\theta = 315^\circ$ ubicado en el cuarto cuadrante?'
    choices:
      - {text: 'Negativo ($-$) ', is_correct: true}
      - {text: 'Positivo ($+$)', is_correct: false}
      - {text: 'Cero', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''Negativo ($-$) ''. En el cuarto cuadrante, las ordenadas están por debajo del eje horizontal ($y < 0$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Ubicar el cuadrante del ángulo $\theta$ en el plano cartesiano.'
  - 'Paso 2: Observar si la región se encuentra en la mitad superior ($y > 0$) o inferior ($y < 0$) del plano.'
  - 'Paso 3: Asignar signo positivo $(+)$ para cuadrantes I y II.'
  - 'Paso 4: Asignar signo negativo $(-)$ para cuadrantes III y IV.'
errores_correccion: |
  - **Error 1:** Asociar el signo del seno a la posición horizontal $x$. **Cómo corregirlo:** La abscisa horizontal $x$ rige al coseno. El seno se rige estrictamente por la coordenada vertical $y$.
  - **Error 2:** Creer que el seno cambia de signo en el ángulo de $90^\circ$. **Cómo corregirlo:** En $90^\circ$ el seno alcanza su máximo de $+1$ y sigue siendo positivo en el II cuadrante hasta llegar a $180^\circ$.
ejemplos:
  - titulo: 'Signo en el segundo cuadrante'
    enunciado: '¿Cuál es el signo de $\sin(135^\circ)$?'
    alternativas:
      - 'Positivo ($+$)'
      - 'Negativo ($-$)'
      - 'Cero'
    respuesta: 'Positivo ($+$)'
    solucion_pasos:
      - '1. $135^\circ$ está en el II Cuadrante.'
      - '2. En II C la ordenada $y > 0$.'
      - '3. Por lo tanto, $\sin(135^\circ) > 0$ (positivo).'
  - titulo: 'Signo en el tercer cuadrante'
    enunciado: '¿Es $\sin(240^\circ)$ una cantidad negativa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $240^\circ$ está en el III Cuadrante donde las ordenadas son negativas ($y < 0$).'
  - titulo: 'Seno positivo en 30 grados'
    enunciado: '¿El seno de $30^\circ$ es positivo por pertenecer al primer cuadrante?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el I cuadrante todas las coordenadas son positivas.'
  - titulo: 'Seno negativo en giros horarios agudos'
    enunciado: '¿Un ángulo de $-45^\circ$ (IV cuadrante) posee seno negativo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al girar en sentido horario ingresa al IV Cuadrante donde $y < 0$.'
errores_frecuentes:
  - 'La afirmación de que el seno es negativo en el segundo cuadrante del plano cartesiano.'
  - 'La afirmación de que el seno es positivo en los cuatro cuadrantes del círculo unitario.'
  - 'La afirmación de que el signo del seno depende de la abscisa horizontal $x$.'
  - 'La afirmación de que en el tercer cuadrante el seno toma valores positivos.'
  - 'La afirmación de que un ángulo con seno negativo se encuentra obligatoriamente en el primer cuadrante.'
afirmaciones_verdaderas:
  - 'La función seno es positiva en los cuadrantes I y II ($y > 0$) y negativa en los cuadrantes III y IV ($y < 0$).'
  - 'El signo del seno depende exclusivamente de la posición vertical de la ordenada $y$ sobre el plano cartesiano.'
al_terminar_debes_poder: |
  QUÉ: Identificar y justificar el signo algebráico de la función seno en los cuatro cuadrantes.
  CÓMO: Evaluar el signo de la ordenada $y$ según la región cartesiana en que se ubica el ángulo.
