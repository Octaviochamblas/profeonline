semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_ARCO_GRADOS
resumen_inicial: 'Cálculo de longitud de arco mediante proporción respecto de 360°:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Un arco es solo una fracción de la circunferencia completa; esa
  fracción se puede determinar comparando su ángulo central con el giro completo de
  360°.
explicacion_formal: '![Longitud de arco en grados](/static/img/geometria/circunferencia-circulo/circulo-longitud-arco-grados.svg)


  ### Definición formal


  La longitud de un arco es proporcional a su ángulo central: $L=\frac{\theta}{360°}\times2\pi
  r$, donde $\theta$ es la medida del ángulo central en grados y $2\pi r$ es la longitud
  de la circunferencia completa.


  ### Desarrollo didáctico


  Un arco de 90° en una circunferencia de radio 8 cm mide $L=\frac{90}{360}\times2\pi\times8=\frac{1}{4}\times16\pi=4\pi\approx12,57$
  cm, es decir, exactamente un cuarto de la circunferencia completa.'
