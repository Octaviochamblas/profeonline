semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_A
resumen_inicial: La identificación del coeficiente cuadrático $a$ extrae el valor numérico (con su signo) que multiplica a la variable de segundo grado $x^2$.
explicacion_simple: |
  El **coeficiente cuadrático $a$** es el número "pegado" a la $x^2$:

  - **Si ves $f(x) = 5x^2 - 3x + 1$**: El número que multiplica a $x^2$ es $5 \implies a = 5$.
  - **Si ves $f(x) = -x^2 + 4x$**: El signo menos antes de $x^2$ representa el número $-1 \implies a = -1$.
  - **Si ves $f(x) = x^2 - 7$**: Si no hay un número escrito delante de $x^2$, significa que hay un $1$ invisible $\implies a = 1$.
  - **Función en la parábola**: El signo de $a$ te dice si la parábola se abre hacia arriba ($a > 0$, "carita feliz") o hacia abajo ($a < 0$, "carita triste").
explicacion_formal: |
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, el **coeficiente cuadrático $a$** es el escalar que determina el grado 2 y la curvatura parabólica:

  $$a = \lim_{x \to \pm\infty} \frac{f(x)}{x^2}$$

  **Propiedades geométricas del coeficiente $a$:**
  - **Concavidad:**
    - Si $a > 0$, la parábola es cóncava hacia arriba (posee un valor mínimo en su vértice).
    - Si $a < 0$, la parábola es cóncava hacia abajo (posee un valor máximo en su vértice).
  - **Abertura o dilatación:**
    - A mayor $|a|$, la curva es más estrecha (se comprime hacia el eje $Y$).
    - A menor $|a|$, la curva es más ancha (se dilata hacia el eje $X$).
definiciones_clave: |
  - **Coeficiente cuadrático ($a$)**: Factor numérico no nulo que multiplica a la variable independiente de segundo grado $x^2$.
propiedades_relaciones: |
  - **Invariancia por traslación**: Las traslaciones horizontales o verticales de una parábola preservan exactamente el valor y signo de su coeficiente cuadrático $a$.
ejemplo_guiado:
  enunciado: 'Identifica el coeficiente cuadrático $a$ en la función $f(x) = 8 - 3x - \frac{x^2}{2}$ e indica su concavidad.'
  pasos:
    - 'Paso 1: Localizar la potencia de segundo grado: $-\frac{x^2}{2} = -\frac{1}{2} x^2$.'
    - 'Paso 2: Extraer el coeficiente numérico $a$: $a = -\frac{1}{2}$.'
    - 'Paso 3: Analizar el signo de $a$: como $a = -\frac{1}{2} < 0$, el signo es negativo.'
    - 'Paso 4: Concluir que la parábola es cóncava hacia abajo.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del coeficiente cuadrático $a$ en la función $f(x) = 4 - x^2$?'
    choices:
      - {text: '$a = -1$', is_correct: true}
      - {text: '$a = 4$', is_correct: false}
      - {text: '$a = 1$', is_correct: false}
      - {text: '$a = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -1$''. El término cuadrático es $-x^2 = -1 \cdot x^2$, luego $a = -1$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si en una función cuadrática el coeficiente principal es $a = 6$, ¿hacia dónde se abre su parábola?'
    choices:
      - {text: 'Se abre hacia arriba porque $a > 0$', is_correct: true}
      - {text: 'Se abre hacia abajo porque $a > 0$.', is_correct: false}
      - {text: 'Se convierte en una recta horizontal.', is_correct: false}
      - {text: 'Se abre únicamente hacia la izquierda.', is_correct: false}
    explanation: 'La alternativa correcta es ''Se abre hacia arriba porque $a > 0$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Localizar el monomio que contiene la variable $x^2$.'
  - 'Paso 2: Separar la potencia $x^2$ del factor numérico que la multiplica.'
  - 'Paso 3: Si no figura un número escrito, asignar $a = 1$ (si es positivo) o $a = -1$ (si es negativo).'
  - 'Paso 4: Declarar el valor exacto de $a$ incluyendo signos o fracciones.'
errores_correccion: |
  - **Error común:** Confundir el coeficiente $a$ con la potencia completa $x^2$ o decir que $a = x^2$.
  - **Cómo corregirlo:** El coeficiente $a$ **ES UN NÚMERO**, no contiene la letra $x$. De $3x^2$, $a = 3$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Coeficiente fraccionario.
    alternativas:
      - '$a = 3/4$'
      - '$a = 3$'
      - '$a = 4$'
    respuesta: '$a = 3/4$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Coeficiente implícito negativo.
    alternativas:
      - '$a = -1$'
      - '$a = 1$'
      - '$a = -x^2$'
    respuesta: '$a = -1$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Escribir que el coeficiente cuadrático incluye la variable en la forma $a = -x^2$.'
  - 'Afirmar que cuando la función comienza con $x^2$, el coeficiente $a$ vale cero.'
  - 'Tomar la constante independiente $c$ como el coeficiente $a$ cuando la expresión está desordenada.'
  - 'La equiparación del coeficiente cuadrático $a$ con el exponente 2 de la potencia.'
  - 'La falta de inclusión del signo negativo cuando el término es $-x^2 / 3$ declarando $a = 1/3$ en lugar de $-1/3$.'
afirmaciones_verdaderas:
  - 'El coeficiente cuadrático $a$ es el número real no nulo que multiplica a $x^2$ y define la concavidad de la parábola.'
  - 'Si $a > 0$, la parábola se abre hacia arriba; si $a < 0$, la parábola se abre hacia abajo.'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer el coeficiente cuadrático $a$ en cualquier función de segundo grado.
  CÓMO: Isolar el factor numérico que acompaña a $x^2$, considerar su signo y relacionarlo con la concavidad de la parábola.
