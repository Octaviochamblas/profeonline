semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_A
resumen_inicial: 'El coeficiente cuadrático $a$ es el factor real no nulo que multiplica a la potencia de segundo grado $x^2$, gobernando la concavidad y la apertura gráfica de la parábola.'
explicacion_simple: |
  El coeficiente cuadrático, denominado habitualmente como $a$, es el número que acompaña directamente a la variable $x^2$. Su signo indica hacia dónde se abren las ramas de la parábola (hacia arriba si es positivo, hacia abajo si es negativo), mientras que su tamaño numérico (valor absoluto) determina qué tan abierta o angosta es la curva.
explicacion_formal: |
  ### Definición formal
  En la función cuadrática $f(x) = ax^2 + bx + c$, el **coeficiente cuadrático** $a$ se define como el escalar multiplicativo perteneciente a $\mathbb{R} \setminus \{0\}$ que pondera la variable de segundo grado $x^2$.

  ### Desglose simbólico
  - $a > 0$: Parábola **cóncava hacia arriba** (en forma de "U"). El vértice corresponde a un punto **mínimo absoluto**.
  - $a < 0$: Parábola **cóncava hacia abajo** (en forma de "∩"). El vértice corresponde a un punto **máximo absoluto**.
  - $|a|$ grande ($|a| > 1$): Parábola comprimida horizontalmente (más angosta/esbelta).
  - $|a|$ pequeño ($0 < |a| < 1$): Parábola dilatada horizontalmente (más ancha/plana).

  ### Síntesis didáctica
  El parámetro $a$ es el controlador geométrico de la curvatura. Sin importar el orden en que estén escritos los términos de la función, $a$ se reconoce unívocamente por ser el factor que multiplica a la variable elevada al cuadrado.
definiciones_clave: |
  - **Coeficiente cuadrático $a$**: Número real distinto de cero que multiplica al término de segundo grado $x^2$.
  - **Concavidad**: Orientación de la abertura de la parábola determinada por el signo del coeficiente $a$.
  - **Apertura de la parábola**: Grado de extensión lateral de la curva gobernado de manera inversamente proporcional por $|a|$.
propiedades_relaciones: |
  - **Invariancia bajo traslación**: Las traslaciones verticales y horizontales no alteran el valor de $a$. En la forma canónica $f(x) = a(x - h)^2 + k$ y en la forma factorizada $f(x) = a(x - x_1)(x - x_2)$, el valor de $a$ es idéntico al de la forma general.
  - **Reflexión respecto al eje $x$**: Si reemplazamos $a$ por $-a$, la parábola invierte exactamente su concavidad manteniendo la misma apertura.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = 7 - \frac{1}{2}x^2 + 3x$, identifica el valor numérico del coeficiente cuadrático $a$, determina la orientación de la concavidad de la parábola y analiza su apertura respecto a la parábola patrón $y = x^2$.'
  pasos:
    - 'Paso 1: Localizamos el término que contiene la variable elevada al cuadrado $x^2$, el cual es $-\frac{1}{2}x^2$.'
    - 'Paso 2: Extraemos su coeficiente multiplicativo: $a = -\frac{1}{2}$.'
    - 'Paso 3: Dado que $a = -\frac{1}{2} < 0$, la parábola es cóncava hacia abajo (se abre hacia abajo).'
    - 'Paso 4: Comparamos el valor absoluto $|a| = |-\frac{1}{2}| = \frac{1}{2}$ con 1. Al ser $|a| < 1$, las ramas de la parábola se encuentran más dilatadas (abiertas) que las de $y = x^2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una función cuadrática presenta un coeficiente cuadrático $a = -4$, ¿qué características geométricas presenta su parábola asociada?'
    choices:
      - {text: 'Cóncava hacia abajo y más angosta que $y = x^2$', is_correct: true}
      - {text: 'Cóncava hacia arriba y más ancha que $y = x^2$', is_correct: false}
      - {text: 'Cóncava hacia abajo y más ancha que $y = x^2$', is_correct: false}
      - {text: 'Cóncava hacia arriba y de concavidad neutra', is_correct: false}
    explanation: 'La alternativa correcta es ''Cóncava hacia abajo y más angosta que $y = x^2$''. Al ser $a = -4 < 0$, abre hacia abajo; y al ser $|a| = 4 > 1$, es más angosta.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor del coeficiente cuadrático $a$ en la función $g(x) = -x^2 + 8x - 15$?'
    choices:
      - {text: '$a = -1$', is_correct: true}
      - {text: '$a = 1$', is_correct: false}
      - {text: '$a = 8$', is_correct: false}
      - {text: '$a = -15$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -1$''. El término $-x^2$ equivale a $-1 \cdot x^2$, de donde $a = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar o simplificar la expresión algebraica si se presenta en forma factorizada o con paréntesis.'
  - 'Paso 2: Identificar el término de segundo grado que contiene $x^2$.'
  - 'Paso 3: Extraer el número real (con su signo) que multiplica a $x^2$. Si aparece únicamente $-x^2$, el coeficiente es $a = -1$; si aparece $x^2$, es $a = 1$.'
errores_correccion: |
  - **Error 1:** Afirmar que el coeficiente cuadrático es el término completo $ax^2$ (incluyendo la variable). **Cómo corregirlo:** El coeficiente $a$ es exclusivamente la constante numérica o escalar que multiplica a $x^2$, no incluye el símbolo $x^2$.
  - **Error 2:** Asumir que si no hay número visible delante de $x^2$, el coeficiente es $a = 0$. **Cómo corregirlo:** Por convención algebraica, $x^2 = 1x^2$ (luego $a = 1$) y $-x^2 = -1x^2$ (luego $a = -1$). Si fuera $a = 0$, el término no existiría.
ejemplos:
  - titulo: 'Identificación en expresión implícita'
    enunciado: '¿Cuál es el valor del coeficiente cuadrático $a$ en $f(x) = 5 + x^2 - 2x$?'
    alternativas:
      - '$a = 1$'
      - '$a = 5$'
      - '$a = -2$'
    respuesta: '$a = 1$'
    solucion_pasos:
      - '1. Identificamos el término de segundo grado: $+x^2$.'
      - '2. El coeficiente implícito que multiplica a $x^2$ es $1$.'
      - '3. Por lo tanto, $a = 1$.'
  - titulo: 'Extracción desde forma factorizada'
    enunciado: 'En la función $g(x) = -3(x - 1)(x + 4)$, ¿cuál es el coeficiente cuadrático $a$?'
    alternativas:
      - '$a = -3$'
      - '$a = 3$'
      - '$a = -1$'
    respuesta: '$a = -3$'
    solucion_pasos:
      - '1. Desarrollamos los factores: $(x - 1)(x + 4) = x^2 + 3x - 4$.'
      - '2. Multiplicamos por el factor externo: $g(x) = -3(x^2 + 3x - 4) = -3x^2 - 9x + 12$.'
      - '3. El término cuadrático es $-3x^2$, por lo que $a = -3$.'
  - titulo: 'Impacto del signo sobre la concavidad'
    enunciado: 'Si una función cuadrática tiene $a = \sqrt{2}$, ¿su gráfica es una parábola cóncava hacia arriba?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $\sqrt{2} \approx 1.414 > 0$, el signo positivo del coeficiente $a$ determina que las ramas de la parábola abran hacia arriba.'
  - titulo: 'Variación de la concavidad al cambiar el signo de a'
    enunciado: '¿Las funciones $f(x) = 6x^2$ y $g(x) = -6x^2$ tienen la misma concavidad?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. $f(x)$ tiene $a = 6 > 0$ (cóncava hacia arriba) mientras que $g(x)$ tiene $a = -6 < 0$ (cóncava hacia abajo).'
errores_frecuentes:
  - 'El coeficiente cuadrático de la función $f(x) = x^2 - 3x + 2$ es $x^2$.'
  - 'En la función $f(x) = -x^2 + 5$, el coeficiente cuadrático $a$ es igual a $0$ por no tener coeficiente escrito.'
  - 'Un coeficiente cuadrático $a$ fraccionario como $a = \frac{1}{4}$ invalida la condición de función cuadrática.'
  - 'El valor absoluto del coeficiente $a$ no influye en el ancho o apertura de las ramas de la parábola.'
  - 'Si una parábola tiene su vértice en el origen $(0,0)$, su coeficiente cuadrático $a$ es obligatoriamente $0$.'
afirmaciones_verdaderas:
  - 'El signo del coeficiente cuadrático $a$ determina la orientación de la concavidad de la parábola en el plano cartesiano.'
  - 'Para la función $f(x) = -x^2$, el coeficiente cuadrático es $a = -1$.'
al_terminar_debes_poder: 'Identificar e interpretar el coeficiente cuadrático $a$ en cualquier función cuadrática, deduciendo inmediatamente la concavidad y apertura gráfica de la parábola.'
