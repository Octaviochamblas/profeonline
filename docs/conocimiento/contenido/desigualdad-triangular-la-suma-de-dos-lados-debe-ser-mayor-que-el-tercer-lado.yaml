semantic_id: MAT.GEO.TRIANGULOS_METRICA.DESIGUALDAD_TRIANGULAR_SUMA
resumen_inicial: La desigualdad triangular establece que en todo triángulo euclidiano
  la suma de las longitudes de dos lados cualesquiera es estrictamente mayor que la
  longitud del tercer lado.
explicacion_simple: '![Desigualdad Triangular](/static/img/nodos/desigualdad-triangular-la-suma-de-dos-lados-debe-ser-mayor-que-el-tercer-lado-intro.svg)


  Para poder armar un triángulo con tres palitos, los dos palitos más cortos **deben
  sumar juntos más largo que el palito grande**. Si los dos palitos cortos son muy
  pequeños (por ejemplo de $2\text{ cm}$ y $3\text{ cm}$ frente a uno de $8\text{
  cm}$), al doblarlos nunca alcanzarán a tocarse en el aire y no se podrá cerrar la
  figura.'
explicacion_formal: '### Teorema de la desigualdad triangular

  Tres números reales positivos $a, b, c > 0$ pueden formar los lados de un triángulo
  en el plano euclidiano si y solo si la longitud de cada lado es estrictamente menor
  que la suma de los otros dos:


  $$\begin{cases} a < b + c \\ b < a + c \\ c < a + b \end{cases} \iff |a - b| < c
  < a + b$$


  ### Desglose simbólico y geométrico

  - Axioma métrico fundamental: La distancia más corta entre dos puntos es el segmento
  rectilíneo que los une: $d(A, B) \le d(A, C) + d(C, B)$.

  - Caso degenerado: Si $c = a + b$, los puntos $A, B, C$ son colineales y el triángulo
  colapsa en un segmento de área cero.

  - Condición compacta: Basta verificar que el lado mayor sea menor que la suma de
  los dos lados menores ($c_{\max} < a + b$).


  ### Síntesis didáctica

  La desigualdad triangular es el criterio algebraico necesario y suficiente que rige
  la existencia física y geométrica de cualquier triángulo en el plano.'
definiciones_clave: '- **Desigualdad triangular**: Condición métrica que exige que
  la suma de dos lados supere al tercero.

  - **Existencia de triángulo**: Criterio que garantiza que los tres segmentos puedan
  formar una región poligonal cerrada no degenerada.

  - **Distancia geodésica**: El camino directo es estrictamente más corto que cualquier
  trayectoria indirecta pasando por un tercer vértice. '
propiedades_relaciones: '- **Criterio simplificado**: Si ordenamos los lados como
  $a \le b \le c$, basta con verificar una sola desigualdad: $a + b > c$.

  - **Consecuencia de área**: Si $a + b > c$, la fórmula de Herón produce un semiperímetro
  $s > a, b, c$, garantizando un área estrictamente positiva ($A > 0$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Desigualdad Triangular](/static/img/nodos/desigualdad-triangular-la-suma-de-dos-lados-debe-ser-mayor-que-el-tercer-lado-ejemplos.svg)


    Determina si es posible construir un triángulo cuyos lados midan $a = 5\text{
    cm}$, $b = 8\text{ cm}$ y $c = 12\text{ cm}$.'
  pasos:
  - 'Paso 1: Identificar los dos lados menores: $a = 5\text{ cm}$ y $b = 8\text{ cm}$.'
  - 'Paso 2: Identificar el lado mayor: $c = 12\text{ cm}$.'
  - 'Paso 3: Sumar los dos lados menores: $5 + 8 = 13\text{ cm}$.'
  - 'Paso 4: Comparar la suma con el lado mayor: $13 > 12$.'
  - 'Paso 5: Concluir que **sí es posible** construir el triángulo, ya que la suma
    de los dos lados menores supera al lado mayor ($5 + 8 = 13 > 12$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el requisito métrico fundamental para que tres segmentos formen
    un triángulo?
  choices:
  - text: La suma de las longitudes de dos lados cualesquiera debe ser estrictamente
      mayor que el tercer lado
    is_correct: true
  - text: La suma de dos lados debe ser igual al tercer lado
    is_correct: false
  - text: Los tres lados deben tener obligatoriamente la misma medida
    is_correct: false
  - text: La suma de los tres lados debe ser 180 cm
    is_correct: false
  explanation: Por el teorema de desigualdad triangular, la suma de las longitudes
    de dos lados cualesquiera debe ser estrictamente mayor que el tercer lado.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Se puede construir un triángulo con lados de 3 cm, 4 cm y 9 cm?
  choices:
  - text: No, porque 3 + 4 = 7 < 9 (los dos lados menores no alcanzan a cerrarse)
    is_correct: true
  - text: Sí, porque 3, 4 y 9 son números positivos
    is_correct: false
  - text: Sí, es un triángulo escaleno
    is_correct: false
  - text: Sí, porque 4 + 9 > 3
    is_correct: false
  explanation: Sumando los dos menores, se obtiene que no, porque 3 + 4 = 7 < 9 (los
    dos lados menores no alcanzan a cerrarse).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las medidas de los tres lados dados.'
- 'Paso 2: Ordenar los lados de menor a mayor: $a \le b \le c$.'
- 'Paso 3: Calcular la suma de los dos menores: $a + b$.'
- 'Paso 4: Si $a + b > c$, el triángulo existe; si $a + b \le c$, el triángulo no
  existe.'
errores_correccion: 'No compares solo un par cualquiera: la prueba decisiva es siempre
  sumar los dos lados más cortos y verificar si superan al más largo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes ternas de longitudes permite construir un triángulo?
  alternativas:
  - $6\text{ cm}, 7\text{ cm}, 11\text{ cm}$
  - $2\text{ cm}, 3\text{ cm}, 6\text{ cm}$
  - $4\text{ cm}, 5\text{ cm}, 10\text{ cm}$
  respuesta: $6\text{ cm}, 7\text{ cm}, 11\text{ cm}$
  solucion_pasos:
  - $6 + 7 = 13 > 11$, por lo que cumple la desigualdad triangular. En las otras dos
    $2+3=5<6$ y $4+5=9<10$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden $5\text{ cm}$ y $9\text{ cm}$, ¿puede
    el tercer lado medir $15\text{ cm}$?
  alternativas:
  - No, porque 5 + 9 = 14 < 15
  - Sí, porque 15 es mayor
  - Sí, si es un triángulo obtusángulo
  respuesta: No, porque 5 + 9 = 14 < 15
  solucion_pasos:
  - Como $5 + 9 = 14 < 15$, los lados de 5 y 9 no logran unirse.
- titulo: ¿Un triángulo puede tener lados de 7 cm, 10 cm y 12 cm?
  respuesta: Sí
  solucion_pasos:
  - Sí, $7 + 10 = 17 > 12$.
- titulo: ¿Tres segmentos de 1 cm, 2 cm y 3 cm pueden formar un triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, $1 + 2 = 3$ (caso degenerado, queda una línea recta).
errores_frecuentes:
- Probar solo una desigualdad que sí se cumpla ($b + c > a$) e ignorar la suma de
  los lados menores ($a + b > c$).
- Creer que $a + b = c$ forma un triángulo (forma un segmento colineal).
- Confundir la suma de lados con la suma de ángulos de 180°.
- Pensar que cualquier trío de números positivos puede formar un triángulo.
- Olvidar que las medidas deben estar en la misma unidad antes de comparar.
afirmaciones_verdaderas:
- En todo triángulo la suma de dos lados cualesquiera es estrictamente mayor que el
  tercer lado.
- Para verificar la existencia de un triángulo basta comprobar que la suma de los
  dos lados menores supere al mayor.
al_terminar_debes_poder: '**QUÉ:** Aplicar el teorema de la desigualdad triangular
  para determinar la existencia métrica de triángulos.


  **CÓMO:** Verificando que la suma de los dos lados menores sea estrictamente mayor
  que el lado mayor ($a + b > c$).


