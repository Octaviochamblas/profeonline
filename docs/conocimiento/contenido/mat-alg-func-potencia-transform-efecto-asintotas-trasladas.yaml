semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.EFECTO_ASINTOTAS_TRASLADAS
resumen_inicial: 'Las traslaciones trasladan exactamente las asíntotas de una función potencia de exponente negativo $g(x) = a(x - h)^{-m} + k$: la asíntota vertical se desplaza a $x = h$ y la horizontal a $y = k$.'
explicacion_simple: |
  En las funciones potencia de exponente negativo (como las hipérbolas $x^{-1}$ o los volcanes $x^{-2}$), las asíntotas actúan como las "ruedas" o la estructura rígida de la gráfica. Cuando trasladamos la función horizontalmente en $h$ unidades y verticalmente en $k$ unidades, la cruz de asíntotas se mueve completa exactamente a la par. La recta vertical invisible se desplaza de $x = 0$ a la nueva línea $x = h$, y la recta horizontal se desplaza de $y = 0$ a la nueva línea $y = k$.
explicacion_formal: |
  ### Definición formal
  Para una función potencia recíproca desfasada $g(x) = a(x - h)^{-m} + k \equiv \frac{a}{(x - h)^m} + k$ con $m \in \mathbb{Z}^+$ y $a \neq 0$, las **traslaciones rígidas determinan de forma unívoca el sistema de asíntotas**:

  1. **Asíntota Vertical Trasladada**:
     - Ecuación cartesiana: $x = h$.
     - Demostración analítica: Raíz del denominador $(x - h)^m = 0 \implies x = h$, donde $\lim_{x \to h} |g(x)| = +\infty$.
     - El dominio de definición real se convierte en $\operatorname{Dom}(g) = \mathbb{R} \setminus \{h\}$.

  2. **Asíntota Horizontal Trasladada**:
     - Ecuación cartesiana: $y = k$.
     - Demostración analítica: Límite al infinito $\lim_{x \to \pm\infty} \left[\frac{a}{(x - h)^m} + k\right] = 0 + k = k$.

  ### Síntesis didáctica
  Centro de intersección de asíntotas: El punto cartesiano de cruce entre la asíntota vertical y la horizontal se ubica exactamente en las coordenadas $(h, k)$.
definiciones_clave: |
  - **Asíntota vertical trasladada $x = h$**: Recta vertical de indefinición provocada por la traslación horizontal de la raíz del denominador.
  - **Asíntota horizontal trasladada $y = k$**: Recta horizontal de convergencia limite impulsada por la traslación vertical del término aditivo externo.
  - **Cruce de asíntotas $(h, k)$**: Punto de intersección perpendicular del sistema asintótico.
propiedades_relaciones: |
  - **Recorrido de hipérbolas impares recíprocas**: Para exponente negativo impar $m = 2k+1$, la asíntota $y = k$ es el único valor excluido del recorrido: $\operatorname{Rec}(g) = \mathbb{R} \setminus \{k\}$.
  - **Recorrido de volcanes pares recíprocos**: Para exponente negativo par $m = 2k$ con $a > 0$, la asíntota horizontal $y = k$ fija el límite abierto del recorrido en $]k, +\infty[$.
ejemplo_guiado:
  enunciado: 'Identifica las ecuaciones de la asíntota vertical y la asíntota horizontal, las coordenadas de su cruce, el dominio y el recorrido para la función potencia negativa trasladada $g(x) = \frac{4}{(x - 3)^2} + 5$.'
  pasos:
    - 'Paso 1: Asíntota vertical: El denominador se anula en $x - 3 = 0 \implies x = 3$. Ecuación: $x = 3$. Dominio: $\operatorname{Dom}(g) = \mathbb{R} \setminus \{3\}$.'
    - 'Paso 2: Asíntota horizontal: Límite cuando $x \to \infty \implies \frac{4}{\infty} + 5 = 5$. Ecuación: $y = 5$.'
    - 'Paso 3: Punto de intersección de asíntotas: $(h, k) = (3, 5)$.'
    - 'Paso 4: Como el exponente $2$ es par y $a = 4 > 0$, la gráfica de volcán sube sobre la asíntota $y = 5$. Recorrido: $\operatorname{Rec}(g) = ]5, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las ecuaciones de las asíntotas vertical y horizontal para la función potencia recíproca $g(x) = \frac{-2}{x + 4} - 7$?'
    choices:
      - {text: 'Asíntota vertical $x = -4$ y asíntota horizontal $y = -7$', is_correct: true}
      - {text: 'Asíntota vertical $x = 4$ y asíntota horizontal $y = 7$', is_correct: false}
      - {text: 'Asíntota vertical $y = -7$ y asíntota horizontal $x = -4$', is_correct: false}
      - {text: 'Asíntota vertical $x = 0$ y asíntota horizontal $y = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''Asíntota vertical $x = -4$ y asíntota horizontal $y = -7$''. El denominador $x + 4 = 0 \implies x = -4$ fija la asíntota vertical, y el término constante $-7$ fija la asíntota horizontal $y = -7$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué punto del plano cartesiano se cruzan perpendicularmente las asíntotas de la función potencia $g(x) = \frac{1}{(x - 6)^3} + 2$?'
    choices:
      - {text: 'En el punto de coordenadas $(6, 2)$', is_correct: true}
      - {text: 'En el punto de coordenadas $(-6, 2)$', is_correct: false}
      - {text: 'En el punto de coordenadas $(6, -2)$', is_correct: false}
      - {text: 'En el origen de coordenadas $(0, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''En el punto de coordenadas $(6, 2)$''. La asíntota vertical $x = 6$ y la horizontal $y = 2$ se cortan en el punto $(h, k) = (6, 2)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la función potencia de exponente negativo en forma desfasada $g(x) = \frac{a}{(x - h)^m} + k$.'
  - 'Paso 2: Igualar el binomio del denominador a cero para hallar la asíntota vertical: $x - h = 0 \implies x = h$.'
  - 'Paso 3: Tomar el término independiente constante externo para hallar la asíntota horizontal: $y = k$.'
  - 'Paso 4: Declarar el punto de cruce de asíntotas en $(h, k)$ y ajustar el dominio $\mathbb{R} \setminus \{h\}$ y el recorrido.'
errores_correccion: |
  - **Error 1:** Afirmar que la asíntota vertical de $\frac{1}{x + 5}$ es $x = 5$. **Cómo corregirlo:** La asíntota se halla igualando el denominador a cero: $x + 5 = 0 \implies x = -5$. La asíntota vertical es $x = -5$.
  - **Error 2:** Creer que la traslación horizontal altera la asíntota horizontal $y = k$. **Cómo corregirlo:** Las traslaciones horizontales ($h$) mueven exclusivamente a la asíntota **vertical**. La asíntota **horizontal** depende única y exclusivamente de la traslación vertical $k$.
ejemplos:
  - titulo: 'Asíntotas en hipérbola desfasada'
    enunciado: '¿Las asíntotas de $f(x) = \frac{1}{x - 2} + 3$ son $x = 2$ e $y = 3$?'
    alternativas:
      - 'Sí, $x = 2$ e $y = 3$'
      - 'No, $x = -2$ e $y = -3$'
      - 'No, $x = 3$ e $y = 2$'
    respuesta: 'Sí, $x = 2$ e $y = 3$'
    solucion_pasos:
      - '1. Denominador $x - 2 = 0 \implies x = 2$ (Asíntota vertical).'
      - '2. Término externo $k = 3 \implies y = 3$ (Asíntota horizontal).'
  - titulo: 'Dominio excluido por asíntota vertical'
    enunciado: '¿El dominio de $g(x) = \frac{5}{(x + 1)^2} - 4$ es $\mathbb{R} \setminus \{-1\}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La asíntota vertical en $x = -1$ excluye al $-1$ del dominio.'
  - titulo: 'Recorrido en volcán desfasado'
    enunciado: '¿El recorrido de $h(x) = \frac{2}{(x - 4)^2} + 1$ es $]1, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La asíntota $y = 1$ fija la cota inferior abierta del volcán positivo: $]1, +\infty[$.'
  - titulo: 'Cruce de asíntotas en el plano'
    enunciado: '¿El cruce de asíntotas de $p(x) = \frac{-3}{(x - 8)^3} - 10$ es $(8, -10)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La intersección de $x = 8$ e $y = -10$ es el punto $(8, -10)$.'
errores_frecuentes:
  - 'La asíntota vertical de la función $f(x) = \frac{1}{x - 3} + 2$ es la recta $x = -3$.'
  - 'Una traslación horizontal de $h = 4$ modifica la posición de la asíntota horizontal.'
  - 'La asíntota horizontal de la función $f(x) = \frac{1}{(x + 2)^2} + 7$ es $y = 0$.'
  - 'El punto de indefinición de la función $f(x) = \frac{1}{x - 5} + 1$ es $x = 1$.'
  - 'Las asíntotas trasladadas dejan de ser perpendiculares entre sí.'
afirmaciones_verdaderas:
  - 'Las traslaciones trasladas el sistema de asíntotas de una función potencia de exponente negativo $g(x) = a(x - h)^{-m} + k$, fijando la asíntota vertical en $x = h$ y la asíntota horizontal en $y = k$.'
  - 'El punto de intersección perpendicular de ambas asíntotas $(h, k)$ determina el nuevo centro geométrico del gráfico y de sus cotas de recorrido.'
al_terminar_debes_poder: |
  QUÉ: Determinar la nueva posición de las asíntotas en funciones potencia de exponente negativo trasladadas.
  CÓMO: Identificar la asíntota vertical en $x = h$ y la asíntota horizontal en $y = k$ a partir de la forma $f(x) = a(x - h)^{-m} + k$.
