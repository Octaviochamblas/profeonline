semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.EFECTO_ASINTOTAS_TRASLADAS
resumen_inicial: 'Efecto de las traslaciones en las asíntotas de funciones potencia
  negativas: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones
  y escalas.'
explicacion_simple: Cuando una función con exponente negativo se traslada, sus asíntotas
  se mueven exactamente igual que el resto de la curva.
explicacion_formal: '### Definición formal


  La función básica $g(x)=a\cdot x^{-n}$ tiene asíntotas $x=0$ e $y=0$. Al aplicar
  $f(x)=g(x-h)+k$, cada asíntota se traslada junto con la curva: la vertical pasa
  de $x=0$ a $x=h$, y la horizontal pasa de $y=0$ a $y=k$.


  ### Desarrollo didáctico


  $f(x)=\dfrac{1}{x-3}+2$: la asíntota vertical, antes en $x=0$, ahora está en $x=3$
  (donde el denominador original se anulaba); la asíntota horizontal, antes en $y=0$,
  ahora está en $y=2$.'
definiciones_clave: '- **Efecto de las traslaciones en las asíntotas de funciones
  potencia negativas**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in
  \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a efecto de las traslaciones en las asíntotas de funciones potencia
  negativas.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de efecto de las traslaciones en las asíntotas de funciones potencia negativas.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de efecto de las traslaciones
    en las asíntotas de funciones potencia negativas.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar efecto de las traslaciones en las asíntotas de funciones potencia
    negativas?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en efecto de las traslaciones en las asíntotas de funciones potencia
    negativas?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica los valores de $h$ y $k$ en la expresión trasladada.'
- 'Paso 2: Traslada la asíntota vertical de $x=0$ a $x=h$.'
- 'Paso 3: Traslada la asíntota horizontal de $y=0$ a $y=k$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en efecto de las traslaciones en las asíntotas de funciones potencia
  negativas.
ejemplos:
- titulo: Identificación de asíntotas trasladas
  enunciado: ¿Cuáles son las asíntotas de $f(x)=\dfrac{2}{x+1}-4$?
  solucion_pasos:
  - Se identifica $h=-1$ y $k=-4$.
  - La asíntota vertical es $x=-1$ y la horizontal es $y=-4$.
- titulo: Verificación con un caso numérico
  enunciado: ¿Cuál es la asíntota vertical de $f(x)=\dfrac{5}{x-6}+1$?
  solucion_pasos:
  - Se identifica $h=6$.
  - La asíntota vertical es $x=6$.
- titulo: ¿Las asíntotas trasladadas siguen siendo perpendiculares entre sí?
  enunciado: ¿Las asíntotas vertical y horizontal trasladadas siguen siendo perpendiculares
    entre sí?
  respuesta: Sí
  solucion_pasos:
  - Una sigue siendo vertical y la otra horizontal, por lo que siguen siendo perpendiculares.
- titulo: ¿El punto de intersección de las asíntotas coincide siempre con $(h,k)$?
  enunciado: ¿El punto donde se cruzan las asíntotas trasladadas es siempre $(h,k)$?
  respuesta: Sí
  solucion_pasos:
  - La asíntota vertical $x=h$ y la horizontal $y=k$ se cruzan exactamente en el punto
    $(h,k)$.
errores_frecuentes:
- Trasladar la asíntota vertical usando el valor de $k$ en vez de $h$, o viceversa.
- Olvidar que ambas asíntotas se trasladan simultáneamente cuando la función combina
  ambos parámetros.
- Confundir el signo de $h$ al identificar la nueva posición de la asíntota vertical.
- No verificar el punto de intersección de las asíntotas como referencia del centro
  de la curva.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  efecto de las traslaciones en las asíntotas de funciones potencia negativas.
