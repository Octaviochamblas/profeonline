semantic_id: MAT.NUM.FRACCIONES_COMPARACION.DISTINTO_DENOMINADOR
resumen_inicial: Para comparar fracciones con distinto denominador se amplifican a
  un denominador común (vía m.c.m.) y se comparan sus nuevos numeradores.
explicacion_simple: Si dos fracciones tienen numeradores y denominadores completamente
  diferentes, no podemos compararlas directamente porque representan partes de distinto
  tamaño. La estrategia consiste en amplificar ambas fracciones hasta lograr que tengan
  el mismo número en el denominador, para luego comparar fácilmente sus numeradores.
explicacion_formal: 'Para comparar $\frac{a}{b}$ y $\frac{c}{d}$ con $b \neq d$, se
  homogenizan mediante el mínimo común múltiplo de los denominadores $M = \operatorname{mcm}(b,
  d)$:


  $$\frac{a}{b} = \frac{a \cdot (M/b)}{M}, \quad \frac{c}{d} = \frac{c \cdot (M/d)}{M}
  \implies \frac{a}{b} > \frac{c}{d} \iff a \cdot \left(\frac{M}{b}\right) > c \cdot
  \left(\frac{M}{d}\right)$$


  **Desglose de la fórmula:**

  - $M = \operatorname{mcm}(b, d)$: Denominador común mínimo que homogeniza las unidades
  fraccionarias.

  - Comparación homogénea: Reduce el problema al caso de igual denominador.


  > **Complemento didáctico:** Al igualar los denominadores estamos redividiendo los
  enteros en partes de exactamente la misma escala de medida.'
definiciones_clave: '- **Homogenización de fracciones**: Algoritmo que amplifica fracciones
  a un denominador común $M = \operatorname{mcm}(b, d)$.'
propiedades_relaciones: '- **Invarianza de orden por homogenización**: Reserva las
  relaciones $<$ o $>$ al transformar a denominadores comunes.'
ejemplo_guiado:
  enunciado: Compare las fracciones $\frac{3}{4}$ y $\frac{5}{6}$ homogenizándolas
    al mínimo común denominador.
  pasos:
  - 'Paso 1: Hallar el mínimo común múltiplo de los denominadores $4$ y $6$: $\operatorname{mcm}(4,
    6) = 12$.'
  - 'Paso 2: Amplificar $\frac{3}{4}$ por $3$: $\frac{3 \cdot 3}{4 \cdot 3} = \frac{9}{12}$.'
  - 'Paso 3: Amplificar $\frac{5}{6}$ por $2$: $\frac{5 \cdot 2}{6 \cdot 2} = \frac{10}{12}$.'
  - 'Paso 4: Comparar los nuevos numeradores homogéneos: $9 < 10 \implies \frac{9}{12}
    < \frac{10}{12}$.'
  - 'Conclusión: $\frac{3}{4} < \frac{5}{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso metodológico para comparar fracciones de distinto
    denominador?
  choices:
  - text: Homogenizar las fracciones a un denominador común (mediante el m.c.m.)
    is_correct: true
  - text: Sumar los numeradores y restar los denominadores
    is_correct: false
  - text: Restar los denominadores
    is_correct: false
  - text: Multiplicar ambas por cero
    is_correct: false
  explanation: La alternativa correcta es 'Homogenizar las fracciones a un denominador
    común (mediante el m.c.m.)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3/4 y 5/6 homogenizadas a doceavos, ¿cuál fue
    la desigualdad resultante?
  choices:
  - text: 3/4 < 5/6 (porque 9/12 < 10/12)
    is_correct: true
  - text: 3/4 > 5/6
    is_correct: false
  - text: Son equivalentes
    is_correct: false
  - text: No se pueden comparar
    is_correct: false
  explanation: La alternativa correcta es '3/4 < 5/6 (porque 9/12 < 10/12)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el m.c.m. de los denominadores diferentes.'
- 'Paso 2: Amplificar cada fracción para que todas tengan el m.c.m. como denominador
  común.'
- 'Paso 3: Comparar los numeradores resultantes para determinar el orden de las fracciones.'
errores_correccion: '- **Error 1: Comparar numeradores directamente sin igualar denominadores
  primero.** **Cómo corregirlo:** Se DEBE homogenizar denominadores antes de comparar
  numeradores.


  - **Error 2: Olvidar amplificar el numerador al cambiar el denominador.** **Cómo
  corregirlo:** Si se multiplica el denominador por $k$, el numerador DEBE multiplicarse
  por la misma cifra $k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Compare 2/3 y 3/5.
  alternativas:
  - 2/3 > 3/5 (10/15 > 9/15)
  - 2/3 < 3/5
  - Son iguales
  respuesta: 2/3 > 3/5 (10/15 > 9/15)
  solucion_pasos:
  - 'mcm(3,5) = 15. Amplificados: $2/3 = 10/15$ y $3/5 = 9/15$. Como $10 > 9 \implies
    2/3 > 3/5$.'
- titulo: Ejemplo 2
  enunciado: ¿Es 1/2 menor que 3/8?
  alternativas:
  - No, porque 1/2 = 4/8 y 4/8 > 3/8
  - Sí, porque 1 < 3
  - Sí, porque 2 < 8
  respuesta: No, porque 1/2 = 4/8 y 4/8 > 3/8
  solucion_pasos:
  - $1/2 = 4/8$. Como $4/8 > 3/8$, entonces $1/2 > 3/8$.
- titulo: ¿Se pueden homogenizar tres o más fracciones a la vez usando el m.c.m. para
    ordenarlas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el método universal para ordenar listas de fracciones de distinto denominador.
- titulo: ¿Es 5/6 mayor que 7/9?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{mcm}(6,9)=18 \implies 5/6 = 15/18$ y $7/9 = 14/18$. $15/18
    > 14/18$.
errores_frecuentes:
- Comparar directamente los numeradores de fracciones con denominadores distintos
  determina su orden.
- Al homogenizar una fracción solo se amplifica el denominador dejando el numerador
  igual.
- El mínimo común denominador es equivalente a restar ambos denominadores.
- Fracciones de distinto denominador solo se pueden comparar convirtiéndolas a números
  mixtos.
- La fracción $1/3$ es mayor que $4/6$ porque $3$ es menor que $6$.
afirmaciones_verdaderas:
- Para comparar fracciones con distinto denominador se deben homogenizar a un denominador
  común vía m.c.m.
- Al homogenizar a un denominador común, la comparación se reduce a evaluar el orden
  de los nuevos numeradores.
al_terminar_debes_poder: Al terminar serás capaz de comparar fracciones de distinto
  denominador, homogenizándolas al mínimo común denominador y ordenando sus nuevos
  numeradores.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
