semantic_id: MAT.NUM.FRACCIONES_COMPARACION.DISTINTO_DENOMINADOR
resumen_inicial: "Para comparar fracciones con distinto denominador, se amplifican a un denominador común (mediante el m.c.m.) y luego se comparan sus nuevos numeradores."
explicacion_simple: |
  Imagina que quieres comparar $\frac{2}{3}$ con $\frac{3}{5}$. Como las pizzas están cortadas en cantidad de trozos distinta (3 trozos vs 5 trozos), no puedes comparar los numeradores directamente. ¿Qué haces? Re-cortas ambas pizzas en el mismo número total de trozos pequeños (el mínimo común múltiplo entre 3 y 5, que es 15). Así, $\frac{2}{3}$ se convierte en $\frac{10}{15}$ y $\frac{3}{5}$ se convierte en $\frac{9}{15}$. Ahora que ambas están en decimoquintos, ¡es fácil ver que 10 es mayor que 9! Por ende, $\frac{2}{3} > \frac{3}{5}$.
explicacion_formal: |
  Formalmente, dadas dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con $b \neq d$ y $b, d \in \mathbb{Z}^+$:

  1. Se determina el Mínimo Común Múltiplo de los denominadores: $M = \text{mcm}(b, d)$.
  2. Se amplifica la primera fracción por el factor $k_1 = \frac{M}{b}$, obteniendo $\frac{a \cdot k_1}{M}$.
  3. Se amplifica la segunda fracción por el factor $k_2 = \frac{M}{d}$, obteniendo $\frac{c \cdot k_2}{M}$.
  4. La relación de orden entre las fracciones originales coincide con la relación de orden entre sus numeradores homogenizados:
  $$\frac{a}{b} > \frac{c}{d} \iff a \cdot k_1 > c \cdot k_2$$
definiciones_clave: |
  - **Homogenización de denominadores**: Técnica de amplificar fracciones para llevarlas a compartir un mismo denominador $M = \text{mcm}(b, d)$.
  - **Mínimo Común Denominador ($M$)**: Menor número entero positivo divisible simultáneamente por $b$ y por $d$.
  - **Factores de amplificación ($k_1, k_2$)**: Multiplicadores $k_1 = \frac{M}{b}$ y $k_2 = \frac{M}{d}$ necesarios para homogenizar.
propiedades_relaciones: |
  - **Conservación de la clase**: Homogenizar no modifica el valor numérico ni la posición en la recta de las fracciones comparadas.
  - **Facilitación de adición**: El paso de homogenización para comparar es exactamente el mismo procedimiento requerido para sumar o restar fracciones de distinto denominador.
  - **Alternativa de denominadores iguales a $b \cdot d$**: Si bien usar $\text{mcm}(b, d)$ es lo más eficiente, cualquier múltiplo común como $b \cdot d$ produce el mismo resultado de orden.
ejemplo_guiado:
  enunciado: "Compara las fracciones $\\frac{5}{6}$ y $\\frac{7}{8}$ utilizando el método del mínimo común denominador."
  pasos:
    - "Calcular el mcm de los denominadores $6$ y $8$: $\\text{mcm}(6, 8) = 24$."
    - 'Amplificar $\frac{5}{6}$ para llevarla a denominador $24$: factor $24 \div 6 = 4 \implies \frac{5 \cdot 4}{6 \cdot 4} = \frac{20}{24}$.'
    - 'Amplificar $\frac{7}{8}$ para llevarla a denominador $24$: factor $24 \div 8 = 3 \implies \frac{7 \cdot 3}{8 \cdot 3} = \frac{21}{24}$.'
    - 'Comparar los numeradores homogenizados: $20 < 21 \implies \frac{20}{24} < \frac{21}{24}$.'
    - "Concluir para las fracciones originales: $\\frac{5}{6} < \\frac{7}{8}$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el primer paso metodológico para comparar adecuadamente dos fracciones que poseen distinto denominador?"
    choices:
      - {text: "Encontrar un denominador común mediante el m.c.m. de sus denominadores y amplificar ambas fracciones.", is_correct: true}
      - {text: "Sumar los numeradores directamente sin alterar los denominadores.", is_correct: false}
      - {text: "Restar el primer denominador del segundo denominador.", is_correct: false}
      - {text: "Declarar inmediatamente que la fracción con el número más grande es la mayor.", is_correct: false}
    explanation: "La correcta es Encontrar un denominador común mediante el m.c.m. de sus denominadores y amplificar ambas fracciones.: la homogenización de denominadores permite comparar numeradores sobre la misma escala."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al homogenizar las fracciones $\\frac{2}{5}$ y $\\frac{1}{4}$ con el común denominador $20$, ¿cuáles son las fracciones homogenizadas obtenidas y cuál es mayor?"
    choices:
      - {text: "$\\frac{8}{20} y \\frac{5}{20}, siendo mayor \\frac{2}{5} (\\frac{8}{20} > \\frac{5}{20}).$", is_correct: true}
      - {text: "$\\frac{2}{20} y \\frac{1}{20}, siendo mayor \\frac{2}{5}.$", is_correct: false}
      - {text: "$\\frac{10}{20} y \\frac{4}{20}, siendo mayor \\frac{1}{4}.$", is_correct: false}
      - {text: "$Ambas fracciones quedan iguales a \\frac{5}{20}.$", is_correct: false}
    explanation: "La correcta es \\frac{8}{20} y \\frac{5}{20}, siendo mayor \\frac{2}{5} (\\frac{8}{20} > \\frac{5}{20}).: amplificando por $4$ resulta $\\frac{8}{20}$ y por $5$ resulta $\\frac{5}{20}$, donde $8 > 5$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Hallar el Mínimo Común Múltiplo $M = \text{mcm}(b, d)$ entre los denominadores $b$ y $d$."
  - 'Paso 2: Calcular el factor de amplificación para cada fracción ($M \div b$ y $M \div d$).'
  - "Paso 3: Amplificar ambas fracciones a denominador $M$."
  - "Paso 4: Comparar los nuevos numeradores de igual denominador y determinar la fracción mayor."
errores_correccion: |
  Un error clásico es comparar directamente los numeradores de fracciones con distinto denominador (por ejemplo, afirmar que $\frac{3}{8} > \frac{2}{3}$ porque $3 > 2$). **Nunca compares numeradores si los denominadores no son idénticos**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Compara $\\frac{3}{4}$ y $\\frac{5}{6}$."
    alternativas:
      - "$\\frac{5}{6} es mayor porque \\frac{9}{12} < \\frac{10}{12}.$"
      - "$\\frac{3}{4} es mayor porque 3/4 tiene menor denominador.$"
      - "Son iguales."
    respuesta: "$\\frac{5}{6} es mayor porque \\frac{9}{12} < \\frac{10}{12}.$"
    solucion_pasos:
      - "Hallamos $\\text{mcm}(4, 6) = 12$."
      - "Homogenizamos: $\\frac{3}{4} = \\frac{9}{12}$ y $\\frac{5}{6} = \\frac{10}{12}$."
      - "Como $9 < 10$, $\\frac{3}{4} < \\frac{5}{6}$."
  - titulo: "Ejemplo 2"
    enunciado: "Tres botellas contienen jugo: la primera $\\frac{1}{2}$ litro, la segunda $\\frac{2}{3}$ litro y la tercera $\\frac{3}{4}$ litro. ¿Cuál tiene más jugo?"
    alternativas:
      - "$La tercera botella (\\frac{3}{4} L) pues en doceavos corresponde a \\frac{9}{12} L.$"
      - "$La primera botella (\\frac{1}{2} L).$"
      - "$La segunda botella (\\frac{2}{3} L).$"
    respuesta: "$La tercera botella (\\frac{3}{4} L) pues en doceavos corresponde a \\frac{9}{12} L.$"
    solucion_pasos:
      - "$\\text{mcm}(2, 3, 4) = 12$."
      - "Homogenizamos: $\\frac{1}{2} = \\frac{6}{12}$, $\\frac{2}{3} = \\frac{8}{12}$, $\\frac{3}{4} = \\frac{9}{12}$."
      - "Comparando numeradores: $6 < 8 < 9 \\implies \\frac{1}{2} < \\frac{2}{3} < \\frac{3}{4}$."
  - titulo: "¿Se puede usar siempre el producto de los denominadores $b \\cdot d$ como denominador común aunque no sea el m.c.m.?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, cualquier múltiplo común funciona correctamente para comparar, aunque números más grandes requieren simplificación."
  - titulo: "¿Cambia la relación de orden si ambas fracciones homogenizadas se convierten a números decimales?"
    respuesta: "No"
    solucion_pasos:
      - "No, el orden de los números racionales es único e independiente de la representación utilizada."
errores_frecuentes:
  - "Comparar numeradores directamente sin homogenizar los denominadores previamente."
  - "Olvidar multiplicar el numerador al amplificar el denominador al común múltiplo."
  - "Sumar los numeradores y denominadores para decidir cuál es mayor."
  - "Cometer errores aritméticos al calcular el mínimo común múltiplo."
  - "Creer que la fracción con números más grandes en sus términos es siempre la mayor."
afirmaciones_verdaderas:
  - "Para comparar dos fracciones de distinto denominador, es necesario homogenizarlas a un denominador común antes de comparar sus numeradores."
  - "El mínimo común múltiplo de los denominadores proporciona el común denominador más eficiente para realizar la comparación."
al_terminar_debes_ponder: |
  Debes ser capaz de homogenizar cualquier grupo de fracciones de distinto denominador mediante el m.c.m. y ordenarlas con precisión.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
