semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_EXTERIOR_TANGENTE_SECANTE
resumen_inicial: 'La medida de un ángulo exterior formado por una tangente y una secante (o por dos tangentes) sigue exactamente la misma ley de semidiferencia: ε = (Arco Mayor - Arco Menor) / 2.'
explicacion_simple: '¿Qué sucede si una de las dos líneas que salen desde el punto exterior $P$ no corta a la circunferencia, sino que solo la roza en un único punto $T$ (una recta tangente)?


  ¡Ocurre algo maravilloso: **la fórmula sigue siendo exactamente la misma**! No tienes que aprenderte ninguna regla nueva:

  $$\epsilon = \frac{\overset{\frown}{\text{Arco Mayor}} - \overset{\frown}{\text{Arco Menor}}}{2}$$


  La única diferencia es que el arco menor termina exactamente en el punto de contacto $T$. Y si las dos líneas son tangentes (el caso del gorro o sombrero), los dos arcos completan la vuelta completa ($360^\circ$), lo que produce una regla de oro genial: **el ángulo exterior y el arco menor son suplementarios** (suman $180^\circ$): **$\epsilon + \overset{\frown}{\text{Arco Menor}} = 180^\circ$**.


  ![Ángulo exterior por tangente y secante](/static/img/nodos/medida-de-un-angulo-exterior-formado-por-una-tangente-y-una-secante-intro.svg)

  '
explicacion_formal: '### Teorema de la semidiferencia unificada para ángulos exteriores

  Sea $P$ un punto exterior a la circunferencia $\mathcal{C}$. Si desde $P$ se traza una recta tangente que contacta en $T$ y una secante que corta en $A$ y $B$ (con $B$ más lejano que $A$), la medida del ángulo exterior $\epsilon$ satisface:

  $$\epsilon = \frac{\text{med}(\overset{\frown}{TB}) - \text{med}(\overset{\frown}{TA})}{2}$$


  ### Demostración analítica mediante ángulo semiinscrito

  1. Trácese la cuerda auxiliar $\overline{TA}$. Se forma el triángulo $\triangle PTA$.

  2. En $\triangle PTA$, el ángulo semiinscrito $\angle(\mathcal{L}_T, \overline{TA})$ y el ángulo exterior $\epsilon$ se relacionan con el ángulo inscrito $\angle TBA$ en el vértice $B$:

  3. El ángulo semiinscrito en $T$ subtiende el arco $\overset{\frown}{TA}$ y el inscrito en $B$ subtiende el mismo arco $\overset{\frown}{TA}$.

  4. Por la propiedad del ángulo exterior en $\triangle PTA$, el semiinscrito del arco mayor es $\epsilon$ más el inscrito menor:

  $$\frac{\text{med}(\overset{\frown}{TB})}{2} = \epsilon + \frac{\text{med}(\overset{\frown}{TA})}{2} \implies \epsilon = \frac{\text{med}(\overset{\frown}{TB}) - \text{med}(\overset{\frown}{TA})}{2}$$


  ### Caso especial de dos tangentes (Ángulo circunscrito)

  Si ambas rectas son tangentes con contactos $A$ y $B$, el arco mayor mide $360^\circ - \overset{\frown}{AB}$:

  $$\epsilon = \frac{(360^\circ - \overset{\frown}{AB}) - \overset{\frown}{AB}}{2} = \frac{360^\circ - 2\overset{\frown}{AB}}{2} = 180^\circ - \overset{\frown}{AB} \implies \epsilon + \overset{\frown}{AB} = 180^\circ$$


  > **Complemento didáctico:** El caso de dos tangentes es famosísimo en la PAES: el ángulo exterior de la punta del sombrero y el arco pequeño de adentro **suman siempre $180^\circ$**. Si el arco menor mide $130^\circ$, el ángulo exterior mide de inmediato $180^\circ - 130^\circ = 50^\circ$, ¡sin necesidad de hacer ninguna resta larga!

  '
definiciones_clave: '- **Ángulo exterior mixto**: Ángulo con vértice exterior formado por una recta tangente y una secante.

  - **Ángulo circunscrito**: Ángulo con vértice exterior formado por dos rectas tangentes a la circunferencia.

  - **Suplementariedad tangencial**: Condición $\epsilon + \overset{\frown}{AB} = 180^\circ$ en el ángulo entre dos tangentes.

  '
propiedades_relaciones: '- **Unicidad de la ley**: Todo ángulo con vértice exterior calcula su amplitud mediante semidiferencia de arcos, sin importar el tipo de rectas.

  - **Arco mayor y menor en dos tangentes**: Los dos arcos suman $360^\circ$.

  - **Eje de simetría**: En el caso de dos tangentes, la recta que une $P$ con el centro $O$ biseca al ángulo exterior $\epsilon$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo exterior con tangente](/static/img/nodos/medida-de-un-angulo-exterior-formado-por-una-tangente-y-una-secante-ejemplos.svg)


    Desde un punto exterior $P$ se traza una tangente que toca en $T$ y una secante que corta en $A$ y $B$. El arco mayor $\overset{\frown}{TB}$ mide $140^\circ$ y el arco menor $\overset{\frown}{TA}$ mide $40^\circ$. Calcula la medida de $\epsilon$. Además, si desde $P$ se trazan dos tangentes y el arco menor entre los contactos mide $115^\circ$, calcula el ángulo formado por las dos tangentes.'
  pasos:
  - 'Paso 1: Aplicar la semidiferencia para tangente y secante: $\epsilon = \frac{140^\circ - 40^\circ}{2}$.'
  - 'Paso 2: Calcular el ángulo exterior: $\epsilon = \frac{100^\circ}{2} = 50^\circ$.'
  - 'Paso 3: Para el caso de las dos tangentes, aplicar la propiedad de suplementariedad: $\epsilon + \text{Arco menor} = 180^\circ$.'
  - 'Paso 4: Despejar $\epsilon$: $\epsilon = 180^\circ - 115^\circ = 65^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el ángulo exterior formado por una tangente y una secante?
  choices:
  - text: ε = (Arco Mayor - Arco Menor) / 2.
    is_correct: true
  - text: ε = (Arco Mayor + Arco Menor) / 2.
    is_correct: false
  - text: ε = 180° - Arco Mayor.
    is_correct: false
  - text: ε = (Arco Mayor) / 2.
    is_correct: false
  explanation: La alternativa correcta es 'ε = (Arco Mayor - Arco Menor) / 2.' Sigue exactamente la misma ley de semidiferencia de todo ángulo exterior.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si desde un punto exterior se trazan dos tangentes a una circunferencia y el arco menor interceptado mide 120°, ¿cuánto mide el ángulo entre las dos tangentes?
  choices:
  - text: 60°.
    is_correct: true
  - text: 120°.
    is_correct: false
  - text: 30°.
    is_correct: false
  - text: 240°.
    is_correct: false
  explanation: 'La alternativa correcta es ''60°.'' En dos tangentes son suplementarios: $180^\circ - 120^\circ = 60^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si el ángulo exterior está formado por secante-secante, tangente-secante o tangente-tangente.

  2. En tangente-secante, restar arco mayor menos menor y dividir por 2: $\epsilon = \frac{\overset{\frown}{\text{Mayor}} - \overset{\frown}{\text{Menor}}}{2}$.

  3. En tangente-tangente, aplicar directamente la suplementariedad: $\epsilon = 180^\circ - \overset{\frown}{\text{Arco Menor}}$.

  4. Verificar coherencia angular del resultado.

  '
errores_correccion: '- **Error común 1:** Creer que la tangente cambia la fórmula de la semidiferencia. **Corrección:** La fórmula es idéntica en todos los ángulos exteriores: semidiferencia de arcos.

  - **Error común 2:** Olvidar que en dos tangentes el ángulo y el arco menor suman $180^\circ$. **Corrección:** Usar la suplementariedad ahorra tiempo y evita errores de cálculo.

  '
ejemplos:
- tipo: A
  titulo: Ángulo exterior tangente y secante
  enunciado: Una tangente y una secante forman arcos de $150^\circ$ y $50^\circ$. ¿Cuánto mide el ángulo exterior?
  alternativas:
  - text: $50^\circ$.
    is_correct: true
  - text: $100^\circ$.
    is_correct: false
  - text: $25^\circ$.
    is_correct: false
  - text: $75^\circ$.
    is_correct: false
  explicacion: $\epsilon = \frac{150^\circ - 50^\circ}{2} = \frac{100^\circ}{2} = 50^\circ$.
- tipo: B
  titulo: Suplementariedad de dos tangentes
  enunciado: ¿Suman 180° el ángulo formado por dos tangentes y el arco menor comprendido entre sus puntos de contacto?
  respuesta: Sí
  explicacion: Sí. Al derivar la semidiferencia con arcos que suman $360^\circ$, se obtiene que $\epsilon + \overset{\frown}{AB} = 180^\circ$.
errores_frecuentes:
- '''Confundir la fórmula de semidiferencia cuando interviene una recta tangente.'''
- '''Olvidar la propiedad de suplementariedad en el ángulo entre dos tangentes.'''
- '''Sumar los arcos en lugar de restarlos al calcular el ángulo exterior.'''
afirmaciones_verdaderas:
- '''La medida del ángulo exterior formado por una tangente y una secante es la semidiferencia de los arcos interceptados.'''
- '''En el ángulo formado por dos rectas tangentes, el ángulo exterior y el arco menor son suplementarios ($\epsilon + \overset{\frown}{AB} = 180^\circ$).'''
- '''Todos los ángulos con vértice exterior a la circunferencia se rigen por la ley de semidiferencia de arcos.'''
al_terminar_debes_poder: '**QUÉ:** Calcular ángulos exteriores formados por tangentes y secantes, aplicando semidiferencias y suplementariedad.


  **CÓMO:** Empleando $\epsilon = \frac{\overset{\frown}{TB} - \overset{\frown}{TA}}{2}$ y $\epsilon + \overset{\frown}{AB} = 180^\circ$.


  ![Síntesis de ángulo exterior tangente y secante](/static/img/nodos/medida-de-un-angulo-exterior-formado-por-una-tangente-y-una-secante-resumen.svg)

  '
