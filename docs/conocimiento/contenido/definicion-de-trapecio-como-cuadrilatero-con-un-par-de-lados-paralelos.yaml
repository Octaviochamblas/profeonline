semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_DEFINICION
resumen_inicial: Un trapecio es un cuadrilátero que tiene exactamente un par de lados opuestos paralelos denominados bases.
explicacion_simple: 'Imagina una figura de cuatro lados donde la base de abajo y el techo de arriba van en la misma dirección y nunca se cruzan (son paralelos), pero los lados de la izquierda y la derecha están inclinados y si los estiras terminarían chocando arriba. Esa figura es un **trapecio**.


  Los dos lados paralelos se llaman **bases**: la más larga es la base mayor ($B$) y la más corta es la base menor ($b$). Los otros dos lados se llaman lados laterales u oblicuos. A diferencia del paralelogramo (que tiene 2 pares paralelos), el trapecio tiene **exactamente un par** de lados paralelos.


  ![Definición de trapecio](/static/img/nodos/definicion-de-trapecio-como-cuadrilatero-con-un-par-de-lados-paralelos-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea $\mathcal{Q} = (A, B, C, D)$ un cuadrilátero simple en el plano euclidiano $\mathbb{R}^2$. Se define $\mathcal{Q}$ como un **trapecio** si y solo si posee exactamente un par de lados opuestos paralelos:

  $$\mathcal{Q} \text{ es trapecio} \iff \overline{AB} \parallel \overline{CD} \quad \wedge \quad \overline{BC} \not\parallel \overline{DA}$$


  ### Elementos constitutivos

  - **Bases:** Los lados paralelos $\overline{AB}$ y $\overline{CD}$. La convención denota $B = \max(\text{long}(AB), \text{long}(CD))$ como **base mayor** y $b = \min(\text{long}(AB), \text{long}(CD))$ como **base menor**.

  - **Lados no paralelos (laterales):** Los lados $\overline{BC}$ y $\overline{DA}$, cuyas rectas directrices se intersecan en un punto exterior denominado vértice exterior del trapecio.

  - **Altura ($h$):** Distancia euclidiana perpendicular entre las rectas que contienen a las bases ($h = \text{dist}(\overleftrightarrow{AB}, \overleftrightarrow{CD})$).


  > **Complemento didáctico:** Para distinguir rápidamente en la PAES: si una figura de 4 lados tiene dos pares de lados paralelos, es paralelogramo; si tiene un solo par de lados paralelos, es trapecio; y si no tiene ninguno, es trapezoide.

  '
definiciones_clave: '- **Trapecio**: Cuadrilátero convexo con un único par de lados opuestos paralelos.

  - **Base mayor ($B$)**: El lado paralelo de mayor longitud en el trapecio.

  - **Base menor ($b$)**: El lado paralelo de menor longitud en el trapecio.

  - **Lados laterales**: Segmentos no paralelos que unen los extremos de ambas bases.

  '
propiedades_relaciones: '- **Clasificación interna**: Se clasifican en trapecio escaleno (lados laterales desiguales), isósceles (lados laterales congruentes) y rectángulo (un lado perpendicular a las bases).

  - **Diagonales secantes**: Las diagonales siempre se intersecan dentro de la región interior del trapecio, pero nunca se dimidian entre sí.

  - **Triángulos semejantes por bases**: Al cortarse las diagonales, los dos triángulos que se apoyan sobre las bases son semejantes entre sí por el criterio AA.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos guiados de definición de trapecio](/static/img/nodos/definicion-de-trapecio-como-cuadrilatero-con-un-par-de-lados-paralelos-ejemplos.svg)


    En un cuadrilátero $ABCD$, las rectas que contienen a los lados opuestos tienen pendientes $m_{AB} = 0$, $m_{CD} = 0$, $m_{BC} = 2$ y $m_{DA} = -1$. Determina si el cuadrilátero es un trapecio o un paralelogramo.'
  pasos:
  - 'Paso 1: Evaluar paralelismo en el primer par de lados: Como $m_{AB} = m_{CD} = 0$, los lados $AB$ y $CD$ son paralelos ($AB \parallel CD$).'
  - 'Paso 2: Evaluar paralelismo en el segundo par de lados: Las pendientes son $m_{BC} = 2$ y $m_{DA} = -1$. Como $2 \neq -1$, los lados no son paralelos ($BC \not\parallel DA$).'
  - 'Paso 3: Concluir clasificación: El cuadrilátero tiene exactamente un par de lados paralelos, por lo que es rigurosamente un trapecio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la característica geométrica definitoria de un trapecio?
  choices:
  - text: Tener exactamente un par de lados opuestos paralelos.
    is_correct: true
  - text: Tener dos pares de lados opuestos paralelos.
    is_correct: false
  - text: Tener todos sus lados de distinta longitud y sin lados paralelos.
    is_correct: false
  - text: Tener dos ángulos rectos y lados opuestos iguales.
    is_correct: false
  explanation: La alternativa correcta es 'Tener exactamente un par de lados opuestos paralelos.' Esta es la definición universal que lo distingue de paralelogramos y trapezoides.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se denominan los dos lados paralelos de un trapecio?
  choices:
  - text: Base mayor y base menor.
    is_correct: true
  - text: Cateto adyacente e hipotenusa.
    is_correct: false
  - text: Lados laterales u oblicuos.
    is_correct: false
  - text: Apotemas conjugadas.
    is_correct: false
  explanation: La alternativa correcta es 'Base mayor y base menor.' Los lados paralelos constituyen las bases de la figura.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las rectas que contienen a los cuatro lados del cuadrilátero.

  2. Verificar si existe paralelismo entre el primer par de lados opuestos ($L_1 \parallel L_3$).

  3. Verificar si el segundo par de lados opuestos es secante ($L_2 \not\parallel L_4$).

  4. Si existe exactamente un par de paralelas, clasificar como trapecio e identificar base mayor $B$ y menor $b$.

  '
errores_correccion: '- **Error común 1:** Clasificar un paralelogramo como trapecio porque ''tiene bases paralelas''. **Corrección:** El trapecio exige que el segundo par NO sea paralelo.

  - **Error común 2:** Confundir trapecio con trapezoide. **Corrección:** El trapecio tiene 1 par de paralelas; el trapezoide tiene 0 pares paralelos.

  '
ejemplos:
- tipo: A
  titulo: Identificación de bases
  enunciado: En un trapecio $ABCD$, si $AB \parallel CD$, $AB = 14\text{ cm}$ y $CD = 8\text{ cm}$, ¿cuál es la base menor?
  alternativas:
  - text: El segmento $\overline{CD}$ con $8\text{ cm}$.
    is_correct: true
  - text: El segmento $\overline{AB}$ con $14\text{ cm}$.
    is_correct: false
  - text: El segmento lateral $\overline{BC}$.
    is_correct: false
  - text: La altura perpendicular $h$.
    is_correct: false
  explicacion: La base menor es el lado paralelo de menor longitud, en este caso $CD = 8\text{ cm}$.
- tipo: B
  titulo: Paralelismo en trapecios
  enunciado: ¿Pueden los lados laterales de un trapecio ser paralelos entre sí?
  respuesta: 'No'
  explicacion: No. Si los lados laterales fueran paralelos, la figura tendría dos pares de lados paralelos y sería un paralelogramo.
errores_frecuentes:
- '''Creer que los trapecios tienen dos pares de lados paralelos.'''
- '''Confundir las bases paralelas con los lados laterales oblicuos.'''
- '''Asumir que las diagonales de un trapecio se cortan en sus puntos medios.'''
afirmaciones_verdaderas:
- '''Un trapecio posee exactamente un par de lados opuestos paralelos.'''
- '''Los lados paralelos de un trapecio se denominan bases.'''
- '''En un trapecio, las rectas que contienen a los lados no paralelos se intersecan en un punto exterior.'''
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y clasificar a los trapecios reconociendo sus bases paralelas y lados laterales.


  **CÓMO:** Verificando la condición de paralelismo único $b_1 \parallel b_2 \wedge L_1 \not\parallel L_2$.


