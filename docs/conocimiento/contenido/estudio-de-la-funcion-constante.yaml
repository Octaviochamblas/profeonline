semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_DEFINICION
resumen_inicial: La función constante asigna un mismo valor fijo $c$ a cualquier elemento
  del dominio, expresada como $f(x) = c$.
explicacion_simple: 'Una **función constante** es aquella cuya salida NO cambia nunca,
  sin importar qué número metas en la $x$.

  Por ejemplo, en $f(x) = 5$:

  - Si evalúas $f(2) = 5$

  - Si evalúas $f(-10) = 5$

  - Si evalúas $f(0) = 5$

  Su gráfica es siempre una **línea recta horizontal** paralela al eje $X$ que cruza
  al eje $Y$ en el punto $(0, c)$.'
explicacion_formal: 'La **función constante** $f: \mathbb{R} \to \mathbb{R}$ con constante
  real $c \in \mathbb{R}$ se define como:


  $$f(x) = c \quad \forall x \in \mathbb{R}$$


  **Desglose de la fórmula:**

  - $\operatorname{Dom}(f) = \mathbb{R}$

  - $\operatorname{Rec}(f) = \{c\}$ (conjunto unitario formado por el valor $c$).'
definiciones_clave: '- **Función constante ($f(x) = c$)**: Función donde la variable
  dependiente $y$ permanece invariable ante cualquier cambio en $x$.

  - **Recorrido unitario**: El conjunto de imágenes es únicamente el punto singleton
  $\{c\}$.'
propiedades_relaciones: '- **Pendiente nula ($m = 0$)**: La razón de cambio vertical
  respecto al cambio horizontal es siempre igual a cero.'
ejemplo_guiado:
  enunciado: Dada la función constante $f(x) = -4$, evalúa las imágenes $f(0)$, $f(10)$
    y determina su dominio y recorrido.
  pasos:
  - 'Paso 1: Evaluar para $x = 0$: $f(0) = -4$.Paso 2: Evaluar para $x = 10$: $f(10)
    = -4$.Paso 3: Identificar el dominio: por estar definida para todo real, $\operatorname{Dom}(f)
    = \mathbb{R}$.Paso 4: Identificar el recorrido: como la única salida es $-4$,
    $\operatorname{Rec}(f) = \{-4\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjunto recorrido $\operatorname{Rec}(f)$ de la función constante
    $f(x) = -4$?
  choices:
  - text: $\operatorname{Rec}(f) = \{-4\}$ (conjunto formado únicamente por el $-4$)
    is_correct: true
  - text: $\operatorname{Rec}(f) = \mathbb{R}$ (todos los números reales)
    is_correct: false
  - text: $\operatorname{Rec}(f) = [0, +\infty[$
    is_correct: false
  - text: $\operatorname{Rec}(f) = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Rec}(f) = \{-4\}$ (conjunto
    formado únicamente por el $-4$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo es la gráfica de cualquier función constante $f(x) = c$ en el plano
    cartesiano?
  choices:
  - text: Una línea recta horizontal paralela al eje $X$.
    is_correct: true
  - text: Una línea recta vertical paralela al eje $Y$.
    is_correct: false
  - text: Una curva parábola con vértice en el origen.
    is_correct: false
  - text: Una recta inclinada a $45^\circ$.
    is_correct: false
  explanation: La alternativa correcta es 'Una línea recta horizontal paralela al
    eje $X$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la constante real $c$ en la fórmula $f(x) = c$.'
- 'Paso 2: Declarar que cualquier entrada $x$ genera la misma salida $c$.'
- 'Paso 3: Establecer el recorrido como el conjunto singleton $\{c\}$.'
errores_correccion: '- **Error común:** Creer que las rectas verticales $x = k$ son
  funciones constantes.

  - **Cómo corregirlo:** Las rectas verticales $x = k$ NO SON FUNCIONES (fallan el
  test de la línea vertical). Las funciones constantes son rectas HORIZONTALES $y
  = c$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
