semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_DEFINICION
resumen_inicial: La función constante asigna a todo elemento del dominio un único valor fijo $c$, manteniendo una tasa de cambio nula.
explicacion_simple: |
  Una **función constante** es aquella cuya salida nunca cambia:

  Sin importar qué número $x$ le entregues (ya sea $-100, 0$ o $50$), la función siempre te devuelve el mismo resultado fijado $c$.

  Por ejemplo, en $f(x) = 4$:
  - $f(1) = 4$
  - $f(-5) = 4$
  - $f(100) = 4$
explicacion_formal: |
  Una función $f: \mathbb{R} \to \mathbb{R}$ es una **función constante** si existe un número real $c \in \mathbb{R}$ tal que:

  $$\forall x \in \mathbb{R}, \quad f(x) = c$$

  **Propiedades estructurales:**
  - **Dominio**: $\text{Dom}(f) = \mathbb{R}$
  - **Recorrido**: $\text{Rec}(f) = \{c\}$
  - **Pendiente**: $m = 0$
  - **Monotonía**: Es una función constante (no creciente ni decreciente).
definiciones_clave: |
  - **Función constante ($f(x) = c$)**: Regla funcional que devuelve un valor invariante $c$ para cualquier argumento de entrada.
propiedades_relaciones: |
  - **Intersecciones**:
    - Con el eje $Y$: En el punto $(0, c)$.
    - Con el eje $X$: Si $c = 0$, coincide con todo el eje $X$; si $c \neq 0$, no intersecta al eje $X$.
ejemplo_guiado:
  enunciado: "Analiza la función $f(x) = -3$. Determina su dominio, su recorrido y evalúa $f(5)$ y $f(-8)$."
  pasos:
    - 'Paso 1: Identificar la constante: $c = -3$.'
    - 'Paso 2: Determinar el dominio: $\text{Dom}(f) = \mathbb{R}$ (todos los reales).'
    - 'Paso 3: Determinar el recorrido: $\text{Rec}(f) = \{-3\}$.'
    - 'Paso 4: Evaluar: $f(5) = -3$ y $f(-8) = -3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Dada la función constante $f(x) = -3$, ¿cuál es su recorrido?"
    choices:
      - {text: "$\\{-3\\}$", is_correct: true}
      - {text: "$\\mathbb{R}$", is_correct: false}
      - {text: "$]-3, +\\infty[$", is_correct: false}
      - {text: "$\\{0\\}$", is_correct: false}
    explanation: "La alternativa correcta es '$\\{-3\\}$'. Toda función constante $f(x) = c$ tiene como recorrido el conjunto unitario $\\{c\\}$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el valor de la pendiente de la función constante $f(x) = 8$?"
    choices:
      - {text: "$m = 0$", is_correct: true}
      - {text: "$m = 8$", is_correct: false}
      - {text: "$m = 1$", is_correct: false}
      - {text: "La pendiente es indefinida.", is_correct: false}
    explanation: "La alternativa correcta es '$m = 0$'. Toda función constante posee pendiente nula."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reconocer la forma algebraica $f(x) = c$.'
  - 'Paso 2: Declarar el dominio como $\mathbb{R}$.'
  - 'Paso 3: Declarar el recorrido como el conjunto unitario $\{c\}$.'
  - 'Paso 4: Identificar la pendiente $m = 0$ y su gráfico como una recta horizontal a altura $c$.'
errores_correccion: |
  - **Error común:** Decir que el recorrido de $f(x) = 5$ es todo $\mathbb{R}$.
  - **Cómo corregirlo:** El DOMINIO son todos los reales $\mathbb{R}$, pero el RECORRIDO es únicamente el número $\{5\}$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La función constante $f(x) = c$ cambia de valor cuando la variable independiente $x$ aumenta.'
  - 'El dominio de la función constante $f(x) = 5$ se reduce únicamente al número real $\{5\}$.'
  - 'La gráfica de la función constante $f(x) = c$ es una recta vertical oblicua de pendiente unitaria.'
  - 'La función constante $f(x) = 0$ no posee recorrido y su gráfico está indefinido.'
  - 'La preimagen del valor $c$ en la función constante $f(x) = c$ es única y vale $x = 0$.'
afirmaciones_verdaderas:
  - 'La función constante es de la forma $f(x) = c$, donde a cada número real del dominio se le asigna la misma imagen constante $c$.'
  - 'El dominio de la función constante es $\mathbb{R}$ y su recorrido es el conjunto unitario $\{c\}$.'
al_terminar_debes_poder: |
  QUÉ: Analizar y caracterizar la función constante en sus formas algebraica y gráfica.
  CÓMO: Identificar la regla $f(x) = c$, declarar su dominio $\mathbb{R}$, su recorrido $\{c\}$ y su pendiente nula $m = 0$.
fuente: 'Texto escolar MINEDUC — Álgebra / Función Constante y Lineal'
