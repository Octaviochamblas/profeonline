semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_DEFINICION
resumen_inicial: La función constante asigna el mismo valor numérico real a todas las preimágenes del dominio, teniendo pendiente cero y recorrido unitario.
explicacion_simple: '![La función constante asigna el mismo valor numérico real a todas las preimágenes del dominio, teniendo pendiente cero y recorrido unitario](/static/img/nodos/estudio-de-la-funcion-constante-intro.svg)



  Una **función constante** es aquella cuya salida nunca cambia, sin importar el número $x$ que introduzcas.


  Su fórmula general es $f(x) = c$, donde $c$ es un número fijo.


  Por ejemplo, si $f(x) = 5$:

  - $f(0) = 5$

  - $f(-8) = 5$

  - $f(100) = 5$


  Su dominio son todos los reales $\mathbb{R}$, pero su recorrido tiene un solo elemento: $\{5\}$.'
explicacion_formal: 'Formalmente, una **función constante** sobre $\mathbb{R}$ es una aplicación $f: \mathbb{R} \to \mathbb{R}$ definida por:

  $$f(x) = c, \quad \forall x \in \mathbb{R} \quad (c \in \mathbb{R})$$


  **Propiedades analíticas:**

  - **Dominio**: $\text{Dom}(f) = \mathbb{R}$.

  - **Recorrido**: $\text{Rec}(f) = \{c\}$ (conjunto unitario).

  - **Tasa de cambio**: $\frac{f(x_2) - f(x_1)}{x_2 - x_1} = \frac{c - c}{x_2 - x_1} = 0$, por lo que su pendiente es $m = 0$.

  - **Simetría**: Si $c = 0$, es función impar y par a la vez; si $c \neq 0$, es una función par ($f(-x) = f(x) = c$).'
definiciones_clave: '- **Función constante**: Función polinómica de grado cero donde la variable no influye en la imagen.

  - **Recorrido unitario**: Conjunto de imágenes formado por un único número real $\{c\}$.'
propiedades_relaciones: '- **Inyectividad**: No es inyectiva (múltiples preimágenes tienen la misma imagen).

  - **Continuidad**: Es continua y derivable en todo $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función constante asigna el mismo valor numérico real a todas las preimágenes del dominio, teniendo pendiente cero y recorrido unitario](/static/img/nodos/estudio-de-la-funcion-constante-ejemplos.svg)



    Dada la función constante $f(x) = -4$, calcula el valor de $E = \frac{f(10) - 2f(-3)}{f(0)}$.'
  pasos:
  - 'Paso 1: Identificar las imágenes individuales: $f(10) = -4$, $f(-3) = -4$, $f(0) = -4$.'
  - 'Paso 2: Sustituir en el numerador: $-4 - 2(-4) = -4 + 8 = 4$.'
  - 'Paso 3: Sustituir en el denominador: $-4$.'
  - 'Paso 4: Calcular el cociente final: $E = \frac{4}{-4} = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $f(x) = 8$ para todo $x \in \mathbb{R}$, ¿cuál es el recorrido de $f$?
  choices:
  - text: '{8}'
    is_correct: true
  - text: R
    is_correct: false
  - text: '[0, 8]'
    is_correct: false
  - text: ']-\infty, 8]'
    is_correct: false
  explanation: La alternativa correcta es '{8}'. El recorrido de una función constante contiene únicamente el valor asignado.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la pendiente de una función constante $f(x) = c$?
  choices:
  - text: m = 0
    is_correct: true
  - text: m = c
    is_correct: false
  - text: m = 1
    is_correct: false
  - text: No existe
    is_correct: false
  explanation: La alternativa correcta es 'm = 0'. No hay variación vertical (Δy = 0).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la estructura $f(x) = c$ donde no interviene la variable $x$.'
- 'Paso 2: Identificar el valor constante $c$.'
- 'Paso 3: Asignar la imagen $c$ a cualquier preimagen que se solicite evaluar.'
- 'Paso 4: Expresar el recorrido como el conjunto unitario $\{c\}$ y la pendiente como $m = 0$.'
errores_correccion: '- **Error común:** Intentar sustituir el valor de $x$ multiplicándolo por la constante (ej: calcular $f(3) = 5 \cdot 3 = 15$ para $f(x) = 5$).

  - **Cómo corregirlo:** En $f(x) = c$ no hay ninguna variable $x$ en la fórmula; la salida siempre es el número fijo $c$.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación directa'
  enunciado: Si $g(x) = \sqrt{2}$, ¿cuál es el valor de $g(100)$?
  alternativas:
  - \sqrt{2}
  - 100\sqrt{2}
  - '100'
  - \sqrt{200}
  respuesta: \sqrt{2}
  solucion_pasos:
  - 'Paso 1: Por definición de función constante, la imagen es independiente de la entrada.'
  - 'Paso 2: $g(100) = \sqrt{2}$.'
- titulo: 'Ejemplo 2: Suma de imágenes'
  enunciado: Para $f(x) = -6$, calcula $f(1) + f(2) + f(3)$.
  alternativas:
  - '-18'
  - '-6'
  - '-36'
  - '0'
  respuesta: '-18'
  solucion_pasos:
  - 'Paso 1: $f(1) = -6$, $f(2) = -6$, $f(3) = -6$.'
  - 'Paso 2: $(-6) + (-6) + (-6) = -18$.'
- titulo: 'Ejemplo 3: Identificación de recorrido'
  enunciado: ¿Cuál es el recorrido de la función $h(x) = 0$?
  alternativas:
  - '{0}'
  - R
  - '[0, +inf['
  - Vacio
  respuesta: '{0}'
  solucion_pasos:
  - 'Paso 1: Todas las imágenes son iguales a $0$.'
  - 'Paso 2: $\text{Rec}(h) = \{0\}$.'
- titulo: 'Ejemplo 4: Tasa de cambio'
  enunciado: ¿Cuál es la tasa de cambio promedio de $f(x) = 12$ entre $x = 2$ y $x = 8$?
  alternativas:
  - '0'
  - '12'
  - '2'
  - '6'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $\frac{f(8) - f(2)}{8 - 2} = \frac{12 - 12}{6} = 0$.'
errores_frecuentes:
- Multiplicar la constante por el valor de entrada x.
- Escribir el recorrido como R en lugar de {c}.
- Confundir la pendiente m = 0 con una pendiente indefinida.
afirmaciones_verdaderas:
- La función constante f(x) = c asigna el mismo valor de salida para cualquier valor real de entrada.
- La pendiente de una función constante es siempre igual a cero.
al_terminar_debes_poder: '**QUÉ:** Identificar, evaluar y analizar las propiedades fundamentales de la función constante.


  **CÓMO:** Aplicando la regla f(x) = c, reconociendo su pendiente nula y determinando su recorrido unitario.


