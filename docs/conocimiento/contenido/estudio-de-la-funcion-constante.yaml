semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.CONSTANTE_DEFINICION
resumen_inicial: 'Estudio de la función constante: conceptos, representación y propiedades
  en Función constante y función lineal.'
explicacion_simple: 'Hay funciones donde, sin importar qué número ingreses, siempre
  obtienes el mismo resultado: son las funciones constantes.'
explicacion_formal: '### Definición formal


  Una función $f: \mathbb{R} \to \mathbb{R}$ se llama constante si existe $c \in \mathbb{R}$
  tal que $f(x) = c$ para todo $x \in \mathbb{R}$. Su recorrido es el conjunto unitario
  $\{c\}$, independientemente de que su dominio sea todo $\mathbb{R}$.


  ### Desarrollo didáctico


  A diferencia de otras funciones, cambiar el valor de entrada nunca altera el resultado:
  sea $x=0$, $x=100$ o $x=-50$, la salida sigue siendo $c$.


  Un ejemplo cotidiano es el precio de entrada fijo a un cine, sin importar la película
  que se elija: $P(\text{película}) = 5000$, siempre el mismo valor.'
definiciones_clave: '- **Estudio de la función constante**: Elemento central en el
  estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a estudio de la función constante.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a estudio de la función
    constante.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a estudio de la función constante.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
