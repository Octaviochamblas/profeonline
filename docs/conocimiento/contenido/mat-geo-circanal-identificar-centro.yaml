procedimiento:
- 'Paso 1: Escribe la ecuación en la forma exacta (x-h)²+(y-k)²=r².'
- 'Paso 2: Si el término dentro del paréntesis tiene signo +, reescríbelo como resta
  de un número negativo.'
- 'Paso 3: Extrae h y k directamente de esa forma reescrita.'
