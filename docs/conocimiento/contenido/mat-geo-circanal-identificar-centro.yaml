semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.IDENTIFICAR_CENTRO
resumen_inicial: 'Identificación del centro de una circunferencia desde su forma canónica:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Aunque la fórmula general usa (x-h) y (y-k), en la práctica la
  ecuación puede aparecer con distintos signos, por lo que se debe tener cuidado al
  extraer h y k.
explicacion_formal: '![Identificación del centro](/static/img/geometria/analitica/circanal-identificar-centro.svg)


  ### Definición formal


  Si la ecuación es $(x-a)^2+(y-b)^2=r^2$, el centro es $(a,b)$. Si aparece como $(x+a)^2+(y-b)^2=r^2$,
  se reescribe como $(x-(-a))^2+(y-b)^2=r^2$, por lo que el centro es $(-a,b)$.


  ### Desarrollo didáctico


  Para $(x+2)^2+(y-1)^2=16$: reescribiendo, $(x-(-2))^2+(y-1)^2=16$, por lo que el
  centro es $(-2,1)$.'
