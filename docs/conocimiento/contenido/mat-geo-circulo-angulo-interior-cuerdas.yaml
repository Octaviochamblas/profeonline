- titulo: ¿Se cumple siempre la propiedad principal de medida de un ángulo interior
    formado por dos cuerdas que se intersectan dentro de la circunferencia en figuras
    congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede medida de un ángulo interior formado por dos cuerdas que se intersectan
    dentro de la circunferencia asumir un valor negativo cuando representa una longitud
    geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
