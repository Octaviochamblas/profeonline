procedimiento:
- 'Paso 1: Identifica las dos cuerdas que se intersectan y el punto de intersección
  interior.'
- 'Paso 2: Identifica los dos arcos que quedan ''enfrentados'' por el ángulo de interés
  y su opuesto por el vértice.'
- 'Paso 3: Suma ambos arcos y divide el resultado entre 2 para obtener la medida del
  ángulo.'
