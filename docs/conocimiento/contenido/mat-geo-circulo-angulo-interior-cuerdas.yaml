semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_INTERIOR_CUERDAS
resumen_inicial: 'Medida de un ángulo interior formado por dos cuerdas que se intersectan
  dentro de la circunferencia: conceptos, teoremas, propiedades geométricas y cálculo
  en Circunferencia y Círculo.'
explicacion_simple: Cuando dos cuerdas se cruzan dentro de un círculo, el ángulo que
  forman no es simplemente la mitad de un arco, sino el promedio de dos arcos opuestos.
explicacion_formal: '![Ángulo interior formado por dos cuerdas](/static/img/geometria/circunferencia-circulo/circulo-angulo-interior-cuerdas.svg)


  ### Definición formal


  Si dos cuerdas $AC$ y $BD$ de una circunferencia se intersectan en un punto interior
  $P$, la medida del ángulo $\angle APB$ (o su opuesto por el vértice $\angle CPD$)
  es igual a la semisuma de los arcos que dicho ángulo y su ángulo opuesto interceptan:
  $m(\angle APB)=\frac{m(\text{arco }AB)+m(\text{arco }CD)}{2}$.


  ### Desarrollo didáctico


  Si el arco $AB$ mide 70° y el arco $CD$ mide 50°, el ángulo formado entre las cuerdas
  en su punto de intersección mide $\frac{70°+50°}{2}=60°$. Este resultado se obtiene
  trazando una cuerda auxiliar y usando la propiedad del ángulo exterior de un triángulo
  junto con el teorema del ángulo inscrito.'
definiciones_clave: '- **Medida de un ángulo interior formado por dos cuerdas que
  se intersectan dentro de la circunferencia**: Elemento o propiedad fundamental en
  el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a medida de un ángulo interior formado por dos
  cuerdas que se intersectan dentro de la circunferencia.'
