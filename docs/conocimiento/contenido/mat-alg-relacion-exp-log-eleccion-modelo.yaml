semantic_id: MAT.ALG.RELACION_EXP_LOG.ELECCION_MODELO
resumen_inicial: 'Elección entre modelo exponencial y logarítmico según el contexto:
  conceptos, asíntotas, propiedades e inversidad en Relación de funciones inversas.'
explicacion_simple: 'Exponencial y logarítmica describen la misma relación entre dos
  variables, pero desde puntos de vista opuestos: la elección depende de qué magnitud
  se quiere calcular a partir de cuál otra.'
explicacion_formal: '### Definición formal


  Dada la relación $y=b^x$ entre dos variables, si el problema pide calcular $y$ conocido
  $x$, corresponde un modelo exponencial directo. Si el problema pide calcular $x$
  conocido $y$, corresponde despejar usando la función inversa, es decir, un modelo
  logarítmico $x=\log_b(y)$.


  ### Desarrollo didáctico


  Si un capital crece según $C(t)=1000\cdot1{,}05^t$ y se pregunta "¿cuánto dinero
  habrá en $5$ años?", se usa directamente el modelo exponencial evaluando $t=5$.
  Pero si se pregunta "¿en cuántos años el capital llegará a $2000$?", conviene despejar
  $t$ usando logaritmos: $t=\log_{1{,}05}(2)$.'
definiciones_clave: '- **Elección entre modelo exponencial y logarítmico según el
  contexto**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a elección entre modelo exponencial y logarítmico según el contexto.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de elección
    entre modelo exponencial y logarítmico según el contexto.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de elección entre modelo exponencial
    y logarítmico según el contexto.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
