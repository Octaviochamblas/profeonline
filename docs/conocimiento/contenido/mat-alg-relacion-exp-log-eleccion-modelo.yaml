semantic_id: MAT.ALG.RELACION_EXP_LOG.ELECCION_MODELO
resumen_inicial: 'La elección entre un modelo exponencial o logarítmico depende de la velocidad de variación: crecimiento o decaimiento acelerado exige el modelo exponencial; crecimiento o decaimiento desacelerado exige el modelo logarítmico.'
explicacion_simple: |
  Para saber cuál modelo usar ante un problema de la vida real, debemos observar cómo cambia la variable. Si el fenómeno descolla rápidamente y se dispara a una velocidad cada vez mayor (como una pandemia o el interés compuesto), elegimos el **modelo exponencial**. Si, por el contrario, el fenómeno empieza cambiando muy rápido pero luego se frena y se vuelve cada vez más lento (como el aprendizaje de un idioma, el crecimiento de estatura de un niño o la escala Richter), elegimos el **modelo logarítmico**.
explicacion_formal: |
  ### Definición formal
  La **discriminación analítica del tipo de modelamiento** para un conjunto de datos contextualizados $(x_k, y_k)$ se rige por el signo de la derivada segunda (concavidad) y la aceleración de la tasa de variación $\frac{\Delta y}{\Delta x}$:

  1. **Modelo Exponencial $y = a \cdot b^x + k$**:
     - **Criterio de tasa**: La razón entre diferencias o cocientes consecutivos de ordenadas es multiplicativamente constante para abscisas uniformes ($\frac{y_{k+1}}{y_k} = b$).
     - **Criterio de aceleración**: Presenta crecimiento de pendiente (acelerado, cóncavo hacia arriba $y'' > 0$ si $a > 0, b > 1$).
     - **Aplicaciones**: Poblaciones sin restricción, interés compuesto, decaimiento radiactivo.

  2. **Modelo Logarítmico $y = a \cdot \log_b(cx + d) + k$**:
     - **Criterio de tasa**: Las ordenadas aumentan de forma aritmética constante ($y_{k+1} - y_k = C$) únicamente cuando las abscisas se multiplican por un factor geométrico constante ($\frac{x_{k+1}}{x_k} = b$).
     - **Criterio de desaceleración**: Presenta disminución de pendiente (desacelerado, cóncavo hacia abajo $y'' < 0$ si $a > 0, b > 1$).
     - **Aplicaciones**: Escalas de compresión (Richter, dB, pH), curvas de aprendizaje, intensidad de estímulos sensoriales.

  ### Síntesis didáctica
  Matriz de Decisión Rápida:
  - ¿La variable dependiente explota o se desploma velozmente? $\implies$ **Exponencial**.
  - ¿La variable dependiente se aplana progresivamente acumulando cambios cada vez menores? $\implies$ **Logarítmico**.
definiciones_clave: |
  - **Criterio de aceleración (Exponencial)**: Variación caracterizada por cambios absolutos cada vez mayores por unidad de tiempo.
  - **Criterio de desaceleración (Logarítmico)**: Variación caracterizada por cambios absolutos cada vez menores por unidad de entrada.
  - **Discriminación por concavidad**: Identificación del modelo analizando si la curva dobla hacia arriba ($y'' > 0$) o hacia abajo ($y'' < 0$).
propiedades_relaciones: |
  - **Inversión de variables en problemas aplicados**: Si la variable tiempo $t$ está en el exponente para calcular la población final $P$, es un modelo exponencial $P(t) = P_0 2^t$. Si despejamos el tiempo necesario $t$ en función de la población $P$, la relación inversa pasa a ser un modelo logarítmico $t(P) = \log_2(P / P_0)$.
  - **Límites asintóticos**: El modelo exponencial posee asíntota horizontal (piso); el modelo logarítmico posee asíntota vertical (pared).
ejemplo_guiado:
  enunciado: 'Determina si cada una de las siguientes situaciones se debe modelar mediante una función exponencial o logarítmica justificando con criterios de velocidad de cambio: A) La cantidad de palabras memorizadas por un estudiante en función del tiempo de estudio, B) La cantidad de bacterias en un cultivo de laboratorio con alimento ilimitado, C) El tiempo en años requerido para que un capital se triplique a una tasa dada.'
  pasos:
    - 'Paso 1: Situación A (Palabras memorizadas): Al principio se memoriza muy rápido, pero con el tiempo se vuelve cada vez más difícil aprender nuevas palabras (desaceleración). Se debe usar un **modelo logarítmico**.'
    - 'Paso 2: Situación B (Bacterias): Con recursos ilimitados, cada bacteria se reproduce generando un crecimiento acelerado. Se debe usar un **modelo exponencial**.'
    - 'Paso 3: Situación C (Tiempo para triplicar capital): Estamos calculando la variable tiempo $t$ a partir del monto acumulado. Al ser el despeje de una potencia, corresponde a un **modelo logarítmico**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de modelo funcional se debe seleccionar para representar el crecimiento de la estatura de una persona desde su nacimiento hasta la adultez?'
    choices:
      - {text: 'Modelo logarítmico, porque el crecimiento es rápido en la infancia y se desacelera progresivamente hasta aplanarse en la adultez', is_correct: true}
      - {text: 'Modelo exponencial, porque la estatura explota hacia $+\infty$', is_correct: false}
      - {text: 'Modelo cuadrático, porque tiene un vértice en la infancia', is_correct: false}
      - {text: 'Modelo lineal de pendiente negativa', is_correct: false}
    explanation: 'La alternativa correcta es ''Modelo logarítmico, porque el crecimiento es rápido en la infancia y se desacelera progresivamente hasta aplanarse en la adultez''. Las funciones logarítmicas representan adecuadamente fenómenos de crecimiento desacelerado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un experimento registra que al duplicar la variable de entrada $x$, la variable de salida $y$ aumenta en una cantidad fija constante $+3$. ¿Qué tipo de relación matemática existe entre $x$ e $y$?'
    choices:
      - {text: 'Una relación logarítmica de la forma $y = a \cdot \log_2(x) + k$', is_correct: true}
      - {text: 'Una relación exponencial de la forma $y = a \cdot 2^x + k$', is_correct: false}
      - {text: 'Una relación proporcional directa lineal $y = 3x$', is_correct: false}
      - {text: 'Una relación cuadrática $y = x^2 + 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''Una relación logarítmica de la forma $y = a \cdot \log_2(x) + k$''. La propiedad de sumar una constante cuando la entrada se multiplica por un factor geométrico es la firma característica de la función logarítmica.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las variables de entrada ($x$) y salida ($y$) en la situación contextual.'
  - 'Paso 2: Analizar el comportamiento de variación: ¿la tasa de cambio se acelera o se desacelera?'
  - 'Paso 3: Si la tasa de cambio se acelera multiplicativamente, elegir el modelo exponencial $y = a \cdot b^x + k$.'
  - 'Paso 4: Si la tasa de cambio se desacelera aplanando la curva o comprime grandes escalas, elegir el modelo logarítmico $y = a \cdot \log_b(x) + k$.'
errores_correccion: |
  - **Error 1:** Elegir un modelo exponencial para representar procesos con saturación o desaceleración. **Cómo corregirlo:** Las funciones exponenciales de base $b > 1$ crecen aceleradamente hacia $+\infty$ sin frenar. Procesos con desaceleración o límites requieren modelos logarítmicos o logísticos.
  - **Error 2:** Confundir la variable independiente con la dependiente al seleccionar el modelo en problemas de despeje. **Cómo corregirlo:** Si se calcula el resultado final $y$ en función del tiempo exponente $t$, la relación directa es exponencial. Si se calcula el tiempo $t$ necesario para alcanzar un resultado $y$, la relación explícita es logarítmica.
ejemplos:
  - titulo: 'Modelo de propagación viral ilimitada'
    enunciado: '¿El contagio inicial de un virus sin vacunas se modela mediante una función exponencial?'
    alternativas:
      - 'Sí, por presentar un crecimiento acelerado'
      - 'No, es un modelo logarítmico'
      - 'No, es un modelo lineal'
    respuesta: 'Sí, por presentar un crecimiento acelerado'
    solucion_pasos:
      - '1. La tasa de contagio es proporcional al número de contagiados actual.'
      - '2. Muestra aceleración de pendiente $\implies$ Modelo exponencial.'
  - titulo: 'Modelo de curva de aprendizaje'
    enunciado: '¿La puntuación obtenida en un videojuego a medida que se acumulan horas de práctica sigue un modelo logarítmico?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Las primeras horas producen grandes mejoras, pero luego la tasa de avance se desacelera.'
  - titulo: 'Modelo de masa radiactiva remanente'
    enunciado: '¿La masa de una sustancia que se desintegra a la mitad cada 10 años es exponencial?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es un modelo exponencial de decaimiento $M(t) = M_0 (0.5)^{t/10}$.'
  - titulo: 'Modelo de brillo de estrellas (Magnitud aparente)'
    enunciado: '¿La escala de magnitud del brillo de las estrellas según su flujo luminoso es logarítmica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Comprime una enorme variedad de flujos luminosos en una escala numérica pequeña de magnitudes.'
errores_frecuentes:
  - 'El crecimiento de una población de bacterias con alimento ilimitado se representa mediante un modelo logarítmico.'
  - 'Una función logarítmica describe procesos donde la variable aumenta a una velocidad cada vez más rápida.'
  - 'Cualquier curva que suba hacia la derecha en un gráfico se debe clasificar como un modelo exponencial.'
  - 'El modelo exponencial es adecuado para representar el aprendizaje de un idioma donde la ganancia de vocabulario se vuelve cada vez más lenta.'
  - 'La elección entre modelo exponencial y logarítmico no depende del comportamiento físico de los datos sino únicamente de la base elegida.'
afirmaciones_verdaderas:
  - 'Los fenómenos con tasas de cambio multiplicativas aceleradas se representan con modelos exponenciales, mientras que los fenómenos con tasas de cambio desaceleradas o compresión de escalas se representan con modelos logarítmicos.'
  - 'En un mismo sistema físico, la relación directa entre el tiempo exponente y la cantidad final es exponencial, mientras que el despeje del tiempo en función de la cantidad final es una relación logarítmica.'
