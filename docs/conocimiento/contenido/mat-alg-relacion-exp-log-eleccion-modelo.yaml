procedimiento:
- 'Paso 1: Identifica cuál variable es la incógnita del problema: el resultado final
  o el tiempo/parámetro.'
- 'Paso 2: Si se pide el resultado final conociendo el tiempo, evalúa el modelo exponencial
  directamente.'
- 'Paso 3: Si se pide el tiempo o parámetro conociendo el resultado final, despeja
  usando logaritmos.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en elección
  entre modelo exponencial y logarítmico según el contexto.
ejemplos:
- titulo: Elección del modelo exponencial
  enunciado: Una bacteria se duplica cada hora según $N(t)=50\cdot2^t$. ¿Cuántas bacterias
    habrá en $4$ horas?
  solucion_pasos:
  - Se pide el resultado final conociendo el tiempo, así que se usa el modelo exponencial
    directamente.
  - Se evalúa $N(4)=50\cdot2^4=800$.
- titulo: Elección del modelo logarítmico
  enunciado: Con la misma población $N(t)=50\cdot2^t$, ¿en cuántas horas la población
    llegará a $3200$?
  solucion_pasos:
  - Se pide el tiempo conociendo el resultado final, así que se despeja usando logaritmos.
  - Se plantea $2^t=64$, así que $t=\log_2(64)=6$ horas.
- titulo: ¿Se necesita un logaritmo para calcular el valor final de un modelo exponencial?
  enunciado: ¿Es necesario usar logaritmos para calcular $N(4)$ en un modelo $N(t)=50\cdot2^t$?
  respuesta: 'No'
  solucion_pasos:
  - Basta con evaluar la potencia directamente, sin necesidad de despejar nada.
- titulo: ¿El modelo logarítmico y el exponencial describen relaciones distintas entre
    las variables?
  enunciado: ¿El modelo exponencial y el logarítmico usados en un mismo contexto describen
    relaciones matemáticas distintas entre las variables?
  respuesta: 'No'
  solucion_pasos:
  - Describen exactamente la misma relación, solo que despejada respecto a variables
    distintas.
errores_frecuentes:
- Usar logaritmos innecesariamente cuando basta con evaluar directamente la función
  exponencial.
- Intentar evaluar directamente cuando en realidad se necesita despejar el exponente
  con un logaritmo.
- Confundir cuál variable es la incógnita real del problema contextual.
- Olvidar interpretar el resultado final en las unidades correctas del contexto (tiempo,
  cantidad, etc.).
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando elección entre modelo exponencial y logarítmico según el contexto.
