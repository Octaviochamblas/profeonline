semantic_id: MAT.NUM.FRACCIONES_COMPARACION.UBICACION_RECTA
resumen_inicial: La ubicación de una fracción $\frac{a}{b}$ en la recta numérica se
  realiza dividiendo cada intervalo entero en $b$ partes iguales y avanzando $a$ unidades.
explicacion_simple: Para situar una fracción en la recta numérica, primero miramos
  el número de abajo (denominador) para saber en cuántas divisiones iguales cortar
  el espacio entre cada número entero. Luego, partiendo desde el cero, contamos hacia
  adelante o hacia atrás tantas divisiones como indique el número de arriba (numerador).
explicacion_formal: 'Sea la recta real orientada $\mathbb{R}$, la **Representación
  Geométrica de $\frac{a}{b}$** ubica el punto $P$ en la coordenada $x = \frac{a}{b}$
  mediante:


  $$x = C + \frac{r}{b} \quad \text{donde } a = b \cdot C + r \quad (0 \le r < b)$$


  **Desglose de la fórmula:**

  - $C \in \mathbb{Z}$: Marca del entero base a partir del cual se subdivide el segmento
  $[C, C+1]$.

  - $\frac{r}{b}$: Desplazamiento fraccionario exacto medido sobre las $b$ particiones
  del subintervalo.


  > **Complemento didáctico:** Las fracciones situadas más a la derecha en la recta
  numérica son siempre mayores que las ubicadas a su izquierda.'
definiciones_clave: '- **Ubicación en la recta numérica**: Posicionamiento geométrico
  exacto de un número racional sobre el eje cartesiano $X$.'
propiedades_relaciones: '- **Relación geométrica de orden**: Si la fracción $q_1$
  está a la izquierda de $q_2$ en la recta, entonces $q_1 < q_2$.'
ejemplo_guiado:
  enunciado: Ubique la fracción $\frac{7}{4}$ en la recta numérica.
  pasos:
  - 'Paso 1: Convertir la fracción impropia $\frac{7}{4}$ a número mixto: $7 : 4 =
    1$ con resto $3 \implies 1 \frac{3}{4}$.'
  - 'Paso 2: Identificar el intervalo entero donde se ubica: entre el $1$ y el $2$.'
  - 'Paso 3: Dividir el segmento entre $1$ y $2$ en $4$ partes iguales (cuartos).'
  - 'Paso 4: Contar $3$ marcas hacia la derecha a partir del $1$.'
  - 'Conclusión: El punto hallado es la ubicación exacta de $\frac{7}{4} = 1 \frac{3}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En cuántas partes iguales se debe dividir cada unidad entera de la recta
    para ubicar a/b?
  choices:
  - text: En b partes iguales (según lo indica el denominador)
    is_correct: true
  - text: En a partes iguales
    is_correct: false
  - text: En 10 partes siempre
    is_correct: false
  - text: No se divide
    is_correct: false
  explanation: La alternativa correcta es 'En b partes iguales (según lo indica el
    denominador)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7/4 = 1 3/4, ¿entre qué enteros se ubicó la
    fracción?
  choices:
  - text: Entre el 1 y el 2
    is_correct: true
  - text: Entre el 0 y el 1
    is_correct: false
  - text: Entre el 3 y el 4
    is_correct: false
  - text: Entre el -1 y el 0
    is_correct: false
  explanation: La alternativa correcta es 'Entre el 1 y el 2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si es una fracción impropia, convertirla a número mixto $C \frac{r}{b}$
  para localizar el intervalo $[C, C+1]$.'
- 'Paso 2: Subdividir dicho segmento unitario en $b$ partes congruentes de acuerdo
  al denominador.'
- 'Paso 3: Avanzar $r$ marcas hacia la derecha (o izquierda si es negativa) para situar
  el punto.'
errores_correccion: '- **Error 1: Dividir la unidad en la cantidad del numerador en
  vez del denominador.** **Cómo corregirlo:** El DENOMINADOR $b$ dicta en cuántas
  partes se divide el intervalo unitario.


  - **Error 2: Contar marcas hacia la derecha en fracciones negativas.** **Cómo corregirlo:**
  Las fracciones negativas se cuentan hacia la IZQUIERDA del cero.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Entre qué números enteros se ubica la fracción 2/5?
  alternativas:
  - Entre 0 y 1 (es fracción propia)
  - Entre 1 y 2
  - Entre 2 y 5
  respuesta: Entre 0 y 1 (es fracción propia)
  solucion_pasos:
  - Toda fracción propia positiva se ubica en el intervalo $(0, 1)$.
- titulo: Ejemplo 2
  enunciado: ¿Dónde se ubica -3/2 en la recta?
  alternativas:
  - Entre -1 y -2 (equivale a -1 1/2)
  - Entre 0 y 1
  - Entre 1 y 2
  respuesta: Entre -1 y -2 (equivale a -1 1/2)
  solucion_pasos:
  - $-3/2 = -1 \frac{1}{2}$, por lo que se ubica exactamente a la mitad entre -1 y
    -2.
- titulo: ¿Se ubican las fracciones mayores siempre a la derecha de las menores en
    la recta?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta numérica está orientada de menor a mayor hacia la derecha.
- titulo: ¿Se ubica 5/2 entre el 2 y el 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5/2 = 2 \frac{1}{2}$ está justo entre el 2 y el 3.
errores_frecuentes:
- Las fracciones propias positivas se posicionan en la recta a la derecha del número
  1.
- El número de subdivisiones en cada entero de la recta lo marca el numerador de la
  fracción.
- Las fracciones negativas se representan avanzando hacia la derecha desde el origen
  cero.
- Dos fracciones equivalentes se dibujan en dos posiciones totalmente distintas sobre
  la recta.
- Ubicar una fracción en la recta exige multiplicar los enteros por el valor 100.
afirmaciones_verdaderas:
- Ubicarse a la derecha en la recta numérica implica tener un valor estrictamente
  mayor.
- Para situar $\frac{a}{b}$, el intervalo unitario se divide en $b$ partes iguales
  y se cuentan $a$ partes desde la referencia.
al_terminar_debes_poder: Al terminar serás capaz de ubicar cualquier número racional
  o fracción en la recta numérica, subdividiendo la unidad en partes según el denominador
  y contando las posiciones según el numerador.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
