semantic_id: MAT.NUM.FRACCIONES_COMPARACION.UBICACION_RECTA
resumen_inicial: "Ubicar una fracción en la recta numérica consiste en dividir cada entero de la recta en tantas partes iguales como indica el denominador y avanzar tantas partes como indica el numerador."
explicacion_simple: |
  Para ubicar una fracción como $\frac{7}{4}$ en una recta numérica, imagina que estás caminando por una regla graduada. Como el denominador es 4, divides la distancia entre el 0 y el 1 en 4 pasitos iguales, entre el 1 y el 2 en otros 4 pasitos iguales, y así sucesivamente. Luego, partiendo desde el 0, das 7 pasitos de ese tamaño. Te darás cuenta de que pasas el 1 y te detienes justo a tres cuartos del camino hacia el 2 ($1\frac{3}{4}$). Toda fracción tiene un lugar geométrico único y exacto en la recta.
explicacion_formal: |
  Formalmente, toda fracción $\frac{a}{b} \in \mathbb{Q}$ (con $b \in \mathbb{Z}^+$ y $a \in \mathbb{Z}$) se asocia de manera biunívoca a un punto geométrico $P$ en la **recta numérica real orientada**.

  Geométricamente, para ubicar $\frac{a}{b}$:
  1. Se toma el intervalo unitario entre dos enteros consecutivos $[q, q+1]$, donde $q = \lfloor a/b \rfloor$.
  2. Se subdivide el segmento entero $[q, q+1]$ en $b$ subsegmentos congruentes de longitud $\frac{1}{b}$.
  3. El punto $P$ correspondiente a $\frac{a}{b}$ se localiza exactamente a una distancia de $a \cdot \left(\frac{1}{b}\right)$ del origen $0$ (hacia la derecha si $a > 0$ y hacia la izquierda si $a < 0$).
definiciones_clave: |
  - **Ubicación en la recta**: Representación geométrica de una fracción como coordenada continua en el eje real.
  - **Partición unitaria**: División del segmento entre dos enteros consecutivos en $b$ partes iguales.
  - **Coordenada racional**: Valor $x = \frac{a}{b}$ que determina la distancia orientada respecto al origen.
propiedades_relaciones: |
  - **Orden geométrico**: Si la fracción $x_1$ se ubica a la izquierda de $x_2$ en la recta numérica, entonces $x_1 < x_2$.
  - **Acotación por enteros**: Toda fracción no entera $\frac{a}{b}$ queda estrictamente contenida en un único intervalo entre dos enteros consecutivos $(\lfloor \frac{a}{b} \rfloor, \lfloor \frac{a}{b} \rfloor + 1)$.
  - **Fracciones equivalentes coinciden**: Todas las fracciones pertenecientes a la misma clase de equivalencia ($\frac{a}{b} = \frac{c}{d}$) corresponden exactamente al mismo punto en la recta.
ejemplo_guiado:
  enunciado: "Explica cómo ubicar la fracción $\\frac{11}{3}$ en la recta numérica, indica entre qué enteros se encuentra y exprésala como número mixto."
  pasos:
    - 'Dividir el numerador entre el denominador para hallar enteros completos: $11 \div 3 = 3$ con residuo $2$.'
    - "Expresar como número mixto: $\\frac{11}{3} = 3\\frac{2}{3}$."
    - "Identificar el intervalo entero: la fracción se ubica entre los enteros $3$ y $4$."
    - "Dividir el segmento $[3, 4]$ en $3$ partes iguales de tamaño $\\frac{1}{3}$."
    - "Avanzar $2$ partes desde el entero $3$: el punto exacto es la segunda marca sobre el segmento entre $3$ y $4$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Al ubicar la fracción propia $\\frac{5}{8}$ en la recta numérica, ¿entre qué par de enteros consecutivos quedará posicionada?"
    choices:
      - {text: "Entre el 0 y el 1, porque toda fracción propia positiva es estrictamente menor que 1.", is_correct: true}
      - {text: "Entre el 5 y el 8.", is_correct: false}
      - {text: "Entre el 1 y el 2.", is_correct: false}
      - {text: "A la izquierda del cero por ser una fracción.", is_correct: false}
    explanation: "La correcta es Entre el 0 y el 1, porque toda fracción propia positiva es estrictamente menor que 1.: al ser $5 < 8$, la coordenada cae dentro del intervalo $[0, 1]$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿En qué intervalo entero se ubica la fracción impropia $\\frac{19}{5}$ en la recta numérica?"
    choices:
      - {text: "Entre el 3 y el 4, porque $\\frac{19}{5} = 3\\frac{4}{5}$.", is_correct: true}
      - {text: "Entre el 4 y el 5.", is_correct: false}
      - {text: "Entre el 18 y el 20.", is_correct: false}
      - {text: "Entre el 1 y el 2.", is_correct: false}
    explanation: "La correcta es Entre el 3 y el 4, porque $\\frac{19}{5} = 3\\frac{4}{5}$.: $19 \\div 5 = 3$ con residuo $4$, ubicándose entre $3$ y $4$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Convertir la fracción impropia a número mixto $A\frac{b}{c}$ si $a > b$ (si $a < b$, la parte entera es $0$)."
  - "Paso 2: Localizar el entero inicial $A$ en la recta numérica."
  - "Paso 3: Subdividir el segmento entre $A$ y $A+1$ en $c$ partes iguales."
  - "Paso 4: Contar $b$ marcas a partir de $A$ hacia la derecha (o izquierda si es negativa) para marcar el punto exacto."
errores_correccion: |
  Un error frecuente es dividir el segmento entero entre las marcas numéricas en un número incorrecto de partes (por ejemplo, hacer $b$ líneas en vez de $b$ espacio entre líneas). Recuerda que **el denominador indica la cantidad de espacios iguales**, no la cantidad de rayitas dibujadas.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Entre qué enteros consecutivos se ubica la fracción $\\frac{9}{2}$?"
    alternativas:
      - "Entre el 4 y el 5, porque $\\frac{9}{2} = 4\\frac{1}{2}$."
      - "Entre el 9 y el 2."
      - "Entre el 2 y el 3."
    respuesta: "Entre el 4 y el 5, porque $\\frac{9}{2} = 4\\frac{1}{2}$."
    solucion_pasos:
      - "Convertimos a número mixto: $9 \\div 2 = 4$ con residuo $1 \\implies 4\\frac{1}{2}$."
      - "Por lo tanto se encuentra exactamente en la mitad del intervalo entre el 4 y el 5."
  - titulo: "Ejemplo 2"
    enunciado: "Si ubicas en la recta las fracciones $A = \\frac{1}{3}$, $B = \\frac{5}{3}$ y $C = \\frac{4}{3}$, ¿cuál es el orden correcto de izquierda a derecha?"
    alternativas:
      - "A, C, B (pues $\\frac{1}{3} < \\frac{4}{3} < \\frac{5}{3}$)."
      - "B, C, A."
      - "C, A, B."
    respuesta: "A, C, B (pues $\\frac{1}{3} < \\frac{4}{3} < \\frac{5}{3}$)."
    solucion_pasos:
      - "Como tienen igual denominador 3, comparamos numeradores: $1 < 4 < 5$."
      - "De izquierda a derecha en la recta aparecen en el orden $A = \\frac{1}{3}$, $C = \\frac{4}{3}$, $B = \\frac{5}{3}$."
  - titulo: "¿Se ubican las fracciones negativas a la izquierda del cero en la recta numérica?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, el sentido de la recta orientada ubica todos los números reales negativos a la izquierda del origen cero."
  - titulo: "¿Dos fracciones equivalentes se ubican exactamente en el mismo punto de la recta numérica?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, al tener el mismo valor numérico, comparten exactamente la misma coordenada geométrica."
errores_frecuentes:
  - "Confundir la cantidad de divisiones del segmento con el número de líneas dibujadas."
  - "Ubicar fracciones impropias en el intervalo $[0, 1]$ olvidando extraer enteros completados."
  - "Avanzar en sentido contrario al representar fracciones negativas."
  - "Dividir el segmento entero en partes desiguales."
  - "Creer que entre dos enteros solo puede colocarse una única fracción."
afirmaciones_verdaderas:
  - "Toda fracción tiene un lugar geométrico único y bien definido en la recta numérica real."
  - "Si una fracción $x$ se ubica a la izquierda de la fracción $y$ en la recta numérica, entonces $x < y$."
al_terminar_debes_ponder: |
  Debes ser capaz de ubicar cualquier fracción en la recta numérica, determinar entre qué dos enteros se encuentra e interpretar la relación de orden geométrico.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
