semantic_id: MAT.GEO.TEOREMA_COSENOS.ENUNCIADO
resumen_inicial: 'Enunciado del teorema del coseno: a² = b² + c² − 2bc·cos(A): conceptos,
  teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'El teorema de Pitágoras solo funciona en triángulos rectángulos.
  Para relacionar los lados de un triángulo cualquiera, sin ángulo recto, se necesita
  una herramienta más general: el teorema del coseno.'
explicacion_formal: '![Enunciado del teorema del coseno](/static/img/geometria/areas-pitagoras/cosenos-enunciado.svg)


  ### Definición formal


  Para un triángulo de lados $a$, $b$, $c$, con $A$ el ángulo opuesto al lado $a$:
  $a^2=b^2+c^2-2bc\cos(A)$. Existen fórmulas análogas para $b^2$ y $c^2$, cambiando
  el ángulo correspondiente.


  ### Desarrollo didáctico


  Si el ángulo A mide 90°, entonces cos(90°)=0, y la fórmula se reduce exactamente
  a $a^2=b^2+c^2$, el teorema de Pitágoras. Esto muestra que el teorema del coseno
  es una generalización: Pitágoras es un caso particular cuando el ángulo es recto.'
definiciones_clave: '- **Enunciado del teorema del coseno: a² = b² + c² − 2bc·cos(A)**:
  Elemento o propiedad fundamental en el estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a enunciado del teorema del coseno: a² = b²
  + c² − 2bc·cos(a).'
ejemplo_guiado:
