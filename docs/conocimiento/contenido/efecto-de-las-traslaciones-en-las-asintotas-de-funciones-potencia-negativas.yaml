semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.EFECTO_ASINTOTAS_TRASLADAS
resumen_inicial: 'El efecto de las traslaciones en funciones potencia con exponente negativo $g(x) = \frac{a}{(x - h)^k} + k_v$ desplaza rígidamente el sistema de asíntotas ortogonales a la asíntota vertical $\mathcal{A}_V: x = h$ y a la asíntota horizontal $\mathcal{A}_H: y = k_v$, actualizando el dominio a $\operatorname{Dom}(g) = \mathbb{R} \setminus \{h\}$.'
explicacion_simple: "![El efecto de las traslaciones en funciones potencia con exponente negativo $g(x) = \\frac{a}{(x - h)^k} + k_v$ desplaza rígidamente el sistema de asíntotas ortogonales a la asíntota vertical $\\mathcal{A}_V: x = h$ y a la asíntota horizontal $\\mathcal{A}_H: y = k_v$, actualizando el dominio a $\\operatorname{Dom}(g) = \\mathbb{R} \\setminus \\{h\\}$](/static/img/nodos/efecto-de-las-traslaciones-en-las-asintotas-de-funciones-potencia-negativas-intro.svg)\n\n\nLas funciones con exponentes negativos (como $\\frac{1}{x}$ o $\\frac{1}{x^2}$) tienen originalmente dos asíntotas en los ejes coordenados: vertical en $x = 0$ y horizontal en $y = 0$.\n\nCuando trasladas la función a $g(x) = \\frac{a}{(x - \\mathbf{h})^k} + \\mathbf{k_v}$:\n\n- **La Asíntota Vertical SE MUEVE a $x = \\mathbf{h}$:**\n  - El denominador se anula en $x - h = 0 \\implies x = h$.\n  - El dominio queda perforado en $h$: **$\\operatorname{Dom} = \\mathbb{R} \\setminus \\{h\\}$**.\n- **La Asíntota Horizontal\
  \ SE MUEVE a $y = \\mathbf{k_v}$:**\n  - Cuando $x \\to \\pm\\infty$, la fracción tiende a cero y solo sobrevive $k_v$.\n  - La recta horizontal límite pasa a ser **$y = k_v$**.\n- **Centro asintótico:** La cruz de las dos asíntotas se intersecta en el punto **$(h, k_v)$**."
explicacion_formal: "Sea $f(x) = \\frac{a}{x^k}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$, cuyas asíntotas canónicas son $\\mathcal{A}_V: x = 0$ y $\\mathcal{A}_H: y = 0$.\nLa aplicación de la traslación $\\mathcal{T}_{(h, k_v)}$ genera $g(x) = \\frac{a}{(x - h)^k} + k_v$.\n\n**Análisis de los nuevos límites asintóticos**:\n1. **Asíntota vertical**:\n   $$\\lim_{x \\to h^\\pm} g(x) = \\lim_{x \\to h^\\pm} \\left(\\frac{a}{(x - h)^k} + k_v\\right) = \\pm\\infty \\implies \\mathcal{A}_V: x = h$$\n   Imponiendo $\\operatorname{Dom}(g) = \\mathbb{R} \\setminus \\{h\\}$.\n2. **Asíntota horizontal**:\n   $$\\lim_{x \\to \\pm\\infty} g(x) = \\lim_{x \\to \\pm\\infty} \\frac{a}{(x - h)^k} + k_v = 0 + k_v = k_v \\implies \\mathcal{A}_H: y = k_v$$\n3. **Recorrido trasladado**:\n   - Para $k$ impar: $\\operatorname{Rec}(g) = \\mathbb{R} \\setminus \\{k_v\\}$.\n   - Para $k$ par con $a > 0$: $\\operatorname{Rec}(g) = ]k_v, +\\infty[$.\n   - Para $k$ par con $a < 0$: $\\operatorname{Rec}(g)\
  \ = ]-\\infty, k_v[$."
definiciones_clave: '- **Centro asintótico**: Punto de intersección $(h, k_v)$ entre las rectas asíntotas $\mathcal{A}_V$ y $\mathcal{A}_H$.

  - **Dominio y recorrido desplazados**: Exclusión de $x = h$ en el dominio e inalcanzabilidad de $y = k_v$ en el recorrido.'
propiedades_relaciones: '- **Isometría del sistema asintótico**: El ángulo recto de 90° entre la asíntota vertical y horizontal se conserva rígidamente en $(h, k_v)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El efecto de las traslaciones en funciones potencia con exponente negativo $g(x) = \frac{a}{(x - h)^k} + k_v$ desplaza rígidamente el sistema de asíntotas ortogonales a la asíntota vertical $\mathcal{A}_V: x = h$ y a la asíntota horizontal $\mathcal{A}_H: y = k_v$, actualizando el dominio a $\operatorname{Dom}(g) = \mathbb{R} \setminus \{h\}$](/static/img/nodos/efecto-de-las-traslaciones-en-las-asintotas-de-funciones-potencia-negativas-ejemplos.svg)



    Determina las ecuaciones de las asíntotas, el centro asintótico, el dominio y el recorrido de:

    1) $f(x) = \frac{4}{x - 3} + 5$

    2) $g(x) = \frac{1}{(x + 2)^2} - 1$'
  pasos:
  - 'Paso 1: Para $f(x) = \frac{4}{x - 3} + 5$ (impar):

    - Asíntota vertical: $x - 3 = 0 \implies$ **$\mathcal{A}_V: x = 3$**.

    - Asíntota horizontal: **$\mathcal{A}_H: y = 5$**.

    - Centro asintótico: **$(3, 5)$**.

    - **$\operatorname{Dom}(f) = \mathbb{R} \setminus \{3\}$** y **$\operatorname{Rec}(f) = \mathbb{R} \setminus \{5\}$**.'
  - 'Paso 2: Para $g(x) = \frac{1}{(x + 2)^2} - 1$ (par):

    - Asíntota vertical: $x + 2 = 0 \implies$ **$\mathcal{A}_V: x = -2$**.

    - Asíntota horizontal: **$\mathcal{A}_H: y = -1$**.

    - Centro asintótico: **$(-2, -1)$**.

    - **$\operatorname{Dom}(g) = \mathbb{R} \setminus \{-2\}$** y **$\operatorname{Rec}(g) = ]-1, +\infty[$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las asíntotas de la función $f(x) = \frac{2}{(x - 5)^3} + 8$?
  choices:
  - text: Asíntota vertical x = 5 y asíntota horizontal y = 8
    is_correct: true
  - text: Asíntota vertical x = -5 y asíntota horizontal y = 8
    is_correct: false
  - text: Asíntota vertical x = 8 y asíntota horizontal y = 5
    is_correct: false
  - text: Asíntota vertical x = 0 y asíntota horizontal y = 0
    is_correct: false
  explanation: La alternativa correcta es 'Asíntota vertical x = 5 y asíntota horizontal y = 8'. El polo está en $x = 5$ y el límite en el infinito es $y = 8$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el dominio de la función trasladada $g(x) = -\frac{3}{(x + 7)^2} + 4$?
  choices:
  - text: ℝ \ {-7}
    is_correct: true
  - text: ℝ \ {7}
    is_correct: false
  - text: ℝ \ {4}
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es 'ℝ \ {-7}'. El denominador se anula en $x + 7 = 0 \implies x = -7$, valor que debe excluirse del dominio.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar a cero el binomio del denominador $x - h = 0$ para obtener la asíntota vertical $\mathcal{A}_V: x = h$.'
- 'Paso 2: Identificar la constante exterior $k_v$ para obtener la asíntota horizontal $\mathcal{A}_H: y = k_v$.'
- 'Paso 3: Excluir $x = h$ del dominio: $\operatorname{Dom} = \mathbb{R} \setminus \{h\}$.'
- 'Paso 4: Trazar las ramas de la hipérbola o volcán tomando como nuevo origen de referencia el punto $(h, k_v)$.'
errores_correccion: '- **Error común:** Mantener la asíntota vertical en $x = 0$ cuando la función está trasladada a $\frac{1}{x - 3}$.

  - **Cómo corregirlo:** La asíntota vertical **se mueve junto con el denominador**: en $\frac{1}{x - 3}$, la nueva asíntota vertical es **$x = 3$**.'
ejemplos:
- titulo: 'Ejemplo 1: Asíntota vertical trasladada'
  enunciado: 'La asíntota vertical de $f(x) = \frac{1}{x - 10} + 2$ es:'
  alternativas:
  - x = 10
  - x = -10
  - y = 2
  - x = 0
  respuesta: x = 10
  solucion_pasos:
  - 'Paso 1: $x - 10 = 0 \implies x = 10$.'
- titulo: 'Ejemplo 2: Asíntota horizontal trasladada'
  enunciado: 'La asíntota horizontal de $g(x) = \frac{-5}{(x + 1)^4} - 7$ es:'
  alternativas:
  - y = -7
  - y = 7
  - x = -1
  - y = 0
  respuesta: y = -7
  solucion_pasos:
  - 'Paso 1: Límite en infinito es $k_v = -7 \implies y = -7$.'
- titulo: 'Ejemplo 3: Dominio excluido'
  enunciado: 'El dominio de $y = \frac{8}{x + 6} - 3$ es:'
  alternativas:
  - R \ {-6}
  - R \ {6}
  - R \ {-3}
  - R
  respuesta: R \ {-6}
  solucion_pasos:
  - 'Paso 1: $x + 6 = 0 \implies x = -6 \implies \operatorname{Dom} = \mathbb{R} \setminus \{-6\}$.'
- titulo: 'Ejemplo 4: Centro asintótico'
  enunciado: ¿En qué punto se cruzan las asíntotas de $y = \frac{1}{(x - 4)^2} + 9$?
  alternativas:
  - (4, 9)
  - (-4, 9)
  - (4, -9)
  - (0, 0)
  respuesta: (4, 9)
  solucion_pasos:
  - 'Paso 1: $(h, k_v) = (4, 9)$.'
errores_frecuentes:
- No trasladar la asíntota vertical x = h.
- Confundir la ecuación de la asíntota vertical con la horizontal.
- Olvidar ajustar el dominio y recorrido excluyendo los valores asintóticos.
afirmaciones_verdaderas:
- Las traslaciones desplazan las asíntotas a las rectas x = h e y = kv.
- El dominio de la función potencia negativa trasladada es ℝ \ {h}.
al_terminar_debes_poder: '**QUÉ:** Determinar el efecto de las traslaciones en las asíntotas de potencias negativas.


  **CÓMO:** Formulando las nuevas asíntotas x = h e y = kv y actualizando Dom(g) = ℝ \ {h}.


