semantic_id: MAT.ALG.SISTEMAS_2X2.VERIFICACION_SOLUCION
resumen_inicial: La verificación de la solución de un sistema 2x2 consiste en comprobar mediante sustitución directa que el par ordenado $(x, y)$ satisface ambas ecuaciones simultáneamente.
explicacion_simple: |
  Para confirmar con certeza que el par de valores $(x, y)$ calculado es la solución verdadera de un sistema $2 \times 2$, efectuamos un procedimiento de **doble verificación**.

  Sustituimos $x$ e $y$ en el primer miembro de la primera ecuación y confirmamos que el resultado sea numéricamente idéntico al término constante del segundo miembro.

  A continuación, sustituimos $x$ e $y$ en la segunda ecuación y confirmamos que también se satisfaga esa igualdad. Solo si ambas igualdades resultan ser verdaderas, la solución queda validada.
explicacion_formal: |
  ### Definición formal
  Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$ y la solución candidata $(x_0, y_0)$, el **algoritmo de verificación estricta** requiere comprobar las igualdades:

  $$\text{Comprobación 1: } a_1 x_0 + b_1 y_0 = c_1 \quad \text{y} \quad \text{Comprobación 2: } a_2 x_0 + b_2 y_0 = c_2$$

  $$\text{Si ambos enunciados resultan verdaderos } \implies (x_0, y_0) \in \text{Conjunto Solución}$$

  ### Desglose de la fórmula
  - $a_1 x_0 + b_1 y_0 = c_1$: Evaluación numérica directa de la primera relación.
  - $a_2 x_0 + b_2 y_0 = c_2$: Evaluación numérica directa de la segunda relación.

  ### Síntesis didáctica
  Probar el par ordenado en ambas ecuaciones previene aceptar respuestas con errores de signos o de cálculo cometidos durante la resolución.
definiciones_clave: |
  - **Doble verificación**: Procedimiento de sustitución obligatoria del par ordenado $(x, y)$ en las dos ecuaciones del sistema.
  - **Satisfecho simultáneo**: Condición matemática en la que el par sustituido convierte a las dos oraciones algebraicas en identidades numéricas.
propiedades_relaciones: |
  - **Detección de errores operativos**: Un par numérico invalida el sistema si genera una contradicción en cualquiera de las dos ecuaciones.
  - **Invariancia al método utilizado**: La verificación por sustitución funciona como control independiente independientemente de si se usó reducción, igualación o sustitución.
ejemplo_guiado:
  enunciado: 'Verifica si el par ordenado $(x, y) = (4, 1)$ es la solución correcta para el sistema $\begin{cases} 3x - 2y = 10 \\ x + 4y = 8 \end{cases}$.'
  pasos:
    - 'Paso 1: Evaluar el par $(4, 1)$ en la primera ecuación: $3(4) - 2(1) = 12 - 2 = 10$ (se verifica la igualdad $10 = 10$).'
    - 'Paso 2: Evaluar el par $(4, 1)$ en la segunda ecuación: $4 + 4(1) = 4 + 4 = 8$ (se verifica la igualdad $8 = 8$).'
    - 'Paso 3: Concluir que el par $(4, 1)$ es la solución verificada del sistema por cumplir simultáneamente ambas ecuaciones.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué es obligatorio verificar la solución candidata en AMBAS ecuaciones de un sistema $2 \times 2$?'
    choices:
      - {text: 'Porque un par ordenado puede satisfacer la primera ecuación pero romper la igualdad de la segunda.', is_correct: true}
      - {text: 'Porque la primera ecuación no afecta la validez del sistema.', is_correct: false}
      - {text: 'Porque los sistemas de ecuaciones solo aceptan coordenadas enteras positivas.', is_correct: false}
      - {text: 'Porque el término constante del segundo miembro debe ser cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque un par ordenado puede satisfacer la primera ecuación pero romper la igualdad de la segunda.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al sustituir el par $(4, 1)$ en la segunda ecuación $x + 4y = 8$, ¿cuál es el resultado numérico del primer miembro?'
    choices:
      - {text: '$8$', is_correct: true}
      - {text: '$10$', is_correct: false}
      - {text: '$12$', is_correct: false}
      - {text: '$4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$8$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar el par ordenado candidato $(x_0, y_0)$ obtenido tras el despeje.'
  - 'Paso 2: Sustituir $x_0$ e $y_0$ en la primera ecuación del sistema original y calcular el valor del primer miembro.'
  - 'Paso 3: Verificar que el resultado numérico sea idéntico al término constante del segundo miembro de la primera ecuación.'
  - 'Paso 4: Sustituir $x_0$ e $y_0$ en la segunda ecuación del sistema y repetir la evaluación.'
  - 'Paso 5: Declarar la validez absoluta de la solución si y solo si ambas comprobaciones resultan ser ciertas.'
errores_correccion: |
  - **Error 1:** Sustituir la solución únicamente en una de las dos ecuaciones y dar por concluida la verificación. **Cómo corregirlo:** La comprobación de un sistema **DEBE EJECUTARSE OBLIGATORIAMENTE EN LAS DOS ECUACIONES DEL SISTEMA**.
  - **Error 2:** Realizar la verificación sustituyendo en una ecuación manipulada en lugar de las ecuaciones del sistema original. **Cómo corregirlo:** Para detectar errores de transposición, **LA COMPROBACIÓN DEBE HACERSE SIEMPRE SOBRE EL SISTEMA ENUNCIADO ORIGINALMENTE**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Verifica si $(2, 3)$ es solución del sistema $\begin{cases} 2x + y = 7 \\ x - y = -1 \end{cases}$.'
    alternativas:
      - 'Sí, verifica ambas igualdades ($7 = 7$ y $-1 = -1$)'
      - 'No, solo verifica la primera'
      - 'No, solo verifica la segunda'
    respuesta: 'Sí, verifica ambas igualdades ($7 = 7$ y $-1 = -1$)'
    solucion_pasos:
      - '1. Ecuación 1: $2(2) + 3 = 4 + 3 = 7$ (Verdad).'
      - '2. Ecuación 2: $2 - 3 = -1$ (Verdad).'
  - titulo: 'Ejemplo 2'
    enunciado: 'Evalúa el par $(5, 0)$ en el sistema $\begin{cases} x + 2y = 5 \\ 3x - y = 10 \end{cases}$.'
    alternativas:
      - 'No es solución pues la segunda ecuación resulta $15 \neq 10$'
      - 'Sí es la solución del sistema'
      - 'Ambas ecuaciones resultan falsas'
    respuesta: 'No es solución pues la segunda ecuación resulta $15 \neq 10$'
    solucion_pasos:
      - '1. Ecuación 1: $5 + 2(0) = 5$ (Verdad).'
      - '2. Ecuación 2: $3(5) - 0 = 15 \neq 10$ (Falso).'
  - titulo: 'Importancia de la verificación'
    enunciado: '¿La verificación por sustitución directa permite detectar si cometiste un error de signos al despejar?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, expondrá inmediatamente cualquier contradicción numérica.'
  - titulo: 'Ecuaciones originales'
    enunciado: '¿La comprobación debe efectuarse sobre las ecuaciones originales escritas en el enunciado?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, previene arrastrar posibles errores de amplificación o despeje.'
errores_frecuentes:
  - 'El par ordenado $(x, y) = (4, 1)$ se declara como solución verificada del sistema tras sustituirlo únicamente en la primera ecuación $3x - 2y = 10$.'
  - 'La verificación de la solución $(x, y) = (4, 1)$ se realiza sustituyendo en una ecuación manipulada en lugar de las ecuaciones del sistema original.'
  - 'Al verificar el par ordenado $(4, 1)$ en $3x - 2y = 10$, los signos se invierten evaluando $3(4) + 2(1) = 14 \neq 10$.'
  - 'La sustitución de un par candidato en el sistema que arroja una igualdad falsa como $15 = 10$ se acepta como una solución aproximada válida.'
  - 'La verificación de la solución de un sistema $2 \times 2$ consiste únicamente en comprobar que la suma de sus coordenadas sea positiva.'
afirmaciones_verdaderas:
  - 'La verificación por sustitución exige que el par ordenado $(x,y)$ transforme ambas ecuaciones en identidades numéricas.'
  - 'Probar una solución en el sistema original es la forma definitiva de validar la corrección del cálculo algebraico.'
al_terminar_debes_poder: |
  QUÉ: Verificar la exactitud de la solución de un sistema de ecuaciones lineales 2x2.
  CÓMO: Sustituir las coordenadas $(x_0, y_0)$ en las dos ecuaciones originales y confirmar numéricamente el cumplimiento de las dos igualdades.
