semantic_id: MAT.ALG.SISTEMAS_2X2.VERIFICACION_SOLUCION
resumen_inicial: La verificación de un sistema 2x2 prueba que el par ordenado $(x,
  y)$ satisface ambas ecuaciones simultáneamente.
explicacion_simple: 'Para comprobar que las respuestas $(x, y)$ que obtuviste son
  100% correctas, realizamos una **doble verificación**:

  Reemplazamos $x$ e $y$ en la primera ecuación y confirmamos que se cumple la igualdad.

  Luego, reemplazamos $x$ e $y$ en la segunda ecuación y confirmamos que también se
  cumple.

  Si se cumplen ambas igualdades, la solución está garantizada.'
explicacion_formal: 'Dado el sistema $\begin{cases} A_1(x, y) = c_1 \\ A_2(x, y) =
  c_2 \end{cases}$ y la solución $(x_0, y_0)$, el **algoritmo de comprobación estricta**
  exige comprobar:


  $$\text{Comprobar 1: } A_1(x_0, y_0) = c_1$$

  $$\text{Comprobar 2: } A_2(x_0, y_0) = c_2$$


  $$\text{Si ambas son verdaderas } \implies (x_0, y_0) \in \operatorname{CS}$$'
definiciones_clave: '- **Doble verificación**: Comprobación obligatoria de una solución
  propuesta en las dos ecuaciones del sistema.'
propiedades_relaciones: '- **Detección de errores**: Evita errores por signos o transposición
  cometidos durante la resolución por reducción, sustitución o igualación.'
ejemplo_guiado:
  enunciado: Verifica si el par ordenado $(x, y) = (4, 1)$ es la solución correcta
    para el sistema $\begin{cases} 3x - 2y = 10 \\ x + 4y = 8 \end{cases}$.
  pasos:
  - 'Paso 1: Evaluar el par $(4, 1)$ en la primera ecuación: $3(4) - 2(1) = 12 - 2
    = 10$ (se verifica $10 = 10$).Paso 2: Evaluar el par $(4, 1)$ en la segunda ecuación:
    $4 + 4(1) = 4 + 4 = 8$ (se verifica $8 = 8$).Paso 3: Concluir que el par $(4,
    1)$ es la solución verificada del sistema.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es obligatorio verificar la solución en AMBAS ecuaciones de un
    sistema 2x2?
  choices:
  - text: Porque una solución puede satisfacer una ecuación pero violar la otra.
    is_correct: true
  - text: Porque la primera ecuación no influye en la respuesta.
    is_correct: false
  - text: Porque los sistemas 2x2 solo admiten soluciones enteras.
    is_correct: false
  - text: Porque el segundo miembro siempre debe dar cero.
    is_correct: false
  explanation: La alternativa correcta es 'Porque una solución puede satisfacer una
    ecuación pero violar la otra.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al verificar el par $(4, 1)$ en la segunda ecuación $x + 4y = 8$, ¿cuál
    es el resultado obtenido?
  choices:
  - text: $8$
    is_correct: true
  - text: $10$
    is_correct: false
  - text: $12$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$8$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar el par ordenado candidato $(x_0, y_0)$.'
- 'Paso 2: Sustituir $x_0$ e $y_0$ en el primer miembro de la primera ecuación y comprobar
  que iguale al primer término constante.'
- 'Paso 3: Sustituir $x_0$ e $y_0$ en el primer miembro de la segunda ecuación y comprobar
  que iguale al segundo término constante.'
- 'Paso 4: Validar la solución si ambas igualdades son verdaderas.'
errores_correccion: '- **Error común:** Probar la solución en una sola ecuación y
  dar el trabajo por terminado.

  - **Cómo corregirlo:** Prueba SIEMPRE el par ordenado en LAS DOS ECUACIONES.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
