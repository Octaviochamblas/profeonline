semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CALCULO
resumen_inicial: El cálculo algebraico de la función inversa consiste en escribir $y = f(x)$, despejar la variable $x$ en términos de $y$, e intercambiar las variables para obtener $f^{-1}(x)$.
explicacion_simple: '![El cálculo algebraico de la función inversa consiste en escribir $y = f(x)$, despejar la variable $x$ en términos de $y$, e intercambiar las variables para obtener $f^{-1}(x)$](/static/img/nodos/calculo-algebraico-de-la-funcion-inversa-intro.svg)



  Para encontrar la fórmula de la función inversa paso a paso:

  1. **Paso 1:** Cambias $f(x)$ por la letra $y$ (escribes $y = \text{fórmula}$).

  2. **Paso 2:** Despejas la letra $x$ completamente usando operaciones inversas.

  3. **Paso 3:** Intercambias las letras: donde dice $x$ pones $f^{-1}(x)$, y donde dice $y$ pones $x$.


  Por ejemplo, para $f(x) = 2x + 6$:

  $y = 2x + 6 \implies y - 6 = 2x \implies x = \frac{y - 6}{2} \implies f^{-1}(x) = \frac{x - 6}{2}$.'
explicacion_formal: 'Dada una función biyectiva $f: A \to B$ con regla de correspondencia $y = f(x)$, el cálculo de la expresión analítica de $f^{-1}: B \to A$ sigue el **algoritmo de transposición de variables**:

  1. **Ecuación explícita inicial**: $y = f(x)$.

  2. **Aislamiento de la preimagen**: $x = f^{-1}(y) = g(y)$.

  3. **Relabeling estándar**: Intercambio formal de variables mudas $(x \leftrightarrow y)$ para expresar la función en la variable independiente convencional $x$:

  $$f^{-1}(x) = g(x)$$


  **Casos canónicos:**

  - **Función afín**: $f(x) = mx + n \implies f^{-1}(x) = \frac{x - n}{m} = \frac{1}{m}x - \frac{n}{m}$.

  - **Función homográfica racional**: $f(x) = \frac{ax + b}{cx + d} \implies f^{-1}(x) = \frac{-dx + b}{cx - a}$.'
definiciones_clave: '- **Algoritmo de inversión**: Procedimiento algebraico estructurado de despeje y cambio de variables.

  - **Variable muda**: Símbolo algebraico que representa la entrada independiente de la función.'
propiedades_relaciones: '- **Pendiente recíproca**: La pendiente de la inversa de una función afín es el inverso multiplicativo de la pendiente original: $m_{\text{inv}} = \frac{1}{m}$.

  - **Inversión de operaciones**: Multiplicaciones se vuelven divisiones y sumas se vuelven restas en orden jerárquico invertido.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo algebraico de la función inversa consiste en escribir $y = f(x)$, despejar la variable $x$ en términos de $y$, e intercambiar las variables para obtener $f^{-1}(x)$](/static/img/nodos/calculo-algebraico-de-la-funcion-inversa-ejemplos.svg)



    Calcula la función inversa de $f(x) = \frac{3x - 5}{2}$ y evalúa $f^{-1}(8)$.'
  pasos:
  - 'Paso 1: Escribir la ecuación con $y$: $y = \frac{3x - 5}{2}$.'
  - 'Paso 2: Multiplicar por 2 a ambos lados: $2y = 3x - 5$.'
  - 'Paso 3: Sumar 5: $2y + 5 = 3x$.'
  - 'Paso 4: Dividir por 3: $x = \frac{2y + 5}{3}$.'
  - 'Paso 5: Intercambiar variables: $f^{-1}(x) = \frac{2x + 5}{3}$.'
  - 'Paso 6: Evaluar en $x = 8$: $f^{-1}(8) = \frac{2(8) + 5}{3} = \frac{16 + 5}{3} = \frac{21}{3} = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la función inversa de $f(x) = 4x - 12$?
  choices:
  - text: f^(-1)(x) = (x + 12)/4
    is_correct: true
  - text: f^(-1)(x) = (x - 12)/4
    is_correct: false
  - text: f^(-1)(x) = 1/(4x - 12)
    is_correct: false
  - text: f^(-1)(x) = -4x + 12
    is_correct: false
  explanation: La alternativa correcta es 'f^(-1)(x) = (x + 12)/4'. $y = 4x - 12 \implies y + 12 = 4x \implies x = \frac{y + 12}{4}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $f(x) = mx + n$ con $m \neq 0$, ¿cuál es la pendiente de su función inversa $f^{-1}(x)$?
  choices:
  - text: 1/m
    is_correct: true
  - text: -m
    is_correct: false
  - text: -1/m
    is_correct: false
  - text: m
    is_correct: false
  explanation: La alternativa correcta es '1/m'. En $f^{-1}(x) = \frac{1}{m}x - \frac{n}{m}$, el coeficiente de $x$ es $\frac{1}{m}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sustituir $f(x)$ por $y$ en la fórmula dada.'
- 'Paso 2: Despejar algebraicamente la variable $x$ aplicando las operaciones inversas respetando la jerarquía.'
- 'Paso 3: Intercambiar las letras $x$ e $y$.'
- 'Paso 4: Escribir la respuesta final como $f^{-1}(x)$ y especificar su dominio si corresponde.'
errores_correccion: '- **Error común:** Escribir la inversa simplemente invirtiendo la fracción como $f^{-1}(x) = \frac{1}{2x + 6}$.

  - **Cómo corregirlo:** La inversa se obtiene **despejando la variable $x$**, no calculando el recíproco algebraico de la expresión.'
ejemplos:
- titulo: 'Ejemplo 1: Función lineal'
  enunciado: ¿Cuál es la función inversa de $f(x) = 5x$?
  alternativas:
  - f^(-1)(x) = x/5
  - f^(-1)(x) = 5/x
  - f^(-1)(x) = -5x
  - f^(-1)(x) = x - 5
  respuesta: f^(-1)(x) = x/5
  solucion_pasos:
  - 'Paso 1: $y = 5x \implies x = \frac{y}{5} \implies f^{-1}(x) = \frac{x}{5}$.'
- titulo: 'Ejemplo 2: Función con pendiente negativa'
  enunciado: Halla la inversa de $g(x) = 10 - 2x$.
  alternativas:
  - g^(-1)(x) = (10 - x)/2
  - g^(-1)(x) = (x - 10)/2
  - g^(-1)(x) = -2x + 10
  - g^(-1)(x) = 2x - 10
  respuesta: g^(-1)(x) = (10 - x)/2
  solucion_pasos:
  - 'Paso 1: $y = 10 - 2x \implies 2x = 10 - y \implies x = \frac{10 - y}{2} \implies g^{-1}(x) = \frac{10 - x}{2}$.'
- titulo: 'Ejemplo 3: Función cúbica'
  enunciado: Determina la inversa de $h(x) = x^3 + 8$.
  alternativas:
  - h^(-1)(x) = cuberoot(x - 8)
  - h^(-1)(x) = cuberoot(x) - 8
  - h^(-1)(x) = (x - 8)^3
  - h^(-1)(x) = cuberoot(x + 8)
  respuesta: h^(-1)(x) = cuberoot(x - 8)
  solucion_pasos:
  - 'Paso 1: $y = x^3 + 8 \implies x^3 = y - 8 \implies x = \sqrt[3]{y - 8} \implies h^{-1}(x) = \sqrt[3]{x - 8}$.'
- titulo: 'Ejemplo 4: Fracción algebraica simple'
  enunciado: Calcula la inversa de $f(x) = \frac{x + 3}{x - 1}$ para $x \neq 1$.
  alternativas:
  - f^(-1)(x) = (x + 3)/(x - 1)
  - f^(-1)(x) = (x - 1)/(x + 3)
  - f^(-1)(x) = (3x + 1)/(x - 1)
  - f^(-1)(x) = (x - 3)/(x + 1)
  respuesta: f^(-1)(x) = (x + 3)/(x - 1)
  solucion_pasos:
  - 'Paso 1: $y(x - 1) = x + 3 \implies yx - y = x + 3 \implies x(y - 1) = y + 3 \implies x = \frac{y + 3}{y - 1} \implies f^{-1}(x) = \frac{x + 3}{x - 1}$ (autoinversa).'
errores_frecuentes:
- Calcular el recíproco 1/f(x) en lugar de despejar.
- Cometer errores de signo en el despeje de la incógnita x.
- Olvidar hacer el cambio de variables al final.
afirmaciones_verdaderas:
- Para obtener la función inversa se despeja x en términos de y y se intercambian las variables.
- La inversa de una función afín con pendiente m tiene pendiente 1/m.
al_terminar_debes_poder: '**QUÉ:** Calcular y simplificar algebraicamente la fórmula de la función inversa f^(-1)(x).


  **CÓMO:** Despejando rigurosamente la preimagen x a partir de la ecuación y = f(x) e intercambiando las variables.


