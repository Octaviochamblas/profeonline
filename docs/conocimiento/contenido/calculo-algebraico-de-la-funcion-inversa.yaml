semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CALCULO
resumen_inicial: El cálculo algebraico de la función inversa consiste en despejar la variable independiente $x$ en función de $y$ y luego intercambiar las variables.
explicacion_simple: |
  Para hallar la fórmula de la **función inversa $f^{-1}(x)$**:

  1. Escribes la función como $y = f(x)$.
  2. Despejas la letra **$x$** paso a paso hasta dejarla sola a un lado del igual.
  3. Intercambias de posición las variables: donde dice $x$ pones $y$, y donde dice $y$ pones $x$.
  4. La $y$ despejada final es tu **$f^{-1}(x)$**.
explicacion_formal: |
  Sea $f: A \to B$ una función biyectiva dada por $y = f(x)$. Para determinar la expresión explícita de $f^{-1}: B \to A$:

  1. **Aislamiento de la preimagen**: Se resuelve la ecuación $y = f(x)$ para la variable $x$ en términos de $y$:
     $$x = f^{-1}(y)$$
  2. **Relabeling de variables**: Se transponen los símbolos $x \leftrightarrow y$ obteniendo la regla explícita $y = f^{-1}(x)$.

  **Ejemplo analítico afín:**
  $$y = mx + b \implies y - b = mx \implies x = \frac{y - b}{m} \implies f^{-1}(x) = \frac{x - b}{m}$$
definiciones_clave: |
  - **Cálculo de función inversa**: Algoritmo algebraico para obtener la expresión funcional inversa $f^{-1}(x)$ mediante despeje e intercambio de variables.
propiedades_relaciones: |
  - **Inversión de dominio y recorrido**: El dominio de $f^{-1}$ equivale al recorrido de $f$ ($\text{Dom}(f^{-1}) = \text{Rec}(f)$), y el recorrido de $f^{-1}$ equivale al dominio de $f$ ($\text{Rec}(f^{-1}) = \text{Dom}(f)$).
ejemplo_guiado:
  enunciado: "Encuentra la función inversa de $f(x) = 3x - 5$ declarando su dominio."
  pasos:
    - 'Paso 1: Escribir como ecuación de dos variables: $y = 3x - 5$.'
    - 'Paso 2: Sumar $5$ a ambos lados: $y + 5 = 3x$.'
    - 'Paso 3: Dividir entre $3$: $x = \frac{y + 5}{3}$.'
    - 'Paso 4: Intercambiar las variables $x$ e $y$: $y = \frac{x + 5}{3} \implies f^{-1}(x) = \frac{x + 5}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la función inversa de $f(x) = 3x - 5$?"
    choices:
      - {text: "$f^{-1}(x) = \\frac{x + 5}{3}$", is_correct: true}
      - {text: "$f^{-1}(x) = \\frac{x - 5}{3}$", is_correct: false}
      - {text: "$f^{-1}(x) = 5x - 3$", is_correct: false}
      - {text: "$f^{-1}(x) = -3x + 5$", is_correct: false}
    explanation: "La alternativa correcta es '$f^{-1}(x) = \\frac{x + 5}{3}$'. $y = 3x - 5 \\implies x = \\frac{y + 5}{3} \\implies f^{-1}(x) = \\frac{x + 5}{3}$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si $f(x) = 2x + 8$, ¿cuál es su función inversa $f^{-1}(x)$?"
    choices:
      - {text: "$f^{-1}(x) = \\frac{x - 8}{2}$", is_correct: true}
      - {text: "$f^{-1}(x) = \\frac{x + 8}{2}$", is_correct: false}
      - {text: "$f^{-1}(x) = -2x - 8$", is_correct: false}
      - {text: "$f^{-1}(x) = 8x + 2$", is_correct: false}
    explanation: "La alternativa correcta es '$f^{-1}(x) = \\frac{x - 8}{2}$'. $y = 2x + 8 \\implies x = \\frac{y - 8}{2} \\implies f^{-1}(x) = \\frac{x - 8}{2}$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reemplazar $f(x)$ por el símbolo $y$.'
  - 'Paso 2: Realizar transposiciones de términos hasta despejar completamente la variable $x$.'
  - 'Paso 3: Intercambiar formalmente los roles de $x$ e $y$.'
  - 'Paso 4: Escribir la respuesta como $f^{-1}(x)$ especificando las restricciones del dominio si las hay.'
errores_correccion: |
  - **Error común:** Confundir la función inversa $f^{-1}(x)$ con el recíproco o inverso multiplicativo $\frac{1}{f(x)}$.
  - **Cómo corregirlo:** La notación $f^{-1}(x)$ indica **INVERSIÓN DE LA REGLA FUNCIONAL**, no la división $\frac{1}{f(x)}$.
