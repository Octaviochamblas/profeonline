semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CALCULO
resumen_inicial: El cálculo algebraico de $f^{-1}(x)$ consiste en escribir $y = f(x)$,
  despejar la variable $x$ en función de $y$ e intercambiar las letras $x$ e $y$.
explicacion_simple: 'Para encontrar la fórmula de la función inversa $f^{-1}(x)$ paso
  a paso:

  1. Escribimos la función como $y = \text{fórmula}$ (ejemplo: $y = 5x - 3$).

  2. Despejamos algebraicamente la letra $x$: $y + 3 = 5x \implies x = \frac{y + 3}{5}$.

  3. Intercambiamos las letras ($x$ pasa a ser $y$, e $y$ pasa a ser $x$): $y = \frac{x
  + 3}{5}$.

  4. Escribimos el resultado final: $f^{-1}(x) = \frac{x + 3}{5}$.'
explicacion_formal: 'Dada la función invertible $y = f(x)$, la **metodología de despeje
  inverso** es:


  $$y = f(x) \implies x = f^{-1}(y) \xrightarrow{\text{intercambio de variables}}
  y = f^{-1}(x)$$


  **Desglose de la fórmula:**

  - Algoritmo algebraico de tres pasos: igualación a $y$, despeje explícito de la
  preimagen $x$, e intercambio de roles de variables.'
definiciones_clave: '- **Algoritmo de despeje inverso**: Procedimiento algebraico
  para hallar la fórmula explícita de $f^{-1}(x)$.'
propiedades_relaciones: '- **Inversa de función afín**: La inversa de la función afín
  $f(x) = m x + n$ es siempre otra función afín $f^{-1}(x) = \frac{x - n}{m}$.'
ejemplo_guiado:
  enunciado: Halla la función inversa $f^{-1}(x)$ para la función afín $f(x) = 3x
    + 12$.
  pasos:
  - 'Paso 1: Escribir la ecuación con $y$: $y = 3x + 12$.Paso 2: Trasponer el $12$
    restando: $y - 12 = 3x$.Paso 3: Despejar $x$ dividiendo entre $3$: $x = \frac{y
    - 12}{3}$.Paso 4: Intercambiar las variables $x \leftrightarrow y$: $y = \frac{x
    - 12}{3}$.Paso 5: Escribir la respuesta final: $f^{-1}(x) = \frac{x - 12}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar el algoritmo de despeje a la función $f(x) = 3x + 12$, ¿cuál
    es su función inversa $f^{-1}(x)$?
  choices:
  - text: $f^{-1}(x) = \frac{x - 12}{3}$
    is_correct: true
  - text: $f^{-1}(x) = \frac{x + 12}{3}$
    is_correct: false
  - text: $f^{-1}(x) = 3x - 12$
    is_correct: false
  - text: $f^{-1}(x) = \frac{1}{3x + 12}$
    is_correct: false
  explanation: La alternativa correcta es '$f^{-1}(x) = \frac{x - 12}{3}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al despejar $x$ en la ecuación $y = 3x + 12$, ¿qué expresión equivalente
    se obtiene para $x$?
  choices:
  - text: $x = \frac{y - 12}{3}$
    is_correct: true
  - text: $x = 3y - 12$
    is_correct: false
  - text: $x = \frac{y + 12}{3}$
    is_correct: false
  - text: $x = y - 4$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{y - 12}{3}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sustituir $f(x)$ por la variable $y$.'
- 'Paso 2: Realizar las trasposiciones algebraicas necesarias para aislar la variable
  $x$.'
- 'Paso 3: Cambiar cada $x$ por $f^{-1}(x)$ y cada $y$ por $x$.'
- 'Paso 4: Simplificar la expresión resultante.'
errores_correccion: '- **Error común:** Olvidar intercambiar las variables $x$ e $y$
  al final del despeje.

  - **Cómo corregirlo:** La función inversa $f^{-1}(x)$ debe expresarse en términos
  de la variable de entrada estándar $x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
