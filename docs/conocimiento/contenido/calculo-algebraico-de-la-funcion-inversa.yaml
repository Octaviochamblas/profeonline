errores_frecuentes:
  - 'La función inversa de $f(x) = 3x - 5$ se obtiene calculando el recíproco multiplicativo $f^{-1}(x) = \frac{1}{3x - 5}$.'
  - 'Al despejar la inversa de $y = 2x + 8$, se obtiene la recta $f^{-1}(x) = -2x - 8$.'
  - 'El dominio de la función inversa $f^{-1}(x)$ es siempre exactamente igual al dominio de la función original $f(x)$.'
  - 'Despejar la variable $x$ en la expresión $y = f(x)$ altera la continuidad de la función en todo su dominio.'
  - 'Cualquier función polinómica cuadrática posee una única función inversa global sin necesidad de acotar su dominio.'
afirmaciones_verdaderas:
  - 'El procedimiento algebraico para determinar $f^{-1}(x)$ requiere aislar la preimagen $x$ en la ecuación $y = f(x)$ e intercambiar las variables.'
  - 'El dominio de la función inversa $f^{-1}$ coincide con el recorrido de la función original $f$, y su recorrido coincide con el dominio de $f$.'
al_terminar_debes_poder: |
  QUÉ: Determinar algebraicamente la expresión explícita de la función inversa $f^{-1}(x)$.
  CÓMO: Despejar $x$ en $y = f(x)$, intercambiar variables $x \leftrightarrow y$ y verificar las restricciones de dominio y recorrido.
