semantic_id: MAT.GEO.POLIGONOS_BASE.SUMA_ANGULOS_INTERIORES
resumen_inicial: 'Cálculo de la suma de ángulos interiores de un polígono convexo
  mediante 180°(n - 2): conceptos, teoremas, propiedades geométricas y cálculo en
  Polígonos y Cuadriláteros.'
explicacion_simple: Así como los ángulos internos de un triángulo siempre suman 180°,
  existe una fórmula general que permite calcular la suma de los ángulos internos
  de cualquier polígono convexo.
explicacion_formal: '![Suma de ángulos interiores de un polígono](/static/img/geometria/poligonos-cuadrilateros/poligonos-suma-angulos-interiores.svg)


  ### Definición formal


  La suma de los ángulos interiores de un polígono convexo de $n$ lados es $S=180°\times(n-2)$.
  Esta fórmula surge de dividir el polígono en $(n-2)$ triángulos trazando diagonales
  desde un solo vértice.


  ### Desarrollo didáctico


  Un pentágono ($n=5$) tiene suma de ángulos interiores $180°\times(5-2)=180°\times3=540°$.
  Esto se puede verificar dividiendo el pentágono en 3 triángulos desde un vértice,
  cada uno con 180°: $3\times180°=540°$.'
definiciones_clave: '- **Cálculo de la suma de ángulos interiores de un polígono convexo
