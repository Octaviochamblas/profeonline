semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.DEFINICION_RAYOS
resumen_inicial: Un ángulo es la región del plano formada por dos rayos que comparten
  un punto inicial común llamado vértice; constituye el concepto base para medir rotaciones
  y aberturas en geometría.
explicacion_simple: Imagina las dos agujas de un reloj conectadas en el centro. Cada
  aguja apunta en una dirección y representa un rayo que nace en el centro. La abertura
  que se forma entre ambas agujas cuando se separan es lo que llamamos un ángulo.
  Si los rayos no parten del mismo punto central, no forman un ángulo.
explicacion_formal: 'Formalmente, se define un ángulo como la unión de dos rayos $\vec{OA}$
  y $\vec{OB}$ que tienen el mismo punto de origen $O$.


  $$\angle AOB = \vec{OA} \cup \vec{OB}$$


  - El punto $O$ se denomina **vértice** del ángulo.

  - Los rayos $\vec{OA}$ y $\vec{OB}$ se denominan **lados** del ángulo.

  - La medida del ángulo representa la cantidad de rotación necesaria para hacer coincidir
  el rayo inicial $\vec{OA}$ con el rayo final $\vec{OB}$.'
definiciones_clave: '- **Rayo**: Parte de una recta que tiene un punto de origen determinado
  y se extiende infinitamente en una dirección.

  - **Vértice**: Punto de origen común donde se intersectan o nacen los dos rayos
  que forman el ángulo.

  - **Lados del ángulo**: Cada uno de los dos rayos que delimitan la abertura del
  ángulo.

  '
propiedades_relaciones: '- **Condición de existencia**: Para que exista un ángulo,
  los dos rayos deben compartir obligatoriamente el mismo punto de origen (vértice).

  - **Independencia de la longitud**: La medida de un ángulo depende únicamente de
  la abertura entre sus rayos, no de la longitud con la que se dibujen los rayos (ya
  que estos son infinitos).

  '
ejemplo_guiado:
  enunciado: Un faro en la costa emite dos haces de luz rectilíneos desde su centro
    $O(0,0)$. El primer haz pasa por el punto $A(5,0)$ sobre la costa y el segundo
    por una boya en $B(0,4)$. Explica por qué los rayos $\vec{OA}$ y $\vec{OB}$ forman
    un ángulo y calcula su medida.
  pasos:
  - 'Paso 1: Verificar que ambos haces nacen en el mismo punto de origen $O(0,0)$,
    cumpliendo la definición de ángulo como unión de dos rayos $\vec{OA} \cup \vec{OB}$.'
  - 'Paso 2: Observar las coordenadas: el rayo $\vec{OA}$ está sobre el eje $X$ positivo
    y $\vec{OB}$ sobre el eje $Y$ positivo.'
  - 'Paso 3: Concluir que los dos rayos forman un ángulo recto de $90^\circ$ exactamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué elementos forman los lados de un ángulo según su definición geométrica
    formal?
  choices:
  - text: Dos rayos que comparten un mismo punto de origen común
    is_correct: true
  - text: Dos segmentos de longitud finita y paralelos entre sí
    is_correct: false
  - text: Dos rectas infinitas que nunca se cruzan en el plano
    is_correct: false
  - text: Tres puntos colineales ordenados en el plano cartesiano
    is_correct: false
  explanation: La alternativa correcta es 'Dos rayos que comparten un mismo punto
    de origen común', ya que por definición los lados de un ángulo son dos rayos con
    vértice común.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué los haces de luz del faro forman un ángulo en el punto O?
  choices:
  - text: Porque son dos rayos que comparten un mismo punto de origen O
    is_correct: true
  - text: Porque son dos rectas paralelas que nunca se cruzan
    is_correct: false
  - text: Porque se extienden en la misma dirección y sentido
    is_correct: false
  - text: Porque son segmentos de longitud finita terminados en puntos
    is_correct: false
  explanation: La alternativa correcta es 'Porque son dos rayos que comparten un mismo
    punto de origen O'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el punto de origen común (vértice) de ambos rayos.'
- 'Paso 2: Verificar que los dos rayos se extiendan desde ese vértice en distintas
  direcciones.'
- 'Paso 3: Medir o calcular la abertura rotacional entre el rayo inicial y el rayo
  final.'
errores_correccion: 'Evita pensar que la longitud del dibujo de los rayos afecta la
  medida del ángulo: los rayos son infinitos y la medida depende únicamente de su
  abertura.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Considera los rayos $\vec{OP}$ y $\vec{OQ}$. Si el rayo $\vec{OP}$ apunta
    hacia el Este ($0^\circ$) y el rayo $\vec{OQ}$ apunta hacia el Norte ($90^\circ$),
    ¿cuál es la medida del ángulo $\angle POQ$ formado?
  alternativas:
  - $90^\circ$
  - $45^\circ$
  - $180^\circ$
  respuesta: $90^\circ$
  solucion_pasos:
  - La dirección Este corresponde al ángulo $0^\circ$ y la dirección Norte a $90^\circ$.
  - La diferencia entre ambas direcciones es $90^\circ - 0^\circ = 90^\circ$.
  - Por lo tanto, los dos rayos con vértice en $O$ forman un ángulo de $90^\circ$
    (ángulo recto).
- titulo: Ejemplo 2
  enunciado: Si dos rayos $\vec{OA}$ y $\vec{BC}$ se dibujan en el plano pero no comparten
    ningún punto en común, ¿forman directamente un ángulo con vértice único?
  alternativas:
  - No, porque no comparten un punto de origen común (vértice).
  - Sí, cualquier par de rayos en el plano forma un ángulo.
  - Sí, siempre que sus longitudes dibujadas sean iguales.
  respuesta: No, porque no comparten un punto de origen común (vértice).
  solucion_pasos:
  - Por definición, un ángulo requiere que ambos rayos nazcan del mismo punto de origen.
  - Dado que $\vec{OA}$ nace en $O$ y $\vec{BC}$ nace en $B$ ($O \neq B$), no comparten
    vértice.
  - Por lo tanto, no constituyen un ángulo según su definición geométrica.
- titulo: ¿Dos rayos con el mismo origen que se extienden en direcciones exactamente
    opuestas forman un ángulo de $180^\circ$?
  respuesta: Sí
  solucion_pasos:
  - Cuando dos rayos opuestos parten del mismo origen $O$, forman una línea recta
    continua.
  - La abertura entre ambos rayos opuestos es de $180^\circ$, conocido como ángulo
    extendido o llano.
- titulo: ¿Si extendemos la representación gráfica de los rayos a 10 cm más de largo,
    cambia la medida del ángulo?
  respuesta: 'No'
  solucion_pasos:
  - Los rayos son infinitos por definición geométrica.
  - La medida del ángulo representa la abertura rotacional entre las direcciones de
    los rayos, no la longitud del trazo en el papel.
errores_frecuentes:
- Afirmar que si los rayos se dibujan más largos en el papel, el ángulo mide más.
- Declarar que dos segmentos sin origen común forman un ángulo sin necesidad de prolongarlos
  hasta cortarse.
- Declarar el vértice (punto de origen) con uno de los puntos sobre los lados del
  ángulo.
- Declarar que el ángulo cambia de medida si se gira la figura completa en el plano.
- Declarar un rayo (semirrecta con origen) con un segmento de recta delimitado en
  ambos extremos.
afirmaciones_verdaderas:
- El vértice de un ángulo es el punto de origen común desde el cual emergen ambos
  rayos.
- La medida de un ángulo depende exclusivamente de la abertura entre sus rayos y no
  del tamaño del gráfico.
al_terminar_debes_poder: Al finalizar este recurso podrás definir con precisión un
  ángulo como la unión de dos rayos con origen común, identificar su vértice y sus
  lados, y determinar su medida sabiendo que la extensión gráfica de los rayos no
  altera la abertura.
