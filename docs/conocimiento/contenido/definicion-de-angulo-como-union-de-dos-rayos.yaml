semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.DEFINICION_RAYOS
resumen_inicial: Un ángulo es la región del plano formada por dos rayos que comparten
  un punto inicial común llamado vértice; constituye el concepto base para medir rotaciones
  y aberturas en geometría.
explicacion_simple: '![Definición de Ángulo como Unión de dos Rayos](/static/img/nodos/definicion-de-angulo-como-union-de-dos-rayos-intro.svg)


  Imagina las dos agujas de un reloj conectadas en el centro. Cada aguja apunta en
  una dirección y representa un rayo que nace en el centro. La abertura que se forma
  entre ambas agujas cuando se separan es lo que llamamos un ángulo. Si los rayos
  no parten del mismo punto central, no forman un ángulo.'
explicacion_formal: '### Definición formal

  En el plano euclidiano $\mathbb{R}^2$, dados un punto $O$ y dos puntos distintos
  $A, B \neq O$, se define el **ángulo** $\angle AOB$ como el conjunto formado por
  la unión de dos rayos o semirrectas $\vec{OA}$ y $\vec{OB}$ que comparten el punto
  de origen común $O$:


  $$\angle AOB = \vec{OA} \cup \vec{OB}$$


  ### Desglose simbólico y geométrico

  - $O$: Punto de origen común donde concurren los rayos, denominado **vértice** del
  ángulo.

  - $\vec{OA}, \vec{OB}$: Rayos generadores o semirrectas infinitas en un sentido,
  denominados **lados** del ángulo.

  - $\angle AOB$: Notación formal del ángulo con la letra central indicando unívocamente
  el vértice.

  - $\mu(\angle AOB) \in [0^\circ, 360^\circ]$: Medida angular continua que cuantifica
  la rotación de un lado respecto al otro.


  ### Síntesis didáctica

  La definición de ángulo como unión conjuntista de rayos formaliza rigurosamente
  la noción de abertura geométrica en el plano, garantizando que la medida angular
  sea una propiedad intrínseca e independiente de la longitud representada de los
  lados.'
definiciones_clave: '- **Rayo**: Parte de una recta que tiene un punto de origen determinado
  y se extiende infinitamente en una dirección.

  - **Vértice**: Punto de origen común donde se intersectan o nacen los dos rayos
  que forman el ángulo.

  - **Lados del ángulo**: Cada uno de los dos rayos que delimitan la abertura del
  ángulo. '
propiedades_relaciones: '- **Condición de existencia**: Para que exista un ángulo,
  los dos rayos deben compartir obligatoriamente el mismo punto de origen (vértice).

  - **Independencia de la longitud**: La medida de un ángulo depende únicamente de
  la abertura entre sus rayos, no de la longitud con la que se dibujen los rayos (ya
  que estos son infinitos). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Definición de Ángulo por Rayos](/static/img/nodos/definicion-de-angulo-como-union-de-dos-rayos-ejemplos.svg)


    Un faro en la costa emite dos haces de luz rectilíneos desde su centro $O(0,0)$.
    El primer haz pasa por el punto $A(5,0)$ sobre la costa y el segundo por una boya
    en $B(0,4)$. Explica por qué los rayos $\vec{OA}$ y $\vec{OB}$ forman un ángulo
    y calcula su medida.'
  pasos:
  - 'Paso 1: Verificar que ambos haces nacen en el mismo punto de origen $O(0,0)$,
    cumpliendo la definición de ángulo como unión de dos rayos $\vec{OA} \cup \vec{OB}$.'
  - 'Paso 2: Observar las coordenadas: el rayo $\vec{OA}$ está sobre el eje $X$ positivo
    y $\vec{OB}$ sobre el eje $Y$ positivo.'
  - 'Paso 3: Concluir que los dos rayos forman un ángulo recto de $90^\circ$ exactamente.'
