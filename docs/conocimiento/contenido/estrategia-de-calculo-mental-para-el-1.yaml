procedimiento:
- 'Paso 1: Dividir la cantidad $N$ entre $100$ eliminando dos ceros o corriendo la
  coma 2 lugares a la izquierda para hallar el $1\%$.'
- 'Paso 2: Multiplicar el valor del $1\%$ por el número de unidades porcentuales requeridas
  ($k\% = k \cdot 1\%$).'
- 'Paso 3: Para porcentajes con medio punto ($0,5\%$), dividir el valor del $1\%$
  entre $2$.'
- 'Paso 4: Para porcentajes compuestos (ej: $13\%$), descomponer en $10\% + 3 \cdot
  (1\%)$.'
errores_correccion: '- **Error 1:** Quitar solo un cero en vez de dos (ej: calcular
  el $1\%$ de $5.000$ como $500$ en lugar de $50$). **Cómo corregirlo:** El $1\%$
  divide entre 100, por lo que **SIEMPRE se quitan 2 ceros o se corren 2 lugares:
  $N \div 100$**.

  - **Error 2:** Olvidar que en números sin ceros finales, se corren dos posiciones
  decimales ($1\%$ de $75$ es $0,75$).

  '
ejemplos:
- titulo: Cálculo del 1% con coma decimal
  enunciado: ¿Cuál es el $1\%$ de $350$?
  alternativas:
  - $3,5$
  - $35$
  - $0,35$
  - $3500$
  respuesta: $3,5$
  solucion_pasos:
  - '1. Dividimos entre 100: $350 \div 100 = 3,5$.'
  - 2. Corremos la coma dos lugares a la izquierda.
- titulo: Cálculo del 3% mental
  enunciado: ¿El $3\%$ de $\$50.000$ es igual a $\$1.500$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $1\% = $\$500$ \implies 3\% = 3 \cdot 500 = $\$1.50$0$.
- titulo: Cálculo del 0,5% mental
  enunciado: ¿El $0,5\%$ de $\$6.000$ es igual a $\$30$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $1\% = $\$60$ \implies 0,5\% = 60 / 2 = $\$3$0$.
- titulo: Cálculo combinado (10% + 1%)
  enunciado: ¿El $11\%$ de $\$40.000$ es igual a $\$4.400$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $10\% = 4.000$, $1\% = 400 \implies 11\% = 4.000 + 400 = $\$4.40$0$.
errores_frecuentes:
- Eliminar un solo cero en lugar de dos al calcular el 1%.
- Confundir el 1% (dividir entre 100) con el 10% (dividir entre 10).
- No dividir entre 2 al calcular el 0,5% desde el 1%.
afirmaciones_verdaderas:
- El 1% de cualquier número se calcula dividiendo entre 100 (desplazando la coma 2
  posiciones a la izquierda).
- Cualquier porcentaje entero k% se obtiene multiplicando k por el valor del 1%.
al_terminar_debes_poder: '![Resumen de estrategia de cálculo mental para el 1%](/static/img/nodos/estrategia-de-calculo-mental-para-el-1-resumen.svg)


  QUÉ: Calcular mentalmente el $1\%$ de cualquier cantidad y deducir tasas arbitrarias
  enteras, decimales o compuestas.

  CÓMO: Dividiendo entre 100 ($1\% = N \div 100$) y aplicando multiplicaciones por
  unidades o descomposiciones aditivas ($k\% = k \cdot 1\%$, $0,5\% = 1\% \div 2$,
  $12\% = 10\% + 2 \cdot 1\%$).

  '
