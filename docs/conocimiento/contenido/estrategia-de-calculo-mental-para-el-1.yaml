semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_UNO
resumen_inicial: 'Estrategia de cálculo mental para el 1%: concepto y propiedades
  fundamentales en Porcentajes.'
explicacion_simple: Así como el 10% es tu herramienta para porcentajes grandes, saber
  aislar el 1% te permite calcular cirujías exactas como un 3% o un 7% sin escribir
  una sola fórmula.
explicacion_formal: 'El **$1\%$** equivale a la fracción $1/100$.


  **Regla de oro del 1%:**

  Para calcular el 1% de un número, mueve su punto decimal **dos posiciones a la izquierda**.

  - El 1% de 600 es 6.

  - El 1% de 45 es 0.45.


  Una vez que conoces el valor de la unidad porcentual básica (el 1%), calcular porcentajes
  precisos como el $3\%$ es simplemente multiplicar ese valor base por 3.

  - **$4\%$ de 300**: El 1% es 3. Multiplico $3 \cdot 4 = 12$.'
definiciones_clave: '- **Estrategia de cálculo mental para el 1%**: Elemento central
  dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
