semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_UNO
resumen_inicial: La estrategia de cálculo mental para el $1\%$ consiste en dividir
  la cantidad entre 100 (eliminando dos ceros finales o desplazando la coma decimal
  dos lugares a la izquierda), sirviendo de base para calcular $2\%$, $3\%$, $4\%$
  y porcentajes compuestos.
explicacion_simple: '![Estrategia de cálculo mental para el 1%](/static/img/nodos/estrategia-de-calculo-mental-para-el-1-intro.svg)


  El $1\%$ es la unidad porcentual básica. Para calcular el $1\%$ de cualquier número,
  simplemente **divides entre $100$** (si termina en dos ceros, los quitas; si no,
  corres la coma dos lugares a la izquierda). Por ejemplo, el $1\%$ de $\$80.000$
  es $\$800$, y el $1\%$ de $450$ es $4,5$. Sabiendo el $1\%$, calcular el $3\%$ es
  tan simple como multiplicar ese resultado por $3$: $3 \cdot 800 = $\$2.40$0$.

  '
explicacion_formal: '### Operador unitario centesimal

  Dado $N \in \mathbb{R}^+$, el operador del $1\%$ está definido por la división centesimal:

  $$1\%(N) = \frac{1}{100} \cdot N = \frac{N}{100} = N \cdot 10^{-2}$$


  ### Derivación de tasas enteras y decimales

  Conociendo el valor unitario $u_1 = 1\%(N) = \frac{N}{100}$:

  - **Tasa entera $k\%$**: $k\%(N) = k \cdot u_1$

  - **Tasa fraccionaria $0,5\%$**: $0,5\%(N) = \frac{u_1}{2}$

  - **Composición decimal mixta ($12\%$)**: $12\%(N) = 10\%(N) + 2 \cdot u_1$

  '
definiciones_clave: '- **Unidad porcentual base (1%)**: Valor correspondiente a una
  centésima parte exacta del total ($N \div 100$).

  - **Desplazamiento binario decimal**: Movimiento de exactamente 2 posiciones hacia
  la izquierda.

  - **Estrategia combinada (10% y 1%)**: Descomposición aditiva de porcentajes generales
  en decenas y unidades porcentuales.

  '
propiedades_relaciones: '- **Cancelación de doble cero**: Si $N = k \cdot 100$, entonces
  $1\%(N) = k$.

  - **Relación con el 10%**: El $1\%$ es exactamente la décima parte del $10\%$ ($1\%
  = 10\% \div 10$).

  '
ejemplo_guiado:
  enunciado: Calcula mentalmente el $1\%$, el $3\%$ y el $12\%$ de una compra de $\$80.000$.
  pasos:
  - 'Paso 1: Calculamos el 1% quitando dos ceros a $\$80.000$: $1\% = 80.000 \div
    100 = $\$80$0$.'
  - 'Paso 2: Calculamos el 3% multiplicando el 1% por 3: $3\% = 3 \cdot 800 = $\$2.40$0$.'
  - 'Paso 3: Calculamos el 12% combinando el 10% y el 2%: $10\% = $\$8.00$0$ y $2\%
    = 2 \cdot 800 = $\$1.60$0$.'
  - 'Paso 4: Sumamos para el 12%: $12\% = 8.000 + 1.600 = $\$9.60$0$.'
  - 'Paso 5: Conclusiones: $1\% = $\$80$0$, $3\% = $\$2.40$0$ y $12\% = $\$9.60$0$.'
  imagen: /static/img/nodos/estrategia-de-calculo-mental-para-el-1-ejemplos.svg
