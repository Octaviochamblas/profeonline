semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_UNO
resumen_inicial: 'La estrategia de cálculo mental para el $1\%$ determina la centésima parte de una cantidad $C$ dividiéndola entre 100 o desplazando su coma decimal dos posiciones a la izquierda.'
explicacion_simple: |
  El $1\%$ representa exactamente una parte de cada cien. Para calcular el $1\%$ de cualquier cantidad de forma súper rápida:
  - Si el número termina en dos ceros, simplemente **le eliminas los dos últimos ceros** (ej: el $1\%$ de $3.800$ es $38$).
  - Si el número no termina en dos ceros, **mueves la coma decimal dos lugares a la izquierda** (ej: el $1\%$ de $425$ es $4,25$).
  Esta estrategia te permite calcular cualquier porcentaje exacto (como el $3\%$ o el $7\%$) simplemente multiplicando el $1\%$ por ese número.
explicacion_formal: |
  ### Definición formal
  La **propiedad del operador $1\%$** se deduce de su razón adimensional básica de denominador 100:
  $$1\% = \frac{1}{100} = 10^{-2} = 0,01$$

  ### Regla de cálculo mental por división centesimal
  Calcular el $1\%$ de una cantidad $C \in \mathbb{R}^+$ equivale a escalar la cantidad por el factor $0,01$, lo que posicionalmente corresponde a una división por $100$:
  $$1\% \text{ de } C = \frac{C}{100}$$

  ### Construcción de porcentajes arbitrarios no redondos
  Combinando la estrategia del $1\%$ ($V_{1\%} = \frac{C}{100}$) y del $10\%$ ($V_{10\%} = \frac{C}{10}$), es posible calcular mentalmente cualquier tanto por ciento entero $p\%$ de forma exacta:
  - **$3\%$**: $3 \cdot \left(\frac{C}{100}\right)$.
  - **$7\%$**: $7 \cdot \left(\frac{C}{100}\right)$.
  - **$12\%$**: $10\% + 2 \cdot 1\% = \frac{C}{10} + 2 \cdot \left(\frac{C}{100}\right)$.

  ### Síntesis didáctica
  - Operación fundamental: $1\% \text{ de } C = C \div 100$.
  - Módulo posicional: Mover coma dos lugares a la izquierda.
definiciones_clave: |
  - **Porcentaje unitario ($1\%$)**: Centésima parte de un total ($1/100$) empleada como módulo base de cálculo.
  - **Supresión de ceros centesimal**: Eliminación de dos ceros finales equivalente a dividir entre 100.
  - **Composición aditiva de porcentajes**: Técnica para hallar porcentajes compuestos mediante la suma de múltiplos del 10% y del 1%.
propiedades_relaciones: |
  - **Relación con el 10%**: El $1\%$ de una cantidad es exactamente la décima parte de su $10\%$ ($\frac{10\%}{10} = 1\%$).
  - **Universalidad del módulo unitario**: Conociendo el $1\%$, cualquier porcentaje entero $k\%$ se calcula mediante $k \cdot (1\% \text{ de } C)$.
ejemplo_guiado:
  enunciado: 'Calcula mentalmente el $1\%$ de $\$52.000$ y utiliza ese resultado para hallar el $3\%$ de dicha cantidad.'
  pasos:
    - 'Paso 1: Para hallar el $1\%$ de $\$52.000$, dividimos por 100 eliminando los dos ceros finales: $1\% = \$520$.'
    - 'Paso 2: Para hallar el $3\%$, multiplicamos el valor del $1\%$ por 3.'
    - 'Paso 3: Efectuamos el producto mental: $3 \cdot 520 = 1.560$.'
    - 'Paso 4: Respuestas: El $1\%$ es **$\$520$** y el $3\%$ es **$\$1.560$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la regla de cálculo mental para obtener inmediatamente el $1\%$ de cualquier número?'
    choices:
      - {text: 'Dividir el número entre 100 o mover la coma decimal dos lugares a la izquierda', is_correct: true}
      - {text: 'Dividir el número entre 10', is_correct: false}
      - {text: 'Multiplicar el número por 100', is_correct: false}
      - {text: 'Restar 100 al número original', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir el número entre 100 o mover la coma decimal dos lugares a la izquierda''. $1\% = 1/100$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el $1\%$ de un monto es $\$45$, ¿cuánto dinero representa el $6\%$ de ese mismo monto?'
    choices:
      - {text: '$\$270$, multiplicando el valor del $1\%$ por 6 ($45 \cdot 6 = 270$)', is_correct: true}
      - {text: '$\$450$, multiplicando por 10', is_correct: false}
      - {text: '$\$135$, triplicando el valor', is_correct: false}
      - {text: '$\$2.700$, multiplicando por 60', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$270$, multiplicando el valor del $1\%$ por 6 ($45 \cdot 6 = 270$)''. $6 \cdot 45 = 270$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar la cantidad total $C$.'
  - 'Paso 2: Si la cantidad termina en dos ceros, eliminar los dos ceros finales. Si no termina en dos ceros, desplazar la coma decimal dos posiciones hacia la izquierda.'
  - 'Paso 3: El número resultante corresponde al $1\%$ de la cantidad.'
  - 'Paso 4: Para hallar un $k\%$, multiplicar el resultado del $1\%$ por $k$.'
errores_correccion: |
  - **Error 1:** Mover la coma un solo lugar hacia la izquierda al calcular el $1\%$ (confundiéndolo con el $10\%$). **Cómo corregirlo:** El $1\%$ representa la centésima parte; **debes mover la coma DOS lugares a la izquierda**.
  - **Error 2:** Multiplicar por 100 al buscar el $1\%$. **Cómo corregirlo:** El $1\%$ es una división entre cien: **$C \div 100$**.
ejemplos:
  - titulo: 'Cálculo mental del 1% en miles'
    enunciado: '¿El $1\%$ de $\$90.000$ es $\$900$?'
    alternativas:
      - 'Sí, eliminando dos ceros: $90.000 / 100 = 900$'
      - 'No, es 9.000'
      - 'No, es 90'
    respuesta: 'Sí, eliminando dos ceros: $90.000 / 100 = 900$'
    solucion_pasos:
      - '1. Quitamos los dos ceros finales a 90.000.'
      - '2. Resultado: 900.'
  - titulo: 'Cálculo mental del 1% en números decimales'
    enunciado: '¿El $1\%$ de $650$ es $6,5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Moviendo la coma dos posiciones: $6,50 = 6,5$.'
  - titulo: 'Cálculo del 2% usando el 1%'
    enunciado: 'Si el $1\%$ de un sueldo es $\$8.000$, ¿el $2\%$ es $\$16.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2 \cdot 8.000 = \$16.000$.'
  - titulo: 'Relación entre el 10% y el 1%'
    enunciado: 'Si el $10\%$ de un número es $40$, ¿su $1\%$ es $4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividiendo el 10% entre 10: $40 / 10 = 4$.'
errores_frecuentes:
  - 'Mover la coma decimal un solo lugar a la izquierda en lugar de dos posiciones al buscar el 1%.'
  - 'Multiplicar por 100 la cifra en lugar de dividir entre 100.'
  - 'La regla de cálculo mental del 1% consiste en dividir la cantidad entre 10.'
  - 'Los enteros de un solo dígito conservan su valor numérico al calcular el 1%.'
  - 'Sumar 1 al número original en lugar de escalar posicionalmente la cifra.'
afirmaciones_verdaderas:
  - 'El $1\%$ de una cantidad equivale a su centésima parte ($\frac{1}{100}$) y se calcula dividiendo la cantidad por 100.'
  - 'Multiplicando el valor del $1\%$ por un entero $k$, se obtiene directamente el $k\%$ de dicha cantidad.'
al_terminar_debes_poder: 'Calcular mentalmente el $1\%$ de cualquier cantidad dividiendo entre 100 y usarlo para obtener porcentajes como el $2\%$, $3\%$ o $7\%$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
