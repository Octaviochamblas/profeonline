procedimiento:
- 'Paso 1: Mueve la coma decimal dos lugares a la izquierda para obtener el 1%.'
- 'Paso 2: Multiplica ese resultado por el dígito del porcentaje deseado.'
- 'Paso 3: Verifica mentalmente que el número resultante sea bastante pequeño en relación
  al total.'
errores_correccion: Evita confundir los datos de entrada al operar con estrategia de cálculo
  mental para el 1%.
ejemplos:
- titulo: Cálculo de comisión
  enunciado: Un corredor cobra un 3% de comisión por vender un auto de $8.000.000. ¿Cuánto
    es la comisión?
  solucion_pasos:
  - 'Calculamos el 1%: Movemos la coma dos espacios. Es $80.000.'
  - 'Calculamos el 3%: Multiplicamos por 3. $80.000 \cdot 3 = 240.000$.'
  - La comisión es $240.000.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el 1% de 3.200 mentalmente?
  alternativas:
  - '32'
  - '320'
  - 3,2
  respuesta: '32'
  solucion_pasos:
  - Se mueve la coma dos lugares a la izquierda.
- titulo: Ejemplo 3
  enunciado: Usando la estrategia del 1%, ¿cuál es el 4% de 500?
  alternativas:
  - '20'
  - '5'
  - '40'
  respuesta: '20'
  solucion_pasos:
  - El 1% de 500 es 5; 5 por 4 es igual a 20.
- titulo: ¿La estrategia del 1% es útil para calcular porcentajes con decimales, como 0,5%?
  respuesta: Sí
  solucion_pasos:
  - Se calcula el 1% y luego se divide por 2 para obtener el 0,5%.
errores_frecuentes:
- Mover la coma un solo espacio por accidente (calculando el 10% y luego multiplicando, lo
  que da números gigantes).
- No saber multiplicar números con decimales resultantes mentalmente (ej. el 2% de 15 es $0.15
  \cdot 2 = 0.30$).
- Mover la coma un solo espacio por accidente, calculando el 10% en vez del 1%.
- No saber operar mentalmente con los decimales resultantes al calcular el 1% de números que
  no son múltiplos de 100.
- Olvidar que el 1% de un número menor a 100 da como resultado un decimal.
afirmaciones_verdaderas:
- La propiedad de estrategia de cálculo mental para el 1% preserva la consistencia lógica.
- Para calcular mentalmente porcentajes pequeños o precisos, como 2%, 3% o 7%, conviene calcular
  primero el 1% y luego multiplicarlo por el dígito correspondiente.
al_terminar_debes_poder: Resolver problemas aplicados que involucren estrategia de cálculo
  mental para el 1%.
