resumen_inicial: 'La estrategia de cálculo mental para el $1\%$ consiste en dividir
  la cantidad $N$ entre $100$, lo que equivale a desplazar la coma decimal dos posiciones
  hacia la izquierda: $1\% \text{ de } N = \frac{N}{100}$.'
explicacion_simple: Para calcular mentalmente el 1% de cualquier cantidad, dividimos
  el número entre 100 o le corremos la coma decimal dos lugares a la izquierda. Al
  juntar el 10% y el 1%, podemos calcular mentalmente porcentajes exactos como el
  11%, el 12% o el 3%.
explicacion_formal: 'Para toda cantidad $N \in \mathbb{R}$, la **Estrategia del $1\%$
  Unitario** opera mediante la división por cien:


  $$1\% \cdot N = \frac{1}{100} \cdot N = \frac{N}{100}$$


  **Construcción de porcentajes de precisión:**

  - $2\% = 2 \cdot (1\%)$.

  - $12\% = 10\% + 2 \cdot (1\%)$.

  - $9\% = 10\% - 1\%$.'
definiciones_clave: '- **Estrategia mental del 1%**: División directa $1\% \cdot N
  = \frac{N}{100}$.'
propiedades_relaciones: '- **Unidad de precisión porcentual**: Permite armar porcentajes
  no redondos combinando con el 10%.'
ejemplo_guiado:
  enunciado: Calcule mentalmente el $1\%$ y el $12\%$ de \$8.000.
  pasos:
  - 'Paso 1: Para el $1\%$, dividir $8.000$ entre $100 \implies 1\% = 80$.'
  - 'Paso 2: Calcular el $10\%$ dividiendo entre $10 \implies 10\% = 800$.'
  - 'Paso 3: Sumar el $10\%$ más el doble del $1\%$ ($800 + 2 \cdot 80 = 800 + 160
    = 960$).'
  - 'Conclusión: El $1\%$ es \$80 y el $12\%$ es \$960.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la regla de cálculo mental para obtener el 1% de un número
    N?
  choices:
  - text: En dividir la cantidad N entre 100 (desplazando la coma dos lugares a la
      izquierda)
    is_correct: true
  - text: En restar 1 al número N
    is_correct: false
  - text: En multiplicar N por 100
    is_correct: false
  - text: En sacar la mitad del número
    is_correct: false
  explanation: La alternativa correcta es 'En dividir la cantidad N entre 100 (desplazando
    la coma dos lugares a la izquierda)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $8.000, ¿cuál fue el 12% obtenido sumando 10%
    + 2%?
  choices:
  - text: 960 $ (800 + 160 = 960)
    is_correct: true
  - text: 880 $
    is_correct: false
  - text: 1.200 $
    is_correct: false
  - text: 800 $
    is_correct: false
  explanation: La alternativa correcta es '960 $ (800 + 160 = 960)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular mentalmente el $1\%$
  dividiendo entre 100 y construir porcentajes de precisión ($12\%, 9\%, 3\%$) combinándolos
  con el $10\%$.
semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_UNO
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.CALCULO_MENTAL_UNO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
