procedimiento:
- 'Paso 1: Mueve la coma decimal dos lugares a la izquierda para obtener el 1%.'
- 'Paso 2: Multiplica ese resultado por el dígito del porcentaje deseado.'
- 'Paso 3: Verifica mentalmente que el número resultante sea bastante pequeño en relación
  al total.'
errores_correccion: Evita confundir los datos de entrada al operar con estrategia
  de cálculo mental para el 1%.
ejemplos:
- titulo: Cálculo de comisión
  enunciado: Un corredor cobra un 3% de comisión por vender un auto de $8.000.000.
    ¿Cuánto es la comisión?
  solucion_pasos:
  - 'Calculamos el 1%: Movemos la coma dos espacios. Es $80.000.'
  - 'Calculamos el 3%: Multiplicamos por 3. $80.000 \cdot 3 = 240.000$.'
  - La comisión es $240.000.
errores_frecuentes:
- Mover la coma un solo espacio por accidente (calculando el 10% y luego multiplicando,
  lo que da números gigantes).
- No saber multiplicar números con decimales resultantes mentalmente (ej. el 2% de
  15 es $0.15 \cdot 2 = 0.30$).
afirmaciones_verdaderas:
- La propiedad de estrategia de cálculo mental para el 1% preserva la consistencia
  lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren estrategia de
