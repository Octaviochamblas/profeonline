semantic_id: MAT.FUND.LOGICA_BASICA.FORMALIZACION_ENUNCIADO
resumen_inicial: Traducción de enunciados del lenguaje natural al lenguaje formal de la lógica proposicional mediante variables y conectivos lógicos.
explicacion_simple: 'Formalizar un enunciado es como traducir una frase en español al lenguaje de los símbolos matemáticos. Tomamos una oración como "Si estudio y practico, entonces aprobaré el examen" y la representamos como **$(p \land q) \to r$**. Para hacerlo, primero identificamos las ideas simples (las variables $p, q, r$), luego reconocemos los conectores ("y" es $\land$, "o" es $\lor$, "si... entonces" es $\to$, "no" es $\neg$) y finalmente usamos paréntesis para que la estructura quede clara y sin confusiones.


  ![Formalización de un enunciado simple](/static/img/nodos/formalizacion-enunciado-intro.svg)

  '
explicacion_formal: "### Definición formal\nLa **formalización proposicional** es el proceso semántico-sintáctico de mapeo mediante el cual un enunciado en lenguaje natural $\\mathcal{E}$ se traduce a una fórmula bien formada (FBF) $\\alpha$ en el lenguaje formal $\\mathcal{L}_0$:\n$$\\mathcal{T}: \\mathcal{E} \\to \\mathcal{L}_0$$\ndonde $\\alpha$ se construye inductivamente a partir del conjunto de variables proposicionales atómicas $\\mathcal{V} = \\{p, q, r, \\dots\\}$ y los conectivos lógicos $\\{\\neg, \\land, \\lor, \\to, \\leftrightarrow\\}$.\n\n### Desglose simbólico\n- Equivalencias del lenguaje natural:\n  - Conjunción ($\\land$): \"y\", \"pero\", \"sin embargo\", \"además\", \"aunque\", \",\".\n  - Disyunción inclusiva ($\\lor$): \"o\", \"a menos que\", \"salvo que\".\n  - Disyunción exclusiva ($\\oplus$): \"o bien... o bien...\".\n  - Condicional ($\\to$): \"si $p$, entonces $q$\", \"$p$ implica $q$\", \"$q$ si $p$\", \"$p$ solo si $q$\".\n  - Bicondicional ($\\leftrightarrow$):\
  \ \"$p$ si y solo si $q$\", \"$p$ es equivalente a $q$\".\n  - Negación ($\\neg$): \"no\", \"es falso que\", \"no es cierto que\".\n\n> **Complemento didáctico:** La formalización aísla la estructura deductiva del enunciado, permitiendo someter razonamientos complejos al análisis formal de tablas de verdad o métodos algebraicos de inferencia.\n"
definiciones_clave: '- **Formalización lógica**: Traducción rigurosa de enunciados verbales a fórmulas del cálculo proposicional.

  - **Fórmula bien formada (FBF)**: Cadena de símbolos que cumple con las reglas sintácticas de la lógica proposicional.

  - **Diccionario de formalización**: Asignación explícita de cada variable proposicional a su correspondiente oración atómica afirmativa.

  '
propiedades_relaciones: '- **Variables siempre en afirmativo**: Las variables proposicionales deben definirse siempre en sentido positivo; las negaciones se expresan mediante el operador $\neg$ antepuesto a la variable.

  - **Prioridad de la puntuación**: Las comas, puntos y comas en el texto determinan la ubicación de los signos de agrupación (paréntesis) en la fórmula.

  '
ejemplo_guiado:
  enunciado: '![Diccionario de traducción lógica](/static/img/nodos/formalizacion-enunciado-ejemplos.svg)


    Formaliza el enunciado: "Si un número es divisible por $6$, entonces es divisible por $2$ y por $3$".'
  pasos:
  - 'Paso 1: Identificar las proposiciones atómicas afirmativas: - $p$: "Un número es divisible por $6$" - $q$: "Un número es divisible por $2$" - $r$: "Un número es divisible por $3$"'
  - 'Paso 2: Identificar el consecuente compuesto: "es divisible por $2$ y por $3$", que se traduce como la conjunción $(q \land r)$.'
  - 'Paso 3: Identificar la estructura condicional global "Si [antecedente], entonces [consecuente]".'
  - 'Paso 4: Escribir la fórmula proposicional final: $p \to (q \land r)$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es la formalización correcta de "No es cierto que hoy sea feriado y llueva", donde $p$: "Hoy es feriado" y $q$: "Hoy llueve"?'
  choices:
  - text: $\neg(p \land q)$
    is_correct: true
  - text: $\neg p \land q$
    is_correct: false
  - text: $\neg p \lor \neg q$
    is_correct: false
  - text: $p \land \neg q$
    is_correct: false
  explanation: La alternativa correcta es '$\neg(p \land q)$'. La expresión "No es cierto que" niega a toda la conjunción en su conjunto entre paréntesis.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la frase "$q$ si $p$", ¿cuál es el antecedente del condicional al formalizar?
  choices:
  - text: $p$, formalizándose como $p \to q$
    is_correct: true
  - text: $q$, formalizándose como $q \to p$
    is_correct: false
  - text: Ambas actúan como antecedentes simultáneos
    is_correct: false
  - text: Ninguna, porque la palabra "si" representa una conjunción
    is_correct: false
  explanation: La alternativa correcta es '$p$, formalizándose como $p \to q$'. La cláusula que acompaña al "si" siempre constituye la condición o antecedente.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer atentamente el texto y desglosar las proposiciones simples en forma afirmativa.'
- 'Paso 2: Construir el diccionario de variables proposicionales ($p, q, r, \dots$).'
- 'Paso 3: Identificar los términos conectivos y las cláusulas condicionales o disyuntivas.'
- 'Paso 4: Insertar paréntesis de acuerdo con la jerarquía sintáctica y la puntuación para obtener la FBF.'
errores_correccion: '- **Error 1:** Incluir el término "no" dentro de la definición de la variable proposicional (ej. definir $p$: "No llueve"). **Cómo corregirlo:** La variable debe definirse afirmativamente como $p$: "Llueve", y la negación se expresa anteponiendo el operador $\neg p$.

  - **Error 2:** Invertir el antecedente y el consecuente en condicionales con redacción invertida (como "$q$ porque $p$"). **Cómo corregirlo:** La causa o condición introducida por "si", "dado que" o "porque" siempre es el antecedente ($p \to q$).

  '
ejemplos:
- titulo: Formalización de conjunción con "pero"
  enunciado: '¿Cómo se formaliza "Estudió mucho pero no aprobó", con $p$: "Estudió mucho" y $q$: "Aprobó"?'
  alternativas:
  - $p \land \neg q$
  - $p \lor \neg q$
  - $p \to \neg q$
  respuesta: $p \land \neg q$
  solucion_pasos:
  - 1. La palabra "pero" equivale lógicamente a la conjunción $\land$.
  - 2. "no aprobó" se formaliza como $\neg q$.
  - '3. Expresión final: $p \land \neg q$.'
- titulo: Formalización de disyunción
  enunciado: '¿Cómo se formaliza "Iré en tren o en autobús" con $p$: "Iré en tren", $q$: "Iré en autobús"?'
  alternativas:
  - $p \lor q$
  - $p \land q$
  - $p \to q$
  respuesta: $p \lor q$
  solucion_pasos:
  - La "o" se traduce como la disyunción inclusiva $\lor$.
- titulo: Bicondicional explícito
  enunciado: '¿Cómo se formaliza "Un número es par si y solo si es divisible por 2" con $p$: "Un número es par", $q$: "Es divisible por 2"?'
  alternativas:
  - $p \leftrightarrow q$
  - $p \to q$
  - $p \land q$
  respuesta: $p \leftrightarrow q$
  solucion_pasos:
  - La locución "si y solo si" representa el conectivo bicondicional $\leftrightarrow$.
- titulo: Negación global
  enunciado: ¿"Es falso que $p$ implique $q$" se formaliza como $\neg(p \to q)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, "es falso que" afecta a la totalidad de la implicación condicional.
errores_frecuentes:
- La afirmación de que las variables proposicionales deben definirse con la negación incorporada en su texto atómico.
- La afirmación de que la palabra "pero" se traduce lógicamente como una disyunción en vez de una conjunción.
- La afirmación de que en la oración "$q$ si $p$", la variable $q$ actúa como antecedente del condicional.
- La afirmación de que la ausencia de paréntesis en fórmulas con múltiples conectivos no altera la tabla de verdad.
- La afirmación de que la formalización de un enunciado cambia el valor de verdad intrínseco de las proposiciones.
afirmaciones_verdaderas:
- La formalización proposicional traduce la estructura deductiva del lenguaje natural al cálculo proposicional mediante variables atómicas y conectivos bien definidos.
- En una formalización rigurosa, las variables proposicionales se definen en sentido afirmativo y las negaciones se representan mediante el operador $\neg$.
al_terminar_debes_poder: '![Resumen de formalización de enunciados](/static/img/nodos/formalizacion-enunciado-resumen.svg)


  QUÉ: Formalizar enunciados del lenguaje natural convirtiéndolos a fórmulas simbólicas proposicionales bien formadas.

  CÓMO: Definir variables afirmativas, traducir conectivos lingüísticos ($\land, \lor, \to, \leftrightarrow, \neg$) y aplicar signos de agrupación según la sintaxis.

  '
