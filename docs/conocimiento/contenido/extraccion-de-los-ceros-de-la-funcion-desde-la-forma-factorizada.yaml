semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_CEROS_FACTORIZADA
resumen_inicial: 'Extracción de los ceros de la función desde la forma factorizada:
  parábola, vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Del mismo modo que el vértice se lee directamente en la forma
  canónica, los ceros de la función se leen directamente en la forma factorizada,
  sin resolver ninguna ecuación.
explicacion_formal: '### Definición formal


  Dada $f(x)=a(x-r_1)(x-r_2)$, los ceros de la función son los valores de $x$ que
  hacen $f(x)=0$. Por la propiedad del producto nulo, $f(x)=0$ exactamente cuando
  $x=r_1$ o $x=r_2$.


  ### Desarrollo didáctico


  Extraer los ceros es un proceso de lectura directa: se identifica cada $r_i$ (con
  su signo correcto) sin necesidad de resolver ninguna ecuación adicional.


  En $f(x)=-(x-4)(x+9)$: los ceros son $x=4$ y $x=-9$.'
definiciones_clave: '- **Extracción de los ceros de la función desde la forma factorizada**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  extracción de los ceros de la función desde la forma factorizada.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando extracción
    de los ceros de la función desde la forma factorizada.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a extracción
    de los ceros de la función desde la forma factorizada.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
