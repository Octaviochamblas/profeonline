semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_CEROS_FACTORIZADA
resumen_inicial: La extracción de ceros desde la forma factorizada aplica el teorema del producto nulo a $a(x - x_1)(x - x_2) = 0$ para leer las soluciones de inmediato.
explicacion_simple: |
  Para hallar los ceros o raíces a partir de la **forma factorizada $f(x) = a(x - x_1)(x - x_2)$**:

  - Aplicas la regla matemática: *"Si el producto de varios números da cero, al menos uno de ellos debe ser cero"*:
    $$a(x - x_1)(x - x_2) = 0$$
  - Como $a \neq 0$, solo hay dos opciones:
    1. $x - x_1 = 0 \implies x = x_1$
    2. $x - x_2 = 0 \implies x = x_2$

  **Regla práctica de inspección**:
  - Cambias el signo de las constantes que acompañan a la $x$ dentro de cada paréntesis.
  - **Ejemplo**: Para $f(x) = -5(x - 4)(x + 9)$:
    - De $(x - 4)$ extraes el cero **$x_1 = 4$**.
    - De $(x + 9)$ extraes el cero **$x_2 = -9$**.
explicacion_formal: |
  Sea la función cuadrática expresada en forma factorizada $f(x) = a(x - x_1)(x - x_2)$ con $a \neq 0$. El conjunto de ceros $Z(f) = \{x \in \mathbb{R} \mid f(x) = 0\}$ se obtiene formalmente mediante el **Teorema del Factor y la Propiedad de Nulidad del Producto**:

  $$a(x - x_1)(x - x_2) = 0 \iff (x - x_1 = 0) \lor (x - x_2 = 0)$$

  **Consecuencias geométricas inmediatas:**
  - Las coordenadas de intersección con el eje X son $P_1(x_1, 0)$ y $P_2(x_2, 0)$.
  - La distancia euclidiana entre los cortes del eje horizontal es $d = |x_2 - x_1|$.
  - La recta del eje de simetría biseca a dicho segmento en $x = \frac{x_1 + x_2}{2}$.
definiciones_clave: |
  - **Teorema del producto nulo**: Propiedad algebraica que establece que si el producto $u \cdot v = 0$, entonces $u = 0$ o $v = 0$.
propiedades_relaciones: |
  - **Identidad del Vértice desde los ceros**: Conocidas las raíces de la forma factorizada, la ordenada del vértice se evalúa directamente como $k = f\left(\frac{x_1 + x_2}{2}\right)$.
ejemplo_guiado:
  enunciado: 'Extrae los ceros de la función $f(x) = \frac{1}{2}(x - 6)(x + 4)$ y calcula la abscisa de su vértice.'
  pasos:
    - 'Paso 1: Igualar la función a cero: $\frac{1}{2}(x - 6)(x + 4) = 0$.'
    - 'Paso 2: Igualar cada factor lineal a cero: $x - 6 = 0 \implies x_1 = 6$; $x + 4 = 0 \implies x_2 = -4$.'
    - 'Paso 3: Declarar los ceros de la función: $x_1 = 6$ y $x_2 = -4$.'
    - 'Paso 4: Calcular la abscisa del vértice mediante la media aritmética: $h = \frac{6 + (-4)}{2} = \frac{2}{2} = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son los ceros extraídos directamente de la función cuadrática $f(x) = -7(x + 8)(x - 2)$?'
    choices:
      - {text: '$x_1 = -8$ y $x_2 = 2$', is_correct: true}
      - {text: '$x_1 = 8$ y $x_2 = -2$.', is_correct: false}
      - {text: '$x_1 = -7$ y $x_2 = 8$.', is_correct: false}
      - {text: '$x_1 = -8$ y $x_2 = -2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = -8$ y $x_2 = 2$''. Invertimos signos: de $(x+8)$ sale $-8$ y de $(x-2)$ sale $2$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si los ceros de una función factorizada son $x_1 = -3$ y $x_2 = 7$, ¿dónde se ubica el eje de simetría de su gráfica?'
    choices:
      - {text: 'En la recta $x = 2$', is_correct: true}
      - {text: 'En la recta $x = 4$.', is_correct: false}
      - {text: 'En la recta $x = -2$.', is_correct: false}
      - {text: 'En la recta $x = 10$.', is_correct: false}
    explanation: 'La alternativa correcta es ''En la recta $x = 2$''. El eje de simetría pasa por el punto medio $h = (-3 + 7)/2 = 4/2 = 2$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar los dos paréntesis con expresión lineal $(x - x_1)$ y $(x - x_2)$.'
  - 'Paso 2: Igualar el primer paréntesis a cero y despejar $x_1$.'
  - 'Paso 3: Igualar el segundo paréntesis a cero y despejar $x_2$.'
  - 'Paso 4: Formular los puntos de corte con el eje horizontal $(x_1, 0)$ y $(x_2, 0)$.'
errores_correccion: |
  - **Error común:** Incluir al coeficiente $a$ dentro del cálculo de las raíces pretendiendo resolver $a = 0$.
  - **Cómo corregirlo:** El factor constante $a$ **NUNCA SE IGUALA A CERO** (como $a \neq 0$, solo se despeja la variable $x$ dentro de los paréntesis).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Ceros en factores de signos opuestos.
    alternativas:
      - 'Ceros en x = 3 y x = -5'
      - 'Ceros en x = -3 y x = 5'
      - 'Ceros en x = 3 y x = 5'
    respuesta: 'Ceros en x = 3 y x = -5'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Ceros con raíz en el origen.
    alternativas:
      - 'Ceros en x = 0 y x = 8'
      - 'Ceros en x = 0 y x = -8'
      - 'Único cero en x = 8'
    respuesta: 'Ceros en x = 0 y x = 8'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La ausencia de la inversión de signo al extraer el valor numérico del cero desde el paréntesis $(x - x_i)$.'
  - 'La igualación del coeficiente constante $a$ a cero pretendiendo buscar una supuesta tercera raíz.'
  - 'La equivalencia errónea entre la distancia de los ceros y la posición del vértice.'
  - 'La suposición de que los ceros extraídos corresponden a las coordenadas $(0, x_1)$ y $(0, x_2)$.'
  - 'La sustitución de la multiplicación de los factores por una suma al despejar los ceros.'
afirmaciones_verdaderas:
  - 'Extraer los ceros de la forma factorizada $a(x - x_1)(x - x_2)$ requiere igualar a cero cada binomio, resultando $x = x_1$ y $x = x_2$.'
  - 'La abscisa del vértice es exactamente la media aritmética de los ceros reales extraídos de la forma factorizada: $h = (x_1 + x_2)/2$.'
al_terminar_debes_poder: |
  QUÉ: Extraer directamente los ceros de una función cuadrática desde su forma factorizada.
  CÓMO: Aplicar el teorema del producto nulo, igualar $(x - x_1) = 0$ y $(x - x_2) = 0$, despejar y calcular el punto medio para el vértice.
