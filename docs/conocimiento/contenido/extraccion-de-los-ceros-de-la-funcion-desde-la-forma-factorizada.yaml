semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_CEROS_FACTORIZADA
resumen_inicial: 'La extracción de ceros desde la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ se realiza por igualación directa de cada factor a cero mediante la propiedad del producto nulo.'
explicacion_simple: |
  Para encontrar los valores de $x$ que hacen cero a una función cuadrática expresada en forma factorizada, basta con aplicar la regla del producto nulo: si una multiplicación da cero, al menos uno de sus factores debe ser cero. Así, igualamos cada paréntesis a cero ($x - x_1 = 0$ y $x - x_2 = 0$) y obtenemos las raíces de forma instantánea cambiando el signo numérico interno.
explicacion_formal: |
  ### Definición formal
  Dada la función cuadrática en forma factorizada $f(x) = a(x - x_1)(x - x_2)$, con $a \neq 0$, sus ceros reales se obtienen aplicando la **propiedad del producto nulo**:
  $$f(x) = 0 \iff a(x - x_1)(x - x_2) = 0 \iff (x - x_1) = 0 \quad \lor \quad (x - x_2) = 0$$
  obteniendo los ceros unívocos $x = x_1$ y $x = x_2$.

  ### Desglose simbólico
  - De $(x - p) = 0 \implies x_1 = +p$.
  - De $(x + q) = 0 \implies x_2 = -q$.
  - Del factor escalar $a \neq 0$: No aporta ceros a la función.
  - Coordenadas de los puntos de intersección en el plano cartesiano: $P_1(x_1, 0)$ y $P_2(x_2, 0)$.

  ### Síntesis didáctica
  No se requiere resolver ecuaciones de segundo grado complejas ni usar la resolvente $\frac{-b \pm \sqrt{\Delta}}{2a}$ cuando se dispone de la forma factorizada. Los ceros están disueltos en los factores lineales y se leen por inversión de signo.
definiciones_clave: |
  - **Propiedad del producto nulo**: Regla que establece que un producto $A \cdot B = 0$ exige que $A = 0$ o $B = 0$.
  - **Inspección de factores**: Lectura directa de raíces igualando cada término lineal a cero.
  - **Abscisas de corte**: Valores $x_1$ y $x_2$ que corresponden a la primera coordenada de las intersecciones $(x_1, 0)$ y $(x_2, 0)$.
propiedades_relaciones: |
  - **Cálculo instantáneo del eje de simetría**: Una vez extraídos $x_1$ y $x_2$, el eje de simetría se obtiene inmediatamente como la recta $x = \frac{x_1 + x_2}{2}$.
  - **Puntos simétricos sobre el eje $x$**: Los ceros reales equidistan del eje de simetría $h$.
ejemplo_guiado:
  enunciado: 'Extrae directamente los ceros reales y los puntos de corte con el eje $x$ para las funciones $f(x) = -2(x - 3)(x - 8)$ y $g(x) = \frac{1}{4}(x + 5)(x - 1)$.'
  pasos:
    - 'Paso 1: Para $f(x) = -2(x - 3)(x - 8)$, aplicamos producto nulo: $(x - 3) = 0 \implies x_1 = 3$ y $(x - 8) = 0 \implies x_2 = 8$.'
    - 'Paso 2: Escribimos los puntos de corte con el eje $x$: $(3, 0)$ y $(8, 0)$.'
    - 'Paso 3: Para $g(x) = \frac{1}{4}(x + 5)(x - 1)$, aplicamos producto nulo: $(x + 5) = 0 \implies x_1 = -5$ y $(x - 1) = 0 \implies x_2 = 1$.'
    - 'Paso 4: Escribimos los puntos de corte con el eje $x$: $(-5, 0)$ y $(1, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son los ceros reales extraídos por inspección de la función $h(x) = -7(x - 4)(x + 9)$?'
    choices:
      - {text: '$x_1 = 4$ y $x_2 = -9$', is_correct: true}
      - {text: '$x_1 = -4$ y $x_2 = 9$', is_correct: false}
      - {text: '$x_1 = -7$ y $x_2 = 4$', is_correct: false}
      - {text: '$x_1 = 4$ y $x_2 = 9$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 4$ y $x_2 = -9$''. De $(x - 4) = 0 \implies x_1 = 4$, y de $(x + 9) = 0 \implies x_2 = -9$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función $p(x) = 3(x - 2)(x - 10)$, ¿cuál es la ecuación de su eje de simetría hallada a partir de sus ceros?'
    choices:
      - {text: 'La recta vertical de ecuación $x = 6$', is_correct: true}
      - {text: 'La recta vertical de ecuación $x = 12$', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = 6$', is_correct: false}
      - {text: 'La recta vertical de ecuación $x = -6$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = 6$''. Extraemos los ceros $x_1 = 2$ y $x_2 = 10$, y calculamos la media $x = \frac{2 + 10}{2} = 6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los dos binomios factores $(x - x_1)$ y $(x - x_2)$ de la forma factorizada.'
  - 'Paso 2: Igualar a cero cada binomio individualmente.'
  - 'Paso 3: Despejar la variable $x$ en cada ecuación lineal obteniendo los ceros reales $x_1$ y $x_2$.'
  - 'Paso 4: Expresar la respuesta como valores de las raíces o como pares ordenados de corte $(x_1, 0)$ y $(x_2, 0)$.'
errores_correccion: |
  - **Error 1:** Copiar el número del binomio sin invertir su signo al indicar el cero (ej: decir que de $(x + 6)$ la raíz es $x = 6$). **Cómo corregirlo:** La raíz se obtiene de la igualdad $x + 6 = 0 \implies x = -6$. El signo debe invertirse obligatoriamente.
  - **Error 2:** Tratar de igualar a cero el coeficiente constante $a$ (ej: de $-5(x - 1)(x - 2)$ decir que un cero es $x = -5$). **Cómo corregirlo:** El escalar $-5$ no contiene variable $x$ y no puede anularse. Los ceros proviene únicamente de los factores con $x$.
ejemplos:
  - titulo: 'Extracción directa de ceros'
    enunciado: '¿Cuáles son los ceros de $f(x) = 6(x - 11)(x - 3)$?'
    alternativas:
      - '$x_1 = 11$ y $x_2 = 3$'
      - '$x_1 = -11$ y $x_2 = -3$'
      - '$x_1 = 6$ y $x_2 = 11$'
    respuesta: '$x_1 = 11$ y $x_2 = 3$'
    solucion_pasos:
      - '1. Igualamos $x - 11 = 0 \implies x_1 = 11$.'
      - '2. Igualamos $x - 3 = 0 \implies x_2 = 3$.'
      - '3. Los ceros son $x_1 = 11$ y $x_2 = 3$.'
  - titulo: 'Extracción con raíces de signo mixto'
    enunciado: '¿Dónde corta al eje $x$ la parábola $g(x) = -(x + 7)(x - 2)$?'
    alternativas:
      - 'En $(-7, 0)$ y $(2, 0)$'
      - 'En $(7, 0)$ y $(-2, 0)$'
      - 'En $(0, -7)$ y $(0, 2)$'
    respuesta: 'En $(-7, 0)$ y $(2, 0)$'
    solucion_pasos:
      - '1. $x + 7 = 0 \implies x_1 = -7$. Punto $(-7, 0)$.'
      - '2. $x - 2 = 0 \implies x_2 = 2$. Punto $(2, 0)$.'
  - titulo: 'Propiedad del producto nulo'
    enunciado: '¿La extracción de ceros desde la forma factorizada se fundamenta en la propiedad del producto nulo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al multiplicar factores, el producto vale cero cuando al menos uno de sus binomios se anula.'
  - titulo: 'Ceros en raíz doble factorizada'
    enunciado: 'En la función $f(x) = 4(x - 5)^2$, ¿los dos ceros coinciden en el valor $x = 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $4(x - 5)(x - 5)$, ambos factores entregan el mismo cero $x_1 = x_2 = 5$.'
errores_frecuentes:
  - 'Los ceros de la función cuadrática factorizada $f(x) = 2(x + 3)(x - 4)$ son $x_1 = 3$ y $x_2 = -4$.'
  - 'El coeficiente multiplicativo $a = -5$ en $f(x) = -5(x - 1)(x - 2)$ genera un cero adicional en $x = -5$.'
  - 'Para extraer los ceros de una función factorizada es obligatorio multiplicar primero los binomios.'
  - 'Los ceros de una función en forma factorizada se expresan como pares ordenados $(0, x_1)$ y $(0, x_2)$.'
  - 'Si la forma factorizada presenta dos paréntesis con el mismo número $(x - 3)^2$, la función no tiene ceros reales.'
afirmaciones_verdaderas:
  - 'Los ceros de la función cuadrática factorizada $f(x) = a(x - x_1)(x - x_2)$ se leen directamente invirtiendo el signo de las constantes en los binomios.'
  - 'La intersección de la parábola factorizada con el eje de las abscisas se representa por los puntos cartesianos $(x_1, 0)$ y $(x_2, 0)$.'
al_terminar_debes_poder: 'Extraer los ceros reales e interpretar las intersecciones con el eje $x$ desde cualquier función en forma factorizada.'
