semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_CEROS_FACTORIZADA
resumen_inicial: La extracción de los ceros desde la forma factorizada aplica el teorema del producto nulo igualando a cero cada factor lineal de la expresión $a(x - x_1)(x - x_2) = 0$, obteniendo directamente las soluciones $x = x_1$ y $x = x_2$.
explicacion_simple: "![La extracción de los ceros desde la forma factorizada aplica el teorema del producto nulo igualando a cero cada factor lineal de la expresión $a(x - x_1)(x - x_2) = 0$, obteniendo directamente las soluciones $x = x_1$ y $x = x_2$](/static/img/nodos/extraccion-de-los-ceros-de-la-funcion-desde-la-forma-factorizada-intro.svg)\n\n\nSi una función ya viene escrita en forma factorizada, **encontrar los ceros es instantáneo gracias a la regla del producto nulo**:\n- \"Si dos cosas multiplicadas dan cero, al menos una de ellas tiene que ser cero\".\n- Para $f(x) = 2(x - 5)(x + 3) = 0$:\n  - O bien $x - 5 = 0 \\implies x = 5$.\n  - O bien $x + 3 = 0 \\implies x = -3$.\n- Los ceros son **$x = 5$** y **$x = -3$**.\n- No tienes que usar la fórmula de la cuadrática ni completar cuadrados; ¡solo despejar cada paréntesis!"
explicacion_formal: 'Sea $f(x) = a(x - x_1)(x - x_2)$ con $a \neq 0$. La condición de anulación $f(x) = 0$ en el dominio de integridad $(\mathbb{R}, +, \cdot)$ exige:

  $$a \cdot (x - x_1) \cdot (x - x_2) = 0$$

  Dado que $a \neq 0$:

  $$(x - x_1) = 0 \quad \lor \quad (x - x_2) = 0 \Longleftrightarrow x = x_1 \quad \lor \quad x = x_2$$


  **Propiedad del conjunto de ceros**:

  $$\mathcal{Z}(f) = \{x_1, x_2\}$$

  Cada cero $x_i$ genera un punto de intersección $P_i(x_i, 0)$ en la variedad lineal horizontal $Y = 0$.'
definiciones_clave: '- **Propiedad del producto nulo**: En los reales, $u \cdot v = 0 \iff u = 0 \lor v = 0$.

  - **Raíces de la forma factorizada**: Valores $x_1, x_2$ que anulan respectivamente cada binomio.'
propiedades_relaciones: '- **Factores con coeficientes**: Si el factor es $(mx + n)$, el cero se obtiene resolviendo $mx + n = 0 \implies x = -\frac{n}{m}$.

  - **Invarianza por escalamiento**: El valor del factor $a \neq 0$ no altera la ubicación de los ceros.'
ejemplo_guiado:
  enunciado: '![Ejemplo La extracción de los ceros desde la forma factorizada aplica el teorema del producto nulo igualando a cero cada factor lineal de la expresión $a(x - x_1)(x - x_2) = 0$, obteniendo directamente las soluciones $x = x_1$ y $x = x_2$](/static/img/nodos/extraccion-de-los-ceros-de-la-funcion-desde-la-forma-factorizada-ejemplos.svg)



    Extrae los ceros y los puntos de corte con el eje X para las funciones:

    1) $f(x) = -3(x - 8)(x + 2)$

    2) $g(x) = 5(2x - 7)(3x + 1)$'
  pasos:
  - 'Paso 1: Para $f(x) = -3(x - 8)(x + 2) = 0$:

    - Factor 1: $x - 8 = 0 \implies x_1 = 8$.

    - Factor 2: $x + 2 = 0 \implies x_2 = -2$.

    - Puntos de corte: $(8, 0)$ y $(-2, 0)$.'
  - 'Paso 2: Para $g(x) = 5(2x - 7)(3x + 1) = 0$:

    - Factor 1: $2x - 7 = 0 \implies 2x = 7 \implies x_1 = \frac{7}{2}$.

    - Factor 2: $3x + 1 = 0 \implies 3x = -1 \implies x_2 = -\frac{1}{3}$.

    - Puntos de corte: $(\frac{7}{2}, 0)$ y $(-\frac{1}{3}, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los ceros de la función $f(x) = -4(x - 6)(x + 1)$?
  choices:
  - text: x = 6 y x = -1
    is_correct: true
  - text: x = -6 y x = 1
    is_correct: false
  - text: x = 6 y x = 1
    is_correct: false
  - text: x = -4, x = 6 y x = -1
    is_correct: false
  explanation: 'La alternativa correcta es ''x = 6 y x = -1''. Igualando cada binomio a cero: $x - 6 = 0 \implies x = 6$, y $x + 1 = 0 \implies x = -1$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función $f(x) = 3(4x - 1)(x - 2)$, ¿cuál es el cero fraccionario?
  choices:
  - text: x = 1/4
    is_correct: true
  - text: x = -1/4
    is_correct: false
  - text: x = 4
    is_correct: false
  - text: x = -1
    is_correct: false
  explanation: La alternativa correcta es 'x = 1/4'. $4x - 1 = 0 \implies 4x = 1 \implies x = 1/4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación igualando la función a cero: $f(x) = 0$.'
- 'Paso 2: Igualar a cero el primer factor lineal y despejar $x_1$.'
- 'Paso 3: Igualar a cero el segundo factor lineal y despejar $x_2$.'
- 'Paso 4: Escribir el conjunto solución $\mathcal{Z} = \{x_1, x_2\}$ y los pares ordenados $(x_i, 0)$.'
errores_correccion: '- **Error común:** Incluir el coeficiente $a$ como un tercer cero (ej: en $4(x-2)(x-3)$ decir que 4 es una raíz).

  - **Cómo corregirlo:** El número $4 \neq 0$ **es una constante que nunca se hace cero**; solo los paréntesis con $x$ generan ceros.'
ejemplos:
- titulo: 'Ejemplo 1: Factores mónicos simples'
  enunciado: Extrae los ceros de $f(x) = (x - 10)(x + 4)$.
  alternativas:
  - x = 10 y x = -4
  - x = -10 y x = 4
  - x = 10 y x = 4
  - x = -10 y x = -4
  respuesta: x = 10 y x = -4
  solucion_pasos:
  - 'Paso 1: $x - 10 = 0 \implies x = 10$; $x + 4 = 0 \implies x = -4$.'
- titulo: 'Ejemplo 2: Factor lineal fraccionario'
  enunciado: En $g(x) = -2(3x - 5)(x + 1)$, ¿cuál es el cero positivo?
  alternativas:
  - x = 5/3
  - x = 3/5
  - x = -5/3
  - x = 5
  respuesta: x = 5/3
  solucion_pasos:
  - 'Paso 1: $3x - 5 = 0 \implies x = 5/3$.'
- titulo: 'Ejemplo 3: Extracción con factor x suelto'
  enunciado: ¿Cuáles son los ceros de $h(x) = 6x(x - 9)$?
  alternativas:
  - x = 0 y x = 9
  - x = 6 y x = 9
  - Solo x = 9
  - x = 0 y x = -9
  respuesta: x = 0 y x = 9
  solucion_pasos:
  - 'Paso 1: $x = 0$ y $x - 9 = 0 \implies x = 9$.'
- titulo: 'Ejemplo 4: Cuadrado perfecto'
  enunciado: ¿Qué cero tiene $f(x) = -5(x - 3)^2$?
  alternativas:
  - x = 3 (raíz doble)
  - x = -3 (raíz doble)
  - x = 3 y x = -5
  - x = 9
  respuesta: x = 3 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $x - 3 = 0 \implies x = 3$.'
errores_frecuentes:
- Tratar al coeficiente exterior constante como una raíz adicional.
- Olvidar la raíz x = 0 en funciones monomias x(x - k).
- Invertir los signos al despejar ecuaciones lineales ax + b = 0.
afirmaciones_verdaderas:
- Para extraer los ceros de la forma factorizada basta igualar cada factor lineal a cero.
- El coeficiente principal a no altera el valor de las raíces.
al_terminar_debes_poder: '**QUÉ:** Extraer los ceros de una función cuadrática a partir de su forma factorizada.


  **CÓMO:** Aplicando la propiedad del producto nulo e igualando a cero cada factor lineal.


