procedimiento:
- 'Paso 1: Verifica que la función esté en forma factorizada $a(x-r_1)(x-r_2)$.'
- 'Paso 2: Identifica $r_1$, reescribiendo el binomio si es necesario para leer su
  signo correctamente.'
- 'Paso 3: Identifica $r_2$ de la misma manera.'
- 'Paso 4: Los ceros de la función son $x=r_1$ y $x=r_2$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en extracción de los ceros de la función desde la
  forma factorizada.
ejemplos:
- titulo: Extracción de ceros positivos
  enunciado: Determina los ceros de $f(x)=4(x-2)(x-9)$.
  solucion_pasos:
  - $r_1=2$, $r_2=9$.
  - Los ceros son $x=2$ y $x=9$.
- titulo: Extracción de ceros con signos mixtos
  enunciado: Determina los ceros de $f(x)=-3(x+5)(x-1)$.
  solucion_pasos:
  - 'Reescribiendo $(x+5)$ como $(x-(-5))$: un cero es $x=-5$.'
  - El otro cero es $x=1$.
- titulo: ¿Se necesita resolver una ecuación adicional para hallar los ceros desde
    la forma factorizada?
  enunciado: ¿Se necesita resolver una ecuación adicional para hallar los ceros desde
    la forma factorizada?
  respuesta: 'No'
  solucion_pasos:
  - Los ceros se leen directamente como $r_1$ y $r_2$, aplicando la propiedad del
    producto nulo de forma implícita.
- titulo: ¿El coeficiente $a$ afecta el valor de los ceros de la función?
  enunciado: ¿El coeficiente $a$ afecta el valor de los ceros de la función?
  respuesta: 'No'
  solucion_pasos:
  - El coeficiente $a$ no puede ser cero, por lo que los ceros dependen únicamente
    de $r_1$ y $r_2$.
errores_frecuentes:
- Leer los ceros con el signo incorrecto al no reescribir el binomio en la forma $(x-r)$.
- Confundir los ceros con las coordenadas del vértice.
- Aplicar innecesariamente la fórmula general cuando la función ya está en forma factorizada.
- Olvidar que un binomio con signo positivo, como $(x+5)$, corresponde a un cero negativo.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  extracción de los ceros de la función desde la forma factorizada.
