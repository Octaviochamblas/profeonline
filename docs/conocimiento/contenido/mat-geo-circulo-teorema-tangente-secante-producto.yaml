semantic_id: MAT.GEO.CIRCULO_TEOREMAS.TANGENTE_SECANTE_PRODUCTO
resumen_inicial: 'Teorema de la tangente y la secante como igualdad entre cuadrado
  de tangente y producto de secante: conceptos, teoremas, propiedades geométricas
  y cálculo en Circunferencia y Círculo.'
explicacion_simple: 'Cuando desde un punto exterior se traza una tangente y una secante,
  existe una relación precisa: el cuadrado de la tangente es igual al producto de
  los segmentos de la secante.'
explicacion_formal: '![Teorema de la tangente y la secante: PT² = PA×PB](/static/img/geometria/circunferencia-circulo/circulo-teorema-tangente-secante-producto.svg)


  ### Definición formal


  Si desde un punto exterior $P$ se traza una tangente que toca la circunferencia
  en $T$ y una secante que la corta en $A$ (cercano) y $B$ (lejano), se cumple $PT^2=PA\times
  PB$. Se demuestra mediante semejanza de los triángulos $PTA$ y $PBT$ (ángulo en
  $P$ compartido y el ángulo semiinscrito igual al ángulo inscrito correspondiente).


  ### Desarrollo didáctico


  Si $PA=4$ cm y $PB=9$ cm, entonces $PT^2=4\times9=36$, de donde $PT=\sqrt{36}=6$
  cm. Este teorema es un caso límite del teorema de las secantes, cuando una de las
  dos secantes se convierte en tangente (sus dos puntos de corte se juntan en uno
  solo).'
definiciones_clave: '- **Teorema de la tangente y la secante como igualdad entre cuadrado
