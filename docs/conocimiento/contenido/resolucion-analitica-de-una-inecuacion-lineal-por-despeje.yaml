procedimiento:
- Eliminar paréntesis y simplificar términos semejantes en ambos lados de la inecuación.
- Agrupar todos los términos que contienen la incógnita en un lado de la inecuación
  (generalmente a la izquierda) y los términos constantes en el otro.
- Simplificar nuevamente para dejar un único término con la incógnita y un único número
  en el otro lado.
- Despejar la incógnita dividiendo ambos lados por su coeficiente. Si este coeficiente
  es negativo, invertir inmediatamente el símbolo de la desigualdad.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en resolución analítica de
  una inecuación lineal por despeje.
ejemplos:
- titulo: Despeje directo sin cambio de signo
  enunciado: Resolver la inecuación $3x - 5 < 7$.
  solucion_pasos:
  - Sumamos 5 a ambos lados para agrupar constantes - $3x < 7 + 5$.
  - Simplificamos - $3x < 12$.
  - Dividimos ambos lados entre 3, que es positivo (el signo no cambia) - $x < \frac{12}{3}$.
  - Obtenemos $x < 4$. La solución es el intervalo $(-\infty, 4)$.
- titulo: Despeje con inversión de signo
  enunciado: Resolver la inecuación $2 - 4x \\ge 14$.
  solucion_pasos:
  - Restamos 2 en ambos miembros - $-4x \ge 14 - 2$.
  - Simplificamos - $-4x \ge 12$.
  - Dividimos ambos lados entre $-4$. Como estamos dividiendo por un número negativo,
    debemos invertir el signo de $\ge$ a $\le$.
  - Calculamos $x \le \frac{12}{-4}$.
  - Concluimos $x \le -3$. El intervalo solución es $(-\infty, -3]$.
- titulo: ¿Se debe invertir el signo al restar un número en ambos lados?
  respuesta: Falso
  solucion_pasos:
  - La propiedad de la suma y resta de desigualdades indica que sumar o restar cualquier
    número real a ambos lados no altera el sentido de la desigualdad.
  - Por ejemplo, si tenemos $x + 5 > 2$ y restamos 5, obtenemos $x > -3$.
  - El signo solo se invierte al multiplicar o dividir por una cantidad negativa.
- titulo: ¿Es correcto que la solución de $-x < 5$ es $x > -5$?
  respuesta: Verdadero
  solucion_pasos:
  - La expresión $-x < 5$ equivale a $-1 \cdot x < 5$.
  - Para despejar $x$, dividimos ambos lados de la inecuación por $-1$.
  - Como estamos dividiendo por un número negativo, debemos invertir el sentido del
    menor que al mayor que.
  - El resultado es $x > -5$, lo cual es una proposición matemática correcta.
errores_frecuentes:
- No invertir el sentido de la desigualdad al dividir o multiplicar ambos miembros
  por un número negativo.
- 'Invertir el símbolo de desigualdad al dividir un lado negativo por un coeficiente
  positivo (ejemplo: de $2x < -8$ pasar a $x > -4$).'
- Al pasar términos sumando o restando (transposición), invertir erróneamente el signo
  de la desigualdad.
- Restar mal los coeficientes algebraicos, como operar $3x - 5x$ y escribir la inecuación
  sin el signo negativo del coeficiente.
- Pensar que un signo menor que siempre corresponde a la izquierda y un mayor que
  a la derecha independientemente del despeje realizado.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  resolución analítica de una inecuación lineal por despeje.
