semantic_id: MAT.ALG.INECUACIONES_LINEALES.RESOLUCION_DESPEJE
resumen_inicial: Resolver analíticamente una inecuación lineal consiste en aislar la incógnita aplicando las propiedades de las desigualdades.
explicacion_simple: '![Resolución analítica de una inecuación lineal por despeje](/static/img/nodos/resolucion-analitica-de-una-inecuacion-lineal-por-despeje-intro.svg)


  Para despejar una inecuación lineal usamos los mismos pasos que en las ecuaciones:

  1. Movemos los términos sumando o restando al otro lado cambiando su signo.

  2. Si el número que multiplica a la $x$ es positivo, pasa dividiendo sin cambiar el símbolo de la inecuación.

  3. Si el número que multiplica a la $x$ es negativo, pasa dividiendo e INVERTIMOS el símbolo de la inecuación.'
explicacion_formal: 'Dada la inecuación lineal $a x + b > c$, su **algoritmo de despeje analítico** es:


  $$a x > c - b$$

  $$x > \frac{c - b}{a} \quad \text{si } a > 0$$

  $$x < \frac{c - b}{a} \quad \text{si } a < 0$$


  **Desglose de la fórmula:**

  - Inversión del operador de orden según la condición de signo del coeficiente principal $a$.'
definiciones_clave: '- **Despeje analítico de inecuación**: Proceso algebraico para determinar la condición inequivalente de la incógnita $x$.

  - **Regla del coeficiente**: Condición de inversión del operador al dividir por $a < 0$.'
propiedades_relaciones: '- **Equivalencia de desigualdades**: Producir inecuaciones equivalentes con el mismo conjunto solución $S$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución analítica de una inecuación lineal por despeje](/static/img/nodos/resolucion-analitica-de-una-inecuacion-lineal-por-despeje-ejemplos.svg)


    Resuelve la inecuación lineal $4x - 7 > 9$ mediante despeje analítico y representa el conjunto solución.'
  pasos:
  - 'Paso 1: Trasponer la constante $-7$ sumando al segundo miembro: $4x > 9 + 7$.Paso 2: Sumar las constantes: $4x > 16$.Paso 3: Trasponer el coeficiente positivo $4$ dividiendo (sin invertir el sentido): $x > \frac{16}{4}$.Paso 4: Obtener la solución: $x > 4$.Paso 5: Escribir en notación de intervalo: $S = ]4, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $4x - 7 > 9$, ¿cuál es el resultado algebraico final para $x$?
  choices:
  - text: $x > 4$
    is_correct: true
  - text: $x < 4$
    is_correct: false
  - text: $x > 16$
    is_correct: false
  - text: $x = 4$
    is_correct: false
  explanation: La alternativa correcta es '$x > 4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al expresar la solución $x > 4$ en notación de intervalo, ¿cuál es la notación correcta?
  choices:
  - text: $]4, +\infty[$
    is_correct: true
  - text: $[4, +\infty[$
    is_correct: false
  - text: $]-\infty, 4[$
    is_correct: false
  - text: $[4, 16]$
    is_correct: false
  explanation: La alternativa correcta es '$]4, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trasponer los términos independientes al segundo miembro sumando o restando.'
- 'Paso 2: Reducir las constantes numéricas.'
- 'Paso 3: Dividir entre el coeficiente de la variable $x$.'
- 'Paso 4: Invertir el símbolo solo si el divisor es negativo.'
- 'Paso 5: Presentar el conjunto solución.'
errores_correccion: '- **Error común:** Invertir el símbolo de desigualdad al trasponer un número positivo.

  - **Cómo corregirlo:** El símbolo solo se invierte cuando el número que pasa a MULTIPLICAR o DIVIDIR es negativo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Al despejar $3x - 7 \le 11$, el término $-7$ pasa al otro miembro dividiendo como $\frac{11}{-7}$.
- Al despejar $-2x \le 8$, dividir entre $-2$ mantiene el operador obteniendo $x \le -4$.
- Despejar una inecuación lineal requiere elevar al cuadrado ambos miembros para eliminar la variable.
- En el despeje de $5x + 4 > 19$, restar $4$ en ambos lados exige invertir el sentido de la desigualdad.
- El procedimiento analítico de despeje solo se aplica cuando todos los coeficientes son números enteros positivos.
afirmaciones_verdaderas:
- El despeje analítico de una inecuación aplica propiedades aditivas y multiplicativas manteniendo o invirtiendo el operador según el signo del divisor/multiplicador.
- Aislar la incógnita $x$ en un miembro permite determinar la frontera y dirección del conjunto solución.
al_terminar_debes_poder: '**QUÉ:** Resolver inecuaciones lineales mediante despeje analítico paso a paso.


  **CÓMO:** Aplicando propiedades aditivas y multiplicativas para aislar la incógnita $x$ en uno de los miembros de la desigualdad.


  ![Resumen Resolución analítica de una inecuación lineal por despeje](/static/img/nodos/resolucion-analitica-de-una-inecuacion-lineal-por-despeje-resumen.svg)'
