semantic_id: MAT.ALG.INECUACIONES_LINEALES.RESOLUCION_DESPEJE
resumen_inicial: 'Resolución analítica de una inecuación lineal por despeje: relaciones
  de orden, intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: Resolver una inecuación lineal es muy similar a resolver una ecuación
  lineal. El objetivo sigue siendo aislar la incógnita. Sin embargo, en las inecuaciones
  hay una regla fundamental que marca la diferencia en el proceso.
explicacion_formal: "### Definición formal\nUna inecuación lineal en una variable,\
  \ tras agrupar términos, se puede reducir a la forma $ax < b$, $ax \\\\le b$, $ax\
  \ > b$ o $ax \\\\ge b$. \n\nResolverla significa encontrar todos los valores de\
  \ $x$ que hacen verdadera la desigualdad. Para despejar $x$, se divide por el coeficiente\
  \ $a$:\n- Si $a > 0$, la dirección de la desigualdad se mantiene. Por ejemplo, de\
  \ $ax < b$ pasamos a $x < \\\\frac{b}{a}$.\n- Si $a < 0$, la dirección de la desigualdad\
  \ se invierte. Por ejemplo, de $ax < b$ pasamos a $x > \\\\frac{b}{a}$.\n\n### Desarrollo\
  \ didáctico\nImagina que tienes una desigualdad verdadera, como $4 > 2$. Si sumas\
  \ o restas el mismo número a ambos lados, digamos sumamos 1, obtenemos $5 > 3$,\
  \ y la desigualdad se mantiene correcta. Si multiplicamos por un positivo, digamos\
  \ 2, obtenemos $8 > 4$, y también se mantiene.\n\nPero mira qué sucede si multiplicamos\
  \ $4 > 2$ por $-1$. Obtenemos $-4$ en la izquierda y $-2$ en la derecha. Si mantuviéramos\
  \ el signo tendríamos $-4 > -2$, ¡lo cual es falso! El número $-2$ es mayor que\
  \ $-4$. Por lo tanto, debemos invertir el signo - $-4 < -2$. \n\nEsta misma lógica\
  \ aplica cuando despejamos la $x$ en una inecuación algebraicamente. Es el único\
  \ \"cuidado especial\" que debemos tener en el despeje en comparación con las ecuaciones\
  \ normales."
definiciones_clave: '- **Resolución analítica de una inecuación lineal por despeje**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a resolución analítica de una inecuación
  lineal por despeje.'
