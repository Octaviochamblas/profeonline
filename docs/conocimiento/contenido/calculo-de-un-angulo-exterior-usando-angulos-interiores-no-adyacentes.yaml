semantic_id: MAT.GEO.TRIANGULOS_ANGULOS.CALCULO_ANGULO_EXTERIOR
resumen_inicial: El cálculo de un ángulo exterior mediante la suma directa de los
  ángulos interiores no adyacentes optimiza la resolución geométrica eliminando pasos
  intermedios de cálculo de suplementos.
explicacion_simple: '![Cálculo de Ángulo Exterior](/static/img/nodos/calculo-de-un-angulo-exterior-usando-angulos-interiores-no-adyacentes-intro.svg)


  Para calcular un ángulo de afuera no necesitas hacer dos cuentas (calcular el de
  adentro y luego restarlo de $180^\circ$): simplemente **suma los dos ángulos de
  adentro que están al frente**. Si tienes $45^\circ$ y $65^\circ$ en frente, el ángulo
  exterior mide directamente $45^\circ + 65^\circ = 110^\circ$.'
explicacion_formal: '### Algoritmo formal

  Dado un triángulo con ángulos interiores conocidos $\alpha$ y $\beta$, la medida
  del ángulo exterior $\gamma''$ correspondiente al tercer vértice se determina mediante
  la suma directa:


  $$\gamma'' = \alpha + \beta \iff \mu(\angle_{\text{ext}}) = \mu(\angle_{\text{int},
  1}) + \mu(\angle_{\text{int}, 2})$$


  ### Desglose simbólico y geométrico

  - $\gamma''$: Ángulo exterior en el vértice opuesto a los ángulos dados.

  - $\alpha, \beta$: Ángulos interiores remotos no adyacentes a $\gamma''$.


  ### Síntesis didáctica

  Permite calcular medidas exteriores directas en poligonales y problemas de ángulos
  en un solo paso aritmético de adición.'
definiciones_clave: '- **Cálculo directo**: $\alpha'' = \beta + \gamma$.

  - **Despeje inverso**: $\beta = \alpha'' - \gamma$.

  - **Optimización de resolución**: Reducción de tiempo al resolver ejercicios de
  geometría sin pasar por el interior suplementario. '
propiedades_relaciones: '- **Triángulo equilátero**: Cada ángulo exterior mide $60^\circ
  + 60^\circ = 120^\circ$.

  - **Triángulo rectángulo**: El ángulo exterior en el vértice recto mide la suma
  de los dos agudos ($90^\circ$), y en los vértices agudos mide $90^\circ + \text{agudo
  opuesto}$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Exterior](/static/img/nodos/calculo-de-un-angulo-exterior-usando-angulos-interiores-no-adyacentes-ejemplos.svg)


    El ángulo exterior en el vértice $C$ de un triángulo mide $135^\circ$. Si el ángulo
    interior en $A$ mide $50^\circ$, calcula la medida del ángulo interior en $B$.'
  pasos:
  - 'Paso 1: Plantear la relación del teorema del ángulo exterior: $\gamma'' = \alpha
    + \beta$.'
  - 'Paso 2: Sustituir los datos conocidos: $135^\circ = 50^\circ + \beta$.'
  - 'Paso 3: Despejar $\beta$ restando: $\beta = 135^\circ - 50^\circ = 85^\circ$.'
  - 'Paso 4: Comprobar: $\alpha + \beta = 50^\circ + 85^\circ = 135^\circ = \gamma''$.'
  - 'Paso 5: Concluir que el ángulo interior en $B$ mide $85^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si los ángulos interiores en B y C son 42° y 68°, ¿cuánto mide el ángulo
    exterior en A?
  choices:
  - text: 110° (porque 42° + 68° = 110°)
    is_correct: true
  - text: 70°
    is_correct: false
  - text: 138°
    is_correct: false
  - text: 112°
    is_correct: false
  explanation: Sumando directamente los dos no adyacentes se obtiene 110° (porque
    42° + 68° = 110°).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo exterior mide 140° y uno de los interiores no adyacentes
    mide 60°, ¿cuánto mide el otro interior opuesto?
  choices:
  - text: 80° (porque 140° - 60° = 80°)
    is_correct: true
  - text: 200°
    is_correct: false
  - text: 40°
    is_correct: false
  - text: 120°
    is_correct: false
  explanation: Por despeje inverso restando se obtiene 80° (porque 140° - 60° = 80°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si se busca el ángulo exterior o uno de los interiores opuestos.'
- 'Paso 2: Si se busca el exterior, sumar directamente $\text{Ext} = \text{Int}_1
  + \text{Int}_2$.'
- 'Paso 3: Si se busca un interior, restar $\text{Int}_2 = \text{Ext} - \text{Int}_1$.'
- 'Paso 4: Verificar la coherencia comprobando que el interior adyacente sume $180^\circ$
  con el exterior.'
errores_correccion: 'No calcules pasos de más: sumar los dos interiores opuestos te
  da el exterior directamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo $\alpha = 35^\circ$ y $\beta = 45^\circ$. ¿Cuánto mide
    el exterior $\gamma'$?
  alternativas:
  - $80^\circ$
  - $100^\circ$
  - $90^\circ$
  respuesta: $80^\circ$
  solucion_pasos:
  - $\gamma' = 35^\circ + 45^\circ = 80^\circ$.
- titulo: Ejemplo 2
  enunciado: Si un ángulo exterior mide $115^\circ$ y un interior no adyacente mide
    $40^\circ$, ¿cuánto mide el otro interior no adyacente?
  alternativas:
  - $75^\circ$
  - $65^\circ$
  - $155^\circ$
  respuesta: $75^\circ$
  solucion_pasos:
  - $\text{Interior} = 115^\circ - 40^\circ = 75^\circ$.
- titulo: ¿Se puede calcular un ángulo exterior sumando directamente los dos interiores
    opuestos?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la aplicación directa del Teorema del Ángulo Exterior.
- titulo: ¿El ángulo exterior es igual a la resta de los dos interiores opuestos?
  respuesta: 'No'
  solucion_pasos:
  - No, es estrictamente la SUMA de los dos interiores opuestos.
errores_frecuentes:
- Restar los ángulos interiores en vez de sumarlos al buscar el exterior.
- Confundir el ángulo interior adyacente con los interiores opuestos.
- Sumar los tres ángulos interiores para obtener un exterior.
- Cometer errores aritméticos al despejar en el método inverso.
- No comprobar el resultado con el suplemento de $180^\circ$.
afirmaciones_verdaderas:
- Un ángulo exterior es siempre igual a la suma de los dos interiores no adyacentes.
- En un triángulo equilátero cada ángulo exterior mide $120^\circ$.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas geométricos calculando ángulos
  exteriores e interiores mediante la propiedad de los no adyacentes.


  **CÓMO:** Aplicando la fórmula directa $\text{Ext} = \text{Int}_1 + \text{Int}_2$
  y el despeje inverso $\text{Int}_2 = \text{Ext} - \text{Int}_1$.


  ![Resumen de Cálculo de Ángulo Exterior](/static/img/nodos/calculo-de-un-angulo-exterior-usando-angulos-interiores-no-adyacentes-resumen.svg)'
