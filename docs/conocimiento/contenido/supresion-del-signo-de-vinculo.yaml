semantic_id: MAT.ALG.AGRUPACION.SIGNO_VINCULO
resumen_inicial: La supresión del signo de vínculo consiste en tratar la barra superior como un paréntesis parentético equivalente, aplicando las reglas de signos antecedentes sobre los términos cubiertos por ella.
explicacion_simple: "El **vínculo o barra horizontal** ($\\overline{\\quad}$) es una forma tradicional de escribir un signo de agrupación sobre dos o más términos:\n- **REGLA DE CONVERSIÓN**: **Reemplaza mentalmente la barra por un paréntesis ordinario $( \\quad )$**.\n- **Ejemplos**:\n  - $\\overline{a + b} \\iff (a + b)$.\n  - $x - \\overline{y - z} \\iff x - (y - z)$.\n- **Pasos para suprimir un vínculo precedido por un signo negativo ($-$):**\n  1. Escribe la expresión poniendo paréntesis bajo la barra: $x - (y - z)$.\n  2. Aplica la regla del signo negativo antecedente: **invierte el signo de todos los términos que estaban debajo de la barra**.\n  3. Resultado: $x - y + z$.\n\n![Supresión del Signo de Vínculo](/static/img/nodos/supresion-del-signo-de-vinculo-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\overline{A}$ el operador de vínculo delimitador aplicado sobre una subexpresión $A = \sum_{i=1}^m T_i$. El **vínculo** es isomórfico al paréntesis ordinario $\mathcal{P}_{()}(A)$:


  $$\overline{\sum_{i=1}^m T_i} \equiv \left( \sum_{i=1}^m T_i \right)$$


  Por lo tanto, la supresión de un vínculo precedido por un operador de signo $\sigma \in \{-1, +1\}$ cumple la ley distributiva estándar:


  $$\sigma \cdot \overline{\sum_{i=1}^m T_i} = \sigma \cdot \sum_{i=1}^m T_i = \sum_{i=1}^m (\sigma \cdot T_i)$$


  ### Alcance del Vínculo Superior

  El alcance de la barra horizontal determina de forma exclusiva los términos afectados por la negación o multiplicación antecedente. El signo operador previo a la barra opera externamente sobre el primer término cubierto por el vínculo:


  $$- \overline{A - B + C} = - A + B - C$$


  ### Síntesis didáctica

  Reconocer el vínculo como un paréntesis elevado previene el error común de considerar el signo negativo antecedente como propio del primer término del subradical o fracción.

  '
definiciones_clave: '- **Vínculo o Barra ($\overline{\quad}$)**: Delimitador horizontal tradicional que agrupa términos colocados debajo de su extensión.

  - **Alcance del vínculo**: Longitud de la barra horizontal que especifica exactamente qué términos están agrupados.

  - **Isomorfismo parentético**: Equivalencia formal $100\%$ idéntica entre la barra $\overline{A}$ y el paréntesis $(A)$.

  '
propiedades_relaciones: '- **Uso en radicales y fracciones**: En expresiones como $\sqrt{x + y}$ o $\frac{a + b}{c}$, la barra horizontal del radical y de la fracción actúa como un signo de vínculo implícito.

  - **Inversión por signo menos antecedente**: $- \overline{x - y} = -x + y$.

  '
ejemplo_guiado:
  enunciado: 'Elimina el signo de vínculo y simplifica la expresión: $5a - \overline{2a - 3b + 1}$.'
  pasos:
  - 'Paso 1: Convertimos el vínculo en un paréntesis explícito: $5a - (2a - 3b + 1)$.'
  - 'Paso 2: Observamos que el signo antecedente al vínculo es un signo $-$.'
  - 'Paso 3: Suprimimos el vínculo invirtiendo el signo de todos los términos cubiertos por la barra: - $+2a \to -2a$ - $-3b \to +3b$ - $+1 \to -1$.'
  - 'Paso 4: Escribimos la expresión desarmada: $5a - 2a + 3b - 1$.'
  - 'Paso 5: Reducimos términos semejantes de la Clase $a$: $5a - 2a = \mathbf{3a}$.'
  - 'Conclusión: La expresión simplificada es **$3a + 3b - 1$**.'
  imagen: /static/img/nodos/supresion-del-signo-de-vinculo-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué signo de agrupación estándar es formalmente equivalente el signo de vínculo o barra horizontal ($\overline{\quad}$)?
  choices:
  - text: Es equivalente a un paréntesis ordinario $( \quad )$, agrupando todos los términos cubiertos por la barra
    is_correct: true
  - text: Es equivalente a una multiplicación por dos
    is_correct: false
  - text: Es equivalente a un exponente negativo
    is_correct: false
  - text: Es equivalente a una constante cero
    is_correct: false
  explanation: La alternativa correcta es 'Es equivalente a un paréntesis ordinario $( \quad )$, agrupando todos los términos cubiertos por la barra'. Isomorfismo parentético.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de suprimir el vínculo en la expresión $10 - \overline{4 + x}$?
  choices:
  - text: El resultado es $10 - 4 - x$, que se reduce a $6 - x$
    is_correct: true
  - text: El resultado es $10 - 4 + x = 6 + x$
    is_correct: false
  - text: El resultado es $10 + 4 + x = 14 + x$
    is_correct: false
  - text: El resultado es $-6 - x$
    is_correct: false
  explanation: 'La alternativa correcta es ''El resultado es $10 - 4 - x$, que se reduce a $6 - x$''. Inversión por signo menos: $- \overline{4 + x} = -4 - x \implies 10 - 4 - x = 6 - x$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el segmento exacto de términos cubiertos por la barra horizontal del vínculo.'
- 'Paso 2: Reescribir el vínculo reemplazándolo por un par de paréntesis ordinarios $( \quad )$.'
- 'Paso 3: Verificar el signo antecedente a la barra ($+$ o $-$).'
- 'Paso 4: Suprimir el paréntesis aplicando la regla correspondiente y reducir términos semejantes.'
errores_correccion: '- **Error 1:** Cambiar el signo del primer término cubierto por la barra pero ignorar el segundo (escribir $- \overline{a + b} = -a + b$). **Cómo corregirlo:** La barra **AGRUPA A TODOS LOS TÉRMINOS CUBIERTOS ($- \overline{a + b} = -a - b$)**.

  - **Error 2:** Declarar el signo de resta antecedente como perteneciente únicamente al primer término interno. **Cómo corregirlo:** El signo menos **ESTÁ FUERA DEL VÍNCULO y afecta a todo el bloque**.

  '
ejemplos:
- titulo: Vínculo simple con signo menos
  enunciado: ¿Cuál es la supresión de $- \overline{x - y}$?
  alternativas:
  - $-x + y$
  - $-x - y$
  - $x + y$
  respuesta: $-x + y$
  solucion_pasos:
  - '1. Conversión: $- (x - y)$.'
  - '2. Inversión: $-x + y$.'
- titulo: Vínculo con signo más
  enunciado: ¿Cuál es la supresión de $+ \overline{3m - 2n}$?
  alternativas:
  - $+3m - 2n$
  - $-3m + 2n$
  - $-3m - 2n$
  respuesta: $+3m - 2n$
  solucion_pasos:
  - '1. Precedido por $+ \implies$ Mantiene signos: $+3m - 2n$.'
- titulo: Vínculo en fracciones
  enunciado: En la fracción $-\frac{a - b}{2}$, ¿funciona la barra divisoria como un vínculo sobre $a - b$ transformando el numerador en $-a + b$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la barra de fracción es un signo de vínculo implícito.
- titulo: Alcance delimitado
  enunciado: En $x - \overline{y + z} + w$, ¿afecta el signo menos únicamente a $y$ y a $z$, dejando intacto a $+w$?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la barra del vínculo termina antes de $+w$.
errores_frecuentes:
- Invertir únicamente el signo del primer término bajo el vínculo conservando el signo del segundo.
- Intercambiar el signo negativo antecedente al vínculo con el signo del primer término cubierto.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Extender el efecto del vínculo a términos que se encuentran fuera de la cobertura de la barra horizontal.
- Declarar que el signo de vínculo no es un signo de agrupación válido en álgebra.
afirmaciones_verdaderas:
- El signo de vínculo o barra horizontal es un signo de agrupación completamente equivalente al paréntesis ordinario.
- Al suprimir un vínculo precedido por signo negativo se debe invertir el signo de todos los términos cubiertos por la barra.
al_terminar_debes_poder: '![Resumen de signo de vínculo](/static/img/nodos/supresion-del-signo-de-vinculo-resumen.svg)


  QUÉ: Eliminar barras superiores de vínculo en expresiones algebraicas.


  CÓMO: Reemplazar mentalmente la barra por un paréntesis $\overline{E} \equiv (E)$ e invertir los signos bajo el vínculo si está precedido por un signo menos.'
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.
