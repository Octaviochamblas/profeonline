guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.02.06'
  title: 'Operatoria en el conjunto de los números reales'
  description: 'Aplica las propiedades algebraicas de las operaciones básicas en R y comprende la clausura de la suma y multiplicación.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'operatoria-en-el-conjunto-de-los-numeros-reales'
semantic_id: 'MAT.NUM.REALES.OPERACIONES'
titulo: 'Operatoria en el conjunto de los números reales'
objetivo: 'Efectuar operaciones aritméticas y algebraicas en $\mathbb{R}$ aplicando las propiedades de cuerpo (clausura, conmutatividad, asociatividad, elemento neutro, elemento inverso y distributividad).'
introduccion: 'El conjunto de los números reales $\mathbb{R}$, dotado de las operaciones de adición y multiplicación, posee la estructura matemática de un **cuerpo ordenado**. Esto significa que todas las reglas aritméticas que aprendiste con las fracciones y enteros se mantienen intactas al operar con irracionales. Sin embargo, al operar números irracionales entre sí, se debe tener especial cuidado: la suma o multiplicación de dos irracionales no siempre da como resultado un número irracional.'
resumen: 'El conjunto $\mathbb{R}$ es **cerrado (clausurado)** bajo la adición y la multiplicación: si $a, b \in \mathbb{R}$, entonces $(a + b) \in \mathbb{R}$ y $(a \cdot b) \in \mathbb{R}$. Cumple con las propiedades conmutativa, asociativa, distributiva, neutros ($0$ y $1$) e inversos (opuesto $-a$ y recíproco $a^{-1} = \frac{1}{a}$ para $a \neq 0$). Cabe destacar que el conjunto de los irracionales $\mathbb{I}$ **no** es cerrado por sí solo.'
requisitos:
  - 'Propiedades de la adición y multiplicación en números racionales.'
  - 'Simplificación de expresiones con radicales idénticos.'
objetivos:
  - 'Aplicar las propiedades algebraicas de los números reales en la simplificación de expresiones.'
  - 'Analizar la clausura de los subconjuntos $\mathbb{R}$, $\mathbb{Q}$ e $\mathbb{I}$.'
que_aprenderas:
  - 'Las 9 propiedades fundamentales del cuerpo de los números reales.'
  - 'Por qué la suma de un racional y un irracional siempre es irracional ($q + i \in \mathbb{I}$).'
  - 'Por qué la suma o multiplicación de dos irracionales puede dar como resultado un número racional.'
al_terminar_debes_poder:
  - 'Simplificar expresiones algebraicas reales combinando racionales e irracionales.'
  - 'Justificar si el resultado de una operación entre reales es racional o irracional.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: 'Si $q$ es un número racional no nulo ($q \in \mathbb{Q}, q \neq 0$) y $i$ es un número irracional ($i \in \mathbb{I}$), ¿qué tipo de número es SIEMPRE el producto $q \cdot i$?'
    choices:
      - {text: 'Siempre un número racional.', is_correct: false}
      - {text: 'Siempre un número irracional.', is_correct: true}
      - {text: 'Siempre un número entero positivo.', is_correct: false}
      - {text: 'Puede ser racional o irracional según el valor de $q$.', is_correct: false}
    explanation: 'La correcta es: Siempre un número irracional. El producto de un racional no nulo por un irracional es siempre un número irracional.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: 'Considera la operación entre los dos números irracionales $a = 3 + \sqrt{2}$ y $b = 3 - \sqrt{2}$. ¿Cuál es el resultado de la suma $a + b$ y a qué conjunto pertenece?'
    choices:
      - {text: '$a + b = 6 + 2\sqrt{2}$, que es un número irracional.', is_correct: false}
      - {text: '$a + b = 6$, que es un número racional.', is_correct: true}
      - {text: '$a + b = 0$, que es el neutro aditivo.', is_correct: false}
      - {text: '$a + b = 3\sqrt{2}$, que es irracional.', is_correct: false}
    explanation: 'La correcta es: $a + b = 6$, que es un número racional. Sumando: $(3 + \sqrt{2}) + (3 - \sqrt{2}) = 3 + 3 + (\sqrt{2} - \sqrt{2}) = 6 + 0 = 6 \in \mathbb{Q}$. Esto demuestra que el conjunto de los irracionales $\mathbb{I}$ NO es cerrado bajo la adición.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las partes racionales e irracionales de la expresión real.'
  - 'Paso 2: Agrupar y operar las partes racionales entre sí, y reducir los radicales semejantes entre sí aplicando la propiedad distributiva.'
  - 'Paso 3: Expresar el resultado final en su forma exacta (manteniendo el radical o la constante si no se elimina).'
errores_frecuentes:
  - 'Intentar sumar radicales no semejantes (por ejemplo, escribir $\sqrt{2} + \sqrt{3} = \sqrt{5}$, lo cual es completamente falso).'
  - 'Asumir que como el conjunto de los reales es cerrado, el conjunto de los irracionales también debe serlo.'
errores_correccion: |
  Un error clásico de álgebra es escribir $\sqrt{a} + \sqrt{b} = \sqrt{a + b}$. ¡Las raíces **no son distributivas respecto a la suma**! Por ejemplo, $\sqrt{9} + \sqrt{16} = 3 + 4 = 7$, mientras que $\sqrt{9 + 16} = \sqrt{25} = 5$. Como $7 \neq 5$, queda demostrado que **nunca debes sumar los radicandos**.
ejemplos:
  - titulo: 'Multiplicación de irracionales con resultado racional'
    enunciado: 'Calcula el producto de los números reales $x = 2\sqrt{3}$ y $y = \sqrt{12}$. ¿Es el resultado racional o irracional?'
    alternativas:
      - 'Es $12$, que es un número racional.'
      - 'Es $2\sqrt{15}$, que es un número irracional.'
      - 'Es $24$, que es un número racional.'
      - 'Es $\sqrt{36}$, que es un número irracional.'
    respuesta: 'Es $12$, que es un número racional.'
    solucion_pasos:
      - 'Multiplicamos los dos reales: $x \cdot y = (2\sqrt{3}) \cdot (\sqrt{12}) = 2 \cdot \sqrt{3 \cdot 12} = 2 \cdot \sqrt{36}$.'
      - 'Puesto que $\sqrt{36} = 6$, el resultado es $2 \cdot 6 = 12$.'
      - 'Como $12 \in \mathbb{Z} \subset \mathbb{Q}$, la multiplicación de dos irracionales resultó en un número racional.'
  - titulo: 'Simplificación de expresiones en los reales'
    enunciado: 'Simplifica la expresión real $E = 5\sqrt{2} + 3 - 2\sqrt{2} + 7$.'
    alternativas:
      - '$3\sqrt{2} + 10$'
      - '$7\sqrt{2} + 10$'
      - '$13\sqrt{2}$'
      - '$10\sqrt{2} + 3$'
    respuesta: '$3\sqrt{2} + 10$'
    solucion_pasos:
      - 'Agrupamos los términos racionales entre sí: $3 + 7 = 10$.'
      - 'Agrupamos los radicales semejantes entre sí: $5\sqrt{2} - 2\sqrt{2} = (5 - 2)\sqrt{2} = 3\sqrt{2}$.'
      - 'Sumando ambos resultados: $E = 3\sqrt{2} + 10$.'
comprobacion_rapida:
  - afirmacion: 'El conjunto de los números reales $\mathbb{R}$ es cerrado respecto a la adición y a la multiplicación.'
    respuesta: true
    explicacion: 'Correcto. La suma y producto de dos números reales es siempre otro número real.'
  - afirmacion: 'La suma de dos números irracionales es siempre un número irracional.'
    respuesta: false
    explicacion: 'Falso. Por ejemplo, $\sqrt{2} + (-\sqrt{2}) = 0$, y $0$ es un número racional.'
  - afirmacion: 'El inverso multiplicativo (recíproco) de cualquier número real no nulo $r$ es $\frac{1}{r}$.'
    respuesta: true
    explicacion: 'Correcto. Todo $r \in \mathbb{R}$ con $r \neq 0$ posee recíproco tal que $r \cdot \frac{1}{r} = 1$.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales.'
