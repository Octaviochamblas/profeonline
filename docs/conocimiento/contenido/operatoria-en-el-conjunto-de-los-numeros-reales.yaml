semantic_id: MAT.NUM.REALES.OPERACIONES
resumen_inicial: Las operaciones de adición, sustracción, multiplicación y división (excepto
  entre cero) están bien definidas en los números reales y cumplen las propiedades de cuerpo.
explicacion_simple: 'En los números reales podemos sumar, restar, multiplicar y dividir (salvo
  por cero) respetando las propiedades habituales:

  - **Conmutativa**: $a + b = b + a$ y $a \cdot b = b \cdot a$.

  - **Asociativa**: $(a + b) + c = a + (b + c)$.

  - **Distributiva**: $a(b + c) = ab + ac$.

  - **Elemento neutro**: $0$ en la suma ($a + 0 = a$) y $1$ en la multiplicación ($a \cdot
  1 = a$).'
explicacion_formal: 'El triple $(\mathbb{R}, +, \cdot)$ satisface la estructura de cuerpo
  (field): es un grupo abeliano para la adición con neutro 0 e inverso $-a$, un grupo abeliano
  para la multiplicación en $\mathbb{R} \setminus \{0\}$ con neutro 1 e inverso $a^{-1} =
  1/a$, y la multiplicación es distributiva respecto a la adición.'
definiciones_clave: '- **Estructura de Cuerpo**: Propiedades axiomáticas que rigen la suma
  y producto en $\mathbb{R}$.'
propiedades_relaciones: '- **Inverso multiplicativo**: Todo $a \in \mathbb{R}, a \neq 0$ posee
  inverso $a^{-1} = \frac{1}{a}$ tal que $a \cdot a^{-1} = 1$.'
ejemplo_guiado:
  enunciado: Aplica la propiedad distributiva para calcular $E = \sqrt{2}(3 + \sqrt{2})$.
  pasos:
  - 'Distribución: $\sqrt{2} \cdot 3 + \sqrt{2} \cdot \sqrt{2}$.'
  - 'Calcular el primer producto: $3\sqrt{2}$.'
  - 'Calcular el segundo producto: $\sqrt{2} \cdot \sqrt{2} = 2$.'
  - 'Obtener el resultado final en forma exacta: $3\sqrt{2} + 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el inverso multiplicativo del número real 4?
  choices:
  - text: 1/4
    is_correct: true
  - text: '-4'
    is_correct: false
  - text: -1/4
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: 'La correcta es: 1/4. Puesto que $4 \cdot (1/4) = 1$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el elemento neutro de la adición en los números reales?
  choices:
  - text: '0'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '-1'
    is_correct: false
  - text: No tiene neutro
    is_correct: false
  explanation: 'La correcta es: 0. Al sumar 0 a cualquier número real $a$, el valor no cambia
    ($a + 0 = a$).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las operaciones requeridas en la expresión.'
- 'Paso 2: Aplicar la jerarquía de las operaciones (paréntesis, potencias/raíces, multiplicación/división,
  suma/resta).'
- 'Paso 3: Utilizar propiedades conmutativas, asociativas o distributivas para simplificar.'
errores_correccion: Recuerda que la división por cero NO está definida en los números reales.
  Expresiones como $5/0$ no existen.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $2(\sqrt{3} + 5) - 2\sqrt{3}$.
  alternativas:
  - '10'
  - 4\sqrt{3}
  - '5'
  respuesta: '10'
  solucion_pasos:
  - $2\sqrt{3} + 10 - 2\sqrt{3} = 10$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el inverso multiplicativo de -5?
  alternativas:
  - -1/5
  - 1/5
  - '5'
  respuesta: -1/5
  solucion_pasos:
  - -5 · (-1/5) = 1.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de √2 + √2?
  alternativas:
  - 2√2
  - √4
  - '2'
  respuesta: 2√2
  solucion_pasos:
  - 'Son términos semejantes: 1√2 + 1√2 = 2√2.'
- titulo: ¿Está definida la operación 7 dividido por 0 en los números reales?
  respuesta: 'No'
  solucion_pasos:
  - La división por cero no está definida.
errores_frecuentes:
- Intentar dividir entre cero.
- Intentar simplificar una expresión dividiendo por una variable o cantidad que podría ser
  cero.
- Olvidar aplicar la propiedad distributiva antes de sumar términos con raíces.
- Confundir el inverso aditivo (-a) con el inverso multiplicativo (1/a).
- Sumar directamente los radicandos de dos raíces distintas, como si √a + √b fuera √(a+b).
afirmaciones_verdaderas:
- $(\mathbb{R}, +, \cdot)$ cumple todas las propiedades de un cuerpo matemático.
- La división por cero no está definida en el conjunto de los números reales.
al_terminar_debes_poder: Resolver operaciones combinadas en $\mathbb{R}$ aplicando las propiedades
  de cuerpo.
fuente: Texto escolar MINEDUC.
estado: publicado
