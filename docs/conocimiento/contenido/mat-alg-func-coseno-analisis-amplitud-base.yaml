semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.AMPLITUD_BASE
resumen_inicial: 'Identificación de la amplitud $A = 1$ de la función coseno base y su significado como semidistancia entre el valor máximo y el mínimo.'
explicacion_simple: |
  La **amplitud** de una onda mide la altura máxima que alcanza la curva medida desde su línea media (el eje horizontal central). En la función coseno base $y = \cos(x)$, la línea media está en $y = 0$, la cresta más alta sube hasta $1$ y el valle más bajo cae hasta $-1$. Por lo tanto, la distancia desde el centro hasta la punta es exactamente de **1 unidad**. En funciones transformadas del tipo $y = A\cos(x)$, la amplitud es el valor absoluto $|A|$.
explicacion_formal: |
  ### Definición formal
  La **amplitud** de una función oscilatoria continua se define como la mitad de la diferencia (distancia vertical) entre su valor máximo absoluto $y_{\max}$ y su valor mínimo absoluto $y_{\min}$:
  $$\text{Amplitud} = \frac{y_{\max} - y_{\min}}{2}$$
  Para la función coseno base $f(x) = \cos(x)$, donde $y_{\max} = 1$ e $y_{\min} = -1$:
  $$\text{Amplitud} = \frac{1 - (-1)}{2} = \frac{2}{2} = 1$$
  Para la función general $f(x) = A\cos(Bx + C) + D$, la amplitud se calcula mediante el valor absoluto:
  $$\text{Amplitud} = |A|$$

  ### Desglose simbólico
  - $|A|$: Magnitud escalar no negativa que mide el estiramiento o compresión vertical de la onda.
  - Línea media de equilibrio: Recta horizontal $y = D$.
  - Distancia de cresta a línea media: $y_{\max} - D = (D + |A|) - D = |A|$.

  ### Síntesis didáctica
  La amplitud siempre es un número positivo o nulo (es una distancia). Modificar el parámetro $A$ estira o aplasta verticalmente la curva sin cambiar los puntos donde la gráfica cruza la línea central de equilibrio.
definiciones_clave: |
  - **Amplitud**: Semidistancia vertical comprendida entre el pico máximo y el pico mínimo de la oscilación.
  - **Línea de equilibrio / Línea media**: Recta horizontal equidistante del valor máximo y del mínimo.
  - **Factor de escala vertical ($A$)**: Coeficiente que multiplica a la expresión cosenoidal.
propiedades_relaciones: |
  - **Positividad estricta de la amplitud**: Aunque el coeficiente $A$ sea negativo (como $-3\cos x$), la amplitud es una distancia no negativa y vale $|-3| = 3$.
  - **Independencia del período**: Cambiar la amplitud no afecta el período $T$ ni la frecuencia de la función.
ejemplo_guiado:
  enunciado: 'Calcula la amplitud y la línea media de la función cosenoidal $f(x) = -4\cos(2x - \pi) + 5$.'
  pasos:
    - 'Paso 1: Identificar el coeficiente multiplicativo del coseno: $A = -4$.'
    - 'Paso 2: Calcular la amplitud tomando su valor absoluto: $\text{Amplitud} = |A| = |-4| = 4$.'
    - 'Paso 3: Identificar la constante de desplazamiento vertical: $D = 5$. La línea media es la recta $y = 5$.'
    - 'Paso 4: Comprobar el rango: $y_{\max} = 5 + 4 = 9$ e $y_{\min} = 5 - 4 = 1$. Semidistancia: $\frac{9 - 1}{2} = \frac{8}{2} = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la amplitud de la función coseno base $f(x) = \cos(x)$?'
    choices:
      - {text: 'Exactamente $1$', is_correct: true}
      - {text: 'Exactamente $2$', is_correct: false}
      - {text: 'Exactamente $0$', is_correct: false}
      - {text: 'Indefinida', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente $1$''. La distancia desde la línea media $y = 0$ hasta la cresta $y = 1$ es $1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la amplitud de la función $g(x) = -7\cos(3x)$?'
    choices:
      - {text: '$7$', is_correct: true}
      - {text: '$-7$', is_correct: false}
      - {text: '$3$', is_correct: false}
      - {text: '$14$', is_correct: false}
    explanation: 'La alternativa correcta es ''$7$''. La amplitud es el valor absoluto del coeficiente: $|-7| = 7$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente $A$ que multiplica a la función coseno.'
  - 'Paso 2: Aplicar la función valor absoluto $|A|$.'
  - 'Paso 3: O bien, restar el valor máximo menos el mínimo y dividir por 2 ($\frac{y_{\max} - y_{\min}}{2}$).'
  - 'Paso 4: Expresar la amplitud como un número real positivo o nulo.'
errores_correccion: |
  - **Error 1:** Afirmar que la amplitud de $-2\cos(x)$ es $-2$. **Cómo corregirlo:** La amplitud mide una distancia geométrica de oscilación, por lo que siempre es un número positivo no negativo ($|-2| = 2$).
  - **Error 2:** Confundir la amplitud con la distancia total de cresta a valle ($y_{\max} - y_{\min}$). **Cómo corregirlo:** La distancia total de pico a pico es el doble de la amplitud; la amplitud es la **mitad** de esa distancia total.
ejemplos:
  - titulo: 'Amplitud de una función escalada'
    enunciado: '¿Cuál es la amplitud de $f(x) = 0.8\cos(x)$?'
    alternativas:
      - '$0.8$'
      - '$1$'
      - '$0.4$'
    respuesta: '$0.8$'
    solucion_pasos:
      - '1. El coeficiente $A = 0.8$.'
      - '2. La amplitud es $|0.8| = 0.8$.'
  - titulo: 'Amplitud con desplazamiento'
    enunciado: '¿El desplazamiento vertical $D = 8$ en $f(x) = \cos(x) + 8$ modifica la amplitud de la onda?'
    alternativas:
      - 'No, la amplitud sigue siendo 1'
      - 'Sí, la amplitud pasa a ser 9'
      - 'Sí, la amplitud pasa a ser 8'
    respuesta: 'No, la amplitud sigue siendo 1'
    solucion_pasos:
      - '1. El desplazamiento desplaza toda la gráfica hacia arriba.'
      - '2. La semidistancia desde la línea media $y = 8$ a la cresta $y = 9$ sigue midiendo $1$.'
  - titulo: 'Positividad de la amplitud'
    enunciado: '¿La amplitud de cualquier onda cosenoidal es una cantidad siempre mayor o igual a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser definida mediante el valor absoluto $|A|$, nunca puede ser negativa.'
  - titulo: 'Distancia total pico a pico'
    enunciado: 'Si la amplitud de una función coseno es 5, ¿la distancia vertical desde su punto más bajo al más alto es 10?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la distancia pico a pico es $2 \times \text{Amplitud} = 2 \times 5 = 10$.'
errores_frecuentes:
  - 'La afirmación de que la amplitud de una función cosenoidal con coeficiente negativo es una cantidad negativa.'
  - 'La afirmación de que la amplitud equivale a la distancia total entre la cresta máxima y el valle mínimo.'
  - 'La afirmación de que el parámetro de desplazamiento vertical $D$ altera la magnitud de la amplitud.'
  - 'La afirmación de que la función coseno base $f(x) = \cos(x)$ posee una amplitud de 2 unidades.'
  - 'La afirmación de que la amplitud cambia el período fundamental de la función.'
afirmaciones_verdaderas:
  - 'La amplitud de la función coseno base $f(x) = \cos(x)$ es exactamente igual a $1$.'
  - 'Para cualquier función de la forma $f(x) = A\cos(Bx + C) + D$, la amplitud de la oscilación equivale al valor absoluto del coeficiente $|A|$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular la amplitud de la función coseno base y de sus transformaciones.
  CÓMO: Obtener el valor absoluto $|A|$ del coeficiente multiplicativo o calcular la semidistancia $\frac{y_{\max} - y_{\min}}{2}$.
