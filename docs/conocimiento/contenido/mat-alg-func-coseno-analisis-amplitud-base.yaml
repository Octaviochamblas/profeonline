semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.AMPLITUD_BASE
resumen_inicial: 'Identificación de la amplitud de la función coseno base: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: Al igual que el seno, la función coseno oscila simétricamente
  alrededor de una línea central, alcanzando una distancia máxima fija desde esa línea.
explicacion_formal: '### Definición formal


  La amplitud de una función periódica se define como $\dfrac{\text{valor máximo}-\text{valor
  mínimo}}{2}$. Para $f(x)=\cos(x)$, el máximo es $1$ y el mínimo es $-1$, así que
  la amplitud es $\dfrac{1-(-1)}{2}=\dfrac{2}{2}=1$.


  ### Desarrollo didáctico


  Gráficamente, la amplitud representa qué tan lejos se aleja la curva de su línea
  media (en este caso, el eje $x$), la misma cantidad tanto hacia arriba como hacia
  abajo.'
definiciones_clave: '- **Identificación de la amplitud de la función coseno base**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de la amplitud de la función coseno base.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de la amplitud de la función coseno base.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de la amplitud de la función coseno
    base.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
