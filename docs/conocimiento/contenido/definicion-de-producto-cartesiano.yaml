- titulo: Distributividad
  enunciado: ¿A qué es igual $A \times (B \cap C)$?
  respuesta: $(A \times B) \cap (A \times C)$
  solucion_pasos:
  - El producto cartesiano distribuye sobre la intersección.
  alternativas:
