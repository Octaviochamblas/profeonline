errores_frecuentes:
- La afirmación de que el producto cartesiano es una operación conmutativa para cualquier par de conjuntos.
- La afirmación de que el producto cartesiano con el conjunto vacío produce el conjunto inicial $A$.
- La afirmación de que los elementos de $A \times B$ son números obtenidos multiplicando las componentes.
- La afirmación de que el producto cartesiano $A \times B$ produce un conjunto unidimensional no ordenado.
- La afirmación de que el producto cartesiano no distribuye sobre la unión y la intersección de conjuntos.
afirmaciones_verdaderas:
- El producto cartesiano $A \times B$ es el conjunto de todos los pares ordenados $(a, b)$ tales que $a \in A$ y $b \in B$.
- El producto cartesiano con el conjunto vacío satisface la propiedad absorbente $A \times \emptyset = \emptyset \times B = \emptyset$.
al_terminar_debes_poder: 'QUÉ: Definir, caracterizar y aplicar el producto cartesiano $A \times B$.

  CÓMO: Construir conjuntos de pares ordenados por comprensión y extensión, verificar su no conmutatividad y aplicar sus leyes distributivas.


