semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_RECONOCIMIENTO
resumen_inicial: 'Reconocimiento de función sobreyectiva: conceptos, representación
  y propiedades en Tipos de funciones y función inversa.'
explicacion_simple: Verificar la sobreyectividad es, en el fondo, una comparación
  de dos conjuntos que ya sabes calcular por separado.
explicacion_formal: '### Definición formal


  Dada $f\colon A \to B$, se determina $\text{Rec}(f)$ mediante análisis algebraico
  o gráfico. Si $\text{Rec}(f) = B$, entonces $f$ es sobreyectiva; si $\text{Rec}(f)
  \subsetneq B$ (subconjunto propio), $f$ no es sobreyectiva.


  ### Desarrollo didáctico


  Gráficamente, esto equivale a verificar que toda recta horizontal $y=b$ con $b \in
  B$ corte a la curva en al menos un punto (existencia de al menos una preimagen para
  cada elemento del codominio).


  Para $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=x^3$: toda recta horizontal corta
  la curva cúbica en exactamente un punto, así que $\text{Rec}(f)=\mathbb{R}=B$, y
  $f$ es sobreyectiva.'
definiciones_clave: '- **Reconocimiento de función sobreyectiva**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a reconocimiento de función sobreyectiva.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a reconocimiento de
    función sobreyectiva.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a reconocimiento de función sobreyectiva.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    reconocimiento de función sobreyectiva?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en tipos de funciones y función inversa
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en tipos de funciones y función inversa. Es la
    condición de existencia y unicidad en reconocimiento de función sobreyectiva.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en reconocimiento de función
    sobreyectiva, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcula o determina el recorrido de la función mediante análisis algebraico
  o gráfico.'
- 'Paso 2: Identifica el codominio declarado.'
- 'Paso 3: Compara ambos conjuntos - si son idénticos, la función es sobreyectiva;
  si no, no lo es.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar reconocimiento de función sobreyectiva.
ejemplos:
- titulo: Reconocimiento en función cúbica
  enunciado: Determina si $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=x^3$, es sobreyectiva.
  solucion_pasos:
  - El recorrido de $x^3$ es todo $\mathbb{R}$ (toma valores positivos, negativos
    y cero).
  - El codominio declarado también es $\mathbb{R}$.
  - Son iguales, así que es sobreyectiva.
- titulo: Reconocimiento en función con codominio restringido
  enunciado: Determina si $f\colon \mathbb{R} \to [0,+\infty[$, $f(x)=x^2$, es sobreyectiva.
  solucion_pasos:
  - El recorrido de $x^2$ es $[0,+\infty[$.
  - El codominio declarado también es $[0,+\infty[$.
  - Coinciden, así que es sobreyectiva.
- titulo: ¿Se puede reconocer la sobreyectividad sin conocer el codominio declarado?
  enunciado: ¿Se puede reconocer la sobreyectividad sin conocer el codominio declarado?
  respuesta: 'No'
  solucion_pasos:
  - La sobreyectividad depende de comparar el recorrido con el codominio; sin este
    último no se puede concluir.
- titulo: ¿Toda recta horizontal debe cortar la curva en al menos un punto para que
    sea sobreyectiva?
  enunciado: ¿Toda recta horizontal debe cortar la curva en al menos un punto para
    que sea sobreyectiva?
  respuesta: Sí
  solucion_pasos:
  - Eso garantiza que cada elemento del codominio tenga al menos una preimagen.
errores_frecuentes:
- Analizar solo el recorrido sin comparar con el codominio declarado explícitamente.
- Confundir "al menos una preimagen" (sobreyectividad) con "a lo más una preimagen"
  (inyectividad).
- Suponer que cualquier función con recorrido no acotado es automáticamente sobreyectiva
  sin verificar el codominio.
- No distinguir entre el codominio del contexto y el conjunto $\mathbb{R}$ por defecto.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando reconocimiento
  de función sobreyectiva.
