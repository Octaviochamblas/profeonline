semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_RECONOCIMIENTO
resumen_inicial: El reconocimiento gráfico de una función sobreyectiva consiste en verificar que la proyección vertical de la gráfica cubra completamente el conjunto de llegada $B$ en el eje $Y$.
explicacion_simple: '![El reconocimiento gráfico de una función sobreyectiva consiste en verificar que la proyección vertical de la gráfica cubra completamente el conjunto de llegada $B$ en el eje $Y$](/static/img/nodos/reconocimiento-de-funcion-sobreyectiva-intro.svg)



  Para saber si una función es sobreyectiva mirando su dibujo en el plano cartesiano:

  1. Mira el **conjunto de llegada $B$** en el eje vertical $Y$.

  2. Observa la gráfica de la función y proyecta todos sus puntos hacia el eje $Y$.

  3. **Criterio:** Si **toda la zona de $B$ en el eje $Y$ queda cubierta** por la gráfica (no hay franjas vacías en $B$), la función **es sobreyectiva**.

  4. Si hay partes de $B$ a las que no llega la curva, no es sobreyectiva.'
explicacion_formal: 'Sea $f: A \to B$ una función real con gráfica $\text{Graf}(f) \subset \mathbb{R}^2$. La **proyección ortogonal sobre el eje $Y$** se define como:

  $$\pi_Y(\text{Graf}(f)) = \{y \in \mathbb{R} \mid \exists x \in A, \, (x, y) \in \text{Graf}(f)\} = \text{Rec}(f)$$


  **Criterio de reconocimiento gráfico:**

  $$f \text{ es sobreyectiva} \Longleftrightarrow B \subseteq \pi_Y(\text{Graf}(f)) \Longleftrightarrow \forall y_0 \in B, \; (\,\mathbb{R} \times \{y_0\}\,) \cap \text{Graf}(f) \neq \emptyset$$


  Esto significa que toda recta horizontal trazada a la altura de cualquier elemento $y_0 \in B$ debe cortar a la gráfica **al menos una vez** ($\ge 1$ corte).'
definiciones_clave: '- **Proyección sobre el eje Y**: Sombra o intervalo vertical ocupado por la curva cartesiana.

  - **Criterio de corte no vacío**: Condición gráfica que exige al menos un punto de intersección para todo nivel de $B$.'
propiedades_relaciones: "- **Contraste con inyectividad**:\n  - Inyectiva: A lo más $1$ corte ($\\le 1$).\n  - Sobreyectiva: Al menos $1$ corte ($\\ge 1$).\n  - Biyectiva: Exactamente $1$ corte ($= 1$)."
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento gráfico de una función sobreyectiva consiste en verificar que la proyección vertical de la gráfica cubra completamente el conjunto de llegada $B$ en el eje $Y$](/static/img/nodos/reconocimiento-de-funcion-sobreyectiva-ejemplos.svg)



    Verifica gráficamente si la función $f: \mathbb{R} \to [-4, +\infty[$ dada por $f(x) = x^2 - 4$ es sobreyectiva.'
  pasos:
  - 'Paso 1: Identificar el conjunto de llegada declarado: $B = [-4, +\infty[$.'
  - 'Paso 2: Observar la gráfica: es una parábola con vértice en $(0, -4)$ que abre hacia arriba.'
  - 'Paso 3: Proyectar la curva sobre el eje Y: los valores de $y$ van desde el mínimo $-4$ hacia $+\infty$.'
  - 'Paso 4: Constatar que $\text{Rec}(f) = [-4, +\infty[$, el cual coincide exactamente con $B$.'
  - 'Paso 5: Concluir que toda recta horizontal a la altura $y \ge -4$ corta a la gráfica (al menos una vez), por lo que $f$ es sobreyectiva.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas veces debe cortar una recta horizontal trazada en el codominio B a la gráfica para que sea sobreyectiva?
  choices:
  - text: Al menos una vez (1 o mas veces).
    is_correct: true
  - text: Exactamente 0 veces.
    is_correct: false
  - text: A lo mas una vez.
    is_correct: false
  - text: Infinitas veces obligatoriamente.
    is_correct: false
  explanation: La alternativa correcta es 'Al menos una vez (1 o mas veces).'. Garantiza que todo elemento de B posee preimagen.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una función tiene codominio $B = \mathbb{R}$ pero su gráfica nunca baja del eje X ($y \ge 0$), ¿es sobreyectiva?
  choices:
  - text: No, porque los niveles con y < 0 quedan completamente vacios sin interseccion.
    is_correct: true
  - text: Si, porque cubre todos los positivos.
    is_correct: false
  - text: Si, porque pasa la prueba de la recta vertical.
    is_correct: false
  - text: Solo en x = 0.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque los niveles con y < 0 quedan completamente vacios sin interseccion.'. No cubre todo $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Delimitar en el eje $Y$ el intervalo correspondiente al codominio $B$.'
- 'Paso 2: Trazar rectas horizontales $y = c$ para valores representativos dentro de $B$.'
- 'Paso 3: Verificar que ninguna recta horizontal dentro de $B$ quede sin intersectar la gráfica.'
- 'Paso 4: Concluir formalmente sobre la sobreyectividad.'
errores_correccion: '- **Error común:** Confundir la condición de corte de sobreyectividad con la de inyectividad.

  - **Cómo corregirlo:** Para **sobreyectividad** se exige **$\ge 1$ corte** (que no quede ningún $y$ huérfano); para **inyectividad** se exige **$\le 1$ corte** (que no se repitan).'
ejemplos:
- titulo: 'Ejemplo 1: Recta afín en R'
  enunciado: 'Para $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = 2x - 3$, ¿cubre todo el eje Y?'
  alternativas:
  - Sí, se extiende infinitamente hacia arriba y hacia abajo cubriendo todo R
  - No, solo cubre los números mayores que -3
  - No, se corta en el eje X
  - Solo en el origen
  respuesta: Sí, se extiende infinitamente hacia arriba y hacia abajo cubriendo todo R
  solucion_pasos:
  - 'Paso 1: Una recta con $m \neq 0$ cubre todo el eje vertical $\mathbb{R}$, siendo sobreyectiva.'
- titulo: 'Ejemplo 2: Gráfica asintótica exponencial'
  enunciado: 'Para $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = 2^x$, ¿es sobreyectiva?'
  alternativas:
  - No, porque la gráfica tiene asíntota en y = 0 y nunca toma valores negativos
  - Sí, porque crece indefinidamente
  - Sí, porque corta al eje Y en (0, 1)
  - Solo para x > 0
  respuesta: No, porque la gráfica tiene asíntota en y = 0 y nunca toma valores negativos
  solucion_pasos:
  - 'Paso 1: $\text{Rec}(f) = ]0, +\infty[ \neq \mathbb{R}$, luego no es sobreyectiva.'
- titulo: 'Ejemplo 3: Función cúbica'
  enunciado: 'Para $g: \mathbb{R} \to \mathbb{R}$ con $g(x) = x^3$, ¿cuál es su proyección en el eje Y?'
  alternativas:
  - Todos los números reales R
  - Solo los números positivos
  - El intervalo [-1, 1]
  - Los enteros
  respuesta: Todos los números reales R
  solucion_pasos:
  - 'Paso 1: Cubre desde $-\infty$ hasta $+\infty$, siendo sobreyectiva en $\mathbb{R}$.'
- titulo: 'Ejemplo 4: Gráfica acotada'
  enunciado: Una función tiene valores entre $-2$ y $2$, y su codominio es $[-2, 2]$. ¿Es sobreyectiva?
  alternativas:
  - Sí, si alcanza todos los valores del intervalo [-2, 2]
  - No, porque está acotada
  - No, porque no es lineal
  - Depende de la derivada
  respuesta: Sí, si alcanza todos los valores del intervalo [-2, 2]
  solucion_pasos:
  - 'Paso 1: Si el recorrido cubre exactamente $[-2, 2] = B$, es sobreyectiva.'
errores_frecuentes:
- Pensar que una recta horizontal que corta 2 veces invalida la sobreyectividad.
- No verificar los extremos o límites infinitos de la función.
- Confundir el eje X con el eje Y al proyectar el rango.
afirmaciones_verdaderas:
- Una función es sobreyectiva si toda recta horizontal en su codominio corta a la gráfica al menos una vez.
- La proyección vertical de la gráfica de una función sobreyectiva es idéntica a su conjunto de llegada.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar la sobreyectividad a partir de gráficas cartesianas.


  **CÓMO:** Proyectando la curva sobre el eje Y y comprobando que cubre sin huecos todo el codominio B.


  ![Resumen El reconocimiento gráfico de una función sobreyectiva consiste en verificar que la proyección vertical de la gráfica cubra completamente el conjunto de llegada $B$ en el eje $Y$](/static/img/nodos/reconocimiento-de-funcion-sobreyectiva-resumen.svg)'
