semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_RECONOCIMIENTO
resumen_inicial: El reconocimiento de una función sobreyectiva verifica si la cobertura vertical de la gráfica abarca todo el conjunto codominio declarado.
explicacion_simple: |
  Para **reconocer si una función es sobreyectiva**:

  - **Criterio gráfico**: Revisa la altura vertical de la gráfica (su recorrido).
  - Si la gráfica cubre completamente el codominio $B$ (por ejemplo, todo el eje vertical $Y = \mathbb{R}$ sin dejar vacíos), la función es **sobreyectiva**.
  - Si la curva tiene un tope inferior o superior (como una parábola $y \ge 0$) y el codominio declarado era todo $\mathbb{R}$, **NO es sobreyectiva** porque faltan los números negativos.
explicacion_formal: |
  Sea la función $f: A \to B$ con codominio explícito $B$. El **reconocimiento de sobreyectividad** exige verificar la validez de la inclusión recíproca de conjuntos:

  $$B \subseteq \text{Rec}(f) \iff \forall y \in B, \ \exists x \in A \text{ tal que } f(x) = y$$

  **Criterio de la proyección horizontal:**
  Para todo elemento $y_0 \in B$, la recta horizontal $y = y_0$ intersecta a la gráfica de $f$ en **al menos un punto**.
definiciones_clave: |
  - **Reconocimiento de sobreyectividad**: Verificación analítica o gráfica de que la imagen proyectada de la función cubre sin omisiones todo el codominio $B$.
propiedades_relaciones: |
  - **Redefinición de codominio**: Toda función $f: A \to B$ no sobreyectiva puede volverse sobreyectiva acotando su conjunto de llegada al propio recorrido de la función.
ejemplo_guiado:
  enunciado: 'Analiza si la función afín $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = -2x + 5$ es sobreyectiva.'
  pasos:
    - 'Paso 1: Identificar el codominio declarado: $B = \mathbb{R}$.'
    - 'Paso 2: Hallar el recorrido de la recta afín: como la pendiente $m = -2 \neq 0$, la recta se extiende de $-\infty$ a $+\infty \implies \text{Rec}(f) = \mathbb{R}$.'
    - 'Paso 3: Comparar $\text{Rec}(f) = \mathbb{R}$ con el codominio $B = \mathbb{R}$.'
    - 'Paso 4: Concluir que $f$ es sobreyectiva.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuándo una función $f: A \to B$ NO es sobreyectiva?'
    choices:
      - {text: 'Cuando existen elementos del codominio B que no son alcanzados por la función.', is_correct: true}
      - {text: 'Cuando no se repiten valores de salida.', is_correct: false}
      - {text: 'Cuando su pendiente es mayor a cero.', is_correct: false}
      - {text: 'Cuando su gráfica es una recta inclinada.', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando existen elementos del codominio B que no son alcanzados por la función.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si la función $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = x^2$ se redefine como $g: \mathbb{R} \to [0, +\infty[$, ¿qué ocurre con su sobreyectividad?'
    choices:
      - {text: 'Pasa a ser sobreyectiva porque el codominio se igualó al recorrido $[0, +\infty[$.', is_correct: true}
      - {text: 'Sigue no siendo sobreyectiva.', is_correct: false}
      - {text: 'Se transforma en una función lineal.', is_correct: false}
      - {text: 'Pierde su dominio original.', is_correct: false}
    explanation: 'La alternativa correcta es ''Pasa a ser sobreyectiva porque el codominio se igualó al recorrido $[0, +\infty[$.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el codominio $B$ explicitado en la definición de la función.'
  - 'Paso 2: Calcular la proyección de la gráfica sobre el eje vertical para determinar el recorrido $\text{Rec}(f)$.'
  - 'Paso 3: Verificar si todo valor de $B$ es alcanzado por al menos un punto de la gráfica.'
  - 'Paso 4: Declarar la validez de la sobreyectividad.'
errores_correccion: |
  - **Error común:** Evaluar la sobreyectividad sin considerar cuál es el codominio $B$ declarado en el problema.
  - **Cómo corregirlo:** La sobreyectividad no se puede juzgar mirando solo la fórmula; debes **COMPARAR EL RECORRIDO CON EL CODOMINIO DECLARADO**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función sobreyectiva.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función sobreyectiva.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función es sobreyectiva si cada recta vertical corta a su gráfica en exactamente dos puntos.'
  - 'La función $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = x^2 + 5$ es sobreyectiva en todo el conjunto $\mathbb{R}$.'
  - 'Para que una función sea sobreyectiva es obligatorio que no existan elementos repetidos en las imágenes.'
  - 'El recorrido de una función sobreyectiva es siempre un conjunto estrictamente finito de números enteros.'
  - 'Redefinir el codominio de una función altera la pendiente de su representación gráfica.'
afirmaciones_verdaderas:
  - 'Una función $f: A \to B$ es sobreyectiva si toda recta horizontal trazada a la altura de cualquier $y \in B$ intersecta a su gráfica en al menos un punto.'
  - 'Al restringir o redefinir el codominio de una función para que coincida exactamente con su recorrido ($B = \text{Rec}(f)$), la función se vuelve sobreyectiva.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e identificar la sobreyectividad de funciones en diversos sistemas de representación.
  CÓMO: Proyectar el recorrido de la función y comparar la igualdad de conjuntos $\text{Rec}(f) = B$.
fuente: 'Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa'
