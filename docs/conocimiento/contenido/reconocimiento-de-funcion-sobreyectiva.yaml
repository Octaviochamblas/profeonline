semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_RECONOCIMIENTO
resumen_inicial: Reconocer la sobreyectividad exige verificar la cobertura total del
  codominio en diagramas sagitales, gráficos y definiciones explícitas.
explicacion_simple: 'Para reconocer si una función es **sobreyectiva**:

  - **En un diagrama sagital:** TODOS los elementos del óvalo de la derecha (codominio
  $B$) tienen AL MENOS UNA flecha que llega a ellos (ningún número queda suelto).

  - **En un gráfico en $\mathbb{R}$:** La curva cubre todo el eje vertical $Y$ de
  arriba a abajo si el codominio es $\mathbb{R}$.'
explicacion_formal: 'Sea $f: A \to B$. $f$ **NO es sobreyectiva** si se halla al menos
  un elemento desatendido en $B$:


  $$\exists y_0 \in B \quad \text{tal que } f^{-1}(\{y_0\}) = \emptyset$$


  **Desglose de la fórmula:**

  - Existencia de un elemento $y_0$ en el conjunto de llegada que carece de preimagen
  en el conjunto de partida.'
definiciones_clave: '- **Elemento no alcanzado ($y_0 \notin \operatorname{Rec}(f)$)**:
  Elemento del codominio que rompe la sobreyectividad.'
propiedades_relaciones: '- **Sobreyectividad de funciones afines**: Toda función afín
  o lineal no constante $f: \mathbb{R} \to \mathbb{R}$ es sobreyectiva.'
ejemplo_guiado:
  enunciado: 'Analiza la sobreyectividad de la función lineal $f: \mathbb{R} \to \mathbb{R}$
    dada por $f(x) = 3x - 5$.'
  pasos:
  - 'Paso 1: Identificar el codominio declarado: $B = \mathbb{R}$.Paso 2: Despejar
    $x$ para cualquier valor $y \in \mathbb{R}$: $y = 3x - 5 \implies 3x = y + 5 \implies
    x = \frac{y + 5}{3}$.Paso 3: Observar que para CUALQUIER número real $y$, la expresión
    $x = \frac{y + 5}{3}$ es un número real válido.Paso 4: Concluir que todo $y \in
    \mathbb{R}$ tiene preimagen real, luego $f$ es sobreyectiva.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Al despejar $x = \frac{y + 5}{3}$ para la función afín $f: \mathbb{R}
    \to \mathbb{R}$, ¿qué se demuestra sobre su sobreyectividad?'
  choices:
  - text: Que es sobreyectiva porque para todo $y \in \mathbb{R}$ existe una preimagen
      real $x$.
    is_correct: true
  - text: Que no es sobreyectiva porque la fracción divide por 3.
    is_correct: false
  - text: Que la función no está definida en cero.
    is_correct: false
  - text: Que su recorrido es únicamente los números enteros.
    is_correct: false
  explanation: La alternativa correcta es 'Que es sobreyectiva porque para todo $y
    \in \mathbb{R}$ existe una preimagen real $x$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En un diagrama sagital de $f: A \to B$, ¿qué se debe observar en el conjunto
    $B$ para confirmar sobreyectividad?'
  choices:
  - text: Que todos los elementos de $B$ reciban al menos una flecha.
    is_correct: true
  - text: Que a los elementos de $B$ solo llegue una flecha exactamente.
    is_correct: false
  - text: Que algunos elementos de $B$ queden sin flecha.
    is_correct: false
  - text: Que del conjunto $B$ salgan flechas hacia $A$.
    is_correct: false
  explanation: La alternativa correcta es 'Que todos los elementos de $B$ reciban
    al menos una flecha.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $y = f(x)$ con $y \in B$.'
- 'Paso 2: Despejar la variable $x$ en función de $y$.'
- 'Paso 3: Verificar si el despeje es siempre un elemento del dominio $A$ para todo
  $y \in B$.'
- 'Paso 4: Concluir si es o no sobreyectiva.'
errores_correccion: '- **Error común:** Pensar que para ser sobreyectiva cada elemento
  de $B$ debe recibir EXACTAMENTE una flecha.

  - **Cómo corregirlo:** Para ser sobreyectiva basta con recibir AL MENOS una flecha.
  Si recibe exactamente una y no queda ninguno suelto, es además inyectiva (biyectiva).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
