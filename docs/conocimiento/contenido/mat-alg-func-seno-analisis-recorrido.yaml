semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.RECORRIDO
resumen_inicial: 'Determinación del recorrido de la función seno: círculo unitario,
  amplitud, período y transformaciones de Análisis de la función seno.'
explicacion_simple: A diferencia del dominio, que es ilimitado, el resultado de la
  función seno siempre queda restringido a un rango pequeño y fijo de valores.
explicacion_formal: '### Definición formal


  Como $\sin(x)$ es la coordenada $y$ de un punto sobre el círculo unitario, y todo
  punto del círculo cumple $-1\leq y\leq1$, se concluye que $-1\leq\sin(x)\leq1$ para
  todo $x$. Los valores extremos $-1$ y $1$ sí se alcanzan.


  ### Desarrollo didáctico


  El máximo $\sin(x)=1$ se alcanza en $x=\pi/2$ (y en todos sus coterminales); el
  mínimo $\sin(x)=-1$ se alcanza en $x=3\pi/2$. Ningún valor de $x$ produce un resultado
  fuera de $[-1,1]$.'
definiciones_clave: '- **Determinación del recorrido de la función seno**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación del recorrido de la función seno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación del recorrido de la función seno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación del recorrido de la función seno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
