semantic_id: MAT.ALG.LENGUAJE_RELACIONES.NUMERO_IMPAR
resumen_inicial: La representación de un número impar consiste en expresar algebraicamente cualquier entero no divisible por 2 mediante la estructura canónica $2n + 1$ o $2n - 1$, donde $n$ pertenece a los números enteros.
explicacion_simple: "Un **número impar** es cualquier número entero que al dividirse por 2 deja un resto de 1 (no es divisible exactamente por 2):\n- Ejemplos numéricos de impares: $\\dots, -5, -3, -1, 1, 3, 5, 7, 9, 11, \\dots$\n- En álgebra, como todo impar es el **sucesor o antecesor de un número par ($2n$)**, se representa siempre mediante una de las estructuras:\n  - **$2n + 1$** (el par $2n$ aumentado en 1).\n  - **$2n - 1$** (el par $2n$ disminuido en 1).\n- **¿Por qué $2n + 1$ es siempre impar?**\n  - Si $n = 0 \\implies 2(0) + 1 = 1$ (Impar).\n  - Si $n = 3 \\implies 2(3) + 1 = 7$ (Impar).\n  - Si $n = -2 \\implies 2(-2) + 1 = -3$ (Impar).\n- Al sumar o restar $1$ a cualquier múltiplo de 2 ($2n$), se garantiza romper la divisibilidad par.\n\n![Número Impar](/static/img/nodos/representacion-de-un-numero-impar-intro.svg)\n"
explicacion_formal: "### Definición formal\nEl conjunto de los números enteros impares $2\\mathbb{Z} + 1 \\subset \\mathbb{Z}$ está constituido por todos los enteros $x$ tales que su resto en la división modular por $2$ es estrictamente igual a $1$:\n\n$$x \\in (2\\mathbb{Z} + 1) \\iff x \\equiv 1 \\pmod 2 \\iff \\exists n \\in \\mathbb{Z} \\quad \\text{tal que} \\quad x = 2n + 1 \\quad (\\text{o } x = 2n - 1)$$\n\n### Propiedades Operacionales de los Números Impares\n1. **Cierre de la Adición (Paridad Resultante)**: La suma de dos números impares es siempre un número par:\n   $$(2n + 1) + (2m + 1) = 2n + 2m + 2 = 2(n + m + 1) \\in 2\\mathbb{Z}$$\n2. **Cierre de la Multiplicación**: El producto de dos números impares es siempre otro número impar:\n   $$(2n + 1)(2m + 1) = 4nm + 2n + 2m + 1 = 2(2nm + n + m) + 1 \\in (2\\mathbb{Z} + 1)$$\n3. **Cuadrado Impar**: El cuadrado de un número impar es siempre de la forma $8k + 1$:\n   $$(2n + 1)^2 = 4n^2 + 4n + 1 = 4n(n + 1) + 1 = 8k + 1$$\n\n###\
  \ Síntesis didáctica\nLa estructura $2n + 1$ permite demostrar propiedades fundamentales de teoría de números, como la irracionalidad de $\\sqrt{2}$ por reducción al absurdo.\n"
definiciones_clave: '- **Número impar ($2n + 1$ / $2n - 1$)**: Expresión algebraica universal que representa a todo entero no divisible por $2$.

  - **Residuos modulares**: Resto unitario ($1$) obtenido al ejecutar la división entera por $2$.

  - **Estructura canónica impar**: Forma algebraica $2n \pm 1$ construida a partir de un múltiplo par $2n$.

  '
propiedades_relaciones: '- **Suma de Par e Impar**: La suma de un número par ($2n$) más un número impar ($2m + 1$) resulta siempre en un número impar ($2(n+m) + 1$).

  - **Cero no es impar**: El número $0$ es par, por lo que los impares contiguos al cero son $-1$ y $1$.

  '
ejemplo_guiado:
  enunciado: Demuestra algebraicamente que el producto de dos números impares cualesquiera da como resultado otro número impar.
  pasos:
  - 'Paso 1: Representamos el primer número impar como $2a + 1$ (donde $a \in \mathbb{Z}$).'
  - 'Paso 2: Representamos el segundo número impar como $2b + 1$ (donde $b \in \mathbb{Z}$).'
  - 'Paso 3: Multiplicamos ambos binomios: $(2a + 1)(2b + 1) = 4ab + 2a + 2b + 1$.'
  - 'Paso 4: Factorizamos por $2$ en los primeros tres términos: $2(2ab + a + b) + 1$.'
  - 'Paso 5: Asignamos $k = (2ab + a + b) \in \mathbb{Z}$, obteniendo la expresión $2k + 1$.'
  - 'Conclusión: La expresión **$2k + 1$ tiene la forma canónica de un número impar**, quedando demostrado.'
  imagen: /static/img/nodos/representacion-de-un-numero-impar-ejemplos.svg
checkpoints:
