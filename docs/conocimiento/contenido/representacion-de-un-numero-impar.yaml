semantic_id: MAT.ALG.LENGUAJE_RELACIONES.NUMERO_IMPAR
resumen_inicial: 'Representación de un número impar: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: 'Ya sabemos cómo hacer que cualquier número sea par (multiplicando
  por 2). ¿Y cómo lo hacemos impar? Fácil: rompiendo la paridad empujándolo un paso
  hacia adelante o hacia atrás.'
explicacion_formal: '### Definición formal


  Al anclar primero en un número seguro par ($2x$), avanzar un paso (+1) te arroja
  infaliblemente a un terreno impar.


  ### Desarrollo didáctico


  Dado que $2n$ asegura un número par, sumar 1 ($2n + 1$) o restar 1 ($2n - 1$) nos
  mueve exactamente al número consecutivo en la recta numérica. Y como sabemos, al
  lado de cualquier número par siempre habita un impar.

  - Si $n=4$, $2(4) + 1 = 9$ (impar).

  - Si $n=5$, $2(5) + 1 = 11$ (impar).


  En matemáticas formales, $2n+1$ es el estándar predilecto, aunque $2n-1$ es matemáticamente
  igual de válido.'
definiciones_clave: '- **Representación de un número impar**: Herramienta clave para
  pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de representación de un número impar.'
