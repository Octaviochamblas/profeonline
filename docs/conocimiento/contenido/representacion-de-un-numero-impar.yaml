  explanation: La alternativa correcta es 'Resulta un número par, porque al sumar las dos unidades constantes se obtiene el factor común $2(a + b + 1)$'. Impar + Impar = Par.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la necesidad de expresar una cantidad con la condición de paridad impar.'
- 'Paso 2: Definir una variable entera de base (ej: $n \in \mathbb{Z}$).'
- 'Paso 3: Construir el número par $2n$ y agregar $+ 1$ (o $- 1$) para formar $2n + 1$.'
- 'Paso 4: Para representar un segundo impar independiente, usar otra variable: $2m + 1$.'
errores_correccion: '- **Error 1:** Afirmar que $n + 1$ representa siempre un número impar. **Cómo corregirlo:** Si $n$ fuese impar (ej: $n=3$), $3+1=4$ (par). La expresión **correcta para garantizar paridad impar es $2n + 1$**.

  - **Error 2:** Declarar que la suma de dos números impares es impar. **Cómo corregirlo:** La suma de dos impares **es SIEMPRE PAR** ($(2a+1)+(2b+1) = 2(a+b+1)$).

  '
ejemplos:
- titulo: Representación de impar
  enunciado: ¿Cuál es la representación algebraica universal de un número impar?
  alternativas:
  - $2n + 1$
  - $2n$
  - $n + 1$
  respuesta: $2n + 1$
  solucion_pasos:
  - '1. Múltiplo par: $2n$.'
  - '2. Sucesor impar: $2n + 1$.'
- titulo: Producto de impares
  enunciado: Al multiplicar dos números impares, ¿el resultado es siempre un número impar?
  alternativas:
  - Sí, $(2a+1)(2b+1) = 2(2ab+a+b) + 1$
  - No, el producto da un número par
  - No, da cero
  respuesta: Sí, $(2a+1)(2b+1) = 2(2ab+a+b) + 1$
  solucion_pasos:
  - 1. Al multiplicar impares se obtiene la forma $2k + 1$.
  - 2. Por lo tanto, el producto es impar.
- titulo: Evaluación con n par
  enunciado: Para $n = 4$ (par), ¿resulta $2n + 1 = 2(4) + 1 = 9$ un número impar?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2(4) + 1 = 9$, que es impar.
- titulo: Paridad del cuadrado
  enunciado: ¿Es el cuadrado de un número impar $(2n+1)^2$ siempre un número impar?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2n+1)^2 = 4n^2 + 4n + 1 = 2(2n^2 + 2n) + 1$, que es de forma impar.
errores_frecuentes:
- Escribir n + 1 para garantizar la representación de un número impar en lugar de 2n + 1.
- Declarar que la suma de dos números impares produce como resultado otro número impar.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Intercambiar la expresión de un número impar 2n + 1 con la de un múltiplo de tres 3n.
- Afirmar que elevar un número impar al cuadrado produce un resultado de paridad par.
afirmaciones_verdaderas:
- Un número impar se representa algebraicamente mediante la expresión canónica 2n + 1 o 2n - 1 (con n entero).
- El producto de dos números impares produce siempre como resultado otro número impar.
al_terminar_debes_poder: '![Resumen de número impar](/static/img/nodos/representacion-de-un-numero-impar-resumen.svg)


  QUÉ: Representar la forma algebraica canónica de un número impar cualquiera.


  CÓMO: Sumar o restar una unidad a un múltiplo de dos ($2n + 1$ o $2n - 1$) con $n \in \mathbb{Z}$.'
