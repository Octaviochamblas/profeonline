procedimiento:
- 'Paso 1: Construye el ''escudo par'' multiplicando una variable por 2 (2n).'
- 'Paso 2: Suma o resta 1 al bloque anterior.'
- 'Paso 3: Protege la expresión (2n+1) entre paréntesis si la vas a multiplicar o
  elevar a potencias.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  representación de un número impar.
ejemplos:
- titulo: El impar al cuadrado
  enunciado: 'Traduce algebraicamente: ''El cuadrado de un número impar''.'
  solucion_pasos:
  - 'Construimos el número impar: (2n + 1).'
  - Elevamos todo el bloque al cuadrado.
  - 'Traducción final: (2n + 1)^2.'
- titulo: Un arquitecto quiere diseñar un estadio donde el número de asientos en cada
    fila sea siempre
  enunciado: 'Un arquitecto quiere diseñar un estadio donde el número de asientos
    en cada fila sea siempre impar para garantizar un pasillo central simétrico. Si
    la fórmula depende de un parámetro de crecimiento $k$, ¿cuál de las siguientes
    fórmulas para el número de asientos por fila le servirá? (v1)


    Opciones: A) Asientos $= 2k + 1$ · B) Asientos $= 3k$ · C) Asientos $= k^2 + 1$
    · D) Asientos $= k / 2 + 1$'
  solucion_pasos:
  - La única estructura polinómica que garantiza generar valores impares para cualquier
    entero k es $2k+1$. Por ejemplo, en B ($3k$), si k=2, los asientos serían 6 (par).
  - 'Respuesta: Asientos $= 2k + 1$'
- titulo: 'Respecto de «Representación de un número impar»: ¿Describe adecuadamente
    el concepto esta fr'
  enunciado: 'Respecto de «Representación de un número impar»: ¿Describe adecuadamente
    el concepto esta frase? «Un **Número Impar** se traduce algebraicamente como **$2n
    + 1$** (o $2n - 1$), donde $n$ pertenece a los enteros»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Número Impar** se traduce
    algebraicamente como **$2n + 1$** (o $2n - 1$), donde $n$ pertenece a los enteros.'
- titulo: 'Respecto de «Representación de un número impar»: ¿Se puede aceptar esta
    afirmación? «Usar si'
  enunciado: 'Respecto de «Representación de un número impar»: ¿Se puede aceptar esta
    afirmación? «Usar simplemente $x$ o $y$ para denotar un impar. (La variable libre
    puede tomar cualquier valor)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Número Impar** se traduce
    algebraicamente como **$2n + 1$** (o $2n - 1$), donde $n$ pertenece a los enteros.'
errores_frecuentes:
- Usar simplemente $x$ o $y$ para denotar un impar. (La variable libre puede tomar
  cualquier valor).
- Usar $x+1$ para forzar un impar. (Si $x$ era 3, $x+1$ es 4, que es par. $x+1$ solo
  da el sucesor, no la imparidad absoluta).
- El número $1$ es impar, y al sumarlo a cualquier otro número lo vuelve impar por
  contigüidad.
- El factor $2$ multiplica a la variable, y luego la suma de $1$ cancela el efecto
  del $2$.
- Es una simple convención sin sustento aritmético real.
afirmaciones_verdaderas:
- La traducción de representación de un número impar preserva el significado matemático
  del enunciado.
