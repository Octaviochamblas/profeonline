resumen_inicial: La representación de un número impar permite representar estructuras
  matemáticas de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con representación de un número impar, transformamos
  frases sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Representación
  de un número impar** viene dada por:


  $$\text{"un número impar cualquiera en función de k entero"} \implies 2k + 1$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Representación de un número impar**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: 2k + 1 define la estructura
  requerida.'
