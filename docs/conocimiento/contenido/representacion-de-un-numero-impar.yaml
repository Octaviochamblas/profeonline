errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir representación
  de un número impar.
- Invertir el orden de las variables al construir la expresión de representación de
  un número impar.
- Usar una suma cuando el enunciado de representación de un número impar exige una
  resta o división.
- Omitir paréntesis al multiplicar expresiones en representación de un número impar.
- Declarar que la expresión de representación de un número impar es válida sólo para
  números pares.
afirmaciones_verdaderas:
- La traducción simbólica de representación de un número impar preserva la relación
