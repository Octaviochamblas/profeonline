semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.SIGNO_FUNCION
resumen_inicial: 'La lectura del signo de una función cuadrática determina los intervalos del dominio donde la parábola se ubica por sobre el eje $x$ ($f(x) > 0$) o por debajo del eje $x$ ($f(x) < 0$).'
explicacion_simple: |
  Analizar el signo de una función cuadrática desde su gráfica significa identificar para qué valores de $x$ las alturas $y$ son positivas o negativas. La curva que queda arriba de la línea del piso (eje $x$) representa zonas donde $f(x) > 0$, mientras que los tramos que quedan sumergidos por debajo del suelo representan zonas donde $f(x) < 0$. Los puntos donde toca el suelo son los ceros donde $f(x) = 0$.
explicacion_formal: |
  ### Definición formal
  El **estudio de signos** de la función cuadrática $f(x) = ax^2 + bx + c$ de ceros reales $x_1 < x_2$ particiona el dominio $\mathbb{R}$ en tres intervalos disjuntos:
  $$]-\infty, x_1[, \quad ]x_1, x_2[, \quad ]x_2, +\infty[$$
  El signo de la función en cada subintervalo depende de la concavidad $a$:
  - Si $a > 0$: $f(x) > 0$ en los intervalos exteriores $]-\infty, x_1[ \cup ]x_2, +\infty[$; y $f(x) < 0$ en el intervalo interior $]x_1, x_2[$.
  - Si $a < 0$: $f(x) < 0$ en los intervalos exteriores $]-\infty, x_1[ \cup ]x_2, +\infty[$; y $f(x) > 0$ en el intervalo interior $]x_1, x_2[$.

  ### Desglose simbólico
  - $f(x) > 0$: Región del plano cartesiano correspondiente al semiplano superior $y > 0$.
  - $f(x) < 0$: Región del plano cartesiano correspondiente al semiplano inferior $y < 0$.
  - $f(x) = 0$: Puntos frontera $x \in \{x_1, x_2\}$.

  ### Síntesis didáctica
  La parábola solo puede cambiar de signo al atravesar el eje $x$ en sus ceros reales. Si la función no tiene ceros reales ($\Delta < 0$), conserva un único signo constante en todo el dominio $\mathbb{R}$ (siempre positiva si $a > 0$, siempre negativa si $a < 0$).
definiciones_clave: |
  - **Signo de la función**: Condición de positividad ($f(x) > 0$) o negatividad ($f(x) < 0$) de las ordenadas.
  - **Intervalo de positividad**: Subconjunto de preimágenes $x$ para las cuales la parábola yace sobre el eje $x$.
  - **Intervalo de negatividad**: Subconjunto de preimágenes $x$ para las cuales la parábola yace por debajo del eje $x$.
propiedades_relaciones: |
  - **Resolución gráfica de inecuaciones cuadráticas**: Hallar el conjunto solución de $ax^2 + bx + c > 0$ equivale a extraer el intervalo de positividad de la función cuadrática asociada.
  - **Conservación de signo en $\Delta < 0$**: Si $\Delta < 0$, la función nunca cambia de signo en ningún punto del plano.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = x^2 - 4x + 3$ cuyas raíces son $x_1 = 1$ y $x_2 = 3$, determina los intervalos de positividad $f(x) > 0$ y negatividad $f(x) < 0$ a partir del análisis gráfico de su concavidad.'
  pasos:
    - 'Paso 1: Identificamos los coeficientes: $a = 1 > 0$, por lo que la parábola es cóncava hacia arriba.'
    - 'Paso 2: Ubicamos las raíces en la recta real: $x_1 = 1$ y $x_2 = 3$.'
    - 'Paso 3: Al abrir hacia arriba, las ramas quedan sobre el eje $x$ fuera del intervalo de raíces, por lo que $f(x) > 0$ para $x \in ]-\infty, 1[ \cup ]3, +\infty[$.'
    - 'Paso 4: El sector que contiene al vértice $(2, -1)$ queda bajo el eje $x$, por lo que $f(x) < 0$ para $x \in ]1, 3[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una parábola es cóncava hacia abajo ($a < 0$) y posee ceros en $x_1 = -2$ y $x_2 = 5$, ¿en qué intervalo de $x$ la función es strictly positiva ($f(x) > 0$)?'
    choices:
      - {text: 'En el intervalo abierto entre las raíces $]-2, 5[$', is_correct: true}
      - {text: 'En la unión de intervalos $]-\infty, -2[ \cup ]5, +\infty[$', is_correct: false}
      - {text: 'En el intervalo cerrado $[-2, 5]$', is_correct: false}
      - {text: 'En todo el dominio de los números reales $\mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''En el intervalo abierto entre las raíces $]-2, 5[$''. Al abrir hacia abajo ($a < 0$), la cima de la parábola se eleva por sobre el eje $x$ entre las dos raíces.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función cuadrática $g(x) = 2x^2 + 8$ con $\Delta < 0$, ¿para qué valores de $x$ se cumple que $g(x) > 0$?'
    choices:
      - {text: 'Para todos los números reales $x \in \mathbb{R}$', is_correct: true}
      - {text: 'Para ningún número real (conjunto vacío $\emptyset$)', is_correct: false}
      - {text: 'Únicamente para $x > 0$', is_correct: false}
      - {text: 'Únicamente en el vértice $x = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''Para todos los números reales $x \in \mathbb{R}$''. Como $a = 2 > 0$ y $\Delta < 0$, la curva flota completamente sobre el eje $x$, siendo siempre positiva.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar las raíces reales de la función cuadrática resolviendo $f(x) = 0$.'
  - 'Paso 2: Determinar la concavidad de la parábola a través del signo de $a$.'
  - 'Paso 3: Si $a > 0$, $f(x) > 0$ fuera de las raíces y $f(x) < 0$ entre las raíces. Si $a < 0$, $f(x) < 0$ fuera de las raíces y $f(x) > 0$ entre las raíces.'
errores_correccion: |
  - **Error 1:** Incluir las raíces $x_1$ y $x_2$ dentro de los intervalos estrictos de positividad o negatividad. **Cómo corregirlo:** En las raíces, la función vale exactamente cero ($f(x_1) = 0$), por lo que los intervalos estrictos de $f(x) > 0$ o $f(x) < 0$ deben ser abiertos en las raíces.
  - **Error 2:** Creer que la función es positiva donde la variable $x$ es positiva. **Cómo corregirlo:** El signo de la función se refiere a la altura $y = f(x)$, no al signo de la preimagen $x$. Una preimagen $x$ negativa puede producir un valor de salida $f(x)$ positivo.
ejemplos:
  - titulo: 'Lectura de positividad en parábola cóncava hacia arriba'
    enunciado: 'Si $f(x) = (x - 2)(x - 6)$, ¿para qué valores de $x$ se cumple que $f(x) < 0$?'
    alternativas:
      - '$x \in ]2, 6[$'
      - '$x \in ]-\infty, 2[ \cup ]6, +\infty[$'
      - '$x \in [2, 6]$'
    respuesta: '$x \in ]2, 6[$'
    solucion_pasos:
      - '1. Los ceros son $x_1 = 2$ y $x_2 = 6$, y $a = 1 > 0$.'
      - '2. Al abrir hacia arriba, la curva se sumerge bajo el eje $x$ únicamente entre las raíces.'
      - '3. Por lo tanto, $f(x) < 0$ en $]2, 6[$.'
  - titulo: 'Lectura de negatividad en parábola cóncava hacia abajo'
    enunciado: 'Dada $g(x) = -(x + 1)(x - 4)$, ¿para qué valores de $x$ la función es negativa ($g(x) < 0$)?'
    alternativas:
      - '$x \in ]-\infty, -1[ \cup ]4, +\infty[$'
      - '$x \in ]-1, 4[$'
      - '$x \in [-1, 4]$'
    respuesta: '$x \in ]-\infty, -1[ \cup ]4, +\infty[$'
    solucion_pasos:
      - '1. Las raíces son $x_1 = -1$ y $x_2 = 4$, con $a = -1 < 0$.'
      - '2. Al abrir hacia abajo, las ramas descienden por debajo del eje $x$ por fuera de las raíces.'
      - '3. Por lo tanto, $g(x) < 0$ en $]-\infty, -1[ \cup ]4, +\infty[$.'
  - titulo: 'Signo constante en parábola sin raíces real'
    enunciado: 'Si $f(x) = -x^2 - 3$, ¿la función es estrictamente negativa para todo $x \in \mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -1 < 0$ y $\Delta = -12 < 0$, toda la curva yace en el semiplano inferior $y < 0$.'
  - titulo: 'Valor de la función en la frontera'
    enunciado: 'Si $x_1 = 4$ es una raíz de $f(x)$, ¿el punto $(4, f(4))$ pertenece al intervalo de positividad $f(x) > 0$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. En $x_1 = 4$, $f(4) = 0$, el cual no es estrictamente mayor que cero.'
errores_frecuentes:
  - 'Una función cuadrática es positiva únicamente en los valores de $x$ que son positivos.'
  - 'El conjunto solución de la inecuación $f(x) > 0$ incluye siempre a los ceros $x_1$ y $x_2$.'
  - 'Si el vértice de una parábola se ubica en $y = -5$, la función es negativa en todo su dominio.'
  - 'Una función cuadrática cóncava hacia abajo siempre es totalmente negativa en todos los números reales.'
  - 'El signo de la función cuadrática cambia en el punto del vértice de la parábola.'
afirmaciones_verdaderas:
  - 'El signo de una función cuadrática sólo puede cambiar de positivo a negativo (o viceversa) al cruzar a través de sus ceros reales.'
  - 'Una función cuadrática sin ceros reales ($\Delta < 0$) mantiene un signo constante único para todos los números reales de su dominio.'
al_terminar_debes_poder: 'Determinar los intervalos de positividad y negatividad de cualquier función cuadrática a partir de la lectura de su gráfica o el análisis de sus ceros y concavidad.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
