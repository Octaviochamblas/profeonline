procedimiento:
- 'Paso 1: Identifica los ceros de la función, que dividen el eje $x$ en intervalos.'
- 'Paso 2: Para cada intervalo, observa si la parábola está por encima o por debajo
  del eje $x$.'
- 'Paso 3: Concluye el signo de la función en cada intervalo correspondiente.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en lectura del signo de la función cuadrática a
  partir de su gráfica.
ejemplos:
- titulo: Lectura de signo con parábola cóncava hacia arriba
  enunciado: Para $f(x)=x^2-9$, con ceros en $x=-3$ y $x=3$, ¿dónde es $f(x)<0$?
  solucion_pasos:
  - Entre los ceros, la parábola (cóncava hacia arriba) está por debajo del eje $x$.
  - $f(x)<0$ para $x \in ]-3,3[$.
- titulo: Lectura de signo con parábola cóncava hacia abajo
  enunciado: Para $f(x)=-x^2+9$, con ceros en $x=-3$ y $x=3$, ¿dónde es $f(x)>0$?
  solucion_pasos:
  - Entre los ceros, la parábola (cóncava hacia abajo) está por encima del eje $x$.
  - $f(x)>0$ para $x \in ]-3,3[$.
- titulo: ¿El signo de la función cambia siempre exactamente en sus ceros?
  enunciado: ¿El signo de la función cambia siempre exactamente en sus ceros?
  respuesta: Sí
  solucion_pasos:
  - Los ceros son los únicos puntos donde la gráfica cruza el eje $x$, marcando el
    límite entre los intervalos de signo constante.
- titulo: ¿Una función sin ceros reales puede cambiar de signo?
  enunciado: ¿Una función sin ceros reales puede cambiar de signo?
  respuesta: 'No'
  solucion_pasos:
  - Sin ceros, la gráfica nunca cruza el eje $x$, por lo que el signo de la función
    es el mismo en todo su dominio.
errores_frecuentes:
- Invertir los intervalos de signo positivo y negativo al no considerar la concavidad
  de la parábola.
- Incluir o excluir incorrectamente los ceros en los intervalos de signo (los ceros
  son donde $f(x)=0$, no positivo ni negativo).
- Asumir que toda función cuadrática cambia de signo, sin verificar si tiene ceros
  reales.
- Confundir el signo de la función con el signo del coeficiente $a$.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  lectura del signo de la función cuadrática a partir de su gráfica.
