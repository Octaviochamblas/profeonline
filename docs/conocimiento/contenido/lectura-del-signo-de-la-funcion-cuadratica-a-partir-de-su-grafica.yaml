semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.SIGNO_FUNCION
resumen_inicial: 'Lectura del signo de la función cuadrática a partir de su gráfica:
  parábola, vértice, concavidad y formas de Análisis gráfico: parábola, concavidad
  e intersecciones.'
explicacion_simple: Observando simplemente si la parábola está por encima o por debajo
  del eje $x$ en cada tramo, se puede leer directamente el signo de la función sin
  hacer ningún cálculo adicional.
explicacion_formal: '### Definición formal


  Dada la gráfica de $f(x)=ax^2+bx+c$, se tiene $f(x)>0$ en los intervalos donde la
  parábola está por encima del eje $x$; $f(x)<0$ donde está por debajo; y $f(x)=0$
  exactamente en los ceros de la función (si existen).


  ### Desarrollo didáctico


  Los ceros de la función dividen el eje $x$ en intervalos donde el signo de la función
  se mantiene constante; basta con observar en qué intervalo la curva está arriba
  o abajo del eje.


  Para $f(x)=x^2-4$, con ceros en $x=-2$ y $x=2$: la parábola está por debajo del
  eje $x$ entre $-2$ y $2$ (donde $f(x)<0$), y por encima fuera de ese intervalo (donde
  $f(x)>0$).'
definiciones_clave: '- **Lectura del signo de la función cuadrática a partir de su
  gráfica**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  lectura del signo de la función cuadrática a partir de su gráfica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando lectura del
    signo de la función cuadrática a partir de su gráfica.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a lectura
    del signo de la función cuadrática a partir de su gráfica.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
