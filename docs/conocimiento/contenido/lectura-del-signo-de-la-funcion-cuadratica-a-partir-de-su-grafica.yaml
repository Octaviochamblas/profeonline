semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.SIGNO_FUNCION
resumen_inicial: La lectura del signo de una función cuadrática a partir de su gráfica consiste en identificar los intervalos del dominio donde la parábola se sitúa por encima del eje $X$ ($f(x) > 0$, positiva) o por debajo del eje $X$ ($f(x) < 0$, negativa), utilizando los ceros reales como puntos de cambio de signo.
explicacion_simple: '![La lectura del signo de una función cuadrática a partir de su gráfica consiste en identificar los intervalos del dominio donde la parábola se sitúa por encima del eje $X$ ($f(x) > 0$, positiva) o por debajo del eje $X$ ($f(x) < 0$, negativa), utilizando los ceros reales como puntos de cambio de signo](/static/img/nodos/lectura-del-signo-de-la-funcion-cuadratica-a-partir-de-su-grafica-intro.svg)



  Mirar el signo de una función en su gráfico es muy visual:


  - **$f(x) > 0$ (Positiva):** Son todos los tramos de la curva que están **arriba del eje $X$** (las $y$ son positivas).

  - **$f(x) < 0$ (Negativa):** Son todos los tramos de la curva que están **abajo del eje $X$** (las $y$ son negativas).

  - **$f(x) = 0$ (Cero):** Son los puntos exactos donde la curva toca el eje $X$ (las raíces).


  *Ejemplo:* Una parábola que abre hacia arriba con raíces en $x = 1$ y $x = 5$:

  - Es **positiva ($> 0$)** en los extremos: $]-\infty, 1[ \cup ]5, +\infty[$.

  - Es **negativa ($< 0$)** en la cubeta central: $]1, 5[$.'
explicacion_formal: "Sea $f(x) = ax^2 + bx + c$ con ceros reales ordenados $x_1 < x_2$. El **análisis de signo por descomposición de Jordan del dominio** divide a $\\mathbb{R}$ en intervalos abiertos disjuntos:\n$$\\mathbb{R} \\setminus \\{x_1, x_2\\} = ]-\\infty, x_1[ \\; \\cup \\; ]x_1, x_2[ \\; \\cup \\; ]x_2, +\\infty[$$\n\n**Regla de Signos Topológica**:\n1. **Si $a > 0$ (Cóncava hacia arriba)**:\n   $$f(x) > 0 \\iff x \\in ]-\\infty, x_1[ \\cup ]x_2, +\\infty[, \\quad f(x) < 0 \\iff x \\in ]x_1, x_2[$$\n2. **Si $a < 0$ (Cóncava hacia abajo)**:\n   $$f(x) > 0 \\iff x \\in ]x_1, x_2[, \\quad f(x) < 0 \\iff x \\in ]-\\infty, x_1[ \\cup ]x_2, +\\infty[$$\n3. **Si $\\Delta < 0$ (Sin ceros reales)**:\n   - Si $a > 0 \\implies f(x) > 0, \\; \\forall x \\in \\mathbb{R}$ (estrictamente positiva).\n   - Si $a < 0 \\implies f(x) < 0, \\; \\forall x \\in \\mathbb{R}$ (estrictamente negativa)."
definiciones_clave: '- **Conjunto de positividad $\mathcal{P}^+$**: Intervalos donde la ordenada es estrictamente mayor que cero: $\{x \in \mathbb{R} \mid f(x) > 0\}$.

  - **Conjunto de negatividad $\mathcal{P}^-$**: Intervalos donde la ordenada es estrictamente menor que cero: $\{x \in \mathbb{R} \mid f(x) < 0\}$.'
propiedades_relaciones: '- **Exclusión de los ceros**: Los ceros $x_1, x_2$ no pertenecen a la positividad ni a la negatividad ($f(x_i) = 0$ es nulo).

  - **Resolución de inecuaciones cuadráticas**: Resolver $ax^2 + bx + c > 0$ es equivalente a hallar el conjunto de positividad de la función cuadrática.'
ejemplo_guiado:
  enunciado: '![Ejemplo La lectura del signo de una función cuadrática a partir de su gráfica consiste en identificar los intervalos del dominio donde la parábola se sitúa por encima del eje $X$ ($f(x) > 0$, positiva) o por debajo del eje $X$ ($f(x) < 0$, negativa), utilizando los ceros reales como puntos de cambio de signo](/static/img/nodos/lectura-del-signo-de-la-funcion-cuadratica-a-partir-de-su-grafica-ejemplos.svg)



    A partir de la función $f(x) = -x^2 + 4x - 3$, determina los intervalos donde $f(x) > 0$ y donde $f(x) < 0$.'
  pasos:
  - 'Paso 1: Identificar concavidad: $a = -1 < 0 \implies$ parábola cóncava hacia abajo ($\cap$).'
  - 'Paso 2: Calcular ceros: $-x^2 + 4x - 3 = 0 \implies x^2 - 4x + 3 = (x - 1)(x - 3) = 0 \implies x_1 = 1, \; x_2 = 3$.'
  - 'Paso 3: Analizar la posición gráfica:

    - La cumbre de la parábola queda por encima del eje $X$ entre las raíces.

    - Las ramas caen por debajo del eje $X$ hacia los extremos.'
  - 'Paso 4: Concluir los intervalos de signo:

    - **Positiva ($f(x) > 0$):** $x \in ]1, 3[$.

    - **Negativa ($f(x) < 0$):** $x \in ]-\infty, 1[ \cup ]3, +\infty[$.

    - **Cero ($f(x) = 0$):** $x \in \{1, 3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una parábola abre hacia arriba (a > 0) y tiene raíces en x = -2 y x = 4, ¿en qué intervalo es f(x) < 0 (negativa)?
  choices:
  - text: ']-2, 4['
    is_correct: true
  - text: ']-∞, -2[ ∪ ]4, +∞['
    is_correct: false
  - text: '[-2, 4]'
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es ']-2, 4['. Al abrir hacia arriba, la cubeta central que une las dos raíces queda por debajo del eje $X$, por lo que $f(x) < 0$ en $]-2, 4[$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene a > 0 y discriminante Δ < 0, ¿para qué valores de x se cumple f(x) > 0?
  choices:
  - text: Para todo x perteneciente a ℝ (siempre positiva)
    is_correct: true
  - text: Para ningún x
    is_correct: false
  - text: Solo para x > 0
    is_correct: false
  - text: En el vértice
    is_correct: false
  explanation: La alternativa correcta es 'Para todo x perteneciente a ℝ (siempre positiva)'. Al abrir hacia arriba sin tocar el eje $X$, toda la curva queda estrictamente en el semiplano superior.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar la concavidad de la parábola mediante el signo de $a$.'
- 'Paso 2: Calcular los ceros reales $x_1$ y $x_2$ resolviendo $f(x) = 0$.'
- 'Paso 3: Identificar visual o algebraicamente qué porciones de la curva quedan sobre el eje $X$ ($y > 0$) y bajo el eje $X$ ($y < 0$).'
- 'Paso 4: Expresar los intervalos de positividad y negatividad en notación de intervalos abiertos.'
errores_correccion: '- **Error común:** Usar corchetes cerrados $[x_1, x_2]$ al escribir los intervalos donde $f(x) > 0$.

  - **Cómo corregirlo:** En los extremos $x_1$ y $x_2$, la función vale exactamente **cero ($f(x)=0$)**, por lo que deben usarse **intervalos abiertos $]x_1, x_2[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Positividad en ramas externas'
  enunciado: Para $f(x) = x^2 - 16$, ¿en qué intervalo es $f(x) > 0$?
  alternativas:
  - ']-inf, -4[ U ]4, +inf['
  - ']-4, 4['
  - '[-4, 4]'
  - ']0, +inf['
  respuesta: ']-inf, -4[ U ]4, +inf['
  solucion_pasos:
  - 'Paso 1: $a = 1 > 0$ y ceros en $\pm 4 \implies f(x) > 0$ en $]-\infty, -4[ \cup ]4, +\infty[$.'
- titulo: 'Ejemplo 2: Negatividad en parábola invertida'
  enunciado: Si $g(x) = -(x - 2)(x - 8)$, ¿dónde es $g(x) < 0$?
  alternativas:
  - ']-inf, 2[ U ]8, +inf['
  - ']2, 8['
  - '[2, 8]'
  - En todo R
  respuesta: ']-inf, 2[ U ]8, +inf['
  solucion_pasos:
  - 'Paso 1: $a = -1 < 0 \implies$ ramas hacia abajo en los extremos $]-\infty, 2[ \cup ]8, +\infty[$.'
- titulo: 'Ejemplo 3: Parábola estrictamente negativa'
  enunciado: Si $h(x) = -x^2 - 4$, ¿cuál es el signo de h(x) para cualquier número real x?
  alternativas:
  - Siempre negativa (h(x) < 0 para todo x en R)
  - Siempre positiva
  - Positiva en x > 2
  - Cero en x = 2
  respuesta: Siempre negativa (h(x) < 0 para todo x en R)
  solucion_pasos:
  - 'Paso 1: $a = -1 < 0$ y $\Delta = -16 < 0 \implies$ parábola totalmente bajo el eje $X$.'
- titulo: 'Ejemplo 4: Signo con cero único tangente'
  enunciado: En $f(x) = (x - 3)^2$, ¿dónde se cumple $f(x) > 0$?
  alternativas:
  - R - {3}
  - R
  - ']3, +inf['
  - '[3, +inf['
  respuesta: R - {3}
  solucion_pasos:
  - 'Paso 1: Es positiva en todo $\mathbb{R}$ excepto en $x = 3$ donde vale $0$.'
errores_frecuentes:
- Incluir los ceros dentro de los intervalos estrictos > 0 o < 0.
- Invertir los intervalos de positividad y negatividad al olvidar considerar el signo de a.
- Confundir el signo de x con el signo de la imagen f(x).
afirmaciones_verdaderas:
- Los intervalos de signo de una función cuadrática quedan delimitados por sus ceros reales.
- Si una parábola no corta al eje X (Δ < 0), conserva el mismo signo estrictamente en todo su dominio ℝ.
al_terminar_debes_poder: '**QUÉ:** Leer y determinar los intervalos de signo de una función cuadrática a partir de su gráfica.


  **CÓMO:** Identificando los tramos por encima del eje X (f(x) > 0) y por debajo del eje X (f(x) < 0) delimitados por los ceros.


