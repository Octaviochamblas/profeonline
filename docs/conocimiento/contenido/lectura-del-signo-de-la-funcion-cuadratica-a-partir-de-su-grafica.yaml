semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.SIGNO_FUNCION
resumen_inicial: La lectura del signo de la función determina las regiones del plano donde la parábola se ubica sobre ($f(x) > 0$) o debajo ($f(x) < 0$) del eje X.
explicacion_simple: |
  El **signo de la función** se refiere a si el valor de la salida $y = f(x)$ es **positivo ($+$)** o **negativo ($-$)**:

  - Visualmente en el gráfico de la parábola:
    - La función es **POSITIVA ($f(x) > 0$)** en los tramos donde la curva está **POR ENCIMA DEL EJE X**.
    - La función es **NEGATIVA ($f(x) < 0$)** en los tramos donde la curva está **POR DEBAJO DEL EJE X**.
    - La función es **CERO ($f(x) = 0$)** exactamente en los puntos donde **TOCA O CRUZA EL EJE X**.
explicacion_formal: |
  Sea la función cuadrática $f(x) = ax^2 + bx + c$ con raíces reales $x_1 < x_2$. El **análisis de signo de la imagen** particiona la recta real $\mathbb{R}$ en tres intervalos disjuntos:

  $$\mathbb{R} = (-\infty, x_1) \cup \{x_1, x_2\} \cup (x_2, +\infty)$$

  **Regla de signos según la concavidad de la parábola:**
  1. **Si $a > 0$ (Cóncava hacia arriba):**
     - $f(x) > 0$ en los intervalos exteriores $(-\infty, x_1) \cup (x_2, +\infty)$ (curva por sobre el eje X).
     - $f(x) < 0$ en el intervalo interior $(x_1, x_2)$ (curva por debajo del eje X).
  2. **Si $a < 0$ (Cóncava hacia abajo):**
     - $f(x) < 0$ en los intervalos exteriores $(-\infty, x_1) \cup (x_2, +\infty)$.
     - $f(x) > 0$ en el intervalo interior $(x_1, x_2)$.
definiciones_clave: |
  - **Signo de la función cuadrática**: Propiedad que indica la positividad ($f(x) > 0$), negatividad ($f(x) < 0$) o nulidad ($f(x) = 0$) de los valores de imagen en el plano.
propiedades_relaciones: |
  - **Positividad o Negatividad Estricta**: Si el discriminante es negativo ($\Delta < 0$), la función conserva el mismo signo en todo su dominio real ($f(x) > 0, \forall x$ si $a > 0$; $f(x) < 0, \forall x$ si $a < 0$).
ejemplo_guiado:
  enunciado: 'A partir del gráfico de $f(x) = x^2 - 4$, cuyos ceros son $x_1 = -2$ y $x_2 = 2$, determina en qué intervalo la función es negativa ($f(x) < 0$).'
  pasos:
    - 'Paso 1: Identificar el signo de $a$: $a = 1 > 0$, la parábola se abre hacia arriba.'
    - 'Paso 2: Observar la gráfica: la zona por debajo del eje X queda entre los dos ceros.'
    - 'Paso 3: Leer el intervalo horizontal comprendido entre los cortes: desde $-2$ hasta $2$.'
    - 'Paso 4: Concluir que $f(x) < 0$ en el intervalo abierto $(-2, 2)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la parábola $f(x) = ax^2 + bx + c$ se abre hacia arriba ($a > 0$) y tiene cortes en $x_1 = 1$ y $x_2 = 5$, ¿dónde es positiva la función ($f(x) > 0$)?'
    choices:
      - {text: 'En los intervalos exteriores $(-\infty, 1) \cup (5, +\infty)$', is_correct: true}
      - {text: 'En el intervalo interior $(1, 5)$.', is_correct: false}
      - {text: 'Únicamente en el punto $x = 3$.', is_correct: false}
      - {text: 'En ningún valor real.', is_correct: false}
    explanation: 'La alternativa correcta es ''En los intervalos exteriores $(-\infty, 1) \cup (5, +\infty)$''. Al abrirse hacia arriba, la curva sobrepasa el eje X en las ramas externas.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si una parábola se ubica completamente por encima del eje X sin tocarlo jamás, ¿cuál es el signo de $f(x)$ para todo $x \in \mathbb{R}$?'
    choices:
      - {text: 'La función es estrictamente positiva ($f(x) > 0$)', is_correct: true}
      - {text: 'La función es strictly negativa ($f(x) < 0$).', is_correct: false}
      - {text: 'La función vale cero en todo el dominio.', is_correct: false}
      - {text: 'La función no tiene signo definido.', is_correct: false}
    explanation: 'La alternativa correcta es ''La función es estrictamente positiva ($f(x) > 0$)''. Al estar toda la curva por encima del eje X, sus ordenadas son positivas.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar los ceros $x_1, x_2$ donde la gráfica toca o corta al eje X.'
  - 'Paso 2: Analizar visualmente qué partes de la parábola quedan sobre el eje X ($y > 0$) y cuáles bajo el eje X ($y < 0$).'
  - 'Paso 3: Relacionar la concavidad (signo de $a$) con las zonas de positividad exterior o interior.'
  - 'Paso 4: Escribir los intervalos de solución usando notación de conjuntos.'
errores_correccion: |
  - **Error común:** Confundir el signo de la variable $x$ con el signo de la función $f(x) = y$.
  - **Cómo corregirlo:** El signo de la función **MIRA LA ALTURA EN $Y$**; si la curva está por encima del eje X, $f(x)$ es positiva sin importar si $x$ es positivo o negativo.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Intervalo de positividad exterior.
    alternativas:
      - '$f(x) > 0 \in (-\infty, -3) \cup (3, +\infty)$'
      - '$f(x) > 0 \in (-3, 3)$'
      - '$f(x) > 0$ únicamente en $x = 0$'
    respuesta: '$f(x) > 0 \in (-\infty, -3) \cup (3, +\infty)$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Función estrictamente positiva.
    alternativas:
      - '$f(x) > 0$ en todo $\mathbb{R}$'
      - '$f(x) < 0$ en todo $\mathbb{R}$'
      - '$f(x) = 0$ en todo $\mathbb{R}$'
    respuesta: '$f(x) > 0$ en todo $\mathbb{R}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La equivalencia errónea entre el signo de la coordenada $x$ del punto y el signo de la imagen de salida $f(x)$.'
  - 'Incluir los ceros de la función $x_1, x_2$ dentro de los intervalos estrictos de positividad $f(x) > 0$.'
  - 'La suposición de que si la concavidad es negativa ($a < 0$), la función no puede tomar ningún valor positivo.'
  - 'La falta de consideración de que los tramos por encima del eje horizontal representan valores donde $f(x) > 0$.'
  - 'Ignorar que el cambio de signo de la función ocurre únicamente al cruzar las raíces en el eje X.'
afirmaciones_verdaderas:
  - 'La función cuadrática es positiva $f(x) > 0$ en los tramos de la parábola ubicados por sobre el eje X y negativa $f(x) < 0$ por debajo.'
  - 'Los ceros $x_1, x_2$ marcan las fronteras exactas donde la función cambia de signo en el dominio real.'
al_terminar_debes_poder: |
  QUÉ: Leer y determinar las regiones de signo positivo, negativo y nulo de una función cuadrática a partir de su gráfica.
  CÓMO: Identificar ceros, evaluar la posición de la curva respecto al eje X y expresar los intervalos $f(x) > 0$ y $f(x) < 0$.
