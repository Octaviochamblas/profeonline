semantic_id: MAT.ALG.MULT_POLINOMIOS.MULTIPLES_POLINOMIOS
resumen_inicial: 'Multiplicación continuada de polinomios: leyes, procedimiento y
  aplicación en Multiplicación de polinomios.'
explicacion_simple: Un producto puede contener más de dos polinomios. Para resolverlo
  con seguridad se elige una agrupación conveniente y se simplifica cada producto
  antes de continuar.
explicacion_formal: '### Definición formal


  Sea $P_1,P_2,\ldots,P_r$ una familia finita de polinomios. Su producto continuado
  se define recursivamente mediante

  $$\prod_{t=1}^{r} P_t = \left(\prod_{t=1}^{r-1} P_t\right)P_r,$$

  y la propiedad asociativa de la multiplicación garantiza que el resultado no depende
  de cómo se agrupen los factores. En la expansión completa, cada término del producto
  final proviene de elegir un término de cada polinomio factor y multiplicar todos
  esos aportes entre sí. Después se reducen los términos semejantes obtenidos.


  ### Desarrollo didáctico


  No reduce su valor matemático, pero reduce drásticamente la explosión de términos,
  facilitando el cálculo humano.


  La asociatividad permite elegir el orden. Resolver un producto notable primero siempre
  simplifica la expresión rápidamente.


  Los dos últimos forman $(x+1)(x-1) = x^2 - 1$. Por ende queda $x(x^2 - 1)$.'
definiciones_clave: '- **Multiplicación continuada de polinomios**: Propiedad o regla
  fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación continuada de polinomios.'
