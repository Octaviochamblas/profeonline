procedimiento:
- 'Paso 1: Observa todos los factores y elige una agrupación conveniente usando la
  propiedad asociativa.'
- 'Paso 2: Multiplica primero un par de polinomios y simplifica por completo el resultado
  obtenido.'
- 'Paso 3: Usa el polinomio simplificado como nuevo factor y repite el proceso con
  el siguiente.'
- 'Paso 4: Continúa hasta incorporar todos los polinomios del producto.'
- 'Paso 5: Ordena y reduce el resultado final, verificando que no queden términos
  semejantes sin combinar.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación continuada de polinomios.
ejemplos:
- titulo: Si el lado de un cubo se incrementa en $2$, en $3$ y se reduce en $1$ en
    sus tres dimensione
  enunciado: 'Si el lado de un cubo se incrementa en $2$, en $3$ y se reduce en $1$
    en sus tres dimensiones, la expresión polinómica del nuevo volumen en función
    del lado original $x$ será:


    Opciones: A) $x^3 + 4x^2 + x - 6$ · B) $x^3 + 6x^2 - x - 6$ · C) $x^3 + 4x^2 -
    x + 6$ · D) $x^3 + 5x^2 + x - 6$'
  solucion_pasos:
  - $(x+2)(x+3)(x-1)$. $(x^2+5x+6)(x-1) = x^3 - x^2 + 5x^2 - 5x + 6x - 6 = x^3 + 4x^2
    + x - 6$.
  - 'Respuesta: $x^3 + 4x^2 + x - 6$'
- titulo: Cuál es el coeficiente de $x^2$ en el desarrollo de $(x-2)(x-3)(x-4)$
  enunciado: '¿Cuál es el coeficiente de $x^2$ en el desarrollo de $(x-2)(x-3)(x-4)$?


    Opciones: A) $-9$ · B) $9$ · C) $-26$ · D) $24$'
  solucion_pasos:
  - $(x-2)(x-3) = x^2 - 5x + 6$. $(x^2 - 5x + 6)(x - 4) = x^3 - 4x^2 - 5x^2 + 20x
    + 6x - 24$. El término de $x^2$ es $-4x^2 - 5x^2 = -9x^2$. Coeficiente $-9$.
