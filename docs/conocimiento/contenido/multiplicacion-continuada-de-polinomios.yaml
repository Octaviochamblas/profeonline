  enunciado: 'Respecto de «Multiplicación continuada de polinomios»: ¿Describe adecuadamente
    el concepto esta frase? «La propiedad asociativa dicta agrupar de a dos, resolver
    y continuar con el siguiente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La propiedad asociativa dicta
    agrupar de a dos, resolver y continuar con el siguiente.'
- titulo: 'Respecto de «Multiplicación continuada de polinomios»: ¿Se puede aceptar
    esta afirmación? «M'
  enunciado: 'Respecto de «Multiplicación continuada de polinomios»: ¿Se puede aceptar
    esta afirmación? «Multiplicar el primer término de cada polinomio entre sí»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La propiedad asociativa dicta
    agrupar de a dos, resolver y continuar con el siguiente.'
errores_frecuentes:
- Multiplicar el primer término de cada polinomio entre sí.
- Para «Al multiplicar tres polinomios, ¿cuál es el procedimiento estándar más recomendable»,
  la respuesta correcta es Sumar los dos primeros y multiplicar por el tercero.
- Distribuir cada término del primer polinomio en todos los otros polinomios simultáneamente.
- Porque si no se hace, el resultado final cambia de valor.
- Para «¿Por qué es crucial reducir términos semejantes después de multiplicar los
  dos primeros polinomios, antes de avanzar al tercero», la respuesta correcta es
  Para cambiar el grado del polinomio.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
