semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_ARCO_RADIANES
resumen_inicial: 'En el sistema radial, la longitud de arco se calcula de forma directa e inmediata mediante el producto del ángulo central por el radio: s = θr.'
explicacion_simple: '¿Por qué los matemáticos y científicos prefieren usar radianes en vez de grados? ¡Porque elimina todas las fracciones engorrosas y hace que los cálculos sean increíblemente simples!


  Un **radián** se define exactamente como el ángulo en el que la longitud del arco es igual al radio ($s = r$). Por esa razón, si el ángulo $\theta$ está expresado en radianes, para calcular la longitud del arco **no tienes que dividir entre 360 ni multiplicar por pi**: simplemente multiplicas el ángulo por el radio: **$s = \theta \cdot r$**.


  ¡Así de fácil! Solo recuerda la regla de oro: esta fórmula mágica **SOLO funciona si el ángulo está en radianes**.


  ![Longitud de arco en radianes con s = θr](/static/img/nodos/calculo-de-longitud-de-arco-en-radianes-usando-s-r-intro.svg)

  '
explicacion_formal: '### Definición intrínseca de radián y derivación

  En el plano euclidiano, la medida en radianes de un ángulo central $\theta$ se define formalmente como el cociente adimensional entre la longitud del arco subtendido $s$ y el radio $r$:

  $$\theta = \frac{s}{r} \iff s = \theta \cdot r$$


  ### Factor de conversión entre grados y radianes

  Como una vuelta completa de $360^\circ$ subtiende un perímetro de $2\pi r$:

  $$\theta_{\text{completa}} = \frac{2\pi r}{r} = 2\pi\text{ rad} = 360^\circ \implies 1\text{ rad} = \frac{180^\circ}{\pi} \approx 57,2958^\circ$$

  Para convertir un ángulo $\alpha$ dado en grados a radianes $\theta$:

  $$\theta = \alpha \cdot \frac{\pi}{180^\circ}$$


  > **Complemento didáctico:** Grábate la fórmula $s = \theta r$ con la palabra mnemotécnica **''SOR''** ($s = \theta \cdot r$). Cada vez que te den un ángulo con $\pi$ (como $\frac{\pi}{3}$ o $\frac{3\pi}{4}$), está en radianes: ¡multiplícalo directamente por el radio sin dividir por nada más!

  '
definiciones_clave: '- **Radián (rad)**: Unidad de medida angular en el Sistema Internacional definida por $s = r$.

  - **Fórmula $s = \theta r$**: Relación fundamental que calcula la longitud del arco a partir del ángulo en radianes.

  - **Conversión $\frac{\pi}{180^\circ}$**: Factor de escala para transformar grados sexagesimales a radianes.

  '
propiedades_relaciones: '- **Adimensionalidad del radián**: El radián es una unidad pura ($[L]/[L] = 1$), por lo que $s$ adopta directamente las unidades del radio $r$.

  - **Ángulos notables en radianes**: $30^\circ = \pi/6$, $45^\circ = \pi/4$, $60^\circ = \pi/3$, $90^\circ = \pi/2$, $180^\circ = \pi$.

  - **Despeje angular**: $\theta = \frac{s}{r}$ y despeje radial: $r = \frac{s}{\theta}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de longitud de arco en radianes](/static/img/nodos/calculo-de-longitud-de-arco-en-radianes-usando-s-r-ejemplos.svg)


    Un péndulo de longitud $r = 15\text{ cm}$ oscila describiendo un ángulo central de $\theta = \frac{\pi}{3}\text{ rad}$. Calcula la longitud exacta del arco recorrido por su extremo. Además, si un arco mide $s = 14\text{ cm}$ en una circunferencia de radio $r = 7\text{ cm}$, calcula el ángulo central en radianes.'
  pasos:
  - 'Paso 1: Aplicar la fórmula $s = \theta r$ con $\theta = \frac{\pi}{3}\text{ rad}$ y $r = 15\text{ cm}$.'
  - 'Paso 2: Calcular el producto: $s = \left(\frac{\pi}{3}\right) \cdot 15 = 5\pi\text{ cm}$.'
  - 'Paso 3: Para el segundo ejercicio, aplicar $\theta = \frac{s}{r}$.'
  - 'Paso 4: Realizar el cociente: $\theta = \frac{14\text{ cm}}{7\text{ cm}} = 2\text{ radianes}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición obligatoria para poder aplicar directamente la fórmula s = θr?
  choices:
  - text: El ángulo central θ debe estar expresado en radianes.
    is_correct: true
  - text: El ángulo central θ debe estar expresado en grados sexagesimales.
    is_correct: false
  - text: El radio debe medir exactamente 1 metro.
    is_correct: false
  - text: El arco debe ser mayor que el diámetro.
    is_correct: false
  explanation: La alternativa correcta es 'El ángulo central θ debe estar expresado en radianes.' La fórmula $s = \theta r$ es la definición misma del radián.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un arco de circunferencia mide s = 18 cm y el radio es r = 6 cm, ¿cuánto mide el ángulo central en radianes?
  choices:
  - text: 3 radianes.
    is_correct: true
  - text: 108 radianes.
    is_correct: false
  - text: 0,33 radianes.
    is_correct: false
  - text: 3π radianes.
    is_correct: false
  explanation: La alternativa correcta es '3 radianes.' Aplicando $\theta = \frac{s}{r} = \frac{18}{6} = 3$ rad.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Verificar que el ángulo central $\theta$ esté expresado en radianes (si está en grados, multiplicar por $\frac{\pi}{180^\circ}$).

  2. Multiplicar el ángulo $\theta$ por el radio $r$: $s = \theta \cdot r$.

  3. Simplificar las fracciones conservando $\pi$ para el valor exacto.

  4. Para despejar el ángulo conociendo $s$ y $r$, calcular $\theta = \frac{s}{r}$.

  '
errores_correccion: '- **Error común 1:** Usar un ángulo en grados directamente en $s = \theta r$. **Corrección:** Si $\alpha = 60^\circ$, no hagas $60 \cdot r$; primero convierte a $\pi/3$ rad.

  - **Error común 2:** Agregar $\pi$ al resultado cuando el ángulo en radianes ya es un número real puro (ej. $2\text{ rad}$). **Corrección:** Un radián no necesita llevar $\pi$; $\pi$ es solo un número real.

  '
ejemplos:
- tipo: A
  titulo: Arco con radianes fraccionarios
  enunciado: Un arco subtiende un ángulo de $\theta = \frac{3\pi}{4}\text{ rad}$ en una circunferencia de radio $r = 8\text{ cm}$. ¿Cuánto mide el arco?
  alternativas:
  - text: $6\pi\text{ cm}$.
    is_correct: true
  - text: $12\pi\text{ cm}$.
    is_correct: false
  - text: $3\pi\text{ cm}$.
    is_correct: false
  - text: $24\pi\text{ cm}$.
    is_correct: false
  explicacion: $s = \theta r = \frac{3\pi}{4} \cdot 8 = 3\pi \cdot 2 = 6\pi\text{ cm}$.
- tipo: B
  titulo: Equivalencia de un radián
  enunciado: Si el arco subtendido mide lo mismo que el radio ($s = r$), ¿mide el ángulo central exactamente 1 radián?
  respuesta: Sí
  explicacion: Sí. Por definición de radián, $\theta = \frac{s}{r} = \frac{r}{r} = 1\text{ rad}$.
errores_frecuentes:
- '''Multiplicar grados por el radio creyendo que la fórmula $s = \theta r$ aplica en cualquier unidad.'''
- '''Olvidar que $2\pi\text{ rad} = 360^\circ$ al realizar conversiones angulares.'''
- '''Dividir entre 2 innecesariamente confundiendo el arco con el área de un sector.'''
afirmaciones_verdaderas:
- "'La fórmula $s = \theta r$ relaciona directamente la longitud de arco con el ángulo central en radianes.'"
- '''Un radián es una medida angular adimensional equivalente al cociente entre la longitud de arco y el radio.'''
- "'Para convertir un ángulo en grados a radianes se multiplica por $\frac{\\pi}{180^\\circ}$.'"
al_terminar_debes_poder: '**QUÉ:** Calcular la longitud de arco y el ángulo central en el sistema de radianes.


  **CÓMO:** Aplicando $s = \theta r$ y $\theta = \frac{s}{r}$.


  ![Síntesis de arco en radianes](/static/img/nodos/calculo-de-longitud-de-arco-en-radianes-usando-s-r-resumen.svg)

  '
