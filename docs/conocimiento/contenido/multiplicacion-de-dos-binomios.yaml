semantic_id: MAT.ALG.MULT_POLINOMIOS.PRODUCTO_BINOMIOS
resumen_inicial: La multiplicación de dos binomios consiste en aplicar la distribución de los dos términos del primer binomio sobre los dos del segundo, generando 4 productos parciales que se reducen a un trinomio.
explicacion_simple: "Multiplicar **dos binomios** $(a + b) \\cdot (c + d)$ es uno de los procedimientos más utilizados en álgebra:\n- **REGLA DE LOS 4 PRODUCTOS**:\n  1. **Primero por Primero**: $a \\cdot c$.\n  2. **Primero por Segundo**: $a \\cdot d$.\n  3. **Segundo por Primero**: $b \\cdot c$.\n  4. **Segundo por Segundo**: $b \\cdot d$.\n- **Fórmula desplegada**: $(a + b)(c + d) = \\mathbf{ac + ad + bc + bd}$.\n- **Ejemplo clásico**: $(x + 3) \\cdot (x + 5)$:\n  - $x \\cdot x = \\mathbf{x^2}$.\n  - $x \\cdot 5 = \\mathbf{+5x}$.\n  - $3 \\cdot x = \\mathbf{+3x}$.\n  - $3 \\cdot 5 = \\mathbf{+15}$.\n  - Suma parcial: $x^2 + 5x + 3x + 15$.\n  - Reducimos los dos términos del medio ($5x + 3x = 8x$): **$x^2 + 8x + 15$**.\n\n![Multiplicación de Dos Binomios](/static/img/nodos/multiplicacion-de-dos-binomios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $B_1 = (a x + b)$ y $B_2 = (c x + d)$ dos binomios de grado 1 en $\mathbb{R}[x]$. La **multiplicación de dos binomios** es la aplicación directa de la ley distributiva binaria:


  $$(a x + b)(c x + d) = (a c) x^2 + (a d) x + (b c) x + (b d)$$


  reducida mediante la proyección del espacio cuadrático sobre el trinomio canónico:


  $$(a x + b)(c x + d) = (a c) x^2 + (a d + b c) x + (b d)$$


  ### Modelo de Términos Centrales Combinados

  El coeficiente del término lineal $(a d + b c)$ resulta de la suma de los productos extremos $(a d)$ y medios $(b c)$, sentando las bases algebraicas para el método de factorización por aspa simple.


  ### Síntesis didáctica

  Multiplicar dos binomios lineales genera siempre un trinomio cuadrático de la forma $A x^2 + B x + C$ (salvo en la diferencia de cuadrados donde $B=0$).

  '
definiciones_clave: '- **Multiplicación de binomios**: Producto de dos expresiones algebraicas compuestas por exactamente dos sumandos cada una.

  - **Cuatro productos parciales ($ac, ad, bc, bd$)**: Cuatrinomio inicial generado por la combinación de los términos de ambos binomios.

  - **Consolidación lineal de términos medios ($ad + bc$)**: Reducción de los dos términos cruzados centrales en un único término de grado 1.

  '
propiedades_relaciones: '- **Trinomio cuadrático resultante**: El producto de dos binomios de grado 1 se reduce a un trinomio de grado 2.

  - **Genérico para productos notables**: Caso general que abarca al cuadrado de binomio y a la suma por su diferencia.

  '
ejemplo_guiado:
  enunciado: Multiplica los binomios $(3x - 4) \cdot (2x + 5)$ y reduce el polinomio resultante.
  pasos:
  - 'Paso 1: Multiplicamos Primero por Primero: $3x \cdot 2x = \mathbf{6x^2}$.'
  - 'Paso 2: Multiplicamos Primero por Segundo (extremos): $3x \cdot 5 = \mathbf{+15x}$.'
  - 'Paso 3: Multiplicamos Segundo por Primero (medios): $-4 \cdot 2x = \mathbf{-8x}$.'
  - 'Paso 4: Multiplicamos Segundo por Segundo: $-4 \cdot 5 = \mathbf{-20}$.'
  - 'Paso 5: Escribimos los 4 productos parciales: $6x^2 + 15x - 8x - 20$.'
  - 'Paso 6: Reducimos los términos del medio ($+15x - 8x = \mathbf{+7x}$): $6x^2 + 7x - 20$.'
  - 'Conclusión: El trinomio resultante es **$6x^2 + 7x - 20$**.'
  imagen: /static/img/nodos/multiplicacion-de-dos-binomios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué tipo de expresión algebraica se reduce habitualmente el producto de dos binomios lineales de la forma $(ax+b)(cx+d)$?
  choices:
  - text: Se reduce a un trinomio cuadrático de la forma $(ac)x^2 + (ad+bc)x + bd$
    is_correct: true
  - text: Se reduce a un monomio de grado 4
    is_correct: false
  - text: Se convierte en un polinomio de 6 términos
    is_correct: false
  - text: Se convierte en una constante numérica
    is_correct: false
  explanation: La alternativa correcta es 'Se reduce a un trinomio cuadrático de la forma $(ac)x^2 + (ad+bc)x + bd$'. Trinomio cuadrático resultante.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $(x - 3) \cdot (x + 7)$?
  choices:
  - text: El resultado es $x^2 + 4x - 21$, sumando los medios $+7x - 3x = +4x$ y multiplicando $-3 \cdot 7 = -21$
    is_correct: true
  - text: El resultado es $x^2 - 4x - 21$
    is_correct: false
  - text: El resultado es $x^2 + 10x - 21$
    is_correct: false
  - text: El resultado es $x^2 - 21$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $x^2 + 4x - 21$, sumando los medios $+7x - 3x = +4x$ y multiplicando $-3 \cdot 7 = -21$'. $x^2+7x-3x-21 = x^2+4x-21$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los primeros términos de ambos binomios para obtener el término de grado mayor.'
- 'Paso 2: Multiplicar los términos extremos y los términos medios para obtener los dos productos parciales centrales.'
- 'Paso 3: Multiplicar los segundos términos de ambos binomios para obtener la constante.'
- 'Paso 4: Reducir los términos semejantes centrales y presentar el trinomio consolidado.'
errores_correccion: '- **Error 1:** Multiplicar únicamente $x \cdot x$ y los números (escribir $(x+3)(x+4) = x^2 + 12$). **Cómo corregirlo:** Se deben **CALCULAR LOS 4 PRODUCTOS INCLUYENDO LOS TÉRMINOS CRUZADOS ($x^2 + 7x + 12$)**.

  - **Error 2:** Sumar los números de los binomios al calcular el término constante (escribir $(x+3)(x+4) = x^2 + 7x + 7$). **Cómo corregirlo:** El término constante **SE MULTIPLICA ($3 \cdot 4 = 12$)**.

  '
ejemplos:
- titulo: Binomios con signos positivos
  enunciado: ¿Cuál es el producto de $(y + 2) \cdot (y + 6)$?
  alternativas:
  - $y^2 + 8y + 12$
  - $y^2 + 12$
  - $y^2 + 8y + 8$
  respuesta: $y^2 + 8y + 12$
  solucion_pasos:
  - '1. Productos: $y^2 + 6y + 2y + 12$.'
  - '2. Reducción: $y^2 + 8y + 12$.'
- titulo: Binomios con signos negativos
  enunciado: ¿Cuál es el producto de $(m - 5) \cdot (m - 2)$?
  alternativas:
  - $m^2 - 7m + 10$
  - $m^2 - 7m - 10$
  - $m^2 + 10$
  respuesta: $m^2 - 7m + 10$
  solucion_pasos:
  - '1. Productos: $m^2 - 2m - 5m + 10$.'
  - '2. Reducción: $m^2 - 7m + 10$.'
- titulo: Caso de diferencia de cuadrados
  enunciado: En el producto $(x - 4)(x + 4)$, ¿se anulan los términos del medio dando $x^2 - 16$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $+4x - 4x = 0 \implies x^2 - 16$.
- titulo: Multiplicación con coeficientes mayores a uno
  enunciado: Para $(2x + 1)(3x + 2)$, ¿es el término de mayor grado $6x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2x \cdot 3x = 6x^2$.
errores_frecuentes:
- La multiplicación de los términos cruzados (extremos y medios) no se efectúa al calcular el producto de binomios.
- Sumar los términos independientes en lugar de multiplicarlos al calcular el último término.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Intercambiar las reglas de signos al multiplicar coeficientes negativos en el segundo binomio.
- Sumar los exponentes de coeficientes numéricos.
afirmaciones_verdaderas:
- La multiplicación de dos binomios genera inicialmente 4 productos parciales.
- Los dos términos centrales generados al multiplicar binomios de una misma variable se reducen a un único término lineal.
al_terminar_debes_poder: '![Resumen de multiplicación de dos binomios](/static/img/nodos/multiplicacion-de-dos-binomios-resumen.svg)


  QUÉ: Calcular el producto de dos binomios lineales o cuadráticos mediante el método FOIL.


  CÓMO: Sumar los cuatro productos elementales $(a+b)(c+d) = ac + ad + bc + bd$ y reducir los dos términos centrales semejantes.'
