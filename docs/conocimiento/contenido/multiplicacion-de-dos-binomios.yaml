semantic_id: MAT.ALG.MULT_POLINOMIOS.PRODUCTO_BINOMIOS
resumen_inicial: 'Multiplicación de dos binomios: leyes, procedimiento y aplicación
  en Multiplicación de polinomios.'
explicacion_simple: El producto de dos binomios, como $(x+a)(x+b)$, es la multiplicación
  más común que verás en álgebra. Existe un método nemotécnico muy popular en inglés
  llamado FOIL (First, Outer, Inner, Last), que te ayuda a recordar los cuatro productos
  cruzados indispensables.
explicacion_formal: '### Definición formal


  Sean $B_1=a+b$ y $B_2=c+d$ dos binomios. Entonces, por distributividad,

  $$(a+b)(c+d)=ac+ad+bc+bd.$$

  La multiplicación de dos binomios genera exactamente cuatro productos parciales:
  uno entre cada término del primer factor y cada término del segundo. Después de
  expandir, se reducen los términos semejantes que puedan aparecer en la suma resultante.


  ### Desarrollo didáctico


  Sea el producto: $(x + 3)(x - 5)$.


  Aplicamos los cuatro productos:

  1. **F**irst (Primeros): $x \cdot x = x^2$.

  2. **O**uter (Exteriores): $x \cdot (-5) = -5x$.

  3. **I**nner (Interiores): $3 \cdot x = +3x$.

  4. **L**ast (Últimos): $3 \cdot (-5) = -15$.


  Sumamos: $x^2 - 5x + 3x - 15$.

  Reducimos semejantes: $x^2 - 2x - 15$.'
definiciones_clave: '- **Multiplicación de dos binomios**: Propiedad o regla fundamental
  del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación de dos binomios.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de multiplicación de dos
    binomios.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de multiplicación de dos binomios.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
