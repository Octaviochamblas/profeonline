procedimiento:
- 'Paso 1: Identifica los dos términos del primer binomio y los dos del segundo.'
- 'Paso 2: Forma los cuatro productos parciales entre ambos factores: primero con
  primero, primero con segundo, segundo con primero y segundo con segundo.'
- 'Paso 3: Calcula cada producto parcial aplicando correctamente la ley de signos
  y las leyes de potencias.'
- 'Paso 4: Escribe la suma de los cuatro productos en una sola expresión.'
- 'Paso 5: Reduce los términos semejantes, especialmente los términos centrales si
  tienen la misma parte literal.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación de dos binomios.
ejemplos:
- titulo: El FOIL en acción
  enunciado: 'Multiplica: (2x + 1)(x - 3).'
  solucion_pasos:
  - 'Primeros: (2x)(x) = 2x^2.'
  - 'Exteriores: (2x)(-3) = -6x.'
  - 'Interiores: (1)(x) = +x.'
  - 'Últimos: (1)(-3) = -3.'
  - 'Línea: 2x^2 - 6x + x - 3.'
  - 'Reducción: 2x^2 - 5x - 3.'
- titulo: El ingreso neto por ventas de una distribuidora es $I = (x - 2)(2x + 10)$
    miles de pesos, do
  enunciado: 'El ingreso neto por ventas de una distribuidora es $I = (x - 2)(2x +
    10)$ miles de pesos, donde $x$ es el precio unitario. ¿Cuál es la expresión equivalente
    al desarrollar el producto? (v1)


    Opciones: A) $2x^2 + 6x - 20$ miles de pesos. · B) $2x^2 - 20$ miles de pesos.
    · C) $2x^2 - 6x - 20$ miles de pesos. · D) $2x^2 + 10x - 20$ miles de pesos.'
  solucion_pasos:
  - 'Desarrollamos: $x(2x+10) = 2x^2 + 10x$. $-2(2x+10) = -4x - 20$. Reduciendo semejantes:
    $2x^2 + (10-4)x - 20 = 2x^2 + 6x - 20$.'
  - 'Respuesta: $2x^2 + 6x - 20$ miles de pesos.'
