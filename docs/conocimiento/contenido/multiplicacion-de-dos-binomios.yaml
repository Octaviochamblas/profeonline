  enunciado: 'Respecto de «Multiplicación de dos binomios»: ¿Se puede aceptar esta
    afirmación? «Multiplicar solo los primeros y los últimos, omitiendo los productos
    cruzados exteriores/interiores»'
  respuesta: 'No'
