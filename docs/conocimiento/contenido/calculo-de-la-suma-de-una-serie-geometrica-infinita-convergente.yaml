semantic_id: MAT.NUM.SERIE_GEOMETRICA.SUMA_INFINITA
resumen_inicial: 'Cálculo de la suma de una serie geométrica infinita convergente: concepto
  y desarrollo dentro de Serie geométrica finita e infinita.'
explicacion_simple: Ya pasaste el control del portero. La razón es una fracción válida. Ahora,
  es el momento de aplicar la fórmula más limpia y satisfactoria de todas las progresiones.
explicacion_formal: 'Fórmula: $S_{\infty} = \frac{a_1}{1 - r}$


  No te dejes engañar por la simplicidad. El peligro está en el manejo de los signos y las
  fracciones en el denominador.


  Ejemplo con fracciones: Serie infinita de $18, 6, 2, 2/3 \dots$

  - $a_1 = 18$.

  - $r = 6/18 = 1/3$.

  - Aplicamos fórmula: $S_{\infty} = \frac{18}{1 - 1/3}$

  - Truco para el denominador: $1$ es lo mismo que $3/3$. Así que $3/3 - 1/3 = 2/3$.

  - Nos queda: $S_{\infty} = \frac{18}{2/3}$

  - Dividir por una fracción es multiplicar por ella invertida: $18 \cdot \frac{3}{2} = \frac{54}{2}
  = 27$.


  ¡La suma de todos esos infinitos números da clavado 27!'
definiciones_clave: '- **Cálculo de la suma de una serie geométrica infinita convergente**:
  Concepto fundamental dentro del estudio de Serie geométrica finita e infinita.'
propiedades_relaciones: '- **Propiedades de Cálculo de la suma de una serie geométrica infinita
  convergente**: Relaciones de cambio y fórmulas estructurales de serie geométrica finita
  e infinita.'
ejemplo_guiado:
  enunciado: Calcula la suma infinita de la serie 27 más 9 más 3 más 1, y así sucesivamente.
  pasos:
  - 'Identifico a_1 igual a 27 y calculo la razón: 9 dividido entre 27 es igual a 1/3.'
  - Verifico que el valor absoluto de 1/3 es menor que 1, por lo tanto converge.
  - 'Aplico la fórmula: S infinito igual a 27 dividido entre (1 menos 1/3), es decir 27 dividido
    entre 2/3, igual a 27 por 3/2, o sea 40,5.'
