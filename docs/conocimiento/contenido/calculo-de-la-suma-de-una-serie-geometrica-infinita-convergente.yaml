procedimiento:
- 'Paso 1: Detecta $a_1$ y ''r''.'
- 'Paso 2: Resta la razón a 1 ($1 - r$). Ten cuidado si ''r'' es negativa.'
- 'Paso 3: Si el denominador es fracción, conviértelo (1 = 4/4, 1 = 5/5, etc.).'
- 'Paso 4: Divide $a_1$ por el resultado del denominador (regla de la herradura).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en cálculo de la suma de una serie geométrica infinita convergente.
ejemplos:
- titulo: Cuidado con los signos
  enunciado: Calcula la suma infinita de 10 - 5 + 2.5 - 1.25 ...
  solucion_pasos:
  - a1 = 10. r = -5 / 10 = -0.5.
  - 'Fórmula: S = 10 / (1 - (-0.5))'
  - 'Denominador: 1 + 0.5 = 1.5'
  - S = 10 / 1.5 = 100 / 15 = 20 / 3.
  - La suma da exactamente 20/3 (aprox 6.66).
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la suma infinita de 12 más 6 más 3 más 1,5, y así sucesivamente?
  alternativas:
  - '24'
  - '18'
  - '20'
  respuesta: '24'
  solucion_pasos:
  - a_1 es 12 y r es 0,5; 12 dividido entre (1 menos 0,5) es igual a 24.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la suma infinita de una serie con a_1 igual a 10 y r igual a -0,5?
  alternativas:
  - 6,67 aproximadamente
  - '20'
  - '5'
  respuesta: 6,67 aproximadamente
  solucion_pasos:
  - 10 dividido entre (1 menos (-0,5)) es igual a 10 dividido entre 1,5, aproximadamente 6,67.
- titulo: ¿Se puede calcular la suma infinita sin conocer a_1?
  respuesta: 'No'
  solucion_pasos:
  - a_1 es uno de los dos datos indispensables de la fórmula, junto a r.
- titulo: ¿El denominador de la fórmula de suma infinita es (1 más r)?
  respuesta: 'No'
  solucion_pasos:
  - El denominador correcto es (1 menos r).
errores_frecuentes:
- 'Olvidar la regla de los signos en el denominador cuando $r$ es negativa: calcular $(1 -
  0.5)$ en lugar de $(1 - (-0.5))$.'
- Enredarse en la división final cuando el denominador es una fracción (hacer mal la regla
  de la oreja o herradura).
- Olvidar la regla de los signos en el denominador cuando la razón es negativa.
- Dividir mal por una fracción, sin invertirla y multiplicar.
- Aplicar la fórmula sin haber comprobado antes que la razón converge.
afirmaciones_verdaderas:
- La formulación de cálculo de la suma de una serie geométrica infinita convergente mantiene
  la regularidad de la sucesión.
- Al calcular una suma infinita con razón fraccionaria conviene expresar 1 como una fracción
  equivalente antes de restar.
