semantic_id: MAT.NUM.SERIE_GEOMETRICA.SUMA_INFINITA
resumen_inicial: 'El cálculo de la suma de una serie geométrica infinita convergente determina el valor límite escalar $S$ al que se aproxima la suma de sus infinitos términos utilizando la fórmula $S = \frac{a_1}{1 - r}$ para $|r| < 1$.'
explicacion_simple: |
  Para calcular el valor exacto de la suma de infinitos números a interés decreciente (cuando $|r| < 1$):
  1. No necesitas sumar infinitas veces.
  2. Tomas el **primer término ($a_1$)** y lo divides entre **$(1 - r)$**:
     $$S = \frac{a_1}{1 - r}$$
  Por ejemplo, si la serie es $12 + 4 + \frac{4}{3} + \frac{4}{9} + \dots$ ($a_1 = 12, r = 1/3$):
  $$S = \frac{12}{1 - 1/3} = \frac{12}{2/3} = 12 \cdot \frac{3}{2} = 18$$
  La suma infinita de todos esos números es exactamente **$18$**.
explicacion_formal: |
  ### Definición formal
  La **suma total $S$** de una serie geométrica infinita convergente $\sum_{k=1}^\infty a_1 r^{k-1}$ con $|r| < 1$ se obtiene haciendo tender $n \to \infty$ en la expresión de las sumas parciales:
  $$S = \lim_{n \to \infty} S_n = \lim_{n \to \infty} \left[ a_1 \cdot \frac{1 - r^n}{1 - r} \right]$$
  Como $|r| < 1 \implies \lim_{n \to \infty} r^n = 0$:
  $$S = a_1 \cdot \frac{1 - 0}{1 - r} = \frac{a_1}{1 - r}$$

  ### Casos Especiales de Signo
  1. **Razón positiva ($0 < r < 1$)**: La serie es monótona creciente en sus sumas parciales hacia $S$.
  2. **Razón negativa ($-1 < r < 0$)**: Las sumas parciales oscilan amortiguadamente alrededor del valor límite $S$.

  ### Síntesis didáctica
  - Condición previa obligatoria: $|r| < 1$.
  - Ecuación de la suma infinita: $S = \frac{a_1}{1 - r}$.
definiciones_clave: |
  - **Suma infinita convergente ($S$)**: Límite numérico real de la adición continuada de infinitos términos.
  - **Denominador de atenuación ($1 - r$)**: Complemento de la razón geométrica que determina la velocidad de concentración de la suma.
  - **Límite analítico**: Valor fijo al que tiende asintóticamente la secuencia de sumas parciales.
propiedades_relaciones: |
  - **Sensibilidad al primer término**: La suma infinita $S$ es directamente proporcional al valor del primer término $a_1$.
  - **Conversión de decimales periódicos**: Constituye el método algebraico para transformar decimales infinitos periódicos (como $0,444\dots$) en fracciones ($4/9$).
ejemplo_guiado:
  enunciado: 'Calcula la suma infinita de la serie geométrica $S = 20 + 5 + 1,25 + 0,3125 + \dots$'
  pasos:
    - 'Paso 1: Identificamos el primer término $a_1 = 20$ y la razón geométrica $r = \frac{5}{20} = \frac{1}{4} = 0,25$.'
    - 'Paso 2: Verificamos la convergencia: $|0,25| = 0,25 < 1$, por lo que la serie **es convergente**.'
    - 'Paso 3: Sustituimos $a_1 = 20$ y $r = 1/4$ en la fórmula $S = \frac{a_1}{1 - r}$: $S = \frac{20}{1 - 1/4} = \frac{20}{3/4}$.'
    - 'Paso 4: Evaluamos la división de fracciones: $S = 20 \cdot \frac{4}{3} = \frac{80}{3} \approx 26,67$. La suma infinita es **$\frac{80}{3}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la suma de una serie geométrica infinita convergente de primer término $a_1$ y razón $r$?'
    choices:
      - {text: 'Dividir el primer término entre uno menos la razón ($S = \frac{a_1}{1 - r}$)', is_correct: true}
      - {text: 'Multiplicar el primer término por la razón y elevar a infinito', is_correct: false}
      - {text: 'Dividir el primer término entre la razón al cuadrado', is_correct: false}
      - {text: 'Restar el primer término a la razón geométrica', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir el primer término entre uno menos la razón ($S = \frac{a_1}{1 - r}$)''. Deriva del límite $r^n \to 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una serie geométrica infinita tiene $a_1 = 15$ y razón $r = \frac{2}{3}$, ¿cuál es su suma infinita total $S$?'
    choices:
      - {text: '$S = 45$, calculando $\frac{15}{1 - 2/3} = \frac{15}{1/3} = 15 \cdot 3 = 45$', is_correct: true}
      - {text: '$S = 30$, multiplicando $15 \cdot 2$', is_correct: false}
      - {text: '$S = 10$, multiplicando $15 \cdot (2/3)$', is_correct: false}
      - {text: '$S = 22,5$, calculando la mitad de 45', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = 45$, calculando $\frac{15}{1 - 2/3} = \frac{15}{1/3} = 15 \cdot 3 = 45$''. $15 / (1/3) = 45$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$ y la razón geométrica $r$.'
  - 'Paso 2: Confirmar que $|r| < 1$ para asegurar la convergencia de la serie.'
  - 'Paso 3: Calcular el denominador $(1 - r)$.'
  - 'Paso 4: Dividir $a_1$ entre $(1 - r)$ para obtener el valor límite final $S$.'
errores_correccion: |
  - **Error 1:** Aplicar la fórmula $S = \frac{a_1}{1-r}$ a series divergentes donde $|r| \ge 1$. **Cómo corregirlo:** La fórmula **SÓLO SE PUEDE USAR si $|r| < 1$**; si $|r| \ge 1$, la serie no tiene suma real.
  - **Error 2:** Restar mal al tener una razón negativa (ej: para $r = -0,5$, hacer $1 - 0,5 = 0,5$ en vez de $1 - (-0,5) = 1,5$). **Cómo corregirlo:** Aplica la regla del doble signo: **$1 - (-r) = 1 + r$**.
ejemplos:
  - titulo: 'Suma infinita simple de fracciones'
    enunciado: 'Para $a_1 = 10$ y $r = 1/2$, ¿la suma infinita es $S = \frac{10}{1 - 1/2} = \frac{10}{1/2} = 20$?'
    alternativas:
      - 'Sí, $10 \cdot 2 = 20$'
      - 'No, es 15'
      - 'No, es 10'
    respuesta: 'Sí, $10 \cdot 2 = 20$'
    solucion_pasos:
      - '1. $a_1 = 10, r = 1/2$.'
      - '2. $S = 10 / (1 - 1/2) = 10 / (1/2) = 20$.'
  - titulo: 'Suma infinita con razón negativa'
    enunciado: 'Para $a_1 = 6$ y $r = -1/2$, ¿$S = \frac{6}{1 - (-1/2)} = \frac{6}{3/2} = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 - (-1/2) = 3/2 \implies 6 \cdot (2/3) = 4$.'
  - titulo: 'Convertir 0,666... a fracción'
    enunciado: 'Para $0,666\dots$ ($a_1 = 0,6 = 6/10, r = 0,1 = 1/10$), ¿la suma es $S = \frac{6/10}{9/10} = \frac{6}{9} = \frac{2}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0,6 / (1 - 0,1) = 0,6 / 0,9 = 6/9 = 2/3$.'
  - titulo: 'Suma infinita con razón r = 1/4'
    enunciado: 'Para $a_1 = 9$ y $r = 1/4$, ¿$S = \frac{9}{1 - 1/4} = \frac{9}{3/4} = 12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $9 \cdot (4/3) = 12$.'
errores_frecuentes:
  - 'Aplicar la fórmula de suma infinita sobre series donde la razón es mayor o igual a 1.'
  - 'La suma de una serie geométrica infinita siempre entrega un número entero positivo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Al restar una razón negativa en la fórmula $1 - (-r)$, el denominador resulta ser un número menor que 1.'
  - 'Invertir la fracción del resultado final al dividir por el denominador $(1-r)$.'
afirmaciones_verdaderas:
  - 'La suma de una serie geométrica infinita convergente de razón $|r| < 1$ se calcula mediante $S = \frac{a_1}{1 - r}$.'
  - 'Si la razón es negativa e idónea ($-1 < r < 0$), la suma infinita oscila y converge a un valor finito positivo menor que $a_1$.'
