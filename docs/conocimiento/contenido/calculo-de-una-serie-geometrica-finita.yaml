semantic_id: MAT.NUM.SERIE_GEOMETRICA.SERIE_FINITA
resumen_inicial: 'Cálculo de una serie geométrica finita: concepto y desarrollo dentro
  de Serie geométrica finita e infinita.'
explicacion_simple: Ya conoces la diferencia entre lista y suma. Ahora, vamos a los
  fierros. Cuando la lista es de 30 términos, no puedes sumar a mano. Sacaremos nuestra
  fórmula mágica para devorar grandes sumas geométricas en un segundo.
explicacion_formal: "Repasemos la mecánica de la fórmula con un ejemplo donde los\
  \ errores abundan.\n\nFórmula: $S_n = \\frac{a_1(r^n - 1)}{r - 1}$\n\nSi queremos\
  \ la serie de los primeros 6 términos de $10, 20, 40\\dots$\n- $a_1 = 10$, $r =\
  \ 2$, $n = 6$.\n\nReemplazo cuidadoso:\n1. Arriba: $10 \\cdot (2^6 - 1)$\n   - Primero\
  \ la potencia: $2^6 = 64$\n   - Luego la resta: $64 - 1 = 63$\n   - Luego multiplicamos:\
  \ $10 \\cdot 63 = 630$.\n2. Abajo: $2 - 1 = 1$.\n3. División final: $630 / 1 = 630$.\n\
  \nLa serie vale 630. Cuidado con el paso 1: jamás debes hacer $10 \\cdot 2$ primero\
  \ y luego elevar a la sexta (eso daría un absurdo $20^6$)."
definiciones_clave: '- **Cálculo de una serie geométrica finita**: Concepto fundamental
