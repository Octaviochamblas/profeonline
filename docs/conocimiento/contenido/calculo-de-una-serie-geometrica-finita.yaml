  QUÉ: Calcular el valor exacto de una serie geométrica finita $S_n$ para cualquier cantidad de términos.
  CÓMO: Evaluar la fórmula analítica $S_n = \frac{a_1(r^n - 1)}{r - 1}$ calculando la potencia $r^n$ y simplificando el cociente algebraico.
