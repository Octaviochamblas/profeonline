procedimiento:
- 'Paso 1: Detecta $a_1, r, n$.'
- 'Paso 2: Evalúa la potencia $r^n$.'
- 'Paso 3: Resta 1 a la potencia.'
- 'Paso 4: Multiplica por $a_1$ (esto completa el numerador).'
- 'Paso 5: Divide por $(r-1)$ (el denominador).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en cálculo de una serie geométrica finita.
ejemplos:
- titulo: Números fríos
  enunciado: Halla el valor de la serie de los 4 primeros términos de la sucesión
    que empieza en 100 con razón -2.
  solucion_pasos:
  - a1=100, r=-2, n=4.
  - 'Potencia: (-2)^4 = +16.'
  - 'Resta: 16 - 1 = 15.'
  - 'Multiplica a1: 100 * 15 = 1500.'
  - 'Denominador: r - 1 = -2 - 1 = -3.'
  - 'División final: 1500 / -3 = -500.'
  - La serie da -500.
- titulo: Ejemplo 1
  enunciado: Si a_1 es 2, r es 4 y n es 3, ¿cuál es el valor de la serie?
  alternativas:
  - '42'
  - '32'
  - '30'
  respuesta: '42'
  solucion_pasos:
  - 2 por (4 elevado a 3 menos 1) dividido entre (4 menos 1) es igual a 2 por 63 dividido
    entre 3, o sea 42.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la serie de los primeros 4 términos de 5, 10, 20, 40?
  alternativas:
  - '75'
  - '70'
  - '80'
  respuesta: '75'
  solucion_pasos:
  - 5 más 10 más 20 más 40 es igual a 75.
- titulo: ¿Se puede calcular una serie finita sumando término por término si son pocos?
  respuesta: Sí
  solucion_pasos:
  - Aunque para muchos términos conviene usar la fórmula cerrada.
- titulo: ¿Al elevar una razón negativa a un exponente impar el resultado es negativo?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo, -2 elevado a 3 es igual a -8.
errores_frecuentes:
- 'Romper la jerarquía de operaciones multiplicando $a_1$ por la base $r$ antes de
  aplicar el exponente (Ej: resolver $3(2^4)$ como $6^4$).'
- Omitir los paréntesis al evaluar una razón negativa elevada a potencia par, como
  escribir $-2^4 = -16$ en vez de $(-2)^4 = +16$.
- Multiplicar a_1 por la razón antes de elevarla al exponente, alterando el resultado
  de la potencia.
- Omitir los paréntesis al elevar una razón negativa a una potencia par.
- Dividir por (r menos 1) antes de haber completado el numerador.
afirmaciones_verdaderas:
- La formulación de cálculo de una serie geométrica finita mantiene la regularidad
  de la sucesión.
- Al calcular una serie geométrica finita se debe resolver primero la potencia r elevado
  a n, antes de restar 1 y multiplicar por a_1.
al_terminar_debes_poder: Resolver problemas prácticos utilizando cálculo de una serie
