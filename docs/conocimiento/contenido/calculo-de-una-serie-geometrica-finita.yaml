semantic_id: MAT.NUM.SERIE_GEOMETRICA.SERIE_FINITA
resumen_inicial: 'El cálculo de una serie geométrica finita determina la suma de los primeros $n$ términos de una PG aplicando la fórmula $S_n = \sum_{k=1}^n a_1 r^{k-1} = \frac{a_1(r^n - 1)}{r - 1}$ para $r \neq 1$.'
explicacion_simple: |
  Una **serie geométrica finita** es la suma de los primeros $n$ términos de una progresión geométrica:
  $$S_n = a_1 + a_1 r + a_1 r^2 + \dots + a_1 r^{n-1}$$
  - En lugar de sumar uno a uno los términos (que crecen muy rápido), usamos la fórmula cerrada:
    $$S_n = \frac{a_1 \cdot (r^n - 1)}{r - 1} \quad (\text{si } r > 1) \quad \text{o} \quad S_n = \frac{a_1 \cdot (1 - r^n)}{1 - r} \quad (\text{si } r < 1)$$
  - Por ejemplo, para sumar $5$ términos con $a_1 = 2$ y $r = 3$:
    $$S_5 = \frac{2 \cdot (3^5 - 1)}{3 - 1} = \frac{2 \cdot (243 - 1)}{2} = 242$$

  ![Cálculo de una serie geométrica finita](/static/img/nodos/calculo-de-una-serie-geometrica-finita-intro.svg)
explicacion_formal: |
  ### Demostración formal por Multiplicación Telescópica
  Sea la serie geométrica finita de orden $n$:
  $$S_n = a_1 + a_1 r + a_1 r^2 + \dots + a_1 r^{n-1}$$
  Multiplicando por $r$:
  $$r S_n = a_1 r + a_1 r^2 + a_1 r^3 + \dots + a_1 r^n$$
  Restando miembro a miembro ($S_n - r S_n$):
  $$S_n(1 - r) = a_1 - a_1 r^n = a_1(1 - r^n)$$
  Para todo $r \neq 1$:
  $$S_n = \frac{a_1(1 - r^n)}{1 - r} = \frac{a_1(r^n - 1)}{r - 1}$$

  ### Casos según la Razón $r$
  - Si $r > 1$: Es conveniente usar $S_n = \frac{a_1(r^n - 1)}{r - 1}$ para operar con valores positivos.
  - Si $0 < r < 1$: Es conveniente usar $S_n = \frac{a_1(1 - r^n)}{1 - r}$.
  - Si $r = 1$: $S_n = n \cdot a_1$.

  ### Síntesis didáctica
  - Ecuación general: $S_n = \frac{a_1(r^n - 1)}{r - 1}$.
  - Costo: Evaluación en un solo paso mediante la potencia $r^n$.
definiciones_clave: |
  - **Serie geométrica finita**: Suma de un número finito $n$ de términos consecutivos de una progresión geométrica.
  - **Cancelación telescópica**: Propiedad algebraica donde todos los términos intermedios se anulan al restar $S_n - rS_n$.
  - **Fórmula cerrada**: Expresión que evalúa la suma sin necesidad de iterar sobre los términos individuales.
propiedades_relaciones: |
  - **Crecimiento de la suma**: Para $r > 1$, la serie $S_n$ crece a una tasa exponencial dominada por el término $r^n$.
  - **Factorización algebraica**: La fórmula equivale a la identidad de polinomios $\frac{r^n - 1}{r - 1} = r^{n-1} + r^{n-2} + \dots + r + 1$.
ejemplo_guiado:
  enunciado: 'Calcula el valor de la serie geométrica finita $\sum_{k=1}^6 3 \cdot 2^{k-1} = 3 + 6 + 12 + 24 + 48 + 96$.'
  imagen: '/static/img/nodos/calculo-de-una-serie-geometrica-finita-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los elementos: $a_1 = 3, r = 2, n = 6$.'
    - 'Paso 2: Aplicamos la fórmula de la serie finita: $S_6 = \frac{3 \cdot (2^6 - 1)}{2 - 1}$.'
    - 'Paso 3: Calculamos la potencia: $2^6 = 64$.'
    - 'Paso 4: Operamos: $S_6 = \frac{3 \cdot (64 - 1)}{1} = 3 \cdot 63 = 189$.'
    - 'Paso 5: El valor exacto de la serie es **$189$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para calcular la serie geométrica finita $S_5 = 1 + 3 + 9 + 27 + 81$, ¿cuál es la aplicación correcta de la fórmula?'
    choices:
      - {text: '$S_5 = \frac{1 \cdot (3^5 - 1)}{3 - 1} = \frac{243 - 1}{2} = \frac{242}{2} = 121$', is_correct: true}
      - {text: '$S_5 = \frac{1 \cdot (3^4 - 1)}{3 - 1} = 40$', is_correct: false}
      - {text: '$S_5 = 1 \cdot 3^5 = 243$', is_correct: false}
      - {text: '$S_5 = 81 \cdot 5 = 405$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S_5 = \frac{1 \cdot (3^5 - 1)}{3 - 1} = \frac{243 - 1}{2} = \frac{242}{2} = 121$''. Con $n=5$, el exponente es 5.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor de la serie $\sum_{k=1}^4 16 \cdot \left(\frac{1}{2}\right)^{k-1}$?'
    choices:
      - {text: '$30$, calculando $16 + 8 + 4 + 2 = 30$', is_correct: true}
      - {text: '$32$', is_correct: false}
      - {text: '$15$', is_correct: false}
      - {text: '$28$', is_correct: false}
    explanation: 'La alternativa correcta es ''$30$, calculando $16 + 8 + 4 + 2 = 30$''. Aplicando la fórmula: $S_4 = \frac{16(1 - (1/2)^4)}{1 - 1/2} = \frac{16(15/16)}{1/2} = 30$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$, la razón $r$ y la cantidad de términos $n$.'
  - 'Paso 2: Calcular la potencia $r^n$.'
  - 'Paso 3: Restar 1 a la potencia ($r^n - 1$) y restar 1 a la razón en el denominador ($r - 1$).'
  - 'Paso 4: Multiplicar por $a_1$ y simplificar la fracción resultante.'
errores_correccion: |
  - **Error 1:** Confundir el exponente de la suma ($n$) con el del término general ($n-1$). **Cómo corregirlo:** En la suma de serie geométrica **el exponente es $n$**: $S_n = \frac{a_1(r^n - 1)}{r - 1}$.
  - **Error 2:** Olvidar restar 1 en el denominador al dividir. **Cómo corregirlo:** El divisor **siempre es $(r - 1)$**, no solo $r$.
ejemplos:
  - titulo: 'Serie finita con potencias enteras'
    enunciado: 'Para $a_1 = 5, r = 2, n = 4$, ¿cuál es el valor de la serie $S_4$?'
    alternativas:
      - '$75$'
      - '$80$'
      - '$70$'
    respuesta: '$75$'
    solucion_pasos:
      - '1. $S_4 = 5(2^4 - 1) / (2 - 1) = 5(16 - 1) = 5(15) = 75$.'
  - titulo: 'Serie con razón menor que 1'
    enunciado: 'Para $a_1 = 27, r = \frac{1}{3}, n = 3$, ¿cuál es el valor de $S_3$?'
    alternativas:
      - '$39$'
      - '$36$'
      - '$40$'
    respuesta: '$39$'
    solucion_pasos:
      - '1. $S_3 = 27 + 9 + 3 = 39$.'
      - '2. Fórmula: $27(1 - 1/27) / (2/3) = 26 / (2/3) = 39$.'
  - titulo: 'Serie finita alternante'
    enunciado: '¿La serie $1 - 2 + 4 - 8 + 16$ tiene valor $S_5 = 11$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $S_5 = 1((-2)^5 - 1) / (-2 - 1) = (-32 - 1) / (-3) = -33 / -3 = 11$.'
  - titulo: 'Suma de términos iguales'
    enunciado: '¿Si $r = 1$, la serie finita de 10 términos con $a_1 = 4$ es igual a $40$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $S_{10} = 10 \cdot 4 = 40$.'
errores_frecuentes:
  - 'En la fórmula de la serie geométrica finita se utiliza exponente $(n - 1)$ en el numerador.'
  - 'Se divide la expresión por la razón $r$ omitiendo la resta de uno en el denominador.'
  - 'Una serie geométrica finita con términos alternantes de signos produce una indeterminación matemática.'
  - 'Al operar con razones fraccionarias se invierte el numerador con el denominador de la fórmula.'
  - 'Se asume que la fórmula de la serie finita solo funciona para razones enteras mayores que uno.'
afirmaciones_verdaderas:
  - 'La suma finita de los primeros $n$ términos de una serie geométrica con $r \neq 1$ es $S_n = \frac{a_1(r^n - 1)}{r - 1}$.'
  - 'La fórmula de la serie finita surge de la cancelación telescópica al restar $S_n - rS_n = a_1(1 - r^n)$.'
