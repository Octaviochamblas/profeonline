semantic_id: MAT.ALG.FUNC_CUADR_BASE.CONDICION_A_NO_CERO
resumen_inicial: La condición $a \neq 0$ es el requisito matemático indispensable para preservar el grado 2 y la naturaleza cuadrática de la función.
explicacion_simple: |
  ¿Por qué exigimos siempre que la letra $a$ **NO SEA CERO** ($a \neq 0$)?

  - Si tuviéramos la función $f(x) = ax^2 + bx + c$ y permitiéramos que $a = 0$:
    $$f(x) = 0 \cdot x^2 + bx + c \implies f(x) = bx + c$$
  - ¡El término $x^2$ desaparece por completo!
  - Lo que queda ($f(x) = bx + c$) es una **función lineal o afín** (una recta), ya no es una parábola.
  - **Conclusión**: La única condición obligatoria para que una función sea de segundo grado es que el número que multiplica a $x^2$ sea diferente de cero ($a \neq 0$).
explicacion_formal: |
  Sea la familia de funciones polinómicas $f_n(x) = \sum_{k=0}^n a_k x^k$. Para que el grado algebraico del polinomio sea estrictamente igual a 2 ($\text{deg}(f) = 2$), el **teorema de grado polinómico** exige:

  $$\text{deg}(ax^2 + bx + c) = 2 \iff a \neq 0$$

  **Consecuencia de la degeneración a grado 1 ($a = 0$):**
  Si $a = 0$, la aplicación $f: \mathbb{R} \to \mathbb{R}$ degenera linealmente:
  - Si $b \neq 0$, $f(x) = bx + c$ es una función afín con gráfica recta no horizontal.
  - Si $b = 0$, $f(x) = c$ es una función constante con gráfica recta horizontal.
  En ningún caso $a = 0$ genera la curva curva con curvatura parabólica propia de las funciones de segundo grado.
definiciones_clave: |
  - **Condición de existencia cuadrática ($a \neq 0$)**: Restricción sobre el coeficiente principal que garantiza la presencia del término de segundo grado $x^2$.
propiedades_relaciones: |
  - **Degeneración de concavidad**: Si $a \to 0$, las ramas de la parábola se abren infinitamente hasta aplanarse perdiendo el vértice y convirtiéndose en una línea recta.
ejemplo_guiado:
  enunciado: 'Determina los valores del parámetro $k$ para los cuales la función $f(x) = (k - 3)x^2 + 5x - 2$ es efectivamente una función cuadrática.'
  pasos:
    - 'Paso 1: Identificar el coeficiente cuadrático que multiplica a $x^2$: $a = k - 3$.'
    - 'Paso 2: Plantear la condición de existencia $a \neq 0$: $k - 3 \neq 0$.'
    - 'Paso 3: Despejar el parámetro $k$: $k \neq 3$.'
    - 'Paso 4: Concluir que la función es cuadrática para cualquier número real $k$ diferente de 3.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre con la gráfica de $f(x) = ax^2 + 4x + 1$ si el coeficiente $a$ toma el valor cero?'
    choices:
      - {text: 'Deja de ser una parábola y se transforma en una recta de la función afín $f(x) = 4x + 1$', is_correct: true}
      - {text: 'Se transforma en un punto aislado en el origen $(0,0)$.', is_correct: false}
      - {text: 'Se convierte en una curva de tercer grado.', is_correct: false}
      - {text: 'Mantiene su gráfica parabólica sin ningún cambio.', is_correct: false}
    explanation: 'La alternativa correcta es ''Deja de ser una parábola y se transforma en una recta de la función afín $f(x) = 4x + 1$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Para qué valor de $m$ la función $g(x) = (2m + 10)x^2 - x + 4$ dejas de ser una función cuadrática?'
    choices:
      - {text: 'Para $m = -5$', is_correct: true}
      - {text: 'Para $m = 5$', is_correct: false}
      - {text: 'Para $m = 0$', is_correct: false}
      - {text: 'Para $m = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Para $m = -5$''. Al igualar el coeficiente cuadrático a cero: $2m + 10 = 0 \implies m = -5$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Aislar el coeficiente algebraico $a$ que acompaña a la potencia $x^2$.'
  - 'Paso 2: Plantear la inecuación de restricción $a \neq 0$.'
  - 'Paso 3: Si el coeficiente $a$ depende de un parámetro $k$, resolver la desigualdad de exclusión.'
  - 'Paso 4: Declarar el dominio paramétrico válido $k \in \mathbb{R} \setminus \{k_0\}$.'
errores_correccion: |
  - **Error común:** Pensar que los coeficientes $b$ o $c$ tampoco pueden ser cero.
  - **Cómo corregirlo:** Los coeficientes **$b$ Y $c$ SÍ PUEDEN SER CERO**; el único que tiene prohibido ser cero es $a$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Parámetro en coeficiente cuadrático.
    alternativas:
      - '$k \neq 4$'
      - '$k = 4$'
      - '$k \neq 0$'
    respuesta: '$k \neq 4$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Coeficiente con potencia.
    alternativas:
      - '$m \neq 2$ y $m \neq -2$'
      - '$m \neq 4$'
      - '$m = 0$'
    respuesta: '$m \neq 2$ y $m \neq -2$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La suposición de que la prohibición de ser cero aplica también a los coeficientes $b$ y $c$.'
  - 'La idea de que si $a = 0$, la función se convierte en una curva no definida sin representación gráfica.'
  - 'Igualar a cero el coeficiente lineal $b$ para comprobar si una función es cuadrática.'
  - 'La falta de despeje de la desigualdad $a \neq 0$ cuando el coeficiente principal contiene una expresión algebraica.'
  - 'Afirmar que un coeficiente cuadrático negativo $a < 0$ viola la condición de existencia.'
afirmaciones_verdaderas:
  - 'La condición $a \neq 0$ es necesaria y suficiente para que la función $f(x) = ax^2 + bx + c$ sea de segundo grado.'
  - 'Si $a = 0$, el término cuadrático se anula y la función degenera en una regla de primer grado o constante.'
al_terminar_debes_poder: |
  QUÉ: Formular y aplicar la condición $a \neq 0$ para garantizar la existencia de funciones cuadráticas.
  CÓMO: Isolar el coeficiente de $x^2$, resolver la restricción $a \neq 0$ sobre parámetros y descartar la degeneración lineal.
