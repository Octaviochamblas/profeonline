semantic_id: MAT.ALG.FUNC_CUADR_BASE.CONDICION_A_NO_CERO
resumen_inicial: 'Condición a ≠ 0 para que la función sea cuadrática: parábola, vértice,
  concavidad y formas de Definición y elementos básicos.'
explicacion_simple: Si el coeficiente que acompaña a $x^2$ vale cero, ese término
  desaparece, y con él, todo lo que hace "cuadrática" a la función.
explicacion_formal: '### Definición formal


  En $f(x)=ax^2+bx+c$, la condición $a\neq0$ forma parte de la definición de función
  cuadrática. Si $a=0$, la expresión se reduce a $f(x)=bx+c$, que es una función afín
  (si $b\neq0$) o constante (si además $b=0$).


  ### Desarrollo didáctico


  Antes de analizar la gráfica o el vértice de una función, conviene verificar que
  el coeficiente cuadrático realmente sea distinto de cero, incluso después de simplificar
  la regla.


  Con $f(x)=(k-3)x^2+2x-1$: si $k=3$, el coeficiente de $x^2$ se anula, y $f$ deja
  de ser cuadrática, convirtiéndose en la función afín $f(x)=2x-1$.'
definiciones_clave: '- **Condición a ≠ 0 para que la función sea cuadrática**: Elemento
  o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  condición a ≠ 0 para que la función sea cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando condición a
    ≠ 0 para que la función sea cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a condición
    a ≠ 0 para que la función sea cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
