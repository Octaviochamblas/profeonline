semantic_id: MAT.ALG.FUNC_TRIG_MODELO.TANGENTE_ASINTOTAS
resumen_inicial: 'Identificación de asíntotas verticales en la función tangente: círculo
  unitario, amplitud, período y transformaciones de Modelamiento trigonométrico y
  extensiones.'
explicacion_simple: La tangente no está definida donde el coseno vale $0$, y precisamente
  ahí es donde aparecen sus asíntotas verticales.
explicacion_formal: '### Definición formal


  Como $\tan(x)=\sin(x)/\cos(x)$, la función no está definida donde $\cos(x)=0$, es
  decir, en $x=\pi/2+n\pi$. Cerca de esos valores, $|\tan(x)|\to\infty$, ya que el
  denominador se acerca a $0$ mientras el numerador no se anula simultáneamente.


  ### Desarrollo didáctico


  Cerca de $x=\pi/2$: para $x=1{,}5$ (un poco menor que $\pi/2\approx1{,}5708$), $\tan(1{,}5)\approx14{,}1$;
  para $x=1{,}57$, $\tan(1{,}57)\approx1255{,}8$. El valor crece sin límite al acercarse
  a la asíntota.'
definiciones_clave: '- **Identificación de asíntotas verticales en la función tangente**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de asíntotas verticales en la función tangente.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de asíntotas verticales en la función tangente.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de asíntotas verticales en la función
    tangente.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
