semantic_id: MAT.ALG.FUNC_TRIG_MODELO.TANGENTE_ASINTOTAS
resumen_inicial: 'Identificación y ubicación de las asíntotas verticales de la función tangente en las rectas $x = \frac{\pi}{2} + k\pi$.'
explicacion_simple: |
  Una **asíntota vertical** es una línea recta vertical invisible a la cual la gráfica de una función se acerca cada vez más y más sin llegar nunca a tocarla ni cruzarla. Puesto que la tangente se calcula dividiendo el seno entre el coseno ($\tan x = \frac{\sin x}{\cos x}$), en cualquier punto donde el coseno valga cero no se puede realizar la división. Esto ocurre en $\frac{\pi}{2}, \frac{3\pi}{2}, \frac{5\pi}{2}, \dots$ y en $-\frac{\pi}{2}, -\frac{3\pi}{2}, \dots$. En cada uno de esos ángulos existe una asíntota vertical donde la gráfica explota hacia el infinito.
explicacion_formal: |
  ### Definición formal
  Las **asíntotas verticales** de la función tangente fundamental $f(x) = \tan(x)$ son la familia infinita de rectas verticales en el plano cartesiano dadas por las ecuaciones de los ceros del denominador $\cos(x) = 0$:
  $$\mathcal{A}_{\text{vert}}(\tan) = \left\{x \in \mathbb{R} : x = \frac{\pi}{2} + k\pi, k \in \mathbb{Z}\right\} = \left\{x = \frac{(2k + 1)\pi}{2} : k \in \mathbb{Z}\right\}$$
  donde $k$ representa cualquier entero ($\dots, -2, -1, 0, 1, 2, \dots$).

  ### Desglose simbólico
  - Primera asíntota positiva: $x = \frac{\pi}{2}$ ($k = 0$).
  - Segunda asíntota positiva: $x = \frac{3\pi}{2}$ ($k = 1$).
  - Primera asíntota negativa: $x = -\frac{\pi}{2}$ ($k = -1$).
  - Comportamiento de límite lateral en $x = \frac{\pi}{2}$:
    - Por la izquierda ($x \to \frac{\pi}{2}^-$): $\lim_{x \to \frac{\pi}{2}^-} \tan(x) = +\infty$.
    - Por la derecha ($x \to \frac{\pi}{2}^+$): $\lim_{x \to \frac{\pi}{2}^+} \tan(x) = -\infty$.

  ### Síntesis didáctica
  Las asíntotas dividen el dominio de la tangente en intervalos discontinuos. La distancia horizontal entre dos asíntotas consecutivas es exactamente constante e igual al período $T = \pi$ radianes ($180^\circ$).
definiciones_clave: |
  - **Asíntota vertical**: Recta vertical de ecuación $x = c$ a la que se aproxima asintóticamente la gráfica cuando la función tiende a $\pm \infty$.
  - **Puntos de inasistencia / Indeterminación**: Ángulos donde el coseno se anula causando división por cero.
  - **Límites laterales divergentes**: Comportamiento por el cual un lado de la asíntota tiende a $+\infty$ y el otro lado tiende a $-\infty$.
propiedades_relaciones: |
  - **Espaciamiento constante**: La distancia horizontal entre cualquier par de asíntotas consecutivas de la tangente base es siempre $\pi$ unidades.
  - **Centro entre asíntotas**: El cero de cada rama de la tangente se ubica en el punto medio exacto entre sus dos asíntotas contiguas.
ejemplo_guiado:
  enunciado: 'Encuentra las ecuaciones de las asíntotas verticales de la función $f(x) = \tan(2x)$ en el intervalo $[0, \pi]$.'
  pasos:
    - 'Paso 1: Plantear la condición de asíntota igualando el argumento a la fórmula general $\frac{\pi}{2} + k\pi$: $2x = \frac{\pi}{2} + k\pi$.'
    - 'Paso 2: Despejar la variable $x$: $x = \frac{\pi}{4} + \frac{k\pi}{2}$ para $k \in \mathbb{Z}$.'
    - 'Paso 3: Evaluar los enteros $k$ dentro del intervalo $[0, \pi]$:
      - $k = 0 \implies x = \frac{\pi}{4}$
      - $k = 1 \implies x = \frac{\pi}{4} + \frac{\pi}{2} = \frac{3\pi}{4}$'
    - 'Paso 4: Concluir que las asíntotas en ese intervalo son las rectas verticales $x = \frac{\pi}{4}$ y $x = \frac{3\pi}{4}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula analítica que define a todas las asíntotas verticales de la función tangente base $f(x) = \tan(x)$?'
    choices:
      - {text: 'Las rectas verticales $x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$', is_correct: true}
      - {text: 'Las rectas verticales $x = k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: 'Las rectas horizontales $y = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: 'La recta única $x = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''Las rectas verticales $x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$''. Ocurren en los ceros del coseno.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la distancia constante entre dos asíntotas verticales consecutivas de la función tangente base?'
    choices:
      - {text: '$\pi$ radianes ($180^\circ$)', is_correct: true}
      - {text: '$2\pi$ radianes ($360^\circ$)', is_correct: false}
      - {text: '$\frac{\pi}{2}$ radianes ($90^\circ$)', is_correct: false}
      - {text: '$\frac{\pi}{4}$ radianes ($45^\circ$)', is_correct: false}
    explanation: 'La alternativa correcta es ''$\pi$ radianes ($180^\circ$)''. Distan exactamente la longitud de un período $T = \pi$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Igualar el argumento de la tangente a la fórmula general de asíntotas: $\text{argumento} = \frac{\pi}{2} + k\pi$ ($k \in \mathbb{Z}$).'
  - 'Paso 2: Despejar algebráicamente la variable $x$.'
  - 'Paso 3: Sustituir valores de $k$ para listar las asíntotas requeridas en un intervalo específico.'
  - 'Paso 4: Trazar las rectas verticales discontinuas $x = c$ en el plano cartesiano.'
errores_correccion: |
  - **Error 1:** Creer que las asíntotas ocurren en los múltiplos de $\pi$ ($x = k\pi$). **Cómo corregirlo:** En $x = k\pi$ la tangente vale cero ($\sin k\pi = 0$). Las asíntotas ocurren donde el denominador se anula ($\cos x = 0$), es decir, en los múltiplos impares de $\frac{\pi}{2}$.
  - **Error 2:** Confundir las asíntotas verticales con asíntotas horizontales. **Cómo corregirlo:** La tangente posee únicamente asíntotas verticales ($x = c$); no tiene asíntotas horizontales ya que su recorrido abarca todo $\mathbb{R}$.
ejemplos:
  - titulo: 'Primera asíntota positiva'
    enunciado: '¿En qué valor del eje X se encuentra la primera asíntota positiva de $y = \tan(x)$?'
    alternativas:
      - '$x = \frac{\pi}{2}$'
      - '$x = \pi$'
      - '$x = 0$'
    respuesta: '$x = \frac{\pi}{2}$'
    solucion_pasos:
      - '1. Con $k = 0$, $x = \frac{\pi}{2}$ ($90^\circ$).'
      - '2. La primera asíntota positiva es la recta $x = \frac{\pi}{2}$.'
  - titulo: 'Asíntotas en tangente comprimida'
    enunciado: '¿Dónde se ubica la primera asíntota positiva de $y = \tan(3x)$?'
    alternativas:
      - '$x = \frac{\pi}{6}$'
      - '$x = \frac{\pi}{2}$'
      - '$x = \frac{\pi}{3}$'
    respuesta: '$x = \frac{\pi}{6}$'
    solucion_pasos:
      - '1. Igualamos $3x = \frac{\pi}{2} \implies x = \frac{\pi}{6}$.'
  - titulo: 'Inexistencia de toque asíntotico'
    enunciado: '¿La gráfica de la tangente llega a tocar en algún punto a sus asíntotas verticales?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la curva se aproxima infinitamente sin llegar a tocarlas jamás.'
  - titulo: 'Límites divergentes'
    enunciado: '¿A ambos lados de cada asíntota de la tangente los límites laterales tienen signos opuestos ($+\infty$ y $-\infty$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la izquierda tiende a $+\infty$ y por la derecha tiende a $-\infty$.'
errores_frecuentes:
  - 'La afirmación de que las asíntotas verticales de la función tangente ocurren en los múltiplos enteros de $\pi$.'
  - 'La afirmación de que la gráfica de la función tangente logra cruzar sus asíntotas verticales.'
  - 'La afirmación de que la función tangente posee asíntotas horizontales en $y = 1$ e $y = -1$.'
  - 'La afirmación de que la distancia entre dos asíntotas verticales consecutivas de la tangente es igual a $2\pi$.'
  - 'La afirmación de que en el punto de la asíntota vertical la tangente toma el valor de cero.'
afirmaciones_verdaderas:
  - 'Las asíntotas verticales de la función tangente base $y = \tan(x)$ son las rectas de ecuación $x = \frac{\pi}{2} + k\pi$ para todo $k \in \mathbb{Z}$.'
  - 'La distancia entre dos asíntotas verticales consecutivas de la función tangente base es constante e igual a $\pi$ radianes ($180^\circ$).'
al_terminar_debes_poder: |
  QUÉ: Identificar y ubicar las asíntotas verticales de la función tangente base y de sus transformaciones.
  CÓMO: Igualar el argumento a la fórmula $\frac{\pi}{2} + k\pi$ ($k \in \mathbb{Z}$) y despejar las rectas verticales $x = c$.
