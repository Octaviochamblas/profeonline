procedimiento:
- 'Paso 1: Recuerda que las asíntotas de la tangente coinciden con los ceros del coseno.'
- 'Paso 2: Identifica esos valores como $x=\pi/2+n\pi$.'
- 'Paso 3: Verifica que la función se acerque a $\pm\infty$ cerca de cada asíntota.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en identificación de asíntotas
  verticales en la función tangente.
ejemplos:
- titulo: Identificación de una asíntota
  enunciado: ¿Es $x=3\pi/2$ una asíntota vertical de $f(x)=\tan(x)$?
  solucion_pasos:
  - 'Se verifica: $3\pi/2=\pi/2+\pi$, con $n=1$.'
  - Sí, es una asíntota vertical.
- titulo: Verificación mediante el coseno
  enunciado: ¿Por qué $x=-\pi/2$ es una asíntota de la tangente?
  solucion_pasos:
  - Se verifica que $\cos(-\pi/2)=0$.
  - Como el denominador se anula ahí, la tangente no está definida y presenta una
    asíntota vertical.
- titulo: ¿Las asíntotas de la tangente están igualmente espaciadas?
  enunciado: ¿Las asíntotas verticales consecutivas de $f(x)=\tan(x)$ están separadas
    por la misma distancia?
  respuesta: Sí
  solucion_pasos:
  - Están espaciadas exactamente $\pi$ unidades entre sí, coincidiendo con el periodo
    de la función.
- titulo: ¿$x=0$ es una asíntota vertical de la tangente?
  enunciado: ¿El valor $x=0$ corresponde a una asíntota vertical de $f(x)=\tan(x)$?
  respuesta: 'No'
  solucion_pasos:
  - $\cos(0)=1\neq0$, así que la tangente está bien definida en $x=0$, con $\tan(0)=0$.
errores_frecuentes:
- Declarar las asíntotas de la tangente con los ceros del seno.
- Suponer que las asíntotas están espaciadas cada $2\pi$ en vez de cada $\pi$.
- No verificar el valor del coseno antes de afirmar la existencia de una asíntota.
- Declarar el comportamiento de la tangente cerca de sus asíntotas con el de otras
  funciones.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  identificación de asíntotas verticales en la función tangente.
