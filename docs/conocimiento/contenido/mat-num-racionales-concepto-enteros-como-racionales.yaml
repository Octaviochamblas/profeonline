procedimiento:
- 'Paso 1: Tomar el número entero $z$.'
- 'Paso 2: Colocar $z$ en el numerador y asignar $1$ al denominador.'
- 'Paso 3: Concluir que la expresión resultante $\frac{z}{1}$ es la representación racional del entero.'
errores_correccion: '- **Error 1: Creer que los enteros son un conjunto ajeno y separado de los racionales.** **Cómo corregirlo:** Los enteros están DENTRO de los racionales ($\mathbb{Z} \subset \mathbb{Q}$).


  - **Error 2: Poner cero como denominador al intentar escribir un entero como fracción ($z/0$).** **Cómo corregirlo:** El denominador para representar enteros debe ser SIEMPRE 1 ($z/1$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es el número entero $-12$ un número racional?
  alternativas:
  - Sí, porque -12 = -12/1
  - No, porque es negativo
  - Solo si es un entero par
  respuesta: Sí, porque -12 = -12/1
  solucion_pasos:
  - $-12 = \frac{-12}{1}$, lo cual cumple la definición de $\mathbb{Q}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la representación racional del número cero?
  alternativas:
  - 0/1
  - 1/0
  - 0/0
  respuesta: 0/1
  solucion_pasos:
  - $0 = \frac{0}{1} \in \mathbb{Q}$.
- titulo: ¿Todo número entero es también un número racional?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo entero $z = \frac{z}{1}$ es un racional.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la propiedad y definición de los números racionales analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la definición formal de los números racionales entrega un resultado determinista y unívoco.
  - texto: No es posible clasificarlo dentro del conjunto numérico
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de racionalidad y restricciones de denominador permiten clasificar rigurosamente cada caso.
- titulo: ¿Es la relación de conjuntos Z c Q una proposición verdadera?
  respuesta: Sí
  solucion_pasos:
  - Sí, los enteros son un subconjunto de los números racionales.
  alternativas:
  - texto: Sí
    es_correcta: true
