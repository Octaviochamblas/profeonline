semantic_id: MAT.NUM.RACIONALES_CONCEPTO.ENTEROS_COMO_RACIONALES
resumen_inicial: Todo número entero $z \in \mathbb{Z}$ es un número racional pues
  se representa como $\frac{z}{1}$.
explicacion_simple: Todos los números enteros (positivos, negativos y el cero) forman
  parte del conjunto de los números racionales. Para convertir cualquier número entero
  en una fracción racional basta con escribirle el número 1 en el denominador.
explicacion_formal: 'Para todo entero $z \in \mathbb{Z}$, la **Inyección Canónica**
  de $\mathbb{Z}$ en $\mathbb{Q}$ se define mediante el monomorfismo de inclusión:


  $$\forall z \in \mathbb{Z}, \quad z = \frac{z}{1} \in \mathbb{Q}$$


  **Desglose de la fórmula:**

  - $z$: Número entero (minuendo, sustraendo u origen).

  - $\frac{z}{1}$: Expresión racional equivalente con numerador $z \in \mathbb{Z}$
  y denominador $1 \in \mathbb{Z} \setminus \{0\}$.


  > **Complemento didáctico:** Demuestra la inclusión $\mathbb{Z} \subset \mathbb{Q}$,
  lo que significa que el conjunto de los racionales es una extensión completa de
  los enteros.'
definiciones_clave: '- **Inclusión entera en racionales**: Propiedad por la cual $\mathbb{Z}
  \subset \mathbb{Q}$.

  - **Denominador implícito**: El número 1 que acompaña como denominador a todo número
  entero.'
propiedades_relaciones: '- **Operaciones universales**: Las propiedades de adición
  y multiplicación en $\mathbb{Z}$ se conservan en $\mathbb{Q}$.'
ejemplo_guiado:
  enunciado: Exprese los números enteros $-8$, $0$ y $14$ como números racionales
    de la forma $\frac{a}{b}$.
  pasos:
  - 'Paso 1: Expresar $-8$: $-8 = \frac{-8}{1}$. Numerador $-8 \in \mathbb{Z}$ y denominador
    $1 \neq 0$.'
  - 'Paso 2: Expresar $0$: $0 = \frac{0}{1}$. Numerador $0 \in \mathbb{Z}$ y denominador
    $1 \neq 0$.'
  - 'Paso 3: Expresar $14$: $14 = \frac{14}{1}$. Numerador $14 \in \mathbb{Z}$ y denominador
    $1 \neq 0$.'
  - 'Conclusión: Todos los enteros presentados se pueden escribir en la forma $a/b$,
    confirmando que pertenecen a $\mathbb{Q}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa cualquier número entero z en forma de número racional?
  choices:
  - text: Escribiendo z/1 con denominador 1
    is_correct: true
  - text: Escribiendo 1/z
    is_correct: false
  - text: Escribiendo z/0
    is_correct: false
  - text: Los enteros no se pueden expresar como racionales
    is_correct: false
  explanation: La alternativa correcta es 'Escribiendo z/1 con denominador 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se expresó el entero 0 como número racional?
  choices:
  - text: 0/1
    is_correct: true
  - text: 1/0
    is_correct: false
  - text: 0/0
    is_correct: false
  - text: No se puede expresar
    is_correct: false
  explanation: La alternativa correcta es '0/1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar el número entero $z$.'
- 'Paso 2: Colocar $z$ en el numerador y asignar $1$ al denominador.'
- 'Paso 3: Concluir que la expresión resultante $\frac{z}{1}$ es la representación
  racional del entero.'
errores_correccion: '- **Error 1: Creer que los enteros son un conjunto ajeno y separado
  de los racionales.** **Cómo corregirlo:** Los enteros están DENTRO de los racionales
  ($\mathbb{Z} \subset \mathbb{Q}$).


  - **Error 2: Poner cero como denominador al intentar escribir un entero como fracción
  ($z/0$).** **Cómo corregirlo:** El denominador para representar enteros debe ser
  SIEMPRE 1 ($z/1$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es el número entero $-12$ un número racional?
  alternativas:
  - Sí, porque -12 = -12/1
  - No, porque es negativo
  - Solo si es un entero par
  respuesta: Sí, porque -12 = -12/1
  solucion_pasos:
  - $-12 = \frac{-12}{1}$, lo cual cumple la definición de $\mathbb{Q}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la representación racional del número cero?
  alternativas:
  - 0/1
  - 1/0
  - 0/0
  respuesta: 0/1
  solucion_pasos:
  - $0 = \frac{0}{1} \in \mathbb{Q}$.
- titulo: ¿Todo número entero es también un número racional?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo entero $z = \frac{z}{1}$ es un racional.
- titulo: ¿Es la relación de conjuntos Z c Q una proposición verdadera?
  respuesta: Sí
  solucion_pasos:
  - Sí, los enteros son un subconjunto de los números racionales.
errores_frecuentes:
- Los números enteros y los números racionales son dos conjuntos numéricos disjuntos
  sin elementos comunes.
- Para convertir un número entero en racional se le debe colocar el número cero como
  denominador.
- El número entero cero es el único entero que no se puede escribir como número racional.
- Los enteros negativos no pertenecen al conjunto de los números racionales $\mathbb{Q}$.
- Expresar un entero $z$ como $z/1$ cambia su valor numérico original.
afirmaciones_verdaderas:
- Todo número entero $z$ es un número racional que se puede representar como $\frac{z}{1}$.
- El conjunto de los números enteros $\mathbb{Z}$ es un subconjunto de los números
  racionales $\mathbb{Q}$.
al_terminar_debes_poder: Al terminar serás capaz de representar cualquier entero como
  un número racional de la forma $\frac{z}{1}$, demostrando la inclusión $\mathbb{Z}
  \subset \mathbb{Q}$.
