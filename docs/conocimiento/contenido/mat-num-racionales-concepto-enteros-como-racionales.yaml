semantic_id: MAT.NUM.RACIONALES_CONCEPTO.ENTEROS_COMO_RACIONALES
resumen_inicial: Todo número entero puede escribirse como un número racional de denominador
  1, por eso los enteros son un subconjunto de los racionales.
explicacion_simple: 'Los enteros y los racionales no son conjuntos separados: todo
  entero puede mirarse

  también como un caso particular de número racional. Es como decir que todo cuadrado
  es

  un rectángulo: los enteros ya "califican" como racionales, solo que con un denominador

  invisible, el 1.

  '
explicacion_formal: 'Para cualquier $n\in\mathbb{Z}$, la fracción $\frac{n}{1}$ cumple
  la definición de

  número racional ($n$ y $1$ son enteros, y $1\neq0$), y además $\frac{n}{1}=n$. Esto

  demuestra que $\mathbb{Z}\subset\mathbb{Q}$: todo entero es racional, aunque no
  todo

  racional sea entero.

  '
definiciones_clave: '**Subconjunto**: un conjunto $A$ es subconjunto de $B$ si todo
  elemento de $A$ pertenece

  también a $B$. Aquí, $\mathbb{Z}\subset\mathbb{Q}$ porque todo entero es racional.

  '
propiedades_relaciones: 'No todo número racional es entero: $\frac{1}{2}$ es racional
  pero no entero. La relación

  va en un solo sentido: $\mathbb{Z}$ está "dentro" de $\mathbb{Q}$, pero $\mathbb{Q}$
  es

  más grande.

  '
ejemplo_guiado:
  enunciado: Escribe el entero -8 como un número racional.
  pasos:
  - Tomamos el entero $-8$.
  - 'Lo escribimos con denominador $1$: $-\frac{8}{1}$.'
  - 'Comprobamos: $-8\div1=-8$, el valor no cambió. Conclusión: $-8=\frac{-8}{1}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación existe entre el conjunto de los enteros y el de los racionales?
  choices:
  - text: Todo entero es racional, pero no todo racional es entero
    is_correct: true
  - text: Todo racional es entero, pero no todo entero es racional
    is_correct: false
  - text: Son conjuntos completamente separados
    is_correct: false
  - text: Son exactamente el mismo conjunto
    is_correct: false
  explanation: 'La correcta es Todo entero es racional, pero no todo racional es entero:
    $\mathbb{Z}\subset\mathbb{Q}$, no al revés.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Con el mismo procedimiento del ejemplo guiado, ¿cómo se escribe el entero
    15 como número racional?
  choices:
  - text: \$\frac{15}{1}$
    is_correct: true
  - text: \$\frac{1}{15}$
    is_correct: false
  - text: \$\frac{15}{15}$
    is_correct: false
  - text: \$\frac{0}{15}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{15}{1}$. La correcta es $\frac{15}{1}$:
    cualquier entero $n$ se escribe como $n/1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Toma el entero que quieres expresar como fracción.'
- 'Paso 2: Colócalo como numerador y usa $1$ como denominador.'
- 'Paso 3: Comprueba que al dividir por 1 el valor no cambió.'
errores_correccion: 'Un error frecuente es pensar que un entero "no es realmente"
  una fracción por no verse

  escrito con denominador. Todo entero admite la representación $n/1$, y eso basta
  para

  que sea racional.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Escribe el entero $12$ como un número racional.
  alternativas:
  - \$\frac{12}{1}$
  - \$\frac{1}{12}$
  - \$\frac{12}{12}$
  respuesta: \$\frac{12}{1}$
  solucion_pasos:
  - 'Paso a: Tomamos el entero $12$.'
  - 'Paso b: Lo escribimos con denominador $1$: $\frac{12}{1}$.'
  - 'Paso c: Comprobamos: $12\div1=12$, el valor no cambió.'
- titulo: Ejemplo 2
  enunciado: ¿Es correcto decir que el entero $0$ también es un número racional?
  alternativas:
  - Sí, porque $0=\frac{0}{1}$
  - No, porque el $0$ no es un entero
  - No se puede determinar
  respuesta: Sí, porque $0=\frac{0}{1}$
  solucion_pasos:
  - 'Paso a: El $0$ es un número entero.'
  - 'Paso b: Podemos escribirlo como $\frac{0}{1}$, con denominador distinto de cero.'
  - 'Paso c: Por lo tanto, $0$ también es racional.'
- titulo: ¿Es el número $\frac{3}{2}$ un número entero?
  respuesta: 'No'
  solucion_pasos:
  - Para ser entero, el resultado de la división debe dar un número sin parte fraccionaria.
  - $3\div2=1{,}5$, que no es un entero.
  - Por lo tanto, $\frac{3}{2}$ es racional pero no es entero.
- titulo: ¿Todo número racional es también un número entero?
  respuesta: 'No'
  solucion_pasos:
  - Existen racionales, como $\frac{1}{2}$, que no son enteros.
  - 'La relación de contención va en un solo sentido: $\mathbb{Z}\subset\mathbb{Q}$.'
  - Por lo tanto, no todo racional es entero, aunque todo entero sí es racional.
errores_frecuentes:
- Creer que un entero no puede considerarse una fracción por no escribirse con denominador
  visible.
- Pensar que todo número racional es también un número entero.
- Creer que $\mathbb{Z}$ y $\mathbb{Q}$ son conjuntos separados sin relación entre
  sí.
- Olvidar que el 0 también puede representarse como racional ($0/1$).
- Confundir la dirección de la relación de subconjunto entre $\mathbb{Z}$ y $\mathbb{Q}$.
afirmaciones_verdaderas:
- El conjunto de los números enteros es un subconjunto del conjunto de los racionales.
- El entero -8 se puede escribir como el racional $\frac{-8}{1}$.
al_terminar_debes_poder: 'Representar cualquier número entero como un número racional
  de denominador 1 y explicar

  por qué $\mathbb{Z}\subset\mathbb{Q}$.

  '
fuente: Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números
  racionales.
estado: publicado
