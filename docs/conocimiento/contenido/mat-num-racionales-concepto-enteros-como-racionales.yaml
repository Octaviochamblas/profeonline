semantic_id: MAT.NUM.RACIONALES_CONCEPTO.ENTEROS_COMO_RACIONALES
resumen_inicial: Todo número entero $z \in \mathbb{Z}$ es un número racional pues se representa como $\frac{z}{1}$.
explicacion_simple: 'Todos los números enteros (positivos, negativos y el cero) forman parte del conjunto de los números racionales. Para convertir cualquier número entero en una fracción racional basta con escribirle el número 1 en el denominador.


  ![Representación de números enteros como racionales](/static/img/nodos/representacion-de-numeros-enteros-como-racionales-intro.svg)'
explicacion_formal: 'Para todo entero $z \in \mathbb{Z}$, la **Inyección Canónica** de $\mathbb{Z}$ en $\mathbb{Q}$ se define mediante el monomorfismo de inclusión:


  $$\forall z \in \mathbb{Z}, \quad z = \frac{z}{1} \in \mathbb{Q}$$


  **Desglose de la fórmula:**

  - $z$: Número entero (minuendo, sustraendo u origen).

  - $\frac{z}{1}$: Expresión racional equivalente con numerador $z \in \mathbb{Z}$ y denominador $1 \in \mathbb{Z} \setminus \{0\}$.


  > **Complemento didáctico:** Demuestra la inclusión $\mathbb{Z} \subset \mathbb{Q}$, lo que significa que el conjunto de los racionales es una extensión completa de los enteros.'
definiciones_clave: '- **Inclusión entera en racionales**: Propiedad por la cual $\mathbb{Z} \subset \mathbb{Q}$.

  - **Denominador implícito**: El número 1 que acompaña como denominador a todo número entero.'
propiedades_relaciones: '- **Operaciones universales**: Las propiedades de adición y multiplicación en $\mathbb{Z}$ se conservan en $\mathbb{Q}$.'
ejemplo_guiado:
  enunciado: 'Exprese los números enteros $-8$, $0$ y $14$ como números racionales de la forma $\frac{a}{b}$.


    ![Ejemplo Representación de números enteros como racionales](/static/img/nodos/representacion-de-numeros-enteros-como-racionales-ejemplos.svg)'
  pasos:
  - 'Paso 1: Expresar $-8$: $-8 = \frac{-8}{1}$. Numerador $-8 \in \mathbb{Z}$ y denominador $1 \neq 0$.'
  - 'Paso 2: Expresar $0$: $0 = \frac{0}{1}$. Numerador $0 \in \mathbb{Z}$ y denominador $1 \neq 0$.'
  - 'Paso 3: Expresar $14$: $14 = \frac{14}{1}$. Numerador $14 \in \mathbb{Z}$ y denominador $1 \neq 0$.'
  - 'Conclusión: Todos los enteros presentados se pueden escribir en la forma $a/b$, confirmando que pertenecen a $\mathbb{Q}$.'
