    retroalimentacion: Incorrecto, los criterios de racionalidad y restricciones de denominador permiten clasificar rigurosamente cada caso.
errores_frecuentes:
- Los números enteros y los números racionales son dos conjuntos numéricos disjuntos sin elementos comunes.
- Para convertir un número entero en racional se le debe colocar el número cero como denominador.
- El número entero cero es el único entero que no se puede escribir como número racional.
- Los enteros negativos no pertenecen al conjunto de los números racionales $\mathbb{Q}$.
- Expresar un entero $z$ como $z/1$ cambia su valor numérico original.
afirmaciones_verdaderas:
- Todo número entero $z$ es un número racional que se puede representar como $\frac{z}{1}$.
- El conjunto de los números enteros $\mathbb{Z}$ es un subconjunto de los números racionales $\mathbb{Q}$.
al_terminar_debes_poder: "**QUÉ:** Representar cualquier número entero como un número racional mediante infinitas fracciones equivalentes.\n\n**CÓMO:** Asignando el denominador unitario implícito $z = \frac{z}{1}$ y amplificando por un factor no nulo $z = \frac{k \\cdot z}{k}$ para facilitar la homogeneización en operaciones con fracciones.\n\n![Resumen Representación de números enteros como racionales](/static/img/nodos/representacion-de-numeros-enteros-como-racionales-resumen.svg)"
