errores_frecuentes:
- La afirmación de que la redistribución de paréntesis altera el conjunto resultante en una cadena de intersecciones.
- La afirmación de que la propiedad asociativa se cumple cuando se mezclan intersecciones con diferencias de conjuntos.
- La afirmación de que la intersección triple depende del orden temporal en que se comparen los conjuntos.
- La afirmación de que la asociatividad de la intersección no es aplicable a conjuntos infinitos.
- La afirmación de que $(A \cap B) \cap C$ genera un conjunto de mayor cardinalidad que $A \cap (B \cap C)$.
afirmaciones_verdaderas:
- La intersección de conjuntos es asociativa para cualquier terna de conjuntos ($(A \cap B) \cap C = A \cap (B \cap C)$).
- La asociatividad de la intersección se deriva de la equivalencia tautológica de la conjunción lógica ($(P \land Q) \land R \equiv P \land (Q \land R)$).
