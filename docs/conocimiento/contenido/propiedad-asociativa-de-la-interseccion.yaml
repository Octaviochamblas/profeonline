- placement: after_ejemplo_guiado
  question: Si $A \cap B = \emptyset$, ¿cuánto vale la expresión $(A \cap B) \cap C$ para cualquier conjunto $C$?
  choices:
  - text: $\emptyset$ (conjunto vacío)
    is_correct: true
  - text: $C$
    is_correct: false
  - text: $\mathcal{U}$
    is_correct: false
  - text: $A \cup C$
    is_correct: false
  explanation: La alternativa correcta es '$\emptyset$ (conjunto vacío)'. Al ser $A \cap B = \emptyset$, intersectar con cualquier $C$ da $\emptyset \cap C = \emptyset$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la proposición lógica $((x \in A \land x \in B) \land x \in C)$.'
- 'Paso 2: Aplicar la asociatividad de la conjunción lógica para agrupar como $(x \in A \land (x \in B \land x \in C))$.'
- 'Paso 3: Traducir a notación conjuntista $x \in (A \cap (B \cap C))$.'
- 'Paso 4: Concluir la igualdad $(A \cap B) \cap C = A \cap (B \cap C)$ por el axioma de extensionalidad.'
errores_correccion: '- **Error 1:** Modificar los operadores en vez de los paréntesis al aplicar la asociatividad. **Cómo corregirlo:** La asociatividad exige que todos los operadores sean de intersección ($\cap$ y $\cap$); combinar $\cap$ con $\cup$ requiere aplicar distributividad.

  - **Error 2:** Creer que si un par tiene intersección vacía, la intersección triple puede no ser vacía. **Cómo corregirlo:** Si $A \cap B = \emptyset$, entonces automáticamente $(A \cap B) \cap C = \emptyset \cap C = \emptyset$.

  '
ejemplos:
- titulo: Intersección con números naturales
  enunciado: Dado $A = \{2, 4, 6\}$, $B = \{4, 6, 8\}$, $C = \{6, 8, 10\}$, ¿cuál es $(A \cap B) \cap C$?
  alternativas:
  - $\{6\}$
  - $\{4, 6\}$
  - $\emptyset$
  respuesta: $\{6\}$
  solucion_pasos:
  - 1. $A \cap B = \{4, 6\}$.
  - 2. $\{4, 6\} \cap \{6, 8, 10\} = \{6\}$.
- titulo: Intersección múltiple sin paréntesis
  enunciado: ¿Es correcto escribir $A \cap B \cap C$ sin paréntesis?
  respuesta: Sí, gracias a la propiedad asociativa
  solucion_pasos:
  - La asociatividad elimina toda ambigüedad en la evaluación.
  alternativas:
  - texto: Sí, gracias a la propiedad asociativa
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Intersección con el conjunto universal
  enunciado: ¿$(A \cap B) \cap \mathcal{U} = A \cap (B \cap \mathcal{U})$?
  respuesta: Sí, ambos dan $A \cap B$
  solucion_pasos:
  - Por asociatividad y elemento neutro.
  alternativas:
  - texto: Sí, ambos dan $A \cap B$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Intersección nula
  enunciado: Si $A \cap C = \emptyset$, ¿cuánto vale $(A \cap B) \cap C$?
  respuesta: $\emptyset$
  solucion_pasos:
  - 'Por asociatividad y conmutatividad: $(A \cap C) \cap B = \emptyset \cap B = \emptyset$.'
  alternativas:
  - texto: $\emptyset$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
