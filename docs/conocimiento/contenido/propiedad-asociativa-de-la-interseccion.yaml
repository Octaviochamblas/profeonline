semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.ASOCIATIVA_INTERSECCION
resumen_inicial: 'Demostración lógica, propiedades y aplicación de la propiedad asociativa de la intersección de conjuntos: $(A \cap B) \cap C = A \cap (B \cap C)$.'
explicacion_simple: 'La **propiedad asociativa de la intersección** establece que cuando buscamos los elementos comunes entre tres o más conjuntos, **la forma de agruparlos con paréntesis no cambia el resultado final**: **$(A \cap B) \cap C = A \cap (B \cap C)$**. Los elementos finales son exactamente aquellos que pertenecen a los tres conjuntos al mismo tiempo. Por eso, podemos escribir directamente **$A \cap B \cap C$** sin preocuparnos por los paréntesis.


  ![propiedad-asociativa-de-la-interseccion](/static/img/nodos/propiedad-asociativa-de-la-interseccion-intro.svg)'
explicacion_formal: '### Definición formal

  En la teoría de conjuntos y el álgebra de Boole, la operación binaria de intersección es **asociativa**:

  $$\forall A, B, C \subseteq \mathcal{U}, \quad (A \cap B) \cap C = A \cap (B \cap C)$$

  Demostración formal basada en la asociatividad de la conjunción lógica ($\land$):

  $$x \in ((A \cap B) \cap C) \iff (x \in A \land x \in B) \land x \in C \iff x \in A \land (x \in B \land x \in C) \iff x \in (A \cap (B \cap C))$$

  Por el axioma de extensionalidad, se concluye la identidad de los conjuntos.


  ### Desglose simbólico

  - Ley lógica subyacente: $(P \land Q) \land R \equiv P \land (Q \land R)$.

  - Notación directa: $A \cap B \cap C = \{x \in \mathcal{U} \mid x \in A \land x \in B \land x \in C\}$.

  - Generalización a familias: $\bigcap_{i=1}^n A_i$ es invariante ante cualquier árbol de evaluación binaria.


  > **Complemento didáctico:** La asociatividad de la intersección preserva la triple pertenencia sin importar el orden secuencial de los filtros conjuntistas aplicados.

  '
definiciones_clave: '- **Propiedad asociativa de la intersección**: Invarianza del conjunto de elementos comunes ante la redistribución de paréntesis.

  - **Asociatividad de la conjunción**: Equivalencia lógica $(P \land Q) \land R \equiv P \land (Q \land R)$.

  - **Triple intersección ($A \cap B \cap C$)**: Región central simultáneamente compartida por todos los conjuntos.

  '
propiedades_relaciones: '- **Estructura de semigrupo**: $(\mathcal{P}(\mathcal{U}), \cap)$ es un semigrupo asociativo con elemento neutro $\mathcal{U}$.

  - **Diagrama de Venn**: Tanto $(A \cap B) \cap C$ como $A \cap (B \cap C)$ sombrean exclusivamente la región nuclear central $R_{111}$.

  '
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{1, 2, 3, 4\}$, $B = \{2, 3, 4, 5\}$ y $C = \{3, 4, 5, 6\}$, demuestra por extensión que $(A \cap B) \cap C = A \cap (B \cap C)$.


    ![Ejemplo propiedad-asociativa-de-la-interseccion](/static/img/nodos/propiedad-asociativa-de-la-interseccion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Resolver el lado izquierdo $(A \cap B) \cap C$: - Primero calcular el paréntesis: $A \cap B = \{1, 2, 3, 4\} \cap \{2, 3, 4, 5\} = \{2, 3, 4\}$. - Intersectar con $C$: $(A \cap B) \cap C = \{2, 3, 4\} \cap \{3, 4, 5, 6\} = \{3, 4\}$.'
  - 'Paso 2: Resolver el lado derecho $A \cap (B \cap C)$: - Primero calcular el paréntesis: $B \cap C = \{2, 3, 4, 5\} \cap \{3, 4, 5, 6\} = \{3, 4, 5\}$. - Intersectar con $A$: $A \cap (B \cap C) = \{1, 2, 3, 4\} \cap \{3, 4, 5\} = \{3, 4\}$.'
  - 'Paso 3: Comparar ambos resultados: $\{3, 4\} = \{3, 4\}$.'
  - 'Paso 4: Concluir formalmente la validez de la propiedad asociativa de la intersección.'
