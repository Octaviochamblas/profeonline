semantic_id: MAT.GEO.POLIGONOS_METRICA.DIAGONAL_CONCEPTO
resumen_inicial: 'Concepto de diagonal como segmento que une vértices no consecutivos
  de un polígono: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos
  y Cuadriláteros.'
explicacion_simple: Dentro de un polígono es posible trazar segmentos que conectan
  vértices que no son adyacentes entre sí; estos segmentos reciben un nombre especial.
explicacion_formal: '![Diagonal de un polígono](/static/img/geometria/poligonos-cuadrilateros/poligonos-diagonal-concepto.svg)


  ### Definición formal


  En un polígono, una diagonal es el segmento $\overline{P_iP_j}$ que une dos vértices
  $P_i$ y $P_j$ que no son adyacentes (es decir, no están unidos directamente por
  un lado).


  ### Desarrollo didáctico


  En un hexágono ABCDEF, el segmento AD es una diagonal (A y D no son vértices consecutivos),
  mientras que AB es un lado (A y B sí son consecutivos). Los triángulos son el único
  tipo de polígono que no tiene diagonales, ya que todos sus vértices son consecutivos
  entre sí.'
definiciones_clave: '- **Concepto de diagonal como segmento que une vértices no consecutivos
  de un polígono**: Elemento o propiedad fundamental en el estudio de polígonos y
  cuadriláteros.'
