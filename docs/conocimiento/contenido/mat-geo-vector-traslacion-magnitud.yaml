semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.VECTOR_TRASLACION_MAGNITUD
resumen_inicial: 'Interpretación de la magnitud del vector traslación: conceptos,
  teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: La magnitud del vector traslación indica 'qué tan lejos' se mueve
  la figura, sin importar la dirección específica del desplazamiento.
explicacion_formal: '![Magnitud del vector traslación](/static/img/geometria/isometrias/vector-traslacion-magnitud.svg)


  ### Definición formal


  Si el vector traslación es $\vec{v}=(a,b)$, su magnitud es $|\vec{v}|=\sqrt{a^2+b^2}$.
  Esta magnitud representa la distancia (en las mismas unidades del plano) que recorre
  cada punto de la figura durante la traslación.


  ### Desarrollo didáctico


  Si el vector traslación es $\vec{v}=(3,4)$, su magnitud es $|\vec{v}|=\sqrt{3^2+4^2}=\sqrt{25}=5$:
  cada punto de la figura se desplaza exactamente 5 unidades de distancia.'
definiciones_clave: '- **Interpretación de la magnitud del vector traslación**: Elemento
