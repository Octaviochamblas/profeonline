semantic_id: MAT.NUM.ENTEROS_CONJUNTO.VALOR_ABSOLUTO_NOTACION
resumen_inicial: "El valor absoluto se escribe con dos barras verticales: $|a|$. Significa 'la distancia de $a$ al cero', y por eso nunca da negativo."
explicacion_simple: |
  Para escribir el valor absoluto usamos dos barritas verticales alrededor del número: $|$número$|$.
  Es como decirle al número "olvídate del signo, solo dame la distancia al cero". Por ejemplo,
  $|5|=5$ y $|-5|=5$, porque ambos están a 5 pasos del cero.
explicacion_formal: |
  Formalmente, $|x| = x$ si $x \geq 0$, y $|x| = -x$ si $x < 0$ (donde $-x$ es el opuesto positivo
  del negativo). El resultado de $|x|$ es siempre positivo o cero: las barras extraen la magnitud
  del número sin conservar su signo.
definiciones_clave: |
  **Notación de valor absoluto**: $|a|$, se lee "valor absoluto de $a$". **Definición por casos**:
  $|x|=x$ si $x\geq 0$; $|x|=-x$ si $x<0$.
propiedades_relaciones: |
  $|0| = 0$ es el único caso donde el resultado no es estrictamente positivo. Las barras $|\,|$ no
  son intercambiables con paréntesis ni corchetes: son un operador específico para la distancia al
  origen.
ejemplo_guiado:
  enunciado: "Calcula el valor de la expresión $|-6| + |9|$."
  pasos:
    - "Se resuelve el primer valor absoluto: $|-6| = 6$."
    - "Se resuelve el segundo valor absoluto: $|9| = 9$."
    - "Se suman los resultados: $6 + 9 = 15$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Según la definición por casos, ¿cuánto vale $|x|$ cuando $x < 0$?"
    choices:
      - {text: "$x$", is_correct: false}
      - {text: "$-x$", is_correct: true}
      - {text: "$0$", is_correct: false}
      - {text: "No está definido", is_correct: false}
    explanation: "La correcta es $-x$: cuando $x$ es negativo, su valor absoluto es su opuesto positivo, es decir $-x$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto vale $|-3| + |-11|$?"
    choices:
      - {text: "$-14$", is_correct: false}
      - {text: "$8$", is_correct: false}
      - {text: "$14$", is_correct: true}
      - {text: "$-8$", is_correct: false}
    explanation: "La correcta es $14$, porque $|-3|=3$, $|-11|=11$, y $3+11=14$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Escribir el número entero entre dos barras verticales ($|\,|$).'
  - "Paso 2: Evaluar el signo del número contenido."
  - "Paso 3: Si el número es negativo, escribir su valor positivo correspondiente (su opuesto)."
  - "Paso 4: Si el número es positivo o cero, el resultado es el mismo número."
errores_correccion: |
  Un error frecuente es escribir $|-9| = -9$: las barras siempre entregan un resultado positivo o
  cero, nunca conservan el signo negativo del interior. Otro error es confundir las barras de valor
  absoluto con paréntesis o corchetes normales; son un operador distinto que calcula distancia, no
  solo agrupa.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcule el valor de la expresión $|-15| + |4|$."
    solucion_pasos:
      - "Se resuelve el primer valor absoluto: $|-15| = 15$."
      - "Se resuelve el segundo valor absoluto: $|4| = 4$."
      - "Se suman los resultados: $15 + 4 = 19$."
      - "Resultado: $19$."
  - titulo: "Ejemplo 2"
    enunciado: "Indique la veracidad de la afirmación: $|-8| = -8$."
    solucion_pasos:
      - "Se identifica la notación de valor absoluto en el lado izquierdo."
      - "Se aplica la definición: la distancia de $-8$ al origen es 8 positivo; $|-8| = 8$."
      - "Se compara $8$ con $-8$: son distintos."
      - "Conclusión: La afirmación es falsa; el resultado de un valor absoluto nunca puede ser negativo."
  - titulo: "¿Es verdad que $|-6| = 6$?"
    respuesta: "Sí"
    solucion_pasos:
      - "$-6$ es un número negativo, por lo que su valor absoluto es su opuesto."
      - "Aplicando la definición: $|-6| = -(-6) = 6$."
      - "Por lo tanto, $|-6| = 6$ es una afirmación verdadera."
  - titulo: "¿Puede escribirse $|{-3}| = -3$?"
    respuesta: "No"
    solucion_pasos:
      - "Las barras de valor absoluto extraen la magnitud del número, eliminando el signo negativo."
      - "$|-3| = 3$, no $-3$: el resultado siempre es positivo o cero."
      - "Por lo tanto, no puede escribirse $|-3| = -3$."
errores_frecuentes:
  - "$|-9|$ es igual a $-9$ porque el número dentro lleva signo negativo."
  - "Las barras de valor absoluto son lo mismo que los paréntesis o los corchetes."
  - "$|0| = 1$ porque el valor absoluto convierte todo en positivo."
  - "La expresión $|a|$ siempre entrega un resultado distinto de $a$."
  - "El valor absoluto de un número positivo grande es menor que el de un negativo pequeño."
al_terminar_debes_poder: |
  Evaluar correctamente expresiones con notación de valor absoluto, incluyendo sumas y combinaciones
  de varios términos con barras.

fuente: "Matemática Moraleja Tomo 1 p.21"
estado: publicado
