semantic_id: MAT.NUM.ENTEROS_CONJUNTO.VALOR_ABSOLUTO_NOTACION
resumen_inicial: Las barras $|x|$ son un operador prioritario; los signos externos
  como $-|x|$ operan al final.
explicacion_simple: El valor absoluto se escribe colocando el número dentro de dos
  barras verticales paralelas, como $|x|$. Las barras actúan como un operador que
  elimina el signo negativo del contenido interior, dejando únicamente su magnitud
  escalar positiva o cero.
explicacion_formal: 'La **Notación Operativa de Barras** $|P(x)|$ opera como un operador
  algebraico prioritario sobre el bloque interior $P(x)$:


  $$|-a| = |a| = a \quad \forall a \in \mathbb{Z}_{\ge 0} \qquad \text{mientras que
  } -|x| \le 0$$


  **Desglose de la fórmula:**

  - $|x|$: Notación con barras envolventes que exige resolver prioritariamente el
  contenido interior.

  - $-|x|$: Opuesto del valor absoluto, el cual coloca un signo menos fuera de las
  barras garantizando un resultado $\le 0$.

  - $|-a| = a$: Eliminación del signo negativo interno para obtener el módulo no negativo.


  > **Complemento didáctico:** Un signo menos fuera de las barras, $-|x|$, se aplica
  únicamente después de calcular el valor absoluto positivo interior.'
definiciones_clave: '- **Barras verticales**: Símbolo $|\cdot|$ que delimita la operación
  de valor absoluto.

  - **Opuesto del valor absoluto**: Expresión $-|x|$ cuyo resultado es siempre no
  positivo ($\le 0$).'
propiedades_relaciones: '- **Prioridad de barras**: Lo que está dentro de $|\dots|$
  se resuelve antes de aplicar operadores externos.'
ejemplo_guiado:
  enunciado: Evalúe la expresión $-|-7|$ explicando el orden de aplicación de los
    signos.
  pasos:
  - 'Paso 1: Resolver el valor absoluto del interior de las barras: $|-7| = 7$.'
  - 'Paso 2: Aplicar el signo menos antecedente ubicado fuera de las barras: $-(7)
    = -7$.'
  - 'Conclusión: El resultado de $-|-7|$ es $-7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la expresión -|-7|?
  choices:
  - text: '-7'
    is_correct: true
  - text: '7'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '14'
    is_correct: false
  explanation: La alternativa correcta es '-7', pues $|-7|=7$ y el menos exterior
    lo convierte en -7.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la evaluación de -|-7|, ¿qué operación se realiza primero?
  choices:
  - text: El valor absoluto dentro de las barras
    is_correct: true
  - text: Multiplicar el menos externo por el interno
    is_correct: false
  - text: Restar 7 a cero
    is_correct: false
  - text: Cancelar las barras
    is_correct: false
  explanation: La alternativa correcta es 'El valor absoluto dentro de las barras'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver las operaciones dentro de las barras $|\dots|$.'
- 'Paso 2: Convertir el resultado interior a su valor no negativo.'
- 'Paso 3: Aplicar los signos o multiplicadores que se encuentren fuera de las barras.'
errores_correccion: '- **Error 1: Confundir barras de valor absoluto con paréntesis
  ordinarios.** **Cómo corregirlo:** Las barras transforman todo resultado negativo
  interno a positivo.


  - **Error 2: Omitir la prioridad de las barras al evaluar $-|-5|$.** **Cómo corregirlo:**
  Se calcula primero $|-5| = 5$, y luego se aplica el menos exterior dando $-5$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $-|-10| + |4|$.
  alternativas:
  - '-6'
  - '14'
  - '-14'
  respuesta: '-6'
  solucion_pasos:
  - $-|-10| = -10$ y $|4| = 4$. Su suma es $-10 + 4 = -6$.
- titulo: Ejemplo 2
  enunciado: ¿Qué signo tiene siempre el resultado de la expresión $-|x|$ para $x
    \neq 0$?
  alternativas:
  - Negativo
  - Positivo
  - Neutro
  respuesta: Negativo
  solucion_pasos:
  - $|x|$ es positivo, por ende $-|x|$ resulta siempre en un valor negativo.
- titulo: ¿Es lo mismo escribir -(-5) que -|-5|?
  respuesta: 'No'
  solucion_pasos:
  - No, $-(-5) = +5$, mientras que $-|-5| = -5$.
- titulo: ¿Las barras de valor absoluto tienen jerarquía prioritaria sobre multiplicaciones
    externas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el contenido dentro de las barras se evalúa en primer lugar.
errores_frecuentes:
- La expresión $-|-7|$ evalúa al número entero positivo $+7$.
- Las barras de valor absoluto $|x|$ se comportan exactamente como paréntesis $(-x)$.
- Multiplicar un número por barras de valor absoluto invierte siempre su signo a positivo.
- El signo menos ubicado fuera de las barras $-|x|$ es eliminado por el operador valor
  absoluto.
- La expresión $|x - y|$ equivale a la resta directa de los valores absolutos $|x|
  - |y|$.
afirmaciones_verdaderas:
- Un signo menos fuera de las barras de valor absoluto $-|x|$ produce un resultado
  menor o igual a cero.
- El valor dentro de las barras $|x|$ se calcula prioritariamente antes de operar
  los signos externos.
al_terminar_debes_poder: Al terminar serás capaz de evaluar expresiones con la notación
  $|x|$, distinguiendo los signos dentro de las barras de los signos ubicados fuera
  de las barras.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
