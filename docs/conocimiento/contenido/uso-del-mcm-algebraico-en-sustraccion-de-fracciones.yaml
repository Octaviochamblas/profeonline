semantic_id: MAT.ALG.FRACCIONES_RESTA.USO_MCM
resumen_inicial: El m.c.m. de los denominadores minimiza los factores de amplificación
  al restar fracciones algebraicas.
explicacion_simple: 'Al restar fracciones algebraicas compuestas, utilizar el m.c.m.
  de los denominadores es el camino más rápido y limpio.

  Al elegir el m.c.m. como denominador común, evitamos generar numeradores con exponentes
  innecesariamente altos, lo que facilita enormemente la distribución de signos y
  la reducción de términos semejantes.'
explicacion_formal: 'Para la resta $\frac{A(x)}{D_1(x)} - \frac{B(x)}{D_2(x)}$, el
  **m.c.m. óptimo** $M(x) = \operatorname{mcm}(D_1, D_2)$ reduce la operación a:


  $$\frac{A(x) \cdot \left(\frac{M(x)}{D_1(x)}\right) - \left(B(x) \cdot \left(\frac{M(x)}{D_2(x)}\right)\right)}{M(x)}$$


  **Desglose de la fórmula:**

  - $M(x)$: Expresión m.c.m. mónica de menor grado posible.

  - $\frac{M(x)}{D_2(x)}$: Factor de amplificación mínimo para el sustraendo que debe
  distribuirse respetando el signo menos.'
definiciones_clave: '- **Mínimo común denominador en sustracción**: El m.c.m. de denominadores
  aplicado a la resta de fracciones.

  - **Factor de amplificación de resta**: Multiplicador mínimo de la fracción sustraendo.'
propiedades_relaciones: '- **Prevención de sobre-amplificación**: Evita trabajar con
  polinomios de grado 3 o 4 al restar binomios que comparten factores.

  - **Facilidad de factorización posterior**: Facilita hallar factores comunes entre
  el numerador reducido y el m.c.m. del denominador.'
ejemplo_guiado:
  enunciado: Utiliza el m.c.m. de los denominadores para restar $\frac{3}{x^2 - 4}
    - \frac{1}{x^2 + 2x}$, reduce la fracción final y evalúa para $x = 3$.
  pasos:
  - 'Paso 1: Factorizar denominadores: $x^2 - 4 = (x - 2)(x + 2)$ y $x^2 + 2x = x(x
    + 2)$.Paso 2: Calcular m.c.m.: $M(x) = x(x - 2)(x + 2)$.Paso 3: Amplificar numeradores:
    primer numerador por $x$, segundo por $(x - 2)$.Paso 4: Escribir la resta de numeradores:
    $\frac{3(x) - 1(x - 2)}{x(x - 2)(x + 2)} = \frac{3x - x + 2}{x(x^2 - 4)} = \frac{2x
    + 2}{x(x^2 - 4)}$.Paso 5: Evaluar para $x = 3$: $\frac{2(3) + 2}{3(3^2 - 4)} =
    \frac{6 + 2}{3(9 - 4)} = \frac{8}{3(5)} = \frac{8}{15}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente reducida al restar $\frac{3}{x^2 - 4}
    - \frac{1}{x^2 + 2x}$?
  choices:
  - text: $\frac{2x + 2}{x(x^2 - 4)}$
    is_correct: true
  - text: $\frac{2x - 2}{x(x^2 - 4)}$
    is_correct: false
  - text: $\frac{2}{x(x + 2)}$
    is_correct: false
  - text: $\frac{4x + 2}{x(x^2 - 4)}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{2x + 2}{x(x^2 - 4)}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta reducida $\frac{2x + 2}{x(x^2 - 4)}$ para $x = 3$,
    ¿cuál es el resultado obtenido?
  choices:
  - text: $\frac{8}{15}$
    is_correct: true
  - text: $\frac{4}{15}$
    is_correct: false
  - text: $\frac{8}{5}$
    is_correct: false
  - text: $\frac{2}{5}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{8}{15}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente todos los denominadores.'
- 'Paso 2: Hallar el m.c.m. tomando todos los factores primos con su mayor exponente.'
- 'Paso 3: Determinar el factor de amplificación para cada fracción.'
- 'Paso 4: Multiplicar numeradores y restar protegiendo el segundo con paréntesis.'
- 'Paso 5: Expandir, reducir términos semejantes y presentar la fracción simplificada.'
errores_correccion: '- **Error común:** Usar el producto de denominadores sin haberlos
  factorizado previamente.

  - **Cómo corregirlo:** Factoriza siempre primero. El m.c.m. te evitará tener que
  multiplicar y restar polinomios de grado innecesariamente alto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
fuente: Texto escolar MINEDUC — Álgebra / Fracciones Algebraicas
