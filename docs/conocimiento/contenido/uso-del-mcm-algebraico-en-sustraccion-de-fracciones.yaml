semantic_id: MAT.ALG.FRACCIONES_RESTA.USO_MCM
resumen_inicial: 'Uso del m.c.m. algebraico en sustracción de fracciones: concepto,
  reglas operativas y simplificación en Sustracción de fracciones algebraicas.'
explicacion_simple: Al igual que en la suma, usar el MCM para el común denominador
  en las restas evita que los polinomios se hinchen innecesariamente.
explicacion_formal: '### Definición formal


  Identificar factores repetidos para no incluirlos múltiples veces en el denominador
  común.


  ### Desarrollo didáctico


  El uso del MCM en la resta es idéntico a la suma, pero la presión aumenta al momento
  de armar el gran numerador final por culpa de los signos negativos.


  Al construir el numerador unificado:

  $\frac{ \text{Num1}(\text{lo que faltaba}) - \text{Num2}(\text{lo que faltaba})
  }{ \text{MCM} }$


  Ese signo menos intermedio multiplicará al desarrollo de $\text{Num2}(\text{lo que
  faltaba})$.


  **Recomendación de oro:** Desarrolla la multiplicación de $\text{Num2}(\text{lo
  que faltaba})$ manteniendo un gran corchete de seguridad, y solo cuando hayas terminado
  de multiplicar los paréntesis internos, distribuye el signo negativo externo para
  invertir todos los signos resultantes de golpe.'
definiciones_clave: '- **Uso del m.c.m. algebraico en sustracción de fracciones**:
  Procedimiento o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a uso del m.c.m. algebraico en sustracción
  de fracciones.'
ejemplo_guiado:
  enunciado: Simplifica o resuelve la expresión aplicando uso del m.c.m. algebraico
    en sustracción de fracciones.
  pasos:
  - Factorizar los numeradores y denominadores involucrados.
  - Identificar restricciones del dominio (denominador no nulo).
  - Aplicar la regla o procedimiento correspondiente a uso del m.c.m. algebraico en
    sustracción de fracciones.
  - Simplificar los factores comunes y escribir el resultado final irreducible.
