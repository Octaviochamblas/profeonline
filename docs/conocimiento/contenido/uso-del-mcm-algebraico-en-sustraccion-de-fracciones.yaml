  explanation: La alternativa correcta es '$\frac{8}{15}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente todos los denominadores.'
- 'Paso 2: Hallar el m.c.m. tomando todos los factores comunes y no comunes a su mayor exponente.'
- 'Paso 3: Determinar el factor de amplificación mínimo para cada fracción dividiendo el m.c.m. entre su denominador.'
- 'Paso 4: Multiplicar numeradores y restar protegiendo el segundo con paréntesis.'
- 'Paso 5: Expandir, reducir términos semejantes y presentar la fracción simplificada.'
errores_correccion: '- **Error 1:** Multiplicar los denominadores desplegados sin factorizar (usar $P(x) \cdot Q(x)$ en lugar
  del m.c.m.). **Cómo corregirlo:** Se deben **FACTORIZAR PRIMERO LOS DENOMINADORES PARA CONSTRUIR EL M.C.M. ÓPTIMO DE MENOR
  GRADO**.

  - **Error 2:** Omitir el paréntesis al multiplicar el factor de amplificación por el sustraendo. **Cómo corregirlo:** El
  producto de amplificación del sustraendo **DEBE ENCERRARSE ENTRE PARÉNTESIS PARA DISTRIBUIR EL SIGNO MENOS**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el m.c.m. entre los denominadores al restar $\frac{1}{x^2-x} - \frac{1}{x^2}$?
  alternativas:
  - $x^2(x-1)$
  - $x^3(x-1)$
  - $x(x-1)$
  respuesta: $x^2(x-1)$
  solucion_pasos:
  - '1. Denominadores: $x(x-1)$ y $x^2$.'
  - '2. Factores con mayor exponente: $x^2$ y $(x-1)$.'
  - '3. m.c.m.: $x^2(x-1)$.'
- titulo: Ejemplo 2
  enunciado: Al restar $\frac{2}{x-2} - \frac{4}{x^2-4}$, ¿cuál es la fracción equivalente sobre el denominador m.c.m.?
  alternativas:
  - $\frac{2x}{(x-2)(x+2)}$
  - $\frac{2x-8}{(x-2)(x+2)}$
  - $\frac{2x+8}{(x-2)(x+2)}$
  respuesta: $\frac{2x}{(x-2)(x+2)}$
  solucion_pasos:
  - '1. Denominador común m.c.m.: $(x-2)(x+2)$.'
  - '2. Numerador: $2(x+2) - 4 = 2x + 4 - 4 = 2x$.'
- titulo: Ventaja del m.c.m.
  enunciado: ¿Usar el m.c.m. como denominador común evita potencias innecesarias en el numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, mantiene los grados de los términos al mínimo.
- titulo: Omisión de factorización previa
  enunciado: ¿Es conveniente multiplicar los denominadores directamente sin haberlos factorizado?
  respuesta: 'No'
  solucion_pasos:
  - No, complica el cálculo de la resta al elevar el grado de los polinomios.
errores_frecuentes:
- El mínimo común denominador entre $\frac{1}{x^2-4}$ y $\frac{1}{x^2+2x}$ es el producto polinomial no factorizado $(x^2-4)(x^2+2x)$.
- Al restar fracciones con denominadores $x^2-x$ y $x^2$, el m.c.m. es la suma de denominadores $2x^2-x$.
- El m.c.m. entre $x+2$ y $x-2$ equivale a su diferencia $4$.
- Al utilizar el m.c.m., el factor de amplificación del sustraendo se multiplica sin utilizar paréntesis protectores.
- El m.c.m. de dos denominadores en la resta coincide siempre con su M.C.D.
afirmaciones_verdaderas:
- El m.c.m. de los denominadores es la expresión común de menor grado que simplifica la sustracción.
- La utilización del m.c.m. facilita la posterior factorización y simplificación de la resta.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/uso-del-mcm-algebraico-en-sustraccion-de-fracciones-resumen.svg)


  QUÉ: Utilizar el m.c.m. algebraico como denominador común en la sustracción de fracciones.

  CÓMO: Factorizar denominadores, hallar el m.c.m. tomando factores comunes y no comunes al mayor exponente ($\prod [F_{\text{todos}}]^{\max(e_i)}$),
  amplificar numeradores mínimamente y restar protegiendo el sustraendo con paréntesis para reducir la expresión final.

  '
