semantic_id: MAT.ALG.FRACCIONES_RESTA.USO_MCM
resumen_inicial: El m.c.m. de los denominadores minimiza los factores de amplificación al restar fracciones algebraicas.
explicacion_simple: 'Al restar fracciones algebraicas compuestas, utilizar el m.c.m. de los denominadores es el camino más
  directo y riguroso.


  Al elegir el m.c.m. como denominador común, evitamos generar numeradores de grado excesivamente alto, lo que facilita la
  distribución de signos y la reducción de términos semejantes.


  Esto simplifica enormemente la detección de factores comunes para el paso final de cancelación.


  ![Uso del m.c.m. en sustracción de fracciones](/static/img/nodos/uso-del-mcm-algebraico-en-sustraccion-de-fracciones-intro.svg)

  '
explicacion_formal: '### Definición formal

  Para la resta $\frac{A(x)}{D_1(x)} - \frac{B(x)}{D_2(x)}$, el **m.c.m. óptimo** $M(x) = \operatorname{mcm}(D_1, D_2)$ reduce
  la operación a:


  $$\frac{A(x) \cdot \left(\frac{M(x)}{D_1(x)}\right) - \left(B(x) \cdot \left(\frac{M(x)}{D_2(x)}\right)\right)}{M(x)}$$


  ### Desglose de la fórmula

  - $M(x)$: Expresión m.c.m. de menor grado posible tomada entre los denominadores.

  - $\frac{M(x)}{D_2(x)}$: Factor de amplificación mínimo para el sustraendo que debe distribuirse respetando el signo menos.


  ### Síntesis didáctica

  Construir el m.c.m. de los denominadores minimiza la complejidad polinomial de los numeradores que se restan.

  '
definiciones_clave: '- **Mínimo común denominador en sustracción**: El m.c.m. de denominadores aplicado a la resta de fracciones.

  - **Factor de amplificación de resta**: Multiplicador mínimo de la fracción sustraendo.

  '
propiedades_relaciones: '- **Prevención de sobre-amplificación**: Evita trabajar con polinomios de grado elevado al restar
  expresiones que comparten factores.

  - **Facilidad de factorización posterior**: Facilita hallar factores comunes entre el numerador reducido y el m.c.m. del
  denominador.

  '
ejemplo_guiado:
  enunciado: Utiliza el m.c.m. de los denominadores para restar $\frac{3}{x^2 - 4} - \frac{1}{x^2 + 2x}$, reduce la fracción
    final y evalúa para $x = 3$.
  pasos:
  - 'Paso 1: Factorizar denominadores: $x^2 - 4 = (x - 2)(x + 2)$ y $x^2 + 2x = x(x + 2)$.'
  - 'Paso 2: Calcular m.c.m.: $M(x) = x(x - 2)(x + 2)$.'
  - 'Paso 3: Amplificar numeradores: primer numerador por $x$, segundo por $(x - 2)$.'
  - 'Paso 4: Escribir la resta de numeradores: $\frac{3(x) - 1(x - 2)}{x(x - 2)(x + 2)} = \frac{3x - x + 2}{x(x^2 - 4)} =
    \frac{2x + 2}{x(x^2 - 4)}$.'
  - 'Paso 5: Evaluar para $x = 3$: $\frac{2(3) + 2}{3(3^2 - 4)} = \frac{6 + 2}{3(9 - 4)} = \frac{8}{3(5)} = \frac{8}{15}$.'
  imagen: /static/img/nodos/uso-del-mcm-algebraico-en-sustraccion-de-fracciones-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
