procedimiento:
- 'Paso 1: Factoriza ambos denominadores para ver sus entrañas.'
- 'Paso 2: Arma el súper denominador MCM (todos los factores distintos, exponente
  mayor).'
- 'Paso 3: Amplifica los numeradores por los factores que les faltaban.'
- 'Paso 4: Pon un menos y un gran paréntesis para el segundo bloque amplificado, y
  resuelve.'
- Esto mantiene el MCM lo más 'pequeño' posible.
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en uso del m.c.m. algebraico en sustracción de fracciones.
ejemplos:
- titulo: Resta $\frac{3}{x(x-2)} - \frac{2}{x^2(x-2)}$
  enunciado: Resta $\frac{3}{x(x-2)} - \frac{2}{x^2(x-2)}$.
  solucion_pasos:
  - 'MCM: La x mayor es $x^2$. Incluimos $(x-2)$. MCM=$x^2(x-2)$.'
  - A la 1ra le falta una 'x'. Num = 3x.
  - A la 2da no le falta nada. Num = 2.
  - 'Resta: $\frac{3x - 2}{x^2(x-2)}$.'
- titulo: Halla el MCM de denominadores de $\frac{5}{m^3 n} - \frac{2}{m n^4}$.
  solucion_pasos:
  - 'Mayores exponentes: m al cubo y n a la cuarta.'
- titulo: 'Respecto de «Uso del m.c.m. algebraico en sustracción de fracciones»: ¿La
    siguiente formulac'
  enunciado: 'Respecto de «Uso del m.c.m. algebraico en sustracción de fracciones»:
    ¿La siguiente formulación es correcta? «El denominador común para la resta debe
    ser el MCM de los denominadores»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El denominador común para la
    resta debe ser el MCM de los denominadores.'
- titulo: 'Respecto de «Uso del m.c.m. algebraico en sustracción de fracciones»: ¿La
    siguiente conclusi'
  enunciado: 'Respecto de «Uso del m.c.m. algebraico en sustracción de fracciones»:
    ¿La siguiente conclusión es correcta? «Tomar un denominador común simplemente
    multiplicando todo (por ejemplo, $(x-1)(x+1)(x-1)$), lo que complica enormemente
    la expresión»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El denominador común para la
    resta debe ser el MCM de los denominadores.'
errores_frecuentes:
- Tomar un denominador común simplemente multiplicando todo (por ejemplo, $(x-1)(x+1)(x-1)$),
  lo que complica enormemente la expresión.
- Para «Al usar el MCM para restar fracciones, el objetivo de factorizar primero los
  denominadores es:», la respuesta correcta es Simplificarlos con los numeradores.
- Para «Al usar el MCM para restar fracciones, el objetivo de factorizar primero los
  denominadores es:», la respuesta correcta es Eliminar el signo negativo.
- Para «Al usar el MCM para restar fracciones, el objetivo de factorizar primero los
  denominadores es:», la respuesta correcta es Invertir las fracciones.
- 'Para «Aplica MCM para resolver: $\frac{5}{x^2} - \frac{2}{x^3}$.», la respuesta
  correcta es $\frac{3}{x^3}$.'
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando uso
