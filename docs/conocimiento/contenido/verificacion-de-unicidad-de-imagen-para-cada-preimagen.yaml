    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lista todos los pares ordenados o revisa el gráfico de la relación.'
- 'Paso 2: Agrupa los pares (o puntos) según su primera componente (valor de $x$).'
- 'Paso 3: Verifica si algún valor de $x$ aparece asociado a más de un valor distinto
  de $y$.'
- 'Paso 4: Si ocurre, la relación no cumple unicidad y no es función; si no ocurre,
  la unicidad se cumple.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar verificación de unicidad de imagen para cada preimagen.
ejemplos:
- titulo: Verificación en pares ordenados
  enunciado: Verifica la unicidad en $\{(1,3), (2,5), (2,7)\}$.
  solucion_pasos:
  - El valor $x=2$ aparece dos veces, asociado a $5$ y a $7$.
  - Se viola la unicidad de imagen.
- titulo: Verificación con criterio de la línea vertical
  enunciado: Un gráfico muestra una circunferencia completa. ¿Cumple el criterio de
    la línea vertical?
  solucion_pasos:
  - Una línea vertical que pase por el centro corta a la circunferencia en dos puntos.
  - No cumple el criterio; la circunferencia no representa una función.
- titulo: ¿Puede un mismo valor de $x$ tener dos imágenes distintas en una función?
  enunciado: ¿Puede un mismo valor de $x$ tener dos imágenes distintas en una función?
  respuesta: Falso
  solucion_pasos:
  - Eso violaría directamente la condición de unicidad exigida a toda función.
- titulo: ¿Dos valores distintos de $x$ pueden compartir la misma imagen $y$?
  enunciado: ¿Dos valores distintos de $x$ pueden compartir la misma imagen $y$?
  respuesta: Verdadero
  solucion_pasos:
  - La unicidad exige una sola imagen por cada $x$, pero no impide que distintos $x$
    compartan la misma imagen.
errores_frecuentes:
- 'Confundir la unicidad de imagen con la inyectividad (que exige lo contrario: que
  distintos $x$ no compartan imagen).'
- Aplicar el criterio de la línea vertical usando una línea horizontal por error.
- Concluir que una relación no es función solo porque dos pares distintos comparten
  la misma segunda componente.
- Olvidar revisar todos los valores repetidos de $x$ en una lista extensa de pares
  ordenados.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando verificación
  de unicidad de imagen para cada preimagen.
