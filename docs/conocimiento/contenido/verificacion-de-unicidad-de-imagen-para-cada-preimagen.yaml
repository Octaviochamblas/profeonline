semantic_id: MAT.ALG.FUNCION_CONCEPTOS.UNICIDAD_IMAGEN
resumen_inicial: La verificación de unicidad comprueba que a cada valor de entrada le corresponda como máximo una única imagen.
explicacion_simple: '![La verificación de unicidad comprueba que a cada valor de entrada le corresponda como máximo una única imagen](/static/img/nodos/verificacion-de-unicidad-de-imagen-para-cada-preimagen-intro.svg)



  Para saber si una relación o gráfica representa una función, aplicamos la **prueba de la recta vertical**:


  Si puedes trazar cualquier línea vertical en el gráfico y esta corta a la curva en **más de un punto**, la relación **NO es una función**.


  Esto se debe a que una misma entrada $x$ tendría dos o más salidas $y$ distintas, violando el principio de unicidad.'
explicacion_formal: 'Una relación $R \subseteq A \times B$ satisface la condición de **unicidad de imagen** si y solo si:

  $$\forall x \in A, \ \forall y_1, y_2 \in B, \ \big((x, y_1) \in R \ \land \ (x, y_2) \in R\big) \implies y_1 = y_2$$


  **Criterio geométrico (Prueba de la recta vertical):**

  Una curva en el plano cartesiano es la gráfica de una función $y = f(x)$ si y solo si ninguna recta vertical $x = c$ intersecta a la curva en más de un punto.'
definiciones_clave: '- **Unicidad de imagen**: Condición por la cual cada preimagen tiene asociada a lo más una imagen.

  - **Prueba de la recta vertical**: Método visual para descartar curvas que no representan funciones de $x$.'
propiedades_relaciones: '- **Circunferencias y elipses**: La ecuación $x^2 + y^2 = r^2$ no es una función de $x$ porque las rectas verticales cortan en 2 puntos.

  - **Parábolas horizontales**: $x = y^2$ no es función de $x$ por la misma razón.'
ejemplo_guiado:
  enunciado: '![Ejemplo La verificación de unicidad comprueba que a cada valor de entrada le corresponda como máximo una única imagen](/static/img/nodos/verificacion-de-unicidad-de-imagen-para-cada-preimagen-ejemplos.svg)



    Determina si la relación definida por la ecuación $x^2 + y^2 = 25$ representa a $y$ como función de $x$.'
  pasos:
  - 'Paso 1: Despejar la variable dependiente $y$: $y^2 = 25 - x^2$.'
  - 'Paso 2: Extraer raíz cuadrada: $y = \pm \sqrt{25 - x^2}$.'
  - 'Paso 3: Probar con un valor concreto del dominio, por ejemplo $x = 0$: $y = \pm \sqrt{25} = \pm 5$.'
  - 'Paso 4: Para $x = 0$ existen dos imágenes distintas ($5$ y $-5$).'
  - 'Paso 5: Concluir que la relación NO es una función de $x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la prueba de la recta vertical para una gráfica en el plano?
  choices:
  - text: Si una recta vertical corta a la gráfica en más de un punto, no es función.
    is_correct: true
  - text: Si una recta horizontal corta en más de un punto, no es función.
    is_correct: false
  - text: Toda recta debe cortar a la gráfica exactamente en el origen.
    is_correct: false
  - text: La gráfica debe ser una línea recta obligatoriamente.
    is_correct: false
  explanation: La alternativa correcta es 'Si una recta vertical corta a la gráfica en más de un punto, no es función.'. La recta vertical detecta si un mismo x tiene múltiples valores de y.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la relación de pares ordenados $R = \{(3, 1), (4, 2), (3, 5)\}$, ¿por qué falla la condición de función?
  choices:
  - text: Porque el valor x = 3 tiene dos imágenes distintas (1 y 5).
    is_correct: true
  - text: Porque tiene 3 pares ordenados.
    is_correct: false
  - text: Porque los valores de y son todos distintos.
    is_correct: false
  - text: Depende del codominio.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el valor x = 3 tiene dos imágenes distintas (1 y 5).'. Falla la unicidad.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si se da un conjunto de pares ordenados, revisar si alguna primera componente $x$ se repite con diferente $y$.'
- 'Paso 2: Si se da una gráfica cartesiana, trazar mentalmente rectas verticales a lo largo de todo el dominio.'
- 'Paso 3: Si se da una ecuación, despejar $y$ y verificar si aparecen signos dobles $\pm$.'
- 'Paso 4: Declarar si la relación cumple o no la unicidad funcional.'
errores_correccion: '- **Error común:** Confundir la prueba de la recta vertical (que verifica si es función) con la de la recta horizontal (que verifica si es inyectiva).

  - **Cómo corregirlo:** La recta **vertical** comprueba si cada $x$ tiene un solo $y$ (función). La recta **horizontal** comprueba si cada $y$ proviene de un solo $x$ (inyectividad).'
ejemplos:
- titulo: 'Ejemplo 1: Recta vertical en pares'
  enunciado: ¿Cuál de los siguientes conjuntos cumple la condición de unicidad?
  alternativas:
  - '{(1, 5), (2, 5), (3, 5)}'
  - '{(1, 2), (1, 3), (1, 4)}'
  - '{(0, 1), (0, -1), (2, 3)}'
  - '{(4, 2), (4, -2), (5, 1)}'
  respuesta: '{(1, 5), (2, 5), (3, 5)}'
  solucion_pasos:
  - 'Paso 1: En $\{(1, 5), (2, 5), (3, 5)\}$, todas las primeras componentes son distintas ($1, 2, 3$).'
  - 'Paso 2: Cumple la unicidad perfectamente.'
- titulo: 'Ejemplo 2: Despeje con doble signo'
  enunciado: Al despejar $y$ en $y^2 = x$, se obtiene $y = \pm \sqrt{x}$. ¿Representa $y$ como función de $x$?
  alternativas:
  - No, porque para cada x positivo hay dos valores de y
  - Sí, porque la raíz cuadrada siempre es positiva
  - Sí, para todo x real
  - Solo si x es negativo
  respuesta: No, porque para cada x positivo hay dos valores de y
  solucion_pasos:
  - 'Paso 1: Para $x = 4$, $y = 2$ e $y = -2$.'
  - 'Paso 2: Hay dos imágenes distintas, luego no es función.'
- titulo: 'Ejemplo 3: Gráfica de recta no vertical'
  enunciado: ¿Es cualquier recta no vertical $y = mx + n$ una función?
  alternativas:
  - Sí, porque toda recta vertical la corta en exactamente un punto
  - No, solo si pasa por el origen
  - No, solo si la pendiente es positiva
  - Solo si m = 0
  respuesta: Sí, porque toda recta vertical la corta en exactamente un punto
  solucion_pasos:
  - 'Paso 1: Al no ser vertical, para cada $x$ existe un único valor $y = mx + n$.'
- titulo: 'Ejemplo 4: Recta vertical x = k'
  enunciado: ¿Representa la ecuación $x = 3$ una función $y = f(x)$?
  alternativas:
  - No, porque para x = 3 existen infinitos valores de y
  - Sí, es una función constante
  - Sí, porque es una línea recta
  - Depende del dominio
  respuesta: No, porque para x = 3 existen infinitos valores de y
  solucion_pasos:
  - 'Paso 1: La recta vertical $x = 3$ contiene pares $(3, 1), (3, 2), (3, 3), \dots$'
  - 'Paso 2: La preimagen $3$ tiene infinitas imágenes; no es función.'
errores_frecuentes:
- Creer que una circunferencia es una función porque tiene una ecuación matemática clara.
- Confundir cortes de la recta horizontal con fallas en la definición de función.
- Asumir que las rectas verticales x = c son funciones de x.
afirmaciones_verdaderas:
- Una relación es función si y solo si a cada preimagen le corresponde a lo más una imagen.
- La prueba de la recta vertical descarta relaciones donde un valor x tiene múltiples imágenes y.
al_terminar_debes_poder: '**QUÉ:** Verificar y validar la condición de unicidad de imagen en relaciones algebraicas y gráficas.


  **CÓMO:** Aplicando el criterio de la recta vertical sobre curvas cartesianas y comprobando que no existan preimágenes repetidas con distintas imágenes en pares ordenados.


