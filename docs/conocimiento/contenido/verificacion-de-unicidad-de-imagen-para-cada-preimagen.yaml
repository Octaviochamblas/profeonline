semantic_id: MAT.ALG.FUNCION_CONCEPTOS.UNICIDAD_IMAGEN
resumen_inicial: La verificación de unicidad exige comprobar que ningún elemento del dominio posea más de un valor de imagen asignado.
explicacion_simple: |
  Para comprobar si una regla representa una función válida:

  - Tomamos cualquier valor del dominio $x$.
  - Si al aplicar la regla $x$ puede dar origen a dos respuestas distintas (por ejemplo $y = 2$ e $y = -2$), **falla la unicidad** y no es función.
  - Gráficamente, ninguna recta vertical debe tocar el gráfico en más de un punto.
explicacion_formal: |
  Una relación $f \subseteq A \times B$ cumple el **criterio de unicidad de imagen** si:

  $$\forall x \in A, \quad f(x) = y_1 \ \land \ f(x) = y_2 \implies y_1 = y_2$$

  **Desglose de la fórmula:**
  - Imposibilidad de ramificación: Un único punto de entrada $x$ genera a lo sumo un punto de salida $y$.
definiciones_clave: |
  - **Criterio de unicidad**: Principio matemático que excluye las asignaciones multívocas en la definición de función.
propiedades_relaciones: |
  - **Evaluación implícita vs explícita**: Ecuaciones como $y^2 = x \implies y = \pm \sqrt{x}$ muestran explícitamente la falla de unicidad al generar dos soluciones $y$ para cada $x > 0$.
ejemplo_guiado:
  enunciado: Comprueba si la relación $y^2 = x$ definida para $x \ge 0$ satisface el principio de unicidad de imagen.
  pasos:
    - 'Paso 1: Tomar un valor de entrada arbitrario, por ejemplo $x = 9$.'
    - 'Paso 2: Sustituir en la relación: $y^2 = 9$.'
    - 'Paso 3: Resolver para $y$: $y = \sqrt{9} = 3$ o $y = -\sqrt{9} = -3$.'
    - 'Paso 4: Observar que la preimagen $x = 9$ tiene dos imágenes distintas ($3$ y $-3$).'
    - 'Paso 5: Concluir que no cumple el principio de unicidad de imagen (no es función).'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Por qué la relación $y^2 = x$ no cumple la unicidad de imagen para $x = 9$?
    choices:
      - {text: Porque al valor $x = 9$ le corresponden dos imágenes distintas ($y = 3$ e $y = -3$)., is_correct: true}
      - {text: Porque 9 no es un número real., is_correct: false}
      - {text: Porque las raíces cuadradas son negativas., is_correct: false}
      - {text: Porque es una función inyectiva., is_correct: false}
    explanation: La alternativa correcta es 'Porque al valor $x = 9$ le corresponden dos imágenes distintas ($y = 3$ e $y = -3$).'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Qué ocurre geométricamente con la recta vertical $x = a$ cuando una gráfica no cumple unicidad de imagen?
    choices:
      - {text: Corta a la gráfica en dos o más puntos distintos., is_correct: true}
      - {text: Corta a la gráfica en un único punto., is_correct: false}
      - {text: Es paralela al eje $X$., is_correct: false}
      - {text: Coincide con la asíntota vertical., is_correct: false}
    explanation: La alternativa correcta es 'Corta a la gráfica en dos o más puntos distintos.'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Despejar la variable dependiente $y$ en la ecuación dada.'
  - 'Paso 2: Observar si el despeje produce un doble signo ($\pm$).'
  - 'Paso 3: Probar con un número concreto de entrada $x = a$.'
  - 'Paso 4: Si se obtienen dos o más valores $y$, declarar que se viola la unicidad.'
errores_correccion: |
  - **Error común:** Olvidar el doble signo ($\pm$) al despejar potencias pares como $y^2 = x$.
  - **Cómo corregirlo:** Al tomar raíz cuadrada a ambos lados de $y^2 = x$, resulta $y = \pm \sqrt{x}$, lo que genera dos salidas para un mismo $x$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una relación donde $x = 4$ tiene asociadas las imágenes $y = 2$ e $y = -2$ cumple con la propiedad de unicidad.'
  - 'La unicidad de imagen exige que dos preimágenes distintas no puedan compartir la misma imagen.'
  - 'La relación implícita $x^2 + y^2 = 9$ representa una función que satisface la unicidad de imagen para todo $x \in [-3, 3]$.'
  - 'Verificar la unicidad de imagen consiste en demostrar que el recorrido es igual al codominio.'
  - 'En un gráfico cartesiano, la unicidad de imagen se verifica trazando rectas horizontales paralelas al eje $X$.'
afirmaciones_verdaderas:
  - 'La unicidad de imagen establece que a cada elemento $x$ del dominio le corresponde una sola imagen $y$ en el codominio.'
  - 'La prueba de la recta vertical verifica gráficamente la unicidad de imagen: cada recta vertical corta la gráfica a lo sumo en un punto.'
al_terminar_debes_poder: |
  QUÉ: Verificar la condición de unicidad de imagen para determinar si una relación es función.
  CÓMO: Evaluar si a cada elemento del dominio le corresponde exactamente un único valor de salida mediante análisis algebraico, sagital o gráfico.
