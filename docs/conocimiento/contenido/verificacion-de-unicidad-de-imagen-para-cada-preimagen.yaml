semantic_id: MAT.ALG.FUNCION_CONCEPTOS.UNICIDAD_IMAGEN
resumen_inicial: La unicidad de imagen es la prueba lógica que confirma que ninguna
  preimagen tiene más de un valor asignado.
explicacion_simple: 'Para verificar la **unicidad de imagen**:

  Tomamos cada elemento $x$ del conjunto de partida y revisamos sus flechas o pares
  ordenados.

  - Si a algún elemento $x$ le salen $2$ o más flechas a valores de salida distintos,
  la relación **NO ES UNA FUNCIÓN**.

  - Si a cada elemento $x$ le sale exactamente $1$ flecha, la condición de unicidad
  se cumple.'
explicacion_formal: 'Dada una relación $R \subset A \times B$, la **unicidad de imagen**
  se formula formalmente como:


  $$(x, y_1) \in R \quad \land \quad (x, y_2) \in R \implies y_1 = y_2$$


  **Desglose de la fórmula:**

  - Si un mismo elemento $x$ estuviera relacionado con dos salidas $y_1$ e $y_2$,
  ambas salidas están obligadas a ser idénticas.'
definiciones_clave: '- **Unicidad de imagen**: Principio lógico por el cual un punto
  del dominio no puede estar asociado a dos valores de salida distintos.'
propiedades_relaciones: '- **Criterio de la línea vertical**: En una gráfica, la unicidad
  se cumple si cualquier línea vertical corta a la gráfica a lo sumo en un punto.'
ejemplo_guiado:
  enunciado: Verifica la unicidad de imagen en los conjuntos de pares ordenados $R_1
    = \{(1, 4), (2, 5), (3, 5)\}$ y $R_2 = \{(1, 4), (1, 6), (2, 5)\}$.
  pasos:
  - 'Paso 1: Analizar $R_1$: las entradas son $1, 2, 3$. Sus salidas son $4, 5, 5$.
    Cada entrada tiene exactamente 1 salida $\implies R_1$ cumple unicidad (ES FUNCIÓN).Paso
    2: Analizar $R_2$: la entrada $x = 1$ tiene dos salidas diferentes ($y = 4$ e
    $y = 6$) $\implies R_2$ viola la unicidad (NO ES FUNCIÓN).Paso 3: Concluir que
    $R_1$ es función y $R_2$ no es función.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la relación $R_2 = \{(1, 4), (1, 6), (2, 5)\}$ NO es una función?
  choices:
  - text: Porque a la preimagen $x = 1$ le corresponden dos imágenes distintas ($4$
      y $6$).
    is_correct: true
  - text: Porque contiene el número 5.
    is_correct: false
  - text: Porque el número 2 no tiene preimagen.
    is_correct: false
  - text: Porque tiene tres pares ordenados.
    is_correct: false
  explanation: La alternativa correcta es 'Porque a la preimagen $x = 1$ le corresponden
    dos imágenes distintas ($4$ y $6$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En $R_1 = \{(1, 4), (2, 5), (3, 5)\}$, ¿viola la condición de función
    el hecho de que $2$ y $3$ compartan la misma salida $5$?
  choices:
  - text: No, porque cada entrada sigue teniendo una sola salida única.
    is_correct: true
  - text: Sí, está prohibido repetir imágenes.
    is_correct: false
  - text: Sí, los pares ordenados deben ser disjuntos.
    is_correct: false
  - text: Depende de si $x$ es positivo.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque cada entrada sigue teniendo
    una sola salida única.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Listar todas las primeras componentes (preimágenes $x$) de los pares ordenados.'
- 'Paso 2: Verificar si alguna preimagen $x$ aparece repetida asociada a segundas
  componentes $y$ distintas.'
- 'Paso 3: Si no hay repeticiones con distintas salidas, declarar que la relación
  satisface unicidad.'
errores_correccion: '- **Error común:** Confundir la repetición de $x$ con la repetición
  de $y$.

  - **Cómo corregirlo:** Que se repita la $y$ SI se permite en una función. Lo que
  NO se permite es que se repita la $x$ con distintas $y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
estado: publicado
