semantic_id: MAT.ALG.FUNCION_CONCEPTOS.UNICIDAD_IMAGEN
resumen_inicial: 'Verificación de unicidad de imagen para cada preimagen: conceptos,
  representación y propiedades en Conceptos base de función.'
explicacion_simple: 'La prueba definitiva para saber si algo es una función se reduce
  a una sola pregunta por cada elemento del dominio: ¿tiene una sola salida, o más
  de una?'
explicacion_formal: '### Definición formal


  Una correspondencia $R \subseteq A \times B$ cumple la condición de unicidad si
  para todo $x \in A$ y para todo par $y_1, y_2 \in B$ tales que $(x,y_1) \in R$ y
  $(x,y_2) \in R$, se sigue que $y_1 = y_2$. Esta condición, junto con la de existencia,
  es una de las dos exigencias que definen a una función.


  ### Desarrollo didáctico


  Para verificar unicidad en una lista de pares ordenados, agrupa los pares por su
  primera componente y revisa si alguna primera componente se repite con una segunda
  componente distinta.


  En un gráfico, la unicidad se verifica con el **criterio de la línea vertical**:
  si alguna recta vertical corta la curva en más de un punto, esa curva viola la unicidad
  y no representa una función.'
definiciones_clave: '- **Verificación de unicidad de imagen para cada preimagen**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a verificación de unicidad de imagen para
  cada preimagen.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a verificación de
    unicidad de imagen para cada preimagen.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a verificación de unicidad de imagen
    para cada preimagen.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    verificación de unicidad de imagen para cada preimagen?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en verificación de unicidad de imagen para cada preimagen.'
  reinforcement_section: Explicación formal
