semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.AREAS_GEOMETRICAS
resumen_inicial: El modelamiento de áreas geométricas mediante funciones potencia cuadráticas $A(L) = k \cdot L^2$ establece que la superficie de cualquier figura bidimensional semejante escala proporcionalmente al cuadrado de su longitud lineal característica $L$, con factor de escala $c^2$.
explicacion_simple: "![El modelamiento de áreas geométricas mediante funciones potencia cuadráticas $A(L) = k \\cdot L^2$ establece que la superficie de cualquier figura bidimensional semejante escala proporcionalmente al cuadrado de su longitud lineal característica $L$, con factor de escala $c^2$](/static/img/nodos/modelamiento-de-areas-geometricas-mediante-funciones-potencia-cuadraticas-intro.svg)\n\n\nTodas las fórmulas de áreas de figuras geométricas del universo comparten la misma estructura: **son funciones potencia con exponente 2 ($n = 2$)**:\n\n- **Ejemplos en distintas figuras:**\n  - Cuadrado: $A(l) = \\mathbf{1} \\cdot l^2$\n  - Círculo: $A(r) = \\mathbf{\\pi} \\cdot r^2$\n  - Triángulo equilátero: $A(l) = \\mathbf{\\frac{\\sqrt{3}}{4}} \\cdot l^2$\n  - Superficie de una esfera: $A(r) = \\mathbf{4\\pi} \\cdot r^2$\n- **La regla de oro del pintor:** Si duplicas el ancho y largo de una pared ($c = 2$), la superficie **se multiplica por $2^2 = \\mathbf{4}$** (¡necesitarás 4 tarros\
  \ de pintura, no 2!)."
explicacion_formal: 'Por el teorema fundamental de la semejanza de figuras planas en el espacio euclidiano $\mathbb{R}^2$, dos figuras homólogas $\mathcal{F}_1$ y $\mathcal{F}_2$ con factor de escala lineal $c = L_2 / L_1$ satisfacen:

  $$\frac{\operatorname{Área}(\mathcal{F}_2)}{\operatorname{Área}(\mathcal{F}_1)} = c^2 = \left(\frac{L_2}{L_1}\right)^2$$

  Por lo tanto, el área como función de una dimensión lineal $L$ se modela axiomáticamente como:

  $$A(L) = k \cdot L^2$$

  donde el parámetro $k = A(1)$ es una constante adimensional o geométrica que depende estrictamente de la morfología de la figura.'
definiciones_clave: '- **Factor de escala superficial**: Razón $c^2$ por la cual aumenta el área al multiplicar las longitudes por $c$.

  - **Constante geométrica de forma $k$**: Coeficiente característico que define el área de la figura cuando $L = 1$.'
propiedades_relaciones: '- **Homogeneidad de grado 2**: $A(c \cdot L) = c^2 \cdot A(L)$.

  - **Invarianza de proporciones**: La relación de áreas entre dos figuras semejantes no depende de las unidades de medida.'
ejemplo_guiado:
  enunciado: '![Ejemplo El modelamiento de áreas geométricas mediante funciones potencia cuadráticas $A(L) = k \cdot L^2$ establece que la superficie de cualquier figura bidimensional semejante escala proporcionalmente al cuadrado de su longitud lineal característica $L$, con factor de escala $c^2$](/static/img/nodos/modelamiento-de-areas-geometricas-mediante-funciones-potencia-cuadraticas-ejemplos.svg)



    Aplica el modelo de área cuadrática para resolver:

    1) Una baldosa cuadrada de lado $L = 20\text{ cm}$ tiene un área de $400\text{ cm}^2$. Si se fabrican baldosas con el triple de lado ($L = 60\text{ cm}$), ¿cuál es su área?

    2) Un círculo tiene radio $r = 4\text{ cm}$. Si su radio se amplía a $r = 8\text{ cm}$ ($c = 2$), ¿cuántas veces aumenta su área?'
  pasos:
  - 'Paso 1: Para la baldosa: El lado se multiplica por $c = 60/20 = 3$. Factor de área: $c^2 = 3^2 = \mathbf{9}$. Nueva área: $400 \times 9 = \mathbf{3.600\text{ cm}^2}$.'
  - 'Paso 2: Para el círculo: Al duplicar el radio ($c = 2$), el área aumenta en $c^2 = 2^2 = \mathbf{4\text{ veces}}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el radio de una pizza se duplica, ¿cuánta más pizza (superficie) se obtiene?
  choices:
  - text: 4 veces más superficie (2² = 4)
    is_correct: true
  - text: 2 veces más superficie
    is_correct: false
  - text: 8 veces más superficie
    is_correct: false
  - text: 3,14 veces más superficie
    is_correct: false
  explanation: La alternativa correcta es '4 veces más superficie (2² = 4)'. Como el área del círculo es $A = \pi r^2$, al duplicar el radio el área se cuadruplica.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el modelo de superficie de un triángulo equilátero $A(l) = \frac{\sqrt{3}}{4}l^2$, ¿cuál es la constante geométrica de forma k?
  choices:
  - text: k = √3 / 4
    is_correct: true
  - text: k = 2
    is_correct: false
  - text: k = 4 / √3
    is_correct: false
  - text: k = 1/2
    is_correct: false
  explanation: La alternativa correcta es 'k = √3 / 4'. Es el coeficiente constante que multiplica a la variable lineal al cuadrado $l^2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la dimensión lineal $L$ y la forma de la figura.'
- 'Paso 2: Plantear el modelo de área cuadrática $A(L) = k \cdot L^2$.'
- 'Paso 3: Si se modifica la escala por un factor $c$, calcular el factor multiplicativo $c^2$.'
- 'Paso 4: Multiplicar el área base por $c^2$ para obtener la nueva superficie.'
errores_correccion: '- **Error común:** Pensar que duplicar las medidas de un terreno duplica su superficie.

  - **Cómo corregirlo:** La superficie depende del **CUADRADO ($c^2$)**: al duplicar el frente y el fondo ($c = 2$), la superficie **se cuadruplica ($2^2 = 4$)**.'
ejemplos:
- titulo: 'Ejemplo 1: Escala de pantalla'
  enunciado: 'Si una pantalla tiene el doble de diagonal que otra semejante, su superficie es:'
  alternativas:
  - 4 veces mayor
  - 2 veces mayor
  - 8 veces mayor
  - 1,41 veces mayor
  respuesta: 4 veces mayor
  solucion_pasos:
  - 'Paso 1: $c^2 = 2^2 = 4$.'
- titulo: 'Ejemplo 2: Área de octágono regular'
  enunciado: 'El área de un octágono de lado $l$ es $A = 2(1 + \sqrt{2})l^2$. Como función potencia tiene:'
  alternativas:
  - k = 2(1 + √2), n = 2
  - k = 2, n = 2
  - k = 8, n = 2
  - n = 8
  respuesta: k = 2(1 + √2), n = 2
  solucion_pasos:
  - 'Paso 1: $k = 2(1 + \sqrt{2})$ y $n = 2$.'
- titulo: 'Ejemplo 3: Triplicar el radio esférico'
  enunciado: 'Si el radio de una esfera se triplica, su área superficial ($A = 4\pi r^2$) se multiplica por:'
  alternativas:
  - '9'
  - '3'
  - '27'
  - '6'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: $3^2 = 9$.'
- titulo: 'Ejemplo 4: Reducción de superficie'
  enunciado: 'Si una fotografía se reduce al 50% de su tamaño ($c = 0{,}5$), su área pasa a ser el:'
  alternativas:
  - 25% de la original
  - 50% de la original
  - 12,5% de la original
  - 75% de la original
  respuesta: 25% de la original
  solucion_pasos:
  - 'Paso 1: $(0{,}5)^2 = 0{,}25 = 25\%$.'
errores_frecuentes:
- Confundir la escala lineal del perímetro con la escala cuadrática del área.
- Olvidar que todas las figuras geométricas semejantes escalan con factor c².
- Asumir que k depende de la escala (k es una constante fija de forma).
afirmaciones_verdaderas:
- El área de cualquier figura geométrica semejante sigue un modelo de función potencia cuadrática A = k · L².
- Al multiplicar las dimensiones lineales por un factor c, el área resultante se multiplica por c².
al_terminar_debes_poder: '**QUÉ:** Modelar y resolver problemas de áreas geométricas mediante funciones potencia cuadráticas.


  **CÓMO:** Aplicando la ley de escala bidimensional A(L) = k · L² y calculando la variación cuadrática c².


