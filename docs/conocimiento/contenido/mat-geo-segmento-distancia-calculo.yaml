resumen_inicial: 'Cálculo de la distancia entre dos puntos en el plano cartesiano:
  conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Con la fórmula de distancia ya conocida, el siguiente paso es
  aplicarla con números concretos para obtener resultados numéricos precisos.
explicacion_formal: '![Cálculo de la distancia entre dos puntos](/static/img/geometria/cartesiano-vectores/segmento-distancia-calculo.svg)


  ### Definición formal


  Dados $A(-3,-2)$ y $B(4,3)$: $\Delta x=4-(-3)=7$, $\Delta y=3-(-2)=5$, por lo que
  $d(A,B)=\sqrt{7^2+5^2}=\sqrt{49+25}=\sqrt{74}\approx8,6$.


  ### Desarrollo didáctico


  Este procedimiento se repite siempre igual: calcular las diferencias, elevarlas
  al cuadrado, sumarlas y sacar la raíz cuadrada del resultado, sin importar los valores
  específicos de los puntos.'
