semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.CONSECUTIVOS
resumen_inicial: Dos ángulos son consecutivos si comparten el mismo vértice y exactamente
  un lado común, situándose a lados opuestos de dicho lado común.
explicacion_simple: '![Ángulos Consecutivos](/static/img/nodos/angulos-consecutivos-con-vertice-y-lado-comun-intro.svg)


  Imagina dos habitaciones que comparten exactamente una misma pared en el medio.
  Los ángulos consecutivos son como esas habitaciones: nacen en la misma esquina (vértice)
  y están pegados compartiendo una misma línea (lado común), sin meterse uno dentro
  del otro.'
explicacion_formal: '### Definición formal

  Dos ángulos $\angle AOB$ y $\angle BOC$ son **consecutivos** si y solo si comparten
  el mismo vértice $O$, tienen un lado común $\vec{OB}$ y sus regiones interiores
  son disjuntas:


  $$\operatorname{Vértice}(\angle AOB) = \operatorname{Vértice}(\angle BOC) = O \quad
  \land \quad \vec{OA} \cap \vec{OC} = \{O\} \quad \land \quad \operatorname{Int}(\angle
  AOB) \cap \operatorname{Int}(\angle BOC) = \emptyset$$


  ### Desglose simbólico y geométrico

  - $O$: Vértice común.

  - $\vec{OB}$: Rayo o lado intermedio común.

  - Interiores disjuntos: Los ángulos no se solapan ni se contienen mutuamente.

  - Aditividad angular: $\mu(\angle AOC) = \mu(\angle AOB) + \mu(\angle BOC)$.


  ### Síntesis didáctica

  Los ángulos consecutivos forman cadenas ordenadas de aberturas contiguas que pueden
  sumarse directamente para obtener el ángulo total envolvente.'
definiciones_clave: '- **Ángulos consecutivos**: Ángulos contiguos con vértice y lado
  común e interiores disjuntos.

  - **Lado común**: Rayo intermedio $\vec{OB}$ compartido por ambos ángulos. '
propiedades_relaciones: '- **Aditividad angular**: La medida del ángulo total formado
  por los lados exteriores es la suma de ambos: $\angle AOC = \angle AOB + \angle
  BOC$.

  - **Cadena consecutiva**: Tres o más ángulos pueden ser consecutivos secuencialmente
  compartiendo lados intermedios. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Consecutivos](/static/img/nodos/angulos-consecutivos-con-vertice-y-lado-comun-ejemplos.svg)


    Dos ángulos consecutivos $\angle AOB$ y $\angle BOC$ tienen medidas de $35^\circ$
    y $48^\circ$ respectivamente. Calcula la medida del ángulo total $\angle AOC$
    formado por sus lados exteriores.'
  pasos:
  - 'Paso 1: Identificar que $\angle AOB$ y $\angle BOC$ son consecutivos con lado
    común $\vec{OB}$.'
  - 'Paso 2: Aplicar el postulado de la adición de ángulos: $\angle AOC = \angle AOB
    + \angle BOC$.'
  - 'Paso 3: Sustituir los valores conocidos: $\angle AOC = 35^\circ + 48^\circ$.'
  - 'Paso 4: Realizar la suma: $\angle AOC = 83^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condiciones geométricas definen a dos ángulos consecutivos?
  choices:
  - text: Mismo vértice, un lado común e interiores disjuntos
    is_correct: true
  - text: Mismo vértice y que sumen 180° obligatoriamente
    is_correct: false
  - text: Dos lados paralelos sin vértice común
    is_correct: false
  - text: Lados opuestos colineales
    is_correct: false
  explanation: Dos ángulos son consecutivos si tienen el mismo vértice, un lado común
    e interiores disjuntos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos ángulos consecutivos miden 25° y 40°, ¿cuánto mide el ángulo total
    que forman?
  choices:
  - text: 65° (porque 25° + 40° = 65°)
    is_correct: true
  - text: 15°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 180°
    is_correct: false
  explanation: Por aditividad de ángulos consecutivos, 25° + 40° = 65°, por lo que
    el total es 65° (porque 25° + 40° = 65°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambos ángulos nacen del mismo vértice.'
- 'Paso 2: Comprobar que comparten exactamente un rayo o lado.'
- 'Paso 3: Asegurar que uno no está contenido dentro del otro.'
- 'Paso 4: Aplicar la suma de medidas para encontrar el ángulo total.'
errores_correccion: No confundas ángulos consecutivos con ángulos que se solapan uno
  dentro del otro.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\angle AOB = 30^\circ$ y $\angle BOC = 50^\circ$ son consecutivos,
    ¿cuánto mide $\angle AOC$?
  alternativas:
  - $80^\circ$
  - $20^\circ$
  - $90^\circ$
  respuesta: $80^\circ$
  solucion_pasos:
  - $\angle AOC = 30^\circ + 50^\circ = 80^\circ$.
- titulo: Ejemplo 2
  enunciado: Si $\angle AOC = 100^\circ$ y el rayo $\vec{OB}$ interior divide el ángulo
    en dos partes consecutivas donde $\angle AOB = 40^\circ$, ¿cuánto mide $\angle
    BOC$?
  alternativas:
  - $60^\circ$
  - $40^\circ$
  - $140^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $\angle BOC = 100^\circ - 40^\circ = 60^\circ$.
- titulo: ¿Dos ángulos consecutivos pueden sumar 90°?
  respuesta: Sí
  solucion_pasos:
  - Sí, en ese caso son ángulos consecutivos y complementarios.
- titulo: ¿Dos ángulos separados pueden ser consecutivos?
  respuesta: 'No'
  solucion_pasos:
  - No, deben compartir obligatoriamente el vértice y un lado.
errores_frecuentes:
- Confundir ángulos consecutivos con ángulos adyacentes (par lineal).
- Sumar ángulos que se solapan interiormente como si fueran consecutivos.
- Considerar consecutivos a ángulos que comparten lado pero tienen vértices distintos.
- Olvidar que el orden de los rayos determina la aditividad de las medidas.
- Restar en lugar de sumar para hallar el ángulo exterior total.
afirmaciones_verdaderas:
- Dos ángulos consecutivos comparten el vértice y un lado.
- La medida del ángulo exterior total es la suma de los ángulos consecutivos.
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y calcular medidas de ángulos
  consecutivos en figuras geométricas.


  **CÓMO:** Verificando la presencia de un lado común $\vec{OB}$ y aplicando la relación
  aditiva $\angle AOC = \angle AOB + \angle BOC$.


  ![Resumen de Ángulos Consecutivos](/static/img/nodos/angulos-consecutivos-con-vertice-y-lado-comun-resumen.svg)'
