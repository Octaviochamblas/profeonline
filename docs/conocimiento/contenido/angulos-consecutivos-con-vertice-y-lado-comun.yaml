semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.CONSECUTIVOS
resumen_inicial: Los ángulos adyacentes comparten el vértice y un lado común sin solaparse,
  permitiendo sumar aberturas contiguas directamente en el plano.
explicacion_simple: Imagina dos piezas de pizza pegadas una al lado de la otra. Comparten
  el borde del centro y el mismo vértice, pero no se enciman. Esos son ángulos adyacentes.
explicacion_formal: Dos ángulos son **adyacentes** si comparten el mismo vértice y
  un lado común, mientras que sus regiones interiores no se solapan. Si además sus
  lados no comunes forman una recta, son suplementarios.
definiciones_clave: '- **Ángulos consecutivos con vértice y lado común**: Elemento
  o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en ángulos consecutivos con vértice y lado común se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: En un abanico plegable, tres varillas contiguas forman dos ángulos consecutivos
    de $25^\circ$ y $35^\circ$. Calcula el ángulo total abarcado entre la primera
    y la tercera varilla.
  pasos:
  - 'Paso 1: Sumar las aberturas consecutivas sin superposición: $25^\circ + 35^\circ$.'
  - 'Paso 2: Obtener la abertura total: $60^\circ$.'
  - 'Paso 3: Verificar que el ángulo formado de $60^\circ$ es un ángulo agudo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de ángulos consecutivos con vértice
    y lado común?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el abanico, si los dos ángulos consecutivos valen 25° y 35°, ¿cuál
    es la abertura entre los extremos?
  choices:
  - text: 60°
    is_correct: true
  - text: 10°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 120°
    is_correct: false
  explanation: La alternativa correcta es '60°', pues $25^\circ + 35^\circ = 60^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en ángulos consecutivos con vértice y lado
  común.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en ángulos consecutivos
  con vértice y lado común sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 37^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 143°
  - 37°
  - 90°
  respuesta: 143°
  solucion_pasos:
  - Despejando $x = 180 - 37 = 143^\circ$.
- titulo: Ejemplo 2
  enunciado: En ángulos consecutivos con vértice y lado común, si dos ángulos son
    suplementarios y uno mide 37°, ¿cuánto mide el otro?
  alternativas:
  - 143°
  - 53°
  - 360°
  respuesta: 143°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 37 = 143^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en ángulos consecutivos
    con vértice y lado común?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en ángulos consecutivos con vértice
    y lado común es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de ángulos consecutivos con vértice y lado común.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
