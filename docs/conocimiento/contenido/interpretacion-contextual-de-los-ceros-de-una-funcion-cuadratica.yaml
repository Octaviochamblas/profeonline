procedimiento:
- 'Paso 1: Calcula los ceros de la función que modela el problema.'
- 'Paso 2: Verifica cuáles ceros cumplen las restricciones del contexto (por ejemplo,
  valores no negativos).'
- 'Paso 3: Interpreta cada cero válido según lo que representa en la situación descrita.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en interpretación contextual de los ceros de una
  función cuadrática.
ejemplos:
- titulo: Interpretación de ceros en un problema de lanzamiento
  enunciado: La función $h(t)=-5t^2+15t$ tiene ceros en $t=0$ y $t=3$. Interpreta
    ambos valores.
  solucion_pasos:
  - $t=0$ representa el instante del lanzamiento (el objeto parte desde el suelo).
  - $t=3$ representa el instante en que el objeto vuelve a tocar el suelo, a los $3$
    segundos.
- titulo: Interpretación de un cero descartado por el contexto
  enunciado: La función $B(x)=x^2-4x-5$ modela un beneficio, con ceros en $x=5$ y
    $x=-1$, donde $x$ representa unidades vendidas. Interpreta ambos valores.
  solucion_pasos:
  - $x=5$ representa un número de unidades vendidas válido, en que el beneficio se
    anula.
  - $x=-1$ no tiene sentido en el contexto, pues no se pueden vender cantidades negativas
    de unidades.
- titulo: ¿Todos los ceros matemáticos de una función aplicada tienen siempre sentido
    en el contexto del problema?
  enunciado: ¿Todos los ceros matemáticos de una función aplicada tienen siempre sentido
    en el contexto del problema?
  respuesta: 'No'
  solucion_pasos:
  - Algunos ceros pueden violar restricciones del contexto (como valores negativos
    de tiempo o cantidad), y deben descartarse.
- titulo: ¿Un cero de la función $f(x)=0$ siempre significa lo mismo en cualquier
    contexto?
  enunciado: ¿Un cero de la función $f(x)=0$ siempre significa lo mismo en cualquier
    contexto?
  respuesta: 'No'
  solucion_pasos:
  - 'Su significado depende de qué representa la función: puede ser "altura cero",
    "beneficio nulo", u otro evento específico según el problema.'
errores_frecuentes:
- Aceptar como válido un cero que viola las restricciones del contexto del problema.
- No relacionar el significado del cero con el evento específico que representa en
  la situación.
- Confundir el cero de la función con el vértice al interpretar el resultado.
- Reportar el valor numérico del cero sin explicar qué representa en el contexto del
  problema.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  interpretación contextual de los ceros de una función cuadrática.
