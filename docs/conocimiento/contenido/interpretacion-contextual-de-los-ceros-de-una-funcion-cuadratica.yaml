semantic_id: MAT.ALG.FUNC_CUADR_MODELO.INTERPRETACION_CEROS_CONTEXTO
resumen_inicial: 'Los ceros contextuales representan los estados o instantes en los que la variable dependiente se anula, indicando momentos de impacto, corte o equilibrio sin ganancia ni pérdida.'
explicacion_simple: |
  Los ceros de una función en un problema real son los puntos donde las cosas valen cero. En un lanzamiento de pelota, los ceros muestran los segundos en los que la pelota está tocando el suelo. En un negocio, los ceros representan los niveles de venta donde la empresa no gana ni pierde dinero (punto de equilibrio) o los precios tan altos que nadie compra nada.
explicacion_formal: |
  ### Definición formal
  En un modelo cuadrático $y = f(x) = ax^2 + bx + c$ definido sobre un dominio contextual $D_{\text{contexto}}$, los **ceros con significado práctico** son las preimágenes reales $x_k \in D_{\text{contexto}}$ tales que:
  $$f(x_k) = 0 \iff P_k(x_k, 0) \in \text{Graf}(f)$$

  ### Desglose simbólico
  - Contexto Físico (Movimiento): $h(t) = 0 \implies t_{\text{despegue}}$ (si $h_0 = 0$) y $t_{\text{impacto}}$ (segundo de llegada a tierra).
  - Contexto Económico (Beneficio): $G(x) = 0 \implies x_1, x_2$ son los **puntos de umbral de producción** (volúmenes de venta donde no hay ganancia ni pérdida).
  - Contexto Geométrico (Límites): $A(x) = 0 \implies$ Dimensiones extremas donde el rectángulo se deforma a una línea de área nula.

  ### Síntesis didáctica
  Diferenciar raíces matemáticas de soluciones contextuales: La resolución de $ax^2 + bx + c = 0$ puede arrojar dos soluciones algebraicas, pero aquellas que sean negativas ($x < 0$) o estén fuera del rango de factibilidad física deben ser descartadas al responder el problema real.
definiciones_clave: |
  - **Cero contextual**: Valor numérico de entrada que anula el indicador modelado ($f(x) = 0$).
  - **Punto de equilibrio económico**: Nivel de actividad $x_k$ donde los ingresos igualan exactamente a los costos ($G(x_k) = 0$).
  - **Validez de raíces**: Selección exclusiva de ceros pertenecientes al dominio físicamente factible.
propiedades_relaciones: |
  - **Intervalo de positividad real**: El conjunto de valores entre los ceros $]x_1, x_2[$ delimita la zona donde la función es positiva ($f(x) > 0$), indicando rentabilidad económica o vuelo en el aire.
  - **Simetría del óptimo respecto a los ceros**: Si la función posee dos ceros $x_1$ y $x_2$, el óptimo contextual ocurre en el punto medio exacto $x^* = \frac{x_1 + x_2}{2}$.
ejemplo_guiado:
  enunciado: 'La función de ganancia diaria de una fábrica de muebles es $G(x) = -(x - 10)(x - 50)$ en miles de pesos, donde $x$ es el número de sillas fabricadas. Determina e interpreta los ceros de la función y explica qué ocurre si se fabrican 30 sillas.'
  pasos:
    - 'Paso 1: Para hallar los ceros, igualamos $G(x) = 0 \implies -(x - 10)(x - 50) = 0$.'
    - 'Paso 2: Obtenemos los ceros por producto nulo: $x_1 = 10$ y $x_2 = 50$ sillas.'
    - 'Paso 3: Interpretación: Fabricar exactamente 10 sillas o 50 sillas genera una ganancia de cero pesos (puntos de equilibrio).'
    - 'Paso 4: Si se fabrican 30 sillas (punto medio $\frac{10+50}{2} = 30$), se alcanza la ganancia máxima diaria de $G(30) = -(30 - 10)(30 - 50) = -(20)(-20) = 400$ miles de pesos.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un lanzamiento de un proyectil cuya altura viene dada por $h(t) = -5t^2 + 40t$, los ceros de la función son $t_1 = 0$ y $t_2 = 8$. ¿Qué representan estos valores?'
    choices:
      - {text: '$t_1 = 0$ es el momento del despegue y $t_2 = 8$ es el momento del impacto contra el suelo', is_correct: true}
      - {text: '$t_1 = 0$ es la altura inicial y $t_2 = 8$ es la altura máxima', is_correct: false}
      - {text: '$t_1 = 0$ y $t_2 = 8$ son las velocidades inicial y final del proyectil', is_correct: false}
      - {text: '$t_2 = 8$ es la distancia horizontal recorrida en metros', is_correct: false}
    explanation: 'La alternativa correcta es ''$t_1 = 0$ es el momento del despegue y $t_2 = 8$ es el momento del impacto contra el suelo''. Los ceros indican los instantes donde la altura sobre el suelo es cero.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una empresa modela sus beneficios mediante $B(x) = -2(x - 4)(x - 12)$. ¿Para qué cantidad de ventas la empresa obtiene beneficios positivos ($B(x) > 0$)?'
    choices:
      - {text: 'Para ventas estrictamente entre 4 y 12 unidades', is_correct: true}
      - {text: 'Para ventas menores a 4 unidades únicamente', is_correct: false}
      - {text: 'Para ventas mayores a 12 unidades únicamente', is_correct: false}
      - {text: 'Para cualquier cantidad de ventas sin restricción', is_correct: false}
    explanation: 'La alternativa correcta es ''Para ventas estrictamente entre 4 y 12 unidades''. Al abrir hacia abajo ($a = -2$), la función es positiva en el intervalo interno $]4, 12[$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Igualar la función cuadrática a cero $f(x) = 0$ y resolver mediante factorización o la fórmula general.'
  - 'Paso 2: Filtrar las soluciones reales reteniendo aquellas que pertenezcan al dominio físico o económico del contexto ($x \ge 0$).'
  - 'Paso 3: Redactar la interpretación contextual identificando si los ceros corresponden a tiempos de despegue/caída, precios de equilibrio o dimensiones límites.'
errores_correccion: |
  - **Error 1:** Afirmar que un cero negativo indica que el tiempo transcurre hacia atrás en un problema de física. **Cómo corregirlo:** Las raíces negativas son artefactos matemáticos de la parábola prolongada y deben desecharse por no tener validez en el tiempo físico ($t \ge 0$).
  - **Error 2:** Confundir los ceros de la función con las coordenadas del vértice. **Cómo corregirlo:** Los ceros representan las entradas $x$ donde la altura o ganancia es **cero**, mientras que el vértice representa la entrada donde la altura o ganancia es **máxima**.
ejemplos:
  - titulo: 'Ceros en lanzamiento desde el suelo'
    enunciado: 'Un balón pateado desde el suelo vuelve a tocar la hierba en $h(t) = -5t^2 + 25t = 0$. ¿Cuánto duró el vuelo?'
    alternativas:
      - '5 segundos'
      - '2.5 segundos'
      - '25 segundos'
    respuesta: '5 segundos'
    solucion_pasos:
      - '1. Factorizamos $-5t(t - 5) = 0$.'
      - '2. Las raíces son $t_1 = 0$ (inicio) y $t_2 = 5$ (llegada al suelo).'
      - '3. El tiempo de vuelo fue de 5 segundos.'
  - titulo: 'Puntos de beneficio nulo'
    enunciado: 'Si los ceros de una ganancia son $x_1 = 20$ y $x_2 = 100$ artículos, ¿fabricar 20 artículos genera pérdida?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Fabricar 20 artículos es un punto de equilibrio donde la ganancia es exactamente igual a cero pesos.'
  - titulo: 'Relación entre ceros y óptimo'
    enunciado: '¿El promedio de dos ceros reales de ganancia $x_1 = 10$ y $x_2 = 30$ señala la cantidad $x = 20$ que maximiza el beneficio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por simetría parabólica, la abscisa del vértice es la media aritmética $\frac{10 + 30}{2} = 20$.'
  - titulo: 'Inexistencia de ceros en el contexto'
    enunciado: 'Si una función de altura $h(t) = -5t^2 + 10t + 50$ se evalúa hasta tocar el suelo, ¿posee un único cero positivo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al tener una cota inicial positiva $h_0 = 50$, la parábola corta al eje $t$ en una raíz negativa (descartada) y en una sola raíz positiva válida.'
errores_frecuentes:
  - 'Los ceros de una función de ganancia representan el punto donde la empresa logra su máxima ganancia.'
  - 'En un problema de proyectiles, la raíz negativa $t = -3$ indica que el proyectil despegó 3 segundos en el futuro.'
  - 'Los ceros de una función cuadrática se calculan evaluando $f(0)$.'
  - 'Una función de área $A(x) = x(40 - x)$ alcanza su superficie máxima cuando $x = 40$.'
  - 'Si los ceros de una parábola son $x_1 = 2$ y $x_2 = 8$, la función es negativa en todo el intervalo entre 2 y 8.'
afirmaciones_verdaderas:
  - 'Los ceros de una función cuadrática contextualizada indican las condiciones de entrada donde la variable dependiente se anula (altura cero, ganancia cero o superficie cero).'
  - 'En problemas físicos y económicos, únicamente las raíces no negativas pertenecientes al dominio factible poseen interpretación contextual válida.'
al_terminar_debes_poder: 'Calcular e interpretar el significado de los ceros de una función cuadrática en problemas contextualizados reales.'
