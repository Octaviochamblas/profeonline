semantic_id: MAT.ALG.ECUACION_BASE.DEFINICION_ECUACION
resumen_inicial: 'Definición de ecuación como igualdad con incógnitas: propiedades,
  resolución y modelamiento en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: 'No todas las igualdades son ecuaciones. Una ecuación es como
  un candado con clave: es una igualdad que solo ''se abre'' o es cierta si usas el
  número secreto correcto.'
explicacion_formal: '### Definición formal


  Esa es la diferencia clave: depende del valor de la incógnita para ser verdad.


  ### Desarrollo didáctico


  Vamos a diseccionar esto:

  - Si escribo $2 + 2 = 4$, es una **igualdad numérica**. Siempre es verdad, no hay
  misterio.

  - Si escribo $x + 2 = 5$, ahí hay un misterio. La letra $x$ es una incógnita. Esta
  expresión se llama **ecuación**.


  ¿Por qué es especial?

  Porque su equilibrio es ''condicional''. Imagina que la balanza está tapada. ¿Es
  cierto que el lado izquierdo pesa igual que el derecho?

  - Si adivinas que $x = 1$, tendrías $1 + 2 = 5$. Esto es falso. La balanza se inclina.

  - Si adivinas que $x = 3$, tendrías $3 + 2 = 5$. Esto es cierto. Equilibrio perfecto.


  Entonces, una ecuación es una pregunta matemática disfrazada de afirmación: ''¿Qué
  valor debe tener la $x$ para que este lado sea idéntico al otro?'''
definiciones_clave: '- **Definición de ecuación como igualdad con incógnitas**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
