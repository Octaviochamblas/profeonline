procedimiento:
- 'Paso 1: Busca el signo $=$ para confirmar que es una igualdad.'
- 'Paso 2: Busca letras (variables o incógnitas).'
- 'Paso 3: Pregúntate: ''¿Esta igualdad depende de la letra para ser cierta?''. Si
  la respuesta es sí, es una ecuación.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en definición de ecuación como igualdad con incógnitas.
ejemplos:
- titulo: 'Clasifica: $3x - 1 = 8$'
  enunciado: 'Clasifica: $3x - 1 = 8$'
  solucion_pasos:
  - 'Tiene signo ''='': Es igualdad.'
  - 'Tiene incógnita ''x'': Es algebraica.'
  - Solo es cierta si $x=3$ (pues $3(3)-1=8$).
  - 'Conclusión: Es una ecuación.'
- titulo: ¿La expresión $x + x = 2x$ es una ecuación?
  solucion_pasos:
  - Aunque tiene letras, es cierta para CUALQUIER valor de x (si x=1, 2=2; si x=5,
    10=10). Las ecuaciones suelen ser ciertas solo para valores específicos.
- titulo: 'Respecto de «Definición de ecuación como igualdad con incógnitas»: ¿Se
    ajusta a la definició'
  enunciado: 'Respecto de «Definición de ecuación como igualdad con incógnitas»: ¿Se
    ajusta a la definición esta afirmación? «Una ecuación es una igualdad algebraica
    que contiene letras (incógnitas) y que solo es verdadera para valores muy específicos
    de dichas letras»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una ecuación es una igualdad
    algebraica que contiene letras (incógnitas) y que solo es verdadera para valores
    muy específicos de dichas letras.'
- titulo: 'Respecto de «Definición de ecuación como igualdad con incógnitas»: ¿Es
    compatible con el pro'
  enunciado: 'Respecto de «Definición de ecuación como igualdad con incógnitas»: ¿Es
    compatible con el procedimiento esta afirmación? «Llamar ''ecuación'' a cualquier
    cosa que tenga una ''x'', incluso si no tiene signo igual»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una ecuación es una igualdad
    algebraica que contiene letras (incógnitas) y que solo es verdadera para valores
    muy específicos de dichas letras.'
errores_frecuentes:
- Llamar 'ecuación' a cualquier cosa que tenga una 'x', incluso si no tiene signo
  igual.
- Una expresión algebraica sin signo igual.
- Una igualdad numérica siempre verdadera.
- Una multiplicación de polinomios.
- $2x + 5$.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando definición
