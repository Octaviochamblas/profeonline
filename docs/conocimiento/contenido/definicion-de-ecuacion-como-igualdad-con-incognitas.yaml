semantic_id: MAT.ALG.ECUACION_BASE.DEFINICION_ECUACION
resumen_inicial: Una ecuación es una igualdad condicionada que contiene una o más variables desconocidas llamadas incógnitas.
explicacion_simple: |
  Una ecuación es una igualdad algebraica donde figura al menos una cantidad desconocida denominada incógnita (representada por letras como $x$).

  A diferencia de una igualdad numérica convencional como $5 + 3 = 8$, una ecuación solo resulta verdadera para determinados valores numéricos de la incógnita.

  Resolver una ecuación consiste en encontrar precisamente los valores que satisfacen el equilibrio de la igualdad.
explicacion_formal: |
  ### Definición formal
  Una **ecuación de primer grado** con una incógnita es una proposición o función proposicional abierta de la forma:

  $$P(x) = Q(x) \iff a x + b = 0 \quad (a \neq 0)$$

  ### Desglose de la fórmula
  - $x$: Variable desconocida o incógnita perteneciente a $\mathbb{R}$.
  - $a, b$: Coeficientes reales conocidos con condición $a \neq 0$.
  - $a x + b = 0$: Forma canónica o reducida de la ecuación lineal de primer grado.

  ### Síntesis didáctica
  Una ecuación es una condicionante lógica cuya validez depende exclusivamente del valor numérico sustituido en la incógnita $x$.
definiciones_clave: |
  - **Ecuación**: Igualdad matemática condicional que se verifica solo para valores específicos de la incógnita.
  - **Incógnita**: Variable cuyo valor numérico es desconocido y debe determinarse para validar la igualdad.
propiedades_relaciones: |
  - **Grado de una ecuación**: Corresponde al mayor exponente entero al cual se encuentra elevada la incógnita ($x^1 = $ primer grado).
  - **Ecuaciones equivalentes**: Dos ecuaciones son equivalentes si poseen exactamente el mismo conjunto solución.
ejemplo_guiado:
  enunciado: 'Dada la expresión $4x - 5 = 11$, clasifícala, identifica su incógnita y determina el valor numérico que satisface la igualdad.'
  pasos:
    - 'Paso 1: Identificar el signo $=$ y la presencia de la letra $x$, lo cual confirma que es una ecuación con incógnita $x$.'
    - 'Paso 2: Sustituir la incógnita por $x = 4$: $4(4) - 5 = 16 - 5 = 11$.'
    - 'Paso 3: Verificar que el valor numérico obtenido es $11 = 11$, comprobando la veracidad de la igualdad.'
    - 'Paso 4: Concluir que $x = 4$ es la solución de la ecuación lineal.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica esencial distingue a una ecuación de una expresión algebraica convencional sin signo de igual?'
    choices:
      - {text: 'Que la ecuación establece una relación de igualdad condicionada mediante el signo $=$.', is_correct: true}
      - {text: 'Que la expresión algebraica carece por completo de variables o letras.', is_correct: false}
      - {text: 'Que una ecuación solo se puede formar con números enteros positivos.', is_correct: false}
      - {text: 'Que ambas expresiones representan siempre polinomios de segundo grado.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la ecuación establece una relación de igualdad condicionada mediante el signo $=$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la ecuación $4x - 5 = 11$, ¿cuál es el valor de la incógnita $x$ que la satisface?'
    choices:
      - {text: '$x = 4$', is_correct: true}
      - {text: '$x = 3$', is_correct: false}
      - {text: '$x = 5$', is_correct: false}
      - {text: '$x = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 4$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar la presencia del signo $=$ uniendo dos miembros algebraicos.'
  - 'Paso 2: Identificar la variable o incógnita presente en los miembros.'
  - 'Paso 3: Determinar los coeficientes numéricos y el grado de la incógnita.'
  - 'Paso 4: Reemplazar la incógnita por valores dados para verificar qué valor satisface la igualdad.'
errores_correccion: |
  - **Error 1:** Confundir una expresión algebraica simple (como $4x - 5$) con una ecuación ($4x - 5 = 11$). **Cómo corregirlo:** Una expresión NO contiene signo igual; **UNA ECUACIÓN EXIGE SIEMPRE EL SIGNO $=$ CONECTANDO DOS MIEMBROS**.
  - **Error 2:** Asumir que cualquier valor asignado a la incógnita mantendrá la verdad de la igualdad. **Cómo corregirlo:** Una ecuación lineal **SE SATISFACE ÚNICAMENTE PARA UN VALOR ESPECÍFICO DE LA INCÓGNITA**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál de las siguientes estructuras representa una ecuación lineal?'
    alternativas:
      - '$2x + 7 = 15$'
      - '$2x + 7$'
      - '$x^2 + 3x + 2$'
    respuesta: '$2x + 7 = 15$'
    solucion_pasos:
      - '1. Opción 1 posee signo $=$ e incógnita $x \implies$ es una ecuación.'
      - '2. Opciones 2 y 3 no tienen signo $=$ son expresiones algebraicas.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Para qué valor de $y$ la ecuación $3y - 6 = 12$ se convierte en una igualdad verdadera?'
    alternativas:
      - '$y = 6$'
      - '$y = 4$'
      - '$y = 2$'
    respuesta: '$y = 6$'
    solucion_pasos:
      - '1. Evaluar $y = 6$: $3(6) - 6 = 18 - 6 = 12$.'
      - '2. Puesto que $12 = 12$, la solución es $y = 6$.'
  - titulo: 'Presencia de la incógnita'
    enunciado: '¿Una igualdad que no posee variables ni letras es una ecuación?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, es una igualdad numérica simple, no una ecuación.'
  - titulo: 'Condicionalidad de la solución'
    enunciado: '¿Una ecuación lineal de primer grado puede tener infinitas soluciones distintas en un caso estándar?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, una ecuación lineal estándar posee solución única.'
errores_frecuentes:
  - 'La expresión algebraica $4x - 5$ equivale a la ecuación $4x - 5 = 11$ en su estructura matemática.'
  - 'La letra utilizada como incógnita en una ecuación de primer grado debe ser de forma obligatoria $x$.'
  - 'La sustitución de la incógnita $x=4$ en la ecuación $4x-5=11$ exige evaluar únicamente el primer miembro $4(4)-5=11$.'
  - 'El grado de una ecuación se determina por la cantidad total de términos en la expresión y no por el exponente de la variable.'
  - 'Una ecuación lineal estándar como $2x+7=15$ se satisface de forma universal para todo número real $x \in \mathbb{R}$.'
afirmaciones_verdaderas:
  - 'Una ecuación de primer grado es una igualdad condicionada que requiere el signo $=$ y al menos una incógnita.'
  - 'El valor de la incógnita que hace verdadera la igualdad es la solución o raíz de la ecuación.'
al_terminar_debes_poder: |
  QUÉ: Definir el concepto de ecuación como una igualdad condicionada con incógnitas.
  CÓMO: Distinguir ecuaciones de expresiones algebraicas e identificar la incógnita y los coeficientes numéricos.
fuente: 'Texto escolar MINEDUC — Álgebra 7° Básico / Ecuaciones Lineales.'
