semantic_id: MAT.ALG.ECUACION_BASE.DEFINICION_ECUACION
resumen_inicial: Una ecuación es una igualdad condicionada que contiene una o más
  variables desconocidas llamadas incógnitas.
explicacion_simple: 'Una ecuación es una adivinanza matemática en forma de igualdad.

  Contiene números conocidos y al menos una letra desconocida llamada incógnita (como
  la $x$).

  A diferencia de una simple igualdad numérica, una ecuación solo es verdadera para
  determinados valores específicos de esa incógnita.'
explicacion_formal: 'Una **ecuación de primer grado** con una incógnita se define
  como una proposición abierta de la forma:


  $$P(x) = Q(x) \quad \iff \quad a x + b = 0 \quad (a \neq 0)$$


  **Desglose de la fórmula:**

  - $x$: Variable desconocida o incógnita perteneciente a $\mathbb{R}$.

  - $a, b$: Coeficientes reales conocidos con $a \neq 0$.

  - $a x + b = 0$: Forma canónica reducida de la ecuación lineal de primer grado.'
definiciones_clave: '- **Ecuación**: Igualdad matemática que se satisface únicamente
  para valores específicos de la incógnita.

  - **Incógnita**: Variable desconocida (generalmente representada por letras como
  $x, y, z$).'
propiedades_relaciones: '- **Grado de una ecuación**: Determinado por el mayor exponente
  al que está elevada la incógnita ($x^1 = $ primer grado).

  - **Condición de verdad**: La ecuación es una declaración cuyo valor de verdad depende
  del valor asignado a la incógnita.'
ejemplo_guiado:
  enunciado: Clasifica la expresión $4x - 5 = 11$, identifica la incógnita y determina
    para qué valor de $x$ se convierte en una igualdad numérica verdadera.
  pasos:
  - 'Paso 1: Identificar el signo $=$ y la letra desconocida $x$, confirmando que
    es una ecuación con incógnita $x$.Paso 2: Probar el valor $x = 4$: $4(4) - 5 =
    16 - 5 = 11$.Paso 3: Verificar que $11 = 11$ es una igualdad verdadera.Paso 4:
    Concluir que $x = 4$ satisface la ecuación.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué distingue a una ecuación de una igualdad numérica convencional?
  choices:
  - text: La presencia de una o más incógnitas cuyo valor condiciona la verdad de
      la igualdad.
    is_correct: true
  - text: Que carece de signo de igual.
    is_correct: false
  - text: Que solo se puede resolver con números enteros negativos.
    is_correct: false
  - text: Que ambos miembros son siempre idénticos para cualquier número.
    is_correct: false
  explanation: La alternativa correcta es 'La presencia de una o más incógnitas cuyo
    valor condiciona la verdad de la igualdad.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la ecuación $4x - 5 = 11$, ¿cuál es el valor de la incógnita $x$
    que la satisface?
  choices:
  - text: $x = 4$
    is_correct: true
  - text: $x = 3$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  - text: $x = 2$
    is_correct: false
  explanation: La alternativa correcta es '$x = 4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la expresión contenga una igualdad y al menos una letra incognita.'
- 'Paso 2: Identificar los coeficientes conocidos y el término independiente.'
- 'Paso 3: Probar o despejar el valor de la incógnita que hace verdadera la igualdad.'
errores_correccion: '- **Error común:** Confundir una expresión algebraica (como $4x
  - 5$) con una ecuación ($4x - 5 = 11$).

  - **Cómo corregirlo:** Una expresión NO tiene signo de igual; una ecuación SIEMPRE
  exige el signo $=$ conectando dos miembros.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
