- placement: after_ejemplo_guiado
  question: ¿A qué es igual la suma $\frac{4}{9} + \frac{0}{5}$?
  choices:
  - text: \$\frac{4}{9}$
    is_correct: true
  - text: \$\frac{4}{14}$
    is_correct: false
  - text: '0'
    is_correct: false
  - text: \$\frac{0}{45}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{4}{9}$. La correcta es \frac{4}{9}:
    como $\frac{0}{5} = 0$, la suma resulta $\frac{4}{9} + 0 = \frac{4}{9}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fracción dada $q = \frac{a}{b}$.'
- 'Paso 2: Expresar el elemento neutro cero con el mismo denominador $b$: $\frac{0}{b}$.'
- 'Paso 3: Realizar la suma $\frac{a + 0}{b}$.'
- 'Paso 4: Comprobar que el resultado es exactamente la fracción original $\frac{a}{b}$.'
errores_correccion: 'Un error común es confundir el neutro aditivo ($0$) con el neutro
  multiplicativo ($1$). Recuerda: **el neutro para SUMAR es el 0**, mientras que el
  neutro para MULTIPLICAR es el 1.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $0 + \left(-\frac{11}{15}\right)$.
  alternativas:
  - -\$\frac{11}{15}$
  - '0'
  - \$\frac{11}{15}$
  respuesta: -\$\frac{11}{15}$
  solucion_pasos:
  - Por la propiedad del neutro aditivo $0 + q = q$.
  - 'Resultado: $-\frac{11}{15}$.'
- titulo: Ejemplo 2
  enunciado: Resuelve la ecuación $x + \frac{3}{4} = \frac{3}{4}$ en $\mathbb{Q}$.
  alternativas:
  - x = 0
  - x = 1
  - x = \$\frac{3}{4}$
  respuesta: x = 0
  solucion_pasos:
  - Por unicidad del elemento neutro aditivo, el único número $x$ que al sumarse con
    $\frac{3}{4}$ la deja igual es $x = 0$.
- titulo: ¿Cualquier fracción con numerador cero como $\frac{0}{99}$ actúa como elemento
    neutro aditivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\frac{0}{99} = 0$, que es el número cero racional.
- titulo: ¿Restar cero a una fracción $q - 0$ modifica el valor de la fracción?
  respuesta: 'No'
  solucion_pasos:
  - No, $q - 0 = q + (-0) = q + 0 = q$.
errores_frecuentes:
- Confundir el elemento neutro aditivo (0) con el neutro multiplicativo (1).
- Creer que sumar cero a una fracción da como resultado cero.
- Pensar que las fracciones negativas no tienen neutro aditivo.
- Confundir $0 - q$ (que da $-q$) con $q - 0$ (que da $q$).
- Asumir que el denominador de una fracción puede ser cero al representar el neutro.
afirmaciones_verdaderas:
- El cero ($0$) es el elemento neutro aditivo en $\mathbb{Q}$, lo que significa que
  $q + 0 = q$ para todo racional.
- Sumar cero a una fracción no altera ni su valor cuantitativo ni su signo.
al_terminar_debes_ponder: 'Debes ser capaz de identificar al cero como elemento neutro
  aditivo en $\mathbb{Q}$ y aplicarlo en la resolución de ecuaciones y simplificaciones.

  '
