semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.NEUTRO_ADITIVO
resumen_inicial: El número cero ($0$) es el elemento neutro aditivo en el conjunto
  de los números racionales, pues al sumarlo con cualquier racional no altera su valor.
explicacion_simple: 'El **elemento neutro aditivo** es el ''número transparente''
  para la suma. En los números racionales ese rol lo cumple el cero ($0$). Si a cualquier
  fracción le sumas cero (por ejemplo, $\frac{3}{5} + 0$), la fracción se queda exactamente
  igual: $\frac{3}{5}$. El cero no suma ni quita nada, por eso se llama ''neutro''.

  '
explicacion_formal: 'Formalmente, existe un único elemento $0 \in \mathbb{Q}$ (representado
  racionalmente como $\frac{0}{b}$ con $b \in \mathbb{Z} \setminus \{0\}$) denominado
  **elemento neutro aditivo** tal que:

  $$\forall q \in \mathbb{Q}, \quad q + 0 = 0 + q = q$$


  Demostración: sea $q = \frac{a}{b}$ con $a, b \in \mathbb{Z}, b \neq 0$ y $0 = \frac{0}{b}$.

  $\frac{a}{b} + \frac{0}{b} = \frac{a + 0}{b} = \frac{a}{b}$

  Dado que el entero $0$ es el neutro aditivo en $\mathbb{Z}$ ($a + 0 = a$), se demuestra
  que el valor del racional $q$ no sufre alteración.

  '
definiciones_clave: '- **Elemento neutro aditivo ($0$)**: Elemento $0 = \frac{0}{1}
  \in \mathbb{Q}$ que preserva la identidad de cualquier racional bajo la adición:
  $q + 0 = q$.

  - **Identidad aditiva**: Propiedad estructural por la cual $f_0(q) = q + 0 = q$.

  - **Representación canónica del cero**: Cualquier fracción cuyo numerador es $0$
  y cuyo denominador es un entero no nulo: $\frac{0}{b} = 0$.

  '
propiedades_relaciones: '- **Unicidad del neutro**: El cero es el único elemento en
  todo $\mathbb{Q}$ que cumple la propiedad de identidad aditiva.

  - **Preservación de signo**: Sumar cero a un racional positivo lo mantiene positivo,
  y a uno negativo lo mantiene negativo.

  - **Consecuencia en la sustracción**: Restar cero a una fracción la deja inalterada
  ($q - 0 = q$), pero restar una fracción a cero invierte su signo ($0 - q = -q$).

  '
ejemplo_guiado:
  enunciado: Demuestra la neutralidad del cero sumando la fracción $q = -\frac{7}{12}$
    con $0 = \frac{0}{12}$.
  pasos:
  - 'Plantear la suma: $-\frac{7}{12} + \frac{0}{12}$.'
  - 'Sumar los numeradores sobre el denominador común $12$: $\frac{-7 + 0}{12}$.'
  - 'Aplicar la propiedad del neutro en enteros: $-7 + 0 = -7$.'
  - 'Obtener el resultado final: $-\frac{7}{12}$.'
  - 'Concluir: la fracción inicial $q = -\frac{7}{12}$ no sufrió alteración alguna.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el elemento neutro aditivo en el conjunto de los números racionales
    $\mathbb{Q}$?
