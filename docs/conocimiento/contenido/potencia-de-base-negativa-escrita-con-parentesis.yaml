    is_correct: true
  - text: Ambos dan $1$
    is_correct: false
  - text: Ambos dan $-1$
    is_correct: false
  - text: Ambos dan $100$
    is_correct: false
  explanation: La alternativa correcta es '$(-1)^{100} = 1$ y $-1^{100} = -1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si la base negativa está completamente encerrada entre paréntesis.'
- 'Paso 2: Analizar la paridad del exponente $n$ (par o impar).'
- 'Paso 3: Asignar signo positivo si el exponente es par, o signo negativo si el exponente es impar, calculando el valor absoluto $a^n$.'
errores_correccion: '- **Error 1: Asumir que $-3^2 = 9$.** **Cómo corregirlo:** Sin paréntesis el signo no se eleva: $-3^2 = -(3 \cdot 3) = -9$. Solo $(-3)^2 = +9$.

  - **Error 2: Pensar que $(-2)^3 = +8$.** **Cómo corregirlo:** Al ser exponente impar, tres signos negativos dan negativo: $(-2)(-2)(-2) = -8$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $(-2)^6$?
  alternativas:
  - $+64$
  - $-64$
  - $-12$
  respuesta: $+64$
  solucion_pasos:
  - Base $-2$ con exponente par $6 \implies +2^6 = +64$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la diferencia entre $(-5)^2$ y $-5^2$?
  alternativas:
  - $(-5)^2 = 25$ y $-5^2 = -25$
  - Ambos son 25
  - Ambos son -25
  respuesta: $(-5)^2 = 25$ y $-5^2 = -25$
  solucion_pasos:
  - $(-5)^2 = (-5)(-5) = 25$ y $-5^2 = -(5\cdot 5) = -25$.
- titulo: ¿Es (-1)⁵⁰ igual a +1?
  respuesta: Sí
  solucion_pasos:
  - Sí, 50 es par, por lo que $(-1)^{50} = +1$.
  alternativas:
  - texto: Sí, porque el exponente 50 es par
    es_correcta: true
    retroalimentacion: ¡Correcto! $(-1)^{\text{par}} = +1$.
  - texto: No, es igual a -1
    es_correcta: false
    retroalimentacion: Incorrecto, eso ocurriría con exponente impar.
  - texto: No, es igual a -50
    es_correcta: false
    retroalimentacion: Incorrecto, no es multiplicación.
- titulo: ¿Es -3⁴ igual a (-3)⁴?
  respuesta: 'No'
  solucion_pasos:
  - No, $-3^4 = -81$ y $(-3)^4 = +81$.
  alternativas:
  - texto: No, -3⁴ = -81 mientras que (-3)⁴ = +81
    es_correcta: true
    retroalimentacion: ¡Correcto! El paréntesis define si el signo se eleva o no.
  - texto: Sí, dan el mismo resultado 81
    es_correcta: false
    retroalimentacion: Incorrecto, difieren en el signo.
  - texto: Sí, ambos son -81
    es_correcta: false
    retroalimentacion: Incorrecto, $(-3)^4$ es positivo.
errores_frecuentes:
- Olvidar los paréntesis al reemplazar valores negativos en fórmulas algebraicas (escribir $-x^2$ en vez de $(-x)^2$).
- Pensar que todo exponente vuelve positivo al número incluso sin paréntesis.
- Confundir la regla de signos de la suma con la de la potencia.
- Asumir que exponentes impares dan positivo si la base está entre paréntesis.
- Creer que $(-1)^n$ siempre vale 1.
afirmaciones_verdaderas:
- La expresión $(-a)^n$ incluye el signo negativo en la base multiplicada.
- Si el exponente $n$ es par, $(-a)^n$ es siempre positivo para $a \neq 0$.
- Las expresiones $(-a)^2$ y $-a^2$ producen resultados con signos opuestos.
al_terminar_debes_poder: '![Síntesis de base negativa con paréntesis](/static/img/nodos/potencia-de-base-negativa-escrita-con-parentesis-resumen.svg)


  QUÉ: Evaluar y diferenciar potencias con bases negativas escritas con y sin paréntesis.


  CÓMO: Reconociendo la inclusión del signo negativo en la base mediante paréntesis $(-a)^n$, aplicando las reglas de paridad del exponente ($(-a)^{\text{par}} = +a^n$ y $(-a)^{\text{impar}} = -a^n$), y distinguiéndolas rigurosamente de los opuestos sin paréntesis $-a^n$.'
