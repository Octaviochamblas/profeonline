semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_NEGATIVA_PARENTESIS
resumen_inicial: La presencia de paréntesis en $(-a)^n$ indica que el signo negativo
  forma parte de la base y se multiplica $n$ veces, a diferencia de $-a^n$ donde el
  signo se aplica al final.
explicacion_simple: 'Los paréntesis son las paredes que protegen al signo negativo.
  Cuando escribimos $(-3)^2$, el signo negativo está dentro de la base y se multiplica
  por sí mismo: $(-3) \cdot (-3) = 9$. Si no hay paréntesis, como en $-3^2$, el signo
  se queda afuera esperando: $-(3 \cdot 3) = -9$.'
explicacion_formal: 'La distinción notacional entre **Base Negativa Encapsulada**
  y **Negación de Potencia** se rige por la prioridad de operadores:


  $$(-a)^n = \underbrace{(-a) \cdot (-a) \dots (-a)}_{n \text{ factores}} \quad \neq
  \quad -a^n = -1 \cdot (a^n)$$


  **Desglose de la regla:**

  - Con paréntesis: En $(-a)^n$, la base es $(-a)$.

  - Sin paréntesis: En $-a^n$, la base es solo $a$, y el signo minus es la multiplicación
  por el escalar $-1$.


  > **Complemento didáctico:** Esta diferencia notacional altera el signo final cuando
  el exponente es un número par.'
definiciones_clave: '- **Importancia del paréntesis en bases negativas**: Regla de
  encapsulamiento que define si el signo pertenece a la base multiplicada.'
propiedades_relaciones: '- **Encapsulamiento del signo**: $(-a)^n \neq -a^n$ para
  exponente par.'
ejemplo_guiado:
  enunciado: Calcule y compare el resultado de las expresiones $(-2)^4$ y $-2^4$.
  pasos:
  - 'Paso 1: Evaluar $(-2)^4$: la base es $(-2)$. Se multiplica $4$ veces: $(-2) \cdot
    (-2) \cdot (-2) \cdot (-2) = +16$.'
  - 'Paso 2: Evaluar $-2^4$: la base es $2$. Se aplica el signo menos al final: $-(2
    \cdot 2 \cdot 2 \cdot 2) = -(16) = -16$.'
  - 'Paso 3: Comparar resultados: $+16 \neq -16$.'
  - 'Conclusión: $(-2)^4 = 16$, mientras que $-2^4 = -16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la expresión -3^2 sin paréntesis?
  choices:
  - text: '-9'
    is_correct: true
  - text: '+9'
    is_correct: false
  - text: '6'
    is_correct: false
  - text: '-6'
    is_correct: false
  explanation: La alternativa correcta es '-9'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuánto dio (-2)^4 con paréntesis?
  choices:
  - text: 16 positivo
    is_correct: true
  - text: -16 negativo
    is_correct: false
  - text: '-8'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: La alternativa correcta es '16 positivo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar si el signo negativo se encuentra encerrado dentro del paréntesis
  junto al número.'
- 'Paso 2: Si hay paréntesis, incluir el signo negativo en cada factor del desarrollo.'
- 'Paso 3: Si no hay paréntesis, calcular la potencia positiva y anteponerle el signo
  negativo al final.'
errores_correccion: '- **Error 1: Asumir que $(-a)^2$ y $-a^2$ dan el mismo resultado.**
  **Cómo corregirlo:** $(-3)^2 = 9$ (positivo) mientras $-3^2 = -9$ (negativo).


  - **Error 2: Olvidar los paréntesis al escribir una base negativa en la calculadora.**
  **Cómo corregirlo:** Sin paréntesis la calculadora procesará $-a^n = -(a^n)$ dando
  signo negativo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-5)^2$.
  alternativas:
  - '25'
  - '-25'
  - '10'
  respuesta: '25'
  solucion_pasos:
  - $(-5) \cdot (-5) = 25$.
- titulo: Ejemplo 2
  enunciado: Calcule $-5^2$.
  alternativas:
  - '-25'
  - '25'
  - '-10'
  respuesta: '-25'
  solucion_pasos:
  - $-(5 \cdot 5) = -25$.
- titulo: ¿Da (-1)^2 el resultado +1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1) \cdot (-1) = 1$.
- titulo: ¿Es -1^2 igual a -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-(1^2) = -1$.
errores_frecuentes:
- Las expresiones $(-4)^2$ y $-4^2$ representan exactamente la misma operación aritmética.
- Escribir paréntesis en una base negativa no afecta el signo del resultado final.
- En la expresión $-2^4$ la base de la potencia es el número negativo $-2$.
- Elevar una base negativa con paréntesis a un exponente par da siempre como resultado
  un número negativo.
- Los paréntesis pueden eliminarse libremente en cualquier potencia de base negativa.
afirmaciones_verdaderas:
- Los paréntesis en $(-a)^n$ indican que el signo menos forma parte de la base que
  se multiplica.
- La expresión $-a^n$ representa la negación del resultado de $a^n$, por lo que $-a^{2k}
  < 0$ para $a \neq 0$.
al_terminar_debes_poder: Al terminar serás capaz de evaluar potencias de base negativa
  con y sin paréntesis, distinguiendo cuándo el signo forma parte de la base multiplicada.
