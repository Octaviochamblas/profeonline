    is_correct: true
  - text: $-81$
    is_correct: false
  - text: $-12$
    is_correct: false
  - text: $+12$
    is_correct: false
  explanation: La alternativa correcta es '$+81$ (exponente par sobre base negativa)'.
  reinforcement_section: Explicación formal
