semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_NEGATIVA_PARENTESIS
resumen_inicial: Los paréntesis en una base negativa $(-a)^n$ fuerzan a que el signo
  negativo se multiplique repetidamente junto con el valor absoluto de la base.
explicacion_simple: 'Cuando escribes $(-3)^4$, los paréntesis indican que la base
  es todo el número $-3$:

  $$(-3)^4 = (-3) \cdot (-3) \cdot (-3) \cdot (-3) = 81$$

  En cambio, sin paréntesis, $-3^4 = -(3 \cdot 3 \cdot 3 \cdot 3) = -81$.

  Los paréntesis cambian por completo el resultado.'
explicacion_formal: Sea $-a \in \mathbb{R}$ con $a > 0$ y $n \in \mathbb{N}$. La expresión
  $(-a)^n$ define a $(-a)$ como la base del producto iterado. De este modo, $(-a)^n
  = (-1)^n \cdot a^n$.
definiciones_clave: '- **Base negativa agrupada**: Expresión $(-a)$ donde el signo
  menos forma parte integrante de la base.'
propiedades_relaciones: '- **Descomposición del signo**: $(-a)^n = (-1)^n \cdot a^n$.'
ejemplo_guiado:
  enunciado: Calcula $(-2)^4$ y $(-2)^3$.
  pasos:
  - 'Para $(-2)^4$: 4 es par, $(-2)(-2)(-2)(-2) = +16$.'
  - 'Para $(-2)^3$: 3 es impar, $(-2)(-2)(-2) = -8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el desarrollo correcto de la potencia $(-4)^3$?
  choices:
  - text: (-4) · (-4) · (-4) = -64
    is_correct: true
  - text: -(4 · 4 · 4) = -64
    is_correct: false
  - text: (-4) · 3 = -12
    is_correct: false
  - text: 4 · 4 · 4 = 64
    is_correct: false
  explanation: 'La correcta es: (-4) · (-4) · (-4) = -64. La base entre paréntesis
    es -4.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $(-3)^4$?
  choices:
  - text: '81'
    is_correct: true
  - text: '-81'
    is_correct: false
  - text: '-12'
    is_correct: false
  - text: '12'
    is_correct: false
  explanation: 'La correcta es: 81. Al ser el exponente par (4), el producto de 4
    signos negativos da positivo (+81).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base con su signo dentro del paréntesis.'
- 'Paso 2: Multiplicar la base entre paréntesis la cantidad de veces que indica el
  exponente.'
- 'Paso 3: Aplicar la regla de signos del producto.'
errores_correccion: No omitas los paréntesis si la base es negativa. $(-2)^4 = 16$,
  pero $-2^4 = -16$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(-5)^2$.
  alternativas:
  - '25'
  - '-25'
  - '-10'
  respuesta: '25'
  solucion_pasos:
  - $(-5) \cdot (-5) = 25$.
errores_frecuentes:
- Ignorar los paréntesis y calcular como si no los tuviera.
afirmaciones_verdaderas:
- $(-a)^n$ incluye al signo negativo dentro de la multiplicación iterada.
al_terminar_debes_poder: Calcular correctamente potencias de base negativa escritas
  con paréntesis.
fuente: Texto escolar MINEDUC.
estado: publicado
