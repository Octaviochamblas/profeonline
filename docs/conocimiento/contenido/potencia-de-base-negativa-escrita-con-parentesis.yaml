semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_NEGATIVA_PARENTESIS
resumen_inicial: En una potencia de base negativa escrita con paréntesis $(-a)^n$, el signo negativo forma parte integral de la base y se multiplica $n$ veces sucesivas.
explicacion_simple: '![Potencia de base negativa con paréntesis](/static/img/nodos/potencia-de-base-negativa-escrita-con-parentesis-intro.svg)


  El uso de los paréntesis cambia radicalmente el resultado de una potencia. Cuando escribimos $(-2)^4$, los paréntesis indican que el signo menos está ''amarrado'' al $2$: multiplicamos $(-2) \cdot (-2) \cdot (-2) \cdot (-2) = +16$. En cambio, si escribimos $-2^4$ sin paréntesis, el signo menos queda afuera esperando: $-(2 \cdot 2 \cdot 2 \cdot 2) = -16$. ¡Son resultados completamente opuestos!'
explicacion_formal: "Sea $a \\in \\mathbb{R}^+$ y $n \\in \\mathbb{N}$. La expresión $(-a)^n$ define una potencia cuya base es el número real negativo $(-a)$:\n\n$$(-a)^n = \\underbrace{(-a) \\cdot (-a) \\cdot \\dots \\cdot (-a)}_{n \\text{ factores}}$$\n\n**Regla de paridad de signos:**\n1. **Exponente par ($n = 2k$ con $k \\in \\mathbb{N}$):**\n   $$(-a)^{2k} = +a^{2k} > 0$$\n   Los signos negativos se cancelan de a pares: $(-1)^{2k} = +1$.\n2. **Exponente impar ($n = 2k+1$ con $k \\in \\mathbb{N}_0$):**\n   $$(-a)^{2k+1} = -a^{2k+1} < 0$$\n   Un signo negativo queda sin pareja: $(-1)^{2k+1} = -1$.\n\n> **Diferencia sintáctica crucial:**\n> $$(-a)^n \\neq -a^n \\quad \\text{(para todo } n \\text{ par con } a \\neq 0\\text{)}$$"
definiciones_clave: '- **Base negativa con paréntesis**: Expresión donde el signo negativo está incluido en la multiplicación iterada.

  - **Cancelación por pares**: Propiedad que vuelve positivo el producto de una cantidad par de factores negativos.'
propiedades_relaciones: '- **Simetría cuadrática**: $(-x)^2 = x^2$.

  - **Disparidad con ausencia de paréntesis**: $(-4)^2 = +16$ mientras que $-4^2 = -16$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de base negativa con paréntesis](/static/img/nodos/potencia-de-base-negativa-escrita-con-parentesis-ejemplos.svg)


    Compare y calcule el valor exacto de $(-4)^2$, $-4^2$, $(-1)^{100}$ y $-1^{100}$.'
  pasos:
  - 'Paso 1: Evaluar $(-4)^2$: Base $= -4$, exp $= 2$ (par). Desarrollo: $(-4) \cdot (-4) = +16$.'
  - 'Paso 2: Evaluar $-4^2$: Base $= 4$, exp $= 2$. El signo está afuera: $-(4 \cdot 4) = -16$.'
  - 'Paso 3: Evaluar $(-1)^{100}$: Base $= -1$, exp $= 100$ (par). Desarrollo: $(-1)^{100} = +1$.'
  - 'Paso 4: Evaluar $-1^{100}$: Base $= 1$, exp $= 100$. El signo está afuera: $-(1^{100}) = -1$.'
  - 'Conclusión: $(-4)^2 = 16 \neq -4^2 = -16$ y $(-1)^{100} = 1 \neq -1^{100} = -1$.'
checkpoints:
