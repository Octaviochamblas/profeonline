semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_NEGATIVA_PARENTESIS
resumen_inicial: Los paréntesis en una base negativa $(-a)^n$ fuerzan a que el signo negativo
  se multiplique repetidamente junto con el valor absoluto de la base.
explicacion_simple: 'Cuando escribes $(-3)^4$, los paréntesis indican que la base es todo
  el número $-3$:

  $$(-3)^4 = (-3) \cdot (-3) \cdot (-3) \cdot (-3) = 81$$

  En cambio, sin paréntesis, $-3^4 = -(3 \cdot 3 \cdot 3 \cdot 3) = -81$.

  Los paréntesis cambian por completo el resultado.'
explicacion_formal: Sea $-a \in \mathbb{R}$ con $a > 0$ y $n \in \mathbb{N}$. La expresión
  $(-a)^n$ define a $(-a)$ como la base del producto iterado. De este modo, $(-a)^n = (-1)^n
  \cdot a^n$.
definiciones_clave: '- **Base negativa agrupada**: Expresión $(-a)$ donde el signo menos forma
  parte integrante de la base.'
propiedades_relaciones: '- **Descomposición del signo**: $(-a)^n = (-1)^n \cdot a^n$.'
ejemplo_guiado:
  enunciado: Calcula $(-2)^4$ y $(-2)^3$.
  pasos:
  - 'Para $(-2)^4$: 4 es par, $(-2)(-2)(-2)(-2) = +16$.'
  - 'Para $(-2)^3$: 3 es impar, $(-2)(-2)(-2) = -8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el desarrollo correcto de la potencia $(-4)^3$?
  choices:
  - text: (-4) · (-4) · (-4) = -64
    is_correct: true
  - text: -(4 · 4 · 4) = -64
    is_correct: false
  - text: (-4) · 3 = -12
    is_correct: false
  - text: 4 · 4 · 4 = 64
    is_correct: false
  explanation: 'La correcta es: (-4) · (-4) · (-4) = -64. La base entre paréntesis es -4.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $(-3)^4$?
  choices:
  - text: '81'
    is_correct: true
  - text: '-81'
    is_correct: false
  - text: '-12'
    is_correct: false
  - text: '12'
    is_correct: false
  explanation: 'La correcta es: 81. Al ser el exponente par (4), el producto de 4 signos negativos
    da positivo (+81).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base con su signo dentro del paréntesis.'
- 'Paso 2: Multiplicar la base entre paréntesis la cantidad de veces que indica el exponente.'
- 'Paso 3: Aplicar la regla de signos del producto.'
errores_correccion: No omitas los paréntesis si la base es negativa. $(-2)^4 = 16$, pero $-2^4
  = -16$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(-5)^2$.
  alternativas:
  - '25'
  - '-25'
  - '-10'
  respuesta: '25'
  solucion_pasos:
  - $(-5) \cdot (-5) = 25$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de (-2)^5?
  alternativas:
  - '-32'
  - '32'
  - '-10'
  respuesta: '-32'
  solucion_pasos:
  - (-2)(-2)(-2)(-2)(-2) = -32.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (-10)^2?
  alternativas:
  - '100'
  - '-100'
  - '-20'
  respuesta: '100'
  solucion_pasos:
  - (-10)(-10) = 100.
- titulo: ¿Es (-1)^7 igual a -1?
  respuesta: Sí
  solucion_pasos:
  - El exponente 7 es impar, por lo que el resultado conserva el signo negativo.
errores_frecuentes:
- Ignorar los paréntesis y calcular como si no los tuviera.
- Calcular (-a)^n como si fuera igual a -a^n, ignorando que los paréntesis incluyen el signo
  dentro de la base.
- Olvidar aplicar la regla de signos al multiplicar varios factores negativos.
- Pensar que toda potencia de base negativa entre paréntesis da resultado negativo.
- No contar correctamente la cantidad de factores negativos al determinar el signo final.
afirmaciones_verdaderas:
- $(-a)^n$ incluye al signo negativo dentro de la multiplicación iterada.
- El resultado de (-a)^n depende de si el exponente n es par o impar.
al_terminar_debes_poder: Calcular correctamente potencias de base negativa escritas con paréntesis.
fuente: Texto escolar MINEDUC.
estado: publicado
