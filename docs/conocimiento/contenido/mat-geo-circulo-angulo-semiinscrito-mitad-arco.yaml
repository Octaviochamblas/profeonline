procedimiento:
- 'Paso 1: Identifica el ángulo semiinscrito y el arco que subtiende (el arco comprendido
  dentro de su abertura).'
- 'Paso 2: Si conoces el arco, divide su medida entre 2 para obtener el ángulo semiinscrito.'
- 'Paso 3: Si conoces el ángulo semiinscrito, multiplica su medida por 2 para obtener
  el arco.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
