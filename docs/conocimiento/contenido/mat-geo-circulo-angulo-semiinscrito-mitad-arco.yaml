semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_SEMIINSCRITO_MITAD_ARCO
resumen_inicial: 'Relación entre ángulo semiinscrito y mitad del arco correspondiente:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Al igual que el ángulo inscrito, el ángulo semiinscrito (entre
  tangente y cuerda) mide exactamente la mitad del arco que abarca.
explicacion_formal: '![Ángulo semiinscrito igual a la mitad del arco](/static/img/geometria/circunferencia-circulo/circulo-angulo-semiinscrito-mitad-arco.svg)


  ### Definición formal


  Si el ángulo semiinscrito entre la tangente en $T$ y la cuerda $TB$ subtiende el
  arco $TB$, entonces su medida es $\frac{m(\text{arco }TB)}{2}$, exactamente igual
  que en el caso del ángulo inscrito.


  ### Desarrollo didáctico


  Si el arco $TB$ mide 120°, el ángulo semiinscrito formado entre la tangente y la
  cuerda $TB$ mide $\frac{120°}{2}=60°$. Esta relación completa el conjunto de propiedades
  angulares de la circunferencia junto al ángulo del centro y el ángulo inscrito.'
