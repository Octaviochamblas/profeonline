ejemplo_guiado:
  enunciado: Para analizar relación entre ángulo semiinscrito y mitad del arco correspondiente,
    considera un ángulo $\alpha = 161^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1050^\circ = 161^\circ$.
  pasos:
  - Identificar la propiedad de relación entre ángulo semiinscrito y mitad del arco
    correspondiente referida a $\alpha = 161^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1050 = 161 \implies x = 161 - 1050$.'
  - Concluir que la medida calculada para relación entre ángulo semiinscrito y mitad
    del arco correspondiente es $x = -889^\circ$.
