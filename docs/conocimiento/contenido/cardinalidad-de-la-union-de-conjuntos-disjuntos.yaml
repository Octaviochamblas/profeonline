semantic_id: MAT.FUND.CARDINALIDAD_CONJUNTOS.CARDINALIDAD_UNION_DISJUNTA
resumen_inicial: 'Principio aditivo fundamental del conteo: cálculo directo de la cardinalidad de la unión para conjuntos finitos disjuntos ($|A \cup B| = |A| + |B|$ cuando $A \cap B = \emptyset$).'
explicacion_simple: |
  Cuando dos conjuntos **no tienen ningún elemento en común** (son disjuntos, $A \cap B = \emptyset$), calcular cuántos elementos hay en total en la unión es sumamente fácil: **simplemente sumamos la cantidad de elementos de $A$ con la de $B$**:
  $$|A \cup B| = |A| + |B|$$
  Por ejemplo, si en un frutero hay $5$ manzanas ($A$) y $4$ plátanos ($B$), como ninguna fruta es a la vez manzana y plátano, el total de frutas en la mesa es $5 + 4 = 9$. Esta regla solo funciona si no hay elementos repetidos compartidos entre los dos grupos.
explicacion_formal: |
  ### Definición formal
  En la combinatoria enumerativa y la teoría de la medida conjuntista, el **Principio Aditivo de Cardinalidad** establece que si $A$ y $B$ son conjuntos finitos mutuamente disjuntos ($A \cap B = \emptyset$), la cardinalidad de su unión es la suma exacta de sus cardinalidades individuales:
  $$A \cap B = \emptyset \implies |A \cup B| = |A| + |B|$$
  Para una familia finita de conjuntos disjuntos dos a dos $\{A_1, A_2, \dots, A_k\}$ (es decir, $A_i \cap A_j = \emptyset$ para todo $i \neq j$):
  $$\left|\bigcup_{i=1}^k A_i\right| = \sum_{i=1}^k |A_i|$$

  ### Desglose simbólico
  - Hipótesis necesaria: $|A \cap B| = 0$.
  - Caso general de inclusión-exclusión: $|A \cup B| = |A| + |B| - |A \cap B| = |A| + |B| - 0 = |A| + |B|$.
  - Aditividad finita de medidas de conteo: La función $\mu(S) = |S|$ es una medida de conteo $\sigma$-aditiva sobre $(\mathcal{P}(\mathcal{U}), \subseteq)$.

  ### Síntesis didáctica
  La disyunción total garantiza que ningún elemento se cuente dos veces, haciendo innecesaria cualquier corrección sustractiva en el total.
definiciones_clave: |
  - **Principio aditivo de cardinalidad**: Regla de conteo donde la cardinalidad de la unión de conjuntos disjuntos es la suma directa de sus cardinalidades.
  - **Conjuntos mutuamente disjuntos**: Colección de conjuntos cuya intersección mutua es el conjunto vacío.
  - **Medida de conteo**: Función que asigna a cada conjunto finito su número cardinal de elementos.
propiedades_relaciones: |
  - **Diferencias simétricas en disjuntos**: Si $A \cap B = \emptyset$, entonces $|A \bigtriangleup B| = |A \cup B| = |A| + |B|$.
  - **Partición de conjuntos**: La cardinalidad de cualquier conjunto particionado en bloques disjuntos es igual a la suma de las cardinalidades de dichos bloques.
ejemplo_guiado:
  enunciado: 'En un torneo participan dos clubes: el Club $A$ con $14$ atletas y el Club $B$ con $18$ atletas. Sabiendo que ningún atleta pertenece a ambos clubes a la vez ($A \cap B = \emptyset$), calcula cuántos atletas compiten en total en el torneo.'
  pasos:
    - 'Paso 1: Identificar las cardinalidades individuales:
      - $|A| = 14$ atletas.
      - $|B| = 18$ atletas.'
    - 'Paso 2: Comprobar la condición de disyunción:
      - $A \cap B = \emptyset \implies |A \cap B| = 0$.'
    - 'Paso 3: Aplicar el principio aditivo de cardinalidad:
      - $|A \cup B| = |A| + |B|$.'
    - 'Paso 4: Realizar la adición numérica:
      - $|A \cup B| = 14 + 18 = 32$.'
    - 'Paso 5: Concluir que en el torneo participan exactamente $32$ atletas en total.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Bajo qué condición indispensable es válida la fórmula $|A \cup B| = |A| + |B|$?'
    choices:
      - {text: 'Cuando los conjuntos son mutuamente disjuntos ($A \cap B = \emptyset$)', is_correct: true}
      - {text: 'Cuando uno de los conjuntos es subconjunto del otro ($A \subseteq B$)', is_correct: false}
      - {text: 'Siempre, sin importar si comparten elementos comunes o no', is_correct: false}
      - {text: 'Solo si ambos conjuntos tienen la misma cantidad de elementos', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando los conjuntos son mutuamente disjuntos ($A \cap B = \emptyset$)''. Si comparten elementos, se debe aplicar inclusión-exclusión.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una partición de un conjunto $S$ consta de tres bloques disjuntos con cardinalidades $8$, $12$ y $15$, ¿cuál es la cardinalidad total de $|S|$?'
    choices:
      - {text: '$35$ elementos ($8 + 12 + 15$)', is_correct: true}
      - {text: '$27$ elementos', is_correct: false}
      - {text: '$30$ elementos', is_correct: false}
      - {text: 'No se puede calcular sin conocer la intersección', is_correct: false}
    explanation: 'La alternativa correcta es ''$35$ elementos ($8 + 12 + 15$)''. Al ser bloques de una partición (disjuntos dos a dos), se aplica la suma directa: $8 + 12 + 15 = 35$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que la intersección entre los conjuntos sea el conjunto vacío ($A \cap B = \emptyset$).'
  - 'Paso 2: Obtener las cardinalidades individuales $|A|$ y $|B|$.'
  - 'Paso 3: Aplicar la fórmula del principio aditivo: $|A \cup B| = |A| + |B|$.'
  - 'Paso 4: Para $k$ conjuntos disjuntos por pares, sumar las $k$ cardinalidades: $\sum |A_i|$.'
errores_correccion: |
  - **Error 1:** Aplicar la suma directa $|A| + |B|$ a conjuntos que tienen elementos en común. **Cómo corregirlo:** Si $A \cap B \neq \emptyset$, la adición directa duplicará los elementos comunes; se debe restar la intersección ($|A| + |B| - |A \cap B|$).
  - **Error 2:** Creer que la unión disjunta requiere restar el conjunto vacío. **Cómo corregirlo:** Como $|\emptyset| = 0$, la deducción es cero y la fórmula directa es $|A| + |B|$.
ejemplos:
  - titulo: 'Vocales y dígitos'
    enunciado: 'Si $V$ son las 5 vocales y $D$ los 10 dígitos del sistema decimal, ¿cuánto vale $|V \cup D|$?'
    alternativas:
      - '$15$'
      - '$10$'
      - '$50$'
    respuesta: '$15$'
    solucion_pasos:
      - '1. Al ser disjuntos ($V \cap D = \emptyset$), $|V \cup D| = 5 + 10 = 15$.'
  - titulo: 'Diferencia simétrica de disjuntos'
    enunciado: 'Si $A$ y $B$ son disjuntos con $|A|=7$ y $|B|=6$, ¿cuánto vale $|A \bigtriangleup B|$?'
    respuesta: '$13$'
    solucion_pasos:
      - 'En conjuntos disjuntos $A \bigtriangleup B = A \cup B$, por lo que su cardinalidad es $7 + 6 = 13$.'
  - titulo: 'Partición en 4 grupos'
    enunciado: 'Si un conjunto se divide en 4 partes disjuntas de 5 elementos cada una, ¿cuántos elementos tiene en total?'
    respuesta: '$20$'
    solucion_pasos:
      - '$5 + 5 + 5 + 5 = 20$ elementos.'
  - titulo: 'Conjunto vacío como sumando'
    enunciado: 'Si $|A| = 10$, ¿cuánto vale $|A \cup \emptyset|$?'
    respuesta: '$10$'
    solucion_pasos:
      - '$|A| + |\emptyset| = 10 + 0 = 10$.'
errores_frecuentes:
  - 'La afirmación de que la fórmula $|A \cup B| = |A| + |B|$ es universal para cualquier par de conjuntos aunque compartan elementos.'
  - 'La afirmación de que la unión de conjuntos disjuntos requiere una corrección sustractiva en el cómputo final.'
  - 'La afirmación de que dos conjuntos infinitos disjuntos tienen cardinalidad finita al unirse.'
  - 'La afirmación de que la cardinalidad de la unión de conjuntos disjuntos puede ser menor que la cardinalidad de cualquiera de sus componentes.'
  - 'La afirmación de que la aditividad de cardinalidad no se cumple para particiones de más de dos conjuntos.'
afirmaciones_verdaderas:
  - 'La cardinalidad de la unión de conjuntos finitos disjuntos es exactamente igual a la suma de sus cardinalidades individuales ($A \cap B = \emptyset \implies |A \cup B| = |A| + |B|$).'
  - 'Para cualquier partición finita $\{A_1, \dots, A_k\}$ de un conjunto $S$, la cardinalidad total satisface $|S| = \sum_{i=1}^k |A_i|$.'
al_terminar_debes_poder: |
  QUÉ: Enunciar, verificar y aplicar el principio aditivo de cardinalidad para conjuntos disjuntos ($|A \cup B| = |A| + |B|$).
  CÓMO: Comprobar la condición de disyunción ($A \cap B = \emptyset$) y calcular la cardinalidad total de uniones y particiones sin correcciones sustractivas.
