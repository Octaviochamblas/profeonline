procedimiento:
- 'Paso 1: Identifica el signo del escalar k por el que se multiplicará el vector.'
- 'Paso 2: Si k es positivo, el vector resultante mantiene el mismo sentido que el
  original.'
- 'Paso 3: Si k es negativo, el vector resultante invierte su sentido respecto del
  original.'
