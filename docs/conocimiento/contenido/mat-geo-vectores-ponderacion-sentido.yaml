semantic_id: MAT.GEO.VECTORES_OPERATORIA.PONDERACION_SENTIDO
resumen_inicial: 'Efecto de la multiplicación escalar en el sentido de un vector:
  conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: El signo del número por el que se multiplica un vector decide
  si la flecha sigue apuntando hacia el mismo lado o si se voltea hacia el lado contrario.
explicacion_formal: '![Efecto de la ponderación escalar en el sentido](/static/img/geometria/cartesiano-vectores/vectores-ponderacion-sentido.svg)


  ### Definición formal


  Para un vector $\vec{v}$ y un escalar $k$: si $k>0$, $k\vec{v}$ tiene el mismo sentido
  que $\vec{v}$; si $k<0$, $k\vec{v}$ tiene sentido opuesto a $\vec{v}$; si $k=0$,
  el resultado es el vector nulo (sin sentido definido).


  ### Desarrollo didáctico


  En la figura, el vector $2\vec{v}$ (con $k=2>0$) mantiene el mismo sentido que $\vec{v}$,
  mientras que $-2\vec{v}$ (con $k=-2<0$) apunta exactamente hacia el lado contrario.'
definiciones_clave: '- **Efecto de la multiplicación escalar en el sentido de un vector**:
