semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.GRAFICA_NEGATIVO_IMPAR
resumen_inicial: 'La gráfica de una función potencia de exponente entero negativo impar $f(x) = a x^{-(2k+1)}$ posee forma de hipérbola discontinua de dos ramas en cuadrantes opuestos, simétrica respecto al origen $(0, 0)$.'
explicacion_simple: |
  Cuando una función potencia tiene un exponente entero negativo impar (como $x^{-1} = \frac{1}{x}$ o $x^{-3} = \frac{1}{x^3}$), su gráfica se divide en dos hipérbolas curvas ubicadas en esquinas opuestas del plano cartesiano. Si $a$ es positivo, una rama habita en el cuadrante I (arriba a la derecha) y la otra en el cuadrante III (abajo a la izquierda). Si $a$ es negativo, habitan en los cuadrantes II y IV. Ambas ramas esquivan el centro bordando el eje vertical $y$ y el eje horizontal $x$ sin tocar ninguno de los dos.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función potencia de exponente entero negativo impar** $f(x) = a x^{-(2k+1)} \equiv \frac{a}{x^{2k+1}}$ ($k \in \mathbb{Z}^+\cup\{0\}$) se compone de dos ramas continuas disjuntas $G = \{(x, \frac{a}{x^{2k+1}}) \mid x \in \mathbb{R} \setminus \{0\}\}$ caracterizada analíticamente por:
  1. **Simetría Central Impar**: $f(-x) = \frac{a}{(-x)^{2k+1}} = \frac{a}{-x^{2k+1}} = -f(x)$. La gráfica es rotacionalmente simétrica respecto al origen $(0, 0)$.
  2. **Asíntota Vertical Discontinua ($x = 0$)**:
     - Si $a > 0 \implies \lim_{x \to 0^-} f(x) = -\infty$ y $\lim_{x \to 0^+} f(x) = +\infty$.
     - Si $a < 0 \implies \lim_{x \to 0^-} f(x) = +\infty$ y $\lim_{x \to 0^+} f(x) = -\infty$.
  3. **Asíntota Horizontal Unilateral ($y = 0$)**: $\lim_{x \to \pm\infty} f(x) = 0$.

  ### Síntesis didáctica
  Puntos nodales universales para la forma mónica $y = x^{-(2k+1)}$:
  - $(-1, -1)$ y $(1, 1)$.
definiciones_clave: |
  - **Hipérbola de dos ramas opuestas**: Curva rota en dos tramos situados en cuadrantes opuestos respecto al centro.
  - **Divergencia asintótica opuesta**: Comportamiento donde una rama sube a $+\infty$ y la otra cae a $-\infty$ bordeando la recta $x = 0$.
  - **Cuadrantes antipodales**: Cuadrantes I y III (si $a > 0$) o cuadrantes II y IV (si $a < 0$).
propiedades_relaciones: |
  - **Recorrido agujereado en cero**: El recorrido de toda función de exponente entero negativo impar es el conjunto de los reales excepto el cero: $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$.
  - **Inversión de monotonía**: Para $a > 0$, la función es estrictamente decreciente en cada uno de sus tramos disjuntos $]-\infty, 0[$ y $]0, +\infty[$.
ejemplo_guiado:
  enunciado: 'Analiza la gráfica y puntos representativos de la función potencia recíproca impar $f(x) = \frac{3}{x}$ para $x \in \{-3, -1, -0.5, 0.5, 1, 3\}$, identificando los cuadrantes habitados y sus asíntotas.'
  pasos:
    - 'Paso 1: Evaluamos puntos negativos: $f(-3) = -1$, $f(-1) = -3$, $f(-0.5) = -6$. (Rama en el cuadrante III).'
    - 'Paso 2: Evaluamos puntos positivos: $f(0.5) = 6$, $f(1) = 3$, $f(3) = 1$. (Rama en el cuadrante I).'
    - 'Paso 3: Observamos que $f(-1) = -3$ y $f(1) = 3$, confirmando simetría impar $f(-x) = -f(x)$ respecto al origen $(0, 0)$.'
    - 'Paso 4: Asíntotas: Asíntota vertical en la recta $x = 0$ (eje $y$) y asíntota horizontal en la recta $y = 0$ (eje $x$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué cuadrantes del plano cartesiano se distribuyen las dos ramas de la gráfica de la función potencia $f(x) = \frac{2}{x^3}$ con exponente impar negativo y $a = 2 > 0$?'
    choices:
      - {text: 'En los cuadrantes I y III', is_correct: true}
      - {text: 'En los cuadrantes I y II', is_correct: false}
      - {text: 'En los cuadrantes II y IV', is_correct: false}
      - {text: 'En los cuadrantes III y IV', is_correct: false}
    explanation: 'La alternativa correcta es ''En los cuadrantes I y III''. Para $a > 0$, entradas positivas $x > 0$ dan ordenadas positivas $y > 0$ (cuadrante I) y entradas negativas $x < 0$ dan ordenadas negativas $y < 0$ (cuadrante III).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el conjunto recorrido de la función potencia de exponente entero negativo impar $f(x) = \frac{-5}{x}$?'
    choices:
      - {text: 'El conjunto de los números reales excepto el cero $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$', is_correct: true}
      - {text: 'El conjunto completo de los números reales $\mathbb{R}$', is_correct: false}
      - {text: 'El intervalo no positivo $]-\infty, 0]$', is_correct: false}
      - {text: 'El intervalo no negativo $[0, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto de los números reales excepto el cero $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$''. La asíntota horizontal $y = 0$ impide que la función tome la altura cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el exponente $n$ sea entero negativo impar ($n = -1, -3, -5\dots$).'
  - 'Paso 2: Trazar las asíntotas en el eje vertical $x = 0$ y en el eje horizontal $y = 0$.'
  - 'Paso 3: Marcar los puntos nodales antipodales $(-1, -a)$ y $(1, a)$.'
  - 'Paso 4: Dibujar las dos ramas hiperbólicas en los cuadrantes I y III (si $a > 0$) o en los cuadrantes II y IV (si $a < 0$) bordeando las asíntotas.'
errores_correccion: |
  - **Error 1:** Dibujar las dos ramas en la parte superior como si el exponente fuera par. **Cómo corregirlo:** Las potencias impares negativas conservan el signo $(-x)^{-(2k+1)} = -x^{-(2k+1)}$. Las ramas habitan en cuadrantes opuestos (I y III o II y IV).
  - **Error 2:** Creer que la función cruza el origen $(0, 0)$. **Cómo corregirlo:** La variable en el denominador prohibe la evaluación en $x = 0$. El origen es el punto de intersección de sus dos asíntotas y la curva jamás pasa por él.
ejemplos:
  - titulo: 'Forma de hipérbola recíproca simple'
    enunciado: '¿La gráfica de $f(x) = \frac{1}{x}$ es simétrica respecto al origen $(0, 0)$?'
    alternativas:
      - 'Sí, por tener exponente impar negativo'
      - 'No, es simétrica al eje y'
      - 'No tiene simetría'
    respuesta: 'Sí, por tener exponente impar negativo'
    solucion_pasos:
      - '1. Exponente $n = -1$ es impar negativo.'
      - '2. Satisface $f(-x) = -f(x)$, siendo una hipérbola simétrica respecto al origen.'
  - titulo: 'Hipérbola en cuadrantes II y IV'
    enunciado: '¿La gráfica de $g(x) = -\frac{2}{x^3}$ habita en los cuadrantes II y IV?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -2 < 0$, las ramas habitan los cuadrantes II y IV.'
  - titulo: 'Recorrido de la hipérbola impar'
    enunciado: '¿El valor $y = 0$ queda excluido del recorrido de $f(x) = \frac{1}{x^5}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La fracción $\frac{1}{x^5}$ jamás puede ser igual a cero. Recorrido: $\mathbb{R} \setminus \{0\}$.'
  - titulo: 'Puntos nodales en impar negativo'
    enunciado: '¿La curva $y = \frac{4}{x}$ pasa por $(-1, -4)$ y $(1, 4)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluamos: $f(-1) = -4$ y $f(1) = 4$.'
errores_frecuentes:
  - 'La gráfica de la función recíproca $f(x) = \frac{1}{x}$ pasa por el punto $(0, 0)$.'
  - 'Las dos ramas de $f(x) = \frac{1}{x^3}$ se ubican en los cuadrantes I y II.'
  - 'El recorrido de las funciones de exponente entero negativo impar incluye a todos los reales $\mathbb{R}$.'
  - 'La función $f(x) = \frac{1}{x}$ corta al eje horizontal en $x = 1$.'
  - 'Las potencias de exponente negativo impar son simétricas respecto al eje vertical $y$.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero negativo impar $f(x) = a x^{-(2k+1)}$ posee una gráfica hiperbólica de dos ramas simétricas respecto al origen $(0, 0)$, habitando cuadrantes opuestos.'
  - 'El conjunto recorrido es los números reales sin el cero $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$, y el origen $(0, 0)$ es la intersección de sus asíntotas cartesianas.'
