semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.GRAFICA_NEGATIVO_IMPAR
resumen_inicial: 'Análisis de la gráfica para exponentes enteros negativos impares:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Exponentes negativos
  y fraccionarios.'
explicacion_simple: Cuando el exponente negativo es impar, la función forma dos ramas
  ubicadas en cuadrantes opuestos, como la clásica hipérbola $y=1/x$.
explicacion_formal: '### Definición formal


  Para $n$ impar y $a>0$, $f(x)=a\cdot x^{-n}$ conserva el signo de $x$: positivo
  para $x>0$ y negativo para $x<0$, ya que $x^{-n}=1/x^n$ y $x^n$ conserva el signo
  de $x$ cuando $n$ es impar. La curva forma dos ramas en los cuadrantes I y III.


  ### Desarrollo didáctico


  $f(x)=x^{-1}=1/x$: para $x=2$, $f(2)=0{,}5$ (cuadrante I); para $x=-2$, $f(-2)=-0{,}5$
  (cuadrante III). Las ramas nunca se tocan y se acercan a ambas asíntotas sin cruzarlas.'
definiciones_clave: '- **Análisis de la gráfica para exponentes enteros negativos
  impares**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de la gráfica para exponentes enteros negativos impares.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de la gráfica para exponentes enteros negativos impares.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de la gráfica
    para exponentes enteros negativos impares.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
