  QUÉ: Esbozar la gráfica de funciones potencia con exponente negativo impar ($n = -1, -3, \dots$).
  CÓMO: Reconocer la forma de hipérbola simétrica respecto al origen, habitando cuadrantes opuestos I/III ($a > 0$) o II/IV ($a < 0$).
