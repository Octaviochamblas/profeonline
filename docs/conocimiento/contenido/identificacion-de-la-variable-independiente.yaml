semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_INDEPENDIENTE
resumen_inicial: La variable independiente es aquella a la que se asignan libremente valores dentro del dominio de una función.
explicacion_simple: |
  En una función, la **variable independiente** es la causa o valor de entrada que elegimos modificar.

  Por ejemplo, en la fórmula del área de un cuadrado $A(s) = s^2$:
  - El lado $s$ es la **variable independiente** (podemos cambiar la medida del lado libremente).
  - Se ubica en el eje horizontal $X$ de los gráficos.
explicacion_formal: |
  En la definición funcional $y = f(x)$, la variable $x$ recibe el nombre de **variable independiente**. Representa un elemento arbitrario del conjunto de partida $A$ (dominio).

  $$\text{Variable Independiente } x \in A = \text{Dom}(f)$$

  **Desglose de la fórmula:**
  - $x$: Entrada libre permitida por el dominio de la función.
  - $y$: Salida supeditada a $x$.
definiciones_clave: |
  - **Variable independiente**: Magnitud de entrada cuyos valores se escogen libremente sin depender de otra variable dentro del dominio.
propiedades_relaciones: |
  - **Ubicación en el gráfico cartesiano**: Se grafica habitualmente en el eje de las abscisas ($X$).
ejemplo_guiado:
  enunciado: Un estanque de agua se llena a razón de $5$ litros por minuto. La cantidad de agua almacenada es $V(t) = 5t$. Identifica la variable independiente.
  pasos:
    - 'Paso 1: Analizar la situación física: transcurre el tiempo $t$ y debido a ello se llena el volumen $V$.'
    - 'Paso 2: Identificar la causa o parámetro libre: el tiempo $t$ en minutos.'
    - 'Paso 3: Observar la notación $V(t)$: $t$ es la variable dentro del paréntesis de entrada.'
    - 'Paso 4: Concluir que la variable independiente es el tiempo $t$.'
checkpoints:
  - placement: after_explicacion_formal
    question: En la función $V(t) = 5t$, ¿cuál es la variable independiente?
    choices:
      - {text: El tiempo $t$., is_correct: true}
      - {text: El volumen $V$., is_correct: false}
      - {text: El número $5$., is_correct: false}
      - {text: La constante de proporcionalidad., is_correct: false}
    explanation: La alternativa correcta es 'El tiempo $t$.'. Es la variable de entrada libre.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿En qué eje del plano cartesiano se representa habitualmente la variable independiente?
    choices:
      - {text: En el eje horizontal de las abscisas ($X$)., is_correct: true}
      - {text: En el eje vertical de las ordenadas ($Y$)., is_correct: false}
      - {text: En la recta $y = x$., is_correct: false}
      - {text: En la dirección del vector normal., is_correct: false}
    explanation: La alternativa correcta es 'En el eje horizontal de las abscisas ($X$).'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Analizar la regla de correspondencia $y = f(x)$ o el problema planteado.'
  - 'Paso 2: Determinar cuál magnitud actúa como el insumo de entrada o causa principal.'
  - 'Paso 3: Asociar dicha magnitud al eje horizontal $X$.'
  - 'Paso 4: Declararla como la variable independiente.'
errores_correccion: |
  - **Error común:** Pensar que la variable independiente siempre debe llamarse obligatoriamente $x$.
  - **Cómo corregirlo:** El nombre de la variable puede ser cualquier letra ($t$ para tiempo, $n$ para cantidad, $p$ para precio); lo decisivo es su rol de entrada libre.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la función $y = 3x - 5$, la variable independiente es $y$.'
  - 'La variable independiente depende funcionalmente de los resultados calculados en el eje $Y$.'
  - 'En un problema de distancia $d(t) = 80t$, la variable independiente es la distancia recorrida $d$.'
  - 'La variable independiente se grafica en el eje vertical de las ordenadas.'
  - 'La variable independiente solo puede tomar un número finito de valores enteros positivos.'
afirmaciones_verdaderas:
  - 'La variable independiente (habitualmente $x$ o $t$) es aquella que se fija o elige libremente dentro del dominio de la función.'
  - 'En la representación gráfica en el plano cartesiano, la variable independiente se ubica en el eje horizontal de las abscisas ($X$).'
al_terminar_debes_poder: |
  QUÉ: Identificar la variable independiente en funciones dadas de forma simbólica o contextual.
  CÓMO: Determinar la magnitud de entrada libre en el problema, ubicarla como argumento de la función y asociarla al eje $X$.
