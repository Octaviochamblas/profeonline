semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_INDEPENDIENTE
resumen_inicial: La variable independiente es la magnitud de entrada cuyos valores se eligen libremente dentro del dominio de la función.
explicacion_simple: '![La variable independiente es la magnitud de entrada cuyos valores se eligen libremente dentro del dominio de la función](/static/img/nodos/identificacion-de-la-variable-independiente-intro.svg)



  En una relación de causa y efecto:

  - La **variable independiente** es la **causa** o dato de entrada.

  - Sus valores se pueden fijar o controlar libremente dentro del dominio.


  Por convención matemática, suele representarse con la letra $x$ y se ubica en el **eje horizontal** del plano cartesiano.


  Por ejemplo, en la fórmula del área de un círculo $A(r) = \pi r^2$, el **radio $r$** es la variable independiente.'
explicacion_formal: 'Dada una función $y = f(x)$:

  - La variable $x$ se denomina **variable independiente** o argumento.

  - Su conjunto de valores admisibles constituye el **dominio** de la función ($\text{Dom}(f)$).

  - En problemas aplicados, representa la magnitud que se manipula o mide como referencia (tiempo, cantidad producida, distancia base).'
definiciones_clave: '- **Variable independiente**: Magnitud de entrada que no depende de otra variable dentro del modelo.

  - **Eje de abscisas**: Eje horizontal $X$ donde se representan sus valores.'
propiedades_relaciones: '- **Causalidad**: Determina directamente el valor que tomará la variable dependiente.

  - **Dominio**: Todos sus valores deben pertenecer al dominio para que la función tenga sentido real.'
ejemplo_guiado:
  enunciado: '![Ejemplo La variable independiente es la magnitud de entrada cuyos valores se eligen libremente dentro del dominio de la función](/static/img/nodos/identificacion-de-la-variable-independiente-ejemplos.svg)



    Un taxista cobra una tarifa fija de $\$1.000$ más $\$500$ por cada kilómetro recorrido $k$. El costo total está dado por $C(k) = 1000 + 500k$. Identifica la variable independiente y explica su significado físico.'
  pasos:
  - 'Paso 1: Analizar las magnitudes presentes: costo total $C$ y distancia recorrida $k$.'
  - 'Paso 2: Determinar cuál es la causa o control: el cliente decide cuántos kilómetros $k$ viajar.'
  - 'Paso 3: Identificar que $k$ es el argumento de entrada de la función $C(k)$.'
  - 'Paso 4: Concluir que la variable independiente es los kilómetros recorridos $k$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función física $v(t) = 9.8t$ que describe la velocidad de caída libre según el tiempo, ¿cuál es la variable independiente?
  choices:
  - text: El tiempo t
    is_correct: true
  - text: La velocidad v
    is_correct: false
  - text: La constante 9.8
    is_correct: false
  - text: La altura de lanzamiento
    is_correct: false
  explanation: La alternativa correcta es 'El tiempo t'. El tiempo es la magnitud de entrada que transcurre de forma independiente.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un gráfico cartesiano estándar, ¿en qué eje se ubica la variable independiente?
  choices:
  - text: Eje horizontal X
    is_correct: true
  - text: Eje vertical Y
    is_correct: false
  - text: En el eje Z
    is_correct: false
  - text: Es indistinto
    is_correct: false
  explanation: La alternativa correcta es 'Eje horizontal X'. Por convención universal, la variable independiente se ubica en el eje horizontal.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el contexto e identificar qué magnitud actúa como dato de entrada o causa.'
- 'Paso 2: En una fórmula $y = f(x)$, identificar la variable encerrada en el argumento $f(\cdot)$.'
- 'Paso 3: Comprobar que sus valores se elijan libremente dentro del dominio.'
- 'Paso 4: Nombrar la variable y sus unidades físicas.'
errores_correccion: '- **Error común:** Confundir las constantes numéricas fijas (como la tarifa base) con la variable independiente.

  - **Cómo corregirlo:** Las constantes no varían; la variable independiente es la magnitud que puede asumir diferentes valores en el dominio.'
ejemplos:
- titulo: 'Ejemplo 1: Consumo eléctrico'
  enunciado: La cuenta de luz se calcula como $P(k) = 150k + 2000$, donde $k$ son los kWh consumidos. ¿Cuál es la variable independiente?
  alternativas:
  - Los kWh consumidos k
  - El total a pagar P
  - El cargo fijo 2000
  - El precio por kWh 150
  respuesta: Los kWh consumidos k
  solucion_pasos:
  - 'Paso 1: El consumo $k$ es el valor que el usuario gasta libremente.'
  - 'Paso 2: Por lo tanto, $k$ es la variable independiente.'
- titulo: 'Ejemplo 2: Geometría'
  enunciado: En la fórmula del volumen de una esfera $V(r) = \frac{4}{3}\pi r^3$, ¿cuál es la variable independiente?
  alternativas:
  - El radio r
  - El volumen V
  - La constante pi
  - La fracción 4/3
  respuesta: El radio r
  solucion_pasos:
  - 'Paso 1: El radio $r$ es la entrada que determina el volumen.'
  - 'Paso 2: $r$ es la variable independiente.'
- titulo: 'Ejemplo 3: Tabla de valores'
  enunciado: 'En una tabla con pares $(t, d)$: $(1, 20)$, $(2, 40)$, $(3, 60)$, donde $t$ es tiempo y $d$ es distancia, ¿cuál es la variable independiente?'
  alternativas:
  - El tiempo t
  - La distancia d
  - La velocidad 20
  - Ambas son independientes
  respuesta: El tiempo t
  solucion_pasos:
  - 'Paso 1: La primera columna/componente representa las entradas independientes: tiempo $t$.'
- titulo: 'Ejemplo 4: Temperatura según altitud'
  enunciado: Si $T(h) = 20 - 0.006h$ modela la temperatura según la altura $h$ en metros, ¿cuál es la variable independiente?
  alternativas:
  - La altura h
  - La temperatura T
  - La temperatura inicial 20
  - La tasa 0.006
  respuesta: La altura h
  solucion_pasos:
  - 'Paso 1: La altura $h$ es la variable de entrada de la función $T(h)$.'
errores_frecuentes:
- Invertir la relación de causalidad tomando la salida como variable independiente.
- Asignar la variable independiente al eje vertical en gráficos.
- Confundir parámetros o coeficientes fijos con variables.
afirmaciones_verdaderas:
- La variable independiente representa la entrada libre de la función dentro de su dominio.
- En el plano cartesiano se ubica por convención sobre el eje horizontal X.
al_terminar_debes_poder: '**QUÉ:** Identificar con precisión la variable independiente en funciones abstractas y contextuales.


  **CÓMO:** Distinguiendo la magnitud de entrada y causa en modelos matemáticos y ubicándola en el eje de las abscisas.


  ![Resumen La variable independiente es la magnitud de entrada cuyos valores se eligen libremente dentro del dominio de la función](/static/img/nodos/identificacion-de-la-variable-independiente-resumen.svg)'
