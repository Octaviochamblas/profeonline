semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_INDEPENDIENTE
resumen_inicial: 'Identificación de la variable independiente: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: En $y = f(x)$, tú eliges libremente el valor de $x$; el valor
  de $y$ queda determinado por esa elección. Por eso $x$ es "independiente" y $y$
  es "dependiente".
explicacion_formal: '### Definición formal


  En una función $f\colon A \to B$ expresada como $y = f(x)$, la variable $x$ recorre
  el dominio $A$ y puede tomar cualquier valor permitido en él sin depender de otra
  cantidad de la relación; es la variable independiente. El valor $y$ queda determinado
  por la elección de $x$ a través de la regla $f$.


  ### Desarrollo didáctico


  Piensa en un experimento controlado: tú decides cuánta agua le das a una planta
  ($x$, variable independiente) y observas cuánto crece ($y$, variable dependiente).
  El crecimiento no se elige directamente, resulta de la cantidad de agua.


  En una fórmula como $y = 3x + 2$, puedes sustituir cualquier valor permitido de
  $x$: $1$, $-5$, $\frac{1}{2}$, etc. Cada elección determina un único $y$ correspondiente.'
definiciones_clave: '- **Identificación de la variable independiente**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación de la variable independiente.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación de
    la variable independiente.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación de la variable
    independiente.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    identificación de la variable independiente?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en identificación de la variable independiente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en identificación de la
    variable independiente, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica cuál cantidad se elige o controla libremente en el contexto
  o la fórmula.'
- 'Paso 2: Esa cantidad, generalmente denotada $x$, es la variable independiente.'
- 'Paso 3: Verifica que su valor pertenezca al dominio permitido de la función.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación de la variable independiente.
ejemplos:
- titulo: Identificación en una fórmula
  enunciado: En $y = 5x - 2$, ¿cuál es la variable independiente?
  solucion_pasos:
  - La variable que se sustituye libremente y determina el valor de $y$ es $x$.
  - 'Variable independiente: $x$.'
- titulo: Identificación en un contexto verbal
  enunciado: Un taxi cobra según los kilómetros recorridos. ¿Cuál es la variable independiente?
  solucion_pasos:
  - El costo depende de los kilómetros recorridos, no al revés.
  - 'Variable independiente: los kilómetros recorridos.'
- titulo: ¿La variable independiente puede tomar cualquier valor del dominio sin depender
    de otra variable?
  enunciado: ¿La variable independiente puede tomar cualquier valor del dominio sin
    depender de otra variable?
  respuesta: Verdadero
  solucion_pasos:
  - Por definición, la variable independiente se elige libremente dentro del dominio
    permitido.
- titulo: ¿En $f(x)$, la letra $x$ representa la variable dependiente?
  enunciado: ¿En $f(x)$, la letra $x$ representa la variable dependiente?
  respuesta: Falso
  solucion_pasos:
  - $x$ es el argumento que se elige libremente, es decir, la variable independiente.
errores_frecuentes:
- Invertir los roles, creyendo que la variable dentro del paréntesis es la dependiente.
- Asumir que la variable independiente siempre se llama $x$, ignorando el contexto
  del problema.
- No verificar que el valor elegido para la variable independiente pertenezca al dominio.
- Confundir "independiente" con "constante", cuando en realidad puede tomar múltiples
  valores.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando identificación
  de la variable independiente.
