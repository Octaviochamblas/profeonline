semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_INDEPENDIENTE
resumen_inicial: La variable independiente (usualmente $x$) es el valor de entrada
  que se elige libremente dentro del dominio.
explicacion_simple: 'En una función $y = f(x)$, la **variable independiente** es la
  $x$.

  Se llama ''independiente'' porque podemos elegir su valor libremente dentro del
  dominio de la función, sin depender de otra variable.

  Graficamente se ubica siempre en el eje horizontal $X$.'
explicacion_formal: 'En la relación funcional $y = f(x)$ sobre $A \times B$:


  $$x \in \operatorname{Dom}(f) \quad \text{es la variable independiente}$$


  **Desglose de la fórmula:**

  - Elemento arbitrario de entrada sobre el cual la función actúa de forma autónoma.'
definiciones_clave: '- **Variable independiente ($x$)**: Magnitud cuyo valor no depende
  de ninguna otra variable en el modelo funcional.'
propiedades_relaciones: '- **Eje de abscisas**: En el plano cartesiano se representa
  sobre el eje horizontal $X$.'
ejemplo_guiado:
  enunciado: En la función de costo de combustible $C(g) = 1.100 \cdot g$, donde $C$
    es el costo en pesos y $g$ son los galones cargados, identifica la variable independiente.
  pasos:
  - 'Paso 1: Observar las variables del modelo: $C$ (costo) y $g$ (galones).Paso 2:
    Determinar cuál variable elegimos libremente: la cantidad de galones $g$.Paso
    3: Concluir que $g$ es la variable independiente (entrada).'
checkpoints:
- placement: after_explicacion_formal
  question: En el modelo funcional $C(g) = 1.100 \cdot g$, ¿cuál es la variable independiente?
  choices:
  - text: La cantidad de galones $g$.
    is_correct: true
  - text: El costo total $C$.
    is_correct: false
  - text: El precio unitario $1.100$.
    is_correct: false
  - text: La moneda de cambio.
    is_correct: false
  explanation: La alternativa correcta es 'La cantidad de galones $g$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué eje del plano cartesiano se ubica la variable independiente?
  choices:
  - text: En el eje horizontal $X$ (eje de abscisas).
    is_correct: true
  - text: En el eje vertical $Y$ (eje de ordenadas).
    is_correct: false
  - text: En la bisectriz del segundo cuadrante.
    is_correct: false
  - text: En una tabla separada.
    is_correct: false
  explanation: La alternativa correcta es 'En el eje horizontal $X$ (eje de abscisas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos magnitudes relacionadas en la función.'
- 'Paso 2: Determinar cuál variable es la causa o valor de entrada que se ajusta libremente.'
- 'Paso 3: Declararla como la variable independiente.'
errores_correccion: '- **Error común:** Confundir la variable independiente con la
  dependiente.

  - **Cómo corregirlo:** La variable independiente es la ENTRADA (la que tú eliges
  cambiar, como el tiempo o la cantidad comprada).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
