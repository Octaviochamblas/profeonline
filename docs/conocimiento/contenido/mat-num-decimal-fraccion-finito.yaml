semantic_id: MAT.NUM.DECIMAL_FRACCION.FINITO
resumen_inicial: Para convertir un decimal finito a fracción, se escribe en el numerador
  el número sin coma y en el denominador la potencia de 10 correspondiente a la cantidad
  de cifras decimales, simplificando al final.
explicacion_simple: 'Convertir un número decimal finito (exacto) a fracción es muy
  sencillo:

  1. **Numerador**: Escribes el número completo exactamente como es, pero **quitándole
  la coma** (por ejemplo, para $2.45$ escribes $245$).

  2. **Denominador**: Escribes un $1$ seguido de **tantos ceros como cifras haya a
  la derecha de la coma**. Como $2.45$ tiene $2$ cifras decimales, pones un $100$
  abajo ($\frac{245}{100}$).

  3. **Simplificación**: Simplificas la fracción hasta hacerla irreductible ($\frac{245
  \div 5}{100 \div 5} = \frac{49}{20}$).

  '
explicacion_formal: 'Formalmente, dado un número decimal finito $d = a_k \dots a_0
  , b_1 \dots b_n$ con $n \in \mathbb{N}_0$ posiciones decimales, su conversión a
  fracción racional $\frac{P}{Q} \in \mathbb{Q}$ se define por:

  $$P = a_k \dots a_0 b_1 \dots b_n = d \cdot 10^n \in \mathbb{Z}$$

  $$Q = 10^n \in \mathbb{Z}^+$$

  $\frac{P}{Q} = \frac{d \cdot 10^n}{10^n} = \frac{N}{\text{MCD}(N, 10^n)} \Big/ \frac{10^n}{\text{MCD}(N,
  10^n)}$

  donde $N = d \cdot 10^n$ es la representación entera del número sin coma.

  '
definiciones_clave: '- **Numerador entero sin coma**: Valor entero resultante de eliminar
  la coma decimal del número original ($d \cdot 10^n$).

  - **Denominador potencia de 10 ($10^n$)**: Potencia de base 10 cuyo exponente $n$
  es la cantidad de dígitos decimales del número.

  - **Irreductibilidad por simplificación**: Reducción obligatoria dividiendo numerador
  y denominador por su máximo común divisor $\text{MCD}(N, 10^n)$.

  '
propiedades_relaciones: '- **Unicidad de la fracción irreductible**: Todo decimal
  finito tiene una y solo una representación en fracción irreductible $\frac{a}{b}$.

  - **Factores del denominador simplificado**: El denominador de la fracción irreductible
  resultante solo contendrá factores primos 2 y/o 5.

  - **Identidad decimal**: $\frac{a \cdot 10^n}{10^n} = d$.

  '
ejemplo_guiado:
  enunciado: Convierte el decimal finito $3.625$ a fracción irreductible detallando
    el armado del numerador, denominador y simplificación posicional.
  pasos:
  - 'Identificar la cantidad de cifras decimales: $3.625$ posee $3$ cifras a la derecha
    de la coma ($n = 3$).'
  - 'Construir el numerador sin coma: $3625$.'
  - 'Construir el denominador con $3$ ceros: $10^3 = 1000$.'
  - 'Formar la fracción decimal: $\frac{3625}{1000}$.'
  - 'Simplificar dividiendo numerador y denominador entre el $\text{MCD}(3625, 1000)
    = 125$:'
  - '   $\frac{3625 \div 125}{1000 \div 125} = \frac{29}{8}$.'
  - 'Concluir: $3.625 = \frac{29}{8}$ en forma irreductible.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se determina el denominador de la fracción equivalente a un número
    decimal finito de $n$ decimales antes de simplificar?
  choices:
  - text: Colocando un 1 seguido de $n$ ceros ($10^n$).
    is_correct: true
  - text: Colocando una cadena de $n$ nueves.
    is_correct: false
  - text: Escribiendo la cantidad de decimales en el denominador.
    is_correct: false
  - text: Multiplicando la parte entera por 10.
    is_correct: false
  explanation: 'La correcta es Colocando un 1 seguido de $n$ ceros ($10^n$).: por
    definición de notación posicional en base 10.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la fracción irreductible equivalente a $0.8$?
  choices:
  - text: \$\frac{4}{5}$
    is_correct: true
  - text: \$\frac{8}{10}$
    is_correct: false
  - text: \$\frac{8}{9}$
    is_correct: false
  - text: \$\frac{4}{9}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{4}{5}$. La correcta es$ \frac{4}{5}$:
    $\frac{8}{10} = \frac{8 \div 2}{10 \div 2} = \frac{4}{5}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Contar el número de dígitos $n$ que están a la derecha de la coma decimal.'
- 'Paso 2: Formar el numerador escribiendo todo el número sin la coma decimal.'
- 'Paso 3: Formar el denominador escribiendo el número $1$ seguido de $n$ ceros ($10^n$).'
- 'Paso 4: Calcular el máximo común divisor ($\text{MCD}$) entre el numerador y el
  denominador.'
- 'Paso 5: Dividir ambos términos entre dicho $\text{MCD}$ para obtener la fracción
  irreductible final.'
errores_correccion: 'Un error clásico es poner en el denominador el número de decimales
  en vez de la potencia de 10 (por ejemplo para $0.4$, poner $\frac{4}{1}$ en lugar
  de $\frac{4}{10}$). **Cada cifra decimal agrega un CERO al 1 en el denominador**
  ($10, 100, 1000$).

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierte $0.75$ a fracción irreductible.
  alternativas:
  - \$\frac{3}{4}$
  - \$\frac{75}{100}$
  - \$\frac{3}{5}$
  respuesta: \$\frac{3}{4}$
  solucion_pasos:
  - 'Numerador: $75$. Denominador: $100$ ($2$ decimales).'
  - 'Fracción: $\frac{75}{100}$.'
  - 'Simplificar entre $25$: $\frac{75 \div 25}{100 \div 25} = \frac{3}{4}$.'
- titulo: Ejemplo 2
  enunciado: Convierte $1.5$ a fracción irreductible.
  alternativas:
  - \$\frac{3}{2}$
  - \$\frac{15}{10}$
  - \$\frac{5}{2}$
  respuesta: \$\frac{3}{2}$
  solucion_pasos:
  - 'Numerador: $15$. Denominador: $10$.'
  - 'Fracción: $\frac{15}{10}$.'
  - 'Simplificar entre $5$: $\frac{15 \div 5}{10 \div 5} = \frac{3}{2}$.'
- titulo: ¿Se puede convertir el decimal $0.004$ a fracción irreductible?
  respuesta: Sí, es \$\frac{1}{250}$.
  solucion_pasos:
  - $\frac{4}{1000} = \frac{4 \div 4}{1000 \div 4} = \frac{1}{250}$.
- titulo: ¿Cambia la fracción irreductible si se agregan ceros al final del decimal
    (como $0.5$ y $0.50$)?
  respuesta: 'No'
  solucion_pasos:
  - No, $\frac{5}{10} = \frac{1}{2}$ y $\frac{50}{100} = \frac{1}{2}$.
errores_frecuentes:
- Olvidar simplificar la fracción resultante.
- Colocar nueves en el denominador en lugar de potencias de 10.
- Contar la parte entera como un dígito decimal más.
- Conservar los ceros a la izquierda en el numerador (escribir $075$ en vez de $75$).
- Dividir el numerador por 10 en lugar del denominador.
afirmaciones_verdaderas:
- Para convertir un decimal finito a fracción se coloca como denominador una potencia
  de 10 según sus decimales.
- Toda fracción equivalente a un decimal finito se reduce a una forma irreductible
  cuyo denominador solo contiene primos 2 y 5.
al_terminar_debes_ponder: 'Debes ser capaz de transformar cualquier decimal finito
  a su correspondiente fracción irreductible expresando el denominador en potencias
  de 10 y simplificando.

  '
fuente: Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números
  racionales.
