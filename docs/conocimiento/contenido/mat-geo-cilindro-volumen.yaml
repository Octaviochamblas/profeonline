semantic_id: MAT.GEO.CUERPOS_REDONDOS_METRICA.CILINDRO_VOLUMEN
resumen_inicial: 'Cálculo del volumen del cilindro: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'El volumen de un cilindro se obtiene igual que el de un prisma:
  multiplicando el área de la base (un círculo) por la altura.'
explicacion_formal: '![Volumen del cilindro](/static/img/geometria/espacio-cuerpos/cilindro-volumen.svg)


  ### Definición formal


  El volumen de un cilindro es el producto entre el área de su base circular ($\pi
  r^2$) y su altura ($h$): $V=\pi r^2 h$.


  ### Desarrollo didáctico


  Si un cilindro tiene radio 4 cm y altura 10 cm, su volumen es $V=\pi(4)^2(10)=160\pi\approx502,4$
  cm³ (usando π≈3,14).'
