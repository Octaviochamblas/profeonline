semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ESCALENO
resumen_inicial: 'Análisis didáctico y formal de Triángulo escaleno como triángulo
  de tres lados de distinta medida: propiedades geométricas, ángulos y clasificación
  en polígonos planos.'
explicacion_simple: Al estudiar triángulo escaleno como triángulo de tres lados de
  distinta medida, observamos cómo se comportan sus lados y ángulos para resolver
  problemas prácticos en el plano.
explicacion_formal: En la teoría geométrica de triángulo escaleno como triángulo de
  tres lados de distinta medida, se aplican teoremas euclidianos para calcular magnitudes
  angulares y de longitud exactas.
definiciones_clave: '- **Triángulo escaleno como triángulo de tres lados de distinta
  medida**: Concepto fundamental en la clasificación y propiedades de los triángulos.'
propiedades_relaciones: '- **Relación interna**: Los elementos del triángulo satisfacen
  la suma de ángulos de $180^\circ$.

  - **Criterio geométrico**: Permite clasificar la figura según lados o ángulos.'
ejemplo_guiado:
  enunciado: En un problema de triángulo escaleno como triángulo de tres lados de
    distinta medida, dos ángulos interiores miden $52^\circ$ y $81^\circ$. Calcula
    el tercer ángulo interior $x$.
  pasos:
  - 'Paso 1: Aplicar la suma de ángulos interiores igual a $180^\circ$: $52^\circ
    + 81^\circ + x = 180^\circ$.'
  - 'Paso 2: Sumar las medidas dadas: $133^\circ + x = 180^\circ$.'
  - 'Paso 3: Restar a $180^\circ$: $x = 180^\circ - 133^\circ = 47^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio central en el estudio de triángulo escaleno como
    triángulo de tres lados de distinta medida?
  choices:
  - text: Relacionar sus lados y ángulos mediante teoremas geométricos congruentes
    is_correct: true
  - text: Asumir que todos sus ángulos miden 90 grados siempre
    is_correct: false
  - text: Considerar que no posee vértices ni lados
    is_correct: false
  - text: Multiplicar los lados por 100
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar sus lados y ángulos mediante
    teoremas geométricos congruentes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en triángulo escaleno como triángulo de tres lados de distinta medida
    dos ángulos miden 52° y 81°, ¿cuánto mide el tercer ángulo x?
  choices:
  - text: 47°
    is_correct: true
  - text: 133°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 180°
    is_correct: false
  explanation: La alternativa correcta es '47°', por la suma de $180^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 52° y 81°, ¿cuánto mide
    el tercero?
  alternativas:
  - 47°
  - 133°
  - 90°
  respuesta: 47°
  solucion_pasos:
  - Despejar $x = 180 - (52 + 81) = 47^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 43 cm y 59 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 100 cm
  - 107 cm
  - 0 cm
  respuesta: 100 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 102 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de triángulo escaleno como triángulo de tres lados de distinta medida
  resolviendo problemas geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
