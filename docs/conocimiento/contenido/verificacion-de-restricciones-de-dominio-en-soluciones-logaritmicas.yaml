semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.VERIFICACION_RESTRICCIONES
resumen_inicial: La verificación de restricciones de dominio en soluciones logarítmicas constituye la etapa final de control analítico, donde se evalúan todas las soluciones algebraicas en los argumentos originales para descartar raíces extrañas que produzcan $\log(0)$ o $\log(\text{negativo})$.
explicacion_simple: "![La verificación de restricciones de dominio en soluciones logarítmicas constituye la etapa final de control analítico, donde se evalúan todas las soluciones algebraicas en los argumentos originales para descartar raíces extrañas que produzcan $\\log(0)$ o $\\log(\\text{negativo})$](/static/img/nodos/verificacion-de-restricciones-de-dominio-en-soluciones-logaritmicas-intro.svg)\n\n\nEn las ecuaciones logarítmicas ocurre una trampa matemática muy común: **las propiedades pueden crear \"soluciones falsas\" (llamadas soluciones extrañas)**.\n\n- **¿Por qué ocurre esto?**\n  - Al usar propiedades como $\\log(a) + \\log(b) = \\log(a \\cdot b)$, juntas dos números. Pero $(-2) \\cdot (-4) = +8$, ¡y la ecuación de potencias cree que es válida aunque $\\log(-2)$ no existe!\n- **La regla obligatoria de oro:**\n  - **NUNCA entregues una solución de una ecuación logarítmica sin probarla antes en la ecuación original**.\n  - Si al reemplazar $x$, algún argumento da **cero o negativo**,\
  \ ¡esa solución **SE DESCARTA INMEDIATAMENTE**!"
explicacion_formal: 'Sea una ecuación logarítmica compuesta $E(x): \sum_{i=1}^n \log_b(g_i(x)) = c$. El **dominio de validez formal** de la ecuación es la intersección de las condiciones de existencia individuales:

  $$\mathcal{D}_E = \bigcap_{i=1}^n \{x \in \mathbb{R} \mid g_i(x) > 0\}$$

  Al transformar $E(x)$ algebraicamente mediante leyes multiplicativas $\log_b\left(\prod g_i(x)\right) = c$, se resuelve la ecuación polinómica asociada $P(x) = 0$ con conjunto de raíces algebraicas $\mathcal{S}_{\text{alg}}$.


  **Conjunto solución real efectivo**:

  $$\mathcal{S}_{\text{real}} = \mathcal{S}_{\text{alg}} \cap \mathcal{D}_E$$

  Todo elemento $x^* \in \mathcal{S}_{\text{alg}} \setminus \mathcal{D}_E$ constituye una **raíz extraña no válida** generada por la extensión espuria del dominio en el producto de signos $(-)(-)=+$.'
definiciones_clave: '- **Solución extraña / espuria**: Raíz algebraica que satisface la ecuación simplificada pero viola el dominio original.

  - **Dominio de consistencia**: Intersección de todos los intervalos abiertos donde cada argumento es estrictamente mayor que cero.'
propiedades_relaciones: '- **Prueba de validez obligatoria**: Una solución $x$ es válida si y solo si hace estrictamente positivo a cada uno de los argumentos iniciales.

  - **Positividad del argumento vs signo de $x$**: Un $x$ negativo puede ser solución válida si el argumento contiene $-x$ (ej: en $\log(5 - x)$, si $x = -3$, $5 - (-3) = 8 > 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La verificación de restricciones de dominio en soluciones logarítmicas constituye la etapa final de control analítico, donde se evalúan todas las soluciones algebraicas en los argumentos originales para descartar raíces extrañas que produzcan $\log(0)$ o $\log(\text{negativo})$](/static/img/nodos/verificacion-de-restricciones-de-dominio-en-soluciones-logaritmicas-ejemplos.svg)



    Resuelve la ecuación logarítmica y realiza la verificación rigurosa de soluciones extrañas:

    $$\log_2(x) + \log_2(x - 2) = 3$$'
  pasos:
  - 'Paso 1: Determinar el dominio de consistencia inicial:

    - $x > 0$ y $x - 2 > 0 \implies x > 2$.

    - **Dominio admisible: $]2, +\infty[$**.'
  - 'Paso 2: Aplicar la propiedad del producto:

    $\log_2(x(x - 2)) = 3$.'
  - 'Paso 3: Pasar a forma exponencial y resolver:

    $x(x - 2) = 2^3 = 8 \implies x^2 - 2x - 8 = 0$.

    Factorizar: $(x - 4)(x + 2) = 0 \implies x_1 = 4, \quad x_2 = -2$.'
  - 'Paso 4: Verificación estricta de las soluciones:

    - **Para $x_1 = 4$**: $\log_2(4) + \log_2(2) = 2 + 1 = 3$ (Argumentos $4 > 0$ y $2 > 0$ $\implies$ **VÁLIDA**).

    - **Para $x_2 = -2$**: Produce $\log_2(-2)$, que no existe en $\mathbb{R}$ $\implies$ **SE DESCARTA (Extraña)**.'
  - 'Paso 5: Conclusión final: La única solución real es **$\mathbf{x = 4}$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la solución algebraicamente obtenida x = -3 se debe descartar en $\log_5(x) + \log_5(x + 8) = 1$?
  choices:
  - text: Porque genera log₅(-3), y los números negativos no tienen logaritmo real
    is_correct: true
  - text: Porque -3 es impar
    is_correct: false
  - text: Porque 5 no es divisible por 3
    is_correct: false
  - text: Porque -3 + 8 = 5
    is_correct: false
  explanation: La alternativa correcta es 'Porque genera log₅(-3), y los números negativos no tienen logaritmo real'. Toda solución que anule o vuelva negativo un argumento original debe ser descartada.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $\log(6 - x) = 1$, si se obtiene x = -4, ¿es una solución válida?
  choices:
  - text: Sí, porque al reemplazar x = -4 el argumento resulta 6 - (-4) = 10 > 0
    is_correct: true
  - text: No, porque x es negativo
    is_correct: false
  - text: No, porque debe dar 1
    is_correct: false
  - text: Solo si la base es par
    is_correct: false
  explanation: La alternativa correcta es 'Sí, porque al reemplazar x = -4 el argumento resulta 6 - (-4) = 10 > 0'. Lo que debe ser positivo es el argumento completo, no necesariamente el signo aislado de x.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las restricciones de positividad $g_i(x) > 0$ para todos los argumentos iniciales.'
- 'Paso 2: Resolver algebraicamente la ecuación aplicando propiedades y definición exponencial.'
- 'Paso 3: Evaluar cada valor hallado en los argumentos originales de la ecuación.'
- 'Paso 4: Descartar las soluciones extrañas y declarar el conjunto solución real definitivo.'
errores_correccion: '- **Error común:** Descartar automáticamente una solución solo porque es negativa, sin evaluar el argumento completo.

  - **Cómo corregirlo:** Evalúa **todo el argumento con la solución**: si da un número **mayor que cero**, ¡la solución **SÍ ES VÁLIDA**!'
ejemplos:
- titulo: 'Ejemplo 1: Descarte de raíz negativa'
  enunciado: En $\log(x) + \log(x - 3) = 1$, las raíces algebraicas son $x = 5$ y $x = -2$. ¿Cuál es la solución real?
  alternativas:
  - Solo x = 5
  - 'Ambas: x = 5 y x = -2'
  - Solo x = -2
  - No tiene solución
  respuesta: Solo x = 5
  solucion_pasos:
  - 'Paso 1: $x = -2$ genera $\log(-2) \implies$ extraña. Solo $x = 5$ es válida.'
- titulo: 'Ejemplo 2: Solución negativa válida'
  enunciado: En $\log_2(8 - x) = 4$, la solución es $x = -8$. ¿Es válida?
  alternativas:
  - Sí, porque 8 - (-8) = 16 > 0
  - No, x no puede ser negativo
  - No, da 0
  - Solo si x > 0
  respuesta: Sí, porque 8 - (-8) = 16 > 0
  solucion_pasos:
  - 'Paso 1: $8 - (-8) = 16 > 0$ y $\log_2(16) = 4 \implies$ válida.'
- titulo: 'Ejemplo 3: Ecuación sin soluciones reales'
  enunciado: 'Si todas las raíces algebraicas de una ecuación logarítmica hacen negativos los argumentos, el conjunto solución es:'
  alternativas:
  - Vacío (conjunto vacío ∅)
  - Todos los reales
  - Los números positivos
  - El número cero
  respuesta: Vacío (conjunto vacío ∅)
  solucion_pasos:
  - 'Paso 1: Al descartarse todas las raíces extrañas, la ecuación carece de solución real.'
- titulo: 'Ejemplo 4: Argumento cuadrático con dos soluciones válidas'
  enunciado: En $\log(x^2) = 4$, las soluciones son $x = 100$ y $x = -100$. ¿Son válidas?
  alternativas:
  - Ambas son válidas porque (±100)² = 10.000 > 0
  - Solo x = 100
  - Solo x = -100
  - Ninguna
  respuesta: Ambas son válidas porque (±100)² = 10.000 > 0
  solucion_pasos:
  - 'Paso 1: Ambas producen un argumento estrictamente positivo $10.000 > 0$.'
errores_frecuentes:
- Aceptar raíces extrañas que provienen de multiplicar dos expresiones negativas.
- Descartar soluciones negativas sin evaluar si el argumento resultante es positivo.
- No verificar las soluciones en la ecuación original antes de aplicar propiedades.
afirmaciones_verdaderas:
- Toda solución de una ecuación logarítmica debe hacer estrictamente positivos a todos los argumentos originales.
- Las soluciones extrañas son descartadas formalmente por violar el dominio admisible de los logaritmos reales.
al_terminar_debes_poder: '**QUÉ:** Verificar restricciones de dominio y descartar soluciones extrañas en ecuaciones logarítmicas.


  **CÓMO:** Sustituyendo las soluciones algebraicas en los argumentos originales para asegurar que sean estrictamente mayores que cero.


