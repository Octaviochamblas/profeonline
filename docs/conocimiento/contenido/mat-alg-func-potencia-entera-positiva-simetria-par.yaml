procedimiento:
- 'Paso 1: Calcula $f(-x)$ reemplazando $x$ por $-x$ en la expresión de la función.'
- 'Paso 2: Simplifica la expresión usando que $(-x)^n=x^n$ para $n$ par.'
- 'Paso 3: Verifica que $f(-x)=f(x)$ para confirmar que la función es par.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en identificación de simetría respecto del eje y en exponentes pares.
ejemplos:
- titulo: Verificación algebraica de simetría par
  enunciado: Verifica que $f(x)=5x^2$ es una función par.
  solucion_pasos:
  - Se calcula $f(-x)=5(-x)^2=5x^2$.
  - Como $f(-x)=f(x)$, la función es par.
- titulo: Verificación numérica de simetría par
  enunciado: Verifica numéricamente que $f(x)=x^6$ es par evaluando en $x=2$ y $x=-2$.
  solucion_pasos:
  - $f(2)=64$ y $f(-2)=64$.
  - Ambos valores coinciden, confirmando la simetría par.
- titulo: ¿Toda función $f(x)=a\cdot x^n$ con $n$ par es una función par?
  enunciado: ¿Toda función potencia con exponente entero positivo par cumple $f(-x)=f(x)$?
  respuesta: Sí
  solucion_pasos:
  - Se cumple para cualquier valor del coeficiente $a$, siempre que $n$ sea par.
- titulo: ¿El coeficiente $a$ afecta si la función es par o impar?
  enunciado: ¿Cambiar el valor del coeficiente $a$ altera si la función es par o impar?
  respuesta: 'No'
  solucion_pasos:
  - La paridad de la función depende exclusivamente del exponente $n$, no del coeficiente
    $a$.
errores_frecuentes:
- Confundir "función par" con "número par", perdiendo de vista que se trata de una
  propiedad de simetría.
- Verificar la simetría solo con un ejemplo numérico, sin la demostración algebraica
  general.
- Suponer que el coeficiente $a$ influye en si la función es par o impar.
- Olvidar aplicar correctamente la regla $(-x)^n=x^n$ para exponentes pares.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  identificación de simetría respecto del eje y en exponentes pares.
