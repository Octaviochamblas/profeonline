semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.SIMETRIA_PAR
resumen_inicial: 'Identificación de simetría respecto del eje Y en exponentes pares:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento con
  exponente entero positivo.'
explicacion_simple: Una función es par cuando su gráfica se ve exactamente igual a
  ambos lados del eje $y$, como un reflejo especular.
explicacion_formal: '### Definición formal


  Una función $f$ es par si $f(-x)=f(x)$ para todo $x$ del dominio. Para $f(x)=a\cdot
  x^n$ con $n$ par, $f(-x)=a\cdot(-x)^n=a\cdot x^n=f(x)$, ya que una potencia par
  de un número negativo da el mismo resultado que la potencia del número positivo.


  ### Desarrollo didáctico


  Con $f(x)=2x^4$: $f(-3)=2\cdot(-3)^4=2\cdot81=162$ y $f(3)=2\cdot3^4=162$. Ambos
  valores coinciden, confirmando que la función es par y su gráfica es simétrica respecto
  al eje $y$.'
definiciones_clave: '- **Identificación de simetría respecto del eje Y en exponentes
  pares**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a identificación de simetría respecto del eje y en exponentes
  pares.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de identificación de simetría respecto del eje y en exponentes pares.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de identificación de simetría
    respecto del eje y en exponentes pares.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
