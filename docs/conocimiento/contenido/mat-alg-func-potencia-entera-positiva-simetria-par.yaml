semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.SIMETRIA_PAR
resumen_inicial: 'Las funciones potencia de exponente entero par positivo satisfacen la propiedad de función par $f(-x) = f(x)$, generando simetría axial respecto al eje $y$.'
explicacion_simple: |
  Una función es par si al reemplazar la variable $x$ por su versión negativa $-x$, el resultado final no cambia en absoluto. En las funciones potencia de exponente par (como $x^2, x^4, x^6$), cualquier número negativo elevado a un número par se convierte en positivo ($(-3)^4 = 81 = 3^4$). Por esta razón, la mitad izquierda de la gráfica es la imagen en espejo exacta de la mitad derecha, reflejada a través del eje vertical $y$.
explicacion_formal: |
  ### Definición formal
  La **simetría axial de función par** en la familia de funciones potencia $f(x) = a x^n$ con $n = 2k (k \in \mathbb{Z}^+)$ se demuestra algebraicamente mediante la invariancia por inversión del signo de la variable independiente:
  $$\forall x \in \mathbb{R}: \quad f(-x) = a(-x)^{2k} = a [(-1) \cdot x]^{2k} = a (-1)^{2k} x^{2k} = a (1) x^{2k} = f(x)$$

  ### Desglose geométrico
  - Eje de simetría cartesiano: Recta vertical de ecuación $x = 0$ (eje $y$).
  - Mapeo de puntos reflejados: Para todo par cartesiano $(u, v) \in \operatorname{Graf}(f)$, el par con abscisa opuesta $(-u, v)$ pertenece obligatoriamente a $\operatorname{Graf}(f)$.
  - Distancia al eje $y$: El segmento que une $(u, v)$ con $(-u, v)$ es horizontal, perpendicular al eje $y$, y su punto medio yace exactamente sobre la recta $x = 0$.

  ### Síntesis didáctica
  Identificación rápida de paridad: Si el exponente de la variable en una función potencia es par ($2, 4, 6, 8\dots$), la función es **matemáticamente par** y su gráfica es **simétrica respecto al eje $y$**.
definiciones_clave: |
  - **Función par $f(-x) = f(x)$**: Propiedad algebraica que garantiza la conservación de valores al invertir el signo de la entrada.
  - **Simetría axial (Eje $y$)**: Invariancia gráfica por reflexión especular respecto a la recta vertical $x = 0$.
  - **Pares simétricos $(u, v) \longleftrightarrow (-u, v)$**: Puntos de igual altura $y$ ubicados a igual distancia del eje vertical.
propiedades_relaciones: |
  - **Falta de inyectividad global**: Toda función par no trivial es no inyectiva en $\mathbb{R}$, ya que distintas entradas ($u \neq -u$) producen la misma salida ($f(u) = f(-u)$).
  - **Invariancia por el signo de $a$**: Multiplicar por un coeficiente positivo o negativo $a \neq 0$ conserva intacta la simetría respecto al eje $y$.
ejemplo_guiado:
  enunciado: 'Demuestra algebraicamente la simetría respecto al eje $y$ de la función potencia $f(x) = -5x^4$ evaluando $f(-x)$, y verifica la propiedad con el par de abscisas $x = 2$ y $x = -2$.'
  pasos:
    - 'Paso 1: Demostración algebraica: $f(-x) = -5(-x)^4 = -5 [(-1)^4 x^4] = -5 (1) x^4 = -5x^4 = f(x)$. Demostrado que es par.'
    - 'Paso 2: Evaluamos en $x = 2$: $f(2) = -5(2)^4 = -5(16) = -80$. Punto: $(2, -80)$.'
    - 'Paso 3: Evaluamos en $x = -2$: $f(-2) = -5(-2)^4 = -5(16) = -80$. Punto: $(-2, -80)$.'
    - 'Paso 4: Conclusión: $f(-2) = f(2) = -80$, confirmando que los puntos $(2, -80)$ y $(-2, -80)$ son reflejos exactos a través del eje $y$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad algebraica define a una función potencia de exponente par como $f(x) = 4x^6$ como una función par simétrica respecto al eje $y$?'
    choices:
      - {text: 'La igualdad $f(-x) = f(x)$ para todo $x \in \mathbb{R}$', is_correct: true}
      - {text: 'La igualdad $f(-x) = -f(x)$ para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: 'La propiedad $f(0) = 4$', is_correct: false}
      - {text: 'Que su gráfica sea una recta creciente', is_correct: false}
    explanation: 'La alternativa correcta es ''La igualdad $f(-x) = f(x)$ para todo $x \in \mathbb{R}$''. Esta relación de invariancia por signo define formalmente a las funciones pares.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto $(-3, 18)$ pertenece a la gráfica de la función potencia par $f(x) = 2x^2$, ¿qué otro punto pertenece obligatoriamente a la gráfica por simetría respecto al eje $y$?'
    choices:
      - {text: 'El punto de coordenadas $(3, 18)$', is_correct: true}
      - {text: 'El punto de coordenadas $(3, -18)$', is_correct: false}
      - {text: 'El punto de coordenadas $(-3, -18)$', is_correct: false}
      - {text: 'El punto de coordenadas $(0, 18)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(3, 18)$''. La simetría respecto al eje $y$ conserva la ordenada $y = 18$ e invierte el signo de la abscisa de $-3$ a $+3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sustituir la variable $x$ por $(-x)$ en la fórmula de la función potencia.'
  - 'Paso 2: Utilizar la propiedad de los exponentes pares $(-1)^{2k} = 1$ para simplificar la expresión.'
  - 'Paso 3: Verificar que $f(-x) = f(x)$.'
  - 'Paso 4: Concluir que la función es par y que su gráfica es especularmente simétrica respecto a la recta vertical $x = 0$ (eje $y$).'
errores_correccion: |
  - **Error 1:** Afirmar que el coeficiente negativo en $f(x) = -x^2$ destruye la simetría par. **Cómo corregirlo:** El signo del coeficiente $a$ multiplica a la salida completa $y$, pero $f(-x) = -(-x)^2 = -x^2 = f(x)$ mantiene la simetría especular respecto al eje $y$.
  - **Error 2:** Confundir la simetría del eje $y$ (par) con la simetría del origen (impar). **Cómo corregirlo:** La simetría del eje $y$ mantiene el mismo signo en la salida $y$ para entradas opuestas ($f(-x) = f(x)$). La del origen le cambia el signo a la salida ($f(-x) = -f(x)$).
ejemplos:
  - titulo: 'Demostración de paridad en exponente 8'
    enunciado: '¿La función $f(x) = 3x^8$ es una función par?'
    alternativas:
      - 'Sí, porque $f(-x) = 3(-x)^8 = 3x^8 = f(x)$'
      - 'No, es impar'
      - 'No tiene paridad'
    respuesta: 'Sí, porque $f(-x) = 3(-x)^8 = 3x^8 = f(x)$'
    solucion_pasos:
      - '1. Evaluamos $f(-x) = 3(-x)^8$.'
      - '2. Como 8 es par, $(-1)^8 = 1 \implies f(-x) = 3x^8 = f(x)$, siendo una función par.'
  - titulo: 'Puntos reflejados por el eje y'
    enunciado: 'Si $f(5) = 100$ en la función par $f(x) = 4x^2$, ¿$f(-5) = 100$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por simetría axial respecto al eje $y$, entradas opuestas entregan la misma altura $y = 100$.'
  - titulo: 'Falta de inyectividad por simetría'
    enunciado: '¿La simetría respecto al eje $y$ impide que $f(x) = x^4$ sea inyectiva en todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dos entradas distintas ($2 \neq -2$) comparten la misma salida ($16 = 16$), rompiendo la inyectividad.'
  - titulo: 'Eje de simetría inalterado por el coeficiente'
    enunciado: '¿Las funciones $f(x) = 10x^2$ y $g(x) = -0.5x^2$ comparten la recta $x = 0$ como eje de simetría?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Toda función potencia de exponente par no trasladada tiene como eje de simetría al eje $y$ ($x = 0$).'
errores_frecuentes:
  - 'Una función potencia de exponente par como $f(x) = x^2$ satisface $f(-x) = -f(x)$.'
  - 'El coeficiente negativo en $f(x) = -3x^4$ desplaza el eje de simetría fuera del eje $y$.'
  - 'La simetría respecto al eje $y$ permite que las funciones potencia de exponente par sean inyectivas en $\mathbb{R}$.'
  - 'Evaluar $x = -2$ en $f(x) = x^6$ da como resultado un número negativo.'
  - 'La simetría axial exige que la función pase por el punto $(1, 0)$.'
afirmaciones_verdaderas:
  - 'Todas las funciones potencia de exponente entero par positivo satisfacen la identidad $f(-x) = f(x)$, lo que se traduce geométricamente en una simetría especular respecto al eje $y$.'
  - 'La simetría respecto al eje $y$ implica que si la curva pasa por el punto $(u, v)$, debe pasar obligatoriamente por su reflejo $(-u, v)$.'
al_terminar_debes_poder: |
  QUÉ: Demostrar la simetría axial respecto al eje Y en funciones potencia de exponente par positivo.
  CÓMO: Comprobar la propiedad de función par $f(-x) = f(x)$, igualando las imágenes de entradas opuestas.
