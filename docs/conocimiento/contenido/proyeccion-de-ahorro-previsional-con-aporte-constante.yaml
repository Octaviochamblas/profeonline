semantic_id: MAT.NUM.FINANZAS_PERSONALES.PROYECCION_PREVISIONAL
resumen_inicial: 'La proyección de ahorro previsional modela el fondo acumulado para jubilación con aportes periódicos constantes $R$ y rentabilidad compuesta $i$: $M_{\text{Fondo}} = R \cdot \frac{(1 + i)^N - 1}{i}$.'
explicacion_simple: |
  Tu pensión futura depende de dos factores decisivos:
  1. La cantidad de dinero que aportas mes a mes (tu $10\%$ obligatorio más cualquier Ahorro Previsional Voluntario - APV).
  2. La **rentabilidad del interés compuesto** a lo largo de 30 o 40 años de trabajo.
  Gracias a la capitalización en el largo plazo, más de la mitad del dinero con el que te jubilas no proviene de tu bolsillo, sino de los **intereses generados por tus ahorros de los primeros años**.

  ![Proyección de ahorro previsional con aporte constante](/static/img/nodos/proyeccion-de-ahorro-previsional-con-aporte-constante-intro.svg)
explicacion_formal: |
  ### Definición formal
  El fondo total previsional acumulado $M_{\text{Fondo}}$ al cabo de $N$ meses de cotización con un aporte mensual constante $R$ y una tasa de rentabilidad real periódica $i$ se modela mediante la suma de la progresión geométrica de anualidades:
  $$M_{\text{Fondo}} = R \cdot \left[\frac{(1 + i)^N - 1}{i}\right]$$
  donde:
  - $R = S_{\text{imp}} \cdot 0,10 + \text{APV}$ es el **aporte mensual constante**.
  - $i$ es la **tasa de rentabilidad real mensual de los multifondos**.
  - $N = 12 \cdot \text{años de cotización}$ es el **número total de meses cotizados**.

  ### Composición del Fondo de Jubilación
  - **Aporte propio acumulado ($A_{\text{propio}}$)**: $A_{\text{propio}} = N \cdot R$.
  - **Ganancia por rentabilidad ($I_{\text{ganado}}$)**: $I_{\text{ganado}} = M_{\text{Fondo}} - N \cdot R$.

  ### Efecto de la Cotización Temprana
  Una cuota $R$ aportada en el mes 1 capitaliza durante $N$ períodos ($(1+i)^N$), multiplicando su valor exponencialmente frente a una cuota aportada en los últimos años de vida laboral.

  ### Síntesis didáctica
  - Ecuación del fondo: $M_{\text{Fondo}} = R \cdot \frac{(1 + i)^N - 1}{i}$.
  - Ganancia por intereses: $I = M_{\text{Fondo}} - N \cdot R$.
definiciones_clave: |
  - **Fondo de Pensión Acumulado**: Masa total de capital acumulada en la cuenta individual al momento del retiro laboral.
  - **Ahorro Previsional Voluntario (APV)**: Mecanismo de ahorro adicional con incentivos tributarios para incrementar el fondo de jubilación.
  - **Densidad de cotización**: Porcentaje del tiempo en edad de trabajar en que la persona efectivamente realizó aportes a su fondo.
propiedades_relaciones: |
  - **Multiplicador del tiempo**: En horizontes de 35 años al $5\%$ real anual, los intereses acumulados representan entre el $60\%$ y el $70\%$ del fondo total final.
  - **Impacto de las lagunas previsionales**: Dejar de cotizar en los primeros años de juventud tiene un costo de oportunidad exponencial mucho mayor que en la etapa previa al retiro.
ejemplo_guiado:
  enunciado: 'Un afiliado realiza un aporte constante anual de $\$500.000$ a su fondo previsional a una tasa de rentabilidad anual compuesta del $5\%$ durante $3$ años. Calcula el fondo total acumulado y la ganancia por rentabilidad.'
  imagen: '/static/img/nodos/proyeccion-de-ahorro-previsional-con-aporte-constante-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $R = 500.000$, $i = 0,05$ y $N = 3\text{ años}$.'
    - 'Paso 2: Evaluamos el factor de anualidad: $\frac{(1,05)^3 - 1}{0,05} = \frac{1,157625 - 1}{0,05} = \frac{0,157625}{0,05} = 3,1525$.'
    - 'Paso 3: Multiplicamos por el aporte: $M_{\text{Fondo}} = 500.000 \cdot 3,1525 = $\$1.576.25$0$.'
    - 'Paso 4: Calculamos los intereses: Aporte propio $= 3 \cdot 500.000 = $\$1.500.000$ \implies I = 1.576.250 - 1.500.000 = $\$76.25$0$. El fondo acumulado es **$\$1.576.250$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para modelar la proyección de un fondo previsional con aporte periódico constante $R$ y rentabilidad compuesta $i$?'
    choices:
      - {text: 'Multiplicar el aporte por el factor de capitalización de anualidades ($M_{\text{Fondo}} = R \cdot \frac{(1+i)^N - 1}{i}$)', is_correct: true}
      - {text: 'Multiplicar el aporte linealmente por el número de meses sin interés ($M = N \cdot R$)', is_correct: false}
      - {text: 'Dividir el aporte entre la tasa de interés únicamente', is_correct: false}
      - {text: 'Elevar el aporte a la potencia de los años cotizados', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar el aporte por el factor de capitalización de anualidades ($M_{\text{Fondo}} = R \cdot \frac{(1+i)^N - 1}{i}$)''. Modela la suma acumulada de cuotas uniformes con capitalización compuesta.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un trabajador ahorra $\$100.000$ mensuales durante 2 años ($24$ meses) y reúne un fondo de $\$2.600.000$, ¿cuánto dinero ganó por rentabilidad?'
    choices:
      - {text: '$\$200.000$, restando $2.600.000 - (24 \cdot 100.000) = 2.600.000 - 2.400.000 = 200.000$', is_correct: true}
      - {text: '$\$2.600.000$, considerando todo el fondo', is_correct: false}
      - {text: '$\$2.400.000$, correspondiente solo a los aportes', is_correct: false}
      - {text: '$\$100.000$, igual a una cuota', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$200.000$, restando $2.600.000 - (24 \cdot 100.000) = 2.600.000 - 2.400.000 = 200.000$''. Representa el interés devengado.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar el aporte periódico constante $R$ y el número total de períodos de cotización $N$.'
  - 'Paso 2: Convertir la tasa de rentabilidad real a la periodicidad del aporte (tasa periódica $i$).'
  - 'Paso 3: Calcular el factor de acumulación de anualidad $\frac{(1 + i)^N - 1}{i}$.'
  - 'Paso 4: Multiplicar el aporte $R$ por el factor para determinar el fondo previsional proyectado $M_{\text{Fondo}}$ y deducir los intereses generados.'
errores_correccion: |
  - **Error 1:** Proyectar el fondo de jubilación multiplicando simplemente el aporte por los años trabajados ($N \cdot R$). **Cómo corregirlo:** La rentabilidad compuesta **multiplica los aportes a lo largo del tiempo**: **$M_{\text{Fondo}} = R \cdot \frac{(1+i)^N - 1}{i}$**.
  - **Error 2:** Postergar el inicio del ahorro creyendo que los aportes de los últimos años compensan los de la juventud. **Cómo corregirlo:** Los aportes tempranos **tienen más años de capitalización exponencial acumulada**.
ejemplos:
  - titulo: 'Fondo acumulado a 2 años'
    enunciado: 'Si $R = $\$100.00$0$ anual al $10\%$ en 2 años (factor $2,10$), ¿cuál es el fondo previsional acumulado?'
    alternativas:
      - '$\$210.000$'
      - '$\$200.000$'
      - '$\$220.000$'
    respuesta: '$\$210.000$'
    solucion_pasos:
      - '1. $M_{\text{Fondo}} = 100.000 \cdot 2,10 = $\$210.00$0$.'
  - titulo: 'Ganancia por rentabilidad'
    enunciado: 'En el plan anterior con $M = $\$210.00$0$ y aportes propios de $\$200.000$, ¿cuánto fue la ganancia por rentabilidad?'
    alternativas:
      - '$\$10.000$'
      - '$\$210.000$'
      - '$\$0$'
    respuesta: '$\$10.000$'
    solucion_pasos:
      - '1. $I = 210.000 - 200.000 = $\$10.00$0$.'
  - titulo: 'Efecto del Ahorro Previsional Voluntario'
    enunciado: '¿Realizar un aporte voluntario (APV) constante incrementa el fondo final de jubilación por la vía del interés compuesto?'
    alternativas:
      - 'Sí, porque aumenta la cuota periódica $R$ sujeta a rentabilidad acumulada'
      - 'No, el APV no genera intereses'
      - 'No, el APV reduce la pensión futura'
    respuesta: 'Sí, porque aumenta la cuota periódica $R$ sujeta a rentabilidad acumulada'
    solucion_pasos:
      - '1. Todo aporte adicional $R_{\text{APV}}$ capitaliza a la tasa compuesta del fondo.'
  - titulo: 'Importancia de la cotización temprana'
    enunciado: '¿Un aporte previsional realizado a los 25 años genera mayor monto al momento de jubilar que el mismo aporte realizado a los 60 años?'
    alternativas:
      - 'Sí, debido a que acumula más de 35 años de interés compuesto'
      - 'No, ambos aportes valen exactamente lo mismo'
      - 'No, el aporte a los 60 años rinde más'
    respuesta: 'Sí, debido a que acumula más de 35 años de interés compuesto'
    solucion_pasos:
      - '1. A mayor tiempo de permanencia $N$, mayor es la potencia $(1 + i)^N$.'
errores_frecuentes:
  - 'El fondo previsional de retiro se proyecta como la suma lineal de los aportes sin considerar la rentabilidad compuesta.'
  - 'Los aportes previsionales realizados en la juventud tienen el mismo impacto final que los realizados un año antes de jubilar.'
  - 'El fondo de pensiones no genera intereses durante los períodos en que el trabajador permanece cesante.'
  - 'El Ahorro Previsional Voluntario está afecto a pérdidas obligatorias impuestas por ley.'
  - 'La ganancia por rentabilidad en un horizonte de treinta años es menor al cinco por ciento del total ahorrado.'
afirmaciones_verdaderas:
  - 'El fondo previsional proyectado con aportes constantes se modela mediante $M_{\text{Fondo}} = R \cdot \left[\frac{(1 + i)^N - 1}{i}\right]$.'
  - 'En un horizonte de largo plazo, los intereses devengados por rentabilidad compuesta constituyen la mayor parte del fondo acumulado para jubilación.'
al_terminar_debes_poder: |
