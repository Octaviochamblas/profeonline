  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcula el aporte mensual ($10\%$ de tu sueldo imponible).'
- 'Paso 2: Multiplica por 12 para obtener tu ahorro anual.'
- 'Paso 3: Multiplica por la cantidad de años que vas a trabajar antes de jubilar.'
errores_correccion: Evita confundir los datos de entrada al operar con proyección de ahorro
  previsional con aporte constante.
ejemplos:
- titulo: Ahorro básico sin rentabilidad
  enunciado: Si tu sueldo imponible será de $1.000.000 por el resto de tu vida (y aportas
    el 10% mensual), ¿cuánto habrás juntado en 30 años de trabajo? (Ignorando la rentabilidad).
  solucion_pasos:
  - 'Aporte mensual: 10% de 1.000.000 = $100.000.'
  - 'Aporte anual: $100.000 \cdot 12 = 1.200.000$.'
  - 'Aporte en 30 años: $1.200.000 \cdot 30 = 36.000.000$.'
  - Tendrías $36.000.000 de capital puro (en la vida real sería mucho más gracias a las inversiones
    de la AFP).
- titulo: Ejemplo 2
  enunciado: Con aporte mensual de 50.000 pesos durante 20 años, ¿cuál es el capital puro
    acumulado?
  alternativas:
  - 12.000.000
  - 10.000.000
  - 6.000.000
  respuesta: 12.000.000
  solucion_pasos:
  - 50.000 por 12 por 20 es igual a 12.000.000.
- titulo: Ejemplo 3
  enunciado: Con aporte mensual de 80.000 pesos durante 10 años, ¿cuál es el capital puro
    acumulado?
  alternativas:
  - 9.600.000
  - 8.000.000
  - '960.000'
  respuesta: 9.600.000
  solucion_pasos:
  - 80.000 por 12 por 10 es igual a 9.600.000.
- titulo: ¿Empezar a ahorrar más temprano generalmente resulta en más capital acumulado, incluso
    con aportes similares?
  respuesta: Sí
  solucion_pasos:
  - El tiempo de cotización es el factor más importante para una buena proyección previsional.
errores_frecuentes:
- Olvidar multiplicar por los 12 meses del año al hacer proyecciones a largo plazo.
- Creer que la pensión será igual a tu último sueldo (la pensión depende únicamente del total
  de dinero juntado en ese pozo dividido por los años que vivas como jubilado).
- Olvidar multiplicar por los 12 meses del año al hacer proyecciones a largo plazo.
- Creer que la pensión final será igual al último sueldo recibido en actividad.
- Confundir el aporte mensual con el aporte anual al hacer los cálculos de proyección.
afirmaciones_verdaderas:
- La propiedad de proyección de ahorro previsional con aporte constante preserva la consistencia
  lógica.
- El tiempo total de cotización es uno de los factores más importantes para el monto final
  del ahorro previsional, junto con el monto del aporte mensual.
al_terminar_debes_poder: Resolver problemas aplicados que involucren proyección de ahorro
  previsional con aporte constante.
