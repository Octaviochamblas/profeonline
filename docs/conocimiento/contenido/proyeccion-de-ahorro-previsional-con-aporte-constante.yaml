procedimiento:
- 'Paso 1: Calcula el aporte mensual ($10\%$ de tu sueldo imponible).'
- 'Paso 2: Multiplica por 12 para obtener tu ahorro anual.'
- 'Paso 3: Multiplica por la cantidad de años que vas a trabajar antes de jubilar.'
errores_correccion: Evita confundir los datos de entrada al operar con proyección
  de ahorro previsional con aporte constante.
ejemplos:
- titulo: Ahorro básico sin rentabilidad
  enunciado: Si tu sueldo imponible será de $1.000.000 por el resto de tu vida (y
    aportas el 10% mensual), ¿cuánto habrás juntado en 30 años de trabajo? (Ignorando
    la rentabilidad).
  solucion_pasos:
  - 'Aporte mensual: 10% de 1.000.000 = $100.000.'
  - 'Aporte anual: $100.000 \cdot 12 = 1.200.000$.'
  - 'Aporte en 30 años: $1.200.000 \cdot 30 = 36.000.000$.'
  - Tendrías $36.000.000 de capital puro (en la vida real sería mucho más gracias
    a las inversiones de la AFP).
errores_frecuentes:
- Olvidar multiplicar por los 12 meses del año al hacer proyecciones a largo plazo.
- Creer que la pensión será igual a tu último sueldo (la pensión depende únicamente
  del total de dinero juntado en ese pozo dividido por los años que vivas como jubilado).
afirmaciones_verdaderas:
- La propiedad de proyección de ahorro previsional con aporte constante preserva la
  consistencia lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren proyección de
  ahorro previsional con aporte constante.
fuente: Currículum Nacional MINEDUC.
