  QUÉ: Proyectar el fondo de ahorro previsional para jubilación bajo un esquema de aportes constantes y rentabilidad compuesta.
  CÓMO: Aplicar el modelo de anualidad de capitalización $M_{\text{Fondo}} = R \cdot \frac{(1 + i)^N - 1}{i}$ evaluando el impacto del plazo $N$, los aportes periódicos $R$ y el interés acumulado.
