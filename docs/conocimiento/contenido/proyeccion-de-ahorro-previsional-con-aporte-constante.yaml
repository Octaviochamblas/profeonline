semantic_id: MAT.NUM.FINANZAS_PERSONALES.PROYECCION_PREVISIONAL
resumen_inicial: 'Proyección de ahorro previsional con aporte constante: concepto y propiedades
  fundamentales en Finanzas personales.'
explicacion_simple: 'Si guardas una pequeña cantidad de dinero todos los meses desde que empiezas
  a trabajar hasta que te jubiles, el monto final no es solo la suma del dinero: la magia
  del interés compuesto y la constancia hacen que ese pozo crezca enormemente.'
explicacion_formal: 'Una proyección simplificada (sin considerar interés ni rentabilidad,
  solo la acumulación lineal) nos ayuda a entender el volumen del ahorro:


  $$\text{Monto Acumulado} = \text{Aporte Mensual} \cdot 12 \text{ meses} \cdot \text{Años
  Trabajados}$$


  - **¿Por qué empezar temprano?** Un trabajador que ahorra desde los 25 a los 65 años (40
  años) acumulará mucho más capital base que alguien que empieza a los 45 años, incluso si
  este último aporta el doble de dinero mensual. El tiempo de cotización es el factor más
  importante para una buena pensión futura.'
definiciones_clave: '- **Proyección de ahorro previsional con aporte constante**: Elemento
  central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a proyección de ahorro previsional con aporte constante.'
ejemplo_guiado:
  enunciado: Un trabajador tiene un sueldo imponible de 700.000 pesos y aporta el 10% mensual
    a su AFP. Si trabaja 25 años, ¿cuánto capital puro habrá acumulado, ignorando la rentabilidad?
  pasos:
  - 'Calculo el aporte mensual: 700.000 por 0,10 es igual a 70.000.'
  - 'Calculo el aporte anual: 70.000 por 12 es igual a 840.000.'
  - 'Calculo el aporte en 25 años: 840.000 por 25 es igual a 21.000.000.'
