resumen_inicial: La proyección del fondo de ahorro previsional acumulado con aportes
  constantes $C$ y rentabilidad periódica $r$ se modela mediante la suma de capitalización
  de una anualidad.
explicacion_simple: Para proyectar cuánto dinero tendremos al jubilar, calculamos
  la suma de todos los aportes mensuales que guardamos en la AFP más los intereses
  ganados gracias a la rentabilidad del fondo a lo largo de los años.
explicacion_formal: 'Para un aporte periódico constante $C$ abonado al final de cada
  período durante $n$ meses a una tasa de rentabilidad mensual $r$, el **Fondo Previsional
  Acumulado $F_n$** (sin saldo inicial) es:


  $$F_n = C \cdot \left[ \frac{(1 + r)^n - 1}{r} \right]$$


  **Efecto del interés compuesto:**

  - El crecimiento exponencial del fondo proyectado se intensifica en los últimos
  años del período $n$ debido a la capitalización continua de rentabilidades previas.'
definiciones_clave: '- **Proyección previsional**: Acumulación de saldo $F_n = C \cdot
  \left[ \frac{(1+r)^n - 1}{r} \right]$ con interés compuesto.'
propiedades_relaciones: '- **Capitalización continua**: Crecimiento exponencial del
  fondo de ahorro en el tiempo $n$.'
ejemplo_guiado:
  enunciado: Si una persona ahorra un aporte constante $C = \$50.000$ mensual durante
    $2\text{ meses}$ a una rentabilidad mensual del $1\%$ ($r = 0,01$), calcule el
    fondo final.
  pasos:
  - 'Paso 1: Primer mes: el aporte de \$50.000 gana $1\% \implies 50.000 \cdot 1,01
    = 50.500$.'
  - 'Paso 2: Segundo mes: sumar nuevo aporte de \$50.000 \implies 100.500$ y aplicar
    rentabilidad: $100.500 \cdot 1,01 = 101.505$.'
  - 'Conclusión: El fondo acumulado al segundo mes es \$101.505.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué fenómeno financiero acelera la acumulación en la proyección de un
    fondo previsional con el tiempo?
  choices:
  - text: El interés compuesto acumulado por la capitalización continua de rentabilidades
    is_correct: true
  - text: La inflación constante del IPC
    is_correct: false
  - text: El cobro de comisiones fijas
    is_correct: false
  - text: La pérdida del capital invertido
    is_correct: false
  explanation: La alternativa correcta es 'El interés compuesto acumulado por la capitalización
    continua de rentabilidades'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $50.000 mensuales al 1% en 2 meses, ¿cuál fue
    el saldo final acumulado?
  choices:
  - text: 101.505 $
    is_correct: true
  - text: 100.000 $
    is_correct: false
  - text: 101.000 $
    is_correct: false
  - text: 105.000 $
    is_correct: false
  explanation: La alternativa correcta es '101.505 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de proyectar fondos previsionales
  acumulados considerando aportes constantes e interés compuesto por rentabilidad.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.PROYECCION_PREVISIONAL
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.PROYECCION_PREVISIONAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
