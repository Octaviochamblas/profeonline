procedimiento:
- 'Paso 1: Identifica los coeficientes $a$, $b$ y $c$ de la ecuación en forma general.'
- 'Paso 2: Sustituye esos valores en $x=\dfrac{-b\pm\sqrt{b^2-4ac}}{2a}$.'
- 'Paso 3: Calcula el discriminante y simplifica la raíz cuadrada si corresponde.'
- 'Paso 4: Resuelve por separado el caso $+$ y el caso $-$ para obtener las dos soluciones
  (o la única, si el discriminante es cero).'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en aplicación de la fórmula general para resolver ecuaciones cuadráticas.
ejemplos:
- titulo: Aplicación directa de la fórmula general
  enunciado: Resuelve $x^2+2x-3=0$ usando la fórmula general.
  solucion_pasos:
  - $a=1$, $b=2$, $c=-3$.
  - $x=\dfrac{-2\pm\sqrt{4+12}}{2}=\dfrac{-2\pm4}{2}$.
  - $x=1$ o $x=-3$.
- titulo: Aplicación con coeficiente a distinto de 1
  enunciado: Resuelve $2x^2-5x+2=0$ usando la fórmula general.
  solucion_pasos:
  - $a=2$, $b=-5$, $c=2$.
  - $x=\dfrac{5\pm\sqrt{25-16}}{4}=\dfrac{5\pm3}{4}$.
  - $x=2$ o $x=1/2$.
- titulo: ¿La fórmula general funciona para cualquier ecuación cuadrática?
  enunciado: ¿La fórmula general funciona para cualquier ecuación cuadrática?
  respuesta: Sí
  solucion_pasos:
  - Es válida siempre que $a\neq0$, sin importar los valores de $b$ y $c$.
- titulo: ¿Es necesario calcular el discriminante antes de aplicar la fórmula general?
  enunciado: ¿Es necesario calcular el discriminante antes de aplicar la fórmula general?
  respuesta: 'No'
  solucion_pasos:
  - El discriminante forma parte de la fórmula general; se calcula como paso intermedio
    dentro de ella, no como requisito previo separado.
errores_frecuentes:
- Olvidar el signo $\pm$, obteniendo solo una de las dos soluciones.
- Cometer errores de signo al sustituir un coeficiente negativo, especialmente en
  $-b$.
- Dividir solo el término con la raíz por $2a$, en vez de dividir toda la expresión
  $-b\pm\sqrt{\Delta}$.
- No simplificar la fracción final cuando es posible.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando aplicación
  de la fórmula general para resolver ecuaciones cuadráticas.
