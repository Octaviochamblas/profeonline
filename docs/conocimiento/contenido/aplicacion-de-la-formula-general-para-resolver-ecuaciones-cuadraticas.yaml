semantic_id: MAT.ALG.EC_CUADR_METODOS.FORMULA_GENERAL
resumen_inicial: La fórmula general cuadrática permite resolver cualquier ecuación de segundo grado $ax^2 + bx + c = 0$ ($a \neq 0$) mediante la expresión resolvente $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$.
explicacion_simple: "![La fórmula general cuadrática permite resolver cualquier ecuación de segundo grado $ax^2 + bx + c = 0$ ($a \\neq 0$) mediante la expresión resolvente $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$](/static/img/nodos/aplicacion-de-la-formula-general-para-resolver-ecuaciones-cuadraticas-intro.svg)\n\n\nLa **fórmula cuadrática general** es la herramienta más poderosa del álgebra para resolver ecuaciones de segundo grado:\n$$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$\n\n- Funciona para **CUALQUIER ecuación cuadrática** (tenga números fáciles, fracciones, raíces o no se pueda factorizar).\n- El símbolo **$\\pm$** (más o menos) te da las dos soluciones:\n  - Solución 1 ($x_1$): usando el signo $+$ en la raíz.\n  - Solución 2 ($x_2$): usando el signo $-$ en la raíz.\n- Lo que está adentro de la raíz ($b^2 - 4ac$) se llama **discriminante ($\\Delta$)** y te dice cuántas soluciones reales existen."
explicacion_formal: "Dada la ecuación cuadrática canónica $ax^2 + bx + c = 0$ con $a \\in \\mathbb{R} \\setminus \\{0\\}$ y $b, c \\in \\mathbb{R}$, la **fórmula resolvente universal** (también conocida históricamente como fórmula de Bhaskara) se deduce formalmente completando el trinomio cuadrado perfecto:\n$$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$\n\n**Estructura funcional de la resolvente:**\n- **Término central de simetría**: $-\\frac{b}{2a}$ es la abscisa del vértice de la parábola asociada.\n- **Semidistancia focal**: $\\frac{\\sqrt{\\Delta}}{2a}$ mide la separación horizontal desde el vértice hasta cada raíz en el eje $X$.\n- **Ramas de solución**:\n  $$x_1 = \\frac{-b + \\sqrt{b^2 - 4ac}}{2a}, \\quad x_2 = \\frac{-b - \\sqrt{b^2 - 4ac}}{2a}$$"
definiciones_clave: '- **Fórmula general cuadrática**: Expresión explícita cerrada que determina las raíces de un polinomio de grado 2 a partir de sus coeficientes.

  - **Discriminante $\Delta$**: Cantidad subradical $\Delta = b^2 - 4ac$ que categoriza el tipo y multiplicidad de las soluciones.'
propiedades_relaciones: '- **Universalidad**: Aplica a ecuaciones completas e incompletas, con coeficientes enteros, racionales o irracionales.

  - **Relación con el vértice**: Las soluciones son equidistantes del eje de simetría $x_v = -b/(2a)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La fórmula general cuadrática permite resolver cualquier ecuación de segundo grado $ax^2 + bx + c = 0$ ($a \neq 0$) mediante la expresión resolvente $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$](/static/img/nodos/aplicacion-de-la-formula-general-para-resolver-ecuaciones-cuadraticas-ejemplos.svg)



    Resuelve la ecuación cuadrática $x^2 - 7x + 10 = 0$ aplicando la fórmula general.'
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 1, b = -7, c = 10$.'
  - 'Paso 2: Calcular el discriminante: $\Delta = (-7)^2 - 4(1)(10) = 49 - 40 = 9$.'
  - 'Paso 3: Sustituir en la resolvente: $x = \frac{-(-7) \pm \sqrt{9}}{2(1)} = \frac{7 \pm 3}{2}$.'
  - 'Paso 4: Calcular la primera rama ($+$): $x_1 = \frac{7 + 3}{2} = \frac{10}{2} = 5$.'
  - 'Paso 5: Calcular la segunda rama ($-$): $x_2 = \frac{7 - 3}{2} = \frac{4}{2} = 2$.'
  - 'Paso 6: Concluir el conjunto solución: $\mathcal{S} = \{2, 5\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión correcta de la fórmula general cuadrática para resolver $ax^2 + bx + c = 0$?
  choices:
  - text: x = (-b ± √(b² - 4ac)) / (2a)
    is_correct: true
  - text: x = (b ± √(b² - 4ac)) / (2a)
    is_correct: false
  - text: x = -b ± √(b² - 4ac) / 2a
    is_correct: false
  - text: x = (-b ± √(b² + 4ac)) / a
    is_correct: false
  explanation: La alternativa correcta es 'x = (-b ± √(b² - 4ac)) / (2a)'. Toda la suma/resta del numerador está dividida entre $2a$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $2x^2 + 5x - 3 = 0$, ¿cuál es el valor del discriminante $\Delta = b^2 - 4ac$?
  choices:
  - text: '49'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '-1'
    is_correct: false
  - text: '25'
    is_correct: false
  explanation: La alternativa correcta es '49'. $\Delta = 5^2 - 4(2)(-3) = 25 + 24 = 49$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación en la forma canónica $ax^2 + bx + c = 0$ e identificar los valores numéricos de $a, b, c$.'
- 'Paso 2: Calcular el valor numérico del discriminante $\Delta = b^2 - 4ac$.'
- 'Paso 3: Sustituir en la fórmula general protegiendo los signos con paréntesis $x = \frac{-(b) \pm \sqrt{\Delta}}{2(a)}$.'
- 'Paso 4: Separar las dos ramas del signo $\pm$ para calcular $x_1$ y $x_2$.'
- 'Paso 5: Simplificar las fracciones resultantes y expresar el conjunto solución.'
errores_correccion: '- **Error común:** Dividir solo el radical entre $2a$ y dejar $-b$ sin dividir.

  - **Cómo corregirlo:** La línea de fracción cubre **todo el numerador**: $\frac{-b \pm \sqrt{\Delta}}{2a}$.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente principal no unitario'
  enunciado: Resuelve $2x^2 - 3x - 2 = 0$ mediante fórmula general.
  alternativas:
  - x = 2 y x = -1/2
  - x = -2 y x = 1/2
  - x = 2 y x = 1/2
  - x = 1 y x = -2
  respuesta: x = 2 y x = -1/2
  solucion_pasos:
  - 'Paso 1: $\Delta = (-3)^2 - 4(2)(-2) = 9 + 16 = 25$.'
  - 'Paso 2: $x = \frac{3 \pm 5}{4} \implies x_1 = 8/4 = 2, x_2 = -2/4 = -1/2$.'
- titulo: 'Ejemplo 2: Raíz doble'
  enunciado: Resuelve $4x^2 - 12x + 9 = 0$.
  alternativas:
  - x = 3/2 (raíz doble)
  - x = -3/2 (raíz doble)
  - x = 3 y x = -3
  - Sin solución
  respuesta: x = 3/2 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $\Delta = (-12)^2 - 4(4)(9) = 144 - 144 = 0 \implies x = 12/8 = 3/2$.'
- titulo: 'Ejemplo 3: Raíces irracionales'
  enunciado: Resuelve $x^2 - 4x + 1 = 0$.
  alternativas:
  - x = 2 + sqrt(3) y x = 2 - sqrt(3)
  - x = 4 ± sqrt(12)
  - x = 2 ± sqrt(12)
  - No tiene solución real
  respuesta: x = 2 + sqrt(3) y x = 2 - sqrt(3)
  solucion_pasos:
  - 'Paso 1: $\Delta = 16 - 4 = 12 \implies x = \frac{4 \pm 2\sqrt{3}}{2} = 2 \pm \sqrt{3}$.'
- titulo: 'Ejemplo 4: Discriminante negativo'
  enunciado: ¿Qué soluciones reales tiene $x^2 + 2x + 5 = 0$?
  alternativas:
  - No tiene soluciones en R
  - x = -1 ± 2
  - x = 1 ± 2
  - x = 0
  respuesta: No tiene soluciones en R
  solucion_pasos:
  - 'Paso 1: $\Delta = 4 - 20 = -16 < 0$, sin solución real.'
errores_frecuentes:
- Omitir el signo menos inicial de -b.
- Dividir solo la raíz entre 2a.
- Equivocar el signo de -4ac cuando a o c son negativos.
afirmaciones_verdaderas:
- La fórmula general resuelve cualquier ecuación cuadrática real ax² + bx + c = 0.
- Si el discriminante es cero, la fórmula entrega una única solución real doble x = -b/(2a).
al_terminar_debes_poder: '**QUÉ:** Aplicar con precisión la fórmula general cuadrática para resolver ecuaciones de segundo grado.


  **CÓMO:** Calculando el discriminante Δ = b² - 4ac y evaluando las dos ramas x = (-b ± √Δ)/(2a).


