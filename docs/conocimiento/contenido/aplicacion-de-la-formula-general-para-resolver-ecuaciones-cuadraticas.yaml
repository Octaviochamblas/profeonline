semantic_id: MAT.ALG.EC_CUADR_METODOS.FORMULA_GENERAL
resumen_inicial: La fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ permite
  resolver cualquier ecuación de segundo grado $a x^2 + b x + c = 0$.
explicacion_simple: "La **fórmula general o resolvente** es el método infalible que\
  \ funciona para TODAS las ecuaciones cuadráticas:\n$$x = \\frac{-b \\pm \\sqrt{b^2\
  \ - 4ac}}{2a}$$\n- El signo $\\pm$ entrega las dos soluciones de la ecuación:\n\
  \  - $x_1 = \\frac{-b + \\sqrt{b^2 - 4ac}}{2a}$\n  - $x_2 = \\frac{-b - \\sqrt{b^2\
  \ - 4ac}}{2a}$\n- Sirve incluso cuando el trinomio no se puede factorizar con números\
  \ enteros."
explicacion_formal: 'Dada la ecuación cuadrática canónica $a x^2 + b x + c = 0$ con
  $a, b, c \in \mathbb{R}$ y $a \neq 0$, las soluciones en el campo numérico vienen
  dadas por la **fórmula cuadrática general**:


  $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$


  **Desglose de la fórmula:**

  - Deducción rigurosa obtenida al completar el cuadrado del polinomio canónico $a
  x^2 + b x + c = 0$.'
definiciones_clave: '- **Fórmula general (resolvente)**: Expresión algebraica universal
  que entrega las dos raíces $x_1, x_2$ en términos de los coeficientes $a, b, c$.

  - **Discriminante ($\Delta$)**: Subexpresión radical $\Delta = b^2 - 4ac$ que determina
  el tipo y cantidad de raíces.'
propiedades_relaciones: '- **Universalidad**: Aplica a ecuaciones cuadráticas completas
  e incompletas, mónicas y no mónicas.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación cuadrática $x^2 - 5x + 6 = 0$ utilizando la fórmula
    general.
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 1$, $b = -5$, $c = 6$.Paso 2: Reemplazar
    los coeficientes en la fórmula general: $x = \frac{-(-5) \pm \sqrt{(-5)^2 - 4(1)(6)}}{2(1)}$.Paso
    3: Resolver las operaciones internas: $x = \frac{5 \pm \sqrt{25 - 24}}{2} = \frac{5
    \pm \sqrt{1}}{2} = \frac{5 \pm 1}{2}$.Paso 4: Separar los dos caminos: $x_1 =
    \frac{5 + 1}{2} = \frac{6}{2} = 3$ y $x_2 = \frac{5 - 1}{2} = \frac{4}{2} = 2$.Paso
    5: Concluir que el conjunto solución es $S = \{2, 3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la fórmula general a la ecuación $x^2 - 5x + 6 = 0$, ¿cuáles
    son sus soluciones?
  choices:
  - text: $x_1 = 3$ y $x_2 = 2$
    is_correct: true
  - text: $x_1 = -3$ y $x_2 = -2$
    is_correct: false
  - text: $x_1 = 5$ y $x_2 = 6$
    is_correct: false
  - text: $x_1 = 1$ y $x_2 = 6$
    is_correct: false
  explanation: La alternativa correcta es '$x_1 = 3$ y $x_2 = 2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor del denominador completo en la fórmula general $x =
    \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$?
  choices:
  - text: El denominador es $2a$, abarcando toda la expresión superior.
    is_correct: true
  - text: El denominador es solo $a$.
    is_correct: false
  - text: El denominador es 2.
    is_correct: false
  - text: El denominador es $b^2 - 4ac$.
    is_correct: false
  explanation: La alternativa correcta es 'El denominador es $2a$, abarcando toda
    la expresión superior.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación en la forma $a x^2 + b x + c = 0$ e identificar $a,
  b, c$.'
- 'Paso 2: Escribir la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$.'
- 'Paso 3: Sustituir los coeficientes con sus respectivos signos empleando paréntesis.'
- 'Paso 4: Calcular la cantidad subradical $\Delta = b^2 - 4ac$ y simplificar la fracción.'
errores_correccion: '- **Error común:** Escribir el denominador $2a$ afectando únicamente
  al radical (escribir $-b \pm \frac{\sqrt{b^2-4ac}}{2a}$).

  - **Cómo corregirlo:** La raya de fracción es TOTAL; el denominador $2a$ divide
  tanto a $-b$ como a la raíz cuadrada completa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de métodos algebraicos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de métodos de resolución.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La fórmula general resuelve cualquier ecuación cuadrática ax^2 + bx + c
    = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, la fórmula general resolvente es de aplicación universal.
- titulo: ¿Al sustituir b = -5 en la fórmula general, -b se transforma en +5?
  respuesta: Sí
  solucion_pasos:
  - Sí, -(-5) = +5 por la regla de signos.
errores_frecuentes:
- Escribir $(-5)^2 = -25$ dentro del radical de la fórmula general en lugar de $+25$.
- Escribir el denominador $2a$ de la fórmula general dividiendo únicamente al radical
  y no a todo el numerador.
- Olvidar sumar el término $(b/2)^2$ a ambos lados de la ecuación al completar el
  cuadrado.
- Olvidar deshacer el cambio de variable auxiliar $u = x^2$ dejando las soluciones
  expresadas en $u$ en lugar de $x$.
- Simplificar coeficientes en fracciones algebraicas sin antes haber factorizado el
  numerador completo.
afirmaciones_verdaderas:
- La fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ resuelve cualquier ecuación
  cuadrática real.
- Para resolver ecuaciones bicuadradas de la forma $a x^4 + b x^2 + c = 0$, la sustitución
  $u = x^2$ la reduce a la cuadrática $a u^2 + b u + c = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la fórmula general,
  sustituir coeficientes ordenadamente, simplificar radicales, completar el cuadrado
  y resolver ecuaciones reducibles a segundo grado.
