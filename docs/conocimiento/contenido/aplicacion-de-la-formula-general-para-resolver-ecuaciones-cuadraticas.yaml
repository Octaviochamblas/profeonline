semantic_id: MAT.ALG.EC_CUADR_METODOS.FORMULA_GENERAL
resumen_inicial: 'Aplicación de la fórmula general para resolver ecuaciones cuadráticas:
  concepto, discriminante, soluciones y modelamiento en Métodos algebraicos de resolución.'
explicacion_simple: Existe una única fórmula que resuelve cualquier ecuación cuadrática,
  sin importar qué tan complicados sean sus coeficientes; basta con sustituir tres
  números en ella.
explicacion_formal: '### Definición formal


  Para toda ecuación $ax^2+bx+c=0$ con $a \neq 0$, las soluciones están dadas por
  $x=\dfrac{-b\pm\sqrt{b^2-4ac}}{2a}$. Esta fórmula se obtiene mediante el método
  de completar el cuadrado aplicado a la forma general, y es válida para cualquier
  terna de coeficientes reales.


  ### Desarrollo didáctico


  El uso de la fórmula general sigue siempre el mismo patrón: identificar $a$, $b$,
  $c$; calcular el discriminante; y sustituir todo en la fórmula, resolviendo por
  separado el caso $+$ y el caso $-$.


  Para $x^2-3x-4=0$: $a=1$, $b=-3$, $c=-4$. Sustituyendo, $x=\dfrac{3\pm\sqrt{9+16}}{2}=\dfrac{3\pm5}{2}$,
  lo que da $x=4$ y $x=-1$.'
definiciones_clave: '- **Aplicación de la fórmula general para resolver ecuaciones
  cuadráticas**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en aplicación
  de la fórmula general para resolver ecuaciones cuadráticas.'
