semantic_id: MAT.ALG.EC_CUADR_METODOS.FORMULA_GENERAL
resumen_inicial: La fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ permite calcular las raíces de cualquier ecuación cuadrática a partir de sus coeficientes.
explicacion_simple: |
  La **fórmula general (o resolvente)** es la herramienta universal para resolver cualquier ecuación de segundo grado $ax^2 + bx + c = 0$:

  $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

  - Funciona para cualquier ecuación cuadrática (completas e incompletas).
  - El signo $\pm$ entrega las dos soluciones: una usando la suma y la otra usando la resta.
  - **Ejemplo**: Para $x^2 - 5x + 6 = 0$ ($a = 1$, $b = -5$, $c = 6$):
    $$x = \frac{-(-5) \pm \sqrt{(-5)^2 - 4(1)(6)}}{2(1)} = \frac{5 \pm \sqrt{25 - 24}}{2} = \frac{5 \pm 1}{2}$$
    - $x_1 = \frac{5 + 1}{2} = 3$
    - $x_2 = \frac{5 - 1}{2} = 2$
explicacion_formal: |
  Dada la ecuación polinómica de segundo grado $ax^2 + bx + c = 0$ con $a, b, c \in \mathbb{R}$ y $a \neq 0$, la deducción por el método de completar el cuadrado establece la **fórmula cuadrática general**:

  $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

  **Teorema de resolución:**
  - El término $\Delta = b^2 - 4ac$ es el discriminante de la ecuación.
  - Si $\Delta \ge 0$, las soluciones pertenecen al conjunto de los números reales $\mathbb{R}$.
  - El denominador $2a$ afecta a la totalidad del numerador $(-b \pm \sqrt{\Delta})$.
definiciones_clave: |
  - **Fórmula general cuadrática**: Expresión explícita que determina analíticamente las raíces de $ax^2 + bx + c = 0$ en función de sus coeficientes.
propiedades_relaciones: |
  - **Identidad de Vieta derivada**: Las soluciones $x_1, x_2$ obtenidas mediante la fórmula satisfacen $x_1 + x_2 = -\frac{b}{a}$ y $x_1 \cdot x_2 = \frac{c}{a}$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática $2x^2 - 3x - 5 = 0$ mediante la aplicación de la fórmula general.'
  pasos:
    - 'Paso 1: Identificar los coeficientes: $a = 2$, $b = -3$, $c = -5$.'
    - 'Paso 2: Sustituir en la fórmula: $x = \frac{-(-3) \pm \sqrt{(-3)^2 - 4(2)(-5)}}{2(2)}$.'
    - 'Paso 3: Desarrollar las operaciones: $x = \frac{3 \pm \sqrt{9 + 40}}{4} = \frac{3 \pm \sqrt{49}}{4} = \frac{3 \pm 7}{4}$.'
    - 'Paso 4: Calcular ambas soluciones: $x_1 = \frac{3 + 7}{4} = \frac{10}{4} = \frac{5}{2}$ y $x_2 = \frac{3 - 7}{4} = \frac{-4}{4} = -1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula general para calcular las soluciones de la ecuación $ax^2 + bx + c = 0$?'
    choices:
      - {text: '$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$', is_correct: true}
      - {text: '$x = \frac{b \pm \sqrt{b^2 + 4ac}}{a}$', is_correct: false}
      - {text: '$x = -b \pm \sqrt{b^2 - 4ac}$', is_correct: false}
      - {text: '$x = \frac{-b \pm (b^2 - 4ac)}{2a}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones reales de la ecuación $x^2 - 2x - 3 = 0$ obtenidas por la fórmula general?'
    choices:
      - {text: '$x_1 = 3$ y $x_2 = -1$', is_correct: true}
      - {text: '$x_1 = -3$ y $x_2 = 1$', is_correct: false}
      - {text: '$x_1 = 2$ y $x_2 = 3$', is_correct: false}
      - {text: '$x_1 = 0$ y $x_2 = -3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 3$ y $x_2 = -1$''. Sustituyendo en la fórmula da $\frac{2 \pm 4}{2}$, obteniendo $3$ y $-1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Ordenar e igualar a cero la ecuación cuadrática en la forma $ax^2 + bx + c = 0$.'
  - 'Paso 2: Extraer con precisión los coeficientes numéricos $a$, $b$ y $c$ considerando sus signos.'
  - 'Paso 3: Sustituir los coeficientes en $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ colocando paréntesis en valores negativos.'
  - 'Paso 4: Desarrollar el discriminante $b^2 - 4ac$, calcular la raíz cuadrada y separar las dos soluciones $x_1$ y $x_2$.'
errores_correccion: |
  - **Error común:** Dividir únicamente el radicando o la raíz por $2a$, en lugar de dividir todo el numerador completo $(-b \pm \sqrt{\Delta})$.
  - **Cómo corregirlo:** La barra de división abarca **TODO EL NUMERADOR**: el término $-b$ y la cantidad radical $\sqrt{\Delta}$ se dividen ambos por $2a$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Aplicación con coeficiente fraccionario.
    alternativas:
      - '$S = \{5/2, -1\}$'
      - '$S = \{-5/2, 1\}$'
      - '$S = \{5, -2\}$'
    respuesta: '$S = \{5/2, -1\}$'
    solucion_pasos:
