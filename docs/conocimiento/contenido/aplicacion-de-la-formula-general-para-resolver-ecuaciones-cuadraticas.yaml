  - titulo: Ejemplo 2
    enunciado: Raíz entera doble.
    alternativas:
      - '$S = \{3\}$'
      - '$S = \{-3, 3\}$'
      - '$S = \{0\}$'
    respuesta: '$S = \{3\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$, la división entre $2a$ se aplica únicamente al término de la raíz cuadrada.'
  - 'Evaluar $-b$ cuando $b = -5$ da como resultado el valor $-5$ omitiendo la regla del doble signo negativo.'
  - 'El cuadrado de un coeficiente negativo $(-b)^2$ produce un resultado numérico negativo bajo el radical.'
  - 'La fórmula general solo es aplicable si los tres coeficientes $a$, $b$ y $c$ son números enteros positivos.'
  - 'Si el discriminante $b^2 - 4ac = 0$, la fórmula general entrega dos soluciones reales distintas.'
afirmaciones_verdaderas:
  - 'La fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ resuelve cualquier ecuación cuadrática $ax^2 + bx + c = 0$ con $a \neq 0$.'
  - 'El signo $\pm$ en la fórmula general genera las dos raíces de la ecuación al sumar y restar la raíz cuadrada del discriminante.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la fórmula general para calcular las raíces de cualquier ecuación de segundo grado.
  CÓMO: Extraer $a, b, c$, sustituir en $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$, calcular el discriminante y simplificar las soluciones.
