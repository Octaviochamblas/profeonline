resumen_inicial: Los ingresos personales son las entradas de recursos económicos provenientes
  del trabajo (salario, honorario, comisión) o del capital (dividendos, intereses
  de inversiones y arriendos).
explicacion_simple: Los ingresos son todo el dinero que entra a nuestro bolsillo.
  Pueden ser ingresos por trabajo (como un sueldo mensual fijo o comisiones por ventas)
  o ingresos por inversiones y propiedades (como intereses del banco o dividendos
  de acciones).
explicacion_formal: 'El **Ingreso Total $I_{total}$** se define como el flujo positivo
  de caja durante un período mensual:


  $$I_{total} = I_{trabajo} + I_{capital} = (S_{fijo} + C_{variable}) + (D_{div} +
  Int_{inv})$$


  **Categorías de origen:**

  - Ingreso ordinario directo (Sueldo base imponible, honorarios).

  - Ingreso variable o esporádico (Comisiones, bonos de desempeño).

  - Ingreso pasivo de patrimonio (Intereses bancarios, dividendos de capital).'
definiciones_clave: '- **Tipos de ingreso**: Clasificación de flujos de entrada en
  sueldo, comisiones, dividendos e intereses.'
propiedades_relaciones: '- **Suma de ingresos de caja**: $I_{total} = I_{trabajo}
  + I_{capital}$.'
ejemplo_guiado:
  enunciado: Un profesional percibe un sueldo fijo de \$600.000, una comisión por
    ventas de \$120.000 e intereses de un depósito a plazo de \$15.000. Calcule su
    ingreso total.
  pasos:
  - 'Paso 1: Identificar ingresos por trabajo: sueldo (\$600.000) y comisión (\$120.000).'
  - 'Paso 2: Identificar ingresos por capital: intereses (\$15.000).'
  - 'Paso 3: Sumar todos los flujos de entrada: $600.000 + 120.000 + 15.000 = 735.000$.'
  - 'Conclusión: El ingreso total del mes es \$735.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las dos grandes fuentes de ingresos en las finanzas personales?
  choices:
  - text: Ingresos por trabajo (sueldo/comisión) e ingresos por capital (dividendos/intereses)
    is_correct: true
  - text: Gastos fijos y gastos imprevistos
    is_correct: false
  - text: Deudas comerciales e impuestos
    is_correct: false
  - text: Descuentos e intereses reales
    is_correct: false
  explanation: La alternativa correcta es 'Ingresos por trabajo (sueldo/comisión)
    e ingresos por capital (dividendos/intereses)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con sueldo, comisión e intereses, ¿cuál fue el ingreso
    total del mes?
  choices:
  - text: 735.000 $
    is_correct: true
  - text: 600.000 $
    is_correct: false
  - text: 720.000 $
    is_correct: false
  - text: 615.000 $
    is_correct: false
  explanation: La alternativa correcta es '735.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar y calcular el ingreso
  total $I_{total}$ sumando flujos provenientes del trabajo y del capital.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_INGRESO
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.TIPOS_INGRESO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
