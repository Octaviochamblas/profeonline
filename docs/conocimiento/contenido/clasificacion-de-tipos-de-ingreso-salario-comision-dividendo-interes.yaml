procedimiento:
- 'Paso 1: Analiza la fuente del dinero.'
- 'Paso 2: Si el monto está garantizado por contrato cada mes independiente del rendimiento,
  es Fijo.'
- 'Paso 3: Si el monto depende de cuántas ventas hiciste, o cómo le fue al negocio, es Variable.'
errores_correccion: Evita confundir los datos de entrada al operar con clasificación de tipos
  de ingreso (salario, comisión, dividendo, interés).
ejemplos:
- titulo: Sueldo mixto
  enunciado: Un vendedor gana $500.000 base + 5% por cada venta que haga. ¿Qué tipo de ingresos
    tiene?
  solucion_pasos:
  - Los $500.000 son Ingreso Fijo, cuenta con ellos sí o sí.
  - El 5% de ventas es una Comisión, por ende, es Ingreso Variable. Su presupuesto mensual
    debe basarse en lo fijo para no endeudarse.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de ingreso es el sueldo base de un empleado con contrato indefinido?
  alternativas:
  - Ingreso fijo
  - Ingreso variable
  - Ninguno de los dos
  respuesta: Ingreso fijo
  solucion_pasos:
  - Está garantizado y es predecible cada mes.
- titulo: Ejemplo 3
  enunciado: ¿Qué tipo de ingreso son las horas extras trabajadas un mes puntual?
  alternativas:
  - Ingreso variable
  - Ingreso fijo
  - No es un ingreso
  respuesta: Ingreso variable
  solucion_pasos:
  - Depende de cuántas horas extra se trabajen cada mes.
- titulo: ¿Los honorarios de un trabajador independiente son un ejemplo de ingreso variable?
  respuesta: Sí
  solucion_pasos:
  - Porque dependen de la cantidad de clientes o proyectos de cada mes.
errores_frecuentes:
- Creer que porque un mes te fue muy bien como independiente (ganando mucho), pasaste a tener
  un ingreso fijo alto.
- Confundir un ingreso variable como un 'bono esporádico' con algo fijo con lo que pagar deudas.
- Creer que porque un mes fue muy bueno como trabajador independiente, se pasó a tener un
  ingreso fijo alto.
- Confundir un bono esporádico, un ingreso variable, con algo fijo con lo cual pagar deudas
  regulares.
- Clasificar los dividendos de acciones como ingreso fijo, cuando en realidad dependen del
  desempeño de la empresa.
afirmaciones_verdaderas:
- La propiedad de clasificación de tipos de ingreso (salario, comisión, dividendo, interés)
  preserva la consistencia lógica.
- Los ingresos variables, como comisiones u honorarios, no deben usarse como base para cubrir
  gastos fijos obligatorios, ya que no están garantizados.
al_terminar_debes_poder: Resolver problemas aplicados que involucren clasificación de tipos
  de ingreso (salario, comisión, dividendo, interés).
