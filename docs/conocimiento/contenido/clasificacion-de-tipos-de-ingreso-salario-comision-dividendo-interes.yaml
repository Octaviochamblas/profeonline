semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_INGRESO
resumen_inicial: 'Los ingresos personales se clasifican en activos (dependientes del tiempo y trabajo directo) y pasivos (generados por el rendimiento del capital): $I_{\text{Total}} = I_{\text{activo}} + I_{\text{pasivo}}$.'
explicacion_simple: |
  El dinero que recibes mes a mes proviene de dos grandes fuentes:
  - **Ingresos Activos**: Dinero que obtienes trabajando activamente (salario mensual, comisiones por ventas, honorarios por servicios profesionales). Si dejas de trabajar, este ingreso se detiene.
  - **Ingresos Pasivos**: Dinero generado por tus ahorros o inversiones sin requerir tu presencia continua (dividendos de acciones, intereses de depósitos a plazo, rentas de arriendos).

  ![Clasificación de tipos de ingreso](/static/img/nodos/clasificacion-de-tipos-de-ingreso-salario-comision-dividendo-interes-intro.svg)
explicacion_formal: |
  ### Definición formal
  El flujo total de ingresos personales $I_T$ en un período regular se modela como la combinación lineal de fuentes activas y pasivas:
  $$I_T = \sum I_{\text{activo}} + \sum I_{\text{pasivo}}$$
  donde:
  - $I_{\text{activo}} = S_{\text{base}} + C_{\text{ventas}} + H_{\text{honorarios}}$ (rendimiento del factor trabajo).
  - $I_{\text{pasivo}} = D_{\text{dividendos}} + I_{\text{intereses}} + R_{\text{rentas}}$ (rendimiento del factor capital).

  ### Dinámica de Independencia Financiera
  El **grado de autonomía financiera** $\alpha$ se mide como la proporción del gasto cubierto por ingresos pasivos:
  $$\alpha = \frac{\sum I_{\text{pasivo}}}{G_{\text{Total}}} \ge 1 \implies \text{Libertad financiera}$$

  ### Síntesis didáctica
  - Ecuación de ingresos: $I_T = I_{\text{salario}} + I_{\text{comisión}} + I_{\text{dividendos}} + I_{\text{intereses}}$.
  - Razón de autonomía: $\alpha = I_{\text{pasivo}} / G_{\text{Total}}$.
definiciones_clave: |
  - **Ingreso Activo**: Remuneración que exige el intercambio directo de tiempo y esfuerzo laboral.
  - **Ingreso Pasivo**: Flujo de dinero periódico originado por activos financieros o bienes de capital.
  - **Dividendo**: Porción de las utilidades de una empresa distribuida a sus accionistas.
propiedades_relaciones: |
  - **Estabilidad vs. Variabilidad**: Los salarios base ofrecen alta predictibilidad, mientras que comisiones y dividendos presentan varianza asociada a ventas y resultados corporativos.
  - **Diversificación de ingresos**: Poseer múltiples fuentes de ingreso reduce drásticamente el riesgo de cesantía o pérdida de liquidez.
ejemplo_guiado:
  enunciado: 'Un profesional recibe un sueldo base de $\$800.000$, comisiones por ventas de $\$150.000$ y $\$25.000$ por intereses de un depósito a plazo. Calcula el ingreso total mensual y el porcentaje correspondiente a ingresos pasivos.'
  imagen: '/static/img/nodos/clasificacion-de-tipos-de-ingreso-salario-comision-dividendo-interes-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos Ingresos Activos: Sueldo base + Comisiones $= 800.000 + 150.000 = $\$950.00$0$.'
    - 'Paso 2: Identificamos Ingresos Pasivos: Intereses $= $\$25.00$0$.'
    - 'Paso 3: Calculamos el Ingreso Total: $I_T = 950.000 + 25.000 = $\$975.00$0$.'
    - 'Paso 4: Calculamos la participación pasiva: $\frac{25.000}{975.000} \approx 0,0256 \implies 2,56\%$. El ingreso pasivo representa el **$2,56\%$** del total.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de los siguientes flujos de dinero constituye un ingreso pasivo?'
    choices:
      - {text: 'Los dividendos periódicos generados por acciones o fondos mutuos', is_correct: true}
      - {text: 'El salario mensual recibido por contrato de trabajo de 40 horas', is_correct: false}
      - {text: 'Las comisiones directas por concretar ventas en una tienda', is_correct: false}
      - {text: 'El pago de honorarios por horas de asesoría técnica', is_correct: false}
    explanation: 'La alternativa correcta es ''Los dividendos periódicos generados por acciones o fondos mutuos''. Es un rendimiento derivado del capital invertido sin requerir trabajo directo continuo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una persona percibe $\$600.000$ de sueldo y $\$200.000$ por arriendo de un inmueble propio, ¿cuál es su ingreso total?'
    choices:
      - {text: '$\$800.000$, consolidando ingresos activos y pasivos ($600.000 + 200.000 = 800.000$)', is_correct: true}
      - {text: '$\$400.000$, restando la renta', is_correct: false}
      - {text: '$\$600.000$, contabilizando solo el salario', is_correct: false}
      - {text: '$\$1.200.000$, duplicando el sueldo', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$800.000$, consolidando ingresos activos y pasivos ($600.000 + 200.000 = 800.000$)''. Se suman todas las fuentes de ingreso percibidas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todas las fuentes de dinero del período (sueldos, comisiones, intereses, dividendos, rentas).'
  - 'Paso 2: Clasificar cada entrada en ingreso activo (trabajo) o pasivo (capital).'
  - 'Paso 3: Sumar los montos para calcular el ingreso total consolidado $I_T$.'
  - 'Paso 4: Evaluar la participación porcentual de cada componente sobre el ingreso total.'
errores_correccion: |
  - **Error 1:** Considerar las comisiones de venta variables como ingreso fijo garantizado al presupuestar. **Cómo corregirlo:** Las comisiones son **ingresos activos variables**; se deben presupuestar con estimaciones conservadoras.
  - **Error 2:** Confundir la recuperación del capital invertido con la ganancia de dividendos o intereses. **Cómo corregirlo:** El ingreso pasivo es **exclusivamente la ganancia o rendimiento neto generado**, no el retiro del capital original.
ejemplos:
  - titulo: 'Cálculo de ingreso total mensual'
    enunciado: 'Si una persona gana $\$700.000$ de sueldo base y $\$100.000$ de comisiones, ¿cuál es su ingreso activo total?'
    alternativas:
      - '$\$800.000$'
      - '$\$700.000$'
      - '$\$600.000$'
    respuesta: '$\$800.000$'
    solucion_pasos:
      - '1. $I_{\text{activo}} = 700.000 + 100.000 = $\$800.00$0$.'
  - titulo: 'Participación porcentual de dividendos'
    enunciado: 'Si de un ingreso total de $\$1.000.000$, $\$100.000$ provienen de dividendos, ¿cuál es el porcentaje de ingreso pasivo?'
    alternativas:
      - '$10\%$'
      - '$1\%$'
      - '$90\%$'
    respuesta: '$10\%$'
    solucion_pasos:
      - '1. Razón: $100.000 / 1.000.000 = 0,10 \implies 10\%$.'
  - titulo: 'Diferenciación entre activo y pasivo'
    enunciado: '¿El pago de horas extras trabajadas constituye un ingreso activo?'
    alternativas:
      - 'Sí, porque requiere tiempo y esfuerzo laboral directo'
      - 'No, es un ingreso pasivo'
      - 'No, es un dividendo financiero'
    respuesta: 'Sí, porque requiere tiempo y esfuerzo laboral directo'
    solucion_pasos:
      - '1. Todo ingreso que exige presencia y trabajo físico o intelectual es activo.'
  - titulo: 'Impacto de la diversificación'
    enunciado: '¿Tener fuentes de ingresos pasivos permite mantener flujos de caja ante una situación de desempleo transitorio?'
    alternativas:
      - 'Sí, porque los ingresos pasivos no dependen del vínculo laboral'
      - 'No, todos los ingresos cesan automáticamente al perder el empleo'
      - 'No, los ingresos pasivos solo se pagan a empresas'
    respuesta: 'Sí, porque los ingresos pasivos no dependen del vínculo laboral'
    solucion_pasos:
      - '1. Los ingresos de capital continúan devengándose de forma autónoma.'
errores_frecuentes:
  - 'Las comisiones variables por ventas se registran como salario base garantizado en la proyección presupuestaria.'
  - 'Los intereses obtenidos por un depósito bancario se clasifican erróneamente como ingresos derivados del factor trabajo.'
  - 'El retiro del capital inicial invertido se contabiliza como una ganancia o ingreso por dividendos.'
  - 'Los ingresos pasivos requieren obligatoriamente una jornada laboral de tiempo completo para ser percibidos.'
  - 'La suma de ingresos personales omite las rentas provenientes del arriendo de bienes inmuebles.'
afirmaciones_verdaderas:
  - 'El ingreso total es la suma de los flujos activos derivados del trabajo y los flujos pasivos generados por el capital ($I_T = I_{\text{activo}} + I_{\text{pasivo}}$).'
  - 'Los dividendos y los intereses financieros constituyen ingresos pasivos al no depender del intercambio directo de horas de trabajo.'
