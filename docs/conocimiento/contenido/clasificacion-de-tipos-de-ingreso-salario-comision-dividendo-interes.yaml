semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_INGRESO
resumen_inicial: 'Clasificación de tipos de ingreso (salario, comisión, dividendo,
  interés): concepto y propiedades fundamentales en Finanzas personales.'
explicacion_simple: El dinero puede llegar a tu bolsillo por distintas vías. Entender
  si ese dinero es seguro (un sueldo) o depende de tu esfuerzo mes a mes (una comisión)
  cambia por completo cómo debes planificar tu vida.
explicacion_formal: "Al armar un presupuesto, los **ingresos (entradas de dinero)**\
  \ dictan tu nivel de vida. Se dividen en:\n\n- **Ingresos Fijos:** Dinero que recibes\
  \ regularmente y cuyo monto es seguro y predecible. El mejor ejemplo es el **salario\
  \ o sueldo base** mensual de un empleado contratado, o una pensión de jubilación.\n\
  - **Ingresos Variables:** Dinero que puede cambiar de mes a mes o no estar garantizado.\n\
  \  - **Comisión:** Dinero extra que se paga por lograr metas de ventas.\n  - **Horas\
  \ Extras:** Dinero por trabajar más allá del horario fijo.\n  - **Honorarios / Freelance:**\
  \ Ingresos de un trabajador independiente (un mes puede tener muchos clientes y\
  \ otro mes ninguno).\n  - **Dividendos e Intereses:** Ganancias variables por tener\
  \ acciones en empresas o dinero invertido en depósitos a plazo."
definiciones_clave: '- **Clasificación de tipos de ingreso (salario, comisión, dividendo,
  interés)**: Elemento central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a clasificación de tipos de ingreso (salario, comisión, dividendo, interés).'
