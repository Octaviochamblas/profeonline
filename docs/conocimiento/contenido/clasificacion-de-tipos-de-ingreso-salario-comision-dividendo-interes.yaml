semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_INGRESO
resumen_inicial: 'Clasificación de tipos de ingreso (salario, comisión, dividendo, interés):
  concepto y propiedades fundamentales en Finanzas personales.'
explicacion_simple: El dinero puede llegar a tu bolsillo por distintas vías. Entender si ese
  dinero es seguro (un sueldo) o depende de tu esfuerzo mes a mes (una comisión) cambia por
  completo cómo debes planificar tu vida.
explicacion_formal: "Al armar un presupuesto, los **ingresos (entradas de dinero)** dictan\
  \ tu nivel de vida. Se dividen en:\n\n- **Ingresos Fijos:** Dinero que recibes regularmente\
  \ y cuyo monto es seguro y predecible. El mejor ejemplo es el **salario o sueldo base**\
  \ mensual de un empleado contratado, o una pensión de jubilación.\n- **Ingresos Variables:**\
  \ Dinero que puede cambiar de mes a mes o no estar garantizado.\n  - **Comisión:** Dinero\
  \ extra que se paga por lograr metas de ventas.\n  - **Horas Extras:** Dinero por trabajar\
  \ más allá del horario fijo.\n  - **Honorarios / Freelance:** Ingresos de un trabajador\
  \ independiente (un mes puede tener muchos clientes y otro mes ninguno).\n  - **Dividendos\
  \ e Intereses:** Ganancias variables por tener acciones en empresas o dinero invertido en\
  \ depósitos a plazo."
definiciones_clave: '- **Clasificación de tipos de ingreso (salario, comisión, dividendo,
  interés)**: Elemento central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a clasificación de tipos de ingreso (salario, comisión, dividendo, interés).'
ejemplo_guiado:
  enunciado: Una persona trabaja con contrato y recibe 450.000 pesos mensuales fijos, más
    una comisión de 80.000 pesos este mes por cumplir metas de ventas. Clasifica ambos ingresos.
  pasos:
  - 'Identifico los 450.000: están garantizados por contrato cada mes, por lo tanto es un
    ingreso fijo.'
  - 'Identifico los 80.000 de comisión: dependen del cumplimiento de metas y pueden variar
    cada mes, por lo tanto es un ingreso variable.'
  - Concluyo que el ingreso total de este mes es 530.000, pero el presupuesto debe planificarse
    solo con el monto fijo garantizado.
