semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.INVERSO_MULTIPLICATIVO
resumen_inicial: "El inverso multiplicativo o recíproco de un número racional no nula es aquel número que al multiplicarse por el racional original da como resultado uno."
explicacion_simple: |
  El **inverso multiplicativo** (recíproco) de una fracción no nula se obtiene invirtiendo las posiciones del numerador y denominador. Si tienes $\frac{4}{7}$, su inverso multiplicativo es $\frac{7}{4}$. Se le llama inverso multiplicativo porque si los multiplicas ($\frac{4}{7} \times \frac{7}{4}$), el resultado es **1**. El cero es el único número racional que no tiene inverso multiplicativo.
explicacion_formal: |
  Formalmente, para todo número racional no nulo $q = \frac{a}{b} \in \mathbb{Q} \setminus \{0\}$ (con $a, b \neq 0$), existe un único elemento llamado **inverso multiplicativo** o **recíproco**, denotado por $q^{-1} = \left(\frac{a}{b}\right)^{-1} = \frac{b}{a}$, tal que:
  $$q \cdot q^{-1} = q^{-1} \cdot q = 1$$

  Estructura de Cuerpo: la existencia de inversos multiplicativos para todos los elementos no nulos distingue a $\mathbb{Q}$ de $\mathbb{Z}$ (pues en $\mathbb{Z}$ solo el $1$ y el $-1$ tienen inversos enteros).
definiciones_clave: |
  - **Inverso multiplicativo (Recíproco)**: Fracción $\frac{b}{a}$ asociada a $\frac{a}{b}$ que satisface $\frac{a}{b} \cdot \frac{b}{a} = 1$.
  - **Propiedad del elemento inverso en $\mathbb{Q}^*$**: Axioma que consagra la existencia de recíprocos para todo elemento distinto de cero.
  - **División como multiplicación por el inverso**: Definición formal $q_1 \div q_2 = q_1 \cdot q_2^{-1}$.
propiedades_relaciones: |
  - **Involución del recíproco**: $(q^{-1})^{-1} = q$ para todo $q \neq 0$.
  - **Mantenimiento estricto del signo**: Un racional positivo posee un recíproco positivo y un racional negativo posee un recíproco negativo.
  - **Inexistencia del recíproco del cero**: El cero $0 \in \mathbb{Q}$ carece de inverso multiplicativo puesto que no existe ningún $x \in \mathbb{Q}$ tal que $0 \cdot x = 1$.
ejemplo_guiado:
  enunciado: "Encuentra el inverso multiplicativo de $q = -\\frac{3}{10}$, demuestra la propiedad fundamental multiplicándolos y calcula el inverso de $q^{-1}$."
  pasos:
    - "Hallar el recíproco invirtiendo numerador y denominador manteniendo el signo: $q^{-1} = -\\frac{10}{3}$."
    - "Verificar multiplicando ambos números: $\\left(-\\frac{3}{10}\\right) \\cdot \\left(-\\frac{10}{3}\\right) = +\\frac{30}{30} = 1$."
    - "Calcular el inverso del inverso $\\left(q^{-1}\\right)^{-1}$: inviertes $-\\frac{10}{3}$ obteniendo $-\\frac{3}{10}$."
    - "Concluir: se confirma la propiedad de involución $\\left(q^{-1}\\right)^{-1} = q$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué axioma algebraico cumple el inverso multiplicativo $q^{-1}$ de un racional no nulo $q \\in \\mathbb{Q} \\setminus \\{0\\}$?"
    choices:
      - {text: "Que $q \\cdot q^{-1} = 1$, es decir, su producto es la identidad multiplicativa.", is_correct: true}
      - {text: "Que $q + q^{-1} = 0$.", is_correct: false}
      - {text: "Que $q \\cdot q^{-1} = 0$.", is_correct: false}
      - {text: "Que $q^{-1}$ siempre es un número entero negativo.", is_correct: false}
    explanation: 'La correcta es Que $q \cdot q^{-1} = 1$, es decir, su producto es la identidad multiplicativa.: define el axioma del inverso multiplicativo en $\mathbb{Q}$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el inverso multiplicativo de la fracción impropia $\\frac{12}{5}$?"
    choices:
      - {text: "\\frac{5}{12}", is_correct: true}
      - {text: "-\\frac{12}{5}", is_correct: false}
      - {text: "-\\frac{5}{12}", is_correct: false}
      - {text: "\\frac{1}{5}", is_correct: false}
    explanation: "La correcta es \\frac{5}{12}: invertimos las posiciones del numerador y denominador manteniendo el signo positivo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Verificar que la fracción no sea igual a cero."
  - 'Paso 2: Si el número está expresado como entero $n$, escribirlo en forma fraccionaria $\frac{n}{1}$.'
  - "Paso 3: Intercambiar de lugar los términos: el numerador pasa al denominador y el denominador pasa al numerador."
  - "Paso 4: Conservar el mismo signo original."
  - "Paso 5: Comprobar que el producto de ambos números da $1$."
errores_correccion: |
  Un error recurrente es cambiarle el signo a la fracción al pedir el inverso multiplicativo. Recuerda: **el inverso multiplicativo NO cambia el signo**, solo invierte de posición el numerador y el denominador.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál es el inverso multiplicativo de $-\\frac{7}{2}$?"
    alternativas:
      - "-\\frac{2}{7}"
      - "\\frac{2}{7}"
      - "\\frac{7}{2}"
    respuesta: "-\\frac{2}{7}"
    solucion_pasos:
      - "Invertimos los términos conservando el signo negativo: $-\\frac{2}{7}$."
      - "Verificamos: $\\left(-\\frac{7}{2}\\right) \\cdot \\left(-\\frac{2}{7}\\right) = +1$."
  - titulo: "Ejemplo 2"
    enunciado: "Resuelve la división $\\frac{3}{8} \\div \\frac{5}{4}$ transformándola en multiplicación por el inverso multiplicativo."
    alternativas:
      - "\\frac{3}{10}"
      - "\\frac{15}{32}"
      - "\\frac{10}{3}"
    respuesta: "\\frac{3}{10}"
    solucion_pasos:
      - "El inverso multiplicativo del divisor $\\frac{5}{4}$ es $\\frac{4}{5}$."
      - "Multiplicamos: $\\frac{3}{8} \\cdot \\frac{4}{5} = \\frac{12}{40} = \\frac{3}{10}$."
  - titulo: "¿Por qué el conjunto de los enteros $\\mathbb{Z}$ no es un cuerpo algebraico respecto a la multiplicación?"
    respuesta: 'Porque en $\mathbb{Z}$ la mayoría de los elementos no tienen inverso multiplicativo entero (por ejemplo, el inverso de 2 es $\frac{1}{2} \notin \mathbb{Z}$).'
    solucion_pasos:
      - "En $\\mathbb{Z}$ solo 1 y -1 poseen inverso multiplicativo entero, mientras que en $\\mathbb{Q}$ todos los elementos no nulos lo poseen."
  - titulo: "¿Es el número $-1$ su propio inverso multiplicativo?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, el recíproco de $-1 = -\\frac{1}{1}$ es $-\\frac{1}{1} = -1$, y $(-1) \\cdot (-1) = 1$."
errores_frecuentes:
  - "Confundir el inverso multiplicativo (recíproco) con el inverso aditivo (opuesto de signo)."
  - "Cambiar el signo de la fracción al hallar el recíproco."
  - "Intentar hallar el inverso multiplicativo de 0."
  - "No convertir números mixtos a fracciones impropias antes de invertir."
  - "Creer que invertir una fracción propia la convierte en un número negativo."
afirmaciones_verdaderas:
  - "Todo número racional no nulo $q$ posee un único inverso multiplicativo $q^{-1}$ en $\\mathbb{Q}$ que cumple $q \\cdot q^{-1} = 1$."
  - "El inverso multiplicativo conserva exactamente el mismo signo del número racional original."
al_terminar_debes_ponder: |
  Debes ser capaz de identificar el inverso multiplicativo de cualquier número racional no nulo y fundamentar por qué $\mathbb{Q}$ constituye un cuerpo algebraico.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
