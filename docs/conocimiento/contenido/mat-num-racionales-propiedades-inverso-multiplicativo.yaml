semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.INVERSO_MULTIPLICATIVO
resumen_inicial: 'Todo racional no nulo $q = \frac{a}{b}$ posee un único inverso multiplicativo (recíproco) $q^{-1} = \frac{b}{a}$ tal que su producto es igual a uno: $q \cdot q^{-1} = 1$.'
explicacion_simple: 'El inverso multiplicativo o recíproco de un número racional distinto de cero es la fracción invertida. Al multiplicar cualquier fracción por su recíproco, el producto final da siempre exactamente 1.


  ![Inverso multiplicativo de un número racional no nulo](/static/img/nodos/inverso-multiplicativo-de-un-numero-racional-no-nulo-intro.svg)'
explicacion_formal: 'Para todo racional no nulo $q = \frac{a}{b} \in \mathbb{Q} \setminus \{0\}$ (con $a, b \neq 0$), existe un **Inverso Multiplicativo** $q^{-1} = \frac{b}{a} \in \mathbb{Q}$ tal que:


  $$q \cdot q^{-1} = \frac{a}{b} \cdot \frac{b}{a} = \frac{a \cdot b}{b \cdot a} = 1$$


  **Desglose de la fórmula:**

  - $q^{-1} = \frac{b}{a}$: Inversión de términos con $a \neq 0$.

  - Condición de existencia: $q \neq 0$ (el cero carece de inverso multiplicativo).


  > **Complemento didáctico:** La existencia de inverso multiplicativo para todo elemento no nulo convierte a $(\mathbb{Q}, +, \cdot)$ en un **Cuerpo (Field)**.'
definiciones_clave: '- **Inverso multiplicativo (recíproco)**: El elemento $q^{-1} = \frac{b}{a}$ que al multiplicarse por $q \neq 0$ produce el neutro multiplicativo $1$.'
propiedades_relaciones: '- **Estructura de Cuerpo**: La existencia de $q^{-1}$ para todo $q \neq 0$ distingue a $\mathbb{Q}$ de $\mathbb{Z}$.'
ejemplo_guiado:
  enunciado: 'Halle el inverso multiplicativo de $-\frac{4}{9}$ y demuestre que el producto es $1$.


    ![Ejemplo Inverso multiplicativo de un número racional no nulo](/static/img/nodos/inverso-multiplicativo-de-un-numero-racional-no-nulo-ejemplos.svg)'
  pasos:
  - 'Paso 1: Invertir numerador y denominador conservando el signo negativo: $-\frac{9}{4}$.'
  - 'Paso 2: Multiplicar ambas fracciones: $\left(-\frac{4}{9}\right) \cdot \left(-\frac{9}{4}\right) = +\frac{36}{36}$.'
  - 'Paso 3: Calcular la división: $\frac{36}{36} = 1$.'
  - 'Conclusión: El inverso multiplicativo de $-\frac{4}{9}$ es $-\frac{9}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición exige la propiedad del inverso multiplicativo sobre el racional q?
  choices:
  - text: Que q sea distinto de cero (q != 0)
    is_correct: true
  - text: Que q sea un número entero par
    is_correct: false
  - text: Que q sea menor que cero únicamente
    is_correct: false
  - text: Que el denominador sea 100
    is_correct: false
  explanation: La alternativa correcta es 'Que q sea distinto de cero (q != 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -4/9, ¿cuál es su inverso multiplicativo?
  choices:
  - text: -9/4
    is_correct: true
  - text: 4/9
    is_correct: false
  - text: 9/4
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '-9/4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la fracción sea no nula $q \neq 0$.'
- 'Paso 2: Intercambiar las posiciones del numerador y denominador manteniendo su signo.'
- 'Paso 3: Comprobar que $q \cdot q^{-1} = 1$ para validar la recíproca.'
errores_correccion: '- **Error 1: Cambiar el signo de la fracción al buscar el inverso multiplicativo.** **Cómo corregirlo:** El inverso multiplicativo conserva el MISMO SIGNO; el opuesto aditivo es el que cambia de signo.


  - **Error 2: Afirmar que el cero tiene inverso multiplicativo.** **Cómo corregirlo:** El cero es el ÚNICO elemento en $\mathbb{Q}$ sin inverso multiplicativo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el inverso multiplicativo de 2/5?
  alternativas:
  - 5/2
  - -2/5
  - -5/2
  respuesta: 5/2
  solucion_pasos:
  - 'Se invierten numerador y denominador: $\frac{5}{2}$.'
- titulo: Ejemplo 2
  enunciado: Calcule el producto de -3/7 por su inverso multiplicativo.
  alternativas:
  - '1'
  - '0'
  - '-1'
  respuesta: '1'
  solucion_pasos:
  - $\left(-\frac{3}{7}\right) \cdot \left(-\frac{7}{3}\right) = +1$.
- titulo: ¿Tiene todo racional no nulo un inverso multiplicativo en Q?
  respuesta: Sí
  solucion_pasos:
  - Sí, para todo $q \neq 0$, $q^{-1} \in \mathbb{Q}$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
- titulo: ¿Es el recíproco de 1/6 igual al entero 6?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{6}{1} = 6$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
errores_frecuentes:
- El inverso multiplicativo de una fracción se obtiene cambiando su signo positivo a negativo.
- El número cero posee un inverso multiplicativo igual a $1/0$.
- Multiplicar una fracción por su recíproco produce siempre el valor neutro cero.
- El inverso multiplicativo de una fracción propia es siempre otra fracción propia.
- Las fracciones negativas carecen de inverso multiplicativo en $\mathbb{Q}$.
afirmaciones_verdaderas:
- Todo racional no nulo $q = \frac{a}{b}$ posee un inverso multiplicativo $q^{-1} = \frac{b}{a}$ tal que $q \cdot q^{-1} = 1$.
- El inverso multiplicativo conserva el mismo signo original de la fracción.
al_terminar_debes_poder: '**QUÉ:** Determinar el inverso multiplicativo (recíproco) de un número racional no nulo y justificar la no existencia para el cero.


  **CÓMO:** Invirtiendo los términos de la fracción $\left(\frac{a}{b}\right)^{-1} = \frac{b}{a}$ ($a, b \neq 0$) manteniendo su signo algebraico para cumplir $\left(\frac{a}{b}\right) \cdot \left(\frac{b}{a}\right) = 1$.


  ![Resumen Inverso multiplicativo de un número racional no nulo](/static/img/nodos/inverso-multiplicativo-de-un-numero-racional-no-nulo-resumen.svg)'
