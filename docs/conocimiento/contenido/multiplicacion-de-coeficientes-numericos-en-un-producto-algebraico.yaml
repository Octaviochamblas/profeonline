semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PRODUCTO_COEFICIENTES
resumen_inicial: 'La multiplicación de coeficientes numéricos en un producto algebraico consiste en calcular el producto numérico de las constantes y aplicar independientemente la ley de exponentes a la parte literal.'
explicacion_simple: |
  En todo producto de términos algebraicos (monomios), el trabajo se divide en **dos partes totalmente independientes**:
  - **Parte 1: Coeficientes numéricos (los números)**:
    - **SE MULTIPLICAN** entre sí como números comunes (aplicando la ley de los signos).
  - **Parte 2: Factores literales (las letras)**:
    - **SE UNEN** aplicando el producto de potencias de igual base (sumando exponentes).
  - **Ejemplo**: Multiplicar $(-4x^3) \cdot (3x^2)$:
    - Coeficientes: $(-4) \cdot (3) = \mathbf{-12}$.
    - Letras: $x^3 \cdot x^2 = \mathbf{x^5}$.
    - Unimos ambas partes: **$-12x^5$**.
  - **¡CUIDADO!**: Jamás debes sumar los números de adelante; los coeficientes se **MULTIPLICAN**.
explicacion_formal: |
  ### Definición formal
  Sea el producto de $k$ monomios $M_i = c_i L_i$ sobre $\mathbb{R}[x_1, \dots, x_n]$, donde $c_i \in \mathbb{R}$ son los coeficientes numéricos y $L_i = \prod x_j^{a_{ij}}$ representan los factores literales. Por la asociatividad y conmutatividad del producto sobre el cuerpo $\mathbb{R}$:

  $$\prod_{i=1}^k M_i = \prod_{i=1}^k (c_i L_i) = \left( \prod_{i=1}^k c_i \right) \cdot \left( \prod_{i=1}^k L_i \right)$$

  ### Separación de Escalares y Vectores de Potencia
  El operador producto descompone el monomio resultante en:
  1. **Coeficiente Escalar Resultante**: $C = \prod_{i=1}^k c_i \in \mathbb{R}$.
  2. **Matriz de Exponentes Consolidados**: $L = \prod_{j=1}^n x_j^{\sum_{i=1}^k a_{ij}}$.

  ### Síntesis didáctica
  La independencia operacional entre coeficientes (que se multiplican) y exponentes (que se suman) es el algoritmo base del cálculo monomial.
definiciones_clave: |
  - **Coeficiente numérico escalar ($c \in \mathbb{R}$)**: Factor constante que cuantifica la magnitud de la parte literal en un monomio.
  - **Producto de coeficientes ($C = \prod c_i$)**: Multiplicación aritmética de todas las constantes numéricas de los factores.
  - **Separación estructural**: Aislamiento formal entre las operaciones aritméticas numéricas y las leyes de exponentes literales.
propiedades_relaciones: |
  - **Absorción por coeficiente cero**: Si cualquier coeficiente numérico $c_j = 0$, todo el producto algebraico es $0$.
  - **Invarianza por coeficiente unitario**: Multiplicar por un monomio de coeficiente $1$ deja inalterado el coeficiente inicial.
ejemplo_guiado:
  enunciado: 'Calcula el producto algebraico completo: $\left(-\frac{2}{3}a^3 b\right) \cdot \left(9a b^4\right) \cdot \left(-\frac{1}{2}b^2\right)$.'
  pasos:
    - 'Paso 1: Aislando los coeficientes numéricos: $\left(-\frac{2}{3}\right) \cdot (9) \cdot \left(-\frac{1}{2}\right)$.'
    - 'Paso 2: Determinamos el signo: Dos negativos (par) $\implies$ Resultado **positivo ($+$)**.'
    - 'Paso 3: Multiplicamos y simplificamos los números: $\frac{2 \cdot 9 \cdot 1}{3 \cdot 2} = \frac{18}{6} = \mathbf{3}$.'
    - 'Paso 4: Consolidamos la parte literal para $a$: $a^3 \cdot a^1 = a^{3+1} = \mathbf{a^4}$.'
    - 'Paso 5: Consolidamos la parte literal para $b$: $b^1 \cdot b^4 \cdot b^2 = b^{1+4+2} = \mathbf{b^7}$.'
    - 'Conclusión: El producto algebraico final es **$3a^4 b^7$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación se debe aplicar sobre los coeficientes numéricos al multiplicar dos o más monomios?'
    choices:
      - {text: 'Los coeficientes numéricos se deben multiplicar entre sí aplicando las reglas de signos comunes', is_correct: true}
      - {text: 'Los coeficientes numéricos se deben sumar entre sí', is_correct: false}
      - {text: 'Los coeficientes numéricos se deben restar', is_correct: false}
      - {text: 'Los coeficientes numéricos se convierten en exponentes', is_correct: false}
    explanation: 'La alternativa correcta es ''Los coeficientes numéricos se deben multiplicar entre sí aplicando las reglas de signos comunes''. Multiplicación de escalares.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de multiplicar $(-5x^2) \cdot (4x^3)$?'
    choices:
      - {text: 'El resultado es $-20x^5$, multiplicando $(-5) \cdot 4 = -20$ y sumando $2 + 3 = 5$', is_correct: true}
      - {text: 'El resultado es $-1x^5$', is_correct: false}
      - {text: 'El resultado es $-20x^6$', is_correct: false}
      - {text: 'El resultado es $20x^5$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $-20x^5$, multiplicando $(-5) \cdot 4 = -20$ y sumando $2 + 3 = 5$''. Coeficientes $(-5) \cdot 4 = -20$, letras $x^{2+3}=x^5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer todos los coeficientes numéricos de cada uno de los monomios multiplicandos.'
  - 'Paso 2: Calcular el signo resultante mediante el conteo de coeficientes negativos.'
  - 'Paso 3: Multiplicar los valores absolutos de los números (enteros o fracciones) para obtener el coeficiente final.'
  - 'Paso 4: Multiplicar las partes literales sumando exponentes por base e integrando el monomio resultante.'
errores_correccion: |
  - **Error 1:** Sumar los coeficientes numéricos en lugar de multiplicarlos (escribir $3x \cdot 4x = 7x^2$). **Cómo corregirlo:** Los coeficientes numéricos **SE MULTIPLICAN ($3 \cdot 4 = 12 \implies 12x^2$)**.
  - **Error 2:** Intercambiar la operación de los coeficientes con la de los exponentes (multiplicar exponentes y sumar coeficientes). **Cómo corregirlo:** Los números se **MULTIPLICAN** y los exponentes se **SUMAN**.
ejemplos:
  - titulo: 'Monomios con enteros'
    enunciado: '¿Cuál es el producto de $(-6a) \cdot (-3b)$?'
    alternativas:
      - '$18ab$'
      - '$-9ab$'
      - '$9ab$'
    respuesta: '$18ab$'
    solucion_pasos:
      - '1. Coeficientes: $(-6) \cdot (-3) = +18$.'
      - '2. Letras: $a \cdot b = ab$.'
      - '3. Resultado: $18ab$.'
  - titulo: 'Monomios con tres factores'
    enunciado: '¿Cuál es el producto de $(2x) \cdot (-3x) \cdot (4x)$?'
    alternativas:
      - '$-24x^3$'
      - '$3x^3$'
      - '$-24x$'
    respuesta: '$-24x^3$'
    solucion_pasos:
      - '1. Coeficientes: $2 \cdot (-3) \cdot 4 = -24$.'
      - '2. Letras: $x^1 \cdot x^1 \cdot x^1 = x^3$.'
      - '3. Resultado: $-24x^3$.'
  - titulo: 'Coeficiente unitario implícito'
    enunciado: 'En el producto $x^2 \cdot (-5x)$, ¿se multiplica el coeficiente implícito $1 \cdot (-5) = -5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el coeficiente de $x^2$ es 1.'
  - titulo: 'Coeficiente fraccionario'
    enunciado: 'Para $\left(\frac{1}{2}x\right) \cdot (6x)$, ¿es el coeficiente resultante $\frac{1}{2} \cdot 6 = 3$ dando $3x^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{6}{2} = 3 \implies 3x^2$.'
errores_frecuentes:
  - 'Sumar los coeficientes numéricos en lugar de multiplicarlos al resolver productos de monomios.'
  - 'Multiplicar los exponentes de las variables en lugar de sumarlos por asociar erróneamente la regla con la de los coeficientes.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Los coeficientes implícitos uno o menos uno no son tomados en cuenta al multiplicar la parte numérica.'
  - 'Aplicar reglas de signos de suma sobre el producto de coeficientes.'
afirmaciones_verdaderas:
  - 'Los coeficientes numéricos de un producto algebraico se multiplican entre sí aplicando las reglas de signos.'
  - 'La multiplicación de coeficientes numéricos es una operación independiente de la adición de exponentes literales.'
al_terminar_debes_poder: 'Multiplicar los coeficientes numéricos de un producto algebraico combinando de forma independiente números y exponentes.'
