procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante multiplicación de coeficientes numéricos en un producto algebraico.** **Cómo
  corregirlo:** Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de multiplicación de coeficientes numéricos en
    un producto algebraico en 'el producto de (4x) · (-3y)'?
  alternativas:
  - -12xy
  - 12xy
  - 7xy
  - -7xy
  respuesta: -12xy
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener -12xy.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto de (4x) · (-3y)' por multiplicación de coeficientes
    numéricos en un producto algebraico, ¿qué expresión resulta?
  alternativas:
  - -12xy
  - 12xy
  - 7xy
  - -7xy
  respuesta: -12xy
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir -12xy.
- titulo: ¿Es la multiplicación en 'el producto de (4x) · (-3y)' equivalente a -12xy?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene -12xy.
- titulo: ¿Da el producto de 'el producto de (4x) · (-3y)' un resultado igual a 12xy?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es -12xy.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar multiplicación de coeficientes
  numéricos en un producto algebraico.
- Omitir distribuir el monomio o término sobre todos los sumandos en multiplicación
  de coeficientes numéricos en un producto algebraico.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La multiplicación de coeficientes numéricos en un producto algebraico requiere sumar
  los exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la multiplicación de
  coeficientes numéricos en un producto algebraico aplicando distributividad, ley
  de signos y suma de exponentes.
