semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PRODUCTO_COEFICIENTES
resumen_inicial: 'Multiplicación de coeficientes numéricos en un producto algebraico:
  leyes, procedimiento y aplicación en Leyes fundamentales de la multiplicación algebraica.'
explicacion_simple: 'En un monomio como $3x^2$, el $3$ y el $x^2$ son dos piezas distintas.
  Al multiplicar monomios, cada pieza va por su propio carril: los números se multiplican
  con números, y las letras con letras.'
explicacion_formal: '### Definición formal


  Coeficientes: $5 \times 3=15$. Variable $a$: $a^2 \cdot a = a^3$. Variable $b$:
  $b \cdot b^2=b^3$. Resultado: $15a^3b^3$.


  ### Desarrollo didáctico


  Para multiplicar $(3x^2)(4x^3)$:

  1. Coeficientes: $3 \times 4 = 12$.

  2. Parte literal: $x^2 \times x^3 = x^{2+3} = x^5$.

  3. Resultado: $12x^5$.


  Con signo: $(-5a^2)(3a) = -15a^3$.

  - Signo: $(-)( +) = -$.

  - Coeficientes: $5 \times 3 = 15$.

  - Literal: $a^2 \cdot a = a^3$.

  - Resultado: $-15a^3$.'
definiciones_clave: '- **Multiplicación de coeficientes numéricos en un producto algebraico**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación de coeficientes numéricos en un
  producto algebraico.'
