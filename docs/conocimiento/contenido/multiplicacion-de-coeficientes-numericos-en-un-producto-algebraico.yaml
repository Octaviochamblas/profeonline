resumen_inicial: La multiplicación de coeficientes numéricos en un producto algebraico
  aplica rigurosamente las leyes distributivas, de signos y de potencias en expresiones
  algebraicas.
explicacion_simple: Al trabajar con multiplicación de coeficientes numéricos en un
  producto algebraico, multiplicamos los coeficientes numéricos, aplicamos la regla
  de signos y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Multiplicación de coeficientes
  numéricos en un producto algebraico** viene dada por:


  $$\text{"el producto de (4x) · (-3y)"} \implies -12xy$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Multiplicación de coeficientes numéricos en un producto algebraico**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule multiplicación de coeficientes numéricos en un producto algebraico
    para: ''el producto de (4x) · (-3y)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es -12xy.'
