resumen_inicial: La aplicación de la regla del cuadrado de binomio diferencia simplifica
  la expansión directa de restas con coeficientes y términos de grado superior.
explicacion_simple: Para una expresión como $(4a^3 - 3b^2)^2$, elevamos el primer
  bloque completo al cuadrado ($(4a^3)^2 = 16a^6$), restamos el doble producto del
  primero por el segundo ($-24a^3b^2$) y sumamos el segundo bloque al cuadrado ($+9b^4$).
explicacion_formal: 'Para cualesquiera monomios $A = c_1 x^m$ y $B = c_2 y^n$, el
  desarrollo de $(A - B)^2$ es la identidad trinómica:


  $$(A - B)^2 = A^2 - 2AB + B^2 = (c_1 x^m)^2 - 2(c_1 x^m)(c_2 y^n) + (c_2 y^n)^2
  = c_1^2 x^{2m} - 2c_1c_2 x^m y^n + c_2^2 y^{2n}$$


  **Desglose simbólico:**

  - $c_1^2 x^{2m}$: Cuadrado del primer monomio.

  - $-2c_1c_2 x^m y^n$: Término central de diferencia con coeficiente duplicado.

  - $+c_2^2 y^{2n}$: Cuadrado del segundo monomio, de signo estrictamente positivo.


  > **Complemento didáctico:** Esta identidad garantiza la correcta resolución de
  expansiones algebraicas cuadráticas sin arrastrar errores de signo en el término
  independiente o secundario.'
definiciones_clave: '- **Doble producto en diferencia**: Término $-2AB$ con signo
  negativo precediendo la multiplicación de bloques.

  - **Leyes de exponentes en cuadráticos**: $(x^a)^2 = x^{2a}$.'
propiedades_relaciones: '- **Forma Canónica Trinómica**: Toda resta de dos términos
  reales elevada a la potencia 2 genera la forma $A^2 - 2AB + B^2$.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(4a^3 - 3b^2)^2$ aplicando la regla del cuadrado
    de binomio diferencia.
  pasos:
  - 'Paso 1: Identificar $A = 4a^3$ y $B = 3b^2$.'
  - 'Paso 2: Elevar el primer monomio al cuadrado: $(4a^3)^2 = 16a^6$.'
  - 'Paso 3: Calcular el doble producto negativo: $-2 \cdot (4a^3) \cdot (3b^2) =
    -24a^3b^2$.'
  - 'Paso 4: Elevar el segundo monomio al cuadrado: $(3b^2)^2 = 9b^4$.'
  - 'Paso 5: Ensamblar la expresión: $16a^6 - 24a^3b^2 + 9b^4$.'
  - 'Conclusión: El desarrollo completo es $16a^6 - 24a^3b^2 + 9b^4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de elevar al cuadrado el término $B = 3b^2$ en $(4a^3
    - 3b^2)^2$?
  choices:
  - text: $+9b^4$
    is_correct: true
  - text: $-9b^4$
    is_correct: false
  - text: $+6b^4$
    is_correct: false
  - text: $+9b^2$
    is_correct: false
  explanation: La alternativa correcta es '$+9b^4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $(4a^3 - 3b^2)^2$, ¿cuál fue el término central
    obtenido?
  choices:
  - text: $-24a^3b^2$
    is_correct: true
  - text: $-12a^3b^2$
    is_correct: false
  - text: $+24a^3b^2$
    is_correct: false
  - text: $-24a^6b^4$
    is_correct: false
  explanation: La alternativa correcta es '$-24a^3b^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado el coeficiente y multiplicar por 2 el exponente del
  primer monomio.'
- 'Paso 2: Restar el producto de 2 por el coeficiente del primero por el del segundo.'
- 'Paso 3: Sumar el cuadrado del coeficiente y el exponente multiplicado por 2 del
  segundo monomio.'
errores_correccion: '- **Error 1: Restar el último término escribiendo $-9b^4$.**
  **Cómo corregirlo:** Recordar que $(-3b^2)^2 = +9b^4$, por lo que el tercer término
  siempre lleva signo más.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle la expresión $(5x^2 - 2y)^2$.
  alternativas:
  - $25x^4 - 20x^2y + 4y^2$
  - $25x^4 - 4y^2$
  - $25x^4 - 10x^2y + 4y^2$
  respuesta: $25x^4 - 20x^2y + 4y^2$
  solucion_pasos:
  - 1. $(5x^2)^2 = 25x^4$.
  - 2. $-2(5x^2)(2y) = -20x^2y$.
  - '3. $(2y)^2 = 4y^2$. Resultado: $25x^4 - 20x^2y + 4y^2$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(3m^3 - 4n^2)^2$?
  alternativas:
  - $9m^6 - 24m^3n^2 + $16$n^4$
  - $9m^6 - $16$n^4$
  - $9m^5 - 24m^3n^2 + $16$n^4$
  respuesta: $9m^6 - 24m^3n^2 + $16$n^4$
  solucion_pasos:
  - 1. $(3m^3)^2 = $9$m^6$.
  - 2. $-2(3m^3)(4n^2) = -24m^3n^2$.
  - '3. $(4n^2)^2 = $16$n^4$. Resultado: $9m^6 - 24m^3n^2 + $16$n^4$.'
- titulo: ¿Es $16x^2 - 40x + 25$ el desarrollo correcto de $(4x - 5)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(4x)^2 - 2(4x)(5) + 5^2 = $16$x^2 - 40x + 25$.
- titulo: ¿El desarrollo de $(x^3 - 2)^2$ termina en $-4$?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-2)^2 = +4$, el último término es positivo.
errores_frecuentes:
- Asignar signo negativo al término $c_2^2 y^{2n}$ en el desarrollo de la diferencia.
- Declarar que $(4a^3 - 3b^2)^2$ equivale a $16a^6 - $9$b^4$.
- El coeficiente del término central en $(4a^3 - 3b^2)^2$ equivale a $-12$ en lugar
  de $-24$.
- Restar los exponentes en lugar de multiplicarlos por 2 al elevar al cuadrado.
- Declarar que $(A - B)^2$ es igual a $(A + B)^2$ sin cambiar el signo central.
afirmaciones_verdaderas:
- El desarrollo de un binomio diferencia posee exactamente un término con signo negativo
  (el doble producto).
- Los términos extremos del trinomio resultante son estrictamente positivos en los
  números reales.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla del cuadrado
  de binomio diferencia sobre monomios complejos sin cometer errores de signo.
