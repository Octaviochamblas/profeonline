procedimiento:
- 'Paso 1: Elevar al cuadrado el coeficiente numérico y duplicar los exponentes del primer término.'
- 'Paso 2: Asignar signo negativo al resultado de multiplicar por 2 los coeficientes del primer y segundo término.'
- 'Paso 3: Elevar al cuadrado el coeficiente numérico y duplicar los exponentes del segundo término asignándole signo positivo.'
- 'Paso 4: Escribir el trinomio ordenado respetando la signatura $(+, -, +)$.'
errores_correccion: '- **Error 1:** Colocar signo negativo al último término por causa de la resta del binomio (escribir $(x-3)^2
  = x^2 - 6x - 9$). **Cómo corregirlo:** El último término es **SIEMPRE POSITIVO ($+9$)**.

  - **Error 2:** Multiplicar el signo menos dentro del paréntesis dos veces cambiando el término central a positivo. **Cómo
  corregirlo:** El término central **ES NEGATIVO ($-2ab$)**.

  '
ejemplos:
- titulo: Resta con coeficientes simples
  enunciado: ¿Cuál es el trinomio de $(3x - 1)^2$?
  alternativas:
  - $9x^2 - 6x + 1$
  - $9x^2 - 1$
  - $9x^2 - 6x - 1$
  respuesta: $9x^2 - 6x + 1$
  solucion_pasos:
  - 1. $(3x)^2 = 9x^2$.
  - 2. $-2(3x)(1) = -6x$.
  - 3. $1^2 = 1$.
  - '4. Resultado: $9x^2 - 6x + 1$.'
- titulo: Resta con dos variables
  enunciado: ¿Cuál es la expansión de $(2a - 5b)^2$?
  alternativas:
  - $4a^2 - 20ab + 25b^2$
  - $4a^2 - 25b^2$
  - $4a^2 + 20ab + 25b^2$
  respuesta: $4a^2 - 20ab + 25b^2$
  solucion_pasos:
  - 1. $(2a)^2 = 4a^2$.
  - 2. $-2(2a)(5b) = -20ab$.
  - 3. $(5b)^2 = 25b^2$.
  - '4. Resultado: $4a^2 - 20ab + 25b^2$.'
- titulo: Verificación del término constante
  enunciado: En $(x - 8)^2 = x^2 - 16x + 64$, ¿proviene el $+64$ de $(-8)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cuadrado de un número negativo es positivo.
- titulo: Conservación de exponentes
  enunciado: Para $(x^4 - 3)^2$, ¿es el primer término $x^8$ por multiplicar el exponente $4 \cdot 2 = 8$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(x^4)^2 = x^8$.
errores_frecuentes:
- Asignar signo negativo al último término del trinomio resultante.
- Colocar signo positivo al término central en la expansión de una resta.
- La elevación al cuadrado del coeficiente del segundo término no se realiza.
- Multiplicar los exponentes por el coeficiente del término en vez de por 2.
- Alterar la signatura canónica $(+, -, +)$ en binomios con coeficientes fraccionarios.
afirmaciones_verdaderas:
- La regla del cuadrado de binomio diferencia genera un trinomio con patrón de signos $(+, -, +)$.
- El término central es negativo por ser el producto del término positivo $a$ por el término negativo $-b$ multiplicado por
  2.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/aplicacion-de-la-regla-del-cuadrado-de-binomio-diferencia-resumen.svg)


  QUÉ: Aplicar la regla algorítmica del cuadrado de binomio resta sobre polinomios con coeficientes y variables arbitrarias.

  CÓMO: Seguir la signatura rígida $(+, -, +)$ calculando $(c_1 x^\alpha - c_2 x^\beta)^2 = c_1^2 x^{2\alpha} - 2c_1 c_2 x^{\alpha+\beta}
  + c_2^2 x^{2\beta}$.

  '
