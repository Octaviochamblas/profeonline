procedimiento:
- 'Paso 1: Pasos para aplicar la regla a $(A-B)^2$:'
- 'Paso 2: Eleva el primer término al cuadrado: $(A)^2$.'
- 'Paso 3: Escribe un signo MENOS y luego el doble producto de los términos sin signo:
  $-2(A)(B)$.'
- 'Paso 4: Escribe un signo MÁS y eleva el segundo término (sin signo) al cuadrado:
  $+(B)^2$.'
- 'Paso 5: Junta todo en un trinomio.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en aplicación de la regla del cuadrado de binomio diferencia.
ejemplos:
- titulo: Aplicación paso a paso
  enunciado: Desarrolla el producto notable $(p - 6)^2$.
  solucion_pasos:
  - 'Primer término: $p$. Segundo término: $6$.'
  - 'Cuadrado del primero: $p^2$.'
  - 'Menos el doble producto: $-2(p)(6) = -12p$.'
  - 'Más cuadrado del segundo: $6^2 = 36$.'
  - 'Resultado: $p^2 - 12p + 36$.'
- titulo: Términos con exponentes
  enunciado: Calcula $(x^3 - 5y)^2$.
  solucion_pasos:
  - $(x^3)^2 = x^6$.
  - $-2(x^3)(5y) = -10x^3y$.
  - $(5y)^2 = +25y^2$.
  - 'Resultado: $x^6 - 10x^3y + 25y^2$.'
- titulo: 'Respecto de «Aplicación de la regla del cuadrado de binomio diferencia»:
    ¿Se ajusta a la def'
  enunciado: 'Respecto de «Aplicación de la regla del cuadrado de binomio diferencia»:
    ¿Se ajusta a la definición esta afirmación? «La regla para $(a-b)^2$ es: **''El
    cuadrado del primer término, MENOS el doble del primero por el segundo, MÁS el
    cuadrado del segundo término.''** Fórmula: $(a-b)^2 = a^2 - 2ab + b^2$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La regla para $(a-b)^2$ es:
    **''El cuadrado del primer término, MENOS el doble del primero por el segundo,
    MÁS el cuadrado del segundo término.''** Fórmula: $(a-b)^2 = a^2 - 2ab + b^2$'
- titulo: 'Respecto de «Aplicación de la regla del cuadrado de binomio diferencia»:
    ¿Es compatible con'
  enunciado: 'Respecto de «Aplicación de la regla del cuadrado de binomio diferencia»:
    ¿Es compatible con el procedimiento esta afirmación? «Poner el último término
    como negativo, escribiendo erróneamente $a^2 - 2ab - b^2$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La regla para $(a-b)^2$ es:
    **''El cuadrado del primer término, MENOS el doble del primero por el segundo,
    MÁS el cuadrado del segundo término.''** Fórmula: $(a-b)^2 = a^2 - 2ab + b^2$'
errores_frecuentes:
- Poner el último término como negativo, escribiendo erróneamente $a^2 - 2ab - b^2$.
- El primer término al cuadrado.
- El segundo término al cuadrado.
- Todos los términos.
- Porque la fórmula manda poner un más obligatoriamente, sin justificación matemática.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
al_terminar_debes_ponder: Reconocer y expandir expresiones utilizando aplicación de
  la regla del cuadrado de binomio diferencia.
