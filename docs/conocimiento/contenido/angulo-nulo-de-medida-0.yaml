semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.NULO
resumen_inicial: Un ángulo nulo es aquel cuya medida es exactamente 0°, formado por
  dos rayos coincidentes que comparten el mismo vértice y dirección.
explicacion_simple: '![Ángulo Nulo](/static/img/nodos/angulo-nulo-de-medida-0-intro.svg)


  Imagina las dos agujas de un reloj superpuestas exactamente a las 12:00. Al no existir
  separación o giro entre ellas, la abertura entre ambas es cero. En geometría, esto
  se llama ángulo nulo.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **nulo** si los rayos inicial $\vec{OA}$ y terminal $\vec{OB}$
  son coincidentes (tienen la misma dirección y sentido), no existiendo rotación angular
  entre ellos:


  $$\mu(\angle AOB) = 0^\circ = 0 \text{ rad} \iff \vec{OA} = \vec{OB}$$


  ### Desglose simbólico y geométrico

  - $\mu(\angle AOB) = 0^\circ$: Medida escalar nula en el sistema sexagesimal.

  - $\vec{OA} = \vec{OB}$: Identidad vectorial y conjuntista total entre ambos lados.

  - Región interior vacía: $\operatorname{Int}(\angle AOB) = \emptyset$.


  ### Síntesis didáctica

  El ángulo nulo representa el estado de reposo o rotación cero en el plano, sirviendo
  como elemento neutro aditivo en el álgebra de medidas angulares.'
definiciones_clave: '- **Ángulo nulo**: Ángulo de medida exacta $\theta = 0^\circ$.

  - **Rayos coincidentes**: Dos rayos que tienen el mismo origen y pasan por los mismos
  puntos en el espacio. '
propiedades_relaciones: '- **Abertura nula**: La distancia angular entre ambos rayos
  es cero.

  - **Elemento neutro**: Actúa como el elemento neutro en la suma de ángulos: $\alpha
  + 0^\circ = \alpha$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Nulo](/static/img/nodos/angulo-nulo-de-medida-0-ejemplos.svg)


    Dos vectores de fuerza $\vec{F}_1$ y $\vec{F}_2$ actúan sobre un mismo punto $O$
    tirando exactamente en la misma dirección horizontal este. Determina el tipo de
    ángulo que forman entre sí y su medida en grados.'
  pasos:
  - 'Paso 1: Identificar que ambos vectores nacen en el mismo punto de origen $O$.'
  - 'Paso 2: Observar que ambos apuntan exactamente en el mismo sentido y dirección
    horizontal.'
  - 'Paso 3: Concluir que no existe separación angular entre ellos, por lo que forman
    un ángulo nulo de $0^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición geométrica caracteriza a un ángulo nulo?
  choices:
  - text: Dos rayos coincidentes con medida exacta de 0°
    is_correct: true
  - text: Dos rayos opuestos que forman una línea recta de 180°
    is_correct: false
  - text: Dos rayos perpendiculares que forman 90°
    is_correct: false
  - text: Un giro completo que da una vuelta de 360°
    is_correct: false
  explanation: Un ángulo nulo se define por tener dos rayos coincidentes con medida
    exacta de 0°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos rayos parten de O en la misma dirección exacta, ¿cuál es la medida
    angular entre ellos?
  choices:
  - text: 0° (ángulo nulo)
    is_correct: true
  - text: 180° (ángulo extendido)
    is_correct: false
  - text: 90° (ángulo recto)
    is_correct: false
  - text: 360° (vuelta completa con giro)
    is_correct: false
  explanation: Al no haber rotación, la medida entre ambos rayos es 0° (ángulo nulo).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la posición relativa de ambos rayos desde el vértice común.'
- 'Paso 2: Verificar si existe separación angular o si ambos rayos están superpuestos.'
- 'Paso 3: Clasificar como ángulo nulo si la medida es exactamente $0^\circ$.'
errores_correccion: No confundas el ángulo nulo (0°) con el ángulo extendido (180°,
  donde los rayos apuntan en sentidos opuestos).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto mide un ángulo nulo?
  alternativas:
  - $0^\circ$
  - $90^\circ$
  - $180^\circ$
  respuesta: $0^\circ$
  solucion_pasos:
  - Por definición geométrica, el ángulo nulo mide exactamente $0^\circ$.
- titulo: Ejemplo 2
  enunciado: Si $\alpha$ es un ángulo nulo y $\beta = 45^\circ$, ¿cuánto vale $\alpha
    + \beta$?
  alternativas:
  - $45^\circ$
  - $0^\circ$
  - $90^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $\alpha + \beta = 0^\circ + 45^\circ = 45^\circ$.
- titulo: ¿Un ángulo nulo tiene vértice?
  respuesta: Sí
  solucion_pasos:
  - Sí, el vértice es el punto de origen común donde coinciden ambos rayos.
- titulo: ¿Un ángulo de 180° es un ángulo nulo?
  respuesta: 'No'
  solucion_pasos:
  - No, $180^\circ$ es un ángulo extendido o llano.
errores_frecuentes:
- Confundir ángulo nulo ($0^\circ$) con ángulo extendido ($180^\circ$).
- Afirmar que un ángulo nulo no tiene rayos o que no existe.
- Confundir la coincidencia de rayos con una rotación completa de $360^\circ$.
- Creer que alargar los rayos genera una abertura mayor que $0^\circ$.
- Olvidar que el ángulo nulo es el elemento neutro de la suma angular.
afirmaciones_verdaderas:
- Un ángulo nulo mide exactamente $0^\circ$.
- En un ángulo nulo los dos rayos comparten el mismo origen y la misma dirección.
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y operar con ángulos nulos
  de medida exacta $0^\circ$.


  **CÓMO:** Verificando la coincidencia geométrica de los rayos $\vec{OA} = \vec{OB}$
  y aplicando $\theta = 0^\circ$ en relaciones angulares.


  ![Resumen de Ángulo Nulo](/static/img/nodos/angulo-nulo-de-medida-0-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
