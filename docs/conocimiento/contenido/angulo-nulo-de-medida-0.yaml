semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.NULO
resumen_inicial: El ángulo nulo describe la ausencia de rotación (0°) entre dos rayos
  coincidentes, representando el estado inicial de referencia en la medición angular.
explicacion_simple: Imagina un abanico completamente cerrado. Ambos bordes están uno
  sobre el otro y no hay ninguna separación entre ellos. Esa abertura inexistente
  es un ángulo nulo.
explicacion_formal: Un ángulo es **nulo** si su medida es exactamente $m(\angle AOB)
  = 0^\circ$. En esta configuración, el rayo inicial $\vec{OA}$ y el rayo final $\vec{OB}$
  son coincidentes ($\vec{OA} = \vec{OB}$), por lo que la región interior del ángulo
  es vacía.
definiciones_clave: '- **Ángulo nulo**: Ángulo de medida exactamente igual a $0^\circ$.

  - **Rayos coincidentes**: Dos rayos que comparten el mismo origen y la misma dirección
  en el plano.'
propiedades_relaciones: '- **Sin abertura**: La región interior del ángulo nulo es
  vacía.

  - **Elemento neutro**: Sumar un ángulo nulo a cualquier ángulo $\alpha$ no altera
  su medida ($\alpha + 0^\circ = \alpha$).'
ejemplo_guiado:
  enunciado: Un puntero láser apunta hacia un objetivo sobre el suelo a $0^\circ$.
    Si un segundo láser se alinea exactamente sobre la misma trayectoria del primero
    sin desviación, calcula la abertura angular $x$ existente entre ambos haces.
  pasos:
  - 'Paso 1: Identificar que al estar superpuestos en la misma dirección, no hay separación
    ni rotación entre ambos rayos.'
  - 'Paso 2: Aplicar la definición de ángulo nulo, cuya abertura es exactamente de
    $0^\circ$.'
  - 'Paso 3: Concluir que la abertura angular entre ambos haces es $x = 0^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la característica fundamental de los lados de un ángulo nulo?
  choices:
  - text: Son rayos coincidentes en la misma dirección con medida 0°
    is_correct: true
  - text: Son rayos perpendiculares entre sí que forman 90°
    is_correct: false
  - text: Son rayos opuestos que forman una línea recta de 180°
    is_correct: false
  - text: Son segmentos de distintas longitudes
    is_correct: false
  explanation: La alternativa correcta es 'Son rayos coincidentes en la misma dirección
    con medida 0°'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos haces de luz coinciden en la misma trayectoria exactamente superpuestos,
    ¿cuánto mide el ángulo entre ellos?
  choices:
  - text: 0° (ángulo nulo)
    is_correct: true
  - text: 90°
    is_correct: false
  - text: 180°
    is_correct: false
  - text: 360°
    is_correct: false
  explanation: La alternativa correcta es '0° (ángulo nulo)', al no haber separación
    entre los rayos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la medida del ángulo dada en el problema.'
- 'Paso 2: Verificar si la medida es exactamente igual a $0^\circ$.'
- 'Paso 3: Clasificar el ángulo como ángulo nulo.'
errores_correccion: 'No confundas el ángulo nulo (0°) con el ángulo completo (360°):
  en el nulo no hubo rotación, en el completo hubo un giro entero.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto mide un ángulo nulo?
  alternativas:
  - 0°
  - 90°
  - 180°
  respuesta: 0°
  solucion_pasos:
  - Por definición, un ángulo nulo mide exactamente 0°.
- titulo: Ejemplo 2
  enunciado: Si el rayo $\vec{{OA}}$ y el rayo $\vec{{OB}}$ apuntan exactamente a
    la misma posición sobre el eje X positivo, ¿cuál es su ángulo?
  alternativas:
  - 0°
  - 90°
  - 360°
  respuesta: 0°
  solucion_pasos:
  - Al coincidir sin giro previo, el ángulo formado es de 0° (nulo).
- titulo: ¿Un ángulo nulo tiene una medida igual a 0°?
  respuesta: Sí
  solucion_pasos:
  - Sí, la medida de todo ángulo nulo es 0°.
- titulo: ¿Un ángulo nulo es lo mismo que un ángulo recto?
  respuesta: 'No'
  solucion_pasos:
  - No, el ángulo recto mide 90° y el nulo mide 0°.
errores_frecuentes:
- Declarar el ángulo nulo (0°) con el ángulo completo (360°).
- Declarar que un ángulo nulo no tiene vértice.
- Declarar que un ángulo nulo puede medir un valor pequeño como 0.5°.
- Afirmar que los rayos de un ángulo nulo son perpendiculares.
- Declarar el número cero en una ecuación con un ángulo nulo inexistente.
afirmaciones_verdaderas:
- La medida de un ángulo nulo es exactamente 0°.
- Los lados de un ángulo nulo son dos rayos coincidentes con el mismo punto de origen.
al_terminar_debes_poder: Al finalizar este recurso podrás reconocer e identificar
  el ángulo nulo de 0° y diferenciarlo de otros tipos de ángulos.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
