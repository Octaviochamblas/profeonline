procedimiento:
- 'Paso 1: Elige la variable respecto de la cual vas a ordenar ambos polinomios.'
- 'Paso 2: Reescribe cada factor en orden descendente de exponentes, manteniendo intactos
  coeficientes y signos.'
- 'Paso 3: Completa mentalmente o por escrito los grados faltantes si eso ayuda a
  conservar la alineación.'
- 'Paso 4: Multiplica los polinomios ya ordenados con el método elegido, cuidando
  la correspondencia entre grados.'
- 'Paso 5: Reúne y reduce los términos semejantes para obtener un resultado final
  ordenado.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en ordenamiento de factores en el producto de polinomios.
ejemplos:
- titulo: Ordenar para el producto vertical
  enunciado: 'Multiplica: (2 - a + a^2)(a + 1).'
  solucion_pasos:
  - 'Ordenamos trinomio: a^2 - a + 2.'
  - 'Ordenamos binomio: a + 1.'
  - 'Multiplicación 1 (por 1): a^2 - a + 2.'
  - 'Multiplicación 2 (por a): a^3 - a^2 + 2a.'
  - 'Sumamos: a^3 + 0a^2 + a + 2 = a^3 + a + 2.'
- titulo: La ganancia neta de una fábrica se describe como $G = (p + 3)(p^2 - 2p +
    4)$. Al resolver el
  enunciado: 'La ganancia neta de una fábrica se describe como $G = (p + 3)(p^2 -
    2p + 4)$. Al resolver el producto ordenado de manera equivalente, ¿cuál es la
    expresión resultante? (v1)


    Opciones: A) $p^3 + p^2 - 2p + 12$ · B) $p^3 + p^2 + 2p + 12$ · C) $p^3 - p^2
    - 2p + 12$ · D) $p^3 + 12$'
  solucion_pasos:
  - 'Multiplicamos: $p(p^2-2p+4) = p^3-2p^2+4p$. $3(p^2-2p+4) = 3p^2-6p+12$. Sumamos:
    $p^3 + (-2+3)p^2 + (4-6)p + 12 = p^3 + p^2 - 2p + 12$.'
  - 'Respuesta: $p^3 + p^2 - 2p + 12$'
- titulo: 'Respecto de «Ordenamiento de factores en el producto de polinomios»: ¿Describe
    adecuadamente'
  enunciado: 'Respecto de «Ordenamiento de factores en el producto de polinomios»:
    ¿Describe adecuadamente el concepto esta frase? «El **Ordenamiento de Factores**
    en la multiplicación exige ordenar cada polinomio factor en orden descendente
    respecto a una misma variable»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Ordenamiento de Factores**
    en la multiplicación exige ordenar cada polinomio factor en orden descendente
    respecto a una misma variable.'
- titulo: 'Respecto de «Ordenamiento de factores en el producto de polinomios»: ¿Se
    puede aceptar esta'
  enunciado: 'Respecto de «Ordenamiento de factores en el producto de polinomios»:
    ¿Se puede aceptar esta afirmación? «Multiplicar los polinomios en el orden desordenado
    original, dificultando la suma de términos semejantes»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Ordenamiento de Factores**
    en la multiplicación exige ordenar cada polinomio factor en orden descendente
    respecto a una misma variable.'
errores_frecuentes:
- Multiplicar los polinomios en el orden desordenado original, dificultando la suma
  de términos semejantes.
- Cambiar los signos de los términos al reordenarlos dentro del polinomio.
- Para «¿Cuál es el beneficio de ordenar los polinomios de forma descendente antes
  de multiplicarlos verticalmente? (v1)», la respuesta correcta es Permite multiplicar
  solo los coeficientes de igual grado.
- Para «¿Cuál es el beneficio de ordenar los polinomios de forma descendente antes
  de multiplicarlos verticalmente? (v1)», la respuesta correcta es Elimina la necesidad
  de aplicar la propiedad distributiva.
- Para «¿Cuál es el beneficio de ordenar los polinomios de forma descendente antes
  de multiplicarlos verticalmente? (v1)», la respuesta correcta es Cambia el grado
  final del producto.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
al_terminar_debes_ponder: Resolver productos algebraicos utilizando ordenamiento de
  factores en el producto de polinomios.
