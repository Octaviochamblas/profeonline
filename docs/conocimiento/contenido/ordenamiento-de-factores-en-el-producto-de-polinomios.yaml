semantic_id: MAT.ALG.MULT_POLINOMIOS.ORDENAMIENTO_FACTORES
resumen_inicial: 'Ordenamiento de factores en el producto de polinomios: leyes, procedimiento
  y aplicación en Multiplicación de polinomios.'
explicacion_simple: Si intentas multiplicar polinomios desordenados, te arriesgas
  a perder la pista de qué término va con cuál. La forma más segura y ordenada de
  multiplicar es organizar ambos polinomios por grados, de mayor a menor.
explicacion_formal: '### Definición formal


  Sea $P(x)=\sum_{i=1}^{r} a_i x^{\alpha_i}$ un polinomio. Ordenar $P$ respecto de
  la variable $x$ significa reindexar sus términos de modo que $\alpha_1\geq\alpha_2\geq\cdots\geq\alpha_r$,
  sin alterar coeficientes ni signos.

  Como la suma de términos es conmutativa y asociativa, el polinomio ordenado es algebraicamente
  equivalente al original. Por tanto, ordenar los factores antes de multiplicar no
  cambia el producto $P(x)Q(x)$; solo hace explícita la correspondencia entre grados
  y facilita la identificación posterior de términos semejantes.


  ### Desarrollo didáctico


  Multiplica: $(3 + x^2 - 2x)(x + 5)$.


  Paso 1: Ordenamos el trinomio: $(x^2 - 2x + 3)$. Paso 2: Ordenamos el binomio (ya
  está ordenado): $(x + 5)$. Paso 3: Multiplicamos verticalmente: ``` x² - 2x + 3
  ×      x + 5 ————————————— 5x² - 10x + 15    (multiplicación por 5) + x³ - 2x² +  3x          (multiplicación
  por x) ———————————————— x³ + 3x² -  7x + 15 ```

  El ordenamiento garantiza que la familia $x^2$ y la familia $x$ queden perfectamente
  alineadas una debajo de la otra.'
definiciones_clave: '- **Ordenamiento de factores en el producto de polinomios**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a ordenamiento de factores en el producto de polinomios.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de ordenamiento de factores
    en el producto de polinomios.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de ordenamiento de factores en el producto
    de polinomios.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
