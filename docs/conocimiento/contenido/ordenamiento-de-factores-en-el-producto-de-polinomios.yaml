resumen_inicial: La ordenamiento de factores en el producto de polinomios aplica rigurosamente
  las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con ordenamiento de factores en el producto de polinomios,
  multiplicamos los coeficientes numéricos, aplicamos la regla de signos y sumamos
  los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Ordenamiento de factores
  en el producto de polinomios** viene dada por:


  $$\text{"el producto de (2x + 1)(x - 3) ordenado"} \implies 2x^2 - 5x - 3$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Ordenamiento de factores en el producto de polinomios**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule ordenamiento de factores en el producto de polinomios para:
    ''el producto de (2x + 1)(x - 3) ordenado''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 2x^2 - 5x - 3.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar ordenamiento de factores en el producto
    de polinomios a 'el producto de (2x + 1)(x - 3) ordenado'?
  choices:
  - text: 2x^2 - 5x - 3
    is_correct: true
  - text: 2x^2 + 5x - 3
    is_correct: false
  - text: 2x^2 - 3
    is_correct: false
  - text: x^2 - 5x - 3
    is_correct: false
  explanation: La alternativa correcta es '2x^2 - 5x - 3'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto de (2x + 1)(x - 3) ordenado', ¿qué
    expresión resultante se obtuvo?
  choices:
  - text: 2x^2 - 5x - 3
    is_correct: true
  - text: 2x^2 + 5x - 3
    is_correct: false
  - text: 2x^2 - 3
    is_correct: false
  - text: x^2 - 5x - 3
    is_correct: false
  explanation: La alternativa correcta es '2x^2 - 5x - 3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante ordenamiento de factores en el producto de polinomios.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de ordenamiento de factores en el producto de polinomios
    en 'el producto de (2x + 1)(x - 3) ordenado'?
  alternativas:
  - 2x^2 - 5x - 3
  - 2x^2 + 5x - 3
  - 2x^2 - 3
  - x^2 - 5x - 3
  respuesta: 2x^2 - 5x - 3
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 2x^2 - 5x - 3.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto de (2x + 1)(x - 3) ordenado' por ordenamiento
    de factores en el producto de polinomios, ¿qué expresión resulta?
  alternativas:
  - 2x^2 - 5x - 3
  - 2x^2 + 5x - 3
  - 2x^2 - 3
  - x^2 - 5x - 3
  respuesta: 2x^2 - 5x - 3
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 2x^2 - 5x - 3.
- titulo: ¿Es la multiplicación en 'el producto de (2x + 1)(x - 3) ordenado' equivalente
    a 2x^2 - 5x - 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 2x^2 - 5x - 3.
- titulo: ¿Da el producto de 'el producto de (2x + 1)(x - 3) ordenado' un resultado
    igual a 2x^2 + 5x - 3?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 2x^2 - 5x - 3.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar ordenamiento de factores
  en el producto de polinomios.
- Omitir distribuir el monomio o término sobre todos los sumandos en ordenamiento
  de factores en el producto de polinomios.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La ordenamiento de factores en el producto de polinomios requiere sumar los exponentes
  de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la ordenamiento de factores
  en el producto de polinomios aplicando distributividad, ley de signos y suma de
  exponentes.
