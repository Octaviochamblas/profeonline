  choices:
  - text: (1/6)x^2 - (2/3)x - 2
    is_correct: true
  - text: (1/5)x^2 - 2
    is_correct: false
  - text: (1/6)x^2 - 2
    is_correct: false
  - text: (1/6)x - 2
    is_correct: false
  explanation: La alternativa correcta es '(1/6)x^2 - (2/3)x - 2'.
