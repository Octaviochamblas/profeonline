semantic_id: MAT.ALG.MULT_POLINOMIOS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'La multiplicación de polinomios con coeficientes fraccionarios consiste en distribuir cada término fraccionario multiplicando numeradores con numeradores y denominadores con denominadores y reduciendo fracciones por MCM.'
explicacion_simple: |
  Cuando multiplicas **dos polinomios cuyos coeficientes son fracciones** (ej: $\left(\frac{1}{2}x + \frac{2}{3}\right) \cdot \left(\frac{1}{3}x - \frac{1}{4}\right)$):
  - **Procedimiento**:
    1. **Aplica la distribución cartesiana**: Multiplica cada término del primer polinomio por cada término del segundo ($\text{num} \cdot \text{num}$ y $\text{den} \cdot \text{den}$).
    2. **Suma los exponentes** de las variables correspondientes.
    3. **Reduce los términos semejantes**: Para sumar o restar las fracciones de potencias iguales, **busca el MCM de sus denominadores**.
    4. **Simplifica** las fracciones a su mínima expresión.
  - **Ejemplo**: $\left(\frac{1}{2}x + \frac{2}{3}\right) \cdot \left(\frac{1}{3}x - \frac{1}{4}\right)$:
    - Término 1: $\frac{1}{2}x \cdot \frac{1}{3}x = \mathbf{\frac{1}{6}x^2}$.
    - Término 2: $\frac{1}{2}x \cdot \left(-\frac{1}{4}\right) = \mathbf{-\frac{1}{8}x}$.
    - Término 3: $\frac{2}{3} \cdot \frac{1}{3}x = \mathbf{+\frac{2}{9}x}$.
    - Término 4: $\frac{2}{3} \cdot \left(-\frac{1}{4}\right) = -\frac{2}{12} = \mathbf{-\frac{1}{6}}$.
    - Reducción semejante de $x$: $-\frac{1}{8} + \frac{2}{9} = \frac{-9 + 16}{72} = \mathbf{+\frac{7}{72}x}$.
    - Polinomio final: **$\frac{1}{6}x^2 + \frac{7}{72}x - \frac{1}{6}$**.
explicacion_formal: |
  ### Definición formal
  Sean $A(x) = \sum_{i=1}^m \frac{a_i}{b_i} x^{\alpha_i}$ y $B(x) = \sum_{j=1}^n \frac{c_j}{d_j} x^{\beta_j}$ dos polinomios en $\mathbb{Q}[x]$. La **multiplicación de polinomios racionales** genera la matriz de productos parciales:

  $$P_{ij} = \left( \frac{a_i \cdot c_j}{b_i \cdot d_j} \right) x^{\alpha_i + \beta_j}$$

  seguida de la reducción aditiva racional homogeneizada por $D_k = \operatorname{mcm}\left( \{ b_i d_j \}_{\alpha_i + \beta_j = k} \right)$ para cada grado $k$:

  $$(A \cdot B)(x) = \sum_{k} \left( \frac{\sum_{\alpha_i + \beta_j = k} (a_i c_j) \cdot \frac{D_k}{b_i d_j}}{D_k} \right) x^k$$

  ### Separación entre Multiplicación y Reducción
  El proceso distingue dos fases aritméticas fundamentales:
  1. **Fase de Multiplicación Cartesiana**: Producto directo $\frac{a c}{b d}$ (sin MCM).
  2. **Fase de Reducción Semejante**: Adición/sustracción aditiva racional homogeneizada por MCM.

  ### Síntesis didáctica
  Diferenciar el producto directo inicial del MCM necesario únicamente durante la reducción de términos semejantes es el control operativo clave.
definiciones_clave: |
  - **Multiplicación de polinomios racionales**: Expansión distributiva de polinomios cuyos coeficientes pertenecen al cuerpo $\mathbb{Q}$.
  - **Fase de expansión directa**: Multiplicación $\frac{ac}{bd}$ aplicada individualmente sobre los $m \cdot n$ pares de términos.
  - **Fase de homogeneización reductiva**: Adición aditiva por MCM aplicada exclusivamente sobre las fracciones asociadas a la misma potencia $x^k$.
propiedades_relaciones: |
  - **Independencia de MCM en expansión**: No se busca MCM al multiplicar los pares iniciales de términos.
  - **Simplificación continua**: Simplificar las fracciones parciales antes de reducir semejantes disminuye el tamaño de las cifras del MCM.
ejemplo_guiado:
  enunciado: 'Multiplica los polinomios racionales $A = \frac{1}{3}x + \frac{1}{2}$ y $B = \frac{2}{3}x - \frac{4}{5}$.'
  pasos:
    - 'Paso 1: Multiplicamos término 1 de $A$ por $B$:
       - $\frac{1}{3}x \cdot \frac{2}{3}x = \mathbf{\frac{2}{9}x^2}$.
       - $\frac{1}{3}x \cdot \left(-\frac{4}{5}\right) = \mathbf{-\frac{4}{15}x}$.'
    - 'Paso 2: Multiplicamos término 2 de $A$ por $B$:
       - $\frac{1}{2} \cdot \frac{2}{3}x = \frac{2}{6}x = \mathbf{+\frac{1}{3}x}$.
       - $\frac{1}{2} \cdot \left(-\frac{4}{5}\right) = -\frac{4}{10} = \mathbf{-\frac{2}{5}}$.'
    - 'Paso 3: Reunimos los 4 productos parciales:
       $\frac{2}{9}x^2 - \frac{4}{15}x + \frac{1}{3}x - \frac{2}{5}$.'
    - 'Paso 4: Reducimos la Clase $x$: $-\frac{4}{15} + \frac{1}{3}$.
       - $\operatorname{mcm}(15, 3) = 15 \implies -\frac{4}{15} + \frac{5}{15} = \mathbf{+\frac{1}{15}x}$.'
    - 'Conclusión: El polinomio producto ordenado y simplificado es **$\frac{2}{9}x^2 + \frac{1}{15}x - \frac{2}{5}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué etapa de la multiplicación de polinomios con coeficientes fraccionarios es necesario utilizar el Mínimo Común Múltiplo (MCM)?'
    choices:
      - {text: 'Únicamente en la etapa de reducción de términos semejantes para sumar o restar los coeficientes fraccionarios de igual grado', is_correct: true}
      - {text: 'En la etapa inicial de multiplicación de numeradores y denominadores', is_correct: false}
      - {text: 'Al multiplicar los exponentes de las variables', is_correct: false}
      - {text: 'En ningún momento se utiliza MCM', is_correct: false}
    explanation: 'La alternativa correcta es ''Únicamente en la etapa de reducción de términos semejantes para sumar o restar los coeficientes fraccionarios de igual grado''. MCM reservado para la reducción aditiva.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado del producto parcial de $\frac{2}{5}x^2 \cdot \left(-\frac{5}{4}x\right)$?'
    choices:
      - {text: 'El resultado es $-\frac{1}{2}x^3$, al multiplicar $\frac{2 \cdot (-5)}{5 \cdot 4} = -\frac{10}{20} = -\frac{1}{2}$ y sumar $2 + 1 = 3$', is_correct: true}
      - {text: 'El resultado es $-\frac{10}{20}x^2$', is_correct: false}
      - {text: 'El resultado es $-\frac{7}{9}x^3$', is_correct: false}
      - {text: 'El resultado es $\frac{1}{2}x^3$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $-\frac{1}{2}x^3$, al multiplicar $\frac{2 \cdot (-5)}{5 \cdot 4} = -\frac{10}{20} = -\frac{1}{2}$ y sumar $2 + 1 = 3$''. $-\frac{10}{20}x^{2+1} = -\frac{1}{2}x^3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Multiplicar directamente numeradores con numeradores y denominadores con denominadores en la expansión cartesiana.'
  - 'Paso 2: Sumar los exponentes de las variables en cada producto parcial monómico.'
  - 'Paso 3: Simplificar individualmente cada fracción del polinomio expandido a su forma irreductible.'
  - 'Paso 4: Calcular el MCM de los denominadores únicamente para las fracciones pertenecientes a la misma clase de término semejante y reducirlas.'
errores_correccion: |
  - **Error 1:** Buscar MCM de los denominadores durante la etapa de multiplicación cartesiana inicial. **Cómo corregirlo:** La multiplicación de fracciones **ES DIRECTA ($\text{num} \cdot \text{num}$ / $\text{den} \cdot \text{den}$)**.
  - **Error 2:** Sumar numeradores y denominadores al reducir semejantes (escribir $\frac{1}{4}x + \frac{2}{4}x = \frac{3}{8}x$). **Cómo corregirlo:** En la suma **EL DENOMINADOR COMÚN SE MANTIENE ($\frac{1+2}{4} = \frac{3}{4}x$)**.
ejemplos:
  - titulo: 'Multiplicación directa racional'
    enunciado: '¿Cuál es el desarrollo de $\left(\frac{1}{2}x + 1\right) \cdot \left(\frac{2}{3}x + 2\right)$?'
    alternativas:
      - '$\frac{1}{3}x^2 + \frac{5}{3}x + 2$'
      - '$\frac{2}{5}x^2 + \frac{5}{3}x + 2$'
      - '$\frac{1}{3}x^2 + 2$'
    respuesta: '$\frac{1}{3}x^2 + \frac{5}{3}x + 2$'
    solucion_pasos:
      - '1. $\frac{1}{2} \cdot \frac{2}{3} = \frac{1}{3}x^2$.'
      - '2. Medios: $\frac{1}{2} \cdot 2 = 1x$; $1 \cdot \frac{2}{3} = \frac{2}{3}x \implies 1 + \frac{2}{3} = \frac{5}{3}x$.'
      - '3. Constantes: $1 \cdot 2 = 2$.'
      - '4. Resultado: $\frac{1}{3}x^2 + \frac{5}{3}x + 2$.'
  - titulo: 'Simplificación previa'
    enunciado: '¿Simplifica los cálculos cancelar números en cruz antes de multiplicar coeficientes racionales largos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, reduce el valor de las cifras a operar.'
  - titulo: 'Enteros en polinomios racionales'
    enunciado: 'Para multiplicar $\frac{1}{4}x \cdot 8$, ¿se considera $8 = \frac{8}{1}$ obteniendo $2x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{8}{4} = 2 \implies 2x$.'
  - titulo: 'Independencia de grado'
    enunciado: '¿Se operan las fracciones de la clase $x^2$ en forma totalmente separada de las fracciones de la clase $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el MCM se aplica independientemente por clase.'
errores_frecuentes:
  - 'Buscar un MCM generalizado durante la fase inicial de multiplicación de coeficientes en lugar de multiplicar directamente.'
  - 'Sumar los denominadores entre sí al reducir los coeficientes de los términos semejantes.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Las fracciones del polinomio final no son simplificadas a sus términos irreductibles.'
  - 'Multiplicar los exponentes de las potencias por los numeradores o denominadores.'
afirmaciones_verdaderas:
  - 'La multiplicación cartesiana de coeficientes fraccionarios es directa (numerador por numerador y denominador por denominador).'
  - 'El uso del MCM se reserva exclusivamente para la reducción aditiva de los términos semejantes de igual grado.'
al_terminar_debes_poder: 'Multiplicar polinomios con coeficientes fraccionarios aplicando multiplicación directa y reducción por MCM.'
