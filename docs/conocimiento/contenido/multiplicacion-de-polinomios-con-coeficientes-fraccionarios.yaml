semantic_id: MAT.ALG.MULT_POLINOMIOS.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Multiplicación de polinomios con coeficientes fraccionarios: leyes,
  procedimiento y aplicación en Multiplicación de polinomios.'
explicacion_simple: 'Multiplicar polinomios con fracciones es igual que con números
  enteros, solo que ahora debemos recordar cómo multiplicar fracciones: el numerador
  por el numerador y el denominador por el denominador.'
explicacion_formal: '### Definición formal


  Sean $P(x)=\sum_{i=0}^{m} a_i x^i$ y $Q(x)=\sum_{j=0}^{n} b_j x^j$ con $a_i,b_j\in\mathbb{Q}$
  y denominadores no nulos. Su producto se define por

  $$P(x)Q(x)=\sum_{i=0}^{m}\sum_{j=0}^{n} a_i b_j x^{i+j}.$$

  Como los coeficientes pertenecen al conjunto de los números racionales, cada coeficiente
  parcial $a_i b_j$ se obtiene mediante la multiplicación ordinaria de fracciones,
  y los coeficientes de términos semejantes se suman también dentro de $\mathbb{Q}$.
  La presencia de fracciones no modifica la regla polinomial; solo cambia el campo
  numérico en que se realizan los cálculos.


  ### Desarrollo didáctico


  La regla general para multiplicar dos polinomios $P(x)$ y $Q(x)$ se mantiene: cada
  término de $P(x)$ se multiplica por cada término de $Q(x)$.


  Cuando los coeficientes son fracciones, como $\frac{a}{b}$ y $\frac{c}{d}$, el coeficiente
  del término resultante será $\frac{a \cdot c}{b \cdot d}$.


  Después de distribuir todos los términos, es probable que se generen términos semejantes
  con coeficientes fraccionarios. Para reducirlos, debes sumar o restar esas fracciones
  encontrando el mínimo común múltiplo (MCM) de sus denominadores.'
definiciones_clave: '- **Multiplicación de polinomios con coeficientes fraccionarios**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
