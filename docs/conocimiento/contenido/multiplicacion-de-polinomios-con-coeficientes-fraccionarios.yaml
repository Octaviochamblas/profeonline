    is_correct: false
  - text: (1/6)x^2 - 2
    is_correct: false
  - text: (1/6)x - 2
    is_correct: false
  explanation: La alternativa correcta es '(1/6)x^2 - (2/3)x - 2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto de (1/2 x + 1)(1/3 x - 2)', ¿qué
