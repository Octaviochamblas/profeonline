procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante multiplicación de polinomios con coeficientes fraccionarios.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de multiplicación de polinomios con coeficientes
    fraccionarios en 'el producto de (1/2 x + 1)(1/3 x - 2)'?
  alternativas:
  - (1/6)x^2 - (2/3)x - 2
  - (1/5)x^2 - 2
  - (1/6)x^2 - 2
  - (1/6)x - 2
  respuesta: (1/6)x^2 - (2/3)x - 2
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener (1/6)x^2 - (2/3)x - 2.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto de (1/2 x + 1)(1/3 x - 2)' por multiplicación
    de polinomios con coeficientes fraccionarios, ¿qué expresión resulta?
  alternativas:
  - (1/6)x^2 - (2/3)x - 2
  - (1/5)x^2 - 2
  - (1/6)x^2 - 2
  - (1/6)x - 2
  respuesta: (1/6)x^2 - (2/3)x - 2
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir (1/6)x^2 - (2/3)x - 2.
- titulo: ¿Es la multiplicación en 'el producto de (1/2 x + 1)(1/3 x - 2)' equivalente
    a (1/6)x^2 - (2/3)x - 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene (1/6)x^2 - (2/3)x - 2.
- titulo: ¿Da el producto de 'el producto de (1/2 x + 1)(1/3 x - 2)' un resultado
    igual a (1/5)x^2 - 2?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es (1/6)x^2 - (2/3)x - 2.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar multiplicación de polinomios
  con coeficientes fraccionarios.
- Omitir distribuir el monomio o término sobre todos los sumandos en multiplicación
  de polinomios con coeficientes fraccionarios.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La multiplicación de polinomios con coeficientes fraccionarios requiere sumar los
  exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la multiplicación de
  polinomios con coeficientes fraccionarios aplicando distributividad, ley de signos
  y suma de exponentes.
