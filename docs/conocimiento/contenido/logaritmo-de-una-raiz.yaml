semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.RAIZ
resumen_inicial: 'El logaritmo de una raíz es igual al logaritmo del radicando dividido por el índice de la raíz: $\log_b(\sqrt[n]{x}) = \frac{1}{n} \cdot \log_b(x)$ ($x > 0, n \in \mathbb{N}, n \ge 2$).'
explicacion_simple: '![Propiedad del logaritmo de una raíz](/static/img/nodos/logaritmo-de-una-raiz-intro.svg)


  El logaritmo de una raíz se deriva directamente de la regla de la potencia:

  - Como una raíz es una potencia con exponente fraccionario ($\sqrt[n]{x} = x^{1/n}$), el índice $n$ pasa dividiendo al frente: $\frac{1}{n} \cdot \log_b(x)$.

  - Para una raíz cuadrada: $\log_b(\sqrt{x}) = \frac{1}{2} \cdot \log_b(x)$.

  - Para una raíz cúbica: $\log_2(\sqrt[3]{64}) = \frac{1}{3} \cdot \log_2(64) = \frac{1}{3} \cdot 6 = 2$.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$, $x \in \mathbb{R}^+$, $m \in \mathbb{Z}$ y $n \in \mathbb{N}_{\ge 2}$. Por la definición de exponente fraccionario $\sqrt[n]{x^m} = x^{\frac{m}{n}}$, aplicando la propiedad de la potencia se tiene:


  $$\log_b(\sqrt[n]{x^m}) = \log_b\left(x^{\frac{m}{n}}\right) = \frac{m}{n} \cdot \log_b(x)$$


  **Caso Particular (Raíz Simple):**

  $$\log_b(\sqrt[n]{x}) = \frac{1}{n} \cdot \log_b(x) = \frac{\log_b(x)}{n}$$'
definiciones_clave: '- **Logaritmo de una raíz**: Identidad $\log_b(\sqrt[n]{x}) = \frac{1}{n} \cdot \log_b(x)$.

  - **Índice de la raíz ($n$)**: Denominador de la fracción multiplicativa exterior.

  - **Exponente fraccionario**: Transformación algebraica $\sqrt[n]{x^m} = x^{\frac{m}{n}}$.'
propiedades_relaciones: '- **Raíz cuadrada ($n = 2$)**: Multiplicador $\frac{1}{2}$ vertical.

  - **Raíz de cocientes y productos**: Se combina linealmente con las propiedades de producto y división.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de una raíz](/static/img/nodos/logaritmo-de-una-raiz-ejemplos.svg)


    Calcule el valor de $\log_2(\sqrt[3]{64})$ y evalúe $\log(\sqrt{1000})$.'
  pasos:
  - 'Paso 1: Para $\log_2(\sqrt[3]{64})$: Extraer la fracción vertical $\frac{1}{3} \cdot \log_2(64)$.'
  - 'Paso 2: Calcular $\log_2(64) = 6 \implies \frac{1}{3} \cdot 6 = 2$.'
  - 'Paso 3: Para $\log(\sqrt{1000})$: Extraer $\frac{1}{2} \cdot \log(1000)$.'
  - 'Paso 4: Calcular $\log(1000) = 3 \implies \frac{1}{2} \cdot 3 = \frac{3}{2} = 1,5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma correcta de expresar $\log_b(\sqrt[5]{x})$?
  choices:
  - text: $\frac{1}{5} \cdot \log_b(x)$ (el índice pasa al denominador de la fracción)
    is_correct: true
  - text: $5 \cdot \log_b(x)$
    is_correct: false
  - text: $\log_b(x)^5$
    is_correct: false
  - text: $\sqrt[5]{\log_b(x)}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{5} \cdot \log_b(x)$ (el índice pasa al denominador de la fracción)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado de $\log_2(\sqrt[3]{64})$?
  choices:
  - text: $2$, porque $\frac{1}{3} \cdot 6 = 2$
    is_correct: true
  - text: $18$
    is_correct: false
  - text: $6$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$2$, porque $\frac{1}{3} \cdot 6 = 2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ de la raíz y la potencia interna $m$ del radicando.'
- 'Paso 2: Convertir la raíz a exponente fraccionario $\frac{m}{n}$.'
- 'Paso 3: Bajar la fracción vertical al frente: $\frac{m}{n} \cdot \log_b(x)$ y evaluar el valor numérico.'
errores_correccion: "- **Error 1: Multiplicar por el índice en vez de dividir ($\\log_b(\\sqrt[3]{x}) = 3\\log_b(x)$).** **Cómo corregirlo:** La raíz es un exponente fraccionario ($x^{1/3}$), por lo que el índice pasa **dividiendo** ($\frac{1}{3}\\log_b(x)$).\n- **Error 2: Olvidar que la raíz cuadrada tiene índice 2.** **Cómo corregirlo:** En $\\log(\\sqrt{x})$, el factor es siempre $\frac{1}{2}$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $\log_3(\sqrt{81})$?
  alternativas:
  - $2$
  - $4$
  - $1/2$
  respuesta: $2$
  solucion_pasos:
  - $\frac{1}{2} \cdot \log_3(81) = \frac{1}{2} \cdot 4 = 2$ (o bien $\log_3(9) = 2$).
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\log_2(\sqrt[4]{16})$?
  alternativas:
  - $1$
  - $4$
  - $16$
  respuesta: $1$
  solucion_pasos:
  - $\frac{1}{4} \cdot \log_2(16) = \frac{1}{4} \cdot 4 = 1$.
- titulo: ¿Es log(√10) = 1/2?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\log(10^{1/2}) = \frac{1}{2} \cdot \log(10) = \frac{1}{2} \cdot 1 = 1/2$.
  alternativas:
  - texto: Sí, 1/2 · log(10) = 1/2
    es_correcta: true
    retroalimentacion: ¡Correcto! Raíz cuadrada de la base 10.
  - texto: No, es 2
    es_correcta: false
    retroalimentacion: Incorrecto, el 2 va en el denominador.
  - texto: No, es 5
    es_correcta: false
    retroalimentacion: Incorrecto, no se divide 10 por 2.
- titulo: ¿Equivale log_b(∜(x³)) a 3/4 · log_b(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\sqrt[4]{x^3} = x^{3/4}$.
  alternativas:
  - texto: Sí, exponente 3 e índice 4 dan 3/4
    es_correcta: true
    retroalimentacion: ¡Correcto! Fracción vertical m/n.
  - texto: No, es 4/3 · log_b(x)
    es_correcta: false
    retroalimentacion: Incorrecto, el índice siempre va en el denominador.
  - texto: No, es 12 · log_b(x)
    es_correcta: false
    retroalimentacion: Incorrecto, no se multiplican.
errores_frecuentes:
- Colocar el índice multiplicando como entero en vez de dividir en fracción.
- Asignar índice 1 a la raíz cuadrada en vez de 2.
- Invertir la fracción del exponente con el índice ($n/m$ en vez de $m/n$).
- Aplicar la propiedad a raíces con radicando negativo.
afirmaciones_verdaderas:
- El logaritmo de una raíz es igual al logaritmo del radicando dividido por el índice.
- Se fundamenta en la equivalencia entre raíces y potencias de exponente fraccionario.
- Para una raíz cuadrada, el factor multiplicativo es siempre $\frac{1}{2}$.
al_terminar_debes_poder: '![Síntesis de logaritmo de una raíz](/static/img/nodos/logaritmo-de-una-raiz-resumen.svg)


  QUÉ: Comprender y aplicar la propiedad del logaritmo de una raíz $\log_b(\sqrt[n]{x}) = \frac{1}{n} \cdot \log_b(x)$.


  CÓMO: Convirtiendo el radical en exponente fraccionario vertical y extrayéndolo como factor multiplicativo al frente del logaritmo.'
