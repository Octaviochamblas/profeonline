    is_correct: true
  - text: '4'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '81'
    is_correct: false
  explanation: La alternativa correcta es '1 (porque 4 / 4 = 1)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar logaritmos de raíces
  $\log_b(\sqrt[n]{x}) = \frac{\log_b(x)}{n}$, dividiendo el logaritmo interno por
  el índice de la raíz.
semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.RAIZ
procedimiento:
- 'Paso 1: Identificar la propiedad logarítmica correspondiente a la estructura del
  argumento o las bases.'
- 'Paso 2: Aplicar la ley algebraica transformando el logaritmo según la regla.'
- 'Paso 3: Evaluar y reducir numéricamente la expresión simplificada.'
errores_correccion: '- **Error 1: Confundir el logaritmo de una suma con la suma de
  logaritmos (escribir $\log(x+y) = \log(x) + \log(y)$).** **Cómo corregirlo:** El
  logaritmo NO es distributivo sobre la suma; la suma de logaritmos proviene del PRODUCTO
  ($\log(x \cdot y) = \log(x) + \log(y)$).


  - **Error 2: Confundir el cociente de logaritmos con el logaritmo del cociente.**
  **Cómo corregirlo:** $\log\left(\frac{x}{y}\right) = \log(x) - \log(y)$, mientras
  $\frac{\log(x)}{\log(y)}$ es la fórmula de cambio de base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de aplicación de MAT.NUM.LOGARITMOS_PROPIEDADES.RAIZ.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de validez formal.
  alternativas:
  - Cumple la propiedad
  - No cumple
  - Indeterminado
  respuesta: Cumple la propiedad
  solucion_pasos:
  - Demostración de equivalencia en R.
- titulo: ¿Es distributivo el logaritmo respecto a la adición?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(x+y) \neq \log(x) + \log(y)$.
- titulo: ¿Conserva el resultado la igualdad matemática original?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las propiedades de los logaritmos.
errores_frecuentes:
- Distribuir el logaritmo sobre los términos de una suma escribiendo $\log_b(x+y)
  = \log_b(x) + \log_b(y)$.
- Multiplicar los logaritmos individuales al calcular el logaritmo de un producto.
- Dividir los logaritmos individuales al calcular el logaritmo de un cociente.
- La expresión $\log(x^2)$ equivale numéricamente a elevar al cuadrado todo el logaritmo
  $(\log(x))^2$.
- Restar las bases al aplicar el cambio de base en un logaritmo.
afirmaciones_verdaderas:
- Las propiedades de los logaritmos transforman productos en sumas, cocientes en restas
  y potencias en multiplicaciones.
- 'El logaritmo de un producto es la suma de los logaritmos de sus factores: $\log_b(x
  \cdot y) = \log_b(x) + \log_b(y)$ ($x,y>0$).'
