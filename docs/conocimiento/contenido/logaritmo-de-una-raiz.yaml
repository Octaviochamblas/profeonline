resumen_inicial: 'El logaritmo de una raíz $n$-ésima $\log_b(\sqrt[n]{x})$ es igual
  a la división del logaritmo del radicando entre el índice de la raíz: $\frac{\log_b(x)}{n}$
  ($x > 0$).'
explicacion_simple: Como una raíz equivale a una potencia con exponente fraccionario,
  calcular el logaritmo de una raíz es lo mismo que calcular el logaritmo del número
  de adentro y dividirlo por el índice de la raíz.
explicacion_formal: 'Para todo $x > 0$, índice $n \in \mathbb{N}_{\ge 2}$ y base $b
  > 0, b \neq 1$, el **Logaritmo de una Raíz** satisface:


  $$\log_b\left(\sqrt[n]{x}\right) = \log_b\left(x^{\frac{1}{n}}\right) = \frac{1}{n}
  \cdot \log_b(x) = \frac{\log_b(x)}{n}$$


  **Demostración:**

  Resulta de expresar $\sqrt[n]{x} = x^{1/n}$ y aplicar la propiedad del logaritmo
  de una potencia.'
definiciones_clave: '- **Logaritmo de una raíz**: Identidad $\log_b(\sqrt[n]{x}) =
  \frac{\log_b(x)}{n}$ que divide el logaritmo por el índice $n$.'
propiedades_relaciones: '- **División por el índice**: El índice de la raíz pasa como
  denominador divisor.'
ejemplo_guiado:
  enunciado: Calcule el valor de $\log_3(\sqrt[4]{81})$ aplicando la propiedad del
    logaritmo de una raíz.
  pasos:
  - 'Paso 1: Escribir la propiedad dividiendo entre el índice $4$: $\frac{\log_3(81)}{4}$.'
  - 'Paso 2: Evaluar el logaritmo del radicando: $\log_3(81) = 4$.'
  - 'Paso 3: Dividir por el índice: $\frac{4}{4} = 1$.'
  - 'Conclusión: $\log_3(\sqrt[4]{81}) = \log_3(3) = 1$.'
checkpoints:
