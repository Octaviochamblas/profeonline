semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.RAIZ
resumen_inicial: El logaritmo de una raíz es igual al logaritmo del radicando dividido por
  el índice de la raíz ($\log_b(\sqrt[n]{x}) = \frac{1}{n} \cdot \log_b(x)$).
explicacion_simple: 'Como una raíz se puede escribir como exponente fraccionario ($\sqrt[n]{x}
  = x^{1/n}$), por la propiedad de la potencia el número del índice de la raíz pasa **dividiendo
  al logaritmo**:

  $$\log_2(\sqrt{16}) = \frac{\log_2(16)}{2} = \frac{4}{2} = 2$$

  Comprobación directa: $\sqrt{16} = 4 \implies \log_2(4) = 2$.'
explicacion_formal: 'Para $b > 0, b \neq 1$, $x > 0$ y $n \in \mathbb{N}, n \ge 2$, se tiene:

  $$\log_b(\sqrt[n]{x}) = \log_b\left(x^{1/n}\right) = \frac{1}{n} \cdot \log_b(x) = \frac{\log_b(x)}{n}$$'
definiciones_clave: '- **Conversión de radical a coeficiente $\frac{1}{n}$**: Extracción del
  índice como divisor del logaritmo.'
propiedades_relaciones: '- **Caso raíz cuadrada**: $\log_b(\sqrt{x}) = \frac{1}{2} \log_b(x)$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\log_3(\sqrt[4]{81})$.
  pasos:
  - 'Convertir el radical a división por el índice 4: $\frac{\log_3(81)}{4}$.'
  - Calcular $\log_3(81) = 4$.
  - 'Dividir entre el índice: $\frac{4}{4} = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\log_5(\sqrt[3]{x})$?
  choices:
  - text: \frac{1}{3} \log_5(x)
    is_correct: true
  - text: 3 \log_5(x)
    is_correct: false
  - text: \log_5(x/3)
    is_correct: false
  - text: \sqrt[3]{\log_5(x)}
    is_correct: false
  explanation: 'La correcta es: \frac{1}{3} \log_5(x). El índice 3 pasa dividiendo como el
    coeficiente 1/3.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $\log_2(x) = 10$, calcula $\log_2(\sqrt{x})$.
  choices:
  - text: '5'
    is_correct: true
  - text: '20'
    is_correct: false
  - text: \sqrt{10}
    is_correct: false
  - text: '100'
    is_correct: false
  explanation: 'La correcta es: 5. $\log_2(\sqrt{x}) = \frac{1}{2} \log_2(x) = \frac{10}{2}
    = 5$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ de la raíz en el argumento.'
- 'Paso 2: Pasar el índice $n$ dividiendo al logaritmo completo (o multiplicando por $\frac{1}{n}$).'
- 'Paso 3: Evaluar el logaritmo del radicando y efectuar la división.'
errores_correccion: No multipliques por el índice. El índice de la raíz **divide al logaritmo**,
  no lo multiplica.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log(\sqrt{100})$.
  alternativas:
  - '1'
  - '2'
  - 0,5
  respuesta: '1'
  solucion_pasos:
  - $\frac{\log(100)}{2} = \frac{2}{2} = 1$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale log base 5 de (raíz cuadrada de 125)?
  alternativas:
  - 1,5
  - '3'
  - 0,5
  respuesta: 1,5
  solucion_pasos:
  - log base 5 de 125, dividido 2, es 3/2=1,5.
- titulo: Ejemplo 3
  enunciado: Si log base 3 de x es igual a 12, ¿cuál es el valor de log base 3 de (raíz cúbica
    de x)?
  alternativas:
  - '4'
  - '36'
  - 1/4
  respuesta: '4'
  solucion_pasos:
  - 12 dividido 3 es igual a 4.
- titulo: ¿Es correcto multiplicar por el índice al calcular el logaritmo de una raíz?
  respuesta: 'No'
  solucion_pasos:
  - El índice de la raíz divide al logaritmo, no lo multiplica.
errores_frecuentes:
- Multiplicar por el índice en vez de dividir.
- Multiplicar por el índice en vez de dividir al aplicar esta propiedad.
- Olvidar convertir la raíz a exponente fraccionario antes de aplicar la propiedad.
- Confundir el índice de la raíz con el exponente del radicando al aplicar la propiedad.
- Aplicar esta propiedad sin verificar que el radicando sea estrictamente positivo.
afirmaciones_verdaderas:
- $\log_b(\sqrt[n]{x}) = \frac{\log_b(x)}{n}$.
- Esta propiedad equivale a aplicar el logaritmo de una potencia con exponente fraccionario
  1/n.
al_terminar_debes_poder: Evaluar logaritmos de radicales dividiendo por el índice.
fuente: Texto escolar MINEDUC.
estado: publicado
