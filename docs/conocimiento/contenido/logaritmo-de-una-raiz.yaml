semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.RAIZ
resumen_inicial: 'El logaritmo de una raíz es igual al logaritmo del radicando dividido entre el índice del radical: $\log_b(\sqrt[n]{x}) = \frac{1}{n} \cdot \log_b(x) = \frac{\log_b(x)}{n}$ ($x > 0$).'
explicacion_simple: |
  Como toda raíz se puede escribir como una potencia con exponente fraccionario ($\sqrt[n]{x} = x^{1/n}$), el logaritmo de una raíz se resuelve aplicando la propiedad de las potencias. El índice $n$ de la raíz "sale fuera" dividiendo a todo el logaritmo. Por ejemplo, el logaritmo de una raíz cuadrada es la mitad del logaritmo: $\log_2(\sqrt{16}) = \frac{\log_2(16)}{2} = \frac{4}{2} = 2$.
explicacion_formal: |
  ### Definición formal
  La **propiedad del logaritmo de una raíz** establece que para toda base real $b > 0, b \neq 1$, un argumento positivo $x \in \mathbb{R}^+$ y cualquier índice radical $n \in \mathbb{Z}^+ \setminus \{1\}$:
  $$\log_b\left(\sqrt[n]{x}\right) = \frac{1}{n} \cdot \log_b(x) = \frac{\log_b(x)}{n}$$

  ### Demostración mediante exponentes fraccionarios
  Transformando la raíz en una potencia de exponente fraccionario y aplicando la propiedad del logaritmo de una potencia $\log_b(a^k) = k \cdot \log_b(a)$:
  $$\log_b\left(\sqrt[n]{x}\right) = \log_b\left(x^{1/n}\right) = \frac{1}{n} \cdot \log_b(x) = \frac{\log_b(x)}{n}$$

  ### Extensión a raíces de potencias $\sqrt[n]{x^m}$
  $$\log_b\left(\sqrt[n]{x^m}\right) = \log_b\left(x^{m/n}\right) = \frac{m}{n} \cdot \log_b(x)$$

  ### Síntesis didáctica
  - Transformación operacional: El índice $n$ de la raíz sale dividiendo al logaritmo completo.
  - Caso particular de raíz cuadrada ($n = 2$): $\log_b(\sqrt{x}) = \frac{1}{2} \log_b(x)$.
definiciones_clave: |
  - **Logaritmo de una raíz**: Propiedad de simplificación que transforma el radical sublogarítmico en una división por el índice.
  - **Divisor de índice $n$**: Denominador que divide al resultado del logaritmo tras extraer el signo radical.
  - **Factor fraccionario $\frac{1}{n}$**: Coeficiente racional que multiplica al logaritmo del radicando.
propiedades_relaciones: |
  - **Relación con la propiedad de potencia**: Es un caso particular de $\log_b(x^k)$ donde el exponente es el número fraccionario $k = \frac{1}{n}$.
  - **Simplificación de ecuaciones con radicales**: Permite eliminar signos radicales al resolver ecuaciones algebraicas avanzadas.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico de la expresión $V = \log_2(\sqrt[3]{64})$ aplicando la propiedad del logaritmo de una raíz.'
  pasos:
    - 'Paso 1: Identificamos el índice de la raíz $n = 3$ y el radicando $x = 64$ en la expresión $\log_2(\sqrt[3]{64})$.'
    - 'Paso 2: Aplicamos la propiedad convirtiendo la raíz en una división por el índice $3$: $V = \frac{\log_2(64)}{3}$.'
    - 'Paso 3: Calculamos el logaritmo simple $\log_2(64)$ buscando la potencia $2^c = 64 \implies c = 6$.'
    - 'Paso 4: Realizamos la división final: $V = \frac{6}{3} = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se representa el logaritmo de una raíz $\log_b(\sqrt[n]{x})$ según sus propiedades?'
    choices:
      - {text: '$\frac{\log_b(x)}{n}$, dividiendo el logaritmo del radicando entre el índice $n$', is_correct: true}
      - {text: '$n \cdot \log_b(x)$, multiplicando por el índice', is_correct: false}
      - {text: '$\log_b(x)^n$, elevando el logaritmo al índice', is_correct: false}
      - {text: '$\log_b(x - n)$, restando el índice al argumento', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{\log_b(x)}{n}$, dividiendo el logaritmo del radicando entre el índice $n$''. Convertir la raíz a $x^{1/n}$ saca el factor $1/n$ dividiendo al logaritmo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado de la expresión $\log_5(\sqrt{625})$?'
    choices:
      - {text: '$2$, ya que $\frac{\log_5(625)}{2} = \frac{4}{2} = 2$', is_correct: true}
      - {text: '$4$, sin dividir por el índice de la raíz cuadrada', is_correct: false}
      - {text: '$8$, multiplicando $4 \cdot 2$', is_correct: false}
      - {text: '$25$, calculando la raíz sin el logaritmo', is_correct: false}
    explanation: 'La alternativa correcta es ''$2$, ya que $\frac{\log_5(625)}{2} = \frac{4}{2} = 2$''. El logaritmo $\log_5(625) = 4$, y al ser raíz cuadrada ($n = 2$), dividimos $4 / 2 = 2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el índice $n$ de la raíz en la expresión $\log_b(\sqrt[n]{x})$.'
  - 'Paso 2: Escribir el logaritmo como una fracción dividida entre el índice $n$: $\frac{\log_b(x)}{n}$.'
  - 'Paso 3: Calcular el valor del logaritmo del radicando $\log_b(x)$.'
  - 'Paso 4: Dividir el resultado del logaritmo por el número del índice $n$.'
errores_correccion: |
  - **Error 1:** Multiplicar el logaritmo por el índice de la raíz en lugar de dividir por él (ej: escribir $\log_b(\sqrt{x}) = 2 \log_b(x)$). **Cómo corregirlo:** En la raíz, el exponente es una fracción $1/n$, por lo que el índice **sale a dividir**: $\frac{\log_b(x)}{n}$.
  - **Error 2:** Olvidar que una raíz cuadrada tiene índice implícito $n = 2$. **Cómo corregirlo:** Cuando veas $\log_b(\sqrt{x})$ sin número escrito en el índice, debes dividir la expresión entre **2**.
ejemplos:
  - titulo: 'Logaritmo de raíz cuadrada simple'
    enunciado: '¿El valor de $\log_3(\sqrt{81})$ es igual a $2$?'
    alternativas:
      - 'Sí, pues $\frac{\log_3(81)}{2} = \frac{4}{2} = 2$'
      - 'No, es igual a 4'
      - 'No, es igual a 8'
    respuesta: 'Sí, pues $\frac{\log_3(81)}{2} = \frac{4}{2} = 2$'
    solucion_pasos:
      - '1. Convertimos la raíz cuadrada a división por 2: $\frac{\log_3(81)}{2}$.'
      - '2. Evaluamos $\log_3(81) = 4 \implies \frac{4}{2} = 2$.'
  - titulo: 'Logaritmo de raíz cúbica'
    enunciado: '¿El valor de $\log_2(\sqrt[3]{8})$ resulta en $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{\log_2(8)}{3} = \frac{3}{3} = 1$.'
  - titulo: 'Extracción de raíz con potencia interior'
    enunciado: '¿La expresión $\log_b(\sqrt[4]{x^3})$ equivale a $\frac{3}{4} \cdot \log_b(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exponente racional $3/4 \implies \frac{3}{4} \log_b(x)$.'
  - titulo: 'Caso particular de raíz de 10 en logaritmo decimal'
    enunciado: '¿La expresión $\log(\sqrt{10})$ resulta en $1/2 = 0.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{\log_{10}(10)}{2} = \frac{1}{2} = 0.5$.'
errores_frecuentes:
  - 'El logaritmo de una raíz $\log_b(\sqrt[n]{x})$ es igual a multiplicar el logaritmo por el índice $n \cdot \log_b(x)$.'
  - 'El logaritmo de una raíz cuadrada se calcula dividiendo el resultado por la unidad.'
  - 'Elevar el logaritmo a la potencia del índice $n$.'
  - 'Restar el índice de la raíz al valor del logaritmo.'
  - 'Aplicar la propiedad de la raíz dividiendo la base en lugar de dividir el resultado del logaritmo.'
afirmaciones_verdaderas:
  - 'El logaritmo de una raíz es igual al logaritmo del radicando dividido entre el índice del radical: $\log_b(\sqrt[n]{x}) = \frac{\log_b(x)}{n}$.'
  - 'La propiedad del logaritmo de una raíz se demuestra expresando el radical como una potencia de exponente fraccionario $x^{1/n}$ y aplicando la regla del logaritmo de una potencia.'
