semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.SIMETRIA_PAR
resumen_inicial: 'Reconocimiento de la simetría par de la función coseno: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: A diferencia del seno, la curva del coseno es simétrica de forma
  que ambos lados del eje $y$ se ven exactamente igual.
explicacion_formal: '### Definición formal


  Para un ángulo $\theta$ y su opuesto $-\theta$, los puntos asociados en el círculo
  unitario son $(x,y)$ y $(x,-y)$: comparten la misma coordenada $x$ (mismo coseno),
  aunque tengan coordenada $y$ opuesta. Por lo tanto, $\cos(-\theta)=\cos(\theta)$.


  ### Desarrollo didáctico


  $\cos(\pi/6)=\sqrt{3}/2$ y $\cos(-\pi/6)=\sqrt{3}/2$: son valores idénticos. Geométricamente,
  el ángulo $-\pi/6$ es el reflejo de $\pi/6$ respecto al eje $x$, lo que no altera
  la coordenada $x$.'
definiciones_clave: '- **Reconocimiento de la simetría par de la función coseno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a reconocimiento de la simetría par de la función coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    reconocimiento de la simetría par de la función coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de reconocimiento de la simetría par de la función coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
