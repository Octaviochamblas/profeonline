semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.SIMETRIA_PAR
resumen_inicial: 'Reconocimiento de la simetría par de la función coseno $f(-x) = \cos(x)$ y su simetría especular con respecto al eje Y.'
explicacion_simple: |
  En matemáticas, una función se llama **par** si al cambiar el signo de su variable de entrada (evaluar en $-x$ en lugar de $+x$), la respuesta sigue siendo exactamente la misma (devuelve el mismo $+y$). La función coseno cumple perfectamente esta regla: $\cos(-x) = \cos(x)$. Gráficamente, esto significa que la gráfica del coseno tiene una **simetría de espejo con respecto al eje vertical Y**. Todo lo que ocurre a la derecha del eje Y se refleja exactamente igual a la izquierda.
explicacion_formal: |
  ### Definición formal
  La función coseno fundamental $f(x) = \cos(x)$ es una **función par** porque satisface la condición de simetría reflexiva respecto al eje de las ordenadas (eje Y) para todo $x \in \mathbb{R}$:
  $$f(-x) = \cos(-x) = \cos(x) = f(x)$$

  ### Desglose simbólico
  - Evaluación en argumento negativo: $\cos(-x)$.
  - Absorción completa del signo: El signo negativo del argumento desaparece por completo: $\cos(-x) = \cos(x)$.
  - Consecuencia gráfica: Si el punto $(x,y)$ pertenece a la gráfica de la cosenoidal, entonces el punto opuesto simétrico $(-x, y)$ también pertenece a la gráfica con la **misma ordenada $y$**.

  ### Síntesis didáctica
  La simetría par simplifica significativamente el tratamiento de ángulos negativos. Permite ignorar por completo el signo negativo en el argumento del coseno (ejemplo: $\cos(-60^\circ) = \cos(60^\circ) = 0.5$).
definiciones_clave: |
  - **Función par**: Función real que satisface $f(-x) = f(x)$ para todo $x \in \operatorname{Dom}(f)$.
  - **Simetría axial respecto al eje Y**: Invariancia de la gráfica cartesiana ante una reflexión especular sobre el eje vertical $X = 0$.
  - **Absorción de signo**: Regla algebráica por la cual el signo negativo dentro del coseno se elimina sin alterar el resultado.
propiedades_relaciones: |
  - **Relación con el seno**: Mientras que el coseno es par ($\cos(-x) = \cos x$), el seno es impar ($\sin(-x) = -\sin x$).
  - **Propiedad del cociente**: La secante $\sec(x) = \frac{1}{\cos x}$ también es una función par.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad de simetría par para calcular el valor exacto de $\cos\left(-\frac{\pi}{4}\right)$ a partir del valor de $\cos\left(\frac{\pi}{4}\right)$.'
  pasos:
    - 'Paso 1: Recordar la identidad de función par: $\cos(-x) = \cos(x)$.'
    - 'Paso 2: Aplicar la identidad al argumento dado: $\cos\left(-\frac{\pi}{4}\right) = \cos\left(\frac{\pi}{4}\right)$.'
    - 'Paso 3: Sustituir el valor conocido en el primer cuadrante: $\cos\left(\frac{\pi}{4}\right) = \frac{\sqrt{2}}{2}$.'
    - 'Paso 4: Concluir que $\cos\left(-\frac{\pi}{4}\right) = \frac{\sqrt{2}}{2}$ manteniendo el resultado positivo.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la relación algebráica de simetría que define a la función coseno como una función par?'
    choices:
      - {text: '$\cos(-x) = \cos(x)$ para todo $x \in \mathbb{R}$', is_correct: true}
      - {text: '$\cos(-x) = -\cos(x)$ para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: '$\cos(-x) = 1 + \cos(x)$ para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: '$\cos(-x) = \frac{1}{\cos x}$ para todo $x \in \mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\cos(-x) = \cos(x)$ para todo $x \in \mathbb{R}$''. Es la propiedad algebráica definitoria de las funciones par.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se sabe que $\cos(60^\circ) = 0.5$, ¿cuál es el valor de $\cos(-60^\circ)$?'
    choices:
      - {text: '$0.5$', is_correct: true}
      - {text: '$-0.5$', is_correct: false}
      - {text: '$0$', is_correct: false}
      - {text: '$1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$0.5$''. Por simetría par: $\cos(-60^\circ) = \cos(60^\circ) = 0.5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si el argumento de la función coseno contiene un signo negativo ($\cos(-x)$).'
  - 'Paso 2: Eliminar el signo negativo aplicando la identidad $\cos(-x) = \cos(x)$.'
  - 'Paso 3: Calcular el valor del coseno para el argumento positivo $x$.'
  - 'Paso 4: Conservar el resultado numérico positivo o con su signo propio del primer cuadrante.'
errores_correccion: |
  - **Error 1:** Confundir la paridad del coseno pensando que $\cos(-x) = -\cos(x)$ (propiedad del seno). **Cómo corregirlo:** La función coseno es par; por ende, evaluar en un argumento negativo produce exactamente la misma salida positiva que el argumento positivo.
  - **Error 2:** Creer que la gráfica del coseno es simétrica con respecto al origen $(0,0)$. **Cómo corregirlo:** La simetría del coseno es un reflejo de espejo respecto al eje vertical Y, no respecto al punto origen $(0,0)$.
ejemplos:
  - titulo: 'Coseno de ángulo negativo cuadrantal'
    enunciado: '¿Cuánto vale $\cos(-\pi)$?'
    alternativas:
      - '$-1$'
      - '$1$'
      - '$0$'
    respuesta: '$-1$'
    solucion_pasos:
      - '1. $\cos(-\pi) = \cos(\pi)$.'
      - '2. Como $\cos(\pi) = -1$, el resultado es $-1$.'
  - titulo: 'Punto simétrico sobre la curva'
    enunciado: 'Si la gráfica del coseno contiene al punto $\left(\frac{\pi}{3}, \frac{1}{2}\right)$, ¿contiene también al punto $\left(-\frac{\pi}{3}, \frac{1}{2}\right)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la simetría par todo punto $(x,y)$ se refleja en $(-x, y)$ manteniendo la misma ordenada.'
  - titulo: 'Resta de coseno positivo y negativo'
    enunciado: '¿Es siempre cero la resta $\cos(x) - \cos(-x)$ para cualquier $x$ real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\cos(x) - \cos(-x) = \cos(x) - \cos(x) = 0$.'
  - titulo: 'Reflexión respecto al eje Y'
    enunciado: '¿Doblar la gráfica del coseno a lo largo del eje Y hace que el lado izquierdo coincida con el lado derecho?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la interpretación geométrica de la simetría especular respecto al eje Y.'
errores_frecuentes:
  - 'La afirmación de que la función coseno es una función impar que extrae el signo negativo fuera de la función.'
  - 'La afirmación de que la gráfica de la función coseno presenta simetría central respecto al origen $(0,0)$.'
  - 'La afirmación de que el valor de $\cos(-x)$ es siempre de signo opuesto al de $\cos(x)$.'
  - 'La afirmación de que la simetría par hace que el coseno valga siempre números positivos.'
  - 'La afirmación de que la expresión $\cos(-x) + \cos(x)$ resulta en cero.'
afirmaciones_verdaderas:
  - 'La función coseno es una función par que cumple la identidad analítica $\cos(-x) = \cos(x)$ para todo $x \in \mathbb{R}$.'
  - 'La gráfica de la función coseno es simétrica con respecto al eje vertical Y, lo que implica que el punto $(-x, y)$ pertenece a la curva siempre que $(x, y)$ pertenezca a ella.'
