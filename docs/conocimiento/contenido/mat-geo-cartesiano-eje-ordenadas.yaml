resumen_inicial: 'Identificación del eje de las ordenadas en el plano cartesiano:
  conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'El eje de las ordenadas es la ''línea de la pared'' del plano
  cartesiano: la recta vertical sobre la que se miden los valores de y.'
explicacion_formal: '![Eje de las ordenadas](/static/img/geometria/cartesiano-vectores/cartesiano-eje-ordenadas.svg)


  ### Definición formal


  El eje de las ordenadas (eje Y) es la recta vertical del plano cartesiano. Todos
  los puntos sobre esta recta tienen su primera coordenada (x) igual a cero.


  ### Desarrollo didáctico


  En la figura, el eje vertical resaltado es el eje de las ordenadas. Cualquier valor
  medido a lo largo de esta recta corresponde a la coordenada y de un punto.'
