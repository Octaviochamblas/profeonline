semantic_id: MAT.NUM.IRRACIONALES.DECIMAL_INFINITO_NO_PERIODICO
resumen_inicial: La representación decimal de un número irracional es una expansión
  decimal infinita no periódica, con cifras que no siguen ningún patrón repetitivo.
explicacion_simple: Cualquier número irracional escrito en forma decimal se extiende
  para siempre hacia la derecha sin que sus dígitos se repitan en un bloque o período.
  A diferencia de decimales como $0,333...$ que tienen patrón, en un decimal irracional
  los números siguen infinitamente sin patrón repetitivo.
explicacion_formal: 'Un número real $x \in \mathbb{R}$ es **Irracional** si y solo
  si su expansión decimal en base 10 es un **Decimal Infinito No Periódico**:


  $$x = a_0, a_1 a_2 a_3 \dots a_n \dots \quad \text{tal que } \neg (\exists k, p
  \in \mathbb{N} \mid a_{n+p} = a_n \, \forall n \ge k)$$


  **Desglose de la fórmula:**

  - Inexistencia de período $p$: No existe ninguna longitud de bloque $p$ ni posición
  de inicio $k$ a partir de la cual los dígitos se reiteren.

  - Infinitud de dígitos: El número de cifras tras la coma decimal no está acotado
  ($n \to \infty$).


  > **Complemento didáctico:** Los decimales finitos y los infinitos periódicos corresponden
  a $\mathbb{Q}$; los infinitos no periódicos corresponden a $\mathbb{I}$.'
definiciones_clave: '- **Decimal infinito no periódico**: Desarrollo decimal con infinitas
  cifras decimales sin periodicidad ni patrón de repetición.'
propiedades_relaciones: '- **Inexistencia de barra periódica**: La falta de patrón
  impide su conversión a fracción generatriz $a/b$.'
ejemplo_guiado:
  enunciado: Analice el número $x = 0,101001000100001...$ y determine si corresponde
    a un número racional o irracional.
  pasos:
  - 'Paso 1: Examinar la secuencia de cifras decimales: $10$, luego $100$, luego $1000$,
    luego $10000$, etc.'
  - 'Paso 2: Observar que la cantidad de ceros entre cada ''1'' aumenta progresivamente
    de forma infinita.'
  - 'Paso 3: Verificar la periodicidad: aunque existe un patrón de construcción claro,
    NO EXISTE un bloque fijo de cifras que se repita con una barra horizontal.'
  - 'Conclusión: Por tener una expansión decimal infinita sin período repetitivo,
    el número es un irracional ($x \in \mathbb{I}$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué distingue a la parte decimal de un número irracional de la de un
    número racional?
  choices:
  - text: Es infinita y NO periódica (sin patrón repetitivo)
    is_correct: true
  - text: Es infinita y periódica con barra
    is_correct: false
  - text: Es siempre finita de 3 decimales
    is_correct: false
  - text: Es igual a cero
    is_correct: false
  explanation: La alternativa correcta es 'Es infinita y NO periódica (sin patrón
    repetitivo)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 0,1010010001..., ¿por qué es un número irracional?
  choices:
  - text: Porque sus decimales son infinitos y no tienen un bloque fijo que se repita
      periódicamente
    is_correct: true
  - text: Because es igual a 1/10
    is_correct: false
  - text: Porque contiene solo unos y ceros
    is_correct: false
  - text: Es racional
    is_correct: false
  explanation: La alternativa correcta es 'Porque sus decimales son infinitos y no
    tienen un bloque fijo que se repita periódicamente'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Inspeccionar las cifras decimales del número en su desarrollo posicional.'
- 'Paso 2: Comprobar la ausencia de un bloque de cifras repetitivo con barra (período).'
- 'Paso 3: Clasificar la expansión como decimal infinita no periódica asociada a un
  número irracional.'
errores_correccion: '- **Error 1: Confundir un patrón de construcción lógico con una
  periodicidad matemática.** **Cómo corregirlo:** Un patrón como $0,1234567891011...$
  NO tiene barra repetitiva de período; por ende es IRRACIONAL.


  - **Error 2: Pensar que un decimal con muchas cifras es automático irracional.**
  **Cómo corregirlo:** Si tiene barra sobre sus cifras ($0,\overline{123}$), es racional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $0,3333...$ un decimal no periódico?
  alternativas:
  - No, es periódico puro con período 3 (es racional 1/3)
  - Sí, es irracional
  - Es finito
  respuesta: No, es periódico puro con período 3 (es racional 1/3)
  solucion_pasos:
  - $0,333... = 0,\overline{3} \in \mathbb{Q}$.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de decimal corresponde a $\sqrt{5} \approx 2,2360679...$?
  alternativas:
  - Decimal infinito no periódico (irracional)
  - Decimal periódico puro
  - Decimal finito
  respuesta: Decimal infinito no periódico (irracional)
  solucion_pasos:
  - Sus cifras avanzan indefinidamente sin período repetitivo.
- titulo: ¿Son todos los decimales infinitos no periódicos números irracionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición en notación decimal de los irracionales.
- titulo: ¿Se pueden escribir los decimales infinitos no periódicos como fracción
    a/b?
  respuesta: 'No'
  solucion_pasos:
  - No, la falta de período impide la existencia de una fracción generatriz.
errores_frecuentes:
- Un decimal infinito que presenta un patrón lógico de dígitos se clasifica como periódico
  puro.
- Todo número decimal que tiene más de 10 dígitos es automáticamente un decimal irracional.
- Los decimales infinitos no periódicos se transforman a fracción dividiendo el número
  por 999.
- El número $0,121212...$ es un número irracional por tener infinitas cifras decimales.
- La presencia de ceros en la expansión decimal garantiza que el número sea finito.
afirmaciones_verdaderas:
- Los números irracionales se caracterizan por poseer una representación decimal infinita
  no periódica.
- A diferencia de los racionales, en una expansión irracional es imposible colocar
  una barra de período sobre ningún bloque de dígitos.
al_terminar_debes_poder: Al terminar serás capaz de identificar decimales infinitos
  no periódicos, asociando su ausencia de patrón repetitivo con la pertenencia al
  conjunto de los números irracionales.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
