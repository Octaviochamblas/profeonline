semantic_id: MAT.NUM.IRRACIONALES.DECIMAL_INFINITO_NO_PERIODICO
resumen_inicial: La representación decimal de todo número irracional se caracteriza por ser
  un decimal infinito no periódico (aperiódico).
explicacion_simple: 'Existen tres tipos de expresiones decimales:

  1. **Finitas**: $0{,}25 = 1/4$ (Racional).

  2. **Infinitas periódicas**: $0{,}666... = 2/3$ (Racional).

  3. **Infinitas NO periódicas**: $1{,}41421356...$ (Irracional).

  Los números irracionales pertenecen exclusivamente a esta tercera categoría.'
explicacion_formal: Un número real $x$ admite una única representación decimal $x = a_0, a_1
  a_2 a_3...$. Dicha representación es no periódica (es decir, no existen $p, k \in \mathbb{N}$
  tales que $a_{n+p} = a_n$ para todo $n \ge k$) si y solo si $x \in \mathbb{I}$.
definiciones_clave: '- **Decimal infinito aperiódico**: Expansión decimal ilimitada sin repetición
  periódica de secuencias numéricas.'
propiedades_relaciones: '- **Imposibilidad de conversión**: No puede transformarse a fracción
  mediante métodos algebraicos de números periódicos.'
ejemplo_guiado:
  enunciado: Clasifica el número $2{,}313113111...$ según su representación decimal.
  pasos:
  - Observar que los decimales continúan indefinidamente (infinito).
  - 'Identificar la regla de construcción: añade un ''1'' adicional en cada bloque, por lo
    que nunca se repite un bloque fijo (no periódico).'
  - Concluir que es un decimal infinito no periódico, por lo tanto es irracional.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tipo de expansión decimal caracteriza a los números irracionales?
  choices:
  - text: Decimal infinita no periódica
    is_correct: true
  - text: Decimal finita
    is_correct: false
  - text: Decimal infinita periódica pura
    is_correct: false
  - text: Decimal infinita periódica mixta
    is_correct: false
  explanation: 'La correcta es: Decimal infinita no periódica. Es la propiedad decimal exclusiva
    de $\mathbb{I}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Es el número $0{,}7777...$ un número irracional?
  choices:
  - text: No, porque es periódico y equivale a 7/9 (es racional)
    is_correct: true
  - text: Sí, porque tiene infinitos decimales
    is_correct: false
  - text: Sí, porque no es entero
    is_correct: false
  - text: No se puede determinar
    is_correct: false
  explanation: 'La correcta es: No, porque es periódico y equivale a 7/9 (es racional). La
    condición para ser irracional exige que sea **no periódico**.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar la secuencia de cifras decimales.'
- 'Paso 2: Comprobar si existe un patrón repetitivo fijo (período).'
- 'Paso 3: Si los decimales no forman un período y son infinitos, clasificar como irracional.'
errores_correccion: Tener infinitos decimales no basta para ser irracional; deben ser **no
  periódicos**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $1{,}234567891011...$ irracional?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - Decimales infinitos no periódicos $\implies$ irracional.
- titulo: Ejemplo 2
  enunciado: ¿1,232323... (periódico) es racional o irracional?
  alternativas:
  - Racional
  - Irracional
  - No es un número real
  respuesta: Racional
  solucion_pasos:
  - Tiene un periodo que se repite, 23, por lo tanto es racional.
- titulo: Ejemplo 3
  enunciado: ¿0,1234567891011... (sin repetir bloque) es racional o irracional?
  alternativas:
  - Irracional
  - Racional
  - Depende del contexto
  respuesta: Irracional
  solucion_pasos:
  - No existe un bloque que se repita periódicamente.
- titulo: ¿Un decimal finito, como 0,75, se considera un número racional?
  respuesta: Sí
  solucion_pasos:
  - Todo decimal finito se puede escribir como fracción.
errores_frecuentes:
- Creer que todo número con decimales infinitos es irracional.
- Creer que basta con tener decimales infinitos para ser irracional, sin verificar si existe
  un periodo.
- Confundir un periodo largo, de muchas cifras, con la ausencia total de periodo.
- Pensar que 0,999... es un número distinto de 1, cuando en realidad son el mismo número racional.
- Redondear un número irracional y tratar el resultado redondeado como si fuera exacto.
afirmaciones_verdaderas:
- Los números irracionales poseen representación decimal infinita aperiódica.
- Un decimal infinito periódico, aunque tenga muchas cifras, siempre puede convertirse a una
  fracción y por lo tanto es racional.
al_terminar_debes_poder: Identificar números irracionales a partir de su representación decimal
  no periódica.
fuente: Texto escolar MINEDUC.
estado: publicado
