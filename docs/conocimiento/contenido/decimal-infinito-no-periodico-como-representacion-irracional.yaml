guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.01.02'
  title: 'Decimal infinito no periódico como representación irracional'
  description: 'Distingue y analiza la expansión decimal infinita no periódica como la firma característica de los números irracionales.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'decimal-infinito-no-periodico-como-representacion-irracional'
semantic_id: 'MAT.NUM.IRRACIONALES.DECIMAL_INFINITO_NO_PERIODICO'
titulo: 'Decimal infinito no periódico como representación irracional'
objetivo: 'Distinguir un decimal irracional (infinito no periódico) de uno periódico o finito a partir del análisis de su patrón decimal.'
introduccion: 'Dos números decimales pueden continuar indefinidamente con infinitos dígitos después de la coma y pertenecer a conjuntos numéricos completamente distintos. La clave decisiva no es la longitud de la cifra decimal, sino la existencia o ausencia de un patrón repetitivo llamado período. Cuando una cifra se extiende infinitamente sin caer jamás en un ciclo fijo de repetición, se trata de una expansión infinita no periódica, característica exclusiva de los números irracionales.'
resumen: 'La expansión decimal de un número irracional se caracteriza por dos propiedades simultáneas: es infinita y no periódica. Que un número tenga infinitos decimales no basta para ser irracional (por ejemplo, $0{,}333\dots = 0{,}\overline{3} = \frac{1}{3}$ es infinito pero periódico, por tanto racional).'
requisitos:
  - 'Comprensión de decimales finitos, periódicos puros y semiperiódicos.'
  - 'Definición básica de números racionales e irracionales.'
objetivos:
  - 'Identificar expansiones decimales infinitas no periódicas mediante la observación de secuencias no cíclicas.'
  - 'Diferenciar entre infinitud decimal periódica (racional) e infinitud decimal no periódica (irracional).'
que_aprenderas:
  - 'Por qué la ausencia de período impide convertir un decimal en fracción.'
  - 'Cómo reconocer patrones no periódicos (como construcciones por adición progresiva de ceros).'
  - 'La diferencia fundamental entre aproximaciones decimales y valores exactos irracionales.'
al_terminar_debes_ponder:
  - 'Determinar si una representación decimal dada corresponde a un número racional o irracional.'
  - 'Explicar por qué números como $0{,}1010010001\dots$ son irracionales aunque sigan una regla de formación.'
al_terminar_debes_poder:
  - 'Determinar si una representación decimal dada corresponde a un número racional o irracional.'
  - 'Explicar por qué números como $0{,}1010010001\dots$ son irracionales aunque sigan una regla de formación.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿Qué condición debe cumplir una expansión decimal para representar a un número irracional?'
    choices:
      - {text: 'Tener una cantidad finita de cifras decimales.', is_correct: false}
      - {text: 'Ser infinita y presentar un período que se repite indefinidamente.', is_correct: false}
      - {text: 'Ser infinita y no presentar ningún bloque de cifras que se repita periódicamente.', is_correct: true}
      - {text: 'Tener únicamente cifras impares después de la coma decimal.', is_correct: false}
    explanation: 'La correcta es: Ser infinita y no presentar ningún bloque de cifras que se repita periódicamente. Esta es la condición necesaria y suficiente de la representación decimal de un irracional.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: 'Considera el número $x = 0{,}12345678910111213\dots$ (formado al escribir los enteros consecutivos). ¿Es $x$ racional o irracional?'
    choices:
      - {text: 'Es racional, porque sus cifras siguen un orden determinado.', is_correct: false}
      - {text: 'Es irracional, porque su expansión decimal es infinita y no se repite periódicamente ningún bloque fijo.', is_correct: true}
      - {text: 'Es un entero positivo.', is_correct: false}
      - {text: 'Es racional, equivalente a $\frac{123}{999}$.', is_correct: false}
    explanation: 'La correcta es: Es irracional, porque su expansión decimal es infinita y no se repite periódicamente ningún bloque fijo. Seguir una regla de construcción no es lo mismo que ser periódico.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Observar una sección representativa de la expansión decimal.'
  - 'Paso 2: Buscar si existe un bloque fijo de dígitos que se repita indefinidamente (período).'
  - 'Paso 3: Si los dígitos continúan infinitamente sin formar un período repetitivo, concluir que el número es irracional.'
errores_frecuentes:
  - 'Confundir un decimal que sigue una regla de formación (como $0{,}1010010001\dots$) con un decimal periódico.'
  - 'Asumir que si un número tiene infinitas cifras decimales, automáticamente debe ser irracional (olvidando que $\frac{1}{3} = 0{,}333\dots$ es racional).'
errores_correccion: 'Un error clásico es pensar que tener una regla significa ser periódico. En el número $0{,}1010010001\dots$, hay una regla clara (agregar un cero más cada vez), pero nunca hay un patrón fijo que se repita de forma idéntica e indefinida. Por ende, no tiene período y es irracional.'
ejemplos:
  - titulo: 'Análisis de patrones decimales'
    enunciado: 'Clasifica los siguientes números decimales como racionales o irracionales: $N_1 = 0{,}\overline{45}$, $N_2 = 0{,}45455455545555\dots$'
    alternativas:
      - '$N_1$ es irracional y $N_2$ es racional.'
      - 'Ambos son racionales.'
      - '$N_1$ es racional y $N_2$ es irracional.'
      - 'Ambos son irracionales.'
    respuesta: '$N_1$ es racional y $N_2$ es irracional.'
    solucion_pasos:
      - '$N_1 = 0{,}\overline{45} = 0{,}454545\dots$ presenta el período $45$ que se repite idéntico e infinitamente. Se puede convertir a fracción ($\frac{45}{99} = \frac{5}{11}$), luego $N_1 \in \mathbb{Q}$.'
      - '$N_2 = 0{,}45455455545555\dots$ incrementa la cantidad de cincos en cada bloque. No existe un período fijo que se repita idénticamente, por lo que $N_2 \in \mathbb{I}$.'
  - titulo: 'Identificación de tipo de decimal'
    enunciado: '¿Cuál de las siguientes expansiones decimales corresponde a un número irracional?'
    alternativas:
      - '$3{,}14159$'
      - '$2{,}7182818281828\dots$ (donde $1828$ se repite infinitamente)'
      - '$1{,}414213562373095\dots$ (sin bloque repetitivo)'
      - '$0{,}999999\dots$'
    respuesta: '$1{,}414213562373095\dots$ (sin bloque repetitivo)'
    solucion_pasos:
      - '$3{,}14159$ es decimal finito (racional).'
      - '$2{,}7182818281828\dots$ tiene período $1828$ (racional).'
      - '$0{,}999999\dots = 1$ (racional).'
      - '$1{,}414213562373095\dots$ es la expansión decimal de $\sqrt{2}$, que es infinita y no periódica, por lo que es irracional.'
comprobacion_rapida:
  - afirmacion: 'Todo decimal infinito es un número irracional.'
    respuesta: false
    explicacion: 'Falso. Los decimales infinitos periódicos (como $0{,}\overline{6} = \frac{2}{3}$) son racionales.'
  - afirmacion: 'Un número irracional no puede convertirse en una fracción $\frac{a}{b}$ de enteros.'
    respuesta: true
    explicacion: 'Correcto. Precisamente por no tener período, no se puede aplicar el algoritmo de conversión a fracción.'
  - afirmacion: 'El número $0{,}202002000200002\dots$ es un número irracional.'
    respuesta: true
    explicacion: 'Correcto. Los ceros aumentan progresivamente, impidiendo la existencia de un período fijo.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales e irracionales.'
estado: 'publicado'
