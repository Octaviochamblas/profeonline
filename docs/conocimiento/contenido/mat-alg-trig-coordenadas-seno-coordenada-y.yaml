semantic_id: MAT.ALG.TRIG_COORDENADAS.SENO_COORDENADA_Y
resumen_inicial: 'Identificación del seno de un ángulo como la ordenada vertical $y$ del punto sobre el círculo unitario.'
explicacion_simple: |
  En el círculo unitario de radio 1, la altura o posición vertical $y$ del punto $P$ representa directamente el valor del seno ($\sin \theta$). Si el punto está por encima del eje horizontal (primer y segundo cuadrante), el seno es positivo. Si el punto está por debajo del eje horizontal (tercer y cuarto cuadrante), el seno es negativo. Al estar contenido en una circunferencia de radio 1, el seno siempre toma valores entre $-1$ y $1$.
explicacion_formal: |
  ### Definición formal
  En la circunferencia goniométrica $\mathcal{C}: x^2 + y^2 = 1$, la función **seno** se define formalmente como la proyección cartesiana sobre el eje de las ordenadas del punto intersección $P(x,y)$ correspondiente al ángulo orientativo $\theta$:
  $$\sin \theta = y = \operatorname{proy}_Y(P)$$
  con dominio $\theta \in \mathbb{R}$ y recorrido acotado $\sin \theta \in [-1, 1]$.

  ### Desglose simbólico
  - $y$: Ordenada vertical del punto $P(x,y)$ en el círculo unitario.
  - $\theta$: Ángulo en posición estándar en radianes o grados.
  - $\operatorname{proy}_Y(P)$: Cateto vertical opuesto dividido por la hipotenusa $r = 1$.

  ### Síntesis didáctica
  Identificar al seno como la coordenada $y$ permite determinar visualmente el comportamiento de la función seno: su valor es máximo ($1$) en la parte superior del círculo ($\theta = 90^\circ$), cero sobre el eje horizontal ($\theta = 0^\circ, 180^\circ$) y mínimo ($-1$) en la parte inferior ($\theta = 270^\circ$).
definiciones_clave: |
  - **Seno goniométrico**: Ordenada cartesiana $y$ del punto de intersección en el círculo unitario.
  - **Proyección vertical**: Distancia dirigida con signo desde el eje horizontal $X$ hasta el punto $P$.
  - **Recorrido del seno**: Intervalo cerrado $[-1, 1]$ que limita los valores del seno.
propiedades_relaciones: |
  - **Comportamiento por ejes**:
    - En $+X$ ($\theta = 0^\circ$): $\sin(0^\circ) = 0$.
    - En $+Y$ ($\theta = 90^\circ$): $\sin(90^\circ) = 1$.
    - En $-X$ ($\theta = 180^\circ$): $\sin(180^\circ) = 0$.
    - En $-Y$ ($\theta = 270^\circ$): $\sin(270^\circ) = -1$.
ejemplo_guiado:
  enunciado: 'Dado el punto $P\left(\frac{1}{2}, -\frac{\sqrt{3}}{2}\right)$ en el cuarto cuadrante sobre el círculo unitario, determina el valor de $\sin \theta$.'
  pasos:
    - 'Paso 1: Identificar las coordenadas del punto: $x = \frac{1}{2}$ e $y = -\frac{\sqrt{3}}{2}$.'
    - 'Paso 2: Aplicar la definición funcional del seno en el círculo unitario: $\sin \theta = y$.'
    - 'Paso 3: Tomar el valor de la ordenada vertical: $\sin \theta = -\frac{\sqrt{3}}{2}$.'
    - 'Paso 4: Concluir que el seno es negativo debido a que el punto está ubicado bajo el eje X.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el círculo unitario, ¿qué elemento del punto cartesiano $P(x,y)$ representa al seno del ángulo $\theta$?'
    choices:
      - {text: 'La ordenada vertical $y$', is_correct: true}
      - {text: 'La abscisa horizontal $x$', is_correct: false}
      - {text: 'La pendiente de la recta', is_correct: false}
      - {text: 'El cuadrado del radio $r^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La ordenada vertical $y$''. Por definición goniométrica, $\sin \theta = y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto correspondiente a un ángulo de $90^\circ$ sobre el círculo unitario es $(0, 1)$, ¿cuál es el valor de $\sin(90^\circ)$?'
    choices:
      - {text: '$1$', is_correct: true}
      - {text: '$0$', is_correct: false}
      - {text: '$-1$', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''$1$''. Corresponde a la coordenada vertical $y = 1$ en el punto $(0, 1)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las coordenadas $(x, y)$ del punto sobre el círculo unitario.'
  - 'Paso 2: Aislar la segunda coordenada del par ordenado (la ordenada $y$).'
  - 'Paso 3: Asignar $\sin \theta = y$.'
  - 'Paso 4: Verificar que el resultado pertenezca al intervalo $[-1, 1]$.'
errores_correccion: |
  - **Error 1:** Confundir el seno con la coordenada horizontal $x$. **Cómo corregirlo:** La abscisa horizontal $x$ es el coseno. El seno es estrictamente la proyección vertical $y$.
  - **Error 2:** Creer que el seno es positivo en los cuadrantes inferiores. **Cómo corregirlo:** En los cuadrantes III y IV la ordenada $y$ se ubica por debajo del eje $X$, por lo que el seno es negativo ($y < 0$).
ejemplos:
  - titulo: 'Seno de 90 grados'
    enunciado: 'Para el punto $(0, 1)$ en $\theta = 90^\circ$, ¿cuál es el valor de $\sin(90^\circ)$?'
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. La ordenada $y = 1$.'
      - '2. Por lo tanto, $\sin(90^\circ) = 1$.'
  - titulo: 'Seno en el segundo cuadrante'
    enunciado: 'Si un punto en el círculo unitario es $P\left(-\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$, ¿cuánto vale su seno?'
    alternativas:
      - '$\frac{1}{2}$'
      - '$-\frac{\sqrt{3}}{2}$'
      - '$1$'
    respuesta: '$\frac{1}{2}$'
    solucion_pasos:
      - '1. La ordenada $y$ vale $\frac{1}{2}$.'
      - '2. $\sin \theta = y = \frac{1}{2}$.'
  - titulo: 'Seno de 180 grados'
    enunciado: '¿El seno del ángulo de $180^\circ$ vale cero porque el punto $(-1,0)$ tiene ordenada $y = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $(-1,0)$, $y = 0 \implies \sin(180^\circ) = 0$.'
  - titulo: 'Seno de 270 grados'
    enunciado: '¿El seno del ángulo de $270^\circ$ vale $-1$ debido a la coordenada en el punto $(0,-1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $(0,-1)$, $y = -1 \implies \sin(270^\circ) = -1$.'
errores_frecuentes:
  - 'La afirmación de que el seno de un ángulo equivale a la coordenada horizontal $x$ en el círculo unitario.'
  - 'La afirmación de que el seno de un ángulo en el círculo unitario puede tomar el valor de $-1.5$.'
  - 'La afirmación de que el seno en el cuarto cuadrante es una cantidad positiva.'
  - 'La afirmación de que en el punto $(1, 0)$ el valor del seno es $1$.'
  - 'La afirmación de que el seno del ángulo recto $90^\circ$ es cero.'
afirmaciones_verdaderas:
  - 'En el círculo unitario, el seno de un ángulo equivale exactamente a la ordenada cartesiana $y$ del punto correspondiente.'
  - 'El conjunto recorrido de la función seno en el círculo unitario está acotado en el intervalo $[-1, 1]$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular el seno de cualquier ángulo en el círculo unitario.
  CÓMO: Extraer la ordenada cartesiana $y$ del punto intersección correspondiente en el círculo unitario.
