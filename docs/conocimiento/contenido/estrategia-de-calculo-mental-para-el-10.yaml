resumen_inicial: 'La estrategia de cálculo mental para el $10\%$ consiste en dividir
  la cantidad $N$ entre $10$, lo que equivale a desplazar la coma decimal una posición
  hacia la izquierda: $10\% \text{ de } N = \frac{N}{10}$.'
explicacion_simple: Para calcular mentalmente el 10% de cualquier número de forma
  rápida, simplemente dividimos el número entre 10 quitándole un cero al final o corriendo
  la coma decimal un lugar a la izquierda.
explicacion_formal: 'Para toda cantidad $N \in \mathbb{R}$, la **Estrategia del Dígito
  Decimal del $10\%$** opera mediante la propiedad:


  $$10\% \cdot N = \frac{10}{100} \cdot N = \frac{1}{10} \cdot N = \frac{N}{10}$$


  **Derivación de otros porcentajes mediante múltiplos del $10\%$:**

  - $20\% = 2 \cdot (10\%)$.

  - $5\% = \frac{10\%}{2}$.

  - $30\% = 3 \cdot (10\%)$.'
definiciones_clave: '- **Estrategia mental del 10%**: División rápida $10\% \cdot
  N = \frac{N}{10}$.'
propiedades_relaciones: '- **Base pivote de cálculo mental**: Permite calcular $5\%,
  15\%, 20\%, 30\%$ combinando mitades y dobles.'
ejemplo_guiado:
  enunciado: Calcule mentalmente el $10\%$ y el $30\%$ de $450$.
  pasos:
  - 'Paso 1: Para el $10\%$, dividir $450$ entre $10 \implies 10\% = 45$.'
  - 'Paso 2: Para el $30\%$, triplicar el resultado del $10\%$: $3 \cdot 45 = 135$.'
  - 'Conclusión: El $10\%$ de $450$ es $45$ y el $30\%$ es $135$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la regla de cálculo mental para obtener el 10% de un
    número N?
  choices:
  - text: En dividir la cantidad N entre 10 (desplazando la coma un lugar a la izquierda)
    is_correct: true
  - text: En multiplicar N por 10
    is_correct: false
  - text: En restar 10 a la cantidad
    is_correct: false
  - text: En sacar la raíz cuadrada de N
    is_correct: false
  explanation: La alternativa correcta es 'En dividir la cantidad N entre 10 (desplazando
    la coma un lugar a la izquierda)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 450, ¿cuál fue el 30% obtenido a partir del
    10%?
  choices:
  - text: 135 (porque 3 · 45 = 135)
    is_correct: true
  - text: '45'
    is_correct: false
  - text: '90'
    is_correct: false
  - text: '150'
    is_correct: false
  explanation: La alternativa correcta es '135 (porque 3 · 45 = 135)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular mentalmente el $10\%$
  dividiendo entre 10 y derivar porcentajes múltiples ($5\%, 15\%, 20\%, 30\%$) de
  forma ágil.
semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_DIEZ
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.CALCULO_MENTAL_DIEZ.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
