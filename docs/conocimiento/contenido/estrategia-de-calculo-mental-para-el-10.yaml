semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_DIEZ
resumen_inicial: 'La estrategia de cálculo mental para el $10\%$ calcula la décima parte de una cantidad $C$ dividiéndola entre 10 o corriendo su coma decimal una posición a la izquierda.'
explicacion_simple: |
  El $10\%$ es el porcentaje más fácil y útil para calcular mentalmente en la vida cotidiana (propinas, impuestos, descuentos). Para hallar el $10\%$ de cualquier número:
  - Si el número termina en cero, simplemente **le quitas el último cero** (ej: el $10\%$ de $45.000$ es $4.500$).
  - Si el número no termina en cero, **mueves la coma decimal un lugar a la izquierda** (ej: el $10\%$ de $73$ es $7,3$).
  Además, conociendo el $10\%$, puedes calcular rápidamente el $5\%$ (la mitad del 10%) o el $20\%$ (el doble del 10%).
explicacion_formal: |
  ### Definición formal
  La **propiedad del operador $10\%$** se basa en la equivalencia fraccionaria simplificada de denominador decimal base 10:
  $$10\% = \frac{10}{100} = \frac{1}{10} = 0,1$$

  ### Regla de cálculo mental por división escalar
  Calcular el $10\%$ de un número real $C$ es equivalente a multiplicar $C$ por $0,1$, lo que en la notación posicional decimal corresponde a dividir $C$ por $10$:
  $$10\% \text{ de } C = \frac{C}{10}$$

  ### Estrategia pivote para otros porcentajes
  El valor de $10\% = \frac{C}{10}$ actúa como un nodo o pivote aritmético mental para determinar otros porcentajes mediante operaciones simples:
  - **$5\%$**: $\frac{10\%}{2} = \frac{C}{20}$.
  - **$20\%$**: $2 \cdot 10\% = \frac{C}{5}$.
  - **$30\%$**: $3 \cdot 10\% = \frac{3C}{10}$.
  - **$15\%$**: $10\% + 5\% = \frac{C}{10} + \frac{C}{20}$.

  ### Síntesis didáctica
  - Operación: $10\% \text{ de } C = C \div 10$.
  - Módulo posicional: Desplazar coma un lugar a la izquierda.
definiciones_clave: |
  - **Porcentaje pivote ($10\%$)**: Porcentaje de referencia básica ($1/10$) utilizado para derivar rápidamente otros porcentajes.
  - **Supresión de cero final**: Simplificación rápida en enteros terminados en cero que equivale a dividir por 10.
  - **Regla del 15% (propina)**: Estrategia que suma el 10% más su mitad (5%).
propiedades_relaciones: |
  - **Invariancia multiplicativa**: Si la cantidad $C$ se duplica, el $10\%$ de esa cantidad resultará ser exactamente el doble del $10\%$ original.
  - **Rapidez algorítmica**: La división por 10 requiere 0 operaciones de cómputo escrito en el sistema decimal de numeración.
ejemplo_guiado:
  enunciado: 'Aplica la estrategia de cálculo mental para hallar el $10\%$ y el $15\%$ de una cuenta de restaurante de $\$24.000$.'
  pasos:
    - 'Paso 1: Para el $10\%$, dividimos $\$24.000$ entre $10$ eliminando el último cero: $10\% = \$2.400$.'
    - 'Paso 2: Para el $5\%$, tomamos la mitad del $10\%$ recién calculado: $5\% = 2.400 \div 2 = \$1.200$.'
    - 'Paso 3: Para el $15\%$, sumamos el $10\%$ y el $5\%$: $15\% = 2.400 + 1.200 = \$3.600$.'
    - 'Paso 4: Respuestas: El $10\%$ es **$\$2.400$** y la propina del $15\%$ es **$\$3.600$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la regla de cálculo mental para obtener inmediatamente el $10\%$ de cualquier cantidad?'
    choices:
      - {text: 'Dividir la cantidad entre 10 o desplazar la coma decimal un lugar hacia la izquierda', is_correct: true}
      - {text: 'Dividir la cantidad entre 100', is_correct: false}
      - {text: 'Multiplicar la cantidad por 10', is_correct: false}
      - {text: 'Restar 10 a la cantidad total', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir la cantidad entre 10 o desplazar la coma decimal un lugar hacia la izquierda''. $10\% = 1/10$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el $10\%$ de un monto es $\$3.500$, ¿cuánto dinero representa el $20\%$ de ese mismo monto?'
    choices:
      - {text: '$\$7.000$, duplicando el valor del $10\%$ ($3.500 \cdot 2 = 7.000$)', is_correct: true}
      - {text: '$\$35.000$, multiplicando por 10', is_correct: false}
      - {text: '$\$1.750$, dividiendo por dos', is_correct: false}
      - {text: '$\$70.000$, quadruplicando', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$7.000$, duplicando el valor del $10\%$ ($3.500 \cdot 2 = 7.000$)''. El $20\%$ es el doble del $10\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la cantidad $C$.'
  - 'Paso 2: Si $C$ es entero terminado en cero, eliminar el último cero. Si tiene decimales o no termina en cero, mover la coma decimal un lugar hacia la izquierda.'
  - 'Paso 3: El resultado obtenido es el $10\%$ de $C$.'
  - 'Paso 4: Si se requiere $5\%$, $20\%$ o $15\%$, aplicar mitades, dobles o sumas sobre el $10\%$ hallado.'
errores_correccion: |
  - **Error 1:** Mover la coma dos lugares a la izquierda al buscar el $10\%$ (confundiéndolo con el $1\%$). **Cómo corregirlo:** El $10\%$ corresponde a una décima parte, por lo que **se desplaza la coma solo UN lugar a la izquierda**.
  - **Error 2:** Multiplicar por 10 en lugar de dividir por 10. **Cómo corregirlo:** El $10\%$ es una reducción fraccionaria ($\frac{1}{10}$); **se debe DIVIDIR entre 10**, nunca multiplicar.
ejemplos:
  - titulo: 'Cálculo mental del 10% en números enteros'
    enunciado: '¿El $10\%$ de $850$ es $85$?'
    alternativas:
      - 'Sí, pues $850 / 10 = 85$'
      - 'No, es 8.5'
      - 'No, es 8500'
    respuesta: 'Sí, pues $850 / 10 = 85$'
    solucion_pasos:
      - '1. Eliminamos el cero final de 850.'
      - '2. Resultado: 85.'
  - titulo: 'Cálculo mental del 10% con coma decimal'
    enunciado: '¿El $10\%$ de $\$4.250$ es $\$425$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $4.250 \div 10 = \$425$.'
  - titulo: 'Derivación del 5% a partir del 10%'
    enunciado: 'Si el $10\%$ de $600$ es $60$, ¿el $5\%$ es $30$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Mitad de 60 es 30.'
  - titulo: 'Derivación del 20% a partir del 10%'
    enunciado: 'Si el $10\%$ de $150$ es $15$, ¿el $20\%$ es $30$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Doble de 15 es 30.'
errores_frecuentes:
  - 'Mover la coma decimal dos posiciones a la izquierda en lugar de una al calcular el 10%.'
  - 'Multiplicar la cantidad por 10 creyendo que se está calculando el 10%.'
  - 'Sumar 10 a la cifra original en lugar de realizar la división entre 10.'
  - 'Los números enteros que no terminan en cero conservan su cifra idéntica al calcular el 10%.'
  - 'El cálculo mental del 10% se efectúa dividiendo el número entre 2.'
afirmaciones_verdaderas:
  - 'El $10\%$ de una cantidad equivale a su décima parte ($\frac{1}{10}$) y se calcula dividiendo la cantidad por 10.'
  - 'A partir del $10\%$, se puede obtener el $5\%$ calculando la mitad y el $20\%$ calculando el doble.'
al_terminar_debes_poder: 'Calcular mentalmente el $10\%$ de cualquier cantidad dividiendo por 10 y derivar porcentajes como el $5\%$, $15\%$ y $20\%$.'
