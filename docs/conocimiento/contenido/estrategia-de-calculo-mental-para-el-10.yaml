semantic_id: MAT.NUM.PORCENTAJES.CALCULO_MENTAL_DIEZ
resumen_inicial: 'Estrategia de cálculo mental para el 10%: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: No siempre tienes una calculadora a mano en el supermercado. Aprender
  a calcular el 10% en tu cabeza te dará superpoderes para estimar el 20%, 30% o 50% en segundos.
explicacion_formal: 'El **$10\%$** es la base del cálculo mental porque equivale a la fracción
  $10/100$, que simplificada es $1/10$.


  **Regla de oro del 10%:**

  Para calcular el 10% de un número, mueve su punto decimal una posición a la izquierda.

  - El 10% de 450 es 45.

  - El 10% de 35 es 3.5.


  Una vez tienes el 10%, calcular múltiplos es fácil:

  - **$20\%$**: Calcula el 10% y el resultado multiplícalo por 2.

  - **$30\%$**: Calcula el 10% y multiplícalo por 3.

  - **$5\%$**: Calcula el 10% y divídelo por 2 (es la mitad).'
definiciones_clave: '- **Estrategia de cálculo mental para el 10%**: Elemento central dentro
  del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a estrategia de cálculo mental para el 10%.'
ejemplo_guiado:
  enunciado: Calcula mentalmente el 30% de 250 usando la estrategia del 10%.
  pasos:
  - 'Calculo el 10% de 250 moviendo la coma un lugar a la izquierda: 25.'
  - 'Multiplico ese resultado por 3, ya que 30% es tres veces el 10%: 25 por 3.'
  - Obtengo 75. El 30% de 250 es 75.
