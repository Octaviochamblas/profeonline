semantic_id: MAT.NUM.PORCENTAJES.CALC_MENTAL_10
resumen_inicial: La estrategia de cálculo mental para el $10\%$ consiste en dividir
  la cantidad entre 10 (eliminando un cero final o desplazando la coma decimal un
  lugar a la izquierda), actuando como pivote para calcular $5\%$, $15\%$, $20\%$
  y $30\%$.
explicacion_simple: '![Estrategia de cálculo mental para el 10%](/static/img/nodos/estrategia-de-calculo-mental-para-el-10-intro.svg)


  El $10\%$ es el rey del cálculo mental. Para calcular el $10\%$ de cualquier número,
  solo debes **dividir entre $10$** (si termina en cero, le quitas un cero; si no,
  corres la coma un lugar a la izquierda). Por ejemplo, el $10\%$ de $\$48.000$ es
  $\$4.800$, y el $10\%$ de $65$ es $6,5$. A partir del $10\%$ puedes deducir el $5\%$
  (la mitad) o el $20\%$ (el doble) en un segundo.

  '
explicacion_formal: '### Operador pivote decimal

  Dado $N \in \mathbb{R}^+$, el operador del $10\%$ está definido por la división
  decimal directa:

  $$10\%(N) = \frac{10}{100} \cdot N = \frac{N}{10} = N \cdot 10^{-1}$$


  ### Derivación de múltiplos y submúltiplos canónicos

  Conociendo $u_{10} = 10\%(N) = \frac{N}{10}$:

  - **5% (Submúltiplo medio)**: $5\%(N) = \frac{u_{10}}{2}$

  - **20% (Duplo)**: $20\%(N) = 2 \cdot u_{10}$

  - **30% (Triplo)**: $30\%(N) = 3 \cdot u_{10}$

  - **15% (Estrategia de adición rápida)**: $15\%(N) = u_{10} + \frac{u_{10}}{2}$

  '
definiciones_clave: '- **Pivote del 10%**: Valor base de referencia mental $N \div
  10$ a partir del cual se componen otras tasas.

  - **Desplazamiento unario**: Movimiento de exactamente 1 posición decimal hacia
  la izquierda.

  - **Composición aditiva mental**: Técnica de sumar $10\% + 5\%$ para obtener el
  $15\%$.

  '
propiedades_relaciones: '- **Regla de supresión de ceros**: Si $N = k \cdot 10$, entonces
  $10\%(N) = k$.

  - **Simetría del 5% y 20%**: El $5\%$ es la mitad del $10\%$ y el $20\%$ es el doble
  del $10\%$.

  '
ejemplo_guiado:
  enunciado: Calcula mentalmente una propina del $10\%$, una del $5\%$ y una del $15\%$
    sobre una cuenta de $\$64.000$.
  pasos:
  - 'Paso 1: Calculamos el 10% quitando un cero a $\$64.000$: $10\% = 64.000 \div
    10 = $\$6.40$0$.'
  - 'Paso 2: Calculamos el 5% dividiendo el 10% entre 2: $5\% = 6.400 \div 2 = $\$3.20$0$.'
  - 'Paso 3: Calculamos el 15% sumando el 10% y el 5%: $15\% = 6.400 + 3.200 = $\$9.60$0$.'
  - 'Paso 4: Conclusiones: $10\% = $\$6.40$0$, $5\% = $\$3.20$0$ y $15\% = $\$9.60$0$.'
  imagen: /static/img/nodos/estrategia-de-calculo-mental-para-el-10-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el $10\%$ de $850$?
  choices:
  - text: $85$
    is_correct: true
  - text: $8,5$
    is_correct: false
  - text: $8500$
    is_correct: false
  - text: $0,85$
    is_correct: false
  explanation: La alternativa correcta es $85$. Dividimos $850 \div 10 = 85$ (eliminamos
    el cero final).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el $10\%$ de una cuenta es $\$3.600$, ¿cuánto es el $20\%$, el $5\%$
    y el $15\%$, respectivamente?
  choices:
  - text: $\$7.200$, $\$1.800$ y $\$5.400$
    is_correct: true
  - text: $\$6.000$, $\$1.500$ y $\$4.500$
    is_correct: false
  - text: $\$7.200$, $\$3.600$ y $\$10.800$
    is_correct: false
  - text: $\$3.600$, $\$1.800$ y $\$7.200$
    is_correct: false
  choices_order: original
  explanation: La alternativa correcta es $\$7.200$, $\$1.800$ y $\$5.400$. $20\%
    = 2 \cdot 3.600 = 7.200$, $5\% = 3.600 / 2 = 1.800$, y $15\% = 7.200 / 2 + 1.800
    = 5.400$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir la cantidad $N$ entre $10$ eliminando el último cero o corriendo
  la coma 1 posición a la izquierda para hallar el $10\%$.'
- 'Paso 2: Para hallar el $5\%$, dividir el resultado del $10\%$ por $2$.'
- 'Paso 3: Para hallar el $20\%$ o $30\%$, multiplicar el resultado del $10\%$ por
  $2$ o por $3$.'
- 'Paso 4: Para hallar el $15\%$, sumar los resultados del $10\%$ y del $5\%$.'
errores_correccion: '- **Error 1:** Correr la coma dos lugares en lugar de uno (obteniendo
  el $1\%$ en lugar del $10\%$). **Cómo corregirlo:** El $10\%$ divide por 10, por
  lo que **SIEMPRE se corre la coma solo 1 lugar: $N \div 10$**.

  - **Error 2:** Olvidar colocar la coma decimal en números que no terminan en cero
  (ej: $10\%$ de $75$ es $7,5$, no $75$ ni $0,75$).

  '
ejemplos:
- titulo: Cálculo del 10% con coma decimal
  enunciado: ¿Cuál es el $10\%$ de $45$?
  alternativas:
  - $4,5$
  - $0,45$
  - $450$
  - $45$
  respuesta: $4,5$
  solucion_pasos:
  - '1. Dividimos entre 10: $45 \div 10 = 4,5$.'
  - 2. Corremos la coma un lugar a la izquierda.
- titulo: Cálculo del 5% mental
  enunciado: ¿El $5\%$ de $\$80.000$ es igual a $\$4.000$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $10\% = $\$8.000$ \implies 5\% = 8.000 / 2 = $\$4.00$0$.
- titulo: Cálculo del 20% mental
  enunciado: ¿El $20\%$ de $350$ es igual a $70$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $10\% = 35 \implies 20\% = 2 \cdot 35 = 70$.
- titulo: Cálculo del 15% mental
  enunciado: ¿El $15\%$ de $\$20.000$ es igual a $\$3.000$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $10\% = 2.000$, $5\% = 1.000 \implies 15\% = 2.000 + 1.000 = $\$3.00$0$.
errores_frecuentes:
- Desplazar la coma dos lugares en vez de uno.
- Confundir el cálculo del 5% con dividir entre 5 en vez de dividir el 10% entre 2.
- Olvidar sumar los dos componentes en el cálculo del 15%.
afirmaciones_verdaderas:
- El 10% de cualquier número se obtiene dividiendo entre 10 (desplazando la coma 1
  posición a la izquierda).
- El 15% se calcula rápidamente sumando el 10% más la mitad de ese 10% (5%).
al_terminar_debes_poder: '![Resumen de estrategia de cálculo mental para el 10%](/static/img/nodos/estrategia-de-calculo-mental-para-el-10-resumen.svg)


  QUÉ: Calcular mentalmente el $10\%$ de cualquier cantidad y derivar con agilidad
  el $5\%$, $15\%$, $20\%$ y $30\%$.

  CÓMO: Dividiendo entre 10 ($10\% = N \div 10$) y aplicando operaciones de duplicación,
  bisección y adición ($20\% = 2 \cdot 10\%$, $5\% = 10\% \div 2$, $15\% = 10\% +
  5\%$).

  '
