procedimiento:
- 'Paso 1: Mueve la coma decimal un lugar a la izquierda para obtener el 10%.'
- 'Paso 2: Si te piden el 20%, multiplica ese resultado por 2. Si es 30%, por 3, etc.'
- 'Paso 3: Si te piden el 5%, saca la mitad del valor obtenido en el Paso 1.'
errores_correccion: Evita confundir los datos de entrada al operar con estrategia de cálculo
  mental para el 10%.
ejemplos:
- titulo: Cálculo en restaurante
  enunciado: La cuenta es de $18.000. Quieres dejar un 15% de propina. ¿Cuánto es mentalmente?
  solucion_pasos:
  - 'Calculamos el 10%: Movemos un cero. Es $1.800.'
  - 'Calculamos el 5%: Es la mitad del 10%. La mitad de 1.800 es $900$.'
  - 'Sumamos ambos: $1.800 + 900 = 2.700$ de propina.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el 10% de 620 mentalmente?
  alternativas:
  - '62'
  - 6,2
  - '620'
  respuesta: '62'
  solucion_pasos:
  - Se mueve la coma un lugar a la izquierda.
- titulo: Ejemplo 3
  enunciado: Usando la estrategia del 10%, ¿cuál es el 40% de 90?
  alternativas:
  - '36'
  - '9'
  - '40'
  respuesta: '36'
  solucion_pasos:
  - El 10% de 90 es 9; 9 por 4 es igual a 36.
- titulo: ¿El 5% de un número es la mitad de su 10%?
  respuesta: Sí
  solucion_pasos:
  - Por eso se calcula el 10% primero y luego se divide por 2.
errores_frecuentes:
- Mover la coma dos espacios en lugar de uno (eso calcula el 1%, no el 10%).
- Tratar de multiplicar directamente por 0.15 mentalmente en lugar de desglosarlo en 10% +
  5%.
- Mover la coma decimal dos espacios en vez de uno, calculando por error el 1% en lugar del
  10%.
- Intentar multiplicar directamente por la forma decimal completa del porcentaje en vez de
  usar la estrategia de descomponer en 10%.
- Olvidar que el 10% de un número decimal también se calcula moviendo la coma un lugar a la
  izquierda.
afirmaciones_verdaderas:
- La propiedad de estrategia de cálculo mental para el 10% preserva la consistencia lógica.
- Para calcular mentalmente cualquier múltiplo de 10%, como 20%, 30% o 40%, basta con calcular
  el 10% y multiplicarlo por el dígito correspondiente.
al_terminar_debes_poder: Resolver problemas aplicados que involucren estrategia de cálculo
  mental para el 10%.
