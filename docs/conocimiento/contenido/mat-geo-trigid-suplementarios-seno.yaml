semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.SUPLEMENTARIOS_SENO
resumen_inicial: 'Relación del seno entre ángulos suplementarios: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Dos ángulos son suplementarios si su suma es 180°. En la circunferencia
  unitaria, los puntos correspondientes a ángulos suplementarios tienen la misma coordenada
  y (altura), por lo que comparten el mismo seno.
explicacion_formal: '![Seno de ángulos suplementarios](/static/img/geometria/trigonometria/trigid-suplementarios-seno.svg)


  ### Definición formal


  Para cualquier ángulo $x$, se cumple $\sin(180°-x)=\sin x$, ya que el punto correspondiente
  a $180°-x$ en la circunferencia unitaria es el reflejo horizontal del punto correspondiente
  a $x$, con la misma coordenada y.


  ### Desarrollo didáctico


  En la figura, θ=50° y su suplementario 180°-θ=130°. Ambos ángulos tienen el mismo
  seno, ya que sus puntos en la circunferencia unitaria están a la misma altura (misma
  coordenada y), aunque con coordenada x de signo opuesto.'
definiciones_clave: '- **Relación del seno entre ángulos suplementarios**: Elemento
  o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación del seno entre ángulos suplementarios.'
