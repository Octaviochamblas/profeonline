semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_EQUIDISTANCIA_VERTICES
resumen_inicial: 'Propiedad del circuncentro como punto equidistante de los vértices
  del triángulo: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: Una propiedad notable del circuncentro es que, sin importar la
  forma del triángulo, su distancia a cada uno de los tres vértices es siempre la
  misma.
explicacion_formal: '![Circuncentro equidistante de los tres vértices](/static/img/geometria/elementos-secundarios/simetral-circuncentro-circuncentro-equidistancia-vertices.svg)


  ### Definición formal


  Si O es el circuncentro de un triángulo ABC, las distancias OA, OB y OC son todas
  iguales entre sí, y esa distancia común es el radio de la circunferencia circunscrita.


  ### Desarrollo didáctico


  Esta propiedad es consecuencia directa de que O está sobre las tres simetrales:
  todo punto de la simetral de un lado es equidistante de los dos vértices que definen
  ese lado, y al estar O en las tres simetrales a la vez, queda equidistante de los
  tres vértices.'
definiciones_clave: '- **Propiedad del circuncentro como punto equidistante de los
