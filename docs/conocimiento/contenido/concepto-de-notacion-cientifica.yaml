semantic_id: MAT.NUM.NOTACION_CIENTIFICA.CONCEPTO
resumen_inicial: La notación científica expresa un número como el producto de un coeficiente
  $k$ (donde $1 \le |k| < 10$) y una potencia de base 10 con exponente entero ($k
  \cdot 10^n$).
explicacion_simple: 'Para escribir números extremadamente grandes (como la distancia
  a las estrellas) o muy pequeños (como el tamaño de una bacteria) sin llenar la página
  de ceros, usamos la **notación científica**:

  $$k \cdot 10^n$$

  Donde $k$ es un número entre $1$ y $10$ (puede ser $1$, pero debe ser menor que
  $10$), y $10^n$ es la potencia de diez que indica dónde va la coma.'
explicacion_formal: 'Todo número real $x \neq 0$ puede expresarse de manera única
  en notación científica como:

  $$x = k \cdot 10^n$$

  Donde $k \in \mathbb{R}$ satisface $1 \le |k| < 10$ (mantisa o coeficiente) y $n
  \in \mathbb{Z}$ (orden de magnitud).'
definiciones_clave: '- **Mantisa / Coeficiente ($k$)**: Número real que cumple la
  condición estricta $1 \le |k| < 10$.

  - **Orden de magnitud ($n$)**: Exponente entero de la potencia de 10.'
propiedades_relaciones: '- **Condición de normalización**: Si $|k| \ge 10$ o $|k|
  < 1$, la expresión NO está en notación científica estándar.'
ejemplo_guiado:
  enunciado: 'Determina cuál de las siguientes expresiones está en notación científica
    válida: A) $3{,}5 \cdot 10^6$ o B) $12 \cdot 10^4$.'
  pasos:
  - 'Evaluar expresión A: $k = 3{,}5$. Como $1 \le 3{,}5 < 10$, es válida.'
  - 'Evaluar expresión B: $k = 12$. Como $12 \ge 10$, no cumple la condición de notación
    científica.'
  - Concluir que solo A está en notación científica correcta.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes expresiones cumple con el formato estándar de
    notación científica?
  choices:
  - text: 4,2 · 10^8
    is_correct: true
  - text: 0,42 · 10^9
    is_correct: false
  - text: 42 · 10^7
    is_correct: false
  - text: 4,2 · 5^8
    is_correct: false
  explanation: 'La correcta es: 4,2 · 10^8. Cumple que $1 \le 4{,}2 < 10$ y la base
    de la potencia es 10.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la notación científica $x = k \cdot 10^n$, ¿qué rango de valores debe
    cumplir el coeficiente $|k|$?
  choices:
  - text: 1 ≤ |k| < 10
    is_correct: true
  - text: 0 < |k| < 10
    is_correct: false
  - text: 1 < |k| ≤ 10
    is_correct: false
  - text: 10 ≤ |k| < 100
    is_correct: false
  explanation: 'La correcta es: 1 ≤ |k| < 10. Debe ser al menos 1 y menor a 10.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el coeficiente $k$ y la potencia de 10.'
- 'Paso 2: Verificar que el valor absoluto de $k$ sea mayor o igual que 1 y menor
  que 10.'
- 'Paso 3: Confirmar que la potencia sea de base 10 con exponente entero.'
errores_correccion: No aceptes $10 \cdot 10^5$ o $0{,}5 \cdot 10^3$ como notación
  científica. El coeficiente debe estar siempre en el intervalo $[1, 10[$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $1{,}8 \cdot 10^{-4}$ notación científica?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - $1 \le 1{,}8 < 10$ y el exponente es $-4 \in \mathbb{Z}$. Es válida.
errores_frecuentes:
- Permitir coeficientes mayores o iguales a 10 o menores a 1.
afirmaciones_verdaderas:
- $1 \le |k| < 10$ en notación científica.
al_terminar_debes_ponder: Reconocer expresiones correctamente escritas en notación
  científica.
fuente: Texto escolar MINEDUC.
estado: publicado
