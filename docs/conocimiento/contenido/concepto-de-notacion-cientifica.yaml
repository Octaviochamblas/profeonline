semantic_id: MAT.NUM.NOTACION_CIENTIFICA.CONCEPTO
resumen_inicial: La notación científica es una forma estandarizada de escribir números reales muy grandes o muy pequeños mediante el producto $k \cdot 10^n$, donde $1 \le |k| < 10$ y $n \in \mathbb{Z}$.
explicacion_simple: '![Concepto de notación científica](/static/img/nodos/concepto-de-notacion-cientifica-intro.svg)


  La notación científica es una herramienta matemática que nos ahorra escribir largas cadenas de ceros para números astronómicos (como la distancia al Sol) o microscópicos (como el tamaño de una bacteria). Su estructura obligatoria es $k \cdot 10^n$, donde el número de adelante ($k$, llamado mantisa) debe tener **exactamente un dígito entero distinto de cero** (es decir, estar entre $1$ y $10$, sin incluir el $10$), y $10^n$ es la potencia de diez que indica el tamaño.'
explicacion_formal: "Sea $x \\in \\mathbb{R} \\setminus \\{0\\}$. La **Representación en Notación Científica Normalizada** de $x$ es la expresión unívoca de la forma:\n\n$$x = k \\cdot 10^n$$\n\n**Condiciones analíticas rigurosas:**\n1. **Mantisa o Coeficiente ($k$):** Debe satisfacer estrictamente la desigualdad:\n   $$1 \\le |k| < 10 \\quad (k \\in \\mathbb{R})$$\n2. **Orden de Magnitud ($n$):** Debe ser un número entero ($n \\in \\mathbb{Z}$):\n   - Si $n > 0$: El número representa una cantidad grande ($|x| \\ge 10$).\n   - Si $n < 0$: El número representa una cantidad pequeña ($0 < |x| < 1$).\n   - Si $n = 0$: El número original ya satisface $1 \\le |x| < 10$.\n\n> **Criterio de normalización:** Expresiones como $35 \\cdot 10^4$ o $0,8 \\cdot 10^{-3}$ son productos por potencias de diez pero **NO están en notación científica**, pues sus coeficientes incumplen $1 \\le |k| < 10$."
definiciones_clave: '- **Notación científica**: Representación estandarizada $k \cdot 10^n$.

  - **Mantisa ($k$)**: Coeficiente decimal normalizado en el intervalo semiabierto $[1, 10)$.

  - **Orden de magnitud ($10^n$)**: Potencia entera de base diez que determina la escala numérica.'
propiedades_relaciones: '- **Unicidad**: Para cada número real no nulo $x$, existe un único par $(k, n)$ tal que $x = k \cdot 10^n$.

  - **Ajuste de equilibrio**: Multiplicar $k$ por $10$ exige restar $1$ a $n$; dividir $k$ por $10$ exige sumar $1$ a $n$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de concepto de notación científica](/static/img/nodos/concepto-de-notacion-cientifica-ejemplos.svg)


    Determine si las expresiones $5,8 \cdot 10^4$, $42 \cdot 10^3$ y $0,07 \cdot 10^5$ están en notación científica normalizada y, en caso negativo, normalícelas.'
  pasos:
  - 'Paso 1: Analizar $5,8 \cdot 10^4$: El coeficiente es $k = 5,8$. Como $1 \le 5,8 < 10$, está correctamente normalizado.'
  - 'Paso 2: Analizar $42 \cdot 10^3$: El coeficiente $42 \ge 10$ no cumple la condición. Se reescribe $42 = 4,2 \cdot 10^1$, por lo que $4,2 \cdot 10^1 \cdot 10^3 = 4,2 \cdot 10^4$.'
  - 'Paso 3: Analizar $0,07 \cdot 10^5$: El coeficiente $0,07 < 1$ no cumple la condición. Se reescribe $0,07 = 7 \cdot 10^{-2}$, por lo que $7 \cdot 10^{-2} \cdot 10^5 = 7 \cdot 10^3$.'
  - 'Conclusión: Las expresiones normalizadas son $5,8 \cdot 10^4$, $4,2 \cdot 10^4$ y $7 \cdot 10^3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes expresiones está correctamente escrita en notación científica?
  choices:
  - text: $3,45 \cdot 10^6$ (porque $1 \le 3,45 < 10$)
    is_correct: true
  - text: $34,5 \cdot 10^5$
    is_correct: false
  - text: $0,345 \cdot 10^7$
    is_correct: false
  - text: $3,45 \cdot 5^6$
    is_correct: false
  explanation: La alternativa correcta es '$3,45 \cdot 10^6$ (porque $1 \le 3,45 < 10$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se normalizó $42 \cdot 10^3$?
  choices:
  - text: Moviendo la coma un lugar a la izquierda ($4,2$) y sumando $1$ al exponente ($10^4$)
    is_correct: true
  - text: Restando $1$ al exponente
    is_correct: false
  - text: Multiplicando $42$ por $10$
    is_correct: false
  - text: Dejando el exponente igual
    is_correct: false
  explanation: La alternativa correcta es 'Moviendo la coma un lugar a la izquierda ($4,2$) y sumando $1$ al exponente ($10^4$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el coeficiente $k$ y verificar si pertenece al intervalo $[1, 10)$.'
- 'Paso 2: Si $k \ge 10$, mover la coma a la izquierda y sumar al exponente la cantidad de posiciones desplazadas.'
- 'Paso 3: Si $k < 1$, mover la coma a la derecha y restar al exponente la cantidad de posiciones desplazadas.'
errores_correccion: '- **Error 1: Aceptar coeficientes mayores o iguales a 10 ($12 \cdot 10^4$).** **Cómo corregirlo:** La notación científica exige $1 \le k < 10$. Escribir $1,2 \cdot 10^5$.

  - **Error 2: Aceptar coeficientes menores a 1 ($0,5 \cdot 10^{-3}$).** **Cómo corregirlo:** Debe tener un dígito entero no nulo: $5 \cdot 10^{-4}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma en notación científica de $250 \cdot 10^3$?
  alternativas:
  - $2,5 \cdot 10^5$
  - $25 \cdot 10^4$
  - $2,5 \cdot 10^3$
  respuesta: $2,5 \cdot 10^5$
  solucion_pasos:
  - $250 = 2,5 \cdot 10^2 \implies 2,5 \cdot 10^2 \cdot 10^3 = 2,5 \cdot 10^5$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor del exponente $n$ en la notación científica de $0,004$?
  alternativas:
  - $-3$
  - $3$
  - $-4$
  respuesta: $-3$
  solucion_pasos:
  - $0,004 = 4 \cdot 10^{-3} \implies n = -3$.
- titulo: ¿Está 1,0 · 10⁰ en notación científica?
  respuesta: Sí
  solucion_pasos:
  - Sí, $k = 1,0 \in [1, 10)$ y $n = 0 \in \mathbb{Z}$ (representa el número 1).
  alternativas:
  - texto: Sí, cumple 1 ≤ k < 10 y exponente entero
    es_correcta: true
    retroalimentacion: ¡Correcto! El número 1 es el límite inferior permitido para la mantisa.
  - texto: No, el exponente no puede ser cero
    es_correcta: false
    retroalimentacion: Incorrecto, cero es un entero válido ($10^0 = 1$).
  - texto: No, la mantisa debe ser mayor a 1 estricto
    es_correcta: false
    retroalimentacion: Incorrecto, la mantisa puede ser igual a 1.
- titulo: ¿Es 10 · 10³ notación científica válida?
  respuesta: 'No'
  solucion_pasos:
  - No, $k = 10$ no cumple $k < 10$. Debe escribirse $1 \cdot 10^4$.
  alternativas:
  - texto: No, la mantisa debe ser estrictamente menor que 10 (debe ser 1 · 10⁴)
    es_correcta: true
    retroalimentacion: ¡Correcto! $k = 10$ viola la cota superior estricta $k < 10$.
  - texto: Sí, porque 10 es entero
    es_correcta: false
    retroalimentacion: Incorrecto, la mantisa debe tener solo una cifra entera.
  - texto: Sí, es igual a 10.000
    es_correcta: false
    retroalimentacion: Incorrecto, el valor numérico es correcto pero la forma no está normalizada.
errores_frecuentes:
- Dejar mantisas mayores o iguales a 10 sin normalizar ($15 \cdot 10^3$).
- Dejar mantisas decimales menores a 1 ($0,4 \cdot 10^6$).
- Usar bases distintas de diez (como $3 \cdot 5^4$).
- Confundir exponente negativo con número negativo.
- Olvidar que $10^0 = 1$ al normalizar números entre 1 y 10.
afirmaciones_verdaderas:
- La mantisa $k$ debe pertenecer obligatoriamente al intervalo $[1, 10)$.
- El exponente $n$ es un número entero que define el orden de magnitud.
- Un número negativo en notación científica conserva su signo menos en la mantisa ($-k \cdot 10^n$).
al_terminar_debes_poder: '![Síntesis de concepto de notación científica](/static/img/nodos/concepto-de-notacion-cientifica-resumen.svg)


  QUÉ: Identificar, validar y normalizar expresiones en notación científica.


  CÓMO: Verificando la condición de mantisa $1 \le |k| < 10$ y exponente entero $n \in \mathbb{Z}$ en la estructura $k \cdot 10^n$, y aplicando traslaciones de coma con compensación en el exponente cuando la expresión no se encuentre normalizada.'
