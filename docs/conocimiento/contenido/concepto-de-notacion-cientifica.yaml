semantic_id: MAT.NUM.NOTACION_CIENTIFICA.CONCEPTO
resumen_inicial: La notación científica es una representación estándar del tipo $k
  \cdot 10^n$, donde $1 \le |k| < 10$ y $n \in \mathbb{Z}$, utilizada para expresar
  números extremadamente grandes o muy pequeños de manera compacta.
explicacion_simple: La notación científica es una herramienta matemática que nos evita
  escribir números con muchísimos ceros hacia la derecha o hacia la izquierda. Expresa
  cualquier cantidad multiplicando un número decimal $k$ (que debe estar obligatoriamente
  entre 1 y 9) por una potencia de diez que indica cuántas posiciones se movió la
  coma.
explicacion_formal: 'Sea $x \in \mathbb{R} \setminus \{0\}$, la **Notación Científica
  Estándar** expresa $x$ en el formato único:


  $$x = k \cdot 10^n$$


  **Desglose de condiciones:**

  - $k \in \mathbb{R}$: Coeficiente o mantisa que satisface la acotación estricta
  $1 \le |k| < 10$.

  - $n \in \mathbb{Z}$: Exponente entero (orden de magnitud de la potencia de diez).

  - Si $n > 0$, el número original es grande ($|x| \ge 10$). Si $n < 0$, el número
  original es pequeño ($0 < |x| < 1$).


  > **Complemento didáctico:** Expresiones como $12,5 \cdot 10^4$ o $0,8 \cdot 10^{-3}$
  NO están en notación científica porque sus coeficientes $k$ no cumplen $1 \le |k|
  < 10$.'
definiciones_clave: '- **Notación Científica**: Formato $k \cdot 10^n$ con coeficiente
  $1 \le |k| < 10$ y exponente entero $n \in \mathbb{Z}$.'
propiedades_relaciones: '- **Acotación de la mantisa**: $1 \le |k| < 10$, exige exactamente
  una sola cifra entera no nula a la izquierda de la coma decimal.'
ejemplo_guiado:
  enunciado: Verifique si las expresiones $4,5 \cdot 10^6$, $35 \cdot 10^2$ y $0,2
    \cdot 10^{-4}$ se encuentran en notación científica estándar.
  pasos:
  - 'Paso 1: Analizar $4,5 \cdot 10^6$: el coeficiente $k = 4,5$ cumple $1 \le 4,5
    < 10$. SÍ es notación científica.'
  - 'Paso 2: Analizar $35 \cdot 10^2$: el coeficiente $k = 35 \ge 10$. NO está en
    notación científica.'
  - 'Paso 3: Analizar $0,2 \cdot 10^{-4}$: el coeficiente $k = 0,2 < 1$. NO está en
    notación científica.'
  - 'Conclusión: Solo $4,5 \cdot 10^6$ está expresado en notación científica válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición estricta debe cumplir el coeficiente k en la notación científica
    k · 10^n?
  choices:
  - text: Debe cumplir 1 <= |k| < 10 (tener exactamente una cifra entera no nula)
    is_correct: true
  - text: Debe ser mayor o igual a 10
    is_correct: false
  - text: Debe ser menor a 1 siempre
    is_correct: false
  - text: Debe ser un entero negativo
    is_correct: false
  explanation: La alternativa correcta es 'Debe cumplir 1 <= |k| < 10 (tener exactamente
    una cifra entera no nula)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 35 · 10^2 no es una notación científica
    estándar?
  choices:
  - text: Porque el coeficiente 35 es mayor o igual a 10
    is_correct: true
  - text: Porque el exponente 2 es par
    is_correct: false
  - text: Because es negativo
    is_correct: false
  - text: Sí es notación científica
    is_correct: false
  explanation: La alternativa correcta es 'Porque el coeficiente 35 es mayor o igual
    a 10'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar la coma decimal para dejar una sola cifra diferente de cero en la
  parte entera ($1 \le |k| < 10$).'
- 'Paso 2: Contar las posiciones que se desplazó la coma decimal para fijar el exponente
  $n$.'
- 'Paso 3: Escribir la expresión final en la forma $k \cdot 10^n$ con $n \in \mathbb{Z}$.'
errores_correccion: '- **Error 1: Dejar dos o más cifras enteras antes de la coma
  (escribir $15 \cdot 10^3$).** **Cómo corregirlo:** Se debe ajustar la coma para
  que quede una sola cifra entera: $1,5 \cdot 10^4$.


  - **Error 2: Dejar cero en la parte entera (escribir $0,5 \cdot 10^3$).** **Cómo
  corregirlo:** La cifra entera debe ser no nula (entre 1 y 9): $5 \cdot 10^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $8,12 \cdot 10^{-5}$ una notación científica válida?
  alternativas:
  - Sí, 1 <= 8,12 < 10 y el exponente es entero
  - No, por el exponente negativo
  - No, debe ser 81,2
  respuesta: Sí, 1 <= 8,12 < 10 y el exponente es entero
  solucion_pasos:
  - $1 \le 8,12 < 10 \implies$ notación científica válida.
- titulo: Ejemplo 2
  enunciado: Convertir $250 \cdot 10^3$ a notación científica estándar.
  alternativas:
  - 2,5 · 10^5
  - 25 · 10^4
  - 0,25 · 10^6
  respuesta: 2,5 · 10^5
  solucion_pasos:
  - $250 \cdot 10^3 = (2,5 \cdot 10^2) \cdot 10^3 = 2,5 \cdot 10^5$.
- titulo: ¿Es 1 · 10^0 una expresión válida en notación científica?
  respuesta: Sí
  solucion_pasos:
  - Sí, $k=1$ cumple $1 \le 1 < 10$ y $n=0 \in \mathbb{Z}$.
- titulo: ¿Permite la notación científica exponentes negativos?
  respuesta: Sí
  solucion_pasos:
  - Sí, para representar números muy pequeños ($0 < |x| < 1$).
errores_frecuentes:
- La expresión $15,4 \cdot 10^3$ se encuentra escrita en notación científica estándar.
- El coeficiente de la notación científica admite el número cero como su única cifra
  entera.
- Utilizar exponentes negativos en notación científica convierte el número en un entero
  negativo.
- La notación científica $0,04 \cdot 10^5$ cumple con la acotación estándar de la
  mantisa.
- El exponente de la potencia de diez en notación científica debe ser siempre un número
  entero par.
afirmaciones_verdaderas:
- La notación científica expresa un número como $k \cdot 10^n$ con $1 \le |k| < 10$
  y $n \in \mathbb{Z}$.
- El exponente $n$ indica el número de posiciones que se desplazó la coma decimal
  en la conversión.
al_terminar_debes_poder: Al terminar serás capaz de reconocer y estructurar números
  en notación científica $k \cdot 10^n$, verificando la acotación $1 \le |k| < 10$
  de la mantisa.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
