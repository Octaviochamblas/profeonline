semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: El reconocimiento de situaciones que pueden modelarse mediante funciones potencia $y = k \cdot x^n$ identifica fenómenos físicos, biológicos y geométricos regidos por leyes de escala dimensional, proporcionalidad directa a potencias o atenuación inversa al cuadrado.
explicacion_simple: "![El reconocimiento de situaciones que pueden modelarse mediante funciones potencia $y = k \\cdot x^n$ identifica fenómenos físicos, biológicos y geométricos regidos por leyes de escala dimensional, proporcionalidad directa a potencias o atenuación inversa al cuadrado](/static/img/nodos/reconocimiento-de-situaciones-que-pueden-modelarse-mediante-funciones-potencia-intro.svg)\n\n\nUna **función potencia $y = k \\cdot x^n$** es el modelo perfecto cuando dos cantidades se relacionan mediante una ley geométrica o física de escala:\n\n- **¿Cómo reconocerla en la vida real?**\n  - **Áreas y superficies:** Escalan al cuadrado ($n = 2$), como el área de un círculo $A = \\pi r^2$ o la energía cinética $E_k = \\frac{1}{2}m v^2$.\n  - **Volúmenes y masa:** Escalan al cubo ($n = 3$), como la capacidad de un estanque $V = \\frac{4}{3}\\pi r^3$ o la potencia de un molino de viento $P = k v^3$.\n  - **Atenuación y gravedad:** Escalan con potencias negativas ($n = -1, -2$), como la\
  \ intensidad de la luz $I = \\frac{k}{d^2}$ o la ley de Boyle $P = \\frac{k}{V}$.\n- **Diferencia clave con la exponencial:** En la función potencia, **la variable $x$ es la base** ($x^3$), mientras que en la exponencial la variable está en el exponente ($3^x$)."
explicacion_formal: 'Un fenómeno físico o empírico descrito por dos variables $x, y \in \mathbb{R}^+$ admite una modelación analítica mediante una ley de potencia $y = f(x) = k \cdot x^n$ ($k \in \mathbb{R}^+, n \in \mathbb{R}^*$) si y solo si la elasticidad de escala es constante:

  $$E_{y, x} = \frac{d(\ln y)}{d(\ln x)} = \frac{x}{y} \cdot \frac{dy}{dx} = n = \text{constante}$$


  **Transformación log-lineal**:

  Aplicando logaritmo natural a ambos miembros:

  $$\ln(y) = \ln(k) + n \cdot \ln(x)$$

  En un gráfico con ejes logarítmicos $(\ln x, \ln y)$, los datos experimentales se alinean exactamente sobre una línea recta con pendiente $n$ e intercepto $\ln(k)$.'
definiciones_clave: '- **Ley de potencia / Escalamiento alométrico**: Relación funcional no lineal $y = kx^n$ donde las tasas porcentuales de cambio son constantes.

  - **Elasticidad de escala**: Invariante $n$ que define la sensibilidad de respuesta de $y$ ante variaciones en $x$.'
propiedades_relaciones: '- **Homogeneidad de grado $n$**: $f(c \cdot x) = c^n \cdot f(x)$ para cualquier factor escalar $c > 0$.

  - **No linealidad intrínseca**: Si $n \neq 1$, la razón de cambio promedio $\Delta y / \Delta x$ depende del punto de operación.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento de situaciones que pueden modelarse mediante funciones potencia $y = k \cdot x^n$ identifica fenómenos físicos, biológicos y geométricos regidos por leyes de escala dimensional, proporcionalidad directa a potencias o atenuación inversa al cuadrado](/static/img/nodos/reconocimiento-de-situaciones-que-pueden-modelarse-mediante-funciones-potencia-ejemplos.svg)



    Determina si las siguientes situaciones corresponden a modelos de función potencia e identifica sus parámetros $(k, n)$:

    1) La distancia de frenado de un automóvil es proporcional al cuadrado de su velocidad: $d(v) = 0{,}05 v^2$.

    2) La intensidad de radiación solar recibida decrece con el cuadrado de la distancia a la fuente: $I(d) = \frac{1.000}{d^2}$.'
  pasos:
  - 'Paso 1: Para $d(v) = 0{,}05 v^2$: La variable $v$ es la base elevada al exponente constante $2$. Es una **función potencia con $k = 0{,}05$ y $n = 2$**.'
  - 'Paso 2: Para $I(d) = \frac{1.000}{d^2} = 1.000 d^{-2}$: La variable $d$ es la base elevada a la potencia negativa $-2$. Es una **función potencia con $k = 1.000$ y $n = -2$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes relaciones corresponde estrictamente a un modelo de función potencia?
  choices:
  - text: E_k(v) = 0,5 · m · v² (energía cinética respecto a la velocidad)
    is_correct: true
  - text: P(t) = 500 · 2ᵗ (crecimiento de bacterias respecto al tiempo)
    is_correct: false
  - text: C(x) = 300x + 1.500 (costo total respecto a unidades)
    is_correct: false
  - text: y = 4 · log(x)
    is_correct: false
  explanation: La alternativa correcta es 'E_k(v) = 0,5 · m · v² (energía cinética respecto a la velocidad)'. La variable independiente $v$ se encuentra en la base elevada al exponente constante 2.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el modelo $y = 8x^{-3}$, ¿cuáles son el coeficiente k y el exponente n?
  choices:
  - text: k = 8, n = -3
    is_correct: true
  - text: k = -3, n = 8
    is_correct: false
  - text: k = 8, n = 3
    is_correct: false
  - text: k = 1/8, n = -3
    is_correct: false
  explanation: La alternativa correcta es 'k = 8, n = -3'. En $y = kx^n$, el coeficiente que multiplica es 8 y la potencia de $x$ es $-3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables independiente ($x$) y dependiente ($y$) del contexto.'
- 'Paso 2: Comprobar que la variable $x$ actúe como base elevada a una constante $n$.'
- 'Paso 3: Extraer la constante de proporcionalidad $k$ a partir de las condiciones iniciales o físicas.'
- 'Paso 4: Escribir la fórmula del modelo en la forma estándar $y = k \cdot x^n$ y definir su dominio contextual.'
errores_correccion: '- **Error común:** Confundir una función potencia ($x^3$) con una función exponencial ($3^x$).

  - **Cómo corregirlo:** En la función potencia **la $x$ está ABAJO (en la base)** y el número arriba ($x^n$); en la exponencial la $x$ está **ARRIBA (en el exponente)** ($a^x$).'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de exponente'
  enunciado: 'El periodo orbital de Kepler satisface $T(R) = c \cdot R^{3/2}$. Es una función potencia con:'
  alternativas:
  - k = c, n = 3/2
  - k = 3/2, n = c
  - Función exponencial
  - Función lineal
  respuesta: k = c, n = 3/2
  solucion_pasos:
  - 'Paso 1: La base es $R$ y el exponente es $n = 3/2$.'
- titulo: 'Ejemplo 2: Modelo de masa biológica'
  enunciado: 'La tasa metabólica basal $B$ de un mamífero según su masa $M$ sigue la ley de Kleiber $B(M) = 70 M^{0{,}75}$. Su exponente es:'
  alternativas:
  - 0,75
  - '70'
  - '1'
  - 1,5
  respuesta: 0,75
  solucion_pasos:
  - 'Paso 1: $n = 0{,}75 = 3/4$.'
- titulo: 'Ejemplo 3: Modelo de área superficial'
  enunciado: ¿Qué tipo de función modela el área de un cubo respecto a su arista $a$ ($A = 6a^2$)?
  alternativas:
  - Función potencia cuadrática (k = 6, n = 2)
  - Función lineal
  - Función afín
  - Función exponencial
  respuesta: Función potencia cuadrática (k = 6, n = 2)
  solucion_pasos:
  - 'Paso 1: $A(a) = 6a^2 \implies k = 6, n = 2$.'
- titulo: 'Ejemplo 4: Gravedad planetaria'
  enunciado: 'La aceleración de gravedad a distancia $r$ del centro terrestre es $g(r) = \frac{G M}{r^2}$. Como potencia se escribe:'
  alternativas:
  - g(r) = GM · r^(-2)
  - g(r) = GM · r²
  - g(r) = 2 · r^(GM)
  - g(r) = GM · 2^(-r)
  respuesta: g(r) = GM · r^(-2)
  solucion_pasos:
  - 'Paso 1: $\frac{GM}{r^2} = GM \cdot r^{-2}$.'
errores_frecuentes:
- Confundir modelos de potencia con modelos exponenciales.
- Asumir proporcionalidad lineal en fenómenos de aceleración o energía.
- No verificar si el exponente es positivo o negativo según si el fenómeno amplifica o atenúa.
afirmaciones_verdaderas:
- Un modelo de función potencia adopta la forma algebraica y = k · xⁿ con k ≠ 0 y n constante.
- En escala log-log, los datos de un modelo de potencia se alinean en una recta con pendiente n.
al_terminar_debes_poder: '**QUÉ:** Reconocer y formular situaciones del mundo real modelables mediante funciones potencia.


  **CÓMO:** Identificando la variable independiente en la base y extrayendo los parámetros k y n según la ley física o geométrica.


