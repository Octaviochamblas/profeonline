  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la cifra dentro de las barras.'
- 'Paso 2: Si la cifra es positiva o cero, conservar el número igual.'
- 'Paso 3: Si la cifra es negativa, eliminar el signo menos obteniendo su equivalente positivo.'
errores_correccion: '- **Error 1: Creer que $-x$ en la definición de valor absoluto significa un resultado negativo.** **Cómo corregirlo:** Si $x = -5$, $-x = -(-5) = +5$ (positivo).


  - **Error 2: Pensar que el valor absoluto de un número puede dar un resultado negativo.** **Cómo corregirlo:** Las distancias son estrictamente no negativas ($|x| \ge 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $|15| + |-15|$.
  alternativas:
  - '30'
  - '0'
  - '-30'
  respuesta: '30'
  solucion_pasos:
  - $|15| = 15$ y $|-15| = 15$. La suma es $15 + 15 = 30$.
- titulo: Ejemplo 2
  enunciado: ¿Para qué valor de $x$ se cumple que $|x| = 0$?
  alternativas:
  - x = 0
  - x = 1
  - x = -1
  respuesta: x = 0
  solucion_pasos:
  - El único número a distancia cero del origen es el $0$.
- titulo: ¿Es cierto que |-12| es igual a +12?
  respuesta: Sí
  solucion_pasos:
  - Sí, la distancia de -12 al cero es de 12 unidades.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
- titulo: ¿Puede el valor absoluto de un entero dar como resultado -4?
  respuesta: 'No'
  solucion_pasos:
  - No, el valor absoluto es una distancia y no puede ser negativo.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
errores_frecuentes:
- El valor absoluto de un número entero negativo da como resultado un número negativo.
- El valor absoluto de un número representa la posición a la izquierda o derecha en la recta.
- La expresión $|-8|$ es equivalente al entero $-8$.
- El valor absoluto del número cero es indeterminado porque no tiene distancia.
- La función valor absoluto se puede evaluar obteniendo resultados menores que cero.
afirmaciones_verdaderas:
- El valor absoluto representa la distancia métrica de un número al cero.
- Para todo número entero $x$, se cumple que $|x| \ge 0$.
al_terminar_debes_ponder: Al terminar serás capaz de calcular el valor absoluto de cualquier número entero, interpretándolo como su distancia geométrica al cero y garantizando un resultado no negativo ($|x| \ge 0$).
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
al_terminar_debes_poder: '**QUÉ:** Comprender y calcular el valor absoluto $|x|$ como distancia euclídea al origen.


  **CÓMO:** Midiendo la separación no negativa entre el punto $x$ y el $0$ en la recta numérica, garantizando $|x| \ge 0$.


  ![Resumen Concepto de valor absoluto como distancia al origen](/static/img/nodos/concepto-de-valor-absoluto-como-distancia-al-origen-resumen.svg)'
