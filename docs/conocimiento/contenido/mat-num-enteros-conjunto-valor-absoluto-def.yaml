semantic_id: MAT.NUM.ENTEROS_CONJUNTO.VALOR_ABSOLUTO_DEF
resumen_inicial: El valor absoluto $|x|$ mide la distancia de un número al cero y resulta siempre no negativo ($|x| \ge 0$).
explicacion_simple: 'El valor absoluto de un número representa la distancia geométrica que lo separa del cero en la recta numérica. Dado que las distancias se miden siempre como cantidades no negativas, el valor absoluto de cualquier número (sea positivo o negativo) resulta siempre en un valor mayor o igual a cero.


  ![Concepto de valor absoluto como distancia al origen](/static/img/nodos/concepto-de-valor-absoluto-como-distancia-al-origen-intro.svg)'
explicacion_formal: 'Para cualquier entero $x \in \mathbb{Z}$, la **Función Valor Absoluto** $|\cdot|: \mathbb{Z} \to \mathbb{Z}_{\ge 0}$ se define por tramos como la distancia métrica $d(x,0)$:


  $$|x| = \begin{cases} x & \text{si } x \ge 0 \\ -x & \text{si } x < 0 \end{cases} \qquad \text{satisface } |x| \ge 0 \quad \forall x \in \mathbb{Z}$$


  **Desglose de la fórmula:**

  - $|x|$: Notación de barras verticales que denota la distancia geométrica de $x$ al origen $0$.

  - $-x$ para $x < 0$: Operador del opuesto aditivo que transforma el entero negativo $x$ en un número positivo $-x > 0$.

  - $|x| \ge 0$: Propiedad de no negatividad de la métrica de distancia.


  > **Complemento didáctico:** El signo menos en $-x$ para $x < 0$ no hace negativo el resultado; al contrario, convierte la base negativa en una distancia positiva.'
definiciones_clave: '- **Valor absoluto**: Distancia no negativa $|x|$ desde la posición del número $x$ hasta el cero en la recta numérica.

  - **Métrica de distancia**: Medida geométrica que nunca produce valores negativos.'
propiedades_relaciones: '- **No negatividad**: $|x| \ge 0$ para todo $x \in \mathbb{Z}$.

  - **Identidad del cero**: $|x| = 0 \iff x = 0$.'
ejemplo_guiado:
  enunciado: 'Calcule el valor absoluto del entero $-9$ aplicando la definición por tramos.


    ![Ejemplo Concepto de valor absoluto como distancia al origen](/static/img/nodos/concepto-de-valor-absoluto-como-distancia-al-origen-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el signo del número: $-9 < 0$.'
  - 'Paso 2: Aplicar la regla para negativos: $|-9| = -(-9)$.'
  - 'Paso 3: Simplificar los signos: $-(-9) = 9$.'
  - 'Conclusión: La distancia al origen es de 9 unidades ($|-9| = 9$).'
