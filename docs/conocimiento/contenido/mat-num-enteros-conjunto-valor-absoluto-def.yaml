semantic_id: MAT.NUM.ENTEROS_CONJUNTO.VALOR_ABSOLUTO_DEF
resumen_inicial: "El valor absoluto mide la distancia de un número al cero, sin importar el lado. Por eso el resultado nunca puede ser negativo."
explicacion_simple: |
  Si caminas 5 pasos a la derecha o 5 pasos a la izquierda desde tu casa, en ambos casos recorriste
  la misma distancia: 5 pasos. Eso es lo que hace el valor absoluto: dice cuántos pasos hay hasta el
  cero, ignorando la dirección. Por eso el resultado nunca puede ser negativo — una distancia nunca
  es negativa.
explicacion_formal: |
  El valor absoluto de un entero $x$ representa la distancia entre $x$ y el origen ($0$) en la recta
  numérica: $|x| \geq 0$ para todo $x$. El número $3$ y el número $-3$ están ambos a tres unidades
  del cero, por lo que $|3| = |-3| = 3$.
definiciones_clave: |
  **Valor absoluto** $|x|$: distancia de $x$ al origen, siempre no negativa. **Magnitud**: el tamaño
  de un número sin considerar su signo.
propiedades_relaciones: |
  $|x| \geq 0$ para todo entero $x$, y $|x| = 0$ únicamente cuando $x = 0$. El valor absoluto es
  fundamental para medir desviaciones y longitudes independientemente de la dirección.
ejemplo_guiado:
  enunciado: "Un submarino está a 40 metros bajo el nivel del mar. ¿Cuál es el valor absoluto de su posición?"
  pasos:
    - "La posición del submarino se representa como $-40$."
    - "Se busca la distancia al nivel del mar (referencia $0$)."
    - "La distancia recorrida es de 40 metros."
    - "Conclusión: el valor absoluto es $|-40| = 40$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de las siguientes afirmaciones sobre $|x|$ es correcta para todo entero $x$?"
    choices:
      - {text: "$|x|$ puede ser negativo", is_correct: false}
      - {text: "$|x| \\geq 0$ siempre", is_correct: true}
      - {text: "$|x| = x$ siempre", is_correct: false}
      - {text: "$|x|$ no está definido si $x$ es negativo", is_correct: false}
    explanation: "La correcta es $|x| \\geq 0$ siempre, porque el valor absoluto mide una distancia y las distancias no son negativas."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, ¿cuál es el valor absoluto de la posición de un dron que vuela a 25 metros de altura (sobre el nivel del suelo, referencia 0)?"
    choices:
      - {text: "$-25$", is_correct: false}
      - {text: "$25$", is_correct: true}
      - {text: "$0$", is_correct: false}
      - {text: "No se puede calcular", is_correct: false}
    explanation: "La correcta es $25$, porque la posición es $+25$ y su distancia al origen es $|25| = 25$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el número entero sobre la recta numérica."
  - "Paso 2: Contar cuántas unidades de separación existen entre el cero y el número, sin importar el sentido (derecha o izquierda)."
  - "Paso 3: Expresar esa cantidad como un número positivo o cero."
errores_correccion: |
  Un error frecuente es pensar que el valor absoluto de un número negativo es otro número negativo:
  el valor absoluto siempre "quita" el signo, dando un resultado positivo o cero. Otro error es
  creer que $|0|$ no existe porque el cero no es positivo; $|0| = 0$, que sí es un valor absoluto
  válido (el único caso no estrictamente positivo).

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál es el valor absoluto de $-7$?"
    alternativas:
      - "$7$"
      - "$-7$"
      - "$0$"
    respuesta: "$7$"
    solucion_pasos:
      - "Se ubica el $-7$ en la recta numérica."
      - "Se cuenta la distancia desde el $0$ hasta el $-7$: 7 unidades."
      - "Resultado: $|-7| = 7$."
  - titulo: "Ejemplo 2"
    enunciado: "Si un pez está a 12 metros de profundidad, ¿cuál es el valor absoluto de su posición respecto al nivel del mar?"
    alternativas:
      - "$12$"
      - "$-12$"
      - "$0$"
    respuesta: "$12$"
    solucion_pasos:
      - "La posición del pez se representa como $-12$."
      - "Se busca la distancia al nivel del mar (referencia 0)."
      - "La distancia recorrida es 12 metros."
      - "Conclusión: El valor absoluto es $|-12| = 12$."
  - titulo: "¿El valor absoluto de cualquier número entero es siempre mayor o igual a cero?"
    respuesta: "Sí"
    solucion_pasos:
      - "El valor absoluto mide una distancia, y las distancias no pueden ser negativas."
      - 'Para cualquier entero $x$, se cumple $|x| \geq 0$.'
      - "El único caso en que vale cero es cuando $x = 0$."
  - titulo: "¿Puede el valor absoluto de un número entero ser negativo?"
    respuesta: "No"
    solucion_pasos:
      - "El valor absoluto representa una distancia al origen, que es siempre no negativa."
      - "La definición establece: si $x < 0$, entonces $|x| = -x$, que es positivo."
      - "Por lo tanto, el resultado de un valor absoluto nunca puede ser negativo."
errores_frecuentes:
  - "El valor absoluto de un número negativo es otro número negativo."
  - "El valor absoluto cambia el signo del número siempre, incluso si era positivo."
  - "El valor absoluto de $0$ no existe porque no es positivo."
  - "$|-5|$ es igual a $-5$ porque el número dentro es negativo."
  - "El valor absoluto de un número mide cuánto vale el número, no su distancia al cero."
afirmaciones_verdaderas:
  - "El valor absoluto de un número nunca es negativo."
  - "El valor absoluto de -7 es 7."
al_terminar_debes_poder: |
  Calcular el valor absoluto de cualquier entero interpretándolo como distancia al origen, y
  explicar por qué el resultado nunca es negativo.

fuente: "Manual Esencial Santillana p.49"
estado: publicado
