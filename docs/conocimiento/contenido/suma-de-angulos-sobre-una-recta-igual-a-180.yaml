semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUMA_RECTA
resumen_inicial: La suma de las medidas de todos los ángulos contiguos formados a
  un mismo lado de una línea recta es exactamente 180° (π rad).
explicacion_simple: '![Suma de Ángulos sobre una Recta](/static/img/nodos/suma-de-angulos-sobre-una-recta-igual-a-180-intro.svg)


  Si tienes una línea recta horizontal y trazas varios rayos desde un mismo punto
  hacia arriba, el espacio se divide en varias partes. Al sumar todas esas aberturas,
  el total siempre será exactamente 180°, equivalente a un ángulo llano.'
explicacion_formal: '### Definición formal

  Si $n$ ángulos consecutivos $\alpha_1, \alpha_2, \dots, \alpha_n$ están dispuestos
  sobre una misma recta soporte en un mismo semiplano y comparten un vértice común
  $O$, la suma de sus medidas angulares es igual a $180^\circ$:


  $$\sum_{i=1}^n \alpha_i = \alpha_1 + \alpha_2 + \dots + \alpha_n = 180^\circ$$


  ### Desglose simbólico y geométrico

  - $n \ge 2$: Cantidad finita de ángulos adyacentes o consecutivos.

  - Vértice común $O$: Punto sobre la recta directriz donde concurren todos los rayos
  divisores.

  - Partición del semiplano: La suma de las partes conforma la totalidad del ángulo
  extendido.


  ### Síntesis didáctica

  Este teorema constituye el postulado de adición de ángulos sobre una recta y permite
  plantear ecuaciones lineales directas para despejar incógnitas angulares sobre rectas
  continuas.'
definiciones_clave: '- **Ángulos sobre una recta**: Conjunto de ángulos contiguos
  apoyados sobre una línea recta que suman $180^\circ$.

  - **Vértice colineal**: Punto de origen común ubicado sobre la línea recta. '
propiedades_relaciones: '- **Generalización de par lineal**: Es la extensión directa
  del par lineal para $n \ge 2$ ángulos.

  - **Cálculo de incógnitas**: Permite formular y resolver ecuaciones algebraicas
  de primer grado. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Suma sobre una Recta](/static/img/nodos/suma-de-angulos-sobre-una-recta-igual-a-180-ejemplos.svg)


    Sobre una recta se forman tres ángulos contiguos que miden $2x$, $3x$ y $4x$.
    Calcula el valor de $x$ y la medida del ángulo mayor.'
  pasos:
  - 'Paso 1: Plantear la ecuación de la suma sobre una recta: $2x + 3x + 4x = 180^\circ$.'
  - 'Paso 2: Reducir términos semejantes: $9x = 180^\circ$.'
  - 'Paso 3: Despejar $x = \frac{180^\circ}{9} = 20^\circ$.'
  - 'Paso 4: Calcular la medida del ángulo mayor ($4x$): $4(20^\circ) = 80^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto suman todos los ángulos consecutivos a un mismo lado de una recta?
  choices:
  - text: Exactamente 180°
    is_correct: true
  - text: Exactamente 360°
    is_correct: false
  - text: Exactamente 90°
    is_correct: false
  - text: Depende de cuántos ángulos sean
    is_correct: false
  explanation: La suma sobre una recta siempre totaliza exactamente 180°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si tres ángulos consecutivos sobre una recta miden x, 2x y 3x, ¿cuánto
    vale x?
  choices:
  - text: x = 30° (porque 6x = 180°)
    is_correct: true
  - text: x = 20°
    is_correct: false
  - text: x = 45°
    is_correct: false
  - text: x = 60°
    is_correct: false
  explanation: Al sumar x + 2x + 3x = 180°, se obtiene 6x = 180°, por lo que x = 30°
    (porque 6x = 180°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la línea recta base y el vértice común $O$.'
- 'Paso 2: Formular la ecuación igualando la suma de todos los ángulos a $180^\circ$.'
- 'Paso 3: Reducir términos semejantes y despejar la incógnita.'
- 'Paso 4: Comprobar la solución sustituyendo el valor en cada ángulo.'
errores_correccion: Asegúrate de sumar solo los ángulos situados a un mismo lado de
  la recta para igualar a 180°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si cuatro ángulos consecutivos sobre una recta son iguales a $\alpha$,
    ¿cuánto mide $\alpha$?
  alternativas:
  - $45^\circ$
  - $30^\circ$
  - $60^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $4\alpha = 180^\circ \implies \alpha = \frac{180^\circ}{4} = 45^\circ$.
- titulo: Ejemplo 2
  enunciado: Sobre una recta se ubican los ángulos $50^\circ$, $x$ y $60^\circ$. ¿Cuánto
    vale $x$?
  alternativas:
  - $70^\circ$
  - $80^\circ$
  - $60^\circ$
  respuesta: $70^\circ$
  solucion_pasos:
  - $50^\circ + x + 60^\circ = 180^\circ \implies x + 110^\circ = 180^\circ \implies
    x = 70^\circ$.
- titulo: ¿La suma sobre una recta depende del número de ángulos?
  respuesta: 'No'
  solucion_pasos:
  - No, sin importar si son 2, 3 o 10 ángulos, su suma siempre será 180°.
- titulo: ¿La suma de ángulos sobre una recta es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el postulado del ángulo llano siempre suman 180°.
errores_frecuentes:
- Sumar los ángulos de arriba y de abajo de la recta e igualar a $180^\circ$ en vez
  de $360^\circ$.
- Omitir uno de los ángulos intermedios al escribir la ecuación.
- Igualar a $90^\circ$ por confundir con ángulos complementarios.
- Despejar mal al cambiar de signo los términos independientes.
- Asumir que los ángulos son congruentes cuando no tienen la misma variable.
afirmaciones_verdaderas:
- Los ángulos consecutivos a un mismo lado de una recta suman $180^\circ$.
- Esta propiedad permite despejar variables algebraicas en figuras geométricas.
al_terminar_debes_poder: '**QUÉ:** Formular y resolver ecuaciones de ángulos consecutivos
  sobre una línea recta.


  **CÓMO:** Aplicando el principio de conservación angular $\sum \alpha_i = 180^\circ$
  y despejando incógnitas.


  ![Resumen de Suma sobre una Recta](/static/img/nodos/suma-de-angulos-sobre-una-recta-igual-a-180-resumen.svg)'
