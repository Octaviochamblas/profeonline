semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUMA_RECTA
resumen_inicial: 'Comprensión Didáctica y Aplicación Práctica de Suma de ángulos sobre
  una recta igual a 180°: Importancia de su Medida y Relaciones en Geometría Plana.'
explicacion_simple: Al trabajar con suma de ángulos sobre una recta igual a 180°,
  analizamos la relación entre aberturas angulares y cómo se aplican las reglas geométricas
  para encontrar valores desconocidos.
explicacion_formal: En la teoría geométrica de suma de ángulos sobre una recta igual
  a 180°, se aplican teoremas y relaciones algebraicas sobre rectas y vértices para
  estructurar demostraciones e igualdades angulares precisas.
definiciones_clave: '- **Suma de ángulos sobre una recta igual a 180°**: Elemento
  o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en suma de ángulos sobre una recta igual a 180° se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Cuatro ángulos marcados consecutivamente sobre una recta horizontal miden
    $x$, $2x$, $3x$ y $60^\circ$. Sabiendo que juntos forman un ángulo llano ($180^\circ$),
    calcula $x$.
  pasos:
  - 'Paso 1: Sumar las medidas sobre la recta e igualar a $180^\circ$: $x + 2x + 3x
    + 60 = 180$.'
  - 'Paso 2: Agrupar términos: $6x + 60 = 180 \implies 6x = 120$.'
  - 'Paso 3: Despejar $x = \frac{120}{6} = 20^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de suma de ángulos sobre una
    recta igual a 180°?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los ángulos sobre la recta suman $6x + 60^\circ = 180^\circ$, ¿cuánto
    vale x?
  choices:
  - text: 20°
    is_correct: true
  - text: 30°
    is_correct: false
  - text: 15°
    is_correct: false
  - text: 40°
    is_correct: false
  explanation: La alternativa correcta es '20°', ya que $6x = 120 \implies x = 20^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en suma de ángulos sobre una recta igual a
  180°.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en suma de ángulos
  sobre una recta igual a 180° sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 23^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 157°
  - 23°
  - 90°
  respuesta: 157°
  solucion_pasos:
  - Despejando $x = 180 - 23 = 157^\circ$.
- titulo: Ejemplo 2
  enunciado: En suma de ángulos sobre una recta igual a 180°, si dos ángulos son suplementarios
    y uno mide 23°, ¿cuánto mide el otro?
  alternativas:
  - 157°
  - 67°
  - 360°
  respuesta: 157°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 23 = 157^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en suma de ángulos
    sobre una recta igual a 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en suma de ángulos sobre una recta
    igual a 180° es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de suma de ángulos sobre una recta igual a 180°.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
