procedimiento:
- 'Paso 1: Identifica las coordenadas del origen y el extremo del vector.'
- 'Paso 2: Calcula las diferencias de coordenadas entre extremo y origen.'
- 'Paso 3: Aplica la fórmula de distancia (raíz de la suma de los cuadrados de las
  diferencias) para obtener el módulo.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de módulo o magnitud de un vector.
ejemplos:
- titulo: Ejemplo 1
