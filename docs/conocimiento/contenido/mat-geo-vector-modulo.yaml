semantic_id: MAT.GEO.VECTORES_BASE.MODULO
resumen_inicial: 'Concepto de módulo o magnitud de un vector: conceptos, teoremas,
  propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'El módulo de un vector es simplemente ''qué tan largo es'': su
  magnitud, sin considerar hacia dónde apunta.'
explicacion_formal: '![Módulo de un vector](/static/img/geometria/cartesiano-vectores/vector-modulo.svg)


  ### Definición formal


  El módulo de un vector $\vec{v}=\vec{AB}$, denotado $|\vec{v}|$, es la longitud
  del segmento $AB$, calculada mediante la fórmula de distancia: $|\vec{v}|=\sqrt{(x_B-x_A)^2+(y_B-y_A)^2}$.


  ### Desarrollo didáctico


  En la figura, el módulo del vector es la longitud de la flecha completa, independiente
  de su orientación en el plano. Si el vector va de $A(-3,-2)$ a $B(3,3)$, su módulo
  es $|\vec{v}|=\sqrt{6^2+5^2}=\sqrt{61}\approx7,8$.'
definiciones_clave: '- **Concepto de módulo o magnitud de un vector**: Elemento o
