semantic_id: MAT.GEO.TEOREMA_TALES.RECIPROCO_PARALELISMO
resumen_inicial: 'Uso del recíproco del teorema de Tales para justificar paralelismo:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: 'Con el enunciado del recíproco ya comprendido, es momento de
  aplicarlo de forma práctica: dado un conjunto de medidas, determinar si un segmento
  es o no paralelo a un lado del triángulo.'
explicacion_formal: '![Uso del recíproco para justificar paralelismo](/static/img/geometria/congruencia-semejanza/tales-reciproco-paralelismo.svg)


  ### Definición formal


  Dado un triángulo con $D\in AB$ y $E\in AC$, se calcula $\frac{AD}{DB}$ y $\frac{AE}{EC}$
  por separado; si ambos valores coinciden exactamente, se concluye (por el recíproco
  de Tales) que $DE\parallel BC$.


  ### Desarrollo didáctico


  Esta aplicación es común en problemas donde se pide "determinar si" un segmento
  es paralelo a un lado, dado un conjunto de medidas: el procedimiento es sistemático
  y no requiere trazar ni medir ángulos, solo comparar dos razones numéricas.'
definiciones_clave: '- **Uso del recíproco del teorema de Tales para justificar paralelismo**:
  Elemento o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a uso del recíproco del teorema de tales para
  justificar paralelismo.'
ejemplo_guiado:
  enunciado: En la aplicación de uso del recíproco del teorema de tales para justificar
    paralelismo, se establece una razón $k = 3.2$ entre dos figuras homólogas de longitud
    original $L = 30\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de uso del recíproco del teorema de tales para justificar
    paralelismo.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 3.2 \cdot 30$.'
  - Concluir que la medida obtenida en uso del recíproco del teorema de tales para
    justificar paralelismo es $L' = 96.0\text{ cm}$.
