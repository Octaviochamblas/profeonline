semantic_id: MAT.GEO.POLIGONOS_BASE.SUMA_ANGULOS_EXTERIORES
resumen_inicial: 'Teorema de la suma de ángulos exteriores de un polígono convexo
  igual a 360°: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos
  y Cuadriláteros.'
explicacion_simple: 'A diferencia de la suma de ángulos interiores (que depende del
  número de lados), existe una propiedad sorprendente sobre los ángulos exteriores:
  su suma es siempre constante.'
explicacion_formal: '![Suma de ángulos exteriores de un polígono](/static/img/geometria/poligonos-cuadrilateros/poligonos-suma-angulos-exteriores.svg)


  ### Definición formal


  Para cualquier polígono convexo, sin importar el número de lados $n$, la suma de
  sus ángulos exteriores (uno por vértice, tomados en el mismo sentido de recorrido)
  es siempre $360°$.


  ### Desarrollo didáctico


  Esto se puede visualizar imaginando recorrer el perímetro del polígono: en cada
  vértice se gira un ángulo exterior, y al completar la vuelta completa (regresar
  al punto de partida con la misma orientación), se ha girado exactamente 360°, sin
  importar cuántos vértices tenga el polígono.'
definiciones_clave: '- **Teorema de la suma de ángulos exteriores de un polígono convexo
  igual a 360°**: Elemento o propiedad fundamental en el estudio de polígonos y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a teorema de la suma de ángulos exteriores de
  un polígono convexo igual a 360°.'
ejemplo_guiado:
  enunciado: Para analizar teorema de la suma de ángulos exteriores de un polígono
    convexo igual a 360°, considera un ángulo $\alpha = 132^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1183^\circ =
    132^\circ$.
  pasos:
  - Identificar la propiedad de teorema de la suma de ángulos exteriores de un polígono
    convexo igual a 360° referida a $\alpha = 132^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1183 = 132 \implies x = 132 - 1183$.'
  - Concluir que la medida calculada para teorema de la suma de ángulos exteriores
    de un polígono convexo igual a 360° es $x = -1051^\circ$.
