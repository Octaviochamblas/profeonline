procedimiento:
- 'Paso 1: Identifica la medida de la arista del cubo (a).'
- 'Paso 2: Calcula el área de una cara, elevando la arista al cuadrado (a²).'
- 'Paso 3: Multiplica ese resultado por 6 (el número de caras del cubo) para obtener
  el área total.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del área total del cubo.
