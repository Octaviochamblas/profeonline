semantic_id: MAT.GEO.POLIEDROS_PRISMAS.CUBO_AREA
resumen_inicial: 'Cálculo del área total del cubo: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Como todas las caras de un cubo son cuadrados idénticos, basta
  con calcular el área de una cara y multiplicarla por el número total de caras.
explicacion_formal: '![Área total del cubo](/static/img/geometria/espacio-cuerpos/cubo-area.svg)


  ### Definición formal


  El área total de un cubo de arista $a$ es la suma de las áreas de sus 6 caras cuadradas
  congruentes: $A_T=6\times a^2$.


  ### Desarrollo didáctico


  Si un cubo tiene arista $a=5$ cm, el área de una cara es $5^2=25$ cm², y como tiene
  6 caras iguales, el área total es $6\times25=150$ cm².'
definiciones_clave: '- **Cálculo del área total del cubo**: Elemento o propiedad fundamental
  en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del área total del cubo.'
