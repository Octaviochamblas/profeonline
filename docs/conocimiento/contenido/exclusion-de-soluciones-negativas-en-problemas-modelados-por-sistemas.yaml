semantic_id: MAT.ALG.SISTEMAS_2X2.RESTRICCIONES_SIGNO
resumen_inicial: Las magnitudes de conteo, dimensiones físicas o financieras en sistemas de ecuaciones modelados exigen que los valores del par ordenado $(x, y)$ sean no negativos.
explicacion_simple: |
  En problemas aplicados del mundo real modelados por sistemas de ecuaciones $2 \times 2$ (como el conteo de boletos, personas, animales, objetos o distancias), las soluciones no pueden tomar valores negativos.

  Si al resolver algebraicamente el sistema se obtiene una coordenada negativa como $(x, y) = (-5, 15)$, debemos concluir que la situación propuesta es físicamente irrealizable y descartar la solución.

  Bajo ninguna circunstancia se debe cambiar arbitrariamente el signo de una coordenada negativa para intentar acomodarla a la respuesta.
explicacion_formal: |
  ### Definición formal
  Sea el sistema de ecuaciones $S$ que modela un problema del mundo real con dominio admisible $\Omega = \mathbb{R}^+ \times \mathbb{R}^+$. La **condición de positividad del par solución** exige:

  $$(x_0, y_0) \in \operatorname{CS}(S) \quad \text{con } x_0 \ge 0 \quad \land \quad y_0 \ge 0$$

  $$\text{Si } x_0 < 0 \quad \lor \quad y_0 < 0 \implies (x_0, y_0) \notin \Omega \quad (\text{Par incompatible con la realidad del contexto})$$

  ### Síntesis didáctica
  Una solución algebraicamente válida de las ecuaciones puede resultar completamente nula en la práctica si viola las leyes del dominio físico $\Omega$.
definiciones_clave: |
  - **Filtro de positividad bidimensional**: Comprobación $x_0 \ge 0 \land y_0 \ge 0$ exigida a las coordenadas de la solución de un sistema contextualizado.
  - **Incompatibilidad bidimensional**: Condición de un par ordenado donde al menos una de sus coordenadas resulta negativa o fuera del dominio práctico del problema.
propiedades_relaciones: |
  - **Prevalencia del dominio práctico**: Un punto de intersección gráfico $(x_0, y_0)$ en cuadrantes distintos al primero ($II, III, IV$) carece de sentido en problemas de conteo o físicas no negativas.
  - **Inconsistencia de condiciones**: Obtener soluciones negativas en modelos correctos señala que las condiciones del enunciado se contradicen en la práctica.
ejemplo_guiado:
  enunciado: 'Un comerciante plantea el sistema $\begin{cases} x + y = 10 \\ 2x + 2y = 30 \end{cases}$ para hallar la cantidad de boletos tipo A ($x$) y tipo B ($y$). Analiza la solución del sistema y concluye sobre su validez real.'
  pasos:
    - 'Paso 1: Multiplicar la primera ecuación por $2$: $2x + 2y = 20$.'
    - 'Paso 2: Comparar con la segunda ecuación del sistema: $2x + 2y = 30$.'
    - 'Paso 3: Notar que al restar miembro a miembro se obtiene $0 = -10$, una contradicción matemática que indica que el sistema es **inconsistente** (líneas paralelas).'
    - 'Paso 4: Concluir que no existen cantidades de boletos que cumplan las condiciones dadas, descartando cualquier asignación física.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si al resolver un sistema sobre ventas de boletos se obtiene $(x, y) = (-5, 15)$, ¿cuál es la decisión correcta?'
    choices:
      - {text: 'Descartar la solución por ser $-5$ una cantidad negativa incompatible con el conteo de boletos.', is_correct: true}
      - {text: 'Transformar arbitrariamente $-5$ a $+5$ y aceptar el par $(5, 15)$.', is_correct: false}
      - {text: 'Reportar que se vendieron $-5$ boletos tipo A.', is_correct: false}
      - {text: 'Sumar las coordenadas para obtener $10$ boletos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Descartar la solución por ser $-5$ una cantidad negativa incompatible con el conteo de boletos.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al restar las ecuaciones $2x + 2y = 20$ y $2x + 2y = 30$, ¿qué resultado confirma la inexistencia de solución?'
    choices:
      - {text: '$0 = -10$ (contradicción que demuestra que el sistema no tiene solución).', is_correct: true}
      - {text: '$x = 5$', is_correct: false}
      - {text: '$y = 10$', is_correct: false}
      - {text: '$0 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$0 = -10$ (contradicción que demuestra que el sistema no tiene solución).''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Resolver el sistema de ecuaciones 2x2 mediante métodos algebraicos para calcular $(x_0, y_0)$.'
  - 'Paso 2: Formular las restricciones de positividad del dominio real ($x \ge 0, y \ge 0$).'
  - 'Paso 3: Verificar si ambas coordenadas cumplen la restricción de no-negatividad.'
  - 'Paso 4: Si alguna coordenada es negativa, rechazar la solución y concluir la irrealizabilidad del problema.'
errores_correccion: |
  - **Error 1:** Modificar el signo negativo de una coordenada para forzar a que la respuesta parezca positiva. **Cómo corregirlo:** Si la resolución entrega un valor negativo en un contexto de conteo, **NO SE ALTERA EL SIGNO ARBITRARIAMENTE; SE DECLARA QUE EL PROBLEMA CARECE DE SOLUCIÓN EN EL MUNDO REAL**.
  - **Error 2:** Omitir la comprobación del signo de $y$ tras verificar únicamente que $x$ resultó positivo. **Cómo corregirlo:** Las restricciones de positividad **DEBEN COMPROBARSE EN LAS DOS COORDENADAS DEL PAR ORDENADO SOLUCIÓN ($x_0 \ge 0 \text{ e } y_0 \ge 0$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Si un problema sobre precios entrega $(x, y) = (1500, -200)$, ¿cuál es la interpretación?'
    alternativas:
      - 'El problema es incompatible pues un precio no puede ser negativo'
      - 'El precio de $y$ es de $\$200$'
      - 'El precio de $x$ se reduce a $\$1300$'
    respuesta: 'El problema es incompatible pues un precio no puede ser negativo'
    solucion_pasos:
      - '1. Comprobar $y_0 = -200 < 0$.'
      - '2. Un precio negativo carece de sentido en el contexto monetario.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En un problema sobre conteo de animales, ¿es admisible el par $(0, 15)$?'
    alternativas:
      - 'Sí, pues 0 indica ausencia de esa especie y 15 indica la presencia de la otra'
      - 'No, el cero está prohibido en las soluciones'
      - 'No, ambas variables deben ser iguales'
    respuesta: 'Sí, pues 0 indica ausencia de esa especie y 15 indica la presencia de la otra'
    solucion_pasos:
      - '1. $x_0 = 0 \ge 0$ e $y_0 = 15 \ge 0$.'
      - '2. El valor 0 es un entero no negativo admisible.'
  - titulo: 'Cuadrante admisible'
    enunciado: '¿La solución de un sistema sobre conteo de objetos reales debe ubicarse necesariamente en el primer cuadrante o sus ejes del plano cartesiano?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues exige $x \ge 0$ e $y \ge 0$.'
  - titulo: 'Rechazo de respuestas'
    enunciado: '¿Rechazar un par con coordenadas negativas es obligatorio en problemas de magnitudes físicas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, respeta las leyes de pertenencia del dominio real.'
errores_frecuentes:
  - 'Al obtener una coordenada negativa $(x, y) = (-5, 15)$ en un problema de conteo de boletos, el signo se modifica arbitrariamente aceptando el par $(5, 15)$.'
  - 'La verificación de positividad de una solución en un contexto real se aplica únicamente a la primera coordenada $x \ge 0$ ignorando el signo de $y$.'
  - 'Una solución con coordenada negativa se acepta en un problema de conteo discreto declarando que representa una deuda de boletos.'
  - 'El par ordenado $(0, 15)$ se descarta en un problema de conteo real al considerar equivocadamente que la coordenada cero es un número negativo.'
  - 'Al restar dos ecuaciones dependientes que entregan una contradicción $0 = -10$, se concluye que el sistema posee infinitas soluciones realizables.'
afirmaciones_verdaderas:
  - 'En problemas aplicados, las coordenadas del par solución $(x, y)$ deben ser no negativas ($x \ge 0, y \ge 0$).'
  - 'Si el despeje de un sistema en un contexto real produce valores negativos, la solución matemática debe descartarse por incompatibilidad.'
al_terminar_debes_poder: |
  QUÉ: Evaluar e identificar restricciones de signo en problemas modelados por sistemas de ecuaciones 2x2.
  CÓMO: Calcular la solución $(x_0, y_0)$, verificar $x_0 \ge 0 \land y_0 \ge 0$, y descartar respuestas con coordenadas negativas redactando la conclusión correspondiente.
