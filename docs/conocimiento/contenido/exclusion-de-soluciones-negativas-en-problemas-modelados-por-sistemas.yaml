semantic_id: MAT.ALG.SISTEMAS_2X2.RESTRICCIONES_SIGNO
resumen_inicial: 'Exclusión de soluciones negativas en problemas modelados por sistemas:
  propiedades, resolución y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: Si resuelves el sistema y obtienes que hay $-5$ gallinas y $35$
  vacas, la matemática de las ecuaciones está correcta (suman 30 cabezas, etc.), pero
  físicamente es imposible tener $-5$ gallinas.
explicacion_formal: '### Definición formal


  En un problema contextual, el conjunto solución algebraico de un sistema puede ser
  más amplio que el conjunto de soluciones admisibles en el contexto. Si el modelo
  impone restricciones como positividad, integralidad o cotas superiores, entonces
  solo son aceptables los pares $(x,y)$ que satisfacen simultáneamente las ecuaciones
  del sistema y las restricciones del contexto.

  Por tanto, una solución algebraica puede ser descartada si contradice las condiciones
  semánticas del problema, aunque haga verdaderas las ecuaciones.


  ### Desarrollo didáctico


  Si resuelves el sistema y obtienes que hay $-5$ gallinas y $35$ vacas, la matemática
  de las ecuaciones está correcta (suman 30 cabezas, etc.), pero físicamente es imposible
  tener $-5$ gallinas.

  En ese caso, debes concluir que los datos originales del problema eran absurdos
  o inconsistentes (el granjero te mintió sobre cuántas patas había).'
definiciones_clave: '- **Exclusión de soluciones negativas en problemas modelados
  por sistemas**: Herramienta matemática para determinar valores desconocidos que
  satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a exclusión de soluciones negativas en problemas
  modelados por sistemas.'
