semantic_id: MAT.ALG.SISTEMAS_2X2.RESTRICCIONES_SIGNO
resumen_inicial: Las cantidades físicas o de conteo en sistemas modelados exigen que
  las respuestas $(x, y)$ sean no negativas.
explicacion_simple: 'En problemas reales modelados por sistemas (como conteo de artículos,
  personas, animales o distancias), las soluciones no pueden ser números negativos.

  Si al resolver algebraicamente un sistema obtenemos una coordenada negativa como
  $(x, y) = (-4, 10)$, debemos concluir que la situación planteada es físicamente
  imposible y descartarla.'
explicacion_formal: 'Sea el sistema lineal $S$ modelando un contexto real con dominio
  físico $\Omega = \mathbb{R}^+ \times \mathbb{R}^+$. La **condición de positividad
  del par solución** exige:


  $$(x_0, y_0) \in \operatorname{CS}(S) \quad \text{con } x_0 \ge 0 \quad \land \quad
  y_0 \ge 0$$


  $$\text{Si } x_0 < 0 \quad \lor \quad y_0 < 0 \implies (x_0, y_0) \text{ es un par
  incompatible con el contexto real}$$'
definiciones_clave: '- **Filtro de positividad bidimensional**: Exigencia $x \ge 0,
  y \ge 0$ sobre el par solución para contextos físicos o de conteo.'
propiedades_relaciones: '- **Incompatibilidad práctica**: Inexistencia de solución
  en la realidad a pesar de existir intersección matemática.'
ejemplo_guiado:
  enunciado: Un comerciante plantea el sistema $\begin{cases} x + y = 10 \\ 2x + 2y
    = 30 \end{cases}$ para hallar la cantidad de boletos tipo A ($x$) y tipo B ($y$).
    Analiza la solución matemática del sistema y concluye sobre su validez real.
  pasos:
  - 'Paso 1: Multiplicar la primera ecuación por $2$: $2x + 2y = 20$.Paso 2: Comparar
    con la segunda ecuación $2x + 2y = 30$.Paso 3: Notar que la resta da $0 = -10$,
    lo que implica que el sistema es **inconsistente** sin soluciones.Paso 4: Concluir
    que no existen cantidades de boletos que cumplan las condiciones planteadas.'
checkpoints:
- placement: after_explicacion_formal
  question: Si al resolver un sistema de ventas de entradas se obtiene $(x, y) = (-5,
    15)$, ¿cuál es la decisión correcta?
  choices:
  - text: Descartar la solución por ser $-5$ incompatible con el conteo real de entradas.
    is_correct: true
  - text: Convertir $-5$ a $+5$ y aceptar el resultado.
    is_correct: false
  - text: Decir que se vendieron $-5$ entradas tipo A.
    is_correct: false
  - text: Sumar $-5 + 15 = 10$ entradas.
    is_correct: false
  explanation: La alternativa correcta es 'Descartar la solución por ser $-5$ incompatible
    con el conteo real de entradas.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al restar las ecuaciones $2x + 2y = 20$ y $2x + 2y = 30$, ¿qué resultado
    algebraico confirma la incompatibilidad del sistema?
  choices:
  - text: $0 = -10$ (contradicción matemática que indica que no hay solución).
    is_correct: true
  - text: $x = 5$
    is_correct: false
  - text: $y = 10$
    is_correct: false
  - text: $0 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$0 = -10$ (contradicción matemática que
    indica que no hay solución).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver el sistema 2x2 algebraicamente para hallar $(x_0, y_0)$.'
- 'Paso 2: Verificar si $x_0 \ge 0$ e $y_0 \ge 0$.'
- 'Paso 3: Si alguna coordenada es negativa, tachar la solución.'
- 'Paso 4: Declarar que las condiciones del enunciado no se pueden cumplir en el mundo
  real.'
errores_correccion: '- **Error común:** Omitir el signo negativo de una coordenada
  para forzar a que el problema tenga respuesta positiva.

  - **Cómo corregirlo:** Si la matemática da un número negativo en un problema de
  conteo, el problema NO TIENE SOLUCIÓN REAL. No inventes signos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
