procedimiento:
- Obtén el par $(x, y)$ solucionando el sistema.
- Vuelve a tus definiciones de 'x' e 'y'.
- Analiza si ambos valores numéricos tienen sentido en el mundo real (sin negativos
  para cosas físicas, sin fracciones para cosas indivisibles como personas).
- Concluye la validez de la respuesta.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en exclusión de soluciones negativas en problemas modelados por sistemas.
