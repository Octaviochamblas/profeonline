procedimiento:
- 'Paso 1: Parte desde el origen (0,0) del plano cartesiano.'
- 'Paso 2: Desplázate horizontalmente según el valor de x (a la derecha si es positivo,
  a la izquierda si es negativo).'
- 'Paso 3: Desde esa posición, desplázate verticalmente según el valor de y (hacia
  arriba si es positivo, hacia abajo si es negativo), y marca el punto final.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con ubicación de puntos mediante pares ordenados.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de ubicación de puntos mediante pares ordenados
