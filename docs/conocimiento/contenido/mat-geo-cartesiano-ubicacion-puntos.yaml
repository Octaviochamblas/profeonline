semantic_id: MAT.GEO.CARTESIANO_BASE.UBICACION_PUNTOS
resumen_inicial: 'Ubicación de puntos mediante pares ordenados: conceptos, teoremas,
  propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'Ubicar un punto en el plano cartesiano es como seguir instrucciones
  de un mapa: primero se avanza horizontalmente según la abscisa, y luego verticalmente
  según la ordenada.'
explicacion_formal: '![Ubicación de puntos en el plano cartesiano](/static/img/geometria/cartesiano-vectores/cartesiano-ubicacion-puntos.svg)


  ### Definición formal


  Para graficar un punto $P(x,y)$, se parte del origen, se desplaza $|x|$ unidades
  horizontalmente (derecha si $x>0$, izquierda si $x<0$) y luego $|y|$ unidades verticalmente
  (arriba si $y>0$, abajo si $y<0$).


  ### Desarrollo didáctico


  En la figura, los puntos $A(4,3)$, $B(-3,2)$, $C(-2,-4)$ y $D(3,-2)$ están ubicados
  siguiendo este procedimiento, cada uno en un cuadrante distinto según el signo de
  sus coordenadas.'
definiciones_clave: '- **Ubicación de puntos mediante pares ordenados**: Elemento
  o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a ubicación de puntos mediante pares ordenados.'
