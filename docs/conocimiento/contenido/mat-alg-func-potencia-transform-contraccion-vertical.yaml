semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.CONTRACCION_VERTICAL
resumen_inicial: 'Análisis de la contracción vertical cuando 0 < |a| < 1: forma general
  $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones y escalas.'
explicacion_simple: Multiplicar la función por una fracción entre $0$ y $1$ en valor
  absoluto "achata" la curva, haciéndola crecer más lento.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot g(x)$ con $0<|a|<1$, cada punto $(x_0,y_0)$ de $g$ se transforma
  en $(x_0,a\cdot y_0)$, con $|a\cdot y_0|<|y_0|$. Visualmente, la curva se "achata"
  acercándose al eje $x$ más que la curva original.


  ### Desarrollo didáctico


  Comparando $g(x)=x^2$ con $f(x)=0{,}25x^2$: en $x=4$, $g(4)=16$ pero $f(4)=4$. La
  curva de $f$ alcanza valores mucho menores para el mismo $x$, dando la apariencia
  de estar más "ancha" o contraída verticalmente.'
definiciones_clave: '- **Análisis de la contracción vertical cuando 0 < |a| < 1**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de la contracción vertical cuando 0 < |a| < 1.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de la contracción vertical cuando 0 < |a| < 1.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de la contracción
    vertical cuando 0 < |a| < 1.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar análisis de la contracción vertical cuando 0 < |a| < 1?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en análisis de la contracción vertical cuando 0 < |a| < 1?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Compara el valor absoluto del coeficiente $a$ con $1$.'
- 'Paso 2: Si $0<|a|<1$, reconoce que la curva se contrae verticalmente respecto a
  $x^n$.'
- 'Paso 3: Calcula puntos específicos para confirmar el crecimiento más lento.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en análisis de la contracción vertical cuando 0 < |a| < 1.
ejemplos:
- titulo: Identificación de una contracción vertical
  enunciado: ¿Es $f(x)=0{,}2x^3$ una contracción vertical de $g(x)=x^3$?
  solucion_pasos:
  - Se compara $0<|0{,}2|<1$.
  - Sí, es una contracción vertical.
- titulo: Comparación numérica de contracción
  enunciado: Compara $f(4)$ con $g(4)$ para $f(x)=0{,}5x^2$ y $g(x)=x^2$.
  solucion_pasos:
  - Se calcula $g(4)=16$ y $f(4)=8$.
  - $f(4)$ es la mitad de $g(4)$, confirmando la contracción.
- titulo: ¿Una contracción vertical cambia la posición del vértice de $f(x)=ax^2$?
  enunciado: ¿Una contracción vertical desplaza la posición del vértice de la curva
    básica $x^2$?
  respuesta: 'No'
  solucion_pasos:
  - El vértice permanece en el origen; solo cambia qué tan rápido crece la curva.
- titulo: ¿Toda contracción vertical implica un coeficiente entre $0$ y $1$ en valor
    absoluto?
  enunciado: ¿Una contracción vertical siempre corresponde a $0<|a|<1$?
  respuesta: Sí
  solucion_pasos:
  - Es la condición que distingue la contracción de la dilatación vertical, donde
    $|a|>1$.
errores_frecuentes:
- Confundir contracción con dilatación, invirtiendo la condición sobre $|a|$.
- Suponer que la contracción vertical desplaza el vértice de la curva.
- No comparar el valor absoluto de $a$, sino solo su signo.
- Confundir esta transformación con una traslación vertical.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  análisis de la contracción vertical cuando 0 < |a| < 1.
