semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.CONTRACCION_VERTICAL
resumen_inicial: 'La contracción o compresión vertical de una función potencia $f(x) = a x^n$ ocurre cuando la magnitud del coeficiente cumple $0 < |a| < 1$, provocando que la gráfica se achate y sus ramas se abran.'
explicacion_simple: |
  La contracción vertical equivale a presionar o aplastar la gráfica de una función potencia desde arriba y desde abajo hacia el suelo (el eje horizontal $x$). Ocurre cuando el número que multiplica a la potencia es una fracción decimal pequeña en valor absoluto (por ejemplo $a = 0.5$, $a = \frac{1}{3}$ o $a = -0.2$). Cada altura $y$ se reduce a una fracción de su valor original, haciendo que las ramas se vuelvan mucho más anchas, abiertas y aplanadas cerca del eje $x$.
explicacion_formal: |
  ### Definición formal
  La **contracción o compresión vertical** de la función potencia $f(x) = a x^n$ por un factor de escala fraccionario $0 < c < 1$ se define por la transformación analítica:
  $$g(x) = c \cdot f(x) = (c \cdot a) x^n \implies 0 < |c \cdot a| < 1$$

  ### Mapeo de pares ordenados y cambio de velocidad
  - Para todo punto $(x_0, y_0) \in \operatorname{Graf}(f)$, el punto contraído correspondiente es $(x_0, c \cdot y_0) \in \operatorname{Graf}(g)$.
  - **Desaceleración de Pendiente**: La derivada primera se multiplica por el factor $0 < c < 1$: $g'(x) = c \cdot f'(x)$. Esto implica que para cualquier abscisa $x \neq 0$, la velocidad de elevación o caída de la curva disminuye, volviéndose más horizontal.

  ### Síntesis didáctica
  Efecto visual de la contracción ($0 < |a| < 1$):
  - La gráfica se **aplasta verticalmente** y se **ensancha horizontalmente**.
  - Las ramas de la gráfica se abren alejándose del eje de las ordenadas $y$.
definiciones_clave: |
  - **Contracción vertical $0 < |a| < 1$**: Deformación escalar donde las ordenadas de la curva se reducen proporcionalmente a una fracción de su altura original.
  - **Achatamiento o compresión**: Efecto visual por el cual la gráfica crece a menor velocidad aplanándose hacia el eje $x$.
  - **Ensanchamiento de ramas**: Apertura progresiva de la curva alejándose de la recta vertical $x = 0$.
propiedades_relaciones: |
  - **Conservación del Vértice**: El origen $(0, 0)$ permanece inalterado pues $|a| \cdot 0^n = 0$.
  - **Invariancia de Cotas**: Conserva la cota inferior $y = 0$ (para $a > 0$) o cota superior $y = 0$ (para $a < 0$) en el recorrido.
ejemplo_guiado:
  enunciado: 'Compara la gráfica de la función potencia base $f(x) = x^2$ con su versión contraída verticalmente $g(x) = \frac{1}{4}x^2$, evaluando los puntos en $x = 2$ y $x = 4$, e interpretando el cambio de apertura.'
  pasos:
    - 'Paso 1: Para $f(x) = x^2$: $f(2) = 4$ y $f(4) = 16$. Puntos: $(2, 4)$ y $(4, 16)$.'
    - 'Paso 2: Para $g(x) = \frac{1}{4}x^2$: $g(2) = \frac{1}{4}(4) = 1$ y $g(4) = \frac{1}{4}(16) = 4$. Puntos: $(2, 1)$ y $(4, 4)$.'
    - 'Paso 3: Observamos que las alturas $y$ de $g(x)$ son una cuarta parte de las de $f(x)$ para las mismas abscisas.'
    - 'Paso 4: Conclusión: Como $|a| = \frac{1}{4} = 0.25$ está entre 0 y 1, la gráfica de $g(x)$ está contraída verticalmente, siendo más ancha y aplanada que $f(x)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué transformación geométrica experimenta la gráfica de la función potencia $f(x) = x^4$ al convertirse en $g(x) = 0.2 x^4$?'
    choices:
      - {text: 'Sufre una contracción vertical por un factor de $0.2$, haciendo que su gráfica se achate y abra sus ramas más anchas hacia los lados', is_correct: true}
      - {text: 'Sufre una dilatación vertical, volviéndose más empinada y estrecha', is_correct: false}
      - {text: 'Se traslada 0.2 unidades a la derecha', is_correct: false}
      - {text: 'Se traslada 0.2 unidades hacia abajo', is_correct: false}
    explanation: 'La alternativa correcta es ''Sufre una contracción vertical por un factor de $0.2$, haciendo que su gráfica se achate y abra sus ramas más anchas hacia los lados''. Al ser la magnitud $|a| = 0.2$ estrictamente menor que 1, la función sufre una contracción vertical.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo afecta la contracción vertical dada por $a = -0.5$ en la función $f(x) = -0.5x^3$ a la forma visual de su curva respecto a $y = -x^3$?'
    choices:
      - {text: 'La curva se achata reduciendo sus alturas a la mitad y abriendo sus ramas hacia afuera', is_correct: true}
      - {text: 'La curva se estira haciéndose el doble de empinada', is_correct: false}
      - {text: 'La curva desplaza su punto de inflexión a $x = -0.5$', is_correct: false}
      - {text: 'La curva se transforma en una recta horizontal', is_correct: false}
    explanation: 'La alternativa correcta es ''La curva se achata reduciendo sus alturas a la mitad y abriendo sus ramas hacia afuera''. La magnitud $|a| = |-0.5| = 0.5$ satisface $0 < 0.5 < 1$, generando contracción vertical.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente multiplicativo $a$ en la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Calcular el valor absoluto o magnitud del coeficiente $|a|$.'
  - 'Paso 3: Comprobar que $0 < |a| < 1$.'
  - 'Paso 4: Declarar que la función presenta una contracción o compresión vertical por un factor de $|a|$, aplanando la curva y ensanchando sus ramas.'
errores_correccion: |
  - **Error 1:** Afirmar que $a = 0.5$ produce dilatación por ser un número positivo. **Cómo corregirlo:** La dilatación requiere $|a| > 1$. Puesto que $|0.5| = 0.5 < 1$, la función sufre una **contracción vertical** (reducida a la mitad de altura).
  - **Error 2:** Creer que las contracciones verticales modifican las raíces o el vértice en el origen. **Cómo corregirlo:** La contracción multiplica las ordenadas por $a$. Como $a \cdot 0 = 0$, el origen $(0, 0)$ permanece totalmente inalterado.
ejemplos:
  - titulo: 'Contracción en parábola'
    enunciado: '¿La gráfica de $f(x) = 0.3x^2$ es más ancha que la de $g(x) = x^2$?'
    alternativas:
      - 'Sí, por tener $0 < |a| < 1$'
      - 'No, es más estrecha'
      - 'No, son iguales'
    respuesta: 'Sí, por tener $0 < |a| < 1$'
    solucion_pasos:
      - '1. Magnitud del coeficiente $|a| = 0.3 \in ]0, 1[$.'
      - '2. Presenta contracción vertical, siendo más ancha y aplanada.'
  - titulo: 'Contracción con fracción negativa'
    enunciado: '¿La función $h(x) = -\frac{1}{5}x^4$ sufre contracción vertical?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Calculamos $|a| = |-\frac{1}{5}| = 0.2 \in ]0, 1[$, confirmando contracción vertical.'
  - titulo: 'Reducción de ordenadas'
    enunciado: 'Si $f(x) = x^3$ vale 8 en $x = 2$, ¿$g(x) = \frac{1}{2}x^3$ vale 4 en $x = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(2) = \frac{1}{2}(8) = 4$. La altura $y$ se reduce a la mitad.'
  - titulo: 'Invariancia del vértice'
    enunciado: '¿El punto $(0, 0)$ pertenece a la función contraída $p(x) = 0.1x^5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $p(0) = 0.1(0)^5 = 0$. El origen no se desplaza.'
errores_frecuentes:
  - 'La función potencia $f(x) = \frac{1}{2} x^2$ se dilata verticalmente volviéndose más angosta.'
  - 'Una contracción vertical traslada horizontalmente el vértice hacia la derecha.'
  - 'Un coeficiente decimal en el rango $0 < |a| < 1$ convierte una función continua en una curva discontinua.'
  - 'La afirmación de que un coeficiente en el rango $0 < |a| < 1$ estira verticalmente la gráfica.'
  - 'La contracción vertical invierte las ramas de la función sin importar el signo de $a$.'
afirmaciones_verdaderas:
  - 'La contracción vertical de una función potencia ocurre cuando la magnitud de su coeficiente satisface $0 < |a| < 1$, reduciendo las ordenadas de la gráfica a una fracción de su altura original.'
  - 'Geométricamente, la contracción vertical aplasta la curva hacia el eje horizontal $x$, ensanchando la abertura de sus ramas.'
al_terminar_debes_poder: |
  QUÉ: Determinar la contracción o compresión vertical en la función potencia cuando $0 < |a| < 1$.
  CÓMO: Comprobar que las ordenadas se reducen proporcionalmente, ensanchando o aplastando la gráfica hacia el eje horizontal.
