semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.POLIGONOS_ANGULOS_CONGRUENTES
resumen_inicial: 'En polígonos semejantes, los ángulos correspondientes o homólogos son rigurosamente congruentes entre sí ($\angle A = \angle A''$), sin importar la razón de ampliación o reducción $k$.'
explicacion_simple: |
  ![Congruencia de Ángulos Correspondientes](/static/img/nodos/congruencia-de-angulos-correspondientes-en-poligonos-semejantes-intro.svg)

  Los ángulos de una figura no cambian cuando la agrandas o la achicas: siguen midiendo los mismos grados exactos.
explicacion_formal: |
  ### Teorema formal
  Sea $S: \mathbb{R}^2 \to \mathbb{R}^2$ una transformación de semejanza euclidiana con razón $k > 0$. Para cualesquiera tres puntos $A, B, C \in \mathbb{R}^2$ no colineales:

  $$\angle(S(A), S(B), S(C)) \cong \angle(A, B, C)$$

  ### Desglose simbólico y geométrico
  - Demostración por producto escalar: El coseno del ángulo entre vectores $\vec{u} = \vec{BA}$ y $\vec{v} = \vec{BC}$ es $\cos\theta = \frac{\vec{u} \cdot \vec{v}}{\|\vec{u}\| \|\vec{v}\|}$. Bajo la semejanza $S$, los vectores se transforman en $k\vec{u}$ y $k\vec{v}$, cancelándose el factor $k^2$ en numerador y denominador: $\cos\theta' = \frac{k^2 (\vec{u} \cdot \vec{v})}{k^2 \|\vec{u}\| \|\vec{v}\|} = \cos\theta \implies \theta' = \theta$.

  ### Síntesis didáctica
  La medida de los ángulos es un invariante métrico fundamental de las semejanzas.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Congruencia de Ángulos Correspondientes](/static/img/nodos/congruencia-de-angulos-correspondientes-en-poligonos-semejantes-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
