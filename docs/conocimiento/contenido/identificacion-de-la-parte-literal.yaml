semantic_id: MAT.ALG.TERMINO.PARTE_LITERAL
resumen_inicial: 'La identificación de la parte literal de un término algebraico consiste en extraer las variables y sus respectivos exponentes que acompañan al coeficiente numérico.'
explicacion_simple: |
  La **parte literal** son las letras con sus exponentes que están en un término algebraico:
  - En $-8x^3 y^2$, la parte literal es **$x^3 y^2$** (se excluye el $-8$).
  - En el término $5a$, la parte literal es la letra **$a$** (cuyo exponente implícito es $1$).
  - **Regla de oro de la semejanza**: Dos términos algebraicos son **términos semejantes** si tienen **exactamente la misma parte literal** (mismas letras elevadas a los mismos exponentes).
  - Por ejemplo, $4x^2 y$ y $-9x^2 y$ son semejantes porque ambos tienen la parte literal $x^2 y$. Pero $4x^2 y$ y $4xy^2$ **NO son semejantes** porque los exponentes de las letras son distintos.
explicacion_formal: |
  ### Definición formal
  Dado un término algebraico $M(x_1, \dots, x_k) = c \cdot x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$, la **parte literal** es el monomio mónico $L \in \mathbb{R}[x_1, \dots, x_k]$ definido por el producto de potencias de variables:

  $$L(x_1, \dots, x_k) = \prod_{i=1}^k x_i^{\alpha_i} = x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$$

  ### Criterio de Semejanza Polinómica
  Dos términos $M_1 = c_1 \cdot L_1$ y $M_2 = c_2 \cdot L_2$ con $c_1, c_2 \neq 0$ son **semejantes** ($M_1 \sim M_2$) si y solo si sus partes literales son idénticas:

  $$M_1 \sim M_2 \iff L_1 = L_2 \iff \forall i \in \{1, \dots, k\}, \quad \alpha_{1,i} = \alpha_{2,i}$$

  ### Síntesis didáctica
  La parte literal determina la "naturaleza" o "tipo" de magnitud que representa el término. En la adición polinómica, la parte literal actúa como una unidad inalterable.
definiciones_clave: |
  - **Parte literal**: Bloque de variables con sus respectivos exponentes que multiplica al coeficiente escalar.
  - **Monomio mónico**: Expresión literal cuyo coeficiente numérico es exactamente igual a $1$.
  - **Términos semejantes**: Monomios que comparten idéntica parte literal (mismas bases variables y mismos exponentes).
propiedades_relaciones: |
  - **Conservación en la adición**: Al sumar o restar términos semejantes, la parte literal se transcribe **exactamente igual** al resultado sin modificar ninguno de sus exponentes.
  - **Modificación en la multiplicación**: Al multiplicar términos algebraicos, las partes literales se combinan sumando los exponentes de las bases iguales ($x^a \cdot x^b = x^{a+b}$).
ejemplo_guiado:
  enunciado: 'En los términos algebraicos $T_1 = -12 x^3 y^4$, $T_2 = 5 x^4 y^3$ y $T_3 = 7 x^3 y^4$, identifica la parte literal de cada uno y determina cuáles de ellos son términos semejantes.'
  pasos:
    - 'Paso 1: Extraemos la parte literal de $T_1 = -12 x^3 y^4$ removiendo el coeficiente $-12 \implies \mathbf{x^3 y^4}$.'
    - 'Paso 2: Extraemos la parte literal de $T_2 = 5 x^4 y^3$ removiendo el coeficiente $5 \implies \mathbf{x^4 y^3}$.'
    - 'Paso 3: Extraemos la parte literal de $T_3 = 7 x^3 y^4$ removiendo el coeficiente $7 \implies \mathbf{x^3 y^4}$.'
    - 'Paso 4: Comparamos las partes literales: $T_1$ y $T_3$ tienen exactamente $x^3 y^4$. En cambio, $T_2$ tiene exponentes invertidos ($x^4 y^3$).'
    - 'Conclusión: **$T_1$ y $T_3$ son términos semejantes**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué elementos componen exactamente la parte literal de un término algebraico?'
    choices:
      - {text: 'Las variables literales junto con sus respectivos exponentes, excluyendo el coeficiente numérico', is_correct: true}
      - {text: 'Únicamente los números que figuran como exponentes', is_correct: false}
      - {text: 'El signo del término y el coeficiente numérico', is_correct: false}
      - {text: 'Las letras sin incluir sus exponentes', is_correct: false}
    explanation: 'La alternativa correcta es ''Las variables literales junto con sus respectivos exponentes, excluyendo el coeficiente numérico''. Definición de parte literal.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué los términos algebraicos $6a^2 b$ y $-4ab^2$ NO son términos semejantes?'
    choices:
      - {text: 'Porque aunque tienen las mismas letras $a$ y $b$, los exponentes de cada letra son distintos ($a^2 b \neq ab^2$)', is_correct: true}
      - {text: 'Porque sus coeficientes numéricos tienen diferente signo', is_correct: false}
      - {text: 'Porque uno de ellos tiene coeficiente par y el otro impar', is_correct: false}
      - {text: 'Porque las letras deben escribirse siempre en orden inverso', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque aunque tienen las mismas letras $a$ y $b$, los exponentes de cada letra son distintos ($a^2 b \neq ab^2$)''. Deben tener idénticos exponentes.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar el coeficiente numérico constante del término algebraico.'
  - 'Paso 2: Retirar el coeficiente numérico y su signo del término.'
  - 'Paso 3: Conservar todas las letras y sus exponentes (incluyendo exponentes implícitos 1).'
  - 'Paso 4: Para verificar semejanza entre dos términos, comparar si sus partes literales coinciden letra por letra y exponente por exponente.'
errores_correccion: |
  - **Error 1:** Considerar que $x^2 y$ y $xy^2$ tienen la misma parte literal por tener las mismas letras. **Cómo corregirlo:** La parte literal exige que **cada variable tenga exactamente el mismo exponente**.
  - **Error 2:** Alterar o sumar los exponentes de la parte literal al efectuar una adición (ej: decir que $3x^2 + 2x^2 = 5x^4$). **Cómo corregirlo:** En la suma de semejantes **la parte literal no se modifica** ($3x^2 + 2x^2 = 5x^2$).
ejemplos:
  - titulo: 'Extracción de parte literal'
    enunciado: '¿Cuál es la parte literal del término $-25u^4 v^7$?'
    alternativas:
      - '$u^4 v^7$'
      - '$-25$'
      - '$u v$'
    respuesta: '$u^4 v^7$'
    solucion_pasos:
      - '1. Retiramos el coeficiente $-25$.'
      - '2. La parte literal es $u^4 v^7$.'
  - titulo: 'Identificación de términos semejantes'
    enunciado: '¿Cuáles de los siguientes términos son semejantes a $3x^2 y^3$?'
    alternativas:
      - '$-10x^2 y^3$'
      - '$3x^3 y^2$'
      - '$3x^2 y$'
    respuesta: '$-10x^2 y^3$'
    solucion_pasos:
      - '1. Comparamos partes literales.'
      - '2. $-10x^2 y^3$ tiene exactamente la misma parte literal $x^2 y^3$.'
  - titulo: 'Parte literal con exponente 1'
    enunciado: 'En el término $-7m$, ¿la parte literal es la letra $m$ (con exponente implícito 1)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $m$ equivale a $m^1$.'
  - titulo: 'Invarianza en la adición'
    enunciado: 'Al sumar $4ab + 9ab = 13ab$, ¿la parte literal $ab$ se mantiene intacta en el resultado?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en la adición polinómica la parte literal no cambia sus exponentes.'
errores_frecuentes:
  - 'Dos términos algebraicos son semejantes si comparten las mismas letras sin importar sus exponentes.'
  - 'Al sumar dos términos semejantes se deben sumar los exponentes de sus partes literales.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La parte literal de un término incluye el coeficiente numérico cuando este es fraccionario.'
  - 'Cambiar el orden alfabético de las letras de una parte literal altera el valor del término.'
afirmaciones_verdaderas:
  - 'La parte literal de un término algebraico la constituyen las variables con sus respectivos exponentes.'
  - 'Dos o más términos algebraicos son semejantes si poseen exactamente la misma parte literal.'
al_terminar_debes_poder: 'Identificar la parte literal de cualquier término algebraico y comparar la coincidencia de bases y exponentes para determinar términos semejantes.'
