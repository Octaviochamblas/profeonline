semantic_id: MAT.ALG.TERMINO.PARTE_LITERAL
resumen_inicial: 'La parte literal de un término algebraico está constituida por el conjunto de todas sus variables junto con sus respectivos exponentes.'
explicacion_simple: |
  - La **parte literal** son todas las letras del término con sus potencias incluidas.
  - En $-8x^3y^2z$, la parte literal es exactamente **$x^3y^2z$**.
  - **Importancia fundamental:**
    - Los **términos semejantes** son aquellos que tienen **exactamente la misma parte literal** (mismas letras y mismos exponentes).
    - Por ejemplo, $5x^2y$ y $-3x^2y$ son semejantes porque ambos tienen parte literal $x^2y$; se pueden sumar ($5x^2y - 3x^2y = 2x^2y$).
    - Pero $4x^2y$ y $4xy^2$ **no son semejantes**, porque sus exponentes están en letras distintas ($x^2y \neq xy^2$).

  ![Parte Literal de un Término](/static/img/nodos/identificacion-de-la-parte-literal-intro.svg)
explicacion_formal: |
  ### Definición formal
  Dado un término algebraico $T = c \cdot X$, la **parte literal** $X$ es el producto monomial de potencias de variables:

  $$X = x_1^{e_1} x_2^{e_2} \cdots x_k^{e_k}, \quad x_i \in \text{Variables}, \; e_i \in \mathbb{R}$$

  ### Criterio de semejanza monomial
  Dos términos $T_1 = c_1 X_1$ y $T_2 = c_2 X_2$ son **términos semejantes** si y solo si sus partes literales son formalmente idénticas:

  $$T_1 \sim T_2 \iff X_1 \equiv X_2$$

  La semejanza es una relación de equivalencia que particiona a los términos en clases sumables bajo distributividad:
  $$c_1 X + c_2 X = (c_1 + c_2)X$$
definiciones_clave: |
  - **Parte literal**: Bloque de variables con sus respectivos exponentes que define la dimensión algebraica del término.
  - **Términos semejantes**: Monomios que comparten idéntica parte literal (mismas variables con los mismos exponentes).
  - **Factor literal**: Cada una de las potencias de variables individuales que integran la parte literal.
propiedades_relaciones: |
  - **Conmutatividad de factores literales**: El orden de las letras en la parte literal no altera el término ($x^2y \equiv yx^2$).
  - **Condición necesaria y suficiente para reducción**: Solo los términos con idéntica parte literal pueden combinarse mediante adición o sustracción en un solo término.
ejemplo_guiado:
  enunciado: 'En el término $-\frac{5}{9}a^3b^2c$, identifica la parte literal y determina si es semejante con el término $12b^2a^3c$.'
  imagen: '/static/img/nodos/identificacion-de-la-parte-literal-ejemplos.svg'
  pasos:
    - 'Paso 1: Separamos el coeficiente numérico ($-\frac{5}{9}$).'
    - 'Paso 2: La parte literal restante con todas sus letras y exponentes es **$a^3b^2c$**.'
    - 'Paso 3: Analizamos la parte literal del segundo término: $b^2a^3c = a^3b^2c$ (por conmutatividad).'
    - 'Paso 4: Conclusión: Ambos términos tienen la misma parte literal ($a^3b^2c$), por lo tanto **sí son términos semejantes** y se pueden sumar: $(-\frac{5}{9} + 12)a^3b^2c = \frac{103}{9}a^3b^2c$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la parte literal del término algebraico $-13x^4y^2z$?'
    choices:
      - text: '$x^4y^2z$'
        is_correct: true
      - text: '$xyz$'
        is_correct: false
      - text: '$-13$'
        is_correct: false
      - text: '$4, 2, 1$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$x^4y^2z$''. La parte literal incluye todas las letras junto con sus exponentes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué los términos $7x^3y^2$ y $-2x^2y^3$ NO son semejantes?'
    choices:
      - text: 'Porque los exponentes de las letras $x$ e $y$ son diferentes en cada término'
        is_correct: true
      - text: 'Porque tienen coeficientes numéricos distintos'
        is_correct: false
      - text: 'Porque uno es positivo y el otro es negativo'
        is_correct: false
      - text: 'Porque contienen dos variables'
        is_correct: false
    explanation: 'La alternativa correcta es ''Porque los exponentes de las letras $x$ e $y$ son diferentes en cada término''. Para ser semejantes, cada letra debe tener exactamente el mismo exponente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Quitar el coeficiente numérico y su signo.'
  - 'Paso 2: Escribir la lista de variables conservando sus exponentes respectivos.'
  - 'Paso 3: Para comparar semejanza con otro término, ordenar alfabéticamente las letras.'
  - 'Paso 4: Verificar que coincidan tanto las variables como sus potencias.'
errores_correccion: |
  - **Error 1:** Excluir los exponentes al indicar la parte literal (decir que la parte literal de $x^3y^2$ es $xy$). **Cómo corregirlo:** La parte literal **incluye obligatoriamente los exponentes**: $x^3y^2$.
  - **Error 2:** Sumar términos no semejantes como $3x^2 + 2x = 5x^3$. **Cómo corregirlo:** Términos con diferente exponente **no se pueden sumar** en un solo término.
ejemplos:
  - titulo: 'Identificación de parte literal múltiple'
    enunciado: '¿Cuál es la parte literal del término $\frac{4}{7}u^5v^3w$?'
    alternativas:
      - '$u^5v^3w$'
      - '$uvw$'
      - '$\frac{4}{7}$'
    respuesta: '$u^5v^3w$'
    solucion_pasos:
      - '1. Se elimina el coeficiente fraccionario $\frac{4}{7}$.'
      - '2. La parte literal es el bloque $u^5v^3w$.'
  - titulo: 'Discriminación de términos semejantes'
    enunciado: '¿Cuál de los siguientes términos es semejante a $-5a^2b^4$?'
    alternativas:
      - '$9b^4a^2$'
      - '$9a^4b^2$'
      - '$-5ab^4$'
    respuesta: '$9b^4a^2$'
    solucion_pasos:
      - '1. $9b^4a^2 = 9a^2b^4$ por conmutatividad.'
      - '2. Tienen exactamente la misma parte literal $a^2b^4$.'
  - titulo: 'Orden de factores literales'
    enunciado: '¿Son $3xy$ y $5yx$ términos semejantes?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por la conmutatividad del producto, $xy = yx$.'
      - '2. Tienen idéntica parte literal.'
  - titulo: 'Semejanza con exponentes permutados'
    enunciado: '¿Son $2x^3y$ y $2xy^3$ términos semejantes?'
    respuesta: 'No'
    solucion_pasos:
      - '1. En el primero $x$ está al cubo y en el segundo $y$ está al cubo.'
      - '2. $x^3y \neq xy^3$, por lo que no son semejantes.'
errores_frecuentes:
  - 'Omitir los exponentes de las letras al nombrar la parte literal de un monomio.'
  - 'Considerar semejantes a términos que tienen las mismas letras pero con exponentes permutados ($x^2y$ y $xy^2$).'
  - 'Intentar sumar algebraicamente términos con diferente parte literal ($3x + 2y = 5xy$).'
  - 'Creer que cambiar el orden alfabético de las letras ($ab$ por $ba$) altera la parte literal.'
  - 'Incluir el coeficiente numérico dentro de la parte literal.'
afirmaciones_verdaderas:
  - 'La parte literal de un término está formada por todas sus letras con sus respectivos exponentes.'
  - 'Dos términos pueden sumarse en un solo monomio si y solo si tienen idéntica parte literal.'
al_terminar_debes_poder: |
  ![Resumen de Parte Literal](/static/img/nodos/identificacion-de-la-parte-literal-resumen.svg)

  QUÉ: Identificar la parte literal completa de un término algebraico y aplicar el criterio de semejanza monomial para la reducción algebraica.
  CÓMO: Extrayendo el bloque de variables y potencias ($x^3y^2z$) y comparando exponentes letra por letra para validar términos semejantes.
