resumen_inicial: La parte literal de un término algebraico está constituida por el
  conjunto de variables y sus respectivos exponentes.
explicacion_simple: La parte literal de un término es 'todo lo que son letras con
  sus exponentes', dejando fuera al número de adelante. Por ejemplo, en el término
  $-9x^3y^2$, la parte literal es exactamente $x^3y^2$. Dos términos son semejantes
  si tienen exactamente la misma parte literal.
explicacion_formal: 'En el término $T = c \cdot L$, la **Parte Literal** $L$ se define
  como el producto de las potencias de las variables:


  $$L = \text{Lit}(T) = \prod_{j=1}^m x_j^{e_j} = x_1^{e_1} x_2^{e_2} \dots x_m^{e_m}$$


  > **Complemento didáctico:** La parte literal define la identidad cualitativa del
  término, siendo el criterio exclusivo para la semejanza y reducción de términos.'
definiciones_clave: '- **Parte literal**: Bloque compuesto por las variables literales
  y sus exponentes en un término algebraico.'
propiedades_relaciones: '- **Criterio de semejanza**: Dos términos son semejantes
  si y solo si poseen la misma parte literal ($L_1 = L_2$).'
ejemplo_guiado:
  enunciado: Identifique la parte literal en el término $T = -15a^4b^7c$.
  pasos:
  - 'Paso 1: Aislar el coeficiente numérico: $c = -15$.'
  - 'Paso 2: Agrupar todas las variables con sus exponentes: $a^4b^7c$.'
  - 'Conclusión: La parte literal exacta es $a^4b^7c$ (recordando que $c = c^1$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué componentes integran la parte literal de un término algebraico?
  choices:
  - text: Todas las variables literales junto con sus respectivos exponentes
    is_correct: true
  - text: Únicamente el coeficiente numérico de adelante
    is_correct: false
  - text: Solamente el signo del término
    is_correct: false
  - text: Los coeficientes sumados
    is_correct: false
  explanation: La alternativa correcta es 'Todas las variables literales junto con
    sus respectivos exponentes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -15a^4b^7c, ¿cuál fue la parte literal?
  choices:
  - text: a^4b^7c
    is_correct: true
  - text: '-15'
    is_correct: false
  - text: a b c
    is_correct: false
  - text: 4 7 1
    is_correct: false
  explanation: La alternativa correcta es 'a^4b^7c'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Retirar el coeficiente numérico y su signo del término.'
- 'Paso 2: Escribir todas las variables con sus exponentes correspondientes.'
- 'Paso 3: Conservar los exponentes de cada letra sin modificarlos.'
errores_correccion: '- **Error 1: Omitir los exponentes al declarar la parte literal
  (decir que la parte literal de $x^3y^2$ es $xy$).** **Cómo corregirlo:** Los exponentes
  pertenecen a la parte literal y deben escribirse obligatoriamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la parte literal del término 18x^5y^3?
  alternativas:
  - x^5y^3
  - '18'
  - x y
  - 5 3
  respuesta: x^5y^3
  solucion_pasos:
  - 1. Quitar el coeficiente 18.
  - '2. La parte literal incluye las variables y exponentes: x^5y^3.'
- titulo: Ejemplo 2
  enunciado: En el término -7a^2b^6, ¿cuál es la parte literal?
  alternativas:
  - a^2b^6
  - '-7'
  - a^2
  - b^6
  respuesta: a^2b^6
  solucion_pasos:
  - 1. Retirar el coeficiente -7.
  - '2. Agrupar la parte literal completa: a^2b^6.'
- titulo: ¿Es la parte literal del término -3m^4n igual a m^4n?
  respuesta: Sí
  solucion_pasos:
  - Sí, contiene las variables m y n con sus exponentes 4 y 1 respectivamente.
- titulo: ¿Es la parte literal de 9x^2y idéntica a la de 4xy^2?
  respuesta: 'No'
  solucion_pasos:
  - No, los exponentes están intercambiados (x^2y frente a xy^2), por lo que no son
    la misma parte literal.
errores_frecuentes:
- Omitir los exponentes de las letras al indicar la parte literal de un término.
- Incluir el coeficiente numérico dentro de la respuesta de la parte literal.
- Cambiar el orden de las letras al comparar partes literales creyendo que altera
  el término.
- Declarar que una variable sin exponente explícito no forma parte de la parte literal.
- Declarar la parte literal con el grado absoluto del término.
afirmaciones_verdaderas:
- La parte literal incluye a todas las variables del término con sus exponentes respectivos.
- Dos términos con la misma parte literal son términos semejantes.
al_terminar_debes_poder: Al terminar serás capaz de identificar la parte literal completa
  de cualquier término algebraico extrayendo sus variables y exponentes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Término Algebraico.
estado: publicado
semantic_id: MAT.ALG.TERMINO.PARTE_LITERAL
