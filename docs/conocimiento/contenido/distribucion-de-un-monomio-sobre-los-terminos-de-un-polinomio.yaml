  question: ¿Cuál es el principio clave al desarrollar distribución de un monomio
    sobre los términos de un polinomio?
  choices:
  - text: Aplicar correctamente las leyes del producto en multiplicación de monomio
      por polinomio
    is_correct: true
  - text: Multiplicar los exponentes de las variables de igual base
    is_correct: false
  - text: Ignorar la ley de los signos al multiplicar coeficientes
    is_correct: false
  - text: Sumar los coeficientes en lugar de multiplicarlos
    is_correct: false
  explanation: 'La alternativa correcta es: Aplicar correctamente las leyes del producto
