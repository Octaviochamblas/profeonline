  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el cálculo paso a paso de distribución de un monomio sobre los términos
    de un polinomio, ¿qué procedimiento con los exponentes se debe realizar?
  choices:
  - text: Sumar los exponentes de las mismas bases y multiplicar los coeficientes
    is_correct: true
  - text: Restar los exponentes de las variables multiplicadas
    is_correct: false
