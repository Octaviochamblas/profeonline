semantic_id: MAT.ALG.MULT_MON_POL.DISTRIBUCION_TERMINOS
resumen_inicial: 'La distribución de un monomio sobre los términos de un polinomio consiste en aplicar la propiedad distributiva multiplicando el monomio por cada uno de los monomios constituyentes del polinomio.'
explicacion_simple: |
  Para multiplicar un **monomio por un polinomio** (ej: $3x \cdot (2x^2 - 4x + 5)$):
  - **REGLA FUNDAMENTAL**: El monomio de afuera actúa como un "multiplicador repartido" que **debe multiplicarse INDIVIDUALMENTE por cada término dentro del polinomio**.
  - **Paso a paso**:
    1. Identifica cuántos términos tiene el polinomio dentro del paréntesis.
    2. Multiplica el monomio por el primer término.
    3. Multiplica el monomio por el segundo término.
    4. Multiplica el monomio por el tercer término (y así sucesivamente).
    5. Junta todos los resultados parciales en una sola cadena.
  - **Ejemplo**: $3x \cdot (2x^2 - 4x + 5)$:
    - $3x \cdot 2x^2 = \mathbf{6x^3}$.
    - $3x \cdot (-4x) = \mathbf{-12x^2}$.
    - $3x \cdot 5 = \mathbf{+15x}$.
    - Polinomio final expandido: **$6x^3 - 12x^2 + 15x$**.
explicacion_formal: |
  ### Definición formal
  Sea un monomio $M = c x^\alpha \in \mathbb{R}[x]$ y un polinomio $P(x) = \sum_{j=1}^m a_j x^{\beta_j}$. El **producto de monomio por polinomio** es la extensión bilineal de la distributividad dada por:

  $$M \cdot P(x) = c x^\alpha \cdot \left( \sum_{j=1}^m a_j x^{\beta_j} \right) = \sum_{j=1}^m \left( (c \cdot a_j) x^{\alpha + \beta_j} \right)$$

  ### Conservación de la Cardinalidad de Sumandos
  Si el polinomio $P(x)$ posee $m$ términos distintos y no nulos y $M \neq 0$, la expansión producto genera exactamente $m$ sumandos de grados distintos $\alpha + \beta_j$, garantizando que el polinomio expandido conserve la misma cantidad de monomios antes de cualquier reducción externa.

  ### Síntesis didáctica
  Distribuir el monomio garantiza la transformación completa del producto en una forma polinómica canónica abierta.
definiciones_clave: |
  - **Distribución sobre sumandos**: Multiplicación reiterada $M \cdot (T_1 + T_2 + \dots) = M T_1 + M T_2 + \dots$ sobre cada componente aditivo.
  - **Conservación de la cardinalidad de términos**: Preservación del número total de términos en la expresión expandida resultante.
  - **Productos parciales monomicos**: Multiplicaciones intermedias efectuadas entre el monomio exterior y cada sumando individual.
propiedades_relaciones: |
  - **Grado del polinomio producto**: Si $\operatorname{deg}(P) = n$, entonces $\operatorname{deg}(M \cdot P) = \operatorname{deg}(M) + n$.
  - **Homogeneización del producto**: Multiplicar un monomio por un polinomio homogéneo de grado $k$ resulta en un nuevo polinomio homogéneo de grado $\operatorname{deg}(M) + k$.
ejemplo_guiado:
  enunciado: 'Aplica la distribución del monomio $4a^2$ sobre el trinomio $(2a^3 - 5a + 3)$.'
  pasos:
    - 'Paso 1: Identificamos los 3 términos dentro del paréntesis: $T_1 = 2a^3$, $T_2 = -5a$, $T_3 = +3$.'
    - 'Paso 2: Multiplicamos el monomio por el primer término $T_1$:
       $(4a^2) \cdot (2a^3) = (4 \cdot 2) a^{2+3} = \mathbf{8a^5}$.'
    - 'Paso 3: Multiplicamos el monomio por el segundo término $T_2$:
       $(4a^2) \cdot (-5a) = (4 \cdot (-5)) a^{2+1} = \mathbf{-20a^3}$.'
    - 'Paso 4: Multiplicamos el monomio por el tercer término $T_3$:
       $(4a^2) \cdot (+3) = (4 \cdot 3) a^2 = \mathbf{+12a^2}$.'
    - 'Paso 5: Consolidamos la suma de los 3 productos parciales: $8a^5 - 20a^3 + 12a^2$.'
    - 'Conclusión: El polinomio expandido resultante es **$8a^5 - 20a^3 + 12a^2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuántos sumandos tendrá la expansión del producto de un monomio no nulo por un trinomio (3 términos) si no hay reducción de términos?'
    choices:
      - {text: 'Tendrá exactamente 3 sumandos, ya que el monomio se multiplica individualmente por cada uno de los 3 términos', is_correct: true}
      - {text: 'Tendrá sólo 1 sumando', is_correct: false}
      - {text: 'Tendrá 6 sumandos', is_correct: false}
      - {text: 'Tendrá 2 sumandos', is_correct: false}
    explanation: 'La alternativa correcta es ''Tendrá exactamente 3 sumandos, ya que el monomio se multiplica individualmente por cada uno de los 3 términos''. Conservación de la cardinalidad de sumandos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de distribuir $5x \cdot (x^2 - 3)$?'
    choices:
      - {text: 'El resultado es $5x^3 - 15x$, al distribuir $5x \cdot x^2 = 5x^3$ y $5x \cdot (-3) = -15x$', is_correct: true}
      - {text: 'El resultado es $5x^3 - 3$', is_correct: false}
      - {text: 'El resultado es $5x^2 - 15x$', is_correct: false}
      - {text: 'El resultado es $6x^3 - 15x$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $5x^3 - 15x$, al distribuir $5x \cdot x^2 = 5x^3$ y $5x \cdot (-3) = -15x$''. $5x(x^2)-5x(3) = 5x^3-15x$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar con claridad cada sumando del polinomio conservando sus signos antecedentes.'
  - 'Paso 2: Multiplicar el monomio por el primer sumando calculando coeficientes y exponentes.'
  - 'Paso 3: Multiplicar el monomio por los sumandos restantes uno por uno.'
  - 'Paso 4: Escribir la expresión expandida uniendo todos los productos parciales obtenidos.'
errores_correccion: |
  - **Error 1:** Multiplicar el monomio únicamente por el primer término del polinomio (escribir $3x(2x + 4) = 6x^2 + 4$). **Cómo corregirlo:** Se debe **MULTIPLICAR EL MONOMIO POR TODOS LOS TÉRMINOS ($6x^2 + 12x$)**.
  - **Error 2:** Sumar los monomios parciales en lugar de dejarlos expresados como polinomio expandido (escribir $2x^2 + 3x = 5x^3$). **Cómo corregirlo:** Si los términos **NO SON SEMEJANTES, NO SE PUEDEN SUMAR ($2x^2 + 3x$ queda intacto)**.
ejemplos:
  - titulo: 'Distribución en binomio'
    enunciado: '¿Cuál es el producto de $2a \cdot (3a + 5)$?'
    alternativas:
      - '$6a^2 + 10a$'
      - '$6a^2 + 5$'
      - '$16a^2$'
    respuesta: '$6a^2 + 10a$'
    solucion_pasos:
      - '1. $2a \cdot 3a = 6a^2$.'
      - '2. $2a \cdot 5 = 10a$.'
      - '3. Resultado: $6a^2 + 10a$.'
  - titulo: 'Distribución en trinomio'
    enunciado: '¿Cuál es el producto de $x^2 \cdot (x^2 - 2x + 4)$?'
    alternativas:
      - '$x^4 - 2x^3 + 4x^2$'
      - '$x^4 - 2x + 4$'
      - '$3x^4$'
    respuesta: '$x^4 - 2x^3 + 4x^2$'
    solucion_pasos:
      - '1. $x^2 \cdot x^2 = x^4$.'
      - '2. $x^2 \cdot (-2x) = -2x^3$.'
      - '3. $x^2 \cdot 4 = 4x^2$.'
      - '4. Resultado: $x^4 - 2x^3 + 4x^2$.'
  - titulo: 'Preservación de términos no semejantes'
    enunciado: 'En el desarrollo $3x(x + y) = 3x^2 + 3xy$, ¿quedan los dos términos sin reducir por no ser semejantes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $3x^2$ y $3xy$ tienen distinto factor literal.'
  - titulo: 'Multiplicación por constante'
    enunciado: 'Para $4(2x^2 - x + 3)$, ¿se obtiene $8x^2 - 4x + 12$ multiplicando el $4$ por cada número?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las potencias de $x$ se conservan.'
errores_frecuentes:
  - 'Multiplicar el monomio exterior únicamente por el primer término del polinomio dentro del paréntesis.'
  - 'Sumar los monomios resultantes de la expansión aun cuando no son términos semejantes.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Alterar los signos del polinomio al distribuir si el monomio es positivo.'
  - 'Multiplicar las variables excluyendo la multiplicación de los coeficientes numéricos.'
afirmaciones_verdaderas:
  - 'La multiplicación de un monomio por un polinomio requiere multiplicar el monomio por cada uno de los términos del polinomio.'
  - 'El resultado de multiplicar un monomio por un polinomio no nulo es un polinomio con el mismo número de términos (antes de reducir semejantes).'
