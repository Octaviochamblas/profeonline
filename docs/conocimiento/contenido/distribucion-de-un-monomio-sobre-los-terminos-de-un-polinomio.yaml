resumen_inicial: La distribución de un monomio sobre los términos de un polinomio
  aplica rigurosamente las leyes distributivas, de signos y de potencias en expresiones
  algebraicas.
explicacion_simple: Al trabajar con distribución de un monomio sobre los términos
  de un polinomio, multiplicamos los coeficientes numéricos, aplicamos la regla de
  signos y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Distribución de un monomio
  sobre los términos de un polinomio** viene dada por:


  $$\text{"el desarrollo 3x(2x^2 + 4x - 5)"} \implies 6x^3 + 12x^2 - 15x$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Distribución de un monomio sobre los términos de un polinomio**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule distribución de un monomio sobre los términos de un polinomio
    para: ''el desarrollo 3x(2x^2 + 4x - 5)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 6x^3 + 12x^2 - 15x.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar distribución de un monomio sobre los
    términos de un polinomio a 'el desarrollo 3x(2x^2 + 4x - 5)'?
  choices:
  - text: 6x^3 + 12x^2 - 15x
    is_correct: true
  - text: 6x^3 + 4x - 5
    is_correct: false
  - text: 5x^3 + 7x^2 - 2x
    is_correct: false
  - text: 6x^2 + 12x - 15
    is_correct: false
  explanation: La alternativa correcta es '6x^3 + 12x^2 - 15x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el desarrollo 3x(2x^2 + 4x - 5)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: 6x^3 + 12x^2 - 15x
    is_correct: true
  - text: 6x^3 + 4x - 5
    is_correct: false
  - text: 5x^3 + 7x^2 - 2x
    is_correct: false
  - text: 6x^2 + 12x - 15
    is_correct: false
  explanation: La alternativa correcta es '6x^3 + 12x^2 - 15x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante distribución de un monomio sobre los términos de un polinomio.** **Cómo
  corregirlo:** Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de distribución de un monomio sobre los términos
    de un polinomio en 'el desarrollo 3x(2x^2 + 4x - 5)'?
  alternativas:
  - 6x^3 + 12x^2 - 15x
  - 6x^3 + 4x - 5
  - 5x^3 + 7x^2 - 2x
  - 6x^2 + 12x - 15
  respuesta: 6x^3 + 12x^2 - 15x
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 6x^3 + 12x^2 - 15x.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el desarrollo 3x(2x^2 + 4x - 5)' por distribución de un
    monomio sobre los términos de un polinomio, ¿qué expresión resulta?
  alternativas:
  - 6x^3 + 12x^2 - 15x
  - 6x^3 + 4x - 5
  - 5x^3 + 7x^2 - 2x
  - 6x^2 + 12x - 15
  respuesta: 6x^3 + 12x^2 - 15x
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 6x^3 + 12x^2 - 15x.
- titulo: ¿Es la multiplicación en 'el desarrollo 3x(2x^2 + 4x - 5)' equivalente a
    6x^3 + 12x^2 - 15x?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 6x^3 + 12x^2 - 15x.
- titulo: ¿Da el producto de 'el desarrollo 3x(2x^2 + 4x - 5)' un resultado igual
    a 6x^3 + 4x - 5?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 6x^3 + 12x^2 - 15x.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar distribución de un monomio
  sobre los términos de un polinomio.
- Omitir distribuir el monomio o término sobre todos los sumandos en distribución
  de un monomio sobre los términos de un polinomio.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La distribución de un monomio sobre los términos de un polinomio requiere sumar
  los exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la distribución de un
  monomio sobre los términos de un polinomio aplicando distributividad, ley de signos
  y suma de exponentes.
