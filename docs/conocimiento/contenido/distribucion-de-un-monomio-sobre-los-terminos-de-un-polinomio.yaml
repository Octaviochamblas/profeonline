  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el monomio exterior y todos los términos del polinomio interior.'
- 'Paso 2: Multiplica el monomio por el primer término del polinomio.'
- 'Paso 3: Multiplica el monomio por el segundo término del polinomio (respetando
  signos).'
- 'Paso 4: Repite el proceso para todos los términos restantes.'
- 'Paso 5: Escribe la expresión final conectando todos los productos parciales con
  sus respectivos signos.'
- La distributividad permite repartir el producto exterior a cada sumando interior.
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en distribución de un monomio sobre los términos de un polinomio.
ejemplos:
- titulo: El cartero algebraico
  enunciado: 'Multiplica: 2a(3a - 5b).'
  solucion_pasos:
  - 'Multiplicación 1: (2a)(3a) = 6a^2.'
  - 'Multiplicación 2: (2a)(-5b) = -10ab.'
  - 'Combinación: 6a^2 - 10ab.'
- titulo: El ingreso de un cine se calcula como $I = p(100 - 2p)$ donde $p$ es el
    precio de la entrada
  enunciado: 'El ingreso de un cine se calcula como $I = p(100 - 2p)$ donde $p$ es
    el precio de la entrada. ¿Cuál es la expresión equivalente para el ingreso al
    distribuir el precio? (v1)


    Opciones: A) $100p - 2p^2$ · B) $100 - 2p^2$ · C) $100p - 2p$ · D) $98p^2$'
  solucion_pasos:
  - 'Distribuimos $p$: $p \cdot 100 = 100p$. $p \cdot (-2p) = -2p^2$. Resultado: $100p
    - 2p^2$.'
- titulo: 'Respecto de «Distribución de un monomio sobre los términos de un polinomio»:
    ¿Es correcta es'
  enunciado: 'Respecto de «Distribución de un monomio sobre los términos de un polinomio»:
    ¿Es correcta esta caracterización? «La multiplicación de un monomio por un polinomio
    se basa en la **Propiedad Distributiva**: el monomio exterior se multiplica por
    cada uno de los términos del polinomio interior por separado, sumando los resultados
    obtenidos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La multiplicación de un monomio
    por un polinomio se basa en la **Propiedad Distributiva**: el monomio exterior
    se multiplica por cada uno de los términos del polinomio interior por separado,
    sumando los resultados obtenidos.'
- titulo: 'Respecto de «Distribución de un monomio sobre los términos de un polinomio»:
    ¿Es válida esta'
  enunciado: 'Respecto de «Distribución de un monomio sobre los términos de un polinomio»:
    ¿Es válida esta afirmación? «Multiplicar el monomio únicamente por el primer término
    del polinomio y dejar los demás intactos (ej. $2(x+3) = 2x+3$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La multiplicación de un monomio
    por un polinomio se basa en la **Propiedad Distributiva**: el monomio exterior
    se multiplica por cada uno de los términos del polinomio interior por separado,
    sumando los resultados obtenidos.'
errores_frecuentes:
- Multiplicar el monomio únicamente por el primer término del polinomio y dejar los
  demás intactos (ej. $2(x+3) = 2x+3$).
- Cometer errores de signos al multiplicar el monomio por los términos negativos del
  polinomio.
- Para «¿Qué propiedad matemática justifica que la operación $3a(b + c)$ se resuelva
  como $3ab + 3ac$? (v1)», la respuesta correcta es Propiedad conmutativa.
- Para «¿Qué propiedad matemática justifica que la operación $3a(b + c)$ se resuelva
  como $3ab + 3ac$? (v1)», la respuesta correcta es Propiedad asociativa.
- Para «¿Qué propiedad matemática justifica que la operación $3a(b + c)$ se resuelva
  como $3ab + 3ac$? (v1)», la respuesta correcta es Elemento neutro multiplicativo.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
al_terminar_debes_poder: Resolver productos algebraicos utilizando distribución de
  un monomio sobre los términos de un polinomio.
