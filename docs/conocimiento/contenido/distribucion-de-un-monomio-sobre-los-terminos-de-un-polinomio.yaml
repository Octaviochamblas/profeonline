semantic_id: MAT.ALG.MULT_MON_POL.DISTRIBUCION_TERMINOS
resumen_inicial: 'Distribución de un monomio sobre los términos de un polinomio: leyes,
  procedimiento y aplicación en Multiplicación de monomio por polinomio.'
explicacion_simple: Imagina que eres un cartero y tienes que entregar una carta en
  cada casa de una cuadra. El monomio es el cartero, y cada término del polinomio
  es una casa. El monomio debe visitar (multiplicar) a absolutamente todos los términos
  de la cuadra.
explicacion_formal: '### Definición formal


  Sean $M$ un monomio y $P=T_1+T_2+\cdots+T_n$ un polinomio escrito como suma algebraica
  de sus términos. La propiedad distributiva define su producto mediante

  $$M\cdot P=M\cdot T_1+M\cdot T_2+\cdots+M\cdot T_n=\sum_{i=1}^{n}M\cdot T_i.$$

  Por tanto, el monomio multiplica a todos los términos del polinomio y conserva entre
  los productos parciales las operaciones de suma o resta presentes en $P$.


  ### Desarrollo didáctico


  Operación: $3x(2x^2 - 5x + 4)$.


  Aplicamos la distribución término a término:

  1. Primer término: $(3x)(2x^2) = 6x^3$.

  2. Segundo término: $(3x)(-5x) = -15x^2$.

  3. Tercer término: $(3x)(+4) = +12x$.


  Sumamos o conectamos los resultados: $6x^3 - 15x^2 + 12x$.'
definiciones_clave: '- **Distribución de un monomio sobre los términos de un polinomio**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a distribución de un monomio sobre los términos de
  un polinomio.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de distribución de un monomio
    sobre los términos de un polinomio.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de distribución de un monomio sobre los términos
    de un polinomio.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
