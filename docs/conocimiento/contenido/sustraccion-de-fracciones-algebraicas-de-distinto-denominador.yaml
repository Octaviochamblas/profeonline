semantic_id: MAT.ALG.FRACCIONES_RESTA.DISTINTO_DENOMINADOR
resumen_inicial: Para restar fracciones algebraicas de distinto denominador, se deben homogeneizar al m.c.m. común y restar
  los numeradores amplificados.
explicacion_simple: 'Cuando los denominadores son diferentes, debemos homogeneizar las fracciones antes de realizar la resta.


  Buscamos el denominador común m.c.m. y determinamos el factor por el cual se amplifica cada numerador.


  Al escribir la resta de los numeradores amplificados sobre la barra del m.c.m., es imprescindible colocar entre paréntesis
  el segundo producto amplificado para distribuir la negación a cada uno de sus términos.


  ![Sustracción de fracciones de distinto denominador](/static/img/nodos/sustraccion-de-fracciones-algebraicas-de-distinto-denominador-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dadas dos fracciones algebraicas $\frac{A(x)}{P(x)}$ y $\frac{B(x)}{Q(x)}$ con $P(x) \neq 0$ y $Q(x) \neq 0$, la **sustracción
  de distinto denominador** sobre el $\operatorname{mcm}(P, Q) = M(x)$ se expresa como:


  $$\frac{A(x)}{P(x)} - \frac{B(x)}{Q(x)} = \frac{A(x) \cdot C_1(x) - (B(x) \cdot C_2(x))}{M(x)}$$


  donde $C_1(x) = \frac{M(x)}{P(x)}$ y $C_2(x) = \frac{M(x)}{Q(x)}$ son los factores de amplificación polinomiales.


  ### Desglose de la fórmula

  - $M(x)$: Denominador común óptimo determinado mediante el mínimo común múltiplo.

  - $-(B(x) \cdot C_2(x))$: Resta del segundo numerador amplificado completo protegido por paréntesis.


  ### Síntesis didáctica

  Restar fracciones heterogéneas combina la homogeneización previa mediante m.c.m. con la correcta distribución del signo
  negativo en el sustraendo amplificado.

  '
definiciones_clave: '- **Sustracción homogeneizada**: Operación de resta donde ambas fracciones comparten el mismo denominador
  m.c.m.

  - **Amplificación de sustraendo**: Producto $B(x) \cdot C_2(x)$ que debe restarse completamente del primer numerador.

  '
propiedades_relaciones: '- **Cuidado con el signo negativo**: El signo menos antecede a TODO el producto del segundo numerador
  por su factor de amplificación.

  - **Dominio**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid P(x) \neq 0 \land Q(x) \neq 0\}$.

  '
ejemplo_guiado:
  enunciado: Resta las fracciones de distinto denominador $\frac{4}{x - 1} - \frac{2}{x + 3}$, expresa el resultado sobre
    el denominador común $(x - 1)(x + 3)$ y evalúa para $x = 2$.
  pasos:
  - 'Paso 1: Denominador común m.c.m. entre $(x - 1)$ y $(x + 3)$: $(x - 1)(x + 3)$.'
  - 'Paso 2: Amplificar numeradores: primer numerador por $(x + 3)$, segundo por $(x - 1)$.'
  - 'Paso 3: Escribir la resta protegiendo el segundo numerador: $\frac{4(x + 3) - (2(x - 1))}{(x - 1)(x + 3)}$.'
  - 'Paso 4: Expandir y distribuir signos: $4x + 12 - (2x - 2) = 4x + 12 - 2x + 2 = 2x + 14$.'
  - 'Paso 5: Escribir la fracción resta final: $\frac{2x + 14}{(x - 1)(x + 3)}$ para $x \notin \{1, -3\}$.'
  - 'Paso 6: Evaluar para $x = 2$: $\frac{2(2) + 14}{(2 - 1)(2 + 3)} = \frac{4 + 14}{1 \cdot 5} = \frac{18}{5}$.'
  imagen: /static/img/nodos/sustraccion-de-fracciones-algebraicas-de-distinto-denominador-ejemplos.svg
