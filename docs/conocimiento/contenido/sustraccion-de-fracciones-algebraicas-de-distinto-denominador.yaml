semantic_id: MAT.ALG.FRACCIONES_RESTA.DISTINTO_DENOMINADOR
resumen_inicial: 'Sustracción de fracciones algebraicas de distinto denominador: concepto,
  reglas operativas y simplificación en Sustracción de fracciones algebraicas.'
explicacion_simple: Al igual que con la suma, si los pisos son distintos, tienes prohibido
  restar. Debes nivelar el terreno amplificando las fracciones primero.
explicacion_formal: '### Definición formal


  Sin común denominador, no se puede hacer la operación de resta.


  ### Desarrollo didáctico


  Restar fracciones con denominadores distintos te obliga a seguir la misma ruta ceremonial
  que la suma: Factorizar, encontrar el MCM, amplificar y unir los numeradores.


  Supongamos: $\frac{2}{x-1} - \frac{1}{x+1}$.

  1. Denominador común (MCM): $(x-1)(x+1)$.

  2. A la primera fracción le falta $(x+1)$ abajo. Multiplicamos su techo por eso:
  $2(x+1)$.

  3. A la segunda fracción le falta $(x-1)$ abajo. Multiplicamos su techo por eso:
  $1(x-1)$.

  4. Juntamos con la resta en medio: $\frac{2(x+1) - 1(x-1)}{(x-1)(x+1)}$.


  Aquí es donde la resta se pone agresiva: ese menos en medio va a afectar los signos
  del segundo bloque. Debes desarrollar con sumo cuidado.'
definiciones_clave: '- **Sustracción de fracciones algebraicas de distinto denominador**:
  Procedimiento o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
