procedimiento:
- 'Paso 1: Determinar el m.c.m. de los denominadores de las fracciones a restar.'
- 'Paso 2: Calcular el factor de amplificación de cada fracción dividiendo el m.c.m. entre su denominador original.'
- 'Paso 3: Multiplicar cada numerador por su factor de amplificación correspondiente.'
- 'Paso 4: Colocar el primer numerador amplificado menos el segundo numerador amplificado encerrado entre paréntesis.'
- 'Paso 5: Distribuir el signo menos en el segundo paréntesis y reducir términos semejantes sobre el m.c.m.'
errores_correccion: '- **Error 1:** Restar directamente los numeradores sin amplificar por el m.c.m. (escribir $\frac{A}{P}
  - \frac{B}{Q} = \frac{A-B}{P \cdot Q}$). **Cómo corregirlo:** Se deben **AMPLIFICAR AMBOS NUMERADORES MULTIPLICÁNDOLOS POR
  SUS FACTORES DE HOMOGENEIZACIÓN**.

  - **Error 2:** Omitir la inversión del signo del término independiente al distribuir el menos en el sustraendo amplificado.
  **Cómo corregirlo:** El signo negativo de la sustracción **CAMBIA TODOS LOS SIGNOS DEL PRODUCTO AMPLIFICADO DEL SEGUNDO
  NUMERADOR**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la resta de $\frac{1}{x} - \frac{1}{y}$ expresada sobre el denominador $xy$?
  alternativas:
  - $\frac{y - x}{xy}$
  - $\frac{x - y}{xy}$
  - $\frac{0}{xy}$
  respuesta: $\frac{y - x}{xy}$
  solucion_pasos:
  - '1. Denominador común: $xy$.'
  - '2. Amplificar: $1 \cdot y - 1 \cdot x = y - x$.'
  - '3. Resultado: $\frac{y - x}{xy}$.'
- titulo: Ejemplo 2
  enunciado: Al restar $\frac{2}{x-1} - \frac{1}{x+1}$, ¿cuál es el numerador reducido resultante?
  alternativas:
  - $x + 3$
  - $x + 1$
  - $x - 3$
  respuesta: $x + 3$
  solucion_pasos:
  - '1. Numerador: $2(x+1) - 1(x-1) = 2x + 2 - x + 1$.'
  - '2. Reducir: $2x - x = x$ y $2 + 1 = 3 \implies x + 3$.'
- titulo: Importancia del m.c.m. en la resta
  enunciado: ¿El m.c.m. de denominadores simplifica la cantidad de términos al sustraer fracciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, evita trabajar con expresiones de grados innecesariamente elevados.
- titulo: Resta directa sin homogeneizar
  enunciado: ¿Es válido restar los numeradores directamente cuando los denominadores son distintos?
  respuesta: 'No'
  solucion_pasos:
  - No, genera una equivalencia errónea en la fracción.
errores_frecuentes:
- Al restar fracciones heterogéneas $\frac{a}{b} - \frac{c}{d}$, el resultado directo es $\frac{a-c}{b-d}$.
- En la resta $\frac{4}{x-1} - \frac{2}{x+3}$, la amplificación del sustraendo por $(x-1)$ prescinde del paréntesis dando
  $4x+12-2x-2$.
- Al restar $\frac{1}{x} - \frac{1}{y}$, el numerador homogeneizado es $x-y$.
- La resta $\frac{A}{B} - \frac{C}{D}$ equivale al producto de fracciones $\frac{A-C}{B \cdot D}$.
- En la sustracción de distinto denominador, la resta de denominadores $P(x) - Q(x)$ constituye el denominador común.
afirmaciones_verdaderas:
- La sustracción de fracciones heterogéneas requiere homogeneizar denominadores previa distribución del signo negativo.
- El producto amplificado del segundo numerador debe ser restado en su totalidad del primer numerador.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/sustraccion-de-fracciones-algebraicas-de-distinto-denominador-resumen.svg)


  QUÉ: Restar fracciones algebraicas de distinto denominador.

  CÓMO: Homogeneizar denominadores calculando el m.c.m., amplificar numeradores, escribir el sustraendo amplificado entre
  paréntesis para distribuir el signo negativo ($\frac{A \cdot C_1 - (B \cdot C_2)}{M(x)}$) y reducir los términos semejantes.

  '
