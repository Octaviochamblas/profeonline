procedimiento:
- 'Paso 1: Encuentra el denominador común.'
- 'Paso 2: Amplifica el primer numerador.'
- 'Paso 3: Amplifica el segundo numerador.'
- 'Paso 4: Pon el signo menos entre ellos (si el segundo numerador tiene varios términos,
  ponlo entre paréntesis).'
- 'Paso 5: Reduce y simplifica si es posible.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en sustracción de fracciones algebraicas de distinto denominador.
ejemplos:
- titulo: Resta $\frac{3}{a} - \frac{5}{b}$
  enunciado: Resta $\frac{3}{a} - \frac{5}{b}$.
  solucion_pasos:
  - 'Común denominador: $ab$.'
  - 'Primer num: $3 \cdot b = 3b$.'
  - 'Segundo num: $5 \cdot a = 5a$.'
  - 'Resultado: $\frac{3b - 5a}{ab}$.'
- titulo: Calcula $1 - \frac{1}{x}$.
  solucion_pasos:
  - El 1 es 1/1. MCM es x. Queda x/x - 1/x = (x-1)/x.
- titulo: 'Respecto de «Sustracción de fracciones algebraicas de distinto denominador»:
    ¿Es correcta es'
  enunciado: 'Respecto de «Sustracción de fracciones algebraicas de distinto denominador»:
    ¿Es correcta esta caracterización? «Para restar fracciones de distinto denominador,
    halla el común denominador, amplifica los numeradores (multiplicando por lo que
    faltaba al denominador original), y procede con la resta usando paréntesis»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para restar fracciones de distinto
    denominador, halla el común denominador, amplifica los numeradores (multiplicando
    por lo que faltaba al denominador original), y procede con la resta usando paréntesis.'
- titulo: 'Respecto de «Sustracción de fracciones algebraicas de distinto denominador»:
    ¿Es válida esta'
  enunciado: 'Respecto de «Sustracción de fracciones algebraicas de distinto denominador»:
    ¿Es válida esta afirmación? «Restar los denominadores entre sí»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para restar fracciones de distinto
    denominador, halla el común denominador, amplifica los numeradores (multiplicando
    por lo que faltaba al denominador original), y procede con la resta usando paréntesis.'
errores_frecuentes:
- Restar los denominadores entre sí.
- Restar A - C.
- Restar B - D.
- Para «El primer paso indispensable para restar $\frac{A}{B} - \frac{C}{D}$ cuando
  B y D son distintos es:», la respuesta correcta es Invertir C/D.
- $\frac{1}{a-a^2}$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando sustracción
  de fracciones algebraicas de distinto denominador.
