semantic_id: MAT.ALG.FRACCIONES_RESTA.DISTINTO_DENOMINADOR
resumen_inicial: Para restar fracciones algebraicas de distinto denominador, se deben
  homogeneizar al m.c.m. común y restar los numeradores amplificados.
explicacion_simple: 'Cuando los denominadores son diferentes, debemos homogeneizarlos
  antes de restar.

  Buscamos el denominador común (m.c.m.) y calculamos por cuánto debemos amplificar
  cada numerador.

  Luego, al escribir la resta de los numeradores amplificados sobre el denominador
  común, debemos aplicar paréntesis al segundo término para distribuir correctamente
  el signo menos.'
explicacion_formal: 'Dadas dos fracciones algebraicas $\frac{A(x)}{P(x)}$ y $\frac{B(x)}{Q(x)}$
  con $P(x) \neq 0$ y $Q(x) \neq 0$, la **sustracción de distinto denominador** sobre
  el $\operatorname{mcm}(P, Q) = M(x)$ se expresa como:


  $$\frac{A(x)}{P(x)} - \frac{B(x)}{Q(x)} = \frac{A(x) \cdot C_1(x) - (B(x) \cdot
  C_2(x))}{M(x)}$$


  donde $C_1(x) = \frac{M(x)}{P(x)}$ y $C_2(x) = \frac{M(x)}{Q(x)}$ son los factores
  de amplificación polinomiales.'
definiciones_clave: '- **Sustracción homogeneizada**: Operación de resta donde ambas
  fracciones comparten el mismo denominador m.c.m.

  - **Amplificación de sustraendo**: Producto $B(x) \cdot C_2(x)$ que debe restarse
  completamente del primer numerador.'
propiedades_relaciones: '- **Cuidado con el signo negativo**: El signo menos antecede
  a TODO el producto del segundo numerador por su factor de amplificación.

  - **Dominio**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid P(x) \neq 0 \land Q(x)
  \neq 0\}$.'
ejemplo_guiado:
  enunciado: Resta las fracciones de distinto denominador $\frac{4}{x - 1} - \frac{2}{x
    + 3}$, expresa el resultado sobre el denominador común $(x - 1)(x + 3)$ y evalúa
    para $x = 2$.
  pasos:
  - 'Paso 1: Denominador común m.c.m. entre $(x - 1)$ y $(x + 3)$: $(x - 1)(x + 3)$.Paso
    2: Amplificar numeradores: primer numerador por $(x + 3)$, segundo por $(x - 1)$.Paso
    3: Escribir la resta protegiendo el segundo numerador: $\frac{4(x + 3) - (2(x
    - 1))}{(x - 1)(x + 3)}$.Paso 4: Expandir y distribuir signos: $4x + 12 - (2x -
    2) = 4x + 12 - 2x + 2 = 2x + 14$.Paso 5: Escribir la fracción resta final: $\frac{2x
    + 14}{(x - 1)(x + 3)}$ para $x \notin \{1, -3\}$.Paso 6: Evaluar para $x = 2$:
    $\frac{2(2) + 14}{(2 - 1)(2 + 3)} = \frac{4 + 14}{1 \cdot 5} = \frac{18}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión reducida resultante de restar $\frac{4}{x - 1} -
    \frac{2}{x + 3}$?
  choices:
  - text: $\frac{2x + 14}{(x - 1)(x + 3)}$
    is_correct: true
  - text: $\frac{2x + 10}{(x - 1)(x + 3)}$
    is_correct: false
  - text: $\frac{2}{2x + 2}$
    is_correct: false
  - text: $\frac{6x + 10}{(x - 1)(x + 3)}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{2x + 14}{(x - 1)(x + 3)}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la fracción $\frac{2x + 14}{(x - 1)(x + 3)}$ para $x = 2$,
    ¿cuál es el resultado numérico?
  choices:
  - text: $\frac{18}{5}$
    is_correct: true
  - text: $\frac{14}{5}$
    is_correct: false
  - text: $\frac{18}{3}$
    is_correct: false
  - text: $\frac{9}{5}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{18}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el m.c.m. de los denominadores de las fracciones a restar.'
- 'Paso 2: Calcular el factor de amplificación de cada fracción dividiendo el m.c.m.
  entre su denominador.'
- 'Paso 3: Multiplicar cada numerador por su factor de amplificación.'
- 'Paso 4: Colocar el primer numerador amplificado menos el segundo numerador amplificado
  encerrado entre paréntesis.'
- 'Paso 5: Distribuir el signo menos en el segundo paréntesis y reducir términos semejantes
  sobre el m.c.m.'
errores_correccion: '- **Error común:** Olvidar que el signo menos (-) afecta a TODOS
  los términos del segundo numerador al expandirlo.

  - **Cómo corregirlo:** Distribuye el signo menos solo DESPUÉS de haber multiplicado
  el segundo numerador por su factor de amplificación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
fuente: Texto escolar MINEDUC — Álgebra / Fracciones Algebraicas
