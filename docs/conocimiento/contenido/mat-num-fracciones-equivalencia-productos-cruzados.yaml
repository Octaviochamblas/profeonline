semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.PRODUCTOS_CRUZADOS
resumen_inicial: El criterio de productos cruzados establece que $\frac{a}{b} = \frac{c}{d}$
  si y solo si el producto $a \cdot d$ es igual a $b \cdot c$.
explicacion_simple: La prueba de los productos cruzados es la forma más rápida de
  saber si dos fracciones son iguales. Simplemente multiplicamos el número de arriba
  de la primera por el de abajo de la segunda, y el de abajo de la primera por el
  de arriba de la segunda; si ambos resultados son exactamente iguales, las fracciones
  son equivalentes.
explicacion_formal: 'Para cualesquiera dos racionales $\frac{a}{b}, \frac{c}{d} \in
  \mathbb{Q}$ con $b, d \neq 0$, la **Propiedad Fundamental de la Proporcionalidad**
  establece la equivalencia lógica:


  $$\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$$


  **Desglose de la fórmula:**

  - $a \cdot d$: Producto del numerador extremo por el denominador extremo.

  - $b \cdot c$: Producto de los medios.

  - Criterio de decisión: Igualdad estricta de los productos cruzados enteros.


  > **Complemento didáctico:** Este método evita tener que convertir las fracciones
  a decimales o buscar denominadores comunes.'
definiciones_clave: '- **Criterio de productos cruzados**: Verificación de igualdad
  mediante la multiplicación cruzada $a \cdot d = b \cdot c$.'
propiedades_relaciones: '- **Criterio de orden por productos cruzados**: $\frac{a}{b}
  < \frac{c}{d} \iff a \cdot d < b \cdot c$ (para denominadores positivos).'
ejemplo_guiado:
  enunciado: Verifique mediante productos cruzados si la relación de equivalencia
    $\frac{4}{7} = \frac{12}{21}$ es verdadera.
  pasos:
  - 'Paso 1: Identificar el primer producto cruzado (extremos): $4 \cdot 21 = 84$.'
  - 'Paso 2: Identificar el segundo producto cruzado (medios): $7 \cdot 12 = 84$.'
  - 'Paso 3: Comparar ambos resultados enteros: $84 = 84$.'
  - 'Conclusión: Como $84 = 84$, la igualdad de fracciones $\frac{4}{7} = \frac{12}{21}$
    es verdaderamente cierta.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar la prueba de productos cruzados sobre
    las fracciones a/b y c/d?
  choices:
  - text: Comprobar si el producto a · d es exactamente igual al producto b · c
    is_correct: true
  - text: Comprobar si a + d = b + c
    is_correct: false
  - text: Dividir a entre c y b entre d
    is_correct: false
  - text: Multiplicar a · b y c · d
    is_correct: false
  explanation: La alternativa correcta es 'Comprobar si el producto a · d es exactamente
    igual al producto b · c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre 4/7 y 12/21, ¿cuál fue el valor común del producto
    cruzado?
  choices:
  - text: '84'
    is_correct: true
  - text: '28'
    is_correct: false
  - text: '147'
    is_correct: false
  - text: '48'
    is_correct: false
  explanation: La alternativa correcta es '84'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar el numerador $a$ por el denominador $d$ obteniendo el producto
  $P_1 = a \cdot d$.'
- 'Paso 2: Multiplicar el denominador $b$ por el numerador $c$ obteniendo el producto
  $P_2 = b \cdot c$.'
- 'Paso 3: Comprobar la igualdad $P_1 = P_2$ para dictaminar si las fracciones son
  equivalentes.'
errores_correccion: '- **Error 1: Multiplicar en paralelo en lugar de en cruz ($a
  \cdot c$ y $b \cdot d$).** **Cómo corregirlo:** Los productos deben ser estrictamente
  CRUZADOS ($a \cdot d$ y $b \cdot c$).


  - **Error 2: Sumar en cruz en lugar de multiplicar.** **Cómo corregirlo:** La prueba
  exige la MULTIPLICACIÓN entero a entero ($a \cdot d = b \cdot c$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Compruebe si 5/6 y 15/18 son equivalentes mediante productos cruzados.
  alternativas:
  - Sí, porque 5 · 18 = 90 y 6 · 15 = 90
  - No, da 30 y 90
  - No son equivalentes
  respuesta: Sí, porque 5 · 18 = 90 y 6 · 15 = 90
  solucion_pasos:
  - $5 \cdot 18 = 90$ y $6 \cdot 15 = 90$. Son equivalentes.
- titulo: Ejemplo 2
  enunciado: Al probar 2/5 y 3/7, ¿cuáles son los productos cruzados?
  alternativas:
  - 14 y 15 (no son equivalentes)
  - 6 y 35
  - 10 y 21
  respuesta: 14 y 15 (no son equivalentes)
  solucion_pasos:
  - $2 \cdot 7 = 14$ y $5 \cdot 3 = 15$. Como $14 \neq 15$, no son equivalentes.
- titulo: ¿Permite la regla de productos cruzados averiguar una incógnita x en la
    igualdad a/b = x/d?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $x = (a \cdot d) / b$.
- titulo: ¿Son equivalentes 3/4 y 9/12 por productos cruzados?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot 12 = 36$ y $4 \cdot 9 = 36$.
errores_frecuentes:
- La prueba de productos cruzados consiste en sumar en cruz los términos de dos fracciones.
- Multiplicar en paralelo el numerador con el numerador es el método correcto de los
  productos cruzados.
- Si los productos cruzados son distintos se concluye que las fracciones representan
  el mismo valor.
- La regla de productos cruzados requiere convertir previamente las fracciones a números
  mixtos.
- Multiplicar los denominadores entre sí entrega el resultado directo del producto
  cruzado.
afirmaciones_verdaderas:
- Dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ son equivalentes si y solo si su producto
  cruzado cumple $a \cdot d = b \cdot c$.
- La prueba de productos cruzados permite verificar la equivalencia de fracciones
  trabajando exclusivamente con números enteros.
al_terminar_debes_poder: Al terminar serás capaz de verificar la equivalencia entre
  cualquier par de fracciones mediante el método de productos cruzados ($a \cdot d
  = b \cdot c$).
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
