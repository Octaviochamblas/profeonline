semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.PRODUCTOS_CRUZADOS
resumen_inicial: "La regla de productos cruzados permite verificar si dos fracciones son equivalentes multiplicando el numerador de una por el denominador de la otra y comparando los resultados."
explicacion_simple: |
  ¿Cómo sabes si dos fracciones como $\frac{3}{4}$ y $\frac{9}{12}$ son iguales sin tener que dibujarlas ni simplificarlas? Usas el truco del **producto cruzado**: multiplicas en diagonal. Multiplicas el número de arriba a la izquierda ($3$) por el de abajo a la derecha ($12$), que da $36$. Luego multiplicas el de abajo a la izquierda ($4$) por el de arriba a la derecha ($9$), que también da $36$. Como ambas multiplicaciones dieron exactamente $36$, ¡sabes con total certeza que son equivalentes!
explicacion_formal: |
  Formalmente, el **criterio de productos cruzados** establece que para cualesquiera dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con $b, d \in \mathbb{Z} \setminus \{0\}$:
  $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$

  Demostración: al homogenizar ambas fracciones a un denominador común $b \cdot d$ mediante amplificación, se tiene:
  $\frac{a}{b} = \frac{a \cdot d}{b \cdot d} \quad \text{y} \quad$ \frac{c}{d}$ = \frac{c \cdot b}{d \cdot b} = \frac{b \cdot c}{b \cdot d}$
  Dado que los denominadores $b \cdot d$ son idénticos, las fracciones son iguales si y solo si sus numeradores son iguales: $a \cdot d = b \cdot c$.
definiciones_clave: |
  - **Productos cruzados**: Multiplicación diagonal $a \cdot d$ y $b \cdot c$ entre dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$.
  - **Criterio de equivalencia**: Demostración de igualdad $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$.
  - **Homogenización cruzada**: Justificación basada en igualar denominadores a $b \cdot d$.
propiedades_relaciones: |
  - **Detección de desigualdad**: Si $a \cdot d \neq b \cdot c$, las fracciones no son equivalentes. Además, si $a \cdot d > b \cdot c$ (con $b, d > 0$), entonces $\frac{a}{b} > \frac{c}{d}$.
  - **Cálculo de incógnitas**: Permite despejar un término desconocido en una proporción $\frac{a}{b} = \frac{x}{d} \implies x = \frac{a \cdot d}{b}$.
  - **Independencia de la escala**: Funciona con números enteros positivos, negativos o cero (con denominadores no nulos).
ejemplo_guiado:
  enunciado: "Determina si las fracciones $\\frac{7}{12}$ y $\\frac{21}{36}$ son equivalentes mediante productos cruzados y averigua qué valor debe tener $x$ para que $\\frac{5}{8} = \\frac{x}{24}$."
  pasos:
    - 'Verificar equivalencia entre $\frac{7}{12}$ y $\frac{21}{36}$: calcular $7 \cdot 36$ y $12 \cdot 21$.'
    - 'Calcular productos: $7 \cdot 36 = 252$ y $12 \cdot 21 = 252$.'
    - 'Concluir: como $252 = 252$, $\frac{7}{12} = \frac{21}{36}$ son equivalentes.'
    - 'Despejar $x$ en $\frac{5}{8} = \frac{x}{24}$: aplicar productos cruzados $5 \cdot 24 = 8 \cdot x \implies 120 = 8x$.'
    - 'Resolver para $x$: $x = \frac{120}{8} = 15$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué funciona matemáticamente la regla de los productos cruzados $a \\cdot d = b \\cdot c$ para verificar si $\\frac{a}{b} = \\frac{c}{d}$?"
    choices:
      - {text: "Porque equivale a llevar ambas fracciones a un denominador común $b \\cdot d$ y comparar directamente sus numeradores.", is_correct: true}
      - {text: "Porque la suma de los denominadores siempre debe ser igual a cero.", is_correct: false}
      - {text: "Porque elimina los numeradores dejando solo los números enteros.", is_correct: false}
      - {text: "Porque multiplica la fracción por cero.", is_correct: false}
    explanation: "La correcta es Porque equivale a llevar ambas fracciones a un denominador común $b \\cdot d$ y comparar directamente sus numeradores.: al igualar denominadores a $b \\cdot d$, las fracciones se comparan igualando $a \\cdot d$ con $b \\cdot c$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Usando productos cruzados, determina el valor de $k$ para que las fracciones $\\frac{6}{11}$ y $\\frac{k}{33}$ sean equivalentes."
    choices:
      - {text: "18", is_correct: true}
      - {text: "22", is_correct: false}
      - {text: "12", is_correct: false}
      - {text: "30", is_correct: false}
    explanation: 'La correcta es 18: aplicamos productos cruzados $6 \cdot 33 = 11 \cdot k \implies 198 = 11k \implies k = 18$.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Disponer las dos fracciones frente a frente: $\frac{a}{b}$ y $\frac{c}{d}$.'
  - 'Paso 2: Multiplicar en diagonal el primer numerador por el segundo denominador ($a \cdot d$).'
  - 'Paso 3: Multiplicar en diagonal el primer denominador por el segundo numerador ($b \cdot c$).'
  - 'Paso 4: Comparar ambos resultados: si son iguales, las fracciones son equivalentes.'
errores_correccion: |
  Un error típico es multiplicar de manera horizontal (numerador con numerador y denominador con denominador) en lugar de multiplicar en cruz o diagonal. La regla exige siempre **multiplicación diagonal**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Son las fracciones $\\frac{5}{6}$ y $\\frac{25}{30}$ equivalentes?"
    alternativas:
      - 'Sí, porque $5 \cdot 30 = 150$ y $6 \cdot 25 = 150$.'
      - 'No, porque $5 \cdot 25 = 125$.'
      - 'No, porque $6 \cdot 30 = 180$.'
    respuesta: "Sí, porque $5 \\cdot 30 = 150$ y $6 \\cdot 25 = 150$."
    solucion_pasos:
      - 'Multiplicamos $5 \cdot 30 = 150$.'
      - 'Multiplicamos $6 \cdot 25 = 150$.'
      - "Como $150 = 150$, confirmamos que son equivalentes."
  - titulo: "Ejemplo 2"
    enunciado: "¿Son las fracciones $\\frac{3}{8}$ y $\\frac{4}{10}$ equivalentes?"
    alternativas:
      - 'No, porque $3 \cdot 10 = 30$ y $8 \cdot 4 = 32$, y $30 \neq 32$.'
      - "Sí, porque la diferencia entre numeradores es 1."
      - "Sí, porque ambas son fracciones propias."
    respuesta: "No, porque $3 \\cdot 10 = 30$ y $8 \\cdot 4 = 32$, y $30 \\neq 32$."
    solucion_pasos:
      - 'Primer producto cruzado: $3 \cdot 10 = 30$.'
      - 'Segundo producto cruzado: $8 \cdot 4 = 32$.'
      - 'Como $30 \neq 32$, las fracciones no son equivalentes.'
  - titulo: "¿Se puede usar la regla de productos cruzados para encontrar un término desconocido en una proporción fraccionaria?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, permite formar una ecuación lineal $a \cdot d = b \cdot x$ y despejar $x$ fácilmente.'
  - titulo: "¿Si el producto cruzado $a \\cdot d$ resulta mayor que $b \\cdot c$, la fracción $\\frac{a}{b}$ es mayor que $\\frac{c}{d}$ (para denominadores positivos)?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, los productos cruzados también sirven para comparar qué fracción es mayor."
errores_frecuentes:
  - "Multiplicar horizontalmente en lugar de multiplicar en diagonal."
  - "Sumar en cruz en lugar de multiplicar."
  - "Confundir el orden de los términos al despejar una incógnita en una proporción."
  - "Olvidar que los denominadores deben ser distintos de cero."
  - "Asumir equivalencia sin verificar la igualdad exacta de los productos."
afirmaciones_verdaderas:
  - 'La regla de productos cruzados establece que $\frac{a}{b} = \frac{c}{d}$ si y solo si $a \cdot d = b \cdot c$.'
  - "Los productos cruzados permiten comprobar la equivalencia de dos fracciones sin necesidad de simplificarlas ni llevarlas a decimal."
al_terminar_debes_poder: |
  Debes ser capaz de aplicar la regla de productos cruzados para verificar equivalencias y resolver ecuaciones con términos fraccionarios desconocidos.
