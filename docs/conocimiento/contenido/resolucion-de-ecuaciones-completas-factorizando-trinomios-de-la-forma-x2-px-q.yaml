semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_SIMPLE
resumen_inicial: Resolver $x^2 + p x + q = 0$ factorizando consiste en hallar dos
  números $m$ y $n$ que sumados den $p$ y multiplicados den $q$, para escribir $(x
  + m)(x + n) = 0$.
explicacion_simple: "Para resolver una **ecuación completa con $a = 1$ ($x^2 + p x\
  \ + q = 0$)** por factorización:\n1. Buscamos dos números $m$ y $n$ que cumplan\
  \ dos condiciones al mismo tiempo:\n   - Su suma sea igual al coeficiente central\
  \ $p$ ($m + n = p$).\n   - Su producto sea igual al número independiente $q$ ($m\
  \ \\cdot n = q$).\n2. Escribimos la ecuación factorizada como $(x + m)(x + n) =\
  \ 0$.\n3. Aplicamos el producto nulo para hallar las raíces: $x_1 = -m$ y $x_2 =\
  \ -n$.\n- Ejemplo: $x^2 - 5x + 6 = 0 \\implies$ buscamos números que sumen $-5$\
  \ y multipliquen $6 \\implies (-2)$ y $(-3)$.\n- Factorización: $(x - 2)(x - 3)\
  \ = 0 \\implies x_1 = 2$ y $x_2 = 3$."
explicacion_formal: 'El **método de descomposición de trinomios mónicos** $x^2 + p
  x + q = 0$ se fundamenta en la identidad de Vieta directa:


  $$x^2 + (m + n)x + (m \cdot n) = (x + m)(x + n) = 0 \implies \begin{cases} x_1 =
  -m \\ x_2 = -n \end{cases}$$


  **Desglose de la fórmula:**

  - Factorización bi-lineal mónica rápida reducida a la búsqueda de divisores enteros
  pares del término independiente $q$.'
definiciones_clave: '- **Trinomio mónico ($a = 1$)**: Polinomio cuadrático cuya potencia
  máxima $x^2$ posee coeficiente implícito 1.'
propiedades_relaciones: '- **Regla de signos de multiplicación**: Si $q > 0$, $m$
  y $n$ tienen el mismo signo (igual al de $p$). Si $q < 0$, $m$ y $n$ tienen signos
  opuestos.'
ejemplo_guiado:
  enunciado: Resuelve por factorización de trinomio la ecuación cuadrática $x^2 +
    2x - 15 = 0$.
  pasos:
  - 'Paso 1: Identificar $p = 2$ (suma) y $q = -15$ (producto).Paso 2: Buscar dos
    números que multiplicados den $-15$ y sumados den $+2$: los números son $+5$ y
    $-3$ (pues $5 \cdot (-3) = -15$ y $5 + (-3) = 2$).Paso 3: Escribir la factorización
    de trinomio: $(x + 5)(x - 3) = 0$.Paso 4: Aplicar producto nulo: $x + 5 = 0 \implies
    x_1 = -5$ y $x - 3 = 0 \implies x_2 = 3$.Paso 5: Concluir que el conjunto solución
    es $S = \{-5, 3\}$.'
