semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_SIMPLE
resumen_inicial: La resolución de trinomios cuadráticos mónicos $x^2 + px + q = 0$ consiste en encontrar dos números $u$ y $v$ tales que su suma sea $u + v = p$ y su producto sea $u \cdot v = q$, factorizando como $(x + u)(x + v) = 0$ con raíces $x_1 = -u$ y $x_2 = -v$.
explicacion_simple: "![La resolución de trinomios cuadráticos mónicos $x^2 + px + q = 0$ consiste en encontrar dos números $u$ y $v$ tales que su suma sea $u + v = p$ y su producto sea $u \\cdot v = q$, factorizando como $(x + u)(x + v) = 0$ con raíces $x_1 = -u$ y $x_2 = -v$](/static/img/nodos/resolucion-de-ecuaciones-completas-factorizando-trinomios-de-la-forma-x2-px-q-intro.svg)\n\n\nCuando tienes una ecuación cuadrática completa donde $x^2$ no tiene número adelante ($a = 1$):\n$$x^2 + px + q = 0$$\n\n**El truco de los dos números:**\n1. Busca dos números $u$ y $v$ que cumplan dos condiciones a la vez:\n   - **Multiplicados** deben dar el número del final ($u \\cdot v = q$).\n   - **Sumados** deben dar el número del medio ($u + v = p$).\n2. Escribes los paréntesis: **$(x + u)(x + v) = 0$**.\n3. **Las soluciones son los números con signo cambiado:**\n   - $x_1 = -u$\n   - $x_2 = -v$\n\n*Ejemplo:* En $x^2 + 5x + 6 = 0$, los números son $2$ y $3$ ($2 \\cdot 3 = 6$ y $2 + 3 = 5$). Factorizas\
  \ $(x + 2)(x + 3) = 0 \\implies x_1 = -2, x_2 = -3$."
explicacion_formal: 'Dada la ecuación cuadrática normalizada mónic $x^2 + px + q = 0$ con $p, q \in \mathbb{R}$:


  **Identidad de Vieta para factorización binómica**:

  $$(x + u)(x + v) = x^2 + (u + v)x + (u \cdot v)$$


  Igualando coeficientes término a término:

  $$\begin{cases} u + v = p \\ u \cdot v = q \end{cases}$$


  **Aplicación del producto nulo**:

  $$(x + u)(x + v) = 0 \Longleftrightarrow x + u = 0 \quad \lor \quad x + v = 0$$

  $$x_1 = -u, \quad x_2 = -v$$


  **Regla de signos de los números $u$ y $v$ según el signo de $q$ y $p$**:

  - **Si $q > 0$**: $u$ y $v$ tienen el **mismo signo** (ambos positivos si $p > 0$; ambos negativos si $p < 0$).

  - **Si $q < 0$**: $u$ y $v$ tienen **signos contrarios** (el de mayor valor absoluto lleva el signo de $p$).'
definiciones_clave: '- **Trinomio mónico de segundo grado**: Trinomio cuadrático con coeficiente principal unitario $a = 1$.

  - **Factores binómicos lineales**: Expresiones $(x + u)$ y $(x + v)$ cuyo producto genera el trinomio.'
propiedades_relaciones: '- **Condición de factorizabilidad sobre los enteros**: El discriminante $\Delta = p^2 - 4q$ debe ser un cuadrado perfecto en $\mathbb{Z}$.

  - **Relación con las soluciones**: Las raíces reales de la ecuación son los opuestos aditivos de los términos independientes de los factores binomios.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de trinomios cuadráticos mónicos $x^2 + px + q = 0$ consiste en encontrar dos números $u$ y $v$ tales que su suma sea $u + v = p$ y su producto sea $u \cdot v = q$, factorizando como $(x + u)(x + v) = 0$ con raíces $x_1 = -u$ y $x_2 = -v$](/static/img/nodos/resolucion-de-ecuaciones-completas-factorizando-trinomios-de-la-forma-x2-px-q-ejemplos.svg)



    Resuelve la ecuación cuadrática $x^2 - 2x - 24 = 0$ mediante factorización de trinomio mónico.'
  pasos:
  - 'Paso 1: Identificar la suma requerida $p = -2$ y el producto requerido $q = -24$.'
  - 'Paso 2: Como $q = -24 < 0$, los dos números deben tener signos contrarios y diferir en 2 unidades.'
  - 'Paso 3: Probar divisores de 24: $1 \times 24$, $2 \times 12$, $3 \times 8$, $4 \times 6$.

    - La pareja $(4, -6)$ cumple: $4 \cdot (-6) = -24$ y $4 + (-6) = -2$.'
  - 'Paso 4: Escribir la factorización: $(x + 4)(x - 6) = 0$.'
  - 'Paso 5: Aplicar la propiedad del producto cero: $x + 4 = 0 \implies x_1 = -4$ y $x - 6 = 0 \implies x_2 = 6$.'
  - 'Paso 6: Concluir el conjunto solución: $\mathcal{S} = \{-4, 6\}$.'
