procedimiento:
- 'Paso 1: Escribir la ecuación en la forma canónica $x^2 + px + q = 0$ asegurando que $a = 1$.'
- 'Paso 2: Descomponer el término independiente $q$ en pares de factores multiplicativos.'
- 'Paso 3: Seleccionar la pareja $(u, v)$ cuya suma algebraica sea igual al coeficiente lineal $p$.'
- 'Paso 4: Escribir la factorización $(x + u)(x + v) = 0$.'
- 'Paso 5: Igualar cada factor a cero para obtener las soluciones con signo opuesto: $x_1 = -u$ y $x_2 = -v$.'
errores_correccion: '- **Error común:** Dar como soluciones los números de los factores sin cambiarles el signo (ej: $(x + 3)(x - 5) = 0 \implies x = 3, x = -5$).

  - **Cómo corregirlo:** Recuerda que al **despejar** $x + 3 = 0$, el número pasa restando: **$x = -3$**, y $x - 5 = 0 \implies$ **$x = 5$**.'
ejemplos:
- titulo: 'Ejemplo 1: Trinomio con signos positivos'
  enunciado: Resuelve $x^2 + 8x + 15 = 0$.
  alternativas:
  - x = -3 y x = -5
  - x = 3 y x = 5
  - x = -3 y x = 5
  - x = 3 y x = -5
  respuesta: x = -3 y x = -5
  solucion_pasos:
  - 'Paso 1: $3 \times 5 = 15$ y $3 + 5 = 8 \implies (x + 3)(x + 5) = 0 \implies x = -3 \lor x = -5$.'
- titulo: 'Ejemplo 2: Trinomio con suma negativa y producto positivo'
  enunciado: Resuelve $x^2 - 9x + 20 = 0$.
  alternativas:
  - x = 4 y x = 5
  - x = -4 y x = -5
  - x = 4 y x = -5
  - x = -4 y x = 5
  respuesta: x = 4 y x = 5
  solucion_pasos:
  - 'Paso 1: $(-4)(-5) = 20$ y $(-4) + (-5) = -9 \implies (x - 4)(x - 5) = 0 \implies x = 4 \lor x = 5$.'
- titulo: 'Ejemplo 3: Producto negativo'
  enunciado: Resuelve $x^2 - 3x - 10 = 0$.
  alternativas:
  - x = 5 y x = -2
  - x = -5 y x = 2
  - x = 5 y x = 2
  - x = -5 y x = -2
  respuesta: x = 5 y x = -2
  solucion_pasos:
  - 'Paso 1: $(-5)(2) = -10$ y $-5 + 2 = -3 \implies (x - 5)(x + 2) = 0 \implies x = 5 \lor x = -2$.'
- titulo: 'Ejemplo 4: Cuadrado de binomio (trinomio cuadrado perfecto)'
  enunciado: Resuelve $x^2 - 12x + 36 = 0$.
  alternativas:
  - x = 6 (raíz doble)
  - x = 6 y x = -6
  - x = -6 (raíz doble)
  - Sin solución
  respuesta: x = 6 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $(x - 6)^2 = 0 \implies x = 6$ con multiplicidad dos.'
errores_frecuentes:
- No cambiar el signo de los números al despejar las raíces de los binomios.
- Confundir los signos de u y v cuando el producto es negativo.
- Intentar este método en trinomios no factorizables en los enteros.
afirmaciones_verdaderas:
- Para resolver x² + px + q = 0 se buscan dos números u y v tales que u + v = p y u · v = q.
- Las raíces de la ecuación son los números opuestos x1 = -u y x2 = -v.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones cuadráticas completas mónicas mediante factorización de trinomios x² + px + q = 0.


  **CÓMO:** Buscando la pareja de números que satisface suma p y producto q, factorizando como (x + u)(x + v) = 0 y despejando sus raíces.


