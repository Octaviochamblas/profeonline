semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_SIMPLE
resumen_inicial: La resolución por trinomio mónico $x^2 + px + q = 0$ busca dos números que multiplicados den $q$ y sumados den $px$.
explicacion_simple: |
  Para resolver ecuaciones cuadráticas mónicas (donde el término $x^2$ tiene coeficiente $1$):

  $$x^2 + px + q = 0$$

  1. Buscas dos números $m$ y $n$ que cumplan dos condiciones a la vez:
     - **Multiplicados**: $m \cdot n = q$ (término independiente).
     - **Sumados**: $m + n = p$ (coeficiente lineal).
  2. Escribes la ecuación como producto de dos binomios: $(x + m)(x + n) = 0$.
  3. Despejas las soluciones **cambiando los signos**: $x_1 = -m$ y $x_2 = -n$.
  - **Ejemplo**: $x^2 - 5x + 6 = 0 \implies$ Buscas dos números que multiplicados den $6$ y sumados den $-5$: son $-2$ y $-3$.
  - Factorización: $(x - 2)(x - 3) = 0 \implies x_1 = 2 \quad \text{y} \quad x_2 = 3$.
explicacion_formal: |
  Sea el polinomio cuadrático mónico $P(x) = x^2 + px + q$. Si $P(x)$ admite raíces reales $x_1, x_2 \in \mathbb{R}$, se cumple por las relaciones de Vieta la factorización en factores de primer grado:

  $$x^2 + px + q = (x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + (x_1 \cdot x_2) = 0$$

  **Algoritmo de búsqueda de pares:**
  Dado $q \in \mathbb{Z}$ y $p \in \mathbb{Z}$, se determina el par $(m, n)$ tal que:
  $$\begin{cases} m \cdot n = q \\ m + n = p \end{cases} \implies x^2 + px + q = (x + m)(x + n) = 0$$
definiciones_clave: |
  - **Trinomio mónico**: Polinomio de segundo grado cuyo coeficiente cuadrático principal es igual a 1 ($a = 1$).
propiedades_relaciones: |
  - **Signos de los factores**:
    - Si $q > 0$, los números $m$ y $n$ tienen el mismo signo (ambos positivos si $p > 0$, ambos negativos si $p < 0$).
    - Si $q < 0$, los números $m$ y $n$ tienen signos opuestos (el de mayor valor absoluto lleva el signo de $p$).
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática $x^2 + 2x - 15 = 0$ factorizando el trinomio mónico.'
  pasos:
    - 'Paso 1: Identificar los coeficientes: $p = 2$ y $q = -15$.'
    - 'Paso 2: Buscar dos números que multiplicados den $-15$ y sumados den $+2$: los números son $+5$ y $-3$.'
    - 'Paso 3: Escribir la expresión factorizada: $(x + 5)(x - 3) = 0$.'
    - 'Paso 4: Despejar las raíces igualando cada paréntesis a cero: $x_1 = -5$ y $x_2 = 3$. Conjunto solución $S = \{-5, 3\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condiciones deben cumplir los números $m$ y $n$ para factorizar el trinomio $x^2 + px + q$ como $(x + m)(x + n)$?'
    choices:
      - {text: 'Multiplicados deben dar $q$ ($m \cdot n = q$) y sumados deben dar $p$ ($m + n = p$).', is_correct: true}
      - {text: 'Multiplicados deben dar $p$ y sumados deben dar $q$.', is_correct: false}
      - {text: 'Ambos deben ser números primos positivos.', is_correct: false}
      - {text: 'Su resta debe ser igual a cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicados deben dar $q$ ($m \cdot n = q$) y sumados deben dar $p$ ($m + n = p$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones reales de la ecuación $x^2 - 7x + 12 = 0$?'
    choices:
      - {text: '$x_1 = 3$ y $x_2 = 4$', is_correct: true}
      - {text: '$x_1 = -3$ y $x_2 = -4$', is_correct: false}
      - {text: '$x_1 = 1$ y $x_2 = 12$', is_correct: false}
      - {text: '$x_1 = -1$ y $x_2 = -12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 3$ y $x_2 = 4$''. Al factorizar $(x-3)(x-4)=0$, las soluciones son $3$ y $4$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la ecuación en la forma reducida $x^2 + px + q = 0$.'
  - 'Paso 2: Encontrar dos números $m$ y $n$ que multiplicados resulten $q$ y sumados resulten $p$.'
  - 'Paso 3: Expresar el trinomio como el producto de dos binomios con término común: $(x + m)(x + n) = 0$.'
  - 'Paso 4: Aplicar la propiedad del producto cero para obtener las soluciones $x_1 = -m$ y $x_2 = -n$.'
errores_correccion: |
  - **Error común:** Confundir las raíces finales con los números hallados para los paréntesis (ej. hallar $+5$ y $-3$ y decir que la respuesta es $x = 5$ y $x = -3$).
  - **Cómo corregirlo:** Los números $m$ y $n$ forman los paréntesis $(x+m)(x+n)=0$; las soluciones son sus **INVERSOS ADITIVOS** $x = -m$ y $x = -n$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Trinomio con constante positiva.
    alternativas:
      - '$S = \{2, 6\}$'
      - '$S = \{-2, -6\}$'
      - '$S = \{-3, -4\}$'
    respuesta: '$S = \{2, 6\}$'
