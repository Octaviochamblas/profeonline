  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordenar e igualar la ecuación a cero en la forma $x^2 + p x + q = 0$.'
- 'Paso 2: Buscar un par de números $m, n$ tales que $m + n = p$ y $m \cdot n = q$.'
- 'Paso 3: Escribir la factorización $(x + m)(x + n) = 0$.'
- 'Paso 4: Cambiar el signo de $m$ y $n$ para dar las soluciones finales $x_1 = -m$
  y $x_2 = -n$.'
errores_correccion: '- **Error común:** Confundir los números del factor con las soluciones
  reales (decir que si la factorización es $(x+5)(x-3)=0$, las soluciones son $5$
  y $-3$).

  - **Cómo corregirlo:** La solución exige igualar a cero el factor: $x + 5 = 0 \implies
  x = -5$. Los signos de las raíces quedan SIEMPRE INVERTIDOS respecto a los números
  del paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
