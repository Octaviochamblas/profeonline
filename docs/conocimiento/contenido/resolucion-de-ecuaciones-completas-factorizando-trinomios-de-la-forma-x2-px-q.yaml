      - '$S = \{7, -2\}$'
      - '$S = \{-14, 1\}$'
    respuesta: '$S = \{-7, 2\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la factorización $(x - 5)(x + 2) = 0$, los valores $x = -5$ y $x = 2$ corresponden al conjunto solución final.'
  - 'Para factorizar $x^2 + 8x + 12 = 0$, los números elegidos deben multiplicarse para dar $8$ y sumarse para dar $12$.'
  - 'Todo trinomio cuadrático de la forma $x^2 + px + q$ puede factorizarse en números enteros cualesquiera sean $p$ y $q$.'
  - 'Si el término independiente es negativo $q = -9$, los dos números de los paréntesis deben ser negativos.'
  - 'La ecuación $x^2 + 4 = 0$ se factoriza en los números reales como $(x + 2)(x + 2) = 0$.'
afirmaciones_verdaderas:
  - 'Factorizar el trinomio mónico $x^2 + px + q = 0$ requiere hallar dos números cuyo producto sea $q$ y cuya suma sea $p$, siendo las raíces los opuestos de dichos números.'
  - 'Si la constante $q$ es positiva, los números que factorizan la ecuación poseen el mismo signo, que coincide con el signo del coeficiente $p$.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones cuadráticas mónicas $x^2 + px + q = 0$ mediante factorización de trinomios.
  CÓMO: Encontrar el par $(m, n)$ tal que $m \cdot n = q$ y $m + n = p$, construir $(x+m)(x+n)=0$ y despejar $x = -m, -n$.
