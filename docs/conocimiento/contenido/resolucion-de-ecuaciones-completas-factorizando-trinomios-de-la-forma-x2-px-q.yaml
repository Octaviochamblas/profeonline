semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_SIMPLE
resumen_inicial: 'Resolución de ecuaciones completas factorizando trinomios de la
  forma x² + px + q: concepto, discriminante, soluciones y modelamiento en Resolución
  por factorización.'
explicacion_simple: 'Cuando el coeficiente cuadrático es 1, factorizar el trinomio
  se reduce a encontrar dos números que cumplan dos condiciones simultáneas: su suma
  y su producto.'
explicacion_formal: '### Definición formal


  Dada la ecuación $x^2+px+q=0$, si existen $m,n \in \mathbb{R}$ tales que $m+n=p$
  y $m \cdot n=q$, entonces $x^2+px+q=(x+m)(x+n)$. Aplicando la propiedad del producto
  nulo, las soluciones son $x=-m$ y $x=-n$.


  ### Desarrollo didáctico


  La búsqueda de $m$ y $n$ conviene hacerla listando los pares de factores de $q$
  y verificando cuál par suma exactamente $p$.


  Para $x^2-7x+12=0$: se buscan dos números que sumen $-7$ y multipliquen $12$: son
  $-3$ y $-4$. Factorizando, $(x-3)(x-4)=0$, dando $x=3$ o $x=4$.'
definiciones_clave: '- **Resolución de ecuaciones completas factorizando trinomios
  de la forma x² + px + q**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones completas factorizando trinomios de la forma x² + px + q.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando resolución de ecuaciones
