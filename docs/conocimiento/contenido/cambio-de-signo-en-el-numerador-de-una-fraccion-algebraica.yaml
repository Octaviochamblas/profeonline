semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_NUMERADOR
resumen_inicial: El cambio de signo en el numerador de una fracción algebraica consiste en factorizar un $-1$ del polinomio
  superior, lo que equivale a invertir el signo global de la fracción completa.
explicacion_simple: "Para cambiar el signo de los términos del **numerador** de una fracción (ej: $\frac{3 - x}{x + 5}$):\n\
  - **REGLA DEL FACTOR NEGATIVO EN EL NUMERADOR**:\n  1. Extraes un factor $-1$ del numerador escribiéndolo entre paréntesis:\n\
  \     - $3 - x = -(x - 3)$.\n  2. Colocas el signo menos de dos formas válidas:\n     - **Frente a la barra de fracción\
  \ (signo global)**: $\\mathbf{-\frac{x - 3}{x + 5}}$.\n     - **O inviertes el signo del denominador**: $\\mathbf{\frac{x\
  \ - 3}{-(x + 5)}} = \\mathbf{\frac{x - 3}{-x - 5}}$.\n- **LEY FUNDAMENTAL DE LOS TRES SIGNOS**:\n  $$\\mathbf{+\frac{+A}{+B}\
  \ = -\frac{-A}{+B} = -\frac{+A}{-B} = +\frac{-A}{-B}}$$\n  - Si cambias el signo de **UN solo elemento** (numerador),\
  \ debes cambiar también el **signo global** de la fracción para no alterar su valor.\n\n![Cambio de signo en el numerador\
  \ de una fracción](/static/img/nodos/cambio-de-signo-en-el-numerador-de-una-fraccion-algebraica-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la función racional $f(x) = \frac{P(x)}{Q(x)}$ sobre $\mathbb{R}(x)$. Por la propiedad distributiva y el elemento opuesto
  del cuerpo de números reales ($-1 \cdot a = -a$), se verifica la identidad de equivalencia:


  $$f(x) = \frac{P(x)}{Q(x)} = \frac{-(-P(x))}{Q(x)} = -\frac{-P(x)}{Q(x)}$$


  ### Factorización de Opuestos en el Numerador

  Si $P(x) = b - a$, factorizar $-1$ da $P(x) = -(a - b)$. Sustituyendo en la fracción racional:


  $$\frac{b - a}{Q(x)} = \frac{-(a - b)}{Q(x)} = -\frac{a - b}{Q(x)}$$


  ### Síntesis didáctica

  Cambiar el signo a todos los términos del numerador requiere colocar un signo negativo multiplicativo frente a la barra
  principal de la fracción para mantener el valor numérico inalterado.

  '
definiciones_clave: '- **Cambio de signo en el numerador**: Extracción de un factor $-1$ del polinomio superior que transforma
  cada término en su opuesto aditivo.

  - **Ley de los tres signos**: Regla de los signos en fracciones algebraicas referente al signo del numerador, denominador
  y la barra principal.

  - **Binomio opuesto ($b - a = -(a - b)$)**: Expresión equivalente obtenida invirtiendo el orden de la resta mediante un
  factor negativo.

  '
propiedades_relaciones: '- **Conservación de la equivalencia**: Invertir los signos del numerador y el signo global simultáneamente
  preserva de forma idéntica la fracción inicial.

  '
ejemplo_guiado:
  enunciado: Transforma la fracción $\frac{2 - 5x}{x^2 + 1}$ extrayendo un signo negativo del numerador.
  pasos:
  - 'Paso 1: Observamos el numerador $P(x) = 2 - 5x$.'
  - 'Paso 2: Factorizamos $-1$ del numerador invirtiendo el signo de sus términos: $2 - 5x = -(5x - 2)$.'
  - 'Paso 3: Reemplazamos la expresión en el numerador: $\frac{-(5x - 2)}{x^2 + 1}$.'
  - 'Paso 4: Trasladamos el signo negativo al frente de la barra principal de la fracción: $-\frac{5x - 2}{x^2 + 1}$.'
  - 'Conclusión: La fracción equivalente es **$-\frac{5x - 2}{x^2 + 1}$**.'
  imagen: /static/img/nodos/cambio-de-signo-en-el-numerador-de-una-fraccion-algebraica-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al cambiar el signo del numerador en la fracción $\frac{4 - x}{x + 2}$, ¿cuál de las siguientes expresiones representa
    una fracción idénticamente equivalente?
  choices:
  - text: La expresión es $-\frac{x - 4}{x + 2}$, cambiando los signos del numerador y anteponiendo el signo menos a la fracción
    is_correct: true
  - text: La expresión es $\frac{x - 4}{x + 2}$
    is_correct: false
  - text: La expresión es $-\frac{4 - x}{x + 2}$
    is_correct: false
  - text: La expresión es $\frac{x + 4}{x + 2}$
    is_correct: false
  explanation: La alternativa correcta es 'La expresión es $-\frac{x - 4}{x + 2}$, cambiando los signos del numerador y anteponiendo
    el signo menos a la fracción'. $\frac{4-x}{B} = \frac{-(x-4)}{B} = -\frac{x-4}{B}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Si cambiamos el signo a un solo término del numerador sin cambiar el signo global de la fracción (ej: escribir
    $\frac{3 - x}{y} \to \frac{3 + x}{y}$), ¿qué ocurre con el valor de la expresión?'
  choices:
  - text: El valor de la expresión se altera completamente y deja de ser equivalente
    is_correct: true
  - text: Se mantiene equivalente
    is_correct: false
  - text: Se simplifica
    is_correct: false
  - text: Su valor se multiplica por cero
    is_correct: false
  explanation: La alternativa correcta es 'El valor de la expresión se altera completamente y deja de ser equivalente'. Cambiar
    el signo a un solo término no equivale a factorizar $-1$ de todo el polinomio.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Encerrar entre paréntesis el polinomio completo del numerador.'
- 'Paso 2: Extraer el signo menos (factor $-1$) fuera del paréntesis, cambiando el signo a CADA UNO de sus términos internos.'
- 'Paso 3: Desplazar el signo negativo extraído hacia la parte frontal de la barra de la fracción.'
- 'Paso 4: Verificar la conservación del valor de la fracción mediante la Ley de los Tres Signos.'
errores_correccion: '- **Error 1:** Cambiar el signo a un solo término del numerador en lugar de cambiarle el signo a todos
  los términos (escribir $3 - x \to -(3 - x)$ correctamente vs $3 + x$ erróneamente). **Cómo corregirlo:** Al extraer el factor
  $-1$ **SE DEBE CAMBIAR EL SIGNO DE TODOS Y CADA UNO DE LOS TÉRMINOS DEL NUMERADOR**.

  - **Error 2:** Cambiar el signo del numerador sin colocar el signo menos frente a la barra o en el denominador. **Cómo corregirlo:**
  Para mantener la equivalencia **SI CAMBIAS EL SIGNO DEL NUMERADOR DEBES COLOCAR OBLIGATORIAMENTE UN SIGNO MENOS AL FRENTE
  DE LA FRACCIÓN**.

  '
ejemplos:
- titulo: Resta simple en numerador
  enunciado: Para $\frac{1 - x}{5}$, ¿es equivalente a $-\frac{x - 1}{5}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $1-x = -(x-1)$.
- titulo: Todos los términos cambian
  enunciado: Para $\frac{-x - 2}{y}$, ¿es equivalente a $-\frac{x + 2}{y}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-x-2 = -(x+2)$.
- titulo: Cambio de signo erróneo
  enunciado: Si $2 - x$ cambia a $2 + x$, ¿se alteró la fracción?
  respuesta: Sí
  solucion_pasos:
  - Sí, no es la opuesta.
- titulo: Doble cambio de signo
  enunciado: ¿Es $\frac{-(a-b)}{c} = -\frac{a-b}{c}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley de signos.
errores_frecuentes:
- Cambiar el signo a uno solo de los términos del numerador dejando los demás intactos.
- El signo negativo frente a la barra fraccionaria no es escrito al cambiar los signos del numerador.
- Cambiar simultáneamente el signo del numerador, denominador y de la barra rompiendo la equivalencia.
- Intercambiar el opuesto de una resta $(b - a)$ con la suma $(a + b)$.
- Olvidar distribuir el signo negativo a todos los términos al ingresar un menos al numerador.
afirmaciones_verdaderas:
- Cambiar los signos de todos los términos del numerador y colocar un menos frente a la fracción conserva la equivalencia.
- El opuesto aditivo del binomio $(b - a)$ es igual a $-(a - b)$.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/cambio-de-signo-en-el-numerador-de-una-fraccion-algebraica-resumen.svg)


  QUÉ: Aplicar cambios de signo en el numerador de una fracción algebraica manteniendo su equivalencia.

  CÓMO: Factorizar $-1$ del polinomio superior ($P(x) = -(-P(x))$), transformando binomios opuestos ($b - a = -(a - b)$),
  y trasladar el signo negativo frente a la barra fraccionaria ($\frac{b-a}{Q} = -\frac{a-b}{Q}$).

  '
