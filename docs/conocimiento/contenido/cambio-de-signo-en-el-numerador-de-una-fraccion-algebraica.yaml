semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_NUMERADOR
resumen_inicial: 'Cambio de signo en el numerador de una fracción algebraica: concepto,
  reglas operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: Cuando mueves el signo negativo desde el frente de la fracción
  hacia el numerador (la parte superior), debes tener mucho cuidado si arriba hay
  un polinomio. Ese signo es un multiplicador silencioso para TODO el techo de la
  casa.
explicacion_formal: '### Definición formal


  El numerador completo está agrupado, el signo global lo afecta todo.


  ### Desarrollo didáctico


  Cuando decides asignar un signo negativo global hacia el numerador (la parte de
  arriba), debes tener un cuidado extremo si el numerador es un polinomio completo
  (tiene sumas o restas).


  El signo negativo no solo afecta al primer término que vea, sino que **afecta a
  TODOS los términos del numerador**, actuando exactamente como si hubiera un paréntesis
  invisible protegiéndolo.


  Ejemplo de lo correcto y lo incorrecto:

  Tienes la fracción: $-\frac{x - 5}{y}$

  - **INCORRECTO:** $\frac{-x - 5}{y}$ (El estudiante solo le cambió el signo a la
  ''x'' y olvidó el -5).

  - **CORRECTO:** $\frac{-(x - 5)}{y} = \frac{-x + 5}{y}$ (El menos entró al paréntesis
  y cambió los signos de todo: la ''x'' se volvió $-x$, y el $-5$ se volvió $+5$).


  Este es uno de los errores más mortales y comunes en las pruebas. Usa siempre paréntesis
  mentales.'
