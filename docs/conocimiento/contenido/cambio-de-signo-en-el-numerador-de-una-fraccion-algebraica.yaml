procedimiento:
- 'Paso 1: Imagina que todo el polinomio del numerador está entre paréntesis.'
- 'Paso 2: Si le vas a aplicar un cambio de signo, distribuye el signo menos en el
  paréntesis.'
- 'Paso 3: Cambia el signo de TODOS los términos del numerador sin excepción.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cambio de signo en el numerador de una fracción algebraica.
ejemplos:
- titulo: Convierte $-\frac{2a - b + c}{5}$ moviendo el signo al numerador
  enunciado: Convierte $-\frac{2a - b + c}{5}$ moviendo el signo al numerador.
  solucion_pasos:
  - 'El negativo afecta a todo el techo: $-(2a - b + c)$.'
  - 'Distribuimos: $-2a + b - c$.'
  - El resultado es $\frac{-2a + b - c}{5}$.
- titulo: ¿A qué es equivalente $-\frac{x+y}{z}$?
  solucion_pasos:
  - El negativo afecta a la 'x' y a la 'y' a la vez.
- titulo: 'Respecto de «Cambio de signo en el numerador de una fracción algebraica»:
    ¿Se ajusta a la de'
  enunciado: 'Respecto de «Cambio de signo en el numerador de una fracción algebraica»:
    ¿Se ajusta a la definición esta afirmación? «Si introduces un signo negativo al
    numerador, o lo pasas del frente al numerador, debes cambiarle el signo a TODOS
    y CADA UNO de los términos del polinomio superior»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si introduces un signo negativo
    al numerador, o lo pasas del frente al numerador, debes cambiarle el signo a TODOS
    y CADA UNO de los términos del polinomio superior.'
- titulo: 'Respecto de «Cambio de signo en el numerador de una fracción algebraica»:
    ¿Es compatible con'
  enunciado: 'Respecto de «Cambio de signo en el numerador de una fracción algebraica»:
    ¿Es compatible con el procedimiento esta afirmación? «Cambiar el signo solo al
    primer término del polinomio superior (el famoso error del francotirador miope)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si introduces un signo negativo
    al numerador, o lo pasas del frente al numerador, debes cambiarle el signo a TODOS
    y CADA UNO de los términos del polinomio superior.'
errores_frecuentes:
- Cambiar el signo solo al primer término del polinomio superior (el famoso error
  del francotirador miope).
- Distribuir el signo negativo tanto al numerador COMO al denominador simultáneamente
  (eso altera el valor de la fracción).
- Para «Al pasar el signo negativo global hacia el numerador, este signo debe:», la
  respuesta correcta es Afectar solo a la primera variable.
- Para «Al pasar el signo negativo global hacia el numerador, este signo debe:», la
  respuesta correcta es Eliminar el denominador.
- Para «Al pasar el signo negativo global hacia el numerador, este signo debe:», la
  respuesta correcta es Quedar flotando.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando cambio
  de signo en el numerador de una fracción algebraica.
