semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_NUMERADOR
resumen_inicial: Cambiar el signo del numerador altera el signo global de la fracción,
  requiriendo un signo negativo externo para mantener la equivalencia.
explicacion_simple: 'En una fracción, si cambiamos los signos de todos los términos
  del numerador, estamos multiplicando el numerador por -1.

  Para que el valor total de la fracción no cambie, debemos compensar esa multiplicación
  colocando un signo menos (-) fuera de la fracción.

  Esta regla de signos es muy útil para ordenar términos o preparar una expresión
  antes de factorizar.'
explicacion_formal: 'Dada una fracción algebraica $F(x) = \frac{P(x)}{Q(x)}$, si se
  multiplica el polinomio numerador por $-1$, la **equivalencia de signos** establece:


  $$\frac{-P(x)}{Q(x)} = -\frac{P(x)}{Q(x)} \quad \implies \quad \frac{P(x)}{Q(x)}
  = -\frac{-P(x)}{Q(x)}$$


  **Desglose de la fórmula:**

  - $-P(x)$: Representa el polinomio numerador con los signos de cada uno de sus términos
  invertidos.

  - $-\frac{-P(x)}{Q(x)}$: Compensa el cambio interno de signo mediante una negación
  global externa, preservando el valor de la fracción en $\mathbb{R}$.'
definiciones_clave: '- **Negación del numerador**: Multiplicación de todos los términos
  del numerador por $-1$.

  - **Compensación de signo**: Colocación de un signo negativo global para preservar
  la igualdad algebraica.'
propiedades_relaciones: '- **Inversión de resta**: Cambiar el signo a $(a - b)$ en
  el numerador da $-(b - a)$, convirtiendo la fracción en $-\frac{b - a}{Q(x)}$.

  - **Ley de signos de división**: $\frac{-A}{B} = -\frac{A}{B} = \frac{A}{-B}$.'
ejemplo_guiado:
  enunciado: Aplica el cambio de signo en el numerador de la fracción $\frac{3 - x}{x
    + 4}$ para expresarla con el término variable positivo en el numerador, y evalúa
    ambas expresiones para $x = 1$.
  pasos:
  - 'Paso 1: Multiplicar el numerador $(3 - x)$ por $-1$: $-(3 - x) = -3 + x = x -
    3$.Paso 2: Colocar el signo negativo compensatorio delante de la fracción: $\frac{3
    - x}{x + 4} = -\frac{x - 3}{x + 4}$.Paso 3: Evaluar la expresión original en $x
    = 1$: $\frac{3 - 1}{1 + 4} = \frac{2}{5}$.Paso 4: Evaluar la expresión modificada
    en $x = 1$: -\frac{1 - 3}{1 + 4} = -\frac{-2}{5} = \frac{2}{5}$ (se verifica la
    equivalencia).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a $\frac{3 - x}{x + 4}$ tras cambiar
    el signo en su numerador?
  choices:
  - text: $-\frac{x - 3}{x + 4}$
    is_correct: true
  - text: $\frac{x - 3}{x + 4}$
    is_correct: false
  - text: $-\frac{3 - x}{-(x + 4)}$
    is_correct: false
  - text: $\frac{x + 3}{x + 4}$
    is_correct: false
  explanation: La alternativa correcta es '$-\frac{x - 3}{x + 4}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar $-\frac{x - 3}{x + 4}$ para $x = 1$, ¿cuál es el resultado
    numérico obtenido?
  choices:
  - text: $\frac{2}{5}$
    is_correct: true
  - text: $-\frac{2}{5}$
    is_correct: false
  - text: $\frac{4}{5}$
    is_correct: false
  - text: $-\frac{4}{5}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{2}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el polinomio numerador $P(x)$.'
- 'Paso 2: Cambiar el signo a CADA UNO de los términos de $P(x)$ (obteniendo $-P(x)$).'
- 'Paso 3: Colocar un signo negativo frente a toda la fracción algebraica.'
- 'Paso 4: Reescribir la nueva fracción manteniéndola igual al valor de la fracción
  original.'
errores_correccion: '- **Error común:** Cambiar el signo de un solo término del numerador
  (por ejemplo convertir $3 - x$ en $3 + x$).

  - **Cómo corregirlo:** Al multiplicar por $-1$, DEBES cambiar el signo de TODOS
  los términos del numerador ($3 - x \implies -3 + x = x - 3$).'
ejemplos:
- titulo: 'Ejemplo 1: Cambio de signo con binomio simple'
  enunciado: Expresa $\frac{5 - 2x}{x^2 + 1}$ con signo negativo fuera de la fracción.
  alternativas:
  - $-\frac{2x - 5}{x^2 + 1}$
  - $\frac{2x - 5}{x^2 + 1}$
  - $-\frac{5 + 2x}{x^2 + 1}$
  respuesta: $-\frac{2x - 5}{x^2 + 1}$
  solucion_pasos:
  - '1. Numerador $5 - 2x = -(2x - 5)$.2. Expresión equivalente: $-\frac{2x - 5}{x^2
    + 1}$.'
- titulo: 'Ejemplo 2: Numerador monomio'
  enunciado: ¿A qué es equivalente $\frac{-4x}{x + 3}$?
  alternativas:
  - $-\frac{4x}{x + 3}$
  - $\frac{4x}{x + 3}$
  - $-\frac{4x}{-x - 3}$
  respuesta: $-\frac{4x}{x + 3}$
  solucion_pasos:
  - '1. Extraer el signo menos del numerador $-4x$: $-\frac{4x}{x + 3}$.'
- titulo: ¿La fracción $\frac{a - b}{c}$ es igual a $-\frac{b - a}{c}$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Invertir la resta del numerador $(a - b) = -(b - a)$ requiere colocar un signo
    menos global delante.
- titulo: ¿Cambiar los signos del numerador sin colocar un signo menos fuera de la
    fracción altera el resultado?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque equivale a multiplicar por -1 sin compensar, lo que invierte el signo
    final de la expresión.
errores_frecuentes:
- La expresión $\frac{a - b}{c}$ es equivalente a $\frac{b - a}{c}$.
- Cambiar el signo del numerador requiere cambiar también el signo del denominador.
- Al multiplicar el numerador por $-1$ solo se cambia el signo del primer término.
- El signo negativo delante de una fracción afecta únicamente al denominador.
- La expresión $-\frac{-x}{y}$ es equivalente a $-\frac{x}{y}$.
afirmaciones_verdaderas:
- Cambiar el signo de todos los términos del numerador equivale a multiplicar por
  $-1$, requiriendo un signo menos externo.
- Las expresiones $\frac{a - b}{Q(x)}$ y $-\frac{b - a}{Q(x)}$ son perfectamente equivalentes
  en todo el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar correctamente el
  cambio de signo en el numerador conservando la equivalencia de la fracción.
