procedimiento:
- 'Paso 1: Fija mentalmente las demás variables (imagina que no cambian).'
- 'Paso 2: Hazte la pregunta: ''A más de esto, ¿más o menos de la incógnita?''.'
- 'Paso 3: Si la respuesta es ''más'', anota una ''D'' (directa) sobre esa columna
  de datos.'
errores_correccion: Evita confundir los datos de entrada al operar con identificación
  de una relación directa en contexto compuesto.
ejemplos:
- titulo: Pintores, casas y pintura
  enunciado: La incógnita es 'Galones de pintura'. Las otras variables son Pintores
    y Casas. ¿Cómo es la relación Pintura-Casas?
  solucion_pasos:
  - Congelamos los Pintores (asumimos que son los mismos).
  - 'Pregunta: A más Casas, ¿necesitamos más o menos Galones de pintura?'
  - 'Respuesta: Más. Por tanto, la relación Pintura-Casas es Directa.'
errores_frecuentes:
- Preguntar 'A más de A, ¿más de B?' usando dos variables que no son la incógnita.
- No congelar la tercera variable en el experimento mental, confundiendo la deducción.
afirmaciones_verdaderas:
- La propiedad de identificación de una relación directa en contexto compuesto preserva
  la consistencia lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren identificación
