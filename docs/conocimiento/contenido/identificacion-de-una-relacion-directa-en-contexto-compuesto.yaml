procedimiento:
- 'Paso 1: Fija mentalmente las demás variables (imagina que no cambian).'
- 'Paso 2: Hazte la pregunta: ''A más de esto, ¿más o menos de la incógnita?''.'
- 'Paso 3: Si la respuesta es ''más'', anota una ''D'' (directa) sobre esa columna de datos.'
errores_correccion: Evita confundir los datos de entrada al operar con identificación de una
  relación directa en contexto compuesto.
ejemplos:
- titulo: Pintores, casas y pintura
  enunciado: La incógnita es 'Galones de pintura'. Las otras variables son Pintores y Casas.
    ¿Cómo es la relación Pintura-Casas?
  solucion_pasos:
  - Congelamos los Pintores (asumimos que son los mismos).
  - 'Pregunta: A más Casas, ¿necesitamos más o menos Galones de pintura?'
  - 'Respuesta: Más. Por tanto, la relación Pintura-Casas es Directa.'
- titulo: Ejemplo 2
  enunciado: En un problema con obreros, horas y metros construidos, ¿cómo es la relación
    entre horas trabajadas y metros construidos, a igual número de obreros?
  alternativas:
  - Directa
  - Inversa
  - No hay relación
  respuesta: Directa
  solucion_pasos:
  - A más horas trabajadas, se construyen más metros.
- titulo: Ejemplo 3
  enunciado: ¿Cuál situación describe una relación directa?
  alternativas:
  - Más entradas vendidas, más dinero recaudado
  - Más velocidad, menos tiempo de viaje
  - Más trabajadores, menos días de obra
  respuesta: Más entradas vendidas, más dinero recaudado
  solucion_pasos:
  - Ambas magnitudes aumentan juntas.
- titulo: ¿En una relación directa, ambas magnitudes aumentan o disminuyen juntas?
  respuesta: Sí
  solucion_pasos:
  - Esa es la característica que define una relación directa.
errores_frecuentes:
- Preguntar 'A más de A, ¿más de B?' usando dos variables que no son la incógnita.
- No congelar la tercera variable en el experimento mental, confundiendo la deducción.
- Comparar dos magnitudes sin fijar mentalmente las demás variables del problema.
- Confundir una relación directa con una inversa por no plantear correctamente la pregunta
  de si aumenta o disminuye.
- Asumir que todas las relaciones de un problema compuesto son del mismo tipo sin analizarlas
  una por una.
afirmaciones_verdaderas:
- La propiedad de identificación de una relación directa en contexto compuesto preserva la
  consistencia lógica.
- Para identificar una relación directa dentro de un problema compuesto, se debe fijar mentalmente
  las demás magnitudes y comparar solo dos a la vez.
al_terminar_debes_poder: Resolver problemas aplicados que involucren identificación de una
  relación directa en contexto compuesto.
