semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_DIRECTA
resumen_inicial: 'Identificación de una relación directa en contexto compuesto: concepto y
  propiedades fundamentales en Proporcionalidad compuesta.'
explicacion_simple: Cuando tienes 3 magnitudes o más, el truco es congelar todas menos dos.
  Si analizas esas dos y ambas crecen, tienes una relación directa en medio de la compuesta.
explicacion_formal: 'En el análisis de un problema compuesto, tomamos la magnitud de la incógnita
  ($X$) y la comparamos con la magnitud $A$.


  Si decimos: ''A mayor cantidad de $A$, ¿se necesitará más o menos $X$?'' y la respuesta
  es ''MÁS'' (crecen juntas), entonces la relación entre $X$ y $A$ es **directa**.


  En la resolución por el método de igualación de fracciones, la columna de la variable $A$
  se escribe exactamente en el mismo orden (arriba/abajo) en que aparecen los datos.'
definiciones_clave: '- **Identificación de una relación directa en contexto compuesto**: Elemento
  central dentro del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a identificación de una relación directa en contexto compuesto.'
ejemplo_guiado:
  enunciado: Si un camión transporta 8 toneladas por viaje, ¿cómo es la relación entre el
    número de viajes y las toneladas totales transportadas, a igual capacidad por viaje?
  pasos:
  - Congelo mentalmente la capacidad del camión, que no cambia.
  - 'Me pregunto: a más viajes, ¿se transportan más o menos toneladas en total? La respuesta
    es más.'
  - Como ambas magnitudes crecen juntas, concluyo que la relación entre viajes y toneladas
    totales es directa.
