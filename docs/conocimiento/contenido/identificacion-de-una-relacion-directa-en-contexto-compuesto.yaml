semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_DIRECTA
resumen_inicial: En un contexto compuesto, una magnitud es directamente proporcional a la incógnita si, manteniendo constantes todas las demás variables (ceteris paribus), al aumentar dicha magnitud la incógnita aumenta en el mismo factor multiplicativo.
explicacion_simple: "![Relación directa en compuesta](/static/img/nodos/identificacion-de-una-relacion-directa-en-contexto-compuesto-intro.svg)\n\nPara identificar si una magnitud auxiliar es **directa con la incógnita**:\n1. **Aplica el principio de congelar las demás variables (*ceteris paribus*)**: Imagina que todas las otras magnitudes no cambian en absoluto.\n2. **Hazte la pregunta clave:**\n   - *«Si aumento esta magnitud, ¿la incógnita también tiene que aumentar?»*\n   - Si la respuesta es **SÍ**, la relación es **DIRECTA**.\n3. **Efecto en la fórmula:** Su razón se escribe en el **orden original** $\\left(\\frac{B_1}{B_2}\\right)$ sin darla vuelta.\n- **Ejemplos comunes de relaciones directas:**\n  - Cantidad de obra vs Días de trabajo (a igual número de obreros).\n  - Personas vs Costo total de comida (a igual cantidad de días).\n  - Horas de máquina vs Consumo de combustible."
explicacion_formal: 'Sea el modelo compuesto $Y = f(X_1, X_2, \dots, X_n)$ donde $Y$ es la incógnita.


  **Definición de Magnitud Parcialmente Directa:**

  La variable $X_i$ mantiene una relación directamente proporcional con $Y$ si la derivada parcial satisface:


  $$\frac{\partial Y}{\partial X_i} = \frac{k_g \cdot \prod_{m \neq i} X_m^{\text{directas}}}{\prod X^{\text{inversas}}} > 0 \quad (\forall X > 0)$$


  lo que implica que en la ecuación de razones de estado, el factor correspondiente a $X_i$ se incorpora como razón directa homogénea:


  $$R(X_i) = \frac{X_i^{(1)}}{X_i^{(2)}}$$'
definiciones_clave: '- **Ceteris paribus**: Expresión latina que significa ''manteniendo constantes las demás variables''.

  - **Razón directa preservada**: Fracción $\frac{X_1}{X_2}$ que conserva el orden del estado inicial sobre el final.

  - **Monotonía parcial positiva**: Aumento de la variable implica aumento de la incógnita.'
propiedades_relaciones: '- **Preservación de orientación**: No requiere transformación ni inversión algebraica.

  - **Composición multiplicativa**: Se multiplica directamente en el numerador del lado derecho.'
ejemplo_guiado:
  enunciado: '![Ejemplos de relaciones directas en compuesta](/static/img/nodos/identificacion-de-una-relacion-directa-en-contexto-compuesto-ejemplos.svg)


    Analice la relación de la incógnita Costo de alojamiento ($C$) frente a Días de estadía y Número de personas, y determine la razón para una fábrica que produce unidades ($U$) frente a Máquinas disponibles.'
  pasos:
  - 'Paso 1: $C$ vs Días (a personas constantes): A más días, mayor costo $\implies$ DIRECTA (razón $\frac{D_1}{D_2}$).'
  - 'Paso 2: $C$ vs Personas (a días constantes): A más personas, mayor costo $\implies$ DIRECTA (razón $\frac{P_1}{P_2}$).'
  - 'Paso 3: $U$ vs Máquinas (a horas constantes): A más máquinas, más unidades fabricadas $\implies$ DIRECTA.'
  - 'Paso 4: Ambas magnitudes entran en la fórmula general conservando su orden original $\frac{M_1}{M_2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué regla se aplica a la fracción de una magnitud cuando se determina que es directa con la incógnita?
  choices:
  - text: Se escribe en el orden original inicial / final $\frac{B_1}{B_2}$
    is_correct: true
  - text: Se invierte la fracción a $\frac{B_2}{B_1}$
    is_correct: false
  - text: Se eleva la fracción al cuadrado
    is_correct: false
  - text: Se le suma 1 al numerador
    is_correct: false
  explanation: La alternativa correcta es 'Se escribe en el orden original inicial / final $\frac{B_1}{B_2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el número de personas es directo respecto al costo de alojamiento?
  choices:
  - text: Porque al haber más personas alojadas durante los mismos días el costo total aumenta proporcionalmente
    is_correct: true
  - text: Porque las personas pagan en efectivo
    is_correct: false
  - text: Porque el costo por persona disminuye a cero
    is_correct: false
  - text: Por una regla contable independiente de la matemática
    is_correct: false
  explanation: La alternativa correcta es 'Porque al haber más personas alojadas durante los mismos días el costo total aumenta proporcionalmente'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Suponer fijas e invariantes todas las demás magnitudes del problema.'
- 'Paso 2: Evaluar si el aumento de la magnitud evaluada produce un aumento en la magnitud incógnita.'
- 'Paso 3: Si aumentan conjuntamente, catalogar como DIRECTA y redactar su razón como $\frac{B_1}{B_2}$.'
errores_correccion: "- **Error 1: Pensar que si otra variable es inversa, esta también lo será.** **Cómo corregirlo:** Cada variable es INDEPENDIENTE y se evalúa por separado con la incógnita.\n- **Error 2: Invertir la fracción por equivocación.** **Cómo corregirlo:** Recordar: DIRECTA = SE QUEDA IGUAL ($\frac{B_1}{B_2}$)."
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un problema donde la incógnita es la cantidad de harina ($H$), ¿qué relación tiene con el número de pasteles ($P$) a hornear?
  alternativas:
  - 'Directa: a más pasteles, más harina se necesita'
  - 'Inversa: a más pasteles, menos harina'
  - No tienen relación
  respuesta: 'Directa: a más pasteles, más harina se necesita'
  solucion_pasos:
  - Manteniendo fija la receta, más pasteles requieren más harina $\implies$ DIRECTA.
- titulo: Ejemplo 2
  enunciado: Si $10$ vacas consumen $50\text{ kg}$ de pasto en $4\text{ días}$, ¿cómo es la relación entre Vacas y Kilos de pasto (incógnita)?
  alternativas:
  - Directa (razón $\frac{10}{V_2}$)
  - Inversa (razón $\frac{V_2}{10}$)
  - Constante
  respuesta: Directa (razón $\frac{10}{V_2}$)
  solucion_pasos:
  - A días constantes, más vacas comen más kilos de pasto $\implies$ DIRECTA.
- titulo: ¿Se mantiene la razón en el orden original si la magnitud es directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón directa se escribe exactamente como $B_1 / B_2$.
  alternativas:
  - texto: Sí, conserva el orden inicial sobre final sin inversión
    es_correcta: true
    retroalimentacion: ¡Correcto! Razón directa no invertida.
  - texto: No, siempre se invierten todas las razones
    es_correcta: false
    retroalimentacion: Incorrecto, solo se invierten las razones inversas.
  - texto: No, se invierte solo el denominador
    es_correcta: false
    retroalimentacion: Incorrecto, se mantiene intacta.
- titulo: ¿Requiere el análisis ceteris paribus mantener constantes las demás magnitudes?
  respuesta: Sí
  solucion_pasos:
  - Sí, aislar el par de variables es el único método riguroso para clasificar la proporcionalidad.
  alternativas:
  - texto: Sí, es el principio de aislamiento de variables
    es_correcta: true
    retroalimentacion: ¡Correcto! Ceteris paribus estricto.
  - texto: No, se deben variar todas a la vez
    es_correcta: false
    retroalimentacion: Incorrecto, variar todas confundiría los efectos individuales.
  - texto: No, se ignoran las demás magnitudes
    es_correcta: false
    retroalimentacion: Incorrecto, se consideran constantes, no inexistentes.
errores_frecuentes:
- Invertir la fracción de una magnitud directa.
- Evaluar dos variables auxiliares entre sí en lugar de evaluar contra la incógnita.
- Cambiar varias magnitudes simultáneamente en el análisis mental.
- Asumir que si una magnitud es inversa, todas las demás también lo son.
afirmaciones_verdaderas:
- Una magnitud es directa con la incógnita si al aumentar una, la otra también aumenta bajo ceteris paribus.
- La razón de una magnitud directa se incorpora como $\frac{B_1}{B_2}$ en la ecuación general.
- El análisis de cada magnitud es independiente del comportamiento de las demás.
al_terminar_debes_poder: '![Síntesis de relación directa en compuesta](/static/img/nodos/identificacion-de-una-relacion-directa-en-contexto-compuesto-resumen.svg)


  QUÉ: Identificar magnitudes directamente proporcionales respecto a una incógnita en problemas compuestos.


  CÓMO: Aplicando el análisis ceteris paribus (congelando las demás variables) e incorporando la razón no invertida $\frac{B_1}{B_2}$ en el producto de la proporción general.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
