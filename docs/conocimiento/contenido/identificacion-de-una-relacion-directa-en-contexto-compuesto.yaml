resumen_inicial: En un contexto compuesto, una magnitud es directamente proporcional
  a la variable incógnita si al aumentar dicha magnitud (manteniendo fijas las otras),
  la incógnita también aumenta en la misma proporción.
explicacion_simple: 'Para saber si una variable particular tiene relación directa
  con nuestra incógnita en un problema compuesto, nos preguntamos: si esta variable
  aumenta y dejamos todo lo demás congelado, ¿la incógnita aumenta o disminuye? Si
  aumenta, la relación es directa.'
explicacion_formal: 'Para un sistema de magnitudes $\{X, Y_1, Y_2, \dots\}$, la variable
  $Y_1$ es **Directamente Proporcional a la Incógnita $X$** si:


  $$\frac{X}{Y_1} = cst \quad \text{al mantener } Y_2, Y_3, \dots \text{ constantes}$$


  **Ubicación en el algoritmo de multiplicación de razones:**

  - Al armar la ecuación de proporciones, la razón de la magnitud directa se multiplica
  de forma idéntica (sin invertir).'
definiciones_clave: '- **Relación directa compuesta**: Incremento paralelo de la magnitud
  con la incógnita al congelar las demás variables.'
propiedades_relaciones: '- **Conservación de razón**: Se mantiene el orden $\frac{y_1}{y_2}$
  sin invertir en el algoritmo de resolución.'
ejemplo_guiado:
  enunciado: En un problema de producción (Impresoras, Horas, Hojas impresas), determine
    la relación entre Horas y Hojas.
  pasos:
  - 'Paso 1: Mantener fija la cantidad de Impresoras.'
  - 'Paso 2: Preguntar: si trabajamos más Horas, ¿imprimiremos más Hojas?'
  - 'Paso 3: Sí, a mayor cantidad de Horas, mayor producción de Hojas.'
  - 'Conclusión: La relación entre Horas e Hojas impresas es Directa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se determina si una magnitud secundaria es directamente proporcional
    a la incógnita en un contexto compuesto?
  choices:
  - text: Comprobando que al aumentar dicha magnitud (fijando las demás), la incógnita
      también aumenta
    is_correct: true
  - text: Multiplicando todas las variables por cero
    is_correct: false
  - text: Verificando que la incógnita disminuya
    is_correct: false
  - text: Restando los valores de la primera fila
    is_correct: false
  explanation: La alternativa correcta es 'Comprobando que al aumentar dicha magnitud
    (fijando las demás), la incógnita también aumenta'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para Horas e Hojas impresas, ¿por qué la relación
    es directa?
  choices:
  - text: Porque a mayor cantidad de horas trabajadas se produce una mayor cantidad
      de hojas
    is_correct: true
  - text: Porque el número de impresoras disminuye
    is_correct: false
  - text: Porque las horas y hojas son inversas
    is_correct: false
  - text: Because es una constante
    is_correct: false
  explanation: La alternativa correcta es 'Porque a mayor cantidad de horas trabajadas
    se produce una mayor cantidad de hojas'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar magnitudes directamente
  proporcionales a la incógnita dentro de un problema compuesto congelando las variables
  auxiliares.
semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_DIRECTA
procedimiento:
- 'Paso 1: Identificar la variable incógnita y comparar individualmente cada magnitud
  auxiliar con ella (fijando las demás).'
- 'Paso 2: Clasificar cada magnitud como directamente proporcional (mantener razón)
  o inversamente proporcional (invertir razón).'
- 'Paso 3: Formar la ecuación generalizada y calcular la respuesta reduciendo los
  factores multiplicativos.'
errores_correccion: '- **Error 1: Comparar las magnitudes auxiliares entre sí en lugar
  de compararlas con la variable incógnita.** **Cómo corregirlo:** La comparación
  de proporcionalidad directa o inversa se DEBE hacer siempre respecto a la columna
  de la INCÓGNITA.


  - **Error 2: No invertir la razón de las magnitudes inversas al armar la fórmula.**
  **Cómo corregirlo:** Las magnitudes inversas cambian su posición $\frac{a_1}{a_2}
  \to \frac{a_2}{a_1}$ al multiplicar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_COMPUESTA.RELACION_DIRECTA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las leyes de proporcionalidad compuesta.
- titulo: Ejemplo 2
  enunciado: Verificación de la fórmula del producto de razones.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por producto de razones.
- titulo: ¿Se invierten las razones de las magnitudes inversas en la fórmula generalizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, para compensar la variación inversamente proporcional.
- titulo: ¿Es necesario congelar las otras variables al clasificar una magnitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, para aislar el efecto puro de esa variable sobre la incógnita.
errores_frecuentes:
- Comparar dos magnitudes auxiliares entre sí en lugar de analizar su relación individual
  con la incógnita.
- Mantener sin invertir la fracción correspondiente a una magnitud de relación inversamente
  proporcional.
- Multiplicar todos los datos numéricos del problema sin distinguir su carácter directo
  o inverso.
- Omitir congelar mentalmente las demás variables al determinar si una relación es
  directa o inversa.
- Declarar que si participan más de tres variables la relación es siempre directamente
  proporcional.
afirmaciones_verdaderas:
- La proporcionalidad compuesta combina tres o más magnitudes analizando la relación
  directa o inversa de cada una con la incógnita.
- En la fórmula generalizada de resolución, la razón de una magnitud inversa se invierte
  respecto a su estado inicial.
