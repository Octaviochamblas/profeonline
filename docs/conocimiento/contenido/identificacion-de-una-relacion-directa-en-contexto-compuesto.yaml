semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_DIRECTA
resumen_inicial: 'En un problema de proporcionalidad compuesta, una magnitud mantiene una relación directa con la incógnita si, al aumentar esa magnitud (dejando las demás constantes), la incógnita también aumenta en la misma proporción.'
explicacion_simple: |
  Para saber si una variable específica en un problema complejo de tres o más magnitudes se relaciona **directamente** con la incógnita que quieres calcular, hazte esta pregunta manteniendo todo lo demás fijo: *"Si aumento esta variable, ¿la respuesta final también aumenta?"*. Si la respuesta es SÍ, entonces esa variable tiene una relación **directa**. Por ejemplo, en una fábrica, si aumentas los días de trabajo (manteniendo los obreros fijos), la cantidad de productos fabricados aumenta.
explicacion_formal: |
  ### Definición formal
  En un sistema funcional compuesto $Y = f(X_1, X_2, \dots, X_n)$, la variable independiente $X_i$ mantiene una **relación de proporcionalidad directa con la incógnita $Y$** si existe una función $g$ tal que manteniendo $X_j = c_j$ (constantes para todo $j \neq i$):
  $$Y = k_i \cdot X_i \quad \iff \quad \frac{Y}{X_i} = k_i \quad (k_i > 0)$$

  ### Regla del cociente constante aislado
  Al aislar la variable $X_i$ frente a $Y$, la razón de cambio satisface:
  $$\frac{Y^{(1)}}{X_i^{(1)}} = \frac{Y^{(2)}}{X_i^{(2)}} = k_i$$
  lo que exige colocar el factor de la razón en forma idéntica ($\frac{X_i^{(2)}}{X_i^{(1)}}$) al formular la proporción general del problema.

  ### Casos típicos de relación directa en contextos compuestos
  - **Producción vs. Tiempo**: Cantidad de bienes producidos frente a días u horas trabajadas.
  - **Costo total vs. Cantidad o Masa**: Dinero gastado frente a kilogramos comprados o metros construidos.
  - **Distancia vs. Tiempo o Velocidad**: Kilómetros recorridos frente a tiempo o velocidad.

  ### Síntesis didáctica
  - Criterio: A más $X_i \implies$ más $Y$ (con demás variables fijas).
  - Efecto algebraico: La razón $X_i$ multiplica directamente en la fórmula.
definiciones_clave: |
  - **Relación directa aislada**: Comportamiento donde la incógnita se escala en el mismo sentido multiplicativo que la variable evaluada.
  - **Factor multiplicativo directo**: Razón $\frac{X_i^{(2)}}{X_i^{(1)}}$ que actúa multiplicando a la incógnita original.
  - **Variables concurrentes directas**: Magnitudes que aumentan simultáneamente al congelar las variables secundarias.
propiedades_relaciones: |
  - **Ubicación en el denominador de la constante**: Si $X_i$ es directa a $Y$, en la constante compuesta $k = \frac{Y \cdot \text{Inversas}}{\prod X_{\text{Directas}}}$, $X_i$ se ubica en el denominador.
  - **Persistencia de linealidad**: La variación de $Y$ con respecto a $X_i$ es estrictamente lineal mientras se mantengan los demás parámetros inmóviles.
ejemplo_guiado:
  enunciado: 'En un taller, $5$ impresoras funcionando $4\text{ horas}$ al día imprimen $2.000$ folletos. Determina si la variable "horas al día" es directa o inversa respecto a la cantidad de "folletos impresos".'
  pasos:
    - 'Paso 1: Identificamos la incógnita: cantidad de folletos impresos ($Y$).'
    - 'Paso 2: Congelamos la variable secundaria: fijamos el número de impresoras en $5$.'
    - 'Paso 3: Razonamos: si las $5$ impresoras funcionan MÁS horas al día, ¿imprimirán MÁS o MENOS folletos?'
    - 'Paso 4: Como a MÁS horas diarias imprimen MÁS folletos, concluimos que la relación entre horas al día y folletos impresos es **DIRECTA**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se verifica algebraicamente que una variable $X_1$ es directamente proporcional a la incógnita $Y$ en un problema compuesto?'
    choices:
      - {text: 'Comprobando que el cociente $\frac{Y}{X_1}$ se mantiene constante al dejar fijos los demás parámetros', is_correct: true}
      - {text: 'Comprobando que el producto $Y \cdot X_1$ es constante', is_correct: false}
      - {text: 'Restando $X_1$ a la variable $Y$', is_correct: false}
      - {text: 'Sumando todas las variables del problema', is_correct: false}
    explanation: 'La alternativa correcta es ''Comprobando que el cociente $\frac{Y}{X_1}$ se mantiene constante al dejar fijos los demás parámetros''. En proporción directa el cociente es constante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $3$ camiones transportan $12\text{ toneladas}$ en $2$ viajes, ¿qué relación existe entre el número de viajes y las toneladas transportadas?'
    choices:
      - {text: 'Relación directa, porque a mayor número de viajes se transportan más toneladas (con camiones fijos)', is_correct: true}
      - {text: 'Relación inversa, porque más viajes disminuyen las toneladas', is_correct: false}
      - {text: 'No existe relación cuantitativa entre viajes y toneladas', is_correct: false}
      - {text: 'Relación cuadrática', is_correct: false}
    explanation: 'La alternativa correcta es ''Relación directa, porque a mayor número de viajes se transportan más toneladas (con camiones fijos)''. A más viajes, más toneladas transportadas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la magnitud que contiene la incógnita $Y$.'
  - 'Paso 2: Seleccionar la magnitud independiente $X_i$ que se desea evaluar.'
  - 'Paso 3: Asumir que todas las otras magnitudes independientes permanecen fijas (sin cambio).'
  - 'Paso 4: Determinar si un incremento en $X_i$ produce un incremento en $Y$. Si ocurre esto, clasificar la relación como **DIRECTA**.'
errores_correccion: |
  - **Error 1:** Clasificar una relación como inversa porque se confunde con otra variable del problema (ej: confundir obreros con días trabajados). **Cómo corregirlo:** Compara **únicamente la variable analizada contra la incógnita**, ignorando temporalmente la dinámica de las otras variables.
  - **Error 2:** Invertir la razón multiplicativa en la fórmula al armar la ecuación compuesta para una variable directa. **Cómo corregirlo:** Las variables directas entran a la ecuación en su razón normal $\frac{X_i^{(2)}}{X_i^{(1)}}$.
ejemplos:
  - titulo: 'Relación entre alimento y días'
    enunciado: 'Para un número fijo de vacas, ¿la cantidad de alimento consumido es directamente proporcional a los días?'
    alternativas:
      - 'Sí, a más días se consume más alimento'
      - 'No, es inversamente proporcional'
      - 'No hay relación'
    respuesta: 'Sí, a más días se consume más alimento'
    solucion_pasos:
      - '1. Fijamos el número de vacas.'
      - '2. MÁS días $\implies$ MÁS alimento consumido $\implies$ Relación Directa.'
  - titulo: 'Relación entre sueldo y horas trabajadas'
    enunciado: 'Manteniendo la tarifa por hora fija, ¿el sueldo cobrado es directamente proporcional a las horas trabajadas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A más horas trabajadas, mayor es el sueldo cobrado.'
  - titulo: 'Relación entre metros pintados y pintura usada'
    enunciado: 'Fijando el tipo de pared, ¿los metros cuadrados pintados son directamente proporcionales a los litros de pintura gastados?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A más metros cuadrados a pintar, se requieren más litros de pintura.'
  - titulo: 'Relación entre excavación y número de máquinas'
    enunciado: 'En un tiempo fijo de 5 días, ¿los metros de zanja excavados son directamente proporcionales al número de retroexcavadoras?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A más máquinas trabajando el mismo tiempo, se excavan más metros.'
errores_frecuentes:
  - 'Clasificar una relación directa como inversa al no mantener congeladas las demás variables.'
  - 'Invertir la fracción de la razón al armar el producto de una variable directamente proporcional.'
  - 'La relación entre dos variables independientes influye en la clasificación respecto a la incógnita.'
  - 'Sumar los valores de la variable directamente proporcional en lugar de utilizarlos como factor de razón.'
  - 'El aumento de la variable independiente produce una disminución en la salida de una proporción directa.'
afirmaciones_verdaderas:
  - 'Una magnitud es directamente proporcional a la incógnita si, al aumentar su valor (con las demás fijas), la incógnita aumenta en la misma proporción.'
  - 'En la fórmula de proporción compuesta, los factores de las magnitudes directas se multiplican respetando su razón original $\frac{X^{(2)}}{X^{(1)}}$.'
al_terminar_debes_poder: 'Identificar magnitudes directamente proporcionales en un contexto compuesto mediante el método de congelamiento de variables.'
