semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.PARAMETROS_CANONICA
resumen_inicial: 'Identificación de los parámetros a, h y k en la forma canónica:
  parábola, vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Cada uno de los tres parámetros de la forma canónica cuenta una
  parte distinta de la historia de la parábola, y confundir su lectura lleva a errores
  en cadena.
explicacion_formal: '### Definición formal


  En la forma canónica $f(x)=a(x-h)^2+k$: $a$ es el coeficiente que multiplica al
  binomio al cuadrado (determina la concavidad y la abertura), $h$ es el valor tal
  que el binomio es $(x-h)$, y $k$ es la constante aditiva final.


  ### Desarrollo didáctico


  El punto más delicado es identificar $h$ correctamente: si la expresión dentro del
  paréntesis es $(x-3)$, entonces $h=3$; pero si es $(x+3)$, hay que reescribirlo
  como $(x-(-3))$, por lo que $h=-3$.


  En $f(x)=-4(x+1)^2+7$: $a=-4$; reescribiendo $(x+1)$ como $(x-(-1))$, se obtiene
  $h=-1$; y $k=7$.'
definiciones_clave: '- **Identificación de los parámetros a, h y k en la forma canónica**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  identificación de los parámetros a, h y k en la forma canónica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando identificación
    de los parámetros a, h y k en la forma canónica.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a identificación
    de los parámetros a, h y k en la forma canónica.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
