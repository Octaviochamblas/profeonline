semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.PARAMETROS_CANONICA
resumen_inicial: La identificación de los parámetros $a$, $h$ y $k$ en la forma canónica $f(x) = a(x - h)^2 + k$ determina independientemente la concavidad y apertura ($a$), el desplazamiento horizontal y eje de simetría ($h$), y el desplazamiento vertical y cota del recorrido ($k$).
explicacion_simple: "![La identificación de los parámetros $a$, $h$ y $k$ en la forma canónica $f(x) = a(x - h)^2 + k$ determina independientemente la concavidad y apertura ($a$), el desplazamiento horizontal y eje de simetría ($h$), y el desplazamiento vertical y cota del recorrido ($k$)](/static/img/nodos/identificacion-de-los-parametros-a-h-y-k-en-la-forma-canonica-intro.svg)\n\n\nCada una de las tres letras de la forma canónica tiene una misión clara e independiente:\n\n1. **La letra $a$ (El diseñador de la curva):**\n   - Si $a > 0$, abre hacia arriba; si $a < 0$, abre hacia abajo.\n   - Si $|a|$ es grande, la parábola es angosta; si $|a|$ es pequeño, es ancha.\n2. **La letra $h$ (El control horizontal):**\n   - Mueve la parábola hacia la derecha ($h > 0$) o izquierda ($h < 0$).\n   - Define el eje de simetría: **$x = h$**.\n3. **La letra $k$ (El control vertical):**\n   - Sube la parábola ($k > 0$) o la baja ($k < 0$).\n   - Define la altura máxima o mínima y el recorrido de la función."
explicacion_formal: 'Sea $f(x) = a(x - h)^2 + k$ con $a \in \mathbb{R} \setminus \{0\}, \; h, k \in \mathbb{R}$. La terna $(a, h, k)$ desacopla las transformaciones afines del plano euclidiano:


  $$\begin{pmatrix} x'' \\ y'' \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & a \end{pmatrix} \begin{pmatrix} x \\ y \end{pmatrix} + \begin{pmatrix} h \\ k \end{pmatrix}$$


  **Impacto analítico de cada parámetro**:

  - **$a$**: Tasa de cambio de segundo orden ($f''''(x) = 2a$).

  - **$h$**: Raíz única de la primera derivada ($f''(h) = 0$).

  - **$k$**: Extremo absoluto global ($f(h) = k$).'
definiciones_clave: '- **Parámetro $a$**: Factor de escala vertical y orientación de concavidad.

  - **Parámetro $h$**: Coordenada de traslación horizontal y eje de simetría.

  - **Parámetro $k$**: Coordenada de traslación vertical y cota de imagen.'
propiedades_relaciones: '- **Independencia paramétrica**: Modificar $h$ no altera ni la concavidad ($a$) ni el valor extremo ($k$).

  - **Determinación del corte con eje Y**: $f(0) = ah^2 + k$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de los parámetros $a$, $h$ y $k$ en la forma canónica $f(x) = a(x - h)^2 + k$ determina independientemente la concavidad y apertura ($a$), el desplazamiento horizontal y eje de simetría ($h$), y el desplazamiento vertical y cota del recorrido ($k$)](/static/img/nodos/identificacion-de-los-parametros-a-h-y-k-en-la-forma-canonica-ejemplos.svg)



    Extrae los parámetros $(a, h, k)$ y describe el comportamiento geométrico completo de $f(x) = -\frac{1}{2}(x + 3)^2 + 8$.'
  pasos:
  - 'Paso 1: Identificar $a = -\frac{1}{2}$:

    - Como $a < 0$, la parábola abre hacia abajo ($\cap$).

    - Como $|a| = 0,5 < 1$, las ramas son más abiertas y dilatadas horizontalmente.'
  - 'Paso 2: Identificar $h = -3$:

    - La parábola se desplazó 3 unidades a la izquierda.

    - Eje de simetría: recta vertical $x = -3$.'
  - 'Paso 3: Identificar $k = 8$:

    - La parábola se desplazó 8 unidades hacia arriba.

    - Vértice máximo en $(-3, 8)$ y recorrido $\text{Rec}(f) = ]-\infty, 8]$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $f(x) = -(x - 5)^2 + 3$, ¿cuál es el valor del parámetro h y qué recta define?
  choices:
  - text: h = 5, definiendo el eje de simetría x = 5
    is_correct: true
  - text: h = -5, definiendo el eje x = -5
    is_correct: false
  - text: h = 3, definiendo el eje y = 3
    is_correct: false
  - text: h = -1
    is_correct: false
  explanation: La alternativa correcta es 'h = 5, definiendo el eje de simetría x = 5'. El binomio $(x - 5)$ tiene $h = 5$, fijando la recta vertical $x = 5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene $k = -4$ y abre hacia arriba ($a = 2$), ¿cuál es su recorrido?
  choices:
  - text: '[-4, +∞['
    is_correct: true
  - text: ']-∞, -4]'
    is_correct: false
  - text: '[2, +∞['
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es '[-4, +∞['. Al abrir hacia arriba ($a > 0$), el recorrido parte en $k = -4$ y sube a $+\infty$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar la función dada con el modelo $f(x) = a(x - h)^2 + k$.'
- 'Paso 2: Extraer $a$ identificando el factor exterior.'
- 'Paso 3: Extraer $h$ resolviendo $x - h = 0$.'
- 'Paso 4: Extraer $k$ tomando la constante aditiva final.'
- 'Paso 5: Expresar el significado geométrico de la terna $(a, h, k)$.'
errores_correccion: '- **Error común:** Creer que $a = 0$ cuando no hay número multiplicando al paréntesis (ej: $-(x-2)^2$).

  - **Cómo corregirlo:** Si solo hay un signo negativo, **el coeficiente es $a = -1$** (si fuera 0 no habría función cuadrática).'
ejemplos:
- titulo: 'Ejemplo 1: Identificación con coeficientes fraccionarios'
  enunciado: En $f(x) = \frac{2}{3}(x - 1)^2 + 4$, ¿cuál es la terna (a, h, k)?
  alternativas:
  - (2/3, 1, 4)
  - (2/3, -1, 4)
  - (2/3, 1, -4)
  - (1, 1, 4)
  respuesta: (2/3, 1, 4)
  solucion_pasos:
  - 'Paso 1: $a = 2/3, h = 1, k = 4$.'
- titulo: 'Ejemplo 2: Identificación con signo menos'
  enunciado: Para $g(x) = -(x + 7)^2 - 5$, ¿cuál es el valor de a y k?
  alternativas:
  - a = -1, k = -5
  - a = 1, k = -5
  - a = -1, k = 5
  - a = -7, k = -5
  respuesta: a = -1, k = -5
  solucion_pasos:
  - 'Paso 1: $a = -1, h = -7, k = -5$.'
- titulo: 'Ejemplo 3: Eje de simetría desde h'
  enunciado: Si $f(x) = 3(x + 4)^2 + 1$, ¿cuál es el eje de simetría?
  alternativas:
  - x = -4
  - x = 4
  - y = 1
  - x = 3
  respuesta: x = -4
  solucion_pasos:
  - 'Paso 1: $h = -4 \implies x = -4$.'
- titulo: 'Ejemplo 4: Recorrido desde k'
  enunciado: En $h(x) = -5(x - 2)^2 - 9$, ¿cuál es el recorrido?
  alternativas:
  - ']-inf, -9]'
  - '[-9, +inf['
  - ']-inf, 2]'
  - '[-5, +inf['
  respuesta: ']-inf, -9]'
  solucion_pasos:
  - 'Paso 1: $a = -5 < 0 \implies ]-\infty, k] = ]-\infty, -9]$.'
errores_frecuentes:
- Asignar signo incorrecto a h al extraerlo del binomio.
- Confundir a con el valor de la pendiente lineal.
- Olvidar que k determina directamente la cota del recorrido.
afirmaciones_verdaderas:
- En f(x) = a(x - h)² + k, el parámetro h fija el eje de simetría x = h.
- El parámetro k representa la cota extremal del recorrido de la función.
al_terminar_debes_poder: '**QUÉ:** Identificar e interpretar los parámetros a, h y k de la forma canónica.


  **CÓMO:** Extrayendo la terna (a, h, k) y vinculándola con la concavidad, el eje de simetría y el recorrido.


  ![Resumen La identificación de los parámetros $a$, $h$ y $k$ en la forma canónica $f(x) = a(x - h)^2 + k$ determina independientemente la concavidad y apertura ($a$), el desplazamiento horizontal y eje de simetría ($h$), y el desplazamiento vertical y cota del recorrido ($k$)](/static/img/nodos/identificacion-de-los-parametros-a-h-y-k-en-la-forma-canonica-resumen.svg)'
