semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.PARAMETROS_CANONICA
resumen_inicial: 'La identificación de los parámetros $a$, $h$ y $k$ en la forma canónica $f(x) = a(x - h)^2 + k$ requiere comparar minuciosamente los signos de la fórmula patrón.'
explicacion_simple: |
  Extraer los tres parámetros de una función en forma canónica es como leer una etiqueta de instrucciones: el número fuera del paréntesis es $a$ (nos da la concavidad), el número dentro del paréntesis invierte su signo para convertirse en $h$ (la posición horizontal del vértice), y el número sumado al final conserva su signo para convertirse en $k$ (la posición vertical del vértice).
explicacion_formal: |
  ### Definición formal
  Dada una función cuadrática expresada en la forma canónica $f(x) = a(x - h)^2 + k$, los **parámetros característicos** se extraen mediante igualdad de estructuras algebraicas:
  - $a \in \mathbb{R} \setminus \{0\}$: Factor cuadrático de escala y concavidad.
  - $h \in \mathbb{R}$: Abscisa del vértice obtenida de la igualdad $(x - h)$.
  - $k \in \mathbb{R}$: Ordenada del vértice obtenida del término aditivo independiente.

  ### Desglose simbólico
  - Si aparece $(x - c)^2 \implies h = +c$.
  - Si aparece $(x + c)^2 = (x - (-c))^2 \implies h = -c$.
  - Si no hay paréntesis (ej: $ax^2 + k$) $\implies h = 0$.
  - Si no hay constante externa $\implies k = 0$.
  - Si no hay número multiplicando al paréntesis (ej: $(x - h)^2 + k$) $\implies a = 1$.
  - Si hay un signo menos delante (ej: $-(x - h)^2 + k$) $\implies a = -1$.

  ### Síntesis didáctica
  La regla mnemotécnica de signos: **"$h$ invierte su signo, $k$ mantiene su signo"**. El parámetro $a$ preserva completamente su valor escalar y su signo algebraico original.
definiciones_clave: |
  - **Parámetro $a$**: Coeficiente externo que pondera al binomio cuadrático.
  - **Parámetro $h$**: Constante sustraída a la variable $x$ dentro del binomio al cuadrado.
  - **Parámetro $k$**: Constante aditiva externa al término cuadrático.
propiedades_relaciones: |
  - **Relación con la forma general**: El parámetro $h = -\frac{b}{2a}$, y el parámetro $k = c - \frac{b^2}{4a} = \frac{4ac - b^2}{4a}$.
  - **Impacto geométrico individual**: Modificar $a$ altera la apertura; modificar $h$ desplaza la curva lateralmente; modificar $k$ desplaza la curva verticalmente.
ejemplo_guiado:
  enunciado: 'Extrae con precisión los valores de los parámetros $a$, $h$ y $k$ para las siguientes funciones cuadráticas en forma canónica: $f(x) = -(x + 4)^2 + 9$ y $g(x) = \frac{1}{2}(x - 6)^2$.'
  pasos:
    - 'Paso 1: Para $f(x) = -(x + 4)^2 + 9$, el signo menos implícito indica $a = -1$.'
    - 'Paso 2: Escribimos el binomio como $(x - (-4))^2$, obteniendo $h = -4$.'
    - 'Paso 3: Extraemos la constante aditiva externa $k = 9$. Conclusión para $f(x)$: $a = -1$, $h = -4$, $k = 9$.'
    - 'Paso 4: Para $g(x) = \frac{1}{2}(x - 6)^2 + 0$, identificamos $a = \frac{1}{2}$.'
    - 'Paso 5: En $(x - 6)^2$, extraemos $h = 6$. Al no haber constante sumada, $k = 0$. Conclusión para $g(x)$: $a = \frac{1}{2}$, $h = 6$, $k = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función en forma canónica $f(x) = 3(x + 1)^2 - 8$, ¿cuáles son los valores exactos de los parámetros $a$, $h$ y $k$?'
    choices:
      - {text: '$a = 3$, $h = -1$, $k = -8$', is_correct: true}
      - {text: '$a = 3$, $h = 1$, $k = -8$', is_correct: false}
      - {text: '$a = 3$, $h = -1$, $k = 8$', is_correct: false}
      - {text: '$a = 1$, $h = -1$, $k = -8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = 3$, $h = -1$, $k = -8$''. El coeficiente es $a = 3$, el binomio $(x + 1)$ da $h = -1$, y la constante es $k = -8$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función en forma canónica se expresa como $h(x) = -(x - 2)^2$, ¿cuáles son los parámetros $a$, $h$ y $k$?'
    choices:
      - {text: '$a = -1$, $h = 2$, $k = 0$', is_correct: true}
      - {text: '$a = 1$, $h = -2$, $k = 0$', is_correct: false}
      - {text: '$a = -1$, $h = -2$, $k = 0$', is_correct: false}
      - {text: '$a = 0$, $h = 2$, $k = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -1$, $h = 2$, $k = 0$''. El signo negativo exterior da $a = -1$, $(x - 2)$ da $h = 2$, y la falta de constante externa indica $k = 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la expresión dada y alinearla visualmente con la plantilla $a(x - h)^2 + k$.'
  - 'Paso 2: Identificar $a$ observando el número o signo que precede al paréntesis cuadrático.'
  - 'Paso 3: Identificar $h$ invirtiendo el signo del número dentro del paréntesis $(x - h)$.'
  - 'Paso 4: Identificar $k$ leyendo la constante numérica libre fuera del paréntesis con su propio signo.'
errores_correccion: |
  - **Error 1:** Asumir $a = 0$ cuando no hay un número escrito delante del paréntesis. **Cómo corregirlo:** Si no hay número visible delante del binomio (ej: $(x - 3)^2$), el coeficiente es $a = 1$. Si fuera $a = 0$, toda la expresión se anularía.
  - **Error 2:** Olvidar invertir el signo del término interno al determinar $h$. **Cómo corregirlo:** Para el término $(x + 7)^2$, el parámetro es $h = -7$, pues la regla estructural es $(x - h)$.
ejemplos:
  - titulo: 'Extracción de parámetros con a negativo'
    enunciado: '¿Cuáles son los parámetros $a$, $h$ y $k$ en $f(x) = -5(x - 4)^2 + 3$?'
    alternativas:
      - '$a = -5$, $h = 4$, $k = 3$'
      - '$a = -5$, $h = -4$, $k = 3$'
      - '$a = 5$, $h = 4$, $k = -3$'
    respuesta: '$a = -5$, $h = 4$, $k = 3$'
    solucion_pasos:
      - '1. Coeficiente externo: $a = -5$.'
      - '2. Término en binomio $(x - 4) \implies h = 4$.'
      - '3. Constante externa: $k = 3$.'
  - titulo: 'Extracción de parámetros en parábola centrada en el eje y'
    enunciado: 'En la función $g(x) = 2x^2 - 9$, ¿cuáles son los valores de $a$, $h$ y $k$?'
    alternativas:
      - '$a = 2$, $h = 0$, $k = -9$'
      - '$a = 2$, $h = -9$, $k = 0$'
      - '$a = 2$, $h = 9$, $k = 0$'
    respuesta: '$a = 2$, $h = 0$, $k = -9$'
    solucion_pasos:
      - '1. Reescribimos en forma canónica explícita: $g(x) = 2(x - 0)^2 - 9$.'
      - '2. Extraemos: $a = 2$, $h = 0$, $k = -9$.'
  - titulo: 'Inversión de signo de h'
    enunciado: 'En la función $f(x) = (x + 8)^2 - 3$, ¿el parámetro $h$ es igual a $-8$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que $(x + 8) = (x - (-8))$, el parámetro de la abscisa es $h = -8$.'
  - titulo: 'Conservación del signo de k'
    enunciado: 'En la función $f(x) = -3(x - 1)^2 - 5$, ¿el parámetro $k$ conserva el signo negativo siendo $k = -5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El parámetro $k$ mantiene su signo algebraico externo tal como aparece en la fórmula.'
errores_frecuentes:
  - 'En la función $f(x) = (x - 6)^2 + 2$, el coeficiente $a$ es igual a $0$.'
  - 'El parámetro $h$ en la función $f(x) = 4(x + 2)^2 - 1$ es igual a $2$.'
  - 'El parámetro $k$ invierte su signo positivo a negativo al ser extraído de la forma canónica.'
  - 'Para la función $f(x) = -(x - 3)^2 + 4$, el coeficiente $a$ es igual a $1$.'
  - 'Los parámetros $h$ y $k$ cambian de valor al multiplicar por un factor constante toda la función.'
afirmaciones_verdaderas:
  - 'En la forma canónica $f(x) = a(x - h)^2 + k$, el parámetro $h$ invierte el signo mostrado dentro del paréntesis mientras que $k$ conserva su signo.'
  - 'Si delante del binomio cuadrático sólo aparece un signo negativo, el coeficiente multiplicativo es $a = -1$.'
al_terminar_debes_poder: 'Extraer con exactitud los valores de los parámetros $a$, $h$ y $k$ a partir de cualquier expresión en forma canónica.'
