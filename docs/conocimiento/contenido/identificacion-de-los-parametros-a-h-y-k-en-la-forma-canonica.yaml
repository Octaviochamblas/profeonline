procedimiento:
- 'Paso 1: Identifica $a$ como el número que multiplica al binomio al cuadrado.'
- 'Paso 2: Reescribe el binomio como $(x-h)$ si es necesario, para leer correctamente
  el signo de $h$.'
- 'Paso 3: Identifica $k$ como la constante sumada fuera del paréntesis.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en identificación de los parámetros a, h y k en
  la forma canónica.
ejemplos:
- titulo: Identificación con h positivo
  enunciado: Identifica $a$, $h$ y $k$ en $f(x)=5(x-2)^2+3$.
  solucion_pasos:
  - $a=5$.
  - $h=2$ (el binomio ya está en la forma $x-h$).
  - $k=3$.
- titulo: Identificación con h negativo
  enunciado: Identifica $a$, $h$ y $k$ en $f(x)=-2(x+4)^2-6$.
  solucion_pasos:
  - $a=-2$.
  - 'Reescribiendo $(x+4)$ como $(x-(-4))$: $h=-4$.'
  - $k=-6$.
- titulo: ¿El parámetro $h$ se lee directamente con el signo que aparece dentro del
    paréntesis?
  enunciado: ¿El parámetro $h$ se lee directamente con el signo que aparece dentro
    del paréntesis?
  respuesta: 'No'
  solucion_pasos:
  - Se debe reescribir el binomio como $(x-h)$ primero; si aparece $(x+4)$, entonces
    $h=-4$, con el signo opuesto.
- titulo: ¿El parámetro $k$ tiene el mismo signo que aparece en la expresión?
  enunciado: ¿El parámetro $k$ tiene el mismo signo que aparece en la expresión?
  respuesta: Sí
  solucion_pasos:
  - A diferencia de $h$, el parámetro $k$ se lee directamente con su signo tal como
    aparece en la expresión.
errores_frecuentes:
- Leer $h$ con el signo incorrecto al no reescribir el binomio en la forma $(x-h)$.
- Confundir $k$ con el término independiente de la forma general, que no son necesariamente
  el mismo valor.
- Olvidar el coeficiente $a$ al identificar los parámetros, asumiendo que siempre
  vale 1.
- Invertir los valores de $h$ y $k$ al transcribirlos.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  identificación de los parámetros a, h y k en la forma canónica.
