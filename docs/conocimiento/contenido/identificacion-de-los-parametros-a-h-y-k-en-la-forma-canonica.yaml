semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.PARAMETROS_CANONICA
resumen_inicial: La identificación de parámetros aísla $a$, $h$ y $k$ en $f(x) = a(x - h)^2 + k$, interpretando sus roles geométricos y algebraicos.
explicacion_simple: |
  En la forma canónica $f(x) = a(x - h)^2 + k$, cada una de las tres letras cumple un papel único e importante:

  1. **Letra $a$ (Coeficiente cuadrático)**:
     - Controla la **concavidad**: Si $a > 0$ (arriba $\cup$), si $a < 0$ (abajo $\cap$).
     - Controla la **abertura**: Si $|a|$ es grande la parábola se cierra; si $|a|$ es pequeño se ensancha.
  2. **Letra $h$ (Abscisa del vértice)**:
     - Desplaza la parábola **horizontalmente** (a la izquierda o derecha).
     - La recta $x = h$ es el **eje de simetría**.
  3. **Letra $k$ (Ordenada del vértice)**:
     - Desplaza la parábola **verticalmente** (hacia arriba o hacia abajo).
     - Es el **valor máximo o mínimo** de la función.
explicacion_formal: |
  Dada la familia de funciones cuadráticas en forma canónica $f(x) = a(x - h)^2 + k$, los **parámetros de transformación cartesiana $(a, h, k) \in (\mathbb{R} \setminus \{0\}) \times \mathbb{R} \times \mathbb{R}$** gobiernan el grafo por isotopía afín respecto a la parábola madre $y = x^2$:

  $$y = x^2 \xrightarrow{\text{Escalamiento } a} y = ax^2 \xrightarrow{\text{Traslación } (h,k)} y = a(x - h)^2 + k$$

  **Matriz de lectura de parámetros:**
  - $a$: Factor de compresión/dilatación espectral y orientación de ramas.
  - $h$: Vector de traslación horizontal $\vec{v}_x = (h, 0)$.
  - $k$: Vector de traslación vertical $\vec{v}_y = (0, k)$.
definiciones_clave: |
  - **Parámetros canónicos**: Trío de valores $(a, h, k)$ que determinan completamente la forma, abertura, posición horizontal y altura del vértice de una parábola.
propiedades_relaciones: |
  - **Coincidencia con el término independiente**: Cuando $h = 0$, la forma canónica se reduce a $f(x) = ax^2 + k$, donde el parámetro $k$ coincide exactamente con el corte $c$ en el eje Y.
ejemplo_guiado:
  enunciado: 'Aísla los parámetros $a, h, k$ de la función $f(x) = -0.5(x + 2)^2 + 9$ e indica la traslación aplicada a $y = x^2$.'
  pasos:
    - 'Paso 1: Comparar con la forma estándar $a(x - h)^2 + k$.'
    - 'Paso 2: Aislar el coeficiente cuadrático: $a = -0.5$ (concavidad negativa, parábola dilatada/abierta).'
    - 'Paso 3: Aislar la abscisa del vértice: $(x + 2) = (x - (-2)) \implies h = -2$ (traslación 2 unidades a la izquierda).'
    - 'Paso 4: Aislar la ordenada del vértice: $k = 9$ (traslación 9 unidades hacia arriba).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para la función $f(x) = -3(x - 4)^2 - 7$, ¿cuáles son los valores exactos de los parámetros $a, h$ y $k$?'
    choices:
      - {text: '$a = -3$, $h = 4$, $k = -7$', is_correct: true}
      - {text: '$a = 3$, $h = -4$, $k = 7$.', is_correct: false}
      - {text: '$a = -3$, $h = -4$, $k = -7$.', is_correct: false}
      - {text: '$a = -7$, $h = 4$, $k = -3$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -3$, $h = 4$, $k = -7$''. Comparando con $a(x - h)^2 + k$, $a = -3$, $h = 4$ y $k = -7$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué parámetro de la forma canónica determina por sí solo el eje de simetría de la parábola?'
    choices:
      - {text: 'El parámetro $h$', is_correct: true}
      - {text: 'El parámetro $k$.', is_correct: false}
      - {text: 'El parámetro $a$.', is_correct: false}
      - {text: 'El producto $a \cdot k$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El parámetro $h$''. El eje de simetría viene dado por la recta $x = h$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir debajo de la función dada la forma general canónica $f(x) = a(x - h)^2 + k$.'
  - 'Paso 2: Identificar el coeficiente multiplicador frontal $a$.'
  - 'Paso 3: Identificar la constante $h$ invirtiendo el signo del término dentro del paréntesis cuadrático.'
  - 'Paso 4: Identificar el valor constante libre $k$ conservando su propio signo.'
errores_correccion: |
  - **Error común:** Pensar que si no hay número multiplicando al paréntesis (ej. $f(x) = (x - 2)^2 + 3$), el parámetro $a$ vale cero.
  - **Cómo corregirlo:** Si no aparece número escrito enfrente, **EL COEFICIENTE ES $a = 1$** (nunca cero).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Identificación con coeficiente implícito.
    alternativas:
      - 'a = 1, h = 3, k = 4'
      - 'a = 0, h = -3, k = 4'
      - 'a = 3, h = 1, k = 4'
    respuesta: 'a = 1, h = 3, k = 4'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Identificación con signos negativos.
    alternativas:
      - 'a = -2, h = -1, k = -5'
      - 'a = -2, h = 1, k = 5'
      - 'a = 2, h = -1, k = -5'
    respuesta: 'a = -2, h = -1, k = -5'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = (x - 5)^2 + 2$, es correcto decir que el coeficiente cuadrático $a$ es nulo.'
  - 'La consideración de que el parámetro $h$ conserva el mismo signo que aparece escrito dentro del binomio elevado al cuadrado.'
  - 'La equivalencia errónea entre el rol de la constante $k$ asignándole el control del desplazamiento horizontal en el plano cartesiano.'
  - 'La suposición de que modificar el valor de $a$ desplaza la posición del vértice de la parábola.'
  - 'La equiparación del parámetro $h$ con el valor del corte con el eje de las ordenadas.'
afirmaciones_verdaderas:
  - 'En la forma canónica $f(x) = a(x - h)^2 + k$, el parámetro $h$ especifica el eje de simetría $x = h$ y $k$ indica la altura del vértice.'
  - 'Si no hay coeficiente explícito escrito multiplicando al paréntesis cuadrático, se entiende que el parámetro $a = 1$.'
al_terminar_debes_poder: |
  QUÉ: Aislar e interpretar los tres parámetros $a, h, k$ de una función en forma canónica.
  CÓMO: Contrastar con $f(x) = a(x - h)^2 + k$, invertir el signo para obtener $h$, mantener $k$ y asociar $a$ a la concavidad.
