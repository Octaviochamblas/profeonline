semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_SIMETRIA
resumen_inicial: 'El reconocimiento gráfico de una función impar consiste en verificar que la curva posee simetría central puntual respecto al origen $(0, 0)$, de modo que una rotación de $180^\circ$ superpone la curva sobre sí misma: $(x, y) \iff (-x, -y)$.'
explicacion_simple: '![El reconocimiento gráfico de una función impar consiste en verificar que la curva posee simetría central puntual respecto al origen $(0, 0)$, de modo que una rotación de $180^\circ$ superpone la curva sobre sí misma: $(x, y) \iff (-x, -y)$](/static/img/nodos/reconocimiento-de-simetria-respecto-del-origen-intro.svg)



  Para reconocer una función impar en un gráfico:

  1. Mira el centro del plano: el **origen $(0, 0)$**.

  2. Imagina que tomas el gráfico y lo **giras media vuelta completa ($180^\circ$)** boca abajo.

  3. **Criterio:** Si el dibujo queda **exactamente igual** que al principio, la función **es impar**.

  4. Cada punto $(x, y)$ tiene a su opuesto $(-x, -y)$ en el cuadrante diagonalmente opuesto.'
explicacion_formal: 'Sea $\text{Graf}(f) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x)\}$. La **simetría central respecto al origen** $\mathcal{S}_{(0, 0)}$ equivale a una rotación de ángulo $\pi$ ($180^\circ$):

  $$\mathcal{S}_{(0, 0)}(x, y) = (-x, -y)$$


  $$\text{Graf}(f) \text{ es simétrica al origen} \Longleftrightarrow \mathcal{S}_{(0, 0)}(\text{Graf}(f)) = \text{Graf}(f) \Longleftrightarrow f(-x) = -f(x)$$


  **Correspondencia de cuadrantes:**

  - Puntos en el Cuadrante I $(+, +)$ se reflejan en el Cuadrante III $(-, -)$.

  - Puntos en el Cuadrante II $(-, +)$ se reflejan en el Cuadrante IV $(+, -)$.'
definiciones_clave: '- **Simetría central puntual**: Transformación que asocia a cada punto su simétrico respecto a un centro fijo $O(0, 0)$.

  - **Invarianza por rotación de $180^\circ$**: Propiedad donde girar el plano medio giro conserva inalterada la curva.'
propiedades_relaciones: '- **Paso forzado por $(0, 0)$**: Si la gráfica corta al eje Y, dicho corte debe ocurrir estrictamente en el origen $(0, 0)$.

  - **Diferencia con función par**: La función par refleja respecto a una recta (espejo); la impar refleja respecto a un punto (rotación).'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento gráfico de una función impar consiste en verificar que la curva posee simetría central puntual respecto al origen $(0, 0)$, de modo que una rotación de $180^\circ$ superpone la curva sobre sí misma: $(x, y) \iff (-x, -y)$](/static/img/nodos/reconocimiento-de-simetria-respecto-del-origen-ejemplos.svg)



    Verifica si la gráfica de la función cúbica $f(x) = x^3 - 4x$ posee simetría respecto al origen analizando los puntos para $x = 1, 2, 3$.'
  pasos:
  - 'Paso 1: Para $x = 1$: $f(1) = 1 - 4 = -3 \implies (1, -3)$.'
  - 'Paso 2: Para $x = -1$: $f(-1) = -1 + 4 = 3 \implies (-1, 3)$ (punto opuesto exacto $(-1, -(-3))$).'
  - 'Paso 3: Para $x = 2$: $f(2) = 8 - 8 = 0 \implies (2, 0)$ y $(-2, 0)$ (cortes simétricos).'
  - 'Paso 4: Para $x = 3$: $f(3) = 27 - 12 = 15 \implies (3, 15)$ y $(-3, -15)$.'
  - 'Paso 5: Concluir que cada punto $(x, y)$ tiene su contraparte $(-x, -y)$, confirmando simetría respecto al origen.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una función impar contiene al punto (-5, 12), ¿qué punto pertenece obligatoriamente a su gráfica?
  choices:
  - text: (5, -12)
    is_correct: true
  - text: (-5, -12)
    is_correct: false
  - text: (5, 12)
    is_correct: false
  - text: (12, -5)
    is_correct: false
  explanation: La alternativa correcta es '(5, -12)'. La simetría central transforma $(x, y) \to (-x, -y)$, luego $(-(-5), -(12)) = (5, -12)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué transformación geométrica deja idéntica la gráfica de una función impar?
  choices:
  - text: Una rotacion de 180 grados alrededor del origen (0, 0).
    is_correct: true
  - text: Una reflexion respecto al eje Y.
    is_correct: false
  - text: Una traslacion de 2 unidades hacia arriba.
    is_correct: false
  - text: Una rotacion de 90 grados.
    is_correct: false
  explanation: La alternativa correcta es 'Una rotacion de 180 grados alrededor del origen (0, 0).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el origen de coordenadas $(0, 0)$.'
- 'Paso 2: Seleccionar puntos $(x, y)$ de la gráfica en el primer o segundo cuadrante.'
- 'Paso 3: Verificar que los puntos diagonalmente opuestos $(-x, -y)$ pertenezcan a la gráfica.'
- 'Paso 4: Girar mentalmente la gráfica $180^\circ$ para confirmar la coincidencia total de las ramas.'
errores_correccion: '- **Error común:** Confundir la simetría de una función inversa (respecto a la diagonal $y = x$) con la simetría impar (respecto al punto $(0, 0)$).

  - **Cómo corregirlo:** La **función impar** es simétrica respecto al **punto $(0, 0)$** ($(x, y) \to (-x, -y)$); la **inversa** es simétrica respecto a la **recta $y = x$** ($(x, y) \to (y, x)$).'
ejemplos:
- titulo: 'Ejemplo 1: Recta lineal'
  enunciado: La recta $y = 5x$ pasa por $(0, 0)$. ¿Es simétrica respecto al origen?
  alternativas:
  - Sí, al rotar 180° la recta sobre sí misma no cambia
  - No, porque es una recta
  - Es simétrica respecto al eje Y
  - Solo en el primer cuadrante
  respuesta: Sí, al rotar 180° la recta sobre sí misma no cambia
  solucion_pasos:
  - 'Paso 1: Toda recta $y = mx$ que pasa por el origen posee simetría central respecto a $(0, 0)$.'
- titulo: 'Ejemplo 2: Hipérbola equilátera'
  enunciado: La curva $y = \frac{1}{x}$ tiene una rama en el Cuadrante I y otra en el III. ¿Qué simetría presenta?
  alternativas:
  - Simetría respecto al origen (0, 0)
  - Simetría respecto al eje Y
  - Simetría respecto al eje X
  - No tiene simetría
  respuesta: Simetría respecto al origen (0, 0)
  solucion_pasos:
  - 'Paso 1: La rama del Cuadrante I se transforma en la del Cuadrante III bajo rotación de $180^\circ$.'
- titulo: 'Ejemplo 3: Cúbica trasladada'
  enunciado: La curva $y = x^3 + 2$ corta al eje Y en $(0, 2)$. ¿Es simétrica respecto al origen?
  alternativas:
  - No, al cortar en (0, 2) no pasa por (0, 0) y pierde la simetría central
  - Sí, porque tiene exponente 3
  - Es simétrica respecto al eje Y
  - Solo para x > 0
  respuesta: No, al cortar en (0, 2) no pasa por (0, 0) y pierde la simetría central
  solucion_pasos:
  - 'Paso 1: El desplazamiento vertical destruye la simetría central respecto al origen.'
- titulo: 'Ejemplo 4: Senoide'
  enunciado: La función seno pasa por $(0, 0)$ oscilando igual arriba y abajo. ¿Es simétrica al origen?
  alternativas:
  - Sí, es una función impar simétrica respecto a (0, 0)
  - No, es par
  - No tiene simetría
  - Solo en [0, pi]
  respuesta: Sí, es una función impar simétrica respecto a (0, 0)
  solucion_pasos:
  - 'Paso 1: $\sin(-x) = -\sin(x)$, presenta simetría central respecto al origen.'
errores_frecuentes:
- Confundir simetría respecto al origen con simetría respecto al eje Y.
- Ignorar que el punto (0, 0) debe estar en la curva si está definida en x = 0.
- Asumir que funciones con curvas cúbicas trasladadas siguen siendo impares.
afirmaciones_verdaderas:
- Una gráfica es simétrica respecto al origen si y solo si representa a una función impar.
- Una rotación de 180° alrededor del punto (0, 0) deja inalterada la gráfica de una función impar.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar visualmente la simetría de una función respecto al origen de coordenadas.


  **CÓMO:** Verificando la correspondencia diagonal (x, y) ⟷ (-x, -y) e identificando la rotación de 180° sobre el punto (0, 0).


