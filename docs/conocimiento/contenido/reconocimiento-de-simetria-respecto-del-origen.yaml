semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_SIMETRIA
resumen_inicial: Reconocer la simetría respecto del origen permite identificar visualmente
  a las funciones impares (rotación de $180^\circ$ en el plano).
explicacion_simple: 'Para verificar la **simetría central respecto al origen $(0,0)$**
  en un gráfico:

  - Si tomas el gráfico y lo giras una media vuelta completa ($180^\circ$) alrededor
  del punto centro $(0,0)$, la figura vuelve a quedar idéntica.

  - Para cada punto $(x, y)$ en el primer cuadrante, existe su reflejo diagonal inverso
  $(-x, -y)$ en el tercer cuadrante.'
explicacion_formal: 'La simetría central de una gráfica $G(f)$ con respecto al origen
  $O(0,0)$ se formula como:


  $$(x, y) \in G(f) \iff (-x, -y) \in G(f)$$


  **Desglose de la fórmula:**

  - Rotación isométrica de $\pi$ radianes ($180^\circ$) en el plano cartesiano $\mathbb{R}^2$.'
definiciones_clave: '- **Simetría puntual / central respecto al origen**: Transformación
  donde el centro $(0,0)$ opera como punto de inversión.'
propiedades_relaciones: '- **Inversión de ambos signos**: El punto reflejado invierte
  SIMULTÁNEAMENTE el signo de $x$ y el signo de $y$.'
ejemplo_guiado:
  enunciado: La gráfica de una función impar contiene al punto $(3, 12)$. Determina
    la coordenada del punto simétrico que pertenece obligatoriamente al gráfico.
  pasos:
  - 'Paso 1: Recordar que la simetría respecto al origen invierte los signos de ambas
    componentes.Paso 2: Invertir el signo de la abscisa: de $x = 3$ pasa a $-3$.Paso
    3: Invertir el signo de la ordenada: de $y = 12$ pasa a $-12$.Paso 4: Formar el
    punto reflejado en la gráfica: $(-3, -12)$.Paso 5: Concluir que $(-3, -12)$ pertenece
    a la curva de la función impar.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la gráfica de una función impar pasa por el punto $(3, 12)$, ¿cuál
    es su punto simétrico respecto al origen?
  choices:
  - text: $(-3, -12)$
    is_correct: true
  - text: $(-3, 12)$
    is_correct: false
  - text: $(3, -12)$
    is_correct: false
  - text: $(12, 3)$
    is_correct: false
  explanation: La alternativa correcta es '$(-3, -12)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué rotación del plano cartesiano alrededor del origen mapea la gráfica
    de una función impar sobre sí misma?
  choices:
  - text: Una rotación de $180^\circ$ (media vuelta).
    is_correct: true
  - text: Una rotación de $90^\circ$.
    is_correct: false
  - text: Una rotación de $360^\circ$ exclusivamente.
    is_correct: false
  - text: Una traslación vertical.
    is_correct: false
  explanation: La alternativa correcta es 'Una rotación de $180^\circ$ (media vuelta).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar un punto $(x, y)$ sobre el trazo del gráfico.'
- 'Paso 2: Invertir los signos de ambas componentes para formar $(-x, -y)$.'
- 'Paso 3: Verificar que el punto $(-x, -y)$ se encuentre dibujado sobre la curva.'
- 'Paso 4: Si se cumple para toda la curva, declarar simetría respecto al origen (función
  impar).'
errores_correccion: '- **Error común:** Confundir la simetría respecto al origen con
  la simetría respecto al eje Y.

  - **Cómo corregirlo:** La simetría con el eje Y cambia SOLO el signo de $x$: $(-x,
  y)$. La simetría respecto al origen cambia AMBOS signos: $(-x, -y)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
