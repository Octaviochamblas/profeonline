semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_SIMETRIA
resumen_inicial: 'Reconocimiento de simetría respecto del origen: conceptos, representación
  y propiedades en Simetrías y funciones especiales.'
explicacion_simple: Si giraras la gráfica de una función impar exactamente media vuelta
  alrededor del origen, quedaría perfectamente superpuesta a sí misma.
explicacion_formal: '### Definición formal


  Geométricamente, $f(-x)=-f(x)$ significa que el punto $(-a, -f(a))$ pertenece a
  la gráfica siempre que $(a, f(a))$ también pertenezca a ella. Esto equivale a la
  invariancia de la gráfica bajo una rotación de $180°$ alrededor del origen.


  ### Desarrollo didáctico


  Para reconocer visualmente, verifica que cada punto $(a,b)$ de la curva tenga su
  correspondiente punto $(-a,-b)$ también sobre la curva.


  La función cúbica $f(x)=x^3$ es el ejemplo clásico: el punto $(2,8)$ está en la
  curva, y también lo está $(-2,-8)$, su reflejo por rotación de $180°$ respecto al
  origen.'
definiciones_clave: '- **Reconocimiento de simetría respecto del origen**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a reconocimiento de simetría respecto del
  origen.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a reconocimiento de
    simetría respecto del origen.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a reconocimiento de simetría respecto
    del origen.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    reconocimiento de simetría respecto del origen?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en simetrías y funciones especiales
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en simetrías y funciones especiales. Es la condición
    de existencia y unicidad en reconocimiento de simetría respecto del origen.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en reconocimiento de simetría
    respecto del origen, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica un punto $(a,b)$ de la gráfica.'
- 'Paso 2: Verifica si el punto $(-a,-b)$ también pertenece a la gráfica.'
- 'Paso 3: Si se cumple para todos los puntos, la función es impar (simétrica respecto
  al origen).'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar reconocimiento de simetría respecto del origen.
ejemplos:
- titulo: Reconocimiento en función cúbica
  enunciado: ¿Es simétrica respecto al origen la gráfica de $f(x)=x^3$?
  solucion_pasos:
  - Si $(1,1)$ está en la curva, también lo está $(-1,-1)$.
  - Se cumple la simetría rotacional respecto al origen.
  - Sí, es simétrica respecto al origen.
- titulo: Reconocimiento de ausencia de simetría impar
  enunciado: ¿Es simétrica respecto al origen la gráfica de $f(x)=x^2$?
  solucion_pasos:
  - Si $(2,4)$ está en la curva, su reflejo por rotación sería $(-2,-4)$, que NO está
    en la parábola.
  - No es simétrica respecto al origen.
- titulo: ¿Una gráfica simétrica respecto al origen corresponde siempre a una función
    impar?
  enunciado: ¿Una gráfica simétrica respecto al origen corresponde siempre a una función
    impar?
  respuesta: Sí
  solucion_pasos:
  - Esa simetría geométrica es la traducción visual exacta de la condición algebraica
    $f(-x)=-f(x)$.
- titulo: ¿La gráfica de una función impar pasa siempre por el origen (si $0$ está
    en el dominio)?
  enunciado: ¿La gráfica de una función impar pasa siempre por el origen (si $0$ está
    en el dominio)?
  respuesta: Sí
  solucion_pasos:
  - Como $f(0)=0$ es una consecuencia necesaria de la condición de imparidad, el origen
    pertenece a la gráfica.
errores_frecuentes:
- Confundir la simetría respecto al origen (impar) con la simetría respecto al eje
  $y$ (par).
- Verificar la simetría con un solo punto en vez de confirmar el patrón para toda
  la curva.
- Aplicar erróneamente una reflexión simple (respecto a un eje) en vez de la rotación
  de $180°$ respecto al origen.
- Suponer que toda curva "torcida" o no simétrica respecto al eje $y$ es automáticamente
  impar.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando reconocimiento
  de simetría respecto del origen.
