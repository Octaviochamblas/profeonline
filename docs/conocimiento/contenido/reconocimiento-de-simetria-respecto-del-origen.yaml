semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_SIMETRIA
resumen_inicial: El reconocimiento de la simetría respecto del origen $(0,0)$ identifica visualmente la propiedad de las funciones impares.
explicacion_simple: |
  La **simetría respecto al origen $(0,0)$** es una simetría de punto o de rotación:

  - Si colocas un pin en el punto $(0,0)$ y **giras todo el plano $180^\circ$**, la gráfica vuelve a calzar exactamente sobre sí misma.
  - Cada punto $(a, b)$ de la curva en el primer cuadrante tiene a su "gemelo opuesto" **$(-a, -b)$** diagonalmente al otro lado en el tercer cuadrante.
  - Esta simetría geométrica nos confirma que la función es **IMPAR** ($f(-x) = -f(x)$).
explicacion_formal: |
  Sea $G_f = \{(x, f(x)) \mid x \in \text{Dom}(f)\} \subset \mathbb{R}^2$ la gráfica de una función. $G_f$ es **simétrica respecto al origen de coordenadas $(0,0)$** si es invariante ante la inversión central $T_{(0,0)}(x, y) = (-x, -y)$:

  $$T_{(0,0)}(G_f) = G_f \iff \forall (x, y) \in G_f \implies (-x, -y) \in G_f$$

  **Consecuencia funcional:**
  $$f(-x) = -y = -f(x) \implies f \text{ es una función Impar}$$
definiciones_clave: |
  - **Simetría respecto al origen**: Invariancia de la gráfica de una función bajo una rotación de $180^\circ$ alrededor del punto central $(0,0)$.
propiedades_relaciones: |
  - **Intersección fija**: Si la función es continua y el cero pertenece a su dominio, la gráfica simétrica respecto al origen DEBE pasar obligatoriamente por la coordenada $(0,0)$.
ejemplo_guiado:
  enunciado: 'Verifica si la función $f(x) = x^3$ presenta simetría respecto del origen comprobando los puntos $(2, 8)$ y $(-2, -8)$.'
  pasos:
    - 'Paso 1: Evaluar la función en $x = 2$: $f(2) = 2^3 = 8 \implies$ punto $(2, 8)$.'
    - 'Paso 2: Evaluar la función en $x = -2$: $f(-2) = (-2)^3 = -8 \implies$ punto $(-2, -8)$.'
    - 'Paso 3: Comprobar la regla de simetría puntual: $(x, y) \to (-x, -y)$.'
    - 'Paso 4: Concluir que los puntos son simétricos respecto a $(0,0)$, confirmando que la función es IMPAR.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad algebraica posee una función cuya gráfica es simétrica respecto al origen de coordenadas?'
    choices:
      - {text: 'Es una función impar ($f(-x) = -f(x)$)', is_correct: true}
      - {text: 'Es una función par ($f(-x) = f(x)$)', is_correct: false}
      - {text: 'Es una función constante', is_correct: false}
      - {text: 'Su pendiente es siempre negativa', is_correct: false}
    explanation: 'La alternativa correcta es ''Es una función impar ($f(-x) = -f(x)$)''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si la gráfica de una función simétrica respecto al origen contiene el punto $(4, 12)$, ¿qué otro punto pertenece a la gráfica?'
    choices:
      - {text: 'El punto $(-4, -12)$', is_correct: true}
      - {text: 'El punto $(-4, 12)$', is_correct: false}
      - {text: 'El punto $(4, -12)$', is_correct: false}
      - {text: 'El punto $(12, 4)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto $(-4, -12)$''. La simetría en el origen invierte los signos de ambas coordenadas.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Fijar el centro de simetría en el origen $(0,0)$.'
  - 'Paso 2: Elegir un punto $(x_1, y_1)$ de la gráfica.'
  - 'Paso 3: Verificar que el punto diagonalmente opuesto $(-x_1, -y_1)$ también pertenezca a la gráfica.'
  - 'Paso 4: Confirmar la simetría puntual indicando que la función es impar.'
errores_correccion: |
  - **Error común:** Pensar que la simetría respecto al origen es un reflejo en el eje $X$.
  - **Cómo corregirlo:** La simetría del origen invierte **AMBOS SIGNOS A LA VEZ**: $(x, y) \to (-x, -y)$, girando $180^\circ$ la gráfica.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La simetría respecto al origen indica que la función es una parábola centrada en el eje Y.'
  - 'El punto simétrico de $(3, 7)$ respecto al origen de coordenadas es $(-3, 7)$.'
  - 'Toda función que pasa por el origen $(0,0)$ es obligatoriamente simétrica respecto a dicho punto.'
  - 'Una función simétrica respecto al origen es siempre una recta horizontal.'
  - 'Rotar una gráfica $90^\circ$ alrededor del origen conserva su definición como función matemática.'
afirmaciones_verdaderas:
  - 'La simetría central respecto al origen de coordenadas $(0,0)$ identifica geométrica y algebraicamente a las funciones impares.'
  - 'Para todo punto $(x, y)$ perteneciente a la gráfica de una función simétrica respecto al origen, el punto opuesto $(-x, -y)$ también pertenece a la gráfica.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e interpretar la simetría de una función respecto del origen de coordenadas.
  CÓMO: Verificar la invariancia ante una rotación de $180^\circ$ en $(0,0)$ y validar la presencia de puntos $(-x, -y)$.
