resumen_inicial: 'El cuadrado de un trinomio $(a + b + c)^2$ es un producto notable
  equivalente a la suma de los cuadrados de sus tres términos más la suma de sus tres
  dobles productos cruzados: $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$.'
explicacion_simple: 'Para elevar tres términos al cuadrado como $(a + b + c)^2$, sumas
  primero el cuadrado de cada uno ($a^2 + b^2 + c^2$), y luego le agregas el doble
  de cada combinación posible en parejas: $2ab$, $2ac$ y $2bc$. En total obtienes
  un polinomio de 6 términos.'
explicacion_formal: 'Para cualesquiera $a, b, c \in \mathbb{R}$, el **Cuadrado de
  Trinomio** $(a + b + c)^2$ se define por la expansión multinomial de grado 2:


  $$(a + b + c)^2 = a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$$


  **Desglose simbólico:**

  - $a^2 + b^2 + c^2$: Suma de las potencias cuadráticas de cada monomio individual.

  - $2ab$: Doble producto del primer término por el segundo.

  - $2ac$: Doble producto del primer término por el tercero.

  - $2bc$: Doble producto del segundo término por el tercero.


  > **Complemento didáctico:** Expresa la propiedad de distributividad extendida sobre
  tres sumandos, produciendo $3^2 = 9$ términos parciales que se reducen a 6 términos
  independientes.'
definiciones_clave: '- **Cuadrado de trinomio**: Identidad $(a+b+c)^2 = a^2 + b^2
  + c^2 + 2ab + 2ac + 2bc$.

  - **Dobles productos cruzados**: Términos $2ab, 2ac, 2bc$ derivados de combinar
  en parejas las variables.'
propiedades_relaciones: '- **Conmutatividad trinómica**: El orden de los tres términos
  no altera la suma de los tres cuadrados ni los tres dobles productos.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(x + y + 3)^2$ aplicando la definición de cuadrado
    de trinomio.
  pasos:
  - 'Paso 1: Identificar los tres términos $a = x, b = y, c = 3$.'
  - 'Paso 2: Calcular los tres cuadrados: $x^2 + y^2 + 3^2 = x^2 + y^2 + 9$.'
  - 'Paso 3: Calcular el primer doble producto: $2 \cdot x \cdot y = 2xy$.'
  - 'Paso 4: Calcular el segundo doble producto: $2 \cdot x \cdot 3 = 6x$.'
  - 'Paso 5: Calcular el tercer doble producto: $2 \cdot y \cdot 3 = 6y$.'
  - 'Paso 6: Ensamblar los seis términos: $x^2 + y^2 + 9 + 2xy + 6x + 6y$.'
  - 'Conclusión: El desarrollo simplificado es $x^2 + y^2 + 2xy + 6x + 6y + 9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos términos independientes resultan en total al expandir el cuadrado
    de un trinomio $(a + b + c)^2$?
  choices:
  - text: 6 términos ($3$ cuadrados $+ 3$ dobles productos)
    is_correct: true
  - text: 3 términos ($a^2 + b^2 + c^2$)
    is_correct: false
  - text: 4 términos
    is_correct: false
  - text: 9 términos sin simplificar
    is_correct: false
  explanation: La alternativa correcta es '6 términos ($3$ cuadrados $+ 3$ dobles
    productos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de $(x + y + 3)^2$, ¿cuál es el resultado del doble producto
    entre el primer y tercer término?
  choices:
  - text: $6x$, obtenido de $2 \cdot x \cdot 3$
    is_correct: true
  - text: $3x$
    is_correct: false
  - text: $9x$
    is_correct: false
  - text: $2xy$
    is_correct: false
  explanation: La alternativa correcta es '$6x$, obtenido de $2 \cdot x \cdot 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado los tres términos individualmente: $a^2 + b^2 + c^2$.'
- 'Paso 2: Calcular el doble producto del primero por el segundo $2ab$.'
- 'Paso 3: Calcular el doble producto del primero por el tercero $2ac$.'
- 'Paso 4: Calcular el doble producto del segundo por el tercero $2bc$ y sumar los
  6 términos.'
errores_correccion: '- **Error 1: Elevar solo cada término al cuadrado escribiendo
  $(a + b + c)^2 = a^2 + b^2 + c^2$.** **Cómo corregirlo:** Se DEBEN incluir los tres
  dobles productos cruzados $2ab + 2ac + 2bc$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(a + 2b + c)^2$.
  alternativas:
  - $a^2 + 4b^2 + c^2 + 4ab + 2ac + 4bc$
  - $a^2 + 4b^2 + c^2$
  - $a^2 + 2b^2 + c^2 + 2ab + 2ac + 2bc$
  respuesta: $a^2 + 4b^2 + c^2 + 4ab + 2ac + 4bc$
  solucion_pasos:
  - '1. Cuadrados: $a^2 + 4b^2 + c^2$.'
  - '2. Dobles productos: $2(a)(2b) = 4ab$, $2(a)(c) = 2ac$, $2(2b)(c) = 4bc$.'
  - '3. Resultado: $a^2 + 4b^2 + c^2 + 4ab + 2ac + 4bc$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(m + n + 1)^2$?
  alternativas:
  - $m^2 + n^2 + 1 + 2mn + 2m + 2n$
  - $m^2 + n^2 + 1$
  - $m^2 + n^2 + 2mn + 1$
  respuesta: $m^2 + n^2 + 1 + 2mn + 2m + 2n$
  solucion_pasos:
  - 1. $m^2 + n^2 + 1$.
  - 2. $2mn + 2m(1) + 2n(1) = 2mn + 2m + 2n$.
  - '3. Resultado: $m^2 + n^2 + 2mn + 2m + 2n + 1$.'
- titulo: ¿Es $x^2 + y^2 + z^2 + 2xy + 2xz + 2yz$ el desarrollo canónico de $(x +
    y + z)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, corresponde exactamente a la fórmula del cuadrado de trinomio suma.
- titulo: ¿El cuadrado de trinomio produce solo tres dobles productos independientemente
    de las variables?
  respuesta: Sí
  solucion_pasos:
  - Sí, las combinaciones posibles en parejas de 3 elementos es $\binom{3}{2} = 3$.
errores_frecuentes:
- Declarar que $(a + b + c)^2$ equivale a la suma de tres cuadrados $a^2 + b^2 + c^2$.
- Multiplicar por 3 en lugar de 2 los productos cruzados intermedios.
- Declarar que $(x + y + 1)^2$ es igual a $x^2 + y^2 + 1 + 2xy$ omitiendo $2x$ y $2y$.
- Asignar coeficientes cuadráticos a los dobles productos cruzados.
- Declarar que el cuadrado de un trinomio resulta en un trinomio.
afirmaciones_verdaderas:
- El desarrollo del cuadrado de un trinomio suma genera exactamente 6 términos en
  su forma expandida.
- Los tres primeros términos representan los cuadrados de cada sumando y son siempre
  positivos.
al_terminar_debes_poder: Al terminar serás capaz de desarrollar el cuadrado de cualquier
  trinomio suma integrando sus 3 cuadrados y sus 3 dobles productos.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Productos Notables.
