semantic_id: MAT.ALG.CUADRADO_TRINOMIO.DEFINICION
resumen_inicial: 'La definición de cuadrado de trinomio establece que elevar la suma de tres términos al cuadrado $(a+b+c)^2$ genera una expresión de seis términos compuesta por la suma de los tres cuadrados y los tres dobles productos cruzados: $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$.'
explicacion_simple: |
  El **cuadrado de trinomio** $(a + b + c)^2$ es la multiplicación de una suma de tres términos por sí misma: $(a + b + c)(a + b + c)$.
  - **FÓRMULA ALGORÍTMICA (6 términos en total)**:
    $$(a + b + c)^2 = \mathbf{a^2 + b^2 + c^2 + 2ab + 2ac + 2bc}$$
  - **Estructura en dos partes**:
    1. **Suma de los 3 cuadrados individuales**: $a^2 + b^2 + c^2$.
    2. **Suma de los 3 dobles productos combinados**: $+2ab + 2ac + 2bc$.
  - **Ejemplo**: $(x + y + 2)^2$:
    - Cuadrados: $x^2 + y^2 + 2^2 = \mathbf{x^2 + y^2 + 4}$.
    - Dobles productos: $2(x)(y) + 2(x)(2) + 2(y)(2) = \mathbf{2xy + 4x + 4y}$.
    - Resultado expandido: **$x^2 + y^2 + 4 + 2xy + 4x + 4y$**.
explicacion_formal: |
  ### Definición formal
  Sea la adición de tres monomios $(a + b + c) \in \mathbb{R}[x,y,z]$. La expansión del cuadrado de la trinomía es la forma cuadrática multinomial simétrica homogénea de grado 2 dada por:

  $$(a + b + c)^2 = \sum_{i=1}^{3} t_i^2 + 2 \sum_{1 \le i < j \le 3} t_i t_j$$

  donde $t_1 = a, t_2 = b, t_3 = c$. Desarrollando los términos de la suma de cuadrados y dobles productos mixtos:

  $$\mathbf{(a + b + c)^2 = a^2 + b^2 + c^2 + 2ab + 2ac + 2bc}$$

  ### Generalización a la Cuadrática de $N$ Términos
  La estructura demuestra el teorema general según el cual el cuadrado de un polinomio de $N$ sumandos equivale a la suma de los $N$ cuadrados individuales más el doble de las $\binom{N}{2}$ combinaciones pares de productos mixtos. Para $N=3$, genera $3 + \binom{3}{2} = 3 + 3 = 6$ términos.

  ### Síntesis didáctica
  Expandir el cuadrado de trinomio requiere calcular primero los 3 cuadrados de cada término y luego añadir los 3 dobles productos de todas las parejas posibles.
definiciones_clave: |
  - **Cuadrado de trinomio ($(a+b+c)^2$)**: Segunda potencia de la suma de tres expresiones algebraicas.
  - **Suma de tres cuadrados ($a^2 + b^2 + c^2$)**: Componente cuadrático puro formado por la elevación a 2 de cada sumando individual.
  - **Tres dobles productos mixtos ($2ab, 2ac, 2bc$)**: Componentes de interacción par formadas al multiplicar 2 por el producto de cada pareja de términos.
propiedades_relaciones: |
  - **Número total de términos**: Produce estrictamente 6 términos en su forma expandida no reducida.
  - **Positividad de los tres cuadrados**: Los términos $a^2, b^2, c^2$ son estrictamente positivos en $\mathbb{R}$ independientemente de los signos de $a, b, c$.
ejemplo_guiado:
  enunciado: 'Aplica la definición de cuadrado de trinomio para expandir $(x + y + 3)^2$.'
  pasos:
    - 'Paso 1: Identificamos los tres términos: $a = x$, $b = y$, $c = 3$.'
    - 'Paso 2: Elevamos los tres términos al cuadrado:
       x^2 + y^2 + 3^2 = \mathbf{x^2 + y^2 + 9}$.'
    - 'Paso 3: Calculamos las 3 parejas de dobles productos:
       - $2 \cdot x \cdot y = \mathbf{2xy}$.
       - $2 \cdot x \cdot 3 = \mathbf{6x}$.
       - $2 \cdot y \cdot 3 = \mathbf{6y}$.'
    - 'Paso 4: Unimos los 6 términos en una sola expresión: $x^2 + y^2 + 9 + 2xy + 6x + 6y$.'
    - 'Conclusión: La expansión completa es **$x^2 + y^2 + 9 + 2xy + 6x + 6y$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuántos términos en total genera la expansión del cuadrado de trinomio $(a+b+c)^2$ y cómo se dividen?'
    choices:
      - {text: 'Genera 6 términos: los 3 cuadrados de cada elemento ($a^2 + b^2 + c^2$) más los 3 dobles productos de todas las parejas ($2ab + 2ac + 2bc$)', is_correct: true}
      - {text: 'Genera 3 términos ($a^2 + b^2 + c^2$)', is_correct: false}
      - {text: 'Genera 4 términos', is_correct: false}
      - {text: 'Genera 9 términos', is_correct: false}
    explanation: 'La alternativa correcta es ''Genera 6 términos: los 3 cuadrados de cada elemento ($a^2 + b^2 + c^2$) más los 3 dobles productos de todas las parejas ($2ab + 2ac + 2bc$)''. 3 cuadrados + 3 dobles productos = 6 términos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la expansión de $(a + b + 1)^2$?'
    choices:
      - {text: 'El resultado es $a^2 + b^2 + 1 + 2ab + 2a + 2b$, sumando los 3 cuadrados y los 3 dobles productos', is_correct: true}
      - {text: 'El resultado es $a^2 + b^2 + 1$', is_correct: false}
      - {text: 'El resultado es $a^2 + b^2 + 1 + ab + a + b$', is_correct: false}
      - {text: 'El resultado es $a^2 + b^2 + 2ab + 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $a^2 + b^2 + 1 + 2ab + 2a + 2b$, sumando los 3 cuadrados y los 3 dobles productos''. $a^2 + b^2 + 1^2 + 2ab + 2a(1) + 2b(1) = a^2 + b^2 + 1 + 2ab + 2a + 2b$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Elevar al cuadrado cada uno de los tres términos ($a^2, b^2, c^2$).'
  - 'Paso 2: Formar las tres combinaciones en parejas: $(ab), (ac), (bc)$.'
  - 'Paso 3: Multiplicar por 2 cada una de las tres combinaciones ($2ab, 2ac, 2bc$).'
  - 'Paso 4: Sumar los 6 términos resultantes para obtener la expansión completa.'
errores_correccion: |
  - **Error 1:** Distribuir el exponente cuadrático sobre los tres sumandos (escribir $(a+b+c)^2 = a^2 + b^2 + c^2$). **Cómo corregirlo:** El cuadrado de trinomio **GENERA 6 TÉRMINOS INCLUYENDO LOS 3 DOBLES PRODUCTOS ($2ab + 2ac + 2bc$)**.
  - **Error 2:** Omisión del factor 2 en las combinaciones cruzadas (escribir $(a+b+c)^2 = a^2 + b^2 + c^2 + ab + ac + bc$). **Cómo corregirlo:** Las combinaciones **SE MULTIPLICAN OBLIGATORIAMENTE POR 2 ($2ab, 2ac, 2bc$)**.
ejemplos:
  - titulo: 'Cuadrado de trinomio simple'
    enunciado: '¿Cuál es la expansión de $(x + y + z)^2$?'
    alternativas:
      - '$x^2 + y^2 + z^2 + 2xy + 2xz + 2yz$'
      - '$x^2 + y^2 + z^2$'
      - '$x^2 + y^2 + z^2 + xy + xz + yz$'
    respuesta: '$x^2 + y^2 + z^2 + 2xy + 2xz + 2yz$'
    solucion_pasos:
      - '1. Cuadrados: $x^2 + y^2 + z^2$.'
      - '2. Dobles productos: $2xy + 2xz + 2yz$.'
      - '3. Resultado: $x^2 + y^2 + z^2 + 2xy + 2xz + 2yz$.'
  - titulo: 'Cuadrado con constante'
    enunciado: '¿Cuál es la expansión de $(x + y + 5)^2$?'
    alternativas:
      - '$x^2 + y^2 + 25 + 2xy + 10x + 10y$'
      - '$x^2 + y^2 + 25$'
      - '$x^2 + y^2 + 25 + 2xy + 5x + 5y$'
    respuesta: '$x^2 + y^2 + 25 + 2xy + 10x + 10y$'
    solucion_pasos:
      - '1. $x^2 + y^2 + 5^2 = x^2 + y^2 + 25$.'
      - '2. $2xy + 2(x)(5) + 2(y)(5) = 2xy + 10x + 10y$.'
      - '3. Resultado: $x^2 + y^2 + 25 + 2xy + 10x + 10y$.'
  - titulo: 'Positividad de cuadrados'
    enunciado: 'En la expansión de cualquier trinomio, ¿son los tres términos cuadráticos $a^2, b^2, c^2$ siempre positivos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, todo cuadrado real es no negativo.'
  - titulo: 'Cantidad de dobles productos'
    enunciado: '¿Existen exactamente tres dobles productos mixtos en el cuadrado de trinomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las parejas son $(ab), (ac), (bc)$.'
errores_frecuentes:
  - 'Distribuir la potencia 2 únicamente sobre los tres sumandos excluyendo los productos mixtos.'
  - 'La multiplicación por 2 al calcular las tres combinaciones parejas intermedias no se realiza.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Elevar al cuadrado el coeficiente 2 de los dobles productos.'
  - 'El cuadrado de la constante numérica libre no es considerado.'
afirmaciones_verdaderas:
  - 'El cuadrado de trinomio $(a+b+c)^2$ equivale a $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$.'
  - 'La expansión genera 3 términos cuadráticos individuales y 3 dobles productos pareados.'
al_terminar_debes_poder: 'Expandir el cuadrado de trinomio calculando los 3 cuadrados y los 3 dobles productos mixtos.'
