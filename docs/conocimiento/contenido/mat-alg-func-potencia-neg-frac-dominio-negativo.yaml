semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_NEGATIVO
resumen_inicial: 'El conjunto dominio de toda función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) son los reales excepto el cero: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.'
explicacion_simple: |
  En las funciones potencia de exponente entero negativo (como $x^{-1}, x^{-2}, x^{-3}$), la regla algebraica convierte la expresión en una fracción donde la variable pasa al denominador: $f(x) = \frac{a}{x^m}$. Dado que la regla fundamental de la división prohíbe dividir por cero, el valor $x = 0$ queda expulsado inmediatamente de las entradas permitidas. Cualquier otro número real (positivo o negativo) sí se puede ingresar. Por eso, su dominio son todos los reales excepto el cero: $\mathbb{R} \setminus \{0\}$.
explicacion_formal: |
  ### Definición formal
  Para toda función potencia $f: \operatorname{Dom}(f) \to \mathbb{R}$ definida por $f(x) = a \cdot x^n$ con $a \in \mathbb{R} \setminus \{0\}$ y exponente negativo **$n = -m$ ($m \in \mathbb{Z}^+$)**, la reescritura racional canónica:
  $$f(x) = \frac{a}{x^m}$$
  determina analíticamente el **dominio máximo de definición real** mediante la exclusión de la raíz del denominador:
  $$\operatorname{Dom}(f) = \{x \in \mathbb{R} \mid x^m \neq 0\} = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$$

  ### Desglose analítico de la discontinuidad
  1. **Indefinición Puntual**: En $x = 0$, la función presenta un valor no definido en los números reales ($\frac{a}{0} \notin \mathbb{R}$).
  2. **Discontinuidad Asintótica**: El punto de exclusión $x = 0$ genera una discontinuidad esencial no evitable caracterizada por una asíntota vertical en el eje de las ordenadas.

  ### Síntesis didáctica
  Comparativa de Dominios de la Función Potencia:
  - Exponente entero positivo ($n > 0$): $\operatorname{Dom}(f) = \mathbb{R}$.
  - Exponente entero negativo ($n < 0$): $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.
definiciones_clave: |
  - **Dominio con exclusión del cero $\mathbb{R} \setminus \{0\}$**: Conjunto de todos los números reales a excepción del elemento neutro aditivo.
  - **Restricción por denominador nulo**: Regla algebraica que impone $x \neq 0$ cuando la variable está dividiendo.
  - **Punto de indefinición $x = 0$**: Abscisa que no posee imagen en la función.
propiedades_relaciones: |
  - **Independencia de la paridad**: El dominio $\mathbb{R} \setminus \{0\}$ es exactamente idéntico tanto para exponentes pares negativos ($x^{-2}$) como para impares negativos ($x^{-3}$).
  - **Efecto de traslaciones horizontales**: Si la función se traslada horizontalmente $f(x) = a(x - h)^{-m}$, el valor excluido del dominio se desplaza a $x = h$, dando $\operatorname{Dom}(f) = \mathbb{R} \setminus \{h\}$.
ejemplo_guiado:
  enunciado: 'Determina el dominio de definición real de las siguientes funciones potencia justificando a partir de la restricción del denominador: A) $f(x) = -8x^{-4}$, B) $g(x) = \frac{3}{x^7}$, C) $h(x) = 0.5 x^{-1}$.'
  pasos:
    - 'Paso 1: Para $f(x) = -8x^{-4} = \frac{-8}{x^4}$, el denominador no puede ser cero: $x^4 \neq 0 \implies x \neq 0$. Dominio: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.'
    - 'Paso 2: Para $g(x) = \frac{3}{x^7}$, el exponente en el denominador es $7$. Exigimos $x^7 \neq 0 \implies x \neq 0$. Dominio: $\operatorname{Dom}(g) = \mathbb{R} \setminus \{0\}$.'
    - 'Paso 3: Para $h(x) = 0.5 x^{-1} = \frac{0.5}{x}$, la variable está en el divisor. Exigimos $x \neq 0$. Dominio: $\operatorname{Dom}(h) = \mathbb{R} \setminus \{0\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio de definición real de la función potencia con exponente negativo $f(x) = 4x^{-5} = \frac{4}{x^5}$?'
    choices:
      - {text: 'El conjunto de los números reales excepto el cero $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$', is_correct: true}
      - {text: 'El conjunto completo de todos los números reales $\mathbb{R}$', is_correct: false}
      - {text: 'El intervalo de reales estrictamente positivos $]0, +\infty[$', is_correct: false}
      - {text: 'El intervalo de reales no negativos $[0, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto de los números reales excepto el cero $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$''. La presencia de $x^5$ en el denominador indefine la función en $x = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué el valor $x = 0$ no pertenece al dominio de la función $f(x) = -2x^{-2}$?'
    choices:
      - {text: 'Porque al reescribir $f(x) = \frac{-2}{x^2}$, evaluar $x = 0$ produce una división por cero ($\frac{-2}{0}$), la cual no existe en los números reales', is_correct: true}
      - {text: 'Porque el coeficiente es un número negativo', is_correct: false}
      - {text: 'Porque el exponente 2 es un número par', is_correct: false}
      - {text: 'Porque la función potencia solo se evalúa para $x = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al reescribir $f(x) = \frac{-2}{x^2}$, evaluar $x = 0$ produce una división por cero ($\frac{-2}{0}$), la cual no existe en los números reales''. La división por cero indefine el punto.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que el exponente $n$ de la función potencia sea entero negativo ($n = -m$).'
  - 'Paso 2: Reescribir la función en forma de fracción racional $f(x) = \frac{a}{x^m}$.'
  - 'Paso 3: Formular la condición de existencia del denominador $x^m \neq 0 \implies x \neq 0$.'
  - 'Paso 4: Declarar que el dominio de definición real es $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$.'
errores_correccion: |
  - **Error 1:** Afirmar que el dominio de $f(x) = x^{-2}$ son todos los reales $\mathbb{R}$. **Cómo corregirlo:** Toda potencia con exponente negativo representa una división por $x^m$. La división por cero no existe, por lo que $x = 0$ debe ser excluido.
  - **Error 2:** Restringir el dominio a sólo reales positivos $]0, +\infty[$ en exponentes negativos. **Cómo corregirlo:** Los números negativos sí se pueden evaluar en exponentes enteros negativos (ej: $(-2)^{-3} = \frac{1}{-8} = -0.125$). El único número prohibido es el cero.
ejemplos:
  - titulo: 'Dominio de exponente par negativo'
    enunciado: '¿El dominio de $f(x) = x^{-6}$ es $\mathbb{R} \setminus \{0\}$?'
    alternativas:
      - 'Sí, $\mathbb{R} \setminus \{0\}$'
      - 'No, es $\mathbb{R}$'
      - 'No, es $[0, +\infty[$'
    respuesta: 'Sí, $\mathbb{R} \setminus \{0\}$'
    solucion_pasos:
      - '1. Reescribimos $f(x) = \frac{1}{x^6}$.'
      - '2. Exigimos $x^6 \neq 0 \implies x \neq 0 \implies \operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.'
  - titulo: 'Dominio de exponente impar negativo'
    enunciado: '¿La función $g(x) = -3x^{-3}$ tiene como dominio a $\mathbb{R} \setminus \{0\}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(x) = \frac{-3}{x^3}$, excluyendo al cero del dominio.'
  - titulo: 'Evaluación de entrada negativa'
    enunciado: '¿El número $x = -4$ pertenece al dominio de $h(x) = x^{-2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $h(-4) = \frac{1}{(-4)^2} = \frac{1}{16} \in \mathbb{R}$.'
  - titulo: 'Indefinición en el origen'
    enunciado: '¿Está indefinida la función $p(x) = 10x^{-1}$ en $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $p(0) = \frac{10}{0}$ no existe en los reales.'
errores_frecuentes:
  - 'El conjunto dominio de $f(x) = x^{-4}$ son todos los números reales $\mathbb{R}$.'
  - 'Las funciones de exponente entero negativo no aceptan números reales negativos en su dominio.'
  - 'El valor $x = 0$ pertenece al dominio de $f(x) = \frac{1}{x^3}$ dando como resultado $y = 0$.'
  - 'El dominio de $f(x) = x^{-2}$ es el intervalo cerrado $[0, +\infty[$.'
  - 'Un coeficiente negativo como $a = -5$ cambia el valor excluido del dominio a $x = -5$.'
afirmaciones_verdaderas:
  - 'El dominio de cualquier función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) es el conjunto de los reales sin el cero $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.'
  - 'La exclusión del origen $x = 0$ en el dominio es una consecuencia directa de la imposibilidad de dividir por cero en el conjunto de los números reales.'
al_terminar_debes_poder: |
  QUÉ: Determinar el dominio de funciones potencia con exponente negativo.
  CÓMO: Fundamentar la exclusión indispensable de la abscisa nula $x = 0$ debido a la división por cero ($\text{Dom} = \mathbb{R} \setminus \{0\}$).
