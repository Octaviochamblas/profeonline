semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_NEGATIVO
resumen_inicial: 'Restricción x ≠ 0 en funciones potencia con exponente entero negativo:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Exponentes negativos
  y fraccionarios.'
explicacion_simple: Al reescribir un exponente negativo como fracción, aparece una
  división que obliga a excluir el valor que anularía el denominador.
explicacion_formal: '### Definición formal


  Como $x^{-n}=1/x^n$, la expresión requiere $x^n\neq0$, lo que ocurre exactamente
  cuando $x\neq0$. Por lo tanto, el dominio de $f(x)=a\cdot x^{-n}$ es $\mathbb{R}\setminus\{0\}$,
  sin ninguna otra restricción.


  ### Desarrollo didáctico


  $f(x)=x^{-3}$ puede evaluarse en cualquier número salvo $0$: $f(2)=1/8$, $f(-5)=-1/125$,
  pero $f(0)$ no está definido, porque implicaría dividir por $0$.'
definiciones_clave: '- **Restricción x ≠ 0 en funciones potencia con exponente entero
  negativo**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a restricción x ≠ 0 en funciones potencia con exponente entero
  negativo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de restricción x ≠ 0 en funciones potencia con exponente entero negativo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de restricción x ≠ 0 en
    funciones potencia con exponente entero negativo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
