semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_APARENTE
resumen_inicial: Una fracción aparente es una fracción impropia cuyo numerador es múltiplo exacto del denominador ($b \mid a$), representando a un número entero exacto.
explicacion_simple: 'Una fracción aparente es una fracción ''disfrazada'' que en realidad equivale a un número entero completo sin partes sobrantes. Ocurre cuando dividimos el numerador entre el denominador y la división resulta ser exactamente limpia con resto cero.


  ![Identificación de fracción aparente](/static/img/nodos/identificacion-de-fraccion-aparente-intro.svg)'
explicacion_formal: 'Un racional $q = \frac{a}{b}$ es una **Fracción Aparente** si y solo si el denominador $b$ divide exactamente al numerador $a$:


  $$b \mid a \iff \exists k \in \mathbb{Z} \text{ tal que } a = k \cdot b \implies \frac{a}{b} = k \in \mathbb{Z}$$


  **Desglose de la fórmula:**

  - $b \mid a$: La división $a : b$ tiene residuo nulo en $\mathbb{Z}$.

  - $k \in \mathbb{Z}$: El cociente exacto que representa al número entero disfrazado de fracción.


  > **Complemento didáctico:** Ejemplos de fracciones aparentes son $\frac{12}{4} = 3$, $\frac{20}{5} = 4$ y $\frac{-18}{6} = -3$.'
definiciones_clave: '- **Fracción aparente**: Fracción cuyo valor representa a un entero exacto $k \in \mathbb{Z}$ porque $b \mid a$.'
propiedades_relaciones: '- **Valor entero exacto**: $\frac{a}{b} = k \in \mathbb{Z}$.'
ejemplo_guiado:
  enunciado: 'Verifique si la fracción $\frac{15}{3}$ es una fracción aparente y halle el entero al que representa.


    ![Ejemplo Identificación de fracción aparente](/static/img/nodos/identificacion-de-fraccion-aparente-ejemplos.svg)'
  pasos:
  - 'Paso 1: Realizar la división del numerador por el denominador: $15 : 3 = 5$.'
  - 'Paso 2: Comprobar el residuo de la división: $15 = 3 \cdot 5 + 0$ (resto 0).'
  - 'Paso 3: Como la división es exacta sin parte decimal ($5 \in \mathbb{Z}$), la fracción representa exactamente un entero.'
  - 'Conclusión: $\frac{15}{3}$ es una fracción aparente equivalente al entero $5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza a una fracción aparente a/b?
  choices:
  - text: Que el numerador es divisible exactamente por el denominador dando un entero sin resto
    is_correct: true
  - text: Que tiene el numerador igual a 1
    is_correct: false
  - text: Que no se puede calcular
    is_correct: false
  - text: Que da como resultado un decimal infinito
    is_correct: false
  explanation: La alternativa correcta es 'Que el numerador es divisible exactamente por el denominador dando un entero sin resto'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 15/3, ¿a qué entero exacto equivale?
  choices:
  - text: '5'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '15'
    is_correct: false
  - text: 0,2
    is_correct: false
  explanation: La alternativa correcta es '5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el numerador entre el denominador.'
- 'Paso 2: Verificar si el resto de la división es exactamente cero.'
- 'Paso 3: Clasificar la expresión como fracción aparente indicando el número entero resultante.'
errores_correccion: '- **Error 1: Confundir fracción aparente con fracción propia.** **Cómo corregirlo:** La fracción aparente representa un entero exacto (impropia especial), no un valor menor que 1.


  - **Error 2: Pensar que $\frac{10}{3}$ es aparente porque se dividió.** **Cómo corregirlo:** $10 : 3 = 3,333...$ tiene residuo, por lo que NO es aparente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes fracciones es una fracción aparente?
  alternativas:
  - 24/6
  - 24/5
  - 1/6
  respuesta: 24/6
  solucion_pasos:
  - '24 : 6 = 4 exactamente sin residuo $\implies$ es fracción aparente.'
- titulo: Ejemplo 2
  enunciado: ¿Es -16/4 una fracción aparente?
  alternativas:
  - Sí, porque equivale al entero -4
  - No, porque es negativa
  - No, porque 16 es mayor que 4
  respuesta: Sí, porque equivale al entero -4
  solucion_pasos:
  - '$-16 : 4 = -4 \in \mathbb{Z}$, por ende es aparente.'
- titulo: ¿Es 8/2 una fracción aparente?
  respuesta: Sí
  solucion_pasos:
  - Sí, $8:2=4$, representa un número entero exacto.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación y propiedades de la fracción analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de clasificación fraccionaria determinan una solución unívoca.
  - texto: No es posible clasificar la fracción
    es_correcta: false
    retroalimentacion: Incorrecto, la comparación entre numerador y denominador permite clasificarla rigurosamente.
- titulo: ¿Es 7/2 una fracción aparente?
  respuesta: 'No'
  solucion_pasos:
  - No, $7:2=3,5$ no es un entero exacto.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación y propiedades de la fracción analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios de clasificación fraccionaria determinan una solución unívoca.
  - texto: No es posible clasificar la fracción
    es_correcta: false
    retroalimentacion: Incorrecto, la comparación entre numerador y denominador permite clasificarla rigurosamente.
errores_frecuentes:
- Una fracción aparente representa una cantidad decimal con residuo distinto de cero.
- Las fracciones aparentes son fracciones propias con numerador igual a 1.
- Dividir el numerador por el denominador en una fracción aparente es imposible en los enteros.
- Toda fracción impropia se clasifica automáticamente como una fracción aparente.
- El valor numérico de una fracción aparente es siempre igual a cero.
afirmaciones_verdaderas:
- Una fracción aparente es una fracción cuyo numerador es un múltiplo exacto de su denominador.
- Las fracciones aparentes representan números enteros exactos $k \in \mathbb{Z}$.
al_terminar_debes_poder: '**QUÉ:** Identificar y simplificar fracciones aparentes reconociendo su equivalencia directa con números enteros.


  **CÓMO:** Comprobando que el numerador es múltiplo exacto del denominador ($a = k \cdot b$, con $k \in \mathbb{Z}$) mediante el algoritmo de la división con resto nulo $r = 0$.


  ![Resumen Identificación de fracción aparente](/static/img/nodos/identificacion-de-fraccion-aparente-resumen.svg)'
