semantic_id: MAT.ALG.MCD_ALGEBRAICO.CONCEPTO_MCD
resumen_inicial: El Máximo Común Divisor (M.C.D.) algebraico de dos o más expresiones
  es el término de mayor grado y mayor coeficiente numérico que las divide exactamente
  a todas.
explicacion_simple: 'El Máximo Común Divisor entre varias expresiones algebraicas
  es la expresión más grande posible que es capaz de dividir a cada una de ellas de
  forma exacta, sin dejar residuos ni fracciones.

  Pensarlo intuitivamente es como buscar el factor divisor máximo que comparten varios
  términos a la vez, lo que nos permite simplificar o extraer el factor común más
  grande posible de un grupo de expresiones.

  Si un término o variable no está presente en todas las expresiones originales, no
  puede formar parte del M.C.D. porque no podría dividirlas a todas sin dejar residuos.'
explicacion_formal: 'El **M.C.D. Algebraico** de un conjunto de polinomios o monomios
  $\{P_1(x), P_2(x), \dots, P_k(x)\}$ se define formalmente como la expresión mónica
  de mayor grado $D(x)$ que satisface:


  $$\text{M.C.D.}(P_1, P_2, \dots, P_k) = D(x) \quad \text{tal que} \quad D(x) \mid
  P_i(x) \quad \forall i \in \{1, 2, \dots, k\}$$


  **Desglose de la fórmula:**

  - $D(x)$: Representa la expresión común divisora de mayor grado posible y coeficiente
  principal positivo.

  - $D(x) \mid P_i(x)$: Simboliza la relación de divisibilidad exacta, indicando que
  la división de $P_i(x)$ entre $D(x)$ produce un polinomio o término entero sin residuo
  ($R(x) = 0$).

  - $\forall i \in \{1, 2, \dots, k\}$: Establece que la condición de división exacta
  debe cumplirse simultáneamente en cada una de las expresiones del conjunto.


  > **Complemento didáctico:** La definición asegura que $D(x)$ contiene únicamente
  los factores numéricos y literales que son compartidos por todos los términos, usando
  la menor potencia presente en el grupo.'
definiciones_clave: '- **Máximo Común Divisor (M.C.D.)**: Expresión de mayor grado
  y coeficiente que divide exactamente a un conjunto de expresiones algebraicas.

  - **Divisibilidad exacta**: Propiedad donde la división entre dos expresiones algebraicas
  resulta en un término sin resto ni exponentes negativos.'
propiedades_relaciones: '- **Unicidad salvo constante**: El M.C.D. algebraico es único
  hasta la multiplicación por una constante no nula.

  - **Extracción de factor común**: El M.C.D. representa la máxima expresión que puede
  factorizarse simultáneamente de una suma o resta de términos.'
ejemplo_guiado:
  enunciado: Dos generadores eléctricos emiten ondas representadas por las frecuencias
    $12x^3y^2$ y $18x^2y^4$. Determina el M.C.D. algebraico entre ambas expresiones
    y evalúa su valor numérico para $x = 2$ e $y = 3$.
  pasos:
  - 'Paso 1: Calcular el M.C.D. de los coeficientes numéricos $12$ y $18$. Los factores
    primos son $12 = 2^2 \cdot 3$ y $18 = 2 \cdot 3^2$, luego $\operatorname{gcd}(12,
    18) = 2^1 \cdot 3^1 = 6$.'
  - 'Paso 2: Determinar las variables comunes con sus menores exponentes. Para $x$,
    la menor potencia es $x^2$; para $y$, la menor potencia es $y^2$. Por lo tanto,
    el M.C.D. algebraico es $6x^2y^2$.'
  - 'Paso 3: Sustituir $x = 2$ e $y = 3$ en el M.C.D. obtenido: $6 \cdot (2)^2 \cdot
    (3)^2 = 6 \cdot 4 \cdot 9 = 216$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición fundamental define al M.C.D. de un conjunto de expresiones
    algebraicas?
  choices:
  - text: Es la expresión de mayor grado que divide exactamente a cada una de las
      expresiones del conjunto.
    is_correct: true
  - text: Es la expresión de menor grado que es múltiplo de todas las expresiones
      del conjunto.
    is_correct: false
  - text: Es la suma de los términos de mayor exponente de cada expresión.
    is_correct: false
  - text: Es el producto de todos los factores presentes, compartidos o no.
    is_correct: false
  explanation: La alternativa correcta es 'Es la expresión de mayor grado que divide
    exactamente a cada una de las expresiones del conjunto.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el M.C.D. de dos expresiones resulta ser $6x^2y^2$, ¿cuál es su valor
    numérico cuando $x = 2$ e $y = 3$?
  choices:
  - text: $216$
    is_correct: true
  - text: $108$
    is_correct: false
  - text: $72$
    is_correct: false
  - text: $432$
    is_correct: false
  explanation: La alternativa correcta es '$216$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente los coeficientes numéricos y las expresiones algebraicas
  dadas.'
- 'Paso 2: Identificar los factores numéricos y literales que aparecen en TODAS las
  expresiones sin excepción.'
- 'Paso 3: Asignar a cada factor común la menor potencia con la que figura en las
  expresiones originales.'
- 'Paso 4: Multiplicar los factores seleccionados para formar el M.C.D. final.'
errores_correccion: '- **Error común:** Incluir en el M.C.D. una variable que solo
  aparece en algunas de las expresiones.

  - **Cómo corregirlo:** Recuerda que para ser divisor común de todo el grupo, la
  variable debe estar presente obligatoriamente en cada uno de los términos del conjunto.'
ejemplos:
- titulo: 'Ejemplo 1: Concepto con monomios simples'
  enunciado: ¿Cuál es el M.C.D. entre $8a^2b$ y $12ab^3$?
  alternativas:
  - $4ab$
  - $2ab$
  - $24a^2b^3$
  respuesta: $4ab$
  solucion_pasos:
  - 1. El M.C.D. numérico entre $8$ y $12$ es $4$.
  - 2. Las variables comunes son $a$ (menor exponente $1$) y $b$ (menor exponente
    $1$).
  - 3. El M.C.D. algebraico resultante es $4ab$.
- titulo: 'Ejemplo 2: Identificación del término de menor potencia'
  enunciado: Entre las expresiones $15x^4y^2z$ y $25x^2y^5$, ¿por qué la variable
    $z$ no aparece en el M.C.D.?
  alternativas:
  - Porque $z$ no está presente en la segunda expresión $25x^2y^5$.
  - Porque el exponente de $z$ es $1$ y se omite.
  - Porque el M.C.D. numérico cancela las variables no numéricas.
  respuesta: Porque $z$ no está presente en la segunda expresión $25x^2y^5$.
  solucion_pasos:
  - 1. Para formar parte del M.C.D., un factor debe dividir a ambas expresiones.
  - 2. La variable $z$ no figura en $25x^2y^5$, por lo que no es un divisor común.
- titulo: ¿Es posible que el M.C.D. entre dos polinomios sea igual a $1$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Si dos expresiones no comparten ningún factor numérico distinto de $1$ ni
    ninguna variable en común, su M.C.D. es $1$ (se llaman primos entre sí).
- titulo: ¿El M.C.D. algebraico siempre tiene un grado menor o igual que cualquiera
    de las expresiones originales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de divisor, el grado del M.C.D. jamás puede superar el grado
    de las expresiones que divide.
errores_frecuentes:
- El M.C.D. de $x^3$ y $x^5$ es $x^5$ porque es la potencia más alta.
- Una variable que aparece en una sola expresión debe formar parte del M.C.D. final.
- El M.C.D. entre $4x$ y $6y$ es $2xy$.
- El M.C.D. de dos expresiones siempre coincide con su producto dividido por $2$.
- Si dos polinomios no tienen variables comunes, su M.C.D. es $0$.
afirmaciones_verdaderas:
- El M.C.D. algebraico solo incluye factores presentes en todas las expresiones del
  conjunto.
- Para cada variable común, el exponente en el M.C.D. corresponde al menor exponente
  con el que figura en los términos.
al_terminar_debes_poder: Al finalizar este recurso podrás definir el concepto de M.C.D.
  algebraico e identificar las condiciones de divisibilidad común entre expresiones.
