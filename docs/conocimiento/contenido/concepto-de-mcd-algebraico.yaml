procedimiento:
- 'Paso 1: Entiende que el MCD debe ser un divisor EXACTO de todas las expresiones
  dadas.'
- 'Paso 2: Recuerda que ''máximo'' en álgebra significa incluir todos los factores
  comunes posibles con el mayor exponente que no supere a ninguno (es decir, el menor
  exponente presente).'
- 'Paso 3: El MCD de expresiones sin factores comunes (excepto el 1) es simplemente
  1.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en concepto de m.c.d. algebraico.
ejemplos:
- titulo: Conceptualmente, ¿cuál es el MCD de $(x-1)^2$ y $(x-1)(x+2)$
  enunciado: Conceptualmente, ¿cuál es el MCD de $(x-1)^2$ y $(x-1)(x+2)$?
  solucion_pasos:
  - Ambas expresiones comparten el bloque factor $(x-1)$.
  - En la primera está elevado a 2, en la segunda a 1.
  - 'El MCD es el factor común al menor exponente: $(x-1)$.'
- titulo: ¿Cuál es el MCD conceptual de $x$ e $y$?
  solucion_pasos:
  - Como $x$ e $y$ son variables distintas y no comparten factores, el único divisor
    que tienen en común es el número 1.
- titulo: 'Respecto de «Concepto de M.C.D. algebraico»: ¿La siguiente formulación
    es correcta? «El Máxi'
  enunciado: 'Respecto de «Concepto de M.C.D. algebraico»: ¿La siguiente formulación
    es correcta? «El Máximo Común Divisor (MCD) de dos o más expresiones algebraicas
    es la expresión de mayor grado posible que es factor de todas ellas simultáneamente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El Máximo Común Divisor (MCD)
    de dos o más expresiones algebraicas es la expresión de mayor grado posible que
    es factor de todas ellas simultáneamente.'
- titulo: 'Respecto de «Concepto de M.C.D. algebraico»: ¿La siguiente conclusión es
    correcta? «Confundi'
  enunciado: 'Respecto de «Concepto de M.C.D. algebraico»: ¿La siguiente conclusión
    es correcta? «Confundir MCD con MCM (elegir el mayor exponente en lugar del menor)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El Máximo Común Divisor (MCD)
    de dos o más expresiones algebraicas es la expresión de mayor grado posible que
    es factor de todas ellas simultáneamente.'
errores_frecuentes:
- Confundir MCD con MCM (elegir el mayor exponente en lugar del menor).
- Creer que si no hay factores comunes, el MCD es 0. (¡El MCD es siempre al menos
  1!).
- El polinomio de menor grado que es múltiplo de ambos.
- Para «En álgebra, ¿qué representa el MCD de dos polinomios», la respuesta correcta
  es La suma de los polinomios.
- Para «En álgebra, ¿qué representa el MCD de dos polinomios», la respuesta correcta
  es El producto de los polinomios.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando concepto
  de m.c.d. algebraico.
