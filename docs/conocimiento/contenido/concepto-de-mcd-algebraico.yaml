semantic_id: MAT.ALG.MCD_ALGEBRAICO.CONCEPTO_MCD
resumen_inicial: El concepto de Máximo Común Divisor (M.C.D.) algebraico consiste en identificar el polinomio de mayor grado
  y coeficientes posibles que divide exactamente a dos o más expresiones algebraicas dadas.
explicacion_simple: "El **Máximo Común Divisor (M.C.D.) algebraico** entre varias expresiones (monomios o polinomios) es la\
  \ expresión algebraicamente **más grande** que entra exactamente (sin dejar resto) en cada una de ellas:\n- **REGLA DE ORO\
  \ DEL M.C.D. ALGEBRAICO**:\n  1. **Factores comunes únicamente**: El M.C.D. sólo toma en cuenta aquellos números, letras\
  \ o paréntesis que estén **presentes en TODAS las expresiones**. (Si algo no está en todas, se descarta).\n  2. **El MENOR\
  \ exponente**: De esos factores comunes, el M.C.D. se queda con la potencia de **menor exponente**.\n- **Ejemplo entre monomios\
  \ ($12x^3y^2$ y $18x^2y^5$)**:\n  - M.C.D. numérico de $12$ y $18$: **$6$**.\n  - Letra $x$: común en ambas, menor exponente\
  \ $\\implies \\mathbf{x^2}$.\n  - Letra $y$: común en ambas, menor exponente $\\implies \\mathbf{y^2}$.\n  - **M.C.D. final**:\
  \ $\\mathbf{6x^2y^2}$.\n\n![Concepto de M.C.D. algebraico](/static/img/nodos/concepto-de-mcd-algebraico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea un conjunto de polinomios $P_1(x), P_2(x), \dots, P_k(x) \in \mathbb{K}[x]$ sobre un cuerpo $\mathbb{K}$. Un polinomio
  $D(x) \in \mathbb{K}[x]$ es el **Máximo Común Divisor (M.C.D.)** de dichos polinomios, denotado $D(x) = \operatorname{MCD}(P_1,
  P_2, \dots, P_k)$, si satisface las dos propiedades fundamentales de divisibilidad:


  1. **Divisor común**: $D(x) \mid P_i(x)$ para todo $i \in \{1, 2, \dots, k\}$ (divide exactamente a cada polinomio).

  2. **Máxima divisibilidad**: Si existe otro polinomio $C(x) \in \mathbb{K}[x]$ tal que $C(x) \mid P_i(x)$ para todo $i$,
  entonces $C(x) \mid D(x)$, implicando que $\operatorname{grado}(C) \le \operatorname{grado}(D)$.


  ### Unicidad Mónica sobre Anillos de Polinomios

  Dado que en $\mathbb{K}[x]$ dos divisores máximos difieren únicamente por una constante no nula $c \in \mathbb{K} \setminus
  \{0\}$, el M.C.D. algebraico se define de forma unívoca eligiendo la representación mónica ($\operatorname{coef}_{\text{principal}}(D)
  = 1$).


  ### Síntesis didáctica

  El M.C.D. algebraico es el polinomio divisor común de mayor grado posible formado por el producto de los factores comunes
  con su menor exponente.

  '
definiciones_clave: '- **M.C.D. algebraico**: Expresión de máximo grado que divide exactamente a dos o más polinomios dados.

  - **Divisibilidad exacta ($D \mid P$)**: Propiedad por la cual la división $P(x) \div D(x)$ produce un resto nulo $R(x)
  = 0$.

  - **Factores comunes de menor exponente**: Elementos compartidos por todas las expresiones tomados elevados a su menor potencia.

  '
propiedades_relaciones: '- **Polinomios primos entre sí (coprimos)**: Si dos polinomios no comparten ningún factor común distinto
  de la unidad, su M.C.D. es $\operatorname{MCD}(P_1, P_2) = 1$.

  '
ejemplo_guiado:
  enunciado: Determina el M.C.D. entre los polinomios $P(x) = (x - 2)^3(x + 5)^2$ y $Q(x) = (x - 2)^2(x + 5)^4(x - 1)$.
  pasos:
  - 'Paso 1: Identificamos todos los factores primos presentes: $(x - 2)$, $(x + 5)$ y $(x - 1)$.'
  - 'Paso 2: Seleccionamos los factores **comunes a ambos polinomios**: - $(x - 2)$ está en ambos. - $(x + 5)$ está en ambos.
    - $(x - 1)$ sólo está en $Q(x)$, por lo que **se descarta**.'
  - 'Paso 3: Asignamos el **menor exponente** a cada factor común: - Para $(x - 2)$: Comparamos exponentes $3$ y $2 \implies$
    menor exponente es **$2$**. - Para $(x + 5)$: Comparamos exponentes $2$ y $4 \implies$ menor exponente es **$2$**.'
  - 'Paso 4: Multiplicamos los factores comunes elegidos: $(x - 2)^2(x + 5)^2$.'
  - 'Conclusión: El M.C.D. algebraico es **$(x - 2)^2(x + 5)^2$**.'
  imagen: /static/img/nodos/concepto-de-mcd-algebraico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si dos polinomios $A(x)$ y $B(x)$ no comparten ninguna variable o factor común entre sus descomposiciónes, ¿cuál
    es su M.C.D. algebraico?
  choices:
  - text: Su M.C.D. algebraico es 1, indicando que los polinomios son primos entre sí (coprimos)
    is_correct: true
  - text: Su M.C.D. algebraico es 0
    is_correct: false
  - text: Su M.C.D. algebraico es el producto $A(x) \cdot B(x)$
    is_correct: false
  - text: No existe M.C.D.
    is_correct: false
  explanation: La alternativa correcta es 'Su M.C.D. algebraico es 1, indicando que los polinomios son primos entre sí (coprimos)'.
    Por definición de polinomios coprimos sobre $\mathbb{K}[x]$, $\operatorname{MCD}(A, B) = 1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para determinar el M.C.D. entre dos expresiones algebraicas factorizadas, ¿qué criterio debe aplicarse respecto
    a los exponentes de los factores comunes?
  choices:
  - text: Se debe seleccionar únicamente los factores comunes presentes en todas las expresiones elevados a su menor exponente
    is_correct: true
  - text: Se debe seleccionar todos los factores elevados a su mayor exponente
    is_correct: false
  - text: Se debe sumar los exponentes de los factores
    is_correct: false
  - text: Se debe multiplicar los exponentes de los factores
    is_correct: false
  explanation: La alternativa correcta es 'Se debe seleccionar únicamente los factores comunes presentes en todas las expresiones
    elevados a su menor exponente'. Regla del M.C.D. algebraico.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los polinomios o expresiones dadas.'
- 'Paso 2: Identificar únicamente las bases y factores que aparezcan simultáneamente en todas las expresiones.'
- 'Paso 3: Comparar las potencias de cada factor común y seleccionar la de menor exponente.'
- 'Paso 4: Multiplicar los factores seleccionados para formar el M.C.D. algebraico final.'
errores_correccion: '- **Error 1:** Seleccionar el mayor exponente en lugar del menor exponente para los factores comunes.
  **Cómo corregirlo:** Para el M.C.D. **SE DEBE SELECCIONAR SIEMPRE EL MENOR EXPONENTE (el mayor exponente se usa para el
  m.c.m.)**.

  - **Error 2:** Incluir un factor que aparece en una sola expresión en el M.C.D. **Cómo corregirlo:** El M.C.D. **EXIGE QUE
  EL FACTOR ESTÉ PRESENTE EN TODAS Y CADA UNA DE LAS EXPRESIONES DADAS**.

  '
ejemplos:
- titulo: Factores comunes simples
  enunciado: Para $x^3y^2$ y $x^2y^4$, ¿es el M.C.D. igual a $x^2y^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, menores exponentes 2 y 2.
- titulo: Factor no común
  enunciado: Entre $a^2b$ y $a^3c$, ¿se excluyen las letras $b$ y $c$ del M.C.D.?
  respuesta: Sí
  solucion_pasos:
  - Sí, no son comunes.
- titulo: M.C.D. igual a 1
  enunciado: Para $x^2$ y $y^3$, ¿es su M.C.D. igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, son coprimos.
- titulo: Paréntesis factor común
  enunciado: Entre $(x+1)^3$ y $(x+1)^2(x-2)$, ¿es el M.C.D. $(x+1)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, menor exponente del común.
errores_frecuentes:
- Seleccionar el mayor exponente de las variables en lugar del menor exponente al calcular el M.C.D.
- Incluir factores no comunes en el resultado final del M.C.D.
- Intercambiar las reglas de cálculo del M.C.D. con las del mínimo común múltiplo (m.c.m.).
- Declarar que el M.C.D. de expresiones sin factores comunes es igual a 0 en lugar de 1.
- Olvidar que los polinomios coprimos tienen $\operatorname{MCD} = 1$.
afirmaciones_verdaderas:
- El M.C.D. algebraico está formado únicamente por el producto de los factores comunes de menor exponente.
- Si dos polinomios no poseen factores compartidos, su M.C.D. es idénticamente 1.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/concepto-de-mcd-algebraico-resumen.svg)


  QUÉ: Comprender el concepto de M.C.D. algebraico e identificar factores comunes con menor exponente.

  CÓMO: Verificar las condiciones de divisibilidad $D(x) \mid P_i(x)$ y seleccionar únicamente los factores irreducibles compartidos
  por todas las expresiones elevados a su menor potencia ($\prod [F_{\text{común}}]^{\min(e_i)}$).

  '
