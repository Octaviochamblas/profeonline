semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_COMPUESTA
resumen_inicial: 'Una traslación compuesta desplaza una función potencia tanto horizontal como verticalmente mediante el vector $\vec{v} = (h, k)$, adoptando la forma canónica $g(x) = a (x - h)^n + k$.'
explicacion_simple: |
  Una traslación compuesta combina en un solo movimiento un desplazamiento de lado (horizontal) con un desplazamiento de arriba/abajo (vertical). El término dentro del paréntesis $(x - h)$ mueve la gráfica hacia la izquierda o derecha, mientras que la constante fuera del paréntesis $+ k$ la mueve hacia arriba o abajo. Con este movimiento combinado, el punto central o vértice de la función potencia abandona el origen $(0, 0)$ y se traslada al nuevo punto de coordenadas $(h, k)$.
explicacion_formal: |
  ### Definición formal
  La **traslación compuesta de la función potencia** $f(x) = a x^n$ mediante el vector de desplazamiento bidimensional $\vec{v} = (h, k)$ es la composición de transformaciones geométricas descrita por la función:
  $$g(x) = f(x - h) + k = a (x - h)^n + k$$

  ### Mapeo cartesiano del vértice
  - **Vértice o Centro de Inflexión**: El punto nodal $(0, 0)$ de la función canónica $f(x)$ se mapea directamente a las nuevas coordenadas del plano:
    $$(0, 0) \xrightarrow{\quad \vec{v}=(h, k) \quad} (h, k)$$
  - **Mapeo General de Puntos**: Para todo par ordenado original $(x_0, y_0) \in \operatorname{Graf}(f)$, el punto transformado en $g(x)$ es $(x_0 + h, y_0 + k)$.

  ### Síntesis didáctica
  Identificación directa del vértice $(h, k)$:
  1. La abscisa $h$ se obtiene al igualar el binomio interno a cero: $x - h = 0 \implies x = h$.
  2. La ordenada $k$ corresponde al término constante independiente externo.
definiciones_clave: |
  - **Traslación compuesta $a(x - h)^n + k$**: Transformación rígida combinada en los ejes $x$ e $y$.
  - **Vector de traslación $\vec{v} = (h, k)$**: Vector que especifica la dirección y magnitud del desplazamiento bidimensional.
  - **Centro trasladado $(h, k)$**: Nuevo vértice o punto de inflexión cartesiano de la gráfica.
propiedades_relaciones: |
  - **Independencia de componentes**: El desplazamiento horizontal $h$ no afecta el desplazamiento vertical $k$ y viceversa.
  - **Modificación del Recorrido por $k$**: En funciones de exponente par, el conjunto recorrido depende únicamente de $a$ y de la constante vertical $k$ ($\operatorname{Rec}(g) = [k, +\infty[$ si $a > 0$, o $\operatorname{Rec}(g) = ]-\infty, k]$ si $a < 0$).
ejemplo_guiado:
  enunciado: 'Determina la fórmula, el vector de traslación $\vec{v}$, las coordenadas del nuevo vértice y el recorrido para la función potencia $f(x) = 2x^2$ trasladada $3$ unidades a la derecha y $5$ unidades hacia abajo.'
  pasos:
    - 'Paso 1: Traslación horizontal de $h = 3$ a la derecha sustituye $x$ por $(x - 3)$.'
    - 'Paso 2: Traslación vertical de $k = -5$ hacia abajo resta $5$ al final. Fórmula: $g(x) = 2(x - 3)^2 - 5$.'
    - 'Paso 3: Vector de traslación: $\vec{v} = (3, -5)$. Vértice en $(h, k) = (3, -5)$.'
    - 'Paso 4: Como $a = 2 > 0$ y exponente par, la cota mínima del recorrido es $k = -5 \implies \operatorname{Rec}(g) = [-5, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las coordenadas del vértice de la parábola dada por la función potencia trasladada $g(x) = -3(x - 4)^2 + 9$?'
    choices:
      - {text: 'El punto de coordenadas $(4, 9)$', is_correct: true}
      - {text: 'El punto de coordenadas $(-4, 9)$', is_correct: false}
      - {text: 'El punto de coordenadas $(4, -9)$', is_correct: false}
      - {text: 'El punto de coordenadas $(-3, 9)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(4, 9)$''. El binomio $(x - 4)$ se anula en $x = 4$ y la constante externa es $k = 9$, fijando el vértice en $(h, k) = (4, 9)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la gráfica de $f(x) = x^3$ se desplaza según el vector $\vec{v} = (-2, 6)$, ¿cuál es la fórmula de la función trasladada resultante?'
    choices:
      - {text: '$g(x) = (x + 2)^3 + 6$', is_correct: true}
      - {text: '$g(x) = (x - 2)^3 + 6$', is_correct: false}
      - {text: '$g(x) = (x + 2)^3 - 6$', is_correct: false}
      - {text: '$g(x) = (x - 6)^3 - 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = (x + 2)^3 + 6$''. Para $h = -2$, se escribe $(x - (-2))^3 = (x + 2)^3$, y para $k = 6$, se suma $+6$ por fuera.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el valor de traslación horizontal $h$ y vertical $k$ en $f(x) = a (x - h)^n + k$.'
  - 'Paso 2: Calcular las coordenadas del vértice o punto de referencia en $(h, k)$.'
  - 'Paso 3: Escribir el vector de traslación $\vec{v} = (h, k)$.'
  - 'Paso 4: Trazar la gráfica de la función potencia base centrada en el nuevo origen de coordenadas $(h, k)$.'
errores_correccion: |
  - **Error 1:** Invertir las coordenadas del vértice escribiendo $(k, h)$ en lugar de $(h, k)$. **Cómo corregirlo:** La coordenada horizontal $h$ proviene del paréntesis $(x - h)$ y es la abscisa. La constante aditiva externa $k$ es la ordenada vertical. El vértice es $(h, k)$.
  - **Error 2:** Alterar el signo de $k$ creyendo que también funciona al revés como $h$. **Cómo corregirlo:** El parámetro $h$ dentro de $(x - h)$ requiere invertir su signo visual, pero la constante externa $k$ conserva su signo directo (+ es hacia arriba, - es hacia abajo).
ejemplos:
  - titulo: 'Identificación de vértice compuesto'
    enunciado: '¿El vértice de $f(x) = (x - 1)^4 + 5$ se ubica en $(1, 5)$?'
    alternativas:
      - 'Sí, en $(1, 5)$'
      - 'No, en $(-1, 5)$'
      - 'No, en $(1, -5)$'
    respuesta: 'Sí, en $(1, 5)$'
    solucion_pasos:
      - '1. Abscisa $x - 1 = 0 \implies h = 1$.'
      - '2. Ordenada $k = 5$. Vértice en $(1, 5)$.'
  - titulo: 'Formulación desde vector de traslación'
    enunciado: 'Para $\vec{v} = (3, -4)$, ¿la función $f(x) = x^2$ se transforma en $g(x) = (x - 3)^2 - 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reemplazamos $h = 3$ y $k = -4 \implies g(x) = (x - 3)^2 - 4$.'
  - titulo: 'Recorrido en traslación compuesta'
    enunciado: '¿El recorrido de $g(x) = 2(x + 4)^2 + 10$ es $[10, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $a = 2 > 0$, el valor mínimo del vértice es $y = 10 \implies \operatorname{Rec}(g) = [10, +\infty[$.'
  - titulo: 'Punto de inflexión compuesto'
    enunciado: '¿El punto de inflexión de $h(x) = (x - 7)^3 - 2$ es $(7, -2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Las coordenadas $(h, k)$ de la potencia impar son $(7, -2)$.'
errores_frecuentes:
  - 'El vértice de la función potencia $f(x) = (x - 3)^2 + 4$ se ubica en $(-3, 4)$.'
  - 'La constante $k = 5$ en $f(x) = (x - 2)^3 + 5$ afecta a la abscisa del vértice.'
  - 'La traslación compuesta altera la paridad o el exponente $n$ de la función potencia.'
  - 'El recorrido de $f(x) = (x - 2)^4 + 3$ se mantiene en $[0, +\infty[$ sin verse afectado por el $+3$.'
  - 'Interpretar el vector $\vec{v} = (-1, -2)$ como una traslación hacia la derecha y arriba.'
afirmaciones_verdaderas:
  - 'La traslación compuesta de una función potencia $f(x) = a x^n$ mediante el vector $\vec{v} = (h, k)$ genera la función canónica $g(x) = a (x - h)^n + k$.'
  - 'El nuevo centro o vértice de la función potencia desfasada se posiciona exactamente en las coordenadas cartesianas $(h, k)$.'
al_terminar_debes_poder: |
  QUÉ: Analizar traslaciones compuestas $f(x) = a(x - h)^n + k$.
  CÓMO: Determinar las nuevas coordenadas del punto nodal $(h, k)$ desplazando la curva base en ambas direcciones cartesianas.
