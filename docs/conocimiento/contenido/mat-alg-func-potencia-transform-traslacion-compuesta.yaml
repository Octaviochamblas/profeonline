semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_COMPUESTA
resumen_inicial: 'Análisis de traslaciones horizontales y verticales combinadas: forma
  general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones y escalas.'
explicacion_simple: Cuando una función combina ambos tipos de traslación, el nuevo
  punto de referencia se mueve simultáneamente en dos direcciones.
explicacion_formal: '### Definición formal


  Combinando ambas traslaciones, $f(x)=a(x-h)^n+k$ traslada cada punto $(x_0,y_0)$
  de $g(x)=a\cdot x^n$ al punto $(x_0+h,y_0+k)$. El punto de referencia de la curva,
  antes en $(0,0)$, pasa a ubicarse en $(h,k)$.


  ### Desarrollo didáctico


  $f(x)=(x-2)^2+5$: se traslada $2$ unidades a la derecha y $5$ hacia arriba. Su vértice,
  antes en $(0,0)$, ahora está en $(2,5)$, lo que se confirma evaluando $f(2)=5$.'
definiciones_clave: '- **Análisis de traslaciones horizontales y verticales combinadas**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de traslaciones horizontales y verticales combinadas.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de traslaciones horizontales y verticales combinadas.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de traslaciones
    horizontales y verticales combinadas.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar análisis de traslaciones horizontales y verticales combinadas?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en análisis de traslaciones horizontales y verticales combinadas?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica los valores de $h$ (dentro del paréntesis) y $k$ (sumado fuera).'
- 'Paso 2: Determina el nuevo punto de referencia como $(h,k)$.'
- 'Paso 3: Traza la gráfica básica y desplázala simultáneamente en ambas direcciones.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en análisis de traslaciones horizontales y verticales combinadas.
ejemplos:
- titulo: Identificación de ambos desplazamientos
  enunciado: ¿Cuál es el nuevo punto de referencia de $f(x)=(x-3)^2-4$?
  solucion_pasos:
  - Se identifica $h=3$ y $k=-4$.
  - El nuevo punto de referencia es $(3,-4)$.
- titulo: Verificación numérica del punto trasladado
  enunciado: Verifica que $(2,5)$ es el vértice de $f(x)=(x-2)^2+5$.
  solucion_pasos:
  - Se evalúa $f(2)=(2-2)^2+5=0+5=5$.
  - Se confirma que el punto $(2,5)$ pertenece a la gráfica y corresponde al vértice.
- titulo: ¿El orden en que se aplican ambas traslaciones afecta el resultado final?
  enunciado: ¿Cambia el resultado final si se traslada primero horizontalmente y luego
    verticalmente, o al revés?
  respuesta: 'No'
  solucion_pasos:
  - Ambas traslaciones son independientes entre sí y el resultado final es el mismo
    sin importar el orden.
- titulo: ¿Una traslación compuesta cambia la forma de la curva?
  enunciado: ¿La traslación compuesta cambia la forma general de la curva (copa, s,
    etc.)?
  respuesta: 'No'
  solucion_pasos:
  - Solo cambia la posición del punto de referencia; la forma de la curva permanece
    igual.
errores_frecuentes:
- Confundir el signo de $h$ en la traslación horizontal, invirtiendo la dirección.
- Aplicar el signo de $k$ de forma invertida, cuando en la vertical coincide con la
  dirección real.
- Ubicar el punto de referencia como $(k,h)$ en vez de $(h,k)$.
- No verificar el resultado evaluando $f(h)=k$ para confirmar el punto trasladado.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  análisis de traslaciones horizontales y verticales combinadas.
