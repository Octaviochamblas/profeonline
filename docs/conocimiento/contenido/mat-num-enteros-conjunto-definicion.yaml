semantic_id: MAT.NUM.ENTEROS_CONJUNTO.DEFINICION
resumen_inicial: "Los números enteros $\\mathbb{Z}$ incluyen los negativos, el cero y los positivos, y se extienden infinitamente en ambos sentidos: sirven para representar cantidades con dirección, como deudas o temperaturas."
explicacion_simple: |
  Si tienes 5 pesos y gastas 8, no te quedan 0 — te quedan menos 3, es decir, debes 3. Para escribir
  esa idea se inventaron los números negativos: -1, -2, -3… El conjunto de todos estos números
  juntos —negativos, cero y positivos— se llama números enteros: una familia que incluye a los de
  contar, el cero y los "de deuda".
explicacion_formal: |
  El conjunto de los números enteros, $\mathbb{Z}$, amplía los naturales para que la sustracción sea
  siempre posible. Se compone de tres subconjuntos: $\mathbb{Z}^+=\{1,2,3,\ldots\}$, el cero
  $\{0\}$, y $\mathbb{Z}^-=\{-1,-2,-3,\ldots\}$, de modo que
  $\mathbb{Z}=\mathbb{Z}^- \cup \{0\} \cup \mathbb{Z}^+$.
definiciones_clave: |
  **Número entero**: elemento de $\mathbb{Z}=\{\ldots,-2,-1,0,1,2,\ldots\}$. **Clausura de la
  sustracción**: en $\mathbb{Z}$, restar dos enteros siempre da otro entero, a diferencia de
  $\mathbb{N}$.
propiedades_relaciones: |
  $\mathbb{N} \subset \mathbb{Z}$: todo natural es entero. $\mathbb{Z}$ es infinito en ambos sentidos
  (no tiene primer ni último elemento), a diferencia de $\mathbb{N}$, que sí tiene primer elemento.
ejemplo_guiado:
  enunciado: "Un buzo sube 3 metros desde -8 metros de profundidad. ¿Qué número entero representa su nueva posición?"
  pasos:
    - "Se identifica la posición inicial: $-8$ (bajo el nivel del mar)."
    - "Subir se traduce como sumar: $-8 + 3$."
    - "Se calcula: $-8 + 3 = -5$."
    - "La nueva posición es $-5$, que sigue siendo un número entero negativo."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de los siguientes subconjuntos NO forma parte de la definición de $\\mathbb{Z}$?"
    choices:
      - {text: "$\\mathbb{Z}^+$", is_correct: false}
      - {text: "$\\{0\\}$", is_correct: false}
      - {text: "$\\mathbb{Z}^-$", is_correct: false}
      - {text: "Los números decimales", is_correct: true}
    explanation: "La correcta es Los números decimales, porque $\\mathbb{Z}$ se compone solo de $\\mathbb{Z}^+$, $\\{0\\}$ y $\\mathbb{Z}^-$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿qué número representa a un submarino que baja 4 metros desde -6 metros?"
    choices:
      - {text: "$-10$", is_correct: true}
      - {text: "$-2$", is_correct: false}
      - {text: "$10$", is_correct: false}
      - {text: "$2$", is_correct: false}
    explanation: "La correcta es $-10$, porque bajar se suma como negativo: $-6 + (-4) = -10$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los componentes del conjunto: positivos, negativos y el cero."
  - 'Paso 2: Representar el conjunto por extensión como $\{\ldots, -3, -2, -1, 0, 1, 2, 3, \ldots\}$.'
  - "Paso 3: Validar que cualquier número natural se puede expresar como un entero positivo sin signo o precedido por un $+$, y su opuesto como un negativo con signo $-$."
errores_correccion: |
  Un error frecuente es pensar que $\mathbb{Z}$ tiene un primer elemento como $-1$: en realidad no
  tiene ni primer ni último elemento, porque es infinito en ambos sentidos. Otro error es confundir
  los enteros negativos con "naturales con signo": son negativos porque son menores que cero, no
  porque sean un simple cambio de signo de un natural.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Escriba por extensión los enteros que se encuentran estrictamente entre $-3$ y $2$."
    alternativas:
      - '$\{-2, -1, 0, 1\}$'
      - '$\{-3, -2, -1, 0, 1, 2\}$'
      - '$\{-2, -1, 0, 1, 2\}$'
    respuesta: '$\{-2, -1, 0, 1\}$'
    solucion_pasos:
      - "Identificar los límites del intervalo: $-3$ y $2$ (excluidos)."
      - "Listar los enteros a la derecha de $-3$ y a la izquierda de $2$."
      - 'El conjunto resultante es $\{-2, -1, 0, 1\}$.'
  - titulo: "Ejemplo 2"
    enunciado: '¿Cuál es la principal diferencia entre el conjunto $\mathbb{N}$ y el conjunto $\mathbb{Z}$ respecto a su extensión?'
    alternativas:
      - '$\mathbb{Z}$ es infinito en ambos sentidos; $\mathbb{N}$ solo hacia la derecha'
      - '$\mathbb{N}$ es infinito en ambos sentidos; $\mathbb{Z}$ solo hacia la derecha'
      - 'Ambos son infinitos solo hacia la derecha'
    respuesta: '$\mathbb{Z}$ es infinito en ambos sentidos; $\mathbb{N}$ solo hacia la derecha'
    solucion_pasos:
      - 'Se reconoce que $\mathbb{N}$ tiene un primer elemento (1) y es infinito a la derecha.'
      - 'Se reconoce que $\mathbb{Z}$ no tiene primer elemento ni último elemento.'
      - 'Conclusión: $\mathbb{Z}$ es infinito en ambos sentidos, mientras que $\mathbb{N}$ es infinito en un solo sentido.'
  - titulo: '¿Pertenece $-5$ al conjunto $\mathbb{Z}$?'
    respuesta: "Sí"
    solucion_pasos:
      - '$\mathbb{Z}$ incluye todos los enteros positivos, el cero y los negativos.'
      - '$-5$ es un entero negativo ($-5 \in \mathbb{Z}^-$).'
      - 'Por lo tanto, $-5 \in \mathbb{Z}$.'
  - titulo: '¿Pertenece $0{,}5$ al conjunto $\mathbb{Z}$?'
    respuesta: "No"
    solucion_pasos:
      - "$0{,}5$ es un número decimal, no un número entero."
      - '$\mathbb{Z}$ contiene únicamente números sin parte decimal.'
      - 'Por lo tanto, $0{,}5 \notin \mathbb{Z}$.'
errores_frecuentes:
  - 'El conjunto $\mathbb{Z}$ tiene un primer elemento: el $-1$.'
  - "Los números decimales como $1{,}5$ son números enteros positivos."
  - '$\mathbb{Z}$ y $\mathbb{N}$ son el mismo conjunto porque ambos tienen infinitos elementos.'
  - 'El cero no pertenece al conjunto $\mathbb{Z}$.'
  - "Los números enteros negativos son lo mismo que los números naturales con signo negativo."
afirmaciones_verdaderas:
  - "El conjunto de los números enteros incluye a los números negativos."
  - "Los números enteros se extienden infinitamente en ambos sentidos de la recta numérica."
al_terminar_debes_poder: |
  Reconocer si un número pertenece a $\mathbb{Z}$, identificar a cuál de sus tres subconjuntos
  pertenece ($\mathbb{Z}^+$, $\{0\}$ o $\mathbb{Z}^-$), y usar enteros para representar situaciones
  con dirección o balance (deudas, profundidades, temperaturas).

fuente: "Manual Esencial Santillana p.48"
estado: publicado
