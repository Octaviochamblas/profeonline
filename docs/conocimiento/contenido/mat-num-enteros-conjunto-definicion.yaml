    is_correct: false
  - text: -5, perteneciente a N0
    is_correct: false
  - text: 0, perteneciente a Z
    is_correct: false
  explanation: La alternativa correcta es '-5, perteneciente a Z'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la operación o verificar el número dado.'
- 'Paso 2: Comprobar que sea una unidad completa sin partes fraccionarias.'
- 'Paso 3: Concluir su pertenencia a $\mathbb{Z}$ independientemente de si su signo es positivo, negativo o neutro.'
errores_correccion: '- **Error 1: Pensar que el cero posee un signo explícito como positivo o negativo.** **Cómo corregirlo:** El cero es el elemento neutro de $\mathbb{Z}$ y carece de signo (no es ni positivo ni negativo).


  - **Error 2: Creer que el conjunto $\mathbb{Z}$ incluye números fraccionarios o decimales negativos.** **Cómo corregirlo:** $\mathbb{Z}$ contiene únicamente unidades enteras completas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Indique a cuál conjunto pertenece el resultado de $-12 + 3$.
  alternativas:
  - Solo a Z
  - A N y a Z
  - Solo a N0
  respuesta: Solo a Z
  solucion_pasos:
  - $-12 + 3 = -9$. Es un entero negativo, por ende solo pertenece a $\mathbb{Z}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la relación de inclusión correcta entre N, N0 y Z?
  alternativas:
  - N c N0 c Z
  - Z c N0 c N
  - N0 c N c Z
  respuesta: N c N0 c Z
  solucion_pasos:
  - 'Todo natural es cardinal y todo cardinal es entero: $\mathbb{N} \subset \mathbb{N}_0 \subset \mathbb{Z}$.'
- titulo: ¿El número -4 pertenece al conjunto Z?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-4$ es un entero negativo perteneciente a $\mathbb{Z}$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
- titulo: ¿Posee el conjunto Z un primer elemento mínimo en su extremo izquierdo?
  respuesta: 'No'
  solucion_pasos:
  - No, el conjunto $\mathbb{Z}$ es infinito en ambas direcciones.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
errores_frecuentes:
- El conjunto de los números enteros $\mathbb{Z}$ posee un primer elemento mínimo en su extremo izquierdo.
- El número cero se clasifica oficialmente como un entero de signo positivo.
- Los números racionales fraccionarios como $-\frac{1}{2}$ pertenecen al conjunto de los enteros $\mathbb{Z}$.
- La unión de los enteros positivos y los negativos completa exactamente la totalidad del conjunto $\mathbb{Z}$.
- La división de dos números enteros cualesquiera produce siempre un resultado perteneciente a $\mathbb{Z}$.
afirmaciones_verdaderas:
- El conjunto de los números enteros $\mathbb{Z}$ es la unión de los enteros positivos, los enteros negativos y el cero.
- Todo número natural pertenece al conjunto de los enteros $\mathbb{Z}$.
al_terminar_debes_poder: '**QUÉ:** Definir, estructurar y justificar el conjunto de los números enteros $\mathbb{Z}$ como extensión de $\mathbb{N}$.


  **CÓMO:** Estructurando la partición $\mathbb{Z} = \mathbb{Z}^- \cup \{0\} \cup \mathbb{Z}^+$ y aplicando la clausura de la sustracción $a - b \in \mathbb{Z}$.


  ![Resumen Definición de los Números Enteros (Z) como extensión de N](/static/img/nodos/definicion-de-los-numeros-enteros-z-como-extension-de-n-resumen.svg)'
