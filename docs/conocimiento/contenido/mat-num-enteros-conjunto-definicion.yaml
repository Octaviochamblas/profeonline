semantic_id: MAT.NUM.ENTEROS_CONJUNTO.DEFINICION
resumen_inicial: 'El conjunto de los números enteros $\mathbb{Z}$ reúne los enteros positivos, los negativos y el cero: $\mathbb{Z} = \{\dots, -2, -1, 0, 1, 2, \dots\}$.'
explicacion_simple: 'El conjunto de los números enteros nace de la necesidad de representar situaciones opuestas a los números naturales, como deudas, temperaturas bajo cero o profundidades por debajo del nivel del mar. Para esto, se extienden los naturales agregando el cero y los números negativos, formando una recta donde cada entero positivo tiene un reflejo idéntico al otro lado del cero.


  ![Definición de los Números Enteros (Z) como extensión de N](/static/img/nodos/definicion-de-los-numeros-enteros-z-como-extension-de-n-intro.svg)'
explicacion_formal: 'El conjunto de los **Números Enteros**, denotado por $\mathbb{Z}$, se define como la unión de los enteros positivos $\mathbb{Z}^+$, el conjunto formado por el cero $\{0\}$ y los enteros negativos $\mathbb{Z}^-$:


  $$\mathbb{Z} = \mathbb{Z}^- \cup \{0\} \cup \mathbb{Z}^+ = \{\ldots, -3, -2, -1, 0, 1, 2, 3, \ldots\}$$


  **Desglose de la fórmula:**

  - $\mathbb{Z}$: Símbolo asignado al conjunto de todos los números enteros (del alemán *Zahlen*).

  - $\mathbb{Z}^+$: Subconjunto de enteros positivos, equivalente a los naturales ($\mathbb{Z}^+ = \mathbb{N}$).

  - $\mathbb{Z}^-$: Subconjunto de enteros negativos $\{\ldots, -3, -2, -1\}$.


  > **Complemento didáctico:** A diferencia de $\mathbb{N}$ y $\mathbb{N}_0$, el conjunto $\mathbb{Z}$ es infinito en ambas direcciones y no posee ni primer ni último elemento absoluto.'
definiciones_clave: '- **Número entero**: Elemento de $\mathbb{Z} = \{\dots, -2, -1, 0, 1, 2, \dots\}$, correspondiente a una unidad entera positiva, negativa o neutra.

  - **Extensión entera**: Proceso algebraico de incorporar los opuestos aditivos negativos para resolver sustracciones donde el minuendo es menor que el sustraendo.'
propiedades_relaciones: '- **Cadena de inclusión**: $\mathbb{N} \subset \mathbb{N}_0 \subset \mathbb{Z}$.

  - **Clausura aditiva y multiplicativa**: La suma, resta y multiplicación de dos números enteros resulta siempre en otro número entero.'
ejemplo_guiado:
  enunciado: '¿A qué conjunto numérico pertenece el resultado de la sustracción $4 - 9$: a $\mathbb{N}$, a $\mathbb{N}_0$ o a $\mathbb{Z}$?


    ![Ejemplo Definición de los Números Enteros (Z) como extensión de N](/static/img/nodos/definicion-de-los-numeros-enteros-z-como-extension-de-n-ejemplos.svg)'
  pasos:
  - 'Paso 1: Efectuar la resta con minuendo menor: $4 - 9 = -5$.'
  - 'Paso 2: Comprobar la pertenencia: $-5 \notin \mathbb{N}$ y $-5 \notin \mathbb{N}_0$ por ser una cantidad negativa.'
  - 'Paso 3: Verificar que $-5 \in \mathbb{Z}$ al ser un entero negativo.'
  - 'Conclusión: El resultado pertenece al conjunto de los enteros $\mathbb{Z}$.'
