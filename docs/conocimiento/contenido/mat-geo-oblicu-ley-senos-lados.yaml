semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.LEY_SENOS_LADOS
resumen_inicial: 'Cálculo de lados mediante la ley de senos: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Cuando se conoce un lado con su ángulo opuesto, y además otro
  ángulo del triángulo, se puede despejar cualquier otro lado usando la proporcionalidad
  de la ley de senos.
explicacion_formal: '![Cálculo de lados con ley de senos](/static/img/geometria/trigonometria/oblicu-ley-senos-lados.svg)


  ### Definición formal


  De la proporción $\dfrac{a}{\sin A}=\dfrac{b}{\sin B}$, se despeja $b=\dfrac{a\cdot\sin
  B}{\sin A}$.


  ### Desarrollo didáctico


  Si $a=10$, $A=40°$ y $B=70°$, entonces $b=\dfrac{10\cdot\sin70°}{\sin40°}\approx\dfrac{10\times0{,}940}{0{,}643}\approx14{,}6$.'
definiciones_clave: '- **Cálculo de lados mediante la ley de senos**: Elemento o propiedad
  fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo de lados mediante la ley de senos.'
ejemplo_guiado:
  enunciado: Para analizar cálculo de lados mediante la ley de senos, considera un
    ángulo $\alpha = 68^\circ$ ubicado en la posición dada. Determina el valor de
    la medida asociada sabiendo que $x + 1151^\circ = 68^\circ$.
  pasos:
  - Identificar la propiedad de cálculo de lados mediante la ley de senos referida
    a $\alpha = 68^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1151 = 68 \implies x = 68 - 1151$.'
  - Concluir que la medida calculada para cálculo de lados mediante la ley de senos
    es $x = -1083^\circ$.
