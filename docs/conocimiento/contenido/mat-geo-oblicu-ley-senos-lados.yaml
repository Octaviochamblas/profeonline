procedimiento:
- 'Paso 1: Identifica el lado y ángulo opuesto conocidos (el par completo).'
- 'Paso 2: Identifica el ángulo opuesto al lado que se busca.'
- 'Paso 3: Despeja el lado desconocido: lado=lado_conocido×sin(ángulo buscado opuesto)/sin(ángulo
  conocido opuesto).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo de lados mediante la ley de senos.
