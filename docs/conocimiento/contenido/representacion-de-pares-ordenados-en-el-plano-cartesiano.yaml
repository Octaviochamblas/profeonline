semantic_id: MAT.FUND.PRODUCTO_CARTESIANO.REPRESENTACION_PLANO_CARTESIANO
resumen_inicial: 'Geometrización del producto cartesiano: ejes ortogonales ($X$ e $Y$), origen $(0, 0)$, los 4 cuadrantes y ubicación unívoca de pares ordenados $(x, y)$ en $\mathbb{R}^2$.'
explicacion_simple: |
  El **plano cartesiano** es una herramienta geométrica inventada por René Descartes que permite **dibujar pares ordenados como puntos en una superficie plana**:
  - Está formado por **dos rectas numéricas perpendiculares** que se cruzan en el **origen $(0, 0)$**.
  - El eje horizontal es el **eje $X$ (eje de las abscisas)**: los positivos van a la derecha y los negativos a la izquierda.
  - El eje vertical es el **eje $Y$ (eje de las ordenadas)**: los positivos van hacia arriba y los negativos hacia abajo.
  - Para ubicar un par **$(x, y)$**: nos movemos $x$ unidades horizontalmente desde el origen y luego $y$ unidades verticalmente.
  - Los ejes dividen al plano en **$4$ cuadrantes** (I, II, III y IV), numerados en sentido antihorario.
explicacion_formal: |
  ### Definición formal
  El **plano cartesiano euclídeo bidimensional** es el espacio producto topológico $\mathbb{R}^2 = \mathbb{R} \times \mathbb{R}$ dotado del sistema de coordenadas ortogonales afín canónico:
  $$\forall P \in \mathbb{R}^2, \quad P = (x, y) \quad \text{con } x, y \in \mathbb{R}$$
  La biyección entre el espacio geométrico de puntos y el conjunto de pares ordenados $\mathbb{R} \times \mathbb{R}$ viene dada por las proyecciones ortogonales sobre las rectas reales orientadas $\mathcal{X}$ e $\mathcal{Y}$.

  ### Estructura de Cuadrantes y Signos
  $$\begin{aligned}
  \text{Cuadrante I} &: \{(x, y) \in \mathbb{R}^2 \mid x > 0 \land y > 0\} \\
  \text{Cuadrante II} &: \{(x, y) \in \mathbb{R}^2 \mid x < 0 \land y > 0\} \\
  \text{Cuadrante III} &: \{(x, y) \in \mathbb{R}^2 \mid x < 0 \land y < 0\} \\
  \text{Cuadrante IV} &: \{(x, y) \in \mathbb{R}^2 \mid x > 0 \land y < 0\}
  \end{aligned}$$
  - **Puntos sobre los ejes**:
    - Eje de las abscisas ($X$): $\{(x, 0) \mid x \in \mathbb{R}\}$.
    - Eje de las ordenadas ($Y$): $\{(0, y) \mid y \in \mathbb{R}\}$.
    - Origen de coordenadas: $(0, 0) = \mathcal{X} \cap \mathcal{Y}$.

  ### Síntesis didáctica
  El plano cartesiano establece el puente fundacional entre el álgebra discreta y la geometría analítica continua.
definiciones_clave: |
  - **Plano cartesiano ($\mathbb{R}^2$)**: Espacio geométrico bidimensional generado por el producto $\mathbb{R} \times \mathbb{R}$.
  - **Abscisa (coordenada $x$)**: Desplazamiento horizontal relativo sobre el eje $X$.
  - **Ordenada (coordenada $y$)**: Desplazamiento vertical relativo sobre el eje $Y$.
  - **Cuadrantes cartesianos**: Las 4 regiones angulares abiertas delimitadas por los ejes coordenados ortogonales.
propiedades_relaciones: |
  - **Distancia euclídea**: $d(P_1, P_2) = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$.
  - **Representación de productos finitos**: Para $A, B \subset \mathbb{R}$ finitos, $A \times B$ es una grilla discreta rectangular de puntos.
ejemplo_guiado:
  enunciado: 'Dado el punto $P = (-3, 4)$, describe el procedimiento para ubicarlo en el plano cartesiano, identifica el cuadrante al que pertenece y determina las coordenadas de su simétrico respecto al eje $X$.'
  pasos:
    - 'Paso 1: Identificar las componentes del punto:
      - Abscisa: $x = -3$.
      - Ordenada: $y = 4$.'
    - 'Paso 2: Trazar el desplazamiento desde el origen $(0, 0)$:
      - Moverse $3$ unidades hacia la izquierda sobre el eje $X$ hasta $-3$.
      - Desde esa posición, subir $4$ unidades verticalmente en paralelo al eje $Y$ hasta la altura $4$.'
    - 'Paso 3: Marcar el punto $P(-3, 4)$ en la intersección de las líneas guía.'
    - 'Paso 4: Determinar el cuadrante examinando los signos:
      - Como $x < 0$ e $y > 0$, el punto $P$ pertenece estrictamente al **Cuadrante II**.'
    - 'Paso 5: Calcular el punto simétrico respecto al eje $X$:
      - La reflexión sobre el eje $X$ mantiene la abscisa y cambia el signo de la ordenada: $P'' = (-3, -4)$ (ubicado en el Cuadrante III).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué cuadrante del plano cartesiano se encuentra un punto con coordenadas $(-5, -2)$?'
    choices:
      - {text: 'Cuadrante III (abscisa negativa y ordenada negativa)', is_correct: true}
      - {text: 'Cuadrante I', is_correct: false}
      - {text: 'Cuadrante II', is_correct: false}
      - {text: 'Cuadrante IV', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuadrante III (abscisa negativa y ordenada negativa)''. Cuando ambas coordenadas son negativas ($x < 0, y < 0$), el punto reside en el tercer cuadrante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Dónde se ubica un punto cuyas coordenadas son $(0, 7)$?'
    choices:
      - {text: 'Sobre el eje $Y$ (eje de las ordenadas)', is_correct: true}
      - {text: 'Sobre el eje $X$ (eje de las abscisas)', is_correct: false}
      - {text: 'En el centro del Cuadrante I', is_correct: false}
      - {text: 'En el origen $(0, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Sobre el eje $Y$ (eje de las ordenadas)''. Todo punto con abscisa $x = 0$ y ordenada $y \neq 0$ se sitúa exactamente sobre el eje vertical $Y$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dibujar los ejes coordenados ortogonales $X$ (horizontal) e $Y$ (vertical) con sus respectivas escalas graduadas.'
  - 'Paso 2: Partir del origen $(0, 0)$.'
  - 'Paso 3: Desplazarse horizontalmente la distancia de la abscisa $x$ (derecha si $x > 0$, izquierda si $x < 0$).'
  - 'Paso 4: Desplazarse verticalmente la distancia de la ordenada $y$ (arriba si $y > 0$, abajo si $y < 0$).'
  - 'Paso 5: Dibujar el punto en la posición de llegada y rotularlo con su par ordenado $(x, y)$.'
errores_correccion: |
  - **Error 1:** Invertir los ejes y mover la primera coordenada sobre el eje vertical $Y$. **Cómo corregirlo:** La primera componente $x$ siempre corresponde al desplazamiento horizontal ($X$), y la segunda componente $y$ al vertical ($Y$).
  - **Error 2:** Creer que los puntos sobre los ejes pertenecen a algún cuadrante. **Cómo corregirlo:** Los puntos situados sobre los ejes $X$ o $Y$ (como $(0, 5)$ o $(3, 0)$) son fronteras y no pertenecen a ningún cuadrante.
ejemplos:
  - titulo: 'Punto en Cuadrante IV'
    enunciado: '¿Cuáles son los signos de un punto en el Cuadrante IV?'
    alternativas:
      - '$x > 0, y < 0$'
      - '$x < 0, y < 0$'
      - '$x < 0, y > 0$'
    respuesta: '$x > 0, y < 0$'
    solucion_pasos:
      - '1. En el cuarto cuadrante la abscisa es positiva y la ordenada es negativa: $(+, -)$.'
  - titulo: 'Punto sobre el eje de abscisas'
    enunciado: '¿Qué coordenada tiene siempre igual a cero un punto sobre el eje X?'
    respuesta: 'La ordenada ($y = 0$)'
    solucion_pasos:
      - 'Todos los puntos del eje X tienen la forma $(x, 0)$.'
  - titulo: 'Reflexión respecto al origen'
    enunciado: '¿Cuál es el simétrico de $(2, 3)$ respecto al origen $(0, 0)$?'
    respuesta: '$(-2, -3)$'
    solucion_pasos:
      - 'Se invierten los signos de ambas componentes: $(-2, -3)$.'
  - titulo: 'Grilla de producto discreto'
    enunciado: 'Si $A=\{1, 2\}$ y $B=\{1, 2, 3\}$, ¿qué figura forman los puntos de $A \times B$?'
    respuesta: 'Una cuadrícula rectangular de 6 puntos aislados'
    solucion_pasos:
      - 'Puntos discretos en las coordenadas $(1, 1), (1, 2), (1, 3), (2, 1), (2, 2), (2, 3)$.'
errores_frecuentes:
  - 'La afirmación de que la primera coordenada de un par ordenado se mide sobre el eje vertical de las ordenadas.'
  - 'La afirmación de que los cuadrantes del plano cartesiano se numeran en sentido horario.'
  - 'La afirmación de que los puntos ubicados directamente sobre los ejes pertenecen simultáneamente a dos cuadrantes.'
  - 'La afirmación de que el origen de coordenadas posee signos positivos en sus dos componentes.'
  - 'La afirmación de que el punto $(4, -2)$ se ubica en el segundo cuadrante.'
afirmaciones_verdaderas:
  - 'Cada par ordenado $(x, y) \in \mathbb{R}^2$ corresponde de manera biunívoca a un único punto geométrico en el plano cartesiano.'
  - 'Los signos de las coordenadas determinan unívocamente la pertenencia a uno de los cuatro cuadrantes o a los ejes ortogonales.'
al_terminar_debes_poder: |
  QUÉ: Representar, ubicar e interpretar pares ordenados $(x, y)$ en el plano cartesiano bidimensional.
  CÓMO: Identificar abscisas y ordenadas, ubicar puntos respecto a los ejes ortogonales y determinar cuadrantes según la regla de signos.
