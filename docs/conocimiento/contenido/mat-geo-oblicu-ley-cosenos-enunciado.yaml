procedimiento:
- 'Paso 1: Identifica el lado que se busca calcular y su ángulo opuesto (el comprendido
  entre los otros dos lados).'
- 'Paso 2: Escribe la fórmula lado²=suma de cuadrados de los otros dos lados - 2×producto
  de esos lados×cos(ángulo comprendido).'
- 'Paso 3: Sustituye los valores conocidos y resuelve para obtener el lado buscado.'
