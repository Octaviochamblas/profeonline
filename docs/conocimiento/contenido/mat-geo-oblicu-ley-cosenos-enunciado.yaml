semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.LEY_COSENOS_ENUNCIADO
resumen_inicial: 'Enunciado de la ley de cosenos para triángulos oblicuángulos: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: El teorema de Pitágoras solo aplica a triángulos rectángulos;
  la ley de cosenos lo generaliza a cualquier triángulo, incorporando un término adicional
  con el coseno del ángulo entre dos de los lados.
explicacion_formal: '![Ley de cosenos](/static/img/geometria/trigonometria/oblicu-ley-cosenos-enunciado.svg)


  ### Definición formal


  En un triángulo de lados $a$, $b$, $c$, con $A$ el ángulo opuesto a $a$ (comprendido
  entre $b$ y $c$), se cumple $a^2=b^2+c^2-2bc\cos A$.


  ### Desarrollo didáctico


  Si $A=90°$, entonces $\cos A=0$ y la fórmula se reduce a $a^2=b^2+c^2$, el teorema
  de Pitágoras. Para cualquier otro ángulo, el término $-2bc\cos A$ corrige esa relación
  según qué tan agudo u obtuso sea el ángulo A.'
definiciones_clave: '- **Enunciado de la ley de cosenos para triángulos oblicuángulos**:
