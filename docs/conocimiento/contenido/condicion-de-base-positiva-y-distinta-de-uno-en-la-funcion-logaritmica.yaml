semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.CONDICION_BASE
resumen_inicial: La condición de base positiva y distinta de uno ($b \in ]0, 1[ \cup ]1, +\infty[$) en la función logarítmica $f(x) = \log_b(x)$ asegura la continuidad, la inyectividad y la existencia real de su derivada $f'(x) = \frac{1}{x \ln(b)}$.
explicacion_simple: "![La condición de base positiva y distinta de uno ($b \\in ]0, 1[ \\cup ]1, +\\infty[$) en la función logarítmica $f(x) = \\log_b(x)$ asegura la continuidad, la inyectividad y la existencia real de su derivada $f'(x) = \\frac{1}{x \\ln(b)}$](/static/img/nodos/condicion-de-base-positiva-y-distinta-de-uno-en-la-funcion-logaritmica-intro.svg)\n\n\nPara que una función logarítmica sea válida y continua en el mundo real, la **base $b$** debe cumplir dos exigencias obligatorias:\n\n1. **$b > 0$ (Positiva):** Si fuera negativa (ej: base $-2$), no se podría graficar una curva continua porque $(-2)^{0,5} = \\sqrt{-2}$ no existe en los reales.\n2. **$b \\neq 1$ (Distinta de uno):** Si la base fuera 1, tendríamos $\\log_1(x) = \\frac{\\ln(x)}{\\ln(1)} = \\frac{\\ln(x)}{0}$, ¡lo cual es una división por cero imposible!\n- Por eso, el conjunto de bases válidas se divide en dos mundos:\n  - **Bases decrecientes:** $0 < b < 1$ (ej: $1/2, 0,5, 1/3$).\n  - **Bases crecientes:** $b >\
  \ 1$ (ej: $2, 3, 10, e$)."
explicacion_formal: 'Sea el operador diferencial $f(x) = \frac{\ln(x)}{\ln(b)}$. La regularidad analítica en $\mathbb{R}^+$ exige:

  $$\mathcal{B} = \{b \in \mathbb{R} \mid b > 0 \land \ln(b) \neq 0\} = ]0, 1[ \cup ]1, +\infty[$$


  **Justificación analítica rigurosa**:

  1. **No degeneración de la pendiente**: La tasa de variación instantánea $f''(x) = \frac{1}{x \ln(b)}$ requiere $\ln(b) \neq 0 \iff b \neq 1$. Si $b = 1$, la recta tangente tendría pendiente indefinida vertical en todo punto.

  2. **Inyectividad y biyección**: Para todo $b \in \mathcal{B}$, la función es estrictamente monótona, garantizando una inversa unívoca $f^{-1}(y) = b^y$.'
definiciones_clave: '- **Conjunto de bases admisibles**: $\mathcal{B} = ]0, 1[ \cup ]1, +\infty[$.

  - **Bifurcación de monotonía**: Clasificación de la función en monótona creciente ($b > 1$) o monótona decreciente ($0 < b < 1$).'
propiedades_relaciones: '- **Monotonía estricta**: $b > 1 \implies f''(x) > 0$; $0 < b < 1 \implies f''(x) < 0$.

  - **Relación de simetría con base inversa**: $\log_{1/b}(x) = -\log_b(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La condición de base positiva y distinta de uno ($b \in ]0, 1[ \cup ]1, +\infty[$) en la función logarítmica $f(x) = \log_b(x)$ asegura la continuidad, la inyectividad y la existencia real de su derivada $f''(x) = \frac{1}{x \ln(b)}$](/static/img/nodos/condicion-de-base-positiva-y-distinta-de-uno-en-la-funcion-logaritmica-ejemplos.svg)



    Determina si las siguientes funciones logarítmicas están bien definidas en $\mathbb{R}$ y clasifica su monotonía:

    1) $f(x) = \log_{0{,}25}(x)$

    2) $g(x) = \log_1(x)$

    3) $h(x) = \log_{-4}(x)$

    4) $p(x) = \log_e(x)$'
  pasos:
  - 'Paso 1: Para $f(x) = \log_{0{,}25}(x)$: Como $0{,}25 \in ]0, 1[$, está **bien definida** y es **estrictamente decreciente**.'
  - 'Paso 2: Para $g(x) = \log_1(x)$: La base es 1 $\implies \ln(1) = 0 \implies$ **inválida / no definida**.'
  - 'Paso 3: Para $h(x) = \log_{-4}(x)$: La base es negativa $\implies$ **inválida en $\mathbb{R}$**.'
  - 'Paso 4: Para $p(x) = \log_e(x) = \ln(x)$: Como $e \approx 2{,}718 > 1$, está **bien definida** y es **estrictamente creciente**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué no se admite la base b = 1 en una función logarítmica?
  choices:
  - text: Porque genera una división por cero en ln(1) = 0 y anula la inyectividad
    is_correct: true
  - text: Porque 1 no es número primo
    is_correct: false
  - text: Porque da como resultado siempre 0
    is_correct: false
  - text: Porque 1 es impar
    is_correct: false
  explanation: La alternativa correcta es 'Porque genera una división por cero en ln(1) = 0 y anula la inyectividad'. $\log_1(x) = \frac{\ln(x)}{\ln(1)} = \frac{\ln(x)}{0}$, lo cual no está definido.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Para qué valores de m está bien definida la función $f(x) = \log_{m - 2}(x)$?
  choices:
  - text: m > 2 y m ≠ 3
    is_correct: true
  - text: m > 0
    is_correct: false
  - text: m > 2
    is_correct: false
  - text: m ≠ 1
    is_correct: false
  explanation: La alternativa correcta es 'm > 2 y m ≠ 3'. Base $> 0 \implies m - 2 > 0 \implies m > 2$, y base $\neq 1 \implies m - 2 \neq 1 \implies m \neq 3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la base $b$ en la expresión de la función.'
- 'Paso 2: Exigir la inecuación de positividad estricta $b > 0$.'
- 'Paso 3: Exigir la restricción de valor unitario $b \neq 1$.'
- 'Paso 4: Si $b > 1$, clasificar como creciente; si $0 < b < 1$, clasificar como decreciente.'
errores_correccion: '- **Error común:** Considerar válidas las bases negativas en funciones logarítmicas.

  - **Cómo corregirlo:** La base **SIEMPRE debe ser estrictamente positiva y distinta de 1**: $b \in ]0, 1[ \cup ]1, +\infty[$.'
ejemplos:
- titulo: 'Ejemplo 1: Base decimal válida'
  enunciado: ¿Es válida la base en $f(x) = \log_{0{,}8}(x)$?
  alternativas:
  - Sí, y la función es decreciente
  - Sí, y la función es creciente
  - No, debe ser entera
  - No, es menor que 1
  respuesta: Sí, y la función es decreciente
  solucion_pasos:
  - 'Paso 1: $0{,}8 \in ]0, 1[ \implies$ válida y decreciente.'
- titulo: 'Ejemplo 2: Base unitaria rechazada'
  enunciado: ¿Qué ocurre con $f(x) = \log_1(x)$?
  alternativas:
  - No es una función válida en R
  - Es una recta horizontal
  - Es una función creciente
  - Vale 1
  respuesta: No es una función válida en R
  solucion_pasos:
  - 'Paso 1: $\ln(1) = 0 \implies$ indeterminación.'
- titulo: 'Ejemplo 3: Parámetro en la base'
  enunciado: En $f(x) = \log_{k + 5}(x)$, ¿qué condición debe cumplir $k$?
  alternativas:
  - k > -5 y k ≠ -4
  - k > 0
  - k > -5
  - k ≠ 1
  respuesta: k > -5 y k ≠ -4
  solucion_pasos:
  - 'Paso 1: $k + 5 > 0 \implies k > -5$, y $k + 5 \neq 1 \implies k \neq -4$.'
- titulo: 'Ejemplo 4: Monotonía según base'
  enunciado: Si $b = 3/2$, ¿cómo es la función $f(x) = \log_b(x)$?
  alternativas:
  - Estrictamente creciente (3/2 > 1)
  - Estrictamente decreciente
  - Constante
  - No definida
  respuesta: Estrictamente creciente (3/2 > 1)
  solucion_pasos:
  - 'Paso 1: Como $3/2 = 1{,}5 > 1$, la función es creciente.'
errores_frecuentes:
- Olvidar excluir el valor b = 1 en bases con incógnitas.
- Creer que las bases fraccionarias menores que 1 no están permitidas.
- Confundir la condición de la base con la del argumento.
afirmaciones_verdaderas:
- La base de una función logarítmica real debe pertenecer a ]0, 1[ ∪ ]1, +∞[.
- Si la base es mayor que uno la función es creciente; si está entre cero y uno es decreciente.
al_terminar_debes_poder: '**QUÉ:** Fundamentar y aplicar las condiciones de existencia de la base en la función logarítmica.


  **CÓMO:** Verificando b > 0 y b ≠ 1 para clasificar la monotonía y validez de f(x) = log_b(x).


