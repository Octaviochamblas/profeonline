semantic_id: MAT.GEO.RELACIONES_TR.PROYECCIONES_CATETOS
resumen_inicial: 'Las proyecciones ortogonales de los catetos sobre la hipotenusa son los segmentos $p$ (bajo el cateto $b$) y $q$ (bajo el cateto $a$), determinados por el pie de la altura $D$, cumpliéndose siempre que $p + q = c$.'
explicacion_simple: |
  ![Proyecciones sobre la Hipotenusa](/static/img/nodos/proyeccion-de-cada-cateto-sobre-la-hipotenusa-intro.svg)

  Imagina que alumbras el triángulo con una linterna desde arriba:

  - La sombra que proyecta el cateto izquierdo $b$ sobre el piso (hipotenusa) se llama **$p$** (segmento $AD$).
  - La sombra que proyecta el cateto derecho $a$ sobre el piso se llama **$q$** (segmento $DB$).
  - Juntas cubren todo el piso: **$p + q = c$** (la hipotenusa completa).
explicacion_formal: |
  ### Definición formal
  En un triángulo rectángulo $\Delta ABC$ con $\gamma = 90^\circ$ y altura $h_c = \overline{CD} \perp \overline{AB}$, se definen las **proyecciones ortogonales de los catetos** sobre la hipotenusa como los segmentos adyacentes determinados por el pie de la altura $D$:

  $$p = \operatorname{Proy}_{\overline{AB}}(\overline{AC}) = AD = \|\vec{AD}\|$$

  $$q = \operatorname{Proy}_{\overline{AB}}(\overline{BC}) = DB = \|\vec{DB}\|$$

  ### Desglose simbólico y geométrico
  - $p = AD$: Proyección ortogonal del cateto $b = AC$ sobre la hipotenusa.
  - $q = DB$: Proyección ortogonal del cateto $a = BC$ sobre la hipotenusa.
  - Relación de partición aditiva: Como $D \in \overline{AB}$, se cumple la identidad lineal:

  $$p + q = c \iff AD + DB = AB$$

  - Correspondencia de magnitud: $b < a \iff p < q$, y $b = a \iff p = q = c/2$.

  ### Síntesis didáctica
  Las proyecciones $p$ y $q$ descomponen la hipotenusa en dos magnitudes lineales fundamentales que vinculan las razones trigonométricas y las áreas de los subtriángulos semejantes.
definiciones_clave: |
  - **Proyección ortogonal ($p$)**: Segmento $AD$ delimitado entre el vértice $A$ y el pie de la altura $D$.
  - **Proyección ortogonal ($q$)**: Segmento $DB$ delimitado entre el pie de la altura $D$ y el vértice $B$.
  - **Identidad de clausura**: Ecuación lineal $p + q = c$.
propiedades_relaciones: |
  - **Partición exacta**: $p + q = c$.
  - **Despejes directos**: $p = c - q$ y $q = c - p$.
  - **Orden métrico**: Al cateto menor le corresponde siempre la proyección menor.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Proyecciones](/static/img/nodos/proyeccion-de-cada-cateto-sobre-la-hipotenusa-ejemplos.svg)

    En un triángulo rectángulo, la hipotenusa mide $c = 20\text{ cm}$ y la proyección del cateto menor es $p = 4\text{ cm}$. Determina la longitud de la proyección $q$ del otro cateto.
  pasos:
  - 'Paso 1: Identificar los datos: hipotenusa total $c = 20\text{ cm}$ y proyección $p = 4\text{ cm}$.'
  - 'Paso 2: Utilizar la identidad de partición: $p + q = c$.'
  - 'Paso 3: Despejar la proyección incógnita: $q = c - p$.'
  - 'Paso 4: Realizar la resta: $q = 20 - 4 = 16\text{ cm}$.'
  - 'Paso 5: Concluir que la proyección del otro cateto mide $16\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación matemática que vincula las proyecciones p y q con la hipotenusa c?
  choices:
  - text: $p + q = c$
    is_correct: true
  - text: $p \cdot q = c$
    is_correct: false
  - text: $p^2 + q^2 = c^2$
    is_correct: false
  - text: $p - q = c$
    is_correct: false
  explanation: 'La relación correcta es $p + q = c$, ya que las proyecciones $p$ y $q$ son segmentos contiguos que forman la hipotenusa completa.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la hipotenusa mide 15 cm y la proyección q mide 9 cm, ¿cuánto mide la proyección p?
  choices:
  - text: $6\text{ cm}$
    is_correct: true
  - text: $12\text{ cm}$
    is_correct: false
  - text: $24\text{ cm}$
    is_correct: false
  - text: $3\text{ cm}$
    is_correct: false
  explanation: 'Mide $6\text{ cm}$, ya que $p = c - q = 15 - 9 = 6\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar la altura desde el ángulo recto para ubicar el pie $D$ en la hipotenusa.'
- 'Paso 2: Asignar $p$ al segmento bajo el cateto $b$ y $q$ al segmento bajo el cateto $a$.'
- 'Paso 3: Verificar que la suma $p + q$ equivalga a la longitud total de la hipotenusa $c$.'
- 'Paso 4: Usar $q = c - p$ o $p = c - q$ si se requiere hallar una de las dos partes.'
errores_correccion: 'Recuerda asociar siempre la letra $p$ al cateto $b$ y la letra $q$ al cateto $a$ para mantener la coherencia con las fórmulas de Euclides.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo rectángulo las proyecciones de los catetos son $p = 3{,}6\text{ cm}$ y $q = 6{,}4\text{ cm}$, ¿cuánto mide la hipotenusa $c$?
  alternativas:
  - $10\text{ cm}$
  - $23\text{ cm}$
  - $2{,}8\text{ cm}$
  respuesta: $10\text{ cm}$
  solucion_pasos:
  - '$c = p + q = 3{,}6 + 6{,}4 = 10\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: En un triángulo rectángulo isósceles de hipotenusa $c = 12\text{ cm}$, ¿cuánto miden las proyecciones $p$ y $q$?
  alternativas:
  - $p = 6\text{ cm}$ y $q = 6\text{ cm}$
  - $p = 4\text{ cm}$ y $q = 8\text{ cm}$
  - $p = 3\text{ cm}$ y $q = 9\text{ cm}$
  respuesta: $p = 6\text{ cm}$ y $q = 6\text{ cm}$
  solucion_pasos:
  - 'Por simetría, en el isósceles la altura cae en el punto medio, por lo que $p = q = 12/2 = 6\text{ cm}$.'
- titulo: ¿La suma de las proyecciones p y q es igual a la hipotenusa c?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $p + q = c$ por partición aditiva del segmento hipotenusa.'
- titulo: ¿Las proyecciones p y q son siempre iguales en cualquier triángulo rectángulo?
  respuesta: 'No'
  solucion_pasos:
  - 'No, solo son iguales si el triángulo rectángulo es isósceles ($a = b$). En triángulos escalenos, $p \neq q$.'
errores_frecuentes:
- 'Invertir la correspondencia: asignar $p$ al cateto $a$ y $q$ al cateto $b$.'
- 'Multiplicar $p \times q$ creyendo que da la hipotenusa en vez de sumar $p + q$.'
- 'Confundir la proyección con la altura.'
- 'Olvidar restar al despejar una proyección conocida ($q = c - p$).'
- 'Asumir que las proyecciones siempre son números enteros.'
afirmaciones_verdaderas:
- 'Las proyecciones de los catetos sobre la hipotenusa satisfacen la igualdad $p + q = c$.'
- 'El pie de la altura sobre la hipotenusa delimita exactamente las dos proyecciones $p$ y $q$.'
al_terminar_debes_poder: |
  **QUÉ:** Identificar, definir y calcular las proyecciones ortogonales $p$ y $q$ de los catetos sobre la hipotenusa.

  **CÓMO:** Reconociendo los segmentos delimitados por el pie de la altura $D$ y aplicando la relación $p + q = c$.

  ![Resumen de Proyecciones](/static/img/nodos/proyeccion-de-cada-cateto-sobre-la-hipotenusa-resumen.svg)
