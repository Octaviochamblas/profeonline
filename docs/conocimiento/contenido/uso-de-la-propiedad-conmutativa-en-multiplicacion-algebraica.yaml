procedimiento:
- 'Paso 1: Agrupa todos los signos y determina el signo del producto.'
- 'Paso 2: Agrupa todos los coeficientes numéricos y multiplícalos.'
- 'Paso 3: Agrupa todas las variables (por tipo) y aplica la ley de exponentes.'
- 'Paso 4: Combina el signo con el coeficiente numérico y el resultado literal.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en uso de la propiedad conmutativa en multiplicación algebraica.
ejemplos:
- titulo: Agrupar para ganar
  enunciado: 'Calcula: (3a)(2b)(4c).'
  solucion_pasos:
  - 'Signos: (+)(+)(+) = +.'
  - 'Coeficientes: 3 × 2 × 4 = 24.'
  - 'Letras: a · b · c = abc.'
  - 'Resultado: 24abc.'
- titulo: Un estudiante calcula la densidad de una aleación como $D = (masa)(volumen)^{-1}$
    y escribe
  enunciado: 'Un estudiante calcula la densidad de una aleación como $D = (masa)(volumen)^{-1}$
    y escribe $(5m)(2v)$. Su compañero lo escribe al revés: $(2v)(5m)$. ¿Quién tiene
    razón? (v1)


    Opciones: A) Ambos, porque la multiplicación es conmutativa y el orden no altera
    el resultado ($10mv$). · B) Solo el primero, el orden importa en multiplicación.
    · C) Solo el segundo. · D) Ninguno, deben sumarse.'
  solucion_pasos:
  - La propiedad conmutativa garantiza $(5m)(2v) = (2v)(5m) = 10mv$.
  - 'Respuesta: Ambos, porque la multiplicación es conmutativa y el orden no altera
    el resultado ($10mv$).'
- titulo: 'Respecto de «Uso de la propiedad conmutativa en multiplicación algebraica»:
    ¿Es correcta est'
  enunciado: 'Respecto de «Uso de la propiedad conmutativa en multiplicación algebraica»:
    ¿Es correcta esta caracterización? «La **Propiedad Conmutativa** de la multiplicación
    establece que el orden de los factores no altera el producto: $a \cdot b = b \cdot
    a$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La **Propiedad Conmutativa**
    de la multiplicación establece que el orden de los factores no altera el producto:
    $a \cdot b = b \cdot a$.'
- titulo: 'Respecto de «Uso de la propiedad conmutativa en multiplicación algebraica»:
    ¿Es válida esta'
  enunciado: 'Respecto de «Uso de la propiedad conmutativa en multiplicación algebraica»:
    ¿Es válida esta afirmación? «Confundir la propiedad conmutativa con la asociativa
    (aunque en la práctica se usan juntas)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La **Propiedad Conmutativa**
    de la multiplicación establece que el orden de los factores no altera el producto:
    $a \cdot b = b \cdot a$.'
errores_frecuentes:
- Confundir la propiedad conmutativa con la asociativa (aunque en la práctica se usan
  juntas).
- Al reordenar, olvidar el signo de un factor que se mueve.
- Para «¿Cuál propiedad garantiza que $(4x)(3y) = (3y)(4x)$? (v1)», la respuesta correcta
  es La propiedad asociativa.
- Para «¿Cuál propiedad garantiza que $(4x)(3y) = (3y)(4x)$? (v1)», la respuesta correcta
  es La propiedad distributiva.
- Para «¿Cuál propiedad garantiza que $(4x)(3y) = (3y)(4x)$? (v1)», la respuesta correcta
  es La identidad multiplicativa.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
al_terminar_debes_poder: Resolver productos algebraicos utilizando uso de la propiedad
  conmutativa en multiplicación algebraica.
fuente: Álgebra de Baldor.
