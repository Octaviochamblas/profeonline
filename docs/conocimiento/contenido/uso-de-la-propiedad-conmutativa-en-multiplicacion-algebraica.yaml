semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PROPIEDAD_CONMUTATIVA
resumen_inicial: 'Uso de la propiedad conmutativa en multiplicación algebraica: leyes,
  procedimiento y aplicación en Leyes fundamentales de la multiplicación algebraica.'
explicacion_simple: '$3 \times 5 = 5 \times 3 = 15$. El orden en que multiplicas no
  importa. En álgebra, esta regla persiste: $3x \cdot 5y = 5y \cdot 3x = 15xy$.'
explicacion_formal: '### Definición formal


  La conmutatividad garantiza que el orden de los factores no altera el producto.


  ### Desarrollo didáctico


  Ejemplo: $(2x)(5y)(3z)$.


  Puedo reordenarlos cómodamente:

  $(2 \cdot 5 \cdot 3)(x \cdot y \cdot z) = 30xyz$.


  Sin commutativity tendría que multiplicar en orden estricto. Con ella, junto todos
  los números primero y luego todas las letras, lo que hace el cálculo más limpio.


  También se usa para reorganizar: si tienes $(-3ab)(+5c)(-2b)$, puedes agrupar: signos
  → $(-)(+)(-) = +$, coeficientes → $3 \times 5 \times 2 = 30$, literales → $ab \cdot
  c \cdot b = ab^2c$. Resultado: $30ab^2c$.'
definiciones_clave: '- **Uso de la propiedad conmutativa en multiplicación algebraica**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a uso de la propiedad conmutativa en multiplicación
  algebraica.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de uso de la propiedad conmutativa
    en multiplicación algebraica.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de uso de la propiedad conmutativa en multiplicación
    algebraica.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
