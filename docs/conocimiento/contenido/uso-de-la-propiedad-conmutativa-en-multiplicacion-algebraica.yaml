semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PROPIEDAD_CONMUTATIVA
resumen_inicial: 'El uso de la propiedad conmutativa en la multiplicación algebraica establece que el orden de los factores no altera el producto final, permitiendo reordenar monomios y variables a conveniencia.'
explicacion_simple: |
  La **Propiedad Conmutativa de la Multiplicación** establece que:
  - **REGLA**: **El orden de los factores no altera el producto**.
  - **Fórmula**: $A \cdot B = B \cdot A$.
  - **En álgebra nos permite**:
    1. **Cambiar el orden de los coeficientes y las letras** para juntar los números con los números y las letras iguales con las letras iguales.
       - Ej: $(2x) \cdot (3y) = 2 \cdot x \cdot 3 \cdot y = (2 \cdot 3) \cdot (x \cdot y) = \mathbf{6xy}$.
    2. **Escribir las letras en orden alfabético** por convención editorial.
       - Ej: $y \cdot x \cdot z = \mathbf{xyz}$.
explicacion_formal: |
  ### Definición formal
  En el anillo conmutativo de polinomios $(\mathbb{R}[x_1, \dots, x_n], +, \cdot)$, para todo par de elementos $P, Q$, la operación producto satisface la identidad canónica de **conmutatividad**:

  $$P \cdot Q = Q \cdot P$$

  ### Reordenamiento de Monomios Multivariables
  Para un producto de $k$ monomios, la propiedad conmutativa autoriza la permutación $\sigma \in S_k$ de los factores sin alterar el resultado algebraico:

  $$\prod_{i=1}^k M_i = \prod_{i=1}^k M_{\sigma(i)}$$

  Esta propiedad permite agrupar secuencialmente la subcadena de coeficientes escalares y las subcadenas de bases literales idénticas:

  $$(c_1 x^a y^b) \cdot (c_2 x^c y^d) = (c_1 \cdot c_2) \cdot (x^a \cdot x^c) \cdot (y^b \cdot y^d) = c_1 c_2 x^{a+c} y^{b+d}$$

  ### Síntesis didáctica
  La conmutatividad es la herramienta que justifica reorganizar alfabéticamente las variables y colocar los coeficientes numéricos al inicio del monomio.
definiciones_clave: |
  - **Propiedad conmutativa multiplicativa**: Axioma $A \cdot B = B \cdot A$ que independiza el valor del producto respecto a la secuencia de factores.
  - **Permutación de factores ($\sigma \in S_k$)**: Reordenamiento arbitrario de la secuencia de monomios o variables en una multiplicación.
  - **Orden alfabético canónico**: Convención de presentación donde las variables de un monomio se ordenan según el alfabeto ($x^a y^b z^c$).
propiedades_relaciones: |
  - **Conmutatividad global**: Se cumple tanto para coeficientes numéricos ($3 \cdot 4 = 4 \cdot 3$) como para variables ($x \cdot y = y \cdot x$).
  - **Invarianza del producto final**: Reordenar expresiones no genera ningún cambio en los exponentes ni en el signo resultante.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad conmutativa para simplificar el producto algebraico $(4b^3 a) \cdot (-2a^2 b^5)$.'
  pasos:
    - 'Paso 1: Escribimos el producto expandiendo todos sus factores:
       $4 \cdot b^3 \cdot a \cdot (-2) \cdot a^2 \cdot b^5$.'
    - 'Paso 2: Aplicamos la propiedad conmutativa para agrupar los coeficientes al inicio:
       $[4 \cdot (-2)] \cdot b^3 \cdot a \cdot a^2 \cdot b^5$.'
    - 'Paso 3: Aplicamos la propiedad conmutativa para agrupar las letras en orden alfabético ($a$ primero, luego $b$):
       $[4 \cdot (-2)] \cdot [a \cdot a^2] \cdot [b^3 \cdot b^5]$.'
    - 'Paso 4: Operamos cada grupo conmutado:
       - Coeficientes: $4 \cdot (-2) = -8$.
       - Variable $a$: $a^1 \cdot a^2 = a^{1+2} = a^3$.
       - Variable $b$: $b^3 \cdot b^5 = b^{3+5} = b^8$.'
    - 'Conclusión: El producto ordenado es **$-8a^3 b^8$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué establece la propiedad conmutativa en la multiplicación de dos expresiones algebraicas $M$ y $N$?'
    choices:
      - {text: 'Establece que el orden de los factores no altera el producto ($M \cdot N = N \cdot M$)', is_correct: true}
      - {text: 'Establece que se deben sumar los factores en lugar de multiplicarlos', is_correct: false}
      - {text: 'Establece que multiplicar por cero da como resultado uno', is_correct: false}
      - {text: 'Establece que el resultado siempre es un número positivo', is_correct: false}
    explanation: 'La alternativa correcta es ''Establece que el orden de los factores no altera el producto ($M \cdot N = N \cdot M$)''. Axioma de conmutatividad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Es la expresión $y \cdot 5 \cdot x$ equivalente a $5xy$ gracias a la propiedad conmutativa?'
    choices:
      - {text: 'Sí, porque podemos conmutar el número 5 al inicio y ordenar las variables $x$ e $y$ alfabéticamente', is_correct: true}
      - {text: 'No, porque al cambiar el orden se altera el signo', is_correct: false}
      - {text: 'No, porque el número 5 debe quedar al final', is_correct: false}
      - {text: 'Sólo si x y y son números enteros positivos', is_correct: false}
    explanation: 'La alternativa correcta es ''Sí, porque podemos conmutar el número 5 al inicio y ordenar las variables $x$ e $y$ alfabéticamente''. Reordenamiento alfabético y escalar.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todos los factores que intervienen en la multiplicación.'
  - 'Paso 2: Conmutar los coeficientes numéricos trasladándolos al inicio de la expresión.'
  - 'Paso 3: Conmutar los factores literales agrupando las variables iguales de forma continua y en orden alfabético.'
  - 'Paso 4: Multiplicar los números y sumar los exponentes de las variables correspondientes.'
errores_correccion: |
  - **Error 1:** Afirmar que cambiar el orden de las letras altera la expresión (decir que $3yx$ no es igual a $3xy$). **Cómo corregirlo:** La multiplicación es **CONMUTATIVA ($3yx = 3xy$ son términos idénticos)**.
  - **Error 2:** Cambiar los signos de los factores al conmutarlos de posición. **Cómo corregirlo:** Mover de lugar un factor multiplicativo **PRESERVA TOTALMENTE SU SIGNO Y SU EXPONENTE**.
ejemplos:
  - titulo: 'Conmutatividad con dos variables'
    enunciado: '¿Es $b \cdot a$ equivalente al producto $a \cdot b$?'
    alternativas:
      - 'Sí, por la propiedad conmutativa'
      - 'No, el orden cambia el valor'
      - 'Solo si a = b'
    respuesta: 'Sí, por la propiedad conmutativa'
    solucion_pasos:
      - '1. $a \cdot b = b \cdot a$.'
      - '2. Mismo producto.'
  - titulo: 'Reordenamiento de monomio'
    enunciado: 'Al reordenar $y \cdot (-4) \cdot x$, ¿obtenemos $-4xy$?'
    alternativas:
      - '$-4xy$'
      - '$4yx$'
      - '$-4 + x + y$'
    respuesta: '$-4xy$'
    solucion_pasos:
      - '1. Conmutar el $-4$ al inicio.'
      - '2. Ordenar $x$ y luego $y$.'
      - '3. Resultado: $-4xy$.'
  - titulo: 'Preservación de exponentes'
    enunciado: 'Al conmutar $x^3 \cdot y^2$ a $y^2 \cdot x^3$, ¿permanecen los exponentes intactos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, conmutar factores no modifica las potencias.'
  - titulo: 'Orden alfabético estándar'
    enunciado: '¿Es conveniente escribir el monomio $3 z y x$ en la forma canónica conmutada $3 x y z$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la ordenación alfabética es la convención canónica.'
errores_frecuentes:
  - 'Declarar que alterar el orden de los factores literales modifica el valor numérico del producto.'
  - 'Cambiar erróneamente el signo del coeficiente al conmutarlo a la posición inicial.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar la propiedad conmutativa de la multiplicación con la regla no conmutativa de la resta.'
  - 'Alterar los exponentes de las variables al cambiar el orden de los factores.'
afirmaciones_verdaderas:
  - 'La propiedad conmutativa garantiza que el orden de los factores no altera el producto final.'
  - 'Reordenar alfabéticamente las variables de un monomio no modifica su valor ni su significado algebraico.'
