resumen_inicial: La uso de la propiedad conmutativa en multiplicación algebraica aplica
  rigurosamente las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con uso de la propiedad conmutativa en multiplicación
  algebraica, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Uso de la propiedad conmutativa
  en multiplicación algebraica** viene dada por:


  $$\text{"la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy"} \implies 6xy$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Uso de la propiedad conmutativa en multiplicación algebraica**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule uso de la propiedad conmutativa en multiplicación algebraica
    para: ''la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 6xy.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar uso de la propiedad conmutativa en multiplicación
    algebraica a 'la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy'?
  choices:
  - text: 6xy
    is_correct: true
  - text: 5xy
    is_correct: false
  - text: 6x^2y^2
    is_correct: false
  - text: x/y
    is_correct: false
  explanation: La alternativa correcta es '6xy'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la equivalencia (3x) · (2y) = (2y) · (3x) =
    6xy', ¿qué expresión resultante se obtuvo?
  choices:
  - text: 6xy
    is_correct: true
  - text: 5xy
    is_correct: false
  - text: 6x^2y^2
    is_correct: false
  - text: x/y
    is_correct: false
  explanation: La alternativa correcta es '6xy'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante uso de la propiedad conmutativa en multiplicación algebraica.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de uso de la propiedad conmutativa en multiplicación
    algebraica en 'la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy'?
  alternativas:
  - 6xy
  - 5xy
  - 6x^2y^2
  - x/y
  respuesta: 6xy
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 6xy.
- titulo: Ejemplo 2
  enunciado: Al calcular 'la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy' por uso
    de la propiedad conmutativa en multiplicación algebraica, ¿qué expresión resulta?
  alternativas:
  - 6xy
  - 5xy
  - 6x^2y^2
  - x/y
  respuesta: 6xy
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 6xy.
- titulo: ¿Es la multiplicación en 'la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy'
    equivalente a 6xy?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 6xy.
- titulo: ¿Da el producto de 'la equivalencia (3x) · (2y) = (2y) · (3x) = 6xy' un
    resultado igual a 5xy?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 6xy.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar uso de la propiedad
  conmutativa en multiplicación algebraica.
- Omitir distribuir el monomio o término sobre todos los sumandos en uso de la propiedad
  conmutativa en multiplicación algebraica.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La uso de la propiedad conmutativa en multiplicación algebraica requiere sumar los
  exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la uso de la propiedad
  conmutativa en multiplicación algebraica aplicando distributividad, ley de signos
  y suma de exponentes.
