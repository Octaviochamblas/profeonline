    is_correct: true
  - text: '-40'
    is_correct: false
  - text: '-13'
    is_correct: false
  - text: '13'
    is_correct: false
  explanation: La alternativa correcta es '40', ya que la multiplicación de dos enteros
    negativos da resultado positivo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado (-6) · (-7), ¿cuál es el signo del resultado final?
  choices:
  - text: Positivo
    is_correct: true
  - text: Negativo
    is_correct: false
  - text: Neutro
    is_correct: false
  - text: Depende del orden
    is_correct: false
  explanation: La alternativa correcta es 'Positivo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los valores absolutos de los dos factores.'
- 'Paso 2: Comprobar que ambos tengan el mismo signo (ambos positivos o ambos negativos).'
- 'Paso 3: Asignar un signo positivo ($+$) al resultado final.'
errores_correccion: '- **Error 1: Creer que al multiplicar dos negativos el resultado
  es negativo.** **Cómo corregirlo:** La regla de multiplicación establece que $(-)
  \cdot (-) = +$.


  - **Error 2: Confundir $(-3) \cdot (-5)$ con $(-3) + (-5)$.** **Cómo corregirlo:**
  La multiplicación de negativos da $+15$, mientras que la suma da $-8$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-9) \cdot (-4)$.
  alternativas:
  - '36'
  - '-36'
  - '-13'
  respuesta: '36'
  solucion_pasos:
  - $(-) \cdot (-) = +$. $9 \cdot 4 = 36$.
- titulo: Ejemplo 2
  enunciado: Evalúa $(-2)^4$.
  alternativas:
  - '16'
  - '-16'
  - '-8'
  respuesta: '16'
  solucion_pasos:
  - $(-2) \cdot (-2) \cdot (-2) \cdot (-2) = 16$.
- titulo: ¿La multiplicación de dos enteros negativos da un producto positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de signos iguales $(-) \cdot (-) = +$.
- titulo: ¿El producto (-3) · (-3) es igual a -9?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-3) \cdot (-3) = +9$.
errores_frecuentes:
- La multiplicación de dos números enteros negativos resulta en un producto de signo
  negativo.
- Multiplicar dos enteros positivos produce un resultado con signo negativo.
- El producto de dos enteros negativos equivale a la suma de sus valores absolutos.
- La regla de signos iguales exige que el número de mayor valor absoluto imponga su
  signo al producto.
- Multiplicar una cantidad por $-1$ deja el signo del número intacto.
afirmaciones_verdaderas:
- La multiplicación de dos enteros del mismo signo resulta siempre en un número positivo.
- Tanto $(+) \cdot (+)$ como $(-) \cdot (-)$ producen un resultado positivo.
al_terminar_debes_poder: Al terminar serás capaz de calcular la multiplicación de
  dos enteros de igual signo, aplicando la regla de signos iguales para obtener un
  producto estrictamente positivo.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
