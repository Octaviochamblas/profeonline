semantic_id: MAT.NUM.ENTEROS_OPERATORIA.MULT_SIGNOS_IGUALES
resumen_inicial: 'La multiplicación de dos enteros del mismo signo resulta siempre
  en un producto positivo: $(+) \cdot (+) = +$ y $(-) \cdot (-) = +$.'
explicacion_simple: Cuando multiplicamos dos números que tienen el mismo signo, el
  resultado final es siempre un número positivo. Esto ocurre tanto si multiplicamos
  dos enteros positivos como si multiplicamos dos enteros negativos, ya que la negación
  de una dirección negativa invierte el sentido hacia el lado positivo.
explicacion_formal: 'Para dos enteros $a, b \in \mathbb{Z} \setminus \{0\}$ tales
  que $\operatorname{sgn}(a) = \operatorname{sgn}(b)$, el **Producto de Signos Iguales**
  se define como:


  $$a \cdot b = +\left( |a| \cdot |b| \right) > 0$$


  **Desglose de la fórmula:**

  - $|a| \cdot |b|$: Producto de los valores absolutos de ambos factores.

  - $+(\dots)$: Signo positivo resultante garantizado por la concordancia de polaridad.


  > **Complemento didáctico:** $(-4) \cdot (-3) = +12$, pues el signo menos del segundo
  factor invierte la dirección del primer factor negativo hacia la región positiva.'
definiciones_clave: '- **Regla de signos iguales**: Norma donde $(+) \cdot (+) = +$
  y $(-) \cdot (-) = +$.'
propiedades_relaciones: '- **Potencias pares**: Una base negativa elevada a un exponente
  par resulta positiva por esta regla ($(-x)^2 = +x^2$).'
ejemplo_guiado:
  enunciado: Calcule el producto de dos enteros negativos $(-6) \cdot (-7)$.
  pasos:
  - 'Paso 1: Identificar los signos de ambos factores: ambos son negativos.'
  - 'Paso 2: Aplicar la regla de signos iguales: $(-) \cdot (-) = +$.'
  - 'Paso 3: Multiplicar los valores absolutos: $6 \cdot 7 = 42$.'
  - 'Conclusión: $(-6) \cdot (-7) = 42$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la multiplicación (-5) · (-8)?
  choices:
