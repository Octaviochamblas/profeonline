semantic_id: MAT.NUM.ENTEROS_OPERATORIA.MULT_SIGNOS_IGUALES
resumen_inicial: "Al multiplicar dos enteros con el mismo signo, el resultado siempre es positivo: $(+)\\cdot(+)=(+)$ y $(-)\\cdot(-)=(+)$."
explicacion_simple: |
  Multiplicar dos positivos da positivo: $3 \cdot 4 = 12$. Pero también dos negativos dan
  positivo: $(-3) \cdot (-4) = 12$. Es como si los dos signos negativos se cancelaran
  entre sí. Puede parecer raro, pero es una regla fija: mismo signo, resultado positivo.
explicacion_formal: |
  $(+a) \cdot (+b) = +(a \cdot b)$ y $(-a) \cdot (-b) = +(a \cdot b)$. El valor absoluto
  del producto es el producto de los valores absolutos; el signo siempre es positivo
  cuando los factores comparten signo.
definiciones_clave: |
  **Regla de los signos**: mismo signo en la multiplicación produce siempre un resultado
  positivo, sin importar la magnitud de los factores.
propiedades_relaciones: |
  El cuadrado de cualquier entero (positivo o negativo) es siempre positivo, porque es el
  producto de un número por sí mismo (mismo signo).
ejemplo_guiado:
  enunciado: "Calcula $(-9) \\cdot (-6)$."
  pasos:
    - "Ambos factores son negativos: mismo signo."
    - 'Se multiplican los valores absolutos: $9 \cdot 6 = 54$.'
    - "El resultado es positivo: $54$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué signo tiene el producto de dos enteros negativos?"
    choices:
      - {text: "Positivo", is_correct: true}
      - {text: "Negativo", is_correct: false}
      - {text: "Depende del valor", is_correct: false}
      - {text: "Siempre cero", is_correct: false}
    explanation: "La correcta es Positivo: multiplicar dos negativos siempre da un resultado positivo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-7) \\cdot (-8)$?"
    choices:
      - {text: "$56$", is_correct: true}
      - {text: "$-56$", is_correct: false}
      - {text: "$15$", is_correct: false}
      - {text: "$-15$", is_correct: false}
    explanation: "La correcta es $56$: se multiplican los valores absolutos $7\\cdot8=56$ y el resultado es positivo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los dos factores y verificar que tienen el mismo signo (ambos positivos o ambos negativos)."
  - "Paso 2: Calcular el valor absoluto de cada factor (eliminar temporalmente sus signos)."
  - "Paso 3: Multiplicar los valores absolutos obtenidos."
  - "Paso 4: Escribir el resultado final como un número positivo (puede omitirse el signo $+$)."
errores_correccion: |
  Un error frecuente es confundir esta regla con la de la adición y pensar que dos
  negativos multiplicados dan negativo. Otro error es sumar los valores absolutos en vez
  de multiplicarlos.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: 'Calcular el producto: $(-8) \cdot (-7)$.'
    alternativas:
      - "$56$"
      - "$-56$"
      - "$1$"
    respuesta: "$56$"
    solucion_pasos:
      - "Identificar los signos: ambos números son negativos."
      - "Calcular valores absolutos: $|-8| = 8$ y $|-7| = 7$."
      - 'Multiplicar los valores absolutos: $8 \cdot 7 = 56$.'
      - "Dado que tienen el mismo signo, el resultado es positivo: $56$."
  - titulo: "Ejemplo 2"
    enunciado: 'Calcular el resultado de $(-12) \cdot (-3)$.'
    alternativas:
      - "$36$"
      - "$-36$"
      - "$-9$"
    respuesta: "$36$"
    solucion_pasos:
      - "Identificar los signos: ambos factores son negativos."
      - "Calcular valores absolutos: $|-12| = 12$ y $|-3| = 3$."
      - 'Multiplicar los valores absolutos: $12 \cdot 3 = 36$.'
      - "El resultado final es positivo: $36$."
  - titulo: "¿El producto de tres números negativos es positivo?"
    respuesta: "No"
    solucion_pasos:
      - "Al multiplicar los dos primeros negativos, el resultado es positivo por tener igual signo."
      - "Luego, multiplicamos ese resultado positivo por el tercer número negativo."
      - "Al multiplicar positivo por negativo (distinto signo), el resultado final es negativo."
      - 'Por ejemplo, $(-2) \cdot (-3) \cdot (-4) = (+6) \cdot (-4) = -24$.'
  - titulo: '¿Es $(-5) \cdot (-5)$ equivalente a $(-5)^2$?'
    respuesta: "Sí"
    solucion_pasos:
      - 'Por definición de potencia, elevar un número a la dos es multiplicarlo por sí mismo: $(-5)^2 = (-5) \cdot (-5)$.'
      - "Como ambos factores tienen el mismo signo, el resultado de la multiplicación es positivo ($25$)."
      - "Por lo tanto, $(-5)^2 = 25$."
errores_frecuentes:
  - "Creer que al multiplicar dos números negativos el resultado sigue siendo negativo por 'mantener el signo común' (confundiendo con la regla de la suma)."
  - 'Escribir el signo menos en el resultado de $(-a) \cdot (-b)$.'
  - 'Confundir la multiplicación con la suma y decir que $(-4) \cdot (-3) = -7$ en vez de $+12$.'
  - "Pensar que la regla de signos de igual signo solo aplica cuando los números son mayores a 10."
  - "Creer que al elevar un número negativo al cuadrado el resultado es negativo."
afirmaciones_verdaderas:
  - "El producto de dos números negativos siempre es positivo."
  - "(-4)·(-5) da como resultado un número positivo."
al_terminar_debes_poder: |
  Multiplicar dos enteros del mismo signo aplicando correctamente la regla de que el
  resultado siempre es positivo.
fuente: "Enteros"
estado: publicado
