semantic_id: MAT.ALG.FUNC_CUADR_BASE.DOMINIO_REALES
resumen_inicial: 'El dominio algebraico de toda función cuadrática no restringida por contexto comprende a la totalidad de los números reales: $\operatorname{Dom}(f) = \mathbb{R}$.'
explicacion_simple: |
  En una función cuadrática, cualquier número real que elijas se puede elevar al cuadrado, multiplicar por una constante y sumar a otros números sin romper ninguna regla matemática. Por esta razón, no existen valores de $x$ prohibidos y la curva parabólica se extiende infinitamente hacia la izquierda y hacia la derecha en el plano cartesiano.
explicacion_formal: |
  ### Definición formal
  Para toda función cuadrática polinomial $f(x) = ax^2 + bx + c$ definida en el cuerpo de los números reales ($a, b, c \in \mathbb{R}$, $a \neq 0$), el **dominio de definición** es el conjunto de todos los números reales:
  $$\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$$

  ### Desglose simbólico
  - $\operatorname{Dom}(f)$: Conjunto de todas las preimágenes válidas $x$ para las cuales $f(x)$ produce un número real bien definido.
  - $\mathbb{R}$: Conjunto de los números reales (desde $-\infty$ hasta $+\infty$).
  - Ausencia de restricciones: La expresión $ax^2 + bx + c$ no contiene denominadores que se puedan anular con la variable, ni radicales de índice par con variables en su interior, ni logaritmos.

  ### Síntesis didáctica
  En abstracto, la variable $x$ de una función cuadrática acepta cualquier número (positivo, negativo, decimal, irracional). Sin embargo, cuando la función modela un problema contextual (como tiempo, distancia o producción), el dominio físico se restringe al subconjunto compatible con el contexto (ej: $t \ge 0$).
definiciones_clave: |
  - **Dominio de una función**: Conjunto de todos los valores de entrada $x$ para los cuales la función está matemáticamente definida.
  - **Dominio real no restringido**: Propiedad de las funciones polinomiales donde $\operatorname{Dom}(f) = \mathbb{R}$.
  - **Dominio contextualizado**: Subconjunto de los reales delimitado por las restricciones físicas o prácticas del problema modelado.
propiedades_relaciones: |
  - **Diferencia entre Dominio y Recorrido**: Mientras que el dominio de una función cuadrática es siempre $\mathbb{R}$, su recorrido (rango) está acotado por el vértice en $[k, +\infty[$ si $a > 0$, o en $]-\infty, k]$ si $a < 0$.
  - **Continuidad global**: Toda función cuadrática es continua y derivable en todo su dominio $\mathbb{R}$, no posee asíntotas verticales ni huecos de discontinuidad.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = \frac{1}{3}x^2 - 5x + \sqrt{2}$, determina su dominio matemático real y compáralo con el dominio contextual de un problema donde $x$ representa el tiempo en segundos desde el lanzamiento de un objeto.'
  pasos:
    - 'Paso 1: Analizamos la regla algebraica de $f(x) = \frac{1}{3}x^2 - 5x + \sqrt{2}$. Al ser una función polinomial de segundo grado sin la variable en denominadores ni raíces, su dominio algebraico puro es $\operatorname{Dom}(f) = \mathbb{R}$.'
    - 'Paso 2: Evaluamos la restricción física del contexto: la variable $x$ representa tiempo transcurrido en segundos desde el lanzamiento ($x \ge 0$).'
    - 'Paso 3: Concluimos que el dominio matemático de la función es $\mathbb{R} = ]-\infty, +\infty[$, pero su dominio en el contexto del lanzamiento de un objeto se restringe al intervalo $[0, t_{\text{caída}}]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio de definición de la función cuadrática $g(x) = -5x^2 + 120x$ en el conjunto de los números reales?'
    choices:
      - {text: '$\operatorname{Dom}(g) = \mathbb{R} = ]-\infty, +\infty[$', is_correct: true}
      - {text: '$\operatorname{Dom}(g) = [0, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Dom}(g) = \mathbb{R} \setminus \{0\}$', is_correct: false}
      - {text: '$\operatorname{Dom}(g) = ]-\infty, 120]$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Dom}(g) = \mathbb{R} = ]-\infty, +\infty[$''. Toda función cuadrática polinomial pura está definida para todos los números reales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un modelo de ganancia en miles de pesos por producir $x$ artículos viene dado por $P(x) = -2x^2 + 40x - 150$. Si la producción no puede ser negativa ni superar las 25 unidades, ¿cuál es el dominio contextual de la función?'
    choices:
      - {text: '$[0, 25]$', is_correct: true}
      - {text: '$\mathbb{R}$', is_correct: false}
      - {text: '$]-150, 40]$', is_correct: false}
      - {text: '$]0, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''$[0, 25]$''. El contexto físico de producción restringe la entrada $x$ al intervalo $[0, 25]$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la fórmula de la función cuadrática y verificar si contiene restricciones algebraicas (variables en denominadores o bajo radicales).'
  - 'Paso 2: Si es un polinomio cuadrático puro $ax^2 + bx + c$, establecer directamente $\operatorname{Dom}(f) = \mathbb{R}$.'
  - 'Paso 3: Si existe un contexto práctico (tiempo, distancia, objetos), aplicar las desigualdades físicas necesarias para acotar el dominio al subconjunto real correspondiente.'
errores_correccion: |
  - **Error 1:** Mezclar el dominio de la función cuadrática (que es siempre $\mathbb{R}$) con su recorrido (que depende del vértice $k$). **Cómo corregirlo:** El dominio son las entradas $x$ permitidas (todos los reales), mientras que el recorrido son las salidas $y$ alcanzadas (acotadas desde o hasta el vértice).
  - **Error 2:** Creer que valores negativos de $x$ no pertenecen al dominio de $f(x) = x^2$. **Cómo corregirlo:** La operación de elevación al cuadrado está perfectamente definida para números negativos: $(-3)^2 = 9 \in \mathbb{R}$.
ejemplos:
  - titulo: 'Dominio de función cuadrática con fracciones en coeficientes'
    enunciado: '¿Cuál es el dominio de la función $f(x) = \frac{x^2}{4} - \frac{x}{2} + 1$?'
    alternativas:
      - '$\mathbb{R}$'
      - '$\mathbb{R} \setminus \{4, 2\}$'
      - '$[0, +\infty[$'
    respuesta: '$\mathbb{R}$'
    solucion_pasos:
      - '1. Aunque los coeficientes son fracciones ($a = \frac{1}{4}$, $b = -\frac{1}{2}$), la variable $x$ no está en el denominador.'
      - '2. Al ser una función polinomial cuadrática, se puede evaluar para cualquier número real.'
      - '3. Por lo tanto, su dominio es $\mathbb{R}$.'
  - titulo: 'Dominio de función cuadrática con coeficiente negativo'
    enunciado: '¿Existe algún número real $x$ para el cual la función $g(x) = -7x^2 + 14$ se indefina?'
    alternativas:
      - 'No, está definida para todo número real $x$'
      - 'Sí, para $x = 0$'
      - 'Sí, para $x < 0$'
    respuesta: 'No, está definida para todo número real $x$'
    solucion_pasos:
      - '1. La elevación al cuadrado y la multiplicación por $-7$ son operaciones válidas en todo el conjunto $\mathbb{R}$.'
      - '2. No existen valores donde la función se indefina.'
      - '3. Concluimos que $\operatorname{Dom}(g) = \mathbb{R}$.'
  - titulo: 'Extensión infinita de la parábola'
    enunciado: '¿La gráfica de una función cuadrática en el plano cartesiano se extiende horizontalmente sin límite hacia la izquierda y hacia la derecha?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, la curva abarca horizontalmente la totalidad del eje real.'
  - titulo: 'Asíntotas en la función cuadrática'
    enunciado: '¿Una función cuadrática $f(x) = ax^2 + bx + c$ posee asíntotas verticales en el plano real?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La ausencia de valores donde la función se indefina implica que no existen asíntotas verticales en ninguna función cuadrática.'
errores_frecuentes:
  - 'El dominio de la función $f(x) = x^2$ incluye únicamente a los números reales no negativos $[0, +\infty[$.'
  - 'Si el coeficiente $a$ es negativo, el dominio de la función se restringe a los números reales negativos.'
  - 'El dominio y el recorrido de una función cuadrática son siempre conjuntos idénticos.'
  - 'Una función cuadrática presenta discontinuidades e indefiniciones en $x = 0$.'
  - 'El dominio matemático de una función cuadrática cambia al modificar la constante $c$.'
afirmaciones_verdaderas:
  - 'El dominio algebraico de toda función cuadrática polinomial $f(x) = ax^2 + bx + c$ es el conjunto completo de los números reales $\mathbb{R}$.'
  - 'La gráfica de una función cuadrática es continua en todo el eje real, sin saltos ni asíntotas verticales.'
al_terminar_debes_poder: 'Determinar el dominio real de cualquier función cuadrática y diferenciarlo de su recorrido o de dominios acotados por contextos prácticos.'
