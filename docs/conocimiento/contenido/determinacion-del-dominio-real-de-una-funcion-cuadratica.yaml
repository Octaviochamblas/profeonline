procedimiento:
- 'Paso 1: Verifica que la regla de la función sea un polinomio (sin denominadores
  ni raíces con la variable).'
- 'Paso 2: Concluye que el dominio es $\mathbb{R}$, sin necesidad de excluir ningún
  valor.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en determinación del dominio real de una función
  cuadrática.
ejemplos:
- titulo: Determinación del dominio de una función cuadrática simple
  enunciado: Determina el dominio de $f(x)=x^2-9$.
  solucion_pasos:
  - Es un polinomio, sin denominadores ni raíces con $x$.
  - $\text{Dom}(f)=\mathbb{R}$.
- titulo: Determinación del dominio con coeficientes distintos
  enunciado: Determina el dominio de $f(x)=-3x^2+7x-2$.
  solucion_pasos:
  - Es un polinomio de segundo grado, definido para todo $x$ real.
  - $\text{Dom}(f)=\mathbb{R}$.
- titulo: ¿Existe alguna función cuadrática cuyo dominio no sea todo $\mathbb{R}$?
  enunciado: ¿Existe alguna función cuadrática cuyo dominio no sea todo $\mathbb{R}$?
  respuesta: 'No'
  solucion_pasos:
  - Por definición, toda función cuadrática es un polinomio de grado 2, y todo polinomio
    está definido para cualquier número real.
- titulo: ¿El dominio de una función cuadrática depende del signo de sus coeficientes?
  enunciado: ¿El dominio de una función cuadrática depende del signo de sus coeficientes?
  respuesta: 'No'
  solucion_pasos:
  - Sin importar los valores o signos de $a$, $b$ y $c$, el dominio siempre es $\mathbb{R}$.
errores_frecuentes:
- Declarar el dominio (siempre $\mathbb{R}$) con el recorrido, que sí depende de los
  coeficientes de la función.
- Buscar restricciones de dominio como si la función tuviera una raíz cuadrada o un
  denominador.
- Excluir por error el cero u otros valores particulares sin ninguna justificación
  matemática.
- Declarar el dominio de la función cuadrática con el dominio restringido de un problema
  aplicado (contexto).
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  determinación del dominio real de una función cuadrática.
