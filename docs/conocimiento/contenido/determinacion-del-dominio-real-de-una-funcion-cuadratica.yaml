semantic_id: MAT.ALG.FUNC_CUADR_BASE.DOMINIO_REALES
resumen_inicial: El dominio natural de toda función cuadrática polinómica $f(x) = ax^2 + bx + c$ es el conjunto de todos los números reales $\text{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, ya que las operaciones de potenciación, producto y suma están definidas para todo elemento real.
explicacion_simple: "![El dominio natural de toda función cuadrática polinómica $f(x) = ax^2 + bx + c$ es el conjunto de todos los números reales $\\text{Dom}(f) = \\mathbb{R} = ]-\\infty, +\\infty[$, ya que las operaciones de potenciación, producto y suma están definidas para todo elemento real](/static/img/nodos/determinacion-del-dominio-real-de-una-funcion-cuadratica-intro.svg)\n\n\nEl **dominio** de una función son todos los números que le puedes meter a la máquina de entrada ($x$):\n\n- **¿Existe algún número prohibido en $f(x) = ax^2 + bx + c$?**\n  - ¿Hay divisiones por cero? **No** (no hay $x$ abajo en el denominador).\n  - ¿Hay raíces cuadradas que puedan dar negativas? **No** (no hay $x$ dentro de raíces).\n- Puedes meter números positivos, negativos, el cero, fracciones, decimales o raíces como $\\sqrt{2}$, y siempre podrás elevarlo al cuadrado y obtener un resultado real.\n- **Por eso, el dominio de CUALQUIER función cuadrática es SIEMPRE todos los números reales: $\\text{Dom}(f)\
  \ = \\mathbb{R}$**."
explicacion_formal: "Sea $f: \\mathcal{D} \\to \\mathbb{R}$ la función definida por la regla de correspondencia $f(x) = ax^2 + bx + c$ con $a \\neq 0$. El **dominio maximal de definición** $\\text{Dom}(f)$ se define formalmente como:\n$$\\text{Dom}(f) = \\{x \\in \\mathbb{R} \\mid ax^2 + bx + c \\in \\mathbb{R}\\} = \\mathbb{R} = ]-\\infty, +\\infty[$$\n\n**Justificación en la estructura de cuerpo $\\mathbb{R}$**:\n1. **Clausura algebraica de operaciones polinómicas**: La terna de operaciones $(\\cdot, +, -)$ en $(\\mathbb{R}, +, \\cdot)$ es cerrada.\n2. **Inexistencia de restricciones de dominio**:\n   - Denominador nulo: $\\nexists g(x)$ en el divisor.\n   - Radicales de orden par: $\\nexists \\sqrt[2n]{h(x)}$.\n   - Argumentos logarítmicos: $\\nexists \\log(k(x))$.\n3. **Dominio Natural vs Dominio Contextual / Restringido**: En aplicaciones físicas o geométricas de modelación, el dominio matemático $\\mathbb{R}$ puede acotarse a un subconjunto propio $\\mathcal{D}_{\\text{contextual}}\
  \ \\subset \\mathbb{R}$ (ej: $x > 0$ o $t \\ge 0$)."
definiciones_clave: '- **Dominio maximal de definición**: Conjunto más amplio de valores de $x$ para los cuales la regla matemática produce un resultado real bien definido.

  - **Dominio contextual**: Subconjunto propio de $\mathbb{R}$ delimitado por las restricciones de un problema aplicado del mundo real.'
propiedades_relaciones: '- **Dominio vs Recorrido**: El dominio de toda función cuadrática es siempre $\mathbb{R}$, mientras que su recorrido (rango) está acotado inferiormente $[y_v, +\infty[$ (si $a > 0$) o superiormente $]-\infty, y_v]$ (si $a < 0$).

  - **Continuidad en $\mathbb{R}$**: Toda función cuadrática es continua en la totalidad de su dominio real.'
ejemplo_guiado:
  enunciado: '![Ejemplo El dominio natural de toda función cuadrática polinómica $f(x) = ax^2 + bx + c$ es el conjunto de todos los números reales $\text{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, ya que las operaciones de potenciación, producto y suma están definidas para todo elemento real](/static/img/nodos/determinacion-del-dominio-real-de-una-funcion-cuadratica-ejemplos.svg)



    Analiza y determina el dominio de las siguientes funciones:

    1) $f(x) = -5x^2 + 3x - 8$

    2) $A(x) = x(20 - x)$, donde $A(x)$ modela el área de un rectángulo con $x$ como longitud.'
  pasos:
  - 'Paso 1: Para $f(x) = -5x^2 + 3x - 8$:

    - Es una función cuadrática polinómica pura sin restricciones algebraicas.

    - Dominio: $\text{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
  - 'Paso 2: Para $A(x) = x(20 - x)$:

    - Dominio matemático abstracto: $\mathbb{R}$.

    - Dominio contextual de la longitud: Las dimensiones deben ser estrictamente positivas ($x > 0$ y $20 - x > 0 \implies x < 20$).

    - Dominio contextual: $\text{Dom}_{\text{geom}} = ]0, 20[ \subset \mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función cuadrática $f(x) = -4x^2 + 100$ en el conjunto de los números reales?
  choices:
  - text: Dom(f) = ℝ (todos los números reales)
    is_correct: true
  - text: Dom(f) = [-5, 5]
    is_correct: false
  - text: Dom(f) = ]-∞, 100]
    is_correct: false
  - text: Dom(f) = ℝ⁺ (solo los reales positivos)
    is_correct: false
  explanation: La alternativa correcta es 'Dom(f) = ℝ (todos los números reales)'. Toda función polinómica cuadrática está definida para todos los números reales.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el dominio de una función cuadrática es ℝ mientras que su recorrido NO es ℝ?
  choices:
  - text: Porque x puede tomar cualquier valor real, pero y está acotada por el vértice de la parábola.
    is_correct: true
  - text: Porque x debe ser siempre positivo.
    is_correct: false
  - text: Porque la parábola no cruza el eje Y.
    is_correct: false
  - text: Porque el discriminante siempre es cero.
    is_correct: false
  explanation: La alternativa correcta es 'Porque x puede tomar cualquier valor real, pero y está acotada por el vértice de la parábola.'. El dominio es horizontal ($X = \mathbb{R}$) y el recorrido es vertical ($Y$ acotado por el vértice).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si la función es polinómica cuadrática pura o si proviene de un modelo aplicado con restricciones.'
- 'Paso 2: Para toda función cuadrática polinómica pura, establecer directamente que $\text{Dom}(f) = \mathbb{R}$.'
- 'Paso 3: Si proviene de un contexto real (longitud, tiempo), imponer las desigualdades físicas pertinentes.'
- 'Paso 4: Expresar el dominio en notación de conjuntos o intervalos.'
errores_correccion: '- **Error común:** Confundir el dominio (eje X) con el recorrido (eje Y) y creer que el dominio depende del vértice.

  - **Cómo corregirlo:** El **dominio es siempre $\mathbb{R}$**; es el **recorrido** el que está limitado por la altura del vértice.'
ejemplos:
- titulo: 'Ejemplo 1: Dominio de parábola invertida'
  enunciado: ¿Cuál es el dominio de $f(x) = -x^2 + 4x - 9$?
  alternativas:
  - R (todos los reales)
  - ']-inf, -5]'
  - '[2, +inf['
  - R - {0}
  respuesta: R (todos los reales)
  solucion_pasos:
  - 'Paso 1: Por ser función polinómica cuadrática, $\text{Dom}(f) = \mathbb{R}$.'
- titulo: 'Ejemplo 2: Dominio en notación de intervalos'
  enunciado: Expresa el dominio de $g(x) = 2x^2 - 8$ en notación de intervalo.
  alternativas:
  - ']-inf, +inf['
  - '[-8, +inf['
  - '[-2, 2]'
  - '[0, +inf['
  respuesta: ']-inf, +inf['
  solucion_pasos:
  - 'Paso 1: $\mathbb{R} = ]-\infty, +\infty[$.'
- titulo: 'Ejemplo 3: Función cuadrática monomia'
  enunciado: ¿Qué dominio tiene $h(x) = \frac{1}{4}x^2$?
  alternativas:
  - Todos los números reales R
  - Solo números enteros
  - Solo números racionales
  - '[0, +inf['
  respuesta: Todos los números reales R
  solucion_pasos:
  - 'Paso 1: $\text{Dom}(h) = \mathbb{R}$.'
- titulo: 'Ejemplo 4: Dominio de tiempo en caída libre'
  enunciado: En $h(t) = 20t - 5t^2$, el tiempo de vuelo va desde el lanzamiento hasta el suelo. ¿Cuál es el dominio temporal?
  alternativas:
  - '[0, 4] segundos'
  - R (todos los reales)
  - '[0, +inf['
  - '[0, 20]'
  respuesta: '[0, 4] segundos'
  solucion_pasos:
  - 'Paso 1: $h(t) = 0 \implies t = 0$ y $t = 4 \implies \text{Dom} = [0, 4]\text{ s}$.'
errores_frecuentes:
- Confundir dominio con recorrido.
- Pensar que una parábola negativa no puede recibir números positivos como preimágenes.
- Limitar erróneamente el dominio al intervalo entre las raíces.
afirmaciones_verdaderas:
- El dominio natural de toda función cuadrática real es el conjunto ℝ de los números reales.
- No existen restricciones algebraicas de división por cero ni raíces negativas en f(x) = ax² + bx + c.
al_terminar_debes_poder: '**QUÉ:** Determinar el dominio real de una función cuadrática y diferenciarlo de restricciones contextuales.


  **CÓMO:** Identificando la naturaleza polinómica sin singularidades para establecer Dom(f) = ℝ.


