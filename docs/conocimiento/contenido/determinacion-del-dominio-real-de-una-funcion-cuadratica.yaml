semantic_id: MAT.ALG.FUNC_CUADR_BASE.DOMINIO_REALES
resumen_inicial: La determinación del dominio real de una función cuadrática establece que su dominio sin restricciones es siempre el conjunto de todos los números reales $\text{Dom}(f) = \mathbb{R}$.
explicacion_simple: |
  El **dominio** de una función es el conjunto de todos los números que puedes meter como valor de $x$ en la fórmula sin que la matemática se "rompa" (como dividir entre cero o sacar raíz de negativo):

  - En cualquier **función cuadrática** $f(x) = ax^2 + bx + c$:
    - Puedes elevar al cuadrado **cualquier número real** (positivo, negativo, cero, fracción o decimal).
    - Puedes multiplicar por $a$ y $b$ cualquier número.
    - Puedes sumar y restar sin restricciones.
  - **Conclusión universal**: El dominio de toda función cuadrática (si no hay un problema contextual) es **TODOS LOS NÚMEROS REALES**:
    $$\text{Dom}(f) = \mathbb{R} \quad \text{o bien} \quad ]-\infty, +\infty[$$
explicacion_formal: |
  Sea la función polinómica de segundo grado $f(x) = ax^2 + bx + c$ con $a, b, c \in \mathbb{R}$ y $a \neq 0$. El **dominio natural de definición** $\text{Dom}(f)$ se define como el conjunto de todos los valores de entrada $x \in \mathbb{R}$ para los cuales la imagen $f(x)$ es un número real bien definido:

  $$\text{Dom}(f) = \{x \in \mathbb{R} \mid f(x) \in \mathbb{R}\} = \mathbb{R}$$

  **Inexistencia de restricciones algebraicas:**
  Los polinomios de grado 2 no contienen indeterminaciones de tipo fraccionario (división por cero) ni restricciones de radicales de índice par sobre variables. Por lo tanto, el dominio es maximal e ilimitado:

  $$\text{Dom}(f) = \mathbb{R} = (-\infty, +\infty)$$
definiciones_clave: |
  - **Dominio de una función cuadrática**: Conjunto de todos los números reales $\mathbb{R}$ para los cuales la función cuadrática se encuentra completamente definida.
propiedades_relaciones: |
  - **Diferencia entre Dominio y Recorrido**: Mientras que el dominio abarca siempre la totalidad de la recta real $\mathbb{R}$, el recorrido (o rango) está acotado por la coordenada vertical del vértice y la concavidad ($[k, +\infty[$ o $]-\infty, k]$).
ejemplo_guiado:
  enunciado: 'Determina el dominio algebraico natural de la función cuadrática $f(x) = -5x^2 + 12x - 100$.'
  pasos:
    - 'Paso 1: Analizar la estructura de la expresión: es un polinomio cuadrático en $x$.'
    - 'Paso 2: Comprobar la presencia de divisiones por variable o raíces: no existen denominadores con $x$ ni radicales.'
    - 'Paso 3: Declarar que todo número real admite ser elevado al cuadrado y operado.'
    - 'Paso 4: Concluir que el dominio es el conjunto de los números reales: $\text{Dom}(f) = \mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio natural de la función cuadrática $f(x) = \frac{1}{2}x^2 - 3x + 8$ en el conjunto de los números reales?'
    choices:
      - {text: 'El conjunto de todos los números reales $\mathbb{R}$ ($]-\infty, +\infty[$)', is_correct: true}
      - {text: 'Únicamente los números reales positivos ($\mathbb{R}^+$).', is_correct: false}
      - {text: 'El conjunto de los números enteros excluyendo el cero.', is_correct: false}
      - {text: 'El intervalo acotado $[0, 8]$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto de todos los números reales $\mathbb{R}$ ($]-\infty, +\infty[$)''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función cuadrática $g(x) = -x^2 + 10$ tiene dominio $\text{Dom}(g) = \mathbb{R}$?'
    choices:
      - {text: 'Porque se puede evaluar cualquier número real $x$ sin generar divisiones por cero ni indeterminaciones.', is_correct: true}
      - {text: 'Porque su gráfica es una línea recta que pasa por el origen.', is_correct: false}
      - {text: 'Porque su discriminante es siempre igual a cero.', is_correct: false}
      - {text: 'Porque no posee término lineal $b$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque se puede evaluar cualquier número real $x$ sin generar divisiones por cero ni indeterminaciones.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar que la función presentada corresponde a un polinomio de segundo grado $f(x) = ax^2 + bx + c$.'
  - 'Paso 2: Verificar que no exista una restricción contextual explícita indicada en el problema (como tiempo $t \ge 0$).'
  - 'Paso 3: Aplicar el principio polinómico que establece que no existen indeterminaciones matemáticas en $\mathbb{R}$.'
  - 'Paso 4: Escribir la respuesta formal $\text{Dom}(f) = \mathbb{R}$ o $(-\infty, +\infty)$.'
errores_correccion: |
  - **Error común:** Confundir el dominio (valores permitidos de $x$) con el recorrido (valores resultantes de $y$).
  - **Cómo corregirlo:** El **DOMINIO ES SIEMPRE $\mathbb{R}$** para la $x$; las restricciones de máximo o mínimo aplican solo al recorrido $y$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Dominio de función mónica.
    alternativas:
      - '$\text{Dom}(f) = \mathbb{R}$'
      - '$\text{Dom}(f) = [0, +\infty['
      - '$\text{Dom}(f) = \mathbb{R} \setminus \{0\}$'
    respuesta: '$\text{Dom}(f) = \mathbb{R}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Dominio con coeficiente fraccionario.
    alternativas:
      - '$\text{Dom}(f) = \mathbb{R}$'
      - '$\text{Dom}(f) = \mathbb{R} \setminus \{3\}$'
      - '$\text{Dom}(f) = ]-\infty, 0]'
    respuesta: '$\text{Dom}(f) = \mathbb{R}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La equiparación del dominio de la función cuadrática ($\mathbb{R}$) con su recorrido acotado por el vértice.'
  - 'Restringir el dominio únicamente a los números reales positivos $\mathbb{R}^+$ sin que exista un contexto físico que lo justifique.'
  - 'La creencia de que si el coeficiente cuadrático $a$ es negativo, el dominio de la función se restringe a números negativos.'
  - 'La supresión del número cero del dominio de la función cuadrática sin motivo algebraico.'
  - 'Afirmar que una función cuadrática con discriminante negativo carece de dominio real.'
afirmaciones_verdaderas:
  - 'El dominio algebraico natural de cualquier función cuadrática $f(x) = ax^2 + bx + c$ es siempre el conjunto de los números reales $\text{Dom}(f) = \mathbb{R}$.'
  - 'A diferencia del recorrido que posee un valor extremo en el vértice, el dominio no presenta acotación ni agujeros en la recta real.'
al_terminar_debes_poder: |
  QUÉ: Determinar y justificar el dominio real de una función cuadrática.
  CÓMO: Reconocer la estructura polinómica sin indeterminaciones, diferenciar dominio de recorrido y establecer $\text{Dom}(f) = \mathbb{R}$.
