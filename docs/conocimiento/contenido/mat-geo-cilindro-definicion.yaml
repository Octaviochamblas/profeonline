semantic_id: MAT.GEO.CUERPOS_REDONDOS_BASE.CILINDRO_DEFINICION
resumen_inicial: 'Definición de cilindro: conceptos, teoremas, propiedades geométricas
  y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'Un cilindro es como una lata de conservas: dos tapas circulares
  idénticas conectadas por una superficie curva.'
explicacion_formal: '![Definición de cilindro](/static/img/geometria/espacio-cuerpos/cilindro-definicion.svg)


  ### Definición formal


  Un cilindro recto está formado por dos círculos congruentes y paralelos (las bases),
  de radio $r$, separados por una distancia $h$ (la altura), y conectados por una
  superficie lateral curva perpendicular a las bases.


  ### Desarrollo didáctico


  En la figura, el cilindro tiene sus dos bases circulares (superior e inferior),
  de radio $r$, separadas por la altura $h$. A diferencia de los poliedros, la superficie
  lateral del cilindro es curva, no está formada por polígonos planos.'
definiciones_clave: '- **Definición de cilindro**: Elemento o propiedad fundamental
