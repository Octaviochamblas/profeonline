procedimiento:
- 'Paso 1: Identifica las dos bases circulares congruentes y paralelas del cuerpo.'
- 'Paso 2: Reconoce la superficie lateral curva que conecta ambas bases.'
- 'Paso 3: Identifica el radio (r) de las bases y la altura (h), la distancia entre
  ellas.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
