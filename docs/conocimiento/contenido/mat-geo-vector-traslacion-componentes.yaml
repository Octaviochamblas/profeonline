semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.VECTOR_TRASLACION_COMPONENTES
resumen_inicial: 'Identificación de las componentes del vector traslación: conceptos,
  teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Las componentes del vector traslación son como las ''instrucciones
  de movimiento'': cuánto avanzar horizontalmente y cuánto verticalmente.'
explicacion_formal: '![Componentes del vector traslación](/static/img/geometria/isometrias/vector-traslacion-componentes.svg)


  ### Definición formal


  Si el vector traslación es $\vec{v}=(a,b)$, todo punto $P(x,y)$ se transforma en
  $P''(x+a,\,y+b)$: la componente $a$ desplaza horizontalmente y la componente $b$
  desplaza verticalmente.


  ### Desarrollo didáctico


  En la figura, el vector traslación $\vec{v}=(5,4)$ tiene componente horizontal $a=5$
  (desplazamiento hacia la derecha) y componente vertical $b=4$ (desplazamiento hacia
  arriba).'
definiciones_clave: '- **Identificación de las componentes del vector traslación**:
  Elemento o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de las componentes del vector
  traslación.'
