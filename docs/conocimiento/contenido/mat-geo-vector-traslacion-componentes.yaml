procedimiento:
- 'Paso 1: Identifica el vector traslación v=(a,b) de la transformación.'
- 'Paso 2: Reconoce que la componente a indica el desplazamiento horizontal (positivo
  a la derecha, negativo a la izquierda).'
- 'Paso 3: Reconoce que la componente b indica el desplazamiento vertical (positivo
  hacia arriba, negativo hacia abajo).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación de las componentes del vector traslación.
ejemplos:
