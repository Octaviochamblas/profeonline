- titulo: ¿Se cumple siempre la propiedad principal de concepto de razón de semejanza
    en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
