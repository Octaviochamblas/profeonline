semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.RAZON_SEMEJANZA_CONCEPTO
resumen_inicial: 'Concepto de razón de semejanza: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'Cuando dos figuras son semejantes, existe un único número que
  resume la relación de tamaño entre ellas: la razón de semejanza.'
explicacion_formal: '![Razón de semejanza](/static/img/geometria/congruencia-semejanza/semejanza-razon-concepto.svg)


  ### Definición formal


  Si dos figuras semejantes tienen lados correspondientes $l$ y $l''$, la razón de
  semejanza es $k=\frac{l''}{l}$ (o su inverso, según cuál figura se tome como referencia).


  ### Desarrollo didáctico


  Si $k>1$, la segunda figura es una ampliación de la primera; si $0<k<1$, es una
  reducción; si $k=1$, las figuras son congruentes (mismo tamaño). El valor de $k$
  resume toda la información de escala entre ambas figuras.'
definiciones_clave: '- **Concepto de razón de semejanza**: Elemento o propiedad fundamental
  en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de razón de semejanza.'
