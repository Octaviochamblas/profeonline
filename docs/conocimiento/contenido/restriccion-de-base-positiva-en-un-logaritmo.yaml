semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_POSITIVA
resumen_inicial: La base $b$ de un logaritmo debe ser estrictamente positiva ($b > 0$) para asegurar que las potencias reales existan y no produzcan números complejos ni indeterminaciones.
explicacion_simple: '![Restricción de base positiva](/static/img/nodos/restriccion-de-base-positiva-en-un-logaritmo-intro.svg)


  ¿Por qué la base de un logaritmo no puede ser negativa ni cero?

  - **Si fuera negativa (como $-2$):** $(-2)^{1/2} = \sqrt{-2}$, ¡que no es un número real! Las potencias con base negativa alternan de signo y se rompen en fracciones.

  - **Si fuera cero ($0$):** $0^c$ siempre es $0$, por lo que jamás podría dar números como $5$ u $8$.

  - Por eso, la base debe ser siempre positiva: $b > 0$.'
explicacion_formal: 'En la definición de $\log_b(a) = c \iff b^c = a$, la condición **$b > 0$** es un requisito algebraico indispensable para que la función exponencial $f(x) = b^x$ esté unívocamente definida sobre todo el cuerpo de los números reales $\mathbb{R}$.


  **Análisis de Imposibilidad:**

  1. **Para $b < 0$:** Exponentes racionales con denominador par (ej. $x = \frac{1}{2}, \frac{3}{4}$) generarían raíces de radicando negativo en $\mathbb{R}$:

  $$(-b)^{1/2} = \sqrt{-b} \notin \mathbb{R}$$

  2. **Para $b = 0$:** $0^x = 0$ para todo $x > 0$, lo que impide generar cualquier argumento $a \neq 0$.


  Por lo tanto, el dominio de bases admisibles exige estrictamente $b \in \mathbb{R}^+$.'
definiciones_clave: '- **Base positiva ($b > 0$)**: Restricción de positividad obligatoria de la base de todo logaritmo.

  - **Clausura en $\mathbb{R}$**: Garantía de que las potencias generadas pertenezcan exclusivamente a los números reales.

  - **Solución extraña**: Solución algebraica negativa que debe descartarse al resolver incógnitas en la base.'
propiedades_relaciones: '- **Intersección de restricciones**: La base debe ser $b > 0$ y $b \neq 1$.

  - **Descarte de negativos**: En $x^2 = 16 \implies x = \pm 4$, como base de logaritmo solo es válida $x = 4$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de restricción de base positiva](/static/img/nodos/restriccion-de-base-positiva-en-un-logaritmo-ejemplos.svg)


    Analice la validez en $\mathbb{R}$ de las expresiones $\log_{-2}(4)$, $\log_0(5)$ y $\log_3(27)$.'
  pasos:
  - 'Paso 1: Para $\log_{-2}(4)$: La base es $-2 < 0$. No está definida en $\mathbb{R}$ por ser negativa.'
  - 'Paso 2: Para $\log_0(5)$: La base es $0$. Como $0^c \neq 5$ para todo $c$, está indefinida.'
  - 'Paso 3: Para $\log_3(27)$: La base es $3 > 0$ y distinta de 1. Es válida y su valor es $3$ (pues $3^3 = 27$).'
  - 'Conclusión: Solo $\log_3(27)$ está correctamente definido en $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la expresión $\log_{-3}(9)$ no está definida en los números reales?
  choices:
  - text: Porque la base es negativa ($-3 < 0$), lo que viola la condición $b > 0$
    is_correct: true
  - text: Porque $9$ no es múltiplo de $3$
    is_correct: false
  - text: Porque $(-3)^2 = -9$
    is_correct: false
  - text: Porque el resultado debería ser decimal
    is_correct: false
  explanation: La alternativa correcta es 'Porque la base es negativa ($-3 < 0$), lo que viola la condición $b > 0$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $\log_x(25) = 2$, se obtiene $x^2 = 25 \implies x = \pm 5$. ¿Cuál es la solución correcta?
  choices:
  - text: $x = 5$ únicamente, porque la base debe ser estrictamente positiva ($b > 0$)
    is_correct: true
  - text: $x = -5$ únicamente
    is_correct: false
  - text: Ambas soluciones $x = 5$ y $x = -5$
    is_correct: false
  - text: Ninguna solución
    is_correct: false
  explanation: La alternativa correcta es '$x = 5$ únicamente, porque la base debe ser estrictamente positiva ($b > 0$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ del logaritmo.'
- 'Paso 2: Comprobar que $b > 0$. Si $b \le 0$, el logaritmo no existe en $\mathbb{R}$.'
- 'Paso 3: En ecuaciones algebraicas, descartar toda solución donde la base resulte menor o igual a cero.'
errores_correccion: '- **Error 1: Aceptar bases negativas porque $(-2)^2 = 4$.** **Cómo corregirlo:** Aunque $(-2)^2 = 4$, la función $\log_{-2}(x)$ no es continua en $\mathbb{R}$ y está excluida por definición formal.

  - **Error 2: No descartar soluciones negativas en ecuaciones.** **Cómo corregirlo:** Si $x^2 = 49$, descartar $x = -7$ para la base de un logaritmo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Existe el valor real de $\log_{-4}(16)$?
  alternativas:
  - No existe en $\mathbb{R}$
  - $2$
  - $-2$
  respuesta: No existe en $\mathbb{R}$
  solucion_pasos:
  - La base es $-4 < 0$, por lo que no está definido en $\mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: Si $\log_x(36) = 2$, ¿cuál es el valor válido de $x$?
  alternativas:
  - $6$
  - $\pm 6$
  - $-6$
  respuesta: $6$
  solucion_pasos:
  - $x^2 = 36 \implies x = 6$ (se descarta $-6$ por restricción de base positiva).
- titulo: ¿Es log₀(10) una expresión válida en ℝ?
  respuesta: 'No'
  solucion_pasos:
  - No, porque la base $0$ no cumple la condición $b > 0$.
  alternativas:
  - texto: No, la base no puede ser 0
    es_correcta: true
    retroalimentacion: ¡Correcto! La base debe ser estrictamente positiva.
  - texto: Sí, es igual a 0
    es_correcta: false
    retroalimentacion: Incorrecto, $0^c \neq 10$ para todo $c$.
  - texto: Sí, es igual a 1
    es_correcta: false
    retroalimentacion: Incorrecto, está matemáticamente indefinido.
- titulo: ¿Es log_{1/2}(8) = -3 una expresión válida en ℝ?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la base $1/2 > 0$ es positiva y distinta de 1, dando $(1/2)^{-3} = 2^3 = 8$.
  alternativas:
  - texto: Sí, base 1/2 > 0 es positiva y válida
    es_correcta: true
    retroalimentacion: ¡Correcto! Las bases fraccionarias positivas son completamente válidas.
  - texto: No, la base debe ser entera
    es_correcta: false
    retroalimentacion: Incorrecto, las bases pueden ser cualquier real positivo distinto de 1.
  - texto: No, el resultado no puede ser negativo
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente puede ser negativo.
errores_frecuentes:
- Aceptar bases negativas por coincidencia en exponentes pares.
- Olvidar descartar soluciones negativas al despejar la base.
- Creer que las bases fraccionarias menores a 1 son negativas.
- Permitir la base cero.
afirmaciones_verdaderas:
- La base de un logaritmo debe ser un número real estrictamente positivo ($b > 0$).
- Las bases negativas no están definidas en $\mathbb{R}$ para evitar números complejos.
- En ecuaciones logarítmicas, se descartan las soluciones donde la base resulte menor o igual a cero.
al_terminar_debes_poder: '![Síntesis de restricción de base positiva](/static/img/nodos/restriccion-de-base-positiva-en-un-logaritmo-resumen.svg)


  QUÉ: Comprender y aplicar la restricción de base positiva $b > 0$ en logaritmos.


  CÓMO: Verificando que la base pertenezca a $\mathbb{R}^+$ y descartando soluciones negativas en ecuaciones donde la incógnita se encuentre en la base.'
