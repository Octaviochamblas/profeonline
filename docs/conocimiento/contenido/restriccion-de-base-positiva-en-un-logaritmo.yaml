semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_POSITIVA
resumen_inicial: La base de un logaritmo debe ser estrictamente mayor que cero ($b > 0$) para
  garantizar que las potencias estén bien definidas en los números reales.
explicacion_simple: No existen logaritmos con base negativa (como $\log_{-2}(8)$). Si la base
  fuese negativa, al elevarla a exponentes racionales o decimales (como $\frac{1}{2}$) obtendríamos
  raíces pares de números negativos que no existen en los reales.
explicacion_formal: En la función $f(x) = \log_b(x)$, la restricción $b > 0$ es indispensable
  para asegurar que la función exponencial $b^x$ sea una función continua y estrictamente
  creciente/decreciente definida para todo $x \in \mathbb{R}$.
definiciones_clave: '- **Restricción de base positiva**: Condición de dominio $b > 0$ requerida
  en todo logaritmo.'
propiedades_relaciones: '- **Imposibilidad en $\mathbb{R}$**: Si $b \le 0$, el logaritmo no
  es una función real bien definida.'
ejemplo_guiado:
  enunciado: Determina si la expresión $\log_{-3}(9)$ es un logaritmo real válido.
  pasos:
  - 'Identificar la base del logaritmo: $b = -3$.'
  - 'Comprobar la restricción de la base: exige que $b > 0$.'
  - Como $-3 < 0$, la base es negativa.
  - Concluir que $\log_{-3}(9)$ NO es un logaritmo válido en $\mathbb{R}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la expresión $\log_{-5}(25)$ no está definida en los números reales?
  choices:
  - text: Porque la base del logaritmo es negativa (-5 < 0)
    is_correct: true
  - text: Porque 25 es impar
    is_correct: false
  - text: Porque da como resultado 2
    is_correct: false
  - text: Porque no se puede elevar a 2
    is_correct: false
  explanation: 'La correcta es: Porque la base del logaritmo es negativa (-5 < 0). La base
    exige estrictamente $b > 0$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para que el logaritmo $\log_{x-2}(10)$ sea válido, ¿qué condición de positividad
    debe cumplir $x$?
  choices:
  - text: x > 2
    is_correct: true
  - text: x > 0
    is_correct: false
  - text: x > 1
    is_correct: false
  - text: x ≠ 2
    is_correct: false
  explanation: 'La correcta es: x > 2. Exigimos base positiva: $x - 2 > 0 \implies x > 2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión correspondiente a la base $b$.'
- 'Paso 2: Plantear la inecuación $b > 0$.'
- 'Paso 3: Resolver para determinar los valores válidos.'
errores_correccion: No intentes calcular logaritmos con base negativa. No pertenecen al campo
  de los números reales.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es válido $\log_{-2}(4)$?
  alternativas:
  - No, base negativa
  - Sí, vale 2
  respuesta: No, base negativa
  solucion_pasos:
  - La base debe ser estrictamente positiva.
- titulo: Ejemplo 2
  enunciado: ¿Es válido el logaritmo con base 0 en los reales?
  alternativas:
  - No, la base debe ser mayor que 0
  - Sí, vale 0
  - Sí, vale 1
  respuesta: No, la base debe ser mayor que 0
  solucion_pasos:
  - La base 0 no cumple la restricción b > 0.
- titulo: Ejemplo 3
  enunciado: ¿Qué condición debe cumplir x para que log base (x+1) de 8 sea válido respecto
    a la base?
  alternativas:
  - x > -1
  - x ≥ -1
  - x < -1
  respuesta: x > -1
  solucion_pasos:
  - Se exige x+1 > 0, es decir x > -1.
- titulo: ¿Puede una base de logaritmo ser un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - La base debe ser estrictamente positiva para que el logaritmo esté bien definido en los
    reales.
errores_frecuentes:
- Intentar resolver logaritmos con base negativa.
- Aceptar una base igual a cero como válida para un logaritmo.
- Intentar calcular un logaritmo con base negativa asumiendo que el resultado será negativo.
- Confundir la restricción de la base con la restricción del argumento.
- Olvidar plantear la inecuación correspondiente al determinar el dominio de una base variable.
afirmaciones_verdaderas:
- Toda base de logaritmo debe cumplir $b > 0$.
- La restricción de base positiva evita que aparezcan raíces de números negativos al evaluar
  la función exponencial asociada.
al_terminar_debes_poder: Verificar la restricción de base positiva en logaritmos.
fuente: Texto escolar MINEDUC.
estado: publicado
