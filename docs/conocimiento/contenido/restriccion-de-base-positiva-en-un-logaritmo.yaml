resumen_inicial: La base $b$ de un logaritmo $\log_b(a)$ debe ser estrictamente positiva
  ($b > 0$) para asegurar resultados reales bien definidos.
explicacion_simple: La base de un logaritmo no puede ser negativa ni cero. Si fuera
  negativa, al elevarla a exponentes decimales o pares/impares obtendríamos inconsistencias
  y valores no reales.
explicacion_formal: 'Para todo $\log_b(a)$, la **Restricción de Positividad de la
  Base** exige:


  $$b \in \mathbb{R}^+ \iff b > 0$$


  **Demostración de inconsistencia para $b \le 0$:**

  - Si $b = -2$, la potencia $(-2)^x$ no está definida en $\mathbb{R}$ para exponente
  $x = 1/2$ (genera la raíz $\sqrt{-2} \notin \mathbb{R}$).'
definiciones_clave: '- **Restricción de base positiva**: Condición $b > 0$ indispensable
  para definir la función exponencial subyacente.'
propiedades_relaciones: '- **Dominio de la base**: $b \in (0, +\infty) \setminus \{1\}$.'
ejemplo_guiado:
  enunciado: Determine si las expresiones $\log_{-3}(9)$ y $\log_4(16)$ están definidas
    en los números reales.
  pasos:
  - 'Paso 1: Analizar $\log_{-3}(9)$: la base es $-3 < 0$. Viola la restricción de
    base positiva $\implies$ NO existe en $\mathbb{R}$.'
  - 'Paso 2: Analizar $\log_4(16)$: la base es $4 > 0$ y $4 \neq 1$. Cumple todas
    las restricciones $\implies$ existe y vale $2$.'
  - 'Conclusión: Solo $\log_4(16)$ está definido en los números reales.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la base b de un logaritmo log_b(a) debe ser estrictamente positiva
    (b > 0)?
  choices:
  - text: Para evitar potencias con bases negativas que generen valores no reales
      en R
    is_correct: true
  - text: Para que el resultado sea siempre entero
    is_correct: false
  - text: Porque no existen números negativos
    is_correct: false
  - text: Para poder restar el argumento
    is_correct: false
  explanation: La alternativa correcta es 'Para evitar potencias con bases negativas
    que generen valores no reales en R'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué log_{-3}(9) NO está definido en los reales?
  choices:
  - text: Porque la base es un número negativo (-3 < 0)
    is_correct: true
  - text: Porque 9 no es múltiplo de 3
    is_correct: false
  - text: Because es igual a 2
    is_correct: false
  - text: Sí está definido
    is_correct: false
  explanation: La alternativa correcta es 'Porque la base es un número negativo (-3
    < 0)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de verificar la restricción $b >
  0$ para la base de cualquier logaritmo $\log_b(a)$, determinando su validez en $\mathbb{R}$.
semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_POSITIVA
procedimiento:
- 'Paso 1: Verificar que el argumento $a > 0$ y la base $b > 0, b \neq 1$ cumplan
  las restricciones.'
- 'Paso 2: Formular la equivalencia de potencia $b^c = a$.'
- 'Paso 3: Calcular el valor del exponente $c$ o simplificar la expresión logarítmica.'
errores_correccion: '- **Error 1: Intentar calcular logaritmos de números negativos
  o cero ($\log_2(-4)$ o $\log_2(0)$).** **Cómo corregirlo:** El argumento debe ser
  estrictamente positivo ($a > 0$); en $\mathbb{R}$ no existen.


  - **Error 2: Confundir la base con el argumento (escribir $\log_2(8) = 8^2 = 64$).**
  **Cómo corregirlo:** La base $2$ se eleva al RESULTADO para dar el argumento ($2^3
  = 8 \implies \log_2(8) = 3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_POSITIVA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la definición logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en R.
- titulo: ¿Cumple el logaritmo las restricciones de base y argumento?
  respuesta: Sí
  solucion_pasos:
  - Sí, $b > 0, b \neq 1$ y $a > 0$.
- titulo: ¿Es log_b(1) siempre igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $b^0 = 1$ para toda base válida.
errores_frecuentes:
- '[''Calcular logaritmos con bases negativas en el conjunto de los números reales.'',
  ''Evaluar el logaritmo de cero o de números negativos obteniendo números reales
  negativos.'', ''Utilizar el número 1 como la base de un logaritmo en expresiones
  algebraicas.'', ''El logaritmo de uno $\\log_b(1)$ es numéricamente igual a la base
  $b$.'', ''Declarar la sigla del logaritmo decimal $\\log$ con la sigla del logaritmo
  natural $\\ln$.'']'
afirmaciones_verdaderas:
- El logaritmo $\log_b(a) = c$ se define formalmente mediante la ecuación exponencial
  $b^c = a$ para $b > 0, b \neq 1, a > 0$.
- El logaritmo de 1 en cualquier base válida es 0 y el logaritmo de la base es 1.
