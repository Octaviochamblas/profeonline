semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.COMPLEMENTO_CALCULO
resumen_inicial: El complemento de un ángulo α se calcula restando su medida de 90°,
  mediante la fórmula C(α) = 90° - α.
explicacion_simple: '![Cálculo del Complemento](/static/img/nodos/calculo-del-complemento-de-un-angulo-dado-intro.svg)


  Para saber cuánto le falta a un ángulo para llegar a ser un ángulo recto perfecto
  de 90°, simplemente tomas 90° y le restas el ángulo que tienes. Por ejemplo, el
  complemento de 70° es 90° - 70° = 20°.'
explicacion_formal: '### Definición formal

  Dado un ángulo agudo de medida $\alpha \in [0^\circ, 90^\circ]$, se define el **complemento**
  de $\alpha$ (denotado $C(\alpha)$) como el operador de sustracción respecto al ángulo
  recto:


  $$C(\alpha) = 90^\circ - \alpha \iff C(\alpha) = \frac{\pi}{2} - \alpha$$


  ### Desglose simbólico y geométrico

  - $C(\alpha)$: Función complemento que asigna a cada ángulo su suplemento respecto
  a $90^\circ$.

  - Dominio admisible: $\alpha \in [0^\circ, 90^\circ]$ para asegurar un complemento
  geométrico no negativo.

  - Involución: $C(C(\alpha)) = 90^\circ - (90^\circ - \alpha) = \alpha$.


  ### Síntesis didáctica

  El cálculo del complemento es una operación aritmética lineal directa que permite
  determinar el ángulo faltante para formar una escuadra ortogonal perfecta.'
definiciones_clave: '- **Fórmula del complemento**: $C(\alpha) = 90^\circ - \alpha$.

  - **Ángulo dado**: Ángulo agudo original $\alpha$ al cual se le busca su complemento. '
propiedades_relaciones: '- **Involución del complemento**: El complemento del complemento
  de $\alpha$ es el ángulo original: $C(C(\alpha)) = 90^\circ - (90^\circ - \alpha)
  = \alpha$.

  - **Monotonía decreciente**: A mayor ángulo $\alpha$, menor es su complemento $C(\alpha)$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cálculo de Complemento](/static/img/nodos/calculo-del-complemento-de-un-angulo-dado-ejemplos.svg)


    Calcula el complemento del ángulo $\alpha = 34^\circ 20''$ y expresa el resultado
    en grados y minutos.'
  pasos:
  - 'Paso 1: Expresar $90^\circ$ en forma mixta de grados y minutos: $90^\circ = 89^\circ
    60''$.'
  - 'Paso 2: Plantear la resta: $C(\alpha) = 89^\circ 60'' - 34^\circ 20''$.'
  - 'Paso 3: Restar los minutos: $60'' - 20'' = 40''$.'
  - 'Paso 4: Restar los grados: $89^\circ - 34^\circ = 55^\circ$.'
  - 'Paso 5: Concluir que el complemento es $55^\circ 40''$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el complemento de un ángulo α?
  choices:
  - text: C(α) = 90° - α
    is_correct: true
  - text: C(α) = 180° - α
    is_correct: false
  - text: C(α) = 360° - α
    is_correct: false
  - text: C(α) = α - 90°
    is_correct: false
  explanation: El complemento se obtiene restando el ángulo de 90° exactos (C(α) =
    90° - α).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el complemento de un ángulo que mide 53°?
  choices:
  - text: 37° (porque 90° - 53° = 37°)
    is_correct: true
  - text: 127°
    is_correct: false
  - text: 47°
    is_correct: false
  - text: 147°
    is_correct: false
  explanation: Aplicando la fórmula, 90° - 53° = 37°, por lo que el complemento es
    37° (porque 90° - 53° = 37°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor del ángulo $\alpha$.'
- 'Paso 2: Plantear la resta $C(\alpha) = 90^\circ - \alpha$.'
- 'Paso 3: Efectuar la resta numérica o algebraica.'
- 'Paso 4: Verificar que la suma $\alpha + C(\alpha) = 90^\circ$.'
errores_correccion: Asegúrate de restar de 90° y no de 180°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el complemento de 72°?
  alternativas:
  - $18^\circ$
  - $108^\circ$
  - $28^\circ$
  respuesta: $18^\circ$
  solucion_pasos:
  - $C(72^\circ) = 90^\circ - 72^\circ = 18^\circ$.
- titulo: Ejemplo 2
  enunciado: Si el complemento de un ángulo es el doble del ángulo, ¿cuánto mide el
    ángulo?
  alternativas:
  - $30^\circ$
  - $45^\circ$
  - $60^\circ$
  respuesta: $30^\circ$
  solucion_pasos:
  - $90^\circ - x = 2x \implies 3x = 90^\circ \implies x = 30^\circ$.
- titulo: ¿El complemento de 45° es 45°?
  respuesta: Sí
  solucion_pasos:
  - Sí, 90° - 45° = 45°.
- titulo: ¿El complemento de 90° es 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, 90° - 90° = 0° (un ángulo nulo).
errores_frecuentes:
- Restar el ángulo de $180^\circ$ en vez de $90^\circ$.
- Invertir el orden de la resta calculando $\alpha - 90^\circ$ y obteniendo valores
  negativos.
- No transformar $90^\circ$ a $89^\circ 60''$ al operar con minutos sexagesimales.
- 'Olvidar poner paréntesis al restar binomios algebraicos: $90^\circ - (x + 20^\circ)
  = 70^\circ - x$.'
- Intentar calcular el complemento de ángulos mayores que $90^\circ$.
afirmaciones_verdaderas:
- El complemento de un ángulo $\alpha$ se calcula como $90^\circ - \alpha$.
- Si $\alpha = 45^\circ$, su complemento es exactamente igual a $\alpha$.
al_terminar_debes_poder: '**QUÉ:** Calcular de forma numérica y algebraica el complemento
  de cualquier ángulo agudo dado.


  **CÓMO:** Aplicando la fórmula $C(\alpha) = 90^\circ - \alpha$ y resolviendo ecuaciones
  lineales asociadas.


  ![Resumen de Cálculo del Complemento](/static/img/nodos/calculo-del-complemento-de-un-angulo-dado-resumen.svg)'
