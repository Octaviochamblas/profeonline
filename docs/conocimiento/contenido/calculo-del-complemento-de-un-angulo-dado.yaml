semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.COMPLEMENTO_CALCULO
resumen_inicial: Dos ángulos son complementarios si la suma de sus medidas es exactamente
  90°, una propiedad esencial en triángulos rectángulos y razones trigonométricas.
explicacion_simple: Imagina un ángulo recto de 90° dividido en dos partes por una
  línea. Las dos partes son complementarias porque al sumarlas forman la esquina de
  90°.
explicacion_formal: Dos ángulos $\alpha$ y $\beta$ son **complementarios** si la suma
  de sus medidas es igual a $90^\circ$ ($\alpha + \beta = 90^\circ$). El complemento
  de $\alpha$ se calcula como $\beta = 90^\circ - \alpha$.
definiciones_clave: '- **Cálculo del complemento de un ángulo dado**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en cálculo del complemento de un ángulo dado se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Un ángulo $\alpha = 3x + 12^\circ$ y su complemento suman $90^\circ$.
    Si el complemento de $\alpha$ mide $42^\circ$, calcula el valor de $x$.
  pasos:
  - 'Paso 1: Calcular la medida del ángulo $\alpha$: $\alpha = 90^\circ - 42^\circ
    = 48^\circ$.'
  - 'Paso 2: Igualar a la expresión algebraica: $3x + 12 = 48$.'
  - 'Paso 3: Despejar $x$: $3x = 36 \implies x = 12^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de cálculo del complemento de
    un ángulo dado?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el complemento de $\alpha$ mide 42°, ¿cuál es el valor de $\alpha$?
  choices:
  - text: 48°
    is_correct: true
  - text: 138°
    is_correct: false
  - text: 42°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: La alternativa correcta es '48°', calculada como $90^\circ - 42^\circ
    = 48^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en cálculo del complemento de un ángulo dado.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en cálculo del complemento
  de un ángulo dado sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 152^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 28°
  - 152°
  - 90°
  respuesta: 28°
  solucion_pasos:
  - Despejando $x = 180 - 152 = 28^\circ$.
- titulo: Ejemplo 2
  enunciado: En cálculo del complemento de un ángulo dado, si dos ángulos son suplementarios
    y uno mide 152°, ¿cuánto mide el otro?
  alternativas:
  - 28°
  - 18°
  - 360°
  respuesta: 28°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 152 = 28^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en cálculo del
    complemento de un ángulo dado?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en cálculo del complemento de un
    ángulo dado es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de cálculo del complemento de un ángulo dado.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
