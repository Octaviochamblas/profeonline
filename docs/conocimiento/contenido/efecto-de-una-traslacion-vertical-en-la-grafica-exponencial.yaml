semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TRASLACION_VERTICAL
resumen_inicial: El efecto de una traslación vertical desplaza toda la curva y la asíntota horizontal hacia arriba o abajo en $k$ unidades ($g(x) = b^x + k$).
explicacion_simple: |
  Cuando le **sumas o le restas un número $k$ al final** de la función exponencial:

  $$g(x) = b^x + k$$

  Estás realizando una **TRASLACIÓN VERTICAL**:

  - **Si $k > 0$ (ej. $g(x) = 2^x + 3$)**: La gráfica entera **sube $k$ unidades**.
    - La asíntota horizontal ya no es $y = 0$, sino la recta **$y = k$** (en este caso $y = 3$).
    - El corte con el eje Y se desplaza de $(0, 1)$ a **$(0, 1 + k)$**.
  - **Si $k < 0$ (ej. $g(x) = 2^x - 5$)**: La gráfica entera **baja $|k|$ unidades**.
    - La asíntota horizontal se mueve a **$y = k$** (en este caso $y = -5$).
explicacion_formal: |
  Dada la función exponencial básica $f(x) = a \cdot b^x$, se define la **función exponencial trasladada verticalmente** mediante la transformación afín:

  $$g(x) = f(x) + k = a \cdot b^x + k \quad \text{con } k \in \mathbb{R}$$

  **Impacto de la constante $k$ en los invariantes geométricos:**
  1. **Asíntota Horizontal:** $L: y = k$. El límite en el extremo asintótico es $\lim_{x \to \pm \infty} g(x) = k$.
  2. **Intersección con el eje Y:** $g(0) = a \cdot b^0 + k = a + k \implies P_Y = (0, a + k)$.
  3. **Recorrido Modificado:**
     - Si $a > 0 \implies \text{Rec}(g) = ]k, +\infty[$.
     - Si $a < 0 \implies \text{Rec}(g) = ]-\infty, k[$.
  4. **Intersección con el eje X:** A diferencia de la función básica, si $a$ y $k$ tienen signos opuestos, la función trasladada **SÍ CORTA AL EJE X** en la solución de $a \cdot b^x + k = 0$.
definiciones_clave: |
  - **Traslación vertical ($k$)**: Desplazamiento rígido paralelo al eje Y que desplaza simétricamente todos los puntos de la función exponencial y su asíntota horizontal.
propiedades_relaciones: |
  - **Conservación de la monotonía**: La adición del escalar $k$ no altera la derivada $g'(x) = f'(x)$, manteniendo inalterada la tasa de variación y la base de la función.
ejemplo_guiado:
  enunciado: 'Dada la función $g(x) = 5^x - 4$, determina la ecuación de su asíntota horizontal, su corte con el eje Y y su conjunto recorrido.'
  pasos:
    - 'Paso 1: Identificar la constante de traslación vertical $k = -4$ y la base $b = 5$.'
    - 'Paso 2: Calcular la asíntota horizontal: la recta es $y = k \implies y = -4$.'
    - 'Paso 3: Calcular el corte con Y: $g(0) = 5^0 - 4 = 1 - 4 = -3$. El punto es $(0, -3)$.'
    - 'Paso 4: Formular el recorrido: como $a = 1 > 0$, $\text{Rec}(g) = ]-4, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función exponencial trasladada $g(x) = 3^x + 7$?'
    choices:
      - {text: 'El intervalo abierto $]7, +\infty[$', is_correct: true}
      - {text: 'El intervalo abierto $]0, +\infty[$.', is_correct: false}
      - {text: 'El conjunto de todos los números reales $\mathbb{R}$.', is_correct: false}
      - {text: 'El intervalo cerrado $[7, +\infty[$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo abierto $]7, +\infty[$''. La asíntota se movió a $y = 7$, fijando el recorrido en $]7, +\infty[$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿En qué punto cartesiano cruza al eje Y la gráfica de la función $f(x) = 2 \cdot 4^x - 1$?'
    choices:
      - {text: 'En el punto cartesiano $(0, 1)$', is_correct: true}
      - {text: 'En el punto cartesiano $(0, 2)$.', is_correct: false}
      - {text: 'En el punto cartesiano $(0, -1)$.', is_correct: false}
      - {text: 'En el punto cartesiano $(0, 0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''En el punto cartesiano $(0, 1)$''. $f(0) = 2 \cdot 4^0 - 1 = 2 \cdot 1 - 1 = 1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el término independiente $k$ fuera de la potencia en $g(x) = a \cdot b^x + k$.'
  - 'Paso 2: Fijar la ecuación de la asíntota horizontal en $y = k$.'
  - 'Paso 3: Evaluar $g(0) = a + k$ para determinar el intercepto con Y en $(0, a + k)$.'
  - 'Paso 4: Actualizar el rango del recorrido a $]k, +\infty[$ (si $a > 0$) o $]-\infty, k[$ (si $a < 0$).'
errores_correccion: |
  - **Error común:** Mantener la asíntota horizontal en $y = 0$ al sumar una constante $k$ a la función exponencial.
  - **Cómo corregirlo:** La constante $k$ desplaza **TODO EL CONJUNTO**, incluyendo la asíntota. La nueva asíntota es siempre **$y = k$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Traslación vertical hacia arriba.
    alternativas:
      - 'Asíntota y = 10, corte Y en (0, 11), recorrido ]10, +\infty['
      - 'Asíntota y = 0, corte Y en (0, 10)'
      - 'Asíntota y = 1, corte Y en (0, 10)'
    respuesta: 'Asíntota y = 10, corte Y en (0, 11), recorrido ]10, +\infty['
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Traslación vertical hacia abajo.
    alternativas:
      - 'Asíntota y = -6, corte Y en (0, -5), recorrido ]-6, +\infty['
      - 'Asíntota y = 0, corte Y en (0, -6)'
      - 'Asíntota y = -5, corte Y en (0, -6)'
    respuesta: 'Asíntota y = -6, corte Y en (0, -5), recorrido ]-6, +\infty['
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 6^x + 5$, la afirmación de que su asíntota horizontal permanece inalterada en el eje X ($y = 0$).'
  - 'La confusión entre la constante de traslación vertical $k$ y el parámetro multiplicativo de escala $a$.'
  - 'La afirmación de que la traslación vertical modifica el valor de la base exponencial $b$.'
  - 'La afirmación de que tras la traslación vertical el recorrido de la función continúa siendo $\mathbb{R}^+$.'
  - 'La omisión del cambio de la ordenada al origen al calcular $(0, a + k)$.'
afirmaciones_verdaderas:
  - 'La traslación vertical $g(x) = a \cdot b^x + k$ desplaza la asíntota horizontal de la función exponencial a la recta $y = k$.'
  - 'El conjunto recorrido de la función exponencial trasladada $g(x) = a \cdot b^x + k$ con $a > 0$ es el intervalo abierto $]k, +\infty[$.'
al_terminar_debes_poder: |
  QUÉ: Analizar e interpretar el efecto de una traslación vertical $k$ en funciones exponenciales $g(x) = a \cdot b^x + k$.
  CÓMO: Identificar $k$, actualizar la asíntota a $y = k$, calcular el corte Y en $(0, a + k)$ y definir el recorrido $]k, +\infty[$.
