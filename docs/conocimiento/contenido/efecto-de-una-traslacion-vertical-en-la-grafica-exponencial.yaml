semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TRASLACION_VERTICAL
resumen_inicial: El efecto de una traslación vertical en la función exponencial $g(x) = a \cdot b^x + k$ desplaza rígidamente toda la curva $k$ unidades hacia arriba (si $k > 0$) o hacia abajo (si $k < 0$), reubicando la asíntota horizontal en la recta $y = k$ y el intercepto en $(0, a + k)$.
explicacion_simple: "![El efecto de una traslación vertical en la función exponencial $g(x) = a \\cdot b^x + k$ desplaza rígidamente toda la curva $k$ unidades hacia arriba (si $k > 0$) o hacia abajo (si $k < 0$), reubicando la asíntota horizontal en la recta $y = k$ y el intercepto en $(0, a + k)$](/static/img/nodos/efecto-de-una-traslacion-vertical-en-la-grafica-exponencial-intro.svg)\n\n\nCuando a una función exponencial le sumas o restas un número suelto al final ($+ k$):\n\n- **¿Qué le pasa a toda la gráfica?**\n  - **Si sumas $+ k$ (ej: $2^x + 3$):** Toda la curva sube $3$ pisos hacia arriba.\n    - La **asíntota horizontal** sube del piso $y = 0$ al piso **$y = 3$**.\n    - El **corte con el eje Y** sube de $(0, 1)$ a **$(0, 4)$**.\n    - El **recorrido** ahora es **$]3, +\\infty[$**.\n  - **Si restas $- k$ (ej: $2^x - 5$):** Toda la curva baja $5$ pisos hacia abajo.\n    - La asíntota baja a **$y = -5$**.\n    - El corte con el eje Y baja a **$(0, -4)$**.\n    - ¡Ahora la curva sí\
  \ puede cruzar el eje $X$!"
explicacion_formal: "Dada la transformación afín vertical $\\mathcal{T}_k: \\mathbb{R}^2 \\to \\mathbb{R}^2$ con $\\mathcal{T}_k(x, y) = (x, y + k)$, la gráfica transformada de $g(x) = a \\cdot b^x + k$ satisface:\n\n1. **Traslación de la asíntota horizontal**:\n   $$\\lim_{x \\to \\pm\\infty} g(x) = \\lim_{x \\to \\pm\\infty} (a \\cdot b^x + k) = 0 + k = k \\implies \\mathcal{A}_H: y = k$$\n2. **Traslación del intercepto $Y$**:\n   $$g(0) = a \\cdot b^0 + k = a \\cdot 1 + k = a + k \\implies P_Y(0, a + k)$$\n3. **Redefinición del conjunto imagen (Recorrido)**:\n   $$\\operatorname{Rec}(g) = \\begin{cases} ]k, +\\infty[ & \\text{si } a > 0 \\\\ ]-\\infty, k[ & \\text{si } a < 0 \\end{cases}$$"
definiciones_clave: '- **Constante de traslación vertical ($k$)**: Desplazamiento rígido paralelo al eje de ordenadas.

  - **Asíntota desplazada**: Recta horizontal $y = k$ que actúa como nueva cota inferior o superior estricta.'
propiedades_relaciones: '- **Aparición de ceros reales**: Si $a > 0$ y $k < 0$, la función cruza el eje $X$ en la raíz real única $x = \log_b(-k/a)$.

  - **Invarianza del dominio y de la monotonía**: La traslación vertical no modifica el dominio ($\mathbb{R}$) ni la velocidad de crecimiento de la base.'
ejemplo_guiado:
  enunciado: '![Ejemplo El efecto de una traslación vertical en la función exponencial $g(x) = a \cdot b^x + k$ desplaza rígidamente toda la curva $k$ unidades hacia arriba (si $k > 0$) o hacia abajo (si $k < 0$), reubicando la asíntota horizontal en la recta $y = k$ y el intercepto en $(0, a + k)$](/static/img/nodos/efecto-de-una-traslacion-vertical-en-la-grafica-exponencial-ejemplos.svg)



    Para la función $f(x) = 3^x - 9$, determina:

    1) La ecuación de su asíntota horizontal.

    2) El intercepto con el eje Y.

    3) El punto de corte con el eje X (cero de la función).

    4) El recorrido de la función.'
  pasos:
  - 'Paso 1: Identificar parámetros: $a = 1, b = 3, k = -9$.

    - Asíntota horizontal: recta **$y = -9$**.'
  - 'Paso 2: Intercepto con el eje $Y$ evaluando $f(0)$:

    $f(0) = 3^0 - 9 = 1 - 9 = -8 \implies$ punto **$(0, -8)$**.'
  - 'Paso 3: Cero de la función igualando $f(x) = 0$:

    $3^x - 9 = 0 \implies 3^x = 9 \implies 3^x = 3^2 \implies x = 2$.

    - Punto de corte con el eje $X$: **$(2, 0)$**.'
  - 'Paso 4: Recorrido: Como $a = 1 > 0$ y la asíntota es $y = -9$, $\operatorname{Rec}(f) = ]-9, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función trasladada f(x) = 2ˣ + 5?
  choices:
  - text: ']5, +∞['
    is_correct: true
  - text: ']0, +∞['
    is_correct: false
  - text: '[5, +∞['
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es ']5, +∞['. Como $2^x > 0$, al sumar 5 se obtiene $2^x + 5 > 5$, con cota inferior abierta en 5.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función f(x) = 5ˣ - 25, ¿en qué punto corta al eje X?
  choices:
  - text: (2, 0) porque 5² - 25 = 0
    is_correct: true
  - text: (0, -24)
    is_correct: false
  - text: (25, 0)
    is_correct: false
  - text: No corta al eje X
    is_correct: false
  explanation: La alternativa correcta es '(2, 0) porque 5² - 25 = 0'. $5^x = 25 = 5^2 \implies x = 2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la constante aditiva $k$ en $f(x) = a \cdot b^x + k$.'
- 'Paso 2: Establecer la ecuación de la asíntota horizontal como $y = k$.'
- 'Paso 3: Calcular el corte con el eje $Y$ evaluando $f(0) = a + k$.'
- 'Paso 4: Si $k$ tiene signo opuesto a $a$, resolver $a \cdot b^x + k = 0$ para hallar el corte con el eje $X$.'
- 'Paso 5: Formular el recorrido como $]k, +\infty[$ (para $a > 0$) o $]-\infty, k[$ (para $a < 0$).'
errores_correccion: '- **Error común:** Mantener la asíntota en $y = 0$ a pesar de haber sumado una constante $+ k$.

  - **Cómo corregirlo:** La constante $k$ **desplaza toda la estructura**, incluyendo la **asíntota horizontal a la recta $y = k$**.'
ejemplos:
- titulo: 'Ejemplo 1: Traslación positiva'
  enunciado: En $f(x) = 4^x + 6$, ¿cuál es la asíntota horizontal?
  alternativas:
  - y = 6
  - y = 0
  - x = 6
  - y = 4
  respuesta: y = 6
  solucion_pasos:
  - 'Paso 1: $k = 6 \implies y = 6$.'
- titulo: 'Ejemplo 2: Intercepto con eje Y trasladado'
  enunciado: En $g(x) = 3 \cdot 2^x + 4$, ¿cuál es el intercepto con el eje Y?
  alternativas:
  - (0, 7)
  - (0, 4)
  - (0, 3)
  - (0, 10)
  respuesta: (0, 7)
  solucion_pasos:
  - 'Paso 1: $g(0) = 3(1) + 4 = 7 \implies (0, 7)$.'
- titulo: 'Ejemplo 3: Raíz con traslación negativa'
  enunciado: ¿Dónde corta al eje X la función $h(x) = 2^x - 8$?
  alternativas:
  - (3, 0)
  - (8, 0)
  - (0, -7)
  - (4, 0)
  respuesta: (3, 0)
  solucion_pasos:
  - 'Paso 1: $2^x = 8 = 2^3 \implies x = 3 \implies (3, 0)$.'
- titulo: 'Ejemplo 4: Recorrido con traslación negativa'
  enunciado: ¿Cuál es el recorrido de $f(x) = 10^x - 1$?
  alternativas:
  - ']-1, +inf['
  - ']0, +inf['
  - '[-1, +inf['
  - R
  respuesta: ']-1, +inf['
  solucion_pasos:
  - 'Paso 1: $\operatorname{Rec}(f) = ]-1, +\infty[$.'
errores_frecuentes:
- Olvidar sumar k al calcular el intercepto f(0).
- Creer que la función exponencial trasladada sigue teniendo asíntota en y = 0.
- Escribir corchetes cerrados en el límite del recorrido k.
afirmaciones_verdaderas:
- La constante aditiva k desplaza la asíntota horizontal de la función exponencial a la recta y = k.
- Si k < 0 y a > 0, la gráfica exponencial corta al eje X en una única raíz real.
al_terminar_debes_poder: '**QUÉ:** Determinar el efecto de una traslación vertical en la gráfica exponencial.


  **CÓMO:** Calculando la nueva asíntota y = k, el intercepto (0, a + k) y el recorrido adaptado ]k, +∞[.


