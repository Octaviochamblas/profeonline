semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.LOGARITMO_DE_POTENCIA_MISMA_BASE
resumen_inicial: 'El logaritmo de una potencia cuya base coincide con la base del logaritmo es simplemente igual al exponente: $\log_b(b^k) = k$ ($b > 0, b \neq 1, k \in \mathbb{R}$).'
explicacion_simple: '![Logaritmo de una potencia con igual base](/static/img/nodos/logaritmo-de-una-potencia-con-igual-base-intro.svg)


  Cuando el argumento es una potencia de la misma base que el logaritmo, el operador extrae directamente el exponente:

  - ¿A qué exponente debes elevar $2$ para obtener $2^7$? ¡A $7$! Por eso $\log_2(2^7) = 7$.

  - Con logaritmo decimal: $\log(10^4) = 4$.

  - Con logaritmo natural: $\ln(e^{-2}) = -2$.

  - Si el argumento es un número como $243$, basta escribirlo en potencias de $3$: $\log_3(243) = \log_3(3^5) = 5$.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$ y $k \in \mathbb{R}$. Por la propiedad del logaritmo de una potencia y la propiedad del logaritmo de la base ($\log_b(b) = 1$):


  $$\log_b(b^k) = k \cdot \log_b(b) = k \cdot 1 = k$$


  Esta identidad representa la **composición de funciones inversas** en el orden logaritmo-exponencial:


  $$(\log_b \circ f)(k) = \log_b(b^k) = k \quad (\forall k \in \mathbb{R})$$'
definiciones_clave: '- **Logaritmo de potencia de igual base**: Identidad $\log_b(b^k) = k$.

  - **Extracción directa**: Eliminación inmediata del operador logarítmico cuando las bases coinciden.

  - **Descomposición en factores**: Técnica de reescritura del argumento en potencias de la base $b$.'
propiedades_relaciones: '- **Exponentes negativos y fraccionarios**: $\log_b\left(\frac{1}{b^n}\right) = -n$ y $\log_b(\sqrt[n]{b}) = \frac{1}{n}$.

  - **Neutralización universal**: Válido en todas las bases reales admisibles.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de potencia con igual base](/static/img/nodos/logaritmo-de-una-potencia-con-igual-base-ejemplos.svg)


    Calcule el valor de $\log_3(243)$ y determine $\log_2(\sqrt{2})$.'
  pasos:
  - 'Paso 1: Para $\log_3(243)$: Descomponer $243 = 3^5 \implies \log_3(3^5)$.'
  - 'Paso 2: Por extracción directa $\log_b(b^k) = k$, el resultado es $5$.'
  - 'Paso 3: Para $\log_2(\sqrt{2})$: Escribir la raíz como potencia: $\sqrt{2} = 2^{1/2} \implies \log_2(2^{1/2})$.'
  - 'Paso 4: Extraer el exponente: el resultado es $\frac{1}{2} = 0,5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_6(6^{12})$?
  choices:
  - text: $12$ (por la regla directa $\log_b(b^k) = k$)
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $72$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$12$ (por la regla directa $\log_b(b^k) = k$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\log_2(\sqrt{2}) = \frac{1}{2}$?
  choices:
  - text: Porque $\sqrt{2} = 2^{1/2}$ y $\log_2(2^{1/2}) = \frac{1}{2}$
    is_correct: true
  - text: Porque se divide 2 por 2
    is_correct: false
  - text: Porque el logaritmo de 2 es 1/2
    is_correct: false
  - text: Porque $\sqrt{2} = 1$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $\sqrt{2} = 2^{1/2}$ y $\log_2(2^{1/2}) = \frac{1}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar el argumento como una potencia directa de la base $b$: $x = b^k$.'
- 'Paso 2: Verificar que la base de la potencia coincida con la base del logaritmo.'
- 'Paso 3: Aplicar la identidad $\log_b(b^k) = k$ para extraer el exponente de inmediato.'
errores_correccion: "- **Error 1: Dejar la base en el resultado ($\\log_2(2^5) = 2 \times 5 = 10$).** **Cómo corregirlo:** El logaritmo y la base se neutralizan completamente, quedando **únicamente el exponente $5$**.\n- **Error 2: No descomponer argumentos compuestos.** **Cómo corregirlo:** Si tienes $\\log_2(128)$, primero escribe $128 = 2^7$ para aplicar $\\log_2(2^7) = 7$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $\log_4(4^{-3})$?
  alternativas:
  - $-3$
  - $3$
  - $-12$
  respuesta: $-3$
  solucion_pasos:
  - Por extracción directa $\log_b(b^k) = k$, el resultado es $-3$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\ln(e^9)$?
  alternativas:
  - $9$
  - $e^9$
  - $1$
  respuesta: $9$
  solucion_pasos:
  - $\ln(e^9) = 9$.
- titulo: ¿Es log(10000) = 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $10000 = 10^4 \implies \log(10^4) = 4$.
  alternativas:
  - texto: Sí, log(10⁴) = 4
    es_correcta: true
    retroalimentacion: ¡Correcto! Extracción directa de exponente decimal.
  - texto: No, es 10
    es_correcta: false
    retroalimentacion: Incorrecto, 10 es la base.
  - texto: No, es 40
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente es 4.
- titulo: ¿Es log_5(1/125) = -3?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\frac{1}{125} = 5^{-3} \implies \log_5(5^{-3}) = -3$.
  alternativas:
  - texto: Sí, 1/125 = 5⁻³ dando -3
    es_correcta: true
    retroalimentacion: ¡Correcto! Potencia entera negativa de la base.
  - texto: No, es 3
    es_correcta: false
    retroalimentacion: Incorrecto, $5^3 = 125$, no $1/125$.
  - texto: No, no existe
    es_correcta: false
    retroalimentacion: Incorrecto, el argumento $1/125 > 0$ es positivo y válido.
errores_frecuentes:
- Multiplicar la base por el exponente al resolver.
- Olvidar que los exponentes fraccionarios o negativos se extraen con su signo y forma.
- No factorizar argumentos en potencias de la base.
- Confundir $\log_b(b^k) = k$ con $b^{\log_b(a)} = a$ (ambas son formas de cancelación).
afirmaciones_verdaderas:
- 'El logaritmo de una potencia cuya base coincide con la del logaritmo es idénticamente igual al exponente: $\log_b(b^k) = k$.'
- La propiedad es válida para cualquier exponente real $k$ (positivo, negativo o fraccionario).
- Permite calcular logaritmos descomponiendo el argumento en potencias de la base.
al_terminar_debes_poder: '![Síntesis de logaritmo de potencia con igual base](/static/img/nodos/logaritmo-de-una-potencia-con-igual-base-resumen.svg)


  QUÉ: Simplificar y calcular logaritmos aplicando la identidad $\log_b(b^k) = k$.


  CÓMO: Descomponiendo el argumento en potencias de la base $b$ y extrayendo directamente el exponente $k$, para todo $k \in \mathbb{R}$ y $b > 0, b \neq 1$.'
