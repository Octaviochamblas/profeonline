semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.LOGARITMO_DE_POTENCIA_MISMA_BASE
resumen_inicial: El logaritmo de una potencia cuyo número base coincide con la base
  del logaritmo es igual al exponente de dicha potencia ($\log_b(b^x) = x$).
explicacion_simple: 'Cuando el argumento de un logaritmo es una potencia que tiene
  su misma base, el logaritmo y la base se cancelan dejando únicamente el exponente:

  $$\log_2(2^7) = 7$$

  $$\ln(e^4) = 4$$

  $$\log(10^{-3}) = -3$$'
explicacion_formal: 'Por la composición de funciones inversas $(f^{-1} \circ f)(x)
  = f^{-1}(f(x))$ con $f(x) = b^x$ y $f^{-1}(x) = \log_b(x)$, se cumple:

  $$\log_b(b^x) = x \quad \forall x \in \mathbb{R}$$'
definiciones_clave: '- **Cancelación de logaritmo sobre potencia**: Identidad que
  extrae el exponente $x$ directamente.'
propiedades_relaciones: '- **Validez universal del exponente**: A diferencia del argumento,
  el exponente $x$ en $\log_b(b^x)$ puede ser cualquier número real (positivo, negativo
  o cero).'
ejemplo_guiado:
  enunciado: Calcula A) $\log_3(3^8)$ y B) $\log_5(5^{-2})$.
  pasos:
  - 'Para A: Como las bases coinciden ($b = 3$), el resultado es directamente el exponente:
    $8$.'
  - 'Para B: Como las bases coinciden ($b = 5$), el resultado es el exponente negativo:
    $-2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de la expresión $\log_4(4^9)$?
  choices:
  - text: '9'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '36'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La correcta es: 9. Por la propiedad $\log_b(b^x) = x$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\log(10^{-5})$.
  choices:
  - text: '-5'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: '-50'
    is_correct: false
  explanation: 'La correcta es: -5. Base 10 y potencia de base 10 se cancelan de forma
    directa.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que la base del logaritmo coincide con la base de la potencia
  en el argumento.'
- 'Paso 2: Cancelar el operador logaritmo y la base.'
- 'Paso 3: Retornar el exponente de la potencia como resultado final.'
errores_correccion: No olvides mantener el signo del exponente. $\log_2(2^{-3}) =
  -3$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\ln(e^6)$.
  alternativas:
  - '6'
  - e
  - '1'
  respuesta: '6'
  solucion_pasos:
  - $\ln(e^6) = 6$.
errores_frecuentes:
- Cambiar el signo del exponente si este era negativo.
afirmaciones_verdaderas:
- $\log_b(b^x) = x$ para todo $x \in \mathbb{R}$.
al_terminar_debes_poder: Evaluar de forma inmediata expresiones del tipo $\log_b(b^x)$.
fuente: Texto escolar MINEDUC.
estado: publicado
