resumen_inicial: 'El logaritmo en base $b$ de una potencia que tiene la misma base
  $b^k$ se simplifica dando exactamente el exponente $k$: $\log_b(b^k) = k$.'
explicacion_simple: Si calculamos el logaritmo de una potencia cuya base es idéntica
  a la base del logaritmo, ambos símbolos se anulan y el resultado es directamente
  el exponente.
explicacion_formal: 'Para toda base $b > 0, b \neq 1$ y exponente $k \in \mathbb{R}$,
  el **Logaritmo de Potencia de Muestra Base** satisface:


  $$\log_b\left(b^k\right) = k$$


  **Demostración:**

  Aplicando el logaritmo de una potencia: $\log_b(b^k) = k \cdot \log_b(b)$.

  Como $\log_b(b) = 1 \implies k \cdot 1 = k$.'
definiciones_clave: '- **Logaritmo de potencia de igual base**: Identidad $\log_b(b^k)
  = k$ de cancelación reciproca.'
propiedades_relaciones: '- **Cancelación derecha**: $\log_b(b^k) = k$ para todo exponente
  real $k$.'
ejemplo_guiado:
  enunciado: Calcule el valor de $\log_3(3^7)$ y $\ln(e^{-2})$.
  pasos:
  - 'Paso 1: Para $\log_3(3^7)$, base del logaritmo ($3$) y base de la potencia ($3$)
    coinciden $\implies$ resultado $7$.'
  - 'Paso 2: Para $\ln(e^{-2})$, la base neperiana $e$ coincide con la base de la
    potencia $\implies$ resultado $-2$.'
  - 'Conclusión: $\log_3(3^7) = 7$ y $\ln(e^{-2}) = -2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de evaluar log_b(b^k) para cualquier exponente k
    en R?
  choices:
  - text: El resultado es el exponente k
    is_correct: true
  - text: El resultado es la base b
    is_correct: false
  - text: El resultado es 1
    is_correct: false
  - text: El resultado es b^k
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es el exponente k'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para ln(e^{-2}), ¿cuál fue el valor obtenido?
  choices:
  - text: '-2'
    is_correct: true
  - text: e
    is_correct: false
  - text: '1'
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '-2'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar inmediatamente logaritmos
  de potencias con igual base $\log_b(b^k) = k$ obteniendo el exponente $k$.
semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.LOGARITMO_DE_POTENCIA_MISMA_BASE
procedimiento:
- 'Paso 1: Identificar la propiedad logarítmica correspondiente a la estructura del
  argumento o las bases.'
- 'Paso 2: Aplicar la ley algebraica transformando el logaritmo según la regla.'
- 'Paso 3: Evaluar y reducir numéricamente la expresión simplificada.'
errores_correccion: '- **Error 1: Confundir el logaritmo de una suma con la suma de
  logaritmos (escribir $\log(x+y) = \log(x) + \log(y)$).** **Cómo corregirlo:** El
  logaritmo NO es distributivo sobre la suma; la suma de logaritmos proviene del PRODUCTO
  ($\log(x \cdot y) = \log(x) + \log(y)$).


  - **Error 2: Confundir el cociente de logaritmos con el logaritmo del cociente.**
  **Cómo corregirlo:** $\log\left(\frac{x}{y}\right) = \log(x) - \log(y)$, mientras
  $\frac{\log(x)}{\log(y)}$ es la fórmula de cambio de base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de aplicación de MAT.NUM.LOGARITMOS_PROPIEDADES.LOGARITMO_DE_POTENCIA_MISMA_BASE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de validez formal.
  alternativas:
  - Cumple la propiedad
  - No cumple
  - Indeterminado
  respuesta: Cumple la propiedad
  solucion_pasos:
  - Demostración de equivalencia en R.
- titulo: ¿Es distributivo el logaritmo respecto a la adición?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(x+y) \neq \log(x) + \log(y)$.
- titulo: ¿Conserva el resultado la igualdad matemática original?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las propiedades de los logaritmos.
errores_frecuentes:
- Distribuir el logaritmo sobre los términos de una suma escribiendo $\log_b(x+y)
  = \log_b(x) + \log_b(y)$.
- Multiplicar los logaritmos individuales al calcular el logaritmo de un producto.
- Dividir los logaritmos individuales al calcular el logaritmo de un cociente.
- La expresión $\log(x^2)$ equivale numéricamente a elevar al cuadrado todo el logaritmo
  $(\log(x))^2$.
- Restar las bases al aplicar el cambio de base en un logaritmo.
afirmaciones_verdaderas:
- Las propiedades de los logaritmos transforman productos en sumas, cocientes en restas
  y potencias en multiplicaciones.
- 'El logaritmo de un producto es la suma de los logaritmos de sus factores: $\log_b(x
  \cdot y) = \log_b(x) + \log_b(y)$ ($x,y>0$).'
