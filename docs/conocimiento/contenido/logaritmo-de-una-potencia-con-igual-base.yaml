semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.LOGARITMO_DE_POTENCIA_MISMA_BASE
resumen_inicial: 'El logaritmo de una potencia cuya base coincide con la base del logaritmo es igual al propio exponente: $\log_b(b^x) = x$.'
explicacion_simple: |
  Esta propiedad es el camino inverso a la anterior. Cuando tienes un logaritmo de una potencia y la base del logaritmo es idéntica a la base de la potencia (como $\log_3(3^4)$), las dos bases se destruyen mutuamente y te queda simplemente el número del exponente ($4$). La razón es obvia: *"¿A qué exponente debes elevar 3 para obtener $3^4$?"*. La respuesta es 4.
explicacion_formal: |
  ### Definición formal
  La **propiedad de cancelación logarítmica de potencia con igual base** establece que para toda base real $b > 0, b \neq 1$ y cualquier exponente real $x \in \mathbb{R}$:
  $$\log_b\left(b^x\right) = x$$

  ### Demostración analítica
  Aplicando la propiedad del logaritmo de una potencia $\log_b(a^k) = k \cdot \log_b(a)$:
  1. $\log_b\left(b^x\right) = x \cdot \log_b(b)$.
  2. Puesto que el logaritmo de la base es la unidad ($\log_b(b) = 1$):
     $$\log_b\left(b^x\right) = x \cdot 1 = x$$

  ### Síntesis didáctica
  - Cancelación directa: La estructura $\log_b\left(b^x\right)$ se reduce al exponente $x$.
  - Ámbito de exponentes: $x$ puede ser cualquier número real (positivo, negativo o cero).
definiciones_clave: |
  - **Cancelación logarítmico-exponencial**: Identidad de funciones inversas que extrae el exponente $x$ del argumento $b^x$.
  - **Identidad $\log_b(b^x) = x$**: Igualdad fundamental que demuestra que el logaritmo de base $b$ deshace la potencia de base $b$.
  - **Exponente real $x$**: Cualquier número perteneciente al conjunto de los números reales $\mathbb{R}$.
propiedades_relaciones: |
  - **Propiedad dual**: Es la gemela de la propiedad de potencia de base logarítmica $b^{\log_b(x)} = x$.
  - **Evaluación directa de potencias**: Permite resolver inmediatamente expresiones como $\log_2(64) = \log_2(2^6) = 6$.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico de la expresión $K = \log_4(64) + \log_2\left(\frac{1}{16}\right)$ expresando los argumentos como potencias de la base.'
  pasos:
    - 'Paso 1: Expresamos el primer argumento $64$ como potencia de base $4$: $64 = 4^3 \implies \log_4(4^3)$.'
    - 'Paso 2: Expresamos el segundo argumento $\frac{1}{16}$ como potencia de base $2$: $\frac{1}{16} = 2^{-4} \implies \log_2(2^{-4})$.'
    - 'Paso 3: Aplicamos la propiedad de cancelación $\log_b(b^x) = x$ a ambos términos: $\log_4(4^3) = 3$ y $\log_2(2^{-4}) = -4$.'
    - 'Paso 4: Sumamos los valores obtenidos: $K = 3 + (-4) = -1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué resultado se obtiene al evaluar la expresión $\log_b(b^x)$ para cualquier exponente real $x$?'
    choices:
      - {text: '$x$, ya que el logaritmo en base $b$ y la potencia en base $b$ se cancelan mutuamente', is_correct: true}
      - {text: '$b$, devolviendo la base de la expresión', is_correct: false}
      - {text: '$b^x$, conservando la potencia completa', is_correct: false}
      - {text: '$1$, independientemente del exponente $x$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x$, ya que el logaritmo en base $b$ y la potencia en base $b$ se cancelan mutuamente''. La identidad fundamental establece $\log_b(b^x) = x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado del logaritmo decimal $\log(10^{-5})$?'
    choices:
      - {text: '$-5$, aplicando $\log_{10}(10^{-5}) = -5$', is_correct: true}
      - {text: '$5$, cambiando el signo', is_correct: false}
      - {text: '$10$, por la base decimal', is_correct: false}
      - {text: '$0.00001$, sin calcular el logaritmo', is_correct: false}
    explanation: 'La alternativa correcta es ''$-5$, aplicando $\log_{10}(10^{-5}) = -5$''. Coinciden las bases 10 y se extrae el exponente $-5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Expresar el argumento como una potencia de base igual a la del logaritmo ($b^x$).'
  - 'Paso 2: Verificar que las bases del logaritmo y de la potencia sean idénticas.'
  - 'Paso 3: Aplicar la propiedad de cancelación $\log_b(b^x) = x$.'
  - 'Paso 4: Extraer el exponente $x$ como resultado final.'
errores_correccion: |
  - **Error 1:** Multiplicar la base por el exponente al simplificar (ej: $\log_2(2^5) = 2 \cdot 5 = 10$). **Cómo corregirlo:** La base $2$ del logaritmo y la base $2$ de la potencia se **cancelan completamente**, dejando sólo el exponente: $\log_2(2^5) = 5$.
  - **Error 2:** Creer que $\log_b(b^x) = 1$. **Cómo corregirlo:** El logaritmo de la base sin exponente da $1$ ($\log_b(b) = 1$). Si hay un exponente $x$, el resultado es la multiplicación $x \cdot 1 = x$.
ejemplos:
  - titulo: 'Cancelación directa en base 3'
    enunciado: '¿El valor de $\log_3(3^8)$ es igual a $8$?'
    alternativas:
      - 'Sí, pues $\log_b(b^x) = x$'
      - 'No, es igual a 24'
      - 'No, es igual a 3'
    respuesta: 'Sí, pues $\log_b(b^x) = x$'
    solucion_pasos:
      - '1. Verificamos coincidencia de base: 3.'
      - '2. Aplicamos la regla $\log_3(3^8) = 8$.'
  - titulo: 'Cancelación con exponente fraccionario'
    enunciado: '¿La expresión $\log_5(5^{2/3})$ equivale a $2/3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Se extrae directamente el exponente fraccionario $2/3$.'
  - titulo: 'Evaluación de logaritmo natural'
    enunciado: '¿El valor de $\ln(e^{-4})$ equivale a $-4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\log_e(e^{-4}) = -4$.'
  - titulo: 'Simplificación de potencia de 10'
    enunciado: '¿La expresión $\log(10^x)$ simplifica siempre a $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En base decimal $\log_{10}(10^x) = x$.'
errores_frecuentes:
  - 'El resultado de $\log_b(b^x)$ es igual a $b \cdot x$ multiplicando la base por el exponente.'
  - 'La expresión $\log_b(b^x)$ es siempre igual a 1 sin importar el exponente $x$.'
  - 'Al simplificar $\log_b(b^x)$ se conserva la base $b$ elevada al resultado.'
  - 'El logaritmo de una potencia con igual base no existe si el exponente es negativo.'
  - 'La expresión $\log_b(b^x)$ equivale a elevar el valor del logaritmo al exponente $(\log_b(b))^x$.'
afirmaciones_verdaderas:
  - 'El logaritmo de una potencia cuya base coincide con la base del logaritmo es igual al propio exponente: $\log_b(b^x) = x$.'
  - 'La propiedad $\log_b(b^x) = x$ permite evaluar directamente logaritmos expresando previamente el argumento como una potencia de la base.'
al_terminar_debes_poder: 'Simplificar expresiones de la forma $\log_b(b^x)$ cancelando la base logarítmica con la base de la potencia para extraer el exponente.'
