semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_POSITIVA
resumen_inicial: Una pendiente positiva ($m > 0$) indica que la función lineal o afín es estrictamente creciente en todo su dominio real.
explicacion_simple: '![Una pendiente positiva ($m > 0$) indica que la función lineal o afín es estrictamente creciente en todo su dominio real](/static/img/nodos/interpretacion-de-pendiente-positiva-como-crecimiento-intro.svg)



  Cuando una recta tiene **pendiente positiva** ($m > 0$):

  - Al moverte de **izquierda a derecha**, la gráfica **sube de manera continua**.

  - Si la variable $x$ aumenta, la imagen $y$ también aumenta.

  - A mayor valor de $m$, más rápido sube la recta y más empinada se ve.'
explicacion_formal: 'Una función afín o lineal $f(x) = mx + n$ es **estrictamente creciente** en $\mathbb{R}$ si y solo si su pendiente satisface $m > 0$:

  $$m > 0 \Longleftrightarrow \forall x_1, x_2 \in \mathbb{R}, \ x_1 < x_2 \implies f(x_1) < f(x_2)$$


  **Demostración analítica:**

  $$f(x_2) - f(x_1) = (mx_2 + n) - (mx_1 + n) = m(x_2 - x_1)$$

  Como $x_2 > x_1 \implies (x_2 - x_1) > 0$. Por lo tanto, el producto $m(x_2 - x_1) > 0$, lo que demuestra que $f(x_2) > f(x_1)$.'
definiciones_clave: '- **Función creciente**: Relación donde el orden algebraico de las preimágenes se conserva en sus imágenes.

  - **Pendiente positiva ($m > 0$)**: Tasa de cambio positiva constante.'
propiedades_relaciones: '- **Monotonía estricta**: No posee máximos ni mínimos relativos en $\mathbb{R}$.

  - **Inyectividad garantizada**: Toda función afín o lineal con $m > 0$ es estrictamente inyectiva.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una pendiente positiva ($m > 0$) indica que la función lineal o afín es estrictamente creciente en todo su dominio real](/static/img/nodos/interpretacion-de-pendiente-positiva-como-crecimiento-ejemplos.svg)



    Demuestra que la función $f(x) = 4x - 5$ es estrictamente creciente evaluando en $x_1 = 2$ y $x_2 = 5$.'
  pasos:
  - 'Paso 1: Identificar la pendiente: $m = 4 > 0$.'
  - 'Paso 2: Evaluar en $x_1 = 2$: $f(2) = 4(2) - 5 = 8 - 5 = 3$.'
  - 'Paso 3: Evaluar en $x_2 = 5$: $f(5) = 4(5) - 5 = 20 - 5 = 15$.'
  - 'Paso 4: Comprobar la desigualdad: como $2 < 5$ y $3 < 15$, se verifica que $f(2) < f(5)$.'
  - 'Paso 5: Concluir que la función es estrictamente creciente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones es estrictamente creciente en todo su dominio?
  choices:
  - text: f(x) = 3x - 10
    is_correct: true
  - text: f(x) = -2x + 7
    is_correct: false
  - text: f(x) = 8
    is_correct: false
  - text: f(x) = -x
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 3x - 10'. Su pendiente es $m = 3 > 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $m_1 = 2$ y $m_2 = 7$, ¿qué gráfica tiene un crecimiento más pronunciado?
  choices:
  - text: La recta con m = 7
    is_correct: true
  - text: La recta con m = 2
    is_correct: false
  - text: Crecen con la misma inclinación
    is_correct: false
  - text: Ninguna, ambas son decrecientes
    is_correct: false
  explanation: La alternativa correcta es 'La recta con m = 7'. A mayor pendiente positiva, mayor es la velocidad de crecimiento vertical.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el coeficiente de la variable $x$ (la pendiente $m$).'
- 'Paso 2: Verificar que $m > 0$.'
- 'Paso 3: Concluir que la función es estrictamente creciente en todo $\mathbb{R}$.'
- 'Paso 4: Trazar o interpretar la gráfica como una recta que asciende de izquierda a derecha.'
errores_correccion: '- **Error común:** Pensar que si la función tiene un término independiente negativo (como $f(x) = 5x - 100$), la función es decreciente.

  - **Cómo corregirlo:** El crecimiento o decrecimiento depende **exclusivamente del signo de la pendiente $m$**, no del término independiente $n$.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación por fórmula'
  enunciado: ¿Es la función $f(x) = \frac{1}{3}x + 8$ creciente o decreciente?
  alternativas:
  - Creciente, porque m = 1/3 > 0
  - Decreciente, porque 1/3 es menor que 1
  - Constante, por tener fracción
  - No se puede determinar
  respuesta: Creciente, porque m = 1/3 > 0
  solucion_pasos:
  - 'Paso 1: La pendiente es $m = 1/3$.'
  - 'Paso 2: Como $1/3 > 0$, la función es estrictamente creciente.'
- titulo: 'Ejemplo 2: Desigualdad funcional'
  enunciado: Si $f(x) = 6x - 2$ y $a < b$, ¿qué relación existe entre $f(a)$ y $f(b)$?
  alternativas:
  - f(a) < f(b)
  - f(a) > f(b)
  - f(a) = f(b)
  - f(a) + f(b) = 0
  respuesta: f(a) < f(b)
  solucion_pasos:
  - 'Paso 1: Como $m = 6 > 0$, la función preserva el sentido de la desigualdad: $f(a) < f(b)$.'
- titulo: 'Ejemplo 3: Gráfica ascendente'
  enunciado: Al mirar una gráfica de izquierda a derecha, si la recta sube, ¿qué signo tiene su pendiente?
  alternativas:
  - Positivo
  - Negativo
  - Cero
  - No tiene signo
  respuesta: Positivo
  solucion_pasos:
  - 'Paso 1: Toda recta que asciende de izquierda a derecha posee pendiente estrictamente positiva.'
- titulo: 'Ejemplo 4: Comparación de pendientes'
  enunciado: Dadas $f(x) = 2x$ y $g(x) = 5x$, si $x$ aumenta en 1 unidad, ¿cuál función aumenta más?
  alternativas:
  - g(x), porque aumenta 5 unidades
  - f(x), porque aumenta 2 unidades
  - Aumentan igual
  - Depende del valor inicial de x
  respuesta: g(x), porque aumenta 5 unidades
  solucion_pasos:
  - 'Paso 1: La tasa de cambio de $g(x)$ es $5$ vs $2$ de $f(x)$.'
errores_frecuentes:
- Juzgar el crecimiento por el término constante n en vez de la pendiente m.
- Creer que pendientes fraccionarias positivas generan funciones decrecientes.
- Mirar la gráfica de derecha a izquierda.
afirmaciones_verdaderas:
- Una función afín o lineal es estrictamente creciente si y solo si su pendiente m es mayor que cero.
- En una función creciente, al aumentar la variable independiente, la variable dependiente también aumenta.
al_terminar_debes_poder: '**QUÉ:** Interpretar y justificar el crecimiento de funciones lineales y afines con pendiente positiva.


  **CÓMO:** Verificando la condición m > 0 y su impacto en la conservación del orden de desigualdades y la inclinación ascendente.


  ![Resumen Una pendiente positiva ($m > 0$) indica que la función lineal o afín es estrictamente creciente en todo su dominio real](/static/img/nodos/interpretacion-de-pendiente-positiva-como-crecimiento-resumen.svg)'
