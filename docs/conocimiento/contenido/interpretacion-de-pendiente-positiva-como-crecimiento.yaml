semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_POSITIVA
resumen_inicial: 'Interpretación de pendiente positiva como crecimiento: conceptos,
  representación y propiedades en Función constante y función lineal.'
explicacion_simple: Cuando una recta sube de izquierda a derecha, algo numérico lo
  confirma sin necesidad de mirarla, su pendiente es positiva.
explicacion_formal: '### Definición formal


  Para una función lineal o afín $f(x) = mx + n$ con $m > 0$, se cumple que $x_1 <
  x_2 \implies f(x_1) < f(x_2)$ para todo $x_1, x_2$ del dominio; es decir, $f$ es
  estrictamente creciente en todo su dominio.


  ### Desarrollo didáctico


  Piensa en subir una escalera: cada paso hacia la derecha (aumento de $x$) corresponde
  a un paso hacia arriba (aumento de $y$).


  Si $m=4$, cada aumento de una unidad en $x$ produce un aumento de 4 unidades en
  $y$. La recta, vista de izquierda a derecha, siempre sube.'
definiciones_clave: '- **Interpretación de pendiente positiva como crecimiento**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de pendiente positiva como
  crecimiento.'
ejemplo_guiado:
