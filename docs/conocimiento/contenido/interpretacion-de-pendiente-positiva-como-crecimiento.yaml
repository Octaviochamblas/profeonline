semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_POSITIVA
resumen_inicial: La pendiente positiva $m > 0$ indica que la función es creciente y su recta asciende continuamente al avanzar de izquierda a derecha.
explicacion_simple: |
  Una **pendiente positiva** ($m > 0$) significa que la recta va **hacia arriba**:

  - A medida que te mueves a la derecha (aumentas $x$), el valor de $y$ **aumenta**.
  - Si caminas sobre la recta de izquierda a derecha, vas cuesta arriba.
  - En problemas reales, representa ganancias, crecimiento de población o acumulación.
explicacion_formal: |
  Sea la recta $f(x) = mx + b$ con $m > 0$. Para dos valores de entrada cualesquiera $x_1, x_2 \in \text{Dom}(f)$:

  $$x_1 < x_2 \implies f(x_1) < f(x_2)$$

  lo que constituye la definición formal de una función **estrictamente creciente**.

  **Interpretación de la tasa:**
  - $\Delta x > 0 \implies \Delta y = m \cdot \Delta x > 0$.
definiciones_clave: |
  - **Pendiente positiva ($m > 0$)**: Tasa de cambio positiva que modela incrementos proporcionales en la variable dependiente.
propiedades_relaciones: |
  - **Ángulo agudo**: La recta forma un ángulo agudo $\alpha \in ]0^\circ, 90^\circ[$ con el semi-eje positivo $X$.
ejemplo_guiado:
  enunciado: "El sueldo de un vendedor se expresa como $S(v) = 300.000 + 50v$, donde $v$ es el monto de ventas en miles de pesos. Interpreta la pendiente $m = 50$."
  pasos:
    - 'Paso 1: Identificar la pendiente: $m = 50$.'
    - 'Paso 2: Observar el signo positivo: $m = 50 > 0 \implies$ la función es estrictamente creciente.'
    - 'Paso 3: Interpretar la tasa: por cada mil pesos adicionales en ventas ($\Delta v = +1$), el sueldo aumenta en $\$50$ pesos ($\Delta S = +50$).'
    - 'Paso 4: Concluir que el sueldo crece en forma directamente proporcional a las ventas realizadas.'
checkpoints:
  - placement: after_explicacion_formal
    question: "En el modelo $S(v) = 300.000 + 50v$, ¿qué indica la pendiente positiva $m = 50$?"
    choices:
      - {text: "Que la función es creciente y el sueldo aumenta $50 por cada unidad vendida.", is_correct: true}
      - {text: "Que el sueldo disminuye $50 en cada venta.", is_correct: false}
      - {text: "Que el vendedor no recibe sueldo base.", is_correct: false}
      - {text: "Que la función es constante.", is_correct: false}
    explanation: "La alternativa correcta es 'Que la función es creciente y el sueldo aumenta $50 por cada unidad vendida.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué tipo de ángulo forma con el eje $X$ positivo una recta que posee pendiente positiva?"
    choices:
      - {text: "Un ángulo agudo (menor a $90^\\circ$).", is_correct: true}
      - {text: "Un ángulo obtuso (mayor a $90^\\circ$).", is_correct: false}
      - {text: "Un ángulo recto de $90^\\circ$.", is_correct: false}
      - {text: "Un ángulo plano de $180^\\circ$.", is_correct: false}
    explanation: "La alternativa correcta es 'Un ángulo agudo (menor a $90^\\circ$).'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la pendiente $m$ en la función $f(x) = mx + b$.'
  - 'Paso 2: Comprobar que $m > 0$.'
  - 'Paso 3: Clasificar la función como estrictamente creciente.'
  - 'Paso 4: Trazar la recta ascendiendo de izquierda a derecha en el plano cartesiano.'
errores_correccion: |
  - **Error común:** Creer que una pendiente positiva exige que el intercepto $b$ sea también un número positivo.
  - **Cómo corregirlo:** La pendiente $m > 0$ solo indica la **DIRECCIÓN DE CRECIMIENTO** de la recta; la recta puede cortar al eje $Y$ en números negativos (ej. $f(x) = 2x - 10$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función lineal con pendiente positiva $m > 0$ desciende a medida que $x$ aumenta.'
  - 'Si la pendiente de una recta es $m = 4$, al aumentar $x$ en 1 unidad, el valor de $y$ disminuye en 4 unidades.'
  - 'Una recta con pendiente positiva debe pasar obligatoriamente por el punto de corte $(0, -5)$.'
  - 'El ángulo de inclinación de una recta con pendiente positiva es siempre obtuso mayor a $90^\circ$.'
  - 'Una pendiente positiva impide que la recta tome valores de salida negativos.'
afirmaciones_verdaderas:
  - 'Una pendiente positiva ($m > 0$) indica que la función es estrictamente creciente: al aumentar el valor de $x$, la imagen $y = f(x)$ aumenta.'
  - 'Geométricamente, una recta con pendiente positiva asciende de izquierda a derecha formando un ángulo agudo ($0^\circ < \alpha < 90^\circ$) con el eje $X$ positivo.'
al_terminar_debes_poder: |
  QUÉ: Interpretar la pendiente positiva como indicador de crecimiento en funciones lineales.
  CÓMO: Identificar $m > 0$, deducir la monotonía creciente de la función y describir el ascenso de la recta en el plano.
fuente: 'Texto escolar MINEDUC — Álgebra / Función Constante y Lineal'
