semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_POSITIVA
resumen_inicial: Una pendiente estrictamente positiva ($m > 0$) indica que la función
  es estrictamente creciente (al aumentar $x$, aumenta $y$).
explicacion_simple: 'Cuando la pendiente de una recta es un número positivo ($m >
  0$):

  - Si miramos la recta de izquierda a derecha, la gráfica **VA SUBIENDO** hacia la
  derecha.

  - Esto significa que la función es **creciente**: a medida que aumenta la variable
  $x$, la variable $y$ también aumenta.'
explicacion_formal: 'Dada la función $f(x) = m x + b$ con $m > 0$:


  $$m > 0 \iff \forall x_1 < x_2 \implies f(x_1) < f(x_2)$$


  **Desglose de la fórmula:**

  - Definición formal de función estrictamente creciente en $\mathbb{R}$.'
definiciones_clave: '- **Pendiente positiva ($m > 0$)**: Tasa de variación positiva
  que determina una relación de proporcionalidad directa creciente.'
propiedades_relaciones: '- **Ángulo agudo**: El ángulo de inclinación $\theta$ pertenece
  al primer cuadrante ($0^\circ < \theta < 90^\circ$).'
ejemplo_guiado:
  enunciado: Dada la función $f(x) = 5x$, demuestra su comportamiento creciente comparando
    las evaluaciones para $x_1 = 2$ y $x_2 = 6$.
  pasos:
  - 'Paso 1: Identificar la pendiente: $m = 5 > 0$ (positiva).'
  - 'Paso 2: Evaluar $x_1 = 2$: $f(2) = 5(2) = 10$.'
  - 'Paso 3: Evaluar $x_2 = 6$: $f(6) = 5(6) = 30$.'
  - 'Paso 4: Comprobar que como $2 < 6$, se cumple $f(2) < f(6)$ ($10 < 30$).'
  - 'Paso 5: Concluir que la pendiente positiva $m = 5$ confirma el crecimiento de
    la función.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué comportamiento presenta la gráfica de una función lineal cuando su
    pendiente es positiva ($m > 0$)?
  choices:
  - text: Es estrictamente creciente (sube de izquierda a derecha).
    is_correct: true
  - text: Es estrictamente decreciente (baja de izquierda a derecha).
    is_correct: false
  - text: Es una línea recta horizontal.
    is_correct: false
  - text: Es una curva parabólica.
    is_correct: false
  explanation: La alternativa correcta es 'Es estrictamente creciente (sube de izquierda
    a derecha).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comparar las evaluaciones de $f(x) = 5x$ para $x_1 = 2$ y $x_2 = 6$,
    ¿qué valores de imagen se obtienen?
  choices:
  - text: $f(2) = 10$ y $f(6) = 30$, siendo $10 < 30$.
    is_correct: true
  - text: $f(2) = 30$ y $f(6) = 10$.
    is_correct: false
  - text: $f(2) = 0$ y $f(6) = 0$.
    is_correct: false
  - text: $f(2) = -10$ y $f(6) = -30$.
    is_correct: false
  explanation: La alternativa correcta es '$f(2) = 10$ y $f(6) = 30$, siendo $10 <
    30$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el signo del coeficiente de la pendiente $m$.'
- 'Paso 2: Si $m > 0$, clasificar la función como estrictamente creciente.'
- 'Paso 3: Dibujar o verificar que el trazado de la recta suba hacia la derecha.'
errores_correccion: '- **Error común:** Creer que si una función pasa por números
  negativos, su pendiente debe ser negativa.

  - **Cómo corregirlo:** El signo de la PENDIENTE indica la DIRECCIÓN del cambio (si
  sube o baja), no el valor de los números por donde pasa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
fuente: Texto escolar MINEDUC — Álgebra / Función Constante y Función Lineal
