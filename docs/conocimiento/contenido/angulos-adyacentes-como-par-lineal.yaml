semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.ADYACENTES
resumen_inicial: Dos ángulos son adyacentes (o forman un par lineal) cuando son consecutivos
  y sus lados no comunes son rayos opuestos que forman una línea recta de 180°.
explicacion_simple: '![Ángulos Adyacentes y Par Lineal](/static/img/nodos/angulos-adyacentes-como-par-lineal-intro.svg)


  Si tienes una línea recta horizontal y trazas un rayo que sale hacia arriba desde
  cualquier punto, la recta queda dividida en dos ángulos pegados. A esta pareja se
  le llama par lineal o ángulos adyacentes, y su suma siempre es exactamente 180°.'
explicacion_formal: '### Definición formal

  Dos ángulos $\angle AOB$ y $\angle BOC$ son **adyacentes** (o forman un **par lineal**)
  si son consecutivos y sus lados no comunes $\vec{OA}$ y $\vec{OC}$ son rayos opuestos
  alineados sobre una misma recta:


  $$\vec{OA} = -\lambda \vec{OC} \, (\lambda > 0) \implies \mu(\angle AOB) + \mu(\angle
  BOC) = 180^\circ$$


  ### Desglose simbólico y geométrico

  - Consecutivos + Colineales: Combinan la contigüidad con la alineación recta basal.

  - Teorema del par lineal: Dos ángulos que forman un par lineal son estrictamente
  suplementarios.

  - Ecuación fundamental: $\alpha + \beta = 180^\circ$.


  ### Síntesis didáctica

  El par lineal es la estructura geométrica más frecuente en demostraciones algebraicas
  sobre rectas secantes y polígonos.'
definiciones_clave: '- **Par lineal**: Dos ángulos adyacentes apoyados sobre una misma
  recta.

  - **Lados no comunes**: Rayos opuestos que determinan la recta soporte del par lineal. '
propiedades_relaciones: '- **Suplementariedad necesaria**: Todo par lineal está compuesto
  por dos ángulos suplementarios.

  - **Agudo y obtuso**: Si uno de los ángulos del par lineal es agudo, el otro es
  obligatoriamente obtuso (salvo cuando ambos son rectos de $90^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Par Lineal](/static/img/nodos/angulos-adyacentes-como-par-lineal-ejemplos.svg)


    Dos ángulos forman un par lineal. Si uno de ellos mide el triple del otro, calcula
    la medida de ambos ángulos.'
  pasos:
  - 'Paso 1: Llamar $x$ a la medida del ángulo menor y $3x$ a la medida del ángulo
    mayor.'
  - 'Paso 2: Aplicar la propiedad del par lineal: $x + 3x = 180^\circ$.'
  - 'Paso 3: Reducir y despejar: $4x = 180^\circ \implies x = 45^\circ$.'
  - 'Paso 4: Calcular el ángulo mayor: $3(45^\circ) = 135^\circ$.'
  - 'Paso 5: Concluir que los ángulos miden $45^\circ$ y $135^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad fundamental cumplen dos ángulos que forman un par lineal?
  choices:
  - text: Son consecutivos y suman exactamente 180°
    is_correct: true
  - text: Son opuestos por el vértice y son iguales
    is_correct: false
  - text: Suman exactamente 90°
    is_correct: false
  - text: Siempre tienen la misma medida
    is_correct: false
  explanation: Un par lineal está formado por dos ángulos que son consecutivos y suman
    exactamente 180°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo de un par lineal mide 62°, ¿cuánto mide el otro ángulo?
  choices:
  - text: 118° (porque 180° - 62° = 118°)
    is_correct: true
  - text: 28°
    is_correct: false
  - text: 128°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: Por ser suplementarios en un par lineal, 180° - 62° = 118°, por lo
    que el otro mide 118° (porque 180° - 62° = 118°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que los dos ángulos comparten un lado y se apoyan sobre una
  recta común.'
- 'Paso 2: Plantear la ecuación del par lineal $\alpha + \beta = 180^\circ$.'
- 'Paso 3: Despejar la medida desconocida.'
errores_correccion: Recuerda que un par lineal involucra únicamente dos ángulos contiguos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\alpha$ y $\beta$ forman un par lineal y $\alpha = 80^\circ$, ¿cuánto
    mide $\beta$?
  alternativas:
  - $100^\circ$
  - $10^\circ$
  - $80^\circ$
  respuesta: $100^\circ$
  solucion_pasos:
  - $\beta = 180^\circ - 80^\circ = 100^\circ$.
- titulo: Ejemplo 2
  enunciado: Si los ángulos de un par lineal miden $2x$ y $x + 30^\circ$, ¿cuánto
    vale $x$?
  alternativas:
  - $50^\circ$
  - $45^\circ$
  - $60^\circ$
  respuesta: $50^\circ$
  solucion_pasos:
  - $2x + x + 30^\circ = 180^\circ \implies 3x = 150^\circ \implies x = 50^\circ$.
- titulo: ¿Un par lineal siempre suma 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, por postulado métrico los ángulos adyacentes sobre una recta siempre suman
    180°.
- titulo: ¿Un par lineal puede estar compuesto por 3 ángulos?
  respuesta: 'No'
  solucion_pasos:
  - No, el término par lineal se refiere estrictamente a dos ángulos.
errores_frecuentes:
- Llamar par lineal a ángulos que no comparten el mismo vértice.
- Confundir par lineal (suman 180°) con ángulos complementarios adyacentes (suman
  90°).
- Asumir que los dos ángulos del par lineal son congruentes sin ser rectos.
- No verificar que los lados exteriores formen una recta de 180°.
- Incluir un tercer ángulo intermedio dentro de la definición de "par".
afirmaciones_verdaderas:
- Los dos ángulos de un par lineal siempre son suplementarios.
- Los lados no comunes de un par lineal forman una línea recta.
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y calcular ángulos adyacentes
  pertenecientes a un par lineal.


  **CÓMO:** Reconociendo la colinealidad de los lados no comunes y aplicando la relación
  $\alpha + \beta = 180^\circ$.


  ![Resumen de Par Lineal](/static/img/nodos/angulos-adyacentes-como-par-lineal-resumen.svg)'
