semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.ADYACENTES
resumen_inicial: Los ángulos adyacentes comparten el vértice y un lado común sin solaparse,
  permitiendo sumar aberturas contiguas directamente en el plano.
explicacion_simple: Imagina dos piezas de pizza pegadas una al lado de la otra. Comparten
  el borde del centro y el mismo vértice, pero no se enciman. Esos son ángulos adyacentes.
explicacion_formal: Dos ángulos son **adyacentes** si comparten el mismo vértice y
  un lado común, mientras que sus regiones interiores no se solapan. Si además sus
  lados no comunes forman una recta, son suplementarios.
definiciones_clave: '- **Ángulos adyacentes como par lineal**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en ángulos adyacentes como par lineal se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Dos rebanadas de pizza adyacentes comparten el borde del corte interior
    y el vértice del centro. Si la primera rebanada tiene una abertura de $30^\circ$
    y la segunda de $45^\circ$, halla la abertura combinada.
  pasos:
  - 'Paso 1: Usar la propiedad de ángulos adyacentes (comparten lado y vértice sin
    solaparse).'
  - 'Paso 2: Sumar las medidas contiguas: $30^\circ + 45^\circ$.'
  - 'Paso 3: Concluir que la abertura total combinada es $75^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de ángulos adyacentes como par
    lineal?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos rebanadas adyacentes miden 30° y 45°, ¿cuánto mide el ángulo total
    que forman juntas?
  choices:
  - text: 75°
    is_correct: true
  - text: 15°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 180°
    is_correct: false
  explanation: La alternativa correcta es '75°', suma directa de $30^\circ + 45^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en ángulos adyacentes como par lineal.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en ángulos adyacentes
  como par lineal sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 44^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 136°
  - 44°
  - 90°
  respuesta: 136°
  solucion_pasos:
  - Despejando $x = 180 - 44 = 136^\circ$.
- titulo: Ejemplo 2
  enunciado: En ángulos adyacentes como par lineal, si dos ángulos son suplementarios
    y uno mide 44°, ¿cuánto mide el otro?
  alternativas:
  - 136°
  - 46°
  - 360°
  respuesta: 136°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 44 = 136^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en ángulos adyacentes
    como par lineal?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en ángulos adyacentes como par lineal
    es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de ángulos adyacentes como par lineal.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
