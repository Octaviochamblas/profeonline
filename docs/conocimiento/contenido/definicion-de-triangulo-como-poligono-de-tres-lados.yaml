semantic_id: MAT.GEO.TRIANGULOS_DEF.POLIGONO_TRES_LADOS
resumen_inicial: El triángulo es el polígono cerrado de tres lados más elemental de
  la geometría plana, determinado por tres puntos no colineales unidos por segmentos
  de recta.
explicacion_simple: '![Definición de Triángulo](/static/img/nodos/definicion-de-triangulo-como-poligono-de-tres-lados-intro.svg)


  Un triángulo es una figura geométrica plana completamente cerrada formada por tres
  líneas rectas (lados) que se conectan en tres esquinas (vértices). Es la figura
  más resistente en arquitectura porque no se deforma bajo presión.'
explicacion_formal: '### Definición formal

  En el plano euclidiano $\mathbb{R}^2$, dados tres puntos no colineales $A, B, C$,
  se define el **triángulo** $\Delta ABC$ como la unión de los tres segmentos rectilíneos
  cerrados que los conectan dos a dos:


  $$\Delta ABC = \overline{AB} \cup \overline{BC} \cup \overline{CA}$$


  ### Desglose simbólico y geométrico

  - $A, B, C$: Puntos no colineales del plano, denominados **vértices** del triángulo
  ($A, B, C \in \mathbb{R}^2$).

  - $\overline{AB}, \overline{BC}, \overline{CA}$: Segmentos rectilíneos de frontera,
  denominados **lados** del triángulo.

  - No colinealidad: Condición $\vec{AB} \nparallel \vec{AC}$ que garantiza un área
  euclidiana no nula $\operatorname{Área}(\Delta ABC) > 0$.

  - Polígono mínimo: Es el polígono simple cerrado con el menor número de lados y
  vértices en geometría euclidiana.


  ### Síntesis didáctica

  El triángulo es la figura poligonal fundamental indeformable y la base de la triangulación
  de cualquier superficie poligonal en el plano.'
definiciones_clave: '- **Triángulo ($\triangle ABC$)**: Polígono de 3 lados ($n=3$)
  y 3 vértices.

  - **Puntos no colineales**: Tres puntos que no yacen sobre una misma línea recta.

  - **Región triangular**: Conjunto de puntos interiores junto con el perímetro del
  triángulo. '
propiedades_relaciones: '- **Polígono minimal**: Es el polígono con el menor número
  de lados posible en geometría plana ($n=3$).

  - **Rigidez geométrica**: A diferencia de cuadriláteros o polígonos mayores, un
  triángulo con longitudes de lados fijas es indeformable (criterio LLL de congruencia). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo](/static/img/nodos/definicion-de-triangulo-como-poligono-de-tres-lados-ejemplos.svg)


    Dados tres puntos en el plano $P(1, 1)$, $Q(4, 1)$ y $R(2, 5)$, determina si forman
    un triángulo válido.'
  pasos:
  - 'Paso 1: Analizar si los tres puntos están alineados (colineales) calculando las
    pendientes.'
  - 'Paso 2: Pendiente $PQ = \frac{1-1}{4-1} = 0$ (recta horizontal).'
  - 'Paso 3: Pendiente $PR = \frac{5-1}{2-1} = 4$.'
  - 'Paso 4: Como las pendientes son distintas ($0 \neq 4$), los puntos no son colineales.'
  - 'Paso 5: Concluir que $P, Q, R$ determinan un triángulo válido $\triangle PQR$
    en el plano.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable que deben cumplir 3 puntos en el plano
    para formar un triángulo?
  choices:
  - text: Deben ser puntos no colineales (no estar en una misma línea recta)
    is_correct: true
  - text: Deben estar alineados sobre una misma recta
    is_correct: false
  - text: Deben estar a la misma distancia del origen
    is_correct: false
  - text: Deben formar ángulos de 90° obligatoriamente
    is_correct: false
  explanation: Para formar un polígono cerrado de 3 lados, los 3 puntos deben ser
    puntos no colineales (no estar en una misma línea recta).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el número mínimo de lados que puede tener un polígono en geometría
    plana?
  choices:
  - text: Exactamente 3 lados (el triángulo)
    is_correct: true
  - text: 2 lados
    is_correct: false
  - text: 4 lados
    is_correct: false
  - text: 1 lado
    is_correct: false
  explanation: El polígono más simple en el plano tiene exactamente 3 lados (el triángulo).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que se dispone de 3 puntos distintos en el plano.'
- 'Paso 2: Comprobar que los 3 puntos no sean colineales (pendientes distintas).'
- 'Paso 3: Trazar los 3 segmentos conectando los puntos en ciclo cerrado.'
- 'Paso 4: Denotar el triángulo con el símbolo $\triangle$ seguido de las 3 letras
  mayúsculas de sus vértices.'
errores_correccion: Recuerda que si los tres puntos están alineados sobre una misma
  recta no forman un triángulo sino un segmento rectilíneo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos lados, vértices y ángulos interiores tiene un triángulo?
  alternativas:
  - 3 lados, 3 vértices y 3 ángulos interiores
  - 3 lados, 4 vértices y 2 ángulos interiores
  - 2 lados, 3 vértices y 3 ángulos interiores
  respuesta: 3 lados, 3 vértices y 3 ángulos interiores
  solucion_pasos:
  - Por definición fundamental de triángulo, tiene 3 lados, 3 vértices y 3 ángulos
    interiores.
- titulo: Ejemplo 2
  enunciado: Si unes los puntos $(0,0)$, $(3,0)$ y $(6,0)$, ¿obtienes un triángulo?
  alternativas:
  - No, porque los tres puntos son colineales y forman una línea recta
  - Sí, es un triángulo plano
  - Sí, es un triángulo degenerado de área positiva
  respuesta: No, porque los tres puntos son colineales y forman una línea recta
  solucion_pasos:
  - Los tres puntos yacen sobre el eje $X$ ($y=0$), por lo que son colineales y no
    encierran área.
- titulo: ¿Un triángulo es un polígono cerrado de 3 lados?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición geométrica euclidiana.
- titulo: ¿Tres puntos alineados sobre una misma recta forman un triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, tres puntos colineales forman un segmento o recta, no una figura bidimensional
    cerrada.
errores_frecuentes:
- Creer que 3 puntos cualesquiera siempre forman un triángulo (olvidar la no colinealidad).
- Confundir el perímetro del triángulo con la región interior triangular.
- Asumir que los lados de un triángulo pueden ser curvas o arcos (deben ser segmentos
  rectos).
- Creer que un polígono puede tener solo 2 lados.
- Confundir la notación $\triangle ABC$ con el producto de tres variables.
afirmaciones_verdaderas:
- Un triángulo es el polígono con menor número de lados posible ($n=3$).
- Tres puntos no colineales determinan de manera única un triángulo en el plano.
al_terminar_debes_poder: '**QUÉ:** Definir y caracterizar rigurosamente el triángulo
  como polígono cerrado de tres lados.


  **CÓMO:** Verificando la no colinealidad de tres puntos y reconociendo sus lados,
  vértices y región interior.


  ![Resumen de la Definición de Triángulo](/static/img/nodos/definicion-de-triangulo-como-poligono-de-tres-lados-resumen.svg)'
