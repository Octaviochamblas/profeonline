resumen_inicial: 'Una razón es una comparación entre dos magnitudes por cociente $\frac{a}{b}$
  o $a : b$, que expresa cuántas veces contiene o está contenida una cantidad respecto
  a la otra ($b \neq 0$).'
explicacion_simple: Una razón es una forma de comparar dos cantidades para saber cuántas
  veces cabe una dentro de la otra. Se puede escribir como una fracción $a/b$ o con
  dos puntos $a:b$, leyéndose 'a es a b'. Por ejemplo, en una receta con 2 tazas de
  agua por 1 de arroz, la razón de agua a arroz es 2 a 1.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $b \in \mathbb{R} \setminus \{0\}$,
  la **Razón por Cociente** es el cociente multiplicativo entre las magnitudes $a$
  y $b$:


  $$r = \frac{a}{b} = a : b$$


  **Diferencia entre razón y fracción común:**

  - Fracción común: Relación parte-todo donde numerador y denominador representan
  la misma magnitud contada.

  - Razón: Relación parte-parte o parte-todo que admite términos decimales o de distintas
  unidades físicas.


  > **Complemento didáctico:** Las razones permiten comparar magnitudes heterogéneas,
  como velocidad (distancia : tiempo).'
definiciones_clave: '- **Razón**: Comparación multiplicativa $a : b = \frac{a}{b}$
  entre dos cantidades $a$ y $b$ ($b \neq 0$).'
propiedades_relaciones: '- **Comparación multiplicativa**: Establece la escala o proporción
  entre dos valores.'
ejemplo_guiado:
  enunciado: En un curso hay $18$ mujeres y $12$ hombres. Escriba y simplifique la
    razón entre mujeres y hombres.
  pasos:
  - 'Paso 1: Identificar la cantidad de mujeres ($18$) y de hombres ($12$).'
  - 'Paso 2: Formar la razón en el orden indicado: $\frac{18}{12}$ o $18 : 12$.'
  - 'Paso 3: Simplificar dividiendo por el divisor común $6$: $\frac{18:6}{12:6} =
    \frac{3}{2}$.'
  - 'Conclusión: La razón es $3 : 2$ (por cada $3$ mujeres hay $2$ hombres).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente la razón entre dos magnitudes a y b (b !=
    0)?
  choices:
  - text: 'Como la comparación por cociente a/b o a : b que indica cuántas veces contiene
      una a la otra'
    is_correct: true
  - text: Como la resta a - b
    is_correct: false
  - text: Como la suma a + b
    is_correct: false
  - text: Como el producto a · b
    is_correct: false
  explanation: 'La alternativa correcta es ''Como la comparación por cociente a/b
    o a : b que indica cuántas veces contiene una a la otra''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 18 mujeres y 12 hombres, ¿cuál fue la razón
    simplificada final?
  choices:
  - text: '3 : 2 (o 3/2)'
    is_correct: true
  - text: '18 : 12'
    is_correct: false
  - text: '2 : 3'
    is_correct: false
  - text: '6 : 1'
    is_correct: false
  explanation: 'La alternativa correcta es ''3 : 2 (o 3/2)''.'
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: 'Al terminar serás capaz de definir y expresar razones como
  comparaciones por cociente $a : b = \frac{a}{b}$, simplificando la relación entre
  dos magnitudes.'
semantic_id: MAT.NUM.RAZONES.DEFINICION_COCIENTE
procedimiento:
- 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la comparación por
  cociente.'
- 'Paso 2: Calcular el valor de la razón $k = a / b$ o aplicar las propiedades de
  series de razones.'
- 'Paso 3: Simplificar y expresar la respuesta en términos del problema planteado.'
errores_correccion: '- **Error 1: Confundir la comparación por cociente con la comparación
  por diferencia (resta).** **Cómo corregirlo:** La razón matemática es multiplicativa
  por división ($a/b$), no por resta ($a-b$).


  - **Error 2: Invertir el orden entre antecedente y consecuente.** **Cómo corregirlo:**
  Respetar estrictamente el orden nombrado en el enunciado ($a:b$ pone a $a$ arriba
  y a $b$ abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAZONES.DEFINICION_COCIENTE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de razones.
- titulo: Ejemplo 2
  enunciado: Verificación de la relación proporcional.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por cociente.
- titulo: ¿Es el consecuente de una razón siempre distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división por cero.
- titulo: ¿Se conserva la constante k al sumar antecedentes y consecuentes en una
    serie?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de las series de razones.
errores_frecuentes:
- Calcular la razón entre dos magnitudes mediante la resta de sus valores numéricos.
- Invertir la posición del antecedente y del consecuente alterando el valor escalar
  de la razón.
- Utilizar el número cero como el consecuente de una razón matemática.
- La constante de la razón $k$ en una serie de razones cambia al sumar los antecedentes.
- Sumar directamente los términos de la razón sin multiplicar por la constante $k$.
afirmaciones_verdaderas:
- 'Una razón es la comparación por cociente $a : b = \frac{a}{b}$ entre dos magnitudes
  con $b \neq 0$.'
- En una serie de razones iguales $\frac{a}{b} = \frac{c}{d} = k$, la razón entre
  la suma de antecedentes y la suma de consecuentes equivale a $k$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
