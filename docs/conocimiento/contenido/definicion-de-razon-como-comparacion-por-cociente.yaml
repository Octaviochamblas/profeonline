semantic_id: MAT.NUM.RAZONES_PROPORCIONES.RAZON_DEFINICION
resumen_inicial: 'Una razón es la comparación cuantitativa entre dos cantidades mediante su cociente: $a : b$ o $\frac{a}{b}$, donde el resultado $k$ indica cuántas veces el antecedente $a$ contiene al consecuente $b$ ($b \neq 0$).'
explicacion_simple: '![Definición de razón](/static/img/nodos/definicion-de-razon-como-comparacion-por-cociente-intro.svg)


  Una **razón** es una forma de comparar dos números usando la división:

  - Se escribe $a : b$ o en forma de fracción $\frac{a}{b}$.

  - Se lee: **«$a$ es a $b$»**.

  - Por ejemplo, si en un salón hay $15$ mujeres y $10$ hombres, la razón de mujeres a hombres es $\frac{15}{10} = \frac{3}{2} = 1,5$. Esto significa que por cada $3$ mujeres hay $2$ hombres (o hay $1,5$ mujeres por cada hombre).

  - A diferencia de una fracción clásica, los términos de una razón pueden ser números decimales (ejemplo: $2,5 : 0,5 = 5$).'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ con $b \neq 0$. Se define la **razón geométrica** (o simplemente razón) entre $a$ y $b$ como el cociente:


  $$r = \frac{a}{b} = a : b = k$$


  donde:

  - $a$: es el **antecedente** (dividendo).

  - $b$: es el **consecuente** (divisor, $b \neq 0$).

  - $k$: es el **valor de la razón** (constante de proporcionalidad).


  **Naturaleza Comparativa:**

  La razón establece una relación multiplicativa entre dos magnitudes homogéneas (de la misma especie o unidad de medida) o heterogéneas (dando origen a magnitudes derivadas como la velocidad $\frac{\text{km}}{\text{h}}$ o la densidad $\frac{\text{g}}{\text{cm}^3}$).'
definiciones_clave: "- **Razón ($\frac{a}{b}$)**: Comparación por cociente entre dos cantidades.\n- **Antecedente ($a$)**: Primer término de la razón.\n- **Consecuente ($b$)**: Segundo término de la razón ($b \neq 0$).\n- **Magnitudes homogéneas**: Cantidades con la misma unidad de medida."
propiedades_relaciones: '- **Invarianza por amplificación/simplificación**: $\frac{a}{b} = \frac{a \cdot m}{b \cdot m}$ con $m \neq 0$.

  - **No conmutatividad**: $\frac{a}{b} \neq \frac{b}{a}$ (a menos que $a = b$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de definición de razón](/static/img/nodos/definicion-de-razon-como-comparacion-por-cociente-ejemplos.svg)


    En un grupo hay $15$ mujeres y $10$ hombres. Calcule y simplifique la razón entre mujeres y hombres, y luego entre $2,5$ litros y $0,5$ litros.'
  pasos:
  - 'Paso 1: Para mujeres a hombres: Antecedente = $15$, Consecuente = $10 \implies \frac{15}{10}$.'
  - 'Paso 2: Simplificar dividiendo por 5: $\frac{15:5}{10:5} = \frac{3}{2} = 1,5$.'
  - 'Paso 3: Para los litros: Plantear el cociente $\frac{2,5}{0,5} = \frac{25}{5} = 5$.'
  - 'Conclusión: Las razones simplificadas son $3 : 2$ (o $1,5$) y $5 : 1$ (o $5$).'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cómo se lee formalmente la razón matemática $4 : 9$?'
  choices:
  - text: «4 es a 9»
    is_correct: true
  - text: «4 dividido menos 9»
    is_correct: false
  - text: «4 multiplicado por 9»
    is_correct: false
  - text: «9 es a 4»
    is_correct: false
  explanation: La alternativa correcta es '«4 es a 9»'. Es la lectura estándar de una razón.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado, ¿qué significa que la razón de mujeres a hombres sea $3 : 2$?'
  choices:
  - text: Que por cada 3 mujeres en el grupo hay 2 hombres
    is_correct: true
  - text: Que hay 3 mujeres y 2 hombres en total en el grupo
    is_correct: false
  - text: Que los hombres superan a las mujeres por 1
    is_correct: false
  - text: Que hay 3 veces más hombres que mujeres
    is_correct: false
  explanation: La alternativa correcta es 'Que por cada 3 mujeres en el grupo hay 2 hombres'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos cantidades en el orden exacto que indica el problema.'
- 'Paso 2: Escribir el cociente $\frac{a}{b}$ con el primer término en el numerador y el segundo en el denominador.'
- 'Paso 3: Simplificar la fracción a su forma irreducible o calcular su valor decimal $k = a \div b$.'
errores_correccion: "- **Error 1: Invertir el orden de las cantidades ($\frac{b}{a}$ en vez de $\frac{a}{b}$).** **Cómo corregirlo:** La primera cantidad nombrada es SIEMPRE el numerador/antecedente.\n- **Error 2: Confundir razón con diferencia (restar en vez de dividir).** **Cómo corregirlo:** La razón matemática estándar compara por división (multiplicativamente)."
ejemplos:
- titulo: Ejemplo 1
  enunciado: En una receta se usan $4$ tazas de harina por cada $3$ tazas de leche. ¿Cuál es la razón de harina a leche?
  alternativas:
  - '$4 : 3$'
  - '$3 : 4$'
  - '$4 : 7$'
  respuesta: '$4 : 3$'
  solucion_pasos:
  - 'Harina va en el antecedente ($4$) y leche en el consecuente ($3$) $\implies 4 : 3$.'
- titulo: Ejemplo 2
  enunciado: '¿A qué valor decimal equivale la razón $18 : 24$?'
  alternativas:
  - $0,75$
  - $1,33$
  - $0,60$
  respuesta: $0,75$
  solucion_pasos:
  - $\frac{18}{24} = \frac{3}{4} = 0,75$.
- titulo: ¿Es la razón de 8 a 2 igual a 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\frac{8}{2} = 4$.
  alternativas:
  - texto: Sí, 8 dividido entre 2 da 4
    es_correcta: true
    retroalimentacion: ¡Correcto! El valor de la razón es $k = 4$.
  - texto: No, es 6
    es_correcta: false
    retroalimentacion: Incorrecto, $8 - 2 = 6$ es una resta, no una razón geométrica.
  - texto: No, es 0,25
    es_correcta: false
    retroalimentacion: Incorrecto, $2/8 = 0,25$ es la razón inversa.
- titulo: ¿Pueden los términos de una razón ser números decimales?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, a diferencia de las fracciones estrictas de números enteros, una razón admite reales como $1,5 : 0,5$.'
  alternativas:
  - texto: Sí, una razón admite cualquier número real con consecuente no nulo
    es_correcta: true
    retroalimentacion: ¡Correcto! Admite decimales y enteros.
  - texto: No, solo pueden ser números enteros positivos
    es_correcta: false
    retroalimentacion: Incorrecto, las razones aplican a mediciones continuas.
  - texto: No, deben ser siempre números primos
    es_correcta: false
    retroalimentacion: Incorrecto, no existe restricción de primalidad.
errores_frecuentes:
- Invertir el orden de antecedente y consecuente.
- Restar los términos en lugar de dividirlos.
- Asumir que una razón siempre representa una parte de un todo.
- Olvidar simplificar la razón a su mínima expresión.
afirmaciones_verdaderas:
- Una razón matemática es la comparación cuantitativa de dos cantidades por cociente $\frac{a}{b}$.
- El consecuente debe ser siempre estrictamente distinto de cero ($b \neq 0$).
- El valor de la razón $k = \frac{a}{b}$ se mantiene invariante al amplificar o simplificar ambos términos.
al_terminar_debes_poder: '![Síntesis de razón](/static/img/nodos/definicion-de-razon-como-comparacion-por-cociente-resumen.svg)


  QUÉ: Comprender y formular razones matemáticas entre dos cantidades homogéneas o heterogéneas.


  CÓMO: Expresando la comparación como cociente $\frac{a}{b}$ con $b \neq 0$, respetando el orden de los términos e interpretando su valor decimal o fraccionario simplificado $k$.'
