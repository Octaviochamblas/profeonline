semantic_id: MAT.NUM.RAZONES.DEFINICION_COCIENTE
resumen_inicial: 'Una razón es la comparación entre dos magnitudes cuantitativas mediante la operación de división o cociente, expresada como $a : b$ o $\frac{a}{b}$ con $b \neq 0$.'
explicacion_simple: |
  Una razón compara dos cantidades para indicar cuántas veces una contiene a la otra o en qué proporción se encuentran. Se lee *" $a$ es a $b$ "*. Por ejemplo, si en una receta hay 3 tazas de harina por cada 2 tazas de leche, la razón de harina a leche se escribe $3 : 2$ o $\frac{3}{2}$. Esto significa que por cada 3 unidades de harina se requieren exactamente 2 unidades de leche.
explicacion_formal: |
  ### Definición formal
  La **razón geométrica (o comparación por cociente)** entre dos números reales $a, b \in \mathbb{R}$ con $b \neq 0$ es el cociente obtenido al dividir la primera cantidad entre la segunda:
  $$r = \frac{a}{b} = a : b$$

  ### Simbología y Elementos
  - **Notación de dos puntos**: $a : b$ (se lee "$a$ es a $b$").
  - **Notación fraccionaria**: $\frac{a}{b}$.
  - **Antecedente ($a$)**: Cantidad del numerador que se compara.
  - **Consecuente ($b$)**: Cantidad del denominador que sirve de referencia ($b \neq 0$).
  - **Valor de la razón ($r$)**: Resultado cociente de la división.

  ### Diferencia estructural con las fracciones comunes
  Mientras que una fracción estándar expresa partes de un todo continuo ($\frac{\text{parte}}{\text{todo}}$), una razón matemática puede comparar dos partes de un mismo todo ($\frac{\text{parte}}{\text{parte}}$) o dos magnitudes distintas con diferentes unidades de medida (como velocidad $\frac{\text{km}}{\text{h}}$).

  ### Síntesis didáctica
  - Comparación por cociente: $\frac{a}{b}$.
  - Condición de existencia: Consecuente $b \neq 0$.
definiciones_clave: |
  - **Razón matemática**: Relación de cociente entre dos cantidades medibles $a : b$.
  - **Comparación por cociente**: Método de evaluación que mide la proporción multiplicativa entre dos magnitudes.
  - **Lectura "$a$ es a $b$"**: Verbalización estándar de la relación de razón $a : b$.
propiedades_relaciones: |
  - **Invariancia por amplificación y simplificación**: Multiplicar o dividir el antecedente y el consecuente por un mismo número distinto de cero no altera el valor de la razón ($\frac{a \cdot k}{b \cdot k} = \frac{a}{b}$).
  - **Razón inversa**: La razón inversa de $a : b$ es $b : a$, y su producto es igual a 1 ($\frac{a}{b} \cdot \frac{b}{a} = 1$).
ejemplo_guiado:
  enunciado: 'En un curso de 40 estudiantes hay 24 mujeres y 16 hombres. Escribe y simplifica la razón entre la cantidad de mujeres y la cantidad de hombres.'
  pasos:
    - 'Paso 1: Identificamos la primera cantidad comparada (antecedente): $a = 24$ (mujeres).'
    - 'Paso 2: Identificamos la cantidad de referencia (consecuente): $b = 16$ (hombres).'
    - 'Paso 3: Formamos la razón como cociente: $\frac{24}{16}$ o $24 : 16$.'
    - 'Paso 4: Simplificamos la fracción dividiendo el antecedente y el consecuente entre $8$: $\frac{24 \div 8}{16 \div 8} = \frac{3}{2}$. La razón simplificada es $3 : 2$ (por cada 3 mujeres hay 2 hombres).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación matemática define la comparación de dos magnitudes en una razón geométrica $a : b$?'
    choices:
      - {text: 'La división o cociente entre el antecedente y el consecuente ($\frac{a}{b}$)', is_correct: true}
      - {text: 'La resta o diferencia entre ambas cantidades ($a - b$)', is_correct: false}
      - {text: 'La multiplicación de los dos valores ($a \cdot b$)', is_correct: false}
      - {text: 'La suma de las dos cantidades ($a + b$)', is_correct: false}
    explanation: 'La alternativa correcta es ''La división o cociente entre el antecedente y el consecuente ($\frac{a}{b}$)''. Una razón geométrica es la comparación por cociente de dos cantidades.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un canasto hay 10 manzanas y 15 naranjas. ¿Cuál es la razón simplificada entre la cantidad de manzanas y la cantidad de naranjas?'
    choices:
      - {text: '$2 : 3$, dividiendo ambas cantidades por 5', is_correct: true}
      - {text: '$3 : 2$, invirtiendo las cantidades', is_correct: false}
      - {text: '$10 : 25$, comparando con el total', is_correct: false}
      - {text: '$5 : 1$, restando las cantidades', is_correct: false}
    explanation: 'La alternativa correcta es ''$2 : 3$, dividiendo ambas cantidades por 5''. La razón $\frac{10}{15}$ simplificada por 5 entrega $\frac{2}{3}$ o $2 : 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos magnitudes que se van a comparar en el problema.'
  - 'Paso 2: Asignar la primera magnitud al antecedente (numerador $a$) y la segunda al consecuente (denominador $b$).'
  - 'Paso 3: Escribir la razón en notación de cociente $\frac{a}{b}$ o notación de puntos $a : b$.'
  - 'Paso 4: Simplificar la razón dividiendo antecedente y consecuente entre su Máximo Común Divisor (MCD).'
errores_correccion: |
  - **Error 1:** Confundir la comparación por cociente con la comparación por diferencia (ej: decir que la razón entre 10 y 4 es 6). **Cómo corregirlo:** La diferencia $10 - 4 = 6$ es una razón aritmética; la **razón matemática estándar (geométrica)** es la división $\frac{10}{4} = 2.5$.
  - **Error 2:** Invertir el orden del antecedente y del consecuente (ej: pedir la razón de hombres a mujeres y escribir $\frac{\text{mujeres}}{\text{hombres}}$). **Cómo corregirlo:** La primera cantidad mencionada en el enunciado **siempre debe ocupar el antecedente (numerador)**.
ejemplos:
  - titulo: 'Razón en figuras geométricas'
    enunciado: '¿La razón entre un largo de $12\text{ cm}$ y un ancho de $4\text{ cm}$ es $3 : 1$?'
    alternativas:
      - 'Sí, pues $12 / 4 = 3 / 1$'
      - 'No, es $1 : 3$'
      - 'No, es $8 : 1$'
    respuesta: 'Sí, pues $12 / 4 = 3 / 1$'
    solucion_pasos:
      - '1. Formamos la razón $\frac{12}{4}$.'
      - '2. Simplificamos dividiendo por 4: $\frac{3}{1}$ o $3 : 1$.'
  - titulo: 'Razón de partes de un total'
    enunciado: 'En una mezcla de 50 litros con 20 litros de jugo y 30 litros de agua, ¿la razón de jugo a agua es $2 : 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{20}{30} = \frac{2}{3}$ o $2 : 3$.'
  - titulo: 'Razón entre unidades distintas'
    enunciado: '¿Un automóvil que recorre $150\text{ km}$ en $3\text{ horas}$ mantiene una razón de velocidad de $50\text{ km/h}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{150\text{ km}}{3\text{ h}} = 50\text{ km/h}$.'
  - titulo: 'Invariancia por amplificación'
    enunciado: '¿Las razones $4 : 5$ y $12 : 15$ representan la misma proporción comparativa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Amplificando $4 : 5$ por 3 se obtiene $12 : 15$.'
errores_frecuentes:
  - 'Restar las cantidades en lugar de dividirlas para calcular la razón geométrica.'
  - 'Invertir las posiciones del antecedente y del consecuente alterando la interpretación del problema.'
  - 'Sumar el antecedente y el consecuente para obtener el valor de la razón.'
  - 'Utilizar el número cero como el consecuente de una razón.'
  - 'Considerar que las razones sólo se pueden aplicar a cantidades que miden el mismo tipo de objeto.'
afirmaciones_verdaderas:
  - 'Una razón es la comparación de dos magnitudes cuantitativas mediante el cociente de la división $a : b = \frac{a}{b}$ ($b \neq 0$).'
  - 'Amplificar o simplificar el antecedente y el consecuente por un mismo número real no nulo conserva inalterada la razón.'
al_terminar_debes_poder: 'Formular e interpretar razones geométricas $a : b = \frac{a}{b}$ para comparar dos magnitudes mediante el cociente.'
