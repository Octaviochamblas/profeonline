semantic_id: MAT.NUM.RAZONES.DEFINICION_COCIENTE
resumen_inicial: Una razón es la comparación entre dos cantidades mediante un cociente
  o división, expresada como $a:b$ o $\frac{a}{b}$ (con $b \neq 0$).
explicacion_simple: 'Una razón indica cuántas veces una cantidad contiene a otra o
  en qué proporción se relacionan:

  - Si en una receta usas 2 tazas de agua por cada 3 de harina, la razón de agua a
  harina es $2:3$ o $\frac{2}{3}$.

  - Se lee ''2 es a 3''.'
explicacion_formal: Dadas dos cantidades $a, b \in \mathbb{R}$ con $b \neq 0$, la
  razón geométrica entre $a$ y $b$ se define como el cociente $\frac{a}{b}$. Representa
  la magnitud relativa de $a$ respecto de $b$.
definiciones_clave: '- **Razón ($a:b$)**: Comparación por cociente entre la primera
  cantidad $a$ y la segunda $b$.'
propiedades_relaciones: '- **Independencia de unidades**: Las cantidades comparadas
  deben expresarse en la misma unidad de medida.'
ejemplo_guiado:
  enunciado: En un curso hay 15 hombres y 20 mujeres. Escribe la razón entre la cantidad
    de hombres y mujeres en su forma simplificada.
  pasos:
  - 'Escribir la razón inicial: $\frac{15}{20}$.'
  - Simplificar la fracción dividiendo numerador y denominador entre 5.
  - Obtener $\frac{15 \div 5}{20 \div 5} = \frac{3}{4}$ (o $3:4$).
  - Concluir que la razón es 3 es a 4 (por cada 3 hombres hay 4 mujeres).
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se lee la expresión de razón $5:8$?
  choices:
  - text: 5 es a 8
    is_correct: true
  - text: 5 más 8
    is_correct: false
  - text: 5 por 8
    is_correct: false
  - text: 5 menos 8
    is_correct: false
  explanation: 'La correcta es: 5 es a 8. Es la lectura verbal estándar de una razón.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una caja hay 8 bolitas rojas y 12 azules. ¿Cuál es la razón simplificada
    entre bolitas rojas y azules?
  choices:
  - text: '2:3'
    is_correct: true
  - text: '8:12'
    is_correct: false
  - text: '3:2'
    is_correct: false
  - text: '2:5'
    is_correct: false
  explanation: 'La correcta es: 2:3. Simplificando 8/12 entre 4 resulta 2/3.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos cantidades a comparar y el orden requerido.'
- 'Paso 2: Escribir la primera cantidad en el numerador (antecedente) y la segunda
  en el denominador (consecuente).'
- 'Paso 3: Simplificar la fracción al máximo dividiendo por su MCD.'
errores_correccion: No inviertas el orden de los términos. La razón de hombres a mujeres
  ($15:20$) es distinta de la razón de mujeres a hombres ($20:15$).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula la razón entre 10 y 25.
  alternativas:
  - '2:5'
  - '5:2'
  - '1:2'
  respuesta: '2:5'
  solucion_pasos:
  - 10/25 simplificado por 5 es 2/5.
errores_frecuentes:
- Invertir los términos del cociente.
afirmaciones_verdaderas:
- Una razón compara dos cantidades mediante un cociente.
al_terminar_debes_ponder: Expresar y simplificar razones entre cantidades numéricas.
fuente: Texto escolar MINEDUC.
estado: publicado
