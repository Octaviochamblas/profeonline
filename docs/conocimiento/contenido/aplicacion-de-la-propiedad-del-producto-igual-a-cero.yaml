procedimiento:
- 'Paso 1: Verifica que la ecuación esté expresada como un producto de factores igualado
  a cero.'
- 'Paso 2: Iguala cada factor a cero por separado.'
- 'Paso 3: Resuelve cada ecuación lineal resultante para obtener las soluciones.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en aplicación de la propiedad del producto igual a cero.
ejemplos:
- titulo: Aplicación directa de la propiedad
  enunciado: Resuelve $(x-4)(x+2)=0$.
  solucion_pasos:
  - $x-4=0$ o $x+2=0$.
  - $x=4$ o $x=-2$.
- titulo: Aplicación con factores que incluyen coeficientes
  enunciado: Resuelve $(2x-6)(x+1)=0$.
  solucion_pasos:
  - $2x-6=0$ o $x+1=0$.
  - $x=3$ o $x=-1$.
- titulo: ¿La propiedad del producto nulo funciona si el producto es igual a 5 en
    vez de 0?
  enunciado: ¿La propiedad del producto nulo funciona si el producto es igual a 5
    en vez de 0?
  respuesta: 'No'
  solucion_pasos:
  - La propiedad solo garantiza que al menos un factor sea cero cuando el producto
    es exactamente cero; con cualquier otro valor no se puede concluir nada sobre
    los factores individuales.
- titulo: ¿Es necesario que la ecuación esté igualada a cero antes de aplicar esta
    propiedad?
  enunciado: ¿Es necesario que la ecuación esté igualada a cero antes de aplicar esta
    propiedad?
  respuesta: Sí
  solucion_pasos:
  - Sin esa condición, no se puede aplicar la propiedad del producto nulo para deducir
    el valor de los factores.
errores_frecuentes:
- Aplicar la propiedad cuando el producto de factores no está igualado a cero, sino
  a otro número.
- Igualar solo uno de los factores a cero, olvidando el otro.
- Confundir la propiedad con una regla de suma en vez de producto.
- Resolver incorrectamente la ecuación lineal resultante de cada factor igualado a
  cero.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando aplicación
  de la propiedad del producto igual a cero.
