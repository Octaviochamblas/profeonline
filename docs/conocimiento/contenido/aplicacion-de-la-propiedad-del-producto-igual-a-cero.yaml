semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.PROPIEDAD_CERO
resumen_inicial: 'La propiedad del producto cero establece que el producto de dos o más factores reales es nulo si y solo si al menos uno de los factores es igual a cero: $A \cdot B = 0 \iff A = 0 \lor B = 0$.'
explicacion_simple: "![La propiedad del producto cero establece que el producto de dos o más factores reales es nulo si y solo si al menos uno de los factores es igual a cero: $A \\cdot B = 0 \\iff A = 0 \\lor B = 0$](/static/img/nodos/aplicacion-de-la-propiedad-del-producto-igual-a-cero-intro.svg)\n\n\nPiensa en una multiplicación sencilla: si multiplicas dos números y el resultado da cero, **¡es 100% seguro que al menos uno de ellos tiene que ser cero!**\n\nEn álgebra:\n- Si tienes **$(x - 3)(x + 5) = 0$**, divides el problema en dos caminos sencillos:\n  - Camino 1: $x - 3 = 0 \\implies x = 3$.\n  - Camino 2: $x + 5 = 0 \\implies x = -5$.\n- ¡Así de fácil! Las dos soluciones son **$x = 3$** y **$x = -5$**.\n- **Regla crucial:** Esto funciona **ÚNICAMENTE si el otro lado es CERO** (si dice $(x-3)(x+5) = 8$, no puedes decir que $x-3=8$)."
explicacion_formal: 'En el cuerpo de los números reales $\mathbb{R}$ (que es un dominio de integridad sin divisores de cero), la **propiedad del producto nulo** se formula formalmente como:

  $$\forall A, B \in \mathbb{R}: \quad A \cdot B = 0 \Longleftrightarrow A = 0 \quad \lor \quad B = 0$$


  **Aplicación a polinomios cuadráticos factorizados:**

  Dado el polinomio $P(x) = (px + q)(rx + s) = 0$ con $p, r \neq 0$:

  $$(px + q)(rx + s) = 0 \Longleftrightarrow px + q = 0 \quad \lor \quad rx + s = 0$$

  $$x_1 = -\frac{q}{p}, \quad x_2 = -\frac{s}{r}$$


  El conjunto solución es la unión de los conjuntos solución de cada ecuación lineal desacoplada:

  $$\mathcal{S} = \left\{ -\frac{q}{p} \right\} \cup \left\{ -\frac{s}{r} \right\} = \left\{ -\frac{q}{p}, -\frac{s}{r} \right\}$$'
definiciones_clave: '- **Propiedad del producto cero**: Principio que permite descomponer una ecuación factorizada de grado $n$ en $n$ ecuaciones lineales independientes.

  - **Dominio de integridad**: Estructura algebraica donde ningún producto de elementos no nulos puede resultar cero.'
propiedades_relaciones: '- **Exclusividad del cero**: La propiedad no es transferible a ningún escalar $k \neq 0$ ($A \cdot B = k \not\implies A = k \lor B = k$).

  - **Extensión a $n$ factores**: $\prod_{i=1}^n (x - r_i) = 0 \iff \exists i \in \{1, \dots, n\} \text{ tal que } x = r_i$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La propiedad del producto cero establece que el producto de dos o más factores reales es nulo si y solo si al menos uno de los factores es igual a cero: $A \cdot B = 0 \iff A = 0 \lor B = 0$](/static/img/nodos/aplicacion-de-la-propiedad-del-producto-igual-a-cero-ejemplos.svg)



    Resuelve la ecuación cuadrática factorizada $(2x - 7)(3x + 4) = 0$ aplicando rigurosamente la propiedad del producto cero.'
  pasos:
  - 'Paso 1: Verificar que el miembro derecho sea estrictamente igual a 0.'
  - 'Paso 2: Aplicar la propiedad del producto nulo desacoplando en dos ecuaciones lineales:

    $2x - 7 = 0 \quad \lor \quad 3x + 4 = 0$.'
  - 'Paso 3: Resolver la primera ecuación lineal: $2x = 7 \implies x_1 = \frac{7}{2}$.'
  - 'Paso 4: Resolver la segunda ecuación lineal: $3x = -4 \implies x_2 = -\frac{4}{3}$.'
  - 'Paso 5: Escribir el conjunto solución: $\mathcal{S} = \left\{ -\frac{4}{3}, \frac{7}{2} \right\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las soluciones de la ecuación $(x - 9)(x + 2) = 0$?
  choices:
  - text: x = 9 y x = -2
    is_correct: true
  - text: x = -9 y x = 2
    is_correct: false
  - text: x = 9 y x = 2
    is_correct: false
  - text: Solo x = 9
    is_correct: false
  explanation: 'La alternativa correcta es ''x = 9 y x = -2''. Igualando cada factor a cero: $x - 9 = 0 \implies x = 9$ y $x + 2 = 0 \implies x = -2$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si se tiene $(x - 1)(x - 4) = 10$, ¿se puede concluir que $x - 1 = 10$ o $x - 4 = 10$?
  choices:
  - text: No, porque la propiedad del producto cero solo es valida si el miembro derecho es igual a 0.
    is_correct: true
  - text: Si, la propiedad funciona para cualquier numero.
    is_correct: false
  - text: Si, pero solo para x positivo.
    is_correct: false
  - text: Solo si se divide entre 10.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque la propiedad del producto cero solo es valida si el miembro derecho es igual a 0.'. Primero se debe desarrollar e igualar a 0.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asegurarse de que la ecuación esté completamente igualada a cero.'
- 'Paso 2: Identificar los factores lineales del producto.'
- 'Paso 3: Igualar cada factor individual a cero generando dos ecuaciones lineales.'
- 'Paso 4: Despejar la variable en cada una de las ecuaciones lineales para obtener las raíces.'
- 'Paso 5: Expresar el conjunto solución reuniendo todas las raíces encontradas.'
errores_correccion: '- **Error común:** Intentar aplicar la propiedad cuando el producto no está igualado a cero (ej: $(x-2)(x-3) = 6 \implies x-2=6$).

  - **Cómo corregirlo:** Si no está igualado a cero, **debes multiplicar los binomios, restar la constante e igualar a 0** antes de volver a factorizar.'
ejemplos:
- titulo: 'Ejemplo 1: Binomios lineales directos'
  enunciado: Resuelve $(x - 6)(x - 1) = 0$.
  alternativas:
  - x = 6 y x = 1
  - x = -6 y x = -1
  - x = 6 y x = -1
  - Solo x = 6
  respuesta: x = 6 y x = 1
  solucion_pasos:
  - 'Paso 1: $x - 6 = 0 \implies x = 6$.'
  - 'Paso 2: $x - 1 = 0 \implies x = 1$.'
- titulo: 'Ejemplo 2: Factor monomio con binomio'
  enunciado: Resuelve $4x(2x + 9) = 0$.
  alternativas:
  - x = 0 y x = -9/2
  - x = 4 y x = -9/2
  - x = 0 y x = 9/2
  - Solo x = -9/2
  respuesta: x = 0 y x = -9/2
  solucion_pasos:
  - 'Paso 1: $4x = 0 \implies x = 0$.'
  - 'Paso 2: $2x + 9 = 0 \implies x = -9/2$.'
- titulo: 'Ejemplo 3: Raíz doble'
  enunciado: Resuelve $(x - 5)^2 = 0$.
  alternativas:
  - x = 5 (raíz doble)
  - x = 5 y x = -5
  - x = 25
  - Sin solución
  respuesta: x = 5 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $(x - 5)(x - 5) = 0 \implies x_1 = x_2 = 5$.'
- titulo: 'Ejemplo 4: Coeficientes fraccionarios en factores'
  enunciado: Resuelve $\left(x - \frac{1}{3}\right)\left(x + \frac{4}{5}\right) = 0$.
  alternativas:
  - x = 1/3 y x = -4/5
  - x = -1/3 y x = 4/5
  - x = 1/3 y x = 4/5
  - x = 3 y x = -5/4
  respuesta: x = 1/3 y x = -4/5
  solucion_pasos:
  - 'Paso 1: $x = 1/3 \lor x = -4/5$.'
errores_frecuentes:
- Aplicar el principio del producto nulo con constantes distintas de 0.
- Olvidar invertir el signo de la constante al despejar x - c = 0.
- Omitir el factor monomio cuando x está multiplicando afuera.
afirmaciones_verdaderas:
- Un producto de factores reales es cero si y solo si al menos uno de los factores es cero.
- La propiedad del producto cero solo es aplicable si el miembro opuesto es estrictamente igual a cero.
al_terminar_debes_poder: '**QUÉ:** Aplicar con rigor la propiedad del producto cero para resolver ecuaciones algebraicas factorizadas.


  **CÓMO:** Desacoplando la expresión en factores lineales independientes igualados a cero y despejando sus raíces.


