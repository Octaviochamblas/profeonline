semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.PROPIEDAD_CERO
resumen_inicial: La propiedad del producto igual a cero establece que si $A \cdot B = 0$, entonces al menos uno de los factores debe ser cero ($A = 0 \lor B = 0$).
explicacion_simple: |
  La **propiedad del producto igual a cero** es el principio fundamental para resolver ecuaciones por factorización:

  - Si multiplicas dos factores y el resultado final es cero ($A \cdot B = 0$), la única posibilidad matemática es que el primer factor valga $0$ ($A = 0$), o que el segundo factor valga $0$ ($B = 0$).
  - **Ejemplo**: Si tienes $(x - 3)(x + 5) = 0$:
    - Primer caso: $x - 3 = 0 \implies x_1 = 3$.
    - Segundo caso: $x + 5 = 0 \implies x_2 = -5$.
  - ¡Importante! Esta propiedad **SOLO FUNCIONA SI EL PRODUCTO ESTÁ IGUALADO A CERO**. Si $(x - 3)(x + 5) = 12$, NO puedes decir que $x - 3 = 12$ o $x + 5 = 12$.
explicacion_formal: |
  Sea $\mathbb{R}$ el cuerpo de los números reales. La **propiedad de dominancia del cero en la multiplicación** (Teorema del Factor Cero) establece la equivalencia lógica:

  $$\forall A, B \in \mathbb{R}: \ A \cdot B = 0 \iff (A = 0 \ \lor \ B = 0)$$

  **Aplicación al Álgebra:**
  Dada una ecuación polinómica cuadrática descompuesta en dos factores lineales $(px + q)(rx + s) = 0$, el conjunto solución $S$ se obtiene resolviendo la disyunción de las dos ecuaciones lineales de primer grado independientes:

  $$px + q = 0 \quad \lor \quad rx + s = 0 \implies S = \left\{-\frac{q}{p}, -\frac{s}{r}\right\}$$
definiciones_clave: |
  - **Propiedad del producto igual a cero**: Teorema algebraico que postula que la multiplicación de dos o más expresiones da cero si y solo si al menos una de ellas es nula.
propiedades_relaciones: |
  - **Requisito de igualación a cero**: Para aplicar esta propiedad, es indispensable que la expresión descompuesta en factores se encuentre estrictamente igualada al elemento neutro aditivo ($0$).
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática factorizada $(2x - 6)(3x + 15) = 0$ aplicando la propiedad del producto cero.'
  pasos:
    - 'Paso 1: Aplicar el Teorema del Factor Cero: $(2x - 6) = 0 \ \lor \ (3x + 15) = 0$.'
    - 'Paso 2: Resolver la primera ecuación lineal: $2x = 6 \implies x_1 = 3$.'
    - 'Paso 3: Resolver la segunda ecuación lineal: $3x = -15 \implies x_2 = -5$.'
    - 'Paso 4: Escribir el conjunto solución final: $S = \{-5, 3\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué establece formalmente la propiedad del producto igual a cero para la expresión $A \cdot B = 0$?'
    choices:
      - {text: 'Que al menos uno de los factores debe ser cero ($A = 0 \lor B = 0$).', is_correct: true}
      - {text: 'Que ambos factores deben ser necesariamente mayores que 1.', is_correct: false}
      - {text: 'Que la suma de los factores $A + B$ debe ser igual a cero.', is_correct: false}
      - {text: 'Que el resultado de la constante es $A \cdot B = 1$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que al menos uno de los factores debe ser cero ($A = 0 \lor B = 0$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones reales de la ecuación factorizada $(x + 4)(x - 7) = 0$?'
    choices:
      - {text: '$x_1 = -4$ y $x_2 = 7$', is_correct: true}
      - {text: '$x_1 = 4$ y $x_2 = -7$', is_correct: false}
      - {text: '$x_1 = 0$ y $x_2 = 28$', is_correct: false}
      - {text: '$x_1 = -4$ y $x_2 = -7$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = -4$ y $x_2 = 7$''. Al igualar $x+4=0 \implies x=-4$ y $x-7=0 \implies x=7$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Asegurarse de que la ecuación se encuentre factorizada e igualada estrictamente a cero.'
  - 'Paso 2: Igualar de forma independiente cada uno de los factores lineales al número cero.'
  - 'Paso 3: Resolver las dos ecuaciones de primer grado resultantes para despejar los valores de la incógnita.'
  - 'Paso 4: Formar el conjunto solución $S = \{x_1, x_2\}$ reuniendo las soluciones encontradas.'
errores_correccion: |
  - **Error común:** Aplicar la propiedad cuando el producto está igualado a un número distinto de cero (ej. de $(x-1)(x-2)=6$ decir $x-1=6$ o $x-2=6$).
  - **Cómo corregirlo:** Si la ecuación no está igualada a cero, **DESARROLLA LOS PRODUCTOS E IGUALA A CERO PRIMERO** antes de factorizar.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Factores sencillos.
    alternativas:
      - '$S = \{-2, 5\}$'
      - '$S = \{2, -5\}$'
      - '$S = \{0, 10\}$'
    respuesta: '$S = \{-2, 5\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Factores con coeficiente.
    alternativas:
      - '$S = \{-3, 1/2\}$'
      - '$S = \{3, -1/2\}$'
      - '$S = \{0\}$'
    respuesta: '$S = \{-3, 1/2\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la expresión $(x - 3)(x - 4) = 10$, es correcto deducir que $x - 3 = 10$ o $x - 4 = 10$.'
  - 'Para satisfacer $A \cdot B = 0$, es indispensable que ambos factores $A$ y $B$ sean ceros de manera simultánea.'
  - 'La igualdad $(x + 5)(x - 2) = 0$ implica que las soluciones son $x_1 = 5$ y $x_2 = -2$ manteniendo los signos dentro de los paréntesis.'
  - 'La propiedad del producto cero permite simplificar la variable $x$ dividiendo ambos lados de la ecuación entre el factor $(x - a)$.'
  - 'La ponderación por cero a ambos lados de una igualdad preserva el conjunto de soluciones de la ecuación original.'
afirmaciones_verdaderas:
  - 'La propiedad del producto igual a cero exige que la expresión descompuesta en factores se encuentre igualada a cero ($A \cdot B = 0 \iff A = 0 \lor B = 0$).'
  - 'Igualar a cero cada factor lineal por separado permite convertir una ecuación cuadrática en dos ecuaciones sencillas de primer grado.'
al_terminar_debes_poder: |
  QUÉ: Comprender y aplicar la propiedad del producto cero para resolver ecuaciones cuadráticas factorizadas.
  CÓMO: Verificar que el producto esté igualado a cero, separar los factores en dos ecuaciones lineales y despejar las raíces.
