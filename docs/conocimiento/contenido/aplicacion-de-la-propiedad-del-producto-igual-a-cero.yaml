semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.PROPIEDAD_CERO
resumen_inicial: 'Aplicación de la propiedad del producto igual a cero: concepto,
  discriminante, soluciones y modelamiento en Resolución por factorización.'
explicacion_simple: Cuando dos números se multiplican y el resultado es cero, al menos
  uno de ellos tiene que ser cero; esa idea tan simple es la base de todo el método
  de resolución por factorización.
explicacion_formal: '### Definición formal


  Si $p, q \in \mathbb{R}$ y $p \cdot q=0$, entonces necesariamente $p=0$ o $q=0$.
  Aplicada a una ecuación cuadrática factorizada como $(x-r_1)(x-r_2)=0$, esta propiedad
  permite concluir que $x-r_1=0$ o $x-r_2=0$, obteniendo las soluciones $x=r_1$ y
  $x=r_2$.


  ### Desarrollo didáctico


  Esta propiedad solo es válida cuando la ecuación está igualada a cero y expresada
  como un producto de factores; no funciona si el producto está igualado a cualquier
  otro número.


  Para $(x-3)(x+5)=0$: por la propiedad del producto nulo, $x-3=0$ o $x+5=0$, dando
  $x=3$ o $x=-5$.'
definiciones_clave: '- **Aplicación de la propiedad del producto igual a cero**: Elemento
  o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en aplicación
  de la propiedad del producto igual a cero.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando aplicación de la
    propiedad del producto igual a cero.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a aplicación de la propiedad
    del producto igual a cero.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
