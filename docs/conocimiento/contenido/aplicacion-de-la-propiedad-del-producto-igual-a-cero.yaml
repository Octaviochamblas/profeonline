semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.PROPIEDAD_CERO
resumen_inicial: La propiedad del producto nulo establece que si el producto de dos
  factores es cero ($A \cdot B = 0$), al menos uno de ellos debe ser cero ($A = 0$
  o $B = 0$).
explicacion_simple: 'La **propiedad del producto nulo** es la herramienta clave para
  resolver ecuaciones factorizadas:

  - Si multiplicas dos expresiones y la respuesta da cero, la única forma es que la
  primera sea cero O que la segunda sea cero.

  - Si $(x - 3)(x + 5) = 0 \implies x - 3 = 0$ o $x + 5 = 0$.

  - De ahí obtenemos las dos soluciones directamente: $x_1 = 3$ y $x_2 = -5$.'
explicacion_formal: 'En todo cuerpo algebraico o dominio de integridad $\mathbb{R}$,
  la **propiedad del producto nulo** se enuncia axiomáticamente como:


  $$A \cdot B = 0 \iff A = 0 \quad \lor \quad B = 0$$


  **Desglose de la fórmula:**

  - Disyunción lógica de ecuaciones lineales simples obtenidas al igualar cada factor
  individual a cero.'
definiciones_clave: '- **Propiedad del producto nulo**: Regla algebraica que permite
  descomponer una ecuación cuadrática factorizada en dos ecuaciones lineales independientes.'
propiedades_relaciones: '- **Exclusividad del cero**: Esta propiedad funciona ÚNICAMENTE
  cuando el producto está igualado exactamente a cero ($A \cdot B = 0$). No aplica
  si está igualado a otro número.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación cuadrática factorizada $(2x - 7)(x + 4) = 0$ aplicando
    la propiedad del producto nulo.
  pasos:
  - 'Paso 1: Aplicar la propiedad del producto nulo separando en dos factores: $2x
    - 7 = 0$ o $x + 4 = 0$.Paso 2: Despejar la primera ecuación lineal: $2x = 7 \implies
    x_1 = \frac{7}{2}$.Paso 3: Despejar la segunda ecuación lineal: $x + 4 = 0 \implies
    x_2 = -4$.Paso 4: Concluir que el conjunto solución es $S = \{-4, \frac{7}{2}\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la propiedad del producto nulo a la ecuación $(2x - 7)(x +
    4) = 0$, ¿cuáles son las dos soluciones obtenidas?
  choices:
  - text: $x_1 = \frac{7}{2}$ y $x_2 = -4$
    is_correct: true
  - text: $x_1 = -\frac{7}{2}$ y $x_2 = 4$
    is_correct: false
  - text: $x_1 = 7$ y $x_2 = -4$
    is_correct: false
  - text: $x_1 = 2$ y $x_2 = 7$
    is_correct: false
  explanation: La alternativa correcta es '$x_1 = \frac{7}{2}$ y $x_2 = -4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué NO es correcto aplicar la disyunción separada en una expresión
    como $(x - 3)(x + 5) = 12$?
  choices:
  - text: Porque la propiedad exige obligatoriamente que el miembro derecho sea igual
      a CERO ($0$).
    is_correct: true
  - text: Porque 12 es un número par.
    is_correct: false
  - text: Porque hay dos variables x.
    is_correct: false
  - text: Porque las soluciones serían decimales.
    is_correct: false
  explanation: La alternativa correcta es 'Porque la propiedad exige obligatoriamente
    que el miembro derecho sea igual a CERO ($0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asegurar que la ecuación esté factorizada e igualada a cero.'
- 'Paso 2: Igualar cada factor individual a cero.'
- 'Paso 3: Resolver cada una de las ecuaciones de primer grado resultantes.'
- 'Paso 4: Escribir el conjunto solución $S = \{x_1, x_2\}$.'
errores_correccion: '- **Error común:** Intentar igualar factores a un número distinto
  de cero (ej: si $(x-1)(x-2)=6$, decir $x-1=6$ o $x-2=6$).

  - **Cómo corregirlo:** La propiedad vale ÚNICAMENTE para el cero. Si está igualada
  a 6, debes multiplicar los factores, trasponer el 6, re-igualar a cero y volver
  a factorizar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución por factorización.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La propiedad del producto nulo exige que A * B = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, exige que el miembro derecho sea exactamente cero.
- titulo: ¿Toda ecuación incompleta ax^2 + bx = 0 admite la solución x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, al factorizar x(ax + b) = 0 se obtiene siempre x_1 = 0.
errores_frecuentes:
- Intentar aplicar la propiedad del producto nulo a una ecuación igualada a un número
  distinto de cero.
- Dividir una ecuación cuadrática entre la incógnita $x$ perdiendo la solución fundamental
  $x = 0$.
- Olvidar anteponer el doble signo $\pm$ al extraer raíz cuadrada en la resolución
  de $x^2 = k$.
- Confundir los números de los factores $(x+m)(x+n)$ con las soluciones reales de
  la ecuación (que tienen signos invertidos).
- Violar la jerarquía de operaciones al verificar raíces calculando multiplicaciones
  antes que potencias.
afirmaciones_verdaderas:
- La propiedad del producto nulo establece que $A \cdot B = 0 \iff A = 0 \lor B =
  0$.
- Toda ecuación incompleta binomia $a x^2 + b x = 0$ se resuelve por factor común
  $x(a x + b) = 0$ produciendo siempre la raíz $x = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones cuadráticas
  completas e incompletas mediante factorización de monomio común, trinomios simples,
  trinomios generales y verificación de raíces.
