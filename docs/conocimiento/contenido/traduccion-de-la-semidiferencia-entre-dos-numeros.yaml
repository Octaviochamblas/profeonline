semantic_id: MAT.ALG.LENGUAJE_RELACIONES.SEMIDIFERENCIA_NUMEROS
resumen_inicial: 'Traducción de la semidiferencia entre dos números: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: El prefijo 'semi' en matemáticas y en español significa 'la mitad
  de'. Si entiendes lo que es una diferencia (resta), entonces la semidiferencia es
  simplemente cortarla por la mitad.
explicacion_formal: '### Definición formal


  El prefijo semi- afecta a la totalidad de la palabra que acompaña. Semidiferencia
  = (diferencia) / 2.


  ### Desarrollo didáctico


  Anatomía de la expresión:

  - Diferencia: $x - y$

  - Semi (mitad): Dividido por 2.

  - Semidiferencia: $\frac{x - y}{2}$


  Al igual que en toda resta, el orden es ley. ''La semidiferencia entre $m$ y $n$''
  obliga a que $m$ sea el minuendo (positivo) y $n$ el sustraendo (negativo): $\frac{m
  - n}{2}$.'
definiciones_clave: '- **Traducción de la semidiferencia entre dos números**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de la semidiferencia entre dos números.'
