semantic_id: MAT.ALG.LENGUAJE_RELACIONES.SEMIDIFERENCIA_NUMEROS
resumen_inicial: La traducción de la semidiferencia entre dos números consiste en representar simbólicamente la resta de dos expresiones dividida por dos $\frac{a - b}{2}$, respetando el orden estricto entre minuendo y sustraendo.
explicacion_simple: "La **semidiferencia entre dos números** es la **mitad de su diferencia (resta)**:\n- Frases verbales: *\"La semidiferencia entre $A$ y $B$\"*, *\"La mitad de la resta de $A$ menos $B$\"*.\n- Traducción: **$\\frac{A - B}{2}$** (o $\\frac{1}{2}(A - B)$).\n- **¡Atención al orden!** Al ser una resta, **LA SEMIDIFERENCIA NO ES CONMUTATIVA**:\n  - \"La semidiferencia entre $A$ y $B$\" $\\implies \\mathbf{\\frac{A - B}{2}}$ ($A$ va primero en la resta).\n  - \"La semidiferencia entre $B$ y $A$\" $\\implies \\mathbf{\\frac{B - A}{2}}$ (da el resultado opuesto).\n- Ejemplo: La semidiferencia entre $10$ y $4 \\implies \\frac{10 - 4}{2} = \\frac{6}{2} = 3$.\n\n![Semidiferencia entre Dos Números](/static/img/nodos/traduccion-de-la-semidiferencia-entre-dos-numeros-intro.svg)\n"
explicacion_formal: '### Definición formal

  La **semidiferencia** es un operador funcional $\operatorname{semi}^-: \mathbb{R} \times \mathbb{R} \to \mathbb{R}$ que asigna a un par ordenado de expresiones $(A, B)$ la mitad de su diferencia no conmutativa:


  $$\operatorname{semi}^-(A, B) = \frac{A - B}{2} = \frac{1}{2}(A - B)$$


  donde $A$ representa el minuendo y $B$ representa el sustraendo.


  ### Propiedad de Inversión de Signo por No Conmutatividad

  Dado que la resta en $\mathbb{R}$ satisface $B - A = -(A - B)$, alterar el orden de los términos en una semidiferencia invierte su signo:


  $$\operatorname{semi}^-(B, A) = \frac{B - A}{2} = -\left(\frac{A - B}{2}\right) = -\operatorname{semi}^-(A, B)$$


  ### Reconstrucción de Números a partir de Semisuma y Semidiferencia

  Si denotamos la semisuma como $S = \frac{A + B}{2}$ y la semidiferencia como $D = \frac{A - B}{2}$, los números originales $A$ y $B$ se pueden reconstruir directamente mediante:


  $$A = S + D \quad \text{y} \quad B = S - D$$


  ### Síntesis didáctica

  La semidiferencia se utiliza en física para hallar amplitudes de onda, desvíos medios y en sistemas de ecuaciones donde se conocen la suma y la resta de dos números.

  '
definiciones_clave: '- **Semidiferencia ($\frac{A-B}{2}$)**: Expresión algebraica que representa la mitad de la resta del minuendo $A$ menos el sustraendo $B$.

  - **Minuendo inicial ($A$)**: Primera cantidad mencionada en la frase que va antes del signo menos.

  - **Sustraendo descontado ($B$)**: Segunda cantidad mencionada que se descuenta en el numerador.

  '
propiedades_relaciones: '- **Relación con el módulo de la distancia**: Si $A > B$, la semidiferencia $\frac{A - B}{2}$ representa el semiancho o radio del intervalo $[B, A]$.

  - **Reconstrucción del mayor**: El número mayor $A$ es igual a la semisuma más la semidiferencia ($A = S + D$).

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "La semidiferencia entre el triple de $x$ y ocho".'
  pasos:
  - 'Paso 1: Identificamos el minuendo (1.er término): "El triple de $x$" ($3x$).'
  - 'Paso 2: Identificamos el sustraendo (2.º término): "Ocho" ($8$).'
  - 'Paso 3: Formamos la diferencia en el numerador: $(3x - 8)$.'
  - 'Paso 4: Aplicamos la semidiferencia dividiendo toda la resta entre 2: $\frac{3x - 8}{2}$.'
  - 'Conclusión: La expresión traducida es **$\frac{3x - 8}{2}$** (o $\frac{3}{2}x - 4$).'
  imagen: /static/img/nodos/traduccion-de-la-semidiferencia-entre-dos-numeros-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué notación algebraica representa la semidiferencia entre una cantidad $A$ y una cantidad $B$?
  choices:
  - text: 'Se representa como la resta dividida entre dos: $\frac{A - B}{2}$ (o $\frac{1}{2}(A - B)$)'
    is_correct: true
  - text: 'Se representa como la suma dividida entre dos: $\frac{A + B}{2}$'
    is_correct: false
  - text: 'Se representa multiplicando la resta por dos: $2(A - B)$'
    is_correct: false
  - text: Se representa como el cociente directo $\frac{A}{B}$
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa como la resta dividida entre dos: $\frac{A - B}{2}$ (o $\frac{1}{2}(A - B)$)''. Definición de semidiferencia.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si conocemos que la semisuma de dos números es $S = 15$ y su semidiferencia es $D = 3$, ¿cuál es el valor del número mayor $A$?
  choices:
  - text: El número mayor es $A = S + D = 15 + 3 = 18$
    is_correct: true
  - text: El número mayor es $A = S - D = 15 - 3 = 12$
    is_correct: false
  - text: El número mayor es $A = S \cdot D = 45$
    is_correct: false
  - text: El número mayor es $A = \frac{15}{3} = 5$
    is_correct: false
  explanation: La alternativa correcta es 'El número mayor es $A = S + D = 15 + 3 = 18$'. Reconstrucción $A = S + D$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el minuendo (1.ª cantidad nombrada) y el sustraendo (2.ª cantidad nombrada).'
- 'Paso 2: Escribir la resta `Minuendo - Sustraendo` en el numerador de una fracción.'
- 'Paso 3: Colocar el número $2$ en el denominador de la fracción ($\frac{A - B}{2}$).'
- 'Paso 4: Si se puede simplificar, dividir cada término del numerador por 2.'
errores_correccion: '- **Error 1:** Invertir la resta escribiendo $\frac{B - A}{2}$ para "la semidiferencia entre $A$ y $B$". **Cómo corregirlo:** El primer término mencionado $A$ **va ANTES del signo menos ($\frac{A - B}{2}$)**.

  - **Error 2:** Usar el signo más de la semisuma en lugar del signo menos de la semidiferencia. **Cómo corregirlo:** La semidiferencia **exige el operador de resta en el numerador ($\frac{A - B}{2}$)**.

  '
ejemplos:
- titulo: Semidiferencia básica
  enunciado: ¿Cuál es la traducción de "La semidiferencia entre $p$ y $q$"?
  alternativas:
  - $\frac{p - q}{2}$
  - $\frac{q - p}{2}$
  - $\frac{p + q}{2}$
  respuesta: $\frac{p - q}{2}$
  solucion_pasos:
  - '1. Minuendo: $p$. Sustraendo: $q$.'
  - '2. Semidiferencia: $\frac{p - q}{2}$.'
- titulo: Semidiferencia de números
  enunciado: ¿Cuál es la semidiferencia entre 20 y 8?
  alternativas:
  - '6'
  - '14'
  - '12'
  respuesta: '6'
  solucion_pasos:
  - '1. Resta: $20 - 8 = 12$.'
  - '2. Semidiferencia: $\frac{12}{2} = 6$.'
- titulo: Inversión de signo
  enunciado: Al cambiar el orden de $\frac{a - b}{2}$ por $\frac{b - a}{2}$, ¿se obtiene el valor opuesto?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{b - a}{2} = -\left(\frac{a - b}{2}\right)$.
- titulo: Simplificación
  enunciado: La semidiferencia entre $4x$ y $10$, ¿se simplifica como $2x - 5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{4x - 10}{2} = \frac{4x}{2} - \frac{10}{2} = 2x - 5$.
errores_frecuentes:
- Invertir la resta en el numerador escribiendo (B - A)/2 al traducir la semidiferencia entre A y B.
- Utilizar un signo de suma en lugar de una resta al traducir la semidiferencia.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Multiplicar la diferencia por dos en lugar de dividirla entre dos.
- Declarar que la semidiferencia entre dos números es una operación conmutativa.
afirmaciones_verdaderas:
- La semidiferencia entre dos cantidades se representa algebraicamente como la resta del minuendo menos el sustraendo dividida por dos.
- El número mayor de un par de datos equivale a la suma de su semisuma más su semidiferencia (A = S + D).
al_terminar_debes_poder: '![Resumen de semidiferencia](/static/img/nodos/traduccion-de-la-semidiferencia-entre-dos-numeros-resumen.svg)


  QUÉ: Traducir la semidiferencia entre dos cantidades respetando el orden del minuendo.


  CÓMO: Restar el sustraendo del minuendo y dividir la expresión resultante por 2: $\frac{a - b}{2}$.'
