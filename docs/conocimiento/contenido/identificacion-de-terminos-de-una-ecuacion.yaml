semantic_id: MAT.ALG.ECUACION_BASE.TERMINOS_ECUACION
resumen_inicial: Los términos de una ecuación son los sumandos individuales que componen cada uno de sus miembros, separados
  por signos de suma o resta.
explicacion_simple: 'Mientras que los miembros son las dos grandes expresiones a cada lado del signo igual, los **términos**
  son las piezas algebraicas o numéricas individuales que componen cada miembro.


  Se identifican fácilmente porque están separados entre sí por los signos de adición ($+$) o sustracción ($-$).


  Los términos pueden clasificarse en términos algebraicos (aquellos que contienen a la incógnita, como $3x$) y términos independientes
  constantes (que consisten únicamente en números, como $-4$).


  ![Identificación de términos de una ecuación](/static/img/nodos/identificacion-de-terminos-de-una-ecuacion-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la ecuación en forma expandida $a_1 x + a_0 = b_1 x + b_0$, los **términos de la ecuación** son las expresiones atómicas
  $t_i$ vinculadas mediante adición o sustracción:


  $$\text{Términos algebraicos con incógnita: } a_1 x, \quad b_1 x$$


  $$\text{Términos independientes constantes: } a_0, \quad b_0$$


  ### Desglose de la fórmula

  - Cada término incluye rigurosamente su propio signo operativo antecedente ($+$ o $-$).


  ### Síntesis didáctica

  La transposición de términos consiste en trasladar un término entero de un miembro a otro sumando o restando su opuesto
  aditivo.

  '
definiciones_clave: '- **Término de una ecuación**: Cada expresión monomia o cantidad separada por signos $+$ o $-$ dentro
  de un miembro.

  - **Término independiente**: Término estrictamente numérico que no contiene a la variable o incógnita.

  '
propiedades_relaciones: '- **Signo integral**: El signo positivo o negativo que precede a un término forma parte inseparable
  de su valor algebraico.

  - **Reducción intrínseca**: Los términos semejantes dentro de un mismo miembro pueden agruparse antes de transponer.

  '
ejemplo_guiado:
  enunciado: En la ecuación $7x - 4 = 2x + 11$, lista todos sus términos, clasifícalos en términos con incógnita e independientes
    y evalúa la suma del primer miembro para $x = 3$.
  pasos:
  - 'Paso 1: Identificar los términos del primer miembro: $7x$ y $-4$.'
  - 'Paso 2: Identificar los términos del segundo miembro: $2x$ y $+11$.'
  - 'Paso 3: Clasificar: términos con incógnita $\{7x, 2x\}$; términos independientes $\{-4, 11\}$.'
  - 'Paso 4: Evaluar el primer miembro en $x = 3$: $7(3) - 4 = 21 - 4 = 17$.'
  imagen: /static/img/nodos/identificacion-de-terminos-de-una-ecuacion-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
