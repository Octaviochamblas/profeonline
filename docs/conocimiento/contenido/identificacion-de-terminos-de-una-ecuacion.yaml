semantic_id: MAT.ALG.ECUACION_BASE.TERMINOS_ECUACION
resumen_inicial: Los términos de una ecuación son los sumandos individuales que componen
  cada uno de sus miembros, separados por signos de suma o resta.
explicacion_simple: 'Mientras que los miembros son las dos grandes mitades de la ecuación,
  los **términos** son los bloques o piezas más pequeñas que forman cada miembro.

  Están separados entre sí por signos de suma ($+$) o resta ($-$).

  Los términos pueden ser algebraicos (con incógnita, como $3x$) o independientes
  (puros números, como $7$).'
explicacion_formal: 'Dada la ecuación $a_1 x + a_0 = b_1 x + b_0$, los **términos
  de la ecuación** son las expresiones individuales $t_i$ vinculadas por adición o
  sustracción:


  $$\text{Términos algebraicos con incógnita: } a_1 x, \quad b_1 x$$

  $$\text{Términos independientes constantes: } a_0, \quad b_0$$


  **Desglose de la fórmula:**

  - Cada término conserva su propio signo procedente de la operación que lo antecede.'
definiciones_clave: '- **Término de una ecuación**: Cada una de las cantidades o expresiones
  separadas por signos $+$ o $-$ dentro de los miembros.

  - **Término independiente**: Término numérico que no contiene la incógnita.'
propiedades_relaciones: '- **Transposición de términos**: Un término completo puede
  pasar de un miembro al otro cambiando su operación al opuesto aditivo.'
ejemplo_guiado:
  enunciado: En la ecuación $7x - 4 = 2x + 11$, lista todos sus términos, clasifícalos
    en términos con incógnita e independientes y evalúa su suma total en el primer
    miembro para $x = 3$.
  pasos:
  - 'Paso 1: Identificar los términos del primer miembro: $7x$ y $-4$.Paso 2: Identificar
    los términos del segundo miembro: $2x$ y $+11$.Paso 3: Clasificar: Términos con
    incógnita $\{7x, 2x\}$; términos independientes $\{-4, 11\}$.Paso 4: Evaluar el
    primer miembro en $x = 3$: $7(3) - 4 = 21 - 4 = 17$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación $7x - 4 = 2x + 11$, ¿cuáles son los términos independientes?
  choices:
  - text: $-4$ y $11$
    is_correct: true
  - text: $7x$ y $2x$
    is_correct: false
  - text: $4$ y $-11$
    is_correct: false
  - text: Solo el número $11$
    is_correct: false
  explanation: La alternativa correcta es '$-4$ y $11$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar los términos del primer miembro $7x - 4$ para $x = 3$, ¿cuál
    es el resultado?
  choices:
  - text: $17$
    is_correct: true
  - text: $21$
    is_correct: false
  - text: $25$
    is_correct: false
  - text: $11$
    is_correct: false
  explanation: La alternativa correcta es '$17$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Separar la ecuación en su primer y segundo miembro.'
- 'Paso 2: Identificar en cada miembro las expresiones divididas por los signos $+$
  o $-$.'
- 'Paso 3: Incluir el signo correspondiente delante de cada término.'
- 'Paso 4: Distinguir los términos con incógnita de los independientes.'
errores_correccion: '- **Error común:** Olvidar incluir el signo negativo de un término
  (decir que el término es $4$ en lugar de $-4$).

  - **Cómo corregirlo:** El signo delante de un término FORMA PARTE INTEGRAL del término.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
