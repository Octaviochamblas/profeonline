  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Separar la ecuación en su primer y segundo miembro tomando como referencia el signo $=$.'
- 'Paso 2: Identificar los sumandos divididos por los signos $+$ o $-$ en cada miembro.'
- 'Paso 3: Incluir el signo antecedente como parte del término (ejemplo: en $5 - 2x$, el término es $-2x$).'
- 'Paso 4: Clasificar cada término como término con incógnita o término independiente constante.'
errores_correccion: '- **Error 1:** Omitir el signo negativo del término (decir que el término es $4$ cuando la expresión
  contiene $-4$). **Cómo corregirlo:** El signo antecedente **FORMA PARTE INTEGRAL DEL TÉRMINO Y DEBE CONSERVARSE SIEMPRE**.

  - **Error 2:** Descomponer un término monomio multiplicativo como $7x$ separando el coeficiente $7$ de la variable $x$.
  **Cómo corregirlo:** Las multiplicaciones y divisiones **FORMAN UN ÚNICO TÉRMINO COMPUESTO ($7x$ ES UN SOLO TÉRMINO)**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos términos en total componen la ecuación $3x - 5 + y = 2x + 9$?
  alternativas:
  - $5$ términos
  - $2$ términos
  - $4$ términos
  respuesta: $5$ términos
  solucion_pasos:
  - '1. Primer miembro: $3x$, $-5$, $+y$ (3 términos).'
  - '2. Segundo miembro: $2x$, $+9$ (2 términos).'
  - '3. Total: 5 términos.'
- titulo: Ejemplo 2
  enunciado: En la ecuación $6 - 2x = 10$, ¿cuál es el término con incógnita del primer miembro?
  alternativas:
  - $-2x$
  - $2x$
  - $6$
  respuesta: $-2x$
  solucion_pasos:
  - '1. Primer miembro: $6 - 2x$.'
  - 2. El sumando con la variable conserva su signo negativo $\implies -2x$.
- titulo: Presencia del signo
  enunciado: ¿En la expresión $x - 9 = 0$, el término independiente del primer miembro es $-9$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo negativo pertenece al término numérico constante.
- titulo: Término monomio
  enunciado: ¿La expresión $\frac{x}{3}$ constituye un único término algebraico?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cociente entre una variable y una constante representa un solo término.
errores_frecuentes:
- Omitir el signo negativo antecedente de un término (decir que el término es $4$ cuando la expresión contiene $-4$).
- Descomponer un término monomio como $7x$ separando el coeficiente $7$ de la variable $x$ como dos términos distintos.
- Omitir los términos independientes constantes del listado oficial de términos de la ecuación.
- Asumir que una ecuación lineal posee de forma obligatoria exactamente dos términos en total.
- Considerar al signo igual como un separador de términos dentro de un mismo miembro.
afirmaciones_verdaderas:
- Los términos de una ecuación son los sumandos individuales separados por adiciones o sustracciones en cada miembro.
- El signo positivo o negativo que antecede a un término forma parte inseparable de su valor algebraico.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/identificacion-de-terminos-de-una-ecuacion-resumen.svg)


  QUÉ: Identificar y clasificar los términos de cualquier ecuación de primer grado.

  CÓMO: Reconocer los separadores de adición/sustracción, conservar el signo antecedente de cada sumando ($t_k$) y distinguir
  términos con incógnita e independientes.

  '
