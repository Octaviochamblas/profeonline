procedimiento:
- 'Paso 1: Observa toda la ecuación.'
- 'Paso 2: Haz una marca imaginaria justo antes de cada signo $+$ o $-$.'
- 'Paso 3: Cada bloque que queda es un término.'
- 'Paso 4: Recuerda que el primer término de un miembro, si es positivo, tiene un
  $+$ invisible.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en identificación de términos de una ecuación.
ejemplos:
- titulo: Analiza los términos de $-2x + 8 - y = 14$
  enunciado: Analiza los términos de $-2x + 8 - y = 14$.
  solucion_pasos:
  - Cortes antes de +, -, =.
  - 'Término 1: $-2x$'
  - 'Término 2: $+8$'
  - 'Término 3: $-y$'
  - 'Término 4 (en el otro miembro): $14$ (o $+14$).'
  - 'Total: 4 términos.'
- titulo: ¿Cuántos términos hay en la ecuación $5x = 20$?
  solucion_pasos:
  - El '5x' es un solo término porque la multiplicación los une. El '20' es el otro.
- titulo: 'Respecto de «Identificación de términos de una ecuación»: ¿Es correcta
    esta caracterización?'
  enunciado: 'Respecto de «Identificación de términos de una ecuación»: ¿Es correcta
    esta caracterización? «Los términos son las partes individuales de una ecuación
    o expresión que están separadas entre sí por los signos de suma ($+$) o resta
    ($-$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Los términos son las partes
    individuales de una ecuación o expresión que están separadas entre sí por los
    signos de suma ($+$) o resta ($-$).'
- titulo: 'Respecto de «Identificación de términos de una ecuación»: ¿Es válida esta
    afirmación? «Separ'
  enunciado: 'Respecto de «Identificación de términos de una ecuación»: ¿Es válida
    esta afirmación? «Separar términos por multiplicaciones (ej. decir que $3x$ son
    dos términos, el 3 y la x. ¡Falso, la multiplicación los pega!)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Los términos son las partes
    individuales de una ecuación o expresión que están separadas entre sí por los
    signos de suma ($+$) o resta ($-$).'
errores_frecuentes:
- Separar términos por multiplicaciones (ej. decir que $3x$ son dos términos, el 3
  y la x. ¡Falso, la multiplicación los pega!).
- Olvidar incluir el signo negativo al identificar el término.
- Los signos de multiplicación ($\cdot$) y división ($\div$).
- Únicamente el signo de igualdad ($=$).
- Los paréntesis y corchetes.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando identificación
  de términos de una ecuación.
