semantic_id: MAT.ALG.ECUACION_BASE.TERMINOS_ECUACION
resumen_inicial: 'Identificación de términos de una ecuación: propiedades, resolución
  y modelamiento en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: Si el Miembro es el 'país' dentro de la ecuación, los 'Términos'
  son las ciudades individuales. Son las piezas de LEGO con las que está construida
  la igualdad.
explicacion_formal: '### Definición formal


  Los sumandos y restandos conforman los términos algebraicos individuales.


  ### Desarrollo didáctico


  Veamos la ecuación: $3x - 5 = x + 7$


  Esta ecuación tiene dos Miembros, pero ¿cuántos Términos tiene?

  Cortamos la ecuación donde haya un $+$ o un $-$ que no esté dentro de un paréntesis.

  - En el primer miembro ($3x - 5$), hay dos términos: el $3x$ y el $-5$.

  - En el segundo miembro ($x + 7$), hay dos términos: la $x$ y el $+7$.


  En total, esta ecuación tiene 4 términos. Cada término viaja con su signo a la izquierda.
  El signo es el ''apellido'' del término; no se lo puedes quitar.


  Tipos de términos:

  - **Término con incógnita:** Tiene letras (ej. $3x$).

  - **Término independiente:** Es un número puro sin letras (ej. $-5$ o $7$).'
definiciones_clave: '- **Identificación de términos de una ecuación**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a identificación de términos de una ecuación.'
