semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_DOS_PUNTOS
resumen_inicial: Determinar la fórmula de una función afín desde dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ consiste en calcular primero la pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ y aplicar la forma punto-pendiente $y - y_1 = m(x - x_1)$.
explicacion_simple: '![Determinar la fórmula de una función afín desde dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ consiste en calcular primero la pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ y aplicar la forma punto-pendiente $y - y_1 = m(x - x_1)$](/static/img/nodos/determinacion-de-la-formula-de-una-funcion-afin-desde-dos-puntos-intro.svg)



  Si conoces dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ por donde pasa una recta afín:

  1. **Calculas la pendiente:** $m = \frac{y_2 - y_1}{x_2 - x_1}$.

  2. **Usas la fórmula punto-pendiente:** $y - y_1 = m(x - x_1)$ (o sustituyes un punto en $y = mx + n$ para despejar $n$).

  3. **Despejas la $y$:** Dejas la ecuación en la forma $f(x) = mx + n$.'
explicacion_formal: 'Dados dos puntos distintos $P_1(x_1, y_1), P_2(x_2, y_2) \in \mathbb{R}^2$ con $x_1 \neq x_2$:

  1. **Pendiente unívoca**: $m = \frac{y_2 - y_1}{x_2 - x_1}$.

  2. **Ecuación continua de la recta**:

  $$y - y_1 = m(x - x_1) \Longleftrightarrow y = mx + (y_1 - mx_1)$$

  3. **Coeficiente de posición deducido**: $n = y_1 - mx_1 = y_2 - mx_2$.

  4. **Fórmula funcional canónica**: $f(x) = mx + n$.'
definiciones_clave: '- **Forma punto-pendiente**: $y - y_1 = m(x - x_1)$, estructura algebraica para construir la ecuación a partir de un punto y la pendiente.

  - **Determinación euclidiana**: Principio geométrico que asegura que por dos puntos pasa una única recta.'
propiedades_relaciones: '- **Independencia del punto de anclaje**: Usar $P_1$ o $P_2$ en la fórmula punto-pendiente entrega exactamente la misma ecuación final.

  - **Prueba de pertenencia**: Ambos puntos satisfacen la igualdad $f(x_k) = y_k$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Determinar la fórmula de una función afín desde dos puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ consiste en calcular primero la pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ y aplicar la forma punto-pendiente $y - y_1 = m(x - x_1)$](/static/img/nodos/determinacion-de-la-formula-de-una-funcion-afin-desde-dos-puntos-ejemplos.svg)



    Determina la fórmula de la función afín que pasa por los puntos $P_1(2, 5)$ y $P_2(6, 13)$.'
  pasos:
  - 'Paso 1: Calcular la pendiente: $m = \frac{13 - 5}{6 - 2} = \frac{8}{4} = 2$.'
  - 'Paso 2: Aplicar la forma punto-pendiente con $P_1(2, 5)$: $y - 5 = 2(x - 2)$.'
  - 'Paso 3: Distribuir el producto: $y - 5 = 2x - 4$.'
  - 'Paso 4: Despejar $y$: $y = 2x - 4 + 5 = 2x + 1$.'
  - 'Paso 5: Comprobar con $P_2(6, 13)$: $f(6) = 2(6) + 1 = 12 + 1 = 13$ (correcto).'
  - 'Paso 6: Concluir que la fórmula es $f(x) = 2x + 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula de la función afín que pasa por $(1, 4)$ y $(3, 10)$?
  choices:
  - text: f(x) = 3x + 1
    is_correct: true
  - text: f(x) = 3x + 4
    is_correct: false
  - text: f(x) = 2x + 2
    is_correct: false
  - text: f(x) = 3x - 1
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 3x + 1'. $m = \frac{10 - 4}{3 - 1} = \frac{6}{2} = 3$. Luego $y - 4 = 3(x - 1) \implies y = 3x + 1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Una recta afín pasa por $(-1, 8)$ y $(2, -1)$. ¿Cuál es su pendiente y su coeficiente de posición?
  choices:
  - text: m = -3, n = 5
    is_correct: true
  - text: m = 3, n = 5
    is_correct: false
  - text: m = -3, n = -5
    is_correct: false
  - text: m = -1/3, n = 8
    is_correct: false
  explanation: 'La alternativa correcta es ''m = -3, n = 5''. $m = \frac{-1 - 8}{2 - (-1)} = \frac{-9}{3} = -3$. Con $(-1, 8)$: $8 = -3(-1) + n \implies 8 = 3 + n \implies n = 5$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$.'
- 'Paso 2: Elegir uno de los dos puntos dados (por ejemplo $P_1(x_1, y_1)$).'
- 'Paso 3: Plantear la ecuación punto-pendiente $y - y_1 = m(x - x_1)$.'
- 'Paso 4: Distribuir el producto y despejar $y$ para obtener la forma $f(x) = mx + n$.'
errores_correccion: '- **Error común:** Mezclar las coordenadas al aplicar la forma punto-pendiente (ej: usar $x_1$ con $y_2$).

  - **Cómo corregirlo:** Elige **un solo punto** y usa sus dos coordenadas juntas ($x_1$ con $y_1$); no mezcles con el otro punto.'
ejemplos:
- titulo: 'Ejemplo 1: Puntos con coordenadas positivas'
  enunciado: Halla la función que pasa por $(2, 7)$ y $(5, 16)$.
  alternativas:
  - f(x) = 3x + 1
  - f(x) = 3x + 7
  - f(x) = 2x + 3
  - f(x) = 3x - 1
  respuesta: f(x) = 3x + 1
  solucion_pasos:
  - 'Paso 1: $m = \frac{16 - 7}{5 - 2} = \frac{9}{3} = 3$.'
  - 'Paso 2: $y - 7 = 3(x - 2) \implies y = 3x - 6 + 7 = 3x + 1$.'
- titulo: 'Ejemplo 2: Puntos con coordenadas negativas'
  enunciado: Calcula la función afín que pasa por $(-2, 9)$ y $(1, -3)$.
  alternativas:
  - f(x) = -4x + 1
  - f(x) = -4x + 9
  - f(x) = 4x + 1
  - f(x) = -4x - 3
  respuesta: f(x) = -4x + 1
  solucion_pasos:
  - 'Paso 1: $m = \frac{-3 - 9}{1 - (-2)} = \frac{-12}{3} = -4$.'
  - 'Paso 2: $y - (-3) = -4(x - 1) \implies y + 3 = -4x + 4 \implies y = -4x + 1$.'
- titulo: 'Ejemplo 3: Pendiente fraccionaria'
  enunciado: Determina la función que une $(1, 2)$ y $(4, 3)$.
  alternativas:
  - f(x) = (1/3)x + 5/3
  - f(x) = (1/3)x + 2
  - f(x) = 3x - 1
  - f(x) = (1/3)x + 1
  respuesta: f(x) = (1/3)x + 5/3
  solucion_pasos:
  - 'Paso 1: $m = \frac{3 - 2}{4 - 1} = \frac{1}{3}$.'
  - 'Paso 2: $y - 2 = \frac{1}{3}(x - 1) \implies y = \frac{1}{3}x - \frac{1}{3} + 2 = \frac{1}{3}x + \frac{5}{3}$.'
- titulo: 'Ejemplo 4: Paso por corte con eje'
  enunciado: Halla la función que pasa por $(0, -6)$ y $(3, 0)$.
  alternativas:
  - f(x) = 2x - 6
  - f(x) = -2x - 6
  - f(x) = 2x + 6
  - f(x) = 3x - 6
  respuesta: f(x) = 2x - 6
  solucion_pasos:
  - 'Paso 1: $n = -6$.'
  - 'Paso 2: $m = \frac{0 - (-6)}{3 - 0} = \frac{6}{3} = 2 \implies f(x) = 2x - 6$.'
errores_frecuentes:
- Mezclar las coordenadas x de un punto con la y del otro en la ecuación punto-pendiente.
- Equivocarse en la distributiva con números negativos.
- Calcular mal la pendiente por errores de signo en el denominador.
afirmaciones_verdaderas:
- La fórmula de la función afín a partir de dos puntos se obtiene calculando m = (y2 - y1)/(x2 - x1) y usando y - y1 = m(x - x1).
- Cualquiera de los dos puntos produce exactamente la misma ecuación final al despejar y.
al_terminar_debes_poder: '**QUÉ:** Determinar la fórmula de una función afín a partir de dos puntos conocidos.


  **CÓMO:** Calculando la pendiente m y aplicando la forma punto-pendiente y - y1 = m(x - x1) para despejar la regla canónica f(x) = mx + n.


