errores_frecuentes:
  - 'La pendiente entre $(x_1, y_1)$ y $(x_2, y_2)$ se calcula dividiendo la suma de coordenadas entre 2.'
  - 'Para hallar la fórmula de una función afín dados dos puntos basta con multiplicar las coordenadas $x_1 \cdot y_1$.'
  - 'El coeficiente de posición $b$ es siempre igual a la pendiente $m$ en cualquier función afín.'
  - 'Reemplazar las coordenadas de $P_2$ en lugar de $P_1$ entrega un coeficiente de posición $b$ totalmente diferente.'
  - 'Dos puntos con la misma abscisa $x_1 = x_2$ determinan una función afín con pendiente nula.'
afirmaciones_verdaderas:
  - 'Dado un par de puntos $(x_1, y_1)$ y $(x_2, y_2)$, la pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ permite determinar unívocamente la ecuación de la recta $y = mx + b$.'
  - 'El valor de $b$ obtenido es independiente de cuál de los dos puntos dados se elija para evaluar la ecuación $b = y - mx$.'
al_terminar_debes_poder: |
  QUÉ: Determinar la ecuación algebraica de una función afín conocidos dos puntos de su gráfica.
  CÓMO: Calcular $m = \frac{y_2 - y_1}{x_2 - x_1}$, reemplazar un punto para despejar $b$ y escribir la regla $f(x) = mx + b$.
