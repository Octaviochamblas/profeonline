semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_DOS_PUNTOS
resumen_inicial: Hallar la fórmula de una función afín dados dos puntos consiste en calcular primero la pendiente $m$ y luego despejar el coeficiente de posición $b$.
explicacion_simple: |
  Si conoces dos puntos $(x_1, y_1)$ y $(x_2, y_2)$ por donde pasa la recta:

  1. Calculas la pendiente: $m = \frac{y_2 - y_1}{x_2 - x_1}$.
  2. Sustituyes $m$ y uno de los puntos (por ejemplo $x_1, y_1$) en la fórmula $y = mx + b$.
  3. Despejas $b$ de la ecuación resultante.
  4. Escribes la fórmula final $f(x) = mx + b$.
explicacion_formal: |
  Sean $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ dos puntos distintos de la recta afín $f(x) = mx + b$ con $x_1 \neq x_2$.

  **Procedimiento analítico:**
  1. **Pendiente**: $m = \frac{y_2 - y_1}{x_2 - x_1}$
  2. **Ecuación punto-pendiente**: $y - y_1 = m(x - x_1)$
  3. **Forma explícita**: $y = mx + (y_1 - m x_1) \implies b = y_1 - m x_1$
definiciones_clave: |
  - **Ecuación punto-pendiente**: Forma algebraica $y - y_1 = m(x - x_1)$ utilizada para construir la función afín conocidos un punto y la pendiente.
propiedades_relaciones: |
  - **Unicidad de la recta**: Dados dos puntos distintos en el plano con $x_1 \neq x_2$, existe una única función afín que pasa por ambos.
ejemplo_guiado:
  enunciado: "Encuentra la fórmula de la función afín que pasa por los puntos $P_1(1, 4)$ y $P_2(3, 10)$."
  pasos:
    - 'Paso 1: Calcular la pendiente: $m = \frac{10 - 4}{3 - 1} = \frac{6}{2} = 3$.'
    - 'Paso 2: Reemplazar $m = 3$ y $P_1(1, 4)$ en $y = mx + b$: $4 = 3(1) + b$.'
    - 'Paso 3: Despejar $b$: $4 = 3 + b \implies b = 4 - 3 = 1$.'
    - 'Paso 4: Escribir la fórmula final de la función afín: $f(x) = 3x + 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la fórmula de la función afín que pasa por los puntos $P_1(1, 4)$ y $P_2(3, 10)$?"
    choices:
      - {text: "$f(x) = 3x + 1$", is_correct: true}
      - {text: "$f(x) = 6x - 2$", is_correct: false}
      - {text: "$f(x) = 2x + 2$", is_correct: false}
      - {text: "$f(x) = 3x + 4$", is_correct: false}
    explanation: "La alternativa correcta es '$f(x) = 3x + 1$'. $m = \\frac{10 - 4}{3 - 1} = 3$, luego $4 = 3(1) + b \\implies b = 1$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si una recta afín pasa por $(0, 5)$ y $(2, 9)$, ¿cuál es el valor de $b$ de forma directa?"
    choices:
      - {text: "$b = 5$", is_correct: true}
      - {text: "$b = 9$", is_correct: false}
      - {text: "$b = 2$", is_correct: false}
      - {text: "$b = 4$", is_correct: false}
    explanation: "La alternativa correcta es '$b = 5$'. El punto $(0, 5)$ entrega directamente el coeficiente de posición $b = 5$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular la pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$.'
  - 'Paso 2: Sustituir $m$ y las coordenadas de cualquiera de los puntos en $y = mx + b$.'
  - 'Paso 3: Resolver la ecuación lineal de una variable para encontrar $b$.'
  - 'Paso 4: Redactar la expresión funcional explícita $f(x) = mx + b$.'
errores_correccion: |
  - **Error común:** Calcular $m$ correctamente pero olvidar hallar $b$, concluyendo erróneamente que la función es $f(x) = mx$.
  - **Cómo corregirlo:** Recuerda que la función afín requiere **AMBOS** parámetros: la pendiente $m$ Y el coeficiente de posición $b$.
