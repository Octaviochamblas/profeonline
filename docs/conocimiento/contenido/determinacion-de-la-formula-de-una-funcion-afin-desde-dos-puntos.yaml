semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_DOS_PUNTOS
resumen_inicial: 'Determinación de la fórmula de una función afín desde dos puntos:
  conceptos, representación y propiedades en Función afín.'
explicacion_simple: Aunque no veas el dibujo de la recta, dos puntos cualesquiera
  bastan para reconstruir exactamente su fórmula completa.
explicacion_formal: '### Definición formal


  Dados dos puntos $(x_1,y_1)$ y $(x_2,y_2)$ con $x_1 \neq x_2$, la pendiente es $m
  = \dfrac{y_2-y_1}{x_2-x_1}$. Sustituyendo $m$ y uno de los puntos, por ejemplo $(x_1,y_1)$,
  en $y_1 = mx_1+n$, se despeja $n = y_1 - mx_1$, completando la fórmula $f(x)=mx+n$.


  ### Desarrollo didáctico


  El proceso tiene dos etapas: primero calcular la pendiente con la fórmula de dos
  puntos, y luego usar cualquiera de los dos puntos originales para despejar el coeficiente
  de posición.


  Con $(1,5)$ y $(3,13)$: $m = \frac{13-5}{3-1} = 4$. Sustituyendo en $(1,5)$: $5
  = 4(1)+n \Rightarrow n=1$. La fórmula es $f(x)=4x+1$.'
definiciones_clave: '- **Determinación de la fórmula de una función afín desde dos
  puntos**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación de la fórmula de una función
  afín desde dos puntos.'
