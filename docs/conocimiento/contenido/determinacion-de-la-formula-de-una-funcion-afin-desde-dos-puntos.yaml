semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_DOS_PUNTOS
resumen_inicial: Dados dos puntos cualesquiera $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$,
  se calcula $m = \frac{y_2-y_1}{x_2-x_1}$ y luego $n = y_1 - m x_1$.
explicacion_simple: "Para hallar la fórmula de una función afín que pasa por dos puntos\
  \ dados $A(1, 5)$ y $B(3, 11)$:\n1. Calculamos la pendiente: $m = \\frac{11 - 5}{3\
  \ - 1} = \\frac{6}{2} = 3$.\n2. Reemplazamos $m = 3$ y el primer punto $A(1, 5)$\
  \ en la ecuación punto-pendiente $y - y_1 = m(x - x_1)$:\n   $y - 5 = 3(x - 1) \\\
  implies y - 5 = 3x - 3 \\implies y = 3x + 2$.\n3. La función es $f(x) = 3x + 2$."
explicacion_formal: 'Dados los puntos $P_1(x_1, y_1)$ y $P_2(x_2, y_2)$ con $x_1 \neq
  x_2$, la **forma punto-pendiente** y posterior reducción canónica es:


  $$y - y_1 = \left(\frac{y_2 - y_1}{x_2 - x_1}\right)(x - x_1) \implies f(x) = m
  x + (y_1 - m x_1)$$


  **Desglose de la fórmula:**

  - Determinación analítica completa de la función afín por el postulado de unicidad
  de la recta que pasa por dos puntos en el plano.'
definiciones_clave: '- **Forma punto-pendiente**: Ecuación $y - y_1 = m(x - x_1)$
  utilizada para deducir la función a partir de un punto y la pendiente.'
propiedades_relaciones: '- **Unicidad de la recta**: Por dos puntos distintos del
  plano pasa una y solo una recta no vertical.'
ejemplo_guiado:
  enunciado: Determina la fórmula de la función afín $f(x)$ cuya gráfica pasa por
    los puntos $P_1(-1, 2)$ y $P_2(2, 11)$.
  pasos:
  - 'Paso 1: Calcular la pendiente: $m = \frac{11 - 2}{2 - (-1)} = \frac{9}{3} = 3$.'
  - 'Paso 2: Usar el punto $(2, 11)$ en la ecuación $y = m x + n$: $11 = 3(2) + n$.'
  - 'Paso 3: Resolver para $n$: $11 = 6 + n \implies n = 11 - 6 = 5$.'
  - 'Paso 4: Escribir la fórmula final: $f(x) = 3x + 5$.'
  - 'Paso 5: Comprobar con el otro punto: $f(-1) = 3(-1) + 5 = -3 + 5 = 2$ (VERIFICADO).'
checkpoints:
- placement: after_explicacion_formal
  question: A partir de los puntos $(-1, 2)$ y $(2, 11)$, ¿cuál es la fórmula de la
    función afín $f(x)$?
  choices:
  - text: $f(x) = 3x + 5$
    is_correct: true
  - text: $f(x) = 3x - 5$
    is_correct: false
  - text: $f(x) = 5x + 3$
    is_correct: false
  - text: $f(x) = 9x + 2$
    is_correct: false
  explanation: La alternativa correcta es '$f(x) = 3x + 5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué método permite verificar que la fórmula obtenida $f(x) = 3x + 5$
    es correcta?
  choices:
  - text: Evaluar los puntos dados en la fórmula y comprobar que satisfacen la igualdad.
    is_correct: true
  - text: Sumar los números de los puntos.
    is_correct: false
  - text: Multiplicar las abscisas.
    is_correct: false
  - text: Dividir entre cero.
    is_correct: false
  explanation: La alternativa correcta es 'Evaluar los puntos dados en la fórmula
    y comprobar que satisfacen la igualdad.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular $m = \frac{y_2 - y_1}{x_2 - x_1}$.'
- 'Paso 2: Sustituir $m$ y un punto $(x_1, y_1)$ en la ecuación $y_1 = m x_1 + n$.'
- 'Paso 3: Despejar el coeficiente de posición $n = y_1 - m x_1$.'
- 'Paso 4: Escribir la función $f(x) = m x + n$ y verificar con el segundo punto.'
errores_correccion: '- **Error común:** Cometer un error de signo al restar números
  negativos en el cálculo de la pendiente.

  - **Cómo corregirlo:** Escribe SIEMPRE las restas con paréntesis explícitos: $x_2
  - x_1 = 2 - (-1) = 3$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
