  explanation: 'La correcta es: Identificar correctamente la relación de interés simple. Fundamento
    conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de cálculo del tiempo en interés simple, ¿qué
