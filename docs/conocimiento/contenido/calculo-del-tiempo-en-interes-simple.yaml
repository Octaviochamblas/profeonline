  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcula el interés generado ($I = Monto - Capital$).'
- 'Paso 2: Transforma la tasa a decimal.'
- 'Paso 3: Divide el interés por $(Capital \cdot tasa)$.'
- 'Paso 4: Interpreta el resultado numérico en la unidad de tiempo correspondiente a la tasa.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del tiempo
  en interés simple.
ejemplos:
- titulo: Duplicando el dinero
  enunciado: Si invierto a una tasa del 5% simple anual, ¿cuántos años debo esperar para duplicar
    mi capital?
  solucion_pasos:
  - Duplicar capital significa que el Monto $M = 2C$.
  - 'Por ende, el interés ganado debe ser igual al capital: $I = C$.'
  - $t = I / (C \cdot i) \rightarrow t = C / (C \cdot 0.05)$.
  - 'Las C se cancelan: $t = 1 / 0.05 = 20$. Debes esperar 20 años.'
- titulo: Ejemplo 2
  enunciado: Con capital 6.000, tasa 0,03 anual, e interés generado de 900 pesos, ¿cuántos
    años pasaron?
  alternativas:
  - '5'
  - '3'
  - '15'
  respuesta: '5'
  solucion_pasos:
  - 900 dividido entre (6.000 por 0,03) es igual a 900 dividido entre 180, o sea 5.
- titulo: Ejemplo 3
  enunciado: ¿Cuántos años se necesitan para triplicar un capital a una tasa simple del 10%
    anual?
  alternativas:
  - '20'
  - '10'
  - '30'
  respuesta: '20'
  solucion_pasos:
  - 'Para triplicar, el interés debe ser 2 veces el capital: t igual a 2 dividido entre 0,10,
    o sea 20.'
- titulo: ¿Si la tasa usada es mensual, el tiempo resultante también estará expresado en meses?
  respuesta: Sí
  solucion_pasos:
  - El tiempo siempre hereda la unidad de la tasa aplicada en la fórmula.
errores_frecuentes:
- Olvidar revisar si la tasa era mensual o anual, respondiendo 'meses' cuando la matemática
  indicaba 'años'.
- Poner el Capital en el numerador de la división.
- Olvidar revisar si la tasa era mensual o anual, respondiendo en la unidad incorrecta.
- Poner el Capital en el numerador de la división en vez del interés generado.
- No convertir un resultado decimal, como 2,5 años, a su equivalente en meses cuando el problema
  lo requiere.
afirmaciones_verdaderas:
- La propiedad de cálculo del tiempo en interés simple preserva la consistencia lógica.
- El resultado del tiempo obtenido siempre hereda la unidad de la tasa de interés usada en
  la fórmula.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del tiempo en
  interés simple.
