semantic_id: MAT.NUM.INTERES_SIMPLE.TIEMPO_INVERSION
resumen_inicial: 'Cálculo del tiempo en interés simple: concepto y propiedades fundamentales
  en Interés simple.'
explicacion_simple: ¿Cuánto tendré que esperar para que mis ahorros se dupliquen?
  El tiempo es oro, literalmente. Aprende a calcular cuántos meses o años debe madurar
  una inversión.
explicacion_formal: "Despejamos el tiempo ($t$) de la fórmula de interés simple $I\
  \ = C \\cdot i \\cdot t$:\n\n$t = \\frac{I}{C \\cdot i}$\n\n- Igual que antes, si\
  \ te dan el Monto Final, primero debes restar el capital para hallar $I$.\n- El\
  \ tiempo que te dé como resultado **'hereda' el apellido de la tasa**. Si usaste\
  \ una tasa del $4\\%$ *trimestral*, el número final que obtengas será una cantidad\
  \ de *trimestres*. \n- Si el resultado da con decimales (ej. $2.5$ años), significa\
  \ que son $2$ años y medio (es decir, $2$ años y $6$ meses)."
definiciones_clave: '- **Cálculo del tiempo en interés simple**: Elemento central
  dentro del estudio de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
