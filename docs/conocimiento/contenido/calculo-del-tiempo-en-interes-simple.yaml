resumen_inicial: 'El cálculo del tiempo $t$ despeja la duración o plazo de la inversión
  en función del interés acumulado $I$, el capital $C$ y la tasa $i$: $t = \frac{I}{C
  \cdot i}$.'
explicacion_simple: Si sabemos cuánto depositamos, a qué porcentaje nos rinde el dinero
  y cuánto queríamos ganar de interés, podemos calcular exactamente cuántos meses
  o años debemos dejar la plata guardada.
explicacion_formal: 'Dado el interés generado $I$ (o monto final $M = C + I$), el
  **Tiempo de Inversión $t$** se obtiene mediante el despeje:


  $$t = \frac{I}{C \cdot i} = \frac{I}{C \cdot \left(\frac{r}{100}\right)}$$


  $$\text{Alternativamente con el monto } M: \quad t = \frac{M - C}{C \cdot i}$$'
definiciones_clave: '- **Tiempo de inversión $t$**: Plazo o número de períodos $t
  = \frac{I}{C \cdot i}$.'
propiedades_relaciones: '- **Unidad del resultado $t$**: El resultado $t$ adopta automáticamente
  el período de referencia de la tasa $i$.'
ejemplo_guiado:
  enunciado: ¿Cuántos años debe estar colocado un capital de \$200.000 al $8\%$ de
    interés simple anual para producir \$48.000 de interés?
  pasos:
  - 'Paso 1: Identificar $C = 200.000$, $I = 48.000$ e $i = 0,08$.'
  - 'Paso 2: Aplicar la fórmula $t = \frac{I}{C \cdot i} = \frac{48.000}{200.000 \cdot
    0,08}$.'
  - 'Paso 3: Resolver la multiplicación en el denominador: $200.000 \cdot 0,08 = 16.000$.'
  - 'Paso 4: Dividir: $t = \frac{48.000}{16.000} = 3$ años.'
  - 'Conclusión: El tiempo necesario es de $3$ años.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el tiempo de inversión t en régimen
    de interés simple?
  choices:
  - text: t = I / (C · i)
    is_correct: true
  - text: t = I · C · i
    is_correct: false
  - text: t = (C · i) / I
    is_correct: false
  - text: t = C / I
    is_correct: false
  explanation: La alternativa correcta es 't = I / (C · i)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $200.000 al 8% anual para ganar $48.000, ¿cuál
    fue el tiempo necesario?
  choices:
  - text: 3 años
    is_correct: true
  - text: 4 años
    is_correct: false
  - text: 2 años
    is_correct: false
  - text: 6 años
    is_correct: false
  explanation: La alternativa correcta es '3 años'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la duración o tiempo
  de inversión $t = \frac{I}{C \cdot i}$ en régimen de interés simple.
semantic_id: MAT.NUM.INTERES_SIMPLE.TIEMPO_INVERSION
procedimiento:
- 'Paso 1: Identificar los parámetros conocidos ($C, i, t, I, M$) e igualar las unidades
  de tiempo de la tasa y el plazo.'
- 'Paso 2: Sustituir en la fórmula fundamental del interés simple $I = C \cdot i \cdot
  t$ o del monto $M = C \cdot (1 + i \cdot t)$.'
- 'Paso 3: Despejar algebraicamente la variable buscada y comprobar el resultado numérico.'
errores_correccion: '- **Error 1: Ingresar el tiempo en meses cuando la tasa de interés
  es anual sin convertir unidades.** **Cómo corregirlo:** Se DEBE convertir el tiempo
  a años dividiendo entre 12 ($18\text{ meses} = 1,5\text{ años}$) o convertir la
  tasa anual a mensual dividiendo entre 12.


  - **Error 2: Sumar los intereses acumulados al capital inicial en cada período (tratarlo
  como interés compuesto).** **Cómo corregirlo:** En el interés simple el capital
  inicial $C$ permanece CONSTANTE en todos los períodos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_SIMPLE.TIEMPO_INVERSION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés simple.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización lineal.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por $M = C(1 + it)$.
- titulo: ¿Son idénticos los intereses ganados en cada período en el interés simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se calculan siempre sobre el mismo capital inicial $C$.
- titulo: ¿Debe coincidir la unidad de tiempo del plazo t con la unidad de la tasa
    de interés i?
  respuesta: Sí
  solucion_pasos:
  - Sí, para mantener la homogeneidad dimensional temporal.
errores_frecuentes:
- Ingresar el tiempo en meses manteniendo una tasa de interés expresada en términos
  anuales.
- Recapitalizar los intereses ganados al final de cada período sobre el capital inicial
  en régimen simple.
- Multiplicar por el número entero de la tasa de interés sin dividir previamente por
  cien.
- Declarar el valor del interés ganado $I$ con el monto final total acumulado $M$.
- Dividir el capital entre el tiempo sin incorporar la tasa de interés en el cálculo
  del saldo.
afirmaciones_verdaderas:
- El interés simple se caracteriza por generar ganancias periódicas constantes calculadas
  sobre el capital inicial $C$.
- El monto acumulado final en interés simple es una función lineal del tiempo $M =
  C \cdot (1 + i \cdot t)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
