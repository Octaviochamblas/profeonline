semantic_id: MAT.NUM.INTERES_SIMPLE.TIEMPO_INVERSION
resumen_inicial: 'El cálculo del tiempo $t$ en régimen de interés simple determina la duración de una inversión o préstamo despejando la variable temporal: $t = \frac{I}{C \cdot i} = \frac{M - C}{C \cdot i}$.'
explicacion_simple: |
  Si depositaste una suma de dinero $C$ a una tasa fija $i$ y quieres saber **cuánto tiempo (cuántos años o meses) debe estar guardada para ganar un interés determinado $I$**:
  1. Multiplicas el capital inicial por la tasa en decimal ($C \cdot i$). Ese resultado es la ganancia de 1 año (o 1 mes).
  2. Divides el interés total que deseas obtener $I$ entre esa ganancia de 1 período: $t = \frac{I}{C \cdot i}$.

  Por ejemplo, para ganar $\$30.000$ de interés con $\$100.000$ al $10\%$ anual ($i = 0,10$): la ganancia anual es $\$10.000$. Al dividir $\$30.000 \div $\$10.000$ = 3$ años.

  ![Cálculo del tiempo en interés simple](/static/img/nodos/calculo-del-tiempo-en-interes-simple-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **período de permanencia o tiempo de la inversión $t$** es la variable independiente que satisface el modelo lineal de interés simple:
  $$I = C \cdot i \cdot t \implies t = \frac{I}{C \cdot i} \quad (C > 0, i > 0)$$

  ### Despeje desde el Monto Final $M$
  Si la meta requerida es alcanzar un valor futuro $M$:
  $$M = C \cdot (1 + i \cdot t) \implies \frac{M}{C} - 1 = i \cdot t \implies t = \frac{M - C}{C \cdot i} = \frac{\frac{M}{C} - 1}{i}$$

  ### Interpretación de la Unidad Temporal
  La unidad de tiempo obtenida en $t$ **corresponde exactamente a la base temporal de la tasa $i$ utilizada**:
  - Si $i$ es una tasa **anual** $\implies t$ resultará en **años**.
  - Si $i$ es una tasa **mensual** $\implies t$ resultará en **meses**.

  ### Síntesis didáctica
  - Ecuación del tiempo por interés: $t = \frac{I}{C \cdot i}$.
  - Ecuación del tiempo por monto: $t = \frac{M - C}{C \cdot i}$.
definiciones_clave: |
  - **Plazo de la operación ($t$)**: Duración o intervalo de tiempo en que el capital permanece depositado o prestado.
  - **Rendimiento por período ($C \cdot i$)**: Cantidad de dinero fija generada por el capital en un solo período.
  - **Homogeneidad de unidad temporal**: Principio según el cual la unidad de la respuesta $t$ hereda la periodicidad de la tasa $i$.
propiedades_relaciones: |
  - **Inversión con la tasa de interés**: Para un objetivo de ganancia $I$ y un capital $C$ dados, a mayor tasa de interés $i$, menor tiempo $t$ se requiere para lograr el monto.
  - **Linealidad directa con la meta de ganancia**: Duplicar la meta de interés deseada $I$ manteniendo el capital y la tasa duplica el tiempo de permanencia requerido.
ejemplo_guiado:
  enunciado: '¿Cuántos años debe estar depositado un capital de $\$500.000$ a una tasa de interés simple anual del $8\%$ para acumular $\$120.000$ de interés?'
  imagen: '/static/img/nodos/calculo-del-tiempo-en-interes-simple-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: Interés $I = 120.000$, Capital $C = 500.000$, Tasa anual $r = 8\% \implies i = 0,08$.'
    - 'Paso 2: Calculamos el rendimiento de 1 año: $C \cdot i = 500.000 \cdot 0,08 = 40.000$.'
    - 'Paso 3: Dividimos el interés total acumulado entre la ganancia anual: $t = \frac{120.000}{40.000} = 3$.'
    - 'Paso 4: Conclusión: El tiempo necesario es de **$3$ años**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para despejar el tiempo $t$ en una operación a interés simple?'
    choices:
      - {text: 'Dividir el interés ganado entre el producto del capital por la tasa decimal ($t = \frac{I}{C \cdot i}$)', is_correct: true}
      - {text: 'Multiplicar el interés por el capital y la tasa ($t = I \cdot C \cdot i$)', is_correct: false}
      - {text: 'Restar el capital al interés acumulado', is_correct: false}
      - {text: 'Dividir la tasa entre el capital inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir el interés ganado entre el producto del capital por la tasa decimal ($t = \frac{I}{C \cdot i}$)''. Despeja $t$ en la ecuación lineal $I = C \cdot i \cdot t$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si inviertes $\$200.000$ al $5\%$ anual de interés simple, ¿en cuántos años ganarás $\$20.000$ de interés?'
    choices:
      - {text: 'En $2$ años, pues la ganancia anual es $\$10.000$ ($200.000 \cdot 0,05$), y $20.000 / 10.000 = 2$', is_correct: true}
      - {text: 'En $4$ años, dividiendo por 5.000', is_correct: false}
      - {text: 'En $1$ año, tomando el interés simple directo', is_correct: false}
      - {text: 'En $10$ años, multiplicando $2 \cdot 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''En $2$ años, pues la ganancia anual es $\$10.000$ ($200.000 \cdot 0,05$), y $20.000 / 10.000 = 2$''. El tiempo resulta en $t = 2\text{ años}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el interés deseado $I$ (o calcularlo como $M - C$), el capital $C$ y la tasa periódica $i$.'
  - 'Paso 2: Convertir la tasa porcentual a decimal ($i = r / 100$).'
  - 'Paso 3: Calcular el producto $C \cdot i$ en el denominador (rendimiento de 1 período).'
  - 'Paso 4: Dividir el interés $I$ entre dicho producto para obtener $t = \frac{I}{C \cdot i}$ en las unidades de la tasa.'
errores_correccion: |
  - **Error 1:** Interpretar el resultado $t$ en meses cuando la tasa $i$ utilizada era una tasa anual. **Cómo corregirlo:** La unidad de tiempo obtenida en $t$ es la **MISMA que la de la tasa de interés** (si la tasa es anual, $t$ son años).
  - **Error 2:** Multiplicar el interés por el capital en lugar de dividir (ej: $t = I \cdot C / i$). **Cómo corregirlo:** La variable $t$ se aísla **dividiendo el interés entre el producto $C \cdot i$**: $t = \frac{I}{C \cdot i}$.
ejemplos:
  - titulo: 'Cálculo de tiempo en años'
    enunciado: 'Si $I = $\$40.00$0$, $C = $\$100.00$0$ e $i = 0,10$ anual, ¿cuántos años estuvo depositado el dinero?'
    alternativas:
      - '$4$ años'
      - '$2$ años'
      - '$40$ meses'
    respuesta: '$4$ años'
    solucion_pasos:
      - '1. Rendimiento anual: $C \cdot i = 100.000 \cdot 0,10 = $\$10.00$0$.'
      - '2. Tiempo: $t = 40.000 / 10.000 = 4\text{ años}$.'
  - titulo: 'Tiempo para duplicar el capital'
    enunciado: 'A una tasa del $10\%$ anual de interés simple ($0,10$), ¿cuántos años se requieren para duplicar el capital ($I = C$)?'
    alternativas:
      - '$10$ años'
      - '$5$ años'
      - '$20$ años'
    respuesta: '$10$ años'
    solucion_pasos:
      - '1. Igualamos $I = C$ en la fórmula: $t = C / (C \cdot 0,10) = 1 / 0,10 = 10\text{ años}$.'
  - titulo: 'Cálculo de tiempo dado el monto final'
    enunciado: 'Si $C = $\$50.00$0$, $M = $\$65.00$0$ y la tasa es $10\%$ anual ($0,10$), ¿cuál es el tiempo de inversión?'
    alternativas:
      - '$3$ años'
      - '$5$ años'
      - '$1,5$ años'
    respuesta: '$3$ años'
    solucion_pasos:
      - '1. Interés devengado: $I = 65.000 - 50.000 = $\$15.00$0$.'
      - '2. $t = 15.000 / (50.000 \cdot 0,10) = 15.000 / 5.000 = 3\text{ años}$.'
  - titulo: 'Conversión de resultado de años a meses'
    enunciado: 'Si el cálculo de $t$ entrega $0,5$ años con tasa anual, ¿a cuántos meses equivale?'
    alternativas:
      - '$6$ meses'
      - '$5$ meses'
      - '$12$ meses'
    respuesta: '$6$ meses'
    solucion_pasos:
      - '1. Multiplicamos la fracción de año por 12 meses: $0,5 \cdot 12 = 6\text{ meses}$.'
errores_frecuentes:
  - 'El número decimal obtenido en la variable $t$ representa meses de manera automática cuando la tasa aplicada es anual.'
  - 'El tiempo de inversión se despeja multiplicando el interés por el capital inicial ($t = \frac{I \cdot C}{i}$).'
  - 'La tasa de interés se ingresa como porcentaje entero en el denominador de la fórmula del tiempo sin convertir a decimal.'
  - 'El valor del monto final $M$ se ubica en el numerador de la fórmula del tiempo en lugar del interés devengado $I$.'
  - 'El tiempo necesario para duplicar un capital a interés simple disminuye a la mitad si la tasa de interés se reduce a la mitad.'
afirmaciones_verdaderas:
  - 'El tiempo de una inversión a interés simple se calcula dividiendo el interés acumulado entre el producto del capital y la tasa decimal ($t = \frac{I}{C \cdot i}$).'
  - 'La unidad temporal de la respuesta $t$ coincide siempre con el período de la tasa de interés empleada.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/calculo-del-tiempo-en-interes-simple-resumen.svg)

  QUÉ: Determinar el tiempo de permanencia o plazo $t$ de una inversión o crédito a interés simple.
  CÓMO: Resolver la razón $t = \frac{I}{C \cdot i} = \frac{M - C}{C \cdot i}$, interpretando adecuadamente la base temporal heredada de la tasa aplicada (años, meses o días).
