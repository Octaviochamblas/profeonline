semantic_id: MAT.GEO.ROTACION_PLANO.SENTIDO_ANTIHORARIO
resumen_inicial: 'Sentido antihorario de rotación asociado a ángulos positivos: conceptos,
  teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Cuando algo gira ''al revés de las manecillas del reloj'', en
  matemáticas se representa con un ángulo positivo: es el sentido convencional ''por
  defecto''.'
explicacion_formal: '![Sentido antihorario de rotación](/static/img/geometria/isometrias/rotacion-sentido-antihorario.svg)


  ### Definición formal


  Por convención matemática, una rotación en sentido antihorario se expresa con un
  ángulo $\theta>0$. Es el sentido de referencia estándar en matemáticas: cuando se
  habla de rotar ''θ grados'' sin especificar el sentido, se asume antihorario.


  ### Desarrollo didáctico


  En la figura, la flecha curva sigue la dirección contraria a las manecillas de un
  reloj, indicando una rotación en sentido antihorario, representada con un ángulo
  positivo (por ejemplo, $70°$).'
definiciones_clave: '- **Sentido antihorario de rotación asociado a ángulos positivos**:
