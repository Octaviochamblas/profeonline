  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si el valor $x = 0$ pertenece al dominio de la función dada.'
- 'Paso 2: Si la función es básica $f(x) = \log_b(x)$, concluir inmediatamente que no existe intercepto con el eje $Y$.'
- 'Paso 3: Si la función está trasladada $f(x) = \log_b(x - h)$, evaluar $f(0)$.'
- 'Paso 4: Si el argumento resultante es positivo, calcular $y = f(0)$ y escribir el punto $(0, y)$.'
errores_correccion: '- **Error común:** Afirmar que $\log_b(0) = 0$ y ubicar un corte en el origen $(0, 0)$.

  - **Cómo corregirlo:** $\log_b(0)$ **NO EXISTE en los números reales**; la gráfica básica **NUNCA cruza el eje $Y$**.'
ejemplos:
- titulo: 'Ejemplo 1: Función básica sin corte'
  enunciado: ¿Tiene corte con el eje Y la función $f(x) = \log_2(x)$?
  alternativas:
  - No tiene corte con el eje Y
  - Sí, en (0, 0)
  - Sí, en (0, 1)
  - Sí, en (0, 2)
  respuesta: No tiene corte con el eje Y
  solucion_pasos:
  - 'Paso 1: $0 \notin \operatorname{Dom}(f) \implies$ sin intercepto.'
- titulo: 'Ejemplo 2: Corte en función trasladada'
  enunciado: 'Calcula el corte con el eje Y de $g(x) = \log_4(x + 64)$:'
  alternativas:
  - (0, 3)
  - (0, 4)
  - (0, 64)
  - No existe
  respuesta: (0, 3)
  solucion_pasos:
  - 'Paso 1: $g(0) = \log_4(64) = 3 \implies (0, 3)$.'
- titulo: 'Ejemplo 3: Imposibilidad con traslación a la derecha'
  enunciado: ¿Tiene corte con el eje Y la función $h(x) = \ln(x - 2)$?
  alternativas:
  - No, porque x = 0 produce ln(-2) no real
  - Sí, en (0, -2)
  - Sí, en (0, 0)
  - Sí, en (0, 1)
  respuesta: No, porque x = 0 produce ln(-2) no real
  solucion_pasos:
  - 'Paso 1: $0 - 2 = -2 < 0 \implies$ no existe.'
- titulo: 'Ejemplo 4: Intercepto decimal en Y'
  enunciado: 'Calcula el corte con el eje Y de $f(x) = \log_{10}(x + 100) + 1$:'
  alternativas:
  - (0, 3)
  - (0, 2)
  - (0, 101)
  - (0, 1)
  respuesta: (0, 3)
  solucion_pasos:
  - 'Paso 1: $f(0) = \log(100) + 1 = 2 + 1 = 3 \implies (0, 3)$.'
errores_frecuentes:
- Asumir que toda curva en el plano cartesiano debe cortar ambos ejes coordenados.
- Confundir log_b(1) = 0 con un supuesto log_b(0) = 0.
- No evaluar el dominio antes de intentar calcular f(0).
afirmaciones_verdaderas:
- La función logarítmica básica jamás intersecta al eje Y porque x = 0 no pertenece a su dominio.
- Una función logarítmica trasladada corta al eje Y si y solo si su desplazamiento horizontal es hacia la izquierda (h < 0).
al_terminar_debes_poder: '**QUÉ:** Justificar la ausencia de intercepto con el eje Y en la función logarítmica básica.


  **CÓMO:** Demostrando que 0 ∉ Dom(log_b) debido a la positividad estricta de la función exponencial bʸ > 0.


