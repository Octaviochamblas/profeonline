semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.SIN_INTERCEPTO_Y
resumen_inicial: La justificación de la ausencia de intercepto con el eje $Y$ en la función logarítmica básica demuestra que $0 \notin \operatorname{Dom}(\log_b)$, dado que evaluar $f(0) = \log_b(0)$ exigiría resolver $b^y = 0$, lo cual es imposible porque las potencias de bases positivas son estrictamente mayores que cero ($b^y > 0$).
explicacion_simple: "![La justificación de la ausencia de intercepto con el eje $Y$ en la función logarítmica básica demuestra que $0 \\notin \\operatorname{Dom}(\\log_b)$, dado que evaluar $f(0) = \\log_b(0)$ exigiría resolver $b^y = 0$, lo cual es imposible porque las potencias de bases positivas son estrictamente mayores que cero ($b^y > 0$)](/static/img/nodos/justificacion-de-la-ausencia-de-intercepto-con-el-eje-y-en-la-funcion-logaritmica-basica-intro.svg)\n\n\n¿Por qué la función logarítmica básica $f(x) = \\log_b(x)$ **NUNCA cruza el eje vertical $Y$**?\n\n- **Demostración lógica simple:**\n  - Para cortar al eje $Y$, tendrías que evaluar la función en $x = 0$.\n  - Eso significa calcular $f(0) = \\log_b(0) = y$.\n  - Al pasarlo a potencia: **$b^y = 0$**.\n  - Pero piensa en cualquier base positiva: $2^1 = 2, 2^0 = 1, 2^{-10} = 0,00097...$\n  - **¡Una potencia de base positiva NUNCA PUEDE DAR CERO!**\n- **Conclusión geométrica:** El eje $Y$ es una asíntota vertical insuperable; la\
  \ curva se acerca mucho a él, pero **jamás lo toca ni lo cruza**."
explicacion_formal: 'Sea $f: \mathbb{R}^+ \to \mathbb{R}$ con $f(x) = \log_b(x)$ ($b \in \mathbb{R}^+ \setminus \{1\}$). La existencia de un intercepto con el eje de ordenadas requiere la pertenencia del origen de abscisas al dominio de la función:

  $$P_Y \in \operatorname{Gr}(f) \cap \{(0, y) \in \mathbb{R}^2\} \Longleftrightarrow 0 \in \operatorname{Dom}(f)$$

  Dado que $\operatorname{Dom}(f) = ]0, +\infty[$, se verifica axiomáticamente que:

  $$0 \notin ]0, +\infty[ \implies \operatorname{Gr}(f) \cap \text{Eje } Y = \emptyset$$


  **Condición para que una función trasladada sí corte a $Y$**:

  En $g(x) = \log_b(x - h)$, existirá intercepto con el eje $Y$ si y solo si $h < 0$ (traslación hacia la izquierda), pues en tal caso $0 \in ]h, +\infty[$ y $g(0) = \log_b(-h) \in \mathbb{R}$.'
definiciones_clave: '- **Ausencia de corte vertical**: Inexistencia de puntos de intersección entre la gráfica básica y el eje $Y$.

  - **Positividad estricta de la exponencial**: Propiedad $b^y > 0, \forall y \in \mathbb{R}$ que impide que $\log_b(0)$ exista.'
propiedades_relaciones: '- **Dualidad con la asíntota**: El eje $Y$ es la asíntota vertical $\mathcal{A}_V: x = 0$, garantizando $\operatorname{dist}(\operatorname{Gr}(f), \text{Eje } Y) \to 0$ sin intersección.

  - **Corte en funciones trasladadas a la izquierda**: Si $f(x) = \log_2(x + 8)$, entonces $f(0) = \log_2(8) = 3 \implies (0, 3)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La justificación de la ausencia de intercepto con el eje $Y$ en la función logarítmica básica demuestra que $0 \notin \operatorname{Dom}(\log_b)$, dado que evaluar $f(0) = \log_b(0)$ exigiría resolver $b^y = 0$, lo cual es imposible porque las potencias de bases positivas son estrictamente mayores que cero ($b^y > 0$)](/static/img/nodos/justificacion-de-la-ausencia-de-intercepto-con-el-eje-y-en-la-funcion-logaritmica-basica-ejemplos.svg)



    Analiza si las siguientes funciones poseen intercepto con el eje $Y$ y calcula sus coordenadas en caso afirmativo:

    1) $f(x) = \log_3(x)$

    2) $g(x) = \log_2(x + 16)$

    3) $h(x) = \ln(x - 5)$'
  pasos:
  - 'Paso 1: Para $f(x) = \log_3(x)$:

    - $x = 0 \notin \operatorname{Dom}(f) = ]0, +\infty[$.

    - **No posee intercepto con el eje $Y$**.'
  - 'Paso 2: Para $g(x) = \log_2(x + 16)$:

    - Evaluar en $x = 0$: $g(0) = \log_2(0 + 16) = \log_2(16) = 4$.

    - Como $16 > 0$, el corte existe en el punto **$(0, 4)$**.'
  - 'Paso 3: Para $h(x) = \ln(x - 5)$:

    - Evaluar en $x = 0$: $h(0) = \ln(-5) \notin \mathbb{R}$.

    - **No posee intercepto con el eje $Y$**.'
