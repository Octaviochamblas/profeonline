semantic_id: MAT.ALG.TRIG_COORDENADAS.IDENTIDAD_PITAGORICA
resumen_inicial: 'Uso de la identidad fundamental $\sin^2(x) + \cos^2(x) = 1$ deducida directamente de la ecuación del círculo unitario.'
explicacion_simple: |
  En el círculo unitario, cualquier punto $P$ forma un triángulo rectángulo con la proyección de sus coordenadas $x$ e $y$ y con el radio que mide 1. Al aplicar el Teorema de Pitágoras ($a^2 + b^2 = c^2$), obtenemos la relación $x^2 + y^2 = 1^2$. Como la abscisa $x$ es el coseno y la ordenada $y$ es el seno, descubrimos la **Identidad Pitagórica Fundamental**: $\sin^2(x) + \cos^2(x) = 1$. Esta fórmula es cierta para absolutamente cualquier ángulo real.
explicacion_formal: |
  ### Definición formal
  La **Identidad Pitagórica Fundamental** es una relación algebráica identidad que se satisface universalmente para todo número real $x \in \mathbb{R}$:
  $$\sin^2(x) + \cos^2(x) = 1$$
  se obtiene al sustituir las definiciones $x = \cos \theta$ e $y = \sin \theta$ en la ecuación implícita del círculo unitario $\mathcal{C}: x^2 + y^2 = 1$.

  ### Desglose simbólico
  - $\sin^2(x) = (\sin x)^2$: Cuadrado del valor numérico del seno.
  - $\cos^2(x) = (\cos x)^2$: Cuadrado del valor numérico del coseno.
  - $1$: Hipotenusa constante elevada al cuadrado ($1^2 = 1$).
  - Despejes útiles:
    - $\sin^2(x) = 1 - \cos^2(x) \implies |\sin x| = \sqrt{1 - \cos^2(x)}$
    - $\cos^2(x) = 1 - \sin^2(x) \implies |\cos x| = \sqrt{1 - \sin^2(x)}$

  ### Síntesis didáctica
  La identidad pitagórica permite hallar el valor absoluto del seno si se conoce el coseno (o viceversa) sin necesidad de conocer el ángulo. La única decisión adicional requerida es asignar el signo $(+)$ o $(-)$ adecuado según el cuadrante en que se ubique el ángulo.
definiciones_clave: |
  - **Identidad Pitagórica**: Igualdad $\sin^2(x) + \cos^2(x) = 1$ válida para cualquier valor del argumento $x$.
  - **Despeje de componentes**: Fórmulas derivadas $\sin x = \pm \sqrt{1 - \cos^2 x}$ y $\cos x = \pm \sqrt{1 - \sin^2 x}$.
  - **Notación de potencia trigonométrica**: Escritura abreviada $\sin^2(x)$ para denotar la potencia de la función entera $(\sin x)^2$.
propiedades_relaciones: |
  - **Independencia del ángulo**: La suma de los cuadrados del seno y del coseno siempre da $1$, sin importar si el ángulo es de $30^\circ$, $1500^\circ$ o $-45^\circ$.
  - **Identidades pitagóricas derivadas**:
    - Al dividir toda la identidad por $\cos^2(x)$: $1 + \tan^2(x) = \sec^2(x)$.
    - Al dividir toda la identidad por $\sin^2(x)$: $1 + \cot^2(x) = \csc^2(x)$.
ejemplo_guiado:
  enunciado: 'Dado un ángulo $\theta$ en el segundo cuadrante tal que $\sin \theta = \frac{4}{5}$, calcula el valor exacto de $\cos \theta$ aplicando la identidad pitagórica.'
  pasos:
    - 'Paso 1: Plantear la identidad pitagórica despejando $\cos^2 \theta$: $\cos^2 \theta = 1 - \sin^2 \theta$.'
    - 'Paso 2: Sustituir el valor conocido: $\cos^2 \theta = 1 - \left(\frac{4}{5}\right)^2 = 1 - \frac{16}{25}$.'
    - 'Paso 3: Realizar la resta fraccionaria: $\cos^2 \theta = \frac{25 - 16}{25} = \frac{9}{25}$.'
    - 'Paso 4: Extraer la raíz cuadrada: $|\cos \theta| = \sqrt{\frac{9}{25}} = \frac{3}{5}$. Como $\theta$ está en el II cuadrante ($x < 0$), el coseno es negativo: $\cos \theta = -\frac{3}{5}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la forma correcta de la Identidad Pitagórica Fundamental para cualquier ángulo $x$?'
    choices:
      - {text: '$\sin^2(x) + \cos^2(x) = 1$', is_correct: true}
      - {text: '$\sin(x) + \cos(x) = 1$', is_correct: false}
      - {text: '$\sin^2(x) - \cos^2(x) = 1$', is_correct: false}
      - {text: '$\sin^2(x) + \cos^2(x) = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\sin^2(x) + \cos^2(x) = 1$''. Se obtiene directamente al sustituir la abscisa $x$ y ordenada $y$ en la ecuación del círculo unitario.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en el tercer cuadrante se sabe que $\cos \theta = -\frac{12}{13}$, ¿cuál es el valor exacto de $\sin \theta$?'
    choices:
      - {text: '$-\frac{5}{13}$', is_correct: true}
      - {text: '$\frac{5}{13}$', is_correct: false}
      - {text: '$-\frac{1}{13}$', is_correct: false}
      - {text: '$\frac{12}{13}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-\frac{5}{13}$''. Calculando: $\sin^2 \theta = 1 - \left(-\frac{12}{13}\right)^2 = 1 - \frac{144}{169} = \frac{25}{169}$. En III C el seno es negativo, dando $-\frac{5}{13}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la identidad pitagórica fundamental $\sin^2 \theta + \cos^2 \theta = 1$.'
  - 'Paso 2: Sustituir el valor conocido (seno o coseno) y despejar el cuadrado del término desconocido.'
  - 'Paso 3: Aplicar la raíz cuadrada para obtener el valor numérico absoluto.'
  - 'Paso 4: Asignar el signo $(+)$ o $(-)$ al resultado según el cuadrante del ángulo.'
errores_correccion: |
  - **Error 1:** Creer que $\sin x + \cos x = 1$ sin elevar al cuadrado. **Cómo corregirlo:** Las magnitudes simples de seno y coseno no suman 1; la suma igual a 1 exige estrictamente la potencia cuadrada de ambas funciones ($\sin^2 x + \cos^2 x = 1$).
  - **Error 2:** Olvidar aplicar el signo negativo al despejar la raíz cuadrada en cuadrantes donde la función es negativa. **Cómo corregirlo:** La raíz cuadrada produce un valor positivo absoluto; el signo $(+)$ o $(-)$ debe determinarse analizando la región del cuadrante.
ejemplos:
  - titulo: 'Suma de cuadrados de ángulo cualquiera'
    enunciado: '¿Cuánto resulta la expresión $\sin^2(73^\circ) + \cos^2(73^\circ)$?'
    alternativas:
      - '$1$'
      - '$73$'
      - '$0$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. Por la identidad pitagórica, para cualquier argumento $x$, $\sin^2(x) + \cos^2(x) = 1$.'
      - '2. Por lo tanto, el resultado es exactamente $1$.'
  - titulo: 'Despeje de seno con coseno dado'
    enunciado: 'Si $\cos \theta = 0.6$ en el primer cuadrante, ¿cuál es el valor de $\sin \theta$?'
    alternativas:
      - '$0.8$'
      - '$0.4$'
      - '$0.36$'
    respuesta: '$0.8$'
    solucion_pasos:
      - '1. $\sin^2 \theta = 1 - (0.6)^2 = 1 - 0.36 = 0.64$.'
      - '2. $\sin \theta = \sqrt{0.64} = 0.8$.'
  - titulo: 'Identidad para ángulos negativos'
    enunciado: '¿Se cumple que $\sin^2(-50^\circ) + \cos^2(-50^\circ) = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la identidad es válida para todo número real independientemente de su signo.'
  - titulo: 'Coseno cuando seno vale 1'
    enunciado: 'Si $\sin \theta = 1$, ¿el coseno $\cos \theta$ vale obligatoriamente 0 por la identidad pitagórica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\cos^2 \theta = 1 - 1^2 = 0 \implies \cos \theta = 0$.'
errores_frecuentes:
  - 'La afirmación de que la suma simple $\sin(x) + \cos(x)$ es siempre igual a $1$.'
  - 'La afirmación de que la identidad pitagórica $\sin^2(x) + \cos^2(x) = 1$ solo se cumple para ángulos agudos del primer cuadrante.'
  - 'La afirmación de que al extraer la raíz cuadrada $\sqrt{1 - \cos^2 x}$ el resultado es siempre un número negativo.'
  - 'La afirmación de que $\sin^2(x)$ es idéntico a $\sin(x^2)$.'
  - 'La afirmación de que la resta $\sin^2(x) - \cos^2(x)$ es igual a $1$.'
afirmaciones_verdaderas:
  - 'La Identidad Pitagórica Fundamental $\sin^2(x) + \cos^2(x) = 1$ se satisface universalmente para cualquier valor real de $x$.'
  - 'Conociendo una de las razones (seno o coseno) y el cuadrante del ángulo, la identidad pitagórica permite calcular de forma única la otra razón.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la Identidad Pitagórica Fundamental $\sin^2(x) + \cos^2(x) = 1$ para calcular razones trigonométricas desconocidas.
  CÓMO: Despejar el seno o coseno de la relación cuadrática y asignar el signo algebráico adecuado según el cuadrante.
