semantic_id: MAT.ALG.TRIG_COORDENADAS.IDENTIDAD_PITAGORICA
resumen_inicial: 'Uso de la identidad sen²(x) + cos²(x) = 1 en el círculo unitario:
  círculo unitario, amplitud, período y transformaciones de Seno y coseno en el círculo
  unitario.'
explicacion_simple: Como el punto asociado a cada ángulo está sobre el círculo unitario,
  existe una relación fija entre el seno y el coseno de ese mismo ángulo.
explicacion_formal: '### Definición formal


  Si $(x,y)$ es el punto asociado a $\theta$ en el círculo unitario, entonces $x^2+y^2=1$.
  Como $\cos(\theta)=x$ y $\sin(\theta)=y$, sustituyendo se obtiene $\cos^2(\theta)+\sin^2(\theta)=1$,
  válida para cualquier ángulo $\theta$ real.


  ### Desarrollo didáctico


  Si $\sin(\theta)=3/5$, se puede despejar $\cos^2(\theta)=1-(3/5)^2=1-9/25=16/25$,
  así que $\cos(\theta)=\pm4/5$, con el signo determinado por el cuadrante de $\theta$.'
definiciones_clave: '- **Uso de la identidad sen²(x) + cos²(x) = 1 en el círculo unitario**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a uso de la identidad sen²(x) + cos²(x) = 1 en el círculo unitario.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    uso de la identidad sen²(x) + cos²(x) = 1 en el círculo unitario.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de uso de la identidad sen²(x) + cos²(x) = 1 en el círculo
    unitario.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
