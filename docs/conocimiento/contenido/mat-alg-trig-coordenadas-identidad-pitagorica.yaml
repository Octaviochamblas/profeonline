procedimiento:
- 'Paso 1: Identifica el valor conocido, ya sea $\sin(\theta)$ o $\cos(\theta)$.'
- 'Paso 2: Aplica la identidad $\sin^2(\theta)+\cos^2(\theta)=1$ para despejar el
  valor desconocido.'
- 'Paso 3: Determina el signo correcto del resultado según el cuadrante de $\theta$.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en uso de la identidad sen²(x)
  + cos²(x) = 1 en el círculo unitario.
ejemplos:
- titulo: Aplicación directa de la identidad
  enunciado: Si $\cos(\theta)=4/5$ y $\theta$ está en el primer cuadrante, calcula
    $\sin(\theta)$.
  solucion_pasos:
  - 'Se despeja: $\sin^2(\theta)=1-(4/5)^2=1-16/25=9/25$.'
  - Como $\theta$ está en el primer cuadrante, $\sin(\theta)=3/5$ (positivo).
- titulo: Verificación de la identidad con un ángulo notable
  enunciado: Verifica la identidad pitagórica para $\theta=30°$.
  solucion_pasos:
  - Se calcula $\sin^2(30°)+\cos^2(30°)=(1/2)^2+(\sqrt{3}/2)^2=1/4+3/4=1$.
  - Se confirma que la identidad se cumple.
- titulo: ¿La identidad pitagórica se cumple para cualquier ángulo?
  enunciado: ¿La identidad $\sin^2(\theta)+\cos^2(\theta)=1$ es válida para cualquier
    valor de $\theta$?
  respuesta: Sí
  solucion_pasos:
  - Es consecuencia directa de que el punto asociado siempre pertenece al círculo
    unitario.
- titulo: ¿Conocer solo $\sin(\theta)$ determina el signo de $\cos(\theta)$?
  enunciado: ¿Conocer únicamente el valor de $\sin(\theta)$ es suficiente para determinar
    el signo de $\cos(\theta)$?
  respuesta: 'No'
  solucion_pasos:
  - También se necesita conocer el cuadrante de $\theta$ para determinar el signo
    correcto.
errores_frecuentes:
- Olvidar elevar al cuadrado correctamente antes de aplicar la identidad.
- No determinar el signo correcto del valor despejado según el cuadrante.
- Confundir $\sin^2(\theta)$ con $\sin(\theta^2)$, expresiones completamente distintas.
- Aplicar la identidad con valores que no corresponden al mismo ángulo $\theta$.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_ponder: Analizar, graficar y modelar fenómenos periódicos aplicando
  uso de la identidad sen²(x) + cos²(x) = 1 en el círculo unitario.
