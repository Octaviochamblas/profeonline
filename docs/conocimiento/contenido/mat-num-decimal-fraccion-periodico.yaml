semantic_id: MAT.NUM.DECIMAL_FRACCION.PERIODICO
resumen_inicial: Para convertir un decimal periódico puro a fracción, el numerador
  es la resta entre el número completo sin coma y la parte entera, y el denominador
  está formado por tantos 9s como cifras tenga el período.
explicacion_simple: Para pasar un decimal periódico puro (con barra desde la coma)
  a fracción, restamos el número completo sin coma menos la parte entera para armar
  el numerador. En el número de abajo (denominador) escribimos tantos nueves (9) como
  dígitos tenga la barra del período, y luego simplificamos.
explicacion_formal: 'Dado un decimal periódico puro $d = a_0, \overline{p_1 p_2 \dots
  p_k}$, su **Fracción Generatriz Periódica Pura** se calcula mediante la fórmula:


  $$d = \frac{N - A}{99\dots9_k} = \frac{a_0 p_1 p_2 \dots p_k - a_0}{\underbrace{99\dots9}_{k
  \text{ nueves}}}$$


  **Desglose de la fórmula:**

  - $N = a_0 p_1 \dots p_k \in \mathbb{Z}$: Número formado al omitir la coma y la
  barra.

  - $A = a_0 \in \mathbb{Z}$: Parte entera del número decimal.

  - $99\dots9_k$: Denominador formado por $k$ nueves, donde $k$ es el número de dígitos
  del período con barra.


  > **Complemento didáctico:** La presencia de los 9s en el denominador proviene algebraicamente
  de restar la ecuación $10^k \cdot d - d = (10^k - 1) \cdot d$.'
definiciones_clave: '- **Fracción generatriz de decimal periódico puro**: Fórmula
  $\frac{N - A}{99\dots9_k}$ reducida a fracción irreductible.'
propiedades_relaciones: '- **Eliminación de la infinitud**: Convierte la repetición
  infinita a la razón exacta de dos enteros.'
ejemplo_guiado:
  enunciado: Convierta el decimal periódico puro $1,\overline{36}$ a fracción irreductible.
  pasos:
  - 'Paso 1: Identificar el número sin coma ni barra: $N = 136$.'
  - 'Paso 2: Identificar la parte entera a restar: $A = 1$.'
  - 'Paso 3: Calcular el numerador: $N - A = 136 - 1 = 135$.'
  - 'Paso 4: Contar las cifras del período $\overline{36}$: $2$ cifras $\implies$
    denominador $99$.'
  - 'Paso 5: Formar la fracción generatriz: $\frac{135}{99}$.'
  - 'Paso 6: Simplificar dividiendo por $9$: $\frac{135 : 9}{99 : 9} = \frac{15}{11}$.'
  - 'Conclusión: $1,\overline{36} = \frac{15}{11}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se forma el denominador de la fracción generatriz de un decimal
    periódico puro?
  choices:
  - text: Con tantos nueves como cifras tenga el período (9, 99, 999...)
    is_correct: true
  - text: Con potencias de 10 (10, 100...)
    is_correct: false
  - text: Con tantos ceros como cifras tenga el período
    is_correct: false
  - text: Es siempre 90
    is_correct: false
  explanation: La alternativa correcta es 'Con tantos nueves como cifras tenga el
    período (9, 99, 999...)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "En el ejemplo guiado para 1,\bar{36}, ¿cuál fue la fracción irreductible\
    \ final?"
  choices:
  - text: 15/11
    is_correct: true
  - text: 135/99
    is_correct: false
  - text: 136/99
    is_correct: false
  - text: 36/99
    is_correct: false
  explanation: La alternativa correcta es '15/11'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Restar en el numerador el número completo sin coma ni barra menos la parte
  entera ($N - A$).'
- 'Paso 2: Escribir en el denominador una cadena de nueves igual a la cantidad de
  dígitos bajo la barra periódica.'
- 'Paso 3: Simplificar la fracción hasta obtener su forma irreductible.'
errores_correccion: '- **Error 1: Olvidar restar la parte entera en el numerador (escribir
  $\frac{136}{99}$ en lugar de $\frac{135}{99}$).** **Cómo corregirlo:** Se DEBE restar
  la parte entera $A$ de todo el número $N$.


  - **Error 2: Usar ceros en el denominador de un periódico puro.** **Cómo corregirlo:**
  Si NO hay anteperíodo, el denominador lleva ÚNICAMENTE nueves (sin ceros).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta 0,\overline{7} a fracción.
  alternativas:
  - 7/9
  - 7/10
  - 7/99
  respuesta: 7/9
  solucion_pasos:
  - $(7-0)/9 = 7/9$.
- titulo: Ejemplo 2
  enunciado: Convierta 0,\overline{45} a fracción irreductible.
  alternativas:
  - 5/11
  - 45/99
  - 45/100
  respuesta: 5/11
  solucion_pasos:
  - $45/99 = 5/11$ tras simplificar entre 9.
- titulo: ¿Equivale 0,\overline{3} a la fracción 1/3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3/9 = 1/3$.
- titulo: ¿Es 0,\overline{9} exactamente igual al entero 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $9/9 = 1$.
errores_frecuentes:
- Omitir restar la parte entera en el numerador de un decimal periódico puro.
- Formar el denominador con una potencia de 10 en lugar de usar nueves.
- Agregar ceros al denominador en decimales que no poseen anteperíodo.
- El número $0,\overline{6}$ equivale a la fracción $6/10$.
- Los decimales periódicos puros no se pueden transformar en fracciones exactas.
afirmaciones_verdaderas:
- Para convertir un decimal periódico puro a fracción se resta $N - A$ en el numerador
  y se colocan $k$ nueves en el denominador.
- La presencia exclusiva de nueves en el denominador refleja que la repetición periódica
  inicia directamente tras la coma.
al_terminar_debes_poder: Al terminar serás capaz de convertir cualquier decimal infinito
  periódico puro a su fracción generatriz irreductible mediante la regla de restar
  la parte entera y colocar nueves en el denominador.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
