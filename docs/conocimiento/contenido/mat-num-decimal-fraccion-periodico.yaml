semantic_id: MAT.NUM.DECIMAL_FRACCION.PERIODICO
resumen_inicial: "Para convertir un decimal infinito periódico puro a fracción, se resta a todo el número sin coma la parte entera en el numerador, y se coloca en el denominador una cadena de nueves igual a la cantidad de cifras del período."
explicacion_simple: |
  Para transformar un decimal **periódico puro** (el que tiene la barrita de período inmediatamente después de la coma, como $0.\overline{4}$ o $1.\overline{27}$) a fracción, aplicas la famosa **Regla de los Nueves**:
  1. **Numerador**: Tomas todo el número sin coma y le **restas la parte entera** (por ejemplo, para $1.\overline{27}$ haces $127 - 1 = 126$).
  2. **Denominador**: Pones una cantidad de **nueves (9)** igual a las cifras bajo la barra. Como $27$ tiene $2$ cifras bajo la barra, pones $99$ abajo ($\frac{126}{99}$).
  3. **Simplificación**: Simplificas dividiendo numerador y denominador ($\frac{126 \div 9}{99 \div 9} = \frac{14}{11}$).
explicacion_formal: |
  Formalmente, sea $d = E , \overline{P}$ un decimal infinito periódico puro con parte entera $E \in \mathbb{N}_0$ y período $P = p_1 \dots p_m$ de $m \ge 1$ cifras.

  Demostración por resta de ecuaciones algebraicas:
  $$\text{Sea } x = E + \frac{P}{10^m - 1}$$
  $$10^m \cdot x = E \cdot 10^m + P . \overline{P}$$
  Restando la primera ecuación de la segunda:
  $$10^m \cdot x - x = (E \cdot 10^m + P . \overline{P}) - (E . \overline{P})$$
  $$(10^m - 1) \cdot x = (E \cdot 10^m + P) - E = \text{Número sin coma} - \text{Parte entera}$$
  $$x = \frac{\text{Número sin coma} - E}{10^m - 1} = \frac{\text{Número sin coma} - E}{\underbrace{99\dots9}_{m \text{ nueves}}}$$
definiciones_clave: |
  - **Diferencia del numerador ($N - E$)**: Resta entre el número formado por la parte entera y el período sin coma, menos la parte entera.
  - **Denominador de nueves ($99\dots9$)**: Cadena compuesta exclusivamente por $m$ dígitos nueve, donde $m$ es el número de cifras del período.
  - **Ecuación de cancelación del período**: Demostración algebraica basada en multiplicar por $10^m$ y restar para eliminar la cola decimal infinita.
propiedades_relaciones: |
  - **Identidad del nueve periódico**: $0.\overline{9} = \frac{9}{9} = 1$. Todo decimal con período 9 equivale exactamente al entero siguiente.
  - **Ausencia de ceros en el denominador**: Como no hay anteperíodo, el denominador está constituido exclusivamente por nueves sin ceros al final.
  - **Equivalencia fraccionaria**: $0.\overline{abc} = \frac{abc}{999}$.
ejemplo_guiado:
  enunciado: 'Convierte el decimal periódico puro $2.\overline{15}$ a fracción irreductible utilizando la regla de los nueves y mediante el método de demostración por ecuaciones.'
  pasos:
    - 'Método 1 (Regla): parte entera $E = 2$, período $P = 15$ ($2$ cifras, $m = 2$).'
    - '   Numerador: número sin coma menos parte entera $= 215 - 2 = 213$.'
    - '   Denominador: $2$ nueves $= 99$.'
    - '   Fracción: $\frac{213}{99}$.'
    - '   Simplificar dividiendo por $3$: $\frac{213 \div 3}{99 \div 3} = \frac{71}{33}$.'
    - 'Método 2 (Algebraico): sea $x = 2.151515\dots$'
    - '   Multiplicar por $100$: $100x = 215.151515\dots$'
    - '   Restar $100x - x$: $99x = 213 \implies x = \frac{213}{99} = \frac{71}{33}$.'
    - 'Concluir: $2.\overline{15} = \frac{71}{33}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué el denominador de la conversión de un decimal periódico puro consta exclusivamente de nueves y no incluye ceros?"
    choices:
      - {text: "Porque no existe anteperíodo (cifras no repetidas tras la coma) entre la coma y el período.", is_correct: true}
      - {text: "Porque los nueves son primos.", is_correct: false}
      - {text: "Porque la parte entera es siempre igual a cero.", is_correct: false}
      - {text: "Porque los ceros solo se usan al sumar fracciones.", is_correct: false}
    explanation: "La correcta es Porque no existe anteperíodo (cifras no repetidas tras la coma) entre la coma y el período.: la ausencia de anteperíodo implica que el factor $10^n$ es $10^0 = 1$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la fracción irreductible equivalente al decimal periódico $0.\overline{6}$?'
    choices:
      - {text: "\\frac{2}{3}", is_correct: true}
      - {text: "\\frac{6}{9}", is_correct: false}
      - {text: "\\frac{6}{10}", is_correct: false}
      - {text: "\\frac{3}{5}", is_correct: false}
    explanation: 'La correcta es \frac{2}{3}: $\frac{6}{9} = \frac{6 \div 3}{9 \div 3} = \frac{2}{3}$.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar la parte entera $E$ y las cifras del período $P$, contando cuántos dígitos $m$ tiene el período."
  - "Paso 2: Escribir el número completo sin la coma decimal."
  - "Paso 3: Restar a ese número completo la parte entera $E$ para formar el numerador de la fracción."
  - 'Paso 4: Escribir en el denominador una cadena con $m$ dígitos nueve ($99\dots9$).'
  - "Paso 5: Simplificar la fracción resultante dividiendo numerador y denominador entre su máximo común divisor."
errores_correccion: |
  Un error clásico es poner potencias de 10 o ceros en el denominador (por ejemplo para $0.\overline{3}$, poner $\frac{3}{10}$). ¡Los ceros son para decimales finitos! **Para decimales periódicos debes usar NUEVES en el denominador** ($\frac{3}{9} = \frac{1}{3}$).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: 'Convierte $0.\overline{45}$ a fracción irreductible.'
    alternativas:
      - "\\frac{5}{11}"
      - "\\frac{45}{99}"
      - "\\frac{45}{100}"
    respuesta: "\\frac{5}{11}"
    solucion_pasos:
      - 'Numerador: $45 - 0 = 45$. Denominador: $99$ ($2$ nueves).'
      - 'Fracción: $\frac{45}{99}$.'
      - 'Simplificar entre $9$: $\frac{45 \div 9}{99 \div 9} = \frac{5}{11}$.'
  - titulo: "Ejemplo 2"
    enunciado: 'Convierte $1.\overline{3}$ a fracción irreductible.'
    alternativas:
      - "\\frac{4}{3}"
      - "\\frac{13}{9}"
      - "\\frac{13}{10}"
    respuesta: "\\frac{4}{3}"
    solucion_pasos:
      - 'Numerador: $13 - 1 = 12$. Denominador: $9$ ($1$ nueve).'
      - 'Fracción: $\frac{12}{9}$.'
      - 'Simplificar entre $3$: $\frac{12 \div 3}{9 \div 3} = \frac{4}{3}$.'
  - titulo: '¿Es numéricamente cierto que $0.\overline{9} = 1$?'
    respuesta: 'Sí, $0.\overline{9} = \frac{9}{9} = 1$ es una identidad matemática válida.'
    solucion_pasos:
      - 'Aplicando la fórmula: $\frac{9 - 0}{9} = \frac{9}{9} = 1$.'
  - titulo: "¿Se restan los nueves si el número tiene una parte entera mayor que cero?"
    respuesta: "No, la parte entera se resta en el numerador, los nueves se mantienen en el denominador."
    solucion_pasos:
      - 'Para $3.\overline{2}$, el numerador es $32 - 3 = 29$ y el denominador sigue siendo $9$ ($\frac{29}{9}$).'
errores_frecuentes:
  - "Poner ceros o diez en lugar de nueves en el denominador."
  - "Olvidar restar la parte entera en el numerador cuando el número es mayor o igual a 1."
  - "Confundir el decimal periódico puro con el semiperiódico agregando ceros al denominador."
  - "No simplificar la fracción por 3 o 9 al finalizar."
  - "Creer que la barra de período afecta la parte entera."
afirmaciones_verdaderas:
  - "El denominador de un decimal periódico puro está formado exclusivamente por una cantidad de nueves igual a la longitud del período."
  - "Para hallar el numerador de un decimal periódico se resta la parte entera al número sin coma."
al_terminar_debes_ponder: |
  Debes ser capaz de convertir cualquier decimal infinito periódico puro a su fracción irreductible equivalente utilizando la regla de los nueves y la deducción por ecuaciones algebraicas.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
