semantic_id: MAT.FUND.TABLAS_VERDAD.TABLA_CONDICIONAL
resumen_inicial: 'Estructura canónica de la tabla de verdad del condicional ($p \to q$), caracterizada por una única fila falsa en $V \to F$.'
explicacion_simple: |
  La **tabla de verdad del condicional** ($p \to q$) traduce la frase "Si $p$, entonces $q$". En sus $4$ combinaciones, solo existe **una fila donde el resultado es Falso ($F$)**: la segunda fila, donde la condición inicial se cumple ($p = V$) pero no se cumple lo prometido ($q = F$). En todas las demás combinaciones (incluyendo las filas donde $p = F$, pues "de una falsedad no se puede romper la promesa"), el condicional es **Verdadero ($V$)**.
explicacion_formal: |
  ### Definición formal
  La **tabla de verdad del condicional material** es la matriz de valuación que describe la implicación lógica clásica:
  $$\begin{array}{|c|c|c|} \hline p & q & p \to q \\ \hline V & V & V \\ V & F & F \\ F & V & V \\ F & F & V \\ \hline \end{array}$$
  donde el vector columna de salida canónico es $\mathbf{v}(p \to q) = [V, F, V, V]^T$.

  ### Desglose simbólico
  - Fila 1 ($V, V$): $V \to V = V$ (premisa verdadera y conclusión verdadera).
  - Fila 2 ($V, F$): $V \to F = F$ (única fila de falsedad o contraejemplo).
  - Fila 3 ($F, V$): $F \to V = V$ (verdad por vacuidad del antecedente).
  - Fila 4 ($F, F$): $F \to F = V$ (verdad por vacuidad del antecedente).

  ### Síntesis didáctica
  La tabla del condicional refleja la asimetría fundamental de la implicación: la falsedad en la salida se restringe exclusivamente al escenario donde una hipótesis verdadera conduce a una tesis falsa.
definiciones_clave: |
  - **Tabla de verdad del condicional**: Matriz de 4 filas que mapea los estados de la implicación material ($[V, F, V, V]^T$).
  - **Fila de contraejemplo**: Fila 2 ($p=V, q=F$), único escenario que refuta la validez de un condicional.
  - **Verdad por vacuidad**: Principio por el cual cualquier condicional con antecedente falso ($p=F$) es verdadero (Filas 3 y 4).
propiedades_relaciones: |
  - **Asimetría veritativa**: Las filas intermedias son distintas ($V \to F = F$ mientras que $F \to V = V$), lo que demuestra que $p \to q \not\equiv q \to p$.
  - **Equivalencia de columnas**: La columna $[V, F, V, V]^T$ de $p \to q$ es idéntica a la columna de la disyunción $\neg p \lor q$.
ejemplo_guiado:
  enunciado: 'Construye la tabla de verdad para el recíproco $q \to p$ y compárala con el condicional directo $p \to q$.'
  pasos:
    - 'Paso 1: Colocar las 4 filas estándar de entrada para $p$ y $q$.'
    - 'Paso 2: Calcular el condicional directo $p \to q$:
      - Fila 1 ($V, V$): $V \to V = V$
      - Fila 2 ($V, F$): $V \to F = F$
      - Fila 3 ($F, V$): $F \to V = V$
      - Fila 4 ($F, F$): $F \to F = V$. Vector: $[V, F, V, V]^T$.'
    - 'Paso 3: Calcular el recíproco $q \to p$:
      - Fila 1 ($V, V$): $V \to V = V$
      - Fila 2 ($F, V$): $F \to V = V$
      - Fila 3 ($V, F$): $V \to F = F$
      - Fila 4 ($F, F$): $F \to F = V$. Vector: $[V, V, F, V]^T$.'
    - 'Paso 4: Comparar los vectores: Como $[V, F, V, V]^T \neq [V, V, F, V]^T$, se demuestra formalmente que un condicional no es equivalente a su recíproco.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuál fila de la tabla de verdad canónica el condicional $p \to q$ produce el valor Falso ($F$)?'
    choices:
      - {text: 'En la fila 2, donde $p=V$ y $q=F$', is_correct: true}
      - {text: 'En la fila 4, donde $p=F$ y $q=F$', is_correct: false}
      - {text: 'En la fila 3, donde $p=F$ y $q=V$', is_correct: false}
      - {text: 'En la fila 1, donde $p=V$ y $q=V$', is_correct: false}
    explanation: 'La alternativa correcta es ''En la fila 2, donde $p=V$ y $q=F$''. El condicional solo falla ante un antecedente verdadero con consecuente falso.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la tabla de verdad del condicional $p \to q$, ¿qué valor de salida se obtiene en las filas 3 y 4 donde $p=F$?'
    choices:
      - {text: 'Verdadero ($V$) en ambas filas', is_correct: true}
      - {text: 'Falso ($F$) en ambas filas', is_correct: false}
      - {text: 'Indeterminado', is_correct: false}
      - {text: 'Falso en la fila 3 y Verdadero en la fila 4', is_correct: false}
    explanation: 'La alternativa correcta es ''Verdadero ($V$) en ambas filas''. Cuando el antecedente es falso, el condicional es verdadero por vacuidad.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir las 4 combinaciones canónicas de entrada ($p: V, V, F, F$ y $q: V, F, V, F$).'
  - 'Paso 2: Rotular la columna de salida como $p \to q$.'
  - 'Paso 3: Identificar la fila 2 ($V, F$) y asignarle el valor $F$.'
  - 'Paso 4: Asignar el valor $V$ en las filas restantes 1, 3 y 4.'
errores_correccion: |
  - **Error 1:** Asignar $F$ en la fila $4$ ($F \to F$). **Cómo corregirlo:** Si la premisa es falsa y la conclusión es falsa, la regla condicional no se viola; $F \to F$ es formalmente Verdadero ($V$).
  - **Error 2:** Creer que la fila $3$ ($F \to V$) es falsa. **Cómo corregirlo:** La implicación no exige que el antecedente sea la única causa del consecuente; $F \to V$ es estrictamente Verdadero ($V$).
ejemplos:
  - titulo: 'Evaluación de fila 2'
    enunciado: '¿Cuánto vale $p \to q$ en la fila $p=V, q=F$?'
    alternativas:
      - '$F$'
      - '$V$'
      - 'Indeterminado'
    respuesta: '$F$'
    solucion_pasos:
      - '1. $V \to F = F$.'
  - titulo: 'Evaluación de fila 4'
    enunciado: '¿Cuánto vale $p \to q$ en la fila $p=F, q=F$?'
    alternativas:
      - '$V$'
      - '$F$'
      - '$0$'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $F \to F = V$.'
  - titulo: 'Vector canónico'
    enunciado: '¿El vector de salida canónico del condicional $p \to q$ es $[V, F, V, V]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, posee 3 verdades y 1 falsedad en la segunda posición.'
  - titulo: 'Equivalencia con disyunción'
    enunciado: '¿La columna de $\neg p \lor q$ es idéntica a la de $p \to q$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas generan exactamente el vector $[V, F, V, V]^T$.'
errores_frecuentes:
  - 'La afirmación de que en la fila $p=F$ y $q=F$ el condicional produce el valor de verdad falso.'
  - 'La afirmación de que el condicional $p \to q$ posee el mismo vector de salida que el recíproco $q \to p$.'
  - 'La afirmación de que en la combinación $p=F$ y $q=V$ el condicional resulta falso.'
  - 'La afirmación de que la tabla del condicional contiene dos valores verdaderos y dos falsos.'
  - 'La afirmación de que el condicional no puede evaluarse sin conocer la causa física del fenómeno.'
afirmaciones_verdaderas:
  - 'La tabla de verdad del condicional $p \to q$ genera el vector de salida canónico $[V, F, V, V]^T$.'
  - 'En la tabla de verdad del condicional, la única fila que arroja valor falso corresponde al caso de antecedente verdadero y consecuente falso ($V \to F = F$).'
al_terminar_debes_poder: |
  QUÉ: Construir, evaluar e interpretar la tabla de verdad canónica del condicional ($p \to q$).
  CÓMO: Asignar las $4$ combinaciones de entrada y aplicar la regla de falsedad exclusiva en la segunda fila ($[V, F, V, V]^T$).
