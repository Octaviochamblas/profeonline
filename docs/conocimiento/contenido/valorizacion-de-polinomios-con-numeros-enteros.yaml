semantic_id: MAT.ALG.VALORIZACION.POLINOMIO_ENTEROS
resumen_inicial: 'Valorización de polinomios con números enteros: traducción, reglas
  y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: Un polinomio es como un tren. Está compuesto por varios vagones
  (monomios) unidos por enganches de suma o resta. Para calcular el peso total del
  tren, primero calculamos el peso de cada vagón por separado y luego los sumamos
  todos.
explicacion_formal: '### Definición formal


  Las sumas y restas (engranajes del polinomio) son la última operación de la jerarquía
  PAPOMUDAS.


  ### Desarrollo didáctico


  Sea el polinomio: $2x^2 - 3x + 5$, para $x=4$.

  Evaluamos vagón por vagón:

  - Primer vagón ($2x^2$): $2(4)^2 = 2(16) = 32$.

  - Segundo vagón ($3x$): $3(4) = 12$.

  - Tercer vagón ($5$): Es una constante, se queda como 5.


  Ahora reconstruimos el tren con sus signos originales:

  $32 - 12 + 5$

  Operamos de izquierda a derecha:

  $20 + 5 = 25$.

  Ese es el valor del polinomio.'
definiciones_clave: '- **Valorización de polinomios con números enteros**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de valorización de polinomios con números enteros.'
ejemplo_guiado:
