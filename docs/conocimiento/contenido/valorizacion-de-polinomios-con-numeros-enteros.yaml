resumen_inicial: La valorización de polinomios con enteros evalúa individualmente
  sus términos monómicos y suma algebraicamente sus resultados numéricos.
explicacion_simple: 'Para valorizar un polinomio como $2x^2 - 5x + 3$ cuando $x =
  -2$, calculamos primero el valor de cada término por separado: $2(-2)^2 = 8$, luego
  $-5(-2) = +10$, y dejamos el $+3$. Al final sumamos todo: $8 + 10 + 3 = 21$.'
explicacion_formal: 'Dado un polinomio $P(x) = \sum_{k=0}^n a_k x^k$, su **Valorización
  Polinómica** para un entero $v \in \mathbb{Z}$ es la suma escalar:


  $$P(v) = \sum_{k=0}^n a_k v^k = a_n v^n + a_{n-1} v^{n-1} + \dots + a_1 v + a_0
  \in \mathbb{Z}$$


  > **Complemento didáctico:** La evaluación polinómica representa la transformación
  discreta completa sobre la estructura aditiva del polinomio.'
definiciones_clave: '- **Valorización polinómica**: Evaluación escalar $P(v)$ mediante
  suma de términos valorizados.'
propiedades_relaciones: '- **Raíz de un polinomio**: Un entero $r$ es raíz de $P(x)$
  si y solo si $P(r) = 0$.'
ejemplo_guiado:
  enunciado: Valorice el polinomio $P(x) = x^3 - 3x^2 + 4x - 7$ para $x = -1$.
  pasos:
  - 'Paso 1: Calcular $x^3$: $(-1)^3 = -1$.'
  - 'Paso 2: Calcular $-3x^2$: $-3(-1)^2 = -3(1) = -3$.'
  - 'Paso 3: Calcular $+4x$: $+4(-1) = -4$.'
  - 'Paso 4: Sumar los términos junto con la constante $-7$: $-1 - 3 - 4 - 7 = -15$.'
  - 'Conclusión: El valor del polinomio para $x = -1$ es $-15$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento define la valorización de un polinomio con números
    enteros?
  choices:
  - text: Evaluar cada término monómico por separado y sumar algebraicamente sus resultados
    is_correct: true
  - text: Multiplicar todos los coeficientes sin considerar las variables
    is_correct: false
  - text: Sumar los exponentes y multiplicar por el grado
    is_correct: false
  - text: Restar únicamente el término independiente
    is_correct: false
  explanation: La alternativa correcta es 'Evaluar cada término monómico por separado
    y sumar algebraicamente sus resultados'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para x^3 - 3x^2 + 4x - 7 con x = -1, ¿cuál fue el
    valor final?
  choices:
  - text: '-15'
    is_correct: true
  - text: '-7'
    is_correct: false
  - text: '15'
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '-15'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sustituir la variable en cada término utilizando paréntesis.'
- 'Paso 2: Resolver las potencias de cada término.'
- 'Paso 3: Efectuar las multiplicaciones de coeficientes y sumar los resultados de
  izquierda a derecha.'
errores_correccion: '- **Error 1: Olvidar incluir el término independiente constante
  al sumar los resultados.** **Cómo corregirlo:** El término independiente constante
  se conserva y se suma al final con los demás valores calculados.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Valorice P(x) = 2x^2 - 5x + 3 para x = 3.
  alternativas:
  - '6'
  - '12'
  - '18'
  - '24'
  respuesta: '6'
  solucion_pasos:
  - 1. 2(3^2) - 5(3) + 3 = 2(9) - 15 + 3 = 18 - 15 + 3 = 6.
- titulo: Ejemplo 2
  enunciado: ¿Es x = 2 una raíz del polinomio Q(x) = x^2 - 4?
  alternativas:
  - Sí, porque Q(2) = 2^2 - 4 = 0
  - No, porque Q(2) = 4
  - No, porque es positivo
  - Indeterminado
  respuesta: Sí, porque Q(2) = 2^2 - 4 = 0
  solucion_pasos:
  - 1. Al valorizar en x=2 obtenemos 2^2 - 4 = 4 - 4 = 0. Es una raíz.
- titulo: ¿Es el valor del polinomio P(x) = x^2 + 1 para x = -3 igual a 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, (-3)^2 + 1 = 9 + 1 = 10.
- titulo: ¿Se deben multiplicar los resultados de los términos en lugar de sumarlos
    al evaluar un polinomio?
  respuesta: 'No'
  solucion_pasos:
  - No, los términos de un polinomio se combinan mediante adición y sustracción algebraica.
errores_frecuentes:
- Sumar o restar los coeficientes de los términos antes de calcular las potencias
  de las variables.
- Omitir el término independiente constante al realizar la suma global.
- Declarar la multiplicación de los signos de los términos al reemplazar valores negativos.
- Declarar que la evaluación de un polinomio en cero siempre da cero sin revisar la
  constante.
- Multiplicar los resultados parciales de los términos en lugar de sumarlos.
afirmaciones_verdaderas:
- La valorización de un polinomio requiere evaluar término a término y sumar los resultados.
- Si al valorizar P(r) el resultado da cero, el entero r es una raíz del polinomio.
al_terminar_debes_poder: Al terminar serás capaz de valorizar cualquier polinomio
  con números enteros calculando el valor de sus términos y realizando la suma aditiva
  final.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Valorización.
