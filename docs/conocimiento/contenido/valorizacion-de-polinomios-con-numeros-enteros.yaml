semantic_id: MAT.ALG.VALORIZACION.POLINOMIO_ENTEROS
resumen_inicial: 'La valorización de polinomios con números enteros consiste en calcular el valor numérico de cada uno de sus términos monomios y sumar o restar los resultados siguiendo la regla de signos.'
explicacion_simple: |
  Un **polinomio** es una suma o resta de varios términos algebraicos (monomios):
  - Para valorizar un polinomio con números enteros:
    - **Paso 1**: Sustituye las variables en cada término usando paréntesis.
    - **Paso 2**: Calcula el valor numérico de **cada término por separado** (respetando potencias y productos).
    - **Paso 3**: Suma o resta los valores de los términos para obtener el resultado final del polinomio.
  - **Ejemplo**: Valorizar el trinomio $2x^2 - 5x + 3$ para $x = -2$:
    - Término 1: $2(-2)^2 = 2(4) = \mathbf{8}$.
    - Término 2: $-5(-2) = \mathbf{+10}$.
    - Término 3: constante $\mathbf{+3}$.
    - Suma final: $8 + 10 + 3 = \mathbf{21}$.
explicacion_formal: |
  ### Definición formal
  Sea $P(x) = \sum_{i=0}^n a_i x^i$ un polinomio de grado $n$ con coeficientes $a_i \in \mathbb{Z}$. La **valorización sobre un entero** $z \in \mathbb{Z}$ es la suma finita de las evaluaciones individuales de sus $n+1$ términos:

  $$P(z) = a_n z^n + a_{n-1} z^{n-1} + \dots + a_1 z + a_0 = \sum_{i=0}^n a_i z^i$$

  ### Esquema de Horner para la Valorización Eficiente
  Para minimizar el número de multiplicaciones, la valorización de $P(z)$ puede expresarse en forma anidada mediante el algoritmo de Horner:

  $$P(z) = (\dots((a_n z + a_{n-1})z + a_{n-2})z + \dots + a_1)z + a_0$$

  ### Síntesis didáctica
  La valorización de polinomios permite evaluar funciones cuadráticas y cúbicas en modelos de trayectoria de proyectiles, costos totales y raíces polinómicas.
definiciones_clave: |
  - **Valorización de polinomio**: Evaluación de la suma algebraica de los términos componentes tras reemplazar las variables por enteros.
  - **Término independiente ($a_0$)**: Valor constante del polinomio que no depende de la variable y se conserva al sumar.
  - **Algoritmo de Horner**: Método optimizado de valorización por factorizaciones sucesivas de la variable.
propiedades_relaciones: |
  - **Raíz del polinomio**: Si la valorización de $P(z)$ produce un resultado estrictamente igual a $0$, entonces $z$ es una raíz o cero del polinomio.
  - **Suma de coeficientes**: La valorización del polinomio para $x = 1$ ($P(1)$) equivale exactamente a la suma de todos sus coeficientes numéricos.
ejemplo_guiado:
  enunciado: 'Calcula el valor del polinomio $x^3 - 4x^2 + 2x - 7$ para $x = -1$.'
  pasos:
    - 'Paso 1: Sustituimos $x = -1$ en cada término con paréntesis: $(-1)^3 - 4(-1)^2 + 2(-1) - 7$.'
    - 'Paso 2: Evaluamos la potencia $(-1)^3 = -1 \implies$ Término 1: $-1$.'
    - 'Paso 3: Evaluamos $-4(-1)^2 = -4(1) = -4 \implies$ Término 2: $-4$.'
    - 'Paso 4: Evaluamos $+2(-1) = -2 \implies$ Término 3: $-2$.'
    - 'Paso 5: Mantenemos la constante: $-7$.'
    - 'Paso 6: Sumamos todos los términos de números enteros negativos: $-1 - 4 - 2 - 7 = -14$.'
    - 'Conclusión: El valor numérico del polinomio es **$-14$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad matemática se cumple si la valorización de un polinomio $P(x)$ para $x = z$ da como resultado exactamente cero ($P(z) = 0$)?'
    choices:
      - {text: 'El valor $z$ es formalmente una raíz o cero del polinomio $P(x)$', is_correct: true}
      - {text: 'El polinomio es un polinomio nulo de grado cero', is_correct: false}
      - {text: 'La valorización es incorrecta por dar cero', is_correct: false}
      - {text: 'El valor $z$ debe ser un número primo', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor $z$ es formalmente una raíz o cero del polinomio $P(x)$''. Definición de raíz.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué equivale algebraicamente valorizar cualquier polinomio $P(x)$ reemplazando $x = 1$?'
    choices:
      - {text: 'Equivale exactamente a la suma de todos los coeficientes numéricos del polinomio', is_correct: true}
      - {text: 'Equivale al valor del término independiente únicamente', is_correct: false}
      - {text: 'Equivale al grado total del polinomio', is_correct: false}
      - {text: 'Equivale al producto de todas las variables', is_correct: false}
    explanation: 'La alternativa correcta es ''Equivale exactamente a la suma de todos los coeficientes numéricos del polinomio''. $P(1) = \sum a_i$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reemplazar la variable en cada término del polinomio utilizando paréntesis.'
  - 'Paso 2: Resolver las potencias de cada término respetando el signo de las bases negativas.'
  - 'Paso 3: Multiplicar los coeficientes por los resultados de las potencias correspondientes.'
  - 'Paso 4: Reducir la suma de números enteros finales agregando el término independiente.'
errores_correccion: |
  - **Error 1:** Cambiar el signo del término independiente al sustituir valores negativos. **Cómo corregirlo:** El término independiente **permanece inalterado ($a_0$)**, pues no posee variable para sustituir.
  - **Error 2:** Sumar coeficientes sin calcular las potencias de las variables. **Cómo corregirlo:** Debe **resolverse cada potencia antes de sumar** los términos del polinomio.
ejemplos:
  - titulo: 'Polinomio cuadrático'
    enunciado: '¿Cuál es el valor de $x^2 - 3x + 5$ para $x = -2$?'
    alternativas:
      - '$15$'
      - '$3$'
      - '$-5$'
    respuesta: '$15$'
    solucion_pasos:
      - '1. Sustitución: $(-2)^2 - 3(-2) + 5$.'
      - '2. Términos: $4 + 6 + 5 = 15$.'
  - titulo: 'Suma de coeficientes P(1)'
    enunciado: 'Para el polinomio $P(x) = 4x^3 - 2x^2 + 7x - 1$, ¿es $P(1) = 4 - 2 + 7 - 1 = 8$?'
    alternativas:
      - 'Sí, equivale a la suma directa de los coeficientes'
      - 'No, da cero'
      - 'No, da 28'
    respuesta: 'Sí, equivale a la suma directa de los coeficientes'
    solucion_pasos:
      - '1. $P(1) = 4(1)^3 - 2(1)^2 + 7(1) - 1 = 4 - 2 + 7 - 1 = 8$.'
  - titulo: 'Raíz del polinomio'
    enunciado: 'Para $P(x) = x^2 - 9$, si $x = 3 \implies 3^2 - 9 = 0$, ¿es $x = 3$ una raíz de $P(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por dar resultado cero en la valorización.'
  - titulo: 'Término independiente'
    enunciado: 'Para $x = 0$ en el polinomio $P(x) = 5x^2 - 8x + 12$, ¿resulta la valorización igual a $12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $5(0)^2 - 8(0) + 12 = 12$.'
errores_frecuentes:
  - 'Alterar el signo del término independiente al sustituir valores negativos en las variables.'
  - 'Sumar directamente los coeficientes numéricos sin calcular las potencias de la variable.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Declarar que valorizar un polinomio en x = 0 invalida el término constante.'
  - 'La multiplicación entre el coeficiente y la potencia de cada término no se ejecuta.'
afirmaciones_verdaderas:
  - 'La valorización de un polinomio se calcula mediante la suma algebraica del valor numérico de cada uno de sus términos.'
  - 'La valorización de cualquier polinomio P(x) en x = 0 da siempre como resultado el término independiente.'
al_terminar_debes_poder: 'Valorizar polinomios sustituyendo variables por números enteros y sumando algebraicamente sus términos para hallar el valor final.'
