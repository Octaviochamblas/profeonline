procedimiento:
- 'Paso 1: Sustituye la variable en cada término del polinomio.'
- 'Paso 2: Resuelve las potencias y multiplicaciones dentro de cada término individual.'
- 'Paso 3: Reescribe el polinomio completo solo con los resultados numéricos de cada
  término y sus signos originales.'
- 'Paso 4: Realiza las sumas y restas finales de izquierda a derecha.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  valorización de polinomios con números enteros.
ejemplos:
- titulo: El tren polinómico
  enunciado: Valora 3a^2 - 2a + 1 para a=5.
  solucion_pasos:
  - 'Sustitución: 3(5)^2 - 2(5) + 1.'
  - 'Primer término: 3(25) = 75.'
  - 'Segundo término: 2(5) = 10.'
  - 'Reescribiendo: 75 - 10 + 1.'
  - 'Resultado: 65 + 1 = 66.'
- titulo: La altura $h$ de un proyectil en función del tiempo $t$ está dada por el
    polinomio $h(t) = 5
  enunciado: 'La altura $h$ de un proyectil en función del tiempo $t$ está dada por
    el polinomio $h(t) = 50t - 5t^2$. Si se quiere conocer la altura exacta al los
    $4$ segundos de vuelo, ¿qué cálculo debe realizarse? (v1)


    Opciones: A) $120$ metros. · B) $200$ metros. · C) $40$ metros. · D) $80$ metros.'
  solucion_pasos:
  - 'Evaluamos el polinomio en $t=4$: $50(4) - 5(4)^2$. Primer vagón: $200$. Segundo
    vagón: $5(16) = 80$. Diferencia: $200 - 80 = 120$.'
  - 'Respuesta: $120$ metros.'
- titulo: 'Respecto de «Valorización de polinomios con números enteros»: ¿La siguiente
    formulación es c'
  enunciado: 'Respecto de «Valorización de polinomios con números enteros»: ¿La siguiente
    formulación es correcta? «Al valorizar un **Polinomio**, se debe evaluar cada
    término (monomio) de forma independiente respetando la jerarquía de operaciones,
    y **al final se realizan las sumas y restas** que conectan a los términos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al valorizar un **Polinomio**,
    se debe evaluar cada término (monomio) de forma independiente respetando la jerarquía
    de operaciones, y **al final se realizan las sumas y restas** que conectan a los
