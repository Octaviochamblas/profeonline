semantic_id: MAT.GEO.TRIG_RECIPROCAS.COSECANTE_DEFINICION
resumen_inicial: 'Definición de cosecante de un ángulo agudo como hipotenusa sobre
  cateto opuesto: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: 'La cosecante es simplemente el seno ''puesto al revés'': en vez
  de cateto opuesto sobre hipotenusa, es hipotenusa sobre cateto opuesto.'
explicacion_formal: '![Definición de cosecante](/static/img/geometria/trigonometria/razon-cosecante-definicion.svg)


  ### Definición formal


  La cosecante de $\theta$ se define como $\csc\theta=\dfrac{\text{hipotenusa}}{\text{cateto
  opuesto}}$, es decir, el recíproco (inverso multiplicativo) del seno: $\csc\theta=\dfrac{1}{\sin\theta}$.


  ### Desarrollo didáctico


  Si $\sin\theta=0{,}6$ (es decir, cateto opuesto=3, hipotenusa=5), entonces $\csc\theta=\dfrac{5}{3}\approx1{,}67$,
  el recíproco exacto de $0{,}6$.'
definiciones_clave: '- **Definición de cosecante de un ángulo agudo como hipotenusa
  sobre cateto opuesto**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
