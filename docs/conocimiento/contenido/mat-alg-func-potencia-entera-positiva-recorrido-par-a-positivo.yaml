semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_PAR_A_POSITIVO
resumen_inicial: 'El conjunto recorrido de una función potencia de exponente entero par positivo con coeficiente positivo ($a > 0$) son los reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$.'
explicacion_simple: |
  En una función potencia con exponente par (como $x^2, x^4, x^6$) y coeficiente positivo (como $a = 3$), cualquier número real al elevarse a una potencia par se convierte en cero o en un número positivo. Al multiplicarlo luego por el coeficiente positivo $a$, el resultado jamás podrá ser negativo. La menor altura posible en la gráfica es cero (en el origen $(0, 0)$), y desde ahí la curva sube ilimitadamente hacia arriba. Por ende, su recorrido son los números reales mayores o iguales a cero: $[0, +\infty[$.
explicacion_formal: |
  ### Definición formal
  Para toda función potencia $f(x) = a x^n$ definida en $\mathbb{R}$ con exponente par positivo $n = 2k (k \in \mathbb{Z}^+)$ y coeficiente estrictamente positivo **$a > 0$**, el **conjunto recorrido o conjunto imagen** está acotado inferiormente por cero:
  $$\operatorname{Rec}(f) = [0, +\infty[ = \{y \in \mathbb{R} \mid y \ge 0\}$$

  ### Demostración analítica
  1. **Acotación inferior**: Dado que $x^{2k} \ge 0$ para todo $x \in \mathbb{R}$ y $a > 0$, el producto $a x^{2k} \ge 0$ para todo $x$. El valor mínimo absoluto es $f(0) = a(0)^{2k} = 0$.
  2. **Divergencia superior**: Cuando $x \to \pm\infty$, $f(x) \to +\infty$.
  3. **Continuidad e Invarianza por el Teorema del Valor Intermedio**: Al ser $f$ continua en $\mathbb{R}$ con mínimo en 0 y límite en $+\infty$, la función adopta todos los valores del intervalo cerrado $[0, +\infty[$.

  ### Síntesis didáctica
  Relación de cota: El vértice $(0, 0)$ actúa como el **mínimo absoluto global** de la función, fijando la cota inferior cerrada $[0$ del intervalo recorrido.
definiciones_clave: |
  - **Recorrido $[0, +\infty[$**: Conjunto de valores de salida $y$ mayores o iguales a cero.
  - **Mínimo absoluto global**: Punto $(0, 0)$ donde la función alcanza su menor ordenada posible $y = 0$.
  - **Acotación inferior**: Propiedad por la cual la función no adopta valores reales estrictamente negativos ($y < 0$).
propiedades_relaciones: |
  - **Independencia del grado par**: El conjunto recorrido $[0, +\infty[$ es exactamente idéntico para $f(x) = x^2$, $g(x) = 5x^4$ o $h(x) = 0.1x^6$, siempre que $a > 0$.
  - **Efecto de traslaciones verticales**: Si se suma una constante $k$ ($f(x) = a x^{2m} + k$), el recorrido se desplaza al intervalo $[k, +\infty[$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de las funciones potencia $f(x) = 4x^2$ y $g(x) = \frac{1}{2}x^6$, justificando a partir del valor de su mínimo absoluto.'
  pasos:
    - 'Paso 1: Para $f(x) = 4x^2$, $n = 2$ es par y $a = 4 > 0$. Evaluando en $x = 0$: $f(0) = 4(0)^2 = 0$. Para todo $x \neq 0$, $f(x) > 0$. Recorrido: $\operatorname{Rec}(f) = [0, +\infty[$.'
    - 'Paso 2: Para $g(x) = \frac{1}{2}x^6$, $n = 6$ es par y $a = 0.5 > 0$. Evaluando en $x = 0$: $g(0) = 0$. Para todo $x \neq 0$, $g(x) > 0$. Recorrido: $\operatorname{Rec}(g) = [0, +\infty[$.'
    - 'Paso 3: Conclusión: En ambas funciones, el mínimo absoluto se ubica en $y = 0$, determinando el intervalo recorrido de los reales no negativos $[0, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función potencia $f(x) = 6x^4$ con exponente par positivo y coeficiente positivo $a = 6 > 0$?'
    choices:
      - {text: 'El intervalo de reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$', is_correct: true}
      - {text: 'El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
      - {text: 'El intervalo de reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$', is_correct: false}
      - {text: 'El intervalo abierto $]6, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo de reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$''. Con exponente par y $a > 0$, las ordenadas $y$ son siempre mayores o iguales a cero.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $f(x) = 3x^2$ jamás puede arrojar como resultado un valor negativo como $y = -5$?'
    choices:
      - {text: 'Porque para todo $x \in \mathbb{R}$, $x^2 \ge 0$, y al multiplicarlo por $a = 3 > 0$, la salida es siempre $y \ge 0$', is_correct: true}
      - {text: 'Porque el número $-5$ no pertenece al dominio', is_correct: false}
      - {text: 'Porque las funciones potencia solo se pueden evaluar en números positivos', is_correct: false}
      - {text: 'Porque el coeficiente 3 elimina los valores negativos del dominio', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque para todo $x \in \mathbb{R}$, $x^2 \ge 0$, y al multiplicarlo por $a = 3 > 0$, la salida es siempre $y \ge 0$''. La potencia par garantiza la no negatividad.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que el exponente $n$ sea un número entero positivo par ($n = 2, 4, 6\dots$).'
  - 'Paso 2: Comprobar que el coeficiente multiplicativo sea estrictamente positivo ($a > 0$).'
  - 'Paso 3: Identificar el mínimo absoluto en el punto cartesiano $(0, 0)$ donde $f(0) = 0$.'
  - 'Paso 4: Declarar que el conjunto recorrido es el intervalo cerrado por la izquierda $\operatorname{Rec}(f) = [0, +\infty[$.'
errores_correccion: |
  - **Error 1:** Escribir el recorrido con intervalo abierto en cero $]0, +\infty[$. **Cómo corregirlo:** El valor cero sí se alcanza en el origen $f(0) = 0$. El corchete en el cero debe ser cerrado: $[0, +\infty[$.
  - **Error 2:** Confundir el recorrido con todos los números reales $\mathbb{R}$. **Cómo corregirlo:** Las funciones de exponente par con $a > 0$ no adoptan valores de salida negativos. Su recorrido son únicamente los reales no negativos $[0, +\infty[$.
ejemplos:
  - titulo: 'Recorrido en exponente par mónico'
    enunciado: '¿El recorrido de $f(x) = x^4$ es $[0, +\infty[$?'
    alternativas:
      - 'Sí, $[0, +\infty[$'
      - 'No, es $\mathbb{R}$'
      - 'No, es $]0, +\infty[$'
    respuesta: 'Sí, $[0, +\infty[$'
    solucion_pasos:
      - '1. Exponente par $n = 4$ y $a = 1 > 0$.'
      - '2. El mínimo es $y = 0 \implies \operatorname{Rec}(f) = [0, +\infty[$.'
  - titulo: 'Recorrido con coeficiente decimal positivo'
    enunciado: '¿La función $g(x) = 0.5 x^2$ tiene recorrido $[0, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = 0.5 > 0$ y $n=2$ par, $\operatorname{Rec}(g) = [0, +\infty[$.'
  - titulo: 'Imposibilidad de salidas negativas'
    enunciado: '¿Existe algún $x \in \mathbb{R}$ tal que $f(x) = 2x^6 = -10$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Puesto que el recorrido es $[0, +\infty[$, el valor $-10$ no posee preimagen real.'
  - titulo: 'Cota inferior en el origen'
    enunciado: '¿El punto $(0, 0)$ marca el valor mínimo del recorrido de $f(x) = 8x^4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(0) = 0$ es el valor mínimo alcanzado en la función.'
errores_frecuentes:
  - 'El conjunto recorrido de la función potencia $f(x) = 3x^2$ es todo el conjunto $\mathbb{R}$.'
  - 'El recorrido de $f(x) = x^4$ es el intervalo abierto $]0, +\infty[$ excluyendo al cero.'
  - 'Una función potencia de exponente par con $a > 0$ puede arrojar resultados negativos si la entrada $x$ es negativa.'
  - 'El coeficiente $a = 5$ cambia el valor mínimo del recorrido a $y = 5$.'
  - 'El recorrido de $f(x) = 2x^6$ depende del valor asignado a la variable $x$.'
afirmaciones_verdaderas:
  - 'El conjunto recorrido de toda función potencia de exponente entero par positivo con $a > 0$ es el conjunto de los reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$.'
  - 'El origen $(0, 0)$ representa el mínimo absoluto global de la función, fijando la cota inferior cerrada del recorrido en $y = 0$.'
al_terminar_debes_poder: 'Determinar y justificar el conjunto recorrido $[0, +\infty[$ para funciones potencia de exponente par y coeficiente positivo.'
