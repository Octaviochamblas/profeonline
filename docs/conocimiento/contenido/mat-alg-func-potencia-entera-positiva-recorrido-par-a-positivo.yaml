semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_PAR_A_POSITIVO
resumen_inicial: 'Determinación del recorrido para exponente par positivo y a > 0:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento con
  exponente entero positivo.'
explicacion_simple: Cuando el coeficiente es positivo y el exponente es par, la función
  nunca produce resultados negativos, así que su recorrido queda limitado a los valores
  no negativos.
explicacion_formal: '### Definición formal


  Para $n$ par y $a>0$, $x^n\geq0$ para todo $x$, así que $f(x)=a\cdot x^n\geq0$.
  El mínimo se alcanza en $f(0)=0$, y como $f(x)\to+\infty$ cuando $|x|\to\infty$,
  la función toma todos los valores desde $0$ en adelante: el recorrido es $[0,+\infty)$.


  ### Desarrollo didáctico


  $f(x)=2x^2$ tiene valores $f(0)=0$, $f(1)=2$, $f(-1)=2$, $f(2)=8$: nunca aparece
  un resultado negativo, y el valor $0$ sí se alcanza exactamente en $x=0$.'
definiciones_clave: '- **Determinación del recorrido para exponente par positivo y
  a > 0**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a determinación del recorrido para exponente par positivo y
  a > 0.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de determinación del recorrido para exponente par positivo y a > 0.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de determinación del recorrido
    para exponente par positivo y a > 0.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
