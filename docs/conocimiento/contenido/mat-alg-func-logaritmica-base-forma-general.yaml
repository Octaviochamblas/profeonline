semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.FORMA_GENERAL
resumen_inicial: 'La forma general de la función logarítmica es $f(x) = a \cdot \log_b(cx + d) + k$, donde cada parámetro transforma la posición, escala y orientación de la curva.'
explicacion_simple: |
  Una función logarítmica general puede tener varios números acompañando a la expresión básica. En la fórmula $f(x) = a \cdot \log_b(cx + d) + k$, la base $b$ decide si la curva sube o baja; el número de adelante $a$ la estira verticalmente o la voltea patas arriba si es negativo; los números dentro del paréntesis $c$ y $d$ mueven la asíntota vertical hacia los lados; y el número sumado al final $k$ la sube o baja verticalmente.
explicacion_formal: |
  ### Definición formal
  La **expresión canónica de la función logarítmica transformada** $f: D \to \mathbb{R}$ viene dada por la ecuación paramétrica de cinco coeficientes:
  $$f(x) = a \cdot \log_b(cx + d) + k$$
  donde:
  - $a \in \mathbb{R} \setminus \{0\}$: Coeficiente de **dilatación/contracción y reflexión vertical**.
  - $b \in \mathbb{R}^+ \setminus \{1\}$: **Base logarítmica**.
  - $c \in \mathbb{R} \setminus \{0\}$: Coeficiente de **escala horizontal** (afecta la asíntota).
  - $d \in \mathbb{R}$: Coeficiente de **desfase u horizontalidad**.
  - $k \in \mathbb{R}$: Coeficiente de **traslación vertical**.

  ### Desglose simbólico
  - Determinación de la Asíntota Vertical: Ocurre en la anulación del argumento: $cx + d = 0 \implies x = -\frac{d}{c}$.
  - Determinación del Dominio de definición:
    - Si $c > 0 \implies cx + d > 0 \implies x > -\frac{d}{c} \implies \operatorname{Dom}(f) = ]-\frac{d}{c}, +\infty[$.
    - Si $c < 0 \implies cx + d > 0 \implies x < -\frac{d}{c} \implies \operatorname{Dom}(f) = ]-\infty, -\frac{d}{c}[$.

  ### Síntesis didáctica
  Identificar los parámetros por su ubicación: $a$ multiplica por fuera, $b$ es la base del subíndice, $c$ multiplica a $x$, $d$ suma/resta dentro del paréntesis, y $k$ suma/resta al final por fuera.
definiciones_clave: |
  - **Forma general $a \cdot \log_b(cx + d) + k$**: Expresión algebraicamente completa de la familia de funciones logarítmicas.
  - **Asíntota vertical $x = -d/c$**: Recta límite donde el argumento de la función se anula.
  - **Ampliación vertical $a$**: Factor multiplicativo que escala la altura de cada punto.
propiedades_relaciones: |
  - **Invariancia del recorrido**: La traslación $k$ y el escalado $a$ modifican la gráfica pero el recorrido de la función logarítmica sigue siendo $\operatorname{Rec}(f) = \mathbb{R}$.
  - **Desplazamiento de la asíntota**: La asíntota vertical pasa de la recta $x = 0$ (en la forma básica) a la recta $x = -\frac{d}{c}$.
ejemplo_guiado:
  enunciado: 'Para la función logarítmica general $f(x) = -3 \cdot \log_2(4x - 8) + 5$, identifica los cinco parámetros $(a, b, c, d, k)$, halla la ecuación de su asíntota vertical y su dominio de definición.'
  pasos:
    - 'Paso 1: Identificamos los coeficientes: $a = -3$, $b = 2$, $c = 4$, $d = -8$, $k = 5$.'
    - 'Paso 2: La asíntota vertical se obtiene igualando el argumento a cero: $4x - 8 = 0 \implies 4x = 8 \implies x = 2$. Asíntota: recta $x = 2$.'
    - 'Paso 3: Para el dominio, exigimos argumento estrictamente positivo: $4x - 8 > 0 \implies 4x > 8 \implies x > 2$.'
    - 'Paso 4: El dominio es el intervalo $\operatorname{Dom}(f) = ]2, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función logarítmica $f(x) = 4 \cdot \ln(3x + 15) - 7$, ¿cuál es la ecuación de su asíntota vertical?'
    choices:
      - {text: 'La recta vertical de ecuación $x = -5$, obtenida al resolver $3x + 15 = 0$', is_correct: true}
      - {text: 'La recta horizontal de ecuación $y = -7$', is_correct: false}
      - {text: 'La recta vertical de ecuación $x = 4$', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = -5$, obtenida al resolver $3x + 15 = 0$''. La asíntota vertical ocurre en el valor de $x$ que anula el argumento del logaritmo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son los valores de los parámetros $a$ y $k$ en la función logarítmica $g(x) = -0.5 \cdot \log_3(x - 2) + 9$?'
    choices:
      - {text: '$a = -0.5$ y $k = 9$', is_correct: true}
      - {text: '$a = 3$ y $k = -2$', is_correct: false}
      - {text: '$a = 9$ y $k = -0.5$', is_correct: false}
      - {text: '$a = -2$ y $k = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -0.5$ y $k = 9$''. El parámetro de escala es el coeficiente exterior $a = -0.5$ y la traslación vertical es la constante aditiva $k = 9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comparar la función dada con la estructura canónica $f(x) = a \cdot \log_b(cx + d) + k$.'
  - 'Paso 2: Extraer en orden los cinco parámetros $(a, b, c, d, k)$.'
  - 'Paso 3: Calcular la asíntota vertical resolviendo la ecuación lineal $cx + d = 0$.'
  - 'Paso 4: Deducir el dominio exigiendo $cx + d > 0$.'
errores_correccion: |
  - **Error 1:** Confundir el parámetro de traslación vertical $k$ con la asíntota vertical. **Cómo corregirlo:** La asíntota de la función logarítmica es siempre una recta **vertical** de ecuación $x = -d/c$ dada por el argumento. La constante $k$ traslada la curva verticalmente pero no altera la posición de la asíntota vertical.
  - **Error 2:** Olvidar que el signo del coeficiente $c$ determina el lado del dominio. **Cómo corregirlo:** Si $c > 0$, el dominio se extiende a la derecha de la asíntota $]x_{asint}, +\infty[$. Si $c < 0$, se extiende a la izquierda $]-\infty, x_{asint}[$.
ejemplos:
  - titulo: 'Identificación de parámetros'
    enunciado: 'En $f(x) = 2 \cdot \log(x + 4)$, ¿cuál es la asíntota vertical?'
    alternativas:
      - 'La recta $x = -4$'
      - 'La recta $x = 4$'
      - 'La recta $y = 2$'
    respuesta: 'La recta $x = -4$'
    solucion_pasos:
      - '1. Igualamos el argumento a cero: $x + 4 = 0 \implies x = -4$.'
      - '2. La asíntota es la recta $x = -4$.'
  - titulo: 'Parametrización con coeficiente negativo en x'
    enunciado: 'Para $g(x) = \ln(6 - 2x)$, ¿la asíntota vertical es $x = 3$ y el dominio es $]-\infty, 3[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $6 - 2x = 0 \implies x = 3$. Exigiendo $6 - 2x > 0 \implies 2x < 6 \implies x < 3$. Dominio: $]-\infty, 3[$.'
  - titulo: 'Forma mónica estándar'
    enunciado: 'En $f(x) = \log_5(x)$, ¿los parámetros son $a = 1, b = 5, c = 1, d = 0, k = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la forma logarítmica mónica básica.'
  - titulo: 'Efecto de la escala vertical'
    enunciado: '¿Multiplicar la función por $a = -1$ en $f(x) = -\log_2(x)$ refleja la curva respecto al eje $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Un coeficiente $a < 0$ invierte los valores de salida reflejando la gráfica de arriba hacia abajo.'
errores_frecuentes:
  - 'La asíntota de la función logarítmica general $f(x) = a \cdot \log_b(cx + d) + k$ es la recta horizontal $y = k$.'
  - 'El coeficiente $a$ altera la posición de la asíntota vertical de la función logarítmica.'
  - 'La asíntota vertical de la función $f(x) = \ln(x - 5)$ es la recta $x = 5$, y su recorrido son únicamente los números positivos.'
  - 'Si el coeficiente $d$ es positivo, la asíntota vertical se desplaza hacia la derecha del plano cartesiano.'
  - 'La base $b$ de la función logarítmica general puede tomar valores reales negativos si el coeficiente $a$ es negativo.'
afirmaciones_verdaderas:
  - 'En la forma general $f(x) = a \cdot \log_b(cx + d) + k$, la asíntota vertical viene dada unívocamente por la recta de ecuación $x = -\frac{d}{c}$.'
  - 'Los parámetros $a$ y $k$ modifican la escala y traslación vertical de la curva pero conservan el recorrido de la función logarítmica en todo $\mathbb{R}$.'
