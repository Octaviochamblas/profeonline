semantic_id: MAT.GEO.CUERPOS_REDONDOS_BASE.CILINDRO_POR_ROTACION
resumen_inicial: 'Generación del cilindro como sólido de revolución: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Si tomas un rectángulo y lo giras rápidamente alrededor de uno
  de sus lados, el barrido que genera en el espacio forma un cilindro.
explicacion_formal: '![Generación del cilindro por rotación](/static/img/geometria/espacio-cuerpos/cilindro-por-rotacion.svg)


  ### Definición formal


  Al rotar un rectángulo de lados $b$ y $h$ 360° alrededor del lado $h$ (que actúa
  como eje), se genera un cilindro cuya altura es $h$ y cuyo radio de las bases es
  $b$ (el lado perpendicular al eje).


  ### Desarrollo didáctico


  En la figura, el rectángulo resaltado gira alrededor del eje vertical (uno de sus
  lados), ''barriendo'' el espacio y generando el cilindro mostrado a la derecha.
  El lado del rectángulo usado como eje se convierte en la altura del cilindro, y
  el otro lado (perpendicular) se convierte en el radio.'
definiciones_clave: '- **Generación del cilindro como sólido de revolución**: Elemento
  o propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a generación del cilindro como sólido de revolución.'
