procedimiento:
- 'Paso 1: Identifica el rectángulo generador y cuál de sus lados actuará como eje
  de rotación.'
- 'Paso 2: Reconoce que el lado usado como eje se convierte en la altura (h) del cilindro.'
- 'Paso 3: Reconoce que el lado perpendicular al eje se convierte en el radio (r)
  de las bases del cilindro.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con generación del cilindro como sólido de revolución.
