resumen_inicial: Dos o más términos son no semejantes cuando sus partes literales
  difieren en las variables contenidas o en los exponentes de sus variables homólogas.
explicacion_simple: Los términos no semejantes son aquellos de 'distinta especie'
  que NO se pueden sumar ni restar en un solo bloque. Por ejemplo, $3x$ y $5y$ no
  son semejantes (tienen distintas letras). Tampoco lo son $4x^2$ y $4x^3$ (tienen
  distinta potencia). Se deben dejar escritos separados.
explicacion_formal: 'Dados dos términos $T_1 = c_1 L_1$ y $T_2 = c_2 L_2$, son **Términos
  No Semejantes** ($T_1 \not\sim T_2$) si y solo si sus partes literales son distintas:


  $$T_1 \not\sim T_2 \iff L_1 \neq L_2 \iff \exists j \quad / \quad \text{Exp}(x_j,
  T_1) \neq \text{Exp}(x_j, T_2) \quad \lor \quad X_1 \neq X_2$$


  > **Complemento didáctico:** La no semejanza impide la combinación aditiva escalar
  de los coeficientes en la reducción polinomial.'
definiciones_clave: '- **Términos no semejantes**: Términos con partes literales diferentes
  que no pueden ser reducidos aditivamente.'
propiedades_relaciones: '- **Irreducibilidad aditiva**: $c_1 L_1 + c_2 L_2$ no se
  puede simplificar a un solo monomio si $L_1 \neq L_2$.'
ejemplo_guiado:
  enunciado: Demuestre por qué los términos $T_1 = 5x^3y^2$ y $T_2 = 5x^2y^3$ no son
    semejantes.
  pasos:
  - 'Paso 1: Parte literal de $T_1$: $L_1 = x^3y^2$.

    - Paso 2: Parte literal de $T_2$: $L_2 = x^2y^3$.'
  - 'Paso 3: Comparar exponentes homólogos de $x$: $3 \neq 2$.

    - Paso 4: Comparar exponentes homólogos de $y$: $2 \neq 3$.'
  - 'Conclusión: Dado que sus exponentes homólogos difieren, $L_1 \neq L_2$, luego
    son términos no semejantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué consecuencia directa tiene la no semejanza entre dos términos respecto
    a la suma o resta?
  choices:
  - text: Que los términos no se pueden combinar o reducir en un único monomio aditivo
    is_correct: true
  - text: Que la expresión se vuelve igual a cero de inmediato
    is_correct: false
  - text: Que se deben multiplicar sus exponentes
    is_correct: false
  - text: Que los coeficientes se eliminan
    is_correct: false
  explanation: La alternativa correcta es 'Que los términos no se pueden combinar
    o reducir en un único monomio aditivo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5x^3y^2 y 5x^2y^3, ¿por qué se demostró que
    no son semejantes a pesar de tener el mismo coeficiente 5?
  choices:
  - text: Porque los exponentes de las variables homólogas difieren (x^3 != x^2 y
      y^2 != y^3)
    is_correct: true
  - text: Porque el número 5 es primo
    is_correct: false
  - text: Porque ambos son positivos
    is_correct: false
  - text: Porque falta una constante
    is_correct: false
  explanation: La alternativa correcta es 'Porque los exponentes de las variables
    homólogas difieren (x^3 != x^2 y y^2 != y^3)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer las partes literales de ambos términos.'
- 'Paso 2: Identificar las variables o exponentes que sean diferentes.'
- 'Paso 3: Declarar que los términos no son semejantes y no se pueden reducir aditivamente.'
errores_correccion: '- **Error 1: Intentar sumar términos no semejantes como $3x +
  2y = 5xy$.** **Cómo corregirlo:** Términos no semejantes no se pueden fusionar;
  $3x + 2y$ se deja expresado como un binomio irreducible.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes parejas está formada por términos NO semejantes?
  alternativas:
  - 4x^2 y 4x^3
  - 5ab^2 y -2ab^2
  - 9xy y 3yx
  - -a^3 y 8a^3
  respuesta: 4x^2 y 4x^3
  solucion_pasos:
  - 1. 4x^2 y 4x^3 tienen exponentes distintos (2 != 3). No son semejantes.
- titulo: Ejemplo 2
  enunciado: ¿Se puede reducir la suma 7a + 3b a un solo término monómico?
  alternativas:
  - No, porque 7a y 3b son términos no semejantes (letras distintas)
  - Sí, es igual a 10ab
  - Sí, es igual a 21ab
  - Indeterminado
  respuesta: No, porque 7a y 3b son términos no semejantes (letras distintas)
  solucion_pasos:
  - 1. Al tener partes literales distintas a != b, no se pueden reducir aditivamente.
- titulo: ¿Es la suma 5x^2 + 2x irreducible a un solo monomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, x^2 y x^1 son términos no semejantes y permanecen separados.
- titulo: ¿Son semejantes los términos 8u^3v y 8u^3?
  respuesta: 'No'
  solucion_pasos:
  - No, el primer término contiene la variable v y el segundo no.
errores_frecuentes:
- Sumar o restar coeficientes de términos no semejantes creando un monomio incorrecto
  (como 2a + 3b = 5ab).
- Declarar semejantes a términos que sólo coinciden en tener coeficientes numéricos
  iguales.
- Ignorar la falta de una variable en uno de los términos al verificar semejanzas.
- Declarar que la diferencia de exponentes no afecta a la semejanza si las letras
  son iguales.
- Declarar la multiplicación de términos con la adición de términos no semejantes.
afirmaciones_verdaderas:
- Términos no semejantes tienen partes literales distintas y no se pueden reducir
  aditivamente.
- La expresión resultante de sumar términos no semejantes es un polinomio irreducible.
al_terminar_debes_poder: Al terminar serás capaz de identificar términos no semejantes
  evitando reducirlos de forma errónea en la adición y sustracción.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.
estado: publicado
