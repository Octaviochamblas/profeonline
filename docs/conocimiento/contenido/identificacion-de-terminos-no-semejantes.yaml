semantic_id: MAT.ALG.SIMILARIDAD.TERMINOS_NO_SEMEJANTES
resumen_inicial: La identificación de términos no semejantes consiste en discriminar monomios que difieren en sus variables o en los exponentes asignados a ellas, lo que impide su reducción mediante adición o sustracción.
explicacion_simple: "Dos o más términos algebraicos son **términos NO semejantes** cuando sus factores literales **NO son idénticos**:\n- **Razones para NO ser semejantes**:\n  1. **Tienen letras distintas**: Ej: $3x$ y $3y$ (una variable es $x$ y la otra es $y$).\n  2. **Tienen exponentes distintos en las mismas letras**: Ej: $5x^2$ y $5x^3$ (exponente 2 vs exponente 3).\n  3. **Tienen distinta cantidad de variables**: Ej: $4a b$ y $4a$ (uno tiene $b$ y el otro no).\n- **Consecuencia fundamental en álgebra**:\n  - Los términos NO semejantes **NO SE PUEDEN SUMAR NI RESTAR** para juntarse en un solo término.\n  - La expresión $3x + 3y$ se queda exactamente así: **$3x + 3y$**.\n\n![Identificación de Términos No Semejantes](/static/img/nodos/identificacion-de-terminos-no-semejantes-intro.svg)\n"
explicacion_formal: '### Definición formal

  Dos monomios $M_1 = c_1 \prod x_i^{a_i}$ y $M_2 = c_2 \prod y_j^{b_j}$ son **no semejantes** ($M_1 \not\sim M_2$) si sus factores literales pertenecen a clases de equivalencia disjuntas en la partición de $\mathcal{M}$:


  $$M_1 \not\sim M_2 \iff FL(M_1) \neq FL(M_2) \iff \operatorname{Vars}(M_1) \neq \operatorname{Vars}(M_2) \quad \lor \quad \exists i \mid \deg_{x_i}(M_1) \neq \deg_{x_i}(M_2)$$


  ### Imposibilidad de Reducción Aditiva (Espacios Vectoriales)

  En el espacio vectorial de polinomios $\mathbb{R}[x_1, \dots, x_k]$, dos términos no semejantes $M_1$ y $M_2$ constituyen elementos linealmente independientes. Por ende, su combinación lineal no nula jamás puede simplificarse a un único monomio:


  $$\forall c_1, c_2 \in \mathbb{R} \setminus \{0\}, \quad c_1 M_1 + c_2 M_2 \neq c_3 M_3 \quad (\text{para todo monomio } M_3)$$


  ### Síntesis didáctica

  Reconocer términos no semejantes previene la simplificación forzada de polinomios no reducibles como $x^2 + x$.

  '
definiciones_clave: '- **Términos no semejantes**: Monomios cuyos factores literales difieren en variables, número de letras o exponentes.

  - **Independencia lineal monomial**: Imposibilidad de fusionar términos de distinta clase literal mediante suma o resta.

  - **Polinomio irreducible por términos**: Expresión donde todos sus términos son mutuamente no semejantes.

  '
propiedades_relaciones: '- **Conservación de términos en sumas**: La suma de términos no semejantes da como resultado un polinomio no simplificable ($a + b$).

  - **Corte de la relación de equivalencia**: La no semejanza es una relación simétrica e irreflexiva.

  '
ejemplo_guiado:
  enunciado: Determina si los términos $6x^3 y$ y $6x y^3$ son semejantes o no semejantes y explica por qué.
  pasos:
  - 'Paso 1: Analizamos el factor literal del primer término: $FL(T_1) = x^3 y$ ($x$ al cubo, $y$ a la uno).'
  - 'Paso 2: Analizamos el factor literal del segundo término: $FL(T_2) = x y^3$ ($x$ a la uno, $y$ al cubo).'
  - 'Paso 3: Comparamos los exponentes de $x$: En el primero es $3$ y en el segundo es $1$ ($3 \neq 1$).'
  - 'Paso 4: Comparamos los exponentes de $y$: En el primero es $1$ y en el segundo es $3$ ($1 \neq 3$).'
  - 'Conclusión: Los términos **NO SON SEMEJANTES** porque sus exponentes no coinciden variable por variable, y no se pueden reducir por suma.'
  imagen: /static/img/nodos/identificacion-de-terminos-no-semejantes-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre al intentar sumar dos términos no semejantes como $4x + 4y$?
  choices:
  - text: La suma no se puede reducir a un solo término y la expresión se conserva como $4x + 4y$
    is_correct: true
  - text: Se suman los coeficientes y las letras dando $8xy$
    is_correct: false
  - text: Se multiplican las letras dando $4xy$
    is_correct: false
  - text: Se eliminan los coeficientes dando $x + y$
    is_correct: false
  explanation: La alternativa correcta es 'La suma no se puede reducir a un solo término y la expresión se conserva como $4x + 4y$'. Términos no semejantes no se reducen.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Son semejantes los términos $3a^2$ y $3a$?
  choices:
  - text: No son semejantes, porque el primer término tiene exponente 2 y el segundo tiene exponente 1
    is_correct: true
  - text: Sí son semejantes, porque ambos tienen la variable $a$ y coeficiente 3
    is_correct: false
  - text: Sí son semejantes, porque se pueden sumar como $6a^3$
    is_correct: false
  - text: No son semejantes, porque uno es positivo y el otro negativo
    is_correct: false
  explanation: La alternativa correcta es 'No son semejantes, porque el primer término tiene exponente 2 y el segundo tiene exponente 1'. Exponentes distintos 2 vs 1.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los factores literales de cada uno de los monomios.'
- 'Paso 2: Comprobar si hay letras distintas en los términos.'
- 'Paso 3: Comprobar si los exponentes de las letras iguales difieren.'
- 'Paso 4: Si se detecta cualquier diferencia en letras o exponentes, clasificar como términos no semejantes.'
errores_correccion: '- **Error 1:** Forzar la suma de términos no semejantes (escribir $2x + 3y = 5xy$). **Cómo corregirlo:** Términos no semejantes **NO SE PUEDEN JUNTAR EN SUMA ($2x + 3y$ se mantiene tal cual)**.

  - **Error 2:** Sumar exponentes al intentar reducir términos de diferente grado (escribir $x^2 + x^3 = x^5$). **Cómo corregirlo:** Se **conservan como binomio $x^2 + x^3$**; la suma de exponentes sólo se hace al multiplicar ($x^2 \cdot x^3 = x^5$).

  '
ejemplos:
- titulo: Variables distintas
  enunciado: ¿Son semejantes $7x$ y $7y$?
  alternativas:
  - No, porque tienen variables distintas ($x$ e $y$)
  - Sí, porque tienen el mismo coeficiente 7
  - Sí, porque ambas son de grado 1
  respuesta: No, porque tienen variables distintas ($x$ e $y$)
  solucion_pasos:
  - '1. Variable 1: $x$. Variable 2: $y$.'
  - 2. Términos no semejantes.
- titulo: Exponentes distintos
  enunciado: ¿Son semejantes $5m^3$ y $5m^2$?
  alternativas:
  - No, porque sus exponentes $3$ y $2$ no coinciden
  - Sí, porque comparten la variable m
  - Sí, se pueden sumar como $10m^5$
  respuesta: No, porque sus exponentes $3$ y $2$ no coinciden
  solucion_pasos:
  - '1. Exponente 1: $3$. Exponente 2: $2$.'
  - 2. Términos no semejantes.
- titulo: Cantidad de variables distinta
  enunciado: ¿Son semejantes $4a b$ y $4a$?
  respuesta: 'No'
  solucion_pasos:
  - No, el primer término contiene la variable $b$ que falta en el segundo.
- titulo: Imposibilidad de reducción
  enunciado: ¿Es la suma $x^2 + x$ una expresión binómica irreducible por términos semejantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2$ y $x$ son no semejantes y no se pueden reducir a un solo término.
errores_frecuentes:
- Forzar la suma de términos no semejantes juntando los coeficientes y pegando las letras como 2x + 3y = 5xy.
- Sumar los exponentes de bases iguales al intentar sumar términos de distinto grado como x^2 + x^3 = x^5.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que dos términos son semejantes basándose únicamente en tener los mismos coeficientes numéricos.
- Ignorar que la falta de una variable en uno de los términos rompe la semejanza.
afirmaciones_verdaderas:
- Los términos no semejantes poseen factores literales distintos y no se pueden reducir mediante adición o sustracción.
- Expresiones algebraicas como x^2 + x son irreducibles porque corresponden a la suma de términos no semejantes.
al_terminar_debes_poder: '![Resumen de términos no semejantes](/static/img/nodos/identificacion-de-terminos-no-semejantes-resumen.svg)


  QUÉ: Distinguir monomios que no son semejantes para evitar reducciones algebraicas inválidas.


  CÓMO: Detectar discrepancias en letras o exponentes ($T_1 \not\sim T_2$) manteniendo los términos separados mediante adición/sustracción irreducible ($4x^2 + 3x \neq 7x^3$).'
