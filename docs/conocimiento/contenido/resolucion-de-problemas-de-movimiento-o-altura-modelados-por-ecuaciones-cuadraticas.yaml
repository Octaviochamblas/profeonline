semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_MOVIMIENTO
resumen_inicial: 'Resolución de problemas de movimiento o altura modelados por ecuaciones
  cuadráticas: concepto, discriminante, soluciones y modelamiento en Modelamiento
  y resolución de problemas.'
explicacion_simple: Cuando un objeto se lanza hacia arriba, su altura respecto al
  tiempo sigue una trayectoria parabólica; preguntar cuándo alcanza cierta altura,
  o cuándo cae al suelo, siempre lleva a una ecuación cuadrática.
explicacion_formal: '### Definición formal


  La altura de un objeto en movimiento vertical bajo gravedad constante se modela
  como $h(t)=-\dfrac{1}{2}gt^2+v_0t+h_0$, donde $t$ es el tiempo, $v_0$ la velocidad
  inicial y $h_0$ la altura inicial. Determinar en qué instante $t$ el objeto alcanza
  una altura específica $h^*$ equivale a resolver $h(t)=h^*$, una ecuación de segundo
  grado en $t$.


  ### Desarrollo didáctico


  Un caso frecuente es preguntar cuándo el objeto toca el suelo, lo que corresponde
  a resolver $h(t)=0$; de las dos soluciones que entrega la ecuación, solo la de tiempo
  positivo tiene sentido físico.


  Si $h(t)=-5t^2+20t+25$ (en metros), para saber cuándo toca el suelo se resuelve
  $-5t^2+20t+25=0$, obteniendo $t=5$ o $t=-1$; se descarta $t=-1$ porque el tiempo
  no puede ser negativo.'
definiciones_clave: '- **Resolución de problemas de movimiento o altura modelados
  por ecuaciones cuadráticas**: Elemento o técnica fundamental en la resolución de
  ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de problemas de movimiento o altura modelados por ecuaciones cuadráticas.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando resolución de problemas
    de movimiento o altura modelados por ecuaciones cuadráticas.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a resolución de problemas
    de movimiento o altura modelados por ecuaciones cuadráticas.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
