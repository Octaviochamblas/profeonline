procedimiento:
- 'Paso 1: Identifica la función de altura $h(t)$ dada en el problema.'
- 'Paso 2: Iguala $h(t)$ al valor de altura buscado (por ejemplo, cero si se pregunta
  cuándo toca el suelo).'
- 'Paso 3: Resuelve la ecuación cuadrática resultante para $t$.'
- 'Paso 4: Descarta las soluciones de tiempo negativo, que no tienen sentido físico.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en resolución de problemas de movimiento o altura modelados por ecuaciones cuadráticas.
ejemplos:
- titulo: Tiempo en que un objeto toca el suelo
  enunciado: La altura de un objeto lanzado es $h(t)=-5t^2+15t$ (en metros, con $t$
    en segundos). ¿En qué instante toca el suelo?
  solucion_pasos:
  - 'Se resuelve $-5t^2+15t=0$, factorizando: $-5t(t-3)=0$.'
  - $t=0$ (instante inicial) o $t=3$.
  - Toca el suelo a los $3$ segundos.
- titulo: Tiempo en que se alcanza una altura específica
  enunciado: Con $h(t)=-5t^2+20t$, ¿en qué instante(s) la altura es $15$ m?
  solucion_pasos:
  - $-5t^2+20t=15$, equivalente a $-5t^2+20t-15=0$, o $t^2-4t+3=0$.
  - $t=1$ o $t=3$, ambos tiempos positivos y válidos.
  - El objeto alcanza $15$ m en dos instantes: al subir ($t=1$) y al bajar ($t=3$).
- titulo: ¿Puede haber dos instantes distintos en que un objeto alcance la misma altura?
  enunciado: ¿Puede haber dos instantes distintos en que un objeto alcance la misma
    altura?
  respuesta: Sí
  solucion_pasos:
  - El objeto pasa por la misma altura una vez al subir y otra vez al bajar, salvo
    que sea exactamente la altura máxima.
- titulo: ¿Una solución de tiempo negativo puede representar un instante físicamente
    válido?
  enunciado: ¿Una solución de tiempo negativo puede representar un instante físicamente
    válido?
  respuesta: 'No'
  solucion_pasos:
  - El tiempo transcurrido desde el lanzamiento no puede ser negativo, por lo que
    esas soluciones se descartan.
errores_frecuentes:
- Aceptar como válida una solución de tiempo negativo.
- Olvidar que puede haber dos instantes distintos válidos para una misma altura (subida
  y bajada).
- Confundir la altura inicial $h_0$ con la altura máxima alcanzada.
- No verificar las unidades o el signo del coeficiente cuadrático (siempre negativo
  en un modelo de caída bajo gravedad).
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando resolución
  de problemas de movimiento o altura modelados por ecuaciones cuadráticas.
