semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_MOVIMIENTO
resumen_inicial: La resolución de problemas de movimiento cinemático modela trayectorias verticales mediante funciones del tiempo $h(t) = -gt^2/2 + v_0 t + h_0$.
explicacion_simple: |
  En física y matemática, el lanzamiento vertical hacia arriba o el tiro parabólico se modela mediante una **función cuadrática del tiempo $t$**:

  $$h(t) = -5t^2 + v_0 t + h_0$$

  - $h(t)$: Altura en metros alcanzada en el instante $t$ (en segundos).
  - $v_0$: Velocidad inicial de lanzamiento.
  - $h_0$: Altura inicial desde la que se lanza.
  - **Pregunta clásica**: *"¿En qué instante el objeto toca el suelo?"*
    - Tocar el suelo significa que la altura es cero: $h(t) = 0$.
    - Resuelves la ecuación cuadrática resultante en la variable $t$.
    - Como el tiempo no puede ser negativo ($t \ge 0$), descartas cualquier valor de $t < 0$.
explicacion_formal: |
  Sea el modelo cinemático de movimiento uniformemente acelerado en el campo gravitatorio terrestre. La **ecuación de posición vertical $h(t)$** como función del tiempo $t \in \mathbb{R}^+$ viene dada por la expresión cuadrática:

  $$h(t) = -\frac{1}{2}g t^2 + v_0 t + h_0$$

  donde $g \approx 9.8 \text{ m/s}^2 \approx 10 \text{ m/s}^2$ es la aceleración de la gravedad.

  **Determinación de instantes de paso:**
  Para determinar el instante $t$ en que el proyectil se ubica a una altura objetivo $H$, se resuelve la ecuación de segundo grado:

  $$-\frac{1}{2}g t^2 + v_0 t + (h_0 - H) = 0 \quad \text{con la restricción física } t \ge 0$$
definiciones_clave: |
  - **Ecuación cuadrática de movimiento**: Modelo polinómico de segundo grado que describe la trayectoria o altura de un cuerpo en función del tiempo transcurrido.
propiedades_relaciones: |
  - **Doble instante de altura**: Debido a la naturaleza parabólica del movimiento, un objeto lanzado verticalmente alcanza una misma altura intermedia $H$ en dos instantes distintos de tiempo: una vez cuando sube ($t_1$) y otra cuando baja ($t_2$).
ejemplo_guiado:
  enunciado: 'Un proyectil es lanzado hacia arriba siguiendo la función $h(t) = -5t^2 + 40t$, donde $h$ está en metros y $t$ en segundos. ¿En qué instantes alcanza una altura de 60 metros?'
  pasos:
    - 'Paso 1: Igualar la función a la altura requerida: $-5t^2 + 40t = 60$.'
    - 'Paso 2: Transponer e igualar a cero: $-5t^2 + 40t - 60 = 0$.'
    - 'Paso 3: Simplificar dividiendo por $-5$: $t^2 - 8t + 12 = 0$.'
    - 'Paso 4: Factorizar $(t - 6)(t - 2) = 0 \implies t_1 = 2 \text{ s}$ (de subida) y $t_2 = 6 \text{ s}$ (de bajada).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué significa geométricamente y físicamente que la ecuación de altura $h(t) = H$ entregue dos soluciones reales positivas $t_1 = 1$ s y $t_2 = 5$ s?'
    choices:
      - {text: 'Que el objeto pasa por la altura $H$ a los 1 s cuando asciende y a los 5 s cuando desciende.', is_correct: true}
      - {text: 'Que el objeto se detiene en el aire durante 4 segundos.', is_correct: false}
      - {text: 'Que la altura máxima del objeto es de 5 metros.', is_correct: false}
      - {text: 'Que la ecuación está mal planteada.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que el objeto pasa por la altura $H$ a los 1 s cuando asciende y a los 5 s cuando desciende.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Un objeto cae según $h(t) = 80 - 5t^2$. ¿Cuánto tiempo tarda en tocar el suelo ($h = 0$)?'
    choices:
      - {text: '$t = 4 \text{ segundos}$', is_correct: true}
      - {text: '$t = 16 \text{ segundos}$', is_correct: false}
      - {text: '$t = -4 \text{ segundos}$', is_correct: false}
      - {text: '$t = 8 \text{ segundos}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$t = 4 \text{ segundos}$''. Al igualar $80 - 5t^2 = 0 \implies 5t^2 = 80 \implies t^2 = 16 \implies t = 4$ (se descarta $t = -4$).'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la función cuadrática de altura $h(t)$ y el valor objetivo $H$ dado en el problema.'
  - 'Paso 2: Plantear la ecuación $h(t) = H$ e igualar a cero en la forma $at^2 + bt + c = 0$.'
  - 'Paso 3: Resolver la ecuación cuadrática en la variable del tiempo $t$.'
  - 'Paso 4: Filtrar las soluciones manteniendo únicamente los valores de tiempo no negativos ($t \ge 0$) e interpretar su significado físico.'
errores_correccion: |
  - **Error común:** Aceptar valores de tiempo negativos ($t < 0$) como instantes de lanzamiento.
  - **Cómo corregirlo:** El tiempo físico **NO PUEDE SER NEGATIVO** ($t \ge 0$); elimina siempre las soluciones reales negativas.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Impacto con el suelo.
    alternativas:
      - '$t = 5 \text{ s}$'
      - '$t = 10 \text{ s}$'
      - '$t = 2 \text{ s}$'
    respuesta: '$t = 5 \text{ s}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Altura máxima intermedia.
    alternativas:
      - '$t_1 = 1 \text{ s}$ y $t_2 = 3 \text{ s}$'
      - '$t_1 = 2 \text{ s}$ y $t_2 = 4 \text{ s}$'
      - '$t = 2 \text{ s}$ (único)'
    respuesta: '$t_1 = 1 \text{ s}$ y $t_2 = 3 \text{ s}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Aceptar soluciones de tiempo negativo $t < 0$ argumentando retroceso en el tiempo.'
  - 'La confusión entre el instante de altura máxima (vértice) y los instantes donde el objeto toca el suelo ($h = 0$).'
  - 'La ausencia de la altura inicial $h_0$ al formular la ecuación del movimiento cinemático.'
  - 'Descartar la segunda solución positiva de tiempo ignorando que el objeto cruza la misma altura en el ascenso y en el descenso.'
  - 'La equivalencia errónea entre las unidades del tiempo $t$ (segundos) y la variable de distancia horizontal.'
afirmaciones_verdaderas:
  - 'Modelar la altura en función del tiempo mediante $h(t) = -gt^2/2 + v_0 t + h_0$ exige descartar cualquier raíz $t < 0$ por restricciones físicas.'
  - 'Obtener dos soluciones de tiempo reales positivas $t_1 < t_2$ representa el instante de subida y el instante de bajada a través de una misma altura.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas de movimiento cinemático y altura modelados por ecuaciones cuadráticas.
  CÓMO: Igualar la función de altura $h(t)$ a la meta requerida, resolver para $t$, filtrar $t \ge 0$ e interpretar ascenso y descenso.
