semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_MOVIMIENTO
resumen_inicial: La resolución de problemas de cinemática y lanzamiento de proyectiles modelados por la función cuadrática de altura $h(t) = h_0 + v_0 t - \frac{1}{2}g t^2$ analiza la trayectoria parabólica en el dominio temporal físico $t \ge 0$.
explicacion_simple: "![La resolución de problemas de cinemática y lanzamiento de proyectiles modelados por la función cuadrática de altura $h(t) = h_0 + v_0 t - \\frac{1}{2}g t^2$ analiza la trayectoria parabólica en el dominio temporal físico $t \\ge 0$](/static/img/nodos/resolucion-de-problemas-de-movimiento-o-altura-modelados-por-ecuaciones-cuadraticas-intro.svg)\n\n\nCuando lanzas una pelota hacia arriba, su altura en el tiempo sigue la trayectoria de una parábola:\n$$h(t) = -5t^2 + 30t$$\n\n**Las preguntas típicas:**\n1. **¿Cuándo toca el suelo?**\n   - En el suelo la altura es cero ($h = 0$):\n     $$-5t^2 + 30t = 0 \\implies -5t(t - 6) = 0 \\implies t_1 = 0\\text{ s (al salir)}, \\; t_2 = 6\\text{ s (al caer)}$$\n   - Toca el suelo a los **6 segundos**.\n2. **¿Cuándo alcanza una altura específica (ej: 40 metros)?**\n   - Igualas $h(t) = 40$ y resuelves para $t$. Te dará **dos tiempos positivos**: el primero cuando **va subiendo** y el segundo cuando **va cayendo**."
explicacion_formal: 'Sea un cuerpo puntual en caída libre bajo aceleración gravitacional constante $g \approx 9{,}8 \text{ m/s}^2$ (o modelada como $10 \text{ m/s}^2$ en problemas escolares). La ecuación horaria de posición es:

  $$h(t) = -\frac{1}{2}gt^2 + v_0 t + h_0$$


  **Puntos singulares de la cinemática cuadrática**:

  1. **Tiempo de vuelo (impacto con el suelo)**: $h(t) = 0 \implies t_{\text{vuelo}} = \frac{v_0 + \sqrt{v_0^2 + 2gh_0}}{g}$.

  2. **Instante de altura máxima (vértice)**: $t_{\text{máx}} = \frac{v_0}{g}$.

  3. **Altura máxima alcanzada**: $h_{\text{máx}} = h_0 + \frac{v_0^2}{2g}$.

  4. **Paso por altura intermedia $H$**: $h(t) = H$ produce dos instantes simétricos $t = t_{\text{máx}} \pm \Delta t$ (subida y bajada).'
definiciones_clave: '- **Ecuación horaria cuadrática**: Función cuadrática que describe la posición de un móvil con aceleración constante.

  - **Tiempo de vuelo**: Intervalo temporal total transcurrido desde el lanzamiento hasta el impacto con la superficie $h = 0$.'
propiedades_relaciones: '- **Simetría temporal**: El tiempo de subida es idéntico al tiempo de bajada si $h_0 = 0$.

  - **Restricción de causalidad**: El tiempo físico no puede ser negativo ($t \ge 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de problemas de cinemática y lanzamiento de proyectiles modelados por la función cuadrática de altura $h(t) = h_0 + v_0 t - \frac{1}{2}g t^2$ analiza la trayectoria parabólica en el dominio temporal físico $t \ge 0$](/static/img/nodos/resolucion-de-problemas-de-movimiento-o-altura-modelados-por-ecuaciones-cuadraticas-ejemplos.svg)



    Se lanza un proyectil verticalmente hacia arriba desde el suelo con una velocidad inicial de $40\text{ m/s}$. Su altura en metros tras $t$ segundos viene dada por $h(t) = 40t - 5t^2$.

    1) ¿En qué instante alcanza una altura de $60\text{ metros}$?

    2) ¿Cuánto tiempo permanece en el aire antes de tocar el suelo?'
  pasos:
  - 'Paso 1: Para $h(t) = 60$: Plantear $40t - 5t^2 = 60$.

    - Reordenar e igualar a cero: $5t^2 - 40t + 60 = 0$.

    - Dividir por 5: $t^2 - 8t + 12 = 0$.

    - Factorizar: $(t - 2)(t - 6) = 0 \implies t_1 = 2\text{ s}, \; t_2 = 6\text{ s}$.

    - Interpretación: Alcanza los 60 m a los 2 s (subiendo) y a los 6 s (bajando).'
  - 'Paso 2: Para el impacto en el suelo ($h(t) = 0$): Plantear $40t - 5t^2 = 0$.

    - Factorizar: $5t(8 - t) = 0 \implies t = 0\text{ s (lanzamiento)}, \; t = 8\text{ s (impacto)}$.

    - Conclusión: Permanece en el aire durante 8 segundos.'
checkpoints:
- placement: after_explicacion_formal
  question: En un lanzamiento vertical modelado por h(t) = 30t - 5t², ¿a los cuántos segundos toca el proyectil el suelo?
  choices:
  - text: A los 6 segundos
    is_correct: true
  - text: A los 3 segundos
    is_correct: false
  - text: A los 30 segundos
    is_correct: false
  - text: A los 5 segundos
    is_correct: false
  explanation: La alternativa correcta es 'A los 6 segundos'. $h(t) = 0 \implies 5t(6 - t) = 0 \implies t = 6\text{ s}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una pelota alcanza una altura de 20 m en t = 1 s y t = 4 s, ¿en qué instante alcanza su altura máxima?
  choices:
  - text: t = 2,5 s (el punto medio entre subida y bajada)
    is_correct: true
  - text: t = 5 s
    is_correct: false
  - text: t = 1 s
    is_correct: false
  - text: t = 3 s
    is_correct: false
  explanation: La alternativa correcta es 't = 2,5 s (el punto medio entre subida y bajada)'. Por simetría parabólica, el vértice ocurre en el punto medio $(1 + 4)/2 = 2{,}5\text{ s}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función de altura $h(t)$ y los datos dados.'
- 'Paso 2: Igualar $h(t)$ a la altura objetivo solicitada (o a 0 si es impacto en suelo).'
- 'Paso 3: Resolver la ecuación cuadrática resultante para la variable temporal $t$.'
- 'Paso 4: Interpretar las dos soluciones como subida y bajada, o descartar tiempos negativos.'
- 'Paso 5: Responder con la unidad de tiempo (segundos).'
errores_correccion: '- **Error común:** Aceptar $t < 0$ como tiempo de vuelo válido.

  - **Cómo corregirlo:** El tiempo físico de un experimento comienza en $t = 0$; cualquier solución negativa **carece de sentido físico y se descarta**.'
ejemplos:
- titulo: 'Ejemplo 1: Altura máxima'
  enunciado: En $h(t) = 50t - 5t^2$, ¿en qué segundo alcanza la altura máxima?
  alternativas:
  - t = 5 s
  - t = 10 s
  - t = 2.5 s
  - t = 50 s
  respuesta: t = 5 s
  solucion_pasos:
  - 'Paso 1: $t_v = -b/(2a) = -50/(2(-5)) = 5\text{ s}$.'
- titulo: 'Ejemplo 2: Lanzamiento desde una torre'
  enunciado: 'Desde una torre de 20 m se lanza un objeto: $h(t) = 20 + 15t - 5t^2$. ¿Cuándo choca con el suelo?'
  alternativas:
  - t = 4 s
  - t = -1 s
  - t = 5 s
  - t = 2 s
  respuesta: t = 4 s
  solucion_pasos:
  - 'Paso 1: $-5t^2 + 15t + 20 = 0 \implies t^2 - 3t - 4 = (t - 4)(t + 1) = 0 \implies t = 4\text{ s}$ (se descarta $-1$).'
- titulo: 'Ejemplo 3: Tiempo entre dos pasos de altura'
  enunciado: Si $h(t) = 25$ en $t = 1\text{ s}$ y $t = 5\text{ s}$, ¿cuántos segundos estuvo el proyectil por encima de los 25 m?
  alternativas:
  - 4 s
  - 5 s
  - 6 s
  - 2.5 s
  respuesta: 4 s
  solucion_pasos:
  - 'Paso 1: $\Delta t = 5 - 1 = 4\text{ s}$.'
- titulo: 'Ejemplo 4: Velocidad horizontal y alcance'
  enunciado: Un móvil frena según $d(t) = 20t - 2t^2$. ¿A los cuántos segundos se detiene?
  alternativas:
  - t = 5 s
  - t = 10 s
  - t = 2 s
  - t = 20 s
  respuesta: t = 5 s
  solucion_pasos:
  - 'Paso 1: $t_v = -20/(2(-2)) = 5\text{ s}$.'
errores_frecuentes:
- Confundir el instante del vértice con el instante de caída a tierra.
- Aceptar tiempos negativos como solución.
- Olvidar que pasar por una altura intermedia suele generar dos instantes distintos.
afirmaciones_verdaderas:
- El movimiento de proyectiles genera trayectorias de altura modeladas por polinomios cuadráticos en el tiempo t.
- El instante de impacto contra el suelo se halla resolviendo la ecuación cuadrática h(t) = 0.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas cinemáticos de proyectiles y movimiento modelados por ecuaciones de segundo grado.


  **CÓMO:** Igualando la función de altura a la posición requerida, resolviendo para t ≥ 0 e interpretando los instantes de subida y bajada.


