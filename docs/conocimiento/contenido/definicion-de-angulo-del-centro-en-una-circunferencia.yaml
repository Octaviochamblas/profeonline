semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_CENTRO_DEFINICION
resumen_inicial: El ángulo del centro es aquel cuyo vértice coincide con el centro de la circunferencia y sus lados contienen a dos radios.
explicacion_simple: 'Imagina el centro de un reloj de manecillas: el punto donde están clavadas las manecillas es el centro $O$, y las dos manecillas son dos radios que apuntan hacia el borde. La abertura que se forma entre ambas manecillas es exactamente un **ángulo del centro**.


  Para que un ángulo sea del centro, debe cumplir dos condiciones obligatorias:

  1. Su vértice está exactamente en el **centro $O$** de la circunferencia.

  2. Sus dos lados son **radios** de la figura ($\overline{OA}$ y $\overline{OB}$).


  Al abrirse, este ángulo ''muerde'' o delimita un trozo del borde de la circunferencia, que llamamos el **arco subtendido** $\overset{\frown}{AB}$.


  ![Definición de ángulo del centro](/static/img/nodos/definicion-de-angulo-del-centro-en-una-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal del ángulo del centro

  Sea $\mathcal{C}(O, r)$ una circunferencia en el plano euclidiano $\mathbb{R}^2$ de centro $O$ y radio $r$. Se define el **ángulo del centro** (o ángulo central) como cualquier ángulo $\angle AOB$ tal que su vértice sea el centro de la circunferencia ($V = O$) y los puntos $A, B$ pertenezcan a la circunferencia ($A, B \in \mathcal{C}$):

  $$\angle AOB = \text{Ángulo del centro} \iff V = O \quad \wedge \quad d(O, A) = d(O, B) = r$$


  ### Intersección con la circunferencia y arco subtendido

  Las semirrectas $\vec{OA}$ y $\vec{OB}$ intersecan a la circunferencia en los puntos $A$ y $B$, determinando dos arcos complementarios:

  - El **arco menor** $\overset{\frown}{AB}$ (cuando la medida angular es $\le 180^\circ$).

  - El **arco mayor** conjugado, cuya suma con el menor completa los $360^\circ$ de la circunferencia.


  > **Complemento didáctico:** El ángulo del centro es la referencia absoluta de todas las medidas angulares en la circunferencia: todo arco se mide en grados exactamente por la abertura de su ángulo del centro. Si el vértice se desplaza aunque sea un milímetro fuera del centro $O$, deja de ser un ángulo central.

  '
definiciones_clave: '- **Ángulo del centro**: Ángulo coplanar cuyo vértice es el centro $O$ de la circunferencia.

  - **Lados radiales**: Semirrectas que contienen a los radios $\overline{OA}$ y $\overline{OB}$.

  - **Arco subtendido ($\overset{\frown}{AB}$)**: Porción de curva circular interceptada por los lados del ángulo.

  '
propiedades_relaciones: '- **Vértice invariable**: $V = O$.

  - **Rango angular convexo**: $0^\circ < \alpha \le 180^\circ$ (el caso $\alpha = 180^\circ$ corresponde a un ángulo llano donde $\overline{AB}$ es un diámetro).

  - **Partición del giro completo**: La suma de los ángulos del centro que completan la circunferencia es estrictamente $360^\circ$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo del centro](/static/img/nodos/definicion-de-angulo-del-centro-en-una-circunferencia-ejemplos.svg)


    En una circunferencia de centro $O$, se trazan los radios $\overline{OA}$ y $\overline{OB}$ formando una abertura de $70^\circ$. Determina si $\angle AOB$ es un ángulo del centro y clasifícalo según su medida.'
  pasos:
  - 'Paso 1: Localizar el vértice del ángulo: El vértice está ubicado en el centro $O$.'
  - 'Paso 2: Comprobar los lados del ángulo: Los segmentos $OA$ y $OB$ van del centro al contorno, por lo que son radios.'
  - 'Paso 3: Concluir por definición: Cumple estrictamente ambas condiciones, por lo que $\angle AOB$ es un ángulo del centro.'
  - 'Paso 4: Clasificación por medida: Como $70^\circ < 90^\circ$, es un ángulo del centro agudo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde debe ubicarse obligatoriamente el vértice de un ángulo del centro en una circunferencia?
  choices:
  - text: En el centro de la circunferencia.
    is_correct: true
  - text: Sobre el borde de la circunferencia.
    is_correct: false
  - text: En el exterior de la circunferencia.
    is_correct: false
  - text: En el punto medio de cualquier cuerda.
    is_correct: false
  explanation: La alternativa correcta es 'En el centro de la circunferencia.' Por definición, el vértice del ángulo central coincide unívocamente con el centro $O$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuáles son los segmentos que forman los lados de un ángulo del centro?
  choices:
  - text: Dos radios de la circunferencia.
    is_correct: true
  - text: Dos cuerdas secantes.
    is_correct: false
  - text: Una recta tangente y una secante.
    is_correct: false
  - text: Dos diámetros perpendiculares.
    is_correct: false
  explanation: La alternativa correcta es 'Dos radios de la circunferencia.' Los lados parten desde el centro hacia dos puntos del borde ($OA$ y $OB$).
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Ubicar el vértice del ángulo en la figura geométrica.

  2. Verificar si el vértice coincide con el punto centro $O$.

  3. Verificar que los lados sean radios que lleguen a la circunferencia.

  4. Si ambas condiciones son afirmativas, clasificar como ángulo del centro.

  '
errores_correccion: '- **Error común 1:** Confundir ángulo del centro con ángulo inscrito. **Corrección:** El central tiene vértice en el centro $O$; el inscrito tiene vértice sobre la circunferencia.

  - **Error común 2:** Asumir que cualquier ángulo interior es del centro. **Corrección:** Un ángulo puede ser interior y estar descentrado ($V \neq O$).

  '
ejemplos:
- tipo: A
  titulo: Identificación de ángulo del centro
  enunciado: Si los puntos $A$ y $B$ pertenecen a la circunferencia de centro $O$, ¿cómo se denomina al ángulo $\angle AOB$?
  alternativas:
  - text: Ángulo del centro.
    is_correct: true
  - text: Ángulo inscrito.
    is_correct: false
  - text: Ángulo semiinscrito.
    is_correct: false
  - text: Ángulo circunscrito.
    is_correct: false
  explicacion: Al tener vértice en el centro $O$ y lados radiales, es un ángulo del centro.
- tipo: B
  titulo: Vértice en el centro
  enunciado: ¿Puede un ángulo del centro tener su vértice fuera del centro de la circunferencia?
  respuesta: 'No'
  explicacion: No. Por definición matemática estricta, su vértice debe coincidir siempre con el centro $O$.
errores_frecuentes:
- '''Creer que el ángulo del centro tiene su vértice en el borde de la circunferencia.'''
- '''Confundir un ángulo formado por dos cuerdas interiores cualesquiera con un ángulo del centro.'''
- '''Olvidar que los lados del ángulo del centro son radios de igual longitud ($OA = OB = r$).'''
afirmaciones_verdaderas:
- '''El vértice del ángulo del centro coincide exactamente con el centro $O$ de la circunferencia.'''
- '''Los dos lados de un ángulo del centro son radios congruentes de la circunferencia.'''
- '''La suma de los ángulos del centro adyacentes que cubren el círculo completo es de $360^\circ$.'''
al_terminar_debes_poder: '**QUÉ:** Identificar y definir ángulos del centro en la circunferencia.


  **CÓMO:** Verificando las condiciones $V = O$ y lados radiales $\overline{OA}, \overline{OB}$.


  ![Síntesis de ángulo del centro](/static/img/nodos/definicion-de-angulo-del-centro-en-una-circunferencia-resumen.svg)

  '
