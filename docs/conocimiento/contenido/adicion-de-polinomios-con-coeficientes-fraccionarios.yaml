semantic_id: MAT.ALG.ADICION_POL.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'La adición de polinomios con coeficientes fraccionarios consiste en sumar polinomios cuyos coeficientes numéricos son fracciones homogeneizando denominadores por clase de término semejante.'
explicacion_simple: |
  Cuando los polinomios tienen **coeficientes en forma de fracción** (ej: $\frac{1}{2}x^2 + \frac{2}{3}x$):
  - **Procedimiento**:
    1. Agrupa los términos semejantes de la misma clase.
    2. Suma los coeficientes fraccionarios de cada clase **buscando su mínimo común múltiplo (MCM)**.
    3. Simplifica las fracciones resultantes.
    4. Escribe el polinomio final con sus coeficientes fraccionarios simplificados.
  - **Ejemplo**: Sumar $\left(\frac{1}{2}x + 3\right) + \left(\frac{1}{4}x - 1\right)$:
    - Clase $x$: $\frac{1}{2} + \frac{1}{4} = \frac{2}{4} + \frac{1}{4} = \mathbf{\frac{3}{4}x}$.
    - Constantes: $+3 - 1 = \mathbf{+2}$.
    - Resultado final: **$\frac{3}{4}x + 2$**.
explicacion_formal: |
  ### Definición formal
  Sean $P(x) = \sum_{i=0}^n \frac{a_i}{b_i} x^i$ y $Q(x) = \sum_{i=0}^m \frac{c_i}{d_i} x^i$ dos polinomios con coeficientes en $\mathbb{Q}$ ($a_i, b_i, c_i, d_i \in \mathbb{Z}$ con $b_i, d_i \neq 0$). La **adición polinómica racional** determina para cada grado $k$ la fracción consolidada homogeneizada por $D_k = \operatorname{mcm}(b_k, d_k)$:

  $$(P + Q)(x) = \sum_{k=0}^{\max(n,m)} \left( \frac{a_k \cdot \frac{D_k}{b_k} + c_k \cdot \frac{D_k}{d_k}}{D_k} \right) x^k$$

  ### Reducción a la Forma Irreductible $\mathbb{Q}[x]$
  Cada coeficiente resultante $\frac{N_k}{D_k}$ se divide por el máximo común divisor $g_k = \gcd(N_k, D_k)$ para garantizar la representación canónica del polinomio racional en $\mathbb{Q}[x]$.

  ### Síntesis didáctica
  Sumar polinomios con fracciones ejercita simultáneamente el cálculo de MCM, adición racional y reducción de términos semejantes.
definiciones_clave: |
  - **Adición polinómica racional**: Suma de expresiones polinómicas cuyos coeficientes pertenecen al cuerpo $\mathbb{Q}$.
  - **Homogeneización por clase ($D_k$)**: Cálculo del MCM del denominador exclusivo para los coeficientes de la potencia $x^k$.
  - **Fracción coeficiente irreductible**: Simplificación de los coeficientes del polinomio resultante a sus términos mínimos.
propiedades_relaciones: |
  - **MCM independiente por grado**: El MCM de los denominadores de la columna $x^2$ es totalmente independiente del MCM calculado para la columna $x$.
  - **Invarianza de los exponentes**: Las fracciones de los coeficientes se operan aditivamente sin modificar las potencias $x^k$.
ejemplo_guiado:
  enunciado: 'Suma los polinomios $P = \frac{2}{3}x^2 - \frac{1}{2}x + \frac{3}{4}$ y $Q = \frac{1}{6}x^2 + \frac{3}{4}x - \frac{1}{4}$.'
  pasos:
    - 'Paso 1: Agrupamos los coeficientes de la Clase $x^2$: $\left(\frac{2}{3} + \frac{1}{6}\right)x^2$.
       - $\operatorname{mcm}(3, 6) = 6 \implies \frac{4}{6} + \frac{1}{6} = \frac{5}{6}x^2$.'
    - 'Paso 2: Agrupamos los coeficientes de la Clase $x$: $\left(-\frac{1}{2} + \frac{3}{4}\right)x$.
       - $\operatorname{mcm}(2, 4) = 4 \implies -\frac{2}{4} + \frac{3}{4} = +\frac{1}{4}x$.'
    - 'Paso 3: Agrupamos las Constantes: $\left(+\frac{3}{4} - \frac{1}{4}\right) = +\frac{2}{4} = +\frac{1}{2}$.'
    - 'Paso 4: Consolidamos el polinomio resultante: $\frac{5}{6}x^2 + \frac{1}{4}x + \frac{1}{2}$.'
    - 'Conclusión: El polinomio suma es **$\frac{5}{6}x^2 + \frac{1}{4}x + \frac{1}{2}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Es necesario que todas las clases de grado de un polinomio compartan un mismo denominador general para realizar la adición?'
    choices:
      - {text: 'No, el MCM de los denominadores se calcula de forma independiente para cada clase de término semejante', is_correct: true}
      - {text: 'Sí, se debe buscar un solo MCM para todos los denominadores de todo el polinomio', is_correct: false}
      - {text: 'Sí, los denominadores se multiplican todos entre sí', is_correct: false}
      - {text: 'No, los denominadores se eliminan', is_correct: false}
    explanation: 'La alternativa correcta es ''No, el MCM de los denominadores se calcula de forma independiente para cada clase de término semejante''. MCM independiente por grado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de sumar $\left(\frac{1}{3}x + \frac{1}{2}\right) + \left(\frac{2}{3}x + \frac{1}{2}\right)$?'
    choices:
      - {text: 'El resultado es $x + 1$, sumando $\frac{3}{3}x = 1x$ y $\frac{2}{2} = 1$', is_correct: true}
      - {text: 'El resultado es $\frac{3}{6}x + 1$', is_correct: false}
      - {text: 'El resultado es $2x + 2$', is_correct: false}
      - {text: 'El resultado es $\frac{1}{3}x + \frac{1}{4}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $x + 1$, sumando $\frac{3}{3}x = 1x$ y $\frac{2}{2} = 1$''. Suma $\frac{3}{3}x + \frac{2}{2} = 1x + 1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la suma de los polinomios agrupando los términos de la misma clase.'
  - 'Paso 2: Para cada clase de término semejante, calcular el MCM de los denominadores de sus coeficientes.'
  - 'Paso 3: Amplificar y sumar o restar los numeradores de cada clase.'
  - 'Paso 4: Simplificar las fracciones obtenidas a su forma irreductible y armar el polinomio final.'
errores_correccion: |
  - **Error 1:** Sumar numeradores con numeradores y denominadores con denominadores al reducir una clase (escribir $\frac{1}{3}x + \frac{1}{2}x = \frac{2}{5}x$). **Cómo corregirlo:** La suma exige **BUSCAR UN DENOMINADOR COMÚN ($\frac{2}{6} + \frac{3}{6} = \frac{5}{6}x$)**.
  - **Error 2:** Multiplicar las potencias de la variable por el denominador de la fracción. **Cómo corregirlo:** Los denominadores **SOLO OPERAN SOBRE LOS COEFICIENTES NUMÉRICOS**; la variable $x^k$ permanece intacta.
ejemplos:
  - titulo: 'Fracciones simples'
    enunciado: '¿Cuál es la suma de $\left(\frac{2}{5}x + 1\right) + \left(\frac{1}{5}x + 3\right)$?'
    alternativas:
      - '$\frac{3}{5}x + 4$'
      - '$\frac{3}{10}x + 4$'
      - '$\frac{2}{5}x + 4$'
    respuesta: '$\frac{3}{5}x + 4$'
    solucion_pasos:
      - '1. Mismo denominador $5 \implies \frac{2+1}{5}x = \frac{3}{5}x$.'
      - '2. Constantes: $1 + 3 = 4$.'
      - '3. Resultado: $\frac{3}{5}x + 4$.'
  - titulo: 'Suma de entero con fracción'
    enunciado: '¿Cuál es la suma de $2x^2 + \left(\frac{1}{3}x^2 - 5\right)$?'
    alternativas:
      - '$\frac{7}{3}x^2 - 5$'
      - '$\frac{3}{3}x^2 - 5$'
      - '$\frac{6}{3}x^2 - 5$'
    respuesta: '$\frac{7}{3}x^2 - 5$'
    solucion_pasos:
      - '1. Coeficiente $2 = \frac{6}{3}$.'
      - '2. Suma: $\frac{6}{3} + \frac{1}{3} = \frac{7}{3}x^2 - 5$.'
  - titulo: 'Simplificación a entero'
    enunciado: 'Si la suma de coeficientes fraccionarios resulta $\frac{6}{2}x^3$, ¿se simplifica al entero $3x^3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{6}{2} = 3 \implies 3x^3$.'
  - titulo: 'Independencia de MCM'
    enunciado: '¿Puede la clase $x^2$ tener denominador común 12 mientras la clase $x$ tiene denominador común 10?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, los MCM se calculan independientemente por cada potencia.'
errores_frecuentes:
  - 'Sumar directamente numeradores y denominadores entre sí al combinar coeficientes de polinomios.'
  - 'Buscar un único MCM gigantesco para todos los denominadores de todas las variables del polinomio.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Los coeficientes enteros no reciben denominador uno al sumarlos con coeficientes fraccionarios.'
  - 'Alterar los exponentes de las variables al realizar la adición de coeficientes racionales.'
afirmaciones_verdaderas:
