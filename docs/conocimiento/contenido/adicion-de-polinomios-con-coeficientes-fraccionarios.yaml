semantic_id: MAT.ALG.ADICION_POL.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Adición de polinomios con coeficientes fraccionarios: procedimiento
  y reglas en Adición de polinomios.'
explicacion_simple: Igual que en la vida real podemos tener la mitad de una torta
  más un cuarto de torta, en álgebra podemos sumar polinomios con coeficientes fraccionarios.
  La lógica no cambia, solo necesitamos recordar cómo sumar fracciones.
explicacion_formal: '### Definición formal


  La suma de fracciones requiere denominador común. La suma de numeradores y denominadores
  es un error fundamental.


  ### Desarrollo didáctico


  Suma: $(\frac{1}{2}x^2 + \frac{1}{3}x) + (\frac{1}{4}x^2 - \frac{2}{3}x + 1)$.


  Familia $x^2$: $\frac{1}{2} + \frac{1}{4} = \frac{2}{4} + \frac{1}{4} = \frac{3}{4}$.

  Familia $x$: $\frac{1}{3} - \frac{2}{3} = \frac{-1}{3}$.

  Constante: $1$.


  Resultado: $\frac{3}{4}x^2 - \frac{1}{3}x + 1$.'
definiciones_clave: '- **Adición de polinomios con coeficientes fraccionarios**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a adición de polinomios con coeficientes fraccionarios.'
ejemplo_guiado:
  enunciado: Aplica adición de polinomios con coeficientes fraccionarios en una expresión
    algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de adición de polinomios con
    coeficientes fraccionarios.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
