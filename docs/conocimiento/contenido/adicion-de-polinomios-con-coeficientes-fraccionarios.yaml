procedimiento:
- 'Paso 1: Identifica las familias de términos semejantes.'
- 'Paso 2: Para cada familia, extrae los coeficientes fraccionarios.'
- 'Paso 3: Suma o resta esas fracciones buscando denominador común.'
- 'Paso 4: El resultado de cada operación de fracciones forma el nuevo coeficiente
  de su familia.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en adición de polinomios con coeficientes fraccionarios.
ejemplos:
- titulo: Mitades y cuartos
  enunciado: 'Suma: (1/2)a + (1/4)a + (3/4)a.'
  solucion_pasos:
  - Todos son de la familia 'a'. Sumamos los coeficientes.
  - MCD de 2, 4, 4 es 4.
  - 1/2 = 2/4.
  - 2/4 + 1/4 + 3/4 = 6/4 = 3/2.
  - 'Resultado: (3/2)a.'
- titulo: Un nutricionista combina dos dietas. La primera aporta $\frac{1}{4}p$ de
    proteína y $\frac{1
  enunciado: 'Un nutricionista combina dos dietas. La primera aporta $\frac{1}{4}p$
    de proteína y $\frac{1}{2}c$ de carbohidratos. La segunda aporta $\frac{3}{4}p$
    y $\frac{1}{4}c$. ¿Cuál es el aporte nutricional total? (v1)


    Opciones: A) $p + \frac{3}{4}c$ · B) $p + \frac{3}{4}c$... misma respuesta · C)
    $\frac{4}{8}p + \frac{3}{6}c$ · D) $\frac{1}{2}p + \frac{3}{4}c$'
  solucion_pasos:
  - 'Proteína: $\frac{1}{4}+\frac{3}{4}=\frac{4}{4}=1p$. Carbohidratos: $\frac{1}{2}+\frac{1}{4}=\frac{2}{4}+\frac{1}{4}=\frac{3}{4}c$.
    Total: $p + \frac{3}{4}c$.'
- titulo: 'Respecto de «Adición de polinomios con coeficientes fraccionarios»: ¿Es
    correcta esta caract'
  enunciado: 'Respecto de «Adición de polinomios con coeficientes fraccionarios»:
    ¿Es correcta esta caracterización? «Al sumar polinomios con **Coeficientes Fraccionarios**,
    el proceso es idéntico al de la adición normal, pero al sumar los coeficientes
    de cada familia, se aplica la suma de fracciones con denominador común»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al sumar polinomios con **Coeficientes
    Fraccionarios**, el proceso es idéntico al de la adición normal, pero al sumar
    los coeficientes de cada familia, se aplica la suma de fracciones con denominador
    común.'
- titulo: 'Respecto de «Adición de polinomios con coeficientes fraccionarios»: ¿Es
    válida esta afirmaci'
  enunciado: 'Respecto de «Adición de polinomios con coeficientes fraccionarios»:
    ¿Es válida esta afirmación? «Sumar numeradores y denominadores directamente sin
    buscar denominador común»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al sumar polinomios con **Coeficientes
    Fraccionarios**, el proceso es idéntico al de la adición normal, pero al sumar
    los coeficientes de cada familia, se aplica la suma de fracciones con denominador
    común.'
errores_frecuentes:
- Sumar numeradores y denominadores directamente sin buscar denominador común.
- Olvidar simplificar la fracción resultante a su mínima expresión.
- 'Sumar numeradores y denominadores: $\frac{1+1}{3+6} = \frac{2}{9}$.'
- 'Multiplicar las fracciones: $\frac{1}{3} \times \frac{1}{6} = \frac{1}{18}$.'
- 'Restar los denominadores: $\frac{1}{3-6}$.'
afirmaciones_verdaderas:
- La reducción en adición de polinomios con coeficientes fraccionarios conserva los
  exponentes de la parte literal.
al_terminar_debes_poder: Operar y reducir expresiones algebraicas utilizando adición
  de polinomios con coeficientes fraccionarios.
