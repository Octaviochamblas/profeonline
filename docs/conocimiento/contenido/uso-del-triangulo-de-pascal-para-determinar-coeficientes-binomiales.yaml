  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué es igual la suma de todos los números presentes en la fila $n=4$
    del Triángulo de Pascal?
  choices:
  - text: $16$, equivalente a $2^4$
    is_correct: true
  - text: $8$
    is_correct: false
  - text: $32$
    is_correct: false
  - text: $10$
    is_correct: false
  explanation: La alternativa correcta es '$16$, equivalente a $2^4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Iniciar la fila $n$ con un 1 al extremo izquierdo.'
- 'Paso 2: Sumar cada par consecutivo de la fila superior $(n-1)$ para formar los
  valores centrales.'
- 'Paso 3: Cerrar la fila con un 1 al extremo derecho.'
errores_correccion: '- **Error 1: Confundir la fila $n$ con la fila de $n+1$ elementos
  en el triángulo.** **Cómo corregirlo:** La fila para la potencia $n$ posee exactamente
  $(n + 1)$ términos, empezando desde $k=0$ hasta $k=n$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuáles son los coeficientes para expandir $(a + b)^5$?
  alternativas:
  - $1, 5, 10, 10, 5, 1$
  - $1, 4, 6, 4, 1$
  - $1, 6, 15, 20, 15, 6, 1$
  respuesta: $1, 5, 10, 10, 5, 1$
  solucion_pasos:
  - '1. Sumando parejas de la fila 4 ($1, 4, 6, 4, 1$): $1, (1+4=5), (4+6=10), (6+4=10),
    (4+1=5), 1$.'
- titulo: Ejemplo 2
  enunciado: En la fila $n=3$, ¿cuál es el valor de $\binom{3}{2}$?
  alternativas:
  - $3$
  - $1$
  - $6$
  respuesta: $3$
  solucion_pasos:
  - 1. La fila 3 es $1, 3, 3, 1$. La posición $k=2$ es 3.
- titulo: ¿Cumplen los coeficientes del Triángulo de Pascal la simetría especular
    $\binom{n}{k} = \binom{n}{n-k}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la fila se lee de igual manera de izquierda a derecha que de derecha a izquierda.
- titulo: ¿La suma de la fila $n=5$ del Triángulo de Pascal es igual a 25?
  respuesta: 'No'
  solucion_pasos:
  - No, la suma es $2^5 = 32$, no 25.
errores_frecuentes:
- Declarar que la fila $n$ del Triángulo de Pascal contiene $n$ términos en lugar
  de $n+1$.
- Declarar que los coeficientes del Triángulo de Pascal crecen indefinidamente sin
  simetría.
- Sumar las filas mediante potencias de 10 en lugar de potencias de 2.
- Asignar coeficientes 1 a todos los términos de la expansión binomial.
- Declarar que la relación de Pascal requiere multiplicar los términos superiores
  en lugar de sumarlos.
afirmaciones_verdaderas:
- Cada número interior del Triángulo de Pascal es la suma de los dos números superiores
  contiguos.
- La fila correspondiente a la potencia $n$ contiene exactamente $n+1$ coeficientes.
al_terminar_debes_poder: Al terminar serás capaz de construir cualquier fila del Triángulo
  de Pascal y usar sus coeficientes para expandir $(a + b)^n$.
