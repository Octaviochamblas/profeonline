procedimiento:
- 'Paso 1: Iniciar el arreglo con la fila inicial 1.'
- 'Paso 2: Construir cada nueva fila colocando unos en los extremos y sumando las parejas superiores adyacentes.'
- 'Paso 3: Identificar la fila $n$ que corresponde al exponente del binomio $(a+b)^n$.'
- 'Paso 4: Asignar cada coeficiente de la fila a la combinación graduada de variables $a^{n-k} b^k$.'
errores_correccion: '- **Error 1:** Intercambiar la Fila n contando las filas desde 1 en lugar de iniciar desde n=0. **Cómo
  corregirlo:** La Fila con coeficientes $1, 2, 1$ corresponde a **$n=2$ (la segunda fila interna después de $n=0$ y $n=1$)**.

  - **Error 2:** Multiplicar los números superiores en lugar de sumarlos al construir el triángulo. **Cómo corregirlo:** En
  la recurrencia de Pascal **LOS DOS NÚMEROS SUPERIORES SE SUMAN ($1 + 3 = 4$)**.

  '
ejemplos:
- titulo: Suma de la fila de Pascal
  enunciado: Para la Fila 3 ($1, 3, 3, 1$), ¿es la suma de sus términos igual a $2^3 = 8$?
  respuesta: Sí
  solucion_pasos:
  - 1. $1 + 3 + 3 + 1 = 8$.
  - 2. $2^3 = 8$.
- titulo: Construcción de Fila 4
  enunciado: A partir de $1, 3, 3, 1$, ¿se obtiene la Fila 4 como $1, 4, 6, 4, 1$?
  respuesta: Sí
  solucion_pasos:
  - 1. $1+3=4, 3+3=6, 3+1=4$.
  - '2. Fila 4: $1, 4, 6, 4, 1$.'
- titulo: Simetría de coeficientes
  enunciado: En la Fila 5 ($1, 5, 10, 10, 5, 1$), ¿son los coeficientes idénticos leídos de izquierda a derecha que de derecha
    a izquierda?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad $\binom{n}{k} = \binom{n}{n-k}$.
- titulo: Número de coeficientes
  enunciado: Para $(a+b)^n$, ¿contiene la fila del Triángulo de Pascal exactamente $n+1$ números?
  respuesta: Sí
  solucion_pasos:
  - Sí, incluye las combinaciones desde $k=0$ hasta $k=n$.
errores_frecuentes:
- Intercambiar el índice de la fila n por no contabilizar la fila inicial n=0.
- Multiplicar los números superiores en lugar de sumarlos al generar los elementos del triángulo.
- El número 1 en las esquinas exteriores de cada fila no es colocado.
- Invertir el orden de los coeficientes al asociarlos con las potencias decrecientes.
- Olvidar que la suma de todos los elementos de la fila n es igual a 2ⁿ.
afirmaciones_verdaderas:
- La fila $n$ del Triángulo de Pascal contiene los $n+1$ coeficientes binomiales de $(a+b)^n$.
- Cada número interno del triángulo se obtiene mediante la suma aditiva de los dos números situados inmediatamente arriba
  de él.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/uso-del-triangulo-de-pascal-para-determinar-coeficientes-binomiales-resumen.svg)


  QUÉ: Construir el Triángulo de Pascal hasta cualquier fila $n$ y extraer los coeficientes para expandir potencias binomiales.

  CÓMO: Aplicar la relación de recurrencia $\binom{n}{k} = \binom{n-1}{k-1} + \binom{n-1}{k}$ sumando elementos adyacentes
  de la fila superior e iniciando desde la fila $n=0$.

  '
