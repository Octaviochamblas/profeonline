semantic_id: MAT.NUM.NOTACION_CIENTIFICA.ESCRITURA_NUMERO_GRANDE
resumen_inicial: Para escribir un número grande ($>10$) en notación científica, la
  coma se desplaza hacia la izquierda hasta obtener un coeficiente entre 1 y 10, y
  el número de lugares movidos pasa a ser un exponente positivo ($n > 0$).
explicacion_simple: 'Para convertir un número grande como $45.000.000$:

  1. Colocas la coma después de la primera cifra distinta de cero: $4{,}5$.

  2. Cuentas cuántas posiciones se movió la coma hacia la izquierda (en este caso,
  7 posiciones).

  3. Escribes el resultado como $4{,}5 \cdot 10^7$.'
explicacion_formal: 'Sea $N > 10$. El desplazamiento de la coma $n$ lugares a la izquierda
  equivale a dividir por $10^n$, por lo que para mantener el valor se multiplica por
  $10^n$:

  $$N = (N \cdot 10^{-n}) \cdot 10^n = k \cdot 10^n$$

  Donde $n \in \mathbb{Z}^+$ es la cantidad de desplazamientos a la izquierda y $k
  = N \cdot 10^{-n} \in [1, 10[$.'
definiciones_clave: '- **Exponente positivo ($n > 0$)**: Indica el número de posiciones
  que la coma se desplazó a la izquierda para comprimir un número grande.'
propiedades_relaciones: '- **Relación directa**: A mayor cantidad de ceros/cifras
  enteras, mayor es el exponente positivo de la potencia de 10.'
ejemplo_guiado:
  enunciado: Escribe $150.000.000$ (distancia aproximada Tierra-Sol en km) en notación
    científica.
  pasos:
  - 'Ubicar la primera cifra no nula: 1. La mantisa será $1{,}5$.'
  - 'Contar los espacios desde el final del número hasta quedar después del 1: son
    8 espacios.'
  - Escribir como $1{,}5 \cdot 10^8\text{ km}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión en notación científica de $3.200.000$?
  choices:
  - text: 3,2 · 10^6
    is_correct: true
  - text: 32 · 10^5
    is_correct: false
  - text: 0,32 · 10^7
    is_correct: false
  - text: 3,2 · 10^{-6}
    is_correct: false
  explanation: 'La correcta es: 3,2 · 10^6. La coma se desplaza 6 lugares hacia la
    izquierda.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Escribe $85.000$ en notación científica.
  choices:
  - text: 8,5 · 10^4
    is_correct: true
  - text: 8,5 · 10^3
    is_correct: false
  - text: 85 · 10^3
    is_correct: false
  - text: 8,5 · 10^5
    is_correct: false
  explanation: 'La correcta es: 8,5 · 10^4. La coma se desplaza 4 lugares hacia la
    izquierda.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar la coma decimal al final del número entero.'
- 'Paso 2: Mover la coma hacia la izquierda hasta dejar solo un dígito no nulo a su
  izquierda.'
- 'Paso 3: Contar el número de lugares $n$ desplazados.'
- 'Paso 4: Escribir la mantisa obtenida multiplicada por $10^n$.'
errores_correccion: No uses exponentes negativos para números grandes. $300.000 =
  3 \cdot 10^5$, NO $3 \cdot 10^{-5}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Expresa $600.000$ en notación científica.
  alternativas:
  - 6 · 10^5
  - 6 · 10^6
  - 60 · 10^4
  respuesta: 6 · 10^5
  solucion_pasos:
  - $600.000 = 6 \cdot 10^5$.
errores_frecuentes:
- Colocar exponente negativo en vez de positivo.
afirmaciones_verdaderas:
- Números mayores a 10 tienen exponente positivo en notación científica.
al_terminar_debes_ponder: Convertir números grandes a notación científica con exponente
  positivo.
fuente: Texto escolar MINEDUC.
estado: publicado
