semantic_id: MAT.NUM.NOTACION_CIENTIFICA.ESCRITURA_NUMERO_GRANDE
resumen_inicial: Para escribir un número grande ($|x| \ge 10$) en notación científica,
  la coma se desplaza $n$ posiciones hacia la izquierda hasta tener un coeficiente
  $1 \le |k| < 10$, asignando un exponente entero positivo $+n$.
explicacion_simple: Al convertir un número grande a notación científica, corremos
  la coma hacia la izquierda hasta dejar un solo dígito diferente de cero antes de
  ella. La cantidad de saltos que dimos hacia la izquierda será el exponente positivo
  de nuestra potencia de diez.
explicacion_formal: 'Sea $x \ge 10$, la representación $x = k \cdot 10^n$ se construye
  mediante la traslación de la coma:


  $$x = (a_0 a_1 \dots a_p) \implies k = a_0, a_1 \dots a_p \quad \text{con } n =
  p > 0$$


  **Desglose del algoritmo:**

  - Dirección de desplazamiento: Izquierda $\implies$ Exponente positivo $+n$.

  - Equivalencia de potencia: Multiplicar $k \cdot 10^n$ restablece la escala original
  expandiendo ceros hacia la derecha.


  > **Complemento didáctico:** Ejemplo: $3.800.000 = 3,8 \cdot 10^6$ (se corrió la
  coma $6$ lugares a la izquierda).'
definiciones_clave: '- **Escritura de números grandes**: Conversión con traslación
  de coma a la izquierda y exponente positivo $+n$.'
propiedades_relaciones: '- **Exponente positivo**: Representa la cantidad de traslaciones
  a la izquierda.'
ejemplo_guiado:
  enunciado: Escriba el número grande $45.000.000$ en notación científica.
  pasos:
  - 'Paso 1: Colocar la coma tras la primera cifra no nula: $4,5$.'
  - 'Paso 2: Contar los lugares desde $4,5$ hasta el final del número original: $7$
    posiciones a la izquierda.'
  - 'Paso 3: Asignar exponente $+7$ a la potencia de diez: $10^7$.'
  - 'Conclusión: $45.000.000 = 4,5 \cdot 10^7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo tiene el exponente de la potencia de diez al escribir un número
    grande (>= 10) en notación científica?
  choices:
  - text: Signo positivo (+n)
    is_correct: true
  - text: Signo negativo (-n)
    is_correct: false
  - text: Es siempre cero
    is_correct: false
  - text: Es indeterminado
    is_correct: false
  explanation: La alternativa correcta es 'Signo positivo (+n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 45.000.000, ¿cuál fue la expresión final?
  choices:
  - text: 4,5 · 10^7
    is_correct: true
  - text: 45 · 10^6
    is_correct: false
  - text: 4,5 · 10^{-7}
    is_correct: false
  - text: 0,45 · 10^8
    is_correct: false
  explanation: La alternativa correcta es '4,5 · 10^7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mover la coma decimal hacia la izquierda hasta dejar un único dígito entero
  entre 1 y 9.'
- 'Paso 2: Contar el número de saltos $n$ realizados a la izquierda.'
- 'Paso 3: Multiplicar la mantisa por la potencia $10^n$ con exponente positivo $+n$.'
errores_correccion: '- **Error 1: Asignar exponente negativo a un número grande ($5.000
  = 5 \cdot 10^{-3}$).** **Cómo corregirlo:** Los números grandes llevan exponente
  POSITIVO ($5 \cdot 10^3$).


  - **Error 2: Errar en el conteo de la última cifra.** **Cómo corregirlo:** Contar
  meticulosamente cada posición que cruza la coma hasta situarse a la derecha del
  primer dígito.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Escriba $600.000$ en notación científica.
  alternativas:
  - 6 · 10^5
  - 6 · 10^{-5}
  - 60 · 10^4
  respuesta: 6 · 10^5
  solucion_pasos:
  - $600.000 = 6 \cdot 10^5$.
- titulo: Ejemplo 2
  enunciado: Escriba $123.000.000$ en notación científica.
  alternativas:
  - 1,23 · 10^8
  - 12,3 · 10^7
  - 1,23 · 10^{-8}
  respuesta: 1,23 · 10^8
  solucion_pasos:
  - $123.000.000 = 1,23 \cdot 10^8$.
- titulo: ¿Es 7.000 igual a 7 · 10^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $7 \cdot 1000 = 7000$.
- titulo: ¿Requiere un número grande un exponente positivo en la potencia de 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, por desplazar la coma a la izquierda.
errores_frecuentes:
- Escribir números grandes asignando un exponente negativo a la potencia de diez.
- Dejar dos o más cifras enteras antes de la coma al convertir un número grande.
- Contar incorrectamente las posiciones decimales confundiendo el número de ceros
  con los saltos.
- El número $200.000$ expresado en notación científica equivale a $2 \cdot 10^{-5}$.
- Multiplicar la mantisa por un exponente par sin modificar el coeficiente.
afirmaciones_verdaderas:
- La conversión de un número grande ($|x| \ge 10$) requiere mover la coma a la izquierda
  y usar un exponente positivo $+n$.
- El exponente $+n$ representa la cantidad de posiciones decimales recorridas hasta
  lograr $1 \le |k| < 10$.
al_terminar_debes_poder: Al terminar serás capaz de convertir números grandes a notación
  científica $k \cdot 10^n$, moviendo la coma a la izquierda y asignando un exponente
  positivo $+n$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
