procedimiento:
- 'Paso 1: Identifica dos lados homólogos, uno de cada figura semejante.'
- 'Paso 2: Divide la longitud del lado de la figura de referencia por la longitud
  del lado homólogo en la otra figura.'
- 'Paso 3: Verifica, si es posible, que el mismo resultado se obtenga con otro par
  de lados homólogos.'
