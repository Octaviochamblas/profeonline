semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.RAZON_SEMEJANZA_CALCULO
resumen_inicial: 'Cálculo de la razón de semejanza entre lados homólogos: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Con el concepto de razón de semejanza ya comprendido, es momento
  de aplicarlo sistemáticamente a problemas numéricos concretos.
explicacion_formal: '![Cálculo de la razón de semejanza](/static/img/geometria/congruencia-semejanza/semejanza-razon-calculo.svg)


  ### Definición formal


  Dados los lados homólogos $l_1$ (figura 1) y $l_2$ (figura 2), la razón de semejanza
  de la figura 2 respecto a la figura 1 es $k=\frac{l_2}{l_1}$.


  ### Desarrollo didáctico


  Si un triángulo tiene lados 6, 8, 10, y su semejante tiene lados 9, 12, 15, la razón
  de semejanza puede calcularse con cualquier par homólogo: $\frac{9}{6}=\frac{12}{8}=\frac{15}{10}=1,5$.
  El resultado es el mismo sin importar qué par de lados homólogos se use.'
