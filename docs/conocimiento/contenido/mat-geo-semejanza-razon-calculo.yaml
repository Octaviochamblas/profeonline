ejemplo_guiado:
  enunciado: Para analizar cálculo de la razón de semejanza entre lados homólogos,
    considera un ángulo $\alpha = 46^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1285^\circ = 46^\circ$.
  pasos:
  - Identificar la propiedad de cálculo de la razón de semejanza entre lados homólogos
    referida a $\alpha = 46^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1285 = 46 \implies x = 46 - 1285$.'
  - Concluir que la medida calculada para cálculo de la razón de semejanza entre lados
    homólogos es $x = -1239^\circ$.
