semantic_id: MAT.NUM.PROP_DIRECTA.CONCEPTO_VARIABLES
resumen_inicial: Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante ($k = \frac{y}{x}$ con $x \neq 0$), de modo que al multiplicar $x$ por un factor $n$, la variable $y$ se multiplica exactamente por el mismo factor $n$.
explicacion_simple: "![Concepto de proporcionalidad directa](/static/img/nodos/concepto-de-variables-directamente-proporcionales-intro.svg)\n\nDos magnitudes son **directamente proporcionales** cuando están conectadas por una multiplicación fija:\n- Si una cantidad **se duplica, triplica o divide por $2$**, la otra hace **exactamente lo mismo**.\n- Su división o cociente da siempre el **mismo número fijo $k$**: $\\frac{y}{x} = k \\implies y = k \\cdot x$.\n- **Ejemplo cotidiano:** El precio del pan:\n  - $1$ pan cuesta $\\$\\$25$0$.\n  - $2$ panes cuestan $\\$\\$50$0$ (el doble).\n  - $3$ panes cuestan $\\$\\$75$0$ (el triple).\n  - Todos los cocientes dan $\\frac{250}{1} = \\frac{500}{2} = \\frac{750}{3} = 250$ (constante).\n- **Cuidado:** Que dos cosas aumenten al mismo tiempo no significa que sean directamente proporcionales (ej: la edad y la estatura aumentan, pero al duplicar la edad no se duplica la estatura)."
explicacion_formal: 'Sean $x, y$ dos variables reales que toman valores en $\mathbb{R}^+$. Se dice que $y$ es **directamente proporcional** a $x$ (denotado $y \propto x$) si existe una constante no nula $k \in \mathbb{R}^+$ tal que:


  $$\frac{y}{x} = k \iff y = k \cdot x \quad (\forall x \in \operatorname{Dom})$$


  **Propiedad de Homogeneidad Multiplicativa:**

  Para cualquier factor escalar $n > 0$:

  $$f(n \cdot x) = k \cdot (n \cdot x) = n \cdot (k \cdot x) = n \cdot f(x)$$

  lo que confirma que la función subyacente $f(x) = kx$ es lineal y homogénea de grado 1.'
definiciones_clave: '- **Proporcionalidad directa ($y \propto x$)**: Relación funcional donde $\frac{y}{x} = k$.

  - **Constante de proporcionalidad directa ($k$)**: Cociente fijo $k = \frac{y}{x}$.

  - **Homogeneidad**: Propiedad donde multiplicar la entrada por $n$ multiplica la salida por $n$.'
propiedades_relaciones: '- **Paso por el origen**: Si $x = 0$, entonces $y = k \cdot 0 = 0$.

  - **Monotonía**: Como $k > 0$, la función $y = kx$ es estrictamente creciente.'
ejemplo_guiado:
  enunciado: '![Ejemplos de proporcionalidad directa](/static/img/nodos/concepto-de-variables-directamente-proporcionales-ejemplos.svg)


    Determine si la relación entre número de panes y costo total ($1$ pan = $\\$250$, $2$ panes = $\\$500$, $3$ panes = $\\$750$) es proporcional directa, y analice si la relación entre edad y estatura ($10$ años: $130\text{ cm}$; $20$ años: $175\text{ cm}$) lo es.'
  pasos:
  - 'Paso 1: Para el pan: Calcular cocientes $\frac{250}{1} = 250$, $\frac{500}{2} = 250$, $\frac{750}{3} = 250$.'
  - 'Paso 2: Como el cociente es constante ($k = 250$), sí es una relación directamente proporcional.'
  - 'Paso 3: Para edad y estatura: $\frac{130}{10} = 13$ y $\frac{175}{20} = 8,75$.'
  - 'Paso 4: Como $13 \neq 8,75$, el cociente no se preserva $\implies$ No es directamente proporcional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición matemática obligatoria para que dos variables $x$ e $y$ sean directamente proporcionales?
  choices:
  - text: Que su cociente $\frac{y}{x} = k$ sea constante
    is_correct: true
  - text: Que su producto $x \cdot y = k$ sea constante
    is_correct: false
  - text: Que su suma $x + y = k$ sea constante
    is_correct: false
  - text: Que su resta $x - y = k$ sea constante
    is_correct: false
  explanation: La alternativa correcta es 'Que su cociente $\frac{y}{x} = k$ sea constante'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la relación edad-estatura no es directamente proporcional?
  choices:
  - text: Porque al duplicar la edad de 10 a 20 años, la estatura no se duplicó de 130 a 260 cm
    is_correct: true
  - text: Porque la estatura no se puede medir en centímetros
    is_correct: false
  - text: Porque los números son impares
    is_correct: false
  - text: Porque la edad disminuye con el tiempo
    is_correct: false
  explanation: La alternativa correcta es 'Porque al duplicar la edad de 10 a 20 años, la estatura no se duplicó de 130 a 260 cm'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos variables involucradas en la situación y emparejar sus valores $(x_1, y_1), (x_2, y_2)$.'
- 'Paso 2: Calcular el cociente $\frac{y_i}{x_i}$ para cada par de datos.'
- 'Paso 3: Si todos los cocientes resultan iguales a una misma constante $k$, concluir que existe proporcionalidad directa.'
errores_correccion: '- **Error 1: Creer que si dos variables aumentan juntas, ya son proporcionales directas.** **Cómo corregirlo:** Se debe comprobar que el COCIENTE $\frac{y}{x}$ sea estrictamente idéntico en todos los pares.

  - **Error 2: Confundir con variación aditiva ($y = x + 5$).** **Cómo corregirlo:** La proporcionalidad directa es puramente multiplicativa ($y = kx$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $y$ es directamente proporcional a $x$ con $k = 6$, ¿cuánto vale $y$ cuando $x = 4$?
  alternativas:
  - $24$
  - $10$
  - $1,5$
  respuesta: $24$
  solucion_pasos:
  - $y = k \cdot x = 6 \cdot 4 = 24$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes relaciones describe una proporcionalidad directa?
  alternativas:
  - Distancia recorrida a velocidad constante vs tiempo
  - Edad de una persona vs su peso corporal
  - Lado de un cuadrado vs su área
  respuesta: Distancia recorrida a velocidad constante vs tiempo
  solucion_pasos:
  - $d = v \cdot t$ con velocidad constante $v$ es un modelo $y = kx$.
- titulo: ¿Es el cociente y/x constante en una proporción directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{y}{x} = k$ es la definición formal de la proporcionalidad directa.
  alternativas:
  - texto: Sí, el cociente define la constante de proporcionalidad directa k
    es_correcta: true
    retroalimentacion: ¡Correcto! Definición fundamental.
  - texto: No, el producto es el que permanece constante
    es_correcta: false
    retroalimentacion: Incorrecto, el producto constante corresponde a la proporción inversa.
  - texto: No, varía linealmente
    es_correcta: false
    retroalimentacion: Incorrecto, el cociente es invariante.
- titulo: ¿Si una variable se divide por 3, la otra también se divide por 3 en proporción directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, la variación multiplicativa se preserva en ambas direcciones.
  alternativas:
  - texto: Sí, ambas variables escalan en el mismo factor multiplicativo
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad de homogeneidad.
  - texto: No, la otra se triplica
    es_correcta: false
    retroalimentacion: Incorrecto, eso ocurriría en proporción inversa.
  - texto: No, permanece sin cambios
    es_correcta: false
    retroalimentacion: Incorrecto, ambas magnitudes están acopladas.
errores_frecuentes:
- Asumir proporcionalidad directa en relaciones afines ($y = mx + n$ con $n \neq 0$).
- Multiplicar las variables en vez de dividirlas para hallar $k$.
- Olvidar que al duplicar $x$, $y$ debe duplicarse obligatoriamente.
- Confundir causa y efecto con proporcionalidad.
afirmaciones_verdaderas:
- Dos variables son directamente proporcionales si su cociente $\frac{y}{x}$ es una constante $k$.
- La relación se modela algebraicamente como $y = k \cdot x$.
- Si una de las variables vale 0, la otra necesariamente vale 0 ($f(0) = 0$).
al_terminar_debes_poder: '![Síntesis de proporcionalidad directa](/static/img/nodos/concepto-de-variables-directamente-proporcionales-resumen.svg)


  QUÉ: Comprender e identificar relaciones de proporcionalidad directa entre dos variables.


  CÓMO: Verificando la constancia del cociente $\frac{y}{x} = k$ y comprobando que ambas magnitudes escalen en el mismo factor multiplicativo homogéneo.'
