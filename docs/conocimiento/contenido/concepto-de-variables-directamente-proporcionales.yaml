semantic_id: MAT.NUM.PROP_DIRECTA.CONCEPTO_VARIABLES
resumen_inicial: 'Concepto de variables directamente proporcionales: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: ¿Has notado que si compras el doble de pan, pagas exactamente el doble?
  Cuando dos magnitudes se mueven en perfecta sincronía hacia arriba o hacia abajo, estamos
  ante una proporcionalidad directa.
explicacion_formal: 'Hablamos de **proporcionalidad directa** cuando dos magnitudes numéricas
  están vinculadas de modo que el aumento de una provoca el aumento de la otra en la misma
  proporción (y lo mismo con su disminución).


  Matemáticamente, si $x$ e $y$ son directamente proporcionales, el cociente entre ellas es
  constante:

  $\frac{y}{x} = k$

  Donde $k$ es la **constante de proporcionalidad**. Si $x$ se duplica, $y$ se duplica. Si
  $x$ se divide por 3, $y$ se divide por 3.'
definiciones_clave: '- **Concepto de variables directamente proporcionales**: Elemento central
  dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a concepto de variables directamente proporcionales.'
ejemplo_guiado:
  enunciado: 'Un auto consume combustible de forma constante: con 5 litros recorre 60 km.
    ¿Son ''litros de combustible'' y ''kilómetros recorridos'' variables directamente proporcionales?'
  pasos:
  - 'Calculo el cociente km/litro con el dato conocido: 60 dividido entre 5 es igual a 12.'
  - 'Compruebo con otro caso: si se usan 10 litros, deberían recorrerse 12 por 10, es decir
    120 km, el doble de litros para el doble de kilómetros.'
  - Como el cociente se mantiene constante al duplicar, concluyo que sí son variables directamente
    proporcionales.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con concepto de variables directamente
    proporcionales?
  choices:
  - text: Identificar correctamente la relación de proporcionalidad directa
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
    directa. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de concepto de variables directamente proporcionales,
    ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica las dos variables del problema.'
- 'Paso 2: Comprueba si al aumentar una al doble, la otra obligatoriamente debe aumentar al
  doble.'
- 'Paso 3: Si esto se cumple, son variables directamente proporcionales.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de variables
  directamente proporcionales.
ejemplos:
- titulo: Variables de la vida real
  enunciado: ¿Son el tiempo de viaje (a velocidad constante) y la distancia recorrida proporcionales?
  solucion_pasos:
  - Si viajas el doble de tiempo a la misma velocidad, recorrerás el doble de distancia.
  - Como ambas crecen en la misma proporción, son directamente proporcionales.
- titulo: ¿Toda relación que sube es proporcional?
  respuesta: 'No'
  solucion_pasos:
  - 'La edad de una persona y su altura: si bien a mayor edad (hasta la adultez) suele haber
    mayor altura, a los 20 años no mides el doble que a los 10 años. No es proporcionalidad
    directa.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál par de magnitudes son directamente proporcionales?
  alternativas:
  - Cantidad de entradas al cine y el costo total
  - Edad de una persona y su estatura
  - Número de obreros y días para terminar una obra
  respuesta: Cantidad de entradas al cine y el costo total
  solucion_pasos:
  - El costo total crece en la misma proporción que la cantidad de entradas compradas.
- titulo: ¿La relación entre horas trabajadas y sueldo, a tarifa fija por hora, es directamente
    proporcional?
  respuesta: Sí
  solucion_pasos:
  - El sueldo crece en la misma proporción que las horas trabajadas.
errores_frecuentes:
- Creer que 'si una sube y la otra sube' ya es suficiente (deben subir multiplicadas por el
  mismo factor, no sumar el mismo factor).
- Confundir proporcionalidad directa con función lineal afín que no pasa por el origen ($y=mx+n$).
- Asumir que si la constante es negativa, no es proporcional.
- Concluir que dos variables son proporcionales solo porque ambas aumentan, sin comprobar
  que el cociente es constante.
- Verificar la proporcionalidad con un único par de datos, sin comprobar con un segundo par.
afirmaciones_verdaderas:
- La propiedad de concepto de variables directamente proporcionales preserva la consistencia
  lógica.
- Dos variables son directamente proporcionales solo si el cociente entre ellas se mantiene
  constante para todos los pares de valores, no solo para uno.
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de variables
  directamente proporcionales.
