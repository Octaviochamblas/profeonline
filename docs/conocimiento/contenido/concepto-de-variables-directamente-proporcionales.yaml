semantic_id: MAT.NUM.PROP_DIRECTA.CONCEPTO_VARIABLES
resumen_inicial: 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente $\frac{y}{x}$ se mantiene constante ($k > 0$), de modo que al multiplicar una por un factor $n$, la otra se multiplica por el mismo factor.'
explicacion_simple: |
  Dos cantidades son directamente proporcionales cuando crecen o decrecen exactamente al mismo ritmo multiplicativo. Si duplicas la primera cantidad, la segunda también se duplica. Si triplicas la primera, la segunda se triplica. Si Reduces la primera a la mitad, la segunda también se reduce a la mitad. La clave es que la división entre ambas ($\frac{y}{x}$) da siempre el mismo resultado constante $k$.
explicacion_formal: |
  ### Definición formal
  Dos variables cuantitativas $x, y \in \mathbb{R}^+$ están en **relación de proporcionalidad directa** si existe una constante real no nula $k > 0$ tal que para todo par de valores correspondientes $(x_i, y_i)$:
  $$\frac{y_i}{x_i} = k \quad \iff \quad y_i = k \cdot x_i$$

  ### Criterio del factor multiplicativo
  Si la variable $x$ cambia a $n \cdot x$ (para cualquier constante $n > 0$), la variable dependiente $y$ responde transformándose en:
  $$y' = k \cdot (n \cdot x) = n \cdot (k \cdot x) = n \cdot y$$
  demostrando que ambas variables se escalan por el mismo factor $n$.

  ### Distinción con el crecimiento aditivo
  El crecimiento aditivo (donde a ambas variables se les suma un mismo valor, ej: $y = x + 5$) **NO** constituye una proporcionalidad directa, pues el cociente $\frac{x+5}{x} = 1 + \frac{5}{x}$ no es constante.

  ### Síntesis didáctica
  - Cociente constante: $\frac{y}{x} = k$.
  - Escalamiento multiplicativo idéntico: Multiplicar por $n \implies$ resultado multiplicado por $n$.
definiciones_clave: |
  - **Variables directamente proporcionales**: Pareja de magnitudes cuyo cociente $y / x$ es una constante constante $k$.
  - **Factor de proporcionalidad $n$**: Escalar por el cual se multiplican o dividen simultáneamente ambas variables.
  - **Relación multiplicativa**: Vínculo funcional caracterizado por mantener la misma razón relativa ante cambios de escala.
propiedades_relaciones: |
  - **Intercambiabilidad de razón**: Si $y$ es directamente proporcional a $x$ con constante $k$, entonces $x$ es directamente proporcional a $y$ con constante inversa $k' = \frac{1}{k}$.
  - **Paso por el origen nulo**: Cuando la variable independiente $x = 0$, la variable dependiente $y = 0$.
ejemplo_guiado:
  enunciado: 'Un kilogramo de manzanas cuesta $\$1.500$. Determina el costo de $3\text{ kg}$ y comprueba si la cantidad de kilogramos y el costo son variables directamente proporcionales.'
  pasos:
    - 'Paso 1: Identificamos la masa $x = 1\text{ kg}$ y el costo $y = 1.500$. El cociente es $k = \frac{1.500}{1} = 1.500$.'
    - 'Paso 2: Al multiplicar la cantidad de manzanas por $3$ ($x'' = 3\text{ kg}$), calculamos el nuevo costo $y'' = 1.500 \cdot 3 = 4.500$.'
    - 'Paso 3: Evaluamos el nuevo cociente: $k'' = \frac{4.500}{3} = 1.500$.'
    - 'Paso 4: Como el cociente $\frac{y}{x} = 1.500$ no varió, las variables son **directamente proporcionales**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre con la variable dependiente $y$ si la variable independiente $x$ se reduce a la tercera parte ($x / 3$) en una proporcionalidad directa?'
    choices:
      - {text: 'La variable $y$ se reduce también a la tercera parte ($y / 3$), conservando el cociente constante $k$', is_correct: true}
      - {text: 'La variable $y$ se triplica ($3y$)', is_correct: false}
      - {text: 'La variable $y$ permanece inalterada', is_correct: false}
      - {text: 'La variable $y$ se reduce en 3 unidades aditivas', is_correct: false}
    explanation: 'La alternativa correcta es ''La variable $y$ se reduce también a la tercera parte ($y / 3$), conservando el cociente constante $k$''. En la proporción directa ambas variables se escalan por el mismo factor.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $8$ fotocopias cuestan $\$400$, ¿cuál es el cociente constante $k$ y cuánto costarán $24$ fotocopias?'
    choices:
      - {text: '$k = 50$ y el costo de 24 fotocopias es $\$1.200$, multiplicando por 3', is_correct: true}
      - {text: '$k = 3.200$ y el costo es $\$9.600$', is_correct: false}
      - {text: '$k = 50$ y el costo es $\$800$', is_correct: false}
      - {text: '$k = 392$ y el costo es $\$1.000$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 50$ y el costo de 24 fotocopias es $\$1.200$, multiplicando por 3''. $k = 400/8 = 50$; para 24 fotocopias: $24 \cdot 50 = 1.200$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos variables cuantitativas $x$ e $y$ del problema.'
  - 'Paso 2: Calcular el cociente $\frac{y}{x}$ para varios pares de valores observados.'
  - 'Paso 3: Verificar si el cociente da un valor constante $k$ en todos los casos.'
  - 'Paso 4: Concluir la existencia de proporcionalidad directa y aplicar $y = k \cdot x$ para predecir nuevos valores.'
errores_correccion: |
  - **Error 1:** Afirmar que dos variables son directamente proporcionales solo porque "ambas aumentan al mismo tiempo" (ej: decir que la edad y la estatura son proporcionales). **Cómo corregirlo:** No basta con que aumenten; se requiere estrictamente que **el cociente $\frac{y}{x}$ sea una constante fija**.
  - **Error 2:** Confundir la relación proporcional $y = kx$ con una función afín $y = kx + n$ con $n \neq 0$. **Cómo corregirlo:** Si hay un término independiente $n$ (como una tarifa base fija), **no es proporcionalidad directa** porque $y/x$ varía.
ejemplos:
  - titulo: 'Proporcionalidad en compra a granel'
    enunciado: 'Si $2\text{ kg}$ de pan cuestan $\$3.000$ y $5\text{ kg}$ cuestan $\$7.500$, ¿son variables directamente proporcionales con $k = 1.500$?'
    alternativas:
      - 'Sí, pues $3000/2 = 7500/5 = 1.500$'
      - 'No, el precio cambia'
      - 'No, $k = 4.500$'
    respuesta: 'Sí, pues $3000/2 = 7500/5 = 1.500$'
    solucion_pasos:
      - '1. Evaluamos $3.000 / 2 = 1.500$.'
      - '2. Evaluamos $7.500 / 5 = 1.500 \implies$ Proporcionalidad directa.'
  - titulo: 'Crecimiento aditivo no proporcional'
    enunciado: 'Si $y = x + 10$, para $x=1 \implies y=11$ ($k=11$) y para $x=2 \implies y=12$ ($k=6$). ¿Existe proporcionalidad directa?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Los cocientes $11$ y $6$ son diferentes.'
  - titulo: 'Duplicación de variables'
    enunciado: 'Si la velocidad constante duplica la distancia recorrida al duplicar el tiempo, ¿distancia y tiempo son directamente proporcionales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cumplen el criterio del factor multiplicativo.'
  - titulo: 'Valor nulo en el origen'
    enunciado: 'En la proporción directa $y = 50x$, si compro $0$ productos ($x=0$), ¿el pago es $\$0$ ($y=0$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Toda relación de proporción directa pasa por $(0,0)$.'
errores_frecuentes:
  - 'Considerar que cualquier relación donde ambas variables crecen simultáneamente es una proporción directa.'
  - 'Clasificar funciones afines con constante de inicio $y = kx + n$ como proporcionalidad directa.'
  - 'Restar las variables en lugar de calcular su cociente $y / x$ para verificar la constancia.'
  - 'Invertir el factor multiplicativo aumentando una variable mientras la otra disminuye.'
  - 'La constante de proporcionalidad $k$ puede ser igual a cero o negativa en magnitudes reales de cantidad.'
afirmaciones_verdaderas:
  - 'Dos variables $x$ e $y$ son directamente proporcionales si y solo si su cociente $\frac{y}{x} = k$ se mantiene constante.'
  - 'Al multiplicar la variable independiente por un número real $n$, la variable dependiente queda multiplicada exactamente por el mismo número $n$.'
al_terminar_debes_poder: 'Identificar variables directamente proporcionales verificando la constancia del cociente $\frac{y}{x} = k$.'
