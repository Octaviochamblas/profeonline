semantic_id: MAT.NUM.PROP_DIRECTA.CONCEPTO_VARIABLES
resumen_inicial: 'Concepto de variables directamente proporcionales: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: ¿Has notado que si compras el doble de pan, pagas exactamente
  el doble? Cuando dos magnitudes se mueven en perfecta sincronía hacia arriba o hacia
  abajo, estamos ante una proporcionalidad directa.
explicacion_formal: 'Hablamos de **proporcionalidad directa** cuando dos magnitudes
  numéricas están vinculadas de modo que el aumento de una provoca el aumento de la
  otra en la misma proporción (y lo mismo con su disminución).


  Matemáticamente, si $x$ e $y$ son directamente proporcionales, el cociente entre
  ellas es constante:

  $\frac{y}{x} = k$

  Donde $k$ es la **constante de proporcionalidad**. Si $x$ se duplica, $y$ se duplica.
  Si $x$ se divide por 3, $y$ se divide por 3.'
definiciones_clave: '- **Concepto de variables directamente proporcionales**: Elemento
  central dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a concepto de variables directamente proporcionales.'
ejemplo_guiado:
