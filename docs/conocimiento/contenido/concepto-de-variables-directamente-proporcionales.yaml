resumen_inicial: Dos variables $x$ e $y$ son directamente proporcionales si al multiplicar
  o dividir una de ellas por una constante real $k > 0$, la otra variable queda multiplicada
  o dividida exactamente por el mismo factor.
explicacion_simple: Dos magnitudes son directamente proporcionales cuando crecen o
  decrecen a la par en la misma proporción. Si duplicamos la cantidad de kilos de
  pan que compramos, el precio total que pagamos se duplica exactamente.
explicacion_formal: 'Dos variables $x, y > 0$ se definen como **Directamente Proporcionales**
  si su cociente es una constante constante no nula $k$:


  $$\frac{y}{x} = k \quad (k \text{ constante } > 0)$$


  **Propiedad de escala:**

  Para todo factor de escala $\alpha > 0$, si $x \to \alpha \cdot x \implies y \to
  \alpha \cdot y$.'
definiciones_clave: '- **Variables directamente proporcionales**: Magnitudes cuyo
  cociente $y / x = k$ permanece constante.'
propiedades_relaciones: '- **Variación simultánea proporcional**: Al multiplicar $x$
  por $\alpha$, $y$ se multiplica por $\alpha$.'
ejemplo_guiado:
  enunciado: Un automóvil consume $8\text{ litros}$ de bencina cada $100\text{ km}$.
    ¿Son la distancia recorrida y el combustible consumido directamente proporcionales?
  pasos:
  - 'Paso 1: Calcular la razón para $100\text{ km}$: $\frac{8}{100} = 0,08\text{ L/km}$.'
  - 'Paso 2: Evaluar a $200\text{ km}$ (el doble de distancia): consume el doble ($16\text{
    L}$) $\implies \frac{16}{200} = 0,08$.'
  - 'Paso 3: Verificar que el cociente $k = 0,08$ no varía.'
  - 'Conclusión: Las variables son directamente proporcionales.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación matemática caracteriza a dos variables x e y directamente
    proporcionales?
  choices:
  - text: Su cociente y / x es siempre constante (y / x = k)
    is_correct: true
  - text: Su producto x · y es constante
    is_correct: false
  - text: Su suma x + y es igual a cero
    is_correct: false
  - text: Su resta x - y es fija
    is_correct: false
  explanation: La alternativa correcta es 'Su cociente y / x es siempre constante
    (y / x = k)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado del combustible y la distancia, ¿qué ocurre con el
    consumo al duplicar la distancia?
  choices:
  - text: Se duplica exactamente manteniendo constante la razón 0,08 L/km
    is_correct: true
  - text: Se reduce a la mitad
    is_correct: false
  - text: Permanece igual en 8 L
    is_correct: false
  - text: Se cuadruplica
    is_correct: false
  explanation: La alternativa correcta es 'Se duplica exactamente manteniendo constante
    la razón 0,08 L/km'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y reconocer variables
  directamente proporcionales verificando la constancia de su cociente $\frac{y}{x}
  = k$.
semantic_id: MAT.NUM.PROP_DIRECTA.CONCEPTO_VARIABLES
procedimiento:
- 'Paso 1: Verificar que el cociente $y / x = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = k \cdot x$ o el gráfico de recta que pasa por
  $(0,0)$.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Creer que una recta con desfase $y = kx + c$ ($c
  \neq 0$) representa proporcionalidad directa.** **Cómo corregirlo:** La proporcionalidad
  directa exige obligatoriamente pasar por el origen $(0,0)$, sin término independiente
  $c$.


  - **Error 2: Usar el producto $x \cdot y$ en lugar del cociente $y / x$ para hallar
  $k$.** **Cómo corregirlo:** El producto constante corresponde a proporcionalidad
  INVERSA; la directa usa el cociente $y/x = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_DIRECTA.CONCEPTO_VARIABLES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad directa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de cociente.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por cociente constante y/x.
- titulo: ¿Pasa la gráfica de una proporción directa por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $x=0 \implies y=0$.
- titulo: ¿Permite el modelo y = kx calcular valores desconocidos?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicando el valor de $x$ por la constante $k$.
errores_frecuentes:
- Clasificar como proporcionalidad directa una relación cuya gráfica es una recta
  que no pasa por el origen $(0,0)$.
- Multiplicar las variables entre sí ($x \cdot y$) pretendiendo obtener la constante
  de proporcionalidad directa.
- Sumar una cantidad fija a ambas variables pensando que se mantiene la relación de
  proporción.
- Declarar que si una variable aumenta y la otra también aumenta, existe proporcionalidad
  directa sin comprobar la constancia de $y/x$.
- Omitir incluir la unidad de medida compuesta en el valor de la constante de proporcionalidad
  $k$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante:
  $\frac{y}{x} = k$.'
- El gráfico de una relación de proporcionalidad directa es siempre una línea recta
  que pasa por el origen $(0,0)$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
