semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.MONOTONIA_IMPAR
resumen_inicial: 'La monotonía de una función potencia de exponente entero impar positivo es global y uniforme en todo $\mathbb{R}$: estrictamente creciente si $a > 0$, o estrictamente decreciente si $a < 0$.'
explicacion_simple: |
  A diferencia de las funciones de exponente par que cambian de dirección en el centro, las funciones potencia con exponente entero impar positivo (como $x, x^3, x^5$) mantienen la misma dirección durante todo su recorrido. Si el coeficiente $a$ es positivo (como en $f(x) = 2x^3$), la función sube sin parar desde $-\infty$ hasta $+\infty$, siendo estrictamente creciente en todo el conjunto de los números reales. Si $a$ es negativo (como en $f(x) = -2x^3$), la función baja sin parar siendo estrictamente decreciente en todo $\mathbb{R}$.
explicacion_formal: |
  ### Definición formal
  Para una función potencia $f(x) = a x^n$ con exponente impar positivo $n = 2k+1 (k \in \mathbb{Z}^+)$, la derivada primera $f'(x) = (2k+1) \cdot a \cdot x^{2k}$ posee un signo constante no nulo en todo $\mathbb{R} \setminus \{0\}$, lo que garantiza una **monotonía global uniforme en todo $\mathbb{R}$**:

  1. **Caso Coeficiente Positivo ($a > 0$)**:
     - Puesto que $(2k+1) a > 0$ y $x^{2k} \ge 0$, la derivada $f'(x) \ge 0$ para todo $x \in \mathbb{R}$ (anulándose sólo en el punto de inflexión $x = 0$).
     - La función $f(x)$ es **estrictamente creciente en todo $\mathbb{R}$**:
       $$\forall x_1, x_2 \in \mathbb{R}, \quad x_1 < x_2 \implies f(x_1) < f(x_2)$$

  2. **Caso Coeficiente Negativo ($a < 0$)**:
     - Puesto que $(2k+1) a < 0$ y $x^{2k} \ge 0$, la derivada $f'(x) \le 0$ para todo $x \in \mathbb{R}$.
     - La función $f(x)$ es **estrictamente decreciente en todo $\mathbb{R}$**:
       $$\forall x_1, x_2 \in \mathbb{R}, \quad x_1 < x_2 \implies f(x_1) > f(x_2)$$

  ### Síntesis didáctica
  Inexistencia de cambios de dirección: No existen intervalos disjuntos de crecimiento/decrecimiento. Toda la curva mantiene la misma monotonía de extremo a extremo.
definiciones_clave: |
  - **Monotonía global en $\mathbb{R}$**: Mantención del mismo sentido de variación (creciente o decreciente) en la totalidad del dominio.
  - **Inyectividad por monotonía**: Consecuencia directa por la cual cada ordenada proviene de una única abscisa.
  - **Ausencia de extremos locales**: Carencia de puntos donde la curva cambie de subir a bajar o viceversa.
propiedades_relaciones: |
  - **Existencia de función inversa real**: Debido a su monotonía estricta global, toda función potencia de exponente impar admite una función inversa real definida en todo $\mathbb{R}$ ($f^{-1}(x) = \sqrt[n]{x/a}$).
  - **Conservación de relaciones de orden**: Para $a > 0$, resolver inecuaciones $x_1^n < x_2^n$ equivale a $x_1 < x_2$.
ejemplo_guiado:
  enunciado: 'Analiza la monotonía global de las funciones potencia impares $f(x) = 4x^5$ y $g(x) = -3x^3$ comprobando mediante la evaluación de abscisas en orden ascendente $x = -2, 0, 2$.'
  pasos:
    - 'Paso 1: Evaluamos $f(x) = 4x^5$: $f(-2) = 4(-32) = -128$, $f(0) = 0$, $f(2) = 4(32) = 128$.'
    - 'Paso 2: Como $-128 < 0 < 128$ para entradas ascendentes $-2 < 0 < 2$, se confirma que $f(x)$ es **estrictamente creciente en todo $\mathbb{R}$** ($a = 4 > 0$).'
    - 'Paso 3: Evaluamos $g(x) = -3x^3$: $g(-2) = -3(-8) = 24$, $g(0) = 0$, $g(2) = -3(8) = -24$.'
    - 'Paso 4: Como $24 > 0 > -24$ para entradas ascendentes $-2 < 0 < 2$, se confirma que $g(x)$ es **estrictamente decreciente en todo $\mathbb{R}$** ($a = -3 < 0$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de monotonía presenta la función potencia $f(x) = 7x^3$ en todo el conjunto de los números reales $\mathbb{R}$?'
    choices:
      - {text: 'Es estrictamente creciente en todo $\mathbb{R}$, porque su exponente es impar positivo y su coeficiente es positivo $a = 7 > 0$', is_correct: true}
      - {text: 'Es decreciente en $]-\infty, 0]$ y creciente en $[0, +\infty[$', is_correct: false}
      - {text: 'Es estrictamente decreciente en todo $\mathbb{R}$', is_correct: false}
      - {text: 'Es constante en el origen', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente creciente en todo $\mathbb{R}$, porque su exponente es impar positivo y su coeficiente es positivo $a = 7 > 0$''. Las potencias de exponente impar con $a > 0$ crecen sin interrupción en todo su dominio.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si sabemos que $f(x) = -5x^5$ es una función potencia de exponente impar con coeficiente negativo $a = -5 < 0$, ¿qué ocurre con sus valores de salida a medida que la variable $x$ aumenta de $-\infty$ a $+\infty$?'
    choices:
      - {text: 'Los valores de salida disminuyen de forma continua de $+\infty$ a $-\infty$, siendo estrictamente decreciente en todo $\mathbb{R}$', is_correct: true}
      - {text: 'Los valores de salida aumentan continuamente de $-\infty$ a $+\infty$', is_correct: false}
      - {text: 'Los valores de salida disminuyen primero y luego aumentan', is_correct: false}
      - {text: 'Los valores de salida son siempre iguales a cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Los valores de salida disminuyen de forma continua de $+\infty$ a $-\infty$, siendo estrictamente decreciente en todo $\mathbb{R}$''. Un coeficiente $a < 0$ en potencias impares produce un decrecimiento global.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el exponente $n$ sea un número entero positivo impar ($n = 1, 3, 5\dots$).'
  - 'Paso 2: Inspeccionar el signo del coeficiente multiplicativo $a$.'
  - 'Paso 3: Si $a > 0$, declarar la función como estrictamente creciente en la totalidad del conjunto $\mathbb{R}$.'
  - 'Paso 4: Si $a < 0$, declarar la función como estrictamente decreciente en la totalidad del conjunto $\mathbb{R}$.'
errores_correccion: |
  - **Error 1:** Afirmar que la función $f(x) = x^3$ se detiene o cambia de monotonía en el punto $(0, 0)$. **Cómo corregirlo:** En $(0, 0)$ la derivada es cero ($f'(0) = 0$), pero es un punto de inflexión con pendiente tangente horizontal. La función sigue siendo estrictamente creciente a ambos lados de cero.
  - **Error 2:** Dividir la monotonía de $x^3$ en tramos como si fuera $x^2$. **Cómo corregirlo:** Las funciones de exponente impar conservan la misma monotonía uniforme en todo el dominio $\mathbb{R}$ sin dividirse en tramos opuestos.
ejemplos:
  - titulo: 'Monotonía de potencia cúbica mónica'
    enunciado: '¿La función $f(x) = x^3$ es estrictamente creciente en $\mathbb{R}$?'
    alternativas:
      - 'Sí, en todo $\mathbb{R}$'
      - 'No, sólo para $x > 0$'
      - 'No, es decreciente para $x < 0$'
    respuesta: 'Sí, en todo $\mathbb{R}$'
    solucion_pasos:
      - '1. Exponente $n = 3$ es impar y $a = 1 > 0$.'
      - '2. Es estrictamente creciente en todo $\mathbb{R}$.'
  - titulo: 'Monotonía de impar negativo'
    enunciado: '¿La función $g(x) = -2x^5$ es estrictamente decreciente en todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con $n = 5$ impar y $a = -2 < 0$, desciende continuamente en todo el dominio.'
  - titulo: 'Inexistencia de extremos relativos'
    enunciado: '¿Posee la función $h(x) = 6x^7$ algún máximo o mínimo local?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Al ser estrictamente creciente en todo $\mathbb{R}$, carece de puntos extremos locales.'
  - titulo: 'Invertibilidad por monotonía'
    enunciado: '¿Es posible definir la función inversa de $f(x) = 8x^3$ en todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La monotonía estricta global garantiza la biyectividad e inyectividad en todo $\mathbb{R}$.'
errores_frecuentes:
  - 'La función potencia de exponente impar $f(x) = x^3$ es decreciente para números negativos $x < 0$.'
  - 'En el origen $(0, 0)$, la función $f(x) = x^5$ alcanza un mínimo local.'
  - 'Una función de exponente impar con $a < 0$ es creciente en el intervalo $[0, +\infty[$.'
  - 'La monotonía de la función $f(x) = x^3$ depende del tramo de abscisas seleccionado.'
  - 'Las funciones de exponente impar cambian de monotonía al cruzar el eje $y$.'
afirmaciones_verdaderas:
  - 'La monotonía de las funciones potencia de exponente entero impar positivo es uniforme y global en todo el conjunto de los números reales $\mathbb{R}$.'
  - 'Si el coeficiente $a > 0$, la función es estrictamente creciente en todo $\mathbb{R}$; si $a < 0$, es estrictamente decreciente en todo $\mathbb{R}$.'
