semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RAIZ_EN_POTENCIA
resumen_inicial: La relación entre exponentes fraccionarios y funciones raíz establece la equivalencia formal $f(x) = x^{p/q} = \sqrt[q]{x^p} = (\sqrt[q]{x})^p$ ($p, q \in \mathbb{Z}^+, q \ge 2$), donde el denominador $q$ representa el índice del radical y el numerador $p$ la potencia del radicando.
explicacion_simple: "![La relación entre exponentes fraccionarios y funciones raíz establece la equivalencia formal $f(x) = x^{p/q} = \\sqrt[q]{x^p} = (\\sqrt[q]{x})^p$ ($p, q \\in \\mathbb{Z}^+, q \\ge 2$), donde el denominador $q$ representa el índice del radical y el numerador $p$ la potencia del radicando](/static/img/nodos/relacion-entre-exponentes-fraccionarios-y-funciones-raiz-intro.svg)\n\n\nLas **raíces** y los **exponentes fraccionarios** son exactamente la misma cosa escrita en dos idiomas diferentes:\n\n$$x^{\\mathbf{p / q}} = \\sqrt[\\mathbf{q}]{x^{\\mathbf{p}}} \\quad \\Longleftrightarrow \\quad \\begin{cases} \\mathbf{q} = \\text{Índice de la Raíz (Abajo)} \\\\ \\mathbf{p} = \\text{Potencia del Exponente (Arriba)} \\end{cases}$$\n\n- **¿Cómo acordarse siempre?**\n  - El número de **abajo** ($q$) es el que se mete en el gancho de la raíz: $\\sqrt[q]{...}$.\n  - El número de **arriba** ($p$) es la potencia.\n- **Ejemplos clásicos:**\n  - $x^{1/2} = \\sqrt{x}$ (la raíz cuadrada).\n\
  \  - $x^{1/3} = \\sqrt[3]{x}$ (la raíz cúbica).\n  - $x^{2/3} = \\sqrt[3]{x^2} = (\\sqrt[3]{x})^2$.\n  - $x^{3/4} = \\sqrt[4]{x^3}$."
explicacion_formal: 'Sea $p, q \in \mathbb{Z}^+$ con $q \ge 2$ y $\operatorname{mcd}(p, q) = 1$. Se define la potencia con exponente racional $p/q$ sobre $\mathbb{R}^+$ (o sobre $\mathbb{R}$ si $q$ es impar) como la composición de la raíz $q$-ésima y la potencia $p$-ésima:

  $$x^{p/q} = \left(x^{1/q}\right)^p = \left(\sqrt[q]{x}\right)^p = \sqrt[q]{x^p}$$


  **Propiedades operativas unificadas**:

  1. **Producto de potencias de igual base**: $x^{a/b} \cdot x^{c/d} = x^{(ad+bc)/bd}$.

  2. **Potencia de una potencia**: $\left(x^{p/q}\right)^{m/n} = x^{pm / qn}$.

  3. **Radicación compuesta**: $\sqrt[m]{\sqrt[n]{x}} = \left(x^{1/n}\right)^{1/m} = x^{1/(mn)} = \sqrt[mn]{x}$.'
definiciones_clave: '- **Exponente racional / fraccionario**: Representación de radicales en notación exponencial $p/q$.

  - **Índice del radical**: Denominador $q$ que define el grado de la raíz.'
propiedades_relaciones: '- **Conmutatividad de potencia y raíz**: $(\sqrt[q]{x})^p = \sqrt[q]{x^p}$ para todo $x \ge 0$.

  - **Simplificación de índices**: $\sqrt[2k]{x^{2m}} = \sqrt[k]{x^m}$ para $x \ge 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La relación entre exponentes fraccionarios y funciones raíz establece la equivalencia formal $f(x) = x^{p/q} = \sqrt[q]{x^p} = (\sqrt[q]{x})^p$ ($p, q \in \mathbb{Z}^+, q \ge 2$), donde el denominador $q$ representa el índice del radical y el numerador $p$ la potencia del radicando](/static/img/nodos/relacion-entre-exponentes-fraccionarios-y-funciones-raiz-ejemplos.svg)



    Reescribe y calcula numéricamente:

    1) Escribe $f(x) = 5\sqrt[3]{x^2}$ en forma de potencia $a x^n$.

    2) Escribe $g(x) = 2 x^{5/4}$ en forma radical.

    3) Calcula el valor exacto de $27^{2/3}$.'
  pasos:
  - 'Paso 1: Para $5\sqrt[3]{x^2}$: El índice es $q = 3$ y la potencia $p = 2$ $\implies$ **$f(x) = 5 x^{2/3}$**.'
  - 'Paso 2: Para $2 x^{5/4}$: El denominador es $4$ (raíz cuarta) y numerador $5$ $\implies$ **$g(x) = 2 \sqrt[4]{x^5}$**.'
  - 'Paso 3: Para $27^{2/3}$:

    - Aplicar primero la raíz: $(\sqrt[3]{27})^2 = (3)^2 = \mathbf{9}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación en potencia con exponente fraccionario de $f(x) = 4\sqrt[5]{x^3}$?
  choices:
  - text: f(x) = 4 x^(3/5)
    is_correct: true
  - text: f(x) = 4 x^(5/3)
    is_correct: false
  - text: f(x) = (4x)^(3/5)
    is_correct: false
  - text: f(x) = 12 x^(1/5)
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 4 x^(3/5)'. El índice 5 es el denominador y la potencia 3 es el numerador.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto vale $16^{3/4}$?
  choices:
  - text: 8 (porque (⁴√16)³ = 2³ = 8)
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '8 (porque (⁴√16)³ = 2³ = 8)'. Primero se extrae la raíz cuarta $\sqrt[4]{16} = 2$ y luego se eleva al cubo $2^3 = 8$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice del radical $q$ y la potencia interior $p$.'
- 'Paso 2: Formular la fracción $n = p/q$ ubicando el índice en el denominador.'
- 'Paso 3: Escribir la función potencia en la forma $f(x) = a \cdot x^{p/q}$.'
- 'Paso 4: Para calcular valores numéricos, aplicar preferentemente primero la raíz y luego la potencia.'
errores_correccion: '- **Error común:** Invertir la fracción escribiendo $x^{\text{índice}/\text{potencia}}$ (ej: $\sqrt[3]{x^2} = x^{3/2}$).

  - **Cómo corregirlo:** La regla es **potencia / índice**: $\sqrt[3]{x^2} = \mathbf{x^{2/3}}$.'
ejemplos:
- titulo: 'Ejemplo 1: Conversión de raíz cuadrada'
  enunciado: 'La expresión $\sqrt{x}$ equivale a:'
  alternativas:
  - x^(1/2)
  - x²
  - x^(-2)
  - 2x
  respuesta: x^(1/2)
  solucion_pasos:
  - 'Paso 1: Raíz cuadrada tiene índice 2 y potencia 1 $\implies x^{1/2}$.'
- titulo: 'Ejemplo 2: Raíz de potencia mayor'
  enunciado: 'Reescribe $\sqrt[3]{x^7}$ como potencia:'
  alternativas:
  - x^(7/3)
  - x^(3/7)
  - 7/3 x
  - x⁴
  respuesta: x^(7/3)
  solucion_pasos:
  - 'Paso 1: $\sqrt[3]{x^7} = x^{7/3}$.'
- titulo: 'Ejemplo 3: Evaluación de potencia fraccionaria'
  enunciado: 'Calcula el valor de $8^{4/3}$:'
  alternativas:
  - '16'
  - '32'
  - '64'
  - '8'
  respuesta: '16'
  solucion_pasos:
  - 'Paso 1: $(\sqrt[3]{8})^4 = 2^4 = 16$.'
- titulo: 'Ejemplo 4: Raíz en denominador'
  enunciado: 'Reescribe $\frac{1}{\sqrt[5]{x^2}}$ como potencia:'
  alternativas:
  - x^(-2/5)
  - x^(2/5)
  - x^(-5/2)
  - -2/5 x
  respuesta: x^(-2/5)
  solucion_pasos:
  - 'Paso 1: $\frac{1}{x^{2/5}} = x^{-2/5}$.'
errores_frecuentes:
- Invertir la fracción del exponente.
- Elevar primero a potencias grandes haciendo difícil el cálculo mental de la raíz.
- Olvidar que el índice de la raíz cuadrada implícito es 2.
afirmaciones_verdaderas:
- Toda expresión radical se puede representar como una potencia con exponente fraccionario x^(p/q).
- El denominador del exponente fraccionario representa el índice de la raíz y el numerador la potencia.
al_terminar_debes_poder: '**QUÉ:** Convertir y operar expresiones entre exponentes fraccionarios y funciones raíz.


  **CÓMO:** Aplicando la equivalencia formal x^(p/q) = ⁿ√(xᵐ) y simplificando evaluaciones numéricas.


