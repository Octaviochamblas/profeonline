semantic_id: MAT.ALG.DESIG_PROPIEDADES.POTENCIA_NATURAL
resumen_inicial: 'Elevación de una desigualdad a potencia natural: relaciones de orden,
  intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Al trabajar con desigualdades entre números positivos, una operación
  común es elevar ambos lados a una potencia natural. Esta operación preserva el sentido
  original de la desigualdad.
explicacion_formal: '### Definición formal

  Si $0 < a < b$ y $n \in \mathbb{N}$, entonces $a^n < b^n$.


  ### Desarrollo didáctico

  Esta propiedad se basa en que las funciones de la forma $f(x) = x^n$ con $n \in
  \mathbb{N}$ son estrictamente crecientes para $x > 0$. Esto significa que si un
  número positivo es mayor que otro, al multiplicarlo por sí mismo varias veces, el
  resultado seguirá siendo mayor que el otro número multiplicado por sí mismo la misma
  cantidad de veces. Es importante asegurar que los números base sean positivos para
  garantizar esta consistencia con cualquier $n$.'
definiciones_clave: '- **Elevación de una desigualdad a potencia natural**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a elevación de una desigualdad a potencia
  natural.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de elevación de una
    desigualdad a potencia natural.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de elevación de una desigualdad a potencia
    natural, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
