semantic_id: MAT.ALG.DESIG_PROPIEDADES.POTENCIA_NATURAL
resumen_inicial: Elevación de desigualdades de términos positivos a una potencia natural
  mantiene la relación de orden.
explicacion_simple: 'Si dos números son positivos (como $3 < 5$) y elevas ambos al
  cuadrado, al cubo o a cualquier potencia entera positiva, el resultado preserva
  la misma relación de orden:

  $3^2 < 5^2 \implies 9 < 25$.

  Si los números son negativos, elevar al cuadrado invierte el orden (como $(-5) <
  (-3) \implies (-5)^2 > (-3)^2 \implies 25 > 9$).'
explicacion_formal: 'Para constantes no negativas $a, b \in \mathbb{R}^+ \cup \{0\}$
  y exponentes naturales $n \in \mathbb{N}$:


  $$0 \le a < b \iff a^n < b^n \quad (n \in \mathbb{N})$$


  $$\text{Para números negativos } a < b \le 0 \implies a^{2k} > b^{2k} \quad (\text{potencia
  par } 2k)$$'
definiciones_clave: '- **Potenciación en desigualdades**: Aplicación del exponente
  natural $n$ sobre ambos miembros manteniendo el orden si los términos son no negativos.'
propiedades_relaciones: '- **Monotonía creciente**: La función $f(x) = x^n$ es estrictamente
  creciente para $x \ge 0$.'
ejemplo_guiado:
  enunciado: Dada la desigualdad de números positivos $3 < 5$, eleva ambos miembros
    al cuadrado ($n = 2$) y al cubo ($n = 3$) y comprueba los resultados.
  pasos:
  - 'Paso 1: Elevar al cuadrado: $3^2 = 9$ y $5^2 = 25 \implies 9 < 25$ (se conserva
    el sentido $<$).Paso 2: Elevar al cubo: $3^3 = 27$ y $5^3 = 125 \implies 27 <
    125$ (se conserva el sentido $<$).Paso 3: Concluir que para números positivos
    las potencias preservan la relación de orden.'
checkpoints:
- placement: after_explicacion_formal
  question: Al elevar la desigualdad de números positivos $3 < 5$ al cuadrado, ¿cuál
    es el resultado obtenido?
  choices:
  - text: $9 < 25$
    is_correct: true
  - text: $9 > 25$
    is_correct: false
  - text: $6 < 10$
    is_correct: false
  - text: $9 = 25$
    is_correct: false
  explanation: La alternativa correcta es '$9 < 25$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si elevamos al cuadrado la desigualdad de números negativos $-5 < -3$,
    ¿cuál es el resultado correcto al ser potencia par?
  choices:
  - text: $25 > 9$
    is_correct: true
  - text: $25 < 9$
    is_correct: false
  - text: $-25 < -9$
    is_correct: false
  - text: $25 = 9$
    is_correct: false
  explanation: La alternativa correcta es '$25 > 9$'. (Al elevar al cuadrado números
    negativos, el orden se invierte).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar si los números $a$ y $b$ de la desigualdad son ambos positivos
  o ambos negativos.'
- 'Paso 2: Elevar ambos miembros al exponente $n$.'
- 'Paso 3: Si son positivos, mantener el símbolo. Si son negativos y la potencia es
  par, invertir el símbolo.'
errores_correccion: '- **Error común:** Mantener el mismo símbolo al elevar al cuadrado
  números negativos (pensar que $(-5)^2 < (-3)^2$).

  - **Cómo corregirlo:** Como $(-5)^2 = 25$ y $(-3)^2 = 9$, la relación real resulta
  ser $25 > 9$ (se invierte el símbolo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
fuente: Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades
