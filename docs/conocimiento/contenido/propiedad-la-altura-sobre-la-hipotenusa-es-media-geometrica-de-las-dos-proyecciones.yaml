semantic_id: MAT.GEO.RELACIONES_TR.ALTURA_MEDIA_GEOMETRICA
resumen_inicial: 'El teorema de Euclides respecto a la altura establece que en todo triángulo rectángulo, el cuadrado de la altura relativa a la hipotenusa es igual al producto de las proyecciones de los catetos sobre ella: $h_c^2 = p \cdot q$.'
explicacion_simple: |
  ![Euclides para la Altura](/static/img/nodos/propiedad-la-altura-sobre-la-hipotenusa-es-media-geometrica-de-las-dos-proyecciones-intro.svg)

  Para saber cuánto mide la altura que cae sobre la hipotenusa usando las dos sombras:

  - **Multiplicas las dos sombras**: Sombra izquierda ($p$) por sombra derecha ($q$): $p \times q$.
  - **Sacas la raíz cuadrada**: El resultado es exactamente la altura: $h_c = \sqrt{p \cdot q}$.
  - **Fórmula de oro**: $h_c^2 = p \cdot q$.
explicacion_formal: |
  ### Teorema formal de Euclides (Relativo a la altura)
  En cualquier triángulo rectángulo $\Delta ABC$ con ángulo recto en $C$ ($\gamma = 90^\circ$), el cuadrado de la altura relativa a la hipotenusa $h_c = \overline{CD}$ es estrictamente igual al producto de las longitudes de las proyecciones ortogonales $p$ y $q$:

  $$h_c^2 = p \cdot q \iff \frac{p}{h_c} = \frac{h_c}{q} \iff h_c = \sqrt{p \cdot q}$$

  ### Desglose simbólico y geométrico
  - $h_c = CD$: Altura ortogonal sobre la hipotenusa.
  - $p = AD$: Proyección ortogonal del cateto $b$.
  - $q = DB$: Proyección ortogonal del cateto $a$.
  - Demostración por semejanza directa:
    - Los dos subtriángulos interiores satisfacen $\Delta ADC \sim \Delta CDB$ (por tener ángulos complementarios $\angle ACD = \angle B$ y $\angle CAD = \angle BCD$).
    - Al establecer la razón de proporcionalidad entre lados homólogos:

    $$\frac{AD}{CD} = \frac{CD}{DB} \implies \frac{p}{h_c} = \frac{h_c}{q} \implies h_c^2 = p \cdot q$$

  ### Síntesis didáctica
  Este teorema demuestra que la altura relativa a la hipotenusa es la media geométrica exacta entre los dos segmentos en que divide a la hipotenusa.
definiciones_clave: |
  - **Teorema de Euclides para la altura**: Proposición métrica $h_c^2 = p \cdot q$.
  - **Media proporcional de la altura**: Proporción continua $\frac{p}{h_c} = \frac{h_c}{q}$.
  - **Semejanza interna**: Razón de semejanza entre los triángulos rectángulos izquierdo y derecho.
propiedades_relaciones: |
  - **Fórmula radical**: $h_c = \sqrt{p \cdot q}$.
  - **Despejes de proyecciones**: $p = \frac{h_c^2}{q}$ y $q = \frac{h_c^2}{p}$.
  - **Área en función de proyecciones**: $\operatorname{Área}(\Delta ABC) = \frac{1}{2}(p + q)\sqrt{p \cdot q}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Euclides para la Altura](/static/img/nodos/propiedad-la-altura-sobre-la-hipotenusa-es-media-geometrica-de-las-dos-proyecciones-ejemplos.svg)

    En un triángulo rectángulo, la altura relativa a la hipotenusa divide a esta en dos segmentos que miden $p = 4\text{ cm}$ y $q = 9\text{ cm}$. Calcula la longitud de la altura $h_c$.
  pasos:
  - 'Paso 1: Identificar las proyecciones: $p = 4\text{ cm}$ y $q = 9\text{ cm}$.'
  - 'Paso 2: Aplicar el Teorema de Euclides para la altura: $h_c^2 = p \cdot q$.'
  - 'Paso 3: Calcular el producto: $h_c^2 = 4 \times 9 = 36$.'
  - 'Paso 4: Extraer la raíz cuadrada: $h_c = \sqrt{36} = 6\text{ cm}$.'
  - 'Paso 5: Concluir que la altura sobre la hipotenusa mide exactamente $6\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión del teorema de Euclides para la altura hc en función de las proyecciones p y q?
  choices:
  - text: $h_c^2 = p \cdot q$
    is_correct: true
  - text: $h_c = p \cdot q$
    is_correct: false
  - text: $h_c^2 = p + q$
    is_correct: false
  - text: $h_c^2 = c \cdot p$
    is_correct: false
  explanation: 'El teorema de Euclides para la altura establece que $h_c^2 = p \cdot q$ ($h_c = \sqrt{p \cdot q}$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si las proyecciones de los catetos sobre la hipotenusa miden 3 cm y 12 cm, ¿cuánto mide la altura hc?
  choices:
  - text: $6\text{ cm}$
    is_correct: true
  - text: $36\text{ cm}$
    is_correct: false
  - text: $15\text{ cm}$
    is_correct: false
  - text: $4\text{ cm}$
    is_correct: false
  explanation: 'Mide $6\text{ cm}$, ya que $h_c = \sqrt{3 \times 12} = \sqrt{36} = 6\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos proyecciones $p$ y $q$ sobre la hipotenusa.'
- 'Paso 2: Multiplicar ambos valores: $P = p \cdot q$.'
- 'Paso 3: Extraer la raíz cuadrada del producto: $h_c = \sqrt{P}$.'
- 'Paso 4: Simplificar el radical o calcular la raíz exacta y adjuntar unidades.'
errores_correccion: 'No confundas $p \cdot q$ (que da $h_c^2$) con $p + q$ (que da la hipotenusa total $c$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si las proyecciones sobre la hipotenusa son $p = 2\text{ cm}$ y $q = 8\text{ cm}$, ¿cuál es la longitud de la altura $h_c$?
  alternativas:
  - $4\text{ cm}$
  - $16\text{ cm}$
  - $10\text{ cm}$
  respuesta: $4\text{ cm}$
  solucion_pasos:
  - '$h_c = \sqrt{p \cdot q} = \sqrt{2 \times 8} = \sqrt{16} = 4\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: En un triángulo rectángulo la altura es $h_c = 6\text{ cm}$ y una proyección es $p = 4\text{ cm}$. ¿Cuánto mide la otra proyección $q$?
  alternativas:
  - $9\text{ cm}$
  - $2\text{ cm}$
  - $12\text{ cm}$
  respuesta: $9\text{ cm}$
  solucion_pasos:
  - '$h_c^2 = p \cdot q \implies 6^2 = 4 \cdot q \implies 36 = 4q \implies q = 9\text{ cm}$.'
- titulo: ¿La altura sobre la hipotenusa es media geométrica entre las dos proyecciones?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, porque $h_c = \sqrt{p \cdot q}$.'
- titulo: ¿La altura al cuadrado es igual a la suma de las proyecciones (hc² = p + q)?
  respuesta: 'No'
  solucion_pasos:
  - 'No, es igual al PRODUCTO de las proyecciones: $h_c^2 = p \cdot q$. La suma $p + q$ es la hipotenusa $c$.'
errores_frecuentes:
- 'Sumar las proyecciones en vez de multiplicarlas.'
- 'Olvidar sacar la raíz cuadrada de $p \cdot q$.'
- 'Multiplicar la hipotenusa por una proyección creyendo que da la altura.'
- 'Despejar incorrectamente $q = h_c^2 / p$.'
- 'Confundir la altura sobre la hipotenusa con una de las proyecciones.'
afirmaciones_verdaderas:
- 'En todo triángulo rectángulo, el cuadrado de la altura sobre la hipotenusa es igual al producto de las proyecciones de los catetos ($h_c^2 = p \cdot q$).'
- 'La altura sobre la hipotenusa es la media geométrica entre $p$ y $q$.'
al_terminar_debes_poder: |
  **QUÉ:** Calcular la altura relativa a la hipotenusa utilizando las proyecciones de los catetos.

  **CÓMO:** Aplicando el teorema de Euclides $h_c = \sqrt{p \cdot q}$ y despejando proyecciones incógnitas.

