semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.IDENTIDAD
resumen_inicial: La función identidad $f(x) = x$ es la función lineal con pendiente $m = 1$ cuya gráfica es la bisectriz del primer y tercer cuadrante.
explicacion_simple: '![La función identidad $f(x) = x$ es la función lineal con pendiente $m = 1$ cuya gráfica es la bisectriz del primer y tercer cuadrante](/static/img/nodos/estudio-de-la-funcion-identidad-intro.svg)



  La **función identidad** es la función más transparente de todas:

  - Todo lo que entra sale exactamente igual: $f(x) = x$.

  - Si entra $5$, sale $5$; si entra $-12$, sale $-12$.


  Su gráfica es una línea recta inclinada exactamente a **$45^\circ$**, que corta el primer y tercer cuadrante en dos mitades perfectas (por eso se llama **bisectriz principal**).'
explicacion_formal: 'La **función identidad** en $\mathbb{R}$ es el endomorfismo neutro $\text{id}_{\mathbb{R}}: \mathbb{R} \to \mathbb{R}$ dado por:

  $$\text{id}(x) = x$$


  **Propiedades fundamentales:**

  - **Pendiente**: $m = 1$.

  - **Ángulo de inclinación**: $\theta = 45^\circ$ (ya que $\tan(45^\circ) = 1$).

  - **Elemento neutro de la composición**: Para cualquier función $f$, se cumple $f \circ \text{id} = \text{id} \circ f = f$.

  - **Eje de simetría de funciones inversas**: Las gráficas de una función biyectiva $f$ y su inversa $f^{-1}$ son simétricas respecto a la recta $y = x$.'
definiciones_clave: '- **Función identidad**: Función que asigna a cada elemento del conjunto a sí mismo.

  - **Bisectriz de cuadrantes I y III**: Recta $y = x$ que divide el ángulo recto de los cuadrantes en dos ángulos de $45^\circ$.'
propiedades_relaciones: '- **Pares ordenados idénticos**: Todo punto de su gráfica es de la forma $(a, a)$.

  - **Automorfismo**: Es un isomorfismo lineal directo.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función identidad $f(x) = x$ es la función lineal con pendiente $m = 1$ cuya gráfica es la bisectriz del primer y tercer cuadrante](/static/img/nodos/estudio-de-la-funcion-identidad-ejemplos.svg)



    Verifica que el punto $(-\sqrt{5}, -\sqrt{5})$ pertenece a la función identidad y calcula $(\text{id} \circ \text{id})(8)$.'
  pasos:
  - 'Paso 1: Aplicar la regla $\text{id}(x) = x$ al valor $x = -\sqrt{5}$: $\text{id}(-\sqrt{5}) = -\sqrt{5}$.'
  - 'Paso 2: Como la imagen coincide con la ordenada, el punto $(-\sqrt{5}, -\sqrt{5})$ pertenece a la gráfica.'
  - 'Paso 3: Calcular la composición: $\text{id}(8) = 8$, luego $\text{id}(\text{id}(8)) = \text{id}(8) = 8$.'
  - 'Paso 4: Concluir que la composición de la identidad consigo misma es siempre la propia identidad.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el ángulo de inclinación de la función identidad $f(x) = x$ respecto al eje X positivo?
  choices:
  - text: 45 grados
    is_correct: true
  - text: 90 grados
    is_correct: false
  - text: 30 grados
    is_correct: false
  - text: 0 grados
    is_correct: false
  explanation: La alternativa correcta es '45 grados'. Dado que $m = 1$, $\theta = \arctan(1) = 45^\circ$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función identidad, si la entrada es $x = k - 3$, ¿cuál es la salida?
  choices:
  - text: k - 3
    is_correct: true
  - text: k + 3
    is_correct: false
  - text: '1'
    is_correct: false
  - text: x
    is_correct: false
  explanation: La alternativa correcta es 'k - 3'. La función identidad devuelve exactamente el mismo argumento que recibe.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la fórmula $f(x) = x$ con pendiente $m = 1$.'
- 'Paso 2: Comprobar que para cualquier valor de entrada $a$, la imagen calculada sea $a$.'
- 'Paso 3: Ubicar pares $(a, a)$ en el plano cartesiano trazando la bisectriz a $45^\circ$.'
- 'Paso 4: Usar la recta $y = x$ como eje de reflexión para comprobar gráficamente funciones inversas.'
errores_correccion: '- **Error común:** Confundir la función identidad $f(x) = x$ con la función constante $f(x) = 1$.

  - **Cómo corregirlo:** La constante $f(x) = 1$ siempre devuelve $1$ (recta horizontal); la identidad $f(x) = x$ devuelve lo que entra (recta diagonal a $45^\circ$).'
ejemplos:
- titulo: 'Ejemplo 1: Puntos sobre la bisectriz'
  enunciado: ¿Cuál de los siguientes puntos NO pertenece a la recta de la función identidad?
  alternativas:
  - (3, -3)
  - (4, 4)
  - (-7, -7)
  - (0, 0)
  respuesta: (3, -3)
  solucion_pasos:
  - 'Paso 1: En la función identidad, $x$ e $y$ deben ser idénticos.'
  - 'Paso 2: En $(3, -3)$, $3 \neq -3$, luego no pertenece.'
- titulo: 'Ejemplo 2: Pendiente de la identidad'
  enunciado: ¿Cuánto vale la pendiente $m$ de la función identidad?
  alternativas:
  - m = 1
  - m = 0
  - m = -1
  - m = 45
  respuesta: m = 1
  solucion_pasos:
  - 'Paso 1: El coeficiente que acompaña a $x$ es $1$.'
- titulo: 'Ejemplo 3: Composición funcional'
  enunciado: Si $f(x) = 3x^2 - 5$, ¿a qué es igual $(\text{id} \circ f)(x)$?
  alternativas:
  - 3x^2 - 5
  - x
  - 3x^2
  - 3(x^2 - 5)
  respuesta: 3x^2 - 5
  solucion_pasos:
  - 'Paso 1: La identidad actúa como neutro en la composición: $\text{id}(f(x)) = f(x) = 3x^2 - 5$.'
- titulo: 'Ejemplo 4: Intersección con otras funciones'
  enunciado: ¿En qué punto intersecta la función identidad a la recta $y = 2x - 4$?
  alternativas:
  - (4, 4)
  - (2, 2)
  - (0, 0)
  - (4, 0)
  respuesta: (4, 4)
  solucion_pasos:
  - 'Paso 1: Igualar $x = 2x - 4 \implies x = 4$.'
  - 'Paso 2: Como $y = x$, el punto de corte es $(4, 4)$.'
errores_frecuentes:
- Confundir la identidad f(x) = x con la constante f(x) = 1.
- Asignar signo negativo a la segunda coordenada en el tercer cuadrante.
- Olvidar que la recta y = x es el eje de simetría de las funciones inversas.
afirmaciones_verdaderas:
- La función identidad f(x) = x es una función lineal de pendiente m = 1.
- La gráfica de la función identidad divide al primer y tercer cuadrante en dos ángulos congruentes de 45°.
al_terminar_debes_poder: '**QUÉ:** Comprender, graficar y aplicar la función identidad en el análisis funcional.


  **CÓMO:** Reconociendo su propiedad neutra f(x) = x, su pendiente unitaria y su papel como bisectriz de los cuadrantes I y III.


  ![Resumen La función identidad $f(x) = x$ es la función lineal con pendiente $m = 1$ cuya gráfica es la bisectriz del primer y tercer cuadrante](/static/img/nodos/estudio-de-la-funcion-identidad-resumen.svg)'
