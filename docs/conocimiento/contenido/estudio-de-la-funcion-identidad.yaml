semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.IDENTIDAD
resumen_inicial: La función identidad asigna a cada elemento del dominio una imagen exactamente igual a su propia preimagen ($f(x) = x$).
explicacion_simple: |
  La **función identidad** es el espejo perfecto de las matemáticas:

  Lo que entra es exactamente lo que sale:
  - $f(1) = 1$
  - $f(-7) = -7$
  - $f(0) = 0$

  Su gráfica es una línea recta que pasa por el origen $(0,0)$ dividiendo el primer y tercer cuadrante por la mitad (ángulo de $45^\circ$).
explicacion_formal: |
  La **función identidad** $i: \mathbb{R} \to \mathbb{R}$ se define formalmente como:

  $$f(x) = x$$

  **Propiedades matemáticas:**
  - **Dominio**: $\text{Dom}(f) = \mathbb{R}$
  - **Recorrido**: $\text{Rec}(f) = \mathbb{R}$
  - **Pendiente**: $m = 1$
  - **Intercepto con ejes**: $(0, 0)$
  - **Elemento neutro de la composición**: $(f \circ g)(x) = g(x)$ y $(g \circ f)(x) = g(x)$.
definiciones_clave: |
  - **Función identidad ($f(x) = x$)**: Caso especial de función lineal con pendiente unitaria $m = 1$ y constante $b = 0$.
propiedades_relaciones: |
  - **Simetría de la función inversa**: La gráfica de la función inversa $f^{-1}(x)$ es siempre simétrica con respecto a la recta de la función identidad $y = x$.
ejemplo_guiado:
  enunciado: 'Para la función identidad $f(x) = x$, calcula la pendiente entre los puntos $(-3, -3)$ y $(5, 5)$ y verifica el ángulo de inclinación.'
  pasos:
    - 'Paso 1: Aplicar la fórmula de la pendiente: $m = \frac{5 - (-3)}{5 - (-3)} = \frac{8}{8} = 1$.'
    - 'Paso 2: Calcular el ángulo de inclinación: $\tan(\alpha) = 1 \implies \alpha = 45^\circ$.'
    - 'Paso 3: Concluir que la función identidad tiene pendiente constante $m = 1$ e inclinación a $45^\circ$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor de la pendiente $m$ y el recorrido de la función identidad $f(x) = x$?'
    choices:
      - {text: '$m = 1$ y recorrido $\mathbb{R}$', is_correct: true}
      - {text: '$m = 0$ y recorrido $\{0\}$', is_correct: false}
      - {text: '$m = -1$ y recorrido $]0, +\infty[$', is_correct: false}
      - {text: '$m = 2$ y recorrido $\mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$m = 1$ y recorrido $\mathbb{R}$''. $f(x) = x$ tiene pendiente $1$ y su salida abarca todos los reales.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por cuáles cuadrantes del plano cartesiano atraviesa la gráfica de la función identidad $f(x) = x$?'
    choices:
      - {text: 'Por el primer y tercer cuadrante.', is_correct: true}
      - {text: 'Por el segundo y cuarto cuadrante.', is_correct: false}
      - {text: 'Únicamente por el primer cuadrante.', is_correct: false}
      - {text: 'Es paralela al eje $Y$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Por el primer y tercer cuadrante.''. Para $x > 0 \implies y > 0$ (Cuadrante I) y para $x < 0 \implies y < 0$ (Cuadrante III).'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la regla $f(x) = x$.'
  - 'Paso 2: Reconocer que para toda preimagen $a$, la imagen es $f(a) = a$.'
  - 'Paso 3: Trazar la recta con pendiente $m = 1$ pasando por el origen $(0, 0)$.'
  - 'Paso 4: Declarar su dominio y recorrido como todos los reales $\mathbb{R}$.'
errores_correccion: |
  - **Error común:** Confundir la función identidad $f(x) = x$ con la función constante $f(x) = 1$.
  - **Cómo corregirlo:** En la función constante $f(x) = 1$ la salida es siempre $1$; en la función identidad $f(x) = x$ la salida cambia y es igual al valor ingresado.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La función identidad asigna a cada elemento $x$ del dominio el cuadrado de su valor $f(x) = x^2$.'
  - 'La gráfica de la función identidad $f(x) = x$ es una recta horizontal paralela al eje $X$.'
  - 'La pendiente de la función identidad es nula $m = 0$ y su ángulo de inclinación es de $0^\circ$.'
  - 'El recorrido de la función identidad excluye a los números reales negativos.'
  - 'La función identidad no pasa por el origen de coordenadas $(0, 0)$.'
afirmaciones_verdaderas:
  - 'La función identidad viene dada por $f(x) = x$, asignando a cada preimagen un valor de imagen exactamente igual.'
  - 'Su gráfica es la bisectriz del primer y tercer cuadrante, formando un ángulo de $45^\circ$ con el eje horizontal y con pendiente $m = 1$.'
al_terminar_debes_poder: |
  QUÉ: Definir y analizar las propiedades de la función identidad $f(x) = x$.
  CÓMO: Reconocer la correspondencia $f(x) = x$, ubicar su pendiente $m = 1$ y verificar su gráfico como bisectriz a $45^\circ$.
