semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.IDENTIDAD
resumen_inicial: La función identidad devuelve como salida exactamente el mismo valor
  introducido como entrada, $f(x) = x$.
explicacion_simple: 'La **función identidad** es el caso especial más simple de la
  función lineal donde la pendiente vale $1$ ($m = 1$).

  Su fórmula es $f(x) = x$:

  - $f(5) = 5$

  - $f(-3) = -3$

  - $f(0) = 0$

  Su gráfica es una recta a $45^\circ$ que biseca exactamente el I y III cuadrante
  del plano cartesiano.'
explicacion_formal: 'La **función identidad** $\operatorname{id}_{\mathbb{R}}: \mathbb{R}
  \to \mathbb{R}$ se define como:


  $$f(x) = x \quad \forall x \in \mathbb{R}$$


  **Desglose de la fórmula:**

  - $\operatorname{Dom}(f) = \mathbb{R}$ y $\operatorname{Rec}(f) = \mathbb{R}$.

  - Caso particular de función lineal con pendiente $m = 1$ e inclinación $\theta
  = 45^\circ$ ($\tan(45^\circ) = 1$).'
definiciones_clave: '- **Función identidad ($f(x) = x$)**: Función donde cada elemento
  es imagen de sí mismo.

  - **Bisectriz del I y III cuadrante**: Denominación geométrica de la recta $y =
  x$ en el plano cartesiano.'
propiedades_relaciones: '- **Elemento neutro de la composición**: $f \circ \operatorname{id}
  = f$ e $\operatorname{id} \circ f = f$.'
ejemplo_guiado:
  enunciado: Verifica las evaluaciones de la función identidad $f(x) = x$ para $x
    = -7$ y $x = \sqrt{2}$, e indica su ángulo de inclinación.
  pasos:
  - 'Paso 1: Evaluar $x = -7$: por ser la identidad, $f(-7) = -7$.Paso 2: Evaluar
    $x = \sqrt{2}$: $f(\sqrt{2}) = \sqrt{2}$.Paso 3: Identificar la pendiente $m =
    1$.Paso 4: Calcular el ángulo de inclinación: $\theta = \arctan(1) = 45^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de evaluar $f(-7)$ en la función identidad $f(x)
    = x$?
  choices:
  - text: $f(-7) = -7$
    is_correct: true
  - text: $f(-7) = 7$
    is_correct: false
  - text: $f(-7) = 0$
    is_correct: false
  - text: $f(-7) = 1$
    is_correct: false
  explanation: La alternativa correcta es '$f(-7) = -7$'. La función identidad devuelve
    exactamente la misma entrada.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ángulo de inclinación respecto al eje positivo X forma la recta de
    la función identidad $f(x) = x$?
  choices:
  - text: $45^\circ$
    is_correct: true
  - text: $90^\circ$
    is_correct: false
  - text: $0^\circ$
    is_correct: false
  - text: $60^\circ$
    is_correct: false
  explanation: La alternativa correcta es '$45^\circ$'. (Puesto que $\tan(45^\circ)
    = 1$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la forma $f(x) = x$.'
- 'Paso 2: Igualar la salida $y$ a la misma entrada $x$.'
- 'Paso 3: Trazar la recta inclinada a $45^\circ$ cruzando el origen $(0,0)$.'
errores_correccion: '- **Error común:** Confundir la función identidad $f(x) = x$
  con la función constante $f(x) = 1$.

  - **Cómo corregirlo:** La constante $f(x) = 1$ vale siempre 1. La identidad $f(x)
  = x$ vale lo mismo que la $x$ introducida.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
fuente: Texto escolar MINEDUC — Álgebra / Función Constante y Función Lineal
