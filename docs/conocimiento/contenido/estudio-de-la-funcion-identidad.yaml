semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.IDENTIDAD
resumen_inicial: 'Estudio de la función identidad: conceptos, representación y propiedades
  en Función constante y función lineal.'
explicacion_simple: La función más simple de todas ni siquiera transforma la entrada;
  simplemente la devuelve intacta.
explicacion_formal: '### Definición formal


  La función identidad en $\mathbb{R}$ se define como $\text{id}(x) = x$ para todo
  $x \in \mathbb{R}$. Es el caso particular de función lineal $f(x)=mx$ con $m=1$,
  y satisface $\text{id}(a) = a$ para todo $a$ de su dominio.


  ### Desarrollo didáctico


  Su gráfica es la recta que biseca el primer y tercer cuadrante, formando un ángulo
  de $45°$ con el eje $x$, porque cada punto tiene coordenadas iguales: $(1,1)$, $(2,2)$,
  $(-3,-3)$, etc.


  Un uso conceptual importante: componer cualquier función $f$ con la identidad no
  la cambia, $f(\text{id}(x)) = f(x)$.'
definiciones_clave: '- **Estudio de la función identidad**: Elemento central en el
  estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a estudio de la función identidad.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a estudio de la función
    identidad.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a estudio de la función identidad.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    estudio de la función identidad?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en función constante y función lineal
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en función constante y función lineal. Es la condición
    de existencia y unicidad en estudio de la función identidad.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en estudio de la función
    identidad, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la fórmula tenga exactamente la forma $f(x) = x$.'
- 'Paso 2: Confirma que la pendiente sea $m=1$ y no exista término independiente.'
- 'Paso 3: Para graficar, marca puntos donde ambas coordenadas coinciden y traza la
  recta a $45°$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar estudio de la función identidad.
ejemplos:
- titulo: Evaluación de la función identidad
  enunciado: Si $f(x)=x$, calcula $f(7)$ y $f(-4)$.
  solucion_pasos:
  - Cada valor se devuelve sin cambios.
  - $f(7)=7$ y $f(-4)=-4$.
- titulo: Reconocimiento de la identidad entre funciones lineales
  enunciado: De las funciones $f(x)=x$, $g(x)=2x$, $h(x)=-x$, ¿cuál es la identidad?
  solucion_pasos:
  - Solo $f(x)=x$ cumple la condición de pendiente igual a 1 sin transformación adicional.
  - $f(x)=x$ es la función identidad.
- titulo: ¿La gráfica de la función identidad pasa por el origen?
  enunciado: ¿La gráfica de la función identidad pasa por el origen?
  respuesta: Sí
  solucion_pasos:
  - Al ser un caso particular de función lineal, cumple $f(0)=0$.
- titulo: ¿La gráfica de la función identidad forma un ángulo de $45°$ con el eje
    $x$?
  enunciado: ¿La gráfica de la función identidad forma un ángulo de $45°$ con el eje
    $x$?
  respuesta: Sí
  solucion_pasos:
  - Al tener pendiente 1, la recta sube exactamente lo mismo que avanza, formando
    ese ángulo característico.
errores_frecuentes:
- Confundir la función identidad con la función constante, que no depende de $x$.
- Creer que cualquier función lineal es la identidad, sin verificar que $m=1$ específicamente.
- Suponer que la identidad solo aplica a números positivos.
- Confundir el concepto de función identidad con el de elemento neutro de la suma.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando estudio
  de la función identidad.
