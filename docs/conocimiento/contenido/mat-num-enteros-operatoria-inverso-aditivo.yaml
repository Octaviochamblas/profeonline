semantic_id: MAT.NUM.ENTEROS_OPERATORIA.INVERSO_ADITIVO
resumen_inicial: 'Todo entero $a$ posee un opuesto aditivo $-a$ tal que la suma de
  ambos da cero: $a + (-a) = 0$.'
explicacion_simple: El inverso aditivo (u opuesto) de un número entero es otro entero
  que tiene exactamente la misma magnitud pero el signo contrario. Al sumar un número
  con su opuesto aditivo, ambos se cancelan completamente dando como resultado el
  cero.
explicacion_formal: 'Para todo entero $a \in \mathbb{Z}$, existe un único elemento
  $-a \in \mathbb{Z}$ denominado **Inverso Aditivo** (u opuesto) que satisface:


  $$a + (-a) = (-a) + a = 0$$


  **Desglose de la fórmula:**

  - $a$: Número entero original.

  - $-a$: Inverso aditivo u opuesto de $a$.

  - $= 0$: Resultado nulo de la cancelación mutua al sumar un número con su opuesto.


  > **Complemento didáctico:** El opuesto del opuesto devuelve el número original:
  $-(-a) = a$.'
definiciones_clave: '- **Inverso aditivo (opuesto)**: El entero $-a$ de igual magnitud
  pero signo opuesto que suma cero con $a$.

  - **Cancelación aditiva**: Propiedad por la cual la suma de opuestos resulta en
  el elemento neutro $0$.'
propiedades_relaciones: '- **Doble negación**: $-(-a) = a$.

  - **Opuesto del cero**: El opuesto de $0$ es $0$ ($-0 = 0$).'
ejemplo_guiado:
  enunciado: Halle el inverso aditivo del entero $-13$ y compruebe que la suma de
    ambos resulta en cero.
  pasos:
  - 'Paso 1: Determinar el opuesto cambiando el signo de $-13$: $-(-13) = +13$.'
  - 'Paso 2: Sumar el número original y su opuesto: $(-13) + 13 = 0$.'
  - 'Conclusión: El inverso aditivo de $-13$ es $13$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el inverso aditivo del número entero 8?
  choices:
  - text: '-8'
    is_correct: true
  - text: '8'
    is_correct: false
  - text: 1/8
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '-8', pues $8 + (-8) = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el inverso aditivo de -13?
  choices:
  - text: '13'
    is_correct: true
  - text: '-13'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: -1/13
    is_correct: false
  explanation: La alternativa correcta es '13'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número dado $a$ con su signo antecedente.'
- 'Paso 2: Invertir el signo (si es positivo pasa a negativo, si es negativo pasa
  a positivo).'
- 'Paso 3: Verificar que la suma de $a + (-a)$ sea igual a 0.'
errores_correccion: '- **Error 1: Confundir inverso aditivo (opuesto) con inverso
  multiplicativo (recíproco).** **Cómo corregirlo:** El opuesto de $5$ es $-5$ (cambia
  signo); el recíproco es $\frac{1}{5}$ (invierte fracción).


  - **Error 2: Pensar que el inverso aditivo de un número siempre es un número negativo.**
  **Cómo corregirlo:** Si el número original es negativo (ej: $-7$), su opuesto es
  positivo ($+7$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el inverso aditivo de $-20$?
  alternativas:
  - '20'
  - '-20'
  - 1/20
  respuesta: '20'
  solucion_pasos:
  - $-(-20) = 20$.
- titulo: Ejemplo 2
  enunciado: Calcule el valor de $-(-(-6))$.
  alternativas:
  - '-6'
  - '6'
  - '0'
  respuesta: '-6'
  solucion_pasos:
  - $-(-6) = 6$, y el signo menos exterior da $-6$.
- titulo: ¿La suma de cualquier número entero con su inverso aditivo da como resultado
    0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a + (-a) = 0$ por definición.
- titulo: ¿El inverso aditivo de 0 es 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-0 = 0$.
errores_frecuentes:
- El inverso aditivo de cualquier número entero es siempre un número de signo negativo.
- El inverso aditivo del entero 5 es el número fraccionario $\frac{1}{5}$.
- Sumar un número entero con su inverso aditivo da como resultado el entero 1.
- El número cero no posee un inverso aditivo dentro del conjunto de los enteros.
- El opuesto del opuesto de un número entero es igual a su inverso multiplicativo.
afirmaciones_verdaderas:
- El inverso aditivo u opuesto de un número $a$ es $-a$, satisfaciendo $a + (-a) =
  0$.
- 'El opuesto del opuesto de un entero $a$ devuelve el número original: $-(-a) = a$.'
al_terminar_debes_poder: Al terminar serás capaz de identificar y calcular el inverso
  aditivo (opuesto) de cualquier número entero, cambiando su signo y comprobando que
  su adición dé como resultado cero.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
