semantic_id: MAT.NUM.ENTEROS_OPERATORIA.INVERSO_ADITIVO
resumen_inicial: "El inverso aditivo (opuesto) de un entero $a$ es $-a$: al sumarlos, el resultado siempre es cero."
explicacion_simple: |
  Si das 5 pasos hacia adelante (+5), ¿qué necesitas hacer para volver exactamente al
  punto de partida? ¡Dar 5 pasos hacia atrás (-5)! Esos dos movimientos se anulan,
  dejándote en el cero. En matemáticas, el opuesto o inverso aditivo de $+5$ es $-5$. Cada
  entero tiene su pareja gemela con signo contrario, y al sumarlos siempre da cero.
explicacion_formal: |
  Para todo $a \in \mathbb{Z}$, existe $-a \in \mathbb{Z}$ tal que $a + (-a) = 0$. En la
  recta numérica, el opuesto de un número es su reflejo simétrico respecto al cero: misma
  distancia, dirección contraria. El opuesto de cero es el mismo cero ($-0=0$).
definiciones_clave: |
  **Inverso aditivo (opuesto)**: de un entero $a$, es $-a$, el número que sumado a $a$ da
  cero. **Simetría respecto al cero**: $a$ y $-a$ están a la misma distancia del origen.
propiedades_relaciones: |
  El opuesto de un positivo es negativo, y el opuesto de un negativo es positivo:
  $-(-a)=a$. Todo entero tiene exactamente un opuesto, y el opuesto del opuesto es el
  número original.
ejemplo_guiado:
  enunciado: "Encuentra el opuesto de $+23$ y comprueba sumándolo."
  pasos:
    - "El número es $+23$ (positivo)."
    - "Su opuesto cambia el signo: $-23$."
    - "Comprobación: $(+23)+(-23)=0$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el opuesto (inverso aditivo) de $-9$?"
    choices:
      - {text: "$9$", is_correct: true}
      - {text: "$-9$", is_correct: false}
      - {text: "$0$", is_correct: false}
      - {text: "$1/9$", is_correct: false}
    explanation: "La correcta es $9$: el opuesto de un negativo es su versión positiva, y $(-9)+9=0$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el opuesto de $-17$?"
    choices:
      - {text: "$17$", is_correct: true}
      - {text: "$-17$", is_correct: false}
      - {text: "$0$", is_correct: false}
      - {text: "$-1$", is_correct: false}
    explanation: "La correcta es $17$: se cambia el signo de $-17$ y se comprueba que $(-17)+17=0$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el número entero original y su signo."
  - "Paso 2: Cambiar el signo del número (si es positivo pasa a ser negativo; si es negativo pasa a ser positivo)."
  - "Paso 3: Si el número es cero, su opuesto sigue siendo cero."
errores_correccion: |
  Un error frecuente es confundir el inverso aditivo (opuesto, cambia el signo) con el
  inverso multiplicativo (recíproco, invierte la fracción). Otro error es creer que $-a$
  siempre es un número negativo, cuando en realidad depende del signo de $a$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcular el opuesto de $-45$ y comprobar mediante la suma."
    alternativas:
      - "$45$"
      - "$-45$"
      - "$0$"
    respuesta: "$45$"
    solucion_pasos:
      - "Identificar el número: $-45$ (negativo)."
      - "Cambiar el signo para obtener su opuesto: el opuesto es $+45$ (o $45$)."
      - "Comprobar sumando ambos números: $(-45) + (+45)$."
      - "Dado que tienen signos distintos e igual valor absoluto, la suma es $45 - 45 = 0$. Por lo tanto, el opuesto es correcto."
  - titulo: "Ejemplo 2"
    enunciado: "Escribir la expresión para el opuesto de la expresión $-( -12 )$."
    alternativas:
      - "$-12$"
      - "$12$"
      - "$0$"
    respuesta: "$-12$"
    solucion_pasos:
      - "Simplificar la expresión original: $-(-12)$ es el opuesto de $-12$, lo cual es igual a $+12$."
      - "Buscar el opuesto del resultado simplificado ($+12$)."
      - "Cambiar el signo de $+12$ a negativo: el resultado es $-12$."
  - titulo: "¿Es cierto que el opuesto de todo número entero es siempre un número negativo?"
    respuesta: "No"
    solucion_pasos:
      - "El opuesto de un número negativo es positivo (ej: el opuesto de $-3$ es $+3$)."
      - "El opuesto de cero es cero, que no es negativo."
      - "Por lo tanto, la afirmación es falsa."
  - titulo: "¿La suma de un entero con su opuesto es siempre igual al elemento neutro de la adición?"
    respuesta: "Sí"
    solucion_pasos:
      - "Por definición de inverso aditivo, para cualquier entero $a$ se cumple que $a + (-a) = 0$."
      - "El cero ($0$) es el elemento neutro de la adición."
      - "Por ende, la suma siempre es igual al elemento neutro."
errores_frecuentes:
  - "Confundir el inverso aditivo (opuesto) con el inverso multiplicativo (recíproco, ej: creer que el opuesto de $5$ es $1/5$)."
  - "Creer que la notación $-a$ siempre representa un número negativo (si $a$ es negativo, $-a$ es positivo)."
  - "Pensar que el cero no tiene inverso aditivo o que su opuesto es un número diferente."
  - "Asociar la palabra 'opuesto' con cambiar el número por completo en lugar de cambiar solo su signo."
  - "Olvidar que el opuesto de un número negativo requiere aplicar doble negación (ej: $-(-x) = x$)."
afirmaciones_verdaderas:
  - "El inverso aditivo de 5 es -5."
  - "Un número sumado con su inverso aditivo siempre da 0."
al_terminar_debes_poder: |
  Calcular el inverso aditivo de cualquier entero y explicar por qué su suma con el
  número original siempre es cero.
fuente: "Enteros"
estado: publicado
