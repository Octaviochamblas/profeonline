semantic_id: MAT.NUM.ERROR_NUMERICO.ERROR_ABSOLUTO
resumen_inicial: 'El error absoluto es el valor absoluto de la diferencia entre el
  valor real exacto $V_{\text{real}}$ y el valor aproximado $V_{\text{aprox}}$: $E_a
  = |V_{\text{real}} - V_{\text{aprox}}|$.'
explicacion_simple: El error absoluto mide qué tan lejos nos quedamos del valor exacto
  en términos reales, expresando la distancia o diferencia sin importar si nos pasamos
  o si nos quedamos cortos. Al utilizar la barra de valor absoluto, el error absoluto
  se expresa siempre como una cantidad positiva o cero.
explicacion_formal: 'Sea $x \in \mathbb{R}$ el valor exacto y $\bar{x} \in \mathbb{Q}$
  una aproximación, el **Error Absoluto $E_a$** se define cuantitativamente como la
  métrica de distancia escalar:


  $$E_a = |x - \bar{x}|$$


  **Desglose de la fórmula:**

  - $| \cdot |$: Función valor absoluto que garantiza $E_a \ge 0$.

  - $x$: Valor exacto (teórico o medido sin incertidumbre).

  - $\bar{x}$: Valor aproximado (obtenido por redondeo, truncamiento o medición).

  - Unidades: Conserva exactamente la misma unidad de medida que la magnitud original
  ($m, kg, s, \dots$).


  > **Complemento didáctico:** El error absoluto indica la magnitud física del desvío,
  pero no permite juzgar la calidad de una medición por sí solo si no se compara con
  el tamaño del valor real.'
definiciones_clave: '- **Error absoluto**: Magnitud de desvío no negativa $E_a = |x
  - \bar{x}|$ expresada en la misma unidad de la cantidad medida.'
propiedades_relaciones: '- **Positividad**: $E_a \ge 0$, siendo $E_a = 0 \iff x =
  \bar{x}$.'
ejemplo_guiado:
  enunciado: Calcule el error absoluto si el valor real de un objeto es $x = 4,8$
    metros y su valor aproximado es $\bar{x} = 4,75$ metros.
  pasos:
  - 'Paso 1: Identificar las cantidades: $x = 4,8$ m y $\bar{x} = 4,75$ m.'
  - 'Paso 2: Calcular la diferencia: $x - \bar{x} = 4,8 - 4,75 = 0,05$.'
  - 'Paso 3: Aplicar el valor absoluto: $|0,05| = 0,05$.'
  - 'Conclusión: El error absoluto es de $0,05$ metros.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el error absoluto Ea entre un valor
    real x y un valor aproximado x_barra?
  choices:
  - text: Ea = |x - x_barra| (el valor absoluto de la diferencia)
    is_correct: true
  - text: Ea = x / x_barra
    is_correct: false
  - text: Ea = (x - x_barra) / x
    is_correct: false
  - text: Ea = x + x_barra
    is_correct: false
  explanation: La alternativa correcta es 'Ea = |x - x_barra| (el valor absoluto de
    la diferencia)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para x = 4,8 y x_barra = 4,75, ¿cuál fue el error
    absoluto?
  choices:
  - text: 0,05 metros
    is_correct: true
  - text: -0,05 metros
    is_correct: false
  - text: 0,5 metros
    is_correct: false
  - text: 0,01 metros
    is_correct: false
  explanation: La alternativa correcta es '0,05 metros'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor exacto o real $x$ y la aproximación $\bar{x}$.'
- 'Paso 2: Restar la aproximación del valor real ($x - \bar{x}$).'
- 'Paso 3: Aplicar valor absoluto a la diferencia para asegurar un valor no negativo
  $E_a \ge 0$.'
errores_correccion: '- **Error 1: Expresar el error absoluto con signo negativo ($E_a
  = -0,05$).** **Cómo corregirlo:** La presencia de la barra de valor absoluto exige
  que el error absoluto sea SIEMPRE no negativo ($E_a \ge 0$).


  - **Error 2: Dividir la resta entre el valor real.** **Cómo corregirlo:** Dividir
  entre el valor real entrega el error RELATIVO, no el absoluto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el error absoluto si el valor real es 12,5 y la aproximación
    es 12,8.
  alternativas:
  - 0,3
  - -0,3
  - 0,03
  respuesta: 0,3
  solucion_pasos:
  - $E_a = |12,5 - 12,8| = |-0,3| = 0,3$.
- titulo: Ejemplo 2
  enunciado: Si $x = 3$ y $\bar{x} = 2,95$, ¿cuál es el error absoluto?
  alternativas:
  - 0,05
  - 0,5
  - -0,05
  respuesta: 0,05
  solucion_pasos:
  - $E_a = |3 - 2,95| = 0,05$.
- titulo: ¿Tiene el error absoluto la misma unidad de medida que los valores comparados?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia del error relativo, el error absoluto mantiene la unidad física.
- titulo: ¿Es el error absoluto siempre mayor o igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad $|a| \ge 0$.
errores_frecuentes:
- El error absoluto de una aproximación es un valor estrictamente negativo si nos
  quedamos cortos.
- Calcular el error absoluto requiere dividir la resta por el valor real exacto del
  problema.
- El error absoluto carece de unidades de medida y se expresa siempre en porcentaje.
- Un error absoluto igual a cero indica que la aproximación es infinitamente superior
  al valor real.
- El orden de la resta dentro del valor absoluto altera la magnitud del error absoluto.
afirmaciones_verdaderas:
- El error absoluto $E_a = |x - \bar{x}|$ representa la diferencia no negativa entre
  el valor exacto y el aproximado.
- El error absoluto posee las mismas unidades de medida que las cantidades $x$ y $\bar{x}$.
al_terminar_debes_poder: Al terminar serás capaz de calcular el error absoluto $E_a
  = |x - \bar{x}|$ de cualquier aproximación, verificando que sea un resultado no
  negativo en la unidad de medida original.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
