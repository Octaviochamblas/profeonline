semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.TRANSVERSAL_GRAVEDAD_DEFINICION
resumen_inicial: La transversal de gravedad (o mediana) de un triángulo es el segmento
  de recta que une un vértice con el punto medio del lado opuesto, dividiendo al triángulo
  en dos regiones de áreas equivalentes.
explicacion_simple: '![Transversal de Gravedad](/static/img/nodos/definicion-de-transversal-de-gravedad-como-segmento-desde-un-vertice-al-punto-medio-del-lado-opuesto-intro.svg)


  Para trazar una transversal de gravedad:


  - **Eliges una esquina**: Sales desde un vértice (por ejemplo, $A$).

  - **Llegas a la mitad exacta**: Conectas con el punto medio $M$ del lado de al frente
  ($BM = MC$).

  - **Divide el área en dos**: Aunque los dos triángulos resultantes tengan formas
  distintas, tienen **exactamente la misma área**.

  '
explicacion_formal: '### Definición formal

  En un triángulo $\Delta ABC$, la **transversal de gravedad** (o mediana) correspondiente
  al vértice $A$ ($t_a$ o $m_a$) es el segmento que une el vértice $A$ con el punto
  medio $M_a$ del lado opuesto $\overline{BC}$:


  $$t_a = \overline{AM_a} \quad \text{con} \quad M_a = \frac{B + C}{2} \implies BM_a
  = M_aC = \frac{a}{2}$$


  ### Desglose simbólico y geométrico

  - $A$: Vértice de origen.

  - $M_a$: Punto medio del lado $\overline{BC}$.

  - Bisección de área: Toda transversal de gravedad divide al triángulo en dos triángulos
  de igual área (equivalentes): $\operatorname{Área}(\Delta ABM_a) = \operatorname{Área}(\Delta
  ACM_a) = \frac{1}{2} A$.

  - Teorema de Apolonio (longitud): $t_a = \frac{1}{2}\sqrt{2b^2 + 2c^2 - a^2}$.


  ### Síntesis didáctica

  La transversal de gravedad conecta un vértice con el centro del lado opuesto, partiendo
  el triángulo en dos regiones de idéntica superficie.'
definiciones_clave: '- **Transversal de gravedad (Mediana)**: Segmento que une un
  vértice con el punto medio del lado opuesto.

  - **Punto medio ($M$)**: Punto que equidista de los dos extremos de un segmento.

  - **Equivalencia de áreas**: Propiedad por la cual dos figuras tienen la misma medida
  de superficie.

  '
propiedades_relaciones: '- **Bisección del lado**: $BM_a = M_aC = \frac{a}{2}$.

  - **Bisección de área**: $\text{Área}(\Delta ABM_a) = \text{Área}(\Delta ACM_a)
  = \frac{1}{2}\text{Área}(\Delta ABC)$.

  - **Teorema de Apolonio**: $b^2 + c^2 = 2 t_a^2 + \frac{a^2}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Transversal de Gravedad](/static/img/nodos/definicion-de-transversal-de-gravedad-como-segmento-desde-un-vertice-al-punto-medio-del-lado-opuesto-ejemplos.svg)


    En un triángulo $ABC$, el área total es de $48\text{ cm}^2$ y el lado $\overline{BC}$
    mide $16\text{ cm}$. Se traza la transversal de gravedad $\overline{AM_a}$. Determina
    la longitud del segmento $BM_a$ y el área del triángulo $\Delta ABM_a$.

    '
  pasos:
  - 'Paso 1: Aplicar la definición de punto medio: $BM_a = \frac{BC}{2} = \frac{16}{2}
    = 8\text{ cm}$.'
  - 'Paso 2: Aplicar la propiedad de bisección de áreas de la transversal: $\text{Área}(\Delta
    ABM_a) = \frac{1}{2}\text{Área}(\Delta ABC)$.'
  - 'Paso 3: Calcular el área: $\frac{48\text{ cm}^2}{2} = 24\text{ cm}^2$.'
  - 'Paso 4: Concluir que $BM_a = 8\text{ cm}$ y el área del triángulo $\Delta ABM_a$
    es $24\text{ cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué une exactamente la transversal de gravedad de un triángulo?
  choices:
  - text: Un vértice con el punto medio del lado opuesto
    is_correct: true
  - text: Un vértice con el lado opuesto en ángulo de 90°
    is_correct: false
  - text: Los puntos medios de dos lados
    is_correct: false
  - text: El vértice con el incentro
    is_correct: false
  explanation: La transversal de gravedad une un vértice con el punto medio del lado
    opuesto del triángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene un área total de 70 cm², ¿cuál es el área de cada
    uno de los dos triángulos formados por una de sus transversales de gravedad?
  choices:
  - text: $35\text{ cm}^2$
    is_correct: true
  - text: $70\text{ cm}^2$
    is_correct: false
  - text: $23.3\text{ cm}^2$
    is_correct: false
  - text: $17.5\text{ cm}^2$
    is_correct: false
  explanation: El área es $35\text{ cm}^2$, ya que la transversal divide el área total
    exactamente por la mitad ($70 / 2 = 35\text{ cm}^2$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el vértice de origen y el lado opuesto.'
- 'Paso 2: Localizar el punto medio $M$ del lado opuesto dividiendo su longitud en
  dos mitades iguales.'
- 'Paso 3: Trazar el segmento recto desde el vértice hasta el punto medio $M$.'
- 'Paso 4: Utilizar la bisección de lados o la división en dos áreas iguales para
  resolver problemas métricos.'
errores_correccion: No asumas que la transversal de gravedad es perpendicular al lado
  opuesto (esa es la altura o la simetral).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo $ABC$ la base $BC = 20\text{ cm}$, ¿cuánto mide el
    segmento $M_aC$ determinado por la transversal de gravedad $AM_a$?
  alternativas:
  - $10\text{ cm}$
  - $20\text{ cm}$
  - $5\text{ cm}$
  respuesta: $10\text{ cm}$
  solucion_pasos:
  - $M_aC = \frac{BC}{2} = \frac{20}{2} = 10\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: Si la transversal de gravedad divide al triángulo en dos regiones, ¿cómo
    son sus áreas?
  alternativas:
  - Exactamente iguales
  - La de la izquierda siempre es mayor
  - Proporcionales a los lados laterales
  respuesta: Exactamente iguales
  solucion_pasos:
  - Ambos triángulos tienen bases congruentes ($BM = MC$) y comparten la misma altura,
    luego sus áreas son iguales.
- titulo: ¿La transversal de gravedad de un triángulo divide el área total en dos
    mitades iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad fundamental de la transversal de gravedad.
- titulo: ¿La transversal de gravedad siempre divide el ángulo del vértice en dos
    partes iguales?
  respuesta: 'No'
  solucion_pasos:
  - No, la línea que divide el ángulo en dos partes iguales es la bisectriz.
errores_frecuentes:
- Confundir transversal de gravedad (mediana) con bisectriz (divide el ángulo).
- Confundir transversal de gravedad con altura (perpendicular desde el vértice).
- Confundir transversal de gravedad con simetral (perpendicular en el punto medio
  que no pasa por el vértice).
- Creer que la transversal divide el perímetro en dos partes iguales (divide el área
  y la base, no el perímetro).
- Olvidar que todo triángulo tiene exactamente 3 transversales de gravedad.
afirmaciones_verdaderas:
- La transversal de gravedad es el segmento que une un vértice con el punto medio
  del lado opuesto.
- Toda transversal de gravedad divide al triángulo en dos triángulos de áreas iguales.
al_terminar_debes_poder: '**QUÉ:** Definir, trazar y aplicar las propiedades métricas
  de la transversal de gravedad (mediana).


  **CÓMO:** Conectando el vértice con el punto medio del lado opuesto ($BM = MC$)
  y aplicando la bisección de áreas ($\text{Área}_1 = \text{Área}_2 = \frac{1}{2}\text{Área}$).


  ![Resumen de Transversal de Gravedad](/static/img/nodos/definicion-de-transversal-de-gravedad-como-segmento-desde-un-vertice-al-punto-medio-del-lado-opuesto-resumen.svg)

  '
