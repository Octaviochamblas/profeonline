semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_2
resumen_inicial: "Un número es divisible por 2 si su última cifra es par: 0, 2, 4, 6 u 8."
explicacion_simple: |
  Si quieres repartir cartas en partes iguales entre dos personas sin que sobre ninguna,
  solo necesitas mirar la última cifra del número. Si esa cifra es par (0, 2, 4, 6 u 8),
  ¡seguro que puedes repartirlas todas! Con 124 cartas puedes hacerlo porque termina en 4,
  pero con 125 no, porque termina en 5.
explicacion_formal: |
  Cualquier natural $N$ se escribe como $N=10\cdot d+u$, donde $u$ es la cifra de las
  unidades. Como $10$ es divisible por $2$, el término $10\cdot d$ siempre lo es. Por lo
  tanto, la divisibilidad de $N$ por 2 depende solo de que $u$ sea par.
definiciones_clave: |
  **Cifra de las unidades**: la última cifra de un número. **Cifras pares**: $0, 2, 4, 6,
  8$.
propiedades_relaciones: |
  El criterio depende únicamente de la última cifra, sin importar cuántas cifras tenga el
  número ni cuáles sean las demás.
ejemplo_guiado:
  enunciado: "Determina si 2.318 es divisible por 2."
  pasos:
    - "La última cifra de 2.318 es $8$."
    - "$8$ es una cifra par."
    - "Conclusión: 2.318 es divisible por 2."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿De qué depende únicamente la divisibilidad por 2 de un número?"
    choices:
      - {text: "De su última cifra", is_correct: true}
      - {text: "De la suma de todas sus cifras", is_correct: false}
      - {text: "De su primera cifra", is_correct: false}
      - {text: "De cuántas cifras tiene", is_correct: false}
    explanation: "La correcta es De su última cifra: el resto de las cifras siempre forman un múltiplo de 2 ($10\\cdot d$)."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 7.451 divisible por 2?"
    choices:
      - {text: "No, termina en 1 (impar)", is_correct: true}
      - {text: "Sí, termina en cifra par", is_correct: false}
      - {text: "No se puede saber sin dividir todo", is_correct: false}
      - {text: "Sí, porque es un número grande", is_correct: false}
    explanation: "La correcta es No, termina en 1 (impar): la última cifra 1 no es par."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar la última cifra (la cifra de las unidades) del número dado."
  - "Paso 2: Comprobar si esa cifra es 0, 2, 4, 6 u 8."
  - "Paso 3: Si la cifra es una de ellas, el número es divisible por 2. En caso contrario, no lo es."
errores_correccion: |
  Un error frecuente es pensar que un número no es divisible por 2 si contiene dígitos
  impares en otras posiciones distintas a la última. Otro error es creer que el 0 no
  cuenta como cifra par, cuando en realidad sí lo es.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número 5.736 es divisible por 2."
    alternativas:
      - "Sí, termina en 6 (par)"
      - "No, termina en cifra impar"
      - "No se puede determinar"
    respuesta: "Sí, termina en 6 (par)"
    solucion_pasos:
      - "Identificamos la última cifra del número 5.736, que es $6$."
      - 'Comprobamos si $6$ es una cifra par. Sí lo es, ya que pertenece al conjunto $\{0, 2, 4, 6, 8\}$.'
      - "Conclusión: El número 5.736 es divisible por 2."
  - titulo: "Ejemplo 2"
    enunciado: "Determina si el número 943 es divisible por 2."
    alternativas:
      - "No, termina en 3 (impar)"
      - "Sí, termina en cifra par"
      - "No se puede determinar"
    respuesta: "No, termina en 3 (impar)"
    solucion_pasos:
      - "Identificamos la última cifra del número 943, que es $3$."
      - "Comprobamos si $3$ es par. No lo es, es una cifra impar."
      - "Conclusión: El número 943 no es divisible por 2 (al dividirlo por 2 sobra 1)."
  - titulo: "¿Es divisible por 2 el número 4.090?"
    respuesta: "Sí"
    solucion_pasos:
      - "Miramos la última cifra del número 4.090, que es $0$."
      - "El $0$ se considera una cifra par para el criterio de divisibilidad por 2."
      - "Por lo tanto, 4.090 es divisible por 2."
  - titulo: "¿Es divisible por 2 el número 1.000.007?"
    respuesta: "No"
    solucion_pasos:
      - "Miramos la última cifra de 1.000.007, que es $7$."
      - "Como $7$ es impar, el número no es divisible por 2 sin importar cuántos ceros tenga antes."
      - "Conclusión: 1.000.007 no es divisible por 2."
errores_frecuentes:
  - "Pensar que un número no es divisible por 2 si contiene dígitos impares en otras posiciones (como 132)."
  - "Creer que el número 0 no es par y que los números que terminan en 0 no son divisibles por 2."
  - "Dividir todo el número por 2 en papel cuando solo basta con mirar la última cifra."
  - "Confundir divisibilidad por 2 con que la mitad del número deba terminar en cifra par."
  - "Pensar que un número muy grande siempre es divisible por 2 solo por su tamaño."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 2 de cualquier número con solo observar su última
  cifra, sin necesidad de dividir.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
