semantic_id: MAT.GEO.TEOREMA_TALES.CALCULO_LONGITUDES
resumen_inicial: 'Cálculo de longitudes desconocidas usando el teorema de Tales: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Con el teorema de Tales ya comprendido, tanto en su forma general
  como en el caso particular de triángulos, es momento de aplicarlo sistemáticamente
  para resolver problemas de longitudes desconocidas.
explicacion_formal: '![Cálculo de longitudes usando el teorema de Tales](/static/img/geometria/congruencia-semejanza/tales-calculo-longitudes.svg)


  ### Definición formal


  Dada una proporción $\frac{a}{b}=\frac{c}{x}$ (donde $x$ es la incógnita), se despeja
  mediante multiplicación cruzada: $x=\frac{b\times c}{a}$.


  ### Desarrollo didáctico


  En un triángulo con AD=5, DB=10, AE=8, se busca EC: $\frac{5}{10}=\frac{8}{EC}$,
  por lo que $EC=\frac{10\times8}{5}=16$. El procedimiento es siempre el mismo: identificar
  la proporción, sustituir los datos conocidos y despejar.'
definiciones_clave: '- **Cálculo de longitudes desconocidas usando el teorema de Tales**:
