ejemplo_guiado:
  enunciado: En la aplicación de cálculo de longitudes desconocidas usando el teorema
    de tales, se establece una razón $k = 1.6$ entre dos figuras homólogas de longitud
    original $L = 10\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de cálculo de longitudes desconocidas usando el
    teorema de tales.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 1.6 \cdot 10$.'
  - Concluir que la medida obtenida en cálculo de longitudes desconocidas usando el
    teorema de tales es $L' = 16.0\text{ cm}$.
