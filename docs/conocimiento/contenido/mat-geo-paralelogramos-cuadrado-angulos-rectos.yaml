semantic_id: MAT.GEO.PARALELOGRAMOS.CUADRADO_ANGULOS_RECTOS
resumen_inicial: 'Propiedad de cuatro ángulos rectos en el cuadrado: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: La segunda propiedad característica que define completamente al
  cuadrado, junto con la de sus lados, tiene que ver con sus ángulos.
explicacion_formal: '![Cuatro ángulos rectos en el cuadrado](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-cuadrado-angulos-rectos.svg)


  ### Definición formal


  Un cuadrado tiene $\angle A=\angle B=\angle C=\angle D=90°$. Esto es consistente
  con la suma de ángulos interiores de un cuadrilátero (360°), ya que $4\times90°=360°$.


  ### Desarrollo didáctico


  Esta propiedad, junto con la de los cuatro lados congruentes, es lo que distingue
  completamente al cuadrado de otros paralelogramos: el rombo tiene lados iguales
  pero no necesariamente ángulos rectos, y el rectángulo tiene ángulos rectos pero
  no necesariamente lados iguales; el cuadrado combina ambas propiedades.'
definiciones_clave: '- **Propiedad de cuatro ángulos rectos en el cuadrado**: Elemento
