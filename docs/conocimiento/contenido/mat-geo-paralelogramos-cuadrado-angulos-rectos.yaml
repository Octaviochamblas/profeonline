    un ángulo $\alpha = 96^\circ$ ubicado en la posición dada. Determina el valor
    de la medida asociada sabiendo que $x + 1155^\circ = 96^\circ$.
  pasos:
  - Identificar la propiedad de propiedad de cuatro ángulos rectos en el cuadrado
    referida a $\alpha = 96^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1155 = 96 \implies x = 96 - 1155$.'
  - Concluir que la medida calculada para propiedad de cuatro ángulos rectos en el
    cuadrado es $x = -1059^\circ$.
