semantic_id: MAT.NUM.VARIACION_PORCENTUAL.DESCUENTO_CONCEPTO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: 'El descuento porcentual es una disminución aplicada sobre el precio
  de lista de un producto o servicio, calculada como una proporción del precio original:
  $\text{Rebaja} = P_{\text{lista}} \cdot \frac{d}{100}$.'
explicacion_simple: 'En el comercio, un descuento es la rebaja que se le hace al precio
  de lista de un bien. Si una prenda de $\$30.000$ tiene un $30\%$ de descuento, el
  ahorro es $30.000 \cdot 0,30 = $\$9.00$0$, y el cliente termina pagando el $70\%$
  del precio original ($30.000 \cdot 0,70 = $\$21.00$0$).


  ![concepto-de-descuento-porcentual](/static/img/nodos/concepto-de-descuento-porcentual-intro.svg)

  '
explicacion_formal: 'Para un precio de lista $P_L > 0$ y una tasa de descuento comercial
  $d > 0$, el monto de la rebaja $R$ y el precio final pagado $P_f$ se definen formalmente
  como:


  $$R = P_L \cdot \left(\frac{d}{100}\right)$$


  $$P_f = P_L - R = P_L \cdot \left(1 - \frac{d}{100}\right) = P_L \cdot (1 - d_{\text{dec}})$$


  Donde $(1 - d_{\text{dec}})$ representa la **tasa de pago efectivo** sobre el precio
  original.'
definiciones_clave: '- **Precio de lista**: Valor comercial original del producto
  antes de aplicar cualquier promoción o rebaja.

  - **Descuento comercial**: Monto en dinero deducido del precio de lista.

  - **Precio a pagar**: Valor final neto tras aplicar la rebaja porcentual.'
propiedades_relaciones: '- **Complementariedad**: Si el descuento es del $d\%$, se
  paga exactamente el $(100 - d)\%$ del precio de lista.

  - **Ahorro absoluto**: El ahorro crece en forma directamente proporcional al precio
  de lista del bien.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/concepto-de-descuento-porcentual-resumen.svg)


  QUÉ: Determinar el monto de descuento y el precio final de compra. CÓMO: Calculando
  el ahorro con $R = P_L \cdot \frac{d}{100}$ y el precio final mediante $P_f = P_L
  \cdot (1 - d_{\text{dec}})$.'
