procedimiento:
- 'Paso 1: Identificar el precio de lista $P_L$ y el porcentaje de descuento $d\%$.'
- 'Paso 2: Calcular el factor a pagar $F = 1 - \frac{d}{100}$.'
- 'Paso 3: Multiplicar $P_f = P_L \cdot F$ para obtener el precio final con descuento.'
ejemplo_guiado:
  enunciado: Unas zapatillas tienen un precio de lista de $\$50.000$ y se ofrece una
    rebaja del $20\%$. ¿Cuál es el precio final a pagar?
  pasos:
  - 'Paso 1: Identificar $P_L = 50.000$ y la tasa de descuento $d = 20\%$.'
  - 'Paso 2: Determinar el porcentaje a pagar: $100\% - 20\% = 80\% \implies F = 0,80$.'
  - 'Paso 3: Multiplicar: $P_f = 50.000 \cdot 0,80 = 40.000$.'
  - 'Conclusión: El cliente paga $\$40.000$ y se ahorra $\$10.000$.'
  imagen: /static/img/nodos/concepto-de-descuento-porcentual-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si una tienda ofrece $40\%$ de descuento en toda la tienda, ¿qué porcentaje
    del precio original paga el cliente?
  choices:
  - text: $60\%$
    is_correct: true
  - text: $40\%$
    is_correct: false
  - text: $50\%$
    is_correct: false
  - text: $70\%$
    is_correct: false
  explanation: 'El porcentaje pagado es el complemento: $100\% - 40\% = 60\%$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un televisor de $\$300.000$ tiene un $10\%$ de descuento. ¿Cuánto dinero
    se ahorra el comprador?
  choices:
  - text: $\$30.000$
    is_correct: true
  - text: $\$270.000$
    is_correct: false
  - text: $\$3.000$
    is_correct: false
  - text: $\$33.000$
    is_correct: false
  explanation: 'El ahorro es la rebaja: $300.000 \cdot 0,10 = 30.000$ pesos.'
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Restar el porcentaje directamente en pesos (ej:
  $50.000 - 20 = 49.980$).** **Cómo corregirlo:** El $20\%$ se calcula multiplicando
  sobre la base monetaria ($0,20 \cdot 50.000 = 10.000$).

  - **Error 2: Confundir el ahorro con el precio final.** **Cómo corregirlo:** El
  ahorro es $P_L \cdot d_{\text{dec}}$ y el precio final es $P_L \cdot (1 - d_{\text{dec}})$.'
ejemplos:
- titulo: Liquidación de temporada
  enunciado: Una chaqueta de $\$80.000$ tiene un descuento del $35\%$. ¿Cuál es el precio
    final de compra?
  alternativas:
  - $\$52.000$
  - $\$48.000$
  - $\$56.000$
  - $\$50.000$
  respuesta: $\$52.000$
  solucion_pasos:
  - Identificar $P_L = 80.000$ y descuento $d = 35\%$.
  - 'Factor a pagar: $1 - 0,35 = 0,65$.'
  - 'Multiplicar: $P_f = 80.000 \cdot 0,65 = 52.000$ pesos.'
- titulo: Ahorro en compra de libros
  enunciado: Un libro de $\$24.000$ tiene un $25\%$ de descuento promocional. ¿Cuánto
    dinero ahorra el comprador?
  alternativas:
  - $\$6.000$
  - $\$18.000$
  - $\$4.800$
  - $\$8.000$
  respuesta: $\$6.000$
  solucion_pasos:
  - 'Calcular el ahorro: $24.000 \cdot 0,25 = 6.000$ pesos.'
- titulo: ¿Un descuento del $50\%$ hace que el precio final sea igual al monto ahorrado?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se ahorra el $50\%$ y se paga el $50\%$ restante.
- titulo: ¿Un producto con $100\%$ de descuento tiene costo cero para el cliente?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $P_f = P_L \cdot (1 - 1) = 0$.
errores_frecuentes:
- Confundir el valor del descuento con el valor a pagar.
- Restar los dígitos del porcentaje al precio de lista sin multiplicar por la base.
- Sumar el descuento en lugar de restarlo.
afirmaciones_verdaderas:
- Un descuento del $d\%$ equivale a pagar el $(100 - d)\%$ del precio original.
- El monto ahorrado se obtiene multiplicando directamente el precio de lista por $d/100$.
