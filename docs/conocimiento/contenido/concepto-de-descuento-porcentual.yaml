procedimiento:
- 'Paso 1: Lee si la pregunta pide ''el valor del descuento'' (la rebaja) o el ''precio final''
  (lo que pagas).'
- 'Paso 2: Si pide el descuento, calcula el $D\%$ del total.'
- 'Paso 3: Si pide el precio final, calcula el $(100 - D)\%$ del total.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de descuento
  porcentual.
ejemplos:
- titulo: Liquidación de temporada
  enunciado: Una bicicleta vale $100.000. Tiene un 40% de descuento. ¿Cuál es el valor del
    descuento y cuál es el precio final?
  solucion_pasos:
  - 'Descuento (rebaja): El 40% de 100.000. Son $40.000. Ese dinero te lo ahorras.'
  - 'Precio final: El 60% de 100.000 (ya que $100 - 40 = 60$). Son $60.000. Eso pagas en caja.'
- titulo: Ejemplo 2
  enunciado: Una polera de $20.000 tiene 15% de descuento. ¿Cuál es el precio final?
  alternativas:
  - '17.000'
  - '3.000'
  - '15.000'
  respuesta: '17.000'
  solucion_pasos:
  - 20.000 por 0,85 es igual a 17.000.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor del descuento de un 25% sobre $12.000?
  alternativas:
  - '3.000'
  - '9.000'
  - '2.500'
  respuesta: '3.000'
  solucion_pasos:
  - 12.000 por 0,25 es igual a 3.000.
- titulo: ¿El precio final con descuento se calcula multiplicando por (100 menos D) dividido
    entre 100?
  respuesta: Sí
  solucion_pasos:
  - Esa es la forma directa de obtener lo que efectivamente se paga.
errores_frecuentes:
- Confundir el valor del descuento con el precio a pagar. (Responder que pagas $40.000 en
  el ejemplo anterior).
- Creer que dos descuentos consecutivos del 20% suman un 40% (no es así, el segundo descuento
  se aplica sobre el nuevo precio ya rebajado).
- Confundir el valor del descuento con el precio a pagar.
- Creer que dos descuentos consecutivos del 20% suman un 40%, cuando el segundo se aplica
  sobre el precio ya rebajado.
- Calcular el descuento pero olvidar restarlo del precio original cuando se pide el precio
  final.
afirmaciones_verdaderas:
- La propiedad de concepto de descuento porcentual preserva la consistencia lógica.
- 'El valor del descuento y el precio final son dos cantidades distintas: la primera es lo
  que se ahorra, la segunda es lo que se paga.'
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de descuento
  porcentual.
