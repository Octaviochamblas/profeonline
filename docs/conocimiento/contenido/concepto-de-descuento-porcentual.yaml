resumen_inicial: Un descuento porcentual es la rebaja monetaria o cuantitativa que
  se le resta al precio original de un producto o servicio para obtener el precio
  a pagar.
explicacion_simple: Un descuento es la rebaja que nos hacen al comprar algo. Si una
  prenda cuesta \$20.000 y tiene un 30% de descuento, pagaremos el 70% restante de
  su precio original.
explicacion_formal: 'Para un precio original $P_{orig}$ y un descuento del $d\%$,
  el **Monto del Descuento $M_D$** y el **Precio Rebajado $P_{reb}$** se definen como:


  $$M_D = \left(\frac{d}{100}\right) \cdot P_{orig} \quad \text{y} \quad P_{reb} =
  P_{orig} \cdot \left(1 - \frac{d}{100}\right)$$'
definiciones_clave: '- **Descuento porcentual**: Monto rebajado $M_D = \frac{d}{100}
  \cdot P_{orig}$ que reduce el costo comercial.'
propiedades_relaciones: '- **Complemento a pagar**: Si el descuento es $d\%$, se paga
  el $(100 - d)\%$ del precio original.'
ejemplo_guiado:
  enunciado: Un televisor cuesta \$300.000 y se ofrece con un $20\%$ de descuento.
    Calcule el precio rebajado.
  pasos:
  - 'Paso 1: Identificar el porcentaje de pago neto: $100\% - 20\% = 80\% \implies
    0,80$.'
  - 'Paso 2: Multiplicar el precio original por el factor: $P_{reb} = 300.000 \cdot
    0,80$.'
  - 'Paso 3: Resolver la multiplicación: $300.000 \cdot 0,80 = 240.000$.'
  - 'Conclusión: El precio rebajado es \$240.000 (el descuento fue de \$60.000).'
checkpoints:
- placement: after_explicacion_formal
  question: Si una tienda ofrece un d% de descuento, ¿qué porcentaje del precio original
    paga el cliente?
  choices:
  - text: Paga el (100 - d)% del precio original
    is_correct: true
  - text: Paga exactamente el d%
    is_correct: false
  - text: Paga el (100 + d)%
    is_correct: false
  - text: Paga cero
    is_correct: false
  explanation: La alternativa correcta es 'Paga el (100 - d)% del precio original'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado del televisor de $300.000 con 20% de descuento, ¿cuánto
    pagó el cliente?
  choices:
  - text: 240.000 $
    is_correct: true
  - text: 280.000 $
    is_correct: false
  - text: 260.000 $
    is_correct: false
  - text: 60.000 $
    is_correct: false
  explanation: La alternativa correcta es '240.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el monto descontado y
  el precio rebajado aplicando el factor neto $\left(1 - \frac{d}{100}\right)$.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.DESCUENTO_CONCEPTO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.DESCUENTO_CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
