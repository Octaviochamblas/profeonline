semantic_id: MAT.NUM.VARIACION_PORCENTUAL.DESCUENTO_CONCEPTO
resumen_inicial: 'Concepto de descuento porcentual: concepto y propiedades fundamentales en
  Variaciones porcentuales.'
explicacion_simple: Vas al mall y ves '50% de Descuento'. Tu cerebro se emociona porque sabe
  que pagará la mitad. El descuento es la disminución porcentual más famosa del mundo.
explicacion_formal: 'En problemas comerciales, es vital leer con lupa lo que se está preguntando:


  - **Valor del descuento (la rebaja):** Es la cantidad de dinero que NO vas a pagar. Se calcula
  como $\text{Precio Original} \cdot (D / 100)$.

  - **Precio final (lo que pagas):** Es el precio original menos la rebaja. Se calcula más
  rápido con el factor de disminución: $\text{Precio Original} \cdot ((100 - D) / 100)$.


  Por ejemplo, en un pantalón de $\$10.000$ con un $30\%$ de descuento:

  - La rebaja es de $\$3.000$ ($30\%$).

  - El precio final que te cobrará el cajero es de $\$7.000$ ($70\%$).'
definiciones_clave: '- **Concepto de descuento porcentual**: Elemento central dentro del estudio
  de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a concepto de descuento porcentual.'
ejemplo_guiado:
  enunciado: Una mochila cuesta $45.000 y tiene un 20% de descuento. Calcula el valor del
    descuento y el precio final.
  pasos:
  - 'Calculo el valor del descuento: 20% de 45.000, es decir 45.000 por 0,20, igual a 9.000.'
  - 'Calculo el precio final restando: 45.000 menos 9.000 es igual a 36.000.'
  - 'Confirmo con el método directo: 80% de 45.000, ya que 100 menos 20 es 80, también da
    36.000.'
