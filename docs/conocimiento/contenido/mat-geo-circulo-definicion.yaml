semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CIRCULO_DEFINICION
resumen_inicial: 'Definición de círculo como región interior delimitada por una circunferencia:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: A diferencia de la circunferencia (solo la línea), existe un concepto
  relacionado que incluye toda la superficie encerrada por ella.
explicacion_formal: '![Círculo: región interior delimitada por la circunferencia](/static/img/geometria/circunferencia-circulo/circulo-definicion.svg)


  ### Definición formal


  Dado un centro $O$ y un radio $r$, el círculo es el conjunto de puntos $P$ del plano
  tales que $\overline{OP}\leq r$ (a diferencia de la circunferencia, que exige igualdad
  exacta).


  ### Desarrollo didáctico


  Esta distinción es análoga a la diferencia entre el perímetro y el área de cualquier
  figura: la circunferencia es como el perímetro (una línea, una medida de longitud),
  mientras que el círculo es como el área (una región, una medida de superficie).'
definiciones_clave: '- **Definición de círculo como región interior delimitada por
