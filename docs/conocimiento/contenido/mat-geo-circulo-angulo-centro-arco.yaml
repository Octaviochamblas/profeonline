semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_CENTRO_ARCO
resumen_inicial: 'Relación de igualdad entre la medida del ángulo del centro y la
  medida del arco correspondiente: conceptos, teoremas, propiedades geométricas y
  cálculo en Circunferencia y Círculo.'
explicacion_simple: Un ángulo del centro y el arco que este determina comparten exactamente
  la misma medida en grados, lo que permite pasar de uno a otro directamente.
explicacion_formal: '![Ángulo del centro igual a su arco correspondiente](/static/img/geometria/circunferencia-circulo/circulo-angulo-centro-arco.svg)


  ### Definición formal


  Por definición, la medida en grados de un arco de circunferencia se establece igual
  a la medida del ángulo del centro que lo subtiende: $m(\angle AOB)=m(\text{arco
  }AB)$.


  ### Desarrollo didáctico


  Si el ángulo del centro $\angle AOB$ mide 80°, entonces el arco $AB$ correspondiente
  también mide 80°. Esta igualdad es la base para relacionar ángulos y arcos en todos
  los teoremas posteriores de la circunferencia.'
definiciones_clave: '- **Relación de igualdad entre la medida del ángulo del centro
  y la medida del arco correspondiente**: Elemento o propiedad fundamental en el estudio
  de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación de igualdad entre la medida del ángulo
  del centro y la medida del arco correspondiente.'
ejemplo_guiado:
  enunciado: Para analizar relación de igualdad entre la medida del ángulo del centro
    y la medida del arco correspondiente, considera un ángulo $\alpha = 98^\circ$
    ubicado en la posición dada. Determina el valor de la medida asociada sabiendo
    que $x + 1041^\circ = 98^\circ$.
  pasos:
  - Identificar la propiedad de relación de igualdad entre la medida del ángulo del
    centro y la medida del arco correspondiente referida a $\alpha = 98^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1041 = 98 \implies x = 98 - 1041$.'
  - Concluir que la medida calculada para relación de igualdad entre la medida del
    ángulo del centro y la medida del arco correspondiente es $x = -943^\circ$.
