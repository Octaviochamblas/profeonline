semantic_id: MAT.GEO.CIRCULO_TEOREMAS.POTENCIA_PUNTO_DEFINICION
resumen_inicial: La potencia de un punto respecto de una circunferencia es el valor algebraico invariante definido por P(P) = d² - r², donde d es la distancia del punto al centro y r es el radio.
explicacion_simple: 'Imagina que tienes una circunferencia de centro $O$ y radio $r$, y marcas un punto cualquiera $P$ en el plano. La distancia en línea recta desde $P$ hasta el centro $O$ la llamamos $d$.


  La **potencia del punto $P$** es un número algebraico muy especial que se calcula restando los cuadrados: $$\mathbf{\mathcal{P}(P) = d^2 - r^2}$$


  Este número te dice exactamente dónde está parado el punto:

  - Si el punto está **afuera** ($d > r$), la potencia es **positiva (+)**.

  - Si el punto está **justo en el borde** de la circunferencia ($d = r$), la potencia es **cero (0)**.

  - Si el punto está **adentro** ($d < r$), la potencia es **negativa (-)**.


  Además, cuando el punto está afuera, ¡la potencia es exactamente igual al cuadrado de la recta tangente!: $\mathcal{P}(P) = PT^2$.


  ![Definición de potencia de un punto](/static/img/nodos/definicion-de-potencia-de-un-punto-respecto-de-una-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal de la potencia de un punto

  Sea $\mathcal{C}(O, r)$ una circunferencia en el plano euclidiano de centro $O$ y radio $r$. Para cualquier punto $P \in \mathbb{R}^2$, se define la **potencia del punto $P$ respecto a $\mathcal{C}$** como el escalar real:

  $$\mathcal{P}(P) = d(P, O)^2 - r^2 = d^2 - r^2$$


  ### Clasificación y signo topológico

  1. **Punto exterior**: $d > r \iff \mathcal{P}(P) > 0$. La potencia es estrictamente positiva y coincide con el cuadrado de la longitud del segmento tangente $PT$:

  $$\mathcal{P}(P) = PT^2 = d^2 - r^2 \quad (\text{por Pitágoras en } \triangle OTP)$$

  2. **Punto sobre la circunferencia**: $d = r \iff \mathcal{P}(P) = 0$. El lugar geométrico de puntos con potencia nula es la propia circunferencia $\mathcal{C}$.

  3. **Punto interior**: $d < r \iff \mathcal{P}(P) < 0$. La potencia es estrictamente negativa. Su valor absoluto representa el producto de las distancias euclidianas a los extremos de cualquier cuerda que pase por $P$:

  $$|\mathcal{P}(P)| = r^2 - d^2 = PA \cdot PB$$


  > **Complemento didáctico:** La potencia es como el ''pasaporte'' de un punto respecto al círculo: mirando solo su signo sabes si está afuera ($+$), en el borde ($0$) o adentro ($-$). ¡Nunca olvides que las dos magnitudes van al cuadrado ($d^2 - r^2$)!

  '
definiciones_clave: '- **Potencia de un punto ($\mathcal{P}(P)$)**: Valor escalar algebraico $d^2 - r^2$.

  - **Distancia al centro ($d$)**: Segmento $OP = d(P, O)$.

  - **Radio de la circunferencia ($r$)**: Distancia del centro a la curva.

  '
propiedades_relaciones: '- **Signo invariante**: Positivo afuera, cero en la curva, negativo adentro.

  - **Mínimo absoluto**: Se alcanza en el centro $P = O$ ($d = 0$), donde $\mathcal{P}(O) = -r^2$.

  - **Eje radical**: Lugar geométrico de los puntos que tienen igual potencia respecto a dos circunferencias dadas.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de potencia de un punto](/static/img/nodos/definicion-de-potencia-de-un-punto-respecto-de-una-circunferencia-ejemplos.svg)


    Una circunferencia tiene radio $r = 5\text{ cm}$. Calcula la potencia de tres puntos distintos:

    1. Un punto $P_1$ a distancia $d_1 = 13\text{ cm}$ del centro.

    2. Un punto $P_2$ a distancia $d_2 = 5\text{ cm}$ del centro.

    3. Un punto $P_3$ a distancia $d_3 = 3\text{ cm}$ del centro.'
  pasos:
  - 'Paso 1: Para $P_1$ (exterior): $\mathcal{P}(P_1) = d_1^2 - r^2 = 13^2 - 5^2 = 169 - 25 = 144$ (positiva).'
  - 'Paso 2: Para $P_2$ (sobre la curva): $\mathcal{P}(P_2) = d_2^2 - r^2 = 5^2 - 5^2 = 25 - 25 = 0$ (nula).'
  - 'Paso 3: Para $P_3$ (interior): $\mathcal{P}(P_3) = d_3^2 - r^2 = 3^2 - 5^2 = 9 - 25 = -16$ (negativa).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula algebraica de la potencia de un punto P a distancia d del centro de una circunferencia de radio r?
  choices:
  - text: P(P) = d² - r².
    is_correct: true
  - text: P(P) = d - r.
    is_correct: false
  - text: P(P) = d² + r².
    is_correct: false
  - text: P(P) = (d · r) / 2.
    is_correct: false
  explanation: La alternativa correcta es 'P(P) = d² - r².' Por definición analítica euclidiana, la potencia es la diferencia de los cuadrados de la distancia al centro y el radio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué signo tiene la potencia de un punto ubicado en el interior de la circunferencia?
  choices:
  - text: Estrictamente negativa (P(P) < 0).
    is_correct: true
  - text: Estrictamente positiva (P(P) > 0).
    is_correct: false
  - text: Siempre igual a cero.
    is_correct: false
  - text: Depende de la posición del punto respecto al eje horizontal.
    is_correct: false
  explanation: La alternativa correcta es 'Estrictamente negativa (P(P) < 0).' Como $d < r$, la diferencia $d^2 - r^2$ es siempre menor que cero.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la distancia del punto al centro ($d = OP$) y el radio de la circunferencia ($r$).

  2. Elevar ambas cantidades al cuadrado: $d^2$ y $r^2$.

  3. Restar: $\mathcal{P}(P) = d^2 - r^2$.

  4. Verificar coherencia del signo según la posición del punto (exterior $> 0$, borde $= 0$, interior $< 0$).

  '
errores_correccion: '- **Error común 1:** Restar sin elevar al cuadrado ($d - r$). **Corrección:** La potencia requiere obligatoriamente elevar ambas variables al cuadrado ($d^2 - r^2$).

  - **Error común 2:** Creer que la potencia siempre es positiva. **Corrección:** Para puntos interiores es negativa ($d < r \implies d^2 - r^2 < 0$).

  '
ejemplos:
- tipo: A
  titulo: Cálculo de potencia de punto exterior
  enunciado: Un punto $P$ está a $10\text{ cm}$ del centro de una circunferencia de radio $r = 6\text{ cm}$. ¿Cuál es su potencia?
  alternativas:
  - text: $64$.
    is_correct: true
  - text: $4$.
    is_correct: false
  - text: $16$.
    is_correct: false
  - text: $136$.
    is_correct: false
  explicacion: $\mathcal{P}(P) = 10^2 - 6^2 = 100 - 36 = 64$.
- tipo: B
  titulo: Potencia nula en la curva
  enunciado: ¿Es la potencia de cualquier punto que pertenezca a la circunferencia igual a 0?
  respuesta: Sí
  explicacion: Sí. Al estar en la curva, $d = r$, luego $\mathcal{P}(P) = r^2 - r^2 = 0$.
errores_frecuentes:
- '''Restar $d - r$ olvidando elevar los términos al cuadrado.'''
- '''Considerar la potencia de un punto interior como positiva sin respetar el signo negativo.'''
- '''Confundir la distancia al centro $d$ con la distancia al borde de la circunferencia.'''
afirmaciones_verdaderas:
- '''La potencia de un punto respecto a una circunferencia se define como $\mathcal{P}(P) = d^2 - r^2$.'''
- '''La potencia es positiva para puntos exteriores, cero en la circunferencia y negativa en el interior.'''
- '''Para un punto exterior, la potencia coincide con el cuadrado del segmento tangente ($PT^2$).'''
al_terminar_debes_poder: '**QUÉ:** Definir y calcular la potencia de un punto respecto a una circunferencia e interpretar su signo geométrico.


  **CÓMO:** Aplicando la fórmula $\mathcal{P}(P) = d^2 - r^2$.


