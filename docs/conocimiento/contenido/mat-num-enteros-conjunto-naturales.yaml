semantic_id: MAT.NUM.ENTEROS_CONJUNTO.NATURALES
resumen_inicial: 'Los números naturales son los enteros positivos discretos utilizados
  para contar elementos: $\mathbb{N} = \{1, 2, 3, 4, \ldots\}$.'
explicacion_simple: Los números naturales son los números discretos que utilizamos
  desde la antigüedad para contar elementos u objetos discretos existentes. Surgen
  de manera intuitiva a partir de la necesidad de cuantificar grupos de cosas reales,
  comenzando desde el uno y avanzando ilimitadamente hacia adelante. En la convención
  escolar estándar, el conjunto de los naturales no incluye al cero ni a cantidades
  fraccionarias.
explicacion_formal: 'El conjunto de los **Números Naturales**, denotado por $\mathbb{N}$,
  se define como el conjunto ordenado e infinito de los enteros positivos:


  $$\mathbb{N} = \{1, 2, 3, 4, 5, \ldots\}$$


  **Desglose de la fórmula:**

  - $\mathbb{N}$: Símbolo representativo del conjunto de números naturales.

  - $\{1, 2, 3, \ldots\}$: Enumeración secuencial que inicia en el primer elemento
  discreto $1$.

  - $\dots$: Elipses lógicas que representan la infinitud del conjunto hacia la derecha.


  > **Complemento didáctico:** El conjunto $\mathbb{N}$ posee un primer elemento absoluto
  ($1$) y satisface el principio de inducción matemática mediante la adición sucesiva
  de unidades.'
definiciones_clave: '- **Número natural**: Elemento de $\mathbb{N} = \{1, 2, 3, \ldots\}$,
  correspondiente a un entero positivo discreto.

  - **Primer elemento**: El número $1$, que constituye la cota inferior absoluta del
  conjunto $\mathbb{N}$.'
propiedades_relaciones: '- **Clausura inductiva**: La adición y la multiplicación
  de dos números naturales generan siempre como resultado otro número natural.

  - **Orden total**: Para todo par $a, b \in \mathbb{N}$, se cumple que $a < b$, $a
  = b$ o $a > b$.'
ejemplo_guiado:
  enunciado: '¿A qué conjunto pertenece el resultado de la suma $12 + 15$: a los naturales
    $\mathbb{N}$, a los números enteros negativos o a ninguno?'
  pasos:
  - 'Paso 1: Efectuar la suma de los enteros positivos: $12 + 15 = 27$.'
  - 'Paso 2: Comprobar que $27$ es un entero positivo mayor que cero.'
  - 'Paso 3: Concluir que $27 \in \mathbb{N}$ por ser un número de conteo positivo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer elemento del conjunto de los números naturales N según
    la convención escolar estándar?
  choices:
  - text: '1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '-1'
    is_correct: false
  - text: No tiene primer elemento
    is_correct: false
  explanation: 'La alternativa correcta es ''1'': los naturales en la convención escolar
    chilena y PAES comienzan en 1.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Con el mismo criterio del ejemplo guiado, ¿pertenece el número 27 al conjunto
    N?
  choices:
  - text: Sí, porque es un entero positivo
    is_correct: true
  - text: No, porque es un número impar
    is_correct: false
  - text: No, porque supera a 10
    is_correct: false
  - text: Solo si se le suma cero
    is_correct: false
  explanation: La alternativa correcta es 'Sí, porque es un entero positivo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el número a evaluar sea una cantidad entera completa sin
  decimales.'
- 'Paso 2: Verificar que el valor numérico sea estrictamente mayor o igual a 1 ($x
  \ge 1$).'
- 'Paso 3: Concluir que el número pertenece al conjunto $\mathbb{N}$.'
errores_correccion: '- **Error 1: Incluir el número cero dentro del conjunto de los
  números naturales.** **Cómo corregirlo:** En la convención escolar estándar chilena
  y de la prueba PAES, los naturales comienzan estrictamente en 1 ($\mathbb{N} = \{1,
  2, 3, \ldots\}$).


  - **Error 2: Considerar que los números decimales exactos como $1,5$ forman parte
  de $\mathbb{N}$.** **Cómo corregirlo:** Los números naturales son enteros discretos
  y no aceptan partes decimales ni fraccionarias.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números pertenece al conjunto de los naturales
    $\mathbb{N}$?
  alternativas:
  - '14'
  - '0'
  - '-5'
  respuesta: '14'
  solucion_pasos:
  - 14 es un entero positivo mayor que cero, por lo tanto $14 \in \mathbb{N}$.
- titulo: Ejemplo 2
  enunciado: Indique cuál es la menor cantidad natural posible.
  alternativas:
  - '1'
  - '0'
  - '0.1'
  respuesta: '1'
  solucion_pasos:
  - El primer elemento y cota inferior absoluta de $\mathbb{N}$ es 1.
- titulo: ¿Pertenece el número 100 al conjunto de los números naturales N?
  respuesta: Sí
  solucion_pasos:
  - Sí, 100 es un entero positivo de conteo.
- titulo: ¿Pertenece el número 0 al conjunto de los números naturales N en la convención
    escolar?
  respuesta: 'No'
  solucion_pasos:
  - No, el cero pertenece a los cardinales $\mathbb{N}_0$, no a los naturales $\mathbb{N}$.
errores_frecuentes:
- El número cero pertenece al conjunto de los números naturales $\mathbb{N}$ bajo
  la convención escolar estándar.
- El conjunto de los números naturales $\mathbb{N}$ posee un número máximo finito
  como su último elemento.
- Los números decimales positivos como $2,5$ pertenecen al conjunto de los números
  naturales.
- La sustracción de dos números naturales cualesquiera resulta siempre en otro número
  natural.
- El primer elemento del conjunto de los números naturales $\mathbb{N}$ es el número
  $0$.
afirmaciones_verdaderas:
- El conjunto de los números naturales $\mathbb{N}$ comienza en el 1 y es infinito
  hacia la derecha.
- Todo número natural es un entero positivo.
al_terminar_debes_poder: Al terminar serás capaz de identificar y clasificar cualquier
  número natural en el conjunto $\mathbb{N}$, verificando explícitamente que sea un
  entero positivo mayor o igual a 1 ($x \ge 1$) y excluyendo al cero y a los decimales.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
