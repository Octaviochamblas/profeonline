semantic_id: MAT.NUM.ENTEROS_CONJUNTO.NATURALES
resumen_inicial: "Los números naturales son los que usamos para contar: 1, 2, 3, 4… En este curso no incluyen el cero, salvo que se indique lo contrario."
explicacion_simple: |
  Imagina que cuentas manzanas en una canasta: una, dos, tres… Los números que usas para contar
  se llaman naturales. Son los primeros números que aprendes, y no incluyen el cero ni los
  negativos: si puedes poner esa cantidad de piedritas en tu mano, es un número natural.
explicacion_formal: |
  El conjunto de los números naturales se denota $\mathbb{N} = \{1, 2, 3, 4, \ldots\}$. Es un
  conjunto infinito con primer elemento $1$ y sin cota superior. Algunos textos incluyen el cero
  ($\mathbb{N}_0$); en este curso se usa la convención sin cero salvo indicación contraria.
definiciones_clave: |
  **Número natural**: entero positivo usado para contar ($1, 2, 3, \ldots$).
  **Convención sin cero**: en este curso, $0 \notin \mathbb{N}$.
propiedades_relaciones: |
  $\mathbb{N}$ tiene primer elemento ($1$) pero no último: es infinito hacia arriba. Todo natural
  tiene un sucesor natural. $\mathbb{N} \subset \mathbb{Z}$: todo natural es también un entero.
ejemplo_guiado:
  enunciado: "Determina si $23$ es un número natural."
  pasos:
    - "Verifica que $23$ sea entero: no tiene parte decimal."
    - "Verifica que sea estrictamente positivo: $23 > 0$."
    - 'Como cumple ambas condiciones, $23 \in \mathbb{N}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de los siguientes números NO pertenece a $\\mathbb{N}$ según la convención de este curso?"
    choices:
      - {text: "$0$", is_correct: true}
      - {text: "$5$", is_correct: false}
      - {text: "$12$", is_correct: false}
      - {text: "$100$", is_correct: false}
    explanation: "La correcta es $0$, porque en este curso $\\mathbb{N}$ no incluye el cero."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Aplicando el mismo procedimiento del ejemplo guiado, ¿cuál de estos números SÍ es natural?"
    choices:
      - {text: "$-8$", is_correct: false}
      - {text: "$3{,}5$", is_correct: false}
      - {text: "$9$", is_correct: true}
      - {text: "$0$", is_correct: false}
    explanation: "La correcta es $9$, porque es entero y estrictamente positivo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Verifica que el número sea entero (sin parte decimal)."
  - "Verifica que el número sea estrictamente positivo (mayor que cero)."
  - 'Si ambas condiciones se cumplen, el número pertenece a $\mathbb{N}$.'

errores_correccion: |
  Un error frecuente es incluir el cero sin fijarse en la convención del texto: en este curso
  $0 \notin \mathbb{N}$, así que antes de responder conviene confirmar qué convención se está usando.
  Otro error es confundir $\mathbb{N}$ con $\mathbb{Z}$: los enteros sí incluyen los negativos, los
  naturales no. Para corregirlo, aplica siempre las dos condiciones (entero y positivo) antes de
  concluir que un número es natural.

ejemplos:
  - titulo: "¿Pertenece 7 a los números naturales?"
    respuesta: "Sí"
    solucion_pasos:
      - "7 es entero (sin parte decimal)."
      - "7 > 0: es estrictamente positivo."
      - 'Por lo tanto, $7 \in \mathbb{N}$.'
  - titulo: "¿Pertenece −3 a los números naturales?"
    respuesta: "No"
    solucion_pasos:
      - "−3 es entero, pero es negativo."
      - "Los naturales son solo los enteros mayores que cero."
      - 'Por lo tanto, $-3 \notin \mathbb{N}$.'
  - titulo: "¿Pertenece 2.5 a los números naturales?"
    respuesta: "No"
    solucion_pasos:
      - "2.5 tiene parte decimal."
      - "Los naturales son números enteros; los decimales quedan excluidos."
      - 'Por lo tanto, $2.5 \notin \mathbb{N}$.'
  - titulo: "¿Son todos los enteros positivos también números naturales?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Los enteros positivos son: $1, 2, 3, 4, \ldots$'
      - "Los naturales (sin cero) son exactamente ese mismo conjunto."
      - 'Por lo tanto, $\mathbb{Z}^+ = \mathbb{N}$ bajo la convención sin cero.'

errores_frecuentes:
  - "Incluir el cero sin verificar la convención del texto."
  - 'Confundir $\mathbb{N}$ con $\mathbb{Z}$ (los enteros incluyen negativos).'
  - "Creer que los decimales positivos como 1.5 son naturales."
  - "Asumir que el conjunto de naturales es finito porque 'en algún punto termina'."
  - "Pensar que los números naturales y los enteros positivos son conjuntos distintos."

al_terminar_debes_poder: |
  Reconocer si un número dado pertenece al conjunto de los naturales, aplicando las dos condiciones
  (entero y positivo) y explicando por qué el cero y los decimales quedan excluidos bajo la
  convención de este curso.

fuente: "Moraleja, p. 21"
estado: publicado
