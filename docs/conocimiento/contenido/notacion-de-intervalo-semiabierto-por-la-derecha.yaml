semantic_id: MAT.ALG.INTERVALOS.SEMIABIERTO_DERECHA
resumen_inicial: 'Notación de intervalo semiabierto por la derecha: relaciones de
  orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Este tipo de intervalo incorpora su valor inicial pero no alcanza
  a incluir su valor final exacto.
explicacion_formal: '### Definición formal

  Un intervalo semiabierto por la derecha se define como $[a, b) = \{ x \in \mathbb{R}
  \mid a \le x < b \}$.


  ### Desarrollo didáctico

  Gráficamente, colocamos un círculo relleno en el punto inicial y un círculo hueco
  en el punto final.'
definiciones_clave: '- **Notación de intervalo semiabierto por la derecha**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a notación de intervalo semiabierto por
  la derecha.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de notación de intervalo
    semiabierto por la derecha.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de notación de intervalo semiabierto por la
    derecha, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
