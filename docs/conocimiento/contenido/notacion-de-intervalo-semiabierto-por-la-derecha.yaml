semantic_id: MAT.ALG.INTERVALOS.SEMIABIERTO_DERECHA
resumen_inicial: Un intervalo semiabierto por la derecha incluye al extremo inferior
  $a$ y excluye al extremo superior $b$, denotado $[a, b[$.
explicacion_simple: 'Un intervalo es **semiabierto por la derecha** (o semicerrado
  por la izquierda) cuando el borde de la izquierda SÍ está incluido, pero el borde
  de la derecha NO está incluido.

  Se escribe $[a, b[$ y responde a la desigualdad $a \le x < b$.'
explicacion_formal: 'El **intervalo semiabierto por la derecha** $[a, b[$ sobre $\mathbb{R}$
  con $a < b$ se define como:


  $$[a, b[ \ = [a, b) = \{x \in \mathbb{R} \mid a \le x < b\}$$


  **Desglose de la fórmula:**

  - $a \in [a, b[$ (extremo izquierdo incluido con corchete hacia adentro $[$).

  - $b \notin [a, b[$ (extremo derecho excluido con corchete hacia afuera $ [ $).'
definiciones_clave: '- **Intervalo semiabierto por la derecha $[a, b[$**: Subconjunto
  real con extremo $a$ incluido y extremo $b$ excluido.'
propiedades_relaciones: '- **Asimetría opuesta**: Desigualdad no estricta por la izquierda
  ($a \le x$) y estricta por la derecha ($x < b$).'
ejemplo_guiado:
  enunciado: Traduce la desigualdad $4 \le x < 9$ a notación de intervalo y determina
    si $4$ y $9$ pertenecen al intervalo.
  pasos:
  - 'Paso 1: Identificar la desigualdad no estricta a la izquierda ($4 \le x$) y estricta
    a la derecha ($x < 9$).Paso 2: Escribir la notación semiabierta por la derecha:
    $[4, 9[$.Paso 3: Evaluar $4$: por ser cerrado en el lado izquierdo, $4 \in [4,
    9[$.Paso 4: Evaluar $9$: por ser abierto en el lado derecho, $9 \notin [4, 9[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe en notación de intervalo la desigualdad $4 \le x < 9$?
  choices:
  - text: $[4, 9[$
    is_correct: true
  - text: $]4, 9]$
    is_correct: false
  - text: $[4, 9]$
    is_correct: false
  - text: $]4, 9[$
    is_correct: false
  explanation: La alternativa correcta es '$[4, 9[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el intervalo $[4, 9[$, ¿cuál de los extremos pertenece al conjunto?
  choices:
  - text: Solo el extremo izquierdo $4$.
    is_correct: true
  - text: Solo el extremo derecho $9$.
    is_correct: false
  - text: Ambos extremos.
    is_correct: false
  - text: Ningún extremo.
    is_correct: false
  explanation: La alternativa correcta es 'Solo el extremo izquierdo $4$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el corchete cerrado por la izquierda $[$.'
- 'Paso 2: Escribir los números de los extremos $a, b$.'
- 'Paso 3: Escribir el corchete abierto por la derecha $[$.'
- 'Paso 4: Formar el intervalo $[a, b[$.'
errores_correccion: '- **Error común:** Escribir el corchete derecho hacia adentro
  al traducir $x < b$.

  - **Cómo corregirlo:** La desigualdad estricta $<$ exige que el corchete esté invertido
  hacia afuera en ese extremo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
  - 'El intervalo semiabierto por la derecha $[2, 8[$ incluye al número $8$ dentro de su conjunto solución.'
  - 'La desigualdad que define al intervalo $[2, 8[$ se expresa con signos estrictos en ambos bordes $2 < x < 8$.'
  - 'En el intervalo $[2, 8[$, el extremo inferior $x = 2$ queda excluido del conjunto.'
  - 'La notación de corchete invertido en el lado derecho $[2, 8[$ indica inclusión del extremo superior.'
  - 'El intervalo $[2, 8[$ equivale rigurosamente al intervalo cerrado $[2, 8]$.'
afirmaciones_verdaderas:
  - 'El intervalo semiabierto por la derecha $[a, b[$ incluye el extremo inferior $a$ y excluye el extremo superior $b$.'
  - 'La notación $[a, b[$ equivale a la desigualdad mixta $a \le x < b$.'
al_terminar_debes_poder: |
  QUÉ: Utilizar e interpretar la notación de intervalos semiabiertos por la derecha.
  CÓMO: Traducir desigualdades de la forma $a \le x < b$, emplear corchete cerrado a la izquierda y abierto a la derecha $[a, b[$.
fuente: 'Texto escolar MINEDUC — Álgebra / Intervalos Reales'
