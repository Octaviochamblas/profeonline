semantic_id: MAT.GEO.VECTORES_BASE.INVERSO_ADITIVO
resumen_inicial: 'Interpretación del vector opuesto como inverso aditivo: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'Sumar un vector con su opuesto es como caminar hacia adelante
  y luego devolverse exactamente el mismo camino: terminas en el mismo lugar de donde
  saliste.'
explicacion_formal: '![Vector opuesto como inverso aditivo](/static/img/geometria/cartesiano-vectores/vector-inverso-aditivo.svg)


  ### Definición formal


  Para cualquier vector $\vec{v}=(v_x,v_y)$, su inverso aditivo es $-\vec{v}=(-v_x,-v_y)$,
  y se cumple que $\vec{v}+(-\vec{v})=(v_x-v_x,v_y-v_y)=(0,0)=\vec{0}$, el vector
  nulo.


  ### Desarrollo didáctico


  En la figura, al recorrer el vector $\vec{v}$ y luego su opuesto $-\vec{v}$ (colocado
  a continuación), se termina exactamente en el punto de partida, ilustrando que la
  suma de ambos es el vector nulo.'
definiciones_clave: '- **Interpretación del vector opuesto como inverso aditivo**:
  Elemento o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a interpretación del vector opuesto como inverso
  aditivo.'
