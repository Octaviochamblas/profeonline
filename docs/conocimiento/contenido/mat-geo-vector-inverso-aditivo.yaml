procedimiento:
- 'Paso 1: Identifica un vector v y su vector opuesto -v.'
- 'Paso 2: Suma sus componentes correspondientes: (vx+(-vx), vy+(-vy)).'
- 'Paso 3: Verifica que el resultado sea siempre (0,0), el vector nulo, confirmando
  que -v es el inverso aditivo de v.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con interpretación del vector opuesto como inverso aditivo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de interpretación del vector opuesto como inverso
    aditivo para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
