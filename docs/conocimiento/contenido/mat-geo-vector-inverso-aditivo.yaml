- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de interpretación del vector opuesto
    como inverso aditivo y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
