semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.PERIODO_IDENTIFICACION
resumen_inicial: El período es la secuencia finita de dígitos decimales que se repite infinitas veces en un decimal periódico o semiperiódico.
explicacion_simple: 'El período es exactamente esa cifra o grupo de cifras que se repite sin parar en la parte decimal de un número. Para identificarlo rápidamente, basta con mirar qué números están cubiertos justo debajo de la barra horizontal.


  ![Identificación del período decimal](/static/img/nodos/identificacion-del-periodo-decimal-intro.svg)'
explicacion_formal: 'Sea la expansión decimal $d = a_0, \dots \overline{p_1 p_2 \dots p_k}$, el **Período** $\mathcal{P}$ es la secuencia finita minimal de dígitos:


  $$\mathcal{P} = (p_1, p_2, \dots, p_k) \quad \text{tal que } \forall n \ge N, \, d_{n + k} = d_n$$


  **Desglose de la fórmula:**

  - $k$: Longitud de la secuencia minimal periódica.

  - Identificación gráfica: Corresponde a las cifras colocadas debajo de la barra de repetición $\overline{P}$.


  > **Complemento didáctico:** En $0,1232323... = 0,1\overline{23}$, la secuencia minimal que se repite es $23$, por lo tanto el período es el número $23$ (de longitud 2).'
definiciones_clave: '- **Período decimal**: Grupo mínimo de cifras decimales que se reitera infinitas veces en forma cíclica.'
propiedades_relaciones: '- **Extensión infalible**: Determina el número de 9s en el denominador de la fracción generatriz.'
ejemplo_guiado:
  enunciado: 'Identifique el período y su longitud en el número $5,1234234234... = 5,1\overline{234}$.


    ![Ejemplo Identificación del período decimal](/static/img/nodos/identificacion-del-periodo-decimal-ejemplos.svg)'
  pasos:
  - 'Paso 1: Ubicar la barra de repetición: está sobre las cifras $234$.'
  - 'Paso 2: Extraer el bloque de dígitos que se reitera infinitas veces: $234$.'
  - 'Paso 3: Contar cuántos dígitos forman el bloque: $3$ dígitos ($2$, $3$ y $4$).'
  - 'Conclusión: El período es $234$ y su longitud es de $3$ cifras.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa gráficamente la barra horizontal colocada sobre las cifras en un decimal?
  choices:
  - text: El período (el bloque de cifras que se repite infinitas veces)
    is_correct: true
  - text: El anteperíodo
    is_correct: false
  - text: La parte entera del número
    is_correct: false
  - text: Que el número se debe multiplicar por 10
    is_correct: false
  explanation: La alternativa correcta es 'El período (el bloque de cifras que se repite infinitas veces)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "En el ejemplo guiado para 5,1\bar{234}, ¿cuál es la longitud del período?"
  choices:
  - text: 3 cifras (el bloque 234)
    is_correct: true
  - text: 1 cifra
    is_correct: false
  - text: 4 cifras
    is_correct: false
  - text: 2 cifras
    is_correct: false
  explanation: La alternativa correcta es '3 cifras (el bloque 234)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la parte decimal repetitiva.'
- 'Paso 2: Aislar el bloque minimal de cifras consecutivas que se itera en la expansión.'
- 'Paso 3: Registrar el valor numérico del período y contar la cantidad de cifras de su barra.'
errores_correccion: '- **Error 1: Confundir la longitud del período con la de toda la parte decimal.** **Cómo corregirlo:** La longitud del período solo cuenta las cifras situadas DEBAJO DE LA BARRA.


  - **Error 2: Incluir el anteperíodo dentro del período.** **Cómo corregirlo:** El anteperíodo NO lleva barra y se encuentra antes del período.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el período en $0,8333... = 0,8\overline{3}$?
  alternativas:
  - '3'
  - '83'
  - '8'
  respuesta: '3'
  solucion_pasos:
  - Solo la cifra $3$ lleva la barra periódica $\implies$ período $3$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el período en $12,\overline{09}$?
  alternativas:
  - 09 (longitud 2)
  - '9'
  - '1209'
  respuesta: 09 (longitud 2)
  solucion_pasos:
  - Las cifras bajo la barra son $09$, por ende el período es $09$.
- titulo: ¿Es 75 el período en $0,1757575... = 0,1\overline{75}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, las cifras que se reiteran infinitamente son $75$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
- titulo: ¿Tiene el decimal finito $0,25$ período?
  respuesta: 'No'
  solucion_pasos:
  - No, los decimales finitos no tienen período ni barra de repetición.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
errores_frecuentes:
- El período incluye todas las cifras decimales a la derecha de la coma independientemente de la barra.
- En los decimales finitos el período es igual al número 1.
- El número de nueves de la fracción generatriz lo determina la cifra de la parte entera.
- El período de $0,1\overline{6}$ es la cifra 16 completa.
- Identificar el período requiere multiplicar el decimal por 100.
afirmaciones_verdaderas:
- El período es el bloque minimal de cifras decimales que se reitera infinitamente con barra.
- La cantidad de dígitos del período equivale al número de nueves que se escriben en el denominador generatriz.
al_terminar_debes_poder: '**QUÉ:** Identificar con precisión el período decimal y su longitud $k$ en expresiones decimales periódicas.


  **CÓMO:** Aislando el bloque mínimo de cifras consecutivas que se reproduce indefinidamente bajo la barra superior, deduciendo que su longitud $k$ determina exactamente la cantidad de nueves ($99\dots9$) en el denominador de la fracción generatriz.


  ![Resumen Identificación del período decimal](/static/img/nodos/identificacion-del-periodo-decimal-resumen.svg)'
