semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.INCENTRO_INTERSECCION
resumen_inicial: 'Definición de incentro como punto de intersección de las bisectrices
  interiores: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: 'Al igual que las alturas concurren en el ortocentro, las tres
  bisectrices interiores de un triángulo también concurren siempre en un único punto:
  el incentro.'
explicacion_formal: '![Incentro, intersección de las bisectrices](/static/img/geometria/elementos-secundarios/bisectriz-incentro-incentro-interseccion.svg)


  ### Definición formal


  Dado un triángulo ABC, el incentro I es el punto común a las tres bisectrices interiores
  trazadas desde A, B y C.


  ### Desarrollo didáctico


  A diferencia del ortocentro (que puede quedar fuera del triángulo), el incentro
  siempre se ubica en el interior de la figura, sin importar el tipo de triángulo.'
