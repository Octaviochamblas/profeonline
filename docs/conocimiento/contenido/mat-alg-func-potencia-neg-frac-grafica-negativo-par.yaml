semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.GRAFICA_NEGATIVO_PAR
resumen_inicial: 'Análisis de la gráfica para exponentes enteros negativos pares:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Exponentes negativos
  y fraccionarios.'
explicacion_simple: Cuando el exponente negativo es par, la función se comporta de
  forma simétrica respecto al eje $y$, pero con dos ramas separadas por una asíntota.
explicacion_formal: '### Definición formal


  Para $n$ par y $a>0$, $f(x)=a\cdot x^{-n}=\dfrac{a}{x^n}>0$ para todo $x\neq0$,
  ya que $x^n>0$. La curva tiene dos ramas simétricas respecto al eje $y$, ambas ubicadas
  por encima del eje $x$.


  ### Desarrollo didáctico


  $f(x)=x^{-2}$: para $x=1$, $f(1)=1$; para $x=-1$, $f(-1)=1$; para $x=2$, $f(2)=0{,}25$;
  para $x=-2$, $f(-2)=0{,}25$. Ambas ramas son idénticas por simetría, y se acercan
  a $0$ al alejarse del origen.'
definiciones_clave: '- **Análisis de la gráfica para exponentes enteros negativos
  pares**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de la gráfica para exponentes enteros negativos pares.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de la gráfica para exponentes enteros negativos pares.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de la gráfica
    para exponentes enteros negativos pares.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
