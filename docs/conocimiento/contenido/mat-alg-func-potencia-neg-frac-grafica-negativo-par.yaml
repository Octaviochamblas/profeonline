semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.GRAFICA_NEGATIVO_PAR
resumen_inicial: 'La gráfica de una función potencia de exponente entero negativo par $f(x) = a x^{-2k}$ posee forma de volcán simétrico respecto al eje $y$, con asíntota vertical en $x = 0$ y horizontal en $y = 0$.'
explicacion_simple: |
  Cuando una función potencia tiene un exponente entero negativo par (como $x^{-2} = \frac{1}{x^2}$ o $x^{-4} = \frac{1}{x^4}$), su gráfica parece la silueta de un volcán o chimenea simétrica. Si el número $a$ es positivo, las dos ramas se disparan hacia arriba ($+\infty$) al acercarse al eje vertical $y$, y caen aplanándose hacia el suelo al alejarse a los lados. Si $a$ es negativo, el volcán se invierte hacia abajo ($-\infty$). La curva nunca toca el eje $y$ ni el eje $x$.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función potencia de exponente entero negativo par** $f(x) = a x^{-2k} \equiv \frac{a}{x^{2k}}$ ($k \in \mathbb{Z}^+$) se compone de dos ramas continuas disjuntas $G = \{(x, \frac{a}{x^{2k}}) \mid x \in \mathbb{R} \setminus \{0\}\}$ caracterizada analíticamente por:
  1. **Simetría Axial Par**: $f(-x) = \frac{a}{(-x)^{2k}} = \frac{a}{x^{2k}} = f(x)$. La gráfica es especularmente simétrica respecto al eje $y$.
  2. **Asíntota Vertical Coincidente ($x = 0$)**:
     - Si $a > 0 \implies \lim_{x \to 0^-} f(x) = \lim_{x \to 0^+} f(x) = +\infty$ (Ambas ramas suben juntas hacia $+\infty$).
     - Si $a < 0 \implies \lim_{x \to 0^-} f(x) = \lim_{x \to 0^+} f(x) = -\infty$ (Ambas ramas bajan juntas hacia $-\infty$).
  3. **Asíntota Horizontal Unilateral ($y = 0$)**: $\lim_{x \to \pm\infty} f(x) = 0$. Ambas ramas bordean el eje $x$ por arriba (si $a > 0$) o por abajo (si $a < 0$).

  ### Síntesis didáctica
  Puntos nodales universales para la forma mónica $y = x^{-2k}$:
  - $(-1, 1)$ y $(1, 1)$.
definiciones_clave: |
  - **Curva en silueta de volcán**: Estructura gráfica de dos ramas simétricas paralelas respecto al eje vertical.
  - **Divergencia asintótica simultánea**: Comportamiento donde ambas ramas convergen hacia $+\infty$ (o $-\infty$) al aproximarse a $x = 0$.
  - **Cuadrantes ocupados**: Cuadrantes I y II (si $a > 0$) o cuadrantes III y IV (si $a < 0$).
propiedades_relaciones: |
  - **Recorrido acotado por cero**: Para $a > 0$, $\operatorname{Rec}(f) = ]0, +\infty[$; para $a < 0$, $\operatorname{Rec}(f) = ]-\infty, 0[$. El valor $y = 0$ queda excluido del recorrido.
  - **Invariancia por el grado par**: Aumentar el grado par ($n = -4, -6$) aplasta la curva pegándola más a los ejes cartesianos.
ejemplo_guiado:
  enunciado: 'Analiza la gráfica y puntos representativos de la función potencia negativa par $f(x) = \frac{2}{x^2}$ para $x \in \{-2, -1, -0.5, 0.5, 1, 2\}$, identificando sus asíntotas.'
  pasos:
    - 'Paso 1: Evaluamos puntos: $f(-2) = \frac{2}{4} = 0.5$, $f(-1) = 2$, $f(-0.5) = \frac{2}{0.25} = 8$.'
    - 'Paso 2: Evaluamos en el lado positivo: $f(0.5) = 8$, $f(1) = 2$, $f(2) = 0.5$.'
    - 'Paso 3: Se confirma simetría especular $f(-x) = f(x)$. En $x = 0$, la función no existe (asíntota vertical $x = 0$).'
    - 'Paso 4: Como $a = 2 > 0$, al acercarse a cero por ambos lados la función sube a $+\infty$ (forma de volcán en cuadrantes I y II), con asíntota horizontal en $y = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué aspecto geométrico caracteriza a la gráfica de una función potencia con exponente entero negativo par como $f(x) = 5x^{-4} = \frac{5}{x^4}$?'
    choices:
      - {text: 'Una curva en forma de volcán simétrico respecto al eje $y$, con ambas ramas subiendo hacia $+\infty$ cerca de $x = 0$ y aplanándose hacia el eje $x$', is_correct: true}
      - {text: 'Una curva en forma de S que pasa por el origen $(0, 0)$', is_correct: false}
      - {text: 'Una parábola estándar con vértice en el origen', is_correct: false}
      - {text: 'Una recta inclinada que pasa por el punto $(0, 5)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Una curva en forma de volcán simétrico respecto al eje $y$, con ambas ramas subiendo hacia $+\infty$ cerca de $x = 0$ y aplanándose hacia el eje $x$''. Las potencias de exponente par negativo $n = -2, -4\dots$ con $a > 0$ generan curvas de volcán en cuadrantes I y II.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el comportamiento de las ramas de la gráfica $f(x) = -3x^{-2} = \frac{-3}{x^2}$ cuando la variable $x$ se aproxima al origen por la izquierda y por la derecha ($x \to 0$)?'
    choices:
      - {text: 'Ambas ramas caen simultáneamente hacia $-\infty$ pegadas al eje vertical $y$, habitando los cuadrantes III y IV', is_correct: true}
      - {text: 'Una rama sube a $+\infty$ y la otra cae a $-\infty$', is_correct: false}
      - {text: 'Ambas ramas se cruzan en el punto $(0, -3)$', is_correct: false}
      - {text: 'Las ramas se aplanan en la recta $y = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''Ambas ramas caen simultáneamente hacia $-\infty$ pegadas al eje vertical $y$, habitando los cuadrantes III y IV''. Con $a = -3 < 0$, la gráfica de volcán se invierte hacia $-\infty$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el exponente $n$ sea entero negativo par ($n = -2, -4, -6\dots$).'
  - 'Paso 2: Trazar la asíntota vertical en la recta $x = 0$ (eje $y$) y la asíntota horizontal en $y = 0$ (eje $x$).'
  - 'Paso 3: Marcar los puntos pivote $(-1, a)$ y $(1, a)$.'
  - 'Paso 4: Dibujar la silueta de volcán simétrica respecto al eje $y$, dirigiéndose hacia $+\infty$ (si $a > 0$) o hacia $-\infty$ (si $a < 0$) al acercarse al eje $y$.'
errores_correccion: |
  - **Error 1:** Dibujar una rama hacia arriba y otra hacia abajo como en la hipérbola impar. **Cómo corregirlo:** En exponentes pares negativos, $(-x)^{-2k} = x^{-2k}$, por lo que ambas ramas tienen el mismo signo de salida y apuntan a la misma dirección vertical.
  - **Error 2:** Dibujar la curva cruzando o tocando los ejes cartesianos. **Cómo corregirlo:** Los ejes $x = 0$ e $y = 0$ son asíntotas estrictas. La curva se aproxima infinitamente a ellos pero jamás los toca ni los cruza.
ejemplos:
  - titulo: 'Forma de volcán en base par negativa'
    enunciado: '¿La gráfica de $f(x) = \frac{1}{x^2}$ es simétrica respecto al eje $y$?'
    alternativas:
      - 'Sí, por tener exponente par negativo'
      - 'No, es simétrica al origen'
      - 'No tiene simetría'
    respuesta: 'Sí, por tener exponente par negativo'
    solucion_pasos:
      - '1. Exponente $n = -2$ es par negativo.'
      - '2. Satisface $f(-x) = f(x)$, siendo simétrica respecto al eje $y$ en forma de volcán.'
  - titulo: 'Volcán invertido hacia abajo'
    enunciado: '¿La gráfica de $g(x) = -\frac{4}{x^2}$ habita en los cuadrantes III y IV?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -4 < 0$, las dos ramas divergen a $-\infty$ en cuadrantes III y IV.'
  - titulo: 'Exclusión del cero en el recorrido'
    enunciado: '¿El valor $y = 0$ pertenece al recorrido de $f(x) = \frac{1}{x^4}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La función se aproxima a $y = 0$ en el infinito pero jamás la alcanza. Recorrido: $]0, +\infty[$.'
  - titulo: 'Puntos nodales en exponente par negativo'
    enunciado: '¿La curva de $y = \frac{3}{x^2}$ pasa por $(-1, 3)$ y $(1, 3)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluamos: $f(-1) = \frac{3}{1} = 3$ y $f(1) = \frac{3}{1} = 3$.'
errores_frecuentes:
  - 'La gráfica de la función potencia de exponente par negativo $f(x) = x^{-2}$ pasa por el origen $(0, 0)$.'
  - 'Una rama de $f(x) = x^{-2}$ sube a $+\infty$ y la otra cae a $-\infty$.'
  - 'La curva de $f(x) = \frac{1}{x^4}$ toca al eje horizontal en valores grandes de $x$.'
  - 'La asíntota vertical de $f(x) = x^{-2}$ se ubica en la recta $y = 1$.'
  - 'Las funciones de exponente par negativo no son simétricas respecto al eje $y$.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero negativo par $f(x) = a x^{-2k}$ posee una gráfica en forma de volcán simétrico respecto al eje $y$, con asíntota vertical en $x = 0$ y asíntota horizontal en $y = 0$.'
  - 'Ambas ramas de la gráfica de exponente par negativo apuntan hacia la misma dirección vertical: hacia $+\infty$ en los cuadrantes I y II si $a > 0$, o hacia $-\infty$ en los cuadrantes III y IV si $a < 0$.'
al_terminar_debes_poder: |
  QUÉ: Esbozar la gráfica de funciones potencia con exponente negativo par ($n = -2, -4, \dots$).
  CÓMO: Reconocer la forma de "volcán" simétrica respecto al eje Y, con ramas hacia $+\infty$ cerca de $x = 0$ para $a > 0$.
