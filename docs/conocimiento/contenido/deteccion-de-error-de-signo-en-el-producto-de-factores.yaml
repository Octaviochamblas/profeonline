resumen_inicial: La detección de error de signo en el producto de factores verifica
  la corrección de una factorización comprobando que el desarrollo distributivo recupere
  exactamente los signos de $p$ y $q$.
explicacion_simple: 'Para estar 100% seguro de que tu factorización como $(x - 6)(x
  + 4)$ está buena, multiplicas de vuelta: $x \cdot x = x^2$, $-6x + 4x = -2x$, y
  $(-6) \cdot 4 = -24$. Si la expresión original era $x^2 - 2x - 24$, ¡los signos
  coinciden perfectamente y tu respuesta es correcta!'
explicacion_formal: 'Dada una propuesta de factorización $P_{\text{prop}}(x) = (x
  + r)(x + s)$ para el trinomio $x^2 + px + q$, el **Protocolo de Detección de Error
  de Signo** exige la comprobación de la prueba distributiva exacta:


  $$\begin{cases} \text{Prueba de suma (signo de } p): & r + s = p \\ \text{Prueba
  de producto (signo de } q): & r \cdot s = q \end{cases}$$


  **Desglose simbólico:**

  - Si el producto $r \cdot s \neq q$, la distribución de signos en los factores es
  incorrecta.

  - Si la suma $r + s \neq p$, el signo del término central del trinomio resulta invertido.


  > **Complemento didáctico:** Sirve como herramienta de autocorrección inmediata
  para validar factorizaciones antes de dar por terminado un ejercicio.'
definiciones_clave: '- **Prueba distributiva de verificación**: Multiplicación de
  comprobación para validar la expansión del producto.

  - **Error de inversión de signo**: Fallo común donde el par adopta signos contrarios
  a los exigidos por $p$ y $q$.'
propiedades_relaciones: '- **Consistencia de signos**: El producto de dos números
  de igual signo es positivo; el de signos contrarios es negativo.'
ejemplo_guiado:
  enunciado: Verifique si la propuesta de factorización $(x + 6)(x - 4)$ es correcta
    para el trinomio $x^2 - 2x - 24$.
  pasos:
  - 'Paso 1: Identificar el trinomio objetivo: $x^2 - 2x - 24$ (donde $p = -2$ y $q
    = -24$).'
  - 'Paso 2: Desarrollar distributivamente la propuesta $(x + 6)(x - 4)$:'
  - '  - Término cuadrático: $x \cdot x = x^2$.'
  - '  - Término lineal: $6x - 4x = +2x$.'
  - '  - Término independiente: $6 \cdot (-4) = -24$.'
  - 'Paso 3: Comparar el resultado $x^2 + 2x - 24$ con el trinomio objetivo $x^2 -
    2x - 24$.'
  - 'Paso 4: Detectar la discrepancia: El término lineal obtenido es $+2x$, pero el
    objetivo es $-2x$ (error de signo en la suma).'
  - 'Conclusión: La propuesta $(x + 6)(x - 4)$ es INCORRECTA por error de signo. La
    correcta es $(x - 6)(x + 4)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el método más seguro para verificar si una propuesta de factorización
    contiene errores de signo?
  choices:
  - text: Realizar el desarrollo distributivo completo y comparar término a término
      con el polinomio original
    is_correct: true
  - text: Sumar únicamente los coeficientes de los términos independientes
    is_correct: false
  - text: Cambiar aleatoriamente los signos del polinomio original
    is_correct: false
  - text: Dividir el término independiente por $2$
    is_correct: false
  explanation: La alternativa correcta es 'Realizar el desarrollo distributivo completo
    y comparar término a término con el polinomio original'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al desarrollar $(x + 6)(x - 4)$ se obtiene $x^2 + 2x - 24$. ¿Por qué no
    es la factorización de $x^2 - 2x - 24$?
  choices:
  - text: Porque el signo del término lineal resultó $+2x$ en lugar de $-2x$
    is_correct: true
  - text: Porque el término independiente resultó positivo
    is_correct: false
  - text: Porque el término $x^2$ cambió de signo
    is_correct: false
  - text: Porque no se simplificó por $2$
    is_correct: false
  explanation: La alternativa correcta es 'Porque el signo del término lineal resultó
    $+2x$ en lugar de $-2x$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva a la respuesta factorizada $(x + r)(x
  + s)$.'
- 'Paso 2: Reducir los términos semejantes para obtener $x^2 + (r+s)x + rs$.'
- 'Paso 3: Verificar que tanto el signo del término lineal como el del independiente
  coincidan exactamente con el polinomio original.'
errores_correccion: '- **Error 1: Dar por correcta una factorización sin verificar
  el signo del término lineal central mediante la prueba distributiva.** **Cómo corregirlo:**
  Se DEBE multiplicar de vuelta los binomios para confirmar que la suma $r+s$ produzca
  el signo de $p$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $(x - 5)(x - 3)$ la factorización correcta de $x^2 - 8x + 15$?
  alternativas:
  - Sí, porque $(-5)+(-3)=-8$ y $(-5)(-3)=15$
  - No, porque el producto es negativo
  - No, porque los signos debieron ser positivos
  respuesta: Sí, porque $(-5)+(-3)=-8$ y $(-5)(-3)=15$
  solucion_pasos:
  - '1. Desarrollo: $x^2 - 3x - 5x + 15 = x^2 - 8x + 15$. Coincidencia 100%.'
- titulo: Ejemplo 2
  enunciado: Al probar $(x - 7)(x + 2)$ para $x^2 + 5x - 14$, ¿qué error de signo
    se detecta?
  alternativas:
  - Da $-5x$ en el término lineal en lugar de $+5x$
  - Da $+14$ en el término independiente
  - No hay ningún error
  respuesta: Da $-5x$ en el término lineal en lugar de $+5x$
  solucion_pasos:
  - 1. $(-7) + 2 = -5$, pero el trinomio requiere $+5$. La correcta es $(x + 7)(x
    - 2)$.
- titulo: Si al multiplicar dos binomios el término independiente resulta $+12$ pero
    el polinomio original tenía $-12$, ¿la factorización es errónea?
  respuesta: Sí
  solucion_pasos:
  - Sí, hay un error de signo en el producto del par numérico.
- titulo: ¿Es $(x - 4)(x + 4)$ la factorización de $x^2 - 16$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2 - 4x + 4x - 16 = x^2 - 16$.
errores_frecuentes:
- Aceptar una factorización cuyo desarrollo distributivo invierte el signo del término
  lineal.
- Declarar que los signos del par numérico no influyen en el resultado final del polinomio.
- Evaluar la prueba distributiva multiplicando solo los primeros términos de cada
  binomio.
- Declarar que dos binomios con signos erróneos se corrigen agregando un signo menos
  fuera de todo el polinomio.
- Reemplazar la prueba distributiva por la simple adición aritmética de los coeficientes
  $p$ y $q$.
afirmaciones_verdaderas:
- El desarrollo distributivo de los binomios factorizados debe regenerar estrictamente
  los signos del polinomio original.
- Un fallo en el signo del término lineal indica que los signos asignados al par numérico
  están invertidos.
al_terminar_debes_poder: Al terminar serás capaz de detectar y corregir errores de
  signo en el producto de factores mediante la prueba distributiva.
