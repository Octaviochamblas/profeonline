semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.COMPLETACION_CUADRADO
resumen_inicial: La obtención de la forma canónica completando el cuadrado transforma $ax^2 + bx + c$ en $a(x - h)^2 + k$ mediante la construcción de un trinomio cuadrado perfecto.
explicacion_simple: |
  Para pasar de la forma general $f(x) = ax^2 + bx + c$ a la forma canónica $a(x - h)^2 + k$ se usa el método de **completación de cuadrados**:

  **Pasos para el caso con $a = 1$ (ej. $f(x) = x^2 - 6x + 5$)**:
  1. Tomas el coeficiente de la $x$ (que es $-6$), lo divides por $2$ (da $-3$) y lo elevas al cuadrado (da $9$).
  2. Sumas y restas ese número $9$ dentro de la función:
     $$f(x) = (x^2 - 6x + 9) - 9 + 5$$
  3. Los primeros 3 términos forman un **cuadrado perfecto**: $(x - 3)^2$.
  4. Juntas los números restantes: $-9 + 5 = -4$.
  5. ¡Listo! La forma canónica es **$f(x) = (x - 3)^2 - 4$**.
explicacion_formal: |
  Dada la expresión cuadrática en forma general $f(x) = ax^2 + bx + c$ con $a \neq 0$, el método algebraico de **completación del trinomio cuadrado perfecto** factoriza el coeficiente $a$ y manipula la identidad $(u + v)^2 = u^2 + 2uv + v^2$:

  $$f(x) = a\left[x^2 + \frac{b}{a}x\right] + c = a\left[\left(x + \frac{b}{2a}\right)^2 - \frac{b^2}{4a^2}\right] + c$$

  Distribuyendo el factor $a$ y simplificando los términos constantes:

  $$f(x) = a\left(x + \frac{b}{2a}\right)^2 + \left(c - \frac{b^2}{4a}\right) = a(x - h)^2 + k$$
definiciones_clave: |
  - **Completación de cuadrados**: Algoritmo algebraico que transforma un polinomio de segundo grado en el cuadrado de un binomio más una constante.
propiedades_relaciones: |
  - **Demostración de la fórmula cuadrática**: La completación de cuadrados en la ecuación $ax^2 + bx + c = 0$ es el procedimiento que da origen a la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$.
ejemplo_guiado:
  enunciado: 'Transforma la función cuadrática $f(x) = 2x^2 - 8x + 10$ a su forma canónica completando el cuadrado.'
  pasos:
    - 'Paso 1: Factorizar el coeficiente $a = 2$ en los términos con variable: $f(x) = 2(x^2 - 4x) + 10$.'
    - 'Paso 2: Calcular el término de completación para $x^2 - 4x$: la mitad de $-4$ es $-2$, y $(-2)^2 = 4$.'
    - 'Paso 3: Sumar y restar 4 dentro del paréntesis: $f(x) = 2[(x^2 - 4x + 4) - 4] + 10 = 2[(x - 2)^2 - 4] + 10$.'
    - 'Paso 4: Distribuir el 2 y combinar constantes: $f(x) = 2(x - 2)^2 - 8 + 10 = 2(x - 2)^2 + 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al completar el cuadrado en la función $f(x) = x^2 + 10x + 7$, ¿cuál es el término constante que se debe agregar y sustraer para formar el cuadrado perfecto?'
    choices:
      - {text: 'El número 25 ($5^2$)', is_correct: true}
      - {text: 'El número 10.', is_correct: false}
      - {text: 'El número 100 ($10^2$).', is_correct: false}
      - {text: 'El número 5.', is_correct: false}
    explanation: 'La alternativa correcta es ''El número 25 ($5^2$)''. La mitad de 10 es 5, y su cuadrado es 25.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma canónica de la función $f(x) = x^2 - 4x + 9$ obtenida por completación de cuadrados?'
    choices:
      - {text: '$f(x) = (x - 2)^2 + 5$', is_correct: true}
      - {text: '$f(x) = (x - 4)^2 + 5$.', is_correct: false}
      - {text: '$f(x) = (x - 2)^2 + 9$.', is_correct: false}
      - {text: '$f(x) = (x + 2)^2 - 5$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = (x - 2)^2 + 5$''. $x^2 - 4x + 4 + 5 = (x - 2)^2 + 5$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Si $a \neq 1$, factorizar $a$ de los primeros dos términos $ax^2 + bx$.'
  - 'Paso 2: Tomar el coeficiente del término lineal interno, dividir por 2 y elevar al cuadrado.'
  - 'Paso 3: Sumar y restar dicha cantidad dentro de la expresión para mantener el valor inalterado.'
  - 'Paso 4: Factorizar el trinomio cuadrado perfecto en binomio al cuadrado $(x - h)^2$ y simplificar las constantes para obtener $k$.'
errores_correccion: |
  - **Error común:** Cuando $a \neq 1$, olvidar multiplicar por $a$ el valor restado al sacarlo del paréntesis.
  - **Cómo corregirlo:** Si restaste $4$ dentro de $2[\dots - 4]$, al sacarlo del paréntesis debes multiplicar **$2 \times (-4) = -8$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Completación mónica.
    alternativas:
      - 'f(x) = (x + 3)^2 - 14'
      - 'f(x) = (x + 6)^2 - 14'
      - 'f(x) = (x + 3)^2 + 5'
    respuesta: 'f(x) = (x + 3)^2 - 14'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Completación con a no unitario.
    alternativas:
      - 'f(x) = 3(x - 1)^2 + 4'
      - 'f(x) = 3(x - 1)^2 + 7'
      - 'f(x) = (3x - 3)^2 + 4'
    respuesta: 'f(x) = 3(x - 1)^2 + 4'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La falta de sustracción del término de completación alterando el valor cuantitativo de la función original.'
  - 'La aplicación del cuadrado de la mitad del coeficiente lineal sin realizar la previa factorización del coeficiente cuadrático $a$.'
  - 'Cometer errores de signo en el binomio resultante escribiendo $(x + h)^2$ en lugar de $(x - h)^2$ para abscisas positivas.'
  - 'La suposición de que el método de completación de cuadrados solo se puede aplicar cuando el término independiente $c = 0$.'
  - 'La falta de multiplicación del término restado por el factor externo $a$ al extraerlo fuera del paréntesis cuadrático.'
afirmaciones_verdaderas:
  - 'El método de completación de cuadrados transforma la forma general $ax^2 + bx + c$ en la forma canónica $a(x - h)^2 + k$.'
  - 'El término necesario para completar un trinomio cuadrado perfecto en $x^2 + px$ es el cuadrado de la mitad del coeficiente lineal $(p/2)^2$.'
al_terminar_debes_poder: |
  QUÉ: Obtener la forma canónica de una función cuadrática completando el trinomio cuadrado perfecto.
  CÓMO: Factorizar $a$, calcular $(b/2a)^2$, sumar/restar el término, construir el binomio $(x - h)^2$ y agrupar la constante $k$.
