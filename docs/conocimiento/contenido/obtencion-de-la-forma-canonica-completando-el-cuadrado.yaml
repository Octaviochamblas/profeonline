semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.COMPLETACION_CUADRADO
resumen_inicial: La obtención de la forma canónica completando el cuadrado transforma la forma general $f(x) = ax^2 + bx + c$ en la forma canónica $f(x) = a(x - h)^2 + k$ mediante la construcción de un trinomio cuadrado perfecto.
explicacion_simple: "![La obtención de la forma canónica completando el cuadrado transforma la forma general $f(x) = ax^2 + bx + c$ en la forma canónica $f(x) = a(x - h)^2 + k$ mediante la construcción de un trinomio cuadrado perfecto](/static/img/nodos/obtencion-de-la-forma-canonica-completando-el-cuadrado-intro.svg)\n\n\nCompletar el cuadrado es una técnica para transformar una ecuación desordenada en una forma donde el vértice queda a la vista:\n\n**Pasos para completar el cuadrado:**\n1. Si $a = 1$ en $f(x) = x^2 + 6x + 5$:\n   - Toma el número del medio ($+6$), **divídelo por 2** ($+3$) y **elévate al cuadrado** ($9$).\n   - Suma y resta ese 9:\n     $$f(x) = (x^2 + 6x + 9) - 9 + 5$$\n   - El paréntesis se convierte en un binomio al cuadrado: **$(x + 3)^2$**.\n   - Junta los números de afuera: $-9 + 5 = -4$.\n   - ¡Listo! **$f(x) = (x + 3)^2 - 4$**, con vértice en **$(-3, -4)$**.\n2. Si $a \\neq 1$, primero sacas factor común $a$ de los términos con $x$."
explicacion_formal: "Sea $f(x) = ax^2 + bx + c$ con $a \\in \\mathbb{R} \\setminus \\{0\\}$. El **algoritmo algebraico de completación de cuadrados** opera formalmente como sigue:\n\n1. **Factorización del coeficiente principal**:\n   $$f(x) = a\\left[ x^2 + \\frac{b}{a}x \\right] + c$$\n2. **Construcción del trinomio cuadrado perfecto (sumando y restando $\\left(\\frac{b}{2a}\\right)^2$)**:\n   $$f(x) = a\\left[ x^2 + 2\\left(\\frac{b}{2a}\\right)x + \\left(\\frac{b}{2a}\\right)^2 - \\left(\\frac{b}{2a}\\right)^2 \\right] + c$$\n3. **Agrupación y compensación escalar**:\n   $$f(x) = a\\left(x + \\frac{b}{2a}\\right)^2 - a\\left(\\frac{b^2}{4a^2}\\right) + c = a\\left(x + \\frac{b}{2a}\\right)^2 + \\left(c - \\frac{b^2}{4a}\\right)$$\n4. **Identificación canónica**:\n   $$f(x) = a(x - h)^2 + k, \\quad h = -\\frac{b}{2a}, \\; k = c - \\frac{b^2}{4a}$$"
definiciones_clave: '- **Completación de cuadrado**: Transformación algebraica que reescribe un polinomio cuadrático como un múltiplo de un binomio al cuadrado más una constante.

  - **Trinomio cuadrado perfecto (TCP)**: Expresión $x^2 + 2mx + m^2 = (x + m)^2$.'
propiedades_relaciones: '- **Identidad algebraica universal**: Ambas formas definen exactamente la misma función y la misma curva gráfica.

  - **Derivación de la fórmula cuadrática**: El método de completación de cuadrados es la base teórica que demuestra la fórmula general de segundo grado.'
ejemplo_guiado:
  enunciado: '![Ejemplo La obtención de la forma canónica completando el cuadrado transforma la forma general $f(x) = ax^2 + bx + c$ en la forma canónica $f(x) = a(x - h)^2 + k$ mediante la construcción de un trinomio cuadrado perfecto](/static/img/nodos/obtencion-de-la-forma-canonica-completando-el-cuadrado-ejemplos.svg)



    Transforma la función $f(x) = 2x^2 - 12x + 11$ a su forma canónica completando el cuadrado y enuncia las coordenadas del vértice.'
  pasos:
  - 'Paso 1: Factorizar el coeficiente $a = 2$ de los términos con $x$:

    $f(x) = 2(x^2 - 6x) + 11$.'
  - 'Paso 2: Calcular el término cuadrático complementario:

    La mitad de $-6$ es $-3$; al cuadrado es $(-3)^2 = 9$.'
  - 'Paso 3: Sumar y restar 9 dentro del paréntesis:

    $f(x) = 2(x^2 - 6x + 9 - 9) + 11$.'
  - 'Paso 4: Extraer el $-9$ multiplicándolo por el factor 2 exterior:

    $f(x) = 2(x^2 - 6x + 9) - 2(9) + 11 = 2(x - 3)^2 - 18 + 11$.'
  - 'Paso 5: Simplificar la constante exterior:

    $f(x) = 2(x - 3)^2 - 7$.'
  - 'Paso 6: Conclusión: La forma canónica es $f(x) = 2(x - 3)^2 - 7$, con vértice en $V(3, -7)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al completar el cuadrado en $f(x) = x^2 - 8x + 20$, ¿cuál es su forma canónica?
  choices:
  - text: f(x) = (x - 4)² + 4
    is_correct: true
  - text: f(x) = (x - 4)² + 20
    is_correct: false
  - text: f(x) = (x + 4)² + 4
    is_correct: false
  - text: f(x) = (x - 8)² + 4
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = (x - 4)² + 4'. $(x^2 - 8x + 16) - 16 + 20 = (x - 4)^2 + 4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En $f(x) = 3x^2 + 12x + 1$, ¿qué número se debe restar afuera tras completar $3(x^2 + 4x + 4)$?
  choices:
  - text: Se debe restar 12 (porque 3 · 4 = 12)
    is_correct: true
  - text: Se debe restar 4
    is_correct: false
  - text: Se debe sumar 12
    is_correct: false
  - text: Se debe restar 3
    is_correct: false
  explanation: La alternativa correcta es 'Se debe restar 12 (porque 3 · 4 = 12)'. El 4 añadido dentro está multiplicado por 3, requiriendo restar $3 \times 4 = 12$ afuera.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar los términos cuadrático y lineal, factorizando $a$ si $a \neq 1$.'
- 'Paso 2: Tomar el coeficiente lineal interno, dividirlo por 2 y elevarlo al cuadrado.'
- 'Paso 3: Sumar dicho valor dentro del paréntesis y compensar restando $a \cdot (\text{valor})$ fuera.'
- 'Paso 4: Factorizar el trinomio cuadrado perfecto como $(x - h)^2$.'
- 'Paso 5: Reducir los términos independientes exteriores para obtener $k$.'
errores_correccion: '- **Error común:** Olvidar multiplicar por $a$ al restar el término compensatorio afuera en $a(x^2 + bx + m) - m$.

  - **Cómo corregirlo:** Lo que agregaste adentro está multiplicado por $a$, por lo que **afuera debes restar $a \cdot m$**.'
ejemplos:
- titulo: 'Ejemplo 1: Completación mónic simple'
  enunciado: Transforma $f(x) = x^2 + 10x + 21$ a forma canónica.
  alternativas:
  - (x + 5)^2 - 4
  - (x + 5)^2 + 4
  - (x - 5)^2 - 4
  - (x + 10)^2 - 4
  respuesta: (x + 5)^2 - 4
  solucion_pasos:
  - 'Paso 1: $(x^2 + 10x + 25) - 25 + 21 = (x + 5)^2 - 4$.'
- titulo: 'Ejemplo 2: Completación con factor a = -1'
  enunciado: Transforma $g(x) = -x^2 + 4x + 1$ a forma canónica.
  alternativas:
  - -(x - 2)^2 + 5
  - -(x + 2)^2 + 5
  - -(x - 2)^2 + 1
  - (x - 2)^2 + 5
  respuesta: -(x - 2)^2 + 5
  solucion_pasos:
  - 'Paso 1: $-(x^2 - 4x) + 1 = -(x^2 - 4x + 4) + 4 + 1 = -(x - 2)^2 + 5$.'
- titulo: 'Ejemplo 3: Completación con a = 3'
  enunciado: En $f(x) = 3x^2 - 6x + 7$, ¿cuál es su forma canónica?
  alternativas:
  - 3(x - 1)^2 + 4
  - 3(x - 1)^2 + 7
  - 3(x - 2)^2 + 4
  - (x - 1)^2 + 4
  respuesta: 3(x - 1)^2 + 4
  solucion_pasos:
  - 'Paso 1: $3(x^2 - 2x + 1) - 3 + 7 = 3(x - 1)^2 + 4$.'
- titulo: 'Ejemplo 4: Identificación del vértice tras completar'
  enunciado: Si $x^2 - 2x - 8 = (x - 1)^2 - 9$, ¿dónde está el vértice?
  alternativas:
  - V(1, -9)
  - V(-1, -9)
  - V(1, 9)
  - V(-1, 9)
  respuesta: V(1, -9)
  solucion_pasos:
  - 'Paso 1: $h = 1, k = -9 \implies V(1, -9)$.'
errores_frecuentes:
- No compensar la constante agregada fuera del paréntesis.
- Olvidar distribuir el signo negativo cuando a < 0.
- Dividir por 4 en vez de dividir por 2 al calcular el término del binomio.
afirmaciones_verdaderas:
- La completación de cuadrados permite reescribir cualquier trinomio cuadrático en su forma canónica equivalente.
- El término agregado para formar el trinomio cuadrado perfecto es siempre (b/(2a))².
al_terminar_debes_poder: '**QUÉ:** Obtener la forma canónica de una función cuadrática completando el cuadrado.


  **CÓMO:** Factorizando el coeficiente principal a, construyendo el trinomio cuadrado perfecto y compensando las constantes.


