procedimiento:
- 'Paso 1: Si $a\neq1$, factoriza $a$ de los términos con $x^2$ y $x$.'
- 'Paso 2: Dentro del paréntesis, suma y resta el cuadrado de la mitad del coeficiente
  de $x$.'
- 'Paso 3: Reescribe el trinomio cuadrado perfecto como un binomio al cuadrado.'
- 'Paso 4: Simplifica los términos constantes fuera del paréntesis para obtener $k$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en obtención de la forma canónica completando el
  cuadrado.
ejemplos:
- titulo: Completación del cuadrado con a=1
  enunciado: Escribe en forma canónica $f(x)=x^2+8x+10$.
  solucion_pasos:
  - 'Completando el cuadrado: $f(x)=(x^2+8x+16)-16+10$.'
  - $f(x)=(x+4)^2-6$.
- titulo: Completación del cuadrado con a distinto de 1
  enunciado: Escribe en forma canónica $f(x)=2x^2-8x+5$.
  solucion_pasos:
  - 'Factorizando $2$: $f(x)=2(x^2-4x)+5$.'
  - 'Completando el cuadrado dentro del paréntesis: $f(x)=2(x^2-4x+4)-8+5$.'
  - $f(x)=2(x-2)^2-3$.
- titulo: ¿Completar el cuadrado en una función cambia su gráfica?
  enunciado: ¿Completar el cuadrado en una función cambia su gráfica?
  respuesta: 'No'
  solucion_pasos:
  - Las operaciones usadas son equivalencias algebraicas que preservan exactamente
    la misma función y su gráfica.
- titulo: ¿Es necesario factorizar $a$ antes de completar el cuadrado cuando $a\neq1$?
  enunciado: ¿Es necesario factorizar $a$ antes de completar el cuadrado cuando $a\neq1$?
  respuesta: Sí
  solucion_pasos:
  - Sin factorizar $a$ primero, el término que completa el cuadrado no se calcula
    correctamente.
errores_frecuentes:
- Olvidar multiplicar por $a$ el término que se resta al completar el cuadrado, cuando
  $a\neq1$.
- Sumar el término que completa el cuadrado sin restarlo, rompiendo la equivalencia
  con la función original.
- Cometer errores al calcular el cuadrado de la mitad del coeficiente lineal.
- No simplificar completamente los términos constantes fuera del paréntesis.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  obtención de la forma canónica completando el cuadrado.
