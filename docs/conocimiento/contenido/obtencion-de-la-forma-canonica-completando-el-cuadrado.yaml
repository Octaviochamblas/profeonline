semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.COMPLETACION_CUADRADO
resumen_inicial: 'Obtención de la forma canónica completando el cuadrado: parábola,
  vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Para aprovechar las ventajas de la forma canónica cuando la función
  viene dada en forma general, es necesario transformarla mediante el mismo método
  usado para ecuaciones cuadráticas.
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2+bx+c$, se factoriza $a$ de los primeros dos términos: $f(x)=a\left(x^2+\dfrac{b}{a}x\right)+c$.
  Sumando y restando $\left(\dfrac{b}{2a}\right)^2$ dentro del paréntesis y reorganizando,
  se obtiene la forma canónica $f(x)=a\left(x+\dfrac{b}{2a}\right)^2+\left(c-\dfrac{b^2}{4a}\right)$.


  ### Desarrollo didáctico


  El procedimiento es análogo a completar el cuadrado en una ecuación, con la diferencia
  de que aquí se trabaja con una función y el resultado final conserva la constante
  $k$ en vez de igualarse a cero.


  Para $f(x)=x^2-6x+11$: factorizando (con $a=1$), se completa el cuadrado sumando
  y restando $9$: $f(x)=(x^2-6x+9)-9+11=(x-3)^2+2$.'
definiciones_clave: '- **Obtención de la forma canónica completando el cuadrado**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  obtención de la forma canónica completando el cuadrado.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando obtención de
    la forma canónica completando el cuadrado.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a obtención
    de la forma canónica completando el cuadrado.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
