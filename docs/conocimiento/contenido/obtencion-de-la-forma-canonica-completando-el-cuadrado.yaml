semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.COMPLETACION_CUADRADO
resumen_inicial: 'La completación del cuadrado es un método algebraico que transforma la forma general $ax^2 + bx + c$ a la forma canónica $a(x - h)^2 + k$ sumando y restando el cuadrado de la mitad del coeficiente lineal.'
explicacion_simple: |
  Completar el cuadrado es un truco algebraico que nos permite convertir una expresión de tres términos desorganizados en un cuadrado perfecto con la forma $(x - h)^2$. Consiste en aislar los términos con la variable $x$, calcular la mitad del coeficiente de $x$, elevar esa mitad al cuadrado, y sumarla y restarla simultáneamente para no alterar la función.
explicacion_formal: |
  ### Definición formal
  El procedimiento algebraico de **completación del cuadrado** sobre la función cuadrática mónica $f(x) = x^2 + bx + c$ se define mediante el algoritmo identitario:
  $$f(x) = \left(x^2 + bx + \left(\frac{b}{2}\right)^2\right) - \left(\frac{b}{2}\right)^2 + c = \left(x + \frac{b}{2}\right)^2 + \left(c - \frac{b^2}{4}\right)$$

  ### Desglose simbólico
  Para la función no mónica general $f(x) = ax^2 + bx + c$, con $a \neq 1$:
  1. Factorizar el coeficiente principal $a$: $f(x) = a \left[x^2 + \frac{b}{a}x\right] + c$.
  2. Completar el trinomio interno sumando y restando $\left(\frac{b}{2a}\right)^2$:
     $$f(x) = a \left[\left(x + \frac{b}{2a}\right)^2 - \left(\frac{b}{2a}\right)^2\right] + c = a\left(x + \frac{b}{2a}\right)^2 + \left(c - \frac{b^2}{4a}\right)$$
  3. Reemplazar $h = -\frac{b}{2a}$ y $k = c - \frac{b^2}{4a}$, obteniendo $f(x) = a(x - h)^2 + k$.

  ### Síntesis didáctica
  La completación del cuadrado demuestra algebraicamente el origen de las fórmulas del vértice $h = -\frac{b}{2a}$ y $k = f(h)$, justificando por qué toda curva parabólica posee una representación canónica equivalente.
definiciones_clave: |
  - **Completación del cuadrado**: Técnica algebraica para construir un trinomio cuadrado perfecto agregando y compensando el término $\left(\frac{b}{2}\right)^2$.
  - **Trinomio cuadrado perfecto**: Expresión cuadrática de tres términos de la forma $x^2 + 2dx + d^2 = (x + d)^2$.
  - **Polinomio mónico**: Expresión polinomial cuyo coeficiente principal es $a = 1$.
propiedades_relaciones: |
  - **Conservación de la igualdad funcional**: Sumar y restar exactamente la misma cantidad dentro o fuera de los corchetes garantiza que la nueva expresión sea idéntica a la original para todo $x \in \mathbb{R}$.
  - **Resolución de ecuaciones**: La completación de cuadrados es la base algebraica mediante la cual se demuestra la fórmula general resolvente de las ecuaciones cuadráticas.
ejemplo_guiado:
  enunciado: 'Transforma la función cuadrática $f(x) = x^2 - 6x + 13$ a su forma canónica $f(x) = a(x - h)^2 + k$ aplicando el método de completación de cuadrados.'
  pasos:
    - 'Paso 1: Agrupamos los términos que contienen la variable $x$: $f(x) = (x^2 - 6x) + 13$.'
    - 'Paso 2: Tomamos el coeficiente lineal $b = -6$, calculamos su mitad $\frac{-6}{2} = -3$ y elevamos al cuadrado: $(-3)^2 = 9$.'
    - 'Paso 3: Sumamos y restamos $9$ dentro de la agrupación: $f(x) = (x^2 - 6x + 9 - 9) + 13$.'
    - 'Paso 4: Factorizamos el trinomio cuadrado perfecto $(x^2 - 6x + 9) = (x - 3)^2$ y sacamos la constante $-9$: $f(x) = (x - 3)^2 - 9 + 13$.'
    - 'Paso 5: Simplificamos las constantes externas: $f(x) = (x - 3)^2 + 4$. Concluimos que la forma canónica es $f(x) = (x - 3)^2 + 4$, con vértice $V(3, 4)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al completar el cuadrado en la función cuadrática $g(x) = x^2 + 8x + 20$, ¿cuál es el trinomio cuadrado perfecto que se construye y su forma canónica resultante?'
    choices:
      - {text: 'Trinomio $(x^2 + 8x + 16)$ y forma canónica $g(x) = (x + 4)^2 + 4$', is_correct: true}
      - {text: 'Trinomio $(x^2 + 8x + 64)$ y forma canónica $g(x) = (x + 8)^2 - 44$', is_correct: false}
      - {text: 'Trinomio $(x^2 + 8x + 4)$ y forma canónica $g(x) = (x + 2)^2 + 16$', is_correct: false}
      - {text: 'Trinomio $(x^2 + 8x + 16)$ y forma canónica $g(x) = (x - 4)^2 + 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''Trinomio $(x^2 + 8x + 16)$ y forma canónica $g(x) = (x + 4)^2 + 4$''. La mitad de 8 es 4, al cuadrado es 16. Sumamos 16 y restamos 16: $(x^2 + 8x + 16) - 16 + 20 = (x + 4)^2 + 4$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué cantidad se debe sumar y restar para completar el cuadrado en la expresión $x^2 - 10x$?'
    choices:
      - {text: '$25$', is_correct: true}
      - {text: '$100$', is_correct: false}
      - {text: '$10$', is_correct: false}
      - {text: '$5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$25$''. Tomamos la mitad del coeficiente lineal $\frac{-10}{2} = -5$ y la elevamos al cuadrado: $(-5)^2 = 25$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Si el coeficiente principal $a \neq 1$, factorizar $a$ de los dos primeros términos cuadráticos.'
  - 'Paso 2: Calcular el término de completación $\left(\frac{b}{2a}\right)^2$ dividiendo por 2 el coeficiente de $x$ y elevándolo al cuadrado.'
  - 'Paso 3: Sumar y restar dicha cantidad para formar el trinomio cuadrado perfecto.'
  - 'Paso 4: Factorizar el trinomio en la forma $(x - h)^2$ y simplificar las constantes numéricas restantes para obtener $k$.'
errores_correccion: |
  - **Error 1:** Sumar la cantidad $\left(\frac{b}{2}\right)^2$ sin restarla a la vez. **Cómo corregirlo:** Si se suma una constante a una expresión sin restarla o restar su equivalente compensado, se altera la función original produciendo un modelo equivocado.
  - **Error 2:** Olvidar multiplicar por el factor principal $a$ al extraer la constante restada de los corchetes cuando $a \neq 1$. **Cómo corregirlo:** Si la constante restada está dentro de un corchete multiplicado por $a$, al sacarla debe multiplicarse por $a$.
ejemplos:
  - titulo: 'Completación de cuadrados en función mónica'
    enunciado: 'Transforma $f(x) = x^2 - 4x + 7$ a su forma canónica completando el cuadrado.'
    alternativas:
      - '$f(x) = (x - 2)^2 + 3$'
      - '$f(x) = (x - 4)^2 + 3$'
      - '$f(x) = (x - 2)^2 + 7$'
    respuesta: '$f(x) = (x - 2)^2 + 3$'
    solucion_pasos:
      - '1. Mitad de $-4$ es $-2$, al cuadrado es $4$.'
      - '2. $f(x) = (x^2 - 4x + 4) - 4 + 7$.'
      - '3. Factorizamos el trinomio: $f(x) = (x - 2)^2 + 3$.'
  - titulo: 'Completación con coeficiente a != 1'
    enunciado: '¿Cuál es la forma canónica de $g(x) = 2x^2 + 8x + 10$ por completación de cuadrados?'
    alternativas:
      - '$g(x) = 2(x + 2)^2 + 2$'
      - '$g(x) = 2(x + 4)^2 + 2$'
      - '$g(x) = (2x + 4)^2 + 2$'
    respuesta: '$g(x) = 2(x + 2)^2 + 2$'
    solucion_pasos:
      - '1. Factorizamos el 2: $g(x) = 2(x^2 + 4x) + 10$.'
      - '2. Completamos dentro del paréntesis: mitad de 4 es 2, al cuadrado es 4. $g(x) = 2(x^2 + 4x + 4 - 4) + 10$.'
      - '3. $g(x) = 2[(x + 2)^2 - 4] + 10 = 2(x + 2)^2 - 8 + 10 = 2(x + 2)^2 + 2$.'
  - titulo: 'Equivalencia de métodos'
    enunciado: '¿La forma canónica obtenida completando el cuadrado coincide con la obtenida usando $h = -\frac{b}{2a}$ y $k = f(h)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La completación de cuadrados es la deducción algebraica rigurosa de las fórmulas del vértice.'
  - titulo: 'Término de completación siempre positivo'
    enunciado: '¿El término $\left(\frac{b}{2}\right)^2$ que se suma para completar el cuadrado es siempre un número real no negativo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al elevar cualquier número real (positivo o negativo) al cuadrado, el resultado es siempre mayor o igual a cero.'
errores_frecuentes:
  - 'La cantidad que se debe sumar para completar el cuadrado en $x^2 + 6x$ es $6$.'
  - 'Al completar el cuadrado en $f(x) = 3(x^2 + 2x) - 5$, el término $+1$ que se suma adentro sale como $-1$ afuera.'
  - 'El trinomio $x^2 - 6x + 9$ se factoriza como $(x + 3)^2$.'
  - 'La completación de cuadrados no se puede realizar si el coeficiente $b$ es un número impar.'
  - 'Sumar y restar la misma constante en una expresión algebraica cambia el valor de sus ceros reales.'
afirmaciones_verdaderas:
