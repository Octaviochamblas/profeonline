procedimiento:
- 'Paso 1: Recuerda que el triángulo 30°-60°-90° tiene lados en proporción 1:√3:2.'
- 'Paso 2: Identifica que, para el ángulo de 60°, el cateto opuesto es √3 y el adyacente
  es 1 (invertidos respecto de 30°).'
- 'Paso 3: Aplica las definiciones de seno, coseno y tangente usando estas tres medidas.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con razones trigonométricas del ángulo de 60°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de razones trigonométricas del ángulo de 60° para
    determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando razones trigonométricas del ángulo de 60°.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de razones trigonométricas del ángulo
    de 60° y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de razones trigonométricas del ángulo de 60°.
- titulo: ¿Se cumple siempre la propiedad principal de razones trigonométricas del
    ángulo de 60° en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede razones trigonométricas del ángulo de 60° asumir un valor negativo
    cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en razones trigonométricas del ángulo
  de 60°.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en razones trigonométricas
  del ángulo de 60°.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en razones trigonométricas
  del ángulo de 60°.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de razones
  trigonométricas del ángulo de 60°.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
