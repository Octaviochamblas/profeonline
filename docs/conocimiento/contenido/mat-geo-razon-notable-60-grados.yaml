semantic_id: MAT.GEO.TRIG_NOTABLES.RAZONES_60_GRADOS
resumen_inicial: 'Razones trigonométricas del ángulo de 60°: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría en el Triángulo Rectángulo.'
explicacion_simple: El ángulo de 60° comparte el mismo triángulo notable que el de
  30°, pero sus razones se calculan considerando los catetos desde el otro vértice.
explicacion_formal: '![Razones trigonométricas de 60°](/static/img/geometria/trigonometria/razon-notable-60-grados.svg)


  ### Definición formal


  En el mismo triángulo 30°-60°-90° (lados $1:\sqrt3:2$), ahora considerando el ángulo
  de 60°: el cateto opuesto es $\sqrt3$ y el adyacente es 1. Por lo tanto $\sin60°=\frac{\sqrt3}{2}$,
  $\cos60°=\frac{1}{2}$, $\tan60°=\sqrt3$.


  ### Desarrollo didáctico


  Observa que $\sin60°=\cos30°$ y $\cos60°=\sin30°$: esta es la relación de complementariedad
  entre ángulos que suman 90°, aplicada a este triángulo notable.'
definiciones_clave: '- **Razones trigonométricas del ángulo de 60°**: Elemento o propiedad
  fundamental en el estudio de trigonometría en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a razones trigonométricas del ángulo de 60°.'
ejemplo_guiado:
  enunciado: En el estudio de razones trigonométricas del ángulo de 60°, un triángulo
    posee ángulos interiores de medidas $22^\circ$, $4854^\circ$ y $\gamma$. Halla
    el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de razones trigonométricas del ángulo de 60° y la suma
    de ángulos interiores.
  - 'Plantear la suma: $22^\circ + 4854^\circ + \gamma = 180^\circ \implies 4876^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4876^\circ = -4696^\circ$.
