semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_LINEAL_CONTEXTUAL
resumen_inicial: 'Modelamiento de una situación de proporcionalidad directa mediante
  función lineal: conceptos, representación y propiedades en Modelamiento lineal y
  afín.'
explicacion_simple: Cuando no hay ningún costo o valor de partida, y todo depende
  exactamente de la cantidad, el modelo correcto es la función lineal más simple.
explicacion_formal: '### Definición formal


  Si una situación cumple $y=0$ cuando $x=0$ (sin valor de partida) y la razón $y/x$
  es constante, el modelo correcto es $f(x)=mx$, donde $m$ es esa razón constante
  (la tasa de cambio).


  ### Desarrollo didáctico


  El indicador clave para descartar el término independiente es que, en el contexto,
  "cero entradas" debe producir "cero salidas".


  Si el pago por trabajo a destajo es \$2000 por cada pieza fabricada, sin sueldo
  base, el modelo es $P(x)=2000x$: fabricar cero piezas produce pago cero.'
definiciones_clave: '- **Modelamiento de una situación de proporcionalidad directa
  mediante función lineal**: Elemento central en el estudio de funciones y modelos
  algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a modelamiento de una situación de proporcionalidad
  directa mediante función lineal.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a modelamiento de
    una situación de proporcionalidad directa mediante función lineal.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a modelamiento de una situación
    de proporcionalidad directa mediante función lineal.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    modelamiento de una situación de proporcionalidad directa mediante función lineal?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en modelamiento lineal y afín
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en modelamiento lineal y afín. Es la condición
    de existencia y unicidad en modelamiento de una situación de proporcionalidad
    directa mediante función lineal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en modelamiento de una situación
    de proporcionalidad directa mediante función lineal, ¿qué procedimiento se debe
    seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
