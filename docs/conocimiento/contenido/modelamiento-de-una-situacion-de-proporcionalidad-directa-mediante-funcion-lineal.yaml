semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_LINEAL_CONTEXTUAL
resumen_inicial: El modelamiento de situaciones de proporcionalidad directa mediante una función lineal expresa relaciones donde no existe costo o valor base inicial ($b = 0$).
explicacion_simple: |
  Para construir un **modelo lineal $f(x) = mx$**:

  - Verifica que **sin entrada no haya salida** ($f(0) = 0$). Por ejemplo, comprar $0$ kilos de pan cuesta $\$0$.
  - Encuentra el costo o valor unitario constante $m$.
  - Multiplica directamente la entrada por ese valor unitario: **$\text{Total} = m \cdot x$**.
explicacion_formal: |
  Un fenómeno donde dos magnitudes $x$ e $y$ satisfacen la condición de **ausencia de valor base inicial** ($y(0) = 0$) y mantienen un cociente constante $\frac{y}{x} = k$ se modela mediante la **función lineal**:

  $$f(x) = k \cdot x \quad \text{con } k \in \mathbb{R} \setminus \{0\}$$

  **Propiedades del modelo:**
  - $f(0) = 0$: Pasa por el origen de coordenadas $(0, 0)$.
  - Proporcionalidad estricta: Si la entrada $x$ se multiplica por un factor $\alpha$, la salida $y$ se multiplica por el mismo factor $\alpha$.
definiciones_clave: |
  - **Modelo lineal contextual**: Representación algebraica $f(x) = mx$ de una situación de proporcionalidad directa pura sin constante fija agregada.
propiedades_relaciones: |
  - **Escalamiento proporcional**: $f(\alpha x) = m(\alpha x) = \alpha (mx) = \alpha f(x)$ para todo escalar $\alpha$.
ejemplo_guiado:
  enunciado: 'El kilo de pan cuesta $\$1.600$. Construye la función $P(k)$ que modela el precio a pagar según los kilogramos $k$ comprados y calcula el valor por $3{,}5$ kg.'
  pasos:
    - 'Paso 1: Verificar el valor inicial: $0$ kg de pan cuestan $\$0 \implies b = 0$.'
    - 'Paso 2: Identificar la constante de proporcionalidad unitaria: $m = 1.600$ pesos/kg.'
    - 'Paso 3: Construir la función lineal: $P(k) = 1.600k$.'
    - 'Paso 4: Evaluar para $k = 3{,}5$: $P(3{,}5) = 1.600 \cdot 3{,}5 = 5.600$ pesos.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si el kilo de pan cuesta $1.600, ¿cuál es la función de precio $P(k)$ y cuánto cuestan 3,5 kg?'
    choices:
      - {text: '$P(k) = 1.600k$ y 3,5 kg cuestan $5.600', is_correct: true}
      - {text: '$P(k) = 1.600 + k$ y 3,5 kg cuestan $1.603,5', is_correct: false}
      - {text: '$P(k) = 5.600k$ y 3,5 kg cuestan $19.600', is_correct: false}
      - {text: '$P(k) = 1.600k + 500$ y 3,5 kg cuestan $6.100', is_correct: false}
    explanation: 'La alternativa correcta es ''$P(k) = 1.600k$ y 3,5 kg cuestan $5.600''. $P(3{,}5) = 1.600 \cdot 3{,}5 = 5.600$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué característica de una situación aplicada indica que debe modelarse con una función lineal en vez de afín?'
    choices:
      - {text: 'Que cuando la variable de entrada es cero, la variable de salida también es cero.', is_correct: true}
      - {text: 'Que exista un cargo fijo inicial por contratar el servicio.', is_correct: false}
      - {text: 'Que la gráfica sea una recta paralela al eje Y.', is_correct: false}
      - {text: 'Que la pendiente sea un número negativo.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que cuando la variable de entrada es cero, la variable de salida también es cero.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Comprobar que en $x = 0$ el valor resultado sea $0$ (ausencia de cargo fijo).'
  - 'Paso 2: Extraer la constante de proporcionalidad o precio unitario $m$.'
  - 'Paso 3: Plantear la expresión lineal directa $f(x) = mx$.'
  - 'Paso 4: Evaluar la función para proyectar resultados deseados.'
errores_correccion: |
  - **Error común:** Agregar un término independiente constante ficticio $b$ en problemas donde no existe cargo inicial.
  - **Cómo corregirlo:** Si comprar $0$ unidades tiene costo $\$0$, la constante de posición es estrictamente **$b = 0$**, resultando en una función **LINEAL**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
