    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que no exista un valor o costo inicial en el contexto (cero entradas
  produce cero salidas).'
- 'Paso 2: Identifica la tasa de cambio constante del contexto.'
- 'Paso 3: Construye el modelo $f(x)=mx$ usando esa tasa como pendiente.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar modelamiento de una situación de proporcionalidad directa mediante función
  lineal.
ejemplos:
- titulo: Modelamiento de pago por pieza
  enunciado: Un trabajador gana \$1500 por cada pieza fabricada, sin sueldo base.
    Modela su pago $P$ en función de las piezas $x$.
  solucion_pasos:
  - No hay sueldo base, así que cero piezas producen cero pago.
  - $P(x) = 1500x$.
- titulo: Modelamiento de compra a granel
  enunciado: El kilo de naranjas cuesta \$800, sin cargo adicional. Modela el costo
    $C$ según los kilos $x$ comprados.
  solucion_pasos:
  - No hay cargo fijo por comprar.
  - $C(x) = 800x$.
- titulo: ¿Un modelo con sueldo base fijo se representa con función lineal pura?
  enunciado: ¿Un modelo con sueldo base fijo se representa con función lineal pura?
  respuesta: 'No'
  solucion_pasos:
  - Un sueldo base introduce un término independiente, transformando el modelo en
    afín, no lineal.
- titulo: ¿En un modelo lineal, cero unidades siempre producen cero resultado?
  enunciado: ¿En un modelo lineal, cero unidades siempre producen cero resultado?
  respuesta: Sí
  solucion_pasos:
  - Esa es la característica definitoria de la función lineal, $f(0)=0$.
errores_frecuentes:
- Agregar un término independiente cuando el contexto no lo justifica.
- No verificar la condición "cero entradas, cero salidas" antes de elegir el modelo
  lineal.
- Confundir la tasa de cambio con un valor inicial existente.
- Aplicar el modelo lineal a contextos que sí tienen cargo fijo.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando modelamiento
  de una situación de proporcionalidad directa mediante función lineal.
