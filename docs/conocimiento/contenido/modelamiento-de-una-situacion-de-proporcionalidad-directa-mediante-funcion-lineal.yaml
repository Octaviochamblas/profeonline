  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En un modelo de proporcionalidad directa $f(x) = mx$, comprar 0 unidades exige pagar el valor constante de la pendiente $m$.'
  - 'Una función lineal contextualizada presenta un punto de corte con el eje vertical $Y$ en la coordenada $(0, m)$.'
  - 'Si una situación de proporcionalidad directa se duplica en la entrada $x$, la salida $y$ se reduce a la mitad.'
  - 'Modelar un consumo de electricidad sin cargo fijo requiere emplear una función afín con coeficiente de posición $b = 100$.'
  - 'La gráfica de un problema de proporcionalidad directa no puede cruzar el origen de coordenadas $(0, 0)$.'
afirmaciones_verdaderas:
  - 'Una situación contextual de proporcionalidad directa pura se representa algebraicamente mediante una función lineal $f(x) = mx$, donde $f(0) = 0$.'
  - 'En este modelo, la pendiente $m = \frac{y}{x}$ equivale a la constante de proporcionalidad o tasa unitaria del problema.'
al_terminar_debes_poder: |
  QUÉ: Modelar situaciones contextuales de proporcionalidad directa mediante funciones lineales.
  CÓMO: Comprobar la ausencia de valor base ($f(0) = 0$), hallar la constante unitaria $m$ y escribir $f(x) = mx$.
