semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_LINEAL_CONTEXTUAL
resumen_inicial: Modelar una situación de proporcionalidad directa mediante una función lineal consiste en expresar la magnitud total como $f(x) = mx$ sin costo o valor base inicial.
explicacion_simple: '![Modelar una situación de proporcionalidad directa mediante una función lineal consiste en expresar la magnitud total como $f(x) = mx$ sin costo o valor base inicial](/static/img/nodos/modelamiento-de-una-situacion-de-proporcionalidad-directa-mediante-funcion-lineal-intro.svg)



  Cuando pagas o consumes algo donde **no hay cargos fijos** (si compras cero, pagas cero):

  - El costo total es simplemente el precio de cada unidad multiplicado por cuántas compraste: $C(x) = p \cdot x$.

  - Si compras el doble, pagas el doble.


  Esta situación se modela con una **función lineal** $f(x) = mx$, cuya gráfica pasa exactamente por el origen $(0, 0)$.'
explicacion_formal: 'Una situación contextual de **proporcionalidad directa** entre una variable independiente $x$ y una dependiente $y$ se formula matemáticamente mediante:

  $$y = f(x) = mx, \quad m > 0 \quad (\text{o } m \in \mathbb{R} \setminus \{0\})$$


  **Condiciones del modelo lineal contextual:**

  - **Origen forzado**: $f(0) = 0$ (a consumo nulo corresponde costo/efecto nulo).

  - **Pendiente como precio/rendimiento unitario**: $m = \frac{y}{x} = \text{constante}$.

  - **Restricción de dominio físico**: Habitualmente $\text{Dom}(f) = [0, +\infty[$ o $\mathbb{N}_0$ según la naturaleza de la magnitud.'
definiciones_clave: '- **Modelo lineal contextual**: Ecuación $f(x) = mx$ que describe fenómenos de proporcionalidad sin valores residuales.

  - **Precio unitario / Rendimiento**: Coeficiente multiplicador $m$ que determina la razón de escala.'
propiedades_relaciones: '- **Escalabilidad directa**: Multiplicar la entrada por un factor $c$ multiplica la salida por el mismo factor $c$ ($f(cx) = c f(x)$).

  - **Ausencia de intercepto**: $n = 0$, diferenciándose de los modelos afines con cargo fijo.'
ejemplo_guiado:
  enunciado: '![Ejemplo Modelar una situación de proporcionalidad directa mediante una función lineal consiste en expresar la magnitud total como $f(x) = mx$ sin costo o valor base inicial](/static/img/nodos/modelamiento-de-una-situacion-de-proporcionalidad-directa-mediante-funcion-lineal-ejemplos.svg)



    En una feria libre, el kilogramo de frutillas cuesta $\$2.400$. Si no hay cobro de entrada ni bolsas, escribe la función del costo $C(x)$ para $x\text{ kg}$ y calcula el precio a pagar por $3.5\text{ kg}$.'
  pasos:
  - 'Paso 1: Identificar las variables: $x = \text{kilogramos de frutillas}$, $C(x) = \text{costo total en pesos}$.'
  - 'Paso 2: Identificar la tasa unitaria: $m = \$2.400/\text{kg}$.'
  - 'Paso 3: Verificar que para $x = 0$ el costo es $C(0) = 0$ (modelo lineal sin cargo fijo).'
  - 'Paso 4: Escribir la función lineal: $C(x) = 2.400x$.'
  - 'Paso 5: Evaluar en $x = 3.5$: $C(3.5) = 2.400 \cdot 3.5 = \$8.400$.'
checkpoints:
- placement: after_explicacion_formal
  question: Un ciclista viaja a velocidad constante de $18\text{ km/h}$. ¿Qué función modela la distancia $d(t)$ recorrida en $t$ horas?
  choices:
  - text: d(t) = 18t
    is_correct: true
  - text: d(t) = 18 + t
    is_correct: false
  - text: d(t) = t/18
    is_correct: false
  - text: d(t) = 18t + 10
    is_correct: false
  explanation: La alternativa correcta es 'd(t) = 18t'. Es un modelo lineal directo donde la velocidad es la pendiente $m = 18$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $5\text{ metros}$ de tela cuestan $\$15.000$, ¿cuál es la función del costo $C(x)$ por $x$ metros?
  choices:
  - text: C(x) = 3000x
    is_correct: true
  - text: C(x) = 15000x
    is_correct: false
  - text: C(x) = 5x + 3000
    is_correct: false
  - text: C(x) = 3000 + x
    is_correct: false
  explanation: La alternativa correcta es 'C(x) = 3000x'. El precio unitario es $m = \frac{15000}{5} = 3000$, luego $C(x) = 3000x$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable independiente $x$ y la variable dependiente $y$.'
- 'Paso 2: Calcular el valor o precio unitario $m = \frac{y}{x}$.'
- 'Paso 3: Formular la función lineal $f(x) = mx$.'
- 'Paso 4: Definir el dominio contextual admisible (generalmente $x \ge 0$).'
- 'Paso 5: Evaluar o predecir resultados sustituyendo valores en la fórmula.'
errores_correccion: '- **Error común:** Agregar un término sumando cuando el problema no indica ningún costo base o inicial.

  - **Cómo corregirlo:** Si no hay cobro de base o condición inicial preexistente, el modelo debe ser estrictamente lineal ($n = 0$).'
ejemplos:
- titulo: 'Ejemplo 1: Conversión de moneda'
  enunciado: Si $1\text{ dólar}$ equivale a $\$950\text{ pesos chilenos}$, ¿qué función convierte $x$ dólares a pesos?
  alternativas:
  - P(x) = 950x
  - P(x) = x/950
  - P(x) = 950 + x
  - P(x) = 950x + 1
  respuesta: P(x) = 950x
  solucion_pasos:
  - 'Paso 1: Cada dólar multiplica por $950$: $P(x) = 950x$.'
- titulo: 'Ejemplo 2: Rendimiento de combustible'
  enunciado: Un automóvil rinde $14\text{ km por litro}$. ¿Qué función modela los kilómetros $K(L)$ según los litros $L$?
  alternativas:
  - K(L) = 14L
  - K(L) = L/14
  - K(L) = 14 + L
  - K(L) = 14L + 10
  respuesta: K(L) = 14L
  solucion_pasos:
  - 'Paso 1: Con $L$ litros recorre $14L\text{ km}$: $K(L) = 14L$.'
- titulo: 'Ejemplo 3: Producción en fábrica'
  enunciado: Una máquina envasa $120\text{ botellas por hora}$. ¿Cuántas botellas envasa en $7.5\text{ horas}$?
  alternativas:
  - 900 botellas
  - 840 botellas
  - 960 botellas
  - 750 botellas
  respuesta: 900 botellas
  solucion_pasos:
  - 'Paso 1: $B(t) = 120t \implies B(7.5) = 120(7.5) = 900$ botellas.'
- titulo: 'Ejemplo 4: Cálculo inverso'
  enunciado: Si $C(x) = 450x$ es el costo de fotocopias, ¿cuántas fotocopias se hicieron si se pagó $\$3.600$?
  alternativas:
  - 8 fotocopias
  - 10 fotocopias
  - 6 fotocopias
  - 12 fotocopias
  respuesta: 8 fotocopias
  solucion_pasos:
  - 'Paso 1: $450x = 3600 \implies x = \frac{3600}{450} = 8$ fotocopias.'
errores_frecuentes:
- Sumar una constante arbitraria no mencionada en el enunciado.
- Invertir la constante de proporcionalidad.
- 'Evaluar con unidades no compatibles (ej: mezclar minutos con horas).'
afirmaciones_verdaderas:
- Una relación de proporcionalidad directa pura se modela mediante la función lineal f(x) = mx con n = 0.
- En un modelo lineal de proporcionalidad directa, a entrada nula corresponde salida nula.
al_terminar_debes_poder: '**QUÉ:** Modelar y resolver problemas contextuales de proporcionalidad directa mediante funciones lineales.


  **CÓMO:** Determinando la tasa unitaria m = y/x y construyendo la regla algebraica f(x) = mx para realizar cálculos directos e inversos.


