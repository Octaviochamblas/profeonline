semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_LINEAL_CONTEXTUAL
resumen_inicial: Una situación de proporcionalidad directa sin valor inicial fijo
  se modela mediante una función lineal $f(x) = m x$.
explicacion_simple: 'Cuando en un problema no hay un cobro base ni un valor inicial
  ($n = 0$), el costo o resultado depende exclusivamente de la cantidad consumida
  o comprada.

  Por ejemplo, si el kilo de pan cuesta $\$1.600$:

  - $0\text{ kg}$ cuesta $\$0$.

  - $1\text{ kg}$ cuesta $\$1.600$.

  - $x\text{ kg}$ cuesta $C(x) = 1.600x$.

  Como pasa por el origen $(0,0)$, es una **función lineal** pura.'
explicacion_formal: 'Un contexto de variación proporcional pura sin costo fijo responde
  al **modelo lineal**:


  $$f(x) = k \cdot x \quad (\text{con } k = m > 0)$$


  **Desglose de la fórmula:**

  - $f(0) = 0$: Condición de proporcionalidad directa donde a entrada nula le corresponde
  salida nula.

  - $k$: Constante unitaria de proporcionalidad que actúa como pendiente de la recta.'
definiciones_clave: '- **Modelo lineal contextual**: Ecuación $f(x) = m x$ aplicada
  a problemas reales de tarifa o producción estrictamente proporcionales.'
propiedades_relaciones: '- **Escalamiento proporcional**: Duplicar la entrada $x$
  duplica automáticamente la salida $f(x)$.'
ejemplo_guiado:
  enunciado: Un automóvil consume combustible a razón de $12\text{ km/L}$. Escribe
    la función lineal $d(L)$ que expresa la distancia recorrida en kilómetros según
    los litros $L$ consumidos.
  pasos:
  - 'Paso 1: Identificar las variables: $L$ (litros consumidos) y $d$ (distancia en
    km).Paso 2: Determinar la tasa constante por litro: $12\text{ km/L} \implies m
    = 12$.Paso 3: Notar que con $0\text{ L}$ recorre $0\text{ km} \implies n = 0$.Paso
    4: Escribir la función lineal: $d(L) = 12L$.Paso 5: Concluir que para $5\text{
    L}$ el automóvil recorre $d(5) = 12(5) = 60\text{ km}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En el modelo de consumo $d(L) = 12L$, ¿cuántos kilómetros recorre el automóvil
    con $5\text{ litros}$ de combustible?
  choices:
  - text: $60\text{ km}$
    is_correct: true
  - text: $17\text{ km}$
    is_correct: false
  - text: $120\text{ km}$
    is_correct: false
  - text: $2.4\text{ km}$
    is_correct: false
  explanation: La alternativa correcta es '$60\text{ km}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la situación del consumo de combustible sin carga inicial se
    modela como función lineal y no afín?
  choices:
  - text: Porque no existe un recorrido base; con 0 litros la distancia recorrida
      es 0 km ($n = 0$).
    is_correct: true
  - text: Porque el automóvil viaja en línea recta.
    is_correct: false
  - text: Porque el combustible es líquido.
    is_correct: false
  - text: Porque la pendiente es negativa.
    is_correct: false
  explanation: La alternativa correcta es 'Porque no existe un recorrido base; con
    0 litros la distancia recorrida es 0 km ($n = 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que al valor $x = 0$ le corresponde el valor $y = 0$.'
- 'Paso 2: Identificar el costo o tasa por unidad $m$.'
- 'Paso 3: Formular la función lineal $f(x) = m x$.'
errores_correccion: '- **Error común:** Agregar un cargo fijo en problemas que son
  estrictamente proporcionales.

  - **Cómo corregirlo:** Si no hay costo o valor de inicio declarado, el intercepto
  es $n = 0$ y la función es puramente lineal.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
