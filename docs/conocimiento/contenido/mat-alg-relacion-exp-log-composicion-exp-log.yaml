semantic_id: MAT.ALG.RELACION_EXP_LOG.COMPOSICION_EXP_LOG
resumen_inicial: 'Aplicación de la composición log_b(b^x) para recuperar x: conceptos,
  asíntotas, propiedades e inversidad en Relación de funciones inversas.'
explicacion_simple: Cuando la base de una potencia coincide con la base del logaritmo
  que tiene en el exponente, ambas operaciones se cancelan directamente.
explicacion_formal: '### Definición formal


  Si $f(x)=\log_b(x)$ y $g(x)=b^x$ son funciones inversas, entonces $g(f(x))=x$ para
  todo $x>0$. Esto se escribe como $b^{\log_b(x)}=x$, válido para cualquier $x$ en
  el dominio del logaritmo.


  ### Desarrollo didáctico


  $3^{\log_3(7)}=7$: el exponente $\log_3(7)$ es exactamente el valor al que hay que
  elevar $3$ para obtener $7$, así que al elevarlo se recupera $7$ directamente, sin
  necesidad de calcular el logaritmo numéricamente.'
definiciones_clave: '- **Aplicación de la composición log_b(b^x) para recuperar x**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a aplicación de la composición log_b(b^x) para recuperar x.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de aplicación
    de la composición log_b(b^x) para recuperar x.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de aplicación de la composición
    log_b(b^x) para recuperar x.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    aplicación de la composición log_b(b^x) para recuperar x?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en relación de funciones
      inversas
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en relación de funciones inversas. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en aplicación de la composición log_b(b^x) para recuperar x?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la base de la potencia y la base del logaritmo del exponente
  sean iguales.'
- 'Paso 2: Si coinciden, el resultado es directamente el argumento del logaritmo.'
- 'Paso 3: Si no coinciden, no se puede aplicar esta simplificación directa.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en aplicación
  de la composición log_b(b^x) para recuperar x.
ejemplos:
- titulo: Aplicación directa con bases iguales
  enunciado: Simplifica $5^{\log_5(12)}$.
  solucion_pasos:
  - Se verifica que ambas bases coinciden ($5$).
  - 'El resultado es directamente el argumento del logaritmo: $12$.'
- titulo: Aplicación en una expresión algebraica
  enunciado: Simplifica $2^{\log_2(x+1)}$ para $x>-1$.
  solucion_pasos:
  - Se verifica que ambas bases coinciden ($2$).
  - 'El resultado es directamente el argumento: $x+1$.'
- titulo: ¿Se cumple $b^{\log_b(x)}=x$ para cualquier $x>0$?
  enunciado: ¿La propiedad $b^{\log_b(x)}=x$ es válida para cualquier valor de $x$
    dentro del dominio del logaritmo?
  respuesta: Sí
  solucion_pasos:
  - Se cumple para todo $x>0$, siempre que $b>0$ y $b\neq1$.
- titulo: ¿Se puede simplificar $4^{\log_2(x)}$ usando esta propiedad directamente?
  enunciado: ¿Es posible aplicar $b^{\log_b(x)}=x$ directamente a $4^{\log_2(x)}$?
  respuesta: 'No'
  solucion_pasos:
  - Las bases no coinciden ($4$ y $2$), así que la simplificación directa no aplica
    sin transformar antes la expresión.
errores_frecuentes:
- Aplicar la propiedad cuando la base de la potencia y del logaritmo no son iguales.
- Declarar $b^{\log_b(x)}=x$ con $\log_b(b^x)=x$, que tiene las operaciones en orden
  inverso.
- Omitir que $x$ debe ser positivo para que el logaritmo esté definido.
- No verificar que la base cumpla $b>0$, $b\neq1$ antes de simplificar.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando aplicación de la composición log_b(b^x) para recuperar x.
