semantic_id: MAT.ALG.RELACION_EXP_LOG.COMPOSICION_EXP_LOG
resumen_inicial: 'La composición del logaritmo con la potencia de su misma base cancela la operación de potenciación recuperando la variable original: $\log_b(b^x) = x$.'
explicacion_simple: |
  Cuando aplicamos un logaritmo a una potencia que tiene exactamente su misma base, como en $\log_3(3^x)$, el logaritmo en base 3 y la base 3 se anulan mutuamente porque son operaciones inversas. Es exactamente igual a cuando le sumamos y le restamos el mismo número a algo: volvemos al valor inicial. Por lo tanto, $\log_b(b^x)$ es igual a $x$.
explicacion_formal: |
  ### Definición formal
  Para una base $b \in \mathbb{R}^+ \setminus \{1\}$, la **propiedad de composición cancelatoria a izquierda** de la función logarítmica $g(x) = \log_b(x)$ sobre la función exponencial $f(x) = b^x$ establece la identidad funcional:
  $$(g \circ f)(x) = g(f(x)) = \log_b(b^x) = x, \quad \forall x \in \mathbb{R}$$

  ### Desglose simbólico
  - Campo de validez universal: Válido para **todo número real $x \in \mathbb{R}$** (positivo, cero o negativo), ya que el exponente $x$ no tiene restricciones de dominio en $b^x$.
  - Casos particulares canónicos:
    - Base decimal: $\log_{10}(10^x) = \log(10^x) = x$.
    - Base natural: $\log_e(e^x) = \ln(e^x) = x$.
  - Aplicación en resolución de ecuaciones: Aplicar $\log_b$ a ambos lados de $b^{P(x)} = K \implies \log_b(b^{P(x)}) = \log_b(K) \implies P(x) = \log_b(K)$.

  ### Síntesis didáctica
  Mecanismo de "liberación de exponentes": Para liberar una variable o expresión $P(x)$ que se encuentra atrapada en el exponente de una base $b$, se debe aplicar el logaritmo de esa misma base $\log_b$ a todo el miembro.
definiciones_clave: |
  - **Composición $(g \circ f)(x) = \log_b(b^x)$**: Evaluación de la función logarítmica en la salida de la función exponencial.
  - **Cancelación composicional**: Anulación de los operadores $b$ y $\log_b$ por ser funciones inversas de igual base.
  - **Recuperación del argumento $x$**: Obtención directa del exponente original sin alteración.
propiedades_relaciones: |
  - **Identidad en todo $\mathbb{R}$**: A diferencia de la composición inversa $b^{\log_b(x)}$ que requiere $x > 0$, la composición $\log_b(b^x) = x$ es válida para todo $x \in \mathbb{R}$.
  - **Herramienta de despeje en ecuaciones**: Constituye el paso estándar para resolver ecuaciones del tipo $a^{g(x)} = c$.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad de composición $\log_b(b^x) = x$ para simplificar las siguientes expresiones y despejar la incógnita en cada caso: A) $\log_2(2^{3x - 5})$, B) $\ln(e^{x^2 + 1})$, C) Despeja $t$ en $10^{2t} = 500$.'
  pasos:
    - 'Paso 1: Para $\log_2(2^{3x - 5})$, los operadores $\log_2$ y base $2$ se cancelan por composición, resultando $3x - 5$.'
    - 'Paso 2: Para $\ln(e^{x^2 + 1})$, los operadores $\ln$ y base $e$ se cancelan por composición, resultando $x^2 + 1$.'
    - 'Paso 3: Para despejar $t$ en $10^{2t} = 500$, aplicamos el logaritmo decimal a ambos miembros: $\log(10^{2t}) = \log(500)$.'
    - 'Paso 4: Por composición $\log(10^{2t}) = 2t$. Obtenemos $2t = \log(500) \implies t = \frac{\log(500)}{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el resultado de simplificar la expresión compuesta $\ln(e^{-8})$ aplicando la propiedad de funciones inversas?'
    choices:
      - {text: '$-8$, porque la función logarítmica natural $\ln$ y la función exponencial $e$ se cancelan mutuamente', is_correct: true}
      - {text: '$e^{-8}$, conservando la base exponencial', is_correct: false}
      - {text: '$0$, porque el exponente es negativo', is_correct: false}
      - {text: '$1$, porque el argumento es una potencia', is_correct: false}
    explanation: 'La alternativa correcta es ''$-8$, porque la función logarítmica natural $\ln$ y la función exponencial $e$ se cancelan mutuamente''. Por composición de funciones inversas, $\ln(e^x) = x$ para todo $x \in \mathbb{R}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación exponencial $5^{4x} = 81$ aplicando logaritmos en base 5 a ambos lados, ¿cuál es la ecuación simplificada resultante?'
    choices:
      - {text: '$4x = \log_5(81)$', is_correct: true}
      - {text: '$5x = \log_4(81)$', is_correct: false}
      - {text: '$4x = 81$', is_correct: false}
      - {text: '$x = 5 \cdot 81$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4x = \log_5(81)$''. Aplicando $\log_5$ a la izquierda, $\log_5(5^{4x}) = 4x$, lo que libera el exponente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la estructura compuesta $\log_b(b^{P(x)})$.'
  - 'Paso 2: Confirmar que la base de la potencia coincide exactamente con la base del logaritmo.'
  - 'Paso 3: Cancelar simultáneamente el logaritmo $\log_b$ y la base $b$.'
  - 'Paso 4: Escribir la expresión del exponente $P(x)$ como el resultado directo simplificado.'
errores_correccion: |
  - **Error 1:** Creer que la composición $\log_b(b^x) = x$ requiere que $x$ sea positivo. **Cómo corregirlo:** El exponente de $b^x$ puede ser cualquier número real $x \in \mathbb{R}$. Por ejemplo, $\log_2(2^{-5}) = -5$, lo cual es totalmente válido.
  - **Error 2:** Cancelar las bases cuando no son iguales (ej: en $\log_3(2^x)$ escribir $x$). **Cómo corregirlo:** La cancelación composicional exige estrictamente que la base de la potencia y la base del logaritmo sean idénticas. Si son distintas, se debe usar la propiedad de la potencia $\log_3(2^x) = x \cdot \log_3(2)$.
ejemplos:
  - titulo: 'Composición con exponente lineal'
    enunciado: '¿A qué equivale $\log_4(4^{2x + 7})$?'
    alternativas:
      - '$2x + 7$'
      - '$4^{2x}$'
      - '$8x + 28$'
    respuesta: '$2x + 7$'
    solucion_pasos:
      - '1. La base del logaritmo 4 y la base de la potencia 4 son iguales.'
      - '2. Por composición cancelatoria: $\log_4(4^{2x + 7}) = 2x + 7$.'
  - titulo: 'Despeje de exponente en base e'
    enunciado: 'Si $e^x = 15$, ¿aplicar $\ln$ a ambos lados entrega $x = \ln(15)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\ln(e^x) = \ln(15) \implies x = \ln(15)$.'
  - titulo: 'Composición con exponente negativo'
    enunciado: '¿La expresión $\log_5(5^{-3})$ es igual a $-3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\log_5(5^{-3}) = -3$ para todo número real en el exponente.'
  - titulo: 'Composición con exponente cuadrático'
    enunciado: '¿La simplificación de $\log(10^{x^2 - 4})$ resulta en $x^2 - 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como la base es 10, $\log_{10}(10^{x^2 - 4}) = x^2 - 4$.'
errores_frecuentes:
  - 'La composición $\log_b(b^x)$ la afirmación de que es igual a 1 para todo $x$.'
  - 'La afirmación de que no es posible evaluar $\ln(e^x)$ si el exponente $x$ es un número negativo.'
  - 'La afirmación de que la expresión $\log_2(3^x)$ se simplifica directamente como $x$ cancelando las bases distintas.'
  - 'La afirmación de que al aplicar $\log(10^x)$ resulta en el producto $10 \cdot x$.'
  - 'La afirmación de que la propiedad de composición $\log_b(b^x) = x$ solo aplica si $x$ es un entero positivo.'
afirmaciones_verdaderas:
  - 'La composición $\log_b(b^x) = x$ cancela la función exponencial mediante la función logarítmica de igual base para todo $x \in \mathbb{R}$.'
  - 'Esta propiedad cancelatoria es la herramienta algebraica principal para despejar incógnitas ubicadas en el exponente de una ecuación.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la propiedad de composición $\log_b(b^x) = x$ para simplificar expresiones exponenciales.
  CÓMO: Cancelar la base exponencial $b$ con el logaritmo de igual base para extraer directamente la variable o valor $x \in \mathbb{R}$.
