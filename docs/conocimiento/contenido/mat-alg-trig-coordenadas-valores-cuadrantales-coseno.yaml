semantic_id: MAT.ALG.TRIG_COORDENADAS.VALORES_CUADRANTALES_COSENO
resumen_inicial: 'Determinación de valores de coseno en ángulos cuadrantales: círculo
  unitario, amplitud, período y transformaciones de Seno y coseno en el círculo unitario.'
explicacion_simple: Los ángulos cuadrantales tienen puntos asociados muy simples,
  lo que permite obtener sus valores de coseno sin cálculos complejos.
explicacion_formal: '### Definición formal


  Como $\cos(\theta)$ es la coordenada $x$ del punto asociado, y los puntos cuadrantales
  son $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$ para $0°$, $90°$, $180°$ y $270°$ respectivamente,
  se obtienen directamente los valores $1$, $0$, $-1$ y $0$.


  ### Desarrollo didáctico


  Para recordar estos valores, basta con visualizar el punto correspondiente en el
  círculo unitario y leer su coordenada $x$: en $90°$ y $270°$, el punto está sobre
  el eje $y$, así que su coordenada $x$ es siempre $0$.'
definiciones_clave: '- **Determinación de valores de coseno en ángulos cuadrantales**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación de valores de coseno en ángulos cuadrantales.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación de valores de coseno en ángulos cuadrantales.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación de valores de coseno en ángulos cuadrantales.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
