semantic_id: MAT.ALG.TRIG_COORDENADAS.VALORES_CUADRANTALES_COSENO
resumen_inicial: 'Determinación de los valores del coseno en los ángulos cuadrantales $0^\circ, 90^\circ, 180^\circ, 270^\circ$ y $360^\circ$.'
explicacion_simple: |
  Los ángulos cuadrantales son los que caen justo sobre las líneas de los ejes cartesiano. Para hallar el coseno de estos ángulos, solo debemos mirar la coordenada horizontal $x$ de sus puntos de intersección con el círculo unitario:
  - En $0^\circ$ (punto $(1,0)$): el coseno vale $1$.
  - En $90^\circ$ (punto $(0,1)$): el coseno vale $0$.
  - En $180^\circ$ (punto $(-1,0)$): el coseno vale $-1$.
  - En $270^\circ$ (punto $(0,-1)$): el coseno vale $0$.
  - En $360^\circ$ (punto $(1,0)$): vuelve a valer $1$.
explicacion_formal: |
  ### Definición formal
  Los **valores del coseno en ángulos cuadrantales** $\theta = k \cdot 90^\circ = k \cdot \frac{\pi}{2}$ ($k \in \mathbb{Z}$) se obtienen evaluando la abscisa $x$ en los puntos axiales del círculo unitario:
  $$\cos\left(k \cdot \frac{\pi}{2}\right) = \begin{cases} 1 & \text{si } k \equiv 0 \pmod 4 \\ 0 & \text{si } k \equiv 1, 3 \pmod 4 \\ -1 & \text{si } k \equiv 2 \pmod 4 \end{cases}$$

  ### Desglose simbólico
  - $\cos(0) = \cos(0^\circ) = 1$: Abscisa del punto $(1,0)$.
  - $\cos\left(\frac{\pi}{2}\right) = \cos(90^\circ) = 0$: Abscisa del punto $(0,1)$.
  - $\cos(\pi) = \cos(180^\circ) = -1$: Abscisa del punto $(-1,0)$.
  - $\cos\left(\frac{3\pi}{2}\right) = \cos(270^\circ) = 0$: Abscisa del punto $(0,-1)$.

  ### Síntesis didáctica
  El coseno se anula ($0$) en los ejes verticales (múltiplos impares de $90^\circ$ o $\frac{\pi}{2}$) y alcanza sus valores extremos ($\pm 1$) en los ejes horizontales (múltiplos enteros de $180^\circ$ o $\pi$).
definiciones_clave: |
  - **Coseno cuadrantal**: Valor de la coordenada $x$ para ángulos que se detienen sobre los ejes coordenados.
  - **Ceros del coseno**: Ángulos de la forma $90^\circ + k \cdot 180^\circ$ (o $\frac{\pi}{2} + k\pi$) donde la abscisa es nula.
  - **Extremos del coseno**: Ángulos de la forma $k \cdot 180^\circ$ ($k\pi$) donde el coseno alcanza sus límites $1$ o $-1$.
propiedades_relaciones: |
  - **Periodicidad de ceros**: El coseno es cero cada $\pi$ radianes partiendo desde $\frac{\pi}{2}$ ($\dots, -\frac{\pi}{2}, \frac{\pi}{2}, \frac{3\pi}{2}, \dots$).
  - **Alternancia de extremos**: El coseno alterna entre $1$ y $-1$ en los múltiplos enteros de $\pi$: $\cos(0) = 1$, $\cos(\pi) = -1$, $\cos(2\pi) = 1$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto de $\cos(450^\circ)$ reduciéndolo a un ángulo cuadrantal básico del primer giro.'
  pasos:
    - 'Paso 1: Restar un giro completo para hallar el ángulo coterminal en $[0^\circ, 360^\circ[$: $450^\circ - 360^\circ = 90^\circ$.'
    - 'Paso 2: Identificar el punto de intersección del ángulo $90^\circ$ con el círculo unitario: $(0, 1)$.'
    - 'Paso 3: Extraer la abscisa cartesiana $x$: $x = 0$.'
    - 'Paso 4: Concluir que $\cos(450^\circ) = \cos(90^\circ) = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuáles de los siguientes ángulos cuadrantales el coseno vale cero?'
    choices:
      - {text: '$90^\circ$ y $270^\circ$ ($\frac{\pi}{2}$ y $\frac{3\pi}{2}$ rad)', is_correct: true}
      - {text: '$0^\circ$ y $180^\circ$ ($0$ y $\pi$ rad)', is_correct: false}
      - {text: '$0^\circ$ y $360^\circ$ ($0$ y $2\pi$ rad)', is_correct: false}
      - {text: '$180^\circ$ y $360^\circ$ ($\pi$ y $2\pi$ rad)', is_correct: false}
    explanation: 'La alternativa correcta es ''$90^\circ$ y $270^\circ$ ($\frac{\pi}{2}$ y $\frac{3\pi}{2}$ rad)''. En el eje Y, las abscisas valen cero ($x = 0$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor exacto de $\cos(\pi)$ o $\cos(180^\circ)$?'
    choices:
      - {text: '$-1$', is_correct: true}
      - {text: '$1$', is_correct: false}
      - {text: '$0$', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$''. En el punto $(-1, 0)$ sobre el semieje $-X$, la abscisa es $x = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si el ángulo es un cuadrantal de la forma $k \cdot 90^\circ$ ($k \cdot \frac{\pi}{2}$).'
  - 'Paso 2: Ubicar la intersección cartesiana sobre el círculo unitario: $(1,0)$, $(0,1)$, $(-1,0)$ o $(0,-1)$.'
  - 'Paso 3: Tomar la coordenada horizontal $x$ de ese punto.'
  - 'Paso 4: Asignar el valor $1$, $0$ o $-1$ como el coseno del ángulo.'
errores_correccion: |
  - **Error 1:** Confundir el valor del coseno en $90^\circ$ asignándole $1$ en lugar de $0$. **Cómo corregirlo:** En $90^\circ$ el punto es $(0,1)$; la abscisa $x$ vale $0$, por lo que $\cos(90^\circ) = 0$.
  - **Error 2:** Creer que $\cos(180^\circ) = 1$. **Cómo corregirlo:** En $180^\circ$ el punto está en el semieje negativo $X$ ($(-1,0)$), por lo que la abscisa es $x = -1$.
ejemplos:
  - titulo: 'Coseno de cero radianes'
    enunciado: '¿Cuál es el valor de $\cos(0)$?'
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. El punto sobre el semieje $+X$ es $(1,0)$.'
      - '2. La abscisa $x = 1 \implies \cos(0) = 1$.'
  - titulo: 'Coseno de tres pi medios'
    enunciado: '¿Cuánto vale $\cos\left(\frac{3\pi}{2}\right)$?'
    alternativas:
      - '$0$'
      - '$-1$'
      - '$1$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. $\frac{3\pi}{2}$ equivale a $270^\circ$, punto $(0,-1)$.'
      - '2. La abscisa $x = 0 \implies \cos\left(\frac{3\pi}{2}\right) = 0$.'
  - titulo: 'Coseno de dos pi'
    enunciado: '¿El coseno del ángulo cuadrantal $2\pi$ ($360^\circ$) es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2\pi$ es coterminal con $0$, punto $(1,0) \implies x = 1$.'
  - titulo: 'Coseno de ángulo negativo cuadrantal'
    enunciado: '¿El valor de $\cos(-90^\circ)$ es igual a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-90^\circ$ cae sobre el punto $(0,-1)$, donde la abscisa $x = 0$.'
errores_frecuentes:
  - 'La afirmación de que el coseno del ángulo $90^\circ$ es igual a $1$.'
  - 'La afirmación de que el coseno de $180^\circ$ toma el valor positivo de $+1$.'
  - 'La afirmación de que en $270^\circ$ el coseno vale $-1$.'
  - 'La afirmación de que el coseno es indefinido en los ángulos cuadrantales.'
  - 'La afirmación de que $\cos(0^\circ)$ y $\cos(180^\circ)$ tienen exactamente el mismo valor.'
afirmaciones_verdaderas:
  - 'El coseno se anula ($\cos \theta = 0$) en los ángulos cuadrantales verticales $90^\circ$ ($\frac{\pi}{2}$) y $270^\circ$ ($\frac{3\pi}{2}$).'
  - 'El coseno alcanza sus valores extremos de $1$ y $-1$ en los ángulos cuadrantales horizontales $0^\circ$ ($0$), $180^\circ$ ($\pi$) y $360^\circ$ ($2\pi$).'
al_terminar_debes_poder: |
  QUÉ: Evaluar e interpretar los valores exactos del coseno en todos los ángulos cuadrantales.
  CÓMO: Extraer la abscisa $x$ del punto de intersección cartesiana $(1,0)$, $(0,1)$, $(-1,0)$ o $(0,-1)$.
