semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.DEFINICION
resumen_inicial: 'Definición de función potencia: forma general $f(x) = a x^n$, simetría,
  dominio y recorrido en Definición y análisis de parámetros.'
explicacion_simple: A diferencia de la función exponencial, donde la variable está
  en el exponente, en la función potencia la variable ocupa la base y el exponente
  permanece constante.
explicacion_formal: '### Definición formal


  Una función $f:\mathbb{R}\to\mathbb{R}$ (o un subconjunto de $\mathbb{R}$, según
  el exponente) es una función potencia si puede expresarse como $f(x)=a\cdot x^n$,
  con $a\neq0$ y $n$ un número real fijo. La variable independiente $x$ ocupa la base
  de la potencia, mientras que $n$ permanece constante para toda la función.


  ### Desarrollo didáctico


  $f(x)=3x^2$ es una función potencia con $a=3$ y $n=2$: para cada valor de $x$ se
  calcula su cuadrado y se multiplica por $3$. En cambio, $g(x)=3^x$ no es una función
  potencia, porque ahí la variable está en el exponente, no en la base.'
definiciones_clave: '- **Definición de función potencia**: Función de la forma $f(x)
  = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a definición de función potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de definición de función potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de definición de función
    potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar definición de función potencia?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en definición y análisis de parámetros
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en definición y análisis de parámetros.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en definición de función potencia?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la variable $x$ aparezca en la base de la expresión, no en
  el exponente.'
- 'Paso 2: Identifica el coeficiente $a$ y el exponente fijo $n$.'
- 'Paso 3: Confirma que $a\neq0$ para que la expresión represente una función potencia
  válida.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en definición de función potencia.
ejemplos:
- titulo: Reconocimiento de una función potencia
  enunciado: ¿Es $f(x)=5x^3$ una función potencia?
  solucion_pasos:
  - La variable $x$ está en la base, elevada al exponente fijo $3$.
  - Sí, es una función potencia con $a=5$ y $n=3$.
- titulo: Distinción respecto a la función exponencial
  enunciado: ¿Es $g(x)=2^x$ una función potencia?
  solucion_pasos:
  - La variable $x$ está en el exponente, no en la base.
  - No, corresponde a una función exponencial, no a una función potencia.
- titulo: ¿Toda función con exponente es una función potencia?
  enunciado: ¿Cualquier función que incluya una potencia es automáticamente una función
    potencia?
  respuesta: 'No'
  solucion_pasos:
  - Solo lo es si la variable independiente está en la base y el exponente es una
    constante fija.
- titulo: ¿El coeficiente $a$ puede ser igual a cero en una función potencia?
  enunciado: ¿Puede el coeficiente $a$ de $f(x)=a\cdot x^n$ ser igual a $0$?
  respuesta: 'No'
  solucion_pasos:
  - Si $a=0$, la función se reduce a la función constante $f(x)=0$, y deja de ser
    una función potencia.
errores_frecuentes:
- Confundir la función potencia con la función exponencial por tener ambas un exponente
  visible.
- Aceptar $a=0$ como coeficiente válido de una función potencia.
- Suponer que $n$ debe ser un número entero positivo, cuando puede ser cualquier real
  distinto de los casos excluidos.
- No identificar correctamente cuál elemento es la base y cuál el exponente.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  definición de función potencia.
