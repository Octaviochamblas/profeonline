semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.DEFINICION
resumen_inicial: 'Una función potencia es una función real de la forma $f(x) = a x^n$, donde $a$ es un coeficiente real no nulo ($a \neq 0$) y $n$ es el exponente fijo.'
explicacion_simple: |
  Una función potencia es aquella donde la variable $x$ se encuentra en la base de una potencia elevada a un exponente fijo $n$, y multiplicada por un número real $a$. Por ejemplo, $f(x) = 3x^2$, $g(x) = -2x^3$ o $h(x) = x^{-1}$ son funciones potencia. A diferencia de las funciones exponenciales donde la variable está arriba en el exponente ($b^x$), en la función potencia la variable está abajo en la base ($x^n$).
explicacion_formal: |
  ### Definición formal
  Se define como **función potencia mónica o escalada** a toda regla de correspondencia $f: D \to \mathbb{R}$ cuya expresión algebraica es de la forma:
  $$f(x) = a \cdot x^n$$
  donde:
  - **$a \in \mathbb{R} \setminus \{0\}$**: Coeficiente multiplicativo o parámetro de escala vertical.
  - **$n \in \mathbb{Z} \setminus \{0\}$** (o $n \in \mathbb{R} \setminus \{0\}$): Exponente fijo de la potencia.
  - **$x \in D \subseteq \mathbb{R}$**: Variable independiente ubicada en la base de la potencia.

  ### Distinción fundamental de estructuras
  - **Función Potencia**: $f(x) = a \cdot x^n \implies$ La variable $x$ es la **base**, el exponente $n$ es constante.
  - **Función Exponencial**: $g(x) = a \cdot b^x \implies$ La variable $x$ es el **exponente**, la base $b$ es constante.
  - **Función Polinomial General**: Suma de múltiples términos potencia de distinto exponente ($P(x) = a_n x^n + \dots + a_0$). La función potencia es la versión monómica pura de un solo término.

  ### Síntesis didáctica
  Diferenciar base de exponente: Si la variable $x$ sostiene un número sobre su cabeza ($x^4$), es función potencia. Si un número sostiene a la variable $x$ sobre su cabeza ($4^x$), es función exponencial.
definiciones_clave: |
  - **Función potencia $f(x) = a x^n$**: Expresión matemática monómica de base variable $x$ y exponente constante $n$.
  - **Coeficiente de escala $a \neq 0$**: Constante multiplicativa que amplifica, comprime o invierte la gráfica.
  - **Exponente $n$**: Grado o índice fijo que determina la paridad y comportamiento global de la curva.
propiedades_relaciones: |
  - **Paso por el origen o asíntota en cero**: Si $n > 0$, la gráfica pasa obligatoriamente por el origen $(0, 0)$. Si $n < 0$, la gráfica posee una asíntota vertical en $x = 0$.
  - **Caso particular $n = 1$**: Genera una función lineal mónica $f(x) = ax$.
  - **Caso particular $n = 2$**: Genera la función cuadrática centrada $f(x) = ax^2$.
ejemplo_guiado:
  enunciado: 'Clasifica las siguientes expresiones algebraicas indicando si corresponden o no a funciones potencia, identificando el coeficiente $a$ y el exponente $n$ en caso afirmativo: A) $f(x) = -5x^4$, B) $g(x) = 2^x$, C) $h(x) = \frac{3}{x^2}$, D) $p(x) = 3x^2 - 4x + 1$.'
  pasos:
    - 'Paso 1: Para $f(x) = -5x^4$, la variable $x$ está en la base y el exponente es 4. **Sí es función potencia** con $a = -5$ y $n = 4$.'
    - 'Paso 2: Para $g(x) = 2^x$, la variable $x$ está en el exponente. **No es función potencia** (es una función exponencial).'
    - 'Paso 3: Para $h(x) = \frac{3}{x^2} = 3x^{-2}$, la variable está en la base con exponente $-2$. **Sí es función potencia** con $a = 3$ y $n = -2$.'
    - 'Paso 4: Para $p(x) = 3x^2 - 4x + 1$, consta de tres términos sumados. **No es función potencia pura** (es una función polinomial cuadrática completa).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes fórmulas algebraicas corresponde a la definición estricta de una función potencia real?'
    choices:
      - {text: '$f(x) = 7x^5$', is_correct: true}
      - {text: '$f(x) = 5^x$', is_correct: false}
      - {text: '$f(x) = 2x^3 - x + 4$', is_correct: false}
      - {text: '$f(x) = 0 \cdot x^4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = 7x^5$''. Cumple la forma $f(x) = a x^n$ con $a = 7 \neq 0$ y la variable $x$ en la base.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $g(x) = 4^x$ no califica como una función potencia?'
    choices:
      - {text: 'Porque la variable $x$ se ubica en el exponente en lugar de la base, definiendo una función exponencial', is_correct: true}
      - {text: 'Porque el coeficiente $a$ es un número par', is_correct: false}
      - {text: 'Porque no tiene término independiente', is_correct: false}
      - {text: 'Porque el exponente es menor que cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la variable $x$ se ubica en el exponente en lugar de la base, definiendo una función exponencial''. La función potencia requiere que $x$ sea la base de la potencia.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Observar la regla de correspondencia de la función dada.'
  - 'Paso 2: Verificar si consta de un único término monómico de la forma $a \cdot x^n$.'
  - 'Paso 3: Confirmar que la variable independiente $x$ esté ubicada en la base de la potencia.'
  - 'Paso 4: Comprobar que el coeficiente $a$ sea distinto de cero ($a \neq 0$) y extraer $a$ y $n$.'
errores_correccion: |
  - **Error 1:** Confundir una función potencia $f(x) = x^3$ con una función exponencial $g(x) = 3^x$. **Cómo corregirlo:** Identificar la posición de la variable $x$. Si la variable está abajo en la base ($x^3$) es potencia; si está arriba en el exponente ($3^x$) es exponencial.
  - **Error 2:** Clasificar un polinomio completo como $f(x) = x^3 + x^2$ como función potencia. **Cómo corregirlo:** La función potencia es un único monomio $a x^n$. Al sumar términos de distinto grado se obtiene una función polinomial general.
ejemplos:
  - titulo: 'Identificación de función potencia básica'
    enunciado: '¿La regla $f(x) = \frac{1}{2}x^6$ representa una función potencia?'
    alternativas:
      - 'Sí, con $a = 0.5$ y $n = 6$'
      - 'No, porque $a$ es fraccionario'
      - 'No, es una función racional'
    respuesta: 'Sí, con $a = 0.5$ y $n = 6$'
    solucion_pasos:
      - '1. Se ajusta a $a x^n$ con $a = 0.5 \neq 0$ y $n = 6$.'
  - titulo: 'Reescritura de exponente negativo'
    enunciado: '¿La función $g(x) = \frac{-4}{x^3}$ es una función potencia con exponente negativo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reescribimos $g(x) = -4x^{-3}$, con $a = -4$ y $n = -3$.'
  - titulo: 'Función raíz como potencia fraccionaria'
    enunciado: '¿La función $h(x) = \sqrt{x}$ se puede expresar como una función potencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reescribimos $h(x) = x^{1/2}$, con $a = 1$ y $n = \frac{1}{2}$.'
  - titulo: 'Descarte por coeficiente nulo'
    enunciado: '¿La función $p(x) = 0 \cdot x^5$ es una función potencia?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. El coeficiente $a = 0$ anula la función ($p(x) = 0$), violando la condición $a \neq 0$.'
errores_frecuentes:
  - 'Una función exponencial como $f(x) = 5^x$ es un caso particular de función potencia.'
  - 'Cualquier polinomio con múltiples términos como $f(x) = x^4 + 2x + 1$ es una función potencia.'
  - 'El coeficiente $a$ en $f(x) = a x^n$ puede tomar el valor cero.'
  - 'Una función con exponente negativo como $f(x) = x^{-2}$ no se considera función potencia.'
  - 'La variable $x$ en una función potencia se ubica en el exponente de la expresión.'
afirmaciones_verdaderas:
  - 'Una función potencia es una expresión de la forma $f(x) = a x^n$ donde la variable $x$ se encuentra en la base y el coeficiente $a \neq 0$.'
  - 'La posición de la variable distingue a la función potencia (variable en la base) de la función exponencial (variable en el exponente).'
al_terminar_debes_poder: |
  QUÉ: Definir la función potencia $f(x) = a \cdot x^n$ e identificar sus componentes.
  CÓMO: Reconocer la base variable $x$, el coeficiente real no nulo $a \neq 0$ y el exponente real $n$.
