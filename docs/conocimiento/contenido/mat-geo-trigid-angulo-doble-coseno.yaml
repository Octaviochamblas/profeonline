procedimiento:
- 'Paso 1: Identifica el ángulo x cuyo doble se quiere calcular.'
- 'Paso 2: Obtén (o calcula) los valores de sinx y cosx (o solo uno de ellos, según
  la forma de la fórmula que uses).'
- 'Paso 3: Aplica la forma más conveniente: cos²x-sin²x, 2cos²x-1, o 1-2sin²x.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
