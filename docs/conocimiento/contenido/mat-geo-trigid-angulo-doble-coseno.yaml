semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.ANGULO_DOBLE_COSENO
resumen_inicial: 'Identidad del coseno del ángulo doble: conceptos, teoremas, propiedades
  geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Esta identidad es un caso particular de la fórmula del coseno
  de una suma, cuando ambos ángulos que se suman son iguales (α=β=x), y admite formas
  equivalentes usando la identidad pitagórica.
explicacion_formal: '![Coseno del ángulo doble](/static/img/geometria/trigonometria/trigid-angulo-doble-coseno.svg)


  ### Definición formal


  Haciendo $\alpha=\beta=x$ en la identidad $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$,
  se obtiene $\cos(2x)=\cos^2x-\sin^2x$. Usando $\sin^2x=1-\cos^2x$ o $\cos^2x=1-\sin^2x$,
  se obtienen las formas equivalentes $2\cos^2x-1$ y $1-2\sin^2x$.


  ### Desarrollo didáctico


  En la figura, θ=50° y 2θ=100°. Se puede verificar que cos100°=cos²50°-sin²50°, o
  de forma equivalente usando cualquiera de las otras dos formas de la fórmula.'
definiciones_clave: '- **Identidad del coseno del ángulo doble**: Elemento o propiedad
  fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identidad del coseno del ángulo doble.'
