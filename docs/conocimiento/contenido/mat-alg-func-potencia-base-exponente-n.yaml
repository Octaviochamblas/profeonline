    x^n$ al estudiar identificación del exponente n como determinante del comportamiento
    funcional?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en definición y análisis de parámetros
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en definición y análisis de parámetros.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en identificación del exponente n como determinante del comportamiento
    funcional?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el valor y tipo del exponente $n$ (entero positivo par/impar,
  negativo, o fraccionario).'
- 'Paso 2: Asocia ese tipo de exponente con la familia de curva correspondiente.'
- 'Paso 3: Usa esa clasificación para anticipar el comportamiento general antes de
  graficar en detalle.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en identificación del exponente n como determinante del comportamiento
  funcional.
ejemplos:
- titulo: Clasificación de exponentes
  enunciado: Clasifica el exponente de $f(x)=6x^4$.
  solucion_pasos:
  - Se observa que $n=4$ es un entero positivo par.
  - Se espera una curva simétrica respecto al eje $y$, similar a una parábola.
- titulo: Clasificación de un exponente fraccionario
  enunciado: Clasifica el exponente de $f(x)=2x^{1/3}$.
  solucion_pasos:
  - Se observa que $n=1/3$ es un exponente fraccionario.
  - Se espera un comportamiento asociado a una función raíz.
- titulo: ¿El coeficiente $a$ determina el tipo de curva de la función potencia?
  enunciado: ¿Es el coeficiente $a$ el que determina si la curva es parábola, hipérbola
    o raíz?
  respuesta: 'No'
  solucion_pasos:
  - Es el exponente $n$ el que determina el tipo general de curva; $a$ solo escala
    y refleja.
- titulo: ¿Todos los exponentes enteros positivos producen curvas del mismo tipo?
  enunciado: ¿Producen el mismo tipo de curva los exponentes enteros positivos pares
    e impares?
  respuesta: 'No'
  solucion_pasos:
  - Los exponentes pares producen curvas simétricas respecto al eje $y$, y los impares
    respecto al origen.
errores_frecuentes:
- Confundir el rol del exponente $n$ con el del coeficiente $a$.
- Suponer que todos los exponentes positivos producen curvas idénticas, sin distinguir
  par de impar.
- No anticipar la aparición de asíntotas cuando el exponente es negativo.
- Olvidar que los exponentes fraccionarios pueden restringir el dominio de la función.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  identificación del exponente n como determinante del comportamiento funcional.
