semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_N
resumen_inicial: 'El exponente $n$ en la función potencia $f(x) = a x^n$ es el parámetro determinante principal que define la simetría, monotonía, continuidad y dominio del modelo funcional.'
explicacion_simple: |
  En una función potencia $f(x) = a x^n$, mientras que el número de abajo $a$ regula el estiramiento y la orientación, el exponente de arriba $n$ es el que define la personalidad y la forma completa de la gráfica. El valor y tipo de $n$ determina si la gráfica es una parábola centrada (exponente 2), una curva en forma de S (exponente 3), una hipérbola discontinua con asíntotas (exponente $-1$) o una rama curva de raíz (exponente $0.5$).
explicacion_formal: |
  ### Definición formal
  El **exponente o grado funcional** $n \in \mathbb{R} \setminus \{0\}$ en la función potencia $f(x) = a x^n$ condiciona la topología y el espacio analítico de la función según tres dicotomías fundamentales del exponente $n$:
  1. **Dicotomía de Signo ($n > 0$ vs $n < 0$)**:
     - Exponente Entero Positivo ($n \in \mathbb{Z}^+$): Función continua en $\mathbb{R}$, pasa por el origen $(0, 0)$.
     - Exponente Entero Negativo ($n \in \mathbb{Z}^-$): Función discontinua en $x = 0$, con asíntota vertical en $x = 0$ y asíntota horizontal en $y = 0$.
  2. **Dicotomía de Paridad ($n$ Par vs $n$ Impar)**:
     - Exponente Par: Simetría axial respecto al eje $y$ ($f(-x) = f(x)$).
     - Exponente Impar: Simetría central respecto al origen $(0, 0)$ ($f(-x) = -f(x)$).
  3. **Dicotomía de Naturaleza ($n \in \mathbb{Z}$ vs $n \in \mathbb{Q} \setminus \mathbb{Z}$)**:
     - Exponente Fraccionario $n = p/q$: Introduce restricciones de dominio en $\mathbb{R}$ si el denominador $q$ es par.

  ### Síntesis didáctica
  Clasificación rápida según la naturaleza de $n$:
  - $n = 2, 4, 6 \dots \implies$ Parábola / U simétrica respecto al eje $y$.
  - $n = 3, 5, 7 \dots \implies$ Silla / S simétrica respecto al origen.
  - $n = -1, -3 \dots \implies$ Hipérbola discontinua de dos ramas en cuadrantes opuestos.
  - $n = -2, -4 \dots \implies$ Curva de volcán simétrica respecto al eje $y$ con asíntota.
definiciones_clave: |
  - **Exponente determinante $n$**: Parámetro estructural que fija la paridad y el comportamiento global de la curva.
  - **Comportamiento en los extremos**: Dirección de la gráfica cuando $x \to +\infty$ y $x \to -\infty$ gobernada por $n$.
  - **Continuidad en el origen**: Presencia de punto continuo $(0, 0)$ si $n > 0$ o asíntota vertical $x = 0$ si $n < 0$.
propiedades_relaciones: |
  - **Aplastamiento en el intervalo $[-1, 1]$**: Para exponente entero positivo mayor ($n = 4$ frente a $n = 2$), la gráfica se aplasta más cerca de cero en $]-1, 1[$ y sube mucho más rápido para $|x| > 1$.
  - **Invariancia de los puntos nodales**: Todas las funciones mónicas $y = x^n$ con $n > 0$ pasan obligatoriamente por el punto $(1, 1)$.
ejemplo_guiado:
  enunciado: 'Identifica el tipo de comportamiento gráfico, simetría y continuidad en el origen que imparte el exponente $n$ en las siguientes funciones potencia: A) $f(x) = x^4$, B) $g(x) = x^5$, C) $h(x) = x^{-1}$.'
  pasos:
    - 'Paso 1: Para $f(x) = x^4$, el exponente $n=4$ es entero positivo y par. Curva continua en forma de U, simétrica respecto al eje $y$, pasa por $(0, 0)$.'
    - 'Paso 2: Para $g(x) = x^5$, el exponente $n=5$ es entero positivo e impar. Curva continua en forma de S, simétrica respecto al origen $(0, 0)$, pasa por $(0, 0)$.'
    - 'Paso 3: Para $h(x) = x^{-1}$, el exponente $n=-1$ es entero negativo e impar. Curva discontinua en $x = 0$ (asíntota vertical en el eje $y$), simétrica respecto al origen $(0, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad estructural de la función potencia $f(x) = a x^n$ viene determinada exclusivamente por el hecho de que el exponente $n$ sea un número entero positivo par?'
    choices:
      - {text: 'La simetría axial de la gráfica respecto al eje $y$, satisfaciendo $f(-x) = f(x)$', is_correct: true}
      - {text: 'La presencia de una asíntota vertical en $x = 0$', is_correct: false}
      - {text: 'La simetría central respecto al origen $(0, 0)$', is_correct: false}
      - {text: 'Que la gráfica sea una recta constante', is_correct: false}
    explanation: 'La alternativa correcta es ''La simetría axial de la gráfica respecto al eje $y$, satisfaciendo $f(-x) = f(x)$''. Todo exponente par entero positivo genera simetría par respecto al eje vertical $y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con el punto $(0, 0)$ en una función potencia cuando su exponente es negativo, como en $f(x) = x^{-2}$?'
    choices:
      - {text: 'El punto $(0, 0)$ deja de pertenecer a la función y el eje $y$ ($x = 0$) se convierte en una asíntota vertical', is_correct: true}
      - {text: 'La función sigue pasando continuamente por el punto $(0, 0)$', is_correct: false}
      - {text: 'El origen $(0, 0)$ se convierte en un punto de máximo absoluto', is_correct: false}
      - {text: 'La función se destruye y no existe para ningún valor real', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto $(0, 0)$ deja de pertenecer a la función y el eje $y$ ($x = 0$) se convierte en una asíntota vertical''. Al ser $x^{-2} = \frac{1}{x^2}$, la división por cero indefine el origen.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer el valor del exponente $n$ en la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Evaluar el signo de $n$: si $n > 0$, la curva es continua en el origen; si $n < 0$, posee asíntota vertical en $x = 0$.'
  - 'Paso 3: Evaluar la paridad de $n$: si es par, la gráfica es simétrica respecto al eje $y$; si es impar, es simétrica respecto al origen $(0, 0)$.'
  - 'Paso 4: Trazar el esquema cualitativo de la función según el tipo de exponente $n$.'
errores_correccion: |
  - **Error 1:** Asumir que el exponente $n$ solo altera la pendiente sin cambiar la forma de la gráfica. **Cómo corregirlo:** El exponente $n$ cambia radicalmente la topología de la función: diferencia parábolas (pares) de curvas en S (impares) e hipérbolas (negativos).
  - **Error 2:** Evaluar $f(0) = 0$ en funciones con exponente negativo. **Cómo corregirlo:** Para $n < 0$, $x^n = \frac{1}{x^{|n|}}$, por lo que $f(0) = \frac{a}{0}$ no existe. El origen $x = 0$ queda excluido del dominio.
ejemplos:
  - titulo: 'Paridad de exponente par'
    enunciado: '¿La función $f(x) = x^6$ es simétrica respecto al eje $y$?'
    alternativas:
      - 'Sí, por tener exponente par $n = 6$'
      - 'No, es simétrica al origen'
      - 'No tiene simetría'
    respuesta: 'Sí, por tener exponente par $n = 6$'
    solucion_pasos:
      - '1. Exponente $n = 6$ es un entero par.'
      - '2. Satisface $f(-x) = (-x)^6 = x^6 = f(x)$, siendo simétrica respecto al eje $y$.'
  - titulo: 'Simetría de exponente impar'
    enunciado: '¿La función $g(x) = x^7$ cumple $g(-x) = -g(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exponente impar $n = 7 \implies (-x)^7 = -x^7$, demostrando simetría impar respecto al origen.'
  - titulo: 'Asíntota por exponente negativo'
    enunciado: '¿La función $h(x) = x^{-3}$ tiene una asíntota vertical en $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $n = -3 < 0$, $h(x) = \frac{1}{x^3}$, cuya asíntota vertical es la recta $x = 0$.'
  - titulo: 'Paso por el punto (1, 1)'
    enunciado: '¿Todas las funciones mónicas $y = x^n$ con $n > 0$ pasan por el punto $(1, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluando $x = 1$, $1^n = 1$ para cualquier exponente $n$.'
errores_frecuentes:
  - 'Las funciones potencia con exponente negativo como $f(x) = x^{-2}$ pasan por el origen de coordenadas $(0, 0)$.'
  - 'El exponente $n$ solo cambia el tamaño de la gráfica pero no su forma de paridad.'
  - 'Una función con exponente impar como $f(x) = x^3$ es simétrica respecto al eje vertical $y$.'
  - 'Para exponente par $n$, $f(-x)$ es igual a $-f(x)$.'
  - 'Cualquier función potencia es continua en todos los números reales independientemente del signo de $n$.'
afirmaciones_verdaderas:
  - 'El exponente $n$ rige la paridad de la función potencia: los exponentes pares generan simetría respecto al eje $y$ ($f(-x)=f(x)$) y los impares generan simetría respecto al origen ($f(-x)=-f(x)$).'
  - 'Los exponentes positivos $n > 0$ producen funciones continuas en el origen $(0, 0)$, mientras que los exponentes negativos $n < 0$ producen una asíntota vertical en $x = 0$.'
al_terminar_debes_poder: |
  QUÉ: Determinar la influencia del exponente $n$ en la forma global de la curva.
  CÓMO: Clasificar el tipo de función potencia según las propiedades aritméticas del exponente $n$.
