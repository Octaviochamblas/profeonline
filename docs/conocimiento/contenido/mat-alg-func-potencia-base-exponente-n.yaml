semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_N
resumen_inicial: 'Identificación del exponente n como determinante del comportamiento
  funcional: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Definición
  y análisis de parámetros.'
explicacion_simple: Mientras el coeficiente $a$ solo escala y refleja la gráfica,
  el exponente $n$ es el que decide si la curva se comporta como una parábola, una
  recta, una hipérbola o una raíz.
explicacion_formal: '### Definición formal


  Dado $f(x)=a\cdot x^n$, el valor de $n\in\mathbb{R}$ clasifica la función en distintas
  familias: si $n\in\mathbb{Z}^+$ par, la curva es simétrica respecto al eje $y$ (como
  una parábola); si $n\in\mathbb{Z}^+$ impar, es simétrica respecto al origen; si
  $n<0$, aparece una asíntota vertical en $x=0$; si $n$ es fraccionario, la función
  involucra raíces.


  ### Desarrollo didáctico


  $f(x)=x^2$ (n par positivo) tiene forma de parábola. $f(x)=x^3$ (n impar positivo)
  tiene forma de "s". $f(x)=x^{-1}$ (n negativo) tiene forma de hipérbola. $f(x)=x^{1/2}$
  (n fraccionario) tiene forma de raíz cuadrada. Cada tipo de exponente produce una
  familia de curvas completamente distinta.'
definiciones_clave: '- **Identificación del exponente n como determinante del comportamiento
  funcional**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a identificación del exponente n como determinante del comportamiento
  funcional.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de identificación del exponente n como determinante del comportamiento funcional.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de identificación del exponente
    n como determinante del comportamiento funcional.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
