semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.COCIENTE_NUMEROS
resumen_inicial: 'Traducción del cociente entre dos números: traducción, reglas y
  aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: A veces hay que repartir en partes iguales. Cuando necesitamos
  expresar un reparto entre dos variables desconocidas, llamamos al cociente.
explicacion_formal: '### Definición formal


  La división no es conmutativa. El estricto orden de lectura verbal define quién
  es partido y quién parte.


  ### Desarrollo didáctico


  Palabras clave:

  - El cociente entre

  - La división de

  - La razón entre

  - Repartido entre


  Ejemplos:

  - ''El cociente entre un número y otro número distinto'': $\frac{a}{b}$

  - ''La fortuna de un millonario dividida entre la cantidad de herederos'': $\frac{F}{H}$


  Igual que en la resta, **el orden es crítico**. En ''El cociente entre A y B'',
  A debe ir arriba (numerador) y B abajo (denominador).'
definiciones_clave: '- **Traducción del cociente entre dos números**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción del cociente entre dos números.'
ejemplo_guiado:
