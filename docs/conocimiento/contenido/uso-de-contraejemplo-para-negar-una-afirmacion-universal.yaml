semantic_id: MAT.FUND.CUANTIFICADORES.CONTRAEJEMPLO
resumen_inicial: 'Fundamento lógico y aplicación del contraejemplo como método suficiente y definitivo para refutar proposiciones universales.'
explicacion_simple: |
  Un **contraejemplo** es un caso particular que demuestra que una afirmación general es falsa. Si alguien dice una regla universal como "Todos los números impares son primos", **no necesitas probar infinitos números para refutarlo; basta con encontrar UN SOLO número que sea impar pero no sea primo**. En este caso, el número **$9$** (o el $15$) es impar y no es primo ($9 = 3 \times 3$). Ese solo número $9$ es el **contraejemplo** que destruye por completo la afirmación universal.
explicacion_formal: |
  ### Definición formal
  En la lógica de predicados y la epistemología matemática, un **contraejemplo** para una proposición universal $\Phi = \forall x \in \mathcal{U}, P(x)$ es un elemento específico $x_0 \in \mathcal{U}$ que satisface la negación del predicado:
  $$x_0 \in \mathcal{U} \quad \land \quad v(P(x_0)) = F$$
  Por la ley de dualidad $\neg(\forall x \, P(x)) \equiv \exists x \, \neg P(x)$, la existencia de este único elemento testigo $x_0$ demuestra constructivamente la verdad de la proposición existencial refutatoria:
  $$\exists x \in \mathcal{U}, \, \neg P(x) \implies v(\forall x \in \mathcal{U}, \, P(x)) = F$$

  ### Desglose simbólico
  - Proposición a refutar: $\forall x \in \mathcal{U}, P(x)$.
  - Búsqueda de testigo: Hallar $x_0 \in \mathcal{U}$ tal que $\neg P(x_0)$ sea $V$.
  - Principio de asimetría de la verificación: Se requieren infinitas comprobaciones para demostrar $\forall$ en dominios infinitos, pero **un único contraejemplo basta para refutarlo**.

  ### Síntesis didáctica
  El método del contraejemplo es una de las herramientas de refutación más elegantes y directas de la matemática.
definiciones_clave: |
  - **Contraejemplo**: Instancia particular $x_0 \in \mathcal{U}$ que incumple una afirmación de carácter universal.
  - **Asimetría veritativa de la universalidad**: Principio lógico por el cual la falsedad universal requiere una sola prueba local.
  - **Refutación constructiva**: Demostración de falsedad mediante la presentación explícita del objeto que no cumple la regla.
propiedades_relaciones: |
  - **Insuficiencia del contraejemplo para existenciales**: Un contraejemplo NO sirve para refutar una proposición existencial ($\exists x P(x)$); los existenciales solo se refutan demostrando que $\forall x \neg P(x)$.
  - **Conexión con conjeturas matemáticas**: Históricamente, conjeturas célebres como la conjetura de Euler para potencias fueron refutadas mediante un único contraejemplo.
ejemplo_guiado:
  enunciado: 'Refuta mediante un contraejemplo la afirmación universal: "Para todo número primo $p$, el número $2^p - 1$ es primo" (números de Mersenne).'
  pasos:
    - 'Paso 1: Escribir la proposición en forma universal: $\forall p \in \mathbb{P}, \; (2^p - 1) \in \mathbb{P}$, donde $\mathbb{P}$ es el conjunto de los números primos.'
    - 'Paso 2: Probar con los primeros primos:
      - Para $p = 2$: $2^2 - 1 = 3$ (primo).
      - Para $p = 3$: $2^3 - 1 = 7$ (primo).
      - Para $p = 5$: $2^5 - 1 = 31$ (primo).
      - Para $p = 7$: $2^7 - 1 = 127$ (primo).'
    - 'Paso 3: Probar con el primo siguiente $p = 11$: Calculamos $2^{11} - 1 = 2048 - 1 = 2047$.'
    - 'Paso 4: Factorizar el resultado: $2047 = 23 \times 89$, por lo que $2047$ es un número compuesto (no es primo).'
    - 'Paso 5: Concluir que el valor $p = 11$ es un **contraejemplo** formal que demuestra que la afirmación universal es **Falsa ($F$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuántos contraejemplos se necesitan para demostrar formalmente que una proposición universal $\forall x \in \mathcal{U}, P(x)$ es Falsa?'
    choices:
      - {text: 'Exactamente un único contraejemplo válido perteneciente al dominio', is_correct: true}
      - {text: 'Tantos contraejemplos como la mitad del dominio', is_correct: false}
      - {text: 'Una cantidad infinita de contraejemplos', is_correct: false}
      - {text: 'Al menos dos contraejemplos distintos', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente un único contraejemplo válido perteneciente al dominio''. Un solo elemento que falle invalida la universalidad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de los siguientes números sirve como contraejemplo para refutar la afirmación "Todo número primo es impar"?'
    choices:
      - {text: '$p = 2$', is_correct: true}
      - {text: '$p = 3$', is_correct: false}
      - {text: '$p = 9$', is_correct: false}
      - {text: '$p = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$p = 2$''. El número 2 es primo y es par, sirviendo como contraejemplo perfecto.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la afirmación universal $\forall x \in \mathcal{U}, P(x)$ que se desea refutar.'
  - 'Paso 2: Inspeccionar casos particulares del dominio $\mathcal{U}$, prestando especial atención a casos extremos o frontera.'
  - 'Paso 3: Seleccionar un elemento candidato $x_0 \in \mathcal{U}$.'
  - 'Paso 4: Evaluar el predicado $P(x_0)$ y verificar que su resultado es estrictamente Falso ($F$).'
  - 'Paso 5: Exponer formalmente $x_0$ como el contraejemplo que refuta la afirmación universal.'
errores_correccion: |
  - **Error 1:** Proponer un contraejemplo que no pertenece al dominio de discurso $\mathcal{U}$. **Cómo corregirlo:** Si la afirmación es sobre enteros positivos $\mathbb{N}$, no se puede usar $x = -1$ o $x = 0.5$; el contraejemplo debe pertenecer estrictamente a $\mathcal{U}$.
  - **Error 2:** Intentar refutar una proposición existencial ($\exists x P(x)$) dando un contraejemplo. **Cómo corregirlo:** Si alguien dice "Existe un número par", mostrar que el $3$ es impar no refuta nada; el contraejemplo solo refuta afirmaciones universales ($\forall$).
ejemplos:
  - titulo: 'Contraejemplo de primalidad'
    enunciado: '¿Qué número refuta "Para todo natural $n$, $n^2 + n + 41$ es primo"?'
    alternativas:
      - '$n = 41$'
      - '$n = 1$'
      - '$n = 2$'
    respuesta: '$n = 41$'
    solucion_pasos:
      - '1. Para $n=41$, $41^2 + 41 + 41 = 41(41 + 1 + 1) = 41 \times 43$, que es compuesto.'
  - titulo: 'Contraejemplo en geometría'
    enunciado: '¿Qué figura refuta "Todo cuadrilátero con 4 lados iguales es un cuadrado"?'
    respuesta: 'El rombo'
    solucion_pasos:
      - '1. El rombo tiene 4 lados iguales pero sus ángulos interiores no necesariamente son de 90°.'
  - titulo: 'Asimetría lógica'
    enunciado: '¿Un contraejemplo refuta por sí solo una conjetura universal?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, basta un caso donde falle para invalidar la condición universal.'
  - titulo: 'Pertenencia al dominio'
    enunciado: '¿Un contraejemplo debe pertenecer obligatoriamente al dominio de discurso $\mathcal{U}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, de lo contrario no constituye una evaluación válida dentro del modelo considerado.'
errores_frecuentes:
  - 'La afirmación de que un contraejemplo que no pertenece al dominio de discurso es válido para refutar una tesis.'
  - 'La afirmación de que se requieren al menos dos contraejemplos para anular una proposición universal.'
  - 'La afirmación de que un contraejemplo sirve para refutar proposiciones de tipo existencial.'
  - 'La afirmación de que una afirmación universal puede considerarse casi verdadera si solo tiene un contraejemplo.'
  - 'La afirmación de que presentar un ejemplo favorable refuta la negación de una proposición universal.'
afirmaciones_verdaderas:
  - 'Un contraejemplo es un elemento particular perteneciente al dominio de discurso que hace falso el predicado de una proposición universal.'
  - 'La exhibición de un único contraejemplo es condición necesaria y suficiente para refutar formalmente una afirmación universal $\forall x \in \mathcal{U}, P(x)$.'
al_terminar_debes_poder: |
  QUÉ: Identificar, formular y aplicar contraejemplos para refutar proposiciones universales.
  CÓMO: Encontrar un elemento del dominio que incumpla el predicado ($x_0 \in \mathcal{U} \land \neg P(x_0)$) y justificar la falsedad de la afirmación global.
