semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.NOTACION_CONGRUENCIA
resumen_inicial: 'Notación de congruencia mediante el símbolo ≅: conceptos, teoremas,
  propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'Así como la igualdad entre números se expresa con el símbolo
  =, la congruencia entre figuras tiene su propio símbolo matemático: ≅.'
explicacion_formal: '![Notación de congruencia: ABC ≅ A''B''C''](/static/img/geometria/congruencia-semejanza/congruencia-notacion.svg)


  ### Definición formal


  La notación $\triangle ABC\cong\triangle A''B''C''$ significa que el vértice A corresponde
  a A'', B corresponde a B'', y C corresponde a C'', en ese orden específico.


  ### Desarrollo didáctico


  Escribir $\triangle ABC\cong\triangle A''B''C''$ no es lo mismo que escribir $\triangle
  ABC\cong\triangle B''A''C''$: el orden de los vértices en la notación indica exactamente
  qué vértice corresponde a cuál, información esencial para identificar lados y ángulos
  homólogos correctamente.'
definiciones_clave: '- **Notación de congruencia mediante el símbolo ≅**: Elemento
  o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a notación de congruencia mediante el símbolo
  ≅.'
ejemplo_guiado:
  enunciado: Para analizar notación de congruencia mediante el símbolo ≅, considera
    un ángulo $\alpha = 142^\circ$ ubicado en la posición dada. Determina el valor
    de la medida asociada sabiendo que $x + 1093^\circ = 142^\circ$.
  pasos:
  - Identificar la propiedad de notación de congruencia mediante el símbolo ≅ referida
    a $\alpha = 142^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1093 = 142 \implies x = 142 - 1093$.'
  - Concluir que la medida calculada para notación de congruencia mediante el símbolo
    ≅ es $x = -951^\circ$.
