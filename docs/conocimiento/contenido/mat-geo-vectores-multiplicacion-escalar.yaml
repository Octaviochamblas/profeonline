- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de multiplicación de un vector por un
    escalar y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de multiplicación de un vector por un escalar.
- titulo: ¿Se cumple siempre la propiedad principal de multiplicación de un vector
    por un escalar en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede multiplicación de un vector por un escalar asumir un valor negativo
    cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en multiplicación de un vector por
  un escalar.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en multiplicación
  de un vector por un escalar.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en multiplicación
  de un vector por un escalar.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de multiplicación
  de un vector por un escalar.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
