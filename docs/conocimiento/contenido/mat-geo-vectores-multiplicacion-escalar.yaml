procedimiento:
- 'Paso 1: Identifica el vector v=(vx,vy) y el escalar k por el que se multiplicará.'
- 'Paso 2: Multiplica cada componente del vector por el escalar: k·vx y k·vy.'
- 'Paso 3: Escribe el vector resultante kv=(k·vx, k·vy).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con multiplicación de un vector por un escalar.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de multiplicación de un vector por un escalar para
