semantic_id: MAT.GEO.VECTORES_OPERATORIA.MULTIPLICACION_ESCALAR
resumen_inicial: 'Multiplicación de un vector por un escalar: conceptos, teoremas,
  propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Multiplicar un vector por un escalar es como 'estirar' o 'encoger'
  la flecha que lo representa, manteniendo su misma línea de dirección.
explicacion_formal: '![Multiplicación de un vector por un escalar](/static/img/geometria/cartesiano-vectores/vectores-multiplicacion-escalar.svg)


  ### Definición formal


  Si $\vec{v}=(v_x,v_y)$ y $k$ es un número real (escalar), entonces $k\vec{v}=(k\cdot
  v_x,\,k\cdot v_y)$: cada componente del vector se multiplica por el mismo escalar.


  ### Desarrollo didáctico


  En la figura, el vector $\vec{v}=(1{,}5,1)$ multiplicado por el escalar $k=2$ da
  $2\vec{v}=(3,2)$: un vector con el doble de longitud, en la misma dirección y sentido
  que el original.'
definiciones_clave: '- **Multiplicación de un vector por un escalar**: Elemento o
  propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a multiplicación de un vector por un escalar.'
