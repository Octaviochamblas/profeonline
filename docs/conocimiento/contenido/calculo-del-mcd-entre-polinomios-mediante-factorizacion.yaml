semantic_id: MAT.ALG.MCD_ALGEBRAICO.FACTORIZACION_POLINOMIOS
resumen_inicial: El M.C.D. entre polinomios mediante factorización se halla descomponiendo
  cada polinomio en sus factores irreductibles y multiplicando los factores comunes
  elevados a su menor exponente.
explicacion_simple: 'Para encontrar el Máximo Común Divisor de dos o más polinomios
  utilizando factorización:

  1. Factorizamos completamente cada polinomio (usando factor común, productos notables,
  trinomios o agrupación).

  2. Identificamos qué binomios, trinomios o factores numéricos se repiten en TODAS
  las factorizaciones.

  3. Elegimos cada factor repetido elevado al menor exponente con el que aparezca
  en los polinomios factorizados.

  4. Multiplicamos esos factores comunes para formar el polinomio M.C.D. final.'
explicacion_formal: 'Sean $P(x)$ y $Q(x)$ dos polinomios descompuestos en factores
  irreductibles sobre el cuerpo de los números reales $\mathbb{R}[x]$:


  $$P(x) = c_P \cdot \prod_{k} f_k(x)^{\alpha_k}, \quad Q(x) = c_Q \cdot \prod_{k}
  f_k(x)^{\beta_k}$$


  El **M.C.D. entre polinomios** es el polinomio mónico de mayor grado $D(x)$ dado
  por:


  $$D(x) = \operatorname{gcd}(|c_P|, |c_Q|) \cdot \prod_{f_k \text{ común}} f_k(x)^{\min(\alpha_k,
  \beta_k)}$$


  **Desglose de la fórmula:**

  - $c_P, c_Q$: Coeficientes numéricos principales extraídos en la factorización.

  - $f_k(x)$: Factores polinomiales irreductibles (por ejemplo, $(x-a)$, $(x^2+b)$).

  - $\min(\alpha_k, \beta_k)$: Exponente mínimo al que aparece el factor $f_k(x)$
  en la descomposición de cada polinomio.


  > **Complemento didáctico:** La factorización transforma el problema de divisibilidad
  polinomial en una comparación directa de factores lineales o cuadráticos irreductibles
  simples.'
definiciones_clave: '- **Factorización irreductible**: Expresión de un polinomio como
  producto de factores que ya no pueden seguir factorizándose sobre un cuerpo determinado.

  - **Factor polinomial común**: Paréntesis o polinomio irreducible que divide exactamente
  a cada uno de los polinomios originales.'
propiedades_relaciones: '- **Relación con simplificación de fracciones**: El M.C.D.
  de numerador y denominador es la expresión exacta que se simplifica al reducir una
  fracción algebraica a su forma irreducible.

  - **Polinomios primos entre sí**: Si dos polinomios no comparten ningún factor polinomial
  con grado $\ge 1$, su M.C.D. es $1$.'
ejemplo_guiado:
  enunciado: Dos áreas de parcelas de terreno vienen dadas por los polinomios $A_1(x)
    = x^2 - 9$ y $A_2(x) = x^2 + 5x + 6$. Encuentra el factor común de sus lados dado
    por el M.C.D. y calcula su valor numérico para una medida $x = 7\text{ metros}$.
  pasos:
  - 'Paso 1: Factorizar $A_1(x) = x^2 - 9$ mediante diferencia de cuadrados: $A_1(x)
    = (x + 3)(x - 3)$.'
  - 'Paso 2: Factorizar $A_2(x) = x^2 + 5x + 6$ buscando dos números que multipliquen
    $6$ y sumen $5$: $A_2(x) = (x + 3)(x + 2)$.'
  - 'Paso 3: Identificar los factores comunes en ambas factorizaciones. El único factor
    presente en ambos es $(x + 3)$ con exponente $1$. Por lo tanto, $\text{M.C.D.}
    = x + 3$.'
  - 'Paso 4: Evaluar para $x = 7$: $\text{M.C.D.}(7) = 7 + 3 = 10\text{ metros}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el M.C.D. entre los polinomios $x^2 - 9$ y $x^2 + 5x + 6$?
  choices:
  - text: $x + 3$
    is_correct: true
  - text: $x - 3$
    is_correct: false
  - text: $x + 2$
    is_correct: false
  - text: $(x + 3)(x - 3)(x + 2)$
    is_correct: false
  explanation: La alternativa correcta es '$x + 3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el M.C.D. $(x + 3)$ para $x = 7$, ¿cuál es la longitud resultante
    en metros?
  choices:
  - text: $10\text{ m}$
    is_correct: true
  - text: $4\text{ m}$
    is_correct: false
  - text: $12\text{ m}$
    is_correct: false
  - text: $9\text{ m}$
    is_correct: false
  explanation: La alternativa correcta es '$10\text{ m}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los polinomios dados hasta obtener
  factores irreductibles.'
- 'Paso 2: Extraer el M.C.D. de los coeficientes numéricos que se hayan factorizado
  fuera de los paréntesis.'
- 'Paso 3: Identificar los factores polinomiales (entre paréntesis) que se repitan
  en TODAS las factorizaciones.'
- 'Paso 4: Asignar a cada factor común el menor exponente con el que figura y escribir
  el producto final.'
errores_correccion: '- **Error común:** Intentar calcular el M.C.D. entre polinomios
  extrayendo términos término a término sin factorizar primero el polinomio completo.

  - **Cómo corregirlo:** Jamás busques divisores en términos individuales sumandos;
  la divisibilidad de polinomios exige factorizar primero la expresión completa en
  producto de paréntesis.'
ejemplos:
- titulo: 'Ejemplo 1: M.C.D. con factor común y diferencia de cuadrados'
  enunciado: Calcula el M.C.D. entre $2x^2 - 8$ y $x^2 - 4x + 4$.
  alternativas:
  - $x - 2$
  - $2(x - 2)$
  - $(x - 2)^2$
  respuesta: $x - 2$
  solucion_pasos:
  - '1. Factorizar el primer polinomio: $2x^2 - 8 = 2(x^2 - 4) = 2(x - 2)(x + 2)$.'
  - '2. Factorizar el segundo polinomio: $x^2 - 4x + 4 = (x - 2)^2$.'
  - '3. El único factor polinomial común es $(x - 2)$. Menor exponente: $\min(1, 2)
    = 1$.'
  - 4. El M.C.D. es $x - 2$.
- titulo: 'Ejemplo 2: Polinomios con factor común monomio'
  enunciado: Determina el M.C.D. entre $3x^3 + 6x^2$ y $6x^2 + 12x$.
  alternativas:
  - $3x(x + 2)$
  - $3x^2(x + 2)$
  - $6x(x + 2)$
  respuesta: $3x(x + 2)$
  solucion_pasos:
  - 1. Factorizar $3x^3 + 6x^2 = 3x^2(x + 2)$.
  - 2. Factorizar $6x^2 + 12x = 6x(x + 2) = 2 \cdot 3x(x + 2)$.
  - '3. M.C.D. numérico: $\operatorname{gcd}(3, 6) = 3$.'
  - '4. Monomio común: $x$ (menor potencia de $x^2$ y $x$). Factor binomio común:
    $(x + 2)$.'
  - '5. M.C.D. total: $3x(x + 2)$.'
- titulo: ¿El M.C.D. entre $x + 1$ y $x + 2$ es igual a $1$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Al ser factores lineales distintos e irreductibles, no comparten ningún factor
    en común, por ende su M.C.D. es 1.
- titulo: ¿Al simplificar una fracción algebraica $\frac{P(x)}{Q(x)}$ se debe dividir
    numerador y denominador por su M.C.D.?
  respuesta: Sí
  solucion_pasos:
  - Sí. Dividir el numerador y el denominador por su M.C.D. cancela todos los factores
    comunes y deja la fracción en su forma irreductible.
errores_frecuentes:
- El M.C.D. de $x^2 - 9$ y $x + 3$ es $x^2 - 9$.
- Para hallar el M.C.D. de dos polinomios basta con calcular el M.C.D. de sus términos
  independientes.
- El M.C.D. entre $(x - 1)^3$ y $(x - 1)^2$ es $(x - 1)^5$ al sumar los exponentes.
- Si dos polinomios no tienen coeficientes numéricos divisibles, su M.C.D. es necesariamente
  1.
- El M.C.D. de $x^2 + 4$ y $x + 2$ es $x + 2$.
afirmaciones_verdaderas:
- Para calcular el M.C.D. entre polinomios es indispensable expresar previamente cada
  polinomio como un producto de factores irreductibles.
- El M.C.D. de dos o más polinomios está formado por el producto de los factores comunes
  tomados con su menor exponente.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular el M.C.D. entre
  polinomios mediante técnicas de factorización e identificar el divisor común de
  mayor grado.
