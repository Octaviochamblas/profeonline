procedimiento:
- 'Paso 1: Factoriza completamente cada uno de los polinomios dados (usa factor común,
  TCP, etc.).'
- 'Paso 2: Trata cada paréntesis (binomio o trinomio irreducible) como si fuera una
  sola ''letra''.'
- 'Paso 3: Identifica los paréntesis que estén presentes en TODAS las factorizaciones.'
- 'Paso 4: Escribe el MCD con los paréntesis comunes elevados al menor exponente en
  que aparecen.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cálculo del m.c.d. entre polinomios mediante factorización.
ejemplos:
- titulo: Halla el MCD de $A = (x-1)^3(x+5)$ y $B = (x-1)^2(x+5)^2(x-3)$
  enunciado: Halla el MCD de $A = (x-1)^3(x+5)$ y $B = (x-1)^2(x+5)^2(x-3)$.
  solucion_pasos:
  - Ambos ya están factorizados.
  - 'Factores comunes: $(x-1)$ y $(x+5)$.'
  - 'Menor exp de $(x-1)$: 2. Menor exp de $(x+5)$: 1.'
  - 'MCD: $(x-1)^2(x+5)$.'
- titulo: MCD entre $x^2+x$ y $x^2-1$.
  solucion_pasos:
  - x^2+x = x(x+1). x^2-1 = (x+1)(x-1). El único factor común es (x+1).
- titulo: 'Respecto de «Cálculo del M.C.D. entre polinomios mediante factorización»:
    ¿Es correcta esta'
  enunciado: 'Respecto de «Cálculo del M.C.D. entre polinomios mediante factorización»:
    ¿Es correcta esta caracterización? «Para hallar el MCD de varios polinomios, primero
    se factorizan por completo»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para hallar el MCD de varios
    polinomios, primero se factorizan por completo.'
- titulo: 'Respecto de «Cálculo del M.C.D. entre polinomios mediante factorización»:
    ¿Es válida esta af'
  enunciado: 'Respecto de «Cálculo del M.C.D. entre polinomios mediante factorización»:
    ¿Es válida esta afirmación? «Intentar sacar el MCD mirando el polinomio sin factorizar
    (ej. tratar de buscar la letra ''x'' con el menor exponente en una suma, lo cual
    es matemáticamente falso)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para hallar el MCD de varios
    polinomios, primero se factorizan por completo.'
errores_frecuentes:
- Intentar sacar el MCD mirando el polinomio sin factorizar (ej. tratar de buscar
  la letra 'x' con el menor exponente en una suma, lo cual es matemáticamente falso).
- Creer que $(x+2)$ y $(x-2)$ son el mismo factor y combinarlos.
- Para «Para poder calcular el MCD de dos polinomios, el paso previo absolutamente
  necesario es:», la respuesta correcta es Multiplicarlos.
- Para «Para poder calcular el MCD de dos polinomios, el paso previo absolutamente
  necesario es:», la respuesta correcta es Sumarlos.
- Dividirlos sintéticamente.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando cálculo
  del m.c.d. entre polinomios mediante factorización.
