semantic_id: MAT.ALG.MCD_ALGEBRAICO.FACTORIZACION_POLINOMIOS
resumen_inicial: 'El cálculo del M.C.D. entre polinomios mediante factorización consiste en descomponer cada polinomio en el producto de sus factores primos e identificar el producto de los factores compartidos elevados a su menor exponente.'
explicacion_simple: |
  Para hallar el **M.C.D. entre polinomios** (ej: $P(x) = x^2 - 9$ y $Q(x) = x^2 - 6x + 9$):
  - **MÉTODO DE FACTORIZACIÓN EN 3 PASOS**:
    1. **Factoriza por completo cada uno de los polinomios**:
       - $P(x) = x^2 - 9 = \mathbf{(x + 3)(x - 3)}$ (¡Diferencia de cuadrados!).
       - $Q(x) = x^2 - 6x + 9 = \mathbf{(x - 3)^2}$ (¡Trinomio cuadrado perfecto!).
    2. **Busca los factores binómicos COMUNES A TODOS los polinomios**:
       - El factor $(x - 3)$ está en $P(x)$ y en $Q(x)$.
       - El factor $(x + 3)$ sólo está en $P(x) \implies$ ¡Se descarta!
    3. **Selecciona la potencia de MENOR exponente**:
       - En $P(x)$ la potencia de $(x - 3)$ es $1$.
       - En $Q(x)$ la potencia de $(x - 3)$ es $2$.
       - Menor exponente = $1 \implies \mathbf{\text{M.C.D.} = (x - 3)}$.
explicacion_formal: |
  ### Definición formal
  Sean $P_1(x), P_2(x), \dots, P_k(x) \in \mathbb{K}[x]$ polinomios no nulos sobre un cuerpo $\mathbb{K}$. Puesto que $\mathbb{K}[x]$ es un **Dominio de Ideales Principales (DIP)** y un **Dominio de Factorización Única (DFU)**, cada polinomio $P_i(x)$ se descompone en producto de factores primos irreducibles:

  $$P_i(x) = c_i \prod_{j=1}^m [F_j(x)]^{e_{i,j}}$$

  donde $c_i \in \mathbb{K} \setminus \{0\}$, $F_j(x)$ son polinomios primos irreducibles mónicos y $e_{i,j} \ge 0$. El **M.C.D. polinomial por factorización** es el producto:

  $$\operatorname{MCD}(P_1, P_2, \dots, P_k) = \operatorname{MCD}(c_1, \dots, c_k) \cdot \prod_{j=1}^m [F_j(x)]^{\min_i(e_{i,j})}$$

  ### Criterio de Irreducibilidad
  Los factores $F_j(x)$ seleccionados no admiten más simplificaciones sobre el cuerpo $\mathbb{K}$ (por ejemplo, trinomios con discriminante negativo sobre $\mathbb{R}$).

  ### Síntesis didáctica
  Factorizar completamente los polinomios expone sus componentes irreducibles, permitiendo construir el M.C.D. seleccionando los bloques comunes con su menor exponente.
definiciones_clave: |
  - **M.C.D. de polinomios por factorización**: Algoritmo que calcula el M.C.D. descomponiendo los polinomios en factores irreducibles.
  - **Factores irreducibles primos ($F_j(x)$)**: Polinomios que no pueden descomponerse en producto de factores de menor grado sobre el cuerpo dado.
  - **Exponentes de factores polinómicos ($\min(e_j)$)**: Potencia mínima a la que aparece un paréntesis o factor primo en la descomposición de todos los polinomios.
propiedades_relaciones: |
  - **Conservación de la divisibilidad**: Todo polinomio factor que divide al M.C.D. divide automáticamente a cada uno de los polinomios originales $P_i(x)$.
ejemplo_guiado:
  enunciado: 'Calcula el M.C.D. entre los polinomios $P(x) = x^3 - 4x$ y $Q(x) = x^2 - 4x + 4$.'
  pasos:
    - 'Paso 1: Factorizamos completamente el polinomio $P(x)$:
       - Extraemos factor común $x$: $x(x^2 - 4)$.
       - Factorizamos la diferencia de cuadrados: $P(x) = \mathbf{x(x + 2)(x - 2)}$.'
    - 'Paso 2: Factorizamos completamente el polinomio $Q(x)$:
       - Es un trinomio cuadrado perfecto: $Q(x) = \mathbf{(x - 2)^2}$.'
    - 'Paso 3: Identificamos los factores comunes a ambos polinomios:
       - Factor $x$: sólo en $P(x) \implies$ **se descarta**.
       - Factor $(x + 2)$: sólo en $P(x) \implies$ **se descarta**.
       - Factor $(x - 2)$: presente en $P(x)$ y $Q(x) \implies$ **¡Es común!**'
    - 'Paso 4: Seleccionamos el menor exponente de $(x - 2)$:
       - En $P(x)$ tiene exponente $1$.
       - En $Q(x)$ tiene exponente $2$.
       - Menor exponente = $1 \implies (x - 2)^1 = (x - 2)$.'
    - 'Conclusión: El M.C.D. entre los dos polinomios es **$(x - 2)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el M.C.D. entre los polinomios $A(x) = x^2 - 1$ y $B(x) = x^2 + 2x + 1$?'
    choices:
      - {text: 'El M.C.D. es $(x + 1)$, factorizando $A(x) = (x+1)(x-1)$ y $B(x) = (x+1)^2$, tomando el común con menor exponente $(x+1)^1$', is_correct: true}
      - {text: 'El M.C.D. es $(x - 1)$', is_correct: false}
      - {text: 'El M.C.D. es $(x + 1)^2$', is_correct: false}
      - {text: 'El M.C.D. es $(x^2 - 1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El M.C.D. es $(x + 1)$, factorizando $A(x) = (x+1)(x-1)$ y $B(x) = (x+1)^2$, tomando el común con menor exponente $(x+1)^1$''. $A(x)=(x+1)(x-1), B(x)=(x+1)^2 \implies \operatorname{MCD}=(x+1)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al factorar dos polinomios no se encuentra ningún factor en común entre ellos, ¿cuál es el resultado del M.C.D.?'
    choices:
      - {text: 'El M.C.D. es 1', is_correct: true}
      - {text: 'El M.C.D. es 0', is_correct: false}
      - {text: 'El M.C.D. es x', is_correct: false}
      - {text: 'No se puede calcular', is_correct: false}
    explanation: 'La alternativa correcta es ''El M.C.D. es 1''. Sin factores comunes compartidos, el único divisor común es la constante 1.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar completamente cada uno de los polinomios dados utilizando técnicas de factor común, cuadrados, trinomios o Ruffini.'
  - 'Paso 2: Listar todos los factores binómicos o polinómicos primos obtenidos en las descomposiciónes.'
  - 'Paso 3: Seleccionar únicamente los factores que aparezcan en todos los polinomios.'
  - 'Paso 4: Elevar cada factor común a su menor exponente y multiplicarlos para formar el M.C.D.'
errores_correccion: |
  - **Error 1:** Intentar calcular el M.C.D. antes de haber factorizado completamente los polinomios. **Cómo corregirlo:** Se debe **FACTORIZAR TOTALMENTE CADA POLINOMIO HASTA SUS FACTORES PRIMOS IRREDUCIBLES ANTES DE COMPARAR**.
  - **Error 2:** Incluir en el M.C.D. un factor que sólo está en un polinomio pero no en todos. **Cómo corregirlo:** Para el M.C.D. **SE DESCARTAN TODOS LOS FACTORES QUE NO SEAN COMPARTIDOS POR LA TOTALIDAD DE LOS POLINOMIOS**.
ejemplos:
  - titulo: 'Diferencia de cuadrados y TCP'
    enunciado: 'Para $x^2 - 4$ y $x^2 - 4x + 4$, ¿es el M.C.D. $(x - 2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(x+2)(x-2)$ y $(x-2)^2 \implies (x-2)$.'
  - titulo: 'Factor común previo'
    enunciado: 'Para $x^2 + x$ y $x^2 - 1$, ¿es el M.C.D. $(x + 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $x(x+1)$ y $(x+1)(x-1) \implies (x+1)$.'
  - titulo: 'Polinomios sin factores comunes'
    enunciado: 'Para $x^2 - 9$ y $x^2 + 4$, ¿es su M.C.D. igual a 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, son coprimos.'
  - titulo: 'Monomio exterior común'
    enunciado: 'Para $2x(x - 1)$ y $4x(x + 3)$, ¿es el M.C.D. $2x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{MCD}(2,4)=2$ y letra común $x$.'
errores_frecuentes:
  - 'Intentar hallar el M.C.D. observando los términos sin factorizar los polinomios previamente.'
  - 'Incluir factores no comunes en la expresión final del M.C.D. polinomial.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Tomar la potencia con el mayor exponente de los factores comunes en lugar de la menor.'
  - 'El factor común numérico o monómico no es extraído antes de factorizar el polinomio cuadrático.'
afirmaciones_verdaderas:
  - 'El M.C.D. entre polinomios exige factorizar cada expresión hasta sus factores primos irreducibles.'
  - 'Se forma multiplicando los factores comunes elevados a su menor exponente.'
al_terminar_debes_poder: 'Calcular el M.C.D. entre polinomios factorizándolos completamente en factores primos.'
