semantic_id: MAT.ALG.MCD_ALGEBRAICO.FACTORIZACION_POLINOMIOS
resumen_inicial: 'Cálculo del M.C.D. entre polinomios mediante factorización: concepto,
  reglas operativas y simplificación en M.C.D. algebraico.'
explicacion_simple: Para hallar el MCD de expresiones más grandes que un monomio,
  primero debemos 'desarmarlas'. Así como descomponemos un número en primos, debemos
  factorizar los polinomios. Una vez factorizados, la regla es exactamente la misma
  que vimos antes.
explicacion_formal: '### Definición formal


  El MCD requiere conocer los factores base de cada expresión, lo cual exige factorización.


  ### Desarrollo didáctico


  Cuando las expresiones ya no son simples monomios, sino polinomios completos (sumas
  y restas), el proceso tiene un paso inicial obligatorio: **Factorizar cada polinomio
  al máximo**.


  No puedes hallar el MCD de polinomios mirándolos directamente. Debes descomponerlos
  en sus ''ladrillos'' fundamentales (factores).


  Ejemplo:

  - Polinomio 1: $x^2 - 4$. Su factorización (diferencia de cuadrados) es $(x-2)(x+2)$.

  - Polinomio 2: $x^2 - 4x + 4$. Su factorización (cuadrado de binomio) es $(x-2)^2$.


  Ahora aplicamos la regla de oro del MCD a los paréntesis como si fueran letras simples:

  1. **Factor común:** El único paréntesis que se repite en ambos es $(x-2)$.

  2. **Menor exponente:** En el P1 está elevado a 1. En el P2 está elevado a 2. El
  menor es 1.


  El MCD de estos dos polinomios es **$(x-2)$**.'
definiciones_clave: '- **Cálculo del M.C.D. entre polinomios mediante factorización**:
  Procedimiento o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a cálculo del m.c.d. entre polinomios
  mediante factorización.'
ejemplo_guiado:
  enunciado: Simplifica o resuelve la expresión aplicando cálculo del m.c.d. entre
    polinomios mediante factorización.
  pasos:
  - Factorizar los numeradores y denominadores involucrados.
  - Identificar restricciones del dominio (denominador no nulo).
  - Aplicar la regla o procedimiento correspondiente a cálculo del m.c.d. entre polinomios
    mediante factorización.
  - Simplificar los factores comunes y escribir el resultado final irreducible.
