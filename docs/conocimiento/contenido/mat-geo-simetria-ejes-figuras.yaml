semantic_id: MAT.GEO.SIMETRIAS.EJES_FIGURAS
resumen_inicial: 'Identificación de ejes de simetría en figuras planas: conceptos,
  teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Un eje de simetría es como una línea de ''doblado perfecto'':
  si doblas la figura por esa línea, ambas mitades coinciden exactamente.'
explicacion_formal: '![Identificación de ejes de simetría en figuras planas](/static/img/geometria/isometrias/simetria-ejes-figuras.svg)


  ### Definición formal


  Una recta $L$ es un eje de simetría de una figura $F$ si al aplicar la simetría
  axial respecto de $L$, la imagen de $F$ coincide exactamente con $F$ misma.


  ### Desarrollo didáctico


  En la figura, el triángulo isósceles tiene un eje de simetría vertical que pasa
  por el vértice superior y el punto medio de la base opuesta: al reflejar el triángulo
  respecto de esa recta, se obtiene el mismo triángulo.'
definiciones_clave: '- **Identificación de ejes de simetría en figuras planas**: Elemento
  o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de ejes de simetría en figuras
  planas.'
