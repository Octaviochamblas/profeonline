semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.VALIDEZ_RADIO_REAL
resumen_inicial: 'Verificación de validez de una circunferencia mediante radio real
  positivo: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: 'No toda ecuación con la estructura de una circunferencia representa
  realmente una: si al completar cuadrados el resultado no es positivo, no existe
  ninguna figura real (o se reduce a un solo punto).'
explicacion_formal: '![Validez de una circunferencia real](/static/img/geometria/analitica/circanal-validez-radio-real.svg)


  ### Definición formal


  Después de completar cuadrados, si el término derecho de la ecuación resulta ser
  positivo, existe una circunferencia real con ese centro y ese radio. Si es cero,
  la ecuación representa solo el punto (h,k). Si es negativo, no existe ninguna solución
  real.


  ### Desarrollo didáctico


  La ecuación $x^2+y^2-2x-2y+3=0$ se completa como $(x-1)^2+(y-1)^2=-1$, un resultado
  negativo: esta ecuación no representa ninguna circunferencia real, ya que no existen
  valores reales de x e y que la satisfagan.'
definiciones_clave: '- **Verificación de validez de una circunferencia mediante radio
