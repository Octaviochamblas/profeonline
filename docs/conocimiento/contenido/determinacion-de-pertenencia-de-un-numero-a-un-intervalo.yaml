semantic_id: MAT.ALG.INTERVALOS.PERTENENCIA_INTERVALO
resumen_inicial: Determinar si un número pertenece a un intervalo consiste en evaluar si satisface las desigualdades límites del intervalo.
explicacion_simple: '![Determinación de pertenencia de un número a un intervalo](/static/img/nodos/determinacion-de-pertenencia-de-un-numero-a-un-intervalo-intro.svg)


  Para saber si un número específico $k$ entra dentro de un intervalo como $]-3, 4]$:

  1. Comprobamos si es strictly mayor que el límite inferior ($-3 < k$).

  2. Comprobamos si es menor o igual al límite superior ($k \le 4$).

  Si ambas pruebas resultan verdaderas, entonces el número $k$ pertenece al intervalo ($k \in ]-3, 4]$).'
explicacion_formal: 'Sea el intervalo $I = ]a, b]$ y una constante real $k \in \mathbb{R}$. La **pertenencia formal** se define como:

  $$k \in ]a, b] \iff a < k \le b$$

  $$k \notin ]a, b] \iff (k \le a) \lor (k > b)$$

  **Desglose de la fórmula:**

  - $k \in I$: Símbolo de pertenencia de conjuntos que exige satisfacer las cotas inferior y superior.

  '
definiciones_clave: '- **Pertenencia a un intervalo ($k \in I$)**: Relación lógica que afirma que $k$ es uno de los elementos del intervalo.

  '
propiedades_relaciones: '- **Verificación de bordes**: En intervalos semiabiertos, probar el número exacto del borde abierto devuelve una falsedad ($a \notin ]a, b]$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Determinación de pertenencia de un número a un intervalo](/static/img/nodos/determinacion-de-pertenencia-de-un-numero-a-un-intervalo-ejemplos.svg)


    Determina si los números $k_1 = -3$, $k_2 = 0$ y $k_3 = 4$ pertenecen al intervalo $]-3, 4]$.'
  pasos:
  - 'Paso 1: Evaluar $k_1 = -3$: $-3 < -3$ es falso $\implies -3 \notin ]-3, 4]$.'
  - 'Paso 2: Evaluar $k_2 = 0$: $-3 < 0 \le 4$ es verdadero $\implies 0 \in ]-3, 4]$.'
  - 'Paso 3: Evaluar $k_3 = 4$: $-3 < 4 \le 4$ es verdadero $\implies 4 \in ]-3, 4]$.'
  - 'Paso 4: Concluir que $0$ y $4$ pertenecen al intervalo, mientras que $-3$ no pertenece.'
checkpoints:
- placement: after_explicacion_formal
  question: Para el intervalo $]-3, 4]$, ¿cuál de los siguientes números NO pertenece al conjunto?
  choices:
  - text: $-3$
    is_correct: true
  - text: $0$
    is_correct: false
  - text: $2$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$-3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar el extremo $k = 4$ en $]-3, 4]$, ¿por qué SI pertenece al intervalo?
  choices:
  - text: Porque el intervalo es cerrado por la derecha e incluye al número 4.
    is_correct: true
  - text: Porque 4 es mayor que 10.
    is_correct: false
  - text: Porque es un número entero positivo.
    is_correct: false
  - text: Porque todos los números pertenecen a todos los intervalos.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el intervalo es cerrado por la derecha e incluye al número 4.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la relación de desigualdad del intervalo (ejemplo: $a < x \le b$).'
- 'Paso 2: Reemplazar la $x$ por el número candidato $k$.'
- 'Paso 3: Verificar la veracidad de la desigualdad doble resultante.'
- 'Paso 4: Escribir $k \in I$ si es verdadero o $k \notin I$ si es falso.'
errores_correccion: '- **Error común:** Afirmar que el borde de un lado abierto pertenece al intervalo.

  - **Cómo corregirlo:** Si el corchete apunta hacia afuera $]$, el borde NO pertenece al intervalo.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- El número $-3$ pertenece al intervalo semiabierto $]-3, 4]$.
- La proposición de pertenencia $k \in ]a, b]$ equivale al sistema de desigualdades no estrictas $a \le k \le b$.
- El número $4$ no pertenece al intervalo semiabierto $]-3, 4]$ por ser el límite superior.
- Evaluar la pertenencia del número $k = 5$ en el intervalo $]-3, 4]$ resulta en una afirmación verdadera.
- El corchete invertido $]$ en el extremo izquierdo de $]-3, 4]$ exige que $-3$ sea parte de los elementos del conjunto.
afirmaciones_verdaderas:
- Un número real $k$ pertenece al intervalo semiabierto $]a, b]$ si y solo si cumple la desigualdad $a < k \le b$.
- El extremo correspondiente a un corchete invertido hacia afuera $]$ o $[$ no pertenece al conjunto.
al_terminar_debes_poder: '**QUÉ:** Determinar si un número real pertenece a un intervalo determinado.


  **CÓMO:** Evaluando si el valor numérico satisface la desigualdad asociada y verificando el estado de inclusión en los extremos frontera.


