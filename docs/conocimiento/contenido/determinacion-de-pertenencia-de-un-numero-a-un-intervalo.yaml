semantic_id: MAT.ALG.INTERVALOS.PERTENENCIA_INTERVALO
resumen_inicial: 'Determinación de pertenencia de un número a un intervalo: relaciones
  de orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Evaluar si un valor específico es parte de un conjunto definido
  por un intervalo es una tarea básica en la resolución de inecuaciones y el análisis
  de dominios.
explicacion_formal: '### Definición formal

  Dado un número real $x_0$ y un intervalo $I \subseteq \mathbb{R}$, se dice que $x_0
  \in I$ si $x_0$ satisface las condiciones de acotación del intervalo. Por ejemplo,
  si $I = [a, b[$, entonces $x_0 \in I$ si y solo si $a \leq x_0 < b$. Si esta condición
  no se cumple, entonces $x_0 \notin I$.


  ### Desarrollo didáctico

  Para saber si un número ''vive'' dentro de un intervalo, debemos revisar las reglas
  de entrada de ese intervalo. Si pensamos en el intervalo como un rango de edades
  para entrar a un evento, los corchetes hacia adentro significan que esa edad exacta
  puede entrar, mientras que los corchetes hacia afuera indican que esa edad se queda
  fuera. Solo debemos tomar el número en cuestión y comprobar si su valor numérico
  cae en el segmento delimitado.'
definiciones_clave: '- **Determinación de pertenencia de un número a un intervalo**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a determinación de pertenencia de un número
  a un intervalo.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de determinación
    de pertenencia de un número a un intervalo.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de determinación de pertenencia de un número
    a un intervalo, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
