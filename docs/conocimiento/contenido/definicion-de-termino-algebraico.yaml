resumen_inicial: Un término algebraico es una expresión formada por la multiplicación
  y/o división de coeficientes numéricos y variables literales sin intervención de
  sumas o restas entre ellos.
explicacion_simple: Un término algebraico es como un 'bloque único' de construcción
  matemática. Puede tener un signo, un número y varias letras elevadas a exponentes
  (como $-5x^3y^2$), pero todo está unido por multiplicación. Si aparece una suma
  o una resta (como en $3x + 2y$), ya no tenemos un solo término, sino dos términos
  distintos.
explicacion_formal: 'En el anillo de polinomios $\mathbb{R}[x_1, \dots, x_m]$, un
  **Término Algebraico** o **Monomio primario** $T$ se define formalmente como la
  expresión multiplicativa única:


  $$T = c \cdot \prod_{j=1}^m x_j^{e_j} = c x_1^{e_1} x_2^{e_2} \dots x_m^{e_m}$$


  **Donde:**

  - $c \in \mathbb{R}$: Coeficiente numérico constante escalar.

  - $x_j$: Variables o bases literales del término.

  - $e_j \in \mathbb{N}_0$: Exponentes enteros no negativos que determinan la potencia
  de cada variable.


  > **Complemento didáctico:** El término algebraico constituye la unidad atómica
  irreducible de la estructura aditiva del polinomio.'
definiciones_clave: '- **Término algebraico**: Bloque único unificado por multiplicación/división
  entre constantes y variables.

  - **Monomio**: Término algebraico con exponentes enteros no negativos.'
propiedades_relaciones: '- **Ausencia de operadores aditivos**: Los signos $+$ o $-$
  dentro de un término solo pertenecen al signo del coeficiente escalar.'
ejemplo_guiado:
  enunciado: Identifique los componentes del término algebraico $T = -7x^4y^3$.
  pasos:
  - 'Paso 1: Identificar el signo del término: Signo negativo ($-$).'
  - 'Paso 2: Identificar el coeficiente numérico: $c = -7$.'
  - 'Paso 3: Identificar las variables de la parte literal: $x$ e $y$.'
  - 'Paso 4: Identificar los exponentes respectivos: Exponente de $x$ es $4$, exponente
    de $y$ es $3$.'
  - 'Conclusión: $-7x^4y^3$ es un término algebraico único de coeficiente $-7$ y parte
    literal $x^4y^3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué característica define a un término algebraico único frente a una
    expresión multitérmino?
  choices:
  - text: Que sus componentes numéricos y literales están unificados exclusivamente
      por multiplicación y/o división sin sumas o restas
    is_correct: true
  - text: Que siempre contiene exactamente dos letras
    is_correct: false
  - text: Que su signo es obligatoriamente positivo
    is_correct: false
  - text: Que el coeficiente es igual a 100
    is_correct: false
  explanation: La alternativa correcta es 'Que sus componentes numéricos y literales
    están unificados exclusivamente por multiplicación y/o división sin sumas o restas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el término -7x^4y^3, ¿cuál fue su coeficiente
    numérico?
  choices:
  - text: '-7'
    is_correct: true
  - text: '7'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '12'
    is_correct: false
  explanation: La alternativa correcta es '-7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que no existan signos $+$ o $-$ separando variables de coeficientes.'
- 'Paso 2: Separar el signo y el coeficiente escalar de la parte literal.'
- 'Paso 3: Expresar el término en notación estándar multiplicativa $c x_1^{e_1} \dots
  x_m^{e_m}$.'
errores_correccion: '- **Error 1: Considerar la expresión $3x + 4$ como un solo término
  algebraico.** **Cómo corregirlo:** El signo $+$ separa la expresión en dos términos
  independientes ($3x$ y $+4$).


  - **Error 2: Pensar que si no hay un número escrito delante de las letras no existe
  coeficiente.** **Cómo corregirlo:** Una expresión como $xy$ posee coeficiente numérico
  implícito igual a $1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes expresiones representa un único término algebraico?
  alternativas:
  - -8x^3y^2
  - 5x + 3y
  - x^2 - 4
  - a + b + c
  respuesta: -8x^3y^2
  solucion_pasos:
  - 1. -8x^3y^2 no contiene signos + o - separando letras. Es un solo término algebraico.
  - 2. Las demás contienen sumas o restas que las dividen en 2 o más términos.
- titulo: Ejemplo 2
  enunciado: En el término algebraico (2/5)a^3b^4, ¿cuál es la parte literal?
  alternativas:
  - a^3b^4
  - 2/5
  - '3'
  - '7'
  respuesta: a^3b^4
  solucion_pasos:
  - '1. Coeficiente: 2/5.'
  - '2. Parte literal (variables con sus exponentes): a^3b^4.'
- titulo: ¿Es la expresión -6a^2b^5 un término algebraico único?
  respuesta: Sí
  solucion_pasos:
  - Sí, sus elementos están integrados exclusivamente por multiplicación.
- titulo: ¿Es la expresión 4x + 9y un solo término algebraico?
  respuesta: 'No'
  solucion_pasos:
  - 'No, el operador suma + la divide en dos términos distintos: 4x y +9y.'
errores_frecuentes:
- Declarar una expresión con sumas o restas (como x + y) como si fuera un solo término
  algebraico.
- Declarar que un término como x^3 no posee coeficiente numérico al no llevar número
  escrito.
- Incluir los exponentes de las letras como parte del coeficiente numérico del término.
- Declarar que un término algebraico debe tener obligatoriamente un signo negativo
  para ser válido.
- Intentar al signo menos de un coeficiente como un término independiente separado.
afirmaciones_verdaderas:
- Un término algebraico unifica coeficientes y variables mediante multiplicación sin
  sumas o restas intermedias.
- Si una parte literal no lleva coeficiente explícito, su coeficiente numérico es
  igual a 1.
al_terminar_debes_poder: Al terminar serás capaz de identificar un término algebraico
  separando sus coeficientes y variables de expresiones multitérmino.
