semantic_id: MAT.ALG.TERMINO.DEFINICION_TERMINO
resumen_inicial: 'Un término algebraico es una expresión elemental compuesta por el producto o cociente entre un coeficiente numérico y una parte literal, sin operaciones de suma o resta entre sus elementos.'
explicacion_simple: |
  Un **término algebraico** (o monomio) es el bloque de construcción fundamental del álgebra:
  - Es una "pieza de construcción" única donde los números y las letras están **pegados únicamente por multiplicación o división**.
  - Por ejemplo, $-5x^2 y^3$ es un solo término algebraico.
  - Consta de 4 componentes esenciales:
    1. **Signo**: Positivo ($+$) o negativo ($-$).
    2. **Coeficiente numérico**: El número que multiplica ($-5$).
    3. **Parte literal**: Las letras que representan variables ($x^2 y^3$).
    4. **Exponentes**: Los números pequeños que indican la potencia de cada letra ($2$ y $3$).
  - **¡Importante!** Si aparece un signo de suma ($+$) o resta ($-$) separando partes de una expresión (como en $3x + 4y$), ya no es un solo término, sino dos términos distintos unidos.
explicacion_formal: |
  ### Definición formal
  Un **término algebraico** es un monomio $M(x_1, \dots, x_k) \in \mathbb{R}[x_1, \dots, x_k]$ definido por la estructura multiplicativa escalar-literal:

  $$M(x_1, x_2, \dots, x_k) = c \cdot x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$$

  donde $c \in \mathbb{R}$ es el coeficiente numérico escalar (que incorpora el signo), $x_i$ son las variables literales y $\alpha_i \in \mathbb{N}_0$ son los exponentes enteros no negativos.

  ### Análisis Estructural del Término

  $$\underbrace{-}_{\text{Signo}} \quad \underbrace{7}_{\text{Coeficiente}} \quad \underbrace{x^3 y^2}_{\text{Parte Literal con Exponentes}}$$

  ### Síntesis didáctica
  Un término algebraico constituye una unidad indivisible frente a la adición o sustracción: toda operación interna es exclusivamente multiplicativa o exponencial.
definiciones_clave: |
  - **Término algebraico (Monomio)**: Expresión algebraica formada por un coeficiente escalar y una parte literal unida únicamente por multiplicación o división.
  - **Coeficiente numérico**: Factor escalar constante (con su signo) que multiplica a la parte literal.
  - **Parte literal**: Conjunto de variables con sus respectivos exponentes que acompañan al coeficiente numérico.
propiedades_relaciones: |
  - **Unidad irreducible de suma**: Los términos algebraicos se separan entre sí mediante los operadores de adición ($+$) y sustracción ($-$).
  - **Términos semejantes**: Dos o más términos algebraicos son semejantes si y solo si poseen **exactamente la misma parte literal** (mismas variables con los mismos exponentes).
ejemplo_guiado:
  enunciado: 'Dada la expresión $-8a^3 b$, identifica detalladamente cada uno de los 4 componentes estructurales de este término algebraico.'
  pasos:
    - 'Paso 1: Identificamos el **signo** del término: Es negativo ($-$).'
    - 'Paso 2: Identificamos el **coeficiente numérico**: Es el número $8$ (o $-8$ al incluir el signo).'
    - 'Paso 3: Identificamos la **parte literal**: Corresponde a los símbolos variables $a^3 b$.'
    - 'Paso 4: Identificamos los **exponentes** de cada letra: La letra $a$ tiene exponente $3$ y la letra $b$ tiene exponente implícito $1$.'
    - 'Conclusión: El signo es **$-$**, el coeficiente es **$-8$**, la parte literal es **$a^3 b$** y los exponentes son **$3$ y $1$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación aritmética NO puede existir dentro de la estructura interna de un solo término algebraico?'
    choices:
      - {text: 'La adición o sustracción entre sus elementos', is_correct: true}
      - {text: 'La multiplicación del coeficiente por las letras', is_correct: false}
      - {text: 'La elevación de una letra a un exponente entero', is_correct: false}
      - {text: 'La división del coeficiente entre un número fijo', is_correct: false}
    explanation: 'La alternativa correcta es ''La adición o sustracción entre sus elementos''. La suma o resta separa términos diferentes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término algebraico $-4x^2 y^5$, ¿cuál es su coeficiente numérico y cuál es su parte literal?'
    choices:
      - {text: 'El coeficiente numérico es $-4$ y la parte literal es $x^2 y^5$', is_correct: true}
      - {text: 'El coeficiente numérico es $x^2$ y la parte literal es $-4y^5$', is_correct: false}
      - {text: 'El coeficiente numérico es $2$ y la parte literal es $5$', is_correct: false}
      - {text: 'El término carece de coeficiente numérico', is_correct: false}
    explanation: 'La alternativa correcta es ''El coeficiente numérico es $-4$ y la parte literal es $x^2 y^5$''. $-4$ es el escalar y $x^2 y^5$ la parte literal.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que la expresión no contenga signos de suma ($+$) o resta ($-$) que dividan la parte literal.'
  - 'Paso 2: Aislar el signo principal ($+$ o $-$) ubicado a la izquierda del término.'
  - 'Paso 3: Identificar la cifra o escalar numérico (coeficiente).'
  - 'Paso 4: Extraer el bloque de variables con sus respectivos exponentes (parte literal).'
errores_correccion: |
  - **Error 1:** Considerar que una expresión como $3x + 2y$ constituye un solo término algebraico. **Cómo corregirlo:** El signo de adición $+$ **separa la expresión en dos términos distintos** ($3x$ y $2y$).
  - **Error 2:** Excluir el signo negativo al nombrar el coeficiente numérico (ej: declarar que en $-6x$ el coeficiente es $6$). **Cómo corregirlo:** El signo negativo **forma parte del coeficiente numérico** (el coeficiente es $-6$).
ejemplos:
  - titulo: 'Reconocimiento de término único'
    enunciado: '¿Cuál de las siguientes expresiones corresponde a un único término algebraico?'
    alternativas:
      - '$-9a^2 b^4$'
      - '$9a^2 + b^4$'
      - '$9a - b$'
    respuesta: '$-9a^2 b^4$'
    solucion_pasos:
      - '1. $-9a^2 b^4$ no posee sumas o restas internas.'
      - '2. Es un único término algebraico (monomio).'
  - titulo: 'Identificación de componentes'
    enunciado: 'En el término $12m^3 n$, ¿cuál es el coeficiente numérico y cuál la parte literal?'
    alternativas:
      - 'Coeficiente $12$, parte literal $m^3 n$'
      - 'Coeficiente $m^3$, parte literal $12n$'
      - 'Coeficiente $3$, parte literal $mn$'
    respuesta: 'Coeficiente $12$, parte literal $m^3 n$'
    solucion_pasos:
      - '1. $12$ es la cifra constante multiplicativa.'
      - '2. $m^3 n$ es el bloque de variables con exponentes.'
  - titulo: 'Término algebraico sin signo explícito'
    enunciado: 'En el término $5x^3$, ¿el signo implícito del término es positivo ($+$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ante la falta de un signo negativo inicial, se entiende que el signo es $+$.'
  - titulo: 'Separación por operador suma'
    enunciado: 'La expresión $4x + 7y$, ¿está compuesta por dos términos algebraicos llamados binomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el signo $+$ separa la expresión en el término $4x$ y el término $7y$.'
errores_frecuentes:
  - 'Los signos de adición y sustracción forman parte de la estructura interna de un único término algebraico.'
  - 'El coeficiente numérico de un término algebraico sólo incluye la cifra sin su signo negativo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Una letra sin exponente escrito tiene un exponente igual a cero.'
  - 'Multiplicar dos términos algebraicos exige que ambos posean la misma parte literal.'
afirmaciones_verdaderas:
  - 'Un término algebraico es una expresión donde los números y las letras están unidos exclusivamente por multiplicación o división.'
  - 'Los términos algebraicos dentro de una expresión compuesta se reconocen porque se encuentran separados por signos de suma ($+$) o resta ($-$).'
al_terminar_debes_poder: 'Definir un término algebraico e identificar sus cuatro componentes estructurales (signo, coeficiente numérico, parte literal y exponentes).'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Nomenclatura.'
