semantic_id: MAT.ALG.TERMINO.DEFINICION_TERMINO
resumen_inicial: 'Un término algebraico es una expresión matemática elemental formada por el producto y cociente de números y letras, sin signos de adición o sustracción que separen sus componentes.'
explicacion_simple: |
  - Un **término algebraico** es un bloque básico indivisible en álgebra, compuesto exclusivamente por números y letras multiplicados entre sí.
  - Por ejemplo, en $-5x^3y^2$, no hay sumas ni restas en su interior: todo el bloque actúa como una sola unidad multiplicativa.
  - Consta de **cuatro elementos fundamentales**:
    1. **Signo:** positivo ($+$) o negativo ($-$).
    2. **Coeficiente numérico:** el número que multiplica ($-5$).
    3. **Parte literal:** las letras o variables ($x, y$).
    4. **Exponentes:** las potencias a las que están elevadas las letras ($3$ y $2$).

  ![Definición de Término Algebraico](/static/img/nodos/definicion-de-termino-algebraico-intro.svg)
explicacion_formal: |
  ### Definición formal
  Un **término algebraico** (o monomio elemental) es una expresión algebraica estructurada como un producto de la forma:

  $$T = c \cdot x_1^{e_1} x_2^{e_2} \cdots x_k^{e_k}$$

  Donde:
  - $c \in \mathbb{R} \setminus \{0\}$ es el **coeficiente numérico**, portador del signo.
  - $x_i$ son las **variables literales**.
  - $e_i \in \mathbb{R}$ son los **exponentes** (en polinomios clásicos, $e_i \in \mathbb{N}_0$).
  - No existen operadores aditivos ($+$ o $-$) enlazando factores internos.
definiciones_clave: |
  - **Término algebraico**: Bloque elemental constituido por el producto de constantes y potencias de variables.
  - **Monomio**: Expresión algebraica compuesta por un único término con exponentes enteros no negativos.
  - **Estructura multiplicativa**: Unión de factores numéricos y literales mediante multiplicación implícita.
propiedades_relaciones: |
  - **Indivisibilidad aditiva**: La presencia de un signo $+$ o $-$ exterior divide la expresión en dos o más términos distintos (binomios, trinomios).
  - **Elemento base de polinomios**: Todo polinomio es la suma algebraica finita de dos o más términos algebraicos.
ejemplo_guiado:
  enunciado: 'Determina si la expresión $-7a^2b^3$ es un término algebraico e identifica cada uno de sus cuatro componentes fundamentales.'
  imagen: '/static/img/nodos/definicion-de-termino-algebraico-ejemplos.svg'
  pasos:
    - 'Paso 1: Verificamos si contiene sumas o restas internas: solo hay multiplicación entre $-7$, $a^2$ y $b^3$, por lo que **sí es un término algebraico**.'
    - 'Paso 2: Identificamos el **Signo**: es **negativo ($-$)**.'
    - 'Paso 3: Identificamos el **Coeficiente numérico**: es **$-7$** (magnitud $7$).'
    - 'Paso 4: Identificamos la **Parte literal**: es **$a^2b^3$**.'
    - 'Paso 5: Identificamos los **Exponentes**: el exponente de $a$ es **$2$** y el exponente de $b$ es **$3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones representa estrictamente un único término algebraico?'
    choices:
      - text: '$-4x^2y^3$'
        is_correct: true
      - text: '$2x + 3y$'
        is_correct: false
      - text: '$x^2 - 4x + 4$'
        is_correct: false
      - text: '$\frac{a + b}{c}$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$-4x^2y^3$''. No contiene operadores $+$ o $-$ que separen la expresión en múltiples términos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son los 4 componentes estructurales de todo término algebraico?'
    choices:
      - text: 'Signo, coeficiente numérico, parte literal y exponentes'
        is_correct: true
      - text: 'Numerador, denominador, raíz y logaritmo'
        is_correct: false
      - text: 'Suma, resta, multiplicación y división'
        is_correct: false
      - text: 'Base, altura, radio y perímetro'
        is_correct: false
    explanation: 'La alternativa correcta es ''Signo, coeficiente numérico, parte literal y exponentes''. Son las 4 partes canónicas que componen un término algebraico.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar la expresión para comprobar que no existan signos $+$ o $-$ conectando bloques.'
  - 'Paso 2: Extraer el signo del término ($+$ o $-$).'
  - 'Paso 3: Identificar el coeficiente numérico constante (con su signo).'
  - 'Paso 4: Aislar las letras con sus exponentes para definir la parte literal.'
errores_correccion: |
  - **Error 1:** Creer que $2x + 3$ es un solo término. **Cómo corregirlo:** El signo $+$ separa la expresión en **dos términos distintos**: $2x$ y $3$.
  - **Error 2:** Omitir el signo al enunciar el término. **Cómo corregirlo:** El signo forma parte inseparable del coeficiente numérico (ej. $-8x^2$).
ejemplos:
  - titulo: 'Identificación de componentes'
    enunciado: 'En el término $-\frac{3}{5}m^4n$, ¿cuál es el coeficiente numérico y la parte literal?'
    alternativas:
      - 'Coeficiente: $-\frac{3}{5}$; Parte literal: $m^4n$'
      - 'Coeficiente: $3$; Parte literal: $5m^4n$'
      - 'Coeficiente: $-3$; Parte literal: $m^4$'
    respuesta: 'Coeficiente: $-\frac{3}{5}$; Parte literal: $m^4n$'
    solucion_pasos:
      - '1. El factor numérico completo con su signo es $-\frac{3}{5}$.'
      - '2. El conjunto de variables con potencias es $m^4n$.'
  - titulo: 'Conteo de términos en una expresión'
    enunciado: '¿Cuántos términos algebraicos componen la expresión $3x^2y - 5xy + 8$?'
    alternativas:
      - '3 términos'
      - '1 término'
      - '5 términos'
    respuesta: '3 términos'
    solucion_pasos:
      - '1. Los signos $-$ y $+$ dividen la expresión en tres bloques:'
      - '2. $T_1 = 3x^2y$, $T_2 = -5xy$, $T_3 = 8$.'
      - '3. Contiene 3 términos (es un trinomio).'
  - titulo: 'Término sin signo visible'
    enunciado: '¿Es la expresión $12a^3b$ un término algebraico con signo positivo tácito?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. No contiene sumas o restas intermedias.'
      - '2. La ausencia de signo inicial indica signo positivo ($+12a^3b$).'
  - titulo: 'Expresión con adición interna'
    enunciado: '¿Es la expresión $x + y$ un solo término algebraico?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El signo $+$ separa a $x$ de $y$.'
      - '2. Corresponde a dos términos algebraicos distintos (un binomio).'
errores_frecuentes:
  - 'Considerar que un binomio como $a + b$ constituye un único término algebraico indivisible.'
  - 'Omitir el signo negativo al clasificar el coeficiente numérico de un término.'
  - 'Afirmar que una variable sin número escrito al frente carece de coeficiente numérico.'
  - 'Separar los factores multiplicados de un término como si fueran monomios independientes.'
  - 'Creer que los exponentes de las letras no forman parte de la estructura del término.'
afirmaciones_verdaderas:
  - 'Un término algebraico es una unidad multiplicativa compuesta por signo, coeficiente, variables y exponentes.'
  - 'Los signos de adición y sustracción son los operadores que separan términos algebraicos consecutivos.'
al_terminar_debes_poder: |
  ![Resumen de Término Algebraico](/static/img/nodos/definicion-de-termino-algebraico-resumen.svg)

  QUÉ: Definir con precisión formal un término algebraico y descomponerlo en sus cuatro elementos estructurales (signo, coeficiente, parte literal y exponentes).
  CÓMO: Verificando la ausencia de operadores aditivos internos e identificando cada factor constitutivo en monomios como $-5x^3y^2$.
