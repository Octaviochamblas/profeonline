semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.OPERATORIA_CON_MIXTOS
resumen_inicial: Para operar con números mixtos (sumar, restar, multiplicar o dividir),
  se deben convertir previamente a fracciones impropias y luego aplicar la regla operacional
  correspondiente.
explicacion_simple: 'Cuando tienes que calcular algo con números mixtos como $2\frac{1}{3}
  + 1\frac{3}{4}$ o $3\frac{1}{2} \times 2\frac{2}{5}$, lo mejor es no intentar inventar
  reglas raras. La estrategia universal y sin fallas es **transformar primero todos
  los números mixtos en fracciones impropias**. Una vez que los tienes como fracciones
  normales (donde el número de arriba es más grande que el de abajo), aplicas la suma,
  resta, multiplicación o división habitual. Al final, si quieres, vuelves a pasar
  el resultado a número mixto.

  '
explicacion_formal: 'Formalmente, dada una expresión operacional $\mathcal{O}(M_1,
  M_2)$ sobre números mixtos $M_1 = A_1\frac{b_1}{c_1}$ y $M_2 = A_2\frac{b_2}{c_2}$
  (con $A_i, b_i, c_i \in \mathbb{Z}^+$ y $b_i < c_i$):


  1. Se aplica la transformación a fracción impropia equivalente $F_1, F_2 \in \mathbb{Q}$:

  $F_1 = \frac{A_1 \cdot c_1 + b_1}{c_1} \quad \text{y} \quad F_2 = \frac{A_2 \cdot
  c_2 + b_2}{c_2}$

  2. Se ejecuta la operación aritmética requerida $\mathcal{O}(F_1, F_2)$ (adición,
  sustracción, multiplicación o división sobre $\mathbb{Q}$).

  3. Se simplifica el resultado a fracción irreductible $\frac{N}{D}$ y, si $N > D$,
  se reconvierte al número mixto canónico $A_r\frac{r}{D}$ mediante $N = A_r \cdot
  D + r$.

  '
definiciones_clave: '- **Operatoria con números mixtos**: Algoritmo secuencial basado
  en la conversión previa a fracciones impropias.

  - **Conversión inicial ($A\frac{b}{c} \to \frac{A \cdot c + b}{c}$)**: Paso estandarizador
  indispensable para eliminar la parte entera combinada.

  - **Reconversión final ($\frac{N}{D} \to A_r\frac{r}{D}$)**: Expresión habitual
  de respuestas cuantitativas cuando el resultado es impropio.

  '
propiedades_relaciones: '- **Preservación de validez en todas las operaciones**: La
  conversión a impropia es el único método que funciona por igual en adición, sustracción,
  multiplicación y división.

  - **Independencia de agrupamiento**: Evita errores en la resta con reserva (cuando
  la parte fraccionaria del sustraendo es mayor que la del minuendo).

  - **Operaciones directas de enteros y fracciones**: En la adición pura se pueden
  sumar las partes enteras por separado, pero en la multiplicación y división **este
  atajo es absolutamente falso**.

  '
ejemplo_guiado:
  enunciado: Calcula el producto $2\frac{1}{3} \cdot 1\frac{1}{2}$ convirtiendo previamente
    ambos mixtos a fracciones impropias.
  pasos:
  - 'Convertir $2\frac{1}{3}$ a fracción impropia: $\frac{2 \cdot 3 + 1}{3} = \frac{7}{3}$.'
  - 'Convertir $1\frac{1}{2}$ a fracción impropia: $\frac{1 \cdot 2 + 1}{2} = \frac{3}{2}$.'
  - 'Efectuar la multiplicación en línea recta: $\frac{7}{3} \cdot \frac{3}{2}$.'
  - 'Simplificar el factor $3$ presente en numerador y denominador: $\frac{7 \cdot
    1}{1 \cdot 2} = \frac{7}{2}$.'
  - 'Reconvertir a número mixto: $7 \div 2 = 3$ con residuo $1 \implies 3\frac{1}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso metodológico indispensable para multiplicar o
    dividir números mixtos?
  choices:
  - text: Convertir todos los números mixtos a fracciones impropias.
    is_correct: true
  - text: Multiplicar las partes enteras entre sí y las fracciones entre sí.
    is_correct: false
  - text: Sumar las partes enteras y mantener los denominadores.
    is_correct: false
  - text: Restar el numerador del entero.
    is_correct: false
  explanation: 'La correcta es Convertir todos los números mixtos a fracciones impropias.:
    neutraliza la estructura combinada para aplicar las reglas estándar de $\mathbb{Q}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al sumar $1\frac{1}{4} + 2\frac{1}{2}$, ¿cuál es el resultado expresado
    como número mixto?
  choices:
  - text: 3\$\frac{3}{4}$
    is_correct: true
  - text: 3\$\frac{2}{6}$
    is_correct: false
  - text: 3\$\frac{1}{4}$
    is_correct: false
  - text: 4\$\frac{1}{2}$
    is_correct: false
  explanation: 'La alternativa correcta es: 3\$\frac{3}{4}$. La correcta es 3\frac{3}{4}:
    $1\frac{1}{4} = \frac{5}{4}$ y $2\frac{1}{2} = \frac{5}{2} = \frac{10}{4}$; su
    suma es \frac{15}{4} = 3\frac{3}{4}.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Convertir cada número mixto $A\frac{b}{c}$ a fracción impropia $\frac{A
  \cdot c + b}{c}$.'
- 'Paso 2: Identificar la operación a realizar (adición, sustracción, multiplicación
  o división).'
- 'Paso 3: Aplicar el algoritmo correspondiente de la operación con fracciones.'
- 'Paso 4: Simplificar el resultado final y reconvertirlo a número mixto si el numerador
  es mayor que el denominador.'
errores_correccion: 'Un error fatal en la multiplicación es multiplicar enteros con
  enteros y fracciones con fracciones (por ejemplo, calcular $2\frac{1}{2} \times
  3\frac{1}{2} = 6\frac{1}{4}$). ¡Esto da $6.25$, cuando el resultado real es $\frac{5}{2}
  \times \frac{7}{2} = \frac{35}{4} = 8.75$! **Siempre pasa a impropia antes de multiplicar
  o dividir**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $3\frac{1}{3} - 1\frac{5}{6}$.
  alternativas:
  - 1\$\frac{1}{2}$
  - 2\$\frac{4}{3}$
  - 1\$\frac{2}{3}$
  respuesta: 1\$\frac{1}{2}$
  solucion_pasos:
  - 'Convertimos a impropias: $3\frac{1}{3} = \frac{10}{3} = \frac{20}{6}$ y $1\frac{5}{6}
    = \frac{11}{6}$.'
  - 'Restamos numeradores: $\frac{20 - 11}{6} = \frac{9}{6}$.'
  - 'Simplificamos por 3: $\frac{3}{2} = 1\frac{1}{2}$.'
- titulo: Ejemplo 2
  enunciado: Resuelve la división $4\frac{1}{2} \div 1\frac{1}{2}$.
  alternativas:
  - '3'
  - '4'
  - 2\$\frac{1}{4}$
  respuesta: '3'
  solucion_pasos:
  - 'Impropias: $4\frac{1}{2} = \frac{9}{2}$ y $1\frac{1}{2} = \frac{3}{2}$.'
  - 'División por recíproco: $\frac{9}{2} \cdot \frac{2}{3} = \frac{18}{6} = 3$.'
- titulo: ¿Se pueden sumar las partes enteras por separado únicamente en la adición
    de números mixtos con parte fraccionaria propia?
  respuesta: Sí
  solucion_pasos:
  - Sí, solo en la adición se puede usar la propiedad asociativa $A_1\frac{b_1}{c_1}
    + A_2\frac{b_2}{c_2} = (A_1+A_2) + (\frac{b_1}{c_1}+\frac{b_2}{c_2})$.
- titulo: ¿Se debe evitar operar directamente números mixtos en la multiplicación
    y división sin pasarlos a impropia?
  respuesta: Sí
  solucion_pasos:
  - Sí, de lo contrario se viola la propiedad distributiva produciendo un error grave.
errores_frecuentes:
- Multiplicar enteros con enteros y fracciones con fracciones en la multiplicación
  de mixtos.
- Olvidar sumar el numerador original al transformar el mixto a fracción impropia.
- Cometer errores en la sustracción de mixtos cuando requiere canje entre enteros
  y fracciones.
- No reconvertir la fracción impropia final a número mixto si las alternativas del
  problema están expresadas en forma mixta.
- Cambiar el denominador original durante la conversión inicial.
afirmaciones_verdaderas:
- Para operar números mixtos de manera segura en cualquier operación, se deben transformar
  a fracciones impropias antes de ejecutar los cálculos.
- Multiplicar $A_1\frac{b_1}{c_1} \cdot A_2\frac{b_2}{c_2}$ multiplicando solo enteros
  por enteros y fracciones por fracciones conduce a un resultado numérico erróneo.
al_terminar_debes_poder: 'Debes ser capaz de resolver adiciones, sustracciones, multiplicaciones
  y divisiones con números mixtos mediante la conversión a fracción impropia.

  '
fuente: Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números
  racionales.
