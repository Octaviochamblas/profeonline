semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.OPERATORIA_CON_MIXTOS
resumen_inicial: Para operar con números mixtos en adiciones, sustracciones, multiplicaciones
  o divisiones, se deben convertir previamente a fracciones impropias.
explicacion_simple: Antes de realizar cualquier operación matemática (como sumar,
  restar, multiplicar o dividir) con números mixtos, el procedimiento más seguro y
  universal consiste en transformar todos los números mixtos a fracciones impropias
  normales. Una vez convertidos, operamos normalmente y al final podemos volver a
  pasarlo a mixto.
explicacion_formal: 'Dada la expresión operacional sobre números mixtos $\mathcal{O}\left(
  C_1 \frac{r_1}{b_1}, C_2 \frac{r_2}{b_2} \right)$, la **Estrategia Estándar de Operación**
  aplica la transformación previa:


  $$\mathcal{O}\left( C_1 \frac{r_1}{b_1}, C_2 \frac{r_2}{b_2} \right) = \mathcal{O}\left(
  \frac{C_1 \cdot b_1 + r_1}{b_1}, \frac{C_2 \cdot b_2 + r_2}{b_2} \right)$$


  **Desglose de la fórmula:**

  - Conversión a impropias: Garantiza la aplicación unificada de los algoritmos racionales
  en $\mathbb{Q}$.

  - $\mathcal{O} \in \{+, -, \cdot, :\}$: Operador algebraico aplicado sobre las impropias
  equivalentes.


  > **Complemento didáctico:** En la multiplicación y división de mixtos, convertirlos
  a fracciones impropias es OBLIGATORIO para no cometer errores distributivos.'
definiciones_clave: '- **Operatoria con mixtos**: Protocolo operacional que exige
  la transformación inicial a fracciones impropias $C \frac{r}{b} = \frac{C b + r}{b}$.'
propiedades_relaciones: '- **Homogenización universal**: Convertir a impropia unifica
  todas las reglas operacionales en $\mathbb{Q}$.'
ejemplo_guiado:
  enunciado: Calcule la multiplicación de números mixtos $1 \frac{1}{2} \cdot 2 \frac{1}{3}$.
  pasos:
  - 'Paso 1: Convertir $1 \frac{1}{2}$ a impropia: $\frac{1 \cdot 2 + 1}{2} = \frac{3}{2}$.'
  - 'Paso 2: Convertir $2 \frac{1}{3}$ a impropia: $\frac{2 \cdot 3 + 1}{3} = \frac{7}{3}$.'
  - 'Paso 3: Multiplicar las fracciones impropias: $\frac{3}{2} \cdot \frac{7}{3}$.'
  - 'Paso 4: Simplificar el $3$ arriba y abajo: $\frac{1}{2} \cdot \frac{7}{1} = \frac{7}{2}$.'
  - 'Paso 5: Convertir $\frac{7}{2}$ a número mixto: $7 : 2 = 3$ resto $1 \implies
    3 \frac{1}{2}$.'
  - 'Conclusión: $1 \frac{1}{2} \cdot 2 \frac{1}{3} = 3 \frac{1}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso obligatorio al realizar operaciones aritméticas
    con números mixtos?
  choices:
  - text: Convertir todos los números mixtos a fracciones impropias equivalentes
    is_correct: true
  - text: Multiplicar las partes enteras únicamente
    is_correct: false
  - text: Sumar los numeradores sin tocar las partes enteras
    is_correct: false
  - text: Eliminar la parte entera
    is_correct: false
  explanation: La alternativa correcta es 'Convertir todos los números mixtos a fracciones
    impropias equivalentes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 1 1/2 · 2 1/3, ¿cuál fue el resultado final
    expresado como número mixto?
  choices:
  - text: 3 1/2
    is_correct: true
  - text: 2 1/6
    is_correct: false
  - text: 7/2
    is_correct: false
  - text: 2 1/3
    is_correct: false
  explanation: La alternativa correcta es '3 1/2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Convertir cada número mixto a su fracción impropia equivalente $\frac{C
  \cdot b + r}{b}$.'
- 'Paso 2: Aplicar los algoritmos de adición, sustracción, multiplicación o división
  sobre las impropias.'
- 'Paso 3: Convertir la fracción impropia final de regreso a número mixto si el resultado
  es mayor que 1.'
errores_correccion: '- **Error 1: Multiplicar solo los enteros y luego solo las fracciones
  ($2 \frac{1}{2} \cdot 3 \frac{1}{2} = 6 \frac{1}{4}$).** **Cómo corregirlo:** Es
  totalmente FALSO. Se DEBEN pasar ambos a impropia primero ($\frac{5}{2} \cdot \frac{7}{2}
  = \frac{35}{4} = 8 \frac{3}{4}$).


  - **Error 2: Olvidar considerar el entero al realizar divisiones con mixtos.** **Cómo
  corregirlo:** La conversión previa a impropia evita omitir la parte entera.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $2 \frac{1}{4} + 1 \frac{1}{2}$.
  alternativas:
  - 3 3/4
  - 3 2/6
  - 3 1/4
  respuesta: 3 3/4
  solucion_pasos:
  - $9/4 + 3/2 = 9/4 + 6/4 = 15/4 = 3 \frac{3}{4}$.
- titulo: Ejemplo 2
  enunciado: Calcule $3 \frac{1}{3} - 1 \frac{2}{3}$.
  alternativas:
  - 1 2/3
  - 2 1/3
  - 1 1/3
  respuesta: 1 2/3
  solucion_pasos:
  - $10/3 - 5/3 = 5/3 = 1 \frac{2}{3}$.
- titulo: ¿Es obligatorio transformar los números mixtos a fracciones impropias antes
    de multiplicar?
  respuesta: Sí
  solucion_pasos:
  - Sí, para no incurrir en errores distributivos.
- titulo: ¿Es 1 1/2 + 1 1/2 igual a 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3/2 + 3/2 = 6/2 = 3$.
errores_frecuentes:
- Multiplicar números mixtos se resuelve multiplicando los enteros entre sí y las
  fracciones entre sí.
- Para sumar números mixtos no es necesario considerar la parte fraccionaria.
- Convertir a fracción impropia antes de dividir un número mixto altera el resultado
  final.
- La suma de dos números mixtos positivos da como resultado una fracción propia siempre.
- Dividir números mixtos requiere restar únicamente sus partes enteras.
afirmaciones_verdaderas:
- Para operar correctamente con números mixtos se deben convertir previamente a fracciones
  impropias.
- La conversión previa a impropia garantiza la validez de los algoritmos de adición,
  sustracción, producto y división.
al_terminar_debes_poder: Al terminar serás capaz de resolver operaciones combinadas
  con números mixtos, convirtiéndolos inicialmente a fracciones impropias y aplicando
  los algoritmos de $\mathbb{Q}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
