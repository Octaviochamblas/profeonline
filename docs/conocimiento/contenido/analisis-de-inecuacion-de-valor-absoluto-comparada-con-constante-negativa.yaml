semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.CONSTANTE_NEGATIVA
resumen_inicial: 'Al comparar un valor absoluto con una constante negativa, la solución
  es inmediata (sin despejar): es vacía ($S = \emptyset$) o real total ($S = \mathbb{R}$).'
explicacion_simple: 'Como el valor absoluto $|P(x)|$ de cualquier número es SIEMPRE
  mayor o igual a cero (nunca es negativo):

  1. **$|x| < -3$**: Es IMPOSIBLE que una distancia sea menor que un número negativo.
  Solución: **Sin solución ($S = \emptyset$)**.

  2. **$|x| > -3$**: Es SIEMPRE CIERTO que una distancia no negativa sea mayor que
  un número negativo. Solución: **Todos los reales ($S = \mathbb{R}$)**.'
explicacion_formal: 'Sea $|P(x)| \ge 0$ para todo $x \in \mathbb{R}$ y sea la constante
  $c < 0$ (estrictamente negativa):


  $$|P(x)| < c \implies S = \emptyset \quad \text{y} \quad |P(x)| \le c \implies S
  = \emptyset$$

  $$|P(x)| > c \implies S = \mathbb{R} \quad \text{y} \quad |P(x)| \ge c \implies
  S = \mathbb{R}$$


  **Desglose de la fórmula:**

  - Análisis lógico axiomático basado en la propiedad de no negatividad del valor
  absoluto $|P(x)| \ge 0$.'
definiciones_clave: '- **No negatividad $|P(x)| \ge 0$**: Axioma fundamental que establece
  que la imagen de la función valor absoluto jamás es negativa.

  - **Resolución lógica inmediata**: Solución instantánea ($S = \emptyset$ o $S =
  \mathbb{R}$) al detectar comparaciones con escalares negativos.'
propiedades_relaciones: '- **Imposibilidad de distancia negativa**: $|P(x)| < -k$
  viola las leyes del espacio métrico real.'
ejemplo_guiado:
  enunciado: Analiza y determina el conjunto solución $S$ para las inecuaciones $|4x
    - 1| < -5$ y $|4x - 1| > -5$.
  pasos:
  - 'Paso 1: Notar que la constante de la derecha es negativa ($c = -5 < 0$).Paso
    2: Analizar $|4x - 1| < -5$: Como $|4x - 1| \ge 0$, nunca puede ser menor que
    $-5 \implies S_1 = \emptyset$.Paso 3: Analizar $|4x - 1| > -5$: Como $|4x - 1|
    \ge 0$, siempre es mayor que $-5 \implies S_2 = \mathbb{R}$.Paso 4: Concluir $S_1
    = \emptyset$ (sin solución) y $S_2 = \mathbb{R}$ (todos los reales).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjunto solución de la inecuación con valor absoluto $|4x
    - 1| < -5$?
  choices:
  - text: $S = \emptyset$ (conjunto vacío, no tiene solución)
    is_correct: true
  - text: $S = \mathbb{R}$ (todos los números reales)
    is_correct: false
  - text: $S = ]-5, 5[$
    is_correct: false
  - text: $S = \{5\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$ (conjunto vacío, no tiene
    solución)'. Un valor absoluto jamás puede ser menor que un negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el conjunto solución de la inecuación $|4x - 1| > -5$?
  choices:
  - text: $S = \mathbb{R}$ (o $]-\infty, +\infty[$)
    is_correct: true
  - text: $S = \emptyset$
    is_correct: false
  - text: $S = ]5, +\infty[$
    is_correct: false
  - text: $S = ]-\infty, -5[$
    is_correct: false
  explanation: La alternativa correcta es '$S = \mathbb{R}$ (o $]-\infty, +\infty[$)'.
    Un valor absoluto siempre es mayor que cualquier número negativo.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mirar la constante de la derecha del valor absoluto.'
- 'Paso 2: Si la constante es negativa ($c < 0$), detener el despeje algebraico.'
- 'Paso 3: Si el símbolo es $<$ ó $\le$, responder $S = \emptyset$.'
- 'Paso 4: Si el símbolo es $>$ ó $\ge$, responder $S = \mathbb{R}$.'
errores_correccion: '- **Error común:** Intentar aplicar $-k < X < k$ con un número
  negativo como $k = -5$ (escribir $5 < X < -5$, lo cual carece de sentido).

  - **Cómo corregirlo:** Si la constante es negativa, NUNCA apliques las fórmulas
  de descomposicion; aplica la regla lógica inmediata ($S = \emptyset$ o $S = \mathbb{R}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
