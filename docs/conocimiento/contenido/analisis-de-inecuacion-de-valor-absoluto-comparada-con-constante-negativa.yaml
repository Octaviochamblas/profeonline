procedimiento:
- Identificar la inecuación que presenta un valor absoluto en un miembro de la desigualdad.
- Aislar la expresión del valor absoluto en un lado de la desigualdad.
- Verificar que el otro lado de la desigualdad sea una constante estrictamente negativa.
- Si la desigualdad es menor o menor o igual, establecer que la solución es el conjunto
  vacío ($\emptyset$).
- Si la desigualdad es mayor o mayor o igual, establecer que la solución abarca todos
  los números reales ($\mathbb{R}$) que están en el dominio de la expresión interior.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en análisis de inecuación de
  valor absoluto comparada con constante negativa.
ejemplos:
- titulo: Desigualdad del tipo menor estricto
  enunciado: Resuelve la inecuación $|2x + 1| < -5$.
  solucion_pasos:
  - Observamos que la expresión del valor absoluto, $|2x + 1|$, está aislada.
  - Notamos que la constante a la derecha es $-5$, un número negativo.
  - Como el valor absoluto no puede ser negativo, nunca será menor que $-5$.
  - Concluimos que no hay números reales que cumplan esta inecuación. La solución
    es el conjunto vacío ($\emptyset$).
- titulo: Desigualdad del tipo mayor o igual
  enunciado: Determina el conjunto solución para la inecuación $|3x - 4| \geq -2$.
  solucion_pasos:
  - El valor absoluto $|3x - 4|$ ya está aislado en un lado.
  - Al otro lado tenemos la constante negativa $-2$.
  - El valor absoluto siempre es mayor o igual a cero para cualquier valor real de
    $x$.
  - Dado que $0$ y cualquier número positivo son mayores que $-2$, la desigualdad
    es siempre cierta.
  - La solución es el conjunto de todos los números reales ($\mathbb{R}$).
- titulo: ¿Tiene solución $|x + 7| < -1$?
  respuesta: Falso
  solucion_pasos:
  - El valor absoluto debe ser mayor o igual a cero.
  - Un número no negativo nunca puede ser menor que un número estrictamente negativo
    ($-1$).
  - Por lo tanto, no hay solución.
- titulo: ¿Es cierto que cualquier número real satisface $|5 - x| > -10$?
  respuesta: Verdadero
  solucion_pasos:
  - La inecuación plantea que un valor absoluto debe ser mayor a un número negativo.
  - El valor absoluto genera siempre valores mayores o iguales a cero.
  - Cualquier cantidad no negativa es, por definición, mayor que $-10$.
  - Luego, todos los reales son solución.
errores_frecuentes:
- Creer que se debe separar la inecuación en dos casos ($2x < -5$ y $2x > 5$) omitiendo
  el análisis del signo de la constante.
- Suponer que la solución siempre es el conjunto vacío sin revisar si el signo de
  la desigualdad es mayor o menor.
- Afirmar que si $|x| > -3$, entonces $x > -3$ descartando valores negativos para
  $x$.
- Pensar que la expresión dentro del valor absoluto puede volverse negativa, lo que
  compensa la desigualdad.
- Olvidar que un valor absoluto puede ser exactamente cero y evaluar erróneamente
  inecuaciones con constantes negativas.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  análisis de inecuación de valor absoluto comparada con constante negativa.
