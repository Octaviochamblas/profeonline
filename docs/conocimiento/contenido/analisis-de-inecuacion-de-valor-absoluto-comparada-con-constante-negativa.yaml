semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.CONSTANTE_NEGATIVA
resumen_inicial: El análisis de inecuaciones con valor absoluto comparadas con constantes negativas se resuelve por propiedades directas de no negatividad.
explicacion_simple: '![Análisis de inecuación de valor absoluto comparada con constante negativa](/static/img/nodos/analisis-de-inecuacion-de-valor-absoluto-comparada-con-constante-negativa-intro.svg)


  El valor absoluto $|E|$ de cualquier número real es **SIEMPRE MAYOR O IGUAL A CERO** ($|E| \ge 0$).


  Por esta razón:

  1. Si nos piden $|E| < -5$, como un número positivo o cero nunca puede ser menor que un número negativo, la respuesta es **SIN SOLUCIÓN** ($S = \emptyset$).

  2. Si nos piden $|E| > -5$, como un número positivo o cero siempre es mayor que cualquier número negativo, la respuesta es **TODOS LOS REALES** ($S = \mathbb{R}$).'
explicacion_formal: 'Dado que $\forall x \in \mathbb{R}, \ |E(x)| \ge 0$, para cualquier constante $k < 0$:


  1. Inecuación del tipo $|E(x)| < k \implies S = \emptyset$

  2. Inecuación del tipo $|E(x)| > k \implies S = \mathbb{R}$


  **Desglose de la fórmula:**

  - $k < 0$: Constante negativa.

  - La propiedad de no negatividad del valor absoluto determina directamente el conjunto solución sin necesidad de despejes algebraicos.

  '
definiciones_clave: '- **No negatividad del valor absoluto**: Propiedad matemática por la cual $|x| \ge 0$ para todo $x \in \mathbb{R}$.

  '
propiedades_relaciones: '- **Comparación directa con negativos**: $|E| < k \text{ con } k < 0 \implies \emptyset$. $|E| > k \text{ con } k < 0 \implies \mathbb{R}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Análisis de inecuación de valor absoluto comparada con constante negativa](/static/img/nodos/analisis-de-inecuacion-de-valor-absoluto-comparada-con-constante-negativa-ejemplos.svg)


    Determina el conjunto solución de la inecuación $|2x - 7| < -3$.'
  pasos:
  - 'Paso 1: Observar el miembro izquierdo: $|2x - 7| \ge 0$ para todo $x \in \mathbb{R}$.'
  - 'Paso 2: Observar la constante del miembro derecho: $-3 < 0$ (número negativo).'
  - 'Paso 3: Evaluar la condición $|2x - 7| < -3$: un número no negativo jamás puede ser menor que $-3$.'
  - 'Paso 4: Concluir que el conjunto solución es el conjunto vacío $S = \emptyset$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjunto solución de la inecuación $|x + 5| < -2$?
  choices:
  - text: $S = \emptyset$
    is_correct: true
  - text: $S = \mathbb{R}$
    is_correct: false
  - text: $S = ]-7, -3[$
    is_correct: false
  - text: $S = \{ -2 \}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$'. El valor absoluto nunca es menor que un número negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el conjunto solución de la inecuación $|3x - 1| > -4$?
  choices:
  - text: $S = \mathbb{R}$
    is_correct: true
  - text: $S = \emptyset$
    is_correct: false
  - text: $S = ]-4, 4[$
    is_correct: false
  - text: $S = [0, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$S = \mathbb{R}$'. Todo valor no negativo es estrictamente mayor que $-4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si la constante de comparación $k$ es un número negativo ($k < 0$).'
- 'Paso 2: Si el operador es $<$ o $\le$, declarar inmediatamente $S = \emptyset$.'
- 'Paso 3: Si el operador es $>$ o $\ge$, declarar inmediatamente $S = \mathbb{R}$.'
errores_correccion: '- **Error común:** Intentar desglosar la inecuación en dos casos cuando la constante es negativa.

  - **Cómo corregirlo:** Antes de despejar, comprueba el signo de la constante: si es negativa, la respuesta es inmediata ($\emptyset$ o $\mathbb{R}$).

  '
ejemplos:
- titulo: 'Ejemplo 1: Menor que número negativo'
  enunciado: ¿Cuál es la solución de $|3x - 1| < -5$?
  alternativas:
  - $S = \emptyset$
  - $S = \mathbb{R}$
  - $]-\infty, -5[$
  - $]-5, 5[$
  respuesta: $S = \emptyset$
  solucion_pasos:
  - 'Paso 1: Un valor absoluto nunca es negativo ($|3x - 1| \ge 0$).'
  - 'Paso 2: La desigualdad $|3x - 1| < -5$ es imposible: $S = \emptyset$.'
- titulo: 'Ejemplo 2: Mayor que número negativo'
  enunciado: ¿Cuál es la solución de $|2x + 4| > -3$?
  alternativas:
  - $S = \mathbb{R} = ]-\infty, +\infty[$
  - $S = \emptyset$
  - $]-3, 3[$
  - $[0, +\infty[$
  respuesta: $S = \mathbb{R} = ]-\infty, +\infty[$
  solucion_pasos:
  - 'Paso 1: Como $|2x + 4| \ge 0$ para todo $x$, siempre es estrictamente mayor que $-3$.'
  - 'Paso 2: $S = \mathbb{R}$.'
- titulo: 'Ejemplo 3: Menor o igual que negativo'
  enunciado: Resuelve $|x| \leq -2$.
  alternativas:
  - $S = \emptyset$
  - $S = \{-2\}$
  - $S = \mathbb{R}$
  - $[-2, 2]$
  respuesta: $S = \emptyset$
  solucion_pasos:
  - 'Paso 1: No existe ningún real con $|x| \le -2$.'
  - 'Paso 2: $S = \emptyset$.'
- titulo: 'Ejemplo 4: Mayor o igual que negativo'
  enunciado: Resuelve $|x - 7| \geq -10$.
  alternativas:
  - $S = \mathbb{R}$
  - $S = \emptyset$
  - $[7, +\infty[$
  - $[-10, 10]$
  respuesta: $S = \mathbb{R}$
  solucion_pasos:
  - 'Paso 1: Al ser una distancia no negativa, siempre es $\ge -10$.'
  - 'Paso 2: Todo real cumple la condición: $S = \mathbb{R}$.'
errores_frecuentes:
- La inecuación $|x - 3| < -5$ se satisface para todo número real $x \in \mathbb{R}$.
- Al analizar $|2x + 1| \ge -4$, se concluye que el conjunto solución es el conjunto vacío $\emptyset$.
- El valor absoluto $|x|$ de un número real puede tomar valores estrictamente negativos en $\mathbb{R}$.
- La desigualdad $|x + 2| \le -1$ tiene como solución el número particular $x = -2$.
- Comparar un valor absoluto con una constante negativa exige desglosar dos inecuaciones lineales con conector disyuntivo.
afirmaciones_verdaderas:
- Dado que el valor absoluto $|E|$ es no negativo ($|E| \ge 0$), la desigualdad $|E| < k$ con $k < 0$ carece de solución ($S = \emptyset$).
- La inecuación $|E| > k$ con $k < 0$ es verdadera para todo número real del dominio del argumento ($S = \mathbb{R}$).
al_terminar_debes_poder: '**QUÉ:** Analizar inecuaciones de valor absoluto comparadas con constantes negativas.


  **CÓMO:** Aplicando el principio de no negatividad ($|A| \ge 0$) para dictaminar inmediatamente $S = \emptyset$ ante $|A| < -c$ o $S = \mathbb{R}$ ante $|A| > -c$.


  ![Resumen Análisis de inecuación de valor absoluto comparada con constante negativa](/static/img/nodos/analisis-de-inecuacion-de-valor-absoluto-comparada-con-constante-negativa-resumen.svg)'
