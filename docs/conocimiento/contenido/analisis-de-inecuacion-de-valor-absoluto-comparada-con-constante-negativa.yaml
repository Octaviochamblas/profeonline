semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.CONSTANTE_NEGATIVA
resumen_inicial: 'Análisis de inecuación de valor absoluto comparada con constante
  negativa: relaciones de orden, intervalos y resolución en Inecuaciones con valor
  absoluto.'
explicacion_simple: El valor absoluto de cualquier número real o expresión matemática
  siempre es un número no negativo (es decir, mayor o igual a cero). Por tanto, cuando
  nos encontramos con una inecuación donde un valor absoluto se compara con una cantidad
  estrictamente negativa, las soluciones adquieren propiedades particulares y directas.
explicacion_formal: '### Definición formal

  Sea $f(x)$ una expresión algebraica y $k$ una constante real tal que $k < 0$. Para
  inecuaciones de la forma $|f(x)| < k$ o $|f(x)| \leq k$, el conjunto solución es
  vacío ($\emptyset$). Para inecuaciones de la forma $|f(x)| > k$ o $|f(x)| \geq k$,
  el conjunto solución corresponde al dominio completo de $f(x)$ (generalmente, los
  números reales $\mathbb{R}$).


  ### Desarrollo didáctico

  Al tratar con inecuaciones que contienen valor absoluto, es fundamental analizar
  el signo de la constante con la cual se está comparando. Sabemos por propiedad fundamental
  que para cualquier número real $A$, se cumple que $|A| \geq 0$.


  Si nos enfrentamos a la inecuación $|x-3| < -2$, estamos buscando un número tal
  que su valor absoluto sea menor que $-2$. Sin embargo, como el valor absoluto de
  cualquier cantidad mínima es $0$, jamás podrá ser menor que un número negativo.
  En este escenario, deducimos inmediatamente que no existen valores para $x$ que
  satisfagan la inecuación.


  Por el contrario, si la inecuación es $|x-3| > -2$, nos preguntamos para qué valores
  el valor absoluto es mayor que un número negativo. Como el valor absoluto es siempre
  mayor o igual a cero, cualquier valor que tome $x$ generará una cantidad no negativa,
  que por definición siempre será estrictamente mayor que $-2$. Así, la inecuación
  se cumple para todos los números reales.'
definiciones_clave: '- **Análisis de inecuación de valor absoluto comparada con constante
  negativa**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a análisis de inecuación de valor absoluto
  comparada con constante negativa.'
