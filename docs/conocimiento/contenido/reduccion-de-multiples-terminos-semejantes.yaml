procedimiento:
- 'Paso 1: Marca visualmente (o separa en columnas) los términos positivos y los negativos.'
- 'Paso 2: Suma los coeficientes de los términos positivos entre sí.'
- 'Paso 3: Suma los coeficientes de los términos negativos entre sí (en valor absoluto).'
- 'Paso 4: Resta el total negativo al total positivo para obtener el resultado final.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en reducción de múltiples términos semejantes.
ejemplos:
- titulo: El presupuesto algebraico
  enunciado: 'Reduce: 8n - 5n + 2n - 3n.'
  solucion_pasos:
  - 'Positivos: 8n + 2n = 10n.'
  - 'Negativos: 5n + 3n = 8n.'
  - 'Restamos: 10n - 8n = 2n.'
  - 'Resultado: 2n.'
- titulo: 'Una empresa registra las siguientes transacciones en una semana: ganó $20t$,
    gastó $5t$, rec'
  enunciado: 'Una empresa registra las siguientes transacciones en una semana: ganó
    $20t$, gastó $5t$, recibió un reembolso de $3t$, pagó impuestos de $8t$ y cobró
    una deuda de $6t$. ¿Cuál es el balance neto de la semana? (v1)


    Opciones: A) $16t$ · B) $-4t$ · C) $42t$ · D) $6t$'
  solucion_pasos:
  - 'Positivos: $20t+3t+6t=29t$. Negativos: $5t+8t=13t$. Neto: $29t-13t=16t$.'
  - 'Respuesta: $16t$'
- titulo: 'Respecto de «Reducción de múltiples términos semejantes»: ¿Describe adecuadamente
    el concept'
  enunciado: 'Respecto de «Reducción de múltiples términos semejantes»: ¿Describe
    adecuadamente el concepto esta frase? «Para reducir **Múltiples Términos** semejantes
    con signos mixtos, la estrategia es agrupar primero los positivos entre sí y los
    negativos entre sí, luego restar los totales parciales»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para reducir **Múltiples Términos**
    semejantes con signos mixtos, la estrategia es agrupar primero los positivos entre
    sí y los negativos entre sí, luego restar los totales parciales.'
- titulo: 'Respecto de «Reducción de múltiples términos semejantes»: ¿Se puede aceptar
    esta afirmación?'
  enunciado: 'Respecto de «Reducción de múltiples términos semejantes»: ¿Se puede
    aceptar esta afirmación? «Procesar los términos de izquierda a derecha sin ordenar,
    lo que puede provocar errores en la gestión de signos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para reducir **Múltiples Términos**
    semejantes con signos mixtos, la estrategia es agrupar primero los positivos entre
    sí y los negativos entre sí, luego restar los totales parciales.'
errores_frecuentes:
- Procesar los términos de izquierda a derecha sin ordenar, lo que puede provocar
  errores en la gestión de signos.
- Olvidar sumar el valor de un término negativo al grupo de negativos (omitirlo porque
  'se ve pequeño').
- Para «Al reducir una expresión con múltiples términos semejantes de signos mixtos,
  como $5x - 2x + 3x - 8x$, ¿cuál es la estrategia más eficiente? (v1)», la respuesta
  correcta es Resolver de izquierda a derecha sin agrupar.
- Multiplicar todos los coeficientes entre sí.
- Para «Al reducir una expresión con múltiples términos semejantes de signos mixtos,
  como $5x - 2x + 3x - 8x$, ¿cuál es la estrategia más eficiente? (v1)», la respuesta
  correcta es Ignorar los signos y sumar todos los coeficientes.
afirmaciones_verdaderas:
- La reducción en reducción de múltiples términos semejantes conserva los exponentes
  de la parte literal.
al_terminar_debes_ponder: Operar y reducir expresiones algebraicas utilizando reducción
  de múltiples términos semejantes.
fuente: Álgebra de Baldor.
