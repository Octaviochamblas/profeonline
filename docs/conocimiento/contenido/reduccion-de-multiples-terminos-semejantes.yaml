semantic_id: MAT.ALG.REDUCCION_OPERATIVA.MULTIPLES_TERMINOS
resumen_inicial: 'Reducción de múltiples términos semejantes: procedimiento y reglas
  en Reducción de términos semejantes.'
explicacion_simple: 'En el mundo real rara vez las cosas son solo positivas o solo
  negativas. Los presupuestos tienen ingresos y egresos mezclados. En álgebra pasa
  lo mismo: debemos ordenar la mezcla y agrupar lo que es de la misma familia.'
explicacion_formal: '### Definición formal


  La agrupación previa evita errores de signo y hace el cálculo más ordenado.


  ### Desarrollo didáctico


  Simplifica $7x - 3x + 5x - 9x$.


  Estrategia de dos pasos:

  1. Agrupamos positivos: $7x + 5x = 12x$.

  2. Agrupamos negativos: $3x + 9x = 12x$ (en valor absoluto).

  3. Restamos totales: $12x - 12x = 0$.


  El resultado es $0$ — los términos se cancelan perfectamente.


  Otro ejemplo: $10a - 2a + 4a - 7a$.

  - Positivos: $10a + 4a = 14a$.

  - Negativos: $2a + 7a = 9a$.

  - Resultado: $14a - 9a = 5a$.'
definiciones_clave: '- **Reducción de múltiples términos semejantes**: Operación o
  propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a reducción de múltiples términos semejantes.'
ejemplo_guiado:
  enunciado: Aplica reducción de múltiples términos semejantes en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de reducción de múltiples términos
    semejantes.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
