procedimiento:
- 'Paso 1: Identifica el centro de la esfera (el punto de referencia interior).'
- 'Paso 2: Reconoce que todos los puntos de la superficie están a la misma distancia
  del centro (el radio r).'
- 'Paso 3: Utiliza esa distancia constante (r) como la medida fundamental para cualquier
  cálculo con la esfera.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con definición de esfera.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de definición de esfera para determinar la medida
    solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando definición de esfera.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de definición de esfera y elige la respuesta
    adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de definición de esfera.
- titulo: ¿Se cumple siempre la propiedad principal de definición de esfera en figuras
    congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede definición de esfera asumir un valor negativo cuando representa una
    longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en definición de esfera.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en definición
  de esfera.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en definición de
  esfera.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de definición
  de esfera.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
