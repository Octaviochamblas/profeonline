semantic_id: MAT.GEO.CUERPOS_REDONDOS_BASE.ESFERA_DEFINICION
resumen_inicial: 'Definición de esfera: conceptos, teoremas, propiedades geométricas
  y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'Una esfera es como una pelota: un cuerpo perfectamente redondo
  en todas direcciones, sin bases ni vértices.'
explicacion_formal: '![Definición de esfera](/static/img/geometria/espacio-cuerpos/esfera-definicion.svg)


  ### Definición formal


  Una esfera de centro $O$ y radio $r$ es el conjunto de todos los puntos del espacio
  que están a una distancia exactamente igual a $r$ del centro $O$. A diferencia del
  cilindro y el cono, la esfera no tiene bases ni vértices: toda su superficie es
  curva.


  ### Desarrollo didáctico


  En la figura, el segmento desde el centro $O$ hasta cualquier punto de la superficie
  mide siempre lo mismo: el radio $r$. Esta propiedad de equidistancia es lo que define
  completamente a la esfera, sin importar la dirección en la que se mida.'
definiciones_clave: '- **Definición de esfera**: Elemento o propiedad fundamental
  en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de esfera.'
