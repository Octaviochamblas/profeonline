semantic_id: MAT.GEO.POLIEDROS_PRISMAS.POLIEDRO_REGULAR_CONCEPTO
resumen_inicial: 'Concepto de poliedro regular: conceptos, teoremas, propiedades geométricas
  y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'Un poliedro regular es la versión ''perfectamente simétrica''
  de un poliedro: todas sus caras son idénticas y en cada vértice se repite exactamente
  el mismo patrón.'
explicacion_formal: '![Concepto de poliedro regular](/static/img/geometria/espacio-cuerpos/poliedro-regular-concepto.svg)


  ### Definición formal


  Un poliedro regular cumple dos condiciones: (1) todas sus caras son polígonos regulares
  congruentes entre sí (mismo número de lados, misma medida), y (2) en cada vértice
  concurre exactamente el mismo número de caras. Existen exactamente cinco poliedros
  regulares, conocidos como los sólidos platónicos.


  ### Desarrollo didáctico


  En la figura, el cubo es un poliedro regular: sus 6 caras son cuadrados congruentes,
  y en cada uno de sus 8 vértices concurren exactamente 3 caras. Un prisma rectangular
  con caras de distinto tamaño (no todas cuadradas) NO sería un poliedro regular,
  aunque sí sería un poliedro común.'
definiciones_clave: '- **Concepto de poliedro regular**: Elemento o propiedad fundamental
