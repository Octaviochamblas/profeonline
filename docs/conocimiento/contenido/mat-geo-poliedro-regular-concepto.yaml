procedimiento:
- 'Paso 1: Verifica que todas las caras del poliedro sean polígonos regulares (lados
  y ángulos iguales entre sí).'
- 'Paso 2: Verifica que todas esas caras sean además congruentes entre sí (mismo tamaño).'
- 'Paso 3: Verifica que en cada vértice concurra el mismo número de caras; si se cumplen
  las tres condiciones, el poliedro es regular.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de poliedro regular.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de concepto de poliedro regular para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando concepto de poliedro regular.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de concepto de poliedro regular y elige
    la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de concepto de poliedro regular.
- titulo: ¿Se cumple siempre la propiedad principal de concepto de poliedro regular
    en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede concepto de poliedro regular asumir un valor negativo cuando representa
    una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en concepto de poliedro regular.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en concepto de
  poliedro regular.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en concepto de
  poliedro regular.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de concepto
  de poliedro regular.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
