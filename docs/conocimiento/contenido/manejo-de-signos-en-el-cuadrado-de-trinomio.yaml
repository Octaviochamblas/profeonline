semantic_id: MAT.ALG.CUADRADO_TRINOMIO.MANEJO_SIGNOS
resumen_inicial: 'El manejo de signos en el cuadrado de trinomio consiste en aplicar la ley de signos en las tres multiplicaciones de los dobles productos conservando siempre positivos los tres términos cuadráticos $a^2, b^2, c^2$.'
explicacion_simple: |
  Cuando un trinomio contiene **signos negativos** (como $(a - b + c)^2$ o $(a - b - c)^2$):
  - **REGLAS DE SIGNOS FUNDAMENTALES**:
    1. **Los 3 cuadrados ($a^2, b^2, c^2$) NUNCA CAMBIAN DE SIGNO**: Son **SIEMPRE POSITIVOS (+)** (porque cualquier número al cuadrado da positivo).
    2. **El signo de cada doble producto** depende de multiplicar los signos de la pareja:
       - $(+) \cdot (+) \implies \mathbf{+}$
       - $(+) \cdot (-) \implies \mathbf{-}$
       - $(-) \cdot (-) \implies \mathbf{+}$
  - **Ejemplo con $(x - y + 3)^2$**:
    - Cuadrados (todos positivos): $x^2 + y^2 + 9$.
    - Doble prod 1 ($x$ por $-y$): $2(x)(-y) = \mathbf{-2xy}$.
    - Doble prod 2 ($x$ por $+3$): $2(x)(+3) = \mathbf{+6x}$.
    - Doble prod 3 ($-y$ por $+3$): $2(-y)(+3) = \mathbf{-6y}$.
    - Resultado expandido: **$x^2 + y^2 + 9 - 2xy + 6x - 6y$**.
explicacion_formal: |
  ### Definición formal
  Sea la trinomía con signatura general $T = (\sigma_1 a + \sigma_2 b + \sigma_3 c)$ donde $\sigma_i \in \{-1, +1\}$. La expansión de la potencia cuadrática viene dada por:

  $$T^2 = (\sigma_1 a)^2 + (\sigma_2 b)^2 + (\sigma_3 c)^2 + 2(\sigma_1 a)(\sigma_2 b) + 2(\sigma_1 a)(\sigma_3 c) + 2(\sigma_2 b)(\sigma_3 c)$$

  Debido a que $(\sigma_i t)^2 = \sigma_i^2 t^2 = (+1) t^2$, la componente puramente cuadrática satisface la invarianza de signo:

  $$\sum_{i=1}^3 (\sigma_i t_i)^2 = a^2 + b^2 + c^2 \quad \forall \sigma_i \in \{-1, +1\}$$

  mientras que los signos de las 3 componentes cruzadas vienen dados por el producto directo de sus signaturas: $\operatorname{sgn}(2ab) = \sigma_1 \sigma_2$, $\operatorname{sgn}(2ac) = \sigma_1 \sigma_3$, $\operatorname{sgn}(2bc) = \sigma_2 \sigma_3$.

  ### Síntesis didáctica
  Reconocer que los tres términos cuadráticos permanecen invariantes con signo positivo ayuda a concentrar el control de errores exclusivamente en la ley de signos de los dobles productos.
definiciones_clave: |
  - **Invarianza cuadrática de signo**: Principio por el cual $a^2, b^2, c^2$ son estrictamente positivos sin importar el signo original de los términos del trinomio.
  - **Signatura cruzada ($\sigma_i \sigma_j$)**: Producto de signos que determina unívocamente si un doble producto es positivo o negativo.
  - **Matriz de signaturas pareadas**: Sistema de 3 signos resultantes para los dobles productos $2ab, 2ac, 2bc$.
propiedades_relaciones: |
  - **Equivalencia de trinomios opuestos**: $(-a - b - c)^2 = (a + b + c)^2$. Cambiar el signo a los 3 términos produce exactamente la misma expansión de 6 términos positivos.
  - **Dos términos negativos en la trinomía**: $(a - b - c)^2 = a^2 + b^2 + c^2 - 2ab - 2ac + 2bc$ (el producto de los dos negativos $-b \cdot -c$ produce $+2bc$).
ejemplo_guiado:
  enunciado: 'Desarrolla el cuadrado de trinomio $(2x - y - 4)^2$ aplicando las reglas de signos.'
  pasos:
    - 'Paso 1: Identificamos los tres términos con sus signos: $+2x$, $-y$, $-4$.'
    - 'Paso 2: Elevamos al cuadrado respetando la invarianza positiva de los cuadrados:
       $(2x)^2 + (-y)^2 + (-4)^2 = \mathbf{4x^2 + y^2 + 16}$.'
    - 'Paso 3: Calculamos el primer doble producto ($+2x$ por $-y$):
       $2 \cdot (2x) \cdot (-y) = \mathbf{-4xy}$.'
    - 'Paso 4: Calculamos el segundo doble producto ($+2x$ por $-4$):
       $2 \cdot (2x) \cdot (-4) = \mathbf{-16x}$.'
    - 'Paso 5: Calculamos el tercer doble producto ($-y$ por $-4$):
       $2 \cdot (-y) \cdot (-4) = \mathbf{+8y}$ (¡negativo por negativo da positivo!).'
    - 'Paso 6: Unimos los 6 términos: $4x^2 + y^2 + 16 - 4xy - 16x + 8y$.'
    - 'Conclusión: El desarrollo es **$4x^2 + y^2 + 16 - 4xy - 16x + 8y$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la expansión del cuadrado de trinomio $(a - b - c)^2$, ¿por qué el doble producto $2bc$ tiene signo positivo (+)?'
    choices:
      - {text: 'Porque se multiplica el término $-b$ por el término $-c$, y el producto de dos números negativos es positivo ($(-b)(-c) = +bc \implies +2bc$)', is_correct: true}
      - {text: 'Porque todos los dobles productos son positivos', is_correct: false}
      - {text: 'Porque se le cambia el signo al azar', is_correct: false}
      - {text: 'Porque la constante es mayor', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque se multiplica el término $-b$ por el término $-c$, y el producto de dos números negativos es positivo ($(-b)(-c) = +bc \implies +2bc$)''. Ley de signos $(-)(-) = +$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de expandir $(x - 2y + 3)^2$?'
    choices:
      - {text: 'El resultado es $x^2 + 4y^2 + 9 - 4xy + 6x - 12y$, manteniendo los cuadrados positivos y aplicando ley de signos en dobles productos', is_correct: true}
      - {text: 'El resultado es $x^2 - 4y^2 + 9 - 4xy + 6x - 12y$', is_correct: false}
      - {text: 'El resultado es $x^2 + 4y^2 + 9 + 4xy + 6x + 12y$', is_correct: false}
      - {text: 'El resultado es $x^2 - 4y^2 - 9 - 4xy - 6x - 12y$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $x^2 + 4y^2 + 9 - 4xy + 6x - 12y$, manteniendo los cuadrados positivos y aplicando ley de signos en dobles productos''. $x^2 + 4y^2 + 9 - 4xy + 6x - 12y$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir los tres términos cuadráticos siempre con signo positivo ($a^2 + b^2 + c^2$).'
  - 'Paso 2: Determinar el signo del primer doble producto multiplicando los signos del 1.er y 2.º término.'
  - 'Paso 3: Determinar el signo del segundo doble producto multiplicando los signos del 1.er y 3.er término.'
  - 'Paso 4: Determinar el signo del tercer doble producto multiplicando los signos del 2.º y 3.er término.'
errores_correccion: |
  - **Error 1:** Asignar signo negativo a los términos cuadráticos cuyos monomios originales son negativos (escribir $(-y)^2 = -y^2$). **Cómo corregirlo:** Todo término al cuadrado **ES SIEMPRE POSITIVO ($(-y)^2 = +y^2$)**.
  - **Error 2:** Escribir signo negativo en el producto de dos términos negativos (escribir $2(-b)(-c) = -2bc$). **Cómo corregirlo:** El producto de dos negativos **ES POSITIVO ($(-b)(-c) = +bc \implies +2bc$)**.
ejemplos:
  - titulo: 'Invarianza de cuadrados'
    enunciado: 'En $(-a - b + c)^2$, ¿son los términos cuadráticos $a^2 + b^2 + c^2$ todos positivos?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $(-a)^2 = a^2$.'
      - '2. $(-b)^2 = b^2$.'
      - '3. $c^2 = c^2$.'
      - '4. Cuadrados: $a^2 + b^2 + c^2$.'
  - titulo: 'Doble producto negativo-negativo'
    enunciado: 'Para $(x - 4 - y)^2$, ¿cuál es el signo del doble producto entre $-4$ y $-y$?'
    alternativas:
      - 'Positivo (+8y)'
      - 'Negativo (-8y)'
      - 'Cero'
    respuesta: 'Positivo (+8y)'
    solucion_pasos:
      - '1. $2(-4)(-y) = +8y$.'
  - titulo: 'Equivalencia de trinomio totalmente negativo'
    enunciado: '¿Es el desarrollo de $(-x - y - z)^2$ idéntico al de $(x + y + z)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $[-1(x+y+z)]^2 = (+1)(x+y+z)^2$.'
  - titulo: 'Combinación de tres signos'
    enunciado: 'En $(a - b + c)^2$, ¿es la secuencia de dobles productos $-2ab + 2ac - 2bc$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $+a(-b) = -ab$, $+a(+c) = +ac$, $-b(+c) = -bc$.'
errores_frecuentes:
  - 'Colocar signos negativos en los términos cuadráticos $a^2, b^2, c^2$ al elevar monomios negativos.'
  - 'Colocar signo negativo al multiplicar dos términos que son ambos negativos en el trinomio.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Ignorar el signo de los términos al calcular las combinaciones cruzadas.'
  - 'Suponer que cambiar todos los signos del trinomio invierte los signos del resultado.'
afirmaciones_verdaderas:
  - 'Los tres términos cuadráticos $a^2, b^2, c^2$ en la expansión de un trinomio son siempre positivos.'
  - 'El signo de cada doble producto depende del producto de los signos de la pareja de monomios que lo integran.'
al_terminar_debes_poder: 'Manejar la ley de signos en los dobles productos manteniendo la invarianza positiva de los tres términos cuadráticos.'
