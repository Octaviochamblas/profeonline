resumen_inicial: El manejo de signos en el cuadrado de trinomio rige los signos positivos
  o negativos de los tres dobles productos según los signos de los términos del trinomio.
explicacion_simple: 'Cuando hay signos menos en el trinomio como $(a - b + c)^2$,
  los tres cuadrados siempre son positivos ($a^2 + b^2 + c^2$). El signo de cada doble
  producto depende de la ley de signos al multiplicar cada pareja: $2(a)(-b) = -2ab$,
  $2(a)(c) = +2ac$, y $2(-b)(c) = -2bc$.'
explicacion_formal: 'Sea $(s_1 A + s_2 B + s_3 C)^2$ con $s_1, s_2, s_3 \in \{+1,
  -1\}$. La distribución de signos en los 6 términos es:


  $$(s_1 A + s_2 B + s_3 C)^2 = A^2 + B^2 + C^2 + 2(s_1 s_2)AB + 2(s_1 s_3)AC + 2(s_2
  s_3)BC$$


  **Propiedad de los signos:**

  - $A^2, B^2, C^2 > 0$: Los tres cuadrados son strictly positivos en $\mathbb{R}$.

  - $2(s_1 s_2)AB$: Positivo si $s_1, s_2$ son del mismo signo; negativo si son de
  signos opuestos.

  - $2(s_1 s_3)AC$: Positivo si $s_1, s_3$ son del mismo signo; negativo si son de
  signos opuestos.

  - $2(s_2 s_3)BC$: Positivo si $s_2, s_3$ son del mismo signo; negativo si son de
  signos opuestos.


  > **Complemento didáctico:** Evita confundir la positividad estructural de las potencias
  pares con la polaridad de los dobles productos.'
definiciones_clave: '- **Positividad universal de cuadrados**: $A^2, B^2, C^2 \ge
  0$ para todo valor real.

  - **Regla de parejas de signos**: Signo del doble producto $= s_i \cdot s_j$.'
propiedades_relaciones: '- **Invariancia por negación total**: $(-a - b - c)^2 = (a
  + b + c)^2$, todos los 6 términos resultan positivos.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(x - y + 2)^2$ aplicando las reglas de signos
    para los dobles productos.
  pasos:
  - 'Paso 1: Identificar $a = x, b = -y, c = +2$.'
  - 'Paso 2: Elevar al cuadrado los tres términos (todos positivos): $x^2 + (-y)^2
    + 2^2 = x^2 + y^2 + 4$.'
  - 'Paso 3: Primer doble producto: $2(x)(-y) = -2xy$.'
  - 'Paso 4: Segundo doble producto: $2(x)(+2) = +4x$.'
  - 'Paso 5: Tercer doble producto: $2(-y)(+2) = -4y$.'
  - 'Paso 6: Ensamblar los seis términos: $x^2 + y^2 + 4 - 2xy + 4x - 4y$.'
  - 'Conclusión: El desarrollo correcto es $x^2 + y^2 - 2xy + 4x - 4y + 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: En el desarrollo de $(a - b - c)^2$, ¿cuál es el signo del doble producto
    $2bc$ entre los dos términos negativos?
  choices:
  - text: Positivo ($+2bc$), porque $(-b) \cdot (-c) = +bc$
    is_correct: true
  - text: Negativo ($-2bc$)
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Depende de las variables
    is_correct: false
  explanation: La alternativa correcta es 'Positivo ($+2bc$), porque $(-b) \cdot (-c)
    = +bc$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expansión de $(x - y + 2)^2$, ¿cuáles dobles productos resultan
    con signo negativo?
  choices:
  - text: $-2xy$ y $-4y$, porque involucran al término restado $-y$
    is_correct: true
  - text: Los tres dobles productos
    is_correct: false
  - text: Ninguno, todos son positivos
    is_correct: false
  - text: Solo $+4x$
    is_correct: false
  explanation: La alternativa correcta es '$-2xy$ y $-4y$, porque involucran al término
    restado $-y$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los tres cuadrados siempre positivos $+A^2 + B^2 + C^2$.'
- 'Paso 2: Determinar el signo de $2AB$ aplicando $+ \cdot + = +$, $+ \cdot - = -$,
  o $- \cdot - = +$.'
- 'Paso 3: Repetir el análisis de signos para $2AC$ y $2BC$ y ensamblar el polinomio.'
errores_correccion: '- **Error 1: Poner signos negativos a los cuadrados $B^2$ o $C^2$
  cuando el término original es negativo.** **Cómo corregirlo:** El cuadrado de cualquier
  número real es SIEMPRE positivo ($(-b)^2 = +b^2$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(m - n - 3)^2$.
  alternativas:
  - $m^2 + n^2 + 9 - 2mn - 6m + 6n$
  - $m^2 - n^2 - 9 - 2mn - 6m - 6n$
  - $m^2 + n^2 + 9 - 2mn - 6m - 6n$
  respuesta: $m^2 + n^2 + 9 - 2mn - 6m + 6n$
  solucion_pasos:
  - '1. Cuadrados positivos: $m^2 + n^2 + 9$.'
  - '2. Dobles: $2(m)(-n) = -2mn$, $2(m)(-3) = -6m$, $2(-n)(-3) = +6n$.'
  - '3. Resultado: $m^2 + n^2 - 2mn - 6m + 6n + 9$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(-a + b + c)^2$?
  alternativas:
  - $a^2 + b^2 + c^2 - 2ab - 2ac + 2bc$
  - $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$
  - $-a^2 + b^2 + c^2 - 2ab - 2ac + 2bc$
  respuesta: $a^2 + b^2 + c^2 - 2ab - 2ac + 2bc$
  solucion_pasos:
  - '1. Cuadrados: $a^2 + b^2 + c^2$.'
  - '2. Dobles: $2(-a)(b) = -2ab$, $2(-a)(c) = -2ac$, $2(b)(c) = +2bc$.'
  - '3. Resultado: $a^2 + b^2 + c^2 - 2ab - 2ac + 2bc$.'
- titulo: ¿El desarrollo de $(-x - y - z)^2$ es exactamente igual al de $(x + y +
    z)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^2 = 1$, los 6 términos resultan estrictamente positivos.
- titulo: ¿Puede el cuadrado de un término real en el trinomio resultar con signo
    negativo en la expansión?
  respuesta: 'No'
  solucion_pasos:
  - No, los tres cuadrados $A^2, B^2, C^2$ son siempre mayores o iguales a cero.
errores_frecuentes:
- Asignar signo negativo a los términos cuadráticos $B^2$ o $C^2$ al elevar términos
  negativos.
- Declarar que todos los dobles productos son negativos cuando un solo término es
  negativo.
- Asignar signo negativo al producto de dos términos negativos $(-b)(-c) = +bc$.
- Declarar que los signos del cuadrado de trinomio no dependen de los signos de los
  monomios.
- Asignar signo positivo a los 6 términos cuando el trinomio contiene restas.
afirmaciones_verdaderas:
- Los tres primeros términos cuadráticos en el desarrollo del cuadrado de trinomio
  son siempre positivos.
- El producto de dos términos con el mismo signo genera un doble producto con signo
  positivo.
al_terminar_debes_poder: Al terminar serás capaz de determinar los signos exactos
  de los 6 términos del cuadrado de trinomio para cualquier combinación de restas.
