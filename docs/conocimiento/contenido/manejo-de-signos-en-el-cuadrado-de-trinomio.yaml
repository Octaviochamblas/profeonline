procedimiento:
- 'Paso 1: Identifica los 3 términos con sus signos antes de empezar y aplica la regla
  de los signos en cada doble producto.'
- El doble producto de $x$ y $-y$ es $2(x)(-y) = -2xy$. Coeficiente $-2$.
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en manejo de signos en el cuadrado de trinomio.
ejemplos:
- titulo: Con signos negativos
  enunciado: Calcula $(2m - n + 3)^2$.
  solucion_pasos:
  - 'Términos: $2m, -n, 3$.'
  - 'Cuadrados: $4m^2 + n^2 + 9$.'
  - 'Dobles: $2(2m)(-n) = -4mn$; $2(2m)(3) = 12m$; $2(-n)(3) = -6n$.'
  - 'Total: $4m^2 + n^2 + 9 - 4mn + 12m - 6n$.'
- titulo: Si se desarrolla $(x - y - 1)^2$, ¿cuál es el coeficiente del término $xy$
  enunciado: 'Si se desarrolla $(x - y - 1)^2$, ¿cuál es el coeficiente del término
    $xy$?


    Opciones: A) $-2$ · B) $2$ · C) $1$ · D) $-1$'
  solucion_pasos:
  - El doble producto de $x$ y $-y$ es $2(x)(-y) = -2xy$. Coeficiente $-2$.
- titulo: 'Respecto de «Manejo de signos en el cuadrado de trinomio»: ¿Se ajusta a
    la definición esta a'
  enunciado: 'Respecto de «Manejo de signos en el cuadrado de trinomio»: ¿Se ajusta
    a la definición esta afirmación? «En $(a-b-c)^2$: - Los cuadrados $a^2, b^2, c^2$
    siempre suman en positivo»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En $(a-b-c)^2$: - Los cuadrados
    $a^2, b^2, c^2$ siempre suman en positivo.'
- titulo: 'Respecto de «Manejo de signos en el cuadrado de trinomio»: ¿Es compatible
    con el procedimien'
  enunciado: 'Respecto de «Manejo de signos en el cuadrado de trinomio»: ¿Es compatible
    con el procedimiento esta afirmación? «Poner los cuadrados de los términos negativos
    con signo menos (ej. $-n^2$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En $(a-b-c)^2$: - Los cuadrados
    $a^2, b^2, c^2$ siempre suman en positivo.'
errores_frecuentes:
- Poner los cuadrados de los términos negativos con signo menos (ej. $-n^2$).
- Para «Si se desarrolla $(x - y - 1)^2$, ¿cuál es el coeficiente del término $xy$»,
  la respuesta correcta es $2$.
- Para «Si se desarrolla $(x - y - 1)^2$, ¿cuál es el coeficiente del término $xy$»,
  la respuesta correcta es $1$.
- La afirmación «$-2$» no es válida en este contenido.
- En $(a-b-c)^2$, todos los dobles productos tienen signo negativo.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
