semantic_id: MAT.NUM.ENTEROS_OPERATORIA.CONMUTATIVA_ADICION
resumen_inicial: 'El orden de los sumandos no altera la suma: $a + b = b + a$ para todo $a, b \in \mathbb{Z}$.'
explicacion_simple: 'La propiedad conmutativa significa que en la adición podemos cambiar el orden de los números que estamos sumando sin que el resultado cambie en absoluto. Sumar una ganancia a una deuda da exactamente el mismo resultado que sumar la deuda a la ganancia.


  ![Propiedad conmutativa de la adición](/static/img/nodos/propiedad-conmutativa-de-la-adicion-intro.svg)'
explicacion_formal: 'Para cualquier par de números enteros $a, b \in \mathbb{Z}$, la **Propiedad Conmutativa de la Adición** establece la identidad estructural:


  $$a + b = b + a$$


  **Desglose de la fórmula:**

  - $a + b$: Suma de $a$ con $b$ en el orden directo.

  - $b + a$: Suma de $b$ con $a$ en el orden inverso.

  - $=$: Igualdad estricta de los resultados numéricos para cualquier par en $\mathbb{Z}$.


  > **Complemento didáctico:** En $(-8) + 5 = 5 + (-8) = -3$, el intercambio de posiciones no altera la posición final en la recta numérica.'
definiciones_clave: '- **Propiedad conmutativa**: Independencia del resultado respecto al orden de los operandos en la adición.'
propiedades_relaciones: '- **Exclusividad operativa**: Válida en adición y multiplicación; falsa en sustracción y división.'
ejemplo_guiado:
  enunciado: 'Demuestre la propiedad conmutativa evaluando ambos lados de $(-9) + 4 = 4 + (-9)$.


    ![Ejemplo Propiedad conmutativa de la adición](/static/img/nodos/propiedad-conmutativa-de-la-adicion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Evaluar el lado izquierdo: $(-9) + 4 = -5$.'
  - 'Paso 2: Evaluar el lado derecho: $4 + (-9) = -5$.'
  - 'Conclusión: Ambos lados dan $-5$, verificando que $a + b = b + a$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad conmutativa de la adición de enteros?
  choices:
  - text: Que cambiar el orden de los sumandos no altera el resultado (a + b = b + a)
    is_correct: true
  - text: Que al sumar cero el número no cambia
    is_correct: false
  - text: Que la suma de dos negativos es positiva
    is_correct: false
  - text: Que se pueden agrupar tres sumandos de cualquier forma
    is_correct: false
  explanation: La alternativa correcta es 'Que cambiar el orden de los sumandos no altera el resultado (a + b = b + a)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado idéntico obtenido en ambos lados?
  choices:
  - text: '-5'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '-13'
    is_correct: false
  - text: '13'
    is_correct: false
  explanation: La alternativa correcta es '-5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el valor de la suma en el orden inicial $a + b$.'
- 'Paso 2: Calcular el valor de la suma invirtiendo el orden $b + a$.'
- 'Paso 3: Verificar que ambos valores sean numéricamente idénticos.'
errores_correccion: '- **Error 1: Intentar aplicar la propiedad conmutativa a la sustracción ($a - b = b - a$).** **Cómo corregirlo:** La resta no es conmutativa ($5 - 2 \neq 2 - 5$).


  - **Error 2: Olvidar conservar el signo del número al cambiar el orden.** **Cómo corregirlo:** Mover el número junto a su signo $(-9 + 4 = 4 - 9)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $(-15) + 8 = -7$, ¿cuál es el valor de $8 + (-15)$?
  alternativas:
  - '-7'
  - '7'
  - '23'
  respuesta: '-7'
  solucion_pasos:
  - Por propiedad conmutativa, $8 + (-15) = (-15) + 8 = -7$.
- titulo: Ejemplo 2
  enunciado: ¿Aplica la propiedad conmutativa para la sustracción de enteros $10 - 4$ y $4 - 10$?
  alternativas:
  - No, la resta no es conmutativa
  - Sí, dan lo mismo
  - Solo en números pares
  respuesta: No, la resta no es conmutativa
  solucion_pasos:
  - $10 - 4 = 6$, mientras que $4 - 10 = -6$. No son iguales.
- titulo: ¿Es cierto que (-3) + (-8) da el mismo resultado que (-8) + (-3)?
  respuesta: Sí
  solucion_pasos:
  - Sí, la adición de enteros cumple la propiedad conmutativa.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
- titulo: ¿Cumple la división de enteros la propiedad conmutativa?
  respuesta: 'No'
  solucion_pasos:
  - 'No, $8 : 2 = 4$, mientras que $2 : 8 = 0.25$.'
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
errores_frecuentes:
- Cambiar el orden de los términos en una sustracción conserva el mismo resultado final.
- La propiedad conmutativa de la adición exige que ambos sumandos sean enteros positivos.
- Invertir la posición de los sumandos en $(-5) + 2$ cambia el signo del resultado final.
- La adición de tres enteros requiere conmutar dos veces para mantener el resultado.
- La propiedad conmutativa se aplica únicamente en la división de enteros.
afirmaciones_verdaderas:
- En la adición de enteros, $a + b = b + a$ para todo par de elementos.
- La propiedad conmutativa no es válida para la sustracción de enteros.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad conmutativa de la adición para simplificar cálculos numéricos y algebraicos.


  **CÓMO:** Reorganizando el orden de los sumandos según $a + b = b + a$, agrupando positivos por un lado y negativos por otro para agilizar la resolución.


  ![Resumen Propiedad conmutativa de la adición](/static/img/nodos/propiedad-conmutativa-de-la-adicion-resumen.svg)'
