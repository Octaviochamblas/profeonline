semantic_id: MAT.NUM.ENTEROS_OPERATORIA.CONMUTATIVA_ADICION
resumen_inicial: "La propiedad conmutativa dice que al sumar enteros, el orden de los sumandos no altera el resultado: $a+b=b+a$."
explicacion_simple: |
  Si pones primero manzanas y luego peras en una canasta, obtienes la misma cantidad de
  frutas que si pones primero las peras y luego las manzanas. Con los números enteros pasa
  igual: $-3+(+5)=+2$ y $+5+(-3)=+2$, dan el mismo resultado. A esta regla se le llama
  propiedad conmutativa: el orden de los sumandos no altera la suma.
explicacion_formal: |
  Para todo $a, b \in \mathbb{Z}$: $a + b = b + a$. En la recta numérica, da lo mismo
  partir de $a$ y avanzar según $b$, que partir de $b$ y avanzar según $a$: se llega al
  mismo punto de destino.
definiciones_clave: |
  **Propiedad conmutativa**: el orden de los sumandos no altera el resultado de una suma.
  Se cumple para la adición, pero no para la sustracción.
propiedades_relaciones: |
  La propiedad conmutativa se cumple para cualquier par de enteros, incluyendo cuando uno
  de ellos es cero. No se cumple para la resta: $a - b \neq b - a$ en general.
ejemplo_guiado:
  enunciado: "Verifica la propiedad conmutativa para $(-9) + (+16)$."
  pasos:
    - "Orden original: $(-9) + (+16) = 7$."
    - "Orden invertido: $(+16) + (-9) = 7$."
    - "Ambos resultados coinciden: se cumple la propiedad conmutativa."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estas operaciones NO cumple la propiedad conmutativa en $\\mathbb{Z}$?"
    choices:
      - {text: "La adición", is_correct: false}
      - {text: "La sustracción", is_correct: true}
      - {text: "Ambas la cumplen", is_correct: false}
      - {text: "Ninguna la cumple", is_correct: false}
    explanation: "La correcta es La sustracción: $a-b$ no es igual a $b-a$ en general, a diferencia de la adición."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿coinciden $(-20)+(+6)$ y $(+6)+(-20)$?"
    choices:
      - {text: "Sí, ambos dan $-14$", is_correct: true}
      - {text: "No, dan resultados distintos", is_correct: false}
      - {text: "Sí, pero solo porque ambos dan cero", is_correct: false}
      - {text: "No se puede saber sin calcular", is_correct: false}
    explanation: "La correcta es Sí, ambos dan $-14$: la propiedad conmutativa garantiza que el orden no cambia el resultado."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar los dos números enteros que se están sumando ($a$ y $b$)."
  - "Paso 2: Escribir la suma original $a + b$ y calcular su resultado."
  - "Paso 3: Escribir la suma con el orden invertido $b + a$ y calcular su resultado."
  - "Paso 4: Verificar que ambos resultados sean idénticos, confirmando que se cumple la propiedad conmutativa."
errores_correccion: |
  Un error frecuente es creer que la propiedad conmutativa también se aplica a la resta;
  no es así, porque cambiar el orden de una resta cambia el signo del resultado. Otro
  error es cambiar el signo de los números al invertir su orden, en vez de solo mover su
  posición.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Demostrar que se cumple la propiedad conmutativa para la suma $(-14) + (-6)$."
    alternativas:
      - "$-20$ en ambos órdenes"
      - "$-20$ y $20$ según el orden"
      - "$8$ en ambos órdenes"
    respuesta: "$-20$ en ambos órdenes"
    solucion_pasos:
      - "Identificar los sumandos: $a = -14$ y $b = -6$."
      - "Calcular la suma en el orden original: $(-14) + (-6) = -20$."
      - "Calcular la suma en el orden inverso: $(-6) + (-14) = -20$."
      - "Comparar los resultados: como ambos dan $-20$, se comprueba que $(-14) + (-6) = (-6) + (-14)$."
  - titulo: "Ejemplo 2"
    enunciado: "Reorganizar la expresión $(-25) + (+40)$ usando la propiedad conmutativa y calcular su valor."
    alternativas:
      - "$15$"
      - "$-15$"
      - "$65$"
    respuesta: "$15$"
    solucion_pasos:
      - "Aplicar la propiedad conmutativa para cambiar el orden de los sumandos: la expresión se convierte en $(+40) + (-25)$."
      - "Resolver la nueva suma: como tienen signos diferentes, restamos sus valores absolutos: $40 - 25 = 15$."
      - "El número con mayor valor absoluto es el positivo ($+40$), por lo que el resultado es $+15$ (o $15$)."
  - titulo: "¿Se cumple la propiedad conmutativa si uno de los sumandos es cero?"
    respuesta: "Sí"
    solucion_pasos:
      - "Si tomamos $a = -7$ y $b = 0$."
      - "Calculamos en orden original: $(-7) + 0 = -7$."
      - "Calculamos en orden inverso: $0 + (-7) = -7$."
      - "Dado que ambos dan el mismo resultado, la propiedad se cumple perfectamente."
  - titulo: "¿La sustracción (resta) de enteros cumple con la propiedad conmutativa?"
    respuesta: "No"
    solucion_pasos:
      - "Tomemos un contraejemplo simple: $a = 5$ y $b = 3$."
      - "Por un lado, $5 - 3 = 2$."
      - "Por otro lado, $3 - 5 = -2$."
      - 'Como $2 \neq -2$, la propiedad conmutativa no es válida para la sustracción.'
errores_frecuentes:
  - "Creer que la propiedad conmutativa también se aplica a la resta de números enteros (ej: pensar que $5 - 8$ es lo mismo que $8 - 5$)."
  - "Cambiar el signo de los números al cambiar su orden (ej: transformar $(-3) + (+5)$ en $(+3) + (-5)$)."
  - "Pensar que la propiedad conmutativa solo se cumple cuando ambos números tienen el mismo signo."
  - "Confundir la propiedad conmutativa (el orden de dos elementos) con la propiedad asociativa (la agrupación de tres o más elementos)."
  - "Creer que el orden de los sumandos altera el signo del resultado final en la adición."
afirmaciones_verdaderas:
  - "El orden de los sumandos no altera la suma."
  - "5+3 es igual a 3+5."
al_terminar_debes_poder: |
  Reconocer y aplicar la propiedad conmutativa de la adición para reordenar sumandos con
  fines de cálculo, y explicar por qué no aplica a la sustracción.
fuente: "Enteros"
estado: publicado
