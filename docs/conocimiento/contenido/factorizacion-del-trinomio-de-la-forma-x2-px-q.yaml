semantic_id: MAT.ALG.FACTOR_TRINOMIOS.FACTORIZACION_SIMPLE
resumen_inicial: La factorización del trinomio de la forma $x^2 + px + q$ establece la equivalencia $x^2 + px + q = (x + r)(x
  + s)$ donde $r$ y $s$ son las componentes del par numérico hallado.
explicacion_simple: "Una vez que encontraste los dos números del par numérico $r$ y $s$ para $x^2 + px + q$:\n- **FÓRMULA\
  \ DIRECTA DE FACTORIZACIÓN MÓNICA**:\n  $$\\mathbf{x^2 + px + q = (x + r)(x + s)}$$\n- **Ejemplo**: Para factorizar $x^2\
  \ + 5x + 6$:\n  1. Buscamos dos números que multipliquen $6$ y sumen $5 \\implies \\mathbf{r = 2}$ y $\\mathbf{s = 3}$.\n\
  \  2. Armamos la factorización directa colocando las variables y los números encontrados:\n     $$\\mathbf{(x + 2)(x + 3)}$$\n\
  - **Comprobación rápida (Distribución F.O.I.L.)**:\n  - $(x+2)(x+3) = x^2 + 3x + 2x + 6 = \\mathbf{x^2 + 5x + 6}$. ¡Es exactamente\
  \ el polinomio original!\n\n![Factorización del trinomio mónico](/static/img/nodos/factorizacion-del-trinomio-de-la-forma-x2-px-q-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el trinomio cuadrático mónico $P(x) = x^2 + px + q \in \mathbb{R}[x]$ y sea $(r, s) \in \mathbb{R}^2$ el par numérico
  que satisface $r \cdot s = q$ y $r + s = p$. El **Teorema de Descomposición Binómica Mónica** establece la identidad polinómica:


  $$\mathbf{x^2 + px + q = (x + r)(x + s)}$$


  ### Demostración por Expansión Distributiva

  Al multiplicar el miembro derecho:


  $$(x + r)(x + s) = x \cdot x + s \cdot x + r \cdot x + r \cdot s = x^2 + (r + s)x + r \cdot s$$


  Sustituyendo $r + s = p$ y $r \cdot s = q$:


  $$x^2 + (r + s)x + r \cdot s = \mathbf{x^2 + px + q}$$


  lo cual demuestra la bidireccionalidad de la transformación factorizada.


  ### Síntesis didáctica

  Factorizar un trinomio mónico consiste en abrir dos paréntesis con la variable $x$ e insertar en cada uno los números $r$
  y $s$ con sus respectivos signos algebraicos.

  '
definiciones_clave: '- **Factores lineales binómicos ($(x+r), (x+s)$)**: Polinomios de primer grado cuya multiplicación produce
  el trinomio cuadrático mónico.

  - **Descomposición mónica**: Expresión de $x^2+px+q$ como producto de dos binomios cuyos coeficientes principales son igual
  a 1.

  - **Identidad de Viète reducida**: Relaciones $p = r+s$ y $q = r \cdot s$ que conectan los coeficientes con los números
  de la factorización.

  '
propiedades_relaciones: '- **Conmutatividad de factores**: $(x + r)(x + s) = (x + s)(x + r)$. El orden de los binomios en
  la respuesta final es irrelevante.

  '
ejemplo_guiado:
  enunciado: Factoriza completamente el trinomio cuadrático mónico $x^2 - 2x - 15$.
  pasos:
  - 'Paso 1: Identificamos $p = -2$ y $q = -15$.'
  - 'Paso 2: Buscamos dos números $r$ y $s$ tales que $r \cdot s = -15$ y $r + s = -2$.'
  - 'Paso 3: Evaluamos las opciones: Los números son **$r = -5$** y **$s = 3$** (puesto que $(-5) \cdot 3 = -15$ y $-5 + 3
    = -2$).'
  - 'Paso 4: Escribimos los binomios colocándolos en paréntesis con sus signos: $(x - 5)(x + 3)$.'
  - 'Conclusión: La factorización es **$(x - 5)(x + 3)$**.'
  imagen: /static/img/nodos/factorizacion-del-trinomio-de-la-forma-x2-px-q-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si el par numérico para factorizar un trinomio mónico es $r = 7$ y $s = -2$, ¿cuál es la expresión factorizada
    final?
  choices:
  - text: La expresión factorizada es $(x + 7)(x - 2)$, aplicando la fórmula $(x + r)(x + s)$
    is_correct: true
  - text: La expresión factorizada es $(x - 7)(x + 2)$
    is_correct: false
  - text: La expresión factorizada es $(x + 7) - (x - 2)$
    is_correct: false
  - text: La expresión factorizada es $(x^2 + 7)(x - 2)$
    is_correct: false
  explanation: La alternativa correcta es 'La expresión factorizada es $(x + 7)(x - 2)$, aplicando la fórmula $(x + r)(x +
    s)$'. Sustitución directa de $r=7$ y $s=-2 \implies (x+7)(x-2)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la factorización del trinomio $x^2 - 11x + 18$?
  choices:
  - text: La factorización es $(x - 9)(x - 2)$, porque $(-9) \cdot (-2) = +18$ y $(-9) + (-2) = -11$
    is_correct: true
  - text: La factorización es $(x + 9)(x + 2)$
    is_correct: false
  - text: La factorización es $(x - 6)(x - 3)$
    is_correct: false
  - text: La factorización es $(x - 18)(x - 1)$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $(x - 9)(x - 2)$, porque $(-9) \cdot (-2) = +18$ y $(-9) +
    (-2) = -11$'. Par numérico $(-9, -2) \implies (x-9)(x-2)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar los números $r$ y $s$ del par numérico que multiplican $q$ y suman $p$.'
- 'Paso 2: Abrir dos pares de paréntesis: $(x \quad )(x \quad )$.'
- 'Paso 3: Insertar en el primer paréntesis la variable $x$ seguida de $r$ con su signo.'
- 'Paso 4: Insertar en el segundo paréntesis la variable $x$ seguida de $s$ con su signo.'
errores_correccion: '- **Error 1:** Invertir los signos de los números $r$ y $s$ al escribir los binomios (escribir $(x -
  2)(x + 5)$ cuando el par es $r=2, s=-5$). **Cómo corregirlo:** Los números $r$ y $s$ **DEBEN CONSERVAR EXACTAMENTE SUS SIGNOS
  AL ENTRAR EN LOS FACTORES ($(x+2)(x-5)$)**.

  - **Error 2:** Colocar un signo de suma entre los dos binomios finales (escribir $(x+r) + (x+s)$). **Cómo corregirlo:**
  La factorización **ES UNA MULTIPLICACIÓN DE FACTORES SIN SIGNOS ENTRE PARÉNTESIS ($(x+r)(x+s)$)**.

  '
ejemplos:
- titulo: Dos números positivos
  enunciado: Para $r = 4$ y $s = 3$, ¿es $(x + 4)(x + 3)$ la factorización?
  respuesta: Sí
  solucion_pasos:
  - Sí, se colocan los números con sus signos.
- titulo: Dos números negativos
  enunciado: Para $r = -2$ y $s = -6$, ¿obtenemos $(x - 2)(x - 6)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, entran con signo negativo.
- titulo: Signos mixtos
  enunciado: Para $r = 8$ y $s = -1$, ¿es $(x + 8)(x - 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $+8$ y $-1$.
- titulo: Comprobación por multiplicación
  enunciado: ¿Recupera $(x-5)(x+3) = x^2 - 2x - 15$ el trinomio original?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicar valida la respuesta.
errores_frecuentes:
- Invertir los signos algebraicos de los componentes r y s al escribirlos dentro de los binomios.
- Colocar un signo de adición entre los binomios factores en lugar de expresar una multiplicación.
- La variable x no es incluida como primer término de los binomios.
- Modificar los números r y s tras haberlos verificado en las ecuaciones de suma y producto.
- Olvidar que $(x+r)(x+s) = (x+s)(x+r)$ son expresiones equivalentes.
afirmaciones_verdaderas:
- El trinomio mónico $x^2 + px + q$ factoriza como $(x + r)(x + s)$ con $r \cdot s = q$ y $r + s = p$.
- Los números del par conservan sus signos algebraicos dentro de los binomios resultantes.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/factorizacion-del-trinomio-de-la-forma-x2-px-q-resumen.svg)


  QUÉ: Factorizar cualquier trinomio cuadrático mónico en el producto de dos binomios lineales (x+r)(x+s).

  CÓMO: Escribir $(x + r)(x + s)$ insertando en cada binomio las constantes del par numérico hallado con sus signos algebraicos
  correspondientes y verificar mediante distribución F.O.I.L.

  '
