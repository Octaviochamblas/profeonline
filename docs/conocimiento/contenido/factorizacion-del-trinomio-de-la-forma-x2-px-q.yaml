semantic_id: MAT.ALG.FACTOR_TRINOMIOS.FACTORIZACION_SIMPLE
resumen_inicial: 'Factorización del trinomio de la forma x² + px + q: concepto, método
  de descomposición y reglas en Factorización de trinomios cuadráticos.'
explicacion_simple: 'Aquí la cosa se pone interesante. Cuando el tercer término es
  negativo, los números que buscamos pertenecen a bandos enemigos: uno es positivo
  y el otro negativo. La batalla se decide en la suma: el número más grande impondrá
  su signo.'
explicacion_formal: '### Definición formal


  El producto de un positivo y un negativo siempre resulta negativo.


  ### Desarrollo didáctico


  Analicemos el trinomio $x^2 + 2x - 15$.


  - Producto: $-15$. Esto significa que uno será $(+)$ y el otro $(-)$.

  - Suma: $+2$. Como la suma dio positivo, el número más grande tiene que ser el positivo.


  Escribimos las parejas que dan 15 (olvida el signo un segundo):

  - 1 y 15 (La resta/diferencia es 14) -> No.

  - 3 y 5 (La resta/diferencia es 2) -> Sí.


  Nuestros números son 3 y 5. Como el término central $+2$ es positivo, le damos el
  signo $+$ al mayor (el 5) y el signo $-$ al menor (el 3).


  Factorización: $(x + 5)(x - 3)$.

  (Si el centro hubiera sido $-2x$, habría sido al revés: el mayor habría sido negativo,
  quedando $(x - 5)(x + 3)$).'
definiciones_clave: '- **Factorización del trinomio de la forma x² + px + q**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización del trinomio de la forma x²
  + px + q.'
