resumen_inicial: La factorización del trinomio mónico de la forma $x^2 + px + q$ descompone
  el polinomio en el producto de dos binomios lineales con término común $(x + r)(x
  + s)$.
explicacion_simple: 'Una vez hallado el par numérico $r$ y $s$, armar la respuesta
  es muy fácil: escribes la variable $x$ en dos paréntesis y le agregas cada número
  con su signo: $(x + r)(x + s)$. Para $x^2 + 5x + 6$ con par $(2, 3)$, queda $(x
  + 2)(x + 3)$.'
explicacion_formal: 'Dado el trinomio mónico $P(x) = x^2 + px + q$ y el par numérico
  $(r, s)$ tal que $r+s=p$ y $rs=q$, la **Factorización del Trinomio Mónico** responde
  al teorema de descomposición en factores primos lineales:


  $$x^2 + px + q = (x + r)(x + s)$$


  **Desglose simbólico:**

  - $x$: Término común en ambos binomios.

  - $r, s$: Términos independientes no comunes correspondientes al par numérico.

  - $(x + r)(x + s) = x^2 + (r+s)x + rs = x^2 + px + q$: Verificación por desarrollo
  distributivo.


  > **Complemento didáctico:** Demuestra que todo trinomio mónico factorizable en
  $\mathbb{R}$ se convierte en un producto de binomios con término común.'
definiciones_clave: '- **Binomios con término común**: Estructura $(x + a)(x + b)$
  que comparte la variable $x$.

  - **Factorización mónica**: Expresión final en producto de factores lineales de
  grado 1.'
propiedades_relaciones: '- **Inversidad del producto notable**: Es la operación inversa
  directa del producto de binomios con término común $(x+a)(x+b) = x^2 + (a+b)x +
  ab$.'
ejemplo_guiado:
  enunciado: Factorice el trinomio cuadrático mónico $x^2 - 8x + 15$.
  pasos:
  - 'Paso 1: Identificar los coeficientes $p = -8$ y $q = 15$.'
  - 'Paso 2: Obtener el par numérico que suma $-8$ y multiplica $15$: $r = -3$ y $s
    = -5$.'
  - 'Paso 3: Construir el primer factor binomio con la variable $x$ y $r$: $(x - 3)$.'
  - 'Paso 4: Construir el segundo factor binomio con la variable $x$ y $s$: $(x -
    5)$.'
  - 'Paso 5: Multiplicar ambos binomios: $(x - 3)(x - 5)$.'
  - 'Conclusión: La factorización de $x^2 - 8x + 15$ es $(x - 3)(x - 5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la estructura algebraica factorizada de un trinomio mónico $x^2
    + px + q$ con par numérico $(r, s)$?
  choices:
  - text: $(x + r)(x + s)$
    is_correct: true
  - text: $(x - r)^2$
    is_correct: false
  - text: $(r x + s)^2$
    is_correct: false
  - text: $(x^2 + r)(x^2 + s)$
    is_correct: false
  explanation: La alternativa correcta es '$(x + r)(x + s)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $x^2 - 8x + 15$ utilizando el par $(-3, -5)$, ¿cuál es el
    producto de binomios obtenido?
  choices:
  - text: $(x - 3)(x - 5)$
    is_correct: true
  - text: $(x + 3)(x + 5)$
    is_correct: false
  - text: $(x - 8)(x + 15)$
    is_correct: false
  - text: $(x - 3)^2$
    is_correct: false
  explanation: La alternativa correcta es '$(x - 3)(x - 5)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar el par numérico $(r, s)$ que satisface la suma $p$ y el producto
  $q$.'
- 'Paso 2: Escribir dos paréntesis conteniendo la variable $x$ al inicio.'
- 'Paso 3: Colocar $r$ en el primer paréntesis y $s$ en el segundo paréntesis manteniendo
  sus respectivos signos.'
errores_correccion: '- **Error 1: Colocar la variable elevada al cuadrado dentro de
  los binomios resultantes obteniendo $(x^2 + r)(x^2 + s)$.** **Cómo corregirlo:**
  Los factores resultantes son lineales, por lo que la variable DEBE ser de primer
  grado ($x$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice el trinomio $x^2 + 2x - 24$.
  alternativas:
  - $(x + 6)(x - 4)$
  - $(x - 6)(x + 4)$
  - $(x + 12)(x - 2)$
  respuesta: $(x + 6)(x - 4)$
  solucion_pasos:
  - 1. Par numérico $(6, -4)$.
  - '2. Factores: $(x + 6)(x - 4)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la expresión factorizada de $y^2 - 9y + 20$?
  alternativas:
  - $(y - 4)(y - 5)$
  - $(y + 4)(y + 5)$
  - $(y - 2)(y - 10)$
  respuesta: $(y - 4)(y - 5)$
  solucion_pasos:
  - 1. Par numérico $(-4, -5)$.
  - '2. Factores: $(y - 4)(y - 5)$.'
- titulo: ¿Es $(a - 7)(a + 2)$ la forma factorizada de $a^2 - 5a - 14$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el par numérico $(-7, 2)$ genera $(a - 7)(a + 2)$.
- titulo: ¿El orden de los paréntesis en $(x + r)(x + s)$ altera la validez de la
    factorización?
  respuesta: 'No'
  solucion_pasos:
  - No, por la conmutatividad de la multiplicación $(x + r)(x + s) = (x + s)(x + r)$.
errores_frecuentes:
- Colocar la variable $x^2$ dentro de los paréntesis resultando en un producto de
  cuadráticos $(x^2 + r)(x^2 + s)$.
- Cambiar arbitrariamente los signos del par numérico $(r, s)$ al colocarlos dentro
  de los binomios.
- Escribir una suma entre los dos paréntesis finales en lugar del producto.
- Declarar que los coeficientes $p$ y $q$ deben ser colocados directamente en el primer
  y segundo paréntesis.
- Multiplicar la variable $x$ por el par numérico dentro del paréntesis obteniendo
  $(rx + s)$.
afirmaciones_verdaderas:
- La factorización de $x^2 + px + q$ produce el producto de dos binomios con término
  común $(x + r)(x + s)$.
- El desarrollo multiplicativo de $(x + r)(x + s)$ regenera exactamente el trinomio
  mónico original.
al_terminar_debes_poder: Al terminar serás capaz de factorizar trinomios cuadráticos
  mónicos de la forma $x^2 + px + q$.
