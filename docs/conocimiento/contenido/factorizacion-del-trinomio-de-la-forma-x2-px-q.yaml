procedimiento:
- 'Paso 1: Si el 3er término es negativo, pre-escribe paréntesis con signos opuestos:
  $(x + \quad)(x - \quad)$.'
- 'Paso 2: Busca dos números que multiplicados den el 3er término y cuya RESTA dé
  el valor numérico del término central.'
- 'Paso 3: Mira el signo del término central.'
- 'Paso 4: Asigna el signo central al número mayor, y el signo contrario al número
  menor.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización del trinomio de la forma x² + px + q.
ejemplos:
- titulo: Factoriza $x^2 - 4x - 12$
  enunciado: Factoriza $x^2 - 4x - 12$.
  solucion_pasos:
  - 'Multiplicados: 12. Restados: 4. Las opciones son (1,12), (2,6), (3,4). La pareja
    es 2 y 6.'
  - Signo central es (-). El número mayor (6) será negativo.
  - Los números son -6 y +2.
  - 'Resultado: $(x - 6)(x + 2)$.'
- titulo: Factoriza $y^2 + y - 20$.
  solucion_pasos:
  - 'Parejas de 20 restadas que den 1: son 4 y 5. El mayor (5) lleva el signo positivo
    del centro (+1y).'
- titulo: 'Respecto de «Factorización del trinomio de la forma x² + px + q»: ¿Se ajusta
    a la definición'
  enunciado: 'Respecto de «Factorización del trinomio de la forma x² + px + q»: ¿Se
    ajusta a la definición esta afirmación? «Si en un trinomio $x^2 + px - q$ el término
    independiente (q) es negativo, los binomios resultantes tendrán signos distintos:
    $(x + a)(x - b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si en un trinomio $x^2 + px
    - q$ el término independiente (q) es negativo, los binomios resultantes tendrán
    signos distintos: $(x + a)(x - b)$.'
- titulo: 'Respecto de «Factorización del trinomio de la forma x² + px + q»: ¿Es compatible
    con el proc'
  enunciado: 'Respecto de «Factorización del trinomio de la forma x² + px + q»: ¿Es
    compatible con el procedimiento esta afirmación? «Confundir cuál número lleva
    cuál signo, terminando con el trinomio inverso (ej. con $-2x$ central en vez de
    $+2x$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si en un trinomio $x^2 + px
    - q$ el término independiente (q) es negativo, los binomios resultantes tendrán
    signos distintos: $(x + a)(x - b)$.'
errores_frecuentes:
- Confundir cuál número lleva cuál signo, terminando con el trinomio inverso (ej.
  con $-2x$ central en vez de $+2x$).
- Intentar sumar los números en vez de restarlos cuando el 3er término es negativo.
- Para «Si el término independiente de un trinomio es negativo, ¿qué puedes deducir
  de los números que lo factorizan», la respuesta correcta es Ambos son negativos.
- Para «Si el término independiente de un trinomio es negativo, ¿qué puedes deducir
  de los números que lo factorizan», la respuesta correcta es Ambos son positivos.
- Para «Si el término independiente de un trinomio es negativo, ¿qué puedes deducir
  de los números que lo factorizan», la respuesta correcta es Ninguno es negativo.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_poder: Descomponer en factores irreducibles expresiones algebraicas
