resumen_inicial: La factorización del trinomio de la forma $ax^2 + bx + c$ concluye
  el método de amplificación simplificando el denominador $a$ con los factores comunes
  extraíbles de los binomios $(ax + r)(ax + s)$.
explicacion_simple: 'Tras tener $\frac{(6x + 8)(6x + 3)}{6}$, sacas el factor común
  de cada paréntesis: de $(6x + 8)$ sacas $2$ dando $2(3x + 4)$, y de $(6x + 3)$ sacas
  $3$ dando $3(2x + 1)$. Como $2 \cdot 3 = 6$, se simplifica exactamente con el $6$
  de abajo, ¡quedando $(3x + 4)(2x + 1)$!'
explicacion_formal: 'Dada la expresión amplificada $\frac{(ax + r)(ax + s)}{a}$, la
  **Factorización del Trinomio No Mónico** exige la extracción de los factores comunes
  de grupo $g_1 = \text{MCD}(a, r)$ y $g_2 = \text{MCD}(a, s)$ tal que $g_1 \cdot
  g_2 = a$:


  $$ax^2 + bx + c = \frac{g_1(m x + r'') \cdot g_2(n x + s'')}{a} = (m x + r'')(n
  x + s'')$$


  **Desglose simbólico:**

  - $g_1 \cdot g_2 = a$: Los factores extraídos cancelan exactamente al denominador
  $a$.

  - $(m x + r'')(n x + s'')$: Producto final de binomios lineales irreducible con
  coeficientes enteros en $\mathbb{Z}[x]$.


  > **Complemento didáctico:** Garantiza que el producto final esté formado por binomios
  primos irreducibles.'
definiciones_clave: '- **Simplificación de amplificación**: Cancelación exacta del
  denominador $a$ mediante $g_1 \cdot g_2 = a$.

  - **Factores irreducibles enteros**: Binomios resultantes sin factores comunes numéricos.'
propiedades_relaciones: '- **Verificación distributiva**: Al desarrollar $(mx + r'')(nx
  + s'')$, el término cuadrático da $mn \cdot x^2 = a x^2$.'
ejemplo_guiado:
  enunciado: Concluya la factorización del trinomio $6x^2 + 11x + 4$ simplificando
    la expresión $\frac{(6x + 8)(6x + 3)}{6}$.
  pasos:
  - 'Paso 1: Extraer factor común numérico del primer binomio $(6x + 8)$: MCD(6, 8)
    = 2 $\implies 2(3x + 4)$.'
  - 'Paso 2: Extraer factor común numérico del segundo binomio $(6x + 3)$: MCD(6,
    3) = 3 $\implies 3(2x + 1)$.'
  - 'Paso 3: Reescribir la fracción con los factores extraídos: $\frac{2(3x + 4) \cdot
    3(2x + 1)}{6}$.'
  - 'Paso 4: Multiplicar los factores numéricos extraídos: $2 \cdot 3 = 6$.'
  - 'Paso 5: Simplificar el 6 del numerador con el 6 del denominador: $\frac{6(3x
    + 4)(2x + 1)}{6} = (3x + 4)(2x + 1)$.'
  - 'Conclusión: La factorización de $6x^2 + 11x + 4$ es $(3x + 4)(2x + 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre matemáticamente con el denominador $a$ durante el paso final
    de la factorización de un trinomio no mónico?
  choices:
  - text: Se simplifica totalmente con el producto de los factores comunes extraídos
      de ambos binomios
    is_correct: true
  - text: Se mantiene como denominador de la respuesta final
    is_correct: false
  - text: Se multiplica por la variable $x$
    is_correct: false
  - text: Se convierte en un término cuadrático independiente
    is_correct: false
  explanation: La alternativa correcta es 'Se simplifica totalmente con el producto
    de los factores comunes extraídos de ambos binomios'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la simplificación de $\frac{(6x + 8)(6x + 3)}{6}$, ¿cuál es el producto
    final de binomios obtenido?
  choices:
  - text: $(3x + 4)(2x + 1)$
    is_correct: true
  - text: $(6x + 8)(6x + 3)$
    is_correct: false
  - text: $(6x + 4)(6x + 1)$
    is_correct: false
  - text: $(3x + 8)(2x + 3)$
    is_correct: false
  explanation: La alternativa correcta es '$(3x + 4)(2x + 1)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer el MCD numérico del primer paréntesis $(ax + r)$ y del segundo
  paréntesis $(ax + s)$.'
- 'Paso 2: Multiplicar los factores numéricos extraídos para igualar al denominador
  $a$.'
- 'Paso 3: Cancelar el denominador $a$ dejando el producto directo de dos binomios
  simples.'
errores_correccion: '- **Error 1: Dejar la respuesta final expresada como fracción
  $\frac{(3x + 4)(2x + 1)}{1}$ sin realizar la simplificación explícita de factores.**
  **Cómo corregirlo:** Se DEBE cancelar formalmente el denominador multiplicando los
  números extraídos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Concluya la factorización de $2x^2 + 7x + 3$ simplificando $\frac{(2x
    + 6)(2x + 1)}{2}$.
  alternativas:
  - $(x + 3)(2x + 1)$
  - $(2x + 6)(x + 1)$
  - $(2x + 3)(x + 1)$
  respuesta: $(x + 3)(2x + 1)$
  solucion_pasos:
  - 1. Extraer 2 de $(2x + 6) \implies 2(x + 3)$.
  - 2. Cancelar el 2 del denominador $\to (x + 3)(2x + 1)$.
- titulo: Ejemplo 2
  enunciado: Factorice completamente el trinomio $3x^2 - 5x - 2$.
  alternativas:
  - $(3x + 1)(x - 2)$
  - $(3x - 1)(x + 2)$
  - $(3x - 2)(x + 1)$
  respuesta: $(3x + 1)(x - 2)$
  solucion_pasos:
  - '1. Amplificar: $\frac{(3x - 6)(3x + 1)}{3}$.'
  - 2. Extraer 3 de $(3x - 6) \to 3(x - 2)$.
  - '3. Resultado: $(3x + 1)(x - 2)$.'
- titulo: ¿El producto de los factores comunes numéricos extraídos de ambos binomios
    debe ser igual al denominador $a$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la propiedad $g_1 \cdot g_2 = a$ garantiza la cancelación perfecta.
- titulo: Al multiplicar los términos principales de $(3x + 4)(2x + 1)$, ¿se recupera
    el término $6x^2$ del trinomio original?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3x \cdot 2x = 6x^2$.
errores_frecuentes:
- Dejar el denominador $a$ en la respuesta final sin simplificar los factores numéricos.
- Extraer el factor común numérico de un solo binomio cuando ambos poseen factores
  extraíbles.
- Declarar que los binomios finales deben conservar el coeficiente cuadrático $a$
  en ambos paréntesis.
- Multiplicar los binomios de la respuesta deshaciendo la factorización alcanzada.
- Dividir los términos dentro de los paréntesis por números que no son divisores exactos.
afirmaciones_verdaderas:
- La factorización de $ax^2 + bx + c$ simplifica el denominador $a$ mediante extracción
  de MCD en los binomios.
- Los binomios finales $(mx + r')(nx + s')$ cumplen que $m \cdot n = a$.
al_terminar_debes_poder: Al terminar serás capaz de factorizar completamente trinomios
  cuadráticos no mónicos simplificando sus factores de amplificación.
