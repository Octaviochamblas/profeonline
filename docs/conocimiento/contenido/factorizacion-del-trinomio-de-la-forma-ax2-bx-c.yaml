semantic_id: MAT.ALG.FACTOR_TRINOMIOS.FACTORIZACION_COMPUESTO
resumen_inicial: La factorización del trinomio de la forma $ax^2 + bx + c$ consiste en descomponer el término central $bx
  = rx + sx$ mediante el par numérico del producto $ac$ para resolver el polinomio mediante factorización por agrupación.
explicacion_simple: "Existe un método alternativo y muy elegante para factorizar $ax^2 + bx + c$ (ej: $2x^2 + 7x + 3$):\n\
  - **MÉTODO DE DESCOMPOSICIÓN DEL TÉRMINO CENTRAL (AGRUPACIÓN)**:\n  1. **Calcula el producto $a \\cdot c$**:\n     - $2\
  \ \\cdot 3 = \\mathbf{6}$.\n  2. **Busca dos números que multipliquen $6$ y sumen $7$**:\n     - Los números son **$6$ y\
  \ $1$** (puesto que $6 \\cdot 1 = 6$ y $6 + 1 = 7$).\n  3. **Descompón el término central $+7x$ usando esos dos números**:\n\
  \     - Reemplazas $+7x$ por $\\mathbf{+6x + 1x}$.\n     - La expresión de 3 términos se convierte en 4 términos: $\\mathbf{2x^2\
  \ + 6x + 1x + 3}$.\n  4. **¡Factoriza por Agrupación de Términos!**:\n     - Grupo 1: $(2x^2 + 6x) = \\mathbf{2x(x + 3)}$.\n\
  \     - Grupo 2: $(1x + 3) = \\mathbf{1(x + 3)}$.\n     - **Resultado final**: $\\mathbf{(x + 3)(2x + 1)}$.\n\n![Factorización\
  \ de ax² + bx + c](/static/img/nodos/factorizacion-del-trinomio-de-la-forma-ax2-bx-c-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el trinomio no mónico $P(x) = ax^2 + bx + c \in \mathbb{R}[x]$. El método de **descomposición del término central**
  utiliza la existencia del par numérico $(r, s) \in \mathbb{R}^2$ tal que $r \cdot s = a \cdot c$ y $r + s = b$ para aplicar
  la transformación equivalente:


  $$P(x) = ax^2 + (r + s)x + c = ax^2 + rx + sx + c$$


  ### Reducción a la Factorización por Agrupación

  La cuadrinomia $ax^2 + rx + sx + c$ admite siempre una partición armónica de divisores comunes. Puesto que $\frac{r}{a}
  = \frac{c}{s}$, agrupando en parejas:


  $$P(x) = (ax^2 + rx) + (sx + c) = x(ax + r) + \frac{c}{s}(sx + c)$$


  La extracción del factor común polinomio resultante produce la descomposición final en factores lineales con coeficientes
  enteros o reales.


  ### Síntesis didáctica

  Descomponer el término lineal $bx$ en la suma de dos términos $rx + sx$ convierte el trinomio no mónico en un cuadrinomio
  que se resuelve sencillamente por agrupación.

  '
definiciones_clave: '- **Descomposición del término central**: Partición de $bx$ en $rx + sx$ basada en las ecuaciones $r
  \cdot s = ac$ y $r + s = b$.

  - **Conversión en cuadrinomio**: Transformación de una expresión de 3 términos en una de 4 términos apta para agrupación.

  - **Criterio de divisibilidad armónica**: Garantía de que los subgrupos formados producirán siempre paréntesis cocientes
  idénticos.

  '
propiedades_relaciones: '- **Equivalencia con el método de amplificación**: Ambos métodos son formalmente idénticos y conducen
  exactamente al mismo producto de factores $(mx+n)(px+q)$.

  '
ejemplo_guiado:
  enunciado: Factoriza el trinomio no mónico $3x^2 + 11x + 6$ mediante descomposición del término central.
  pasos:
  - 'Paso 1: Calculamos el producto clave $a \cdot c = 3 \cdot 6 = \mathbf{18}$.'
  - 'Paso 2: Buscamos dos números que multipliquen $18$ y sumen $11$: - Los números son **$9$ y $2$** ($9 \cdot 2 = 18$ y
    $9 + 2 = 11$).'
  - 'Paso 3: Reemplazamos el término central $11x$ por $9x + 2x$: $3x^2 + 9x + 2x + 6$.'
  - 'Paso 4: Agrupamos en parejas y extraemos factores comunes monómicos: - Grupo 1: $(3x^2 + 9x) = \mathbf{3x(x + 3)}$. -
    Grupo 2: $(2x + 6) = \mathbf{2(x + 3)}$.'
  - 'Paso 5: Extraemos el factor común resultante $(x + 3)$: $(x + 3)(3x + 2)$.'
  - 'Conclusión: La factorización es **$(x + 3)(3x + 2)$**.'
  imagen: /static/img/nodos/factorizacion-del-trinomio-de-la-forma-ax2-bx-c-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al desponer el término central $13x$ en el trinomio $5x^2 + 13x + 6$ usando el par $r=10, s=3$ ($10 \cdot 3 =
    30$), ¿cómo queda la expresión de 4 términos para agrupar?
  choices:
  - text: Queda $5x^2 + 10x + 3x + 6$, reemplazando $13x$ por $10x + 3x$
    is_correct: true
  - text: Queda $5x^2 + 13x + 30$
    is_correct: false
  - text: Queda $5x^2 + 30x + 6$
    is_correct: false
  - text: Queda $(5x + 10)(3x + 6)$
    is_correct: false
  explanation: La alternativa correcta es 'Queda $5x^2 + 10x + 3x + 6$, reemplazando $13x$ por $10x + 3x$'. Descomposición
    lineal $bx = rx + sx \implies 10x + 3x$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la factorización completa del trinomio $4x^2 + 8x + 3$?
  choices:
  - text: La factorización es $(2x + 1)(2x + 3)$, buscando números que multipliquen $12$ y sumen $8$ ($6$ y $2$)
    is_correct: true
  - text: La factorización es $(4x + 1)(x + 3)$
    is_correct: false
  - text: La factorización es $(2x + 8)(2x + 3)$
    is_correct: false
  - text: La factorización es $(4x + 3)(4x + 1)$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $(2x + 1)(2x + 3)$, buscando números que multipliquen $12$
    y sumen $8$ ($6$ y $2$)'. $4x^2 + 6x + 2x + 3 = 2x(2x+3) + 1(2x+3) = (2x+3)(2x+1)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar el coeficiente cuadrático $a$ por el término libre $c$.'
- 'Paso 2: Encontrar dos números $r$ y $s$ que multipliquen $a \cdot c$ y sumen $b$.'
- 'Paso 3: Reescribir el trinomio como un polinomio de 4 términos reemplazando $bx$ por $rx + sx$.'
- 'Paso 4: Factorizar por agrupación de términos para obtener el producto binómico final.'
errores_correccion: '- **Error 1:** Reemplazar los extremos por los números $r$ y $s$ en lugar de reemplazar el término central
  $bx$. **Cómo corregirlo:** Los números $r$ y $s$ **REEMPLAZAN ÚNICAMENTE AL TÉRMINO CENTRAL $bx$ ($bx \to rx + sx$), LOS
  EXTREMOS $ax^2$ Y $c$ PERMANECEN INTACTOS**.

  - **Error 2:** Descomponer $bx$ con dos números que suman $b$ pero que no multiplican $a \cdot c$. **Cómo corregirlo:**
  El par seleccionado **DEBE CUMPLIR OBLIGATORIAMENTE LAS DOS CONDICIONES SIMULTÁNEAMENTE ($r \cdot s = ac$ y $r + s = b$)**.

  '
ejemplos:
- titulo: Reemplazo de término central
  enunciado: Para $2x^2 + 5x + 2$ con par $(4, 1)$, ¿es la cuadrinomia $2x^2 + 4x + 1x + 2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5x = 4x + 1x$.
- titulo: Primer grupo
  enunciado: En $(2x^2 + 4x)$, ¿es $2x(x + 2)$ la extracción parcial?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2x$ es el común.
- titulo: Segundo grupo
  enunciado: En $(1x + 2)$, ¿es $1(x + 2)$ la extracción parcial?
  respuesta: Sí
  solucion_pasos:
  - Sí, $+1$ es el exterior implícito.
- titulo: Factorización final
  enunciado: ¿Produce la agrupación del trinomio $2x^2 + 5x + 2$ la respuesta $(x + 2)(2x + 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(x+2)(2x+1)$.
errores_frecuentes:
- Reemplazar los términos extremos ax² o c por los números r y s en lugar del término lineal bx.
- Elegir una pareja de números que suma b pero cuyo producto no es igual a a · c.
- Cometer errores de signos al extraer el factor común en los subgrupos formados.
- El coeficiente 1 no es escrito al agrupar la segunda pareja de términos.
- Olvidar comprobar que los paréntesis de ambos subgrupos sean idénticos.
afirmaciones_verdaderas:
- La factorización de $ax^2 + bx + c$ se puede realizar reemplazando el término central $bx$ por $rx + sx$ y agrupando.
- Los números $r$ y $s$ satisfacen las ecuaciones $r \cdot s = a \cdot c$ y $r + s = b$.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/factorizacion-del-trinomio-de-la-forma-ax2-bx-c-resumen.svg)


  QUÉ: Factorizar trinomios de la forma ax² + bx + c mediante la descomposición del término central y agrupación de términos.

  CÓMO: Reemplazar el término lineal $bx$ por la suma de dos términos $rx + sx$ donde $r \cdot s = ac$ y $r + s = b$, y resolver
  el cuadrinomio resultante mediante factorización por agrupación.

  '
