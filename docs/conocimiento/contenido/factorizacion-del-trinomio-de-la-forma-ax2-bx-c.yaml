procedimiento:
- 'Paso 1: Descompón el primer término en dos factores y ponlos en una columna.'
- 'Paso 2: Descompón el último término en dos factores y ponlos en la columna derecha.'
- 'Paso 3: Multiplica en diagonal (aspa) y suma los dos resultados.'
- 'Paso 4: Si la suma iguala al término central, lee los factores finales en línea
  recta horizontal.'
- 'Paso 5: Si falla, cambia los signos, invierte el orden o usa otros factores del
  tercer término.'
- El aspa refleja el dibujo de multiplicar en diagonal.
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización del trinomio de la forma ax² + bx + c.
ejemplos:
- titulo: Factoriza por aspa $5x^2 - 13x - 6$
  enunciado: Factoriza por aspa $5x^2 - 13x - 6$.
  solucion_pasos:
  - 'Col 1: $5x$ y $1x$.'
  - 'Col 2 (para -6): probemos $+2$ y $-3$.'
  - 'Aspa: $(5x * -3) + (1x * 2) = -15x + 2x = -13x$. ¡Correcto!'
  - 'Lectura horizontal: $(5x + 2)(x - 3)$.'
- titulo: Aspa para $2x^2 + 5x + 2$.
  solucion_pasos:
  - 'Col1: 2x y x. Col2: 1 y 2. Aspa: 4x + 1x = 5x.'
- titulo: 'Respecto de «Factorización del trinomio de la forma ax² + bx + c»: ¿Es
    correcta esta caracte'
  enunciado: 'Respecto de «Factorización del trinomio de la forma ax² + bx + c»: ¿Es
    correcta esta caracterización? «El método del aspa consiste en descomponer el
    primer y último término en dos factores que se escriben en columnas»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El método del aspa consiste
    en descomponer el primer y último término en dos factores que se escriben en columnas.'
- titulo: 'Respecto de «Factorización del trinomio de la forma ax² + bx + c»: ¿Es
    válida esta afirmació'
  enunciado: 'Respecto de «Factorización del trinomio de la forma ax² + bx + c»: ¿Es
    válida esta afirmación? «Leer el resultado final en cruz. (¡Se lee horizontalmente!)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El método del aspa consiste
    en descomponer el primer y último término en dos factores que se escriben en columnas.'
errores_frecuentes:
- Leer el resultado final en cruz. (¡Se lee horizontalmente!).
- Rendirse en el primer intento si no cuadra. El aspa es un método de ensayo y error
  dirigido.
- 'Poner mal los signos en la columna 2 para que no den la multiplicación correcta
  (ej: poner +2 y +3 para obtener un -6).'
- Porque es áspero de aprender.
- Para «¿Por qué el método se llama "Aspa"», la respuesta correcta es Porque los factores
  resultantes se escriben cruzados.
