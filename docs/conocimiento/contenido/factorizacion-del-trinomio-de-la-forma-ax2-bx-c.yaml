semantic_id: MAT.ALG.FACTOR_TRINOMIOS.FACTORIZACION_COMPUESTO
resumen_inicial: 'Factorización del trinomio de la forma ax² + bx + c: concepto, método
  de descomposición y reglas en Factorización de trinomios cuadráticos.'
explicacion_simple: 'Para quienes son visuales, el método de amplificación puede parecer
  mucha escritura. El Método del Aspa Simple es como armar un puzzle: ensayas piezas
  en dos columnas hasta que al cruzarlas formen exactamente la figura que quieres.'
explicacion_formal: '### Definición formal


  Porque la comprobación se realiza multiplicando los factores en forma de ''X'' (cruz
  o aspa).


  ### Desarrollo didáctico


  Resolvamos el mismo $3x^2 + 14x + 8$ con el método del aspa.


  1. Columna 1 (para $3x^2$): Sus factores son $3x$ y $1x$. (Los apilamos verticalmente).

  2. Columna 2 (para 8): Puede ser (1 y 8), (2 y 4).


  Probemos (4 y 2) verticalmente:

  $3x \quad \quad 4$

  $1x \quad \quad 2$


  Multiplicamos en aspa (cruzado):

  $3x \cdot 2 = 6x$

  $1x \cdot 4 = 4x$

  Suma: $6x + 4x = 10x$. Falla. Necesitamos $14x$.


  Probemos invirtiendo los números (2 y 4):

  $3x \quad \quad 2$

  $1x \quad \quad 4$


  Multiplicamos en aspa:

  $3x \cdot 4 = 12x$

  $1x \cdot 2 = 2x$

  Suma: $12x + 2x = 14x$. Éxito.


  La factorización se lee HORIZONTALMENTE: $(3x + 2)(1x + 4)$.'
definiciones_clave: '- **Factorización del trinomio de la forma ax² + bx + c**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización del trinomio de la forma ax²
  + bx + c.'
