semantic_id: MAT.ALG.TERMINO.GRADO_RELATIVO_TERMINO
resumen_inicial: 'El cálculo del grado relativo de un término algebraico consiste en determinar el exponente específico asociado a una variable particular elegida como referencia dentro de la parte literal.'
explicacion_simple: |
  Mientras que el grado absoluto suma todas las letras juntas, el **grado relativo** mira **una sola letra a la vez**:
  - Es simplemente **el exponente que tiene esa letra específica**.
  - Ejemplo: En el término $8x^4 y^7 z$:
    - El grado relativo respecto a la letra $x$ es **$4$**.
    - El grado relativo respecto a la letra $y$ es **$7$**.
    - El grado relativo respecto a la letra $z$ es **$1$**.
  - Si una letra no aparece en el término, su grado relativo respecto a esa letra ausente es **$0$**.
explicacion_formal: |
  ### Definición formal
  Dado un término algebraico no nulo $M(x_1, \dots, x_k) = c \cdot x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$, el **grado relativo respecto a la variable $x_i$** (denotado $\operatorname{grrel}(M, x_i)$) es el exponente $\alpha_i \in \mathbb{N}_0$ asignado a dicha base variable:

  $$\operatorname{grrel}(M, x_i) = \alpha_i$$

  ### Caso de Variable Ausente
  Si la variable de referencia $y$ no figura en la parte literal del término $M$, su exponente implícito es cero por la propiedad del neutro escalar ($y^0 = 1$):

  $$y \notin \operatorname{Var}(M) \implies \operatorname{grrel}(M, y) = 0$$

  ### Relación entre Grado Relativo y Grado Absoluto
  El grado absoluto equivale a la suma de todos los grados relativos de las variables que componen el término:

  $$\operatorname{grabs}(M) = \sum_{i=1}^k \operatorname{grrel}(M, x_i)$$

  ### Síntesis didáctica
  El grado relativo analiza la potencia individual de una variable de interés. Permite evaluar el grado de polinomios en una variable seleccionada cuando se trabaja con modelos multivariables.
definiciones_clave: |
  - **Grado relativo respecto a una variable**: Exponente de una letra específica elegida como referencia dentro del término algebraico.
  - **Variable de referencia**: Letra seleccionada respecto a la cual se mide la potencia individual en un monomio o polinomio.
  - **Grado relativo nulo ($0$)**: Grado asignado respecto a una variable que no figura explícitamente en el término algebraico.
propiedades_relaciones: |
  - **Límite superior del grado absoluto**: El grado relativo respecto a cualquier variable es siempre menor o igual al grado absoluto del término ($\operatorname{grrel}(M, x_i) \le \operatorname{grabs}(M)$).
  - **Ordenamiento polinómico**: El grado relativo respecto a una variable elegida permite ordenar un polinomio multivariable de forma creciente o decreciente respecto a esa letra.
ejemplo_guiado:
  enunciado: 'Dado el término algebraico $-15 a^6 b^2 c$, determina: a) El grado relativo respecto a la variable $a$, b) El grado relativo respecto a $b$, c) El grado relativo respecto a $c$, d) El grado relativo respecto a la variable $x$.'
  pasos:
    - 'Paso 1: Para la variable $a$, observamos su superíndice: $\operatorname{grrel}(M, a) = \mathbf{6}$.'
    - 'Paso 2: Para la variable $b$, observamos su superíndice: $\operatorname{grrel}(M, b) = \mathbf{2}$.'
    - 'Paso 3: Para la variable $c$, como no tiene superíndice escrito, su exponente es $1 \implies \operatorname{grrel}(M, c) = \mathbf{1}$.'
    - 'Paso 4: Para la variable $x$, como la letra $x$ no aparece en el término, su exponente implícito es $0 \implies \operatorname{grrel}(M, x) = \mathbf{0}$.'
    - 'Conclusión: Los grados relativos son **$6, 2, 1$ y $0$** respectivamente.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué mide específicamente el grado relativo de un término algebraico?'
    choices:
      - {text: 'El exponente específico que posee una variable particular elegida como referencia', is_correct: true}
      - {text: 'La suma de todos los exponentes de todas las letras juntas', is_correct: false}
      - {text: 'El valor absoluto de su coeficiente numérico', is_correct: false}
      - {text: 'La cantidad de términos que componen la expresión', is_correct: false}
    explanation: 'La alternativa correcta es ''El exponente específico que posee una variable particular elegida como referencia''. Definición de grado relativo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término algebraico $4 x^5 y^3$, ¿cuál es el grado relativo respecto a la letra $y$ y cuál respecto a la letra $z$?'
    choices:
      - {text: 'El grado relativo respecto a $y$ es $3$, y respecto a $z$ es $0$', is_correct: true}
      - {text: 'El grado relativo respecto a $y$ es $5$, y respecto a $z$ es $3$', is_correct: false}
      - {text: 'El grado relativo respecto a $y$ es $8$, y respecto a $z$ es $4$', is_correct: false}
      - {text: 'Ambos grados relativos son iguales a $3$', is_correct: false}
    explanation: 'La alternativa correcta es ''El grado relativo respecto a $y$ es $3$, y respecto a $z$ es $0$''. El exponente de $y$ es 3 y la letra $z$ no figura.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable específica de referencia respecto a la cual se solicita el grado relativo.'
  - 'Paso 2: Buscar esa letra dentro de la parte literal del término algebraico.'
  - 'Paso 3: Si la letra está presente con superíndice, ese superíndice es el grado relativo. Si está sola sin superíndice, el grado es $1$.'
  - 'Paso 4: Si la letra de referencia no está presente en el término, declarar que el grado relativo es $0$.'
errores_correccion: |
  - **Error 1:** Calcular la suma de todos los exponentes de las letras en lugar del exponente de la variable indicada. **Cómo corregirlo:** El grado relativo **evalúa únicamente una letra a la vez**, no la suma de todas.
  - **Error 2:** Afirmar que el grado relativo respecto a una letra ausente es 1. **Cómo corregirlo:** Si la letra no figura en el término, su **grado relativo es cero ($0$)**.
ejemplos:
  - titulo: 'Grado relativo de variable simple'
    enunciado: '¿Cuál es el grado relativo respecto a la variable $y$ en el término $-9 x^2 y^8$?'
    alternativas:
      - '$8$'
      - '$2$'
      - '$10$'
    respuesta: '$8$'
    solucion_pasos:
      - '1. El exponente de la variable $y$ es $8$.'
      - '2. El grado relativo respecto a $y$ es $8$.'
  - titulo: 'Grado relativo respecto a letra ausente'
    enunciado: 'En el término $14a^3 b^5$, ¿cuál es el grado relativo respecto a la letra $c$?'
    alternativas:
      - '$0$'
      - '$1$'
      - '$8$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. La letra $c$ no figura en la parte literal.'
      - '2. El grado relativo respecto a $c$ es $0$.'
  - titulo: 'Grado relativo de variable con exponente 1'
    enunciado: 'En el término $7u^4 v$, ¿el grado relativo respecto a la variable $v$ es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la variable $v$ tiene exponente implícito $1$.'
  - titulo: 'Suma de grados relativos'
    enunciado: '¿La suma de los grados relativos respecto a todas las variables de un término es igual a su grado absoluto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{grabs}(M) = \sum \operatorname{grrel}(M, x_i)$.'
errores_frecuentes:
  - 'El grado relativo de un término algebraico es la suma de los exponentes de todas sus letras.'
  - 'El grado relativo respecto a una letra ausente en el término es igual a uno.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El grado relativo respecto a una variable cambia si el coeficiente numérico se multiplica por dos.'
  - 'El grado relativo de un término negativo es igual a la resta de los exponentes.'
afirmaciones_verdaderas:
  - 'El grado relativo de un término algebraico respecto a una variable es el exponente que tiene esa letra específica.'
  - 'La suma de los grados relativos de todas las variables de un término es igual a su grado absoluto.'
al_terminar_debes_poder: 'Calcular el grado relativo de cualquier término algebraico respecto a una variable específica e identificar grados nulos en variables ausentes.'
