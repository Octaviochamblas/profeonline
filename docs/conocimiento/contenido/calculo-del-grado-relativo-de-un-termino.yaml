  enunciado: 'Respecto de «Cálculo del grado relativo de un término»: ¿Describe adecuadamente
    el concepto esta frase? «El **Grado Relativo** de un término se calcula **respecto
    a una letra en específico**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Grado Relativo** de un
    término se calcula **respecto a una letra en específico**.'
- titulo: 'Respecto de «Cálculo del grado relativo de un término»: ¿Se puede aceptar
    esta afirmación? «'
  enunciado: 'Respecto de «Cálculo del grado relativo de un término»: ¿Se puede aceptar
    esta afirmación? «Confundir Grado Relativo con Grado Absoluto y terminar sumando
    todos los exponentes inútilmente»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Grado Relativo** de un
    término se calcula **respecto a una letra en específico**.'
errores_frecuentes:
- Confundir Grado Relativo con Grado Absoluto y terminar sumando todos los exponentes
  inútilmente.
- Al pedir el grado relativo de una letra sin exponente escrito, decir que es 0 en
  vez de 1.
- Es la suma de los exponentes de todas las demás variables menos esa.
- Para «¿Cómo se define el 'Grado Relativo' de un término algebraico con respecto
  a una variable específica? (v1)», la respuesta correcta es Es la resta entre el
  grado absoluto y el exponente de esa letra.
- Es el coeficiente numérico multiplicado por el exponente de esa letra.
afirmaciones_verdaderas:
- La notación de cálculo del grado relativo de un término sigue las convenciones del
  lenguaje algebraico.
