semantic_id: MAT.ALG.TERMINO.GRADO_RELATIVO_TERMINO
resumen_inicial: 'El grado relativo de un término algebraico con respecto a una variable específica es el exponente que tiene dicha letra en el término.'
explicacion_simple: |
  - Mientras el grado absoluto suma todas las letras, el **grado relativo (GR)** se fija en **una sola letra a la vez**.
  - **¿Cómo se determina?** Es simplemente el exponente de la letra elegida:
    - En el término $7x^5y^3z$:
      - El grado relativo respecto a $x$ es **$5$** ($\text{GR}(x) = 5$).
      - El grado relativo respecto a $y$ es **$3$** ($\text{GR}(y) = 3$).
      - El grado relativo respecto a $z$ es **$1$** ($\text{GR}(z) = 1$).
    - Si una letra no aparece en el término, su grado relativo respecto a esa letra es **$0$** (porque $w^0 = 1$).

  ![Grado Relativo de un Término](/static/img/nodos/calculo-del-grado-relativo-de-un-termino-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $T = c \cdot x_1^{e_1} x_2^{e_2} \cdots x_k^{e_k}$ un monomio no nulo con $c \neq 0$. El **grado relativo de $T$ respecto a la variable $x_j$**, denotado por $\operatorname{GR}_{x_j}(T)$ o $\operatorname{gr}(T, x_j)$, es el exponente que afecta a $x_j$:

  $$\operatorname{GR}_{x_j}(T) = e_j$$

  ### Propiedades y relaciones con el grado absoluto
  1. **Relación de suma:** El grado absoluto es la suma de todos los grados relativos de las variables presentes:
     $$\operatorname{GA}(T) = \sum_{j=1}^k \operatorname{GR}_{x_j}(T)$$
  2. **Variable no presente:** Si una variable $w$ no figura explícitamente en el monomio, $\operatorname{GR}_w(T) = 0$.
  3. **Desigualdad canónica:** Para cualquier variable $x_j$ con $e_j \ge 0$, siempre se cumple:
     $$\operatorname{GR}_{x_j}(T) \le \operatorname{GA}(T)$$
definiciones_clave: |
  - **Grado relativo (GR)**: Exponente que tiene una letra específica en un término algebraico.
  - **Variable de referencia**: Letra respecto a la cual se mide el grado relativo.
  - **Relación GR vs GA**: El grado relativo es puntual por variable, mientras el grado absoluto es la suma total.
propiedades_relaciones: |
  - **Independencia entre grados relativos**: El grado relativo respecto a una letra no depende de los exponentes de las demás variables.
  - **Ordenamiento polinomial**: Los grados relativos permiten ordenar polinomios de forma ascendente o descendente respecto a una letra guía.
ejemplo_guiado:
  enunciado: 'En el término algebraico $T = -14a^4b^7c$, calcula el grado relativo respecto a cada una de las variables $a$, $b$, $c$ y verifica la suma con el grado absoluto.'
  imagen: '/static/img/nodos/calculo-del-grado-relativo-de-un-termino-ejemplos.svg'
  pasos:
    - 'Paso 1: Localizamos la variable $a$: su exponente es $4 \implies **\operatorname{GR}(a) = 4$**.'
    - 'Paso 2: Localizamos la variable $b$: su exponente es $7 \implies **\operatorname{GR}(b) = 7$**.'
    - 'Paso 3: Localizamos la variable $c$: no tiene número visible $\implies **\operatorname{GR}(c) = 1$**.'
    - 'Paso 4: Calculamos el grado absoluto sumando los grados relativos: $\operatorname{GA}(T) = 4 + 7 + 1 = **12$**.'
    - 'Paso 5: Conclusión: Los grados relativos son $\operatorname{GR}(a)=4, \operatorname{GR}(b)=7, \operatorname{GR}(c)=1$, y su suma valida $\operatorname{GA}=12$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el término algebraico $-9x^6y^2$, ¿cuál es el grado relativo respecto a la variable $x$?'
    choices:
      - text: '$6$, porque es el exponente individual de la letra $x$'
        is_correct: true
      - text: '$8$, porque es la suma de $6 + 2$'
        is_correct: false
      - text: '$2$, porque es el exponente de $y$'
        is_correct: false
      - text: '$-9$, porque es el coeficiente'
        is_correct: false
    explanation: 'La alternativa correcta es ''$6$, porque es el exponente individual de la letra $x$''. El grado relativo respecto a una letra es su propio exponente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término $5x^3y^4$, ¿cuál es el grado relativo respecto a la variable $z$?'
    choices:
      - text: '$0$, porque la variable $z$ no aparece en el término ($z^0 = 1$)'
        is_correct: true
      - text: '$1$'
        is_correct: false
      - text: '$7$'
        is_correct: false
      - text: 'No existe'
        is_correct: false
    explanation: 'La alternativa correcta es ''$0$, porque la variable $z$ no aparece en el término ($z^0 = 1$)''. Una variable ausente tiene exponente cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable específica respecto a la cual se solicita el grado.'
  - 'Paso 2: Localizar dicha variable en la parte literal del término.'
  - 'Paso 3: Leer el exponente de la variable (si no lleva número visible, su grado es $1$; si no aparece la letra, su grado es $0$).'
  - 'Paso 4: Enunciar el grado relativo $\operatorname{GR}(x) = e$.'
errores_correccion: |
  - **Error 1:** Confundir grado relativo con grado absoluto (sumar todas las letras cuando se pregunta por una sola). **Cómo corregirlo:** El grado relativo **pertenece exclusivamente a una variable**: $\operatorname{GR}(x) = e_x$.
  - **Error 2:** Asignar grado relativo 0 a una letra sin exponente escrito. **Cómo corregirlo:** Si la letra está presente, su exponente es **$1$**, por lo que $\operatorname{GR} = 1$.
ejemplos:
  - titulo: 'Identificación de GR en monomio tridimensional'
    enunciado: 'En el término $-3x^5y^8z^2$, ¿cuál es el valor de $\operatorname{GR}(y)$?'
    alternativas:
      - '$8$'
      - '$15$'
      - '$5$'
    respuesta: '$8$'
    solucion_pasos:
      - '1. Se busca la variable $y$.'
      - '2. El exponente de $y$ es 8.'
      - '3. $\operatorname{GR}(y) = 8$.'
  - titulo: 'Comparación GR vs GA'
    enunciado: 'Si en un término $\operatorname{GR}(a) = 3$ y $\operatorname{GR}(b) = 5$, ¿cuál es su grado absoluto si son las únicas variables?'
    alternativas:
      - '$8$'
      - '$15$'
      - '$5$'
    respuesta: '$8$'
    solucion_pasos:
      - '1. $\operatorname{GA} = \operatorname{GR}(a) + \operatorname{GR}(b)$.'
      - '2. $\operatorname{GA} = 3 + 5 = 8$.'
  - titulo: 'Grado relativo de letra sin exponente escrito'
    enunciado: '¿Es el grado relativo respecto a $b$ en el término $4a^3b$ igual a 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $b$ tiene exponente implícito 1 ($b = b^1$).'
      - '2. $\operatorname{GR}(b) = 1$.'
  - titulo: 'Grado relativo vs coeficiente'
    enunciado: '¿Es el grado relativo respecto a $x$ en $-7x^4$ igual a $-7$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. $-7$ es el coeficiente numérico constante.'
      - '2. El grado relativo respecto a $x$ es su exponente, que vale 4.'
errores_frecuentes:
  - 'Sumar los exponentes de todas las variables al responder por el grado relativo de una sola letra.'
  - 'Confundir el coeficiente numérico constante con el grado relativo de la variable principal.'
  - 'Asignar grado relativo 0 a una letra que figura explícitamente sin superíndice escrito.'
  - 'Creer que el grado relativo respecto a una variable depende de los coeficientes del término.'
  - 'Afirmar que el grado relativo puede ser mayor que el grado absoluto en un monomio entero.'
afirmaciones_verdaderas:
  - 'El grado relativo de un término respecto a una letra es el exponente que tiene dicha variable en el monomio.'
  - 'La suma de todos los grados relativos de las variables presentes es igual al grado absoluto del término.'
al_terminar_debes_poder: |
  ![Resumen de Grado Relativo](/static/img/nodos/calculo-del-grado-relativo-de-un-termino-resumen.svg)

  QUÉ: Calcular el grado relativo de un término algebraico respecto a cualquier variable específica y relacionarlo coherentemente con el grado absoluto.
  CÓMO: Extrayendo el exponente individual de la letra seleccionada ($\operatorname{GR}(x_j) = e_j$) y verificando que la suma de grados relativos iguale al grado absoluto.
