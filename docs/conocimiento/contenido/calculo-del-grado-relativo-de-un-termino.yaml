procedimiento:
- 'Paso 1: Te deben especificar la letra (variable) a analizar.'
- 'Paso 2: Busca esa letra en el término.'
- 'Paso 3: Si está, su exponente es el grado relativo.'
- 'Paso 4: Si la letra no está, el grado relativo respecto a esa letra es cero.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar cálculo del grado relativo de un término.
ejemplos:
- titulo: Análisis por letra
  enunciado: En el término 5a^3b, ¿cuál es el grado relativo respecto a 'b' y respecto
    a 'c'?
  solucion_pasos:
  - 'Respecto a ''b'': Buscamos la b. No tiene exponente visible, por lo que es 1.
    Grado relativo a b = 1.'
  - 'Respecto a ''c'': Buscamos la c. No existe en el término. Grado relativo a c
    = 0.'
- titulo: Una tarea de cálculo matricial pide identificar el término con mayor 'Grado
    Relativo respect
  enunciado: 'Una tarea de cálculo matricial pide identificar el término con mayor
    ''Grado Relativo respecto a $y$'' entre las siguientes opciones. ¿Cuál término
    debes elegir para tener la respuesta correcta? (v1)


    Opciones: A) $-10x^8y^4$ · B) $15y^3z^{10}$ · C) $100x^{20}y$ · D) $45y^2$'
  solucion_pasos:
  - 'Revisamos solo los exponentes de y: A tiene 4. B tiene 3. C tiene 1. D tiene
    2. El mayor es 4 (Opción A).'
  - 'Respuesta: $-10x^8y^4$'
- titulo: 'Respecto de «Cálculo del grado relativo de un término»: ¿Describe adecuadamente
