semantic_id: MAT.ALG.TERMINO.GRADO_RELATIVO_TERMINO
resumen_inicial: 'Cálculo del grado relativo de un término: concepto y propiedades
  en Término algebraico.'
explicacion_simple: Ya vimos el peso total de la caja (grado absoluto). Pero a veces
  solo nos interesa saber el peso de las manzanas ignorando las peras. Ese enfoque
  individualizado se llama Grado Relativo.
explicacion_formal: '### Definición formal


  El grado relativo no requiere cálculos, es una observación directa del exponente
  de la letra solicitada.


  ### Desarrollo didáctico


  No hay que hacer ninguna suma. Es una búsqueda y captura directa.

  Término de estudio: $-8x^4y^2z$


  - ¿Cuál es el grado relativo con respecto a la $x$? Miras la $x$, su exponente es
  4. El grado relativo respecto a $x$ es 4.

  - ¿Cuál es el grado relativo con respecto a la $y$? Miras la $y$, su exponente es
  2. El grado es 2.

  - ¿Cuál es el grado relativo con respecto a la $z$? Miras la $z$, tiene el uno invisible.
  El grado es 1.

  - ¿Cuál es el grado relativo con respecto a la $w$? Como la letra $w$ no está en
  el término, su grado relativo es 0.


  Es una herramienta vital para cuando ordenamos polinomios alfabéticamente.'
