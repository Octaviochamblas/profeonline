resumen_inicial: El grado relativo de un término algebraico respecto a una variable
  es el exponente que tiene dicha variable en ese término específico.
explicacion_simple: A diferencia del grado absoluto que suma todas las letras, el
  grado relativo nos pide fijarnos en UNA SOLA letra. En el término $-5x^4y^7$, el
  grado relativo respecto a $x$ es $4$, y el grado relativo respecto a $y$ es $7$.
explicacion_formal: 'En el término $T = c \cdot \prod_{k=1}^m x_k^{e_k}$, el **Grado
  Relativo respecto a la variable** $x_j$, denotado $G.R.(x_j, T)$, es idéntico a
  su exponente en dicho término:


  $$G.R.(x_j, T) = e_j$$


  > **Complemento didáctico:** El grado relativo aísla la potencia individual de cada
  variable para el análisis de ordenamiento y evaluación.'
definiciones_clave: '- **Grado relativo de un término $G.R.(x_j)$**: El exponente
  específico correspondiente a la variable $x_j$ en ese término.'
propiedades_relaciones: '- **Suma de grados relativos**: En un término monómico, $G.A.(T)
  = \sum_{j=1}^m G.R.(x_j, T)$.'
ejemplo_guiado:
  enunciado: Halle $G.R.(a)$, $G.R.(b)$ y $G.R.(c)$ en el término $T = 11a^6b^2c^5$.
  pasos:
  - 'Paso 1: Exponente de $a$ es $6 \implies G.R.(a) = 6$.'
  - 'Paso 2: Exponente de $b$ es $2 \implies G.R.(b) = 2$.'
  - 'Paso 3: Exponente de $c$ es $5 \implies G.R.(c) = 5$.'
  - 'Conclusión: $G.R.(a) = 6$, $G.R.(b) = 2$ y $G.R.(c) = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el grado relativo de un término respecto a una variable
    x?
  choices:
  - text: El exponente que posee la variable x en ese término específico
    is_correct: true
  - text: La suma de los exponentes de todas las variables
    is_correct: false
  - text: El coeficiente numérico de adelante
    is_correct: false
  - text: El número de variables del término
    is_correct: false
  explanation: La alternativa correcta es 'El exponente que posee la variable x en
    ese término específico'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 11a^6b^2c^5, ¿cuál fue el G.R.(b)?
  choices:
  - text: '2'
    is_correct: true
  - text: '6'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: '13'
    is_correct: false
  explanation: La alternativa correcta es '2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable por la cual se consulta.'
- 'Paso 2: Buscar el superíndice de dicha variable en el término.'
- 'Paso 3: Declarar ese exponente como el grado relativo de esa variable.'
errores_correccion: '- **Error 1: Sumar los exponentes de las otras letras al responder
  por el grado relativo de una sola.** **Cómo corregirlo:** El grado relativo pertenece
  a una sola variable y equivale a su exponente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el grado relativo respecto a la letra x del término -4x^7y^3?
  alternativas:
  - '7'
  - '3'
  - '10'
  - '-4'
  respuesta: '7'
  solucion_pasos:
  - 1. La variable consultada es x.
  - 2. Su exponente en el término es 7. Por lo tanto, G.R.(x) = 7.
- titulo: Ejemplo 2
  enunciado: En el término 9a^3b, ¿cuál es el G.R.(b)?
  alternativas:
  - '1'
  - '0'
  - '3'
  - '9'
  respuesta: '1'
  solucion_pasos:
  - 1. La variable b no tiene exponente escrito (b^1).
  - 2. Su grado relativo es 1.
- titulo: ¿Es el grado relativo de y en el término 8x^2y^5 igual a 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, el exponente de y en ese término es 5.
- titulo: ¿Es el grado relativo respecto a una variable en un término igual a la suma
    de todas sus letras?
  respuesta: 'No'
  solucion_pasos:
  - No, esa suma corresponde al grado absoluto del término, no al relativo.
errores_frecuentes:
- Sumar todos los exponentes del término al responder por el grado relativo de una
  sola letra.
- Declarar que el grado relativo de una variable sin exponente escrito es 0 en lugar
  de 1.
- Declarar el coeficiente numérico de adelante con el grado relativo de la primera
  variable.
- Multiplicar los exponentes de las variables en lugar de identificar el exponente
  individual.
- Declarar que el grado relativo respecto a una variable ausente en el término es
  1 en lugar de 0.
afirmaciones_verdaderas:
- El grado relativo de un término respecto a una variable es el exponente que tiene
  dicha variable.
- La suma de todos los grados relativos de sus variables es igual al grado absoluto
  del término.
al_terminar_debes_poder: Al terminar serás capaz de determinar el grado relativo de
  un término algebraico respecto a cualquiera de sus variables indicando su exponente
  individual.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Término Algebraico.
