semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TABLA_VALORES
resumen_inicial: 'Construcción de una tabla de valores para graficar una función exponencial:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: A diferencia de una parábola, la curva exponencial no tiene simetría;
  para representarla bien conviene elegir valores de $x$ que muestren tanto su comportamiento
  cercano a la asíntota como su crecimiento (o decrecimiento) acelerado.
explicacion_formal: '### Definición formal


  Una tabla de valores para $f(x)=a\cdot b^x$ es un conjunto de pares ordenados $(x_i,f(x_i))$
  obtenidos evaluando la función en varios valores elegidos de $x_i$. Debido al crecimiento
  (o decrecimiento) acelerado, conviene elegir un rango de exponentes centrado en
  $x=0$, sin extenderse demasiado.


  ### Desarrollo didáctico


  Es recomendable incluir $x=0$ (para ver el intercepto), un par de valores negativos
  (para ver el acercamiento a la asíntota) y un par de valores positivos pequeños
  (para ver el crecimiento).


  Para $f(x)=2\cdot3^x$, evaluando en $x=-2,-1,0,1,2$: se obtiene $f(-2)=2/9$, $f(-1)=2/3$,
  $f(0)=2$, $f(1)=6$, $f(2)=18$, mostrando el rápido crecimiento.'
definiciones_clave: '- **Construcción de una tabla de valores para graficar una función
  exponencial**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a construcción de una tabla de valores para graficar una función exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de construcción
    de una tabla de valores para graficar una función exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de construcción de una tabla
    de valores para graficar una función exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    construcción de una tabla de valores para graficar una función exponencial?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis gráfico
      y modelamiento exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis gráfico y modelamiento exponencial. Es la condición
    de existencia para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en construcción de una tabla de valores para graficar una función exponencial?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elige un rango de exponentes centrado en $x=0$, incluyendo valores negativos
  y positivos pequeños.'
- 'Paso 2: Calcula $f(x)$ para cada valor elegido.'
- 'Paso 3: Observa el patrón de crecimiento o decrecimiento en los valores obtenidos.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en construcción
  de una tabla de valores para graficar una función exponencial.
ejemplos:
- titulo: Construcción de tabla para función creciente
  enunciado: Construye una tabla de valores para $f(x)=2^x$ usando $x=-2,-1,0,1,2,3$.
  solucion_pasos:
  - $f(-2)=1/4$, $f(-1)=1/2$, $f(0)=1$, $f(1)=2$, $f(2)=4$, $f(3)=8$.
  - Se observa que los valores se duplican en cada paso, mostrando el crecimiento
    exponencial.
- titulo: Construcción de tabla para función decreciente
  enunciado: Construye una tabla de valores para $f(x)=(1/2)^x$ usando $x=-2,-1,0,1,2$.
  solucion_pasos:
  - $f(-2)=4$, $f(-1)=2$, $f(0)=1$, $f(1)=1/2$, $f(2)=1/4$.
  - Se observa que los valores se reducen a la mitad en cada paso.
- titulo: ¿Es útil incluir $x=0$ en la tabla de una función exponencial?
  enunciado: ¿Es útil incluir $x=0$ en la tabla de una función exponencial?
  respuesta: Sí
  solucion_pasos:
  - Permite verificar directamente el intercepto con el eje $y$, que coincide con
    el parámetro $a$.
- titulo: ¿Los valores de una tabla exponencial cambian de manera lineal, sumando
    siempre la misma cantidad?
  enunciado: ¿Los valores de una tabla exponencial cambian de manera lineal, sumando
    siempre la misma cantidad?
  respuesta: 'No'
  solucion_pasos:
  - Cambian de manera multiplicativa, multiplicándose por la base $b$ en cada incremento
    unitario de $x$.
errores_frecuentes:
- Elegir un rango de exponentes demasiado amplio, dificultando visualizar los valores
  pequeños cerca de la asíntota.
- Confundir el patrón de cambio exponencial (multiplicativo) con el patrón lineal
  (aditivo).
- No incluir suficientes valores negativos para apreciar el comportamiento cerca de
  la asíntota.
- Cometer errores al calcular potencias con exponentes negativos o fraccionarios.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando construcción de una tabla de valores para graficar una función exponencial.
