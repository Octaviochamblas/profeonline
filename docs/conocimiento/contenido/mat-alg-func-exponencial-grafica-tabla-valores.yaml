semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TABLA_VALORES
resumen_inicial: 'La construcción de una tabla de valores para una función exponencial evalúa abscisas enteras estratégicas para visualizar su curvatura, intercepto $y$ y aproximación asintótica.'
explicacion_simple: |
  Para hacer el dibujo de una función exponencial en el plano cartesiano, lo más recomendable es construir una tabla con al menos cinco puntos. Elegimos valores de $x$ simples alrededor del cero (como $-2, -1, 0, 1, 2$) y calculamos su resultado $y$. Los exponentes negativos nos darán fracciones pequeñas que muestran la parte plana de la curva (la asíntota), mientras que los exponentes positivos mostrarán el despegue rápido de la función.
explicacion_formal: |
  ### Definición formal
  La **tabulación algebraica de la función exponencial** $f(x) = a \cdot b^x$ consiste en construir el conjunto finito de pares ordenados $S = \{(x_k, f(x_k)) \in \mathbb{R}^2 \mid x_k \in \mathbb{Z}\}$ para representar la trayectoria discreta que guía el trazado de la curva continua:

  ### Desglose simbólico
  - Evaluación en $x = 0$: $f(0) = a \cdot b^0 = a$ (punto pivotal en la tabla).
  - Evaluación en positivos ($x = 1, 2$): $f(1) = a \cdot b$, $f(2) = a \cdot b^2$.
  - Evaluación en negativos ($x = -1, -2$): $f(-1) = a \cdot b^{-1} = \frac{a}{b}$, $f(-2) = a \cdot b^{-2} = \frac{a}{b^2}$.
  - Propiedad de razón constante en la tabla: Para abscisas con paso unitario $\Delta x = 1$, el cociente entre ordenadas consecutivas es constante e igual a la base: $\frac{y_{k+1}}{y_k} = b$.

  ### Síntesis didáctica
  Diferenciar tabulación lineal de exponencial: En una tabla lineal, la diferencia $y_{k+1} - y_k$ es constante (suma fija). En una tabla exponencial, la razón $\frac{y_{k+1}}{y_k}$ es constante (multiplicación fija).
definiciones_clave: |
  - **Tabla de valores**: Disposición matricial de pares ordenados $(x, y)$ calculados a partir de la regla funcional.
  - **Paso de tabulación unitario**: Incremento constante $\Delta x = 1$ que expone la razón multiplicativa $b$.
  - **Aproximación asintótica en tabla**: Secuencia de valores $y$ que disminuyen hacia cero sin anularse jamás.
propiedades_relaciones: |
  - **Razón geométrica de ordenadas**: La secuencia de ordenadas en una tabulación uniforme forma una progresión geométrica de razón $b$.
  - **Trazado suave continuo**: Los puntos tabulados se unen mediante una curva continua de curvatura siempre positiva.
ejemplo_guiado:
  enunciado: 'Construye la tabla de valores para la función exponencial $f(x) = 2 \cdot 3^x$ considerando los valores $x \in \{-2, -1, 0, 1, 2\}$ e identifica la razón entre sus ordenadas consecutivas.'
  pasos:
    - 'Paso 1: Evaluamos $x = -2 \implies f(-2) = 2 \cdot 3^{-2} = 2 \cdot \frac{1}{9} = \frac{2}{9} \approx 0.22$.'
    - 'Paso 2: Evaluamos $x = -1 \implies f(-1) = 2 \cdot 3^{-1} = 2 \cdot \frac{1}{3} = \frac{2}{3} \approx 0.67$.'
    - 'Paso 3: Evaluamos $x = 0 \implies f(0) = 2 \cdot 3^0 = 2 \cdot 1 = 2$.'
    - 'Paso 4: Evaluamos $x = 1 \implies f(1) = 2 \cdot 3^1 = 6$. Evaluamos $x = 2 \implies f(2) = 2 \cdot 3^2 = 18$.'
    - 'Paso 5: Verificamos la razón entre ordenadas: $\frac{0.67}{0.22} = 3$, $\frac{2}{2/3} = 3$, $\frac{6}{2} = 3$, $\frac{18}{6} = 3$. La razón coincide con la base $b = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al construir la tabla de valores para la función exponencial $f(x) = 4 \cdot 2^x$, ¿cuáles son las ordenadas $y$ correspondientes a $x = -1$ y $x = 2$?'
    choices:
      - {text: '$y = 2$ para $x = -1$, e $y = 16$ para $x = 2$', is_correct: true}
      - {text: '$y = -8$ para $x = -1$, e $y = 16$ para $x = 2$', is_correct: false}
      - {text: '$y = 0.5$ para $x = -1$, e $y = 8$ para $x = 2$', is_correct: false}
      - {text: '$y = 2$ para $x = -1$, e $y = 64$ para $x = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = 2$ para $x = -1$, e $y = 16$ para $x = 2$''. Calculamos $f(-1) = 4 \cdot 2^{-1} = \frac{4}{2} = 2$, y $f(2) = 4 \cdot 2^2 = 4 \cdot 4 = 16$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En una tabla de valores de una función exponencial básica con paso $\Delta x = 1$, si la ordenada en $x = 1$ es $y = 12$ y en $x = 2$ es $y = 36$, ¿cuál es la base $b$ de la función?'
    choices:
      - {text: '$b = 3$', is_correct: true}
      - {text: '$b = 24$', is_correct: false}
      - {text: '$b = 2$', is_correct: false}
      - {text: '$b = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = 3$''. La razón entre dos ordenadas consecutivas con paso unitario entrega la base: $b = \frac{36}{12} = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Seleccionar un conjunto equilibrado de abscisas enteras (típicamente $x = -2, -1, 0, 1, 2$).'
  - 'Paso 2: Evaluar cada valor $x$ en la función exponencial respetando las leyes de potencias con exponente negativo.'
  - 'Paso 3: Organizar los resultados en una tabla de dos columnas $(x, y)$.'
  - 'Paso 4: Ubicar los puntos ordenados en el plano cartesiano y trazarlos mediante una curva suave continua.'
errores_correccion: |
  - **Error 1:** Escribir un resultado negativo para una ordenada asociada a un exponente negativo (ej: $2^{-2} = -4$). **Cómo corregirlo:** Un exponente negativo invierte la base convirtiéndola en fracción positiva: $2^{-2} = \frac{1}{2^2} = \frac{1}{4} = 0.25 > 0$.
  - **Error 2:** Sumar la base en lugar de multiplicarla al avanzar en la tabla. **Cómo corregirlo:** Las funciones exponenciales aumentan por multiplicación (razón geométrica), no por adición de una constante.
ejemplos:
  - titulo: 'Tabulación con exponente negativo'
    enunciado: '¿Cuál es la ordenada $y$ para $x = -3$ en la función $f(x) = 8 \cdot 2^x$?'
    alternativas:
      - '$y = 1$'
      - '$y = -4$'
      - '$y = 0$'
    respuesta: '$y = 1$'
    solucion_pasos:
      - '1. $f(-3) = 8 \cdot 2^{-3} = 8 \cdot \frac{1}{8} = 1$.'
      - '2. El punto de la tabla es $(-3, 1)$.'
  - titulo: 'Razón geométrica constante'
    enunciado: 'En la tabla de $f(x) = 3^x$, las ordenadas son $\frac{1}{3}, 1, 3, 9$. ¿La razón entre términos es 3?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividir cualquier término por el anterior da $3$: $\frac{1}{1/3} = 3$, $\frac{3}{1} = 3$, $\frac{9}{3} = 3$.'
  - titulo: 'Tabulación con base fraccionaria'
    enunciado: 'Para $g(x) = \left(\frac{1}{2}\right)^x$, ¿evaluar $x = -2$ da $y = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(-2) = \left(\frac{1}{2}\right)^{-2} = 2^2 = 4$.'
  - titulo: 'Punto pivotal de tabulación'
    enunciado: '¿El punto $(0, a)$ está presente en la tabla de cualquier función $f(x) = a \cdot b^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluar $x = 0$ siempre da $f(0) = a \cdot 1 = a$.'
errores_frecuentes:
  - 'Al evaluar $x = -2$ en $f(x) = 3^x$, se obtiene la ordenada negativa $y = -9$.'
  - 'En la tabla de valores de una función exponencial, las diferencias entre ordenadas consecutivas son siempre iguales.'
  - 'Evaluar $x = 0$ en $f(x) = 5^x$ resulta en $y = 0$.'
  - 'Los puntos de una tabla exponencial deben unirse mediante segmentos rectos en zigzag.'
  - 'En la función $f(x) = 2 \cdot 3^x$, la ordenada para $x = 1$ se obtiene multiplicando $(2 \cdot 3)^1 = 6^1 = 6$ y luego elevando al cuadrado.'
afirmaciones_verdaderas:
  - 'La secuencia de ordenadas en una tabla de valores exponencial con paso unitario forma una progresión geométrica de razón $b$.'
  - 'Los exponentes negativos en una función exponencial de base positiva producen ordenadas fraccionarias estrictamente mayores que cero.'
