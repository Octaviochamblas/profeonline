semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TABLA_VALORES
resumen_inicial: La tabla de valores de una función exponencial $f(x) = a \cdot b^x$
  permite calcular puntos $(x, y)$ evaluando exponentes enteros positivos, nulos y
  negativos.
explicacion_simple: "Para construir una **tabla de valores exponencial**:\n- Elegimos\
  \ valores de $x$ sencillos como $-2, -1, 0, 1, 2$.\n- Evaluamos $f(x) = 2^x$:\n\
  \  - $x = -2 \\implies f(-2) = 2^{-2} = \\frac{1}{4} = 0{,}25$.\n  - $x = -1 \\\
  implies f(-1) = 2^{-1} = \\frac{1}{2} = 0{,}5$.\n  - $x = 0 \\implies f(0) = 2^0\
  \ = 1$.\n  - $x = 1 \\implies f(1) = 2^1 = 2$.\n  - $x = 2 \\implies f(2) = 2^2\
  \ = 4$.\n- Al unir los puntos en el plano cartesiano se forma la curva exponencial\
  \ suave."
explicacion_formal: 'Dada la función $f: \mathbb{R} \to ]0, +\infty[$ dada por $f(x)
  = a \cdot b^x$, la **evaluación en tabla de valores** es la tabulación del conjunto
  discreto de pares ordenados:


  $$T(f) = \{(x_k, f(x_k)) \in \mathbb{R}^2 \mid x_k \in \mathbb{Z}, \quad y_k = a
  \cdot b^{x_k}\dots$$


  **Desglose de la fórmula:**

  - Generación cartesiana del trazo exponencial mediante la propiedad de exponentes
  racionales $b^{-n} = 1 / b^n$.'
definiciones_clave: '- **Tabla de valores exponencial**: Matriz de parejas ordenadas
  $(x, y)$ que guían el trazado de la curva exponencial continua.'
propiedades_relaciones: '- **Crecimiento geométrico**: A incrementos aditivos constantes
  en $x$ ($+1$), los valores de $y$ se multiplican por un factor constante $b$.'
ejemplo_guiado:
  enunciado: Construye los pares ordenados para $x = -1, 0, 1, 2$ en la función exponencial
    $f(x) = 3 \cdot 2^x$.
  pasos:
  - 'Paso 1: Evaluar $x = -1$: $f(-1) = 3 \cdot 2^{-1} = 3 \cdot \frac{1}{2} = 1{,}5
    \implies (-1; 1{,}5)$.Paso 2: Evaluar $x = 0$: $f(0) = 3 \cdot 2^0 = 3 \cdot 1
    = 3 \implies (0, 3)$.Paso 3: Evaluar $x = 1$: $f(1) = 3 \cdot 2^1 = 3 \cdot 2
    = 6 \implies (1, 6)$.Paso 4: Evaluar $x = 2$: $f(2) = 3 \cdot 2^2 = 3 \cdot 4
    = 12 \implies (2, 12)$.Paso 5: Concluir las parejas ordenadas: $(-1; 1{,}5)$,
    $(0, 3)$, $(1, 6)$ y $(2, 12)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $x = -1$ en la función $f(x) = 3 \cdot 2^x$, ¿cuál es el par
    ordenado correspondiente?
  choices:
  - text: ($-1; 1{,}5$)
    is_correct: true
  - text: ($-1, -6$)
    is_correct: false
  - text: ($-1, 3$)
    is_correct: false
  - text: ($-1, 0$)
    is_correct: false
  explanation: La alternativa correcta es '($-1; 1{,}5$)'. (Puesto que $3 \cdot 2^{-1}
    = 3/2 = 1{,}5$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué patrón numérico siguen los valores de $y$ cuando $x$ aumenta de $1$
    en $1$ en $f(x) = 3 \cdot 2^x$?
  choices:
  - text: Se van multiplicando sucesivamente por la base 2 (1,5 -> 3 -> 6 -> 12).
    is_correct: true
  - text: Se van sumando de a 3 en 3.
    is_correct: false
  - text: Se mantienen constantes en 3.
    is_correct: false
  - text: Se van dividiendo por 2.
    is_correct: false
  explanation: La alternativa correcta es 'Se van multiplicando sucesivamente por
    la base 2 (1,5 -> 3 -> 6 -> 12).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar un dominio discreto de valores enteros para $x$.'
- 'Paso 2: Calcular el valor de la potencia $b^x$ respetando signos de exponentes.'
- 'Paso 3: Multiplicar la potencia por el parámetro inicial $a$.'
- 'Paso 4: Formar las coordenadas $(x, y)$ para graficar en el plano.'
errores_correccion: '- **Error común:** Pensar que evaluar un exponente negativo produce
  un resultado negativo (decir $2^{-2} = -4$).

  - **Cómo corregirlo:** El signo negativo en el exponente invierte la base ($2^{-2}
  = 1/2^2 = 1/4 = 0{,}25$), NUNCA hace que el resultado sea negativo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de funciones exponenciales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones exponenciales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función exponencial f(x) = b^x con b > 1 es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, a mayor exponente mayor es la potencia resultante cuando la base es mayor
    a 1.
- titulo: ¿La ecuación 2^(3x - 1) = 16 se resuelve igualando 3x - 1 a 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, expresando 16 como 2^4 se igualan directamente los exponentes.
errores_frecuentes:
- Creer que un exponente negativo produce un resultado negativo (evaluar $2^{-2} =
  -4$ en lugar de $0{,}25$).
- Confundir la asíntota horizontal $y = k$ con el intercepto en el eje Y $f(0) = a
  + k$.
- Creer que la gráfica de una función exponencial toca o cruza el eje X cuando no
  tiene traslación vertical ($k = 0$).
- Igualar bases incorrectamente al resolver ecuaciones exponenciales (decir $16 =
  2^3$ en vez de $2^4$).
- Confundir la tasa de crecimiento porcentual $r$ con la base completa del modelo
  $(1 + r)$.
afirmaciones_verdaderas:
- Una función exponencial $f(x) = b^x$ es estrictamente creciente si $b > 1$ y estrictamente
  decreciente si $0 < b < 1$.
- La asíntota horizontal de la función exponencial trasladada $f(x) = a \cdot b^{p
  x + q} + k$ es la recta $y = k$.
al_terminar_debes_poder: Al finalizar este recurso podrás construir tablas de valores,
  analizar crecimiento y monotonía, identificar asíntotas trasladadas, resolver ecuaciones
  de igual base y modelar fenómenos exponenciales.
