semantic_id: MAT.ALG.FUNC_CUADR_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: El reconocimiento de situaciones que pueden modelarse mediante una función cuadrática identifica fenómenos físicos, geométricos o económicos donde una magnitud depende del producto de dos variables lineales o de un factor de aceleración constante.
explicacion_simple: "![El reconocimiento de situaciones que pueden modelarse mediante una función cuadrática identifica fenómenos físicos, geométricos o económicos donde una magnitud depende del producto de dos variables lineales o de un factor de aceleración constante](/static/img/nodos/reconocimiento-de-situaciones-que-pueden-modelarse-mediante-una-funcion-cuadratica-intro.svg)\n\n\n¿Cómo saber si un problema de la vida real se resuelve con una **parábola cuadrática**?\n\n- **1. En Física (Gravedad y Movimiento):**\n  - Todo lo que lanzas al aire (una pelota, un cohete, un chorro de agua) sube, frena y cae por culpa de la gravedad ($g$). Su altura sigue una fórmula con **$t^2$**.\n- **2. En Geometría (Áreas):**\n  - El área de un terreno es $\\text{Largo} \\times \\text{Ancho}$. Si las dos medidas cambian juntas (ej: $x \\cdot (40 - x)$), se genera un término **$-x^2$**.\n- **3. En Economía (Ingresos y Ganancias):**\n  - $\\text{Ingreso} = \\text{Precio} \\times \\text{Cantidad vendida}$.\
  \ Si al subir el precio vendes menos clientes, el ingreso forma una parábola con un **punto máximo**."
explicacion_formal: 'Una relación funcional $f: \mathcal{D} \subseteq \mathbb{R} \to \mathbb{R}$ es modelable cuadráticamente si su tasa de cambio instantánea $\frac{df}{dx}$ varía linealmente con respecto a la variable independiente $x$:

  $$\frac{d^2 f}{dx^2} = 2a = \text{Constante} \neq 0 \Longleftrightarrow f(x) = ax^2 + bx + c$$


  **Tipologías canónicas de modelación**:

  1. **Cinemática unidimensional clásica**: $x(t) = x_0 + v_0 t + \frac{1}{2}at^2$.

  2. **Isoperimetría y áreas bidimensionales**: $\mathcal{A}(x) = x(S - kx) = -kx^2 + Sx$.

  3. **Economía de demanda lineal elástica**: $I(p) = p \cdot q(p) = p(A - Bp) = -Bp^2 + Ap$.'
definiciones_clave: '- **Modelo cuadrático**: Representación matemática $f(x) = ax^2 + bx + c$ de un fenómeno no lineal con concavidad definida.

  - **Tasa de cambio de segundo orden**: Aceleración constante que gobierna la curvatura del modelo.'
propiedades_relaciones: '- **Existencia de extremo único**: Los modelos con $a < 0$ garantizan una cota máxima global alcanzable.

  - **Segundas diferencias finitas**: En una tabla con intervalos $\Delta x$ constantes, $\Delta^2 y = 2a(\Delta x)^2$ es estrictamente constante.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento de situaciones que pueden modelarse mediante una función cuadrática identifica fenómenos físicos, geométricos o económicos donde una magnitud depende del producto de dos variables lineales o de un factor de aceleración constante](/static/img/nodos/reconocimiento-de-situaciones-que-pueden-modelarse-mediante-una-funcion-cuadratica-ejemplos.svg)



    Determina cuál de las siguientes situaciones se modela mediante una función cuadrática justificando formalmente:

    A) El costo de un viaje en taxi con bajada de bandera fija más cobro por kilómetro.

    B) El área de un huerto rectangular rodeado por 60 metros de alambre.'
  pasos:
  - 'Paso 1: Analizar la opción A:

    - Costo $= \text{fijo} + k \cdot x$ (grado 1, modelo **lineal/afín**).'
  - 'Paso 2: Analizar la opción B:

    - Perímetro: $2x + 2y = 60 \implies y = 30 - x$.

    - Área: $\mathcal{A}(x) = x \cdot y = x(30 - x) = -x^2 + 30x$.

    - La expresión contiene un término cuadrático $x^2$ con $a = -1 \neq 0$.'
  - 'Paso 3: Conclusión: La **situación B** se modela mediante una función cuadrática.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de los siguientes fenómenos corresponde a un modelo cuadrático?
  choices:
  - text: La altura de una piedra lanzada verticalmente hacia arriba
    is_correct: true
  - text: El crecimiento de una colonia de bacterias que se duplica cada hora
    is_correct: false
  - text: El costo de comprar kilogramos de pan a precio constante
    is_correct: false
  - text: El perímetro de un cuadrado según el lado
    is_correct: false
  explanation: La alternativa correcta es 'La altura de una piedra lanzada verticalmente hacia arriba'. La aceleración gravitatoria genera una dependencia temporal cuadrática $h(t) = -\frac{1}{2}gt^2 + v_0t + h_0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una tabla de valores con espaciamiento constante en x, ¿qué propiedad distingue a una función cuadrática?
  choices:
  - text: Las segundas diferencias (Δ²y) son constantes y distintas de cero.
    is_correct: true
  - text: Las primeras diferencias (Δy) son constantes.
    is_correct: false
  - text: La razón entre términos consecutivos es constante.
    is_correct: false
  - text: Todos los valores de y son iguales.
    is_correct: false
  explanation: La alternativa correcta es 'Las segundas diferencias (Δ²y) son constantes y distintas de cero.'. La aceleración discreta constante caracteriza a las parábolas.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables involucradas en el fenómeno.'
- 'Paso 2: Analizar si la magnitud resulta del producto de dos expresiones lineales o de una tasa con aceleración constante.'
- 'Paso 3: Formular la ecuación matemática y verificar si el grado máximo es 2.'
- 'Paso 4: Confirmar que el coeficiente cuadrático satisface $a \neq 0$.'
errores_correccion: '- **Error común:** Confundir crecimiento cuadrático con crecimiento exponencial (ej: bacterias que se duplican).

  - **Cómo corregirlo:** La duplicación recurrente es **exponencial ($2^t$)**; el modelo **cuadrático proviene de aceleración o productos ($t^2$)**.'
ejemplos:
- titulo: 'Ejemplo 1: Modelo de ingreso económico'
  enunciado: Si $q = 200 - 4p$, ¿qué tipo de función es el ingreso $I(p) = p \cdot q$?
  alternativas:
  - Cuadrática con concavidad hacia abajo (a = -4)
  - Lineal afín
  - Exponencial
  - Constante
  respuesta: Cuadrática con concavidad hacia abajo (a = -4)
  solucion_pasos:
  - 'Paso 1: $I(p) = p(200 - 4p) = -4p^2 + 200p \implies$ cuadrática con $a = -4 < 0$.'
- titulo: 'Ejemplo 2: Distancia de frenado de un automóvil'
  enunciado: La distancia de frenado varía con el cuadrado de la rapidez $d(v) = 0{,}05v^2$. ¿Es cuadrática?
  alternativas:
  - Sí, es cuadrática pura con vértice en el origen
  - No, es lineal
  - No, es cúbica
  - Es inversamente proporcional
  respuesta: Sí, es cuadrática pura con vértice en el origen
  solucion_pasos:
  - 'Paso 1: Depende directamente de $v^2$ con $a = 0{,}05 \implies$ cuadrática.'
- titulo: 'Ejemplo 3: Identificación de no linealidad'
  enunciado: ¿Cuál situación NO se modela con una función cuadrática?
  alternativas:
  - El sueldo mensual de un vendedor a comisión fija por venta
  - El área de un círculo según su radio
  - La energía cinética de un móvil según su velocidad
  - La trayectoria de un balón de básquetbol
  respuesta: El sueldo mensual de un vendedor a comisión fija por venta
  solucion_pasos:
  - 'Paso 1: El sueldo con comisión fija por venta es estrictamente lineal ($y = mx + n$).'
- titulo: 'Ejemplo 4: Área de triángulo con base y altura dependientes'
  enunciado: Si base y altura suman 20 cm, ¿el área es cuadrática?
  alternativas:
  - Sí, A(x) = x(20 - x)/2 = -0,5x² + 10x
  - No, el área de triángulos es lineal
  - Es constante
  - No se puede saber
  respuesta: Sí, A(x) = x(20 - x)/2 = -0,5x² + 10x
  solucion_pasos:
  - 'Paso 1: $\mathcal{A}(x) = \frac{x(20 - x)}{2} = -0{,}5x^2 + 10x$ (cuadrática).'
errores_frecuentes:
- Confundir modelos lineales con modelos cuadráticos en problemas de geometría.
- Asociar cualquier función no lineal con una cuadrática.
- Olvidar que las funciones cuadráticas exigen exponente exactamente igual a 2.
afirmaciones_verdaderas:
- Los problemas de trayectorias bajo gravedad constante se modelan con funciones cuadráticas.
- El producto de dos variables lineales con suma constante engendra una función cuadrática.
al_terminar_debes_poder: '**QUÉ:** Reconocer situaciones contextuales modelables mediante funciones cuadráticas.


  **CÓMO:** Identificando fenómenos con aceleración constante, productos lineales o áreas con ligadura perimétrica.


