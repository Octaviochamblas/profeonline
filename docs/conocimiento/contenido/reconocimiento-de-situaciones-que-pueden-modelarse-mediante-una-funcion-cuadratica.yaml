semantic_id: MAT.ALG.FUNC_CUADR_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: 'Reconocimiento de situaciones que pueden modelarse mediante una
  función cuadrática: parábola, vértice, concavidad y formas de Modelamiento y aplicaciones.'
explicacion_simple: No todo problema aplicado requiere una función cuadrática; reconocer
  las señales típicas de estos problemas evita usar herramientas matemáticas equivocadas.
explicacion_formal: '### Definición formal


  Una situación es modelable mediante una función cuadrática cuando la cantidad de
  interés se expresa como el producto de dos expresiones lineales en la misma variable
  (como área = ancho × largo, con ambos dependientes de $x$), o cuando involucra movimiento
  bajo aceleración constante (posición en función del tiempo).


  ### Desarrollo didáctico


  Las señales típicas son: "área" o "producto" de dos cantidades relacionadas linealmente,
  "trayectoria", "altura de un proyectil", o "ingreso total" cuando tanto el precio
  como la cantidad vendida dependen de la misma variable.


  Si un jardín tiene un ancho $x$ y un largo que es el doble más $3$, su área $A(x)=x(2x+3)$
  es una función cuadrática, porque el área es un producto de dos expresiones lineales
  en $x$.'
definiciones_clave: '- **Reconocimiento de situaciones que pueden modelarse mediante
  una función cuadrática**: Elemento o parámetro esencial en la representación de
  la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  reconocimiento de situaciones que pueden modelarse mediante una función cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando reconocimiento
    de situaciones que pueden modelarse mediante una función cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a reconocimiento
    de situaciones que pueden modelarse mediante una función cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
