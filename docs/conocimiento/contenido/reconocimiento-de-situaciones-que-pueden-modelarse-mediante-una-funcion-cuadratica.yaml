semantic_id: MAT.ALG.FUNC_CUADR_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: 'El modelamiento cuadrático identifica fenómenos reales donde la variable dependiente varía en proporción al cuadrado de la variable independiente o presenta un punto óptimo de giro.'
explicacion_simple: |
  Muchas situaciones de la vida real siguen un comportamiento cuadrático. Se reconocen porque presentan un punto máximo (como la altura máxima que alcanza una pelota lanzada al aire o la ganancia máxima de un negocio) o un punto mínimo (como la forma de los cables de un puente colgante o el costo mínimo de producción). También aparecen cuando calculamos áreas multiplicando dos dimensiones que dependen de la misma variable.
explicacion_formal: |
  ### Definición formal
  Un fenómeno empírico o físico admite un **modelamiento cuadrático** si la relación entre la variable independiente $x$ y la variable dependiente $y$ viene dada por la regla polinomial de grado 2:
  $$y = f(x) = ax^2 + bx + c, \quad a \neq 0$$

  ### Desglose simbólico
  - Criterio de aceleración constante: La tasa instantánea de cambio $f'(x) = 2ax + b$ varía de forma lineal, lo que implica una segunda derivada constante $f''(x) = 2a \neq 0$.
  - Presencia de un extremo único: Existencia de un cambio de monotonía (creciente a decreciente o viceversa) que genera un vértice $V(h, k)$.
  - Producto de dimensiones lineales: Situaciones geométricas donde $y = \text{largo}(x) \cdot \text{ancho}(x)$, con ambos factores lineales en $x$.

  ### Síntesis didáctica
  Diferenciar modelos lineales de cuadráticos: Un modelo lineal presenta una tasa de cambio constante (crece o decrece siempre al mismo ritmo sin girar). Un modelo cuadrático presenta una curva simétrica con un punto de máxima o mínima elevación.
definiciones_clave: |
  - **Modelo cuadrático**: Ecuación $y = ax^2 + bx + c$ que traduce matemáticamente un fenómeno real de grado 2.
  - **Punto de inflexión de monotonía**: Momento en que la variable observada alcanza su cota extrema y cambia de sentido.
  - **Relación de área bidimensional**: Dependencia cuadrática producida al multiplicar expresiones de primer grado.
propiedades_relaciones: |
  - **Simetría temporal o espacial**: En fenómenos físicos libres de roce, los tiempos de ascenso y descenso son simétricos respecto al instante del vértice $t = h$.
  - **Dominio de validez física**: En la práctica real, el dominio se restringe a valores con sentido físico ($x \ge 0$, $y \ge 0$).
ejemplo_guiado:
  enunciado: 'Identifica cuál de las tres siguientes situaciones reales corresponde a un modelo cuadrático y justifica la respuesta: A) El cobro de un taxi con bajada de bandera fija y tarifa constante por km. B) La trayectoria de una piedra lanzada en un tiro parabólico. C) El volumen de agua en un estanque que se vacía a flujo constante.'
  pasos:
    - 'Paso 1: Analizamos la opción A: costo = fijo + (km $\cdot$ tarifa). Es una tasa constante de primer grado $\implies$ Modelo lineal.'
    - 'Paso 2: Analizamos la opción C: volumen = inicial - (tiempo $\cdot$ flujo). Es una disminución a tasa constante $\implies$ Modelo lineal.'
    - 'Paso 3: Analizamos la opción B: la piedra sube frenando por gravedad hasta una altura máxima y luego cae acelerando. Presenta curva simétrica con vértice $\implies$ Modelo cuadrático.'
    - 'Paso 4: Concluimos que la opción B es la única situación que se modela mediante una función cuadrática.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica fundamental en los datos de un fenómeno físico indica la presencia de una relación cuadrática?'
    choices:
      - {text: 'La presencia de una tasa de cambio variable con un punto extremo de altura o cota máxima/mínima', is_correct: true}
      - {text: 'Un crecimiento ilimitado constante sin cambios de pendiente', is_correct: false}
      - {text: 'La invariancia absoluta de la variable dependiente ante cambios en $x$', is_correct: false}
      - {text: 'La existencia de asíntotas verticales en el origen', is_correct: false}
    explanation: 'La alternativa correcta es ''La presencia de una tasa de cambio variable con un punto extremo de altura o cota máxima/mínima''. El giro en el vértice caracteriza a las funciones cuadráticas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un agricultor expresa la superficie de un vivero rectangular mediante $S(x) = x(20 - x) = -x^2 + 20x$. ¿A qué tipo de modelo corresponde esta función?'
    choices:
      - {text: 'A un modelo cuadrático de área bidimensional con vértice en $x = 10$', is_correct: true}
      - {text: 'A un modelo lineal de perímetro constante', is_correct: false}
      - {text: 'A un modelo exponencial de crecimiento biológico', is_correct: false}
      - {text: 'A un modelo racional incompleto', is_correct: false}
    explanation: 'La alternativa correcta es ''A un modelo cuadrático de área bidimensional con vértice en $x = 10$''. El producto $x(20-x)$ genera el término $-x^2$, característico de una función cuadrática.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Analizar la dinámica del fenómeno y determinar si la tasa de variación es constante (lineal) o si varía alcanzando un extremo (cuadrático).'
  - 'Paso 2: Verificar si la variable dependiente proviene del producto de dos términos lineales en $x$.'
  - 'Paso 3: Formular la función en la forma $y = ax^2 + bx + c$ y validar que el coeficiente cuadrático satisface $a \neq 0$.'
errores_correccion: |
  - **Error 1:** Clasificar como cuadrático un fenómeno con crecimiento constante simplemente porque los números crecen rápido. **Cómo corregirlo:** Para ser cuadrático debe existir una dependencia explícita de grado 2 ($x^2$) o un cambio de sentido de variación (vértice).
  - **Error 2:** Creer que todo modelo cuadrático debe estar definido para números negativos en el contexto real. **Cómo corregirlo:** Aunque el dominio matemático de la función sea $\mathbb{R}$, las variables físicas (como tiempo, distancia o masa) imponen un dominio restringido $x \ge 0$.
ejemplos:
  - titulo: 'Modelamiento de trayectoria en física'
    enunciado: '¿La altura $h(t)$ de un balón pateado en el fútbol se modela con una función cuadrática?'
    alternativas:
      - 'Sí, por la acción de la aceleración de gravedad sobre la masa del balón'
      - 'No, es una función lineal constante'
      - 'No, es una función exponencial sin cota'
    respuesta: 'Sí, por la acción de la aceleración de gravedad sobre la masa del balón'
    solucion_pasos:
      - '1. El balón asciende perdiendo velocidad, alcanza su altura máxima en el vértice y cae.'
      - '2. Este comportamiento se modela mediante la ecuación física $h(t) = -\frac{1}{2}gt^2 + v_0 t + h_0$, la cual es una función cuadrática.'
  - titulo: 'Modelamiento de ganancias en economía'
    enunciado: 'Si aumentar el precio de un producto reduce la cantidad vendida, ¿la ganancia total puede modelarse mediante una función cuadrática?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El ingreso es $\text{Precio} \cdot \text{Cantidad} = x(A - Bx) = Ax - Bx^2$, generando una parábola con un precio óptimo que maximiza la ganancia.'
  - titulo: 'Modelamiento de perímetro versus área'
    enunciado: '¿El perímetro de un cuadrado de lado $x$ se modela mediante una función cuadrática?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. El perímetro es $P(x) = 4x$, el cual es una función lineal de primer grado. El área $A(x) = x^2$ sí es cuadrática.'
  - titulo: 'Tasa de cambio no constante'
    enunciado: '¿Una función cuadrática presenta una velocidad de cambio constante en todos sus intervalos?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La pendiente de las tangentes varía de forma continua a lo largo de la curva parabólica.'
errores_frecuentes:
  - 'El costo del consumo de agua domiciliario con tarifa fija por $m^3$ se modela mediante una función cuadrática.'
  - 'La superficie de una figura geométrica de lado $x$ depende de forma lineal de la variable $x$.'
  - 'Todo fenómeno que alcanza un valor máximo requiere obligatoriamente una función exponencial.'
  - 'En un modelo de tiempo versus altura de un proyectil, el tiempo $t$ puede tomar valores negativos.'
  - 'La velocidad constante de un vehículo en carretera genera una gráfica de trayectoria parabólica.'
afirmaciones_verdaderas:
  - 'Las situaciones reales que involucran aceleración constante, optimización de áreas o ingresos con demanda lineal se modelan mediante funciones cuadráticas.'
  - 'Un modelo cuadrático contextualizado se caracteriza por presentar un punto de inflexión de monotonía donde la variable alcanza su cota máxima o mínima.'
al_terminar_debes_poder: 'Reconocer y clasificar problemas contextualizados de la vida real que pueden ser representados mediante funciones cuadráticas.'
