procedimiento:
- 'Paso 1: Identifica si la cantidad de interés depende del producto de dos expresiones
  lineales en la misma variable.'
- 'Paso 2: Verifica si la situación involucra una trayectoria bajo aceleración constante
  (como la gravedad).'
- 'Paso 3: Si se cumple alguna de esas condiciones, la situación es modelable con
  una función cuadrática.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en reconocimiento de situaciones que pueden modelarse
  mediante una función cuadrática.
ejemplos:
- titulo: Reconocimiento de un problema de área
  enunciado: ¿Se puede modelar con una función cuadrática el área de un rectángulo
    cuyo ancho es $x$ y cuyo largo es $x+5$?
  solucion_pasos:
  - El área es $A(x)=x(x+5)$, un producto de dos expresiones lineales en $x$.
  - Sí, se modela con una función cuadrática.
- titulo: Reconocimiento de un problema de ingreso
  enunciado: ¿Se puede modelar con una función cuadrática el ingreso de una empresa
    si el precio es $p(x)=50-2x$ y la cantidad vendida es $x$?
  solucion_pasos:
  - El ingreso es $I(x)=x(50-2x)$, un producto de dos expresiones lineales en $x$.
  - Sí, se modela con una función cuadrática.
- titulo: ¿Toda trayectoria de un objeto en movimiento se modela con una función cuadrática?
  enunciado: ¿Toda trayectoria de un objeto en movimiento se modela con una función
    cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - Solo si el movimiento ocurre bajo aceleración constante; un movimiento a velocidad
    constante se modela con una función afín, no cuadrática.
- titulo: ¿La suma de dos cantidades que dependen linealmente de la misma variable
    produce siempre una función cuadrática?
  enunciado: ¿La suma de dos cantidades que dependen linealmente de la misma variable
    produce siempre una función cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - La suma de dos expresiones lineales sigue siendo lineal; es el producto el que
    genera el término cuadrático.
errores_frecuentes:
- Confundir un problema de suma de cantidades lineales (que da función afín) con uno
  de producto (que da función cuadrática).
- Modelar como cuadrática una situación de movimiento a velocidad constante, sin aceleración.
- No identificar correctamente cuáles dos cantidades del problema dependen de la misma
  variable.
- Asumir que cualquier problema con la palabra "máximo" o "mínimo" requiere necesariamente
  una función cuadrática.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  reconocimiento de situaciones que pueden modelarse mediante una función cuadrática.
