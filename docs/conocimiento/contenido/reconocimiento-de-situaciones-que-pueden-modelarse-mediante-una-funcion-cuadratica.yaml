semantic_id: MAT.ALG.FUNC_CUADR_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: El reconocimiento de situaciones cuadráticas identifica fenómenos reales con aceleración constante, optimizaciones de áreas o costos y variaciones parabólicas.
explicacion_simple: |
  Muchas situaciones de la ciencia, la economía y la vida diaria siguen el patrón de una **función cuadrática $f(x) = ax^2 + bx + c$**:

  1. **Física y movimiento (Tiro parabólico y gravedad)**:
     - El lanzamiento de un balón, un proyectil o el salto de un atleta forman una parábola perfecta.
  2. **Geometría y Áreas**:
     - El área de una figura al variar sus dimensiones (ej. $A(x) = x(20 - x) = 20x - x^2$).
  3. **Economía y Negocios**:
     - Las ganancias o ingresos de un producto al variar el precio (subir el precio disminuye las ventas, produciendo un punto óptimo de ganancia máxima).

  **Pista para identificar un modelo cuadrático**: Existe un cambio no lineal donde la variable de salida crece hasta alcanzar un **máximo** (o decrece hasta un **mínimo**) y luego invierte su comportamiento.
explicacion_formal: |
  Sea un sistema dinámico o económico caracterizado por una variable dependiente $y \in \mathbb{R}$ y una variable independiente $x \in D_{ctx} \subseteq \mathbb{R}$. Un fenómeno admite un **modelo cuadrático continuo** si su tasa de variación instantánea $y' = \frac{dy}{dx}$ es una función afín lineal:

  $$\frac{dy}{dx} = 2ax + b \implies y(x) = \int (2ax + b) \, dx = ax^2 + bx + c$$

  **Criterios de clasificación del modelo cuadrático:**
  - **Aceleración constante ($\ddot{x} = a_0$):** Ecuaciones cinemáticas de posición $s(t) = s_0 + v_0 t + \frac{1}{2}a_0 t^2$.
  - **Optimización bilineal:** Producto de dos cantidades con variación lineal opuesta $I(x) = (P_0 + k x)(Q_0 - m x)$.
  - **Área acotada por perímetro fijo:** Función cuadrática cóncava hacia abajo derivada de restricciones geométricas.
definiciones_clave: |
  - **Modelo cuadrático contextual**: Representación matemática de segundo grado $f(x) = ax^2 + bx + c$ que simula el comportamiento de un proceso real con punto óptimo.
propiedades_relaciones: |
  - **Diferencias finitas cuadráticas constantes**: En una tabla de datos discretos con incrementos constantes de $x$, la segunda diferencia de los valores de $y$ ($\Delta^2 y$) es exactamente una constante no nula.
ejemplo_guiado:
  enunciado: 'Determina si la relación entre el precio de una entrada $x$ y el ingreso total de un teatro $I(x) = -10x^2 + 500x$ corresponde a una situación modelable por una función cuadrática.'
  pasos:
    - 'Paso 1: Analizar la estructura algebraica de la relación: el exponente máximo de la variable de entrada $x$ es 2.'
    - 'Paso 2: Evaluar la presencia de un punto óptimo: como $a = -10 < 0$, la función posee un ingreso máximo alcanzable.'
    - 'Paso 3: Relacionar con el contexto: subir la entrada aumenta el cobro pero disminuye asistentes, produciendo un pico máximo.'
    - 'Paso 4: Concluir que efectivamente se trata de un modelo cuadrático de optimización de ingresos.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica física o económica indica que un fenómeno debe modelarse mediante una función cuadrática y no lineal?'
    choices:
      - {text: 'La existencia de un punto máximo o mínimo extremo donde la tendencia invierte su dirección', is_correct: true}
      - {text: 'El crecimiento constante e ilimitado de la variable de salida sin cambiar de ritmo.', is_correct: false}
      - {text: 'Un comportamiento estrictamente periódico repetitivo como una onda.', is_correct: false}
      - {text: 'Un valor inicial que se mantiene congelado en el tiempo.', is_correct: false}
    explanation: 'La alternativa correcta es ''La existencia de un punto máximo o mínimo extremo donde la tendencia invierte su dirección''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes situaciones reales se modela mediante una función cuadrática?'
    choices:
      - {text: 'La trayectoria en el aire de una pelota de fútbol lanzada desde una portería', is_correct: true}
      - {text: 'El costo total de comprar $n$ kilogramos de manzanas a un precio fijo por kilo.', is_correct: false}
      - {text: 'El número de bacterias que se duplican cada hora.', is_correct: false}
      - {text: 'El saldo final de una cuenta corriente con cobro de comisión fija mensual.', is_correct: false}
    explanation: 'La alternativa correcta es ''La trayectoria en el aire de una pelota de fútbol lanzada desde una portería''. Es un tiro parabólico acelerado por gravedad.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Analizar la situación contextual y verificar si existe una relación de dependencia de segundo grado.'
  - 'Paso 2: Comprobar si la aceleración es constante o si intervienen dos variables lineales multiplicándose.'
  - 'Paso 3: Verificar si el fenómeno alcanza un valor máximo o mínimo (un punto de inflexión o vértice).'
  - 'Paso 4: Formular la estructura $f(x) = ax^2 + bx + c$ acorde con la física o economía del problema.'
errores_correccion: |
  - **Error común:** Confundir modelos cuadráticos (aceleración/área, grado 2) con modelos exponenciales (crecimiento/duplicación continua).
  - **Cómo corregirlo:** La cuadrática sube y **VUELVE A BAJAR (o al revés)** formando una parábola; la exponencial crece o decrece sin cambiar de curvatura.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Reconocimiento de tiro parabólico.
    alternativas:
      - 'Modelo cuadrático de trayectoria'
      - 'Modelo lineal de velocidad constante'
      - 'Modelo exponencial de crecimiento'
    respuesta: 'Modelo cuadrático de trayectoria'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Reconocimiento de área máxima.
    alternativas:
      - 'Modelo cuadrático de área respecto al ancho'
      - 'Modelo lineal de perímetro constante'
      - 'Sin relación funcional'
    respuesta: 'Modelo cuadrático de área respecto al ancho'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada una situación de cobro fijo por unidad producida, es correcto afirmar que se modela mediante una función cuadrática.'
  - 'La confusión entre modelos de crecimiento exponencial acelerado y el movimiento de aceleración constante de la función cuadrática.'
  - 'La suposición de que cualquier fenómeno con gráfica curva debe ser obligatoriamente una parábola cuadrática.'
  - 'La falta de identificación del vértice como el punto óptimo real en problemas aplicados de ingresos o costos.'
  - 'La suposición de que un modelo cuadrático puede carecer de restricciones físicas en su dominio contextual.'
afirmaciones_verdaderas:
  - 'Fenómenos cinemáticos de aceleración constante, optimización de áreas y máximos de ingresos se modelan mediante funciones cuadráticas.'
  - 'En un conjunto de datos discretos con incrementos regulares de $x$, la función cuadrática se caracteriza por presentar segundas diferencias $\Delta^2 y$ constantes.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y clasificar situaciones reales modelables mediante funciones cuadráticas.
  CÓMO: Identificar aceleración constante, productos de variación lineal o puntos extremos y distinguirlos de modelos lineales o exponenciales.
