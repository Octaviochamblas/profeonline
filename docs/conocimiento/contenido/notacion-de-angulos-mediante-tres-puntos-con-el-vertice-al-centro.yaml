semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.NOTACION_TRES_PUNTOS
resumen_inicial: La notación por tres puntos sitúa la letra del vértice en el centro
  para identificar con precisión un ángulo específico dentro de diagramas o polígonos
  complejos.
explicacion_simple: '![Notación de Tres Puntos](/static/img/nodos/notacion-de-angulos-mediante-tres-puntos-con-el-vertice-al-centro-intro.svg)


  Cuando hay muchos ángulos juntos, usamos tres letras para no confundirnos. La letra
  del centro es el vértice y las otras dos muestran hacia dónde van los lados. Por
  ejemplo, en $\angle ABC$, el ángulo está en la esquina $B$.'
explicacion_formal: '### Definición formal

  La **notación canónica de tres puntos** describe unívocamente un ángulo mediante
  una terna ordenada de puntos no colineales $(A, O, B)$ en el plano:


  $$\angle AOB \iff \text{Ángulo con rayo inicial } \vec{OA}, \text{ vértice central
  } O \text{ y rayo final } \vec{OB}$$


  $$\angle AOB = \angle BOA \quad (\text{en medida no dirigida})$$


  ### Desglose simbólico y geométrico

  - $A$: Punto arbitrario sobre el primer lado ($A \in \vec{OA}, A \neq O$).

  - $O$: Vértice central estricto (posición intermedia obligatoria en la terna).

  - $B$: Punto arbitrario sobre el segundo lado ($B \in \vec{OB}, B \neq O$).

  - Símbolo $\angle$: Operador que declara la entidad geométrica angular.


  ### Síntesis didáctica

  La notación de tres puntos elimina cualquier ambigüedad en figuras complejas donde
  múltiples ángulos comparten el mismo vértice, identificando con precisión cuáles
  rayos delimitan la abertura.'
definiciones_clave: '- **Notación de tres puntos**: Forma unívoca de nombrar un ángulo
  escribiendo $\angle ABC$, donde $B$ es el vértice.

  - **Ángulos adyacentes con vértice común**: Ángulos que comparten el mismo vértice
  y un lado común sin solaparse. '
propiedades_relaciones: '- **Conmutatividad de extremos**: $\angle ABC = \angle CBA$,
  ya que delimitan la misma abertura entre los mismos rayos.

  - **Desambiguación**: Es obligatoria cuando un mismo vértice es compartido por dos
  o más ángulos distintos. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Notación de Tres Puntos](/static/img/nodos/notacion-de-angulos-mediante-tres-puntos-con-el-vertice-al-centro-ejemplos.svg)


    En un cuadrilátero $ABCD$, se traza la diagonal $AC$ formando dos ángulos en la
    esquina $A$: $\angle BAC$ y $\angle CAD$. Si $m(\angle BAC) = 30^\circ$ y $m(\angle
    CAD) = 45^\circ$, calcula la medida del ángulo total $\angle BAD$.'
  pasos:
  - 'Paso 1: Notar que la notación por tres puntos ubica el vértice en $A$ para los
    ángulos adyacentes $\angle BAC$ y $\angle CAD$.'
  - 'Paso 2: Sumar ambas aberturas contiguas: $m(\angle BAD) = m(\angle BAC) + m(\angle
    CAD)$.'
  - 'Paso 3: Calcular la suma: $30^\circ + 45^\circ = 75^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es necesario usar la notación de tres puntos como ∠AOB en lugar
    de solo nombrar el vértice ∠O?
  choices:
  - text: Para identificar sin ambigüedad cuál ángulo específico se mide cuando varios
      rayos nacen en O
    is_correct: true
  - text: Porque los ángulos simples solo existen si tienen tres vértices
    is_correct: false
  - text: Para aumentar automáticamente la medida en grados del ángulo
    is_correct: false
  - text: Porque un solo punto no puede dibujarse en el plano cartesiano
    is_correct: false
  explanation: Se utiliza la notación de tres puntos para identificar sin ambigüedad
    cuál ángulo específico se mide cuando varios rayos nacen en O.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos ángulos adyacentes en la esquina A son ∠BAC = 30° y ∠CAD = 45°,
    ¿cuánto mide el ángulo total ∠BAD?
  choices:
  - text: 75°
    is_correct: true
  - text: 15°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 105°
    is_correct: false
  explanation: Sumando las aberturas contiguas 30° + 45° se obtiene un total de 75°.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el punto del vértice y ubicarlo en la posición intermedia.'
- 'Paso 2: Elegir un punto en cada rayo delimitador para colocarlos en los extremos.'
- 'Paso 3: Escribir la expresión formal $\angle ABC$ o $\angle CBA$.'
errores_correccion: Asegúrate de colocar siempre la letra del vértice en la posición
  central al usar la notación de tres puntos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo con vértices $P, Q, R$, ¿cómo se denota el ángulo interior
    ubicado en la esquina $Q$?
  alternativas:
  - $\angle PQR$
  - $\angle QPR$
  - $\angle PRQ$
  respuesta: $\angle PQR$
  solucion_pasos:
  - El vértice $Q$ debe ir en la posición central: $\angle PQR$ o $\angle RQP$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes notaciones representa exactamente el mismo ángulo
    que $\angle RST$?
  alternativas:
  - $\angle TSR$
  - $\angle SRT$
  - $\angle STR$
  respuesta: $\angle TSR$
  solucion_pasos:
  - Invertir los extremos no cambia el vértice ni los rayos: $\angle RST = \angle
      TSR$.
- titulo: ¿Las expresiones ∠ABC y ∠CBA representan exactamente el mismo ángulo geométrico?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos comparten el vértice B y los rayos BA y BC.
- titulo: ¿Es correcto denotar un ángulo como ∠ABC si su vértice está en el punto
    A?
  respuesta: 'No'
  solucion_pasos:
  - No, si el vértice está en A, la notación debe ser ∠BAC o ∠CAB.
errores_frecuentes:
- Escribir la letra del vértice al inicio o al final de la notación en vez de en el
  centro.
- Confundir la notación del ángulo $\angle ABC$ con la del triángulo $\triangle ABC$.
- Usar una sola letra $\angle O$ cuando hay múltiples ángulos convergiendo en ese
  mismo punto.
- Suponer que $\angle ABC$ y $\angle CBA$ son ángulos distintos con medidas diferentes.
- Omitir el símbolo de ángulo $\angle$ al escribir la terna de puntos.
afirmaciones_verdaderas:
- En la notación de tres puntos $\angle ABC$, la letra central $B$ es siempre el vértice.
- Los ángulos $\angle XYZ$ y $\angle ZYX$ son idénticos y poseen la misma medida angular.
al_terminar_debes_poder: '**QUÉ:** Aplicar la notación de tres puntos para nombrar
  y distinguir ángulos en figuras geométricas sin ambigüedad.


  **CÓMO:** Colocando el punto de origen en la posición central ($\angle AOB$) y reconociendo
  la conmutatividad de los puntos extremos $\angle AOB = \angle BOA$.


  ![Resumen de Notación de Tres Puntos](/static/img/nodos/notacion-de-angulos-mediante-tres-puntos-con-el-vertice-al-centro-resumen.svg)'
