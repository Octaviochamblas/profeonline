semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.NOTACION_TRES_PUNTOS
resumen_inicial: La notación por tres puntos sitúa la letra del vértice en el centro
  para identificar con precisión un ángulo específico dentro de diagramas o polígonos
  complejos.
explicacion_simple: Cuando hay muchos ángulos juntos, usamos tres letras para no confundirnos.
  La letra del centro es el vértice y las otras dos muestran hacia dónde van los lados.
  Por ejemplo, en $\angle ABC$, el ángulo está en la esquina $B$.
explicacion_formal: 'La notación por tres puntos $\angle AOB$ identifica unívocamente
  un ángulo en el plano: la primera letra $A$ ubica un punto en el primer rayo, la
  letra central $O$ designa al vértice y la tercera letra $B$ ubica un punto en el
  segundo rayo.'
definiciones_clave: '- **Notación de ángulos mediante tres puntos con el vértice al
  centro**: Concepto geométrico que permite estructurar la notación y medida angular.

  - **Notación angular**: Simbología usada (como $\angle$, $\alpha$, $\theta$) para
  representar ángulos.'
propiedades_relaciones: '- **Unicidad de notación**: Cada ángulo posee una notación
  simbólica estándar que evita confusiones.

  - **Orientación**: La medición en sentido antihorario se considera positiva en geometría
  y trigonometría.'
ejemplo_guiado:
  enunciado: 'En un cuadrilátero $ABCD$, se traza la diagonal $AC$ formando dos ángulos
    en la esquina $A$: $\angle BAC$ y $\angle CAD$. Si $m(\angle BAC) = 30^\circ$
    y $m(\angle CAD) = 45^\circ$, calcula la medida del ángulo total $\angle BAD$.'
  pasos:
  - 'Paso 1: Notar que la notación por tres puntos ubica el vértice en $A$ para los
    ángulos adyacentes $\angle BAC$ y $\angle CAD$.'
  - 'Paso 2: Sumar ambas aberturas contiguas: $m(\angle BAD) = m(\angle BAC) + m(\angle
    CAD)$.'
  - 'Paso 3: Calcular la suma: $30^\circ + 45^\circ = 75^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el propósito principal de emplear la notación estándar en notación
    de ángulos mediante tres puntos con el vértice al centro?
  choices:
  - text: Identificar sin ambigüedad el vértice, los lados y la abertura del ángulo
    is_correct: true
  - text: Cambiar la medida del ángulo según el tipo de letra usado
    is_correct: false
  - text: Convertir automáticamente cualquier ángulo en un ángulo recto
    is_correct: false
  - text: Eliminar la necesidad de dibujar la figura geométrica
    is_correct: false
  explanation: La alternativa correcta es 'Identificar sin ambigüedad el vértice,
    los lados y la abertura del ángulo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos ángulos adyacentes en la esquina A son $\angle BAC = 30^\circ$
    y $\angle CAD = 45^\circ$, ¿cuánto mide el ángulo total $\angle BAD$?
  choices:
  - text: 75°
    is_correct: true
  - text: 15°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 105°
    is_correct: false
  explanation: La alternativa correcta es '75°', obtenida al sumar $30^\circ + 45^\circ
    = 75^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los símbolos y letras dados en notación de ángulos mediante
  tres puntos con el vértice al centro.'
- 'Paso 2: Ubicar el vértice y los lados correspondientes.'
- 'Paso 3: Realizar las operaciones o mediciones requeridas.'
errores_correccion: Asegúrate de colocar siempre la letra del vértice en la posición
  central al usar la notación de tres puntos en notación de ángulos mediante tres
  puntos con el vértice al centro.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un ángulo en notación de ángulos mediante tres puntos con el vértice
    al centro mide $\alpha = 68^\circ$, ¿cuál es su valor expresado numéricamente?
  alternativas:
  - 68°
  - 78°
  - 58°
  respuesta: 68°
  solucion_pasos:
  - El valor numérico directo es $\alpha = 68^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Qué letra representa el vértice en la notación $\angle ABC$ referente
    a notación de ángulos mediante tres puntos con el vértice al centro?
  alternativas:
  - Letra B
  - Letra A
  - Letra C
  respuesta: Letra B
  solucion_pasos:
  - La letra central B es el vértice del ángulo.
- titulo: ¿Se utiliza la letra del centro para identificar el vértice en notación
    de ángulos mediante tres puntos con el vértice al centro?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la convención universal en geometría.
- titulo: ¿La medida de un ángulo depende del tipo de letra usado para nombrarlo?
  respuesta: 'No'
  solucion_pasos:
  - No, el nombre o símbolo no afecta la abertura geométrica del ángulo.
errores_frecuentes:
- Intercambiar el orden de las letras en la notación confundiendo el vértice.
- Afirmar que medir en sentido antihorario da un resultado negativo.
- Declarar la letra griega que nombra al ángulo con la medida en grados.
- Omitir colocar el símbolo de grados (°) al escribir el resultado.
- Declarar que dos notaciones distintas no pueden referirse al mismo ángulo.
afirmaciones_verdaderas:
- La notación con tres puntos sitúa el vértice en el centro.
- La medición estándar de ángulos en el plano cartesiano se realiza en sentido antihorario.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la notación y propiedades
  de notación de ángulos mediante tres puntos con el vértice al centro con precisión
  en problemas geométricos.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
