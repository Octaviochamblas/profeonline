semantic_id: MAT.ALG.INECUACIONES_LINEALES.DEFINICION
resumen_inicial: 'Definición de inecuación lineal de primer grado: relaciones de orden,
  intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: Muchas situaciones de la vida real no representan igualdades exactas,
  sino límites o condiciones.
explicacion_formal: "### Definición formal\nUna inecuación lineal en una variable\
  \ $x$ es una expresión matemática que se puede reducir a una de las siguientes formas:\
  \ $ax + b < 0$, $ax + b \\le 0$, $ax + b > 0$, o $ax + b \\ge 0$, donde $a$ y $b$\
  \ son números reales y $a \neq 0$.\n\n### Desarrollo didáctico\nResolver una inecuación\
  \ consiste en encontrar todos los valores de $x$ que hacen que la desigualdad sea\
  \ verdadera. A diferencia de las ecuaciones lineales, que usualmente tienen una\
  \ única solución, las inecuaciones lineales tienen como solución un conjunto de\
  \ valores, frecuentemente representado como un intervalo en la recta numérica."
definiciones_clave: '- **Definición de inecuación lineal de primer grado**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a definición de inecuación lineal de primer
  grado.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de definición de
    inecuación lineal de primer grado.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de definición de inecuación lineal de primer
    grado, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
