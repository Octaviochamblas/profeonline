  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar la variable y los coeficientes involucrados en la desigualdad matemática.
- Agrupar los términos con la variable en un lado de la desigualdad y los términos
  constantes en el otro.
- Despejar la variable multiplicando o dividiendo. Recordar que al multiplicar o dividir
  por un número negativo, el sentido de la desigualdad debe invertirse.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en definición de inecuación
  lineal de primer grado.
ejemplos:
- titulo: Modelado de una restricción de presupuesto
  enunciado: Un estudiante tiene $\$5000$ para gastar en cuadernos que cuestan $\$800$
    cada uno. Escriba y resuelva la inecuación que representa la cantidad máxima de
    cuadernos que puede comprar.
  solucion_pasos:
  - Sea $x$ la cantidad de cuadernos.
  - El costo total es $800x$. Este costo no puede superar los $\$5000$, por lo que
    $800x \le 5000$.
  - 'Dividimos por $800$: $x \le \frac{5000}{800} = 6.25$.'
  - Como $x$ debe ser un número entero, la cantidad máxima de cuadernos es $6$.
- titulo: Resolución de una inecuación simple
  enunciado: Resuelva la inecuación $3x - 5 > 10$.
  solucion_pasos:
  - 'Sumamos $5$ a ambos lados: $3x > 15$.'
  - 'Dividimos por $3$ ambos lados (como es positivo, la desigualdad se mantiene):
    $x > 5$.'
  - La solución es el intervalo $(5, \infty)$.
- titulo: ¿Es $x=4$ solución de la inecuación $2x + 1 < 9$?
  respuesta: Falso
  solucion_pasos:
  - 'Sustituimos $x = 4$ en la expresión: $2(4) + 1$.'
  - 'Calculamos el resultado: $8 + 1 = 9$.'
  - 'Evaluamos la desigualdad: $9 < 9$ es una proposición falsa. Por lo tanto, $x=4$
    no es solución.'
- titulo: ¿El intervalo $[-2, \infty)$ es la solución de $-x \le 2$?
  respuesta: Verdadero
  solucion_pasos:
  - Partimos de la inecuación $-x \le 2$.
  - Multiplicamos por $-1$ a ambos lados. Esto invierte el sentido de la desigualdad.
  - Obtenemos $x \ge -2$.
  - En notación de intervalo, todos los números mayores o iguales a $-2$ se representan
    como $[-2, \infty)$.
errores_frecuentes:
- Creer que al multiplicar o dividir ambos lados por un número negativo la dirección
  de la desigualdad se mantiene inalterada.
- Confundir los símbolos de menor estricto ($<$) con menor o igual ($\le$) al interpretar
  resultados o escribir intervalos.
- Pensar que una inecuación lineal siempre tiene una única solución igual que una
  ecuación lineal.
- Asumir que si $x > a$ y $x > b$, la solución es el intervalo entre $a$ y $b$.
- Afirmar que $0x > 5$ tiene solución, en lugar de reconocer que es un conjunto vacío.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  definición de inecuación lineal de primer grado.
