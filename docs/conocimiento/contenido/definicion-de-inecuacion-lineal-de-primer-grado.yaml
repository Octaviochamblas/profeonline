semantic_id: MAT.ALG.INECUACIONES_LINEALES.DEFINICION
resumen_inicial: Una inecuación lineal de primer grado es una desigualdad algebraica donde la incógnita está elevada a la primera potencia.
explicacion_simple: '![Definición de inecuación lineal de primer grado](/static/img/nodos/definicion-de-inecuacion-lineal-de-primer-grado-intro.svg)


  Una **inecuación lineal** es muy parecida a una ecuación de primer grado, pero en lugar de tener un signo igual ($=$), utiliza un símbolo de desigualdad (como $<, >, \le, \ge$).

  Resolverla consiste en encontrar todos los números que hacen verdadera la desigualdad.

  Como resultado, la solución no es un único número, sino todo un rango o intervalo continuo de números reales.'
explicacion_formal: 'Una **inecuación lineal de primer grado** con una incógnita se define como una proposición abierta de la forma:


  $$a x + b \ R \ 0 \quad \text{con } a \neq 0 \quad \text{y } R \in \{<, >, \le, \ge\}$$


  **Desglose de la fórmula:**

  - $x \in \mathbb{R}$: Variable incógnita de grado 1 ($x^1$).

  - $a, b$: Coeficientes reales conocidos con $a \neq 0$.

  - Conjunto Solución $S \subset \mathbb{R}$: Intervalo de números reales que verifican la desigualdad.'
definiciones_clave: '- **Inecuación lineal de primer grado**: Desigualdad algebraica de grado 1 en una sola variable.

  - **Conjunto solución de inecuación**: Subconjunto continuo de $\mathbb{R}$ formado por todos los valores de $x$ que satisfacen la desigualdad.'
propiedades_relaciones: '- **Diferencia con ecuaciones**: Las ecuaciones lineales tienen típicamente 1 única solución puntual; las inecuaciones lineales tienen infinitas soluciones agrupadas en un intervalo.'
ejemplo_guiado:
  enunciado: '![Ejemplo Definición de inecuación lineal de primer grado](/static/img/nodos/definicion-de-inecuacion-lineal-de-primer-grado-ejemplos.svg)


    Verifica si la expresión $3x - 5 \le 10$ es una inecuación lineal, identifica sus miembros y evalúa si $x = 4$ y $x = 6$ pertenecen a sus soluciones.'
  pasos:
  - 'Paso 1: Confirmar la variable $x$ de grado 1 y el símbolo $\le$, validando que es una inecuación lineal.'
  - 'Paso 2: Evaluar para $x = 4$: $3(4) - 5 = 12 - 5 = 7 \le 10$ (VERDADERO $\implies x = 4$ es solución).Paso 3: Evaluar para $x = 6$: $3(6) - 5 = 18 - 5 = 13 \le 10$ (FALSO $\implies x = 6$ no es solución).Paso 4: Concluir que el conjunto solución contiene valores menores o iguales al límite.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué distingue formalmente a una inecuación lineal de primer grado de una ecuación lineal?
  choices:
  - text: Que está unida por un operador de orden ($<, >, \le, \ge$) en lugar del signo de igual ($=$).
    is_correct: true
  - text: Que la incógnita está elevada al cuadrado.
    is_correct: false
  - text: Que nunca tiene solución en los números reales.
    is_correct: false
  - text: Que se compone únicamente de números enteros positivos.
    is_correct: false
  explanation: La alternativa correcta es 'Que está unida por un operador de orden ($<, >, \le, \ge$) en lugar del signo de igual ($=$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar la inecuación $3x - 5 \le 10$ para $x = 4$, ¿cuál es la razón por la que $x = 4$ es una solución válida?
  choices:
  - text: Porque el valor obtenido ($7$) es menor o igual a $10$.
    is_correct: true
  - text: Porque $7$ es exactamente igual a $10$.
    is_correct: false
  - text: Porque $4$ es un número primo.
    is_correct: false
  - text: Porque borra el término independiente.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el valor obtenido ($7$) es menor o igual a $10$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable $x$ y comprobar que su exponente sea 1.'
- 'Paso 2: Identificar el operador de orden de la inecuación.'
- 'Paso 3: Trasponer términos para aislar la variable.'
- 'Paso 4: Expresar el conjunto solución como intervalo.'
errores_correccion: '- **Error común:** Escribir la respuesta de una inecuación como si fuera un número único (ejemplo: escribir ''solución $= 5$'' en vez de $x \le 5$).

  - **Cómo corregirlo:** La solución de una inecuación es un CONJUNTO DE NÚMEROS (intervalo), no un número único.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Una inecuación lineal de primer grado posee como conjunto solución un único número real aislado.
- La expresión $ax + b > 0$ con $a = 0$ constituye una inecuación lineal de primer grado válida en $x$.
- El grado de una inecuación lineal se determina por el número de términos algebraicos presentes en sus miembros.
- Toda desigualdad matemática entre constantes numéricas sin incógnita es una inecuación lineal.
- La inecuación $x^2 + 3x > 0$ es un ejemplo clásico de inecuación lineal de primer grado.
afirmaciones_verdaderas:
- Una inecuación lineal de primer grado es una desigualdad reducible a las formas $ax + b < 0$, $ax + b > 0$, $ax + b \le 0$ o $ax + b \ge 0$ con $a \neq 0$.
- El conjunto solución de una inecuación lineal suele corresponder a un intervalo continuo de números reales.
al_terminar_debes_poder: '**QUÉ:** Definir e identificar la estructura de una inecuación lineal de primer grado.


  **CÓMO:** Reconociendo la forma canónica $ax + b \gtrless 0$ con coeficiente principal $a \neq 0$ y exponente unitario en la incógnita.


  ![Resumen Definición de inecuación lineal de primer grado](/static/img/nodos/definicion-de-inecuacion-lineal-de-primer-grado-resumen.svg)'
