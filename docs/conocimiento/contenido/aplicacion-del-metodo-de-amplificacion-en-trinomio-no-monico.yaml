semantic_id: MAT.ALG.FACTOR_TRINOMIOS.AMPLIFICACION_COMPUESTO
resumen_inicial: La aplicación del método de amplificación en trinomios no mónicos consiste en multiplicar y dividir la expresión
  por el coeficiente principal $a$ para convertirla en una estructura mónica equivalente $(ax)^2 + b(ax) + ac$ y descomponerla
  en factores.
explicacion_simple: "Para factorizar un trinomio difícil como $6x^2 + 11x - 10$ mediante el **Método de Amplificación**:\n\
  - **TÉCNICA DE MULTIPLICAR Y DIVIDIR POR $a$ ($a=6$)**:\n  1. **Multiplica la expresión por $\\frac{6}{6}$**:\n     $$\\\
  frac{6 \\cdot (6x^2 + 11x - 10)}{6} = \\frac{(6x)^2 + 11(6x) - 60}{6}$$\n  2. **Haz un cambio de variable mental $u = 6x$**:\n\
  \     - La parte superior queda: $\\mathbf{u^2 + 11u - 60}$. ¡Ahora es un trinomio mónico!\n  3. **Busca dos números que\
  \ multipliquen $-60$ y sumen $11$**:\n     - Los números son **$+15$ y $-4$** (puesto que $15 \\cdot (-4) = -60$ y $15 -\
  \ 4 = 11$).\n  4. **Factoriza arriba como mónico**:\n     $$\\frac{(6x + 15)(6x - 4)}{6}$$\n  5. **Simplifica dividiendo\
  \ entre 6** (extrayendo factores comunes de cada paréntesis):\n     - Del primer paréntesis $(6x + 15)$ extraes **$3$**\
  \ $\\implies 3(2x + 5)$.\n     - Del segundo paréntesis $(6x - 4)$ extraes **$2$** $\\implies 2(3x - 2)$.\n     - Multiplicas\
  \ los exteriores $3 \\cdot 2 = 6$, ¡que se cancela exactamente con el $6$ del denominador!\n     - **Resultado final**:\
  \ $\\mathbf{(2x + 5)(3x - 2)}$.\n\n![Método de amplificación en trinomio no mónico](/static/img/nodos/aplicacion-del-metodo-de-amplificacion-en-trinomio-no-monico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el trinomio no mónico $P(x) = ax^2 + bx + c \in \mathbb{Z}[x]$ con $a \neq 1$. El **método de amplificación de Krantz**
  aplica la transformación neutra multiplicativa $\frac{a}{a} = 1$:


  $$P(x) = \frac{a(ax^2 + bx + c)}{a} = \frac{(ax)^2 + b(ax) + ac}{a}$$


  ### Factorización del Polinomio Mónico Amplificado

  Definiendo la variable proyectiva $u = ax$, la parte superior se reescribe como el polinomio mónico $Q(u) = u^2 + bu + ac$.
  Si $(r, s) \in \mathbb{Z}^2$ es el par numérico que cumple $r \cdot s = ac$ y $r + s = b$:


  $$Q(u) = (u + r)(u + s) \implies P(x) = \frac{(ax + r)(ax + s)}{a}$$


  ### Cancelación del Denominador por Factores Comunes

  Por la estructura del par numérico, existen divisores $d_1, d_2 \in \mathbb{N}$ tales que $d_1 \cdot d_2 = a$, con $d_1
  \mid (ax + r)$ y $d_2 \mid (ax + s)$, simplificando el denominador $a$ y entregando la forma factorizada entera irreducible
  en $\mathbb{Z}[x]$.


  ### Síntesis didáctica

  Amplificar por $a$ convierte temporalmente un trinomio no mónico en uno mónico estándar para resolverlo por búsqueda del
  par numérico y cancelar al final la constante $a$.

  '
definiciones_clave: '- **Amplificación por $a$**: Multiplicación y división simétrica del polinomio por su coeficiente principal
  $a$.

  - **Variable proyectiva ($u = ax$)**: Sustitución temporal que transforma $(ax)^2 + b(ax) + ac$ en la forma mónica $u^2
  + bu + ac$.

  - **Simplificación del denominador**: Extracción de divisores numéricos comunes en los binomios $(ax+r)$ y $(ax+s)$ para
  eliminar el divisor $a$.

  '
propiedades_relaciones: '- **Invarianza del polinomio**: La amplificación por $\frac{a}{a}$ preserva de forma idéntica el
  valor del polinomio original.

  '
ejemplo_guiado:
  enunciado: Aplica el método de amplificación para factorizar $2x^2 + 7x + 3$.
  pasos:
  - 'Paso 1: Multiplicamos y dividimos por $a = 2$: $\frac{2(2x^2 + 7x + 3)}{2} = \frac{(2x)^2 + 7(2x) + 6}{2}$.'
  - 'Paso 2: Buscamos dos números que multipliquen $6$ y sumen $7$: Los números son **$6$ y $1$** (puesto que $6 \cdot 1 =
    6$ y $6 + 1 = 7$).'
  - 'Paso 3: Factorizamos la parte superior con $u = 2x$: $\frac{(2x + 6)(2x + 1)}{2}$.'
  - 'Paso 4: Extraemos el factor común 2 del primer paréntesis: $\frac{2(x + 3)(2x + 1)}{2}$.'
  - 'Paso 5: Cancelamos el 2 del numerador con el 2 del denominador.'
  - 'Conclusión: La expresión factorizada es **$(x + 3)(2x + 1)$**.'
  imagen: /static/img/nodos/aplicacion-del-metodo-de-amplificacion-en-trinomio-no-monico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la amplificación por $a=3$ al trinomio $3x^2 + 7x + 2$, ¿cómo queda la expresión mónica superior antes
    de simplificar?
  choices:
  - text: Queda $\frac{(3x)^2 + 7(3x) + 6}{3}$, multiplicando $3 \cdot 2 = 6$
    is_correct: true
  - text: Queda $\frac{(3x)^2 + 21x + 6}{3}$
    is_correct: false
  - text: Queda $(3x + 7)^2 + 2$
    is_correct: false
  - text: Queda $9x^2 + 7x + 2$
    is_correct: false
  explanation: 'La alternativa correcta es ''Queda $\frac{(3x)^2 + 7(3x) + 6}{3}$, multiplicando $3 \cdot 2 = 6$''. Amplificación
    por $a$: $\frac{(ax)^2 + b(ax) + ac}{a}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar el denominador en la expresión $\frac{(4x + 8)(4x + 1)}{4}$, ¿cuál es la factorización final resultante?
  choices:
  - text: La factorización es $(x + 2)(4x + 1)$, simplificando el primer paréntesis $(4x + 8)$ por 4
    is_correct: true
  - text: La factorización es $(4x + 8)(x + 1)$
    is_correct: false
  - text: La factorización es $(x + 8)(4x + 1)$
    is_correct: false
  - text: La factorización es $4(x + 2)(4x + 1)$
    is_correct: false
  explanation: 'La alternativa correcta es ''La factorización es $(x + 2)(4x + 1)$, simplificando el primer paréntesis $(4x
    + 8)$ por 4''. Extracción de 4: $\frac{4(x+2)(4x+1)}{4} = (x+2)(4x+1)$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar y dividir todo el trinomio $ax^2 + bx + c$ por el coeficiente principal $a$.'
- 'Paso 2: Escribir el numerador en la forma mónica proyectiva $(ax)^2 + b(ax) + ac$.'
- 'Paso 3: Hallar dos números que multipliquen $ac$ y sumen $b$, armando los binomios $(ax + r)(ax + s)$.'
- 'Paso 4: Extraer factores comunes de los binomios para cancelar exactamente el denominador $a$.'
errores_correccion: '- **Error 1:** Excluir la división por el coeficiente $a$ al finalizar la amplificación (dejar el resultado
  como $(ax+r)(ax+s)$). **Cómo corregirlo:** La amplificación **EXIGE CANCELAR EL DENOMINADOR $a$ DIVIDIENDO LOS FACTORES
  COMUNES DE LOS PARÉNTESIS**.

  - **Error 2:** Multiplicar el coeficiente central $b$ por $a$ en lugar de mantenerlo fuera del paréntesis $b(ax)$. **Cómo
  corregirlo:** El término central **MANTIENE EL COEFICIENTE $b$ MULTIPLICANDO A LA NUEVA VARIABLE $(ax)$, ES DECIR $b(ax)$**.

  '
ejemplos:
- titulo: Multiplicación por a
  enunciado: Para $2x^2 + 5x + 3$, ¿es la forma amplificada $\frac{(2x)^2 + 5(2x) + 6}{2}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a \cdot c = 2 \cdot 3 = 6$.
- titulo: Par numérico en amplificación
  enunciado: Para $u^2 + 5u + 6$, ¿son los números $r = 3$ y $s = 2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot 2 = 6$ y $3 + 2 = 5$.
- titulo: Cancelación del 2
  enunciado: En $\frac{(2x + 2)(2x + 3)}{2}$, ¿simplifica el factor 2 de $(2x + 2)$ dando $(x + 1)(2x + 3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{2(x+1)(2x+3)}{2} = (x+1)(2x+3)$.
- titulo: Conservación del término central
  enunciado: ¿Mantiene $7(3x)$ el coeficiente $7$ libre fuera de la nueva variable $3x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $7(3x)$ preserva el coeficiente $b=7$.
errores_frecuentes:
- La simplificación o cancelación del denominador a no se realiza en el paso final del método de amplificación.
- Multiplicar por a el coeficiente central b dentro de la expresión en lugar de expresarlo como b(ax).
- Simplificar mal los coeficientes de los binomios al cancelar el denominador.
- Intercambiar las raíces del par numérico r y s al escribirlas dentro de los paréntesis con ax.
- Olvidar extraer el factor común numérico de cada paréntesis.
afirmaciones_verdaderas:
- El método de amplificación multiplica y divide por $a$ para convertir $ax^2 + bx + c$ en la forma mónica $(ax)^2 + b(ax)
  + ac$.
- El denominador $a$ se cancela obligatoriamente extrayendo factores comunes numéricos de los binomios resultantes.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/aplicacion-del-metodo-de-amplificacion-en-trinomio-no-monico-resumen.svg)


  QUÉ: Aplicar el método de amplificación para factorizar cualquier trinomio cuadrático no mónico ax² + bx + c.

  CÓMO: Multiplicar y dividir por $a$ obteniendo $\frac{(ax)^2 + b(ax) + ac}{a}$, factorizar la forma mónica proyectiva $(ax
  + r)(ax + s)$ y simplificar el divisor $a$ extrayendo factores comunes numéricos.

  '
