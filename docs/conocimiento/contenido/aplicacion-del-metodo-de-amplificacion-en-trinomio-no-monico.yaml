semantic_id: MAT.ALG.FACTOR_TRINOMIOS.AMPLIFICACION_COMPUESTO
resumen_inicial: 'Aplicación del método de amplificación en trinomio no mónico: concepto,
  método de descomposición y reglas en Factorización de trinomios cuadráticos.'
explicacion_simple: Si un problema es muy difícil, a veces es mejor 'disfrazarlo'
  de uno fácil. El método de amplificación toma un trinomio rebelde (con a distinto
  de 1) y lo disfraza multiplicándolo por sí mismo hasta que parece un trinomio simple
  y amigable.
explicacion_formal: '### Definición formal


  Dejar $b(ax)$ nos permite tratar a $(ax)$ como una variable ''U'' y aplicar el método
  simple.


  ### Desarrollo didáctico


  Resolvamos $3x^2 + 14x + 8$.

  Multiplicamos todo el polinomio por 3, y para no alterar su valor, dividimos todo
  entre 3:

  $\frac{3(3x^2 + 14x + 8)}{3}$


  Al multiplicar el numerador, el truco es NO multiplicar el término del medio. Lo
  reordenamos:

  $\frac{(3x)^2 + 14(3x) + 24}{3}$


  Fíjate bien. Si llamas a $(3x)$ como si fuera una nueva letra $U$, te queda:

  $U^2 + 14U + 24$

  Esto es un trinomio simple. Buscamos dos números que multipliquen 24 y sumen 14.
  Son 12 y 2.


  Factorizamos arriba: $\frac{(3x + 12)(3x + 2)}{3}$.

  Por último, debemos eliminar el 3 del denominador. Para eso, sacamos factor común
  3 del primer paréntesis: $3(x + 4)$.

  $\frac{3(x + 4)(3x + 2)}{3}$. Cancelamos los 3 y listo. Nos queda $(x + 4)(3x +
  2)$.'
definiciones_clave: '- **Aplicación del método de amplificación en trinomio no mónico**:
  Técnica de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en aplicación del método de amplificación en
  trinomio no mónico.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de aplicación
    del método de amplificación en trinomio no mónico.
  pasos:
  - Identificar la estructura o los factores comunes en los términos del polinomio.
  - Aplicar la regla o método correspondiente a aplicación del método de amplificación
    en trinomio no mónico.
  - Expresar el polinomio como un producto de dos o más factores.
  - Verificar multiplicando los factores resultantes.
