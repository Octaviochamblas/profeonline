resumen_inicial: La aplicación del método de amplificación en un trinomio no mónico
  multiplica y divide la expresión por $a$ para transformarla temporalmente en un
  trinomio mónico de variable $u = ax$.
explicacion_simple: 'Para factorizar $6x^2 + 11x + 4$, el truco consiste en multiplicar
  todo por $6$ para tener $(6x)^2 + 11(6x) + 24$. Al llamar $u = 6x$, el trinomio
  se vuelve mónico en $u$: $u^2 + 11u + 24$. ¡Así es facilísimo de factorizar!'
explicacion_formal: 'Sea $P(x) = ax^2 + bx + c$ con $a \neq 1$. El **Método de Amplificación
  y Cambio de Variable** establece la identidad algebrica de preservación cuantitativa:


  $$P(x) = \frac{a(ax^2 + bx + c)}{a} = \frac{(ax)^2 + b(ax) + ac}{a}$$


  **Desglose simbólico:**

  - Sustitución de variable: Sea $u = ax \implies P(u) = \frac{u^2 + bu + ac}{a}$.

  - $u^2 + bu + ac$: Trinomio mónico auxiliar en la variable $u$.

  - Par numérico $(r, s)$: Satisface $r+s=b$ y $r \cdot s = ac$.

  - Expresión auxiliar factorizada: $\frac{(u + r)(u + s)}{a} = \frac{(ax + r)(ax
  + s)}{a}$.


  > **Complemento didáctico:** Evita el método del ensayo y error al convertir el
  problema en la búsqueda estándar de un par mónico.'
definiciones_clave: '- **Amplificación algebraica**: Multiplicación y división simultánea
  por una misma constante no nula $a$.

  - **Variable auxiliar $u$**: Sustitución $u = ax$ que otorga monisidad a la expresión
  cuadrática.'
propiedades_relaciones: '- **Preservación del valor**: Dividir por $a$ al final cancela
  exactamente el factor de amplificación introducido al inicio.'
ejemplo_guiado:
  enunciado: Aplique la amplificación por $a=6$ al trinomio $6x^2 + 11x + 4$ para
    convertirlo en un trinomio mónico auxiliar.
  pasos:
  - 'Paso 1: Identificar $a = 6$, $b = 11$, $c = 4$.'
  - 'Paso 2: Multiplicar y dividir todo el polinomio por $6$: $\frac{6(6x^2 + 11x
    + 4)}{6}$.'
  - 'Paso 3: Reescribir el numerador agrupando $(6x)$: $\frac{(6x)^2 + 11(6x) + 24}{6}$.'
  - 'Paso 4: Definir la variable auxiliar $u = 6x$: Obteniendo el numerador mónico
    $u^2 + 11u + 24$.'
  - 'Paso 5: Buscar el par numérico para $u^2 + 11u + 24$: Números que sumen $11$
    y multipliquen $24$: $r = 8$ y $s = 3$.'
  - 'Conclusión: La forma amplificada factorizada es $\frac{(6x + 8)(6x + 3)}{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es indispensable dividir por $a$ al final del proceso de amplificación
    en un trinomio no mónico?
  choices:
  - text: Para compensar la multiplicación por $a$ realizada al inicio y conservar
      el valor original
    is_correct: true
  - text: Para eliminar la variable $x$ de la expresión
    is_correct: false
  - text: Para transformar el resultado en una fracción irreductible
    is_correct: false
  - text: Porque así lo exige la regla de los signos
    is_correct: false
  explanation: La alternativa correcta es 'Para compensar la multiplicación por $a$
    realizada al inicio y conservar el valor original'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al amplificar $6x^2 + 11x + 4$ por $a=6$, ¿cuál es el trinomio mónico
    auxiliar $u^2 + bu + ac$ obtenido en términos de $u = 6x$?
  choices:
  - text: $u^2 + 11u + 24$
    is_correct: true
  - text: $u^2 + 66u + 24$
    is_correct: false
  - text: $u^2 + 11u + 4$
    is_correct: false
  - text: $u^2 + 6u + 24$
    is_correct: false
  explanation: La alternativa correcta es '$u^2 + 11u + 24$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar y dividir la expresión cuadrática no mónica por el coeficiente
  principal $a$.'
- 'Paso 2: Expresar el numerador como un trinomio mónico auxiliar en la variable $u
  = ax$ con término constante $a \cdot c$.'
- 'Paso 3: Hallar el par numérico $(r, s)$ para la variable $u$ y escribir $\frac{(ax
  + r)(ax + s)}{a}$.'
errores_correccion: '- **Error 1: Multiplicar también el término lineal $b$ por $a$
  deshaciendo la agrupación $(ax)$.** **Cómo corregirlo:** El término lineal DEBE
  expresarse como $b(ax)$, dejando el coeficiente $b$ inalterado por fuera.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al amplificar $2x^2 + 7x + 3$ por $a=2$, ¿cuál es la estructura auxiliar
    obtenida?
  alternativas:
  - $\frac{(2x)^2 + 7(2x) + 6}{2}$
  - $\frac{(2x)^2 + 14(2x) + 6}{2}$
  - $\frac{4x^2 + 7x + 6}{2}$
  respuesta: $\frac{(2x)^2 + 7(2x) + 6}{2}$
  solucion_pasos:
  - '1. Amplificación por 2: $(2x)^2 + 7(2x) + 6$, todo dividido por 2.'
- titulo: Ejemplo 2
  enunciado: Para $u^2 + 7u + 6$ con $u = 2x$, ¿cuál es el par numérico que suma 7
    y multiplica 6?
  alternativas:
  - $(6, 1)$
  - $(3, 2)$
  - $(5, 2)$
  respuesta: $(6, 1)$
  solucion_pasos:
  - 1. $6 + 1 = 7$ y $6 \cdot 1 = 6$.
- titulo: ¿La sustitución $u = ax$ convierte el trinomio no mónico en un trinomio
    mónico auxiliar de la forma $u^2 + bu + ac$?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite usar el algoritmo simple sobre $u$.
- titulo: ¿Se puede omitir la división por $a$ al finalizar la amplificación?
  respuesta: 'No'
  solucion_pasos:
  - No, omitir la división alteraría el valor cuantitativo por un factor de $a$.
errores_frecuentes:
- Entregar como resultado la expresión amplificada sin dividir por $a$, obteniendo
  un valor $a$ veces más grande.
- Multiplicar el coeficiente lineal $b$ dentro del paréntesis alterando el valor $b(ax)$
  a $(ab)x$.
- Declarar que la amplificación cambia las raíces de la ecuación cuadrática original.
- Elevar al cuadrado el coeficiente $b$ al realizar la sustitución de variable $u
  = ax$.
- Dividir únicamente uno de los sumandos por $a$ en lugar de toda la expresión numerador.
afirmaciones_verdaderas:
- El método de amplificación transforma el trinomio no mónico en un trinomio mónico
  equivalente en $u = ax$.
- La división por $a$ restaura la equivalencia algebraica exacta con el polinomio
  original.
al_terminar_debes_poder: Al terminar serás capaz de aplicar el método de amplificación
  y cambio de variable para estructurar la factorización no mónica.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / Factorización de Trinomios.
