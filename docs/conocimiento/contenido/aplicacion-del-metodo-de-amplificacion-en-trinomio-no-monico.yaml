procedimiento:
- 'Paso 1: Multiplica y divide el trinomio por el coeficiente ''a'' (el número que
  acompaña a la $x^2$).'
- 'Paso 2: Desarrolla el numerador dejando indicado el término central: $(ax)^2 +
  b(ax) + ac$.'
- 'Paso 3: Factoriza el numerador buscando dos números que multipliquen ''ac'' y sumen
  ''b''.'
- 'Paso 4: Escribe los paréntesis $(ax + \text{num1})(ax + \text{num2})$.'
- 'Paso 5: Extrae un factor común de los paréntesis (puede ser en uno o en ambos)
  para simplificar y eliminar el denominador ''a''.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en aplicación del método de amplificación en trinomio no mónico.
ejemplos:
- titulo: Factoriza $2x^2 + 5x + 3$
  enunciado: Factoriza $2x^2 + 5x + 3$.
  solucion_pasos:
  - 'Amplificamos por 2: $\frac{(2x)^2 + 5(2x) + 6}{2}$.'
  - 'Dos números que den 6 multiplicados y 5 sumados: 2 y 3.'
  - 'Numerador: $(2x+2)(2x+3)$.'
  - 'Extraemos factor común 2 del primer paréntesis: $2(x+1)$.'
  - 'Cancelamos el /2. Resultado: $(x+1)(2x+3)$.'
- titulo: Factoriza $5x^2 - 13x - 6$.
  solucion_pasos:
  - 'Amplificamos por 5. Numerador: $(5x)^2 - 13(5x) - 30$. Números: -15 y +2. Queda
    $(5x-15)(5x+2) / 5$. Simplificando el primer paréntesis queda $(x-3)$.'
- titulo: 'Respecto de «Aplicación del método de amplificación en trinomio no mónico»:
    ¿Se ajusta a la'
  enunciado: 'Respecto de «Aplicación del método de amplificación en trinomio no mónico»:
    ¿Se ajusta a la definición esta afirmación? «El método consiste en multiplicar
    todo el polinomio $ax^2 + bx + c$ por ''$a$'' y dividirlo por ''$a$''»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El método consiste en multiplicar
    todo el polinomio $ax^2 + bx + c$ por ''$a$'' y dividirlo por ''$a$''.'
- titulo: 'Respecto de «Aplicación del método de amplificación en trinomio no mónico»:
    ¿Es compatible c'
  enunciado: 'Respecto de «Aplicación del método de amplificación en trinomio no mónico»:
    ¿Es compatible con el procedimiento esta afirmación? «Multiplicar el término central
    y perder la estructura $(ax)$. (Ej: Escribir $42x$ en vez de $14(3x)$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El método consiste en multiplicar
    todo el polinomio $ax^2 + bx + c$ por ''$a$'' y dividirlo por ''$a$''.'
errores_frecuentes:
- 'Multiplicar el término central y perder la estructura $(ax)$. (Ej: Escribir $42x$
  en vez de $14(3x)$).'
- Olvidar dividir por 'a' y quedarse con una factorización amplificada que no equivale
  al polinomio original.
- Para «¿Cuál es el propósito de NO multiplicar directamente el coeficiente central
  al usar este método», la respuesta correcta es Por pereza mental.
- Porque daría un número negativo.
- Para «¿Cuál es el propósito de NO multiplicar directamente el coeficiente central
  al usar este método», la respuesta correcta es Para que se cancele con el denominador.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
