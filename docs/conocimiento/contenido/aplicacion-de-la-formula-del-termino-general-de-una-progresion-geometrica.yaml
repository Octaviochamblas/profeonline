semantic_id: MAT.NUM.PROG_GEOMETRICA.TERMINO_GENERAL
resumen_inicial: 'Aplicación de la fórmula del término general de una progresión geométrica:
  concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: Si un rumor empieza contigo y se lo cuentas a 3 personas, y cada
  uno a otras 3... ¿cuántos sabrán el rumor en el paso 10? No puedes sumar. Aquí los
  saltos son exponentes. Bienvenido al término general geométrico.
explicacion_formal: 'Anatomía de la fórmula: **$a_n = a_1 \cdot r^{(n - 1)}$**

  - **$a_n$**: Es el número gigante o pequeñito que quieres descubrir.

  - **$a_1$**: Es tu punto de inicio.

  - **$r$**: Es el multiplicador (la razón).

  - **$(n - 1)$**: Es la cantidad de saltos que darás. Como empezamos en el salto
  cero (la posición 1), el exponente siempre es uno menos que la posición.


  Ejemplo: Tienes la progresión $2, 6, 18\dots$ y te piden el término 5.

  - $a_1 = 2$

  - $r = 3$ (porque $6/2=3$)

  - $n = 5$

  Fórmula: $a_5 = 2 \cdot 3^{(5 - 1)} \rightarrow 2 \cdot 3^4 \rightarrow 2 \cdot
  81 = 162$.'
definiciones_clave: '- **Aplicación de la fórmula del término general de una progresión
  geométrica**: Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Aplicación de la fórmula del término general
