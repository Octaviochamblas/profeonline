procedimiento:
- 'Paso 1: Extrae a1 (el primer término).'
- 'Paso 2: Calcula la razón ''r'' dividiendo el 2do por el 1ro.'
- 'Paso 3: Identifica la posición ''n''.'
- 'Paso 4: Eleva ''r'' a la potencia $(n-1)$.'
- 'Paso 5: Multiplica ese resultado por $a_1$.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en aplicación de la fórmula del término general de una progresión geométrica.
ejemplos:
- titulo: Plegando el papel
  enunciado: Doblas una hoja de papel por la mitad. Luego otra vez. El grosor inicial es 0.1
    mm y se duplica en cada doblez. ¿Cuál será el grosor en el doblez número 7?
  solucion_pasos:
  - a1 = 0.1 mm. r = 2. n = 7.
  - 'Fórmula: a7 = 0.1 * 2^(7-1)'
  - a7 = 0.1 * 2^6
  - 2^6 = 64.
  - a7 = 0.1 * 64 = 6.4 mm.
- titulo: Ejemplo 1
  enunciado: Si a_1 es 5 y r es 2, ¿cuánto vale a_4?
  alternativas:
  - '40'
  - '20'
  - '80'
  respuesta: '40'
  solucion_pasos:
  - 5 por 2 elevado a 3 es igual a 5 por 8, o sea 40.
- titulo: Ejemplo 2
  enunciado: En la progresión 2, 10, 50, ¿cuál es a_5?
  alternativas:
  - '1250'
  - '250'
  - '6250'
  respuesta: '1250'
  solucion_pasos:
  - a_1 es 2 y r es 5; 2 por 5 elevado a 4 es igual a 2 por 625, o sea 1250.
- titulo: ¿Se puede aplicar la fórmula del término general sin conocer la razón r?
  respuesta: 'No'
  solucion_pasos:
  - r es uno de los tres datos indispensables, junto a a_1 y n.
- titulo: ¿El exponente de r en la fórmula del término general es igual a n?
  respuesta: 'No'
  solucion_pasos:
  - El exponente siempre es (n menos 1), no n directamente.
errores_frecuentes:
- 'Multiplicar $a_1$ por ''$r$'' ANTES de elevar al exponente. Por ejemplo, en $2 \cdot 3^4$,
  multiplicar $6^4$ (incorrecto) en vez de $2 \cdot 81$ (correcto). ¡Papomudas: potencias
  primero!'
- Olvidar restar 1 al exponente (usar $r^n$ en lugar de $r^{n-1}$).
- Elevar la razón a n en vez de a (n menos 1).
- Multiplicar a_1 por r antes de elevar al exponente, en vez de resolver primero la potencia.
- Confundir la razón r con el primer término a_1 al identificar los datos.
afirmaciones_verdaderas:
- La formulación de aplicación de la fórmula del término general de una progresión geométrica
  mantiene la regularidad de la sucesión.
- En la fórmula del término general de una progresión geométrica, la razón siempre se eleva
  a (n menos 1), nunca a n directamente.
