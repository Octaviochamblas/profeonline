semantic_id: MAT.NUM.PROG_GEOMETRICA.TERMINO_GENERAL
resumen_inicial: 'La fórmula del término general de una progresión geométrica es $a_n = a_1 \cdot r^{n-1}$, la cual calcula directamente el valor del término en la posición $n$ conociendo el primer término $a_1$ y la razón geométrica $r$.'
explicacion_simple: |
  Para hallar cualquier término de una progresión geométrica (por ejemplo, el término $10$) sin tener que multiplicar uno a uno:
  - Partes desde el **primer término ($a_1$)**.
  - Como para llegar a la casilla $n$ debes multiplicar por la razón $r$ exactamente **$(n - 1)$ veces**, elevas la razón a la potencia $(n - 1)$.
  - La fórmula es:
    $$a_n = a_1 \cdot r^{n-1}$$
  Por ejemplo, si $a_1 = 5$ y $r = 2$, para saber el término $a_6$:
  $a_6 = 5 \cdot 2^{6-1} = 5 \cdot 2^5 = 5 \cdot 32 = 160$.
explicacion_formal: |
  ### Definición formal
  El **término $n$-ésimo de una progresión geométrica** de primer término $a_1 \in \mathbb{R} \setminus \{0\}$ y razón $r \in \mathbb{R} \setminus \{0\}$ viene dado por la ecuación exponencial discreta:
  $$a_n = a_1 \cdot r^{n-1} \quad (\forall n \in \mathbb{N})$$

  ### Demostración inductiva por producto continuado
  - $a_1 = a_1 \cdot r^0 = a_1 \cdot 1$
  - $a_2 = a_1 \cdot r^1$
  - $a_3 = a_2 \cdot r = (a_1 \cdot r) \cdot r = a_1 \cdot r^2$
  - $\dots$
  - $a_n = a_1 \cdot r^{n-1}$

  ### Generalización entre posiciones arbitrarias
  Para cualquier par de posiciones $n$ y $k$:
  $$a_n = a_k \cdot r^{n-k}$$

  ### Síntesis didáctica
  - Ecuación canónica: $a_n = a_1 \cdot r^{n-1}$.
  - Exponente de la razón: Siempre equivale al número de posición menos 1 ($(n - 1)$).
definiciones_clave: |
  - **Fórmula del término general de P.G.**: $a_n = a_1 \cdot r^{n-1}$.
  - **Exponente posicional ($(n-1)$)**: Cantidad de factores de multiplicación acumulados desde $a_1$.
  - **Potencia de la razón ($r^{n-1}$)**: Factor de escala que amplifica o reduce el término inicial $a_1$.
propiedades_relaciones: |
  - **Crecimiento exponencial discreto**: El término $a_n$ varía en función exponencial del subíndice de posición $n$.
  - **Prioridad de operaciones**: Al calcular $a_1 \cdot r^{n-1}$, primero se debe resolver la potencia $r^{n-1}$ y posteriormente multiplicar por el coeficiente $a_1$.
ejemplo_guiado:
  enunciado: 'Dada la progresión geométrica $3, 6, 12, 24, \dots$, determina la fórmula de su término general $a_n$ y calcula el valor del término en la posición $n=8$.'
  pasos:
    - 'Paso 1: Identificamos el primer término $a_1 = 3$ y la razón $r = \frac{6}{3} = 2$.'
    - 'Paso 2: Escribimos la fórmula del término general: $a_n = 3 \cdot 2^{n-1}$.'
    - 'Paso 3: Para hallar $a_8$, sustituimos $n=8$: $a_8 = 3 \cdot 2^{8-1} = 3 \cdot 2^7$.'
    - 'Paso 4: Evaluamos la potencia $2^7 = 128$ y multiplicamos: $a_8 = 3 \cdot 128 = 384$. El octavo término es **$384$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué en la fórmula del término general de una P.G. ($a_n = a_1 \cdot r^{n-1}$) la razón $r$ está elevada a la potencia $(n - 1)$?'
    choices:
      - {text: 'Porque para llegar a la casilla $n$ desde la primera casilla se multiplica por la razón exactamente $(n - 1)$ veces', is_correct: true}
      - {text: 'Porque se debe restar 1 al exponente por regla de los números negativos', is_correct: false}
      - {text: 'Porque el primer término siempre es igual a 1', is_correct: false}
      - {text: 'Porque la razón es la mitad del primer término', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque para llegar a la casilla $n$ desde la primera casilla se multiplica por la razón exactamente $(n - 1)$ veces''. De $a_1$ a $a_n$ hay $n-1$ pasos multiplicativos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una progresión geométrica $a_1 = 5$ y $r = 3$, ¿cuál es el valor del cuarto término ($a_4$)?'
    choices:
      - {text: '$a_4 = 135$, calculando $5 \cdot 3^{4-1} = 5 \cdot 3^3 = 5 \cdot 27 = 135$', is_correct: true}
      - {text: '$a_4 = 405$, elevando a la potencia 4 en vez de 3', is_correct: false}
      - {text: '$a_4 = 60$, multiplicando $(5 \cdot 3) \cdot 4$', is_correct: false}
      - {text: '$a_4 = 45$, multiplicando $5 \cdot 9$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_4 = 135$, calculando $5 \cdot 3^{4-1} = 5 \cdot 3^3 = 5 \cdot 27 = 135$''. $5 \cdot 27 = 135$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$ y la razón geométrica $r$.'
  - 'Paso 2: Escribir la fórmula canónica $a_n = a_1 \cdot r^{n-1}$.'
  - 'Paso 3: Sustituir la posición $n$ requerida y restar $1$ al exponente para obtener $(n - 1)$.'
  - 'Paso 4: Resolver la potencia $r^{n-1}$ en primer lugar y multiplicar por $a_1$ para obtener el valor del término.'
errores_correccion: |
  - **Error 1:** Multiplicar $a_1 \cdot r$ antes de elevar a la potencia $(n-1)$ (ej: en $5 \cdot 2^{n-1}$, calcular $(5 \cdot 2)^{n-1} = 10^{n-1}$). **Cómo corregirlo:** La jerarquía de operaciones exige **evaluar la POTENCIA $r^{n-1}$ primero**, y al final multiplicar por $a_1$.
  - **Error 2:** Usar la posición $n$ como exponente en lugar de $(n-1)$ (ej: escribir $a_n = a_1 \cdot r^n$). **Cómo corregirlo:** El exponente correcto es **$(n-1)$**: $a_n = a_1 \cdot r^{n-1}$.
ejemplos:
  - titulo: 'Cálculo de a5 en P.G.'
    enunciado: 'Para $a_1 = 4$ y $r = 3$, ¿el término $a_5$ es $324$?'
    alternativas:
      - 'Sí, pues $4 \cdot 3^4 = 4 \cdot 81 = 324$'
      - 'No, es $972$'
      - 'No, es $120$'
    respuesta: 'Sí, pues $4 \cdot 3^4 = 4 \cdot 81 = 324$'
    solucion_pasos:
      - '1. $a_5 = 4 \cdot 3^{5-1} = 4 \cdot 3^4$.'
      - '2. $3^4 = 81 \implies 4 \cdot 81 = 324$.'
  - titulo: 'Cálculo de a6 con razón fraccionaria'
    enunciado: 'Para $a_1 = 64$ y $r = 1/2$, ¿el término $a_6$ es $64 \cdot (1/2)^5 = 64 \cdot (1/32) = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $64 \cdot (1/32) = 2$.'
  - titulo: 'Cálculo de a4 con razón negativa'
    enunciado: 'Para $a_1 = 3$ y $r = -2$, ¿el término $a_4$ es $3 \cdot (-2)^3 = 3 \cdot (-8) = -24$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Un exponente impar mantiene el signo negativo: $-24$.'
  - titulo: 'Término a10 con razón 1'
    enunciado: 'Para $a_1 = 9$ y $r = 1$, ¿$a_{10} = 9 \cdot 1^9 = 9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $9 \cdot 1 = 9$.'
errores_frecuentes:
  - 'Multiplicar el primer término por la razón antes de calcular la elevación a la potencia.'
  - 'Una razón geométrica menor que 1 genera términos negativos en la secuencia.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Colocar la posición $n$ como exponente sin restar 1 en la fórmula del término general.'
  - 'Invertir el signo de la base de la potencia al trabajar con razones negativas elevadas a exponentes pares.'
afirmaciones_verdaderas:
  - 'La fórmula del término general de una progresión geométrica es $a_n = a_1 \cdot r^{n-1}$.'
  - 'En la evaluación de $a_n = a_1 \cdot r^{n-1}$, se resuelve primero la potencia $r^{n-1}$ antes de multiplicar por el término inicial $a_1$.'
