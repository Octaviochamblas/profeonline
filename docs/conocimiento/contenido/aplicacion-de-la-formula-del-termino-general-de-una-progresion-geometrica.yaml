resumen_inicial: 'La fórmula del término general de una progresión geométrica $a_n$
  permite calcular cualquier posición en función del primer término $a_1$ y la razón
  $r$: $a_n = a_1 \cdot r^{n-1}$.'
explicacion_simple: 'Para calcular cualquier término de una progresión geométrica
  sin multiplicar uno por uno, usamos la fórmula: al primer número lo multiplicamos
  por la razón elevada a la cantidad de saltos $(n - 1)$.'
explicacion_formal: 'Para una P.G. con primer término $a_1$ y razón $r$, la **Fórmula
  del Término General $a_n$** es:


  $$a_n = a_1 \cdot r^{n-1}$$


  **Fórmula generalizada respecto a la posición $m$:**

  $$a_n = a_m \cdot r^{n-m}$$'
definiciones_clave: '- **Término general P.G. $a_n$**: Expresión $a_n = a_1 \cdot
  r^{n-1}$.'
propiedades_relaciones: '- **Función exponencial discreta**: Corresponde a una curva
  exponencial $f(n) = \left(\frac{a_1}{r}\right) \cdot r^n$ de dominio entero.'
ejemplo_guiado:
  enunciado: En una P.G. con primer término $a_1 = 3$ y razón $r = 2$, halle el octavo
    término $a_8$.
  pasos:
  - 'Paso 1: Escribir la fórmula: $a_8 = a_1 \cdot r^{8-1} = 3 \cdot 2^7$.'
  - 'Paso 2: Calcular la potencia de base 2: $2^7 = 128$.'
  - 'Paso 3: Multiplicar: $a_8 = 3 \cdot 128 = 384$.'
  - 'Conclusión: El octavo término es $a_8 = 384$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula del término general an de una progresión geométrica?
  choices:
  - text: an = a1 · r^(n - 1)
    is_correct: true
  - text: an = a1 + (n - 1)r
    is_correct: false
  - text: an = a1 · r^n
    is_correct: false
  - text: an = (a1 · r) / n
    is_correct: false
  explanation: La alternativa correcta es 'an = a1 · r^(n - 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a1 = 3 y r = 2, ¿cuál fue el octavo término
    a8?
  choices:
  - text: '384'
    is_correct: true
  - text: '256'
    is_correct: false
  - text: '768'
    is_correct: false
  - text: '128'
    is_correct: false
  explanation: La alternativa correcta es '384'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de aplicar la fórmula del término
  general $a_n = a_1 \cdot r^{n-1}$ para calcular cualquier posición exponencial.
semantic_id: MAT.NUM.PROG_GEOMETRICA.TERMINO_GENERAL
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una razón multiplicativa constante
  $r = \frac{a_{n+1}}{a_n}$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 \cdot r^{n-1}$ o de la
  suma $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
- 'Paso 3: Resolver numéricamente o con logaritmos el parámetro solicitado ($a_n,
  a_1, r, n$ o $S_n$).'
errores_correccion: '- **Error 1: Elevar la razón $r$ a la potencia $n$ en lugar de
  $(n-1)$ en el término general ($a_n = a_1 \cdot r^n$).** **Cómo corregirlo:** La
  razón $r$ se aplica a partir de la segunda posición, por lo que el exponente correcto
  es $(n-1)$.


  - **Error 2: Usar la fórmula de la suma de progresión aritmética en una progresión
  geométrica.** **Cómo corregirlo:** En la P.G. la suma DEBE utilizar el factor multiplicativo
  $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_GEOMETRICA.TERMINO_GENERAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión geométrica.
- titulo: Ejemplo 2
  enunciado: Verificación de la razón constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} / a_n = r$.
- titulo: ¿Es constante el cociente entre términos consecutivos en una P.G.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión geométrica.
- titulo: ¿Corresponde la P.G. a una función exponencial discreta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a_n = a_1 \cdot r^{n-1}$ es una potencia de base $r$.
errores_frecuentes:
- Elevar la razón r al exponente n en lugar de multiplicar por r^(n-1) al calcular
  an.
- Restar los términos en lugar de calcular el cociente de división para determinar
  la razón r.
- Usar la fórmula del promedio de Gauss propia de la progresión aritmética en una
  progresión geométrica.
- Declarar que una razón geométrica menor que 1 genera términos negativos en la secuencia.
- Declarar la razón porcentual P% con el factor multiplicativo r = 1 + P/100.
afirmaciones_verdaderas:
- Una progresión geométrica tiene una razón constante $r = \frac{a_{n+1}}{a_n}$ entre
  términos consecutivos.
- El término general de una P.G. se calcula mediante la función exponencial $a_n =
  a_1 \cdot r^{n-1}$.
