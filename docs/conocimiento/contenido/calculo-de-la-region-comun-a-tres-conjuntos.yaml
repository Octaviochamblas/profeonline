errores_frecuentes:
- La afirmación de que la triple intersección puede calcularse sumando directamente las tres intersecciones de pares.
- La afirmación de que la cardinalidad de la triple intersección puede superar a una de las intersecciones dobles.
- La afirmación de que en el despeje de Poincaré los signos de las sumas individuales y dobles no se invierten.
- La afirmación de que la región central no afecta el cálculo de las regiones individuales.
- La afirmación de que la triple intersección es igual a cero si los conjuntos son no vacíos.
afirmaciones_verdaderas:
- La cardinalidad de la triple intersección central se despeja de la fórmula de Poincaré como $|A \cap B \cap C| = |A \cup B \cup C| - \sum |A_i| + \sum |A_i \cap A_j|$.
- La cardinalidad de la triple intersección está estrictamente acotada superiormente por el mínimo de las cardinalidades de las intersecciones dobles ($\min_{i < j} |A_i \cap A_j|$).
al_terminar_debes_poder: 'QUÉ: Despejar, calcular y verificar la cardinalidad de la región común a tres conjuntos ($|A \cap B \cap C|$).

  CÓMO: Aplicar el despeje de la fórmula de Poincaré ($|\text{Unión}| - S_1 + S_2$) y validar mediante las cotas superiores de intersecciones dobles.


