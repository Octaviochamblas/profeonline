    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Triple intersección vacía
  enunciado: Si Unión $= 55, S_1 = 80, S_2 = 25$, ¿cuánto vale la triple?
  respuesta: $0$
  solucion_pasos:
  - $55 - 80 + 25 = 0$, los tres conjuntos no tienen ningún elemento común simultáneo.
