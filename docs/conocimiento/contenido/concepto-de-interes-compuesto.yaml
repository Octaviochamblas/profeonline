  QUÉ: Comprender y calcular el monto acumulado por interés compuesto mediante el principio de capitalización periódica.
  CÓMO: Aplicar la función exponencial discreta $M = C \cdot (1 + i)^n$, evaluando el factor de acumulación potenciado al número de períodos $n$.
