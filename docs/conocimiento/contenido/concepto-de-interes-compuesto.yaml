resumen_inicial: 'El interés compuesto es el régimen de capitalización donde los intereses
  generados al final de cada período se suman al capital inicial, acumulándose como
  base para calcular nuevos intereses en el siguiente período: $M = C \cdot (1 + i)^n$.'
explicacion_simple: 'En el interés compuesto, los intereses que ganas en un mes o
  año se suman al capital para generar aún más intereses en el período siguiente.
  Es el famoso efecto bola de nieve: tu dinero crece cada vez más rápido porque estás
  ganando intereses sobre los intereses acumulados.'
explicacion_formal: 'Para un capital inicial $C > 0$, una tasa de interés periódica
  $i = \frac{r}{100}$ y un número de períodos de capitalización $n \in \mathbb{N}$,
  la **Capitalización Compuesta $M(n)$** se modela mediante la función exponencial
  de base $(1+i)$:


  $$M(n) = C \cdot (1 + i)^n$$


  **Propiedad de capitalización periódica:**

  - El capital de inicio del período $k+1$ es $C_{k+1} = M_k = C_k \cdot (1 + i)$.'
definiciones_clave: '- **Interés compuesto**: Régimen exponencial $M = C \cdot (1
  + i)^n$ con capitalización continua de intereses.'
propiedades_relaciones: '- **Crecimiento exponencial**: La base multiplicativa $(1+i)^n$
  acelera la acumulación en función del tiempo.'
ejemplo_guiado:
  enunciado: Analice una inversión de \$100.000 al $10\%$ compuesto anual durante
    $2$ años.
  pasos:
  - 'Paso 1: Año 1: interés $100.000 \cdot 0,10 = 10.000 \implies M_1 = 110.000$.'
  - 'Paso 2: Año 2: el interés se calcula sobre \$110.000 \implies 110.000 \cdot 0,10
    = 11.000$.'
  - 'Paso 3: Calcular el monto final $M_2 = 110.000 + 11.000 = 121.000$.'
  - 'Paso 4: Comprobar con la fórmula direct $M = 100.000 \cdot (1 + 0,10)^2 = 100.000
    \cdot 1,21 = 121.000$.'
  - 'Conclusión: El monto final es \$121.000 (acumuló \$1.000 más que en interés simple).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza fundamentalmente al interés compuesto frente al simple?
  choices:
  - text: Que los intereses de cada período se suman al capital para generar nuevos
      intereses
    is_correct: true
  - text: Que los intereses son siempre constantes y fijos
    is_correct: false
  - text: Que la tasa de interés disminuye a cero
    is_correct: false
  - text: Que no utiliza tasas de interés
    is_correct: false
  explanation: La alternativa correcta es 'Que los intereses de cada período se suman
    al capital para generar nuevos intereses'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $100.000 al 10% compuesto durante 2 años, ¿cuál
    fue el monto final M2?
  choices:
  - text: 121.000 $
    is_correct: true
  - text: 120.000 $
    is_correct: false
  - text: 110.000 $
    is_correct: false
  - text: 130.000 $
    is_correct: false
  explanation: La alternativa correcta me '121.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y modelar el interés compuesto
  $M = C \cdot (1 + i)^n$ identificando la capitalización de intereses.
semantic_id: MAT.NUM.INTERES_COMPUESTO.CONCEPTO
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
