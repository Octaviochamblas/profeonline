semantic_id: MAT.NUM.INTERES_COMPUESTO.CONCEPTO
resumen_inicial: 'El interés compuesto es el proceso financiero de capitalización donde los intereses devengados al final de cada período se adicionan al capital inicial para generar nuevos intereses en los períodos siguientes: $M = C \cdot (1 + i)^n$.'
explicacion_simple: |
  A diferencia del interés simple (donde la ganancia siempre se calcula sobre el dinero original), en el **interés compuesto** la ganancia de cada año **se suma al dinero guardado**.
  Por ejemplo, si inviertes $\$100.000$ al $10\%$ anual compuesto:
  - Año 1: Ganas el $10\%$ de $\$100.000 = \$10.000$. Tu nuevo total es $\$110.000$.
  - Año 2: Ganas el $10\%$ de $\$110.000 = \$11.000$. Tu nuevo total es $\$121.000$.
  - Año 3: Ganas el $10\%$ de $\$121.000 = \$12.100$. Tu nuevo total es $\$133.100$.
  Esto crea el efecto de *"interés sobre interés"* o **crecimiento exponencial**.
explicacion_formal: |
  ### Definición formal
  El **régimen de capitalización compuesta** es un modelo dinámico discreto donde la base de cálculo de intereses se actualiza periódicamente sumando los rendimientos obtenidos:
  $$M_n = C \cdot (1 + i)^n$$
  donde:
  - $C \in \mathbb{R}^+$ es el **capital inicial** (principal depositado).
  - $i \in \mathbb{R}^+$ es la **tasa de interés efectiva por período de capitalización** ($i = r / 100$).
  - $n \in \mathbb{N}$ es el **número total de períodos de capitalización**.

  ### Mecanismo de Capitalización Recursiva
  - Período 1: $M_1 = C + C \cdot i = C(1 + i)$.
  - Período 2: $M_2 = M_1(1 + i) = C(1 + i)^2$.
  - Período $n$: $M_n = M_{n-1}(1 + i) = C(1 + i)^n$.

  ### Comportamiento Exponencial
  Dado que el factor de acumulación $(1 + i)^n$ se eleva al exponente $n$, la curva de crecimiento del dinero es una **función exponencial estrictamente creciente** ($1 + i > 1$).

  ### Síntesis didáctica
  - Ecuación del monto compuesto: $M = C \cdot (1 + i)^n$.
  - Principio de reinversión: Intereses del período $k$ generan intereses en el período $k+1$.
definiciones_clave: |
  - **Capitalización**: Proceso de convertir los intereses ganados en parte del nuevo capital inicial del siguiente período.
  - **Período de capitalización**: Intervalo de tiempo regular (anual, semestral, mensual) al término del cual se liquidan y suman los intereses.
  - **Factor de acumulación compuesto**: Término $(1 + i)^n$ que multiplica al capital inicial.
propiedades_relaciones: |
  - **Dominancia temporal**: Para un mismo capital, tasa y plazo ($n > 1$), el régimen compuesto genera un monto acumulado estrictamente mayor que el régimen simple ($C(1+i)^n > C(1+in)$).
  - **Efecto de la frecuencia de capitalización**: A mayor frecuencia de capitalización en un año (ej: mensual vs. anual), mayor es el monto final obtenido.
ejemplo_guiado:
  enunciado: 'Un depósito de $\$200.000$ se coloca a interés compuesto a una tasa del $10\%$ anual durante $3$ años con capitalización anual. Calcula el monto final total acumulado.'
  pasos:
    - 'Paso 1: Identificamos $C = 200.000$, tasa decimal $i = 0,10$ y número de períodos $n = 3$.'
    - 'Paso 2: Aplicamos la fórmula del monto compuesto: $M = C \cdot (1 + i)^n = 200.000 \cdot (1 + 0,10)^3$.'
    - 'Paso 3: Calculamos la potencia del factor: $(1,10)^3 = 1,10 \cdot 1,10 \cdot 1,10 = 1,331$.'
    - 'Paso 4: Multiplicamos por el capital: $M = 200.000 \cdot 1,331 = 266.200$. El monto final es de **$\$266.200$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre con los intereses ganados en cada período dentro del régimen de interés compuesto?'
    choices:
      - {text: 'Se suman al capital inicial para generar nuevos intereses en los períodos siguientes', is_correct: true}
      - {text: 'Se retiran del banco y el capital permanece siempre constante', is_correct: false}
      - {text: 'Se reducen en un 50% al término de cada año', is_correct: false}
      - {text: 'Se multiplican por el número de días transcurridos', is_correct: false}
    explanation: 'La alternativa correcta es ''Se suman al capital inicial para generar nuevos intereses en los períodos siguientes''. Es el principio de capitalización.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se depositan $\$100.000$ al $5\%$ de interés compuesto anual por $2$ años, ¿cuál es el monto acumulado?'
    choices:
      - {text: '$\$110.250$, calculando $100.000 \cdot (1,05)^2 = 100.000 \cdot 1,1025 = 110.250$', is_correct: true}
      - {text: '$\$110.000$, usando interés simple', is_correct: false}
      - {text: '$\$105.000$, considerando solo 1 año', is_correct: false}
      - {text: '$\$120.000$, duplicando el porcentaje', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$110.250$, calculando $100.000 \cdot (1,05)^2 = 100.000 \cdot 1,1025 = 110.250$''. $(1,05)^2 = 1,1025$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el capital inicial $C$, la tasa por período $i = r/100$ y el número de períodos $n$.'
  - 'Paso 2: Sumar la unidad a la tasa decimal $(1 + i)$.'
  - 'Paso 3: Elevar la suma a la potencia $n$: $(1 + i)^n$.'
  - 'Paso 4: Multiplicar el resultado por el capital inicial $C$ para obtener el monto final $M$.'
errores_correccion: |
  - **Error 1:** Multiplicar la tasa por el número de períodos en lugar de elevar a la potencia $n$ (confundir $(1+i)^n$ con $1+i \cdot n$). **Cómo corregirlo:** En interés compuesto el tiempo **figura como EXPONENTE**, no como multiplicador: **$M = C \cdot (1+i)^n$**.
  - **Error 2:** No ajustar la tasa anual cuando la capitalización es mensual o semestral. **Cómo corregirlo:** Divide la tasa anual entre el número de períodos del año (ej: **$i = r_{\text{anual}} / 12$ para capitalización mensual**).
ejemplos:
  - titulo: 'Monto compuesto a 2 años'
    enunciado: '¿El monto compuesto de $\$50.000$ al $10\%$ anual en 2 años es $\$60.500$?'
    alternativas:
      - 'Sí, pues $50.000 \cdot (1,10)^2 = 50.000 \cdot 1.21 = 60.500$'
      - 'No, es $\$60.000$'
      - 'No, es $\$55.000$'
    respuesta: 'Sí, pues $50.000 \cdot (1,10)^2 = 50.000 \cdot 1.21 = 60.500$'
    solucion_pasos:
      - '1. Factor: $(1,10)^2 = 1,21$.'
      - '2. Monto: $50.000 \cdot 1,21 = 60.500$.'
  - titulo: 'Interés acumulado vs simple'
    enunciado: 'Para $\$100.000$ al $10\%$ en 2 años, ¿el interés compuesto ($\$21.000$) supera al simple ($\$20.000$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $100.000 \cdot 1,21 - 100.000 = \$21.000 > \$20.000$.'
  - titulo: 'Efecto de capitalizaciones sucesivas'
    enunciado: '¿Los intereses generados en el segundo año son mayores que los del primer año?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El capital del segundo año incluye los intereses del primero.'
  - titulo: 'Monto con tasa del 100%'
    enunciado: 'Si la tasa fuera $100\%$ por período ($i=1$), ¿el monto final se cuadruplica en 2 períodos ($100.000 \cdot 2^2 = 400.000$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1+1)^2 = 2^2 = 4 \implies 400.000$.'
errores_frecuentes:
  - 'Multiplicar la tasa por el número de períodos $n$ aplicando por equivocación la fórmula del interés simple.'
  - 'Mantener la tasa nominal anual sin dividirla por la frecuencia de capitalización por año.'
  - 'El monto final a interés compuesto evoluciona mediante una línea recta de pendiente fija.'
  - 'Los intereses producidos en el período tres son idénticos a los intereses generados en el período uno.'
  - 'Sumar el capital inicial al factor $(1+i)$ antes de elevar al exponente $n$.'
afirmaciones_verdaderas:
  - 'En el interés compuesto, los intereses de cada período se incorporan al capital para generar nuevos intereses ($M = C(1+i)^n$).'
  - 'Para plazos superiores a un período ($n > 1$), el interés compuesto genera un rendimiento mayor que el interés simple a la misma tasa.'
al_terminar_debes_poder: 'Comprender y calcular el monto acumulado por interés compuesto mediante la función exponencial $M = C \cdot (1 + i)^n$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
