semantic_id: MAT.NUM.INTERES_COMPUESTO.CONCEPTO
resumen_inicial: 'Concepto de interés compuesto: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: Albert Einstein supuestamente dijo que el interés compuesto es
  la octava maravilla del mundo. 'Aquel que lo entiende, lo gana; aquel que no, lo
  paga'. Es el motor secreto de la riqueza (y de las deudas impagables).
explicacion_formal: 'A diferencia del interés simple donde siempre calculas sobre
  el capital original, el **Interés Compuesto** funciona bajo la regla de la **Capitalización**.


  - **Periodo 1:** Inviertes $\$100$ al $10\%$. Ganas $\$10$. Tienes $\$110$.

  - **Periodo 2:** Ahora el $10\%$ se calcula sobre los $\$110$. Ganas $\$11$. Tienes
  $\$121$.

  - **Periodo 3:** El $10\%$ se calcula sobre $\$121$. Ganas $\$12.1$. Tienes $\$133.1$.


  Como ves, la cantidad de interés generada es cada vez mayor. Esto crea un efecto
  ''bola de nieve''. En el corto plazo la diferencia con el simple es pequeña, pero
  a largo plazo (20-30 años, como en los fondos de jubilación o créditos hipotecarios),
  la curva del interés compuesto despega exponencialmente hacia el cielo.'
definiciones_clave: '- **Concepto de interés compuesto**: Elemento central dentro
  del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a concepto de interés compuesto.'
