semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_HORIZONTAL
resumen_inicial: 'Descripción de la traslación horizontal de una función potencia:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones y escalas.'
explicacion_simple: Reemplazar $x$ por $x-h$ dentro de la función desplaza toda la
  curva a lo largo del eje horizontal, sin cambiar su forma.
explicacion_formal: '### Definición formal


  Dada $g(x)=a\cdot x^n$, la función $f(x)=g(x-h)=a(x-h)^n$ tiene la misma forma que
  $g$, pero cada punto $(x_0,y_0)$ de $g$ se traslada al punto $(x_0+h,y_0)$ en $f$.
  El nuevo "centro" de la curva, antes en $x=0$, pasa a estar en $x=h$.


  ### Desarrollo didáctico


  $f(x)=(x-3)^2$ tiene la misma forma de copa que $x^2$, pero su vértice está en $x=3$
  en vez de $x=0$. Evaluar $f(3)=0$ confirma que el vértice se movió exactamente a
  esa posición.'
definiciones_clave: '- **Descripción de la traslación horizontal de una función potencia**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a descripción de la traslación horizontal de una función potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de descripción de la traslación horizontal de una función potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de descripción de la traslación
    horizontal de una función potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar descripción de la traslación horizontal de una función potencia?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en descripción de la traslación horizontal de una función potencia?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el valor de $h$ dentro de la expresión $(x-h)^n$.'
- 'Paso 2: Reconoce que el "centro" de la curva se traslada a $x=h$.'
- 'Paso 3: Traza la gráfica básica y desplázala horizontalmente según el valor de
  $h$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en descripción de la traslación horizontal de una función potencia.
ejemplos:
- titulo: Identificación del desplazamiento en $(x-5)^2$
  enunciado: ¿Cuál es el desplazamiento horizontal de $f(x)=(x-5)^2$?
  solucion_pasos:
  - Se identifica $h=5$ en la expresión $(x-h)^2$.
  - La gráfica se desplaza $5$ unidades hacia la derecha respecto a $x^2$.
- titulo: Cálculo del nuevo centro de la curva
  enunciado: ¿En qué valor de $x$ se ubica el nuevo vértice de $f(x)=(x-4)^4$?
  solucion_pasos:
  - Se identifica $h=4$.
  - El vértice se ubica en $x=4$, donde $f(4)=0$.
- titulo: ¿La traslación horizontal cambia la forma de la curva?
  enunciado: ¿Al trasladar horizontalmente una función potencia, cambia su forma general
    (copa, s, etc.)?
  respuesta: 'No'
  solucion_pasos:
  - Solo cambia la posición de la curva, no su forma ni su tipo.
- titulo: ¿La traslación horizontal afecta el recorrido de la función?
  enunciado: ¿Una traslación horizontal modifica el recorrido de la función?
  respuesta: 'No'
  solucion_pasos:
  - Solo afecta el dominio (si corresponde) y la posición en el eje $x$; el recorrido
    permanece igual.
errores_frecuentes:
- Confundir la dirección del desplazamiento (derecha vs. izquierda) según el signo
  de $h$.
- Suponer que la traslación horizontal también desplaza verticalmente la curva.
- No identificar correctamente el valor de $h$ cuando la expresión no está en la forma
  estándar $(x-h)$.
- Creer que la traslación cambia el tipo de curva (de copa a s, por ejemplo).
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  descripción de la traslación horizontal de una función potencia.
