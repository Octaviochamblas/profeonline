semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_HORIZONTAL
resumen_inicial: 'La traslación horizontal de una función potencia $f(x) = a x^n$ por $|h|$ unidades desplaza la gráfica paralelamente al eje de las abscisas, adoptando la forma $g(x) = a (x - h)^n$.'
explicacion_simple: |
  La traslación horizontal consiste en mover toda la gráfica de una función potencia hacia la izquierda o hacia la derecha sin deformar su tamaño ni su curvatura. Para lograr este desplazamiento horizontal, reemplazamos la variable $x$ por la expresión $(x - h)$ dentro de la potencia. El punto central o vértice de la curva pasa de estar en el origen $(0, 0)$ a ubicarse en la nueva abscisa $(h, 0)$.
explicacion_formal: |
  ### Definición formal
  La **traslación horizontal de la función potencia** $f(x) = a x^n$ mediante el vector de desplazamiento horizontal $\vec{v} = (h, 0)$ es la transformación geométrica descrita por la función:
  $$g(x) = f(x - h) = a (x - h)^n$$

  ### Mapeo de pares ordenados
  - Para todo punto de la curva canónica $(x_0, y_0) \in \operatorname{Graf}(f)$, el punto transformado correspondiente es $(x_0 + h, y_0) \in \operatorname{Graf}(g)$.
  - **Invariancia de Ordenadas**: Las alturas verticales $y$ se conservan idénticas, pero ocurren $h$ unidades desplazadas en el eje horizontal $x$.

  ### Síntesis didáctica
  Traslación del punto de inflexión o vértice: El centro de simetría u origen $(0, 0)$ de la función potencia canónica se desplaza exactamente al punto cartesiano $(h, 0)$.
definiciones_clave: |
  - **Traslación horizontal $g(x) = f(x - h)$**: Transformación isométrica que desplaza la curva paralelamente al eje $x$.
  - **Parámetro de desplazamiento horizontal $h$**: Valor que determina la cantidad de unidades de desplazamiento horizontal.
  - **Vértice trasladado $(h, 0)$**: Nueva posición del punto clave de referencia cartesiano.
propiedades_relaciones: |
  - **Conservación del Recorrido**: La traslación horizontal no altera el conjunto recorrido ni las cotas verticales de la función potencia.
  - **Isometría rígida**: No modifica la apertura ni la concavidad de la gráfica original.
ejemplo_guiado:
  enunciado: 'Aplica una traslación horizontal de $h = 3$ unidades hacia la derecha a la función potencia $f(x) = 2x^4$, escribe la fórmula resultante $g(x)$ y determina las nuevas coordenadas del vértice y del punto evaluado originalmente en $x = 1$.'
  pasos:
    - 'Paso 1: Para traslación horizontal de $h = 3$, sustituimos $x$ por $(x - 3)$ en la potencia. Fórmula: $g(x) = 2(x - 3)^4$.'
    - 'Paso 2: El vértice de $f(x)$ que estaba en $(0, 0)$ se traslada a la nueva abscisa $x = 3 \implies (3, 0)$.'
    - 'Paso 3: El punto original en $x = 1$ tenía coordenadas $(1, f(1)) = (1, 2)$.'
    - 'Paso 4: En $g(x)$, esa misma altura $y = 2$ se alcanza en la abscisa $x = 1 + 3 = 4$, ya que $g(4) = 2(4 - 3)^4 = 2(1)^4 = 2$. Punto trasladado: $(4, 2)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula algebraica de la función resultante de aplicar una traslación horizontal de $h = 5$ unidades a la función potencia $f(x) = -3x^3$?'
    choices:
      - {text: '$g(x) = -3(x - 5)^3$', is_correct: true}
      - {text: '$g(x) = -3x^3 - 5$', is_correct: false}
      - {text: '$g(x) = -3(x + 5)^3$', is_correct: false}
      - {text: '$g(x) = -15x^3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = -3(x - 5)^3$''. La traslación horizontal de parámetro $h = 5$ reemplaza a la variable independiente $x$ por la expresión $(x - 5)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la curva de la función potencia $f(x) = x^2$ tiene su vértice en $(0, 0)$, ¿cuáles son las coordenadas del vértice de la función trasladada $g(x) = (x - 4)^2$?'
    choices:
      - {text: 'El punto de coordenadas $(4, 0)$', is_correct: true}
      - {text: 'El punto de coordenadas $(-4, 0)$', is_correct: false}
      - {text: 'El punto de coordenadas $(0, 4)$', is_correct: false}
      - {text: 'El punto de coordenadas $(0, -4)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(4, 0)$''. La traslación horizontal desplaza la abscisa del vértice $h = 4$ unidades a la derecha conservando la ordenada $y = 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la función potencia base $f(x) = a x^n$ y la cantidad de unidades de traslación $h$.'
  - 'Paso 2: Reemplazar cada ocurrencia de la variable $x$ por el binomio $(x - h)$.'
  - 'Paso 3: Escribir la nueva función en forma canónica $g(x) = a (x - h)^n$.'
  - 'Paso 4: Actualizar las coordenadas de los puntos clave trasladando sus abscisas $x_0 \to x_0 + h$.'
errores_correccion: |
  - **Error 1:** Sumar la constante $h$ por fuera de la potencia (ej: escribir $a x^n - h$). **Cómo corregirlo:** Restar por fuera de la potencia produce una traslación **vertical**. La traslación **horizontal** exige que la resta $h$ ocurra directamente sobre la variable $x$ dentro del paréntesis de la potencia: $a(x - h)^n$.
  - **Error 2:** Alterar el exponente $n$ al realizar la traslación. **Cómo corregirlo:** La traslación es una isometría rígida que conserva intacto el exponente $n$ y el coeficiente $a$.
ejemplos:
  - titulo: 'Formulación de traslación horizontal'
    enunciado: '¿La traslación horizontal de $f(x) = x^3$ en $h = 2$ es $g(x) = (x - 2)^3$?'
    alternativas:
      - 'Sí, $g(x) = (x - 2)^3$'
      - 'No, $g(x) = x^3 - 2$'
      - 'No, $g(x) = 2x^3$'
    respuesta: 'Sí, $g(x) = (x - 2)^3$'
    solucion_pasos:
      - '1. Sustituimos $x$ por $(x - 2)$.'
      - '2. La función trasladada es $g(x) = (x - 2)^3$.'
  - titulo: 'Vértice en parábola trasladada'
    enunciado: '¿El vértice de $f(x) = 3(x - 6)^2$ está en $(6, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $x = 6$, $(6 - 6)^2 = 0 \implies y = 0$. Vértice en $(6, 0)$.'
  - titulo: 'Conservación del recorrido'
    enunciado: '¿El recorrido de $g(x) = (x - 5)^4$ sigue siendo $[0, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La traslación horizontal no modifica la altura mínima $y = 0$. Recorrido: $[0, +\infty[$.'
  - titulo: 'Evaluación de punto trasladado'
    enunciado: 'Si $f(x) = x^2$ pasa por $(1, 1)$, ¿$g(x) = (x - 3)^2$ pasa por $(4, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(4) = (4 - 3)^2 = 1^2 = 1$. Abscisa trasladada $1 + 3 = 4$.'
errores_frecuentes:
  - 'La traslación horizontal de $f(x) = x^4$ por $h = 3$ unidades equivale a $g(x) = x^4 - 3$.'
  - 'Un desplazamiento horizontal altera el conjunto recorrido de una función potencia de exponente par.'
  - 'La traslación horizontal modifica la concavidad de la parábola.'
  - 'El vértice de la función $f(x) = (x - 2)^3$ permanece en el punto $(0, 0)$.'
  - 'Reemplazar $x$ por $(x - h)$ dentro de la potencia cambia el exponente de la función.'
afirmaciones_verdaderas:
  - 'La traslación horizontal de una función potencia $f(x) = a x^n$ sustituye a la variable independiente por $(x - h)$, resultando en la función $g(x) = a (x - h)^n$.'
  - 'Las traslaciones horizontales trasladan las abscisas de todos los puntos de la gráfica por $x \to x + h$ manteniendo inalteradas las ordenadas $y$ y el conjunto recorrido.'
al_terminar_debes_poder: 'Formular y graficar traslaciones horizontales de una función potencia $f(x) = a x^n$ sustituyendo la variable independiente por el binomio $(x - h)$ y desplazando la abscisa del vértice del origen $(0, 0)$ a la nueva posición $x = h$.'
