semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TEST_LINEA_VERTICAL
resumen_inicial: El criterio de la línea vertical permite determinar si una curva trazada en el plano cartesiano representa o no una función matemática.
explicacion_simple: |
  Para saber si un dibujo en el plano cartesiano es una función:

  1. Imagina trazar líneas verticales rectas (de arriba abajo) por cualquier lugar del dibujo.
  2. Si **TODAS** las líneas verticales tocan al dibujo a lo sumo en **UN SOLO PUNTO**, **SÍ es una función**.
  3. Si encuentras al menos **UNA** línea vertical que toque al dibujo en **DOS O MÁS PUNTOS**, **NO es una función**.
explicacion_formal: |
  Sea $G \subset \mathbb{R}^2$ la representación gráfica de una relación en el plano cartesiano. La relación $G$ es una **función** $y = f(x)$ si y solo si satisface la condición:

  $$\forall x_0 \in \text{Dom}(f), \quad |G \cap \{(x_0, y) \mid y \in \mathbb{R}\}| \le 1$$

  **Desglose de la regla:**
  - $x = x_0$: Ecuación de la recta vertical trazada en la abscisa $x_0$.
  - Intersección de más de un punto: Indica existencia de dos imágenes $y_1 \neq y_2$ para la misma preimagen $x_0$.
definiciones_clave: |
  - **Prueba de la línea vertical**: Procedimiento geométrico para validar la propiedad de unicidad de imagen de una función en el plano cartesiano.
propiedades_relaciones: |
  - **Relaciones no funcionales comunes**: Circunferencias, elipses y parábolas de eje horizontal fallan la prueba de la línea vertical.
ejemplo_guiado:
  enunciado: "Se presentan dos curvas gráficas: la gráfica A (una parábola vertical $y = x^2$) y la gráfica B (una parábola horizontal $x = y^2$). Determina cuál corresponde a una función."
  pasos:
    - 'Paso 1: Trazar una recta vertical en $x = 2$ sobre la gráfica A: corta en un único punto $(2, 4)$. Esto ocurre para toda recta vertical.'
    - 'Paso 2: Trazar una recta vertical en $x = 4$ sobre la gráfica B: corta en dos puntos $(4, 2)$ y $(4, -2)$.'
    - 'Paso 3: Concluir que la gráfica A SÍ es una función, mientras que la gráfica B NO es una función.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué la parábola horizontal $x = y^2$ no representa una función $y = f(x)$ según la prueba de la línea vertical?"
    choices:
      - {text: "Porque la recta vertical $x = 4$ corta al gráfico en dos puntos distintos ($(4, 2)$ y $(4, -2)$)", is_correct: true}
      - {text: "Porque no pasa por el origen del plano", is_correct: false}
      - {text: "Porque no está definida para números negativos", is_correct: false}
      - {text: "Porque es una figura simétrica", is_correct: false}
    explanation: "La alternativa correcta es 'Porque la recta vertical $x = 4$ corta al gráfico en dos puntos distintos ($(4, 2)$ y $(4, -2)$)'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si una curva corta en un único punto a todas las rectas verticales posibles en su dominio, ¿qué conclusión se obtiene?"
    choices:
      - {text: "La gráfica representa una función real válida.", is_correct: true}
      - {text: "La gráfica representa una relación no funcional.", is_correct: false}
      - {text: "La gráfica es obligatoriamente una recta constante.", is_correct: false}
      - {text: "La gráfica no posee recorrido.", is_correct: false}
    explanation: "La alternativa correcta es 'La gráfica representa una función real válida.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Observar el gráfico de la relación en el plano cartesiano.'
  - 'Paso 2: Trazar rectas verticales $x = k$ paralelas al eje $Y$ a lo largo de todo el dominio.'
  - 'Paso 3: Contar el número de puntos de intersección entre cada recta vertical y la gráfica.'
  - 'Paso 4: Si para alguna recta vertical se obtienen 2 o más intersecciones, declarar que la gráfica no es función.'
errores_correccion: |
  - **Error común:** Confundir las rectas verticales con rectas horizontales al evaluar si una gráfica es función.
  - **Cómo corregirlo:** Las rectas HORIZONTALES evalúan la inyectividad (función uno a uno); las rectas VERTICALES evalúan si la gráfica ES FUNCIÓN.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El criterio de la línea vertical exige trazar rectas horizontales paralelas al eje $X$ para determinar si una curva es función.'
  - 'Si una recta vertical intersecta una curva en exactamente tres puntos distintos, la gráfica representa una función trilineal.'
  - 'Una sola recta vertical que no toque a la curva demuestra que la curva no es una función en su dominio.'
  - 'La prueba de la línea vertical solo se aplica a funciones lineales y falla en curvas polinómicas de grado par.'
  - 'Trazar líneas verticales en una gráfica permite calcular directamente el dominio cuantitativo de la función.'
afirmaciones_verdaderas:
  - 'El criterio de la línea vertical establece que un gráfico representa una función si y solo si ninguna recta vertical corta a la gráfica en más de un punto.'
  - 'Si existe al menos una recta vertical $x = a$ que intersecta la gráfica en dos o más puntos, la relación no es una función.'
al_terminar_debes_poder: |
  QUÉ: Aplicar el criterio de la línea vertical para clasificar representaciones gráficas en el plano cartesiano.
  CÓMO: Trazar rectas verticales imaginarias sobre el plano y verificar que ninguna corte a la gráfica en más de un punto.
fuente: 'Texto escolar MINEDUC — Álgebra / Representación de Funciones'
estado: publicado
