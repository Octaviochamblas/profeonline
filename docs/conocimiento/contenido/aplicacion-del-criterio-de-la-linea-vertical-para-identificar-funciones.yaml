semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TEST_LINEA_VERTICAL
resumen_inicial: El criterio de la línea vertical permite determinar visualmente si una gráfica en el plano representa una función de $x$.
explicacion_simple: '![El criterio de la línea vertical permite determinar visualmente si una gráfica en el plano representa una función de $x$](/static/img/nodos/aplicacion-del-criterio-de-la-linea-vertical-para-identificar-funciones-intro.svg)



  El **criterio de la línea vertical** es la prueba visual más rápida para saber si un dibujo es una función:


  Imagina que pasas una regla vertical de izquierda a derecha por todo el gráfico:

  - Si la regla corta a la curva en **como máximo UN punto** en cualquier posición, **SÍ es una función**.

  - Si en algún lugar la regla corta a la curva en **DOS O MÁS puntos al mismo tiempo**, **NO es una función**.'
explicacion_formal: 'Una curva $\mathcal{C} \subset \mathbb{R}^2$ es la gráfica de una función $y = f(x)$ si y solo si cumple el **criterio de la recta vertical**:

  $$\forall x_0 \in \mathbb{R}, \ \big| \{(x_0, y) \in \mathbb{R}^2 \mid (x_0, y) \in \mathcal{C}\} \big| \le 1$$


  **Fundamento matemático:**

  Si una recta vertical $x = x_0$ intersecta a la curva en dos puntos distintos $(x_0, y_1)$ y $(x_0, y_2)$ con $y_1 \neq y_2$, entonces a la preimagen $x_0$ le corresponderían dos imágenes distintas, violando el principio de asignación única.'
definiciones_clave: '- **Criterio de la línea vertical**: Método geométrico para verificar la unicidad de imagen en gráficas cartesianas.

  - **Intersección múltiple**: Falla geométrica donde una recta vertical corta en dos o más ordenadas.'
propiedades_relaciones: '- **Curvas cerradas**: Circunferencias, elipses y lazos nunca son funciones de $x$ porque las rectas verticales cortan en 2 puntos.

  - **Funciones por tramos**: En saltos verticales, un extremo debe ser abierto ($\circ$) y el otro cerrado ($\bullet$) para preservar la unicidad.'
ejemplo_guiado:
  enunciado: '![Ejemplo El criterio de la línea vertical permite determinar visualmente si una gráfica en el plano representa una función de $x$](/static/img/nodos/aplicacion-del-criterio-de-la-linea-vertical-para-identificar-funciones-ejemplos.svg)



    Aplica el criterio de la recta vertical para determinar si las siguientes figuras en el plano son funciones de $x$:

    1) Una circunferencia $x^2 + y^2 = 16$.

    2) Una parábola vertical $y = x^2 - 4x + 3$.'
  pasos:
  - 'Paso 1: Analizar la circunferencia: Al trazar la recta vertical $x = 0$, corta en $(0, 4)$ y $(0, -4)$ (2 puntos). Por tanto, la circunferencia NO es una función de $x$.'
  - 'Paso 2: Analizar la parábola vertical: Cualquier recta vertical $x = c$ corta a la parábola en exactamente un punto $(c, c^2 - 4c + 3)$.'
  - 'Paso 3: Concluir que la parábola vertical SÍ es una función de $x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué una recta vertical como $x = 5$ NO representa una función $y = f(x)$?
  choices:
  - text: Porque para x = 5 existen infinitos valores de y sobre la recta.
    is_correct: true
  - text: Porque no tiene pendiente.
    is_correct: false
  - text: Porque no pasa por el origen.
    is_correct: false
  - text: Porque su fórmula es muy simple.
    is_correct: false
  explanation: La alternativa correcta es 'Porque para x = 5 existen infinitos valores de y sobre la recta.'. Viola totalmente la unicidad de imagen.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un gráfico por tramos en $x = 3$, si hay dos puntos alineados verticalmente y ambos son círculos cerrados (•), ¿es función?
  choices:
  - text: No, porque para x = 3 la función tendría dos imágenes distintas.
    is_correct: true
  - text: Sí, porque los círculos cerrados aseguran continuidad.
    is_correct: false
  - text: Sí, si el resto de la gráfica es suave.
    is_correct: false
  - text: Solo si ambas imágenes son positivas.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque para x = 3 la función tendría dos imágenes distintas.'. Debe haber a lo más un punto cerrado.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la gráfica cartesiana propuesta.'
- 'Paso 2: Trazar mental o físicamente líneas verticales a lo largo de todo el eje horizontal.'
- 'Paso 3: Contar el número de intersecciones con la curva en cada posición.'
- 'Paso 4: Si en alguna posición hay 2 o más cortes, declarar que NO es función; si en todas hay 0 o 1 corte, confirmar que ES función.'
errores_correccion: '- **Error común:** Confundir la prueba de la recta vertical con la de la recta horizontal.

  - **Cómo corregirlo:** La recta **vertical** comprueba si la gráfica es una **función**. La recta **horizontal** comprueba si la función es **inyectiva** (uno a uno).'
ejemplos:
- titulo: 'Ejemplo 1: Parábola horizontal'
  enunciado: ¿Es la gráfica de $x = y^2$ una función de $x$?
  alternativas:
  - 'No, porque para x = 4 hay dos puntos: (4, 2) y (4, -2)'
  - Sí, es una función cuadrática estándar
  - Sí, para todo x real
  - Solo si el vértice es (0,0)
  respuesta: 'No, porque para x = 4 hay dos puntos: (4, 2) y (4, -2)'
  solucion_pasos:
  - 'Paso 1: La recta vertical $x = 4$ corta a la curva en $y = 2$ e $y = -2$.'
  - 'Paso 2: Al tener 2 cortes, no es función.'
- titulo: 'Ejemplo 2: Función valor absoluto'
  enunciado: ¿Cumple la gráfica en forma de 'V' de $y = |x|$ el criterio de la recta vertical?
  alternativas:
  - Sí, toda recta vertical la corta en exactamente un punto
  - No, porque tiene un vértice puntiagudo
  - No, porque decrece y luego crece
  - Solo para x positivos
  respuesta: Sí, toda recta vertical la corta en exactamente un punto
  solucion_pasos:
  - 'Paso 1: Cada recta vertical intersecta la ''V'' en un solo punto.'
  - 'Paso 2: Es una función válida.'
- titulo: 'Ejemplo 3: Gráfica de onda senoidal'
  enunciado: ¿Es una onda senoidal oscilante continua una función de $x$?
  alternativas:
  - Sí, cada recta vertical la corta en exactamente un punto
  - No, porque las ondas se repiten infinitamente
  - No, porque corta muchas veces al eje X
  - Solo en el primer período
  respuesta: Sí, cada recta vertical la corta en exactamente un punto
  solucion_pasos:
  - 'Paso 1: Aunque repita valores de $y$, cada $x$ tiene una sola altura asignada.'
- titulo: 'Ejemplo 4: Elipse en el plano'
  enunciado: ¿Representa una elipse $\frac{x^2}{9} + \frac{y^2}{4} = 1$ una función de $x$?
  alternativas:
  - No, porque las rectas verticales interiores cortan en dos puntos
  - Sí, es una función elíptica
  - Sí, porque es simétrica
  - Solo si está centrada en el origen
  respuesta: No, porque las rectas verticales interiores cortan en dos puntos
  solucion_pasos:
  - 'Paso 1: Por ser una curva cerrada, las verticales por su interior generan dos imágenes.'
errores_frecuentes:
- Confundir que la curva corte muchas veces al eje X con que no sea función.
- Aplicar rectas horizontales para evaluar si es función.
- No inspeccionar los puntos extremos en discontinuidades por tramos.
afirmaciones_verdaderas:
- Una curva cartesiana representa una función si ninguna recta vertical la intersecta en más de un punto.
- El criterio de la línea vertical es la traducción geométrica del principio de unicidad de imagen.
al_terminar_debes_poder: '**QUÉ:** Aplicar el criterio de la línea vertical para clasificar relaciones gráficas.


  **CÓMO:** Verificando que toda perpendicular al eje horizontal corte a la curva a lo más una vez para garantizar la unicidad de imagen.


  ![Resumen El criterio de la línea vertical permite determinar visualmente si una gráfica en el plano representa una función de $x$](/static/img/nodos/aplicacion-del-criterio-de-la-linea-vertical-para-identificar-funciones-resumen.svg)'
