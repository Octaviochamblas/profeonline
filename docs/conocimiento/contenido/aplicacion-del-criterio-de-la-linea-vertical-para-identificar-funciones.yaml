semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TEST_LINEA_VERTICAL
resumen_inicial: El criterio de la línea vertical establece que un gráfico representa
  a una función si ninguna recta vertical lo corta en más de un punto.
explicacion_simple: 'Para saber si un gráfico trazado en el plano representa a una
  función:

  1. Imaginamos trazar líneas verticales continuas de arriba hacia abajo a lo largo
  del gráfico.

  2. Si **CUALQUIER** línea vertical corta al gráfico en **DOS O MÁS PUNTOS**, el
  gráfico **NO ES UNA FUNCIÓN**.

  3. Si todas las líneas verticales posibles cortan al gráfico en **UN SOLO PUNTO**
  (o ninguno), el gráfico **SÍ ES UNA FUNCIÓN**.'
explicacion_formal: 'Sea $G \subset \mathbb{R}^2$ una curva plana. $G$ es la gráfica
  de una función $y = f(x)$ si y solo si:


  $$\forall x_0 \in \mathbb{R}, \quad |G \cap \{(x_0, y) \mid y \in \mathbb{R}\}|
  \le 1$$


  **Desglose de la fórmula:**

  - La intersección de la curva $G$ con la recta vertical $x = x_0$ contiene a lo
  sumo un único punto geométrico.'
definiciones_clave: '- **Criterio de la línea vertical**: Prueba geométrica visual
  para validar si un trazo gráfico cumple la condición de unicidad de imagen.'
propiedades_relaciones: '- **Falla de unicidad**: Si una recta vertical corta en dos
  puntos $(x_0, y_1)$ y $(x_0, y_2)$, la preimagen $x_0$ tendría dos imágenes distintas.'
ejemplo_guiado:
  enunciado: Aplica el criterio de la línea vertical a una circunferencia $x^2 + y^2
    = 25$ y a una parábola $y = x^2$, e indica cuál es función.
  pasos:
  - 'Paso 1: Trazar una línea vertical por $x = 3$ en la circunferencia: corta en
    $(3, 4)$ y $(3, -4)$ (2 puntos $\implies$ NO ES FUNCIÓN).Paso 2: Trazar líneas
    verticales sobre la parábola $y = x^2$: cualquier vertical corta en exactamente
    1 punto ($\implies$ SÍ ES FUNCIÓN).Paso 3: Concluir que la parábola es una función
    y la circunferencia no lo es.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre al aplicar el criterio de la línea vertical a una circunferencia
    de radio 5?
  choices:
  - text: Ciertas rectas verticales la cortan en dos puntos, demostrando que NO es
      una función.
    is_correct: true
  - text: Todas las rectas verticales la cortan en exactamente un punto demostrando
      que es función.
    is_correct: false
  - text: Ninguna recta vertical la corta.
    is_correct: false
  - text: Demuestra que la circunferencia es una función biyectiva.
    is_correct: false
  explanation: La alternativa correcta es 'Ciertas rectas verticales la cortan en
    dos puntos, demostrando que NO es una función.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos puntos de intersección como máximo puede tener una recta vertical
    con el gráfico de una función legítima?
  choices:
  - text: A lo sumo 1 punto de intersección.
    is_correct: true
  - text: Exactamente 2 puntos de intersección.
    is_correct: false
  - text: Infinitos puntos.
    is_correct: false
  - text: Mínimo 3 puntos.
    is_correct: false
  explanation: La alternativa correcta es 'A lo sumo 1 punto de intersección.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desplazar una regla verticalmente a través de todo el ancho del gráfico.'
- 'Paso 2: Contar los puntos de intersección en cada posición.'
- 'Paso 3: Si encuentras al menos una posición con $2$ o más cortes, declarar que
  no es función.'
- 'Paso 4: Si en todas partes corta en $1$ punto o en ninguno, declarar que sí es
  función.'
errores_correccion: '- **Error común:** Confundir el criterio de la línea vertical
  con el de la línea horizontal.

  - **Cómo corregirlo:** Para saber si es FUNCIÓN se usan líneas VERTICALES. Las líneas
  horizontales sirven para probar inyectividad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
fuente: Texto escolar MINEDUC — Álgebra / Representación de Funciones
