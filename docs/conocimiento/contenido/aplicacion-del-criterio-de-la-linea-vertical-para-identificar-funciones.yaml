semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TEST_LINEA_VERTICAL
resumen_inicial: 'Aplicación del criterio de la línea vertical para identificar funciones:
  conceptos, representación y propiedades en Representación de funciones.'
explicacion_simple: Sin necesidad de fórmulas, basta imaginar rectas verticales barriendo
  la curva de izquierda a derecha para saber si estás frente a una función.
explicacion_formal: '### Definición formal


  Sea $C$ una curva en el plano cartesiano. $C$ representa la gráfica de una función
  si y solo si para todo $a \in \mathbb{R}$, la recta vertical $x=a$ interseca a $C$
  en a lo más un punto. Esta condición es equivalente geométrica de la unicidad de
  imagen exigida a las funciones.


  ### Desarrollo didáctico


  Cada recta vertical $x=a$ representa "todos los puntos posibles con abscisa $a$".
  Si la curva tiene dos puntos con la misma abscisa, esa recta corta la curva dos
  veces, lo que significa que $a$ tendría dos imágenes distintas: viola la unicidad.


  Una circunferencia falla el criterio (rectas verticales cerca del centro la cortan
  dos veces), mientras que una recta no vertical, una parábola con eje vertical, o
  cualquier curva "que suba y baje sin duplicarse en x" lo cumple.'
definiciones_clave: '- **Aplicación del criterio de la línea vertical para identificar
  funciones**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a aplicación del criterio de la línea vertical
  para identificar funciones.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a aplicación del criterio
    de la línea vertical para identificar funciones.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a aplicación del criterio de la
    línea vertical para identificar funciones.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    aplicación del criterio de la línea vertical para identificar funciones?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en representación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en representación de funciones. Es la condición
    de existencia y unicidad en aplicación del criterio de la línea vertical para
    identificar funciones.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en aplicación del criterio
    de la línea vertical para identificar funciones, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Imagina o traza rectas verticales a lo largo de todo el dominio visible
  de la curva.'
- 'Paso 2: Cuenta cuántas veces cada recta vertical corta la curva.'
- 'Paso 3: Si alguna recta corta la curva en más de un punto, la curva no representa
  una función.'
- 'Paso 4: Si toda recta vertical corta la curva en a lo más un punto, la curva sí
  representa una función.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar aplicación del criterio de la línea vertical para identificar funciones.
ejemplos:
- titulo: Aplicación a una parábola horizontal
  enunciado: Aplica el criterio de la línea vertical a la curva $x = y^2$.
  solucion_pasos:
  - Para $x=4$, tanto $y=2$ como $y=-2$ satisfacen la ecuación.
  - Una recta vertical en $x=4$ corta la curva en dos puntos.
  - No representa una función.
- titulo: Aplicación a una recta oblicua
  enunciado: Aplica el criterio de la línea vertical a la recta $y = 3x - 1$.
  solucion_pasos:
  - Cualquier recta vertical $x=a$ corta a esta recta en exactamente un punto.
  - Representa una función.
- titulo: ¿Una recta horizontal cumple el criterio de la línea vertical?
  enunciado: ¿Una recta horizontal cumple el criterio de la línea vertical?
  respuesta: Sí
  solucion_pasos:
  - Cada recta vertical corta a una recta horizontal en exactamente un punto, por
    lo que sí representa una función (constante).
- titulo: ¿Una recta vertical $x=k$ cumple el criterio de la línea vertical?
  enunciado: ¿Una recta vertical $x=k$ cumple el criterio de la línea vertical?
  respuesta: 'No'
  solucion_pasos:
  - La misma recta vertical $x=k$ coincide con la curva, "cortándola" en infinitos
    puntos; no representa una función.
errores_frecuentes:
- Aplicar el criterio con líneas horizontales en vez de verticales.
- Concluir que una curva es función revisando solo unas pocas rectas verticales, sin
  considerar todo el dominio.
- Confundir el criterio de la línea vertical (para funciones) con el de la línea horizontal
  (para inyectividad).
- Aplicar el criterio a un conjunto de puntos aislados sin considerar que cada punto
  ya define su propia recta vertical.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando aplicación
  del criterio de la línea vertical para identificar funciones.
