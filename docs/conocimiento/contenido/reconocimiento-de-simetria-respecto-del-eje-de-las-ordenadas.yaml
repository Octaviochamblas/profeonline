semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_SIMETRIA
resumen_inicial: Reconocer la simetría respecto del eje de las ordenadas permite identificar
  visualmente a las funciones pares en un gráfico.
explicacion_simple: 'Para verificar la **simetría axial respecto al eje $Y$** en una
  gráfica:

  - Imagina doblar la hoja de papel por la línea vertical del eje $Y$.

  - Si la curva del lado derecho se superpone exactamente punto por punto sobre la
  curva del lado izquierdo, la gráfica tiene simetría par.

  - Ejemplo: La parábola $y = x^2$ o la función valor absoluto $y = |x|$ son perfectamente
  simétricas respecto al eje $Y$.'
explicacion_formal: 'La simetría ortogonal de una gráfica $G(f)$ con respecto al eje
  de ordenadas $Y = \{(0, y) \mid y \in \mathbb{R}\}$ se expresa como:


  $$(x, y) \in G(f) \iff (-x, y) \in G(f)$$


  **Desglose de la fórmula:**

  - Para cada punto $(x, y)$ perteneciente al trazo, su punto reflejado $(-x, y)$
  a la misma altura pertenece también al trazo.'
definiciones_clave: '- **Simetría axial eje Y**: Isometría donde el eje de las ordenadas
  opera como eje de simetría de la figura gráfica.'
propiedades_relaciones: '- **Conservación de la ordenada**: Puntos simétricos a la
  derecha e izquierda tienen la misma coordenada $y$.'
ejemplo_guiado:
  enunciado: La gráfica de una función par contiene al punto $(4, 9)$. Determina la
    coordenada del punto simétrico que pertenece obligatoriamente al lado izquierdo
    del gráfico.
  pasos:
  - 'Paso 1: Recordar que la simetría par conserva la ordenada $y = 9$ e invierte
    el signo de la abscisa $x = 4$.Paso 2: Invertir el signo de $x$: de $4$ pasa a
    $-4$.Paso 3: Formar el punto reflejado en la gráfica: $(-4, 9)$.Paso 4: Concluir
    que el punto $(-4, 9)$ pertenece a la curva dada por la simetría par.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una función par pasa por el punto $(4, 9)$, ¿qué punto pertenece obligatoriamente
    a su gráfica?
  choices:
  - text: $(-4, 9)$
    is_correct: true
  - text: $(4, -9)$
    is_correct: false
  - text: $(-4, -9)$
    is_correct: false
  - text: $(9, 4)$
    is_correct: false
  explanation: La alternativa correcta es '$(-4, 9)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué función de valor absoluto presenta simetría axial respecto al eje
    Y?
  choices:
  - text: $f(x) = |x|$
    is_correct: true
  - text: $f(x) = |x - 3|$
    is_correct: false
  - text: $f(x) = x + 2$
    is_correct: false
  - text: $f(x) = \frac{1}{x}$
    is_correct: false
  explanation: La alternativa correcta es '$f(x) = |x|$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar un punto $(x, y)$ en el brazo derecho de la gráfica.'
- 'Paso 2: Buscar el punto reflejado a la izquierda a la misma altura $(-x, y)$.'
- 'Paso 3: Si todos los puntos reflejados pertenecen a la gráfica, confirmar la simetría
  con el eje $Y$.'
errores_correccion: '- **Error común:** Confundir la simetría con el eje Y con la
  simetría con el eje X.

  - **Cómo corregirlo:** La simetría con el eje X NO representa una función (fallaría
  la regla de unicidad de salida).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
fuente: Texto escolar MINEDUC — Álgebra / Simetrías y Funciones Especiales
estado: publicado
