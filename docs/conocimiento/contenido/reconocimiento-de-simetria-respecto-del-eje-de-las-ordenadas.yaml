procedimiento:
- 'Paso 1: Observa la gráfica de la función a ambos lados del eje $y$.'
- 'Paso 2: Verifica si el lado izquierdo es exactamente el reflejo especular del lado
  derecho.'
- 'Paso 3: Si se cumple esa simetría, la función es par.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar reconocimiento de simetría respecto del eje de las ordenadas.
ejemplos:
- titulo: Reconocimiento en una parábola
  enunciado: ¿Es simétrica respecto al eje $y$ la gráfica de $f(x)=x^2-4$?
  solucion_pasos:
  - El vértice está sobre el eje $y$ en $(0,-4)$.
  - Ambos lados de la parábola son reflejos exactos entre sí.
  - Sí, es simétrica respecto al eje $y$.
- titulo: Reconocimiento de ausencia de simetría par
  enunciado: ¿Es simétrica respecto al eje $y$ la gráfica de $f(x)=x^3$?
  solucion_pasos:
  - El lado izquierdo de la curva cúbica no coincide con el lado derecho al reflejarlo
    en el eje $y$.
  - No es simétrica respecto al eje $y$.
- titulo: ¿Una gráfica simétrica respecto al eje $y$ corresponde siempre a una función
    par?
  enunciado: ¿Una gráfica simétrica respecto al eje $y$ corresponde siempre a una
    función par?
  respuesta: Sí
  solucion_pasos:
  - Esa simetría geométrica es la traducción visual exacta de la condición algebraica
    $f(-x)=f(x)$.
- titulo: ¿La simetría de una función par es respecto al eje $x$?
  enunciado: ¿La simetría de una función par es respecto al eje $x$?
  respuesta: 'No'
  solucion_pasos:
  - La simetría de una función par es respecto al eje $y$ (vertical), no al eje $x$.
errores_frecuentes:
- Confundir la simetría respecto al eje $y$ (función par) con la simetría respecto
  al origen (función impar).
- Concluir paridad observando solo un segmento pequeño de la curva sin verificar toda
  la gráfica visible.
- Confundir simetría respecto al eje $x$ (que ni siquiera correspondería a una función)
  con la respecto al eje $y$.
- Suponer que toda parábola es necesariamente par, sin considerar desplazamientos
  horizontales.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando reconocimiento
  de simetría respecto del eje de las ordenadas.
