semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_SIMETRIA
resumen_inicial: 'El reconocimiento gráfico de una función par consiste en verificar que el eje de las ordenadas (eje Y) actúa como un eje de simetría axial reflexiva: $(x, y) \in \text{Graf}(f) \iff (-x, y) \in \text{Graf}(f)$.'
explicacion_simple: '![El reconocimiento gráfico de una función par consiste en verificar que el eje de las ordenadas (eje Y) actúa como un eje de simetría axial reflexiva: $(x, y) \in \text{Graf}(f) \iff (-x, y) \in \text{Graf}(f)$](/static/img/nodos/reconocimiento-de-simetria-respecto-del-eje-de-las-ordenadas-intro.svg)



  Para reconocer una función par mirando su gráfico:

  1. Mira la línea vertical del centro: el **eje $Y$**.

  2. Imagina que doblas la hoja de papel por ese eje vertical.

  3. **Criterio:** Si la rama de la derecha cae **exactamente encima** de la rama de la izquierda (como las alas de una mariposa), la función **es par**.

  4. Cada punto $(x, y)$ tiene a su gemelo $(-x, y)$ a la misma altura.'
explicacion_formal: 'Sea $\text{Graf}(f) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x)\}$. La simetría axial respecto al eje de ordenadas $Y = \{(0, y) \in \mathbb{R}^2\}$ se define mediante la transformación isométrica de reflexión horizontal $\mathcal{R}_Y$:

  $$\mathcal{R}_Y(x, y) = (-x, y)$$


  $$\text{Graf}(f) \text{ es simétrica al eje } Y \Longleftrightarrow \mathcal{R}_Y(\text{Graf}(f)) = \text{Graf}(f) \Longleftrightarrow f(-x) = f(x)$$


  **Propiedades geométricas observables:**

  - **Extremos simétricos**: Si hay un máximo local en $(x_0, y_0)$, existe un máximo local idéntico en $(-x_0, y_0)$.

  - **Cortes con el eje X**: Si corta en $(x_1, 0)$, corta obligatoriamente en $(-x_1, 0)$.'
definiciones_clave: '- **Simetría axial reflexiva**: Propiedad geométrica donde una recta divide a la figura en dos mitades congruentes y especulares.

  - **Eje de simetría $x = 0$**: Recta vertical de referencia que corresponde al eje $Y$.'
propiedades_relaciones: '- **Comportamiento en el origen**: Puede cortar al eje Y en cualquier altura $(0, n)$ sin perder la paridad.

  - **No inyectividad en $\mathbb{R}$**: Salvo funciones constantes triviales, ninguna función par no constante definida en $\mathbb{R}$ es inyectiva.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento gráfico de una función par consiste en verificar que el eje de las ordenadas (eje Y) actúa como un eje de simetría axial reflexiva: $(x, y) \in \text{Graf}(f) \iff (-x, y) \in \text{Graf}(f)$](/static/img/nodos/reconocimiento-de-simetria-respecto-del-eje-de-las-ordenadas-ejemplos.svg)



    Verifica gráficamente si la parábola $y = -2x^2 + 8$ es simétrica respecto al eje de las ordenadas identificando los pares de puntos para $x = 1, 2$.'
  pasos:
  - 'Paso 1: Evaluar en $x = 1$: $y = -2(1)^2 + 8 = 6 \implies (1, 6)$.'
  - 'Paso 2: Evaluar en $x = -1$: $y = -2(-1)^2 + 8 = 6 \implies (-1, 6)$ (misma altura $y = 6$).'
  - 'Paso 3: Evaluar en $x = 2$: $y = -2(2)^2 + 8 = 0 \implies (2, 0)$.'
  - 'Paso 4: Evaluar en $x = -2$: $y = -2(-2)^2 + 8 = 0 \implies (-2, 0)$ (cortes simétricos en el eje X).'
  - 'Paso 5: Concluir que el eje Y divide la parábola en dos ramas simétricas, confirmando que es una función par.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una gráfica es simétrica respecto al eje Y y contiene al punto (3, 7), ¿qué otro punto debe contener obligatoriamente?
  choices:
  - text: (-3, 7)
    is_correct: true
  - text: (3, -7)
    is_correct: false
  - text: (-3, -7)
    is_correct: false
  - text: (7, 3)
    is_correct: false
  explanation: La alternativa correcta es '(-3, 7)'. La reflexión horizontal transforma $(x, y) \to (-x, y)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Puede una función par no constante ser inyectiva en todos los números reales $\mathbb{R}$?
  choices:
  - text: No, porque siempre existen al menos dos preimagenes x y -x con la misma imagen.
    is_correct: true
  - text: Si, siempre es inyectiva.
    is_correct: false
  - text: Solo si la parabola abre hacia arriba.
    is_correct: false
  - text: Solo si pasa por el origen.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque siempre existen al menos dos preimagenes x y -x con la misma imagen.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el eje vertical $Y$ ($x = 0$) en la gráfica dada.'
- 'Paso 2: Seleccionar puntos sobre la curva en el semiplano derecho ($x > 0$).'
- 'Paso 3: Verificar que a la misma altura $y$ exista el punto simétrico con abscisa negativa $(-x)$.'
- 'Paso 4: Concluir si la gráfica posee simetría axial respecto al eje Y (función par).'
errores_correccion: '- **Error común:** Confundir una parábola con eje de simetría en $x = 3$ con una función par.

  - **Cómo corregirlo:** Para ser una función **par**, el eje de simetría **debe ser exactamente el eje $Y$ ($x = 0$)**, no otra recta vertical desplazada.'
ejemplos:
- titulo: 'Ejemplo 1: Parábola centrada'
  enunciado: La gráfica de $f(x) = x^2 - 9$ tiene su vértice en $(0, -9)$. ¿Es simétrica respecto al eje Y?
  alternativas:
  - Sí, el eje Y divide a la parábola en dos mitades especulares
  - No, porque el vértice está abajo
  - Es simétrica respecto al origen
  - Solo en los cortes con el eje X
  respuesta: Sí, el eje Y divide a la parábola en dos mitades especulares
  solucion_pasos:
  - 'Paso 1: El eje de la parábola es $x = 0$, luego es simétrica al eje Y.'
- titulo: 'Ejemplo 2: Gráfica en V centrada'
  enunciado: La gráfica de $y = |x| + 3$ tiene forma de V con vértice en $(0, 3)$. ¿Qué simetría tiene?
  alternativas:
  - Simetría axial respecto al eje Y
  - Simetría central respecto al origen
  - Simetría respecto a y = x
  - No tiene simetría
  respuesta: Simetría axial respecto al eje Y
  solucion_pasos:
  - 'Paso 1: Al reflejar por $x = 0$ la gráfica no cambia, es simetría respecto al eje Y.'
- titulo: 'Ejemplo 3: Parábola desplazada a la derecha'
  enunciado: La curva $y = (x - 4)^2$ tiene vértice en $(4, 0)$. ¿Es par?
  alternativas:
  - No, su eje de simetría es x = 4, no el eje Y
  - Sí, porque es una parábola
  - Es impar
  - Solo para x > 4
  respuesta: No, su eje de simetría es x = 4, no el eje Y
  solucion_pasos:
  - 'Paso 1: Al estar desplazada horizontalmente, no es simétrica respecto a $x = 0$.'
- titulo: 'Ejemplo 4: Campana de Gauss'
  enunciado: Una campana centrada en el eje vertical Y con asíntota $y = 0$, ¿qué tipo de función representa?
  alternativas:
  - Una función par
  - Una función impar
  - Una función lineal
  - Una función periódica
  respuesta: Una función par
  solucion_pasos:
  - 'Paso 1: Posee simetría de espejo respecto al eje Y, siendo par.'
errores_frecuentes:
- Asumir que toda parábola es una función par sin verificar la posición del vértice.
- Confundir la simetría par con la simetría impar.
- Invertir el signo de la coordenada y en lugar del signo de la coordenada x.
afirmaciones_verdaderas:
- Una gráfica es simétrica respecto al eje Y si y solo si representa a una función par.
- En una función par, los cortes con el eje X se presentan en pares simétricos (-a, 0) y (a, 0).
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar visualmente la simetría de una función respecto al eje de las ordenadas.


  **CÓMO:** Verificando que la reflexión horizontal (x, y) ⟷ (-x, y) conserva invariante la gráfica de la función.


  ![Resumen El reconocimiento gráfico de una función par consiste en verificar que el eje de las ordenadas (eje Y) actúa como un eje de simetría axial reflexiva: $(x, y) \in \text{Graf}(f) \iff (-x, y) \in \text{Graf}(f)$](/static/img/nodos/reconocimiento-de-simetria-respecto-del-eje-de-las-ordenadas-resumen.svg)'
