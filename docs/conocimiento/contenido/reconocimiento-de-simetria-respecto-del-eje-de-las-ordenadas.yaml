semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_SIMETRIA
resumen_inicial: 'Reconocimiento de simetría respecto del eje de las ordenadas: conceptos,
  representación y propiedades en Simetrías y funciones especiales.'
explicacion_simple: Si doblaras el papel exactamente sobre el eje vertical, la gráfica
  de una función par calzaría perfectamente consigo misma en ambos lados.
explicacion_formal: '### Definición formal


  Geométricamente, $f(-x)=f(x)$ significa que el punto $(-a, f(a))$ pertenece a la
  gráfica siempre que $(a, f(a))$ también pertenezca a ella. Esto equivale a que la
  gráfica completa sea invariante bajo la reflexión respecto al eje $y$.


  ### Desarrollo didáctico


  Para reconocer visualmente una función par, observa si existe un "espejo" vertical
  en $x=0$ tal que ambos lados de la curva sean idénticos.


  La parábola $f(x)=x^2$ es el ejemplo clásico: su lado izquierdo (para $x<0$) es
  un reflejo perfecto de su lado derecho (para $x>0$), con el eje $y$ como línea de
  simetría.'
definiciones_clave: '- **Reconocimiento de simetría respecto del eje de las ordenadas**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a reconocimiento de simetría respecto del
  eje de las ordenadas.'
