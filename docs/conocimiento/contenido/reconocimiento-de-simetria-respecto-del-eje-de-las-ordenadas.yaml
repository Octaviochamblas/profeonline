semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_SIMETRIA
resumen_inicial: El reconocimiento de la simetría respecto del eje de las ordenadas (eje $Y$) identifica visualmente la propiedad de las funciones pares.
explicacion_simple: |
  La **simetría respecto al eje $Y$** (eje vertical) funciona exactamente como un espejo vertical:

  - La mitad de la gráfica ubicada a la derecha del eje $Y$ es un **reflejo idéntico** de la mitad ubicada a la izquierda.
  - Si doblas el plano por la línea central vertical $x = 0$, las dos curvas coinciden punto por punto.
  - Esta simetría geométrica nos confirma que la función es **PAR** ($f(-x) = f(x)$).
explicacion_formal: |
  Sea $G_f = \{(x, f(x)) \mid x \in \text{Dom}(f)\} \subset \mathbb{R}^2$ la gráfica de una función. $G_f$ admite **simetría reflexiva respecto al eje de las ordenadas** si y solo si es invariante ante el operador de reflexión ortogonal $T_Y(x, y) = (-x, y)$:

  $$T_Y(G_f) = G_f \iff \forall (x, y) \in G_f \implies (-x, y) \in G_f$$

  **Consecuencia funcional:**
  $$f(x) = y = f(-x) \implies f \text{ es una función Par}$$
definiciones_clave: |
  - **Simetría respecto al eje $Y$**: Invariancia isométrica de la gráfica de una función bajo una reflexión especular respecto a la recta $x = 0$.
propiedades_relaciones: |
  - **Vértice o eje sobre el origen**: En funciones cuadráticas simétricas respecto al eje $Y$ ($f(x) = ax^2 + c$), el eje de simetría coincide exactamente con el eje $Y$.
ejemplo_guiado:
  enunciado: 'Verifica si la función $f(x) = |x| + 2$ presenta simetría respecto del eje de las ordenadas.'
  pasos:
    - 'Paso 1: Evaluar la función en $(-x)$: $f(-x) = |-x| + 2$.'
    - 'Paso 2: Aplicar la propiedad del valor absoluto $|-x| = |x|$: $f(-x) = |x| + 2$.'
    - 'Paso 3: Comparar con la función original: $f(-x) = f(x)$.'
    - 'Paso 4: Concluir que la gráfica en forma de "V" con vértice en $(0, 2)$ es perfectamente simétrica respecto al eje $Y$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad algebraica de una función queda demostrada cuando su gráfica es simétrica respecto al eje Y?'
    choices:
      - {text: 'Que la función es una función par ($f(-x) = f(x)$)', is_correct: true}
      - {text: 'Que la función es una función impar ($f(-x) = -f(x)$)', is_correct: false}
      - {text: 'Que la función es strictly inyectiva', is_correct: false}
      - {text: 'Que la función no tiene dominio en los reales negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la función es una función par ($f(-x) = f(x)$)''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si la gráfica de $f(x) = |x| + 2$ contiene el punto $(3, 5)$, ¿qué punto simétrico respecto al eje Y contiene la gráfica?'
    choices:
      - {text: 'El punto $(-3, 5)$', is_correct: true}
      - {text: 'El punto $(3, -5)$', is_correct: false}
      - {text: 'El punto $(-3, -5)$', is_correct: false}
      - {text: 'El punto $(5, 3)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto $(-3, 5)$''. La simetría en el eje Y mantiene la misma ordenada $y = 5$ invirtiendo el signo de $x$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Trazar el eje vertical $Y$ ($x = 0$) como eje de simetría.'
  - 'Paso 2: Elegir puntos arbitrarios de la gráfica en el semiplano positivo $x > 0$.'
  - 'Paso 3: Verificar que los puntos simétricos $(-x, y)$ pertenezcan a la gráfica en el semiplano negativo.'
  - 'Paso 4: Confirmar la simetría reflexiva respecto al eje $Y$.'
errores_correccion: |
  - **Error común:** Confundir la simetría del eje $Y$ con una traslación horizontal de la gráfica.
  - **Cómo corregirlo:** La simetría del eje $Y$ se produce **EXACTAMENTE EN LA LÍNEA CENTRAL $x = 0$**; si la gráfica se mueve a los lados ($f(x - 2)$) pierde la simetría con el eje $Y$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La simetría respecto del eje de las ordenadas indica que la función es impar.'
  - 'Una gráfica desplazada con eje de simetría en $x = 4$ es simétrica respecto al eje Y.'
  - 'El punto simétrico de $(5, 12)$ respecto al eje Y es $(-5, -12)$.'
  - 'Las funciones lineales con pendiente positiva presentan simetría reflexiva respecto al eje Y.'
  - 'Una curva simétrica respecto al eje Y es siempre una función inyectiva uno a uno.'
afirmaciones_verdaderas:
  - 'El reconocimiento de simetría respecto del eje $Y$ es equivalente a comprobar visual o algebraicamente que $f(-x) = f(x)$ para todo elemento del dominio.'
  - 'Para todo punto $(x, y)$ en la gráfica de una función simétrica respecto al eje $Y$, el punto $(-x, y)$ también pertenece a la gráfica.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e interpretar la simetría de una función respecto del eje de las ordenadas.
  CÓMO: Verificar el reflejo especular en $x = 0$ e identificar la correspondencia de puntos $(x, y) \leftrightarrow (-x, y)$.
