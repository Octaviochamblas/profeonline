semantic_id: MAT.NUM.PORCENTAJES.CALCULO_TOTAL
resumen_inicial: 'Cálculo del total dado un porcentaje: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: Si te dicen que $12.000 corresponde al 20% de un premio, ¿cuál era el
  premio completo? Aprender a reconstruir el pastel entero teniendo solo una rebanada es fundamental
  en finanzas.
explicacion_formal: 'Sabemos que el cálculo directo es $\text{Parte} = \text{Total} \cdot
  (c/100)$. Si lo que nos falta es el **Total**, debemos despejar la ecuación:


  $\text{Total} = \frac{\text{Parte}}{c} \cdot 100$


  Esto se puede razonar lógicamente en dos pasos:

  1. Al dividir la Parte entre el porcentaje $c$, estás averiguando **cuánto vale el 1%**.

  2. Al multiplicar ese resultado por 100, estás descubriendo **el 100%** (el Total).'
definiciones_clave: '- **Cálculo del total dado un porcentaje**: Elemento central dentro del
  estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del total dado un porcentaje.'
ejemplo_guiado:
  enunciado: Si 18.000 pesos corresponden al 15% de un premio, ¿cuál es el monto total del
    premio?
  pasos:
  - Identifico la Parte, 18.000, y el porcentaje que representa, 15.
  - 'Calculo el valor del 1%: 18.000 dividido entre 15 es igual a 1.200.'
  - 'Multiplico por 100 para obtener el total: 1.200 por 100 es igual a 120.000 pesos.'
