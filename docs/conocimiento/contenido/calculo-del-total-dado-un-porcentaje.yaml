resumen_inicial: 'El cálculo del total $N$ conocida una parte $V$ y su porcentaje
  correspondiente $c\%$ se obtiene dividiendo el valor $V$ entre el porcentaje decimal:
  $N = \frac{V \cdot 100}{c}$.'
explicacion_simple: Si sabemos cuánto vale una tajada (por ejemplo, que \$15.000 equivale
  al 30% del total) y queremos descubrir cuánto es el 100% completo, multiplicamos
  esa tajada por 100 y dividimos entre el porcentaje dado.
explicacion_formal: 'Dada una parte $V$ que corresponde al $c\%$ del total $N$, el
  **Cálculo del Total $N$ (100%)** se despeja de la proporción:


  $$\frac{V}{N} = \frac{c}{100} \implies N = \frac{V \cdot 100}{c} = \frac{V}{d}$$


  donde $d = \frac{c}{100}$ es la representación decimal del porcentaje.'
definiciones_clave: '- **Cálculo del total $N$**: Despeje del 100% mediante $N = \frac{V
  \cdot 100}{c}$.'
propiedades_relaciones: '- **Inversión del porcentaje**: $N = V / (c/100)$.'
ejemplo_guiado:
  enunciado: Si el $20\%$ de una cantidad es $45$, ¿cuál es la cantidad total?
  pasos:
  - 'Paso 1: Identificar el valor de la parte $V = 45$ y su porcentaje $c = 20\%$.'
  - 'Paso 2: Aplicar la fórmula del total: $N = \frac{45 \cdot 100}{20}$.'
  - 'Paso 3: Simplificar $100/20 = 5$ y calcular el producto: $N = 45 \cdot 5 = 225$.'
  - 'Conclusión: La cantidad total es $225$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja el total N (100%) sabiendo que una parte V equivale al
    c%?
  choices:
  - text: Multiplicando la parte por 100 y dividiendo entre el porcentaje c (N = (V
      · 100) / c)
    is_correct: true
  - text: Multiplicando N = V · c
    is_correct: false
  - text: Restando N = V - c
    is_correct: false
  - text: Dividiendo N = c / V
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando la parte por 100 y dividiendo
    entre el porcentaje c (N = (V · 100) / c)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado donde el 20% es 45, ¿cuál fue la cantidad total N?
  choices:
  - text: '225'
    is_correct: true
  - text: '90'
    is_correct: false
  - text: '450'
    is_correct: false
  - text: '180'
    is_correct: false
  explanation: La alternativa correcta es '225'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el total $N$ (100%) conocida
  una parte $V$ y su porcentaje $c\%$ aplicando $N = \frac{V \cdot 100}{c}$.
semantic_id: MAT.NUM.PORCENTAJES.CALCULO_TOTAL
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.CALCULO_TOTAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
