procedimiento:
- 'Paso 1: Identifica el valor de la Parte ($P$) y a qué porcentaje equivale ($c$).'
- 'Paso 2: Divide $P$ por $c$. Esto te da el valor del 1%.'
- 'Paso 3: Multiplica ese resultado por 100 para obtener el Total.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del total dado
  un porcentaje.
ejemplos:
- titulo: Adivinando el sueldo
  enunciado: Si ahorraste $15.000 y eso corresponde al 5% de tu sueldo, ¿cuánto es tu sueldo
    total?
  solucion_pasos:
  - Parte = $15.000, Porcentaje = 5.
  - 'Calculamos el 1%: $15.000 / 5 = 3.000$.'
  - 'Multiplicamos por 100: $3.000 \cdot 100 = 300.000$.'
  - El sueldo total es $300.000.
- titulo: Ejemplo 2
  enunciado: Si 8.000 corresponde al 20% de un monto, ¿cuál es el total?
  alternativas:
  - '40.000'
  - '1.600'
  - '160.000'
  respuesta: '40.000'
  solucion_pasos:
  - 8.000 dividido entre 20 es 400; 400 por 100 es 40.000.
- titulo: Ejemplo 3
  enunciado: Si 4.500 corresponde al 30% de un monto, ¿cuál es el total?
  alternativas:
  - '15.000'
  - '13.500'
  - '1.350'
  respuesta: '15.000'
  solucion_pasos:
  - 4.500 dividido entre 30 es 150; 150 por 100 es 15.000.
- titulo: ¿Para hallar el total, se calcula primero el valor del 1%?
  respuesta: Sí
  solucion_pasos:
  - Dividiendo la parte conocida por su porcentaje correspondiente.
errores_frecuentes:
- Multiplicar la Parte por el porcentaje en lugar de dividir (ej. calcular el 5% de 15.000
  en vez de usar 15.000 como base para hallar el total).
- Usar el número decimal ($0.05$) dividiendo, lo cual es matemáticamente correcto ($15000
  / 0.05$), pero la gente suele confundirse al dividir por decimales. El método del 1% es
  más seguro.
- Multiplicar la Parte por el porcentaje en vez de dividir, cuando en realidad se busca el
  Total.
- Confundirse al dividir por el número decimal del porcentaje en vez de usar el método del
  1%.
- Olvidar multiplicar por 100 después de haber calculado el valor de la unidad porcentual.
afirmaciones_verdaderas:
- La propiedad de cálculo del total dado un porcentaje preserva la consistencia lógica.
- Para hallar el total a partir de una parte y su porcentaje, se calcula primero el valor
  del 1% dividiendo la parte por el porcentaje dado.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del total dado
  un porcentaje.
