semantic_id: MAT.NUM.PORCENTAJES.CALC_TOTAL
resumen_inicial: El cálculo del total dado un porcentaje consiste en reconstruir el
  $100\%$ conociendo una parte $P$ y su porcentaje correspondiente $c\%$, dividiendo
  la parte por el factor decimal o aplicando $\text{Total} = \frac{P \cdot 100}{c}$.
explicacion_simple: '![Cálculo del total dado un porcentaje](/static/img/nodos/calculo-del-total-dado-un-porcentaje-intro.svg)


  A veces conoces la parte y el porcentaje, pero necesitas averiguar cuánto era el
  total original ($100\%$). Por ejemplo, si te dicen que el $20\%$ de un sueldo son
  $\$15.000$, para encontrar el sueldo total solo debes **dividir la cantidad entre
  el decimal del porcentaje**: $\$15.000 \div 0,20 = $\$75.00$0$. Como $20\%$ es la
  quinta parte, el total es simplemente $5$ veces esa cantidad.

  '
explicacion_formal: '### Despeje algebraico de la ecuación fundamental

  A partir de la relación fundamental de porcentaje:

  $$c\% \cdot T = P \implies \left(\frac{c}{100}\right) \cdot T = P$$

  Despejando la cantidad base total $T$:

  $$T = \frac{P}{\frac{c}{100}} = \frac{P \cdot 100}{c} = \frac{P}{c_{\text{dec}}}$$


  ### Interpretación por regla de tres

  $$\begin{aligned}

  c\% &\longrightarrow P \\

  100\% &\longrightarrow T

  \end{aligned} \implies T = \frac{P \cdot 100}{c}$$


  ### Verificación de orden de magnitud

  Para cualquier porcentaje $c < 100\%$, el total resultante $T$ debe ser estrictamente
  mayor que la parte conocida $P$ ($T > P$).

  '
definiciones_clave: '- **Reconstrucción del 100%**: Proceso inverso de determinar
  la base original a partir de una cuota conocida.

  - **Inverso multiplicativo de la tasa**: Factor $\frac{100}{c}$ que al multiplicarse
  por la parte restituye el total.

  - **Constante unitaria porcentual**: Valor correspondiente al $1\%$ del total ($u
  = \frac{P}{c}$), tal que $T = 100 \cdot u$.

  '
propiedades_relaciones: '- **Proporcionalidad inversa con la tasa**: Para una misma
  parte $P$, a menor porcentaje $c\%$, mayor es el total original $T$.

  - **Multiplicación por el recíproco**: Si el porcentaje es una fracción notable
  $\frac{1}{k}$, el total es simplemente $k \cdot P$.

  '
ejemplo_guiado:
  enunciado: Si el $35\%$ de los asistentes a un evento son $42$ personas, ¿cuántas
    personas asistieron en total al evento?
  pasos:
  - 'Paso 1: Identificamos los datos: la parte $P = 42$ y su tasa porcentual $c =
    35\%$.'
  - 'Paso 2: Planteamos la fórmula del total: $T = \frac{P \cdot 100}{c} = \frac{42
    \cdot 100}{35}$.'
  - 'Paso 3: Simplificamos y calculamos: $\frac{4.200}{35} = 120$.'
  - 'Paso 4: Comprobación: $35\% \text{ de } 120 = 0,35 \cdot 120 = 42$.'
  - 'Paso 5: Conclusión: Al evento asistieron en total **120 personas**.'
  imagen: /static/img/nodos/calculo-del-total-dado-un-porcentaje-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si el $20\%$ de una cantidad es $18$, ¿cuál es el total (100%)?
  choices:
  - text: $90$
    is_correct: true
  - text: $3,6$
    is_correct: false
  - text: $360$
    is_correct: false
  - text: $45$
    is_correct: false
  explanation: La alternativa correcta es $90$. $T = \frac{18 \cdot 100}{20} = 18
    \cdot 5 = 90$ (o $18 \div 0,20 = 90$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un estudiante pagó $\$24.000$ por un libro que tenía un $25\%$ de descuento
    (pagó el $75\%$ del precio original). ¿Cuál era el precio original del libro?
  choices:
  - text: $\$32.000$
    is_correct: true
  - text: $\$30.000$
    is_correct: false
  - text: $\$18.000$
    is_correct: false
  - text: $\$48.000$
    is_correct: false
  explanation: La alternativa correcta es $\$32.000$. $T = \frac{24.000}{0,75} = 24.000
    \cdot \frac{4}{3} = $\$32.00$0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte conocida ($P$) y el porcentaje que representa ($c\%$).'
- 'Paso 2: Convertir el porcentaje a su expresión decimal ($c_{\text{dec}} = c \div
  100$).'
- 'Paso 3: Dividir la parte por la expresión decimal ($T = P \div c_{\text{dec}}$)
  o aplicar $T = \frac{P \cdot 100}{c}$.'
- 'Paso 4: Verificar que el total $T$ obtenido sea cuantitativamente coherente y mayor
  que $P$.'
errores_correccion: '- **Error 1:** Multiplicar la parte por el porcentaje en lugar
  de dividir (ej: $15.000 \cdot 0,20 = 3.000$ en vez de $15.000 \div 0,20 = 75.000$).
  **Cómo corregirlo:** Para encontrar el total **SIEMPRE se divide la parte entre
  la tasa decimal**.

  - **Error 2:** Confundir el porcentaje de descuento con el porcentaje efectivamente
  pagado.

  '
ejemplos:
- titulo: Cálculo del total con tasa notable
  enunciado: ¿Si el $25\%$ de una deuda es $\$50.000$, la deuda total es $\$200.000$?
  alternativas:
  - Sí, porque $25\%$ es la cuarta parte ($50.000 \cdot 4 = 200.000$)
  - No, es $\$12.500$
  - No, es $\$100.000$
  - No, es $\$250.000$
  respuesta: Sí, porque $25\%$ es la cuarta parte ($50.000 \cdot 4 = 200.000$)
  solucion_pasos:
  - 1. $25\% = \frac{1}{4}$.
  - 2. El total es $4 \cdot 50.000 = $\$200.00$0$.
- titulo: Cálculo del total con tasa general
  enunciado: ¿Si el $40\%$ de una cantidad es $60$, el total es $150$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $T = 60 \div 0,40 = 150$.
- titulo: Cálculo con tasa unitaria
  enunciado: ¿Si el $1\%$ de un valor es $8$, el total $100\%$ es $800$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $T = 8 \cdot 100 = 800$.
- titulo: Cálculo con tasa mayor al 100%
  enunciado: ¿Si el $120\%$ de una cantidad es $240$, el total original al $100\%$
    es $200$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $T = 240 \div 1,20 = 200$.
errores_frecuentes:
- Multiplicar la parte por el porcentaje en vez de dividir para hallar el total.
- Olvidar que el total debe ser mayor que la parte (para c < 100%).
- Usar el porcentaje complementario incorrecto en problemas de descuento o recargo.
afirmaciones_verdaderas:
- Para calcular el total conociendo una parte y su porcentaje, se divide la parte
  entre la tasa decimal (T = P / c_dec).
- Si el 50% de una cantidad es K, el total es exactamente 2K.
al_terminar_debes_poder: '![Resumen de cálculo del total dado un porcentaje](/static/img/nodos/calculo-del-total-dado-un-porcentaje-resumen.svg)


  QUÉ: Reconstruir la totalidad ($100\%$) a partir del conocimiento de una parte cuantitativa
  y su porcentaje asociado.

  CÓMO: Aplicando el despeje $T = \frac{P \cdot 100}{c} = P \div c_{\text{dec}}$,
  verificando que la magnitud resultante supere a la parte dada.

  '
