semantic_id: MAT.NUM.PORCENTAJES.CALCULO_TOTAL
resumen_inicial: 'El cálculo del total $C$ a partir de un valor parcial $P$ y su porcentaje correspondiente $p\%$ determina la base completa mediante la fórmula $C = \frac{P \cdot 100}{p} = \frac{P}{d}$.'
explicacion_simple: |
  Si conoces cuánto vale una parte y qué porcentaje representa (por ejemplo, si te dicen que $\$12.000$ es el $20\%$ de tu sueldo), para encontrar el dinero total ($100\%$):
  1. Divides el dinero de la parte entre el número del porcentaje ($12.000 \div 20 = 600$). Ese resultado es lo que vale el $1\%$.
  2. Multiplicas ese resultado por 100 para hallar el $100\%$ total ($600 \cdot 100 = \$600.000$).
  También puedes dividir directamente el valor parcial entre su decimal: $12.000 \div 0,20 = \$600.000$.
explicacion_formal: |
  ### Definición formal
  La **cantidad total o base de referencia $C$** de un sistema porcentual donde un valor parcial conocido $P$ corresponde al $p\%$ se obtiene invirtiendo la función de valor parcial:
  $$P = \left(\frac{p}{100}\right) \cdot C \implies C = \frac{P \cdot 100}{p} = \frac{P}{d} \quad (p > 0)$$

  ### Deducción por regla de tres simple directa
  Conociendo que la parte $P$ equivale a la tasa $p\%$:
  $$\begin{array}{ccc} \text{Cantidad} & & \text{Porcentaje} \\ P & \longrightarrow & p\% \\ C & \longrightarrow & 100\% \end{array} \implies C = \frac{P \cdot 100}{p}$$

  ### Análisis operacional mediante valor unitario ($1\%$)
  1. **Cálculo del valor del $1\%$**:
     $$V_{1\%} = \frac{P}{p}$$
  2. **Escalamiento al $100\%$**:
     $$C = V_{1\%} \cdot 100 = \left(\frac{P}{p}\right) \cdot 100$$

  ### Síntesis didáctica
  - Ecuación fundamental del total: $C = \frac{P \cdot 100}{p}$.
  - Alternativa decimal: $C = \frac{P}{d}$.
definiciones_clave: |
  - **Cantidad total ($C$)**: Base completa correspondiente al $100\%$ de la población o valor monetario.
  - **Inversión del operador porcentual**: División de la parte entre el decimal $d$ para reconstruir el todo.
  - **Valor unitario percentil ($V_{1\%}$)**: Magnitud correspondiente a 1 punto porcentual de la base.
propiedades_relaciones: |
  - **Monotonía directa con la parte**: Para un porcentaje fijo $p\%$, a mayor valor de la parte parcial $P$, mayor es el total de referencia $C$ reconstruido.
  - **Relación inversa con el porcentaje**: Para una misma parte parcial $P$, si el porcentaje $p\%$ es más pequeño, el total $C$ reconstruido es significativamente mayor.
ejemplo_guiado:
  enunciado: 'En una tienda, el $25\%$ de los productos están en oferta, lo que equivale a $40$ artículos. ¿Cuántos artículos en total tiene la tienda?'
  pasos:
    - 'Paso 1: Identificamos el valor parcial $P = 40$ y el porcentaje que representa $p = 25\%$.'
    - 'Paso 2: Escribimos la fórmula para despejar el total: $C = \frac{P \cdot 100}{p} = \frac{40 \cdot 100}{25}$.'
    - 'Paso 3: Simplificamos $\frac{100}{25} = 4$: $C = 40 \cdot 4$.'
    - 'Paso 4: Multiplicamos: $C = 160$. La tienda tiene en total **160 artículos**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la cantidad total $C$ cuando se conoce que una parte $P$ equivale al $p\%$?'
    choices:
      - {text: 'Multiplicar la parte $P$ por 100 y dividir el producto entre el porcentaje $p$ ($C = \frac{P \cdot 100}{p}$)', is_correct: true}
      - {text: 'Multiplicar la parte $P$ por el porcentaje $p$ y dividir entre 100', is_correct: false}
      - {text: 'Restar la parte $P$ al porcentaje $p$', is_correct: false}
      - {text: 'Dividir el porcentaje $p$ entre la parte $P$', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar la parte $P$ por 100 y dividir el producto entre el porcentaje $p$ ($C = \frac{P \cdot 100}{p}$)''. Se despeja la base $C$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $\$15.000$ representan el $30\%$ del dinero ahorrado por una persona, ¿cuál es el monto total de sus ahorros?'
    choices:
      - {text: '$\$50.000$, calculando $\frac{15.000 \cdot 100}{30} = 500 \cdot 100 = 50.000$', is_correct: true}
      - {text: '$\$4.500$, multiplicando $15.000 \cdot 0.30$', is_correct: false}
      - {text: '$\$45.000$, aproximando la cifra', is_correct: false}
      - {text: '$\$150.000$, multiplicando por 10', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$50.000$, calculando $\frac{15.000 \cdot 100}{30} = 500 \cdot 100 = 50.000$''. $C = 15.000 / 0.30 = 50.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el valor parcial $P$ y el tanto por ciento $p\%$ que le corresponde.'
  - 'Paso 2: Dividir la parte entre el porcentaje $p$ para hallar el valor del $1\%$ ($V_{1\%} = \frac{P}{p}$).'
  - 'Paso 3: Multiplicar el valor del $1\%$ por 100 para obtener el total $C$ ($C = V_{1\%} \cdot 100$).'
  - 'Paso 4: Alternativamente, dividir la parte entre la forma decimal del porcentaje ($C = \frac{P}{d}$).'
errores_correccion: |
  - **Error 1:** Multiplicar la parte por el porcentaje como si se estuviera pidiendo el valor parcial (ej: calcular el $30\%$ de $15.000$ en lugar de despejar el total). **Cómo corregirlo:** Si la cantidad dada **ES la parte**, debes **DIVIDIR entre el porcentaje**, jamás multiplicar.
  - **Error 2:** Dividir el porcentaje entre la parte parcial. **Cómo corregirlo:** La parte $P$ va en el numerador multiplicada por 100: **$C = \frac{P \cdot 100}{p}$**.
ejemplos:
  - titulo: 'Cálculo del total dado el 50%'
    enunciado: 'Si 40 alumnos representan el $50\%$ de un curso, ¿el total de alumnos es 80?'
    alternativas:
      - 'Sí, pues $(40 \cdot 100) / 50 = 80$'
      - 'No, el total es 20'
      - 'No, el total es 100'
    respuesta: 'Sí, pues $(40 \cdot 100) / 50 = 80$'
    solucion_pasos:
      - '1. Formulamos $C = (40 \cdot 100) / 50$.'
      - '2. Calculamos: $C = 40 \cdot 2 = 80\text{ alumnos}$.'
  - titulo: 'Cálculo del total dado el 10%'
    enunciado: 'Si $\$7.000$ es el $10\%$ de un presupuesto, ¿el total es $\$70.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $7.000 / 0,10 = \$70.000$.'
  - titulo: 'Cálculo del total dado el 25% (cuarta parte)'
    enunciado: 'Si 15 personas representan el $25\%$ de un recinto, ¿el total de personas es 60?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $15 \cdot 4 = 60\text{ personas}$.'
  - titulo: 'Cálculo del total dado un porcentaje mayor al 100%'
    enunciado: 'Si $\$180$ es el $200\%$ de una suma inicial, ¿el total inicial es $\$90$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $180 / 2 = 90$.'
errores_frecuentes:
  - 'Multiplicar la parte conocida por el porcentaje creyendo que se busca una cuota parcial.'
  - 'Dividir el porcentaje entre la parte parcial en lugar de dividir la parte entre el porcentaje.'
  - 'Dividir la parte entre el porcentaje entrega directamente el total $C$ sin multiplicar por 100.'
  - 'El valor parcial $P$ y el total $C$ se ubican de forma intercambiable en la regla de tres.'
  - 'El total $C$ calculado debe ser siempre un valor numérico menor que la parte dada.'
afirmaciones_verdaderas:
  - 'La cantidad total $C$ se calcula dividiendo la parte conocida $P$ por la forma decimal del porcentaje ($C = \frac{P}{d}$).'
  - 'Conocer el valor parcial $P$ y su porcentaje $p\%$ permite hallar el $1\%$ dividiendo $\frac{P}{p}$ y luego multiplicar por 100.'
al_terminar_debes_poder: 'Reconstruir la cantidad total $C$ cuando se conoce una parte parcial $P$ y su porcentaje $p\%$ mediante $C = \frac{P \cdot 100}{p}$.'
