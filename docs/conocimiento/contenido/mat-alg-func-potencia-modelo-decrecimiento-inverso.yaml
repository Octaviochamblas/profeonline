semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.DECRECIMIENTO_INVERSO
resumen_inicial: 'El decrecimiento inverso modelado por funciones potencia de exponente negativo $f(x) = a x^{-m} = \frac{a}{x^m}$ ($m \in \mathbb{Z}^+$) describe fenómenos donde la salida disminuye al aumentar la entrada.'
explicacion_simple: |
  Muchas leyes físicas y económicas siguen un patrón donde al aumentar la variable independiente, la variable respuesta disminuye velozmente. Esto se modela con funciones potencia de exponente negativo $f(x) = \frac{a}{x^m}$. Un ejemplo clásico es la ley del cuadrado inverso ($m = 2$), como la intensidad del sonido o la gravedad: si nos alejamos al doble de distancia de un parlante ($2d$), la intensidad del sonido no disminuye a la mitad, sino a la cuarta parte ($\frac{1}{2^2} = \frac{1}{4}$).
explicacion_formal: |
  ### Definición formal
  El **decrecimiento inverso de una función potencia** $f(x) = a x^n$ con $a > 0$ y exponente entero negativo **$n = -m$ ($m \in \mathbb{Z}^+$)** se rige por la reescritura recíproca:
  $$f(x) = \frac{a}{x^m} \quad (\text{para } x > 0)$$
  caracterizada analíticamente por una tasa de variación estrictamente negativa y decreciente:
  $$\frac{df}{dx} = -\frac{m \cdot a}{x^{m+1}} < 0 \quad (\text{para todo } x > 0)$$

  ### Ley del Cuadrado Inverso ($m = 2$)
  En fenómenos de propagación esférica (luz, sonido, gravedad, fuerza electrostática):
  $$I(d) = \frac{k}{d^2}$$
  - Si la distancia se multiplica por $c \implies I(c \cdot d) = \frac{k}{(c d)^2} = \frac{1}{c^2} \cdot \frac{k}{d^2} = \frac{1}{c^2} I(d)$.
  - Al duplicar la distancia ($c = 2$), la intensidad cae a $\frac{1}{4}$ de su valor.
  - Al triplicar la distancia ($c = 3$), la intensidad cae a $\frac{1}{9}$ de su valor.

  ### Síntesis didáctica
  Comparativa de modelos de decrecimiento:
  - Decrecimiento Inverso Lineal ($m = 1$): $y = \frac{k}{x} \implies$ Duplicar $x$ reduce $y$ a la mitad ($\frac{1}{2}$).
  - Decrecimiento Inverso Cuadrático ($m = 2$): $y = \frac{k}{x^2} \implies$ Duplicar $x$ reduce $y$ a la cuarta parte ($\frac{1}{4}$).
definiciones_clave: |
  - **Decrecimiento inverso**: Disminución no lineal de la respuesta provocada por la variable en el denominador.
  - **Ley del cuadrado inverso**: Ley física donde la intensidad es inversamente proporcional a la distancia elevada al cuadrado ($x^{-2}$).
  - **Factor de atenuación $\frac{1}{c^m}$**: Proporción en la que se reduce la salida al multiplicar la entrada por $c$.
propiedades_relaciones: |
  - **Comportamiento Asintótico**: Cuando $x \to +\infty$, el modelo decae tendiendo asintóticamente a cero ($y \to 0^+$).
  - **Divergencia cerca del origen**: Cuando $x \to 0^+$, la salida explota hacia $+\infty$.
ejemplo_guiado:
  enunciado: 'La intensidad de iluminación de un foco varía inversamente con el cuadrado de la distancia según el modelo $I(d) = \frac{100}{d^2}$, donde $d$ está en metros e $I$ en luxes. Calcula la intensidad a $2$ metros y a $6$ metros de distancia, e interpreta el decrecimiento inverso cuadrático.'
  pasos:
    - 'Paso 1: Evaluamos a $d = 2$: $I(2) = \frac{100}{2^2} = \frac{100}{4} = 25$ luxes.'
    - 'Paso 2: Evaluamos a $d = 6$: $I(6) = \frac{100}{6^2} = \frac{100}{36} \approx 2.78$ luxes.'
    - 'Paso 3: Observamos que al triplicar la distancia de $2$ a $6$ metros (factor $c = 3$), la intensidad disminuye por el factor $\frac{1}{3^2} = \frac{1}{9}$.'
    - 'Paso 4: Conclusión: $25 \cdot \frac{1}{9} \approx 2.78$ luxes, confirmando la ley del cuadrado inverso.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Según la ley del cuadrado inverso dada por $f(r) = \frac{k}{r^2}$, ¿qué le ocurre a la fuerza de atracción entre dos masas si la distancia $r$ entre sus centros se cuadruplica ($r \to 4r$)?'
    choices:
      - {text: 'La fuerza se reduce a la decimosexta parte ($\frac{1}{16}$) de su valor original, pues $\frac{1}{4^2} = \frac{1}{16}$', is_correct: true}
      - {text: 'La fuerza se reduce a la cuarta parte ($\frac{1}{4}$) de su valor original', is_correct: false}
      - {text: 'La fuerza se multiplica por $16$', is_correct: false}
      - {text: 'La fuerza permanece inalterada', is_correct: false}
    explanation: 'La alternativa correcta es ''La fuerza se reduce a la decimosexta parte ($\frac{1}{16}$) de su valor original, pues $\frac{1}{4^2} = \frac{1}{16}$''. Cuadruplicar la entrada ($c = 4$) atenia la salida por $\frac{1}{c^2} = \frac{1}{16}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un modelo de presión inversamente proporcional al volumen $P(V) = \frac{k}{V}$ (exponente $-1$), ¿qué le sucede a la presión si el volumen del gas se triplica?'
    choices:
      - {text: 'La presión disminuye a la tercera parte ($\frac{1}{3}$) de su valor inicial', is_correct: true}
      - {text: 'La presión disminuye a la novena parte ($\frac{1}{9}$) de su valor inicial', is_correct: false}
      - {text: 'La presión se triplica', is_correct: false}
      - {text: 'La presión disminuye a cero inmediatamente', is_correct: false}
    explanation: 'La alternativa correcta es ''La presión disminuye a la tercera parte ($\frac{1}{3}$) de su valor inicial''. Para exponente $-1$, la atenuación es directamente $\frac{1}{c} = \frac{1}{3}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente negativo $n = -m$ ($m \ge 1$) en el modelo de potencia $f(x) = a x^{-m} = \frac{a}{x^m}$.'
  - 'Paso 2: Reconocer que la respuesta $y$ disminuye de forma no lineal al aumentar la variable $x$.'
  - 'Paso 3: Aplicar el factor de atenuación $\frac{1}{c^m}$ cuando la entrada se multiplica por $c$.'
  - 'Paso 4: Analizar la convergencia asintótica a cero para valores muy grandes de $x$.'
errores_correccion: |
  - **Error 1:** Creer que en la ley del cuadrado inverso ($y = \frac{k}{x^2}$), duplicar la distancia reduce la magnitud a la mitad. **Cómo corregirlo:** La reducción a la mitad ocurre en el decrecimiento inverso simple ($y = \frac{k}{x}$). En el cuadrado inverso, duplicar reduce a la **cuarta parte** ($\frac{1}{2^2} = \frac{1}{4}$).
  - **Error 2:** Confundir el decrecimiento inverso de potencia con un decrecimiento lineal de resta constante. **Cómo corregirlo:** En el decrecimiento inverso la tasa de bajada se desacelera tendiendo asintóticamente a cero sin llegar a cruzar el eje $x$ para $x > 0$.
ejemplos:
  - titulo: 'Cuadrado inverso en sonido'
    enunciado: 'En $I(d) = \frac{k}{d^2}$, ¿al duplicar la distancia la intensidad decae a $\frac{1}{4}$?'
    alternativas:
      - 'Sí, por la potencia $2^2$ en el denominador'
      - 'No, decae a la mitad'
      - 'No, decae a la octava parte'
    respuesta: 'Sí, por la potencia $2^2$ en el denominador'
    solucion_pasos:
      - '1. Factor de atenuación: $\frac{1}{c^2} = \frac{1}{2^2} = \frac{1}{4}$.'
      - '2. La intensidad decae a la cuarta parte.'
  - titulo: 'Inverso simple en tiempo de trabajo'
    enunciado: 'Si $T(n) = \frac{24}{n}$, ¿al triplicar los trabajadores el tiempo decae a $\frac{1}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exponente $-1 \implies \frac{1}{3}$ del tiempo inicial.'
  - titulo: 'Comportamiento en el infinito'
    enunciado: 'En $f(x) = \frac{50}{x^2}$, ¿cuándo $x \to +\infty$ la función se aproxima a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La asíntota horizontal $y = 0$ frena el decrecimiento en el infinito.'
  - titulo: 'Atenuación en potencia cubo inverso'
    enunciado: 'En $g(x) = \frac{k}{x^3}$, ¿si $x$ se duplica, la salida decae a $\frac{1}{8}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{1}{2^3} = \frac{1}{8}$.'
