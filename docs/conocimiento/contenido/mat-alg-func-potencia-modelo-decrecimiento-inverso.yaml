semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.DECRECIMIENTO_INVERSO
resumen_inicial: 'Interpretación de relaciones inversas mediante funciones potencia
  de exponente negativo: forma general $f(x) = a x^n$, simetría, dominio y recorrido
  en Modelamiento y aplicaciones en contexto.'
explicacion_simple: Muchos fenómenos físicos, como la intensidad de la luz o la fuerza
  gravitacional, disminuyen a medida que aumenta la distancia, siguiendo un modelo
  de exponente negativo.
explicacion_formal: '### Definición formal


  En un modelo $y=a\cdot x^{-n}=a/x^n$ con $a>0$, $x>0$ y $n$ entero positivo, la
  magnitud $y$ disminuye a medida que $x$ aumenta, acercándose a $0$ sin llegar a
  alcanzarlo, típico de relaciones inversamente proporcionales.


  ### Desarrollo didáctico


  La intensidad luminosa a distancia $d$ de una fuente sigue $I(d)=k/d^2$: al duplicar
  la distancia, la intensidad se reduce a un cuarto de su valor original, ya que $I(2d)=k/(2d)^2=k/(4d^2)=I(d)/4$.'
definiciones_clave: '- **Interpretación de relaciones inversas mediante funciones
  potencia de exponente negativo**: Función de la forma $f(x) = a x^n$ con $a \neq
  0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a interpretación de relaciones inversas mediante funciones potencia
  de exponente negativo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de interpretación de relaciones inversas mediante funciones potencia de exponente
    negativo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de interpretación de relaciones
    inversas mediante funciones potencia de exponente negativo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
