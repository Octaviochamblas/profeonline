semantic_id: MAT.GEO.TRIANGULOS_NOTABLES.TRIANGULO_30_60_90
resumen_inicial: 'El triángulo notable $30^\circ-60^\circ-90^\circ$ es la mitad de
  un triángulo equilátero, donde el cateto menor opuesto a $30^\circ$ mide $L$, el
  cateto mayor opuesto a $60^\circ$ mide $L\sqrt{3}$ y la hipotenusa mide $2L$, con
  razón $1 : \sqrt{3} : 2$.'
explicacion_simple: '![Triángulo 30-60-90](/static/img/nodos/relacion-de-lados-en-el-triangulo-notable-30-60-90-intro.svg)


  Si partes un triángulo equilátero por la mitad con una línea vertical (su altura),
  obtienes dos **triángulos notables de $30^\circ-60^\circ-90^\circ$**. Sus tres lados
  tienen una regla muy fácil de memorizar:


  - Frente al ángulo chico de **$30^\circ$** está el **cateto menor** ($L$).

  - Frente al ángulo recto de **$90^\circ$** está la **hipotenusa**, que es **el doble**
  ($2L$).

  - Frente al ángulo mediano de **$60^\circ$** está el **cateto mayor**, que mide
  **$L\sqrt{3}$**.

  '
explicacion_formal: '### Definición formal

  El triángulo notable de ángulos interiores $\{30^\circ, 60^\circ, 90^\circ\}$ es
  el semi-triángulo equilátero resultante de bisecar un triángulo equilátero de lado
  $2k$ por una de sus alturas. Sus lados guardan la proporción métrica universal:


  $$\text{Lados} = \{k, \; k\sqrt{3}, \; 2k\} \quad (k > 0)$$


  $$\text{Cateto Menor } (30^\circ) = k, \quad \text{Cateto Mayor } (60^\circ) = k\sqrt{3},
  \quad \text{Hipotenusa } (90^\circ) = 2k$$


  ### Desglose simbólico y geométrico

  - Proporción $1 : \sqrt{3} : 2$.

  - Cateto menor opuesto a $30^\circ$: Mide exactamente la mitad de la hipotenusa
  ($k = c/2$).

  - Cateto mayor opuesto a $60^\circ$: Mide el cateto menor multiplicado por $\sqrt{3}$
  ($b = k\sqrt{3}$).

  - Razones trigonométricas exactas: $\sin 30^\circ = \frac{1}{2}$, $\cos 30^\circ
  = \frac{\sqrt{3}}{2}$, $\sin 60^\circ = \frac{\sqrt{3}}{2}$, $\cos 60^\circ = \frac{1}{2}$.


  ### Síntesis didáctica

  El triángulo $30^\circ-60^\circ-90^\circ$ es el triángulo notable más importante
  de la geometría y la física vectorial, base del cálculo de componentes vectoriales
  exactas y alturas equiláteras.'
definiciones_clave: '- **Triángulo 30°-60°-90°**: Mitad de un triángulo equilátero
  con ángulos de $30^\circ$, $60^\circ$ y $90^\circ$.

  - **Razón notable**: Proporción constante de lados $1 : \sqrt{3} : 2$.

  - **Cateto menor**: Lado opuesto al ángulo de $30^\circ$, equivalente a la mitad
  de la hipotenusa ($L = c/2$).

  - **Cateto mayor**: Lado opuesto al ángulo de $60^\circ$, equivalente a $L\sqrt{3}$.

  '
propiedades_relaciones: '- **De cateto menor a hipotenusa**: Multiplicar por 2 ($c
  = 2L$).

  - **De cateto menor a cateto mayor**: Multiplicar por $\sqrt{3}$ ($b = L\sqrt{3}$).

  - **Área directa**: $A = \frac{L \cdot L\sqrt{3}}{2} = \frac{L^2\sqrt{3}}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo 30-60-90](/static/img/nodos/relacion-de-lados-en-el-triangulo-notable-30-60-90-ejemplos.svg)


    En un triángulo rectángulo, uno de los ángulos agudos mide $30^\circ$ y el cateto
    opuesto a dicho ángulo mide $7\text{ cm}$. Calcula la longitud de la hipotenusa
    y la longitud del otro cateto.

    '
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo: al tener ángulos de $30^\circ$ y $90^\circ$,
    el tercer ángulo es $60^\circ$ (triángulo $30^\circ-60^\circ-90^\circ$).'
  - 'Paso 2: Reconocer el cateto menor: como está opuesto a $30^\circ$, $L = 7\text{
    cm}$.'
  - 'Paso 3: Calcular la hipotenusa multiplicando el cateto menor por 2: $c = 2L =
    2(7) = 14\text{ cm}$.'
  - 'Paso 4: Calcular el cateto mayor (opuesto a $60^\circ$) multiplicando por $\sqrt{3}$:
    $b = L\sqrt{3} = 7\sqrt{3}\text{ cm}$.'
  - 'Paso 5: Concluir que la hipotenusa mide $14\text{ cm}$ y el cateto mayor mide
    $7\sqrt{3}\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En el triángulo notable 30°-60°-90°, ¿cuál es la relación entre el cateto
    opuesto a 30° y la hipotenusa?
  choices:
  - text: El cateto opuesto a $30^\circ$ mide exactamente la mitad de la hipotenusa
      ($L = c / 2$)
    is_correct: true
  - text: El cateto opuesto a $30^\circ$ es igual a la hipotenusa
    is_correct: false
  - text: El cateto opuesto a $30^\circ$ mide el doble de la hipotenusa
    is_correct: false
  - text: No guardan ninguna relación fija
    is_correct: false
  explanation: Por provenir del triángulo equilátero, el cateto opuesto a $30^\circ$
    mide exactamente la mitad de la hipotenusa ($L = c / 2$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la hipotenusa de un triángulo 30°-60°-90° mide 18 cm, ¿cuánto miden
    sus dos catetos?
  choices:
  - text: $9\text{ cm}$ (opuesto a $30^\circ$) y $9\sqrt{3}\text{ cm}$ (opuesto a
      $60^\circ$)
    is_correct: true
  - text: $9\text{ cm}$ y $9\text{ cm}$
    is_correct: false
  - text: $18\sqrt{3}\text{ cm}$ y $9\text{ cm}$
    is_correct: false
  - text: $9\sqrt{2}\text{ cm}$ y $9\sqrt{2}\text{ cm}$
    is_correct: false
  explanation: Dividiendo entre 2 se obtiene $L = 9\text{ cm}$, por lo que los catetos
    son $9\text{ cm}$ (opuesto a $30^\circ$) y $9\sqrt{3}\text{ cm}$ (opuesto a $60^\circ$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los ángulos del triángulo ($30^\circ$, $60^\circ$, $90^\circ$).'
- 'Paso 2: Determinar cuál lado se conoce (cateto menor $L$, cateto mayor $L\sqrt{3}$
  o hipotenusa $2L$).'
- 'Paso 3: Hallar el cateto menor $L$ como valor pivote de referencia.'
- 'Paso 4: Multiplicar $L$ por 2 para la hipotenusa ($2L$) o por $\sqrt{3}$ para el
  cateto mayor ($L\sqrt{3}$).'
errores_correccion: 'No confundas la posición de los catetos: el cateto menor ($L$)
  está SIEMPRE enfrente de $30^\circ$ y el cateto con raíz de 3 ($L\sqrt{3}$) está
  enfrente de $60^\circ$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el cateto opuesto al ángulo de $60^\circ$ en un triángulo notable
    mide $12\sqrt{3}\text{ cm}$, ¿cuánto mide la hipotenusa?
  alternativas:
  - $24\text{ cm}$
  - $12\text{ cm}$
  - $36\text{ cm}$
  respuesta: $24\text{ cm}$
  solucion_pasos:
  - Como $L\sqrt{3} = 12\sqrt{3}\text{ cm} \implies L = 12\text{ cm}$. La hipotenusa
    es $2L = 2(12) = 24\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el área de un triángulo notable $30^\circ-60^\circ-90^\circ$
    cuyo cateto menor mide $4\text{ cm}$?
  alternativas:
  - $8\sqrt{3}\text{ cm}^2$
  - $16\sqrt{3}\text{ cm}^2$
  - $8\text{ cm}^2$
  respuesta: $8\sqrt{3}\text{ cm}^2$
  solucion_pasos:
  - Cateto menor $= 4\text{ cm}$, cateto mayor $= 4\sqrt{3}\text{ cm}$. Área $= \frac{4
    \times 4\sqrt{3}}{2} = 8\sqrt{3}\text{ cm}^2$.
- titulo: ¿La hipotenusa de un triángulo 30°-60°-90° mide siempre el doble del cateto
    opuesto a 30°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad geométrica fundamental de este triángulo notable.
- titulo: ¿El cateto opuesto a 60° mide lo mismo que el opuesto a 30°?
  respuesta: 'No'
  solucion_pasos:
  - No, mide $L\sqrt{3}$, que es mayor que $L$.
errores_frecuentes:
- 'Invertir los catetos: colocar $L\sqrt{3}$ frente a $30^\circ$ y $L$ frente a $60^\circ$.'
- 'Confundir la razón $1 : \sqrt{3} : 2$ con la del triángulo de 45° ($1 : 1 : \sqrt{2}$).'
- Olvidar que la hipotenusa es $2L$ (el doble del cateto menor) y no $L\sqrt{2}$.
- Errores de simplificación al despejar $L$ a partir del cateto mayor con radicales.
- Intentar aplicar las razones de 30-60-90 en triángulos que no tienen esos ángulos
  exactos.
afirmaciones_verdaderas:
- 'En el triángulo notable $30^\circ-60^\circ-90^\circ$ la razón de lados opuestos
  a $\{30^\circ, 60^\circ, 90^\circ\}$ es $1 : \sqrt{3} : 2$.'
- El cateto opuesto al ángulo de $30^\circ$ mide exactamente la mitad de la hipotenusa.
al_terminar_debes_poder: '**QUÉ:** Aplicar las razones métricas y trigonométricas
  del triángulo notable $30^\circ-60^\circ-90^\circ$.


  **CÓMO:** Calculando lados desconocidos utilizando la proporción $1 : \sqrt{3} :
  2$ ($L, L\sqrt{3}, 2L$).


