semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.SIMETRIA_IMPAR
resumen_inicial: 'Reconocimiento de la simetría impar de la función seno: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función seno.'
explicacion_simple: 'La curva del seno tiene una simetría particular: lo que ocurre
  a la derecha del origen es el reflejo invertido de lo que ocurre a la izquierda.'
explicacion_formal: '### Definición formal


  Para un ángulo $\theta$ y su opuesto $-\theta$, los puntos asociados en el círculo
  unitario son $(x,y)$ y $(x,-y)$: comparten la misma coordenada $x$ (mismo coseno)
  pero tienen coordenada $y$ opuesta (senos opuestos). Por lo tanto, $\sin(-\theta)=-\sin(\theta)$.


  ### Desarrollo didáctico


  $\sin(\pi/6)=1/2$ y $\sin(-\pi/6)=-1/2$: son valores opuestos. Geométricamente,
  el ángulo $-\pi/6$ es el reflejo de $\pi/6$ respecto al eje $x$, lo que invierte
  el signo de la coordenada $y$.'
definiciones_clave: '- **Reconocimiento de la simetría impar de la función seno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a reconocimiento de la simetría impar de la función seno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    reconocimiento de la simetría impar de la función seno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de reconocimiento de la simetría impar de la función seno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
