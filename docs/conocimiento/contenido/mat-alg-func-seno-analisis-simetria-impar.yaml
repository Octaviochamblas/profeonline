semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.SIMETRIA_IMPAR
resumen_inicial: 'Reconocimiento de la simetría impar de la función seno $f(-x) = -\sin(x)$ y su simetría central respecto al origen $(0,0)$.'
explicacion_simple: |
  En matemáticas, una función se llama **impar** si al cambiar el signo de su variable de entrada (evaluar en $-x$ en lugar de $+x$), la respuesta completa cambia de signo (devuelve $-y$ en lugar de $+y$). La función seno cumple exactamente esta regla: $\sin(-x) = -\sin(x)$. Gráficamente, esto significa que la sinusoide tiene una **simetría central con respecto al origen $(0,0)$**. Si giras la gráfica entera media vuelta alrededor del punto $(0,0)$, la curva vuelve a calzar perfectamente sobre sí misma.
explicacion_formal: |
  ### Definición formal
  La función seno fundamental $f(x) = \sin(x)$ es una **función impar** porque satisface la condición de simetría reflexiva respecto al origen para todo $x \in \mathbb{R}$:
  $$f(-x) = \sin(-x) = -\sin(x) = -f(x)$$

  ### Desglose simbólico
  - Evaluación en argumento negativo: $\sin(-x)$.
  - Absorción y extracción del signo: El signo negativo del argumento se extrae fuera de la función: $\sin(-x) = -\sin(x)$.
  - Consecuencia gráfica: Si el punto $(x,y)$ pertenece a la gráfica de la sinusoide, entonces el punto opuesto simétrico $(-x, -y)$ también pertenece a la gráfica.

  ### Síntesis didáctica
  La simetría impar simplifica significativamente el cálculo de ángulos negativos. Permite convertir cualquier seno de un ángulo negativo en el negativo del seno del ángulo positivo equivalente (ejemplo: $\sin(-30^\circ) = -\sin(30^\circ) = -0.5$).
definiciones_clave: |
  - **Función impar**: Función real que satisface $f(-x) = -f(x)$ para todo $x \in \operatorname{Dom}(f)$.
  - **Simetría central respecto al origen**: Invariancia de la gráfica cartesiana ante una rotación de $180^\circ$ centrada en el origen $(0,0)$.
  - **Extracción de signo**: Regla algebráica por la cual el signo negativo dentro del seno se escribe como un factor negativo exterior.
propiedades_relaciones: |
  - **Relación con el coseno**: Mientras que el seno es impar ($\sin(-x) = -\sin x$), el coseno es par ($\cos(-x) = \cos x$).
  - **Propiedad del producto**: El producto de dos funciones impares (como $x \cdot \sin x$) resulta en una función par.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad de simetría impar para calcular el valor exacto de $\sin\left(-\frac{\pi}{3}\right)$ a partir del valor de $\sin\left(\frac{\pi}{3}\right)$.'
  pasos:
    - 'Paso 1: Recordar la identidad de función impar: $\sin(-x) = -\sin(x)$.'
    - 'Paso 2: Aplicar la identidad al argumento dado: $\sin\left(-\frac{\pi}{3}\right) = -\sin\left(\frac{\pi}{3}\right)$.'
    - 'Paso 3: Sustituir el valor conocido en el primer cuadrante: $\sin\left(\frac{\pi}{3}\right) = \frac{\sqrt{3}}{2}$.'
    - 'Paso 4: Anteponer el signo negativo exterior: $\sin\left(-\frac{\pi}{3}\right) = -\frac{\sqrt{3}}{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la relación algebráica de simetría que define a la función seno como una función impar?'
    choices:
      - {text: '$\sin(-x) = -\sin(x)$ para todo $x \in \mathbb{R}$', is_correct: true}
      - {text: '$\sin(-x) = \sin(x)$ para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: '$\sin(-x) = 1 - \sin(x)$ para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: '$\sin(-x) = \frac{1}{\sin x}$ para todo $x \in \mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\sin(-x) = -\sin(x)$ para todo $x \in \mathbb{R}$''. Es la propiedad algebráica definitoria de las funciones impares.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se sabe que $\sin(30^\circ) = 0.5$, ¿cuál es el valor de $\sin(-30^\circ)$?'
    choices:
      - {text: '$-0.5$', is_correct: true}
      - {text: '$0.5$', is_correct: false}
      - {text: '$0$', is_correct: false}
      - {text: '$-1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-0.5$''. Por simetría impar: $\sin(-30^\circ) = -\sin(30^\circ) = -0.5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si el argumento de la función seno contiene un signo negativo ($\sin(-x)$).'
  - 'Paso 2: Extraer el signo negativo delante de la función aplicando la identidad $\sin(-x) = -\sin(x)$.'
  - 'Paso 3: Calcular el valor del seno para el argumento positivo $x$.'
  - 'Paso 4: Multiplicar el resultado numérico por $-1$.'
errores_correccion: |
  - **Error 1:** Confundir la paridad del seno pensando que $\sin(-x) = \sin(x)$ (propiedad del coseno). **Cómo corregirlo:** La función seno es impar; por ende, evaluar en un argumento negativo invierte el signo del resultado.
  - **Error 2:** Creer que la gráfica del seno es simétrica con respecto al eje vertical Y. **Cómo corregirlo:** La simetría del seno es una simetría central respecto al punto origen $(0,0)$, no una simetría axial respecto al eje Y.
ejemplos:
  - titulo: 'Seno de ángulo negativo cuadrantal'
    enunciado: '¿Cuánto vale $\sin\left(-\frac{\pi}{2}\right)$?'
    alternativas:
      - '$-1$'
      - '$1$'
      - '$0$'
    respuesta: '$-1$'
    solucion_pasos:
      - '1. $\sin\left(-\frac{\pi}{2}\right) = -\sin\left(\frac{\pi}{2}\right)$.'
      - '2. Como $\sin\left(\frac{\pi}{2}\right) = 1$, resulta $-1$.'
  - titulo: 'Punto simétrico sobre la curva'
    enunciado: 'Si la gráfica del seno contiene al punto $\left(\frac{\pi}{6}, \frac{1}{2}\right)$, ¿contiene también al punto $\left(-\frac{\pi}{6}, -\frac{1}{2}\right)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la simetría impar todo punto $(x,y)$ se refleja en $(-x, -y)$.'
  - titulo: 'Suma de seno positivo y negativo'
    enunciado: '¿Es siempre cero la suma $\sin(x) + \sin(-x)$ para cualquier $x$ real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\sin(x) + \sin(-x) = \sin(x) - \sin(x) = 0$.'
  - titulo: 'Rotación alrededor del origen'
    enunciado: '¿Rotar la gráfica del seno $180^\circ$ alrededor de $(0,0)$ reproduce la misma gráfica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la interpretación geométrica de la simetría central respecto al origen.'
errores_frecuentes:
  - 'La afirmación de que la función seno es una función par que elimina los signos negativos de su argumento.'
  - 'La afirmación de que la gráfica de la función seno presenta simetría de espejo respecto al eje Y.'
  - 'La afirmación de que el valor de $\sin(-x)$ es siempre un número positivo.'
  - 'La afirmación de que la simetría impar se pierde si se multiplica la función por una constante.'
  - 'La afirmación de que la expresión $\sin(-x) + \sin(x)$ resulta en $2\sin(x)$.'
afirmaciones_verdaderas:
  - 'La función seno es una función impar que cumple la identidad analítica $\sin(-x) = -\sin(x)$ para todo $x \in \mathbb{R}$.'
  - 'La gráfica de la función seno es simétrica con respecto al origen de coordenadas $(0,0)$, lo que implica que el punto $(-x, -y)$ pertenece a la curva siempre que $(x, y)$ pertenezca a ella.'
