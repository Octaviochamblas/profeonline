semantic_id: MAT.NUM.PROG_GEOMETRICA.CALCULO_INDICE
resumen_inicial: 'La determinación de la posición de un término despeja el exponente $n$ en la fórmula del término general de una progresión geométrica aplicando logaritmos: $n = \frac{\ln(a_n / a_1)}{\ln(r)} + 1$.'
explicacion_simple: |
  Si sabes que en una progresión geométrica (por ejemplo $3, 6, 12, 24, \dots$) figura el número $384$ y quieres saber **en qué posición o número de lugar ($n$) está ubicado**:
  1. Divides el número entre el primero ($a_1 = 3$): $\frac{384}{3} = 128$.
  2. Como la razón es $r = 2$, buscas a qué potencia hay que elevar $2$ para que dé $128$ ($2^7 = 128$).
  3. Como el exponente dio $7$, la posición es $n = 7 + 1 = 8$.
  El número $384$ ocupa el **lugar 8** ($a_8 = 384$).
explicacion_formal: |
  ### Definición formal
  La **posición ordinal $n$** de un término positivo $a_n$ en una progresión geométrica de términos positivos ($a_1 > 0, r > 1$) se despeja aplicando logaritmos a la ecuación canónica:
  $$a_n = a_1 \cdot r^{n-1} \implies \frac{a_n}{a_1} = r^{n-1}$$
  Aplicando logaritmo natural ($\ln$) a ambos miembros:
  $$\ln\left(\frac{a_n}{a_1}\right) = \ln(r^{n-1}) = (n - 1) \cdot \ln(r) \implies n - 1 = \frac{\ln(a_n / a_1)}{\ln(r)} \implies n = \frac{\ln(a_n / a_1)}{\ln(r)} + 1$$

  ### Condición de Pertenencia a la Progresión
  Un número $V > 0$ pertenece a la progresión geométrica si y solo si la posición calculada $n$ satisface:
  $$n = \frac{\ln(V / a_1)}{\ln(r)} + 1 \in \mathbb{N} = \{1, 2, 3, \dots\}$$
  Si el resultado $n$ es un entero positivo, $V$ pertenece a la P.G.; en caso contrario, $V$ no pertenece.

  ### Síntesis didáctica
  - Despeje exponencial directo: $r^{n-1} = \frac{a_n}{a_1}$.
  - Despeje por logaritmos: $n = \frac{\ln(a_n / a_1)}{\ln(r)} + 1$.
definiciones_clave: |
  - **Índice de posición ($n$)**: Exponente incrementado en 1 que indica la ubicación ordinal del término.
  - **Ecuación exponencial**: Ecuación donde la incógnita de posición $n$ figura como exponente.
  - **Logaritmo natural ($\ln$)**: Herramienta matemática empleada para despejar incógnitas ubicadas en el exponente.
propiedades_relaciones: |
  - **Uso de potencias conocidas**: Para bases enteras simples (como $2^k$ o $3^k$), la posición se halla igualando exponentes sin necesidad de calculadora.
  - **Dominio entero positivo**: La validez de la pertenencia exige de forma estricta que $n \in \mathbb{N}$.
ejemplo_guiado:
  enunciado: 'En la progresión geométrica $5, 15, 45, 135, \dots$, determina qué lugar ocupa el número $1.215$.'
  pasos:
    - 'Paso 1: Identificamos $a_1 = 5$, la razón $r = \frac{15}{5} = 3$ y el valor $a_n = 1.215$.'
    - 'Paso 2: Igualamos a la fórmula: $1.215 = 5 \cdot 3^{n-1} \implies \frac{1.215}{5} = 3^{n-1}$.'
    - 'Paso 3: Dividimos: $243 = 3^{n-1}$. Expressamos $243$ como potencia de $3$: $3^5 = 243$.'
    - 'Paso 4: Igualamos los exponentes: $n - 1 = 5 \implies n = 6$. El número $1.215$ ocupa la **posición 6** ($a_6 = 1.215$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué herramienta matemática permite despejar el número de posición $n$ cuando figura en el exponente de la fórmula de progresión geométrica?'
    choices:
      - {text: 'El logaritmo, aplicando la fórmula $n = \frac{\ln(a_n / a_1)}{\ln(r)} + 1$', is_correct: true}
      - {text: 'La regla de tres simple directa', is_correct: false}
      - {text: 'La resta simple entre el último término y el primero', is_correct: false}
      - {text: 'La división del último término entre la posición', is_correct: false}
    explanation: 'La alternativa correcta es ''El logaritmo, aplicando la fórmula $n = \frac{\ln(a_n / a_1)}{\ln(r)} + 1$''. Se aplica la propiedad de logaritmos para bajar el exponente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en la P.G. $2, 4, 8, 16, \dots$ ($a_1 = 2, r = 2$), calculas $2^{n-1} = 64$, ¿cuál es el valor de la posición $n$?'
    choices:
      - {text: 'La posición es $n = 7$, porque $64 = 2^6 \implies n - 1 = 6 \implies n = 7$', is_correct: true}
      - {text: 'La posición es $n = 6$, tomando directamente el exponente 6', is_correct: false}
      - {text: 'La posición es $n = 32$, dividiendo $64 / 2$', is_correct: false}
      - {text: 'La posición es $n = 128$, multiplicando por 2', is_correct: false}
    explanation: 'La alternativa correcta es ''La posición es $n = 7$, porque $64 = 2^6 \implies n - 1 = 6 \implies n = 7$''. $n = 6 + 1 = 7$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$, la razón $r$ y el valor del término $a_n$.'
  - 'Paso 2: Dividir el valor del término entre el primer término: $\frac{a_n}{a_1}$.'
  - 'Paso 3: Expresar el cociente como potencia de la razón $r^{k} = \frac{a_n}{a_1}$ o aplicar logaritmos $\frac{\ln(a_n/a_1)}{\ln(r)}$.'
  - 'Paso 4: Igualar el exponente $n - 1 = k$ y sumar 1 para obtener la posición ordinal final $n = k + 1$.'
errores_correccion: |
  - **Error 1:** Olvidar sumar 1 al exponente obtenido (quedarse con $n = k$ en vez de $n = k + 1$). **Cómo corregirlo:** La ecuación es $n - 1 = k$; **DEBES SUMAR 1 para hallar la posición $n = k + 1$**.
  - **Error 2:** Aplicar logaritmos sin haber dividido previamente entre el primer término $a_1$. **Cómo corregirlo:** Primero se debe **aislar la potencia $r^{n-1} = \frac{a_n}{a_1}$** antes de aplicar logaritmos.
ejemplos:
  - titulo: 'Posición de término por potencias'
    enunciado: 'En $a_1 = 3$ y $r = 2$, ¿el término $a_n = 96$ ocupa la posición $n = 6$?'
    alternativas:
      - 'Sí, pues $96 / 3 = 32 = 2^5 \implies n = 5 + 1 = 6$'
      - 'No, ocupa la posición 5'
      - 'No, ocupa la posición 32'
    respuesta: 'Sí, pues $96 / 3 = 32 = 2^5 \implies n = 5 + 1 = 6$'
    solucion_pasos:
      - '1. Cociente: $96 / 3 = 32$.'
      - '2. Potencia: $32 = 2^5 \implies n - 1 = 5$.'
      - '3. Posición: $n = 6$.'
  - titulo: 'Prueba de pertenencia en P.G.'
    enunciado: 'En $a_1 = 2$ y $r = 3$, ¿el número $50$ pertenece a la progresión?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. $50 / 2 = 25$, y 25 no es una potencia entera de 3 ($3^2 = 9, 3^3 = 27$).'
  - titulo: 'Posición en P.G. fraccionaria'
    enunciado: 'En $a_1 = 100$ y $r = 1/2$, ¿el término $a_n = 12,5$ ocupa la posición $n = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $12,5 / 100 = 1/8 = (1/2)^3 \implies n - 1 = 3 \implies n = 4$.'
  - titulo: 'Lugar del primer término'
    enunciado: 'Para $a_n = a_1$, ¿$a_1 / a_1 = 1 = r^0 \implies n - 1 = 0 \implies n = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El primer término ocupa la posición 1.'
errores_frecuentes:
  - 'La posición ordinal $n$ equivale directamente al exponente $k$ de la razón sin necesidad de sumar 1.'
  - 'Una razón geométrica menor que 1 genera términos negativos en la secuencia.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Aplicar logaritmos sobre el término $a_n$ sin dividir previamente por el primer término $a_1$.'
  - 'Aceptar exponentes o posiciones no enteras como respuestas válidas a problemas de conteo.'
afirmaciones_verdaderas:
  - 'La posición $n$ de un término en una P.G. se calcula despejando el exponente en $r^{n-1} = \frac{a_n}{a_1}$.'
  - 'Un valor numérico pertenece a una P.G. de base $r$ si y solo si la razón $\frac{a_n}{a_1}$ es una potencia entera exacta de $r$.'
