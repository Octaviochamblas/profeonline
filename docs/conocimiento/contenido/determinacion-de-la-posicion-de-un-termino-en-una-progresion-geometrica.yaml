semantic_id: MAT.NUM.PROG_GEOMETRICA.CALCULO_INDICE
resumen_inicial: 'Determinación de la posición de un término en una progresión geométrica:
  concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: Empiezas con 2 bacterias. Se duplican cada hora. De pronto, tienes 1.024
  bacterias. ¿Cuántas horas han pasado? Encontrar la incógnita en el exponente es el reto
  de este recurso.
explicacion_formal: 'En el mundo de las progresiones aritméticas, despejábamos ''$n$'' dividiendo.
  Aquí ''$n$'' está escondida en un exponente. ¡Estamos lidiando con una **Ecuación Exponencial**!


  Procedimiento de despeje:

  1. $a_n = a_1 \cdot r^{(n-1)}$

  2. Pasamos $a_1$ dividiendo: $\frac{a_n}{a_1} = r^{(n-1)}$

  3. Ahora debemos expresar el número de la izquierda como una potencia que tenga la misma
  base ''$r$''.


  Ejemplo: $a_1 = 5, r = 2$. ¿Qué posición ocupa el número 160?

  - $\frac{160}{5} = 2^{(n-1)}$

  - $32 = 2^{(n-1)}$

  - Expresamos 32 como potencia de 2: sabemos que $32 = 2^5$.

  - Entonces: $2^5 = 2^{(n-1)}$

  - Igualamos exponentes: $5 = n - 1 \rightarrow n = 6$.

  ¡El número 160 está en la posición 6!'
definiciones_clave: '- **Determinación de la posición de un término en una progresión geométrica**:
  Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Determinación de la posición de un término en
  una progresión geométrica**: Relaciones de cambio y fórmulas estructurales de progresión
  geométrica.'
ejemplo_guiado:
  enunciado: En la progresión geométrica 4, 8, 16, ¿en qué posición se encuentra el término
    256?
  pasos:
  - Identifico a_1 igual a 4 y r igual a 2.
  - 'Planteo la ecuación: 256 dividido entre 4 es igual a 2 elevado a (n menos 1), es decir
    64 igual a 2 elevado a (n menos 1).'
  - 'Escribo 64 como potencia de 2: 64 es igual a 2 elevado a 6. Igualo los exponentes: n
    menos 1 es igual a 6, entonces n es igual a 7.'
