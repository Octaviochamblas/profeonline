procedimiento:
- 'Paso 1: Divide el término final por el término inicial ($a_n / a_1$).'
- 'Paso 2: Escribe ese resultado como una potencia usando como base a tu razón ''r''.'
- 'Paso 3: Iguala los exponentes.'
- 'Paso 4: Despeja ''n'' (normalmente sumando 1 al otro lado).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en determinación de la posición de un término en una progresión geométrica.
ejemplos:
- titulo: El salto cuántico
  enunciado: La P.G. es 3, 9, 27... ¿En qué posición está el número 243?
  solucion_pasos:
  - a1 = 3, r = 3.
  - 243 = 3 * 3^(n-1)
  - 243 / 3 = 81
  - 81 = 3^(n-1)
  - Sabemos que 81 = 3^4.
  - 4 = n - 1 -> n = 5.
- titulo: Ejemplo 1
  enunciado: En la progresión 5, 15, 45, ¿qué posición ocupa el término 405?
  alternativas:
  - '5'
  - '4'
  - '6'
  respuesta: '5'
  solucion_pasos:
  - 405 dividido entre 5 es 81, que es igual a 3 elevado a 4; entonces n menos 1 es 4, y n
    es 5.
- titulo: Ejemplo 2
  enunciado: En la progresión 2, 6, 18, ¿qué posición ocupa el término 486?
  alternativas:
  - '6'
  - '5'
  - '7'
  respuesta: '6'
  solucion_pasos:
  - 486 dividido entre 2 es 243, que es igual a 3 elevado a 5; entonces n menos 1 es 5, y
    n es 6.
- titulo: ¿Se puede calcular la posición de un término sin conocer la razón r?
  respuesta: 'No'
  solucion_pasos:
  - r es indispensable para plantear la ecuación exponencial que permite despejar n.
- titulo: ¿El resultado de n siempre debe ser un número natural?
  respuesta: Sí
  solucion_pasos:
  - Si no lo es, ese valor no corresponde a una posición real dentro de la progresión.
errores_frecuentes:
- Olvidar sumar el '+1' al final, entregando solo el número de saltos como respuesta.
- No saber transformar el resultado de la división en una potencia de igual base.
- Olvidar sumar 1 al final, entregando solo el número de saltos como respuesta.
- No saber transformar el resultado de la división en una potencia con la misma base que r.
- Confundir la base de la potencia con el exponente al igualar ambos lados de la ecuación.
afirmaciones_verdaderas:
- La formulación de determinación de la posición de un término en una progresión geométrica
  mantiene la regularidad de la sucesión.
- Para despejar la posición n en una progresión geométrica hay que expresar ambos lados de
  la ecuación como potencias de la misma base.
