semantic_id: MAT.NUM.PROG_GEOMETRICA.CALCULO_INDICE
resumen_inicial: 'La determinación de la posición $n$ de un término en una PG resuelve la ecuación exponencial $r^{n-1} = \frac{a_n}{a_1}$ mediante igualación de bases o logaritmos $n = \log_r(\frac{a_n}{a_1}) + 1$, validando que $n \in \mathbb{N}$.'
explicacion_simple: |
  Si te dan un número de una progresión geométrica y quieres saber **en qué posición está**:
  - Pasos a seguir:
    1. Divides el número entre el primer término: $\frac{a_n}{a_1}$.
    2. Expresas ese resultado como una potencia de la razón: $r^{n-1} = r^k$.
    3. Igualas los exponentes: $n - 1 = k \implies n = k + 1$.
  - Por ejemplo, en la progresión $3, 6, 12, 24, \dots$ ($a_1 = 3, r = 2$), ¿qué posición ocupa el $384$?
    - $\frac{384}{3} = 128$
    - Como $128 = 2^7$, tenemos que $n - 1 = 7 \implies n = 8$.
    - ¡El número $384$ está en la posición $n = 8$!

  ![Determinación de la posición de un término en una PG](/static/img/nodos/determinacion-de-la-posicion-de-un-termino-en-una-progresion-geometrica-intro.svg)
explicacion_formal: |
  ### Deducción formal por Resolución de Ecuación Exponencial
  A partir de la fórmula del término general de la PG:
  $$a_n = a_1 \cdot r^{n-1}$$
  1. Aislamos la potencia de la razón:
     $$r^{n-1} = \frac{a_n}{a_1}$$
  2. Aplicando logaritmo en base $r$ (para $r > 0, r \neq 1$ y $\frac{a_n}{a_1} > 0$):
     $$n - 1 = \log_r\left(\frac{a_n}{a_1}\right) = \frac{\ln(a_n / a_1)}{\ln(r)}$$
  3. Despejamos el índice ordinal $n$:
     $$n = \frac{\ln(a_n) - \ln(a_1)}{\ln(r)} + 1$$

  ### Criterio de Pertenencia
  Un valor real $x$ pertenece a la progresión geométrica si y solo si $\frac{x}{a_1} = r^k$ para algún entero no negativo $k \in \mathbb{N}_0$, lo que garantiza que **$n = k + 1 \in \mathbb{N}$**.

  ### Síntesis didáctica
  - Ecuación exponencial: $r^{n-1} = \frac{a_n}{a_1}$.
  - Solución entera: $n = \log_r(a_n / a_1) + 1 \in \{1, 2, 3, \dots\}$.
definiciones_clave: |
  - **Ecuación exponencial**: Ecuación donde la incógnita de posición $n$ se encuentra en el exponente.
  - **Igualación de bases**: Método algebraico que utiliza la propiedad $r^u = r^v \iff u = v$.
  - **Criterio de pertenencia en PG**: Condición donde $\frac{a_n}{a_1}$ debe ser una potencia entera exacta de $r$.
propiedades_relaciones: |
  - **Inyectividad de la función exponencial**: Para cada valor que pertenece a la PG le corresponde una única posición ordinal $n$.
  - **Crecimiento superlineal del índice**: La posición $n$ crece de forma logarítmica respecto al valor numérico $a_n$.
ejemplo_guiado:
  enunciado: 'En la progresión geométrica $(5, 15, 45, 135, \dots)$, determina qué posición ocupa el número $1.215$ y averigua si el número $500$ pertenece a la progresión.'
  imagen: '/static/img/nodos/determinacion-de-la-posicion-de-un-termino-en-una-progresion-geometrica-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $a_1 = 5$ y la razón $r = \frac{15}{5} = 3$.'
    - 'Paso 2: Para $a_n = 1.215$: planteamos $3^{n-1} = \frac{1.215}{5} = 243$.'
    - 'Paso 3: Expresamos $243$ como potencia de $3$: $243 = 3^5$.'
    - 'Paso 4: Igualamos exponentes: $n - 1 = 5 \implies n = 6$. El número $1.215$ ocupa la **posición $n = 6$**.'
    - 'Paso 5: Para el número $500$: $3^{n-1} = \frac{500}{5} = 100$. Como $100$ no es potencia entera de $3$ ($3^4=81, 3^5=243$), el número $500$ **no pertenece** a la progresión.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la PG $(2, 8, 32, 128, \dots)$ con $a_1 = 2$ y $r = 4$, ¿qué lugar ocupa el número $512$?'
    choices:
      - {text: '$n = 5$, calculando $4^{n-1} = \frac{512}{2} = 256 = 4^4 \implies n = 4 + 1 = 5$', is_correct: true}
      - {text: '$n = 4$, olvidando sumar 1 al exponente', is_correct: false}
      - {text: '$n = 6$', is_correct: false}
      - {text: '$n = 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$n = 5$, calculando $4^{n-1} = \frac{512}{2} = 256 = 4^4 \implies n = 4 + 1 = 5$''. El exponente 4 indica que $n-1=4 \implies n=5$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre si al calcular la posición $n$ de un valor en una PG el cociente $\frac{a_n}{a_1}$ no es una potencia entera de $r$?'
    choices:
      - {text: 'El valor evaluado no pertenece a la progresión geométrica', is_correct: true}
      - {text: 'Se debe redondear el exponente al entero más cercano', is_correct: false}
      - {text: 'La razón geométrica cambia de valor', is_correct: false}
      - {text: 'Se convierte automáticamente en una progresión aritmética', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor evaluado no pertenece a la progresión geométrica''. La pertenencia exige un exponente entero exacto en el dominio $\mathbb{N}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$, la razón $r$ y el valor a evaluar $a_n$.'
  - 'Paso 2: Dividir $a_n$ entre $a_1$: $\frac{a_n}{a_1}$.'
  - 'Paso 3: Escribir el cociente como una potencia de base $r$: $r^k$.'
  - 'Paso 4: Despejar la posición sumando 1 al exponente: $n = k + 1$.'
  - 'Paso 5: Comprobar que $n$ sea un número natural positivo.'
errores_correccion: |
  - **Error 1:** Olvidar sumar 1 al exponente obtenido (confundir $n - 1$ con $n$). **Cómo corregirlo:** La ecuación es $r^{n-1} = r^k$, por lo que la posición es **$n = k + 1$** (sumar obligatoriamente 1).
  - **Error 2:** Dividir $a_n$ entre la razón $r$ en lugar de dividirlo entre el primer término $a_1$. **Cómo corregirlo:** La base exponencial se aísla **dividiendo entre $a_1$**: $r^{n-1} = \frac{a_n}{a_1}$.
ejemplos:
  - titulo: 'Posición mediante potencias conocidas'
    enunciado: 'En la PG $(3, 12, 48, 192, \dots)$, ¿qué posición ocupa el número $768$?'
    alternativas:
      - '$n = 5$'
      - '$n = 4$'
      - '$n = 6$'
    respuesta: '$n = 5$'
    solucion_pasos:
      - '1. $a_1 = 3, r = 4$.'
      - '2. $4^{n-1} = 768 / 3 = 256 = 4^4 \implies n - 1 = 4 \implies n = 5$.'
  - titulo: 'Verificación de pertenencia en PG'
    enunciado: '¿El número $200$ pertenece a la progresión geométrica $2, 6, 18, 54, \dots$?'
    alternativas:
      - 'No, porque $200/2 = 100$, que no es potencia exacta de 3'
      - 'Sí, ocupa la posición 5'
      - 'Sí, ocupa la posición 4'
    respuesta: 'No, porque $200/2 = 100$, que no es potencia exacta de 3'
    solucion_pasos:
      - '1. $3^4 = 81$ y $3^5 = 243 \implies 100$ no es potencia entera de 3.'
  - titulo: 'Posición en PG con razón 2'
    enunciado: 'En la PG $(1, 2, 4, 8, 16, \dots)$, ¿el número $1.024$ ocupa la posición $n=11$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $2^{n-1} = 1.024 = 2^{10} \implies n - 1 = 10 \implies n = 11$.'
  - titulo: 'Posición entera obligatoria'
    enunciado: '¿Un término de una progresión geométrica puede ocupar una posición no entera como $n = 4,3$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El índice de posición $n$ debe pertenecer estrictamente a $\mathbb{N}$.'
errores_frecuentes:
  - 'Al resolver la ecuación exponencial $r^{n-1} = r^k$ se toma $n = k$ omitiendo sumar uno al resultado.'
  - 'Se divide el término objetivo $a_n$ por la razón $r$ en lugar del primer término $a_1$.'
  - 'Cuando un valor no es potencia exacta de la razón se redondea el logaritmo para forzar su pertenencia.'
  - 'Al aplicar logaritmos se divide el logaritmo del término por el producto $a_1 \cdot r$.'
  - 'Se asume que cualquier número entero positivo pertenece a una progresión geométrica.'
afirmaciones_verdaderas:
  - 'La posición $n$ de un término se obtiene resolviendo $r^{n-1} = \frac{a_n}{a_1}$, lo que equivale a $n = \log_r(\frac{a_n}{a_1}) + 1$.'
  - 'Un valor numérico $x$ pertenece a la progresión si y solo si $\frac{x}{a_1}$ es una potencia exacta de exponente entero no negativo de la razón $r$.'
