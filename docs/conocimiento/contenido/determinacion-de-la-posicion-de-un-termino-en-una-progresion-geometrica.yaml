resumen_inicial: 'La determinación de la posición o índice $n$ de un valor $a_n$ despeja
  el exponente mediante logaritmos: $n = \frac{\log(a_n / a_1)}{\log r} + 1$.'
explicacion_simple: Si sabemos qué número está en la secuencia y queremos averiguar
  en qué lugar o posición se encuentra, aplicamos logaritmos dividiendo el logaritmo
  de $(a_n / a_1)$ entre el logaritmo de la razón $r$ y sumamos 1.
explicacion_formal: 'Dado un valor de término $a_n$, el primer término $a_1$ y la
  razón $r > 0$ ($r \neq 1$), el **Índice Posicional $n$** se despeja aplicando logaritmos:


  $$\frac{a_n}{a_1} = r^{n-1} \implies \log\left(\frac{a_n}{a_1}\right) = (n - 1)
  \cdot \log r \implies n = \frac{\log\left(\frac{a_n}{a_1}\right)}{\log r} + 1$$


  **Condición de validez:**

  - El valor resultante de $n$ DEBE ser un número entero positivo para pertenecer
  a la progresión.'
definiciones_clave: '- **Cálculo del índice $n$**: Despeje logarítmico $n = \frac{\log(a_n
  / a_1)}{\log r} + 1$.'
propiedades_relaciones: '- **Despeje exponencial por logaritmo**: Utiliza $\log(r^{n-1})
  = (n-1)\log r$.'
ejemplo_guiado:
  enunciado: En la P.G. $(5, 10, 20, 40, \dots)$, determine qué posición $n$ ocupa
    el número $640$.
  pasos:
  - 'Paso 1: Identificar $a_1 = 5$, $r = 2$ y $a_n = 640$.'
  - 'Paso 2: Formar la razón $a_n / a_1 = 640 / 5 = 128$.'
  - 'Paso 3: Resolver $2^{n-1} = 128 = 2^7 \implies n - 1 = 7 \implies n = 8$.'
  - 'Conclusión: El número $640$ ocupa la posición octava ($n = 8$).'
checkpoints:
