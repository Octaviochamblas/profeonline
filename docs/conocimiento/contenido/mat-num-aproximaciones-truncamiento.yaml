semantic_id: MAT.NUM.APROXIMACIONES.TRUNCAMIENTO
resumen_inicial: El truncamiento aproxima un número eliminando o 'cortando' directamente
  todas las cifras decimales a partir de la posición $k$ requerida, sin realizar redondeos.
explicacion_simple: Truncar un número es la forma más simple de cortar un decimal.
  Consiste en conservar los dígitos hasta la posición deseada y borrar o descartar
  de golpe todos los demás números que vienen después, sin importar cuáles sean esas
  cifras borradas.
explicacion_formal: 'Sea $x = a_0, a_1 a_2 \dots a_k a_{k+1} \dots$, la **Aproximación
  por Truncamiento a la $k$-ésima posición decimal** descarte la cola decimal mediante:


  $$\text{Trunc}(x, k) = \frac{\lfloor x \cdot 10^k \rfloor}{10^k} = a_0, a_1 a_2
  \dots a_k$$


  **Desglose de la fórmula:**

  - $\lfloor \cdot \rfloor$: Función piso entero que elimina la parte fraccionaria
  remanente.

  - Independencia de $a_{k+1}$: Las cifras borradas $a_{k+1}, a_{k+2}, \dots$ son
  totalmente ignoradas en el cálculo.


  > **Complemento didáctico:** A diferencia del redondeo, en el truncamiento de $3,899$
  a las décimas el resultado es $3,8$ aunque los nueves estén extremadamente cerca
  de $3,9$.'
definiciones_clave: '- **Aproximación por truncamiento**: Corte directo de la secuencia
  decimal en la posición $k$ descartando todo remanente posicional.'
propiedades_relaciones: '- **Equivalencia a defecto positiva**: $\text{Trunc}(x,k)
  = x_{\text{def}}$ para $x > 0$.'
ejemplo_guiado:
  enunciado: Trunque los números $3,749$ y $3,799$ a las décimas ($k=1$).
  pasos:
  - 'Paso 1: Para $3,749$, cortar en la primera cifra decimal $\implies 3,7$.'
  - 'Paso 2: Para $3,799$, cortar en la primera cifra decimal ignorando las cifras
    posteriores $\implies 3,7$.'
  - 'Conclusión: Ambos números entregan exactamente $3,7$ al truncarse a las décimas.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la aproximación por truncamiento?
  choices:
  - text: En cortar directamente los decimales a partir de la posición indicada, sin
      cambiar las cifras conservadas
    is_correct: true
  - text: En sumar 1 a la última cifra siempre
    is_correct: false
  - text: En multiplicar por 100
    is_correct: false
  - text: En convertir el número a entero
    is_correct: false
  explanation: La alternativa correcta es 'En cortar directamente los decimales a
    partir de la posición indicada, sin cambiar las cifras conservadas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3,799 truncado a las décimas, ¿cuál fue el resultado?
  choices:
  - text: 3,7
    is_correct: true
  - text: 3,8
    is_correct: false
  - text: 3,79
    is_correct: false
  - text: 4,0
    is_correct: false
  explanation: La alternativa correcta es '3,7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la posición decimal de corte $k$.'
- 'Paso 2: Escribir el número conservando únicamente las cifras hasta la posición
  $k$.'
- 'Paso 3: Eliminar de forma directa todos los dígitos situados a la derecha de la
  posición $k$ sin hacer ningún redondeo.'
errores_correccion: '- **Error 1: Redondear hacia arriba al truncar si el dígito siguiente
  es 9 (ej: truncar $3,799 \to 3,8$).** **Cómo corregirlo:** El truncamiento CORTA
  a ciegas sin mirar ni modificar cifras; el resultado es $3,7$.


  - **Error 2: Confundir truncamiento con aproximación por exceso.** **Cómo corregirlo:**
  El truncamiento preserva intactos los dígitos retenidos; por exceso los incrementa
  en 1.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Trunque 4,58 a las décimas.
  alternativas:
  - 4,5
  - 4,6
  - 4,0
  respuesta: 4,5
  solucion_pasos:
  - Se corta en la décima $\implies 4,5$.
- titulo: Ejemplo 2
  enunciado: Trunque 1,999 a las centésimas.
  alternativas:
  - 1,99
  - 2,00
  - 1,90
  respuesta: 1,99
  solucion_pasos:
  - Se corta en la centésima $\implies 1,99$.
- titulo: ¿Es el truncamiento de 5,123 a la décima igual a 5,1?
  respuesta: Sí
  solucion_pasos:
  - Sí, se corta directamente en la décima.
- titulo: ¿Cambia el truncamiento la última cifra conservada?
  respuesta: 'No'
  solucion_pasos:
  - No, el truncamiento preserva inalteradas las cifras hasta el corte.
errores_frecuentes:
- El truncamiento incrementa en una unidad la cifra de corte cuando los decimales
  borrados son mayores que 5.
- Truncar un número decimal positivo es equivalente a aproximarlo por exceso.
- El truncamiento a las décimas de $2,99$ es igual a $3,0$.
- Para truncar un número decimal es necesario calcular el promedio de sus cifras.
- El truncamiento de una fracción propia produce un número entero mayor que 1.
afirmaciones_verdaderas:
- El truncamiento elimina de golpe las cifras decimales a partir de la posición $k$
  sin efectuar redondeos.
- Para números positivos, el truncamiento a $k$ decimales coincide exactamente con
  la aproximación por defecto.
al_terminar_debes_poder: Al terminar serás capaz de aproximar cualquier número por
  truncamiento a la posición decimal requerida, descartando directamente las cifras
  posteriores sin alterar los dígitos conservados.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
