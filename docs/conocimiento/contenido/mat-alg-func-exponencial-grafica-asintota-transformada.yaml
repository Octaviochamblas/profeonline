    identificación de la asíntota horizontal en funciones exponenciales trasladadas?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis gráfico
      y modelamiento exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis gráfico y modelamiento exponencial. Es la condición
    de existencia para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en identificación de la asíntota horizontal en funciones exponenciales trasladadas?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la constante $k$ sumada (o restada) al final de la función exponencial.'
- 'Paso 2: La asíntota horizontal es la recta $y=k$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en identificación
  de la asíntota horizontal en funciones exponenciales trasladadas.
ejemplos:
- titulo: Identificación de asíntota con traslación positiva
  enunciado: Identifica la asíntota horizontal de $g(x)=3\cdot4^x+6$.
  solucion_pasos:
  - $k=6$.
  - La asíntota horizontal es $y=6$.
- titulo: Identificación de asíntota con traslación negativa
  enunciado: Identifica la asíntota horizontal de $g(x)=2\cdot0{,}5^x-9$.
  solucion_pasos:
  - $k=-9$.
  - La asíntota horizontal es $y=-9$.
- titulo: ¿La asíntota horizontal de una función trasladada verticalmente puede coincidir
    con el eje $x$?
  enunciado: ¿La asíntota horizontal de una función trasladada verticalmente puede
    coincidir con el eje $x$?
  respuesta: Sí
  solucion_pasos:
  - Ocurre únicamente cuando $k=0$, es decir, cuando no hay traslación vertical.
- titulo: ¿La asíntota horizontal depende del valor de $a$ o de $b$?
  enunciado: ¿La asíntota horizontal depende del valor de $a$ o de $b$?
  respuesta: 'No'
  solucion_pasos:
  - Depende únicamente de la constante $k$ sumada al final de la función.
errores_frecuentes:
- Confundir la asíntota horizontal trasladada con la asíntota original ($y=0$), sin
  considerar $k$.
- No relacionar directamente la asíntota con la constante $k$ de la función.
- Confundir la traslación de la asíntota horizontal con una traslación del intercepto
  con el eje $y$.
- Cometer errores de signo al identificar $k$ cuando la constante aparece restada.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando identificación de la asíntota horizontal en funciones exponenciales trasladadas.
