semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ASINTOTA_TRANSFORMADA
resumen_inicial: 'La asíntota horizontal de una función exponencial transformada $g(x) = a \cdot b^{cx + d} + k$ viene dada de forma unívoca por la constante aditiva externa $y = k$.'
explicacion_simple: |
  Sin importar qué tan complicada se vea la potencia de una función exponencial (con números multiplicando a la $x$ dentro del exponente o restando dentro del paréntesis), la línea invisible asíntota horizontal depende únicamente del número libre que esté sumando o restando al final de toda la expresión. Si la función es $y = 3 \cdot 2^{5x - 1} - 4$, la asíntota horizontal es directamente la recta $y = -4$.
explicacion_formal: |
  ### Definición formal
  Para una función exponencial general transformada $g: \mathbb{R} \to \mathbb{R}$ definida por:
  $$g(x) = a \cdot b^{cx + d} + k, \quad a \neq 0, b > 0, b \neq 1, c \neq 0$$
  la **asíntota horizontal** se define analíticamente mediante la evaluación del límite al extremo infinito apropiado:
  $$\text{Asíntota Horizontal: } y = k$$
  fundamentado en que $\lim_{x \to \pm\infty} a \cdot b^{cx + d} = 0$ para el sentido que anula el exponente ($cx + d \to -\infty$).

  ### Desglose simbólico
  - Orientación del comportamiento asintótico:
    - Si $c > 0 \land b > 1 \implies \lim_{x \to -\infty} a \cdot b^{cx + d} = 0 \implies$ Asíntota a la izquierda ($x \to -\infty$).
    - Si $c < 0 \land b > 1 \implies \lim_{x \to +\infty} a \cdot b^{cx + d} = 0 \implies$ Asíntota a la derecha ($x \to +\infty$).
  - Independencia funcional: La asíntota $y = k$ es **independiente** de los parámetros $a, b, c, d$. Alterar la escala $a$, la base $b$, la frecuencia $c$ o la traslación horizontal $d$ no modifica la recta $y = k$.

  ### Síntesis didáctica
  Regla rápida de lectura de la asíntota: En cualquier modelo exponencial escrito como potencia más constante $P(x) = \text{Término Exponencial} + k$, tapar con la mano el término exponencial deja al descubierto la ecuación exacta de la asíntota horizontal $y = k$.
definiciones_clave: |
  - **Asíntota horizontal transformada**: Recta $y = k$ determinada por el término independiente no exponencial.
  - **Independencia de parámetros internos**: Propiedad por la cual $c$ y $d$ en el exponente no alteran la asíntota $y = k$.
  - **Límite asintótico de convergencia**: Valor constante $k$ hacia el cual convergen las salidas al anularse la potencia.
propiedades_relaciones: |
  - **Límite frontera del recorrido**: La asíntota $y = k$ señala el extremo abierto del conjunto recorrido $\operatorname{Rec}(g) = ]k, +\infty[$ (si $a > 0$) o $\operatorname{Rec}(g) = ]-\infty, k[$ (si $a < 0$).
  - **Distancia a la asíntota**: La función $D(x) = |g(x) - k| = |a \cdot b^{cx + d}|$ mide la distancia vertical entre la curva y su asíntota.
ejemplo_guiado:
  enunciado: 'Identifica la ecuación de la asíntota horizontal y el sentido de aproximación para las siguientes funciones exponenciales transformadas: A) $f(x) = 5 \cdot 3^{2x + 1} - 9$, B) $g(x) = -2 \cdot 4^{-x + 3} + 15$.'
  pasos:
    - 'Paso 1: Para $f(x) = 5 \cdot 3^{2x + 1} - 9$, el término aditivo libre es $k = -9$. La asíntota horizontal es la recta $y = -9$.'
    - 'Paso 2: Como $c = 2 > 0$ y $b = 3 > 1$, el exponente $2x + 1 \to -\infty$ cuando $x \to -\infty$. La aproximación ocurre a la izquierda.'
    - 'Paso 3: Para $g(x) = -2 \cdot 4^{-x + 3} + 15$, el término aditivo libre es $k = 15$. La asíntota horizontal es la recta $y = 15$.'
    - 'Paso 4: Como $c = -1 < 0$ y $b = 4 > 1$, el exponente $-x + 3 \to -\infty$ cuando $x \to +\infty$. La aproximación ocurre a la derecha.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación exacta de la asíntota horizontal de la función exponencial transformada $f(x) = 7 \cdot 2^{4x - 5} - 11$?'
    choices:
      - {text: 'La recta horizontal de ecuación $y = -11$', is_correct: true}
      - {text: 'La recta horizontal de ecuación $y = 7$', is_correct: false}
      - {text: 'La recta vertical de ecuación $x = \frac{5}{4}$', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal de ecuación $y = -11$''. La constante independiente al final de la expresión fija la asíntota horizontal en $y = -11$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en la función $g(x) = 3 \cdot 5^{x} + 4$ modificamos el exponente a $g_2(x) = 3 \cdot 5^{8x - 2} + 4$, ¿qué ocurre con la asíntota horizontal de la función?'
    choices:
      - {text: 'Permanece inalterada en la recta $y = 4$', is_correct: true}
      - {text: 'Se desplaza a la recta $y = -2$', is_correct: false}
      - {text: 'Se desplaza a la recta $y = 24$', is_correct: false}
      - {text: 'La asíntota horizontal desaparece', is_correct: false}
    explanation: 'La alternativa correcta es ''Permanece inalterada en la recta $y = 4$''. Los cambios en los parámetros del exponente ($c = 8, d = -2$) no afectan a la asíntota $y = k = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Aislar la potencia exponencial $b^{cx + d}$ y su coeficiente $a$.'
  - 'Paso 2: Identificar la constante escalar libre $k$ sumada o restada exteriormente al término exponencial.'
  - 'Paso 3: Escribir la ecuación de la asíntota horizontal como $y = k$.'
  - 'Paso 4: Verificar los signos de $c$ y $\ln(b)$ para determinar la dirección de aproximación ($x \to -\infty$ o $x \to +\infty$).'
errores_correccion: |
  - **Error 1:** Creer que la traslación horizontal dentro del exponente (parámetro $d$) modifica la asíntota horizontal. **Cómo corregirlo:** La traslación horizontal desplaza la curva lateralmente pero no altera la cota vertical de la asíntota, la cual sigue siendo $y = k$.
  - **Error 2:** Confundir el coeficiente $a$ con la asíntota horizontal. **Cómo corregirlo:** El coeficiente $a$ altera la escala del corte con el eje $y$, mientras que el término independiente $k$ altera la posición de la asíntota $y = k$.
ejemplos:
  - titulo: 'Identificación de asíntota en modelo complejo'
    enunciado: '¿Cuál es la asíntota horizontal de $f(x) = -3 \cdot e^{2x + 5} + 8$?'
    alternativas:
      - 'La recta $y = 8$'
      - 'La recta $y = -3$'
      - 'La recta $x = -2.5$'
    respuesta: 'La recta $y = 8$'
    solucion_pasos:
      - '1. El término independiente no exponencial es $k = 8$.'
      - '2. La asíntota horizontal es $y = 8$.'
  - titulo: 'Asíntota en resta de constante'
    enunciado: '¿La asíntota horizontal de $g(x) = 4 \cdot 2^{-3x} - 1$ es $y = -1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La constante aditiva es $k = -1$, fijando la asíntota en $y = -1$.'
  - titulo: 'Independencia de la pendiente del exponente'
    enunciado: '¿Multiplicar la variable $x$ por 10 en $f(x) = 2^{10x} + 3$ altera la asíntota $y = 3$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La constante libre sigue siendo $k = 3$, preservando la asíntota horizontal $y = 3$.'
  - titulo: 'Recorrido desde la asíntota'
    enunciado: 'Si $f(x) = 2 \cdot 3^{x-1} + 5$, ¿el recorrido es el intervalo $]5, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = 2 > 0$ y la asíntota es $y = 5$, las imágenes resultan en $]5, +\infty[$.'
errores_frecuentes:
  - 'La asíntota horizontal de la función $f(x) = 3 \cdot 2^{x + 4} - 6$ es la recta $x = -4$.'
  - 'Modificar los números dentro del exponente $cx + d$ cambia la posición de la asíntota horizontal.'
  - 'La asíntota horizontal de $f(x) = 5 \cdot 3^x - 2$ es la recta $y = 5$.'
  - 'Una función exponencial transformada de la forma $a \cdot b^{cx} + k$ posee dos asíntotas horizontales distintas.'
  - 'La asíntota horizontal $y = k$ es tocada por la gráfica cuando el exponente se hace igual a cero.'
afirmaciones_verdaderas:
  - 'La asíntota horizontal de cualquier función exponencial transformada $g(x) = a \cdot b^{cx+d} + k$ viene dada únicamente por la recta $y = k$.'
  - 'Las transformaciones aplicadas dentro del exponente ($cx + d$) modifican la velocidad y sentido de la aproximación asintótica pero no alteran la posición de la recta $y = k$.'
al_terminar_debes_poder: 'Identificar analítica y gráficamente la asíntota horizontal $y = k$ en funciones exponenciales transformadas.'
