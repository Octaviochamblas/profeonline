semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ASINTOTA_TRANSFORMADA
resumen_inicial: 'Identificación de la asíntota horizontal en funciones exponenciales
  trasladadas: conceptos, asíntotas, propiedades e inversidad en Análisis gráfico
  y modelamiento exponencial.'
explicacion_simple: Cuando la curva exponencial se desplaza verticalmente, su "línea
  límite" (la asíntota) se desplaza exactamente en la misma medida, dejando de coincidir
  con el eje $x$.
explicacion_formal: '### Definición formal


  Dada $g(x)=a\cdot b^x+k$, como $a\cdot b^x$ se aproxima a $0$ (sin alcanzarlo) en
  una de las direcciones, $g(x)$ se aproxima a $0+k=k$. Por lo tanto, la asíntota
  horizontal de $g$ es la recta $y=k$.


  ### Desarrollo didáctico


  Basta con identificar la constante sumada al final de la función para conocer directamente
  la nueva asíntota, sin necesidad de ningún cálculo adicional.


  Para $g(x)=5\cdot2^x-8$: la asíntota horizontal es $y=-8$, exactamente el valor
  de la constante sumada (en este caso, restada).'
definiciones_clave: '- **Identificación de la asíntota horizontal en funciones exponenciales
  trasladadas**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a identificación de la asíntota horizontal en funciones exponenciales
  trasladadas.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de identificación
    de la asíntota horizontal en funciones exponenciales trasladadas.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de identificación de la asíntota
    horizontal en funciones exponenciales trasladadas.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
