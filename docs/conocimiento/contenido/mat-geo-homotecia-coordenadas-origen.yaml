propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a homotecia en el plano cartesiano con centro
  en el origen.'
ejemplo_guiado:
  enunciado: En la aplicación de homotecia en el plano cartesiano con centro en el
    origen, se establece una razón $k = 3.2$ entre dos figuras homólogas de longitud
    original $L = 15\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de homotecia en el plano cartesiano con centro en
    el origen.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 3.2 \cdot 15$.'
  - Concluir que la medida obtenida en homotecia en el plano cartesiano con centro
    en el origen es $L' = 48.0\text{ cm}$.
