semantic_id: MAT.GEO.HOMOTECIA.COORDENADAS_ORIGEN
resumen_inicial: 'Homotecia en el plano cartesiano con centro en el origen: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: El caso más simple de homotecia en el plano cartesiano ocurre
  cuando el centro de la transformación coincide con el origen del sistema de coordenadas.
explicacion_formal: '![Homotecia con centro en el origen](/static/img/geometria/congruencia-semejanza/homotecia-coordenadas-origen.svg)


  ### Definición formal


  Para una homotecia de centro $O=(0,0)$ y razón $k$, un punto $P=(x,y)$ se transforma
  en $P''=(kx,ky)$, ya que $P''=O+k(P-O)=k(x,y)$.


  ### Desarrollo didáctico


  El punto $(3,5)$ bajo una homotecia de centro en el origen y razón $k=2$ se transforma
  en $(2\times3, 2\times5)=(6,10)$. Este caso es especialmente simple porque no hay
  que restar las coordenadas del centro (al ser cero).'
definiciones_clave: '- **Homotecia en el plano cartesiano con centro en el origen**:
