semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.INTERES_COMPUESTO
resumen_inicial: La aplicación de la función exponencial en problemas de interés compuesto modela la evolución del capital acumulado $C_f(t) = C_i \cdot \left(1 + \frac{r}{n}\right)^{n \cdot t}$, donde los intereses devengados se capitalizan periódicamente generando un crecimiento exponencial sobre el capital principal.
explicacion_simple: "![La aplicación de la función exponencial en problemas de interés compuesto modela la evolución del capital acumulado $C_f(t) = C_i \\cdot \\left(1 + \\frac{r}{n}\\right)^{n \\cdot t}$, donde los intereses devengados se capitalizan periódicamente generando un crecimiento exponencial sobre el capital principal](/static/img/nodos/aplicacion-de-la-funcion-exponencial-en-problemas-de-interes-compuesto-intro.svg)\n\n\nEl **interés compuesto** es la fuerza financiera más poderosa: es ganar **intereses sobre los intereses que ya ganaste** (efecto bola de nieve):\n\n- **La fórmula maestra:**\n  $$C_f(t) = C_i \\cdot (1 + i)^t$$\n- **¿Qué significa cada letra?**\n  - **$C_i$ (Capital inicial):** La cantidad de dinero depositada al comienzo ($t = 0$).\n  - **$i$ (Tasa de interés por período):** La tasa en decimal (ej: $5\\% = 0,05$).\n  - **$b = 1 + i$ (Factor de capitalización):** Sumas $1 + 0,05 = 1,05$.\n  - **$t$ (Tiempo):** Años o meses que dura la inversión.\n- **Ejemplo:**\
  \ Si depositas $\\$1.000.000\\text{ pesos}$ al 10% anual durante 3 años:\n  $$C_f(3) = 1.000.000 \\cdot (1,10)^3 = 1.000.000 \\cdot 1,331 = \\mathbf{\\$1.331.000\\text{ pesos}}$$"
explicacion_formal: 'Sea un contrato financiero con capital principal $C_i$, tasa nominal anual $r$ y frecuencia de capitalización $n$ veces por año. El **capital final acumulado** tras $t$ años es:

  $$C_f(t) = C_i \left(1 + \frac{r}{n}\right)^{nt}$$


  **Comportamiento en el límite continuo ($n \to \infty$)**:

  Por la definición fundamental del número de Euler $e = \lim_{m \to \infty} \left(1 + \frac{1}{m}\right)^m$:

  $$\lim_{n \to \infty} C_i \left(1 + \frac{r}{n}\right)^{nt} = C_i e^{rt}$$


  **Comparación con el interés simple**:

  - **Interés simple (lineal)**: $C_s(t) = C_i (1 + rt)$.

  - **Interés compuesto (exponencial)**: $C_f(t) = C_i (1 + r)^t > C_i (1 + rt)$ para todo $t > 1$.'
definiciones_clave: '- **Capitalización de intereses**: Proceso de agregar los intereses generados al capital para calcular los siguientes intereses.

  - **Tasa periódica efectiva**: Cociente $i = r/n$ aplicado en cada subperíodo.'
propiedades_relaciones: '- **Crecimiento estrictamente superlineal**: La brecha de ganancias entre el interés compuesto y el simple se amplifica exponencialmente con el tiempo.

  - **Regla del 72**: El tiempo estimado para duplicar una inversión al interés compuesto es $t_{\text{duplicación}} \approx \frac{72}{r\%}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La aplicación de la función exponencial en problemas de interés compuesto modela la evolución del capital acumulado $C_f(t) = C_i \cdot \left(1 + \frac{r}{n}\right)^{n \cdot t}$, donde los intereses devengados se capitalizan periódicamente generando un crecimiento exponencial sobre el capital principal](/static/img/nodos/aplicacion-de-la-funcion-exponencial-en-problemas-de-interes-compuesto-ejemplos.svg)



    Se invierte un capital de $\$2.000.000\text{ pesos}$ a una tasa de interés compuesto del 5% anual durante 4 años con capitalización anual. Modela la función y calcula el monto total obtenido al finalizar el plazo.'
  pasos:
  - 'Paso 1: Identificar datos: $C_i = 2.000.000\text{ pesos}$, tasa $r = 0{,}05$, $n = 1$, $t = 4\text{ años}$.'
  - 'Paso 2: Formular la función exponencial:

    $C_f(t) = 2.000.000 \cdot (1 + 0{,}05)^t = 2.000.000 \cdot (1{,}05)^t$.'
  - 'Paso 3: Evaluar para $t = 4$ años:

    $C_f(4) = 2.000.000 \cdot (1{,}05)^4 = 2.000.000 \cdot 1{,}21550625 = 2.431.012{,}5\text{ pesos}$.'
  - 'Paso 4: Conclusión: El monto final acumulado es de **$\$2.431.013\text{ pesos}$**, habiendo generado $\$431.013\text{ pesos}$ en intereses.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el interés compuesto genera más dinero que el interés simple para plazos mayores a 1 año?
  choices:
  - text: Porque los intereses se reinvierten y generan nuevos intereses (crecimiento exponencial)
    is_correct: true
  - text: Porque el banco cobra comisiones
    is_correct: false
  - text: Porque la tasa cambia cada mes
    is_correct: false
  - text: Porque es una función lineal
    is_correct: false
  explanation: La alternativa correcta es 'Porque los intereses se reinvierten y generan nuevos intereses (crecimiento exponencial)'. La capitalización recurrente multiplica el factor $(1 + r)$ en cada período.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si depositas $\$100.000\text{ pesos}$ al 10% anual compuesto durante 2 años, ¿cuál es el capital final?
  choices:
  - text: $\$121.000\text{ pesos}$ (100.000 · 1,10²)
    is_correct: true
  - text: $\$120.000\text{ pesos}$
    is_correct: false
  - text: $\$110.000\text{ pesos}$
    is_correct: false
  - text: $\$200.000\text{ pesos}$
    is_correct: false
  explanation: La alternativa correcta es '$\$121.000\text{ pesos}$ (100.000 · 1,10²)'. $C_f = 100.000 \cdot 1{,}21 = \$121.000\text{ pesos}$ (en simple habría sido $\$120.000$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el capital inicial $C_i$ y la tasa de interés anual $r$.'
- 'Paso 2: Determinar la frecuencia de capitalización $n$ y calcular la base $b = 1 + \frac{r}{n}$.'
- 'Paso 3: Formular la función exponencial $C_f(t) = C_i \cdot b^{nt}$.'
- 'Paso 4: Evaluar la potencia para el tiempo solicitado y calcular los intereses generados ($I = C_f - C_i$).'
errores_correccion: '- **Error común:** Utilizar la fórmula lineal de interés simple ($C_f = C_i + C_i \cdot r \cdot t$) en problemas de interés compuesto.

  - **Cómo corregirlo:** En interés compuesto **el tiempo $t$ va como EXPONENTE en la potencia**: $C_f = C_i \cdot (1 + r)^t$.'
ejemplos:
- titulo: 'Ejemplo 1: Capitalización anual'
  enunciado: 'Con $\$500.000\text{ pesos}$ al 6% anual compuesto en 3 años:'
  alternativas:
  - $\$595.508\text{ pesos}$
  - $\$590.000\text{ pesos}$
  - $\$530.000\text{ pesos}$
  - $\$600.000\text{ pesos}$
  respuesta: $\$595.508\text{ pesos}$
  solucion_pasos:
  - 'Paso 1: $C_f = 500.000 \cdot (1{,}06)^3 = 500.000 \cdot 1{,}191016 = \$595.508$.'
- titulo: 'Ejemplo 2: Cálculo de intereses generados'
  enunciado: En la inversión anterior ($C_i = \$500.000$, $C_f = \$595.508$), ¿cuánto dinero se ganó en intereses?
  alternativas:
  - $\$95.508\text{ pesos}$
  - $\$595.508\text{ pesos}$
  - $\$90.000\text{ pesos}$
  - $\$30.000\text{ pesos}$
  respuesta: $\$95.508\text{ pesos}$
  solucion_pasos:
  - 'Paso 1: $\text{Interés} = C_f - C_i = 595.508 - 500.000 = \$95.508$.'
- titulo: 'Ejemplo 3: Capitalización semestral'
  enunciado: Si la tasa es 8% anual con capitalización semestral ($n = 2$), ¿cuál es la base semestral?
  alternativas:
  - 1,04 (1 + 0,08/2)
  - 1,08
  - 1,16
  - 1,02
  respuesta: 1,04 (1 + 0,08/2)
  solucion_pasos:
  - 'Paso 1: $b = 1 + 0{,}08/2 = 1{,}04$.'
- titulo: 'Ejemplo 4: Identificación de parámetros'
  enunciado: En $C_f(t) = \$3.500.000 \cdot (1{,}035)^t$, ¿cuál es el capital inicial?
  alternativas:
  - $\$3.500.000\text{ pesos}$
  - $\$1.035\text{ pesos}$
  - $\$35.000\text{ pesos}$
  - $\$3.622.500\text{ pesos}$
  respuesta: $\$3.500.000\text{ pesos}$
  solucion_pasos:
  - 'Paso 1: $C_i = C_f(0) = \$3.500.000$.'
errores_frecuentes:
- Confundir la fórmula de interés compuesto con la de interés simple.
- Olvidar dividir la tasa nominal entre los períodos de capitalización n.
- Multiplicar el capital por la tasa antes de elevar al exponente temporal.
afirmaciones_verdaderas:
- El interés compuesto es una aplicación directa de la función exponencial con base b = 1 + r/n > 1.
- El monto acumulado crece superlinealmente gracias a la capitalización continua de rendimientos.
al_terminar_debes_poder: '**QUÉ:** Modelar y resolver problemas financieros de interés compuesto mediante funciones exponenciales.


  **CÓMO:** Aplicando la fórmula C_f = C_i · (1 + r/n)^(nt) para calcular montos finales e intereses acumulados.


