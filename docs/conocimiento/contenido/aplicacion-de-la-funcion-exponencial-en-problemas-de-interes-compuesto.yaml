semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.INTERES_COMPUESTO
resumen_inicial: La aplicación en interés compuesto calcula el capital acumulado mediante la fórmula exponencial $C(t) = C_0 \cdot (1 + i)^t$.
explicacion_simple: |
  El **interés compuesto** es el mecanismo financiero donde los intereses ganados en cada periodo **se reinvierten** y pasan a generar más intereses (interés sobre interés):

  - La fórmula del monto acumulado $C(t)$ tras $t$ periodos es:

  $$C(t) = C_0 \cdot (1 + i)^t$$

  - **$C_0$ es el capital inicial**: Dinero invertido o prestado al principio ($t = 0$).
  - **$i$ es la tasa de interés por periodo**: Expresada en forma decimal (ej. $6\% \text{ anual} \implies i = 0.06$).
  - **$t$ es el número de periodos de capitalización** (años, meses, trimestres).
explicacion_formal: |
  Sea el capital inicial $C_0 > 0$ colocado a una tasa de interés nominal anual $r$ capitalizable $n$ veces al año durante un tiempo $t$ en años. El **monto acumulado financiero** $C(t)$ se rige por la función exponencial discreta o continua:

  **Formulaciones del interés compuesto:**
  1. **Capitalización Periódica ($n$ veces al año):**
     $$C(t) = C_0 \cdot \left(1 + \frac{r}{n}\right)^{n \cdot t}$$
     Donde $i = r/n$ es la tasa efectiva por periodo de capitalización y $N = n \cdot t$ es el número total de periodos.
  2. **Capitalización Continua ($n \to \infty$):**
     $$C(t) = \lim_{n \to \infty} C_0 \cdot \left(1 + \frac{r}{n}\right)^{nt} = C_0 \cdot e^{r \cdot t}$$
definiciones_clave: |
  - **Interés compuesto**: Sistema de capitalización exponencial donde los intereses producidos en cada periodo se suman al capital para generar nuevos intereses.
propiedades_relaciones: |
  - **Regla de los 72**: Estimación matemática del tiempo de duplicación del capital $t \approx 72 / (r \cdot 100)$, derivada del logaritmo natural $\ln(2) \approx 0.693$.
ejemplo_guiado:
  enunciado: 'Se depositan $\$200.000$ a una tasa de interés compuesto anual del $5\%$. Calcula el monto acumulado al cabo de $3$ años.'
  pasos:
    - 'Paso 1: Identificar el capital inicial $C_0 = 200.000$ y la tasa $i = 5\% = 0.05$.'
    - 'Paso 2: Calcular el factor de capitalización $b = 1 + i = 1 + 0.05 = 1.05$.'
    - 'Paso 3: Construir la función modelo: $C(t) = 200.000 \cdot (1.05)^t$.'
    - 'Paso 4: Evaluar para $t = 3 \implies C(3) = 200.000 \cdot (1.05)^3 = 200.000 \cdot 1.157625 = \$231.525$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si se invierte un capital $C_0$ al $4\%$ de interés compuesto anual durante $t$ años, ¿cuál es la expresión del monto acumulado $C(t)$?'
    choices:
      - {text: '$C(t) = C_0 \cdot (1.04)^t$', is_correct: true}
      - {text: '$C(t) = C_0 \cdot (0.04)^t$.', is_correct: false}
      - {text: '$C(t) = C_0 \cdot (1.4)^t$.', is_correct: false}
      - {text: '$C(t) = C_0 + 0.04 \cdot t$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$C(t) = C_0 \cdot (1.04)^t$''. La base de capitalización es $1 + 0.04 = 1.04$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿En qué se diferencia el interés compuesto del interés simple desde el punto de vista del crecimiento?'
    choices:
      - {text: 'El interés compuesto genera un crecimiento exponencial ($b^t$), mientras que el interés simple genera un crecimiento lineal ($m \cdot t$)', is_correct: true}
      - {text: 'El interés compuesto es decreciente y el simple es creciente.', is_correct: false}
      - {text: 'El interés compuesto no utiliza capital inicial.', is_correct: false}
      - {text: 'Ambos generan exactamente la misma curva exponencial.', is_correct: false}
    explanation: 'La alternativa correcta es ''El interés compuesto genera un crecimiento exponencial ($b^t$), mientras que el interés simple genera un crecimiento lineal ($m \cdot t$)''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer del problema el capital inicial $C_0$ y la tasa nominal $r\%$.'
  - 'Paso 2: Convertir la tasa al periodo de capitalización adecuado $i = r/n$ en formato decimal.'
  - 'Paso 3: Armar la base de la potencia $b = 1 + i$.'
  - 'Paso 4: Elevar al número total de periodos $N = n \cdot t$ y multiplicar por $C_0$.'
errores_correccion: |
  - **Error común:** Aplicar la fórmula de interés simple $C(t) = C_0 \cdot (1 + i \cdot t)$ en problemas de interés compuesto.
  - **Cómo corregirlo:** En el interés **COMPUESTO**, el tiempo $t$ va en el **EXPONENTE**: $C(t) = C_0 \cdot (1 + i)^t$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Inversión a 2 años al 10% anual.
    alternativas:
      - 'C(2) = 500.000 \cdot (1.10)^2 = $605.000'
      - 'C(2) = 500.000 \cdot 1.20 = $600.000'
      - 'C(2) = $550.000'
    respuesta: 'C(2) = 500.000 \cdot (1.10)^2 = $605.000'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Capitalización semestral.
    alternativas:
      - 'Tasa semestral 3%, base 1.03 para t periodos'
      - 'Tasa semestral 6%'
      - 'Base 0.97'
    respuesta: 'Tasa semestral 3%, base 1.03 para t periodos'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada una tasa de interés del $6\%$ anual, la afirmación de que el factor de capitalización es $0.06$.'
  - 'La confusión entre el modelo lineal del interés simple y el modelo exponencial del interés compuesto.'
  - 'La omisión de ajustar el número de periodos $t$ cuando la capitalización es mensual, trimestral o semestral.'
  - 'La afirmación de que el capital inicial $C_0$ cambia si se modifica el tiempo de inversión.'
  - 'La afirmación de que el interés compuesto genera pérdidas o decrecimiento para tasas positivas.'
afirmaciones_verdaderas:
  - 'El interés compuesto se rige por un modelo exponencial de la forma $C(t) = C_0 \cdot (1 + i)^t$ donde los intereses se capitalizan periódicamente.'
  - 'La base de capitalización $(1 + i)$ en el interés compuesto con tasa positiva $i > 0$ es estrictamente mayor que uno.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas financieros de interés compuesto mediante la función exponencial $C(t) = C_0 \cdot (1 + i)^t$.
  CÓMO: Identificar $C_0$, calcular la tasa efectiva $i$, elevar a los periodos $t$ y justificar la acumulación exponencial.
