    segmentos tangentes trazados desde un mismo punto exterior en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede propiedad de congruencia de segmentos tangentes trazados desde un
