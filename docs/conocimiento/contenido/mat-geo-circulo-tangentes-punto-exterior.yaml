semantic_id: MAT.GEO.CIRCULO_RECTAS.TANGENTES_PUNTO_EXTERIOR_CONGRUENTES
resumen_inicial: 'Propiedad de congruencia de segmentos tangentes trazados desde un
  mismo punto exterior: conceptos, teoremas, propiedades geométricas y cálculo en
  Circunferencia y Círculo.'
explicacion_simple: Desde cualquier punto exterior a una circunferencia, siempre es
  posible trazar exactamente dos rectas tangentes; estos dos segmentos comparten una
  propiedad notable.
explicacion_formal: '![Tangentes congruentes desde un punto exterior](/static/img/geometria/circunferencia-circulo/circulo-tangentes-punto-exterior.svg)


  ### Definición formal


  Si $P$ es un punto exterior a una circunferencia de centro $O$, y $PT_1$, $PT_2$
  son los dos segmentos tangentes desde $P$ (con $T_1$, $T_2$ los puntos de tangencia),
  entonces $\overline{PT_1}=\overline{PT_2}$.


  ### Desarrollo didáctico


  Esta propiedad se demuestra fácilmente usando congruencia de triángulos: los triángulos
  $OPT_1$ y $OPT_2$ son congruentes por el criterio LLA mayor (comparten la hipotenusa
  OP, tienen radios iguales OT₁=OT₂, y ambos ángulos en T₁ y T₂ son rectos), lo que
  implica que PT₁=PT₂.'
