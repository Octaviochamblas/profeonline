semantic_id: MAT.NUM.APROXIMACIONES.REGLA_DEL_CINCO
resumen_inicial: "La regla del cinco establece que cuando la primera cifra que se elimina en un redondeo es exactamente un 5, la cifra del orden solicitado se incrementa en 1 si la norma aplica redondeo hacia arriba."
explicacion_simple: |
  En el redondeo clásico, cuando la cifra decisiva es un **5** (por ejemplo en $3.25$ a las décimas), el 5 se encuentra **justo a la mitad** de camino entre $3.2$ y $3.3$. Para evitar ambigüedades, la regla estándar en la escuela (redondeo simétrico al alejar del cero) dice que el 5 **SIEMPRE sube**: se le suma $+1$ a la cifra del orden. Por lo tanto, $3.25$ redondeado a las décimas se convierte en $3.3$.
explicacion_formal: |
  Formalmente, en la aproximación por redondeo al orden $10^m$, la **regla del cinco** especifica la resolución de la frontera intermedia cuando el valor relativo de la cola eliminada es exactamente $0.5 \cdot 10^m$.

  Criterio de desempate en la regla estándar (Half-up):
  $$\text{Si } x = x_0 + 5 \cdot 10^{m-1} \implies x_{\text{red}} = x_{\text{def}} + 10^m = x_{\text{exc}}$$

  Variante estadística (Half-even o redondeo bancario):
  $$\text{Si } a_{m-1} = 5 \text{ y cifras posteriores son } 0 \implies x_{\text{red}} = \begin{cases} a_m & \text{si } a_m \text{ es par} \\ a_m + 1 & \text{si } a_m \text{ es impar} \end{cases}$$
definiciones_clave: |
  - **Dígito de frontera ($5$)**: Valor exacto medio del intervalo de dígitos $[0, 9]$ que requiere una convención formal de desempate.
  - **Redondeo hacia arriba (Half-up)**: Regla escolar estándar donde el dígito $5$ incrementa invariablemente en $+1$ la cifra del orden.
  - **Redondeo al par más cercano (Half-even / Bancario)**: Norma científica y financiera que redondea el $5$ al entero par más próximo para anular sesgos acumulativos.
propiedades_relaciones: |
  - **Simetría del error**: En la regla escolar, la distancia $|x - x_{\text{red}}|$ para $a_{m-1}=5$ es idéntica tanto al defecto como al exceso ($0.5 \cdot 10^m$).
  - **Convenio pedagógico de la educación escolar**: En la currícula nacional MINEDUC, el 5 se trata como la frontera inferior del grupo $\{5, 6, 7, 8, 9\}$ e incrementa la cifra previa.
  - **Impacto en operaciones en cadena**: Comprender el 5 evita discrepancias en pruebas de selección múltiple (PAES).
ejemplo_guiado:
  enunciado: "Redondea a las décimas los números $d_1 = 4.35$ y $d_2 = 8.95$ aplicando la regla estándar escolar del cinco."
  pasos:
    - "Analizar $d_1 = 4.35$ a décimas:"
    - "   Cifra del orden: $3$ (décimas)."
    - "   Cifra decisiva a la derecha: $5$."
    - '   Aplicar regla del 5: el $5$ incrementa la décima en $+1 \implies 3 + 1 = 4$.'
    - "   Resultado: $4.4$."
    - "Analizar $d_2 = 8.95$ a décimas:"
    - "   Cifra del orden: $9$ (décimas)."
    - "   Cifra decisiva a la derecha: $5$."
    - '   Aplicar regla del 5: $9 + 1 = 10 \implies 0$ y reserva $+1$ a las unidades ($8 + 1 = 9$).'
    - "   Resultado: $9.0$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué ocurre con la cifra del orden posicional en el redondeo escolar estándar cuando la primera cifra eliminada a su derecha es exactamente un 5?"
    choices:
      - {text: "Se incrementa en 1 unidad.", is_correct: true}
      - {text: "Se mantiene exactamente igual sin cambios.", is_correct: false}
      - {text: "Se elimina junto con el 5.", is_correct: false}
      - {text: "Se le resta 1 unidad.", is_correct: false}
    explanation: "La correcta es Se incrementa en 1 unidad.: es la convención escolar estándar (Half-up) para la cifra de frontera 5."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el redondeo a las centésimas de $2.145$ bajo la regla estándar?"
    choices:
      - {text: "2.15", is_correct: true}
      - {text: "2.14", is_correct: false}
      - {text: "2.10", is_correct: false}
      - {text: "2.20", is_correct: false}
    explanation: "La correcta es 2.15: la centésima es $4$ y la cifra siguiente es $5$, por lo que $4 + 1 = 5 \\implies 2.15$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Localizar la cifra situada en el orden de aproximación deseado."
  - "Paso 2: Observar la cifra inmediatamente a su derecha."
  - "Paso 3: Si dicha cifra es un $5$ (o un $5$ seguido de otros dígitos), aplicar el incremento de $+1$ a la cifra del orden."
  - "Paso 4: Si la cifra del orden es un $9$, transformar en $0$ y llevar la reserva de $+1$ a la posición izquierda inmediata."
  - "Paso 5: Truncar y eliminar todas las cifras situadas a la derecha del orden aproximado."
errores_correccion: |
  Un error común es dudar si el 5 sube o se queda igual y dejarlo igual creyendo que 'es menor a 5'. **El 5 FORMA PARTE del grupo que sube** ($\{5, 6, 7, 8, 9\}$). Por lo tanto, el 5 siempre suma $+1$ a la cifra anterior en el redondeo escolar.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Redondea a las unidades el número $17.5$."
    alternativas:
      - "18"
      - "17"
      - "17.0"
    respuesta: "18"
    solucion_pasos:
      - "Unidad: $7$. Siguiente cifra: $5$."
      - "Regla del 5: $7 + 1 = 8$."
      - "Resultado: $18$."
  - titulo: "Ejemplo 2"
    enunciado: "Redondea a las décimas el número $0.05$."
    alternativas:
      - "0.1"
      - "0.0"
      - "0.5"
    respuesta: "0.1"
    solucion_pasos:
      - "Décima: $0$. Siguiente cifra: $5$."
      - "Regla del 5: $0 + 1 = 1$."
      - "Resultado: $0.1$."
  - titulo: "¿Está el número 2.5 a la misma distancia de 2 que de 3?"
    respuesta: "Sí, a 0.5 unidades de ambos."
    solucion_pasos:
      - "Efectivamente, $|2.5 - 2| = 0.5$ y $|2.5 - 3| = 0.5$, por lo que la regla del 5 es un convenio de desempate."
  - titulo: "¿Afectan las cifras posteriores al 5 (como en 2.451) si se redondea a las décimas?"
    respuesta: "No, porque con o sin cifras posteriores la cifra 5 ya provoca el incremento."
    solucion_pasos:
      - "En $2.451$, la cifra de las centésimas es $5$, lo que asegura que suba a $2.5$."
errores_frecuentes:
  - "Tratar el 5 como si perteneciera al grupo de las cifras que se mantienen ($0$ a $4$)."
  - "No aplicar la reserva a las unidades cuando se redondea un $9$ seguido de $5$."
  - "Confundir la regla escolar del 5 con el truncamiento por defecto."
  - "Mirar cifras posteriores al 5 antes de aplicar el criterio."
  - "Asumir que el 5 redondea hacia abajo si el número es impar."
afirmaciones_verdaderas:
  - "En el redondeo escolar estándar, si la primera cifra eliminada es 5, se suma 1 a la cifra del orden solicitado."
  - "El número 5 representa el punto medio exacto de equidistancia posicional en base 10."
al_terminar_debes_poder: |
  Debes ser capaz de aplicar la regla del 5 en el redondeo de decimales resolviendo la convención de frontera y gestionando acarreo posicionales.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
