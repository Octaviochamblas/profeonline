semantic_id: MAT.NUM.APROXIMACIONES.REGLA_DEL_CINCO
resumen_inicial: La regla del cinco en el redondeo establece que cuando la primera
  cifra a descartar es un 5 (o mayor), se incrementa en una unidad la cifra de la
  posición retenida.
explicacion_simple: La regla del cinco es la norma central del redondeo que resuelve
  el punto medio exacto. Si la cifra que eliminamos empieza con un 5, el sistema matemático
  considera que estamos a mitad de camino y promueve la cifra conservada al entero
  o decimal inmediatamente superior.
explicacion_formal: 'Dada la expansión $x = \dots a_k, a_{k+1} \dots$ con $a_{k+1}
  = 5$, el **Criterio de la Regla del Cinco** exige:


  $$a_{k+1} \ge 5 \implies a_k \longrightarrow a_k + 1$$


  **Desglose del criterio:**

  - Umbral de redondeo: $5$ marca la frontera simétrica en el sistema de numeración
  decimal base 10 (con dígitos $\{0,1,2,3,4\}$ hacia abajo y $\{5,6,7,8,9\}$ hacia
  arriba).

  - Efecto en cadena: Si $a_k = 9$, la suma $9 + 1 = 10$ transforma la cifra en $0$
  y genera un acarreo de $+1$ a la posición $a_{k-1}$.


  > **Complemento didáctico:** El redondeo de $2,95$ a la décima resulta en $3,0$
  por el efecto en cadena del acarreo sobre el dígito 9.'
definiciones_clave: '- **Regla del cinco**: Convenio matemático que incrementa la
  cifra a aproximar cuando el primer dígito eliminado es mayor o igual a 5.'
propiedades_relaciones: '- **Efecto de acarreo**: Genera cambio de $9 \to 0$ con avance
  de $+1$ a la cifra superior.'
ejemplo_guiado:
  enunciado: Aplique la regla del cinco para redondear $7,35$ a las décimas y $1,95$
    a las décimas.
  pasos:
  - 'Paso 1: Para $7,35$, la centésima es $5 \ge 5$. Se incrementa la décima $3 \to
    4 \implies 7,4$.'
  - 'Paso 2: Para $1,95$, la centésima es $5 \ge 5$. Se incrementa la décima $9 +
    1 = 10 \implies 0$ con acarreo de $+1$ a las unidades ($1+1=2$).'
  - 'Paso 3: Escribir el resultado con el cero decimal retenido: $2,0$.'
  - 'Conclusión: $7,35 \to 7,4$ y $1,95 \to 2,0$ por regla del cinco.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué acción se debe tomar sobre la cifra a retener cuando la primera cifra
    descartada es exactamente igual a 5?
  choices:
  - text: Sumarle 1 unidad a la cifra retenida
    is_correct: true
  - text: Dejar la cifra retenida sin cambios
    is_correct: false
  - text: Restarle 1 unidad a la cifra retenida
    is_correct: false
  - text: Multiplicarla por 5
    is_correct: false
  explanation: La alternativa correcta es 'Sumarle 1 unidad a la cifra retenida'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 1,95 redondeado a las décimas, ¿cuál fue el
    resultado con acarreo?
  choices:
  - text: 2,0
    is_correct: true
  - text: 1,9
    is_correct: false
  - text: 1,90
    is_correct: false
  - text: 2,9
    is_correct: false
  explanation: La alternativa correcta es '2,0'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Constatar que la primera cifra eliminada en el redondeo sea mayor o igual
  a $5$.'
- 'Paso 2: Sumar $1$ a la cifra de la posición decimal que se está reteniendo.'
- 'Paso 3: Si la cifra retenida es $9$, transformarla en $0$ y acarrear $+1$ a la
  posición izquierda inmediata.'
errores_correccion: '- **Error 1: Omitir el cero en el acarreo al redondear dígitos
  9 (escribir $1,95 \to 2$ sin indicar $2,0$).** **Cómo corregirlo:** La precisión
  pedida debe conservarse escribiendo la cifra cero en las décimas ($2,0$).


  - **Error 2: Pensar que si la cifra es exactamente 5 no se suma 1.** **Cómo corregirlo:**
  El número 5 se incluye en el grupo de incremento ($a_{k+1} \ge 5$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Redondee 4,25 a la décima.
  alternativas:
  - 4,3
  - 4,2
  - 4,5
  respuesta: 4,3
  solucion_pasos:
  - La centésima es $5 \implies 4,2 + 0,1 = 4,3$.
- titulo: Ejemplo 2
  enunciado: Redondee 0,05 a la décima.
  alternativas:
  - 0,1
  - 0,0
  - 0,5
  respuesta: 0,1
  solucion_pasos:
  - La centésima es $5 \implies 0,0 + 0,1 = 0,1$.
- titulo: ¿Aplica la regla del cinco la suma de +1 a la cifra retenida al evaluar
    el dígito 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la norma estándar de redondeo en base 10.
- titulo: ¿Es 3,95 redondeado a las décimas igual a 4,0?
  respuesta: Sí
  solucion_pasos:
  - Sí, la décima $9 + 1 = 10 \implies 4,0$.
errores_frecuentes:
- Cuando la cifra a evaluar es exactamente 5 la cifra retenida debe permanecer inalterada.
- La regla del cinco aplica exclusivamente a la parte entera de los números racionales.
- Sumar 1 a una cifra 9 elimina la coma decimal transformando el número en entero
  positivo.
- El redondeo por regla del cinco de $0,15$ a las décimas entrega como resultado $0,1$.
- La regla del cinco invierte los signos si la cifra se encuentra en los centésimos.
afirmaciones_verdaderas:
- La regla del cinco exige sumar 1 a la cifra de corte cuando la primera cifra descartada
  es $\ge 5$.
- Si la cifra a incrementar es un 9, se convierte en 0 y se acarrea 1 a la posición
  inmediatamente a su izquierda.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla del cinco en
  el redondeo, gestionando adecuadamente los incrementos y acarreos cuando la cifra
  descartada es igual o mayor a 5.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
