procedimiento:
- 'Paso 1: Recuerda que esta identidad es válida para cualquier ángulo x, sin restricción
  de cuadrante.'
- 'Paso 2: Si conoces sinx (o cosx), despeja el otro término usando cos²x=1-sin²x
  (o viceversa).'
- 'Paso 3: Determina el signo correcto de la raíz cuadrada según el cuadrante en que
  se ubique x.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con aplicación de la identidad pitagórica sen²(x) + cos²(x)
  = 1.
