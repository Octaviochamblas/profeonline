semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.IDENTIDAD_PITAGORICA
resumen_inicial: 'Aplicación de la identidad pitagórica sen²(x) + cos²(x) = 1: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: 'En la circunferencia unitaria (radio 1), cada punto sobre ella
  tiene coordenadas (cosx, sinx), por lo que la identidad pitagórica es simplemente
  la ecuación de esa circunferencia: x²+y²=1.'
explicacion_formal: '![Identidad pitagórica en la circunferencia unitaria](/static/img/geometria/trigonometria/trigid-pitagorica.svg)


  ### Definición formal


  Si $P=(\cos x,\sin x)$ es un punto sobre la circunferencia de radio 1 centrada en
  el origen, entonces por definición de esa circunferencia se cumple $\cos^2x+\sin^2x=1$,
  para cualquier valor de $x$.


  ### Desarrollo didáctico


  A diferencia de la identidad vista en triángulos rectángulos (válida solo para ángulos
  agudos), esta versión es válida para cualquier ángulo, incluyendo los mayores a
  90° y los negativos, porque se basa en la definición de seno y coseno mediante la
  circunferencia unitaria, no en un triángulo específico.'
definiciones_clave: '- **Aplicación de la identidad pitagórica sen²(x) + cos²(x) =
  1**: Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a aplicación de la identidad pitagórica sen²(x)
  + cos²(x) = 1.'
ejemplo_guiado:
  enunciado: Para evaluar la razón o relación en aplicación de la identidad pitagórica
    sen²(x) + cos²(x) = 1, se considera un triángulo rectángulo con cateto $a = 1393\text{
    cm}$ e hipotenusa $c = 4180\text{ cm}$. Calcula el valor de la función trigonométrica.
  pasos:
  - Aplicar la definición trigonométrica de aplicación de la identidad pitagórica
    sen²(x) + cos²(x) = 1.
  - Sustituir los lados $a = 1393$ y $c = 4180$.
  - Calcular el valor exacto o aproximado de la razón.
