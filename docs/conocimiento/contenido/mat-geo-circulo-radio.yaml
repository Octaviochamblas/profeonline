semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.RADIO
resumen_inicial: 'Identificación del radio como segmento desde el centro hasta la
  circunferencia: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: Con el centro ya identificado, el siguiente elemento fundamental
  es el segmento que lo conecta con el borde de la figura.
explicacion_formal: '![Radio: segmento del centro a la circunferencia](/static/img/geometria/circunferencia-circulo/circulo-radio.svg)


  ### Definición formal


  El radio $r$ es el segmento $\overline{OP}$, donde $O$ es el centro y $P$ es un
  punto cualquiera de la circunferencia. Todos los radios de una misma circunferencia
  tienen igual longitud.


  ### Desarrollo didáctico


  Una circunferencia tiene infinitos radios posibles (uno por cada punto de la curva),
  pero todos comparten exactamente la misma longitud, ya que esa es precisamente la
  condición que define a la circunferencia.'
definiciones_clave: '- **Identificación del radio como segmento desde el centro hasta
  la circunferencia**: Elemento o propiedad fundamental en el estudio de circunferencia
  y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del radio como segmento desde
  el centro hasta la circunferencia.'
ejemplo_guiado:
