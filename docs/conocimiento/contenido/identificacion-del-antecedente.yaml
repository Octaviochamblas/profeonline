semantic_id: MAT.NUM.RAZONES.ANTECEDENTE
resumen_inicial: El antecedente es el primer término de una razón (el numerador en
  la notación $\frac{a}{b}$ o el número a la izquierda en $a:b$).
explicacion_simple: 'En la expresión de una razón $a:b$:

  - El número de arriba o de la izquierda ($a$) es el **antecedente**.

  - Indica la cantidad inicial que se está comparando.

  Ejemplo: En la razón $7:4$, el antecedente es el $7$.'
explicacion_formal: En la razón geométrica $a:b = \frac{a}{b}$, el elemento $a \in
  \mathbb{R}$ recibe el nombre de antecedente. Corresponde al dividendo de la operación
  de cociente.
definiciones_clave: '- **Antecedente ($a$)**: Primer valor de la razón ubicado en
  el numerador.'
propiedades_relaciones: '- **Posición operacional**: Dividendo en el cálculo del valor
  de la razón.'
ejemplo_guiado:
  enunciado: Identifica el antecedente en la razón $\frac{9}{14}$.
  pasos:
  - Observar la posición de los números en la fracción.
  - El número ubicado en el numerador (arriba) es el 9.
  - Concluir que el antecedente es 9.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el antecedente en la razón $11:3$?
  choices:
  - text: '11'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '14'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: 'La correcta es: 11. El primer término (a la izquierda de los dos puntos)
    es el antecedente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la razón $\frac{5}{12}$, ¿qué número cumple el rol de antecedente?
  choices:
  - text: '5'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '17'
    is_correct: false
  - text: '7'
    is_correct: false
  explanation: 'La correcta es: 5. El número ubicado en el numerador es el antecedente.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la razón en notación $a:b$ o $\frac{a}{b}$.'
- 'Paso 2: Extraer el primer número escrito o el numerador de la fracción.'
errores_correccion: No confundas el antecedente con el consecuente. El antecedente
  siempre va primero (arriba o a la izquierda).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el antecedente en $4:9$?
  alternativas:
  - '4'
  - '9'
  - '13'
  respuesta: '4'
  solucion_pasos:
  - El primer término es 4.
errores_frecuentes:
- Confundir el antecedente con el consecuente.
afirmaciones_verdaderas:
- El antecedente es el primer término de una razón.
al_terminar_debes_ponder: Identificar el antecedente en cualquier expresión de razón.
fuente: Texto escolar MINEDUC.
estado: publicado
