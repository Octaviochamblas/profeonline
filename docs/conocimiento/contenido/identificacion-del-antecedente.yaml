semantic_id: MAT.NUM.RAZONES.ANTECEDENTE
resumen_inicial: El antecedente es el primer término de una razón (el numerador en la notación
  $\frac{a}{b}$ o el número a la izquierda en $a:b$).
explicacion_simple: 'En la expresión de una razón $a:b$:

  - El número de arriba o de la izquierda ($a$) es el **antecedente**.

  - Indica la cantidad inicial que se está comparando.

  Ejemplo: En la razón $7:4$, el antecedente es el $7$.'
explicacion_formal: En la razón geométrica $a:b = \frac{a}{b}$, el elemento $a \in \mathbb{R}$
  recibe el nombre de antecedente. Corresponde al dividendo de la operación de cociente.
definiciones_clave: '- **Antecedente ($a$)**: Primer valor de la razón ubicado en el numerador.'
propiedades_relaciones: '- **Posición operacional**: Dividendo en el cálculo del valor de
  la razón.'
ejemplo_guiado:
  enunciado: Identifica el antecedente en la razón $\frac{9}{14}$.
  pasos:
  - Observar la posición de los números en la fracción.
  - El número ubicado en el numerador (arriba) es el 9.
  - Concluir que el antecedente es 9.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el antecedente en la razón $11:3$?
  choices:
  - text: '11'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '14'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: 'La correcta es: 11. El primer término (a la izquierda de los dos puntos) es
    el antecedente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la razón $\frac{5}{12}$, ¿qué número cumple el rol de antecedente?
  choices:
  - text: '5'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '17'
    is_correct: false
  - text: '7'
    is_correct: false
  explanation: 'La correcta es: 5. El número ubicado en el numerador es el antecedente.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la razón en notación $a:b$ o $\frac{a}{b}$.'
- 'Paso 2: Extraer el primer número escrito o el numerador de la fracción.'
errores_correccion: No confundas el antecedente con el consecuente. El antecedente siempre
  va primero (arriba o a la izquierda).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el antecedente en $4:9$?
  alternativas:
  - '4'
  - '9'
  - '13'
  respuesta: '4'
  solucion_pasos:
  - El primer término es 4.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el antecedente en la razón 6:11?
  alternativas:
  - '6'
  - '11'
  - '17'
  respuesta: '6'
  solucion_pasos:
  - El primer término, a la izquierda, es el antecedente.
- titulo: ¿El antecedente puede ser un número mayor que el consecuente?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo en 9:2, el antecedente 9 es mayor que el consecuente 2.
- titulo: ¿El antecedente es siempre el número que aparece a la derecha de los dos puntos?
  respuesta: 'No'
  solucion_pasos:
  - El antecedente siempre va a la izquierda, o en el numerador de la fracción.
errores_frecuentes:
- Confundir el antecedente con el consecuente.
- Buscar el antecedente en el denominador de la fracción en vez de en el numerador.
- Confundir el antecedente con el valor de la razón, el resultado de la división.
- Cambiar el orden de los términos al copiar la razón desde el enunciado.
- Pensar que el antecedente siempre debe ser el número mayor de los dos.
afirmaciones_verdaderas:
- El antecedente es el primer término de una razón.
- El antecedente siempre corresponde al numerador cuando la razón se escribe como fracción.
al_terminar_debes_poder: Identificar el antecedente en cualquier expresión de razón.
fuente: Texto escolar MINEDUC.
estado: publicado
