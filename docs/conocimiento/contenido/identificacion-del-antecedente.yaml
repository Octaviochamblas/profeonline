resumen_inicial: 'El antecedente de una razón $a : b$ o $\frac{a}{b}$ es el primer
  término nombrado o numerador que se compara respecto a la segunda cantidad.'
explicacion_simple: En una razón, el antecedente es el número que va primero (a la
  izquierda de los dos puntos o en la parte de arriba de la fracción). Representa
  la cantidad que estamos comparando.
explicacion_formal: 'En la razón $r = \frac{a}{b} = a : b$, el **Antecedente $a$**
  se define como la magnitud que actúa como dividendo:


  $$a = \text{Antecedente} \in \mathbb{R}$$


  **Propiedad de orden:**

  - El valor de la razón depende directamente del orden: alterar el antecedente cambia
  el significado de la comparación ($a : b \neq b : a$).'
definiciones_clave: '- **Antecedente**: Primer término $a$ en la razón $a : b$ o numerador
  en $\frac{a}{b}$.'
propiedades_relaciones: '- **Dividendo de la razón**: Determina el número que se compara
  sobre el consecuente.'
ejemplo_guiado:
  enunciado: En la razón entre el peso de una bolsa ($5\text{ kg}$) y su volumen ($2\text{
    L}$), identifique el antecedente.
  pasos:
  - 'Paso 1: Escribir la razón en el orden nombrado: $5 : 2$ o $\frac{5}{2}$.'
  - 'Paso 2: Identificar el primer término (numerador): el número $5$.'
  - 'Conclusión: El antecedente es $5\text{ kg}$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué posición ocupa el antecedente a en la razón a : b o a/b?'
  choices:
  - text: Es el primer término nombrado o el numerador de la fracción
    is_correct: true
  - text: Es el denominador de la fracción
    is_correct: false
  - text: Es el resultado final del cociente
    is_correct: false
  - text: Es siempre el número menor
    is_correct: false
  explanation: La alternativa correcta es 'Es el primer término nombrado o el numerador
    de la fracción'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para la razón 5 kg : 2 L, ¿cuál fue el antecedente?'
  choices:
  - text: 5 kg
    is_correct: true
  - text: 2 L
    is_correct: false
  - text: '2.5'
    is_correct: false
  - text: '10'
    is_correct: false
  explanation: La alternativa correcta es '5 kg'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: 'Al terminar serás capaz de identificar el antecedente $a$
  en cualquier razón $a : b = \frac{a}{b}$, reconociendo su función como dividendo
  o numerador.'
semantic_id: MAT.NUM.RAZONES.ANTECEDENTE
procedimiento:
- 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la comparación por
  cociente.'
- 'Paso 2: Calcular el valor de la razón $k = a / b$ o aplicar las propiedades de
  series de razones.'
- 'Paso 3: Simplificar y expresar la respuesta en términos del problema planteado.'
errores_correccion: '- **Error 1: Confundir la comparación por cociente con la comparación
  por diferencia (resta).** **Cómo corregirlo:** La razón matemática es multiplicativa
  por división ($a/b$), no por resta ($a-b$).


  - **Error 2: Invertir el orden entre antecedente y consecuente.** **Cómo corregirlo:**
  Respetar estrictamente el orden nombrado en el enunciado ($a:b$ pone a $a$ arriba
  y a $b$ abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAZONES.ANTECEDENTE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de razones.
- titulo: Ejemplo 2
  enunciado: Verificación de la relación proporcional.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por cociente.
- titulo: ¿Es el consecuente de una razón siempre distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división por cero.
- titulo: ¿Se conserva la constante k al sumar antecedentes y consecuentes en una
    serie?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de las series de razones.
errores_frecuentes:
- Calcular la razón entre dos magnitudes mediante la resta de sus valores numéricos.
- Invertir la posición del antecedente y del consecuente alterando el valor escalar
  de la razón.
- Utilizar el número cero como el consecuente de una razón matemática.
- La constante de la razón $k$ en una serie de razones cambia al sumar los antecedentes.
- Sumar directamente los términos de la razón sin multiplicar por la constante $k$.
afirmaciones_verdaderas:
- 'Una razón es la comparación por cociente $a : b = \frac{a}{b}$ entre dos magnitudes
  con $b \neq 0$.'
- En una serie de razones iguales $\frac{a}{b} = \frac{c}{d} = k$, la razón entre
  la suma de antecedentes y la suma de consecuentes equivale a $k$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
