semantic_id: MAT.NUM.RAZONES.ANTECEDENTE
resumen_inicial: 'El antecedente de una razón $a : b$ o $\frac{a}{b}$ es el primer término de la relación, ubicado en el numerador de la fracción o a la izquierda del signo de dos puntos.'
explicacion_simple: |
  En cualquier razón matemática, el número que se menciona primero es el **antecedente**. En la fracción $\frac{a}{b}$, el antecedente es el número de arriba ($a$). En la notación $a : b$, es el número que está a la izquierda ($a$). Por ejemplo, en la razón $5 : 8$, el antecedente es el 5. Representa la cantidad que estamos comparando respecto a la referencia.
explicacion_formal: |
  ### Definición formal
  En la estructura analítica de una razón geométrica $r = \frac{a}{b} = a : b$:
  - El **antecedente** es el dividendo o término superior:
    $$\text{Antecedente} = a \quad (a \in \mathbb{R})$$

  ### Rol en el cálculo del valor de la razón
  El antecedente actúa como la cantidad evaluada o numeradora. Al despejar la relación:
  $$a = b \cdot r$$
  demostrando que el antecedente es igual al producto del consecuente por el valor de la razón.

  ### Identificación lingüística en problemas verbales
  En enunciados del tipo *"La razón de $X$ a $Y$ es..."*, la cantidad correspondiente a **$X$** es sistemáticamente el **antecedente**.

  ### Síntesis didáctica
  - Posición en fracción $\frac{a}{b}$: Numerador $a$.
  - Posición en puntos $a : b$: Primer término (izquierda) $a$.
definiciones_clave: |
  - **Antecedente**: Primer elemento de una razón que ocupa la posición de numerador o dividendo.
  - **Dividendo de la razón**: Cantidad cuantitativa que se va a dividir entre la referencia consecuente.
  - **Término evaluado**: Magnitud que se mide en función de las unidades del consecuente.
propiedades_relaciones: |
  - **Variación directamente proporcional**: Si el consecuente se mantiene constante, el valor de la razón varía en forma directamente proporcional a los cambios del antecedente.
  - **Cálculo del antecedente**: Si se conoce el consecuente $b$ y el valor de la razón $r$, el antecedente se calcula como $a = b \cdot r$.
ejemplo_guiado:
  enunciado: 'En la razón dada por la fracción $\frac{15}{4}$, identifica cuál es el antecedente y calcula su valor si el consecuente se duplica manteniendo la razón constante.'
  pasos:
    - 'Paso 1: Identificamos la posición del numerador en la fracción $\frac{15}{4}$.'
    - 'Paso 2: Concluimos que el **antecedente es 15** (y el consecuente es 4).'
    - 'Paso 3: Si el consecuente se duplica a $4 \cdot 2 = 8$, para mantener la razón constante $r = \frac{15}{4} = 3.75$, planteamos $a = 8 \cdot 3.75$.'
    - 'Paso 4: Calculamos el nuevo antecedente: $a = 30$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué término ocupa el antecedente en la expresión escrita en notación de puntos $a : b$?'
    choices:
      - {text: 'El primer número $a$, situado a la izquierda del signo de dos puntos', is_correct: true}
      - {text: 'El segundo número $b$, situado a la derecha', is_correct: false}
      - {text: 'El resultado de la división entre ambos', is_correct: false}
      - {text: 'La suma de los dos números $a + b$', is_correct: false}
    explanation: 'La alternativa correcta es ''El primer número $a$, situado a la izquierda del signo de dos puntos''. En la relación $a : b$, el antecedente es el primer término $a$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se indica que la razón de lápices a cuadernos es $7 : 3$, ¿cuál es el antecedente de dicha razón?'
    choices:
      - {text: '$7$, que corresponde a la cantidad de lápices mencionada en primer lugar', is_correct: true}
      - {text: '$3$, que representa a los cuadernos', is_correct: false}
      - {text: '$10$, sumando ambos objetos', is_correct: false}
      - {text: '$2.33$, dividiendo $7 / 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$7$, que corresponde a la cantidad de lápices mencionada en primer lugar''. El primer elemento mencionado es el antecedente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer la expresión de la razón en su notación de puntos $a : b$ o fraccionaria $\frac{a}{b}$.'
  - 'Paso 2: Ubicar el número situado en el numerador o a la izquierda del signo de dos puntos.'
  - 'Paso 3: Declarar dicho número como el antecedente de la razón.'
  - 'Paso 4: Verificar en enunciados verbales que corresponda a la primera magnitud mencionada.'
errores_correccion: |
  - **Error 1:** Confundir el antecedente con el consecuente (ej: afirmar que en $\frac{3}{5}$ el antecedente es 5). **Cómo corregirlo:** Recuerda que **el antecedente siempre va ARRIBA (numerador)** o PRIMERO a la izquierda. El número de abajo es el consecuente.
  - **Error 2:** Creer que el antecedente debe ser siempre mayor que el consecuente. **Cómo corregirlo:** El antecedente puede ser **menor, mayor o igual** al consecuente (ej: en la razón de $2 : 9$, el antecedente es $2$, que es menor que $9$).
ejemplos:
  - titulo: 'Identificación en fracción'
    enunciado: 'En la razón $\frac{9}{14}$, ¿el antecedente es el número $9$?'
    alternativas:
      - 'Sí, por ser el numerador'
      - 'No, es el 14'
      - 'No, es la división 9/14'
    respuesta: 'Sí, por ser el numerador'
    solucion_pasos:
      - '1. Ubicamos el numerador de $\frac{9}{14}$.'
      - '2. Concluimos que el antecedente es 9.'
  - titulo: 'Identificación en enunciado verbal'
    enunciado: 'En la frase "la razón entre perros y gatos es 4 a 1", ¿el antecedente representa a la cantidad de perros (4)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La primera magnitud mencionada (perros) corresponde al antecedente 4.'
  - titulo: 'Antecedente menor que consecuente'
    enunciado: 'En la razón $1 : 6$, ¿el antecedente es $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ocupa el primer término independientemente de su tamaño.'
  - titulo: 'Despeje de antecedente'
    enunciado: 'Si la razón es $r = 4$ y el consecuente es $b = 5$, ¿el antecedente es $a = 20$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a = b \cdot r = 5 \cdot 4 = 20$.'
errores_frecuentes:
  - 'Identificar la segunda componente (denominador) como el antecedente de la razón.'
  - 'El antecedente debe ser siempre estrictamente mayor que el consecuente en cualquier razón.'
  - 'El antecedente se calcula sumando el consecuente más el valor numérico del cociente $r$.'
  - 'Invertir el antecedente al traducir un enunciado del lenguaje natural a la notación matemática.'
  - 'Sumar el antecedente y el consecuente para determinar la cantidad inicial.'
afirmaciones_verdaderas:
  - 'El antecedente de una razón es el primer término $a$ situado en el numerador de la fracción $\frac{a}{b}$ o a la izquierda de $a : b$.'
  - 'El antecedente se calcula multiplicando el consecuente por el valor de la razón ($a = b \cdot r$).'
al_terminar_debes_poder: 'Identificar y calcular el antecedente $a$ de una razón $a : b$ en representaciones simbólicas y verbales.'
