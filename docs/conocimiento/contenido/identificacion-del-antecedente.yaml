semantic_id: MAT.NUM.RAZONES.ANTECEDENTE
resumen_inicial: 'El antecedente de una razón $a : b$ o $\frac{a}{b}$ es el primer término nombrado (el dividendo o numerador), que representa la cantidad que se está comparando respecto a la referencia.'
explicacion_simple: '![Identificación del antecedente](/static/img/nodos/identificacion-del-antecedente-intro.svg)


  En cualquier razón $a : b$:

  - El **antecedente** es el número que va **primero** (o **arriba** en la fracción).

  - Es la cantidad principal que estamos evaluando.

  - Ejemplo: En la razón «$7$ autos por cada $3$ motos», el antecedente es **$7$** (los autos).

  - En $\frac{12}{5}$, el antecedente es **$12$**.

  - El antecedente puede ser mayor, menor o igual que el consecuente.'
explicacion_formal: 'Dada una razón geométrica $r = \frac{a}{b}$ con $a, b \in \mathbb{R}$ y $b \neq 0$, se define formalmente como **antecedente** al elemento:


  $$a = \operatorname{Ant}(r) \in \mathbb{R}$$


  correspondiente al dividendo de la operación cociente.


  **Propiedad Proporcional:**

  En toda proporción $\frac{a}{b} = k$, el antecedente se obtiene directamente multiplicando el consecuente por la constante de proporcionalidad:

  $$a = k \cdot b$$'
definiciones_clave: '- **Antecedente**: Primer término de la razón ($a$ en $a : b$ o en $\frac{a}{b}$).

  - **Dividendo**: Cantidad que es dividida por el consecuente.

  - **Término comparado**: Magnitud evaluada en relación a la base de referencia.'
propiedades_relaciones: '- **Relación con la constante**: $a = k \cdot b$.

  - **Posición fija**: En la notación $a : b$, ocupa estrictamente la primera posición antes de los dos puntos.'
ejemplo_guiado:
  enunciado: '![Ejemplos de antecedente](/static/img/nodos/identificacion-del-antecedente-ejemplos.svg)


    En el enunciado «La razón entre autos y motos en un estacionamiento es $7$ a $3$», identifique el antecedente y determine el antecedente simplificado de $18 : 24$.'
  pasos:
  - 'Paso 1: Para autos y motos: La primera magnitud nombrada son los autos ($7$) $\implies$ Antecedente = $7$.'
  - 'Paso 2: Escribir en forma fraccionaria: $\frac{7}{3}$, donde el numerador superior es $7$.'
  - 'Paso 3: Para $18 : 24$: El antecedente original es $18$.'
  - 'Paso 4: Simplificar dividiendo por 6: $\frac{18:6}{24:6} = \frac{3}{4} \implies$ Antecedente simplificado = $3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el antecedente en la razón $\frac{5}{12}$?
  choices:
  - text: $5$ (el numerador o primer término)
    is_correct: true
  - text: $12$
    is_correct: false
  - text: $17$
    is_correct: false
  - text: $0,416$
    is_correct: false
  explanation: La alternativa correcta es '$5$ (el numerador o primer término)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el antecedente de «autos a motos es 7 a 3» es 7 y no 3?
  choices:
  - text: Porque los autos fueron nombrados primero en el enunciado
    is_correct: true
  - text: Porque 7 es mayor que 3
    is_correct: false
  - text: Porque 7 es un número primo
    is_correct: false
  - text: Porque siempre se elige el número impar
    is_correct: false
  explanation: La alternativa correcta es 'Porque los autos fueron nombrados primero en el enunciado'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado y localizar cuál es la primera magnitud o cantidad que se menciona.'
- 'Paso 2: En la expresión escrita $a : b$ o $\frac{a}{b}$, seleccionar el primer número o el numerador superior.'
- 'Paso 3: Verificar que no se haya invertido con el consecuente de referencia.'
errores_correccion: '- **Error 1: Elegir siempre el número mayor como antecedente.** **Cómo corregirlo:** El antecedente puede ser menor (ej: en $2 : 5$, el antecedente es $2$). Depende solo del orden.

  - **Error 2: Confundir antecedente con consecuente.** **Cómo corregirlo:** Antecedente viene de «antes» (el primero); consecuente viene de «después» (el segundo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Cuál es el antecedente en la razón $9 : 2$?'
  alternativas:
  - $9$
  - $2$
  - $4,5$
  respuesta: $9$
  solucion_pasos:
  - 'El primer término de la razón $9 : 2$ es $9$.'
- titulo: Ejemplo 2
  enunciado: Si el consecuente es $8$ y el valor de la razón es $k = 3$, ¿cuánto vale el antecedente?
  alternativas:
  - $24$
  - $11$
  - $2,67$
  respuesta: $24$
  solucion_pasos:
  - $a = k \cdot b = 3 \cdot 8 = 24$.
- titulo: '¿Es 1 el antecedente en la razón 1 : 4?'
  respuesta: Sí
  solucion_pasos:
  - Sí, $1$ es el primer término de la comparación.
  alternativas:
  - texto: Sí, es el primer término aunque sea menor que 4
    es_correcta: true
    retroalimentacion: ¡Correcto! El antecedente puede ser menor.
  - texto: No, el antecedente siempre debe ser mayor que 1
    es_correcta: false
    retroalimentacion: Incorrecto, no hay restricción de tamaño.
  - texto: No, el antecedente es 4
    es_correcta: false
    retroalimentacion: Incorrecto, 4 es el consecuente.
- titulo: ¿Es el antecedente el numerador en la representación fraccionaria?
  respuesta: Sí
  solucion_pasos:
  - Sí, en $\frac{a}{b}$, el antecedente es $a$ (numerador).
  alternativas:
  - texto: Sí, ocupa la posición superior del cociente
    es_correcta: true
    retroalimentacion: ¡Correcto! Numerador $\equiv$ Antecedente.
  - texto: No, es el denominador
    es_correcta: false
    retroalimentacion: Incorrecto, el denominador es el consecuente.
  - texto: No, es el resultado final
    es_correcta: false
    retroalimentacion: Incorrecto, el resultado es el valor de la razón.
errores_frecuentes:
- Creer que el antecedente siempre debe ser el número mayor.
- Invertir la posición y tomar el denominador como antecedente.
- Asumir que el antecedente cambia al simplificar la razón.
- Olvidar que $a = k \cdot b$ permite despejar el antecedente.
afirmaciones_verdaderas:
- 'El antecedente es el primer término de la razón $a : b$ o el numerador de $\frac{a}{b}$.'
- El antecedente puede ser mayor, menor o igual que el consecuente.
- 'Se calcula multiplicando el consecuente por el valor de la razón: $a = k \cdot b$.'
al_terminar_debes_poder: '![Síntesis de antecedente](/static/img/nodos/identificacion-del-antecedente-resumen.svg)


  QUÉ: Identificar, extraer y calcular el antecedente de una razón matemática.


  CÓMO: Localizando el primer término o numerador $a$ en $a : b$, o despejándolo mediante la relación fundamental $a = k \cdot b$ a partir del consecuente y el valor de la razón.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
