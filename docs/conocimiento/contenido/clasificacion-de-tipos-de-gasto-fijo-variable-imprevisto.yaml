resumen_inicial: 'Los gastos personales se clasifican según su previsibilidad y variabilidad
  en tres categorías: gastos fijos (invariables periódicos), gastos variables (ajustables
  al consumo) y gastos imprevistos (emergencias no planificadas).'
explicacion_simple: 'En las finanzas personales, los gastos son salidas de dinero
  que se dividen en tres tipos: los fijos que pagamos siempre igual (como el arriendo
  o dividendo), los variables que cambian según lo que consumamos (como la cuenta
  de luz o supermercado) y los imprevistos que ocurren por emergencias (como una reparación).'
explicacion_formal: 'La **Estructura de Egresos Personales** clasifica todo egreso
  $G_t$ según su función de comportamiento:


  $$G_{total} = G_{fijo} + G_{variable} + G_{imprevisto}$$


  **Definición formal de categorías:**

  - Gastos Fijos ($G_{fijo}$): Obligaciones de costo constante independiente del nivel
  de actividad mensual.

  - Gastos Variables ($G_{variable}$): Egresos vinculados a patrones de consumo modificables
  a corto plazo.

  - Gastos Imprevistos ($G_{imprevisto}$): Desembolsos eventuales que requieren cobertura
  por fondo de emergencia.'
definiciones_clave: '- **Gastos fijos, variables e imprevistos**: Clasificación tripartita
  de los egresos en el presupuesto personal.'
propiedades_relaciones: '- **Suma presupuestaria**: $G_{total} = G_{fijo} + G_{variable}
  + G_{imprevisto}$.'
ejemplo_guiado:
  enunciado: 'Clasifique los siguientes gastos mensuales: Arriendo (\$350.000), Cuenta
    de luz (\$28.000) y Consulta médica de emergencia (\$45.000).'
  pasos:
  - 'Paso 1: Arriendo de \$350.000 es mensual e invariable $\implies$ Gasto Fijo.'
  - 'Paso 2: Cuenta de luz de \$28.000 varía según el consumo $\implies$ Gasto Variable.'
  - 'Paso 3: Consulta médica por emergencia $\implies$ Gasto Imprevisto.'
  - 'Conclusión: Arriendo = Fijo, Luz = Variable, Médico = Imprevisto.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se clasifican los egresos personales en el presupuesto según su
    variabilidad y previsibilidad?
  choices:
  - text: En gastos fijos, gastos variables y gastos imprevistos
    is_correct: true
  - text: En ingresos fijos e ingresos variables
    is_correct: false
  - text: Únicamente en deudas a largo plazo
    is_correct: false
  - text: En impuestos brutose impuestos netos
    is_correct: false
  explanation: La alternativa correcta es 'En gastos fijos, gastos variables y gastos
    imprevistos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la cuenta de luz se considera un gasto
    variable?
  choices:
  - text: Porque su monto cambia mes a mes según el nivel de consumo eléctrico
    is_correct: true
  - text: Porque es un arriendo mensual fijo
    is_correct: false
  - text: Because es una emergencia médica
    is_correct: false
  - text: Porque no se debe pagar
    is_correct: false
  explanation: La alternativa correcta es 'Porque su monto cambia mes a mes según
    el nivel de consumo eléctrico'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de clasificar y estructurar egresos
  financieros en gastos fijos, variables e imprevistos en un presupuesto personal.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_GASTO
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.TIPOS_GASTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
