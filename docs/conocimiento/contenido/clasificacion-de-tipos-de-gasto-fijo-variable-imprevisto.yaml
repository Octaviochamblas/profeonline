semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_GASTO
resumen_inicial: 'Clasificación de tipos de gasto (fijo, variable, imprevisto): concepto y
  propiedades fundamentales en Finanzas personales.'
explicacion_simple: ¿A dónde se fue mi sueldo? Para tomar el control de tu dinero, lo primero
  es etiquetar las salidas. No es lo mismo pagar el arriendo mensual que comprarte un café
  por antojo.
explicacion_formal: 'En educación financiera, armar un presupuesto requiere conocer tus tipos
  de egresos (salidas de dinero):


  - **Gasto Fijo:** Son aquellos de los que no puedes escapar a corto plazo y su monto suele
  ser conocido. Ejemplos: El arriendo o dividendo, la mensualidad del colegio, cuota de un
  préstamo. Deben ser tu prioridad número 1.

  - **Gasto Variable:** Son gastos cotidianos y necesarios, pero cuyo valor o frecuencia lo
  decides tú. Ejemplos: Compras en el supermercado, salir a comer, cuentas de servicios (luz/agua
  fluctúan según tu consumo), ropa.

  - **Gasto Imprevisto:** Son urgencias que rompen el presupuesto normal. Ejemplos: Una enfermedad,
  una reparación mecánica del auto, una multa de tránsito.'
definiciones_clave: '- **Clasificación de tipos de gasto (fijo, variable, imprevisto)**: Elemento
  central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a clasificación de tipos de gasto (fijo, variable, imprevisto).'
ejemplo_guiado:
  enunciado: 'Un estudiante tiene estos gastos mensuales: 50.000 pesos de arriendo compartido,
    30.000 pesos variables en comida y salidas, y una reparación imprevista del computador
    de 40.000 pesos. Clasifica cada gasto.'
  pasos:
  - 'Identifico el arriendo de 50.000: se repite todos los meses con el mismo monto, por lo
    tanto es un gasto fijo.'
  - 'Identifico los 30.000 en comida y salidas: el monto cambia según las decisiones del mes,
    por lo tanto es un gasto variable.'
  - 'Identifico la reparación de 40.000: es una urgencia no planificada, por lo tanto es un
    gasto imprevisto.'
