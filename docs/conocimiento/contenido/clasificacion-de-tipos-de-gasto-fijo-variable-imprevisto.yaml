procedimiento:
- 'Paso 1: Analiza si el gasto se repite obligatoriamente cada mes. Si sí, es Fijo.'
- 'Paso 2: Si el gasto depende de tu estilo de vida o consumo mes a mes, es Variable.'
- 'Paso 3: Si es una emergencia sorpresiva que no planificaste, es Imprevisto.'
errores_correccion: Evita confundir los datos de entrada al operar con clasificación de tipos
  de gasto (fijo, variable, imprevisto).
ejemplos:
- titulo: Clasificando la boleta de la luz
  enunciado: ¿Qué tipo de gasto es la cuenta de electricidad de la casa?
  solucion_pasos:
  - Aunque llega todos los meses, el monto cambia dependiendo de si dejas las luces prendidas
    o apagas la estufa.
  - Por lo tanto, es un gasto Variable.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de gasto es la cuota mensual fija de un préstamo?
  alternativas:
  - Gasto fijo
  - Gasto variable
  - Gasto imprevisto
  respuesta: Gasto fijo
  solucion_pasos:
  - Se repite cada mes con el mismo monto conocido.
- titulo: Ejemplo 3
  enunciado: ¿Qué tipo de gasto es una multa de tránsito inesperada?
  alternativas:
  - Gasto imprevisto
  - Gasto fijo
  - Gasto variable
  respuesta: Gasto imprevisto
  solucion_pasos:
  - Es una urgencia que no estaba planificada.
- titulo: ¿Los gastos fijos deben ser la prioridad número uno al planificar un presupuesto?
  respuesta: Sí
  solucion_pasos:
  - Porque no se pueden evitar a corto plazo.
errores_frecuentes:
- Creer que la cuenta del supermercado es un Gasto Fijo porque 'hay que comer' (la comida
  es necesaria, pero el gasto es variable porque puedes elegir comer arroz o caviar).
- Confundir un Gasto Variable (ir al cine) con un Imprevisto.
- Creer que la cuenta del supermercado es un gasto fijo porque la comida es necesaria, cuando
  en realidad su monto varía cada mes.
- Confundir un gasto variable planificado, como salir al cine, con un gasto imprevisto.
- Clasificar un gasto como fijo solo porque se repite, sin verificar si su monto también es
  constante.
afirmaciones_verdaderas:
- La propiedad de clasificación de tipos de gasto (fijo, variable, imprevisto) preserva la
  consistencia lógica.
- Un mismo tipo de servicio, como la electricidad, puede clasificarse como gasto variable
  si su monto cambia según el consumo mensual.
al_terminar_debes_poder: Resolver problemas aplicados que involucren clasificación de tipos
  de gasto (fijo, variable, imprevisto).
