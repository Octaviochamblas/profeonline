semantic_id: MAT.NUM.FINANZAS.CLASIFICACION_GASTOS
resumen_inicial: 'Los gastos personales se estructuran en fijos (obligatorios y recurrentes), variables (fluctuantes según hábitos de consumo) e imprevistos (emergencias no programadas): $\text{Gasto Total} = G_{\text{fijos}} + G_{\text{variables}} + G_{\text{imprevistos}}$.'
explicacion_simple: |
  Para organizar tus finanzas de forma clara, los desembolsos se clasifican en tres categorías principales:
  - **Gastos Fijos**: Compromisos obligatorios que debes pagar mes a mes por montos constantes o predecibles (arriendo, dividendo, colegiatura, seguros).
  - **Gastos Variables**: Desembolsos que cambian según tu nivel de actividad y decisiones (alimentación, cuentas de consumo, salidas y ocio).
  - **Gastos Imprevistos**: Urgencias no planificadas (reparaciones mecánicas, emergencias de salud) que deben cubrirse con un fondo de reserva.

  ![Clasificación de tipos de gasto](/static/img/nodos/clasificacion-de-tipos-de-gasto-fijo-variable-imprevisto-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el modelamiento presupuestario personal, el flujo de egresos totales del período $G_T$ se define como la suma disjunta de sus tres componentes funcionales:
  $$G_T = \sum G_{\text{fijo}} + \sum G_{\text{variable}} + \sum G_{\text{imprevisto}}$$

  ### Propiedades y Dinámica de Ajuste
  1. **Gastos Fijos ($G_f$)**: Varianza casi nula en el corto plazo; exigibilidad contractual legal. Su reducción requiere renegociaciones de largo plazo.
  2. **Gastos Variables ($G_v$)**: Sensibles a decisiones de consumo diario; constituyen la variable de ajuste inmediata ante caídas imprevistas de ingresos.
  3. **Gastos Imprevistos ($G_i$)**: Eventos estocásticos de impacto negativo que demandan cobertura de liquidez mediante un fondo de emergencia (equivalente a 3 a 6 meses de gastos fijos).

  ### Síntesis didáctica
  - Ecuación de consolidación: $G_T = G_f + G_v + G_i$.
  - Principio de flexibilidad: Ante shocks negativos de ingreso, el ajuste recae sobre los gastos variables discrecionales.
definiciones_clave: |
  - **Gasto Fijo**: Obligación periódica recurrente de monto constante y exigibilidad obligatoria.
  - **Gasto Variable**: Desembolso fluctuante dependiente del consumo o hábitos individuales.
  - **Gasto Imprevisto**: Egreso fortuito originado por contingencias y emergencias no programadas.
propiedades_relaciones: |
  - **Rigidez presupuestaria**: A mayor proporción de gastos fijos respecto al ingreso total, menor es el margen de maniobra ante crisis financieras.
  - **Fondo de emergencia**: Reserva líquida destinada exclusivamente a mitigar el impacto de gastos imprevistos sin recurrir a deuda de alto costo.
ejemplo_guiado:
  enunciado: 'Una persona registra los siguientes gastos en el mes: Arriendo ($\$350.000$), Seguro de salud ($\$40.000$), Alimentación y ocio ($\$210.000$), Cuentas de luz y agua ($\$60.000$) y Reparación urgente de cañería ($\$30.000$). Clasifica y calcula el gasto total mensual.'
  imagen: '/static/img/nodos/clasificacion-de-tipos-de-gasto-fijo-variable-imprevisto-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos Gastos Fijos: Arriendo + Seguro $= 350.000 + 40.000 = $\$390.00$0$.'
    - 'Paso 2: Identificamos Gastos Variables: Alimentación/ocio + Servicios básicos $= 210.000 + 60.000 = $\$270.00$0$.'
    - 'Paso 3: Identificamos Gastos Imprevistos: Reparación urgente $= $\$30.00$0$.'
    - 'Paso 4: Sumamos el gasto total: $G_T = 390.000 + 270.000 + 30.000 = 690.000$. El gasto total es de **$\$690.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué categoría corresponde el pago mensual obligatorio del arriendo o dividendo hipotecario?'
    choices:
      - {text: 'Gasto Fijo', is_correct: true}
      - {text: 'Gasto Variable', is_correct: false}
      - {text: 'Gasto Imprevisto', is_correct: false}
      - {text: 'Ingreso Pasivo', is_correct: false}
    explanation: 'La alternativa correcta es ''Gasto Fijo''. Es un compromiso contractual periódico de exigibilidad obligatoria y monto predecible.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una familia registra $\$400.000$ en gastos fijos, $\$250.000$ en gastos variables y $\$50.000$ en imprevistos, ¿cuál es su gasto total?'
    choices:
      - {text: '$\$700.000$, sumando $400.000 + 250.000 + 50.000 = 700.000$', is_correct: true}
      - {text: '$\$650.000$, omitiendo los imprevistos', is_correct: false}
      - {text: '$\$150.000$, restando los montos', is_correct: false}
      - {text: '$\$600.000$, duplicando los fijos', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$700.000$, sumando $400.000 + 250.000 + 50.000 = 700.000$''. El gasto total consolida las tres categorías.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Listar todos los egresos del período analizado con sus respectivos montos monetarios.'
  - 'Paso 2: Categorizar cada desembolso en Fijo, Variable o Imprevisto según su obligatoriedad y recurrencia.'
  - 'Paso 3: Totalizar los subtotales por cada una de las tres categorías.'
  - 'Paso 4: Sumar los subtotales para determinar el gasto total global: $G_T = G_f + G_v + G_i$.'
errores_correccion: |
  - **Error 1:** Clasificar el arriendo o dividendo como gasto variable al creer que el término se refiere a transferencias bancarias. **Cómo corregirlo:** La fijeza es **contractual y periódica**: el arriendo es un **gasto fijo mensual ineludible**.
  - **Error 2:** Omitir la categoría de imprevistos asumiendo que solo se presupuestan gastos ciertos. **Cómo corregirlo:** Un presupuesto robusto **contempla siempre una reserva para contingencias imprevistas**.
ejemplos:
  - titulo: 'Consolidación de gastos del hogar'
    enunciado: 'Si los gastos fijos son $\$500.000$, los variables $\$300.000$ y no hubo imprevistos ($G_i = 0$), ¿cuál es el gasto total?'
    alternativas:
      - '$\$800.000$'
      - '$\$500.000$'
      - '$\$200.000$'
    respuesta: '$\$800.000$'
    solucion_pasos:
      - '1. $G_T = 500.000 + 300.000 + 0 = $\$800.00$0$.'
  - titulo: 'Ajuste ante baja de ingresos'
    enunciado: 'Ante una disminución imprevista en el ingreso mensual, ¿sobre qué categoría de gasto debe realizarse el recorte inmediato?'
    alternativas:
      - 'Sobre los gastos variables discrecionales (ocio, compras prescindibles)'
      - 'Sobre el pago del arriendo o dividendo contractual'
      - 'Sobre el seguro de salud obligatorio'
    respuesta: 'Sobre los gastos variables discrecionales (ocio, compras prescindibles)'
    solucion_pasos:
      - '1. Los gastos variables son los únicos ajustables de forma inmediata y voluntaria.'
  - titulo: 'Identificación de gasto imprevisto'
    enunciado: '¿El pago de la cuenta de electricidad bimestral corresponde a un gasto imprevisto?'
    alternativas:
      - 'No, es un gasto variable recurrente y predecible'
      - 'Sí, porque el monto exacto en pesos cambia cada mes'
      - 'Sí, porque es un cobro de emergencia'
    respuesta: 'No, es un gasto variable recurrente y predecible'
    solucion_pasos:
      - '1. Las cuentas de servicios básicos son gastos variables conocidos, no emergencias fortuitas.'
  - titulo: 'Porcentaje de gastos fijos'
    enunciado: 'Si los gastos fijos son $\$400.000$ de un gasto total de $\$800.000$, ¿qué porcentaje representan?'
    alternativas:
      - '$50\%$'
      - '$25\%$'
      - '$40\%$'
    respuesta: '$50\%$'
    solucion_pasos:
      - '1. Proporción: $400.000 / 800.000 = 0,50 \implies 50\%$.'
errores_frecuentes:
  - 'Los gastos imprevistos se consideran inexistentes en la planificación financiera por no tener fecha fija de ocurrencia.'
  - 'El pago del arriendo o dividendo se clasifica como gasto variable debido a que su desembolso se realiza mes a mes.'
  - 'Los gastos fijos pueden suprimirse de inmediato sin generar penalizaciones contractuales o legales.'
  - 'La suma de egresos totales se calcula multiplicando los gastos fijos por los gastos variables.'
  - 'El fondo de emergencia debe utilizarse para financiar gastos variables discrecionales de ocio.'
afirmaciones_verdaderas:
  - 'El gasto total mensual es la suma disjunta de los gastos fijos, variables e imprevistos ($G_T = G_f + G_v + G_i$).'
  - 'Ante disminuciones en el ingreso disponible, los gastos variables discrecionales constituyen la primera línea de ajuste presupuestario.'
