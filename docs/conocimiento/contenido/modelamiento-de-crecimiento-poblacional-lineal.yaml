semantic_id: MAT.ALG.MODELAMIENTO_AFIN.CRECIMIENTO_POBLACIONAL_LINEAL
resumen_inicial: 'Modelamiento de crecimiento poblacional lineal: conceptos, representación
  y propiedades en Modelamiento lineal y afín.'
explicacion_simple: Cuando una población gana o pierde exactamente el mismo número
  de individuos cada año, su comportamiento es tan predecible como una recta.
explicacion_formal: '### Definición formal


  Si una población $P(t)$ en el instante $t$ satisface $P(t) = mt + P_0$, con $P_0=P(0)$
  la población inicial y $m$ la variación neta constante por período (positiva si
  crece, negativa si decrece), el modelo es de crecimiento poblacional lineal (a diferencia
  del crecimiento exponencial, donde la tasa depende del tamaño actual).


  ### Desarrollo didáctico


  Este modelo asume que la cantidad de nuevos individuos (o de individuos perdidos)
  por período es siempre la misma, sin importar el tamaño actual de la población.


  Si una ciudad tenía 50.000 habitantes en 2020 y gana 1.200 habitantes por año: $P(t)
  = 1200t + 50000$, donde $t$ son los años transcurridos desde 2020.'
definiciones_clave: '- **Modelamiento de crecimiento poblacional lineal**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a modelamiento de crecimiento poblacional
  lineal.'
