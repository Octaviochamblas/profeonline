semantic_id: MAT.ALG.MODELAMIENTO_AFIN.CRECIMIENTO_POBLACIONAL_LINEAL
resumen_inicial: El modelamiento del crecimiento poblacional lineal representa la evolución de una población que incrementa o disminuye en una cantidad fija por unidad de tiempo.
explicacion_simple: |
  En un **crecimiento poblacional lineal**:

  - La población no se multiplica por un porcentaje, sino que se le **suma o resta un número fijo de habitantes cada año/mes**.
  - Si una ciudad tiene $50.000$ habitantes y crece $1.500$ personas por año, la función es:
    $$P(t) = 1.500t + 50.000$$
  - $50.000$ es la población inicial ($t = 0$).
  - $1.500$ es el número fijo de nuevos pobladores por año.
explicacion_formal: |
  Sea $P(t)$ la población total en el tiempo $t \ge 0$. El modelo de **crecimiento poblacional lineal** asume una tasa de variación absoluta constante $k = \frac{dP}{dt}$:

  $$P(t) = k \cdot t + P_0$$

  **Parámetros del modelo:**
  - $P_0 = P(0)$: Población inicial en el instante de referencia $t = 0$.
  - $k$: Tasa de variación poblacional anual, mensual o diaria ($k > 0$ para crecimiento, $k < 0$ para decrecimiento).
definiciones_clave: |
  - **Modelo poblacional lineal**: Función afín $P(t) = kt + P_0$ que describe una dinámica demográfica de adición o sustracción constante de individuos por unidad de tiempo.
propiedades_relaciones: |
  - **Diferencia con modelo exponencial**: En el modelo lineal la población crece por adición fija $\Delta P = k \cdot \Delta t$, a diferencia del modelo exponencial donde crece por factor multiplicativo porcentual.
ejemplo_guiado:
  enunciado: "Una colonia de aves tiene inicialmente $120$ individuos y su población aumenta a razón constante de $15$ aves por año. Escribe la función $P(t)$ y calcula cuántas aves habrá al cabo de $8$ años."
  pasos:
    - 'Paso 1: Identificar la población inicial: $P_0 = 120$.'
    - 'Paso 2: Identificar la tasa de crecimiento constante: $k = 15$ aves/año.'
    - 'Paso 3: Redactar la función poblacional: $P(t) = 15t + 120$.'
    - 'Paso 4: Evaluar para $t = 8$: $P(8) = 15(8) + 120 = 120 + 120 = 240$ aves.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Si una población inicia con 120 aves y crece a razón de 15 aves por año, ¿cuántas aves habrá en 8 años?"
    choices:
      - {text: "240 aves", is_correct: true}
      - {text: "135 aves", is_correct: false}
      - {text: "300 aves", is_correct: false}
      - {text: "200 aves", is_correct: false}
    explanation: "La alternativa correcta es '240 aves'. $P(8) = 15(8) + 120 = 120 + 120 = 240$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué representa el parámetro $k$ en el modelo de población lineal $P(t) = kt + P_0$?"
    choices:
      - {text: "El número constante de personas en que aumenta o disminuye la población cada año.", is_correct: true}
      - {text: "La población inicial registrada al comenzar el estudio.", is_correct: false}
      - {text: "El porcentaje fijo de nacimientos.", is_correct: false}
      - {text: "El número total de años transcurridos.", is_correct: false}
    explanation: "La alternativa correcta es 'El número constante de personas en que aumenta o disminuye la población cada año.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer la población inicial $P_0$ asociada al instante $t = 0$.'
  - 'Paso 2: Extraer la variación constante de personas por periodo $k$.'
  - 'Paso 3: Construir la fórmula de la función afín $P(t) = kt + P_0$.'
  - 'Paso 4: Evaluar la función en el tiempo $t$ solicitado para realizar la proyección.'
errores_correccion: |
  - **Error común:** Aplicar una fórmula con porcentaje multiplicativo (interés compuesto o exponencial) cuando el enunciado indica explícitamente un aumento en una **CANTIDAD FIJA DE PERSONAS**.
  - **Cómo corregirlo:** Si se suma un número fijo de personas, el modelo es **LINEAL/AFÍN** ($P(t) = kt + P_0$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento afín.
    alternativas:
      - '$1$'
