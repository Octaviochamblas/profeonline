  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En un modelo de crecimiento poblacional lineal $P(t) = kt + P_0$, la población se triplica a intervalos regulares de tiempo.'
  - 'La población inicial $P_0$ en un problema demográfico se calcula dividiendo la tasa $k$ entre el tiempo $t$.'
  - 'Si la tasa $k$ de un modelo demográfico lineal es negativa, la población tiende a crecer infinitamente hacia el futuro.'
  - 'Un modelo poblacional lineal requiere calcular logaritmos naturales para determinar el total de habitantes.'
  - 'La variable $t$ en la función de población $P(t) = 15t + 120$ representa la masa en kilogramos de los habitantes.'
afirmaciones_verdaderas:
  - 'El crecimiento poblacional lineal $P(t) = kt + P_0$ asume una tasa de cambio demográfica constante $k = \frac{\Delta P}{\Delta t}$ por unidad de tiempo.'
  - 'En este modelo, $P_0$ fija la población inicial al instante $t = 0$ y el signo de $k$ indica crecimiento ($k > 0$) o decrecimiento demográfico ($k < 0$).'
al_terminar_debes_poder: |
  QUÉ: Formular y resolver modelos afines de crecimiento o decrecimiento poblacional lineal.
  CÓMO: Identificar $P_0$ y $k$, escribir la función $P(t) = kt + P_0$ y evaluar proyectando a tiempos futuros.
