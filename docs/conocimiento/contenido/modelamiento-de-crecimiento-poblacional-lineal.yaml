procedimiento:
- 'Paso 1: Identifica la población inicial $P_0$ del contexto.'
- 'Paso 2: Identifica la variación constante por período (positiva si crece, negativa
  si decrece).'
- 'Paso 3: Construye el modelo $P(t) = mt + P_0$.'
- 'Paso 4: Evalúa el modelo en el tiempo solicitado para obtener la población proyectada.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar modelamiento de crecimiento poblacional lineal.
ejemplos:
- titulo: Modelamiento de crecimiento poblacional
  enunciado: Un pueblo tiene 3000 habitantes y crece a razón de 80 habitantes por
    año. Modela su población $P$ después de $t$ años.
  solucion_pasos:
  - Población inicial - $P_0=3000$.
  - Tasa de crecimiento - $m=80$.
  - $P(t) = 80t + 3000$.
- titulo: Modelamiento de decrecimiento poblacional
  enunciado: Un pueblo tiene 5000 habitantes y pierde 30 habitantes por año debido
    a la migración. Modela su población $P$ después de $t$ años.
  solucion_pasos:
  - Población inicial - $P_0=5000$.
  - Tasa de decrecimiento - $m=-30$.
  - $P(t) = -30t + 5000$.
- titulo: ¿El crecimiento poblacional lineal asume una variación constante por período?
  enunciado: ¿El crecimiento poblacional lineal asume una variación constante por
    período?
  respuesta: Sí
  solucion_pasos:
  - Esa es la hipótesis fundamental que distingue el modelo lineal de otros modelos
    de crecimiento.
- titulo: ¿Una población que pierde habitantes puede modelarse con este tipo de función?
  enunciado: ¿Una población que pierde habitantes puede modelarse con este tipo de
    función?
  respuesta: Sí
  solucion_pasos:
  - Se modela con pendiente negativa, representando la disminución constante.
errores_frecuentes:
- Confundir el crecimiento lineal (variación constante en cantidad) con el crecimiento
  exponencial (variación proporcional al tamaño actual).
- Olvidar el signo negativo al modelar una población decreciente.
- Confundir la población inicial con la tasa de crecimiento.
- Asumir que toda población crece indefinidamente sin considerar límites del contexto
  real.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando modelamiento
  de crecimiento poblacional lineal.
