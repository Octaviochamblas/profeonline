semantic_id: MAT.ALG.MODELAMIENTO_AFIN.CRECIMIENTO_POBLACIONAL_LINEAL
resumen_inicial: 'El modelamiento de crecimiento poblacional lineal describe la evolución de una población sumando o restando una cantidad neta constante de individuos por período: $P(t) = P_0 + rt$.'
explicacion_simple: '![El modelamiento de crecimiento poblacional lineal describe la evolución de una población sumando o restando una cantidad neta constante de individuos por período: $P(t) = P_0 + rt$](/static/img/nodos/modelamiento-de-crecimiento-poblacional-lineal-intro.svg)



  Cuando una ciudad o colonia de animales crece o decrece sumando **la misma cantidad de habitantes cada año**:

  - Se tiene una **población inicial ($P_0$)** en el año cero ($t = 0$).

  - Cada año que pasa, se agregan $r$ habitantes: $P(t) = P_0 + rt$.

  - Si la población pierde habitantes por emigración, $r$ es negativo ($P(t) = P_0 - |r|t$).'
explicacion_formal: 'El **modelo lineal de dinámica poblacional** asume una tasa neta de cambio demográfico constante $r = \frac{dP}{dt}$:

  $$P(t) = rt + P_0, \quad t \ge 0$$


  **Parámetros demográficos:**

  - **Población base $P_0 = P(0)$**: Censo o conteo en el instante de referencia inicial.

  - **Tasa neta anual $r = B - D + I - E$**: Balance constante entre nacimientos ($B$), defunciones ($D$), inmigración ($I$) y emigración ($E$).

  - **Validez temporal**: Modelo aplicable a corto plazo donde no intervienen limitaciones de capacidad de carga ni efectos geométricos.'
definiciones_clave: '- **Crecimiento lineal poblacional**: Incremento en progresión aritmética con cantidad fija de individuos por año.

  - **Población inicial $P_0$**: Valor de la población en $t = 0$.'
propiedades_relaciones: '- **Tasa de cambio $r$**: Si $r > 0$ es crecimiento; si $r < 0$ es despoblamiento o extinción.

  - **Tiempo de duplicación variable**: A diferencia del modelo exponencial, en el modelo lineal el tiempo para duplicar la población no es constante.'
ejemplo_guiado:
  enunciado: '![Ejemplo El modelamiento de crecimiento poblacional lineal describe la evolución de una población sumando o restando una cantidad neta constante de individuos por período: $P(t) = P_0 + rt$](/static/img/nodos/modelamiento-de-crecimiento-poblacional-lineal-ejemplos.svg)



    Una comuna rural tiene $8.500\text{ habitantes}$ en el año 2020 y gana un promedio constante de $320\text{ personas al año}$. Escribe la función $P(t)$ donde $t$ es el número de años desde 2020 y estima la población en 2035.'
  pasos:
  - 'Paso 1: Definir la variable temporal: $t = \text{años transcurridos desde 2020}$ ($t = 0$ en 2020).'
  - 'Paso 2: Identificar los parámetros: $P_0 = 8.500$ y $r = 320\text{ hab/año}$.'
  - 'Paso 3: Formular el modelo: $P(t) = 320t + 8.500$.'
  - 'Paso 4: Calcular $t$ para el año 2035: $t = 2035 - 2020 = 15\text{ años}$.'
  - 'Paso 5: Evaluar: $P(15) = 320(15) + 8.500 = 4.800 + 8.500 = 13.300\text{ habitantes}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Un pueblo tiene 4.000 habitantes y pierde 75 habitantes por año. ¿Cuál es la función de su población P(t)?
  choices:
  - text: P(t) = -75t + 4000
    is_correct: true
  - text: P(t) = 75t + 4000
    is_correct: false
  - text: P(t) = 4000(0.75)^t
    is_correct: false
  - text: P(t) = -75t
    is_correct: false
  explanation: La alternativa correcta es 'P(t) = -75t + 4000'. Al perder habitantes la tasa es $r = -75$, con base $P_0 = 4000$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $P(t) = 500t + 10000$, ¿cuántos años deben pasar para que la población alcance los 14.000 habitantes?
  choices:
  - text: 8 anos
    is_correct: true
  - text: 5 anos
    is_correct: false
  - text: 10 anos
    is_correct: false
  - text: 28 anos
    is_correct: false
  explanation: La alternativa correcta es '8 anos'. $500t + 10000 = 14000 \implies 500t = 4000 \implies t = 8$ años.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Definir el año base de referencia como $t = 0$ y registrar la población inicial $P_0$.'
- 'Paso 2: Identificar el cambio neto anual de individuos $r$ (positivo o negativo).'
- 'Paso 3: Construir la función afín $P(t) = rt + P_0$.'
- 'Paso 4: Evaluar para el período solicitado $t = \text{año objetivo} - \text{año base}$.'
errores_correccion: '- **Error común:** Usar el año cronológico completo (ej: $t = 2035$) dentro de la fórmula en lugar de los años transcurridos ($t = 15$).

  - **Cómo corregirlo:** Define siempre $t$ como el número de años transcurridos **desde el año base** ($t = \text{año} - \text{año}_0$).'
ejemplos:
- titulo: 'Ejemplo 1: Proyección demográfica'
  enunciado: Una ciudad con $50.000\text{ hab}$ en 2022 crece a razón de $1.200\text{ hab/año}$. ¿Cuál será su población en 2030?
  alternativas:
  - 59.600 habitantes
  - 62.000 habitantes
  - 58.400 habitantes
  - 51.200 habitantes
  respuesta: 59.600 habitantes
  solucion_pasos:
  - 'Paso 1: $t = 2030 - 2022 = 8\text{ años}$.'
  - 'Paso 2: $P(8) = 1.200(8) + 50.000 = 9.600 + 50.000 = 59.600$ hab.'
- titulo: 'Ejemplo 2: Estimación de año meta'
  enunciado: Con $P(t) = 250t + 6.000$ (desde 2020), ¿en qué año la población llegará a $8.500\text{ habitantes}$?
  alternativas:
  - Ano 2030
  - Ano 2028
  - Ano 2035
  - Ano 2025
  respuesta: Ano 2030
  solucion_pasos:
  - 'Paso 1: $250t + 6000 = 8500 \implies 250t = 2500 \implies t = 10\text{ años}$.'
  - 'Paso 2: $\text{Año} = 2020 + 10 = 2030$.'
- titulo: 'Ejemplo 3: Extinción o despoblamiento'
  enunciado: Una colonia de 600 aves pierde 40 aves por año. ¿En cuántos años no quedará ninguna si se mantiene la tasa?
  alternativas:
  - 15 anos
  - 12 anos
  - 20 anos
  - 10 anos
  respuesta: 15 anos
  solucion_pasos:
  - 'Paso 1: $600 - 40t = 0 \implies 40t = 600 \implies t = 15$ años.'
- titulo: 'Ejemplo 4: Tasa desde dos censos'
  enunciado: En 2010 la población era $20.000$ y en 2020 fue $26.000$. Suponiendo crecimiento lineal, ¿cuál fue la tasa anual?
  alternativas:
  - 600 hab/ano
  - 6000 hab/ano
  - 300 hab/ano
  - 2600 hab/ano
  respuesta: 600 hab/ano
  solucion_pasos:
  - 'Paso 1: $r = \frac{26000 - 20000}{2020 - 2010} = \frac{6000}{10} = 600\text{ hab/año}$.'
errores_frecuentes:
- 'Sustituir el año calendario completo (ej: t = 2030) en vez del tiempo transcurrido.'
- Confundir crecimiento lineal con crecimiento porcentual.
- No verificar si la población llega a cero en modelos decrecientes.
afirmaciones_verdaderas:
- El modelo poblacional lineal asume que la población varía sumando o restando un número fijo de individuos por período.
- La tasa anual r corresponde a la pendiente de la función afín P(t) = rt + P0.
al_terminar_debes_poder: '**QUÉ:** Modelar y proyectar la dinámica poblacional mediante funciones afines de crecimiento lineal.


  **CÓMO:** Ajustando los parámetros de población base P0 y tasa neta anual r en la fórmula P(t) = rt + P0.


