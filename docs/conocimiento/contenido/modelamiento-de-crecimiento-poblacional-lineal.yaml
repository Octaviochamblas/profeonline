semantic_id: MAT.ALG.MODELAMIENTO_AFIN.CRECIMIENTO_POBLACIONAL_LINEAL
resumen_inicial: El crecimiento poblacional lineal asume que una población aumenta
  en un número fijo de individuos por cada período de tiempo.
explicacion_simple: 'En algunos estudios demográficos simplificados, se asume que
  una población crece agregando la misma cantidad de habitantes cada año.

  - Si una ciudad tiene $50.000$ habitantes hoy y suma $2.500$ personas por año:

  - La población inicial es $P_0 = 50.000$.

  - La tasa de crecimiento anual es $m = 2.500$.

  - La función en el tiempo $t$ (en años) es $P(t) = 2.500t + 50.000$.'
explicacion_formal: 'El **modelo de crecimiento poblacional lineal** para el tiempo
  $t \ge 0$ se formula como:


  $$P(t) = m \cdot t + P_0$$


  **Desglose de la fórmula:**

  - $P_0 = P(0)$: Población inicial censada en el año base $t = 0$.

  - $m$: Tasa neta constante de crecimiento anual (nacimientos e inmigración menos
  defunciones y emigración).'
definiciones_clave: '- **Modelo poblacional lineal**: Ecuación afín $P(t) = m t +
  P_0$ donde la población varía a ritmo constante en el tiempo.'
propiedades_relaciones: '- **Individuos por año**: La pendiente $m$ representa el
  número neto de nuevos habitantes incorporados por unidad de tiempo.'
ejemplo_guiado:
  enunciado: Una colonia de bacterias inicia con $400$ especímenes y crece a razón
    constante de $80$ bacterias por hora. Escribe $P(t)$ y calcula la población tras
    $6\text{ horas}$.
  pasos:
  - 'Paso 1: Identificar la población inicial: $P_0 = 400$.Paso 2: Identificar la
    tasa de crecimiento por hora: $m = 80$.Paso 3: Formar la función afín: $P(t) =
    80t + 400$.Paso 4: Evaluar para $t = 6$: $P(6) = 80(6) + 400 = 480 + 400 = 880$.Paso
    5: Concluir que tras $6\text{ horas}$ habrá $880$ bacterias.'
checkpoints:
- placement: after_explicacion_formal
  question: En el modelo de crecimiento $P(t) = 80t + 400$, ¿cuál es la población
    de bacterias tras 6 horas?
  choices:
  - text: $880$ bacterias
    is_correct: true
  - text: $480$ bacterias
    is_correct: false
  - text: $2.880$ bacterias
    is_correct: false
  - text: $960$ bacterias
    is_correct: false
  explanation: La alternativa correcta es '$880$ bacterias'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa el valor $P_0 = 400$ en la función $P(t) = 80t + 400$?
  choices:
  - text: La cantidad inicial de bacterias al comenzar el experimento ($t = 0$).
    is_correct: true
  - text: El límite máximo de bacterias que caben en el cultivo.
    is_correct: false
  - text: El número de bacterias que mueren por hora.
    is_correct: false
  - text: El tiempo total del experimento.
    is_correct: false
  explanation: La alternativa correcta es 'La cantidad inicial de bacterias al comenzar
    el experimento ($t = 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Registrar el número inicial de individuos $P_0$ en el tiempo cero.'
- 'Paso 2: Identificar el incremento fijo de individuos por unidad de tiempo $m$.'
- 'Paso 3: Construir $P(t) = m t + P_0$.'
- 'Paso 4: Reemplazar el tiempo indicado para proyectar la población.'
errores_correccion: '- **Error común:** Confundir el crecimiento lineal (suma fija
  de personas por año) con el crecimiento exponencial (multiplicación por un porcentaje
  fijo).

  - **Cómo corregirlo:** Si se suman individuos fijos ($+80$), el modelo es LINEAL/AFÍN
  ($m t + P_0$). Si se multiplica por una tasa porcentual, es exponencial.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
