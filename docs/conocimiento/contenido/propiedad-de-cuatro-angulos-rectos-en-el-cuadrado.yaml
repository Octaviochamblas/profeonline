semantic_id: MAT.GEO.PARALELOGRAMOS.CUADRADO_ANGULOS_RECTOS
resumen_inicial: En el cuadrado, los cuatro ángulos interiores son rectos (90°) y sus diagonales son congruentes y perpendiculares.
explicacion_simple: 'Además de tener cuatro lados iguales, el cuadrado tiene sus **cuatro esquinas perfectamente cuadradas**, es decir, de **$90^\circ$**. Esto lo convierte en un cuadrilátero equiángulo.


  Esta doble perfección (lados iguales y esquinas rectas) produce propiedades únicas en sus diagonales: 1) Miden exactamente lo mismo ($d_1 = d_2$), 2) Se cruzan en un ángulo recto perfecto ($90^\circ$, son perpendiculares), y 3) Cortan cada esquina de $90^\circ$ exactamente por la mitad, formando dos ángulos de **$45^\circ$**.


  ![Cuatro ángulos rectos en el cuadrado](/static/img/nodos/propiedad-de-cuatro-angulos-rectos-en-el-cuadrado-intro.svg)

  '
explicacion_formal: '### Equiangularidad del cuadrado

  En el cuadrado $\mathcal{ABCD}$, la medida de cada ángulo interior es constante e igual a un ángulo recto:

  $$\angle A = \angle B = \angle C = \angle D = 90^\circ = \frac{\pi}{2}\text{ rad}$$


  ### Propiedades geométricas de las diagonales

  Las diagonales $\overline{AC}$ y $\overline{BD}$ del cuadrado reúnen de manera simultánea las propiedades del rectángulo y del rombo:

  1. **Congruencia métrica (heredada del rectángulo):**

  $$\overline{AC} \cong \overline{BD} \iff d_1 = d_2 = s\sqrt{2}$$

  2. **Perpendicularidad estricta (heredada del rombo):**

  $$\overline{AC} \perp \overline{BD} \iff \angle(\overline{AC}, \overline{BD}) = 90^\circ$$

  3. **Bisectrices de los vértices:**

  Cada diagonal divide al ángulo recto del vértice en dos ángulos congruentes de $\frac{90^\circ}{2} = 45^\circ$.

  4. **Triángulos interiores:**

  Las diagonales particionan al cuadrado en 4 triángulos rectángulos isósceles congruentes de ángulos $45^\circ - 45^\circ - 90^\circ$.


  > **Complemento didáctico:** El cuadrado es el ÚNICO paralelogramo cuyas diagonales son a la vez IGUALES (como en el rectángulo) y PERPENDICULARES (como en el rombo). Si un ejercicio te dice que un paralelogramo cumple ambas condiciones, es sin duda un cuadrado.

  '
definiciones_clave: '- **Ángulo recto**: Ángulo de amplitud constante igual a $90^\circ$.

  - **Diagonales perpendiculares**: Segmentos que se intersecan formando un ángulo de $90^\circ$.

  - **Triángulo 45°-45°-90°**: Triángulo rectángulo isósceles generado por la diagonal del cuadrado.

  '
propiedades_relaciones: '- **Intersección central**: El centro de las diagonales $M$ equidista de los cuatro vértices y de los cuatro lados.

  - **Inscripción y circunscripción**: El cuadrado admite circunferencia inscrita (radio $r = s/2$) y circunscrita (radio $R = s\sqrt{2}/2$).

  - **Doble eje de simetría**: Posee 4 ejes de simetría (dos mediatrices de lados y dos diagonales).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulos en el cuadrado](/static/img/nodos/propiedad-de-cuatro-angulos-rectos-en-el-cuadrado-ejemplos.svg)


    En un cuadrado $ABCD$ con centro en $M$ (intersección de las diagonales), calcula la medida del ángulo $\angle AMB$ y la medida del ángulo $\angle MAB$.'
  pasos:
  - 'Paso 1: Analizar el cruce de las diagonales en el centro $M$: Como las diagonales del cuadrado son perpendiculares ($\overline{AC} \perp \overline{BD}$), el ángulo central es $\angle AMB = 90^\circ$.'
  - 'Paso 2: Analizar el ángulo en el vértice $A$: El ángulo total del vértice es recto ($\angle DAB = 90^\circ$).'
  - 'Paso 3: Aplicar la propiedad de bisectriz de la diagonal: La diagonal divide al ángulo en dos partes congruentes: $\angle MAB = \frac{90^\circ}{2} = 45^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué ángulo se cruzan las diagonales de un cuadrado en su centro?
  choices:
  - text: En un ángulo recto de 90°.
    is_correct: true
  - text: En un ángulo agudo de 45°.
    is_correct: false
  - text: En un ángulo obtuso de 120°.
    is_correct: false
  - text: Depende de la longitud que tengan los lados.
    is_correct: false
  explanation: La alternativa correcta es 'En un ángulo recto de 90°.' Las diagonales del cuadrado son perpendiculares entre sí.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una diagonal de un cuadrado biseca una de sus esquinas, ¿qué ángulos se forman?
  choices:
  - text: Dos ángulos de 45°.
    is_correct: true
  - text: Un ángulo de 30° y uno de 60°.
    is_correct: false
  - text: Dos ángulos de 90°.
    is_correct: false
  - text: Dos ángulos de 60°.
    is_correct: false
  explanation: La alternativa correcta es 'Dos ángulos de 45°.' El ángulo del vértice es $90^\circ$, y su mitad exacta es $45^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Recordar que las cuatro esquinas de un cuadrado miden $90^\circ$.

  2. Establecer que el ángulo de cruce entre las dos diagonales es siempre $90^\circ$.

  3. Utilizar que la diagonal corta a los vértices en ángulos de $45^\circ$.

  4. Aplicar propiedades de triángulos rectángulos isósceles para resolver lados o segmentos interiores.

  '
errores_correccion: '- **Error común 1:** Creer que las diagonales de cualquier paralelogramo son perpendiculares. **Corrección:** Solo son perpendiculares en el rombo y en el cuadrado.

  - **Error común 2:** Confundir los $45^\circ$ del vértice con los $90^\circ$ del centro. **Corrección:** En el centro se cruzan a $90^\circ$; en los vértices se forman ángulos de $45^\circ$.

  '
ejemplos:
- tipo: A
  titulo: Ángulo central en el cuadrado
  enunciado: Si $M$ es el punto de intersección de las diagonales de un cuadrado $ABCD$, ¿cuál es la medida de $\angle BMC$?
  alternativas:
  - text: $90^\circ$.
    is_correct: true
  - text: $45^\circ$.
    is_correct: false
  - text: $180^\circ$.
    is_correct: false
  - text: $60^\circ$.
    is_correct: false
  explicacion: Las diagonales son perpendiculares, luego forman cuatro ángulos rectos de $90^\circ$ en el centro.
- tipo: B
  titulo: Ángulos rectos en el cuadrado
  enunciado: ¿Puede un cuadrado tener un ángulo interior de 89°?
  respuesta: 'No'
  explicacion: No. Por definición matemática, todos los ángulos de un cuadrado miden estrictamente $90^\circ$.
errores_frecuentes:
- '''Olvidar que las diagonales del cuadrado son perpendiculares entre sí.'''
- '''Asumir que las diagonales de un rectángulo cualquiera también forman ángulos de $90^\circ$.'''
- '''Creer que los triángulos interiores formados por las diagonales son equiláteros.'''
afirmaciones_verdaderas:
- '''Los cuatro ángulos interiores de un cuadrado miden exactamente $90^\circ$.'''
- '''Las diagonales de un cuadrado son congruentes y perpendiculares.'''
- '''Cada diagonal de un cuadrado biseca los ángulos de los vértices en dos ángulos de $45^\circ$.'''
al_terminar_debes_poder: '**QUÉ:** Utilizar las propiedades angulares y diagonales del cuadrado para determinar medidas de ángulos y resolver configuraciones geométricas.


  **CÓMO:** Aplicando $\alpha = 90^\circ$, $d_1 \perp d_2$ y la bisección angular a $45^\circ$.


  ![Síntesis de ángulos en el cuadrado](/static/img/nodos/propiedad-de-cuatro-angulos-rectos-en-el-cuadrado-resumen.svg)

  '
