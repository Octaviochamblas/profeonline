resumen_inicial: La extracción de factor común por grupo consiste en aislar el monomio
  común presente en cada subgrupo de términos para generar paréntesis de residuos
  idénticos.
explicacion_simple: 'Una vez agrupados los términos como $(ax + ay) + (bx + by)$,
  extraes el factor de cada paréntesis por separado: de $(ax + ay)$ sacas la $a$ obteniendo
  $a(x + y)$, y de $(bx + by)$ sacas la $b$ obteniendo $b(x + y)$.'
explicacion_formal: 'Dada la partición de términos $P = G_1 + G_2 = (ax + ay) + (bx
  + by)$, la **Extracción de Factor Común por Grupo** aplica el operador MCD a cada
  subgrupo individualmente:


  $$F_1 = \text{MCD}(G_1) = a \implies G_1 = a(x + y)$$

  $$F_2 = \text{MCD}(G_2) = b \implies G_2 = b(x + y)$$

  $$P = a(x + y) + b(x + y)$$


  **Desglose simbólico:**

  - $a(x + y)$: Primer grupo factorizado parcialmente.

  - $b(x + y)$: Segundo grupo factorizado parcialmente.

  - $(x + y)$: Paréntesis de residuo idéntico obtenido simultáneamente en ambas extracciones
  parciales.


  > **Complemento didáctico:** Es la etapa intermedia donde la expresión pasa de una
  suma de 4 monomios a una suma de 2 bloques algebraicos con un binomio común.'
definiciones_clave: '- **Factorización parcial**: Extracción de un factor común limitada
  a un subconjunto de términos del polinomio.

  - **Binomio de residuo idéntico**: Expresión entre paréntesis coincidente en todos
  los grupos.'
propiedades_relaciones: '- **Condición de coincidencia**: La extracción por grupo
  es exitosa únicamente si los paréntesis resultantes son exactamente idénticos en
  términos y signos.'
ejemplo_guiado:
  enunciado: Extraiga el factor común por grupo en la expresión agrupada $(2x^3 -
    4x^2) + (3x - 6)$.
  pasos:
  - 'Paso 1: Analizar el primer grupo $(2x^3 - 4x^2)$: el MCD es $2x^2$.'
  - 'Paso 2: Extraer $2x^2$: $2x^2(x - 2)$.'
  - 'Paso 3: Analizar el segundo grupo $(3x - 6)$: el MCD es $3$.'
  - 'Paso 4: Extraer $3$: $3(x - 2)$.'
  - 'Paso 5: Ensamblar la expresión intermedia: $2x^2(x - 2) + 3(x - 2)$.'
  - 'Conclusión: La extracción por grupo produce $2x^2(x - 2) + 3(x - 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el objetivo principal de la extracción del factor común por grupo?
  choices:
  - text: Generar paréntesis de residuos exactamente idénticos en cada grupo
    is_correct: true
  - text: Eliminar por completo las variables de la expresión
    is_correct: false
  - text: Sumar los coeficientes numéricos de todos los grupos
    is_correct: false
  - text: Transformar la expresión en una ecuación de primer grado
    is_correct: false
  explanation: La alternativa correcta es 'Generar paréntesis de residuos exactamente
    idénticos en cada grupo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo para $(2x^3 - 4x^2) + (3x - 6)$, ¿cuál es el paréntesis
    común generado en ambos grupos?
  choices:
  - text: $(x - 2)$
    is_correct: true
  - text: $(x + 2)$
    is_correct: false
  - text: $(2x^2 + 3)$
    is_correct: false
  - text: $(x - 4)$
    is_correct: false
  explanation: La alternativa correcta es '$(x - 2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer el factor común monomio del primer grupo agrupado.'
- 'Paso 2: Extraer el factor común monomio del segundo grupo agrupado.'
- 'Paso 3: Verificar que los binomios que quedan dentro de ambos paréntesis sean 100%
  idénticos.'
errores_correccion: '- **Error 1: Obtener paréntesis con signos opuestos y no ajustar
  el factor extraído.** **Cómo corregirlo:** Si se obtiene $(x - 2)$ y $(2 - x)$,
  se DEBE extraer un factor con signo negativo para homogenizar el paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Extraiga el factor común por grupo en $(a^3 + a^2) + (a + 1)$.
  alternativas:
  - $a^2(a + 1) + 1(a + 1)$
  - $a^2(a + 1) + (a + 1)$
  - Ambas representan la misma extracción parcial
  respuesta: Ambas representan la misma extracción parcial
  solucion_pasos:
  - 1. $a^2$ en el primer grupo y el factor implícito $1$ en el segundo.
- titulo: Ejemplo 2
  enunciado: En la agrupación $(5x^2 - 10x) - (3x - 6)$, ¿cuál es la extracción parcial
    de cada grupo?
  alternativas:
  - $5x(x - 2) - 3(x - 2)$
  - $5x(x - 2) + 3(x - 2)$
  - $5(x^2 - 2) - 3(x - 6)$
  respuesta: $5x(x - 2) - 3(x - 2)$
  solucion_pasos:
  - 1. $G_1 = 5x(x - 2)$, $G_2 = -3(x - 2)$.
- titulo: ¿Es $x^2(y + 3) + 4(y + 3)$ la extracción parcial válida de $(x^2y + 3x^2)
    + (4y + 12)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2$ y $4$ son los factores de grupo, dejando $(y + 3)$.
- titulo: ¿Se ha completado la factorización de un polinomio al extraer el factor
    común por grupo?
  respuesta: 'No'
  solucion_pasos:
  - No, la expresión aún es una suma de dos bloques; falta extraer el paréntesis común
    final.
errores_frecuentes:
- Declarar terminada la factorización tras la extracción parcial por grupo sin realizar
  la extracción final.
- Aceptar paréntesis con signos disímiles como si fueran el mismo factor común por
  grupo.
- Reemplazar por 0 el coeficiente en el grupo que no tiene un factor monomio evidente.
- Multiplicar los factores grupales extraídos en lugar de mantener la adición entre
  bloques.
- Declarar que los factores extraídos de cada grupo deben ser cuantitativamente idénticos.
afirmaciones_verdaderas:
- La extracción por grupo convierte una suma de monomios en una suma de bloques con
  un binomio idéntico.
- Si los paréntesis resultantes difieren en signos, se debe extraer un factor negativo
  para igualarlos.
al_terminar_debes_poder: Al terminar serás capaz de extraer los factores comunes monomiales
  de cada grupo para generar paréntesis de residuos coincidentes.
