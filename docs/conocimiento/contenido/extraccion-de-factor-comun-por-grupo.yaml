procedimiento:
- 'Paso 1: Toma el primer grupo y extrae su mayor factor común monomio.'
- 'Paso 2: Toma el segundo grupo y haz lo mismo.'
- 'Paso 3: Si los interiores de los paréntesis quedaron con los signos al revés (ej.
  $(x-y)$ y $(y-x)$), extrae un -1 en el segundo grupo para igualarlos.'
- 'Paso 4: Escribe la nueva expresión mostrando los monomios multiplicando a sus respectivos
  paréntesis.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en extracción de factor común por grupo.
ejemplos:
- titulo: Extrae los factores por grupo en $(2x^2 + 4x) + (3xy + 6y)$
  enunciado: Extrae los factores por grupo en $(2x^2 + 4x) + (3xy + 6y)$.
  solucion_pasos:
  - 'Primer grupo: Factor común es 2x. Queda $2x(x + 2)$.'
  - 'Segundo grupo: Factor común es 3y. Queda $3y(x + 2)$.'
  - 'Expresión resultante: $2x(x + 2) + 3y(x + 2)$.'
- titulo: ¿Qué obtienes al extraer factores en $(m^3 - m^2) + (-2m + 2)$?
  solucion_pasos:
  - En el segundo grupo sacamos el factor negativo (-2) para que el interior cambie
    a (m-1) y sea idéntico al primero.
- titulo: 'Respecto de «Extracción de factor común por grupo»: ¿Se ajusta a la definición
    esta afirmaci'
  enunciado: 'Respecto de «Extracción de factor común por grupo»: ¿Se ajusta a la
    definición esta afirmación? «Consiste en factorizar cada uno de los paréntesis
    agrupados extrayendo su respectivo factor común monomio»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Consiste en factorizar cada
    uno de los paréntesis agrupados extrayendo su respectivo factor común monomio.'
- titulo: 'Respecto de «Extracción de factor común por grupo»: ¿Es compatible con
    el procedimiento esta'
  enunciado: 'Respecto de «Extracción de factor común por grupo»: ¿Es compatible con
    el procedimiento esta afirmación? «Olvidar escribir el signo ''+'' (o ''-'') entre
    los dos grupos una vez extraídos los factores»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Consiste en factorizar cada
    uno de los paréntesis agrupados extrayendo su respectivo factor común monomio.'
errores_frecuentes:
- Olvidar escribir el signo '+' (o '-') entre los dos grupos una vez extraídos los
  factores.
- Extraer factores pero dejar paréntesis que no son idénticos, y tratar de continuar
  con el siguiente paso.
- Extraer un número positivo cuando se necesitaba uno negativo para igualar signos
  internos.
- Eliminar todos los paréntesis.
- Para «¿Cuál es el objetivo principal al extraer factores de cada grupo», la respuesta
  correcta es Que los factores externos sean iguales.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando extracción de factor común por grupo.
