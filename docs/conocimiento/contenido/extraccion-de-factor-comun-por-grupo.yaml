semantic_id: MAT.ALG.FACTOR_AGRUPACION.FACTOR_COMUN_POR_GRUPO
resumen_inicial: 'Extracción de factor común por grupo: concepto, método de descomposición
  y reglas en Factorización por agrupación.'
explicacion_simple: Una vez que tenemos a nuestro polinomio extenso dividido en dos
  equipos, es hora de simplificar a cada equipo por separado. Le quitaremos a cada
  grupo lo que le sobra, aplicando la técnica de factor común monomio que ya conocemos.
explicacion_formal: '### Definición formal


  Crear un paréntesis idéntico en ambos lados es vital para el paso final.


  ### Desarrollo didáctico


  Continuando con nuestro polinomio agrupado: $(ax + bx) + (ay + by)$.


  Trabajamos en el primer grupo: $(ax + bx)$. Ambos términos tienen la letra ''x''.
  Si factorizamos extrayendo la ''x'', nos queda $x(a + b)$.


  Trabajamos en el segundo grupo: $(ay + by)$. Ambos tienen la letra ''y''. Extraemos
  la ''y'' y nos queda $y(a + b)$.


  Juntando los dos resultados en nuestra expresión general, tenemos ahora:

  $x(a + b) + y(a + b)$.


  Fíjate en la relación algebraica que acaba de ocurrir. Al factorizar cada grupo
  por separado, hemos creado artificialmente un nuevo bloque repetido: el paréntesis
  $(a + b)$. Si los paréntesis no hubiesen quedado iguales, significaría que la agrupación
  fue incorrecta o que debimos extraer un signo negativo.'
definiciones_clave: '- **Extracción de factor común por grupo**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en extracción de factor común por grupo.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de extracción
    de factor común por grupo.
  pasos:
  - Identificar la estructura o los factores comunes en los términos del polinomio.
  - Aplicar la regla o método correspondiente a extracción de factor común por grupo.
  - Expresar el polinomio como un producto de dos o más factores.
  - Verificar multiplicando los factores resultantes.
