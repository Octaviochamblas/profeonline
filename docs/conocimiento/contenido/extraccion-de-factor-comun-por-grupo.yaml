semantic_id: MAT.ALG.FACTOR_AGRUPACION.FACTOR_COMUN_POR_GRUPO
resumen_inicial: La extracción de factor común por grupo consiste en aplicar la factorización monómica independiente en cada
  paréntesis para hacer surgir de forma simultánea un factor común polinomio coincidente en todos los subgrupos.
explicacion_simple: "Una vez que agrupaste un polinomio en parejas (ej: $(2x^2 + 4x) + (3x + 6)$):\n- **PASO DE FACTORIZACIÓN\
  \ PARCIAL POR GRUPOS**:\n  1. **Factoriza el Primer Grupo**:\n     - En $(2x^2 + 4x)$, el factor común monomio es **$2x$**.\n\
  \     - Al dividir: $\\frac{2x^2}{2x} = x$ y $\\frac{4x}{2x} = 2 \\implies \\mathbf{2x(x + 2)}$.\n  2. **Factoriza el Segundo\
  \ Grupo**:\n     - En $(3x + 6)$, el factor común monomio es **$3$**.\n     - Al dividir: $\\frac{3x}{3} = x$ y $\\frac{6}{3}\
  \ = 2 \\implies \\mathbf{3(x + 2)}$.\n  3. **Observa el Milagro Algebraico**:\n     - ¡La suma queda: $\\mathbf{2x(x + 2)\
  \ + 3(x + 2)}$!\n     - ¡Ambos grupos produjeron exactamente el mismo paréntesis **$(x + 2)$**!\n\n![Extracción de factor\
  \ común por grupo](/static/img/nodos/extraccion-de-factor-comun-por-grupo-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la agrupación asociativa $P = (T_1 + T_2) + (T_3 + T_4) \in \mathbb{R}[x]$. La **extracción de factor común por grupo**
  define la aplicación de los operadores de factorización monomial local $M_1 = \operatorname{MCD}(T_1, T_2)$ y $M_2 = \operatorname{MCD}(T_3,
  T_4)$ tal que:


  $$P = M_1 \cdot Q_1(x) + M_2 \cdot Q_2(x)$$


  donde $Q_1(x) = \frac{T_1 + T_2}{M_1}$ y $Q_2(x) = \frac{T_3 + T_4}{M_2}$.


  ### Condición de Armonización Binomial

  El método alcanza la continuidad operativa si y sólo si se satisface la igualdad polinómica entre los cocientes locales:


  $$Q_1(x) = Q_2(x) = B(x)$$


  transformando el polinomio original en la suma de productos parciales $M_1 B(x) + M_2 B(x)$.


  ### Síntesis didáctica

  Extraer el factor común de cada grupo de forma separada expone el bloque polinómico $(x+a)$ oculto tras los coeficientes
  locales $M_1$ y $M_2$.

  '
definiciones_clave: '- **Factorización parcial por grupos**: Extracción independiente del factor común monomio de cada pareja
  de términos.

  - **Factores monómicos locales ($M_1, M_2$)**: Monomios exteriores resultantes de la división en cada subgrupo.

  - **Paréntesis cociente coincidente ($B(x)$)**: Paréntesis idéntico resultante de la división en todos los subgrupos.

  '
propiedades_relaciones: '- **Verificación de concordancia**: Si $Q_1(x) \neq Q_2(x)$ (los paréntesis no coinciden), la agrupación
  planteada no permite continuar el proceso y debe probarse un reordenamiento.

  '
ejemplo_guiado:
  enunciado: Extrae el factor común por grupo en la expresión agrupada $(5x^2 - 10x) - (3xy - 6y)$.
  pasos:
  - 'Paso 1: Tomamos el primer grupo $(5x^2 - 10x)$: - MCD de coeficientes ($5, 10$) = $5$. - Menor exponente de $x$ = $x$.
    - Factor común $M_1 = \mathbf{5x}$. - División: $5x(x - 2)$.'
  - 'Paso 2: Tomamos el segundo grupo $-(3xy - 6y)$: - MCD de coeficientes ($3, 6$) = $3$. - Variable común = $y$. - Factor
    común $M_2 = \mathbf{3y}$. - División: $-3y(x - 2)$.'
  - 'Paso 3: Reunimos las expresiones factorizadas parcialmente: $5x(x - 2) - 3y(x - 2)$.'
  - 'Conclusión: La expresión con factores comunes extraídos por grupo es **$5x(x - 2) - 3y(x - 2)$**.'
  imagen: /static/img/nodos/extraccion-de-factor-comun-por-grupo-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: En la expresión agrupada $(4a^2 + 8a) + (3ab + 6b)$, ¿cuáles son los factores comunes monómicos de cada grupo
    y qué paréntesis coincidente generan?
  choices:
  - text: El primer grupo tiene como común $4a$ generando $4a(a + 2)$, el segundo grupo tiene $3b$ generando $3b(a + 2)$,
      coincidiendo en el paréntesis $(a + 2)$
    is_correct: true
  - text: El primer grupo genera $4(a + 2)$ y el segundo $3(a + 2)$
    is_correct: false
  - text: No coinciden en ningún paréntesis
    is_correct: false
  - text: El factor de ambos grupos es $a^2$
    is_correct: false
  explanation: La alternativa correcta es 'El primer grupo tiene como común $4a$ generando $4a(a + 2)$, el segundo grupo tiene
    $3b$ generando $3b(a + 2)$, coincidiendo en el paréntesis $(a + 2)$'. $4a(a+2) + 3b(a+2)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si al extraer factores por grupo en un polinomio obtienes $2x(a - 3) + 5y(a + 3)$, ¿puedes avanzar directamente
    a la extracción final?
  choices:
  - text: No, porque los paréntesis $(a - 3)$ y $(a + 3)$ no son idénticos; se debe reordenar o revisar la agrupación
    is_correct: true
  - text: Sí, los paréntesis son iguales
    is_correct: false
  - text: Sí, ignorando los signos
    is_correct: false
  - text: No, falta sumar los números 2 y 5
    is_correct: false
  explanation: La alternativa correcta es 'No, porque los paréntesis $(a - 3)$ y $(a + 3)$ no son idénticos; se debe reordenar
    o revisar la agrupación'. Exigencia de coincidencia polinómica $Q_1(x) = Q_2(x)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer el factor común monomio del primer grupo de términos.'
- 'Paso 2: Extraer el factor común monomio del segundo grupo de términos.'
- 'Paso 3: Comprobar que los paréntesis cocientes resultantes en ambos grupos sean rigurosamente idénticos en términos y signos.'
- 'Paso 4: Escribir la suma de los productos parciales $M_1 B(x) + M_2 B(x)$.'
errores_correccion: '- **Error 1:** Continuar la factorización cuando los paréntesis cocientes difieren en un signo (tratar
  $(x-2)$ y $(x+2)$ como iguales). **Cómo corregirlo:** Si los paréntesis difieren en signos **SE DEBE REVISAR EL SIGNO EXTRAÍDO
  EN EL GRUPO O REORDENAR LOS TÉRMINOS**.

  - **Error 2:** Excluir la extracción del MCD completo en alguno de los grupos (extraer sólo $2$ en lugar de $4x$). **Cómo
  corregirlo:** Se debe **EXTRAER EL MÁXIMO FACTOR COMÚN DE CADA GRUPO PARA QUE EL PARÉNTESIS COINCIDA**.

  '
ejemplos:
- titulo: Extracción en primer grupo
  enunciado: Para $(x^3 + 2x^2)$, ¿es $x^2(x + 2)$ la extracción de su factor común monomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2$ es el menor exponente.
- titulo: Extracción en segundo grupo
  enunciado: Para $(3x + 6)$, ¿es $3(x + 2)$ la extracción de su factor común monomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{MCD}(3,6)=3$.
- titulo: Coincidencia de paréntesis
  enunciado: ¿Muestran $x^2(x + 2)$ y $3(x + 2)$ la presencia del mismo paréntesis $(x + 2)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos contienen $(x+2)$.
- titulo: Extracción con signo negativo
  enunciado: En $-(4x + 8)$, ¿da la extracción del $-4$ la expresión $-4(x + 2)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-4x/-4 = x$ y $-8/-4 = 2$.
errores_frecuentes:
- Avanzar a la factorización final cuando los paréntesis de cada grupo difieren en términos o signos.
- Extraer factores parciales incompletos en los grupos impidiendo la coincidencia de paréntesis.
- El signo menos del segundo grupo no es considerado al escribir el producto parcial.
- Alterar los exponentes de las variables al realizar la división monomial en los subgrupos.
- Tratar expresiones opuestas como $(x-2)$ y $(2-x)$ como iguales sin extraer el signo menos.
afirmaciones_verdaderas:
- La extracción de factor común por grupo requiere factorizar independientemente cada pareja de términos.
- El método sólo es exitoso si los paréntesis resultantes en todos los grupos son idénticos.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/extraccion-de-factor-comun-por-grupo-resumen.svg)


  QUÉ: Extraer el factor común monomio de cada grupo de términos verificando la aparición del paréntesis coincidente.

  CÓMO: Aplicar la factorización monomial independiente $M_1 Q_1(x) + M_2 Q_2(x)$ en cada subgrupo asegurando la concordancia
  estricta de los cocientes $Q_1(x) = Q_2(x) = B(x)$.

  '
