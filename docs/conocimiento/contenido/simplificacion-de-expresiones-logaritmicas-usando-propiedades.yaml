semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.SIMPLIFICACION
resumen_inicial: La simplificación de expresiones logarítmicas combina sistemáticamente las propiedades de la potencia, del producto y del cociente para condensar expresiones de múltiples términos en un único logaritmo $\log_b\left(\frac{\prod x_i^{\alpha_i}}{\prod y_j^{\beta_j}}\right)$ o expandir términos complejos.
explicacion_simple: "![La simplificación de expresiones logarítmicas combina sistemáticamente las propiedades de la potencia, del producto y del cociente para condensar expresiones de múltiples términos en un único logaritmo $\\log_b\\left(\\frac{\\prod x_i^{\\alpha_i}}{\\prod y_j^{\\beta_j}}\\right)$ o expandir términos complejos](/static/img/nodos/simplificacion-de-expresiones-logaritmicas-usando-propiedades-intro.svg)\n\n\nPara simplificar y juntar una fila larga de logaritmos en **UN SOLO LOGARITMO ELEGANTE**:\n\n**El algoritmo de los 3 pasos:**\n1. **Paso 1 (Subir sombreros):** Sube todos los números que multiplican por delante como exponentes del argumento:\n   $$2\\log(x) + 3\\log(y) - \\log(z) \\implies \\log(x^2) + \\log(y^3) - \\log(z)$$\n2. **Paso 2 (Armar la gran fracción):**\n   - Los términos con signo **$+$** van multiplicando **ARRIBA (en el numerador)**: $x^2 \\cdot y^3$.\n   - Los términos con signo **$-$** van multiplicando **ABAJO (en el denominador)**: $z$.\n3. **Paso\
  \ 3 (Escribir el resultado final):**\n   $$\\mathbf{\\log\\left(\\frac{x^2 \\cdot y^3}{z}\\right)}$$"
explicacion_formal: "Dada una combinación lineal afín de logaritmos en base común $b \\in \\mathbb{R}^+ \\setminus \\{1\\}$:\n$$E = \\sum_{i=1}^n \\alpha_i \\log_b(u_i) - \\sum_{j=1}^m \\beta_j \\log_b(v_j), \\quad (\\alpha_i, \\beta_j, u_i, v_j > 0)$$\n\n**Teorema de Reducción Canónica**:\n1. **Paso de Potenciación**: Por $\\alpha \\log_b(u) = \\log_b(u^\\alpha)$, la expresión se transforma en:\n   $$E = \\sum_{i=1}^n \\log_b\\left(u_i^{\\alpha_i}\\right) - \\sum_{j=1}^m \\log_b\\left(v_j^{\\beta_j}\\right)$$\n2. **Paso de Agrupación Multiplicativa**: Por el homomorfismo aditivo-multiplicativo:\n   $$E = \\log_b\\left(\\prod_{i=1}^n u_i^{\\alpha_i}\\right) - \\log_b\\left(\\prod_{j=1}^m v_j^{\\beta_j}\\right)$$\n3. **Paso de Reducción Fraccionaria**:\n   $$E = \\log_b\\left( \\frac{\\prod_{i=1}^n u_i^{\\alpha_i}}{\\prod_{j=1}^m v_j^{\\beta_j}} \\right)$$\nDemuestra que toda combinación lineal de logaritmos es condensable en un único término logarítmico canónico."
definiciones_clave: '- **Condensación logarítmica**: Reducción de sumas y restas ponderadas a un único logaritmo.

  - **Expansión logarítmica**: Desarrollo de un logaritmo de argumento complejo en suma algebraica de logaritmos simples.'
propiedades_relaciones: '- **Jerarquía de simplificación**: Primero se suben los coeficientes como exponentes; solo después se aplican las reglas de producto y cociente.

  - **Agrupación de denominadores**: Múltiples términos con signo negativo se multiplican entre sí dentro del denominador.'
ejemplo_guiado:
  enunciado: '![Ejemplo La simplificación de expresiones logarítmicas combina sistemáticamente las propiedades de la potencia, del producto y del cociente para condensar expresiones de múltiples términos en un único logaritmo $\log_b\left(\frac{\prod x_i^{\alpha_i}}{\prod y_j^{\beta_j}}\right)$ o expandir términos complejos](/static/img/nodos/simplificacion-de-expresiones-logaritmicas-usando-propiedades-ejemplos.svg)



    Condensa la siguiente expresión en un solo logaritmo y calcula su valor numérico exacto:

    $$E = 3\log_2(4) + 2\log_2(6) - \log_2(9) - \log_2(16)$$'
  pasos:
  - 'Paso 1: Subir los coeficientes como exponentes:

    $E = \log_2(4^3) + \log_2(6^2) - \log_2(9) - \log_2(16)$.'
  - 'Paso 2: Calcular las potencias de los argumentos:

    $4^3 = 64, \quad 6^2 = 36$.'
  - 'Paso 3: Agrupar términos positivos en el numerador y negativos en el denominador:

    $$E = \log_2\left( \frac{64 \cdot 36}{9 \cdot 16} \right)$$'
  - 'Paso 4: Simplificar la fracción numérica interna:

    - $64 / 16 = 4$.

    - $36 / 9 = 4$.

    - Fracción: $4 \cdot 4 = 16$.

    $$E = \log_2(16)$$'
  - 'Paso 5: Evaluar el logaritmo final: $\log_2(16) = \mathbf{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condensación en un solo logaritmo de $2\log(a) - 3\log(b)$?
  choices:
  - text: log(a² / b³)
    is_correct: true
  - text: log(2a - 3b)
    is_correct: false
  - text: log(a² · b³)
    is_correct: false
  - text: 2a / 3b
    is_correct: false
  explanation: La alternativa correcta es 'log(a² / b³)'. El 2 sube como exponente de $a$ en el numerador ($a^2$) y el 3 sube como exponente de $b$ en el denominador ($b^3$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al condensar $\log(x) - \log(y) - \log(z)$, ¿cómo queda el argumento?
  choices:
  - text: x / (y · z) (ambos términos negativos multiplican en el denominador)
    is_correct: true
  - text: (x · z) / y
    is_correct: false
  - text: x - y - z
    is_correct: false
  - text: (x / y) / z
    is_correct: false
  explanation: 'La alternativa correcta es ''x / (y · z) (ambos términos negativos multiplican en el denominador)''. Los signos menos agrupan los factores en el denominador: $\log(x) - (\log(y) + \log(z)) = \log(x/(yz))$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Subir todos los coeficientes numéricos exteriores como exponentes de los argumentos.'
- 'Paso 2: Identificar los términos positivos para colocarlos multiplicando en el numerador.'
- 'Paso 3: Identificar todos los términos negativos para colocarlos multiplicando en el denominador.'
- 'Paso 4: Escribir el logaritmo único $\log_b\left(\frac{\text{Numerador}}{\text{Denominador}}\right)$ y simplificar algebraicamente.'
errores_correccion: '- **Error común:** Agrupar productos antes de subir los coeficientes como exponentes (ej: $2\log(x) + \log(y) = \log(2xy)$).

  - **Cómo corregirlo:** **Primero sube los exponentes**: $2\log(x) = \log(x^2)$, y luego multiplica: $\log(x^2 y)$.'
ejemplos:
- titulo: 'Ejemplo 1: Condensación con dos variables'
  enunciado: 'Condensa $3\log(x) + \log(y)$:'
  alternativas:
  - log(x³ y)
  - log(3xy)
  - 3log(xy)
  - log(x³ + y)
  respuesta: log(x³ y)
  solucion_pasos:
  - 'Paso 1: $\log(x^3) + \log(y) = \log(x^3 y)$.'
- titulo: 'Ejemplo 2: Dos términos restados'
  enunciado: 'Condensa $\ln(a) - \ln(b) - \ln(c)$:'
  alternativas:
  - ln(a / (bc))
  - ln((ac) / b)
  - ln(a - b - c)
  - ln(a / b / c)
  respuesta: ln(a / (bc))
  solucion_pasos:
  - 'Paso 1: $\ln\left(\frac{a}{b \cdot c}\right)$.'
- titulo: 'Ejemplo 3: Exponentes fraccionarios (raíces)'
  enunciado: 'Condensa $\frac{1}{2}\log(x) + 4\log(y)$:'
  alternativas:
  - log(√x · y⁴)
  - log(x/2 · 4y)
  - log(x² y⁴)
  - log(√(xy⁴))
  respuesta: log(√x · y⁴)
  solucion_pasos:
  - 'Paso 1: $\log(x^{1/2}) + \log(y^4) = \log(\sqrt{x} \cdot y^4)$.'
- titulo: 'Ejemplo 4: Simplificación numérica completa'
  enunciado: 'Calcula $E = \log_3(18) + \log_3(12) - \log_3(8)$:'
  alternativas:
  - '3'
  - '27'
  - '9'
  - '2'
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $\log_3\left(\frac{18 \cdot 12}{8}\right) = \log_3\left(\frac{216}{8}\right) = \log_3(27) = 3$.'
errores_frecuentes:
- Olvidar subir los coeficientes como exponentes antes de combinar productos o divisiones.
- Colocar factores negativos como restas en el numerador en vez de multiplicaciones en el denominador.
- Combinar logaritmos con diferentes bases sin unificarlas primero.
afirmaciones_verdaderas:
- Toda combinación lineal de logaritmos de igual base se condensa en un único logaritmo canónico.
- Los términos con coeficiente positivo forman el producto del numerador y los de coeficiente negativo el del denominador.
al_terminar_debes_poder: '**QUÉ:** Simplificar y condensar expresiones logarítmicas complejas usando propiedades.


  **CÓMO:** Subiendo exponentes, multiplicando argumentos positivos en el numerador y agrupando negativos en el denominador.


