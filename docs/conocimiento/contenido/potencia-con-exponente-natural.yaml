semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_NATURAL
resumen_inicial: Una potencia con exponente natural $n \in \mathbb{N}$ representa
  la multiplicación de la base por sí misma $n$ veces.
explicacion_simple: 'Cuando el exponente es un número entero positivo ($1, 2, 3, 4,
  \dots$), simplemente multiplicas la base por sí misma esa cantidad de veces.

  - $2^1 = 2$

  - $2^2 = 2 \cdot 2 = 4$

  - $2^3 = 2 \cdot 2 \cdot 2 = 8$'
explicacion_formal: Para $a \in \mathbb{R}$ y $n \in \mathbb{N}$, la función potencia
  se define recursivamente por $a^1 = a$ y $a^{n+1} = a^n \cdot a$. Esto equivale
  al producto de $n$ factores de $a$.
definiciones_clave: '- **Exponente natural ($n \in \mathbb{N}$)**: Cantidad entera
  positiva de factores iguales.'
propiedades_relaciones: '- **Crecimiento según la base**: Si $a > 1$, a mayor exponente
  natural $n$, mayor es $a^n$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $5^3$.
  pasos:
  - Identificar base $a=5$ y exponente natural $n=3$.
  - 'Expandir el producto: $5 \cdot 5 \cdot 5$.'
  - 'Multiplicar: $5 \cdot 5 = 25$, luego $25 \cdot 5 = 125$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $4^3$?
  choices:
  - text: '64'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '81'
    is_correct: false
  explanation: 'La correcta es: 64. $4^3 = 4 \cdot 4 \cdot 4 = 64$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa $3^4$ en forma expandida?
  choices:
  - text: 3 · 3 · 3 · 3
    is_correct: true
  - text: 3 + 3 + 3 + 3
    is_correct: false
  - text: 3 · 4
    is_correct: false
  - text: 4 · 4 · 4
    is_correct: false
  explanation: 'La correcta es: 3 · 3 · 3 · 3. La base 3 se multiplica 4 veces.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el exponente sea un número natural.'
- 'Paso 2: Escribir la base repetida $n$ veces en multiplicación.'
- 'Paso 3: Calcular el producto.'
errores_correccion: Evita sumar en lugar de multiplicar. $2^3$ NO es $2 + 2 + 2 =
  6$, sino $2 \cdot 2 \cdot 2 = 8$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $10^4$.
  alternativas:
  - '10000'
  - '40'
  - '1000'
  respuesta: '10000'
  solucion_pasos:
  - $10^4 = 10 \cdot 10 \cdot 10 \cdot 10 = 10000$.
errores_frecuentes:
- Sumar la base en lugar de multiplicarla.
afirmaciones_verdaderas:
- El exponente natural indica la cantidad de factores.
al_terminar_debes_ponder: Calcular potencias con exponente natural con precisión.
fuente: Texto escolar MINEDUC.
estado: publicado
