semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_NATURAL
resumen_inicial: Una potencia con exponente natural $n \in \mathbb{N}$ representa la multiplicación sucesiva de $n$ factores iguales a la base.
explicacion_simple: '![Potencia con exponente natural](/static/img/nodos/potencia-con-exponente-natural-intro.svg)


  Cuando el exponente es un número natural ($1, 2, 3, 4, 5...$), calcular la potencia consiste en multiplicar la base por sí misma tantas veces como indique el exponente. Por ejemplo, $2^5 = 2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$. Si la base es negativa y está entre paréntesis, el resultado será positivo si el exponente es par, o negativo si el exponente es impar.'
explicacion_formal: 'Para toda base $a \in \mathbb{R}$ y todo exponente $n \in \mathbb{N} = \{1, 2, 3, \dots\}$, la potencia $a^n$ se define recursivamente:


  $$\begin{cases} a^1 = a \\ a^{n+1} = a^n \cdot a \end{cases}$$


  **Propiedades algebraicas en $\mathbb{N}$:**

  1. **Multiplicación de igual base:** $a^m \cdot a^n = a^{m+n}$

  2. **División de igual base ($m > n, a \neq 0$):** $\frac{a^m}{a^n} = a^{m-n}$

  3. **Potencia de una potencia:** $(a^m)^n = a^{m \cdot n}$

  4. **Potencia de un producto:** $(a \cdot b)^n = a^n \cdot b^n$

  5. **Potencia de un cociente ($b \neq 0$):** $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$'
definiciones_clave: '- **Exponente natural**: Número de conteo $\{1, 2, 3...\}$ que define el número exacto de factores.

  - **Crecimiento potencial**: Ritmo multiplicativo determinado por el número de iteraciones.'
propiedades_relaciones: '- **Monotonía para bases $> 1$**: Si $m < n \implies a^m < a^n$.

  - **Comportamiento para bases en $(0, 1)$**: Si $m < n \implies a^m > a^n$ (la potencia decrece).'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencias de exponente natural](/static/img/nodos/potencia-con-exponente-natural-ejemplos.svg)


    Calcule el valor de $(-3)^3$, $(-2)^4$ y $10^5$ aplicando el concepto de exponente natural.'
  pasos:
  - 'Paso 1: Evaluar $(-3)^3$: Exponente $3$ (impar). Desarrollo: $(-3) \cdot (-3) \cdot (-3) = 9 \cdot (-3) = -27$.'
  - 'Paso 2: Evaluar $(-2)^4$: Exponente $4$ (par). Desarrollo: $(-2) \cdot (-2) \cdot (-2) \cdot (-2) = 4 \cdot 4 = +16$.'
  - 'Paso 3: Evaluar $10^5$: Potencia de base $10$. Corresponde al $1$ seguido de $5$ ceros: $10 \cdot 10 \cdot 10 \cdot 10 \cdot 10 = 100\,000$.'
  - 'Conclusión: $(-3)^3 = -27$, $(-2)^4 = 16$ y $10^5 = 100\,000$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de simplificar $(2^3)^2$?
  choices:
  - text: $2^6 = 64$ (multiplicando los exponentes $3 \cdot 2$)
    is_correct: true
  - text: $2^5 = 32$
    is_correct: false
  - text: $2^9 = 512$
    is_correct: false
  - text: $12$
    is_correct: false
  explanation: La alternativa correcta es '$2^6 = 64$ (multiplicando los exponentes $3 \cdot 2$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(-2)^4$ da un resultado positivo ($+16$)?
  choices:
  - text: Porque el exponente $4$ es un número natural par y el producto de $4$ números negativos es positivo
    is_correct: true
  - text: Porque la base es par
    is_correct: false
  - text: Porque se sumaron los números
    is_correct: false
  - text: Porque todo exponente natural da positivo
    is_correct: false
  explanation: La alternativa correcta es 'Porque el exponente $4$ es un número natural par y el producto de $4$ números negativos es positivo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente natural $n$ y la base $a$.'
- 'Paso 2: Si es posible, aplicar propiedades de simplificación (igual base o potencia de potencia) antes de expandir.'
- 'Paso 3: Calcular el producto de los factores respetando la regla de signos de paridad.'
errores_correccion: '- **Error 1: Sumar las bases al multiplicar potencias de igual base (pensar que $2^3 \cdot 2^2 = 4^5$).** **Cómo corregirlo:** La base se MANTIENE constante y solo se suman los exponentes ($2^{3+2} = 2^5 = 32$).

  - **Error 2: Sumar exponentes en potencia de una potencia ($(a^3)^2 = a^5$).** **Cómo corregirlo:** En potencia de una potencia los exponentes se MULTIPLICAN ($(a^3)^2 = a^{3 \cdot 2} = a^6$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $2^3 \cdot 2^4$?
  alternativas:
  - $2^7 = 128$
  - $4^7$
  - $2^{12}$
  respuesta: $2^7 = 128$
  solucion_pasos:
  - Se conserva la base $2$ y se suman exponentes $3+4=7 \implies 2^7 = 128$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $(-5)^3$?
  alternativas:
  - $-125$
  - $+125$
  - $-15$
  respuesta: $-125$
  solucion_pasos:
  - $(-5) \cdot (-5) \cdot (-5) = 25 \cdot (-5) = -125$.
- titulo: ¿Es (3²)³ igual a 3⁶?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por la propiedad de potencia de una potencia: $2 \cdot 3 = 6 \implies 3^6$.'
  alternativas:
  - texto: Sí, se multiplican los exponentes (2 · 3 = 6)
    es_correcta: true
    retroalimentacion: ¡Correcto! $(a^m)^n = a^{m \cdot n}$.
  - texto: No, se deben sumar los exponentes y da 3⁵
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes solo se suman al multiplicar potencias de igual base.
  - texto: No, es igual a 3⁸
    es_correcta: false
    retroalimentacion: Incorrecto, $2 \cdot 3 = 6$.
- titulo: ¿Es 2⁴ menor que 4²?
  respuesta: 'No'
  solucion_pasos:
  - No, $2^4 = 16$ y $4^2 = 16$, son exactamente iguales.
  alternativas:
  - texto: No, son exactamente iguales (ambas valen 16)
    es_correcta: true
    retroalimentacion: ¡Correcto! $2^4 = 16$ y $4^2 = 16$.
  - texto: Sí, 2⁴ es menor
    es_correcta: false
    retroalimentacion: Incorrecto, $2^4 = 16$.
  - texto: No, 2⁴ es mayor
    es_correcta: false
    retroalimentacion: Incorrecto, tienen el mismo valor numérico.
errores_frecuentes:
- Multiplicar las bases en lugar de conservarlas ($3^2 \cdot 3^3 = 9^5$).
- Sumar exponentes al calcular potencias de potencias.
- Olvidar que $1^n = 1$ para cualquier número natural $n$.
- Creer que bases decimales menores a 1 crecen al aumentar el exponente ($0,5^3 = 0,125 < 0,5$).
- Aplicar propiedades de producto a sumas de potencias ($2^3 + 2^2 \neq 2^5$).
afirmaciones_verdaderas:
- Al multiplicar potencias de igual base se conserva la base y se suman los exponentes.
- En la potencia de una potencia se conserva la base y se multiplican los exponentes.
- Toda potencia con exponente natural $n$ es la multiplicación de $n$ factores de la base.
al_terminar_debes_poder: '![Síntesis de potencia con exponente natural](/static/img/nodos/potencia-con-exponente-natural-resumen.svg)


  QUÉ: Calcular y simplificar potencias con exponente natural $n \in \mathbb{N}$.


  CÓMO: Aplicando las propiedades algebraicas fundamentales (producto y cociente de igual base, potencia de potencia y distributividad sobre productos y cocientes), expandiendo factores y calculando resultados exactos respetando la regla de signos.'
