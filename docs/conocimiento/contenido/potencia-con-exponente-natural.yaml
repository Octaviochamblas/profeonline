semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_NATURAL
resumen_inicial: Una potencia con exponente natural $n \in \{1, 2, 3, \dots\}$ representa
  la multiplicación explícita de $n$ factores idénticos a la base.
explicacion_simple: Cuando el exponente es un número entero positivo (natural), nos
  indica cuántos factores de la base debemos escribir en una multiplicación continua.
  Por ejemplo, si el exponente es 3, escribimos 3 veces la base y las multiplicamos.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $n \in \mathbb{N}_{\ge 1}$, la
  **Potencia de Exponente Natural** se rige por la definición recursiva:


  $$a^1 = a \quad \text{y} \quad a^{n+1} = a^n \cdot a$$


  **Desglose inductivo:**

  - Caso base $n=1$: $a^1 = a$.

  - Paso inductivo: Multiplicar el resultado acumulado por una instancia adicional
  de la base $a$.


  > **Complemento didáctico:** La definición inductiva garantiza la validez de las
  leyes de los exponentes para todo $n$ natural.'
definiciones_clave: '- **Potencia de exponente natural**: Caso fundamental $a^n$ donde
  $n \in \mathbb{N}$ cuenta factores repetidos.'
propiedades_relaciones: '- **Recursividad natural**: $a^{n+1} = a^n \cdot a$.'
ejemplo_guiado:
  enunciado: Desarrolle y calcule $4^3$ usando la definición de exponente natural.
  pasos:
  - 'Paso 1: Identificar el exponente natural $n = 3$.'
  - 'Paso 2: Escribir $3$ factores de la base $4$: $4 \cdot 4 \cdot 4$.'
  - 'Paso 3: Multiplicar en orden: $4 \cdot 4 = 16 \implies 16 \cdot 4 = 64$.'
  - 'Conclusión: El valor de $4^3$ es $64$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define la potencia a^n cuando n es un número natural mayor que
    1?
  choices:
  - text: Como el producto de n factores idénticos a la base a
    is_correct: true
  - text: Como la suma de a mas n
    is_correct: false
  - text: Como la resta a - n
    is_correct: false
  - text: Como una raíz enésima de cero
    is_correct: false
  explanation: La alternativa correcta es 'Como el producto de n factores idénticos
    a la base a'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4^3, ¿cuál fue el resultado del desarrollo?
  choices:
  - text: '64'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '43'
    is_correct: false
  explanation: La alternativa correcta es '64'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $a$ y verificar que el exponente $n$ sea un número
  entero positivo.'
- 'Paso 2: Escribir exactamente $n$ factores de la base $a$ en forma de multiplicación.'
- 'Paso 3: Calcular el producto iterado.'
errores_correccion: '- **Error 1: Multiplicar la base por el exponente natural ($4^3
  = 12$).** **Cómo corregirlo:** Se debe multiplicar la base por sí misma $3$ veces
  ($4 \cdot 4 \cdot 4 = 64$).


  - **Error 2: Pensar que $a^2$ significa $a + a$.** **Cómo corregirlo:** $a^2$ es
  $a \cdot a$; la suma $a+a$ da $2a$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $6^2$.
  alternativas:
  - '36'
  - '12'
  - '64'
  respuesta: '36'
  solucion_pasos:
  - $6 \cdot 6 = 36$.
- titulo: Ejemplo 2
  enunciado: Calcule $2^4$.
  alternativas:
  - '16'
  - '8'
  - '24'
  respuesta: '16'
  solucion_pasos:
  - $2 \cdot 2 \cdot 2 \cdot 2 = 16$.
- titulo: ¿Es 3^3 igual a 27?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot 3 \cdot 3 = 27$.
- titulo: ¿Representa 1^10 el valor numérico 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicar $1$ diez veces por sí mismo resulta en $1$.
errores_frecuentes:
- Evaluar $5^3$ mediante el producto directo $5 \cdot 3 = 15$.
- Declarar la suma repetida $a + a + a$ con la potencia de exponente natural $a^3$.
- El exponente natural indica la cantidad de veces que se debe sumar la base con el
  número cero.
- Elevar un número natural a un exponente natural produce siempre un número racional
  menor a cero.
- Las potencias con exponente natural de números positivos dan resultados negativos.
afirmaciones_verdaderas:
- Una potencia de exponente natural $n$ equivale a multiplicar la base por sí misma
  $n$ veces.
- Para todo entero positivo $n$, la potencia $a^n$ cumple la relación recursiva $a^{n+1}
  = a^n \cdot a$.
al_terminar_debes_poder: Al terminar serás capaz de evaluar potencias con exponente
  natural, efectuando los desarrollos multiplicativos correspondientes.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
