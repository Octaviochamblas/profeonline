semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.DILATACION_VERTICAL
resumen_inicial: El análisis de la dilatación vertical cuando $|a| > 1$ en $f(x) = ax^n$ describe un estiramiento vertical de factor $|a|$, incrementando la rapidez de cambio de la función y estrechando la abertura de la gráfica hacia el eje de ordenadas.
explicacion_simple: "![El análisis de la dilatación vertical cuando $|a| > 1$ en $f(x) = ax^n$ describe un estiramiento vertical de factor $|a|$, incrementando la rapidez de cambio de la función y estrechando la abertura de la gráfica hacia el eje de ordenadas](/static/img/nodos/analisis-de-la-dilatacion-vertical-cuando-a-1-intro.svg)\n\n\nCuando el número que multiplica a la potencia es **mayor que 1 ($a = 2, 3, 5, 10...$)**, la gráfica experimenta un **estiramiento vertical (se vuelve más empinada y cerrada)**:\n\n- **¿Qué le pasa a las alturas?**\n  - Cada valor de $y$ se multiplica por $a$, haciendo que la curva suba o baje **muchísimo más rápido**.\n  - Por ejemplo, en $y = x^2$, para $x = 2$ la altura es $4$. Pero en $y = \\mathbf{3}x^2$, para $x = 2$ la altura es **$12$** (¡el triple!).\n- **Efecto visual:** Las ramas de la curva **se cierran y se pegan más al eje vertical $Y$** (la curva es más angosta/estrecha)."
explicacion_formal: "Sea $f(x) = x^n$ y $g(x) = ax^n$ con $|a| > 1$. La transformación representa una homotecia vertical de razón $|a|$ con centro en el eje $X$:\n$$\\mathcal{H}_{(O_y, a)}: (x, y) \\mapsto (x, ay)$$\n\n**Comportamiento de la tasa de variación y apertura**:\n1. **Tasa de cambio instantánea**: $|g'(x)| = |a| \\cdot |f'(x)| > |f'(x)|$ para todo $x \\neq 0$. El crecimiento es estrictamente más acelerado.\n2. **Abertura geométrica**: Para cualquier altura fija $y_0 > 0$ en funciones pares, la separación horizontal de las ramas en $g(x)$ satisface:\n   $$\\Delta x_g = 2\\sqrt[n]{y_0 / a} < 2\\sqrt[n]{y_0} = \\Delta x_f$$\n   Demostrando que las ramas de $g(x)$ son estrictamente más estrechas que las de $f(x)$."
definiciones_clave: '- **Dilatación vertical**: Estiramiento escalar de ordenadas por un factor $|a| > 1$.

  - **Curva más estrecha**: Reducción de la distancia horizontal entre ramas para un mismo nivel de altura $y$.'
propiedades_relaciones: '- **Puntos calibradores**: En $x = 1$, la altura es exactamente $g(1) = a$.

  - **Invarianza del vértice**: En $x = 0$, $g(0) = a(0)^n = 0$, el origen permanece fijo.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la dilatación vertical cuando $|a| > 1$ en $f(x) = ax^n$ describe un estiramiento vertical de factor $|a|$, incrementando la rapidez de cambio de la función y estrechando la abertura de la gráfica hacia el eje de ordenadas](/static/img/nodos/analisis-de-la-dilatacion-vertical-cuando-a-1-ejemplos.svg)



    Compara las ordenadas y la rapidez de crecimiento entre $f(x) = x^4$ y $g(x) = 5x^4$:

    1) Evalúa en $x = 1, 2$.

    2) Explica por qué $g(x)$ es más estrecha que $f(x)$.'
  pasos:
  - 'Paso 1: Comparación de tablas de valores:

    - En $x = 1$: $f(1) = 1^4 = 1$, mientras que $g(1) = 5(1)^4 = \mathbf{5}$ ($5$ veces más alto).

    - En $x = 2$: $f(2) = 2^4 = 16$, mientras que $g(2) = 5(2)^4 = 5(16) = \mathbf{80}$ ($5$ veces más alto).'
  - 'Paso 2: Como para cada $x$ las alturas crecen 5 veces más rápido, la gráfica de $g(x)$ sube casi verticalmente, **estrechando sus ramas hacia el eje $Y$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones potencia presenta la gráfica más estrecha (más apegada al eje Y)?
  choices:
  - text: f(x) = 8x⁴
    is_correct: true
  - text: f(x) = 2x⁴
    is_correct: false
  - text: f(x) = x⁴
    is_correct: false
  - text: f(x) = 0,5x⁴
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 8x⁴'. A mayor valor absoluto del coeficiente $|a|$, mayor es la dilatación vertical y más estrecha es la curva.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $g(x) = -6x^3$, ¿qué tipo de transformación de escala vertical tiene respecto a $y = x^3$?
  choices:
  - text: Dilatación vertical de factor 6 combinada con reflexión en el eje X
    is_correct: true
  - text: Contracción vertical de factor 6
    is_correct: false
  - text: Traslación vertical hacia abajo en 6 unidades
    is_correct: false
  - text: Traslación horizontal
    is_correct: false
  explanation: La alternativa correcta es 'Dilatación vertical de factor 6 combinada con reflexión en el eje X'. Como $|a| = |-6| = 6 > 1$, la curva se dilata verticalmente.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el valor absoluto del coeficiente principal $|a|$.'
- 'Paso 2: Comprobar que $|a| > 1$.'
- 'Paso 3: Multiplicar cada altura original $y = x^n$ por $|a|$.'
- 'Paso 4: Dibujar las ramas de la gráfica más empinadas y estrechas hacia el eje vertical $Y$.'
errores_correccion: '- **Error común:** Pensar que $a = -4$ no dilata porque $-4 < 1$.

  - **Cómo corregirlo:** La dilatación depende del **VALOR ABSOLUTO $|a|$**: como $|-4| = 4 > 1$, la gráfica **se dilata verticalmente por un factor 4** y se refleja hacia abajo.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de factor de dilatación'
  enunciado: 'La función $f(x) = 7x^2$ está dilatada verticalmente respecto a $y = x^2$ por un factor de:'
  alternativas:
  - '7'
  - '2'
  - '14'
  - 1/7
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: Factor $|a| = 7$.'
- titulo: 'Ejemplo 2: Dilatación negativa'
  enunciado: 'En $g(x) = -9x^4$, el factor de dilatación vertical es:'
  alternativas:
  - '9'
  - '-9'
  - '4'
  - 1/9
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: $|a| = |-9| = 9$.'
- titulo: 'Ejemplo 3: Comparación de aperturas'
  enunciado: Entre $y = 3x^6$ e $y = 10x^6$, ¿cuál es más angosta?
  alternativas:
  - y = 10x⁶
  - y = 3x⁶
  - Son idénticas
  - Depende de x
  respuesta: y = 10x⁶
  solucion_pasos:
  - 'Paso 1: $|10| > |3| \implies y = 10x^6$ es más angosta.'
- titulo: 'Ejemplo 4: Punto calibrador'
  enunciado: 'Para $x = 1$, la función $f(x) = 12x^3$ alcanza el valor:'
  alternativas:
  - '12'
  - '1'
  - '36'
  - '3'
  respuesta: '12'
  solucion_pasos:
  - 'Paso 1: $f(1) = 12(1)^3 = 12$.'
errores_frecuentes:
- Ignorar el valor absoluto en coeficientes negativos.
- Confundir dilatación vertical con traslación vertical.
- Pensar que la dilatación desplaza el vértice del origen.
afirmaciones_verdaderas:
- Si |a| > 1, la gráfica experimenta una dilatación vertical por un factor |a|.
- A mayor valor absoluto de a, la gráfica es más empinada y estrecha hacia el eje Y.
al_terminar_debes_poder: '**QUÉ:** Analizar y graficar la dilatación vertical de funciones potencia con |a| > 1.


  **CÓMO:** Multiplicando las ordenadas por |a| y trazando ramas más estrechas y empinadas.


