semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_SEMICIRCUNFERENCIA_RECTO
resumen_inicial: Todo ángulo inscrito que subtiende un diámetro de la circunferencia es un ángulo recto de exactamente 90°, lo que constituye el célebre Teorema de Tales en el círculo.
explicacion_simple: 'Este es uno de los descubrimientos geométricos más antiguos y famosos de la humanidad, atribuido a **Tales de Mileto**:


  Si tomas un diámetro de la circunferencia ($AB$) y eliges **CUALQUIER punto** $C$ en el borde de la curva para formar un triángulo $\triangle ABC$, **¡el ángulo en ese punto $C$ siempre mide exactamente $90^\circ$ (es un ángulo recto)!**


  ¿Por qué pasa esto? Porque el diámetro corta a la circunferencia en dos mitades de $180^\circ$. Y como todo ángulo inscrito mide la mitad de su arco, **$180^\circ / 2 = 90^\circ$**. Esto significa que cualquier triángulo inscrito sobre un diámetro es **automáticamente un triángulo rectángulo**, lo que te permite usar inmediatamente el **Teorema de Pitágoras**: $AC^2 + BC^2 = AB^2$.


  ![Teorema de Tales en el círculo](/static/img/nodos/angulo-inscrito-en-una-semicircunferencia-como-angulo-recto-intro.svg)

  '
explicacion_formal: '### Teorema de Tales en la circunferencia

  Sea $\mathcal{C}(O, r)$ una circunferencia y sea $\overline{AB}$ un diámetro de $\mathcal{C}$ (con longitud $2r$). Para cualquier punto $C \in \mathcal{C}$ distinto de $A$ y $B$ ($C \neq A, C \neq B$), el ángulo inscrito $\angle ACB$ es recto:

  $$\overline{AB} = \text{Diámetro} \implies \angle ACB = 90^\circ$$


  ### Demostración analítica

  1. El diámetro $\overline{AB}$ divide a la circunferencia en dos semicircunferencias de medida angular $\overset{\frown}{AB} = 180^\circ$.

  2. El ángulo $\angle ACB$ es un ángulo inscrito que subtiende el arco $\overset{\frown}{AB}$.

  3. Por el Teorema del Ángulo Inscrito:

  $$\angle ACB = \frac{\text{med}(\overset{\frown}{AB})}{2} = \frac{180^\circ}{2} = 90^\circ$$


  ### Consecuencias métricas fundamentales

  - El triángulo $\triangle ABC$ es rectángulo con hipotenusa $\overline{AB} = 2r$.

  - La mediana relativa a la hipotenusa es el radio $OC = r$, que mide la mitad de la hipotenusa: $OC = \frac{AB}{2}$.

  - Se cumple la relación pitagórica: $AC^2 + BC^2 = AB^2 = (2r)^2 = 4r^2$.


  > **Complemento didáctico:** Cada vez que en la PAES te digan ''el segmento $AB$ es diámetro'' y veas un triángulo apoyado en él con el tercer vértice en la circunferencia, ¡marca inmediatamente un ángulo de $90^\circ$ en ese vértice! Es la llave maestra para aplicar Pitágoras, trigonometría o teoremas de Euclides.

  '
definiciones_clave: '- **Teorema de Tales circular**: Propiedad de ortogonalidad estricta para ángulos inscritos en semicircunferencias.

  - **Hipotenusa diametral**: El diámetro $\overline{AB}$ como lado mayor del triángulo rectángulo inscrito.

  - **Mediana radial**: Segmento $\overline{OC} = r$ que divide a la hipotenusa en dos partes iguales.

  '
propiedades_relaciones: '- **Ángulo invariable**: $\angle ACB = 90^\circ$ para todo $C \in \mathcal{C} \setminus \{A, B\}$.

  - **Ángulos agudos complementarios**: En el triángulo $\triangle ABC$, $\angle CAB + \angle CBA = 90^\circ$.

  - **Inversa del Teorema de Tales**: Si un triángulo rectángulo está inscrito en una circunferencia, su hipotenusa es necesariamente un diámetro.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo recto en semicircunferencia](/static/img/nodos/angulo-inscrito-en-una-semicircunferencia-como-angulo-recto-ejemplos.svg)


    Un triángulo $\triangle ABC$ está inscrito en una circunferencia donde el lado $\overline{AB}$ es un diámetro de longitud $10\text{ cm}$. Si el cateto $\overline{AC}$ mide $6\text{ cm}$, determina la medida de $\angle ACB$ y calcula la longitud del cateto $\overline{BC}$.'
  pasos:
  - 'Paso 1: Aplicar el Teorema de Tales: Como el lado $AB$ es un diámetro, el ángulo opuesto $\angle ACB$ es recto: $\angle ACB = 90^\circ$.'
  - 'Paso 2: Reconocer el triángulo rectángulo: $\triangle ABC$ es rectángulo en $C$ con hipotenusa $AB = 10\text{ cm}$.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras: $AC^2 + BC^2 = AB^2 \implies 6^2 + BC^2 = 10^2$.'
  - 'Paso 4: Despejar $BC$: $36 + BC^2 = 100 \implies BC^2 = 64 \implies BC = \sqrt{64} = 8\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto mide todo ángulo inscrito cuyos extremos coinciden con los de un diámetro de la circunferencia?
  choices:
  - text: Exactamente 90° (es un ángulo recto).
    is_correct: true
  - text: 180°.
    is_correct: false
  - text: 45°.
    is_correct: false
  - text: Depende de la posición del vértice sobre la curva.
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente 90° (es un ángulo recto).' Como subtiende un arco de $180^\circ$, su medida es $180^\circ / 2 = 90^\circ$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo inscrito sobre un diámetro AB, el ángulo en el vértice A mide 40°. ¿Cuánto mide el ángulo en el vértice B?
  choices:
  - text: 50°.
    is_correct: true
  - text: 40°.
    is_correct: false
  - text: 90°.
    is_correct: false
  - text: 140°.
    is_correct: false
  explanation: 'La alternativa correcta es ''50°.'' Como el ángulo en $C$ es de $90^\circ$, los otros dos son complementarios: $90^\circ - 40^\circ = 50^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si uno de los lados del triángulo pasa por el centro (es un diámetro).

  2. Confirmar que el tercer vértice esté sobre la circunferencia.

  3. Asignar inmediatamente una medida de $90^\circ$ a dicho ángulo.

  4. Utilizar el Teorema de Pitágoras o relaciones trigonométricas para resolver los lados desconocidos.

  '
errores_correccion: '- **Error común 1:** Asumir que el ángulo es de $90^\circ$ cuando la cuerda base no pasa por el centro. **Corrección:** El lado base DEBE ser un diámetro para que el ángulo sea recto.

  - **Error común 2:** Confundir la hipotenusa con los catetos. **Corrección:** La hipotenusa es siempre el diámetro opuesto al ángulo recto.

  '
ejemplos:
- tipo: A
  titulo: Ángulo sobre semicircunferencia
  enunciado: Un triángulo está inscrito en una circunferencia de modo que su lado mayor es un diámetro. ¿Qué tipo de triángulo es?
  alternativas:
  - text: Triángulo rectángulo.
    is_correct: true
  - text: Triángulo equilátero.
    is_correct: false
  - text: Triángulo obtusángulo.
    is_correct: false
  - text: Triángulo acutángulo no equilátero.
    is_correct: false
  explicacion: Por el Teorema de Tales, todo triángulo inscrito con un diámetro como lado tiene un ángulo de $90^\circ$ y es rectángulo.
- tipo: B
  titulo: Inscrito en semicircunferencia
  enunciado: ¿Mide siempre 90° un ángulo inscrito en una semicircunferencia?
  respuesta: Sí
  explicacion: Sí. Subtiende un arco de $180^\circ$, por lo que su medida es $180^\circ / 2 = 90^\circ$ de forma invariable.
errores_frecuentes:
- '''Creer que el ángulo de 90° solo se forma si el vértice está en el punto medio del arco.'''
- '''Olvidar que el diámetro actúa como la hipotenusa en el Teorema de Pitágoras.'''
- '''Aplicar el teorema a cuerdas que no pasan por el centro de la circunferencia.'''
afirmaciones_verdaderas:
- '''Todo ángulo inscrito que subtiende un diámetro mide exactamente $90^\circ$.'''
- '''Cualquier triángulo inscrito que tenga un diámetro como lado es un triángulo rectángulo.'''
- '''El centro de la circunferencia es el punto medio de la hipotenusa del triángulo rectángulo inscrito.'''
al_terminar_debes_poder: '**QUÉ:** Aplicar el Teorema de Tales para identificar ángulos rectos de 90° y resolver triángulos rectángulos inscritos.


  **CÓMO:** Verificando lados diametrales y utilizando $\angle ACB = 90^\circ$ con $AC^2 + BC^2 = AB^2$.


  ![Síntesis de ángulo en semicircunferencia recto](/static/img/nodos/angulo-inscrito-en-una-semicircunferencia-como-angulo-recto-resumen.svg)

  '
