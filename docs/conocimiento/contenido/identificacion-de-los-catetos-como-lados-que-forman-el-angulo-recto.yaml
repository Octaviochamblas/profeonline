semantic_id: MAT.GEO.TRIANGULOS_RECTANGULOS.CATETOS
resumen_inicial: Los catetos son los dos lados de un triángulo rectángulo que concurren
  en el vértice del ángulo recto (90°), siendo perpendiculares entre sí y sirviendo
  como base y altura recíprocas.
explicacion_simple: '![Catetos](/static/img/nodos/identificacion-de-los-catetos-como-lados-que-forman-el-angulo-recto-intro.svg)


  Los **catetos** son los dos lados perpendiculares que se juntan para **formar la
  esquina cuadrada de $90^\circ$** (como los dos bordes de un marco o de una pared).
  Como son perpendiculares entre sí, uno sirve de base y el otro de altura, permitiendo
  calcular el área muy fácil: multiplicas los dos catetos y divides por dos.'
explicacion_formal: '### Definición formal

  En un triángulo rectángulo $\Delta ABC$ con ángulo recto en el vértice $C$ ($\gamma
  = 90^\circ$), los **catetos** son los dos lados perpendiculares entre sí que concurren
  en dicho vértice recto:


  $$\operatorname{Catetos}(\Delta ABC) = \{\overline{AC}, \overline{BC}\} = \{b, a\}
  \quad \text{donde} \quad \overline{AC} \perp \overline{BC}$$


  ### Desglose simbólico y geométrico

  - $a = BC$: Cateto opuesto a $\alpha$ (y adyacente a $\beta$).

  - $b = AC$: Cateto opuesto a $\beta$ (y adyacente a $\alpha$).

  - Alturas directas: Cada cateto actúa como la altura relativa respecto al otro cateto
  tomado como base: $h_a = b$ y $h_b = a$.

  - Área directa: $\operatorname{Área}(\Delta ABC) = \frac{a \cdot b}{2}$.


  ### Síntesis didáctica

  Los catetos constituyen la base y la altura naturales del triángulo rectángulo,
  permitiendo calcular su área y definir las razones trigonométricas fundamentales.'
definiciones_clave: '- **Catetos**: Los dos lados perpendiculares que forman el ángulo
  de $90^\circ$.

  - **Perpendicularidad**: Condición $\overline{AB} \perp \overline{AC}$ con producto
  escalar nulo.

  - **Área por catetos**: $A = \frac{\text{cateto}_1 \cdot \text{cateto}_2}{2}$. '
propiedades_relaciones: '- **Despeje de cateto**: Conociendo la hipotenusa $a$ y un
  cateto $b$, el otro cateto se calcula como $c = \sqrt{a^2 - b^2}$.

  - **Catetos en triángulo rectángulo isósceles**: Si los catetos son iguales ($b
  = c = L$), la hipotenusa es $a = L\sqrt{2}$ y los ángulos agudos miden $45^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Catetos](/static/img/nodos/identificacion-de-los-catetos-como-lados-que-forman-el-angulo-recto-ejemplos.svg)


    En un triángulo rectángulo, los catetos miden $9\text{ cm}$ y $12\text{ cm}$.
    Calcula el área del triángulo y la longitud de su hipotenusa.'
  pasos:
  - 'Paso 1: Identificar los catetos: $b = 9\text{ cm}$ y $c = 12\text{ cm}$.'
  - 'Paso 2: Calcular el área multiplicando los catetos y dividiendo entre 2: $A =
    \frac{9 \times 12}{2} = \frac{108}{2} = 54\text{ cm}^2$.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras para hallar la hipotenusa: $a^2 = 9^2
    + 12^2 = 81 + 144 = 225$.'
  - 'Paso 4: Extraer la raíz cuadrada: $a = \sqrt{225} = 15\text{ cm}$.'
  - 'Paso 5: Concluir que el área es $54\text{ cm}^2$ y la hipotenusa mide $15\text{
    cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué característica define a los catetos en un triángulo rectángulo?
  choices:
  - text: Son los dos lados que forman el ángulo recto de 90° (perpendiculares entre
      sí)
    is_correct: true
  - text: Son los dos lados opuestos al ángulo recto
    is_correct: false
  - text: Son los lados de mayor longitud
    is_correct: false
  - text: Son dos lados que suman 180 cm
    is_correct: false
  explanation: Por definición geométrica, los catetos son los dos lados que forman
    el ángulo recto de 90° (perpendiculares entre sí).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el área de un triángulo rectángulo cuyos catetos miden 7 cm y
    10 cm?
  choices:
  - text: 35 cm^2 (porque (7 x 10) / 2 = 35)
    is_correct: true
  - text: 70 cm^2
    is_correct: false
  - text: 17 cm^2
    is_correct: false
  - text: 34 cm^2
    is_correct: false
  explanation: Multiplicando los catetos y dividiendo por 2 se obtiene 35 cm^2 (porque
    (7 x 10) / 2 = 35).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el ángulo de $90^\circ$.'
- 'Paso 2: Identificar los dos segmentos que se unen para formarlo (catetos).'
- 'Paso 3: Para calcular el área, multiplicar ambos catetos y dividir el resultado
  por 2.'
- 'Paso 4: Para calcular la hipotenusa, sumar los cuadrados de ambos catetos y extraer
  la raíz.'
errores_correccion: 'No uses la hipotenusa como base o altura simple en la fórmula
  de área: los dos lados a multiplicar son estrictamente los dos catetos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo rectángulo un cateto mide $8\text{ cm}$ y la hipotenusa
    mide $10\text{ cm}$, ¿cuánto mide el otro cateto?
  alternativas:
  - $6\text{ cm}$
  - $2\text{ cm}$
  - $\sqrt{164}\text{ cm}$
  respuesta: $6\text{ cm}$
  solucion_pasos:
  - $\text{Cateto} = \sqrt{10^2 - 8^2} = \sqrt{100 - 64} = \sqrt{36} = 6\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿Por qué en un triángulo rectángulo no es necesario trazar una altura
    auxiliar para calcular su área?
  alternativas:
  - Porque uno de los catetos ya es la altura perpendicular respecto al otro cateto
  - Porque todos los triángulos rectángulos tienen área 100
  - Porque la hipotenusa es la altura
  respuesta: Porque uno de los catetos ya es la altura perpendicular respecto al otro
    cateto
  solucion_pasos:
  - Al ser perpendiculares ($90^\circ$), cada cateto actúa directamente como altura
    del otro.
- titulo: ¿Los catetos son perpendiculares entre sí en todo triángulo rectángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, forman exactamente el ángulo de 90°.
- titulo: ¿Un cateto puede ser más largo que la hipotenusa?
  respuesta: 'No'
  solucion_pasos:
  - No, la hipotenusa es estrictamente el lado mayor.
errores_frecuentes:
- Usar la hipotenusa en lugar de un cateto para calcular el área.
- Sumar los cuadrados de la hipotenusa y el cateto al buscar el otro cateto en vez
  de restarlos.
- Olvidar dividir por 2 en la fórmula del área.
- Confundir catetos con medianas.
- Pensar que los catetos siempre deben ser de distinta medida (en el triángulo rectángulo
  isósceles son iguales).
afirmaciones_verdaderas:
- Los catetos son los dos lados perpendiculares que forman el ángulo recto de $90^\circ$.
- El área de un triángulo rectángulo es igual al semiproducto de sus catetos ($A =
  \frac{a \cdot b}{2}$).
al_terminar_debes_poder: '**QUÉ:** Identificar los catetos de un triángulo rectángulo
  y utilizarlos para cálculos métricos.


  **CÓMO:** Reconociendo los lados perpendiculares al ángulo de $90^\circ$, aplicando
  $A = \frac{a \cdot b}{2}$ y $b = \sqrt{c^2 - a^2}$.


  ![Resumen de Catetos](/static/img/nodos/identificacion-de-los-catetos-como-lados-que-forman-el-angulo-recto-resumen.svg)'
