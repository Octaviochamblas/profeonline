semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.RAZON_SEMEJANZA_CALCULO
resumen_inicial: 'El cálculo de la razón de semejanza consiste en identificar un par de lados homólogos con medidas conocidas en ambas figuras y calcular su cociente simplificado $k = \frac{L_2}{L_1}$.'
explicacion_simple: |
  ![Cálculo de la Razón de Semejanza entre Lados Homólogos](/static/img/nodos/calculo-de-la-razon-de-semejanza-entre-lados-homologos-intro.svg)

  Tomas un lado de la segunda figura y lo divides por el mismo lado de la primera figura.
explicacion_formal: |
  ### Algoritmo formal de cálculo
  Dadas dos figuras semejantes $P_1$ y $P_2$:

  1. **Seleccionar un par de vértices homólogos**: $A, B \in P_1$ y $A', B' \in P_2$.
  2. **Evaluar el cociente lineal**:
     $$k = \frac{\|\overline{A'B'}\|}{\|\overline{AB}\|}$$
  3. **Reducción algebraica**: Si $k = \frac{p}{q}$ con $p, q \in \mathbb{N}$, simplificar a $\gcd(p, q) = 1$.

  ### Desglose simbólico y geométrico
  - Validación cruzada: Verificar con un segundo par homólogo $C, D$: $k' = \frac{\|\overline{C'D'}\|}{\|\overline{CD}\|}$. Si $k = k'$, la razón queda formalmente confirmada.

  ### Síntesis didáctica
  Siempre verificar la correspondencia angular de los extremos antes de dividir longitudes.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Cálculo de la Razón de Semejanza entre Lados Homólogos](/static/img/nodos/calculo-de-la-razon-de-semejanza-entre-lados-homologos-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Si un triángulo tiene un lado de 15 cm y su homólogo en otro semejante mide 5 cm, ¿cuál es la razón de semejanza del primero respecto al segundo?'
  choices:
  - text: '$k = 3$'
    is_correct: true
  - text: Opción distractora de prueba A
    is_correct: false
  - text: Opción distractora de prueba B
    is_correct: false
  - text: Opción distractora de prueba C
    is_correct: false
  explanation: 'La razón es $k = 3$, ya que $\frac{15}{5} = 3$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Si un segmento de 8 m se representa en un plano por 4 cm, ¿cuál es la razón en escala (ambas en cm)?'
  choices:
  - text: '$k = \frac{4}{800} = \frac{1}{200}$'
    is_correct: true
  - text: Opción distractora secundaria 1
    is_correct: false
  - text: Opción distractora secundaria 2
    is_correct: false
  - text: Opción distractora secundaria 3
    is_correct: false
  explanation: 'La razón es $k = \frac{4}{800} = \frac{1}{200}$ (convirtiendo 8 m a 800 cm).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar el criterio de semejanza aplicable (AA, LLL o LAL).'
- 'Paso 2: Emparejar los elementos homólogos respetando la correspondencia angular.'
- 'Paso 3: Formular la igualdad de razones $\frac{L_1^\prime}{L_1} = \frac{L_2^\prime}{L_2} = k$.'
- 'Paso 4: Multiplicar por $k$ (longitudes), $k^2$ (áreas) o $k^3$ (volúmenes).'
- 'Paso 5: Comprobar la coherencia del resultado con la escala de ampliación o reducción.'
errores_correccion: 'Recuerda que para figuras de 4 o más lados no basta con tener los mismos ángulos: se deben verificar obligatoriamente tanto ángulos iguales como lados proporcionales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor correspondiente calculado mediante las propiedades de semejanza?
  alternativas:
  - '$k = \frac{4}{800} = \frac{1}{200}$'
  - 'Valor alternativo no equivalente 1'
  - 'Valor alternativo no equivalente 2'
  respuesta: '$k = \frac{4}{800} = \frac{1}{200}$'
  solucion_pasos:
  - 'La razón es $k = \frac{4}{800} = \frac{1}{200}$ (convirtiendo 8 m a 800 cm).'
- titulo: Ejemplo 2
  enunciado: Si una figura se amplía al triple (k = 3), ¿por cuánto se multiplica su área?
  alternativas:
  - Se multiplica por 9 ($3^2 = 9$)
  - Se multiplica por 3
  - Se multiplica por 27
  respuesta: Se multiplica por 9 ($3^2 = 9$)
  solucion_pasos:
  - 'El área es una magnitud bidimensional que escala con el cuadrado de la razón de semejanza: $k^2 = 3^2 = 9$.'
- titulo: ¿Dos triángulos con dos ángulos respectivamente iguales son siempre semejantes?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por el Criterio AA (Ángulo-Ángulo), dos ángulos congruentes garantizan automáticamente la semejanza total de los triángulos.'
- titulo: ¿Un cuadrado y un rectángulo son siempre semejantes por tener ángulos de 90°?
  respuesta: 'No'
  solucion_pasos:
  - 'No, porque para polígonos de 4 o más lados se requiere además que sus lados homólogos sean proporcionales, lo que no ocurre entre un cuadrado y un rectángulo general.'
errores_frecuentes:
- 'Multiplicar el área por k en lugar de k² al cambiar de escala.'
- 'Multiplicar el volumen por k en lugar de k³ al ampliar un sólido.'
- 'Afirmar que dos polígonos de 4 o más lados son semejantes solo porque tienen los mismos ángulos.'
- 'Invertir el orden de los lados al plantear la razón de semejanza.'
- 'Modificar la medida de los ángulos al aplicar un factor de escala k.'
afirmaciones_verdaderas:
- 'Dos triángulos con dos ángulos congruentes son semejantes (Criterio AA).'
- 'La razón entre las áreas de figuras semejantes es igual al cuadrado de la razón de lados (k²).'
- 'La razón entre los volúmenes de cuerpos semejantes es igual al cubo de la razón de lados (k³).'
al_terminar_debes_poder: |
  **QUÉ:** Comprender, demostrar y aplicar la semejanza de triángulos y polígonos, escalas, modelos de perspectiva y razones de perímetros, áreas y volúmenes.

  **CÓMO:** Utilizando los criterios AA, LLL y LAL, resolviendo ecuaciones de proporcionalidad y aplicando las razones de escala $k$, $k^2$ y $k^3$.

