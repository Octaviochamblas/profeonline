semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.FRACCION_PARTE_TODO
resumen_inicial: "Una fracción representa la relación entre las partes iguales que tomamos y el número total de partes en que se dividió un entero."
explicacion_simple: |
  Imagina que compras una barra de chocolate y la cortas en 4 pedazos exactamente iguales. Si te comes 3 pedazos, te has comido tres cuartas partes de la barra. La fracción nos dice de forma simple dos cosas: en cuántos pedazos iguales dividiste el objeto original y cuántos de esos pedazos tomaste. La clave absoluta es que todos los pedazos deben medir exactamente lo mismo; si cortas partes grandes y chicas, la fracción pierde su sentido.
explicacion_formal: |
  Formalmente, en la interpretación parte-todo, un objeto o cantidad considerada como la unidad (el entero $1$) se divide en $b$ partes congruentes o equivalentes ($b \in \mathbb{Z}^+$). Si se seleccionan o consideran $a$ de esas partes ($a \in \mathbb{Z}_{\ge 0}$), la cantidad resultante se expresa mediante el símbolo racional $\frac{a}{b}$.

  El entero se representa como $\frac{b}{b} = 1$. Si $a < b$, la fracción representa una porción menor que la unidad; si $a = b$, representa la unidad completa; y si $a > b$, representa una cantidad mayor a un entero (requiriendo más de una unidad dividida de igual forma).
definiciones_clave: |
  - **Entero o Unidad**: Objeto o cantidad completa que se toma como referencia de partida y equivale al valor $1$.
  - **Partes congruentes**: Divisiones de la unidad que poseen exactamente el mismo tamaño, área, masa o cantidad de elementos.
  - **Relación parte-todo**: Comparación cuantitativa de la cantidad de partes seleccionadas ($a$) respecto al número total de partes congruentes ($b$).
propiedades_relaciones: |
  - **Conservación de la unidad**: La suma de todas las partes individuales $\frac{1}{b}$ agrupadas de $b$ en $b$ reconstruye el entero original ($\sum_{i=1}^b \frac{1}{b} = \frac{b}{b} = 1$).
  - **Condición de congruencia**: La interpretación exige división equitativa; si las partes no son iguales, la porción no puede expresarse como $\frac{a}{b}$.
  - **Extensión a conjuntos**: La unidad no siempre es un objeto continuo (como una barra o pizza), también puede ser un grupo discreto de elementos (ejemplo: $3$ manzanas de un total de $8$ manzanas iguales).
ejemplo_guiado:
  enunciado: "En un cumpleaños se divide una torta circular en $12$ porciones del mismo tamaño. Si los invitados consumen $7$ porciones, representa numéricamente la fracción de torta consumida y la fracción de torta que queda."
  pasos:
    - "Identificar el total de partes iguales en que se dividió el entero: $b = 12$ porciones iguales."
    - 'Identificar las partes consideradas para el consumo: $a = 7$ porciones. Por lo tanto, la fracción consumida es $\frac{7}{12}$.'
    - "Calcular las porciones restantes restando del total: $12 - 7 = 5$ porciones no consumidas."
    - 'Expresar la fracción restante respecto al entero original: la torta sobrante corresponde a $\frac{5}{12}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la condición indispensable que debe cumplir un entero al dividirse para poder representar una de sus porciones como la fracción $\\frac{a}{b}$?"
    choices:
      - {text: "Las partes en que se divide el entero deben ser exactamente de igual tamaño o congruentes.", is_correct: true}
      - {text: "El número de partes divididas debe ser siempre un número par.", is_correct: false}
      - {text: "Las partes tomadas deben ser mayores que el total de partes divididas.", is_correct: false}
      - {text: "El entero debe ser siempre un objeto geométrico circular.", is_correct: false}
    explanation: "La correcta es Las partes en que se divide el entero deben ser exactamente de igual tamaño o congruentes.: la relación parte-todo requiere equidad en la división para que la medida de cada parte sea uniforme."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si una caja contiene $20$ chocolates iguales y se regalan $9$, ¿qué fracción de la caja de chocolates queda aún sin regalar?"
    choices:
      - {text: '\$\frac{11}{20}$', is_correct: true}
      - {text: '\$\frac{9}{20}$', is_correct: false}
      - {text: '\$\frac{9}{11}$', is_correct: false}
      - {text: '\$\frac{20}{9}$', is_correct: false}
    explanation: "La correcta es \\frac{11}{20}: se restan $20 - 9 = 11$ chocolates restantes respecto al total de $20$ partes iguales de la caja."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el entero u objeto de referencia y verificar que esté dividido en partes congruentes (de igual tamaño)."
  - "Paso 2: Contar el número total de divisiones congruentes que componen la unidad."
  - "Paso 3: Contar cuántas de esas divisiones se están seleccionando o considerando."
  - 'Paso 4: Escribir la expresión $\frac{\text{partes consideradas}}{\text{total de partes congruentes}}$.'
errores_correccion: |
  El error más frecuente es contar partes de distinto tamaño como si fueran iguales (por ejemplo, dividir una figura en 3 trozos desiguales y decir que uno es $\frac{1}{3}$). Para evitarlo, comprueba siempre la congruencia o equivalencia de las partes antes de armar la fracción.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Una ventana está dividida en 6 vidrios cuadrados iguales. Si 2 de los vidrios se rompieron, ¿qué fracción de los vidrios de la ventana permanece intacta?"
    alternativas:
      - '\$\frac{4}{6}$'
      - '\$\frac{2}{6}$'
      - '\$\frac{4}{2}$'
    respuesta: '\$\frac{4}{6}$'
    solucion_pasos:
      - "El total de partes iguales en que se divide la ventana es 6."
      - "Los vidrios intactos son $6 - 2 = 4$."
      - 'La fracción de vidrios intactos sobre el total es $\frac{4}{6}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Un terreno rectangular se divide en 10 franjas de igual área para sembrar hortalizas. Si se siembran lechugas en 3 franjas y tomates en 4 franjas, ¿qué fracción del terreno está sembrada en total?"
    alternativas:
      - '\$\frac{7}{10}$'
      - '\$\frac{3}{10}$'
      - '\$\frac{7}{3}$'
    respuesta: '\$\frac{7}{10}$'
    solucion_pasos:
      - "Se suman las franjas sembradas: $3 + 4 = 7$ franjas sembradas."
      - 'Dado que el terreno total equivale a 10 franjas iguales, la fracción sembrada es $\frac{7}{10}$.'
  - titulo: "¿Es posible representar con la fracción $\\frac{2}{5}$ una figura dividida en 5 partes donde 2 son más grandes que las otras 3?"
    respuesta: "No"
    solucion_pasos:
      - "No es posible, porque la representación en fracción exige que las 5 partes en que se divida el entero tengan exactamente el mismo tamaño."
  - titulo: "¿Se mantiene el concepto parte-todo si la unidad de referencia es un grupo discreto de objetos iguales como un paquete de galletas?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, el entero puede ser un conjunto discreto formado por elementos individuales de igual valor cuantitativo."
errores_frecuentes:
  - "Asumir que cualquier división de un objeto permite formar una fracción sin importar si los trozos tienen distinto tamaño."
  - "Confundir la cantidad de partes sobrantes con el total de partes al armar el denominador."
  - "Creer que la interpretación parte-todo solo aplica a objetos individuales continuos y no a colecciones o grupos de objetos."
  - "Sumar los trozos considerados y los trozos sobrantes para usarlos como denominador en lugar de usar el total del entero."
  - "Considerar que una fracción representa una cantidad fija de masa o volumen sin depender de la unidad de referencia elegida."
afirmaciones_verdaderas:
  - "En la interpretación parte-todo, el entero debe dividirse obligatoriamente en partes de igual medida o equivalentes."
  - "Si se toman todas las partes congruentes en que se dividió el entero, la fracción resultante es equivalente a la unidad ($1$)."
al_terminar_debes_poder: |
  Debes ser capaz de interpretar y expresar cualquier porción de una unidad continua o discreta como una fracción $\frac{a}{b}$, verificando la condición fundamental de división en partes iguales.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
