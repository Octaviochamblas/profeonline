semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.FRACCION_PARTE_TODO
resumen_inicial: La fracción $\frac{a}{b}$ como parte-todo expresa la relación entre $a$ partes consideradas y las $b$ partes iguales en que se ha dividido la unidad.
explicacion_simple: 'Una fracción en su modelo de parte-todo nos permite representar numéricamente una porción de una unidad entera que ha sido dividida en trozos exactamente iguales. El número de abajo indica en cuántos trozos iguales se cortó la totalidad, mientras que el número de arriba señala cuántos de esos trozos estamos considerando o tomando.


  ![Interpretación de fracción como parte de un todo](/static/img/nodos/interpretacion-de-fraccion-como-parte-de-un-todo-intro.svg)'
explicacion_formal: 'Para un objeto o conjunto continuo $U$ de medida $1$, la **Modelación Racional Parte-Todo** asigna a la subdivisión en $b \in \mathbb{N}$ partes congruentes $u_i$ con $\mu(u_i) = \frac{1}{b}$ la medida acumulada:


  $$\mu(A) = \sum_{i=1}^a \mu(u_i) = a \cdot \left(\frac{1}{b}\right) = \frac{a}{b}$$


  **Desglose de la fórmula:**

  - $b$: Denominador que representa el número total de particiones congruentes (de igual medida) de la unidad $U$.

  - $a$: Numerador que representa la cantidad discreta de particiones agrupadas en la región $A$.

  - $\frac{1}{b}$: Medida individual de cada unidad fraccionaria básica.


  > **Complemento didáctico:** La condición estricta del modelo parte-todo exige que las $b$ partes en que se divide el todo sean exactamente **congruentes** (de igual tamaño o superficie).'
definiciones_clave: '- **Relación parte-todo**: Interpretación geométrica y aritmética de la fracción como porción de una unidad homogénea.

  - **Partición congruente**: División del todo en partes de exactamente la misma medida o área.'
propiedades_relaciones: '- **Conservación de la unidad**: La suma de todas las $b$ partes de tamaño $\frac{1}{b}$ reconstruye la unidad completa ($b \cdot \frac{1}{b} = 1$).'
ejemplo_guiado:
  enunciado: 'Una pizza circular se divide en $8$ rebanadas exactamente iguales. Si una persona come $3$ rebanadas, exprese la porción consumida y la porción sobrante como fracciones.


    ![Ejemplo Interpretación de fracción como parte de un todo](/static/img/nodos/interpretacion-de-fraccion-como-parte-de-un-todo-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el número total de particiones congruentes del todo: $b = 8$ (denominador).'
  - 'Paso 2: Expresar la porción consumida considerando $3$ rebanadas: $\frac{3}{8}$.'
  - 'Paso 3: Calcular las rebanadas sobrantes: $8 - 3 = 5$ rebanadas.'
  - 'Paso 4: Expresar la porción sobrante: $\frac{5}{8}$.'
  - 'Conclusión: La porción consumida es $\frac{3}{8}$ y la sobrante es $\frac{5}{8}$ de la pizza.'
checkpoints:
- placement: after_explicacion_formal
  question: En el modelo parte-todo de una fracción a/b, ¿qué condición deben cumplir las b partes en que se divide el entero?
  choices:
  - text: Deben ser de exactamente la misma medida o tamaño (congruentes)
    is_correct: true
  - text: Deben ser de diferentes tamaños
    is_correct: false
  - text: Deben ser números primos
    is_correct: false
  - text: Deben sumar cero
    is_correct: false
  explanation: La alternativa correcta es 'Deben ser de exactamente la misma medida o tamaño (congruentes)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de la pizza dividida en 8 partes de las cuales se comen 3, ¿qué fracción representa lo que sobra?
  choices:
  - text: 5/8
    is_correct: true
  - text: 3/8
    is_correct: false
  - text: 8/3
    is_correct: false
  - text: 3/5
    is_correct: false
  explanation: La alternativa correcta es '5/8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Contar la cantidad de partes congruentes (iguales) en las que está dividida la unidad (denominador).'
- 'Paso 2: Contar la cantidad de partes que se seleccionan, pintan o consideran (numerador).'
- 'Paso 3: Escribir la fracción colocando la cantidad seleccionada arriba y el total de partes abajo.'
errores_correccion: '- **Error 1: Dividir una figura en partes de distinto tamaño y armar la fracción.** **Cómo corregirlo:** La fracción exige que las particiones sean estrictamente DE IGUAL TAMAÑO (congruentes).


  - **Error 2: Invertir el numerador y el denominador al escribir la fracción.** **Cómo corregirlo:** Las partes tomadas van SIEMPRE en el numerador (arriba) y el total de partes en el denominador (abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Un chocolate rectangular se divide en 5 trozos iguales y me como 2. ¿Qué fracción me comí?
  alternativas:
  - 2/5
  - 5/2
  - 3/5
  respuesta: 2/5
  solucion_pasos:
  - 'Total de trozos iguales: 5 (denominador). Trozos comidos: 2 (numerador). Fracción: 2/5.'
- titulo: Ejemplo 2
  enunciado: Si un estanque tiene 3/4 de su capacidad con agua, ¿qué fracción del estanque falta por llenar?
  alternativas:
  - 1/4
  - 3/4
  - 4/3
  respuesta: 1/4
  solucion_pasos:
  - 'Unidad entera $= 4/4$. Falta por llenar: $4/4 - 3/4 = 1/4$.'
- titulo: ¿Representa 3/5 a tres partes tomadas de un total de cinco partes iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición exacta del modelo parte-todo.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la interpretación y cálculo analizado.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la identificación analítica de términos y modelos fraccionarios arroja una respuesta única y precisa.
  - texto: No es posible representarlo como fracción
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del ejercicio permiten modelar y extraer el numerador y denominador con exactitud.
- titulo: ¿Se puede usar el modelo parte-todo si las partes cortadas son de distinto tamaño?
  respuesta: 'No'
  solucion_pasos:
  - No, el modelo requiere que todas las particiones sean congruentes (igual medida).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la interpretación y cálculo analizado.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la identificación analítica de términos y modelos fraccionarios arroja una respuesta única y precisa.
  - texto: No es posible representarlo como fracción
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del ejercicio permiten modelar y extraer el numerador y denominador con exactitud.
errores_frecuentes:
- El modelo parte-todo permite que las partes en que se divide la unidad sean de diferentes dimensiones.
- En la fracción $a/b$, el número $a$ representa el total de partes y $b$ las partes tomadas.
- Dividir un círculo en 4 sectores desiguales genera cuartos válidos en la notación de fracciones.
- La suma de la porción consumida y la porción restante de un objeto es siempre mayor que 1.
- Una fracción propia representa una cantidad mayor que la unidad entera dividida.
afirmaciones_verdaderas:
- La interpretación parte-todo exige que la unidad esté dividida en partes estrictamente congruentes.
- La suma de todas las partes iguales en las que se divide la unidad reconstruye el entero ($b/b = 1$).
al_terminar_debes_poder: '**QUÉ:** Interpretar, representar y modelar fracciones como la relación entre la parte considerada y el todo unitario continuo o discreto.


  **CÓMO:** Verificando la condición de equipartición en $b$ partes congruentes o subconjuntos iguales y cuantificando las $a$ partes sombreadas o seleccionadas mediante la razón $\frac{a}{b}$.


  ![Resumen Interpretación de fracción como parte de un todo](/static/img/nodos/interpretacion-de-fraccion-como-parte-de-un-todo-resumen.svg)'
