semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.ASINTOTA_VERTICAL
resumen_inicial: 'La asíntota vertical de una función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) es la recta del eje $y$ de ecuación $x = 0$.'
explicacion_simple: |
  En una función potencia con exponente negativo como $f(x) = \frac{1}{x}$ o $f(x) = \frac{1}{x^2}$, la recta vertical del eje $y$ (ecuación $x = 0$) funciona como un muro o frontera invisible infranqueable. A medida que elegimos números para $x$ cada vez más cercanos a cero (como $0.01$ o $0.0001$), los resultados de la función explotan volviéndose gigantescos hacia arriba ($+\infty$) o hacia abajo ($-\infty$). La curva bordea infinitamente esta línea vertical sin llegar a tocarla ni cruzarla jamás.
explicacion_formal: |
  ### Definición formal
  La **asíntota vertical en el origen** para la función potencia recíproca $f(x) = a x^{-m} \equiv \frac{a}{x^m}$ con $m \in \mathbb{Z}^+$ y $a \neq 0$ es la recta cartesiana frontera de ecuación:
  $$x = 0 \quad (\text{eje } y)$$
  determinada analíticamente por la divergencia infinita de los límites laterales cuando la variable $x$ tiende a cero:
  $$\lim_{x \to 0^+} |f(x)| = +\infty \quad \text{y/o} \quad \lim_{x \to 0^-} |f(x)| = +\infty$$

  ### Desglose según paridad del exponente $m$
  1. **Exponente Par Negativo ($m = 2k$)**:
     - Límites laterales coincidentes: $\lim_{x \to 0^-} f(x) = \lim_{x \to 0^+} f(x) = \operatorname{sgn}(a) \cdot \infty$.
     - Comportamiento gráfico: Ambas ramas divergen hacia el mismo extremo vertical (forma de volcán).
  2. **Exponente Impar Negativo ($m = 2k+1$)**:
     - Límites laterales opuestos: $\lim_{x \to 0^+} f(x) = \operatorname{sgn}(a) \cdot \infty$ y $\lim_{x \to 0^-} f(x) = -\operatorname{sgn}(a) \cdot \infty$.
     - Comportamiento gráfico: Una rama se dispara a $+\infty$ y la otra cae a $-\infty$ (forma hiperbólica).

  ### Síntesis didáctica
  Identificación de asíntotas verticales: La asíntota vertical se encuentra evaluando la raíz del denominador $x^m = 0 \implies x = 0$.
definiciones_clave: |
  - **Asíntota vertical $x = 0$**: Recta vertical hacia la que converge el comportamiento límite infinito de la función.
  - **Límites laterales divergentes**: Acercamiento por la izquierda ($x \to 0^-$) o por la derecha ($x \to 0^+$) donde las salidas explotan a $\pm\infty$.
  - **Línea frontera infranqueable**: Propiedad de la recta $x = 0$ de no poseer ningún punto de contacto con la curva.
propiedades_relaciones: |
  - **Unicidad de la asíntota vertical**: Las funciones potencia no trasladadas poseen exactamente una asíntota vertical en $x = 0$.
  - **Efecto de traslaciones horizontales**: Si se traslada la función $f(x) = a(x - h)^{-m}$, la asíntota vertical se desplaza a la recta $x = h$.
ejemplo_guiado:
  enunciado: 'Identifica la asíntota vertical y describe el comportamiento límite a la izquierda y derecha de $x = 0$ para las funciones potencia: A) $f(x) = \frac{4}{x^2}$, B) $g(x) = \frac{4}{x^3}$.'
  pasos:
    - 'Paso 1: Para $f(x) = \frac{4}{x^2}$, el denominador se anula en $x = 0$. La asíntota vertical es la recta $x = 0$ (eje $y$).'
    - 'Paso 2: Como $n = -2$ es par y $a = 4 > 0$, $\lim_{x \to 0^+} f(x) = +\infty$ y $\lim_{x \to 0^-} f(x) = +\infty$. Ambas ramas suben a $+\infty$.'
    - 'Paso 3: Para $g(x) = \frac{4}{x^3}$, la asíntota vertical es la recta $x = 0$ (eje $y$).'
    - 'Paso 4: Como $n = -3$ es impar y $a = 4 > 0$, por la derecha $\lim_{x \to 0^+} g(x) = +\infty$, y por la izquierda $\lim_{x \to 0^-} g(x) = -\infty$. Las ramas toman direcciones opuestas.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación cartesiana de la asíntota vertical de la función potencia recíproca $f(x) = -3x^{-4} = \frac{-3}{x^4}$?'
    choices:
      - {text: 'La recta vertical de ecuación $x = 0$ (el eje $y$)', is_correct: true}
      - {text: 'La recta horizontal de ecuación $y = 0$ (el eje $x$)', is_correct: false}
      - {text: 'La recta vertical de ecuación $x = -3$', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = -4$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = 0$ (el eje $y$)''. La asíntota vertical se ubica en el valor de $x$ que anula el denominador.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con los valores de salida de la función $f(x) = \frac{1}{x}$ a medida que $x$ toma valores positivos cada vez más cercanos a cero ($x \to 0^+$)?'
    choices:
      - {text: 'Los valores de salida explotan creciendo de forma ilimitada hacia $+\infty$', is_correct: true}
      - {text: 'Los valores de salida se aproxima a cero', is_correct: false}
      - {text: 'Los valores de salida se mantienen constantes en $y = 1$', is_correct: false}
      - {text: 'Los valores de salida caen hacia $-\infty$', is_correct: false}
    explanation: 'La alternativa correcta es ''Los valores de salida explotan creciendo de forma ilimitada hacia $+\infty$''. Al dividir 1 por números positivos minúsculos (ej: $0.0001$), el resultado es $+10000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que la función sea una potencia de exponente negativo $f(x) = a x^{-m} = \frac{a}{x^m}$.'
  - 'Paso 2: Igualar el denominador a cero para hallar el valor crítico $x^m = 0 \implies x = 0$.'
  - 'Paso 3: Declarar la ecuación de la asíntota vertical como la recta $x = 0$ (eje $y$).'
  - 'Paso 4: Analizar la paridad del exponente para determinar si las ramas divergen al mismo infinito (par) o a infinitos opuestos (impar).'
errores_correccion: |
  - **Error 1:** Confundir la asíntota vertical $x = 0$ con la asíntota horizontal $y = 0$. **Cómo corregirlo:** La asíntota **vertical** es una recta erguida de la forma $x = c$ que corta al eje $x$ en $c = 0$. La asíntota **horizontal** es una recta acostada de la forma $y = k$.
  - **Error 2:** Creer que las funciones potencia de exponente positivo también tienen asíntota vertical. **Cómo corregirlo:** Las asíntotas verticales sólo existen en funciones potencia de exponente **negativo** ($n < 0$), donde la variable queda en el denominador.
ejemplos:
  - titulo: 'Asíntota vertical en hipérbola mónicas'
    enunciado: '¿Cuál es la asíntota vertical de $f(x) = x^{-1}$?'
    alternativas:
      - 'La recta $x = 0$'
      - 'La recta $y = 0$'
      - 'La recta $x = 1$'
    respuesta: 'La recta $x = 0$'
    solucion_pasos:
      - '1. Es la función $f(x) = \frac{1}{x}$.'
      - '2. Su asíntota vertical es el eje $y$, de ecuación cartesiana $x = 0$.'
  - titulo: 'Asíntota vertical con coeficiente decimal'
    enunciado: '¿La función $g(x) = 0.5 x^{-3}$ tiene asíntota vertical en $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El denominador se anula en $x = 0$, definiendo la asíntota vertical $x = 0$.'
  - titulo: 'Límites coincidentes en par negativo'
    enunciado: 'Para $h(x) = x^{-2}$, ¿los límites por la izquierda y derecha en $x \to 0$ son $+\infty$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En potencias pares negativas con $a > 0$, ambas ramas divergen a $+\infty$.'
  - titulo: 'Invariancia por el parámetro a'
    enunciado: '¿Cambiar $a = 2$ por $a = -50$ modifica la posición de la asíntota vertical $x = 0$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La asíntota vertical permanece inalterada en la recta $x = 0$.'
errores_frecuentes:
  - 'La asíntota vertical de la función potencia $f(x) = x^{-2}$ es la recta horizontal $y = 0$.'
  - 'Las funciones potencia de exponente positivo $n > 0$ poseen asíntotas verticales en $x = 0$.'
  - 'La curva de la función $f(x) = \frac{1}{x}$ cruza su asíntota vertical en el origen $(0, 0)$.'
  - 'La asíntota vertical de $f(x) = 4x^{-3}$ se ubica en la recta $x = 4$.'
  - 'Para exponente par negativo, una rama sube a $+\infty$ y la otra cae a $-\infty$.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) posee una asíntota vertical en la recta $x = 0$ (el eje $y$).'
  - 'Al aproximarse a la asíntota vertical $x = 0$, la gráfica diverge hacia $\pm\infty$ bordeando la recta vertical sin llegar a tocarla.'
