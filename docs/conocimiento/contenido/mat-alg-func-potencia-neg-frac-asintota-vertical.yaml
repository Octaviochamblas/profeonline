  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica que el dominio de $f(x)=a\cdot x^{-n}$ excluye $x=0$.'
- 'Paso 2: Evalúa la función con valores de $x$ cada vez más cercanos a $0$.'
- 'Paso 3: Observa que los valores de $|f(x)|$ crecen sin cota, señalando la asíntota
  en $x=0$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en identificación de la asíntota vertical x = 0 en funciones potencia
  de exponente negativo.
ejemplos:
- titulo: Comportamiento cerca de la asíntota vertical
  enunciado: Describe qué ocurre con $f(x)=1/x^2$ cuando $x$ se acerca a $0$.
  solucion_pasos:
  - Se evalúan valores decrecientes de $|x|$: $0{,}1$, $0{,}01$, $0{,}001$.
  - Los resultados $100$, $10\,000$, $1\,000\,000$ crecen sin límite.
- titulo: Identificación de la ecuación de la asíntota vertical
  enunciado: ¿Cuál es la ecuación de la asíntota vertical de $f(x)=5x^{-3}$?
  solucion_pasos:
  - El dominio de cualquier función con exponente negativo excluye $x=0$.
  - La asíntota vertical es siempre la recta $x=0$, sin importar el coeficiente ni
    el exponente.
- titulo: ¿La función con exponente negativo cruza su asíntota vertical?
  enunciado: ¿La gráfica de $f(x)=a\cdot x^{-n}$ llega a tocar la recta $x=0$?
  respuesta: 'No'
  solucion_pasos:
  - $x=0$ no pertenece al dominio de la función.
- titulo: ¿La asíntota vertical depende del exponente $n$?
  enunciado: ¿La posición de la asíntota vertical cambia según el valor del exponente
    $n$?
  respuesta: 'No'
  solucion_pasos:
  - Para cualquier exponente negativo entero, la asíntota vertical siempre es $x=0$.
errores_frecuentes:
- Declarar la asíntota vertical con la asíntota horizontal de esta misma función.
- Afirmar que la gráfica puede tocar el eje $y$ para valores muy pequeños de $x$.
- Declarar que la posición de la asíntota depende del exponente o del coeficiente.
- Omitir mencionar que la asíntota es vertical al describir la gráfica.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  identificación de la asíntota vertical x = 0 en funciones potencia de exponente
  negativo.
