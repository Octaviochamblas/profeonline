semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.ASINTOTA_VERTICAL
resumen_inicial: 'Identificación de la asíntota vertical x = 0 en funciones potencia
  de exponente negativo: forma general $f(x) = a x^n$, simetría, dominio y recorrido
  en Exponentes negativos y fraccionarios.'
explicacion_simple: Al acercarse a $x=0$, el denominador de la fracción equivalente
  se hace cada vez más pequeño, lo que dispara el valor de la función hacia el infinito.
explicacion_formal: '### Definición formal


  Como $f(x)=a\cdot x^{-n}=a/x^n$, cuando $x\to0$, el denominador $x^n\to0$, así que
  $|f(x)|\to+\infty$. La recta $x=0$ es asíntota vertical, ya que la gráfica se aproxima
  a ella sin cruzarla, tanto por la izquierda como por la derecha.


  ### Desarrollo didáctico


  $f(x)=1/x^2$: para $x=0{,}1$, $f(0{,}1)=100$; para $x=0{,}01$, $f(0{,}01)=10\,000$.
  Mientras más se acerca $x$ a $0$, más grande se vuelve el resultado, confirmando
  la asíntota vertical.'
definiciones_clave: '- **Identificación de la asíntota vertical x = 0 en funciones
  potencia de exponente negativo**: Función de la forma $f(x) = a x^n$ con $a \neq
  0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a identificación de la asíntota vertical x = 0 en funciones
  potencia de exponente negativo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de identificación de la asíntota vertical x = 0 en funciones potencia de exponente
    negativo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de identificación de la
    asíntota vertical x = 0 en funciones potencia de exponente negativo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
