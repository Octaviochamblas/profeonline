semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.DELTOIDE_DIAGONALES
resumen_inicial: 'Propiedad de las diagonales en el deltoide: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: La simetría característica del deltoide se refleja de forma muy
  clara en la relación geométrica entre sus dos diagonales.
explicacion_formal: '![Diagonales perpendiculares en el deltoide](/static/img/geometria/poligonos-cuadrilateros/trapecios-deltoide-diagonales.svg)


  ### Definición formal


  Si $AC$ es la diagonal que actúa como eje de simetría de un deltoide $ABCD$, entonces
  $AC\perp BD$, y además $AC$ biseca a $BD$ (aunque $BD$ no necesariamente biseca
  a $AC$).


  ### Desarrollo didáctico


  A diferencia del rombo (donde AMBAS diagonales se bisecan mutuamente), en el deltoide
  general solo una de las diagonales (el eje de simetría) biseca a la otra; la relación
  de perpendicularidad, en cambio, sí se cumple siempre entre ambas.'
definiciones_clave: '- **Propiedad de las diagonales en el deltoide**: Elemento o
