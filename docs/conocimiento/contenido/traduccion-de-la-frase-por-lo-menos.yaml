semantic_id: MAT.ALG.LENGUAJE_RELACIONES.POR_LO_MENOS
resumen_inicial: 'Traducción de la frase por lo menos: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Para subir a la montaña rusa debes medir 'por lo menos' 1.50 metros.
  Si mides exacto 1.50m, pasas. Si mides 1.60m, también. Este es el piso mínimo indispensable.
explicacion_formal: '### Definición formal


  Si necesitas ''por lo menos 5 dólares'' para un sándwich, te sirven 5, 10 o 100
  dólares (cantidades mayores o iguales a 5).


  ### Desarrollo didáctico


  Palabras clave que se traducen como $\ge$:

  - Por lo menos

  - Al menos

  - Como mínimo

  - No menos de

  - Desde


  Ejemplos:

  - ''La edad ($E$) requerida es de por lo menos 18 años'': $E \ge 18$

  - ''Como mínimo debes sacar la mitad del puntaje ($P$)'': $Nota \ge \frac{P}{2}$


  Nuevamente, el instinto engaña. Uno lee ''por lo MENOS'' y el cerebro quiere dibujar
  un signo ''menor''. Error. Si te exigen ''por lo menos'' algo, te están exigiendo
  que seas de ese tamaño *hacia arriba* (mayor o igual).'
definiciones_clave: '- **Traducción de la frase por lo menos**: Herramienta clave
  para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de la frase por lo menos.'
