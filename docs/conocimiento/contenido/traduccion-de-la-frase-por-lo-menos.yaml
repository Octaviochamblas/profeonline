procedimiento:
- 'Paso 1: Identifica la variable sujeta a la condición (el sujeto).'
- 'Paso 2: Al leer ''por lo menos'' o ''como mínimo'', escribe el símbolo >= (mayor
  o igual).'
- 'Paso 3: Escribe el valor del umbral mínimo a la derecha del símbolo.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción de la frase por lo menos.
ejemplos:
- titulo: El piso de aprobación
  enunciado: 'Traduce algebraicamente: ''Para aprobar, el estudiante necesita sacar
    no menos de 60 puntos''.'
  solucion_pasos:
  - 'Sujeto: El puntaje del estudiante (P).'
  - 'La frase ''no menos de'' permite sacar 60 exactos, o 70, o 100. Es un piso mínimo:
    >='
  - El umbral es 60.
  - 'Traducción: P >= 60.'
- titulo: Una ley municipal de recolección de agua lluvias exige que 'el volumen del
    estanque de reser
  enunciado: 'Una ley municipal de recolección de agua lluvias exige que ''el volumen
    del estanque de reserva ($V$) sea al menos igual al producto del área del techo
    ($A$) por la precipitación histórica ($P$)''. ¿Cuál inecuación verifica que una
    casa cumple legalmente con la norma? (v1)


    Opciones: A) $V \ge A \cdot P$ · B) $V \le A \cdot P$ · C) $V = A + P$ · D) $V
    > A + P$'
  solucion_pasos:
  - La frase 'al menos' establece la frontera mínima ($\ge$). El límite es el 'producto'
    de A y P ($A \cdot P$). El tanque V debe ser mayor o igual a ese producto.
  - 'Respuesta: $V \ge A \cdot P$'
- titulo: 'Respecto de «Traducción de la frase por lo menos»: ¿Se ajusta a la definición
    esta afirmació'
  enunciado: 'Respecto de «Traducción de la frase por lo menos»: ¿Se ajusta a la definición
    esta afirmación? «La frase **''Por lo menos''** se traduce utilizando el símbolo
    de desigualdad **mayor o igual que ($\ge$)**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La frase **''Por lo menos''**
    se traduce utilizando el símbolo de desigualdad **mayor o igual que ($\ge$)**.'
- titulo: 'Respecto de «Traducción de la frase por lo menos»: ¿Es compatible con el
    procedimiento esta'
  enunciado: 'Respecto de «Traducción de la frase por lo menos»: ¿Es compatible con
    el procedimiento esta afirmación? «Traducir ''por lo menos'' con el símbolo $\le$
    o $<$ (caer en la trampa lingüística de la palabra ''menos'')»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La frase **''Por lo menos''**
    se traduce utilizando el símbolo de desigualdad **mayor o igual que ($\ge$)**.'
errores_frecuentes:
- Traducir 'por lo menos' con el símbolo $\le$ o $<$ (caer en la trampa lingüística
  de la palabra 'menos').
- Traducirlo con el símbolo estricto $>$ (perdiendo el derecho a igualar el piso).
- Porque en álgebra las palabras siempre significan lo contrario que en el lenguaje
  natural.
- Porque es imposible tener variables menores en una inecuación.
- Porque 'por lo menos' siempre se refiere a números negativos.
afirmaciones_verdaderas:
- La traducción de traducción de la frase por lo menos preserva el significado matemático
  del enunciado.
al_terminar_debes_poder: Traducir y evaluar expresiones que involucren traducción
