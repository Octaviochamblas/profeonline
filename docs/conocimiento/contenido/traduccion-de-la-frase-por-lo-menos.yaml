errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir traducción
  de la frase por lo menos.
- Invertir el orden de las variables al construir la expresión de traducción de la
  frase por lo menos.
- Usar una suma cuando el enunciado de traducción de la frase por lo menos exige una
  resta o división.
- Omitir paréntesis al multiplicar expresiones en traducción de la frase por lo menos.
- Declarar que la expresión de traducción de la frase por lo menos es válida sólo
  para números pares.
