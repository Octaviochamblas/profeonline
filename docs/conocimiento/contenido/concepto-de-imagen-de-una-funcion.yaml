semantic_id: MAT.ALG.FUNCION_CONCEPTOS.IMAGEN
resumen_inicial: La imagen de un valor $x$ es el resultado numérico $y = f(x)$ obtenido
  al evaluar la función en dicho punto.
explicacion_simple: 'La **imagen** de un número es la salida producida por la función.

  Si tenemos la función $f(x) = x + 7$ y evaluamos en $x = 3$, calculamos $f(3) =
  3 + 7 = 10$.

  Decimos que **$10$ es la imagen de $3$** bajo la función $f$.'
explicacion_formal: 'Dada una función $f: A \to B$ y un elemento $x_0 \in A$, la **imagen
  de $x_0$** es la evaluación puntual:


  $$y_0 = f(x_0) \in B$$


  **Desglose de la fórmula:**

  - $y_0$: Elemento único del conjunto de llegada asignado al elemento $x_0$ del dominio.'
definiciones_clave: '- **Imagen ($y = f(x)$)**: Valor numérico resultante de evaluar
  la regla funcional en una preimagen determinada.

  - **Conjunto de imágenes**: Subconjunto de salidas que conforman el recorrido de
  la función.'
propiedades_relaciones: '- **Ubicación cartesiana**: Las imágenes corresponden a las
  coordenadas en el eje vertical $Y$.'
ejemplo_guiado:
  enunciado: Calcula la imagen del valor $x = -4$ bajo la función cuadrática $f(x)
    = x^2 + 2x$.
  pasos:
  - 'Paso 1: Reemplazar $x = -4$ en la expresión de la función usando paréntesis:
    $f(-4) = (-4)^2 + 2(-4)$.Paso 2: Calcular la potencia: $(-4)^2 = 16$.Paso 3: Calcular
    el producto: $2(-4) = -8$.Paso 4: Sumar los términos: $f(-4) = 16 - 8 = 8$.Paso
    5: Concluir que la imagen de $-4$ es $y = 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $f(x) = x^2 + 2x$ en $x = -4$, ¿cuál es la imagen obtenida?
  choices:
  - text: $y = 8$
    is_correct: true
  - text: $y = 24$
    is_correct: false
  - text: $y = -16$
    is_correct: false
  - text: $y = 0$
    is_correct: false
  explanation: La alternativa correcta es '$y = 8$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué eje del plano cartesiano se ubican los valores de las imágenes
    $f(x)$?
  choices:
  - text: En el eje vertical $Y$ (ordenadas).
    is_correct: true
  - text: En el eje horizontal $X$ (abscisas).
    is_correct: false
  - text: En la bisectriz del tercer cuadrante.
    is_correct: false
  - text: En el eje del tiempo.
    is_correct: false
  explanation: La alternativa correcta es 'En el eje vertical $Y$ (ordenadas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la preimagen o valor de entrada $x_0$.'
- 'Paso 2: Sustituir $x_0$ dentro de la regla $f(x)$ respetando signos.'
- 'Paso 3: Resolver las operaciones aritméticas indicadas.'
- 'Paso 4: Declarar el valor obtenido como la imagen de $x_0$.'
errores_correccion: '- **Error común:** Olvidar usar paréntesis al sustituir números
  negativos (escribir $-4^2 = -16$ en vez de $(-4)^2 = 16$).

  - **Cómo corregirlo:** Al calcular la imagen de un número negativo, usa SIEMPRE
  paréntesis alrededor del número.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
