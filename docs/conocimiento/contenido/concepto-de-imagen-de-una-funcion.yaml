semantic_id: MAT.ALG.FUNCION_CONCEPTOS.IMAGEN
resumen_inicial: La imagen de una función es el valor resultante que adopta la variable dependiente al evaluar una preimagen específica mediante la regla de correspondencia.
explicacion_simple: |
  Si tenemos la regla de una función (por ejemplo $f(x) = 2x + 3$), y le entregamos el valor de entrada $x = 4$:

  Calculamos $f(4) = 2(4) + 3 = 11$.

  Decimos que **11 es la imagen de 4** bajo la función $f$.
explicacion_formal: |
  Dado un elemento $x_0 \in \text{Dom}(f)$, la **imagen** de $x_0$ por la función $f$, denotada por $y_0 = f(x_0)$, se define como el único elemento $y_0 \in \text{Cod}(f)$ tal que el par ordenado $(x_0, y_0) \in f$.

  **Desglose de la fórmula:**
  - $x_0$: Preimagen (valor de entrada).
  - $f(x_0)$: Imagen de $x_0$ (valor de salida).
definiciones_clave: |
  - **Imagen ($y = f(x)$)**: Resultado numérico o algebraico que la función asigna a un elemento del dominio.
propiedades_relaciones: |
  - **Unicidad de la imagen**: A cada preimagen le corresponde una y solo una imagen.
ejemplo_guiado:
  enunciado: Dada la función $f(x) = 3x^2 - 5$, calcula la imagen de $x = -2$.
  pasos:
    - 'Paso 1: Reemplazar $x$ por $-2$ en la expresión de la función: $f(-2) = 3(-2)^2 - 5$.'
    - 'Paso 2: Calcular la potencia: $(-2)^2 = 4$.'
    - 'Paso 3: Realizar la multiplicación y sustracción: $f(-2) = 3(4) - 5 = 12 - 5 = 7$.'
    - 'Paso 4: Concluir que la imagen de $-2$ es $7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es la imagen de $x = -2$ bajo la función $f(x) = 3x^2 - 5$?
    choices:
      - {text: '$7$', is_correct: true}
      - {text: '$-17$', is_correct: false}
      - {text: '$11$', is_correct: false}
      - {text: '$-7$', is_correct: false}
    explanation: La alternativa correcta es '$7$'. $3(-2)^2 - 5 = 3(4) - 5 = 7$.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: En la pareja ordenada $(a, b)$ de una función $f$, ¿cuál de los componentes representa la imagen?
    choices:
      - {text: El segundo componente $b = f(a)$., is_correct: true}
      - {text: El primer componente $a$., is_correct: false}
      - {text: La suma $a + b$., is_correct: false}
      - {text: El nombre $f$ de la función., is_correct: false}
    explanation: La alternativa correcta es 'El segundo componente $b = f(a)$.'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el valor de entrada o preimagen $x = a$.'
  - 'Paso 2: Sustituir $x$ por $a$ en la regla de asignación de $f(x)$.'
  - 'Paso 3: Resolver las operaciones respetando la prioridad de signos.'
  - 'Paso 4: Declarar el valor obtenido como la imagen $f(a)$.'
errores_correccion: |
  - **Error común:** Confundir la imagen con la preimagen al interpretar los pares ordenados.
  - **Cómo corregirlo:** La preimagen es la entrada (eje $X$), mientras que la imagen es la salida (eje $Y$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La imagen de un elemento $x = 3$ bajo $f(x) = 2x + 1$ es el valor de entrada $3$.'
  - 'En la expresión $f(a) = b$, el valor $a$ representa la imagen calculada.'
  - 'La imagen de un valor del dominio se obtiene sumando las coordenadas $(x, y)$ del punto.'
  - 'Una función puede asignar dos imágenes numéricas diferentes a una misma preimagen.'
  - 'El conjunto de todas las imágenes de una función es siempre idéntico al conjunto dominio $A$.'
afirmaciones_verdaderas:
  - 'La imagen de un elemento $x$ del dominio es el valor resultante $y = f(x)$ obtenido al evaluar la función en $x$.'
  - 'El conjunto formado por todas las imágenes de los elementos del dominio constituye el recorrido de la función.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular la imagen de un valor del dominio bajo una función dada.
  CÓMO: Evaluar el valor de entrada $x$ en la regla de correspondencia $f(x)$ y determinar el valor de salida $y$.
fuente: 'Texto escolar MINEDUC — Álgebra / Conceptos Base de Función'
