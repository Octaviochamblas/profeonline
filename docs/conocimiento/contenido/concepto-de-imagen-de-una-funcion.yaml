semantic_id: MAT.ALG.FUNCION_CONCEPTOS.IMAGEN
resumen_inicial: 'Concepto de imagen de una función: conceptos, representación y propiedades
  en Conceptos base de función.'
explicacion_simple: 'Cuando introduces un valor $x$ en una función, obtienes exactamente
  un resultado. Ese resultado tiene nombre propio en matemáticas: la imagen de $x$.'
explicacion_formal: '### Definición formal


  Para $f\colon A \to B$ y $x \in A$, la imagen de $x$ bajo $f$ es el elemento $y
  = f(x)$ tal que $(x,y) \in f$. La definición de función garantiza que esta imagen
  existe y es única para cada $x$ del dominio.


  ### Desarrollo didáctico


  Si $f(x) = 2x - 1$, la imagen de $x=5$ se obtiene evaluando: $f(5) = 2(5) - 1 =
  9$. Decimos que "$9$ es la imagen de $5$ bajo $f$", o simplemente $f(5)=9$.


  A diferencia de la preimagen (que puede tener varios valores), la imagen de un elemento
  del dominio es siempre un único número, garantizado por la condición de unicidad
  que define a las funciones.'
definiciones_clave: '- **Concepto de imagen de una función**: Elemento central en
  el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a concepto de imagen de una función.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a concepto de imagen
    de una función.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a concepto de imagen de una función.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
