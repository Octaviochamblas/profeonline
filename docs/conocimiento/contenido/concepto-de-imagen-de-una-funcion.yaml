semantic_id: MAT.ALG.FUNCION_CONCEPTOS.IMAGEN
resumen_inicial: La imagen de un elemento $x$ del dominio es el valor único $y = f(x)$ que la función le asigna en el codominio.
explicacion_simple: '![La imagen de un elemento $x$ del dominio es el valor único $y = f(x)$ que la función le asigna en el codominio](/static/img/nodos/concepto-de-imagen-de-una-funcion-intro.svg)



  La **imagen** es el resultado directo que entrega la función cuando le introduces un número de entrada específico.


  Por ejemplo, si la función es $f(x) = 2x + 1$ y quieres saber la imagen de $3$, simplemente calculas:

  $$f(3) = 2(3) + 1 = 7$$


  Decimos que **$7$ es la imagen de $3$**.'
explicacion_formal: 'Dada una función $f: A \to B$ y un elemento $a \in A$, la **imagen** de $a$ bajo $f$ es el único elemento $b \in B$ tal que $(a, b) \in f$, denotado por:

  $$b = f(a)$$


  **Propiedades fundamentales:**

  - **Unicidad**: Por definición de función, cada preimagen $a \in \text{Dom}(f)$ posee **exactamente una** imagen.

  - **Conjunto Imagen**: El conjunto de todas las imágenes de los elementos de un subconjunto $S \subseteq A$ se denota $f(S) = \{f(x) \mid x \in S\}$.'
definiciones_clave: '- **Imagen ($f(a)$)**: Salida única asignada a la entrada $a$.

  - **Evaluación directa**: Sustitución de la variable independiente por un valor numérico.'
propiedades_relaciones: '- **Punto en la curva**: Si $b$ es la imagen de $a$, el punto $(a, b)$ forma parte de la gráfica cartesiana.

  - **Eje Y**: Las imágenes se proyectan y leen sobre el eje de las ordenadas.'
ejemplo_guiado:
  enunciado: '![Ejemplo La imagen de un elemento $x$ del dominio es el valor único $y = f(x)$ que la función le asigna en el codominio](/static/img/nodos/concepto-de-imagen-de-una-funcion-ejemplos.svg)



    Dada la función $f(x) = 3x^2 - 2x + 4$, calcula la imagen de $-2$.'
  pasos:
  - 'Paso 1: Identificar la preimagen dada: $x = -2$.'
  - 'Paso 2: Sustituir $x = -2$ en la fórmula: $f(-2) = 3(-2)^2 - 2(-2) + 4$.'
  - 'Paso 3: Resolver potencias y signos: $3(4) + 4 + 4 = 12 + 8 = 20$.'
  - 'Paso 4: Concluir que la imagen de $-2$ es $20$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $f(x) = x^3 - 1$, ¿cuál es la imagen de -2?
  choices:
  - text: '-9'
    is_correct: true
  - text: '-7'
    is_correct: false
  - text: '7'
    is_correct: false
  - text: '-8'
    is_correct: false
  explanation: 'La alternativa correcta es ''-9''. Al evaluar: $f(-2) = (-2)^3 - 1 = -8 - 1 = -9$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $g(x) = 4 - 3x$, ¿cuál es la imagen de 0?
  choices:
  - text: '4'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '-3'
    is_correct: false
  explanation: 'La alternativa correcta es ''4''. Al sustituir $x = 0$: $g(0) = 4 - 3(0) = 4$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la preimagen $x_0$ indicada.'
- 'Paso 2: Reemplazar $x$ por $x_0$ en la expresión algebraica de la función.'
- 'Paso 3: Realizar las operaciones respetando la prioridad de paréntesis, potencias, productos y sumas.'
- 'Paso 4: Escribir el resultado final $y = f(x_0)$.'
errores_correccion: '- **Error común:** Elevar al cuadrado números negativos sin usar paréntesis, por ejemplo escribir $-2^2 = -4$ en vez de $(-2)^2 = 4$.

  - **Cómo corregirlo:** Al sustituir números negativos, encerrarlos siempre entre paréntesis: $(-2)^2 = 4$.'
ejemplos:
- titulo: 'Ejemplo 1: Función afín'
  enunciado: Calcula la imagen de $5$ en $f(x) = 4x - 6$.
  alternativas:
  - '14'
  - '26'
  - '20'
  - '11'
  respuesta: '14'
  solucion_pasos:
  - 'Paso 1: Evaluar $f(5) = 4(5) - 6$.'
  - 'Paso 2: $20 - 6 = 14$.'
- titulo: 'Ejemplo 2: Función racional'
  enunciado: Halla la imagen de $3$ en $g(x) = \frac{x + 5}{x - 1}$.
  alternativas:
  - '4'
  - '8'
  - '2'
  - '3'
  respuesta: '4'
  solucion_pasos:
  - 'Paso 1: Sustituir $x = 3$: $g(3) = \frac{3 + 5}{3 - 1}$.'
  - 'Paso 2: Calcular cociente: $\frac{8}{2} = 4$.'
- titulo: 'Ejemplo 3: Función con valor absoluto'
  enunciado: Determina la imagen de $-4$ en $h(x) = |2x + 3|$.
  alternativas:
  - '5'
  - '-5'
  - '11'
  - '-11'
  respuesta: '5'
  solucion_pasos:
  - 'Paso 1: Evaluar el interior: $2(-4) + 3 = -8 + 3 = -5$.'
  - 'Paso 2: Aplicar valor absoluto: $|-5| = 5$.'
- titulo: 'Ejemplo 4: Imagen del cero'
  enunciado: ¿Cuál es la imagen de $x = 0$ en $f(x) = -x^2 + 7x - 9$?
  alternativas:
  - '-9'
  - '9'
  - '0'
  - '-2'
  respuesta: '-9'
  solucion_pasos:
  - 'Paso 1: Evaluar en $0$: $f(0) = -(0)^2 + 7(0) - 9 = -9$.'
errores_frecuentes:
- Olvidar aplicar la regla de signos al sustituir valores negativos.
- Confundir la imagen f(a) con la pendiente o la variable independiente.
- No respetar la prioridad de las operaciones aritméticas al evaluar.
afirmaciones_verdaderas:
- La imagen de una preimagen x es el valor único obtenido al evaluar la función en x.
- Toda preimagen del dominio tiene exactamente una imagen asociada.
al_terminar_debes_poder: '**QUÉ:** Calcular e interpretar imágenes de funciones numéricas y algebraicas.


  **CÓMO:** Evaluando directamente la variable independiente en la fórmula funcional y resolviendo la aritmética paso a paso.


  ![Resumen La imagen de un elemento $x$ del dominio es el valor único $y = f(x)$ que la función le asigna en el codominio](/static/img/nodos/concepto-de-imagen-de-una-funcion-resumen.svg)'
