semantic_id: MAT.ALG.MODELAMIENTO_AFIN.INTERPRETACION_PENDIENTE_CONTEXTO
resumen_inicial: 'Interpretación contextual de la pendiente $m$: representa la razón
  de cambio física, económica o biológica por cada unidad que aumenta la variable
  independiente.'
explicacion_simple: 'En un problema de la vida real, la **pendiente $m$** nunca es
  solo un número; tiene un **significado práctico y unidades concretas**:

  - Si la función representa distancia vs tiempo ($d(t) = 80t$), la pendiente $80\text{
  km/h}$ es la **velocidad**.

  - Si representa costo vs litros ($C(x) = 900x + 500$), la pendiente $900\text{ \$/L}$
  es el **precio por litro**.

  - Indica siempre cuánto cambia $y$ cuando $x$ aumenta en 1.'
explicacion_formal: 'La **interpretación física o económica de la pendiente $m$**
  en el modelo $y = f(x)$ es la derivada media o tasa marginal:


  $$m = \frac{\Delta y}{\Delta x} \quad \left[\frac{\text{Unidades de } Y}{\text{Unidades
  de } X}\right]$$


  **Desglose de la fórmula:**

  - Razón dimensional entre las unidades de la variable dependiente $Y$ y las de la
  independiente $X$.'
definiciones_clave: '- **Interpretación contextual de $m$**: Explicación en lenguaje
  verbal del significado de la tasa de cambio con sus unidades físicas correspondientes.'
propiedades_relaciones: '- **Unidades derivadas**: Las unidades de $m$ son siempre
  el cociente $\text{unidades}(Y) / \text{unidades}(X)$.'
ejemplo_guiado:
  enunciado: En la función de masa de agua $M(t) = -3{,}5t + 80$, donde $M$ está en
    kilogramos y $t$ en minutos, interpreta el significado práctico de la pendiente
    $m = -3{,}5$.
  pasos:
  - 'Paso 1: Identificar las unidades de $Y$ (kilogramos) y de $X$ (minutos).Paso
    2: Construir las unidades de la pendiente: $\text{kg/min}$.Paso 3: Notar el signo
    negativo de $m = -3{,}5\text{ kg/min}$.Paso 4: Interpretar: significa que la masa
    de agua disminuye a razón de $3{,}5\text{ kg}$ por cada minuto que transcurre.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $M(t) = -3{,}5t + 80$, ¿cuál es la interpretación contextual
    correcta de la pendiente $m = -3{,}5$?
  choices:
  - text: Que la masa de agua se reduce en $3{,}5\text{ kg}$ por cada minuto transcurrido.
    is_correct: true
  - text: Que la masa inicial del estanque era de $3{,}5\text{ kg}$.
    is_correct: false
  - text: Que el tiempo disminuye en $3{,}5\text{ minutos}$.
    is_correct: false
  - text: Que la masa de agua aumenta $3{,}5\text{ kg}$ por minuto.
    is_correct: false
  explanation: La alternativa correcta es 'Que la masa de agua se reduce en $3{,}5\text{
    kg}$ por cada minuto transcurrido.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuáles son las unidades físicas de la pendiente en un gráfico de costo
    en pesos versus volumen en litros?
  choices:
  - text: Pesos por litro ($\$/\text{L}$).
    is_correct: true
  - text: Litros por peso ($\text{L}/\$$).
    is_correct: false
  - text: Solo pesos.
    is_correct: false
  - text: Solo litros.
    is_correct: false
  explanation: La alternativa correcta es 'Pesos por litro ($\$/\text{L}$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las unidades de la variable dependiente $Y$ y de la independiente
  $X$.'
- 'Paso 2: Formar la fracción de unidades $\frac{\text{Unidades } Y}{\text{Unidades
  } X}$.'
- 'Paso 3: Redactar la interpretación verbal indicando la variación de $Y$ por cada
  unidad de $X$.'
errores_correccion: '- **Error común:** Interpretar la pendiente como un valor fijo
  estático sin mencionar la dependencia por unidad de tiempo o distancia.

  - **Cómo corregirlo:** La pendiente expresa SIEMPRE un cambio relativo ''por cada
  unidad'' de la variable independiente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
