semantic_id: MAT.ALG.MODELAMIENTO_AFIN.INTERPRETACION_PENDIENTE_CONTEXTO
resumen_inicial: La pendiente $m$ en un modelo aplicado representa la tasa de variación unitaria, indicando cuánto cambia la magnitud dependiente por cada unidad que aumenta la variable independiente.
explicacion_simple: "![La pendiente $m$ en un modelo aplicado representa la tasa de variación unitaria, indicando cuánto cambia la magnitud dependiente por cada unidad que aumenta la variable independiente](/static/img/nodos/interpretacion-contextual-de-la-pendiente-intro.svg)\n\n\nEn cualquier problema real modelado con una recta $y = mx + n$, la **pendiente $m$ responde a la pregunta**:\n*¿Cuánto cambia la salida $y$ cada vez que la entrada $x$ aumenta en $1$ unidad?*\n\n- **Las unidades de $m$ son siempre compuestas:** (unidades de $y$) / (unidades de $x$), como $\\text{km/h}$, $\\$/\\text{litro}$ o $^\\circ\\text{C/minuto}$.\n- **El signo indica el sentido:**\n  - Positivo ($m > 0$): velocidad de aumento, ganancia o costo por unidad.\n  - Negativo ($m < 0$): velocidad de consumo, desgaste o pérdida por unidad."
explicacion_formal: "Dada una función afín contextual $y = f(x) = mx + n$, la pendiente se define como la razón de cambio marginal constante:\n$$m = \\frac{\\Delta y}{\\Delta x} = \\frac{f(x + 1) - f(x)}{1} = \\left[\\frac{\\text{Unidad de } Y}{\\text{Unidad de } X}\\right]$$\n\n**Propiedades de interpretación:**\n- **Invarianza de escala**: El valor de $m$ no cambia a lo largo de la trayectoria del fenómeno.\n- **Significado del signo**:\n  - $m > 0$: Proceso de acumulación, ganancia, cobro variable o producción.\n  - $m < 0$: Proceso de vaciado, depreciación, consumo de recursos o enfriamiento.\n  - $m = 0$: Estado estacionario o proceso neutro."
definiciones_clave: '- **Tasa marginal / Variación unitaria**: Cambio en la variable dependiente producido por un incremento de $+1$ en la independiente.

  - **Unidad de razón**: Dimensión física o económica de la pendiente $[Y]/[X]$.'
propiedades_relaciones: '- **Derivada constante**: En cálculo, coincide con la primera derivada de la función $f''(x) = m$.

  - **Comparación de eficiencias**: Comparar las pendientes de dos modelos permite determinar cuál proceso es más rápido o eficiente.'
ejemplo_guiado:
  enunciado: '![Ejemplo La pendiente $m$ en un modelo aplicado representa la tasa de variación unitaria, indicando cuánto cambia la magnitud dependiente por cada unidad que aumenta la variable independiente](/static/img/nodos/interpretacion-contextual-de-la-pendiente-ejemplos.svg)



    La temperatura $T$ (en $^\circ\text{C}$) de un líquido en función del tiempo $t$ (en minutos) está dada por $T(t) = -3.5t + 85$. Interpreta detalladamente el significado contextual de la pendiente $m = -3.5$.'
  pasos:
  - 'Paso 1: Identificar las variables y sus unidades: $T$ en $^\circ\text{C}$ y $t$ en minutos.'
  - 'Paso 2: Extraer la pendiente con sus unidades de razón: $m = -3.5^\circ\text{C/min}$.'
  - 'Paso 3: Analizar el signo: al ser negativo ($-3.5 < 0$), indica que la temperatura disminuye.'
  - 'Paso 4: Redactar la interpretación contextual: ''Por cada minuto que transcurre, la temperatura del líquido disminuye en $3.5^\circ\text{C}$''.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función de consumo de combustible $C(d) = 0.07d + 2$, donde $d$ son kilómetros y $C$ son litros, ¿qué significa $m = 0.07$?
  choices:
  - text: El vehiculo consume 0.07 litros por cada kilometro recorrido.
    is_correct: true
  - text: El estanque tiene 0.07 litros al inicio.
    is_correct: false
  - text: El vehiculo recorre 0.07 kilometros por litro.
    is_correct: false
  - text: El viaje dura 0.07 horas.
    is_correct: false
  explanation: La alternativa correcta es 'El vehiculo consume 0.07 litros por cada kilometro recorrido.'. La pendiente representa la tasa unitaria en L/km.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuáles son las unidades de la pendiente si la variable dependiente es dinero en pesos ($) y la independiente es tiempo en meses?
  choices:
  - text: Pesos por mes ($/mes)
    is_correct: true
  - text: Pesos ($)
    is_correct: false
  - text: Meses
    is_correct: false
  - text: Meses por peso (mes/$)
    is_correct: false
  explanation: La alternativa correcta es 'Pesos por mes ($/mes)'. Las unidades de la pendiente son siempre $[Y]/[X]$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer el coeficiente $m$ que acompaña a la variable independiente en la fórmula del modelo.'
- 'Paso 2: Asignar las unidades de medida $[\text{Unidad de } Y] / [\text{Unidad de } X]$.'
- 'Paso 3: Identificar si el signo representa incremento ($+$) o reducción ($-$).'
- 'Paso 4: Redactar la conclusión en lenguaje natural: ''Por cada unidad adicional de $X$, la magnitud $Y$ aumenta/disminuye en $|m|$ unidades''.'
errores_correccion: '- **Error común:** Dar la interpretación de la pendiente como un monto total en lugar de una tasa por unidad.

  - **Cómo corregirlo:** Usa siempre la frase clave **''por cada unidad de...''** para enfatizar que se trata de una tasa unitaria de cambio.'
ejemplos:
- titulo: 'Ejemplo 1: Depreciación de maquinaria'
  enunciado: El valor de una máquina es $V(t) = -500.000t + 6.000.000$ ($t$ en años). ¿Qué significa $m = -500.000$?
  alternativas:
  - La máquina pierde $500.000 de valor por cada año de uso
  - La máquina costó $500.000 al comprarla
  - El valor final es $500.000
  - La máquina dura 500.000 horas
  respuesta: La máquina pierde $500.000 de valor por cada año de uso
  solucion_pasos:
  - 'Paso 1: $m = -\$500.000/\text{año}$, representa la tasa anual de depreciación.'
- titulo: 'Ejemplo 2: Salario con comisiones'
  enunciado: Si $S(v) = 0.08v + 450.000$, ¿qué representa la pendiente $0.08$?
  alternativas:
  - Una comisión del 8% por cada peso vendido
  - Un sueldo base de $80.000
  - Que vende 8 artículos por mes
  - El 8% de sueldo fijo
  respuesta: Una comisión del 8% por cada peso vendido
  solucion_pasos:
  - 'Paso 1: $0.08 = \frac{8}{100} = 8\%$ de comisión por venta.'
- titulo: 'Ejemplo 3: Velocidad de vaciado'
  enunciado: Un estanque tiene $V(t) = 1200 - 40t$ ($t$ en minutos, $V$ en litros). ¿A qué ritmo se vacía?
  alternativas:
  - A razón de 40 litros por minuto
  - A razón de 1200 litros por minuto
  - A razón de 30 litros por minuto
  - A razón de 40 minutos por litro
  respuesta: A razón de 40 litros por minuto
  solucion_pasos:
  - 'Paso 1: La tasa de vaciado es $|-40| = 40\text{ L/min}$.'
- titulo: 'Ejemplo 4: Comparación de pendientes'
  enunciado: La tarifa A es $C_A(x) = 300x + 1000$ y la B es $C_B(x) = 250x + 2000$. ¿Cuál plan es más barato por unidad adicional?
  alternativas:
  - El plan B, porque su pendiente (250) es menor
  - El plan A, porque su pendiente (300) es mayor
  - Son iguales
  - Depende del cargo fijo
  respuesta: El plan B, porque su pendiente (250) es menor
  solucion_pasos:
  - 'Paso 1: El costo por unidad adicional lo da la pendiente ($250 < 300$), siendo B más económico por consumo extra.'
errores_frecuentes:
- Omitir las unidades de medida al explicar la pendiente.
- Confundir la pendiente con el valor inicial o el valor total.
- Olvidar indicar si la magnitud aumenta o disminuye según el signo de m.
afirmaciones_verdaderas:
- La pendiente en un modelo contextual representa la razón de cambio por unidad de la variable independiente.
- Las unidades de la pendiente corresponden al cociente entre las unidades de la variable dependiente e independiente.
al_terminar_debes_poder: '**QUÉ:** Interpretar el significado físico, económico o demográfico de la pendiente en modelos aplicados.


  **CÓMO:** Extrayendo el valor m con sus unidades compuestas [Y]/[X] y redactando su significado como tasa de variación unitaria.


  ![Resumen La pendiente $m$ en un modelo aplicado representa la tasa de variación unitaria, indicando cuánto cambia la magnitud dependiente por cada unidad que aumenta la variable independiente](/static/img/nodos/interpretacion-contextual-de-la-pendiente-resumen.svg)'
