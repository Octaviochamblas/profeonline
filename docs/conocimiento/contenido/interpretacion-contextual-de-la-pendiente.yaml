semantic_id: MAT.ALG.MODELAMIENTO_AFIN.INTERPRETACION_PENDIENTE_CONTEXTO
resumen_inicial: 'Interpretación contextual de la pendiente: conceptos, representación
  y propiedades en Modelamiento lineal y afín.'
explicacion_simple: Un número solo no dice mucho; pero cuando le agregas las unidades
  y el contexto, la pendiente cuenta toda la historia de cómo cambia una magnitud
  respecto a otra.
explicacion_formal: '### Definición formal


  Dado un modelo $f(x)=mx+n$ que representa una magnitud $y$ (con unidades $U_y$)
  en función de $x$ (con unidades $U_x$), la pendiente $m$ se interpreta como una
  tasa de cambio con unidades $U_y/U_x$: cuánto varía $y$ por cada unidad de $U_x$
  que aumenta $x$.


  ### Desarrollo didáctico


  Para interpretar correctamente, siempre hay que nombrar las dos magnitudes y sus
  unidades: no basta con decir "la pendiente es 5", hay que decir "por cada [unidad
  de x], [la magnitud y] cambia en 5 [unidades de y]".


  Si $C(x)=250x+1000$ modela el costo (en pesos) según los kilómetros recorridos,
  la pendiente $250$ se interpreta como "el costo aumenta \$250 por cada kilómetro
  adicional recorrido".'
definiciones_clave: '- **Interpretación contextual de la pendiente**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación contextual de la pendiente.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a interpretación contextual
    de la pendiente.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a interpretación contextual de la
    pendiente.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
