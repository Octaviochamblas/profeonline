  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica qué magnitud representa $x$ y qué magnitud representa $y$ en
  el contexto.'
- 'Paso 2: Identifica las unidades de ambas magnitudes.'
- 'Paso 3: Redacta la interpretación como "por cada unidad de $x$, $y$ cambia en $m$
  unidades".'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar interpretación contextual de la pendiente.
ejemplos:
- titulo: Interpretación en contexto de velocidad
  enunciado: Si $D(t)=60t$ modela la distancia (en km) recorrida en función del tiempo
    $t$ (en horas), interpreta la pendiente $60$.
  solucion_pasos:
  - La pendiente indica cuánto cambia la distancia por cada hora transcurrida.
  - Interpretación - por cada hora, la distancia recorrida aumenta en 60 km (es decir,
    la velocidad es 60 km/h).
- titulo: Interpretación en contexto de costo
  enunciado: Si $C(x)=80x+2000$ modela el costo según las unidades producidas $x$,
    interpreta la pendiente $80$.
  solucion_pasos:
  - La pendiente indica cuánto cambia el costo por cada unidad producida.
  - Interpretación - por cada unidad adicional producida, el costo aumenta en \$80.
- titulo: ¿La pendiente de un modelo contextual debe interpretarse con sus unidades
    correspondientes?
  enunciado: ¿La pendiente de un modelo contextual debe interpretarse con sus unidades
    correspondientes?
  respuesta: Sí
  solucion_pasos:
  - Sin las unidades, el número pierde el significado real que aporta al contexto.
- titulo: ¿Una pendiente negativa en contexto siempre representa una pérdida de dinero?
  enunciado: ¿Una pendiente negativa en contexto siempre representa una pérdida de
    dinero?
  respuesta: 'No'
  solucion_pasos:
  - Depende del contexto - puede representar disminución de temperatura, de altura,
    de población, etc., no exclusivamente dinero.
errores_frecuentes:
- Interpretar la pendiente como un número aislado, sin mencionar las magnitudes ni
  las unidades.
- Confundir cuál magnitud corresponde a $x$ y cuál a $y$ al redactar la interpretación.
- Olvidar mencionar la dirección del cambio (aumento o disminución) según el signo
  de la pendiente.
- Interpretar la pendiente como si fuera el valor total, en vez de la tasa por unidad.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando interpretación
  contextual de la pendiente.
