semantic_id: MAT.ALG.MODELAMIENTO_AFIN.INTERPRETACION_PENDIENTE_CONTEXTO
resumen_inicial: Interpretar la pendiente en contexto otorga un significado físico, económico o práctico al parámetro $m$ como tasa unitaria de variación.
explicacion_simple: |
  En un problema aplicado, la **pendiente $m$** responde a la pregunta:

  *"¿Cuánto cambia la cantidad final por cada 1 unidad que aumenta la variable inicial?"*

  Por ejemplo:
  - En un viaje en taxi $C(d) = 250d + 500$, la pendiente $m = 250$ significa que la tarifa aumenta $\$250$ por cada kilómetro recorrido.
  - En un vaciado $V(t) = 80 - 4t$, la pendiente $m = -4$ significa que el volumen disminuye en $4$ litros por cada minuto.
explicacion_formal: |
  Sea el modelo contextual $y = f(x) = mx + b$. La **interpretación de la pendiente** $m = \frac{\Delta y}{\Delta x}$ requiere asignar las unidades del cociente:

  $$\text{Unidades de } m = \frac{\text{Unidades de } y}{\text{Unidades de } x}$$

  **Significado físico/económico:**
  - $m > 0$: Rapidez de incremento o costo marginal unitario.
  - $m < 0$: Rapidez de desgaste, consumo, vaciado o depreciación unitaria.
definiciones_clave: |
  - **Interpretación contextual de la pendiente**: Significado operacional del parámetro $m$ expresado en las unidades compuestas del problema ($\text{unidad}_y / \text{unidad}_x$).
propiedades_relaciones: |
  - **Independencia del valor inicial**: La pendiente mide únicamente el ritmo de cambio y no se ve afectada por el costo o valor base $b$.
ejemplo_guiado:
  enunciado: "El costo de producción de cajas de cartón viene dado por $C(x) = 150x + 2.000$, donde $x$ es el número de cajas y $C$ es el costo en pesos. Interpreta la pendiente $m = 150$."
  pasos:
    - 'Paso 1: Identificar las unidades de las variables: $x$ en cajas e $y = C(x)$ en pesos.'
    - 'Paso 2: Formar la unidad de la pendiente: $\frac{\text{pesos}}{\text{caja}}$.'
    - 'Paso 3: Extraer el valor $m = 150$.'
    - 'Paso 4: Concluir que fabricar una caja adicional aumenta el costo de producción en $\$150$ pesos (costo unitario de fabricación).'
checkpoints:
  - placement: after_explicacion_formal
    question: "En la función de costo $C(x) = 150x + 2.000$, ¿qué representa exactamente la pendiente $m = 150$?"
    choices:
      - {text: "El costo adicional de producir una caja de cartón.", is_correct: true}
      - {text: "El costo fijo de mantención de la fábrica.", is_correct: false}
      - {text: "La cantidad máxima de cajas producidas.", is_correct: false}
      - {text: "El número total de trabajadores de la empresa.", is_correct: false}
    explanation: "La alternativa correcta es 'El costo adicional de producir una caja de cartón.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "En un estanque con volumen $V(t) = 100 - 3t$ (en litros y minutos), ¿qué indica el número $-3$?"
    choices:
      - {text: "Que el estanque pierde 3 litros de agua por cada minuto.", is_correct: true}
      - {text: "Que el estanque se vacía en 3 minutos.", is_correct: false}
      - {text: "Que el estanque gana 3 litros de agua por minuto.", is_correct: false}
      - {text: "Que la capacidad inicial era de 3 litros.", is_correct: false}
    explanation: "La alternativa correcta es 'Que el estanque pierde 3 litros de agua por cada minuto.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la pendiente $m$ en la ecuación $y = mx + b$.'
  - 'Paso 2: Registrar las unidades de la variable dependiente $y$ e independiente $x$.'
  - 'Paso 3: Expresar el significado en formato "variación de $y$ por unidad de $x$".'
  - 'Paso 4: Explicar el sentido de crecimiento (si $m > 0$) o decrecimiento (si $m < 0$).'
errores_correccion: |
  - **Error común:** Confundir la pendiente $m$ con el valor fijo inicial $b$ en la redacción contextual.
  - **Cómo corregirlo:** La pendiente siempre es una **TASA DE CAMBIO O RITMO** por unidad; el valor inicial es un estado fijo en cero.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La pendiente en un problema de tarifas telefónicas representa el cargo fijo inicial independiente del consumo.'
  - 'Una pendiente de $m = 50$ en un modelo de transporte indica que el viaje dura 50 minutos exactos en total.'
  - 'La unidad de la pendiente en cualquier contexto real se expresa siempre en porcentaje sin dimensiones.'
  - 'Una pendiente negativa en un problema económico de costos indica que el producto se regala gratuitamente.'
  - 'Interpretar la pendiente en un gráfico de tiempo contra distancia entrega la aceleración constante del objeto.'
afirmaciones_verdaderas:
  - 'La pendiente $m$ en un modelo afín contextualizado representa la tasa de variación unitaria, expresada en las unidades del cociente $\frac{\text{unidad}_y}{\text{unidad}_x}$.'
  - 'El signo de la pendiente $m$ determina si la magnitud dependiente experimenta un incremento ($m > 0$) o un decremento ($m < 0$) por cada unidad de la variable independiente.'
al_terminar_debes_poder: |
  QUÉ: Interpretar el significado práctico de la pendiente $m$ en problemas aplicados a la vida real.
  CÓMO: Asignar unidades $\frac{\text{unidad}_y}{\text{unidad}_x}$ al parámetro $m$ y describir la variación unitaria.
