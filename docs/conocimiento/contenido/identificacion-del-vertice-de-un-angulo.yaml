semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.ELEMENTO_VERTICE
resumen_inicial: El vértice es el punto de origen común donde se intersectan los dos
  rayos de un ángulo, fundamental para ubicar el centro de rotación de cualquier abertura
  geométrica.
explicacion_simple: '![Identificación del Vértice de un Ángulo](/static/img/nodos/identificacion-del-vertice-de-un-angulo-intro.svg)


  Imagina la esquina de una mesa o la punta de un lápiz. El punto exacto donde se
  unen las dos líneas o lados es lo que en geometría llamamos vértice. Es el punto
  de partida de donde nacen los dos lados.'
explicacion_formal: '### Definición formal

  Dado un ángulo $\angle AOB = \vec{OA} \cup \vec{OB}$ en el plano euclidiano, se
  define el **vértice** como el punto único de intersección o punto inicial común
  de ambos rayos:


  $$\operatorname{Vértice}(\angle AOB) = \operatorname{Origen}(\vec{OA}) \cap \operatorname{Origen}(\vec{OB})
  = \{O\}$$


  ### Desglose simbólico y geométrico

  - $O$: Punto frontera geométrico donde nacen y convergen ambos rayos.

  - Letra central en $\angle AOB$: En la notación estándar de tres puntos, el vértice
  se ubica de forma obligatoria en la posición intermedia.

  - Invariancia por escala: Si se eligen otros puntos $A'' \in \vec{OA}$ y $B'' \in
  \vec{OB}$, el vértice $O$ permanece invariante: $\angle A''OB'' = \angle AOB$.


  ### Síntesis didáctica

  El vértice es el centro de rotación y origen geométrico del ángulo; su correcta
  identificación es fundamental porque determina la posición del centro en cualquier
  medición o transformación geométrica.'
definiciones_clave: '- **Vértice**: Punto de intersección u origen común de los dos
  rayos que constituyen el ángulo.

  - **Notación por tres puntos**: Forma de nombrar un ángulo escribiendo tres puntos,
  donde la letra del centro siempre representa el vértice. '
propiedades_relaciones: '- **Unicidad del vértice**: Todo ángulo tiene exactamente
  un único vértice.

  - **Punto de rotación**: El vértice actúa como el centro de rotación alrededor del
  cual se mide la abertura angular. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Identificación del Vértice](/static/img/nodos/identificacion-del-vertice-de-un-angulo-ejemplos.svg)


    En un plano de arquitectura, dos vigas rectas coinciden en la notación $\angle
    PQR$. Si el punto $P$ se ubica en la pared norte, $Q$ en la columna central y
    $R$ en la pared este, indica cuál de los puntos es el vértice.'
  pasos:
  - 'Paso 1: Identificar que en la notación geométrica de tres puntos $\angle PQR$,
    la letra ubicada al centro representa el origen común.'
  - 'Paso 2: Verificar que las vigas parten desde la columna situada en el punto $Q$
    hacia los puntos $P$ y $R$.'
  - 'Paso 3: Concluir que el vértice es el punto $Q$ (la columna central), lugar exacto
    de intersección de ambas vigas.'
checkpoints:
- placement: after_explicacion_formal
  question: En la notación $\angle XYZ$, ¿cuál de los tres puntos corresponde obligatoriamente
    al vértice del ángulo?
  choices:
  - text: El punto Y (la letra del centro)
    is_correct: true
  - text: El punto X (la primera letra)
    is_correct: false
  - text: El punto Z (la última letra)
    is_correct: false
  - text: Cualquiera de los tres puntos indistintamente
    is_correct: false
  explanation: En la notación estándar de tres puntos el punto Y (la letra del centro)
    indica siempre y sin ambigüedad la ubicación del vértice.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la notación geométrica $\angle PQR$, ¿qué punto representa el vértice?
  choices:
  - text: El punto Q (la columna central)
    is_correct: true
  - text: El punto P
    is_correct: false
  - text: El punto R
    is_correct: false
  - text: El segmento PR
    is_correct: false
  explanation: En la notación de tres puntos el punto Q (la columna central) representa
    el origen donde convergen ambas vigas.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el punto donde se unen ambos rayos o lados del ángulo.'
- 'Paso 2: Verificar en la notación simbólica que corresponda a la letra ubicada en
  la posición central.'
- 'Paso 3: Identificar dicho punto como el vértice del ángulo.'
errores_correccion: 'Evita confundir los puntos situados sobre los lados con el vértice:
  solo el punto de origen común es el vértice.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el vértice del ángulo denotado como $\angle RST$?
  alternativas:
  - Punto S
  - Punto R
  - Punto T
  respuesta: Punto S
  solucion_pasos:
  - En la notación $\angle RST$, la letra del centro $S$ es el vértice.
- titulo: Ejemplo 2
  enunciado: Si el vértice de un ángulo se ubica en $O(0,0)$ y los lados pasan por
    $A(3,0)$ y $B(0,4)$, ¿cómo se nombra correctamente el ángulo?
  alternativas:
  - $\angle AOB$
  - $\angle ABO$
  - $\angle OAB$
  respuesta: $\angle AOB$
  solucion_pasos:
  - 'El vértice $O$ debe ir en el centro de la notación de tres puntos: $\angle AOB$.'
- titulo: ¿El vértice de un ángulo pertenece a ambos lados del ángulo simultáneamente?
  respuesta: Sí
  solucion_pasos:
  - Sí, el vértice es el punto de origen de ambos rayos.
- titulo: ¿Un ángulo puede tener dos vértices distintos?
  respuesta: 'No'
  solucion_pasos:
  - No, todo ángulo posee un único punto de origen común denominado vértice.
errores_frecuentes:
- Afirmar que la primera letra de la notación $\angle ABC$ es el vértice en lugar
  de la del medio.
- Confundir un punto sobre uno de los rayos con el punto de origen o vértice.
- Suponer que al cambiar el tamaño de los lados cambia la posición del vértice.
- Creer que un triángulo tiene un solo vértice en lugar de tres vértices independientes.
- Confundir el concepto de vértice (punto) con el concepto de medida del ángulo (grados).
afirmaciones_verdaderas:
- En la notación de tres puntos $\angle KLM$, la letra $L$ señala el vértice del ángulo.
- El vértice es el punto de origen del cual emergen los dos rayos que forman el ángulo.
al_terminar_debes_poder: '**QUÉ:** Identificar con precisión el vértice de cualquier
  ángulo en figuras geométricas y notación formal.


  **CÓMO:** Ubicando el punto de intersección $V = \vec{VA} \cap \vec{VB}$ en el gráfico
  y seleccionando la letra intermedia en la notación de tres puntos $\angle AVB$.


  ![Resumen de Identificación del Vértice](/static/img/nodos/identificacion-del-vertice-de-un-angulo-resumen.svg)'
