resumen_inicial: El orden en que se escriban las variables dentro de la parte literal
  no afecta la semejanza de los términos debido a la propiedad conmutativa de la multiplicación.
explicacion_simple: Dado que en la multiplicación el orden de los factores no altera
  el producto ($2 \cdot 3 = 3 \cdot 2$), escribir $3xy$ es exactamente lo mismo que
  escribir $3yx$. De igual forma, $4x^2y^3$ y $-7y^3x^2$ son términos semejantes aunque
  las letras estén en orden diferente.
explicacion_formal: 'En la parte literal $L = \prod_{j=1}^m x_j^{e_j}$, por la **Propiedad
  Conmutativa de la Multiplicación** en $\mathbb{R}$:


  $$x_1^{e_1} x_2^{e_2} \dots x_m^{e_m} = x_{\pi(1)}^{e_{\pi(1)}} x_{\pi(2)}^{e_{\pi(2)}}
  \dots x_{\pi(m)}^{e_{\pi(m)}}$$


  $$\forall \pi \in S_m \implies c_1 xy = c_1 yx \iff T_1 \sim T_2$$


  > **Complemento didáctico:** La invarianza por permutación literal refleja la conmutatividad
  del producto escalar subyacente.'
definiciones_clave: '- **Invarianza conmutativa**: Propiedad por la cual permutaciones
  del orden literal conservan el valor del término.'
propiedades_relaciones: '- **Ordenamiento alfabético canónico**: Convención de reorganizar
  las letras alfabéticamente para facilitar la inspección visual.'
ejemplo_guiado:
  enunciado: Verifique si $T_1 = 5x^3y^2$ y $T_2 = -2y^2x^3$ son términos semejantes.
  pasos:
  - 'Paso 1: Reordenar la parte literal de $T_2$ alfabéticamente: $y^2x^3 = x^3y^2$.'
  - 'Paso 2: Comparar la parte literal reordenada de $T_2$ ($x^3y^2$) con la de $T_1$
    ($x^3y^2$).'
  - 'Paso 3: Constatar la igualdad absoluta de partes literales: $x^3y^2 = x^3y^2$.'
  - 'Conclusión: El orden de las letras no altera el término; por ende SÍ son semejantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué dos términos como 4ab y -9ba son semejantes a pesar del orden
    distinto de sus letras?
  choices:
  - text: Por la propiedad conmutativa de la multiplicación (ab = ba)
    is_correct: true
  - text: Porque se pueden dividir entre dos
    is_correct: false
  - text: Porque sus coeficientes son enteros
    is_correct: false
  - text: Porque la b va siempre al final
    is_correct: false
  explanation: La alternativa correcta es 'Por la propiedad conmutativa de la multiplicación
    (ab = ba)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5x^3y^2 y -2y^2x^3, ¿qué paso facilitó la verificación
    de la semejanza?
  choices:
  - text: Reordenar las variables de -2y^2x^3 en orden alfabético para obtener -2x^3y^2
    is_correct: true
  - text: Sumar los coeficientes 5 y -2
    is_correct: false
  - text: Restar los exponentes 3 - 2
    is_correct: false
  - text: Eliminar la variable y
    is_correct: false
  explanation: La alternativa correcta es 'Reordenar las variables de -2y^2x^3 en
    orden alfabético para obtener -2x^3y^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reorganizar las variables de cada término en orden alfabético canónico.'
- 'Paso 2: Mantener a cada variable unida a su exponente original durante el reordenamiento.'
- 'Paso 3: Comparar las partes literales canónicas para declarar la semejanza.'
errores_correccion: '- **Error 1: Desconectar los exponentes de sus variables al reordenar
  (convertir $a^3b^2$ en $b^3a^2$).** **Cómo corregirlo:** Al mover una letra, su
  exponente debe trasladarse pegado a ella ($a^3b^2 = b^2a^3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Son 8a^2b y -3ba^2 términos semejantes?
  alternativas:
  - Sí, porque ba^2 es equivalente a a^2b por conmutatividad
  - No, porque la b está primero en el segundo término
  - No, porque 8 != -3
  - Indeterminado
  respuesta: Sí, porque ba^2 es equivalente a a^2b por conmutatividad
  solucion_pasos:
  - '1. Reordenar -3ba^2 en orden alfabético: -3a^2b.'
  - 2. Ambas expresiones poseen la parte literal a^2b. Son semejantes.
- titulo: Ejemplo 2
  enunciado: Al ordenar alfabéticamente la parte literal de 4z^3x^2y^5, ¿cuál es el
    resultado canónico?
  alternativas:
  - x^2y^5z^3
  - z^3y^5x^2
  - xyz^10
  - 4xyz
  respuesta: x^2y^5z^3
  solucion_pasos:
  - '1. Orden de letras x, y, z conservando sus exponentes: x^2y^5z^3.'
- titulo: ¿Es el término 10yx^4 semejante al término -2x^4y?
  respuesta: Sí
  solucion_pasos:
  - Sí, yx^4 = x^4y por conmutatividad multiplicativa.
- titulo: ¿Al reordenar alfabéticamente las letras de un término cambia el valor numérico
    de su coeficiente?
  respuesta: 'No'
  solucion_pasos:
  - No, el coeficiente escalar permanece inalterado al conmutar las variables.
errores_frecuentes:
- Declarar que dos términos no son semejantes sólo porque sus letras están escritas
  en distinto orden.
- Mezclar o intercambiar los exponentes de las letras al cambiar su orden tipográfico.
- Declarar que cambiar el orden de las letras requiere cambiar el signo del coeficiente.
- Omitir que la conmutatividad aplica para el producto de las variables en los números
  reales.
- Declarar el orden de las letras con el orden de los términos en un polinomio.
afirmaciones_verdaderas:
- Por la propiedad conmutativa de la multiplicación, el orden de las letras no altera
  la parte literal.
- Reordenar las letras alfabéticamente facilita verificar la semejanza entre términos.
al_terminar_debes_poder: Al terminar serás capaz de identificar términos semejantes
  aunque sus variables estén escritas en distinto orden aplicando la conmutatividad.
