semantic_id: MAT.ALG.SIMILARIDAD.ORDEN_LITERAL_DISTINTO
resumen_inicial: 'Identificación de términos semejantes con orden literal distinto:
  procedimiento y reglas en Términos semejantes.'
explicacion_simple: '¿Es $3 \times 4$ lo mismo que $4 \times 3$? Sí, ambos dan 12.
  En álgebra pasa igual: las letras que se multiplican pueden cambiar de lugar sin
  alterar el resultado.'
explicacion_formal: '### Definición formal


  Las variables $x^2$ e $y$ se están multiplicando entre sí. Por la propiedad conmutativa,
  $x^2 \cdot y = y \cdot x^2$.


  ### Desarrollo didáctico


  Mira estos dos términos: $5ab^2$ y $-2b^2a$.

  A primera vista, parecen diferentes. Pero analicemos:

  - ¿Tienen las mismas letras? Sí, ambos tienen ''a'' y ''b''.

  - ¿Tienen los mismos exponentes letra por letra? La ''a'' está elevada a 1 en ambos.
  La ''b'' está elevada a 2 en ambos.

  Conclusión: Son totalmente semejantes.


  Para evitar confusiones, la convención matemática recomienda **ordenar las letras
  alfabéticamente**. Así, $-2b^2a$ se reescribe como $-2ab^2$, y la semejanza se hace
  evidente de inmediato.'
definiciones_clave: '- **Identificación de términos semejantes con orden literal distinto**:
  Operación o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a identificación de términos semejantes con orden literal distinto.'
ejemplo_guiado:
