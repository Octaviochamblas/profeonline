semantic_id: MAT.ALG.SIMILARIDAD.ORDEN_LITERAL_DISTINTO
resumen_inicial: La identificación de términos semejantes con orden literal distinto consiste en reconocer la semejanza entre monomios cuyos factores multiplicativos de variables están ordenados en distinta secuencia gracias a la propiedad conmutativa.
explicacion_simple: "En el factor literal de un término, las letras se están multiplicando entre sí. Como **la multiplicación es conmutativa** ($a \\cdot b = b \\cdot a$), **el orden en que estén escritas las letras NO altera el término**:\n- **Regla clave**: Cambiar el orden de las letras no crea un término nuevo ni rompe la semejanza.\n- **Ejemplo 1**: $3x y$ y $-5y x$\n  - Como $x \\cdot y = y \\cdot x$, el factor literal $xy$ es idéntico a $yx$.\n  - ¡Son **términos semejantes**!\n- **Ejemplo 2**: $4a^2 b^3$ y $7b^3 a^2$\n  - $a$ tiene exponente $2$ en ambos.\n  - $b$ tiene exponente $3$ en ambos.\n  - ¡Son **términos semejantes**!\n- **Recomendación**: Al trabajar en álgebra, conviene escribir siempre las variables en **orden alfabético** ($a^2 b^3$) para identificarlas más fácilmente.\n\n![Términos Semejantes con Orden Literal Distinto](/static/img/nodos/identificacion-de-terminos-semejantes-con-orden-literal-distinto-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $M = c \prod_{i=1}^k x_{\sigma(i)}^{a_{\sigma(i)}}$ un monomio donde $\sigma \in S_k$ representa una permutación del grupo simétrico $S_k$ sobre los índices de las $k$ variables de $\mathbb{V}$. Por la **propiedad conmutativa del producto sobre el cuerpo $\mathbb{R}$**:


  $$\prod_{i=1}^k x_i^{a_i} = \prod_{i=1}^k x_{\sigma(i)}^{a_{\sigma(i)}} \implies M_1(x_1, \dots, x_k) \sim M_2(x_{\sigma(1)}, \dots, x_{\sigma(k)})$$


  ### Forma Canónica Ordenada

  Para decidir la semejanza entre dos monomios con variables desordenadas $M_1$ y $M_2$, se aplica el operador de canonización $\mathrm{Can}: \mathcal{M} \to \mathcal{M}$ que reordena las bases alfabéticamente:


  $$\mathrm{Can}(4 y^3 x^2) = 4 x^2 y^3 \quad \text{y} \quad \mathrm{Can}(-7 x^2 y^3) = -7 x^2 y^3 \implies \mathrm{Can}(M_1) \sim \mathrm{Can}(M_2)$$


  ### Síntesis didáctica

  Reordenar alfabéticamente los factores de un monomio es una estrategia de simplificación visual para agrupar términos semejantes en expresiones extensas.

  '
definiciones_clave: '- **Propiedad conmutativa del producto**: Principio $A \cdot B = B \cdot A$ que permite reordenar las variables sin alterar el valor del monomio.

  - **Forma canónica alfabética**: Estandarización de la parte literal donde las variables se ordenan de la `A` a la `Z`.

  - **Permutación literal ($\sigma \in S_k$)**: Cambio en el orden de secuencia de los factores variables.

  '
propiedades_relaciones: '- **Equivalencia de formas desordenadas**: Dos términos como $x y z$, $z y x$ y $y x z$ son estrictamente equivalentes e idénticamente semejantes.

  - **Preservación del exponente ligado**: Al reordenar las letras, cada exponente se traslada obligatoriamente junto con su base correspondiente ($a^3 b^2 = b^2 a^3$).

  '
ejemplo_guiado:
  enunciado: Verifica si los términos $-3y^5 x^2$ y $8x^2 y^5$ son semejantes.
  pasos:
  - 'Paso 1: Escribimos el primer término en su forma canónica alfabética: $-3y^5 x^2 \implies -3x^2 y^5$.'
  - 'Paso 2: Escribimos el segundo término en su forma canónica alfabética: $8x^2 y^5 \implies 8x^2 y^5$.'
  - 'Paso 3: Comparamos las partes literales ordenadas: Ambas son $x^2 y^5$.'
  - 'Paso 4: Verificamos los exponentes asociados: En ambos términos $x$ tiene exponente $2$ e $y$ tiene exponente $5$.'
  - 'Conclusión: Los términos **SÍ son semejantes** pues el orden distinto de las letras no altera la multiplicación.'
  imagen: /static/img/nodos/identificacion-de-terminos-semejantes-con-orden-literal-distinto-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué los términos $5x y$ y $-2y x$ se clasifican como términos semejantes?
  choices:
  - text: Porque la multiplicación de variables es conmutativa ($x \cdot y = y \cdot x$), por lo que comparten el mismo factor literal
    is_correct: true
  - text: Porque sus coeficientes son números enteros
    is_correct: false
  - text: Porque al invertir las letras se invierten los signos
    is_correct: false
  - text: Porque tienen únicamente dos variables
    is_correct: false
  explanation: La alternativa correcta es 'Porque la multiplicación de variables es conmutativa ($x \cdot y = y \cdot x$), por lo que comparten el mismo factor literal'. Conmutatividad $xy = yx$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Son semejantes los términos $4b^3 a^2$ y $-9a^2 b^3$?
  choices:
  - text: Sí, son semejantes porque al reordenar alfabéticamente el primero se obtiene $4a^2 b^3$, coincidiendo con el segundo
    is_correct: true
  - text: No, porque el primer término empieza con la letra $b$
    is_correct: false
  - text: No, porque los coeficientes $4$ y $-9$ son distintos
    is_correct: false
  - text: No, porque se restan los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Sí, son semejantes porque al reordenar alfabéticamente el primero se obtiene $4a^2 b^3$, coincidiendo con el segundo'. Forma canónica $a^2 b^3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables y sus respectivos exponentes en el primer término.'
- 'Paso 2: Reordenar las variables de todos los términos en orden alfabético estandarizado.'
- 'Paso 3: Asegurarse de mantener cada exponente pegado a su base correspondiente durante el reordenamiento.'
- 'Paso 4: Comparar los factores literales ordenados para confirmar la semejanza.'
errores_correccion: '- **Error 1:** Afirmar que $xy$ y $yx$ no son semejantes por estar en distinto orden. **Cómo corregirlo:** La multiplicación de letras es **CONMUTATIVA ($x \cdot y = y \cdot x$)**; el orden no cambia la semejanza.

  - **Error 2:** Separar los exponentes de sus bases al reordenar (convertir $a^3 b^2$ en $a^2 b^3$ al invertir las letras). **Cómo corregirlo:** Al reordenar $a^3 b^2$, la letra $b$ debe conservar su exponente 2 $\implies b^2 a^3$.

  '
ejemplos:
- titulo: Dos variables desordenadas
  enunciado: ¿Son semejantes $6m n$ y $-4n m$?
  alternativas:
  - Sí, por la conmutatividad $mn = nm$
  - No, porque el orden importa
  - No, por la diferencia de coeficientes
  respuesta: Sí, por la conmutatividad $mn = nm$
  solucion_pasos:
  - 1. $mn = nm$.
  - 2. Mismo factor literal $\implies$ Semejantes.
- titulo: Tres variables desordenadas
  enunciado: ¿Son semejantes $2x y z$, $-7z x y$ y $5y z x$?
  alternativas:
  - Sí, los tres se ordenan alfabéticamente como $xyz$
  - No, son tres términos distintos
  - No, por los signos
  respuesta: Sí, los tres se ordenan alfabéticamente como $xyz$
  solucion_pasos:
  - '1. Alfabético: $xyz$, $xyz$, $xyz$.'
  - 2. Son semejantes.
- titulo: Orden alfabético recomendado
  enunciado: ¿Es la forma $a^3 b^5$ preferible a $b^5 a^3$ para facilitar la identificación visual de semejanza?
  respuesta: Sí
  solucion_pasos:
  - Sí, estandarizar alfabéticamente simplifica la comparación.
- titulo: Conservación de potencias en reordenamiento
  enunciado: ¿Es el término $4p^2 q^3$ exactamente equivalente a $4q^3 p^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $p^2 q^3 = q^3 p^2$ manteniendo sus respectivos exponentes.
errores_frecuentes:
- Declarar que dos términos no son semejantes debido al orden distinto en que aparecen escritas las variables.
- Separar los exponentes de sus bases correspondientes al intentar reordenar alfabéticamente las letras.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Intercambiar el reordenamiento de factores multiplicativos con la conmutatividad de la resta.
- Declarar que cambiar el orden de las letras altera el signo del coeficiente numérico.
afirmaciones_verdaderas:
- El orden de escritura de las variables en un monomio no afecta la semejanza gracias a la propiedad conmutativa de la multiplicación.
- Reordenar alfabéticamente los factores literales es una técnica eficaz para identificar términos semejantes.
al_terminar_debes_poder: '![Resumen de orden literal distinto](/static/img/nodos/identificacion-de-terminos-semejantes-con-orden-literal-distinto-resumen.svg)


  QUÉ: Identificar términos semejantes cuyos factores literales aparecen en diferente orden de escritura.


  CÓMO: Aplicar la propiedad conmutativa del producto $x^a y^b \equiv y^b x^a$ reordenando alfabéticamente las variables para constatar su identidad.'
