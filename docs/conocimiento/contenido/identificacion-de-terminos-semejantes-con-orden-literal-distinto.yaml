procedimiento:
- 'Paso 1: Si ves letras desordenadas, toma tu lápiz y reescribe cada término ordenando
  sus letras alfabéticamente.'
- 'Paso 2: Asegúrate de que cada letra conserve su exponente original al moverla.'
- 'Paso 3: Ahora compara los factores literales ya ordenados. Si coinciden, son semejantes.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en identificación de términos semejantes con orden literal distinto.
ejemplos:
- titulo: El disfraz del desorden
  enunciado: ¿Son semejantes 4xzy y 9yxz?
  solucion_pasos:
  - 'Ordenamos el primero alfabéticamente: 4xyz.'
  - 'Ordenamos el segundo alfabéticamente: 9xyz.'
  - 'Comparamos: xyz es idéntico a xyz.'
  - Sí, son semejantes.
- titulo: La energía de dos sistemas físicos se describe por las ecuaciones $E_1 =
    4m^2v$ y $E_2 = -3v
  enunciado: 'La energía de dos sistemas físicos se describe por las ecuaciones $E_1
    = 4m^2v$ y $E_2 = -3vm^2$. Si se requiere calcular la energía neta ($E_1 + E_2$),
    ¿cuál es la expresión reducida correcta? (v1)


    Opciones: A) $m^2v$ · B) $7m^2v$ · C) $m^4v^2$ · D) Las expresiones no se pueden
    sumar.'
  solucion_pasos:
  - '$vm^2$ se reescribe como $m^2v$. Tenemos $4m^2v - 3m^2v$. Como son semejantes,
    restamos coeficientes: $4 - 3 = 1$. Queda $1m^2v$, que se escribe $m^2v$.'
- titulo: 'Respecto de «Identificación de términos semejantes con orden literal distinto»:
    ¿Es correcta'
  enunciado: 'Respecto de «Identificación de términos semejantes con orden literal
    distinto»: ¿Es correcta esta caracterización? «El **Orden Literal Distinto** es
    una confusión visual»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Orden Literal Distinto**
    es una confusión visual.'
- titulo: 'Respecto de «Identificación de términos semejantes con orden literal distinto»:
    ¿Es válida e'
  enunciado: 'Respecto de «Identificación de términos semejantes con orden literal
    distinto»: ¿Es válida esta afirmación? «Descartar la semejanza simplemente porque
    visualmente las letras no están en el mismo orden»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Orden Literal Distinto**
    es una confusión visual.'
errores_frecuentes:
- Descartar la semejanza simplemente porque visualmente las letras no están en el
  mismo orden.
- Al ordenar, pasar el exponente de una letra a otra (ej. cambiar $a^2b$ a $ab^2$).
- En la propiedad distributiva de la multiplicación sobre la suma.
- Para «¿En qué propiedad matemática se basa el hecho de que el término $x^2y$ sea
  semejante al término $yx^2$? (v1)», la respuesta correcta es En la regla de los
  signos.
- En la propiedad asociativa de la adición.
afirmaciones_verdaderas:
- La reducción en identificación de términos semejantes con orden literal distinto
  conserva los exponentes de la parte literal.
