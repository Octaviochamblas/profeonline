semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.NEUTRO_MULTIPLICATIVO
resumen_inicial: "El número uno ($1$) es el elemento neutro multiplicativo en el conjunto de los números racionales, pues al multiplicarlo por cualquier racional no altera su valor."
explicacion_simple: |
  El **elemento neutro multiplicativo** es el 'número transparente' para la multiplicación. En los racionales ese rol lo cumple el número uno ($1$). Si a cualquier fracción la multiplicas por uno (por ejemplo, $\frac{4}{7} \times 1$), la fracción se mantiene exactamente igual: $\frac{4}{7}$. Multiplicar por uno es la base de la amplificación, pues multiplicar por fracciones del tipo $\frac{2}{2}, \frac{3}{3}, \frac{k}{k}$ es equivalente a multiplicar por 1.
explicacion_formal: |
  Formalmente, existe un único elemento $1 \in \mathbb{Q}$ (representado racionalmente como $\frac{b}{b} = 1$ con $b \in \mathbb{Z} \setminus \{0\}$) denominado **elemento neutro multiplicativo** tal que:
  $$\forall q \in \mathbb{Q}, \quad q \cdot 1 = 1 \cdot q = q$$

  Demostración: sea $q = \frac{a}{b}$ con $a, b \in \mathbb{Z}, b \neq 0$ y $1 = \frac{1}{1}$.
  $$\frac{a}{b} \cdot \frac{1}{1} = \frac{a \cdot 1}{b \cdot 1} = \frac{a}{b}$$
  Dado que el entero $1$ es la identidad multiplicativa en $\mathbb{Z}$ ($a \cdot 1 = a$), se demuestra que el valor de la fracción $q$ no se altera.
definiciones_clave: |
  - **Elemento neutro multiplicativo ($1$)**: Elemento $1 = \frac{1}{1} \in \mathbb{Q}$ que preserva la identidad de cualquier racional bajo el producto: $q \cdot 1 = q$.
  - **Identidad multiplicativa**: Propiedad estructural por la cual $f_1(q) = q \cdot 1 = q$.
  - **Forma unitaria del neutro ($\frac{k}{k}$)**: Representación de $1$ como cualquier fracción donde el numerador es igual al denominador ($k \neq 0$).
propiedades_relaciones: |
  - **Fundamento de la amplificación**: Multiplicar $\frac{a}{b}$ por $\frac{k}{k}$ es multiplicar por $1$, lo que genera una fracción equivalente sin alterar el valor real.
  - **Unicidad del neutro**: El $1$ es el único número racional que cumple la propiedad de identidad multiplicativa en $\mathbb{Q}$.
  - **Consecuencia en la división**: Dividir cualquier fracción entre $1$ deja la fracción inalterada ($q \div 1 = q$).
ejemplo_guiado:
  enunciado: "Demuestra la neutralidad del $1$ multiplicando la fracción $q = -\\frac{5}{9}$ por $1 = \\frac{4}{4}$ (forma unitaria)."
  pasos:
    - "Plantear la multiplicación: $\\left(-\\frac{5}{9}\\right) \\cdot \\left(\\frac{4}{4}\\right)$."
    - "Multiplicar numeradores y denominadores: $-\\frac{5 \\cdot 4}{9 \\cdot 4} = -\\frac{20}{36}$."
    - "Simplificar por el divisor común $4$: $-\\frac{20 \\div 4}{36 \\div 4} = -\\frac{5}{9}$."
    - "Concluir: el resultado final es $-\\frac{5}{9}$, demostrando que multiplicar por $\\frac{4}{4} = 1$ no alteró el valor de la fracción original."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el elemento neutro multiplicativo en el conjunto de los números racionales $\\mathbb{Q}$?"
    choices:
      - {text: "El número 1, porque para todo $q \\in \\mathbb{Q}$ se cumple que $q \\cdot 1 = q$.", is_correct: true}
      - {text: "El número 0.", is_correct: false}
      - {text: "La fracción $\\frac{1}{2}$.", is_correct: false}
      - {text: "El número $-1$.", is_correct: false}
    explanation: 'La correcta es El número 1, porque para todo $q \in \mathbb{Q}$ se cumple que $q \cdot 1 = q$.: define la identidad multiplicativa del conjunto $\mathbb{Q}$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Por qué amplificar una fracción $\\frac{3}{5}$ multiplicando arriba y abajo por 7 (haciendo $\\frac{3 \\cdot 7}{5 \\cdot 7} = \\frac{21}{35}$) no altera su valor verdadero?"
    choices:
      - {text: "Porque equivale a multiplicar la fracción por $\\frac{7}{7} = 1$, y el 1 es el elemento neutro multiplicativo.", is_correct: true}
      - {text: "Porque el 7 destruye el denominador.", is_correct: false}
      - {text: "Porque al multiplicar por 7 se convierte en un entero.", is_correct: false}
      - {text: "Porque 21 y 35 son números impares.", is_correct: false}
    explanation: 'La correcta es Porque equivale a multiplicar la fracción por $\frac{7}{7} = 1$, y el 1 es el elemento neutro multiplicativo.: fundamenta la técnica de amplificación en el neutro multiplicativo.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identificar la fracción original $q = \frac{a}{b}$.'
  - 'Paso 2: Expresar el número 1 como fracción $\frac{1}{1}$ (o en forma unitaria $\frac{k}{k}$).'
  - 'Paso 3: Realizar el producto $\frac{a \cdot 1}{b \cdot 1}$.'
  - 'Paso 4: Comprobar que el resultado obtenido es la fracción original $\frac{a}{b}$.'
errores_correccion: |
  Un error clásico es pensar que el elemento neutro de la multiplicación es el cero (creer que $q \cdot 0 = q$). ¡Recuerda que **multiplicar por cero da CERO**! El verdadero neutro de la multiplicación es el **1**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $1 \\cdot \\left(-\\frac{13}{17}\\right)$."
    alternativas:
      - "$-\\frac{13}{17}$"
      - "1"
      - "0"
    respuesta: "$-\\frac{13}{17}$"
    solucion_pasos:
      - "Por la propiedad del neutro multiplicativo $1 \\cdot q = q$."
      - "Resultado: $-\\frac{13}{17}$."
  - titulo: "Ejemplo 2"
    enunciado: "Resuelve la ecuación $\\frac{8}{3} \\cdot y = \\frac{8}{3}$ en $\\mathbb{Q}$."
    alternativas:
      - "y = 1"
      - "y = 0"
      - "$y = \\frac{3}{8}$"
    respuesta: "y = 1"
    solucion_pasos:
      - "Por la unicidad del elemento neutro multiplicativo en $\\mathbb{Q}$, el único número $y$ que al multiplicarse por $\\frac{8}{3}$ la deja igual es $y = 1$."
  - titulo: "¿Cualquier fracción donde el numerador es igual al denominador (como $\\frac{12}{12}$) actúa como elemento neutro multiplicativo?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, porque $\\frac{12}{12} = 1$, que es el número uno en $\\mathbb{Q}$."
  - titulo: "¿Dividir una fracción entre $1$ da como resultado la misma fracción?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, $q \\div 1 = q \\cdot \\frac{1}{1} = q$."
errores_frecuentes:
  - "Confundir el neutro multiplicativo (1) con el neutro aditivo (0)."
  - "Creer que multiplicar por 1 convierte la fracción en un número entero."
  - "Olvidar que $\\frac{k}{k} = 1$ para cualquier $k \neq 0$."
  - "Asumir que multiplicar una fracción negativa por 1 le cambia el signo a positivo."
  - "Pensar que multiplicar por 1 altera la irreductibilidad de la fracción."
afirmaciones_verdaderas:
  - "El uno ($1$) es el elemento neutro multiplicativo en el conjunto de los números racionales $\\mathbb{Q}$."
  - "Multiplicar cualquier número racional por 1 no altera su valor numérico ni su signo."
al_terminar_debes_ponder: |
  Debes ser capaz de identificar al uno como elemento neutro multiplicativo y utilizar su representación unitaria $\frac{k}{k}$ para justificar la equivalencia por amplificación.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
