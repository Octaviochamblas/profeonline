semantic_id: MAT.FUND.CONECTIVOS_LOGICOS.DISYUNCION_EXCLUSIVA
resumen_inicial: 'Definición, tabla de verdad y propiedades de la disyunción exclusiva ($p \oplus q$), que es verdadera cuando exactamente una sola proposición es verdadera.'
explicacion_simple: |
  La **disyunción exclusiva** (escrita en símbolos como **$p \oplus q$** o $p \ \underline{\lor} \ q$) une dos opciones con la estructura "O bien... o bien...". Funciona con la regla de exclusión estricta: para que la frase sea **Verdadera**, **exactamente una de las dos partes debe ser verdadera**. Si ambas partes son verdaderas al mismo tiempo, o si ambas son falsas al mismo tiempo, la disyunción exclusiva se vuelve **Falsa**. Por ejemplo, "Una persona está viva o bien está muerta": no se pueden dar ambos estados a la vez ni omitir ambos.

  ![Introducción didáctica: Disyunción exclusiva](/static/img/nodos/disyuncion-exclusiva-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, la **disyunción exclusiva** (o suma módulo 2) es un operador binario $\oplus: \mathcal{P} \times \mathcal{P} \to \mathcal{P}$ definido por la función veritativa booleana $f_\oplus: \{V, F\}^2 \to \{V, F\}$ tal que:
  $$v(p \oplus q) = \begin{cases} V & \text{si } v(p) \neq v(q) \\ F & \text{si } v(p) = v(q) \end{cases}$$
  En álgebra booleana sobre $\mathbb{Z}_2 = \{0, 1\}$, se expresa como la adición módulo $2$: $v(p \oplus q) = (v(p) + v(q)) \pmod 2$.

  ### Desglose simbólico
  - Símbolos equivalentes: $p \oplus q$, $p \ \underline{\lor} \ q$, $p \ \Delta \ q$.
  - Tabla de verdad canónica:
    $$\begin{array}{|c|c|c|} \hline p & q & p \oplus q \\ \hline V & V & F \\ V & F & V \\ F & V & V \\ F & F & F \\ \hline \end{array}$$
  - Equivalencia analítica: $p \oplus q \equiv (p \lor q) \land \neg(p \land q) \equiv \neg(p \leftrightarrow q)$.

  ### Síntesis didáctica
  La disyunción exclusiva es el detector de disparidad: devuelve Verdadero si los valores de entrada son diferentes entre sí ($V$ y $F$), y Falso si los valores son idénticos ($V, V$ o $F, F$).
definiciones_clave: |
  - **Disyunción exclusiva ($p \oplus q$)**: Conectivo binario que produce valor verdadero si y solo si los operandos tienen valores de verdad distintos.
  - **Diferencia simétrica proposicional**: Estructura que afirma la verdad de una u otra proposición, pero nunca de ambas simultáneamente.
  - **Negación del bicondicional**: Relación por la cual $p \oplus q \equiv \neg(p \leftrightarrow q)$.
propiedades_relaciones: |
  - **Autoinversa**: $p \oplus p \equiv F$ (cualquier proposición en disyunción exclusiva consigo misma es una contradicción).
  - **Conmutatividad y asociatividad**: Cumple $p \oplus q \equiv q \oplus p$ y $(p \oplus q) \oplus r \equiv p \oplus (q \oplus r)$.
ejemplo_guiado:
  enunciado: |
    Sean las proposiciones $p$: "$12$ es divisible por $4$" y $q$: "$12$ es divisible por $3$". Determina el valor de verdad de la disyunción exclusiva $p \oplus q$.

    ![Ejemplos prácticos: Disyunción exclusiva](/static/img/nodos/disyuncion-exclusiva-ejemplos.svg)
  pasos:
    - 'Paso 1: Evaluar la proposición simple $p$: $12 / 4 = 3$, por lo tanto $v(p) = V$.'
    - 'Paso 2: Evaluar la proposición simple $q$: $12 / 3 = 4$, por lo tanto $v(q) = V$.'
    - 'Paso 3: Aplicar la regla de la disyunción exclusiva: $v(p \oplus q) = v(V \oplus V)$.'
    - 'Paso 4: Concluir el resultado: Como ambas proposiciones son verdaderas simultáneamente ($v(p) = v(q) = V$), la disyunción exclusiva resulta Falsa: $v(p \oplus q) = F$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuándo es Verdadera ($V$) la disyunción exclusiva $p \oplus q$?'
    choices:
      - {text: 'Cuando exactamente una de las dos proposiciones es verdadera y la otra es falsa', is_correct: true}
      - {text: 'Cuando ambas proposiciones son verdaderas al mismo tiempo', is_correct: false}
      - {text: 'Cuando ambas proposiciones son falsas al mismo tiempo', is_correct: false}
      - {text: 'En todas las combinaciones posibles de su tabla de verdad', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando exactamente una de las dos proposiciones es verdadera y la otra es falsa''. La disyunción exclusiva exige disparidad en los valores de verdad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A cuál de las siguientes expresiones lógicas es equivalente la disyunción exclusiva $p \oplus q$?'
    choices:
      - {text: '$\neg(p \leftrightarrow q)$', is_correct: true}
      - {text: '$p \land q$', is_correct: false}
      - {text: '$p \lor q$', is_correct: false}
      - {text: '$p \to q$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\neg(p \leftrightarrow q)$''. El bicondicional es verdadero cuando coinciden; su negación es verdadera cuando difieren.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos proposiciones componentes $p$ y $q$.'
  - 'Paso 2: Evaluar el valor de verdad individual de cada proposición.'
  - 'Paso 3: Si los valores de verdad son diferentes (uno $V$ y el otro $F$), asignar $V$ a $p \oplus q$.'
  - 'Paso 4: Si los valores de verdad son iguales (ambos $V$ o ambos $F$), asignar $F$ a $p \oplus q$.'
errores_correccion: |
  - **Error 1:** Evaluar la disyunción exclusiva como verdadera cuando ambas proposiciones son verdaderas. **Cómo corregirlo:** La disyunción exclusiva excluye la coexistencia de verdad; si $v(p)=V$ y $v(q)=V$, entonces $v(p \oplus q) = F$.
  - **Error 2:** No distinguir el "o" simple del "o bien... o bien...". **Cómo corregirlo:** En lenguaje natural, "o bien $A$ o bien $B$" señala exclusión mutua ($\oplus$), mientras que "A o B" habitualmente es inclusivo ($\lor$).
ejemplos:
  - titulo: 'Disyunción exclusiva con valores distintos'
    enunciado: '¿Cuál es el valor de verdad de "$5 > 2 \oplus 5 < 2$"?'
    alternativas:
      - 'Verdadero ($V$)'
      - 'Falso ($F$)'
      - 'Indeterminado'
    respuesta: 'Verdadero ($V$)'
    solucion_pasos:
      - '1. $5 > 2$ es $V$.'
      - '2. $5 < 2$ es $F$.'
      - '3. $V \oplus F = V$.'
  - titulo: 'Disyunción exclusiva de dos verdades'
    enunciado: 'Si $v(p) = V$ y $v(q) = V$, ¿cuánto vale $v(p \oplus q)$?'
    alternativas:
      - 'Falso ($F$)'
      - 'Verdadero ($V$)'
      - 'Nulo'
    respuesta: 'Falso ($F$)'
    solucion_pasos:
      - '1. Al coincidir ambos en $V$, la exclusión no se cumple.'
      - '2. $V \oplus V = F$.'
  - titulo: 'Disyunción exclusiva consigo misma'
    enunciado: '¿Es $p \oplus p$ siempre una contradicción ($F$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, pues una proposición siempre tiene el mismo valor que ella misma ($V \oplus V = F$ y $F \oplus F = F$).'
  - titulo: 'Relación con el bicondicional'
    enunciado: '¿La tabla de verdad de $p \oplus q$ es exactamente la opuesta a la de $p \leftrightarrow q$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, $p \oplus q \equiv \neg(p \leftrightarrow q)$.'
errores_frecuentes:
  - 'La afirmación de que la disyunción exclusiva es verdadera cuando ambas proposiciones componentes son verdaderas.'
  - 'La afirmación de que la disyunción exclusiva es idéntica en tabla de verdad a la disyunción inclusiva.'
  - 'La afirmación de que la fórmula $p \oplus p$ resulta en una tautología siempre verdadera.'
  - 'La afirmación de que la disyunción exclusiva es verdadera cuando ambas proposiciones son falsas.'
  - 'La afirmación de que la disyunción exclusiva no es conmutativa.'
afirmaciones_verdaderas:
  - 'La disyunción exclusiva $p \oplus q$ es verdadera si y solo si exactamente una de las proposiciones es verdadera y la otra es falsa ($v(p) \neq v(q)$).'
  - 'La disyunción exclusiva es lógicamente equivalente a la negación del bicondicional: $p \oplus q \equiv \neg(p \leftrightarrow q)$.'
al_terminar_debes_poder: |
  QUÉ: Definir, evaluar y formalizar la disyunción exclusiva ($p \oplus q$).
  CÓMO: Aplicar el criterio de disparidad veritativa ($V \oplus F = V, F \oplus V = V, V \oplus V = F, F \oplus F = F$) y distinguirla de la disyunción inclusiva.

  ![Cuadro resumen: Disyunción exclusiva](/static/img/nodos/disyuncion-exclusiva-resumen.svg)
