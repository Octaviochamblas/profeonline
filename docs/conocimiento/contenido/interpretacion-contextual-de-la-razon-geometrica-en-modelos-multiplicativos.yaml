resumen_inicial: La interpretación contextual de la razón geométrica $r$ identifica
  su significado como el factor de duplicación, triplicación o tasa de retención por
  período en un problema real.
explicacion_simple: 'En un problema real, la razón $r$ nos dice qué le pasa a la cantidad
  en cada paso: si $r=2$ la cantidad se duplica en cada período; si $r=0,5$ la cantidad
  se reduce a la mitad en cada etapa.'
explicacion_formal: 'En aplicaciones prácticas, la **Razón Geométrica $r$** representa
  el escalador multiplicativo dimensional por unidad de tiempo:


  $$r = \frac{\text{Población en período } n+1}{\text{Población en período } n}$$


  **Interpretación de valores característicos:**

  - $r = 2$: Tiempo de duplicación por período.

  - $r = 0,5$: Vida media o tiempo de semidesintegración.'
definiciones_clave: '- **Interpretación de $r$ en contexto**: Factor multiplicativo
  físico o demográfico por período.'
propiedades_relaciones: '- **Factor de amplificación/atenuación**: Escala la magnitud
  del sistema en cada iteración.'
ejemplo_guiado:
  enunciado: Un medicamento en sangre se reduce a la mitad cada $4$ horas ($r = 0,5$).
    Si la dosis inicial es de $100\text{ mg}$, interprete la razón $r$.
  pasos:
  - 'Paso 1: La razón $r = 0,5$ indica que cada etapa retiene el $50\%$ de la cantidad
    previa.'
  - 'Paso 2: Al cabo de $4$ horas quedarán $50\text{ mg}$; a las $8$ horas quedarán
    $25\text{ mg}$.'
  - 'Conclusión: La razón $r=0,5$ representa el factor de atenuación o vida media
    del fármaco.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué indica una razón geométrica r = 0,5 en un contexto de desintegración
    o fármacos?
  choices:
  - text: Indica que en cada período la cantidad presente se reduce a la mitad (vida
      media)
    is_correct: true
  - text: Indica que la cantidad se duplica
    is_correct: false
  - text: Indica que la cantidad aumenta en 0,5 unidades
    is_correct: false
  - text: Indica que no hay cambios en la cantidad
    is_correct: false
  explanation: La alternativa correcta es 'Indica que en cada período la cantidad
    presente se reduce a la mitad (vida media)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 100 mg de medicamento con r = 0,5, ¿cuántos
    mg quedan al cabo de 2 períodos (8 horas)?
  choices:
  - text: 25 mg
    is_correct: true
  - text: 50 mg
    is_correct: false
  - text: 12,5 mg
    is_correct: false
  - text: 0 mg
    is_correct: false
  explanation: La alternativa correcta es '25 mg'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de interpretar el significado físico
  o práctico de la razón geométrica $r$ como factor de amplificación o atenuación
  por etapa.
semantic_id: MAT.NUM.PROG_GEOMETRICA.INTERPRETACION_RAZON_CONTEXTO
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una razón multiplicativa constante
  $r = \frac{a_{n+1}}{a_n}$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 \cdot r^{n-1}$ o de la
  suma $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
- 'Paso 3: Resolver numéricamente o con logaritmos el parámetro solicitado ($a_n,
  a_1, r, n$ o $S_n$).'
errores_correccion: '- **Error 1: Elevar la razón $r$ a la potencia $n$ en lugar de
  $(n-1)$ en el término general ($a_n = a_1 \cdot r^n$).** **Cómo corregirlo:** La
  razón $r$ se aplica a partir de la segunda posición, por lo que el exponente correcto
  es $(n-1)$.


  - **Error 2: Usar la fórmula de la suma de progresión aritmética en una progresión
  geométrica.** **Cómo corregirlo:** En la P.G. la suma DEBE utilizar el factor multiplicativo
  $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_GEOMETRICA.INTERPRETACION_RAZON_CONTEXTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión geométrica.
- titulo: Ejemplo 2
  enunciado: Verificación de la razón constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} / a_n = r$.
- titulo: ¿Es constante el cociente entre términos consecutivos en una P.G.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión geométrica.
- titulo: ¿Corresponde la P.G. a una función exponencial discreta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a_n = a_1 \cdot r^{n-1}$ es una potencia de base $r$.
errores_frecuentes:
- Elevar la razón r al exponente n en lugar de multiplicar por r^(n-1) al calcular
  an.
- Restar los términos en lugar de calcular el cociente de división para determinar
  la razón r.
- Usar la fórmula del promedio de Gauss propia de la progresión aritmética en una
  progresión geométrica.
- Declarar que una razón geométrica menor que 1 genera términos negativos en la secuencia.
- Declarar la razón porcentual P% con el factor multiplicativo r = 1 + P/100.
afirmaciones_verdaderas:
- Una progresión geométrica tiene una razón constante $r = \frac{a_{n+1}}{a_n}$ entre
  términos consecutivos.
- El término general de una P.G. se calcula mediante la función exponencial $a_n =
  a_1 \cdot r^{n-1}$.
