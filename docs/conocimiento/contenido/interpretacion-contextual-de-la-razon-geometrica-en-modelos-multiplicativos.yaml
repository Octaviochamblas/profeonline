procedimiento:
- 'Paso 1: Localiza el número que está siendo elevado al exponente (la base de la
  potencia).'
- 'Paso 2: Compáralo con 1. Si es mayor a 1, hay crecimiento. Si es menor a 1, hay
  decrecimiento.'
- 'Paso 3: Resta el número a 1 (o viceversa) para descubrir el porcentaje exacto de
  cambio oculto.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en interpretación contextual de la razón geométrica en modelos multiplicativos.
ejemplos:
- titulo: Desentrañando la fórmula
  enunciado: La masa de un medicamento en la sangre se modela como M(t) = 500 * (0.6)^t.
    ¿Qué significa el 0.6?
  solucion_pasos:
  - El 0.6 es la razón geométrica.
  - Al ser menor que 1, la masa está disminuyendo.
  - En porcentaje, 0.6 es el 60%.
  - Significa que en cada unidad de tiempo 't', el paciente solo conserva el 60% del
    medicamento en su sangre (o sea, elimina un 40%).
errores_frecuentes:
- Interpretar $r = 1.20$ como 'crece un 120%' (Falso, el 1 representa la conservación
  del total original; el crecimiento neto es solo el 0.20, es decir 20%).
- Interpretar $r = 0.30$ como 'pierde un 30%' (Falso, 0.30 es lo que CONSERVA. Por
  lo tanto, pierde un 70%).
afirmaciones_verdaderas:
- La formulación de interpretación contextual de la razón geométrica en modelos multiplicativos
  mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando interpretación contextual
