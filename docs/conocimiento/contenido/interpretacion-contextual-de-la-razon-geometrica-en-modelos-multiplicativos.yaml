semantic_id: MAT.NUM.PROG_GEOMETRICA.INTERPRETACION_RAZON_CONTEXTO
resumen_inicial: 'La interpretación contextual de la razón geométrica $r$ analiza su significado como factor de escala y tasa relativa de cambio, identificando si representa amplificación ($r > 1$), atenuación ($0 < r < 1$) o alternancia ($r < 0$).'
explicacion_simple: |
  En problemas de la vida real, la **razón geométrica** ($r$) es un multiplicador adimensional que nos dice cómo cambia una cantidad en cada etapa:
  - Si $r = 2$: la cantidad **se duplica** en cada paso (aumento del $100\%$).
  - Si $r = 1,05$: la cantidad **aumenta un $5\%$** en cada paso.
  - Si $r = 0,5$: la cantidad **se reduce a la mitad** en cada paso (pérdida del $50\%$).
  - Si $r = 0,80$: la cantidad **conserva el $80\%$** de su valor (disminución del $20\%$).
  - La razón $r$ no lleva signos pesos ni unidades físicas: es una **proporción pura** que multiplica a la magnitud anterior.

  ![Interpretación contextual de la razón geométrica](/static/img/nodos/interpretacion-contextual-de-la-razon-geometrica-en-modelos-multiplicativos-intro.svg)
explicacion_formal: |
  ### Definición formal y Análisis Adimensional
  La **razón geométrica ($r$)** en modelos aplicados se define como el cociente de dos estados consecutivos de una misma magnitud $Y$:
  $$r = \frac{Y(t+1)}{Y(t)} \quad [\text{Adimensional: } \text{Unidad de } Y / \text{Unidad de } Y = 1]$$

  ### Espectro Semántico de la Razón Geométrica ($r > 0$)
  - **$r > 1$ (Régimen de Expansión / Crecimiento)**:
    - Factor de amplificación: $Y(t+1) > Y(t)$.
    - Tasa porcentual de incremento: $p = (r - 1) \cdot 100\%$.
  - **$r = 1$ (Régimen Estacionario / Invariante)**:
    - Conservación estricta de la magnitud: $Y(t+1) = Y(t)$.
  - **$0 < r < 1$ (Régimen de Atenuación / Decaimiento)**:
    - Factor de reducción o retención: $Y(t+1) < Y(t)$.
    - Tasa porcentual de pérdida: $p = (1 - r) \cdot 100\%$.

  ### Diferenciación con la Diferencia Común ($d$) de la PA
  - La diferencia común $d$ tiene dimensiones físicas compuestas ($[Y]/[t]$) y opera de forma aditiva constante.
  - La razón $r$ es un escalar puro adimensional que actúa de forma proporcional escalada.

  ### Síntesis didáctica
  - Escala: $r > 1$ (Expansión), $0 < r < 1$ (Atenuación).
  - Conversión a tasa: Variación $\% = (r - 1) \cdot 100\%$.
definiciones_clave: |
  - **Factor de escala**: Número real por el cual se multiplica una dimensión o magnitud para cambiar su tamaño relativo.
  - **Porcentaje de retención**: Proporción $r \cdot 100\%$ que permanece tras un proceso de filtrado o descuento.
  - **Adimensionalidad**: Propiedad física donde las unidades del numerador y denominador se cancelan exactamente.
propiedades_relaciones: |
  - **Composición multiplicativa**: Si un proceso pasa por $k$ etapas sucesivas con razón $r$, el factor de escala global acumulado es exactamente $r^k$.
  - **Simetría multiplicativa**: Un incremento por un factor $r$ se anula exactamente mediante un factor inverso $\frac{1}{r}$.
ejemplo_guiado:
  enunciado: 'Un sistema de purificación de agua pasa por una serie de filtros. Cada filtro retiene el $25\%$ de las impurezas que ingresan. Interpreta contextualmente la razón geométrica $r$ de las impurezas que atraviesan el sistema y calcula la proporción de impurezas restantes tras pasar por 3 filtros consecutivos.'
  imagen: '/static/img/nodos/interpretacion-contextual-de-la-razon-geometrica-en-modelos-multiplicativos-ejemplos.svg'
  pasos:
    - 'Paso 1: Si cada filtro retiene el $25\%$, deja pasar el $100\% - 25\% = 75\%$ de las impurezas.'
    - 'Paso 2: La razón geométrica es el factor de paso: $r = 1 - 0,25 = 0,75$ (adimensional).'
    - 'Paso 3: Interpretación: cada filtro multiplica las impurezas por $0,75$ (reducción del $25\%$ por etapa).'
    - 'Paso 4: Tras 3 filtros consecutivos ($t = 3$), el factor acumulado es $r^3 = (0,75)^3 = 0,421875$.'
    - 'Paso 5: Conclusión: Tras 3 filtros queda el **$42,19\%$** de las impurezas originales.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en un modelo biológico la razón geométrica de una población es $r = 1,15$, ¿cuál es la interpretación porcentual del cambio por período?'
    choices:
      - {text: 'La población experimenta un aumento del $15\%$ en cada período', is_correct: true}
      - {text: 'La población aumenta en $115$ individuos constantes', is_correct: false}
      - {text: 'La población experimenta un aumento del $115\%$', is_correct: false}
      - {text: 'La población disminuye un $15\%$', is_correct: false}
    explanation: 'La alternativa correcta es ''La población experimenta un aumento del $15\%$ en cada período''. El incremento porcentual se obtiene mediante $(1,15 - 1) \cdot 100\% = 15\%$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la razón geométrica $r$ es una magnitud adimensional (sin unidades de medida)?'
    choices:
      - {text: 'Porque se calcula dividiendo dos cantidades que tienen la misma unidad de medida, cancelándose entre sí', is_correct: true}
      - {text: 'Porque las razones nunca se pueden medir en el mundo real', is_correct: false}
      - {text: 'Porque siempre es igual a un número entero', is_correct: false}
      - {text: 'Porque se expresa en porcentaje', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque se calcula dividiendo dos cantidades que tienen la misma unidad de medida, cancelándose entre sí''. Al dividir metros por metros o dinero por dinero, las unidades se simplifican.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el factor multiplicativo $r$ en el enunciado.'
  - 'Paso 2: Si $r > 1$, calcular el porcentaje de aumento: $(r - 1) \cdot 100\%$.'
  - 'Paso 3: Si $0 < r < 1$, calcular el porcentaje de disminución: $(1 - r) \cdot 100\%$.'
  - 'Paso 4: Redactar la interpretación contextual destacando el comportamiento relativo por etapa.'
errores_correccion: |
  - **Error 1:** Interpretar $r = 1,30$ como un incremento del $130\%$. **Cómo corregirlo:** El incremento sobre el valor base es **$(1,30 - 1) \cdot 100\% = 30\%$**.
  - **Error 2:** Asignar unidades de medida físicas a la razón geométrica (escribir $r = 2\text{ metros}$). **Cómo corregirlo:** La razón $r$ es un **cociente adimensional puro** (se escribe simplemente $r = 2$).
ejemplos:
  - titulo: 'Interpretación de razón mayor a 1'
    enunciado: 'Un cultivo celular tiene $r = 1,40$ por hora. ¿Cuál es el porcentaje de crecimiento horario?'
    alternativas:
      - '$40\%$ de crecimiento por hora'
      - '$140\%$ de crecimiento por hora'
      - '$4\%$ de crecimiento por hora'
    respuesta: '$40\%$ de crecimiento por hora'
    solucion_pasos:
      - '1. $(1,40 - 1) \cdot 100\% = 0,40 \cdot 100\% = 40\%$.'
  - titulo: 'Interpretación de razón menor a 1'
    enunciado: 'La intensidad de la luz al atravesar un cristal polarizado tiene $r = 0,85$. ¿Cuánta luz se absorbe?'
    alternativas:
      - 'Se absorbe el $15\%$ de la luz'
      - 'Se absorbe el $85\%$ de la luz'
      - 'Se absorbe el $8,5\%$ de la luz'
    respuesta: 'Se absorbe el $15\%$ de la luz'
    solucion_pasos:
      - '1. Pasa el $85\% \implies$ se absorbe $100\% - 85\% = 15\%$.'
  - titulo: 'Adimensionalidad de la razón'
    enunciado: '¿La razón geométrica $r$ calculada entre dos montos de dinero en pesos carece de unidades monetarias?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Pesos dividido por pesos da un valor adimensional.'
  - titulo: 'Efecto de amplificación'
    enunciado: '¿Una razón $r = 3$ indica que cada etapa triplica la cantidad de la etapa anterior?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $Y(t+1) = 3 \cdot Y(t)$.'
errores_frecuentes:
  - 'Interpretar un factor de escala $r = 1,20$ como un crecimiento del ciento veinte por ciento.'
  - 'Asignar unidades de medida aditivas compuestas a la razón geométrica.'
  - 'Confundir el porcentaje restante $r \cdot 100\%$ con el porcentaje que se pierde $(1-r) \cdot 100\%$.'
  - 'Asumir que una razón $r < 1$ produce valores numéricos negativos en la magnitud.'
  - 'La razón geométrica entre dos términos de una misma magnitud física depende del sistema de unidades utilizado.'
afirmaciones_verdaderas:
  - 'La razón geométrica $r$ es un escalar adimensional puro que cuantifica el factor de escala relativo entre dos estados consecutivos de un sistema.'
  - 'Un valor de razón $r = 1 + i$ corresponde a un incremento porcentual relativo de $i \cdot 100\%$ por período.'
