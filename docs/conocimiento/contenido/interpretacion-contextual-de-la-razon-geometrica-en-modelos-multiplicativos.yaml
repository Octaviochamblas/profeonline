semantic_id: MAT.NUM.PROG_GEOMETRICA.INTERPRETACION_RAZON_CONTEXTO
resumen_inicial: 'La interpretación contextual de la razón geométrica asigna un significado físico, financiero o práctico a la constante $r = \frac{a_{n+1}}{a_n}$, representando la tasa de escala o factor multiplicativo por período.'
explicacion_simple: |
  En los problemas del mundo real, la **razón geométrica ($r$)** nos indica cómo evoluciona la cantidad en proporción:
  - **$r = 2$**: La cantidad **se duplica** en cada período.
  - **$r = 3$**: La cantidad **se triplica** en cada período.
  - **$r = 1,05$**: La cantidad **aumenta un $5\%$** en cada período.
  - **$r = 0,5 = 1/2$**: La cantidad **se reduce a la mitad** en cada período (vida media o semidesintegración).
  - **$r = 0,80$**: La cantidad **se conserva en un $80\%$** (pierde un $20\%$) en cada período.
explicacion_formal: |
  ### Definición formal
  En un modelo de progresión geométrica contextualizado $y(n) = a_1 \cdot r^{n-1}$, el parámetro de **razón geométrica $r$** representa el operador de escala multiplicativa por período de tiempo:
  $$r = \frac{y(n+1)}{y(n)} \quad \left[\text{Adimensional o Factor de Escala}\right]$$

  ### Matriz de Interpretación Contextual según $r$
  | Valor de $r$ | Porcentaje Equivalente | Significado Práctico / Contextual |
  | :--- | :--- | :--- |
  | **$r > 1$** (ej: $r = 1,12$) | Aumento del $+12\%$ | Crecimiento constante, inflación, ganancias de interés |
  | **$r = 2$** | Aumento del $+100\%$ | Duplicación periódica (bacterias, células) |
  | **$0 < r < 1$** (ej: $r = 0,75$) | Disminución del $-25\%$ | Retención del 75%, depreciación, atenuación de señal |
  | **$r = 0,5$** | Disminución del $-50\%$ | Semidesintegración radiactiva, pérdida de la mitad |
  | **$r = 1$** | Sin variación ($0\%$) | Estado estacionario conservativo |

  ### Síntesis didáctica
  - $r > 1 \implies$ Crecimiento por factor $r$.
  - $0 < r < 1 \implies$ Conservación de la fracción $r$ del período anterior.
definiciones_clave: |
  - **Factor de escala ($r$)**: Multiplicador adimensional que relaciona dos estados consecutivos.
  - **Período de semidesintegración ($r = 0,5$)**: Intervalo de tiempo necesario para que la cantidad inicial se reduzca al 50%.
  - **Porcentaje de retención ($r \cdot 100\%$)**: Porcentaje de la cantidad anterior que sobrevive o permanece en el nuevo período.
propiedades_relaciones: |
  - **Conversión a variación porcentual $P\%$**:
    $$P\% = (r - 1) \cdot 100\%$$
    - Si $r = 1,25 \implies P\% = (1,25 - 1) \cdot 100\% = +25\%$.
    - Si $r = 0,70 \implies P\% = (0,70 - 1) \cdot 100\% = -30\%$.
ejemplo_guiado:
  enunciado: 'Un medicamento se elimina del cuerpo de modo que la cantidad retenida sigue una progresión geométrica con razón $r = 0,80$. Si el paciente ingiere una dosis inicial de $100$ mg ($n=1$), interpreta el significado de $r = 0,80$ y calcula la cantidad retenida en el cuerpo tras 3 horas ($n=4$).'
  pasos:
    - 'Paso 1: Interpretamos $r = 0,80$: Significa que en cada hora el cuerpo **retiene el $80\%$** del medicamento presente en la hora anterior (o elimina el $20\%$).'
    - 'Paso 2: Identificamos los datos: $a_1 = 100$ mg, $r = 0,80$ y la hora 3 corresponde a la etapa $n = 4$.'
    - 'Paso 3: Evaluamos con el término general: $a_4 = 100 \cdot (0,80)^{4-1} = 100 \cdot (0,80)^3$.'
    - 'Paso 4: Calculamos: $(0,80)^3 = 0,512 \implies a_4 = 100 \cdot 0,512 = 51,2$ mg. El cuerpo retiene el **$80\%$** cada hora y tras 3 horas quedan **$51,2$ mg**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un problema de devaluación de una moneda donde la razón geométrica es $r = 0,92$, ¿cuál es la interpretación porcentual correcta de este parámetro?'
    choices:
      - {text: 'La moneda conserva el $92\%$ de su valor anterior, lo que equivale a una devaluación del $8\%$ en cada período', is_correct: true}
      - {text: 'La moneda pierde un $92\%$ de su valor en cada período', is_correct: false}
      - {text: 'La moneda aumenta su valor en un $92\%$ en cada período', is_correct: false}
      - {text: 'El valor de la moneda es de 92 pesos exactamente', is_correct: false}
    explanation: 'La alternativa correcta es ''La moneda conserva el $92\%$ de su valor anterior, lo que equivale a una devaluación del $8\%$ en cada período''. $P\% = (0,92 - 1) \cdot 100\% = -8\%$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una especie invasora se triplica cada año, ¿cuál es la razón geométrica $r$ de su modelo y su tasa de variación porcentual $P\%$?'
    choices:
      - {text: 'La razón geométrica es $r = 3$ y su tasa de variación porcentual es $+200\%$ por año', is_correct: true}
      - {text: 'La razón geométrica es $r = 3$ y su tasa es $+300\%$ por año', is_correct: false}
      - {text: 'La razón geométrica es $r = 1,3$ y su tasa es $+30\%$ por año', is_correct: false}
      - {text: 'La razón geométrica es $r = 300$ y su tasa es $+3\%$ por año', is_correct: false}
    explanation: 'La alternativa correcta es ''La razón geométrica es $r = 3$ y su tasa de variación porcentual es $+200\%$ por año''. $P\% = (3 - 1) \cdot 100\% = 200\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el valor numérico de la razón geométrica $r$.'
  - 'Paso 2: Si $r > 1$, restar 1 y multiplicar por 100 para obtener el porcentaje de aumento ($P\% = (r-1) \cdot 100\%$).'
  - 'Paso 3: Si $0 < r < 1$, restar de 1 y multiplicar por 100 para obtener el porcentaje de reducción (pérdida de $(1-r) \cdot 100\%$).'
  - 'Paso 4: Redactar la explicación contextual relacionando la tasa de cambio con el fenómeno real estudiado.'
errores_correccion: |
  - **Error 1:** Confundir el porcentaje de retención $r \cdot 100\%$ con el porcentaje de pérdida $(1-r) \cdot 100\%$. **Cómo corregirlo:** Si $r = 0,70$, la cantidad **retiene el 70%** y por ende **pierde el 30%**.
  - **Error 2:** Creer que triplicar significa aumentar un 300%. **Cómo corregirlo:** Triplicar ($r=3$) significa que la nueva cantidad es el 300%, lo que representa un **AUMENTO DEL 200%**: $(3-1) \cdot 100\% = 200\%$.
ejemplos:
  - titulo: 'Interpretación de duplicación'
    enunciado: 'Si $r = 2$, ¿significa que la cantidad se duplica en cada período, aumentando un $100\%$?'
    alternativas:
      - 'Sí, $r=2 \implies (2-1) \cdot 100\% = +100\%$'
      - 'No, aumenta un 200%'
      - 'No, aumenta un 2%'
    respuesta: 'Sí, $r=2 \implies (2-1) \cdot 100\% = +100\%$'
    solucion_pasos:
      - '1. Razón $r = 2$.'
      - '2. Aumento porcentual: $(2 - 1) \cdot 100\% = 100\%$.'
  - titulo: 'Interpretación de semidesintegración'
    enunciado: 'Si en un laboratorio $r = 0,5$, ¿la muestra pierde el 50% de su masa en cada ciclo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Retiene el 50% y pierde el 50%.'
  - titulo: 'Interpretación de r = 1,15'
    enunciado: 'Si $r = 1,15$, ¿significa un incremento del 15% por período?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1,15 - 1) \cdot 100\% = +15\%$.'
  - titulo: 'Interpretación de r = 0,90'
    enunciado: 'Si $r = 0,90$, ¿significa un descuento del 10% por período?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1 - 0,90) \cdot 100\% = 10\%$ de descuento.'
errores_frecuentes:
  - 'La razón de retención $r$ equivale cuantitativamente a la tasa de pérdida o descuento porcentual.'
  - 'Una razón geométrica menor que 1 genera términos negativos en la secuencia.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Equiparar la razón de triplicación $r=3$ a un aumento del 300% en lugar del 200%.'
  - 'Considerar que las razones fraccionarias representan reducciones en forma de resta lineal constante.'
afirmaciones_verdaderas:
  - 'La razón geométrica $r$ expresa el factor multiplicativo por el cual se escala una magnitud de un período al siguiente.'
  - 'Una razón $r = 1 + \frac{P}{100}$ indica un aumento del $P\%$, mientras que $r = 1 - \frac{P}{100}$ indica una disminución del $P\%$.'
al_terminar_debes_poder: 'Interpretar el significado contextual y la equivalencia porcentual de la razón geométrica $r$ en modelos multiplicativos.'
