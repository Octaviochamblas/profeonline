semantic_id: MAT.NUM.PROG_GEOMETRICA.INTERPRETACION_RAZON_CONTEXTO
resumen_inicial: 'Interpretación contextual de la razón geométrica en modelos multiplicativos:
  concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: Si lees que la fórmula de una pandemia es $Infectados = 100 \cdot
  (2.5)^t$, el número 2.5 no es un adorno matemático, es una alerta roja. Descubramos
  qué nos grita la razón geométrica sobre el comportamiento del mundo.
explicacion_formal: 'Cada vez que en la prueba aparezca un modelo del tipo $A \cdot
  (b)^t$, concéntrate en la base de la potencia ''$b$'' (que es nuestra razón ''$r$'').


  1. **¿Qué nos dice si $r = 3$?** Significa que la cantidad (de bacterias, de dinero,
  de rumores) se está **triplicando** en cada unidad de tiempo. Es un crecimiento
  del $200\%$.

  2. **¿Qué nos dice si $r = 1.04$?** Significa que por cada paso, la cantidad retiene
  su $100\%$ (el número 1) y suma un $0.04$ extra. Es decir, crece un **$4\%$ por
  periodo**.

  3. **¿Qué nos dice si $r = 0.85$?** Significa que por cada paso solo retiene el
  $85\%$ de lo que tenía antes. Por ende, está perdiendo un **$15\%$ por periodo**.


  En conclusión: la razón ''r'' te da la ''velocidad y dirección'' del crecimiento
  exponencial.'
definiciones_clave: '- **Interpretación contextual de la razón geométrica en modelos
