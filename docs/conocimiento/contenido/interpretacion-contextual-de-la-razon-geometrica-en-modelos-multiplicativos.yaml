procedimiento:
- 'Paso 1: Localiza el número que está siendo elevado al exponente (la base de la potencia).'
- 'Paso 2: Compáralo con 1. Si es mayor a 1, hay crecimiento. Si es menor a 1, hay decrecimiento.'
- 'Paso 3: Resta el número a 1 (o viceversa) para descubrir el porcentaje exacto de cambio
  oculto.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en interpretación contextual de la razón geométrica en modelos multiplicativos.
ejemplos:
- titulo: Desentrañando la fórmula
  enunciado: La masa de un medicamento en la sangre se modela como M(t) = 500 * (0.6)^t. ¿Qué
    significa el 0.6?
  solucion_pasos:
  - El 0.6 es la razón geométrica.
  - Al ser menor que 1, la masa está disminuyendo.
  - En porcentaje, 0.6 es el 60%.
  - Significa que en cada unidad de tiempo 't', el paciente solo conserva el 60% del medicamento
    en su sangre (o sea, elimina un 40%).
- titulo: Ejemplo 1
  enunciado: En A(t) igual a 50 por 1,10 elevado a t, ¿qué representa el 1,10?
  alternativas:
  - Un crecimiento del 10 por ciento por periodo
  - Un crecimiento del 110 por ciento por periodo
  - La cantidad inicial
  respuesta: Un crecimiento del 10 por ciento por periodo
  solucion_pasos:
  - 1,10 menos 1 es igual a 0,10, es decir un 10 por ciento de crecimiento.
- titulo: Ejemplo 2
  enunciado: En B(t) igual a 800 por 0,75 elevado a t, ¿qué representa el 0,75?
  alternativas:
  - Una pérdida del 25 por ciento por periodo
  - Una pérdida del 75 por ciento por periodo
  - Un crecimiento del 75 por ciento por periodo
  respuesta: Una pérdida del 25 por ciento por periodo
  solucion_pasos:
  - 0,75 es lo que se conserva; 1 menos 0,75 es igual a 0,25, o sea una pérdida del 25 por
    ciento.
- titulo: ¿Un valor de r menor que 1 siempre representa una disminución en el contexto?
  respuesta: Sí
  solucion_pasos:
  - Un cociente menor que 1 significa que la cantidad se reduce en cada periodo.
- titulo: ¿Es correcto decir que r igual a 2 representa un crecimiento del 200 por ciento?
  respuesta: 'No'
  solucion_pasos:
  - r igual a 2 representa que la cantidad se duplica, es decir un crecimiento del 100 por
    ciento, ya que 2 menos 1 es igual a 1.
errores_frecuentes:
- Interpretar $r = 1.20$ como 'crece un 120%' (Falso, el 1 representa la conservación del
  total original; el crecimiento neto es solo el 0.20, es decir 20%).
- Interpretar $r = 0.30$ como 'pierde un 30%' (Falso, 0.30 es lo que CONSERVA. Por lo tanto,
  pierde un 70%).
- Interpretar r igual a 1,5 como un crecimiento del 150 por ciento, en vez del 50 por ciento
  correcto.
- Interpretar r igual a 0,4 como una pérdida del 40 por ciento, en vez del 60 por ciento correcto,
  ya que 0,4 es lo que se conserva.
- No mencionar las unidades del contexto al dar la interpretación, como usuarios por mes o
  bacterias por hora.
afirmaciones_verdaderas:
- La formulación de interpretación contextual de la razón geométrica en modelos multiplicativos
  mantiene la regularidad de la sucesión.
- Cuando la razón r es mayor que 1, el porcentaje de crecimiento se obtiene restando 1 a r.
