ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'un número n aumentado en 12'?
  alternativas:
  - n + 12
  - 12n
  - n - 12
  - n^12
  respuesta: n + 12
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo n + 12.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de un número aumentado
    en una cantidad 'un número n aumentado en 12'?
  alternativas:
  - n + 12
  - 12n
  - n - 12
  - n^12
  respuesta: n + 12
  solucion_pasos:
