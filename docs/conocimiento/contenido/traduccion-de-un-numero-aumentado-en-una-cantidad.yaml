errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de un número aumentado en
  una cantidad.
- Multiplicar en lugar de dividir o restar según corresponda en un número aumentado
  en una cantidad.
- Representar la adición de términos mediante la elevación a exponentes en un número
  aumentado en una cantidad.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de un número aumentado
  en una cantidad.
afirmaciones_verdaderas:
- La expresión n + 12 representa la traducción fiel de un número aumentado en una
  cantidad.
- Las variables permiten modelar cualquier caso en un número aumentado en una cantidad.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre un número
  aumentado en una cantidad construyendo la expresión algebraica n + 12 de manera
