semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.NUMERO_AUMENTADO
resumen_inicial: La traducción de un número aumentado en una cantidad consiste en expresar la adición escalar de una constante o variable a una expresión previa utilizando el operador aditivo $+$.
explicacion_simple: "Expresar un **número aumentado en una cantidad** significa **añadir o sumar** una cifra a un valor inicial:\n- En español, la palabra **\"aumentado en\"** equivale exactamente a realizar una **suma ($+$)**.\n- Estructura: `[Cantidad inicial] + [Cantidad que aumenta]`.\n- Ejemplos:\n  - \"Un número $x$ aumentado en $7$\" $\\implies **x + 7**$.\n  - \"El triple de un número $a$ aumentado en $10$\" $\\implies **3a + 10**$.\n  - \"Una cantidad $m$ aumentada en otra cantidad $n$\" $\\implies **m + n**$.\n- Como la adición es conmutativa, $x + 7$ y $7 + x$ dan el mismo resultado numérico.\n\n![Número Aumentado en una Cantidad](/static/img/nodos/traduccion-de-un-numero-aumentado-en-una-cantidad-intro.svg)\n"
explicacion_formal: '### Definición formal

  La traducción de un **incremento o aumento aditivo** mapea una expresión base $A \in \mathbb{R}[x]$ y un incremento $k \in \mathbb{R}$ mediante el operador de adición $+$:


  $$\Phi(\text{"}A \text{ aumentado en } k\text{"}) = A + k$$


  ### Equivalencia Semántica con Otras Expresiones Aditivas


  $$\begin{array}{|c|c|}

  \hline

  \text{\textbf{Frase verbal (Lenguaje Natural)}} & \text{\textbf{Traducción algebraica}} \\

  \hline

  x \text{ aumentado en } k & x + k \\

  x \text{ incrementado en } k & x + k \\

  k \text{ unidades más que } x & x + k \\

  \text{La suma de } x \text{ y } k & x + k \\

  \hline

  \end{array}$$


  ### Síntesis didáctica

  El concepto de aumento rige las ecuaciones de crecimiento, desplazamientos en gráficas de funciones y variaciones temporales acumulativas.

  '
definiciones_clave: '- **Número aumentado**: Expresión $x + k$ que resulta de sumar una constante o variable $k$ a una cantidad inicial $x$.

  - **Incremento aditivo ($k$)**: Cantidad sumada que genera el aumento de la magnitud original.

  - **Operador de aumento ($+$)**: Signo más que ejecuta el incremento sobre la cantidad base.

  '
propiedades_relaciones: '- **Preservación aditiva**: Aumentar una cantidad en cero ($x + 0 = x$) no modifica el valor inicial (neutro aditivo).

  - **Aumento de funciones compuestas**: "El cuadrado de $x$ aumentado en 5" $\implies x^2 + 5$.

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El doble de la edad de Pedro ($p$) aumentada en quince años".'
  pasos:
  - 'Paso 1: Identificamos la cantidad base: "El doble de la edad de Pedro" $\implies 2p$.'
  - 'Paso 2: Identificamos el incremento verbal: "aumentada en quince años" $\implies + 15$.'
  - 'Paso 3: Unimos la cantidad base con el incremento: $2p + 15$.'
  - 'Conclusión: La expresión traducida es **$2p + 15$**.'
  imagen: /static/img/nodos/traduccion-de-un-numero-aumentado-en-una-cantidad-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operador matemático traduce directamente las palabras verbales "aumentado en" o "incrementado en"?
  choices:
  - text: El operador de adición o suma ($+$)
    is_correct: true
  - text: El operador de división ($/$)
    is_correct: false
  - text: El operador de radicación ($\sqrt{}$)
    is_correct: false
  - text: El operador de exponenciación ($^x$)
    is_correct: false
  explanation: La alternativa correcta es 'El operador de adición o suma ($+$)'. "Aumentado en" significa sumar.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cómo se traduce al lenguaje algebraico "El cuadrado de un número $n$ aumentado en cuatro"? '
  choices:
  - text: Se traduce como la expresión $n^2 + 4$
    is_correct: true
  - text: Se traduce como la expresión $(n + 4)^2$
    is_correct: false
  - text: Se traduce como la expresión $2n + 4$
    is_correct: false
  - text: Se traduce como la expresión $\frac{n}{2} + 4$
    is_correct: false
  explanation: La alternativa correcta es 'Se traduce como la expresión $n^2 + 4$'. "El cuadrado de $n$" es $n^2$, "aumentado en cuatro" suma 4.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cantidad o expresión inicial que recibe el aumento.'
- 'Paso 2: Reconocer la frase conector "aumentado en" o "incrementado en".'
- 'Paso 3: Identificar la cifra o variable que se agrega.'
- 'Paso 4: Escribir la expresión inicial seguida del signo $+$ y el incremento.'
errores_correccion: '- **Error 1:** Escribir $(x + 4)^2$ para "el cuadrado de $x$ aumentado en 4" ($x^2 + 4$). **Cómo corregirlo:** En "el cuadrado de $x$ aumentado en 4", el aumento se hace **DESPUÉS de elevar $x$ al cuadrado** ($x^2 + 4$).

  - **Error 2:** Usar multiplicación en lugar de suma (escribir $7x$ para " $x$ aumentado en 7"). **Cómo corregirlo:** "Aumentado en 7" **SUMA 7 ($x + 7$)**; no multiplica.

  '
ejemplos:
- titulo: Aumento simple
  enunciado: ¿Cuál es la traducción de "Un número $y$ aumentado en doce"?
  alternativas:
  - $y + 12$
  - $12y$
  - $y - 12$
  respuesta: $y + 12$
  solucion_pasos:
  - '1. Cantidad inicial: $y$.'
  - '2. Aumentado en 12: $+ 12$.'
  - '3. Resultado: $y + 12$.'
- titulo: Aumento sobre producto
  enunciado: ¿Cuál es la traducción de "El triple de $x$ aumentado en nueve"?
  alternativas:
  - $3x + 9$
  - $3(x + 9)$
  - $x^3 + 9$
  respuesta: $3x + 9$
  solucion_pasos:
  - 1. Triple de $x \to 3x$.
  - '2. Aumentado en 9: $+ 9$.'
  - '3. Expresión: $3x + 9$.'
- titulo: Equivalencia de conmutatividad
  enunciado: ¿Es la expresión $x + 5$ equivalente a $5 + x$ al traducir "x aumentado en 5"?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad conmutativa de la adición.
- titulo: Aumento entre variables
  enunciado: La frase "La cantidad $a$ aumentada en la cantidad $b$", ¿se traduce como $a + b$?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa la suma directa $a + b$.
errores_frecuentes:
- Multiplicar la variable por el valor del incremento escribiendo 7x al traducir x aumentado en 7.
- Intercambiar el cuadrado de un número aumentado en cuatro con el cuadrado de la suma entre n y cuatro.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Escribir una resta en lugar de una suma al traducir un número aumentado en una cantidad.
- Elevar la cantidad inicial al valor del incremento en lugar de sumarlo.
afirmaciones_verdaderas:
- La frase verbal "aumentado en" se traduce al lenguaje algebraico mediante el operador aditivo de suma +.
- La expresión A aumentada en B mantiene la validez de la propiedad conmutativa A + B = B + A.
al_terminar_debes_poder: '![Resumen de número aumentado en una cantidad](/static/img/nodos/traduccion-de-un-numero-aumentado-en-una-cantidad-resumen.svg)


  QUÉ: Traducir incrementos aditivos constantes expresados verbalmente como ''aumentado en''.


  CÓMO: Identificar la expresión base o variable ($x$) y sumar directamente la constante de incremento ($x + k$), preservando la precedencia si el aumento sigue a un múltiplo o potencia ($ax^n + k$).'
