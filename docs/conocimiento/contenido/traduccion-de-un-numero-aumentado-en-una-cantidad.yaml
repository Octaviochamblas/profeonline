semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.NUMERO_AUMENTADO
resumen_inicial: 'Traducción de un número aumentado en una cantidad: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: ¿Qué pasa si ya tienes algo guardado en una caja, y le agregas
  exactamente 5 monedas más? Aumentaste tu cantidad. Esa es una de las traducciones
  más comunes en álgebra.
explicacion_formal: '### Definición formal


  La palabra ''aumentado en'' requiere un incremento sumativo. ''Veces'' requiere
  un factor multiplicativo.


  ### Desarrollo didáctico


  Palabras clave de aumento:

  - Aumentado en

  - Incrementado en

  - Más


  Ejemplos clásicos:

  - ''Un número aumentado en ocho'': $x + 8$

  - ''Cinco incrementado en un número'': $5 + x$

  - ''La edad de Pedro aumentada en 10 años'': $P + 10$


  En la suma, el orden de los factores no altera el resultado (propiedad conmutativa),
  por lo que $x + 8$ es matemáticamente equivalente a $8 + x$.'
definiciones_clave: '- **Traducción de un número aumentado en una cantidad**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de un número aumentado en una cantidad.'
