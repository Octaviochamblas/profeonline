resumen_inicial: La traducción de un número aumentado en una cantidad en lenguaje
  algebraico vincula enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar un número aumentado en una cantidad, identificamos
  las letras que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de Un número aumentado
  en una cantidad** establece la asignación:


  $$\text{"un número n aumentado en 12"} \implies n + 12$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **Un número aumentado en una cantidad**: Representación simbólica
  en lenguaje algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: n + 12 conserva el significado
  semántico del enunciado.'
ejemplo_guiado:
  enunciado: 'Traduzca a lenguaje algebraico: ''un número n aumentado en 12''.'
  pasos:
  - 'Paso 1: Identificar las cantidades y variables.'
  - 'Paso 2: Aplicar la operación correspondiente.'
  - 'Conclusión: La expresión exacta es n + 12.'
