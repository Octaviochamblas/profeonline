semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DOMINIO
resumen_inicial: 'Determinación del dominio de la función logarítmica: conceptos,
  asíntotas, propiedades e inversidad en Análisis de la función logarítmica.'
explicacion_simple: A diferencia de la función exponencial (definida en todo $\mathbb{R}$),
  su inversa logarítmica hereda una restricción directa del recorrido de la exponencial,
  que nunca es cero ni negativo.
explicacion_formal: '### Definición formal


  Como $f(x)=\log_b(x)$ es la inversa de $g(x)=b^x$, el dominio de $f$ coincide con
  el recorrido de $g$, que es $]0,+\infty[$. Por lo tanto, $\log_b(x)$ solo está definido
  para $x>0$.


  ### Desarrollo didáctico


  El dominio restringido tiene sentido intuitivo: como ninguna potencia de una base
  positiva puede dar cero o un número negativo, no existe ningún exponente que responda
  "¿a qué potencia elevo $b$ para obtener $-3$ (o $0$)?".


  Para $f(x)=\log_2(x)$, el dominio es $]0,+\infty[$; $\log_2(-4)$ y $\log_2(0)$ no
  están definidos.'
definiciones_clave: '- **Determinación del dominio de la función logarítmica**: Concepto
  fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a determinación del dominio de la función logarítmica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de determinación
    del dominio de la función logarítmica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de determinación del dominio
    de la función logarítmica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    determinación del dominio de la función logarítmica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en determinación del dominio de la función logarítmica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el argumento de la función logarítmica.'
- 'Paso 2: Exige que ese argumento sea estrictamente positivo.'
- 'Paso 3: El dominio de la función logarítmica básica es $]0,+\infty[$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en determinación
  del dominio de la función logarítmica.
ejemplos:
- titulo: Determinación del dominio de una función logarítmica básica
  enunciado: Determina el dominio de $f(x)=\log_5(x)$.
  solucion_pasos:
  - El argumento es $x$, que debe ser positivo.
  - $\text{Dom}(f)=]0,+\infty[$.
- titulo: Verificación de un valor fuera del dominio
  enunciado: ¿Pertenece $x=-2$ al dominio de $f(x)=\log_3(x)$?
  solucion_pasos:
  - $-2$ no es positivo.
  - No, $-2$ no pertenece al dominio.
- titulo: ¿El dominio de la función logarítmica coincide con el recorrido de la función
    exponencial correspondiente?
  enunciado: ¿El dominio de la función logarítmica coincide con el recorrido de la
    función exponencial correspondiente?
  respuesta: Sí
  solucion_pasos:
  - Al ser funciones inversas, el dominio de una coincide exactamente con el recorrido
    de la otra.
- titulo: ¿El valor $x=0$ pertenece al dominio de una función logarítmica básica?
  enunciado: ¿El valor $x=0$ pertenece al dominio de una función logarítmica básica?
  respuesta: 'No'
  solucion_pasos:
  - El dominio es estrictamente positivo, $]0,+\infty[$, excluyendo el cero.
errores_frecuentes:
- Incluir el cero o valores negativos en el dominio de la función logarítmica.
- Confundir el dominio de la función logarítmica con el de la función exponencial
  (que es $\mathbb{R}$).
- No verificar la positividad del argumento cuando este es una expresión más compleja
  que $x$.
- Usar corchetes en vez de paréntesis en el extremo cero del dominio, que no se incluye.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando determinación del dominio de la función logarítmica.
