semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DOMINIO
resumen_inicial: 'El dominio de la función logarítmica es el conjunto de valores $x$ que hacen que su argumento sea estrictamente positivo: $\operatorname{Dom}(f) = \{x \in \mathbb{R} \mid \text{Argumento} > 0\}$.'
explicacion_simple: |
  El dominio de una función representa todos los números que se pueden colocar en la variable $x$ sin romper las reglas matemáticas. Como no se pueden calcular logaritmos de números negativos ni de cero, para hallar el dominio de cualquier función logarítmica tomamos todo lo que está dentro del paréntesis (el argumento) y obligamos a que sea mayor que cero ($> 0$). Resolviendo esa inecuación obtenemos el conjunto dominio.
explicacion_formal: |
  ### Definición formal
  Para una función logarítmica general $f(x) = a \cdot \log_b(g(x)) + k$, el **dominio máximo de definición real** se define analíticamente como el conjunto de nivel superior de la función argumento $g(x)$:
  $$\operatorname{Dom}(f) = \{x \in \operatorname{Dom}(g) \mid g(x) > 0\}$$

  ### Desglose por tipos de argumento
  - Argumento lineal $g(x) = cx + d$:
    - Si $c > 0 \implies cx + d > 0 \implies x > -\frac{d}{c} \implies \operatorname{Dom}(f) = ]-\frac{d}{c}, +\infty[$.
    - Si $c < 0 \implies cx + d > 0 \implies x < -\frac{d}{c} \implies \operatorname{Dom}(f) = ]-\infty, -\frac{d}{c}[$.
  - Argumento cuadrático $g(x) = x^2 - k^2 > 0 \implies \operatorname{Dom}(f) = ]-\infty, -k[ \cup ]k, +\infty[$.
  - Argumento racional $g(x) = \frac{P(x)}{Q(x)} > 0$: Resuelto mediante tabla de signos.

  ### Síntesis didáctica
  Diferenciar corchete abierto de cerrado en la cota de la asíntota: El valor que anula el argumento $x_{asint}$ jamás se incluye en el dominio. Por lo tanto, las cotas del dominio logarítmico son **siempre intervalos abiertos**.
definiciones_clave: |
  - **Dominio de la función logarítmica**: Conjunto de números reales $x$ que satisfacen la inecuación de argumento positivo.
  - **Inecuación estricta $g(x) > 0$**: Desigualdad que garantiza que el argumento no sea nulo ni negativo.
  - **Cota del dominio**: Valor fronterizo $x = x_{asint}$ que define la asíntota vertical de la función.
propiedades_relaciones: |
  - **Relación con la asíntota vertical**: La cota abierta del intervalo del dominio es exactamente la recta de la asíntota vertical $x = x_{asint}$.
  - **Dominio de la función básica**: Para la función no trasladada $f(x) = \log_b(x)$, el dominio es el intervalo abierto $\operatorname{Dom}(f) = ]0, +\infty[ = \mathbb{R}^+$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto dominio de definición real para las siguientes funciones logarítmicas: A) $f(x) = \log_2(5x - 20)$, B) $g(x) = \ln(12 - 3x)$, C) $h(x) = \log(x^2 - 9)$.'
  pasos:
    - 'Paso 1: Para $f(x) = \log_2(5x - 20)$, exigimos $5x - 20 > 0 \implies 5x > 20 \implies x > 4$. Dominio: $\operatorname{Dom}(f) = ]4, +\infty[$.'
    - 'Paso 2: Para $g(x) = \ln(12 - 3x)$, exigimos $12 - 3x > 0 \implies 12 > 3x \implies x < 4$. Dominio: $\operatorname{Dom}(g) = ]-\infty, 4[$.'
    - 'Paso 3: Para $h(x) = \log(x^2 - 9)$, exigimos $x^2 - 9 > 0 \implies (x - 3)(x + 3) > 0$.'
    - 'Paso 4: La inecuación cuadrática se satisface afuera de las raíces: $x < -3$ o $x > 3$. Dominio: $\operatorname{Dom}(h) = ]-\infty, -3[ \cup ]3, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio de definición real de la función logarítmica $f(x) = \log_3(2x + 8)$?'
    choices:
      - {text: '$\operatorname{Dom}(f) = ]-4, +\infty[$', is_correct: true}
      - {text: '$\operatorname{Dom}(f) = [-4, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Dom}(f) = ]4, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Dom}(f) = \mathbb{R} \setminus \{-4\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Dom}(f) = ]-4, +\infty[$''. Resolvemos la desigualdad estricta $2x + 8 > 0 \implies 2x > -8 \implies x > -4$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Para qué valores de $x$ está bien definida la función logarítmica $g(x) = \ln(10 - x)$?'
    choices:
      - {text: 'Para todos los números reales estrictamente menores que 10 ($x < 10$)', is_correct: true}
      - {text: 'Para todos los números reales estrictamente mayores que 10 ($x > 10$)', is_correct: false}
      - {text: 'Únicamente para $x = 10$', is_correct: false}
      - {text: 'Para todo $x \in \mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''Para todos los números reales estrictamente menores que 10 ($x < 10$)''. Exigimos $10 - x > 0 \implies 10 > x \implies x < 10$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Aislar la expresión matemática dentro del argumento de la función logarítmica.'
  - 'Paso 2: Formular la inecuación estricta: $\text{Argumento} > 0$.'
  - 'Paso 3: Resolver la inecuación despejando la variable $x$ (recordar invertir el sentido de la desigualdad si se multiplica por un número negativo).'
  - 'Paso 4: Escribir el conjunto solución como un intervalo abierto.'
errores_correccion: |
  - **Error 1:** Incluir la cota que anula el argumento en el dominio (ej: escribir $[4, +\infty[$ para $\log(x-4)$). **Cómo corregirlo:** La cota $x = 4$ anula el argumento ($\log(0)$), lo cual no existe. El intervalo debe ser estrictamente abierto $]4, +\infty[$.
  - **Error 2:** No invertir el sentido de la desigualdad al despejar cuando el coeficiente de $x$ es negativo (ej: en $6 - 2x > 0$ escribir $x > 3$). **Cómo corregirlo:** Al despejar un coeficiente negativo, el sentido de la desigualdad cambia: $-2x > -6 \implies x < 3$.
ejemplos:
  - titulo: 'Dominio de logaritmo básico'
    enunciado: '¿Cuál es el dominio de $f(x) = \log_4(x)$?'
    alternativas:
      - '$]0, +\infty[$'
      - '$[0, +\infty[$'
      - '$\mathbb{R}$'
    respuesta: '$]0, +\infty[$'
    solucion_pasos:
      - '1. Argumento $x > 0$.'
      - '2. Dominio: $\operatorname{Dom}(f) = ]0, +\infty[$.'
  - titulo: 'Dominio con desplazamiento horizontal'
    enunciado: '¿El dominio de $g(x) = \log(x - 7)$ es $]7, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exigimos $x - 7 > 0 \implies x > 7$, dando el intervalo $]7, +\infty[$.'
  - titulo: 'Dominio con coeficiente negativo'
    enunciado: '¿La función $h(x) = \ln(15 - 5x)$ tiene como dominio el intervalo $]-\infty, 3[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exigimos $15 - 5x > 0 \implies 15 > 5x \implies x < 3$, dando $]-\infty, 3[$.'
  - titulo: 'Dominio con argumento cuadrático positivo'
    enunciado: '¿La función $f(x) = \log(x^2 + 4)$ tiene como dominio a todos los números reales $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $x^2 \ge 0$ para todo $x$, $x^2 + 4 \ge 4 > 0$ siempre se cumple, luego $\operatorname{Dom}(f) = \mathbb{R}$.'
errores_frecuentes:
  - 'El dominio de la función logarítmica $f(x) = \log(x - 2)$ incluye al valor $x = 2$ en el intervalo $[2, +\infty[$.'
  - 'Al despejar el dominio de $\ln(8 - 4x) > 0$, se obtiene el intervalo $]2, +\infty[$.'
  - 'El dominio de toda función logarítmica es siempre el intervalo $]0, +\infty[$ sin importar su argumento.'
  - 'Una función logarítmica trasladada como $f(x) = \log_2(x) + 5$ cambia su dominio a $]5, +\infty[$.'
  - 'Los números reales negativos pertenecen al dominio de $f(x) = \log_b(x)$ si la base es menor que 1.'
afirmaciones_verdaderas:
  - 'El dominio de la función logarítmica $f(x) = a \cdot \log_b(P(x)) + k$ consiste en el conjunto de todos los reales $x$ que hacen que el argumento sea estrictamente positivo ($P(x) > 0$).'
  - 'La cota que anula el argumento del logaritmo define la asíntota vertical y se excluye del dominio con un intervalo abierto.'
al_terminar_debes_poder: 'Calcular el dominio de definición real de cualquier función logarítmica resolviendo la inecuación de argumento positivo.'
