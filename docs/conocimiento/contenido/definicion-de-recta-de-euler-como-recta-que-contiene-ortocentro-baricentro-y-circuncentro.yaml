semantic_id: MAT.GEO.RECTA_EULER.DEFINICION
resumen_inicial: La recta de Euler es la recta notable que pasa por el ortocentro
  ($H$), el baricentro ($G$) y el circuncentro ($O$) de cualquier triángulo no equilátero.
  El baricentro se ubica entre $H$ y $O$ cumpliendo la relación métrica $HG = 2 \cdot
  GO$.
explicacion_simple: '![Recta de Euler](/static/img/nodos/definicion-de-recta-de-euler-como-recta-que-contiene-ortocentro-baricentro-y-circuncentro-intro.svg)


  Leonard Euler descubrió que tres de los cuatro puntos notables de un triángulo están
  siempre perfectamente alineados sobre una misma línea recta:


  - **Los 3 puntos alineados**: El **Ortocentro** ($H$), el **Baricentro** ($G$) y
  el **Circuncentro** ($O$) forman una fila recta perfecta.

  - **El baricentro queda en medio**: El punto $G$ está siempre entre $H$ y $O$.

  - **Razón $2:1$**: La distancia desde el ortocentro al baricentro ($HG$) es exactamente
  el **doble** que la distancia desde el baricentro al circuncentro ($GO$).

  - **El incentro se queda afuera**: El incentro $I$ no suele estar sobre esta recta
  (solo está si el triángulo es isósceles).

  '
explicacion_formal: '### Definición formal y teorema de Euler

  En cualquier triángulo no equilátero $\Delta ABC$, el ortocentro $H$, el baricentro
  $G$ y el circuncentro $O$ son estrictamente colineales y pertenecen a una única
  recta $\mathcal{L}_E$, denominada **recta de Euler**:


  $$\{H, G, O\} \subset \mathcal{L}_E \quad \text{con} \quad \vec{HG} = 2 \cdot \vec{GO}
  \iff HG = 2 \cdot GO$$


  $$HG = \frac{2}{3} HO \quad \land \quad GO = \frac{1}{3} HO$$


  ### Desglose simbólico y geométrico

  - $H$: Ortocentro (concurrencia de alturas).

  - $G$: Baricentro (concurrencia de transversales).

  - $O$: Circuncentro (concurrencia de simetrales).

  - Razón $2:1$: $G$ divide al segmento $\overline{HO}$ internamente en razón $2:1$.

  - Incentro $I$: En triángulos escalenos, $I \notin \mathcal{L}_E$.


  ### Síntesis didáctica

  El teorema de Euler demuestra la alineación universal de tres centros notables,
  fijando al baricentro como punto de trisección entre el ortocentro y el circuncentro.'
definiciones_clave: '- **Recta de Euler ($\mathcal{L}_E$)**: Recta que contiene al
  ortocentro, baricentro y circuncentro de un triángulo.

  - **Colinealidad de puntos notables**: Propiedad geométrica según la cual $H, G,
  O$ pertenecen a una misma recta.

  - **Razón de Euler ($2:1$)**: Proporción euclidiana que establece que $HG = 2 \cdot
  GO$.

  '
propiedades_relaciones: '- **Pertenencia a la recta**: $H, G, O \in \mathcal{L}_E$.

  - **Relación de distancias**: $HG = 2 \cdot GO \iff HO = 3 \cdot GO$.

  - **Fracciones del segmento total**: $HG = \frac{2}{3} HO$ y $GO = \frac{1}{3} HO$.

  - **Posición del incentro**: En general $I \notin \mathcal{L}_E$; $I \in \mathcal{L}_E
  \iff$ triángulo isósceles o equilátero.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Recta de Euler](/static/img/nodos/definicion-de-recta-de-euler-como-recta-que-contiene-ortocentro-baricentro-y-circuncentro-ejemplos.svg)


    En un triángulo escaleno, la distancia entre el baricentro $G$ y el circuncentro
    $O$ sobre la recta de Euler es $GO = 4.5\text{ cm}$. Calcula la distancia entre
    el ortocentro y el baricentro ($HG$) y la distancia total entre el ortocentro
    y el circuncentro ($HO$).

    '
  pasos:
  - 'Paso 1: Aplicar la relación métrica de Euler: $HG = 2 \cdot GO$.'
  - 'Paso 2: Calcular $HG$: $HG = 2 \times 4.5 = 9\text{ cm}$.'
  - 'Paso 3: Calcular la distancia total $HO$: $HO = HG + GO = 9 + 4.5 = 13.5\text{
    cm} = 3 \cdot GO$.'
  - 'Paso 4: Concluir que $HG = 9\text{ cm}$ y $HO = 13.5\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tres puntos notables pertenecen siempre a la recta de Euler?
  choices:
  - text: El ortocentro, el baricentro y el circuncentro
    is_correct: true
  - text: El ortocentro, el baricentro y el incentro
    is_correct: false
  - text: El circuncentro, el incentro y el baricentro
    is_correct: false
  - text: Los tres vértices del triángulo
    is_correct: false
  explanation: A la recta de Euler pertenecen el ortocentro, el baricentro y el circuncentro.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la distancia total entre el ortocentro H y el circuncentro O es 18
    cm, ¿cuánto mide la distancia GO?
  choices:
  - text: $6\text{ cm}$
    is_correct: true
  - text: $9\text{ cm}$
    is_correct: false
  - text: $12\text{ cm}$
    is_correct: false
  - text: $3\text{ cm}$
    is_correct: false
  explanation: La distancia GO mide $6\text{ cm}$, ya que es un tercio de la distancia
    total ($18 / 3 = 6\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los puntos notables de la recta de Euler: $H$ (ortocentro),
  $G$ (baricentro), $O$ (circuncentro).'
- 'Paso 2: Reconocer el orden de los puntos: $G$ siempre se ubica entre $H$ y $O$.'
- 'Paso 3: Aplicar la relación $HG = 2 \cdot GO$ y $HO = 3 \cdot GO$.'
- 'Paso 4: Resolver algebraicamente la longitud solicitada.'
errores_correccion: Recuerda que el segmento que mide el doble es $HG$ (hacia el ortocentro)
  y no $GO$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo, $HG = 10\text{ cm}$. ¿Cuánto mide la distancia $HO$
    entre el ortocentro y el circuncentro?
  alternativas:
  - $15\text{ cm}$
  - $20\text{ cm}$
  - $12\text{ cm}$
  respuesta: $15\text{ cm}$
  solucion_pasos:
  - $GO = \frac{HG}{2} = \frac{10}{2} = 5\text{ cm}$.
  - $HO = HG + GO = 10 + 5 = 15\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿El incentro de un triángulo escaleno pertenece a la recta de Euler?
  alternativas:
  - No, el incentro queda fuera de la recta en triángulos escalenos
  - Sí, siempre pertenece en todos los triángulos
  - Solo si el triángulo es rectángulo
  respuesta: No, el incentro queda fuera de la recta en triángulos escalenos
  solucion_pasos:
  - El incentro solo pertenece a la recta de Euler en triángulos isósceles (donde
    coincide con el eje de simetría).
- titulo: ¿En la recta de Euler la distancia HG es el doble de la distancia GO?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón métrica de Euler es $HG = 2 \cdot GO$.
- titulo: ¿El baricentro se ubica siempre entre el ortocentro y el circuncentro?
  respuesta: Sí
  solucion_pasos:
  - Sí, $G$ es un punto interior al segmento $HO$.
errores_frecuentes:
- Incluir al incentro ($I$) como miembro general de la recta de Euler.
- Invertir la proporción y escribir $GO = 2 \cdot HG$.
- Dividir entre 2 la distancia total $HO$ en vez de dividirla entre 3.
- Creer que la recta de Euler existe como línea única en el triángulo equilátero.
- Confundir las letras de los puntos notables ($H, G, O$).
afirmaciones_verdaderas:
- La recta de Euler contiene al ortocentro, al baricentro y al circuncentro.
- El baricentro divide al segmento que une el ortocentro con el circuncentro en razón
  2:1.
al_terminar_debes_poder: '**QUÉ:** Definir y aplicar las relaciones métricas de la
  recta de Euler en triángulos.


  **CÓMO:** Identificando la colinealidad de $H, G, O$ y aplicando la razón de distancias
  $HG = 2 \cdot GO$ ($HG = \frac{2}{3}HO$, $GO = \frac{1}{3}HO$).


  ![Resumen de Recta de Euler](/static/img/nodos/definicion-de-recta-de-euler-como-recta-que-contiene-ortocentro-baricentro-y-circuncentro-resumen.svg)

  '
