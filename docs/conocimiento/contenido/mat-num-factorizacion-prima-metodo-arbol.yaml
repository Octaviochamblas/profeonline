semantic_id: MAT.NUM.FACTORIZACION_PRIMA.METODO_ARBOL
resumen_inicial: El árbol de factores descompone visualmente un número en ramas multiplicativas hasta que todas sus hojas son primos.
explicacion_simple: 'El método del árbol es una forma gráfica de descomponer un número. Escribimos el número original arriba como la copa del árbol y abrimos dos ramas con cualquier par de números que al multiplicarse den el número original; continuamos abriendo ramas en los números compuestos hasta que todas las puntas del árbol sean números primos.


  ![Factorización prima mediante árbol de factores](/static/img/nodos/factorizacion-prima-mediante-arbol-de-factores-intro.svg)'
explicacion_formal: 'El **Árbol de Factorización Cíclico** es un árbol acíclico dirigido $T = (V, E)$ donde cada nodo compuesto $v \in V$ posee exactamente dos hijos $(u, w)$ que satisfacen:


  $$v = u \cdot w \quad \text{con } u, w > 1$$


  **Desglose de la fórmula:**

  - Hojas del árbol $L \subset V$: Nodos terminales indivisibles que cumplen $l \in \text{Primos}$.

  - Producto de hojas: El producto de todas las hojas del árbol equivale al número raíz inicial $n = \prod_{l \in L} l$.


  > **Complemento didáctico:** No importa qué par de factores iniciales se elija para las dos primeras ramas (ej: para 24 usar $4 \cdot 6$ o $2 \cdot 12$), las hojas finales del árbol serán siempre los mismos factores primos.'
definiciones_clave: '- **Árbol de factores**: Diagrama de ramificación multiplicativa donde las hojas terminales representan los factores primos.

  - **Hojas del árbol**: Nodos sin hijos correspondientes a números primos que no pueden seguir ramificándose.'
propiedades_relaciones: '- **Independencia de ramas**: Distintas elecciones de ramas iniciales conducen a exactamente las mismas hojas primas finales.'
ejemplo_guiado:
  enunciado: 'Construya un árbol de factores para el número $24$ iniciando con las ramas $4 \cdot 6$.


    ![Ejemplo Factorización prima mediante árbol de factores](/static/img/nodos/factorizacion-prima-mediante-arbol-de-factores-ejemplos.svg)'
  pasos:
  - 'Paso 1: Escribir 24 y abrir dos ramas con los factores 4 y 6.'
  - 'Paso 2: Ramificar el nodo 4: $4 = 2 \cdot 2$ (ambos 2 son primos, se encierran como hojas).'
  - 'Paso 3: Ramificar el nodo 6: $6 = 2 \cdot 3$ (el 2 y el 3 son primos, se encierran como hojas).'
  - 'Paso 4: Recolectar todas las hojas terminales: tres 2 y un 3.'
  - 'Conclusión: La descomposición prima del número es $24 = 2^3 \cdot 3$.'
