    is_correct: true
  - text: Números pares únicamente
    is_correct: false
  - text: El número cero siempre
    is_correct: false
  - text: Cualquier número mayor a 100
    is_correct: false
  explanation: La alternativa correcta es 'Números primos que no se pueden seguir ramificando'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 24, ¿cuántos factores de 2 se obtuvieron en las hojas?
  choices:
  - text: Tres factores 2 (2^3)
    is_correct: true
  - text: Un factor 2
    is_correct: false
  - text: Cinco factores 2
    is_correct: false
  - text: Ninguno
    is_correct: false
  explanation: La alternativa correcta es 'Tres factores 2 (2^3)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el número base en el nodo superior.'
- 'Paso 2: Abrir dos ramas multiplicativas con dos factores cualesquiera cuyo producto sea la base.'
- 'Paso 3: Seguir ramificando los nodos compuestos y encerrar los nodos primos como hojas hasta completar el árbol.'
errores_correccion: '- **Error 1: Continuar ramificando un número primo usando la pareja $p \cdot 1$.** **Cómo corregirlo:** Los nodos primos son hojas terminales y NO se ramifican con el 1.


  - **Error 2: Sumar los factores de las ramas en lugar de multiplicarlos.** **Cómo corregirlo:** Las ramas representan multiplicación ($v = u \cdot w$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un árbol para 30 abrimos ramas con 3 y 10, ¿cómo se ramifica el 10?
  alternativas:
  - En 2 y 5
  - En 5 y 5
  - En 1 y 10
  respuesta: En 2 y 5
  solucion_pasos:
  - $10 = 2 \cdot 5$. Como 2 y 5 son primos, se convierten en hojas terminales.
- titulo: Ejemplo 2
  enunciado: ¿Afecta la elección de los dos primeros factores iniciales el resultado de las hojas del árbol?
  alternativas:
  - No, las hojas primas finales son idénticas por unicidad
  - Sí, cambian los primos
  - Solo si el número es par
  respuesta: No, las hojas primas finales son idénticas por unicidad
  solucion_pasos:
  - Por el Teorema Fundamental, cualquier rama conduce a los mismos factores primos.
- titulo: ¿Se detiene la ramificación de una rama cuando se alcanza un número primo?
  respuesta: Sí
  solucion_pasos:
  - Sí, las hojas del árbol son los números primos que no se ramifican más.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con los teoremas de factorización prima y exponentes.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la descomposición prima canónica proporciona un valor exacto e irreductible.
  - texto: No es posible determinarlo sin conocer todos los divisores
    es_correcta: false
    retroalimentacion: Incorrecto, la factorización canónica permite calcular directamente todas las propiedades.
- titulo: ¿Se debe incluir el número 1 como rama en el árbol de factores?
  respuesta: 'No'
  solucion_pasos:
  - No, usar el 1 crearía ramas infinitas e innecesarias.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con los teoremas de factorización prima y exponentes.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la descomposición prima canónica proporciona un valor exacto e irreductible.
  - texto: No es posible determinarlo sin conocer todos los divisores
    es_correcta: false
    retroalimentacion: Incorrecto, la factorización canónica permite calcular directamente todas las propiedades.
errores_frecuentes:
- Las ramas de un árbol de factores representan la adición entre los dos números elegidos.
- Elegir distintas ramas iniciales para un mismo número produce hojas primas finales completamente diferentes.
- Los nodos correspondientes a números primos deben seguir ramificándose multiplicando por 1.
- El resultado de la descomposición prima mediante árbol se obtiene sumando todas las hojas terminales.
- El método del árbol solo se puede utilizar cuando el número original es divisible por 2.
afirmaciones_verdaderas:
- El árbol de factores ramifica un número en productos hasta que todos sus nodos terminales (hojas) son primos.
- El producto de todas las hojas del árbol de factores equivale al número original de la copa.
al_terminar_debes_poder: '**QUÉ:** Descomponer números compuestos mediante el método gráfico del árbol de factores.


  **CÓMO:** Bifurcando iterativamente cada nodo compuesto en pares de factores $a \cdot b$ hasta que todas las ramas culminen en hojas primas (círculos), y multiplicando las hojas.


  ![Resumen Factorización prima mediante árbol de factores](/static/img/nodos/factorizacion-prima-mediante-arbol-de-factores-resumen.svg)'
