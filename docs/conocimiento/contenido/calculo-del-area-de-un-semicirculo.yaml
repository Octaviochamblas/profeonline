semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_SEMICIRCULO
resumen_inicial: El área de un semicírculo corresponde a la mitad exacta de la superficie del círculo completo, calculándose mediante A = (πr²) / 2.
explicacion_simple: 'Si tomas un círculo completo (como una galleta redonda) y lo cortas en dos partes exactamente iguales trazando una línea recta que pase por el centro (un diámetro), cada una de esas dos mitades es un **semicírculo**.


  Por lógica pura, la superficie de esa mitad tiene que ser exactamente la **mitad del área del círculo completo**. Por lo tanto, la fórmula no podría ser más fácil: calculas el área del círculo entero con $\pi r^2$ y **divides el resultado entre dos**: **$A_{\text{semi}} = \frac{\pi r^2}{2}$**.


  ![Área de un semicírculo](/static/img/nodos/calculo-del-area-de-un-semicirculo-intro.svg)

  '
explicacion_formal: '### Definición formal del área del semicírculo

  Un semicírculo es un sector circular correspondiente a un ángulo central de $\alpha = 180^\circ$ (o $\theta = \pi\text{ rad}$). Por simetría bilateral del disco respecto al diámetro, su área $A_{\text{semi}}$ satisface:

  $$A_{\text{semi}} = \frac{180^\circ}{360^\circ} \cdot \pi r^2 = \frac{1}{2} \pi r^2 = \frac{\pi r^2}{2}$$


  ### Expresión en función del diámetro

  Sustituyendo el diámetro $d = 2r$ ($r = d/2$) en la fórmula del área:

  $$A_{\text{semi}} = \frac{1}{2} \left(\frac{\pi d^2}{4}\right) = \frac{\pi d^2}{8}$$


  ### Despeje del radio a partir del área

  Si se conoce el área del semicírculo $A_{\text{semi}}$, primero se duplica el valor para obtener el área del círculo completo y luego se despeja el radio:

  $$r = \sqrt{\frac{2 A_{\text{semi}}}{\pi}}$$


  > **Complemento didáctico:** En ejercicios de figuras sombreadas compuestas en la PAES (como ventanas de medio punto, túneles o lúnulas), el semicírculo aparece constantemente. Recuerda siempre: calcula $\pi r^2$ y ¡divídelo de inmediato entre 2!

  '
definiciones_clave: '- **Semicírculo**: Mitad de un círculo delimitada por un diámetro y una semicircunferencia.

  - **Área semicircular ($A_{\text{semi}} = \frac{\pi r^2}{2}$)**: Medida de superficie de la mitad del disco.

  - **Fracción de giro ($180^\circ / 360^\circ = 1/2$)**: Factor proporcional que genera el divisor 2.

  '
propiedades_relaciones: '- **Partición equitativa**: La suma de las áreas de dos semicírculos de igual radio es exactamente el área del círculo completo.

  - **Relación con el diámetro**: El divisor es 8 cuando se utiliza el diámetro ($A = \frac{\pi d^2}{8}$).

  - **Centro de gravedad**: El centroide de un semicírculo de radio $r$ se ubica a una distancia de $\frac{4r}{3\pi}$ sobre el eje de simetría perpendicular a la base.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de área de semicírculo](/static/img/nodos/calculo-del-area-de-un-semicirculo-ejemplos.svg)


    Una ventana con forma de semicírculo tiene un radio de $r = 6\text{ dm}$. Calcula su área exacta. Además, si el área de otro semicírculo es de $18\pi\text{ cm}^2$, determina cuánto mide su radio.'
  pasos:
  - 'Paso 1: Calcular el área del círculo completo con $r = 6\text{ dm}$: $A_{\text{total}} = \pi(6^2) = 36\pi\text{ dm}^2$.'
  - 'Paso 2: Dividir entre 2 para el semicírculo: $A_{\text{semi}} = \frac{36\pi}{2} = 18\pi\text{ dm}^2$.'
  - 'Paso 3: Plantear la ecuación con el área dada de $18\pi\text{ cm}^2$: $\frac{\pi r^2}{2} = 18\pi$.'
  - 'Paso 4: Multiplicar por 2 y despejar $r$: $\pi r^2 = 36\pi \implies r^2 = 36 \implies r = 6\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el área de un semicírculo de radio r?
  choices:
  - text: A = (πr²) / 2.
    is_correct: true
  - text: A = πr².
    is_correct: false
  - text: A = 2πr².
    is_correct: false
  - text: A = (πr²) / 4.
    is_correct: false
  explanation: La alternativa correcta es 'A = (πr²) / 2.' El área del semicírculo es exactamente la mitad del área del círculo completo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el diámetro de un semicírculo mide 10 cm, ¿cuál es su área exacta?
  choices:
  - text: 12,5π cm².
    is_correct: true
  - text: 25π cm².
    is_correct: false
  - text: 50π cm².
    is_correct: false
  - text: 100π cm².
    is_correct: false
  explanation: La alternativa correcta es '12,5π cm².' El radio es $r = 10 / 2 = 5$ cm. Luego $A = \frac{\pi(5^2)}{2} = \frac{25\pi}{2} = 12,5\pi$ cm².
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el radio $r$ (si dan el diámetro, dividirlo entre 2).

  2. Elevar el radio al cuadrado: $r^2$.

  3. Multiplicar por $\pi$ y dividir entre 2: $A = \frac{\pi r^2}{2}$.

  4. Para despejar el radio conociendo el área, aplicar $r = \sqrt{\frac{2A}{\pi}}$.

  '
errores_correccion: '- **Error común 1:** Olvidar dividir entre 2 y dar el área del círculo completo. **Corrección:** Un semicírculo es media figura, por lo que siempre se divide por 2.

  - **Error común 2:** Dividir el radio entre 2 antes de elevarlo al cuadrado sin ser el diámetro. **Corrección:** Si te dan el radio, el 2 va dividiendo al final a todo el producto $\pi r^2$.

  '
ejemplos:
- tipo: A
  titulo: Área de semicírculo simple
  enunciado: Un semicírculo tiene un radio de $4\text{ cm}$. ¿Cuál es su superficie?
  alternativas:
  - text: $8\pi\text{ cm}^2$.
    is_correct: true
  - text: $16\pi\text{ cm}^2$.
    is_correct: false
  - text: $4\pi\text{ cm}^2$.
    is_correct: false
  - text: $2\pi\text{ cm}^2$.
    is_correct: false
  explicacion: $A = \frac{\pi(4^2)}{2} = \frac{16\pi}{2} = 8\pi\text{ cm}^2$.
- tipo: B
  titulo: Área y mitad de círculo
  enunciado: ¿Es el área de un semicírculo siempre igual a la mitad del área de un círculo del mismo radio?
  respuesta: Sí
  explicacion: Sí. Un diámetro divide al círculo en dos mitades congruentes de idéntica superficie.
errores_frecuentes:
- '''Olvidar dividir entre 2 reportando el área del círculo completo.'''
- '''Dividir entre 4 en lugar de entre 2 confundiendo el semicírculo con un cuadrante.'''
- '''Usar la fórmula del perímetro en lugar de la de superficie.'''
afirmaciones_verdaderas:
- '''El área de un semicírculo de radio $r$ es $A = \frac{\pi r^2}{2}$.'''
- '''El área de un semicírculo expresada con su diámetro $d$ es $A = \frac{\pi d^2}{8}$.'''
- '''Al duplicar el área de un semicírculo se obtiene exactamente el área del círculo completo.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el área de semicírculos a partir del radio o diámetro.


  **CÓMO:** Aplicando $A_{\text{semi}} = \frac{\pi r^2}{2} = \frac{\pi d^2}{8}$.


  ![Síntesis de área de semicírculo](/static/img/nodos/calculo-del-area-de-un-semicirculo-resumen.svg)

  '
