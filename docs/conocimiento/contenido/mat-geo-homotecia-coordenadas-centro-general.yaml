semantic_id: MAT.GEO.HOMOTECIA.COORDENADAS_CENTRO_GENERAL
resumen_inicial: 'Homotecia en el plano cartesiano con centro distinto del origen:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: 'Cuando el centro de homotecia no coincide con el origen, el cálculo
  de coordenadas requiere un paso adicional: trasladar el punto respecto al centro
  antes de escalar.'
explicacion_formal: '![Homotecia con centro distinto del origen](/static/img/geometria/congruencia-semejanza/homotecia-coordenadas-centro-general.svg)


  ### Definición formal


  Para una homotecia de centro $O=(a,b)$ y razón $k$, un punto $P=(x,y)$ se transforma
  en $P''=(a+k(x-a), b+k(y-b))$.


  ### Desarrollo didáctico


  El punto $(5,7)$ bajo una homotecia de centro $(2,3)$ y razón $k=2$ se transforma
  en $(2+2(5-2), 3+2(7-3))=(2+6, 3+8)=(8,11)$. Es fundamental restar las coordenadas
  del centro antes de multiplicar por $k$, y luego volver a sumarlas.'
definiciones_clave: '- **Homotecia en el plano cartesiano con centro distinto del
  origen**: Elemento o propiedad fundamental en el estudio de congruencia, semejanza
  y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a homotecia en el plano cartesiano con centro
  distinto del origen.'
ejemplo_guiado:
  enunciado: En la aplicación de homotecia en el plano cartesiano con centro distinto
    del origen, se establece una razón $k = 2.8$ entre dos figuras homólogas de longitud
    original $L = 10\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de homotecia en el plano cartesiano con centro distinto
    del origen.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.8 \cdot 10$.'
  - Concluir que la medida obtenida en homotecia en el plano cartesiano con centro
    distinto del origen es $L' = 28.0\text{ cm}$.
