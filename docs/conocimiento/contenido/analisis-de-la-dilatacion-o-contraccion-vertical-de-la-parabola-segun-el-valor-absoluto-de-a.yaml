semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.ESCALA_VERTICAL
resumen_inicial: El análisis de la dilatación o contracción vertical de la parábola según $|a|$ establece que si $|a| > 1$ la gráfica sufre una dilatación vertical (se vuelve más estrecha y alargada), mientras que si $0 < |a| < 1$ sufre una contracción vertical (se vuelve más ancha y aplanada).
explicacion_simple: "![El análisis de la dilatación o contracción vertical de la parábola según $|a|$ establece que si $|a| > 1$ la gráfica sufre una dilatación vertical (se vuelve más estrecha y alargada), mientras que si $0 < |a| < 1$ sufre una contracción vertical (se vuelve más ancha y aplanada)](/static/img/nodos/analisis-de-la-dilatacion-o-contraccion-vertical-de-la-parabola-segun-el-valor-absoluto-de-a-intro.svg)\n\n\nEl número $|a|$ (sin importar si es positivo o negativo) controla el **grosor o apertura** de la parábola:\n\n- **Si $|a| > 1$ (ej: $y = 5x^2$ o $y = -4x^2$):**\n  - Se llama **dilatación vertical**.\n  - La parábola sube (o baja) muy rápido: las ramas se juntan y la curva queda **MUY ESTRECHA (flaca)**.\n- **Si $0 < |a| < 1$ (ej: $y = \\frac{1}{3}x^2$ o $y = -0,2x^2$):**\n  - Se llama **contracción vertical**.\n  - La parábola crece lentamente: las ramas se abren hacia los lados y la curva queda **MUY ANCHA (gorda)**.\n- **Referencia:** Todas se comparan con la parábola\
  \ matriz $y = x^2$ (donde $|a| = 1$)."
explicacion_formal: "Sea $f(x) = x^2$ y sea el operador de escalamiento vertical $\\mathcal{S}_a$ tal que $g(x) = a x^2$ ($a \\neq 0$). La **tasa de divergencia métrica** respecto al eje de simetría está regulada por $|a|$:\n\n$$\\forall x \\neq 0: \\quad \\frac{|g(x)|}{|f(x)|} = |a|$$\n\n**Clasificación topológica de apertura**:\n1. **Dilatación vertical estricta ($|a| > 1$)**:\n   $$\\forall y > 0: \\quad |x_g(y)| = \\sqrt{\\frac{y}{|a|}} < \\sqrt{y} = |x_f(y)|$$\n   El ancho transversal de la parábola a una misma altura $y$ es menor, generando un estrechamiento geométrico.\n2. **Contracción vertical estricta ($0 < |a| < 1$)**:\n   $$\\forall y > 0: \\quad |x_g(y)| = \\sqrt{\\frac{y}{|a|}} > |x_f(y)|$$\n   El ancho transversal es mayor, generando un ensanchamiento geométrico."
definiciones_clave: '- **Dilatación vertical**: Transformación que alarga verticalmente la curva alejándola del eje horizontal por un factor $|a| > 1$.

  - **Contracción vertical**: Transformación que comprime verticalmente la curva acercándola al eje horizontal por un factor $0 < |a| < 1$.'
propiedades_relaciones: '- **Independencia del signo**: El ensanchamiento o estrechamiento depende estrictamente del valor absoluto $|a|$, sin importar si la parábola abre hacia arriba o hacia abajo.

  - **Invarianza del vértice en el origen**: Si no hay traslación, el vértice $(0, 0)$ permanece como punto fijo invariante.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la dilatación o contracción vertical de la parábola según $|a|$ establece que si $|a| > 1$ la gráfica sufre una dilatación vertical (se vuelve más estrecha y alargada), mientras que si $0 < |a| < 1$ sufre una contracción vertical (se vuelve más ancha y aplanada)](/static/img/nodos/analisis-de-la-dilatacion-o-contraccion-vertical-de-la-parabola-segun-el-valor-absoluto-de-a-ejemplos.svg)



    Ordena las siguientes funciones de la más estrecha a la más ancha justificando según $|a|$:

    $f_1(x) = -5x^2, \quad f_2(x) = \frac{1}{4}x^2, \quad f_3(x) = 2x^2, \quad f_4(x) = -0,8x^2$.'
  pasos:
  - 'Paso 1: Calcular el valor absoluto de cada coeficiente principal:

    - $|a_1| = |-5| = 5$.

    - $|a_2| = |1/4| = 0,25$.

    - $|a_3| = |2| = 2$.

    - $|a_4| = |-0,8| = 0,8$.'
  - 'Paso 2: Ordenar los valores absolutos de mayor a menor:

    $$5 > 2 > 0,8 > 0,25 \implies |a_1| > |a_3| > |a_4| > |a_2|$$'
  - 'Paso 3: Concluir el orden de estrechez:

    - Más estrecha: $f_1(x) = -5x^2$.

    - Segunda: $f_3(x) = 2x^2$.

    - Tercera: $f_4(x) = -0,8x^2$.

    - Más ancha: $f_2(x) = \frac{1}{4}x^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones posee la gráfica más abierta (más ancha)?
  choices:
  - text: f(x) = 0,1x²
    is_correct: true
  - text: f(x) = -3x²
    is_correct: false
  - text: f(x) = 2x²
    is_correct: false
  - text: f(x) = -0,5x²
    is_correct: false
  explanation: 'La alternativa correcta es ''f(x) = 0,1x²''. La función más ancha es la que tiene el menor valor absoluto de $a$: $|0,1| = 0,1$, que es el menor de todos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si comparamos $f(x) = -6x^2$ con $g(x) = 6x^2$, ¿cuál es más estrecha?
  choices:
  - text: Tienen exactamente la misma estrechez y apertura (porque |-6| = |6| = 6)
    is_correct: true
  - text: g(x) es más estrecha porque 6 > -6
    is_correct: false
  - text: f(x) es más estrecha
    is_correct: false
  - text: No se pueden comparar
    is_correct: false
  explanation: La alternativa correcta es 'Tienen exactamente la misma estrechez y apertura (porque |-6| = |6| = 6)'. La apertura depende solo del módulo $|a|$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer el coeficiente principal $a$ de cada función cuadrática.'
- 'Paso 2: Calcular su valor absoluto $|a|$.'
- 'Paso 3: Si $|a| > 1$, clasificar como dilatación vertical (parábola estrecha).'
- 'Paso 4: Si $0 < |a| < 1$, clasificar como contracción vertical (parábola ancha).'
- 'Paso 5: Jerarquizar las curvas: a mayor $|a|$, mayor estrechez.'
errores_correccion: '- **Error común:** Pensar que $y = -5x^2$ es más ancha que $y = x^2$ porque $-5 < 1$.

  - **Cómo corregirlo:** La apertura depende del **VALOR ABSOLUTO $|a|$**: $|-5| = 5 > 1$, por lo que es **mucho más estrecha**.'
ejemplos:
- titulo: 'Ejemplo 1: Comparación de dos curvas'
  enunciado: ¿Cómo es la gráfica de $f(x) = 7x^2$ comparada con $y = x^2$?
  alternativas:
  - Más estrecha (dilatación vertical por factor 7)
  - Más ancha (contracción vertical)
  - Idéntica
  - Trasladada 7 unidades
  respuesta: Más estrecha (dilatación vertical por factor 7)
  solucion_pasos:
  - 'Paso 1: $|7| = 7 > 1 \implies$ más estrecha.'
- titulo: 'Ejemplo 2: Coeficiente fraccionario'
  enunciado: ¿Qué transformación de escala experimenta $g(x) = \frac{1}{5}x^2$?
  alternativas:
  - Contracción vertical (se vuelve más ancha)
  - Dilatación vertical (se vuelve más estrecha)
  - Reflexión
  - Traslación horizontal
  respuesta: Contracción vertical (se vuelve más ancha)
  solucion_pasos:
  - 'Paso 1: $|1/5| = 0,2 < 1 \implies$ contracción vertical.'
- titulo: 'Ejemplo 3: Apertura con coeficientes negativos'
  enunciado: Entre $f(x) = -0,3x^2$ y $g(x) = -8x^2$, ¿cuál es más ancha?
  alternativas:
  - f(x) porque |-0,3| < |-8|
  - g(x) porque -8 < -0,3
  - Ambas tienen la misma apertura
  - Ninguna
  respuesta: f(x) porque |-0,3| < |-8|
  solucion_pasos:
  - 'Paso 1: Menor $|a| \implies$ mayor amplitud $\implies f(x)$ es más ancha.'
- titulo: 'Ejemplo 4: Parábolas congruentes'
  enunciado: ¿Tienen la misma forma y apertura $y = -3(x - 2)^2$ y $y = 3(x + 5)^2$?
  alternativas:
  - Sí, porque en ambas |a| = 3
  - No, porque una abre hacia abajo y otra hacia arriba
  - No, porque tienen distintos vértices
  - Solo si x = 0
  respuesta: Sí, porque en ambas |a| = 3
  solucion_pasos:
  - 'Paso 1: Al tener $|a| = 3$, ambas curvas son geométricamente congruentes en apertura.'
errores_frecuentes:
- Comparar coeficientes con su signo en lugar de usar el valor absoluto.
- Confundir dilatación vertical con traslación vertical.
- 'Afirmar que un número fraccionario siempre ensancha (ej: 5/2 > 1 estrecha la curva).'
afirmaciones_verdaderas:
- El valor absoluto |a| determina unívocamente la apertura y estrechez de la parábola.
- Dos parábolas con el mismo valor absoluto |a| tienen exactamente la misma apertura geométrica.
al_terminar_debes_poder: '**QUÉ:** Analizar y clasificar la dilatación y contracción vertical de una parábola.


  **CÓMO:** Evaluando si |a| > 1 (dilatación vertical/estrecha) o 0 < |a| < 1 (contracción vertical/ancha).


