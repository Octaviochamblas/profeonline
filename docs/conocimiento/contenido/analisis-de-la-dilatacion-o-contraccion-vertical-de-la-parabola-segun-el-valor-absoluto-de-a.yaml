semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.ESCALA_VERTICAL
resumen_inicial: 'Análisis de la dilatación o contracción vertical de la parábola
  según el valor absoluto de a: parábola, vértice, concavidad y formas de Traslaciones
  y transformaciones.'
explicacion_simple: Además de determinar hacia dónde abre la parábola, el coeficiente
  $a$ también controla qué tan "cerrada" o "abierta" se ve la curva, independientemente
  de su signo.
explicacion_formal: '### Definición formal


  Dada $f(x)=x^2$ y $g(x)=af(x)=ax^2$: si $|a|>1$, la gráfica de $g$ se contrae verticalmente
  respecto a la de $f$ (parece más angosta); si $0<|a|<1$, la gráfica se dilata (parece
  más ancha o abierta).


  ### Desarrollo didáctico


  Este efecto se aprecia comparando la altura de los puntos con igual coordenada $x$:
  para un mismo valor de $x$, mientras mayor sea $|a|$, más rápido crece (o decrece)
  el valor de $g(x)$ respecto a $f(x)$.


  Comparando $f(x)=x^2$ con $g(x)=4x^2$: en $x=1$, $f(1)=1$ pero $g(1)=4$, mostrando
  que $g$ crece más rápido y se ve más "cerrada" o angosta.'
definiciones_clave: '- **Análisis de la dilatación o contracción vertical de la parábola
  según el valor absoluto de a**: Elemento o parámetro esencial en la representación
  de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  análisis de la dilatación o contracción vertical de la parábola según el valor absoluto
  de a.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando análisis de
    la dilatación o contracción vertical de la parábola según el valor absoluto de
    a.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a análisis
    de la dilatación o contracción vertical de la parábola según el valor absoluto
    de a.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
