semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.ESCALA_VERTICAL
resumen_inicial: El análisis de la dilatación o contracción evalúa el valor absoluto $|a|$ para determinar cuán estrecha o ancha es la abertura de la parábola.
explicacion_simple: |
  El valor absoluto del coeficiente cuadrático **$|a|$** controla qué tan **cerrada o abierta** se ve la parábola respecto a la parábola normal $y = x^2$:

  - **Si $|a| > 1$ (ej. $a = 3$ o $a = -5$)**:
    - La parábola sufre una **dilatación o estiramiento vertical**.
    - Visualmente la curva se ve más **estrecha, flaca o empinada**.
  - **Si $0 < |a| < 1$ (ej. $a = 0.5$ o $a = -\frac{1}{4}$)**:
    - La parábola sufre una **contracción o compresión vertical**.
    - Visualmente la curva se ve más **ancha, plana o abierta**.
  - **Si $|a| = 1$**: Mantiene exactamente la abertura estándar de $y = x^2$.
explicacion_formal: |
  Dada la función cuadrática madre $f(x) = x^2$, la transformación de **escalamiento vertical (dilatación o compresión)** por un factor de escala $a \in \mathbb{R} \setminus \{0\}$ genera la función $g(x) = a \cdot f(x) = ax^2$:

  $$g(x) = a x^2 \implies |g(x)| = |a| \cdot x^2$$

  **Clasificación espectral de la escala por $|a|$:**
  1. **Dilatación Vertical (Estiramiento de factor $|a|$):**
     $$\text{Si } |a| > 1 \implies |g(x)| > |f(x)|, \quad \forall x \neq 0$$
     Las salidas $y$ crecen/decrecen más rápido, produciendo una gráfica más ajustada al eje Y.
  2. **Contracción Vertical (Compresión de factor $|a|$):**
     $$\text{Si } 0 < |a| < 1 \implies |g(x)| < |f(x)|, \quad \forall x \neq 0$$
     Las salidas $y$ crecen/decrecen más lento, produciendo una gráfica más aplanada hacia el eje X.
definiciones_clave: |
  - **Dilatación / Contracción vertical**: Cambio de escala en el eje Y que modifica la tasa de variación y la abertura de las ramas de la parábola según $|a|$.
propiedades_relaciones: |
  - **Independencia del signo**: La abertura de la parábola depende exclusivamente de la magnitud $|a|$; el signo de $a$ solo decide la concavidad (orientación hacia arriba o abajo).
ejemplo_guiado:
  enunciado: 'Compara la abertura de las parábolas $f(x) = x^2$, $g(x) = 4x^2$ y $h(x) = -\frac{1}{3}x^2$ e identifícalas como dilatadas o contraídas.'
  pasos:
    - 'Paso 1: Calcular $|a|$ para la función base $f(x)$: $|a_f| = 1$ (abertura estándar).'
    - 'Paso 2: Calcular $|a|$ para $g(x) = 4x^2$: $|a_g| = 4 > 1$. Es una **dilatación vertical** (parábola más estrecha).'
    - 'Paso 3: Calcular $|a|$ para $h(x) = -\frac{1}{3}x^2$: $|a_h| = |-1/3| = 1/3 < 1$. Es una **contracción vertical** (parábola más ancha).'
    - 'Paso 4: Ordenar de mayor a menor estrechez: $g(x)$ (la más estrecha), $f(x)$ (intermedia), $h(x)$ (la más ancha).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Entre las funciones cuadráticas $g(x) = 8x^2$ y $h(x) = 0.2x^2$, ¿cuál de ellas presenta una curva más estrecha en el plano?'
    choices:
      - {text: 'La función $g(x) = 8x^2$ porque $|a| = 8 > 1$', is_correct: true}
      - {text: 'La función $h(x) = 0.2x^2$ porque $|a| = 0.2 < 1$.', is_correct: false}
      - {text: 'Ambas funciones tienen exactamente la misma abertura.', is_correct: false}
      - {text: 'Depende de las coordenadas del vértice.', is_correct: false}
    explanation: 'La alternativa correcta es ''La función $g(x) = 8x^2$ porque $|a| = 8 > 1$''. A mayor $|a|$, más estrecha es la parábola.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si una parábola cóncava hacia abajo $f(x) = a x^2$ es más ancha y aplanada que $y = -x^2$, ¿qué rango de valores puede tomar el coeficiente $a$?'
    choices:
      - {text: '$-1 < a < 0$', is_correct: true}
      - {text: '$a < -1$.', is_correct: false}
      - {text: '$a > 1$.', is_correct: false}
      - {text: '$0 < a < 1$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1 < a < 0$''. Para ser cóncava hacia abajo $a < 0$, y para ser más ancha $|a| < 1$, luego $-1 < a < 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el coeficiente cuadrático $a$ y tomar su valor absoluto $|a|$.'
  - 'Paso 2: Comparar $|a|$ con el valor de referencia $1$.'
  - 'Paso 3: Si $|a| > 1$, clasificar como dilatación vertical (curva más estrecha y empinada que $y = x^2$).'
  - 'Paso 4: Si $0 < |a| < 1$, clasificar como contracción vertical (curva más ancha y aplanada que $y = x^2$).'
errores_correccion: |
  - **Error común:** Pensar que porque $a = -10$ es un número negativo pequeño, la parábola es "ancha".
  - **Cómo corregirlo:** La abertura **MIRA EL VALOR ABSOLUTO $|a|$**: $|-10| = 10 > 1$, por lo que $a = -10$ produce una parábola **MUY ESTRECHA**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Dilatación vertical.
    alternativas:
      - 'Dilatación vertical (curva más estrecha)'
      - 'Contracción vertical (curva más ancha)'
      - 'Traslación horizontal'
    respuesta: 'Dilatación vertical (curva más estrecha)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Contracción vertical.
    alternativas:
      - 'Contracción vertical (curva más ancha)'
      - 'Dilatación vertical (curva más estrecha)'
      - 'Reflexión oblicua'
    respuesta: 'Contracción vertical (curva más ancha)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = -6x^2$, es correcto decir que la parábola es más ancha que $y = x^2$ por ser $-6$ un número negativo.'
  - 'La creencia de que el parámetro $b$ de la función determina la abertura de las ramas de la parábola.'
  - 'La equivalencia errónea entre una dilatación vertical por $|a| > 1$ y un desplazamiento horizontal de la gráfica.'
  - 'Afirmar que cuando $|a| = 1$, la parábola carece de forma cuadrática.'
  - 'La suposición de que al contraerse verticalmente ($|a| < 1$), el vértice de la parábola se desplaza del origen.'
afirmaciones_verdaderas:
  - 'La abertura de la parábola depende de $|a|$: si $|a| > 1$ la curva se vuelve más estrecha (dilatación) y si $|a| < 1$ se vuelve más ancha (contracción).'
  - 'El signo de $a$ y la magnitud $|a|$ actúan de manera independiente: el signo rige la concavidad y el valor absoluto rige la escala de abertura.'
al_terminar_debes_poder: |
  QUÉ: Analizar el efecto del valor absoluto $|a|$ en la dilatación o contracción vertical de la parábola.
  CÓMO: Calcular $|a|$, comparar con 1 y clasificar la gráfica como más estrecha ($|a| > 1$) o más ancha ($|a| < 1$) respecto a $y = x^2$.
