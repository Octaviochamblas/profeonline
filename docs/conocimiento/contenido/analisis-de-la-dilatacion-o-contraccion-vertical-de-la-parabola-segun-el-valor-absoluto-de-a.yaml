semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.ESCALA_VERTICAL
resumen_inicial: 'El valor absoluto del coeficiente cuadrático $|a|$ rige la escala vertical de la parábola: si $|a| > 1$ la curva se contrae horizontalmente (se estrecha), y si $0 < |a| < 1$ se dilata (se ensancha).'
explicacion_simple: |
  El tamaño del número $a$ sin importar su signo (es decir, su valor absoluto $|a|$) controla qué tan "flaca" o "gorda" es la parábola. Si $|a|$ es un número grande como 5 o 10, la parábola crece muy rápido en altura y se ve más angosta y apretada. Si $|a|$ es una fracción pequeña como $\frac{1}{4}$ o $0.2$, la parábola crece lentamente y se ve más ancha y aplanada.
explicacion_formal: |
  ### Definición formal
  En la familia de funciones cuadráticas $g(x) = ax^2$ comparadas con la parábola patrón $f(x) = x^2$, la **transformación de escala vertical** se clasifica según la magnitud del escalar $|a|$:
  - **Contracción horizontal / Dilatación vertical**: $\iff |a| > 1$. La gráfica escala sus alturas multiplicándolas por $|a|$, haciendo que las ramas estén más cerca del eje $y$ (curva más esbelta/angosta).
  - **Dilatación horizontal / Contracción vertical**: $\iff 0 < |a| < 1$. La gráfica escala sus alturas reduciéndolas por el factor $|a|$, alejando las ramas del eje $y$ (curva más ancha/abierta).

  ### Desglose simbólico
  - $|a| = 1$: Parábola de apertura patrón ($y = x^2$ y $y = -x^2$).
  - $|a| \to +\infty$: La parábola se comprime lateralmente aproximándose a la recta vertical del eje $y$.
  - $|a| \to 0$: La parábola se aplana aproximándose a la recta horizontal del eje $x$.

  ### Síntesis didáctica
  Es crucial aislar el signo del tamaño numérico: el **signo** de $a$ decide únicamente la concavidad (arriba/abajo), mientras que el **valor absoluto** $|a|$ decide únicamente la apertura gráfica (angosta/ancha).
definiciones_clave: |
  - **Dilatación vertical (contracción horizontal)**: Deformación gráfica producida por $|a| > 1$ que estrecha la parábola.
  - **Contracción vertical (dilatación horizontal)**: Deformación gráfica producida por $0 < |a| < 1$ que ensancha la parábola.
  - **Valor absoluto $|a|$**: Magnitud numérica escalar independiente del signo positivo o negativo.
propiedades_relaciones: |
  - **Invariancia del vértice**: Para funciones de la forma $g(x) = ax^2$, alterar el valor de $|a|$ cambia la apertura pero conserva intacto el vértice en $V(0, 0)$.
  - **Comparación de aperturas**: Si $|a_1| > |a_2|$, la gráfica de $y = a_1 x^2$ está contenida interiormente por las ramas de $y = a_2 x^2$.
ejemplo_guiado:
  enunciado: 'Compara la apertura gráfica de las parábolas $f(x) = 4x^2$, $g(x) = x^2$ y $h(x) = \frac{1}{3}x^2$ ordenándolas de menor a mayor apertura de sus ramas.'
  pasos:
    - 'Paso 1: Extraemos los valores absolutos de sus coeficientes cuadráticos: $|a_f| = |4| = 4$, $|a_g| = |1| = 1$, y $|a_h| = |\frac{1}{3}| = \frac{1}{3}$.'
    - 'Paso 2: Comparamos las magnitudes: $4 > 1 > \frac{1}{3}$.'
    - 'Paso 3: Para $|a_f| = 4 > 1$, la parábola crece 4 veces más rápido, siendo la más angosta (menor apertura).'
    - 'Paso 4: Para $|a_h| = \frac{1}{3} < 1$, la parábola se aplana creciendo 3 veces más lento, siendo la más ancha (mayor apertura).'
    - 'Paso 5: Ordenamos de menor a mayor apertura: $f(x) = 4x^2$ (más angosta), $g(x) = x^2$ (patrón), $h(x) = \frac{1}{3}x^2$ (más ancha).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dadas las funciones $f(x) = -8x^2$ y $g(x) = \frac{1}{2}x^2$, ¿cuál de las dos parábolas presenta ramas más estrechas y cercanas al eje de simetría?'
    choices:
      - {text: '$f(x) = -8x^2$, porque $|-8| = 8 > |\frac{1}{2}| = 0.5$', is_correct: true}
      - {text: '$g(x) = \frac{1}{2}x^2$, porque su coeficiente es positivo', is_correct: false}
      - {text: 'Ambas presentan exactamente la misma apertura', is_correct: false}
      - {text: '$g(x) = \frac{1}{2}x^2$, porque $0.5 < 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = -8x^2$, porque $|-8| = 8 > |\frac{1}{2}| = 0.5$''. A mayor valor absoluto de $a$, más estrecha y vertical es la parábola.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué efecto geométrico produce reemplazar $f(x) = x^2$ por $g(x) = 0.1x^2$ en el plano cartesiano?'
    choices:
      - {text: 'La parábola se ensancha horizontalmente aproximando sus ramas al eje $x$', is_correct: true}
      - {text: 'La parábola se estrecha verticalmente pegando sus ramas al eje $y$', is_correct: false}
      - {text: 'La parábola se traslada 0.1 unidades a la derecha', is_correct: false}
      - {text: 'La parábola invierte sus ramas abriendo hacia abajo', is_correct: false}
    explanation: 'La alternativa correcta es ''La parábola se ensancha horizontalmente aproximando sus ramas al eje $x$''. Como $|a| = 0.1 < 1$, la curva se dilata horizontalmente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer el coeficiente cuadrático $a$ y calcular su valor absoluto $|a|$.'
  - 'Paso 2: Si $|a| > 1$, concluir que la parábola es más estrecha/angosta que $y = x^2$.'
  - 'Paso 3: Si $0 < |a| < 1$, concluir que la parábola es más ancha/aplanada que $y = x^2$.'
errores_correccion: |
  - **Error 1:** Afirmar que $f(x) = -5x^2$ es más ancha que $g(x) = 2x^2$ por ser $-5$ menor que 2. **Cómo corregirlo:** La apertura depende exclusivamente del valor absoluto $|a|$. Puesto que $|-5| = 5 > |2| = 2$, la función $f(x) = -5x^2$ es más estrecha y angosta que $g(x) = 2x^2$.
  - **Error 2:** Creer que valores de $a$ fraccionarios siempre ensanchan la curva. **Cómo corregirlo:** Una fracción impropia como $a = \frac{5}{2} = 2.5 > 1$ tiene $|a| > 1$, por lo que estrecha la curva. Únicamente las fracciones propias con $0 < |a| < 1$ ensanchan la curva.
ejemplos:
  - titulo: 'Comparación entre coeficientes enteros y fraccionarios'
    enunciado: '¿Cuál de las funciones $f(x) = 3x^2$ o $g(x) = 0.25x^2$ es más ancha?'
    alternativas:
      - '$g(x) = 0.25x^2$'
      - '$f(x) = 3x^2$'
      - 'Tienen el mismo ancho'
    respuesta: '$g(x) = 0.25x^2$'
    solucion_pasos:
      - '1. $|a_f| = 3$ y $|a_g| = 0.25$.'
      - '2. Como $0.25 < 1 < 3$, la función $g(x) = 0.25x^2$ es la más ancha.'
  - titulo: 'Independencia de concavidad y apertura'
    enunciado: '¿Las parábolas $f(x) = 6x^2$ y $g(x) = -6x^2$ tienen la misma apertura?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas tienen el mismo valor absoluto $|a| = |-6| = |6| = 6$. La única diferencia es que $f(x)$ abre hacia arriba y $g(x)$ abre hacia abajo.'
  - titulo: 'Efecto de coeficientes mayores a 1'
    enunciado: '¿Incrementar el valor de $a$ de $a = 1$ a $a = 100$ hace que la parábola se vuelva más estrecha?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al aumentar $|a|$, los valores de salida $y$ crecen 100 veces más rápido, estrechando la curva hacia el eje $y$.'
  - titulo: 'Apertura de la parábola patrón'
    enunciado: '¿La parábola patrón $y = x^2$ posee un valor absoluto de coeficiente $|a| = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El coeficiente de $y = x^2$ es $a = 1$, por lo que $|a| = 1$ actúa como el estándar de comparación.'
errores_frecuentes:
  - 'La parábola de la función $f(x) = -10x^2$ es la más ancha de todas porque $-10$ es un número muy pequeño.'
  - 'Si el coeficiente cuadrático es una fracción como $a = \frac{7}{2}$, la gráfica de la parábola se ensancha.'
  - 'El valor de $|a|$ altera la posición del eje de simetría de la parábola $y = ax^2$.'
  - 'Dos parábolas con coeficientes $a = 4$ y $a = -4$ tienen aperturas diferentes.'
  - 'Una parábola con $|a| > 1$ se desplace horizontalmente hacia la derecha.'
afirmaciones_verdaderas:
  - 'El valor absoluto $|a|$ determina la apertura de la parábola: a mayor $|a|$ la curva es más estrecha, y a menor $|a|$ la curva es más ancha.'
  - 'Dos parábolas con coeficientes opuestos en signo pero de igual valor absoluto (como $a = 3$ y $a = -3$) presentan exactamente la misma apertura gráfica.'
