semantic_id: MAT.ALG.SISTEMAS_INECUACIONES
resumen_inicial: Un sistema de inecuaciones lineales con una incógnita busca determinar la región de números reales que satisface simultáneamente todas las desigualdades.
explicacion_simple: |
  En muchos problemas una sola restricción no basta. Un sistema de inecuaciones permite modelar varias condiciones al mismo tiempo y encontrar únicamente los valores que satisfacen todas ellas de manera simultánea.
explicacion_formal: |
  Un sistema de inecuaciones lineales con una incógnita es un conjunto finito de desigualdades de primer grado en una misma variable. Su conjunto solución está dado por los valores reales que verifican simultáneamente cada una de las inecuaciones del sistema ($S = S_1 \cap S_2$).
definiciones_clave: |
  - **Sistema de inecuaciones**: Conjunto de desigualdades con la misma variable que deben cumplirse a la vez.
propiedades_relaciones: |
  - **Simultaneidad e intersección**: $S = S_1 \cap S_2$.
ejemplo_guiado:
  enunciado: Un valor $x$ debe ser al menos $4$ y, a la vez, menor que $11$. Exprese el sistema y determine su solución.
  pasos:
    - 'Paso 1: Las condiciones se escriben como $x \ge 4$ y $x < 11$.'
    - 'Paso 2: La primera solución es $[4, +\infty[$ y la segunda es $]-\infty, 11[$.'
    - 'Paso 3: La solución del sistema es la intersección de ambos conjuntos.'
    - 'Paso 4: Por tanto, el conjunto solución es $[4, 11[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es el conjunto solución del sistema formado por $x \ge 4$ y $x < 11$?
    choices:
      - {text: '$[4, 11[$', is_correct: true}
      - {text: '$]4, 11]$', is_correct: false}
      - {text: '$]-\infty, 11[$', is_correct: false}
      - {text: '$[4, +\infty[$', is_correct: false}
    explanation: La alternativa correcta es '$[4, 11[$'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Cómo se combinan las soluciones individuales en un sistema de inecuaciones?
    choices:
      - {text: Mediante la intersección de conjuntos ($S_1 \cap S_2$)., is_correct: true}
      - {text: Mediante la unión de conjuntos ($S_1 \cup S_2$)., is_correct: false}
      - {text: Sumando los valores extremos., is_correct: false}
      - {text: Restando los intervalos., is_correct: false}
    explanation: La alternativa correcta es 'Mediante la intersección de conjuntos ($S_1 \cap S_2$).'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Resolver cada inecuación de manera independiente.'
  - 'Paso 2: Expresar cada conjunto solución como intervalo.'
  - 'Paso 3: Calcular la intersección $S = S_1 \cap S_2$.'
  - 'Paso 4: Expresar el resultado final en notación de intervalo y en la recta numérica.'
errores_correccion: |
  - **Error común:** Calcular la unión en lugar de la intersección.
  - **Cómo corregirlo:** Recordar que la palabra "sistema" exige cumplimiento simultáneo ($\cap$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de sistemas de inecuaciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de sistemas de inecuaciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Un sistema de inecuaciones lineales con una incógnita se resuelve mediante el método de eliminación por reducción de igualdades.'
  - 'El conjunto solución de un sistema de inecuaciones es siempre un conjunto formado por dos números reales fijos.'
  - 'Si una de las inecuaciones del sistema no tiene solución, el sistema completo puede tener como solución el conjunto $\mathbb{R}$.'
  - 'Multiplicar una de las inecuaciones por $-1$ invierte también el operador de la otra inecuación del sistema.'
  - 'La solución de un sistema de inecuaciones $S_1 \cap S_2$ equivale a la unión de conjuntos $S_1 \cup S_2$.'
afirmaciones_verdaderas:
  - 'La resolución de un sistema de inecuaciones lineales combina la resolución individual de cada desigualdad con la intersección de sus conjuntos solución en $\mathbb{R}$.'
  - 'El conjunto solución global $S$ satisface simultáneamente todas las restricciones del sistema.'
al_terminar_debes_poder: |
  QUÉ: Resolver sistemas de inecuaciones lineales con una incógnita y expresar su conjunto solución.
  CÓMO: Despejar cada inecuación individualmente, determinar $S_1$ y $S_2$, hallar la intersección $S = S_1 \cap S_2$ y expresarla en intervalo y gráfica.
fuente: 'Texto escolar MINEDUC — Álgebra / Sistemas de Inecuaciones Lineales'
estado: publicado
