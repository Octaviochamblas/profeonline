semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.BISECTRIZ_INTERIOR_DEFINICION
resumen_inicial: 'Definición de bisectriz interior de un triángulo como rayo que divide
  un ángulo interior en dos ángulos iguales: conceptos, teoremas, propiedades geométricas
  y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: De los segmentos notables que parten de un vértice, la bisectriz
  es el que reparte el ángulo de ese vértice en dos mitades exactamente iguales.
explicacion_formal: '![Bisectriz interior desde un vértice](/static/img/geometria/elementos-secundarios/bisectriz-incentro-bisectriz-interior-definicion.svg)


  ### Definición formal


  La bisectriz interior del ángulo en el vértice A de un triángulo ABC es el rayo
  que parte de A y divide el ángulo ∠BAC en dos ángulos iguales, cada uno de medida
  ∠BAC/2.


  ### Desarrollo didáctico


  Si el ángulo en A mide 60°, su bisectriz lo divide en dos ángulos de 30° cada uno.
  Cada triángulo tiene tres bisectrices interiores, una por cada vértice.'
definiciones_clave: '- **Definición de bisectriz interior de un triángulo como rayo
  que divide un ángulo interior en dos ángulos iguales**: Elemento o propiedad fundamental
  en el estudio de elementos secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
