semantic_id: MAT.ALG.DESIG_PROPIEDADES.ERROR_CAMBIO_SENTIDO
resumen_inicial: Olvidar invertir el sentido de la desigualdad al multiplicar o dividir
  por un número negativo es el error operativo más frecuente en inecuaciones.
explicacion_simple: 'Un error muy común en pruebas matemáticas es resolver $-2x <
  8$ y escribir $x < -4$ pasando a dividir el $-2$ sin dar vuelta al símbolo.

  Este pequeño olvido destruye por completo el conjunto solución de la inecuación.

  La resolución correcta exige invertir el símbolo: $x > -4$.'
explicacion_formal: 'Dada la inecuación $-a x < b$ con $a > 0$, se contraponen el
  **despeje erróneo** y el **despeje correcto**:


  $$\text{Error: } x < -\frac{b}{a} \quad \neq \quad \text{Correcto: } x > -\frac{b}{a}$$


  **Desglose de la fórmula:**

  - Pasar a dividir el coeficiente negativo $-a < 0$ requiere transformar la relación
  de orden a su operador dual invertido.'
definiciones_clave: '- **Error de inversión de sentido**: Falta de cambio del operador
  de orden al multiplicar o dividir por escalares negativos.

  - **Falso conjunto solución**: Conjunto de números resultante de omitir la regla
  de inversión.'
propiedades_relaciones: '- **Verificación con número de prueba**: Probar un valor
  en la inecuación original revela inmediatamente el error de sentido.'
ejemplo_guiado:
  enunciado: Analiza la resolución de la inecuación $-5x \le 20$. Detecta el error
    en la respuesta $x \le -4$, corrígela y evalúa la veracidad para $x = 0$.
  pasos:
  - 'Paso 1: Detectar el error: Se dividió por $-5$ pero se mantuvo el símbolo $\le$
    sin invertirlo.'
  - 'Paso 2: Aplicar la corrección invirtiendo el símbolo $\le$ a $\ge$: $x \ge \frac{20}{-5}
    \implies x \ge -4$.Paso 3: Probar el valor $x = 0 \ge -4$ en la inecuación original:
    $-5(0) = 0 \le 20$ (VERDADERO).Paso 4: Probar $x = 0$ en la respuesta errónea
    $x \le -4$: $0 \le -4$ (FALSO, lo que demuestra que la respuesta correcta es $x
    \ge -4$).'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $-5x \le 20$, ¿cuál es la solución correcta al aplicar la
    inversión de sentido?
  choices:
  - text: $x \ge -4$
    is_correct: true
  - text: $x \le -4$
    is_correct: false
  - text: $x \ge 4$
    is_correct: false
  - text: $x \le 4$
    is_correct: false
  explanation: La alternativa correcta es '$x \ge -4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al probar el número $x = 0$ en $-5x \le 20$, ¿qué demuestra la verificación?
  choices:
  - text: Que $x = 0$ satisface la inecuación ($0 \le 20$), confirmando que la solución
      es $x \ge -4$.
    is_correct: true
  - text: Que la inecuación carece de solución.
    is_correct: false
  - text: Que la solución correcta era $x \le -4$.
    is_correct: false
  - text: Que el resultado debe ser igual a cero.
    is_correct: false
  explanation: La alternativa correcta es 'Que $x = 0$ satisface la inecuación ($0
    \le 20$), confirmando que la solución es $x \ge -4$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Revisar cada paso del despeje de la inecuación.'
- 'Paso 2: Verificar si en algún paso se multiplicó o dividió por una constante negativa.'
- 'Paso 3: Confirmar que en ese preciso paso el símbolo de desigualdad haya sido invertido.'
- 'Paso 4: Realizar una prueba con un número para confirmar la corrección.'
errores_correccion: '- **Error común:** Mantener el mismo símbolo al pasar dividiendo
  un número negativo.

  - **Cómo corregirlo:** Cada vez que el divisor tenga un signo menos, gira la flecha
  del símbolo de inmediato.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
fuente: Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades
