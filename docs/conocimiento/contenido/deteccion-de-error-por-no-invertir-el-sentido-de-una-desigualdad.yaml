semantic_id: MAT.ALG.DESIG_PROPIEDADES.ERROR_CAMBIO_SENTIDO
resumen_inicial: 'Detección de error por no invertir el sentido de una desigualdad:
  relaciones de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Resolver inecuaciones exige conocer precisamente qué operaciones
  conservan la desigualdad y cuáles la invierten. Los errores al respecto pueden cambiar
  por completo el conjunto solución.
explicacion_formal: "### Definición formal\nSea $a < b$. \nSi $c \\in \\mathbb{R}$,\
  \ entonces $a + c < b + c$.\nSi $c > 0$, entonces $a \\cdot c < b \\cdot c$.\nSi\
  \ $c < 0$, entonces $a \\cdot c > b \\cdot c$.\n\n### Desarrollo didáctico\nUn error\
  \ frecuente es asumir que restar un número (que se percibe como una operación \"\
  negativa\") altera el sentido. Sin embargo, desplazar los puntos a la izquierda\
  \ o a la derecha en la recta numérica (suma y resta) no altera su orden relativo.\
  \ Únicamente la dilatación/contracción combinada con una reflexión (multiplicación/división\
  \ por negativos) es la que transpone la relación de orden."
definiciones_clave: '- **Detección de error por no invertir el sentido de una desigualdad**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a detección de error por no invertir el
  sentido de una desigualdad.'
ejemplo_guiado:
