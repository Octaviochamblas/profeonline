  - 'Dividir el total sumado entre la cantidad de elementos en lugar de dividir por la suma de los consecuentes.'
  - 'La suma de los antecedentes dividida por la suma de los consecuentes da como resultado $k^3$ en una serie de 3 razones.'
  - 'La suma de los valores calculados para cada parte puede diferir de la suma total inicial recibida.'
  - 'La suma de los valores calculados para cada parte puede diferir de la suma total inicial recibida.'
  - 'Aplicar la propiedad de la suma de términos cuando las razones de la serie tienen constantes diferentes.'
afirmaciones_verdaderas:
  - 'En toda serie de razones iguales, el cociente entre la suma de los antecedentes y la suma de los consecuentes conserva el valor constante de la serie: $\frac{\sum a_i}{\sum b_i} = k$.'
  - 'Para repartir un total $T$ en una razón dada $b_1 : b_2 : \dots : b_n$, la constante de proporcionalidad se calcula como $k = \frac{T}{b_1 + b_2 + \dots + b_n}$.'
al_terminar_debes_poder: 'Aplicar la propiedad de la suma de términos $\frac{\sum a_i}{\sum b_i} = k$ para resolver problemas de reparto proporcional y hallar incógnitas en series de razones.'
