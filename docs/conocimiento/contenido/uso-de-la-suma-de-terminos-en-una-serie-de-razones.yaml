semantic_id: MAT.NUM.RAZONES_PROPORCIONES.SUMA_TERMINOS_SERIE
resumen_inicial: 'En toda serie de razones iguales, la suma de los antecedentes dividida por la suma de los consecuentes es igual a la misma constante $k$: $\frac{a + c + e}{b + d + f} = k$, lo que permite resolver repartos proporcionales.'
explicacion_simple: "![Propiedad de la suma en serie de razones](/static/img/nodos/uso-de-la-suma-de-terminos-en-una-serie-de-razones-intro.svg)\n\nExiste una propiedad mágica en las series de razones iguales:\n- **Si sumas todos los numeradores y sumas todos los denominadores, ¡el valor $k$ sigue siendo el mismo!**\n$$\\frac{a}{b} = \\frac{c}{d} = \\frac{e}{f} = k \\implies \\frac{a + c + e}{b + d + f} = k$$\n- **¿Para qué sirve esto?** Para repartir dinero, herencias o calcular perímetros:\n  - Si quieres repartir $\\$\\$90.00$0$ entre 3 personas en razón $2 : 3 : 4$:\n  - Sumas los consecuentes: $2 + 3 + 4 = 9$.\n  - Divides el total: $k = \\frac{90.000}{9} = 10.000$.\n  - Multiplicas cada parte: $\\$\\$20.000$, \\$\\$30.000$, \\$\\$40.00$0$."
explicacion_formal: '**Teorema Fundamental de la Suma en Series Proporcionales:**

  Sea la serie de razones iguales $\frac{a_1}{b_1} = \frac{a_2}{b_2} = \dots = \frac{a_n}{b_n} = k$ con $\sum b_i \neq 0$. Entonces:


  $$\frac{a_1 + a_2 + \dots + a_n}{b_1 + b_2 + \dots + b_n} = \frac{\sum_{i=1}^n a_i}{\sum_{i=1}^n b_i} = k$$


  **Demostración:**

  Dado que $a_i = k \cdot b_i$ para todo $i$:

  $$\sum_{i=1}^n a_i = \sum_{i=1}^n (k \cdot b_i) = k \cdot \sum_{i=1}^n b_i$$

  Dividiendo ambos miembros por $\sum b_i$:

  $$\frac{\sum a_i}{\sum b_i} = k \quad \blacksquare$$'
definiciones_clave: '- **Teorema de la suma**: Identidad $\frac{\sum a_i}{\sum b_i} = k$.

  - **Reparto proporcional directo**: Distribución de una cantidad total $S$ en partes proporcionales a $b_1, b_2, \dots, b_n$.

  - **Suma de antecedentes ($\sum a_i = S$)**: Cantidad total a repartir.'
propiedades_relaciones: '- **Conservación estricta de la constante**: El valor $k$ no varía al sumar los términos.

  - **Fórmula directa de reparto**: Cada parte individual es $a_i = \frac{S}{\sum b_j} \cdot b_i$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de suma en serie de razones](/static/img/nodos/uso-de-la-suma-de-terminos-en-una-serie-de-razones-ejemplos.svg)


    Reparta $\\$90.000$ entre tres personas en la razón $2 : 3 : 4$, y halle los lados de un triángulo cuyo perímetro es $48\text{ cm}$ si sus lados están en la razón $3 : 4 : 5$.'
  pasos:
  - 'Paso 1: Para el dinero: Sumar consecuentes: $2 + 3 + 4 = 9$.'
  - 'Paso 2: Calcular la constante $k$: $k = \frac{90.000}{9} = 10.000$.'
  - 'Paso 3: Hallar cada parte: $2(10.000) = $\\$20.00$0$, $3(10.000) = $\\$30.00$0$, $4(10.000) = $\\$40.00$0$.'
  - 'Paso 4: Para el triángulo: Suma de consecuentes = $3 + 4 + 5 = 12 \implies k = \frac{48}{12} = 4\text{ cm}$.'
  - 'Paso 5: Lados: $3(4) = 12\text{ cm}$, $4(4) = 16\text{ cm}$, $5(4) = 20\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{x}{2} = \frac{y}{3} = \frac{z}{5}$ y $x + y + z = 100$, ¿cuál es el valor de la constante $k$?
  choices:
  - text: $10$ (porque $k = \frac{100}{2 + 3 + 5} = \frac{100}{10} = 10$)
    is_correct: true
  - text: $20$
    is_correct: false
  - text: $5$
    is_correct: false
  - text: $50$
    is_correct: false
  explanation: La alternativa correcta es '$10$ (porque $k = \frac{100}{2 + 3 + 5} = \frac{100}{10} = 10$)'.
  reinforcement_section: Explicación formal
