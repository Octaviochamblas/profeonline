resumen_inicial: 'En toda serie de razones iguales $\frac{a}{b} = \frac{c}{d} = \frac{e}{f}
  = k$, la suma de todos los antecedentes dividida entre la suma de todos los consecuentes
  mantiene el mismo valor de la razón $k$: $\frac{a + c + e}{b + d + f} = k$.'
explicacion_simple: Una propiedad mágica de las series de razones iguales es que si
  sumamos todos los números de arriba y los dividimos entre la suma de todos los números
  de abajo, el resultado final sigue siendo exactamente la misma constante $k$.
explicacion_formal: 'Dada la serie de razones iguales $\frac{a_1}{b_1} = \frac{a_2}{b_2}
  = \dots = \frac{a_m}{b_m} = k$, se cumple la **Propiedad de la Suma de Términos**:


  $$\frac{\sum_{i=1}^m a_i}{\sum_{i=1}^m b_i} = \frac{a_1 + a_2 + \dots + a_m}{b_1
  + b_2 + \dots + b_m} = k$$


  **Demostración:**

  Como $a_i = k \cdot b_i \implies \sum a_i = \sum (k \cdot b_i) = k \sum b_i \implies
  \frac{\sum a_i}{\sum b_i} = k$.


  > **Complemento didáctico:** Esta propiedad es fundamental para resolver problemas
  de reparto proporcional con total conocido.'
definiciones_clave: '- **Propiedad de suma en serie de razones**: Igualdad $\frac{a
  + c + e}{b + d + f} = k$ que conserva el valor de la razón.'
propiedades_relaciones: '- **Conservación de constante $k$**: La razón entre la suma
  de antecedentes y consecuentes es igual a $k$.'
ejemplo_guiado:
  enunciado: 'Tres números $a, b, c$ están en la razón $2 : 3 : 5$ y su suma es $a
    + b + c = 80$. Calcule el valor de cada número.'
  pasos:
  - 'Paso 1: Plantear la serie de razones: $\frac{a}{2} = \frac{b}{3} = \frac{c}{5}
    = k$.'
  - 'Paso 2: Aplicar la propiedad de la suma de términos: $\frac{a + b + c}{2 + 3
    + 5} = k \implies \frac{80}{10} = k \implies k = 8$.'
  - 'Paso 3: Calcular cada número multiplicando su consecuente por $k=8$:

    - $a = 2 \cdot 8 = 16$

    - $b = 3 \cdot 8 = 24$

    - $c = 5 \cdot 8 = 40$.'
  - 'Conclusión: Los números son $a=16$, $b=24$ y $c=40$ (verificable: $16+24+40=80$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con el valor de la razón al dividir la suma de todos los antecedentes
    entre la suma de todos los consecuentes en una serie de razones?
  choices:
  - text: Mantiene exactamente el mismo valor constante k de la serie
    is_correct: true
  - text: El valor k se multiplica por la cantidad de términos
    is_correct: false
  - text: El valor k se convierte en cero
    is_correct: false
  - text: El valor k se eleva al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Mantiene exactamente el mismo valor constante
    k de la serie'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para a : b : c = 2 : 3 : 5 con suma 80, ¿cuál fue
    la constante k y el valor de a?'
  choices:
  - text: k = 8 y a = 16
    is_correct: true
  - text: k = 10 y a = 20
    is_correct: false
  - text: k = 5 y a = 10
    is_correct: false
  - text: k = 80 y a = 40
    is_correct: false
  explanation: La alternativa correcta es 'k = 8 y a = 16'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad de la suma
  de términos $\frac{a + c + e}{b + d + f} = k$ para resolver problemas de reparto
  proporcional.
semantic_id: MAT.NUM.RAZONES.SUMA_TERMINOS_SERIE
procedimiento:
- 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la comparación por
  cociente.'
- 'Paso 2: Calcular el valor de la razón $k = a / b$ o aplicar las propiedades de
  series de razones.'
- 'Paso 3: Simplificar y expresar la respuesta en términos del problema planteado.'
errores_correccion: '- **Error 1: Confundir la comparación por cociente con la comparación
  por diferencia (resta).** **Cómo corregirlo:** La razón matemática es multiplicativa
  por división ($a/b$), no por resta ($a-b$).


  - **Error 2: Invertir el orden entre antecedente y consecuente.** **Cómo corregirlo:**
  Respetar estrictamente el orden nombrado en el enunciado ($a:b$ pone a $a$ arriba
  y a $b$ abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAZONES.SUMA_TERMINOS_SERIE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de razones.
- titulo: Ejemplo 2
  enunciado: Verificación de la relación proporcional.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por cociente.
- titulo: ¿Es el consecuente de una razón siempre distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división por cero.
- titulo: ¿Se conserva la constante k al sumar antecedentes y consecuentes en una
    serie?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de las series de razones.
errores_frecuentes:
- Calcular la razón entre dos magnitudes mediante la resta de sus valores numéricos.
- Invertir la posición del antecedente y del consecuente alterando el valor escalar
  de la razón.
- Utilizar el número cero como el consecuente de una razón matemática.
- La constante de la razón $k$ en una serie de razones cambia al sumar los antecedentes.
- Sumar directamente los términos de la razón sin multiplicar por la constante $k$.
afirmaciones_verdaderas:
- 'Una razón es la comparación por cociente $a : b = \frac{a}{b}$ entre dos magnitudes
  con $b \neq 0$.'
- En una serie de razones iguales $\frac{a}{b} = \frac{c}{d} = k$, la razón entre
  la suma de antecedentes y la suma de consecuentes equivale a $k$.
