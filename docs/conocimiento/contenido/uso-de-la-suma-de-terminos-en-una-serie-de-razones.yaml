semantic_id: MAT.NUM.RAZONES.SUMA_TERMINOS_SERIE
resumen_inicial: 'La propiedad de la suma de términos establece que en toda serie de razones iguales, la suma de los antecedentes dividida entre la suma de los consecuentes es igual a la constante de la serie: $\frac{a+b+c}{x+y+z} = k$.'
explicacion_simple: |
  Esta propiedad es un atajo genial para resolver problemas de reparto de totales. Si sabes que tres cantidades $a, b, c$ están en la razón $2 : 3 : 5$ y que el total sumado de las tres es $200$, no necesitas adivinar. La suma de los tres números del total ($200$) dividida por la suma de las tres partes ($2 + 3 + 5 = 10$) te da directamente la constante $k = \frac{200}{10} = 20$. Con $k = 20$, calculas rápidamente cada cantidad: $a = 2 \cdot 20 = 40$, $b = 3 \cdot 20 = 60$, $c = 5 \cdot 20 = 100$.
explicacion_formal: |
  ### Definición formal
  La **propiedad de la suma de términos de una serie de razones iguales** establece que para cualquier serie de $n$ razones $\frac{a_1}{b_1} = \frac{a_2}{b_2} = \dots = \frac{a_n}{b_n} = k$:
  $$\frac{\sum_{i=1}^n a_i}{\sum_{i=1}^n b_i} = \frac{a_1 + a_2 + \dots + a_n}{b_1 + b_2 + \dots + b_n} = k$$

  ### Demostración analítica
  Expresando cada antecedente mediante la parametrización $a_i = b_i \cdot k$:
  1. $\sum a_i = a_1 + a_2 + \dots + a_n = b_1 k + b_2 k + \dots + b_n k$.
  2. Factorizamos la constante $k$ en la suma del numerador:
     $$\sum a_i = k \cdot (b_1 + b_2 + \dots + b_n) = k \cdot \sum b_i$$
  3. Dividiendo ambos miembros por la suma de consecuentes $\sum b_i \neq 0$:
     $$\frac{\sum a_i}{\sum b_i} = k$$

  ### Aplicación en problemas de reparto de un total $T$
  Si $T = a_1 + a_2 + \dots + a_n$ representa el total conocido:
  $$k = \frac{T}{b_1 + b_2 + \dots + b_n} \implies a_i = b_i \cdot \frac{T}{\sum b_i}$$

  ### Síntesis didáctica
  - Ecuación clave de reparto: $k = \frac{\text{Suma de antecedentes (Total)}}{\text{Suma de consecuentes}}$.
definiciones_clave: |
  - **Propiedad de suma de términos**: Teorema que demuestra que la razón entre la suma de los antecedentes y la suma de los consecuentes mantiene el valor de la constante $k$.
  - **Total de la suma $T$**: Suma acumulada $a_1 + a_2 + \dots + a_n$ dada como dato en problemas de reparto proporcional.
  - **Factor de reparto $\frac{T}{\sum b_i}$**: Valor numérico de la constante $k$ obtenido dividiendo el total $T$ por la suma de las partes del consecuente.
propiedades_relaciones: |
  - **Generalización a restas combinadas**: La propiedad se cumple para cualquier combinación lineal: $\frac{m \cdot a_1 + n \cdot a_2}{m \cdot b_1 + n \cdot b_2} = k$.
  - **Propiedad del producto de razones**: Al multiplicar todas las razones de la serie, el producto de los antecedentes dividido por el producto de los consecuentes es igual a $k^n$: $\frac{a_1 \cdot a_2 \cdots a_n}{b_1 \cdot b_2 \cdots b_n} = k^n$.
ejemplo_guiado:
  enunciado: 'Se desea repartir una herencia de $\$90.000.000$ entre tres herederos en la razón $2 : 3 : 4$. Determina la cantidad de dinero que le corresponde a cada uno aplicando la propiedad de la suma de términos.'
  pasos:
    - 'Paso 1: Identificamos los consecuentes de la serie: $b_1 = 2, b_2 = 3, b_3 = 4$ y el total $T = 90.000.000$.'
    - 'Paso 2: Sumamos los consecuentes de las partes: $2 + 3 + 4 = 9$.'
    - 'Paso 3: Calculamos la constante de la serie $k$ dividiendo el total por la suma de consecuentes: $k = \frac{90.000.000}{9} = 10.000.000$.'
    - 'Paso 4: Multiplicamos cada consecuente por $k$ para obtener cada parte: $a_1 = 2 \cdot 10.000.000 = \$20.000.000$, $a_2 = 3 \cdot 10.000.000 = \$30.000.000$, $a_3 = 4 \cdot 10.000.000 = \$40.000.000$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué equivale el cociente entre la suma de los antecedentes y la suma de los consecuentes $\frac{a+b+c}{x+y+z}$ en una serie de razones iguales?'
    choices:
      - {text: 'Exactamente al mismo valor constante de la serie $k$', is_correct: true}
      - {text: 'Al triple de la constante $3k$', is_correct: false}
      - {text: 'Al cuadrado de la constante $k^2$', is_correct: false}
      - {text: '$1$, anulando la serie', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente al mismo valor constante de la serie $k$''. La propiedad de la suma de términos demuestra que $\frac{\sum a}{\sum b} = k$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Se reparten 150 caramelos entre dos niños en la razón $2 : 3$. ¿Cuántos caramelos recibe el segundo niño?'
    choices:
      - {text: '$90$, calculando $k = 150 / 5 = 30$ y luego $3 \cdot 30 = 90$', is_correct: true}
      - {text: '$60$, calculando la parte del primer niño', is_correct: false}
      - {text: '$75$, dividiendo en partes iguales', is_correct: false}
      - {text: '$50$, dividiendo entre 3', is_correct: false}
    explanation: 'La alternativa correcta es ''$90$, calculando $k = 150 / 5 = 30$ y luego $3 \cdot 30 = 90$''. Sumamos $2 + 3 = 5$, obtenemos $k = 150/5 = 30$ y el segundo recibe $3 \cdot 30 = 90$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sumar todos los números de los consecuentes (las partes de la razón): $\sum b_i = b_1 + b_2 + \dots + b_n$.'
  - 'Paso 2: Tomar el dato del total sumado de la magnitud ($T = \sum a_i$).'
  - 'Paso 3: Calcular la constante de la serie $k$ mediante la división $k = \frac{T}{\sum b_i}$.'
  - 'Paso 4: Multiplicar cada consecuente por el valor $k$ hallado para determinar cada valor individual $a_i = b_i \cdot k$.'
errores_correccion: |
  - **Error 1:** Dividir el total entre el número de personas en lugar de dividirlo por la suma de los consecuentes (ej: repartir 150 entre 2 personas haciendo $150 \div 2 = 75$ ignorando la razón $2 : 3$). **Cómo corregirlo:** La división del total debe hacerse **entre la suma de las partes de la razón**: $2 + 3 = 5 \implies k = 150 \div 5 = 30$.
  - **Error 2:** Multiplicar el total por los consecuentes sin dividir primero por su suma (ej: hacer $150 \cdot 3 = 450$). **Cómo corregirlo:** Primero debes hallar la constante unitaria $k = \frac{\text{Total}}{\text{Suma consecuentes}}$ y recién después multiplicar.
ejemplos:
  - titulo: 'Reparto de un perímetro triangular'
    enunciado: 'Un triángulo de perímetro $60\text{ cm}$ tiene sus lados en la razón $3 : 4 : 5$. ¿El lado mayor mide $25\text{ cm}$?'
    alternativas:
      - 'Sí, pues $k = 60 / 12 = 5 \implies 5 \cdot 5 = 25\text{ cm}$'
      - 'No, mide 20 cm'
      - 'No, mide 30 cm'
    respuesta: 'Sí, pues $k = 60 / 12 = 5 \implies 5 \cdot 5 = 25\text{ cm}$'
    solucion_pasos:
      - '1. Suma de consecuentes: $3 + 4 + 5 = 12$.'
      - '2. Constante: $k = 60 / 12 = 5$.'
      - '3. Lado mayor: $5 \cdot 5 = 25\text{ cm}$.'
  - titulo: 'Suma de antecedentes en 2 razones'
    enunciado: 'En la serie $\frac{a}{4} = \frac{b}{6} = k$, si $a + b = 50$, ¿la constante es $k = 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $k = \frac{a+b}{4+6} = \frac{50}{10} = 5$.'
  - titulo: 'Reparto de ángulos de un triángulo'
    enunciado: 'Los ángulos interiores de un triángulo están en la razón $1 : 2 : 3$. Sabiendo que su suma es $180^\circ$, ¿el ángulo mayor mide $90^\circ$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 + 2 + 3 = 6 \implies k = 180^\circ / 6 = 30^\circ \implies 3 \cdot 30^\circ = 90^\circ$.'
  - titulo: 'Constante en serie reducida'
    enunciado: '¿La razón $\frac{a+b+c}{x+y+z}$ siempre da el mismo valor que $\frac{a}{x}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la propiedad fundamental de la suma de términos.'
