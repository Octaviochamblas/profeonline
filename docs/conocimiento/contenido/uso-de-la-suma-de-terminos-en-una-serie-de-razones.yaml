semantic_id: MAT.NUM.RAZONES.SUMA_TERMINOS_SERIE
resumen_inicial: En una serie de razones iguales $\frac{a}{x} = \frac{b}{y} = \frac{c}{z}
  = k$, la suma de los antecedentes dividida por la suma de los consecuentes es igual a la
  misma constante $k$ ($\frac{a+b+c}{x+y+z} = k$).
explicacion_simple: 'Una propiedad mágica de las series de razones es que si sumas todos los
  números de arriba (antecedentes) y los divides entre la suma de todos los números de abajo
  (consecuentes), **la razón sigue valiendo exactamente lo mismo ($k$)**:

  $$\frac{a + b + c}{x + y + z} = k$$

  Esto permite resolver problemas de repartos y sumas de variables rápidamente.'
explicacion_formal: 'Para toda serie de razones $\frac{a_i}{b_i} = k$ ($1 \le i \le n$), se
  cumple la propiedad de adición subradical:

  $$\frac{\sum_{i=1}^n a_i}{\sum_{i=1}^n b_i} = \frac{k b_1 + k b_2 + \dots + k b_n}{b_1 +
  b_2 + \dots + b_n} = \frac{k(b_1 + b_2 + \dots + b_n)}{b_1 + b_2 + \dots + b_n} = k$$'
definiciones_clave: '- **Propiedad fundamental de suma de series**: La razón entre la suma
  de antecedentes y la suma de consecuentes conserva el valor $k$.'
propiedades_relaciones: '- **Conservación de la constante**: $\frac{a+b}{x+y} = \frac{a}{x}
  = \frac{b}{y} = k$.'
ejemplo_guiado:
  enunciado: Tres números $a$, $b$ y $c$ están en la razón $2:3:5$. Si la suma $a + b + c
    = 100$, halla el valor de cada número.
  pasos:
  - 'Escribir la serie de razones: $\frac{a}{2} = \frac{b}{3} = \frac{c}{5} = k$.'
  - 'Aplicar la propiedad de la suma: $\frac{a+b+c}{2+3+5} = k$.'
  - 'Sustituir la suma dada: $\frac{100}{10} = k \implies k = 10$.'
  - 'Calcular los números: $a = 2 \cdot 10 = 20$, $b = 3 \cdot 10 = 30$, $c = 5 \cdot 10 =
    50$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{x}{4} = \frac{y}{6} = k$ y sabemos que $x + y = 50$, ¿cuál es el valor
    de la constante $k$?
  choices:
  - text: '5'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '25'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: 'La correcta es: 5. $k = \frac{x+y}{4+6} = \frac{50}{10} = 5$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dos cantidades $A$ y $B$ están en razón $3:7$. Si $A + B = 80$, ¿cuál es el valor
    de $A$?
  choices:
  - text: '24'
    is_correct: true
  - text: '56'
    is_correct: false
  - text: '30'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: 'La correcta es: 24. $k = \frac{80}{3+7} = 8 \implies A = 3 \cdot 8 = 24$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar la relación proporcional en forma de serie de razones con la constante
  $k$.'
- 'Paso 2: Dividir la suma total dada entre la suma de los consecuentes para obtener $k$.'
- 'Paso 3: Multiplicar $k$ por cada consecuente individual para hallar las cantidades buscadas.'
errores_correccion: Asegúrate de sumar los consecuentes correspondientes a las variables dadas.
  $2+3+5 = 10$, de donde $100 / 10 = 10$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{x}{2} = \frac{y}{3}$ y $x+y=20$, halla $x$.
  alternativas:
  - '8'
  - '12'
  - '4'
  respuesta: '8'
  solucion_pasos:
  - $k = 20/5 = 4 \implies x = 2 \cdot 4 = 8$.
- titulo: Ejemplo 2
  enunciado: Si a/3 = b/5 = k y a más b es igual a 40, ¿cuál es el valor de k?
  alternativas:
  - '5'
  - '8'
  - '10'
  respuesta: '5'
  solucion_pasos:
  - k es igual a (a más b) dividido entre (3 más 5), es decir 40 dividido entre 8, o sea 5.
- titulo: ¿La propiedad de la suma de términos requiere que todas las razones tengan el mismo
    valor k?
  respuesta: Sí
  solucion_pasos:
  - Es la condición necesaria para que la propiedad se cumpla.
- titulo: ¿Se puede aplicar esta propiedad conociendo solo el valor de un antecedente?
  respuesta: 'No'
  solucion_pasos:
  - Se necesita conocer la suma total de los antecedentes o de los consecuentes involucrados.
errores_frecuentes:
- Dividir la suma total entre la cantidad de términos en vez de la suma de consecuentes.
- Sumar los antecedentes y dividirlos por la cantidad de razones en vez de por la suma de
  los consecuentes.
- Aplicar la propiedad de la suma sin haber verificado que todas las razones comparten el
  mismo valor k.
- Confundir la suma de antecedentes con la suma de consecuentes al plantear la fracción.
- Olvidar multiplicar la constante k por cada consecuente individual para obtener las cantidades
  finales.
afirmaciones_verdaderas:
- $\frac{\sum a_i}{\sum b_i} = k$.
- La propiedad de la suma de términos permite encontrar la constante k sin calcular cada razón
  por separado, cuando se conoce la suma total de los antecedentes.
al_terminar_debes_poder: Resolver problemas de repartos proporcionales aplicando la suma de
  términos de una serie.
fuente: Texto escolar MINEDUC.
estado: publicado
