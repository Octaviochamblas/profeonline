procedimiento:
- 'Paso 1: Sumar todos los términos consecuentes de la razón dada: $\sum b_i$.'
- 'Paso 2: Dividir la suma total de los antecedentes (el valor total $S$) por la suma de consecuentes para hallar $k = \frac{S}{\sum b_i}$.'
- 'Paso 3: Multiplicar la constante $k$ por cada consecuente individual para obtener el valor de cada parte $a_i = b_i \cdot k$ y verificar la suma total.'
errores_correccion: '- **Error 1: Dividir la cantidad total entre el número de partes en vez de la suma de consecuentes.** **Cómo corregirlo:** Si se divide por 3, sería un reparto equitativo. Se DEBE dividir por la suma de consecuentes: $k = \frac{S}{b_1 + b_2 + b_3}$.

  - **Error 2: Olvidar comprobar la suma.** **Cómo corregirlo:** La suma de todas las partes calculadas debe coincidir exactamente con el total inicial.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Se reparten $60$ dulces entre dos niños en la razón $1 : 3$. ¿Cuántos dulces recibe el que recibe más?'
  alternativas:
  - $45$ dulces
  - $15$ dulces
  - $20$ dulces
  respuesta: $45$ dulces
  solucion_pasos:
  - Suma consecuentes = $1 + 3 = 4 \implies k = \frac{60}{4} = 15$. El mayor recibe $3 \cdot 15 = 45$ dulces.
- titulo: Ejemplo 2
  enunciado: 'Los ángulos interiores de un triángulo están en la razón $2 : 3 : 4$. Sabiendo que suman $180^\circ$, ¿cuánto mide el ángulo mayor?'
  alternativas:
  - $80^\circ$
  - $60^\circ$
  - $40^\circ$
  respuesta: $80^\circ$
  solucion_pasos:
  - Suma consecuentes = $2 + 3 + 4 = 9 \implies k = \frac{180^\circ}{9} = 20^\circ$. Ángulo mayor = $4 \cdot 20^\circ = 80^\circ$.
- titulo: ¿Es (a + c) / (b + d) = k si a/b = c/d = k?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el teorema de la suma para $n = 2$ razones.
  alternativas:
  - texto: Sí, la suma de antecedentes dividida por la suma de consecuentes preserva k
    es_correcta: true
    retroalimentacion: ¡Correcto! Teorema fundamental de la suma.
  - texto: No, el resultado se duplica a 2k
    es_correcta: false
    retroalimentacion: Incorrecto, el factor se simplifica en numerador y denominador.
  - texto: No, da k al cuadrado
    es_correcta: false
    retroalimentacion: Incorrecto, $k^2$ se produce en el producto, no en la suma.
- titulo: ¿Permite este método repartir cualquier cantidad en partes proporcionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el método universal de reparto proporcional directo.
  alternativas:
  - texto: Sí, es el algoritmo general para repartos proporcionales
    es_correcta: true
    retroalimentacion: ¡Correcto! Aplicable a herencias, sociedades y geometría.
  - texto: No, solo funciona si los números son múltiplos de 10
    es_correcta: false
    retroalimentacion: Incorrecto, funciona con cualquier número real.
  - texto: No, solo aplica para dos partes
    es_correcta: false
    retroalimentacion: Incorrecto, aplica para cualquier número $n$ de partes.
errores_frecuentes:
- Dividir el total por la cantidad de personas en vez de la suma de consecuentes.
- Olvidar multiplicar la constante $k$ por cada término individual.
- No verificar que las partes sumen la cantidad inicial.
- Confundir la suma de consecuentes con su producto.
afirmaciones_verdaderas:
- 'La suma de los antecedentes entre la suma de los consecuentes es igual a la constante $k$: $\frac{\sum a_i}{\sum b_i} = k$.'
- Es la base del algoritmo de reparto proporcional directo de cantidades.
- La constante $k$ representa el valor de una sola parte o unidad proporcional.
al_terminar_debes_poder: '![Síntesis de suma en serie de razones](/static/img/nodos/uso-de-la-suma-de-terminos-en-una-serie-de-razones-resumen.svg)


  QUÉ: Aplicar el teorema de la suma de términos en series de razones iguales para resolver problemas de reparto proporcional.


  CÓMO: Calculando la constante $k = \frac{\text{Total}}{\sum b_i}$ y multiplicándola por cada consecuente individual $a_i = b_i \cdot k$ para determinar cada magnitud y verificar la suma total.'
