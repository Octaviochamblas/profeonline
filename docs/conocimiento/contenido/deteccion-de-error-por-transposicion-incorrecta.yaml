semantic_id: MAT.ALG.RESOLUCION_LINEAL.DETECCION_ERROR_TRANSPOSICION
resumen_inicial: Trasponer un término sin cambiar su signo o cambiar erróneamente el signo a un divisor son los errores más comunes al despejar ecuaciones.
explicacion_simple: |
  Al resolver ecuaciones lineales de primer grado, es frecuente cometer imprecisiones al trasladar términos entre miembros.

  Los dos errores más recurrentes consisten en:

  1. Trasponer un término sumando o restando al otro miembro sin invertir su signo aditivo (mantener $+5$ como $+5$).
  2. Trasponer un coeficiente multiplicativo a dividir cambiando innecesariamente su signo (transformar el factor multiplicativo $\cdot 3$ en $\div (-3)$).

  Identificar y corregir estos fallos procedimentales es fundamental para alcanzar el conjunto solución correcto.
explicacion_formal: |
  ### Definición formal
  Dada la ecuación $a x + b = c$, se contraponen formalmente la **transposición errónea** y la **transposición correcta**:

  $$\text{Error 1 (signo de sumando): } a x = c + b \quad \neq \quad \text{Correcto: } a x = c - b$$

  $$\text{Error 2 (signo de divisor): } x = \frac{c - b}{-a} \quad \neq \quad \text{Correcto: } x = \frac{c - b}{a} \quad \text{con } a > 0$$

  ### Desglose de la fórmula
  - Al trasponer sumandos o restas se debe aplicar obligatoriamente su opuesto aditivo (cambio de signo $+ \to -$ o $- \to +$).
  - Al trasponer factores multiplicativos no nulos se conserva estrictamente el signo del número divisor.

  ### Síntesis didáctica
  Diferenciar conceptualmente el cambio de signo de la suma respecto al mantenimiento del signo en la división evita los fallos algebraicos más habituales.
definiciones_clave: |
  - **Error de signo en transposición**: Omisión del cambio de signo al trasladar un término sumando o restando entre miembros.
  - **Error de signo en divisor**: Alteración injustificada del signo de un factor multiplicativo al trasponerlo dividiendo.
propiedades_relaciones: |
  - **Verificación diagnóstica**: Evaluar numéricamente una solución en la ecuación original revela de inmediato si ocurrió un fallo de transposición.
  - **Doble error compensatorio**: Cometer dos errores de signo opuestos en la transposición puede disimular la inconsistencia produciendo resultados falsos.
ejemplo_guiado:
  enunciado: 'Analiza el despeje de la ecuación $6x + 8 = 32$. Detecta el error en la propuesta $6x = 32 + 8 \implies 6x = 40 \implies x = \frac{40}{6}$, corrígelo y evalúa la solución verdadera.'
  pasos:
    - 'Paso 1: Identificar el error procedimental: el término $+8$ del primer miembro se traspuso como $+8$ en vez de restando como $-8$.'
    - 'Paso 2: Corregir la transposición del término independiente: $6x = 32 - 8$.'
    - 'Paso 3: Calcular la diferencia en el segundo miembro: $6x = 24$.'
    - 'Paso 4: Trasponer el coeficiente $6$ dividiendo conservando su signo: $x = \frac{24}{6} = 4$.'
    - 'Paso 5: Comprobar la solución correcta en $6x + 8 = 32$: $6(4) + 8 = 24 + 8 = 32$, confirmando el valor $x = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la transposición procedimental correcta para el término $+8$ en la ecuación $6x + 8 = 32$?'
    choices:
      - {text: 'Trasponerlo restando como $-8$ al segundo miembro: $6x = 32 - 8$.', is_correct: true}
      - {text: 'Trasponerlo sumando como $+8$ al segundo miembro: $6x = 32 + 8$.', is_correct: false}
      - {text: 'Trasponerlo dividiendo como $\frac{32}{8}$.', is_correct: false}
      - {text: 'Multiplicarlo directamente por $32$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Trasponerlo restando como $-8$ al segundo miembro: $6x = 32 - 8$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al corregir el error de transposición en $6x + 8 = 32$, ¿cuál es la solución verdadera obtenida para $x$?'
    choices:
      - {text: '$x = 4$', is_correct: true}
      - {text: '$x = \frac{40}{6}$', is_correct: false}
      - {text: '$x = 6$', is_correct: false}
      - {text: '$x = 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 4$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar paso a paso cada paso algebraico en la solución planteada.'
  - 'Paso 2: Verificar que cada término trasladado como adición o sustracción haya invertido su signo aditivo.'
  - 'Paso 3: Confirmar que los coeficientes trasponiéndose a dividir mantengan intacto su signo original.'
  - 'Paso 4: Realizar la verificación por sustitución directa en la ecuación inicial para asegurar la veracidad del despeje.'
errores_correccion: |
  - **Error 1:** Trasponer un sumando $+b$ sin invertir su signo al pasar al miembro opuesto. **Cómo corregirlo:** Todo sumando que cruce el signo igual **CAMBIA AL SIGNO OPUESTO AL TRASLADARSE ($+b \implies -b$)**.
  - **Error 2:** Cambiar el signo del coeficiente multiplicativo al trasponerlo dividiendo (escribir $5x = 20 \implies x = \frac{20}{-5}$). **Cómo corregirlo:** La división **CONSERVA EL SIGNO DEL FACTOR DIVISOR; SI EL COEFICIENTE ES $+5$, PASA DIVIDIENDO COMO $+5$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Identifica el error en la resolución $3x - 12 = 15 \implies 3x = 15 - 12 = 3 \implies x = 1$.'
    alternativas:
      - 'El término $-12$ debió pasar sumando como $+12$'
      - 'El coeficiente $3$ debió pasar restando'
      - 'El resultado $15 - 12$ fue calculado incorrectamente'
    respuesta: 'El término $-12$ debió pasar sumando como $+12$'
    solucion_pasos:
      - '1. En $3x - 12 = 15$, el término es $-12$.'
      - '2. Debe trasponerse como $+12$: $3x = 15 + 12 = 27$.'
      - '3. Solución verdadera: $x = \frac{27}{3} = 9$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En el despeje $-2x = 10 \implies x = \frac{10}{2} = 5$, ¿cuál fue el error de transposición?'
    alternativas:
      - 'Se cambió el signo negativo del coeficiente al pasar dividiendo'
      - 'Se debió sumar $+2$ a $10$'
      - 'Se debió multiplicar $10$ por $-2$'
    respuesta: 'Se cambió el signo negativo del coeficiente al pasar dividiendo'
    solucion_pasos:
      - '1. El divisor debió conservar su signo: $x = \frac{10}{-2}$.'
      - '2. Solución verdadera: $x = -5$.'
  - titulo: 'Conservación del signo en la división'
    enunciado: '¿Trasponer un factor multiplicativo positivo como divisor positivo es correcto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la división mantiene el signo del divisor.'
  - titulo: 'Inversión de signo en adición'
    enunciado: '¿Mantener el mismo signo al trasladar un término sumando a otro miembro invalida la equivalencia de la ecuación?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues vulnera la propiedad aditiva de la igualdad.'
errores_frecuentes:
  - 'Trasponer un término sumando o restando conservando su signo original.'
  - 'Invertir el signo de un coeficiente al pasarlo dividiendo.'
  - 'Cambiar de signo a términos que permanecieron en el mismo miembro sin haber cruzado la igualdad.'
  - 'Dividir sumandos en lugar de restar al trasponer un término independiente.'
  - 'Asumir que la comprobación numérica dará correcta incluso tras cometer un error de signo.'
afirmaciones_verdaderas:
  - 'Los términos sumandos o restandos invierten su signo al ser traspuestos de un miembro a otro.'
  - 'Los coeficientes multiplicativos conservan su signo original al pasar dividiendo al miembro opuesto.'
al_terminar_debes_poder: |
  QUÉ: Detectar y corregir errores de transposición en la resolución de ecuaciones lineales.
  CÓMO: Auditar el paso a paso comprobando que sumandos inviertan su signo y divisores conserven su signo, verificando la solución corregida.
