semantic_id: MAT.ALG.RESOLUCION_LINEAL.DETECCION_ERROR_TRANSPOSICION
resumen_inicial: Trasponer un término sin cambiar su signo o cambiar el signo a un
  divisor son los errores más comunes al despejar ecuaciones.
explicacion_simple: 'Al resolver ecuaciones en pruebas y exámenes, es fácil cometer
  pequeñas equivocaciones al trasponer términos.

  Los dos errores más frecuentes son:

  1. Mover un término sumando al otro lado pero olvidar cambiarle el signo (mantener
  $+5$ como $+5$).

  2. Mover un coeficiente multiplicativo a dividir y cambiarle el signo por error
  (convertir $\cdot 3$ en $\div (-3)$).

  Detectar y corregir estos fallos es clave para obtener la solución correcta.'
explicacion_formal: 'Dada la ecuación $a x + b = c$, se contraponen la **transposición
  errónea** y la **transposición correcta**:


  $$\text{Error 1 (signo de sumando): } a x = c + b \quad \neq \quad \text{Correcto:
  } a x = c - b$$

  $$\text{Error 2 (signo de divisor): } x = \frac{c - b}{-a} \quad \neq \quad \text{Correcto:
  } x = \frac{c - b}{a} \quad (a > 0)$$


  **Desglose de la fórmula:**

  - Al trasponer sumandos/restas se cambia el SIGNO del término. Al trasponer factores/divisores
  se conserva el SIGNO del número.'
definiciones_clave: '- **Error de signo en transposición**: Omisión del cambio de
  signo al trasladar un término sumando/restando.

  - **Error de inversión de signo en divisor**: Cambio de signo injustificado al trasladar
  un factor multiplicativo a dividir.'
propiedades_relaciones: '- **Verificación como detector**: La prueba de sustitución
  directa revela inmediatamente si hubo un error de transposición previo.'
ejemplo_guiado:
  enunciado: Analiza el despeje de la ecuación $6x + 8 = 32$. Detecta el error en
    la propuesta $6x = 32 + 8 \implies 6x = 40 \implies x = \frac{40}{6}$, corrígelo
    y evalúa la solución verdadera.
  pasos:
  - 'Paso 1: Identificar el error: El término $+8$ pasó al segundo miembro como $+8$
    en vez de restando como $-8$.Paso 2: Corregir la transposición del sumando: $6x
    = 32 - 8$.Paso 3: Reducir el segundo miembro: $6x = 24$.Paso 4: Trasponer el coeficiente
    $6$ dividiendo: $x = \frac{24}{6} = 4$.Paso 5: Comprobar la solución correcta
    en $6x + 8 = 32$: $6(4) + 8 = 24 + 8 = 32$ (se verifica).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la transposición correcta para despejar $+8$ en la ecuación $6x
    + 8 = 32$?
  choices:
  - text: 'Pasa restando como $-8$ al segundo miembro: $6x = 32 - 8$.'
    is_correct: true
  - text: 'Pasa sumando como $+8$ al segundo miembro: $6x = 32 + 8$.'
    is_correct: false
  - text: Pasa dividiendo como $\frac{32}{8}$.
    is_correct: false
  - text: Pasa multiplicando por $32$.
    is_correct: false
  explanation: 'La alternativa correcta es ''Pasa restando como $-8$ al segundo miembro:
    $6x = 32 - 8$.''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al corregir la transposición en $6x + 8 = 32$, ¿cuál es la solución verdadera
    de $x$?
  choices:
  - text: $x = 4$
    is_correct: true
  - text: $x = \frac{40}{6}$
    is_correct: false
  - text: $x = 6$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Revisar cada paso del despeje de la ecuación.'
- 'Paso 2: Verificar que cada término sumando o restando haya invertido su signo al
  cruzar al otro miembro.'
- 'Paso 3: Verificar que el coeficiente multiplicativo haya pasado a dividir manteniendo
  su signo intacto.'
- 'Paso 4: Realizar la verificación por sustitución directa para confirmar la respuesta.'
errores_correccion: '- **Error común:** Trasponer un sumando $+b$ sin cambiarle el
  signo al otro lado.

  - **Cómo corregirlo:** Regla mnemotécnica: SI CRUZA EL IGUAL, CAMBIA DE SIGNO (para
  sumas y restas).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
