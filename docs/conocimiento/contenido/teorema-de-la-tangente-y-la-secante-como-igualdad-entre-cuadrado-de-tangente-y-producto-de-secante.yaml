semantic_id: MAT.GEO.CIRCULO_TEOREMAS.TANGENTE_SECANTE_PRODUCTO
resumen_inicial: 'El Teorema de la Tangente y la Secante establece que el cuadrado del segmento tangente es igual al producto del segmento exterior por el segmento total de la secante: PT² = PA · PB.'
explicacion_simple: 'Este teorema es una de las fórmulas más elegantes y preguntadas de toda la geometría:


  Si desde un punto exterior $P$ trazas una recta tangente ($PT$) y una recta secante ($PA$ exterior, $PB$ total):

  **¡El segmento tangente al cuadrado es igual al segmento exterior multiplicado por el segmento total!**


  $$\mathbf{PT^2 = PA \cdot PB}$$

  $$\mathbf{PT = \sqrt{PA \cdot PB}}$$


  Por ejemplo, si la secante tiene un trozo exterior de **$4\text{ cm}$** y una cuerda de **$5\text{ cm}$**, su segmento total es $4 + 5 = 9\text{ cm}$. Multiplicamos: $4 \cdot 9 = 36$. Por lo tanto, $PT^2 = 36$, y sacando la raíz cuadrada descubrimos que la tangente mide **$PT = \sqrt{36} = 6\text{ cm}$**.


  ¡Recuerda siempre: **la tangente va al CUADRADO**, y la secante es **Exterior por TOTAL**!


  ![Teorema de la tangente y secante](/static/img/nodos/teorema-de-la-tangente-y-la-secante-como-igualdad-entre-cuadrado-de-tangente-y-producto-de-secante-intro.svg)

  '
explicacion_formal: '### Teorema de la tangente y la secante

  Sea $P$ un punto exterior a una circunferencia $\mathcal{C}$. Si $\overline{PT}$ es un segmento tangente con contacto en $T \in \mathcal{C}$ y $\overline{PB}$ es un segmento secante que corta a $\mathcal{C}$ en $A$ y $B$ (con $A$ entre $P$ y $B$), entonces:

  $$PT^2 = PA \cdot PB \iff PT^2 = PA \cdot (PA + AB)$$


  ### Demostración geométrica por semejanza de triángulos

  1. Trácense los segmentos auxiliares $\overline{TA}$ y $\overline{TB}$. Se forman los triángulos $\triangle PTA$ y $\triangle PBT$.

  2. Ambos triángulos comparten el ángulo común en el vértice exterior $P$:

  $$\angle TPA \cong \angle BPT$$

  3. El ángulo $\angle PTA$ es un ángulo semiinscrito que subtiende el arco $\overset{\frown}{TA}$, por lo que mide $\frac{\text{med}(\overset{\frown}{TA})}{2}$.

  4. El ángulo $\angle PBT$ (o $\angle ABT$) es un ángulo inscrito que subtiende exactamente el mismo arco $\overset{\frown}{TA}$, luego también mide $\frac{\text{med}(\overset{\frown}{TA})}{2}$.

  5. En consecuencia, ambos ángulos son congruentes:

  $$\angle PTA \cong \angle PBT$$

  6. Por el criterio Ángulo-Ángulo (AA), los triángulos son semejantes:

  $$\triangle PTA \sim \triangle PBT$$

  7. Estableciendo la razón de proporcionalidad entre lados homólogos:

  $$\frac{PT}{PB} = \frac{PA}{PT} \iff PT \cdot PT = PA \cdot PB \iff PT^2 = PA \cdot PB$$


  > **Complemento didáctico:** La tangente $PT$ es la **media geométrica** entre el segmento exterior $PA$ y el segmento total $PB$: $PT = \sqrt{PA \cdot PB}$. Si te dan el exterior y el total, ¡multiplícalos y saca la raíz para encontrar la tangente al instante!

  '
definiciones_clave: '- **Teorema de tangente y secante**: Relación cuadrática $PT^2 = PA \cdot PB$.

  - **Media geométrica**: Propiedad de $PT$ como raíz del producto exterior por total ($PT = \sqrt{PA \cdot PB}$).

  - **Semejanza semiinscrito-inscrito ($\triangle PTA \sim \triangle PBT$)**: Demostración euclidiana rigurosa.

  '
propiedades_relaciones: '- **Límite unificado**: Coincide con el Teorema de las Secantes cuando los dos puntos de corte de una de ellas colapsan en $T$.

  - **Despeje de tangente**: $PT = \sqrt{PA \cdot PB}$.

  - **Despeje de total de secante**: $PB = \frac{PT^2}{PA}$.

  - **Despeje de exterior de secante**: $PA = \frac{PT^2}{PB}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo con teorema tangente-secante](/static/img/nodos/teorema-de-la-tangente-y-la-secante-como-igualdad-entre-cuadrado-de-tangente-y-producto-de-secante-ejemplos.svg)


    Desde un punto exterior $P$ se traza una tangente $\overline{PT}$ y una secante que corta a la circunferencia en $A$ y $B$. El segmento exterior es $PA = 3\text{ cm}$ y la cuerda interior es $AB = 9\text{ cm}$. Calcula la longitud del segmento tangente $PT$. Además, si en otra figura $PT = 10\text{ cm}$ y $PA = 5\text{ cm}$, calcula la longitud de la cuerda interior $AB$.'
  pasos:
  - 'Paso 1: Calcular el segmento total de la secante: $PB = PA + AB = 3 + 9 = 12\text{ cm}$.'
  - 'Paso 2: Aplicar el Teorema de la Tangente y Secante: $PT^2 = PA \cdot PB = 3 \cdot 12 = 36$.'
  - 'Paso 3: Extraer la raíz cuadrada: $PT = \sqrt{36} = 6\text{ cm}$.'
  - 'Paso 4: Para el segundo caso con $PT = 10$ y $PA = 5$, plantear la ecuación: $10^2 = 5 \cdot PB \implies 100 = 5 \cdot PB$.'
  - 'Paso 5: Despejar $PB$: $PB = \frac{100}{5} = 20\text{ cm}$.'
  - 'Paso 6: Hallar la cuerda interior: $AB = PB - PA = 20 - 5 = 15\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula del Teorema de la Tangente y la Secante?
  choices:
  - text: PT² = PA · PB (Tangente² = Exterior · Total).
    is_correct: true
  - text: PT = PA · PB.
    is_correct: false
  - text: PT² = PA · AB.
    is_correct: false
  - text: PT = (PA + PB) / 2.
    is_correct: false
  explanation: La alternativa correcta es 'PT² = PA · PB (Tangente² = Exterior · Total).' El cuadrado de la tangente es igual al producto del exterior por el total.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una secante tiene segmento exterior PA = 2 cm y segmento total PB = 18 cm, ¿cuánto mide el segmento tangente PT?
  choices:
  - text: 6 cm.
    is_correct: true
  - text: 36 cm.
    is_correct: false
  - text: 10 cm.
    is_correct: false
  - text: 20 cm.
    is_correct: false
  explanation: La alternativa correcta es '6 cm.' $PT^2 = 2 \cdot 18 = 36 \implies PT = \sqrt{36} = 6\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Calcular el segmento total de la secante sumando exterior más cuerda ($PB = PA + AB$).

  2. Multiplicar el exterior por el total: $\text{Producto} = PA \cdot PB$.

  3. Igualar al cuadrado de la tangente: $PT^2 = PA \cdot PB$.

  4. Extraer raíz cuadrada para hallar la longitud de la tangente: $PT = \sqrt{PA \cdot PB}$.

  5. Si se conoce la tangente, elevar al cuadrado y despejar el total de la secante: $PB = \frac{PT^2}{PA}$.

  '
errores_correccion: '- **Error común 1:** Olvidar elevar la tangente al cuadrado ($PT = PA \cdot PB$). **Corrección:** La relación es cuadrática: $PT^2 = PA \cdot PB$.

  - **Error común 2:** Multiplicar el exterior por la cuerda interior en vez del total ($PT^2 = PA \cdot AB$). **Corrección:** Debe multiplicarse siempre por el TOTAL ($PB = PA + AB$).

  '
ejemplos:
- tipo: A
  titulo: Cálculo directo de segmento tangente
  enunciado: Una secante tiene segmento exterior $PA = 4\text{ cm}$ y segmento total $PB = 16\text{ cm}$. ¿Cuánto mide el segmento tangente $PT$?
  alternativas:
  - text: $8\text{ cm}$.
    is_correct: true
  - text: $64\text{ cm}$.
    is_correct: false
  - text: $10\text{ cm}$.
    is_correct: false
  - text: $12\text{ cm}$.
    is_correct: false
  explicacion: $PT^2 = 4 \cdot 16 = 64 \implies PT = \sqrt{64} = 8\text{ cm}$.
- tipo: B
  titulo: Tangente al cuadrado
  enunciado: ¿Es el cuadrado del segmento tangente igual al producto del segmento exterior por el segmento total de cualquier secante trazada desde el mismo punto?
  respuesta: Sí
  explicacion: Sí. Por el Teorema de la Tangente y la Secante, $PT^2 = PA \cdot PB$ se cumple rigurosamente.
