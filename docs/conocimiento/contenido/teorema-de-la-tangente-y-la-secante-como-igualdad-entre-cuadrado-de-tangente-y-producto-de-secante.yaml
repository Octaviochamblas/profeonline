- '''Olvidar elevar el segmento tangente al cuadrado.'''
- '''Multiplicar por la cuerda interna en vez del segmento total de la secante.'''
- '''No extraer la raíz cuadrada al despejar el segmento tangente $PT$.'''
afirmaciones_verdaderas:
- '''El Teorema de la Tangente y Secante establece que $PT^2 = PA \cdot PB$.'''
- '''El segmento tangente es la media geométrica entre el segmento exterior y el total de la secante ($PT = \sqrt{PA \cdot PB}$).'''
- '''La demostración se basa en la semejanza de triángulos $\triangle PTA \sim \triangle PBT$.'''
