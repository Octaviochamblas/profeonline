semantic_id: MAT.ALG.REDUCCION_OPERATIVA.ORDENAMIENTO_PREVIO
resumen_inicial: 'El ordenamiento previo para reducir términos semejantes consiste en reorganizar alfabéticamente o por clases los monomios de un polinomio antes de efectuar su reducción aditiva.'
explicacion_simple: |
  En polinomios muy largos o desordenados, intentar reducir términos directamente puede generar confusión y errores. Por eso se recomienda aplicar un **ordenamiento previo**:
  - **Paso 1: Reordenar la parte literal** de cada término alfabéticamente (ej: escribir $4y x^2$ como $4x^2 y$).
  - **Paso 2: Reagrupar el polinomio completo**, colocando todos los términos de la misma clase juntos.
  - **Paso 3: Reducir** cada grupo consecutivamente.
  - **Ejemplo**: Reducir $3y + 5x - 8y + 2x$:
    - Reordenamos poniendo la clase $x$ primero y la clase $y$ después: $(5x + 2x) + (3y - 8y)$.
    - Reducimos clase $x$: $5x + 2x = \mathbf{7x}$.
    - Reducimos clase $y$: $3y - 8y = \mathbf{-5y}$.
    - Resultado final: **$7x - 5y$**.
explicacion_formal: |
  ### Definición formal
  Sea $P = \sum_{i=1}^m c_i M_i$ un polinomio no ordenado en $\mathbb{R}[x_1, \dots, x_k]$. El **ordenamiento previo** es la aplicación de una función de permutación $\sigma \in S_m$ sobre la secuencia de términos tal que monomios semejantes queden contiguos:

  $$P_{\text{ordenado}} = \sum_{j=1}^m c_{\sigma(j)} M_{\sigma(j)} = \sum_{k=1}^p \left( \sum_{T_i \in \mathcal{C}_k} c_i M_i \right)$$

  cumpliendo que si $T_a, T_b \in \mathcal{C}_k$, sus posiciones finales $a', b'$ en la secuencia satisfacen $|a' - b'| < |\mathcal{C}_k|$.

  ### Principio de Conservación de Signos en la Permutación
  Al reorganizar los términos de un polinomio por la propiedad conmutativa aditiva, **cada término debe ser trasladado arrastrando obligatoriamente su signo operador antecedente**:

  $$+ c_i M_i \to \text{mantiene } + c_i M_i \quad \text{y} \quad - c_j M_j \to \text{mantiene } - c_j M_j$$

  ### Síntesis didáctica
  El ordenamiento previo previene la omisión involuntaria de términos y errores de arrastre de signo en operaciones de polinomios de grado superior.
definiciones_clave: |
  - **Ordenamiento previo**: Reorganización secuencial de los monomios de una expresión previa a la suma de coeficientes.
  - **Arrastre de signo**: Conservación indispensable del signo aditivo antecedente al mover un término de posición.
  - **Agrupamiento contiguo**: Disposición donde todos los términos de la misma clase de semejanza se ubican lado a lado.
propiedades_relaciones: |
  - **Equivalencia por conmutatividad aditiva**: $A + B - C = A - C + B$, garantizando que el ordenamiento no altera la igualdad del polinomio.
  - **Reducción directa por contigüidad**: Disponer términos semejantes de forma contigua permite reducir mediante operaciones de corchetes locales.
ejemplo_guiado:
  enunciado: 'Aplica ordenamiento previo y reduce el polinomio: $7b + 4a^2 - 3 + 2b - a^2 - 10$.'
  pasos:
    - 'Paso 1: Identificamos los términos de cada clase: Clase $a^2$, Clase $b$ y Constantes.'
    - 'Paso 2: Reordenamos el polinomio colocando primero la Clase $a^2$, luego la Clase $b$ y al final las Constantes (llevando cada signo): $(4a^2 - a^2) + (7b + 2b) + (-3 - 10)$.'
    - 'Paso 3: Reducimos la Clase $a^2$: $4a^2 - 1a^2 = \mathbf{3a^2}$.'
    - 'Paso 4: Reducimos la Clase $b$: $7b + 2b = \mathbf{+9b}$.'
    - 'Paso 5: Reducimos las Constantes: $-3 - 10 = \mathbf{-13}$.'
    - 'Conclusión: La expresión final reducida es **$3a^2 + 9b - 13$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué cuidado fundamental se debe mantener al trasladar un término a una nueva posición durante el ordenamiento previo?'
    choices:
      - {text: 'Se debe arrastrar obligatoriamente el signo ($+$ o $-$) que antecede al término', is_correct: true}
      - {text: 'Se debe cambiar el signo del término al moverlo', is_correct: false}
      - {text: 'Se deben multiplicar los exponentes por dos', is_correct: false}
      - {text: 'Se debe eliminar el coeficiente numérico', is_correct: false}
    explanation: 'La alternativa correcta es ''Se debe arrastrar obligatoriamente el signo ($+$ o $-$) que antecede al término''. Arrastre de signo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo queda el polinomio $5 - 2x + 8 - 3x$ al aplicar ordenamiento previo agrupando por clases?'
    choices:
      - {text: 'Queda ordenado como $(-2x - 3x) + (5 + 8)$, lo que se reduce a $-5x + 13$', is_correct: true}
      - {text: 'Queda ordenado como $2x + 3x + 5 - 8$', is_correct: false}
      - {text: 'Queda ordenado como $5x - 13$', is_correct: false}
      - {text: 'Queda ordenado como $-6x + 40$', is_correct: false}
    explanation: 'La alternativa correcta es ''Queda ordenado como $(-2x - 3x) + (5 + 8)$, lo que se reduce a $-5x + 13$''. Ordenamiento $(-2x - 3x) + (5 + 8) = -5x + 13$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar el polinomio completo e identificar todas las distintas clases de semejanzas.'
  - 'Paso 2: Escribir los términos de la primera clase de forma contigua arrastrando sus signos.'
  - 'Paso 3: Continuar escribiendo los términos de las siguientes clases en orden de grado decreciente o alfabético.'
  - 'Paso 4: Ejecutar la reducción de cada grupo contiguo para obtener el polinomio final ordenado.'
errores_correccion: |
  - **Error 1:** Dejar atrás el signo negativo del término al moverlo de lugar (escribir $5 - 3x$ como $3x + 5$). **Cómo corregirlo:** El signo menos **PERTENECE AL TÉRMINO QUE LE SIGUE ($-3x + 5$)**.
  - **Error 2:** Excluir un término del polinomio durante la reorganización. **Cómo corregirlo:** Se deben **CONTAR LOS TÉRMINOS INICIALES Y FINALES** para confirmar que están todos.
ejemplos:
  - titulo: 'Ordenamiento por letras'
    enunciado: '¿Cuál es el ordenamiento de $4y + 9x - 2y + x$ por clases?'
    alternativas:
      - '$(9x + x) + (4y - 2y)$'
      - '$9x - 2y + 4y + x$'
      - '$4y - 2y + 9x + x$'
    respuesta: '$(9x + x) + (4y - 2y)$'
    solucion_pasos:
      - '1. Agrupa clase $x$: $9x + x$.'
      - '2. Agrupa clase $y$: $4y - 2y$.'
      - '3. Reordenado: $(9x + x) + (4y - 2y)$.'
  - titulo: 'Reducción tras ordenamiento'
    enunciado: 'Al reducir $(9x + x) + (4y - 2y)$, ¿se obtiene $10x + 2y$?'
    alternativas:
      - '$10x + 2y$'
      - '$12xy$'
      - '$8x + 6y$'
    respuesta: '$10x + 2y$'
    solucion_pasos:
      - '1. Clase $x: 9 + 1 = 10x$.'
      - '2. Clase $y: 4 - 2 = 2y$.'
      - '3. Resultado: $10x + 2y$.'
  - titulo: 'Conservación de cantidad de términos'
    enunciado: 'Si un polinomio inicial tiene 6 términos, ¿debe tener 6 términos el polinomio reordenado antes de reducir?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el reordenamiento no debe omitir ni añadir términos.'
  - titulo: 'Arrastre del signo constante'
    enunciado: 'Al reordenar $10 - 4x$, ¿se debe escribir como $-4x + 10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el $-4x$ mantiene su signo negativo al trasladarse al frente.'
errores_frecuentes:
  - 'Dejar el signo negativo atrás al reordenar términos dentro del polinomio.'
  - 'Los términos del polinomio son excluidos involuntariamente durante el proceso de reordenamiento.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Cambiar arbitrariamente los signos de los términos al moverlos de posición.'
  - 'Mezclar clases de semejanza distintas al colocarlas contiguas.'
afirmaciones_verdaderas:
  - 'El ordenamiento previo reorganiza los términos colocando contiguos los monomios de la misma clase.'
  - 'Al trasladar un término dentro del polinomio se debe mantener intacto el signo antecedente que le pertenece.'
al_terminar_debes_poder: 'Reorganizar previamente los términos de un polinomio agrupando contiguamente las mismas clases para simplificar su reducción.'
