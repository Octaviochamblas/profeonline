semantic_id: MAT.ALG.REDUCCION_OPERATIVA.ORDENAMIENTO_PREVIO
resumen_inicial: 'Ordenamiento previo para reducir términos semejantes: procedimiento
  y reglas en Reducción de términos semejantes.'
explicacion_simple: 'A veces las expresiones llegan ''revueltas''. Antes de reducir,
  conviene acomodar la mesa: ordenar los términos por familia o por grado para que
  el proceso sea más limpio y sin errores.'
explicacion_formal: '### Definición formal


  El orden es una estrategia preventiva. La suma es conmutativa y no cambia el resultado.


  ### Desarrollo didáctico


  Sea la expresión: $5x - 3y + 2x + y - x + 4y$.


  Sin orden, es fácil olvidar un término. Con ordenamiento previo:

  1. Familia $x$: $5x + 2x - x = 6x$.

  2. Familia $y$: $-3y + y + 4y = 2y$.


  Resultado: $6x + 2y$.


  El ordenamiento no cambia el valor (la suma es conmutativa), solo lo hace más seguro.'
definiciones_clave: '- **Ordenamiento previo para reducir términos semejantes**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a ordenamiento previo para reducir términos semejantes.'
ejemplo_guiado:
  enunciado: Aplica ordenamiento previo para reducir términos semejantes en una expresión
    algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de ordenamiento previo para
    reducir términos semejantes.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
