semantic_id: MAT.GEO.RELACIONES_TR.PROYECCIONES_CATETOS
resumen_inicial: 'Proyección de cada cateto sobre la hipotenusa: conceptos, teoremas,
  propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'Al trazar la altura relativa a la hipotenusa, esta la divide
  en dos segmentos: cada uno de ellos es la ''sombra'' o proyección de uno de los
  catetos sobre la hipotenusa.'
explicacion_formal: '![Proyecciones de los catetos sobre la hipotenusa](/static/img/geometria/areas-pitagoras/relaciones-tr-proyecciones-catetos.svg)


  ### Definición formal


  En un triángulo rectángulo ABC con ángulo recto en A y pie de altura H sobre BC,
  el segmento BH es la proyección del cateto AB sobre la hipotenusa, y CH es la proyección
  del cateto AC sobre la hipotenusa.


  ### Desarrollo didáctico


  Si imaginamos una luz perpendicular a la hipotenusa, la ''sombra'' que cada cateto
  proyecta sobre ella es exactamente BH o CH, respectivamente. Juntas, ambas proyecciones
  suman la hipotenusa completa: BH+CH=BC.'
definiciones_clave: '- **Proyección de cada cateto sobre la hipotenusa**: Elemento
