- titulo: ¿Se cumple siempre la propiedad principal de proyección de cada cateto sobre
    la hipotenusa en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
