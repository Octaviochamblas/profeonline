    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en proyección de cada cateto sobre
  la hipotenusa.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en proyección
  de cada cateto sobre la hipotenusa.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en proyección de
  cada cateto sobre la hipotenusa.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de proyección
  de cada cateto sobre la hipotenusa.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
