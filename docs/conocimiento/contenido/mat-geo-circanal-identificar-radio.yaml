semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.IDENTIFICAR_RADIO
resumen_inicial: 'Identificación del radio de una circunferencia desde su forma canónica:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: El número que aparece a la derecha de la ecuación canónica no
  es el radio directamente, sino su cuadrado, por lo que siempre se debe aplicar raíz
  cuadrada.
explicacion_formal: '![Identificación del radio](/static/img/geometria/analitica/circanal-identificar-radio.svg)


  ### Definición formal


  Si la ecuación es $(x-h)^2+(y-k)^2=r^2$, el radio se obtiene despejando $r=\sqrt{r^2}$,
  es decir, extrayendo la raíz cuadrada del término a la derecha.


  ### Desarrollo didáctico


  Para $(x-1)^2+(y+2)^2=25$: el término a la derecha es 25, por lo que el radio es
  $r=\sqrt{25}=5$.'
definiciones_clave: '- **Identificación del radio de una circunferencia desde su forma
  canónica**: Elemento o propiedad fundamental en el estudio de geometría analítica
  ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del radio de una circunferencia
  desde su forma canónica.'
