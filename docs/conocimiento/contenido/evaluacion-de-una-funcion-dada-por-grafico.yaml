semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_GRAFICO
resumen_inicial: 'Evaluación de una función dada por gráfico: conceptos, representación
  y propiedades en Evaluación de funciones.'
explicacion_simple: Cuando solo tienes el dibujo de la curva, evaluar se convierte
  en un ejercicio visual, un poco de geometría con regla imaginaria.
explicacion_formal: '### Definición formal


  Dado el gráfico de una función $f$, evaluar $f(a)$ consiste en identificar el punto
  $(a, f(a))$ sobre la curva cuya primera coordenada es $a$, y leer su segunda coordenada
  como el valor de la función en ese punto.


  ### Desarrollo didáctico


  El procedimiento visual es trazar una recta vertical desde $x=a$ en el eje horizontal
  hasta que corte la curva, y desde ese punto de corte trazar una recta horizontal
  hasta el eje vertical para leer el valor de $y$.


  Si la curva pasa por el punto $(3, 7)$, entonces $f(3) = 7$: basta leer directamente
  la altura de la curva en $x=3$.'
definiciones_clave: '- **Evaluación de una función dada por gráfico**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a evaluación de una función dada por gráfico.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a evaluación de una
    función dada por gráfico.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a evaluación de una función dada
    por gráfico.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    evaluación de una función dada por gráfico?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en evaluación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en evaluación de funciones. Es la condición de
    existencia y unicidad en evaluación de una función dada por gráfico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en evaluación de una función
    dada por gráfico, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubica el valor de $x$ solicitado sobre el eje horizontal.'
- 'Paso 2: Traza (mentalmente o en el papel) una línea vertical desde ese punto hasta
  que corte la curva.'
- 'Paso 3: Desde el punto de corte, traza una línea horizontal hasta el eje vertical.'
- 'Paso 4: Lee el valor donde esa línea corta el eje vertical; ese es $f(x)$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar evaluación de una función dada por gráfico.
ejemplos:
- titulo: Lectura directa de un punto en la curva
  enunciado: Si la gráfica de $f$ pasa por el punto $(2, 6)$, determina $f(2)$.
  solucion_pasos:
  - El punto $(2,6)$ indica directamente que la imagen de x=2 es 6.
  - $f(2) = 6$.
- titulo: Lectura en un vértice
  enunciado: Si el vértice de una parábola graficada está en $(0, -4)$, determina
    $f(0)$.
  solucion_pasos:
  - El vértice es un punto de la curva, con coordenadas $(0,-4)$.
  - $f(0) = -4$.
- titulo: ¿Se puede evaluar $f(a)$ si el gráfico tiene un punto abierto (hueco) en
    $x=a$?
  enunciado: ¿Se puede evaluar $f(a)$ si el gráfico tiene un punto abierto (hueco)
    en $x=a$?
  respuesta: 'No'
  solucion_pasos:
  - Un punto abierto indica que ese valor de x no pertenece al dominio de la función;
    no tiene imagen definida.
- titulo: ¿La evaluación gráfica requiere trazar una línea vertical desde el eje $x$?
  enunciado: ¿La evaluación gráfica requiere trazar una línea vertical desde el eje
    $x$?
  respuesta: Sí
  solucion_pasos:
  - Esa línea vertical localiza el punto de la curva correspondiente al valor buscado.
errores_frecuentes:
- Trazar una línea horizontal en vez de vertical al buscar la imagen de un valor de
  $x$.
- Confundir la lectura de la imagen con la lectura de la preimagen (que requiere el
  proceso inverso).
- Ignorar puntos abiertos o discontinuidades del gráfico al evaluar.
- Leer coordenadas aproximadas sin verificar la escala de los ejes.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando evaluación
  de una función dada por gráfico.
