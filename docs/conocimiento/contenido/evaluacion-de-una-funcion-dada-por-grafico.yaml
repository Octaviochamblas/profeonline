semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_GRAFICO
resumen_inicial: Evaluar una función dada por su gráfica consiste en proyectar verticalmente desde la abscisa $x$ hasta la curva y leer la altura en el eje $Y$.
explicacion_simple: '![Evaluar una función dada por su gráfica consiste en proyectar verticalmente desde la abscisa $x$ hasta la curva y leer la altura en el eje $Y$](/static/img/nodos/evaluacion-de-una-funcion-dada-por-grafico-intro.svg)



  Para encontrar $f(a)$ mirando el gráfico cartesiano:

  1. Te ubicas en el número $a$ sobre el **eje horizontal $X$**.

  2. Subes o bajas en línea recta vertical hasta tocar la curva de la función.

  3. Desde ese punto de corte, miras hacia el **eje vertical $Y$** para leer la altura.


  Ese valor en el eje $Y$ es la **imagen $f(a)$**.'
explicacion_formal: 'Dada la gráfica $\text{Graf}(f) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x)\}$:

  - La evaluación de $f$ en $x = x_0$ corresponde a la ordenada del punto de intersección entre la recta vertical $x = x_0$ y la curva:

  $$\{x_0\} \times \mathbb{R} \cap \text{Graf}(f) = \{(x_0, f(x_0))\}$$


  **Casos especiales en gráficos:**

  - **Intersección con eje $Y$**: El punto $(0, c)$ indica que $f(0) = c$.

  - **Ceros de la función**: Los puntos de corte con el eje $X$, $(x_k, 0)$, indican que $f(x_k) = 0$.

  - **Puntos abiertos vs cerrados**: Un punto blanco $\circ$ indica exclusión, mientras que un punto negro $\bullet$ indica inclusión.'
definiciones_clave: '- **Lectura gráfica**: Extracción de pares ordenados $(x, y)$ a partir del plano cartesiano.

  - **Punto de intersección**: Coordenada donde la curva corta a los ejes o a rectas de referencia.'
propiedades_relaciones: '- **Correspondencia visual**: A cada valor de $x$ le corresponde la altura $y$ que alcanza la curva.

  - **Unicidad visual**: Por la prueba de la recta vertical, solo hay un punto de contacto sobre la curva para cada $x$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Evaluar una función dada por su gráfica consiste en proyectar verticalmente desde la abscisa $x$ hasta la curva y leer la altura en el eje $Y$](/static/img/nodos/evaluacion-de-una-funcion-dada-por-grafico-ejemplos.svg)



    La gráfica de una función $f$ pasa por los puntos $(-3, 0)$, $(0, 4)$ y $(2, -1)$. Determina el valor de $f(0) + f(2) - f(-3)$.'
  pasos:
  - 'Paso 1: Identificar $f(0)$: para $x = 0$, la curva corta el eje vertical en $y = 4$, luego $f(0) = 4$.'
  - 'Paso 2: Identificar $f(2)$: para $x = 2$, la altura de la curva es $y = -1$, luego $f(2) = -1$.'
  - 'Paso 3: Identificar $f(-3)$: para $x = -3$, la curva corta el eje horizontal en $y = 0$, luego $f(-3) = 0$.'
  - 'Paso 4: Calcular la expresión: $4 + (-1) - 0 = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la gráfica de una función corta al eje Y en el punto $(0, -5)$, ¿cuál es el valor de $f(0)$?
  choices:
  - text: '-5'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: La alternativa correcta es '-5'. La intersección con el eje Y representa la evaluación en $x = 0$, es decir, $f(0) = -5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un gráfico cartesiano, para $x = 4$ la curva alcanza una altura de $y = 7$. ¿Qué igualdad matemática representa este hecho?
  choices:
  - text: f(4) = 7
    is_correct: true
  - text: f(7) = 4
    is_correct: false
  - text: f(11) = 0
    is_correct: false
  - text: f(4/7) = 1
    is_correct: false
  explanation: La alternativa correcta es 'f(4) = 7'. La abscisa es la entrada (4) y la ordenada es la salida (7).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la preimagen solicitada sobre el eje horizontal $X$.'
- 'Paso 2: Trazar una perpendicular imaginaria hasta intersectar la curva de la función.'
- 'Paso 3: Desde el punto de corte en la curva, proyectar horizontalmente hacia el eje vertical $Y$.'
- 'Paso 4: Leer la coordenada en $Y$, la cual corresponde al valor de $f(x)$.'
errores_correccion: '- **Error común:** Leer el valor del eje $X$ en vez del valor del eje $Y$ al solicitar una imagen.

  - **Cómo corregirlo:** La imagen solicitada siempre se lee sobre el **eje vertical $Y$**; el eje $X$ sirve únicamente para posicionar la entrada.'
ejemplos:
- titulo: 'Ejemplo 1: Cero de la función'
  enunciado: La gráfica de $f$ intersecta al eje X en $(5, 0)$. ¿Cuál es el valor de $f(5)$?
  alternativas:
  - '0'
  - '5'
  - '-5'
  - '1'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: La ordenada en $(5, 0)$ es $0$.'
  - 'Paso 2: Por lo tanto, $f(5) = 0$.'
- titulo: 'Ejemplo 2: Gráfico lineal'
  enunciado: Una recta pasa por $(1, 3)$ y $(3, 7)$. ¿Cuál es el valor de $f(1) + f(3)$?
  alternativas:
  - '10'
  - '4'
  - '6'
  - '12'
  respuesta: '10'
  solucion_pasos:
  - 'Paso 1: $f(1) = 3$ y $f(3) = 7$.'
  - 'Paso 2: Suma: $3 + 7 = 10$.'
- titulo: 'Ejemplo 3: Punto de vértice cuadrático'
  enunciado: La parábola $y = f(x)$ tiene su vértice en $(2, -4)$. ¿Cuál es el valor de $f(2)$?
  alternativas:
  - '-4'
  - '2'
  - '0'
  - '-2'
  respuesta: '-4'
  solucion_pasos:
  - 'Paso 1: El punto $(2, -4)$ pertenece a la curva.'
  - 'Paso 2: Por ende, $f(2) = -4$.'
- titulo: 'Ejemplo 4: Búsqueda inversa en gráfica'
  enunciado: Si en la gráfica se observa que para $y = 6$ el punto correspondiente es $(-2, 6)$, ¿cuál es la preimagen de $6$?
  alternativas:
  - '-2'
  - '6'
  - '4'
  - '0'
  respuesta: '-2'
  solucion_pasos:
  - 'Paso 1: La preimagen es la abscisa $x$ asociada a la altura $y = 6$, que es $-2$.'
errores_frecuentes:
- Invertir los ejes leyendo la imagen en X y la preimagen en Y.
- Confundir puntos abiertos (excluidos) con puntos cerrados (incluidos).
- Estimar visualmente valores en escalas no homogéneas sin verificar las marcas de graduación.
afirmaciones_verdaderas:
- Evaluar gráficamente una función consiste en leer la ordenada del punto de la curva asociado a una abscisa dada.
- El punto de corte de la gráfica con el eje Y corresponde al valor de f(0).
al_terminar_debes_poder: '**QUÉ:** Evaluar funciones algebraicas e interpretar valores a partir de su representación gráfica.


  **CÓMO:** Proyectando perpendicularmente desde el eje de las abscisas hacia la curva y leyendo la ordenada resultante en el eje Y.


  ![Resumen Evaluar una función dada por su gráfica consiste en proyectar verticalmente desde la abscisa $x$ hasta la curva y leer la altura en el eje $Y$](/static/img/nodos/evaluacion-de-una-funcion-dada-por-grafico-resumen.svg)'
