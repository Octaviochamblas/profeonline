semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_GRAFICO
resumen_inicial: Evaluar una función desde un gráfico requiere ubicar $x$ en el eje
  horizontal, subir o bajar hasta la curva y leer $y$ en el eje vertical.
explicacion_simple: 'Para evaluar $f(a)$ mirando el gráfico de una función en el plano
  cartesiano:

  1. Buscamos el número $a$ en el eje horizontal $X$.

  2. Trazamos una línea vertical imaginaria hasta tocar el punto de la curva del gráfico.

  3. Desde ese punto de la curva, miramos hacia el eje vertical $Y$ para leer la altura
  $b$.

  Esa altura es la imagen: $f(a) = b$.'
explicacion_formal: 'Dada la gráfica $G(f) = \{(x, f(x)) \in \mathbb{R}^2 \mid x \in
  \operatorname{Dom}(f)\}$:


  $$f(a) = b \iff (a, b) \in G(f) \subset \mathbb{R}^2$$


  **Desglose de la fórmula:**

  - Proyección ortogonal puntual: El valor $f(a)$ es la segunda coordenada del par
  ordenado $(a, b)$ perteneciente a la curva $G(f)$.'
definiciones_clave: '- **Evaluación gráfica**: Proceso geométrico para determinar
  las coordenadas $(x, y)$ de un punto sobre la curva trazada.'
propiedades_relaciones: '- **Intersecciones con los ejes**: El punto donde la curva
  corta al eje $Y$ representa la evaluación en cero: $(0, f(0))$.'
ejemplo_guiado:
  enunciado: Un gráfico pasa por el punto $(3, 8)$ y por el punto $(-2, 0)$. Determina
    los valores de $f(3)$ y la preimagen de $y = 0$.
  pasos:
  - 'Paso 1: Para $f(3)$: ubicar $x = 3$ en el eje $X$, subir a la curva en $(3, 8)$
    y leer la coordenada $Y \implies f(3) = 8$.Paso 2: Para la preimagen de $y = 0$:
    buscar la altura $0$ en el eje $Y$ y ver el punto de la curva $(-2, 0)$.Paso 3:
    Leer la coordenada $X$ correspondiente $\implies x = -2$.Paso 4: Concluir $f(3)
    = 8$ y que la preimagen de $0$ es $x = -2$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la gráfica de una función $f$ contiene al punto ordenado $(3, 8)$,
    ¿cuál es el valor de $f(3)$?
  choices:
  - text: $f(3) = 8$
    is_correct: true
  - text: $f(3) = 3$
    is_correct: false
  - text: $f(3) = 11$
    is_correct: false
  - text: $f(3) = 0$
    is_correct: false
  explanation: La alternativa correcta es '$f(3) = 8$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el gráfico corta al eje $X$ en el punto $(-2, 0)$, ¿cuál es el valor
    de $f(-2)$?
  choices:
  - text: $f(-2) = 0$
    is_correct: true
  - text: $f(-2) = -2$
    is_correct: false
  - text: $f(-2) = 2$
    is_correct: false
  - text: $f(-2) = 1$
    is_correct: false
  explanation: La alternativa correcta es '$f(-2) = 0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el valor dado $x = a$ en el eje horizontal $X$.'
- 'Paso 2: Moverse verticalmente (hacia arriba o abajo) hasta interceptar el trazo
  de la función.'
- 'Paso 3: Moverse horizontalmente desde ese punto hasta el eje vertical $Y$.'
- 'Paso 4: Leer el número del eje $Y$, el cual representa la imagen $f(a)$.'
errores_correccion: '- **Error común:** Confundir los ejes e intentar buscar la preimagen
  en el eje vertical $Y$.

  - **Cómo corregirlo:** La preimagen $x$ se busca SIEMPRE en el eje horizontal $X$;
  la imagen $y$ se lee en el eje vertical $Y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de evaluación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de evaluación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Evaluar una función consiste en reemplazar la preimagen x en la fórmula
    y calcular y?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de valorización funcional.
- titulo: ¿Se debe verificar que el número pertenezca al dominio antes de evaluar
    una raíz par?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar raíces de números negativos en $\\mathbb{R}$.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir números negativos al elevar a potencias pares.
- Confundir la búsqueda de una imagen (evaluar $f(a)$) con la búsqueda de una preimagen
  (igualar $f(x) = b$).
- Pensar que la notación $f(x+3)$ equivale simplemente a sumar $3$ al resultado final
  de $f(x)$.
- Intentar evaluar valores que no pertenecen al dominio provocando divisiones por
  cero o raíces pares negativas.
- Buscar preimágenes en el eje vertical $Y$ o imágenes en el eje horizontal $X$ al
  interpretar un gráfico.
afirmaciones_verdaderas:
- Para evaluar una función $f(x)$ se reemplaza la variable $x$ por el valor dado respetando
  la jerarquía operacional.
- Para hallar la preimagen $x$ correspondiente a una imagen $y_0$ se debe resolver
  la ecuación $f(x) = y_0$.
al_terminar_debes_poder: Al finalizar este recurso podrás evaluar funciones a partir
  de fórmulas, tablas o gráficos, y determinar preimágenes respetando las restricciones
  del dominio.
