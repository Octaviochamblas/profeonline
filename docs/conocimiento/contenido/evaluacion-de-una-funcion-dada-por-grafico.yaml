semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_GRAFICO
resumen_inicial: Evaluar una función desde su gráfico cartesiano consiste en ubicar la coordenada de entrada $x$ en el eje horizontal y determinar la coordenada de salida $y$ en la curva.
explicacion_simple: |
  Para hallar $f(a)$ usando un gráfico:

  1. Busca el número $a$ en el eje horizontal $X$.
  2. Muévete de forma vertical (hacia arriba o abajo) hasta tocar la línea o curva de la función.
  3. Desde ese punto de choque, mira hacia la izquierda o derecha para leer el valor correspondiente en el eje $Y$.
  4. Ese valor en $Y$ es la imagen $f(a)$.
explicacion_formal: |
  Sea $G_f = \{(x, f(x)) \mid x \in \text{Dom}(f)\}$ la representación gráfica de la función $f$ en el plano cartesiano $\mathbb{R}^2$.

  La evaluación de $f(a)$ equivale a encontrar la coordenada $y_0$ del único punto de intersección entre la recta vertical $x = a$ y la gráfica $G_f$:

  $$(a, y_0) \in G_f \implies f(a) = y_0$$

  **Desglose de la lectura:**
  - Puntos rellenos: El valor pertenece a la función.
  - Puntos vacíos (huecos): El valor NO pertenece a la función.
definiciones_clave: |
  - **Lectura gráfica de la imagen**: Identificación visual de la ordenada $y$ asociada a una abscisa $x$ en la trayectoria de la función.
propiedades_relaciones: |
  - **Intersección con eje Y**: Ocurre en el punto $(0, f(0))$, que corresponde a la evaluación de la función en $x = 0$.
  - **Intersecciones con eje X**: Ocurren en los puntos $(x_k, 0)$, donde $f(x_k) = 0$.
ejemplo_guiado:
  enunciado: "En un plano cartesiano, el gráfico de la función $f$ pasa por los puntos $(-2, 4)$, $(0, 1)$ y $(3, -5)$. Determina el valor de $f(0)$ y de $f(3)$."
  pasos:
    - 'Paso 1: Para $f(0)$, ubicar $x = 0$ en el eje horizontal.'
    - 'Paso 2: Leer la coordenada $y$ correspondiente al punto de la curva: en $x = 0$ la curva está en $y = 1$, por lo tanto $f(0) = 1$.'
    - 'Paso 3: Para $f(3)$, ubicar $x = 3$ en el eje horizontal.'
    - 'Paso 4: Leer la coordenada $y$ correspondiente: en $x = 3$ la curva está en $y = -5$, por lo tanto $f(3) = -5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Si la gráfica de $f$ pasa por el punto $(4, -2)$, ¿cuál es el valor de $f(4)$?"
    choices:
      - {text: "$-2$", is_correct: true}
      - {text: "$4$", is_correct: false}
      - {text: "$2$", is_correct: false}
      - {text: "$-1/2$", is_correct: false}
    explanation: "La alternativa correcta es '$-2$'. En el par $(x, y) = (4, -2)$, la imagen de $x = 4$ es $y = -2$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si una curva gráfica corta al eje $Y$ en el valor $5$, ¿qué evaluación funcional representa este punto?"
    choices:
      - {text: "$f(0) = 5$", is_correct: true}
      - {text: "$f(5) = 0$", is_correct: false}
      - {text: "$f(5) = 5$", is_correct: false}
      - {text: " No representa ninguna evaluación.", is_correct: false}
    explanation: "La alternativa correcta es '$f(0) = 5$'. El eje $Y$ corresponde a la preimagen $x = 0$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Localizar la preimagen $x = a$ sobre el eje horizontal de las abscisas.'
  - 'Paso 2: Trazar imaginariamente una recta vertical en $x = a$.'
  - 'Paso 3: Identificar el punto de corte con la gráfica $(a, b)$.'
  - 'Paso 4: Leer el valor $b$ sobre el eje vertical de las ordenadas y declarar $f(a) = b$.'
errores_correccion: |
  - **Error común:** Confundir los ejes e ingresar la preimagen por el eje vertical $Y$.
  - **Cómo corregirlo:** La preimagen (entrada) SIEMPRE se busca en el eje horizontal $X$; la imagen (salida) SIEMPRE se lee en el eje vertical $Y$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de evaluación funcional.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de evaluación funcional.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Para evaluar $f(3)$ en un gráfico, se busca el valor $3$ en el eje vertical $Y$ y se lee en el eje $X$.'
  - 'La imagen de $x = a$ en una gráfica es la pendiente de la recta tangente en ese punto.'
  - 'Si la gráfica corta al eje $X$ en $(5, 0)$, se concluye que la evaluación $f(0) = 5$.'
  - 'Un punto hueco o abierto sobre la curva gráfica indica que ese valor pertenece al conjunto imagen.'
  - 'Evaluar $f(0)$ en una gráfica consiste en medir la distancia euclidiana entre el punto y el origen.'
afirmaciones_verdaderas:
  - 'Evaluar $f(a)$ en un gráfico consiste en ubicar $x = a$ en el eje horizontal y determinar la ordenada $y$ del punto $(a, y)$ perteneciente a la curva.'
  - 'Las intersecciones de la gráfica con el eje $X$ representan las preimágenes del valor $y = 0$ ($f(x) = 0$).'
al_terminar_debes_poder: |
  QUÉ: Evaluar e interpretar el valor de una función a partir de su representación gráfica en el plano cartesiano.
  CÓMO: Ubicar la preimagen en el eje $X$, proyectar verticalmente hasta intersectar la curva y leer la coordenada correspondiente en el eje $Y$.
