semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.RECTA_TANGENTE_CIRCUNFERENCIA
resumen_inicial: 'Identificación de recta tangente a una circunferencia: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'La recta tangente representa el caso límite entre secante y exterior:
  toca la circunferencia en un único punto, sin cruzarla.'
explicacion_formal: '![Recta tangente a una circunferencia](/static/img/geometria/analitica/posrc-recta-tangente-circunferencia.svg)


  ### Definición formal


  Una recta $Ax+By+C=0$ es tangente a una circunferencia de centro $(h,k)$ y radio
  $r$ si $\dfrac{|Ah+Bk+C|}{\sqrt{A^2+B^2}}=r$, tocándola en un único punto.


  ### Desarrollo didáctico


  Para la circunferencia $x^2+y^2=9$ (centro (0,0), radio 3) y la recta horizontal
  $y=3$: la distancia del centro a la recta es exactamente 3, igual al radio, por
  lo que la recta es tangente, tocando la circunferencia en el punto $(0,3)$.'
