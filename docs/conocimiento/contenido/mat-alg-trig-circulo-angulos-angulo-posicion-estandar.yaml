semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.ANGULO_POSICION_ESTANDAR
resumen_inicial: 'Representación de un ángulo en posición estándar: círculo unitario,
  amplitud, período y transformaciones de Círculo unitario y sistemas de medida.'
explicacion_simple: Para poder comparar ángulos de forma sistemática, la trigonometría
  fija una convención sobre dónde debe ubicarse el vértice y el lado inicial de cualquier
  ángulo.
explicacion_formal: '### Definición formal


  Un ángulo $\theta$ está en posición estándar si su vértice es el origen $(0,0)$
  y su lado inicial coincide con el semieje positivo del eje $x$. El lado terminal
  se obtiene rotando el lado inicial alrededor del origen según la medida y el sentido
  del ángulo.


  ### Desarrollo didáctico


  Un ángulo de $45°$ en posición estándar tiene su vértice en el origen, su lado inicial
  sobre el semieje positivo $x$, y su lado terminal a medio camino entre los semiejes
  positivos $x$ e $y$, dentro del primer cuadrante.'
definiciones_clave: '- **Representación de un ángulo en posición estándar**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a representación de un ángulo en posición estándar.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    representación de un ángulo en posición estándar.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de representación de un ángulo en posición estándar.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se definen analíticamente el seno y el coseno en el círculo unitario
    para representación de un ángulo en posición estándar?
  choices:
  - text: Identificar las coordenadas (cos x, sen x) en el círculo unitario para definir
      círculo unitario y sistemas de medida
    is_correct: true
  - text: Como la suma de los catetos en cualquier triángulo rectángulo no unitario
    is_correct: false
  - text: Igualando la variable del ángulo a cero siempre
    is_correct: false
  - text: Multiplicando el radio por pi elevado a x
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar las coordenadas (cos x, sen
    x) en el círculo unitario para definir círculo unitario y sistemas de medida.
    Definición canónica de las funciones trigonométricas en el círculo unitario.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determinan el período T y la amplitud A de una función de la
    forma f(x) = A sen(Bx + C) + D en representación de un ángulo en posición estándar?
  choices:
  - text: Calcular el período como T = 2pi / |B| y la amplitud como |A|
    is_correct: true
  - text: Sumando A + B + C + D independientemente
    is_correct: false
  - text: Igualando la amplitud a 2pi y el período a 1
    is_correct: false
  - text: Dividiendo A entre 2pi sin considerar B
    is_correct: false
  explanation: 'La alternativa correcta es: Calcular el período como T = 2pi / |B|
    y la amplitud como |A|. Fórmulas estándar para amplitud y período en funciones
    sinusoidales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que el vértice del ángulo esté en el origen.'
- 'Paso 2: Verifica que el lado inicial coincida con el semieje positivo $x$.'
- 'Paso 3: Si ambas condiciones se cumplen, el ángulo está en posición estándar.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en representación de un
  ángulo en posición estándar.
ejemplos:
- titulo: Verificación de un ángulo en posición estándar
  enunciado: ¿Está en posición estándar un ángulo con vértice en el origen y lado
    inicial sobre el semieje positivo $x$?
  solucion_pasos:
  - Se verifican ambas condiciones de la definición.
  - Sí, cumple con la definición de posición estándar.
- titulo: Detección de un ángulo que no está en posición estándar
  enunciado: ¿Está en posición estándar un ángulo con vértice en $(2,3)$?
  solucion_pasos:
  - El vértice no coincide con el origen.
  - No, no está en posición estándar.
- titulo: ¿El lado terminal debe coincidir siempre con un eje?
  enunciado: ¿El lado terminal de un ángulo en posición estándar debe coincidir siempre
    con alguno de los ejes coordenados?
  respuesta: 'No'
  solucion_pasos:
  - El lado terminal puede ubicarse en cualquier dirección, salvo en los ángulos cuadrantales
    específicos.
- titulo: ¿Puede un ángulo en posición estándar tener medida negativa?
  enunciado: ¿Puede un ángulo en posición estándar medirse en sentido negativo (horario)?
  respuesta: Sí
  solucion_pasos:
  - La posición estándar solo exige vértice en el origen y lado inicial en el semieje
    positivo $x$, no restringe el sentido.
errores_frecuentes:
- Confundir la posición estándar con la ubicación específica del lado terminal.
- Suponer que el vértice puede estar en cualquier punto, no solo en el origen.
- No verificar que el lado inicial coincida exactamente con el semieje positivo $x$.
- Creer que solo los ángulos positivos pueden estar en posición estándar.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_ponder: Analizar, graficar y modelar fenómenos periódicos aplicando
  representación de un ángulo en posición estándar.
