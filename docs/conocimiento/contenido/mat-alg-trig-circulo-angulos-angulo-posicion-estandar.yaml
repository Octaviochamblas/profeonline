semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.ANGULO_POSICION_ESTANDAR
resumen_inicial: 'Un ángulo está en posición estándar cuando su vértice está en $(0,0)$ y su lado inicial coincide con el semieje positivo X.'
explicacion_simple: |
  Para comparar y medir ángulos en el círculo unitario de forma ordenada, existe una regla fija: todos los ángulos deben nacer en la misma posición inicial. Un ángulo está en "posición estándar" o "posición normal" si su centro o vértice se coloca exactamente en el origen $(0,0)$ y su primer rayo (lado inicial) descansa acostado sobre la mitad derecha del eje horizontal (el semieje positivo de las $x$). El segundo rayo (lado terminal) gira abriéndose para formar la medida del ángulo.
explicacion_formal: |
  ### Definición formal
  Un ángulo $\theta$ en el plano cartesiano se encuentra en **posición estándar** (o posición normal) si satisface las siguientes dos condiciones geométricas invariantes:
  1. Su **vértice** coincide con el origen del sistema cartesiano $O(0,0)$.
  2. Su **lado inicial** coincide con la semirrecta del eje horizontal positivo:
     $$\mathcal{L}_{\text{inicial}} = \{(x,y) \in \mathbb{R}^2 : x \ge 0, y = 0\}$$

  ### Desglose simbólico
  - $V(0,0)$: Vértice fijo del ángulo en el origen.
  - $\mathcal{L}_{\text{inicial}}$: Lado fijo de inicio situado en $+X$.
  - $\mathcal{L}_{\text{terminal}}$: Rayo móvil que gira alrededor del origen para definir la magnitud del ángulo $\theta$.
  - $P(x,y)$: Punto de intersección entre el lado terminal $\mathcal{L}_{\text{terminal}}$ y el círculo unitario.

  ### Síntesis didáctica
  La posición estándar estandariza la medición angular. Al fijar el lado inicial en $+X$, la posición final del lado terminal determina de manera única en cuál de los cuatro cuadrantes se ubica el ángulo y cuáles serán los signos de su seno y su coseno.
definiciones_clave: |
  - **Posición estándar**: Configuración geométrica donde el vértice está en $O(0,0)$ y el lado inicial en el semieje $+X$.
  - **Lado inicial**: Rayo fijo desde el cual comienza a medirse la rotación del ángulo.
  - **Lado terminal**: Rayo móvil que señala la posición final tras la rotación del ángulo.
propiedades_relaciones: |
  - **Cuadrante del ángulo**: La ubicación del lado terminal clasifica al ángulo:
    - I Cuadrante: $0^\circ < \theta < 90^\circ$ (o $0 < \theta < \frac{\pi}{2}$)
    - II Cuadrante: $90^\circ < \theta < 180^\circ$ (o $\frac{\pi}{2} < \theta < \pi$)
    - III Cuadrante: $180^\circ < \theta < 270^\circ$ (o $\pi < \theta < \frac{3\pi}{2}$)
    - IV Cuadrante: $270^\circ < \theta < 360^\circ$ (o $\frac{3\pi}{2} < \theta < 2\pi$)
ejemplo_guiado:
  enunciado: 'Un ángulo $\theta = 150^\circ$ se dibuja en posición estándar. Identifica su lado inicial, su sentido de giro y el cuadrante donde se ubica su lado terminal.'
  pasos:
    - 'Paso 1: El lado inicial se ubica sobre el semieje positivo del eje X, partiendo del origen $(0,0)$.'
    - 'Paso 2: Como el valor $+150^\circ$ es positivo, la rotación se realiza en sentido antihorario (contrario a las manecillas del reloj).'
    - 'Paso 3: Comparar la magnitud: $90^\circ < 150^\circ < 180^\circ$.'
    - 'Paso 4: El lado terminal se ubica en el **Segundo Cuadrante (II C)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las dos condiciones requeridas para que un ángulo esté en posición estándar?'
    choices:
      - {text: 'Vértice en el origen $(0,0)$ y lado inicial en el semieje $+X$', is_correct: true}
      - {text: 'Vértice en $(1,1)$ y lado inicial en el eje $+Y$', is_correct: false}
      - {text: 'Vértice en $(0,0)$ y lado inicial en cualquier eje coordenado', is_correct: false}
      - {text: 'Lado terminal fijo y lado inicial variable', is_correct: false}
    explanation: 'La alternativa correcta es ''Vértice en el origen $(0,0)$ y lado inicial en el semieje $+X$''. Es la definición canónica de la posición estándar.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un ángulo en posición estándar mide $\theta = 225^\circ$, ¿en qué cuadrante se encuentra su lado terminal?'
    choices:
      - {text: 'Tercer Cuadrante (III C)', is_correct: true}
      - {text: 'Segundo Cuadrante (II C)', is_correct: false}
      - {text: 'Cuarto Cuadrante (IV C)', is_correct: false}
      - {text: 'Primer Cuadrante (I C)', is_correct: false}
    explanation: 'La alternativa correcta es ''Tercer Cuadrante (III C)''. Como $180^\circ < 225^\circ < 270^\circ$, el lado terminal cae en el tercer cuadrante.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Colocar el vértice del ángulo en las coordenadas del origen $O(0,0)$.'
  - 'Paso 2: Trazar el lado inicial acostado horizontalmente sobre el semieje positivo $X$.'
  - 'Paso 3: Rotar el rayo terminal desde el lado inicial la cantidad de grados o radianes indicada.'
  - 'Paso 4: Identificar el cuadrante en el cual se detiene el lado terminal.'
errores_correccion: |
  - **Error 1:** Medir el lado inicial desde el eje vertical $Y$ o desde el semieje negativo $X$. **Cómo corregirlo:** La posición estándar exige de manera estricta que el lado inicial descanse únicamente sobre el semieje positivo del eje $X$.
  - **Error 2:** Colocar el vértice del ángulo fuera del origen cartesiano $O(0,0)$. **Cómo corregirlo:** Si el vértice está desplazado, el ángulo no está en posición estándar y sus proyecciones no corresponderán a las coordenadas del círculo unitario.
ejemplos:
  - titulo: 'Ángulo agudo en posición estándar'
    enunciado: 'Un ángulo mide $\theta = 45^\circ$ y tiene su vértice en $(0,0)$ y lado inicial en $+X$. ¿En qué cuadrante está su lado terminal?'
    alternativas:
      - 'En el Primer Cuadrante (I C)'
      - 'En el Segundo Cuadrante (II C)'
      - 'Sobre el eje Y'
    respuesta: 'En el Primer Cuadrante (I C)'
    solucion_pasos:
      - '1. Al medir $45^\circ$ desde $+X$, $0^\circ < 45^\circ < 90^\circ$.'
      - '2. Su lado terminal se detiene en el I Cuadrante.'
  - titulo: 'Ángulo llano en posición estándar'
    enunciado: '¿Dónde se ubica el lado terminal de un ángulo de $180^\circ$ en posición estándar?'
    alternativas:
      - 'Sobre el semieje negativo del eje X'
      - 'En el segundo cuadrante'
      - 'Sobre el semieje positivo del eje Y'
    respuesta: 'Sobre el semieje negativo del eje X'
    solucion_pasos:
      - '1. Una rotación de $180^\circ$ da media vuelta completa.'
      - '2. El lado terminal apunta exactamente en la dirección opuesta al lado inicial: sobre el semieje $-X$.'
  - titulo: 'Ángulo en el cuarto cuadrante'
    enunciado: '¿Un ángulo de $300^\circ$ en posición estándar ubica su lado terminal en el cuarto cuadrante?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, porque $270^\circ < 300^\circ < 360^\circ$.'
  - titulo: 'Condición de vértice en el origen'
    enunciado: '¿Un ángulo con vértice en el punto $(2,3)$ puede estar en posición estándar?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el vértice debe coincidir obligatoriamente con el origen de coordenadas $(0,0)$.'
errores_frecuentes:
  - 'La afirmación de que el lado inicial de un ángulo en posición estándar puede estar ubicado en el eje Y.'
  - 'La afirmación de que el vértice de un ángulo en posición estándar puede colocarse en el punto $(1,0)$.'
  - 'La afirmación de que un ángulo de $200^\circ$ en posición estándar pertenece al segundo cuadrante.'
  - 'La afirmación de que la posición estándar cambia si se mide el ángulo en radianes en lugar de grados.'
  - 'La afirmación de que la posición estándar requiere que el radio del ángulo mida obligatoriamente 2 unidades.'
afirmaciones_verdaderas:
  - 'Todo ángulo en posición estándar posee su vértice posicionado exactamente en el origen $O(0,0)$.'
  - 'El lado inicial de un ángulo en posición estándar coincide de manera invariable con el semieje positivo del eje X.'
al_terminar_debes_poder: |
  QUÉ: Identificar y construir ángulos en posición estándar en el plano cartesiano.
  CÓMO: Fijar el vértice en $(0,0)$ y el lado inicial en el semieje $+X$, clasificando el cuadrante del lado terminal.
