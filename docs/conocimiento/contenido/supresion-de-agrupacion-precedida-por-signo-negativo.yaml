resumen_inicial: Al suprimir un signo de agrupación precedido por un signo negativo
  (-), todos los términos de su interior cambian obligatoriamente al signo opuesto.
explicacion_simple: 'Cuando hay un signo menos $-$ delante de un paréntesis (como
  $- (2x - 3y + 4)$), al quitar el paréntesis debemos CAMBIAR TODOS los signos de
  adentro: el $2x$ positivo pasa a $-2x$, el $-3y$ pasa a $+3y$, y el $+4$ pasa a
  $-4$. El resultado es $-2x + 3y - 4$.'
explicacion_formal: 'Sea la expresión $- (T_1 + T_2 + \dots + T_n)$. Por la **Propiedad
  Distributiva del Escalar -1**:


  $$ - (T_1 + T_2 + \dots + T_n) = -1 \cdot (T_1 + T_2 + \dots + T_n) = -T_1 - T_2
  - \dots - T_n$$


  $$\forall k \in \{1, \dots, n\}, \quad \text{sgn}(-1 \cdot T_k) = - \text{sgn}(T_k)$$


  > **Complemento didáctico:** El signo negativo exterior actúa como el operador de
  inversión aditiva global sobre cada término del bloque encerrado.'
definiciones_clave: '- **Supresión por signo negativo**: Eliminación del signo de
  agrupación invirtiendo la polaridad de todos sus términos.'
propiedades_relaciones: '- **Inversión aditiva unificada**: $- (A - B) = -A + B =
  B - A$.'
ejemplo_guiado:
  enunciado: Suprima el paréntesis y reduzca la expresión $E = 9a - (4a - 5b + 2)$.
  pasos:
  - 'Paso 1: Identificar el signo que precede al paréntesis: $-$.

    - Paso 2: Invertir el signo del primer término $(+4a \to -4a)$.'
  - 'Paso 3: Invertir el signo del segundo término ($-5b \to +5b$).

    - Paso 4: Invertir el signo del tercer término ($+2 \to -2$).'
  - 'Paso 5: Escribir la expresión completa: $9a - 4a + 5b - 2$.'
  - 'Paso 6: Reducir términos semejantes: $(9 - 4)a + 5b - 2 = 5a + 5b - 2$.'
  - 'Conclusión: La expresión simplificada es $5a + 5b - 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con todos los términos interiores al eliminar un paréntesis
    precedido por signo -?
  choices:
  - text: Invierten obligatoriamente su signo (los positivos a negativos y los negativos
      a positivos)
    is_correct: true
  - text: Se mantienen todos con sus signos originales
    is_correct: false
  - text: Sólo cambia el signo del último término
    is_correct: false
  - text: Todos se convierten en números impares
    is_correct: false
  explanation: La alternativa correcta es 'Invierten obligatoriamente su signo (los
    positivos a negativos y los negativos a positivos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 9a - (4a - 5b + 2), ¿cuál fue el resultado reducido?
  choices:
  - text: 5a + 5b - 2
    is_correct: true
  - text: 5a - 5b + 2
    is_correct: false
  - text: 13a - 5b + 2
    is_correct: false
  - text: 9a - 4a - 5b
    is_correct: false
  explanation: La alternativa correcta es '5a + 5b - 2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el signo inmediatamente anterior al paréntesis sea $-$.'
- 'Paso 2: Eliminar el signo $-$ exterior y los paréntesis.'
- 'Paso 3: Cambiar el signo de CADA UNO de los términos de su interior.'
- 'Paso 4: Reducir términos semejantes.'
errores_correccion: '- **Error 1: Cambiar de signo sólo al primer término dentro del
  paréntesis y dejar los demás con sus signos originales (escribir $-(x - y) = -x
  - y$).** **Cómo corregirlo:** El signo menos distribuye a TODOS los términos: $-(x
  - y) = -x + y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al suprimir el paréntesis en -(3x - 8y + 1), ¿qué expresión resulta?
  alternativas:
  - -3x + 8y - 1
  - -3x - 8y + 1
  - 3x - 8y - 1
  - -3x + 8y + 1
  respuesta: -3x + 8y - 1
  solucion_pasos:
  - '1. Invertir signos: +3x -> -3x, -8y -> +8y, +1 -> -1.'
  - '2. Resultado: -3x + 8y - 1.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de reducir 10k - (4k - 6)?
  alternativas:
  - 6k + 6
  - 6k - 6
  - 14k + 6
  - -6k + 6
  respuesta: 6k + 6
  solucion_pasos:
  - '1. Cambiar signos: 10k - 4k + 6.'
  - '2. Reducir: 6k + 6.'
- titulo: ¿Es la expresión -(a - b) equivalente a b - a?
  respuesta: Sí
  solucion_pasos:
  - Sí, -(a - b) = -a + b = b - a por conmutatividad aditiva.
- titulo: ¿Al eliminar el paréntesis en -(+x + y) se obtiene la expresión -x + y?
  respuesta: 'No'
  solucion_pasos:
  - No, ambos términos deben invertir su signo dando -x - y.
errores_frecuentes:
- Cambiar únicamente el signo del primer término dentro del paréntesis dejando los
  demás inalterados.
- Conservar los signos originales de los términos interiores cuando el paréntesis
  lleva signo menos antecedente.
- Declarar que el signo menos exterior desaparece sin afectar al interior del paréntesis.
- Multiplicar por -1 los coeficientes sin alterar los signos positivos.
- Declarar la supresión de un signo menos con la elevación al cuadrado.
afirmaciones_verdaderas:
- Un signo menos delante de un paréntesis invierte la polaridad de todos los términos
  en su interior.
- La expresión -(x - y) se transforma rigurosamente en -x + y al suprimir los paréntesis.
al_terminar_debes_poder: Al terminar serás capaz de suprimir signos de agrupación
  precedidos por signo negativo invirtiendo correctamente el signo de cada término
  interior.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Signos de Agrupación.
