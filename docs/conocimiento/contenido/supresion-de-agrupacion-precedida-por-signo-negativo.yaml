semantic_id: MAT.ALG.AGRUPACION.SUPRESION_SIGNO_MENOS
resumen_inicial: La supresión de agrupación precedida por signo negativo consiste en eliminar los delimitadores invirtiendo obligatoriamente el signo de todos y cada uno de los términos encerrados en su interior.
explicacion_simple: "Cuando un signo de agrupación (paréntesis, corchete o llave) está precedido por un **signo negativo ($-$)**:\n- **REGLA DE ORO**: **El signo $-$ se elimina junto con el paréntesis, pero OBLIGA A CAMBIAR EL SIGNO DE TODOS LOS TÉRMINOS DE ADENTRO (de $+$ a $-$ y de $-$ a $+$)**.\n- **Pasos**:\n  1. Borras el signo $-$ antecedente y las marcas del paréntesis.\n  2. Cambias el signo de **CADA TÉRMINO** que estaba dentro del paréntesis.\n  3. Reduces los términos semejantes resultantes.\n- **Ejemplo**: Eliminar paréntesis en $8x - (3x - 5y + 2)$:\n  - El $+3x$ de adentro se convierte en $\\mathbf{-3x}$.\n  - El $-5y$ de adentro se convierte en $\\mathbf{+5y}$.\n  - El $+2$ de adentro se convierte en $\\mathbf{-2}$.\n  - Queda: $8x - 3x + 5y - 2$.\n  - Reducimos la clase $x$: **$5x + 5y - 2$**.\n\n![Supresión con Signo Negativo Previo](/static/img/nodos/supresion-de-agrupacion-precedida-por-signo-negativo-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $- \mathcal{D}(A)$ una subexpresión delimitada por $\mathcal{D} \in \{ (), [], \{\} \}$ precedida por el operador aditivo de inversión $-1$. Por la propiedad distributiva del producto escalar $-1 \cdot T$ sobre cada monomio $T_i \in A$:


  $$- \big( T_1 + T_2 - T_3 \big) = -1 \cdot T_1 + -1 \cdot T_2 + -1 \cdot (-T_3) = -T_1 - T_2 + T_3$$


  ### Inversión Estricta de Signos

  La aplicación del signo negativo antecedente actúa como el operador de negación aditiva $\operatorname{Neg}: \mathbb{R} \to \mathbb{R}$:


  $$\operatorname{sgn}(\text{término}_i \text{ liberado}) = -\operatorname{sgn}(\text{término}_i \text{ encerrado}) \quad \forall i$$


  ### Síntesis didáctica

  La supresión con signo negativo exige una atención rigurosa para no omitir el cambio de signo en el segundo término ni en las constantes subsecuentes.

  '
definiciones_clave: '- **Supresión con signo negativo**: Eliminación del delimitador invirtiendo la signatura de todos los términos contenidos.

  - **Inversión aditiva ($-1 \cdot A$)**: Operación distributiva que transforma positivos en negativos y viceversa.

  - **Término inicial implícito positivo**: Al suprimir $-(a - b)$, la letra $a$ (positiva interna) sale como $-a$.

  '
propiedades_relaciones: '- **Negación distributiva**: $-(A + B - C) = -A - B + C$.

  - **Involución del signo menos**: $-(-A) = +A$.

  '
ejemplo_guiado:
  enunciado: 'Elimina los signos de agrupación y reduce la expresión: $12m - (4m - 7n + 3) - 2n$.'
  pasos:
  - 'Paso 1: Identificamos que el paréntesis está precedido por un signo $- \implies -(4m - 7n + 3)$.'
  - 'Paso 2: Eliminamos el signo negativo antecedente y los paréntesis invirtiendo el signo de TODOS los términos internos: - $+4m \to -4m$ - $-7n \to +7n$ - $+3 \to -3$.'
  - 'Paso 3: Escribimos la expresión desarmada: $12m - 4m + 7n - 3 - 2n$.'
  - 'Paso 4: Agrupamos y reducimos la Clase $m$: $12m - 4m = \mathbf{8m}$.'
  - 'Paso 5: Agrupamos y reducimos la Clase $n$: $+7n - 2n = \mathbf{+5n}$.'
  - 'Paso 6: Copiamos la constante $\mathbf{-3}$.'
  - 'Conclusión: La expresión reducida es **$8m + 5n - 3$**.'
  imagen: /static/img/nodos/supresion-de-agrupacion-precedida-por-signo-negativo-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con los signos de los términos encerrados al suprimir un paréntesis precedido por un signo negativo ($-$)?
  choices:
  - text: Todos los términos de adentro cambian obligatoriamente de signo (de $+$ a $-$ y de $-$ a $+$)
    is_correct: true
  - text: Solamente cambia el signo del primer término
    is_correct: false
  - text: Todos los signos se mantienen iguales
    is_correct: false
  - text: Se multiplican los términos por cero
    is_correct: false
  explanation: La alternativa correcta es 'Todos los términos de adentro cambian obligatoriamente de signo (de $+$ a $-$ y de $-$ a $+$)'. Inversión estricta de la signatura.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de eliminar el paréntesis en $5x - (2x - 8)$?
  choices:
  - text: El resultado es $5x - 2x + 8$, que se reduce a $3x + 8$
    is_correct: true
  - text: El resultado es $5x - 2x - 8$
    is_correct: false
  - text: El resultado es $5x + 2x + 8$
    is_correct: false
  - text: El resultado es $3x - 8$
    is_correct: false
  explanation: 'La alternativa correcta es ''El resultado es $5x - 2x + 8$, que se reduce a $3x + 8$''. Inversión de signos: $- (2x - 8) = -2x + 8 \implies 5x - 2x + 8 = 3x + 8$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el signo de agrupación esté inmediatamente precedido por un signo menos ($-$).'
- 'Paso 2: Borrar el signo menos antecedente y las marcas del paréntesis de apertura y cierre.'
- 'Paso 3: Escribir cada uno de los términos encerrados invirtiendo su signo ($+$ pasa a $-$, y $-$ pasa a $+$).'
- 'Paso 4: Reducir los términos semejantes de la expresión resultante.'
errores_correccion: '- **Error 1:** Cambiar el signo del primer término pero mantener el signo del segundo (escribir $-(a - b) = -a - b$). **Cómo corregirlo:** El signo menos **AFECTA A TODOS LOS TÉRMINOS ($-a + b$)**.

  - **Error 2:** Mantener el signo menos antecedente fuera del paréntesis tras invertir los signos internos. **Cómo corregirlo:** El signo menos antecedente **DESAPARECE AL DISTRIBUIRSE JUNTO CON EL PARÉNTESIS**.

  '
ejemplos:
- titulo: Supresión con resta
  enunciado: ¿Cuál es la supresión de $-(3x + 4y)$?
  alternativas:
  - $-3x - 4y$
  - $-3x + 4y$
  - $3x - 4y$
  respuesta: $-3x - 4y$
  solucion_pasos:
  - '1. Inversión de signos: $+3x \to -3x$ y $+4y \to -4y$.'
  - '2. Resultado: $-3x - 4y$.'
- titulo: Inversión de negativo
  enunciado: ¿Cuál es la supresión de $-(a - 6)$?
  alternativas:
  - $-a + 6$
  - $-a - 6$
  - $a + 6$
  respuesta: $-a + 6$
  solucion_pasos:
  - '1. Inversión: $+a \to -a$ y $-6 \to +6$.'
  - '2. Resultado: $-a + 6$.'
- titulo: Reducción tras supresión negativa
  enunciado: Para $10x - (4x - 3x)$, ¿se obtiene $10x - 4x + 3x = 9x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10x - 4x + 3x = 9x$.
- titulo: Doble negación
  enunciado: ¿Produce $-(-5y)$ el término positivo $+5y$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-(-5y) = +5y$.
errores_frecuentes:
- Cambiar únicamente el signo del primer término del paréntesis olvidando cambiar los signos siguientes.
- Mantener el signo menos antecedente junto al paréntesis al realizar la supresión de la agrupación.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- La inversión del signo de las constantes numéricas dentro del paréntesis no se ejecuta.
- Multiplicar los coeficientes en lugar de invertir su signo.
afirmaciones_verdaderas:
- Un signo de agrupación precedido por signo negativo se suprime invirtiendo el signo de cada uno de sus términos.
- El signo menos antecedente se consume al cambiar los signos de los términos contenidos.
al_terminar_debes_poder: '![Resumen de supresión con signo negativo](/static/img/nodos/supresion-de-agrupacion-precedida-por-signo-negativo-resumen.svg)


  QUÉ: Eliminar signos de agrupación precedidos por un signo menos $(-)$.


  CÓMO: Distribuir el factor $(-1)$ invirtiendo obligatoriamente el signo de todos y cada uno de los términos interiores $-(a - b + c) = -a + b - c$.'
