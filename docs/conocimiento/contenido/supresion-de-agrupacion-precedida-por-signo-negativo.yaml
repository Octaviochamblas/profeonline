semantic_id: MAT.ALG.AGRUPACION.SUPRESION_SIGNO_MENOS
resumen_inicial: 'Supresión de agrupación precedida por signo negativo: procedimiento
  y reglas en Signos de agrupación.'
explicacion_simple: 'El signo menos es un espejo invertido. Cada vez que un paréntesis
  tiene un signo menos delante, es como si ese menos le dijera a todos los de adentro:
  ''Dense vuelta''. Los positivos se vuelven negativos y los negativos se vuelven
  positivos.'
explicacion_formal: '### Definición formal


  El $-$ exterior invierte cada signo: $-(+2x)=-2x$, $-(-5y)=+5y$, $-(+3z)=-3z$.


  ### Desarrollo didáctico


  Ejemplo: $10 - (3x - 2y + 5)$.


  El paréntesis va precedido de $-$. Este $-$ invierte todos los signos interiores:

  $10 - 3x + 2y - 5$.


  ¿Por qué? Porque el $-$ exterior se ''distribuye'' sobre cada término:

  $-(+3x) = -3x$.

  $-(-2y) = +2y$.

  $-(+5) = -5$.


  Reducimos: $(10 - 5) - 3x + 2y = 5 - 3x + 2y$.'
definiciones_clave: '- **Supresión de agrupación precedida por signo negativo**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a supresión de agrupación precedida por signo negativo.'
ejemplo_guiado:
  enunciado: Aplica supresión de agrupación precedida por signo negativo en una expresión
    algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de supresión de agrupación
    precedida por signo negativo.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
