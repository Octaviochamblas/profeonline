semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MAYOR_IGUAL_POSITIVO
resumen_inicial: 'Una inecuación del tipo $|X| \ge k$ con $k > 0$ equivale a la unión
  de dos ramas inclusivas: $X \le -k$ o $X \ge k$.'
explicacion_simple: 'Cuando tenemos $|X| \ge k$ con un número positivo $k > 0$:

  La regla de separación aplica dividiendo el problema en dos ramas que **INCLUYEN
  los bordes**:

  - $X \le -k$

  - O bien $X \ge k$

  La solución final es la unión de dos intervalos semiinfinitos cerrados en su borde
  finito: $]-\infty, -k] \ \cup \ [k, +\infty[$.'
explicacion_formal: 'Para toda expresión $X$ y constante $k > 0$:


  $$|X| \ge k \iff (X \le -k) \quad \lor \quad (X \ge k)$$


  **Desglose de la fórmula:**

  - Conjunto solución en formato de unión de intervalos cerrados en sus extremos finitos:
  $S = ]-\infty, -k] \ \cup \ [k, +\infty[$.'
definiciones_clave: '- **Propiedad de separación inclusiva $|X| \ge k$**: Regla que
  convierte una inecuación de valor absoluto ''mayor o igual que'' en la unión de
  dos ramas disjuntas no estrictas.'
propiedades_relaciones: '- **Inclusión de los puntos frontera**: Los valores $X =
  -k$ y $X = k$ pertenecen al conjunto solución.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación $|5x - 2| \ge 8$ y expresa la solución como unión
    de intervalos.
  pasos:
  - 'Paso 1: Aplicar la propiedad $|X| \ge k \iff (X \le -k) \lor (X \ge k)$: $(5x
    - 2 \le -8) \lor (5x - 2 \ge 8)$.Paso 2: Resolver la primera rama: $5x \le -8
    + 2 \implies 5x \le -6 \implies x \le -\frac{6}{5}$.Paso 3: Resolver la segunda
    rama: $5x \ge 8 + 2 \implies 5x \ge 10 \implies x \ge 2$.Paso 4: Escribir la solución
    final como unión de intervalos: $S = ]-\infty, -\frac{6}{5}] \ \cup \ [2, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $|5x - 2| \ge 8$, ¿cuál es la unión de intervalos solución
    $S$?
  choices:
  - text: $S = ]-\infty, -\frac{6}{5}] \ \cup \ [2, +\infty[$
    is_correct: true
  - text: $S = [-\frac{6}{5}, 2]$
    is_correct: false
  - text: $S = ]-\infty, 2]$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-\infty, -\frac{6}{5}] \ \cup \ [2,
    +\infty[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la solución $S = ]-\infty, -\frac{6}{5}] \ \cup \ [2, +\infty[$, ¿pertenece
    el número $2$ a las soluciones válidas?
  choices:
  - text: Sí, porque el corchete es cerrado en 2 ($[2$).
    is_correct: true
  - text: No, porque los infinitos son abiertos.
    is_correct: false
  - text: No, el número 2 está excluido.
    is_correct: false
  - text: Depende de si $x$ es negativo.
    is_correct: false
  explanation: La alternativa correcta es 'Sí, porque el corchete es cerrado en 2
    ($[2$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los dos casos: $\text{expresión} \le -k$ o $\text{expresión} \ge
  k$.'
- 'Paso 2: Despejar $x$ en cada caso.'
- 'Paso 3: Unir las dos soluciones mediante el operador $\cup$ manteniendo los corchetes
  cerrados en los extremos finitos.'
errores_correccion: '- **Error común:** Usar corchetes abiertos en los números finitos
  de $|X| \ge k$.

  - **Cómo corregirlo:** La presencia del igual ($\ge$) exige corchete cerrado $[$
  ó $]$ sobre los bordes numéricos finitos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
