semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MAYOR_IGUAL_POSITIVO
resumen_inicial: La resolución de inecuaciones del tipo $|E| \ge k$ con $k > 0$ se desglosa en la unión de dos inecuaciones independientes mediante el operador disyuntivo.
explicacion_simple: '![Resolución de inecuación de valor absoluto mayor o igual que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-mayor-o-igual-que-una-constante-positiva-intro.svg)


  Para resolver una inecuación como $|x| \ge 5$, buscamos los números cuya distancia a cero sea **al menos 5**.


  Esto ocurre en dos zonas distintas:

  1. Números menores o iguales a $-5$ ($x \le -5$).

  2. Números mayores o iguales a $5$ ($x \ge 5$).


  La solución final es la **unión** de ambas zonas: $]-\infty, -5] \cup [5, +\infty[$.'
explicacion_formal: 'Para $k > 0$ y $E(x)$ una expresión algebraica:


  $$|E(x)| \ge k \iff E(x) \le -k \quad \lor \quad E(x) \ge k$$


  **Desglose de la fórmula:**

  - Disyunción lógica ($\lor$): Exige tomar todos los valores que satisfacen la primera o la segunda condición.

  - Conjunto solución global $S = S_1 \cup S_2 = ]-\infty, -k] \cup [k, +\infty[$.

  '
definiciones_clave: '- **Propiedad disyuntiva de mayor o igual**: Regla de descomposión de $|E| \ge k$ en dos ramas separadas por el operador unión.

  '
propiedades_relaciones: '- **Inclusión de límites**: Dado que el operador es $\ge$, los extremos $-k$ y $k$ llevan corchetes cerrados.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución de inecuación de valor absoluto mayor o igual que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-mayor-o-igual-que-una-constante-positiva-ejemplos.svg)


    Resuelve la inecuación de valor absoluto $|2x - 1| \ge 7$ y expresa la solución en notación de intervalo.'
  pasos:
  - 'Paso 1: Aplicar la propiedad disyuntiva: $2x - 1 \le -7 \ \lor \ 2x - 1 \ge 7$.'
  - 'Paso 2: Resolver la primera inecuación: $2x \le -6 \implies x \le -3 \implies S_1 = ]-\infty, -3]$.'
  - 'Paso 3: Resolver la segunda inecuación: $2x \ge 8 \implies x \ge 4 \implies S_2 = [4, +\infty[$.'
  - 'Paso 4: Unir ambas ramas: $S = ]-\infty, -3] \cup [4, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $|2x - 1| \ge 7$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = ]-\infty, -3] \cup [4, +\infty[$
    is_correct: true
  - text: $S = [-3, 4]$
    is_correct: false
  - text: $S = ]-3, 4[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-\infty, -3] \cup [4, +\infty[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué conector de conjuntos une los intervalos de solución de $|E| \ge k$?
  choices:
  - text: El símbolo de unión ($\cup$).
    is_correct: true
  - text: El símbolo de intersección ($\cap$).
    is_correct: false
  - text: El símbolo de resta de conjuntos ($-$).
    is_correct: false
  - text: El conjunto nulo ($\emptyset$).
    is_correct: false
  explanation: La alternativa correcta es 'El símbolo de unión ($\cup$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la constante $k$ sea positiva ($k > 0$).'
- 'Paso 2: Formular la primera rama $E \le -k$ y despejar $x$ obteniendo $S_1$.'
- 'Paso 3: Formular la segunda rama $E \ge k$ y despejar $x$ obteniendo $S_2$.'
- 'Paso 4: Escribir la unión $S = S_1 \cup S_2$.'
errores_correccion: '- **Error común:** Escribir $-7 \ge 2x - 1 \ge 7$ como si fuera un intervalo continuo.

  - **Cómo corregirlo:** La propiedad $\ge$ SEPARA la solución en dos inecuaciones distintas conectadas por "O" ($\lor$), nunca en una doble desigualdad continua.

  '
ejemplos:
- titulo: 'Ejemplo 1: Caso básico'
  enunciado: ¿Cuál es la solución de $|x| \geq 7$?
  alternativas:
  - $]-\infty, -7] \cup [7, +\infty[$
  - $[-7, 7]$
  - $]-7, 7[$
  - $[7, +\infty[$
  respuesta: $]-\infty, -7] \cup [7, +\infty[$
  solucion_pasos:
  - 'Paso 1: Desdoblar en $x \le -7 \lor x \ge 7$.'
  - 'Paso 2: $S = ]-\infty, -7] \cup [7, +\infty[$.'
- titulo: 'Ejemplo 2: Con traslación'
  enunciado: Resuelve $|x - 5| \geq 2$.
  alternativas:
  - $]-\infty, 3] \cup [7, +\infty[$
  - $[3, 7]$
  - $]-\infty, -3] \cup [7, +\infty[$
  - $[5, +\infty[$
  respuesta: $]-\infty, 3] \cup [7, +\infty[$
  solucion_pasos:
  - 'Paso 1: $x - 5 \le -2 \implies x \le 3$.'
  - 'Paso 2: $x - 5 \ge 2 \implies x \ge 7$.'
  - 'Paso 3: $S = ]-\infty, 3] \cup [7, +\infty[$.'
- titulo: 'Ejemplo 3: Coeficiente multiplicativo'
  enunciado: Resuelve $|2x + 4| \geq 6$.
  alternativas:
  - $]-\infty, -5] \cup [1, +\infty[$
  - $[-5, 1]$
  - $]-\infty, -1] \cup [5, +\infty[$
  - $[1, +\infty[$
  respuesta: $]-\infty, -5] \cup [1, +\infty[$
  solucion_pasos:
  - 'Paso 1: $2x + 4 \le -6 \implies 2x \le -10 \implies x \le -5$.'
  - 'Paso 2: $2x + 4 \ge 6 \implies 2x \ge 2 \implies x \ge 1$.'
  - 'Paso 3: $S = ]-\infty, -5] \cup [1, +\infty[$.'
- titulo: 'Ejemplo 4: Corchetes en bordes'
  enunciado: ¿Qué corchete llevan los extremos finitos en la solución de $|f(x)| \geq k$?
  alternativas:
  - Corchetes cerrados ($]$ a la izquierda y $[$ a la derecha)
  - Corchetes abiertos
  - Corchete cerrado solo en el infinito
  - Depende del signo de $k$
  respuesta: Corchetes cerrados ($]$ a la izquierda y $[$ a la derecha)
  solucion_pasos:
  - 'Paso 1: Por contener el signo $\ge$, los bordes están incluidos.'
  - 'Paso 2: Llevan corchetes cerrados $]-\infty, -k] \cup [k, +\infty[$.'
errores_frecuentes:
- La inecuación $|x - 2| \ge 5$ se desglosa en la desigualdad continua $-5 \ge x - 2 \ge 5$.
- Resolver $|x| \ge 4$ resulta únicamente en el intervalo positivo $[4, +\infty[$, descartando las soluciones negativas.
- Al desglosar $|x| \ge k$ con $k > 0$, la rama negativa se escribe como $x \ge -k$.
- Unir los intervalos de la solución disyuntiva de $|x| \ge k$ produce el conjunto vacío $\emptyset$.
- La desigualdad $|x + 1| \ge 3$ exige invertir el operador al valor absoluto sin desglosar en casos.
afirmaciones_verdaderas:
- Para $k \ge 0$, la desigualdad $|E| \ge k$ equivale a la disyunción de condiciones $E \le -k \quad \lor \quad E \ge k$.
- 'El conjunto solución de $|E| \ge k$ es la unión de dos intervalos ilimitados: $]-\infty, -k] \cup [k, +\infty[$.'
al_terminar_debes_poder: '**QUÉ:** Resolver inecuaciones de la forma $|f(x)| \ge k$ con $k > 0$.


  **CÓMO:** Desdoblando en la unión de dos semirrectas exteriores con extremos cerrados: $f(x) \le -k \lor f(x) \ge k$.


  ![Resumen Resolución de inecuación de valor absoluto mayor o igual que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-mayor-o-igual-que-una-constante-positiva-resumen.svg)'
