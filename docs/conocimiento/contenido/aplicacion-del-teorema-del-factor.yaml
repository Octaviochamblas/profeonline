semantic_id: MAT.ALG.TEOREMA_FACTOR.FACTOR_LINEAL
resumen_inicial: 'La aplicación del Teorema del Factor establece que un binomio $(x - r)$ es un factor divisible de un polinomio $P(x)$ si y sólo si el valor evaluado en esa raíz es nulo: $P(r) = 0$.'
explicacion_simple: |
  El **Teorema del Factor** es el puente directo entre hallar una raíz y factorizar un polinomio:
  - **REGLA FUNDAMENTAL DEL TEOREMA DEL FACTOR**:
    $$\mathbf{P(r) = 0 \iff (x - r) \text{ es un factor de } P(x)}$$
  - **¿Cómo usarlo en 2 pasos?**:
    1. **Evalúa el polinomio en el número $r$**:
       - Si al calcular $P(3)$ te da **$0$**, el teorema afirma automáticamente que **$(x - 3)$ es un factor exacto del polinomio**.
    2. **Expresa la factorización parcial**:
       - $P(x) = (x - 3) \cdot Q(x)$, donde $Q(x)$ es el polinomio resultante de dividir $P(x)$ por $(x - 3)$.
  - **Inversión de signos en el factor**:
    - Si la raíz es **$r = +5$**, el factor es **$(x - 5)$**.
    - Si la raíz es **$r = -4$**, el factor es **$(x + 4)$** (¡porque $x - (-4) = x + 4$!).
explicacion_formal: |
  ### Definición formal
  Sea el polinomio $P(x) \in \mathbb{R}[x]$ de grado $n \ge 1$ y sea $r \in \mathbb{R}$. El **Teorema del Factor** es el corolario directo del Teorema del Resto ($P(x) = Q(x)(x - r) + P(r)$), formalizado por la equivalencia lógica:

  $$\mathbf{P(r) = 0 \iff (x - r) \mid P(x)}$$

  donde $(x - r) \mid P(x)$ denota que el binomio lineal $(x - r)$ divide exactamente a $P(x)$ en el anillo $\mathbb{R}[x]$, produciendo un cociente $Q(x) \in \mathbb{R}[x]$ de grado $n-1$ sin residuo ($R = 0$).

  ### Demostración
  - **$(\implies)$**: Si $P(r) = 0$, por el Teorema del Resto $P(x) = Q(x)(x - r) + P(r) = Q(x)(x - r) + 0 = Q(x)(x - r)$. Por lo tanto, $(x - r)$ es un factor de $P(x)$.
  - **$(\impliedby)$**: Si $(x - r)$ es un factor, $P(x) = Q(x)(x - r)$. Evaluando en $x = r$: $P(r) = Q(r)(r - r) = Q(r)(0) = 0$.

  ### Síntesis didáctica
  Probar que un número $r$ anula a $P(x)$ ($P(r)=0$) garantiza de forma matemática absoluta que $(x-r)$ es un paréntesis divisor del polinomio.
definiciones_clave: |
  - **Teorema del Factor**: Principio que establece que $(x - r)$ es factor de $P(x)$ si y sólo si $P(r) = 0$.
  - **Divisibilidad polinomial ($(x - r) \mid P(x)$)**: Propiedad de división exacta con resto igual a 0.
  - **Polinomio cociente ($Q(x)$)**: Polinomio de un grado menor ($n-1$) obtenido al dividir $P(x)$ por el factor lineal $(x - r)$.
propiedades_relaciones: |
  - **Construcción de factor a partir de raíz**: A cada cero $r_i$ le corresponde unívocamente el factor lineal $(x - r_i)$.
ejemplo_guiado:
  enunciado: 'Aplica el Teorema del Factor para verificar si $(x - 2)$ es un factor del polinomio $P(x) = x^3 - 3x^2 - x + 6$.'
  pasos:
    - 'Paso 1: Identificamos el valor de la raíz asociada al binomio $(x - 2)$: $r = \mathbf{+2}$.'
    - 'Paso 2: Evaluamos el polinomio $P(x)$ en $x = 2$:
       $P(2) = (2)^3 - 3(2)^2 - (2) + 6$.'
    - 'Paso 3: Calculamos la expresión:
       - $2^3 = 8$.
       - $-3(2^2) = -3(4) = -12$.
       - $P(2) = 8 - 12 - 2 + 6 = \mathbf{0}$.'
    - 'Paso 4: Interpretamos el resultado por el Teorema del Factor:
       Como $P(2) = 0$, se concluye que **$(x - 2)$ sí es un factor divisible de $P(x)$**.'
    - 'Conclusión: El binomio **$(x - 2)$ es un factor exacto de $P(x)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si al evaluar el polinomio $P(x) = x^3 - 7x + 6$ en $x = -3$ obtenemos $P(-3) = (-3)^3 - 7(-3) + 6 = -27 + 21 + 6 = 0$, ¿cuál es el factor lineal garantizado por el Teorema del Factor?'
    choices:
      - {text: 'El factor lineal garantizado es $(x + 3)$, invirtiendo el signo de la raíz $r = -3 \implies (x - (-3)) = (x + 3)$', is_correct: true}
      - {text: 'El factor lineal es $(x - 3)$', is_correct: false}
      - {text: 'El factor lineal es $(x - 7)$', is_correct: false}
      - {text: 'El factor lineal es $(x + 6)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El factor lineal garantizado es $(x + 3)$, invirtiendo el signo de la raíz $r = -3 \implies (x - (-3)) = (x + 3)$''. Teorema del Factor: $P(-3)=0 \iff (x - (-3)) = (x+3)$ divide a $P(x)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al evaluar un polinomio $P(x)$ en $x = 4$ obtenemos $P(4) = 9 \neq 0$, ¿qué concluyes sobre el binomio $(x - 4)$?'
    choices:
      - {text: 'Se concluye que $(x - 4)$ NO es un factor de $P(x)$ porque el resto es 9 y no 0', is_correct: true}
      - {text: 'Se concluye que $(x - 4)$ es un factor de $P(x)$', is_correct: false}
      - {text: 'Se concluye que $P(x)$ es de grado 9', is_correct: false}
      - {text: 'Se concluye que $x = 4$ es la solución única', is_correct: false}
    explanation: 'La alternativa correcta es ''Se concluye que $(x - 4)$ NO es un factor de $P(x)$ porque el resto es 9 y no 0''. Si $P(r) \neq 0$, la división deja residuo y $(x-r)$ no es factor.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la raíz $r$ del candidato a binomio factor $(x - r)$ igualándolo a cero.'
  - 'Paso 2: Evaluar el polinomio $P(x)$ en el número $r$.'
  - 'Paso 3: Comprobar si el resultado de la evaluación es idénticamente cero ($P(r) = 0$).'
  - 'Paso 4: Si $P(r) = 0$, declarar que $(x - r)$ es un factor del polinomio.'
errores_correccion: |
  - **Error 1:** Invertir los signos al armar el factor desde la raíz (escribir $(x - 3)$ para una raíz $r = -3$). **Cómo corregirlo:** Para una raíz negativa $r = -3$, **EL FACTOR LLEVA SIGNO POSITIVO ($(x - (-3)) = (x + 3)$)**.
  - **Error 2:** Declarar que $(x - r)$ es un factor cuando la evaluación da un resto distinto de 0. **Cómo corregirlo:** Para ser un factor exacto **EL RESTO DEBE SER ESTRICTAMENTE IGUAL A CERO ($P(r) = 0$)**.
ejemplos:
  - titulo: 'Evaluación nula'
    enunciado: 'Si $P(5) = 0$, ¿es $(x - 5)$ un factor?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por el Teorema del Factor.'
  - titulo: 'Raíz negativa'
    enunciado: 'Si $P(-2) = 0$, ¿es $(x + 2)$ el factor correspondiente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $x - (-2) = x + 2$.'
  - titulo: 'Evaluación no nula'
    enunciado: 'Si $P(1) = 3$, ¿es $(x - 1)$ un factor exacto de $P(x)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, porque deja resto 3.'
  - titulo: 'Factorización parcial'
    enunciado: 'Si $P(2) = 0$, ¿se puede escribir $P(x) = (x - 2) \cdot Q(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se descompone en producto.'
errores_frecuentes:
  - 'Invertir el signo de la raíz r al escribir el binomio factor (x - r).'
  - 'Declarar que un binomio es factor exacto cuando la evaluación del polinomio da un resto no nulo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar el valor del factor (x - r) con la constante evaluada P(r).'
  - 'Evaluar en el binomio completo (x - r) en lugar de evaluar únicamente en el número r.'
afirmaciones_verdaderas:
  - 'Un binomio $(x - r)$ es factor de $P(x)$ si y sólo si la evaluación $P(r)$ es igual a 0.'
  - 'La raíz $r = k$ genera el factor lineal $(x - k)$ y la raíz $r = -k$ genera el factor lineal $(x + k)$.'
al_terminar_debes_ponder: 'Aplicar el Teorema del Factor para determinar si un binomio $(x-r)$ divide exactamente a un polinomio $P(x)$.'
