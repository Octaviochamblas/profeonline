resumen_inicial: El Teorema del Factor establece que $(x - a)$ es un factor de un
  polinomio $P(x)$ si y solo si $P(a) = 0$.
explicacion_simple: Si al reemplazar $x = a$ en un polinomio el resultado da cero,
  entonces $(x - a)$ es un bloque o factor en la multiplicación del polinomio. Por
  ejemplo, como $P(3) = 0$ en $x^2 - 9$, el binomio $(x - 3)$ es un factor de $x^2
  - 9$.
explicacion_formal: 'Sea $P(x)$ un polinomio no nulo en $\mathbb{R}[x]$ y $a \in \mathbb{R}$.


  El **Teorema del Factor** establece la equivalencia lógica bidireccional:


  $$(x - a) \text{ es factor de } P(x) \iff P(a) = 0$$


  **Demostración Directa:**

  1. Por el algoritmo de la división: $P(x) = (x - a)Q(x) + R$ donde $R = P(a)$.

  2. Si $P(a) = 0$, se tiene $R = 0$, de modo que $P(x) = (x - a)Q(x)$, demostrando
  que $(x - a)$ divide exactamente a $P(x)$.'
definiciones_clave: '- **Teorema del Factor**: Teorema algebraico que vincula la raíz
  $x = a$ con el divisor binómico exacto $(x - a)$.

  - **Factor lineal**: Binomio de primer grado de la forma $(x - a)$ que divide a
  un polinomio sin dejar residuo.'
propiedades_relaciones: '- **Cambio de signo de la raíz**: La raíz $a$ genera el factor
  $(x - a)$. Por su parte, una raíz negativa $-a$ produce el factor $(x + a)$ pues
  $(x - (-a)) = x + a$.'
ejemplo_guiado:
  enunciado: Demuestre si el binomio $(x + 3)$ es factor del polinomio $P(x) = x^3
    + 2x^2 - 5x + 6$.
  pasos:
  - 'Paso 1: Identificar el valor $a$ asociado al factor $(x + 3)$: Como $x - a =
    x + 3 \implies a = -3$.'
  - 'Paso 2: Evaluar $P(x)$ en $a = -3$: $P(-3) = (-3)^3 + 2(-3)^2 - 5(-3) + 6$.'
  - 'Paso 3: Resolver: $P(-3) = -27 + 2(9) + 15 + 6 = -27 + 18 + 15 + 6 = 12$.'
  - 'Paso 4: Concluir: Puesto que $P(-3) = 12 \neq 0$, por el Teorema del Factor el
    binomio $(x + 3)$ NO es factor de $P(x)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $P(4) = 0$, ¿cuál de los siguientes binomios es necesariamente un factor
    de $P(x)$?
  choices:
  - text: $(x - 4)$
    is_correct: true
  - text: $(x + 4)$
    is_correct: false
  - text: $(4x - 1)$
    is_correct: false
  - text: $(x^2 - 16)$
    is_correct: false
  explanation: Por el Teorema del Factor, $P(a) = 0 \implies (x - a)$ es factor. Con
    $a = 4$, el binomio resultante es $(x - 4)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $(x + 2)$ es un factor de $P(x) = x^3 - kx + 6$, ¿cuál es el valor
    de la constante $k$?
  choices:
  - text: $k = 1$
    is_correct: true
  - text: $k = -1$
    is_correct: false
  - text: $k = 7$
    is_correct: false
  - text: $k = 5$
    is_correct: false
  explanation: Si $(x + 2)$ es factor, $P(-2) = 0 \implies (-2)^3 - k(-2) + 6 = 0
    \implies -8 + 2k + 6 = 0 \implies 2k = 2 \implies k = 1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar la raíz candidata $a$ igualando el binomio factor a cero: $x
  - a = 0 \implies x = a$.'
- 'Paso 2: Evaluar el polinomio $P(x)$ en $x = a$.'
- 'Paso 3: Verificar si el residuo $P(a)$ resulta exactamente cero.'
- 'Paso 4: Afirmar que $(x - a)$ es un factor lineal si $P(a) = 0$.'
errores_correccion: '- **Error 1: Invertir el signo del número $a$ al evaluar.** **Cómo
  corregirlo:** Si el factor es $(x - 5)$, evaluar en $+5$. Si el factor es $(x +
  5)$, evaluar en $-5$.'
ejemplos:
- titulo: Comprobación de factor lineal en polinomio cuadrático
  enunciado: Verifique si $(x - 2)$ es factor de $P(x) = x^2 - 5x + 6$.
  respuesta: Sí, $(x - 2)$ es un factor.
  solucion_pasos:
  - 1. $P(2) = 2^2 - 5(2) + 6 = 4 - 10 + 6 = 0$.
  - 2. Como $P(2) = 0$, el binomio $(x - 2)$ es un factor lineal de $P(x)$.
- titulo: ¿Si $P(1) = 5$, entonces $(x - 1)$ divide exactamente a $P(x)$?
  respuesta: 'No'
  solucion_pasos:
  - No, la división deja un resto $R = 5$, por lo que no es una división exacta y
    no es factor.
- titulo: ¿El binomio $(x + 1)$ es factor de $x^4 - 1$?
  respuesta: Sí
  solucion_pasos:
  - $P(-1) = (-1)^4 - 1 = 1 - 1 = 0$. Por lo tanto, $(x + 1)$ es factor de $x^4 -
    1$.
errores_frecuentes:
- Inversión de signos en la constante al pasar de la raíz $a$ al binomio divisor $(x
  - a)$.
- Aceptación de un binomio como factor cuando el resto de la evaluación difiere de
  cero.
- Sustitución del valor del coeficiente principal en lugar de la raíz del divisor
  lineal.
- Mezcla entre la condición de división exacta $P(a) = 0$ y la evaluación en el origen
  $P(0) = a$.
- Selección de binomios lineales sin realizar el procedimiento formal de evaluación.
afirmaciones_verdaderas:
- $(x - a)$ es un factor de $P(x)$ si y solo si $P(a) = 0$.
- Si $(x - a)$ es factor de $P(x)$, la división de $P(x)$ por $(x - a)$ tiene resto
  cero.
al_terminar_debes_poder: Al terminar serás capaz de aplicar el Teorema del Factor
  para probar si un binomio es factor de un polinomio o hallar coeficientes desconocidos.
