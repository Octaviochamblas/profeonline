semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_GRAFICA
resumen_inicial: La simetría gráfica entre una función $f$ y su inversa $f^{-1}$ se manifiesta como una reflexión especular respecto a la recta identidad $y = x$.
explicacion_simple: |
  Si colocas un **espejo sobre la recta diagonal $y = x$**:

  - La gráfica de $f$ se refleja exactamente en la gráfica de $f^{-1}$.
  - Si un punto $(a, b)$ pertenece a la función $f$, el punto con las coordenadas invertidas **$(b, a)$** pertenece a la función inversa $f^{-1}$.
  - La recta $y = x$ actúa como el eje de simetría de ambas curvas.
explicacion_formal: |
  Sea $f: A \to B$ una función biyectiva y $f^{-1}: B \to A$ su inversa. El conjunto gráfico de la función inversa satisface la transformación isométrica de reflexión cartesiana:

  $$\text{Graf}(f^{-1}) = \{(y, x) \in \mathbb{R}^2 \mid (x, y) \in \text{Graf}(f)\}$$

  **Operador de reflexión axial:**
  - La matriz de transformación de la reflexión respecto a la recta bisectriz $y = x$ es $R = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, la cual mapped $(x, y)^T \mapsto (y, x)^T$.
definiciones_clave: |
  - **Simetría respecto a $y = x$**: Propiedad geométrica según la cual las gráficas de $f$ y $f^{-1}$ son imágenes especulares una de la otra a través de la bisectriz del 1.er y 3.er cuadrante.
propiedades_relaciones: |
  - **Intersección sobre la diagonal**: Si las gráficas de $f$ y $f^{-1}$ se cruzan en un punto $(x_0, y_0)$, dicho punto se ubica necesariamente sobre la recta $y = x$ (es decir $x_0 = y_0$).
ejemplo_guiado:
  enunciado: 'Dada la función $f(x) = 2x + 4$ que pasa por el punto $(1, 6)$, encuentra las coordenadas del punto correspondiente en $f^{-1}(x)$ y verifica la recta de simetría.'
  pasos:
    - 'Paso 1: Identificar el punto de $f$: $(1, 6) \in \text{Graf}(f)$.'
    - 'Paso 2: Invertir las coordenadas para hallar el punto de $f^{-1}$: $(6, 1) \in \text{Graf}(f^{-1})$.'
    - 'Paso 3: Calcular la función inversa: $y = 2x + 4 \implies f^{-1}(x) = \frac{x - 4}{2}$.'
    - 'Paso 4: Evaluar $f^{-1}(6) = \frac{6 - 4}{2} = \frac{2}{2} = 1$, confirmando el punto $(6, 1)$ reflejado respecto a $y = x$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si el punto $(1, 6)$ pertenece a la gráfica de $f$, ¿qué punto pertenece obligatoriamente a la gráfica de $f^{-1}$?'
    choices:
      - {text: 'El punto $(6, 1)$.', is_correct: true}
      - {text: 'El punto $(-1, -6)$.', is_correct: false}
      - {text: 'El punto $(1, -6)$.', is_correct: false}
      - {text: 'El punto $(-6, 1)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto $(6, 1)$.''. Si $(a, b) \in f \implies (b, a) \in f^{-1}$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Respecto a qué recta del plano cartesiano son simétricas las gráficas de una función y su inversa?'
    choices:
      - {text: 'Respecto a la recta identidad $y = x$.', is_correct: true}
      - {text: 'Respecto al eje horizontal $X$.', is_correct: false}
      - {text: 'Respecto al eje vertical $Y$.', is_correct: false}
      - {text: 'Respecto a la recta $y = -x$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Respecto a la recta identidad $y = x$.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Trazar la recta de referencia $y = x$ (bisectriz a $45^\circ$).'
  - 'Paso 2: Seleccionar puntos clave $(x_i, y_i)$ de la gráfica de $f$.'
  - 'Paso 3: Intercambiar las coordenadas a $(y_i, x_i)$ para ubicar los puntos reflejados de $f^{-1}$.'
  - 'Paso 4: Unir los puntos reflejados verificando la simetría especular con respecto a $y = x$.'
errores_correccion: |
  - **Error común:** Reflejar la gráfica respecto al eje horizontal $X$ o vertical $Y$ en lugar de la recta diagonal $y = x$.
  - **Cómo corregirlo:** El espejo simétrico de la función inversa es SIEMPRE la **RECTA DIAGONAL $y = x$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función inversa.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función inversa.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La gráfica de la función inversa $f^{-1}$ se obtiene reflejando la gráfica de $f$ respecto al eje horizontal $X$.'
  - 'Si el punto $(2, 7)$ pertenece a la gráfica de $f(x)$, el punto correspondiente en $f^{-1}(x)$ es $(-2, -7)$.'
  - 'Las gráficas de una función y su inversa son paralelas de forma obligatoria.'
  - 'El eje de simetría de la función inversa es la recta vertical $x = 0$.'
  - 'Reflejar una gráfica respecto a la recta $y = x$ altera la pendiente de la función afín convirtiéndola en cuadrática.'
afirmaciones_verdaderas:
  - 'Las gráficas de una función biyectiva $f$ y su función inversa $f^{-1}$ son simétricas entre sí con respecto a la recta identidad $y = x$.'
  - 'Para todo punto $(a, b)$ perteneciente a la gráfica de $f$, el punto reflejado $(b, a)$ pertenece a la gráfica de $f^{-1}$.'
al_terminar_debes_poder: |
  QUÉ: Interpretar y construir la simetría gráfica entre una función y su inversa en el plano cartesiano.
  CÓMO: Reflejar los puntos $(x, y) \mapsto (y, x)$ respecto a la recta $y = x$ y verificar la simetría axial.
