semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_GRAFICA
resumen_inicial: 'Interpretación de la simetría gráfica entre una función y su inversa:
  conceptos, representación y propiedades en Tipos de funciones y función inversa.'
explicacion_simple: Existe un espejo matemático especial, la recta $y=x$, y la gráfica
  de la función inversa es exactamente el reflejo de la función original en ese espejo.
explicacion_formal: '### Definición formal


  Si $f(a)=b$, entonces $f^{-1}(b)=a$ por definición de función inversa. Geométricamente,
  el punto $(a,b)$ de la gráfica de $f$ tiene su punto simétrico $(b,a)$ en la gráfica
  de $f^{-1}$, siendo la recta $y=x$ el eje de esa simetría.


  ### Desarrollo didáctico


  Para dibujar rápidamente la gráfica de $f^{-1}$ a partir de la de $f$, basta con
  reflejar cada punto respecto a la diagonal $y=x$: intercambiar sus coordenadas.


  Si $f$ pasa por $(2,7)$, entonces $f^{-1}$ pasa por $(7,2)$. Si se dibuja la recta
  $y=x$ como referencia, ambas gráficas aparecen como reflejos una de la otra.'
definiciones_clave: '- **Interpretación de la simetría gráfica entre una función y
  su inversa**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de la simetría gráfica entre
  una función y su inversa.'
