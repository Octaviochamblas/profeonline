procedimiento:
- 'Paso 1: Identifica varios puntos de la gráfica de $f$.'
- 'Paso 2: Intercambia las coordenadas de cada punto para obtener los puntos correspondientes
  de $f^{-1}$.'
- 'Paso 3: Grafica esos nuevos puntos y traza la curva de $f^{-1}$.'
- 'Paso 4: Verifica que ambas gráficas sean simétricas respecto a la recta $y=x$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar interpretación de la simetría gráfica entre una función y su inversa.
ejemplos:
- titulo: Determinación de un punto de la inversa por simetría
  enunciado: Si la gráfica de $f$ pasa por $(3,10)$, determina un punto de la gráfica
    de $f^{-1}$.
  solucion_pasos:
  - Se intercambian las coordenadas del punto.
  - $f^{-1}$ pasa por $(10,3)$.
- titulo: Reconocimiento de simetría en la función identidad
  enunciado: ¿Qué ocurre con la gráfica de $f(x)=x$ (identidad) respecto a su inversa?
  solucion_pasos:
  - La identidad es su propia inversa, $f^{-1}(x)=x$.
  - Su gráfica coincide exactamente consigo misma, siendo simétrica respecto a $y=x$
    trivialmente.
- titulo: ¿Si $(a,b)$ pertenece a la gráfica de $f$, entonces $(b,a)$ pertenece a
    la gráfica de $f^{-1}$?
  enunciado: ¿Si $(a,b)$ pertenece a la gráfica de $f$, entonces $(b,a)$ pertenece
    a la gráfica de $f^{-1}$?
  respuesta: Sí
  solucion_pasos:
  - Es la traducción geométrica directa de la relación $f(a)=b \iff f^{-1}(b)=a$.
- titulo: ¿La recta de simetría entre una función y su inversa es siempre $y=x$?
  enunciado: ¿La recta de simetría entre una función y su inversa es siempre $y=x$?
  respuesta: Sí
  solucion_pasos:
  - Esa es la recta identidad, eje de simetría constante para toda función y su inversa.
errores_frecuentes:
- Confundir la simetría respecto a $y=x$ con la simetría respecto al eje $x$ o al
  eje $y$.
- Olvidar intercambiar ambas coordenadas al construir un punto de la inversa.
- Creer que toda función y su inversa se cruzan necesariamente en algún punto.
- Suponer que la simetría aplica solo a funciones lineales.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando interpretación
