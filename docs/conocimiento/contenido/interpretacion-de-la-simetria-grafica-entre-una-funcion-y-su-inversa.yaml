semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_GRAFICA
resumen_inicial: Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas
  respecto a la recta bisectriz del primer cuadrante $y = x$.
explicacion_simple: 'Existe una propiedad geométrica maravillosa entre una función
  y su inversa:

  - Si doblas el plano cartesiano a lo largo de la **línea diagonal $y = x$** (la
  recta a $45^\circ$):

  - La gráfica de $f(x)$ coincide EXACTAMENTE sobre la gráfica de $f^{-1}(x)$.

  - Si $f$ pasa por el punto $(a, b)$, la inversa $f^{-1}$ pasa por el punto reflejado
  $(b, a)$.'
explicacion_formal: 'Dada la gráfica $G(f) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x)\}$,
  la gráfica de su inversa es la reflexión especular respecto a la recta $y = x$:


  $$G(f^{-1}) = \{(y, x) \in \mathbb{R}^2 \mid (x, y) \in G(f)\} = R_{y=x}(G(f))$$


  **Desglose de la fórmula:**

  - Isometría de reflexión donde la matriz de transformación intercambia los componentes
  $(x, y) \mapsto (y, x)$.'
definiciones_clave: '- **Simetría axial respecto a $y = x$**: Propiedad geométrica
  donde la recta $y = x$ actúa como un espejo plano entre $f$ y $f^{-1}$.'
propiedades_relaciones: '- **Intersecciones sobre $y = x$**: Los puntos donde la gráfica
  de $f$ se cruza con su inversa $f^{-1}$ se ubican obligatoriamente sobre la recta
  $y = x$.'
ejemplo_guiado:
  enunciado: La gráfica de una función $f(x)$ pasa por los puntos $(0, 3)$ y $(2,
    7)$. Determina dos puntos por los cuales pasa la gráfica de su inversa $f^{-1}(x)$.
  pasos:
  - 'Paso 1: Recordar la propiedad de intercambio de componentes: si $(x, y) \in f
    \implies (y, x) \in f^{-1}$.Paso 2: Reflejar el primer punto $(0, 3) \implies$
    la inversa pasa por $(3, 0)$.Paso 3: Reflejar el segundo punto $(2, 7) \implies$
    la inversa pasa por $(7, 2)$.Paso 4: Concluir que los puntos reflejados sobre
    la diagonal $y = x$ son $(3, 0)$ y $(7, 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la gráfica de la función $f$ pasa por el punto $(2, 7)$, ¿por qué punto
    pasa obligatoriamente la gráfica de su inversa $f^{-1}$?
  choices:
  - text: Por el punto reflejado $(7, 2)$.
    is_correct: true
  - text: Por el punto $(-2, -7)$.
    is_correct: false
  - text: Por el punto $(2, -7)$.
    is_correct: false
  - text: Por el origen $(0,0)$.
    is_correct: false
  explanation: La alternativa correcta es 'Por el punto reflejado $(7, 2)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Respecto a qué recta del plano cartesiano son simétricas la gráfica de
    una función y la gráfica de su inversa?
  choices:
  - text: Respecto a la recta bisectriz $y = x$.
    is_correct: true
  - text: Respecto al eje horizontal X.
    is_correct: false
  - text: Respecto al eje vertical Y.
    is_correct: false
  - text: Respecto a la recta $y = -x$.
    is_correct: false
  explanation: La alternativa correcta es 'Respecto a la recta bisectriz $y = x$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar la recta de referencia $y = x$ en el plano.'
- 'Paso 2: Tomar pares ordenados clave $(x, y)$ de la función original.'
- 'Paso 3: Intercambiar las coordenadas para obtener los puntos $(y, x)$ de la inversa.'
- 'Paso 4: Trazar la gráfica curva o recta inversa reflejada.'
errores_correccion: '- **Error común:** Creer que la gráfica de la inversa se obtiene
  reflejando respecto al eje $X$ o al eje $Y$.

  - **Cómo corregirlo:** La reflexión es especular únicamente respecto a la recta
  diagonal a $45^\circ$ ($y = x$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
