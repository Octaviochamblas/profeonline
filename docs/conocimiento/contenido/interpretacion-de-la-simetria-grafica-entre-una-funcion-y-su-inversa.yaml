semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_GRAFICA
resumen_inicial: Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas entre sí respecto a la recta identidad $y = x$, actuando esta como un eje de reflexión especular.
explicacion_simple: "![Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas entre sí respecto a la recta identidad $y = x$, actuando esta como un eje de reflexión especular](/static/img/nodos/interpretacion-de-la-simetria-grafica-entre-una-funcion-y-su-inversa-intro.svg)\n\n\nSi dibujas una función $f$ y su inversa $f^{-1}$ en el mismo plano cartesiano:\n- Traza la **recta diagonal $y = x$** (la bisectriz del primer y tercer cuadrante).\n- Esa recta funciona como un **espejo perfecto**:\n  - Si doblas el papel por la línea $y = x$, la curva de $f$ cae exactamente encima de la curva de $f^{-1}$.\n  - Cada punto $(a, b)$ de la función original se refleja en el punto $(b, a)$ de la inversa.\n  - Si se cortan, **siempre se cortan sobre la recta $y = x$**."
explicacion_formal: 'Sea $f: A \to B$ una biyección real y $\text{Graf}(f) = \{(x, f(x)) \in \mathbb{R}^2 \mid x \in A\}$. La gráfica de la función inversa $f^{-1}$ es la imagen de $\text{Graf}(f)$ bajo la **reflexión ortogonal isométrica** $\mathcal{R}_{y = x}$:

  $$\text{Graf}(f^{-1}) = \mathcal{R}_{y = x}(\text{Graf}(f)) = \{(y, x) \in \mathbb{R}^2 \mid (x, y) \in \text{Graf}(f)\}$$


  **Propiedades geométricas fundamentales:**

  - **Eje de simetría axial**: La recta $y = x$ es la mediatriz del segmento que une cualquier par de puntos homólogos $(a, b)$ y $(b, a)$.

  - **Puntos fijos / Intersecciones**: Si $f$ y $f^{-1}$ se intersectan en un punto $(x_0, y_0)$, entonces $x_0 = y_0$, es decir, el cruce ocurre sobre la recta $y = x$ ($f(x_0) = x_0$).

  - **Pendientes ortogonales en el cruce**: En funciones afines, si una tiene pendiente $m$, la otra tiene pendiente $\frac{1}{m}$.'
definiciones_clave: '- **Simetría axial respecto a $y = x$**: Transformación del plano que intercambia las coordenadas cartesianas $(x, y) \leftrightarrow (y, x)$.

  - **Recta identidad $y = x$**: Bisectriz principal del plano cartesiano que actúa como eje especular.'
propiedades_relaciones: '- **Intercambio de cortes con los ejes**: Si $f$ corta al eje $Y$ en $(0, n)$, entonces $f^{-1}$ corta al eje $X$ en $(n, 0)$.

  - **Preservación de monotonía**: Si $f$ es creciente, $f^{-1}$ también es creciente.'
ejemplo_guiado:
  enunciado: '![Ejemplo Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas entre sí respecto a la recta identidad $y = x$, actuando esta como un eje de reflexión especular](/static/img/nodos/interpretacion-de-la-simetria-grafica-entre-una-funcion-y-su-inversa-ejemplos.svg)



    Dada la función afín $f(x) = 2x - 3$:

    1) Halla su inversa $f^{-1}(x)$.

    2) Determina los puntos de corte con los ejes de ambas funciones.

    3) Encuentra el punto de intersección entre $f$ y $f^{-1}$ y comprueba que pertenece a $y = x$.'
  pasos:
  - 'Paso 1: Calcular la inversa: $y = 2x - 3 \implies x = \frac{y + 3}{2} \implies f^{-1}(x) = \frac{1}{2}x + \frac{3}{2}$.'
  - 'Paso 2: Cortes de $f$: con eje Y en $(0, -3)$ y con eje X en $(1.5, 0)$.'
  - 'Paso 3: Cortes de $f^{-1}$: con eje Y en $(0, 1.5)$ y con eje X en $(-3, 0)$ (pares exactamente invertidos).'
  - 'Paso 4: Igualar $f(x) = x \implies 2x - 3 = x \implies x = 3$.'
  - 'Paso 5: Concluir que ambas rectas se cruzan en el punto $(3, 3)$, el cual está situado sobre la recta de simetría $y = x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el eje de simetría axial entre la gráfica de una función f y la de su inversa f^(-1)?
  choices:
  - text: La recta identidad y = x.
    is_correct: true
  - text: El eje vertical Y (x = 0).
    is_correct: false
  - text: El eje horizontal X (y = 0).
    is_correct: false
  - text: La recta y = -x.
    is_correct: false
  explanation: La alternativa correcta es 'La recta identidad y = x.'. Es el espejo natural que intercambia $(x, y)$ con $(y, x)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la gráfica de $f$ pasa por el punto $(-4, 7)$, ¿por qué punto pasa obligatoriamente la gráfica de $f^{-1}$?
  choices:
  - text: (7, -4)
    is_correct: true
  - text: (-4, 7)
    is_correct: false
  - text: (-7, 4)
    is_correct: false
  - text: (4, -7)
    is_correct: false
  explanation: La alternativa correcta es '(7, -4)'. Por simetría respecto a $y = x$, $(a, b) \to (b, a)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar en el plano la recta diagonal identidad $y = x$.'
- 'Paso 2: Identificar puntos clave de la gráfica de $f$ (cortes con los ejes, vértices, etc.).'
- 'Paso 3: Reflejar cada punto $(a, b)$ en el punto $(b, a)$ trazando perpendiculares a la recta $y = x$.'
- 'Paso 4: Unir los puntos reflejados para construir la gráfica de $f^{-1}$.'
errores_correccion: '- **Error común:** Reflejar la gráfica respecto al eje X o al eje Y en lugar de hacerlo respecto a la diagonal $y = x$.

  - **Cómo corregirlo:** La simetría de la función inversa es **estrictamente respecto a la recta diagonal $y = x$**.'
ejemplos:
- titulo: 'Ejemplo 1: Reflejo de cortes coordenados'
  enunciado: Si $f$ corta al eje Y en $(0, 6)$, ¿en qué punto corta $f^{-1}$ al eje X?
  alternativas:
  - (6, 0)
  - (0, 6)
  - (-6, 0)
  - (0, -6)
  respuesta: (6, 0)
  solucion_pasos:
  - 'Paso 1: El punto $(0, 6)$ se refleja en $(6, 0)$ sobre el eje X.'
- titulo: 'Ejemplo 2: Intersección con el eje de simetría'
  enunciado: Si $f(x) = 3x - 8$, ¿en qué punto se cortan $f$ y $f^{-1}$?
  alternativas:
  - (4, 4)
  - (8, 8)
  - (3, 3)
  - (0, 0)
  respuesta: (4, 4)
  solucion_pasos:
  - 'Paso 1: $3x - 8 = x \implies 2x = 8 \implies x = 4 \implies (4, 4)$.'
- titulo: 'Ejemplo 3: Pendientes simétricas'
  enunciado: Si una recta afín tiene pendiente $m = 4$, ¿cuál es la pendiente de su recta simétrica inversa?
  alternativas:
  - 1/4
  - '-4'
  - -1/4
  - '4'
  respuesta: 1/4
  solucion_pasos:
  - 'Paso 1: La pendiente de la inversa es el recíproco $m_{\text{inv}} = \frac{1}{4}$.'
- titulo: 'Ejemplo 4: Comportamiento creciente'
  enunciado: Si $f$ es una función estrictamente creciente, ¿cómo es la gráfica de $f^{-1}$?
  alternativas:
  - También es estrictamente creciente
  - Es estrictamente decreciente
  - Es constante
  - Depende del intercepto
  respuesta: También es estrictamente creciente
  solucion_pasos:
  - 'Paso 1: La reflexión respecto a $y = x$ conserva el sentido de crecimiento.'
errores_frecuentes:
- Reflejar respecto a los ejes coordenados en vez de y = x.
- Olvidar que las intersecciones entre f y f^(-1) ocurren sobre y = x.
- Invertir solo el signo de las coordenadas en vez de intercambiar su orden.
afirmaciones_verdaderas:
- Las gráficas de f y f^(-1) son reflexiones especulares mutuas respecto a la recta y = x.
- Si (a, b) pertenece a la gráfica de f, el punto (b, a) pertenece a la gráfica de f^(-1).
al_terminar_debes_poder: '**QUÉ:** Interpretar y construir la simetría gráfica entre una función y su inversa.


  **CÓMO:** Utilizando la recta identidad y = x como eje de reflexión axial e intercambiando las coordenadas (a, b) ⟷ (b, a).


  ![Resumen Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas entre sí respecto a la recta identidad $y = x$, actuando esta como un eje de reflexión especular](/static/img/nodos/interpretacion-de-la-simetria-grafica-entre-una-funcion-y-su-inversa-resumen.svg)'
