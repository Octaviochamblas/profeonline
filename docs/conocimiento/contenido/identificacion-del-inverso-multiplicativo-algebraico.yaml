procedimiento:
- 'Paso 1: Toma el numerador de la fracción original y ponlo en el denominador.'
- 'Paso 2: Toma el denominador de la original y ponlo en el numerador.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en identificación del inverso multiplicativo algebraico.
ejemplos:
- titulo: Encuentra el recíproco de $\frac{a^2 + b^2}{2ab}$
  enunciado: Encuentra el recíproco de $\frac{a^2 + b^2}{2ab}$.
  solucion_pasos:
  - El denominador $2ab$ sube.
  - El numerador $a^2+b^2$ baja.
  - 'Recíproco: $\frac{2ab}{a^2+b^2}$.'
- titulo: ¿Cuál es el inverso multiplicativo de $3x+2$?
  solucion_pasos:
  - Imaginamos (3x+2)/1 y le damos la vuelta.
- titulo: 'Respecto de «Identificación del inverso multiplicativo algebraico»: ¿La
    siguiente formulació'
  enunciado: 'Respecto de «Identificación del inverso multiplicativo algebraico»:
    ¿La siguiente formulación es correcta? «El inverso multiplicativo o recíproco
    de una fracción $\frac{A}{B}$ es $\frac{B}{A}$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El inverso multiplicativo o
    recíproco de una fracción $\frac{A}{B}$ es $\frac{B}{A}$.'
- titulo: 'Respecto de «Identificación del inverso multiplicativo algebraico»: ¿La
    siguiente conclusión'
  enunciado: 'Respecto de «Identificación del inverso multiplicativo algebraico»:
    ¿La siguiente conclusión es correcta? «Cambiar los signos en lugar de voltear
    la fracción (confundir inverso multiplicativo con inverso aditivo)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El inverso multiplicativo o
    recíproco de una fracción $\frac{A}{B}$ es $\frac{B}{A}$.'
errores_frecuentes:
- Cambiar los signos en lugar de voltear la fracción (confundir inverso multiplicativo
  con inverso aditivo).
- Para «¿Cuál es la característica principal que define al recíproco de una fracción»,
  la respuesta correcta es Cambia de positivo a negativo.
- Es la misma fracción pero factorizada.
- Para «¿Cuál es la característica principal que define al recíproco de una fracción»,
  la respuesta correcta es El producto es 0.
- $-\frac{1}{x-3}$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando identificación
  del inverso multiplicativo algebraico.
