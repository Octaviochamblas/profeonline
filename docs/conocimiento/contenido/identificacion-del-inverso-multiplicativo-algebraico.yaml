semantic_id: MAT.ALG.FRACCIONES_DIV.INVERSO_MULTIPLICATIVO
resumen_inicial: El inverso multiplicativo o recíproco de una fracción algebraica
  es la expresión obtenida al intercambiar su numerador y su denominador.
explicacion_simple: 'El inverso multiplicativo (o recíproco) de una fracción algebraica
  es simplemente dar vuelta la fracción: el numerador pasa al lugar del denominador
  y el denominador pasa al lugar del numerador.

  Cualquier expresión multiplicada por su inverso multiplicativo da como resultado
  exacto 1.

  Esta propiedad es la herramienta clave que nos permite convertir una división de
  fracciones algebraicas en una multiplicación.'
explicacion_formal: 'Dada una fracción algebraica no nula $F(x) = \frac{P(x)}{Q(x)}$
  con $P(x) \neq 0$ y $Q(x) \neq 0$, su **inverso multiplicativo** $F^{-1}(x)$ se
  define como:


  $$F^{-1}(x) = \frac{Q(x)}{P(x)} \quad \text{tal que} \quad F(x) \cdot F^{-1}(x)
  = \frac{P(x)}{Q(x)} \cdot \frac{Q(x)}{P(x)} = 1$$


  **Desglose de la fórmula:**

  - $\frac{Q(x)}{P(x)}$: Fracción recíproca donde se han permutado el dividendo y
  el divisor.

  - $P(x) \neq 0 \land Q(x) \neq 0$: Exige que ambos polinomios sean no nulos para
  garantizar la existencia de la fracción recíproca.'
definiciones_clave: '- **Inverso multiplicativo (recíproco)**: Fracción $\frac{Q(x)}{P(x)}$
  cuyo producto con la fracción original $\frac{P(x)}{Q(x)}$ es igual a 1.

  - **Permutación de términos**: Intercambio de posiciones entre el numerador y el
  denominador de una fracción.'
propiedades_relaciones: '- **Doble inverso**: El inverso multiplicativo del inverso
  multiplicativo devuelve la fracción original: $(F^{-1})^{-1} = F$.

  - **Restricción extendida**: El dominio del recíproco exige restringir tanto los
  ceros de $Q(x)$ como los ceros de $P(x)$.'
ejemplo_guiado:
  enunciado: Determina el inverso multiplicativo de la fracción algebraica $F(x) =
    \frac{3x - 6}{x + 4}$, verifica que su producto es igual a 1 y evalúa el recíproco
    para $x = 5$.
  pasos:
  - 'Paso 1: Intercambiar el numerador $3x - 6$ y el denominador $x + 4$. El inverso
    multiplicativo es $F^{-1}(x) = \frac{x + 4}{3x - 6}$.Paso 2: Comprobar el producto:
    $\frac{3x - 6}{x + 4} \cdot \frac{x + 4}{3x - 6} = 1$ para $x \neq 2$ y $x \neq
    -4$.Paso 3: Sustituir $x = 5$ en el inverso multiplicativo: $F^{-1}(5) = \frac{5
    + 4}{3(5) - 6} = \frac{9}{15 - 6} = \frac{9}{9} = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el inverso multiplicativo de la fracción algebraica $\frac{P(x)}{Q(x)}$
    para $P(x) \neq 0$ y $Q(x) \neq 0$?
  choices:
  - text: $\frac{Q(x)}{P(x)}$
    is_correct: true
  - text: $-\frac{P(x)}{Q(x)}$
    is_correct: false
  - text: $-\frac{Q(x)}{P(x)}$
    is_correct: false
  - text: $\frac{1}{P(x) \cdot Q(x)}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{Q(x)}{P(x)}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al hallar el inverso multiplicativo de $\frac{3x - 6}{x + 4}$ y evaluarlo
    en $x = 5$, ¿cuál es el resultado obtenido?
  choices:
  - text: $1$
    is_correct: true
  - text: $\frac{9}{19}$
    is_correct: false
  - text: $\frac{1}{9}$
    is_correct: false
  - text: $9$
    is_correct: false
  explanation: La alternativa correcta es '$1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador $P(x)$ y el denominador $Q(x)$ de la fracción
  dada.'
- 'Paso 2: Colocar el polinomio $Q(x)$ en la posición del numerador.'
- 'Paso 3: Colocar el polinomio $P(x)$ en la posición del denominador.'
- 'Paso 4: Declarar las restricciones asociadas a las soluciones de $P(x) = 0$ y $Q(x)
  = 0$.'
errores_correccion: '- **Error común:** Confundir el inverso multiplicativo (dar vuelta
  la fracción) con el opuesto aditivo (cambiar el signo menos).

  - **Cómo corregirlo:** El recíproco de $\frac{A}{B}$ es $\frac{B}{A}$ (mismo signo,
  términos invertidos). El opuesto aditivo es $-\frac{A}{B}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de división.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de división.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se invierte la segunda fracción al dividir?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla estándar.
- titulo: ¿La división de fracciones es conmutativa?
  respuesta: 'No'
  solucion_pasos:
  - No, el orden de las fracciones altera el resultado.
errores_frecuentes:
- Invertir la primera fracción en lugar de la segunda al dividir.
- Cambiar de signo los términos en vez de permutar numerador y denominador.
- Olvidar restringir del dominio los ceros del segundo numerador.
- Multiplicar en cruz las fracciones habiendo invertido previamente el divisor.
- Desarrollar productos de polinomios antes de factorizar.
afirmaciones_verdaderas:
- La división de fracciones algebraicas equivale a multiplicar la primera fracción
  por el inverso de la segunda.
- El dominio de una división de fracciones excluye los ceros del primer denominador,
  segundo denominador y segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver divisiones de fracciones
  algebraicas mediante la inversión del divisor y simplificación del cociente.
