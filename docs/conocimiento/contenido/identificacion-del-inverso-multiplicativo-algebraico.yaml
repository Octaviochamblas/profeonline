semantic_id: MAT.ALG.FRACCIONES_DIV.INVERSO_MULTIPLICATIVO
resumen_inicial: El inverso multiplicativo o recíproco de una fracción algebraica es la expresión obtenida al intercambiar
  su numerador y su denominador.
explicacion_simple: 'El **inverso multiplicativo** (o recíproco) de una fracción algebraica consiste en intercambiar sus posiciones:
  el numerador pasa al denominador y el denominador pasa al numerador.


  Cualquier fracción algebraica no nula multiplicada por su recíproco da como resultado exacto 1.


  Esta propiedad es el mecanismo fundamental para convertir la división de fracciones algebraicas en una multiplicación directa
  por el recíproco del divisor.


  ![Identificación del inverso multiplicativo algebraico](/static/img/nodos/identificacion-del-inverso-multiplicativo-algebraico-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada una fracción algebraica no nula $F(x) = \frac{P(x)}{Q(x)}$ con $P(x) \neq 0$ y $Q(x) \neq 0$, su **inverso multiplicativo**
  $F^{-1}(x)$ se define como:


  $$F^{-1}(x) = \frac{Q(x)}{P(x)} \quad \text{tal que} \quad F(x) \cdot F^{-1}(x) = \frac{P(x)}{Q(x)} \cdot \frac{Q(x)}{P(x)}
  = 1$$


  ### Desglose de la fórmula

  - $\frac{Q(x)}{P(x)}$: Fracción recíproca donde se han permutado el dividendo y el divisor.

  - $P(x) \neq 0 \land Q(x) \neq 0$: Exige que ambos polinomios sean no nulos para garantizar la existencia de la fracción
  recíproca.


  ### Síntesis didáctica

  El recíproco intercambia el numerador y el denominador conservando los signos originales, garantizando un producto igual
  a 1.

  '
definiciones_clave: '- **Inverso multiplicativo (recíproco)**: Fracción $\frac{Q(x)}{P(x)}$ cuyo producto con la fracción
  original $\frac{P(x)}{Q(x)}$ es igual a 1.

  - **Permutación de términos**: Intercambio de posiciones entre el numerador y el denominador de una fracción.

  '
propiedades_relaciones: '- **Doble inverso**: El inverso multiplicativo del inverso multiplicativo devuelve la fracción original:
  $(F^{-1})^{-1} = F$.

  - **Restricción extendida**: El dominio del recíproco exige restringir tanto los ceros de $Q(x)$ como los ceros de $P(x)$.

  '
ejemplo_guiado:
  enunciado: Determina el inverso multiplicativo de la fracción algebraica $F(x) = \frac{3x - 6}{x + 4}$ y evalúa el recíproco
    para $x = 5$.
  pasos:
  - 'Paso 1: Intercambiar el numerador $3x - 6$ y el denominador $x + 4$. El inverso multiplicativo es $F^{-1}(x) = \frac{x
    + 4}{3x - 6}$.'
  - 'Paso 2: Comprobar el producto: $\frac{3x - 6}{x + 4} \cdot \frac{x + 4}{3x - 6} = 1$ para $x \neq 2$ y $x \neq -4$.'
  - 'Paso 3: Sustituir $x = 5$ en el inverso multiplicativo: $F^{-1}(5) = \frac{5 + 4}{3(5) - 6} = \frac{9}{15 - 6} = \frac{9}{9}
    = 1$.'
  imagen: /static/img/nodos/identificacion-del-inverso-multiplicativo-algebraico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el inverso multiplicativo de la fracción algebraica $\frac{P(x)}{Q(x)}$ para $P(x) \neq 0$ y $Q(x) \neq
    0$?
  choices:
  - text: $\frac{Q(x)}{P(x)}$
    is_correct: true
  - text: $-\frac{P(x)}{Q(x)}$
    is_correct: false
  - text: $-\frac{Q(x)}{P(x)}$
    is_correct: false
  - text: $\frac{1}{P(x) \cdot Q(x)}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{Q(x)}{P(x)}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al hallar el inverso multiplicativo de $\frac{3x - 6}{x + 4}$ y evaluarlo en $x = 5$, ¿cuál es el resultado obtenido?
  choices:
  - text: $1$
    is_correct: true
  - text: $\frac{9}{19}$
    is_correct: false
  - text: $\frac{1}{9}$
    is_correct: false
  - text: $9$
    is_correct: false
  explanation: La alternativa correcta es '$1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador $P(x)$ y el denominador $Q(x)$ de la fracción dada.'
- 'Paso 2: Colocar el polinomio $Q(x)$ en la posición del numerador.'
- 'Paso 3: Colocar el polinomio $P(x)$ en la posición del denominador.'
- 'Paso 4: Declarar las restricciones asociadas a las soluciones de $P(x) = 0$ y $Q(x) = 0$.'
errores_correccion: '- **Error 1:** Cambiar el signo de la fracción al buscar el inverso multiplicativo (escribir $-\frac{A}{B}$
  en lugar de $\frac{B}{A}$). **Cómo corregirlo:** El recíproco mantiene el signo exacto de la fracción original y solo **INTERCAMBIA
  EL NUMERADOR CON EL DENOMINADOR**.

  - **Error 2:** Invertir únicamente los términos constantes de los polinomios conservando las variables en su posición original.
  **Cómo corregirlo:** Se debe **PERMUTAR EL POLINOMIO COMPLETO DEL NUMERADOR CON EL POLINOMIO COMPLETO DEL DENOMINADOR**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el inverso multiplicativo de la fracción $\frac{2x^2}{x - 3}$?
  alternativas:
  - $\frac{x - 3}{2x^2}$
  - $-\frac{2x^2}{x - 3}$
  - $\frac{3 - x}{2x^2}$
  respuesta: $\frac{x - 3}{2x^2}$
  solucion_pasos:
  - 1. El numerador original es $2x^2$ y el denominador es $x - 3$.
  - '2. Permutar posiciones: el recíproco es $\frac{x - 3}{2x^2}$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el recíproco de la expresión binomia $\frac{x + 1}{x - 5}$?
  alternativas:
  - $\frac{x - 5}{x + 1}$
  - $\frac{x + 5}{x - 1}$
  - $-\frac{x - 5}{x + 1}$
  respuesta: $\frac{x - 5}{x + 1}$
  solucion_pasos:
  - 1. Intercambiar las posiciones del numerador y denominador.
  - 2. El resultado es $\frac{x - 5}{x + 1}$.
- titulo: Recíproco del entero
  enunciado: Para el polinomio entero $x + 2$, ¿su inverso multiplicativo es $\frac{1}{x + 2}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, expresando el entero como $\frac{x+2}{1}$, su recíproco es $\frac{1}{x+2}$.
- titulo: Multiplicación por recíproco
  enunciado: ¿El producto de $\frac{x}{y}$ con su recíproco $\frac{y}{x}$ es igual a $1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{x}{y} \cdot \frac{y}{x} = \frac{xy}{xy} = 1$.
errores_frecuentes:
- El inverso multiplicativo de $\frac{A}{B}$ se obtiene cambiando el signo global a $-\frac{A}{B}$.
- El recíproco de la fracción $\frac{x+2}{x-3}$ es la resta de polinomios $(x+2) - (x-3)$.
- El recíproco de $\frac{ax+b}{c}$ equivale a $\frac{\frac{1}{a}x+b}{c}$.
- El dominio de la fracción recíproca excluye solo los ceros del denominador original.
- Multiplicar una fracción algebraica por su recíproco da como resultado cero en lugar de uno.
afirmaciones_verdaderas:
- El inverso multiplicativo de $\frac{P(x)}{Q(x)}$ se forma permutando las posiciones para obtener $\frac{Q(x)}{P(x)}$.
- El producto de cualquier fracción algebraica no nula por su inverso multiplicativo es igual a 1.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/identificacion-del-inverso-multiplicativo-algebraico-resumen.svg)


  QUÉ: Identificar y construir el inverso multiplicativo de cualquier fracción algebraica no nula.

  CÓMO: Permutar la posición del numerador con el denominador conservando los signos originales ($\frac{P(x)}{Q(x)} \implies
  \frac{Q(x)}{P(x)}$), verificando que el producto sea igual a 1 para todo $P(x) \neq 0$ y $Q(x) \neq 0$.

  '
