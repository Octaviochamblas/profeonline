semantic_id: MAT.ALG.TERMINO_COMUN.REGLA_GENERAL
resumen_inicial: La aplicación de la regla de binomios con término común consiste en ejecutar el algoritmo $(x+a)(x+b) = x^2
  + (a+b)x + ab$ operando algebraicamente la suma y el producto de los términos no comunes con sus signos.
explicacion_simple: "Para desarrollar rápidamente cualquier producto de binomios con término común $(x + a)(x + b)$:\n- **FÓRMULA\
  \ ALGORÍTMICA**: $(x + a)(x + b) = \\mathbf{x^2 + (a + b)x + ab}$.\n- **Procedimiento de 3 pasos sencillos**:\n  1. **Eleva\
  \ el común al cuadrado**: $x \\to \\mathbf{x^2}$.\n  2. **Suma los no comunes y multiplica por el común**: $(a + b) \\cdot\
  \ x \\to \\mathbf{(a+b)x}$.\n  3. **Multiplica los no comunes**: $a \\cdot b \\to \\mathbf{ab}$.\n- **Ejemplo con números\
  \ positivos y negativos**: $(x + 7) \\cdot (x - 3)$:\n  - Paso 1 (Cuadrado del común): $x^2$.\n  - Paso 2 (Suma no comunes\
  \ por común): $(+7 - 3)x = +4x \\implies \\mathbf{+4x}$.\n  - Paso 3 (Producto no comunes): $(+7) \\cdot (-3) = -21 \\implies\
  \ \\mathbf{-21}$.\n  - Resultado final unificado: **$x^2 + 4x - 21$**.\n\n![Regla de binomios con término común](/static/img/nodos/aplicacion-de-la-regla-de-binomios-con-termino-comun-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la multiplicación de binomios $(x + a)(x + b) \in \mathbb{R}[x]$. La **regla general de binomios con término común**
  define la transformación polinómica $\Theta: \mathbb{R}[x] \times \mathbb{R}[x] \to \mathbb{R}[x]$ dada por:


  $$\Theta(x + a, x + b) = x^2 + S x + P$$


  donde $S \in \mathbb{R}$ representa el **operador adición de no comunes** y $P \in \mathbb{R}$ representa el **operador
  multiplicación de no comunes**:


  $$S = a + b \quad \text{y} \quad P = a \cdot b$$


  ### Coexistencia de Signos en la Adición y Multiplicación

  El algoritmo evalúa independientemente los signos en dos dominios aritméticos:

  1. **Dominio Aditivo ($S$)**: Suma algebraica conservando el signo del número de mayor valor absoluto si los signos son
  contrarios.

  2. **Dominio Multiplicativo ($P$)**: Producto aritmético aplicando la ley de signos ($(+) \cdot (-) = -$, etc.).


  ### Síntesis didáctica

  Dividir la resolución en la suma $S$ y el producto $P$ de los no comunes garantiza la correcta determinación de los signos
  del trinomio.

  '
definiciones_clave: '- **Operador suma de no comunes ($S = a+b$)**: Suma algebraica de los coeficientes libres que determina
  el signo y magnitud del término central.

  - **Operador producto de no comunes ($P = a \cdot b$)**: Multiplicación de las constantes libres que determina el signo
  y magnitud del término independiente.

  - **Trinomio expandido ($x^2 + Sx + P$)**: Estructura canónica resultante de aplicar la regla general.

  '
propiedades_relaciones: "- **Signo del término independiente ($P$)**:\n  - Si los no comunes tienen el **mismo signo**, $P$\
  \ es estrictamente **positivo (+)**.\n  - Si los no comunes tienen **signos contrarios**, $P$ es estrictamente **negativo\
  \ (-)**.\n"
ejemplo_guiado:
  enunciado: Desarrolla el producto de binomios con término común $(x - 8) \cdot (x + 3)$ aplicando la regla $x^2 + Sx + P$.
  pasos:
  - 'Paso 1: Identificamos el término común $x$ y los no comunes $a = -8$ y $b = +3$.'
  - 'Paso 2: Calculamos el término cuadrático: $x^2 = \mathbf{x^2}$.'
  - 'Paso 3: Calculamos la suma algebraica de los no comunes ($S$): $S = (-8) + (+3) = -5 \implies \text{Término central:
    } \mathbf{-5x}$.'
  - 'Paso 4: Calculamos el producto de los no comunes ($P$): $P = (-8) \cdot (+3) = \mathbf{-24}$.'
  - 'Paso 5: Consolidamos el trinomio $x^2 + Sx + P$: $x^2 - 5x - 24$.'
  - 'Conclusión: El desarrollo expandido es **$x^2 - 5x - 24$**.'
  imagen: /static/img/nodos/aplicacion-de-la-regla-de-binomios-con-termino-comun-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo tendrá el término independiente $P$ en el trinomio $x^2 + Sx + P$ si los términos no comunes $a$ y
    $b$ tienen signos contrarios (uno positivo y uno negativo)?
  choices:
  - text: Tendrá signo estrictamente negativo (-), porque la multiplicación de un número positivo por uno negativo resulta
      en un producto negativo
    is_correct: true
  - text: Tendrá signo positivo (+)
    is_correct: false
  - text: Tendrá el signo del número mayor
    is_correct: false
  - text: El signo será cero
    is_correct: false
  explanation: La alternativa correcta es 'Tendrá signo estrictamente negativo (-), porque la multiplicación de un número
    positivo por uno negativo resulta en un producto negativo'. Ley de signos en multiplicación $(+) \cdot (-) = -$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el trinomio resultante de expandir $(a - 6) \cdot (a - 4)$?
  choices:
  - text: El resultado es $a^2 - 10a + 24$, calculando la suma $S = -6 - 4 = -10$ y el producto $P = (-6)(-4) = +24$
    is_correct: true
  - text: El resultado es $a^2 - 10a - 24$
    is_correct: false
  - text: El resultado es $a^2 + 10a + 24$
    is_correct: false
  - text: El resultado es $a^2 - 24$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $a^2 - 10a + 24$, calculando la suma $S = -6 - 4 = -10$ y el producto
    $P = (-6)(-4) = +24$'. $S = -10, P = +24 \implies a^2 - 10a + 24$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar el término común al cuadrado.'
- 'Paso 2: Sumar los términos no comunes respetando sus signos y multiplicar por el término común.'
- 'Paso 3: Multiplicar los términos no comunes aplicando la regla de signos.'
- 'Paso 4: Unir los tres resultados en el trinomio final $x^2 + Sx + P$.'
errores_correccion: '- **Error 1:** Intercambiar la regla de signos de la suma con la de la multiplicación (escribir $(-6)+(-4)
  = +10$). **Cómo corregirlo:** Al sumar números del mismo signo **SE SUMAN SUS MAGNITUDES Y SE CONSERVA EL SIGNO ($-6 - 4
  = -10$)**.

  - **Error 2:** Colocar signo negativo al término independiente al multiplicar dos números negativos (escribir $(-6)(-4)
  = -24$). **Cómo corregirlo:** La multiplicación de dos negativos **DA POSITIVO ($(-6)(-4) = +24$)**.

  '
ejemplos:
- titulo: No comunes con signos negativos
  enunciado: ¿Cuál es el desarrollo de $(x - 5) \cdot (x - 2)$?
  alternativas:
  - $x^2 - 7x + 10$
  - $x^2 - 7x - 10$
  - $x^2 + 7x + 10$
  respuesta: $x^2 - 7x + 10$
  solucion_pasos:
  - '1. Suma: $-5 - 2 = -7 \implies -7x$.'
  - '2. Producto: $(-5)(-2) = +10$.'
  - '3. Resultado: $x^2 - 7x + 10$.'
- titulo: No comunes con distinto signo
  enunciado: ¿Cuál es el desarrollo de $(y + 9) \cdot (y - 4)$?
  alternativas:
  - $y^2 + 5y - 36$
  - $y^2 - 5y - 36$
  - $y^2 + 5y + 36$
  respuesta: $y^2 + 5y - 36$
  solucion_pasos:
  - '1. Suma: $+9 - 4 = +5 \implies +5y$.'
  - '2. Producto: $(+9)(-4) = -36$.'
  - '3. Resultado: $y^2 + 5y - 36$.'
- titulo: Constante positiva en no comunes del mismo signo
  enunciado: Si ambos no comunes son negativos, ¿es el término independiente $P$ strictly positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-)(-)=+$.
- titulo: Cero en suma de no comunes
  enunciado: Si los no comunes suman cero ($a+b=0$), ¿se convierte el trinomio en una diferencia de cuadrados?
  respuesta: Sí
  solucion_pasos:
  - Sí, el término central $0x$ desaparece.
errores_frecuentes:
- Aplicar la ley de signos de la multiplicación a la suma algebraica de los no comunes.
- Escribir un término independiente negativo al multiplicar dos constantes negativas.
- Multiplicar el término común por el producto de los no comunes en lugar de por su suma.
- El signo del número mayor no es considerado al sumar no comunes con distinto signo.
- Olvidar que dos números negativos producen una suma negativa pero un producto positivo.
afirmaciones_verdaderas:
- La regla general de binomios con término común requiere calcular la suma $S = a+b$ y el producto $P = a \cdot b$ de los
  no comunes.
- Si los no comunes tienen el mismo signo, el término independiente $P$ es positivo; si tienen distinto signo, $P$ es negativo.
