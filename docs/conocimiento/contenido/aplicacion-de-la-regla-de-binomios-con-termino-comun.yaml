resumen_inicial: La aplicación de la regla general de binomios con término común permite
  expandir expresiones con términos de grado superior $x^n$ y coeficientes no comunes
  generales.
explicacion_simple: Si el término común es una potencia como $x^3$, al desarrollar
  $(x^3 + 6)(x^3 - 2)$ elevamos $x^3$ al cuadrado para obtener $x^6$, sumamos los
  números $(6 - 2 = 4)$ para el término central $4x^3$, y multiplicamos los números
  $6 \cdot (-2) = -12$. El resultado es $x^6 + 4x^3 - 12$.
explicacion_formal: 'Para un monomio término común $T = x^n$ y constantes $a, b \in
  \mathbb{R}$, el desarrollo de $(x^n + a)(x^n + b)$ se rige por la identidad:


  $$(x^n + a)(x^n + b) = (x^n)^2 + (a + b)x^n + ab = x^{2n} + (a + b)x^n + ab$$


  **Desglose simbólico:**

  - $x^{2n}$: Potencia de potencia $(x^n)^2 = x^{2n}$ del término común.

  - $(a + b)x^n$: Término de grado medio con coeficiente igual a la suma de los no
  comunes.

  - $ab$: Término independiente de orden cero respecto a la variable $x$.


  > **Complemento didáctico:** Esta regla generaliza la expansión de polinomios de
  grado par cuadráticamente reducibles a trinomios de la forma $Ay^{2n} + By^n + C$.'
definiciones_clave: '- **Término común de grado superior ($x^n$)**: Monomio variable
  con exponente $n \ge 1$.

  - **Regla de grado duplicado**: El primer término de la expansión tiene exponente
  $2n$.'
propiedades_relaciones: '- **Cambio de variable**: Sustituyendo $u = x^n$, la expresión
  $(x^n + a)(x^n + b)$ se reduce exactamente a $(u + a)(u + b) = u^2 + (a+b)u + ab$.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(x^3 + 6)(x^3 - 2)$ aplicando la regla general
    de binomios con término común.
  pasos:
  - 'Paso 1: Identificar el término común $T = x^3$ y los no comunes $a = 6$ y $b
    = -2$.'
  - 'Paso 2: Elevar el término común al cuadrado: $(x^3)^2 = x^6$.'
  - 'Paso 3: Sumar los términos no comunes y multiplicar por $x^3$: $(6 + (-2))x^3
    = 4x^3$.'
  - 'Paso 4: Multiplicar los términos no comunes: $6 \cdot (-2) = -12$.'
  - 'Paso 5: Ensamblar los tres términos: $x^6 + 4x^3 - 12$.'
  - 'Conclusión: El resultado final es $x^6 + 4x^3 - 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer término que resulta de elevar al cuadrado el término
    común $T = x^4$?
  choices:
  - text: $x^8$
    is_correct: true
  - text: $x^6$
    is_correct: false
  - text: $2x^4$
    is_correct: false
  - text: $x^{16}$
    is_correct: false
  explanation: La alternativa correcta es '$x^8$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expansión de $(x^3 + 6)(x^3 - 2)$, ¿cuál es el coeficiente del término
    central $x^3$?
  choices:
  - text: $4$, resultante de $6 + (-2)$
    is_correct: true
  - text: $-12$, resultante de $6 \cdot (-2)$
    is_correct: false
  - text: $8$
    is_correct: false
  - text: $-4$
    is_correct: false
  explanation: La alternativa correcta es '$4$, resultante de $6 + (-2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar potencia de potencia al término común $(x^n)^2 = x^{2n}$.'
- 'Paso 2: Sumar algebraicamente las constantes no comunes $(a + b)$ y acompañar de
  $x^n$.'
- 'Paso 3: Multiplicar las constantes no comunes $a \cdot b$ y escribir el trinomio
  completo.'
errores_correccion: '- **Error 1: Sumar 2 al exponente del término común en lugar
  de multiplicarlo por 2.** **Cómo corregirlo:** Recordar la ley de potencias $(x^n)^2
  = x^{2n}$, por lo que $n$ se duplica por multiplicación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(a^2 + 5)(a^2 + 3)$.
  alternativas:
  - $a^4 + 8a^2 + 15$
  - $a^4 + 15a^2 + 8$
  - $a^4 + 8a^2 + 8$
  respuesta: $a^4 + 8a^2 + 15$
  solucion_pasos:
  - 1. $(a^2)^2 = a^4$.
  - 2. $(5 + 3)a^2 = 8a^2$.
  - '3. $5 \cdot 3 = 15$. Resultado: $a^4 + 8a^2 + 15$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(y^5 - 4)(y^5 + 9)$?
  alternativas:
  - $y^{10} + 5y^5 - 36$
  - $y^{10} - 5y^5 - 36$
  - $y^7 + 5y^5 - 36$
  respuesta: $y^{10} + 5y^5 - 36$
  solucion_pasos:
  - 1. $(y^5)^2 = y^{10}$.
  - 2. $(-4 + 9)y^5 = 5y^5$.
  - '3. $(-4)(9) = -36$. Resultado: $y^{10} + 5y^5 - 36$.'
- titulo: ¿Es $x^6 - 2x^3 - 15$ el desarrollo de $(x^3 - 5)(x^3 + 3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(x^3)^2 = x^6$, $-5 + 3 = -2$ y $-5 \cdot 3 = -15$.
- titulo: ¿El exponente del primer término de $(m^4 + 2)(m^4 + 5)$ es 6?
  respuesta: 'No'
  solucion_pasos:
  - No, $(m^4)^2 = m^8$, el exponente es 8.
errores_frecuentes:
- Sumar 2 al exponente del término común en lugar de multiplicarlo por 2 al elevar
  al cuadrado.
- Declarar que $(x^3 + 6)(x^3 - 2)$ es igual a $x^6 - 12$ omitiendo el término medio
  $4x^3$.
- Multiplicar los exponentes en la suma del término central en lugar de conservar
  $x^n$.
- Asignar signo positivo al término independiente cuando las constantes tienen signos
  opuestos.
- Declarar que el término medio tiene el mismo exponente $2n$ que el término inicial.
afirmaciones_verdaderas:
- El exponente del término cuadrático inicial es el doble del exponente del término
  común.
- El término central conserva la misma potencia $x^n$ que posee el término común de
  los binomios.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla general de binomios
  con término común a potencias de cualquier grado $x^n$.
