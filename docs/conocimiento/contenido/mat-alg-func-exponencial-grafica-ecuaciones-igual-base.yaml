semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ECUACIONES_IGUAL_BASE
resumen_inicial: 'La resolución de ecuaciones exponenciales por igualación de bases aplica la propiedad inyectiva $b^{u} = b^{v} \iff u = v$ para igualar los exponentes una vez homogeneizadas las bases.'
explicacion_simple: |
  Una ecuación exponencial es una igualdad donde la incógnita $x$ está atrapada en el exponente. El método más rápido para resolverla consiste en reescribir ambos lados de la igualdad usando la misma base numérica. Una vez que logramos que los números de abajo sean exactamente iguales (como en $2^{3x} = 2^{12}$), podemos "cancelar" las bases e igualar directamente los exponentes ($3x = 12$) para despejar $x$ como en una ecuación lineal común.
explicacion_formal: |
  ### Definición formal
  El método algebraico de **igualación de bases** se fundamenta en la **propiedad inyectiva (uno a uno)** de la función exponencial $f(x) = b^x$ con $b > 0, b \neq 1$:
  $$\forall u, v \in \mathbb{R}, \quad b^u = b^v \iff u = v$$

  ### Desglose simbólico
  - Transformación a base común: Dada $b_1^{P(x)} = b_2^{Q(x)}$, expresar $b_1 = c^k$ y $b_2 = c^m$ para una base común $c > 0, c \neq 1$.
  - Aplicación de leyes de exponentes: $\left(c^k\right)^{P(x)} = \left(c^m\right)^{Q(x)} \implies c^{k \cdot P(x)} = c^{m \cdot Q(x)}$.
  - Igualación inyectiva: $k \cdot P(x) = m \cdot Q(x)$.
  - Despeje de la ecuación resultante lineal o cuadrática en $x$.

  ### Síntesis didáctica
  Identificar cuándo es aplicable el método: La igualación de bases es el método preferido cuando los números de ambos lados de la ecuación son potencias expresables en términos de un mismo número primo o entero base (ej: $4, 8, 16, 32 \to \text{base } 2$; $9, 27, 81 \to \text{base } 3$).
definiciones_clave: |
  - **Ecuación exponencial**: Igualdad donde la variable incógnita se ubica en uno o más exponentes.
  - **Propiedad inyectiva $b^u = b^v \iff u = v$**: Garantía matemática de que bases iguales exigen exponentes iguales.
  - **Base común $c$**: Número base al cual se reducen los términos de la ecuación mediante potencias.
propiedades_relaciones: |
  - **Validez de soluciones en $\mathbb{R}$**: Dado que $\operatorname{Dom}(b^x) = \mathbb{R}$, las soluciones obtenidas al igualar exponentes no generan indefiniciones y son siempre válidas.
  - **Ecuaciones cuadráticas disfrazadas**: Ecuaciones de la forma $A \cdot (b^x)^2 + B \cdot b^x + C = 0$ se resuelven mediante el cambio de variable $u = b^x > 0$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación exponencial $9^{2x - 1} = 27^{x + 4}$ mediante el método de igualación de bases.'
  pasos:
    - 'Paso 1: Reconocemos las bases $9$ y $27$. Ambas son potencias del número $3$: $9 = 3^2$ y $27 = 3^3$.'
    - 'Paso 2: Sustituimos las bases en la ecuación: $\left(3^2\right)^{2x - 1} = \left(3^3\right)^{x + 4}$.'
    - 'Paso 3: Aplicamos potencia de una potencia distribuyendo los exponentes: $3^{2(2x - 1)} = 3^{3(x + 4)} \implies 3^{4x - 2} = 3^{3x + 12}$.'
    - 'Paso 4: Aplicamos la propiedad inyectiva igualando los exponentes: $4x - 2 = 3x + 12$.'
    - 'Paso 5: Despejamos la variable $x$: $4x - 3x = 12 + 2 \implies x = 14$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la solución de la ecuación exponencial $4^{x + 3} = 32^x$ obtenida mediante igualación de bases?'
    choices:
      - {text: '$x = 2$', is_correct: true}
      - {text: '$x = 3$', is_correct: false}
      - {text: '$x = 6$', is_correct: false}
      - {text: '$x = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 2$''. Expresamos $4 = 2^2$ y $32 = 2^5 \implies 2^{2(x+3)} = 2^{5x} \implies 2x + 6 = 5x \implies 3x = 6 \implies x = 2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para resolver la ecuación exponencial $\left(\frac{1}{5}\right)^{x - 2} = 125$, ¿cómo se expresa la igualdad en base $5$?'
    choices:
      - {text: '$5^{-(x - 2)} = 5^3 \implies -(x - 2) = 3 \implies x = -1$', is_correct: true}
      - {text: '$5^{x - 2} = 5^3 \implies x = 5$', is_correct: false}
      - {text: '$5^{2 - x} = 5^{25} \implies x = -23$', is_correct: false}
      - {text: 'La ecuación no tiene solución real', is_correct: false}
    explanation: 'La alternativa correcta es ''$5^{-(x - 2)} = 5^3 \implies -(x - 2) = 3 \implies x = -1$''. Convertimos $\frac{1}{5} = 5^{-1}$ y $125 = 5^3$, de donde $-x + 2 = 3 \implies x = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las bases numéricas presentes en ambos lados de la igualdad.'
  - 'Paso 2: Expresar todas las bases como potencias de un mismo número primo o base común $c$.'
  - 'Paso 3: Aplicar la regla de potencia de una potencia $(c^k)^p = c^{k \cdot p}$ para unificar exponentes.'
  - 'Paso 4: Igualar directamente los exponentes $k \cdot P(x) = m \cdot Q(x)$ y despejar la variable $x$.'
errores_correccion: |
  - **Error 1:** Igualar los exponentes sin haber logrado que las bases sean idénticas (ej: en $2^x = 3^x$ decir $x = x$). **Cómo corregirlo:** La propiedad inyectiva exige estrictamente que las bases sean idénticas ($b^u = b^v$). Primero se deben igualar las bases.
  - **Error 2:** Multiplicar la base por el exponente al aplicar potencia de potencia (ej: en $(3^2)^{x+1}$ escribir $6^{x+1}$). **Cómo corregirlo:** Las bases no se multiplican por los exponentes. Se conserva la base y se multiplican los exponentes entre sí: $3^{2(x+1)} = 3^{2x+2}$.
ejemplos:
  - titulo: 'Ecuación simple de igual base'
    enunciado: '¿Cuál es la solución de $5^{3x - 1} = 5^8$?'
    alternativas:
      - '$x = 3$'
      - '$x = 2$'
      - '$x = 9$'
    respuesta: '$x = 3$'
    solucion_pasos:
      - '1. Como las bases son iguales ($b = 5$), igualamos exponentes: $3x - 1 = 8$.'
      - '2. $3x = 9 \implies x = 3$.'
  - titulo: 'Igualación con exponente fraccionario'
    enunciado: '¿La solución de $2^x = \sqrt{2}$ es $x = 0.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Escribimos $\sqrt{2} = 2^{1/2} \implies 2^x = 2^{1/2} \implies x = \frac{1}{2} = 0.5$.'
  - titulo: 'Ecuación con base recíproca'
    enunciado: '¿La solución de $3^x = \frac{1}{27}$ es $x = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{1}{27} = \frac{1}{3^3} = 3^{-3} \implies 3^x = 3^{-3} \implies x = -3$.'
  - titulo: 'Igualación a exponente cero'
    enunciado: '¿La solución de $7^{2x - 6} = 1$ es $x = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Escribimos $1 = 7^0 \implies 7^{2x - 6} = 7^0 \implies 2x - 6 = 0 \implies x = 3$.'
errores_frecuentes:
  - 'Para resolver $2^{x+1} = 8$, se cancela el 2 dividiendo $8 / 2 = 4$ y se obtiene $x + 1 = 4$.'
  - 'Al reducir $(4^2)^x$ a base 2 se obtiene $2^{2x}$.'
  - 'La ecuación $3^x = -9$ se resuelve por igualación de bases obteniendo $x = 2$.'
  - 'La propiedad $b^u = b^v \iff u = v$ es válida incluso si la base es $b = 1$.'
  - 'En la expresión $(5^3)^{x-1}$, el exponente resultante es $3x - 1$.'
afirmaciones_verdaderas:
  - 'La resolución de ecuaciones exponenciales por igualación de bases se fundamenta en la inyectividad de la función exponencial $b^u = b^v \iff u = v$.'
  - 'Cualquier número real $1$ puede expresarse como la base elevada al exponente cero ($b^0 = 1$) para facilitar la igualación de exponentes.'
al_terminar_debes_poder: 'Resolver ecuaciones exponenciales reduciendo sus términos a una base común e igualando sus exponentes.'
