semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ECUACIONES_IGUAL_BASE
resumen_inicial: 'Resolución de ecuaciones exponenciales mediante igualación de bases:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: Cuando dos potencias con la misma base son iguales, los exponentes
  también deben ser iguales; esta simple idea permite resolver muchas ecuaciones exponenciales
  sin necesidad de logaritmos.
explicacion_formal: '### Definición formal


  La función exponencial $f(x)=b^x$ es inyectiva para $b>0$, $b\neq1$: si $b^m=b^n$,
  entonces $m=n$. Por tanto, una ecuación exponencial se resuelve reescribiendo ambos
  lados como potencias de una misma base y luego igualando los exponentes.


  ### Desarrollo didáctico


  El método requiere primero identificar una base común a la que ambos lados de la
  ecuación puedan reescribirse, usualmente un número primo pequeño.


  Para resolver $2^{x+1}=8$: se reescribe $8=2^3$, obteniendo $2^{x+1}=2^3$; igualando
  exponentes, $x+1=3$, por lo que $x=2$.'
definiciones_clave: '- **Resolución de ecuaciones exponenciales mediante igualación
  de bases**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a resolución de ecuaciones exponenciales mediante igualación de bases.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de resolución
    de ecuaciones exponenciales mediante igualación de bases.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de resolución de ecuaciones exponenciales
    mediante igualación de bases.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    resolución de ecuaciones exponenciales mediante igualación de bases?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis gráfico
      y modelamiento exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis gráfico y modelamiento exponencial. Es la condición
    de existencia para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en resolución de ecuaciones exponenciales mediante igualación de bases?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reescribe ambos lados de la ecuación como potencias de una misma base.'
- 'Paso 2: Iguala los exponentes de ambos lados.'
- 'Paso 3: Resuelve la ecuación (generalmente lineal) resultante para encontrar $x$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en resolución
  de ecuaciones exponenciales mediante igualación de bases.
ejemplos:
- titulo: Resolución con reescritura directa
  enunciado: Resuelve $3^x=81$.
  solucion_pasos:
  - 'Reescribiendo: $81=3^4$.'
  - 'Igualando exponentes: $x=4$.'
- titulo: Resolución con exponente compuesto
  enunciado: Resuelve $5^{2x-1}=125$.
  solucion_pasos:
  - 'Reescribiendo: $125=5^3$.'
  - 'Igualando exponentes: $2x-1=3$, dando $x=2$.'
- titulo: ¿Es siempre posible reescribir ambos lados de una ecuación exponencial con
    la misma base?
  enunciado: ¿Es siempre posible reescribir ambos lados de una ecuación exponencial
    con la misma base?
  respuesta: 'No'
  solucion_pasos:
  - Solo cuando ambos lados son potencias de un mismo número; en caso contrario, se
    necesitan logaritmos.
- titulo: ¿Si $b^m=b^n$ con $b>0$ y $b\neq1$, se puede concluir que $m=n$?
  enunciado: ¿Si $b^m=b^n$ con $b>0$ y $b\neq1$, se puede concluir que $m=n$?
  respuesta: Sí
  solucion_pasos:
  - La inyectividad de la función exponencial garantiza que exponentes iguales corresponden
    a bases iguales elevadas a exponentes iguales.
errores_frecuentes:
- Igualar los exponentes sin haber reescrito primero ambos lados con la misma base.
- Cometer errores al reescribir un número como potencia de otro (por ejemplo, confundir
  $27=3^3$ con $27=3^2$).
- Aplicar este método a ecuaciones donde ambos lados no se pueden expresar con la
  misma base.
- No resolver correctamente la ecuación lineal resultante tras igualar los exponentes.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando resolución de ecuaciones exponenciales mediante igualación de bases.
