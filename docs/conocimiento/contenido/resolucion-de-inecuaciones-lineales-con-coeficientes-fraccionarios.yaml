semantic_id: MAT.ALG.INECUACIONES_LINEALES.COEFICIENTES_FRACCIONARIOS
resumen_inicial: Las inecuaciones con coeficientes fraccionarios se simplifican multiplicando
  por el m.c.m. positivo de los denominadores.
explicacion_simple: 'Para resolver inecuaciones que contienen fracciones numéricas
  (como $\frac{x}{2} - \frac{x}{3} \ge 1$):

  1. Calculamos el m.c.m. de los denominadores (que siempre es un número positivo).

  2. Multiplicamos TODOS los términos de la inecuación por este m.c.m. positivo.

  3. Como el m.c.m. es positivo, el símbolo de la inecuación NO cambia de sentido.

  4. Resolvemos la inecuación entera obtenida.'
explicacion_formal: 'Dada la inecuación con coeficientes fraccionarios $\frac{a_1}{d_1}
  x + \frac{a_2}{d_2} \ R \ \frac{a_3}{d_3}$, sea $M = \operatorname{lcm}(d_1, d_2,
  d_3) > 0$. La **enterización conservativa** establece:


  $$M \cdot \left(\frac{a_1}{d_1} x + \frac{a_2}{d_2}\right) \ R \ M \cdot \left(\frac{a_3}{d_3}\right)
  \implies A_1 x + A_2 \ R \ A_3$$


  **Desglose de la fórmula:**

  - $M > 0$: Como el m.c.m. de números positivos es siempre positivo, el operador
  de orden $R$ conserva su orientación original.'
definiciones_clave: '- **Enterización de inecuación**: Multiplicación por el m.c.m.
  positivo para eliminar fracciones sin alterar el sentido de orden.'
propiedades_relaciones: '- **Preservación del sentido por $M > 0$**: Garantiza que
  la estructura entera resultante sea totalmente equivalente.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación con coeficientes fraccionarios $\frac{x}{2} -
    \frac{x}{3} > 2$ multiplicando por el m.c.m. de los denominadores y evalúa la
    solución.
  pasos:
  - 'Paso 1: Hallar el m.c.m. de $2$ y $3$: $\operatorname{lcm}(2, 3) = 6 > 0$.Paso
    2: Multiplicar cada término por $6$: $6 \cdot \frac{x}{2} - 6 \cdot \frac{x}{3}
    > 6 \cdot 2$.Paso 3: Simplificar: $3x - 2x > 12$.Paso 4: Reducir términos semejantes:
    $x > 12$.Paso 5: Escribir el conjunto solución: $S = ]12, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al multiplicar la inecuación $\frac{x}{2} - \frac{x}{3} > 2$ por el m.c.m.
    $6$, ¿cuál es la inecuación entera obtenida?
  choices:
  - text: $3x - 2x > 12$
    is_correct: true
  - text: $3x - 2x < 12$
    is_correct: false
  - text: $2x - 3x > 2$
    is_correct: false
  - text: $x - x > 12$
    is_correct: false
  explanation: La alternativa correcta es '$3x - 2x > 12$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $\frac{x}{2} - \frac{x}{3} > 2$, ¿cuál es el conjunto solución
    $S$?
  choices:
  - text: $S = ]12, +\infty[$
    is_correct: true
  - text: $S = [12, +\infty[$
    is_correct: false
  - text: $S = ]-\infty, 12[$
    is_correct: false
  - text: $S = ]2, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]12, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los denominadores numéricos de las fracciones.'
- 'Paso 2: Calcular el m.c.m. positivo $M$.'
- 'Paso 3: Multiplicar TODOS los términos de ambos miembros por $M$.'
- 'Paso 4: Mantener el mismo símbolo de inecuación.'
- 'Paso 5: Resolver la inecuación de coeficientes enteros resultante.'
errores_correccion: '- **Error común:** Multiplicar por el m.c.m. los términos fraccionarios
  pero olvidar multiplicarlo por los términos enteros del segundo miembro (ejemplo:
  escribir $3x - 2x > 2$ en vez de $12$).

  - **Cómo corregirlo:** La multiplicación por el m.c.m. DEBE realizarse sobre TODOS
  los términos de la inecuación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
  - 'Al multiplicar una inecuación con fracciones por el mínimo común múltiplo (m.c.m.) de los denominadores, los numeradores se mantienen sin alterar.'
  - 'Multiplicar la inecuación $\frac{x}{2} + \frac{x}{3} > 5$ por $6$ exige invertir el sentido del operador de orden.'
  - 'Eliminar denominadores en una inecuación fraccionaria permite omitir la multiplicación en los términos independientes enteros.'
  - 'Al resolver $\frac{2x - 1}{4} \le 3$, se multiplica únicamente el numerador por $4$ dando $8x - 4 \le 3$.'
  - 'El m.c.m. de los denominadores en inecuaciones debe ser obligatoriamente un número negativo.'
afirmaciones_verdaderas:
  - 'Multiplicar toda la inecuación por el m.c.m. positivo de los denominadores transforma la expresión en una inecuación equivalente con coeficientes enteros.'
  - 'Al multiplicar por un m.c.m. positivo, el sentido del operador de desigualdad se conserva intacto.'
al_terminar_debes_poder: |
  QUÉ: Resolver inecuaciones lineales con coeficientes fraccionarios.
  CÓMO: Calcular el m.c.m. positivo de los denominadores, multiplicar cada término de la inecuación, resolver la inecuación entera resultante y expresar la solución.
