semantic_id: MAT.GEO.TRIANGULOS_ANGULOS.SUMA_EXTERIORES
resumen_inicial: La suma de las medidas de los tres ángulos exteriores de cualquier
  triángulo plano (tomando uno por cada vértice) es una constante geométrica universal
  igual a 360°.
explicacion_simple: '![Teorema de Suma Exterior](/static/img/nodos/teorema-de-la-suma-de-angulos-exteriores-de-un-triangulo-igual-a-360-intro.svg)


  Si caminas alrededor del borde de un triángulo y doblas en cada esquina, al completar
  el recorrido habrás dado un giro completo sobre tu propio eje: exactamente **$360^\circ$**.
  Por eso, la suma de los tres ángulos de afuera de cualquier triángulo siempre da
  **$360^\circ$**.'
explicacion_formal: '### Teorema formal

  En todo triángulo euclidiano, la suma de las medidas de los tres ángulos exteriores
  (uno considerado por cada vértice) es constante e igual a un ángulo completo ($360^\circ$
  o $2\pi \text{ rad}$):


  $$\alpha'' + \beta'' + \gamma'' = 360^\circ \iff \sum_{i=1}^3 \angle''_i = 2\pi
  \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha'' = 180^\circ - \alpha$, $\beta'' = 180^\circ - \beta$, $\gamma'' = 180^\circ
  - \gamma$.

  - Sumatoria: $(\alpha'' + \beta'' + \gamma'') = 3(180^\circ) - (\alpha + \beta +
  \gamma) = 540^\circ - 180^\circ = 360^\circ$.

  - Teorema de rotación de Gauss: Equivale al giro completo ($360^\circ$) experimentado
  por un vector tangente que recorre el contorno cerrado del triángulo.


  ### Síntesis didáctica

  La suma de ángulos exteriores es universalmente $360^\circ$ en todos los polígonos
  convexos, formalizando la clausura angular completa de una trayectoria cerrada.'
definiciones_clave: '- **Teorema de suma exterior**: $\alpha'' + \beta'' + \gamma''
  = 360^\circ$.

  - **Ángulo de giro total**: Interpretación cinemática donde la suma de las deflexiones
  angulares en un circuito cerrado equivale a una vuelta completa ($360^\circ$).

  - **Un exterior por vértice**: Convención estándar para calcular la suma angular
  externa de un polígono. '
propiedades_relaciones: '- **Universalidad poligonal**: Este teorema se generaliza
  a cualquier polígono convexo de $n$ lados: la suma de sus ángulos exteriores siempre
  es $360^\circ$, independientemente del número de lados.

  - **Relación con interiores**: Cada exterior es $\alpha'' = 180^\circ - \alpha$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Suma Exterior](/static/img/nodos/teorema-de-la-suma-de-angulos-exteriores-de-un-triangulo-igual-a-360-ejemplos.svg)


    En un triángulo $\triangle ABC$, dos de sus ángulos exteriores miden $\alpha''
    = 125^\circ$ y $\beta'' = 140^\circ$. Determina la medida del tercer ángulo exterior
    $\gamma''$ y los tres ángulos interiores.'
  pasos:
  - 'Paso 1: Aplicar el teorema de la suma exterior: $\alpha'' + \beta'' + \gamma''
    = 360^\circ$.'
  - 'Paso 2: Sustituir los valores dados: $125^\circ + 140^\circ + \gamma'' = 360^\circ$.'
  - 'Paso 3: Despejar $\gamma''$: $265^\circ + \gamma'' = 360^\circ \implies \gamma''
    = 360^\circ - 265^\circ = 95^\circ$.'
  - 'Paso 4: Calcular los ángulos interiores mediante suplementos: $\alpha = 180^\circ
    - 125^\circ = 55^\circ$, $\beta = 180^\circ - 140^\circ = 40^\circ$, $\gamma =
    180^\circ - 95^\circ = 85^\circ$.'
  - 'Paso 5: Comprobar la suma interior: $55^\circ + 40^\circ + 85^\circ = 180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto vale la suma de los tres ángulos exteriores de cualquier triángulo
    plano?
  choices:
  - text: Exactamente 360° (dos ángulos llanos)
    is_correct: true
  - text: 180°
    is_correct: false
  - text: 540°
    is_correct: false
  - text: Depende del tipo de triángulo
    is_correct: false
  explanation: Por teorema universal euclidiano, la suma de los tres ángulos exteriores
    vale exactamente 360° (dos ángulos llanos).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos ángulos exteriores de un triángulo miden 110° y 130°, ¿cuánto mide
    el tercer ángulo exterior?
  choices:
  - text: 120° (porque 360° - 240° = 120°)
    is_correct: true
  - text: 60°
    is_correct: false
  - text: 100°
    is_correct: false
  - text: 140°
    is_correct: false
  explanation: Restando 240° de 360° se obtiene 120° (porque 360° - 240° = 120°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $\alpha'' + \beta'' + \gamma'' = 360^\circ$.'
- 'Paso 2: Sustituir las medidas de los ángulos exteriores conocidos.'
- 'Paso 3: Restar la suma acumulada de $360^\circ$ para obtener el ángulo exterior
  faltante.'
errores_correccion: No confundas la suma de exteriores (360°) con la suma de interiores
  (180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto mide cada ángulo exterior de un triángulo equilátero?
  alternativas:
  - $120^\circ$
  - $60^\circ$
  - $180^\circ$
  respuesta: $120^\circ$
  solucion_pasos:
  - Como los 3 exteriores son iguales: $360^\circ / 3 = 120^\circ$.
- titulo: Ejemplo 2
  enunciado: 'Si los ángulos exteriores están en la razón $2 : 3 : 4$, ¿cuánto mide
    el menor ángulo exterior?'
  alternativas:
  - $80^\circ$
  - $60^\circ$
  - $120^\circ$
  respuesta: $80^\circ$
  solucion_pasos:
  - $2x + 3x + 4x = 360^\circ \implies 9x = 360^\circ \implies x = 40^\circ$. El menor
    es $2(40^\circ) = 80^\circ$.
- titulo: ¿La suma de los tres ángulos exteriores de todo triángulo es 360°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad invariable de todos los polígonos convexos.
- titulo: ¿Un ángulo exterior de un triángulo puede medir 190°?
  respuesta: 'No'
  solucion_pasos:
  - No, porque su interior adyacente es positivo y menor a 180°, por lo que el exterior
    no puede superar 180°.
errores_frecuentes:
- Confundir 360° con 180° al sumar ángulos exteriores.
- Sumar los dos ángulos exteriores generados en cada vértice ($720^\circ$).
- Pensar que los triángulos obtusángulos tienen una suma exterior distinta a 360°.
- No verificar que cada exterior sea suplementario con su interior adyacente.
- Confundir ángulo exterior con ángulo cóncavo ($360^\circ - \alpha$).
afirmaciones_verdaderas:
- La suma de los tres ángulos exteriores de cualquier triángulo plano es $360^\circ$.
- Cada ángulo exterior es igual a $180^\circ$ menos el ángulo interior correspondiente.
al_terminar_debes_poder: '**QUÉ:** Enunciar, demostrar y aplicar el teorema de la
  suma de ángulos exteriores ($360^\circ$).


  **CÓMO:** Utilizando la ecuación $\alpha'' + \beta'' + \gamma'' = 360^\circ$ y las
  relaciones suplementarias con los ángulos interiores.


  ![Resumen del Teorema de Suma Exterior](/static/img/nodos/teorema-de-la-suma-de-angulos-exteriores-de-un-triangulo-igual-a-360-resumen.svg)'
