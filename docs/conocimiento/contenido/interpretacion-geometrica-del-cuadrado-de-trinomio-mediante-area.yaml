  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el modelo geométrico para $(x + y + 4)^2$, ¿cuál es el área combinada
    de los 2 rectángulos de dimensiones $x \times 4$?
  choices:
  - text: $8x\text{ m}^2$, resultante de $2 \cdot 4x$
    is_correct: true
  - text: $4x\text{ m}^2$
    is_correct: false
  - text: $16x\text{ m}^2$
    is_correct: false
  - text: $2xy\text{ m}^2$
