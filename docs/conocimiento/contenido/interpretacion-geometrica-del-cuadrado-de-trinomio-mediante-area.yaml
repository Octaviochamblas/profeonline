  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar un cuadrado de lado $(a + b + c)$ y trazar líneas dividiendo las
  3 longitudes.'
- 'Paso 2: Calcular el área de las 3 regiones cuadradas de la diagonal principal ($a^2,
  b^2, c^2$).'
- 'Paso 3: Sumar el área de cada par de rectángulos simétricos de lados iguales ($2ab,
  2ac, 2bc$).'
errores_correccion: '- **Error 1: Contar solo 3 regiones en el modelo geométrico omitiendo
  los 6 rectángulos.** **Cómo corregirlo:** La cuadrícula $3 \times 3$ contiene 9
  piezas en total, cuyas áreas simétricas se agrupan en los 3 dobles productos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Un plano dividido en tres segmentos $a, b, c$ muestra 3 regiones de área
    $a^2, b^2, c^2$ y 6 regiones rectangulares. ¿Cuál es el área total?
  alternativas:
  - $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$
  - $a^2 + b^2 + c^2 + ab + ac + bc$
  - $3a^2 + 6ab$
  respuesta: $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$
  solucion_pasos:
  - '1. 3 cuadrados en la diagonal: $a^2 + b^2 + c^2$.'
  - '2. 6 rectángulos agrupan 3 pares iguales: $2ab + 2ac + 2bc$.'
  - 3. Suma total representa $(a+b+c)^2$.
- titulo: Ejemplo 2
  enunciado: ¿Por qué las áreas rectangulares fuera de la diagonal se agrupan de a
    pares $2ab, 2ac, 2bc$?
  alternativas:
  - Por la simetría de la cuadrícula respecto a la diagonal principal ($R_{ij} = R_{ji}$)
  - Por una regla arbitraria de dibujo
  - Porque se duplica la altura
  respuesta: Por la simetría de la cuadrícula respecto a la diagonal principal ($R_{ij}
    = R_{ji}$)
  solucion_pasos:
  - 1. El rectángulo de base $a$ y altura $b$ tiene la misma área que el de base $b$
    y altura $a$ ($ab = ba$).
- titulo: ¿Representa la suma de las 9 subregiones exactamente el desarrollo algebraico
    de $(a + b + c)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el modelo geométrico valida visualmente la propiedad distributiva de la adición.
- titulo: ¿Se pueden formar regiones de área negativa en la representación de superficies
    físicas reales?
  respuesta: 'No'
  solucion_pasos:
  - No, la representación geométrica con longitudes físicas asume $a, b, c > 0$.
errores_frecuentes:
- Declarar que la división de lado $(a + b + c)$ produce únicamente 6 regiones en
  total.
- Declarar que los rectángulos fuera de la diagonal tienen áreas distintas $ab \neq
  ba$.
- Declarar que las subregiones cuadradas diagonales tienen las mismas dimensiones
  que los rectángulos laterales.
- Declarar que el área total se obtiene sumando solo los 3 cuadrados diagonales.
- Asignar unidades cúbicas a la superficie del cuadrado de trinomio.
afirmaciones_verdaderas:
- La partición geométrica de un cuadrado de lado $(a + b + c)$ consta de 9 subregiones
  cuya suma es $a^2 + b^2 + c^2 + 2ab + 2ac + 2bc$.
- Los rectángulos fuera de la diagonal se agrupan en 3 parejas de áreas iguales por
  conmutatividad del producto.
al_terminar_debes_poder: Al terminar serás capaz de explicar geométricamente el desarrollo
  del cuadrado de trinomio mediante la partición en 9 subregiones.
