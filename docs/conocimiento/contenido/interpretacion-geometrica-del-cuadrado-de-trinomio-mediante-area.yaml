procedimiento:
- 'Paso 1: Para asociar un área, cuenta las piezas. Habrá siempre 3 cuadrados y 3
  pares de rectángulos.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en interpretación geométrica del cuadrado de trinomio mediante
  área.
ejemplos:
- titulo: Suma de áreas
  enunciado: Si divides un lado en $1, 2$ y $x$, ¿qué áreas se forman al proyectar
    sobre el cuadrado?
  solucion_pasos:
  - Lado $= (1+2+x) = (x+3)$.
  - 'Áreas diagonales: $1^2=1$, $2^2=4$, $x^2$.'
  - 'Áreas cruzadas (x2): $1\\\\\\cdot2 = 2$; $1\\\\\\cdot x = x$; $2\\\\\\cdot x
    = 2x$.'
  - 'Al doblarlas: $4, 2x, 4x$.'
  - 'Total: $x^2 + 6x + 9$. Que equivale a $(x+3)^2$.'
- titulo: Si visualizas $(a+b+c)^2$ como un cuadrado de área, los tres cuadrados perfectos
    $a^2, b^2
  enunciado: 'Si visualizas $(a+b+c)^2$ como un cuadrado de área, los tres cuadrados
    perfectos $a^2, b^2, c^2$ se ubican geométricamente:


    Opciones: A) A lo largo de la diagonal principal del cuadrado grande. · B) Todos
    en una misma esquina. · C) Formando un triángulo central. · D) Repartidos en las
    4 esquinas.'
  solucion_pasos:
  - Al cruzar las líneas en el dibujo, los cuadrados siempre quedan alineados en diagonal.
  - 'Respuesta: A lo largo de la diagonal principal del cuadrado grande.'
- titulo: 'Respecto de «Interpretación geométrica del cuadrado de trinomio mediante
    área»: ¿Describe ad'
  enunciado: 'Respecto de «Interpretación geométrica del cuadrado de trinomio mediante
    área»: ¿Describe adecuadamente el concepto esta frase? «Si un cuadrado de lado
    $(a+b+c)$ se subdivide, obtenemos: - 3 cuadrados perfectos en la diagonal ($a^2,
    b^2, c^2$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si un cuadrado de lado $(a+b+c)$
    se subdivide, obtenemos: - 3 cuadrados perfectos en la diagonal ($a^2, b^2, c^2$).'
- titulo: 'Respecto de «Interpretación geométrica del cuadrado de trinomio mediante
    área»: ¿Se puede ac'
  enunciado: 'Respecto de «Interpretación geométrica del cuadrado de trinomio mediante
    área»: ¿Se puede aceptar esta afirmación? «Pensar que un trinomio al cuadrado
    solo tiene 3 partes en su interior»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si un cuadrado de lado $(a+b+c)$
