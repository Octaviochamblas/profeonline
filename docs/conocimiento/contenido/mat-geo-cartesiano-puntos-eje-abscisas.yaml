semantic_id: MAT.GEO.CARTESIANO_BASE.PUNTOS_EJE_ABSCISAS
resumen_inicial: 'Identificación de puntos situados sobre el eje de las abscisas:
  conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Cuando un punto 'no se levanta' del eje horizontal (es decir,
  su altura es cero), significa que está exactamente sobre el eje de las abscisas.
explicacion_formal: '![Puntos sobre el eje de las abscisas](/static/img/geometria/cartesiano-vectores/cartesiano-puntos-eje-abscisas.svg)


  ### Definición formal


  Un punto pertenece al eje de las abscisas si y solo si su ordenada es cero: todo
  punto de la forma $(x,0)$, para cualquier valor real de $x$, se ubica sobre este
  eje.


  ### Desarrollo didáctico


  En la figura, los puntos $E(4,0)$ y $F(-3,0)$ están sobre el eje de las abscisas,
  ya que ambos tienen ordenada igual a 0, sin importar que sus abscisas sean distintas
  (una positiva y otra negativa).'
definiciones_clave: '- **Identificación de puntos situados sobre el eje de las abscisas**:
  Elemento o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
