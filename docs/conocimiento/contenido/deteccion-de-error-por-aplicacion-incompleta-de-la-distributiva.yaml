semantic_id: MAT.ALG.MULT_POLINOMIOS.DISTRIBUTIVA_INCOMPLETA_ERROR
resumen_inicial: 'Detección de error por aplicación incompleta de la distributiva:
  leyes, procedimiento y aplicación en Multiplicación de polinomios.'
explicacion_simple: Omitir uno de los productos parciales cambia el valor de toda
  la expresión. Revisar la distributividad término a término permite detectar y corregir
  esa omisión.
explicacion_formal: '### Definición formal


  Sean $P(x)=\sum_{i=0}^{m} a_i x^i$ y $Q(x)=\sum_{j=0}^{n} b_j x^j$. El producto
  correcto exige considerar todos los pares de términos:

  $$P(x)Q(x)=\sum_{i=0}^{m}\sum_{j=0}^{n} a_i b_j x^{i+j}.$$

  Existe aplicación incompleta de la distributiva cuando la expresión escrita solo
  incorpora los productos asociados a un subconjunto propio de pares $(i,j)$ y omite
  al menos uno de los términos parciales requeridos. En general, esa expresión no
  es algebraicamente equivalente al producto original, porque deja fuera contribuciones
  necesarias para la suma total.


  ### Desarrollo didáctico


  Se pierden $O$ y $I$ del acrónimo FOIL (Outers e Inners).


  La distributiva incompleta equivale a calcular solo las áreas de 2 celdas de las
  4 posibles en el modelo de área.


  Los cruzados son $(m)(5) = 5m$ y $(3)(n) = 3n$.'
definiciones_clave: '- **Detección de error por aplicación incompleta de la distributiva**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a detección de error por aplicación incompleta de
  la distributiva.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de detección de error por
    aplicación incompleta de la distributiva.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de detección de error por aplicación incompleta
    de la distributiva.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
