resumen_inicial: La detección de error por aplicación incompleta de la distributiva
  aplica rigurosamente las leyes distributivas, de signos y de potencias en expresiones
  algebraicas.
explicacion_simple: Al trabajar con detección de error por aplicación incompleta de
  la distributiva, multiplicamos los coeficientes numéricos, aplicamos la regla de
  signos y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Detección de error por aplicación
  incompleta de la distributiva** viene dada por:


  $$\text{"el error (a + b)(c + d) = ac + bd"} \implies El error es omitir los productos
  cruzados ad y bc$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Detección de error por aplicación incompleta de la distributiva**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule detección de error por aplicación incompleta de la distributiva
    para: ''el error (a + b)(c + d) = ac + bd''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es El error es omitir los productos cruzados ad
    y bc.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar detección de error por aplicación incompleta
    de la distributiva a 'el error (a + b)(c + d) = ac + bd'?
  choices:
  - text: El error es omitir los productos cruzados ad y bc
    is_correct: true
  - text: El error es sumar a + b
    is_correct: false
  - text: El error es multiplicar a por c
    is_correct: false
  - text: No hay error
    is_correct: false
  explanation: La alternativa correcta es 'El error es omitir los productos cruzados
    ad y bc'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el error (a + b)(c + d) = ac + bd', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: El error es omitir los productos cruzados ad y bc
    is_correct: true
  - text: El error es sumar a + b
    is_correct: false
  - text: El error es multiplicar a por c
    is_correct: false
  - text: No hay error
    is_correct: false
  explanation: La alternativa correcta es 'El error es omitir los productos cruzados
    ad y bc'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante detección de error por aplicación incompleta de la distributiva.** **Cómo
  corregirlo:** Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de detección de error por aplicación incompleta
    de la distributiva en 'el error (a + b)(c + d) = ac + bd'?
  alternativas:
  - El error es omitir los productos cruzados ad y bc
  - El error es sumar a + b
  - El error es multiplicar a por c
  - No hay error
  respuesta: El error es omitir los productos cruzados ad y bc
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener El error es omitir los productos cruzados ad y bc.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el error (a + b)(c + d) = ac + bd' por detección de error
    por aplicación incompleta de la distributiva, ¿qué expresión resulta?
  alternativas:
  - El error es omitir los productos cruzados ad y bc
  - El error es sumar a + b
  - El error es multiplicar a por c
  - No hay error
  respuesta: El error es omitir los productos cruzados ad y bc
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir El error es omitir los productos cruzados ad y bc.
- titulo: ¿Es la multiplicación en 'el error (a + b)(c + d) = ac + bd' equivalente
    a El error es omitir los productos cruzados ad y bc?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene El error es omitir los productos
    cruzados ad y bc.
- titulo: ¿Da el producto de 'el error (a + b)(c + d) = ac + bd' un resultado igual
    a El error es sumar a + b?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es El error es omitir los productos cruzados ad y bc.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar detección de error por
  aplicación incompleta de la distributiva.
- Omitir distribuir el monomio o término sobre todos los sumandos en detección de
  error por aplicación incompleta de la distributiva.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La detección de error por aplicación incompleta de la distributiva requiere sumar
  los exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la detección de error
  por aplicación incompleta de la distributiva aplicando distributividad, ley de signos
  y suma de exponentes.
