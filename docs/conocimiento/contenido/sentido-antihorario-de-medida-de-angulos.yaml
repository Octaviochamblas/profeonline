semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.SENTIDO_ANTIHORARIO
resumen_inicial: La medición en sentido contrario a las agujas del reloj establece
  la convención de orientación positiva estándar para medir ángulos en geometría y
  trigonometría.
explicacion_simple: Imagina girar la perilla de un reloj en dirección contraria a
  como avanzan las agujas. En matemáticas, mover la aguja desde el eje horizontal
  hacia arriba (sentido contrario al reloj) mide el ángulo con signo positivo.
explicacion_formal: Por convención en sistemas de coordenadas cartesianas y trigonometría,
  la medida de un ángulo es **positiva** cuando el rayo inicial gira hacia el rayo
  final en sentido **antihorario** (contrarreloj) alrededor del vértice originado
  en el eje $X$ positivo.
definiciones_clave: '- **Sentido antihorario de medida de ángulos**: Concepto geométrico
  que permite estructurar la notación y medida angular.

  - **Notación angular**: Simbología usada (como $\angle$, $\alpha$, $\theta$) para
  representar ángulos.'
propiedades_relaciones: '- **Unicidad de notación**: Cada ángulo posee una notación
  simbólica estándar que evita confusiones.

  - **Orientación**: La medición en sentido antihorario se considera positiva en geometría
  y trigonometría.'
ejemplo_guiado:
  enunciado: Un brazo robótico parte orientado en el eje $X$ positivo ($0^\circ$)
    y realiza una rotación en sentido antihorario de $120^\circ$, luego se regresa
    en sentido horario $30^\circ$. Determina su ángulo final respecto a la posición
    inicial.
  pasos:
  - 'Paso 1: Asignar signo positivo al giro antihorario ($+120^\circ$) y signo negativo
    al giro horario ($-30^\circ$).'
  - 'Paso 2: Sumar algebraicamente ambos giros orientados: $+120^\circ - 30^\circ$.'
  - 'Paso 3: Concluir que el brazo robótico queda posicionado a un ángulo positivo
    de $+90^\circ$ (en sentido antihorario).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el propósito principal de emplear la notación estándar en sentido
    antihorario de medida de ángulos?
  choices:
  - text: Identificar sin ambigüedad el vértice, los lados y la abertura del ángulo
    is_correct: true
  - text: Cambiar la medida del ángulo según el tipo de letra usado
    is_correct: false
  - text: Convertir automáticamente cualquier ángulo en un ángulo recto
    is_correct: false
  - text: Eliminar la necesidad de dibujar la figura geométrica
    is_correct: false
  explanation: La alternativa correcta es 'Identificar sin ambigüedad el vértice,
    los lados y la abertura del ángulo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si se realiza un giro antihorario de +120° seguido de un giro horario
    de -30°, ¿cuál es la posición angular resultante?
  choices:
  - text: +90° (sentido antihorario)
    is_correct: true
  - text: +150°
    is_correct: false
  - text: -90°
    is_correct: false
  - text: +60°
    is_correct: false
  explanation: La alternativa correcta es '+90° (sentido antihorario)', pues $120^\circ
    - 30^\circ = 90^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los símbolos y letras dados en sentido antihorario de medida
  de ángulos.'
- 'Paso 2: Ubicar el vértice y los lados correspondientes.'
- 'Paso 3: Realizar las operaciones o mediciones requeridas.'
errores_correccion: Asegúrate de colocar siempre la letra del vértice en la posición
  central al usar la notación de tres puntos en sentido antihorario de medida de ángulos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un ángulo en sentido antihorario de medida de ángulos mide $\alpha
    = 75^\circ$, ¿cuál es su valor expresado numéricamente?
  alternativas:
  - 75°
  - 85°
  - 65°
  respuesta: 75°
  solucion_pasos:
  - El valor numérico directo es $\alpha = 75^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Qué letra representa el vértice en la notación $\angle ABC$ referente
    a sentido antihorario de medida de ángulos?
  alternativas:
  - Letra B
  - Letra A
  - Letra C
  respuesta: Letra B
  solucion_pasos:
  - La letra central B es el vértice del ángulo.
- titulo: ¿Se utiliza la letra del centro para identificar el vértice en sentido antihorario
    de medida de ángulos?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la convención universal en geometría.
- titulo: ¿La medida de un ángulo depende del tipo de letra usado para nombrarlo?
  respuesta: 'No'
  solucion_pasos:
  - No, el nombre o símbolo no afecta la abertura geométrica del ángulo.
errores_frecuentes:
- Intercambiar el orden de las letras en la notación confundiendo el vértice.
- Afirmar que medir en sentido antihorario da un resultado negativo.
- Declarar la letra griega que nombra al ángulo con la medida en grados.
- Omitir colocar el símbolo de grados (°) al escribir el resultado.
- Declarar que dos notaciones distintas no pueden referirse al mismo ángulo.
afirmaciones_verdaderas:
- La notación con tres puntos sitúa el vértice en el centro.
- La medición estándar de ángulos en el plano cartesiano se realiza en sentido antihorario.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la notación y propiedades
  de sentido antihorario de medida de ángulos con precisión en problemas geométricos.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
