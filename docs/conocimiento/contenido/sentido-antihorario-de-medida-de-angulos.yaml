semantic_id: MAT.GEO.ANGULOS_FUNDAMENTOS.SENTIDO_ANTIHORARIO
resumen_inicial: La medición en sentido contrario a las agujas del reloj establece
  la convención de orientación positiva estándar para medir ángulos en geometría y
  trigonometría.
explicacion_simple: '![Sentido Antihorario de Medida de Ángulos](/static/img/nodos/sentido-antihorario-de-medida-de-angulos-intro.svg)


  Imagina girar la perilla de un reloj en dirección contraria a como avanzan las agujas.
  En matemáticas, mover la aguja desde el eje horizontal hacia arriba (sentido contrario
  al reloj) mide el ángulo con signo positivo.'
explicacion_formal: '### Definición formal

  En el plano cartesiano orientado $\mathbb{R}^2$, se define la **orientación positiva
  estándar** de un ángulo como la rotación en sentido **antihorario** (contrario a
  las agujas del reloj) desde el rayo inicial hacia el rayo terminal:


  $$\theta > 0 \iff \text{Rotación Antihoraria} \quad \land \quad \theta < 0 \iff
  \text{Rotación Horaria}$$


  $$\vec{v}(\theta) = (\cos \theta, \sin \theta)$$


  ### Desglose simbólico y geométrico

  - Sentido positivo ($+$): Rotación en contra del movimiento de las manecillas del
  reloj (levógiro).

  - Sentido negativo ($-$) o retrógrado: Rotación a favor de las manecillas del reloj
  (dextrógiro).

  - Eje polar inicial: Convencionalmente el semieje positivo de las abscisas ($+X$).


  ### Síntesis didáctica

  La convención antihoraria unifica la geometría euclidiana con la trigonometría analítica
  y el cálculo vectorial, permitiendo el uso coherente de las funciones trigonométricas
  y las coordenadas polares.'
definiciones_clave: '- **Sentido antihorario (CCW)**: Rotación contraria al avance
  de las manecillas del reloj, convención estándar para ángulos positivos.

  - **Posición estándar**: Configuración donde el vértice se ubica en el origen $(0,0)$
  y el rayo inicial reposa sobre el semieje $X$ positivo. '
propiedades_relaciones: '- **Signo de rotación**: Giro antihorario $= +\theta$, giro
  horario $= -\theta$.

  - **Suma orientada de ángulos**: Las rotaciones sucesivas se combinan mediante suma
  algebraica de sus medidas con signo. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Giros Orientados](/static/img/nodos/sentido-antihorario-de-medida-de-angulos-ejemplos.svg)


    Un brazo robótico parte orientado en el eje $X$ positivo ($0^\circ$) y realiza
    una rotación en sentido antihorario de $120^\circ$, luego se regresa en sentido
    horario $30^\circ$. Determina su ángulo final respecto a la posición inicial.'
  pasos:
  - 'Paso 1: Asignar signo positivo al giro antihorario ($+120^\circ$) y signo negativo
    al giro horario ($-30^\circ$).'
  - 'Paso 2: Sumar algebraicamente ambos giros orientados: $+120^\circ - 30^\circ$.'
  - 'Paso 3: Concluir que el brazo robótico queda posicionado a un ángulo positivo
    de $+90^\circ$ (en sentido antihorario).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el signo asignado por convención matemática estándar a una rotación
    en sentido contrario a las manecillas del reloj?
  choices:
  - text: Signo positivo (+)
    is_correct: true
  - text: Signo negativo (-)
    is_correct: false
  - text: Cero grados neutro
    is_correct: false
  - text: Signo indefinido
    is_correct: false
  explanation: En la convención geométrica y cartesiana universal, el giro antihorario
    tiene siempre signo positivo (+).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un radar gira +150° en sentido antihorario y luego retrocede 60° en
    sentido horario, ¿cuál es su posición final?
  choices:
  - text: +90° (sentido antihorario)
    is_correct: true
  - text: +210°
    is_correct: false
  - text: -90°
    is_correct: false
  - text: +60°
    is_correct: false
  explanation: Operando algebraicamente 150° - 60° = +90°, lo que corresponde a +90°
    (sentido antihorario).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el rayo inicial ubicado sobre el semieje positivo $X$.'
- 'Paso 2: Determinar el sentido del giro: positivo si es antihorario, negativo si
  es horario.'
- 'Paso 3: Operar algebraicamente las rotaciones para obtener la posición final.'
errores_correccion: Recuerda que girar en sentido horario produce medidas angulares
  negativas.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un rayo gira desde el semieje $+X$ un ángulo de $45^\circ$ a favor
    de las manecillas del reloj, ¿cómo se expresa su medida con signo?
  alternativas:
  - $-45^\circ$
  - $+45^\circ$
  - $+135^\circ$
  respuesta: $-45^\circ$
  solucion_pasos:
  - Al girar a favor del reloj (sentido horario), el signo es negativo: $-45^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de sumar una rotación de $+200^\circ$ con una rotación
    horaria de $50^\circ$?
  alternativas:
  - $+150^\circ$
  - $+250^\circ$
  - $-150^\circ$
  respuesta: $+150^\circ$
  solucion_pasos:
  - Suma algebraica: $+200^\circ + (-50^\circ) = +150^\circ$.
- titulo: ¿La medición en sentido antihorario es la convención estándar para ángulos
    positivos en matemáticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la convención universal en trigonometría y geometría analítica.
- titulo: ¿Un giro de -90° deja el rayo en el semieje Y positivo?
  respuesta: 'No'
  solucion_pasos:
  - No, $-90^\circ$ gira hacia abajo, quedando en el semieje $Y$ negativo.
errores_frecuentes:
- Considerar erróneamente que el sentido de las agujas del reloj es positivo.
- Iniciar la medición del ángulo desde el eje vertical $Y$ en vez del semieje positivo
  $X$.
- Restar giros antihorarios como si fueran negativos.
- Confundir la posición final del ángulo con el número total de vueltas completadas.
- Omitir el signo negativo al reportar rotaciones horarias.
afirmaciones_verdaderas:
- Los ángulos medidos en sentido contrario a las manecillas del reloj tienen signo
  positivo.
- En posición estándar, el vértice del ángulo coincide con el origen de coordenadas
  $(0,0)$.
al_terminar_debes_poder: '**QUÉ:** Determinar e interpretar la medida de ángulos orientados
  en el plano cartesiano según su sentido de rotación.


  **CÓMO:** Asignando signo positivo a los giros antihorarios y signo negativo a los
  giros horarios respecto al semieje $X$ positivo.


  ![Resumen de Sentido Antihorario](/static/img/nodos/sentido-antihorario-de-medida-de-angulos-resumen.svg)'
