semantic_id: MAT.NUM.ENTEROS_CONJUNTO.ANTECESOR
resumen_inicial: "El antecesor de un entero $n$ es el número que va justo antes, calculado como $n-1$: un paso a la izquierda en la recta numérica."
explicacion_simple: |
  El antecesor de un número es el número que va justo antes. El antecesor de 7 es 6. El antecesor
  de -2 es -3. El antecesor de 0 es -1. Es como dar un paso a la izquierda en la recta numérica. Es
  el complemento del sucesor: mientras el sucesor avanza, el antecesor retrocede.
explicacion_formal: |
  El antecesor de un entero $n$ se define como $\text{antecesor}(n) = n - 1$: el número exactamente
  una unidad a su izquierda en la recta numérica. Como $\mathbb{Z}$ es infinito a la izquierda, todo
  entero tiene un antecesor único.
definiciones_clave: |
  **Antecesor**: el número inmediatamente anterior a $n$, calculado como $n-1$. **Enteros
  consecutivos**: $(n-1), n, (n+1)$, donde cada uno es antecesor o sucesor del siguiente.
propiedades_relaciones: |
  El antecesor de un negativo tiene mayor valor absoluto que el número original (ej. antecesor de
  $-4$ es $-5$). El antecesor de un número siempre es menor que el número original ($n-1 < n$).
ejemplo_guiado:
  enunciado: "Determina el antecesor de $-9$."
  pasos:
    - "Tomar el número inicial: $-9$."
    - "Aplicar la fórmula: $-9 - 1 = -10$."
    - "El antecesor de $-9$ es $-10$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la fórmula correcta para calcular el antecesor de un entero $n$?"
    choices:
      - {text: "$n + 1$", is_correct: false}
      - {text: "$n - 1$", is_correct: true}
      - {text: "$-n$", is_correct: false}
      - {text: "$n / 2$", is_correct: false}
    explanation: "La correcta es $n - 1$: el antecesor siempre se obtiene restando una unidad al número."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el antecesor de $3$?"
    choices:
      - {text: "$4$", is_correct: false}
      - {text: "$2$", is_correct: true}
      - {text: "$-3$", is_correct: false}
      - {text: "$3$", is_correct: false}
    explanation: "La correcta es $2$, porque $3 - 1 = 2$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el número entero inicial $n$."
  - "Paso 2: Restar algebraicamente $1$ unidad al número dado ($n - 1$)."
  - "Paso 3: Verificar que el resultado se encuentre inmediatamente a la izquierda en la recta numérica."
errores_correccion: |
  Un error frecuente es pensar que el antecesor de un negativo es positivo: en realidad se aleja
  más del cero hacia la izquierda, aumentando su valor absoluto. Otro error es creer que los
  negativos no tienen antecesor porque "los enteros empiezan en 1"; eso confunde $\mathbb{Z}$ con
  $\mathbb{N}$, y $\mathbb{Z}$ es infinito en ambos sentidos.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determine el antecesor de $0$."
    alternativas:
      - "$-1$"
      - "$1$"
      - "$0$"
    respuesta: "$-1$"
    solucion_pasos:
      - "Tomar el número inicial: $0$."
      - "Aplicar la fórmula: $0 - 1 = -1$."
      - "Resultado: El antecesor de $0$ es $-1$."
  - titulo: "Ejemplo 2"
    enunciado: "Si el antecesor de un número es $c - 5$, ¿cuál es el cuádruple del número?"
    alternativas:
      - "$4c - 16$"
      - "$4c - 20$"
      - "$c - 4$"
    respuesta: "$4c - 16$"
    solucion_pasos:
      - "Se define el antecesor como $x - 1 = c - 5$."
      - "Se halla el número $x$ sumando 1: $x = (c - 5) + 1 = c - 4$."
      - "Se calcula el cuádruple del número: $4(c - 4) = 4c - 16$."
      - "Resultado: $4c - 16$."
  - titulo: "¿Es $-6$ el antecesor de $-5$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Aplicar la fórmula: antecesor de $-5$ es $-5 - 1 = -6$."
      - "$-6$ se ubica una unidad a la izquierda de $-5$ en la recta: ✓"
      - "Por lo tanto, $-6$ sí es el antecesor de $-5$."
  - titulo: "¿Es $0$ el antecesor de $-1$?"
    respuesta: "No"
    solucion_pasos:
      - "Aplicar la fórmula: antecesor de $-1$ es $-1 - 1 = -2$."
      - "$0$ es el **sucesor** de $-1$ ($-1 + 1 = 0$), no su antecesor."
      - "Por lo tanto, $0$ no es el antecesor de $-1$."
errores_frecuentes:
  - "El antecesor de un número negativo siempre es positivo."
  - "El antecesor de $-1$ es $0$."
  - "El antecesor de $0$ es $1$."
  - "Los números negativos no tienen antecesor porque los enteros empiezan en $1$."
  - "El antecesor de un número siempre es menor en valor absoluto."
al_terminar_debes_poder: |
  Calcular el antecesor de cualquier entero (positivo, negativo o cero) aplicando $n-1$, y explicar
  por qué el antecesor de un negativo tiene mayor valor absoluto que el número original.

fuente: "Matemática 7º Básico Tomo 1 p.145"
estado: publicado
