semantic_id: MAT.NUM.ENTEROS_CONJUNTO.ANTECESOR
resumen_inicial: 'El antecesor de un entero $n$ es el número inmediatamente anterior a su izquierda: $A(n) = n - 1$.'
explicacion_simple: 'El antecesor de un número entero es el número consecutivo situado inmediatamente a su izquierda en la recta numérica. Para calcularlo, restamos una unidad ($n - 1$), manteniendo el mismo criterio tanto para números positivos como para negativos y cero.


  ![Concepto de antecesor de un número (n - 1)](/static/img/nodos/concepto-de-antecesor-de-un-numero-n-1-intro.svg)'
explicacion_formal: 'Dado un número entero $n \in \mathbb{Z}$, la **Función Antecesor** $A: \mathbb{Z} \to \mathbb{Z}$ se define algebraicamente como:


  $$A(n) = n - 1$$


  **Desglose de la fórmula:**

  - $A(n)$: Valor entero del antecesor inmediato de $n$.

  - $- 1$: Sustracción de una unidad discreta en el sentido negativo de la recta.

  - $\forall n \in \mathbb{Z}, \quad A(n) < n$ (el antecesor es estrictamente menor que el número original).


  > **Complemento didáctico:** En los enteros negativos, restar 1 aleja el resultado del cero (ej: el antecesor de $-5$ es $-6$).'
definiciones_clave: '- **Antecesor**: Entero contiguo $n-1$ situado inmediatamente a la izquierda de $n$ en la recta numérica.

  - **Consecutivo anterior**: Término que precede en el orden de conteo.'
propiedades_relaciones: '- **Orden estricto**: $A(n) < n$ para todo entero $n \in \mathbb{Z}$.'
ejemplo_guiado:
  enunciado: 'Calcule el antecesor del entero negativo $-5$ aplicando la fórmula $n - 1$.


    ![Ejemplo Concepto de antecesor de un número (n - 1)](/static/img/nodos/concepto-de-antecesor-de-un-numero-n-1-ejemplos.svg)'
  pasos:
  - 'Paso 1: Tomar el número dado: $n = -5$.'
  - 'Paso 2: Restar una unidad: $A(-5) = -5 - 1$.'
  - 'Paso 3: Resolver la resta de enteros: $-5 - 1 = -6$.'
  - 'Conclusión: El antecesor de $-5$ es $-6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el antecesor del número entero -5?
  choices:
  - text: '-6'
    is_correct: true
  - text: '-4'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '-6', calculando $-5 - 1 = -6$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el antecesor de -5 es -6?
  choices:
  - text: Porque se resta 1 al número, desplazándose a la izquierda (-5 - 1 = -6)
    is_correct: true
  - text: Porque se suma 1 al número
    is_correct: false
  - text: Porque se invierte su signo
    is_correct: false
  - text: Es un error, debería ser -4
    is_correct: false
  explanation: La alternativa correcta es 'Porque se resta 1 al número, desplazándose a la izquierda (-5 - 1 = -6)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número entero base $n$.'
- 'Paso 2: Restar 1 unidad a dicha cantidad ($n - 1$).'
- 'Paso 3: Resolver la operación respetando las reglas de signos.'
errores_correccion: '- **Error 1: Creer que el antecesor de $-5$ es $-4$.** **Cómo corregirlo:** El antecesor retrocede a la izquierda restando 1: $-5 - 1 = -6$.


  - **Error 2: Pensar que el cero no tiene antecesor en $\mathbb{Z}$.** **Cómo corregirlo:** En los enteros, el antecesor de $0$ es $0 - 1 = -1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el antecesor del entero 0 en Z?
  alternativas:
  - '-1'
  - '1'
  - '0'
  respuesta: '-1'
  solucion_pasos:
  - $0 - 1 = -1$.
- titulo: Ejemplo 2
  enunciado: Calcule el antecesor del antecesor de 3.
  alternativas:
  - '1'
  - '2'
  - '0'
  respuesta: '1'
  solucion_pasos:
  - Antecesor de 3 es 2; antecesor de 2 es 1.
- titulo: ¿El antecesor de -10 es -11?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-10 - 1 = -11$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
- titulo: ¿Es el antecesor de un entero mayor que el número original?
  respuesta: 'No'
  solucion_pasos:
  - No, el antecesor es siempre menor que el número original ($A(n) < n$).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
errores_frecuentes:
- El antecesor del número entero $-8$ es el número entero $-7$.
- El número cero no posee antecesor dentro del conjunto de los números enteros $\mathbb{Z}$.
- El antecesor de un número entero se ubica a su derecha en la recta numérica.
- El antecesor de un número impar es obligatoriamente otro número impar.
- Para hallar el antecesor de un número entero se le debe sumar la unidad $+1$.
afirmaciones_verdaderas:
- El antecesor de cualquier número entero $n$ se obtiene restando una unidad ($n - 1$).
- El antecesor de un número en la recta numérica se encuentra ubicado inmediatamente a su izquierda.
al_terminar_debes_poder: '**QUÉ:** Calcular e interpretar el antecesor de cualquier número entero $n \in \mathbb{Z}$.


  **CÓMO:** Aplicando la fórmula $\text{ant}(n) = n - 1$, desplazándose un salto a la izquierda y verificando el trío consecutivo $n-1 < n < n+1$.


  ![Resumen Concepto de antecesor de un número (n - 1)](/static/img/nodos/concepto-de-antecesor-de-un-numero-n-1-resumen.svg)'
