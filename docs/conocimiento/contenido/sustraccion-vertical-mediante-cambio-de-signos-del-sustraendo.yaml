resumen_inicial: La sustracción vertical de polinomios alinea los términos semejantes
  por columnas y cambia los signos de la fila correspondiente al sustraendo antes
  de sumar.
explicacion_simple: Para restar polinomios verticalmente, escribimos el minuendo arriba
  y el sustraendo abajo (alineando las columnas con las mismas letras). Luego, le
  cambiamos los signos a toda la fila de abajo y hacemos la suma columna por columna.
explicacion_formal: 'Dada la sustracción en columna $P(x) - Q(x)$, la **Alineación
  Vertical con Inversión** opera:


  $$\begin{array}{rcccl} P(x) & = & a_n x^n + \dots + a_1 x + a_0 \\ - \, Q(x) & =
  & -b_n x^n - \dots - b_1 x - b_0 \\ \hline (P-Q)(x) & = & (a_n-b_n)x^n + \dots +
  (a_1-b_1)x + (a_0-b_0) \end{array}$$


  > **Complemento didáctico:** La inversión previa de signos en la fila del sustraendo
  transforma la sustracción en una adición columnar estándar de bajo riesgo.'
definiciones_clave: '- **Sustracción vertical**: Disposición en filas alineando columnas
  con cambio explícito de signos en la fila inferior.'
propiedades_relaciones: '- **Transformación a adición**: Una vez invertidos los signos
  del sustraendo, el proceso es idéntico a la adición vertical.'
ejemplo_guiado:
  enunciado: Reste verticalmente de $P(x) = 6x^3 - 3x^2 + 4$ el polinomio $Q(x) =
    2x^3 + 5x^2 - 7$.
  pasos:
  - 'Paso 1: Escribir el minuendo $P(x)$ en la fila superior: $6x^3 - 3x^2 + 4$.'
  - "Paso 2: Escribir el sustraendo $Q(x)$ en la fila inferior cambiando todos sus\
    \ signos:\n  $+2x^3 \\to -2x^3$.\n  $+5x^2 \\to -5x^2$.\n  $-7 \\to +7$."
  - "Paso 3: Realizar la adición por columnas:\n  Columna $x^3$: $6 - 2 = 4x^3$.\n\
    \  Columna $x^2$: $-3 - 5 = -8x^2$.\n  Constantes: $4 + 7 = 11$."
  - 'Conclusión: La diferencia reducida es $4x^3 - 8x^2 + 11$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué paso es indispensable realizar en la fila del sustraendo al restar
    polinomios verticalmente?
  choices:
  - text: Cambiar el signo de todos los términos de la fila del sustraendo antes de
      sumar
    is_correct: true
  - text: Elevar al cuadrado los coeficientes del sustraendo
    is_correct: false
  - text: Invertir los signos de la fila superior del minuendo
    is_correct: false
  - text: Multiplicar los exponentes por -1
    is_correct: false
  explanation: La alternativa correcta es 'Cambiar el signo de todos los términos
    de la fila del sustraendo antes de sumar'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (6x^3 - 3x^2 + 4) - (2x^3 + 5x^2 - 7), ¿cuál
    fue el resultado de la sustracción?
  choices:
  - text: 4x^3 - 8x^2 + 11
    is_correct: true
  - text: 8x^3 + 2x^2 - 3
    is_correct: false
  - text: 4x^3 + 2x^2 - 3
    is_correct: false
  - text: 4x^3 - 8x^2 - 3
    is_correct: false
  explanation: La alternativa correcta es '4x^3 - 8x^2 + 11'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el minuendo en la primera fila.'
- 'Paso 2: Escribir el sustraendo en la segunda fila cambiando el signo de cada término.'
- 'Paso 3: Sumar los coeficientes verticalmente en cada columna.'
errores_correccion: '- **Error 1: Mantener los signos originales de la fila del sustraendo
  y restar sólo los números sin considerar los signos.** **Cómo corregirlo:** Cambiar
  explícitamente los signos en lápiz o notación antes de hacer la suma vertical.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al restar verticalmente (7x - 4y) de (10x + 2y), ¿cuál es la fila cambiada
    del sustraendo?
  alternativas:
  - -7x + 4y
  - 7x + 4y
  - -7x - 4y
  - -10x - 2y
  respuesta: -7x + 4y
  solucion_pasos:
  - 1. Sustraendo es 7x - 4y.
  - 2. Al cambiar signos resulta -7x + 4y.
- titulo: Ejemplo 2
  enunciado: Calcule verticalmente (5m^2 + 3m - 1) - (2m^2 - m + 4).
  alternativas:
  - 3m^2 + 4m - 5
  - 3m^2 + 2m + 3
  - 7m^2 + 2m + 3
  - 3m^2 - 4m - 5
  respuesta: 3m^2 + 4m - 5
  solucion_pasos:
  - '1. Sustraendo cambiado: -2m^2 + m - 4.'
  - '2. Suma vertical: (5-2)m^2 + (3+1)m + (-1-4) = 3m^2 + 4m - 5.'
- titulo: ¿Se convierte la sustracción en una adición columnar estándar tras invertir
    los signos de la fila inferior?
  respuesta: Sí
  solucion_pasos:
  - Sí, una vez modificados los signos del sustraendo se suman las columnas normalmente.
- titulo: ¿Se deben cambiar los signos de la fila del minuendo al restar verticalmente?
  respuesta: 'No'
  solucion_pasos:
  - No, los signos de la fila del minuendo se conservan exactamente iguales.
errores_frecuentes:
- Conservar los signos del sustraendo al realizar la adición vertical.
- Cambiar de signo el minuendo en lugar del sustraendo al alinear las filas.
- Cambiar sólo el primer término del sustraendo en la fila inferior.
- Sumar exponentes al calcular los resultados de las columnas verticales.
- Omitir las columnas vacías en polinomios incompletos durante la sustracción.
afirmaciones_verdaderas:
- En la sustracción vertical, se modifican los signos de todos los términos de la
  fila del sustraendo.
- Las columnas de términos semejantes se operan aditivamente una vez cambiados los
  signos inferiores.
al_terminar_debes_poder: Al terminar serás capaz de efectuar la sustracción de polinomios
  mediante alineación vertical invirtiendo los signos del sustraendo.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Sustracción.
