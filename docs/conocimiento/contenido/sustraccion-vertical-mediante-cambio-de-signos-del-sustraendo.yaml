semantic_id: MAT.ALG.SUSTRACCION_POL.METODO_VERTICAL
resumen_inicial: 'La sustracción vertical mediante cambio de signos del sustraendo consiste en escribir el minuendo arriba y el sustraendo abajo con todos sus signos cambiados para sumar columna por columna.'
explicacion_simple: |
  Para restar polinomios en **forma vertical (por columnas)**:
  - **Paso 1: Escribir el polinomio minuendo** en la fila superior, ordenado decrecientemente.
  - **Paso 2: Escribir el polinomio sustraendo** en la fila inferior, pero **CAMBIANDO EL SIGNO A CADA UNO DE SUS TÉRMINOS** antes de colocarlo en su columna.
  - **Paso 3: Trazar la línea y sumar** verticalmente los coeficientes de cada columna.
  - **Ejemplo**: Restar $(3x^2 - 4x + 6)$ menos $(x^2 + 2x - 5)$:
    - Minuendo arriba: $3x^2 - 4x + 6$.
    - Sustraendo con signos cambiados abajo: $-x^2 - 2x + 5$.
    $$\begin{array}{rcccl}
      3x^2 & - & 4x & + & 6 \\
    + \; -1x^2 & - & 2x & + & 5 \\
    \hline
      \mathbf{2x^2} & \mathbf{-} & \mathbf{6x} & \mathbf{+} & \mathbf{11}
    \end{array}$$
explicacion_formal: |
  ### Definición formal
  Sea la sustracción $P(x) - Q(x)$ expresada en notación matricial por columnas asociadas a la base $\{x^n, \dots, 1\}$. El algoritmo de **sustracción vertical por inversión explícita del sustraendo** transforma la matriz del sustraendo mediante la aplicación del operador cambio de signo $\mathbf{C} = -\mathbf{I}$:

  $$\begin{pmatrix} a_n & a_{n-1} & \dots & a_0 \\ \mathbf{-b_n} & \mathbf{-b_{n-1}} & \dots & \mathbf{-b_0} \end{pmatrix} \xrightarrow{\text{Suma tabular}} \begin{pmatrix} a_n - b_n & a_{n-1} - b_{n-1} & \dots & a_0 - b_0 \end{pmatrix}$$

  ### Garantía de Estructura por Columnas Semejantes
  Cambiar los signos directamente en la fila del sustraendo convierte la resta en un algoritmo aditivo idéntico al de la suma vertical, asegurando que cada columna reduzca exactamente la misma potencia $x^k$.

  ### Síntesis didáctica
  Cambiar los signos en la segunda fila del arreglo vertical visibiliza el opuesto de cada término, evitando errores de distracción de doble signo.
definiciones_clave: |
  - **Sustracción vertical**: Disposición en columnas donde la segunda fila corresponde al sustraendo con todos sus signos invertidos.
  - **Fila invertida (sustraendo opuesto)**: Modificación explícita de la signatura de la fila inferior previa al trazo de la línea de suma.
  - **Consolidación por columna**: Suma aditiva final de los coeficientes del minuendo y del sustraendo ya cambiado de signo.
propiedades_relaciones: |
  - **Isomorfismo con la suma vertical**: Tras cambiar los signos del sustraendo, el proceso de cálculo es exactamente el de una suma vertical.
  - **Preservación de exponentes**: Las columnas representan potencias que permanecen intactas en la fila de respuesta.
ejemplo_guiado:
  enunciado: 'Resta en forma vertical los polinomios $P = 5x^3 - 2x^2 + 8x - 3$ y $Q = 2x^3 + 4x^2 - 3x + 7$.'
  pasos:
    - 'Paso 1: Escribimos el minuendo $P$ en la primera fila: $5x^3 - 2x^2 + 8x - 3$.'
    - 'Paso 2: Cambiamos los signos de todos los términos del sustraendo $Q$:
       - $+2x^3 \to -2x^3$
       - $+4x^2 \to -4x^2$
       - $-3x \to +3x$
       - $+7 \to -7$.'
    - 'Paso 3: Alineamos verticalmente el sustraendo cambiado de signo en la segunda fila:
       $$\begin{array}{rcccc}
         5x^3 & - & 2x^2 & + & 8x & - & 3 \\
       + \; -2x^3 & - & 4x^2 & + & 3x & - & 7 \\
       \hline
       \end{array}$$'
    - 'Paso 4: Sumamos la columna $x^3$: $5 - 2 = \mathbf{3x^3}$.'
    - 'Paso 5: Sumamos la columna $x^2$: $-2 - 4 = \mathbf{-6x^2}$.'
    - 'Paso 6: Sumamos la columna $x$: $+8 + 3 = \mathbf{+11x}$.'
    - 'Paso 7: Sumamos las Constantes: $-3 - 7 = \mathbf{-10}$.'
    - 'Conclusión: El polinomio diferencia es **$3x^3 - 6x^2 + 11x - 10$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué cambio obligatorio se debe realizar en los términos del polinomio sustraendo al escribirlo en la segunda fila de una sustracción vertical?'
    choices:
      - {text: 'Se debe invertir el signo ($+$ a $-$ y viceversa) de todos y cada uno de sus términos', is_correct: true}
      - {text: 'Se deben multiplicar todos los coeficientes por dos', is_correct: false}
      - {text: 'Se deben cambiar los signos únicamente a los coeficientes pares', is_correct: false}
      - {text: 'No se debe realizar ningún cambio', is_correct: false}
    explanation: 'La alternativa correcta es ''Se debe invertir el signo ($+$ a $-$ y viceversa) de todos y cada uno de sus términos''. Inversión de signos en la fila inferior.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de restar en columna $(6x^2 + 5x) - (2x^2 - 3x)$?'
    choices:
      - {text: 'El resultado es $4x^2 + 8x$, al cambiar la segunda fila a $-2x^2 + 3x$ y sumar por columnas', is_correct: true}
      - {text: 'El resultado es $4x^2 + 2x$', is_correct: false}
      - {text: 'El resultado es $8x^2 + 8x$', is_correct: false}
      - {text: 'El resultado es $4x^2 - 8x$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $4x^2 + 8x$, al cambiar la segunda fila a $-2x^2 + 3x$ y sumar por columnas''. Fila inferior $-2x^2 + 3x \implies 4x^2 + 8x$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir el polinomio minuendo en la primera fila alineado y ordenado por grados.'
  - 'Paso 2: Escribir el polinomio sustraendo en la segunda fila, invirtiendo el signo de cada término y alineándolo bajo su columna semejante.'
  - 'Paso 3: Si falta alguna potencia en el minuendo o en el sustraendo, dejar el espacio en blanco o escribir $0x^k$.'
  - 'Paso 4: Trazar una línea horizontal y sumar los coeficientes de cada columna vertical.'
errores_correccion: |
  - **Error 1:** Excluir la inversión de los signos del sustraendo al escribir la segunda fila (escribir la segunda fila con los signos originales). **Cómo corregirlo:** La segunda fila **DEBE LLEVAR LOS SIGNOS YA INVERTIDOS antes de trazar la línea de suma**.
  - **Error 2:** Restar los coeficientes después de haberles cambiado ya el signo (hacer doble cambio de signo). **Cómo corregirlo:** Una vez cambiados los signos de la segunda fila, **SE PROCEDE A SUMAR DIRECTAMENTE**.
ejemplos:
  - titulo: 'Sustracción vertical simple'
    enunciado: '¿Cuál es la resta vertical de $9a - 4b$ menos $3a + 2b$?'
    alternativas:
      - '$6a - 6b$'
      - '$6a - 2b$'
      - '$12a - 2b$'
    respuesta: '$6a - 6b$'
    solucion_pasos:
      - '1. Fila 1: $9a - 4b$.'
      - '2. Fila 2 (invertida): $-3a - 2b$.'
      - '3. Suma de columnas: $6a - 6b$.'
  - titulo: 'Sustracción con cambio de negativo'
    enunciado: '¿Cuál es la resta de $(4x^2 - 1) - (-2x^2 + 5)$ en columna?'
    alternativas:
      - '$6x^2 - 6$'
      - '$2x^2 + 4$'
      - '$6x^2 + 4$'
    respuesta: '$6x^2 - 6$'
    solucion_pasos:
      - '1. Fila 1: $4x^2 - 1$.'
      - '2. Fila 2 (invertida): $+2x^2 - 5$.'
      - '3. Suma: $6x^2 - 6$.'
  - titulo: 'Inexistencia de reservas'
    enunciado: 'Al sumar la columna de constantes invertidas $-8 - 5 = -13$, ¿se escribe $-13$ sin pasar reservas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, no existen reservas entre columnas algebraicas.'
  - titulo: 'Procedimiento directo'
    enunciado: 'Tras invertir los signos de la segunda fila, ¿se realiza una suma aditiva estándar por columnas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el cambio de signos transforma la resta en suma.'
errores_frecuentes:
  - 'Escribir la segunda fila con los signos originales del sustraendo omitiendo su inversión.'
  - 'Volver a restar los coeficientes después de haber invertido los signos de la segunda fila.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Alinear términos no semejantes en la misma columna durante la disposición vertical.'
  - 'Cambiar erróneamente los signos de la primera fila correspondiente al minuendo.'
afirmaciones_verdaderas:
  - 'La sustracción vertical exige escribir la segunda fila (sustraendo) con todos sus signos invertidos.'
  - 'Una vez cambiados los signos de la segunda fila, la operación se reduce a una adición vertical por columnas.'
al_terminar_debes_poder: 'Restar polinomios mediante disposición vertical invirtiendo los signos de la fila del sustraendo y sumando por columnas.'
