semantic_id: MAT.GEO.RECTA_RELACIONES.PARALELISMO
resumen_inicial: 'Aplicación de la igualdad de pendientes en rectas paralelas: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Dos rectas nunca se cruzan si mantienen exactamente la misma inclinación;
  esa es la condición algebraica que define el paralelismo entre rectas.
explicacion_formal: '![Rectas paralelas](/static/img/geometria/analitica/rectarel-paralelismo.svg)


  ### Definición formal


  Dos rectas no verticales son paralelas si y solo si tienen la misma pendiente: $m_1=m_2$.
  Si además $b_1=b_2$, las rectas son coincidentes (la misma recta), no simplemente
  paralelas.


  ### Desarrollo didáctico


  Las rectas $y=x+1$ e $y=x-2$ tienen la misma pendiente ($m=1$) pero distinto coeficiente
  de posición, por lo que son paralelas y nunca se intersectan.'
