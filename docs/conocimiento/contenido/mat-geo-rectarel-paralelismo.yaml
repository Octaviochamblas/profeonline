procedimiento:
- 'Paso 1: Identifica las pendientes de ambas rectas (convirtiendo a forma principal
  si es necesario).'
- 'Paso 2: Compara ambas pendientes: si son iguales, las rectas son paralelas o coincidentes.'
- 'Paso 3: Si además los coeficientes de posición son distintos, las rectas son paralelas
  (no coincidentes).'
