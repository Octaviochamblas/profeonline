- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en aplicación de
  la igualdad de pendientes en rectas paralelas.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de aplicación
