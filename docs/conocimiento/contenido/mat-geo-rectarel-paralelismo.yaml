- titulo: ¿Se cumple siempre la propiedad principal de aplicación de la igualdad de
    pendientes en rectas paralelas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede aplicación de la igualdad de pendientes en rectas paralelas asumir
    un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en aplicación de la igualdad de pendientes
