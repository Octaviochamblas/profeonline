  - 'Todas las funciones logarítmicas, incluidas las trasladadas, carecen de intercepto con el eje $y$.'
  - 'La afirmación de que evaluar $x = 0$ en $f(x) = \log_3(x)$ da como resultado 0.'
  - 'La intersección con el eje $y$ de $f(x) = \log_2(x + 4)$ la afirmación de que se ubica en el punto $(4, 0)$.'
  - 'La asíntota vertical $x = 0$ de la función logarítmica permite que la curva toque al eje $y$ en el infinito.'
afirmaciones_verdaderas:
  - 'La función logarítmica básica $f(x) = \log_b(x)$ no posee intercepto con el eje $y$ debido a que el valor $x = 0$ está fuera de su dominio de definición real.'
  - 'Una función logarítmica posee intercepto con el eje $y$ si y solo si el origen $x = 0$ pertenece a su dominio, lo cual requiere que la asíntota vertical esté desplazada a la izquierda ($x < 0$).'
