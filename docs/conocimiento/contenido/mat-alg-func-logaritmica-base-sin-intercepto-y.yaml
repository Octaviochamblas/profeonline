semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.SIN_INTERCEPTO_Y
resumen_inicial: 'La función logarítmica básica no posee intercepto con el eje $y$ debido a que la abscisa $x = 0$ no pertenece a su dominio y constituye su asíntota vertical.'
explicacion_simple: |
  Para hallar dónde una curva cruza el eje vertical $y$, tendríamos que evaluar la función en el punto donde la variable $x$ vale cero ($x = 0$). Sin embargo, en la función logarítmica básica $f(x) = \log_b(x)$, el valor $x = 0$ está estrictamente fuera de las entradas permitidas ($\log_b(0)$ no existe en los reales). Por esta razón, la curva se aproxima infinitamente al eje $y$ bordeándolo sin llegar a tocarlo ni cruzarlo jamás.
explicacion_formal: |
  ### Definición formal
  La **ausencia de intersección con el eje de las ordenadas** (eje $y$) en la función logarítmica básica $f(x) = \log_b(x)$ se demuestra formalmente mediante la incompatibilidad de la condición de intersección con el dominio de definición real de la función:
  1. Condición de intersección con el eje $y$: $P_y = (0, f(0))$.
  2. Dominio de definición real: $\operatorname{Dom}(f) = ]0, +\infty[$.
  3. Puesto que $0 \notin \operatorname{Dom}(f)$, la evaluación $f(0) = \log_b(0)$ es **indefinida en $\mathbb{R}$**.
  4. Por consiguiente, el conjunto de intersecciones con el eje $y$ es el conjunto vacío:
     $$\operatorname{Graf}(f) \cap \{(0, y) \mid y \in \mathbb{R}\} = \emptyset$$

  ### Desglose simbólico
  - $x = 0 \implies \log_b(0)$ Indefinido en $\mathbb{R}$.
  - Asíntota vertical $x = 0$: La curva bordea la recta $x = 0$ a una distancia $|x| \to 0^+$, impidiendo cualquier punto de contacto finito.
  - Generación de intersección con el eje $y$ en funciones trasladadas: Una función logarítmica transformada $g(x) = a \cdot \log_b(cx + d) + k$ **sí puede cortar al eje $y$** si y solo si el origen $x = 0$ forma parte de su dominio (es decir, si $d > 0$).

  ### Síntesis didáctica
  Diferenciar función básica de función trasladada:
  - Función básica $f(x) = \log_b(x)$: **Cero** cortes con el eje $y$.
  - Función trasladada $g(x) = \log_b(x + 5)$: **Un** corte con el eje $y$ en $(0, \log_b(5))$.
definiciones_clave: |
  - **Ausencia de intercepto con el eje $y$**: Propiedad por la cual la gráfica jamás toca la recta $x = 0$.
  - **Indefinición en $x = 0$**: Exclusión del cero del dominio de la función logarítmica básica.
  - **Intersección vacía $\emptyset$**: Inexistencia de pares ordenados de la forma $(0, y)$.
propiedades_relaciones: |
  - **Dualidad con la función exponencial**: La función exponencial básica $y = b^x$ jamás corta al eje $x$. Su función inversa logarítmica $y = \log_b(x)$ jamás corta al eje $y$.
  - **Condición para corte en $y$**: Para que una función logarítmica corté al eje $y$, su asíntota vertical debe estar desplazada a la izquierda ($x = -d/c < 0$).
ejemplo_guiado:
  enunciado: 'Analiza la existencia de intersección con el eje $y$ para las siguientes funciones logarítmicas: A) $f(x) = \log_3(x)$, B) $g(x) = \ln(x + e)$, C) $h(x) = \log(x - 4)$.'
  pasos:
    - 'Paso 1: Para $f(x) = \log_3(x)$, evaluamos $x = 0 \implies \log_3(0)$ no existe. No tiene intercepto con el eje $y$.'
    - 'Paso 2: Para $g(x) = \ln(x + e)$, evaluamos $x = 0 \implies g(0) = \ln(0 + e) = \ln(e) = 1$. Posee intercepto con el eje $y$ en el punto $(0, 1)$.'
    - 'Paso 3: Para $h(x) = \log(x - 4)$, el dominio es $]4, +\infty[$. Como $x = 0 \notin ]4, +\infty[$, $h(0) = \log(-4)$ no existe. No tiene intercepto con el eje $y$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la gráfica de la función logarítmica básica $f(x) = \log_2(x)$ no cruza ni toca jamás al eje vertical $y$?'
    choices:
      - {text: 'Porque el valor $x = 0$ no pertenece a su dominio y el eje $y$ actúa como su asíntota vertical', is_correct: true}
      - {text: 'Porque las funciones logarítmicas son siempre curvas horizontales', is_correct: false}
      - {text: 'Porque el punto $(0, 1)$ pertenece a la función', is_correct: false}
      - {text: 'Porque la base 2 impide que la gráfica suba en el cuadrante I', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el valor $x = 0$ no pertenece a su dominio y el eje $y$ actúa como su asíntota vertical''. La evaluación $f(0) = \log_2(0)$ está indefinida en $\mathbb{R}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué punto cartesiano cruza al eje $y$ la función logarítmica trasladada $g(x) = \log_2(x + 8)$?'
    choices:
      - {text: '$(0, 3)$', is_correct: true}
      - {text: '$(0, 8)$', is_correct: false}
      - {text: '$(3, 0)$', is_correct: false}
      - {text: 'No posee intercepto con el eje $y$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(0, 3)$''. Evaluamos en $x = 0 \implies g(0) = \log_2(0 + 8) = \log_2(8) = 3$, lo que genera la intersección en $(0, 3)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Para verificar si existe corte con el eje $y$, sustituir $x = 0$ en la fórmula de la función.'
  - 'Paso 2: Si el argumento resultante es menor o igual a cero ($\le 0$), declarar que no existe intersección con el eje $y$.'
  - 'Paso 3: Si el argumento resultante es estrictamente mayor que cero ($> 0$), calcular el valor del logaritmo y escribir el punto $(0, g(0))$.'
errores_correccion: |
  - **Error 1:** Afirmar que toda función logarítmica carece de corte con el eje $y$. **Cómo corregirlo:** Únicamente la función logarítmica básica no trasladada carece de corte en $y$. Las funciones trasladadas a la izquierda (como $\log_b(x+d)$ con $d > 0$) sí cortan al eje $y$.
  - **Error 2:** Creer que $\log_b(0) = 0$ y concluir un intercepto en $(0, 0)$. **Cómo corregirlo:** La expresión $\log_b(0)$ no es igual a cero; está indefinida en el conjunto de los números reales.
ejemplos:
  - titulo: 'Ausencia de corte en logaritmo básico'
    enunciado: '¿La función $f(x) = \log_5(x)$ interseca al eje $y$?'
    alternativas:
      - 'No interseca al eje $y$'
      - 'Interseca en $(0, 0)$'
      - 'Interseca en $(0, 1)$'
    respuesta: 'No interseca al eje $y$'
    solucion_pasos:
      - '1. Evaluamos $x = 0 \implies \log_5(0)$ no existe.'
      - '2. La intersección con el eje $y$ es vacía.'
  - titulo: 'Corte en $y$ por traslación horizontal'
    enunciado: '¿La función $g(x) = \log_{10}(x + 100)$ corta al eje $y$ en $(0, 2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluamos en $x = 0 \implies g(0) = \log_{10}(100) = 2$, dando el punto $(0, 2)$.'
  - titulo: 'Imposibilidad de corte con desplazamiento a la derecha'
    enunciado: '¿La función $h(x) = \ln(x - 5)$ posee corte con el eje $y$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Su dominio es $]5, +\infty[$. Al no incluir $x = 0$, carece de intersección con el eje $y$.'
  - titulo: 'Simetría con la función exponencial'
    enunciado: '¿Es verdad que la función exponencial básica carece de corte en $x$, mientras que la logarítmica básica carece de corte en $y$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la manifestación de la propiedad de inversión entre ambas funciones.'
