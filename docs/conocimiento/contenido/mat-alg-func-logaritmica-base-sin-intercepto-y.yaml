semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.SIN_INTERCEPTO_Y
resumen_inicial: 'Justificación de la ausencia de intercepto con el eje Y en la función
  logarítmica básica: conceptos, asíntotas, propiedades e inversidad en Análisis de
  la función logarítmica.'
explicacion_simple: Para que una gráfica corte el eje $y$, la función debe estar definida
  en $x=0$. Como el logaritmo excluye ese valor del dominio, esa intersección simplemente
  no puede ocurrir.
explicacion_formal: '### Definición formal


  El dominio de $f(x)=\log_b(x)$ es $\mathbb{R}^+=\{x\in\mathbb{R}: x>0\}$, que excluye
  $x=0$. Como el intercepto en $y$ requiere evaluar $f(0)$, y ese valor queda fuera
  del dominio, la gráfica de toda función logarítmica carece de intercepto con el
  eje $y$.


  ### Desarrollo didáctico


  Intenta evaluar $f(0)=\log_b(0)$: la pregunta sería "¿a qué exponente se eleva $b$
  para obtener $0$?". Ninguna potencia de una base positiva puede dar $0$, por eso
  la expresión no está definida y el eje $y$ queda excluido como posible intersección.'
definiciones_clave: '- **Justificación de la ausencia de intercepto con el eje Y en
  la función logarítmica básica**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a justificación de la ausencia de intercepto con el eje y en la función
  logarítmica básica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de justificación
    de la ausencia de intercepto con el eje y en la función logarítmica básica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de justificación de la ausencia
    de intercepto con el eje y en la función logarítmica básica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    justificación de la ausencia de intercepto con el eje y en la función logarítmica
    básica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en justificación de la ausencia de intercepto con el eje y en la función logarítmica
    básica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Recuerda que el dominio de $f(x)=\log_b(x)$ es $x>0$.'
- 'Paso 2: Intenta evaluar $f(0)$ y verifica que $x=0$ no pertenece al dominio.'
- 'Paso 3: Concluye que la gráfica no tiene intercepto en el eje $y$, coherente con
  la asíntota vertical en $x=0$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en justificación
  de la ausencia de intercepto con el eje y en la función logarítmica básica.
ejemplos:
- titulo: Intento de evaluación en $x=0$
  enunciado: ¿Qué ocurre al intentar calcular $f(0)$ para $f(x)=\log_7(x)$?
  solucion_pasos:
  - Se busca un exponente $y$ tal que $7^y=0$.
  - Ninguna potencia de $7$ puede dar $0$, así que $f(0)$ no está definido.
- titulo: Relación con la asíntota vertical
  enunciado: Explica cómo se relaciona la ausencia de intercepto en $y$ con la asíntota
    vertical.
  solucion_pasos:
  - La asíntota vertical en $x=0$ indica que la función se acerca a ese valor sin
    alcanzarlo nunca.
  - Como $x=0$ nunca se alcanza, no puede existir un punto de la gráfica sobre el
    eje $y$.
- titulo: ¿La función logarítmica corta el eje $y$?
  enunciado: ¿La gráfica de $f(x)=\log_b(x)$ tiene algún punto sobre el eje $y$?
  respuesta: 'No'
  solucion_pasos:
  - El valor $x=0$ no pertenece al dominio de la función logarítmica.
- titulo: ¿Es posible que exista una excepción según la base $b$?
  enunciado: ¿Existe alguna base $b$ para la cual $f(x)=\log_b(x)$ sí tenga intercepto
    en $y$?
  respuesta: 'No'
  solucion_pasos:
  - Para toda base válida $b>0$, $b\neq1$, el dominio siempre excluye $x=0$.
errores_frecuentes:
- Suponer que $\log_b(0)=0$ por analogía incorrecta con otras funciones.
- Confundir la ausencia de intercepto en $y$ con la existencia de un intercepto en
  $(0,0)$.
- No relacionar esta propiedad con la asíntota vertical en $x=0$.
- Creer que alguna base particular permite evaluar la función en $x=0$.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando justificación de la ausencia de intercepto con el eje y en la función
  logarítmica básica.
