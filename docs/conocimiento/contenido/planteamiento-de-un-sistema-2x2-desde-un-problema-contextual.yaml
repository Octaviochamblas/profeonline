procedimiento:
- Define claramente qué representa 'x' y qué representa 'y'.
- Lee la primera condición del problema y tradúcela a la Ecuación 1.
- Lee la segunda condición del problema (suele hablar de dinero, total de patas, edades)
  y tradúcela a la Ecuación 2.
- Asegúrate de que las unidades coincidan en cada ecuación.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en planteamiento de un sistema 2x2 desde un problema contextual.
