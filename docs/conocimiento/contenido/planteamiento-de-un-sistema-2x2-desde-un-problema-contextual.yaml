semantic_id: MAT.ALG.SISTEMAS_2X2.MODELAMIENTO_BIDIMENSIONAL
resumen_inicial: Modelar bidimensionalmente un problema consiste en traducir sus condiciones
  verbales en un sistema de dos ecuaciones con dos incógnitas.
explicacion_simple: 'Cuando un problema involucra **dos cantidades desconocidas**
  relacionadas entre sí por dos condiciones distintas (por ejemplo: la suma de las
  edades es 40 y la diferencia es 10), debemos plantear un **sistema 2x2**.

  Definimos $x$ para la primera cantidad e $y$ para la segunda, y traducimos cada
  condición en una ecuación independiente.'
explicacion_formal: 'Dado un problema verbal con dos variables desconocidas $x, y$,
  el **modelamiento bidimensional** construye el sistema lineal:


  $$\begin{cases} f_1(x, y) = c_1 \\ f_2(x, y) = c_2 \end{cases} \implies \begin{cases}
  a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$$


  **Desglose de la fórmula:**

  - $x, y$: Incógnitas bidimensionales declaradas.

  - $c_1, c_2$: Restricciones numéricas totales dadas en el enunciado.'
definiciones_clave: '- **Modelamiento bidimensional**: Traducción de problemas con
  dos magnitudes independientes a un sistema de ecuaciones 2x2.'
propiedades_relaciones: '- **Suficiencia de condiciones**: Se requieren exactamente
  2 condiciones independientes para resolver de forma única a 2 incógnitas.'
ejemplo_guiado:
  enunciado: En un corral hay conejos y gallinas. En total hay $35\text{ cabezas}$
    y $94\text{ patas}$. Plantea el sistema 2x2 para hallar el número de conejos $c$
    y gallinas $g$.
  pasos:
  - 'Paso 1: Declarar las incógnitas: sea $c = \text{número de conejos}$ y $g = \text{número
    de gallinas}$.Paso 2: Traducir la condición de cabezas (totales de animales):
    $c + g = 35$.Paso 3: Traducir la condición de patas (conejos tienen 4 patas, gallinas
    2 patas): $4c + 2g = 94$.Paso 4: Formular el sistema 2x2 completo: $\begin{cases}
    c + g = 35 \\ 4c + 2g = 94 \end{cases}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al modelar el problema de las 35 cabezas y 94 patas entre conejos ($c$)
    y gallinas ($g$), ¿cuál es el sistema 2x2 correcto?
  choices:
  - text: $\begin{cases} c + g = 35 \\ 4c + 2g = 94 \end{cases}$
    is_correct: true
  - text: $\begin{cases} c + g = 94 \\ 4c + 2g = 35 \end{cases}$
    is_correct: false
  - text: $\begin{cases} 2c + 4g = 94 \\ c - g = 35 \end{cases}$
    is_correct: false
  - text: $\begin{cases} 4c + 4g = 94 \\ c + g = 35 \end{cases}$
    is_correct: false
  explanation: La alternativa correcta es '$\begin{cases} c + g = 35 \\ 4c + 2g =
    94 \end{cases}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver por reducción el sistema $\begin{cases} c + g = 35 \\ 4c +
    2g = 94 \end{cases}$, ¿cuántos conejos $c$ hay en el corral?
  choices:
  - text: $c = 12\text{ conejos}$
    is_correct: true
  - text: $c = 23\text{ conejos}$
    is_correct: false
  - text: $c = 15\text{ conejos}$
    is_correct: false
  - text: $c = 10\text{ conejos}$
    is_correct: false
  explanation: 'La alternativa correcta es ''$c = 12\text{ conejos}$''. (Paso: $-2(c+g)
    = -70 \implies 2c = 24 \implies c = 12$).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Declarar las dos incógnitas $x$ e $y$ con sus respectivas unidades.'
- 'Paso 2: Traducir la primera condición del texto a la Ecuación 1.'
- 'Paso 3: Traducir la segunda condición del texto a la Ecuación 2.'
- 'Paso 4: Escribir el sistema 2x2 en forma canónica y resolver.'
errores_correccion: '- **Error común:** Intercambiar el número de patas (asignar 2
  patas al conejo y 4 a la gallina).

  - **Cómo corregirlo:** Asigna a los coeficientes los atributos biológicos o cuantitativos
  exactos del problema.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
