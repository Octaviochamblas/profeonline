semantic_id: MAT.ALG.SISTEMAS_2X2.MODELAMIENTO_BIDIMENSIONAL
resumen_inicial: Modelar bidimensionalmente un problema consiste en traducir sus condiciones verbales en un sistema de dos ecuaciones lineales con dos incógnitas.
explicacion_simple: |
  Cuando un problema escrito en palabras involucra **dos cantidades desconocidas** vinculadas mediante dos condiciones independientes (por ejemplo: la suma de dos números es 40 y su diferencia es 10), debemos estructurar un **sistema de ecuaciones 2x2**.

  Definimos una variable $x$ para la primera cantidad y otra variable $y$ para la segunda cantidad, especificando sus respectivas unidades.

  A continuación, traducimos cada restricción del enunciado en una ecuación lineal independiente que relacione a ambas variables.
explicacion_formal: |
  ### Definición formal
  Dado un problema contextual con dos variables desconocidas $x, y$, el **modelamiento bidimensional** construye el sistema lineal canónico:

  $$\begin{cases} f_1(x, y) = c_1 \\ f_2(x, y) = c_2 \end{cases} \implies \begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$$

  ### Desglose de la fórmula
  - $x, y$: Incógnitas algebraicas independientes declaradas.
  - $c_1, c_2$: Totales numéricos o restricciones constantes entregadas en el enunciado verbal.

  ### Síntesis didáctica
  Se requieren exactamente dos condiciones algebraicamente independientes para determinar de forma única la solución $(x_0, y_0)$.
definiciones_clave: |
  - **Modelamiento bidimensional**: Proceso de abstracción matemática que traduce situaciones con dos magnitudes desconocidas en un sistema de ecuaciones $2 \times 2$.
  - **Condiciones independientes**: Proposiciones del enunciado que aportan relaciones numéricas distintas y no redundantes entre las variables.
propiedades_relaciones: |
  - **Asignación de coeficientes ponderadores**: En problemas de mezcla o conteo, los coeficientes de las variables representan tasas o atributos individuales (patas, precios, pesos).
  - **Suficiencia del modelo**: Un sistema de dos variables requiere dos ecuaciones independientes para no ser indeterminado.
ejemplo_guiado:
  enunciado: 'En un corral hay conejos y gallinas. En total hay $35\text{ cabezas}$ y $94\text{ patas}$. Plantea el sistema 2x2 para hallar el número de conejos $c$ y gallinas $g$.'
  pasos:
    - 'Paso 1: Declarar las incógnitas de forma precisa: sea $c = \text{número de conejos}$ y $g = \text{número de gallinas}$.'
    - 'Paso 2: Traducir la condición del número total de animales (cabezas): $c + g = 35$.'
    - 'Paso 3: Traducir la condición de patas (conejos poseen 4 patas, gallinas 2 patas): $4c + 2g = 94$.'
    - 'Paso 4: Formular el sistema $2 \times 2$ completo: $\begin{cases} c + g = 35 \\ 4c + 2g = 94 \end{cases}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al modelar el problema de las 35 cabezas y 94 patas entre conejos ($c$) y gallinas ($g$), ¿cuál es el sistema 2x2 correcto?'
    choices:
      - {text: '$\begin{cases} c + g = 35 \\ 4c + 2g = 94 \end{cases}$', is_correct: true}
      - {text: '$\begin{cases} c + g = 94 \\ 4c + 2g = 35 \end{cases}$', is_correct: false}
      - {text: '$\begin{cases} 2c + 4g = 94 \\ c - g = 35 \end{cases}$', is_correct: false}
      - {text: '$\begin{cases} 4c + 4g = 94 \\ c + g = 35 \end{cases}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\begin{cases} c + g = 35 \\ 4c + 2g = 94 \end{cases}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver por reducción el sistema $\begin{cases} c + g = 35 \\ 4c + 2g = 94 \end{cases}$, ¿cuántos conejos $c$ hay en el corral?'
    choices:
      - {text: '$c = 12\text{ conejos}$', is_correct: true}
      - {text: '$c = 23\text{ conejos}$', is_correct: false}
      - {text: '$c = 15\text{ conejos}$', is_correct: false}
      - {text: '$c = 10\text{ conejos}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = 12\text{ conejos}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos cantidades desconocidas y asignarles variables ($x$ e $y$) indicando sus unidades.'
  - 'Paso 2: Localizar la primera condición verbal del texto y traducirla a la Ecuación 1.'
  - 'Paso 3: Localizar la segunda condición verbal del texto y traducirla a la Ecuación 2.'
  - 'Paso 4: Agrupar ambas igualdades en la estructura estándar de un sistema 2x2.'
  - 'Paso 5: Resolver el sistema por el método algebraico más conveniente (reducción, sustitución o igualación).'
errores_correccion: |
  - **Error 1:** Intercambiar los coeficientes atributivos de las variables (asignar 2 patas al conejo $c$ y 4 patas a la gallina $g$). **Cómo corregirlo:** Asignar como coeficiente numérico de cada variable **SU ATRIBUTO INDIVIDUAL REAL (LOS CONEJOS TIENEN 4 PATAS Y LAS GALLINAS 2 PATAS: $4c + 2g = 94$)**.
  - **Error 2:** Mezclar las unidades de las restricciones en una misma ecuación (sumar el total de patas con el total de cabezas en la misma igualdad). **Cómo corregirlo:** Cada ecuación **DEBE MODELAR UNA ÚNICA DIMENSIÓN DEL PROBLEMA (UNA ECUACIÓN PARA CONTEO DE CABEZAS Y OTRA ECUACIÓN PARA CONTEO DE PATAS)**.
ejemplos:
  - titulo: 'Ejemplo 1: Problema de dinero'
    enunciado: 'Se compran 5 entradas de adulto ($a$) y 3 de niño ($n$) pagando $\$29.000$. Si la de adulto cuesta $\$3.000$ más que la de niño, plantea el sistema.'
    alternativas:
      - '$\begin{cases} 5a + 3n = 29000 \\ a - n = 3000 \end{cases}$'
      - '$\begin{cases} a + n = 29000 \\ 5a + 3n = 3000 \end{cases}$'
      - '$\begin{cases} 5a - 3n = 29000 \\ a + n = 3000 \end{cases}$'
    respuesta: '$\begin{cases} 5a + 3n = 29000 \\ a - n = 3000 \end{cases}$'
    solucion_pasos:
      - '1. Condición 1 (pago total): $5a + 3n = 29000$.'
      - '2. Condición 2 (diferencia de precios): $a = n + 3000 \implies a - n = 3000$.'
  - titulo: 'Ejemplo 2: Números en relación'
    enunciado: 'La suma de dos números es 50 y el mayor es el triple del menor. Plantea el sistema.'
    alternativas:
      - '$\begin{cases} x + y = 50 \\ x = 3y \end{cases}$'
      - '$\begin{cases} x + 3y = 50 \\ x + y = 3 \end{cases}$'
      - '$\begin{cases} 3x + y = 50 \\ x - y = 3 \end{cases}$'
    respuesta: '$\begin{cases} x + y = 50 \\ x = 3y \end{cases}$'
    solucion_pasos:
      - '1. Suma: $x + y = 50$.'
      - '2. Relación de multiplicación: $x = 3y$.'
  - titulo: 'Dos variables obligatorias'
    enunciado: '¿El modelamiento bidimensional exige definir dos incógnitas distintas para las magnitudes desconocidas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, permite relacionar dos dimensiones independientes del problema.'
  - titulo: 'Independencia de ecuaciones'
    enunciado: '¿Se requieren dos ecuaciones independientes para que el sistema tenga solución única?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, dos condiciones distintas evitan la indeterminación.'
errores_frecuentes:
  - 'En el problema del corral con conejos ($c$) y gallinas ($g$), se invierten los coeficientes atributivos de patas escribiendo $2c + 4g = 94$.'
  - 'En el problema de cabezas y patas, se mezclan las unidades en una misma ecuación sumando cabezas con patas como $c + g + 4c + 2g = 94$.'
  - 'Al modelar un problema contextual bidimensional se construye una única ecuación con dos variables en lugar de un sistema de dos ecuaciones independientes.'
  - 'Al traducir "la entrada de adulto cuesta $\$3.000$ más que la de niño", la relación se plantea multiplicativamente como $a = 3000n$.'
  - 'Las variables $x$ e $y$ en un problema de compras se definen únicamente como los nombres de los productos prescindiendo de las cantidades numéricas.'
afirmaciones_verdaderas:
  - 'El modelamiento bidimensional traduce situaciones de dos variables en un sistema de dos ecuaciones independientes.'
  - 'Cada ecuación del sistema 2x2 representa una restricción o condición específica planteada en el problema verbal.'
al_terminar_debes_poder: |
  QUÉ: Plantear e interpretar sistemas de ecuaciones lineales 2x2 a partir de problemas verbales contextualizados.
  CÓMO: Asignar dos variables $x, y$, estructurar las dos ecuaciones de restricción independientes, resolver el sistema y reportar las respuestas con sus unidades.
