semantic_id: MAT.ALG.SISTEMAS_2X2.MODELAMIENTO_BIDIMENSIONAL
resumen_inicial: 'Planteamiento de un sistema 2x2 desde un problema contextual: propiedades,
  resolución y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: 'Ejemplo clásico de la granja:'
explicacion_formal: '### Definición formal


  Modelar un problema con un sistema lineal $2\times2$ consiste en traducir dos condiciones
  independientes del contexto a dos ecuaciones lineales en dos incógnitas. Si $x$
  e $y$ representan cantidades desconocidas del problema, cada relación verbal se
  expresa como una igualdad algebraica de la forma

  $$a_1x+b_1y=c_1,\qquad a_2x+b_2y=c_2.$$

  El sistema resultante conserva la estructura cuantitativa del problema y su solución
  algebraica representa los valores que satisfacen simultáneamente todas las condiciones
  modeladas.


  ### Desarrollo didáctico


  Ejemplo clásico de la granja:

  ''En una granja hay gallinas ($x$) y vacas ($y$). En total hay 30 cabezas y 100
  patas.''

  Aquí tienes dos mundos (dos ecuaciones):

  - El mundo de las cabezas (cada animal tiene 1): $1x + 1y = 30$.

  - El mundo de las patas (gallinas tienen 2, vacas tienen 4): $2x + 4y = 100$.


  Acabas de modelar el problema. Ahora aplicas reducción, sustitución o igualación.'
definiciones_clave: '- **Planteamiento de un sistema 2x2 desde un problema contextual**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a planteamiento de un sistema 2x2 desde un
  problema contextual.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando planteamiento de
    un sistema 2x2 desde un problema contextual.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de planteamiento de un
    sistema 2x2 desde un problema contextual.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
