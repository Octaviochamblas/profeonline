semantic_id: MAT.GEO.ROTACION_PLANO.CENTRO_ROTACION
resumen_inicial: 'Identificación del centro de rotación: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'El centro de rotación es como el ''eje'' de una rueda: el único
  punto que no se mueve mientras todo lo demás gira a su alrededor.'
explicacion_formal: '![Centro de rotación](/static/img/geometria/isometrias/rotacion-centro.svg)


  ### Definición formal


  En una rotación, el centro $O$ es el único punto del plano que no cambia de posición.
  Todo otro punto $P$ se transforma en $P''$ de modo que $OP=OP''$ (la distancia al
  centro se conserva) y el ángulo $\angle POP''$ es el ángulo de rotación.


  ### Desarrollo didáctico


  En la figura, el punto $O$ (el origen) es el centro de rotación: el punto $P$ gira
  a su alrededor hasta convertirse en $P''$, manteniendo siempre la misma distancia
  a $O$.'
definiciones_clave: '- **Identificación del centro de rotación**: Elemento o propiedad
  fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del centro de rotación.'
ejemplo_guiado:
  enunciado: Al realizar la transformación isométrica sobre identificación del centro
    de rotación, se aplica la regla al punto $P(2, 9)$ con parámetro $v = (7, -6)$.
    Halla las coordenadas de la imagen $P'$.
  pasos:
  - Identificar la función de transformación asociada a identificación del centro
    de rotación.
  - Aplicar la operación sobre el punto $P(2, 9)$.
  - Concluir las coordenadas del punto transformado $P'$.
