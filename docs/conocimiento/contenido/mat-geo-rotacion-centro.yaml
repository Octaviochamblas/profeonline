procedimiento:
- 'Paso 1: Identifica el punto que permanece fijo durante la transformación.'
- 'Paso 2: Verifica que todos los demás puntos mantengan la misma distancia a ese
  punto fijo antes y después de la rotación.'
- 'Paso 3: Concluye que ese punto fijo es el centro de rotación.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del centro de rotación.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del centro de rotación para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación del centro de rotación.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del centro de rotación
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación del centro de rotación.
- titulo: ¿Se cumple siempre la propiedad principal de identificación del centro de
    rotación en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del centro de rotación asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del centro de rotación.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del centro de rotación.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del centro de rotación.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del centro de rotación.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de identificación
