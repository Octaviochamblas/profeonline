semantic_id: MAT.ALG.FUNCION_AFIN.GRAFICA_DESDE_PARAMETROS
resumen_inicial: Graficar una función afín a partir de sus parámetros $m$ y $b$ permite trazar la recta mediante el intercepto $(0, b)$ y el desplazamiento indicado por la pendiente.
explicacion_simple: |
  Para graficar $f(x) = mx + b$ usando sus parámetros:

  1. Ubicas el **coeficiente de posición $b$** como un punto $(0, b)$ sobre el eje vertical $Y$.
  2. Desde ese punto $(0, b)$, te mueves $1$ paso a la derecha (avance en $X$) y $m$ pasos hacia arriba o abajo según la **pendiente $m$**.
  3. Marcas ese segundo punto $(1, b + m)$ y unese ambos con una recta.
explicacion_formal: |
  Sea la función afín $f(x) = mx + b$. La gráfica $\text{Graf}(f) \subset \mathbb{R}^2$ queda unívocamente determinada por:

  - El punto de corte inicial con el eje $Y$: $P_1 = (0, b)$.
  - Un punto secundario derivado del vector director $(1, m)$: $P_2 = (1, b + m)$.

  **Ecuación vectorial de la gráfica:**
  $$\begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} 0 \\ b \end{pmatrix} + t \begin{pmatrix} 1 \\ m \end{pmatrix}, \quad t \in \mathbb{R}$$
definiciones_clave: |
  - **Trazado por parámetros**: Método de graficación directa a partir de la coordenada de corte $(0, b)$ y el vector de avance de la pendiente $m$.
propiedades_relaciones: |
  - **Eficiencia del trazado**: No requiere construir una tabla extensa de valores; basta con identificar la ordenada al origen y aplicar la razón de cambio $\frac{\Delta y}{\Delta x}$.
ejemplo_guiado:
  enunciado: "Grafica la función afín $f(x) = 2x - 3$ utilizando sus parámetros $m$ y $b$."
  pasos:
    - 'Paso 1: Identificar el coeficiente de posición $b = -3 \implies$ ubicar el punto $P_1(0, -3)$ en el eje $Y$.'
    - 'Paso 2: Identificar la pendiente $m = 2 \implies$ avanzar $1$ unidad a la derecha y subir $2$ unidades.'
    - 'Paso 3: Calcular el segundo punto: $P_2(0 + 1, -3 + 2) = P_2(1, -1)$.'
    - 'Paso 4: Trazar la recta continua que une los puntos $(0, -3)$ y $(1, -1)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Para graficar $f(x) = 2x - 3$ usando sus parámetros, ¿cuáles son los dos primeros puntos clave a ubicar?"
    choices:
      - {text: "$P_1(0, -3)$ y $P_2(1, -1)$", is_correct: true}
      - {text: "$P_1(0, 2)$ y $P_2(1, 3)$", is_correct: false}
      - {text: "$P_1(-3, 0)$ y $P_2(2, 0)$", is_correct: false}
      - {text: "$P_1(0, 0)$ y $P_2(2, -3)$", is_correct: false}
    explanation: "La alternativa correcta es '$P_1(0, -3)$ y $P_2(1, -1)$'. $P_1 = (0, b) = (0, -3)$ y $P_2 = (1, b + m) = (1, -1)$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si $f(x) = -x + 4$, ¿cuál es el punto de inicio sobre el eje $Y$ y hacia dónde te desplazas para el segundo punto?"
    choices:
      - {text: "Inicia en $(0, 4)$, avanzas 1 a la derecha y bajas 1 unidad.", is_correct: true}
      - {text: "Inicia en $(4, 0)$, avanzas 1 a la derecha y subes 1 unidad.", is_correct: false}
      - {text: "Inicia en el origen $(0, 0)$ y subes 4 unidades.", is_correct: false}
      - {text: "Inicia en $(0, -1)$ y avanzas 4 a la derecha.", is_correct: false}
    explanation: "La alternativa correcta es 'Inicia en $(0, 4)$, avanzas 1 a la derecha y bajas 1 unidad.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer $b$ y marcar el intercepto $(0, b)$ en el eje vertical.'
  - 'Paso 2: Expresar la pendiente como fracción $m = \frac{\Delta y}{\Delta x}$.'
  - 'Paso 3: Avanzar $\Delta x$ unidades a la derecha y $\Delta y$ unidades verticalmente para ubicar el segundo punto.'
  - 'Paso 4: Trazar la recta continua extendida a través de ambos puntos.'
errores_correccion: |
  - **Error común:** Confundir el eje de inicio marcando el coeficiente de posición $b$ sobre el eje horizontal $X$.
  - **Cómo corregirlo:** El coeficiente $b$ representa el intercepto en el eje **VERTICAL $Y$** ($(0, b)$), no en el eje $X$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La gráfica de la función afín $f(x) = 2x - 3$ inicia marcando el valor $-3$ sobre el eje horizontal de las abscisas ($X$).'
  - 'Una pendiente $m = 3$ en $f(x) = 3x + 1$ indica avanzar 3 unidades a la derecha por cada 1 unidad que se sube.'
  - 'Graficar una función afín exige determinar obligatoriamente el cero de la función como paso inicial.'
  - 'Si el coeficiente de posición es negativo $b < 0$, la pendiente de la recta es automáticamente negativa.'
  - 'Para trazar la gráfica de una función afín desde sus parámetros se requiere calcular la raíz cuadrada de la constante $b$.'
afirmaciones_verdaderas:
  - 'Para graficar $f(x) = mx + b$ mediante sus parámetros, se ubica primero el punto $(0, b)$ en el eje $Y$ y luego se aplica la variación de la pendiente $m$.'
  - 'El coeficiente $b$ fija la posición vertical de la recta mientras que la pendiente $m$ determina la inclinación de su trazado.'
al_terminar_debes_poder: |
  QUÉ: Graficar funciones afines en el plano cartesiano a partir de su pendiente $m$ y coeficiente de posición $b$.
  CÓMO: Ubicar el punto $(0, b)$, aplicar la razón de variación $\frac{\Delta y}{\Delta x}$ para hallar un segundo punto y trazar la recta.
