semantic_id: MAT.ALG.FUNCION_AFIN.GRAFICA_DESDE_PARAMETROS
resumen_inicial: 'Para graficar una función afín a partir de $m$ y $n$: se ubica el
  corte $(0, n)$ y se avanza según la pendiente $m$.'
explicacion_simple: 'Para graficar $f(x) = m x + n$ sin hacer una gran tabla:

  1. Marcar el punto inicial de corte con el eje $Y$: $(0, n)$.

  2. Usar la pendiente $m = \frac{\Delta y}{\Delta x}$: desde $(0, n)$, avanzar $\Delta
  x$ unidades a la derecha y subir o bajar $\Delta y$ unidades.

  3. Marcar el segundo punto resultante y trazar la recta que une ambos puntos.'
explicacion_formal: 'Dados los parámetros $m = \frac{p}{q}$ y $n$ de la función afín
  $f(x)$:


  $$P_1 = (0, n) \quad \text{y} \quad P_2 = (0 + q, n + p)$$


  **Desglose de la fórmula:**

  - Construcción geométrica rápida de la recta pasando por el par de puntos $P_1$
  y $P_2$ fijados por el intercepto $n$ y la tasa de cambio de la pendiente $m$.'
definiciones_clave: '- **Construcción paramétrica**: Trazado cartesiano directo basado
  en el par de datos $(m, n)$.'
propiedades_relaciones: '- **Método del triángulo pendiente**: Triángulo rectángulo
  de cateto horizontal $\Delta x$ y cateto vertical $\Delta y$ apoyado en la recta.'
ejemplo_guiado:
  enunciado: Grafica la función afín $f(x) = \frac{3}{2}x + 1$ utilizando sus parámetros.
  pasos:
  - 'Paso 1: Identificar $n = 1 \implies$ marcar el primer punto $P_1(0, 1)$ en el
    eje $Y$.Paso 2: Identificar la pendiente $m = \frac{3}{2}$ (avanza $2$ en $X$,
    sube $3$ en $Y$).Paso 3: Desde $(0, 1)$, mover 2 unidades a la derecha ($x = 2$)
    y subir 3 unidades ($y = 1 + 3 = 4$) $\implies P_2(2, 4)$.Paso 4: Trazar la recta
    que une $P_1(0, 1)$ y $P_2(2, 4)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al graficar $f(x) = \frac{3}{2}x + 1$ desde sus parámetros, ¿cuáles son
    los dos puntos obtenidos?
  choices:
  - text: $P_1(0, 1)$ y $P_2(2, 4)$
    is_correct: true
  - text: $P_1(1, 0)$ y $P_2(4, 2)$
    is_correct: false
  - text: $P_1(0, 3)$ y $P_2(2, 1)$
    is_correct: false
  - text: $P_1(0, 0)$ y $P_2(3, 2)$
    is_correct: false
  explanation: La alternativa correcta es '$P_1(0, 1)$ y $P_2(2, 4)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la pendiente es un número entero como $m = -3$, ¿cuánto se debe avanzar
    a la derecha en el eje X para aplicar el cambio vertical?
  choices:
  - text: Avanzar 1 unidad a la derecha (puesto que $-3 = \frac{-3}{1}$).
    is_correct: true
  - text: Avanzar 3 unidades a la derecha.
    is_correct: false
  - text: No se puede avanzar a la derecha.
    is_correct: false
  - text: Avanzar 0 unidades.
    is_correct: false
  explanation: La alternativa correcta es 'Avanzar 1 unidad a la derecha (puesto que
    $-3 = \frac{-3}{1}$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar y marcar el punto del coeficiente de posición $(0, n)$ en el eje
  $Y$.'
- 'Paso 2: Escribir la pendiente como fracción $m = \frac{\Delta y}{\Delta x}$.'
- 'Paso 3: Avanzar $\Delta x$ a la derecha y desplazarse $\Delta y$ según su signo
  para hallar un segundo punto.'
- 'Paso 4: Unir los dos puntos con una regla.'
errores_correccion: '- **Error común:** Moverse hacia la izquierda al aplicar la pendiente.

  - **Cómo corregirlo:** Mantén SIEMPRE la convención de moverte a la DERECHA en $X$
  por el valor del denominador, y subir (si $m>0$) o bajar (si $m<0$) en $Y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
