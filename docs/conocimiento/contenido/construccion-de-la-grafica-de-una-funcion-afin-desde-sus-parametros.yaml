semantic_id: MAT.ALG.FUNCION_AFIN.GRAFICA_DESDE_PARAMETROS
resumen_inicial: Construir la gráfica de una función afín desde sus parámetros consiste en anclar el punto $(0, n)$ en el eje $Y$ y aplicar la pendiente $m = \frac{\Delta y}{\Delta x}$ para trazar la recta.
explicacion_simple: "![Construir la gráfica de una función afín desde sus parámetros consiste en anclar el punto $(0, n)$ en el eje $Y$ y aplicar la pendiente $m = \\frac{\\Delta y}{\\Delta x}$ para trazar la recta](/static/img/nodos/construccion-de-la-grafica-de-una-funcion-afin-desde-sus-parametros-intro.svg)\n\n\nPara graficar cualquier función afín $y = mx + n$ en segundos:\n1. **Paso 1 (Anclaje):** Marcas el punto $(0, n)$ sobre el eje vertical $Y$.\n2. **Paso 2 (Avance):** Desde ese punto $(0, n)$, te mueves según la pendiente $m = \\frac{\\Delta y}{\\Delta x}$:\n   - Avanzas $\\Delta x$ unidades a la derecha en el eje horizontal.\n   - Subes $\\Delta y$ unidades si $m > 0$ (o bajas si $m < 0$).\n3. **Paso 3 (Trazado):** Marcas el segundo punto y unes ambos con una regla."
explicacion_formal: 'Dada la ecuación $y = mx + n$, la recta queda unívocamente determinada en $\mathbb{R}^2$ por el par de puntos:

  $$P_1 = (0, n) \quad \text{y} \quad P_2 = (\Delta x, n + \Delta y) = (1, n + m)$$


  **Algoritmo para pendiente racional $m = \frac{a}{b}$ ($b > 0$):**

  1. Posicionar el punto de anclaje $P_1(0, n)$.

  2. Desplazar $b$ unidades hacia la derecha en $X$ (abscisa $x = b$).

  3. Desplazar $a$ unidades en $Y$ (ordenada $y = n + a$).

  4. Marcar $P_2(b, n + a)$ y trazar la recta secante $\overleftrightarrow{P_1P_2}$.'
definiciones_clave: '- **Punto de anclaje**: Coordenada $(0, n)$ sobre el eje de ordenadas.

  - **Paso de pendiente**: Desplazamiento vectorial $(\Delta x, \Delta y)$ que define la inclinación exacta.'
propiedades_relaciones: '- **Construcción sin tabla**: Evita realizar evaluaciones aritméticas extensas.

  - **Control de precisión**: Permite elegir puntos enteros seleccionando $\Delta x = b$ cuando la pendiente es fraccionaria.'
ejemplo_guiado:
  enunciado: '![Ejemplo Construir la gráfica de una función afín desde sus parámetros consiste en anclar el punto $(0, n)$ en el eje $Y$ y aplicar la pendiente $m = \frac{\Delta y}{\Delta x}$ para trazar la recta](/static/img/nodos/construccion-de-la-grafica-de-una-funcion-afin-desde-sus-parametros-ejemplos.svg)



    Grafica la función afín $f(x) = -\frac{2}{3}x + 4$ a partir de sus parámetros.'
  pasos:
  - 'Paso 1: Identificar parámetros: coeficiente de posición $n = 4$ y pendiente $m = -\frac{2}{3}$.'
  - 'Paso 2: Marcar el punto de anclaje en el eje Y: $P_1(0, 4)$.'
  - 'Paso 3: Aplicar la pendiente $m = \frac{-2}{3}$: desde $(0, 4)$, avanzar $\Delta x = 3$ unidades a la derecha y descender $\Delta y = -2$ unidades.'
  - 'Paso 4: Marcar el segundo punto: $P_2(0 + 3, 4 - 2) = (3, 2)$.'
  - 'Paso 5: Trazar la recta continua que une $(0, 4)$ y $(3, 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al graficar $y = 3x - 2$, ¿cuál es el punto de anclaje inicial sobre el eje Y?
  choices:
  - text: (0, -2)
    is_correct: true
  - text: (0, 3)
    is_correct: false
  - text: (-2, 0)
    is_correct: false
  - text: (0, 0)
    is_correct: false
  explanation: La alternativa correcta es '(0, -2)'. El punto de anclaje es $(0, n) = (0, -2)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Desde el punto $(0, 5)$, si la pendiente es $m = -3$, ¿cuál es el siguiente punto al avanzar 1 unidad a la derecha?
  choices:
  - text: (1, 2)
    is_correct: true
  - text: (1, 8)
    is_correct: false
  - text: (1, -3)
    is_correct: false
  - text: (-3, 5)
    is_correct: false
  explanation: 'La alternativa correcta es ''(1, 2)''. Al avanzar 1 en X y bajar 3 en Y: $(0+1, 5-3) = (1, 2)$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el coeficiente de posición $n$ y marcar el punto $(0, n)$ en el eje $Y$.'
- 'Paso 2: Interpretar la pendiente $m$ como la fracción $\frac{\Delta y}{\Delta x}$.'
- 'Paso 3: Desde $(0, n)$, desplazarse horizontalmente $\Delta x$ hacia la derecha y verticalmente $\Delta y$ según su signo.'
- 'Paso 4: Marcar el segundo punto obtenido y trazar la recta continua que une ambos puntos.'
errores_correccion: '- **Error común:** Iniciar el conteo de la pendiente desde el origen $(0, 0)$ en vez de hacerlo desde $(0, n)$.

  - **Cómo corregirlo:** La pendiente en una función afín debe contarse **a partir del punto de anclaje $(0, n)$**, no desde el centro $(0, 0)$.'
ejemplos:
- titulo: 'Ejemplo 1: Pendiente positiva entera'
  enunciado: Para graficar $y = 2x + 1$, ¿qué punto se obtiene al avanzar 1 a la derecha desde el anclaje?
  alternativas:
  - (1, 3)
  - (1, 2)
  - (1, 1)
  - (2, 1)
  respuesta: (1, 3)
  solucion_pasos:
  - 'Paso 1: Anclaje en $(0, 1)$.'
  - 'Paso 2: Avanzar 1 en X y subir 2 en Y: $(0+1, 1+2) = (1, 3)$.'
- titulo: 'Ejemplo 2: Pendiente fraccionaria'
  enunciado: En $y = \frac{4}{5}x - 2$, ¿cuál es el segundo punto más conveniente?
  alternativas:
  - (5, 2)
  - (4, 5)
  - (5, -2)
  - (1, 2)
  respuesta: (5, 2)
  solucion_pasos:
  - 'Paso 1: Anclaje en $(0, -2)$.'
  - 'Paso 2: Avanzar $\Delta x = 5$ y subir $\Delta y = 4$: $(5, -2+4) = (5, 2)$.'
- titulo: 'Ejemplo 3: Pendiente negativa'
  enunciado: Al graficar $y = -x + 3$, ¿qué punto se obtiene en $x = 2$?
  alternativas:
  - (2, 1)
  - (2, 5)
  - (2, -1)
  - (2, 3)
  respuesta: (2, 1)
  solucion_pasos:
  - 'Paso 1: $y = -2 + 3 = 1 \implies (2, 1)$.'
- titulo: 'Ejemplo 4: Intercepto negativo y pendiente negativa'
  enunciado: ¿Qué cuadrantes atraviesa la recta $y = -2x - 3$?
  alternativas:
  - Cuadrantes II, III y IV
  - Cuadrantes I, II y III
  - Cuadrantes I, III y IV
  - Solo cuadrantes II y IV
  respuesta: Cuadrantes II, III y IV
  solucion_pasos:
  - 'Paso 1: Corta al eje Y en $(0, -3)$ (abajo) y al eje X en $(-1.5, 0)$ (izquierda).'
  - 'Paso 2: Atraviesa los cuadrantes II, III y IV.'
errores_frecuentes:
- Contar la pendiente desde el origen en lugar de (0, n).
- Invertir el desplazamiento horizontal y vertical.
- Subir en pendientes negativas en lugar de bajar.
afirmaciones_verdaderas:
- Toda recta afín se grafica ubicando el punto de anclaje (0, n) y desplazándose según la razón m = Delta y / Delta x.
- Dos puntos calculados mediante los parámetros bastan para trazar la recta con regla.
al_terminar_debes_poder: '**QUÉ:** Construir gráficas de funciones afines de forma directa a partir de sus parámetros m y n.


  **CÓMO:** Ubicando el punto de anclaje (0, n) en el eje Y y aplicando el vector de pendiente (Δx, Δy) para definir el segundo punto.


  ![Resumen Construir la gráfica de una función afín desde sus parámetros consiste en anclar el punto $(0, n)$ en el eje $Y$ y aplicar la pendiente $m = \frac{\Delta y}{\Delta x}$ para trazar la recta](/static/img/nodos/construccion-de-la-grafica-de-una-funcion-afin-desde-sus-parametros-resumen.svg)'
