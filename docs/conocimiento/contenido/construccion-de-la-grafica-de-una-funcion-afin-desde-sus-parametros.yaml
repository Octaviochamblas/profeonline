semantic_id: MAT.ALG.FUNCION_AFIN.GRAFICA_DESDE_PARAMETROS
resumen_inicial: 'Construcción de la gráfica de una función afín desde sus parámetros:
  conceptos, representación y propiedades en Función afín.'
explicacion_simple: Con solo los dos parámetros $m$ y $n$ de la fórmula, puedes construir
  la gráfica completa sin necesidad de una tabla extensa de valores.
explicacion_formal: '### Definición formal


  Dada $f(x)=mx+n$, el punto $(0,n)$ pertenece a la gráfica. A partir de él, interpretando
  $m$ como $\dfrac{\Delta y}{\Delta x}$, se puede obtener un segundo punto avanzando
  $\Delta x$ unidades horizontalmente y $m \cdot \Delta x$ unidades verticalmente.


  ### Desarrollo didáctico


  El método rápido: marca $(0,n)$, y desde ahí "camina" según la pendiente: si $m=\frac{a}{b}$,
  avanza $b$ unidades a la derecha y $a$ unidades hacia arriba (o hacia abajo si $m$
  es negativo).


  Si $f(x)=2x+3$: se marca $(0,3)$, y desde ahí se avanza 1 unidad a la derecha y
  2 hacia arriba, llegando a $(1,5)$. Se traza la recta que une ambos puntos.'
definiciones_clave: '- **Construcción de la gráfica de una función afín desde sus
  parámetros**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a construcción de la gráfica de una función
  afín desde sus parámetros.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a construcción de
    la gráfica de una función afín desde sus parámetros.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a construcción de la gráfica de
    una función afín desde sus parámetros.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
