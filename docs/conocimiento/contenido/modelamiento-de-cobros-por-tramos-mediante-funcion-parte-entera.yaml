semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_COBROS_TRAMOS
resumen_inicial: El modelamiento de cobros por tramos mediante la función parte entera expresa tarifas escalonadas donde el costo aumenta en bloques discretos.
explicacion_simple: |
  En la vida real, muchos **servicios cobran por minutos u horas "iniciadas" o "completas"**:

  - **Estacionamiento**: Te cobran $\$1.000$ por cada hora o fracción de hora. Si estacionas $1{,}2$ horas, pagas por $2$ horas enteras.
  - **Envíos postales**: Cobran $\$500$ por cada tramo de $500$ gramos enteros o fracción.
  - Este tipo de tarifas donde el costo se mantiene constante en un tramo y da un "salto" al siguiente se modela con la **función parte entera** (o techo).
explicacion_formal: |
  Sea $t \ge 0$ la cantidad continua de un recurso (tiempo, masa, volumen). El modelo tarifario por tramos de tamaño $L > 0$ con costo fijo $C_0$ por tramo o fracción se expresa mediante la función escalonada:

  $$C(t) = C_0 \cdot \left\lceil \frac{t}{L} \right\rceil \quad \text{o en términos de piso} \quad C(t) = C_0 \cdot \left( \left\lfloor \frac{t}{L} \right\rfloor + 1 \right) \quad \text{para } t > 0$$

  **Propiedad de discontinuidad por tramos:**
  La función tarifa $C(t)$ es constante por intervalos semiabiertos $]kL, (k+1)L]$ y presenta discontinuidades de salto en los múltiplos del tramo $t = kL$.
definiciones_clave: |
  - **Cobro por tramos mediante parte entera**: Modelo matemático discreto que aplica tarifas fijas discontinuas según intervalos de consumo.
propiedades_relaciones: |
  - **Modelamiento de redondeo superior**: Para cobrar "fracción de hora como hora completa", se combina la función parte entera con ajustes de traslación para lograr el efecto techo $\lceil x \rceil$.
ejemplo_guiado:
  enunciado: 'Un estacionamiento cobra $\$1.200$ por cada hora o fracción de hora iniciada. Escribe el costo $C(t)$ para $t$ horas y calcula el total a pagar por un tiempo de $2{,}3$ horas.'
  pasos:
    - 'Paso 1: Identificar el valor por tramo: $C_0 = 1.200$.'
    - 'Paso 2: Identificar el efecto "fracción como hora completa": para $t = 2{,}3$, se pagan $3$ horas completas.'
    - 'Paso 3: Expresar mediante la regla de tramos: $C(2{,}3) = 1.200 \cdot \lceil 2{,}3 \rceil = 1.200 \cdot 3$.'
    - 'Paso 4: Calcular el costo final: $1.200 \cdot 3 = 3.600$ pesos.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un estacionamiento cobra $1.200 por cada hora o fracción de hora iniciada, ¿cuánto se paga por 2,3 horas?'
    choices:
      - {text: '$3.600 pesos', is_correct: true}
      - {text: '$2.400 pesos', is_correct: false}
      - {text: '$2.760 pesos', is_correct: false}
      - {text: '$4.800 pesos', is_correct: false}
    explanation: 'La alternativa correcta es ''$3.600 pesos''. Al estacionar 2,3 horas se inician 3 tramos de hora completa: $3 \cdot 1.200 = 3.600$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué tipo de gráfica representa a una tarifa comercial de cobro por tramos o fracciones de tiempo?'
    choices:
      - {text: 'Una gráfica escalonada con saltos en cada tramo.', is_correct: true}
      - {text: 'Una línea recta continua sin interrupciones.', is_correct: false}
      - {text: 'Una parábola suave que abre hacia arriba.', is_correct: false}
      - {text: 'Una curva exponencial creciente.', is_correct: false}
    explanation: 'La alternativa correcta es ''Una gráfica escalonada con saltos en cada tramo.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Determinar el tamaño del tramo $L$ y el costo por tramo $C_0$.'
  - 'Paso 2: Determinar si la fracción se cobra como tramo entero (redondeo hacia arriba).'
  - 'Paso 3: Construir la fórmula escalonada utilizando la función parte entera ajustada.'
  - 'Paso 4: Evaluar la función en el tiempo o consumo especificado para hallar la tarifa.'
errores_correccion: |
  - **Error común:** Calcular el cobro de $2{,}3$ horas multiplicando directamente $1.200 \cdot 2{,}3 = 2.760$ (modelo continuo afín).
  - **Cómo corregirlo:** La tarifa por tramos es **DISCONTINUA Y ESCALONADA**; no se cobra en decimales continuos sino en bloques enteros.
