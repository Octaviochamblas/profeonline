semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_COBROS_TRAMOS
resumen_inicial: El cobro por tramos o fracciones de tiempo (como estacionamientos
  o franqueo postal) se modela mediante la función parte entera.
explicacion_simple: 'Servicios como los **estacionamientos o tarifas de correo** no
  cobran por minutos exactos continuos, sino por **bloques o tramos comenzados**:

  - Si un estacionamiento cobra $\$800$ por cada hora o fracción de hora:

  - Permanecer 10 minutos (0,16 horas) cobra la 1ª hora completa ($\$800$).

  - Permanecer 1 hora y 5 minutos (1,08 horas) cobra 2 horas completas ($\$1.600$).

  Este redondeo hacia arriba de tramos se representa con variaciones de la parte entera.'
explicacion_formal: 'Un sistema de tarificación por bloques de tamaño $L > 0$ y tarifa
  por tramo $C_0$ se modela mediante la **función escalonada superior**:


  $$C(t) = C_0 \cdot \left( -\lfloor -t/L \rfloor \right)$$


  **Desglose de la fórmula:**

  - Utilización de la función parte entera para representar la función techo (redondeo
  al entero superior por tramos iniciados).'
definiciones_clave: '- **Modelamiento por tramos**: Uso de funciones discontinuas
  escalonadas para calcular tarifas en bloques discretos de insumo o tiempo.'
propiedades_relaciones: '- **Tarifa constante por intervalo**: El costo permanece
  invariable dentro de la franja del bloque y salta al sobrepasar el límite del tramo.'
ejemplo_guiado:
  enunciado: Un estacionamiento cobra $\$600$ por cada media hora ($30\text{ min}$)
    o fracción iniciada. Calcula el cobro para un cliente que estacionó durante $75\text{
    minutos}$.
  pasos:
  - 'Paso 1: Calcular cuántas medias horas ($30\text{ min}$) representan $75\text{
    minutos}$: $\frac{75}{30} = 2{,}5$ tramos.Paso 2: Como es por fracción iniciada,
    $2{,}5$ tramos se redondean hacia arriba al entero superior: $3$ tramos completos.Paso
    3: Multiplicar la cantidad de tramos por la tarifa: $3 \cdot 600 = 1.800$.Paso
    4: Concluir que el cobro total para $75\text{ minutos}$ es $\$1.800$.'
checkpoints:
- placement: after_explicacion_formal
  question: En el estacionamiento que cobra $\$600$ por cada $30\text{ min}$ o fracción,
    ¿cuál es el cobro total para un vehículo que estuvo $75\text{ minutos}$?
  choices:
  - text: $\$1.800$
    is_correct: true
  - text: $\$1.200$
    is_correct: false
  - text: $\$1.500$
    is_correct: false
  - text: $\$2.400$
    is_correct: false
  explanation: La alternativa correcta es '$\$1.800$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué estar $31\text{ minutos}$ cobra lo mismo que estar $60\text{
    minutos}$ en un cobro por medias horas iniciadas?
  choices:
  - text: Porque al pasar el minuto 30 se inicia el segundo tramo, cobrando 2 tramos
      completos en ambos casos.
    is_correct: true
  - text: Porque el tiempo se redondea a cero.
    is_correct: false
  - text: Porque la tarifa es constante.
    is_correct: false
  - text: Porque no se cobra el primer tramo.
    is_correct: false
  explanation: La alternativa correcta es 'Porque al pasar el minuto 30 se inicia
    el segundo tramo, cobrando 2 tramos completos en ambos casos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir la cantidad utilizada entre la longitud del tramo $L$.'
- 'Paso 2: Aplicar la regla del servicio (trunca hacia abajo o redondea hacia arriba
  el tramo iniciado).'
- 'Paso 3: Multiplicar el número de tramos enteros por el costo unitario del tramo.'
errores_correccion: '- **Error común:** Calcular el cobro proporcional decimal (hacer
  $2{,}5 \cdot 600 = 1.500$).

  - **Cómo corregirlo:** El cobro por tramos o fracciones NO ES PROPORCIONAL CONTINUO.
  Una fracción de minuto en un nuevo tramo cobra el tramo ENTERO completo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
