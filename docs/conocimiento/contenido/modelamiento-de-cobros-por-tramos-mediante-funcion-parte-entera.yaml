semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_COBROS_TRAMOS
resumen_inicial: 'Modelamiento de cobros por tramos mediante función parte entera:
  conceptos, representación y propiedades en Simetrías y funciones especiales.'
explicacion_simple: Los estacionamientos que cobran por hora completa (aunque hayas
  usado solo unos minutos de la siguiente hora) son el ejemplo perfecto de la vida
  real de la función parte entera en acción.
explicacion_formal: '### Definición formal


  Si el cobro es de $c$ pesos por cada tramo de duración $T$, y el tiempo usado es
  $t$, el número de tramos completados totalmente es $\left\lfloor \dfrac{t}{T} \right\rfloor$,
  y el cobro por tramos completos es $c \cdot \left\lfloor \dfrac{t}{T} \right\rfloor$.


  ### Desarrollo didáctico


  La clave es identificar si el cobro es "por tramo completo transcurrido" (parte
  entera) o "por tramo iniciado" (que normalmente requiere sumar 1 salvo en los múltiplos
  exactos, un caso distinto).


  Un estacionamiento cobra \$1000 por cada hora completa transcurrida. Si un auto
  estuvo $2{,}7$ horas, el número de horas completas es $\lfloor 2{,}7 \rfloor = 2$,
  así que el cobro por horas completas es $2 \times 1000 = \$2000$ (sin contar la
  hora parcial adicional, según las reglas específicas del estacionamiento).'
definiciones_clave: '- **Modelamiento de cobros por tramos mediante función parte
  entera**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a modelamiento de cobros por tramos mediante
  función parte entera.'
