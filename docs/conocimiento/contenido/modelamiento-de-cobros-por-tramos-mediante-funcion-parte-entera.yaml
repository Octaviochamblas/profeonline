procedimiento:
- 'Paso 1: Identifica la duración de cada tramo y el costo por tramo.'
- 'Paso 2: Divide el tiempo total usado por la duración del tramo.'
- 'Paso 3: Aplica la función parte entera a ese cociente para obtener el número de
  tramos completos.'
- 'Paso 4: Multiplica ese número por el costo de cada tramo.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar modelamiento de cobros por tramos mediante función parte entera.
ejemplos:
- titulo: Cálculo de cobro por horas completas
  enunciado: Un estacionamiento cobra \$800 por cada hora completa. Si un vehículo
    estuvo $3{,}5$ horas, ¿cuánto se cobra por las horas completas?
  solucion_pasos:
  - $\lfloor 3{,}5 \rfloor = 3$ horas completas.
  - $3 \times 800 = \$2400$.
- titulo: Cálculo con tiempo exacto
  enunciado: El mismo estacionamiento, si un vehículo estuvo exactamente $4$ horas,
    ¿cuánto se cobra?
  solucion_pasos:
  - $\lfloor 4 \rfloor = 4$ horas completas (el tiempo ya es entero).
  - $4 \times 800 = \$3200$.
- titulo: ¿La función parte entera modela cobros por tramo completo transcurrido?
  enunciado: ¿La función parte entera modela cobros por tramo completo transcurrido?
  respuesta: Sí
  solucion_pasos:
  - Redondea siempre hacia abajo, contando solo los tramos íntegramente completados.
- titulo: ¿$3{,}9$ horas cuentan como $4$ horas completas al aplicar parte entera?
  enunciado: ¿$3{,}9$ horas cuentan como $4$ horas completas al aplicar parte entera?
  respuesta: 'No'
  solucion_pasos:
  - $\lfloor 3{,}9 \rfloor = 3$, pues aún no se ha completado la cuarta hora.
errores_frecuentes:
- Redondear al entero más cercano en vez de aplicar la parte entera (redondeo hacia
  abajo).
- Confundir "cobro por tramo completado" con "cobro por tramo iniciado" (que exigiría
  sumar 1 en casos no exactos).
- Olvidar que un tiempo exactamente entero no genera cobro adicional por fracción
  de tramo.
- No dividir correctamente el tiempo total por la duración de cada tramo antes de
  aplicar la parte entera.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando modelamiento
  de cobros por tramos mediante función parte entera.
