errores_frecuentes:
  - 'En una tarifa de estacionamiento por hora o fracción, permanecer 2,1 horas exige pagar exactamente por 2 horas.'
  - 'Modelar un cobro por tramos se realiza mediante una función afín continua sin saltos verticales.'
  - 'La tarifa por tramos calculada con la función parte entera entrega resultados con decimales continuos.'
  - 'Permanecer 3,0 horas exactas en un cobro por fracción de hora obliga a pagar por 4 horas.'
  - 'La función parte entera en modelos comerciales produce siempre tarifas negativas para consumos de tiempo.'
afirmaciones_verdaderas:
  - 'Las tarifas por tramos de fracción de tiempo o masa se representan mediante funciones escalonadas basadas en la función parte entera.'
  - 'En un modelo de cobro por tramos, la tarifa permanece constante durante todo el tramo y experimenta un salto discreto al pasar al tramo siguiente.'
al_terminar_debes_poder: |
  QUÉ: Formular y resolver modelos de cobro por tramos o fracciones mediante la función parte entera.
  CÓMO: Identificar la cuota fija por tramo $C_0$, aplicar el operador escalonado y calcular la tarifa para consumos reales.
