semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.DELTOIDE_DIAGONALES
resumen_inicial: En el deltoide, las diagonales son perpendiculares entre sí y la diagonal principal dimidia a la secundaria, actuando como bisectriz.
explicacion_simple: 'Si observas la estructura de madera o varillas de un volantín (deltoide), notarás que forman una cruz perfecta: **sus dos diagonales se cortan a $90^\circ$ (son perpendiculares)**.


  Pero hay un detalle crucial: **solo una de las dos diagonales se corta por la mitad**. La varilla vertical larga (diagonal principal) parte a la varilla horizontal corta (diagonal secundaria) en dos mitades exactamente iguales. En cambio, la varilla vertical queda dividida en una parte corta arriba y una parte larga abajo. Además, la diagonal vertical corta a las esquinas superior e inferior exactamente por la mitad (es bisectriz).


  ![Propiedades de las diagonales en el deltoide](/static/img/nodos/propiedad-de-las-diagonales-en-el-deltoide-intro.svg)

  '
explicacion_formal: '### Teorema de las diagonales del deltoide

  Sea $\mathcal{ABCD}$ un deltoide con eje de simetría en la diagonal principal $\overline{AC}$ y diagonal secundaria $\overline{BD}$, cortándose en $M$. Se verifican las siguientes propiedades geométricas:

  1. **Perpendicularidad estricta:**

  $$\overline{AC} \perp \overline{BD} \iff \angle(\overline{AC}, \overline{BD}) = 90^\circ$$

  2. **Bisección unilateral:** La diagonal principal biseca a la secundaria en su punto medio, pero la principal no es bisecada:

  $$BM = MD = \frac{BD}{2} \quad \wedge \quad AM \neq MC$$

  3. **Bisectriz angular:** La diagonal principal es bisectriz interior de los ángulos $\angle A$ y $\angle C$:

  $$\angle BAM \cong \angle DAM \quad \wedge \quad \angle BCM \cong \angle DCM$$

  4. **Triángulos rectángulos generados:**

  El deltoide queda particionado en cuatro triángulos rectángulos en el centro, congruentes de a pares:

  $$\triangle ABM \cong \triangle ADM \quad \wedge \quad \triangle CBM \cong \triangle CDM$$


  > **Complemento didáctico:** Una pregunta capciosa frecuente es: ''¿se dimidian las dos diagonales del deltoide?''. ¡La respuesta es NO! Se dimidia solamente la diagonal secundaria. Si se dimidiaran las dos, la figura sería un rombo.

  '
definiciones_clave: '- **Diagonal principal**: Eje de simetría que une los vértices comunes de lados congruentes y biseca a la otra diagonal.

  - **Diagonal secundaria**: Segmento transversal bisecado perpendicularmente por la diagonal principal.

  - **Bisección unilateral**: Propiedad por la cual solo una de las dos diagonales queda dividida en dos segmentos congruentes.

  '
propiedades_relaciones: '- **Cálculo de lados con Pitágoras**: Cada lado se relaciona con las semidiagonales mediante $a = \sqrt{AM^2 + BM^2}$ y $b = \sqrt{CM^2 + BM^2}$.

  - **Mediatriz**: La diagonal principal es la mediatriz de la diagonal secundaria.

  - **Triángulos isósceles**: La diagonal secundaria $\overline{BD}$ divide al deltoide en dos triángulos isósceles $\triangle ABD$ y $\triangle CBD$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de diagonales en deltoide](/static/img/nodos/propiedad-de-las-diagonales-en-el-deltoide-ejemplos.svg)


    En un deltoide $ABCD$ con eje en $AC$, la diagonal secundaria $BD$ mide $12$ cm, el segmento superior de la diagonal principal mide $AM = 5$ cm y el segmento inferior mide $MC = 9$ cm. Calcula las longitudes de los lados $a$ y $b$ del deltoide.'
  pasos:
  - 'Paso 1: Calcular la semidiagonal secundaria: Al dimidiarse $BD$, $BM = MD = \frac{12}{2} = 6$ cm.'
  - 'Paso 2: Aplicar Pitágoras en el triángulo superior para hallar $a$: $a = \sqrt{AM^2 + BM^2} = \sqrt{5^2 + 6^2} = \sqrt{25 + 36} = \sqrt{61}$ cm.'
  - 'Paso 3: Aplicar Pitágoras en el triángulo inferior para hallar $b$: $b = \sqrt{MC^2 + BM^2} = \sqrt{9^2 + 6^2} = \sqrt{81 + 36} = \sqrt{117} = 3\sqrt{13}$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las diagonales de un deltoide queda dividida en dos partes exactamente iguales por el punto de intersección?
  choices:
  - text: Únicamente la diagonal secundaria.
    is_correct: true
  - text: Únicamente la diagonal principal.
    is_correct: false
  - text: Ambas diagonales se dividen en partes iguales.
    is_correct: false
  - text: Ninguna de las diagonales se divide en partes iguales.
    is_correct: false
  explanation: La alternativa correcta es 'Únicamente la diagonal secundaria.' La diagonal principal actúa como mediatriz de la secundaria, dividiéndola en dos mitades ($BM = MD$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ángulo forman las dos diagonales de un deltoide al cruzarse?
  choices:
  - text: Un ángulo recto de 90°.
    is_correct: true
  - text: Un ángulo agudo de 45°.
    is_correct: false
  - text: Un ángulo obtuso de 120°.
    is_correct: false
  - text: Depende de la medida de los lados.
    is_correct: false
  explanation: La alternativa correcta es 'Un ángulo recto de 90°.' Las diagonales de todo deltoide son estrictamente perpendiculares entre sí.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la diagonal principal (eje de simetría) y la diagonal secundaria.

  2. Establecer la perpendicularidad en el cruce ($90^\circ$).

  3. Dimidiar únicamente la diagonal secundaria ($BM = MD = d_2 / 2$).

  4. Utilizar los cuatro triángulos rectángulos resultantes con el Teorema de Pitágoras para hallar lados o semidiagonales.

  '
errores_correccion: '- **Error común 1:** Asumir que ambas diagonales se dimidian. **Corrección:** Solo se dimidia la secundaria; si ambas se dimidiaran sería un rombo.

  - **Error común 2:** Creer que las diagonales tienen la misma longitud. **Corrección:** En el deltoide no rombo las diagonales son desiguales.

  '
ejemplos:
- tipo: A
  titulo: Semidiagonal en deltoide
  enunciado: Si la diagonal secundaria de un deltoide mide $16\text{ cm}$, ¿cuánto mide el segmento desde el vértice lateral hasta el punto de corte?
  alternativas:
  - text: $8\text{ cm}$.
    is_correct: true
  - text: $16\text{ cm}$.
    is_correct: false
  - text: $4\text{ cm}$.
    is_correct: false
  - text: $32\text{ cm}$.
    is_correct: false
  explicacion: 'Como la diagonal secundaria queda dimidiada: $16 / 2 = 8\text{ cm}$.'
- tipo: B
  titulo: Perpendicularidad diagonal
  enunciado: ¿Son las diagonales de un deltoide siempre perpendiculares?
  respuesta: Sí
  explicacion: Sí. Las diagonales del deltoide forman siempre un ángulo de $90^\circ$ en su intersección.
errores_frecuentes:
- '''Creer que ambas diagonales se cortan en sus puntos medios.'''
- '''Olvidar que las diagonales forman cuatro triángulos rectángulos en el centro.'''
- '''Asumir que la diagonal secundaria es bisectriz de los ángulos laterales.'''
afirmaciones_verdaderas:
- '''Las diagonales de un deltoide son estrictamente perpendiculares entre sí.'''
- '''La diagonal principal del deltoide biseca a la diagonal secundaria en dos partes iguales.'''
- '''La diagonal principal es bisectriz de los dos ángulos interiores que conecta.'''
al_terminar_debes_poder: '**QUÉ:** Resolver problemas geométricos y aplicar el Teorema de Pitágoras a partir de las diagonales de un deltoide.


  **CÓMO:** Utilizando $d_1 \perp d_2$, la bisección unilateral $BM = MD$ y triángulos rectángulos.


  ![Síntesis de diagonales en deltoide](/static/img/nodos/propiedad-de-las-diagonales-en-el-deltoide-resumen.svg)

  '
