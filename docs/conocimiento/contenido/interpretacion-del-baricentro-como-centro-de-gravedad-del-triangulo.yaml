semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.BARICENTRO_CENTRO_GRAVEDAD
resumen_inicial: El baricentro ($G$) es el centro de gravedad (o centro de masa) de
  una placa o lámina triangular homogénea. Si el triángulo se apoya sobre una punta
  o pivote ubicado en $G$, la figura se mantiene en perfecto equilibrio horizontal.
explicacion_simple: '![Centro de Gravedad](/static/img/nodos/interpretacion-del-baricentro-como-centro-de-gravedad-del-triangulo-intro.svg)


  Si recortas un triángulo de cartón o madera y quieres equilibrarlo sobre la punta
  de un lápiz:


  - **El punto mágico es el baricentro ($G$)**: Si apoyas la punta exactamente en
  $G$, el triángulo se queda quieto y horizontal sin caerse.

  - **Centro de masa**: Es el punto donde se concentra todo el peso de la figura.

  - **Ningún otro punto logra esto**: Si intentas equilibrarlo en el ortocentro, incentro
  o circuncentro, el triángulo se inclinará y caerá.

  '
explicacion_formal: '### Fundamento físico y vectorial

  En mecánica clásica, si una lámina triangular delgada tiene densidad de masa superficial
  uniforme $\sigma$, su **centro de gravedad** (punto donde el momento de torsión
  gravitatorio neto es nulo) coincide exactamente con el baricentro geométrico $G$:


  $$\sum_{i=1}^3 (P_i - G) = \vec{0} \iff \vec{GA} + \vec{GB} + \vec{GC} = \vec{0}$$


  ### Desglose simbólico y geométrico

  - Punto de equilibrio isostático: Si se apoya el triángulo sobre una punta colocada
  en $G$, la figura se mantiene en perfecto equilibrio horizontal.

  - Centro de masa continuo: $\vec{r}_{\text{cm}} = \frac{1}{M} \iint_\Delta \vec{r}
  \, dm = \frac{A + B + C}{3}$.


  ### Síntesis didáctica

  El baricentro es el punto de balance físico ideal del triángulo donde se concentran
  todas las fuerzas gravitatorias de la superficie.'
definiciones_clave: '- **Centro de gravedad (Centro de masa)**: Punto de aplicación
  de la resultante de todas las fuerzas de gravedad que actúan sobre un cuerpo.

  - **Lámina homogénea**: Placa delgada con densidad de masa uniforme en toda su superficie.

  - **Torque nulo ($\vec{\tau} = \vec{0}$)**: Condición de equilibrio estático rotacional.

  '
propiedades_relaciones: '- **Equilibrio estático**: Apoyado en $G$, el triángulo no
  experimenta rotación ni inclinación.

  - **Coincidencia física-geométrica**: Centro de masa físico $\equiv$ Baricentro
  geométrico $G = \frac{A+B+C}{3}$.

  - **Líneas de balance**: Toda transversal de gravedad es una línea de equilibrio
  que divide al triángulo en dos regiones de igual masa.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Centro de Gravedad](/static/img/nodos/interpretacion-del-baricentro-como-centro-de-gravedad-del-triangulo-ejemplos.svg)


    Se construye una señalética triangular de metal homogéneo con vértices en $A(0,
    0)$, $B(12, 0)$ y $C(6, 9)$ (en centímetros). Se desea colocar un único poste
    de soporte vertical en su parte inferior de modo que la señalética quede perfectamente
    equilibrada en posición horizontal. ¿En qué coordenadas se debe instalar el poste?

    '
  pasos:
  - 'Paso 1: Identificar el principio físico: para equilibrio horizontal perfecto,
    el soporte debe ubicarse en el centro de gravedad (baricentro $G$).'
  - 'Paso 2: Calcular la coordenada $x_G$: $x_G = \frac{0 + 12 + 6}{3} = \frac{18}{3}
    = 6\text{ cm}$.'
  - 'Paso 3: Calcular la coordenada $y_G$: $y_G = \frac{0 + 0 + 9}{3} = \frac{9}{3}
    = 3\text{ cm}$.'
  - 'Paso 4: Concluir que el poste de soporte debe instalarse exactamente en el punto
    $G(6, 3)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué punto notable de un triángulo representa su centro de gravedad o
    centro de masa físico?
  choices:
  - text: El baricentro
    is_correct: true
  - text: El ortocentro
    is_correct: false
  - text: El incentro
    is_correct: false
  - text: El circuncentro
    is_correct: false
  explanation: El baricentro es el punto que representa el centro de gravedad o centro
    de masa de una placa triangular homogénea.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si se apoya una lámina triangular homogénea sobre una aguja vertical colocada
    en su baricentro, ¿qué sucede con la lámina?
  choices:
  - text: Se mantiene en perfecto equilibrio horizontal
    is_correct: true
  - text: Se inclina hacia el lado de mayor longitud
    is_correct: false
  - text: Cae inmediatamente
    is_correct: false
  - text: Rota continuamente
    is_correct: false
  explanation: Se mantiene en perfecto equilibrio horizontal, ya que el torque neto
