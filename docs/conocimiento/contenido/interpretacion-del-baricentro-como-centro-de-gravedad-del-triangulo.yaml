procedimiento:
- 'Paso 1: Identificar el problema de equilibrio físico de una lámina triangular uniforme.'
- 'Paso 2: Reconocer que el punto de equilibrio es el baricentro $G$.'
- 'Paso 3: Trazar las transversales de gravedad o calcular $G = \frac{A+B+C}{3}$.'
- 'Paso 4: Situar el punto de apoyo en las coordenadas obtenidas para garantizar torque
  neto cero.'
errores_correccion: No confundas el centro de gravedad (baricentro) con el centro
  de la circunferencia inscrita (incentro).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Por qué una lámina triangular se equilibra al apoyarla en su baricentro?
  alternativas:
  - Porque el torque o momento de fuerza gravitacional resultante es cero
  - Porque equidista de los tres lados
  - Porque los ángulos interiores suman 180°
  respuesta: Porque el torque o momento de fuerza gravitacional resultante es cero
  solucion_pasos:
  - La masa está distribuida simétricamente respecto a $G$, anulando los momentos
    de giro.
- titulo: Ejemplo 2
  enunciado: Si tres personas de igual peso se ubican en los tres vértices de una
    plataforma triangular ligera, ¿dónde debe colocarse el soporte central para que
    la plataforma no se incline?
  alternativas:
  - En el baricentro de la plataforma
  - En el incentro
  - En el ortocentro
  respuesta: En el baricentro de la plataforma
  solucion_pasos:
  - El centro de masa de tres masas idénticas situadas en los vértices coincide exactamente
    con el baricentro $G = \frac{A+B+C}{3}$.
- titulo: ¿El baricentro es el único punto notable que funciona como centro de gravedad
    físico de un triángulo homogéneo?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el centro de masa unívoco de la distribución continua de superficie.
- titulo: ¿El incentro es el centro de gravedad físico de una lámina triangular?
  respuesta: 'No'
  solucion_pasos:
  - No, el incentro es el centro de la circunferencia inscrita; el centro de gravedad
    es el baricentro.
errores_frecuentes:
- Confundir el baricentro con el incentro o circuncentro al resolver problemas de
  equilibrio.
- Pensar que el centro de gravedad depende del material si la lámina es homogénea
  (es puramente geométrico).
- Creer que el centro de masa de un triángulo puede estar fuera de la figura.
- Olvidar que las tres transversales dividen la masa en partes iguales.
- Confundir centro de masa con circuncentro.
afirmaciones_verdaderas:
- El baricentro de un triángulo coincide con el centro de masa de una placa triangular
  homogénea.
- Apoyar un triángulo en su baricentro produce un estado de equilibrio estático horizontal.
al_terminar_debes_poder: '**QUÉ:** Interpretar y aplicar el significado físico del
  baricentro como centro de gravedad del triángulo.


  **CÓMO:** Reconociendo que el baricentro anula los momentos de fuerza ($\vec{\tau}
  = \vec{0}$) y ubicándolo mediante el promedio aritmético $G = \frac{A+B+C}{3}$.


  ![Resumen de Centro de Gravedad](/static/img/nodos/interpretacion-del-baricentro-como-centro-de-gravedad-del-triangulo-resumen.svg)

  '
