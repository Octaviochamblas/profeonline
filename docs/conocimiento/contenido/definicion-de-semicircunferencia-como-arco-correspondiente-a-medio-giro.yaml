semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.SEMICIRCUNFERENCIA_DEFINICION
resumen_inicial: La semicircunferencia es el arco que abarca exactamente medio giro (180°), subtendido por los extremos de un diámetro.
explicacion_simple: 'Una **semicircunferencia** es exactamente la mitad de una circunferencia completa. Tiene una apertura angular de **$180^\circ$** (medio giro o un ángulo extendido llano) y sus extremos están conectados por un diámetro.


  Su longitud métrica curvada es facilísima: es simplemente la mitad del perímetro total, es decir, **$L = \pi r$**. Pero ten muchísimo cuidado si te piden el perímetro de un ''semicírculo cerrado'': un semicírculo cerrado tiene dos bordes: el borde curvo de arriba ($L = \pi r$) MÁS la base recta de abajo que es el diámetro ($2r$). ¡No olvides sumar el diámetro si la figura está cerrada!


  ![Definición de semicircunferencia](/static/img/nodos/definicion-de-semicircunferencia-como-arco-correspondiente-a-medio-giro-intro.svg)

  '
explicacion_formal: '### Definición formal de semicircunferencia

  Sea $\mathcal{C}(O, r)$ una circunferencia y sea $\overline{AB}$ un diámetro cualquiera ($O \in \overline{AB}$). El diámetro particiona a la circunferencia en dos arcos conexos disjuntos denominados **semicircunferencias**:

  $$\overset{\frown}{AB}_{\text{semi}} \iff m(\overset{\frown}{AB}) = 180^\circ = \pi\text{ rad}$$


  ### Longitud del arco semicircular

  Aplicando la fórmula general de arco para $\alpha = 180^\circ$:

  $$L = \frac{180^\circ}{360^\circ} \cdot 2\pi r = \frac{1}{2} \cdot 2\pi r = \pi r = \frac{\pi d}{2}$$


  ### Perímetro de la región semicircular cerrada

  Cuando se considera la figura plana del semicírculo como región cerrada delimitada por la semicircunferencia y el diámetro base:

  $$P_{\text{cerrado}} = \text{long}(\text{arco}) + \text{long}(\text{diámetro}) = \pi r + 2r = r(\pi + 2)$$


  > **Complemento didáctico:** ¡Atención a la redacción en las preguntas de la PAES! Si te piden ''la longitud de la semicircunferencia'', es solo el arco curvo: $\pi r$. Pero si te piden ''el perímetro del semicírculo'' o ''el contorno de una figura semicircular'', debes sumarle obligatoriamente el diámetro recto: $\pi r + 2r$.

  '
definiciones_clave: '- **Semicircunferencia**: Arco de circunferencia cuya medida angular es de exactamente $180^\circ$.

  - **Medio giro**: Rotación angular correspondiente a $\pi$ radianes o $180^\circ$.

  - **Perímetro de semicírculo cerrado**: Contorno total compuesto por el arco curvo más el segmento diametral ($P = \pi r + 2r$).

  '
propiedades_relaciones: '- **Simetría respecto al diámetro**: Las dos semicircunferencias generadas por un diámetro son especularmente congruentes.

  - **Lugar de ángulos rectos**: Cualquier punto $P$ de la semicircunferencia forma un ángulo recto $\angle APB = 90^\circ$ con los extremos del diámetro.

  - **Área del semicírculo asociado**: La región interior semicircular tiene un área de $A_{\text{semi}} = \frac{\pi r^2}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de semicircunferencia](/static/img/nodos/definicion-de-semicircunferencia-como-arco-correspondiente-a-medio-giro-ejemplos.svg)


    Un túnel tiene una sección transversal en forma de semicírculo con radio $r = 5\text{ m}$. Calcula la longitud del arco curvo del techo y el perímetro total cerrado del túnel si se incluye el suelo.'
  pasos:
  - 'Paso 1: Calcular la longitud del arco curvo de la semicircunferencia: $L = \pi r = 5\pi\text{ m}$.'
  - 'Paso 2: Calcular la longitud del suelo recto (diámetro): $d = 2r = 2(5) = 10\text{ m}$.'
  - 'Paso 3: Calcular el perímetro total cerrado sumando el arco más el suelo: $P = 5\pi + 10\text{ m}$.'
  - 'Paso 4: Factorizar el resultado: $P = 5(\pi + 2)\text{ m}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la longitud lineal del arco de una semicircunferencia de radio r?
  choices:
  - text: L = pi · r.
    is_correct: true
  - text: L = 2 · pi · r.
    is_correct: false
  - text: L = (pi · r) / 2.
    is_correct: false
  - text: L = pi · r².
    is_correct: false
  explanation: La alternativa correcta es 'L = pi · r.' Al ser la mitad de la circunferencia completa ($2\pi r / 2$), mide exactamente $\pi r$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un semicírculo cerrado tiene un radio de 4 cm. ¿Cuál es su perímetro total incluyendo el borde recto?
  choices:
  - text: 4pi + 8 cm.
    is_correct: true
  - text: 4pi cm.
    is_correct: false
  - text: 8pi cm.
    is_correct: false
  - text: 8pi + 8 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''4pi + 8 cm.'' Arco curvo $\pi r = 4\pi$ cm más diámetro $2r = 8$ cm: total $4\pi + 8$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el radio $r$ o el diámetro $d$.

  2. Para la longitud exclusiva del arco curvo, aplicar $L = \pi r$.

  3. Si se solicita el perímetro cerrado de la figura, sumar el diámetro: $P = \pi r + 2r$.

  4. Para el área del semicírculo asociado, dividir el área total entre dos: $A = (\pi r^2) / 2$.

  '
errores_correccion: '- **Error común 1:** Olvidar sumar el diámetro al calcular el perímetro de un semicírculo cerrado. **Corrección:** Toda figura plana cerrada debe sumar todos sus bordes (el arco y la base recta).

  - **Error común 2:** Confundir la semicircunferencia ($180^\circ$) con un cuadrante ($90^\circ$). **Corrección:** La semicircunferencia abarca medio giro completo ($180^\circ$).

  '
ejemplos:
- tipo: A
  titulo: Longitud de semicircunferencia
  enunciado: Una semicircunferencia tiene un diámetro de $16\text{ cm}$. ¿Cuál es la longitud de su arco curvo?
  alternativas:
  - text: $8\pi\text{ cm}$.
    is_correct: true
  - text: $16\pi\text{ cm}$.
    is_correct: false
  - text: $4\pi\text{ cm}$.
    is_correct: false
  - text: $8\pi + 16\text{ cm}$.
    is_correct: false
  explicacion: El radio es $r = 16 / 2 = 8\text{ cm}$. La longitud del arco es $L = \pi r = 8\pi\text{ cm}$.
- tipo: B
  titulo: Ángulo de la semicircunferencia
  enunciado: ¿Mide la semicircunferencia siempre un ángulo central de 180°?
  respuesta: Sí
  explicacion: Sí. Al corresponder a medio giro completo, su medida angular es invariablemente $180^\circ$.
errores_frecuentes:
- '''Olvidar sumar el diámetro al perímetro de un semicírculo cerrado.'''
- '''Creer que la longitud de la semicircunferencia es $2\pi r$.'''
- '''Confundir el área del semicírculo con la longitud de su arco.'''
afirmaciones_verdaderas:
- '''La semicircunferencia es un arco que corresponde a medio giro ($180^\circ$).'''
- '''La longitud métrica del arco semicircular es exactamente $L = \pi r$.'''
- '''El perímetro de una región semicircular cerrada es $P = \pi r + 2r$.'''
al_terminar_debes_poder: '**QUÉ:** Calcular longitudes de semicircunferencias y perímetros de figuras semicirculares cerradas.


  **CÓMO:** Aplicando $L = \pi r$ y $P_{\text{cerrado}} = \pi r + 2r$.


  ![Síntesis de semicircunferencia](/static/img/nodos/definicion-de-semicircunferencia-como-arco-correspondiente-a-medio-giro-resumen.svg)

  '
