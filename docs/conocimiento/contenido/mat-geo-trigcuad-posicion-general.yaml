semantic_id: MAT.GEO.TRIG_CUADRANTES.ANGULO_POSICION_GENERAL
resumen_inicial: 'Concepto de ángulo en posición general en el plano cartesiano: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Para estudiar la trigonometría más allá de los triángulos rectángulos,
  los ángulos se representan en el plano cartesiano, con su vértice en el origen,
  lo que permite definir razones trigonométricas para cualquier ángulo, no solo agudos.
explicacion_formal: '![Ángulo en posición general](/static/img/geometria/trigonometria/trigcuad-posicion-general.svg)


  ### Definición formal


  Un ángulo $\theta$ está en posición general si su vértice es el origen $O=(0,0)$
  y su lado inicial es el semieje positivo de las x. El lado terminal se obtiene rotando
  el lado inicial en torno a $O$ en sentido antihorario (para ángulos positivos) un
  ángulo de medida $\theta$.


  ### Desarrollo didáctico


  En la figura, el lado inicial es el segmento sobre el eje x positivo, y el lado
  terminal es el rayo que pasa por el punto $P$, formando un ángulo $\theta=50°$ medido
  en sentido antihorario. Este punto de vista permite definir seno, coseno y tangente
  para cualquier ángulo, usando las coordenadas de un punto sobre el lado terminal.'
