procedimiento:
- 'Paso 1: Ubica el vértice del ángulo en el origen del plano cartesiano.'
- 'Paso 2: Identifica el lado inicial como el semieje positivo de las x.'
- 'Paso 3: El lado terminal es el rayo que se obtiene al rotar el lado inicial la
  medida del ángulo, en sentido antihorario si el ángulo es positivo.'
