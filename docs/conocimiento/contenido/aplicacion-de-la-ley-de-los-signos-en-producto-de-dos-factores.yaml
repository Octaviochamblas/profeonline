resumen_inicial: La ley de los signos para el producto de dos factores establece que
  el producto de dos cantidades de igual signo es positivo y el de signos opuestos
  es negativo.
explicacion_simple: 'Para multiplicar dos términos, primero determinamos el signo
  del resultado: ''más por más es más'' (+ · + = +), ''menos por menos es más'' (-
  · - = +), y ''más por menos es menos'' (+ · - = - / - · + = -). Signos iguales dan
  positivo, signos distintos dan negativo.'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$. La **Ley de los Signos para Dos Factores**
  viene dada por el multiplicador de polaridad:


  $$\text{sgn}(a \cdot b) = \text{sgn}(a) \cdot \text{sgn}(b)$$


  $$\text{donde: } (+)(+) = +, \quad (-)(-) = +, \quad (+)(-) = -, \quad (-)(+) =
  -$$


  > **Complemento didáctico:** La propiedad del producto de signos preserva la estructura
  de cuerpo de los números reales y la compatibilidad con el orden aditivo.'
definiciones_clave: '- **Ley de signos**: Regla operacional que determina la polaridad
  final del producto escalar de dos factores.'
propiedades_relaciones: '- **Elemento neutro e inverso**: $+1 \cdot a = a$ y $-1 \cdot
  a = -a$.'
ejemplo_guiado:
  enunciado: Calcule el producto de $(-4a) \cdot (-3b)$ aplicando la ley de los signos.
  pasos:
  - 'Paso 1: Multiplicar los signos de ambos factores: $(-1) \cdot (-1) = +1$ (signos
    iguales dan positivo).'
  - 'Paso 2: Multiplicar los coeficientes numéricos: $4 \cdot 3 = 12$.'
  - 'Paso 3: Multiplicar las variables literales: $a \cdot b = ab$.'
  - 'Conclusión: El producto final es $+12ab$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el signo del resultado al multiplicar dos factores de igual signo
    (ambos negativos)?
  choices:
  - text: Positivo (+)
    is_correct: true
  - text: Negativo (-)
    is_correct: false
  - text: Cero (0)
    is_correct: false
  - text: Indeterminado
    is_correct: false
  explanation: La alternativa correcta es 'Positivo (+)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (-4a) · (-3b), ¿cuál fue el producto resultante?
  choices:
  - text: 12ab
    is_correct: true
  - text: -12ab
    is_correct: false
  - text: 7ab
    is_correct: false
  - text: -7ab
    is_correct: false
  explanation: La alternativa correcta es '12ab'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el signo del producto mediante la ley de signos.'
- 'Paso 2: Multiplicar los coeficientes absolutos.'
- 'Paso 3: Unir la parte literal.'
errores_correccion: '- **Error 1: Confundir la regla de signos de la multiplicación
  con la suma de enteros (decir que $(-4) \cdot (-3) = -7$).** **Cómo corregirlo:**
  En la multiplicación, menos por menos es MÁS ($+12$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el producto de (5x) · (-6y).
  alternativas:
  - -30xy
  - 30xy
  - -11xy
  - 30x^2y^2
  respuesta: -30xy
  solucion_pasos:
  - '1. Signos opuestos (+ · -) dan negativo: -.'
  - '2. Coeficientes: 5 · 6 = 30.'
  - '3. Resultado: -30xy.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de (-2a) · (-7a)?
  alternativas:
  - 14a^2
  - -14a^2
  - -9a^2
  - 14a
  respuesta: 14a^2
  solucion_pasos:
  - 1. (-) · (-) = +.
  - 2. 2 · 7 = 14.
  - '3. a · a = a^2. Resultado: 14a^2.'
- titulo: ¿Es el producto de dos números negativos siempre un número positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla (-)(-) = + aplica universalmente en los números reales.
- titulo: ¿Da el producto de (-8x) · (3y) un valor positivo de +24xy?
  respuesta: 'No'
  solucion_pasos:
  - 'No, al ser de signos opuestos el resultado es negativo: -24xy.'
errores_frecuentes:
- Aplicar la regla de la suma en lugar de la regla de los signos de la multiplicación.
- Declarar que el producto de dos números negativos da un resultado negativo.
- Omitir el signo negativo al multiplicar un término positivo por uno negativo.
- Sumar los coeficientes numéricos en lugar de multiplicarlos.
- Declarar que el signo del producto depende del número de variables.
afirmaciones_verdaderas:
- El producto de dos factores de igual signo es siempre positivo.
- El producto de dos factores de signos opuestos es siempre negativo.
al_terminar_debes_poder: Al terminar serás capaz de determinar la polaridad del producto
  de dos factores aplicando la ley de los signos.
