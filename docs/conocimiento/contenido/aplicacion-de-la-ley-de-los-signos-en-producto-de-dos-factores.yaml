procedimiento:
- 'Paso 1: Identificar la signatura ($+$ o $-$) de cada uno de los dos factores.'
- 'Paso 2: Si los dos factores tienen el mismo signo, escribir el signo positivo ($+$) para el producto.'
- 'Paso 3: Si los dos factores tienen signos distintos, escribir el signo negativo ($-$) para el producto.'
- 'Paso 4: Multiplicar los valores absolutos de los coeficientes y adjuntar las partes literales.'
errores_correccion: '- **Error 1:** Aplicar la regla de suma al multiplicar dos negativos (escribir $(-3) \cdot (-4) = -7$). **Cómo corregirlo:** En la multiplicación dos negativos **DAN POSITIVO Y SE MULTIPLICAN ($(-3) \cdot (-4) = +12$)**.

  - **Error 2:** Conservar el signo del número con mayor valor absoluto al multiplicar (escribir $(+2) \cdot (-5) = -3$). **Cómo corregirlo:** La regla de heredar el signo del mayor **ES PARA SUMA Y RESTA**; en multiplicación factores distintos **SIEMPRE DAN NEGATIVO ($(+) \cdot (-) = -10$)**.

  '
ejemplos:
- titulo: Igual signo positivo
  enunciado: ¿Cuál es el resultado de $(+4a) \cdot (+3b)$?
  alternativas:
  - $+12ab$
  - $-12ab$
  - $+7ab$
  respuesta: $+12ab$
  solucion_pasos:
  - 1. $(+) \cdot (+) = +$.
  - 2. $4 \cdot 3 = 12 \implies +12ab$.
- titulo: Igual signo negativo
  enunciado: ¿Cuál es el resultado de $(-5m) \cdot (-2n)$?
  alternativas:
  - $+10mn$
  - $-10mn$
  - $-7mn$
  respuesta: $+10mn$
  solucion_pasos:
  - 1. $(-) \cdot (-) = +$.
  - 2. $5 \cdot 2 = 10 \implies +10mn$.
- titulo: Signos distintos
  enunciado: ¿Produce el producto $(-8p) \cdot (+2q)$ el resultado negativo $-16pq$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-) \cdot (+) = - \implies -16pq$.
- titulo: Multiplicación por cero
  enunciado: Para $(-7x) \cdot 0$, ¿da el resultado $0$ cancelando el signo negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, cualquier expresión multiplicada por cero resulta igual a cero.
errores_frecuentes:
- Aplicar las reglas de adición y resta al ejecutar el producto de dos coeficientes negativos.
- Seleccionar el signo del producto heredando el signo del número con mayor valor absoluto.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que la multiplicación de dos factores negativos da como resultado un número negativo.
- Sumar los coeficientes en lugar de multiplicarlos.
afirmaciones_verdaderas:
- El producto de dos factores algebraicos de igual signo es siempre positivo.
- El producto de dos factores algebraicos de distinto signo es siempre negativo.
al_terminar_debes_poder: '![Resumen de ley de signos en dos factores](/static/img/nodos/aplicacion-de-la-ley-de-los-signos-en-producto-de-dos-factores-resumen.svg)


  QUÉ: Determinar el signo del producto de dos términos algebraicos.


  CÓMO: Aplicar la regla de signos donde factores con signos iguales resultan positivos $(+)(+) = +, \; (-)(-) = +$ y con signos opuestos resultan negativos $(+)(-) = -$.'
