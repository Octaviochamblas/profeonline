semantic_id: MAT.ALG.LEYES_MULTIPLICACION.SIGNOS_DOS_FACTORES
resumen_inicial: La aplicación de la ley de los signos en el producto de dos factores establece que el producto de factores de igual signo es positivo, mientras que el producto de factores de distinto signo es negativo.
explicacion_simple: "En la multiplicación algebraica de dos factores, el signo del resultado sigue una regla estricta conocida como la **Ley de los Signos**:\n- **Factores de IGUAL SIGNO $\\implies$ Resultado POSITIVO ($+$)**:\n  - $(+) \\cdot (+) = + \\quad \\implies \\quad (+3) \\cdot (+4) = \\mathbf{+12}$.\n  - $(-) \\cdot (-) = + \\quad \\implies \\quad (-3) \\cdot (-4) = \\mathbf{+12}$.\n- **Factores de DISTINTO SIGNO $\\implies$ Resultado NEGATIVO ($-$)**:\n  - $(+) \\cdot (-) = - \\quad \\implies \\quad (+3) \\cdot (-4) = \\mathbf{-12}$.\n  - $(-) \\cdot (+) = - \\quad \\implies \\quad (-3) \\cdot (+4) = \\mathbf{-12}$.\n- **Resumen nemotécnico**: Signos iguales dan **MÁS**, signos diferentes dan **MENOS**.\n\n![Ley de Signos en Producto de Dos Factores](/static/img/nodos/aplicacion-de-la-ley-de-los-signos-en-producto-de-dos-factores-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la multiplicación de dos monomios $M_1 = c_1 X$ y $M_2 = c_2 Y$ con coeficientes reales $c_1, c_2 \in \mathbb{R} \setminus \{0\}$. La **ley de los signos binaria** se define mediante el homomorfismo de signatura $\operatorname{sgn}: \mathbb{R}^* \to \{-1, +1\}$ sobre el producto de coeficientes:


  $$\operatorname{sgn}(c_1 \cdot c_2) = \operatorname{sgn}(c_1) \cdot \operatorname{sgn}(c_2)$$


  cumpliendo el isomorfismo con el grupo abeliano $\mathbb{Z}_2$:


  $$\begin{cases} (+1) \cdot (+1) = +1 \\ (-1) \cdot (-1) = +1 \\ (+1) \cdot (-1) = -1 \\ (-1) \cdot (+1) = -1 \end{cases}$$


  ### Demostración por el Axioma Distributivo

  La regla $(-1) \cdot (-1) = +1$ es una consecuencia necesaria de la existencia del neutro aditivo $0$ y la distributividad en el cuerpo $\mathbb{R}$:


  $$0 = (-1) \cdot 0 = (-1) \cdot (1 + (-1)) = (-1) \cdot 1 + (-1) \cdot (-1) = -1 + (-1) \cdot (-1) \implies (-1) \cdot (-1) = +1$$


  ### Síntesis didáctica

  La ley de los signos binaria es el cimiento de la multiplicación de monomios, polinomios y productos notables.

  '
definiciones_clave: '- **Ley de los signos binaria**: Regla que determina el signo del producto de dos números o monomios basándose en la coincidencia de sus signaturas.

  - **Homomorfismo de signatura ($\operatorname{sgn}$)**: Función que proyecta un producto real en la signatura resultante $+1$ o $-1$.

  - **Doble negación multiplicativa**: Principio por el cual multiplicar dos factores negativos resulta en un producto positivo ($(-a)(-b) = ab$).

  '
propiedades_relaciones: '- **Conmutatividad del signo**: $\operatorname{sgn}(A \cdot B) = \operatorname{sgn}(B \cdot A)$.

  - **Absorción por elemento nulo**: $0 \cdot A = 0$ (el cero no posee signo positivo ni negativo).

  '
ejemplo_guiado:
  enunciado: Calcula el producto de los coeficientes numéricos en la multiplicación $(-6x^2) \cdot (-4y^3)$.
  pasos:
  - 'Paso 1: Identificamos los coeficientes numéricos de los dos factores: $c_1 = -6$ y $c_2 = -4$.'
  - 'Paso 2: Comparamos los signos de ambos coeficientes: Ambos son negativos (igual signo).'
  - 'Paso 3: Aplicamos la ley de los signos para factores de igual signo: $(-) \cdot (-) = +$.'
  - 'Paso 4: Multiplicamos los valores absolutos de los coeficientes: $6 \cdot 4 = 24$.'
  - 'Paso 5: Asignamos el signo positivo resultante al producto: $+24$.'
  - 'Conclusión: El producto de los coeficientes es **$+24$** (el monomio completo es $24x^2 y^3$).'
  imagen: /static/img/nodos/aplicacion-de-la-ley-de-los-signos-en-producto-de-dos-factores-ejemplos.svg
