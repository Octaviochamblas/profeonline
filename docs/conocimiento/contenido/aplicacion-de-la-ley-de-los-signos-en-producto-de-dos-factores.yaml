errores_frecuentes:
- Creer que dos negativos siempre dan negativo (el opuesto es cierto en multiplicación).
- Aplicar la regla de los signos de la suma (distinto → conservar el mayor) en lugar
  de la de la multiplicación.
- Positivo, porque hay dos factores.
- Para «¿Cuál es el signo del producto $(-7x)(+3y)$? (v1)», la respuesta correcta
  es Depende del valor de x e y.
- Positivo, porque la x es positiva.
afirmaciones_verdaderas:
