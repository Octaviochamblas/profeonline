semantic_id: MAT.ALG.LEYES_MULTIPLICACION.SIGNOS_DOS_FACTORES
resumen_inicial: 'Aplicación de la ley de los signos en producto de dos factores:
  leyes, procedimiento y aplicación en Leyes fundamentales de la multiplicación algebraica.'
explicacion_simple: ¿Qué obtienes cuando un amigo de tu amigo es tu amigo? Positivo.
  ¿Y cuando el enemigo de tu enemigo es tu amigo? También positivo. La regla de los
  signos en la multiplicación sigue exactamente esa lógica.
explicacion_formal: '### Definición formal


  Negativo, porque los signos son distintos.


  ### Desarrollo didáctico


  Las cuatro combinaciones posibles:

  - $(+3)(+4) = +12$: positivo × positivo = positivo.

  - $(-3)(-4) = +12$: negativo × negativo = positivo.

  - $(+3)(-4) = -12$: positivo × negativo = negativo.

  - $(-3)(+4) = -12$: negativo × positivo = negativo.


  En álgebra con variables: $(-2x)(+5y) = -10xy$. El signo se determina por la regla,
  y el resto es la multiplicación normal de coeficientes y letras.'
definiciones_clave: '- **Aplicación de la ley de los signos en producto de dos factores**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a aplicación de la ley de los signos en producto
  de dos factores.'
ejemplo_guiado:
