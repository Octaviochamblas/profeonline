procedimiento:
- 'Paso 1: Determina el signo del resultado según la regla (igual → positivo, distinto
  → negativo).'
- 'Paso 2: Multiplica los valores absolutos de los coeficientes.'
- 'Paso 3: Multiplica las partes literales (letras).'
- 'Paso 4: Combina el signo del paso 1 con el resultado de los pasos 2 y 3.'
- 'Regla: distinto × distinto = negativo. $(-)( +) = -$.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en aplicación de la ley de los signos en producto de dos factores.
ejemplos:
- titulo: Los dos casos negativos
  enunciado: 'Calcula: (-4a)(−3b).'
  solucion_pasos:
  - 'Signos: (-)(-) = +.'
  - 'Coeficientes: 4 × 3 = 12.'
  - 'Letras: a × b = ab.'
  - 'Resultado: +12ab = 12ab.'
- titulo: En física, la fuerza se expresa como $F = ma$. Si la aceleración es $-3a$
    (hacia abajo) y la
  enunciado: 'En física, la fuerza se expresa como $F = ma$. Si la aceleración es
    $-3a$ (hacia abajo) y la masa es $-2m$ (representando una deuda de masa en un
    modelo), ¿cuál es la expresión de la fuerza? (v1)


    Opciones: A) $6ma$ (positiva) · B) $-6ma$ (negativa) · C) $-5ma$ · D) $1ma$'
  solucion_pasos:
  - '$F = (-2m)(-3a)$. Signos: $(-)(-)=+$. Coeficientes: $2 \times 3=6$. Resultado:
    $+6ma$.'
  - 'Respuesta: $6ma$ (positiva)'
- titulo: 'Respecto de «Aplicación de la ley de los signos en producto de dos factores»:
