resumen_inicial: Para reconocer si una tabla representa proporcionalidad directa,
  se verifica que la división $\frac{y}{x}$ para cada par de datos resulte siempre
  en la misma constante $k$.
explicacion_simple: Si nos dan una tabla con datos de dos variables, podemos saber
  si son directamente proporcionales dividiendo el número de la columna $Y$ entre
  el de la columna $X$ en cada fila. Si todos los resultados de las filas son idénticos,
  la tabla es de proporción directa.
explicacion_formal: 'Dada la tabla de datos $\{(x_1, y_1), (x_2, y_2), \dots, (x_n,
  y_n)\}$, la condición necesaria y suficiente para **Reconocimiento Tabular de Proporcionalidad
  Directa** es:


  $$\frac{y_1}{x_1} = \frac{y_2}{x_2} = \dots = \frac{y_n}{x_n} = k \quad (k \in \mathbb{R}^+)$$


  **Detección de incongruencias:**

  - Si existe al menos un par donde $\frac{y_i}{x_i} \neq k$, la tabla NO corresponde
  a una relación directamente proporcional.'
definiciones_clave: '- **Reconocimiento tabular**: Verificación de igualdad de cocientes
  en todas las filas de una tabla.'
propiedades_relaciones: '- **Criterio de tabla constante**: $\frac{y_i}{x_i} = k$
  constante para todo fila $i$.'
ejemplo_guiado:
  enunciado: Verifique si la tabla con pares $(2, 10)$, $(5, 25)$ y $(8, 40)$ corresponde
    a proporcionalidad directa.
  pasos:
  - 'Paso 1: Calcular $y_1 / x_1 = 10 / 2 = 5$.'
  - 'Paso 2: Calcular $y_2 / x_2 = 25 / 5 = 5$.'
  - 'Paso 3: Calcular $y_3 / x_3 = 40 / 8 = 5$.'
  - 'Conclusión: Todos los cocientes son iguales a $k = 5 \implies$ Sí es proporcionalidad
    directa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento tabular confirma que una tabla representa proporcionalidad
    directa?
  choices:
  - text: Verificar que el cociente y / x dé el mismo valor constante en todas las
      filas
    is_correct: true
  - text: Sumar los valores de cada fila
    is_correct: false
  - text: Comprobar que los datos vayan ordenados de menor a mayor sin importar sus
      divisiones
    is_correct: false
  - text: Multiplicar los valores de cada fila y verificar que den 1
    is_correct: false
  explanation: La alternativa correcta es 'Verificar que el cociente y / x dé el mismo
    valor constante en todas las filas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para los pares (2,10), (5,25) y (8,40), ¿cuál fue
    la constante coincidente?
  choices:
  - text: '5'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '2'
    is_correct: false
  - text: '50'
    is_correct: false
  explanation: La alternativa correcta es '5'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de analizar tablas de valores y determinar
  si responden a una proporcionalidad directa verificando la constancia de $\frac{y}{x}$.
semantic_id: MAT.NUM.PROP_DIRECTA.RECONOCIMIENTO_TABULAR
procedimiento:
- 'Paso 1: Verificar que el cociente $y / x = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = k \cdot x$ o el gráfico de recta que pasa por
  $(0,0)$.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Creer que una recta con desfase $y = kx + c$ ($c
  \neq 0$) representa proporcionalidad directa.** **Cómo corregirlo:** La proporcionalidad
  directa exige obligatoriamente pasar por el origen $(0,0)$, sin término independiente
  $c$.


  - **Error 2: Usar el producto $x \cdot y$ en lugar del cociente $y / x$ para hallar
  $k$.** **Cómo corregirlo:** El producto constante corresponde a proporcionalidad
  INVERSA; la directa usa el cociente $y/x = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_DIRECTA.RECONOCIMIENTO_TABULAR.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad directa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de cociente.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por cociente constante y/x.
- titulo: ¿Pasa la gráfica de una proporción directa por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $x=0 \implies y=0$.
- titulo: ¿Permite el modelo y = kx calcular valores desconocidos?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicando el valor de $x$ por la constante $k$.
errores_frecuentes:
- Clasificar como proporcionalidad directa una relación cuya gráfica es una recta
  que no pasa por el origen $(0,0)$.
- Multiplicar las variables entre sí ($x \cdot y$) pretendiendo obtener la constante
  de proporcionalidad directa.
- Sumar una cantidad fija a ambas variables pensando que se mantiene la relación de
  proporción.
- Declarar que si una variable aumenta y la otra también aumenta, existe proporcionalidad
  directa sin comprobar la constancia de $y/x$.
- Omitir incluir la unidad de medida compuesta en el valor de la constante de proporcionalidad
  $k$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante:
  $\frac{y}{x} = k$.'
- El gráfico de una relación de proporcionalidad directa es siempre una línea recta
  que pasa por el origen $(0,0)$.
