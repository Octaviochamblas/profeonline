semantic_id: MAT.NUM.PROP_DIRECTA.RECONOCIMIENTO_TABULAR
resumen_inicial: 'Reconocimiento tabular de proporcionalidad directa: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: Si te entregan una hoja de cálculo con datos, ¿cómo sabes a simple
  vista si obedecen a una proporción directa? El secreto está en probar si todos esconden
  el mismo multiplicador.
explicacion_formal: 'Una **tabla de valores** representa la relación entre dos magnitudes.
  Para comprobar si dicha tabla modela una proporcionalidad directa, debes dividir
  el valor de $y$ por su correspondiente valor de $x$ en cada uno de los pares de
  datos presentados.


  - Si todas las divisiones dan el mismo resultado $k$, la tabla representa una proporción
  directa.

  - Si al menos uno de los resultados es distinto, la tabla NO es de proporción directa.'
definiciones_clave: '- **Reconocimiento tabular de proporcionalidad directa**: Elemento
  central dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a reconocimiento tabular de proporcionalidad directa.'
