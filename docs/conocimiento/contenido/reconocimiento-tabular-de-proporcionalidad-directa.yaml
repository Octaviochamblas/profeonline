semantic_id: MAT.NUM.PROP_DIRECTA.RECONOCIMIENTO_TABULAR
resumen_inicial: 'Reconocimiento tabular de proporcionalidad directa: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: Si te entregan una hoja de cálculo con datos, ¿cómo sabes a simple vista
  si obedecen a una proporción directa? El secreto está en probar si todos esconden el mismo
  multiplicador.
explicacion_formal: 'Una **tabla de valores** representa la relación entre dos magnitudes.
  Para comprobar si dicha tabla modela una proporcionalidad directa, debes dividir el valor
  de $y$ por su correspondiente valor de $x$ en cada uno de los pares de datos presentados.


  - Si todas las divisiones dan el mismo resultado $k$, la tabla representa una proporción
  directa.

  - Si al menos uno de los resultados es distinto, la tabla NO es de proporción directa.'
definiciones_clave: '- **Reconocimiento tabular de proporcionalidad directa**: Elemento central
  dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a reconocimiento tabular de proporcionalidad directa.'
ejemplo_guiado:
  enunciado: La tabla tiene los pares (4, 20), (6, 30), (9, 45). ¿Representa una proporción
    directa?
  pasos:
  - 'Divido el primer par: 20 dividido entre 4 es igual a 5.'
  - 'Divido el segundo par: 30 dividido entre 6 es igual a 5. Divido el tercer par: 45 dividido
    entre 9 es igual a 5.'
  - Como los tres cocientes son iguales a 5, la tabla sí representa una proporción directa.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con reconocimiento tabular de proporcionalidad
    directa?
  choices:
  - text: Identificar correctamente la relación de proporcionalidad directa
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
    directa. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de reconocimiento tabular de proporcionalidad
    directa, ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Toma el primer par de datos $(x, y)$ de la tabla y divide $y$ por $x$.'
- 'Paso 2: Repite la división para el segundo par, el tercero, y así sucesivamente.'
- 'Paso 3: Si todos los resultados son idénticos, la tabla es directamente proporcional.'
errores_correccion: Evita confundir los datos de entrada al operar con reconocimiento tabular
  de proporcionalidad directa.
ejemplos:
- titulo: Verificando una tabla
  enunciado: La tabla tiene los pares $(2, 6)$, $(3, 9)$, $(5, 16)$. ¿Es proporción directa?
  solucion_pasos:
  - 'Dividimos par 1: $6/2 = 3$.'
  - 'Dividimos par 2: $9/3 = 3$.'
  - 'Dividimos par 3: $16/5 = 3.2$.'
  - Como $3 \neq 3.2$, la tabla NO representa proporción directa.
- titulo: Ejemplo 1
  enunciado: La tabla tiene los pares (2,8), (3,12), (5,20). ¿Es proporción directa?
  alternativas:
  - Sí
  - 'No'
  - Solo los dos primeros pares
  respuesta: Sí
  solucion_pasos:
  - Todos los cocientes dan 4.
- titulo: Ejemplo 2
  enunciado: La tabla tiene los pares (3,15), (4,20), (6,25). ¿Es proporción directa?
  alternativas:
  - 'No'
  - Sí
  - Falta información
  respuesta: 'No'
  solucion_pasos:
  - Los dos primeros cocientes dan 5, pero el tercero da 25 dividido entre 6, que no es 5.
- titulo: ¿Basta con revisar un solo par de la tabla para confirmar que es una proporción
    directa?
  respuesta: 'No'
  solucion_pasos:
  - Hay que comprobar que el cociente es el mismo en todos los pares disponibles.
errores_frecuentes:
- Comprobar solo el primer par y asumir que los demás también cumplen.
- Comprobar que ambas variables crecen, pero sin verificar si el cociente es constante.
- Dividir $x/y$ en una celda e $y/x$ en la siguiente.
- Confundir con la proporción inversa (donde lo constante es el producto $x \cdot y$).
- Redondear los cocientes antes de compararlos, lo que puede ocultar que en realidad no son
  iguales.
afirmaciones_verdaderas:
- La propiedad de reconocimiento tabular de proporcionalidad directa preserva la consistencia
  lógica.
- Si una tabla representa una proporción directa, todos sus cocientes y/x deben ser exactamente
  iguales, sin excepción.
al_terminar_debes_poder: Resolver problemas aplicados que involucren reconocimiento tabular
  de proporcionalidad directa.
