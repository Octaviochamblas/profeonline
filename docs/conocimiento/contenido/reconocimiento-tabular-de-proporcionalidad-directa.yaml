semantic_id: MAT.NUM.RAZONES_PROPORCIONES.TABLA_PROP_DIRECTA
resumen_inicial: Una tabla de valores representa una proporcionalidad directa si y solo si todos los pares de datos $(x_i, y_i)$ arrojan exactamente el mismo cociente $\frac{y_i}{x_i} = k$ constante.
explicacion_simple: "![Reconocimiento tabular](/static/img/nodos/reconocimiento-tabular-de-proporcionalidad-directa-intro.svg)\n\nPara saber si una **tabla de datos** es de proporcionalidad directa:\n1. **Divide $y$ entre $x$ en cada una de las columnas**: $\\frac{y_1}{x_1}, \\frac{y_2}{x_2}, \\frac{y_3}{x_3}, \\dots$\n2. **Compara los resultados**:\n   - Si **todos los cocientes dan exactamente el mismo número $k$**, la tabla **SÍ es de proporcionalidad directa**.\n   - Si **aunque sea uno solo da diferente**, la tabla **NO es de proporcionalidad directa**.\n3. **Completar datos faltantes:** Si la tabla es directa con constante $k$, cualquier casilla vacía se completa multiplicando: $y = k \\cdot x$ o dividiendo: $x = \\frac{y}{k}$."
explicacion_formal: 'Sea una tabla de datos discretos $\mathcal{T} = \{(x_1, y_1), (x_2, y_2), \dots, (x_n, y_n)\} \subset \mathbb{R}^+ \times \mathbb{R}^+$.


  **Criterio de Proporcionalidad Tabular:**

  $\mathcal{T}$ representa una relación de proporcionalidad directa si y solo si:


  $$\frac{y_1}{x_1} = \frac{y_2}{x_2} = \dots = \frac{y_n}{x_n} = k \quad (k \in \mathbb{R}^+, k = \text{constante})$$


  Si existe al menos un índice $j \in \{1, \dots, n\}$ tal que $\frac{y_j}{x_j} \neq k$, la relación tabular no es directamente proporcional.'
definiciones_clave: '- **Tabla proporcional directa**: Tabla donde todas las columnas satisfacen $\frac{y}{x} = k$.

  - **Par ordenado $(x_i, y_i)$**: Valores emparejados de entrada y salida en la tabla.

  - **Comprobación exhaustiva**: Verificación de la constante en todas las columnas sin excepción.'
propiedades_relaciones: '- **Extrapolación tabular**: Permite predecir columnas no presentes mediante $y = kx$.

  - **Sensibilidad a excepciones**: Un solo par discrepante invalida la proporcionalidad de toda la tabla.'
ejemplo_guiado:
  enunciado: '![Ejemplos de reconocimiento tabular](/static/img/nodos/reconocimiento-tabular-de-proporcionalidad-directa-ejemplos.svg)


    Complete la casilla faltante en una tabla directa con $k = 4$ donde $(x=3, y=12)$ y $(x=5, y=?)$, y determine si los pares $(2, 6), (3, 9), (4, 11)$ forman una tabla directamente proporcional.'
  pasos:
  - 'Paso 1: Para completar la tabla: Con $k = \frac{12}{3} = 4$, calcular para $x = 5 \implies y = 4 \cdot 5 = 20$.'
  - 'Paso 2: Para la segunda tabla: Calcular cocientes $\frac{6}{2} = 3$, $\frac{9}{3} = 3$, $\frac{11}{4} = 2,75$.'
  - 'Paso 3: Comparar cocientes: Como $3 = 3 \neq 2,75$, el tercer par rompe la constancia.'
  - 'Paso 4: Conclusión: La segunda tabla NO es directamente proporcional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se comprueba si una tabla de valores corresponde a una proporcionalidad directa?
  choices:
  - text: Dividiendo y entre x en cada columna y verificando que todos los resultados sean iguales
    is_correct: true
  - text: Sumando todos los valores de x y todos los de y
    is_correct: false
  - text: Restando la primera columna con la última
    is_correct: false
  - text: Comprobando que todos los números sean pares
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo y entre x en cada columna y verificando que todos los resultados sean iguales'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la tabla con pares (2,6), (3,9) y (4,11) no es proporcional directa?
  choices:
  - text: Porque el cociente 11/4 = 2,75 es distinto de 6/2 = 3
    is_correct: true
  - text: Porque 11 es un número primo
    is_correct: false
  - text: Porque hay solo tres pares de datos
    is_correct: false
  - text: Porque 4 es mayor que 3
    is_correct: false
  explanation: La alternativa correcta es 'Porque el cociente 11/4 = 2,75 es distinto de 6/2 = 3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Construir una fila o columna auxiliar calculando el cociente $\frac{y_i}{x_i}$ para cada columna de la tabla.'
- 'Paso 2: Verificar si todos los cocientes calculados son exactamente iguales al mismo escalar $k$.'
- 'Paso 3: Si todos coinciden, usar $y = kx$ o $x = \frac{y}{k}$ para rellenar los datos faltantes solicitados.'
errores_correccion: '- **Error 1: Verificar solo las dos primeras columnas.** **Cómo corregirlo:** Se DEBEN verificar TODAS las columnas; una sola discrepancia final invalida la proporcionalidad directa.

  - **Error 2: Restar en vez de dividir filas.** **Cómo corregirlo:** La proporcionalidad directa se comprueba con el COCIENTE $\frac{y}{x}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la tabla directa $(x=2, y=8), (x=4, y=16), (x=7, y=?)$, ¿cuál es el valor de $y$ para $x = 7$?
  alternativas:
  - $28$
  - $24$
  - $32$
  respuesta: $28$
  solucion_pasos:
  - $k = \frac{8}{2} = 4 \implies y = 4 \cdot 7 = 28$.
- titulo: Ejemplo 2
  enunciado: ¿Es directamente proporcional la tabla $(x=3, y=15), (x=6, y=30), (x=10, y=50)$?
  alternativas:
  - Sí, todos los cocientes dan k = 5
  - No, los incrementos son distintos
  - No, falta el punto x = 1
  respuesta: Sí, todos los cocientes dan k = 5
  solucion_pasos:
  - $\frac{15}{3} = 5$, $\frac{30}{6} = 5$, $\frac{50}{10} = 5$. Sí es proporcional.
- titulo: ¿Es proporcional directa una tabla si todos sus cocientes y/x dan 2,5?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la constante $k = 2,5$ es uniforme en toda la tabla.
  alternativas:
  - texto: Sí, satisface el criterio fundamental de proporcionalidad tabular
    es_correcta: true
    retroalimentacion: ¡Correcto! Constancia universal en la tabla.
  - texto: No, k debe ser un entero
    es_correcta: false
    retroalimentacion: Incorrecto, las constantes pueden ser decimales.
  - texto: No, requiere que x empiece en 0
    es_correcta: false
    retroalimentacion: Incorrecto, no es obligatorio incluir el 0 en la tabla.
- titulo: ¿Basta que una sola columna falle para que la tabla no sea directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, la proporcionalidad exige que la constante se cumpla en la totalidad de los datos.
  alternativas:
  - texto: Sí, una sola discrepancia invalida la proporcionalidad directa de la tabla
    es_correcta: true
    retroalimentacion: ¡Correcto! Criterio estricto de consistencia.
  - texto: No, se toma el promedio de los cocientes
    es_correcta: false
    retroalimentacion: Incorrecto, en matemática exacta debe cumplirse en todos los pares.
  - texto: No, se descarta la columna rebelde
    es_correcta: false
    retroalimentacion: Incorrecto, la tabla describe la relación completa.
errores_frecuentes:
- Evaluar únicamente el primer par y omitir los siguientes.
- Confundir un patrón aditivo en $y$ con una proporcionalidad directa.
- Invertir el cálculo en algunas columnas ($x/y$ en vez de $y/x$).
- Calcular mal los valores faltantes al dividir en vez de multiplicar.
afirmaciones_verdaderas:
- Una tabla es directamente proporcional si todos sus pares satisfacen $\frac{y_i}{x_i} = k$.
- La constante $k$ permite completar casillas vacías mediante $y = kx$ o $x = \frac{y}{k}$.
- Un solo par con cociente distinto invalida la relación proporcional directa.
al_terminar_debes_poder: '![Síntesis de reconocimiento tabular](/static/img/nodos/reconocimiento-tabular-de-proporcionalidad-directa-resumen.svg)


  QUÉ: Reconocer, validar y completar tablas de valores directamente proporcionales.


  CÓMO: Calculando el cociente $\frac{y_i}{x_i}$ en cada columna, verificando la igualdad universal a la constante $k$ y completando incógnitas mediante $y = k \cdot x$ o $x = \frac{y}{k}$.'
