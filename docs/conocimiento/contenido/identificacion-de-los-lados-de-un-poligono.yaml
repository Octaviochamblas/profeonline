semantic_id: MAT.GEO.POLIGONOS_BASE.LADOS
resumen_inicial: 'Los lados de un polígono son los segmentos rectilíneos que forman su perímetro y delimitan su área; su número n determina el nombre del polígono y su perímetro total.'
explicacion_simple: |
  ![Identificación de Lados](/static/img/nodos/identificacion-de-los-lados-de-un-poligono-intro.svg)

  Los lados son las líneas rectas que rodean y encierran la figura. Sumar las medidas de todos los lados nos da el perímetro del polígono.
explicacion_formal: |
  ### Definición de lado
  Cada uno de los segmentos $\overline{V_1 V_2}, \overline{V_2 V_3}, \dots, \overline{V_n V_1}$ que unen dos vértices consecutivos de un polígono se denomina **lado**.

  La longitud de cada lado se denota por $L_i = d(V_i, V_{i+1})$.

  ### Perímetro de un polígono
  El **perímetro** $P$ es la longitud total de la frontera del polígono, obtenida sumando las longitudes de todos sus $n$ lados:

  $$P = \sum_{i=1}^n L_i = L_1 + L_2 + \dots + L_n$$

  En el caso particular de un **polígono regular** (donde todos los lados tienen la misma longitud $L$):

  $$P = n \cdot L$$

  ### Clasificación según el número de lados n
  - $n = 3$: Triángulo
  - $n = 4$: Cuadrilátero
  - $n = 5$: Pentágono
  - $n = 6$: Hexágono
  - $n = 7$: Heptágono
  - $n = 8$: Octágono (u octógono)
  - $n = 9$: Eneágono (o nonágono)
  - $n = 10$: Decágono
  - $n = 12$: Dodecágono

  > **Complemento didáctico:** Para que un conjunto de $n$ segmentos forme un polígono cerrado, la longitud del lado más largo debe ser estrictamente menor que la suma de todos los demás lados ($L_{\max} < \sum_{i \neq \max} L_i$), lo cual generaliza la desigualdad triangular a cualquier polígono.
definiciones_clave: |
  - **Lado ($L_i$)**: Segmento de recta delimitado por dos vértices consecutivos del polígono.
  - **Perímetro ($P$)**: Medida unidimensional correspondiente a la suma de las longitudes de todos los lados.
  - **Polígono equilátero**: Polígono que tiene todos sus lados de igual longitud.
  - **Polígono regular**: Polígono que es simultáneamente equilátero (lados iguales) y equiángulo (ángulos iguales).
propiedades_relaciones: |
  - **Desigualdad triangular generalizada**: En todo polígono, la longitud de cualquier lado es estrictamente menor que la suma de todos los demás lados: $L_k < \sum_{i \neq k} L_i$.
  - **Lados adyacentes**: Dos lados que comparten un vértice en común.
  - **Lados opuestos**: Lados que no comparten vértices (en polígonos con número par de lados).
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Identificación de Lados](/static/img/nodos/identificacion-de-los-lados-de-un-poligono-ejemplos.svg)

    Un octágono regular tiene un perímetro de $P = 72\text{ cm}$. Determina cuántos lados tiene la figura y cuánto mide la longitud de cada uno de sus lados.
  pasos:
  - 'Paso 1: Identificar el tipo de polígono: un octágono posee exactamente $n = 8$ lados.'
  - 'Paso 2: Aplicar la fórmula del perímetro en polígonos regulares: $P = n \cdot L \implies 72\text{ cm} = 8 \cdot L$.'
  - 'Paso 3: Despejar la longitud del lado: $L = \frac{72\text{ cm}}{8} = 9\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Si un pentágono tiene lados que miden 4 cm, 7 cm, 5 cm, 8 cm y 6 cm, ¿cuál es su perímetro?'
  choices:
  - text: '30 cm, obtenido al sumar las longitudes de sus 5 lados consecutivos (4 + 7 + 5 + 8 + 6 = 30 cm)'
    is_correct: true
  - text: '150 cm, multiplicando todas las medidas entre sí'
    is_correct: false
  - text: '24 cm, promediando los lados y multiplicando por 4'
    is_correct: false
  - text: '60 cm, duplicando el perímetro por ser figura convexa'
    is_correct: false
  explanation: '30 cm, obtenido al sumar las longitudes de sus 5 lados consecutivos (4 + 7 + 5 + 8 + 6 = 30 cm).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Qué condición debe cumplir una figura para que su perímetro se pueda calcular simplemente como n · L?'
  choices:
  - text: 'Ser un polígono equilátero (o regular), donde todos sus n lados tengan exactamente la misma medida L'
    is_correct: true
  - text: 'Tener un número par de lados mayor o igual a 6'
    is_correct: false
  - text: 'Estar inscrito en una circunferencia con radio igual a 1'
    is_correct: false
  - text: 'Tener al menos dos ángulos rectos en sus vértices opuestos'
    is_correct: false
  explanation: 'Ser un polígono equilátero (o regular), donde todos sus n lados tengan exactamente la misma medida L.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los segmentos que forman el contorno exterior de la figura.'
- 'Paso 2: Contar el número de lados $n$ para nombrar el polígono.'
- 'Paso 3: Comprobar que todos los segmentos estén conectados por sus extremos.'
- 'Paso 4: Para calcular el perímetro, sumar las medidas individuales $L_1 + L_2 + \dots + L_n$. Si es regular, multiplicar $n \cdot L$.'
errores_correccion: 'No confundas los lados con las diagonales: los lados forman la frontera exterior del polígono, mientras que las diagonales atraviesan su región interior.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se llama un polígono de 7 lados?
  alternativas:
  - Heptágono
  - Hexágono
  - Octágono
  respuesta: Heptágono
  solucion_pasos:
  - 'Un polígono de $n = 7$ lados recibe el nombre de heptágono.'
- titulo: Ejemplo 2
  enunciado: Un hexágono regular tiene lados de 5 cm. ¿Cuál es su perímetro?
  alternativas:
  - 30 cm ($6 \cdot 5 = 30\text{ cm}$)
  - 25 cm
  - 36 cm
  respuesta: 30 cm ($6 \cdot 5 = 30\text{ cm}$)
  solucion_pasos:
  - 'Al ser regular con $n = 6$ y $L = 5\text{ cm}$, su perímetro es $P = 6 \cdot 5\text{ cm} = 30\text{ cm}$.'
- titulo: ¿Un rombo es siempre un polígono regular?
  respuesta: 'No'
  solucion_pasos:
  - 'No, porque aunque un rombo es equilátero (lados iguales), no siempre es equiángulo (sus ángulos pueden ser distintos de 90°).'
- titulo: ¿La suma de las longitudes de los lados de cualquier polígono corresponde a su perímetro?
  respuesta: 'Sí'
  solucion_pasos:
  - 'Sí, por definición el perímetro es la longitud total del contorno del polígono: $P = \sum L_i$.'
errores_frecuentes:
- 'Confundir lados con diagonales interiores al contar elementos de la figura.'
- 'Asumir que un polígono de lados iguales (equilátero) es automáticamente regular sin verificar los ángulos.'
- 'Olvidar sumar algún lado al calcular el perímetro de polígonos irregulares.'
afirmaciones_verdaderas:
- 'El perímetro de cualquier polígono es la suma de las longitudes de todos sus lados.'
- 'En un polígono regular de $n$ lados y lado $L$, el perímetro es $P = n \cdot L$.'
- 'Un polígono de $n$ lados tiene exactamente $n$ lados y $n$ vértices.'
al_terminar_debes_poder: |
  **QUÉ:** Identificar, clasificar y calcular las longitudes de los lados y el perímetro de polígonos regulares e irregulares.

  **CÓMO:** Reconociendo los segmentos de frontera, clasificando por número de lados $n$ y aplicando las sumatorias $P = \sum L_i$ o $P = n \cdot L$.

  ![Resumen de Lados de un Polígono](/static/img/nodos/identificacion-de-los-lados-de-un-poligono-resumen.svg)
