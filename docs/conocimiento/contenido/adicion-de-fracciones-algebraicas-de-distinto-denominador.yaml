semantic_id: MAT.ALG.FRACCIONES_SUMA.DISTINTO_DENOMINADOR
resumen_inicial: Para sumar fracciones algebraicas de distinto denominador, se deben
  homogeneizar convirtiéndolas a un denominador común antes de sumar numeradores.
explicacion_simple: 'Cuando los denominadores de las fracciones son distintos, no
  podemos sumar sus numeradores directamente.

  Primero debemos encontrar un denominador común (preferiblemente el m.c.m. de los
  denominadores originales).

  Luego amplificamos cada numerador multiplicándolo por el factor que necesita su
  denominador para transformarse en el denominador común, y finalmente sumamos los
  numeradores resultantes.'
explicacion_formal: 'Dadas dos fracciones algebraicas $\frac{A(x)}{P(x)}$ y $\frac{B(x)}{Q(x)}$
  con $P(x) \neq 0$ y $Q(x) \neq 0$, la **adición de distinto denominador** se calcula
  como:


  $$\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)} = \frac{A(x) \cdot Q(x) + B(x) \cdot P(x)}{P(x)
  \cdot Q(x)}$$


  **Desglose de la fórmula:**

  - $P(x) \cdot Q(x)$: Denominador común (o el $\operatorname{mcm}(P, Q)$ de menor
  grado).

  - $A(x) \cdot Q(x) + B(x) \cdot P(x)$: Numerador combinado resultante de la amplificación
  individual de cada fracción.'
definiciones_clave: '- **Homogeneización de fracciones**: Proceso de convertir fracciones
  de distinto denominador a un denominador común equivalente.

  - **Factor de amplificación**: Expresión por la cual se multiplica el numerador
  de cada fracción para alcanzar el denominador común.'
propiedades_relaciones: '- **Uso del m.c.m.**: Utilizar el $\operatorname{mcm}(P,Q)$
  en lugar del producto simple $P \cdot Q$ evita numeradores de grado excesivamente
  elevado.

  - **Dominio combinado**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid P(x) \neq
  0 \land Q(x) \neq 0\}$.'
ejemplo_guiado:
  enunciado: Suma las fracciones de distinto denominador $\frac{2}{x + 1} + \frac{3}{x
    + 3}$, expresa la suma sobre el denominador común $(x + 1)(x + 3)$ y evalúa para
    $x = 1$.
  pasos:
  - 'Paso 1: Determinar el denominador común m.c.m. entre $(x + 1)$ y $(x + 3)$, que
    es $(x + 1)(x + 3)$.Paso 2: Amplificar el primer numerador por $(x + 3)$ y el
    segundo numerador por $(x + 1)$: $\frac{2(x + 3) + 3(x + 1)}{(x + 1)(x + 3)}$.Paso
    3: Expandir y reducir el numerador: $2x + 6 + 3x + 3 = 5x + 9$.Paso 4: Escribir
    la suma homogeneizada final: $\frac{5x + 9}{(x + 1)(x + 3)}$ para $x \notin \{-1,
    -3\}$.Paso 5: Evaluar para $x = 1$: $\frac{5(1) + 9}{(1 + 1)(1 + 3)} = \frac{14}{2
    \cdot 4} = \frac{14}{8} = \frac{7}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente homogeneizada de $\frac{2}{x + 1} +
    \frac{3}{x + 3}$?
  choices:
  - text: $\frac{5x + 9}{(x + 1)(x + 3)}$
    is_correct: true
  - text: $\frac{5}{2x + 4}$
    is_correct: false
  - text: $\frac{5x + 5}{(x + 1)(x + 3)}$
    is_correct: false
  - text: $\frac{6}{(x + 1)(x + 3)}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{5x + 9}{(x + 1)(x + 3)}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la suma $\frac{5x + 9}{(x + 1)(x + 3)}$ para $x = 1$, ¿cuál
    es el valor numérico simplificado?
  choices:
  - text: $\frac{7}{4}$
    is_correct: true
  - text: $\frac{14}{4}$
    is_correct: false
  - text: $\frac{5}{4}$
    is_correct: false
  - text: $\frac{7}{8}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{7}{4}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el denominador común (m.c.m.) entre los denominadores de las
  fracciones.'
- 'Paso 2: Para cada fracción, dividir el m.c.m. entre su denominador original para
  hallar su factor de amplificación.'
- 'Paso 3: Multiplicar el numerador de cada fracción por su factor de amplificación
  correspondiente.'
- 'Paso 4: Colocar la suma de los numeradores amplificados sobre la barra del denominador
  común.'
- 'Paso 5: Expandir y reducir términos semejantes en el numerador.'
errores_correccion: '- **Error común:** Sumar directamente numeradores y denominadores
  de fracciones distintas (ejemplo: $\frac{2}{a} + \frac{3}{b} = \frac{5}{a+b}$).

  - **Cómo corregirlo:** La suma directa es un error grave. NUNCA sumes fracciones
  sin antes haberlas llevado a un mismo denominador común.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de adición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de adición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se conserva el denominador común al sumar?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla fundamental de la adición racional.
- titulo: ¿Se pueden sumar los denominadores entre sí?
  respuesta: 'No'
  solucion_pasos:
  - No, jamás se suman los denominadores.
errores_frecuentes:
- Sumar denominadores al realizar la adición de fracciones algebraicas.
- Sumar numeradores de fracciones con distinto denominador sin homogeneizar.
- Olvidar multiplicar el numerador por el factor de amplificación correspondiente.
- Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos
  semejantes.
- No verificar si el numerador final se puede factorizar para simplificar con el denominador.
afirmaciones_verdaderas:
- Para sumar fracciones algebraicas de igual denominador se suman los numeradores
  y se conserva el denominador común.
- El uso del m.c.m. como denominador común minimiza el grado de los numeradores amplificados.
al_terminar_debes_poder: Al finalizar este recurso podrás realizar la adición de fracciones
  algebraicas de igual y distinto denominador expresando el resultado en su forma
  simplificada.
