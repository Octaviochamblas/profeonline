procedimiento:
- 'Paso 1: Identifica que los denominadores son diferentes.'
- 'Paso 2: Encuentra un denominador común (idealmente el mínimo).'
- 'Paso 3: Amplifica cada fracción para que tenga ese denominador común.'
- 'Paso 4: Realiza la suma de los nuevos numeradores.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en adición de fracciones algebraicas de distinto denominador.
ejemplos:
- titulo: Concepto de $\frac{a}{b} + \frac{c}{d}$
  enunciado: Concepto de $\frac{a}{b} + \frac{c}{d}$.
  solucion_pasos:
  - No se pueden sumar tal cual.
  - Denominador común es $bd$.
  - 'Amplificamos la primera por $d$: $\frac{ad}{bd}$.'
  - 'Amplificamos la segunda por $b$: $\frac{bc}{bd}$.'
  - 'Suma: $\frac{ad+bc}{bd}$.'
- titulo: Al buscar el denominador común entre dos fracciones que no tienen factores
    comunes, basta co
  enunciado: Al buscar el denominador común entre dos fracciones que no tienen factores
    comunes, basta con multiplicar sus denominadores originales.
  solucion_pasos:
  - Sí, si no comparten factores (son primos entre sí), su mínimo común múltiplo es
    su producto directo.
  - 'Respuesta: Verdadero'
- titulo: 'Respecto de «Adición de fracciones algebraicas de distinto denominador»:
    ¿Se ajusta a la def'
  enunciado: 'Respecto de «Adición de fracciones algebraicas de distinto denominador»:
    ¿Se ajusta a la definición esta afirmación? «Nunca se pueden sumar fracciones
    con distintos denominadores directamente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Nunca se pueden sumar fracciones
    con distintos denominadores directamente.'
- titulo: 'Respecto de «Adición de fracciones algebraicas de distinto denominador»:
    ¿Es compatible con'
  enunciado: 'Respecto de «Adición de fracciones algebraicas de distinto denominador»:
    ¿Es compatible con el procedimiento esta afirmación? «Sumar los numeradores por
    un lado y los denominadores por otro lado»'
  respuesta: 'No'
  solucion_pasos:
