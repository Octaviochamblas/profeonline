semantic_id: MAT.ALG.FRACCIONES_SUMA.DISTINTO_DENOMINADOR
resumen_inicial: Para sumar fracciones algebraicas de distinto denominador, se deben homogeneizar convirtiéndolas a un denominador común antes de sumar numeradores.
explicacion_simple: |
  Cuando los denominadores de las fracciones son distintos, no es posible sumar sus numeradores directamente.

  Primero debemos homogeneizarlas determinando un denominador común (obtenido mediante el m.c.m. de los denominadores originales).

  Luego amplificamos el numerador de cada fracción multiplicándolo por su correspondiente factor de amplificación, y finalmente sumamos los numeradores sobre la barra del denominador común.
explicacion_formal: |
  ### Definición formal
  Dadas dos fracciones algebraicas $\frac{A(x)}{P(x)}$ y $\frac{B(x)}{Q(x)}$ con $P(x) \neq 0$ y $Q(x) \neq 0$, la **adición de distinto denominador** se calcula como:

  $$\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)} = \frac{A(x) \cdot Q(x) + B(x) \cdot P(x)}{P(x) \cdot Q(x)}$$

  ### Desglose de la fórmula
  - $P(x) \cdot Q(x)$: Denominador común (o el $\operatorname{mcm}(P, Q)$ de menor grado).
  - $A(x) \cdot Q(x) + B(x) \cdot P(x)$: Numerador combinado resultante de la amplificación individual de cada fracción.

  ### Síntesis didáctica
  Sumar fracciones heterogéneas requiere construir un denominador común y sumar los numeradores amplificados respectivos.
definiciones_clave: |
  - **Homogeneización de fracciones**: Proceso de convertir fracciones de distinto denominador a un denominador común equivalente.
  - **Factor de amplificación**: Expresión por la cual se multiplica el numerador de cada fracción para alcanzar el denominador común.
propiedades_relaciones: |
  - **Uso del m.c.m.**: Utilizar el $\operatorname{mcm}(P,Q)$ en lugar del producto simple $P \cdot Q$ evita numeradores de grado excesivamente elevado.
  - **Dominio combinado**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid P(x) \neq 0 \land Q(x) \neq 0\}$.
ejemplo_guiado:
  enunciado: 'Suma las fracciones de distinto denominador $\frac{2}{x + 1} + \frac{3}{x + 3}$, expresa la suma sobre el denominador común $(x + 1)(x + 3)$ y evalúa para $x = 1$.'
  pasos:
    - 'Paso 1: Determinar el denominador común m.c.m. entre $(x + 1)$ y $(x + 3)$, que es $(x + 1)(x + 3)$.'
    - 'Paso 2: Amplificar el primer numerador por $(x + 3)$ y el segundo numerador por $(x + 1)$: $\frac{2(x + 3) + 3(x + 1)}{(x + 1)(x + 3)}$.'
    - 'Paso 3: Expandir y reducir el numerador: $2x + 6 + 3x + 3 = 5x + 9$.'
    - 'Paso 4: Escribir la suma homogeneizada final: $\frac{5x + 9}{(x + 1)(x + 3)}$ para $x \notin \{-1, -3\}$.'
    - 'Paso 5: Evaluar para $x = 1$: $\frac{5(1) + 9}{(1 + 1)(1 + 3)} = \frac{14}{2 \cdot 4} = \frac{14}{8} = \frac{7}{4}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la expresión equivalente homogeneizada de $\frac{2}{x + 1} + \frac{3}{x + 3}$?'
    choices:
      - {text: '$\frac{5x + 9}{(x + 1)(x + 3)}$', is_correct: true}
      - {text: '$\frac{5}{2x + 4}$', is_correct: false}
      - {text: '$\frac{5x + 5}{(x + 1)(x + 3)}$', is_correct: false}
      - {text: '$\frac{6}{(x + 1)(x + 3)}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{5x + 9}{(x + 1)(x + 3)}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la suma $\frac{5x + 9}{(x + 1)(x + 3)}$ para $x = 1$, ¿cuál es el valor numérico simplificado?'
    choices:
      - {text: '$\frac{7}{4}$', is_correct: true}
      - {text: '$\frac{14}{4}$', is_correct: false}
      - {text: '$\frac{5}{4}$', is_correct: false}
      - {text: '$\frac{7}{8}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{7}{4}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar el denominador común (m.c.m.) entre los denominadores de las fracciones.'
  - 'Paso 2: Para cada fracción, dividir el m.c.m. entre su denominador original para hallar su factor de amplificación.'
  - 'Paso 3: Multiplicar el numerador de cada fracción por su factor de amplificación correspondiente.'
  - 'Paso 4: Colocar la suma de los numeradores amplificados sobre la barra del denominador común.'
  - 'Paso 5: Expandir y reducir términos semejantes en el numerador.'
errores_correccion: |
  - **Error 1:** Sumar directamente numeradores y denominadores de fracciones distintas (escribir $\frac{A}{P} + \frac{B}{Q} = \frac{A+B}{P+Q}$). **Cómo corregirlo:** Jamás se deben sumar fracciones sin antes **HOMOGENEIZAR SUS DENOMINADORES MEDIANTE UN DENOMINADOR COMÚN (M.C.M.)**.
  - **Error 2:** Omitir la multiplicación del numerador por el factor de amplificación al cambiar el denominador. **Cómo corregirlo:** Al cambiar el denominador por el m.c.m., se debe **AMPLIFICAR CADA NUMERADOR POR EL FACTOR $\frac{\text{m.c.m.}}{\text{denominador original}}$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la suma de $\frac{1}{x} + \frac{2}{y}$ sobre el denominador común $xy$?'
    alternativas:
      - '$\frac{y + 2x}{xy}$'
      - '$\frac{3}{x+y}$'
      - '$\frac{1 + 2x}{xy}$'
    respuesta: '$\frac{y + 2x}{xy}$'
    solucion_pasos:
      - '1. Denominador común: $xy$.'
      - '2. Amplificar: $1 \cdot y + 2 \cdot x = y + 2x$.'
      - '3. Resultado: $\frac{y + 2x}{xy}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al sumar $\frac{3}{x-1} + \frac{1}{x+1}$, ¿cuál es el numerador reducido final?'
    alternativas:
      - '$4x + 2$'
      - '$4x - 2$'
      - '$4$'
    respuesta: '$4x + 2$'
    solucion_pasos:
      - '1. Denominador común: $(x-1)(x+1)$.'
      - '2. Numerador: $3(x+1) + 1(x-1) = 3x + 3 + x - 1 = 4x + 2$.'
  - titulo: 'Homogeneización previa'
    enunciado: '¿Es obligatorio hallar un denominador común para sumar fracciones heterogéneas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la condición matemática indispensable para poder combinar los numeradores.'
  - titulo: 'Suma de numeradores sin amplificar'
    enunciado: '¿Es correcto sumar los numeradores sin haberlos amplificado previamente?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, alteraría el valor equivalente de cada fracción.'
errores_frecuentes:
  - 'Sumar directamente numeradores y denominadores de fracciones distintas entre sí.'
  - 'Sumar numeradores de fracciones con distinto denominador sin haber homogeneizado.'
  - 'Omitir multiplicar el numerador por su factor de amplificación correspondiente.'
  - 'Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos semejantes.'
  - 'Omitir la verificación de irreductibilidad entre el numerador reducido y el m.c.m. denominador.'
afirmaciones_verdaderas:
  - 'Para sumar fracciones algebraicas de distinto denominador se convierten previamente a un denominador común.'
  - 'El uso del m.c.m. como denominador común minimiza el grado de los numeradores amplificados.'
al_terminar_debes_poder: |
  Sumar fracciones algebraicas de distinto denominador homogeneizándolas mediante su m.c.m. y reduciendo el numerador unificado resultante.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
