semantic_id: MAT.ALG.FRACCIONES_SUMA.DISTINTO_DENOMINADOR
resumen_inicial: 'Adición de fracciones algebraicas de distinto denominador: concepto,
  reglas operativas y simplificación en Adición de fracciones algebraicas.'
explicacion_simple: Si intentas sumar peras con manzanas sin transformarlas a 'frutas'
  primero, tendrás un problema. Con fracciones de distinto denominador, no puedes
  sumar los techos hasta que no unifiques los pisos.
explicacion_formal: '### Definición formal


  1/2 y 1/3 son pedazos de distinto tamaño. Necesitan un molde común (1/6).


  ### Desarrollo didáctico


  Este es el verdadero desafío del álgebra de fracciones. No puedes sumar fracciones
  con distintos denominadores directamente, porque estarías intentando sumar manzanas
  con limones.


  Antes de juntar los numeradores, debes forzar a que ambos denominadores sean idénticos.
  Este proceso se llama ''hallar el Mínimo Común Denominador (MCM)''.


  Si tienes $\frac{1}{x} + \frac{1}{y}$:

  1. El MCM de $x$ e $y$ es $xy$.

  2. Amplificas la primera fracción: le falta la ''y'' abajo, así que multiplicas
  arriba y abajo por ''y'' $\rightarrow \frac{y}{xy}$.

  3. Amplificas la segunda fracción: le falta la ''x'' abajo, multiplicas arriba y
  abajo por ''x'' $\rightarrow \frac{x}{xy}$.

  4. Ahora ambas tienen $xy$ abajo. Puedes juntar los techos.

  Resultado: $\frac{y+x}{xy}$.'
