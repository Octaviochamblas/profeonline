    con distintos denominadores directamente.'
errores_frecuentes:
- Sumar los numeradores por un lado y los denominadores por otro lado.
- Para «¿Por qué es incorrecto sumar directamente los numeradores si los denominadores
  son diferentes», la respuesta correcta es Porque el numerador siempre debe ser mayor
  al denominador.
- Es matemáticamente correcto pero no se acostumbra.
- Para «¿Por qué es incorrecto sumar directamente los numeradores si los denominadores
  son diferentes», la respuesta correcta es Porque los signos pueden ser diferentes.
- $\frac{2}{x+y}$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
