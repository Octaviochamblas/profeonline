procedimiento:
- 'Paso 1: Divide la región poligonal en triángulos que no se superpongan entre sí.'
- 'Paso 2: Calcula el área de cada triángulo por separado, usando la fórmula que corresponda
  según los datos disponibles.'
- 'Paso 3: Suma todas las áreas de los triángulos para obtener el área total de la
  región.'
