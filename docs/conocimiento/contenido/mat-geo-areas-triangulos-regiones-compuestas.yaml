semantic_id: MAT.GEO.AREAS_TRIANGULOS.AREA_REGIONES_COMPUESTAS
resumen_inicial: 'Cálculo del área de regiones poligonales descomponiéndolas en triángulos:
  conceptos, teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Cuando una figura tiene una forma irregular y no es un triángulo
  simple, se puede "cortar" en varios triángulos más pequeños, calcular el área de
  cada uno y sumarlas todas.
explicacion_formal: '![Área de regiones descompuestas en triángulos](/static/img/geometria/areas-pitagoras/areas-triangulos-regiones-compuestas.svg)


  ### Definición formal


  Cualquier polígono se puede descomponer en un conjunto de triángulos no superpuestos.
  El área total del

  polígono es la suma de las áreas de todos esos triángulos.


  ### Desarrollo didáctico


  Esta estrategia es muy útil para figuras irregulares donde no existe una fórmula
  directa de área, ya que

  siempre es posible triangular cualquier polígono, sin importar su forma.'
definiciones_clave: '- **Cálculo del área de regiones poligonales descomponiéndolas
  en triángulos**: Elemento o propiedad fundamental en el estudio de perímetros, áreas
  y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
