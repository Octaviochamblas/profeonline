semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.MAXIMOS_MINIMOS
resumen_inicial: 'Identificación de máximos y mínimos de la función coseno base: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: A diferencia del seno, el coseno alcanza su primer máximo exactamente
  en $x=0$, sin necesidad de avanzar ningún ángulo.
explicacion_formal: '### Definición formal


  El máximo de $\cos(x)$ ocurre cuando el punto asociado es $(1,0)$, es decir, cuando
  $x=2n\pi$. El mínimo ocurre cuando el punto asociado es $(-1,0)$, es decir, cuando
  $x=\pi+2n\pi$.


  ### Desarrollo didáctico


  Dentro de un período, el máximo se alcanza en $x=0$ y el mínimo en $x=\pi$. Sumando
  múltiplos de $2\pi$ se obtienen todos los demás máximos y mínimos: $x=2\pi$ también
  es un máximo.'
definiciones_clave: '- **Identificación de máximos y mínimos de la función coseno
  base**: Función periódica fundamentada en las coordenadas del círculo unitario o
  relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de máximos y mínimos de la función coseno base.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de máximos y mínimos de la función coseno base.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de máximos y mínimos de la función coseno
    base.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
