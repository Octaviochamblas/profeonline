procedimiento:
- 'Paso 1: Identifica el primer máximo dentro de un período, en $x=0$.'
- 'Paso 2: Suma múltiplos de $2\pi$ para encontrar todos los demás máximos.'
- 'Paso 3: Repite el proceso con $x=\pi$ para encontrar todos los mínimos.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en identificación de máximos
  y mínimos de la función coseno base.
ejemplos:
- titulo: Verificación de un máximo
  enunciado: ¿Es $x=4\pi$ un máximo de $f(x)=\cos(x)$?
  solucion_pasos:
  - 'Se verifica: $4\pi=2\cdot2\pi$.'
  - Sí, es un máximo, ya que corresponde a dos períodos completos después de $0$.
- titulo: Verificación de un mínimo
  enunciado: ¿Es $x=-\pi$ un mínimo de $f(x)=\cos(x)$?
  solucion_pasos:
  - Se calcula $\cos(-\pi)=-1$.
  - Sí, es un mínimo de la función.
- titulo: ¿La distancia entre un máximo y el siguiente máximo es igual al periodo?
  enunciado: ¿La distancia entre dos máximos consecutivos de $f(x)=\cos(x)$ es igual
    al periodo $2\pi$?
  respuesta: Sí
  solucion_pasos:
  - Al repetirse el patrón cada $2\pi$, los máximos también se repiten con esa misma
    separación.
- titulo: ¿El máximo del coseno está en el mismo lugar que el máximo del seno?
  enunciado: ¿El máximo de $f(x)=\cos(x)$ ocurre en el mismo valor de $x$ que el máximo
    de $g(x)=\sin(x)$?
  respuesta: 'No'
  solucion_pasos:
  - El máximo del coseno ocurre en $x=0$; el del seno, en $x=\pi/2$.
errores_frecuentes:
- Declarar la posición del máximo con la del mínimo.
- Omitir sumar múltiplos de $2\pi$ para encontrar todos los máximos y mínimos posibles.
- Declarar estos valores con los ceros de la función.
- Aplicar la fórmula del coseno a la función seno, donde las posiciones son distintas.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  identificación de máximos y mínimos de la función coseno base.
