semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.MAXIMOS_MINIMOS
resumen_inicial: 'Identificación de los puntos máximos (crestas a $y=1$) y mínimos (valles a $y=-1$) de la función coseno base $f(x) = \cos(x)$.'
explicacion_simple: |
  La onda del coseno oscila continuamente entre su punto más alto y su punto más bajo. Los **puntos máximos** (crestas) son los lugares donde la altura llega al techo $y = 1$; en el primer giro, esto sucede en $x = 0$ y en $x = 2\pi$. Los **puntos mínimos** (valles) son los lugares donde la altura cae al piso $y = -1$; en el primer giro, esto ocurre en $x = \pi$ ($180^\circ$). Como la onda se repite infinitamente, estos picos y valles vuelven a aparecer periódicamente cada $2\pi$ unidades.
explicacion_formal: |
  ### Definición formal
  Los **puntos extremos locales y absolutos** de la función coseno fundamental $f(x) = \cos(x)$ en el conjunto de los números reales $\mathbb{R}$ se clasifican en:

  1. **Máximos absolutos**: Puntos donde $f(x) = 1$:
     $$\mathcal{M}_{\max} = \{(2k\pi, 1) : k \in \mathbb{Z}\}$$

  2. **Mínimos absolutos**: Puntos donde $f(x) = -1$:
     $$\mathcal{M}_{\min} = \{(\pi + 2k\pi, -1) : k \in \mathbb{Z}\} = \{( (2k + 1)\pi, -1) : k \in \mathbb{Z}\}$$

  ### Desglose simbólico
  - $x = 0$ ($k = 0$): Primer máximo sobre el eje Y en $(0,1)$.
  - $x = \pi$ ($k = 0$): Primer mínimo absoluto en $(\pi, -1)$.
  - $x = 2\pi$ ($k = 1$): Segundo máximo positivo en $(2\pi, 1)$.
  - $x = -\pi$ ($k = -1$): Mínimo en el sentido negativo en $(-\pi, -1)$.

  ### Síntesis didáctica
  La distancia horizontal entre un máximo consecutivo y un mínimo consecutivo de la función coseno base es exactamente $\pi$ unidades ($180^\circ$). En cada máximo o mínimo la recta tangente a la curva es perfectamente horizontal (pendiente nula $f'(x) = -\sin x = 0$).
definiciones_clave: |
  - **Máximo absoluto**: Valor supremo $y = 1$ que alcanza la función sobre su dominio.
  - **Mínimo absoluto**: Valor ínfimo $y = -1$ que alcanza la función sobre su dominio.
  - **Puntos críticos horizontales**: Puntos donde la pendiente de la recta tangente se anula ($\sin x = 0$).
propiedades_relaciones: |
  - **Simetría entre extremos**: El punto medio entre un máximo $(0,1)$ y un mínimo $(\pi, -1)$ es un cero de la función $\left(\frac{\pi}{2}, 0\right)$.
  - **Desfase respecto al seno**: Los máximos del coseno ocurren exactamente donde el seno se anula.
ejemplo_guiado:
  enunciado: 'Encuentra las coordenadas del primer punto máximo y del primer punto mínimo positivos de la función $f(x) = 3\cos(x)$.'
  pasos:
    - 'Paso 1: Recordar las abscisas de los máximos y mínimos de la función coseno base: máximo en $x = 0$ y mínimo en $x = \pi$.'
    - 'Paso 2: Calcular el valor máximo multiplicando por la amplitud $A = 3$: $y_{\max} = 3 \cdot 1 = 3$. Coordenadas del máximo: $(0, 3)$.'
    - 'Paso 3: Calcular el valor mínimo multiplicando por la amplitud $A = 3$: $y_{\min} = 3 \cdot (-1) = -3$. Coordenadas del mínimo: $(\pi, -3)$.'
    - 'Paso 4: Concluir que la onda oscila entre la cresta $(0, 3)$ y el valle $(\pi, -3)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué abscisas se alcanzan todos los puntos máximos de la función coseno base $f(x) = \cos(x)$?'
    choices:
      - {text: '$x = 2k\pi$ con $k \in \mathbb{Z}$', is_correct: true}
      - {text: '$x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = \pi + 2k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 2k\pi$ con $k \in \mathbb{Z}$''. La función coseno alcanza $y = 1$ en todos los múltiplos pares de $\pi$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la ordenada del punto mínimo de la función base $y = \cos(x)$?'
    choices:
      - {text: '$-1$', is_correct: true}
      - {text: '$0$', is_correct: false}
      - {text: '$1$', is_correct: false}
      - {text: '$-\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$''. La cota mínima que alcanza el coseno base es la ordenada $y = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las abscisas donde el coseno se iguala a $+1$ (máximos) y a $-1$ (mínimos).'
  - 'Paso 2: Evaluar la función $f(x)$ en dichas abscisas para obtener las ordenadas extremas.'
  - 'Paso 3: Añadir la periodicidad $2k\pi$ ($k \in \mathbb{Z}$) para registrar todos los puntos infinitos de la gráfica.'
  - 'Paso 4: Escribir las coordenadas completas $(x_{\max}, y_{\max})$ y $(x_{\min}, y_{\min})$.'
errores_correccion: |
  - **Error 1:** Afirmar que el punto máximo del coseno ocurre en $x = \frac{\pi}{2}$. **Cómo corregirlo:** En $x = \frac{\pi}{2}$ la función vale cero. El máximo ocurre en $x = 0$ y en $x = 2\pi$.
  - **Error 2:** Creer que la distancia entre un máximo y el siguiente máximo es de $\pi$ radianes. **Cómo corregirlo:** La distancia entre dos máximos consecutivos es de **un período completo** ($2\pi$). La distancia de $\pi$ corresponde al trayecto de un máximo al mínimo siguiente.
ejemplos:
  - titulo: 'Primer máximo sobre el eje Y'
    enunciado: '¿Cuáles son las coordenadas del máximo inicial de $y = \cos(x)$?'
    alternativas:
      - '$(0, 1)$'
      - '$\left(\frac{\pi}{2}, 1\right)$'
      - '$(1, 0)$'
    respuesta: '$(0, 1)$'
    solucion_pasos:
      - '1. $\cos(0) = 1$.'
      - '2. El punto sobre el eje Y es $(0, 1)$.'
  - titulo: 'Primer mínimo en el ciclo'
    enunciado: '¿En qué punto alcanza su primer mínimo la curva $y = \cos(x)$?'
    alternativas:
      - '$(\pi, -1)$'
      - '$\left(\frac{3\pi}{2}, -1\right)$'
      - '$(2\pi, -1)$'
    respuesta: '$(\pi, -1)$'
    solucion_pasos:
      - '1. $\cos(\pi) = -1$.'
      - '2. El punto es $(\pi, -1)$.'
  - titulo: 'Mínimo en ángulo negativo'
    enunciado: '¿El punto $(-\pi, -1)$ es un punto mínimo de la función coseno base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\cos(-\pi) = \cos(\pi) = -1$.'
  - titulo: 'Distancia entre máximo y mínimo'
    enunciado: '¿La distancia horizontal entre el máximo en $x = 0$ y el mínimo en $x = \pi$ es igual a $\pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\pi - 0 = \pi$.'
errores_frecuentes:
  - 'La afirmación de que el punto máximo de la función coseno base se alcanza en $x = \frac{\pi}{2}$.'
  - 'La afirmación de que los puntos máximos de la función coseno ocurren a la distancia de un solo radián.'
  - 'La afirmación de que la ordenada del punto mínimo de la función coseno base es igual a cero.'
  - 'La afirmación de que existen únicamente dos puntos máximos en toda la gráfica del coseno.'
  - 'La afirmación de que la pendiente de la cosenoide es inclinada en sus crestas y valles.'
afirmaciones_verdaderas:
  - 'Los máximos absolutos de la función coseno base $f(x) = \cos(x)$ ocurren en los puntos $(2k\pi, 1)$ para todo $k \in \mathbb{Z}$.'
  - 'Los mínimos absolutos de la función coseno base ocurren en los puntos $(\pi + 2k\pi, -1)$ para todo $k \in \mathbb{Z}$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y ubicar los puntos máximos y mínimos de la función coseno base y de sus transformaciones.
  CÓMO: Hallar las abscisas donde $\cos(\text{argumento}) = \pm 1$ y calcular las ordenadas extremas correspondientes.
