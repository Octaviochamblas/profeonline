semantic_id: MAT.NUM.ENTEROS_CONJUNTO.PARES
resumen_inicial: "Un número par es todo entero divisible exactamente entre 2, incluyendo el cero y los negativos. Se representa algebraicamente como $2n$."
explicacion_simple: |
  Un número par es todo número que puedes repartir en dos grupos exactamente iguales, sin que sobre
  nada. Si tienes 6 caramelos y los divides entre 2 amigos, cada uno recibe 3 exactos — 6 es par. Si
  tienes 7 y los divides entre 2, sobra uno — 7 no es par. Los pares incluyen los negativos
  (-2, -4, -6…) y el cero, que también es par.
explicacion_formal: |
  Un número par es un entero divisible exactamente por $2$: al dividirlo, el resto es cero.
  Algebraicamente, todo par se representa como $2n$ con $n \in \mathbb{Z}$. La secuencia de pares es
  $\{\ldots, -4, -2, 0, 2, 4, \ldots\}$.
definiciones_clave: |
  **Número par**: entero de la forma $2n$, $n \in \mathbb{Z}$. **Pares consecutivos**: pares que
  difieren en dos unidades, representados como $2n, 2n+2, 2n+4$.
propiedades_relaciones: |
  La suma o resta de dos números pares es siempre par. El producto de cualquier entero por un
  número par es siempre par. El cero es par porque $0 = 2 \cdot 0$.
ejemplo_guiado:
  enunciado: "Determina si $-24$ es un número par."
  pasos:
    - 'Se realiza la división: $-24 \div 2 = -12$.'
    - "Se observa que $-12$ es entero y el resto es cero."
    - "Como la división es exacta, $-24$ es un número par."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estas expresiones representa siempre un número par, para cualquier $n \\in \\mathbb{Z}$?"
    choices:
      - {text: "$2n$", is_correct: true}
      - {text: "$2n + 1$", is_correct: false}
      - {text: "$n$", is_correct: false}
      - {text: "$n^2$", is_correct: false}
    explanation: "La correcta es $2n$, porque siempre tiene a $2$ como factor y por lo tanto el resto de dividir entre $2$ es siempre cero."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es $-30$ un número par?"
    choices:
      - {text: "Sí, porque $-30 \\div 2 = -15$ con resto cero", is_correct: true}
      - {text: "No, porque es negativo", is_correct: false}
      - {text: "No, porque termina en 0", is_correct: false}
      - {text: "No se puede determinar", is_correct: false}
    explanation: "La correcta es Sí, porque $-30 \\div 2 = -15$ con resto cero, la división es exacta."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Dividir el número entero por $2$."
  - "Paso 2: Verificar si el cociente es entero y el resto es cero."
  - 'Paso 3: Si se requiere una representación algebraica, utilizar la forma $2n$ con $n \in \mathbb{Z}$.'
errores_correccion: |
  Un error frecuente es pensar que el cero no es par "porque no se puede dividir": $0 \div 2 = 0$
  con resto cero, así que sí es par. Otro error es creer que los pares negativos no existen; la
  paridad no depende del signo, solo de si el resto de dividir entre 2 es cero.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determine si $-18$ es un número par."
    alternativas:
      - 'Sí, porque $-18 \div 2 = -9$ con resto $0$'
      - "No, porque es negativo"
      - 'No, porque $-18 \div 2$ no es exacta'
    respuesta: "Sí, porque $-18 \\div 2 = -9$ con resto $0$"
    solucion_pasos:
      - 'Se realiza la división: $-18 \div 2 = -9$.'
      - "Se observa que $-9$ es un número entero y el resto es cero."
      - "Como la división es exacta, $-18$ es un número par."
  - titulo: "Ejemplo 2"
    enunciado: "Escriba algebraicamente la suma de tres números pares consecutivos."
    alternativas:
      - "$(2n) + (2n+2) + (2n+4) = 6n + 6$"
      - "$2n + 2n + 2n = 6n$"
      - "$(2n) + (2n+1) + (2n+2) = 6n + 3$"
    respuesta: "$(2n) + (2n+2) + (2n+4) = 6n + 6$"
    solucion_pasos:
      - "Se define el primer par como $2n$."
      - "Se identifica el siguiente par sumando 2: $2n + 2$."
      - "Se identifica el tercer par: $2n + 4$."
      - "Resultado: $(2n) + (2n+2) + (2n+4) = 6n + 6$."
  - titulo: "¿Es $0$ un número par?"
    respuesta: "Sí"
    solucion_pasos:
      - '$0 \div 2 = 0$ con resto $0$: la división es exacta.'
      - '$0 = 2 \cdot 0$, que es de la forma $2n$ con $n = 0$.'
      - "Por lo tanto, $0$ sí es un número par."
  - titulo: "¿Es $-7$ un número par?"
    respuesta: "No"
    solucion_pasos:
      - '$-7 \div 2 = -3$ con resto $-1$: la división no es exacta.'
      - '$-7$ no puede escribirse como $2n$ para ningún $n \in \mathbb{Z}$.'
      - "Por lo tanto, $-7$ no es par; es impar."
errores_frecuentes:
  - "El cero no es número par porque no se puede dividir entre dos."
  - "Los números pares negativos no existen porque los pares son positivos."
  - "La suma de un número par y un número impar siempre da un número par."
  - "Solo los números que terminan en $0, 2, 4, 6, 8$ son pares (ignorando negativos)."
  - "El producto de dos números pares es impar."
afirmaciones_verdaderas:
  - "El número 0 es par."
  - "Todo número par se puede escribir de la forma 2n."
al_terminar_debes_poder: |
  Determinar si un entero cualquiera (positivo, negativo o cero) es par, y representar
  algebraicamente un número par o una secuencia de pares consecutivos usando $2n$.

fuente: "Álgebra Ximena Carreño p.8"
estado: publicado
