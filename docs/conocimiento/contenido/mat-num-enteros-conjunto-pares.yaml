semantic_id: MAT.NUM.ENTEROS_CONJUNTO.PARES
resumen_inicial: 'Los números pares son todos los múltiplos enteros de 2: $n = 2k$
  con $k \in \mathbb{Z}$.'
explicacion_simple: Un número entero es par si se puede dividir exactamente entre
  dos sin dejar residuo. En el conjunto de los enteros, los números pares corresponden
  a todos los múltiplos de 2, lo que incluye a los pares positivos, al cero y a los
  pares negativos.
explicacion_formal: 'Un entero $n \in \mathbb{Z}$ se define como un **Número Par**
  si existe un entero $k \in \mathbb{Z}$ tal que:


  $$n = 2k \quad \iff \quad n \equiv 0 \pmod 2$$


  **Desglose de la fórmula:**

  - $2k$: Representación de un múltiplo exacto del entero 2.

  - $k \in \mathbb{Z}$: Parámetro entero que puede ser positivo, negativo o cero ($k
  = 0 \implies n = 0$).

  - $n \equiv 0 \pmod 2$: Residuo igual a cero en la división entera por 2.


  > **Complemento didáctico:** El cero es un número par por cumplir $0 = 2(0)$, y
  los enteros negativos como $-4 = 2(-2)$ también conservan la paridad.'
definiciones_clave: '- **Número par**: Múltiplo entero de 2 de la forma $2k$ con $k
  \in \mathbb{Z}$.

  - **Paridad entera**: Propiedad de divisible por 2 extendida a todo el cuerpo de
  los enteros.'
propiedades_relaciones: '- **Suma de pares**: La adición de dos enteros pares resulta
  siempre en otro número par.

  - **Inclusión del cero**: $0$ es par pues $0 = 2 \cdot 0$.'
ejemplo_guiado:
  enunciado: Demuestre que el entero negativo $-6$ es un número par aplicando la definición
    algebraicas $2k$.
  pasos:
  - 'Paso 1: Buscar un número entero $k$ tal que $2k = -6$.'
  - 'Paso 2: Resolver la ecuación: $k = -3 \in \mathbb{Z}$.'
  - 'Paso 3: Escribir la relación: $-6 = 2(-3)$.'
  - 'Conclusión: Como $-3$ es un entero, $-6$ cumple la definición $2k$ y es un número
    par.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el número 0 se clasifica como un número par?
  choices:
  - text: Porque se puede escribir como 2k con k = 0 (múltiplo de 2)
    is_correct: true
  - text: Porque es un número positivo
    is_correct: false
  - text: Porque no es divisible por 2
    is_correct: false
  - text: Es un error, el cero no es par ni impar
    is_correct: false
  explanation: La alternativa correcta es 'Porque se puede escribir como 2k con k
    = 0 (múltiplo de 2)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué valor de k demuestra que -6 es par?
  choices:
  - text: k = -3
    is_correct: true
  - text: k = 3
    is_correct: false
  - text: k = -6
    is_correct: false
  - text: k = 0
    is_correct: false
  explanation: La alternativa correcta es 'k = -3', ya que $2(-3) = -6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el número entero dado entre 2.'
- 'Paso 2: Comprobar que la división sea exacta sin residuo decimal.'
- 'Paso 3: Concluir que el número es par si responde al modelo $2k$ con $k \in \mathbb{Z}$.'
errores_correccion: '- **Error 1: Excluir al número cero del conjunto de los números
  pares.** **Cómo corregirlo:** $0 = 2 \cdot 0$, por lo que satisface formalmente
  la definición de paridad.


  - **Error 2: Pensar que los números pares negativos no son pares.** **Cómo corregirlo:**
  La paridad es una propiedad de todo el conjunto $\mathbb{Z}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números es un entero par?
  alternativas:
  - '-8'
  - '-5'
  - '7'
  respuesta: '-8'
  solucion_pasos:
  - $-8 = 2(-4)$, por lo tanto $-8$ es par.
- titulo: Ejemplo 2
  enunciado: Si $n$ es par, ¿qué tipo de número es $n + 2$?
  alternativas:
  - Un número par
  - Un número impar
  - Indeterminado
  respuesta: Un número par
  solucion_pasos:
  - Sumar 2 a un número par da como resultado el siguiente par consecutivo.
- titulo: ¿Es el número 0 un entero par?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0 = 2(0)$ es un múltiplo exacto de 2.
- titulo: ¿Es -14 un número par?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-14 = 2(-7)$ es un entero par negativo.
errores_frecuentes:
- El número entero cero no se considera un número par dentro de los enteros.
- Los números enteros negativos no pueden clasificarse como números pares.
- Un número es par únicamente si la suma de sus dígitos da como resultado un número
  primo.
- Dividir un número par entre 2 da siempre como resultado otro número par.
- Todos los números pares son obligatoriamente mayores o iguales a dos.
afirmaciones_verdaderas:
- Un número par es cualquier múltiplo entero de 2 de la forma $2k$.
- El cero y los enteros negativos divisibles por 2 son números pares.
al_terminar_debes_poder: Al terminar serás capaz de identificar si cualquier entero
  es par, comprobando que responda a la forma $2k$ ($k \in \mathbb{Z}$) o que su división
  por 2 tenga residuo cero.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
