semantic_id: MAT.ALG.EXPRESIONES.DEFINICION_EXPRESION
resumen_inicial: 'Una expresión algebraica es una combinación finita de constantes numéricas y variables literales vinculadas mediante operaciones aritméticas elementales.'
explicacion_simple: |
  - Una **expresión algebraica** es una combinación de números y letras unidos por signos de operaciones como sumar ($+$), restar ($-$), multiplicar ($\cdot$), dividir ($\div$) o elevar a potencias.
  - Por ejemplo: $3x^2 - 5xy + 8$ o $\frac{2a + b}{c - 1}$.
  - **Diferencia clave con una ecuación:**
    - Una expresión algebraica **no tiene signo igual ($=$)**: es una frase matemática que puede evaluarse o simplificarse.
    - Una ecuación **sí tiene signo igual ($=$)** y busca encontrar el valor de una incógnita (como $2x + 3 = 11$).

  ![Expresión Algebraica](/static/img/nodos/definicion-de-expresion-algebraica-intro.svg)
explicacion_formal: |
  ### Definición conjuntista formal
  Sea $\mathbb{K} \subseteq \mathbb{R}$ un cuerpo numérico y $\mathcal{V} = \{x_1, x_2, \dots, x_n\}$ un conjunto finito de variables reales.
  Una **expresión algebraica** $E(x_1, \dots, x_n)$ es cualquier elemento del álgebra libre generada por $\mathbb{K} \cup \mathcal{V}$ bajo una cantidad finita de aplicaciones de las operaciones racionales $(+, -, \cdot, \div)$ y extracción de raíces $(\sqrt[n]{\cdot})$.

  $$E(x, y) = \frac{a_0 + \sum_{i=1}^p c_i x^{e_i} y^{m_i}}{b_0 + \sum_{j=1}^q d_j x^{k_j} y^{n_j}}$$

  ### Dominio de definición
  El dominio de una expresión algebraica $\operatorname{Dom}(E) \subseteq \mathbb{R}^n$ es el conjunto de tuplas reales donde todas las operaciones están matemáticamente definidas (denominadores no nulos y radicandos pares no negativos).
definiciones_clave: |
  - **Expresión algebraica**: Combinación finita de números y letras enlazados por operaciones aritméticas.
  - **Valor numérico**: Número real obtenido al sustituir las variables por valores específicos del dominio.
  - **Dominio de definición**: Conjunto de valores para los cuales la expresión no genera indeterminaciones.
propiedades_relaciones: |
  - **Expresión vs Ecuación**: Una expresión representa una cantidad o fórmula ($3x + 5$), mientras una ecuación afirma una igualdad condicional ($3x + 5 = 20$).
  - **Clasificación estructural**: Se dividen en racionales (enteras o fraccionarias) e irracionales (con variables bajo signo radical).
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico de la expresión algebraica $E(x, y) = \frac{3x^2 - 2xy + 5}{x + y}$ para $x = 3$ e $y = 2$.'
  imagen: '/static/img/nodos/definicion-de-expresion-algebraica-ejemplos.svg'
  pasos:
    - 'Paso 1: Evaluamos el numerador sustituyendo $x = 3, y = 2$:'
    - '  - $3(3)^2 = 3(9) = 27$'
    - '  - $-2(3)(2) = -12$'
    - '  - Numerador: $27 - 12 + 5 = 20$.'
    - 'Paso 2: Evaluamos el denominador: $x + y = 3 + 2 = 5$.'
    - 'Paso 3: Calculamos el cociente final: $E(3, 2) = \frac{20}{5} = **4**$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes fórmulas es estrictamente una expresión algebraica y NO una ecuación?'
    choices:
      - text: '$4x^2 - 7x + 12$'
        is_correct: true
      - text: '$2x + 5 = 15$'
        is_correct: false
      - text: '$x^2 - 9 = 0$'
        is_correct: false
      - text: '$3y = 6$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$4x^2 - 7x + 12$''. No contiene el signo de igualdad ($=$), por lo que es una expresión y no una ecuación.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en la expresión $E(x) = \frac{10}{x - 4}$ sustituimos $x = 4$, ¿qué ocurre?'
    choices:
      - text: 'La expresión queda indefinida por división entre cero'
        is_correct: true
      - text: 'El valor numérico es 0'
        is_correct: false
      - text: 'El valor numérico es 10'
        is_correct: false
      - text: 'El resultado es -4'
        is_correct: false
    explanation: 'La alternativa correcta es ''La expresión queda indefinida por división entre cero''. $4 - 4 = 0$, y la división entre cero no existe en $\mathbb{R}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las variables y constantes presentes en la expresión.'
  - 'Paso 2: Reconocer la jerarquía de las operaciones involucradas (paréntesis, potencias, productos, sumas).'
  - 'Paso 3: Determinar el dominio admisible verificando restricciones operacionales.'
  - 'Paso 4: Sustituir los valores dados para calcular el valor numérico correspondiente.'
errores_correccion: |
  - **Error 1:** Confundir expresión algebraica con ecuación intentando "despejar la $x$" cuando no hay signo igual. **Cómo corregirlo:** Una expresión **se simplifica o se evalúa**, solo las ecuaciones con $=$ se despejan.
  - **Error 2:** Evaluar en puntos fuera del dominio. **Cómo corregirlo:** Verificar siempre que los **denominadores sean distintos de cero**.
ejemplos:
  - titulo: 'Valor numérico de trinomio'
    enunciado: '¿Cuál es el valor numérico de $2x^2 - 3x + 1$ cuando $x = -2$?'
    alternativas:
      - '$15$'
      - '$-1$'
      - '$3$'
    respuesta: '$15$'
    solucion_pasos:
      - '1. $(-2)^2 = 4 \implies 2(4) = 8$.'
      - '2. $-3(-2) = +6$.'
      - '3. $8 + 6 + 1 = 15$.'
  - titulo: 'Distinción de tipo de expresión'
    enunciado: 'La expresión $\sqrt{x} + 3x$, ¿a qué tipo de expresión algebraica pertenece?'
    alternativas:
      - 'Expresión algebraica irracional'
      - 'Polinomio entero'
      - 'Ecuación lineal'
    respuesta: 'Expresión algebraica irracional'
    solucion_pasos:
      - '1. La variable $x$ se encuentra bajo el signo de raíz ($\sqrt{x}$).'
      - '2. Corresponde a una expresión irracional.'
  - titulo: 'Carácter evaluable de expresiones'
    enunciado: '¿Produce una expresión algebraica un único valor numérico al fijar valores válidos para todas sus variables?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Al sustituir números reales admisibles se obtiene un único valor numérico.'
      - '2. Es una función unívoca de sus variables.'
  - titulo: 'Presencia de signo igual'
    enunciado: '¿Contiene una expresión algebraica elemental obligatoriamente un signo de igualdad ($=$)?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Las expresiones algebraicas no contienen signo igual.'
      - '2. La presencia de igualdad define una ecuación o identidad.'
errores_frecuentes:
  - 'Tratar a una expresión algebraica como una ecuación intentando despejar una variable inexistente.'
  - 'Olvidar la jerarquía de las operaciones al calcular el valor numérico sustituyendo variables.'
  - 'Elevar al cuadrado el signo negativo sin usar paréntesis al evaluar potencias (hacer $-2^2 = -4$ en vez de $(-2)^2 = 4$).'
  - 'Evaluar expresiones racionales en valores que anulan el denominador.'
  - 'Considerar que las expresiones irracionales son polinomios algebraicos estándar.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es una combinación finita de constantes y variables unidas por operaciones aritméticas.'
  - 'Toda ecuación está formada por la igualdad entre dos expresiones algebraicas.'
al_terminar_debes_poder: |
  ![Resumen de Expresión Algebraica](/static/img/nodos/definicion-de-expresion-algebraica-resumen.svg)

  QUÉ: Definir rigurosamente el concepto de expresión algebraica, diferenciarla de una ecuación y calcular su valor numérico en el dominio admisible.
  CÓMO: Reconociendo la combinación finita de constantes y variables ($E(x, y)$) y evaluando operaciones jerarquizadas sin signo de igualdad.
