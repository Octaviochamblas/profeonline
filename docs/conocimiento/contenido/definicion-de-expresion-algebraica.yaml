semantic_id: MAT.ALG.EXPRESIONES.DEFINICION_EXPRESION
resumen_inicial: 'Definición de expresión algebraica: concepto y propiedades en Expresiones
  algebraicas y polinomios básicos.'
explicacion_simple: Ya conocemos los vagones individuales (términos). Ahora es el
  momento de engancharlos para formar trenes matemáticos completos. Un tren puede
  tener un vagón o cien vagones.
explicacion_formal: '### Definición formal


  La expresión es el lenguaje, la combinación sintácticamente válida de símbolos y
  operaciones, sin necesidad de ser una ecuación.


  ### Desarrollo didáctico


  Cualquier trozo de matemáticas que escribas siguiendo las reglas es una expresión
  algebraica.

  - Ejemplos de expresiones de 1 término: $5x$, $-y^2$, $\frac{a}{b}$.

  - Ejemplos de expresiones de 2 términos: $x + y$, $a^2 - b^2$.

  - Ejemplos de expresiones de 3 términos: $a + b + c$, $x^2 + 5x + 6$.


  La expresión algebraica es el concepto general, el ''paraguas''. Luego, dependiendo
  de cuántos términos la compongan, la clasificaremos con nombres específicos (Monomios,
  Binomios, Polinomios).'
definiciones_clave: '- **Definición de expresión algebraica**: Elemento fundamental
  del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Definición de expresión algebraica**:
  Reglas de notación y clasificación en expresiones algebraicas y polinomios básicos.'
ejemplo_guiado:
