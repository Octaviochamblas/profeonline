procedimiento:
- 'Paso 1: Observa el conjunto de números, letras y operaciones matemáticas.'
- 'Paso 2: Si no hay un signo igual (=) o de desigualdad (<, >), es una expresión
  pura.'
- 'Paso 3: Si tiene un igual, se convierte en una ecuación (una igualdad entre dos
  expresiones).'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar definición de expresión algebraica.
ejemplos:
- titulo: Todo cabe en el paraguas
  enunciado: ¿Es '(x^2 + y) / 2' una expresión algebraica?
  solucion_pasos:
  - Tiene variables (x, y).
  - Tiene operaciones (potencia, suma, división).
  - Cumple la sintaxis matemática. Sí, es una expresión algebraica válida.
- titulo: En una prueba, se pide a los estudiantes escribir una expresión algebraica
    que represente el
  enunciado: 'En una prueba, se pide a los estudiantes escribir una expresión algebraica
    que represente el perímetro de un rectángulo. Juan escribe $2a + 2b$. Pedro escribe
    $P = 2a + 2b$. Según el rigor del lenguaje algebraico, ¿quién cumplió estrictamente
    la instrucción de escribir SOLO una ''expresión''? (v1)


    Opciones: A) Solo Juan, porque escribió un conjunto de operaciones sin formular
    una igualdad. · B) Solo Pedro, porque toda expresión requiere una letra que indique
    el resultado total. · C) Ambos, porque significan matemáticamente lo mismo. ·
    D) Ninguno de los dos.'
  solucion_pasos:
  - Juan escribió la expresión. Pedro, al agregar 'P =', construyó una ecuación o
    fórmula, excediendo la definición de simple expresión.
  - 'Respuesta: Solo Juan, porque escribió un conjunto de operaciones sin formular
    una igualdad.'
- titulo: 'Respecto de «Definición de expresión algebraica»: ¿Describe adecuadamente
    el concepto esta f'
  enunciado: 'Respecto de «Definición de expresión algebraica»: ¿Describe adecuadamente
    el concepto esta frase? «Una **Expresión Algebraica** es la representación de
    un símbolo algebraico o de **una o más operaciones algebraicas**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una **Expresión Algebraica**
    es la representación de un símbolo algebraico o de **una o más operaciones algebraicas**.'
- titulo: 'Respecto de «Definición de expresión algebraica»: ¿Se puede aceptar esta
    afirmación? «Confun'
  enunciado: 'Respecto de «Definición de expresión algebraica»: ¿Se puede aceptar
    esta afirmación? «Confundir una ''expresión'' con una ''ecuación''. Una expresión
    (ej. $2x + 1$) no se ''resuelve'' ni se ''despeja'', solo se evalúa o simplifica.
    La ecuación ($2x + 1 = 5$) sí se resuelve porque tiene un signo igual»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una **Expresión Algebraica**
    es la representación de un símbolo algebraico o de **una o más operaciones algebraicas**.'
errores_frecuentes:
- Confundir una 'expresión' con una 'ecuación'. Una expresión (ej. $2x + 1$) no se
  'resuelve' ni se 'despeja', solo se evalúa o simplifica. La ecuación ($2x + 1 =
  5$) sí se resuelve porque tiene un signo igual.
- Creer que si tiene solo un término no es una 'expresión'. Las expresiones pueden
  tener desde 1 hasta infinitos términos.
- Para «¿Cuál de las siguientes definiciones describe con mayor exactitud el concepto
  de 'Expresión Algebraica'? (v1)», la respuesta correcta es Una igualdad condicional
  entre dos polinomios que debe ser despejada.
- Una operación que solo involucra letras, sin incluir números o exponentes.
- El resultado final de una multiplicación.
afirmaciones_verdaderas:
- La notación de definición de expresión algebraica sigue las convenciones del lenguaje
  algebraico.
al_terminar_debes_ponder: Identificar y operar con conceptos relativos a definición
