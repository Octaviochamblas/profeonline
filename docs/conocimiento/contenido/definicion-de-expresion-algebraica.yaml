resumen_inicial: Una expresión algebraica es la combinación de constantes numéricas
  y variables literales interconectadas mediante operaciones aritméticas (suma, resta,
  multiplicación, división, potenciación y radicación).
explicacion_simple: Una expresión algebraica es como una frase en el lenguaje de la
  matemática. Combina números y letras usando signos de operación (como $3x^2 - 5x
  + 4$ o $\frac{2a + b}{c}$). A diferencia de una ecuación, no lleva un signo igual
  ($=$); es simplemente una combinación de términos para ser calculada o simplificada.
explicacion_formal: 'Se define una **Expresión Algebraica** $E(x_1, \dots, x_m)$ sobre
  el cuerpo de los números reales $\mathbb{R}$ como la combinación finita de elementos
  del conjunto de constantes $C \subset \mathbb{R}$ y variables $X = \{x_1, \dots,
  x_m\}$ mediante el conjunto de operaciones $O = \{+, -, \cdot, /, (\cdot)^n, \sqrt[n]{\cdot}\}$:


  $$E(x_1, \dots, x_m) \in \mathbb{R}\langle X, C, O \rangle$$


  > **Complemento didáctico:** La expresión algebraica generaliza el cálculo numérico
  al vincular variables cuantitativas mediante operadores analíticos.'
definiciones_clave: '- **Expresión algebraica**: Conjunto de números y letras unidos
  por operaciones aritméticas finitas.

  - **Evaluación algebraica**: Sustitución de variables por valores numéricos específicos.'
propiedades_relaciones: '- **Diferencia con ecuación**: Una expresión algebraica carece
  de signo de igualdad condicional ($=$).'
ejemplo_guiado:
  enunciado: Clasifique si la combinación $E = 4x^3 - \sqrt{y} + \frac{2}{z}$ representa
    una expresión algebraica válida.
  pasos:
  - 'Paso 1: Identificar constantes numéricas: $4, 2$.'
  - 'Paso 2: Identificar variables literales: $x, y, z$.'
  - 'Paso 3: Identificar operadores presentes: resta ($-$), raíz ($\sqrt{y}$), división
    ($\frac{2}{z}$), resta/suma.'
  - 'Paso 4: Comprobar la ausencia de signo igual ($=$) que la convertiría en ecuación.'
  - 'Conclusión: Es una expresión algebraica válida sobre tres variables.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué elemento diferencia fundamentalmente a una expresión algebraica de
    una ecuación?
  choices:
  - text: Que la expresión algebraica no contiene una relación de igualdad (=) condicional
    is_correct: true
  - text: Que la expresión algebraica carece de coeficientes numéricos
    is_correct: false
  - text: Que no puede contener exponentes superiores a 1
    is_correct: false
  - text: Que sólo se utiliza en geometría
    is_correct: false
  explanation: La alternativa correcta es 'Que la expresión algebraica no contiene
    una relación de igualdad (=) condicional'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4x^3 - sqrt(y) + 2/z, ¿por qué se confirmó como
    expresión algebraica?
  choices:
  - text: Porque combina números y letras mediante operaciones finitas sin signo igual
    is_correct: true
  - text: Porque su resultado es igual a cero
    is_correct: false
  - text: Porque tiene un solo término
    is_correct: false
  - text: Porque no contiene variables
    is_correct: false
  explanation: La alternativa correcta es 'Porque combina números y letras mediante
    operaciones finitas sin signo igual'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las constantes y variables del sistema.'
- 'Paso 2: Verificar que estén vinculadas por operaciones aritméticas finitas.'
- 'Paso 3: Confirmar la estructura algebraica declarando la expresión.'
errores_correccion: '- **Error 1: Tratar la expresión $3x + 5$ como si fuera una ecuación
  resolviendo $x = -5/3$.** **Cómo corregirlo:** Una expresión algebraica no se ''resuelve''
  buscando $x$; solo se evalúa o simplifica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes estructuras es una expresión algebraica?
  alternativas:
  - 5x^2 - 3x + 7
  - 2x + 4 = 10
  - x > 5
  - 3 + 8 = 11
  respuesta: 5x^2 - 3x + 7
  solucion_pasos:
  - 1. 5x^2 - 3x + 7 combina constantes y variables sin signos de igualdad o desigualdad.
  - 2. Es una expresión algebraica.
- titulo: Ejemplo 2
  enunciado: Al evaluar la expresión algebraica 2x + 5 para x = 4, ¿qué valor se obtiene?
  alternativas:
  - '13'
  - '11'
  - '20'
  - '8'
  respuesta: '13'
  solucion_pasos:
  - '1. Sustituir x por 4: 2(4) + 5.'
  - '2. Calcular: 8 + 5 = 13.'
- titulo: ¿Es la combinación 7a^3 - 2b/c una expresión algebraica válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, combina variables a, b, c mediante resta, división y potencia.
- titulo: ¿Es la igualdad 4x - 1 = 15 una expresión algebraica?
  respuesta: 'No'
  solucion_pasos:
  - No, al incluir la relación de igualdad = 15 se convierte en una ecuación.
errores_frecuentes:
- Declarar que una expresión algebraica exige obligatoriamente un signo de igualdad
  = para ser válida.
- Intentar resolver una expresión buscando valores de incógnita como si fuera una
  ecuación.
- Declarar que un número constante solo sin letras no puede formar parte de una expresión
  algebraica.
- Declarar que las operaciones de raíz o división anulan el carácter de expresión
  algebraica.
- Declarar la evaluación de una expresión con la simplificación de términos semejantes.
afirmaciones_verdaderas:
- Una expresión algebraica combina números y letras mediante operaciones aritméticas
  finitas.
- Evaluar una expresión consiste en reemplazar sus variables por números dados y calcular
  el resultado.
al_terminar_debes_poder: Al terminar serás capaz de identificar y evaluar expresiones
  algebraicas diferenciándolas claramente de las ecuaciones.
