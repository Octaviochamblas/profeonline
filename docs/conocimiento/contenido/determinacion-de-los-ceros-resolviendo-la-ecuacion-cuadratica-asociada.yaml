semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CALCULO
resumen_inicial: 'La determinación analítica de los ceros de una función cuadrática se realiza resolviendo su ecuación asociada $ax^2 + bx + c = 0$ mediante factorización o la fórmula general resolvente.'
explicacion_simple: |
  Para calcular los valores exactos de $x$ donde la parábola corta al eje horizontal, igualamos la función a cero ($f(x) = 0$). Esto transforma la función en una ecuación cuadrática de segundo grado, la cual se puede resolver buscando factores cuyo producto sea cero o aplicando la fórmula general conocida como la resolvente cuadrática.
explicacion_formal: |
  ### Definición formal
  Los ceros reales de la función cuadrática $f(x) = ax^2 + bx + c$ son las soluciones de la **ecuación cuadrática asociada**:
  $$ax^2 + bx + c = 0$$
  obtenidas mediante la fórmula resolvente universal:
  $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

  ### Desglose simbólico
  - $\Delta = b^2 - 4ac$: Discriminante que determina la naturaleza de las raíces.
  - $x_1 = \frac{-b + \sqrt{\Delta}}{2a}$: Primera solución o cero real.
  - $x_2 = \frac{-b - \sqrt{\Delta}}{2a}$: Segunda solución o cero real.

  ### Síntesis didáctica
  Métodos de resolución complementarios:
  1. **Factorización directa**: Eficaz para trinomios cuadrados perfectos, diferencias de cuadrados o trinomios mónicos simples $(x - x_1)(x - x_2) = 0$.
  2. **Fórmula general**: Método universal aplicable a cualquier función cuadrática con coeficientes reales $a \neq 0$.
definiciones_clave: |
  - **Ecuación cuadrática asociada**: Igualdad $ax^2 + bx + c = 0$ planteada para hallar las preimágenes nulas $f(x) = 0$.
  - **Fórmula general resolvente**: Expresión $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ para calcular las raíces de un polinomio de segundo grado.
  - **Propiedad del producto nulo**: Regla algebraica que establece que $A \cdot B = 0 \iff A = 0 \lor B = 0$.
propiedades_relaciones: |
  - **Relaciones de Vieta**: La suma de los ceros es $x_1 + x_2 = -\frac{b}{a}$ y su producto es $x_1 \cdot x_2 = \frac{c}{a}$.
  - **Comprobación por sustitución**: Si $x_k$ es un cero calculado correctamente, al evaluar $f(x_k)$ el resultado numérico exacto debe ser $0$.
ejemplo_guiado:
  enunciado: 'Determina analíticamente los ceros de la función cuadrática $f(x) = 2x^2 - 5x - 3$ aplicando la fórmula general resolvente y escribe las coordenadas de sus puntos de corte con el eje $x$.'
  pasos:
    - 'Paso 1: Igualamos la función a cero: $2x^2 - 5x - 3 = 0$. Identificamos $a = 2$, $b = -5$ y $c = -3$.'
    - 'Paso 2: Calculamos el discriminante: $\Delta = b^2 - 4ac = (-5)^2 - 4(2)(-3) = 25 + 24 = 49$.'
    - 'Paso 3: Aplicamos la fórmula general: $x = \frac{-(-5) \pm \sqrt{49}}{2(2)} = \frac{5 \pm 7}{4}$.'
    - 'Paso 4: Obtenemos las dos soluciones: $x_1 = \frac{5 + 7}{4} = \frac{12}{4} = 3$ y $x_2 = \frac{5 - 7}{4} = \frac{-2}{4} = -\frac{1}{2}$. Los puntos de corte son $(3, 0)$ y $(-\frac{1}{2}, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al resolver la ecuación asociada a $g(x) = x^2 - 8x + 12 = 0$ por factorización, ¿cuáles son sus ceros reales?'
    choices:
      - {text: '$x_1 = 2$ y $x_2 = 6$', is_correct: true}
      - {text: '$x_1 = -2$ y $x_2 = -6$', is_correct: false}
      - {text: '$x_1 = 4$ y $x_2 = 3$', is_correct: false}
      - {text: '$x_1 = 8$ y $x_2 = -12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 2$ y $x_2 = 6$''. Factorizamos $(x - 2)(x - 6) = 0$, obteniendo los ceros $x_1 = 2$ y $x_2 = 6$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son los ceros de la función cuadrática incompleta $h(x) = 3x^2 - 12x$?'
    choices:
      - {text: '$x_1 = 0$ y $x_2 = 4$', is_correct: true}
      - {text: '$x_1 = 3$ y $x_2 = 12$', is_correct: false}
      - {text: '$x_1 = -4$ y $x_2 = 4$', is_correct: false}
      - {text: '$x_1 = 0$ y $x_2 = -4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 0$ y $x_2 = 4$''. Factorizamos la ecuación $3x(x - 4) = 0 \implies 3x = 0 \implies x_1 = 0$ o $x - 4 = 0 \implies x_2 = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Plantear la ecuación cuadrática igualando la función a cero ($ax^2 + bx + c = 0$).'
  - 'Paso 2: Identificar los coeficientes $a$, $b$ y $c$, y calcular la cantidad $\Delta = b^2 - 4ac$.'
  - 'Paso 3: Sustituir en $x = \frac{-b \pm \sqrt{\Delta}}{2a}$ (o factorizar el trinomio) y simplificar para obtener los ceros $x_1$ y $x_2$.'
errores_correccion: |
  - **Error 1:** Olvidar dividir por $2a$ a todo el numerador en la fórmula general. **Cómo corregirlo:** La línea divisoria de la fórmula $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ abarca desde el término $-b$ hasta la raíz completa.
  - **Error 2:** Error en la ley de signos al calcular $-b$ cuando $b$ es negativo. **Cómo corregirlo:** Si $b = -6$, entonces $-b = -(-6) = +6$. El signo negativo de la fórmula invierte el signo original de $b$.
ejemplos:
  - titulo: 'Cálculo de ceros por factorización de diferencia de cuadrados'
    enunciado: '¿Cuáles son los ceros de $f(x) = 4x^2 - 25$?'
    alternativas:
      - '$x_1 = \frac{5}{2}$ y $x_2 = -\frac{5}{2}$'
      - '$x_1 = 5$ y $x_2 = -5$'
      - '$x_1 = \frac{25}{4}$ y $x_2 = 0$'
    respuesta: '$x_1 = \frac{5}{2}$ y $x_2 = -\frac{5}{2}$'
    solucion_pasos:
      - '1. Planteamos la ecuación: $4x^2 - 25 = 0$.'
      - '2. Factorizamos como suma por diferencia: $(2x - 5)(2x + 5) = 0$.'
      - '3. Igualamos cada factor a cero: $2x = 5 \implies x = \frac{5}{2}$ y $2x = -5 \implies x = -\frac{5}{2}$.'
  - titulo: 'Cálculo de ceros por fórmula general'
    enunciado: 'Resuelve $x^2 - 2x - 8 = 0$ mediante fórmula general para hallar los ceros de la función.'
    alternativas:
      - '$x_1 = 4$ y $x_2 = -2$'
      - '$x_1 = -4$ y $x_2 = 2$'
      - '$x_1 = 8$ y $x_2 = 1$'
    respuesta: '$x_1 = 4$ y $x_2 = -2$'
    solucion_pasos:
      - '1. Coeficientes: $a = 1$, $b = -2$, $c = -8$.'
      - '2. $\Delta = (-2)^2 - 4(1)(-8) = 4 + 32 = 36$.'
      - '3. $x = \frac{-(-2) \pm \sqrt{36}}{2(1)} = \frac{2 \pm 6}{2}$.'
      - '4. $x_1 = \frac{8}{2} = 4$ y $x_2 = \frac{-4}{2} = -2$.'
  - titulo: 'Suma de ceros vía Vieta'
    enunciado: 'Dada la función $f(x) = 3x^2 - 12x + 5$, ¿la suma de sus ceros es $x_1 + x_2 = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la relación de Vieta $x_1 + x_2 = -\frac{b}{a} = -\frac{-12}{3} = 4$.'
  - titulo: 'Existencia de ceros por discriminante positivo'
    enunciado: 'Si el discriminante de la ecuación asociada a una función cuadrática es $\Delta = 16$, ¿la función posee dos ceros reales distintos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $\Delta > 0$, la raíz $\sqrt{16} = 4$ produce dos valores reales diferentes al sumar y restar en la fórmula.'
errores_frecuentes:
  - 'En la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$, la resta del término $-b$ solo afecta a la raíz y no se divide por $2a$.'
  - 'Si $b = -4$, el término $-b$ de la fórmula general es $-4$.'
  - 'Al resolver $x^2 = 9$ para hallar los ceros, la única solución real es $x = 3$.'
  - 'Los ceros de la función $f(x) = (x + 3)(x - 2)$ son $x_1 = 3$ y $x_2 = -2$.'
  - 'La fórmula general resolvente solo se puede aplicar si la ecuación cuadrática es incompleta.'
afirmaciones_verdaderas:
  - 'Los ceros de la función cuadrática $f(x) = ax^2 + bx + c$ se calculan resolviendo la ecuación cuadrática asociada $ax^2 + bx + c = 0$.'
  - 'La suma de las raíces de la ecuación asociada $ax^2 + bx + c = 0$ viene dada por la relación de Vieta $x_1 + x_2 = -\frac{b}{a}$.'
al_terminar_debes_poder: 'Calcular con precisión los ceros de cualquier función cuadrática resolviendo la ecuación asociada mediante fórmula general o métodos de factorización.'
