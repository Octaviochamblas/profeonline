semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CALCULO
resumen_inicial: La determinación de los ceros de una función cuadrática consiste en plantear y resolver la ecuación cuadrática asociada $ax^2 + bx + c = 0$ mediante factorización, completación de cuadrados o la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$.
explicacion_simple: "![La determinación de los ceros de una función cuadrática consiste en plantear y resolver la ecuación cuadrática asociada $ax^2 + bx + c = 0$ mediante factorización, completación de cuadrados o la fórmula general $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$](/static/img/nodos/determinacion-de-los-ceros-resolviendo-la-ecuacion-cuadratica-asociada-intro.svg)\n\n\nPara encontrar exactamente los números donde la parábola corta al eje $X$, sigue estos pasos:\n\n1. **Iguala la función a cero:** Reemplaza $f(x)$ por $0$:\n   $$ax^2 + bx + c = 0$$\n2. **Elige tu método favorito de resolución:**\n   - **Por Factorización (rápido):** Si es fácil descomponer en dos paréntesis $(x - p)(x - q) = 0$.\n   - **Por Fórmula General (infalible):**\n     $$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$\n3. **Obtienes las soluciones $x_1$ y $x_2$**, que son los ceros exactos de la parábola."
explicacion_formal: "Sea $f(x) = ax^2 + bx + c$ con $a \\in \\mathbb{R} \\setminus \\{0\\}$. El cálculo algebraico de los ceros $\\mathcal{Z}(f)$ consiste en resolver la ecuación polinómica homogénea de segundo grado:\n$$ax^2 + bx + c = 0$$\n\n**Procedimiento algebraico unificado**:\n1. **Cálculo del discriminante**: $\\Delta = b^2 - 4ac$.\n2. **Resolución analítica**:\n   $$x_{1,2} = \\frac{-b \\pm \\sqrt{\\Delta}}{2a}$$\n3. **Factorización canónica en el cuerpo de descomposición**:\n   - Si $\\Delta \\ge 0 \\implies f(x) = a(x - x_1)(x - x_2)$ con $x_1, x_2 \\in \\mathbb{R}$.\n   - Si $\\Delta < 0 \\implies$ no existen ceros en $\\mathbb{R}$ ($f(x)$ es irreducible sobre $\\mathbb{R}$)."
definiciones_clave: '- **Ecuación cuadrática asociada**: Ecuación $ax^2 + bx + c = 0$ que resulta de imponer la condición de corte $y = 0$.

  - **Fórmula resolvente cuadrática**: Algoritmo analítico para despejar las raíces en función de $a, b$ y $c$.'
propiedades_relaciones: '- **Conexión de Vieta**: La suma de los ceros es $x_1 + x_2 = -\frac{b}{a} = 2x_v$, y su producto es $x_1 x_2 = \frac{c}{a}$.

  - **Radicales irracionales conjugados**: Si $\Delta$ no es un cuadrado perfecto, los ceros aparecen como binomios conjugados $p \pm \sqrt{q}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación de los ceros de una función cuadrática consiste en plantear y resolver la ecuación cuadrática asociada $ax^2 + bx + c = 0$ mediante factorización, completación de cuadrados o la fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$](/static/img/nodos/determinacion-de-los-ceros-resolviendo-la-ecuacion-cuadratica-asociada-ejemplos.svg)



    Determina los ceros de la función cuadrática $f(x) = 2x^2 - 5x - 3$ aplicando la fórmula general.'
  pasos:
  - 'Paso 1: Plantear la ecuación asociada: $2x^2 - 5x - 3 = 0$.'
  - 'Paso 2: Identificar coeficientes: $a = 2, b = -5, c = -3$.'
  - 'Paso 3: Calcular el discriminante:

    $\Delta = (-5)^2 - 4(2)(-3) = 25 + 24 = 49 > 0$.'
  - 'Paso 4: Aplicar la fórmula resolvente:

    $x = \frac{-(-5) \pm \sqrt{49}}{2(2)} = \frac{5 \pm 7}{4}$.'
  - 'Paso 5: Separar las dos soluciones:

    - $x_1 = \frac{5 + 7}{4} = \frac{12}{4} = 3$.

    - $x_2 = \frac{5 - 7}{4} = \frac{-2}{4} = -\frac{1}{2}$.'
  - 'Paso 6: Conclusión: Los ceros son $x = 3$ y $x = -\frac{1}{2}$, cortando al eje $X$ en $(3, 0)$ y $(-\frac{1}{2}, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los ceros de la función $f(x) = x^2 - 9$?
  choices:
  - text: x = 3 y x = -3
    is_correct: true
  - text: Solo x = 3
    is_correct: false
  - text: x = 9 y x = -9
    is_correct: false
  - text: No tiene ceros reales
    is_correct: false
  explanation: La alternativa correcta es 'x = 3 y x = -3'. $x^2 - 9 = 0 \implies x^2 = 9 \implies x = \pm 3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $f(x) = 0$ para $f(x) = x^2 - 4x + 5$, se obtiene un discriminante Δ = -4. ¿Qué se concluye sobre los ceros?
  choices:
  - text: La función no tiene ceros reales (la parábola no corta al eje X).
    is_correct: true
  - text: Tiene ceros en x = 2 y x = -2.
    is_correct: false
  - text: Tiene un cero doble en x = 4.
    is_correct: false
  - text: La función no se puede graficar.
    is_correct: false
  explanation: La alternativa correcta es 'La función no tiene ceros reales (la parábola no corta al eje X).'. Como $\Delta < 0$, no hay intersecciones en el plano real.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $ax^2 + bx + c = 0$.'
- 'Paso 2: Calcular $\Delta = b^2 - 4ac$.'
- 'Paso 3: Si $\Delta \ge 0$, calcular las raíces mediante factorización o la fórmula cuadrática.'
- 'Paso 4: Simplificar las fracciones y radicales obtenidos.'
- 'Paso 5: Enunciar el conjunto solución $\mathcal{Z} = \{x_1, x_2\}$.'
errores_correccion: '- **Error común:** Olvidar que una ecuación con $\Delta > 0$ genera dos signos $\pm$, omitiendo una de las dos raíces.

  - **Cómo corregirlo:** La fórmula entrega **dos valores separados**: uno con $+ \sqrt{\Delta}$ y otro con $- \sqrt{\Delta}$.'
ejemplos:
- titulo: 'Ejemplo 1: Factorización de trinomio cuadrático'
  enunciado: ¿Cuáles son los ceros de $f(x) = x^2 - 7x + 10$?
  alternativas:
  - x = 2 y x = 5
  - x = -2 y x = -5
  - x = 10 y x = 1
  - x = 7 y x = -10
  respuesta: x = 2 y x = 5
  solucion_pasos:
  - 'Paso 1: $(x - 2)(x - 5) = 0 \implies x_1 = 2, x_2 = 5$.'
- titulo: 'Ejemplo 2: Factorización por factor común'
  enunciado: ¿Qué ceros tiene $g(x) = 3x^2 - 12x$?
  alternativas:
  - x = 0 y x = 4
  - Solo x = 4
  - x = 3 y x = -12
  - x = 0 y x = -4
  respuesta: x = 0 y x = 4
  solucion_pasos:
  - 'Paso 1: $3x(x - 4) = 0 \implies x = 0$ y $x = 4$.'
- titulo: 'Ejemplo 3: Ceros irracionales'
  enunciado: En $h(x) = x^2 - 2x - 1 = 0$, ¿cuáles son los ceros?
  alternativas:
  - 1 ± √2
  - 2 ± √2
  - 1 ± 2√2
  - ±√3
  respuesta: 1 ± √2
  solucion_pasos:
  - 'Paso 1: $x = \frac{2 \pm \sqrt{4 - 4(1)(-1)}}{2} = \frac{2 \pm \sqrt{8}}{2} = 1 \pm \sqrt{2}$.'
- titulo: 'Ejemplo 4: Cero doble en cuadrado de binomio'
  enunciado: ¿Qué cero tiene $f(x) = x^2 + 10x + 25$?
  alternativas:
  - x = -5 (raíz doble)
  - x = 5 (raíz doble)
  - x = 5 y x = -5
  - x = 25
  respuesta: x = -5 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $(x + 5)^2 = 0 \implies x = -5$.'
errores_frecuentes:
- Olvidar el denominador 2a en la fórmula cuadrática.
- Cometer errores de signos en -(-b).
- Intentar calcular raíces cuadradas reales de números negativos cuando Δ < 0.
afirmaciones_verdaderas:
- Los ceros de una función cuadrática se obtienen resolviendo la ecuación de segundo grado f(x) = 0.
- Si la función se factoriza como a(x - p)(x - q), los ceros son inmediatamente p y q.
al_terminar_debes_poder: '**QUÉ:** Determinar analíticamente los ceros de una función cuadrática resolviendo la ecuación asociada.


  **CÓMO:** Aplicando técnicas de factorización o la fórmula cuadrática general x = (-b ± √Δ)/(2a).


