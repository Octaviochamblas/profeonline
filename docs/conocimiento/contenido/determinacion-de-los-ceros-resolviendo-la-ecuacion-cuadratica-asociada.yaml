semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CALCULO
resumen_inicial: 'Determinación de los ceros resolviendo la ecuación cuadrática asociada:
  parábola, vértice, concavidad y formas de Análisis gráfico: parábola, concavidad
  e intersecciones.'
explicacion_simple: Para encontrar exactamente dónde una parábola cruza el eje $x$,
  se recurre a las mismas herramientas usadas para resolver ecuaciones de segundo
  grado.
explicacion_formal: '### Definición formal


  Calcular los ceros de $f(x)=ax^2+bx+c$ equivale a resolver la ecuación $ax^2+bx+c=0$.
  Cualquier método válido para resolver ecuaciones cuadráticas (fórmula general, factorización,
  completar el cuadrado) sirve para este propósito.


  ### Desarrollo didáctico


  La elección del método depende de la estructura de la función: si es fácilmente
  factorizable, conviene factorizar; si no, la fórmula general siempre funciona.


  Para $f(x)=x^2-x-6$, se resuelve $x^2-x-6=0$; factorizando, $(x-3)(x+2)=0$, dando
  los ceros $x=3$ y $x=-2$.'
definiciones_clave: '- **Determinación de los ceros resolviendo la ecuación cuadrática
  asociada**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  determinación de los ceros resolviendo la ecuación cuadrática asociada.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando determinación
    de los ceros resolviendo la ecuación cuadrática asociada.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a determinación
    de los ceros resolviendo la ecuación cuadrática asociada.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
