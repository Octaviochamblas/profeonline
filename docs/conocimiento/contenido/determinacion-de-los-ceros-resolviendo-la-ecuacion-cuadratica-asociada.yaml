semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CALCULO
resumen_inicial: La determinación de los ceros calcula numéricamente los valores $x_1, x_2$ resolviendo la ecuación cuadrática asociada $ax^2 + bx + c = 0$.
explicacion_simple: |
  Para calcular numéricamente dónde la función $f(x) = ax^2 + bx + c$ corta al eje X:

  1. **Igualas la fórmula a cero**:
     $$ax^2 + bx + c = 0$$
  2. **Resuelves la ecuación resultante** mediante factorización o aplicando la **fórmula general**:
     $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$
  3. **Ejemplo**: Si $f(x) = x^2 - 5x + 6$:
     $$x^2 - 5x + 6 = 0 \implies (x - 2)(x - 3) = 0 \implies x_1 = 2 \quad \text{y} \quad x_2 = 3$$
  4. Los ceros son $x = 2$ y $x = 3$, y la parábola corta al eje X en **$(2, 0)$ y $(3, 0)$**.
explicacion_formal: |
  Dada la regla de correspondencia $f(x) = ax^2 + bx + c$, el cálculo formal del conjunto de ceros $Z(f)$ se reduce a encontrar el conjunto solución de la **ecuación cuadrática polinómica asociada**:

  $$ax^2 + bx + c = 0 \quad \text{con } a \neq 0$$

  **Algoritmo algebraico de determinación:**
  1. Si la función se encuentra factorizada $f(x) = a(x - x_1)(x - x_2)$, los ceros se leen directamente por el teorema del producto nulo.
  2. Si la función está en forma general, se aplica la fórmula cuadrática:
     $$x_1, x_2 = \frac{-b \pm \sqrt{\Delta}}{2a} \quad \text{donde } \Delta = b^2 - 4ac$$
definiciones_clave: |
  - **Ecuación cuadrática asociada**: Igualdad matemática $ax^2 + bx + c = 0$ formulada al igualar la función cuadrática a cero para hallar sus ceros.
propiedades_relaciones: |
  - **Sumatoria y producto de ceros (Vieta)**: Los ceros calculados satisfacen $x_1 + x_2 = -\frac{b}{a}$ y $x_1 \cdot x_2 = \frac{c}{a}$.
ejemplo_guiado:
  enunciado: 'Calcula los ceros de la función cuadrática $f(x) = 2x^2 - 8x + 6$.'
  pasos:
    - 'Paso 1: Plantear la ecuación asociada igualando a cero: $2x^2 - 8x + 6 = 0$.'
    - 'Paso 2: Simplificar la ecuación dividiendo por 2: $x^2 - 4x + 3 = 0$.'
    - 'Paso 3: Factorizar la expresión cuadrática: $(x - 3)(x - 1) = 0$.'
    - 'Paso 4: Despejar los valores: $x_1 = 3$ y $x_2 = 1$. Los ceros son $x = 1$ y $x = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son los ceros de la función cuadrática $f(x) = x^2 - 9$?'
    choices:
      - {text: '$x_1 = 3$ y $x_2 = -3$', is_correct: true}
      - {text: 'Únicamente $x = 9$.', is_correct: false}
      - {text: '$x_1 = 0$ y $x_2 = 9$.', is_correct: false}
      - {text: 'No tiene ceros reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 3$ y $x_2 = -3$''. Resolviendo $x^2 - 9 = 0 \implies x^2 = 9 \implies x = \pm 3$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación asociada a una función se obtiene una solución doble $x = 5$. ¿Qué ceros posee la función?'
    choices:
      - {text: 'Posee un único cero real doble en $x = 5$', is_correct: true}
      - {text: 'Posee dos ceros distintos en $x = 5$ y $x = -5$.', is_correct: false}
      - {text: 'No posee ceros en los reales.', is_correct: false}
      - {text: 'Dos ceros reales imaginarios.', is_correct: false}
    explanation: 'La alternativa correcta es ''Posee un único cero real doble en $x = 5$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la expresión funcional e igualar a cero: $f(x) = 0$.'
  - 'Paso 2: Identificar los coeficientes $a, b, c$ o buscar una factorización directa.'
  - 'Paso 3: Resolver la ecuación por fórmula general o factorización.'
  - 'Paso 4: Comprobar las soluciones obtenidas sustituyendo en la función original.'
errores_correccion: |
  - **Error común:** Olvidar la doble raíz de signo positivo y negativo al despejar $x^2 = k$ (ej. decir solo $x = 3$ de $x^2 = 9$).
  - **Cómo corregirlo:** La raíz cuadrada de una constante positiva entrega **DOS SOLUCIONES: $+\sqrt{k}$ Y $-\sqrt{k}$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Ceros por factorización.
    alternativas:
      - '$x_1 = 2$ y $x_2 = 4$'
      - '$x_1 = -2$ y $x_2 = -4$'
      - '$x = 8$'
    respuesta: '$x_1 = 2$ y $x_2 = 4$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Ceros por fórmula general.
    alternativas:
      - '$x_1 = 1$ y $x_2 = -5$'
      - '$x_1 = 5$ y $x_2 = -1$'
      - '$x_1 = 2$ y $x_2 = -3$'
    respuesta: '$x_1 = 1$ y $x_2 = -5$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La supresión de la solución negativa al resolver ecuaciones incompletas puras del tipo $x^2 = k$.'
  - 'Cometer errores de signo en el cálculo de $-b$ dentro de la fórmula general cuando $b$ es negativo.'
  - 'La falta de igualación de la función a cero antes de comenzar el procedimiento algebraico de resolución.'
  - 'Dividir por $x$ en expresiones del tipo $ax^2 + bx = 0$ perdiendo la solución $x = 0$.'
  - 'La equivalencia errónea entre las raíces de la ecuación cuadrática y la coordenada del vértice de la parábola.'
afirmaciones_verdaderas:
  - 'Los ceros de una función cuadrática se determinan algebraicamente resolviendo su ecuación cuadrática asociada $ax^2 + bx + c = 0$.'
  - 'Si la ecuación cuadrática asociada se factoriza como $a(x - x_1)(x - x_2) = 0$, los ceros son $x = x_1$ y $x = x_2$.'
al_terminar_debes_poder: |
  QUÉ: Calcular numéricamente los ceros de una función cuadrática resolviendo su ecuación asociada.
  CÓMO: Plantear $ax^2 + bx + c = 0$, aplicar factorización o fórmula general, obtener $x_1, x_2$ y verificar.
