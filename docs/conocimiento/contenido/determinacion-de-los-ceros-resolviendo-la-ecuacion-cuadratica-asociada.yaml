procedimiento:
- 'Paso 1: Plantea la ecuación $ax^2+bx+c=0$ a partir de la función.'
- 'Paso 2: Elige un método de resolución (fórmula general, factorización, completar
  el cuadrado).'
- 'Paso 3: Resuelve la ecuación para obtener los ceros de la función.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en determinación de los ceros resolviendo la ecuación
  cuadrática asociada.
ejemplos:
- titulo: Cálculo de ceros por factorización
  enunciado: Determina los ceros de $f(x)=x^2+2x-8$.
  solucion_pasos:
  - Se resuelve $x^2+2x-8=0$; factorizando, $(x+4)(x-2)=0$.
  - Los ceros son $x=-4$ y $x=2$.
- titulo: Cálculo de ceros con fórmula general
  enunciado: Determina los ceros de $f(x)=2x^2-3x-2$.
  solucion_pasos:
  - $\Delta=9+16=25$.
  - $x=\dfrac{3\pm5}{4}$, dando $x=2$ y $x=-1/2$.
- titulo: ¿Es obligatorio usar la fórmula general para calcular los ceros de una función
    cuadrática?
  enunciado: ¿Es obligatorio usar la fórmula general para calcular los ceros de una
    función cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - La factorización o completar el cuadrado son igualmente válidos cuando resultan
    más directos.
- titulo: ¿Puede una función cuadrática no tener ceros reales?
  enunciado: ¿Puede una función cuadrática no tener ceros reales?
  respuesta: Sí
  solucion_pasos:
  - Si el discriminante de la ecuación asociada es negativo, la función no tiene ceros
    reales.
errores_frecuentes:
- Declarar el proceso de calcular ceros con el de encontrar el vértice.
- Omitir considerar ambas soluciones al resolver la ecuación cuadrática asociada.
- Elegir un método de resolución poco eficiente cuando la función admite una factorización
