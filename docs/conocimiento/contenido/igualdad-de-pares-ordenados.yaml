semantic_id: MAT.FUND.PRODUCTO_CARTESIANO.IGUALDAD_PARES_ORDENADOS
resumen_inicial: 'Criterio fundamental de igualdad de pares ordenados, formulación lógica de bicondicional y resolución de sistemas de ecuaciones para hallar incógnitas.'
explicacion_simple: |
  Dos pares ordenados son **iguales si y solo si sus componentes coinciden una a una en la misma posición**:
  $$(a, b) = (c, d) \iff (a = c \text{ y } b = d)$$
  Esto significa que la **primera componente del primer par debe ser exactamente igual a la primera componente del segundo par**, y la **segunda componente del primer par debe ser igual a la segunda del segundo**. Gracias a esta regla, si tenemos una igualdad con variables como $(2x, y + 1) = (6, 5)$, podemos separar el problema en dos ecuaciones simples: $2x = 6$ ($x = 3$) e $y + 1 = 5$ ($y = 4$).
explicacion_formal: |
  ### Definición formal
  El **Teorema de Igualdad de Pares Ordenados** establece que en cualquier teoría de conjuntos que satisfaga el axioma de extensionalidad:
  $$\forall a, b, c, d, \quad (a, b) = (c, d) \iff (a = c \land b = d)$$
  Demostración formal usando la construcción de Kuratowski:
  Si $\{\{a\}, \{a, b\}\} = \{\{c\}, \{c, d\}\}$:
  1. La intersección de los elementos de cada conjunto da: $\bigcap \{\{a\}, \{a, b\}\} = \{a\}$ y $\bigcap \{\{c\}, \{c, d\}\} = \{c\}$, por lo que $\{a\} = \{c\} \implies a = c$.
  2. La unión de los elementos da: $\bigcup \{\{a\}, \{a, b\}\} = \{a, b\}$ y $\bigcup \{\{c\}, \{c, d\}\} = \{c, d\}$, por lo que $\{a, b\} = \{c, d\}$. Como ya sabemos que $a = c$, si $a \neq b$, necesariamente $b = d$. Si $a = b$, entonces $\{\{a\}\} = \{\{c\}, \{c, d\}\} \implies c = d$, con lo cual $b = a = c = d$.
  En todos los casos se deduce $a = c$ y $b = d$.

  ### Desglose simbólico
  - Doble condición simultánea: No basta con que los números sean los mismos en desorden; deben coincidir posicionalmente.
  - Generador de sistemas algebraicos: $(f(x), g(y)) = (k_1, k_2) \implies \begin{cases} f(x) = k_1 \\ g(y) = k_2 \end{cases}$.

  ### Síntesis didáctica
  La igualdad de pares ordenados convierte una ecuación vectorial en un sistema de ecuaciones escalares independientes desacopladas.
definiciones_clave: |
  - **Igualdad de pares ordenados**: Equivalencia lógica $(a, b) = (c, d) \iff a = c \land b = d$.
  - **Desacoplamiento posicional**: Separación de una igualdad de pares en ecuaciones independientes para cada coordenada.
  - **Extensionalidad de Kuratowski**: Fundamento axiomático de la unicidad posicional.
propiedades_relaciones: |
  - **Relación de equivalencia**: La igualdad de pares es reflexiva, simétrica y transitiva.
  - **Igualdad de $n$-tuplas**: $(a_1, \dots, a_n) = (b_1, \dots, b_n) \iff a_i = b_i, \forall i \in \{1, \dots, n\}$.
ejemplo_guiado:
  enunciado: 'Encuentra los valores reales de $x$ e $y$ que satisfacen la igualdad de pares ordenados: $(3x - 5, 2y + 4) = (7, 10)$.'
  pasos:
    - 'Paso 1: Aplicar el criterio de igualdad de pares ordenados $(a, b) = (c, d) \iff a = c \land b = d$.'
    - 'Paso 2: Igualar las primeras componentes entre sí:
      - $3x - 5 = 7$.'
    - 'Paso 3: Resolver la primera ecuación lineal para $x$:
      - $3x = 7 + 5 \implies 3x = 12 \implies x = \frac{12}{3} = 4$.'
    - 'Paso 4: Igualar las segundas componentes entre sí:
      - $2y + 4 = 10$.'
    - 'Paso 5: Resolver la segunda ecuación lineal para $y$:
      - $2y = 10 - 4 \implies 2y = 6 \implies y = \frac{6}{2} = 3$.'
    - 'Paso 6: Concluir que la solución única es $x = 4$ e $y = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición matemática es indispensable para que se cumpla la igualdad $(x, y) = (a, b)$?'
    choices:
      - {text: '$x = a$ y al mismo tiempo $y = b$', is_correct: true}
      - {text: '$x + y = a + b$', is_correct: false}
      - {text: '$x = b$ e $y = a$', is_correct: false}
      - {text: '$x \cdot y = a \cdot b$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = a$ y al mismo tiempo $y = b$''. La igualdad requiere coincidencia exacta en ambas posiciones.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $(x + 2, 8) = (5, 2y)$, ¿cuáles son los valores de $x$ e $y$?'
    choices:
      - {text: '$x = 3$ e $y = 4$', is_correct: true}
      - {text: '$x = 5$ e $y = 8$', is_correct: false}
      - {text: '$x = 7$ e $y = 16$', is_correct: false}
      - {text: '$x = 2$ e $y = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 3$ e $y = 4$''. Se plantea $x + 2 = 5 \implies x = 3$ y $2y = 8 \implies y = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Establecer la ecuación de pares ordenados $(A_1, A_2) = (B_1, B_2)$.'
  - 'Paso 2: Escribir la primera ecuación igualando las primeras componentes: $A_1 = B_1$.'
  - 'Paso 3: Escribir la segunda ecuación igualando las segundas componentes: $A_2 = B_2$.'
  - 'Paso 4: Resolver el sistema de ecuaciones algebraicas resultante.'
  - 'Paso 5: Sustituir los valores hallados en los pares iniciales para comprobar la igualdad.'
errores_correccion: |
  - **Error 1:** Igualar la primera componente del primer par con la segunda componente del segundo par. **Cómo corregirlo:** La comparación debe ser estrictamente coordenada a coordenada (primera con primera, segunda con segunda).
  - **Error 2:** Sumar las componentes para formar una sola ecuación (ej. $x + y = a + b$). **Cómo corregirlo:** Una igualdad de pares genera un sistema de DOS ecuaciones independientes, no una sola suma escalar.
ejemplos:
  - titulo: 'Igualdad simple'
    enunciado: 'Si $(x, 9) = (-3, y)$, ¿cuánto valen $x$ e $y$?'
    alternativas:
      - '$x = -3, y = 9$'
      - '$x = 9, y = -3$'
      - '$x = 3, y = -9$'
    respuesta: '$x = -3, y = 9$'
    solucion_pasos:
      - '1. Primera con primera: $x = -3$.'
      - '2. Segunda con segunda: $y = 9$.'
  - titulo: 'Sistema con potencias'
    enunciado: 'Si $(x^2, 3) = (16, 3)$ con $x > 0$, ¿cuál es $x$?'
    respuesta: '$4$'
    solucion_pasos:
      - '$x^2 = 16 \implies x = 4$ (dado que $x > 0$).'
  - titulo: 'Par invertido no igual'
    enunciado: '¿Es verdad que $(2, 5) = (5, 2)$?'
    respuesta: 'No, es falso'
    solucion_pasos:
      - 'Como $2 \neq 5$, los pares son distintos.'
  - titulo: 'Sistema 2x2 acoplado'
    enunciado: 'Si $(x+y, x-y) = (8, 2)$, ¿cuánto valen $x$ e $y$?'
    respuesta: '$x = 5, y = 3$'
    solucion_pasos:
      - 'Sumando las ecuaciones: $2x = 10 \implies x = 5$, luego $y = 3$.'
errores_frecuentes:
  - 'La afirmación de que dos pares ordenados son iguales si contienen los mismos números en orden invertido.'
  - 'La afirmación de que la igualdad de pares ordenados puede resolverse sumando las dos componentes en una sola ecuación.'
  - 'La afirmación de que la igualdad $(a, b) = (c, d)$ solo requiere que una de las dos componentes coincida.'
  - 'La afirmación de que $(x, y) = (y, x)$ se cumple para todo par de números reales.'
  - 'La afirmación de que la igualdad de pares no genera un sistema formal de ecuaciones algebraicas.'
afirmaciones_verdaderas:
  - 'Dos pares ordenados son iguales si y solo si sus primeras componentes coinciden entre sí y sus segundas componentes coinciden entre sí ($(a, b) = (c, d) \iff a = c \land b = d$).'
  - 'Una igualdad de pares ordenados con expresiones algebraicas genera un sistema desacoplado o acoplado de dos ecuaciones independientes.'
al_terminar_debes_poder: |
  QUÉ: Enunciar y aplicar el criterio de igualdad de pares ordenados ($(a, b) = (c, d) \iff a = c \land b = d$).
  CÓMO: Plantear y resolver sistemas de ecuaciones algebraicas igualando componente a componente.
