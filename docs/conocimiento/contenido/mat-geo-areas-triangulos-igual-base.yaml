semantic_id: MAT.GEO.AREAS_TRIANGULOS.TRIANGULOS_IGUAL_BASE
resumen_inicial: 'Igualdad de áreas de triángulos con igual base entre paralelas:
  conceptos, teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Puedes "deslizar" la punta superior de un triángulo a lo largo
  de una línea paralela a su base sin que cambie el área del triángulo, siempre que
  la base se mantenga igual.
explicacion_formal: '![Triángulos con igual base entre paralelas](/static/img/geometria/areas-pitagoras/areas-triangulos-igual-base.svg)


  ### Definición formal


  Si dos triángulos comparten la misma base $b$ y sus vértices opuestos se ubican
  sobre una misma recta

  paralela a esa base, ambos triángulos tienen la misma altura y, por lo tanto, la
  misma área.


  ### Desarrollo didáctico


  Esto ocurre porque la distancia entre dos rectas paralelas es constante en todos
  sus puntos: sin importar

  dónde se ubique el vértice sobre la recta paralela, la altura respecto de la base
  no cambia.'
