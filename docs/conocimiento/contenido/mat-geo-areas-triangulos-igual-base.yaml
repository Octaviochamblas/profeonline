procedimiento:
- 'Paso 1: Verifica que ambos triángulos compartan exactamente la misma base.'
- 'Paso 2: Verifica que los vértices opuestos estén sobre una misma recta paralela
  a esa base.'
- 'Paso 3: Concluye que ambos triángulos tienen la misma altura y, por lo tanto, la
  misma área.'
