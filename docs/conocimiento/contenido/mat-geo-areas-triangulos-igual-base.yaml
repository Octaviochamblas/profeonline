- titulo: ¿Se cumple siempre la propiedad principal de igualdad de áreas de triángulos
    con igual base entre paralelas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede igualdad de áreas de triángulos con igual base entre paralelas asumir
