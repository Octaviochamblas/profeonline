afirmaciones_verdaderas:
- El logaritmo $\log_b(a) = c$ se define formalmente mediante la ecuación exponencial
  $b^c = a$ para $b > 0, b \neq 1, a > 0$.
- El logaritmo de 1 en cualquier base válida es 0 y el logaritmo de la base es 1.
