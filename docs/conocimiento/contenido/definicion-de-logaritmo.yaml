semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.DEFINICION
resumen_inicial: 'Un logaritmo $\log_b(a) = c$ representa el exponente $c$ al que se debe elevar la base $b$ ($b > 0, b \neq 1$) para obtener el argumento $a$ ($a > 0$).'
explicacion_simple: |
  Un logaritmo es una pregunta sobre exponentes. Cuando ves $\log_2(8)$, la pregunta matemática que te están haciendo es: *"¿A qué exponente debo elevar la base 2 para que el resultado sea 8?"*. Como $2^3 = 8$, el resultado del logaritmo es 3. El logaritmo desarmó la potencia y aisló el exponente.
explicacion_formal: |
  ### Definición formal
  El **logaritmo en base $b$ de un número real $a$** se define analíticamente mediante la equivalencia lógica fundamental:
  $$\log_b(a) = c \iff b^c = a$$
  sujeto a las restricciones del conjunto de los números reales:
  1. **Base positiva diferente de uno**: $b \in \mathbb{R}^+, \; b \neq 1$.
  2. **Argumento estrictamente positivo**: $a \in \mathbb{R}^+ \; (a > 0)$.
  3. **Valor del logaritmo**: $c \in \mathbb{R}$.

  ### Simbología y Elementos
  - **Base $b$**: Subíndice del logaritmo. Indica la base de la potencia equivalente.
  - **Argumento $a$**: Valor interior del logaritmo. Representa la potencia o resultado numérico $b^c$.
  - **Logaritmo $c$**: Resultado de la operación. Representa el exponente de la potencia.

  ### Síntesis didáctica
  La operación de logaritmación es la **inversa de la exponenciación** respecto a la búsqueda del exponente.
definiciones_clave: |
  - **Logaritmo $\log_b(a)$**: Exponente al que debe elevarse la base $b$ para obtener el argumento $a$.
  - **Base del logaritmo $b$**: Número real positivo distinto de 1 sobre el cual se aplica el exponente.
  - **Argumento del logaritmo $a$**: Número real estrictamente positivo que se obtiene al elevar la base a la potencia $c$.
propiedades_relaciones: |
  - **Equivalencia exponencial**: $\log_b(a) = c \iff b^c = a$. Toda igualdad logarítmica es una igualdad de potencias reordenada.
  - **Existencia en $\mathbb{R}$**: El argumento $a$ debe ser positivo porque cualquier base positiva $b > 0$ elevada a cualquier exponente real $c$ genera siempre un resultado positivo $b^c > 0$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto del logaritmo $L = \log_3(81)$ aplicando su definición fundamental.'
  pasos:
    - 'Paso 1: Planteamos la equivalencia del logaritmo introduciendo una variable exponente $c$: $\log_3(81) = c \iff 3^c = 81$.'
    - 'Paso 2: Expresamos el argumento $81$ como una potencia de base $3$: $81 = 3^4$.'
    - 'Paso 3: Igualamos las potencias de misma base: $3^c = 3^4 \implies c = 4$.'
    - 'Paso 4: Conclusión: $\log_3(81) = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la equivalencia lógica exponencial de la definición del logaritmo $\log_b(a) = c$?'
    choices:
      - {text: '$b^c = a$, donde la base $b$ elevada al resultado $c$ entrega el argumento $a$', is_correct: true}
      - {text: '$a^c = b$, elevando el argumento al exponente', is_correct: false}
      - {text: '$c^b = a$, elevando el resultado a la base', is_correct: false}
      - {text: '$b \cdot c = a$, multiplicando la base por el exponente', is_correct: false}
    explanation: 'La alternativa correcta es ''$b^c = a$, donde la base $b$ elevada al resultado $c$ entrega el argumento $a$''. La definición de logaritmo establece $\log_b(a) = c \iff b^c = a$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor numérico del logaritmo $\log_5(125)$?'
    choices:
      - {text: '$3$, pues $5^3 = 125$', is_correct: true}
      - {text: '$25$, dividiendo $125 / 5$', is_correct: false}
      - {text: '$5$, pues $5 \cdot 5 = 25$', is_correct: false}
      - {text: '$15$, multiplicando $5 \cdot 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3$, pues $5^3 = 125$''. Buscamos la potencia $5^c = 125 \implies c = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la base $b$ y el argumento $a$ en la expresión $\log_b(a)$.'
  - 'Paso 2: Plantear la ecuación exponencial equivalente $b^c = a$.'
  - 'Paso 3: Expresar el argumento $a$ como una potencia de la base $b$.'
  - 'Paso 4: Igualar los exponentes para hallar el valor final del logaritmo $c$.'
errores_correccion: |
  - **Error 1:** Multiplicar la base por el argumento en lugar de buscar el exponente (ej: calcular $\log_2(8) = 2 \cdot 8 = 16$). **Cómo corregirlo:** El logaritmo busca el **exponente** $c$ tal que $2^c = 8 \implies c = 3$.
  - **Error 2:** Dividir el argumento entre la base (ej: $\log_3(9) = 9 / 3 = 3$). **Cómo corregirlo:** El logaritmo no es una división; es la búsqueda del exponente: $3^c = 9 \implies c = 2$.
ejemplos:
  - titulo: 'Cálculo de logaritmo base 2'
    enunciado: '¿El valor de $\log_2(16)$ es igual a $4$?'
    alternativas:
      - 'Sí, pues $2^4 = 16$'
      - 'No, es 8'
      - 'No, es 32'
    respuesta: 'Sí, pues $2^4 = 16$'
    solucion_pasos:
      - '1. Planteamos $2^c = 16$.'
      - '2. Como $16 = 2^4$, se concluye $c = 4$.'
  - titulo: 'Cálculo de logaritmo fraccionario'
    enunciado: '¿El valor de $\log_2(1/2)$ es igual a $-1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2^{-1} = 1/2 \implies \log_2(1/2) = -1$.'
  - titulo: 'Logaritmo con argumento potencia de 10'
    enunciado: '¿El valor de $\log_{10}(1000)$ resulta en $3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10^3 = 1000 \implies \log_{10}(1000) = 3$.'
  - titulo: 'Equivalencia de la definición'
    enunciado: '¿La ecuación $\log_b(a) = c$ es equivalente a la ecuación de potencias $b^c = a$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la definición lógica del logaritmo.'
errores_frecuentes:
  - 'El valor de $\log_b(a)$ es el resultado de dividir el argumento $a$ por la base $b$.'
  - 'Se pueden calcular logaritmos con argumentos negativos en el conjunto de los números reales.'
  - 'El logaritmo $\log_2(8)$ es igual a 16 multiplicando la base por el argumento.'
  - 'La base de un logaritmo puede ser igual al número 1.'
  - 'La relación entre logaritmo y potencia establece que $\log_b(a) = a^b$.'
afirmaciones_verdaderas:
  - 'Un logaritmo $\log_b(a) = c$ representa el exponente $c$ al que se debe elevar la base $b$ para obtener el argumento $a$.'
  - 'La equivalencia lógica entre logaritmo y potencia establece que $\log_b(a) = c \iff b^c = a$, con $b > 0, b \neq 1$ y $a > 0$.'
al_terminar_debes_poder: 'Calcular el valor de un logaritmo aplicando la equivalencia lógica $b^c = a$ para despejar el exponente.'
