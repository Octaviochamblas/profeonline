resumen_inicial: 'El logaritmo en base $b$ de un número $a$ es el exponente $c$ al
  que se debe elevar la base $b$ ($b > 0, b \neq 1$) para obtener dicho argumento
  $a > 0$: $\log_b(a) = c \iff b^c = a$.'
explicacion_simple: Un logaritmo es simplemente una pregunta sobre exponentes. Nos
  dice a qué exponente tenemos que elevar la base para llegar al número del argumento.
  Por ejemplo, el logaritmo en base 2 de 8 es 3, porque 2 elevado a 3 da 8.
explicacion_formal: 'Para todo $a > 0$, $b > 0$ ($b \neq 1$), el **Logaritmo $\log_b(a)$**
  se define mediante la equivalencia de potencia exponencial:


  $$\log_b(a) = c \iff b^c = a$$


  **Desglose de términos:**

  - $b$: Base del logaritmo ($b \in \mathbb{R}^+ \setminus \{1\}$).

  - $a$: Argumento o número real evaluado ($a \in \mathbb{R}^+$).

  - $c$: Exponente o valor real del logaritmo ($c \in \mathbb{R}$).


  > **Complemento didáctico:** El concepto fue propuesto por John Napier en el siglo
  XVII para convertir complicadas multiplicaciones en simples sumas.'
definiciones_clave: '- **Logaritmo**: Exponente $c$ que satisface la ecuación $b^c
  = a$ para $b > 0, b \neq 1, a > 0$.'
propiedades_relaciones: '- **Equivalencia exponencial**: $\log_b(a) = c \iff b^c =
  a$.'
ejemplo_guiado:
  enunciado: Calcule los logaritmos $\log_3(81)$ y $\log_5(125)$.
  pasos:
  - 'Paso 1: Para $\log_3(81)$, buscar $c$ tal que $3^c = 81$. Como $3^4 = 81 \implies
    c = 4$.'
  - 'Paso 2: Para $\log_5(125)$, buscar $c$ tal que $5^c = 125$. Como $5^3 = 125 \implies
    c = 3$.'
  - 'Conclusión: $\log_3(81) = 4$ y $\log_5(125) = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la equivalencia fundamental que define al logaritmo log_b(a)
    = c?
  choices:
  - text: b^c = a (la base b elevada al resultado c reproduce el argumento a)
    is_correct: true
  - text: b · c = a
    is_correct: false
  - text: a^b = c
    is_correct: false
  - text: b + c = a
    is_correct: false
  explanation: La alternativa correcta es 'b^c = a (la base b elevada al resultado
    c reproduce el argumento a)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para log_3(81), ¿cuál fue el valor obtenido?
  choices:
  - text: 4 (porque 3^4 = 81)
    is_correct: true
  - text: '27'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '81'
    is_correct: false
  explanation: La alternativa correcta es '4 (porque 3^4 = 81)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de evaluar y definir logaritmos $\log_b(a)
  = c$, comprobando la equivalencia de potencia $b^c = a$ y sus condiciones de existencia.
semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.DEFINICION
procedimiento:
- 'Paso 1: Verificar que el argumento $a > 0$ y la base $b > 0, b \neq 1$ cumplan
  las restricciones.'
- 'Paso 2: Formular la equivalencia de potencia $b^c = a$.'
- 'Paso 3: Calcular el valor del exponente $c$ o simplificar la expresión logarítmica.'
errores_correccion: '- **Error 1: Intentar calcular logaritmos de números negativos
  o cero ($\log_2(-4)$ o $\log_2(0)$).** **Cómo corregirlo:** El argumento debe ser
  estrictamente positivo ($a > 0$); en $\mathbb{R}$ no existen.


  - **Error 2: Confundir la base con el argumento (escribir $\log_2(8) = 8^2 = 64$).**
  **Cómo corregirlo:** La base $2$ se eleva al RESULTADO para dar el argumento ($2^3
  = 8 \implies \log_2(8) = 3$).'
