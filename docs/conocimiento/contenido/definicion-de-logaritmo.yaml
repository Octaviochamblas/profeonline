semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.DEFINICION
resumen_inicial: Un logaritmo $\log_b(a) = c$ representa el exponente $c$ al que se debe elevar la base $b$ ($b > 0, b \neq 1$) para obtener el argumento $a$ ($a > 0$).
explicacion_simple: '![Definición de logaritmo](/static/img/nodos/definicion-de-logaritmo-intro.svg)


  Un logaritmo es simplemente una pregunta sobre exponentes.

  - Cuando ves $\log_2(8)$, te estás preguntando: *¿A qué número debo elevar el $2$ para que el resultado sea $8$?*

  - Como $2^3 = 8$, el resultado del logaritmo es $3$: $\log_2(8) = 3$.

  - Los tres componentes son: la **base** (el número pequeño abajo, $2$), el **argumento** (el número adentro, $8$) y el **logaritmo** (el exponente resultante, $3$).'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ tales que $b > 0$, $b \neq 1$ y $a > 0$. Se define el **logaritmo de $a$ en base $b$**, denotado por $\log_b(a)$, como el único número real $c$ que satisface la ecuación exponencial:


  $$\log_b(a) = c \iff b^c = a$$


  **Condiciones de Existencia en $\mathbb{R}$:**

  1. **Base positiva y distinta de uno:** $b \in \mathbb{R}^+ \setminus \{1\}$.

  2. **Argumento estrictamente positivo:** $a \in \mathbb{R}^+ = ]0, +\infty[$.

  3. **Logaritmo real:** $c \in \mathbb{R}$ (puede ser positivo, cero o negativo).'
definiciones_clave: '- **Logaritmo ($\log_b(a)$)**: Exponente al que se eleva la base $b$ para obtener el argumento $a$.

  - **Base ($b$)**: Número positivo distinto de 1 que sirve como factor de crecimiento.

  - **Argumento ($a$)**: Valor positivo resultante de la potencia.'
propiedades_relaciones: '- **Equivalencia exponencial**: $\log_b(a) = c \iff b^c = a$.

  - **Logaritmo de 1**: $\log_b(1) = 0$ porque $b^0 = 1$.

  - **Logaritmo de la base**: $\log_b(b) = 1$ porque $b^1 = b$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmos](/static/img/nodos/definicion-de-logaritmo-ejemplos.svg)


    Calcule el valor de los logaritmos $\log_2(8)$, $\log_3(81)$ y $\log_5\left(\frac{1}{25}\right)$.'
  pasos:
  - 'Paso 1: Para $\log_2(8)$: Plantear $2^c = 8$. Como $8 = 2^3$, se obtiene $c = 3$.'
  - 'Paso 2: Para $\log_3(81)$: Plantear $3^c = 81$. Como $81 = 3^4$, se obtiene $c = 4$.'
  - 'Paso 3: Para $\log_5\left(\frac{1}{25}\right)$: Plantear $5^c = \frac{1}{25} = 5^{-2}$, dando $c = -2$.'
  - 'Conclusión: Los valores son $3$, $4$ y $-2$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_4(64)$?
  choices:
  - text: $3$ (porque $4^3 = 64$)
    is_correct: true
  - text: $16$
    is_correct: false
  - text: $4$
    is_correct: false
  - text: $2$
    is_correct: false
  explanation: La alternativa correcta es '$3$ (porque $4^3 = 64$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\log_5\left(\frac{1}{25}\right) = -2$?
  choices:
  - text: Porque $5^{-2} = \frac{1}{5^2} = \frac{1}{25}$
    is_correct: true
  - text: Porque se divide $5$ por $25$
    is_correct: false
  - text: Porque el logaritmo de una fracción es siempre positivo
    is_correct: false
  - text: Porque $5 \times (-2) = -10$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $5^{-2} = \frac{1}{5^2} = \frac{1}{25}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ y el argumento $a$.'
- 'Paso 2: Escribir la ecuación exponencial equivalente $b^c = a$.'
- 'Paso 3: Expresar el argumento $a$ como potencia de base $b$ e igualar los exponentes para hallar $c$.'
errores_correccion: "- **Error 1: Multiplicar la base por el argumento ($\\log_2(8) = 2 \times 8 = 16$).** **Cómo corregirlo:** El logaritmo busca el exponente, no el producto: $2^3 = 8 \\implies \\log_2(8) = 3$.\n- **Error 2: Pensar que el logaritmo no puede ser negativo.** **Cómo corregirlo:** Cuando el argumento es una fracción menor a 1 (con base entera), el exponente es negativo ($\\log_2(1/2) = -1$)."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\log_2(16)$?
  alternativas:
  - $4$
  - $8$
  - $2$
  respuesta: $4$
  solucion_pasos:
  - $2^4 = 16 \implies \log_2(16) = 4$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\log_{10}(100)$?
  alternativas:
  - $2$
  - $10$
  - $20$
  respuesta: $2$
  solucion_pasos:
  - $10^2 = 100 \implies \log(100) = 2$.
- titulo: ¿Es log₂(32) = 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $2^5 = 32$.
  alternativas:
  - texto: Sí, porque 2⁵ = 32
    es_correcta: true
    retroalimentacion: ¡Correcto! Definición directa de logaritmo.
  - texto: No, es 16
    es_correcta: false
    retroalimentacion: Incorrecto, 32/2 no es la operación logarítmica.
  - texto: No, es 6
    es_correcta: false
    retroalimentacion: Incorrecto, $2^6 = 64$.
- titulo: ¿Es log₃(1/9) = -2?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $3^{-2} = \frac{1}{3^2} = \frac{1}{9}$.
  alternativas:
  - texto: Sí, porque 3⁻² = 1/9
    es_correcta: true
    retroalimentacion: ¡Correcto! Potencia entera negativa.
  - texto: No, es 2
    es_correcta: false
    retroalimentacion: Incorrecto, $3^2 = 9$, no $1/9$.
  - texto: No, no existe
    es_correcta: false
    retroalimentacion: Incorrecto, el argumento $1/9 > 0$ es positivo y válido.
errores_frecuentes:
- Confundir logaritmo con división entre argumento y base.
- Olvidar que el resultado de un logaritmo puede ser negativo.
- Intentar calcular logaritmos con base negativa o cero.
- Creer que el argumento puede ser negativo.
- Confundir la base con el argumento al plantear la potencia.
afirmaciones_verdaderas:
- Un logaritmo representa el exponente necesario para obtener el argumento.
- La base de un logaritmo debe ser estrictamente positiva y distinta de 1.
- El argumento de un logaritmo debe ser siempre un número real positivo.
al_terminar_debes_poder: '![Síntesis de definición de logaritmo](/static/img/nodos/definicion-de-logaritmo-resumen.svg)


  QUÉ: Calcular y comprender la definición formal de un logaritmo en los números reales.


  CÓMO: Planteando la equivalencia exponencial $\log_b(a) = c \iff b^c = a$, descomponiendo el argumento $a$ en potencias de la base $b$ y verificando las condiciones $b > 0, b \neq 1, a > 0$.'
