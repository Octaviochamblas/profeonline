semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.DEFINICION
resumen_inicial: El logaritmo de un número $a$ en base $b$ es el exponente $c$ al
  que se debe elevar la base $b$ para obtener $a$ ($\log_b(a) = c \iff b^c = a$).
explicacion_simple: 'Un logaritmo responde a la pregunta: **¿a qué exponente debo
  elevar la base para llegar al resultado?**

  - $\log_2(8) = 3$ porque $2^3 = 8$.

  - $\log_{10}(100) = 2$ porque $10^2 = 100$.

  - $\log_5(5) = 1$ porque $5^1 = 5$.

  En $\log_b(a)$, $b$ es la base y $a$ es el argumento.'
explicacion_formal: Para $b > 0, b \neq 1$ y $a > 0$, el logaritmo $\log_b(a)$ se
  define como el único número real $c$ tal que $b^c = a$. La operación logarítmica
  es la inversa de la función exponencial $f(x) = b^x$.
definiciones_clave: '- **Base del logaritmo ($b$)**: Número positivo distinto de 1
  que actúa como la base de la potencia equivalente.

  - **Argumento ($a$)**: Número positivo al cual se le calcula el logaritmo.'
propiedades_relaciones: '- **Equivalencia fundamental**: $\log_b(a) = c \iff b^c =
  a$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\log_3(81)$.
  pasos:
  - Identificar la base $b = 3$ y el argumento $a = 81$.
  - 'Plantear la pregunta: ¿a qué exponente $c$ debo elevar 3 para obtener 81?'
  - 'Probar potencias de 3: $3^1 = 3$, $3^2 = 9$, $3^3 = 27$, $3^4 = 81$.'
  - Concluir que $\log_3(81) = 4$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_2(32)$?
  choices:
  - text: '5'
    is_correct: true
  - text: '16'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: 'La correcta es: 5. Porque $2^5 = 32$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\log_4(64)$.
  choices:
  - text: '3'
    is_correct: true
  - text: '16'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: 'La correcta es: 3. Porque $4^3 = 64$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ y el argumento $a$.'
- 'Paso 2: Escribir la relación exponencial equivalente $b^x = a$.'
- 'Paso 3: Encontrar el valor de $x$ que satisface la ecuación.'
- 'Paso 4: Declarar $\log_b(a) = x$.'
errores_correccion: No dividas el argumento entre la base. $\log_2(8)$ NO es $8 \div
  2 = 4$; es $3$ porque $2^3 = 8$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_5(25)$.
  alternativas:
  - '2'
  - '5'
  - '10'
  respuesta: '2'
  solucion_pasos:
  - $5^2 = 25 \implies \log_5(25) = 2$.
errores_frecuentes:
- Dividir el argumento por la base en lugar de buscar el exponente.
afirmaciones_verdaderas:
- $\log_b(a) = c \iff b^c = a$.
al_terminar_debes_ponder: Calcular logaritmos directos comprendiendo su definición
  como exponente.
fuente: Texto escolar MINEDUC.
estado: publicado
