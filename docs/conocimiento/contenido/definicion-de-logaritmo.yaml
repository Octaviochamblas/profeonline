semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.DEFINICION
resumen_inicial: El logaritmo de un número $a$ en base $b$ es el exponente $c$ al que se debe
  elevar la base $b$ para obtener $a$ ($\log_b(a) = c \iff b^c = a$).
explicacion_simple: 'Un logaritmo responde a la pregunta: **¿a qué exponente debo elevar la
  base para llegar al resultado?**

  - $\log_2(8) = 3$ porque $2^3 = 8$.

  - $\log_{10}(100) = 2$ porque $10^2 = 100$.

  - $\log_5(5) = 1$ porque $5^1 = 5$.

  En $\log_b(a)$, $b$ es la base y $a$ es el argumento.'
explicacion_formal: Para $b > 0, b \neq 1$ y $a > 0$, el logaritmo $\log_b(a)$ se define como
  el único número real $c$ tal que $b^c = a$. La operación logarítmica es la inversa de la
  función exponencial $f(x) = b^x$.
definiciones_clave: '- **Base del logaritmo ($b$)**: Número positivo distinto de 1 que actúa
  como la base de la potencia equivalente.

  - **Argumento ($a$)**: Número positivo al cual se le calcula el logaritmo.'
propiedades_relaciones: '- **Equivalencia fundamental**: $\log_b(a) = c \iff b^c = a$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\log_3(81)$.
  pasos:
  - Identificar la base $b = 3$ y el argumento $a = 81$.
  - 'Plantear la pregunta: ¿a qué exponente $c$ debo elevar 3 para obtener 81?'
  - 'Probar potencias de 3: $3^1 = 3$, $3^2 = 9$, $3^3 = 27$, $3^4 = 81$.'
  - Concluir que $\log_3(81) = 4$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_2(32)$?
  choices:
  - text: '5'
    is_correct: true
  - text: '16'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: 'La correcta es: 5. Porque $2^5 = 32$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\log_4(64)$.
  choices:
  - text: '3'
    is_correct: true
  - text: '16'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: 'La correcta es: 3. Porque $4^3 = 64$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ y el argumento $a$.'
- 'Paso 2: Escribir la relación exponencial equivalente $b^x = a$.'
- 'Paso 3: Encontrar el valor de $x$ que satisface la ecuación.'
- 'Paso 4: Declarar $\log_b(a) = x$.'
errores_correccion: No dividas el argumento entre la base. $\log_2(8)$ NO es $8 \div 2 = 4$;
  es $3$ porque $2^3 = 8$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_5(25)$.
  alternativas:
  - '2'
  - '5'
  - '10'
  respuesta: '2'
  solucion_pasos:
  - $5^2 = 25 \implies \log_5(25) = 2$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de log base 2 de 16?
  alternativas:
  - '4'
  - '8'
  - '2'
  respuesta: '4'
  solucion_pasos:
  - 2^4 = 16.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de log base 6 de 36?
  alternativas:
  - '2'
  - '6'
  - '3'
  respuesta: '2'
  solucion_pasos:
  - 6^2 = 36.
- titulo: ¿Es correcto calcular log base 3 de 9 dividiendo 9 entre 3?
  respuesta: 'No'
  solucion_pasos:
  - Se debe buscar el exponente al que se eleva 3 para obtener 9, que es 2, no dividir.
errores_frecuentes:
- Dividir el argumento por la base en lugar de buscar el exponente.
- Restar la base al argumento en lugar de buscar el exponente correcto.
- Confundir la base del logaritmo con el argumento al plantear la ecuación exponencial equivalente.
- Pensar que el logaritmo de un número siempre es un entero.
- Aplicar la definición sin verificar que la base sea válida, positiva y distinta de 1.
afirmaciones_verdaderas:
- $\log_b(a) = c \iff b^c = a$.
- Todo logaritmo bien definido cumple que la base es positiva y distinta de 1, y el argumento
  es positivo.
al_terminar_debes_poder: Calcular logaritmos directos comprendiendo su definición como exponente.
fuente: Texto escolar MINEDUC.
estado: publicado
