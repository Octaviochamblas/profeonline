semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_TABLA
resumen_inicial: 'Evaluación de una función dada por tabla: conceptos, representación
  y propiedades en Evaluación de funciones.'
explicacion_simple: No todas las funciones vienen con una fórmula a la vista. A veces
  solo tienes una tabla, y evaluar se convierte en buscar el número correcto en la
  fila correspondiente.
explicacion_formal: '### Definición formal


  Si una función se representa mediante una tabla de pares $(x_i, y_i)$, evaluar $f(x_k)$
  para un valor $x_k$ presente en la tabla consiste en localizar la fila donde aparece
  $x_k$ y leer el valor $y_k$ asociado, que corresponde a $f(x_k)$.


  ### Desarrollo didáctico


  A diferencia de una fórmula, una tabla solo entrega información para los valores
  explícitamente listados; no se puede evaluar directamente un $x$ que no aparezca
  en la tabla sin más información (como un patrón o una fórmula subyacente).


  Si la tabla muestra $x: 1, 2, 3$ con $y: 5, 8, 11$, entonces $f(2) = 8$, leyendo
  directamente la fila correspondiente a $x=2$.'
definiciones_clave: '- **Evaluación de una función dada por tabla**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a evaluación de una función dada por tabla.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a evaluación de una
    función dada por tabla.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a evaluación de una función dada
    por tabla.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    evaluación de una función dada por tabla?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en evaluación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en evaluación de funciones. Es la condición de
    existencia y unicidad en evaluación de una función dada por tabla.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en evaluación de una función
    dada por tabla, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localiza el valor de $x$ solicitado en la fila o columna de entradas.'
- 'Paso 2: Identifica la fila o columna correspondiente de salidas ($y$).'
- 'Paso 3: Lee el valor de $y$ asociado a ese $x$; ese valor es la imagen buscada.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar evaluación de una función dada por tabla.
ejemplos:
- titulo: Lectura directa de tabla
  enunciado: 'Una tabla muestra: $x=0 \to y=3$; $x=1 \to y=5$; $x=2 \to y=7$. Determina
    $f(1)$.'
  solucion_pasos:
  - Se busca la fila donde x=1.
  - $f(1) = 5$.
- titulo: Tabla con valores negativos
  enunciado: 'Una tabla muestra: $x=-2 \to y=10$; $x=-1 \to y=6$; $x=0 \to y=2$. Determina
    $f(-1)$.'
  solucion_pasos:
  - Se busca la fila donde x=-1.
  - $f(-1) = 6$.
- titulo: ¿Se puede evaluar directamente $f(5)$ si la tabla solo llega hasta $x=3$?
  enunciado: ¿Se puede evaluar directamente $f(5)$ si la tabla solo llega hasta $x=3$?
  respuesta: 'No'
  solucion_pasos:
  - La tabla solo entrega información de los valores listados; sin fórmula o patrón
    adicional, no se puede evaluar fuera de ese rango.
- titulo: ¿Una tabla puede representar una función?
  enunciado: ¿Una tabla puede representar una función?
  respuesta: Sí
  solucion_pasos:
  - Siempre que cada valor de x en la tabla tenga asociado un único valor de y.
errores_frecuentes:
- Confundir la columna de entradas ($x$) con la de salidas ($y$) al leer la tabla.
- Intentar evaluar un valor de $x$ que no está listado sin verificar si existe un
  patrón explícito.
- Asumir que la tabla completa representa todo el dominio de la función.
- Leer la fila incorrecta por error de conteo en tablas extensas.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando evaluación
  de una función dada por tabla.
