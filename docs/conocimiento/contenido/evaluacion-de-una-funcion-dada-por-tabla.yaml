semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_TABLA
resumen_inicial: Evaluar una función dada por una tabla de valores consiste en ubicar
  la preimagen $x$ en la primera fila o columna y leer su correspondiente imagen $f(x)$.
explicacion_simple: 'Cuando una función se presenta como una **tabla de valores**:

  - Buscamos el número $x$ deseado en la fila de las entradas (preimágenes).

  - Leemos de forma directa el número que está justo al lado o abajo en la fila de
  $f(x)$ (las imágenes).

  Por ejemplo, si la tabla muestra que al $x = 4$ le corresponde el valor $9$, entonces
  $f(4) = 9$.'
explicacion_formal: 'Dada una función finita descrita por la tabla de pares $T = \{(x_1,
  y_1), (x_2, y_2), \dots, (x_n, y_n)\}$:


  $$f(x_i) = y_i \quad \forall (x_i, y_i) \in T$$


  **Desglose de la fórmula:**

  - Mapeo directo tabular donde la búsqueda del argumento $x_i$ retorna de forma inmediata
  el valor $y_i$.'
definiciones_clave: '- **Tabla de valores**: Representación tabular ordenada de pares
  de entrada-salida $(x, f(x))$.'
propiedades_relaciones: '- **Lectura directa**: No requiere cálculos algebraicos;
  consiste en la extracción directa de datos ordenados.'
ejemplo_guiado:
  enunciado: 'Dada la tabla de valores de la función $h(x)$:


    | $x$ | $-1$ | $0$ | $2$ | $5$ |

    |---|---|---|---|---|

    | $h(x)$ | $7$ | $3$ | $-4$ | $10$ |


    Evalúa las imágenes $h(0)$ y $h(5)$, y determina la preimagen de $y = -4$.'
  pasos:
  - 'Paso 1: Para $h(0)$: buscar $x = 0$ en la primera fila y leer su imagen en la
    segunda fila $\implies h(0) = 3$.Paso 2: Para $h(5)$: buscar $x = 5$ en la primera
    fila y leer su imagen $\implies h(5) = 10$.Paso 3: Para la preimagen de $y = -4$:
    buscar $-4$ en la segunda fila ($h(x)$) y leer su $x$ correspondiente arriba $\implies
    x = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: A partir de la tabla dada, ¿cuál es el valor de la imagen $h(0)$?
  choices:
  - text: $h(0) = 3$
    is_correct: true
  - text: $h(0) = 7$
    is_correct: false
  - text: $h(0) = -4$
    is_correct: false
  - text: $h(0) = 10$
    is_correct: false
  explanation: La alternativa correcta es '$h(0) = 3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: A partir de la tabla, ¿cuál es la preimagen $x$ correspondiente a la imagen
    $h(x) = -4$?
  choices:
  - text: $x = 2$
    is_correct: true
  - text: $x = 0$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  - text: $x = -1$
    is_correct: false
  explanation: La alternativa correcta es '$x = 2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar la fila o columna correspondiente a la variable independiente $x$.'
- 'Paso 2: Buscar el número concreto a evaluar.'
- 'Paso 3: Mirar en la misma posición de la fila o columna de $f(x)$ para obtener
  la imagen.'
- 'Paso 4: Escribir la respuesta $f(a) = b$.'
errores_correccion: '- **Error común:** Buscar el valor de la imagen en la fila de
  $x$ en lugar de la fila de $f(x)$.

  - **Cómo corregirlo:** La fila superior/izquierda siempre contiene las entradas
  ($x$), y la fila inferior/derecha contiene las salidas ($f(x)$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de evaluación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de evaluación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Evaluar una función consiste en reemplazar la preimagen x en la fórmula
    y calcular y?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de valorización funcional.
- titulo: ¿Se debe verificar que el número pertenezca al dominio antes de evaluar
    una raíz par?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar raíces de números negativos en $\\mathbb{R}$.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir números negativos al elevar a potencias pares.
- Confundir la búsqueda de una imagen (evaluar $f(a)$) con la búsqueda de una preimagen
  (igualar $f(x) = b$).
- Pensar que la notación $f(x+3)$ equivale simplemente a sumar $3$ al resultado final
  de $f(x)$.
- Intentar evaluar valores que no pertenecen al dominio provocando divisiones por
  cero o raíces pares negativas.
- Buscar preimágenes en el eje vertical $Y$ o imágenes en el eje horizontal $X$ al
  interpretar un gráfico.
afirmaciones_verdaderas:
- Para evaluar una función $f(x)$ se reemplaza la variable $x$ por el valor dado respetando
  la jerarquía operacional.
- Para hallar la preimagen $x$ correspondiente a una imagen $y_0$ se debe resolver
  la ecuación $f(x) = y_0$.
al_terminar_debes_poder: Al finalizar este recurso podrás evaluar funciones a partir
  de fórmulas, tablas o gráficos, y determinar preimágenes respetando las restricciones
  del dominio.
