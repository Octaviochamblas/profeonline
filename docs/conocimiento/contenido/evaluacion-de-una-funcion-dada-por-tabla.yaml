semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_TABLA
resumen_inicial: Evaluar una función dada por tabla consiste en buscar el valor de entrada en la fila o columna de $x$ y extraer su correspondiente imagen $f(x)$.
explicacion_simple: '![Evaluar una función dada por tabla consiste en buscar el valor de entrada en la fila o columna de $x$ y extraer su correspondiente imagen $f(x)$](/static/img/nodos/evaluacion-de-una-funcion-dada-por-tabla-intro.svg)



  Cuando una función se presenta en una **tabla de valores**:

  - Cada columna (o fila) representa un par de datos $(x, f(x))$.

  - Para encontrar $f(a)$, buscas el número $a$ en la fila de las entradas $x$.

  - La imagen es el número que se encuentra en la misma columna en la fila de $f(x)$.'
explicacion_formal: 'Una **tabla de valores** es una representación discreta finita de una función $f$, compuesta por una secuencia de pares ordenados:

  $$\mathcal{T} = \{(x_1, y_1), (x_2, y_2), \dots, (x_n, y_n)\}$$


  La evaluación $f(x_k)$ consiste en la búsqueda del par correspondiente tal que $(x_k, y_k) \in \mathcal{T}$, cumpliéndose que $f(x_k) = y_k$.


  **Operaciones con valores tabulares:**

  Es habitual resolver expresiones combinadas como $2f(x_1) - 3f(x_2)$ extrayendo individualmente los valores de la tabla.'
definiciones_clave: '- **Tabla de valores**: Disposición matricial que relaciona valores de la variable independiente con sus respectivas imágenes.

  - **Extracción tabular**: Lectura directa del valor dependiente correspondiente a una entrada en la tabla.'
propiedades_relaciones: '- **Dominio discreto**: El dominio en una tabla explícita está formado exclusivamente por los valores listados en la fila de $x$.

  - **Búsqueda directa**: No requiere fórmulas algebraicas intermedias.'
ejemplo_guiado:
  enunciado: '![Ejemplo Evaluar una función dada por tabla consiste en buscar el valor de entrada en la fila o columna de $x$ y extraer su correspondiente imagen $f(x)$](/static/img/nodos/evaluacion-de-una-funcion-dada-por-tabla-ejemplos.svg)



    Dada la siguiente tabla de valores para una función $f$:

    | $x$ | $-2$ | $0$ | $1$ | $4$ |

    | $f(x)$ | $7$ | $3$ | $-1$ | $5$ |

    Calcula el valor de la expresión $2f(0) - 3f(1) + f(4)$.'
  pasos:
  - 'Paso 1: Buscar $f(0)$ en la tabla: alineado con $x = 0$ está $f(0) = 3$.'
  - 'Paso 2: Buscar $f(1)$ en la tabla: alineado con $x = 1$ está $f(1) = -1$.'
  - 'Paso 3: Buscar $f(4)$ en la tabla: alineado con $x = 4$ está $f(4) = 5$.'
  - 'Paso 4: Sustituir en la expresión: $2(3) - 3(-1) + 5 = 6 + 3 + 5 = 14$.'
checkpoints:
- placement: after_explicacion_formal
  question: En una tabla donde para $x = -3$ se indica $f(x) = 8$, ¿cuál es el valor de $f(-3)$?
  choices:
  - text: '8'
    is_correct: true
  - text: '-3'
    is_correct: false
  - text: '-24'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '8'. La tabla asocia directamente la preimagen -3 con la imagen 8.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Con la tabla: $x \in \{1, 2, 3\} \to f(x) \in \{4, 7, 10\}$, ¿cuánto vale $f(2)^2 - f(1)$?'
  choices:
  - text: '45'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '18'
    is_correct: false
  - text: '40'
    is_correct: false
  explanation: La alternativa correcta es '45'. $f(2) = 7$ y $f(1) = 4$, luego $7^2 - 4 = 49 - 4 = 45$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la fila o columna correspondiente a la variable independiente $x$.'
- 'Paso 2: Ubicar el valor numérico de la preimagen solicitada.'
- 'Paso 3: Desplazarse a la casilla contigua de la variable dependiente $f(x)$ para leer la imagen.'
- 'Paso 4: Sustituir los valores leídos en las operaciones algebraicas solicitadas.'
errores_correccion: '- **Error común:** Invertir la lectura buscando la preimagen en la fila de $f(x)$ y dando como respuesta el valor de $x$.

  - **Cómo corregirlo:** Verificar siempre los encabezados: la preimagen $a$ se busca en la fila $x$, y la respuesta $f(a)$ se extrae de la fila $f(x)$.'
ejemplos:
- titulo: 'Ejemplo 1: Lectura directa'
  enunciado: Si una tabla tiene los pares $(1, 9), (2, 14), (3, 19)$, ¿cuál es el valor de $f(2)$?
  alternativas:
  - '14'
  - '9'
  - '19'
  - '2'
  respuesta: '14'
  solucion_pasos:
  - 'Paso 1: Ubicar $x = 2$ en la tabla.'
  - 'Paso 2: Leer la imagen correspondiente: $f(2) = 14$.'
- titulo: 'Ejemplo 2: Suma de imágenes tabulares'
  enunciado: 'Con la tabla: $f(-1) = 4$, $f(0) = 2$, $f(2) = -3$. Calcula $f(-1) + f(2)$.'
  alternativas:
  - '1'
  - '7'
  - '-1'
  - '6'
  respuesta: '1'
  solucion_pasos:
  - 'Paso 1: $f(-1) = 4$ y $f(2) = -3$.'
  - 'Paso 2: Sumar: $4 + (-3) = 1$.'
- titulo: 'Ejemplo 3: Producto y resta'
  enunciado: Si $g(1) = 3$ y $g(4) = 5$ en una tabla, calcula $3g(1) - 2g(4)$.
  alternativas:
  - '-1'
  - '1'
  - '-7'
  - '19'
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: $3(3) - 2(5) = 9 - 10 = -1$.'
- titulo: 'Ejemplo 4: Preimagen en tabla'
  enunciado: En una tabla con pares $(x, f(x))$, ¿para qué valor de $x$ se cumple que $f(x) = 0$ si los pares son $(-2, 5), (1, 0), (3, -4)$?
  alternativas:
  - x = 1
  - x = 0
  - x = -2
  - x = 3
  respuesta: x = 1
  solucion_pasos:
  - 'Paso 1: Buscar el valor $0$ en la fila de $f(x)$.'
  - 'Paso 2: La preimagen correspondiente en la fila de $x$ es $1$.'
errores_frecuentes:
- Confundir la preimagen con la imagen al leer la tabla.
- Asumir que valores no listados en una tabla discreta pueden calcularse promediando casillas sin una regla explícita.
- Cometer errores de signos en operaciones combinadas con valores negativos de la tabla.
afirmaciones_verdaderas:
- Evaluar una función por tabla consiste en extraer la imagen alineada con la preimagen dada.
- Las tablas representan conjuntos de pares ordenados discretos donde cada entrada posee su respectiva salida.
al_terminar_debes_poder: '**QUÉ:** Evaluar funciones e interpretar expresiones numéricas a partir de tablas de valores.


  **CÓMO:** Localizando las entradas en la fila o columna independiente para extraer las imágenes y operar con ellas.


  ![Resumen Evaluar una función dada por tabla consiste en buscar el valor de entrada en la fila o columna de $x$ y extraer su correspondiente imagen $f(x)$](/static/img/nodos/evaluacion-de-una-funcion-dada-por-tabla-resumen.svg)'
