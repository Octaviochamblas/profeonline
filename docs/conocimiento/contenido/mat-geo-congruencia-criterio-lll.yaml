semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CRITERIO_LLL
resumen_inicial: 'Criterio de congruencia LLL: lado, lado, lado: conceptos, teoremas,
  propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: En vez de verificar los seis elementos (tres lados y tres ángulos)
  para confirmar que dos triángulos son congruentes, existen criterios abreviados
  que requieren mucha menos información. El primero es el criterio LLL.
explicacion_formal: '![Criterio de congruencia LLL](/static/img/geometria/congruencia-semejanza/congruencia-criterio-lll.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C''$ se cumple $AB=A''B''$, $BC=B''C''$
  y $CA=C''A''$, entonces $\triangle ABC\cong\triangle A''B''C''$.


  ### Desarrollo didáctico


  Basta con medir los tres lados de cada triángulo: si coinciden exactamente (en cualquier
  correspondencia consistente), los triángulos son congruentes, sin necesidad de medir
  ningún ángulo. Esto ocurre porque tres lados determinan de forma única la forma
  de un triángulo.'
definiciones_clave: '- **Criterio de congruencia LLL: lado, lado, lado**: Elemento
  o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a criterio de congruencia lll: lado, lado, lado.'
ejemplo_guiado:
  enunciado: 'Para analizar criterio de congruencia lll: lado, lado, lado, considera
    un ángulo $\alpha = 121^\circ$ ubicado en la posición dada. Determina el valor
    de la medida asociada sabiendo que $x + 1090^\circ = 121^\circ$.'
  pasos:
  - 'Identificar la propiedad de criterio de congruencia lll: lado, lado, lado referida
    a $\alpha = 121^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1090 = 121 \implies x = 121 - 1090$.'
  - 'Concluir que la medida calculada para criterio de congruencia lll: lado, lado,
    lado es $x = -969^\circ$.'
