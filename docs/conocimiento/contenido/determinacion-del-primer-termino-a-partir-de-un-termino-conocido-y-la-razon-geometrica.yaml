semantic_id: MAT.NUM.PROG_GEOMETRICA.CALCULO_PRIMER_TERMINO
resumen_inicial: 'Determinación del primer término a partir de un término conocido y la razón
  geométrica: concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: Imagina que entras a la cocina y ves un pan gigante que triplicó su tamaño
  tres veces seguidas. ¿De qué tamaño era la bolita de masa original? Tenemos que rebobinar
  la película usando divisiones.
explicacion_formal: "Sabemos que $a_n = a_1 \\cdot r^{(n-1)}$.\nSi la incógnita es $a_1$,\
  \ el bloque multiplicativo de la razón $r^{(n-1)}$ debe cruzar al otro lado haciendo la\
  \ operación contraria (dividiendo).\n\n**Fórmula despejada:**\n$a_1 = \\frac{a_n}{r^{(n\
  \ - 1)}}$\n\nLógica: 'Tomo el número gigante de la posición $n$ y lo divido todas las veces\
  \ que fue multiplicado para encogerlo de vuelta a su tamaño original'.\n\nEjemplo: Sabemos\
  \ que el término 4 vale 54 ($a_4=54$) y la razón es 3 ($r=3$).\n- $a_1 = \\frac{54}{3^{(4-1)}}$\n\
  - $a_1 = \\frac{54}{3^3}$\n- $a_1 = \\frac{54}{27} = 2$. \n¡La bolita original valía 2!"
definiciones_clave: '- **Determinación del primer término a partir de un término conocido
  y la razón geométrica**: Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Determinación del primer término a partir de un
  término conocido y la razón geométrica**: Relaciones de cambio y fórmulas estructurales
  de progresión geométrica.'
ejemplo_guiado:
  enunciado: El término 4 de una progresión geométrica es 250 y su razón es 5. Calcula el
    primer término.
  pasos:
  - Identifico a_4 igual a 250, n igual a 4, r igual a 5.
  - 'Aplico la fórmula despejada: a_1 igual a a_4 dividido entre r elevado a (4 menos 1).'
  - Calculo 5 elevado a 3 igual a 125, y 250 dividido entre 125 igual a 2. El primer término
    es 2.
