procedimiento:
- 'Paso 1: Identifica tu término de destino ($a_n$) y su posición ($n$).'
- 'Paso 2: Identifica la razón geométrica ($r$).'
- 'Paso 3: Eleva la razón al exponente $(n-1)$ para saber cuál fue el factor total de multiplicación.'
- 'Paso 4: Divide el término de destino ($a_n$) por ese factor.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en determinación del primer término a partir de un término conocido y la razón geométrica.
ejemplos:
- titulo: Desinflando el número
  enunciado: El 5to término de una progresión geométrica es 160. Su razón es 2. Halla el primer
    término.
  solucion_pasos:
  - 'Datos: a5 = 160, r = 2, n = 5.'
  - 'Factor total: 2^(5-1) = 2^4 = 16.'
  - 'Despejamos a1: 160 / 16.'
  - a1 = 10.
- titulo: Ejemplo 1
  enunciado: El término 3 de una progresión geométrica es 45 y r es 3. ¿Cuánto vale a_1?
  alternativas:
  - '5'
  - '15'
  - '135'
  respuesta: '5'
  solucion_pasos:
  - 45 dividido entre 3 elevado a 2, es decir 45 dividido entre 9, es igual a 5.
- titulo: Ejemplo 2
  enunciado: El término 5 es 32 y r es 2. ¿Cuánto vale a_1?
  alternativas:
  - '2'
  - '16'
  - '64'
  respuesta: '2'
  solucion_pasos:
  - 32 dividido entre 2 elevado a 4, es decir 32 dividido entre 16, es igual a 2.
- titulo: ¿Se necesita conocer r para calcular a_1 a partir de otro término?
  respuesta: Sí
  solucion_pasos:
  - Sin r no se puede calcular el factor total de multiplicación que separa a ambos términos.
- titulo: ¿El primer término de una progresión geométrica siempre es el menor de todos?
  respuesta: 'No'
  solucion_pasos:
  - Solo si la razón es mayor que 1; si es menor que 1, a_1 es el mayor de todos los términos.
errores_frecuentes:
- Olvidar elevar a la potencia $(n-1)$ y dividir simplemente $a_n / r$ (lo cual solo te retrocedería
  una posición, en vez de volver hasta el inicio).
- Equivocarse en el cálculo de la potencia en el denominador (ej. decir que $2^4 = 8$ en vez
  de 16).
- Dividir por r sin elevarlo antes al exponente correspondiente.
- Confundir el término conocido con el primer término al plantear la ecuación.
- Equivocarse al calcular la potencia del denominador.
afirmaciones_verdaderas:
- La formulación de determinación del primer término a partir de un término conocido y la
  razón geométrica mantiene la regularidad de la sucesión.
- La fórmula del término general se puede despejar para encontrar a_1 cuando se conoce cualquier
  otro término y la razón.
