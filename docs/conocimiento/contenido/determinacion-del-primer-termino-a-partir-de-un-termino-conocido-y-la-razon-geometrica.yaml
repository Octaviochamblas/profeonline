procedimiento:
- 'Paso 1: Identifica tu término de destino ($a_n$) y su posición ($n$).'
- 'Paso 2: Identifica la razón geométrica ($r$).'
- 'Paso 3: Eleva la razón al exponente $(n-1)$ para saber cuál fue el factor total
  de multiplicación.'
- 'Paso 4: Divide el término de destino ($a_n$) por ese factor.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en determinación del primer término a partir de un término conocido y la razón
  geométrica.
ejemplos:
- titulo: Desinflando el número
  enunciado: El 5to término de una progresión geométrica es 160. Su razón es 2. Halla
    el primer término.
  solucion_pasos:
  - 'Datos: a5 = 160, r = 2, n = 5.'
  - 'Factor total: 2^(5-1) = 2^4 = 16.'
  - 'Despejamos a1: 160 / 16.'
  - a1 = 10.
errores_frecuentes:
- Olvidar elevar a la potencia $(n-1)$ y dividir simplemente $a_n / r$ (lo cual solo
  te retrocedería una posición, en vez de volver hasta el inicio).
- Equivocarse en el cálculo de la potencia en el denominador (ej. decir que $2^4 =
  8$ en vez de 16).
afirmaciones_verdaderas:
- La formulación de determinación del primer término a partir de un término conocido
  y la razón geométrica mantiene la regularidad de la sucesión.
