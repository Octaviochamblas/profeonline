resumen_inicial: 'El cálculo del primer término $a_1$ despeja la condición inicial
  dividiendo un término conocido $a_k$ entre la razón elevada a la $(k-1)$: $a_1 =
  \frac{a_k}{r^{k-1}}$.'
explicacion_simple: Si nos dan un término que está más adelante en la secuencia (por
  ejemplo, el quinto término) y conocemos la razón multiplicativa, podemos regresar
  al primer número dividiendo entre la razón acumulada.
explicacion_formal: 'Dado el término $a_k$ en la posición $k$ y la razón $r \neq 0$,
  el **Despeje del Primer Término $a_1$** se realiza mediante:


  $$a_k = a_1 \cdot r^{k-1} \implies a_1 = \frac{a_k}{r^{k-1}}$$


  **Interpretación de retroceso multiplicativo:**

  - Se divide por la potencia del factor $r^{k-1}$ para retrotraer el valor al origen
  posicional $n=1$.'
definiciones_clave: '- **Cálculo del primer término $a_1$**: Despeje $a_1 = \frac{a_k}{r^{k-1}}$.'
propiedades_relaciones: '- **Retroceso exponencial**: División por el factor multiplicativo
  acumulado $r^{k-1}$.'
ejemplo_guiado:
  enunciado: En una P.G. con razón $r = 3$, el sexto término es $a_6 = 486$. Calcule
    el primer término $a_1$.
  pasos:
  - 'Paso 1: Plantea la fórmula: $a_6 = a_1 \cdot r^5 \implies 486 = a_1 \cdot 3^5$.'
  - 'Paso 2: Calcular la potencia: $3^5 = 243$.'
  - 'Paso 3: Despejar $a_1 = \frac{486}{243} = 2$.'
  - 'Conclusión: El primer término es $a_1 = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja el primer término a1 a partir de un término conocido
    ak y la razón r en una P.G.?
  choices:
  - text: 'Dividiendo el término conocido ak entre la razón elevada a la (k - 1):
      a1 = ak / r^(k - 1)'
    is_correct: true
  - text: Multiplicando a1 = ak · r^(k - 1)
    is_correct: false
  - text: Restando a1 = ak - r · k
    is_correct: false
  - text: Sumando a1 = ak + r
    is_correct: false
  explanation: 'La alternativa correcta es ''Dividiendo el término conocido ak entre
    la razón elevada a la (k - 1): a1 = ak / r^(k - 1)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a6 = 486 con r = 3, ¿cuál fue el primer término
    a1?
  choices:
  - text: '2'
    is_correct: true
  - text: '6'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '9'
    is_correct: false
  explanation: La alternativa correcta es '2'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el primer término $a_1
  = \frac{a_k}{r^{k-1}}$ retrocediendo exponencialmente desde un término conocido.
semantic_id: MAT.NUM.PROG_GEOMETRICA.CALCULO_PRIMER_TERMINO
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una razón multiplicativa constante
  $r = \frac{a_{n+1}}{a_n}$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 \cdot r^{n-1}$ o de la
  suma $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
- 'Paso 3: Resolver numéricamente o con logaritmos el parámetro solicitado ($a_n,
  a_1, r, n$ o $S_n$).'
errores_correccion: '- **Error 1: Elevar la razón $r$ a la potencia $n$ en lugar de
  $(n-1)$ en el término general ($a_n = a_1 \cdot r^n$).** **Cómo corregirlo:** La
  razón $r$ se aplica a partir de la segunda posición, por lo que el exponente correcto
  es $(n-1)$.


  - **Error 2: Usar la fórmula de la suma de progresión aritmética en una progresión
  geométrica.** **Cómo corregirlo:** En la P.G. la suma DEBE utilizar el factor multiplicativo
  $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_GEOMETRICA.CALCULO_PRIMER_TERMINO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión geométrica.
- titulo: Ejemplo 2
  enunciado: Verificación de la razón constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} / a_n = r$.
- titulo: ¿Es constante el cociente entre términos consecutivos en una P.G.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión geométrica.
- titulo: ¿Corresponde la P.G. a una función exponencial discreta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a_n = a_1 \cdot r^{n-1}$ es una potencia de base $r$.
errores_frecuentes:
- Elevar la razón r al exponente n en lugar de multiplicar por r^(n-1) al calcular
  an.
- Restar los términos en lugar de calcular el cociente de división para determinar
  la razón r.
- Usar la fórmula del promedio de Gauss propia de la progresión aritmética en una
  progresión geométrica.
- Declarar que una razón geométrica menor que 1 genera términos negativos en la secuencia.
- Declarar la razón porcentual P% con el factor multiplicativo r = 1 + P/100.
afirmaciones_verdaderas:
- Una progresión geométrica tiene una razón constante $r = \frac{a_{n+1}}{a_n}$ entre
  términos consecutivos.
- El término general de una P.G. se calcula mediante la función exponencial $a_n =
  a_1 \cdot r^{n-1}$.
