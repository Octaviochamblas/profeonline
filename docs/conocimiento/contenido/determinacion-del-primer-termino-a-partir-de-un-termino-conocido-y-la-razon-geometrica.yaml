semantic_id: MAT.NUM.PROG_GEOMETRICA.CALCULO_PRIMER_TERMINO
resumen_inicial: 'La determinación del primer término $a_1$ en una progresión geométrica despeja la ecuación general mediante $a_1 = \frac{a_k}{r^{k-1}}$, dividiendo el término conocido $a_k$ por la potencia acumulada de la razón.'
explicacion_simple: |
  Si conoces un término de la progresión (por ejemplo, el término 6) y la razón ($r$), puedes hallar el número inicial ($a_1$) dividiendo:
  - Para avanzar multiplicas por $r$, así que para **retroceder hacia el inicio divides** por $r^{k-1}$:
    $$a_1 = \frac{a_k}{r^{k-1}}$$
  - Por ejemplo, si el término $5$ vale $162$ y la razón es $r = 3$:
    $$a_1 = \frac{162}{3^{5-1}} = \frac{162}{3^4} = \frac{162}{81} = 2$$
  - ¡El primer término de la progresión es $a_1 = 2$!

  ![Determinación del primer término en una PG](/static/img/nodos/determinacion-del-primer-termino-a-partir-de-un-termino-conocido-y-la-razon-geometrica-intro.svg)
explicacion_formal: |
  ### Deducción formal por Despeje
  Dada la ecuación del término general para el índice $k \in \mathbb{N}$:
  $$a_k = a_1 \cdot r^{k-1}$$
  Como $r \neq 0$, dividimos ambos miembros por $r^{k-1}$:
  $$a_1 = \frac{a_k}{r^{k-1}} = a_k \cdot r^{-(k-1)}$$

  ### Interpretación de la Operación Inversa
  - Cada retroceso de una posición ordinal equivale a multiplicar por el inverso multiplicativo $r^{-1} = \frac{1}{r}$.
  - Para desplazarse desde la posición $k$ hasta la posición $1$ se ejecutan exactamente $(k - 1)$ divisiones consecutivas por $r$.

  ### Síntesis didáctica
  - Ecuación de despeje: $a_1 = \frac{a_k}{r^{k-1}}$.
  - Operación: División por la potencia $(k-1)$ de la razón.
definiciones_clave: |
  - **Primer término ($a_1$)**: Valor en la posición inicial $n=1$.
  - **Término de referencia ($a_k$)**: Valor conocido en la posición ordinal $k$.
  - **Potencia reductora ($r^{k-1}$)**: Factor acumulado por el cual se divide para regresar a la posición inicial.
propiedades_relaciones: |
  - **Unicidad de la solución**: Para cualquier término $a_k \neq 0$ y razón $r \neq 0$, existe un único valor inicial $a_1 \in \mathbb{R}$.
  - **Conservación de signo**: Si $r > 0$, el término $a_1$ tiene exactamente el mismo signo que $a_k$.
ejemplo_guiado:
  enunciado: 'En una progresión geométrica, el cuarto término es $a_4 = 54$ y la razón es $r = 3$. Encuentra el primer término $a_1$ y escribe los cuatro primeros términos.'
  imagen: '/static/img/nodos/determinacion-del-primer-termino-a-partir-de-un-termino-conocido-y-la-razon-geometrica-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: $k = 4, a_4 = 54, r = 3$.'
    - 'Paso 2: Aplicamos la fórmula de despeje: $a_1 = \frac{a_4}{r^{4-1}} = \frac{54}{3^3}$.'
    - 'Paso 3: Calculamos la potencia: $3^3 = 27$.'
    - 'Paso 4: Dividimos: $a_1 = \frac{54}{27} = 2$.'
    - 'Paso 5: Los cuatro primeros términos son **$2, 6, 18, 54$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en una PG se sabe que $a_3 = 48$ y la razón es $r = 4$, ¿cuál es el valor del primer término $a_1$?'
    choices:
      - {text: '$a_1 = 3$, calculando $\frac{48}{4^{3-1}} = \frac{48}{16} = 3$', is_correct: true}
      - {text: '$a_1 = 12$, dividiendo solo una vez por 4', is_correct: false}
      - {text: '$a_1 = 192$, multiplicando en lugar de dividir', is_correct: false}
      - {text: '$a_1 = 0,75$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_1 = 3$, calculando $\frac{48}{4^{3-1}} = \frac{48}{16} = 3$''. Se divide $a_3$ por $r^2 = 16$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En una PG con $r = -2$, si el quinto término es $a_5 = 80$, ¿cuál es el valor de $a_1$?'
    choices:
      - {text: '$a_1 = 5$, calculando $\frac{80}{(-2)^4} = \frac{80}{16} = 5$', is_correct: true}
      - {text: '$a_1 = -5$', is_correct: false}
      - {text: '$a_1 = 10$', is_correct: false}
      - {text: '$a_1 = -10$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_1 = 5$, calculando $\frac{80}{(-2)^4} = \frac{80}{16} = 5$''. Como $(-2)^4 = +16$, la división da $+5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término conocido $a_k$, su índice $k$ y la razón $r$.'
  - 'Paso 2: Calcular el exponente de retroceso: $k - 1$.'
  - 'Paso 3: Calcular la potencia $r^{k-1}$.'
  - 'Paso 4: Dividir el término conocido entre la potencia: $a_1 = \frac{a_k}{r^{k-1}}$.'
errores_correccion: |
  - **Error 1:** Multiplicar por $r^{k-1}$ en vez de dividir al despejar $a_1$. **Cómo corregirlo:** Para regresar al inicio se debe **dividir por la potencia de la razón**: $a_1 = \frac{a_k}{r^{k-1}}$.
  - **Error 2:** Dividir por $r^k$ en lugar de $r^{k-1}$. **Cómo corregirlo:** Desde la posición $1$ hasta la posición $k$ hay exactamente **$(k - 1)$ pasos multiplicativos**.
ejemplos:
  - titulo: 'Cálculo de $a_1$ con razón entera'
    enunciado: 'Si $a_5 = 160$ y $r = 2$, ¿cuál es el primer término $a_1$?'
    alternativas:
      - '$10$'
      - '$20$'
      - '$5$'
    respuesta: '$10$'
    solucion_pasos:
      - '1. $a_1 = 160 / 2^{5-1} = 160 / 2^4 = 160 / 16 = 10$.'
  - titulo: 'Cálculo de $a_1$ con razón fraccionaria'
    enunciado: 'Si $a_3 = 5$ y $r = \frac{1}{3}$, ¿cuál es el primer término $a_1$?'
    alternativas:
      - '$45$'
      - '$15$'
      - '$135$'
    respuesta: '$45$'
    solucion_pasos:
      - '1. $a_1 = 5 / (1/3)^2 = 5 / (1/9) = 5 \cdot 9 = 45$.'
  - titulo: 'Comprobación de valor inicial'
    enunciado: '¿Si $a_3 = 18$ y $r = 3$, el primer término es $a_1 = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_1 = 18 / 3^2 = 18 / 9 = 2$.'
  - titulo: 'Primer término negativo'
    enunciado: '¿Una PG puede tener un primer término negativo como $a_1 = -8$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. El primer término $a_1$ puede ser cualquier número real no nulo.'
errores_frecuentes:
  - 'Para calcular el primer término $a_1$ se multiplica el término conocido por $r^{k-1}$ en lugar de dividirlo.'
  - 'Al despejar el primer término se divide por $r^k$ omitiendo restar uno al exponente.'
  - 'Dividir un número por una fracción menor a uno produce un resultado menor que el número original.'
  - 'El primer término de una PG con razón negativa siempre debe ser obligatoriamente negativo.'
  - 'No es posible hallar el primer término a partir de un término lejano si no se conocen los valores intermedios.'
afirmaciones_verdaderas:
  - 'El primer término de una PG se calcula mediante $a_1 = \frac{a_k}{r^{k-1}}$ a partir de cualquier término $a_k$ y su razón $r \neq 0$.'
  - 'Dividir por una razón fraccionaria $0 < r < 1$ genera un primer término estrictamente mayor que el término conocido $a_k$ ($k > 1$).'
