semantic_id: MAT.ALG.ADICION_POL.METODO_VERTICAL
resumen_inicial: La adición de polinomios por alineación de términos semejantes consiste en disponer los polinomios en filas verticales, ordenando las columnas según el factor literal para sumar los coeficientes por columna.
explicacion_simple: "La **adición en forma vertical** (o por columnas) es ideal para no confundirse con polinomios largos:\n- **Paso 1: Ordenar los polinomios** en forma decreciente respecto a una variable ($x^3, x^2, x^1$, constante).\n- **Paso 2: Escribir el primer polinomio** en la fila superior.\n- **Paso 3: Escribir el segundo polinomio abajo**, alineando cada término **EXACTAMENTE DEBAJO del término semejante** que le corresponde.\n- **Paso 4: Trazar una línea y sumar columna por columna** los coeficientes numéricos.\n- **Ejemplo**: Sumar $(4x^2 - 3x + 5)$ con $(2x^2 + 8x - 1)$:\n  $$\\begin{array}{rcccl}\n    4x^2 & - & 3x & + & 5 \\\\\n  + \\; 2x^2 & + & 8x & - & 1 \\\\\n  \\hline\n    \\mathbf{6x^2} & \\mathbf{+} & \\mathbf{5x} & \\mathbf{+} & \\mathbf{4}\n  \\end{array}$$\n\n![Adición por Alineación en Columnas](/static/img/nodos/adicion-de-polinomios-por-alineacion-de-terminos-semejantes-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\mathcal{P}_n$ el espacio de polinomios de grado a lo sumo $n$. La **adición vertical por alineación tabular** es la representación matricial de la suma $P + Q$ donde las columnas $j \in \{0, 1, \dots, n\}$ corresponden a los vectores base de la canónica $\{x^n, x^{n-1}, \dots, 1\}$:


  $$\begin{pmatrix} a_n & a_{n-1} & \dots & a_0 \\ b_n & b_{n-1} & \dots & b_0 \end{pmatrix} \xrightarrow{\text{Suma por columna}} \begin{pmatrix} a_n + b_n & a_{n-1} + b_{n-1} & \dots & a_0 + b_0 \end{pmatrix}$$


  ### Isomorfismo con la Suma Vectorial en $\mathbb{R}^{n+1}$

  El método de columnas explícita el isomorfismo algebraico $\phi: \mathbb{R}_n[x] \to \mathbb{R}^{n+1}$ que convierte la suma de polinomios en una suma de vectores por componentes ordenadas.


  ### Síntesis didáctica

  La alineación vertical visualiza de manera clara el valor posicional de cada grado, reduciendo drásticamente la tasa de error por omisión de términos en exámenes.

  '
definiciones_clave: '- **Adición vertical**: Disposición en columnas donde cada línea vertical agrupa monomios con idéntica clase literal.

  - **Alineación por columnas**: Correspondencia exacta de términos semejantes uno debajo del otro.

  - **Suma por componentes**: Operación aditiva independiente ejecutada sobre cada columna del arreglo tabular.

  '
propiedades_relaciones: '- **Independencia de columna**: Cada columna se suma de forma aislada sin llevar reservas a la columna de al lado (a diferencia de la aritmética de enteros).

  - **Invarianza estructural**: La alineación por columnas preserva los exponentes de cada variable intactos en la fila resultado.

  '
ejemplo_guiado:
  enunciado: Suma en forma vertical los polinomios $P = 7x^3 - 4x + 9$ y $Q = 2x^3 + 5x^2 + x - 3$.
  pasos:
  - 'Paso 1: Ordenamos y completamos las columnas de $P$: $7x^3 + 0x^2 - 4x + 9$.'
  - 'Paso 2: Ordenamos las columnas de $Q$: $2x^3 + 5x^2 + 1x - 3$.'
  - 'Paso 3: Disponemos la alineación vertical por columnas: $$\begin{array}{rcccc} 7x^3 & + & 0x^2 & - & 4x & + & 9 \\ + \; 2x^3 & + & 5x^2 & + & 1x & - & 3 \\ \hline \end{array}$$'
  - 'Paso 4: Sumamos la columna $x^3$: $7 + 2 = \mathbf{9x^3}$.'
  - 'Paso 5: Sumamos la columna $x^2$: $0 + 5 = \mathbf{+5x^2}$.'
  - 'Paso 6: Sumamos la columna $x$: $-4 + 1 = \mathbf{-3x}$.'
  - 'Paso 7: Sumamos la columna de Constantes: $+9 - 3 = \mathbf{+6}$.'
  - 'Conclusión: El polinomio suma es **$9x^3 + 5x^2 - 3x + 6$**.'
  imagen: /static/img/nodos/adicion-de-polinomios-por-alineacion-de-terminos-semejantes-ejemplos.svg
