semantic_id: MAT.ALG.ADICION_POL.METODO_VERTICAL
resumen_inicial: 'Adición de polinomios por alineación de términos semejantes: procedimiento
  y reglas en Adición de polinomios.'
explicacion_simple: 'Cuando en la escuela aprendiste a sumar números de varios dígitos
  (unidades con unidades, decenas con decenas), estabas usando el método vertical.
  En álgebra, la misma lógica se aplica: cada ''columna'' agrupa una familia de términos
  semejantes.'
explicacion_formal: "### Definición formal\n\nLa alineación visual por columnas es\
  \ la gran fortaleza del método vertical.\n\n### Desarrollo didáctico\n\nSuma: $(4x^2\
  \ + 3x - 5)$ y $(2x^2 - x + 1)$.\n\nAlineamos verticalmente:\n```\n  4x² + 3x -\
  \ 5\n+ 2x² -  x + 1\n─────────────\n  6x² + 2x - 4\n```\n\nEn cada columna sumamos\
  \ los coeficientes:\n- Columna $x^2$: $4 + 2 = 6$.\n- Columna $x$: $3 + (-1) = 2$.\n\
  - Columna constante: $-5 + 1 = -4$.\n\nResultado: $6x^2 + 2x - 4$."
definiciones_clave: '- **Adición de polinomios por alineación de términos semejantes**:
  Operación o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a adición de polinomios por alineación de términos semejantes.'
ejemplo_guiado:
  enunciado: Aplica adición de polinomios por alineación de términos semejantes en
    una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de adición de polinomios por
    alineación de términos semejantes.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el criterio esencial al aplicar adición de polinomios por alineación
    de términos semejantes?
  choices:
  - text: Identificar correctamente la regla operativa de adición de polinomios
    is_correct: true
  - text: Sumar los exponentes de las letras al reducir
    is_correct: false
  - text: Ignorar los signos dentro de los paréntesis
    is_correct: false
  - text: Cambiar el exponente del término resultante
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar correctamente la regla operativa
    de adición de polinomios. Es la regla central para el desarrollo de adición de
    polinomios por alineación de términos semejantes.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al desarrollar un ejercicio de adición de polinomios por alineación de
    términos semejantes, ¿qué paso es indispensable?
  choices:
  - text: Respetar la ley de signos al reducir términos o eliminar paréntesis
    is_correct: true
  - text: Eliminar la parte literal sin operar los coeficientes
    is_correct: false
  - text: Cambiar los signos al azar
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Respetar la ley de signos al reducir términos
    o eliminar paréntesis. Asegura la precisión en los resultados de adición de polinomios
    por alineación de términos semejantes.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribe el primer polinomio.'
- 'Paso 2: Escribe el segundo polinomio debajo, alineando estrictamente los términos
  del mismo grado en la misma columna.'
- 'Paso 3: Traza una línea horizontal separadora.'
- 'Paso 4: Suma columna por columna los coeficientes.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en adición de polinomios por alineación de términos semejantes.
ejemplos:
- titulo: La suma de los pesos
  enunciado: 'Suma verticalmente: $(2m^2 - 3m) + (m^2 + 5m - 4)$.'
  solucion_pasos:
  - 'Columna $m^2$: $2 + 1 = 3m^2$.'
  - 'Columna $m$: $-3 + 5 = 2m$.'
  - 'Columna constante: 0 + (-4) = -4.'
  - 'Resultado: $3m^2 + 2m - 4$.'
- titulo: Tres proyectos describen sus costos con los polinomios $P_1 = 2t^2 + 3t$,
    $P_2 = t^2 - t + 5
  enunciado: 'Tres proyectos describen sus costos con los polinomios $P_1 = 2t^2 +
    3t$, $P_2 = t^2 - t + 5$ y $P_3 = 4t - 2$. ¿Cuál es el costo total combinado?
    (v1)


    Opciones: A) $3t^2 + 6t + 3$ · B) $3t^2 - 6t + 3$ · C) $3t^2 + 6t - 3$ · D) $7t^2
    + 6t + 3$'
  solucion_pasos:
  - 'Col $t^2$: $2+1+0=3$. Col $t$: $3-1+4=6$. Col constante: $0+5-2=3$. Total: $3t^2+6t+3$.'
  - 'Respuesta: $3t^2 + 6t + 3$'
- titulo: 'Respecto de «Adición de polinomios por alineación de términos semejantes»:
    ¿La siguiente for'
  enunciado: 'Respecto de «Adición de polinomios por alineación de términos semejantes»:
    ¿La siguiente formulación es correcta? «En la **Adición Vertical**, los polinomios
    se escriben uno debajo del otro, alineando los términos semejantes en columnas»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En la **Adición Vertical**,
    los polinomios se escriben uno debajo del otro, alineando los términos semejantes
    en columnas.'
- titulo: 'Respecto de «Adición de polinomios por alineación de términos semejantes»:
    ¿La siguiente con'
  enunciado: 'Respecto de «Adición de polinomios por alineación de términos semejantes»:
    ¿La siguiente conclusión es correcta? «Desalinear los términos, sumando coeficientes
    de distintas familias por error de columna»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En la **Adición Vertical**,
    los polinomios se escriben uno debajo del otro, alineando los términos semejantes
    en columnas.'
errores_frecuentes:
- Desalinear los términos, sumando coeficientes de distintas familias por error de
  columna.
- Olvidar que si un polinomio no tiene un término de cierto grado, se deja un espacio
  en blanco (coeficiente 0) en esa columna.
- Es más rápido que el método horizontal siempre.
- Elimina la necesidad de identificar términos semejantes.
- Para «¿Cuál es la ventaja principal del método vertical para sumar polinomios? (v1)»,
  la respuesta correcta es Permite multiplicar en lugar de sumar.
afirmaciones_verdaderas:
- La reducción en adición de polinomios por alineación de términos semejantes conserva
  los exponentes de la parte literal.
al_terminar_debes_poder: Operar y reducir expresiones algebraicas utilizando adición
  de polinomios por alineación de términos semejantes.
fuente: Álgebra de Baldor.
