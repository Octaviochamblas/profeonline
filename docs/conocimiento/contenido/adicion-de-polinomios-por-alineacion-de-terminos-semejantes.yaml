resumen_inicial: La adición de polinomios por alineación vertical consiste en escribir
  los polinomios uno debajo del otro, organizando las columnas de modo que coincidan
  los términos semejantes.
explicacion_simple: 'Para sumar polinomios verticalmente, los ordenamos como en la
  suma tradicional de la básica: ponemos una expresión arriba y la otra abajo, haciendo
  que cada columna contenga exactamente las mismas letras y exponentes. Luego sumamos
  los números columna por columna.'
explicacion_formal: 'Sean $P(x) = \sum_{k=0}^n a_k x^k$ y $Q(x) = \sum_{k=0}^n b_k
  x^k$ dispuestos en columnas. La **Adición Vertical por Alineación** calcula:


  $$\begin{array}{rcccl} P(x) & = & a_n x^n + \dots + a_1 x + a_0 \\ + \, Q(x) & =
  & b_n x^n + \dots + b_1 x + b_0 \\ \hline (P+Q)(x) & = & (a_n+b_n)x^n + \dots +
  (a_1+b_1)x + (a_0+b_0) \end{array}$$


  > **Complemento didáctico:** La disposición en matriz columnar elimina el riesgo
  de agrupaciones cruzadas entre términos no semejantes.'
definiciones_clave: '- **Alineación vertical**: Disposición en filas donde cada columna
  representa una clase única de parte literal.'
propiedades_relaciones: '- **Independencia de columnas**: Cada columna de coeficientes
  se opera como un cálculo escalar independiente.'
ejemplo_guiado:
  enunciado: Sume por alineación vertical $P(x) = 4x^3 - 2x^2 + 5$ y $Q(x) = 3x^3
    + 7x^2 - 8$.
  pasos:
  - 'Paso 1: Disponer $P(x)$ en la primera fila: $4x^3 - 2x^2 + 5$.'
  - "Paso 2: Disponer $Q(x)$ en la segunda fila alineando columnas homólogas:\n  Columna\
    \ $x^3$: $4x^3$ con $3x^3$.\n  Columna $x^2$: $-2x^2$ con $+7x^2$.\n  Columna\
    \ constante: $+5$ con $-8$."
  - "Paso 3: Sumar coeficientes por columna:\n  $x^3 \\to 4 + 3 = 7x^3$.\n  $x^2 \\\
    to -2 + 7 = +5x^2$.\n  Constantes $\\to 5 - 8 = -3$."
  - 'Conclusión: La suma vertical resulta en $7x^3 + 5x^2 - 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla fundamental al disponer dos polinomios para su adición
    vertical?
  choices:
  - text: Alinear en la misma columna vertical únicamente los términos que sean semejantes
    is_correct: true
  - text: Mezclar los exponentes en una sola columna
    is_correct: false
  - text: Colocar todos los coeficientes en la primera fila
    is_correct: false
  - text: Multiplicar los términos de la columna central
    is_correct: false
  explanation: La alternativa correcta es 'Alinear en la misma columna vertical únicamente
    los términos que sean semejantes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4x^3 - 2x^2 + 5 y 3x^3 + 7x^2 - 8, ¿cuál fue
    la suma obtenida?
  choices:
  - text: 7x^3 + 5x^2 - 3
    is_correct: true
  - text: 12x^3 + 14x^2 - 40
    is_correct: false
  - text: 7x^3 - 9x^2 + 13
    is_correct: false
  - text: x^3 + 5x^2 + 3
    is_correct: false
  explanation: La alternativa correcta es '7x^3 + 5x^2 - 3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordenar ambos polinomios en forma descendente respecto a una variable.'
- 'Paso 2: Escribir el primer polinomio en la fila superior.'
- 'Paso 3: Escribir el segundo polinomio en la fila inferior haciendo coincidir la
  columna de cada término semejante.'
- 'Paso 4: Sumar o restar los coeficientes de cada columna vertical.'
errores_correccion: '- **Error 1: Alinear en la misma columna términos con distinto
  exponente (como alinear $3x^2$ con $5x$).** **Cómo corregirlo:** Dejar un espacio
  en blanco o cero en la columna si a un polinomio le falta determinado grado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al sumar verticalmente (5a + 2b) y (3a - 6b), ¿qué columna de coeficientes
    corresponde a la letra b?
  alternativas:
  - +2 y -6 dando -4b
  - +2 y +6 dando 8b
  - 5 y 3 dando 8a
  - 2 y -6 dando -12b
  respuesta: +2 y -6 dando -4b
  solucion_pasos:
  - '1. Columna de b: 2 - 6 = -4.'
  - '2. Resultado de la columna: -4b.'
- titulo: Ejemplo 2
  enunciado: Sume verticalmente P(x) = 6x^2 - 4x + 1 y Q(x) = -2x^2 + 4x - 9.
  alternativas:
  - 4x^2 - 8
  - 4x^2 + 8x - 8
  - 8x^2 - 8
  - 4x^2 - 8x - 8
  respuesta: 4x^2 - 8
  solucion_pasos:
  - '1. Columna x^2: 6 - 2 = 4x^2.'
  - '2. Columna x: -4 + 4 = 0 (se anula).'
  - '3. Columna constante: 1 - 9 = -8. Resultado: 4x^2 - 8.'
- titulo: ¿Evita el método de alineación vertical el riesgo de sumar coeficientes
    de partes literales distintas?
  respuesta: Sí
  solucion_pasos:
  - Sí, la disposición columnar aisla visualmente cada clase de parte literal.
- titulo: ¿Si dos coeficientes de una columna son opuestos como +4x y -4x su suma
    da 8x?
  respuesta: 'No'
  solucion_pasos:
  - No, al ser coeficientes opuestos su suma da cero (0) y el término se anula en
    esa columna.
errores_frecuentes:
- Alinear verticalmente términos que poseen distinta parte literal o exponentes diferentes.
- Sumar coeficientes de columnas distintas por mala disposición tipográfica.
- Declarar que la suma de columnas con coeficientes opuestos produce el doble del
  término.
- Modificar los exponentes al realizar la adición por columna vertical.
- Omitir el signo negativo del coeficiente al transcribirlo a la fila de alineación.
afirmaciones_verdaderas:
- La adición por alineación exige organizar cada término semejante en una misma columna
  vertical.
- Si una columna contiene coeficientes opuestos como +c y -c, la suma de esa columna
  da cero.
al_terminar_debes_poder: Al terminar serás capaz de sumar polinomios mediante alineación
  vertical ordenando correctamente columnas de términos semejantes.
