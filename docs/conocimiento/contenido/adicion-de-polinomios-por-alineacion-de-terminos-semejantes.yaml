procedimiento:
- 'Paso 1: Escribir el primer polinomio ordenado de grado mayor a menor.'
- 'Paso 2: Escribir el segundo polinomio en la fila inferior haciendo coincidir cada término debajo de su semejante.'
- 'Paso 3: Si a un polinomio le falta un grado, dejar el espacio en blanco o colocar $0x^k$.'
- 'Paso 4: Trazar una línea horizontal y sumar los coeficientes de cada columna vertical.'
errores_correccion: '- **Error 1:** Alinear en la misma columna términos no semejantes (ej: colocar $3x^2$ debajo de $5x$). **Cómo corregirlo:** Las columnas deben tener **EL MISMO EXPONENTE O FACTOR LITERAL ($x^2$ con $x^2$, $x$ con $x$)**.

  - **Error 2:** LLEVAR RESERVAS de una columna a otra como en la suma numérica (decir que $6x + 8x = 14x$ y pasar $1$ a la columna $x^2$). **Cómo corregirlo:** En álgebra **NO HAY RESERVAS ($14x$ se escribe completo en su columna)**.

  '
ejemplos:
- titulo: Alineación de binomios
  enunciado: ¿Cuál es el resultado de sumar en columna $3x + 4$ con $2x - 7$?
  alternativas:
  - $5x - 3$
  - $5x + 11$
  - $6x - 28$
  respuesta: $5x - 3$
  solucion_pasos:
  - '1. Columna $x$: $3 + 2 = 5x$.'
  - '2. Columna constante: $4 - 7 = -3$.'
  - '3. Resultado: $5x - 3$.'
- titulo: Alineación de trinomios
  enunciado: ¿Cuál es el resultado de sumar $x^2 - 4x + 1$ con $3x^2 + 4x - 5$?
  alternativas:
  - $4x^2 - 4$
  - $4x^2 + 8x - 4$
  - $3x^2 - 4$
  respuesta: $4x^2 - 4$
  solucion_pasos:
  - '1. Columna $x^2: 1 + 3 = 4x^2$.'
  - '2. Columna $x: -4 + 4 = 0x$.'
  - '3. Columna constante: $1 - 5 = -4$.'
  - '4. Resultado: $4x^2 - 4$.'
- titulo: Espacio en blanco por término faltante
  enunciado: Para sumar $x^2 + 5$ con $3x - 2$, ¿conviene dejar el espacio libre de $x$ en la primera fila?
  respuesta: Sí
  solucion_pasos:
  - Sí, alinear $3x$ en su propia columna evita errores.
- titulo: Inexistencia de acarreo
  enunciado: En la columna de constantes $9 + 6 = 15$, ¿se escribe $+15$ sin pasar reserva a la columna $x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, no existen reservas entre columnas de polinomios.
errores_frecuentes:
- Alinear verticalmente en la misma columna monomios que no son términos semejantes.
- Llevar reservas a la columna de grado superior al sumar coeficientes que superan nueve.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Desplazar la columna de las constantes haciéndolas coincidir con términos con variable.
- El signo negativo de los coeficientes inferiores no es mantenido al sumar verticalmente.
afirmaciones_verdaderas:
- La adición de polinomios por alineación exige colocar los términos semejantes exactamente en la misma columna vertical.
- Las columnas en la adición polinómica se operan de manera independiente sin transferir reservas entre ellas.
al_terminar_debes_poder: '![Resumen de adición por alineación](/static/img/nodos/adicion-de-polinomios-por-alineacion-de-terminos-semejantes-resumen.svg)


  QUÉ: Sumar polinomios ordenándolos en filas verticales alineadas según la potencia de la variable.


  CÓMO: Ubicar cada término bajo su semejante en columnas específicas para reducir los coeficientes verticalmente de manera ordenada y segura.'
