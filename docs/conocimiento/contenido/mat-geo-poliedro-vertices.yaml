semantic_id: MAT.GEO.POLIEDROS_PRISMAS.VERTICES
resumen_inicial: 'Identificación de los vértices de un poliedro: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Cada 'esquina puntiaguda' de un poliedro, como las puntas de un
  dado, es lo que en geometría se llama vértice.
explicacion_formal: '![Vértices de un poliedro](/static/img/geometria/espacio-cuerpos/poliedro-vertices.svg)


  ### Definición formal


  Un vértice de un poliedro es un punto donde concurren (se encuentran) tres o más
  aristas, y por lo tanto también tres o más caras. Es el elemento de menor dimensión
  del poliedro (dimensión cero).


  ### Desarrollo didáctico


  En la figura, el punto $B$ es un vértice del prisma: en él concurren tres aristas
  y tres caras. Un prisma rectangular tiene en total 8 vértices.'
definiciones_clave: '- **Identificación de los vértices de un poliedro**: Elemento
  o propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de los vértices de un poliedro.'
ejemplo_guiado:
