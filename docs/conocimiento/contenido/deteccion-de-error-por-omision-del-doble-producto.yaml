semantic_id: MAT.ALG.CUADRADO_BINOMIO.OMISION_DOBLE_PRODUCTO
resumen_inicial: 'Detección de error por omisión del doble producto: fórmula, regla
  de expansión y aplicaciones en Cuadrado de binomio.'
explicacion_simple: 'Si hay un error que todo estudiante de álgebra ha cometido al
  menos una vez, es el llamado ''sueño del estudiante principiante'': creer que el
  exponente se distribuye en la suma.'
explicacion_formal: "### Definición formal\n\nConsiste en distribuir el exponente\
  \ erróneamente omitiendo el doble producto.\n\n### Desarrollo didáctico\n\nEl error\
  \ algebraico más famoso en matemáticas es, sin duda, la omisión del doble producto\
  \ al elevar un binomio al cuadrado. También se le llama \"El sueño del estudiante\
  \ novato\".\n\nEl error consiste en creer falsamente que el exponente se puede distribuir\
  \ sobre la suma o la resta, escribiendo:\n$(a+b)^2 \\neq a^2 + b^2$\n$(a-b)^2 \\\
  neq a^2 - b^2$\n\n**¿Por qué este es un error grave?**\nUn exponente nos indica\
  \ cuántas veces se multiplica *la base entera* por sí misma. En $(a+b)^2$, la base\
  \ es el bloque $(a+b)$. Al distribuirla correctamente como $(a+b)(a+b)$ sabemos\
  \ que aparecen los términos cruzados $ab + ba$ que originan el $+2ab$. \n\nSi omitimos\
  \ el doble producto, estamos ignorando los dos rectángulos interiores que aparecen\
  \ al representar esto geométricamente. Para evitar este error, siempre recuerda\
  \ la regla del producto notable, o, en caso de duda, escribe los dos paréntesis\
  \ y multiplica término a término."
definiciones_clave: '- **Detección de error por omisión del doble producto**: Producto
  notable con estructura fija de desarrollo directo.'
propiedades_relaciones: '- **Reglas de expansión**: Fórmulas de productos notables
  y simetrías algebraicas de detección de error por omisión del doble producto.'
ejemplo_guiado:
  enunciado: Expande o simplifica la expresión aplicando la regla de detección de
    error por omisión del doble producto.
  pasos:
  - Identificar la estructura del producto notable y sus términos principales.
  - Aplicar la fórmula correspondiente a detección de error por omisión del doble
    producto.
  - Elevar los términos a sus respectivas potencias y calcular los dobles/triples
    productos.
  - Escribir el polinomio resultante ordenado.
