resumen_inicial: La detección de error por falta del doble producto es el análisis
  crítico que impide resolver $(a + b)^2$ como la falsa distributiva $a^2 + b^2$.
explicacion_simple: Uno de los errores más comunes en matemáticas es pensar que $(x
  + 4)^2$ es igual a $x^2 + 16$. Falta el término del medio $2 \cdot x \cdot 4 = 8x$.
  El desarrollo verdadero es $x^2 + 8x + 16$. Detectar esa falta es clave para no
  cometer el error en pruebas.
explicacion_formal: 'Sea la falacia distributiva común sobre la adición en la potencia
  cuadrática:


  $$(a + b)^2 \neq a^2 + b^2 \quad \forall a, b \in \mathbb{R} \setminus \{0\}$$


  **Demostración del error por diferencia de términos:**

  $$(a + b)^2 - (a^2 + b^2) = (a^2 + 2ab + b^2) - (a^2 + b^2) = 2ab$$


  **Desglose simbólico:**

  - $(a + b)^2$: Trinomio cuadrado perfecto real.

  - $a^2 + b^2$: Binomio de suma de cuadrados (incompleto).

  - $2ab$: Término que representa el error numérico absoluto de la falacia.


  > **Complemento didáctico:** Evaluar con valores concretos como $a=1, b=2$ demuestra
  que $(1+2)^2 = 9$ mientras que $1^2 + 2^2 = 5$, probando la discrepancia por el
  término $2(1)(2) = 4$.'
definiciones_clave: '- **Falacia distributiva de la potencia**: Error conceptual que
  consiste en aplicar potencia a cada sumando sin incluir términos cruzados.

  - **Error absoluto $2ab$**: Diferencia exacta entre la expresión correcta y la errónea.'
propiedades_relaciones: '- **Detección de patrones en PAES**: Pregunta recurrente
  en pruebas estandarizadas sobre análisis de pasos erróneos en resolución de ecuaciones.'
ejemplo_guiado:
  enunciado: Demuestre numéricamente el error de la afirmación $(x + 4)^2 = x^2 +
    16$ evaluando para $x = 2$ y señale cuál es el término que falta.
  pasos:
  - 'Paso 1: Evaluar la expresión izquierda $(x + 4)^2$ con $x = 2$: $(2 + 4)^2 =
    6^2 = 36$.'
  - 'Paso 2: Evaluar la expresión derecha errónea $x^2 + 16$ con $x = 2$: $2^2 + 16
    = 4 + 16 = 20$.'
  - 'Paso 3: Calcular la diferencia entre ambos resultados: $36 - 20 = 16$.'
  - 'Paso 4: Verificar el término del doble producto $2ab = 2 \cdot (2) \cdot (4)
    = 16$.'
  - 'Conclusión: La igualdad es FALSA. Falta sumar el término del doble producto $8x$,
    siendo el desarrollo correcto $x^2 + 8x + 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la diferencia algebraica exacta entre la expresión $(a + b)^2$
    y la falsa suma $a^2 + b^2$?
  choices:
  - text: El término central del doble producto $2ab$
    is_correct: true
  - text: No hay diferencia, son idénticas
    is_correct: false
  - text: El término $a + b$
    is_correct: false
  - text: El término $a^2b^2$
    is_correct: false
  explanation: La alternativa correcta es 'El término central del doble producto $2ab$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la evaluación con $x = 2$ del ejemplo, ¿qué valor numérico aportaba
    el doble producto del término central?
  choices:
  - text: $16$
    is_correct: true
  - text: $20$
    is_correct: false
  - text: $36$
    is_correct: false
  - text: $8$
    is_correct: false
  explanation: La alternativa correcta es '$16$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si el desarrollo de una potencia cuadrática tiene solo 2 términos
  en lugar de 3.'
- 'Paso 2: Calcular el doble producto del primer término por el segundo $2ab$.'
- 'Paso 3: Agregar el término $2ab$ en la posición central para corregir la expresión
  al trinomio cuadrado perfecto.'
errores_correccion: '- **Error 1: Afirmar que $(x + y)^2 = x^2 + y^2$ por ''distribuir
  el exponente''.** **Cómo corregirlo:** La potencia no se distribuye en la suma.
  Se DEBE escribir el trinomio completo $x^2 + 2xy + y^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al corregir el desarrollo erróneo $(m + 5)^2 = m^2 + 25$, ¿qué término
    debe añadirse?
  alternativas:
  - $+10m$
  - $+5m$
  - $+20m$
  respuesta: $+10m$
  solucion_pasos:
  - 1. El doble producto es $2(m)(5) = 10m$.
  - 2. La expresión correcta es $m^2 + 10m + 25$.
- titulo: Ejemplo 2
  enunciado: ¿Es verdadera la igualdad $(3 + 4)^2 = 3^2 + 4^2$?
  alternativas:
  - Falsa, porque $49 \neq 25$
  - Verdadera, porque $7^2 = 49$
  - Falsa, porque $49 \neq 49$
  respuesta: Falsa, porque $49 \neq 25$
  solucion_pasos:
  - '1. Izquierda: $(3 + 4)^2 = 7^2 = 49$.'
  - '2. Derecha: $3^2 + 4^2 = $9$ + $16$ = 25$. Son distintas.'
- titulo: ¿Es la falta del término central la causa de que $(a - b)^2$ \neq $a^2 -
    b^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, falta el término central $-2ab$ para completar el trinomio.
- titulo: ¿La igualdad $(x + 0)^2 = x^2 + 0^2$ es un caso donde la expresión da el
    mismo resultado numérico?
  respuesta: Sí
  solucion_pasos:
  - Sí, solo cuando uno de los términos es cero ($b=0$) el término $2ab = 0$ y se
    cumple la coincidencia.
errores_frecuentes:
- Declarar que la suma de potencias $a^2 + b^2$ es la forma desarrollada de $(a +
  b)^2$.
- Declarar que la propiedad distributiva aplica sobre los sumando en una potencia
  cuadrática.
- La expresión $(x - 3)^2$ equivale al binomio de diferencia de cuadrados $x^2 - $9$.
- Declarar que el término $2ab$ solo es necesario cuando las variables son iguales.
- Declarar que elevar $(a + b)^2$ produce un binomio en lugar de un trinomio.
afirmaciones_verdaderas:
- Para todo par de números reales distintos de cero, $(a + b)^2$ es estrictamente
  mayor que $a^2 + b^2$ si $a$ y $b$ tienen el mismo signo.
- La corrección consiste en incorporar el término central $2ab$ para formar el trinomio
  cuadrado perfecto.
al_terminar_debes_poder: Al terminar serás capaz de detectar e identificar inmediatamente
  la falta del término central en desarrollos erróneos de cuadrado de binomio.
