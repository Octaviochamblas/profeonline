semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.RECTO
resumen_inicial: Un ángulo recto es aquel cuya medida es exactamente 90° (π/2 rad),
  formado por dos rayos perpendiculares simbolizado por un cuadrado en el vértice.
explicacion_simple: '![Ángulo Recto](/static/img/nodos/angulo-recto-de-medida-90-intro.svg)


  Observa la esquina perfecta de una hoja de papel, el marco de una puerta o el cruce
  de dos calles perpendiculares. Todos estos forman un ángulo recto: una abertura
  de 90° exactos que sirve como patrón de medida en geometría y construcción.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **recto** si sus rayos directores son ortogonales o perpendiculares
  entre sí, correspondiendo exactamente a la cuarta parte de una vuelta completa:


  $$\mu(\angle AOB) = 90^\circ = \frac{\pi}{2} \text{ rad} \iff \vec{OA} \perp \vec{OB}$$


  ### Desglose simbólico y geométrico

  - $\vec{OA} \perp \vec{OB}$: Condición de perpendicularidad u ortogonalidad euclidiana.

  - Producto escalar nulo: $\vec{OA} \cdot \vec{OB} = 0$.

  - Símbolo gráfico: Se representa convencionalmente mediante un pequeño cuadrado
  $\llcorner$ en el vértice.


  ### Síntesis didáctica

  El ángulo recto es el estándar métrico de perpendicularidad en el espacio euclidiano,
  base del teorema de Pitágoras y de los sistemas de coordenadas cartesianas ortogonales.'
definiciones_clave: '- **Ángulo recto**: Ángulo de medida exacta $\theta = 90^\circ$.

  - **Perpendicularidad ($\perp$)**: Relación entre dos rectas o rayos que se cortan
  formando ángulos rectos. '
propiedades_relaciones: '- **Cuadrante**: Equivale exactamente a la cuarta parte de
  un giro completo ($360^\circ / 4 = 90^\circ$).

  - **Triángulo Rectángulo**: Todo triángulo que posee un ángulo recto satisface el
  Teorema de Pitágoras $a^2 + b^2 = c^2$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Recto](/static/img/nodos/angulo-recto-de-medida-90-ejemplos.svg)


    Dos rectas se intersecan en el punto $O$. Si uno de los cuatro ángulos formados
    mide $90^\circ$, demuestra cuánto miden los tres ángulos restantes.'
  pasos:
  - 'Paso 1: Por ser adyacente sobre una línea recta (ángulo extendido de $180^\circ$),
    el ángulo contiguo mide $180^\circ - 90^\circ = 90^\circ$.'
  - 'Paso 2: Por ser opuestos por el vértice, los ángulos enfrentados tienen medidas
    iguales ($90^\circ$).'
  - 'Paso 3: Concluir que al haber un ángulo de $90^\circ$, los cuatro ángulos formados
    son todos rectos de $90^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto mide exactamente un ángulo recto?
  choices:
  - text: Exactamente 90°
    is_correct: true
  - text: Entre 0° y 90°
    is_correct: false
  - text: Exactamente 180°
    is_correct: false
  - text: Más de 90° y menos de 180°
    is_correct: false
  explanation: Un ángulo recto mide exactamente 90°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué símbolo geométrico se utiliza universalmente para indicar un ángulo
    recto en un dibujo?
  choices:
  - text: Un pequeño cuadrado en el vértice
    is_correct: true
  - text: Una flecha circular curva
    is_correct: false
  - text: Dos líneas paralelas onduladas
    is_correct: false
  - text: Un punto negro sin trazo
    is_correct: false
  explanation: La notación formal emplea un pequeño cuadrado en el vértice para señalar
    un ángulo de 90°.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si la medida angular dada es exactamente $90^\circ$ o si los
  rayos son perpendiculares.'
- 'Paso 2: Buscar el símbolo de cuadrado en el vértice del diagrama.'
- 'Paso 3: Clasificar inequívocamente como ángulo recto.'
errores_correccion: No asumas que un ángulo es recto solo porque se parece visualmente;
  debe tener el símbolo de cuadrado o el dato explícito de 90°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\alpha$ y $\beta$ son complementarios y $\alpha = 40^\circ$, ¿cuánto
    vale $\alpha + \beta$?
  alternativas:
  - $90^\circ$
  - $180^\circ$
  - $45^\circ$
  respuesta: $90^\circ$
  solucion_pasos:
  - Por definición, los ángulos complementarios suman exactamente $90^\circ$ (un ángulo
    recto).
- titulo: Ejemplo 2
  enunciado: Si un triángulo tiene un ángulo de $90^\circ$, ¿cómo se clasifica dicho
    triángulo?
  alternativas:
  - Triángulo rectángulo
  - Triángulo acutángulo
  - Triángulo obtusángulo
  respuesta: Triángulo rectángulo
  solucion_pasos:
  - Un triángulo con un ángulo recto se clasifica como triángulo rectángulo.
- titulo: ¿Un ángulo de 89.9° es un ángulo recto?
  respuesta: 'No'
  solucion_pasos:
  - No, debe medir exactamente 90°. 89.9° es un ángulo agudo.
- titulo: ¿Los ejes cartesianos X e Y forman un ángulo recto?
  respuesta: Sí
  solucion_pasos:
  - Sí, los ejes cartesianos son perpendiculares y forman 90°.
errores_frecuentes:
- Confundir 90° con un ángulo agudo o llamarlo obtuso.
- Creer que cualquier esquina visiblemente recta mide 90° sin verificar el enunciado.
- Olvidar que un ángulo recto equivale a $\pi/2$ radianes.
- Sumar los ángulos agudos de un triángulo rectángulo y esperar un valor distinto
  de 90°.
- Confundir el símbolo de cuadrado de 90° con un simple arco circular.
afirmaciones_verdaderas:
- Un ángulo recto mide exactamente $90^\circ$.
- Dos rectas perpendiculares siempre forman ángulos de $90^\circ$.
al_terminar_debes_poder: '**QUÉ:** Identificar, calcular y aplicar ángulos rectos
  de $90^\circ$ en problemas geométricos y trigonométricos.


  **CÓMO:** Verificando la perpendicularidad $\vec{OA} \perp \vec{OB}$ y reconociendo
  el símbolo de escuadra cuadrada en los vértices.


  ![Resumen de Ángulo Recto](/static/img/nodos/angulo-recto-de-medida-90-resumen.svg)'
