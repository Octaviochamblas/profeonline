semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.RECTO
resumen_inicial: El ángulo recto de 90° define la perpendicularidad entre líneas,
  siendo la piedra angular de los sistemas rectangulares, la arquitectura y el Teorema
  de Pitágoras.
explicacion_simple: Mira la esquina del marco de una puerta o la esquina de una hoja
  de papel. Esa esquina perfecta en forma de 'L' es un ángulo recto y mide exactamente
  90°.
explicacion_formal: Un ángulo $\theta$ se clasifica como **recto** si su medida es
  exactamente $\theta = 90^\circ$. Sus lados son dos rayos perpendiculares ($\vec{OA}
  \perp \vec{OB}$). Gráficamente se denota con un pequeño cuadrado en el vértice.
definiciones_clave: '- **Ángulo recto**: Ángulo de medida exactamente igual a $90^\circ$.

  - **Perpendicularidad**: Relación entre dos líneas o rayos que se intersectan formando
  un ángulo de $90^\circ$.'
propiedades_relaciones: '- **Cuadrante**: Un ángulo recto equivale a la cuarta parte
  de una vuelta completa ($360^\circ / 4 = 90^\circ$).

  - **Base de los teoremas**: Es la base del Teorema de Pitágoras y de la trigonometría
  en triángulos rectángulos.'
ejemplo_guiado:
  enunciado: En la escuadra de un carpintero, las dos aristas forman un ángulo recto
    expresado como $3x + 15^\circ = 90^\circ$. Halla el valor de $x$ y justifica la
    perpendicularidad.
  pasos:
  - 'Paso 1: Plantear la ecuación del ángulo recto: $3x + 15 = 90$.'
  - 'Paso 2: Restar 15 a ambos lados: $3x = 75 \implies x = 25^\circ$.'
  - 'Paso 3: Confirmar que la intersección a $90^\circ$ garantiza la perpendicularidad
    exacta de las aristas.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la medida exacta en grados de un ángulo recto?
  choices:
  - text: Exactamente 90°
    is_correct: true
  - text: Exactamente 180°
    is_correct: false
  - text: Cualquier valor menor a 90°
    is_correct: false
  - text: Exactamente 360°
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente 90°', definitoria del ángulo
    recto.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en la escuadra tenemos la relación $3x + 15^\circ = 90^\circ$, ¿cuál
    es el valor de $x$?
  choices:
  - text: 25°
    is_correct: true
  - text: 30°
    is_correct: false
  - text: 15°
    is_correct: false
  - text: 75°
    is_correct: false
  explanation: La alternativa correcta es '25°', obtenida mediante $3x = 75 \implies
    x = 25^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si los lados son perpendiculares o si se incluye el símbolo
  de cuadrado en el vértice.'
- 'Paso 2: Igualar la expresión matemática del ángulo a $90^\circ$.'
- 'Paso 3: Resolver la ecuación para despejar la incógnita.'
errores_correccion: Recuerda que un ángulo de 89.9° no es recto; debe medir exactamente
  90°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué símbolo gráfico se usa en el vértice para representar un ángulo
    recto?
  alternativas:
  - Un pequeño cuadrado
  - Un arco con un punto
  - Una flecha curva
  respuesta: Un pequeño cuadrado
  solucion_pasos:
  - Un pequeño cuadrado en el vértice simboliza perpendicularidad (90°).
- titulo: Ejemplo 2
  enunciado: Si bisecamos un ángulo llano de 180° trazando su bisectriz, ¿qué medida
    tienen los dos ángulos resultantes?
  alternativas:
  - 90° cada uno
  - 45° cada uno
  - 60° cada uno
  respuesta: 90° cada uno
  solucion_pasos:
  - La mitad de 180° es $180^\circ / 2 = 90^\circ$, obteniendo dos ángulos rectos.
- titulo: ¿Un ángulo de 90° se denomina ángulo recto?
  respuesta: Sí
  solucion_pasos:
  - Sí, la denominación oficial de 90° es ángulo recto.
- titulo: ¿Un triángulo puede tener dos ángulos rectos?
  respuesta: 'No'
  solucion_pasos:
  - No, porque la suma de los tres ángulos de un triángulo es 180°.
errores_frecuentes:
- Declarar un ángulo recto (90°) con un ángulo agudo cercano como 85°.
- Afirmar que las líneas deben ser horizontal y vertical para formar un ángulo recto
  (la orientación no importa).
- Declarar que un ángulo recto puede medir más de 90°.
- Omitir usar la propiedad de perpendicularidad al resolver sistemas de ecuaciones.
- Declarar que todos los cuadriláteros tienen ángulos rectos en sus esquinas.
afirmaciones_verdaderas:
- Un ángulo recto mide exactamente 90°.
- Dos rectas perpendiculares forman cuatro ángulos rectos de 90° al cruzarse.
al_terminar_debes_poder: Al finalizar este recurso podrás reconocer, calcular y aplicar
  las propiedades de los ángulos rectos de 90° en construcciones y ecuaciones geométricas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
