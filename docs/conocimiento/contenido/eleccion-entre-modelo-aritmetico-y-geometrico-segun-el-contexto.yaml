  QUÉ: Identificar y seleccionar el modelo matemático óptimo (aritmético o geométrico) a partir de problemas contextualizados.
  CÓMO: Analizar claves verbales discriminando entre variaciones aditivas absolutas ($d$) y factores multiplicativos de escala ($r = 1 \pm i$).
