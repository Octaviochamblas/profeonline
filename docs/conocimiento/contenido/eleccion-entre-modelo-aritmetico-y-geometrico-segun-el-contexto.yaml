semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.ELECCION_MODELO
resumen_inicial: 'Elección entre modelo aritmético y geométrico según el contexto:
  concepto y desarrollo dentro de Comparación y modelamiento con progresiones.'
explicacion_simple: Imagina que eres un analista financiero. Tienes que proyectar
  las ganancias de una empresa. Si usas la herramienta equivocada, predecirás la quiebra
  cuando en realidad se volverán millonarios. Elegir el modelo es el 90% del trabajo.
explicacion_formal: "A la hora de leer un problema complejo, subraya las palabras\
  \ que denotan cómo avanza el tiempo:\n\n1. **Palabras clave para Modelo Aritmético:**\
  \ 'Bono fijo', 'cuota mensual plana', 'caída de $5$ grados por hora', 'depreciación\
  \ lineal'. \n   - Justificación: La diferencia 'd' entre periodos es un valor constante\
  \ independiente del total acumulado.\n\n2. **Palabras clave para Modelo Geométrico:**\
  \ 'Interés compuesto', 'crecimiento poblacional', 'depreciación porcentual', 'se\
  \ divide a la mitad', 'tasa de inflación'.\n   - Justificación: El aumento o disminución\
  \ se calcula sobre el nuevo saldo de cada periodo, creando un efecto de bola de\
  \ nieve (razón 'r').\n\n*Nota PAES:* Te presentarán dos opciones de inversión o\
  \ cobro y te preguntarán cuál conviene más a largo plazo. Recuerda que la progresión\
  \ geométrica (si $r > 1$) SIEMPRE terminará superando a la aritmética, sin importar\
  \ la ventaja inicial que tenga la aritmética."
definiciones_clave: '- **Elección entre modelo aritmético y geométrico según el contexto**:
