semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.ELECCION_MODELO
resumen_inicial: 'Elección entre modelo aritmético y geométrico según el contexto: concepto
  y desarrollo dentro de Comparación y modelamiento con progresiones.'
explicacion_simple: Imagina que eres un analista financiero. Tienes que proyectar las ganancias
  de una empresa. Si usas la herramienta equivocada, predecirás la quiebra cuando en realidad
  se volverán millonarios. Elegir el modelo es el 90% del trabajo.
explicacion_formal: "A la hora de leer un problema complejo, subraya las palabras que denotan\
  \ cómo avanza el tiempo:\n\n1. **Palabras clave para Modelo Aritmético:** 'Bono fijo', 'cuota\
  \ mensual plana', 'caída de $5$ grados por hora', 'depreciación lineal'. \n   - Justificación:\
  \ La diferencia 'd' entre periodos es un valor constante independiente del total acumulado.\n\
  \n2. **Palabras clave para Modelo Geométrico:** 'Interés compuesto', 'crecimiento poblacional',\
  \ 'depreciación porcentual', 'se divide a la mitad', 'tasa de inflación'.\n   - Justificación:\
  \ El aumento o disminución se calcula sobre el nuevo saldo de cada periodo, creando un efecto\
  \ de bola de nieve (razón 'r').\n\n*Nota PAES:* Te presentarán dos opciones de inversión\
  \ o cobro y te preguntarán cuál conviene más a largo plazo. Recuerda que la progresión geométrica\
  \ (si $r > 1$) SIEMPRE terminará superando a la aritmética, sin importar la ventaja inicial\
  \ que tenga la aritmética."
definiciones_clave: '- **Elección entre modelo aritmético y geométrico según el contexto**:
  Concepto fundamental dentro del estudio de Comparación y modelamiento con progresiones.'
propiedades_relaciones: '- **Propiedades de Elección entre modelo aritmético y geométrico
  según el contexto**: Relaciones de cambio y fórmulas estructurales de comparación y modelamiento
  con progresiones.'
ejemplo_guiado:
  enunciado: 'Una empresa ofrece dos formas de pago: Opción A, 200.000 pesos fijos más 20.000
    pesos por cada día trabajado; Opción B, 10.000 pesos el primer día y el doble cada día
    siguiente. ¿Qué modelo corresponde a cada opción?'
  pasos:
  - 'En la Opción A, el aumento por día es siempre 20.000 pesos, un valor fijo independiente
    del monto acumulado: modelo aritmético.'
  - 'En la Opción B, el pago de cada día depende del pago del día anterior, ya que se duplica:
    modelo geométrico.'
  - Concluyo que la Opción A crece linealmente y la Opción B crece exponencialmente, por lo
    que a partir de cierto número de días la Opción B terminará pagando mucho más.
