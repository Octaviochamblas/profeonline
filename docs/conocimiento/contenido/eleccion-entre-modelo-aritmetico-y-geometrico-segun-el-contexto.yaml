semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.ELECCION_MODELO
resumen_inicial: 'La elección entre modelo aritmético y geométrico evalúa las claves lingüísticas y dinámicas del enunciado para determinar si la variación es una cantidad absoluta aditiva (PA) o un factor porcentual/multiplicativo de escala (PG).'
explicacion_simple: |
  Cuando te enfrentas a un problema de la vida real o de la prueba PAES, debes preguntarte: **¿Cómo cambia la cantidad en cada paso?**
  - **Usa el MODELO ARITMÉTICO (PA)** cuando el texto diga:
    - *"Suma $\$5.000$ cada mes"*, *"Aumenta $2\text{ cm}$ diarios"*, *"Tarifa de $\$300$ por kilómetro"*, *"Diferencia constante"*.
    - Fórmula: $Y(n) = Y_1 + (n - 1)d$.
  - **Usa el MODELO GEOMÉTRICO (PG)** cuando el texto diga:
    - *"Aumenta un $10\%$ anual"*, *"Se duplica cada 3 horas"*, *"Pierde una cuarta parte en cada filtro"*, *"Interés compuesto"*.
    - Fórmula: $Y(n) = Y_1 \cdot r^{n-1}$.

  ![Elección entre modelo aritmético y geométrico](/static/img/nodos/eleccion-entre-modelo-aritmetico-y-geometrico-segun-el-contexto-intro.svg)
explicacion_formal: |
  ### Matriz de Decisión Contextual
  | Contexto Fenomenológico | Pregunta Clave | Modelo Óptimo | Parámetro Fundamental |
  | :--- | :--- | :--- | :--- |
  | **Tarifas y carreras** | ¿Se cobra un valor fijo por unidad? | Aritmético (PA) | Diferencia $d$ ($\text{costo/km}$) |
  | **Ahorro en alcancía** | ¿Se deposita la misma cuota siempre? | Aritmético (PA) | Diferencia $d$ ($\text{cuota}$) |
  | **Interés simple** | ¿El interés se calcula solo sobre capital inicial? | Aritmético (PA) | Diferencia $d = C_0 \cdot i$ |
  | **Interés compuesto** | ¿Los intereses se capitalizan en el saldo? | Geométrico (PG) | Razón $r = 1 + i$ |
  | **Crecimiento bacteriano** | ¿La población se multiplica por período? | Geométrico (PG) | Razón $r = 2$ (duplicación) |
  | **Depreciación porcentual** | ¿Se pierde un porcentaje del valor contable? | Geométrico (PG) | Razón $r = 1 - p/100$ |

  ### Criterio de Verificación Empírica
  Para una tabla de datos observados $\{(t_1, y_1), (t_2, y_2), (t_3, y_3)\}$ con $t_{k+1} - t_k = 1$:
  - Si $y_3 - y_2 = y_2 - y_1 \implies$ Seleccionar **Modelo Aritmético**.
  - Si $\frac{y_3}{y_2} = \frac{y_2}{y_1} \implies$ Seleccionar **Modelo Geométrico**.

  ### Síntesis didáctica
  - Palabras aditivas (fijo, cuota, resta, suma) $\implies$ PA.
  - Palabras multiplicativas (porcentaje, factor, duplica, fracciona) $\implies$ PG.
definiciones_clave: |
  - **Matriz de decisión**: Esquema lógico para discriminar la estructura matemática adecuada.
  - **Clave semántica**: Vocabulario en el enunciado que indica adición fija o multiplicación porcentual.
  - **Capitalización**: Proceso financiero que convierte rendimientos en capital productor, característico de la PG.
propiedades_relaciones: |
  - **Sensibilidad de la proyección**: Elegir incorrectamente el modelo (ej: PA en lugar de PG) produce discrepancias astronómicas al proyectar más allá de 5 a 10 períodos.
  - **Aproximación local**: Para $i \ll 1$ y pocos períodos ($t \le 2$), el modelo geométrico $(1+i)^t \approx 1 + it$ se asemeja al aritmético, pero difiere drásticamente al crecer $t$.
ejemplo_guiado:
  enunciado: 'Un biólogo observa que un cultivo contiene $800$ bacterias y que cada 4 horas la población se triplica. Identifica el modelo correspondiente, escribe su función matemática y calcula cuántas bacterias habrá al cabo de 12 horas.'
  imagen: '/static/img/nodos/eleccion-entre-modelo-aritmetico-y-geometrico-segun-el-contexto-ejemplos.svg'
  pasos:
    - 'Paso 1: Análisis semántico: La palabra "se triplica" indica multiplicación por un factor constante $r = 3$.'
    - 'Paso 2: Selección del modelo: **Progresión Geométrica (PG)**.'
    - 'Paso 3: Definición de períodos: Cada período son 4 horas. En 12 horas han transcurrido $t = \frac{12}{4} = 3$ períodos.'
    - 'Paso 4: Formulación matemática: $P(t) = P_0 \cdot r^t = 800 \cdot 3^t$.'
    - 'Paso 5: Evaluación para $t = 3$: $P(3) = 800 \cdot 3^3 = 800 \cdot 27 = **21.600\text{ bacterias}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un problema describe que un auto de $\$10.000.000$ pierde un $15\%$ de su valor comercial cada año, ¿qué modelo matemático debe elegirse?'
    choices:
      - {text: 'Modelo geométrico (PG) con razón $r = 1 - 0,15 = 0,85$', is_correct: true}
      - {text: 'Modelo aritmético (PA) con diferencia $d = -15$', is_correct: false}
      - {text: 'Modelo lineal con pendiente fija de $\$1.500.000$', is_correct: false}
      - {text: 'Ninguno, porque los autos no siguen reglas matemáticas', is_correct: false}
    explanation: 'La alternativa correcta es ''Modelo geométrico (PG) con razón $r = 1 - 0,15 = 0,85$''. La depreciación porcentual anual sobre el saldo contable es un modelo geométrico decreciente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un plan de telefonía cobra un cargo fijo de $\$6.000$ más $\$50$ por cada minuto hablado. ¿Qué modelo representa el costo total mensual?'
    choices:
      - {text: 'Modelo aritmético (PA) con $d = 50$, porque la tarifa por minuto es una suma constante fija', is_correct: true}
      - {text: 'Modelo geométrico con razón $r = 50$', is_correct: false}
      - {text: 'Modelo de serie infinita convergente', is_correct: false}
      - {text: 'Modelo geométrico alternante', is_correct: false}
    explanation: 'La alternativa correcta es ''Modelo aritmético (PA) con $d = 50$, porque la tarifa por minuto es una suma constante fija''. Cada minuto suma una cantidad aditiva idéntica de $\$50$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer el enunciado buscando claves lingüísticas ("monto fijo", "porcentaje", "duplica", "tarifa").'
  - 'Paso 2: Si el cambio es una cantidad fija por unidad de tiempo, elegir Modelo Aritmético ($a_n = a_1 + (n-1)d$).'
  - 'Paso 3: Si el cambio es una tasa proporcional o factor multiplicativo, elegir Modelo Geométrico ($a_n = a_1 \cdot r^{n-1}$).'
  - 'Paso 4: Identificar la unidad temporal y la cantidad de períodos $n$ o $t$.'
  - 'Paso 5: Resolver la ecuación y redactar la conclusión en el contexto del problema.'
errores_correccion: |
  - **Error 1:** Modelar inversiones con interés compuesto usando la fórmula lineal de interés simple. **Cómo corregirlo:** El interés compuesto capitaliza rendimientos y **debe modelarse como PG**: $C(t) = C_0(1+i)^t$.
  - **Error 2:** Confundir la periodicidad del evento con el tiempo total transcurrido. **Cómo corregirlo:** Si se duplica cada 3 horas, en 12 horas **han pasado 4 períodos ($12/3 = 4$)**, no 12.
ejemplos:
  - titulo: 'Elección para arriendo con ajuste de UF fija'
    enunciado: 'Un arriendo sube $1\text{ UF}$ fija al inicio de cada año. ¿Qué modelo corresponde?'
    alternativas:
      - 'Modelo aritmético (PA) con $d = 1\text{ UF}$'
      - 'Modelo geométrico (PG) con $r = 1$'
      - 'Modelo exponencial'
    respuesta: 'Modelo aritmético (PA) con $d = 1\text{ UF}$'
    solucion_pasos:
      - '1. La variación es una suma constante fija en UF $\implies$ PA.'
  - titulo: 'Elección para reproducción celular'
    enunciado: 'Una bacteria se divide en dos cada 20 minutos. ¿Qué modelo corresponde?'
    alternativas:
      - 'Modelo geométrico (PG) con $r = 2$'
      - 'Modelo aritmético (PA) con $d = 2$'
      - 'Modelo constante'
    respuesta: 'Modelo geométrico (PG) con $r = 2$'
    solucion_pasos:
      - '1. La bipartición celular es un proceso multiplicativo $\implies$ PG.'
  - titulo: 'Modelo de depreciación'
    enunciado: '¿La pérdida del $10\%$ anual del valor de una maquinaria se modela mediante una PG decreciente con $r = 0,90$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $r = 1 - 0,10 = 0,90$.'
  - titulo: 'Modelo de tarifa plana'
    enunciado: '¿Un cobro de $\$500$ por kilómetro recorrido en taxi corresponde a una PG?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El costo por kilómetro es una adición constante, correspondiente a una PA.'
errores_frecuentes:
  - 'Seleccionar una progresión aritmética para modelar problemas de interés compuesto bancario.'
  - 'Modelar aumentos porcentuales restando o sumando linealmente la tasa como si fuera un término independiente.'
  - 'Confundir el número de horas transcurridas con el número de ciclos de duplicación.'
  - 'Asumir que las depreciaciones contables en porcentaje se pueden resolver con la fórmula de Gauss.'
  - 'Omitir el valor inicial base en la formulación de la función de costo o crecimiento.'
afirmaciones_verdaderas:
  - 'Los fenómenos con adiciones o sustracciones fijas constantes se modelan mediante progresiones aritméticas, mientras que los porcentuales y multiplicativos mediante progresiones geométricas.'
  - 'En problemas donde la periodicidad del evento es mayor a la unidad de tiempo, el número de períodos $t$ es el cociente entre el tiempo total y el intervalo de cada ciclo.'
