procedimiento:
- 'Paso 1: Identifica qué está cambiando en la historia.'
- 'Paso 2: Evalúa si el cambio en el paso 2 depende del tamaño del paso 1 (Ej: ganar el 10%
  de 100 no es lo mismo que el 10% de 1000). Si depende del tamaño previo, es Geométrico.'
- 'Paso 3: Si el cambio siempre es el mismo número rígido (Ej: ganar siempre $1000), es Aritmético.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en elección entre modelo aritmético y geométrico según el contexto.
ejemplos:
- titulo: Eligiendo el plan de celular
  enunciado: 'Plan A: Pagas $10.000 más $50 por cada minuto. Plan B: El primer minuto cuesta
    $10 y cada minuto extra cuesta el doble del anterior. ¿Qué modelos son?'
  solucion_pasos:
  - 'Plan A: Suma $50 por unidad. Es Aditivo -> Modelo Aritmético.'
  - 'Plan B: Multiplica por 2 por unidad (''el doble''). Es Multiplicativo -> Modelo Geométrico.'
  - Si hablas 10 minutos, el Plan B te arruinará exponencialmente.
- titulo: Ejemplo 1
  enunciado: Un plan de ahorro suma siempre 15.000 pesos cada mes. ¿Qué modelo corresponde?
  alternativas:
  - Aritmético
  - Geométrico
  - Ninguno de los dos
  respuesta: Aritmético
  solucion_pasos:
  - La cantidad que se suma es fija en cada periodo, sin depender del monto acumulado.
- titulo: Ejemplo 2
  enunciado: Una plaga de insectos se triplica cada semana. ¿Qué modelo corresponde?
  alternativas:
  - Geométrico
  - Aritmético
  - Ninguno de los dos
  respuesta: Geométrico
  solucion_pasos:
  - El crecimiento es un múltiplo del valor anterior, no una cantidad fija.
- titulo: ¿Una progresión geométrica con razón mayor a 1 siempre termina superando a una aritmética,
    dado suficiente tiempo?
  respuesta: Sí
  solucion_pasos:
  - El crecimiento exponencial supera al crecimiento lineal a largo plazo, sin importar la
    ventaja inicial de la aritmética.
- titulo: ¿Elegir el modelo correcto depende solo del tamaño de los números del problema?
  respuesta: 'No'
  solucion_pasos:
  - Depende de cómo cambia la cantidad de un periodo a otro, no de si los números son grandes
    o pequeños.
errores_frecuentes:
- 'Elegir el modelo basándose en los números iniciales (Ej: si los números son grandes, creer
  que es geométrica).'
- Olvidar que el 'interés simple' es Aritmético, mientras que el 'interés compuesto' es Geométrico.
- Elegir el modelo basándose en qué opción parece más conveniente al principio, en vez de
  en cómo cambia matemáticamente.
- Confundir interés simple con interés compuesto al elegir el modelo correspondiente.
- No leer con cuidado si el cambio se describe como una cantidad fija o como un porcentaje
  del total acumulado.
afirmaciones_verdaderas:
- La formulación de elección entre modelo aritmético y geométrico según el contexto mantiene
  la regularidad de la sucesión.
- Cuando el cambio de un periodo a otro depende del monto acumulado, corresponde elegir el
  modelo geométrico en vez del aritmético.
al_terminar_debes_poder: Resolver problemas prácticos utilizando elección entre modelo aritmético
  y geométrico según el contexto.
