resumen_inicial: La elección entre el modelo aritmético y el modelo geométrico analiza
  si la tasa del problema contextual responde a aumentos absolutos fijos (modelo P.A.)
  o a variaciones porcentuales/proporcionales compuestas (modelo P.G.).
explicacion_simple: 'Para elegir qué fórmula usar en un problema de la vida real,
  preguntamos: ¿la situación agrega una cantidad fija fija de objetos o dinero (usamos
  P.A.), o la cantidad se duplica/triplica/crece un porcentaje fijo (usamos P.G.)?'
explicacion_formal: "Para un enunciado contextual con variable $Y(t)$, el **Criterio\
  \ de Selección de Modelo** establece:\n\n1. **Selección Aritmética ($Y(t) = a_1\
  \ + (t-1)d$):**\n   - Cuando el texto señala 'aumenta/disminuye $d$ unidades fijas\
  \ por período'.\n2. **Selección Geométrica ($Y(t) = a_1 \\cdot r^{t-1}$):**\n  \
  \ - Cuando el texto señala 'se duplica/triplica por período' o 'varía un $P\\%$\
  \ constante'."
definiciones_clave: '- **Elección de modelo**: Decisión entre P.A. y P.G. basada en
  si la tasa contextual es fija absoluta o proporcional.'
propiedades_relaciones: '- **Discriminante contextual**: Cantidad fija $\implies$
  P.A.; Porcentaje/Factor $\implies$ P.G.'
ejemplo_guiado:
  enunciado: Un estanque pierde $20\text{ litros}$ cada día y un cultivo de levaduras
    se triplica cada día. Determine qué modelo corresponde a cada situación.
  pasos:
  - 'Paso 1: Estanque pierde $20\text{ litros}$ fijos diarios $\implies$ Tasa absoluta
    constante $\implies$ Modelo de Progresión Aritmética ($d = -20$).'
  - 'Paso 2: Cultivo se triplica diariamente $\implies$ Factor multiplicativo constante
    $\implies$ Modelo de Progresión Geométrica ($r = 3$).'
  - 'Conclusión: Estanque = Modelo Aritmético; Cultivo = Modelo Geométrico.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuándo se debe elegir un modelo de progresión geométrica en lugar de
    un modelo aritmético?
  choices:
  - text: Cuando la cantidad varía mediante un factor multiplicativo o porcentaje
      constante por período
    is_correct: true
  - text: Cuando la cantidad aumenta en un monto fijo constante
    is_correct: false
  - text: Cuando no hay cambios en la variable
    is_correct: false
  - text: Cuando el tiempo es negativo
    is_correct: false
  explanation: La alternativa correcta es 'Cuando la cantidad varía mediante un factor
    multiplicativo o porcentaje constante por período'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el cultivo de levaduras que se triplica cada
    día, ¿qué modelo se seleccionó?
  choices:
  - text: Modelo de Progresión Geométrica con r = 3
    is_correct: true
  - text: Modelo de Progresión Aritmética con d = 3
    is_correct: false
  - text: Modelo constante
    is_correct: false
  - text: Modelo de interés simple
    is_correct: false
  explanation: La alternativa correcta es 'Modelo de Progresión Geométrica con r =
    3'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de seleccionar entre el modelo aritmético
  y el geométrico interpretando la clave del enunciado.
semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.ELECCION_MODELO
procedimiento:
- 'Paso 1: Analizar la dinámica de cambio de la sucesión (aditiva vs multiplicativa).'
- 'Paso 2: Formular las ecuaciones de P.A. ($a_n = a_1 + (n-1)d$) o P.G. ($b_n = b_1
  \cdot r^{n-1}$) según corresponda.'
- 'Paso 3: Resolver numéricamente los parámetros despejados o interpolados y verificar
  la consistencia.'
errores_correccion: '- **Error 1: Dividir entre $m$ en lugar de $(m+1)$ al calcular
  la diferencia o razón de interpolación.** **Cómo corregirlo:** Para insertar $m$
  medios intermedios, la distancia se divide en $(m+1)$ intervalos.


  - **Error 2: Usar un modelo aritmético para un problema con crecimiento de tasa
  porcentual constante.** **Cómo corregirlo:** Las tasas de variación porcentual constante
  DEBEN modelarse obligatoriamente con progresiones geométricas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROGRESIONES_COMPARACION.ELECCION_MODELO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del modelo de progresiones.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia o razón de interpolación.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por interpolación.
- titulo: ¿Dividen m medios de interpolación el intervalo en m + 1 partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $m$ términos intermedios generan $m+1$ saltos.
- titulo: ¿Supera el modelo geométrico al aritmético en el largo plazo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la dominancia del crecimiento exponencial sobre el lineal.
errores_frecuentes:
- Dividir el intervalo entre m en lugar de (m + 1) al calcular la diferencia de interpolación
  de m medios.
- Modelar un incremento porcentual constante utilizando una progresión aritmética
  de suma fija.
- Declarar la razón multiplicativa r con la diferencia aditiva d al formular el término
  general.
- Declarar que la interpolación de medios geométricos exige que los extremos tengan
  signos opuestos.
- Restar los extremos en lugar de dividirlos al calcular la razón de interpolación
  geométrica.
afirmaciones_verdaderas:
- La progresión aritmética modela cambios aditivos constantes y la geométrica modela
  cambios multiplicativos constantes.
- Para interpolar $m$ medios entre $A$ y $B$, se divide el intervalo entre $(m+1)$
  saltos.
