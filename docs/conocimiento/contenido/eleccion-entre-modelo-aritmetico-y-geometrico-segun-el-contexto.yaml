semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.ELECCION_MODELO
resumen_inicial: 'La elección entre un modelo aritmético y uno geométrico selecciona la estructura matemática adecuada según las pistas verbales del problema: variación fija por adición (P.A.) o variación proporcional por multiplicación/porcentaje (P.G.).'
explicacion_simple: |
  Frente a un problema escrito de matemáticas, para **decidir qué modelo usar**:
  - **Usas el Modelo Aritmético (P.A.)** si el enunciado utiliza frases como:
    - *"aumenta en $\$5.000$ cada mes"*
    - *"se agregan $3$ objetos por etapa"*
    - *"disminuye $2$ kg por semana"*
    (Pistas de suma o resta fija de una cantidad absoluta).
  - **Usas el Modelo Geométrico (P.G.)** si el enunciado utiliza frases como:
    - *"aumenta un $15\%$ cada año"*
    - *"se duplica / se triplica en cada ciclo"*
    - *"se reduce a la mitad en cada hora"*
    (Pistas de multiplicación o porcentaje sobre la cantidad acumulada).
explicacion_formal: |
  ### Criterio de Selección de Modelos

  ```
                        ¿Cómo cambia la cantidad en cada etapa?
                                      |
               +----------------------+----------------------+
               |                                             |
     Monto constante ($+d$)                        Tasa / Porcentaje / Factor ($\cdot r$)
               |                                             |
               v                                             v
     Modelo Aritmético (P.A.)                     Modelo Geométrico (P.G.)
     $a_n = a_1 + (n-1)d$                         $b_n = b_1 \cdot r^{n-1}$
  ```

  ### Matriz de Decisión Contextual

  | Contexto de Aplicación | Modelo Aritmético (P.A.) | Modelo Geométrico (P.G.) |
  | :--- | :--- | :--- |
  | **Finanzas** | Interés simple ($I = C \cdot i \cdot t$) | Interés compuesto ($M = C(1+i)^t$) |
  | **Física / Mecánica** | Velocidad constante en movimiento rectilíneo | Desintegración radiactiva / Rebotar de pelotas |
  | **Demografía / Biología** | Inmigración fija de personas por año | Crecimiento poblacional no acotado |
  | **Producción Industrial** | Cuota fija diaria de unidades fabricadas | Crecimiento de eficiencia porcentual acumulada |

  ### Síntesis didáctica
  - "Sumar / Restar monto fijo" $\implies$ P.A. ($a_n = a_1 + (n-1)d$).
  - "Multiplicar / Porcentaje / Fracción" $\implies$ P.G. ($b_n = b_1 \cdot r^{n-1}$).
definiciones_clave: |
  - **Modelo Aritmético**: Representación matemática basada en la adición discreta de una constante fija.
  - **Modelo Geométrico**: Representación matemática basada en el producto discreto de una razón o factor.
  - **Pistas contextuales**: Palabras clave del enunciado que revelan la naturaleza aditiva o multiplicativa del cambio.
propiedades_relaciones: |
  - **Sensibilidad al estado previo**: En el modelo aritmético el incremento no depende del estado actual $a_n$; en el modelo geométrico el incremento es directamente proporcional a $b_n$.
  - **Dominio de validez**: Las proyecciones geométricas requieren verificar que la tasa porcentual permanezca constante a lo largo de todo el horizonte de tiempo.
ejemplo_guiado:
  enunciado: 'Determina el modelo adecuado (P.A. o P.G.) y calcula la cantidad al cabo de 5 años ($n=5$) para los siguientes dos casos con un valor inicial de $10.000$ unidades: Caso 1: Aumenta $2.000$ unidades por año. Caso 2: Aumenta un $20\%$ por año.'
  pasos:
    - 'Paso 1: Para el Caso 1, la frase "aumenta $2.000$ unidades" indica una suma fija $\implies$ **Modelo Aritmético (P.A.)** con $a_1 = 10.000$ y $d = 2.000$.'
    - 'Paso 2: Evaluamos el Caso 1 para $n=5$: $a_5 = 10.000 + (5-1) \cdot 2.000 = 10.000 + 4 \cdot 2.000 = 18.000$ unidades.'
    - 'Paso 3: Para el Caso 2, la frase "aumenta un 20%" indica un porcentaje $\implies$ **Modelo Geométrico (P.G.)** con $b_1 = 10.000$ y razón $r = 1 + 0,20 = 1,20$.'
    - 'Paso 4: Evaluamos el Caso 2 para $n=5$: $b_5 = 10.000 \cdot (1,20)^{5-1} = 10.000 \cdot (1,20)^4 = 10.000 \cdot 2,0736 = 20.736$ unidades. El Caso 1 da **$18.000$ (P.A.)** y el Caso 2 da **$20.736$ (P.G.)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un problema financiero menciona que una inversión otorga un interés compuesto del $8\%$ anual sobre el saldo acumulado, ¿qué modelo se debe seleccionar?'
    choices:
      - {text: 'Modelo Geométrico (P.G.), porque el interés compuesto aplica un porcentaje multiplicativo constante ($r = 1,08$)', is_correct: true}
      - {text: 'Modelo Aritmético (P.A.), porque la tasa de interés permanece constante', is_correct: false}
      - {text: 'Modelo de serie infinita divergente', is_correct: false}
      - {text: 'Modelo cuadrático de vértice en el origen', is_correct: false}
    explanation: 'La alternativa correcta es ''Modelo Geométrico (P.G.), porque el interés compuesto aplica un porcentaje multiplicativo constante ($r = 1,08$)''. El interés compuesto es multiplicativo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un estanque contiene $500$ litros de agua y pierde $15$ litros cada día por evaporación. ¿Qué modelo describe la cantidad de agua restante?'
    choices:
      - {text: 'Modelo Aritmético (P.A.) con diferencia negativa $d = -15$ litros', is_correct: true}
      - {text: 'Modelo Geométrico (P.G.) con razón $r = 0,15$', is_correct: false}
      - {text: 'Modelo Geométrico (P.G.) con razón $r = -15$', is_correct: false}
      - {text: 'Modelo de serie geométrica infinita convergente', is_correct: false}
    explanation: 'La alternativa correcta es ''Modelo Aritmético (P.A.) con diferencia negativa $d = -15$ litros''. Resta una cantidad fija de 15 litros.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer atentamente el enunciado e identificar las palabras clave de cambio.'
  - 'Paso 2: Si el cambio menciona "sumar/restar cantidad fija $d$", seleccionar el Modelo Aritmético ($a_n = a_1 + (n-1)d$).'
  - 'Paso 3: Si el cambio menciona "multiplicar/duplicar/porcentaje $P\%$", seleccionar el Modelo Geométrico ($b_n = b_1 \cdot r^{n-1}$ con $r = 1 \pm P/100$).'
  - 'Paso 4: Sustituir los parámetros en la ecuación elegida para resolver la pregunta del problema.'
errores_correccion: |
  - **Error 1:** Aplicar la fórmula de P.A. a un problema que involucra crecimiento porcentual. **Cómo corregirlo:** Los porcentajes exigen **MODELO GEOMÉTRICO: $b_n = b_1 \cdot (1 \pm P/100)^{n-1}$**.
  - **Error 2:** Multiplicar el número de etapa por la tasa porcentual en vez de elevar a la potencia. **Cómo corregirlo:** En la P.G. el número de etapa figura como **EXPONENTE: $r^{n-1}$**.
ejemplos:
  - titulo: 'Modelo para depósito mensual fijo'
    enunciado: 'Depositar $\$10.000$ cada mes en una cuenta, ¿se modela con una P.A. de $d = \$10.000$?'
    alternativas:
      - 'Sí, es una adición constante de monto fijo'
      - 'No, es una P.G.'
      - 'No, es una serie infinita'
    respuesta: 'Sí, es una adición constante de monto fijo'
    solucion_pasos:
      - '1. Monto fijo adicionado $\implies$ Cambio aditivo.'
      - '2. Corresponde a P.A. de $d = \$10.000$.'
  - titulo: 'Modelo para depreciación porcentual'
    enunciado: 'Un equipo pierde 10% de su valor por año. ¿Se modela con P.G. de $r = 0,90$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Porcentaje constante $\implies$ P.G. de $r = 1 - 0,10 = 0,90$.'
  - titulo: 'Modelo de fotocopias duplicadas'
    enunciado: 'Una máquina duplica la cantidad de copias por minuto. ¿Corresponde a P.G. con $r=2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Duplicar $\implies$ multiplicación por 2 $\implies$ P.G.'
  - titulo: 'Modelo de distancia recorrida a velocidad constante'
    enunciado: 'Un atleta corre 400 metros adicionales cada día. ¿Se modela con P.A.?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Suma 400 metros fijos diarios $\implies$ P.A.'
errores_frecuentes:
  - 'La razón multiplicativa r equivale numéricamente a la diferencia aditiva d al formular el término general.'
  - 'Los problemas de variación porcentual deben resolverse utilizando modelos aritméticos de diferencia constante.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Elegir el modelo basándose únicamente en los números iniciales sin analizar la palabra de cambio.'
  - 'La interpolación de medios geométricos exige que los extremos tengan siempre signos opuestos.'
afirmaciones_verdaderas:
  - 'Un problema contextual se resuelve mediante el modelo aritmético si el cambio es una cantidad fija por adición, y mediante el modelo geométrico si es una variación porcentual o multiplicativa.'
  - 'El interés simple se modela mediante progresiones aritméticas, mientras que el interés compuesto se modela mediante progresiones geométricas.'
al_terminar_debes_poder: 'Seleccionar el modelo aritmético o geométrico adecuado según las palabras clave y el contexto del problema.'
