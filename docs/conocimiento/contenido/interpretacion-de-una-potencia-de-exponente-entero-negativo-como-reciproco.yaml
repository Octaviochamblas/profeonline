semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.EXPONENTE_ENTERO_NEGATIVO
resumen_inicial: La interpretación de una potencia de exponente entero negativo $f(x) = a \cdot x^{-k} = \frac{a}{x^k}$ ($k \in \mathbb{Z}^+, a \neq 0$) establece su equivalencia con el recíproco multiplicativo de la potencia positiva escalado por el coeficiente $a$, restringiendo el dominio a $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.
explicacion_simple: "![La interpretación de una potencia de exponente entero negativo $f(x) = a \\cdot x^{-k} = \\frac{a}{x^k}$ ($k \\in \\mathbb{Z}^+, a \\neq 0$) establece su equivalencia con el recíproco multiplicativo de la potencia positiva escalado por el coeficiente $a$, restringiendo el dominio a $\\operatorname{Dom}(f) = \\mathbb{R} \\setminus \\{0\\}$](/static/img/nodos/interpretacion-de-una-potencia-de-exponente-entero-negativo-como-reciproco-intro.svg)\n\n\nTener un **exponente negativo** NO significa que la función dé resultados negativos; significa que **la $x$ pasa al denominador como una fracción**:\n\n$$x^{-\\mathbf{k}} = \\frac{1}{x^{\\mathbf{k}}} \\quad \\Longleftrightarrow \\quad f(x) = a \\cdot x^{-\\mathbf{k}} = \\mathbf{\\frac{a}{x^k}}$$\n\n- **Ejemplos numéricos:**\n  - $x^{-1} = \\frac{1}{x}$ (el inverso o recíproco de $x$).\n  - $x^{-2} = \\frac{1}{x^2}$ ($2^{-2} = \\frac{1}{4} = 0{,}25$, ¡un número positivo!).\n  - $3x^{-4} = \\frac{3}{x^4}$.\n- **La gran consecuencia:**\
  \ Como la $x$ ahora está abajo dividiendo, **¡el cero $x = 0$ está estrictamente prohibido!**"
explicacion_formal: 'Sea $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$. En el cuerpo algebraico $(\mathbb{R}, +, \cdot)$, para todo elemento invertible $x \in \mathbb{R}^* = \mathbb{R} \setminus \{0\}$, la potencia con exponente entero negativo se define axiomáticamente mediante el inverso multiplicativo:

  $$x^{-k} = (x^{-1})^k = \left(\frac{1}{x}\right)^k = \frac{1}{x^k}$$

  Multiplicando por el factor escalar $a$:

  $$f(x) = a \cdot x^{-k} = a \cdot \frac{1}{x^k} = \frac{a}{x^k}$$


  **Dominio y singularidad en el origen**:

  Dado que $0$ carece de inverso multiplicativo ($0^{-1} = 1/0 \notin \mathbb{R}$), el punto $x = 0$ es un polo de orden $k$, imponiendo $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.'
definiciones_clave: '- **Inverso multiplicativo / Recíproco**: Elemento $x^{-1} = 1/x$ tal que $x \cdot x^{-1} = 1$.

  - **Polo de orden $k$**: Singularidad en $x = 0$ provocada por el término $x^k$ en el denominador.'
propiedades_relaciones: '- **Leyes de exponentes**: $x^{-k} \cdot x^k = x^0 = 1$ para todo $x \neq 0$.

  - **Transformación de operaciones**: Multiplicar por $x^{-k}$ equivale a dividir por $x^k$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación de una potencia de exponente entero negativo $f(x) = a \cdot x^{-k} = \frac{a}{x^k}$ ($k \in \mathbb{Z}^+, a \neq 0$) establece su equivalencia con el recíproco multiplicativo de la potencia positiva escalado por el coeficiente $a$, restringiendo el dominio a $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$](/static/img/nodos/interpretacion-de-una-potencia-de-exponente-entero-negativo-como-reciproco-ejemplos.svg)



    Reescribe como fracción algebraica y evalúa para $x = -2$ y $x = 2$:

    1) $f(x) = 8x^{-3}$

    2) $g(x) = -5x^{-2}$'
  pasos:
  - 'Paso 1: Para $f(x) = 8x^{-3}$:

    - Forma fraccionaria: $f(x) = \frac{8}{x^3}$.

    - $f(2) = \frac{8}{2^3} = \frac{8}{8} = \mathbf{1}$.

    - $f(-2) = \frac{8}{(-2)^3} = \frac{8}{-8} = \mathbf{-1}$.'
  - 'Paso 2: Para $g(x) = -5x^{-2}$:

    - Forma fraccionaria: $g(x) = \frac{-5}{x^2}$.

    - $g(2) = \frac{-5}{2^2} = \mathbf{-\frac{5}{4} = -1{,}25}$.

    - $g(-2) = \frac{-5}{(-2)^2} = \frac{-5}{4} = \mathbf{-\frac{5}{4} = -1{,}25}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a $f(x) = 7x^{-4}$?
  choices:
  - text: f(x) = 7 / x⁴ (con x ≠ 0)
    is_correct: true
  - text: f(x) = -7x⁴
    is_correct: false
  - text: f(x) = 1 / (7x⁴)
    is_correct: false
  - text: f(x) = -28x
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 7 / x⁴ (con x ≠ 0)'. El exponente $-4$ invierte la base $x$ al denominador y conserva el coeficiente 7 en el numerador.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto vale $f(-1)$ para la función $f(x) = 6x^{-2}$?
  choices:
  - text: 6 (porque 6 / (-1)² = 6 / 1 = 6)
    is_correct: true
  - text: '-6'
    is_correct: false
  - text: 1/36
    is_correct: false
  - text: '-12'
    is_correct: false
  explanation: La alternativa correcta es '6 (porque 6 / (-1)² = 6 / 1 = 6)'. Al ser el exponente par negativo, $(-1)^2 = +1$ y $6/1 = 6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la ley de inversión de potencias $x^{-k} = 1 / x^k$.'
- 'Paso 2: Multiplicar por el coeficiente principal $a$ para formular $f(x) = a / x^k$.'
- 'Paso 3: Establecer la restricción de dominio $x \neq 0$ por anulación del denominador.'
- 'Paso 4: Evaluar numéricamente resolviendo primero la potencia del denominador y luego el cociente.'
errores_correccion: '- **Error común:** Creer que $2^{-3} = -6$ o $-8$.

  - **Cómo corregirlo:** El signo menos en el exponente **INVIERTE LA BASE**, no cambia el signo del número: $2^{-3} = \frac{1}{2^3} = \mathbf{\frac{1}{8} = 0{,}125}$.'
ejemplos:
- titulo: 'Ejemplo 1: Conversión directa'
  enunciado: 'Reescribe $f(x) = -3x^{-5}$:'
  alternativas:
  - -3 / x⁵
  - 3 / x⁵
  - -1 / (3x⁵)
  - 15x
  respuesta: -3 / x⁵
  solucion_pasos:
  - 'Paso 1: $-3x^{-5} = \frac{-3}{x^5}$.'
- titulo: 'Ejemplo 2: Coeficiente fraccionario'
  enunciado: 'Reescribe $g(x) = \frac{1}{2}x^{-3}$:'
  alternativas:
  - 1 / (2x³)
  - 2 / x³
  - -2x³
  - 1 / (8x³)
  respuesta: 1 / (2x³)
  solucion_pasos:
  - 'Paso 1: $\frac{1}{2} \cdot \frac{1}{x^3} = \frac{1}{2x^3}$.'
- titulo: 'Ejemplo 3: Evaluación numérica'
  enunciado: Si $h(x) = 16x^{-4}$, ¿cuánto vale $h(2)$?
  alternativas:
  - '1'
  - '16'
  - 1/16
  - '-64'
  respuesta: '1'
  solucion_pasos:
  - 'Paso 1: $h(2) = \frac{16}{2^4} = \frac{16}{16} = 1$.'
- titulo: 'Ejemplo 4: Signo con base negativa e impar'
  enunciado: 'Calcula $f(-3)$ para $f(x) = 27x^{-3}$:'
  alternativas:
  - '-1'
  - '1'
  - '-27'
  - '0'
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: $f(-3) = \frac{27}{(-3)^3} = \frac{27}{-27} = -1$.'
errores_frecuentes:
- Confundir exponentes negativos con números negativos.
- Olvidar que el coeficiente no baja al denominador a menos que esté entre paréntesis.
- Intentar evaluar la función en x = 0.
afirmaciones_verdaderas:
- Toda potencia con exponente entero negativo a · x⁻ᵏ equivale a la fracción a / xᵏ.
- 'El dominio de una función con exponente entero negativo excluye obligatoriamente al cero: ℝ \ {0}.'
al_terminar_debes_poder: '**QUÉ:** Interpretar y convertir potencias de exponente entero negativo en fracciones recíprocas.


  **CÓMO:** Aplicando la ley a x⁻ᵏ = a / xᵏ y estableciendo la restricción de dominio x ≠ 0.


