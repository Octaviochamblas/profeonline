semantic_id: MAT.ALG.ADICION_POL.POLINOMIOS_DESORDENADOS
resumen_inicial: 'Adición de polinomios desordenados: procedimiento y reglas en Adición
  de polinomios.'
explicacion_simple: Un polinomio puede estar 'desordenado', con sus términos escritos
  en cualquier orden. Antes de sumarlos, conviene organizarlos por grado de mayor
  a menor para no cometer errores de columna.
explicacion_formal: '### Definición formal


  El orden facilita la alineación. Sin él, es fácil sumar términos de familias distintas
  por error visual.


  ### Desarrollo didáctico


  Suma: $(3 + x^2 + 5x)$ y $(2x - 1 + x^3)$.


  Ordenamos primero:

  - Primer polinomio: $x^2 + 5x + 3$.

  - Segundo polinomio: $x^3 + 2x - 1$.


  Ahora sumamos:

  $x^3 + x^2 + 7x + 2$.


  (El $x^3$ solo estaba en el segundo, el $x^2$ solo en el primero, $5x + 2x = 7x$,
  $3 + (-1) = 2$.)'
definiciones_clave: '- **Adición de polinomios desordenados**: Operación o propiedad
  fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a adición de polinomios desordenados.'
ejemplo_guiado:
  enunciado: Aplica adición de polinomios desordenados en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de adición de polinomios desordenados.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
