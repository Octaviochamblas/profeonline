semantic_id: MAT.ALG.ADICION_POL.POLINOMIOS_DESORDENADOS
resumen_inicial: La adición de polinomios desordenados consiste en ordenar previamente los términos de cada polinomio en forma decreciente respecto a sus exponentes antes de ejecutar la adición aditiva.
explicacion_simple: "Cuando te entregan polinomios con los términos mezclados o en desorden (ej: $3 + 5x^2 - 2x$):\n- **REGLA DE ORO**: **Ordena los polinomios ANTES de sumar**.\n- **Paso 1: Escribir cada polinomio en orden decreciente** de sus exponentes (del exponente más alto al más bajo y al final los números solos).\n  - $3 + 5x^2 - 2x \\implies \\mathbf{5x^2 - 2x + 3}$.\n- **Paso 2: Sumar** los polinomios ya ordenados usando el método horizontal o vertical.\n- **Ejemplo**: Sumar $(2 - x^2 + 4x)$ con $(3x - 5 + 2x^2)$:\n  - Ordenamos $P(x): -x^2 + 4x + 2$.\n  - Ordenamos $Q(x): 2x^2 + 3x - 5$.\n  - Sumamos por clases de potencia:\n    - Clase $x^2$: $-x^2 + 2x^2 = \\mathbf{x^2}$.\n    - Clase $x$: $4x + 3x = \\mathbf{+7x}$.\n    - Constantes: $+2 - 5 = \\mathbf{-3}$.\n  - Resultado final: **$x^2 + 7x - 3$**.\n\n![Adición de Polinomios Desordenados](/static/img/nodos/adicion-de-polinomios-desordenados-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $P(x) = \sum_{i=1}^m a_{\pi(i)} x^{\pi(i)}$ un polinomio desordenado donde $\pi \in S_m$ representa una permutación no ordenada de los grados. La **estandarización decreciente previa** aplica la función de ordenamiento $\mathrm{Ord}: \mathbb{R}[x] \to \mathbb{R}[x]$ tal que las potencias satisfagan la cadena estricta de desigualdades:


  $$\operatorname{deg}(T_1) > \operatorname{deg}(T_2) > \dots > \operatorname{deg}(T_m)$$


  La adición se define formalmente sobre la composición ordenada:


  $$(P + Q)(x) = \mathrm{Ord}(P)(x) + \mathrm{Ord}(Q)(x)$$


  ### Preservación de la Signatura en la Reorganización

  Al reorganizar las potencias desordenadas, la signatura $\sigma_k = \operatorname{sgn}(a_k)$ ligada al monomio $a_k x^k$ debe ser trasladada de forma estrictamente invariante:


  $$\operatorname{Ord}\left( \sum c_{\pi(i)} x^{\pi(i)} \right) = \sum_{k=n}^0 c_k x^k$$


  ### Síntesis didáctica

  Ordenar decrecientemente los polinomios desordenados antes de sumar es una práctica de rigor algebraico que elimina confusiones de signos y omisiones de términos.

  '
definiciones_clave: '- **Polinomio desordenado**: Expresión donde los monomios constituyentes no siguen una secuencia uniforme de exponentes.

  - **Estandarización decreciente**: Reorganización de los términos de mayor a menor exponente (forma canónica).

  - **Arrastre de signatura ($c_k x^k$)**: Traslado del signo antecedente junto con el coeficiente y la potencia al reordenar.

  '
propiedades_relaciones: '- **Equivalencia algebraica de formas**: Un polinomio desordenado $3 - x + 4x^2$ es numéricamente idéntico a su versión ordenada $4x^2 - x + 3$.

  - **Facilidad de auditoría**: Escribir la suma en orden decreciente facilita la verificación del resultado por parte del docente o auditor.

  '
ejemplo_guiado:
  enunciado: Suma los polinomios desordenados $P = 5 - 3x^3 + 2x$ y $Q = 4x^2 - 1 + 8x^3 - 6x$.
  pasos:
  - 'Paso 1: Reordenamos $P$ en forma decreciente arrastrando sus signos: $-3x^3 + 2x + 5$.'
  - 'Paso 2: Reordenamos $Q$ en forma decreciente arrastrando sus signos: $8x^3 + 4x^2 - 6x - 1$.'
  - 'Paso 3: Unimos en adición horizontal por clases: $$(-3x^3 + 2x + 5) + (8x^3 + 4x^2 - 6x - 1)$$'
  - 'Paso 4: Reducimos la Clase $x^3$: $-3x^3 + 8x^3 = \mathbf{5x^3}$.'
  - 'Paso 5: Reducimos la Clase $x^2$: $\mathbf{+4x^2}$.'
  - 'Paso 6: Reducimos la Clase $x$: $+2x - 6x = \mathbf{-4x}$.'
  - 'Paso 7: Reducimos las Constantes: $+5 - 1 = \mathbf{+4}$.'
  - 'Conclusión: El polinomio suma ordenado es **$5x^3 + 4x^2 - 4x + 4$**.'
  imagen: /static/img/nodos/adicion-de-polinomios-desordenados-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es fundamental ordenar los polinomios de forma decreciente antes de proceder a su adición?
  choices:
  - text: Porque facilita la alineación de términos semejantes y evita la omisión o mezcla errónea de potencias distintas
    is_correct: true
  - text: Porque si no se ordenan, el resultado de la suma cambia de valor numérico
    is_correct: false
  - text: Porque al ordenar se eliminan los signos negativos
    is_correct: false
  - text: Porque se deben multiplicar los coeficientes
    is_correct: false
  explanation: La alternativa correcta es 'Porque facilita la alineación de términos semejantes y evita la omisión o mezcla errónea de potencias distintas'. Estandarización decreciente previa.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo queda ordenado decrecientemente el polinomio $7 - x^2 + 5x$?
  choices:
  - text: Queda ordenado como $-x^2 + 5x + 7$
    is_correct: true
  - text: Queda ordenado como $x^2 + 5x - 7$
    is_correct: false
  - text: Queda ordenado como $7 + 5x - x^2$
    is_correct: false
  - text: Queda ordenado como $-5x^2 + x + 7$
    is_correct: false
  explanation: La alternativa correcta es 'Queda ordenado como $-x^2 + 5x + 7$'. Orden decreciente de exponentes $2, 1, 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el mayor exponente presente en ambos polinomios.'
- 'Paso 2: Escribir cada polinomio en orden decreciente de potencias conservando el signo antecedente de cada término.'
- 'Paso 3: Aplicar el método de adición horizontal o vertical sobre los polinomios reordenados.'
- 'Paso 4: Reducir los términos semejantes y presentar la respuesta en forma canónica ordenada.'
errores_correccion: '- **Error 1:** Dejar atrás el signo negativo al cambiar de posición un término desordenado (escribir $4 - x^2$ como $x^2 + 4$). **Cómo corregirlo:** El signo menos **PERTENECE AL TÉRMINO QUE LE SIGUE ($-x^2 + 4$)**.

  - **Error 2:** Sumar términos que quedaron contiguos por desorden pero que tienen distinto grado. **Cómo corregirlo:** Se debe **REORDENAR PRIMERO CADA POLINOMIO** para no mezclar grados distintos.

  '
ejemplos:
- titulo: Ordenamiento decreciente simple
  enunciado: ¿Cuál es la forma ordenada de $9 - 2x + 4x^2$?
  alternativas:
  - $4x^2 - 2x + 9$
  - $-2x + 4x^2 + 9$
  - $4x^2 + 2x - 9$
  respuesta: $4x^2 - 2x + 9$
  solucion_pasos:
  - '1. Mayor grado: $4x^2$.'
  - '2. Grado 1: $-2x$.'
  - '3. Constante: $+9$.'
  - '4. Resultado: $4x^2 - 2x + 9$.'
- titulo: Suma de desordenados
  enunciado: ¿Cuál es la suma de $(3 + x) + (2x - 5)$?
  alternativas:
  - $3x - 2$
  - $3x + 8$
  - $2x - 2$
  respuesta: $3x - 2$
  solucion_pasos:
  - '1. Ordenado: $(x + 3) + (2x - 5)$.'
  - '2. Reducción: $3x - 2$.'
- titulo: Conservación del polinomio cero
  enunciado: Al reordenar $0 - 5x + 3x^2$, ¿obtenemos $3x^2 - 5x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cero constante se puede omitir al final.
- titulo: Invarianza del valor
  enunciado: ¿Posee el polinomio ordenado $-x^3 + 4$ el mismo valor numérico que el desordenado $4 - x^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la conmutatividad aditiva preserva el valor numérico.
errores_frecuentes:
- El signo negativo no se traslada junto al término al reorganizar el polinomio en forma decreciente.
- Sumar directamente monomios contiguos sin verificar si tienen el mismo exponente por estar desordenados.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Cambiar el signo de los términos al moverlos de lugar dentro del mismo polinomio.
- Presentar el polinomio resultante en forma desordenada dificultando su lectura.
afirmaciones_verdaderas:
- La adición de polinomios desordenados exige reordenar previamente los términos de mayor a menor exponente.
- Al mover un término para reordenarlo se debe arrastrar obligatoriamente el signo antecedente que le pertenece.
al_terminar_debes_poder: '![Resumen de adición de polinomios desordenados](/static/img/nodos/adicion-de-polinomios-desordenados-resumen.svg)


  QUÉ: Sumar polinomios cuyos términos se presentan en un orden arbitrario o no estructurado.


  CÓMO: Reordenar previamente cada polinomio en orden canónico descendente preservando el signo de cada monomio, para luego alinear y reducir.'
