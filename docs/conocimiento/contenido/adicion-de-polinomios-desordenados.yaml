  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reescribe cada polinomio con sus términos ordenados de mayor a menor grado.'
- 'Paso 2: Completa los términos faltantes con coeficiente 0.'
- 'Paso 3: Aplica el método horizontal o vertical normalmente.'
- 'Paso 4: Verifica que el resultado también esté ordenado.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en adición de polinomios desordenados.
ejemplos:
- titulo: Ordenar para ganar
  enunciado: 'Suma: (4 - 2a + a^3) y (a^2 + 3 - a).'
  solucion_pasos:
  - 'Orden 1: a^3 + 0a^2 - 2a + 4.'
  - 'Orden 2: 0a^3 + a^2 - a + 3.'
  - 'Suma: a^3 + a^2 - 3a + 7.'
- titulo: 'Dos físicos modelan la posición de un objeto: el primero la expresa como
    $3 + 2t^2 - t$ y el'
  enunciado: 'Dos físicos modelan la posición de un objeto: el primero la expresa
    como $3 + 2t^2 - t$ y el segundo como $5t - t^3 + 1$. ¿Cuál es la posición combinada
    total correctamente ordenada? (v1)


    Opciones: A) $-t^3 + 2t^2 + 4t + 4$ · B) $-t^3 - 2t^2 + 4t + 4$ · C) $t^3 + 2t^2
    + 4t + 4$ · D) $-t^3 + 2t^2 - 4t + 4$'
  solucion_pasos:
  - 'Ordenamos: $(2t^2-t+3)$ y $(-t^3+5t+1)$. Suma: $-t^3+2t^2+(-1+5)t+(3+1)=-t^3+2t^2+4t+4$.'
  - 'Respuesta: $-t^3 + 2t^2 + 4t + 4$'
- titulo: 'Respecto de «Adición de polinomios desordenados»: ¿Es correcta esta caracterización?
    «Al sum'
  enunciado: 'Respecto de «Adición de polinomios desordenados»: ¿Es correcta esta
    caracterización? «Al sumar **Polinomios Desordenados**, el primer paso es reorganizar
    cada polinomio en orden decreciente de grado»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al sumar **Polinomios Desordenados**,
    el primer paso es reorganizar cada polinomio en orden decreciente de grado.'
- titulo: 'Respecto de «Adición de polinomios desordenados»: ¿Es válida esta afirmación?
    «Sumar los pol'
  enunciado: 'Respecto de «Adición de polinomios desordenados»: ¿Es válida esta afirmación?
    «Sumar los polinomios sin ordenar, mezclando términos de distintas familias por
    estar visualmente adyacentes»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al sumar **Polinomios Desordenados**,
    el primer paso es reorganizar cada polinomio en orden decreciente de grado.'
errores_frecuentes:
- Sumar los polinomios sin ordenar, mezclando términos de distintas familias por estar
  visualmente adyacentes.
- Ordenar un polinomio pero no el otro, creando desalineación en el método vertical.
- Para «¿Por qué se recomienda ordenar los polinomios de mayor a menor grado antes
  de sumarlos? (v1)», la respuesta correcta es Porque los polinomios desordenados
  no pueden ser sumados.
- Para «¿Por qué se recomienda ordenar los polinomios de mayor a menor grado antes
  de sumarlos? (v1)», la respuesta correcta es Para que el resultado siempre sea positivo.
- Para «¿Por qué se recomienda ordenar los polinomios de mayor a menor grado antes
  de sumarlos? (v1)», la respuesta correcta es Para multiplicar antes de sumar.
afirmaciones_verdaderas:
- La reducción en adición de polinomios desordenados conserva los exponentes de la
  parte literal.
al_terminar_debes_ponder: Operar y reducir expresiones algebraicas utilizando adición
  de polinomios desordenados.
fuente: Álgebra de Baldor.
