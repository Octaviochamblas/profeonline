semantic_id: MAT.GEO.ESPACIO_FUNDAMENTOS.PUNTO_ESPACIO
resumen_inicial: 'Concepto de punto en el espacio: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Al pasar de la geometría plana a la geometría del espacio, el
  punto sigue siendo el elemento más básico, pero ahora se ubica en tres dimensiones
  en vez de dos.
explicacion_formal: '![Punto en el espacio](/static/img/geometria/espacio-cuerpos/espacio-punto.svg)


  ### Definición formal


  Un punto en el espacio es un ente geométrico adimensional (no tiene longitud, ancho
  ni alto) que representa una posición específica dentro del espacio tridimensional.
  Se denota habitualmente con una letra mayúscula.


  ### Desarrollo didáctico


  En la figura, el punto $P$ está ubicado en uno de los vértices de un cuerpo geométrico
  (un prisma), lo que permite visualizar cómo un punto se sitúa dentro del espacio
  tridimensional, a diferencia de la geometría plana donde solo se necesitan dos coordenadas.'
definiciones_clave: '- **Concepto de punto en el espacio**: Elemento o propiedad fundamental
  en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de punto en el espacio.'
