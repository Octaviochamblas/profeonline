procedimiento:
- 'Paso 1: Reconoce que un punto no tiene dimensiones (no tiene longitud, ancho ni
  alto).'
- 'Paso 2: Identifica que, en el espacio, un punto requiere tres coordenadas (o una
  posición tridimensional) para ubicarse, a diferencia del plano que requiere solo
  dos.'
- 'Paso 3: Denota el punto con una letra mayúscula para referirte a él en problemas
  geométricos.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de punto en el espacio.
