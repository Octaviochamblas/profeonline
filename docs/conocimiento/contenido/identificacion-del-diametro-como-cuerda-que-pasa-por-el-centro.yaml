semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.DIAMETRO
resumen_inicial: El diámetro es la cuerda de mayor longitud de una circunferencia y se caracteriza por pasar estrictamente por el centro.
explicacion_simple: 'El **diámetro** es la cuerda ''reina'' de la circunferencia: cruza de lado a lado por la parte más ancha y **pasa obligatoriamente por el centro**.


  Como pasa por el centro $O$, está formado por dos radios alineados espalda con espalda, por lo que **mide exactamente el doble del radio ($d = 2r$)**. Además, el diámetro tiene un superpoder geométrico: actúa como una línea de corte simétrica perfecta que divide a la circunferencia en dos mitades idénticas (dos semicircunferencias). Si inscribes un triángulo en una circunferencia usando un diámetro como base, el ángulo de la esquina opuesta será **siempre de $90^\circ$** (Teorema de Tales).


  ![Identificación del diámetro](/static/img/nodos/identificacion-del-diametro-como-cuerda-que-pasa-por-el-centro-intro.svg)

  '
explicacion_formal: '### Definición formal de diámetro

  Sea $\mathcal{C}$ una circunferencia de centro $O$ y radio $r$. Se define un **diámetro** como toda cuerda $\overline{AB}$ que contiene al centro $O$:

  $$\overline{AB} \text{ es diámetro} \iff A, B \in \mathcal{C} \quad \wedge \quad O \in \overline{AB}$$


  ### Teorema de la cuerda máxima

  En toda circunferencia, el diámetro es la cuerda de longitud máxima. Para cualquier cuerda $\overline{CD}$:

  $$\text{long}(CD) \le \text{long}(AB) = 2r$$

  *Demostración:* Por la desigualdad triangular en el triángulo $\triangle OCD$: $CD \le OC + OD = r + r = 2r$. La igualdad se cumple si y solo si $O$ es colineal con $C$ y $D$, lo que define al diámetro.


  ### Teorema de Tales (Ángulo recto inscrito)

  Todo ángulo inscrito en una circunferencia que subtiende un diámetro mide exactamente un ángulo recto ($90^\circ$):

  $$\overline{AB} = \text{Diámetro} \ \wedge \ C \in \mathcal{C} \ (C \neq A, B) \implies \angle ACB = 90^\circ$$


  > **Complemento didáctico:** El Teorema de Tales es una de las herramientas más poderosas de la PAES: en cuanto veas que un lado de un triángulo inscrito pasa por el centro (es diámetro), marca inmediatamente un ángulo recto de $90^\circ$ en el vértice de enfrente. ¡Ese triángulo es rectángulo y puedes usar Pitágoras al instante!

  '
definiciones_clave: '- **Diámetro ($d$)**: Cuerda de longitud máxima que pasa por el centro de la circunferencia.

  - **Cuerda máxima**: Propiedad extremal que garantiza que ninguna cuerda puede superar la medida $2r$.

  - **Eje de simetría diametral**: Toda recta que contiene a un diámetro es un eje de simetría axial reflexiva.

  '
propiedades_relaciones: '- **Bisección de la figura**: Divide a la circunferencia en dos semicircunferencias de $180^\circ$ y al círculo en dos semicírculos de área $\frac{\pi r^2}{2}$.

  - **Haces de diámetros**: Dos diámetros cualesquiera se cortan obligatoriamente en el centro $O$, dimidiándose mutuamente.

  - **Ortogonalidad diametral**: Dos diámetros perpendiculares dividen a la circunferencia en cuatro cuadrantes congruentes de $90^\circ$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de diámetro](/static/img/nodos/identificacion-del-diametro-como-cuerda-que-pasa-por-el-centro-ejemplos.svg)


    Un triángulo $\triangle ABC$ está inscrito en una circunferencia de modo que el lado $\overline{AB}$ es un diámetro. Si los catetos miden $AC = 12\text{ cm}$ y $BC = 16\text{ cm}$, calcula la longitud del diámetro $\overline{AB}$ y el radio $r$ de la circunferencia.'
  pasos:
  - 'Paso 1: Aplicar el Teorema de Tales: Al estar apoyado sobre el diámetro, el ángulo en el vértice opuesto es recto: $\angle C = 90^\circ$.'
  - 'Paso 2: Reconocer que $\triangle ABC$ es rectángulo con hipotenusa igual al diámetro $AB$.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras: $AB^2 = AC^2 + BC^2 = 12^2 + 16^2 = 144 + 256 = 400$.'
  - 'Paso 4: Despejar el diámetro y el radio: $d = AB = \sqrt{400} = 20\text{ cm}$, y por lo tanto $r = \frac{d}{2} = \frac{20}{2} = 10\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la característica geométrica distintiva del diámetro con respecto a las demás cuerdas?
  choices:
  - text: Es la cuerda de longitud máxima y pasa estrictamente por el centro.
    is_correct: true
  - text: Une dos puntos cualquiera sin tocar jamás el centro.
    is_correct: false
  - text: Tiene la misma longitud que el radio de la figura.
    is_correct: false
  - text: Es perpendicular a todos los radios que la intersecan.
    is_correct: false
  explanation: La alternativa correcta es 'Es la cuerda de longitud máxima y pasa estrictamente por el centro.' El diámetro cumple $d = 2r$ conteniendo al centro $O$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una circunferencia, un triángulo inscrito tiene como uno de sus lados un diámetro. ¿Cuánto mide el ángulo opuesto a dicho lado?
  choices:
  - text: 90°.
    is_correct: true
  - text: 60°.
    is_correct: false
  - text: 45°.
    is_correct: false
  - text: 180°.
    is_correct: false
  explanation: La alternativa correcta es '90°.' Por el Teorema de Tales, todo ángulo inscrito que subtiende un diámetro mide $180^\circ / 2 = 90^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si la cuerda en cuestión pasa por el centro $O$.

  2. Establecer la relación métrica $d = 2r$.

  3. Si un triángulo inscrito tiene un diámetro por lado, asignar inmediatamente $90^\circ$ al ángulo opuesto.

  4. Utilizar el Teorema de Pitágoras con el diámetro como hipotenusa para despejar catetos o radios.

  '
errores_correccion: '- **Error común 1:** Creer que cualquier cuerda larga es un diámetro. **Corrección:** Para ser diámetro DEBE pasar estrictamente por el centro.

  - **Error común 2:** Olvidar que el ángulo inscrito apoyado en un diámetro es recto. **Corrección:** El arco que subtiende es de $180^\circ$, por lo que el ángulo inscrito es siempre $90^\circ$.

  '
ejemplos:
- tipo: A
  titulo: Diámetro desde el perímetro
  enunciado: Si una circunferencia tiene una longitud de $18\pi\text{ cm}$, ¿cuánto mide su diámetro?
  alternativas:
  - text: $18\text{ cm}$.
    is_correct: true
  - text: $9\text{ cm}$.
    is_correct: false
  - text: $36\text{ cm}$.
    is_correct: false
  - text: $9\pi\text{ cm}$.
    is_correct: false
  explicacion: Como $P = \pi d$, entonces $18\pi = \pi d \implies d = 18\text{ cm}$.
- tipo: B
  titulo: Cuerda y paso por el centro
  enunciado: ¿Es todo diámetro de una circunferencia también una cuerda?
  respuesta: Sí
  explicacion: Sí. El diámetro une dos puntos de la circunferencia, por lo que es una cuerda (específicamente, la cuerda máxima).
errores_frecuentes:
- '''Confundir el diámetro ($2r$) con el radio ($r$).'''
- '''Olvidar que un triángulo apoyado en el diámetro es rectángulo.'''
- '''Creer que las cuerdas que no pasan por el centro pueden medir más que el diámetro.'''
afirmaciones_verdaderas:
- '''El diámetro es la cuerda que pasa por el centro de la circunferencia.'''
- '''La longitud del diámetro es el doble de la longitud del radio ($d = 2r$).'''
- '''Todo triángulo inscrito en una circunferencia que tenga un diámetro por lado es rectángulo.'''
al_terminar_debes_poder: '**QUÉ:** Identificar el diámetro como cuerda máxima y aplicar el Teorema de Tales en triángulos inscritos.


  **CÓMO:** Utilizando las relaciones $d = 2r$ y $\angle ACB = 90^\circ$.


  ![Síntesis de diámetro](/static/img/nodos/identificacion-del-diametro-como-cuerda-que-pasa-por-el-centro-resumen.svg)

  '
