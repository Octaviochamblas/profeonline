semantic_id: MAT.ALG.FUNCION_REPRESENTACION.RECORRIDO_DESDE_GRAFICO
resumen_inicial: Determinar el recorrido desde un gráfico consiste en leer la extensión
  vertical de alturas que abarca la curva sobre el eje $Y$.
explicacion_simple: 'Para hallar el **recorrido desde una gráfica**:

  1. Miramos el gráfico de abajo hacia arriba sobre el eje vertical $Y$.

  2. Ubicamos el punto más bajo de la curva (altura mínima) y el punto más alto (altura
  máxima).

  3. Leemos el rango de alturas en el eje $Y$.

  Ese intervalo de valores verticales es el recorrido $\operatorname{Rec}(f)$.'
explicacion_formal: 'Dada la gráfica $G(f) \subset \mathbb{R}^2$, el **recorrido gráfico**
  es la proyección ortogonal sobre la segunda coordenada:


  $$\operatorname{Rec}(f) = \pi_y(G(f)) = \{y \in \mathbb{R} \mid \exists x \in \operatorname{Dom}(f)
  \text{ tal que } (x, y) \in G(f)\}$$


  **Desglose de la fórmula:**

  - Intervalo real obtenido al aplastar la curva horizontalmente sobre el eje de ordenadas
  $Y$.'
definiciones_clave: '- **Recorrido gráfico**: Extensión o altura del trazo continuo
  de la función a lo largo del eje $Y$.'
propiedades_relaciones: '- **Límites de altura**: El mínimo local/absoluto y el máximo
  local/absoluto fijan los extremos del intervalo recorrido.'
ejemplo_guiado:
  enunciado: Un gráfico de una parábola tiene su punto más bajo (vértice) en $(2,
    -1)$ e incluye una curva que se extiende infinitamente hacia arriba. Determina
    su recorrido.
  pasos:
  - 'Paso 1: Ubicar la altura mínima sobre el eje $Y$: el valor más bajo es $y = -1$
    (punto cerrado $\implies [-1$).Paso 2: Observar el crecimiento superior: las ramas
    suben sin límite hacia $+\infty$.Paso 3: Proyectar la franja vertical desde $-1$
    hasta $+\infty$.Paso 4: Escribir el recorrido como intervalo: $\operatorname{Rec}(f)
    = [-1, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: A partir del gráfico de la parábola con punto más bajo en $(2, -1)$ que
    sube infinitamente, ¿cuál es su recorrido?
  choices:
  - text: $\operatorname{Rec}(f) = [-1, +\infty[$
    is_correct: true
  - text: $\operatorname{Rec}(f) = [2, +\infty[$
    is_correct: false
  - text: $\operatorname{Rec}(f) = ]-\infty, -1]$
    is_correct: false
  - text: $\operatorname{Rec}(f) = \mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Rec}(f) = [-1, +\infty[$'.
    (Se lee en el eje Y desde la altura mínima -1 hacia arriba).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Sobre qué eje del plano cartesiano se mide el recorrido al analizar un
    gráfico?
  choices:
  - text: Sobre el eje vertical $Y$ (ordenadas).
    is_correct: true
  - text: Sobre el eje horizontal $X$ (abscisas).
    is_correct: false
  - text: En el centro del primer cuadrante.
    is_correct: false
  - text: En el origen $(0,0)$.
    is_correct: false
  explanation: La alternativa correcta es 'Sobre el eje vertical $Y$ (ordenadas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el punto más bajo (altura mínima) de la gráfica y proyectar
  su coordenada $y_{\min}$ en el eje $Y$.'
- 'Paso 2: Identificar el punto más alto (altura máxima) y proyectar su coordenada
  $y_{\max}$ en el eje $Y$.'
- 'Paso 3: Verificar los puntos bordes (cerrados o abiertos).'
- 'Paso 4: Escribir el intervalo recorrido de abajo hacia arriba $[y_{\min}, y_{\max}]$.'
errores_correccion: '- **Error común:** Tomar la coordenada $x = 2$ del vértice en
  lugar de la coordenada $y = -1$ al definir el mínimo del recorrido.

  - **Cómo corregirlo:** El recorrido mide ALTURAS, por lo que debes usar la coordenada
  $y$ del punto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
