semantic_id: MAT.ALG.FUNCION_REPRESENTACION.RECORRIDO_DESDE_GRAFICO
resumen_inicial: Determinar el recorrido desde un gráfico consiste en identificar la cobertura vertical de la curva proyectada sobre el eje $Y$.
explicacion_simple: |
  Para hallar el recorrido (rango) desde un gráfico:

  1. Mira la gráfica de abajo hacia arriba.
  2. Encuentra la altura más baja que alcanza la gráfica en el eje $Y$ (mínimo).
  3. Encuentra la altura más alta que alcanza la gráfica en el eje $Y$ (máximo).
  4. Observa si los extremos tienen puntos rellenos (cerrado) o huecos (abierto).
  5. Ese tramo en el eje $Y$ es el recorrido.
explicacion_formal: |
  Sea $G_f$ la gráfica de la función $f$. El **recorrido gráfico** es el conjunto de ordenadas $y \in \mathbb{R}$ alcanzadas por al menos un punto de la gráfica:

  $$\text{Rec}(f) = \{y \in \mathbb{R} \mid \exists x \in \text{Dom}(f), \ (x, y) \in G_f\}$$

  **Desglose visual:**
  - Cota inferior $y_{\min}$: Punto más bajo de la curva proyectado en $Y$.
  - Cota superior $y_{\max}$: Punto más alto de la curva proyectado en $Y$.
definiciones_clave: |
  - **Proyección vertical**: Extensión de la curva proyectada perpendicularmente sobre el eje de las ordenadas ($Y$).
propiedades_relaciones: |
  - **Vértice de una parábola**: En la parábola $f(x) = a(x - h)^2 + k$, si abre hacia arriba ($a > 0$), la ordenada del vértice $k$ fija la cota inferior del recorrido $\text{Rec}(f) = [k, +\infty[$.
ejemplo_guiado:
  enunciado: "El gráfico de una función es una parábola que abre hacia arriba con vértice en el punto $(2, -5)$ y se extiende infinitamente hacia arriba. Determina su recorrido."
  pasos:
    - 'Paso 1: Identificar el punto más bajo en el eje $Y$: la ordenada del vértice es $y = -5$.'
    - 'Paso 2: Como el vértice forma parte de la curva, el número $-5$ se incluye ($[-5$).'
    - 'Paso 3: Identificar la extensión superior: se prolonga sin límite hacia $+\infty$.'
    - 'Paso 4: Concluir que el recorrido es $\text{Rec}(f) = [-5, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Una parábola que abre hacia arriba tiene su vértice en el punto $(2, -5)$. ¿Cuál es su recorrido?"
    choices:
      - {text: "$[-5, +\\infty[$", is_correct: true}
      - {text: "$[2, +\\infty[$", is_correct: false}
      - {text: "$]-\\infty, -5]$", is_correct: false}
      - {text: "$\\mathbb{R}$", is_correct: false}
    explanation: "La alternativa correcta es '$[-5, +\\infty[$'. La menor ordenada alcanzada en el eje $Y$ es $y = -5$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Sobre qué eje del plano cartesiano se lee el recorrido de una función a partir de su gráfica?"
    choices:
      - {text: "En el eje vertical de las ordenadas ($Y$)", is_correct: true}
      - {text: "En el eje horizontal de las abscisas ($X$)", is_correct: false}
      - {text: "En la recta de origen $(0,0)$", is_correct: false}
      - {text: "En la recta bisectriz", is_correct: false}
    explanation: "La alternativa correcta es 'En el eje vertical de las ordenadas ($Y$)'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Examinar la gráfica a lo largo del eje vertical $Y$.'
  - 'Paso 2: Identificar el valor mínimo global alcanzado en el eje $Y$ (límite inferior).'
  - 'Paso 3: Identificar el valor máximo global alcanzado en el eje $Y$ (límite superior).'
  - 'Paso 4: Verificar la inclusión/exclusión de los extremos y redactar el intervalo del recorrido.'
errores_correccion: |
  - **Error común:** Tomar la coordenada $x$ del vértice $(2, -5)$ y decir que el recorrido parte en $2$.
  - **Cómo corregirlo:** El RECORRIDO mide alturas en el eje $Y$, por lo que debes usar siempre la coordenada $y = -5$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El recorrido desde un gráfico se determina proyectando la curva sobre el eje horizontal de las abscisas ($X$).'
  - 'El valor mínimo del recorrido de una parábola orientada hacia arriba $f(x) = x^2 + 3$ es $y = 0$.'
  - 'Si la gráfica presenta un punto máximo en $(2, 7)$, el recorrido se extiende hasta $+\infty$.'
  - 'Los intervalos de monotonía creciente determinan de forma directa los valores del recorrido de una función.'
  - 'Una asíntota horizontal en $y = k$ garantiza que el valor $y = k$ siempre pertenece al recorrido de la función.'
afirmaciones_verdaderas:
  - 'El recorrido de una función representada gráficamente se obtiene proyectando la curva sobre el eje vertical $Y$.'
  - 'El recorrido abarca desde la menor ordenada alcanzada (mínimo global) hasta la mayor ordenada alcanzada (máximo global).'
al_terminar_debes_poder: |
  QUÉ: Determinar el recorrido (conjunto imagen) de una función a partir de su representación gráfica.
  CÓMO: Proyectar la curva sobre el eje $Y$, ubicar las ordenadas mínima y máxima alcanzadas y escribir el intervalo o conjunto resultante.
