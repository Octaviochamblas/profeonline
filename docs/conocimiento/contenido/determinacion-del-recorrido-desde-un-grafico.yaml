semantic_id: MAT.ALG.FUNCION_REPRESENTACION.RECORRIDO_DESDE_GRAFICO
resumen_inicial: 'Determinación del recorrido desde un gráfico: conceptos, representación
  y propiedades en Representación de funciones.'
explicacion_simple: 'Si el dominio es la sombra sobre el suelo, el recorrido es la
  sombra sobre la pared: todas las alturas que la curva efectivamente alcanza.'
explicacion_formal: '### Definición formal


  Dado el gráfico $G_f = \{(x, f(x))\}$ de una función $f$, el recorrido corresponde
  a la proyección ortogonal de $G_f$ sobre el eje $y$: $\text{Rec}(f) = \{y \in \mathbb{R}
  : \exists\, x,\ (x,y) \in G_f\}$.


  ### Desarrollo didáctico


  Visualmente, observa las alturas mínima y máxima que alcanza la curva, prestando
  atención a si esos extremos se incluyen (puntos sólidos) o se excluyen (puntos abiertos),
  y a posibles huecos en el recorrido.


  Si una parábola con vértice en $(2, -5)$ abre hacia arriba y no tiene cota superior,
  el recorrido es $[-5, +\infty[$.'
definiciones_clave: '- **Determinación del recorrido desde un gráfico**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación del recorrido desde un gráfico.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a determinación del
    recorrido desde un gráfico.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a determinación del recorrido desde
    un gráfico.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    determinación del recorrido desde un gráfico?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en representación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en representación de funciones. Es la condición
    de existencia y unicidad en determinación del recorrido desde un gráfico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en determinación del recorrido
    desde un gráfico, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la altura mínima (más baja) alcanzada por la curva.'
- 'Paso 2: Identifica la altura máxima (más alta) alcanzada por la curva.'
- 'Paso 3: Verifica si esos extremos están incluidos (puntos sólidos) o excluidos
  (puntos abiertos).'
- 'Paso 4: Expresa el recorrido como intervalo, considerando también posibles huecos
  intermedios.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar determinación del recorrido desde un gráfico.
ejemplos:
- titulo: Recorrido acotado
  enunciado: Una curva alcanza como máximo $y=6$ (incluido) y como mínimo $y=-2$ (incluido),
    sin interrupciones. Determina el recorrido.
  solucion_pasos:
  - Ambos extremos están incluidos y no hay huecos intermedios.
  - 'Recorrido: $[-2, 6]$.'
- titulo: Recorrido de una parábola hacia arriba
  enunciado: El vértice de una parábola está en $(3, -4)$ y la parábola abre hacia
    arriba sin cota superior. Determina el recorrido.
  solucion_pasos:
  - La altura mínima es $-4$, alcanzada en el vértice.
  - No existe cota superior, pues la parábola crece indefinidamente.
  - 'Recorrido: $[-4, +\infty[$.'
- titulo: ¿El recorrido se obtiene proyectando la curva sobre el eje horizontal?
  enunciado: ¿El recorrido se obtiene proyectando la curva sobre el eje horizontal?
  respuesta: 'No'
  solucion_pasos:
  - Esa proyección da el dominio; el recorrido se obtiene proyectando sobre el eje
    vertical.
- titulo: ¿Un punto abierto en la altura máxima de una curva indica que esa altura
    pertenece al recorrido?
  enunciado: ¿Un punto abierto en la altura máxima de una curva indica que esa altura
    pertenece al recorrido?
  respuesta: 'No'
  solucion_pasos:
  - Un punto abierto marca la exclusión de esa altura específica del recorrido.
errores_frecuentes:
- Proyectar la curva sobre el eje horizontal en vez del vertical, confundiendo recorrido
  con dominio.
- Ignorar que una curva puede tener un salto o hueco en su rango de alturas.
- Suponer que toda curva no acotada tiene recorrido $\mathbb{R}$ completo, sin analizar
  el comportamiento real.
- Confundir el valor máximo o mínimo visible en el recuadro del gráfico con el verdadero
  extremo del recorrido.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando determinación
  del recorrido desde un gráfico.
