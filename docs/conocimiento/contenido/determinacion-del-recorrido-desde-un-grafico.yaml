semantic_id: MAT.ALG.FUNCION_REPRESENTACION.RECORRIDO_DESDE_GRAFICO
resumen_inicial: Determinar el recorrido desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje vertical $Y$.
explicacion_simple: '![Determinar el recorrido desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje vertical $Y$](/static/img/nodos/determinacion-del-recorrido-desde-un-grafico-intro.svg)



  Para encontrar el recorrido a partir de un gráfico:

  1. Miras la curva de **abajo hacia arriba** sobre el **eje vertical $Y$**.

  2. Buscas el **punto más bajo** que alcanza la curva (mínimo) y el **punto más alto** (máximo).

  3. Te fijas si los extremos están incluidos (•) o excluidos (○).


  El intervalo entre la altura mínima y la altura máxima sobre el eje $Y$ es el **recorrido de la función**.'
explicacion_formal: "El **recorrido** (o rango/imagen) de una función a partir de su gráfica es la proyección ortogonal de $\\text{Graf}(f)$ sobre el eje de ordenadas:\n$$\\text{Rec}(f) = \\pi_Y(\\text{Graf}(f)) = \\{y \\in \\mathbb{R} \\mid \\exists x \\in \\text{Dom}(f) \\text{ tal que } (x, y) \\in \\text{Graf}(f)\\}$$\n\n**Criterios de lectura vertical:**\n- **Parábolas con vértice $(h, k)$**:\n  - Si abre hacia arriba ($a > 0$): $\\text{Rec}(f) = [k, +\\infty[$.\n  - Si abre hacia abajo ($a < 0$): $\\text{Rec}(f) = ]-\\infty, k]$.\n- **Asíntotas horizontales en $y = L$**: Excluyen el valor $L$ del recorrido si la curva no lo cruza."
definiciones_clave: '- **Proyección vertical**: Sombra proyectada por la curva sobre el eje $Y$.

  - **Extremo vertical**: Valor mínimo (cota inferior) o máximo (cota superior) alcanzado por la función.'
propiedades_relaciones: '- **Eje de ordenadas**: El recorrido se mide siempre de abajo hacia arriba en $Y$.

  - **Vértice cuadrático**: La ordenada $k$ del vértice fija el inicio o fin del recorrido.'
ejemplo_guiado:
  enunciado: '![Ejemplo Determinar el recorrido desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje vertical $Y$](/static/img/nodos/determinacion-del-recorrido-desde-un-grafico-ejemplos.svg)



    La gráfica de una función cuadrática tiene su vértice en el punto $(2, -5)$ y sus ramas se abren hacia arriba indefinidamente. Determina su recorrido.'
  pasos:
  - 'Paso 1: Localizar el punto más bajo de la curva: el vértice en $(2, -5)$.'
  - 'Paso 2: Extraer la ordenada (altura) del punto más bajo: $y_{\text{mín}} = -5$.'
  - 'Paso 3: Dado que el vértice es un punto sólido de la curva, el $-5$ está incluido: $[-5$.'
  - 'Paso 4: Observar que las ramas crecen sin límite hacia arriba: $+\infty[$.'
  - 'Paso 5: Escribir el recorrido: $\text{Rec}(f) = [-5, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: En una gráfica, el punto más bajo alcanzado es $y = -3$ (cerrado) y el más alto es $y = 7$ (abierto). ¿Cuál es el recorrido?
  choices:
  - text: '[-3, 7['
    is_correct: true
  - text: '[-3, 7]'
    is_correct: false
  - text: ']-3, 7]'
    is_correct: false
  - text: ']-3, 7['
    is_correct: false
  explanation: La alternativa correcta es '[-3, 7['. Mínimo en -3 incluido y máximo en 7 excluido.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para una recta no horizontal continua en todo el plano, ¿cuál es su recorrido?
  choices:
  - text: Todos los números reales R
    is_correct: true
  - text: '[0, +inf['
    is_correct: false
  - text: R \ {0}
    is_correct: false
  - text: Depende de la pendiente
    is_correct: false
  explanation: La alternativa correcta es 'Todos los números reales R'. Las rectas no horizontales cubren todo el eje vertical.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el punto o cota más baja de la curva y leer su ordenada $y_{\text{mín}}$.'
- 'Paso 2: Verificar si el valor mínimo está incluido (punto cerrado) o excluido.'
- 'Paso 3: Localizar el punto o cota más alta de la curva y leer su ordenada $y_{\text{máx}}$.'
- 'Paso 4: Revisar si existen asíntotas horizontales o franjas verticales sin gráfica para escribir el intervalo del recorrido.'
errores_correccion: '- **Error común:** Usar la coordenada $x$ del vértice (ej: $x = 2$) en vez de la coordenada $y$ (ej: $y = -5$) al definir el recorrido de una parábola.

  - **Cómo corregirlo:** El recorrido es la altura, por lo que **siempre debes tomar la segunda componente $y$** de los puntos extremos.'
ejemplos:
- titulo: 'Ejemplo 1: Parábola abierta hacia abajo'
  enunciado: Una parábola tiene su vértice en $(3, 8)$ y se abre hacia abajo. ¿Cuál es su recorrido?
  alternativas:
  - ']-inf, 8]'
  - '[8, +inf['
  - ']-inf, 3]'
  - '[3, +inf['
  respuesta: ']-inf, 8]'
  solucion_pasos:
  - 'Paso 1: El punto más alto es $y = 8$.'
  - 'Paso 2: La curva desciende hacia $-\infty$.'
  - 'Paso 3: $\text{Rec}(f) = ]-\infty, 8]$.'
- titulo: 'Ejemplo 2: Segmento con extremos mixtos'
  enunciado: Una función lineal acotada va desde $(-2, -4)$ con punto abierto hasta $(3, 5)$ con punto cerrado. ¿Cuál es su recorrido?
  alternativas:
  - ']-4, 5]'
  - '[-2, 3]'
  - '[-4, 5['
  - ']-2, 3]'
  respuesta: ']-4, 5]'
  solucion_pasos:
  - 'Paso 1: Ordenada mínima: $y = -4$ (abierto).'
  - 'Paso 2: Ordenada máxima: $y = 5$ (cerrado).'
  - 'Paso 3: $\text{Rec}(f) = ]-4, 5]$.'
- titulo: 'Ejemplo 3: Función constante'
  enunciado: ¿Cuál es el recorrido de una recta horizontal ubicada a la altura $y = -6$?
  alternativas:
  - '{-6}'
  - R \ {-6}
  - ']-inf, -6]'
  - R
  respuesta: '{-6}'
  solucion_pasos:
  - 'Paso 1: La gráfica solo ocupa una única altura: $-6$.'
  - 'Paso 2: $\text{Rec}(f) = \{-6\}$.'
- titulo: 'Ejemplo 4: Función valor absoluto desplazada'
  enunciado: La gráfica en forma de 'V' de $y = |x - 1| + 3$ tiene su vértice en $(1, 3)$. ¿Cuál es su recorrido?
  alternativas:
  - '[3, +inf['
  - '[1, +inf['
  - '[0, +inf['
  - R
  respuesta: '[3, +inf['
  solucion_pasos:
  - 'Paso 1: El punto más bajo es el vértice con altura $y = 3$.'
  - 'Paso 2: Las ramas suben al infinito: $[3, +\infty[$.'
errores_frecuentes:
- Usar las abscisas de los puntos en lugar de las ordenadas.
- Confundir la lectura de dominio (eje X) con la de recorrido (eje Y).
- Olvidar que en una función constante el recorrido es un conjunto unitario {k}.
afirmaciones_verdaderas:
- El recorrido gráfico de una función es la proyección ortogonal de su curva sobre el eje vertical Y.
- En funciones cuadráticas, la ordenada del vértice determina la cota inferior o superior del recorrido.
al_terminar_debes_poder: '**QUÉ:** Determinar el recorrido de funciones a partir de su representación gráfica.


  **CÓMO:** Proyectando la curva sobre el eje vertical Y e identificando cotas mínimas y máximas y puntos extremos incluidos o excluidos.


  ![Resumen Determinar el recorrido desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje vertical $Y$](/static/img/nodos/determinacion-del-recorrido-desde-un-grafico-resumen.svg)'
