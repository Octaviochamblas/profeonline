semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.RAZON_PERIMETROS
resumen_inicial: 'Relación entre perímetros de figuras semejantes: conceptos, teoremas,
  propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Una consecuencia directa e intuitiva de la semejanza es cómo se
  relacionan los perímetros de dos figuras semejantes entre sí.
explicacion_formal: '![Razón entre perímetros de figuras semejantes](/static/img/geometria/congruencia-semejanza/semejanza-razon-perimetros.svg)


  ### Definición formal


  Si dos figuras son semejantes con razón de semejanza $k$, entonces $\frac{P_2}{P_1}=k$,
  donde $P_1$ y $P_2$ son sus perímetros respectivos.


  ### Desarrollo didáctico


  Esto ocurre porque el perímetro es una suma de longitudes, y cada longitud se multiplica
  por el mismo factor $k$; al sumar todos los lados multiplicados por $k$, el perímetro
  total también queda multiplicado por $k$.'
definiciones_clave: '- **Relación entre perímetros de figuras semejantes**: Elemento
  o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre perímetros de figuras semejantes.'
ejemplo_guiado:
  enunciado: Para analizar relación entre perímetros de figuras semejantes, considera
    un ángulo $\alpha = 60^\circ$ ubicado en la posición dada. Determina el valor
    de la medida asociada sabiendo que $x + 1287^\circ = 60^\circ$.
  pasos:
  - Identificar la propiedad de relación entre perímetros de figuras semejantes referida
    a $\alpha = 60^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1287 = 60 \implies x = 60 - 1287$.'
  - Concluir que la medida calculada para relación entre perímetros de figuras semejantes
    es $x = -1227^\circ$.
