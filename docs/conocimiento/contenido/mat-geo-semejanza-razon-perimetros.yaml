- titulo: ¿Se cumple siempre la propiedad principal de relación entre perímetros de
    figuras semejantes en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
