semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.SEMEJANZA_POLIGONOS_CONCEPTO
resumen_inicial: 'Dos polígonos de $n$ lados son semejantes si y solo si se cumplen simultáneamente dos condiciones: sus ángulos interiores homólogos son congruentes y sus lados correspondientes son proporcionales.'
explicacion_simple: |
  ![Semejanza de Polígonos de n Lados](/static/img/nodos/concepto-de-semejanza-de-poligonos-intro.svg)

  Para polígonos de 4 o más lados no basta con que tengan los mismos ángulos o los lados proporcionales: se necesitan ambas cosas a la vez.
explicacion_formal: |
  ### Definición formal
  Dos polígonos convexos $P = A_1 A_2 \dots A_n$ y $P' = A'_1 A'_2 \dots A'_n$ de $n$ vértices son semejantes ($P \sim P'$) si y solo si:

  1. **Equiangularidad homóloga**: $\angle A_i \cong \angle A'_i \quad \forall i \in \{1, 2, \dots, n\}$
  2. **Proporcionalidad de lados homólogos**:
     $$\frac{\|\overline{A'_1 A'_2}\|}{\|\overline{A_1 A_2}\|} = \frac{\|\overline{A'_2 A'_3}\|}{\|\overline{A_2 A_3}\|} = \dots = \frac{\|\overline{A'_n A'_1}\|}{\|\overline{A_n A_1}\|} = k$$

  ### Desglose simbólico y geométrico
  - Rigidez triangular vs deformabilidad de polígonos: Los triángulos ($n=3$) son figuras rígidas (los ángulos determinan los lados). Para $n \ge 4$, la figura es deformable, por lo que ambas condiciones son lógicamente independientes.

  ### Síntesis didáctica
  Comprobar siempre ángulos Y lados al evaluar cuadriláteros, pentágonos y polígonos generales.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Semejanza de Polígonos de n Lados](/static/img/nodos/concepto-de-semejanza-de-poligonos-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
