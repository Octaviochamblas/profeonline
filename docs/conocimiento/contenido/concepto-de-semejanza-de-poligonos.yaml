procedimiento:
- 'Paso 1: Verificar el criterio de semejanza aplicable (AA, LLL o LAL).'
- 'Paso 2: Emparejar los elementos homólogos respetando la correspondencia angular.'
- 'Paso 3: Formular la igualdad de razones $\frac{L_1^\prime}{L_1} = \frac{L_2^\prime}{L_2} = k$.'
- 'Paso 4: Multiplicar por $k$ (longitudes), $k^2$ (áreas) o $k^3$ (volúmenes).'
- 'Paso 5: Comprobar la coherencia del resultado con la escala de ampliación o reducción.'
errores_correccion: 'Recuerda que para figuras de 4 o más lados no basta con tener los mismos ángulos: se deben verificar obligatoriamente tanto ángulos iguales como lados proporcionales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor correspondiente calculado mediante las propiedades de semejanza?
  alternativas:
  - 'Dos: ángulos homólogos congruentes y lados homólogos proporcionales'
  - 'Valor alternativo no equivalente 1'
  - 'Valor alternativo no equivalente 2'
  respuesta: 'Dos: ángulos homólogos congruentes y lados homólogos proporcionales'
  solucion_pasos:
  - 'Deben cumplirse Dos: ángulos homólogos congruentes y lados homólogos proporcionales.'
- titulo: Ejemplo 2
  enunciado: Si una figura se amplía al triple (k = 3), ¿por cuánto se multiplica su área?
  alternativas:
  - Se multiplica por 9 ($3^2 = 9$)
  - Se multiplica por 3
  - Se multiplica por 27
  respuesta: Se multiplica por 9 ($3^2 = 9$)
  solucion_pasos:
  - 'El área es una magnitud bidimensional que escala con el cuadrado de la razón de semejanza: $k^2 = 3^2 = 9$.'
- titulo: ¿Dos triángulos con dos ángulos respectivamente iguales son siempre semejantes?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por el Criterio AA (Ángulo-Ángulo), dos ángulos congruentes garantizan automáticamente la semejanza total de los triángulos.'
- titulo: ¿Un cuadrado y un rectángulo son siempre semejantes por tener ángulos de 90°?
  respuesta: 'No'
  solucion_pasos:
  - 'No, porque para polígonos de 4 o más lados se requiere además que sus lados homólogos sean proporcionales, lo que no ocurre entre un cuadrado y un rectángulo general.'
errores_frecuentes:
- 'Multiplicar el área por k en lugar de k² al cambiar de escala.'
- 'Multiplicar el volumen por k en lugar de k³ al ampliar un sólido.'
- 'Afirmar que dos polígonos de 4 o más lados son semejantes solo porque tienen los mismos ángulos.'
- 'Invertir el orden de los lados al plantear la razón de semejanza.'
- 'Modificar la medida de los ángulos al aplicar un factor de escala k.'
afirmaciones_verdaderas:
- 'Dos triángulos con dos ángulos congruentes son semejantes (Criterio AA).'
- 'La razón entre las áreas de figuras semejantes es igual al cuadrado de la razón de lados (k²).'
- 'La razón entre los volúmenes de cuerpos semejantes es igual al cubo de la razón de lados (k³).'
al_terminar_debes_poder: |
  **QUÉ:** Comprender, demostrar y aplicar la semejanza de triángulos y polígonos, escalas, modelos de perspectiva y razones de perímetros, áreas y volúmenes.

  **CÓMO:** Utilizando los criterios AA, LLL y LAL, resolviendo ecuaciones de proporcionalidad y aplicando las razones de escala $k$, $k^2$ y $k^3$.

