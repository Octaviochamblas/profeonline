procedimiento:
- 'Paso 1: Identifica los niveles de agrupación y comienza por la subexpresión más
  interna.'
- 'Paso 2: Simplifica o multiplica cada bloque interior antes de actuar sobre el grupo
  exterior.'
- 'Paso 3: Cuando un signo o factor afecte a todo un grupo, distribúyelo sobre cada
  término del bloque.'
- 'Paso 4: Elimina los signos de agrupación de adentro hacia afuera, conservando correctamente
  los signos.'
- 'Paso 5: Reduce los términos semejantes y escribe la expresión final sin agrupaciones
  innecesarias.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación con signos de agrupación.
ejemplos:
- titulo: Al reducir la expresión $3m - [2m^2 - m(m - 3)]$, obtenemos un polinomio
    cuyo coeficiente de
  enunciado: 'Al reducir la expresión $3m - [2m^2 - m(m - 3)]$, obtenemos un polinomio
    cuyo coeficiente del término lineal es:


    Opciones: A) $0$ · B) $3$ · C) $6$ · D) $-3$'
  solucion_pasos:
  - 'Corchete: $2m^2 - m^2 + 3m = m^2 + 3m$. Todo: $3m - (m^2 + 3m) = 3m - m^2 - 3m
    = -m^2$. El término lineal (con $m$) se cancela, su coeficiente es 0.'
  - 'Respuesta: $0$'
- titulo: Si $P(x) = x[2 - (x+1)]$ y $Q(x) = -[x^2 - 2x]$, ¿cuál es el valor de $P(x)
    - Q(x)$
  enunciado: 'Si $P(x) = x[2 - (x+1)]$ y $Q(x) = -[x^2 - 2x]$, ¿cuál es el valor de
    $P(x) - Q(x)$?


    Opciones: A) $-x$ · B) $-3x$ · C) $x$ · D) $x^2 - x$'
  solucion_pasos:
  - $P(x) = x[1-x] = x-x^2$. $Q(x) = -x^2+2x$. $P-Q = (x-x^2) - (-x^2+2x) = x-x^2+x^2-2x
    = -x$.
  - 'Respuesta: $-x$'
- titulo: 'Respecto de «Multiplicación con signos de agrupación»: ¿Describe adecuadamente
    el concepto e'
  enunciado: 'Respecto de «Multiplicación con signos de agrupación»: ¿Describe adecuadamente
    el concepto esta frase? «La jerarquía exige resolver siempre el bloque más profundo
    (interior) primero»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La jerarquía exige resolver
    siempre el bloque más profundo (interior) primero.'
- titulo: 'Respecto de «Multiplicación con signos de agrupación»: ¿Se puede aceptar
    esta afirmación? «D'
  enunciado: 'Respecto de «Multiplicación con signos de agrupación»: ¿Se puede aceptar
    esta afirmación? «Desde los signos más externos hacia los más internos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La jerarquía exige resolver
    siempre el bloque más profundo (interior) primero.'
errores_frecuentes:
- Desde los signos más externos hacia los más internos.
- Para «Al resolver operaciones combinadas con corchetes y paréntesis anidados, el
  orden correcto de eliminación es:», la respuesta correcta es De izquierda a derecha
  indiferentemente.
- Todos los signos se eliminan simultáneamente.
- Multiplica solo al $2x$, pero no afecta al paréntesis.
- Para «Si tienes la expresión $- [2x(x-1)]$, el signo menos exterior:», la respuesta
  correcta es Desaparece al multiplicar el interior.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
al_terminar_debes_ponder: Resolver productos algebraicos utilizando multiplicación
