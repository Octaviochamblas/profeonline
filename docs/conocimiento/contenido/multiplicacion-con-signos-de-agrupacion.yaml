semantic_id: MAT.ALG.MULT_POLINOMIOS.SIGNOS_AGRUPACION
resumen_inicial: 'Multiplicación con signos de agrupación: leyes, procedimiento y
  aplicación en Multiplicación de polinomios.'
explicacion_simple: Los paréntesis, corchetes y llaves organizan productos anidados.
  Leerlos desde el nivel más interno permite conservar los signos y reconocer qué
  factor actúa sobre cada grupo.
explicacion_formal: '### Definición formal


  Los signos de agrupación $()$, $[]$ y $\{\}$ delimitan subexpresiones y determinan
  el alcance de cada operación exterior. Si una expresión agrupada tiene la forma
  $E=\sum_{i=1}^{n} T_i$ y un factor $\lambda$ actúa sobre todo el bloque, entonces

  $$\lambda E=\lambda\left(\sum_{i=1}^{n} T_i\right)=\sum_{i=1}^{n}\lambda T_i.$$

  En particular, un signo menos delante de un grupo equivale a multiplicar toda la
  subexpresión por $-1$. La función de los signos de agrupación no es cambiar las
  reglas algebraicas, sino organizar expresiones anidadas para aplicar correctamente
  la distributividad y la ley de signos.


  ### Desarrollo didáctico


  Primero se resuelve $2x(x-1) = 2x^2-2x$, y luego el menos exterior invierte todo:
  $-2x^2+2x$.


  Interior del corchete: $x + 3x - 3 = 4x - 3$. Con el menos exterior debe ser $2x
  - (4x - 3) = -2x + 3$.


  El menos cambia signos: $-(x+4) = -x-4$. Corchete: $[2-x-4]$.'
definiciones_clave: '- **Multiplicación con signos de agrupación**: Propiedad o regla
  fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación con signos de agrupación.'
