procedimiento:
- 'Paso 1: Mide (o calcula) la distancia del centro O al punto original P.'
- 'Paso 2: Mide la distancia del centro O al punto imagen P''.'
- 'Paso 3: Divide OP'' entre OP, asignando signo negativo si P y P'' están en lados
  opuestos de O.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación de la razón de homotecia.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación de la razón de homotecia para
    determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación de la razón de homotecia.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación de la razón de homotecia
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación de la razón de homotecia.
- titulo: ¿Se cumple siempre la propiedad principal de identificación de la razón
    de homotecia en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación de la razón de homotecia asumir un valor negativo
    cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación de la razón de homotecia.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  de la razón de homotecia.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  de la razón de homotecia.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  de la razón de homotecia.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de identificación
  de la razón de homotecia en problemas geométricos.
