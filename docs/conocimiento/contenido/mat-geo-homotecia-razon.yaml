semantic_id: MAT.GEO.HOMOTECIA.RAZON
resumen_inicial: 'Identificación de la razón de homotecia: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Una vez identificado el centro de una homotecia, el siguiente
  dato esencial para caracterizarla completamente es su razón.
explicacion_formal: '![Identificación de la razón de homotecia](/static/img/geometria/congruencia-semejanza/homotecia-razon.svg)


  ### Definición formal


  Si $O$ es el centro de homotecia, $P$ un punto original y $P''$ su imagen, la razón
  es $k=\frac{\overline{OP''}}{\overline{OP}}$, considerando signo positivo si $P''$
  está del mismo lado que $P$ respecto a $O$, y negativo si está del lado opuesto.


  ### Desarrollo didáctico


  Si un punto está a 4 cm del centro y su imagen está a 12 cm del centro, en el mismo
  sentido, la razón es $k=\frac{12}{4}=3$. Si la imagen estuviera al otro lado del
  centro, la razón sería $k=-3$.'
definiciones_clave: '- **Identificación de la razón de homotecia**: Elemento o propiedad
  fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de la razón de homotecia.'
ejemplo_guiado:
  enunciado: En la aplicación de identificación de la razón de homotecia, se establece
    una razón $k = 3.2$ entre dos figuras homólogas de longitud original $L = 10\text{
    cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de identificación de la razón de homotecia.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 3.2 \cdot 10$.'
  - Concluir que la medida obtenida en identificación de la razón de homotecia es
    $L' = 32.0\text{ cm}$.
