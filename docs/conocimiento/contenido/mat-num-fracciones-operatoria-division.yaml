semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.DIVISION
resumen_inicial: "La división entre dos fracciones se resuelve multiplicando la primera fracción por el inverso multiplicativo (recíproco) de la segunda."
explicacion_simple: |
  Para dividir dos fracciones no tienes que hacer divisiones difíciles. Hay un truco infalible: **mantienes la primera fracción igual, cambias la división por una multiplicación y das vuelta la segunda fracción**. Por ejemplo, para resolver $\frac{3}{4} \div \frac{2}{5}$, mantienes $\frac{3}{4}$, cambias el $\div$ por $\times$, e inviertes $\frac{2}{5}$ a $\frac{5}{2}$. Te queda $\frac{3}{4} \times \frac{5}{2} = \frac{15}{8}$. ¡Dividir es simplemente multiplicar por el recíproco!
explicacion_formal: |
  Formalmente, dada la división entre las fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con $b, c, d \neq 0$:
  $\frac{a}{b} \div$ \frac{c}{d}$ = \frac{a}{b} \cdot \left(\frac{c}{d}\right)^{-1} = \frac{a}{b} \cdot$ \frac{d}{c}$ = \frac{a \cdot d}{b \cdot c}$

  Demostración algebraica mediante la notación de fracción de fracciones (fracción compleja):
  $\frac{\frac{a}{b}}{\frac{c}{d}} = \frac{\frac{a}{b} \cdot \left(\frac{d}{c}\right)}{\frac{c}{d} \cdot \left(\frac{d}{c}\right)} = \frac{\frac{a \cdot d}{b \cdot c}}{1} = \frac{a \cdot d}{b \cdot c}$
definiciones_clave: |
  - **División de fracciones**: Operación producto por el recíproco $\frac{a}{b} \cdot \frac{d}{c}$.
  - **Dividendo ($\frac{a}{b}$)**: Primera fracción que se mantiene intacta.
  - **Divisor ($\frac{c}{d}$)**: Segunda fracción no nula cuyo inverso multiplicativo $\frac{d}{c}$ se utiliza para operar.
  - **Fracción compleja**: Expresión de la forma $\frac{a/b}{c/d}$ equivalente a $\frac{a}{b} \div \frac{c}{d}$.
propiedades_relaciones: |
  - **No conmutatividad**: $\frac{a}{b} \div \frac{c}{d} \neq \frac{c}{d} \div \frac{a}{b}$.
  - **No asociatividad**: $(\frac{a}{b} \div \frac{c}{d}) \div \frac{e}{f} \neq \frac{a}{b} \div (\frac{c}{d} \div \frac{e}{f})$.
  - **Relación con la multiplicación**: Toda división en $\mathbb{Q}$ es internamente una multiplicación por el elemento inverso multiplicativo del divisor.
ejemplo_guiado:
  enunciado: "Resuelve la división $\\frac{8}{15} \\div \\frac{4}{9}$ aplicando la regla de multiplicación por el recíproco y simplifica previa o posteriormente."
  pasos:
    - 'Identificar la primera fracción (dividendo $\frac{8}{15}$) y la segunda fracción (divisor $\frac{4}{9}$).'
    - 'Invertir la segunda fracción: $\left(\frac{4}{9}\right)^{-1} = \frac{9}{4}$.'
    - 'Transformar la división en multiplicación: $\frac{8}{15} \cdot \frac{9}{4}$.'
    - "Simplificar de manera cruzada: $8$ y $4$ se dividen por $4$ (quedan $2$ y $1$); $9$ y $15$ se dividen por $3$ (quedan $3$ y $5$)."
    - 'Multiplicar los resultados simplificados: $\frac{2 \cdot 3}{5 \cdot 1} = \frac{6}{5}$ (o $1\frac{1}{5}$).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el procedimiento correcto para calcular la división entre dos fracciones $\\frac{a}{b} \\div \\frac{c}{d}$?"
    choices:
      - {text: "Multiplicar la primera fracción por el inverso multiplicativo de la segunda: $\\frac{a}{b} \\cdot \\frac{d}{c}$.", is_correct: true}
      - {text: "Dividir el numerador entre el numerador y el denominador entre el denominador directamente.", is_correct: false}
      - {text: "Invertir ambas fracciones y luego sumarlas.", is_correct: false}
      - {text: "Buscar el m.c.m. de los numeradores.", is_correct: false}
    explanation: "La correcta es Multiplicar la primera fracción por el inverso multiplicativo de la segunda: $\\frac{a}{b} \\cdot \\frac{d}{c}$.: la división se define operacionalmente como el producto por el recíproco."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al resolver la división $\\frac{5}{6} \\div \\frac{5}{12}$, ¿cuál es el resultado simplificado obtenido?"
    choices:
      - {text: "2", is_correct: true}
      - {text: '\$\frac{25}{72}$', is_correct: false}
      - {text: '\$\frac{1}{2}$', is_correct: false}
      - {text: '\$\frac{60}{30}$', is_correct: false}
    explanation: "La correcta es 2: invertimos el divisor a $\\frac{12}{5}$ y multiplicamos $\\frac{5}{6} \\cdot \\frac{12}{5} = \\frac{60}{30} = 2$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Conservar la primera fracción (dividendo) exactamente igual."
  - 'Paso 2: Cambiar el signo de división ($\div$) por el signo de multiplicación ($\cdot$).'
  - "Paso 3: Invertir la segunda fracción (divisor) intercambiando su numerador y denominador."
  - "Paso 4: Resolver la multiplicación resultante (aplicando simplificación cruzada si es posible)."
  - "Paso 5: Escribir la fracción irreductible resultante."
errores_correccion: |
  Un error clásico es dar vuelta la primera fracción en lugar de la segunda. Recuerda siempre: **la primera fracción queda tal como está**, la única que se da vuelta es la **segunda fracción (el divisor)**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $\\frac{3}{5} \\div \\frac{7}{10}$."
    alternativas:
      - '\$\frac{6}{7}$'
      - '\$\frac{21}{50}$'
      - '\$\frac{7}{6}$'
    respuesta: '\$\frac{6}{7}$'
    solucion_pasos:
      - 'Invertimos el divisor: $\frac{7}{10} \implies \frac{10}{7}$.'
      - 'Multiplicamos: $\frac{3}{5} \cdot \frac{10}{7}$.'
      - 'Simplificamos 10 y 5 por 5: $\frac{3 \cdot 2}{1 \cdot 7} = \frac{6}{7}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Se tienen 6 litros de jugo y se quieren embotellar en frascos de $\\frac{3}{4}$ de litro de capacidad cada uno. ¿Cuántos frascos se pueden llenar?"
    alternativas:
      - "Se pueden llenar 8 frascos."
      - "Se pueden llenar 4.5 frascos."
      - "Se pueden llenar 18 frascos."
    respuesta: "Se pueden llenar 8 frascos."
    solucion_pasos:
      - 'Dividimos los 6 litros entre $\frac{3}{4}$: $6 \div \frac{3}{4} = 6 \cdot \frac{4}{3}$.'
      - 'Calculamos: $\frac{24}{3} = 8$ frascos completables.'
  - titulo: "¿Dividir entre una fracción propia produce un resultado mayor que el dividendo original?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, como dividir entre $\frac{1}{2}$ equivale a multiplicar por 2, el resultado se duplica.'
  - titulo: "¿Se puede expresar la división de fracciones como una fracción compleja de la forma $\\frac{a/b}{c/d}$?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, y se resuelve multiplicando extremos por extremos entre medios por medios: $(a \cdot d) / (b \cdot c)$.'
errores_frecuentes:
  - "Invertir la primera fracción en lugar de la segunda."
  - "Invertir ambas fracciones a la vez."
  - "Multiplicar en cruz y además dar vuelta la fracción cometiendo una doble inversión indebida."
  - "Intentar dividir entre cero."
  - 'Olvidar cambiar el signo de división ($\div$) a multiplicación ($\cdot$).'
afirmaciones_verdaderas:
  - 'La división de fracciones $\frac{a}{b} \div \frac{c}{d}$ equivale a la multiplicación de $\frac{a}{b}$ por el recíproco del divisor $\frac{d}{c}$.'
  - "Dividir un número por una fracción con numerador 1 es equivalente a multiplicar ese número por el denominador."
al_terminar_debes_ponder: |
  Debes ser capaz de dividir cualquier par de fracciones o números racionales transformando la operación en multiplicación por el recíproco.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
