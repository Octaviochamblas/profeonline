semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.DIVISION
resumen_inicial: 'La división de fracciones se calcula multiplicando la primera fracción
  por el inverso multiplicativo de la segunda: $\frac{a}{b} : \frac{c}{d} = \frac{a}{b}
  \cdot \frac{d}{c} = \frac{a \cdot d}{b \cdot c}$.'
explicacion_simple: Para dividir dos fracciones, mantenemos la primera fracción igual,
  cambiamos la división por una multiplicación y damos vuelta la segunda fracción
  (su recíproco). Luego multiplicamos normalmente en línea recta.
explicacion_formal: 'Para $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ con $b, c, d \neq
  0$, la **División de Racionales** se define algebraicamente como el producto por
  el inverso:


  $$\frac{a}{b} \div \frac{c}{d} = \frac{a}{b} \cdot \left(\frac{c}{d}\right)^{-1}
  = \frac{a}{b} \cdot \frac{d}{c} = \frac{a \cdot d}{b \cdot c}$$


  **Desglose de la fórmula:**

  - $\left(\frac{c}{d}\right)^{-1} = \frac{d}{c}$: Recíproco del divisor.

  - $\frac{a \cdot d}{b \cdot c}$: Cociente final obtenido de la multiplicación invertida.


  > **Complemento didáctico:** También se puede visualizar con la **regla del sándwich**
  (medios y extremos): $\frac{\frac{a}{b}}{\frac{c}{d}} = \frac{a \cdot d}{b \cdot
  c}$.'
definiciones_clave: '- **División de fracciones**: Operación reducida al producto
  de la primera por el recíproco de la segunda.'
propiedades_relaciones: '- **Equivalencia a multiplicación**: Dividir por $\frac{c}{d}$
  equivale a multiplicar por su recíproco $\frac{d}{c}$.'
ejemplo_guiado:
  enunciado: 'Calcule la división $\frac{5}{6} : \frac{2}{3}$ convirtiéndola en multiplicación.'
  pasos:
  - 'Paso 1: Conservar la primera fracción: $\frac{5}{6}$.'
  - 'Paso 2: Cambiar la división por multiplicación e invertir la segunda fracción:
    $\frac{2}{3} \implies \frac{3}{2}$.'
  - 'Paso 3: Expresar el producto: $\frac{5}{6} \cdot \frac{3}{2}$.'
  - 'Paso 4: Simplificar de forma cruzada ($3$ y $6$ entre $3$): $\frac{5}{2} \cdot
    \frac{1}{2} = \frac{5}{4}$.'
  - 'Conclusión: $\frac{5}{6} : \frac{2}{3} = \frac{5}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿En qué consiste la división de dos fracciones a/b : c/d?'
  choices:
  - text: En multiplicar la primera fracción por el inverso multiplicativo de la segunda
      (a/b · d/c)
    is_correct: true
  - text: En dividir los numeradores entre sí y los denominadores entre sí directamente
    is_correct: false
  - text: En restar ambas fracciones
    is_correct: false
  - text: En dar vuelta ambas fracciones a la vez
    is_correct: false
  explanation: La alternativa correcta es 'En multiplicar la primera fracción por
    el inverso multiplicativo de la segunda (a/b · d/c)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para (5/6) : (2/3), ¿cuál fue el cociente final
    resultante?'
  choices:
  - text: 5/4
    is_correct: true
  - text: 10/18
    is_correct: false
  - text: 5/9
    is_correct: false
  - text: 15/12
    is_correct: false
  explanation: La alternativa correcta es '5/4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mantener intacta la primera fracción (dividendo).'
- 'Paso 2: Reemplazar el signo de división por un signo de multiplicación.'
- 'Paso 3: Invertir la segunda fracción (divisor) y efectuar la multiplicación en
  línea recta.'
errores_correccion: '- **Error 1: Invertir la primera fracción en lugar de la segunda.**
  **Cómo corregirlo:** La fracción que se invierte es ÚNICAMENTE la segunda (el divisor).


  - **Error 2: Invertir AMBAS fracciones a la vez.** **Cómo corregirlo:** Solo se
  invierte la segunda fracción.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Calcule (3/4) : (1/2).'
  alternativas:
  - 3/2
  - 3/8
  - 6/4
  respuesta: 3/2
  solucion_pasos:
  - $\frac{3}{4} \cdot \frac{2}{1} = \frac{6}{4} = \frac{3}{2}$.
- titulo: Ejemplo 2
  enunciado: 'Calcule (2/5) : 3.'
  alternativas:
  - 2/15
  - 6/5
  - 3/10
  respuesta: 2/15
  solucion_pasos:
  - '$\frac{2}{5} : \frac{3}{1} = \frac{2}{5} \cdot \frac{1}{3} = \frac{2}{15}$.'
- titulo: '¿Equivale la división a/b : c/d a multiplicar a · d arriba y b · c abajo?'
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla de multiplicación cruzada $\frac{a \cdot d}{b \cdot c}$ da el mismo
    resultado.
- titulo: '¿Es (1/2) : (1/2) igual a 1?'
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{1}{2} \cdot \frac{2}{1} = 1$.
errores_frecuentes:
- Dividir fracciones requiere invertir la primera fracción y mantener la segunda igual.
- La división de fracciones se calcula dividiendo numeradores y restando denominadores.
- Dividir una fracción por un número mayor que 1 incrementa siempre el valor numérico.
- Se deben invertir ambas fracciones simultáneamente al realizar una división.
- La división de dos fracciones negativas entrega un resultado negativo.
afirmaciones_verdaderas:
- La división de fracciones equivale a multiplicar el dividendo por el recíproco del
  divisor.
- 'La regla para dividir $\frac{a}{b} : \frac{c}{d}$ es $\frac{a \cdot d}{b \cdot
  c}$ ($b, c, d \neq 0$).'
al_terminar_debes_poder: Al terminar serás capaz de efectuar divisiones de fracciones,
  multiplicando la primera fracción por el inverso multiplicativo de la segunda.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
