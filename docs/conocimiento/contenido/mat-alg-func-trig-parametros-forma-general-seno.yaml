semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.FORMA_GENERAL_SENO
resumen_inicial: 'Reconocimiento de la forma general A·sen(B(x - C)) + D: círculo
  unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: La función seno básica puede modificarse con cuatro parámetros
  que controlan su altura, rapidez de oscilación, posición horizontal y posición vertical.
explicacion_formal: '### Definición formal


  En $f(x)=a\sin(b(x-c))+d$: $|a|$ es la amplitud, $2\pi/|b|$ es el periodo, $c$ es
  el desplazamiento horizontal (fase), y $d$ es el desplazamiento vertical (línea
  media). Cada parámetro modifica un aspecto distinto de la gráfica básica.


  ### Desarrollo didáctico


  En $f(x)=3\sin(2(x-\pi))+1$: $a=3$ (amplitud), $b=2$ (afecta el periodo), $c=\pi$
  (desplazamiento horizontal), $d=1$ (desplazamiento vertical, línea media en $y=1$).'
definiciones_clave: '- **Reconocimiento de la forma general A·sen(B(x - C)) + D**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a reconocimiento de la forma general a·sen(b(x - c)) + d.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    reconocimiento de la forma general a·sen(b(x - c)) + d.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de reconocimiento de la forma general a·sen(b(x - c))
    + d.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
checkpoints:
