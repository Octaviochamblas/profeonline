    unitario.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determinan el período T y la amplitud A de una función de la
    forma f(x) = A sen(Bx + C) + D en reconocimiento de la forma general a·sen(b(x
    - c)) + d?
  choices:
  - text: Calcular el período como T = 2pi / |B| y la amplitud como |A|
    is_correct: true
  - text: Sumando A + B + C + D independientemente
    is_correct: false
  - text: Igualando la amplitud a 2pi y el período a 1
    is_correct: false
  - text: Dividiendo A entre 2pi sin considerar B
    is_correct: false
  explanation: 'La alternativa correcta es: Calcular el período como T = 2pi / |B|
    y la amplitud como |A|. Fórmulas estándar para amplitud y período en funciones
    sinusoidales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reescribe la función en la forma estándar $a\sin(b(x-c))+d$ si no está
  en ese formato.'
- 'Paso 2: Identifica cada uno de los cuatro parámetros.'
- 'Paso 3: Relaciona cada parámetro con su efecto correspondiente en la gráfica.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en reconocimiento de la
  forma general a·sen(b(x - c)) + d.
ejemplos:
- titulo: Identificación de los cuatro parámetros
  enunciado: Identifica $a$, $b$, $c$ y $d$ en $f(x)=4\sin(3(x-2))-5$.
  solucion_pasos:
  - Se compara con la forma general.
  - $a=4$, $b=3$, $c=2$, $d=-5$.
- titulo: Reescritura a la forma estándar
  enunciado: Reescribe $f(x)=2\sin(3x-6)$ en la forma $a\sin(b(x-c))+d$.
  solucion_pasos:
  - Se factoriza $3x-6=3(x-2)$.
  - Se obtiene $f(x)=2\sin(3(x-2))$, con $a=2$, $b=3$, $c=2$, $d=0$.
- titulo: ¿El parámetro $a$ afecta el periodo de la función?
  enunciado: ¿El parámetro $a$ en la forma general afecta el periodo de la función
    seno transformada?
  respuesta: 'No'
  solucion_pasos:
  - El parámetro $a$ solo afecta la amplitud; el periodo depende de $b$.
- titulo: ¿El parámetro $d$ afecta la amplitud de la función?
  enunciado: ¿El parámetro $d$ afecta la amplitud de la función seno transformada?
  respuesta: 'No'
  solucion_pasos:
  - El parámetro $d$ solo desplaza verticalmente la curva, sin cambiar su amplitud.
errores_frecuentes:
- Declarar el rol de cada parámetro entre sí (por ejemplo, declarar $b$ con $c$).
- No factorizar correctamente para identificar $c$ cuando la expresión no está en
  forma factorizada.
- Suponer que el parámetro $c$ va sumado en vez de restado dentro del paréntesis.
- Omitir identificar alguno de los cuatro parámetros al analizar la función.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  reconocimiento de la forma general a·sen(b(x - c)) + d.
