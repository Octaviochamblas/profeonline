semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.FORMA_GENERAL_SENO
resumen_inicial: 'Reconocimiento y descomposición de la forma general de la función seno $f(x) = A\sin(Bx + C) + D$.'
explicacion_simple: |
  Una onda sinusoide real puede estirarse hacia arriba, apretarse hacia los lados, moverse a la izquierda o derecha y desplazarse hacia arriba o abajo. Para modelar todas estas variaciones, se utiliza la **forma general de la función seno**: $f(x) = A\sin(Bx + C) + D$. Cada letra representa un control de transformación: $A$ controla la altura (amplitud), $B$ la rapidez de repetición (frecuencia/período), $C$ el desfase horizontal y $D$ el desplazamiento vertical respecto al suelo.
explicacion_formal: |
  ### Definición formal
  La **forma general canónica de la función senoidal** es la expresión algebraica real dada por:
  $$f(x) = A\sin(Bx + C) + D$$
  o equivalentemente en su forma factorizada:
  $$f(x) = A\sin\left(B\left(x + \frac{C}{B}\right)\right) + D$$
  donde $A, B, C, D \in \mathbb{R}$ con $A \neq 0$ y $B \neq 0$.

  ### Desglose simbólico
  - $|A|$: Amplitud de oscilación vertical.
  - $B$: Frecuencia angular que determina el período $T = \frac{2\pi}{|B|}$.
  - $-\frac{C}{B}$: Desfase o traslación horizontal (desplazamiento de fase).
  - $D$: Desplazamiento vertical que define la recta de equilibrio (línea media $y = D$).

  ### Síntesis didáctica
  Cada parámetro altera una dimensión geométrica independiente de la sinusoide. $A$ y $D$ actúan sobre la variable dependiente (eje Y), mientras que $B$ y $C$ actúan sobre la variable independiente (eje X).
definiciones_clave: |
  - **Forma general $A\sin(Bx+C)+D$**: Modelo algebraico estándar para funciones periódicas sinusoides.
  - **Línea de equilibrio ($y=D$)**: Eje horizontal central sobre el cual oscila la función.
  - **Desfase de fase ($-\frac{C}{B}$)**: Desplazamiento horizontal relativo respecto a la posición base en el origen.
propiedades_relaciones: |
  - **Forma factorizada vs expandida**: En $A\sin(B(x - x_0)) + D$, el valor $x_0 = -\frac{C}{B}$ señala directamente el inicio exacto del ciclo base.
  - **Recorrido general**: El conjunto imagen de la función senoidal es $[\min, \max] = [D - |A|, D + |A|]$.
ejemplo_guiado:
  enunciado: 'Dada la función $f(x) = 3\sin(2x - \pi) + 4$, identifica los cuatro parámetros fundamentales $A, B, C, D$.'
  pasos:
    - 'Paso 1: Comparar término a término con la plantilla $A\sin(Bx + C) + D$.'
    - 'Paso 2: Identificar el coeficiente que multiplica al seno: $A = 3$.'
    - 'Paso 3: Identificar el coeficiente que multiplica a la variable $x$: $B = 2$.'
    - 'Paso 4: Identificar la constante sumada dentro del argumento: $C = -\pi$.'
    - 'Paso 5: Identificar el término independiente fuera del seno: $D = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la forma general $f(x) = A\sin(Bx + C) + D$, ¿qué parámetro determina el centro vertical u oscilación media de la gráfica?'
    choices:
      - {text: 'El término independiente $D$', is_correct: true}
      - {text: 'El coeficiente $A$', is_correct: false}
      - {text: 'El coeficiente $B$', is_correct: false}
      - {text: 'La constante $C$', is_correct: false}
    explanation: 'La alternativa correcta es ''El término independiente $D$''. El parámetro $D$ define la línea media $y = D$ alrededor de la cual oscila la sinusoide.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la función $f(x) = 5\sin(3x + \pi) - 2$, ¿cuál es el valor del parámetro $C$?'
    choices:
      - {text: '$\pi$', is_correct: true}
      - {text: '$5$', is_correct: false}
      - {text: '$3$', is_correct: false}
      - {text: '$-2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\pi$''. En la forma $A\sin(Bx + C) + D$, el término constante dentro del paréntesis es $C = \pi$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reescribir la expresión senoidal en el orden canónico $A\sin(Bx + C) + D$.'
  - 'Paso 2: Extraer el coeficiente exterior $A$ (amplitud).'
  - 'Paso 3: Extraer el coeficiente $B$ de la variable $x$ (frecuencia angular).'
  - 'Paso 4: Extraer la constante interna $C$ (desfase) y el término independiente exterior $D$ (traslación vertical).'
errores_correccion: |
  - **Error 1:** Confundir la constante $C$ con el desfase horizontal real. **Cómo corregirlo:** El desfase horizontal no es $-C$, sino la división de $-C$ entre la frecuencia $B$ (es decir, $x_0 = -\frac{C}{B}$).
  - **Error 2:** Creer que el signo de $A$ forma parte de la amplitud. **Cómo corregirlo:** La amplitud es siempre una magnitud positiva dada por el valor absoluto $|A|$. Un signo negativo en $A$ indica una reflexión vertical respecto al eje de equilibrio.
ejemplos:
  - titulo: 'Identificación de parámetros en función simple'
    enunciado: 'En la función $f(x) = \sin(x) + 3$, ¿cuáles son los valores de $A$ y $D$?'
    alternativas:
      - '$A = 1$ y $D = 3$'
      - '$A = 0$ y $D = 3$'
      - '$A = 3$ y $D = 1$'
    respuesta: '$A = 1$ y $D = 3$'
    solucion_pasos:
      - '1. Al no haber número escrito multiplicando al seno, $A = 1$.'
      - '2. El término independiente exterior es $D = 3$.'
  - titulo: 'Forma factorizada'
    enunciado: '¿Cuál es el valor de $B$ en $f(x) = 4\sin\left(2\left(x - \frac{\pi}{4}\right)\right)$?'
    alternativas:
      - '$B = 2$'
      - '$B = 4$'
      - '$B = \frac{\pi}{4}$'
    respuesta: '$B = 2$'
    solucion_pasos:
      - '1. Al algebrizar $2\left(x - \frac{\pi}{4}\right) = 2x - \frac{\pi}{2}$, vemos que el coeficiente de $x$ es $B = 2$.'
  - titulo: 'Ausencia de desplazamiento vertical'
    enunciado: 'Si $f(x) = -2\sin(3x)$, ¿el parámetro $D$ es igual a $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al no haber constante fuera del seno, $D = 0$ y la línea media es el eje X ($y = 0$).'
  - titulo: 'Parámetros por defecto'
    enunciado: '¿En la función base $y = \sin(x)$ los parámetros son $A = 1, B = 1, C = 0, D = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $1\sin(1x + 0) + 0 = \sin(x)$.'
errores_frecuentes:
  - 'La afirmación de que en $f(x) = A\sin(Bx + C) + D$ la constante $C$ es por sí sola la distancia de desplazamiento horizontal.'
  - 'La afirmación de que el coeficiente $A$ en la forma general representa el período fundamental de la función.'
  - 'La afirmación de que el término independiente $D$ altera la frecuencia de repetición de la sinusoide.'
  - 'La afirmación de que el parámetro $B$ modifica únicamente la altura vertical de las crestas.'
  - 'La afirmación de que si el coeficiente $A$ es negativo, la amplitud de la función resulta ser un número negativo.'
afirmaciones_verdaderas:
  - 'En la forma general $f(x) = A\sin(Bx + C) + D$, el parámetro $|A|$ determina la amplitud y el término independiente $D$ define la recta de equilibrio u oscilación media $y = D$.'
  - 'El período fundamental de la función senoidal general $f(x) = A\sin(Bx + C) + D$ viene determinado exclusivamente por la fórmula $T = \frac{2\pi}{|B|}$.'
al_terminar_debes_poder: |
  QUÉ: Descomponer e interpretar los cuatro parámetros de la forma general senoidal $f(x) = A\sin(Bx + C) + D$.
  CÓMO: Asociar $A$ a la amplitud, $B$ a la frecuencia/período, $C$ a la constante de desfase y $D$ a la recta media de equilibrio.
