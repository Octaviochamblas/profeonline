semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.DESIGUALDAD_LITERAL
resumen_inicial: 'Definición de desigualdad literal: relaciones de orden, intervalos
  y resolución en Relación de orden y símbolos de desigualdad.'
explicacion_simple: El álgebra utiliza letras para representar incógnitas o cantidades
  variables dentro de relaciones de orden.
explicacion_formal: '### Definición formal

  Sea $E_1(x)$ y $E_2(x)$ expresiones algebraicas. Una desigualdad literal es de la
  forma $E_1(x) \\mathcal{R} E_2(x)$, con $\\mathcal{R} \\in \\{<, >, \\leq, \\geq\\}$.


  ### Desarrollo didáctico

  El conjunto de valores que satisface la desigualdad literal constituye el conjunto
  solución de la inecuación.'
definiciones_clave: '- **Definición de desigualdad literal**: Concepto fundamental
  de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a definición de desigualdad literal.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de definición de
    desigualdad literal.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de definición de desigualdad literal, invirtiendo
    el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en definición de desigualdad literal?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en relación de orden y símbolos de desigualdad
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en relación de orden y símbolos
    de desigualdad. Es la propiedad fundamental de orden en definición de desigualdad
    literal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en definición
    de desigualdad literal, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar las variables en la expresión.
- Establecer la relación de orden que vincula las expresiones.
- Despejar la variable aplicando las propiedades de las desigualdades.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en definición de desigualdad
  literal.
