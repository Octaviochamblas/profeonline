semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.DESIGUALDAD_LITERAL
resumen_inicial: Una desigualdad literal condiciona valores numéricos mediante variables
  o parámetros algebraicos.
explicacion_simple: 'Una **desigualdad literal** (o inecuación) contiene una o más
  letras (variables) conectadas por un símbolo de orden (como $2x - 3 < 7$).

  A diferencia de las desigualdades numéricas simples, su veracidad no es automática:
  depende de los valores numéricos que le asignemos a las variables.'
explicacion_formal: 'Una **desigualdad literal con variable** se expresa como la proposición
  abierta:


  $$P(x) \ R \ Q(x) \quad \text{con } R \in \{<, >, \le, \ge\}$$


  **Desglose de la fórmula:**

  - $P(x), Q(x)$: Expresiones algebraicas dependientes de la variable $x \in \mathbb{R}$.

  - Conjunto Solución $S = \{x \in \mathbb{R} \mid P(x) \ R \ Q(x) \text{ es verdadero}\}$.'
definiciones_clave: '- **Desigualdad literal**: Relación de orden entre expresiones
  algebraicas que involucran variables o parámetros.

  - **Proposición abierta de orden**: Declaración matemática cuyo valor de verdad
  está condicionado por el valor asignado a las variables.'
propiedades_relaciones: '- **Infinitas soluciones en $\mathbb{R}$**: A diferencia
  de las ecuaciones lineales puntuales, las desigualdades lineales suelen tener como
  solución intervalos continuos de infinitos números reales.'
ejemplo_guiado:
  enunciado: Dada la desigualdad literal $2x + 1 > 9$, evalúa su veracidad para los
    valores $x = 5$ y $x = 2$, e indica si $x = 5$ pertenece al conjunto solución.
  pasos:
  - 'Paso 1: Evaluar para $x = 5$: $2(5) + 1 = 10 + 1 = 11 > 9$ (VERDADERO).Paso 2:
    Evaluar para $x = 2$: $2(2) + 1 = 4 + 1 = 5 > 9$ (FALSO).Paso 3: Concluir que
    $x = 5$ pertenece al conjunto solución y $x = 2$ no pertenece.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿De qué depende el valor de verdad de una desigualdad literal como $2x
    + 1 > 9$?
  choices:
  - text: Del valor numérico específico que se le asigne a la variable $x$.
    is_correct: true
  - text: Es siempre verdadera para cualquier número real.
    is_correct: false
  - text: Es siempre falsa en los números reales.
    is_correct: false
  - text: De que la variable sea positiva.
    is_correct: false
  explanation: La alternativa correcta es 'Del valor numérico específico que se le
    asigne a la variable $x$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al sustituir $x = 5$ en la desigualdad $2x + 1 > 9$, ¿cuál es el resultado
    del primer miembro que confirma que 5 es solución?
  choices:
  - text: $11$
    is_correct: true
  - text: $9$
    is_correct: false
  - text: $5$
    is_correct: false
  - text: $10$
    is_correct: false
  explanation: La alternativa correcta es '$11$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables o letras contenidas en los miembros de la desigualdad.'
- 'Paso 2: Sustituir valores de prueba para verificar si convierten la desigualdad
  en una proposición numérica verdadera.'
- 'Paso 3: Despejar la variable algebraicamente para determinar el conjunto solución
  de todos los números reales válidos.'
errores_correccion: '- **Error común:** Pensar que una desigualdad literal tiene una
  única solución puntual (como $x = 4$).

  - **Cómo corregirlo:** Las desigualdades generalmente se satisfacen para un INTERVALO
  COMPLETO de números infinitos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
  - 'Una desigualdad literal como $2x + 1 > 9$ posee un valor de verdad constante e independiente de la asignación de la variable $x$.'
  - 'El conjunto solución de una inecuación lineal como $2x + 1 > 9$ consiste únicamente en la solución escalar puntual $x = 4$.'
  - 'Al sustituir el valor $x = 2$ en la desigualdad literal $2x + 1 > 9$, la proposición numérica resultante es verdadera.'
  - 'Una desigualdad literal con signo no estricto $P(x) \ge Q(x)$ prohíbe que existan valores de $x$ donde la igualdad $P(x) = Q(x)$ se cumpla.'
  - 'El conjunto solución de una desigualdad literal en $\mathbb{R}$ está conformado exclusivamente por números enteros positivos.'
afirmaciones_verdaderas:
  - 'Una desigualdad literal condiciona su veracidad a los valores asignados a sus variables dentro del conjunto $\mathbb{R}$.'
  - 'El conjunto solución de una desigualdad literal de primer grado generalmente representa un intervalo continuo de números reales.'
al_terminar_debes_poder: |
  QUÉ: Definir e identificar desigualdades literales de primer grado.
  CÓMO: Reconocer proposiciones abiertas con variables $P(x) R Q(x)$, sustituir valores numéricos de prueba y estructurar el conjunto solución en $\mathbb{R}$.
fuente: 'Texto escolar MINEDUC — Álgebra / Desigualdades e Inecuaciones'
