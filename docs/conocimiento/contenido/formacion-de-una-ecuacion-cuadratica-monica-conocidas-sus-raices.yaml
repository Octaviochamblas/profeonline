semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.CONSTRUCCION_MONICA
resumen_inicial: La formación de una ecuación cuadrática mónica dadas sus raíces $x_1, x_2$ aplica la plantilla $x^2 - Sx + P = 0$ donde $S$ es la suma y $P$ el producto.
explicacion_simple: |
  Para construir una **ecuación cuadrática mónica** (donde $a = 1$) conociendo solo sus dos soluciones $x_1$ y $x_2$:

  1. Calculas la **suma de las raíces**: $S = x_1 + x_2$.
  2. Calculas el **producto de las raíces**: $P = x_1 \cdot x_2$.
  3. Reemplazas en la **plantilla mónica universal**:
     $$x^2 - Sx + P = 0$$
  - **Ojo con la suma**: El número que acompaña a la $x$ lleva el **SIGNO CAMBIADO** ($-S$).
  - **Ejemplo**: Si $x_1 = 3$ y $x_2 = 5$:
    - Suma $S = 3 + 5 = 8$.
    - Producto $P = 3 \cdot 5 = 15$.
    - Ecuación mónica: $x^2 - 8x + 15 = 0$.
explicacion_formal: |
  Sean $x_1, x_2 \in \mathbb{C}$ dos raíces conocidas. La **construcción mónica estándar** del polinomio de segundo grado es la representación con coeficiente principal $a = 1$:

  $$(x - x_1)(x - x_2) = 0$$

  **Identidad mediante parámetros de Vieta:**
  Definiendo la suma $S = x_1 + x_2$ y el producto $P = x_1 \cdot x_2$:
  $$x^2 - (x_1 + x_2)x + (x_1 \cdot x_2) = 0 \iff x^2 - Sx + P = 0$$
  donde los coeficientes son $p = -S$ y $q = P$.
definiciones_clave: |
  - **Plantilla mónica de reconstrucción**: Expresión $x^2 - Sx + P = 0$ que genera directamente la ecuación de segundo grado con $a = 1$ a partir de la suma $S$ y el producto $P$ de sus raíces.
propiedades_relaciones: |
  - **Invariancia de soluciones por multiplicidad mónica**: La ecuación mónica $x^2 - Sx + P = 0$ es el representante canónico único de toda la familia de ecuaciones equivalentes $k(x^2 - Sx + P) = 0$.
ejemplo_guiado:
  enunciado: 'Construye la ecuación cuadrática mónica cuyas raíces son $x_1 = -4$ y $x_2 = 7$.'
  pasos:
    - 'Paso 1: Calcular la suma $S = x_1 + x_2 = -4 + 7 = 3$.'
    - 'Paso 2: Calcular el producto $P = x_1 \cdot x_2 = (-4) \cdot 7 = -28$.'
    - 'Paso 3: Sustituir en la plantilla mónica $x^2 - Sx + P = 0$: $x^2 - (3)x + (-28) = 0$.'
    - 'Paso 4: Escribir la ecuación final: $x^2 - 3x - 28 = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación cuadrática mónica que posee raíces $x_1 = 2$ y $x_2 = 6$?'
    choices:
      - {text: '$x^2 - 8x + 12 = 0$', is_correct: true}
      - {text: '$x^2 + 8x + 12 = 0$', is_correct: false}
      - {text: '$x^2 - 8x - 12 = 0$', is_correct: false}
      - {text: '$x^2 + 12x - 8 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 - 8x + 12 = 0$''. Suma $S = 8$ y producto $P = 12$, por lo tanto $x^2 - 8x + 12 = 0$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué ecuación cuadrática mónica tiene soluciones $x_1 = -5$ y $x_2 = -2$?'
    choices:
      - {text: '$x^2 + 7x + 10 = 0$', is_correct: true}
      - {text: '$x^2 - 7x + 10 = 0$', is_correct: false}
      - {text: '$x^2 - 7x - 10 = 0$', is_correct: false}
      - {text: '$x^2 + 10x + 7 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 + 7x + 10 = 0$''. Suma $S = -7 \implies -S = +7$; producto $P = 10 \implies x^2 + 7x + 10 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular el valor de la suma de las dos raíces $S = x_1 + x_2$.'
  - 'Paso 2: Calcular el valor del producto de las dos raíces $P = x_1 \cdot x_2$.'
  - 'Paso 3: Escribir la estructura $x^2 - Sx + P = 0$.'
  - 'Paso 4: Sustituir $S$ y $P$ prestando especial atención al cambio de signo de la suma en el término lineal.'
errores_correccion: |
  - **Error común:** Escribir $x^2 + Sx + P = 0$ sin invertir el signo de la suma $S$.
  - **Cómo corregirlo:** En la plantilla mónica, el término lineal es **$-S$** (el opuesto de la suma).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Raíces con suma negativa.
    alternativas:
      - '$x^2 + 2x - 15 = 0$'
      - '$x^2 - 2x - 15 = 0$'
      - '$x^2 - 2x + 15 = 0$'
    respuesta: '$x^2 + 2x - 15 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Raíces simétricas.
    alternativas:
      - '$x^2 - 9 = 0$'
      - '$x^2 + 9 = 0$'
      - '$x^2 - 6x = 0$'
    respuesta: '$x^2 - 9 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Escribir la plantilla mónica conservando el signo directo de la suma en la forma $x^2 + Sx + P = 0$.'
  - 'El cambio erróneo de la constante del producto $P$ al escribir el término independiente.'
  - 'El producto de las raíces para obtener el término lineal y su suma para el término independiente.'
  - 'La creencia de que se requiere conocer el coeficiente $a$ previamente para formular una ecuación mónica.'
  - 'La creencia de que las raíces $x_1$ y $x_2$ deben ser reales para poder construir la plantilla mónica.'
afirmaciones_verdaderas:
  - 'La plantilla mónica $x^2 - Sx + P = 0$ exige cambiar el signo de la suma de raíces $S = x_1 + x_2$ en el coeficiente lineal.'
  - 'Toda pareja de números $x_1, x_2 \in \mathbb{C}$ define de manera única una ecuación cuadrática mónica dada por $x^2 - (x_1+x_2)x + (x_1 x_2) = 0$.'
al_terminar_debes_poder: |
  QUÉ: Reconstruir la ecuación cuadrática mónica $x^2 + px + q = 0$ conocidas sus soluciones.
  CÓMO: Obtener $S = x_1 + x_2$ y $P = x_1 \cdot x_2$, y formar $x^2 - Sx + P = 0$ invirtiendo el signo de $S$.
