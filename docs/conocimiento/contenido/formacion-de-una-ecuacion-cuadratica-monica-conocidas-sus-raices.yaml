semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.CONSTRUCCION_MONICA
resumen_inicial: La formación de una ecuación cuadrática mónica a partir de sus raíces conocidas $x_1$ y $x_2$ se obtiene directamente mediante la estructura canónica $x^2 - Sx + P = 0$, donde $S = x_1 + x_2$ es la suma y $P = x_1 \cdot x_2$ es el producto.
explicacion_simple: "![La formación de una ecuación cuadrática mónica a partir de sus raíces conocidas $x_1$ y $x_2$ se obtiene directamente mediante la estructura canónica $x^2 - Sx + P = 0$, donde $S = x_1 + x_2$ es la suma y $P = x_1 \\cdot x_2$ es el producto](/static/img/nodos/formacion-de-una-ecuacion-cuadratica-monica-conocidas-sus-raices-intro.svg)\n\n\nSi te dan las dos soluciones de una ecuación (por ejemplo $x_1 = 3$ y $x_2 = 5$) y te piden reconstruir la ecuación original:\n\n**La fórmula de construcción mónica:**\n$$x^2 - Sx + P = 0$$\n1. **Calcula la Suma ($S$):** $S = 3 + 5 = 8$.\n2. **Calcula el Producto ($P$):** $P = 3 \\cdot 5 = 15$.\n3. **Arma la ecuación:**\n   $$x^2 - (8)x + (15) = 0 \\implies x^2 - 8x + 15 = 0$$\n- **¡Cuidado con el signo menos!** El término del medio lleva siempre un signo menos antes de la suma ($-S$)."
explicacion_formal: 'Sean $x_1, x_2 \in \mathbb{C}$ dos números dados. El polinomio mónic de grado 2 que posee a $x_1$ y $x_2$ como raíces se define unívocamente por el producto de factores lineales:

  $$P(x) = (x - x_1)(x - x_2) = 0$$


  Desarrollando algebraicamente mediante la propiedad distributiva:

  $$x^2 - x_2 x - x_1 x + x_1 x_2 = x^2 - (x_1 + x_2)x + (x_1 x_2) = 0$$


  Definiendo los invariantes simétricos elementales:

  $$S = x_1 + x_2, \quad P = x_1 \cdot x_2$$


  Se obtiene la **ecuación cuadrática mónica canónica**:

  $$x^2 - Sx + P = 0$$'
definiciones_clave: '- **Ecuación cuadrática mónica**: Ecuación de segundo grado cuyo coeficiente principal es unitario ($a = 1$).

  - **Polinomio mónico de raíces dadas**: Expresión $x^2 - Sx + P$ construida a partir de la suma y producto de sus ceros.'
propiedades_relaciones: '- **Unicidad**: La ecuación mónica asociada a un conjunto de raíces es única.

  - **Raíces irracionales conjugadas**: Si las raíces son $p \pm \sqrt{q}$, entonces $S = 2p$ y $P = p^2 - q$, resultando coeficientes estrictamente racionales $x^2 - 2px + (p^2 - q) = 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La formación de una ecuación cuadrática mónica a partir de sus raíces conocidas $x_1$ y $x_2$ se obtiene directamente mediante la estructura canónica $x^2 - Sx + P = 0$, donde $S = x_1 + x_2$ es la suma y $P = x_1 \cdot x_2$ es el producto](/static/img/nodos/formacion-de-una-ecuacion-cuadratica-monica-conocidas-sus-raices-ejemplos.svg)



    Construye la ecuación cuadrática mónica cuyas raíces son $x_1 = 3 + \sqrt{5}$ y $x_2 = 3 - \sqrt{5}$.'
  pasos:
  - 'Paso 1: Calcular la suma de las raíces:

    $S = (3 + \sqrt{5}) + (3 - \sqrt{5}) = 3 + 3 = 6$.'
  - 'Paso 2: Calcular el producto de las raíces (suma por diferencia):

    $P = (3 + \sqrt{5})(3 - \sqrt{5}) = 3^2 - (\sqrt{5})^2 = 9 - 5 = 4$.'
  - 'Paso 3: Sustituir $S = 6$ y $P = 4$ en la estructura $x^2 - Sx + P = 0$:

    $x^2 - 6x + 4 = 0$.'
  - 'Paso 4: Concluir: La ecuación mónica buscada es $x^2 - 6x + 4 = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación cuadrática mónica cuyas raíces son x1 = 2 y x2 = -6?
  choices:
  - text: x² + 4x - 12 = 0
    is_correct: true
  - text: x² - 4x - 12 = 0
    is_correct: false
  - text: x² + 4x + 12 = 0
    is_correct: false
  - text: x² - 12x + 4 = 0
    is_correct: false
  explanation: La alternativa correcta es 'x² + 4x - 12 = 0'. $S = 2 + (-6) = -4$, $P = 2(-6) = -12 \implies x^2 - (-4)x + (-12) = x^2 + 4x - 12 = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la estructura x² - Sx + P = 0, ¿qué representa el término -S?
  choices:
  - text: El opuesto de la suma de las dos raices.
    is_correct: true
  - text: La suma directa de las dos raices.
    is_correct: false
  - text: El producto de las raices.
    is_correct: false
  - text: El discriminante.
    is_correct: false
  explanation: La alternativa correcta es 'El opuesto de la suma de las dos raices.'. El coeficiente lineal es siempre $-S$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sumar las dos raíces conocidas para hallar $S = x_1 + x_2$.'
- 'Paso 2: Multiplicar las dos raíces conocidas para hallar $P = x_1 \cdot x_2$.'
- 'Paso 3: Plantear la estructura canónica $x^2 - Sx + P = 0$.'
- 'Paso 4: Sustituir $S$ y $P$ aplicando las leyes de signos pertinentes.'
errores_correccion: '- **Error común:** Escribir $x^2 + Sx + P = 0$ con signo positivo en la suma.

  - **Cómo corregirlo:** La fórmula lleva **siempre signo menos en la suma**: **$x^2 - Sx + P = 0$**.'
ejemplos:
- titulo: 'Ejemplo 1: Raíces enteras positivas'
  enunciado: Forma la ecuación mónica con raíces $x_1 = 4$ y $x_2 = 7$.
  alternativas:
  - x^2 - 11x + 28 = 0
  - x^2 + 11x + 28 = 0
  - x^2 - 28x + 11 = 0
  - x^2 + 28x - 11 = 0
  respuesta: x^2 - 11x + 28 = 0
  solucion_pasos:
  - 'Paso 1: $S = 11, P = 28 \implies x^2 - 11x + 28 = 0$.'
- titulo: 'Ejemplo 2: Raíces simétricas opuestas'
  enunciado: Construye la ecuación mónica con raíces $x_1 = 5$ y $x_2 = -5$.
  alternativas:
  - x^2 - 25 = 0
  - x^2 + 25 = 0
  - x^2 - 10x - 25 = 0
  - x^2 + 10x - 25 = 0
  respuesta: x^2 - 25 = 0
  solucion_pasos:
  - 'Paso 1: $S = 0, P = -25 \implies x^2 - 0x - 25 = x^2 - 25 = 0$.'
- titulo: 'Ejemplo 3: Una raíz nula'
  enunciado: Forma la ecuación mónica cuyas soluciones son $0$ y $-8$.
  alternativas:
  - x^2 + 8x = 0
  - x^2 - 8x = 0
  - x^2 - 8 = 0
  - x^2 + 8 = 0
  respuesta: x^2 + 8x = 0
  solucion_pasos:
  - 'Paso 1: $S = -8, P = 0 \implies x^2 - (-8)x + 0 = x^2 + 8x = 0$.'
- titulo: 'Ejemplo 4: Raíz doble'
  enunciado: Construye la ecuación mónica con raíz doble $x = -3$.
  alternativas:
  - x^2 + 6x + 9 = 0
  - x^2 - 6x + 9 = 0
  - x^2 + 9 = 0
  - x^2 - 9 = 0
  respuesta: x^2 + 6x + 9 = 0
  solucion_pasos:
  - 'Paso 1: $S = -6, P = 9 \implies x^2 - (-6)x + 9 = x^2 + 6x + 9 = 0$.'
errores_frecuentes:
- Poner signo positivo en el término lineal de la suma.
- Confundir la suma con el producto de las raíces.
- Olvidar igualar la expresión final a cero.
afirmaciones_verdaderas:
- La ecuación mónica cuyas raíces son x1 y x2 viene dada por x² - Sx + P = 0.
- El coeficiente lineal de una ecuación mónica es el opuesto aditivo de la suma de sus raíces.
al_terminar_debes_poder: '**QUÉ:** Construir ecuaciones cuadráticas mónicas conociendo sus raíces.


  **CÓMO:** Calculando la suma S y el producto P de las raíces y estructurando x² - Sx + P = 0.


  ![Resumen La formación de una ecuación cuadrática mónica a partir de sus raíces conocidas $x_1$ y $x_2$ se obtiene directamente mediante la estructura canónica $x^2 - Sx + P = 0$, donde $S = x_1 + x_2$ es la suma y $P = x_1 \cdot x_2$ es el producto](/static/img/nodos/formacion-de-una-ecuacion-cuadratica-monica-conocidas-sus-raices-resumen.svg)'
