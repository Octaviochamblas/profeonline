semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.CONSTRUCCION_MONICA
resumen_inicial: 'Formación de una ecuación cuadrática mónica conocidas sus raíces:
  concepto, discriminante, soluciones y modelamiento en Propiedades de las raíces
  y relaciones de Vieta.'
explicacion_simple: 'Así como se puede pasar de una ecuación a sus raíces, también
  se puede hacer el camino inverso: dadas dos raíces, reconstruir la ecuación cuadrática
  más simple que las tiene como soluciones.'
explicacion_formal: '### Definición formal


  Si $x_1$ y $x_2$ son las raíces deseadas, la ecuación cuadrática mónica (con coeficiente
  principal $a=1$) que las tiene como soluciones es $x^2-(x_1+x_2)x+(x_1 \cdot x_2)=0$.
  Esta fórmula es la aplicación inversa de las relaciones de Vieta: en vez de partir
  de la ecuación para hallar suma y producto, se parte de la suma y el producto para
  construir la ecuación.


  ### Desarrollo didáctico


  Basta con calcular la suma y el producto de las raíces dadas, y sustituirlos directamente
  en la fórmula $x^2-(\text{suma})x+(\text{producto})=0$.


  Para raíces $x_1=3$ y $x_2=-2$: suma $=1$, producto $=-6$. La ecuación mónica es
  $x^2-1x+(-6)=0$, es decir $x^2-x-6=0$.'
definiciones_clave: '- **Formación de una ecuación cuadrática mónica conocidas sus
  raíces**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en formación
  de una ecuación cuadrática mónica conocidas sus raíces.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando formación de una
    ecuación cuadrática mónica conocidas sus raíces.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a formación de una ecuación
    cuadrática mónica conocidas sus raíces.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
