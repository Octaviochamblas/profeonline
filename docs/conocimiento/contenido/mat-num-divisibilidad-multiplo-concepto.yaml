semantic_id: MAT.NUM.DIVISIBILIDAD.MULTIPLO_CONCEPTO
resumen_inicial: 'Un múltiplo de un entero $n$ es el producto de $n$ por cualquier
  número entero $k$: $m = n \cdot k$.'
explicacion_simple: 'Un número es múltiplo de otro cuando se obtiene de escalar o
  multiplicar ese número original por una cantidad entera de veces. Pensamos en dar
  saltos de tamaño fijo en la recta numérica: los lugares donde caemos corresponden
  exactamente a los múltiplos de esa longitud de salto.'
explicacion_formal: 'Dado un entero $n \in \mathbb{Z}$, el **Conjunto de Múltiplos**
  $M(n)$ se define como la imagen de la multiplicación por $n$ sobre los enteros:


  $$M(n) = \{ m \in \mathbb{Z} \mid \exists k \in \mathbb{Z}, \, m = n \cdot k \}$$


  **Desglose de la fórmula:**

  - $M(n)$: Conjunto infinito de los múltiplos enteros de $n$.

  - $k \in \mathbb{Z}$: Escalador o factor entero (positivo, negativo o cero).

  - $m = n \cdot k$: Condición algebraica de multiplicidad exacta.


  > **Complemento didáctico:** El cero es múltiplo de todo número entero ($0 = n \cdot
  0$), y todo entero $n$ es múltiplo de sí mismo ($n = n \cdot 1$).'
definiciones_clave: '- **Múltiplo de un número**: Resultado $m = n \cdot k$ producido
  al multiplicar $n$ por un entero $k$.

  - **Conjunto infinito**: Colección sin límite superior de múltiplos generados por
  $k \in \mathbb{Z}$.'
propiedades_relaciones: '- **Múltiplo universal del cero**: $0 \in M(n)$ para todo
  $n \in \mathbb{Z}$.'
ejemplo_guiado:
  enunciado: Compruebe si el número $35$ es un múltiplo del entero $7$ aplicando la
    definición $m = n \cdot k$.
  pasos:
  - 'Paso 1: Plantear la ecuación de multiplicidad: $35 = 7 \cdot k$.'
  - 'Paso 2: Buscar el número entero $k$: $k = 35 : 7 = 5 \in \mathbb{Z}$.'
  - 'Conclusión: Como existe el entero $k = 5$, $35$ es un múltiplo exacto de $7$
    ($35 \in M(7)$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición para que un número m sea múltiplo de n?
  choices:
  - text: Que exista un entero k tal que m = n · k
    is_correct: true
  - text: Que m sea menor que n
    is_correct: false
  - text: Que al dividir m por n la resta dé 1
    is_correct: false
  - text: Que m y n sean números primos
    is_correct: false
  explanation: La alternativa correcta es 'Que exista un entero k tal que m = n ·
    k'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 35 es múltiplo de 7?
  choices:
  - text: Porque 35 = 7 · 5 con 5 pertenenciente a los enteros
    is_correct: true
  - text: Porque 35 termina en 5
    is_correct: false
  - text: Porque 35 es impar
    is_correct: false
  - text: Porque 7 es un número primo
    is_correct: false
  explanation: La alternativa correcta es 'Porque 35 = 7 · 5 con 5 pertenenciente
    a los enteros'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el supuesto múltiplo $m$ entre el número base $n$.'
- 'Paso 2: Comprobar si el cociente obtenido $k$ es un entero exacto sin residuo.'
- 'Paso 3: Concluir que $m$ es múltiplo de $n$ si el cociente $k$ pertenece a $\mathbb{Z}$.'
errores_correccion: '- **Error 1: Creer que el número cero no es múltiplo de ningún
  número.** **Cómo corregirlo:** El cero es múltiplo de TODOS los enteros pues $n
  \cdot 0 = 0$.


  - **Error 2: Confundir múltiplo con divisor (pensar que los múltiplos de 12 son
  1, 2, 3, 4, 6, 12).** **Cómo corregirlo:** Los múltiplos son mayores o iguales al
  número (12, 24, 36, 48...); los divisores son los que dividen al número.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números es un múltiplo de 6?
  alternativas:
  - '42'
  - '15'
  - '8'
  respuesta: '42'
  solucion_pasos:
  - $42 = 6 \cdot 7$, por lo tanto 42 es múltiplo de 6.
- titulo: Ejemplo 2
  enunciado: Indique los primeros tres múltiplos positivos de 9.
  alternativas:
  - '{9, 18, 27}'
  - '{1, 3, 9}'
  - '{0, 9, 19}'
  respuesta: '{9, 18, 27}'
  solucion_pasos:
  - $9 \cdot 1 = 9$, $9 \cdot 2 = 18$, $9 \cdot 3 = 27$.
- titulo: ¿Es el cero un múltiplo de 15?
  respuesta: Sí
  solucion_pasos:
  - Sí, $15 \cdot 0 = 0$.
- titulo: ¿Es el número 4 un múltiplo del número 12?
  respuesta: 'No'
  solucion_pasos:
  - No, 4 es un divisor de 12, no un múltiplo.
errores_frecuentes:
- El número cero no es un múltiplo de ningún número entero positivo.
- Los múltiplos de un número entero $n$ son siempre menores o iguales que el número
  $n$.
- El conjunto de los múltiplos positivos de un número entero es un conjunto finito.
- Un número entero no se considera múltiplo de sí mismo.
- Multiplicar un número por un decimal produce siempre un múltiplo entero.
afirmaciones_verdaderas:
- Un número $m$ es múltiplo de $n$ si existe un entero $k$ tal que $m = n \cdot k$.
- El cero es múltiplo de todos los números enteros.
al_terminar_debes_poder: Al terminar serás capaz de identificar si un número es múltiplo
  de otro, verificando que responda a la estructura $m = n \cdot k$ con $k \in \mathbb{Z}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
