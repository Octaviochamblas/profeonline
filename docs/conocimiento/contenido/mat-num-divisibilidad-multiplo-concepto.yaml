semantic_id: MAT.NUM.DIVISIBILIDAD.MULTIPLO_CONCEPTO
resumen_inicial: "Un múltiplo de $a$ es cualquier número que resulta de multiplicar $a$ por $0, 1, 2, 3\\ldots$ Los múltiplos de un número son infinitos."
explicacion_simple: |
  Acomodas naranjas en cajas de 6: la primera tiene 6, la segunda 12, la tercera 18... Todos
  esos números son múltiplos de 6. Un múltiplo de un número es el resultado de
  multiplicarlo por 0, 1, 2, 3, etc. Para saber si 48 es múltiplo de 6, preguntas: ¿puedo
  llenar cajas de 6 exactas con 48? Sí: $48 \div 6 = 8$ exacto.
explicacion_formal: |
  $b$ es múltiplo de $a$ si existe un número natural $k$ (incluido el cero) tal que
  $b = a \cdot k$. El conjunto $M(a) = \{0, a, 2a, 3a, \ldots\}$ es infinito.
definiciones_clave: |
  **Múltiplo**: resultado de multiplicar un número por un natural. **$M(a)$**: conjunto de
  todos los múltiplos de $a$, infinito y sin elemento máximo.
propiedades_relaciones: |
  El $0$ es múltiplo de cualquier número natural. Todo número es múltiplo de sí mismo y de
  $1$. Los múltiplos de $a$ están igualmente espaciados en $a$ unidades en la recta numérica.
ejemplo_guiado:
  enunciado: "Determina si 63 es múltiplo de 9."
  pasos:
    - "Se divide: $63 \\div 9 = 7$ con resto $0$."
    - "El cociente es exacto, existe $k=7$ tal que $63=9\\cdot7$."
    - "Conclusión: 63 sí es múltiplo de 9."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estos números es múltiplo de cualquier número natural?"
    choices:
      - {text: "El $0$", is_correct: true}
      - {text: "El $1$", is_correct: false}
      - {text: "Ninguno lo es", is_correct: false}
      - {text: "Solo los pares", is_correct: false}
    explanation: "La correcta es El $0$: $a\\cdot0=0$ para cualquier $a$, así que el cero es múltiplo de todos."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 52 múltiplo de 8?"
    choices:
      - {text: "No, el resto es 4", is_correct: true}
      - {text: "Sí, el resto es 0", is_correct: false}
      - {text: "Sí, porque 52 es par", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, el resto es 4: $52\\div8=6$ con resto $4$ ($8\\cdot6=48$), no es exacto."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Dividir $b \div a$ y observar el resto.'
  - 'Paso 2: Si el resto es 0, existe $k$ tal que $b = a \cdot k$: $b$ es múltiplo de $a$.'
  - "Paso 3: Si el resto es distinto de 0, $b$ no es múltiplo de $a$."
errores_correccion: |
  Un error frecuente es creer que el 0 no es múltiplo de ningún número; en realidad es
  múltiplo de todos. Otro error es pensar que si $b$ es múltiplo de $a$, entonces $a$
  también es múltiplo de $b$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si 56 es múltiplo de 8."
    alternativas:
      - "Sí, $56=8\\times7$"
      - "No, sobra 2"
      - "No se puede determinar"
    respuesta: "Sí, $56=8\\times7$"
    solucion_pasos:
      - 'Se divide: $56 \div 8 = 7$ con resto $0$.'
      - 'El cociente es exacto, luego existe $k = 7$ tal que $56 = 8 \cdot 7$.'
      - "Conclusión: 56 sí es múltiplo de 8."
  - titulo: "Ejemplo 2"
    enunciado: "Determina si 45 es múltiplo de 6."
    alternativas:
      - "No, sobra 3"
      - "Sí, $45=6\\times7$"
      - "No se puede determinar"
    respuesta: "No, sobra 3"
    solucion_pasos:
      - 'Se divide: $45 \div 6 = 7$ con resto $3$ (ya que $6 \cdot 7 = 42$ y $45 - 42 = 3$).'
      - 'El resto es $3 \neq 0$, así que no existe $k$ natural con $45 = 6 \cdot k$.'
      - "Conclusión: 45 no es múltiplo de 6."
  - titulo: "¿Es 0 múltiplo de 7?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Se busca $k$ tal que $0 = 7 \cdot k$.'
      - 'Tomando $k = 0$: $7 \cdot 0 = 0$. La igualdad se cumple.'
      - "El 0 es múltiplo de 7 (y de cualquier número natural)."
  - titulo: "¿El conjunto de múltiplos de un número natural tiene un valor máximo?"
    respuesta: "No"
    solucion_pasos:
      - 'Los múltiplos de $a$ son $0, a, 2a, 3a, \ldots$: la secuencia no tiene fin.'
      - 'Para cualquier múltiplo $a \cdot k$ que se elija, siempre existe uno mayor: $a \cdot (k+1)$.'
      - "El conjunto $M(a)$ es infinito y no tiene elemento máximo."
errores_frecuentes:
  - "Un múltiplo de $n$ siempre es mayor que $n$."
  - "El número 0 no es múltiplo de ningún número natural."
  - "Si $b$ es múltiplo de $a$, entonces $a$ también es múltiplo de $b$."
  - "Los múltiplos de un número impar siempre son impares."
  - "El conjunto de múltiplos de cualquier número natural es finito."
al_terminar_debes_poder: |
  Determinar si un número es múltiplo de otro, y explicar por qué el conjunto de
  múltiplos de cualquier número natural es siempre infinito.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
