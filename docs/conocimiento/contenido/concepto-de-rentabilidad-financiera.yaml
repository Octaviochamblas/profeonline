resumen_inicial: 'La rentabilidad financiera es el porcentaje de ganancia o pérdida
  obtenido sobre una inversión inicial $K_0$, relacionando el beneficio neto producido
  con el capital invertido: $R\% = \left(\frac{K_f - K_0}{K_0}\right) \cdot 100\%$.'
explicacion_simple: La rentabilidad mide qué tan buen negocio fue una inversión. Muestra
  qué porcentaje del dinero invertido ganamos o perdimos al final del período. Por
  ejemplo, si invertimos \$100.000 y ganamos \$10.000, nuestra rentabilidad fue del
  10%.
explicacion_formal: 'Para un capital invertido $K_0 > 0$ y un valor de liquidación
  final $K_f$, la **Tasa de Rentabilidad Nomina $R\%$** es:


  $$R\% = \left( \frac{K_f - K_0}{K_0} \right) \cdot 100\% = \left( \frac{\text{Ganancia
  Neta}}{K_0} \right) \cdot 100\%$$


  **Relación Retorno-Riesgo:**

  - A mayor tasa de rentabilidad esperada $R\%$, mayor es el riesgo de variabilidad
  del capital final.'
definiciones_clave: '- **Rentabilidad financiera $R\%$**: Porcentaje de rendimiento
  $R\% = \left(\frac{K_f - K_0}{K_0}\right) \cdot 100\%$.'
propiedades_relaciones: '- **Rendimiento sobre el capital**: Mide el beneficio neto
  por cada peso invertido.'
ejemplo_guiado:
  enunciado: Una persona invierte \$200.000 en un fondo mutuo y retira \$216.000 al
    cabo de un año. Calcule la rentabilidad nominal.
  pasos:
  - 'Paso 1: Calcular la ganancia neta: $216.000 - 200.000 = 16.000$.'
  - 'Paso 2: Dividir entre el capital inicial: $\frac{16.000}{200.000} = 0,08$.'
  - 'Paso 3: Convertir a porcentaje: $0,08 \cdot 100\% = 8\%$.'
  - 'Conclusión: La rentabilidad de la inversión fue del $8\%$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la rentabilidad porcentual R% sobre
    un capital inicial K0?
  choices:
  - text: R% = ((Kf - K0) / K0) · 100%
    is_correct: true
  - text: R% = Kf · K0 · 100%
    is_correct: false
  - text: R% = (K0 / Kf) · 100%
    is_correct: false
  - text: R% = Kf - K0
    is_correct: false
  explanation: La alternativa correcta es 'R% = ((Kf - K0) / K0) · 100%'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para la inversión de $200.000 a $216.000, ¿cuál fue
    la rentabilidad?
  choices:
  - text: 8%
    is_correct: true
  - text: 16%
    is_correct: false
  - text: 10%
    is_correct: false
  - text: 6%
    is_correct: false
  explanation: La alternativa correcta es '8%'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la rentabilidad financiera
  $R\% = \left( \frac{K_f - K_0}{K_0} \right) \cdot 100\%$ de una inversión.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.RENTABILIDAD
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.RENTABILIDAD.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
