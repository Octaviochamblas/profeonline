semantic_id: MAT.NUM.FINANZAS.RENTABILIDAD
resumen_inicial: 'La rentabilidad financiera (ROI) mide la eficiencia de una inversión como el cociente porcentual entre el beneficio neto y el capital invertido: $\text{Rentabilidad} = \frac{V_F - C}{C} \cdot 100\%$.'
explicacion_simple: |
  La **rentabilidad** te dice qué tan bueno fue el negocio en términos de porcentaje:
  - Si compraste acciones por $\$500.000$ y las vendiste en $\$600.000$, ganaste $\$100.000$ netos.
  - Para saber la rentabilidad, divides la ganancia entre lo que pusiste al inicio ($\$100.000 \div $\$500.000$ = 0,20$) y multiplicas por 100. Tu **rentabilidad fue del $20\%$**.
  - Si vendes por menos de lo que compraste, la rentabilidad es **negativa** (pérdida de capital).

  ![Concepto de rentabilidad financiera](/static/img/nodos/concepto-de-rentabilidad-financiera-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **tasa de rentabilidad financiera o Retorno sobre la Inversión (ROI)** es la razón adimensional entre el beneficio económico neto obtenido (ganancia de capital más flujos intermedios) y el capital inicial invertido $C > 0$:
  $$\text{ROI} = \left(\frac{V_F + \sum D - C}{C}\right) \cdot 100\% = \left(\frac{\Delta V}{C}\right) \cdot 100\%$$
  donde:
  - $C$ es el **capital original desembolsado**.
  - $V_F$ es el **valor de liquidación o rescate final del activo**.
  - $\sum D$ es la **suma de dividendos, cupones o intereses percibidos** durante la tenencia.

  ### Estados de Rentabilidad
  - $\text{ROI} > 0 \implies$ Rendimiento positivo (crecimiento del capital).
  - $\text{ROI} = 0 \implies$ Rendimiento nulo (recuperación exacta del capital).
  - $\text{ROI} < 0 \implies$ Rendimiento negativo (pérdida patrimonial).

  ### Síntesis didáctica
  - Ecuación del ROI: $\text{ROI} = \frac{V_F - C}{C} \cdot 100\% = \left(\frac{V_F}{C} - 1\right) \cdot 100\%$.
  - Principio de comparación: Permite evaluar inversiones de distinto tamaño bajo una misma escala porcentual.
definiciones_clave: |
  - **Retorno sobre la Inversión (ROI)**: Medida porcentual de la ganancia o pérdida generada por un capital financiero.
  - **Ganancia de capital**: Incremento en el precio de mercado del activo entre la compra y la venta ($V_F - C$).
  - **Rendimiento por dividendos**: Ingresos periódicos generados por el activo independientemente de su valor de reventa.
propiedades_relaciones: |
  - **Relación Riesgo-Rentabilidad**: En los mercados financieros eficientes, a mayor rentabilidad esperada, mayor es la volatilidad y el riesgo de pérdida asumido.
  - **Anualización de la rentabilidad**: Para comparar inversiones de distinta duración, la rentabilidad se expresa en base anualizada efectiva.
ejemplo_guiado:
  enunciado: 'Un inversionista compra acciones por un valor de $\$500.000$ y las vende un año después en $\$600.000$. Durante el año recibió $\$20.000$ en dividendos. Calcula la rentabilidad total de la operación.'
  imagen: '/static/img/nodos/concepto-de-rentabilidad-financiera-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos la ganancia de capital: $600.000 - 500.000 = $\$100.00$0$.'
    - 'Paso 2: Sumamos los dividendos para obtener la ganancia neta total: $100.000 + 20.000 = $\$120.00$0$.'
    - 'Paso 3: Evaluamos el cociente respecto al capital inicial: $\frac{120.000}{500.000} = 0,24$.'
    - 'Paso 4: Multiplicamos por 100: $\text{ROI} = 0,24 \cdot 100\% = 24\%$. La rentabilidad total fue del **$24\%$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular el porcentaje de rentabilidad financiera (ROI) de una inversión?'
    choices:
      - {text: 'Dividir la ganancia neta entre el capital invertido y multiplicar por 100 ($\text{ROI} = \frac{\text{Ganancia Neta}}{\text{Capital Invertido}} \cdot 100\%$)', is_correct: true}
      - {text: 'Dividir el capital invertido entre la ganancia obtenida', is_correct: false}
      - {text: 'Multiplicar el valor de venta por el valor de compra', is_correct: false}
      - {text: 'Restar la ganancia al capital sin dividir', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir la ganancia neta entre el capital invertido y multiplicar por 100 ($\text{ROI} = \frac{\text{Ganancia Neta}}{\text{Capital Invertido}} \cdot 100\%$)''. Relaciona el beneficio con el esfuerzo monetario original.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si inviertes $\$1.000.000$ en un negocio y al cabo de un período recuperas $\$1.150.000$, ¿cuál es tu rentabilidad?'
    choices:
      - {text: '$15\%$, calculando $(150.000 / 1.000.000) \cdot 100\% = 15\%$', is_correct: true}
      - {text: '$115\%$, tomando el monto final directo', is_correct: false}
      - {text: '$1,5\%$, dividiendo por 10', is_correct: false}
      - {text: '$30\%$, duplicando la tasa', is_correct: false}
    explanation: 'La alternativa correcta es ''$15\%$, calculando $(150.000 / 1.000.000) \cdot 100\% = 15\%$''. La ganancia neta fue de $\$150.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el capital original invertido ($C$).'
  - 'Paso 2: Determinar los ingresos totales obtenidos (valor final de venta más dividendos o intereses percibidos).'
  - 'Paso 3: Calcular la ganancia neta restando el capital inicial a los ingresos totales.'
  - 'Paso 4: Dividir la ganancia neta entre el capital inicial y multiplicar por 100 para obtener el ROI porcentual.'
errores_correccion: |
  - **Error 1:** Dividir la ganancia entre el valor final de venta en lugar de dividir entre el capital inicial. **Cómo corregirlo:** La rentabilidad mide el retorno **SOBRE el capital que invertiste originalmente**: **$\frac{\text{Ganancia}}{C}$**.
  - **Error 2:** Omitir los dividendos o intereses cobrados al evaluar el resultado final de la inversión. **Cómo corregirlo:** El rendimiento total **incluye tanto la ganancia de capital como los flujos de caja periódicos**.
ejemplos:
  - titulo: 'Rentabilidad con ganancia de capital'
    enunciado: 'Si compraste un bien en $\$200.000$ y lo vendiste en $\$260.000$, ¿cuál fue la rentabilidad?'
    alternativas:
      - '$30\%$'
      - '$60\%$'
      - '$20\%$'
    respuesta: '$30\%$'
    solucion_pasos:
      - '1. Ganancia: $260.000 - 200.000 = $\$60.00$0$.'
      - '2. $\text{ROI} = (60.000 / 200.000) \cdot 100\% = 30\%$.'
  - titulo: 'Rentabilidad negativa (pérdida)'
    enunciado: 'Si invertiste $\$100.000$ y vendiste en $\$85.000$, ¿cuál es la rentabilidad?'
    alternativas:
      - '$-15\%$'
      - '$15\%$'
      - '$-85\%$'
    respuesta: '$-15\%$'
    solucion_pasos:
      - '1. Ganancia neta: $85.000 - 100.000 = -$\$15.00$0$.'
      - '2. $\text{ROI} = (-15.000 / 100.000) \cdot 100\% = -15\%$.'
  - titulo: 'Comparación de dos inversiones'
    enunciado: '¿Una inversión de $\$100.000$ que gana $\$20.000$ es más rentable porcentualmente que una de $\$1.000.000$ que gana $\$100.000$?'
    alternativas:
      - 'Sí, porque rinde un $20\%$ frente al $10\%$ de la segunda'
      - 'No, porque $\$100.000$ es más dinero que $\$20.000$'
      - 'No, ambas tienen la misma rentabilidad'
    respuesta: 'Sí, porque rinde un $20\%$ frente al $10\%$ de la segunda'
    solucion_pasos:
      - '1. Inversión 1: $20.000 / 100.000 = 20\%$.'
      - '2. Inversión 2: $100.000 / 1.000.000 = 10\%$.'
      - '3. $20\% > 10\%$.'
  - titulo: 'Rentabilidad nula'
    enunciado: 'Si compras un activo en $\$500.000$ y lo vendes en $\$500.000$ sin costos, ¿la rentabilidad es $0\%$?'
    alternativas:
      - 'Sí, porque no hubo ganancia ni pérdida de capital'
      - 'No, es del $100\%$'
      - 'No, es negativa'
    respuesta: 'Sí, porque no hubo ganancia ni pérdida de capital'
    solucion_pasos:
      - '1. $(500.000 - 500.000) / 500.000 = 0\%$.'
errores_frecuentes:
  - 'La rentabilidad financiera se calcula dividiendo la ganancia neta entre el valor final de venta del activo.'
  - 'El valor total final de liquidación se entrega directamente como la rentabilidad porcentual de la inversión.'
  - 'Una inversión que genera una pérdida de capital presenta un porcentaje de rentabilidad positivo.'
  - 'Los dividendos percibidos durante la tenencia del activo se restan de la ganancia de capital.'
  - 'Una inversión con mayor monto de ganancia en dinero es obligatoriamente más rentable que otra con menor monto.'
afirmaciones_verdaderas:
  - 'La rentabilidad financiera es el cociente porcentual entre el beneficio neto y el capital inicial invertido ($\text{ROI} = \frac{V_F - C}{C} \cdot 100\%$).'
  - 'El porcentaje de rentabilidad permite contrastar objetivamente la eficiencia de inversiones de diferente escala monetaria.'
