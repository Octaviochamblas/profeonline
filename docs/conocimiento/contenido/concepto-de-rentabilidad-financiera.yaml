procedimiento:
- 'Paso 1: Identifica tu Inversión Inicial (cuánto dinero pusiste).'
- 'Paso 2: Calcula la ganancia neta (Valor Final - Inversión Inicial).'
- 'Paso 3: Divide la ganancia por la inversión inicial y multiplica por 100 para obtener el
  porcentaje de rentabilidad.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de rentabilidad
  financiera.
ejemplos:
- titulo: Rentabilidad de un negocio
  enunciado: Invertiste $100.000 en comprar fundas de celulares. Las vendiste todas y recibiste
    $150.000. ¿Cuál fue tu rentabilidad?
  solucion_pasos:
  - Inversión Inicial = $100.000.
  - Ganancia = $150.000 - 100.000 = 50.000$.
  - Rentabilidad = $(50.000 / 100.000) \cdot 100 = 0.5 \cdot 100 = 50\%$.
  - Obtuviste un 50% de rentabilidad.
- titulo: Ejemplo 2
  enunciado: Invertiste 50.000 pesos y recibiste 65.000 pesos. ¿Cuál es tu rentabilidad?
  alternativas:
  - 30%
  - 15%
  - 130%
  respuesta: 30%
  solucion_pasos:
  - (65.000 menos 50.000) dividido entre 50.000 es igual a 0,30, o sea 30%.
- titulo: Ejemplo 3
  enunciado: Invertiste 300.000 pesos y recibiste 270.000 pesos. ¿Cuál es tu rentabilidad?
  alternativas:
  - -10%
  - -30.000%
  - 10%
  respuesta: -10%
  solucion_pasos:
  - (270.000 menos 300.000) dividido entre 300.000 es igual a -0,10, o sea -10%.
- titulo: ¿Existen inversiones de alta rentabilidad y riesgo cero de forma legítima?
  respuesta: 'No'
  solucion_pasos:
  - Quien promete eso, probablemente ofrece una estafa piramidal.
errores_frecuentes:
- Dividir el Valor Final completo (y no solo la ganancia) sobre la Inversión, lo que daría
  rentabilidades infladas superiores al 100% en el ejemplo anterior.
- Ignorar el efecto de la inflación (si el banco te da 5% de rentabilidad pero la inflación
  es 6%, tu rentabilidad 'real' es negativa).
- Dividir el Valor Final completo, y no solo la ganancia, sobre la inversión inicial, lo que
  infla artificialmente la rentabilidad.
- Ignorar el efecto de la inflación al evaluar si una rentabilidad realmente representa una
  ganancia.
- Confundir la rentabilidad con el monto total recibido, sin restar primero la inversión inicial.
afirmaciones_verdaderas:
- La propiedad de concepto de rentabilidad financiera preserva la consistencia lógica.
- A mayor rentabilidad esperada de una inversión, generalmente mayor es el riesgo de perder
  el capital invertido.
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de rentabilidad
  financiera.
