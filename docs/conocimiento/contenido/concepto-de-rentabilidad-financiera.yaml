semantic_id: MAT.NUM.FINANZAS_PERSONALES.RENTABILIDAD
resumen_inicial: 'Concepto de rentabilidad financiera: concepto y propiedades fundamentales
  en Finanzas personales.'
explicacion_simple: ¿Dejar la plata bajo el colchón o meterla al banco? Si la dejas en el
  colchón, la inflación se la comerá. Si la inviertes, esperas que te pague un premio por
  usarla. Ese premio es la rentabilidad.
explicacion_formal: 'La **Rentabilidad** es la variación porcentual positiva de una inversión.


  Fórmula:

  $\text{Rentabilidad } \% = \left( \frac{\text{Ganancia Obtenida}}{\text{Capital Inicial
  Invertido}} \right) \cdot 100$$


  - **Inversión de bajo riesgo:** Como un Depósito a Plazo. Te pagan poco (ej. $5\%$ anual),
  pero tu dinero está 100% seguro.

  - **Inversión de alto riesgo:** Como comprar acciones o criptomonedas. Puedes ganar mucho
  (ej. $30\%$ anual), pero también puedes perder tu capital inicial (rentabilidad negativa).


  **Regla de oro financiera:** A mayor rentabilidad esperada, mayor es el riesgo de perder
  tu dinero. No existen inversiones de alta rentabilidad y riesgo cero (quien prometa eso,
  probablemente ofrezca una estafa piramidal).'
definiciones_clave: '- **Concepto de rentabilidad financiera**: Elemento central dentro del
  estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a concepto de rentabilidad financiera.'
ejemplo_guiado:
  enunciado: Invertiste 200.000 pesos en un pequeño negocio de reventa y al final del mes
    recibiste 260.000 pesos. Calcula tu rentabilidad.
  pasos:
  - 'Calculo la ganancia neta: 260.000 menos 200.000 es igual a 60.000.'
  - 'Divido la ganancia por la inversión inicial: 60.000 dividido entre 200.000 es igual a
    0,30.'
  - 'Multiplico por 100: 0,30 por 100 es igual a 30. Obtuviste un 30% de rentabilidad.'
