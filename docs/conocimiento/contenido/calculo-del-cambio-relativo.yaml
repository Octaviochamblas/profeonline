semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_RELATIVO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: 'El cambio relativo o variación porcentual mide la proporción del
  cambio absoluto respecto al valor inicial de referencia: $\text{Var}(\%) = \left(\frac{V_f
  - V_i}{V_i}\right) \cdot 100\%$.'
explicacion_simple: 'El cambio relativo te dice qué porcentaje representó la ganancia
  o pérdida respecto a la cantidad de partida. Un aumento de $\$5.000$ no significa
  lo mismo sobre una base de $\$10.000$ (+50%) que sobre una base de $\$500.000$ (+1%).
  Por eso dividimos siempre por el valor inicial y multiplicamos por 100%.


  ![calculo-del-cambio-relativo](/static/img/nodos/calculo-del-cambio-relativo-intro.svg)

  '
explicacion_formal: 'Para un valor inicial de referencia $V_i > 0$ y un valor final
  $V_f$, el **Cambio Relativo** o **Variación Porcentual** se define formalmente como:


  $$\text{Variación Relativa (\%)} = \left(\frac{\Delta V}{V_i}\right) \cdot 100\%
  = \left(\frac{V_f - V_i}{V_i}\right) \cdot 100\%$$


  **Propiedades:**

  - Si $V_f > V_i \implies \text{Var}(\%) > 0$ (aumento relativo porcentual).

  - Si $V_f < V_i \implies \text{Var}(\%) < 0$ (disminución relativa porcentual).

  - Es una cantidad adimensional expresada en porcentaje.'
definiciones_clave: '- **Cambio relativo**: Cociente normalizado entre la variación
  absoluta $\Delta V$ y el valor inicial $V_i$.

  - **Base de comparación**: El valor inicial $V_i$, que representa siempre el $100\%$
  de referencia.'
propiedades_relaciones: '- **Independencia de escala**: Permite comparar la magnitud
  del cambio entre magnitudes de escalas completamente dispares.

  - **Signo**: Conserva el mismo signo algebraico que el cambio absoluto $\Delta V$.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-cambio-relativo-resumen.svg)


  QUÉ: Calcular y comparar la variación porcentual entre dos valores. CÓMO: Aplicando
  la fórmula $\text{Var}(\%) = \left(\frac{V_f - V_i}{V_i}\right) \cdot 100\%$ y asociando
  el signo al aumento o reducción correspondiente.'
