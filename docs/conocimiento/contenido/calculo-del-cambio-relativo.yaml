procedimiento:
- 'Paso 1: Calcular la diferencia absoluta en el numerador: $\Delta V = V_f - V_i$.'
- 'Paso 2: Dividir por el valor inicial $V_i$ en el denominador (base del 100%).'
- 'Paso 3: Multiplicar por $100\%$ para obtener la tasa de variación relativa.'
ejemplo_guiado:
  enunciado: Un artículo que costaba $\$40.000$ pasa a costar $\$50.000$. Calcule la variación
    porcentual de su precio.
  pasos:
  - 'Paso 1: Identificar $V_i = 40.000$ y $V_f = 50.000$.'
  - 'Paso 2: Calcular la variación absoluta: $\Delta V = 50.000 - 40.000 = +10.000$.'
  - 'Paso 3: Dividir por el valor inicial: $\frac{10.000}{40.000} = 0,25$.'
  - 'Paso 4: Multiplicar por $100\%$: $0,25 \cdot 100\% = +25\%$.'
  - 'Conclusión: El precio experimentó un aumento relativo del $+25\%$.'
  imagen: /static/img/nodos/calculo-del-cambio-relativo-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué valor debe colocarse SIEMPRE en el denominador al calcular la variación
    porcentual?
  choices:
  - text: El valor inicial $V_i$
    is_correct: true
  - text: El valor final $V_f$
    is_correct: false
  - text: El promedio entre $V_i$ y $V_f$
    is_correct: false
  - text: El cambio absoluto $\Delta V$
    is_correct: false
  explanation: La base del $100\%$ de referencia es siempre el valor de partida inicial
    $V_i$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una acción bursátil cae de $\$1.000$ a $\$800$, ¿cuál fue su variación
    porcentual?
  choices:
  - text: $-20\%$
    is_correct: true
  - text: $-25\%$
    is_correct: false
  - text: $+20\%$
    is_correct: false
  - text: $-80\%$
    is_correct: false
  explanation: $\text{Var} = \frac{800 - 1.000}{1.000} \cdot 100\% = \frac{-200}{1.000}
    \cdot 100\% = -20\%$.
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Poner el valor final $V_f$ en el denominador.**
  **Cómo corregirlo:** Recordar que el cambio se mide respecto a dónde comenzó la
  situación ($V_i$).

  - **Error 2: Olvidar el signo negativo en disminuciones.** **Cómo corregirlo:**
  Si $V_f < V_i$, la resta en el numerador da negativa y debe conservarse el signo
  ($-$).'
ejemplos:
- titulo: Crecimiento de usuarios en una app
  enunciado: Una aplicación pasa de $200.000$ usuarios activos a $260.000$ en un mes.
    ¿Cuál fue su crecimiento relativo?
  alternativas:
  - $+30\%$
  - $+60\%$
  - $+25\%$
  - $+130\%$
  respuesta: $+30\%$
  solucion_pasos:
  - Identificar $V_i = 200.000$ y $V_f = 260.000$.
  - 'Calcular: $\frac{260.000 - 200.000}{200.000} = \frac{60.000}{200.000} = 0,30$.'
  - 'Convertir a porcentaje: $0,30 \cdot 100\% = +30\%$.'
- titulo: Caída en el tiempo de espera
  enunciado: El tiempo de espera en una fila de atención se redujo de $50\text{ minutos}$
    a $35\text{ minutos}$. ¿Cuál fue la variación relativa?
  alternativas:
  - $-30\%$
  - $-15\%$
  - $-35\%$
  - $-70\%$
  respuesta: $-30\%$
  solucion_pasos:
  - 'Calcular: $\frac{35 - 50}{50} = \frac{-15}{50} = -0,30$.'
  - 'Multiplicar por $100\%$: $-0,30 \cdot 100\% = -30\%$.'
- titulo: ¿Si una cantidad se duplica de 100 a 200, el cambio relativo es del +100%?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\frac{200 - 100}{100} \cdot 100\% = \frac{100}{100} \cdot 100\% =
    +100\%$.
- titulo: ¿Si una cantidad pasa de 50 a 100, la variación relativa es del +200%?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $\frac{100 - 50}{50} \cdot 100\% = \frac{50}{50} \cdot 100\% = +100\%$
    (el valor final es el $200\%$, pero la variación es $+100\%$).
errores_frecuentes:
- Usar el valor final como denominador al calcular la variación.
- Confundir el porcentaje que representa el valor final con el porcentaje de variación.
- Omitir el signo negativo cuando hay reducción.
afirmaciones_verdaderas:
- El denominador de la fórmula de cambio relativo siempre es el valor inicial $V_i$.
- Una variación del $+100\%$ significa que la cantidad se ha duplicado.
