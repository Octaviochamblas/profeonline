semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_RELATIVO
resumen_inicial: 'Cálculo del cambio relativo: concepto y propiedades fundamentales
  en Variaciones porcentuales.'
explicacion_simple: 'Si a un billonario se le pierden 1.000 pesos, no le importa.
  Si a ti se te pierden 1.000 pesos, ¡es un problema! El cambio absoluto es igual,
  pero el ''Cambio Relativo'' (el impacto) es gigante para ti. Eso es el cambio relativo:
  medir el impacto respecto al origen.'
explicacion_formal: 'El **Cambio Relativo** transforma la diferencia absoluta en un
  porcentaje respecto al Valor Inicial. Nos permite comparar justamente.


  Fórmula fundamental:

  $\text{Variación } \% = \left( \frac{\text{Valor Final} - \text{Valor Inicial}}{\text{Valor
  Inicial}} \right) \cdot 100$$


  - O más simple: **$\frac{\text{Cambio Absoluto}}{\text{Valor Inicial}} \cdot 100$**


  Si el resultado es positivo (ej. $+15\%$), hubo un crecimiento del 15%. Si es negativo
  (ej. $-10\%$), hubo una contracción o descuento del 10%.'
definiciones_clave: '- **Cálculo del cambio relativo**: Elemento central dentro del
  estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del cambio relativo.'
ejemplo_guiado:
