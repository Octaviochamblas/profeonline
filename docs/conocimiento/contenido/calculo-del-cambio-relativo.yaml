resumen_inicial: 'El cambio relativo (o variación porcentual) compara la diferencia
  absoluta con respecto al valor inicial $V_i$, expresándose como tasa o porcentaje:
  $\frac{\Delta V}{V_i} = \frac{V_f - V_i}{V_i} \cdot 100\%$.'
explicacion_simple: El cambio relativo nos dice qué porcentaje representó el aumento
  o la caída respecto al valor de partida. Se calcula dividiendo la diferencia ($V_f
  - V_i$) entre el valor inicial $V_i$ y multiplicando por 100.
explicacion_formal: 'Para un valor inicial $V_i > 0$ y un valor final $V_f$, el **Cambio
  Relativo Porcentual $\Delta\%$** se define como:


  $$\Delta\% = \left( \frac{V_f - V_i}{V_i} \right) \cdot 100\%$$


  **Punto de referencia invariable:**

  - El denominador de la variación porcentual es SIEMPRE el valor inicial de referencia
  $V_i$.'
definiciones_clave: '- **Cambio relativo porcentual $\Delta\%$**: Tasa $\frac{V_f
  - V_i}{V_i} \cdot 100\%$ referida al estado de partida $V_i$.'
propiedades_relaciones: '- **Denominador de referencia**: El divisor es estrictamente
  $V_i$, nunca $V_f$.'
ejemplo_guiado:
  enunciado: Un artículo subió de \$8.000 a \$10.000. Calcule la variación porcentual.
  pasos:
  - 'Paso 1: Calcular la diferencia absoluta: $\Delta V = 10.000 - 8.000 = 2.000$.'
  - 'Paso 2: Dividir entre el valor inicial $V_i = 8.000$: $\frac{2.000}{8.000} =
    0,25$.'
  - 'Paso 3: Convertir a porcentaje: $0,25 \cdot 100\% = 25\%$.'
  - 'Conclusión: La variación porcentual fue un aumento del $25\%$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué valor actúa obligatoriamente como denominador al calcular la variación
    porcentual?
  choices:
  - text: El valor inicial de partida Vi
    is_correct: true
  - text: El valor final Vf
    is_correct: false
  - text: El número 100 solamente
    is_correct: false
  - text: La diferencia entre los dos
    is_correct: false
  explanation: La alternativa correcta es 'El valor inicial de partida Vi'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el artículo de $8.000 a $10.000, ¿cuál fue el
    cambio relativo?
  choices:
  - text: 25% de aumento
    is_correct: true
  - text: 20% de aumento
    is_correct: false
  - text: 2.000% de aumento
    is_correct: false
  - text: 12,5% de aumento
    is_correct: false
  explanation: La alternativa correcta es '25% de aumento'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el cambio relativo o
  variación porcentual $\Delta\% = \left( \frac{V_f - V_i}{V_i} \right) \cdot 100\%$.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_RELATIVO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_RELATIVO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
