procedimiento:
- 'Paso 1: Confirma que sea una suma y que ambas potencias sean iguales e IMPARES.'
- 'Paso 2: Escribe el factor corto (binomio) como la suma de las bases: $(a + b)$.'
- 'Paso 3: Para el polinomio largo, empieza con la primera base elevada a $n-1$.'
- 'Paso 4: Alterna los signos: $+ - + - +$ terminando siempre en positivo.'
- 'Paso 5: En cada término subsiguiente, réstale 1 al exponente de $a$, y súmale 1
  al exponente de $b$ hasta llegar a $b^{n-1}$.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización de suma de potencias impares iguales.
ejemplos:
- titulo: Factoriza $m^7 + 1$
  enunciado: Factoriza $m^7 + 1$.
  solucion_pasos:
  - 'Factor corto: $(m + 1)$.'
  - Grado menos 1 es $m^6$.
  - 'Polinomio: $m^6 - m^5(1) + m^4(1)^2 - m^3(1)^3 + m^2(1)^4 - m(1)^5 + (1)^6$.'
  - 'Resultado: $(m + 1)(m^6 - m^5 + m^4 - m^3 + m^2 - m + 1)$.'
- titulo: ¿Cuál es el binomio corto al factorizar $x^5 + 32$?
  solucion_pasos:
  - Como 32 es $2^5$, la expresión es $x^5 + 2^5$. Las bases son $x$ y $2$, por ende
    el binomio es $(x+2)$.
- titulo: 'Respecto de «Factorización de suma de potencias impares iguales»: ¿Describe
    adecuadamente el'
  enunciado: 'Respecto de «Factorización de suma de potencias impares iguales»: ¿Describe
    adecuadamente el concepto esta frase? «La expresión $a^n + b^n$ (donde $n$ es
    impar: 5, 7, 9.) siempre es divisible por $(a+b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La expresión $a^n + b^n$ (donde
    $n$ es impar: 5, 7, 9.) siempre es divisible por $(a+b)$.'
- titulo: 'Respecto de «Factorización de suma de potencias impares iguales»: ¿Se puede
    aceptar esta afi'
  enunciado: 'Respecto de «Factorización de suma de potencias impares iguales»: ¿Se
    puede aceptar esta afirmación? «Intentar aplicar esta regla a sumas de potencias
    PARES (ej. $x^4 + y^4$), lo cual es matemáticamente imposible en los reales»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La expresión $a^n + b^n$ (donde
    $n$ es impar: 5, 7, 9.) siempre es divisible por $(a+b)$.'
errores_frecuentes:
- Intentar aplicar esta regla a sumas de potencias PARES (ej. $x^4 + y^4$), lo cual
  es matemáticamente imposible en los reales.
- Olvidar alternar los signos y ponerlos todos positivos.
- Para «¿Qué patrón de signos debe tener el polinomio largo al factorizar una suma
  de potencias impares», la respuesta correcta es Todos positivos.
- Para «¿Qué patrón de signos debe tener el polinomio largo al factorizar una suma
  de potencias impares», la respuesta correcta es Todos negativos.
- Alternados, comenzando con negativo (- + - +).
