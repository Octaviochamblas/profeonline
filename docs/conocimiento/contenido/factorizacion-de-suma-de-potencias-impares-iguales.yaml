resumen_inicial: La factorización de suma de potencias impares iguales generaliza
  la suma de cubos descomponiendo $a^n + b^n$ (con $n$ impar) en $(a + b)(a^{n-1}
  - a^{n-2}b + \dots + b^{n-1})$.
explicacion_simple: 'Para factorizar expresiones como $x^5 + y^5$, donde el exponente
  $5$ es impar, el primer paréntesis es la suma de las bases $(x + y)$. El segundo
  paréntesis empieza con $x^4$ y va bajando los exponentes de $x$ mientras sube los
  de $y$, alternando los signos: $(x^4 - x^3 y + x^2 y^2 - x y^3 + y^4)$.'
explicacion_formal: 'Sea $n \in \mathbb{N}$ un número impar ($n = 2k + 1$). La **Factorización
  de Suma de Potencias Impares Iguales** establece la identidad algebrica en $\mathbb{R}$:


  $$A^n + B^n = (A + B) \sum_{j=0}^{n-1} (-1)^j A^{n-1-j} B^j$$


  **Desglose simbólico:**

  - $(A + B)$: Factor binomio suma inicial obligatorio por la existencia de la raíz
  $A = -B$.

  - $\sum_{j=0}^{n-1} (-1)^j A^{n-1-j} B^j = A^{n-1} - A^{n-2}B + A^{n-3}B^2 - \dots
  + B^{n-1}$: Polinomio homogéneo alternado de grado $n-1$.

  - Alternancia de signos: El primer término es $+$, el segundo $-$, el tercero $+$,
  finalizando siempre en $+$ por ser $n-1$ par.


  > **Complemento didáctico:** Muestra que la suma de cubos $A^3 + B^3$ es simplemente
  el caso particular con $n = 3$.'
definiciones_clave: '- **Exponente impar $n$**: Condición aritmética $n \in \{3, 5,
  7, \dots\}$ que permite la raíz real $A = -B$.

  - **Polinomio homogéneo alternado**: Expresión polinomial de signos $+,-,+,-$ donde
  la suma de exponentes de cada término es $n-1$.'
propiedades_relaciones: '- **Infactorizabilidad de potencias pares**: La suma $A^n
  + B^n$ con $n$ par no admite esta descomposición en $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: Factorice la suma de potencias impares iguales $x^5 + 32$.
  pasos:
  - 'Paso 1: Identificar el exponente impar $n = 5$ y reescribir $32$ como potencia:
    $32 = 2^5$.'
  - 'Paso 2: Obtener las bases $A = x$ y $B = 2$.'
  - 'Paso 3: Construir el primer factor binomio suma $(A + B)$: $(x + 2)$.'
  - 'Paso 4: Construir el polinomio de grado 4 alternando signos desde $A^4 = x^4$
    hasta $B^4 = 2^4 = 16$:'
  - '  - $x^4 - x^3(2) + x^2(2^2) - x(2^3) + 2^4 = x^4 - 2x^3 + 4x^2 - 8x + 16$.'
  - 'Paso 5: Multiplicar los factores: $(x + 2)(x^4 - 2x^3 + 4x^2 - 8x + 16)$.'
  - 'Conclusión: La factorización de $x^5 + 32$ es $(x + 2)(x^4 - 2x^3 + 4x^2 - 8x
    + 16)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplir el exponente $n$ para que la suma de potencias
    $A^n + B^n$ sea factorizable por $(A + B)$ en $\mathbb{R}$?
  choices:
  - text: El exponente $n$ debe ser un número entero impar
    is_correct: true
  - text: El exponente $n$ debe ser un número par
    is_correct: false
  - text: El exponente $n$ debe ser menor que 2
    is_correct: false
  - text: El exponente $n$ debe ser múltiplo de 4
    is_correct: false
  explanation: La alternativa correcta es 'El exponente $n$ debe ser un número entero
    impar'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $x^5 + 32$ con bases $x$ y $2$, ¿cuál es el primer factor
    binomio obtenido?
  choices:
  - text: $(x + 2)$
    is_correct: true
  - text: $(x - 2)$
    is_correct: false
  - text: $(x + 32)$
    is_correct: false
  - text: $(x^5 + 2)$
    is_correct: false
  explanation: La alternativa correcta es '$(x + 2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el exponente $n$ sea impar y expresar ambos términos en la
  forma $A^n + B^n$.'
- 'Paso 2: Escribir el primer paréntesis binomio como la suma de las bases $(A + B)$.'
- 'Paso 3: Desarrollar el polinomio de grado $n-1$ disminuyendo la potencia de $A$,
  aumentando la de $B$ y alternando signos (+, -, +, -, ...).'
errores_correccion: '- **Error 1: Intentar aplicar la regla a sumas con exponente
  par como $x^4 + y^4$ en $\mathbb{R}$.** **Cómo corregirlo:** Las sumas de potencias
  pares iguales no admiten factores lineales reales; la regla requiere estrictamente
  $n$ impar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice $a^5 + b^5$.
  alternativas:
  - $(a + b)(a^4 - a^3b + a^2b^2 - ab^3 + b^4)$
  - $(a + b)(a^4 + a^3b + a^2b^2 + ab^3 + b^4)$
  - $(a - b)(a^4 + a^3b + a^2b^2 + ab^3 + b^4)$
  respuesta: $(a + b)(a^4 - a^3b + a^2b^2 - ab^3 + b^4)$
  solucion_pasos:
  - 1. Exponente 5 impar.
  - 2. Binomio $(a + b)$ y polinomio de signos alternados.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada de $m^7 + n^7$?
  alternativas:
  - $(m + n)(m^6 - m^5n + m^4n^2 - m^3n^3 + m^2n^4 - mn^5 + n^6)$
  - $(m - n)(m^6 + m^5n + m^4n^2 + m^3n^3 + m^2n^4 + mn^5 + n^6)$
  - $(m + n)^7$
  respuesta: $(m + n)(m^6 - m^5n + m^4n^2 - m^3n^3 + m^2n^4 - mn^5 + n^6)$
  solucion_pasos:
  - 1. Exponente 7 impar.
  - 2. Binomio $(m + n)$ con polinomio alternado de grado 6.
- titulo: En la suma de potencias impares $A^n + B^n$, ¿los signos del segundo factor
    se van alternando entre positivo y negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, la estructura sigue el patrón $+ , - , + , - , \dots$.
- titulo: ¿Se puede factorizar $x^4 + 16$ en los reales usando la regla de potencias
    impares?
  respuesta: 'No'
  solucion_pasos:
  - No, el exponente 4 es par, por lo que no aplica este teorema.
errores_frecuentes:
- Intentar factorizar sumas de potencias pares cuadráticas o cuárticas en $\mathbb{R}$
  usando este método.
- Mantener todos los signos positivos en el polinomio de grado $n-1$ en lugar de alternar
  $+,-,+,-$.
- Declarar que el grado del polinomio en el segundo paréntesis es igual a $n$ en vez
  de $n-1$.
- Cambiar el primer paréntesis binomio a resta $(A - B)$ al factorizar una suma de
  potencias.
- Dejar fuera las potencias intermedias de las bases al construir el polinomio de
  grado $n-1$.
afirmaciones_verdaderas:
- La suma $A^n + B^n$ es divisible exactamente por $(A + B)$ cuando $n$ es impar.
- El polinomio secundario resultante de factorizar $A^n + B^n$ posee grado $n-1$ y
  alterna los signos de sus términos.
al_terminar_debes_poder: Al terminar serás capaz de factorizar sumas de potencias
  impares iguales expresándolas en la forma $(A + B)(A^{n-1} - \dots + B^{n-1})$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / Factorización de Potencias.
