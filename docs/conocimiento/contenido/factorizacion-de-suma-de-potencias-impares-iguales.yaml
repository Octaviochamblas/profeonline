semantic_id: MAT.ALG.FACTOR_CUBOS.SUMA_POTENCIAS_IMPARES
resumen_inicial: 'Factorización de suma de potencias impares iguales: concepto, método
  de descomposición y reglas en Factorización asociada a cubos.'
explicacion_simple: Los cubos no son los únicos privilegiados. La regla que permite
  factorizar $x^3 + y^3$ es solo la punta del iceberg de una ley matemática más grande.
  Toda suma de potencias impares iguales puede descomponerse siguiendo un elegante
  patrón rítmico.
explicacion_formal: '### Definición formal


  La alternancia asegura que todos los términos cruzados se cancelen mutuamente en
  la multiplicación.


  ### Desarrollo didáctico


  Pensemos en $x^5 + y^5$ (Suma de quintas potencias).

  Como 5 es impar, SABEMOS que uno de los factores será $(x + y)$.


  ¿Cómo construimos el paréntesis grande?

  1. Empezamos con la primera letra elevada a un grado menos: $x^4$.

  2. Los signos deben ALTERNARSE: si empezamos positivo, el siguiente es negativo.

  3. En cada término que avanza, la ''x'' baja un grado y la ''y'' sube un grado (apareciendo
  desde la nada como $y^1$).


  Veamos la danza:

  $+x^4$

  $-x^3 y^1$

  $+x^2 y^2$

  $-x^1 y^3$

  $+y^4$


  Unimos todo. $x^5 + y^5 = (x + y)(x^4 - x^3 y + x^2 y^2 - x y^3 + y^4)$.

  Este patrón de exponentes en escalera (uno baja, el otro sube) aplica para el grado
  7, 9, 11. para el infinito impar.'
