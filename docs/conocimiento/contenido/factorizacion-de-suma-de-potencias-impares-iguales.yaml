semantic_id: MAT.ALG.FACTOR_CUBOS.SUMA_POTENCIAS_IMPARES
resumen_inicial: 'La factorización de suma de potencias impares iguales establece la generalización de cubos para cualquier
  exponente impar $n$: $A^n + B^n = (A + B)(A^{n-1} - A^{n-2}B + A^{n-3}B^2 - \dots + B^{n-1})$.'
explicacion_simple: "Las sumas de cubos ($A^3 + B^3$) son sólo un caso particular de una regla más amplia para **cualquier\
  \ exponente impar igual** ($A^5 + B^5, A^7 + B^7, \\dots$):\n- **REGLA GENERAL PARA SUMA DE POTENCIAS IMPARES ($n = 3, 5,\
  \ 7, \\dots$)**:\n  $$\\mathbf{A^n + B^n = (A + B)(A^{n-1} - A^{n-2}B + A^{n-3}B^2 - \\dots + B^{n-1})}$$\n- **Características\
  \ del polinomio largo de $n$ términos**:\n  1. **Binomio Suma $(A + B)$**: Siempre empieza con la suma de las bases.\n \
  \ 2. **Los exponentes de $A$ bajan**: Empieza en $A^{n-1}$ y disminuye de a 1 hasta llegar a $A^0 = 1$.\n  3. **Los exponentes\
  \ de $B$ suben**: Empieza en $B^0 = 1$ y aumenta de a 1 hasta llegar a $B^{n-1}$.\n  4. **Signos alternados**: $+ , - ,\
  \ + , - , + , \\dots$\n- **Ejemplo con $n = 5$ ($x^5 + y^5$)**:\n  $$(x + y)(x^4 - x^3y + x^2y^2 - xy^3 + y^4)$$\n\n![Suma\
  \ de potencias impares iguales](/static/img/nodos/factorizacion-de-suma-de-potencias-impares-iguales-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la familia de polinomios binómicos aditivos $P_n(A, B) = A^n + B^n \in \mathbb{R}[A, B]$ parametrizada por el grado
  impar $n \in \{2k + 1 \mid k \in \mathbb{N}\}$. El **Teorema de Factorización Binómica Impar** establece la descomposición:


  $$\mathbf{A^n + B^n = (A + B) \sum_{k=0}^{n-1} (-1)^k A^{n-1-k} B^k}$$


  ### Demostración mediante la Raíz Real

  Evaluando el polinomio en $A = -B$:


  $$P_n(-B, B) = (-B)^n + B^n = (-1)^n B^n + B^n$$


  Dado que $n$ es impar, $(-1)^n = -1$, reduciendo a:


  $$P_n(-B, B) = -B^n + B^n = 0$$


  Por el **Teorema del Factor**, $(A - (-B)) = (A + B)$ es un factor divisible de $A^n + B^n$. Al efectur la división sintética
  de polinomios, el cociente exacto es la suma cociente con signos alternados $\sum_{k=0}^{n-1} (-1)^k A^{n-1-k} B^k$.


  ### Síntesis didáctica

  Cualquier suma de potencias impares iguales $A^n + B^n$ admite como divisor al binomio suma $(A + B)$, produciendo un cociente
  de $n$ términos con potencias decrecientes de $A$, crecientes de $B$ y signos alternados.

  '
definiciones_clave: '- **Suma de potencias impares iguales**: Binomio $A^n + B^n$ con exponente impar $n \in \{3, 5, 7, 9,
  \dots\}$.

  - **Cociente alternado de potencias**: Polinomio de $n$ términos con signos intercalados ($+ - + - \dots$) que acompaña
  al factor $(A+B)$.

  - **Teorema del Factor para impar**: Garantía de que $A = -B$ es siempre una raíz de la ecuación $A^n + B^n = 0$.

  '
propiedades_relaciones: '- **Generalización directa**: Cuando $n=3$, la fórmula coincide exactamente con la suma de cubos
  $(A+B)(A^2 - AB + B^2)$.

  '
ejemplo_guiado:
  enunciado: Factoriza la suma de quintas potencias $x^5 + 32$.
  pasos:
  - 'Paso 1: Identificamos que el exponente es impar $n = 5$.'
  - 'Paso 2: Extraemos las bases quintas: - $A = \sqrt[5]{x^5} = x$. - $B = \sqrt[5]{32} = 2$ (puesto que $2^5 = 32$).'
  - 'Paso 3: Escribimos el primer factor binómico suma $(A + B)$: $(x + 2)$.'
  - 'Paso 4: Construimos los 5 términos del segundo factor alternando signos: - $+A^4 = +x^4$. - $-A^3 B = -(x^3 \cdot 2)
    = -2x^3$. - $+A^2 B^2 = +(x^2 \cdot 2^2) = +4x^2$. - $-A B^3 = -(x \cdot 2^3) = -8x$. - $+B^4 = +2^4 = +16$.'
  - 'Paso 5: Ensamblamos el producto: $(x + 2)(x^4 - 2x^3 + 4x^2 - 8x + 16)$.'
  - 'Conclusión: La factorización es **$(x + 2)(x^4 - 2x^3 + 4x^2 - 8x + 16)$**.'
  imagen: /static/img/nodos/factorizacion-de-suma-de-potencias-impares-iguales-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la suma de potencias pares como $x^4 + y^4$ no se puede factorizar con esta regla mientras que $x^5 +
    y^5$ sí?
  choices:
  - text: Porque para potencias impares $(-y)^n = -y^n$, haciendo que $x = -y$ sea raíz de $x^n + y^n = 0$, lo cual no sucede
      en potencias pares donde $(-y)^4 = +y^4$
    is_correct: true
  - text: Porque las potencias pares son siempre números negativos
    is_correct: false
  - text: Porque 4 no se puede dividir por 2
    is_correct: false
  - text: Ambas se factorizan con la misma fórmula
    is_correct: false
  explanation: La alternativa correcta es 'Porque para potencias impares $(-y)^n = -y^n$, haciendo que $x = -y$ sea raíz de
    $x^n + y^n = 0$, lo cual no sucede en potencias pares donde $(-y)^4 = +y^4$'. Propiedad del signo del exponente impar
    en Teorema del Factor.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el patrón de signos del polinomio cociente en la suma de potencias impares $A^n + B^n = (A + B)(\dots)$?
  choices:
  - text: 'Los signos del cociente son estrictamente alternados empezando por positivo: $+ , - , + , - , + , \dots$'
    is_correct: true
  - text: Todos los signos son estrictamente positivos
    is_correct: false
  - text: Todos los signos son estrictamente negativos
    is_correct: false
  - text: Los signos son totalmente aleatorios
    is_correct: false
  explanation: 'La alternativa correcta es ''Los signos del cociente son estrictamente alternados empezando por positivo:
    $+ , - , + , - , + , \dots$''. Serie alternada $\sum (-1)^k A^{n-1-k} B^k$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el exponente común $n$ sea un número impar ($n = 3, 5, 7, \dots$).'
- 'Paso 2: Calcular las bases $A$ y $B$ de las potencias enésimas.'
- 'Paso 3: Escribir el factor binómico de la suma: $(A + B)$.'
- 'Paso 4: Escribir el factor polinómico de $n$ términos disminuyendo las potencias de $A$, aumentando las potencias de $B$
  y alternando los signos ($+ - + - \dots$).'
errores_correccion: '- **Error 1:** Tratar de aplicar esta regla a sumas de potencias pares (como $x^4 + y^4$). **Cómo corregirlo:**
  La regla del binomio factor $(A+B)$ **APLICA EXCLUSIVAMENTE A POTENCIAS IMPARES ($n = 3, 5, 7, \dots$)**.

  - **Error 2:** Escribir todos los signos del polinomio cociente como positivos. **Cómo corregirlo:** En la suma de potencias
  impares **LOS SIGNOS DEL SEGUNDO FACTOR DEBEN ALTERNARSE OBLIGATORIAMENTE ($+ - + - \dots$)**.

  '
ejemplos:
- titulo: Suma de quintas potencias
  enunciado: Para $a^5 + b^5$, ¿es el primer factor $(a + b)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la suma de las bases.
- titulo: Número de términos del cociente
  enunciado: En la factorización de $x^7 + y^7$, ¿tiene el segundo factor exactamente 7 términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, el exponente $n=7$ indica 7 términos.
- titulo: Signo inicial del cociente
  enunciado: ¿Empieza el trinomio/polinomio cociente siempre con signo positivo en $A^{n-1}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^0 = +1$.
- titulo: Suma con constante
  enunciado: Para $x^5 + 1$, ¿es el resultado $(x + 1)(x^4 - x^3 + x^2 - x + 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, con $B = 1$.
errores_frecuentes:
- Intentar factorizar sumas de potencias pares utilizando la regla de potencias impares.
- Escribir todos los términos del polinomio cociente con signo positivo olvidando la alternancia.
- Las potencias de A no son disminuidas en un grado por cada término del polinomio cociente.
- Intercambiar el número total de términos del polinomio cociente con $n-1$.
- Olvidar que para potencias pares la suma $A^n + B^n$ es irreducible en $\mathbb{R}$.
afirmaciones_verdaderas:
- Toda suma de potencias impares iguales $A^n + B^n$ es divisible por el binomio suma $(A + B)$.
- El polinomio cociente asociado tiene $n$ términos con potencias decrecientes de $A$ y signos alternados.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/factorizacion-de-suma-de-potencias-impares-iguales-resumen.svg)


  QUÉ: Factorizar sumas de potencias impares iguales Aⁿ + Bⁿ para cualquier exponente impar n.

  CÓMO: Aplicar $A^n + B^n = (A + B) \sum_{k=0}^{n-1} (-1)^k A^{n-1-k} B^k$ multiplicando el binomio suma $(A+B)$ por el cociente
  de $n$ términos con signos alternados ($+ - + - \dots$).

  '
