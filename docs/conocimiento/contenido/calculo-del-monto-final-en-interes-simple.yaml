semantic_id: MAT.NUM.INTERES_SIMPLE.MONTO_FINAL
resumen_inicial: 'El monto final en interés simple $M$ es la suma total acumulada obtenida al agregar el interés ganado $I$ al capital inicial $C$: $M = C + I = C \cdot (1 + i \cdot t)$.'
explicacion_simple: |
  El **monto final** (también llamado valor futuro) es todo el dinero que recibes de vuelta o que terminas pagando al final del período. Consta de dos partes:
  1. El dinero original que pusiste (Capital $C$).
  2. La ganancia adicional por los intereses ($I$).

  Por ejemplo, si inviertes $\$100.000$ y ganas $\$15.000$ de interés, el monto final es $\$115.000$. Puedes usar la fórmula reducida $M = C \cdot (1 + i \cdot t)$ para calcularlo de un solo viaje sin tener que sumar después.

  ![Monto final en interés simple](/static/img/nodos/calculo-del-monto-final-en-interes-simple-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **monto acumulado o valor futuro $M$** al término de un período $t$ en un régimen de interés simple es la suma del principal $C$ y el interés total devengado $I$:
  $$M = C + I$$

  ### Factorización del Monto Final
  Sustituyendo la expresión del interés simple $I = C \cdot i \cdot t$:
  $$M = C + C \cdot i \cdot t = C \cdot (1 + i \cdot t)$$
  donde:
  - $(1 + i \cdot t)$ es el **factor de acumulación a interés simple**.
  - $i = \frac{r}{100}$ es la tasa decimal periódica.

  ### Propiedades del crecimiento del Monto
  - **Función afín estricta**: $M(t)$ es una función afín del tiempo $t$ con intercepto en el eje vertical igual a $C$ (cuando $t=0 \implies M=C$) y pendiente constante $m = C \cdot i$.
  - **Relación con el porcentaje total**: El monto final representa el $(100 + r \cdot t)\%$ del capital inicial.

  ### Síntesis didáctica
  - Ecuación de adición: $M = C + I$.
  - Ecuación factorizada: $M = C \cdot (1 + i \cdot t)$.
definiciones_clave: |
  - **Monto final ($M$)**: Suma total recibida o desembolsada al finalizar la operación financiera.
  - **Factor de acumulación a interés simple**: Término $(1 + i \cdot t)$ que escala directamente el capital inicial.
  - **Capitalización única al vencimiento**: Adición final del rendimiento total al principal al término del plazo.
propiedades_relaciones: |
  - **Diferencia monetaria**: El interés ganado $I$ se puede despejar siempre restando el capital inicial al monto final: $I = M - C$.
  - **Linearidad acumulativa**: El monto final crece a un ritmo fijo por unidad de tiempo, a diferencia del interés compuesto que crece exponencialmente.
ejemplo_guiado:
  enunciado: 'Un inversionista coloca $\$300.000$ a una tasa de interés simple del $8\%$ anual durante $3$ años. Calcula el monto final total acumulado al cabo de ese tiempo.'
  imagen: '/static/img/nodos/calculo-del-monto-final-en-interes-simple-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $C = 300.000$, tasa decimal $i = 0,08$ y tiempo $t = 3\text{ años}$.'
    - 'Paso 2: Calculamos el factor de acumulación $(1 + i \cdot t) = 1 + (0,08 \cdot 3) = 1 + 0,24 = 1,24$.'
    - 'Paso 3: Multiplicamos el capital por el factor de acumulación: $M = 300.000 \cdot 1,24$.'
    - 'Paso 4: Calculamos: $M = 372.000$. El monto final acumulado es de **$\$372.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula factorizada para obtener directamente el monto final $M$ a interés simple?'
    choices:
      - {text: 'Multiplicar el capital inicial por el factor de acumulación ($M = C \cdot (1 + i \cdot t)$)', is_correct: true}
      - {text: 'Multiplicar el capital por la tasa de interés únicamente ($M = C \cdot i$)', is_correct: false}
      - {text: 'Elevar el capital a la potencia del tiempo ($M = C^t$)', is_correct: false}
      - {text: 'Restar los intereses al capital inicial ($M = C - I$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar el capital inicial por el factor de acumulación ($M = C \cdot (1 + i \cdot t)$)''. Sustituye $I = C \cdot i \cdot t$ en $M = C + I$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si pides un préstamo de $\$150.000$ y acumulas $\$18.000$ de interés simple, ¿cuál es el monto final que debes devolver?'
    choices:
      - {text: '$\$168.000$, sumando el capital inicial y los intereses ($150.000 + 18.000 = 168.000$)', is_correct: true}
      - {text: '$\$132.000$, restando los intereses', is_correct: false}
      - {text: '$\$18.000$, considerando solo el interés', is_correct: false}
      - {text: '$\$300.000$, duplicando el préstamo', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$168.000$, sumando el capital inicial y los intereses ($150.000 + 18.000 = 168.000$)''. El monto corresponde a $M = C + I$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el capital inicial $C$, la tasa de interés $i$ en decimal y el tiempo $t$.'
  - 'Paso 2: Calcular el interés simple $I = C \cdot i \cdot t$.'
  - 'Paso 3: Sumar el capital inicial y el interés para obtener $M = C + I$.'
  - 'Paso 4: Alternativamente, aplicar la fórmula factorizada directa $M = C \cdot (1 + i \cdot t)$.'
errores_correccion: |
  - **Error 1:** Entregar el interés ganado $I$ como la respuesta final al solicitar el monto acumulado. **Cómo corregirlo:** El monto final **DEBE incluir el capital inicial**: **$M = C + I$**.
  - **Error 2:** Multiplicar $1 + i$ antes de multiplicar por $t$ en la fórmula factorizada (error de orden de operaciones). **Cómo corregirlo:** En la expresión $(1 + i \cdot t)$, **PRIMERO se multiplica $i \cdot t$** y luego se le suma 1.
ejemplos:
  - titulo: 'Monto final con suma simple'
    enunciado: 'Si un capital de $\$50.000$ genera $\$5.000$ de interés, ¿cuál es el monto final acumulado?'
    alternativas:
      - '$\$55.000$'
      - '$\$5.000$'
      - '$\$45.000$'
    respuesta: '$\$55.000$'
    solucion_pasos:
      - '1. Aplicamos la suma fundamental $M = C + I$.'
      - '2. $M = 50.000 + 5.000 = $\$55.00$0$.'
  - titulo: 'Monto final mediante fórmula factorizada'
    enunciado: 'Para un capital de $\$100.000$ colocado al $10\%$ anual durante 2 años, ¿cuál es el monto final?'
    alternativas:
      - '$\$120.000$'
      - '$\$110.000$'
      - '$\$200.000$'
    respuesta: '$\$120.000$'
    solucion_pasos:
      - '1. Calculamos el factor: $1 + i \cdot t = 1 + (0,10 \cdot 2) = 1,20$.'
      - '2. $M = 100.000 \cdot 1,20 = $\$120.00$0$.'
  - titulo: 'Despeje del interés a partir del monto'
    enunciado: 'Si el monto final acumulado es $\$250.000$ y el capital original fue $\$200.000$, ¿cuánto interés se generó?'
    alternativas:
      - '$\$50.000$'
      - '$\$450.000$'
      - '$\$25.000$'
    respuesta: '$\$50.000$'
    solucion_pasos:
      - '1. Despejamos el interés: $I = M - C$.'
      - '2. $I = 250.000 - 200.000 = $\$50.00$0$.'
  - titulo: 'Monto final en 6 meses'
    enunciado: 'Para un capital de $\$80.000$ al $12\%$ anual durante 6 meses ($0,5$ años), ¿cuál es el monto final?'
    alternativas:
      - '$\$84.800$'
      - '$\$89.600$'
      - '$\$4.800$'
    respuesta: '$\$84.800$'
    solucion_pasos:
      - '1. $I = 80.000 \cdot 0,12 \cdot 0,5 = $\$4.80$0$.'
      - '2. $M = C + I = 80.000 + 4.800 = $\$84.80$0$.'
errores_frecuentes:
  - 'El valor del interés ganado $I$ es numéricamente idéntico al monto final total acumulado $M$.'
  - 'En la fórmula factorizada $M = C \cdot (1 + i \cdot t)$, el término $1$ se suma a la tasa $i$ antes de multiplicar por el tiempo $t$.'
  - 'El monto final acumulado a interés simple se obtiene restando el interés devengado al capital inicial ($M = C - I$).'
  - 'La gráfica del monto final $M(t)$ respecto al tiempo describe una curva exponencial creciente.'
  - 'El factor de acumulación $(1 + i \cdot t)$ utiliza la tasa porcentual entera $r$ sin dividir previamente por $100$.'
afirmaciones_verdaderas:
  - 'El monto final a interés simple es la suma del capital inicial y los intereses ganados ($M = C + I = C \cdot (1 + i \cdot t)$).'
  - 'La diferencia entre el monto final $M$ y el capital inicial $C$ equivale exactamente al interés total devengado ($I = M - C$).'
al_terminar_debes_poder: |
