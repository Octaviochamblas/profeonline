resumen_inicial: 'El monto acumulado o valor final $M$ en interés simple es la suma
  del capital inicial $C$ más los intereses ganados $I$: $M = C + I = C \cdot (1 +
  i \cdot t)$.'
explicacion_simple: El monto final es el dinero total que acumulamos o devolvemos
  al terminar el plazo. Se obtiene sumando al dinero invertido al principio los intereses
  que ganó en todo el tiempo, o multiplicando el capital inicial por el factor $(1
  + i \cdot t)$.
explicacion_formal: 'Para un capital inicial $C$, el **Monto Acumulado $M$** viene
  dado por la expresión de capitalización lineal:


  $$M = C + I = C + C \cdot i \cdot t = C \cdot (1 + i \cdot t)$$


  **Factor de capitalización simple:**

  - $F_{simple} = 1 + i \cdot t$ es la razón de crecimiento total entre el valor final
  y el inicial: $\frac{M}{C} = 1 + i \cdot t$.'
definiciones_clave: '- **Monto final $M$**: Suma del capital inicial e intereses $M
  = C \cdot (1 + i \cdot t)$.'
propiedades_relaciones: '- **Factor de acumulación lineal**: $F_{simple} = 1 + i \cdot
  t$ escala directamente el capital inicial.'
ejemplo_guiado:
  enunciado: Un capital de \$250.000 se deposita al $4\%$ anual de interés simple
    durante $3$ años. Calcule el monto acumulado final.
  pasos:
  - 'Paso 1: Calcular la ganancia de interés: $I = 250.000 \cdot 0,04 \cdot 3 = 30.000$.'
  - 'Paso 2: Sumar el capital más los intereses: $M = 250.000 + 30.000 = 280.000$.'
  - 'Paso 3: Verificación con la fórmula directa: $M = 250.000 \cdot (1 + 0,04 \cdot
    3) = 250.000 \cdot 1,12 = 280.000$.'
  - 'Conclusión: El monto acumulado final es \$280.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el monto final M en interés simple a
    partir del capital C, tasa i y tiempo t?
  choices:
  - text: M = C · (1 + i · t)
    is_correct: true
  - text: M = C · (1 + i)^t
    is_correct: false
  - text: M = C · i · t
    is_correct: false
  - text: M = C / (i · t)
    is_correct: false
  explanation: La alternativa correcta es 'M = C · (1 + i · t)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $250.000 al 4% anual en 3 años, ¿cuál fue el
    monto final M acumulado?
  choices:
  - text: 280.000 $
    is_correct: true
  - text: 253.000 $
    is_correct: false
  - text: 300.000 $
    is_correct: false
  - text: 30.000 $
    is_correct: false
  explanation: La alternativa correcta es '280.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el monto acumulado final
  $M = C \cdot (1 + i \cdot t)$ sumando el capital inicial y los intereses ganados.
semantic_id: MAT.NUM.INTERES_SIMPLE.MONTO_FINAL
procedimiento:
- 'Paso 1: Identificar los parámetros conocidos ($C, i, t, I, M$) e igualar las unidades
  de tiempo de la tasa y el plazo.'
- 'Paso 2: Sustituir en la fórmula fundamental del interés simple $I = C \cdot i \cdot
  t$ o del monto $M = C \cdot (1 + i \cdot t)$.'
- 'Paso 3: Despejar algebraicamente la variable buscada y comprobar el resultado numérico.'
errores_correccion: '- **Error 1: Ingresar el tiempo en meses cuando la tasa de interés
  es anual sin convertir unidades.** **Cómo corregirlo:** Se DEBE convertir el tiempo
  a años dividiendo entre 12 ($18\text{ meses} = 1,5\text{ años}$) o convertir la
  tasa anual a mensual dividiendo entre 12.


  - **Error 2: Sumar los intereses acumulados al capital inicial en cada período (tratarlo
  como interés compuesto).** **Cómo corregirlo:** En el interés simple el capital
  inicial $C$ permanece CONSTANTE en todos los períodos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_SIMPLE.MONTO_FINAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés simple.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización lineal.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por $M = C(1 + it)$.
- titulo: ¿Son idénticos los intereses ganados en cada período en el interés simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se calculan siempre sobre el mismo capital inicial $C$.
- titulo: ¿Debe coincidir la unidad de tiempo del plazo t con la unidad de la tasa
    de interés i?
  respuesta: Sí
  solucion_pasos:
  - Sí, para mantener la homogeneidad dimensional temporal.
errores_frecuentes:
- Ingresar el tiempo en meses manteniendo una tasa de interés expresada en términos
  anuales.
- Recapitalizar los intereses ganados al final de cada período sobre el capital inicial
  en régimen simple.
- Multiplicar por el número entero de la tasa de interés sin dividir previamente por
  cien.
- Declarar el valor del interés ganado $I$ con el monto final total acumulado $M$.
- Dividir el capital entre el tiempo sin incorporar la tasa de interés en el cálculo
  del saldo.
afirmaciones_verdaderas:
- El interés simple se caracteriza por generar ganancias periódicas constantes calculadas
  sobre el capital inicial $C$.
- El monto acumulado final en interés simple es una función lineal del tiempo $M =
  C \cdot (1 + i \cdot t)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
