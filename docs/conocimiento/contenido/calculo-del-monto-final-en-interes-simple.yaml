procedimiento:
- 'Paso 1: Identifica si el problema pide ''cuánto ganó de interés'' (solo I) o ''cuánto
  retiró en total'' (M).'
- 'Paso 2: Transforma la tasa $i$ a decimal.'
- 'Paso 3: Si pide el total, usa la fórmula $M = C \cdot (1 + i \cdot t)$, asegurándote
  de que $i$ y $t$ estén en la misma unidad de tiempo.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del
  monto final en interés simple.
ejemplos:
- titulo: Retiro total del banco
  enunciado: Guardas $20.000 al 3% anual simple durante 4 años. ¿Cuánto dinero retiras
    en total al final?
  solucion_pasos:
  - C = 20.000, i = 0.03, t = 4.
  - Monto = $20.000 \cdot (1 + 0.03 \cdot 4)$.
  - Monto = $20.000 \cdot (1 + 0.12) = 20.000 \cdot 1.12$.
  - Monto = $22.400$. Ese es el total a retirar.
errores_frecuentes:
- Responder solo con el valor del interés cuando la pregunta dice explícitamente 'monto
  final' o 'total a pagar'.
- Sumarle 1 a la tasa antes de multiplicar por el tiempo (hacer $C \cdot (1+i) \cdot
  t$ es un error algebraico grave).
afirmaciones_verdaderas:
- La propiedad de cálculo del monto final en interés simple preserva la consistencia
  lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren cálculo del
