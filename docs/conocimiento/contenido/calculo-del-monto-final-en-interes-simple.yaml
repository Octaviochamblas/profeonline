  QUÉ: Calcular el monto final o valor futuro acumulado en operaciones financieras a interés simple.
  CÓMO: Aplicar la relación aditiva $M = C + I$ o la ecuación factorizada directa $M = C \cdot (1 + i \cdot t)$, evaluando previamente el factor de acumulación lineal.
