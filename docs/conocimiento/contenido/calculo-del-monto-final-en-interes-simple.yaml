procedimiento:
- 'Paso 1: Identifica si el problema pide ''cuánto ganó de interés'' (solo I) o ''cuánto retiró
  en total'' (M).'
- 'Paso 2: Transforma la tasa $i$ a decimal.'
- 'Paso 3: Si pide el total, usa la fórmula $M = C \cdot (1 + i \cdot t)$, asegurándote de
  que $i$ y $t$ estén en la misma unidad de tiempo.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del monto final
  en interés simple.
ejemplos:
- titulo: Retiro total del banco
  enunciado: Guardas $20.000 al 3% anual simple durante 4 años. ¿Cuánto dinero retiras en
    total al final?
  solucion_pasos:
  - C = 20.000, i = 0.03, t = 4.
  - Monto = $20.000 \cdot (1 + 0.03 \cdot 4)$.
  - Monto = $20.000 \cdot (1 + 0.12) = 20.000 \cdot 1.12$.
  - Monto = $22.400$. Ese es el total a retirar.
- titulo: Ejemplo 2
  enunciado: Con capital 4.000, tasa 0,05 y tiempo 6 años, ¿cuál es el monto final?
  alternativas:
  - '5.200'
  - '5.000'
  - '4.200'
  respuesta: '5.200'
  solucion_pasos:
  - 4.000 por (1 más 0,05 por 6) es igual a 4.000 por 1,30, o sea 5.200.
- titulo: Ejemplo 3
  enunciado: Con capital 9.000, tasa 0,02 y tiempo 10 años, ¿cuál es el monto final?
  alternativas:
  - '10.800'
  - '9.180'
  - '10.000'
  respuesta: '10.800'
  solucion_pasos:
  - 9.000 por (1 más 0,02 por 10) es igual a 9.000 por 1,20, o sea 10.800.
- titulo: ¿El monto final se puede calcular sumando el capital más el interés generado?
  respuesta: Sí
  solucion_pasos:
  - 'Esa es la forma de dos pasos: M igual a C más I.'
errores_frecuentes:
- Responder solo con el valor del interés cuando la pregunta dice explícitamente 'monto final'
  o 'total a pagar'.
- Sumarle 1 a la tasa antes de multiplicar por el tiempo (hacer $C \cdot (1+i) \cdot t$ es
  un error algebraico grave).
- Responder solo con el valor del interés cuando la pregunta pide explícitamente el monto
  final o total a pagar.
- Sumarle 1 a la tasa antes de multiplicar por el tiempo, calculando C·(1+i)·t en vez de C·(1+i·t).
- Olvidar sumar el capital inicial al interés calculado cuando se usa el camino de dos pasos.
afirmaciones_verdaderas:
- La propiedad de cálculo del monto final en interés simple preserva la consistencia lógica.
- El monto final en interés simple siempre es igual al capital inicial más el interés generado,
  nunca solo el valor del interés.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del monto final
  en interés simple.
