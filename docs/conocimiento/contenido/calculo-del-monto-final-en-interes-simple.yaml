semantic_id: MAT.NUM.INTERES_SIMPLE.MONTO_FINAL
resumen_inicial: 'Cálculo del monto final en interés simple: concepto y propiedades
  fundamentales en Interés simple.'
explicacion_simple: Si le prestas 100 lucas a un amigo y te devuelve solo las 10 lucas
  de interés, ¡perdiste 90 lucas! Al final del plazo, debe devolverte el Capital inicial
  MÁS los intereses. Eso es el Monto Final.
explicacion_formal: 'A menudo los problemas preguntan por ''¿cuánto retirará en total
  del banco?'' o ''¿cuál es la deuda total a pagar?''. No basta con calcular la ganancia
  ($I$). Debes calcular el **Monto Final ($M$)**.


  Hay dos caminos:

  1. **Camino largo (en dos pasos):** Calculas el interés $I = C \cdot i \cdot t$
  y luego se lo sumas al capital original: $M = C + I$.

  2. **Camino directo (Factorización):** Como $M = C + (C \cdot i \cdot t)$, si factorizamos
  $C$ nos queda:

  $$M = C \cdot (1 + i \cdot t)$$

  Este paréntesis $(1 + i \cdot t)$ actúa como el gran factor multiplicador del interés
  simple total.'
definiciones_clave: '- **Cálculo del monto final en interés simple**: Elemento central
  dentro del estudio de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del monto final en interés simple.'
