procedimiento:
- 'Paso 1: Observa el signo de la coordenada x (abscisa) del punto.'
- 'Paso 2: Observa el signo de la coordenada y (ordenada) del punto.'
- 'Paso 3: Compara esa combinación de signos con el patrón de cada cuadrante (I: ++,
  II: -+, III: --, IV: +-) para determinar a cuál pertenece.'
