semantic_id: MAT.GEO.CARTESIANO_BASE.SIGNOS_CUADRANTES
resumen_inicial: 'Identificación de signos de coordenadas según cuadrante: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Cada uno de los 4 cuadrantes tiene una combinación única de signos
  para las coordenadas x e y, lo que permite saber a qué cuadrante pertenece un punto
  solo mirando los signos de sus coordenadas.
explicacion_formal: '![Signos de coordenadas según cuadrante](/static/img/geometria/cartesiano-vectores/cartesiano-signos-cuadrantes.svg)


  ### Definición formal


  Según el cuadrante, los signos de la abscisa (x) y la ordenada (y) de un punto siguen
  este patrón: cuadrante I: $x>0, y>0$; cuadrante II: $x<0, y>0$; cuadrante III: $x<0,
  y<0$; cuadrante IV: $x>0, y<0$.


  ### Desarrollo didáctico


  Este patrón permite determinar rápidamente el cuadrante de un punto sin necesidad
  de graficarlo: por ejemplo, el punto $(-5,3)$ tiene $x<0$ e $y>0$, por lo que pertenece
  al cuadrante II.'
definiciones_clave: '- **Identificación de signos de coordenadas según cuadrante**:
