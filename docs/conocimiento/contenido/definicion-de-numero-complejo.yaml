semantic_id: MAT.NUM.NUMEROS_COMPLEJOS.DEFINICION
resumen_inicial: Un número complejo $z$ es un número de la forma $z = a + bi$, donde $a, b \in \mathbb{R}$ e $i$ es la unidad imaginaria ($i^2 = -1$).
explicacion_simple: '![Definición de número complejo](/static/img/nodos/definicion-de-numero-complejo-intro.svg)


  Un número complejo es una combinación de dos tipos de números:

  - Una **parte real** ($a$), que es un número real ordinario (como $5$, $-3$, $0,5$).

  - Una **parte imaginaria** ($b$), que es el número real que acompaña a la unidad imaginaria $i$.

  - Se escribe como un binomio: $z = a + bi$.

  - Todos los números reales son números complejos especiales con parte imaginaria igual a cero ($z = a + 0i$).'
explicacion_formal: 'El conjunto de los **números complejos**, denotado por $\mathbb{C}$, se define como el conjunto de todas las expresiones formales de la forma:


  $$\mathbb{C} = \{z = a + bi \mid a, b \in \mathbb{R}, i^2 = -1\}$$


  **Estructura de Cuerpo:**

  $(\mathbb{C}, +, \cdot)$ constituye un cuerpo algebraicamente cerrado que extiende a $(\mathbb{R}, +, \cdot)$. Contiene dos subconjuntos notables:

  1. **Números reales:** $\mathbb{R} = \{a + 0i \mid a \in \mathbb{R}\} \subset \mathbb{C}$.

  2. **Números imaginarios puros:** $\mathbb{I} = \{0 + bi \mid b \in \mathbb{R}, b \neq 0\} \subset \mathbb{C}$.'
definiciones_clave: '- **Número complejo ($z = a + bi$)**: Expresión formada por la suma de un término real y un término imaginario.

  - **Parte real ($\operatorname{Re}(z) = a$)**: Componente escalar real independiente de $i$.

  - **Parte imaginaria ($\operatorname{Im}(z) = b$)**: Coeficiente real multiplicador de $i$.'
propiedades_relaciones: '- **Inclusión de conjuntos**: $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R} \subset \mathbb{C}$.

  - **Igualdad de complejos**: $a + bi = c + di \iff a = c$ y $b = d$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de definición de número complejo](/static/img/nodos/definicion-de-numero-complejo-ejemplos.svg)


    Analice las componentes de $z_1 = 5 - 3i$, $z_2 = 8$ y $z_3 = -4i$ en el cuerpo complejo $\mathbb{C}$.'
  pasos:
  - 'Paso 1: Para $z_1 = 5 - 3i$: $\operatorname{Re}(z_1) = 5$ e $\operatorname{Im}(z_1) = -3$ (número complejo general).'
  - 'Paso 2: Para $z_2 = 8$: Reescribir como $8 + 0i \implies \operatorname{Re}(z_2) = 8, \operatorname{Im}(z_2) = 0$ (número real puro).'
  - 'Paso 3: Para $z_3 = -4i$: Reescribir como $0 - 4i \implies \operatorname{Re}(z_3) = 0, \operatorname{Im}(z_3) = -4$ (número imaginario puro).'
  - 'Conclusión: Todos pertenecen a $\mathbb{C}$ con distintas combinaciones de partes reales e imaginarias.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la parte imaginaria $\operatorname{Im}(z)$ del número complejo $z = -2 + 7i$?
  choices:
  - text: $7$ (el coeficiente real que multiplica a $i$)
    is_correct: true
  - text: $7i$
    is_correct: false
  - text: $-2$
    is_correct: false
  - text: $-2 + 7$
    is_correct: false
  explanation: La alternativa correcta es '$7$ (el coeficiente real que multiplica a $i$)'. La parte imaginaria es siempre un número real escalar.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el número real $8$ es también un número complejo?
  choices:
  - text: Porque se puede expresar en la forma $8 + 0i$ con $\operatorname{Im}(z) = 0$
    is_correct: true
  - text: Porque $8$ es divisible por $2$
    is_correct: false
  - text: Porque $8 = \sqrt{64}$
    is_correct: false
  - text: Porque todos los números reales son negativos
    is_correct: false
  explanation: La alternativa correcta es 'Porque se puede expresar en la forma $8 + 0i$ con $\operatorname{Im}(z) = 0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión dada en la forma $a + bi$.'
- 'Paso 2: Extraer la parte real $a = \operatorname{Re}(z)$ y la parte imaginaria $b = \operatorname{Im}(z)$ sin incluir la letra $i$.'
- 'Paso 3: Clasificar el número como real puro ($b = 0$), imaginario puro ($a = 0, b \neq 0$) o complejo general.'
errores_correccion: '- **Error 1: Incluir la letra ''i'' en la parte imaginaria ($\operatorname{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es solo el coeficiente numérico real: $\operatorname{Im}(3+4i) = 4$.

  - **Error 2: Sumar las dos partes en un solo número ($3 + 4i = 7i$).** **Cómo corregirlo:** Las partes reales e imaginarias no son términos semejantes; no se pueden fusionar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $z = -6 + 11i$, ¿cuáles son sus partes real e imaginaria?
  alternativas:
  - $\operatorname{Re}(z) = -6$, $\operatorname{Im}(z) = 11$
  - $\operatorname{Re}(z) = 11$, $\operatorname{Im}(z) = -6$
  - $\operatorname{Re}(z) = -6$, $\operatorname{Im}(z) = 11i$
  respuesta: $\operatorname{Re}(z) = -6$, $\operatorname{Im}(z) = 11$
  solucion_pasos:
  - Parte real $a = -6$ y coeficiente imaginario $b = 11$.
- titulo: Ejemplo 2
  enunciado: ¿Qué condición deben cumplir dos números complejos $a + bi$ y $c + di$ para ser iguales?
  alternativas:
  - $a = c$ y $b = d$
  - $a + b = c + d$
  - $a = d$ y $b = c$
  respuesta: $a = c$ y $b = d$
  solucion_pasos:
  - Deben coincidir simultáneamente sus partes reales y sus partes imaginarias.
- titulo: ¿Es todo número real un número complejo?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\mathbb{R} \subset \mathbb{C}$, con $\operatorname{Im}(z) = 0$.
  alternativas:
  - texto: Sí, todo real es complejo con parte imaginaria cero
    es_correcta: true
    retroalimentacion: ¡Correcto! $\mathbb{R}$ es subconjunto estricto de $\mathbb{C}$.
  - texto: No, los reales y los complejos son conjuntos disjuntos
    es_correcta: false
    retroalimentacion: Incorrecto, $\mathbb{R}$ está contenido en $\mathbb{C}$.
  - texto: No, solo los números que tienen 'i' son complejos
    es_correcta: false
    retroalimentacion: Incorrecto, un real tiene $0i$.
- titulo: ¿Es z = 0 un número complejo?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cero complejo es $z = 0 + 0i$.
  alternativas:
  - texto: Sí, es el elemento neutro 0 + 0i
    es_correcta: true
    retroalimentacion: ¡Correcto! Origen del plano complejo.
  - texto: No, el cero no pertenece a los complejos
    es_correcta: false
    retroalimentacion: Incorrecto, el cero pertenece a todo cuerpo numérico.
  - texto: No, es solo un número natural
    es_correcta: false
    retroalimentacion: Incorrecto, es real y por ende complejo.
errores_frecuentes:
- Escribir la letra $i$ dentro de la parte imaginaria $\operatorname{Im}(z)$.
- Sumar algebraicamente la parte real con la parte imaginaria.
- Creer que los números reales no forman parte de los números complejos.
- Olvidar el signo negativo al extraer componentes.
afirmaciones_verdaderas:
- Un número complejo se define en forma binomial como $z = a + bi$ con $a, b \in \mathbb{R}$.
- El conjunto de los números reales es un subconjunto de los números complejos ($\mathbb{R} \subset \mathbb{C}$).
- Dos números complejos son iguales si y solo si sus partes reales e imaginarias son respectivamente idénticas.
al_terminar_debes_poder: '![Síntesis de definición de número complejo](/static/img/nodos/definicion-de-numero-complejo-resumen.svg)


  QUÉ: Comprender la estructura y definición formal de los números complejos $\mathbb{C}$.


  CÓMO: Descomponiendo $z = a + bi$ en su parte real $\operatorname{Re}(z) = a$ y parte imaginaria $\operatorname{Im}(z) = b$, y reconociendo a $\mathbb{R}$ e $\mathbb{I}$ como casos particulares de $\mathbb{C}$.'
fuente: Texto escolar MINEDUC — Matemática 3° Medio / Álgebra Superior.
