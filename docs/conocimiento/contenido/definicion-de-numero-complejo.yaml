semantic_id: MAT.NUM.COMPLEJOS.DEFINICION
resumen_inicial: Un número complejo es un número de la forma $z = a + bi$, donde $a$
  y $b$ son números reales e $i$ es la unidad imaginaria.
explicacion_simple: 'Los números complejos enmarcan a todos los números conocidos
  (reales e imaginarios) en una sola estructura $z = a + bi$:

  - $a$ es la **parte real**.

  - $b$ es la **parte imaginaria** (el coeficiente que acompaña a $i$).

  Ejemplo: En $z = 3 + 4i$, la parte real es $3$ y la parte imaginaria es $4$.'
explicacion_formal: El conjunto de los números complejos se define como $\mathbb{C}
  = \{z = a + bi \mid a, b \in \mathbb{R}, i^2 = -1\}$. Contiene a $\mathbb{R}$ cuando
  $b = 0$ ($a + 0i = a \in \mathbb{R}$) y a los imaginarios puros cuando $a = 0$ ($0
  + bi = bi$).
definiciones_clave: '- **Conjunto de los complejos ($\mathbb{C}$)**: Conjunto de pares
  $(a,b)$ que generaliza la recta real al plano.'
propiedades_relaciones: '- **Inclusión**: $\mathbb{R} \subset \mathbb{C}$.'
ejemplo_guiado:
  enunciado: Clasifica los números complejos A) $z_1 = 5 + 2i$, B) $z_2 = -7$ y C)
    $z_3 = 4i$.
  pasos:
  - 'Para $z_1 = 5 + 2i$: tiene parte real 5 y parte imaginaria 2 (complejo mixto).'
  - 'Para $z_2 = -7 = -7 + 0i$: parte imaginaria 0 (es un número real).'
  - 'Para $z_3 = 4i = 0 + 4i$: parte real 0 (es un número imaginario puro).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma general de un número complejo $z$?
  choices:
  - text: z = a + bi con a, b reales
    is_correct: true
  - text: z = a · b · i
    is_correct: false
  - text: z = a / bi
    is_correct: false
  - text: z = a^b + i
    is_correct: false
  explanation: 'La correcta es: z = a + bi con a, b reales. Forma binomial estándar.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la parte imaginaria de un complejo es cero ($b = 0$), ¿a qué conjunto
    numérico pertenece el número resultante?
  choices:
  - text: Al conjunto de los números reales (R)
    is_correct: true
  - text: Al conjunto de los números imaginarios puros
    is_correct: false
  - text: Al conjunto vacío
    is_correct: false
  - text: No es un número complejo
    is_correct: false
  explanation: 'La correcta es: Al conjunto de los números reales (R). Los reales
    son un subconjunto de $\mathbb{C}$ con $b=0$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la forma $a + bi$.'
- 'Paso 2: Reconocer el término independiente $a$ como la parte real.'
- 'Paso 3: Reconocer el coeficiente $b$ de $i$ como la parte imaginaria.'
errores_correccion: No incluyas la $i$ al nombrar la parte imaginaria. En $3 + 4i$,
  la parte imaginaria es el número $4$, no $4i$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: En $z = -2 + 9i$, ¿cuáles son los valores de $a$ y $b$?
  alternativas:
  - a = -2, b = 9
  - a = -2, b = 9i
  - a = 9, b = -2
  respuesta: a = -2, b = 9
  solucion_pasos:
  - $a = -2$ (real) y $b = 9$ (imaginaria).
errores_frecuentes:
- Incluir la letra $i$ como parte de la cifra imaginaria.
afirmaciones_verdaderas:
- $a + bi \in \mathbb{C}$ con $a, b \in \mathbb{R}$.
al_terminar_debes_poder: Definir e identificar las componentes de un número complejo.
fuente: Texto escolar MINEDUC.
estado: publicado
