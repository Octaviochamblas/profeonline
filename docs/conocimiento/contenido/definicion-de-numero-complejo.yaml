resumen_inicial: Un número complejo es una entidad matemática de la forma $z = a +
  bi$, donde $a, b \in \mathbb{R}$ e $i = \sqrt{-1}$ representa la unidad imaginaria,
  definiendo el conjunto $\mathbb{C}$.
explicacion_simple: 'Un número complejo es una combinación que junta dos números reales:
  una parte normal o real y una parte acompañada de la letra $i$ llamada parte imaginaria.
  Por ejemplo, $3 + 4i$ es un número complejo único donde el 3 es real y el 4 es el
  coeficiente imaginario.'
explicacion_formal: 'El conjunto de los **Números Complejos $\mathbb{C}$** se define
  formalmente como el par ordenado $(a, b) \in \mathbb{R}^2$ dotado de operaciones
  algebraicas especiales:


  $$\mathbb{C} = \{z = a + bi \mid a, b \in \mathbb{R}, \, i^2 = -1\}$$


  **Estructura:**

  - $\mathbb{R} \subset \mathbb{C}$: Si $b = 0$, $z = a$ es un número real puro.

  - Si $a = 0$ y $b \neq 0$, $z = bi$ es un número imaginario puro.


  > **Complemento didáctico:** El conjunto $\mathbb{C}$ rompe la estructura de orden
  lineal: en los números complejos NO existen relaciones de mayor o menor ($z_1 >
  z_2$ no tiene sentido).'
definiciones_clave: '- **Número complejo**: Elemento $z = a + bi \in \mathbb{C}$ compuesto
  por una parte real $a$ y una imaginaria $b$.'
propiedades_relaciones: '- **Inclusión de conjuntos**: $\mathbb{N} \subset \mathbb{Z}
  \subset \mathbb{Q} \subset \mathbb{R} \subset \mathbb{C}$.'
ejemplo_guiado:
  enunciado: Identifique el tipo de número al que pertenecen $z_1 = 5 + 2i$, $z_2
    = -7i$ y $z_3 = 4$.
  pasos:
  - 'Paso 1: Para $z_1 = 5 + 2i$, tiene parte real $5$ e imaginaria $2 \implies$ número
    complejo general.'
  - 'Paso 2: Para $z_2 = -7i$, su parte real es $0$ $\implies$ número imaginario puro.'
  - 'Paso 3: Para $z_3 = 4$, su parte imaginaria es $0$ $\implies$ número real puro
    (que también es complejo con $b=0$).'
  - 'Conclusión: Todos pertenecen al conjunto $\mathbb{C}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión estándar que define a un número complejo z en el
    conjunto C?
  choices:
  - text: z = a + bi (donde a, b son reales e i^2 = -1)
    is_correct: true
  - text: z = a · b · i
    is_correct: false
  - text: z = a / bi
    is_correct: false
  - text: z = a^b
    is_correct: false
  explanation: La alternativa correcta es 'z = a + bi (donde a, b son reales e i^2
    = -1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué z_2 = -7i se clasifica como imaginario
    puro?
  choices:
  - text: Porque su parte real a es igual a cero (a = 0)
    is_correct: true
  - text: Porque no tiene signo negativo
    is_correct: false
  - text: Because es una fracción
    is_correct: false
  - text: Porque es un número real positivo
    is_correct: false
  explanation: La alternativa correcta es 'Porque su parte real a es igual a cero
    (a = 0)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y clasificar números complejos
  $z = a + bi \in \mathbb{C}$, reconociendo componentes reales e imaginarios.
semantic_id: MAT.NUM.COMPLEJOS.DEFINICION
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.DEFINICION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
estado: publicado
