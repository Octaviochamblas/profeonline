semantic_id: MAT.NUM.COMPLEJOS.DEFINICION
resumen_inicial: 'Un número complejo $z$ es un par ordenado de números reales expresado como $z = a + bi$, donde $a$ es la parte real, $b$ es la parte imaginaria e $i = \sqrt{-1}$.'
explicacion_simple: |
  Los números complejos combinan en una sola expresión un número real común y corriente con un número imaginario. Se escriben en la forma $z = a + bi$. Por ejemplo, en $z = 3 + 4i$, la parte real es el número 3 y la parte imaginaria es el número 4 (que acompaña a la $i$). Este conjunto numérico, denotado por $\mathbb{C}$, es el conjunto más grande en el que se pueden resolver todas las raíces de números negativos.
explicacion_formal: |
  ### Definición formal
  El **conjunto de los números complejos** $\mathbb{C}$ se define formalmente como el cuerpo algebraico de las expresiones binomiales:
  $$\mathbb{C} = \{z = a + bi \mid a, b \in \mathbb{R}, \; i = \sqrt{-1}\}$$

  ### Inclusión de conjuntos numéricos
  El conjunto de los números reales $\mathbb{R}$ es un subconjunto propio de los números complejos ($\mathbb{R} \subset \mathbb{C}$):
  - **Número real puro**: Si $b = 0$, entonces $z = a + 0i = a \in \mathbb{R}$.
  - **Número imaginario puro**: Si $a = 0$ y $b \neq 0$, entonces $z = 0 + bi = bi \in \mathbb{I}$.
  - **Número complejo mixto**: Si $a \neq 0$ y $b \neq 0$, $z = a + bi$.

  ### Igualdad de números complejos
  Dos números complejos $z_1 = a + bi$ y $z_2 = c + di$ son estrictamente iguales ($z_1 = z_2$) si y solo si:
  $$a = c \quad \text{y} \quad b = d$$

  ### Síntesis didáctica
  - Componentes: Parte real $a \in \mathbb{R}$ y parte imaginaria $b \in \mathbb{R}$.
  - Axioma del operador: $i^2 = -1$.
definiciones_clave: |
  - **Número complejo $z = a + bi$**: Elemento del conjunto $\mathbb{C}$ compuesto por una componente real $a$ y una imaginaria $bi$.
  - **Conjunto $\mathbb{C}$**: Extensión numérica que engloba a todos los números reales e imaginarios puros.
  - **Criterio de igualdad**: Condición de coincidencia simultánea de partes reales e imaginarias entre dos complejos.
propiedades_relaciones: |
  - **Ausencia de relación de orden**: En el conjunto $\mathbb{C}$ no existe una relación de orden lineal (no se puede afirmar si $z_1 > z_2$ o $z_1 < z_2$).
  - **Clausura algebraica**: Toda ecuación polinomial de grado $n$ tiene exactamente $n$ soluciones en $\mathbb{C}$ (Teorema Fundamental del Álgebra).
ejemplo_guiado:
  enunciado: 'Dado el número complejo $z = -7 + 2i$, identifica si es un número real puro, imaginario puro o complejo mixto, y determina los valores de sus componentes.'
  pasos:
    - 'Paso 1: Comparamos el número $z = -7 + 2i$ con la estructura estándar $z = a + bi$.'
    - 'Paso 2: Identificamos la componente real libre de la unidad imaginaria: $a = -7$.'
    - 'Paso 3: Identificamos el coeficiente real que multiplica a $i$: $b = 2$.'
    - 'Paso 4: Como $a \neq 0$ y $b \neq 0$, concluimos que $z$ es un número complejo mixto.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición matemática se exige para que dos números complejos $z_1 = a + bi$ y $z_2 = c + di$ sean idénticos ($z_1 = z_2$)?'
    choices:
      - {text: 'Que sus partes reales sean iguales ($a = c$) y sus partes imaginarias sean iguales ($b = d$)', is_correct: true}
      - {text: 'Que la suma de sus componentes sea igual ($a + b = c + d$)', is_correct: false}
      - {text: 'Que únicamente sus partes reales sean iguales ($a = c$)', is_correct: false}
      - {text: 'Que sus partes imaginarias sean opuestas ($b = -d$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Que sus partes reales sean iguales ($a = c$) y sus partes imaginarias sean iguales ($b = d$)''. La igualdad en $\mathbb{C}$ requiere coincidencia término a término.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué categoría pertenece el número complejo $z = 0 - 9i$?'
    choices:
      - {text: 'Número imaginario puro, por tener parte real igual a cero ($a = 0$)', is_correct: true}
      - {text: 'Número real puro, por no tener paréntesis', is_correct: false}
      - {text: 'Número complejo nulo, por tener cero', is_correct: false}
      - {text: 'Número irracional real', is_correct: false}
    explanation: 'La alternativa correcta es ''Número imaginario puro, por tener parte real igual a cero ($a = 0$)''. Al ser $a=0$ y $b=-9 \neq 0$, es un imaginario puro.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la expresión en la forma estándar $z = a + bi$.'
  - 'Paso 2: Reconocer a la constante real libre $a$ como la parte real.'
  - 'Paso 3: Reconocer al coeficiente real $b$ que acompaña a $i$ como la parte imaginaria.'
  - 'Paso 4: Clasificar el complejo según la nulidad de $a$ o $b$ (real puro, imaginario puro o mixto).'
errores_correccion: |
  - **Error 1:** Incluir la letra $i$ al indicar el valor numérico de la parte imaginaria (ej: decir que la parte imaginaria de $3 + 4i$ es $4i$). **Cómo corregirlo:** La parte imaginaria es únicamente el **coeficiente real** $b = 4$. La letra $i$ actúa como el indicador de la unidad imaginaria.
  - **Error 2:** Intentar comparar el tamaño de dos números complejos usando inecuaciones (ej: afirmar que $2 + 3i > 1 + 5i$). **Cómo corregirlo:** En los números complejos **no existe un orden mayor o menor** ($> \text{ o } <$); sólo se define la relación de igualdad ($=$) o desigualdad ($\neq$).
ejemplos:
  - titulo: 'Clasificación de número real como complejo'
    enunciado: '¿El número entero $8$ se puede expresar en $\mathbb{C}$ como $8 + 0i$?'
    alternativas:
      - 'Sí, pues todo número real es un complejo con parte imaginaria nula'
      - 'No, 8 sólo es un número real'
      - 'No, debe llevar i'
    respuesta: 'Sí, pues todo número real es un complejo con parte imaginaria nula'
    solucion_pasos:
      - '1. Comparamos con $a + bi \implies 8 + 0i$.'
      - '2. Como $b = 0$, pertenece al subconjunto real de $\mathbb{C}$.'
  - titulo: 'Identificación en complejo mixto'
    enunciado: 'Para $z = -5 + 12i$, ¿sus componentes son $a = -5$ y $b = 12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Parte real $-5$ y parte imaginaria $12$.'
  - titulo: 'Igualdad de complejos'
    enunciado: 'Si $a + bi = 4 - 3i$, ¿los valores reales son $a = 4$ y $b = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Igualando componente a componente.'
  - titulo: 'Inexistencia de orden en complejos'
    enunciado: '¿Es posible determinar si $3 + 2i$ es estrictamente mayor que $1 + 4i$ en $\mathbb{C}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. El cuerpo de los complejos no es un conjunto ordenado.'
errores_frecuentes:
  - 'Incluir la letra $i$ dentro del valor escalar asignado a la parte imaginaria.'
  - 'Establecer relaciones de orden mayor que o menor que entre dos números complejos.'
  - 'El conjunto de los números reales y el conjunto de los números complejos son totalmente disjuntos.'
  - 'Afirmar que un número imaginario puro no es un número complejo.'
  - 'Sumar directamente la parte real con el coeficiente imaginario $a + b$ cancelando la letra $i$.'
afirmaciones_verdaderas:
  - 'Un número complejo $z = a + bi$ está compuesto por una parte real $a \in \mathbb{R}$ y una parte imaginaria $b \in \mathbb{R}$.'
  - 'El conjunto de los números reales $\mathbb{R}$ es un subconjunto del conjunto de los números complejos $\mathbb{C}$ donde la parte imaginaria es cero ($b = 0$).'
al_terminar_debes_poder: 'Definir e identificar las componentes de un número complejo $z = a + bi$ clasificándolo en el conjunto $\mathbb{C}$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
