semantic_id: MAT.NUM.RACIONALES_CONCEPTO.DEFINICION_Q
resumen_inicial: "Un número racional es todo número que se puede escribir como una fracción $a/b$, con $a$ y $b$ enteros y $b\\neq0$."
explicacion_simple: |
  Los enteros no alcanzan para representar todo lo que medimos o repartimos: falta un
  conjunto que incluya también las fracciones y los decimales exactos o periódicos. Ese
  conjunto es $\mathbb{Q}$, el de los números racionales. Cualquier número que puedas
  escribir como una fracción de dos enteros (con denominador distinto de cero) es racional.
explicacion_formal: |
  El conjunto de los números racionales se define como
  $\mathbb{Q}=\left\{\frac{a}{b}:a,b\in\mathbb{Z},\,b\neq0\right\}$. Un número pertenece a
  $\mathbb{Q}$ si existe al menos una forma de escribirlo como cociente de dos enteros con
  denominador distinto de cero. Por ejemplo, $5$ es racional porque puede escribirse como
  $\frac{5}{1}$: todo entero es, en particular, un número racional.
definiciones_clave: |
  **Número racional**: número que puede expresarse como $\frac{a}{b}$ con $a,b\in\mathbb{Z}$
  y $b\neq0$. **$\mathbb{Q}$**: símbolo que representa el conjunto de los números racionales.
propiedades_relaciones: |
  Todo número entero es racional (tomando $b=1$), por lo que $\mathbb{Z}\subset\mathbb{Q}$.
  Un mismo número racional puede escribirse de múltiples formas equivalentes, como
  $\frac{1}{2}=\frac{2}{4}$.
ejemplo_guiado:
  enunciado: "Determina si el número -0,75 es racional."
  pasos:
    - "Buscamos una fracción de enteros que sea igual a $-0{,}75$."
    - '$-0{,}75=-\frac{75}{100}=-\frac{3}{4}$, donde $-3$ y $4$ son enteros y $4\neq0$.'
    - 'Conclusión: $-0{,}75$ es racional, porque se puede escribir como $\frac{a}{b}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué condición debe cumplir el denominador para que a/b sea un número racional?"
    choices:
      - {text: "Debe ser un entero distinto de cero", is_correct: true}
      - {text: "Debe ser un número positivo", is_correct: false}
      - {text: "Debe ser mayor que el numerador", is_correct: false}
      - {text: "Debe ser un número primo", is_correct: false}
    explanation: "La correcta es Debe ser un entero distinto de cero: si $b=0$ la expresión $a/b$ no representa ningún número."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es racional el número 2,5?"
    choices:
      - {text: "Sí, porque $2{,}5=\\frac{5}{2}$", is_correct: true}
      - {text: "No, porque no es un número entero", is_correct: false}
      - {text: "No, porque tiene un decimal", is_correct: false}
      - {text: "No se puede saber sin más información", is_correct: false}
    explanation: "La correcta es Sí, porque $2{,}5=\\frac{5}{2}$: es una fracción de enteros con denominador distinto de cero."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Escribe el número como un cociente $a/b$ de enteros."
  - "Paso 2: Comprueba que el denominador elegido sea distinto de cero."
  - "Paso 3: Si lo lograste, el número es racional."
errores_correccion: |
  Un error frecuente es pensar que solo las fracciones "con pinta de fracción" son
  racionales, olvidando que los enteros y los decimales exactos o periódicos también lo
  son porque admiten una representación $a/b$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Es el número $5$ un número racional?"
    alternativas:
      - 'Sí, porque $5=\frac{5}{1}$'
      - "No, porque no es una fracción"
      - "No se puede determinar"
    respuesta: "Sí, porque $5=\\frac{5}{1}$"
    solucion_pasos:
      - "Paso a: Buscamos escribir $5$ como cociente de enteros."
      - 'Paso b: $5=\frac{5}{1}$, con $5$ y $1$ enteros y $1\neq0$.'
      - "Paso c: Cumple la definición, por lo tanto $5$ es racional."
  - titulo: "Ejemplo 2"
    enunciado: "¿Es el número $\\sqrt{2}$ un número racional?"
    alternativas:
      - 'No, no existe ninguna fracción de enteros igual a $\sqrt{2}$'
      - "Sí, porque se puede aproximar con decimales"
      - "No se puede determinar"
    respuesta: "No, no existe ninguna fracción de enteros igual a $\\sqrt{2}$"
    solucion_pasos:
      - 'Paso a: Buscamos una fracción $a/b$ de enteros igual a $\sqrt{2}$.'
      - "Paso b: Se puede demostrar que no existe ningún par de enteros $a,b$ que cumplan esa igualdad."
      - 'Paso c: Por lo tanto, $\sqrt{2}$ no es racional (es irracional).'
  - titulo: "¿Es el número $-\\frac{7}{2}$ un número racional?"
    respuesta: "Sí"
    solucion_pasos:
      - "$-7$ y $2$ son ambos números enteros."
      - "El denominador $2$ es distinto de cero."
      - 'Por lo tanto, $-\frac{7}{2}$ cumple la definición y es racional.'
  - titulo: "¿Es el número $\\frac{4}{0}$ un número racional?"
    respuesta: "No"
    solucion_pasos:
      - "El denominador de la expresión es $0$."
      - "La definición exige que el denominador sea distinto de cero."
      - 'Por lo tanto, $\frac{4}{0}$ no representa ningún número racional (ni ningún número).'
errores_frecuentes:
  - "Creer que los números enteros no son racionales, sin notar que se pueden escribir como $n/1$."
  - "Pensar que un número decimal nunca puede ser racional."
  - "Aceptar una fracción con denominador cero como si fuera un número racional válido."
  - 'Creer que $\sqrt{2}$ es racional porque su valor decimal parece tener un patrón.'
  - "Confundir 'número racional' con 'número positivo'."
afirmaciones_verdaderas:
  - "Todo número entero es también un número racional."
  - 'El número $0{,}75$ es racional porque equivale a $\frac{3}{4}$.'
al_terminar_debes_poder: |
  Determinar si un número es racional comprobando si existe una fracción de enteros con
  denominador distinto de cero que lo represente.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
