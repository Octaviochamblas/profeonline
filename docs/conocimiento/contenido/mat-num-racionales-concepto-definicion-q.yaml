semantic_id: MAT.NUM.RACIONALES_CONCEPTO.DEFINICION_Q
resumen_inicial: 'El conjunto de los números racionales $\mathbb{Q}$ reúne a todas
  las cantidades que se pueden expresar como cociente de dos enteros con denominador
  distinto de cero: $\mathbb{Q} = \{ \frac{a}{b} \mid a, b \in \mathbb{Z}, b \neq
  0 \}$.'
explicacion_simple: Un número racional es cualquier número que representa una razón
  o proporción entre dos cantidades enteras. Incluye a todas las fracciones ordinarias,
  a los números enteros y a las expresiones decimales exactas o periódicas, ya que
  todas ellas pueden escribirse como una división entre un numerador entero y un denominador
  distinto de cero.
explicacion_formal: 'El conjunto de los **Números Racionales**, denotado por $\mathbb{Q}$
  (del italiano *quoziente*), se define por comprensión como:


  $$\mathbb{Q} = \left\{ \frac{a}{b} \;\middle|\; a, b \in \mathbb{Z} \land b \neq
  0 \right\}$$


  **Desglose de la fórmula:**

  - $a \in \mathbb{Z}$: Numerador, que representa el número entero de partes consideradas.

  - $b \in \mathbb{Z} \setminus \{0\}$: Denominador, que representa las partes iguales
  en que se divide la unidad.

  - $b \neq 0$: Condición indispensable para evitar la división por cero.


  > **Complemento didáctico:** Los conjuntos numéricos cumplen la cadena estricta
  de inclusión $\mathbb{N} \subset \mathbb{N}_0 \subset \mathbb{Z} \subset \mathbb{Q}$.'
definiciones_clave: '- **Número racional**: Cantidad de la forma $\frac{a}{b}$ con
  $a, b \in \mathbb{Z}$ y $b \neq 0$.

  - **Numerador y denominador**: Componentes entero superior e inferior de la fracción
  respectivamente.'
propiedades_relaciones: '- **Densidad en $\mathbb{Q}$**: Entre dos números racionales
  distintos cualesquiera existen infinitos números racionales.'
ejemplo_guiado:
  enunciado: Verifique si el número decimal $0,75$ es un número racional expresándolo
    en la forma $\frac{a}{b}$ con $a, b \in \mathbb{Z}$.
  pasos:
  - 'Paso 1: Escribir el decimal como fracción decimal: $0,75 = \frac{75}{100}$.'
  - 'Paso 2: Simplificar dividiendo por $25$: $\frac{75:25}{100:25} = \frac{3}{4}$.'
  - 'Paso 3: Verificar las condiciones: $3, 4 \in \mathbb{Z}$ y $4 \neq 0$.'
  - 'Conclusión: Como $0,75 = \frac{3}{4}$, $0,75$ es un número racional perteniente
    a $\mathbb{Q}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define al conjunto de los números
    racionales Q?
  choices:
  - text: Que se puedan expresar como a/b con a y b enteros y b distinto de cero
    is_correct: true
  - text: Que sean números primos únicamente
    is_correct: false
  - text: Que sean enteros positivos únicamente
    is_correct: false
  - text: Que su denominador sea cero
    is_correct: false
  explanation: La alternativa correcta es 'Que se puedan expresar como a/b con a y
    b enteros y b distinto de cero'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el decimal 0,75 es un número racional?
  choices:
  - text: Porque se puede expresar exactamente como la fracción 3/4 con denominador
      distinto de cero
    is_correct: true
  - text: Porque tiene dos cifras decimales
    is_correct: false
  - text: Porque es un entero par
    is_correct: false
  - text: Porque no se puede dividir
    is_correct: false
  explanation: La alternativa correcta es 'Porque se puede expresar exactamente como
    la fracción 3/4 con denominador distinto de cero'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Intentar expresar la cantidad dada en forma de fracción $\frac{a}{b}$.'
- 'Paso 2: Comprobar que tanto el numerador $a$ como el denominador $b$ sean números
  enteros.'
- 'Paso 3: Verificar que el denominador $b$ sea estrictamente distinto de cero.'
errores_correccion: '- **Error 1: Pensar que los racionales son solo las fracciones
  con números positivos.** **Cómo corregirlo:** $\mathbb{Q}$ incluye números racionales
  negativos (como $-\frac{3}{5}$) y enteros.


  - **Error 2: Creer que los números decimales como $0,5$ no son racionales.** **Cómo
  corregirlo:** $0,5 = \frac{1}{2}$, por lo que pertenece formalmente al conjunto
  $\mathbb{Q}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes expresiones pertenece al conjunto de los números
    racionales $\mathbb{Q}$?
  alternativas:
  - -2/3
  - √2
  - 5/0
  respuesta: -2/3
  solucion_pasos:
  - $-2/3$ tiene numerador y denominador enteros con $3 \neq 0$, por ende pertenece
    a $\mathbb{Q}$.
- titulo: Ejemplo 2
  enunciado: ¿Es el número entero $-5$ un número racional?
  alternativas:
  - Sí, porque se puede escribir como -5/1
  - No, porque es un entero negativo
  - Solo si se eleva al cuadrado
  respuesta: Sí, porque se puede escribir como -5/1
  solucion_pasos:
  - $-5 = \frac{-5}{1}$ con $1 \neq 0$, lo que satisface la definición de $\mathbb{Q}$.
- titulo: ¿El conjunto de los números enteros Z es un subconjunto de los racionales
    Q?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\mathbb{Z} \subset \mathbb{Q}$ pues todo entero $z = \frac{z}{1}$.
- titulo: ¿Es la expresión 7/0 un número racional?
  respuesta: 'No'
  solucion_pasos:
  - No, el denominador cero está prohibido en los números racionales.
errores_frecuentes:
- Los números racionales están formados únicamente por enteros positivos.
- Los números enteros negativos no forman parte del conjunto de los racionales $\mathbb{Q}$.
- Una expresión de la forma $a/0$ se clasifica como un número racional nulo.
- Los números decimales finitos como $0,4$ no pertenecen al conjunto de los racionales.
- El conjunto de los racionales $\mathbb{Q}$ es un conjunto finito de fracciones.
afirmaciones_verdaderas:
- El conjunto $\mathbb{Q}$ reúne a todas las cantidades que se pueden escribir como
  $a/b$ con $a, b \in \mathbb{Z}$ y $b \neq 0$.
- Todos los números enteros son números racionales con denominador igual a 1.
al_terminar_debes_poder: Al terminar serás capaz de definir y reconocer números racionales,
  comprobando su representación como $a/b$ con $a, b \in \mathbb{Z}$ y $b \neq 0$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
