semantic_id: MAT.ALG.ECUACION_BASE.DIFERENCIA_IDENTIDAD
resumen_inicial: 'Diferencia entre ecuación e identidad: propiedades, resolución y
  modelamiento en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: Hay dos tipos de frases algebraicas que usan el signo igual. Una
  es un misterio que hay que resolver (la ecuación). La otra es un hecho irrefutable
  que siempre es verdad (la identidad).
explicacion_formal: "### Definición formal\n\nComo es verdad para toda x, la x 'desaparece'\
  \ del cálculo, dejándote con una verdad absoluta.\n\n### Desarrollo didáctico\n\n\
  Piénsalo así:\n- **Ecuación (Condicional):** $x + 2 = 5$.\n  Pregunta: ¿Cuándo es\
  \ verdad esto? Solo cuando $x=3$. Si $x$ es otro número, es mentira.\n\n- **Identidad\
  \ (Absoluta):** $x + x = 2x$.\n  Pregunta: ¿Cuándo es verdad esto?\n  - Si $x =\
  \ 1$, $1+1 = 2(1) \\rightarrow 2=2$. Verdad.\n  - Si $x = 10$, $10+10 = 2(10) \\\
  rightarrow 20=20$. Verdad.\n  - Si $x = -5$, $-5-5 = 2(-5) \\rightarrow -10=-10$.\
  \ Verdad.\n  Es verdad para siempre y para cualquier número. Eso es una identidad.\n\
  \nLos Productos Notables (ej. $(a+b)^2 = a^2 + 2ab + b^2$) son identidades. No se\
  \ 'resuelven', se 'aplican', porque son una verdad universal sin importar cuánto\
  \ valgan 'a' y 'b'."
definiciones_clave: '- **Diferencia entre ecuación e identidad**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a diferencia entre ecuación e identidad.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando diferencia entre
    ecuación e identidad.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de diferencia entre ecuación
    e identidad.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
