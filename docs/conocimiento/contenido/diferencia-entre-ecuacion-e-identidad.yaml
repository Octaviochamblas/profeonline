procedimiento:
- 'Paso 1: Observa la igualdad algebraica.'
- 'Paso 2: Intenta resolverla o simplificarla al máximo.'
- 'Paso 3: Si al simplificar ambos lados te queda algo como $x = 3$, es una ecuación.'
- 'Paso 4: Si al simplificar llegas a algo como $x = x$ o $0 = 0$, significa que es
  una identidad.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en diferencia entre ecuación e identidad.
ejemplos:
- titulo: Determina si $2(x + 1) = 2x + 2$ es ecuación o identidad
  enunciado: Determina si $2(x + 1) = 2x + 2$ es ecuación o identidad.
  solucion_pasos:
  - 'Desarrolla el lado izquierdo multiplicando: $2x + 2$.'
  - 'Compara con el derecho: $2x + 2 = 2x + 2$.'
  - Son exactamente iguales en estructura. Cualquier valor de x funcionará.
  - Es una Identidad.
- titulo: 'Clasifica: $3x = 15$.'
  solucion_pasos:
  - Solo se cumple si x=5. No es universal.
- titulo: 'Respecto de «Diferencia entre ecuación e identidad»: ¿Es correcta esta
    caracterización? «Una'
  enunciado: 'Respecto de «Diferencia entre ecuación e identidad»: ¿Es correcta esta
    caracterización? «Una ecuación se cumple solo para algunos valores de la incógnita»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una ecuación se cumple solo
    para algunos valores de la incógnita.'
- titulo: 'Respecto de «Diferencia entre ecuación e identidad»: ¿Es válida esta afirmación?
    «Tratar de'
  enunciado: 'Respecto de «Diferencia entre ecuación e identidad»: ¿Es válida esta
    afirmación? «Tratar de resolver una identidad y frustrarse al llegar a $0 = 0$,
    pensando que se cometió un error»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una ecuación se cumple solo
    para algunos valores de la incógnita.'
errores_frecuentes:
- Tratar de resolver una identidad y frustrarse al llegar a $0 = 0$, pensando que
  se cometió un error.
- Para «¿Qué sucede invariablemente si intentas resolver algebraicamente una identidad»,
  la respuesta correcta es Llegas a un resultado fraccionario.
- Llegas a una contradicción como $0 = 1$.
- Llegas a que $x = 0$.
- $2x - 1 = 7$.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando diferencia
  entre ecuación e identidad.
