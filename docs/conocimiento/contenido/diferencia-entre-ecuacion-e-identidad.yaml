semantic_id: MAT.ALG.ECUACION_BASE.DIFERENCIA_IDENTIDAD
resumen_inicial: Una ecuación se cumple solo para ciertos valores de la variable,
  mientras que una identidad se cumple para cualquier valor numérico.
explicacion_simple: 'Es fundamental distinguir entre una ecuación y una identidad:

  - Una **ecuación** (como $2x = 6$) es restrictiva: solo es verdadera para un valor
  específico ($x = 3$).

  - Una **identidad** (como $2(x + 1) = 2x + 2$) es universal: es verdadera para cualquier
  número real que reemplaces en $x$.'
explicacion_formal: 'La diferencia formal entre **identidad** y **ecuación** radica
  en el cuantificador sobre el dominio $\mathbb{R}$:


  $$\text{Identidad: } A(x) = B(x) \quad \forall x \in \mathbb{R}$$

  $$\text{Ecuación: } A(x) = B(x) \quad \exists x \in S \subset \mathbb{R}$$


  **Desglose de la fórmula:**

  - $\forall x \in \mathbb{R}$: Exige que la igualdad sea verdadera para todo número
  del universo real.

  - $\exists x \in S$: La igualdad solo es válida para el subconjunto restricto o
  puntual $S$ solución.'
definiciones_clave: '- **Identidad algebraica**: Igualdad que se verifica para absolutamente
  todos los valores admisibles de la variable.

  - **Ecuación condicional**: Igualdad que se cumple únicamente para un número finito
  o específico de valores.'
propiedades_relaciones: '- **Simplificación de identidades**: Reducir una identidad
  resulta en la igualdad trivial $0 = 0$.

  - **Ecuación sin solución**: Si una supuesta ecuación se reduce a $0 = 5$, es una
  contradicción o igualdad imposible.'
ejemplo_guiado:
  enunciado: Determina si la igualdad $3(x + 2) - 3x = 6$ es una identidad o una ecuación
    condicional evaluando para $x = 0$, $x = 5$ y $x = -2$.
  pasos:
  - 'Paso 1: Evaluar para $x = 0$: $3(0 + 2) - 3(0) = 6 - 0 = 6$ (se cumple $6 = 6$).Paso
    2: Evaluar para $x = 5$: $3(5 + 2) - 3(5) = 21 - 15 = 6$ (se cumple $6 = 6$).Paso
    3: Evaluar para $x = -2$: $3(-2 + 2) - 3(-2) = 0 + 6 = 6$ (se cumple $6 = 6$).Paso
    4: Como la igualdad se cumple para cualquier valor de $x$, la expresión $3(x +
    2) - 3x = 6$ es una **identidad**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza a una identidad algebraica frente a una ecuación condicional?
  choices:
  - text: Que la igualdad es verdadera para cualquier valor de la variable en $\mathbb{R}$.
    is_correct: true
  - text: Que solo se cumple para un único valor de la incógnita.
    is_correct: false
  - text: Que no se puede evaluar con números negativos.
    is_correct: false
  - text: Que el resultado siempre es igual a cero.
    is_correct: false
  explanation: La alternativa correcta es 'Que la igualdad es verdadera para cualquier
    valor de la variable en $\mathbb{R}$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar la expresión $3(x + 2) - 3x = 6$, ¿qué resultado se obtiene
    que confirma que es una identidad?
  choices:
  - text: $6 = 6$ (o $0 = 0$)
    is_correct: true
  - text: $x = 6$
    is_correct: false
  - text: $x = 0$
    is_correct: false
  - text: $0 = 6$
    is_correct: false
  explanation: La alternativa correcta es '$6 = 6$ (o $0 = 0$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar propiedades algebraicas (como la distributiva) para simplificar
  ambos miembros.'
- 'Paso 2: Si los términos con la variable $x$ se cancelan y se obtiene una constante
  igual a sí misma ($a = a$), es una identidad.'
- 'Paso 3: Si se obtiene un valor puntual para $x$ ($x = c$), es una ecuación condicional.'
- 'Paso 4: Si se obtiene una falsedad ($a = b$ con $a \neq b$), es una imposibilidad
  o ecuación sin solución.'
errores_correccion: '- **Error común:** Confundir $0x = 0$ (identidad con infinitas
  soluciones) con $0x = 5$ (sin solución).

  - **Cómo corregirlo:** Si la variable desaparece y la igualdad restante es verdadera
  ($0 = 0$), es una IDENTIDAD.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
