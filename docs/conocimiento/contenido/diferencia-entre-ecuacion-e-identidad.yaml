semantic_id: MAT.ALG.ECUACION_BASE.DIFERENCIA_IDENTIDAD
resumen_inicial: Una ecuación se cumple solo para ciertos valores específicos de la variable, mientras que una identidad se verifica para cualquier número real.
explicacion_simple: |
  Es esencial distinguir la diferencia fundamental entre una ecuación y una identidad:

  - Una **ecuación** (como $2x = 6$) es una igualdad condicionada: solo resulta verdadera para valores puntuales de la variable (en este caso, exclusivamente $x = 3$).

  - Una **identidad** (como $2(x + 1) = 2x + 2$) es una igualdad universal: resulta verdadera sin importar qué número real sustituyas en la variable $x$.
explicacion_formal: |
  ### Definición formal
  La diferencia formal entre una **identidad** y una **ecuación** se establece mediante cuantificadores sobre el dominio $\mathbb{R}$:

  $$\text{Identidad: } A(x) = B(x) \quad \forall x \in \mathbb{R}$$

  $$\text{Ecuación: } A(x) = B(x) \quad \exists x \in S \subset \mathbb{R}$$

  ### Desglose de la fórmula
  - $\forall x \in \mathbb{R}$: La igualdad es una tautología algebraica válida para todo elemento del dominio real.
  - $\exists x \in S$: La igualdad exige un subconjunto restricto $S$ donde se verifica la veracidad de la relación.

  ### Síntesis didáctica
  Reducir una identidad algebraicamente conduce a la tautología $0 = 0$, mientras que reducir una ecuación lineal determina el valor numérico único de la incógnita.
definiciones_clave: |
  - **Identidad algebraica**: Igualdad que se verifica universalmente para todos los valores admisibles de la variable.
  - **Ecuación condicional**: Igualdad cuya veracidad está supeditada únicamente a un conjunto solución finito o restringido.
propiedades_relaciones: |
  - **Simplificación de identidades**: Al restar los términos equivalentes de ambos miembros, se obtiene la igualdad trivial $0 = 0$.
  - **Contradicción o ecuación imposible**: Si la simplificación produce una constante falsa como $0 = 5$, la ecuación no posee solución en $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Determina si la igualdad $3(x + 2) - 3x = 6$ corresponde a una identidad o a una ecuación condicional evaluando para $x = 0$, $x = 5$ y $x = -2$.'
  pasos:
    - 'Paso 1: Evaluar para $x = 0$: $3(0 + 2) - 3(0) = 6 - 0 = 6 \implies 6 = 6$ (se verifica).'
    - 'Paso 2: Evaluar para $x = 5$: $3(5 + 2) - 3(5) = 21 - 15 = 6 \implies 6 = 6$ (se verifica).'
    - 'Paso 3: Evaluar para $x = -2$: $3(-2 + 2) - 3(-2) = 0 + 6 = 6 \implies 6 = 6$ (se verifica).'
    - 'Paso 4: Puesto que se cumple universalmente para cualquier valor asignado a $x$, la igualdad $3(x + 2) - 3x = 6$ es una identidad.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad lógica caracteriza a una identidad algebraica en el dominio de los números reales?'
    choices:
      - {text: 'Que la igualdad se cumple universalmente para todo valor de la variable $x \in \mathbb{R}$.', is_correct: true}
      - {text: 'Que solo admite soluciones enteras pares positivas.', is_correct: false}
      - {text: 'Que la variable debe estar necesariamente elevada al cuadrado.', is_correct: false}
      - {text: 'Que requiere exactamente dos incógnitas distintas para ser válida.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la igualdad se cumple universalmente para todo valor de la variable $x \in \mathbb{R}$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar algebraicamente la igualdad $3(x + 2) - 3x = 6$, ¿qué expresión trivial confirma que es una identidad?'
    choices:
      - {text: '$6 = 6$ (o $0 = 0$)', is_correct: true}
      - {text: '$x = 6$', is_correct: false}
      - {text: '$x = 0$', is_correct: false}
      - {text: '$0 = 6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$6 = 6$ (o $0 = 0$)''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar los paréntesis y productos presentes en ambos miembros mediante propiedades algebraicas.'
  - 'Paso 2: Agrupar y reducir los términos semejantes que contienen a la variable $x$.'
  - 'Paso 3: Analizar el resultado: si se obtiene $0 = 0$ (o $c = c$), la expresión es una identidad.'
  - 'Paso 4: Si se despeja un valor único de la forma $x = k$, la expresión es una ecuación condicional.'
errores_correccion: |
  - **Error 1:** Confundir la reducción $0 \cdot x = 0$ (identidad con infinitas soluciones) con $0 \cdot x = 5$ (contradicción sin solución). **Cómo corregirlo:** La reducción $0 = 0$ **ES UNA IDENTIDAD VÁLIDA PARA TODO $x \in \mathbb{R}$, MIENTRAS QUE $0 = 5$ ES UNA IMPOSIBILIDAD SIN SOLUCIÓN**.
  - **Error 2:** Declarar que una igualdad es una ecuación condicional habiendo probado un solo valor numérico. **Cómo corregirlo:** Para clasificar una expresión **SE DEBE SIMPLIFICAR SU ESTRUCTURA ALGEBRAICA COMPLETA O PROBAR MÚLTIPLES VALORES DIVERSOS**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál de las siguientes relaciones numérico-algebraicas constituye una identidad?'
    alternativas:
      - '$4(x + 3) = 4x + 12$'
      - '$4(x + 3) = 20$'
      - '$4x + 3 = 12$'
    respuesta: '$4(x + 3) = 4x + 12$'
    solucion_pasos:
      - '1. Aplicar distributiva: $4(x + 3) = 4x + 12$.'
      - '2. Ambos miembros son idénticos $\implies$ es una identidad.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Si al simplificar una igualdad se obtiene $0 \cdot x = 7$, ¿cómo se clasifica dicha relación?'
    alternativas:
      - 'Ecuación inconsistente (sin solución)'
      - 'Identidad algebraica'
      - 'Ecuación lineal con solución $x = 7$'
    respuesta: 'Ecuación inconsistente (sin solución)'
    solucion_pasos:
      - '1. $0 \cdot x = 0$ para todo $x$.'
      - '2. La afirmación $0 = 7$ es una contradicción $\implies$ no tiene solución.'
  - titulo: 'Veracidad de identidades'
    enunciado: '¿La propiedad distributiva $(a + b)^2 = a^2 + 2ab + b^2$ constituye una identidad algebraica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es una identidad válida para cualquier par de números reales.'
  - titulo: 'Restricción de soluciones'
    enunciado: '¿Una ecuación condicional lineal estándar de la forma $ax + b = c$ posee infinitas soluciones reales?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, posee una única solución puntual en el conjunto de los reales.'
errores_frecuentes:
  - 'Considerar que las identidades solo son válidas cuando la variable toma valores enteros positivos.'
  - 'Confundir la igualdad trivial $0 = 0$ de una identidad con una falta de solución en la ecuación.'
  - 'Concluir que una expresión es una identidad evaluando solo el valor $x = 0$.'
  - 'Despejar la variable en una identidad cancelando incorrectamente los términos para forzar un valor numérico.'
  - 'Tratar una contradicción como $0 = 3$ afirmando que $x = 3$ es la solución.'
afirmaciones_verdaderas:
  - 'Una identidad es una igualdad algebraica que se verifica para cualquier valor asignado a sus variables.'
  - 'La reducción algebraica de una identidad conduce a una equivalencia trivial del tipo $0 = 0$.'
al_terminar_debes_poder: |
  QUÉ: Distinguir conceptualmente una ecuación condicional de una identidad algebraica.
  CÓMO: Simplificar ambos miembros y evaluar el conjunto solución (universal $\mathbb{R}$ en identidades frente a puntual en ecuaciones).
fuente: 'Texto escolar MINEDUC — Álgebra 7° Básico / Ecuaciones Lineales.'
