semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.MODUS_PONENS
resumen_inicial: 'Definición, estructura deductiva y validez formal de la regla de inferencia Modus Ponendo Ponens (afirmando el antecedente se afirma el consecuente).'
explicacion_simple: |
  El **Modus Ponens** (nombre completo: *Modus Ponendo Ponens*, que significa "el método que afirma afirmando") es la regla de deducción lógica más natural y utilizada. Dice lo siguiente: si sabemos que una regla condicional es verdadera ("Si llueve, la calle se moja") y sabemos con certeza que la primera parte ocurrió ("Efectivamente está lloviendo"), **podemos concluir con total seguridad que la segunda parte es verdadera ("Por lo tanto, la calle está mojada")**.
explicacion_formal: |
  ### Definición formal
  En el cálculo deductivo y los sistemas de deducción natural, el **Modus Ponendo Ponens (MP)** es una regla de inferencia válida y primitiva cuya estructura secuencial formal es:
  $$\frac{p \to q, \quad p}{\therefore q}$$
  Su validez semántica se sustenta en que la fórmula implicativa correspondiente es una tautología estricta:
  $$\models ((p \to q) \land p) \to q$$

  ### Desglose simbólico
  - Premisa Mayor: $p \to q$ (regla condicional establecida).
  - Premisa Menor: $p$ (afirmación fáctica del antecedente).
  - Conclusión necesaria: $q$ (deducción irrebatible del consecuente).
  - Demostración de validez: Si $v(p \to q) = V$ y $v(p) = V$, la única fila compatible en la tabla de verdad es la Fila 1 ($V, V$), donde necesariamente $v(q) = V$.

  ### Síntesis didáctica
  El Modus Ponens permite avanzar deductivamente desde las hipótesis hacia las conclusiones en cualquier demostración matemática formal.
definiciones_clave: |
  - **Modus Ponens (MP)**: Regla de inferencia que permite deducir $q$ a partir de las premisas $p \to q$ y $p$.
  - **Premisa mayor**: Proposición condicional general que establece la regla de inferencia.
  - **Premisa menor**: Proposición atómica que valida el antecedente de la premisa mayor.
propiedades_relaciones: |
  - **Preservación de la verdad**: Si las premisas son verdaderas, la conclusión $q$ es necesariamente verdadera en el 100% de los casos.
  - **Distinción con la falacia de afirmación del consecuente**: Conocer $p \to q$ y $q$ NO permite deducir $p$ (eso es una falacia formal).
ejemplo_guiado:
  enunciado: 'Aplica la regla del Modus Ponens a las siguientes premisas: Premisa 1: "Si un número entero es múltiplo de $6$, entonces es múltiplo de $2$". Premisa 2: "El número $24$ es múltiplo de $6$".'
  pasos:
    - 'Paso 1: Identificar las variables proposicionales:
      - $p$: "El número $24$ es múltiplo de $6$".
      - $q$: "El número $24$ es múltiplo de $2$".'
    - 'Paso 2: Escribir la Premisa 1 en forma simbólica: $p \to q$.'
    - 'Paso 3: Escribir la Premisa 2 en forma simbólica: $p$ (se afirma el antecedente).'
    - 'Paso 4: Aplicar el esquema del Modus Ponens $\frac{p \to q, \quad p}{\therefore q}$.'
    - 'Paso 5: Enunciar la conclusión deducida: "Por lo tanto, el número $24$ es múltiplo de $2$".'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el esquema formal y la conclusión deducida mediante la regla del Modus Ponens?'
    choices:
      - {text: 'A partir de $p \to q$ y $p$, se deduce válidamente $q$', is_correct: true}
      - {text: 'A partir de $p \to q$ y $q$, se deduce válidamente $p$', is_correct: false}
      - {text: 'A partir de $p \to q$ y $\neg p$, se deduce válidamente $\neg q$', is_correct: false}
      - {text: 'A partir de $p \land q$, se deduce válidamente $\neg p$', is_correct: false}
    explanation: 'La alternativa correcta es ''A partir de $p \to q$ y $p$, se deduce válidamente $q$''. El Modus Ponens afirma el antecedente para deducir el consecuente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la fórmula $((p \to q) \land p) \to q$ es considerada una tautología?'
    choices:
      - {text: 'Porque no existe ninguna combinación donde las premisas sean verdaderas y la conclusión falsa', is_correct: true}
      - {text: 'Porque contiene tres variables proposicionales distintas', is_correct: false}
      - {text: 'Porque es una fórmula que solo utiliza conjunciones', is_correct: false}
      - {text: 'Porque la conclusión $q$ es siempre verdadera por sí sola', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque no existe ninguna combinación donde las premisas sean verdaderas y la conclusión falsa''. Garantiza la validez del razonamiento.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la premisa condicional mayor: $p \to q$.'
  - 'Paso 2: Localizar la premisa menor fáctica y comprobar que coincide exactamente con el antecedente $p$.'
  - 'Paso 3: Verificar que no se esté afirmando el consecuente (evitando la falacia de afirmación del consecuente).'
  - 'Paso 4: Emitir formalmente la conclusión necesaria $q$.'
errores_correccion: |
  - **Error 1:** Afirmar el consecuente $q$ para intentar deducir $p$. **Cómo corregirlo:** Si tenemos $p \to q$ y sabemos $q$, no podemos deducir $p$ (Falacia de Afirmación del Consecuente). El Modus Ponens exige afirmar estrictamente el antecedente $p$.
  - **Error 2:** Negar el antecedente $\neg p$ para intentar deducir $\neg q$. **Cómo corregirlo:** Si tenemos $p \to q$ y $\neg p$, no podemos deducir $\neg q$ (Falacia de Negación del Antecedente).
ejemplos:
  - titulo: 'Deducción geométrica'
    enunciado: 'Premisas: "Si un polígono tiene 3 lados, es triángulo" y "La figura $F$ tiene 3 lados". ¿Qué se concluye?'
    alternativas:
      - 'La figura $F$ es un triángulo'
      - 'La figura $F$ es un polígono regular'
      - 'No se puede concluir nada'
    respuesta: 'La figura $F$ es un triángulo'
    solucion_pasos:
      - '1. Premisa 1: $p \to q$.'
      - '2. Premisa 2: $p$.'
      - '3. Por Modus Ponens se concluye $q$: "La figura $F$ es un triángulo".'
  - titulo: 'Tautología del Modus Ponens'
    enunciado: '¿La fórmula $((p \to q) \land p) \to q$ es una tautología?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, su tabla de verdad produce el vector $[V, V, V, V]^T$.'
  - titulo: 'Inferencia con negaciones'
    enunciado: 'Dadas las premisas $\neg p \to q$ y $\neg p$, ¿se concluye válidamente $q$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, como la premisa menor coincide con el antecedente $\neg p$, por Modus Ponens se concluye $q$.'
  - titulo: 'Validez deductiva'
    enunciado: '¿El Modus Ponens preserva la verdad de las premisas hacia la conclusión?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, si las premisas son verdaderas, la conclusión es infaliblemente verdadera.'
errores_frecuentes:
  - 'La afirmación de que a partir de las premisas $p \to q$ y $q$ se deduce válidamente $p$ mediante Modus Ponens.'
  - 'La afirmación de que a partir de las premisas $p \to q$ y $\neg p$ se deduce válidamente $\neg q$.'
  - 'La afirmación de que el Modus Ponens puede generar una conclusión falsa a partir de premisas verdaderas.'
  - 'La afirmación de que la fórmula condicional del Modus Ponens es una contingencia.'
  - 'La afirmación de que el Modus Ponens exige que el consecuente sea idéntico al antecedente.'
afirmaciones_verdaderas:
  - 'La regla del Modus Ponens establece que a partir de la premisa condicional $p \to q$ y la afirmación del antecedente $p$, se deduce válidamente el consecuente $q$.'
  - 'La validez deductiva del Modus Ponens se fundamenta en que la implicación $((p \to q) \land p) \to q$ es una tautología universal.'
al_terminar_debes_poder: |
  QUÉ: Conocer, justificar y aplicar la regla de inferencia deductiva Modus Ponens ($\frac{p \to q, p}{\therefore q}$).
  CÓMO: Identificar antecedente y consecuente, aplicar la regla de afirmación directa y distinguir el razonamiento válido de las falacias formales.
