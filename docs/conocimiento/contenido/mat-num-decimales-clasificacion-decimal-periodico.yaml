semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.DECIMAL_PERIODICO
resumen_inicial: "Un decimal infinito periódico puro es aquel número racional cuya parte decimal está formada por un bloque de cifras (período) que se repite indefinidamente justo después de la coma."
explicacion_simple: |
  Un **decimal infinito periódico puro** es un número en el que una o varias cifras decimales se repiten sin parar para siempre, comenzando **inmediatamente después de la coma**. Para no escribir números infinitos como $0.33333\dots$, en matemática usamos una barrita horizontal sobre la cifra o bloque que se repite: $0.\overline{3}$. Otro ejemplo es $\frac{2}{11} = 0.181818\dots = 0.\overline{18}$. El bloque que se repite bajo la barra se llama **período**.
explicacion_formal: |
  Formalmente, un **número decimal infinito periódico puro** es un desarrollo decimal de la forma:
  $d = a_k a_{k-1} \dots a_0 , \overline{p_1 p_2 \dots p_m} = a_k \dots a_0 + \sum_{k=1}^{\infty} \frac{P}{10^{m \cdot k}}$
  donde $P = p_1 p_2 \dots p_m$ es una secuencia de $m$ dígitos llamada **período**, que se repite de manera periódica infinitas veces.

  Criterio de existencia fraccionaria: una fracción irreductible $\frac{a}{b} \in \mathbb{Q}$ genera un decimal infinito periódico puro si y solo si su denominador $b$ no tiene NINGÚN factor primo 2 ni 5 en su descomposición:
  $$\text{MCD}(b, 10) = 1, \quad \text{es decir, } 2 \nmid b \text{ y } 5 \nmid b$$
definiciones_clave: |
  - **Decimal periódico puro**: Número con expansión decimal infinita donde el patrón repetitivo comienza inmediatamente tras la coma.
  - **Período**: Cifra o bloque de cifras decimales que se repite infinitas veces en el mismo orden.
  - **Barra de período ($\overline{\quad}$)**: Notación matemática colocada sobre el bloque de dígitos para indicar su repetición infinita.
propiedades_relaciones: |
  - **Conversión a fracción racional (Regla de los 9s)**: Un decimal periódico puro de la forma $0.\overline{P}$ equivale a la fracción $\frac{P}{99\dots9}$ donde el denominador contiene tantos nueves como cifras tenga el período.
  - **Demostración algebraica vía multiplicación por $10^m$**: Método riguroso donde se multiplica $x = 0.\overline{P}$ por $10^m$, restando $10^m x - x = P$ para despejar $x = \frac{P}{10^m - 1}$.
  - **Densidad racional**: Todo decimal infinito periódico es 100% un número racional ($d \in \mathbb{Q}$).
ejemplo_guiado:
  enunciado: "Demuestra la equivalencia entre el decimal periódico puro $0.\\overline{36}$ y su fracción irreductible usando la regla de conversión y mediante el método algebraico de restas de ecuaciones."
  pasos:
    - "Método 1 (Regla de los nueves): identificar el período $P = 36$ (posee 2 cifras)."
    - 'Escribir el numerador $36$ y el denominador con $2$ nueves: $\frac{36}{99}$.'
    - 'Simplificar dividiendo por $9$: $\frac{36 \div 9}{99 \div 9} = \frac{4}{11}$.'
    - 'Método 2 (Algebraico): sea $x = 0.363636\dots$'
    - 'Multiplicar por $100$ ($2$ cifras de período): $100x = 36.363636\dots$'
    - 'Restar $100x - x$: $99x = 36 \implies x = \frac{36}{99} = \frac{4}{11}$.'
    - 'Concluir: en ambos métodos la fracción irreductible es $\frac{4}{11}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué caracteriza a un decimal infinito periódico puro a diferencia de uno semiperiódico?"
    choices:
      - {text: "Que el período repetitivo comienza inmediatamente después de la coma decimal.", is_correct: true}
      - {text: "Que tiene una cantidad finita de decimales.", is_correct: false}
      - {text: "Que la repetición comienza después de varios ceros obligatoriamente.", is_correct: false}
      - {text: "Que su denominador debe contener factores primos 2 y 5.", is_correct: false}
    explanation: "La correcta es Que el período repetitivo comienza inmediatamente después de la coma decimal.: define la pureza del desarrollo periódico sin anteperíodo intermedio."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es la fracción irreductible equivalente al decimal periódico $0.\\overline{7}$?"
    choices:
      - {text: '\$\frac{7}{9}$', is_correct: true}
      - {text: '\$\frac{7}{10}$', is_correct: false}
      - {text: '\$\frac{7}{99}$', is_correct: false}
      - {text: '\$\frac{7}{90}$', is_correct: false}
    explanation: 'La correcta es \$\frac{7}{9}$: un período de 1 cifra se coloca sobre un solo 9.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar la parte entera y el bloque del período $P$ que se repite inmediatamente tras la coma."
  - "Paso 2: Contar el número de dígitos $m$ que integran el período."
  - "Paso 3: Formar el numerador restando a todo el número sin coma la parte entera."
  - 'Paso 4: Formar el denominador con una cadena de $m$ nueves ($99\dots9$).'
  - "Paso 5: Simplificar la fracción resultante hasta hacerla irreductible."
errores_correccion: |
  Un error clásico es poner una potencia de 10 en el denominador al convertir un decimal periódico (por ejemplo decir que $0.\overline{3} = \frac{3}{10}$). Recuerda: **las cifras del período se dividen por NUEVES (9), no por ceros ni diez**. Por eso $0.\overline{3} = \frac{3}{9} = \frac{1}{3}$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Convierte el decimal periódico puro $1.\\overline{5}$ a fracción irreductible."
    alternativas:
      - '\$\frac{14}{9}$'
      - '\$\frac{15}{9}$'
      - '\$\frac{15}{10}$'
    respuesta: '\$\frac{14}{9}$'
    solucion_pasos:
      - 'Aplicamos la fórmula: $\frac{15 - 1}{9} = \frac{14}{9}$.'
      - "Como $14$ y $9$ no tienen divisores comunes, la fracción es irreductible."
  - titulo: "Ejemplo 2"
    enunciado: "¿Cuál es el valor exacto de la suma $0.\\overline{3} + 0.\\overline{6}$?"
    alternativas:
      - "1"
      - '0.\$\overline{9}$'
      - "Ambas son correctas"
    respuesta: "Ambas son correctas"
    solucion_pasos:
      - '$0.\overline{3} = \frac{3}{9} = \frac{1}{3}$ y $0.\overline{6} = \frac{6}{9} = \frac{2}{3}$.'
      - 'Suma: $\frac{1}{3} + \frac{2}{3} = \frac{3}{3} = 1$.'
      - 'Notar que $0.\overline{9} = \frac{9}{9} = 1$ es una identidad matemática válida.'
  - titulo: "¿Es la fracción $\\frac{5}{7}$ un decimal infinito periódico puro?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, porque el denominador $7$ no tiene ni al 2 ni al 5 como divisores primos, produciendo $0.\overline{714285}$.'
  - titulo: "¿Se puede realizar una resta directa entre decimales periódicos sin convertirlos a fracción?"
    respuesta: "Es riesgoso, es mejor convertirlos a fracción primero para evitar errores con las reservas del infinito."
    solucion_pasos:
      - 'Siempre es recomendable trabajar en el dominio de las fracciones $\mathbb{Q}$ para asegurar precisión exacta.'
errores_frecuentes:
  - "Colocar dieces o potencias de 10 en lugar de nueves al convertir a fracción."
  - "Olvidar restar la parte entera al calcular el numerador de un decimal periódico con entero mayor que cero."
  - "Confundir el decimal periódico puro con el semiperiódico (que posee anteperíodo)."
  - "Pensar que un número con infinitos decimales periódicos es irracional."
  - "Truncar o redondear el período en lugar de mantener la barrita de notación."
afirmaciones_verdaderas:
  - "Un decimal infinito periódico puro tiene su período justo después de la coma."
  - "Todo decimal periódico puro es un número racional que equivale a una fracción cuyo denominador está compuesto por nueves."
al_terminar_debes_poder: |
  Debes ser capaz de identificar decimales periódicos puros, aplicar la regla de conversión con nueves y fundamentar la equivalencia con su representación fraccionaria.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
