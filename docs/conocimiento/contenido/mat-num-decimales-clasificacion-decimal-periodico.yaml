semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.DECIMAL_PERIODICO
resumen_inicial: 'Un decimal infinito periódico tiene un bloque de cifras (período)
  que se repite indefinidamente inmediatamente después de la coma: $0,\overline{a_1
  a_2 \dots a_p}$.'
explicacion_simple: Un decimal infinito periódico es aquel donde uno o más números
  se repiten exactamente igual y sin parar justo después de la coma. Esta secuencia
  de números repetidos infinitamente se llama período y se acostumbra a marcar dibujando
  una barra horizontal sobre ellos.
explicacion_formal: 'Un racional $d \in \mathbb{Q}$ es un **Decimal Infinito Periódico**
  si adopta la forma de expansión infinita:


  $$d = a_0, \overline{p_1 p_2 \dots p_k} = a_0 + \sum_{m=0}^{\infty} \left( \frac{P}{10^{k
  \cdot (m+1)}} \right) \quad (P = p_1 p_2 \dots p_k)$$


  **Desglose de la fórmula:**

  - $\overline{P} = \overline{p_1 p_2 \dots p_k}$: Bloque de $k$ dígitos denominado
  período que comienza inmediatamente tras la coma.

  - Criterio de fracción irreductible: $\frac{a}{b}$ es periódico puro $\iff \operatorname{MCD}(b,
  10) = 1$ (el denominador $b$ no tiene factores primos $2$ ni $5$).


  > **Complemento didáctico:** El número de $9$s en el denominador de su fracción
  generatriz es idéntico a la cantidad de dígitos que contiene la barra del período.'
definiciones_clave: '- **Decimal infinito periódico (puro)**: Expresión donde la repetición
  periódica inicia inmediatamente a la derecha de la coma decimal.'
propiedades_relaciones: '- **Inexistencia de anteperíodo**: La barra comienza inmediatamente
  a la derecha de la coma decimal.'
ejemplo_guiado:
  enunciado: Clasifique el número decimal $0,4444... = 0,\overline{4}$ e identifique
    sus características.
  pasos:
  - 'Paso 1: Observar la parte decimal: la cifra $4$ se repite infinitas veces.'
  - 'Paso 2: Comprobar dónde inicia la repetición: inicia inmediatamente a la derecha
    de la coma.'
  - 'Paso 3: Identificar el período: la cifra $4$ debajo de la barra $\overline{4}$.'
  - 'Conclusión: Es un decimal infinito periódico puro con período $4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde comienza a repetirse el período en un decimal infinito periódico
    puro?
  choices:
  - text: Inmediatamente a la derecha de la coma decimal
    is_correct: true
  - text: Después de dos dígitos no repetidos
    is_correct: false
  - text: A la izquierda de la coma
    is_correct: false
  - text: En el lugar del entero
    is_correct: false
  explanation: La alternativa correcta es 'Inmediatamente a la derecha de la coma
    decimal'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "En el ejemplo guiado para 0,4444... = 0,\bar{4}, ¿cuál es el período?"
  choices:
  - text: '4'
    is_correct: true
  - text: '44'
    is_correct: false
  - text: 0,4
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la expansión decimal después de la coma.'
- 'Paso 2: Verificar si la secuencia de dígitos repetitivos comienza de forma inmediata
  sin dígitos intermedios.'
- 'Paso 3: Colocar la barra del período sobre el bloque repetitivo y clasificarlo
  como decimal periódico.'
errores_correccion: '- **Error 1: Confundir decimal periódico puro con semiperiódico.**
  **Cómo corregirlo:** Si hay cifras decimales no repetidas antes del período, es
  SEMIPERIÓDICO; si la barra empieza justo en la coma, es PERIÓDICO PURO.


  - **Error 2: Creer que un decimal periódico es irracional por ser infinito.** **Cómo
  corregirlo:** Todo decimal periódico es RACIONAL (pertenece a $\mathbb{Q}$) porque
  se puede transformar a fracción.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Clasifique la fracción 1/3.
  alternativas:
  - Decimal infinito periódico puro (0,333...)
  - Decimal finito
  - Decimal semiperiódico
  respuesta: Decimal infinito periódico puro (0,333...)
  solucion_pasos:
  - '$1 : 3 = 0,333... = 0,\overline{3}$ (periódico puro).'
- titulo: Ejemplo 2
  enunciado: ¿Es $1,272727... = 1,\overline{27}$ un decimal periódico puro?
  alternativas:
  - Sí, el período 27 empieza inmediatamente tras la coma
  - No, porque tiene parte entera 1
  - Es semiperiódico
  respuesta: Sí, el período 27 empieza inmediatamente tras la coma
  solucion_pasos:
  - La parte entera $1$ no altera la clasificación de la parte decimal periódica pura.
- titulo: ¿Es 0,6666... un número racional?
  respuesta: Sí
  solucion_pasos:
  - Sí, equivale a la fracción $2/3 \in \mathbb{Q}$.
- titulo: "¿Tiene el número 0,\bar{15} anteperíodo?"
  respuesta: 'No'
  solucion_pasos:
  - No, el período $15$ comienza de inmediato tras la coma.
errores_frecuentes:
- Un decimal infinito periódico es un número irracional que no pertenece a los racionales.
- El período en los decimales periódicos puros comienza dos posiciones después de
  la coma.
- La presencia de una parte entera mayor a cero convierte al decimal periódico en
  semiperiódico.
- Un decimal periódico puro se representa dividiendo el período por potencias de 10.
- Las fracciones de denominador 9 generan siempre decimales finitos exactos.
afirmaciones_verdaderas:
- Un decimal periódico puro se caracteriza por tener un período que inicia inmediatamente
  después de la coma.
- Todos los números decimales periódicos son números racionales pertenecientes al
  conjunto Q.
al_terminar_debes_poder: Al terminar serás capaz de identificar y clasificar números
  decimales infinitos periódicos puros, reconociendo el período que inicia inmediatamente
  tras la coma decimal.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
