semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RAIZ_EN_POTENCIA
resumen_inicial: 'La relación entre funciones raíz y funciones potencia establece la equivalencia algebraica $f(x) = a \sqrt[q]{x^p} \equiv a x^{p/q}$, donde el índice de la raíz pasa al denominador del exponente.'
explicacion_simple: |
  Las expresiones con raíces (como la raíz cuadrada $\sqrt{x}$ o la raíz cúbica $\sqrt[3]{x^2}$) son en realidad funciones potencia disfrazadas. La regla de conversión establece que el exponente interno de la $x$ ($p$) queda arriba en el numerador del exponente, mientras que el índice de la raíz ($q$) pasa abajo al denominador: $\sqrt[q]{x^p} = x^{p/q}$. Por ejemplo, $\sqrt{x} = x^{1/2}$ y $\sqrt[3]{x^2} = x^{2/3}$.
explicacion_formal: |
  ### Definición formal
  La **conversión de funciones radicales a funciones potencia de exponente fraccionario** es la identidad algebraica definida para toda base $x \in \operatorname{Dom}(f)$ por:
  $$f(x) = a \cdot \sqrt[q]{x^p} \equiv a \cdot x^{\frac{p}{q}}$$
  donde:
  - **$p \in \mathbb{Z}$**: Numerador del exponente fraccionario, correspondiente al exponente de la potencia de la base $x^p$.
  - **$q \in \mathbb{Z}^+ \setminus \{1\}$**: Denominador del exponente fraccionario, correspondiente al índice del radical $\sqrt[q]{\cdot}$.
  - **$a \in \mathbb{R} \setminus \{0\}$**: Coeficiente multiplicativo o parámetro escalar de la función.

  ### Propiedades del Exponente Fraccionario
  - **Raíz Principal Cuadrada**: $f(x) = \sqrt{x} \equiv x^{1/2}$ (con $p = 1, q = 2$).
  - **Raíz Cúbica**: $f(x) = \sqrt[3]{x} \equiv x^{1/3}$ (con $p = 1, q = 3$).
  - **Inversa de Potencia Entera**: La función raíz $\sqrt[n]{x} = x^{1/n}$ es la función inversa real de la potencia entera $x^n$ en sus tramos monótonos.

  ### Síntesis didáctica
  Regla mnemotécnica del Sol y la Sombrilla: El exponente interno $p$ está bajo el sol (pasa arriba en el numerador); el índice de la raíz $q$ está bajo la sombrilla del radical (pasa abajo al denominador).
definiciones_clave: |
  - **Exponente fraccionario $p/q$**: Representación de la operación combinada de potencia de grado $p$ y raíz de índice $q$.
  - **Índice del radical $q$**: Número que indica el grado de la raíz y se convierte en el denominador del exponente.
  - **Equivalencia analítica**: Identidad funcional que permite aplicar las leyes de los exponentes a expresiones radicales.
propiedades_relaciones: |
  - **Leyes de exponentes universales**: Expresar raíces como $x^{p/q}$ permite aplicar reglas de producto ($x^a \cdot x^b = x^{a+b}$), cociente ($x^a / x^b = x^{a-b}$) y potencia de potencia.
  - **Dependencia del dominio por la paridad del denominador $q$**: Si $q$ es par, exige $x \ge 0$; si $q$ es impar, el dominio abarca todo $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Convierte las siguientes expresiones radicales a funciones potencia de exponente fraccionario o viceversa: A) $f(x) = 4\sqrt[5]{x^3}$, B) $g(x) = -2 x^{3/4}$, C) $h(x) = \frac{1}{\sqrt{x}}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 4\sqrt[5]{x^3}$, el exponente es $p = 3$ y el índice es $q = 5$. Forma potencia: $f(x) = 4 x^{3/5}$.'
    - 'Paso 2: Para $g(x) = -2 x^{3/4}$, el numerador es $p = 3$ y el denominador es $q = 4$. Forma radical: $g(x) = -2 \sqrt[4]{x^3}$.'
    - 'Paso 3: Para $h(x) = \frac{1}{\sqrt{x}}$, la raíz cuadrada es $x^{1/2}$ en el denominador. Forma potencia con exponente negativo: $h(x) = x^{-1/2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la representación como función potencia de exponente fraccionario de la función radical $f(x) = 7\sqrt[4]{x^9}$?'
    choices:
      - {text: '$f(x) = 7 x^{9/4}$', is_correct: true}
      - {text: '$f(x) = 7 x^{4/9}$', is_correct: false}
      - {text: '$f(x) = 28 x^9$', is_correct: false}
      - {text: '$f(x) = \frac{7x^9}{4}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = 7 x^{9/4}$''. El exponente de la base 9 es el numerador y el índice de la raíz 4 es el denominador del exponente fraccionario.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al expresar la función racional radical $g(x) = \frac{5}{\sqrt[3]{x}}$ como una función potencia de la forma $a x^n$, ¿cuál es el exponente $n$?'
    choices:
      - {text: '$n = -\frac{1}{3}$, pues la raíz cúbica en el denominador corresponde a $x^{-1/3}$', is_correct: true}
      - {text: '$n = \frac{1}{3}$', is_correct: false}
      - {text: '$n = -3$', is_correct: false}
      - {text: '$n = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$n = -\frac{1}{3}$, pues la raíz cúbica en el denominador corresponde a $x^{-1/3}$''. La raíz en el denominador agrega el signo negativo al exponente fraccionario.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente multiplicativo $a$, el exponente de la variable $p$ y el índice del radical $q$ en $a\sqrt[q]{x^p}$.'
  - 'Paso 2: Escribir la variable $x$ elevada a la fracción donde $p$ es el numerador y $q$ es el denominador.'
  - 'Paso 3: Si la raíz se encuentra en un denominador $\frac{a}{\sqrt[q]{x^p}}$, agregar un signo negativo a la fracción del exponente: $a x^{-p/q}$.'
  - 'Paso 4: Escribir la función potencia en forma canónica $f(x) = a x^{p/q}$.'
errores_correccion: |
  - **Error 1:** Invertir la posición colocando el índice $q$ en el numerador y la potencia $p$ en el denominador (ej: escribir $\sqrt[3]{x^2}$ como $x^{3/2}$). **Cómo corregirlo:** El índice de la raíz es siempre el denominador divisor del exponente: $\sqrt[q]{x^p} = x^{p/q}$, dando $x^{2/3}$.
  - **Error 2:** Multiplicar el coeficiente por el exponente al convertir raíces. **Cómo corregirlo:** El coeficiente $a$ multiplica al resultado por fuera y no altera la fracción del exponente: $a\sqrt[q]{x^p} = a x^{p/q}$.
ejemplos:
  - titulo: 'Conversión de raíz cuadrada básica'
    enunciado: '¿La función $f(x) = \sqrt{x}$ equivale a $x^{1/2}$?'
    alternativas:
      - 'Sí, $x^{1/2}$'
      - 'No, $x^2$'
      - 'No, $2x$'
    respuesta: 'Sí, $x^{1/2}$'
    solucion_pasos:
      - '1. Raíz cuadrada tiene índice $q = 2$ e interior $p = 1$.'
      - '2. Forma potencia: $x^{1/2}$.'
  - titulo: 'Conversión de raíz cúbica con exponente'
    enunciado: '¿La función $g(x) = \sqrt[3]{x^4}$ se expresa como $x^{4/3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El exponente 4 es el numerador y el índice 3 es el denominador $\implies x^{4/3}$.'
  - titulo: 'Conversión con coeficiente y raíz en denominador'
    enunciado: '¿La función $h(x) = \frac{3}{\sqrt[4]{x}}$ es igual a $3x^{-1/4}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La raíz en el denominador pasa como exponente negativo fraccionario: $3x^{-1/4}$.'
  - titulo: 'Evaluación numérica con exponente fraccionario'
    enunciado: 'Para $f(x) = x^{3/2}$, ¿evaluar $x = 4$ resulta en 8?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(4) = 4^{3/2} = (\sqrt{4})^3 = 2^3 = 8$.'
errores_frecuentes:
  - 'La función raíz $f(x) = \sqrt[3]{x^2}$ se convierte a potencia como $x^{3/2}$.'
  - 'Convertir $f(x) = 5\sqrt{x}$ a potencia multiplica el coeficiente dando $(5x)^{1/2}$.'
  - 'Una raíz en el denominador como $\frac{1}{\sqrt{x}}$ equivale a un exponente positivo $x^{1/2}$.'
  - 'El índice de la raíz pasa al numerador del exponente fraccionario.'
  - 'No se pueden aplicar las reglas de los exponentes a potencias de exponente fraccionario.'
afirmaciones_verdaderas:
  - 'Toda función radical $f(x) = a \sqrt[q]{x^p}$ es equivalente a una función potencia de exponente fraccionario $f(x) = a x^{p/q}$, donde el índice $q$ es el denominador del exponente.'
  - 'Convertir radicales a exponentes fraccionarios simplifica el cálculo algebraico permitiendo aplicar las leyes universales de las potencias.'
