semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.INTERCEPTO_X
resumen_inicial: 'El intercepto con el eje $x$ de la función logarítmica básica es el punto $(1, 0)$, obtenido al resolver la ecuación $f(x) = 0$.'
explicacion_simple: |
  Para averiguar en qué lugar exacto la curva de una función logarítmica cruza la línea horizontal del eje $x$, debemos buscar para qué valor de $x$ el resultado de la función da cero ($y = 0$). En la función básica $f(x) = \log_b(x)$, sabemos que cualquier base elevada a cero da 1 ($b^0 = 1$). Por eso, la curva cruza el eje $x$ obligatoriamente en el punto de coordenadas $(1, 0)$.
explicacion_formal: |
  ### Definición formal
  En la función logarítmica $f(x) = a \cdot \log_b(cx + d) + k$, el **intercepto con el eje de las abscisas** (eje $x$) es el par ordenado $(x_0, 0)$ donde la ordenada se anula:
  $$f(x_0) = 0 \iff a \cdot \log_b(cx_0 + d) + k = 0$$
  Para la función mónica básica $f(x) = \log_b(x)$:
  $$\log_b(x_0) = 0 \iff b^0 = x_0 \implies x_0 = 1 \implies P_x = (1, 0)$$

  ### Desglose simbólico
  - Unicidad del corte: Dado que $f(x)$ es strictly monótona en todo su dominio, existe **un único punto** de intersección con el eje $x$.
  - Independencia de la base $b$: El punto $(1, 0)$ es invariante respecto al valor de la base $b$. Las funciones $f(x) = \log_2(x)$, $g(x) = \log_{10}(x)$ y $h(x) = \ln(x)$ cruzan el eje $x$ exactamente en el mismo punto $(1, 0)$.
  - Intercepto para la forma trasladada general:
    $$a \log_b(cx + d) + k = 0 \implies \log_b(cx + d) = -\frac{k}{a} \implies cx + d = b^{-\frac{k}{a}} \implies x = \frac{b^{-k/a} - d}{c}$$

  ### Síntesis didáctica
  Diferenciar corte en $x$ de corte en $y$: La función logarítmica básica $f(x) = \log_b(x)$ posee **un único corte con el eje $x$** en $(1, 0)$, y **ningún corte con el eje $y$**.
definiciones_clave: |
  - **Intercepto con el eje $x$**: Punto cartesiano $(x_0, 0)$ donde la gráfica atraviesa el eje horizontal.
  - **Cero de la función logarítmica**: Raíz única $x_0$ de la ecuación $f(x) = 0$.
  - **Punto común $(1, 0)$**: Coordenada de intersección compartida por todas las funciones logarítmicas básicas no trasladadas.
propiedades_relaciones: |
  - **Familia de curvas concurrente**: Todas las gráficas de la familia $y = \log_b(x)$ concurren en el punto nodal $(1, 0)$.
  - **Relación con el intercepto exponencial**: El punto $(1, 0)$ de la función logarítmica es la simetría exacta del punto $(0, 1)$ de la función exponencial.
ejemplo_guiado:
  enunciado: 'Calcula el punto de intersección con el eje $x$ para las siguientes funciones logarítmicas: A) $f(x) = \log_4(x)$, B) $g(x) = \log_3(x - 5)$, C) $h(x) = 2 \cdot \log_2(x) - 6$.'
  pasos:
    - 'Paso 1: Para $f(x) = \log_4(x)$, igualamos a cero: $\log_4(x) = 0 \implies 4^0 = x \implies x = 1$. Punto: $(1, 0)$.'
    - 'Paso 2: Para $g(x) = \log_3(x - 5)$, igualamos a cero: $\log_3(x - 5) = 0 \implies 3^0 = x - 5 \implies 1 = x - 5 \implies x = 6$. Punto: $(6, 0)$.'
    - 'Paso 3: Para $h(x) = 2 \cdot \log_2(x) - 6$, igualamos a cero: $2 \log_2(x) = 6 \implies \log_2(x) = 3 \implies 2^3 = x \implies x = 8$. Punto: $(8, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué punto cartesiano cruza al eje $x$ la gráfica de la función logarítmica básica $f(x) = \ln(x)$?'
    choices:
      - {text: '$(1, 0)$', is_correct: true}
      - {text: '$(0, 1)$', is_correct: false}
      - {text: '$(e, 0)$', is_correct: false}
      - {text: '$(0, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(1, 0)$''. Evaluamos $f(1) = \ln(1) = 0$, lo que fija la intersección con el eje horizontal en el par $(1, 0)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor de $x$ donde la gráfica de la función $g(x) = \log_5(x + 4)$ interseca al eje de las abscisas?'
    choices:
      - {text: '$x = -3$, produciendo el punto $(-3, 0)$', is_correct: true}
      - {text: '$x = 1$, produciendo el punto $(1, 0)$', is_correct: false}
      - {text: '$x = 5$, produciendo el punto $(5, 0)$', is_correct: false}
      - {text: '$x = -4$, produciendo el punto $(-4, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = -3$, produciendo el punto $(-3, 0)$''. Igualamos la función a cero: $\log_5(x + 4) = 0 \implies 5^0 = x + 4 \implies 1 = x + 4 \implies x = -3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Formular la ecuación igualando la función logarítmica a cero: $f(x) = 0$.'
  - 'Paso 2: Aislar la expresión logarítmica $\log_b(g(x)) = k$.'
  - 'Paso 3: Convertir a forma exponencial $b^k = g(x)$.'
  - 'Paso 4: Despejar la variable $x$ y escribir el punto cartesiano $(x, 0)$.'
errores_correccion: |
  - **Error 1:** Afirmar que el intercepto con el eje $x$ ocurre en $(0, 1)$. **Cómo corregirlo:** El punto $(0, 1)$ pertenece a la función exponencial $y = b^x$. La función logarítmica intercambia las coordenadas, cortando al eje $x$ en $(1, 0)$.
  - **Error 2:** Creer que la traslación horizontal $+d$ dentro del argumento no altera la abscisa de corte. **Cómo corregirlo:** En $\log_b(x + d) = 0 \implies 1 = x + d \implies x = 1 - d$. El corte se desplaza $d$ unidades a la izquierda.
ejemplos:
  - titulo: 'Corte de logaritmo mónico'
    enunciado: '¿Dónde cruza al eje $x$ la función $f(x) = \log_9(x)$?'
    alternativas:
      - 'En el punto $(1, 0)$'
      - 'En el punto $(9, 0)$'
      - 'En el punto $(0, 1)$'
    respuesta: 'En el punto $(1, 0)$'
    solucion_pasos:
      - '1. Igualamos a cero: $\log_9(x) = 0 \implies x = 9^0 = 1$.'
      - '2. El punto es $(1, 0)$.'
  - titulo: 'Corte con desplazamiento'
    enunciado: '¿La función $g(x) = \ln(x - 2)$ corta al eje $x$ en el punto $(3, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Igualamos a cero: $\ln(x - 2) = 0 \implies x - 2 = e^0 = 1 \implies x = 3$.'
  - titulo: 'Invariancia por la base'
    enunciado: '¿Las funciones $f(x) = \log_2(x)$ y $g(x) = \log_{100}(x)$ se cruzan ambas en el eje $x$ en $(1, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En ambas $f(1) = g(1) = 0$, compartiendo el corte $(1, 0)$.'
  - titulo: 'Corte con coeficiente multiplicativo'
    enunciado: '¿Multiplicar por 5 en $f(x) = 5 \cdot \log_3(x)$ altera el intercepto con el eje $x$ en $(1, 0)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. $5 \cdot \log_3(x) = 0 \implies \log_3(x) = 0 \implies x = 1$, manteniendo $(1, 0)$.'
