  - 'El intercepto con el eje $x$ de la función $f(x) = \log_b(x)$ cambia de posición cuando cambia la base $b$.'
  - 'Para calcular la intersección con el eje $x$ de una función logarítmica la afirmación de evaluar $x = 0$.'
  - 'Una función logarítmica posee dos intersecciones distintas con el eje $x$.'
  - 'La función logarítmica $f(x) = \log(x - 1)$ corta al eje $x$ en el origen $(0, 0)$.'
afirmaciones_verdaderas:
  - 'Toda función logarítmica básica $f(x) = \log_b(x)$ interseca al eje de las abscisas (eje $x$) en el punto cartesiano $(1, 0)$.'
  - 'La intersección con el eje $x$ es el único cero real de la función logarítmica y se obtiene al resolver $f(x) = 0$.'
al_terminar_debes_poder: |
  QUÉ: Calcular las coordenadas del intercepto de la gráfica logarítmica con el eje X.
  CÓMO: Igualar la función a cero ($f(x) = 0$) y despejar la abscisa $x = 1$ en la forma básica o el valor equivalente transformado.
