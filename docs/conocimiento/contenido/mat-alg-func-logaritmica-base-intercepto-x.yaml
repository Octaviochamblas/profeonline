semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.INTERCEPTO_X
resumen_inicial: 'Cálculo del intercepto de la función logarítmica con el eje X: conceptos,
  asíntotas, propiedades e inversidad en Análisis de la función logarítmica.'
explicacion_simple: Sin importar qué base uses, elevar cualquier número a la potencia
  $0$ siempre da $1$. Esa propiedad fija un punto que todas las funciones logarítmicas
  comparten.
explicacion_formal: '### Definición formal


  Para toda función $f(x)=\log_b(x)$ con $b>0$ y $b\neq1$, se cumple $f(1)=\log_b(1)=0$,
  puesto que $b^0=1$ para cualquier base. Por lo tanto, el punto $(1,0)$ pertenece
  siempre a la gráfica y es su único intercepto con el eje $x$.


  ### Desarrollo didáctico


  Comprueba con distintas bases: $\log_2(1)=0$ porque $2^0=1$; $\log_{10}(1)=0$ porque
  $10^0=1$; $\log_{0{,}5}(1)=0$ porque $0{,}5^0=1$. El resultado es siempre $0$ cuando
  el argumento es $1$, así que la curva siempre atraviesa el eje $x$ en ese único
  punto.'
definiciones_clave: '- **Cálculo del intercepto de la función logarítmica con el eje
  X**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a cálculo del intercepto de la función logarítmica con el eje x.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de cálculo del
    intercepto de la función logarítmica con el eje x.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de cálculo del intercepto de
    la función logarítmica con el eje x.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    cálculo del intercepto de la función logarítmica con el eje x?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en cálculo del intercepto de la función logarítmica con el eje x?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconoce que $b^0=1$ se cumple para cualquier base $b>0$, $b\neq1$.'
- 'Paso 2: Evalúa $f(1)=\log_b(1)$ y concluye que su valor es $0$.'
- 'Paso 3: Ubica el punto $(1,0)$ como el intercepto de la gráfica con el eje $x$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en cálculo
  del intercepto de la función logarítmica con el eje x.
ejemplos:
- titulo: Cálculo del intercepto con base 3
  enunciado: Determina el intercepto en $x$ de $f(x)=\log_3(x)$.
  solucion_pasos:
  - Se evalúa $f(1)=\log_3(1)$.
  - Como $3^0=1$, entonces $\log_3(1)=0$, por lo que el intercepto es $(1,0)$.
- titulo: Verificación con otra base
  enunciado: Verifica que $(1,0)$ pertenece a la gráfica de $f(x)=\log_{0{,}25}(x)$.
  solucion_pasos:
  - Se reemplaza $x=1$ en la función: $f(1)=\log_{0{,}25}(1)$.
  - Como $0{,}25^0=1$, se cumple $f(1)=0$, así que $(1,0)$ pertenece a la gráfica.
- titulo: ¿Toda función logarítmica pasa por el punto $(1,0)$?
  enunciado: ¿El punto $(1,0)$ pertenece a la gráfica de $f(x)=\log_b(x)$ para cualquier
    base válida $b$?
  respuesta: Sí
  solucion_pasos:
  - $b^0=1$ se cumple para cualquier base $b>0$, $b\neq1$, así que $\log_b(1)=0$ siempre.
- titulo: ¿Puede una función logarítmica tener más de un intercepto en $x$?
  enunciado: ¿Puede $f(x)=\log_b(x)$ cortar el eje $x$ en más de un punto?
  respuesta: 'No'
  solucion_pasos:
  - La función logarítmica es estrictamente creciente o decreciente, así que $f(x)=0$
    tiene una sola solución.
errores_frecuentes:
- Afirmar que el intercepto en $x$ depende del valor de la base $b$.
- Declarar el intercepto en $x$ de la logarítmica con el intercepto en $y$ de la exponencial.
- Calcular mal $b^0$ y suponer que el resultado varía según la base.
- Ubicar el punto en $(0,1)$ en lugar de $(1,0)$.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando cálculo del intercepto de la función logarítmica con el eje x.
