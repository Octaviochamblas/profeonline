  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer los ángulos interiores del triángulo rectángulo notable.'
- 'Paso 2: Determinar si el patrón corresponde a $1 : 1 : \sqrt2$ o $1 : \sqrt3 : 2$.'
- 'Paso 3: Despejar el factor de escala $k$ a partir del lado dato.'
- 'Paso 4: Calcular los lados incógnitos multiplicando el factor $k$ por las razones canónicas.'
- 'Paso 5: Verificar la consistencia mediante el Teorema de Pitágoras $a^2 + b^2 = c^2$.'
errores_correccion: 'Ubica con cuidado el ángulo de 30°: el cateto menor $k$ siempre se opone a 30°, mientras que el cateto mediano $k\sqrt3$ se opone a 60°.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la medida del lado calculada a partir de las proporciones del triángulo notable?
  alternativas:
  - '$2\sqrt{3}\text{ cm}$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$2\sqrt{3}\text{ cm}$'
  solucion_pasos:
  - 'Mide $2\sqrt{3}\text{ cm}$, ya que $k = \frac{b}{\sqrt{3}} = \frac{6}{\sqrt{3}} = \frac{6\sqrt{3}}{3} = 2\sqrt{3}\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿En un triángulo 30°-60°-90°, el cateto opuesto a 30° es la mitad de la hipotenusa?
  alternativas:
  - Sí, siempre es exactamente la mitad de la hipotenusa
  - No, es igual a la hipotenusa multiplicada por raíz de 3
  - Solo si el triángulo es equilátero
  respuesta: Sí, siempre es exactamente la mitad de la hipotenusa
  solucion_pasos:
  - 'En la terna $k : k\sqrt3 : 2k$, el cateto opuesto a $30^\circ$ es $k$, que equivale exactamente a la mitad de la hipotenusa $2k$.'
- titulo: ¿En el triángulo 45°-45°-90° los dos catetos tienen siempre la misma longitud?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por ser un triángulo rectángulo isósceles, ambos catetos son congruentes ($a = b = k$).'
- titulo: ¿La hipotenusa en el triángulo 45°-45°-90° es igual al cateto multiplicado por √3?
  respuesta: 'No'
  solucion_pasos:
  - 'No, en el triángulo 45-45-90 la hipotenusa es $k\sqrt2$. El factor $\sqrt3$ corresponde al cateto opuesto a $60^\circ$ en el triángulo 30-60-90.'
errores_frecuentes:
- 'Invertir la posición de $k$ y $k\sqrt{3}$ en el triángulo 30-60-90.'
- 'Usar $\sqrt{3}$ en el triángulo 45-45-90 en vez de $\sqrt{2}$.'
- 'Olvidar que la hipotenusa en el triángulo 30-60-90 es $2k$ (el doble del cateto menor).'
- 'No racionalizar denominadores como $\frac{10}{\sqrt{2}} = 5\sqrt{2}$.'
- 'Confundir las razones trigonométricas con las longitudes escaladas.'
afirmaciones_verdaderas:
- 'En el triángulo 45°-45°-90°, la hipotenusa es igual al cateto multiplicado por $\sqrt{2}$ ($c = k\sqrt{2}$).'
- 'En el triángulo 30°-60°-90°, el cateto menor opuesto a 30° es la mitad de la hipotenusa ($a = c/2$).'
al_terminar_debes_poder: |
  **QUÉ:** Identificar y calcular lados en triángulos notables $45^\circ-45^\circ-90^\circ$ y $30^\circ-60^\circ-90^\circ$.

  **CÓMO:** Aplicando las ternas canónicas $1 : 1 : \sqrt{2}$ y $1 : \sqrt{3} : 2$ y multiplicando por el factor de escala $k$.

  ![Resumen de Triángulos Notables](/static/img/nodos/relacion-de-lados-en-el-triangulo-30-60-90-cateto-opuesto-30-12-hipotenusa-cateto-opuesto-60-hipotenusa32-resumen.svg)
