  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'Las medidas son Cateto mayor = $5\sqrt{3}\text{ cm}$ e Hipotenusa = $10\text{ cm}$, ya que siguen la proporción $k : k\sqrt{3} : 2k$ con $k = 5$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el cateto opuesto a 60° mide 6 cm, ¿cuánto mide el cateto opuesto a 30°?
  choices:
  - text: $2\sqrt{3}\text{ cm}$
