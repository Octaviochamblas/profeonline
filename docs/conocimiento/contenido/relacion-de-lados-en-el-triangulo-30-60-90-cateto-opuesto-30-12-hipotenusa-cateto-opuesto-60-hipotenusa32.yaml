semantic_id: MAT.GEO.TRIANGULOS_NOTABLES_METRICA.RELACION_LADOS_30_60_90
resumen_inicial: 'En el triángulo $30^\circ-60^\circ-90^\circ$, los lados siguen la proporción $k : k\sqrt{3} : 2k$, donde el cateto opuesto a $30^\circ$ es $k = \frac{c}{2}$ y el opuesto a $60^\circ$ es $k\sqrt{3} = \frac{c\sqrt{3}}{2}$.'
explicacion_simple: |
  ![Razón de Lados en 30°-60°-90°: 1 : √3 : 2](/static/img/nodos/relacion-de-lados-en-el-triangulo-30-60-90-cateto-opuesto-30-12-hipotenusa-cateto-opuesto-60-hipotenusa32-intro.svg)

  Si llamas $k$ al lado más chico (frente al $30^\circ$), la hipotenusa vale el doble ($2k$) y el lado mediano vale $k\sqrt{3}$.
explicacion_formal: |
  ### Teorema métrico formal
  En cualquier triángulo notable de ángulos $30^\circ-60^\circ-90^\circ$, las longitudes de sus lados están en la razón continua canónica:

  $$\text{Cateto}(30^\circ) : \text{Cateto}(60^\circ) : \text{Hipotenusa}(90^\circ) = 1 : \sqrt{3} : 2$$

  Ecuaciones métricas explícitas en función del parámetro $k \in \mathbb{R}^+$:

  $$\begin{cases} a = k = \frac{c}{2} = \frac{b\sqrt{3}}{3} \\ b = k\sqrt{3} = \frac{c\sqrt{3}}{2} = a\sqrt{3} \\ c = 2k = 2a = \frac{2b\sqrt{3}}{3} \end{cases}$$

  ### Desglose simbólico y geométrico
  - $a$: Cateto opuesto a $30^\circ$ (cateto menor).
  - $b$: Cateto opuesto a $60^\circ$ (cateto mayor).
  - $c$: Hipotenusa (lado mayor).
  - Consistencia pitagórica: $a^2 + b^2 = k^2 + (k\sqrt{3})^2 = k^2 + 3k^2 = 4k^2 = (2k)^2 = c^2$.

  ### Síntesis didáctica
  Esta proporción permite calcular cualquier lado del triángulo conociendo únicamente uno de ellos, prescindiendo del uso de tablas o calculadora.
definiciones_clave: |
  - **Triángulo notable**: Triángulo rectángulo con ángulos fijos cuyas proporciones entre lados son constantes conocidas.
  - **Triángulo 45°-45°-90°**: Rectángulo isósceles de lados proporcionales a $1 : 1 : \sqrt2$.
  - **Triángulo 30°-60°-90°**: Semi-equilátero de lados proporcionales a $1 : \sqrt3 : 2$.
  - **Factor de escala ($k$)**: Constante multiplicativa lineal que define las dimensiones reales de los lados.
propiedades_relaciones: |
  - **Proporción 45-45-90**: $a = k, \ b = k, \ c = k\sqrt2$.
  - **Proporción 30-60-90**: $a = k \ (30^\circ), \ b = k\sqrt3 \ (60^\circ), \ c = 2k \ (90^\circ)$.
  - **Invarianza angular**: Los ángulos permanecen constantes al cambiar el factor de escala $k$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Razón de Lados en 30°-60°-90°: 1 : √3 : 2](/static/img/nodos/relacion-de-lados-en-el-triangulo-30-60-90-cateto-opuesto-30-12-hipotenusa-cateto-opuesto-60-hipotenusa32-ejemplos.svg)

    Aplica la proporción del triángulo notable y el factor de escala $k$ para determinar las medidas lineales incógnitas.
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo notable a partir de sus ángulos ($45^\circ-45^\circ-90^\circ$ o $30^\circ-60^\circ-90^\circ$).'
  - 'Paso 2: Escribir la terna proporcional base ($1 : 1 : \sqrt2$ o $1 : \sqrt3 : 2$).'
  - 'Paso 3: Igualar la medida conocida a su término homólogo para hallar el factor de escala $k$.'
  - 'Paso 4: Multiplicar los demás términos de la terna por $k$ y racionalizar si es necesario.'
  - 'Paso 5: Registrar los valores finales acompañados de su unidad métrica.'
