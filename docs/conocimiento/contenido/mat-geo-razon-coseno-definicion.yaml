procedimiento:
- 'Paso 1: Identifica el ángulo agudo θ y ubica el vértice donde se encuentra.'
- 'Paso 2: Identifica el cateto adyacente a θ (el lado, distinto de la hipotenusa,
  que sí toca ese vértice) y la hipotenusa.'
- 'Paso 3: Calcula cosθ como el cociente entre la longitud del cateto adyacente y
  la longitud de la hipotenusa.'
