semantic_id: MAT.GEO.TRIG_FUNDAMENTAL.COSENO_DEFINICION
resumen_inicial: 'Definición de coseno de un ángulo agudo como cateto adyacente sobre
  hipotenusa: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: El coseno compara el lado que forma parte del ángulo (adyacente,
  no la hipotenusa) con el lado más largo del triángulo.
explicacion_formal: '![Definición de coseno](/static/img/geometria/trigonometria/trig-coseno-definicion.svg)


  ### Definición formal


  En un triángulo rectángulo con ángulo agudo $\theta$, el coseno se define como $\cos\theta=\dfrac{\text{cateto
  adyacente}}{\text{hipotenusa}}$, donde el cateto adyacente es el lado (distinto
  de la hipotenusa) que sí forma parte del ángulo $\theta$.


  ### Desarrollo didáctico


  En la figura, el ángulo $\theta$ está en el vértice $B$. El cateto adyacente a $\theta$
  es el lado $AB$ (horizontal, que toca el vértice B), y la hipotenusa es $BC$. Por
  lo tanto, $\cos\theta=\dfrac{AB}{BC}$.'
definiciones_clave: '- **Definición de coseno de un ángulo agudo como cateto adyacente
  sobre hipotenusa**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
