semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.SIMETRAL_DEFINICION
resumen_inicial: La simetral (o mediatriz) de un lado de un triángulo es la recta
  perpendicular trazada exactamente en su punto medio, cumpliendo la propiedad de
  que todos sus puntos equidistan de los extremos del lado.
explicacion_simple: '![Simetral de un Triángulo](/static/img/nodos/definicion-de-simetral-como-recta-perpendicular-a-un-lado-en-su-punto-medio-intro.svg)


  Para trazar la simetral de un lado:


  - **Buscas el punto medio**: Encuentras la mitad exacta del lado ($BM = MC$).

  - **Trazas una línea perpendicular a $90^\circ$**: Levantas una recta recta hacia
  arriba formando una cruz perfecta ($90^\circ$).

  - **No tiene que pasar por la esquina**: La simetral atraviesa el triángulo sin
  obligación de tocar el vértice opuesto (a menos que el triángulo sea isósceles o
  equilátero).

  '
explicacion_formal: '### Definición formal

  La **simetral** (o mediatriz) de un lado $\overline{BC}$ en un triángulo $\Delta
  ABC$ es la recta infinita perpendicular al lado que pasa exactamente por su punto
  medio $M_a$:


  $$S_a = \{P \in \mathbb{R}^2 \mid d(P, B) = d(P, C)\} \iff S_a \perp \overline{BC}
  \quad \land \quad M_a = \frac{B + C}{2} \in S_a$$


  ### Desglose simbólico y geométrico

  - $M_a = \frac{B+C}{2}$: Punto medio del lado $\overline{BC}$.

  - Lugar geométrico: Es el conjunto de todos los puntos del plano que equidistan
  de los vértices $B$ y $C$.

  - Recta no acotada: A diferencia de la altura o mediana, la simetral es una recta
  infinita que no necesariamente pasa por el vértice opuesto $A$.


  ### Síntesis didáctica

  La simetral es el eje de simetría axial del segmento y el lugar geométrico de todos
  los puntos a igual distancia de sus dos extremos.'
definiciones_clave: '- **Simetral (Mediatriz)**: Recta perpendicular a un segmento
  trazada en su punto medio.

  - **Punto medio ($M$)**: Punto que divide a un segmento en dos partes de igual longitud.

  - **Equidistancia a extremos**: Propiedad geométrica según la cual $PB = PC$ para
  todo punto $P$ en la simetral.

  '
propiedades_relaciones: '- **Perpendicularidad**: $S_a \perp \overline{BC}$ en $M_{BC}$.

  - **Lugar geométrico**: $\forall P \in S_a \iff d(P, B) = d(P, C)$.

  - **Condición de paso por vértice**: $A \in S_a \iff b = c$ (isósceles con respecto
  a $\overline{BC}$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Simetral](/static/img/nodos/definicion-de-simetral-como-recta-perpendicular-a-un-lado-en-su-punto-medio-ejemplos.svg)


    En un triángulo $ABC$, el lado $\overline{BC}$ mide $14\text{ cm}$. Se traza la
    simetral $S_a$ de dicho lado. ¿A qué distancia del vértice $B$ corta la simetral
    al lado $\overline{BC}$ y qué ángulo forma con él?

    '
  pasos:
  - 'Paso 1: Recordar la definición de simetral: corta al segmento en su punto medio
    con un ángulo de $90^\circ$.'
  - 'Paso 2: Calcular la posición del punto medio: $BM = \frac{BC}{2} = \frac{14}{2}
    = 7\text{ cm}$.'
  - 'Paso 3: Identificar el ángulo de intersección: por ser perpendicular, forma un
    ángulo recto de $90^\circ$.'
  - 'Paso 4: Concluir que la simetral corta a $7\text{ cm}$ de $B$ formando un ángulo
    de $90^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué dos condiciones definen exactamente a la simetral de un lado?
  choices:
  - text: Es perpendicular al lado y pasa por su punto medio
    is_correct: true
  - text: Pasa por el vértice opuesto y por el punto medio
    is_correct: false
  - text: Divide el ángulo en dos partes iguales
    is_correct: false
  - text: Pasa por el vértice opuesto con ángulo de 90°
    is_correct: false
  explanation: La simetral se define porque es perpendicular al lado y pasa por su
    punto medio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un punto P se encuentra sobre la simetral del segmento AB, ¿qué relación
    se cumple siempre?
  choices:
  - text: $PA = PB$
    is_correct: true
  - text: $PA + PB = AB$
    is_correct: false
  - text: $PA = 2 \cdot PB$
    is_correct: false
  - text: $PA \perp PB$
    is_correct: false
  explanation: Se cumple que $PA = PB$, ya que la simetral es el lugar geométrico
    de los puntos que equidistan de los extremos A y B.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el punto medio $M$ del lado sumando o dividiendo su longitud
  por 2.'
- 'Paso 2: Trazar una recta perpendicular ($90^\circ$) al lado que pase exactamente
  por $M$.'
- 'Paso 3: Extender la recta simetral a través del triángulo sin forzarla a pasar
  por el vértice opuesto.'
- 'Paso 4: Aplicar la propiedad de equidistancia a los extremos cuando sea requerido.'
errores_correccion: 'No confundas la simetral con la altura ni con la mediana: la
  simetral pasa por el punto medio y es perpendicular, sin obligación de pasar por
  el vértice opuesto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el segmento $AB = 18\text{ cm}$, ¿a qué distancia de $A$ intersecta
    su simetral?
  alternativas:
  - $9\text{ cm}$
  - $18\text{ cm}$
  - $4.5\text{ cm}$
  respuesta: $9\text{ cm}$
  solucion_pasos:
  - 'La simetral pasa por el punto medio: $18 / 2 = 9\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: En un triángulo escaleno, ¿la simetral de la base pasa por el vértice
    superior?
  alternativas:
  - No, pasa a un lado del vértice
  - Sí, siempre pasa por el vértice
  - Depende del área del triángulo
  respuesta: No, pasa a un lado del vértice
  solucion_pasos:
  - En triángulos escalenos los lados laterales son desiguales, por lo que el vértice
    no equidista de los extremos de la base y la simetral no pasa por él.
- titulo: ¿La simetral de un segmento es siempre perpendicular a dicho segmento?
  respuesta: Sí
  solucion_pasos:
  - Sí, forma estrictamente un ángulo recto ($90^\circ$).
- titulo: ¿La simetral de un lado en cualquier triángulo siempre pasa por el vértice
    opuesto?
  respuesta: 'No'
  solucion_pasos:
  - No, solo pasa por el vértice opuesto si los dos lados adyacentes son iguales (triángulo
    isósceles o equilátero).
errores_frecuentes:
- Forzar a la simetral a pasar por el vértice opuesto en triángulos escalenos.
- Confundir la simetral con la altura (la altura pasa por el vértice, la simetral
  pasa por el punto medio).
- Confundir la simetral con la transversal de gravedad (la transversal une vértice
  y punto medio, pero no es perpendicular).
- Creer que la simetral es un segmento acotado en vez de una recta infinita.
- Olvidar que todo triángulo tiene exactamente 3 simetrales.
afirmaciones_verdaderas:
- La simetral de un lado es la recta perpendicular que pasa por su punto medio.
- Todo punto perteneciente a la simetral de un lado equidista de los extremos de dicho
  lado.
al_terminar_debes_poder: '**QUÉ:** Definir, trazar y aplicar las propiedades de la
  simetral (mediatriz) de un lado de un triángulo.


  **CÓMO:** Ubicando el punto medio del lado ($BM = MC$), levantando la perpendicular
  a $90^\circ$ ($S_a \perp \overline{BC}$) y aplicando la equidistancia $PB = PC$.


  ![Resumen de Simetral](/static/img/nodos/definicion-de-simetral-como-recta-perpendicular-a-un-lado-en-su-punto-medio-resumen.svg)

  '
