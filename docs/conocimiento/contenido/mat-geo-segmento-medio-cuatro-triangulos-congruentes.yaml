semantic_id: MAT.GEO.SEGMENTO_MEDIO.CUATRO_TRIANGULOS_CONGRUENTES
resumen_inicial: 'División del triángulo en cuatro triángulos congruentes por sus
  segmentos medios: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: Al trazar los tres segmentos medios de un triángulo, la figura
  queda dividida en cuatro triángulos más pequeños que, sorprendentemente, son todos
  congruentes entre sí (no solo de igual área, sino de igual forma y tamaño).
explicacion_formal: '![División en cuatro triángulos congruentes](/static/img/geometria/elementos-secundarios/segmento-medio-cuatro-triangulos-congruentes.svg)


  ### Definición formal


  Si se trazan los tres segmentos medios de un triángulo ABC, se forman cuatro triángulos:
  el triángulo medial (central) y tres triángulos en las esquinas; los cuatro son
  congruentes entre sí y semejantes al triángulo original.


  ### Desarrollo didáctico


  Cada uno de los cuatro triángulos formados tiene lados que son la mitad de los lados
  del triángulo original, por lo que los cuatro comparten exactamente las mismas medidas
  y ángulos: son congruentes.'
definiciones_clave: '- **División del triángulo en cuatro triángulos congruentes por
  sus segmentos medios**: Elemento o propiedad fundamental en el estudio de elementos
  secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a división del triángulo en cuatro triángulos
  congruentes por sus segmentos medios.'
ejemplo_guiado:
  enunciado: Para analizar división del triángulo en cuatro triángulos congruentes
    por sus segmentos medios, considera un ángulo $\alpha = 80^\circ$ ubicado en la
    posición dada. Determina el valor de la medida asociada sabiendo que $x + 1267^\circ
    = 80^\circ$.
  pasos:
  - Identificar la propiedad de división del triángulo en cuatro triángulos congruentes
    por sus segmentos medios referida a $\alpha = 80^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1267 = 80 \implies x = 80 - 1267$.'
  - Concluir que la medida calculada para división del triángulo en cuatro triángulos
    congruentes por sus segmentos medios es $x = -1187^\circ$.
