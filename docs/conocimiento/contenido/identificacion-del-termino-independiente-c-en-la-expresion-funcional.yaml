semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_C
resumen_inicial: El término independiente $c$ es la constante libre de la función cuadrática $f(x) = ax^2 + bx + c$, y determina de forma inmediata el punto de corte exacto de la parábola con el eje vertical $Y$ en las coordenadas $(0, c)$.
explicacion_simple: "![El término independiente $c$ es la constante libre de la función cuadrática $f(x) = ax^2 + bx + c$, y determina de forma inmediata el punto de corte exacto de la parábola con el eje vertical $Y$ en las coordenadas $(0, c)$](/static/img/nodos/identificacion-del-termino-independiente-c-en-la-expresion-funcional-intro.svg)\n\n\nEl término **$c$** es el número suelto que no tiene ninguna letra $x$ al lado:\n\n- **¿Para qué sirve visualmente?**\n  - Te dice **exactamente en qué número la parábola atraviesa el eje vertical $Y$**.\n  - Si $x = 0$, los términos con $x$ se hacen cero: $f(0) = a(0)^2 + b(0) + c = c$.\n  - Por lo tanto, el punto de corte es siempre **$(0, c)$**.\n- *Ejemplo:* En $f(x) = 3x^2 - 4x - 7$, el corte con el eje $Y$ está en el punto **$(0, -7)$**.\n- Si la función no tiene número suelto ($c = 0$, como en $f(x) = x^2 + 5x$), la parábola **pasa obligatoriamente por el origen $(0, 0)$**."
explicacion_formal: "Sea $f(x) = ax^2 + bx + c$ con $a \\neq 0$. El término independiente $c \\in \\mathbb{R}$ es la imagen funcional del elemento neutro aditivo del dominio:\n$$f(0) = a(0)^2 + b(0) + c = c$$\n\n**Propiedades topológicas y geométricas del parámetro $c$**:\n1. **Intersección con el eje de ordenadas**: La gráfica interseca a la recta $x = 0$ (eje $Y$) en el punto único:\n   $$P_Y = (0, f(0)) = (0, c)$$\n2. **Unicidad del corte vertical**: Toda función cuadrática interseca al eje $Y$ exactamente **una sola vez**, sin importar el discriminante ni los coeficientes.\n3. **Criterio de pertenencia al origen**: $P(0, 0) \\in \\text{Gr}(f) \\Longleftrightarrow c = 0$.\n4. **Traslación vertical pura**: La modificación $c \\mapsto c + k$ desplaza la parábola rígidamente en $k$ unidades hacia arriba o abajo sin alterar su concavidad ni su eje de simetría."
definiciones_clave: '- **Término independiente $c$**: Coeficiente constante de grado cero en el polinomio cuadrático.

  - **Intersección con el eje Y**: Punto $(0, c)$ donde la curva interseca la recta vertical $x = 0$.'
propiedades_relaciones: '- **Corte con eje Y vs Cortes con eje X**: El corte con el eje $Y$ es siempre único e inmediato ($(0, c)$), mientras que los cortes con el eje $X$ pueden ser dos, uno o ninguno según el discriminante $\Delta$.

  - **Producto de raíces**: En la ecuación asociada, $c = a \cdot (x_1 x_2)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El término independiente $c$ es la constante libre de la función cuadrática $f(x) = ax^2 + bx + c$, y determina de forma inmediata el punto de corte exacto de la parábola con el eje vertical $Y$ en las coordenadas $(0, c)$](/static/img/nodos/identificacion-del-termino-independiente-c-en-la-expresion-funcional-ejemplos.svg)



    Determina el punto de intersección con el eje Y para las siguientes funciones cuadráticas:

    1) $f(x) = 4x^2 - 7x - 9$

    2) $g(x) = -x^2 + 5x$

    3) $h(x) = 2(x - 3)^2 + 1$'
  pasos:
  - 'Paso 1: Para $f(x) = 4x^2 - 7x - 9$: El término libre es $c = -9 \implies$ Punto de corte: $(0, -9)$.'
  - 'Paso 2: Para $g(x) = -x^2 + 5x$: No hay término libre ($c = 0$) $\implies$ Punto de corte: $(0, 0)$ (pasa por el origen).'
  - 'Paso 3: Para $h(x) = 2(x - 3)^2 + 1$: Evaluar $h(0)$ directamente:

    $h(0) = 2(0 - 3)^2 + 1 = 2(9) + 1 = 18 + 1 = 19$.

    - Punto de corte con eje $Y$: $(0, 19)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje Y la parábola $f(x) = -3x^2 + 2x - 5$?
  choices:
  - text: (0, -5)
    is_correct: true
  - text: (-5, 0)
    is_correct: false
  - text: (0, 2)
    is_correct: false
  - text: (0, -3)
    is_correct: false
  explanation: La alternativa correcta es '(0, -5)'. Al evaluar $x = 0$, $f(0) = -5$, formando el par ordenado $(0, -5)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola pasa por el origen (0, 0), ¿cuánto vale su término independiente c?
  choices:
  - text: c = 0
    is_correct: true
  - text: c = 1
    is_correct: false
  - text: c = a
    is_correct: false
  - text: c no existe
    is_correct: false
  explanation: La alternativa correcta es 'c = 0'. Para que $f(0) = 0$, necesariamente $c = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función cuadrática en su forma polinómica $f(x) = ax^2 + bx + c$ o evaluar $f(0)$.'
- 'Paso 2: Extraer el valor numérico del término independiente $c$ con su signo.'
- 'Paso 3: Formular el par ordenado $(0, c)$.'
- 'Paso 4: Identificar dicho punto en el eje vertical de ordenadas $Y$.'
errores_correccion: '- **Error común:** Escribir el punto de corte al revés: $(c, 0)$ en lugar de $(0, c)$.

  - **Cómo corregirlo:** La $x$ vale cero ($x = 0$), por lo que el punto es **$(0, c)$** sobre el eje vertical $Y$.'
ejemplos:
- titulo: 'Ejemplo 1: Corte positivo'
  enunciado: En $f(x) = x^2 - 4x + 12$, ¿dónde corta la parábola al eje vertical?
  alternativas:
  - (0, 12)
  - (12, 0)
  - (0, -4)
  - (0, 0)
  respuesta: (0, 12)
  solucion_pasos:
  - 'Paso 1: $c = 12 \implies (0, 12)$.'
- titulo: 'Ejemplo 2: Parábola en el origen'
  enunciado: ¿Qué punto de corte con el eje Y tiene $g(x) = 5x^2 - 10x$?
  alternativas:
  - (0, 0)
  - (0, -10)
  - (0, 5)
  - No corta al eje Y
  respuesta: (0, 0)
  solucion_pasos:
  - 'Paso 1: $c = 0 \implies (0, 0)$.'
- titulo: 'Ejemplo 3: Función en forma factorizada'
  enunciado: ¿En qué punto corta al eje Y la función $f(x) = (x - 2)(x + 4)$?
  alternativas:
  - (0, -8)
  - (0, 8)
  - (-8, 0)
  - (0, 2)
  respuesta: (0, -8)
  solucion_pasos:
  - 'Paso 1: $f(0) = (0 - 2)(0 + 4) = (-2)(4) = -8 \implies (0, -8)$.'
- titulo: 'Ejemplo 4: Monomio cuadrático'
  enunciado: ¿En qué punto interseca al eje Y la función $h(x) = -3x^2$?
  alternativas:
  - (0, 0)
  - (0, -3)
  - (-3, 0)
  - (0, 1)
  respuesta: (0, 0)
  solucion_pasos:
  - 'Paso 1: $h(0) = 0 \implies (0, 0)$.'
errores_frecuentes:
- Escribir (c, 0) en vez de (0, c).
- Confundir la intersección con el eje Y con las raíces o cortes con el eje X.
- Olvidar el signo negativo al extraer c.
afirmaciones_verdaderas:
- Toda función cuadrática corta al eje vertical Y en el punto único (0, c).
- El valor de c representa exactamente la imagen de x = 0 (f(0) = c).
al_terminar_debes_poder: '**QUÉ:** Identificar el término independiente c y determinar el punto de corte con el eje Y.


  **CÓMO:** Extrayendo la constante libre c o evaluando f(0) para formular el punto (0, c).


