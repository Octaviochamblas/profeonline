semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_C
resumen_inicial: 'El término independiente $c$ es la constante numérica sin variable de la función cuadrática, indicando exactamente la ordenada del punto de intersección con el eje $y$.'
explicacion_simple: |
  El término independiente es el número $c$ que aparece suelto, sin estar multiplicado por la variable $x$. Corresponde al valor que toma la función cuando la entrada es cero ($f(0) = c$). En la gráfica, la constante $c$ señala la altura exacta donde la parábola cruza el eje vertical $y$.
explicacion_formal: |
  ### Definición formal
  En la función cuadrática $f(x) = ax^2 + bx + c$, el **término independiente** o constante $c \in \mathbb{R}$ es el coeficiente asociado al término de grado cero $x^0 = 1$.

  ### Desglose simbólico
  - $c \in \mathbb{R}$: Constante real (positiva, negativa o nula).
  - $(0, c)$: Punto exacto de intersección de la gráfica de $f$ con el eje de las ordenadas (eje $y$).
  - Si $c = 0 \implies f(x) = ax^2 + bx$, la parábola pasa obligatoriamente por el origen del sistema de coordenadas $(0, 0)$.

  ### Síntesis didáctica
  Geométricamente, modificar el valor de $c$ manteniendo constantes $a$ y $b$ equivale a aplicar una traslación vertical pura a la parábola. Aumentar $c$ desplaza la curva hacia arriba; disminuir $c$ la desplaza hacia abajo.
definiciones_clave: |
  - **Término independiente $c$**: Constante de la forma general $f(x) = ax^2 + bx + c$ cuyo valor no depende de la variable $x$.
  - **Intersección con el eje $y$**: Punto del plano cartesiano $(0, c)$ donde la gráfica corta al eje vertical.
  - **Paso por el origen**: Condición geométrica que ocurre cuando $c = 0$, haciendo que $f(0) = 0$.
propiedades_relaciones: |
  - **Evaluación en el origen**: $f(0) = a(0)^2 + b(0) + c = c$.
  - **Producto de las raíces**: En la forma general, la relación de Vieta establece que el producto de las soluciones de $ax^2 + bx + c = 0$ es $x_1 \cdot x_2 = \frac{c}{a}$.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = 5x - 2x^2 + 8$, identifica la constante $c$, determina el punto de intersección con el eje $y$ y calcula el valor de $f(0)$.'
  pasos:
    - 'Paso 1: Reordenamos la función en forma general: $f(x) = -2x^2 + 5x + 8$.'
    - 'Paso 2: Identificamos el término constante sin variable $x$, obteniendo $c = 8$.'
    - 'Paso 3: Establecemos el punto de corte con el eje $y$, el cual es $(0, c) = (0, 8)$.'
    - 'Paso 4: Evaluamos en el origen: $f(0) = -2(0)^2 + 5(0) + 8 = 8$, verificando la coincidencia con $c$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la parábola de una función cuadrática interseca al eje $y$ en el punto $(0, -6)$, ¿cuál es el valor del término independiente $c$?'
    choices:
      - {text: '$c = -6$', is_correct: true}
      - {text: '$c = 6$', is_correct: false}
      - {text: '$c = 0$', is_correct: false}
      - {text: '$c = -3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = -6$''. El término independiente representa la ordenada del corte con el eje $y$, por lo que $c = f(0) = -6$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función cuadrática $g(x) = 3(x - 2)^2 + 1$, ¿cuál es su término independiente $c$ tras llevarla a la forma general?'
    choices:
      - {text: '$c = 13$', is_correct: true}
      - {text: '$c = 1$', is_correct: false}
      - {text: '$c = 7$', is_correct: false}
      - {text: '$c = -11$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = 13$''. Desarrollamos $g(x) = 3(x^2 - 4x + 4) + 1 = 3x^2 - 12x + 12 + 1 = 3x^2 - 12x + 13$, por lo que $c = 13$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar completamente la expresión cuadrática si contiene productos o cuadrados.'
  - 'Paso 2: Identificar la constante numérica que no está acompañada por la variable $x$.'
  - 'Paso 3: Extraer la constante $c$ incluyendo su signo. Si no aparece término numérico libre, $c = 0$.'
errores_correccion: |
  - **Error 1:** Creer que en la forma canónica $f(x) = a(x - h)^2 + k$, el término independiente es $k$. **Cómo corregirlo:** En la forma canónica, $k$ es la ordenada del vértice. El término independiente $c$ se obtiene al desarrollar $c = ah^2 + k$.
  - **Error 2:** Confundir la intersección con el eje $y$ $(0, c)$ con las intersecciones con el eje $x$. **Cómo corregirlo:** La intersección con el eje $y$ es siempre única y vale $(0, c)$. Las intersecciones con el eje $x$ son las raíces obtenidas al resolver $f(x) = 0$.
ejemplos:
  - titulo: 'Identificación directa de c'
    enunciado: '¿Cuál es el valor del término independiente $c$ en la función $f(x) = 4x^2 - 9x - 11$?'
    alternativas:
      - '$c = -11$'
      - '$c = 11$'
      - '$c = -9$'
    respuesta: '$c = -11$'
    solucion_pasos:
      - '1. Identificamos el término sin variable $x$: $-11$.'
      - '2. Por lo tanto, $c = -11$.'
  - titulo: 'Parábola que pasa por el origen'
    enunciado: '¿Cuál es el punto de corte con el eje $y$ de la función cuadrática $g(x) = -2x^2 + 6x$?'
    alternativas:
      - '$(0, 0)$'
      - '$(0, 6)$'
      - '$(0, -2)$'
    respuesta: '$(0, 0)$'
    solucion_pasos:
      - '1. Al no haber constante visible, el término independiente es $c = 0$.'
      - '2. El punto de intersección con el eje $y$ es $(0, c) = (0, 0)$, el origen de coordenadas.'
  - titulo: 'Efecto de c sobre la traslación vertical'
    enunciado: 'Si comparamos $f(x) = x^2$ y $g(x) = x^2 + 5$, ¿la gráfica de $g(x)$ se obtiene desplazando verticalmente la gráfica de $f(x)$ en 5 unidades hacia arriba?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La adición de la constante $c = 5$ traslada cada punto de la parábola 5 unidades verticalmente hacia arriba.'
  - titulo: 'Unicidad del corte con el eje y'
    enunciado: '¿Toda función cuadrática corta al eje de las ordenadas (eje $y$) en exactamente un punto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que el dominio de la función cuadrática son todos los números reales, al evaluar $x = 0$ se obtiene un único valor $f(0) = c$.'
errores_frecuentes:
  - 'El término independiente $c$ de la función $f(x) = 3(x - 1)^2 + 4$ es igual a $4$.'
  - 'Si una función cuadrática no tiene término independiente visible, la parábola no corta al eje $y$.'
  - 'El punto de corte con el eje $y$ se escribe con las coordenadas $(c, 0)$.'
  - 'El parámetro $c$ altera el ancho y la apertura de las ramas de la parábola.'
  - 'El término independiente $c$ debe ser obligatoriamente un número entero positivo.'
afirmaciones_verdaderas:
  - 'El punto de corte de la gráfica de $f(x) = ax^2 + bx + c$ con el eje $y$ tiene coordenadas $(0, c)$.'
  - 'Si el término independiente $c$ es igual a cero, la gráfica de la función cuadrática pasa por el origen $(0, 0)$.'
al_terminar_debes_poder: 'Determinar el término independiente $c$ en cualquier función cuadrática e interpretar su significado como la intersección con el eje vertical en el plano cartesiano.'
