procedimiento:
- 'Paso 1: Ordena la función en forma general si aún no lo está.'
- 'Paso 2: Localiza el término numérico que no está multiplicado por ninguna potencia
  de $x$.'
- 'Paso 3: Ese número, con su signo, es el término independiente $c$; si no aparece,
  $c=0$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en identificación del término independiente c en
  la expresión funcional.
ejemplos:
- titulo: Identificación directa del término independiente
  enunciado: Identifica el término independiente $c$ en $f(x)=3x^2-8x+5$.
  solucion_pasos:
  - El único término sin $x$ es $5$.
  - $c=5$.
- titulo: Identificación de término independiente nulo
  enunciado: Identifica el término independiente $c$ en $f(x)=6x^2+x$.
  solucion_pasos:
  - No hay ningún término numérico suelto.
  - $c=0$.
- titulo: ¿El término independiente $c$ coincide siempre con $f(0)$?
  enunciado: ¿El término independiente $c$ coincide siempre con $f(0)$?
  respuesta: Sí
  solucion_pasos:
  - Al evaluar $f(0)$, los términos con $x$ se anulan, dejando exactamente el valor
    de $c$.
- titulo: ¿El término independiente debe ser distinto de cero para que la función
    sea cuadrática?
  enunciado: ¿El término independiente debe ser distinto de cero para que la función
    sea cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - Solo se exige que $a$ sea distinto de cero; $c$ puede valer cero sin afectar el
    carácter cuadrático.
errores_frecuentes:
- Olvidar identificar $c=0$ cuando el término independiente no aparece explícitamente
  en la función.
- Confundir el término independiente con el coeficiente $b$ cuando la función no está
  ordenada.
- No relacionar el término independiente con el valor de $f(0)$, perdiendo un atajo
  útil de verificación.
- Omitir el signo negativo del término independiente al leer su valor.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  identificación del término independiente c en la expresión funcional.
