semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_C
resumen_inicial: La identificación del término independiente $c$ extrae la constante numérico-escalar sin variable que representa la ordenada al origen $(0, c)$.
explicacion_simple: |
  El **término independiente $c$** es el número "suelto" o solo de la función (el que no tiene a la letra $x$ multiplicándolo):

  - **En $f(x) = 2x^2 + 5x - 9$**: El número solo es $-9 \implies c = -9$.
  - **En $f(x) = x^2 + 4$**: El número solo es $4 \implies c = 4$.
  - **En $f(x) = 3x^2 - 6x$**: ¡No hay número suelto! Significa que la constante vale cero $\implies c = 0$.
  - **Uso geométrico clave**: El valor de $c$ te da **GRATIS EL PUNTO DONDE LA PARÁBOLA CORTA AL EJE Y** en las coordenadas $(0, c)$.
explicacion_formal: |
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, el **término independiente $c$** es la constante evaluada en el origen $x = 0$:

  $$c = f(0)$$

  **Interpretación geométrica del parámetro $c$:**
  - **Corte con el Eje de las Ordenadas (Eje Y):** La gráfica de la parábola interseca al eje $Y$ en el punto único de coordenadas $(0, c)$.
  - **Paso por el origen:** La parábola pasa por el origen del sistema de coordenadas $(0, 0)$ si y solo si el término independiente es idénticamente nulo ($c = 0$).
definiciones_clave: |
  - **Término independiente ($c$)**: Constante real no asociada a la variable $x$ en el polinomio de segundo grado, equivalente a la ordenada al origen.
propiedades_relaciones: |
  - **Producto de raíces en Vieta**: En una función cuadrática mónica $x^2 + bx + c$, el término independiente $c$ coincide exactamente con el producto de los ceros de la función ($c = x_1 \cdot x_2$).
ejemplo_guiado:
  enunciado: 'Identifica el término independiente $c$ de la función cuadrática $f(x) = 4x - x^2 + 10$ e indica el punto de corte con el eje Y.'
  pasos:
    - 'Paso 1: Localizar el número constante que no tiene la variable $x$: $+10$.'
    - 'Paso 2: Declarar que el término independiente es $c = 10$.'
    - 'Paso 3: Construir las coordenadas de corte con el eje $Y$: $(0, c) = (0, 10)$.'
    - 'Paso 4: Concluir que la curva cruza el eje vertical en el punto $(0, 10)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Dónde interseca al eje Y la gráfica de la función cuadrática $f(x) = 2x^2 - 7x - 5$?'
    choices:
      - {text: 'En el punto de coordenadas $(0, -5)$', is_correct: true}
      - {text: 'En el punto de coordenadas $(0, 2)$.', is_correct: false}
      - {text: 'En el punto de coordenadas $(-7, 0)$.', is_correct: false}
      - {text: 'En el origen $(0,0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''En el punto de coordenadas $(0, -5)$''. Evaluando $f(0) = -5$, el corte es $(0, -5)$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué término independiente $c$ posee una función cuadrática $g(x) = 5x^2 - 3x$ que pasa por el origen?'
    choices:
      - {text: '$c = 0$', is_correct: true}
      - {text: '$c = 5$', is_correct: false}
      - {text: '$c = -3$', is_correct: false}
      - {text: '$c = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = 0$''. Al carecer de término independiente en la expresión, $c = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Examinar los monomios de la función buscando el término escalar sin variable $x$.'
  - 'Paso 2: Si todos los términos contienen a la variable $x$, establecer $c = 0$.'
  - 'Paso 3: Si el término independiente existe, extraer su valor con el signo positivo o negativo correspondiente.'
  - 'Paso 4: Escribir las coordenadas de intersección con el eje Y en la forma $(0, c)$.'
errores_correccion: |
  - **Error común:** Confundir el término independiente $c$ con el coeficiente $a$ cuando la función está desordenada (ej. de $f(x) = 8 - x^2$ decir $a = 8$).
  - **Cómo corregirlo:** El término independiente $c$ **NO TIENE $x$**, mientras que el coeficiente $a$ **ACOMPAÑA A $x^2$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Término independiente en función desordenada.
    alternativas:
      - '$c = -14$'
      - '$c = 3$'
      - '$c = -2$'
    respuesta: '$c = -14$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Paso por el origen.
    alternativas:
      - '$c = 0$ (Corte en $(0,0)$)'
      - '$c = 4$'
      - '$c = -7$'
    respuesta: '$c = 0$ (Corte en $(0,0)$)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La equiparación de la constante $c$ con el coeficiente de $x^2$ en funciones escritas en orden inverso.'
  - 'La creencia de que si la constante $c = 0$, la función no tiene intersección con el eje vertical Y.'
  - 'Asignar $c = 1$ en lugar de $c = 0$ cuando el término independiente no figura en la función.'
  - 'La falta de inclusión del signo negativo al extraer la constante $c$ de la expresión $f(x) = x^2 - 4$.'
  - 'Escribir las coordenadas de intersección con el eje Y invirtiendo las componentes como $(c, 0)$.'
afirmaciones_verdaderas:
  - 'El término independiente $c$ es el valor $f(0)$ que define la intersección exacta de la parábola con el eje Y en $(0, c)$.'
  - 'Si $c = 0$, la gráfica de la función cuadrática pasa necesariamente por el origen de coordenadas $(0, 0)$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer el término independiente $c$ y determinar el punto de corte con el eje Y.
  CÓMO: Isolar la constante sin variable $x$, evaluar $f(0) = c$, reconocer $c = 0$ si falta el término y formular $(0, c)$.
