semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_C
resumen_inicial: 'Identificación del término independiente c en la expresión funcional:
  parábola, vértice, concavidad y formas de Definición y elementos básicos.'
explicacion_simple: El término independiente es el único que no lleva la incógnita
  $x$ acompañándolo; es simplemente un número suelto en la regla de la función.
explicacion_formal: '### Definición formal


  En $f(x)=ax^2+bx+c$, el término independiente $c$ es el número real que no acompaña
  a ninguna potencia de $x$. Evaluando la función en $x=0$: $f(0)=a(0)^2+b(0)+c=c$,
  por lo que $c$ coincide exactamente con $f(0)$.


  ### Desarrollo didáctico


  Para identificar $c$, se localiza el término numérico que aparece solo, sin ninguna
  $x$ junto a él. Alternativamente, se puede calcular $f(0)$ directamente.


  En $f(x)=2x^2-6x+9$, el término independiente es $9$, y en efecto $f(0)=2(0)^2-6(0)+9=9$.'
definiciones_clave: '- **Identificación del término independiente c en la expresión
  funcional**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  identificación del término independiente c en la expresión funcional.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando identificación
    del término independiente c en la expresión funcional.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a identificación
    del término independiente c en la expresión funcional.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
