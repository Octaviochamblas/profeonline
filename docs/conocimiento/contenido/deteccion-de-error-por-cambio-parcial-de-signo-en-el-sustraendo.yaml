procedimiento:
- 'Paso 1: Escribe el sustraendo completo.'
- 'Paso 2: Identifica cuántos términos tiene. Cuenta: 1, 2, 3.'
- 'Paso 3: Invierte el signo de CADA UNO de ellos, uno por uno.'
- 'Paso 4: Verifica la cantidad: el opuesto debe tener exactamente el mismo número
  de términos.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en detección de error por cambio parcial de signo en el sustraendo.
ejemplos:
- titulo: El cambio incompleto
  enunciado: 'Detecta el error: (10x - 4y) - (3x - 2y) = 10x - 4y - 3x - 2y = 7x -
    6y.'
  solucion_pasos:
  - El sustraendo es (3x - 2y).
  - Su opuesto es (-3x + 2y).
  - El cálculo erróneo convirtió -2y en -2y en lugar de +2y.
  - 'Resultado correcto: 10x - 4y - 3x + 2y = 7x - 2y.'
- titulo: Dos modelos de producción son $P_1 = 8k + 4l - 2$ y $P_2 = 3k - l + 7$.
    ¿Cuánto excede $P_1$
  enunciado: 'Dos modelos de producción son $P_1 = 8k + 4l - 2$ y $P_2 = 3k - l +
    7$. ¿Cuánto excede $P_1$ a $P_2$? (v1)


    Opciones: A) $5k + 5l - 9$ · B) $5k - 5l - 9$ · C) $5k + 5l + 5$ · D) $5k + 3l
    - 9$'
  solucion_pasos:
  - 'Exceso = $P_1 - P_2 = (8k+4l-2)-(3k-l+7)$. Opuesto: $(-3k+l-7)$. Suma: $8k+4l-2-3k+l-7=5k+5l-9$.'
  - 'Respuesta: $5k + 5l - 9$'
- titulo: 'Respecto de «Detección de error por cambio parcial de signo en el sustraendo»:
    ¿Describe ade'
  enunciado: 'Respecto de «Detección de error por cambio parcial de signo en el sustraendo»:
    ¿Describe adecuadamente el concepto esta frase? «El **Cambio Parcial de Signo**
    es el error de invertir el signo de solo una parte de los términos del sustraendo
    al restar un polinomio»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Cambio Parcial de Signo**
    es el error de invertir el signo de solo una parte de los términos del sustraendo
    al restar un polinomio.'
- titulo: 'Respecto de «Detección de error por cambio parcial de signo en el sustraendo»:
    ¿Se puede ace'
  enunciado: 'Respecto de «Detección de error por cambio parcial de signo en el sustraendo»:
    ¿Se puede aceptar esta afirmación? «Invertir los signos de los términos con coeficiente
    grande y ''olvidar'' el último término»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Cambio Parcial de Signo**
    es el error de invertir el signo de solo una parte de los términos del sustraendo
    al restar un polinomio.'
errores_frecuentes:
- Invertir los signos de los términos con coeficiente grande y 'olvidar' el último
  término.
- Confundir el sustraendo con el minuendo al decidir cuál se invierte.
- $5m + n + 4$.
- $11m + 3n + 4$.
- $4p - 4q - 6$.
afirmaciones_verdaderas:
- La reducción en detección de error por cambio parcial de signo en el sustraendo
  conserva los exponentes de la parte literal.
al_terminar_debes_ponder: Operar y reducir expresiones algebraicas utilizando detección
  de error por cambio parcial de signo en el sustraendo.
