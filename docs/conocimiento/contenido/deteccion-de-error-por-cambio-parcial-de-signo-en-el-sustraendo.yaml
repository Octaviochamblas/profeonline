  - text: El error es restar 2x
    is_correct: false
  - text: El error es cambiar 2x
    is_correct: false
  - text: No hay error
    is_correct: false
  explanation: La alternativa correcta es 'El error es dejar el término -7 sin invertir
    su signo a +7'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el error -(2x - 7) = -2x - 7', ¿qué expresión
