semantic_id: MAT.ALG.SUSTRACCION_POL.CAMBIO_PARCIAL_SIGNO
resumen_inicial: 'La detección de error por cambio parcial de signo en el sustraendo consiste en auditar el paso de supresión parentética identificando términos secundarios o constantes que mantuvieron su signo original.'
explicacion_simple: |
  Aún cuando un estudiante escriba los paréntesis correctamente $-(3x^2 - 5x + 4)$, se comete un error muy típico llamado **cambio parcial de signo**:
  - **El error**: Cambiar el signo del primer término (a $-3x^2$) y de la variable (a $+5x$), pero **olvidar cambiar el signo del último número constante (dejar $+4$ en lugar de $-4$)**.
  - **Ejemplo del error**:
    - Expresión: $-(3x^2 - 5x + 4)$.
    - Paso ERÓNEO: $-3x^2 + 5x + 4$ (¡El $+4$ NO cambió de signo!).
    - Paso CORRECTO: **$-3x^2 + 5x - 4$** (LOS TRES términos cambiaron de signo).
  - **Técnica de verificación**: Cuenta cuántos términos había dentro del paréntesis. **LOS MISMOS N TÉRMINOS deben haber cambiado de signo**.
explicacion_formal: |
  ### Definición formal
  Sea la supresión $- (T_1 + T_2 + \dots + T_m)$ con $m \ge 2$. Se define la **falla de cambio parcial de signo** cuando la transformación $\mathcal{A}$ invierte un subconjunto propio de términos $\mathcal{T}_{\text{inv}} \subset \{T_1, \dots, T_m\}$ dejando inalterada la signatura de al menos un monomio $T_k \notin \mathcal{T}_{\text{inv}}$:

  $$\exists k \in \{1, \dots, m\} \quad \mid \quad \operatorname{sgn}(\text{término}_k \text{ liberado}) = \operatorname{sgn}(T_k) \implies \text{Paso algebraico inválido}$$

  ### Discrepancia Localizada por Término
  El error puntual sobre la constante o monomio $T_k = c_k x^k$ genera un residuo de distorsión igual al doble del término no invertido:

  $$\Delta = T_k - (-T_k) = 2 c_k x^k \neq 0$$

  ### Síntesis didáctica
  Auditar minuciosamente cada término liberado del sustraendo asegura que la distribución del $-1$ no sea interrumpida prematuramente.
definiciones_clave: |
  - **Cambio parcial de signo**: Supresión defectuosa donde uno o más términos del sustraendo no invierten su signatura.
  - **Inversión incompleta**: Omisión del cambio de signo sobre la constante o término final de un trinomio o polinomio.
  - **Residuo de distorsión ($2 c_k x^k$)**: Error cuantitativo generado al conservar el signo del término $T_k$.
propiedades_relaciones: |
  - **Sensibilidad de los términos finales**: Las constantes al extremo derecho de la expresión son estadísticamente las más afectadas por este error de distracción.
  - **Invalidez de equivalencia**: $-(A + B - C) \neq -A - B - C$.
ejemplo_guiado:
  enunciado: 'Audita la supresión del sustraendo en la siguiente simplificación y corrige la falla:
  Expresión: $(9x^2 + 4x) - (3x^2 - 6x + 8)$
  Paso escrito: $9x^2 + 4x - 3x^2 + 6x + 8$.'
  pasos:
    - 'Paso 1: Identificamos el polinomio sustraendo: $(3x^2 - 6x + 8)$.'
    - 'Paso 2: Revisamos el cambio de signo de cada término en el paso escrito:
       - $+3x^2 \to -3x^2$ (correcto)
       - $-6x \to +6x$ (correcto)
       - $+8 \to +8$ (¡ERROR! Mantuvo el signo positivo).'
    - 'Paso 3: Diagnosticamos la falla: Se cometió un **cambio parcial de signo** al no cambiar $+8$ por $-8$.'
    - 'Paso 4: Escribimos la supresión correcta completa: $9x^2 + 4x - 3x^2 + 6x - 8$.'
    - 'Paso 5: Reducimos términos semejantes:
       - Clase $x^2$: $9x^2 - 3x^2 = \mathbf{6x^2}$.
       - Clase $x$: $+4x + 6x = \mathbf{+10x}$.
       - Constantes: $\mathbf{-8}$.'
    - 'Conclusión: El resultado correcto es **$6x^2 + 10x - 8$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué consiste el error denominado cambio parcial de signo al suprimir un paréntesis precedido por signo menos?'
    choices:
      - {text: 'En cambiar el signo de algunos términos del sustraendo pero dejar inalterado el signo de otros términos (como la constante final)', is_correct: true}
      - {text: 'En cambiar el signo de todos los términos del minuendo', is_correct: false}
      - {text: 'En multiplicar todos los signos por dos', is_correct: false}
      - {text: 'En eliminar las variables conservando sólo las constantes', is_correct: false}
    explanation: 'La alternativa correcta es ''En cambiar el signo de algunos términos del sustraendo pero dejar inalterado el signo de otros términos (como la constante final)''. Inversión incompleta de signos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al suprimir $-(x^2 - 4x - 5)$, un estudiante escribe $-x^2 + 4x - 5$. ¿Qué término no cambió de signo?'
    choices:
      - {text: 'La constante $-5$, que debió cambiar a $+5$ para dar $-x^2 + 4x + 5$', is_correct: true}
      - {text: 'El término $-4x$', is_correct: false}
      - {text: 'El término $x^2$', is_correct: false}
      - {text: 'Todos los términos cambiaron de signo correctamente', is_correct: false}
    explanation: 'La alternativa correcta es ''La constante $-5$, que debió cambiar a $+5$ para dar $-x^2 + 4x + 5$''. La constante $-5$ se mantuvo como $-5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Contar la cantidad total de términos encerrados en el polinomio sustraendo.'
  - 'Paso 2: Revisar uno a uno los términos liberados confirmando la inversión de signatura de cada término.'
  - 'Paso 3: Detectar si alguna constante o término conservó su signo original.'
  - 'Paso 4: Corregir la firma del término omitido y realizar la reducción de términos semejantes.'
errores_correccion: |
  - **Error 1:** Afirmar que $+8$ no cambia de signo en $-(3x + 8)$ por ser positivo. **Cómo corregirlo:** La supresión negativa **INVIERTE TODOS LOS SIGNOS ($+8$ pasa a $-8$)**.
  - **Error 2:** Detener la revisión de signos tras verificar los primeros dos términos de un trinomio. **Cómo corregirlo:** Se debe **REVISAR CADA TÉRMINO HASTA EL ÚLTIMO ELEMENTO DEL PARÉNTESIS**.
ejemplos:
  - titulo: 'Detección en trinomio'
    enunciado: '¿Contiene un error la supresión $-(2x^2 + 3x - 7) = -2x^2 - 3x - 7$?'
    alternativas:
      - 'Sí, el $-7$ debió cambiar a $+7$'
      - 'No, es correcto'
      - 'El error está en $-2x^2$'
    respuesta: 'Sí, el $-7$ debió cambiar a $+7$'
    solucion_pasos:
      - '1. $-1 \cdot (-7) = +7$.'
      - '2. El $-7$ conservó signo negativo $\implies$ Error.'
  - titulo: 'Verificación de todos los términos'
    enunciado: 'Si un polinomio sustraendo tiene 4 términos, ¿deben los 4 términos cambiar de signo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la distribución del $-1$ afecta a los 4 términos.'
  - titulo: 'Inversión completa comprobada'
    enunciado: 'Para $-(a - b + c - d)$, ¿es la supresión correcta $-a + b - c + d$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, los 4 signos fueron invertidos.'
  - titulo: 'Distorsión de constantes'
    enunciado: '¿Genera el cambio parcial de signo en una constante un error en el término independiente del polinomio resultado?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, altera el valor numérico de la constante resultante.'
errores_frecuentes:
  - 'Cambiar el signo de los términos con variable omitiendo el cambio de signo de la constante final.'
  - 'Detener la distribución del signo negativo antes de llegar al último término del paréntesis.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Declarar correcto un paso donde algunos términos del sustraendo mantuvieron su signatura original.'
  - 'Alterar los exponentes de las variables al corregir los signos de la constante.'
afirmaciones_verdaderas:
  - 'El cambio parcial de signo ocurre cuando no se invierte la signatura de la totalidad de los términos del sustraendo.'
  - 'Al suprimir un paréntesis precedido por signo negativo se debe verificar individualmente que cada término haya cambiado de signo.'
al_terminar_debes_poder: 'Auditar expresiones algebraicas identificando cambios parciales de signo en el sustraendo y corrigiendo la supresión.'
