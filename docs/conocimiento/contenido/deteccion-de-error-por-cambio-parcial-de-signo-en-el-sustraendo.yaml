resumen_inicial: La detección de error por cambio parcial de signo en el sustraendo
  aplica las reglas formales de la sustracción e inversión de signos en expresiones
  polinómicas.
explicacion_simple: Al trabajar con detección de error por cambio parcial de signo
  en el sustraendo, aseguramos cambiar correctamente los signos de todos los términos
  restados para obtener el resultado simplificado exacto.
explicacion_formal: 'Dados polinomios con la estructura dada, la **Detección de error
  por cambio parcial de signo en el sustraendo** establece:


  $$\text{"el error -(2x - 7) = -2x - 7"} \implies El error es dejar el término -7
  sin invertir su signo a +7$$


  > **Complemento didáctico:** La formalización rigurosa previene equivocaciones estructurales
  al operar con inversos aditivos.'
definiciones_clave: '- **Detección de error por cambio parcial de signo en el sustraendo**:
  Aplicación exacta de las reglas de resta y supresión de signos sobre polinomios.'
propiedades_relaciones: '- **Distributividad del signo menos**: El operador $-$ afecta
  individualmente a cada sumando del bloque.'
ejemplo_guiado:
  enunciado: 'Efectúe la detección de error por cambio parcial de signo en el sustraendo
    para: ''el error -(2x - 7) = -2x - 7''.'
  pasos:
  - 'Paso 1: Identificar el sustraendo o los términos a restar.'
  - 'Paso 2: Invertir el signo de todos los elementos involucrados.'
  - 'Paso 3: Reducir los términos semejantes.'
  - 'Conclusión: El resultado es El error es dejar el término -7 sin invertir su signo
    a +7.'
checkpoints:
