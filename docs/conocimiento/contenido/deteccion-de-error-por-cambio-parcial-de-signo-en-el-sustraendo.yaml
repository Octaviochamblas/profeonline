  choices:
  - text: El error es dejar el término -7 sin invertir su signo a +7
    is_correct: true
  - text: El error es restar 2x
    is_correct: false
  - text: El error es cambiar 2x
    is_correct: false
  - text: No hay error
    is_correct: false
  explanation: La alternativa correcta es 'El error es dejar el término -7 sin invertir
