  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar paréntesis al sustraendo.'
- 'Paso 2: Distribuir el signo menos invirtiendo cada signo.'
- 'Paso 3: Agrupar y reducir términos semejantes.'
errores_correccion: '- **Error 1: Invertir sólo parte de los signos en detección de
  error por cambio parcial de signo en el sustraendo.** **Cómo corregirlo:** Cambiar
  obligatoriamente los signos de todos los términos contenidos en el sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la solución correcta para detección de error por cambio parcial
    de signo en el sustraendo en 'el error -(2x - 7) = -2x - 7'?
  alternativas:
  - El error es dejar el término -7 sin invertir su signo a +7
  - El error es restar 2x
  - El error es cambiar 2x
  - No hay error
  respuesta: El error es dejar el término -7 sin invertir su signo a +7
  solucion_pasos:
  - 1. Aplicar la inversión de signos.
  - 2. Obtener El error es dejar el término -7 sin invertir su signo a +7.
- titulo: Ejemplo 2
  enunciado: Al simplificar 'el error -(2x - 7) = -2x - 7' por detección de error
    por cambio parcial de signo en el sustraendo, ¿qué resultado se obtiene?
  alternativas:
  - El error es dejar el término -7 sin invertir su signo a +7
  - El error es restar 2x
  - El error es cambiar 2x
  - No hay error
  respuesta: El error es dejar el término -7 sin invertir su signo a +7
  solucion_pasos:
  - 1. Operar los coeficientes resultantes.
  - 2. Concluir El error es dejar el término -7 sin invertir su signo a +7.
- titulo: ¿Es el resultado de la sustracción en 'el error -(2x - 7) = -2x - 7' igual
    a El error es dejar el término -7 sin invertir su signo a +7?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando el cambio de signos se obtiene El error es dejar el término -7 sin
    invertir su signo a +7.
- titulo: ¿Da la resta en 'el error -(2x - 7) = -2x - 7' una diferencia igual a El
    error es restar 2x?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es El error es dejar el término -7 sin invertir su signo
    a +7.
errores_frecuentes:
- Omitir la inversión de signo en términos secundarios en detección de error por cambio
  parcial de signo en el sustraendo.
- Sumar los exponentes al restar términos en detección de error por cambio parcial
  de signo en el sustraendo.
- Omitir encfallar el sustraendo entre paréntesis en detección de error por cambio
  parcial de signo en el sustraendo.
- Declarar el inverso aditivo de un polinomio con su recíproco multiplicativo.
- Declarar que restar un término negativo da como resultado un valor negativo.
afirmaciones_verdaderas:
- La detección de error por cambio parcial de signo en el sustraendo exige la distribución
  completa del signo negativo sobre todo el sustraendo.
- El inverso aditivo de un polinomio se forma cambiando el signo a cada uno de sus
  términos.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la detección de error
  por cambio parcial de signo en el sustraendo aplicando rigurosamente la regla del
  inverso aditivo sobre los términos restados.
