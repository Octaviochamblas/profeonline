semantic_id: MAT.ALG.SUSTRACCION_POL.CAMBIO_PARCIAL_SIGNO
resumen_inicial: 'Detección de error por cambio parcial de signo en el sustraendo:
  procedimiento y reglas en Sustracción de polinomios.'
explicacion_simple: Similar al error del signo negativo, pero en el contexto de la
  sustracción de polinomios completos. Aquí el error sucede cuando se cambia solo
  el signo de algunos términos del sustraendo, no de todos.
explicacion_formal: '### Definición formal


  Opuesto completo: $(-3m+n-4)$. Suma: $8m+2n-3m+n-4 = 5m+3n-4$. El alumno olvidó
  cambiar $-n$ a $+n$ y $+4$ a $-4$.


  ### Desarrollo didáctico


  Calculemos $(7a + 3b - 2) - (4a - b + 5)$.


  Opuesto correcto del sustraendo $(4a - b + 5)$:

  $(-4a + b - 5)$.


  Suma correcta:

  $(7a + 3b - 2) + (-4a + b - 5) = 3a + 4b - 7$.


  Error de cambio parcial (solo cambia el primer término):

  $(7a + 3b - 2) + (-4a - b + 5) = 3a + 2b + 3$ ← MAL.


  Diferencia: El $-b$ del sustraendo debía convertirse en $+b$, pero al hacerlo parcialmente
  quedó como $-b$.'
definiciones_clave: '- **Detección de error por cambio parcial de signo en el sustraendo**:
  Operación o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a detección de error por cambio parcial de signo en el sustraendo.'
ejemplo_guiado:
  enunciado: Aplica detección de error por cambio parcial de signo en el sustraendo
    en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de detección de error por cambio
    parcial de signo en el sustraendo.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
