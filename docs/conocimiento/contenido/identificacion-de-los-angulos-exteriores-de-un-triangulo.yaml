semantic_id: MAT.GEO.TRIANGULOS_DEF.ANGULOS_EXTERIORES
resumen_inicial: Los ángulos exteriores de un triángulo son aquellos formados por
  la prolongación de uno de sus lados y el lado adyacente, cuya suma total (uno por
  vértice) es siempre igual a 360°.
explicacion_simple: '![Ángulos Exteriores](/static/img/nodos/identificacion-de-los-angulos-exteriores-de-un-triangulo-intro.svg)


  Si alargas una de las líneas del triángulo hacia afuera, se forma un ángulo con
  el lado vecino que queda afuera de la figura: ese es un **ángulo exterior** (nombrado
  $\alpha'', \beta'', \gamma''$). La suma de los tres ángulos exteriores de cualquier
  triángulo es siempre **$360^\circ$**.'
explicacion_formal: '### Definición formal

  Un **ángulo exterior** de un triángulo $\Delta ABC$ es el ángulo formado por un
  lado del triángulo y la prolongación colineal del lado adyacente que concurre en
  el mismo vértice:


  $$\alpha'' = \angle(\vec{AB}, -\vec{AC}) \implies \alpha + \alpha'' = 180^\circ$$


  $$\operatorname{Ángulos\_Exteriores}(\Delta ABC) = \{\alpha'', \beta'', \gamma''\}$$


  ### Desglose simbólico y geométrico

  - $\alpha''$: Ángulo exterior suplementario adyacente a $\alpha$ en el vértice $A$.

  - $\beta''$: Ángulo exterior suplementario adyacente a $\beta$ en el vértice $B$.

  - $\gamma''$: Ángulo exterior suplementario adyacente a $\gamma$ en el vértice $C$.

  - Unicidad métrica: En cada vértice existen dos ángulos exteriores opuestos por
  el vértice con exactamente la misma medida angular.


  ### Síntesis didáctica

  Los ángulos exteriores cuantifican el cambio de dirección o deflexión angular al
  recorrer el perímetro del triángulo, siendo esenciales en poligonales y navegación.'
definiciones_clave: '- **Ángulo exterior**: Ángulo formado por un lado del triángulo
  y la prolongación de un lado adyacente.

  - **Notación prima ($\alpha'', \beta'', \gamma''$)**: Símbolos estándar para los
  ángulos exteriores.

  - **Teorema de la suma exterior**: $\alpha'' + \beta'' + \gamma'' = 360^\circ$. '
propiedades_relaciones: '- **Suplementariedad**: En cada vértice, el ángulo interior
  y el exterior suman $180^\circ$ ($\alpha + \alpha'' = 180^\circ$).

  - **Ángulos opuestos por el vértice**: En cada vértice existen dos ángulos exteriores
  congruentes (solo se considera uno en la suma total de $360^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Exteriores](/static/img/nodos/identificacion-de-los-angulos-exteriores-de-un-triangulo-ejemplos.svg)


    Dos ángulos exteriores de un triángulo miden $\alpha'' = 115^\circ$ y $\beta''
    = 135^\circ$. ¿Cuánto mide el tercer ángulo exterior $\gamma''$?'
  pasos:
  - 'Paso 1: Recordar el teorema de la suma de ángulos exteriores: $\alpha'' + \beta''
    + \gamma'' = 360^\circ$.'
  - 'Paso 2: Sumar los dos ángulos exteriores dados: $115^\circ + 135^\circ = 250^\circ$.'
  - 'Paso 3: Plantear la ecuación: $250^\circ + \gamma'' = 360^\circ$.'
  - 'Paso 4: Despejar $\gamma''$: $\gamma'' = 360^\circ - 250^\circ = 110^\circ$.'
  - 'Paso 5: Concluir que el tercer ángulo exterior mide $110^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto suman exactamente los tres ángulos exteriores de cualquier triángulo
    plano?
  choices:
  - text: Suman exactamente 360° (una vuelta completa)
    is_correct: true
  - text: Suman 180°
    is_correct: false
  - text: Suman 540°
    is_correct: false
  - text: Suman 90°
    is_correct: false
  explanation: Suman exactamente 360° (una vuelta completa) en todo triángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo interior de un triángulo mide 70°, ¿cuánto mide su ángulo
    exterior adyacente?
  choices:
  - text: 110° (porque 180° - 70° = 110°)
    is_correct: true
  - text: 290°
    is_correct: false
  - text: 70°
    is_correct: false
  - text: 20°
    is_correct: false
  explanation: Por ser suplementarios sobre la misma recta, mide 110° (porque 180°
    - 70° = 110°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Prolongar uno de los lados que concurren en el vértice hacia el exterior.'
- 'Paso 2: Identificar el ángulo suplementario al interior $\alpha'' = 180^\circ -
  \alpha$.'
- 'Paso 3: Para calcular un exterior faltante entre los 3 exteriores, restar la suma
  de los otros dos de $360^\circ$.'
errores_correccion: 'No tomes el ángulo cóncavo de 360° - α como ángulo exterior:
  el ángulo exterior se forma por la prolongación recta de un lado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo equilátero, ¿cuánto mide cada uno de sus ángulos exteriores?
  alternativas:
  - $120^\circ$
  - $60^\circ$
  - $180^\circ$
  respuesta: $120^\circ$
  solucion_pasos:
  - Como cada ángulo interior mide $60^\circ$, cada exterior mide $180^\circ - 60^\circ
    = 120^\circ$.
- titulo: Ejemplo 2
  enunciado: Si los ángulos exteriores de un triángulo miden $100^\circ$ y $140^\circ$,
    ¿cuánto mide el tercer exterior?
  alternativas:
  - $120^\circ$
  - $140^\circ$
  - $80^\circ$
  respuesta: $120^\circ$
  solucion_pasos:
  - $360^\circ - (100^\circ + 140^\circ) = 360^\circ - 240^\circ = 120^\circ$.
- titulo: ¿La suma de los ángulos exteriores de todo triángulo es 360°?
  respuesta: Sí
  solucion_pasos:
  - Sí, por teorema de geometría poligonal convexa.
- titulo: ¿Un ángulo exterior de un triángulo puede medir más de 180°?
  respuesta: 'No'
  solucion_pasos:
  - No, es suplementario a un ángulo interior agudo u obtuso, por lo que siempre mide
    menos de $180^\circ$.
errores_frecuentes:
- Confundir ángulo exterior con el ángulo reflejo ($360^\circ - \alpha$).
- Asignar a la suma de exteriores $180^\circ$ en lugar de $360^\circ$.
- Sumar los dos ángulos exteriores que se forman en un mismo vértice.
- Olvidar que un ángulo interior y su exterior adyacente suman $180^\circ$.
- Creer que los ángulos exteriores dependen de la longitud de las prolongaciones.
afirmaciones_verdaderas:
- Los tres ángulos exteriores de un triángulo suman $360^\circ$.
- Cada ángulo exterior es suplementario a su ángulo interior correspondiente.
al_terminar_debes_poder: '**QUÉ:** Identificar, trazar y calcular los ángulos exteriores
  de un triángulo.


  **CÓMO:** Prolongando los lados y aplicando la suma exterior $\alpha'' + \beta''
  + \gamma'' = 360^\circ$ y el suplemento $180^\circ - \alpha$.


  ![Resumen de los Ángulos Exteriores](/static/img/nodos/identificacion-de-los-angulos-exteriores-de-un-triangulo-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Geometría Euclidiana.
