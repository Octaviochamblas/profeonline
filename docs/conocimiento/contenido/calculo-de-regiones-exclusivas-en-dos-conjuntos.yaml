  question: Si $|A| = 40$ y $|A \setminus B| = 25$, ¿cuántos elementos comparten $A$ y $B$ en su intersección?
  choices:
  - text: $15$ elementos ($40 - 25$)
    is_correct: true
  - text: $65$ elementos
