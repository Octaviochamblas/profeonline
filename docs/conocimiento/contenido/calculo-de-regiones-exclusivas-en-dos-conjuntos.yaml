errores_frecuentes:
- La afirmación de que la región "Solo A" incluye a los elementos comunes de la intersección.
- La afirmación de que el total del conjunto A es idéntico a su región exclusiva en presencia de solapamiento.
- La afirmación de que para calcular "exactamente uno" basta con calcular la unión $A \cup B$.
- La afirmación de que las regiones exclusivas $A \setminus B$ y $B \setminus A$ pueden tener elementos en común.
- La afirmación de que la cardinalidad exclusiva de un conjunto puede ser mayor que la cardinalidad total de dicho conjunto.
afirmaciones_verdaderas:
- La cardinalidad de la región exclusiva "Solo A" se calcula restando la intersección del total del conjunto ($|A \setminus B| = |A| - |A \cap B|$).
- La cardinalidad de los elementos que pertenecen exactamente a uno de los dos conjuntos es la suma de las dos regiones exclusivas ($|A \bigtriangleup B| = |A \setminus B| + |B \setminus A|$).
al_terminar_debes_poder: 'QUÉ: Calcular e interpretar las regiones exclusivas en problemas de dos conjuntos ("Solo $A$", "Solo $B$" y "Exactamente uno").

  CÓMO: Deducir la intersección del total de cada conjunto y operar con la diferencia simétrica $|A \bigtriangleup B| = |A| + |B| - 2|A \cap B|$.


  ![Resumen calculo-de-regiones-exclusivas-en-dos-conjuntos](/static/img/nodos/calculo-de-regiones-exclusivas-en-dos-conjuntos-resumen.svg)'
