semantic_id: MAT.FUND.CARDINALIDAD_CONJUNTOS.REGION_EXCLUSIVA_DOS_CONJUNTOS
resumen_inicial: Fórmulas, propiedades y cálculo de las regiones exclusivas "Solo A" ($A \setminus B$) y "Solo B" ($B \setminus A$) en problemas de dos conjuntos.
explicacion_simple: 'Las **regiones exclusivas** en un diagrama de dos conjuntos representan a aquellos elementos que pertenecen **únicamente a uno de los dos conjuntos, pero no al otro**:

  - **"Solo $A$"** ($A \setminus B$): elementos de $A$ quitando la intersección común $\implies |A \setminus B| = |A| - |A \cap B|$.

  - **"Solo $B$"** ($B \setminus A$): elementos de $B$ quitando la intersección común $\implies |B \setminus A| = |B| - |A \cap B|$.

  - **"Exactamente uno de los dos"**: la suma de ambas exclusividades, que corresponde a la **diferencia simétrica** ($|A \bigtriangleup B| = |A \setminus B| + |B \setminus A|$).


  ![calculo-de-regiones-exclusivas-en-dos-conjuntos](/static/img/nodos/calculo-de-regiones-exclusivas-en-dos-conjuntos-intro.svg)'
explicacion_formal: '### Definición formal

  En la teoría de la medida de conteo sobre $\mathcal{P}(\mathcal{U})$, las **regiones exclusivas de orden 2** son las cardinalidades de las diferencias relativas canónicas:

  $$|A \setminus B| = |A \cap B^c| = |A| - |A \cap B| = |A \cup B| - |B|$$

  $$|B \setminus A| = |B \cap A^c| = |B| - |A \cap B| = |A \cup B| - |A|$$

  La unión disjunta de ambas regiones define la cardinalidad de la diferencia simétrica:

  $$|A \bigtriangleup B| = |(A \setminus B) \cup (B \setminus A)| = |A \setminus B| + |B \setminus A| = |A| + |B| - 2|A \cap B|$$


  ### Desglose simbólico

  - "Solo $A$": Medialuna lateral izquierda ($R_{10}$).

  - "Solo $B$": Medialuna lateral derecha ($R_{01}$).

  - Descomposición aditiva del conjunto base: $|A| = |A \setminus B| + |A \cap B|$.


  ### Síntesis didáctica

  El cálculo de regiones exclusivas aísla el comportamiento puro de cada categoría descontando los efectos de la interacción conjunta.

  '
definiciones_clave: '- **Región exclusiva "Solo $A$" ($|A \setminus B|$)**: Cardinalidad de elementos que pertenecen a $A$ sin pertenecer a $B$.

  - **Región exclusiva "Solo $B$" ($|B \setminus A|$)**: Cardinalidad de elementos que pertenecen a $B$ sin pertenecer a $A$.

  - **Exactamente una condición ($|A \bigtriangleup B|$)**: Total de elementos con pertenencia única no compartida.

  '
propiedades_relaciones: '- **Disyunción mutua**: $(A \setminus B) \cap (B \setminus A) = \emptyset$.

  - **Relación con la unión**: $|A \cup B| = |A \setminus B| + |A \cap B| + |B \setminus A|$.

  '
ejemplo_guiado:
  enunciado: 'En una oficina con $50$ empleados: $32$ usan computadora portátil ($P$), $28$ usan tablet ($T$) y $15$ usan ambos dispositivos. Calcula: (a) cuántos usan solo portátil, (b) cuántos usan solo tablet, y (c) cuántos usan exactamente uno de los dos dispositivos.


    ![Ejemplo calculo-de-regiones-exclusivas-en-dos-conjuntos](/static/img/nodos/calculo-de-regiones-exclusivas-en-dos-conjuntos-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar los datos cardinales: - $|P| = 32, |T| = 28, |P \cap T| = 15$.'
  - 'Paso 2: Calcular (a) "Solo portátil" ($|P \setminus T|$): - $|P \setminus T| = |P| - |P \cap T| = 32 - 15 = 17$ empleados.'
  - 'Paso 3: Calcular (b) "Solo tablet" ($|T \setminus P|$): - $|T \setminus P| = |T| - |P \cap T| = 28 - 15 = 13$ empleados.'
  - 'Paso 4: Calcular (c) "Exactamente un dispositivo" ($|P \bigtriangleup T|$): - $|P \bigtriangleup T| = |P \setminus T| + |T \setminus P| = 17 + 13 = 30$ empleados.'
  - 'Paso 5: Verificar mediante la fórmula general: - $|P| + |T| - 2|P \cap T| = 32 + 28 - 2(15) = 60 - 30 = 30$ empleados.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la cantidad de elementos que pertenecen a "exactamente uno" de los dos conjuntos $A$ o $B$?
  choices:
  - text: $|A \setminus B| + |B \setminus A| = |A| + |B| - 2|A \cap B|$
    is_correct: true
  - text: $|A| + |B| - |A \cap B|$
    is_correct: false
  - text: $|A \cap B| + |\mathcal{U}|$
    is_correct: false
