procedimiento:
- 'Paso 1: Identificar el total del conjunto $|A|$ y el valor de la intersección $|A \cap B|$.'
- 'Paso 2: Calcular la región exclusiva izquierda mediante $|A \setminus B| = |A| - |A \cap B|$.'
- 'Paso 3: Calcular la región exclusiva derecha mediante $|B \setminus A| = |B| - |A \cap B|$.'
- 'Paso 4: Si se solicita "exactamente uno", sumar ambas regiones exclusivas calculadas.'
errores_correccion: '- **Error 1:** Confundir el total del conjunto $|A|$ con la región exclusiva $|A \setminus B|$. **Cómo corregirlo:** El total $|A|$ incluye a los elementos compartidos; para hallar los exclusivos se debe deducir obligatoriamente la intersección $|A \cap B|$.

  - **Error 2:** Restar solo una vez la intersección al calcular "exactamente uno" con los totales directos. **Cómo corregirlo:** Con los totales directos la fórmula exige restar dos veces la intersección: $|A| + |B| - 2|A \cap B|$.

  '
ejemplos:
- titulo: Cálculo de "Solo A"
  enunciado: Si $|A| = 18$ y $|A \cap B| = 7$, ¿cuánto vale "Solo A"?
  alternativas:
  - $11$
  - $18$
  - $25$
  respuesta: $11$
  solucion_pasos:
  - 1. $|A \setminus B| = 18 - 7 = 11$.
- titulo: Cálculo a partir de la unión
  enunciado: Si $|A \cup B| = 35$ y $|B| = 20$, ¿cuánto vale $|A \setminus B|$?
  respuesta: $15$
  solucion_pasos:
  - $|A \setminus B| = |A \cup B| - |B| = 35 - 20 = 15$.
  alternativas:
  - texto: $15$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Exactamente un producto
  enunciado: Si solo compran A = 14 y solo compran B = 11, ¿cuántos compran exactamente uno?
  respuesta: $25$
  solucion_pasos:
  - $14 + 11 = 25$ personas.
  alternativas:
  - texto: $25$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
