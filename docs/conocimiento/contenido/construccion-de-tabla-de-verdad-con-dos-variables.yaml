semantic_id: MAT.FUND.TABLAS_VERDAD.CONSTRUCCION_DOS_VARIABLES
resumen_inicial: 'Procedimiento sistemático paso a paso para construir y evaluar tablas de verdad completas de $4$ filas con dos variables proposicionales.'
explicacion_simple: |
  Construir una tabla de verdad para una fórmula con **dos variables** ($p$ y $q$) es como armar un rompecabezas paso a paso. Primero dibujamos las columnas iniciales para $p$ y $q$ con sus $4$ combinaciones. Luego agregamos columnas auxiliares para resolver lo que está dentro de los paréntesis (o las negaciones). Finalmente, calculamos la **columna del conectivo principal** usando los resultados de las columnas auxiliares.

  ![Infografía: Construcción de Tabla con Dos Variables](/static/img/nodos/construccion-de-tabla-de-verdad-con-dos-variables-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **construcción de una tabla de verdad para dos variables** es el algoritmo de evaluación inductiva que computa el vector de verdad $\mathbf{v}(\Phi) \in \{V, F\}^4$ de una fórmula $\Phi(p, q)$ a partir de la matriz de entrada canónica $\mathbf{M}_{\text{in}} \in \{V, F\}^{4 \times 2}$:
  $$\mathbf{M}_{\text{in}} = \begin{pmatrix} V & V \\ V & F \\ F & V \\ F & F \end{pmatrix}$$
  siguiendo el árbol sintáctico de la fórmula de las hojas a la raíz.

  ### Desglose simbólico
  - Entradas canónicas: $p = (V, V, F, F)^T$, $q = (V, F, V, F)^T$.
  - Columnas intermedias: Asignadas a subfórmulas inmediatas (ej. $\neg p, \neg q, p \land q, p \lor q$).
  - Columna principal: Asignada al operador de menor precedencia que define la evaluación final de $\Phi$.

  ### Síntesis didáctica
  Cada columna de la tabla representa un paso algebraico intermedio. El resultado final de la fórmula queda determinado exclusivamente por los valores de la columna principal.
definiciones_clave: |
  - **Construcción de tabla de verdad**: Algoritmo secuencial que evalúa una fórmula compuesta en todas sus posibles interpretaciones.
  - **Columnas auxiliares / intermedias**: Columnas de apoyo donde se calculan subfórmulas previas a la operación principal.
  - **Columna principal / matriz**: Columna final que define la clasificación veritativa de la fórmula (tautología, contradicción o contingencia).
propiedades_relaciones: |
  - **Comprobación de equivalencia**: Dos fórmulas $\Phi_1$ y $\Phi_2$ son lógicamente equivalentes ($\Phi_1 \equiv \Phi_2$) si y solo si sus columnas principales son idénticas fila por fila.
  - **Completitud algorítmica**: La tabla de verdad es un método de decisión efectivo y finito para la lógica proposicional clásica.
ejemplo_guiado:
  enunciado: |
    Construye la tabla de verdad paso a paso para la fórmula $\Phi = (p \to q) \land p$ y determina su columna principal.

    ![Diagrama: Construcción de Tabla con Dos Variables](/static/img/nodos/construccion-de-tabla-de-verdad-con-dos-variables-ejemplos.svg)

  pasos:
    - 'Paso 1: Escribir las columnas de entrada $p = (V, V, F, F)^T$ y $q = (V, F, V, F)^T$.'
    - 'Paso 2: Calcular la columna auxiliar para el paréntesis $(p \to q)$:
      - Fila 1 ($V, V$): $V \to V = V$
      - Fila 2 ($V, F$): $V \to F = F$
      - Fila 3 ($F, V$): $F \to V = V$
      - Fila 4 ($F, F$): $F \to F = V$. Columna: $[V, F, V, V]^T$.'
    - 'Paso 3: Identificar el conectivo principal: La conjunción $\land$ entre la columna $(p \to q)$ y la columna $p$.'
    - 'Paso 4: Evaluar la columna principal fila por fila:
      - Fila 1: $V \land V = V$
      - Fila 2: $F \land V = F$
      - Fila 3: $V \land F = F$
      - Fila 4: $V \land F = F$'
    - 'Paso 5: Concluir que la columna principal es $[V, F, F, F]^T$, lo que demuestra que $(p \to q) \land p \equiv p \land q$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al construir una tabla de verdad para una fórmula con dos variables, ¿cuál es el orden correcto de evaluación?'
    choices:
      - {text: 'Evaluar primero las negaciones y paréntesis interiores, y al final el conectivo principal', is_correct: true}
      - {text: 'Evaluar siempre de derecha a izquierda sin importar los paréntesis', is_correct: false}
      - {text: 'Evaluar primero el conectivo principal y después los paréntesis', is_correct: false}
      - {text: 'Calcular únicamente la primera fila de la tabla', is_correct: false}
    explanation: 'La alternativa correcta es ''Evaluar primero las negaciones y paréntesis interiores, y al final el conectivo principal''. Sigue la jerarquía sintáctica de adentro hacia afuera.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una tabla de dos variables la columna principal resulta en $[V, V, V, V]^T$, ¿cómo se clasifica la proposición analizada?'
    choices:
      - {text: 'Tautología', is_correct: true}
      - {text: 'Contradicción', is_correct: false}
      - {text: 'Contingencia', is_correct: false}
      - {text: 'Enunciado abierto', is_correct: false}
    explanation: 'La alternativa correcta es ''Tautología''. Una fórmula cuya columna final contiene únicamente valores verdaderos es una tautología.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las 2 variables distintas ($p, q$) y dibujar una tabla con 4 filas.'
  - 'Paso 2: Escribir las entradas canónicas: $p = (V, V, F, F)$ y $q = (V, F, V, F)$.'
  - 'Paso 3: Añadir columnas auxiliares para negaciones individuales ($\neg p, \neg q$) y bloques entre paréntesis.'
  - 'Paso 4: Evaluar la columna del conectivo principal operando sobre las columnas auxiliares correspondientes.'
  - 'Paso 5: Analizar la columna principal para clasificar la fórmula.'
errores_correccion: |
  - **Error 1:** Evaluar el conectivo principal usando las columnas de entrada en lugar de las columnas auxiliares. **Cómo corregirlo:** Si la fórmula es $(p \lor q) \to \neg p$, el condicional $\to$ debe relacionar el resultado de la columna $(p \lor q)$ con el resultado de la columna $\neg p$.
  - **Error 2:** No etiquetar claramente los encabezados de las columnas auxiliares. **Cómo corregirlo:** Escribir encima de cada columna la subexpresión exacta que se está calculando para evitar confusiones al cruzar datos.
ejemplos:
  - titulo: 'Construcción para implicación doble'
    enunciado: '¿Cuál es la columna principal de $\neg p \lor q$?'
    alternativas:
      - '$[V, F, V, V]^T$'
      - '$[V, V, V, F]^T$'
      - '$[F, F, V, V]^T$'
    respuesta: '$[V, F, V, V]^T$'
    solucion_pasos:
      - '1. $\neg p = [F, F, V, V]^T$.'
      - '2. $q = [V, F, V, F]^T$.'
      - '3. $\neg p \lor q = [V, F, V, V]^T$.'
  - titulo: 'Identificación del conector principal'
    enunciado: 'En $(p \land q) \to (p \lor q)$, ¿cuál es el conectivo principal?'
    alternativas:
      - 'El condicional ($\to$)'
      - 'La conjunción ($\land$)'
      - 'La disyunción ($\lor$)'
      - 'La negación ($\neg$)'
    respuesta: 'El condicional ($\to$)'
    solucion_pasos:
      - 'El condicional $\to$ une los dos bloques entre paréntesis, siendo el operador principal.'
  - titulo: 'Verificación de tautología'
    enunciado: '¿La fórmula $(p \land q) \to p$ genera el vector $[V, V, V, V]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la ley de simplificación, una tautología válida.'
  - titulo: 'Comprobación de equivalencia'
    enunciado: '¿Dos fórmulas con columnas principales idénticas son lógicamente equivalentes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la igualdad columna a columna define la equivalencia lógica.'
errores_frecuentes:
  - 'La afirmación de que el conectivo principal se evalúa antes de resolver los paréntesis interiores.'
  - 'La afirmación de que las columnas auxiliares no son necesarias para construir tablas de verdad compuestas.'
  - 'La afirmación de que la reubicación de las columnas auxiliares altera el resultado de la columna principal.'
  - 'La afirmación de que una tabla de 2 variables puede resolverse evaluando solo una fila seleccionada.'
  - 'La afirmación de que las entradas canónicas de $p$ y $q$ pueden repetirse en filas idénticas.'
afirmaciones_verdaderas:
  - 'La construcción de una tabla de verdad con $2$ variables requiere $4$ filas y la resolución ordenada de subfórmulas de adentro hacia afuera.'
  - 'La columna principal de la tabla de verdad representa el valor veritativo global de la fórmula y determina su clasificación lógica.'
al_terminar_debes_poder: |
  QUÉ: Construir, estructurar y evaluar tablas de verdad completas de $4$ filas con dos variables proposicionales.
  CÓMO: Organizar columnas auxiliares, aplicar las reglas de los conectivos intervinientes y obtener la columna principal.

  ![Cuadro resumen: Construcción de Tabla con Dos Variables](/static/img/nodos/construccion-de-tabla-de-verdad-con-dos-variables-resumen.svg)
