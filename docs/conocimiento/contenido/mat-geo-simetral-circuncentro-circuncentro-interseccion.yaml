semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_INTERSECCION
resumen_inicial: 'Definición de circuncentro como punto de intersección de las simetrales:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: 'Al igual que ocurre con las alturas y las bisectrices, las tres
  simetrales de un triángulo también concurren siempre en un único punto: el circuncentro.'
explicacion_formal: '![Circuncentro, intersección de las simetrales](/static/img/geometria/elementos-secundarios/simetral-circuncentro-circuncentro-interseccion.svg)


  ### Definición formal


  Dado un triángulo ABC, el circuncentro O es el punto común a las tres simetrales
  de los lados AB, BC y CA.


  ### Desarrollo didáctico


  La posición del circuncentro respecto al triángulo varía según su tipo: dentro en
  los acutángulos, en el punto medio de la hipotenusa en los rectángulos, y fuera
  en los obtusángulos.'
definiciones_clave: '- **Definición de circuncentro como punto de intersección de
