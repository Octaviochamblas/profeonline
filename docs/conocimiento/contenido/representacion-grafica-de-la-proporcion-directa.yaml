semantic_id: MAT.NUM.RAZONES_PROPORCIONES.GRAFICO_PROP_DIRECTA
resumen_inicial: La representación gráfica de una proporcionalidad directa en el plano cartesiano es una línea recta (o semirrecta) que pasa estrictamente por el origen de coordenadas $(0, 0)$, cuya pendiente es la constante $k$.
explicacion_simple: '![Gráfico de proporción directa](/static/img/nodos/representacion-grafica-de-la-proporcion-directa-intro.svg)


  El gráfico de una **proporcionalidad directa** tiene dos características visuales inconfundibles:

  1. **Es una LÍNEA RECTA** (o semirrecta que sube hacia la derecha).

  2. **PASA OBLIGATORIAMENTE POR EL ORIGEN $(0, 0)$** (el punto donde se cruzan los ejes $X$ e $Y$).


  **¿Por qué pasa por $(0,0)$?** Porque si no compras ningún kilo de manzanas ($x = 0$), pagas exactamente $\$0$ ($y = 0$).

  - La **inclinación o pendiente** de la recta es la **constante $k$**: mientras más grande sea $k$, más empinada y vertical será la recta.

  - Si una gráfica es una curva, o si es una recta que NO pasa por $(0,0)$ (por ejemplo, pasa por $(0, 10)$), **¡NO es una proporción directa!**'
explicacion_formal: 'Sea la relación funcional $y = f(x) = k \cdot x$ con $k > 0$ y $x \ge 0$.


  **Geometría Analítica de la Proporcionalidad Directa:**

  1. **Lugar Geométrico:** Corresponde a un rayo (o semirrecta) contenido en la recta de ecuación vectorial en $\mathbb{R}^2$:

  $$\mathcal{L} = \{(x, y) \in \mathbb{R}^2 \mid y = kx\}$$

  2. **Punto de Intersección:** Intersecta a ambos ejes únicamente en el origen: $(0, 0) = \mathcal{L} \cap \text{Eje } X = \mathcal{L} \cap \text{Eje } Y$.

  3. **Pendiente de la Recta:**

  $$m = \tan(\theta) = \frac{\Delta y}{\Delta x} = k$$

  donde $\theta$ es el ángulo de inclinación respecto al semieje positivo de las abscisas.'
definiciones_clave: '- **Gráfico directo**: Recta radial que pasa por el origen $(0, 0)$.

  - **Origen $(0, 0)$**: Punto donde ambas variables son simultáneamente nulas.

  - **Pendiente ($m = k$)**: Coeficiente angular que determina la inclinación de la recta.'
propiedades_relaciones: '- **Biyección en $\mathbb{R}^+$**: Cada valor de $x$ se mapea unívocamente a un punto $(x, kx)$ en la recta.

  - **Monotonía creciente**: Como $k > 0$, a mayor $x$ corresponde siempre un mayor $y$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de gráfico de proporción directa](/static/img/nodos/representacion-grafica-de-la-proporcion-directa-ejemplos.svg)


    Obtenga la constante $k$ y la ecuación de una recta proporcional que pasa por el punto $(4, 18)$, y explique por qué una recta que pasa por $(0, 10)$ y $(2, 20)$ no representa una proporción directa.'
  pasos:
  - 'Paso 1: Para el punto $(4, 18)$: Identificar $x = 4, y = 18 \implies k = \frac{18}{4} = 4,5$.'
  - 'Paso 2: Ecuación de la recta proporcional: $y = 4,5 \cdot x$.'
  - 'Paso 3: Para la recta por $(0, 10)$: Como corta al eje Y en $y = 10 \neq 0$, no pasa por el origen $(0,0)$.'
  - 'Paso 4: Conclusión: Es una función afín ($y = 5x + 10$), NO una proporción directa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las dos condiciones visuales que debe cumplir el gráfico de una proporción directa?
  choices:
  - text: Ser una línea recta y pasar obligatoriamente por el origen (0, 0)
    is_correct: true
  - text: Ser una curva que corte el eje Y en 10
    is_correct: false
  - text: Ser una línea horizontal paralela al eje X
    is_correct: false
  - text: Ser una parábola que se abra hacia arriba
    is_correct: false
  explanation: La alternativa correcta es 'Ser una línea recta y pasar obligatoriamente por el origen (0, 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la recta que pasa por (0, 10) no es proporcional directa?
  choices:
  - text: Porque no pasa por el origen (0, 0) al tener un cargo fijo de 10
    is_correct: true
  - text: Porque los números son pares
    is_correct: false
  - text: Porque la pendiente es negativa
    is_correct: false
  - text: Porque tiene solo dos puntos
    is_correct: false
  explanation: La alternativa correcta es 'Porque no pasa por el origen (0, 0) al tener un cargo fijo de 10'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Graficar los pares ordenados $(x_i, y_i)$ en el plano cartesiano.'
- 'Paso 2: Trazar la línea continua y verificar que pase estrictamente por el origen $(0,0)$.'
- 'Paso 3: Calcular la pendiente de la recta dividiendo las coordenadas de cualquier punto: $k = \frac{y}{x}$.'
errores_correccion: '- **Error 1: Considerar proporcional directa a cualquier línea recta.** **Cómo corregirlo:** Si la recta corta al eje Y en un punto distinto de $(0,0)$ ($y = mx + n$ con $n \neq 0$), es una función AFÍN, no proporcional directa.

  - **Error 2: Unir puntos con líneas curvas en relaciones proporcionales.** **Cómo corregirlo:** La proporcionalidad directa es ESTRICTAMENTE rectilínea.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Una recta de proporción directa pasa por el punto $(5, 35)$. ¿Cuál es su pendiente $k$?
  alternativas:
  - $7$
  - $175$
  - $0,14$
  respuesta: $7$
  solucion_pasos:
  - $k = \frac{35}{5} = 7$.
- titulo: Ejemplo 2
  enunciado: ¿Qué punto pertenece a la gráfica de la proporción directa $y = 3x$?
  alternativas:
  - $(4, 12)$
  - $(4, 7)$
  - $(0, 3)$
  respuesta: $(4, 12)$
  solucion_pasos:
  - Para $x = 4$, $y = 3 \cdot 4 = 12 \implies (4, 12)$.
- titulo: ¿Pasa siempre por (0, 0) el gráfico de una proporcionalidad directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, cuando $x = 0$, $y = k \cdot 0 = 0$ obligatoriamente.
  alternativas:
  - texto: Sí, es el rasgo distintivo geométrico de la proporcionalidad directa
    es_correcta: true
    retroalimentacion: ¡Correcto! Intersección en el origen.
  - texto: No, puede pasar por (0, 5)
    es_correcta: false
    retroalimentacion: Incorrecto, si pasa por (0,5) es una función afín con desfase.
  - texto: No, nunca toca el eje Y
    es_correcta: false
    retroalimentacion: Incorrecto, parte desde el origen $(0,0)$.
- titulo: ¿Representa una curva una proporcionalidad directa?
  respuesta: 'No'
  solucion_pasos:
  - No, la proporcionalidad directa genera exclusivamente una línea recta.
  alternativas:
  - texto: No, el gráfico debe ser estrictamente una línea recta
    es_correcta: true
    retroalimentacion: ¡Correcto! Pendiente constante.
  - texto: Sí, si la curva sube
    es_correcta: false
    retroalimentacion: Incorrecto, las curvas tienen pendientes variables.
  - texto: Sí, si pasa por (0,0)
    es_correcta: false
    retroalimentacion: Incorrecto, una parábola pasa por (0,0) y no es directa.
errores_frecuentes:
- Confundir la gráfica de una función afín con una lineal directa.
- Asumir que toda gráfica creciente es directamente proporcional.
- Calcular la pendiente como $\Delta x / \Delta y$ en lugar de $\Delta y / \Delta x$.
- No verificar el paso por el origen $(0,0)$.
afirmaciones_verdaderas:
- El gráfico de una proporcionalidad directa es una línea recta que pasa por el origen $(0, 0)$.
- La pendiente de la recta coincide con la constante de proporcionalidad $k$.
- Si una recta no pasa por $(0, 0)$, no representa una proporcionalidad directa.
al_terminar_debes_poder: '![Síntesis de gráfico de proporción directa](/static/img/nodos/representacion-grafica-de-la-proporcion-directa-resumen.svg)


  QUÉ: Interpretar, graficar y analizar la representación cartesiana de una proporción directa.


  CÓMO: Trazando la semirrecta que parte desde el origen $(0, 0)$ y verificando que la pendiente de la recta sea la constante $k = \frac{y}{x}$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
