semantic_id: MAT.NUM.PROP_DIRECTA.GRAFICO_RECTA_ORIGEN
resumen_inicial: 'La representación gráfica de una relación de proporcionalidad directa en el plano cartesiano es una línea recta que nace o pasa por el origen de coordenadas $(0, 0)$.'
explicacion_simple: |
  Si graficas los puntos de una proporción directa en el plano cartesiano (con el eje X horizontal y el eje Y vertical) y los unes con una línea, descubrirás dos cosas mágicas:
  1. La línea es **perfectamente recta**.
  2. La recta pasa **exactamente por el punto de origen $(0,0)$**.
  Si una gráfica es curva, o si es una recta pero corta al eje Y por arriba o por abajo del cero (ej: en el punto $(0, 5)$), entonces **NO es proporcionalidad directa**.
explicacion_formal: |
  ### Definición formal
  El gráfico de una relación de proporcionalidad directa $y = k \cdot x$ ($k > 0$) en el plano cartesiano $\mathbb{R}^2$ es la representación del conjunto solución:
  $$\mathcal{G} = \{(x, y) \in \mathbb{R}^2 : y = k \cdot x\}$$

  ### Propiedades geométricas esenciales
  1. **Linealidad**: Es una **línea recta continua** (o semirrecta en el primer cuadrante para magnitudes físicas).
  2. **Intersección con los ejes**: Pasa obligatoriamente por el **origen de coordenadas $(0, 0)$** puesto que para $x = 0 \implies y = k \cdot 0 = 0$.
  3. **Pendiente de la recta**: La inclinación o pendiente de la recta coincide exactamente con la constante de proporcionalidad:
     $$m = \tan(\theta) = k = \frac{\Delta y}{\Delta x}$$

  ### Criterio gráfico de exclusión
  - Si el gráfico es una recta pero **no pasa por $(0,0)$** (función afín $y = mx + n$ con $n \neq 0$), **NO hay proporcionalidad directa**.
  - Si el gráfico es una **curva hiperbólica**, corresponde a proporcionalidad inversa.

  ### Síntesis didáctica
  - Forma: Recta que pasa por $(0, 0)$.
  - Pendiente de la recta: Constante $k$.
definiciones_clave: |
  - **Gráfico de proporción directa**: Semirrecta o línea recta en el plano cartesiano que inicia en el origen $(0,0)$.
  - **Origen de coordenadas $(0,0)$**: Punto de intersección de los ejes cartesiano real e independiente por donde cruza la recta.
  - **Pendiente de la recta $k$**: Grado de inclinación de la recta proporcional que coincide con el cociente $y/x$.
propiedades_relaciones: |
  - **Crecimiento de la inclinación**: A mayor valor de la constante de proporcionalidad $k$, mayor es la inclinación de la recta respecto al eje horizontal $X$.
  - **Función lineal en álgebra**: Corresponde al gráfico característico de la función lineal de la forma $f(x) = kx$.
ejemplo_guiado:
  enunciado: 'Un automóvil avanza a velocidad constante y se registran los puntos $(1, 60), (2, 120)$ y $(3, 180)$ en un gráfico. Determina si el gráfico corresponde a una proporcionalidad directa y calcula la pendiente de la recta.'
  pasos:
    - 'Paso 1: Graficamos los puntos en el plano cartesiano colocando el tiempo en el eje X y la distancia en el eje Y.'
    - 'Paso 2: Trazamos la línea recta que une los puntos y observamos que al extenderla pasa por el origen $(0, 0)$.'
    - 'Paso 3: Calculamos la pendiente inclinada dividiendo la ordenada entre la abscisa: $k = \frac{60}{1} = 60$.'
    - 'Paso 4: Concluimos que el gráfico corresponde a una **proporcionalidad directa** con constante $k = 60\text{ km/h}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué dos condiciones geométricas debe cumplir obligatoriamente un gráfico para representar una proporcionalidad directa?'
    choices:
      - {text: 'Ser una línea recta y pasar exactamente por el origen de coordenadas $(0, 0)$', is_correct: true}
      - {text: 'Ser una curva hiperbólica que se aproxima a los ejes', is_correct: false}
      - {text: 'Ser una línea recta horizontal paralela al eje X', is_correct: false}
      - {text: 'Ser una línea recta que corta al eje Y en el punto $(0, 10)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Ser una línea recta y pasar exactamente por el origen de coordenadas $(0, 0)$''. Ambas condiciones definen el gráfico de $y = kx$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una recta pasa por el origen $(0, 0)$ y por el punto $(4, 20)$, ¿cuál es la constante de proporcionalidad y la pendiente de dicha recta?'
    choices:
      - {text: '$k = 5$, dividiendo la ordenada por la abscisa ($20 \div 4 = 5$)', is_correct: true}
      - {text: '$k = 80$, multiplicando los dos valores', is_correct: false}
      - {text: '$k = 16$, restando $20 - 4$', is_correct: false}
      - {text: '$k = 0.2$, dividiendo $4 / 20$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 5$, dividiendo la ordenada por la abscisa ($20 \div 4 = 5$)''. La pendiente de la recta es $m = k = 20/4 = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Construir los ejes de coordenadas cartesianas (eje X para la variable independiente y eje Y para la dependiente).'
  - 'Paso 2: Ubicar los puntos cartesianos $(x_i, y_i)$ dados en el problema.'
  - 'Paso 3: Trazar una recta que una los puntos proyectándola hacia el origen $(0,0)$.'
  - 'Paso 4: Verificar que la recta pase exactamente por $(0,0)$ y calcular su pendiente $k = \frac{y}{x}$.'
errores_correccion: |
  - **Error 1:** Afirmar que una recta que corta al eje Y en $(0, 3)$ representa una proporción directa porque "es una recta". **Cómo corregirlo:** Si no pasa por el origen $(0,0)$, es una **función afín ($y = mx + n$)**, NO una proporcionalidad directa.
  - **Error 2:** Unir los puntos con líneas quebradas en lugar de una recta continua. **Cómo corregirlo:** La proporcionalidad directa mantiene una pendiente constante, por lo que **todos los puntos se alinean en una única recta perfecta**.
ejemplos:
  - titulo: 'Grafico de función lineal'
    enunciado: '¿La recta que une los puntos $(0,0), (2,6)$ y $(5,15)$ representa una proporción directa?'
    alternativas:
      - 'Sí, es una recta que pasa por el origen con $k=3$'
      - 'No, es una curva'
      - 'No, no pasa por el origen'
    respuesta: 'Sí, es una recta que pasa por el origen con $k=3$'
    solucion_pasos:
      - '1. Pasa por el origen $(0,0)$.'
      - '2. Cocientes $6/2 = 15/5 = 3 \implies$ Recta de proporción directa.'
  - titulo: 'Recta afín no proporcional'
    enunciado: '¿La recta $y = 2x + 4$ que pasa por $(0,4)$ es de proporcionalidad directa?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Al tener $n=4 \neq 0$, no pasa por el origen $(0,0)$.'
  - titulo: 'Inclinación de la recta'
    enunciado: 'Entre $y = 2x$ e $y = 8x$, ¿la recta $y = 8x$ tiene mayor inclinación respecto al eje X?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A mayor constante $k=8 > 2$, mayor pendiente.'
  - titulo: 'Puntos alineados en el primer cuadrante'
    enunciado: 'Si $x$ e $y$ son cantidades de objetos y costos, ¿el gráfico es una semirrecta que nace en $(0,0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que las cantidades reales son no negativas ($x \ge 0$).'
errores_frecuentes:
  - 'Clasificar rectas que cortan al eje Y en puntos distintos de cero como gráficos de proporcionalidad directa.'
  - 'El gráfico de la proporción directa corresponde a una curva hiperbólica decreciente.'
  - 'La pendiente de la recta en el gráfico proporcional es diferente a la constante $k$.'
  - 'Invertir la posición de las variables colocándola dependiente en el eje horizontal.'
  - 'La pendiente de la recta en el gráfico proporcional es diferente a la constante $k$.'
afirmaciones_verdaderas:
  - 'El gráfico de una relación de proporcionalidad directa en el plano cartesiano es siempre una línea recta que pasa por el origen de coordenadas $(0, 0)$.'
  - 'La pendiente o inclinación de la recta en el gráfico proporcional es numéricamente igual a la constante de proporcionalidad $k$.'
al_terminar_debes_poder: 'Identificar y trazar gráficos de proporcionalidad directa como rectas que pasan por el origen de coordenadas $(0,0)$.'
