semantic_id: MAT.NUM.PROP_DIRECTA.GRAFICO_RECTA_ORIGEN
resumen_inicial: 'Representación gráfica de la proporción directa: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: Si tomas todos los puntos de una tabla de proporción directa y
  los dibujas en un plano cartesiano, aparecerá una figura geométrica perfecta e inconfundible
  que nos da información a un solo golpe de vista.
explicacion_formal: 'Una **proporcionalidad directa** siempre se representa gráficamente
  como una **línea recta diagonal**.


  La característica más crítica es que esta recta **debe pasar por el origen** $(0,0)$.
  Esto tiene total sentido lógico: si no compras ningún artículo ($x=0$), no pagas
  nada ($y=0$). Si la recta no pasa por el origen (por ejemplo, si arranca desde más
  arriba en el eje Y), no es proporción directa, sino una función afín con un ''cargo
  fijo''.


  La inclinación (pendiente) de esta recta depende del valor de la constante $k$:
  mientras mayor sea $k$, más empinada será la recta.'
definiciones_clave: '- **Representación gráfica de la proporción directa**: Elemento
  central dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a representación gráfica de la proporción directa.'
ejemplo_guiado:
