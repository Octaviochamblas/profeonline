resumen_inicial: La representación gráfica de una proporcionalidad directa en el plano
  cartesiano es una línea recta que pasa siempre por el origen $(0,0)$ y cuya pendiente
  es la constante $k$.
explicacion_simple: Si graficamos los puntos de dos variables directamente proporcionales
  en un plano $X-Y$, todos los puntos quedan alineados formando una recta perfecta
  que parte exactamente desde el punto $(0,0)$.
explicacion_formal: 'La **Gráfica de Proporcionalidad Directa** es el lugar geométrico
  definido por el conjunto de puntos:


  $$G = \{(x, y) \in \mathbb{R}^2 \mid y = k \cdot x, \, k > 0\}$$


  **Características geométricas fundamentales:**

  - Paso por el origen: Contiene obligatoriamente al punto $(0,0)$, puesto que si
  $x=0 \implies y=0$.

  - Pendiente de la recta: La inclinación de la recta es $m = k = \tan(\theta)$.'
definiciones_clave: '- **Gráfico de proporción directa**: Recta continua o discontinua
  de pendiente $k$ que pasa por el origen $(0,0)$.'
propiedades_relaciones: '- **Origen de coordenadas**: Punto $(0,0)$ perteneciente
  a la gráfica.'
ejemplo_guiado:
  enunciado: Determine si una recta que pasa por los puntos $(0,0)$ y $(3, 12)$ gráfica
    una proporción directa, y halle su constante $k$.
  pasos:
  - 'Paso 1: Confirmar el paso por el origen: incluye al punto $(0,0)$.'
  - 'Paso 2: Calcular la pendiente/constante $k = \frac{y}{x} = \frac{12}{3} = 4$.'
  - 'Conclusión: Representa una proporción directa con constante $k = 4$ y ecuación
    $y = 4x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué dos características geométricas identifican al gráfico de una proporcionalidad
    directa?
  choices:
  - text: Es una línea recta que pasa necesariamente por el origen (0,0)
    is_correct: true
  - text: Es una curva parabólica que no toca el origen
    is_correct: false
  - text: Es una recta horizontal paralela al eje X
    is_correct: false
  - text: Es una hipérbola que se aleja de los ejes
    is_correct: false
  explanation: La alternativa correcta es 'Es una línea recta que pasa necesariamente
    por el origen (0,0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el punto (3, 12), ¿cuál fue la pendiente k de
    la recta?
  choices:
  - text: '4'
    is_correct: true
  - text: '36'
    is_correct: false
  - text: '12'
    is_correct: false
  - text: 0,25
    is_correct: false
  explanation: La alternativa correcta es '4'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar e interpretar el gráfico
  de una proporcionalidad directa como una recta que cruza el origen $(0,0)$.
semantic_id: MAT.NUM.PROP_DIRECTA.GRAFICO_RECTA_ORIGEN
procedimiento:
- 'Paso 1: Verificar que el cociente $y / x = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = k \cdot x$ o el gráfico de recta que pasa por
  $(0,0)$.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Creer que una recta con desfase $y = kx + c$ ($c
  \neq 0$) representa proporcionalidad directa.** **Cómo corregirlo:** La proporcionalidad
  directa exige obligatoriamente pasar por el origen $(0,0)$, sin término independiente
  $c$.


  - **Error 2: Usar el producto $x \cdot y$ en lugar del cociente $y / x$ para hallar
  $k$.** **Cómo corregirlo:** El producto constante corresponde a proporcionalidad
  INVERSA; la directa usa el cociente $y/x = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_DIRECTA.GRAFICO_RECTA_ORIGEN.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad directa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de cociente.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por cociente constante y/x.
- titulo: ¿Pasa la gráfica de una proporción directa por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $x=0 \implies y=0$.
- titulo: ¿Permite el modelo y = kx calcular valores desconocidos?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicando el valor de $x$ por la constante $k$.
errores_frecuentes:
- Clasificar como proporcionalidad directa una relación cuya gráfica es una recta
  que no pasa por el origen $(0,0)$.
- Multiplicar las variables entre sí ($x \cdot y$) pretendiendo obtener la constante
  de proporcionalidad directa.
- Sumar una cantidad fija a ambas variables pensando que se mantiene la relación de
  proporción.
- Declarar que si una variable aumenta y la otra también aumenta, existe proporcionalidad
  directa sin comprobar la constancia de $y/x$.
- Omitir incluir la unidad de medida compuesta en el valor de la constante de proporcionalidad
  $k$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante:
  $\frac{y}{x} = k$.'
- El gráfico de una relación de proporcionalidad directa es siempre una línea recta
  que pasa por el origen $(0,0)$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
