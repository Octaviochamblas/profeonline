procedimiento:
- 'Paso 1: Observa el plano cartesiano y ubica los puntos de la gráfica.'
- 'Paso 2: Comprueba que forman una línea recta.'
- 'Paso 3: Verifica que el origen $(0,0)$ sea parte de esa recta. Si cumple ambas, es proporción
  directa.'
errores_correccion: Evita confundir los datos de entrada al operar con representación gráfica
  de la proporción directa.
ejemplos:
- titulo: Evaluando gráficos
  enunciado: Una recta arranca en el punto $(0, 1000)$ y sube constantemente. ¿Es proporción
    directa?
  solucion_pasos:
  - La forma es de recta.
  - Pero corta al eje Y en $1000$, no en $0$.
  - Por lo tanto, NO es proporción directa.
- titulo: Ejemplo 1
  enunciado: ¿Cuál gráfico representa una proporción directa?
  alternativas:
  - Una recta que pasa por el origen
  - Una recta que corta el eje Y en 5
  - Una curva creciente
  respuesta: Una recta que pasa por el origen
  solucion_pasos:
  - Esa es la condición indispensable de la proporción directa.
- titulo: Ejemplo 2
  enunciado: Una recta pasa por (0,0) y (4,20). ¿Cuál es su constante de proporcionalidad?
  alternativas:
  - '5'
  - '4'
  - '20'
  respuesta: '5'
  solucion_pasos:
  - 20 dividido entre 4 es igual a 5.
- titulo: ¿Una recta horizontal puede representar una proporción directa?
  respuesta: 'No'
  solucion_pasos:
  - Salvo el caso trivial y igual a 0, una recta horizontal no cambia junto con x, por lo
    tanto no es una proporción directa.
errores_frecuentes:
- Creer que cualquier recta inclinada es proporción directa, olvidando revisar si pasa por
  $(0,0)$.
- Pensar que una curva ascendente puede ser proporción directa.
- Confundir la pendiente de la recta con el valor de la variable $x$.
- Creer que si la recta es muy acostada (pendiente baja), deja de ser proporción directa.
- Calcular la pendiente de la recta usando dos puntos que no correspondan realmente a la gráfica.
afirmaciones_verdaderas:
- La propiedad de representación gráfica de la proporción directa preserva la consistencia
  lógica.
- La pendiente de la recta que representa una proporción directa es igual a la constante de
  proporcionalidad k.
al_terminar_debes_poder: Resolver problemas aplicados que involucren representación gráfica
  de la proporción directa.
