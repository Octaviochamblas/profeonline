semantic_id: MAT.NUM.INTERES_SIMPLE.CAPITAL_INICIAL
resumen_inicial: 'El cálculo del capital inicial $C$ en régimen de interés simple despeja el principal invirtiendo la fórmula del interés ($C = \frac{I}{i \cdot t}$) o la del monto final ($C = \frac{M}{1 + i \cdot t}$).'
explicacion_simple: |
  Si sabes cuánto dinero de interés ganaste (o el monto total final) pero quieres averiguar **cuánto dinero depositaste originalmente**:
  1. Si conoces el interés ganado $I$: divides el interés entre el producto de la tasa decimal y el tiempo ($C = \frac{I}{i \cdot t}$).
  2. Si conoces el monto final $M$: divides el monto total entre el factor de acumulación ($C = \frac{M}{1 + i \cdot t}$).
  Por ejemplo, si ganaste $\$12.000$ de interés en 2 años al $6\%$ anual ($i = 0,06$), la multiplicación $i \cdot t = 0,12$. Al dividir $12.000 \div 0,12 = \$100.000$ (tu capital inicial).
explicacion_formal: |
  ### Definición formal
  El **capital inicial o valor presente $C$** es la cantidad de dinero originalmente invertida o solicitada a interés simple, obtenida despejando $C$ de los modelos financieros fundamentales:

  1. **Despeje a partir del Interés Acumulado $I$**:
     $$I = C \cdot i \cdot t \implies C = \frac{I}{i \cdot t}$$
  2. **Despeje a partir del Monto Final Acumulado $M$**:
     $$M = C \cdot (1 + i \cdot t) \implies C = \frac{M}{1 + i \cdot t}$$

  ### Sensibilidad del Capital Inicial
  Dado un interés $I$ constante, el capital inicial requerido $C$ es inversamente proporcional tanto a la tasa de interés $i$ como al tiempo de exposición $t$.

  ### Síntesis didáctica
  - Despeje por interés: $C = \frac{I}{i \cdot t}$.
  - Despeje por monto final: $C = \frac{M}{1 + i \cdot t}$.
definiciones_clave: |
  - **Valor Presente ($C$)**: Valor actual equivalente de un flujo o monto futuro traído a la fecha inicial.
  - **Descuento a interés simple**: Proceso algebraico de dividir el valor futuro $M$ entre el factor de acumulación.
  - **Factor divisor $(1 + i \cdot t)$**: Expresión adimensional que descuenta los intereses para reconstruir el principal.
propiedades_relaciones: |
  - **Unicidad del principal**: Para un conjunto fijo de parámetros de rendimiento y tiempo, existe un único capital inicial que produce la ganancia o monto dado.
  - **Efecto de la tasa de interés**: A mayor tasa de interés ofrecida, menor es el capital inicial $C$ necesario para alcanzar una meta fija de interés $I$.
ejemplo_guiado:
  enunciado: '¿Qué capital inicial $C$ se debe depositar a una tasa de interés simple del $10\%$ anual para obtener un monto final de $\$260.000$ al cabo de $3$ años?'
  pasos:
    - 'Paso 1: Identificamos el monto final $M = 260.000$, tasa decimal $i = 0,10$ y tiempo $t = 3\text{ años}$.'
    - 'Paso 2: Como conocemos el monto final, aplicamos la fórmula $C = \frac{M}{1 + i \cdot t}$.'
    - 'Paso 3: Calculamos el denominador: $1 + (0,10 \cdot 3) = 1 + 0,30 = 1,30$.'
    - 'Paso 4: Dividimos el monto entre el denominador: $C = \frac{260.000}{1,30} = 200.000$. El capital inicial fue de **$\$200.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular el capital inicial $C$ si se conoce el interés acumulado $I$, la tasa decimal $i$ y el tiempo $t$?'
    choices:
      - {text: 'Dividir el interés entre el producto de la tasa por el tiempo ($C = \frac{I}{i \cdot t}$)', is_correct: true}
      - {text: 'Multiplicar el interés por la tasa y el tiempo ($C = I \cdot i \cdot t$)', is_correct: false}
      - {text: 'Restar la tasa y el tiempo al interés ($C = I - i - t$)', is_correct: false}
      - {text: 'Dividir la tasa entre el producto de $I \cdot t$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir el interés entre el producto de la tasa por el tiempo ($C = \frac{I}{i \cdot t}$)''. Se despeja $C$ de $I = C \cdot i \cdot t$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una inversión rindió $\$15.000$ de interés simple en $1$ año al $5\%$ anual, ¿cuál fue el capital inicial invertido?'
    choices:
      - {text: '$\$300.000$, dividiendo $15.000 / 0.05 = 300.000$', is_correct: true}
      - {text: '$\$750$, multiplicando $15.000 \cdot 0.05$', is_correct: false}
      - {text: '$\$150.000$, dividiendo por 0.10', is_correct: false}
      - {text: '$\$315.000$, sumando el interés', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$300.000$, dividiendo $15.000 / 0.05 = 300.000$''. $C = 15.000 / (0.05 \cdot 1) = 300.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los datos conocidos (Interés $I$ o Monto $M$, junto con tasa $i$ y tiempo $t$).'
  - 'Paso 2: Si el dato es $I$, usar $C = \frac{I}{i \cdot t}$. Si el dato es $M$, usar $C = \frac{M}{1 + i \cdot t}$.'
  - 'Paso 3: Calcular primero el producto $i \cdot t$ en el denominador (homologando unidades temporales).'
  - 'Paso 4: Realizar la división final para hallar el capital $C$.'
errores_correccion: |
  - **Error 1:** Multiplicar el interés por la tasa y el tiempo en lugar de dividir (ej: hacer $C = I \cdot i \cdot t$). **Cómo corregirlo:** Para despejar la incógnita $C$, **los términos $i$ y $t$ PÁSAN DIVIDIENDO**: $C = \frac{I}{i \cdot t}$.
  - **Error 2:** Usar la fórmula de interés $I$ cuando el dato proporcionado en el problema es el monto final $M$. **Cómo corregirlo:** Si el dato incluye el capital devuelto, **DEBES incluir el +1 en el denominador**: $C = \frac{M}{1 + i \cdot t}$.
ejemplos:
  - titulo: 'Cálculo de capital dado el interés'
    enunciado: 'Si $I = \$20.000$, $i = 0,05$ anual y $t = 2$ años, ¿el capital inicial $C$ es $\$200.000$?'
    alternativas:
      - 'Sí, pues $20.000 / (0.05 \cdot 2) = 20.000 / 0.10 = 200.000$'
      - 'No, el capital es $\$2.000$'
      - 'No, el capital es $\$20.000$'
    respuesta: 'Sí, pues $20.000 / (0.05 \cdot 2) = 20.000 / 0.10 = 200.000$'
    solucion_pasos:
      - '1. Denominador: $i \cdot t = 0,05 \cdot 2 = 0,10$.'
      - '2. Dividimos: $C = 20.000 / 0,10 = 200.000$.'
  - titulo: 'Cálculo de capital dado el monto final'
    enunciado: 'Si $M = \$110.000$, $i = 0,10$ y $t = 1$ año, ¿el capital inicial es $\$100.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $C = 110.000 / (1 + 0,10) = 110.000 / 1,1 = \$100.000$.'
  - titulo: 'Despeje con plazo en meses'
    enunciado: 'Si $I = \$6.000$ en 6 meses ($0,5$ años) al $12\%$ anual ($0,12$), ¿el capital es $\$100.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $C = 6.000 / (0,12 \cdot 0,5) = 6.000 / 0,06 = \$100.000$.'
  - titulo: 'Verificación de consistencia'
    enunciado: '¿El capital inicial $C$ calculado debe ser siempre estrictamente menor que el monto final $M$ acumulado?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que $M = C + I$ con $I > 0 \implies C < M$.'
errores_frecuentes:
  - 'Multiplicar el interés ganado por la tasa de interés en lugar de dividir.'
  - 'Dividir el monto acumulado entre la tasa sin agregar la constante 1 al denominador.'
  - 'Utilizar la tasa porcentual directa sin convertir a su expresión decimal en la división.'
  - 'Obtener un capital inicial mayor al monto final entregado en el enunciado.'
  - 'Dividir el interés entre la tasa omitiendo el producto por el tiempo en el denominador.'
afirmaciones_verdaderas:
  - 'El capital inicial a partir del interés acumulado se calcula mediante la división $C = \frac{I}{i \cdot t}$.'
  - 'El capital inicial a partir del monto final acumulado se calcula mediante $C = \frac{M}{1 + i \cdot t}$.'
al_terminar_debes_poder: 'Calcular el capital inicial $C$ despejando las fórmulas $C = \frac{I}{i \cdot t}$ o $C = \frac{M}{1 + i \cdot t}$.'
