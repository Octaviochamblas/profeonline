semantic_id: MAT.NUM.INTERES_SIMPLE.CAPITAL_INICIAL
resumen_inicial: 'Cálculo del capital inicial en interés simple: concepto y propiedades
  fundamentales en Interés simple.'
explicacion_simple: 'A veces sabes cuánto quieres retirar al final de un plazo y cuánto
  paga el banco, pero la gran pregunta es: ¿Cuánto dinero tengo que meter hoy para
  lograr esa meta? Para eso hay que despejar el Capital Inicial.'
explicacion_formal: "Como $M = C \\cdot (1 + i \\cdot t)$ y $I = C \\cdot i \\cdot\
  \ t$, podemos usar álgebra para encontrar el Capital Inicial ($C$) si nos dan los\
  \ otros datos.\n\n**Caso 1: Te dan el dinero que ganaste (solo intereses $I$)**\n\
  Despejando $C$ de la fórmula chica: \n$C = \\frac{I}{i \\cdot t}$\n\n**Caso 2: Te\
  \ dan el dinero final total de la cuenta ($M$)**\nDespejando $C$ de la fórmula grande\
  \ (el paréntesis pasa dividiendo):\n$C = \\frac{M}{1 + i \\cdot t}$\n*(Este caso\
  \ es muy común en problemas de la PAES).* "
definiciones_clave: '- **Cálculo del capital inicial en interés simple**: Elemento
  central dentro del estudio de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del capital inicial en interés simple.'
ejemplo_guiado:
