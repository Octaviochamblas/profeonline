resumen_inicial: El cálculo del capital inicial $C$ despeja la inversión original
  conocida la ganancia de interés $I$ ($C = \frac{I}{i \cdot t}$) o el monto acumulado
  final $M$ ($C = \frac{M}{1 + i \cdot t}$).
explicacion_simple: Si sabemos cuánto dinero ganamos de interés o cuánto dinero acumulamos
  en total al final del plazo, podemos retroceder para averiguar cuánta plata depositamos
  originalmente al principio.
explicacion_formal: 'Dado el interés $I$ o el monto final $M$, la **Determinación
  del Capital Inicial $C$** se despeja mediante:


  $$\text{Conocido el interés } I: \quad C = \frac{I}{i \cdot t} = \frac{I}{\left(\frac{r}{100}\right)
  \cdot t}$$


  $$\text{Conocido el monto final } M: \quad C = \frac{M}{1 + i \cdot t} = \frac{M}{1
  + \left(\frac{r}{100}\right) \cdot t}$$'
definiciones_clave: '- **Capital inicial $C$**: Inversión original despejada mediante
  $C = \frac{I}{i \cdot t}$ o $C = \frac{M}{1 + i \cdot t}$.'
propiedades_relaciones: '- **Descuento de interés simple**: Actualización del valor
  futuro $M$ al valor presente $C$.'
ejemplo_guiado:
  enunciado: Determine qué capital inicial $C$ se debe depositar al $5\%$ anual de
    interés simple para ganar \$45.000 en $3$ años.
  pasos:
  - 'Paso 1: Identificar $I = 45.000$, $i = 0,05$ y $t = 3$.'
  - 'Paso 2: Aplicar la fórmula $C = \frac{I}{i \cdot t} = \frac{45.000}{0,05 \cdot
    3}$.'
  - 'Paso 3: Resolver la división: $C = \frac{45.000}{0,15} = 300.000$.'
  - 'Conclusión: El capital inicial necesario es \$300.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja el capital inicial C conociendo la ganancia de interés
    I, la tasa i y el tiempo t?
  choices:
  - text: 'Dividiendo el interés entre el producto de la tasa por el tiempo: C = I
      / (i · t)'
    is_correct: true
  - text: Multiplicando C = I · i · t
    is_correct: false
  - text: Restando C = I - i - t
    is_correct: false
  - text: Dividiendo C = (i · t) / I
    is_correct: false
  explanation: 'La alternativa correcta es ''Dividiendo el interés entre el producto
    de la tasa por el tiempo: C = I / (i · t)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para ganar $45.000 al 5% en 3 años, ¿cuál fue el
    capital inicial C necesario?
  choices:
  - text: 300.000 $
    is_correct: true
  - text: 150.000 $
    is_correct: false
  - text: 450.000 $
    is_correct: false
  - text: 200.000 $
    is_correct: false
  explanation: La alternativa correcta es '300.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el capital inicial $C
  = \frac{I}{i \cdot t}$ o $C = \frac{M}{1 + i \cdot t}$ despejando la inversión presente.
semantic_id: MAT.NUM.INTERES_SIMPLE.CAPITAL_INICIAL
procedimiento:
- 'Paso 1: Identificar los parámetros conocidos ($C, i, t, I, M$) e igualar las unidades
  de tiempo de la tasa y el plazo.'
- 'Paso 2: Sustituir en la fórmula fundamental del interés simple $I = C \cdot i \cdot
  t$ o del monto $M = C \cdot (1 + i \cdot t)$.'
- 'Paso 3: Despejar algebraicamente la variable buscada y comprobar el resultado numérico.'
errores_correccion: '- **Error 1: Ingresar el tiempo en meses cuando la tasa de interés
  es anual sin convertir unidades.** **Cómo corregirlo:** Se DEBE convertir el tiempo
  a años dividiendo entre 12 ($18\text{ meses} = 1,5\text{ años}$) o convertir la
  tasa anual a mensual dividiendo entre 12.


  - **Error 2: Sumar los intereses acumulados al capital inicial en cada período (tratarlo
  como interés compuesto).** **Cómo corregirlo:** En el interés simple el capital
  inicial $C$ permanece CONSTANTE en todos los períodos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_SIMPLE.CAPITAL_INICIAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés simple.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización lineal.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por $M = C(1 + it)$.
- titulo: ¿Son idénticos los intereses ganados en cada período en el interés simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se calculan siempre sobre el mismo capital inicial $C$.
- titulo: ¿Debe coincidir la unidad de tiempo del plazo t con la unidad de la tasa
    de interés i?
  respuesta: Sí
  solucion_pasos:
  - Sí, para mantener la homogeneidad dimensional temporal.
errores_frecuentes:
- Ingresar el tiempo en meses manteniendo una tasa de interés expresada en términos
  anuales.
- Recapitalizar los intereses ganados al final de cada período sobre el capital inicial
  en régimen simple.
- Multiplicar por el número entero de la tasa de interés sin dividir previamente por
  cien.
- Declarar el valor del interés ganado $I$ con el monto final total acumulado $M$.
- Dividir el capital entre el tiempo sin incorporar la tasa de interés en el cálculo
  del saldo.
afirmaciones_verdaderas:
- El interés simple se caracteriza por generar ganancias periódicas constantes calculadas
  sobre el capital inicial $C$.
- El monto acumulado final en interés simple es una función lineal del tiempo $M =
  C \cdot (1 + i \cdot t)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
