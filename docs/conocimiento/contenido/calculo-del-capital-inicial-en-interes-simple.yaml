  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lee cuidadosamente si el dinero que te dan es el ''interés generado'' o ''el total
  en la cuenta''.'
- 'Paso 2: Convierte la tasa a decimal y asegúrate de que el tiempo esté en la misma unidad.'
- 'Paso 3: Divide el dato por $(i \cdot t)$ o por $(1 + i \cdot t)$ según corresponda.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del capital
  inicial en interés simple.
ejemplos:
- titulo: Meta de ahorro
  enunciado: Al cabo de 5 años, una inversión a interés simple del 4% anual se convirtió en
    un total de $3.600.000. ¿Cuánto se invirtió inicialmente?
  solucion_pasos:
  - Es el total, usamos $C = M / (1 + i \cdot t)$.
  - $M = 3.600.000$, $i = 0.04$, $t = 5$.
  - 'Denominador: $1 + (0.04 \cdot 5) = 1 + 0.20 = 1.20$.'
  - $C = 3.600.000 / 1.20 = 3.000.000$. Se invirtieron 3 millones.
- titulo: Ejemplo 2
  enunciado: Un interés de 600 pesos se generó en 3 años al 4% anual. ¿Cuál fue el capital
    inicial?
  alternativas:
  - '5.000'
  - '1.800'
  - '7.200'
  respuesta: '5.000'
  solucion_pasos:
  - 600 dividido entre (0,04 por 3) es igual a 600 dividido entre 0,12, o sea 5.000.
- titulo: Ejemplo 3
  enunciado: Un monto final de 13.200 pesos se logró en 4 años al 8% anual. ¿Cuál fue el capital
    inicial?
  alternativas:
  - '10.000'
  - '12.144'
  - '1.056'
  respuesta: '10.000'
  solucion_pasos:
  - 13.200 dividido entre (1 más 0,08 por 4) es igual a 13.200 dividido entre 1,32, o sea
    10.000.
- titulo: ¿La fórmula para hallar C a partir del Monto Final es distinta a la que usa el interés
    puro I?
  respuesta: Sí
  solucion_pasos:
  - Una usa (1 más i por t) como denominador y la otra usa solo (i por t).
errores_frecuentes:
- Restar los intereses al Monto usando la tasa sobre el Monto Final (¡Los intereses siempre
  se calculan sobre el capital inicial desconocido, por eso hay que usar división!).
- Dividir el Monto $M$ solo por $(i \cdot t)$, confundiendo las fórmulas.
- Restar los intereses al Monto usando la tasa sobre el Monto Final en vez de sobre el capital
  inicial desconocido.
- Dividir el Monto M solo por (i por t), confundiendo la fórmula del monto final con la del
  interés puro.
- Confundir cuál dato del problema corresponde al interés I y cuál al monto final M.
afirmaciones_verdaderas:
- La propiedad de cálculo del capital inicial en interés simple preserva la consistencia lógica.
- Para despejar el capital inicial se debe identificar primero si el dato conocido es el interés
  puro (I) o el monto final total (M), ya que cada caso usa una fórmula distinta.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del capital inicial
  en interés simple.
