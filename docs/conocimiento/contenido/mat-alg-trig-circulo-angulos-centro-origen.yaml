semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.CENTRO_ORIGEN
resumen_inicial: 'Ubicación del círculo unitario con centro en el origen del plano
  cartesiano: círculo unitario, amplitud, período y transformaciones de Círculo unitario
  y sistemas de medida.'
explicacion_simple: Todo ángulo trigonométrico se construye desde un mismo punto fijo,
  el origen, que actúa como vértice común para comparar cualquier ángulo.
explicacion_formal: '### Definición formal


  En el sistema de coordenadas del círculo unitario, todo ángulo $\theta$ tiene su
  vértice en el origen $(0,0)$. Un lado del ángulo, llamado lado inicial, coincide
  siempre con el semieje positivo $x$; el otro lado, llamado lado terminal, gira alrededor
  del origen según el valor de $\theta$.


  ### Desarrollo didáctico


  Para representar un ángulo de $90°$, se traza el lado inicial sobre el semieje positivo
  $x$ y se gira el lado terminal en sentido antihorario hasta alinearlo con el semieje
  positivo $y$, siempre pivotando alrededor del origen.'
definiciones_clave: '- **Ubicación del círculo unitario con centro en el origen del
  plano cartesiano**: Función periódica fundamentada en las coordenadas del círculo
  unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a ubicación del círculo unitario con centro en el origen del plano cartesiano.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    ubicación del círculo unitario con centro en el origen del plano cartesiano.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de ubicación del círculo unitario con centro en el origen
    del plano cartesiano.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
