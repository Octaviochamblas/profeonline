semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.CENTRO_ORIGEN
resumen_inicial: 'Ubicación del círculo unitario centrado en el origen $(0,0)$ del plano cartesiano como sistema de referencia goniométrico.'
explicacion_simple: |
  Para que los ángulos y las razones trigonométricas tengan un punto de partida estándar en todo el mundo, la circunferencia de radio 1 se dibuja con su centro fijado exactamente en el origen del plano cartesiano, el punto $(0,0)$. Esto hace que la circunferencia cruce los ejes principales en cuatro puntos fundamentales: en la derecha $(1,0)$, arriba $(0,1)$, a la izquierda $(-1,0)$ y abajo $(0,-1)$. Al estar centrada en $(0,0)$, medir ángulos desde el eje positivo de las $x$ resulta muy sencillo e intuitivo.
explicacion_formal: |
  ### Definición formal
  La **centración cartesiana del círculo unitario** establece que el centro geométrico de la circunferencia de radio $r = 1$ coincide con el origen de coordenadas $O(0,0)$ en el espacio euclídeo $\mathbb{R}^2$:
  $$\mathcal{C} = \{(x,y) \in \mathbb{R}^2 : (x - 0)^2 + (y - 0)^2 = 1^2\} \implies x^2 + y^2 = 1$$

  ### Desglose simbólico
  - $O(0,0)$: Origen del sistema de coordenadas cartesianas perpendiculares $X$ e $Y$.
  - Intersecciones con los ejes principales:
    - Eje $+X$: Punto $(1, 0)$
    - Eje $+Y$: Punto $(0, 1)$
    - Eje $-X$: Punto $(-1, 0)$
    - Eje $-Y$: Punto $(0, -1)$

  ### Síntesis didáctica
  Fijar el centro del círculo unitario en el origen elimina cualquier desplazamiento indeseado. Garantiza que la distancia euclidiana de cualquier punto del círculo al origen sea siempre $d(O, P) = \sqrt{x^2 + y^2} = 1$, estableciendo la base para medir componentes horizontales ($\cos \theta$) y componentes verticales ($\sin \theta$).
definiciones_clave: |
  - **Origen cartesiano**: Punto $O(0,0)$ donde se cruzan de forma perpendicular los ejes $X$ e $Y$.
  - **Intersecciones cuadrantales**: Los cuatro puntos $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$ donde la circunferencia corta a los ejes coordenados.
  - **Distancia euclidiana al origen**: Magnitud constante $\sqrt{x^2+y^2} = 1$ para todo punto perteneciente a la circunferencia.
propiedades_relaciones: |
  - **Simetría respecto al origen**: Si $(x,y)$ pertenece al círculo unitario, su punto opuesto simétrico $(-x,-y)$ también pertenece al círculo unitario.
  - **Simetrías axiales**: La curva presenta simetría par respecto al eje $Y$ (si $(x,y)$ está en el círculo, $(-x,y)$ también lo está) y respecto al eje $X$ (si $(x,y)$ está, $(x,-y)$ también).
ejemplo_guiado:
  enunciado: 'Determina las coordenadas del punto de intersección del círculo unitario con el eje Y negativo y calcula su distancia al origen $O(0,0)$.'
  pasos:
    - 'Paso 1: Sobre el eje Y negativo, la abscisa es cero ($x = 0$) y la ordenada es negativa ($y < 0$).'
    - 'Paso 2: Sustituir $x = 0$ en la ecuación $x^2 + y^2 = 1 \implies 0^2 + y^2 = 1 \implies y^2 = 1$.'
    - 'Paso 3: Al tomar la solución negativa se obtiene $y = -1$. El punto de intersección es $(0, -1)$.'
    - 'Paso 4: Calcular la distancia al origen: $d = \sqrt{0^2 + (-1)^2} = \sqrt{1} = 1$. La distancia confirma el radio unitario.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son los cuatro puntos donde el círculo unitario corta a los ejes cartesianos?'
    choices:
      - {text: '$(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$', is_correct: true}
      - {text: '$(1,1)$, $(-1,1)$, $(-1,-1)$ y $(1,-1)$', is_correct: false}
      - {text: '$(2,0)$, $(0,2)$, $(-2,0)$ y $(0,-2)$', is_correct: false}
      - {text: '$(0,0)$, $(1,0)$, $(0,1)$ y $(1,1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$''. Corresponden a los puntos a distancia 1 del origen sobre los cuatro semiejes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un punto $P(x,y)$ pertenece al círculo unitario centrado en $(0,0)$, ¿cuál es el valor de la distancia $\sqrt{x^2 + y^2}$?'
    choices:
      - {text: 'Exactamente 1', is_correct: true}
      - {text: 'Depende del ángulo $\theta$', is_correct: false}
      - {text: 'Cero', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente 1''. Por definición, el radio del círculo unitario centrado en $(0,0)$ es siempre $r = 1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Situar el centro de la circunferencia en las coordenadas del origen $O(0,0)$.'
  - 'Paso 2: Medir un radio de longitud $r = 1$ en todas las direcciones del plano.'
  - 'Paso 3: Marcar los cuatro puntos cardinales de cruce sobre los ejes: $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$.'
  - 'Paso 4: Utilizar la constante de distancia $d = 1$ al origen para relacionar las componentes $x$ e $y$.'
errores_correccion: |
  - **Error 1:** Creer que el círculo unitario puede estar centrado en un punto arbitrario como $(1,1)$. **Cómo corregirlo:** La definición estándar de la trigonometría goniométrica exige que el centro esté ubicado exactamente en el origen $O(0,0)$ para que el radio coincida con la distancia al origen.
  - **Error 2:** Confundir los puntos de intersección axial colocando la coordenada $1$ en el eje equivocado. **Cómo corregirlo:** En el eje $X$ las ordenadas valen cero ($(1,0)$ y $(-1,0)$); en el eje $Y$ las abscisas valen cero ($(0,1)$ y $(0,-1)$).
ejemplos:
  - titulo: 'Intersección con el semieje positivo X'
    enunciado: '¿En qué punto del semieje $X$ positivo intersecta el círculo unitario al eje cartesiano?'
    alternativas:
      - 'En el punto de coordenadas $(1, 0)$'
      - 'En el punto de coordenadas $(0, 1)$'
      - 'En el punto de coordenadas $(1, 1)$'
    respuesta: 'En el punto de coordenadas $(1, 0)$'
    solucion_pasos:
      - '1. En el semieje $X$ positivo, $y = 0$ y $x > 0$.'
      - '2. Reemplazando en $x^2 + 0^2 = 1 \implies x = 1$.'
      - '3. El punto es $(1, 0)$.'
  - titulo: 'Simetría de punto respecto al origen'
    enunciado: 'Si el punto $P\left(\frac{3}{5}, \frac{4}{5}\right)$ está en el círculo unitario, ¿el punto $-P\left(-\frac{3}{5}, -\frac{4}{5}\right)$ también pertenece a él?'
    alternativas:
      - 'Sí, por la simetría central respecto al origen $(0,0)$'
      - 'No, las coordenadas negativas cambian el radio'
      - 'No, solo los puntos del primer cuadrante pertenecen'
    respuesta: 'Sí, por la simetría central respecto al origen $(0,0)$'
    solucion_pasos:
      - '1. Evaluamos $\left(-\frac{3}{5}\right)^2 + \left(-\frac{4}{5}\right)^2 = \frac{9}{25} + \frac{16}{25} = 1$.'
      - '2. Mantiene la misma distancia 1 al origen.'
  - titulo: 'Punto central fuera del círculo'
    enunciado: '¿El origen $(0,0)$ pertenece a la circunferencia del círculo unitario?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, porque el centro es el punto $(0,0)$ y su distancia a la circunferencia es $r = 1 \neq 0$.'
  - titulo: 'Intersección en el semieje positivo Y'
    enunciado: '¿La intersección del círculo unitario con el semieje positivo Y es el punto $(0,1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el semieje Y positivo $x = 0$ e $y = 1$, cumpliendo $0^2 + 1^2 = 1$.'
errores_frecuentes:
  - 'La afirmación de que el centro del círculo unitario se encuentra desplazado en el punto $(1,1)$.'
  - 'La afirmación de que la intersección del círculo unitario con el eje Y positivo ocurre en el punto $(1,0)$.'
  - 'La afirmación de que el origen $(0,0)$ es un punto perteneciente a la curva del círculo unitario.'
  - 'La afirmación de que la distancia desde el origen al punto $(-1,0)$ es igual a $-1$.'
  - 'La afirmación de que los ejes cartesianos cortan al círculo unitario en ocho puntos diferentes.'
afirmaciones_verdaderas:
  - 'El centro del círculo unitario se encuentra posicionado exactamente en el origen de coordenadas $O(0,0)$.'
  - 'La circunferencia del círculo unitario corta a los ejes cartesianos en los puntos $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$.'
al_terminar_debes_poder: |
  QUÉ: Ubicar e interpretar el círculo unitario centrado en el origen cartesiano $(0,0)$.
  CÓMO: Identificar las cuatro intersecciones axiales $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$ y la constancia de la distancia al origen.
