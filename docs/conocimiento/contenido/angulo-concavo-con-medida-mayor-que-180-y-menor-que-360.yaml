semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.CONCAVO
resumen_inicial: Un ángulo cóncavo (o reflejo) es aquel cuya medida es estrictamente
  mayor que 180° y menor que 360°, superando la abertura de una línea recta.
explicacion_simple: '![Ángulo Cóncavo](/static/img/nodos/angulo-concavo-con-medida-mayor-que-180-y-menor-que-360-intro.svg)


  Cuando abres un abanico más allá de una línea recta horizontal hasta casi cerrar
  el círculo completo, la abertura exterior formada es mayor a 180°. Este tipo de
  ángulo se llama cóncavo, reflejo o entrante.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **cóncavo** (o reflejo) si su medida angular $\alpha$
  es estrictamente mayor que un ángulo extendido ($180^\circ$) y menor que una vuelta
  completa ($360^\circ$):


  $$180^\circ < \mu(\angle AOB) < 360^\circ \iff \pi < \alpha < 2\pi \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha \in (180^\circ, 360^\circ)$: Intervalo de ángulos cóncavos en el plano.

  - No convexidad: El segmento que une dos puntos interiores puede quedar fuera del
  ángulo.

  - Ángulo conjugado: Todo ángulo cóncavo posee un ángulo convexo conjugado tal que
  $\alpha + \alpha_{\text{conv}} = 360^\circ$.


  ### Síntesis didáctica

  Los ángulos cóncavos aparecen en polígonos no convexos (o cóncavos) y representan
  rotaciones superiores a media vuelta en cinemática y navegación.'
definiciones_clave: '- **Ángulo cóncavo**: Ángulo con medida en el intervalo abierto
  $(180^\circ, 360^\circ)$.

  - **Ángulos conjugados**: Pareja de ángulos cuya suma conforma un giro completo
  de $360^\circ$. '
propiedades_relaciones: '- **No convexidad**: Existen pares de puntos dentro de la
  región angular cuyo segmento de unión queda fuera del ángulo.

  - **Relación conjugada**: Si el ángulo interior convexo es $\alpha$, el ángulo cóncavo
  exterior es $360^\circ - \alpha$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Cóncavo](/static/img/nodos/angulo-concavo-con-medida-mayor-que-180-y-menor-que-360-ejemplos.svg)


    Dos rayos $\vec{OA}$ y $\vec{OB}$ forman un ángulo agudo interior de $50^\circ$.
    Determina la medida del ángulo cóncavo exterior formado por los mismos dos rayos
    y clasifícalo.'
  pasos:
  - 'Paso 1: Reconocer que la rotación completa alrededor del vértice $O$ suma $360^\circ$.'
  - 'Paso 2: Restar el ángulo interior agudo: $\theta = 360^\circ - 50^\circ = 310^\circ$.'
  - 'Paso 3: Verificar que $180^\circ < 310^\circ < 360^\circ$.'
  - 'Paso 4: Concluir que $\theta = 310^\circ$ es un ángulo cóncavo (o reflejo).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes medidas corresponde a un ángulo cóncavo?
  choices:
  - text: Un ángulo de 250°
    is_correct: true
  - text: Un ángulo de 150°
    is_correct: false
  - text: Un ángulo de 90°
    is_correct: false
  - text: Un ángulo de 180°
    is_correct: false
  explanation: Por cumplir 180° < 250° < 360°, un ángulo de 250° es un ángulo cóncavo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ángulo convexo interior mide 100°, ¿cuánto mide su ángulo cóncavo
    conjugado exterior?
  choices:
  - text: 260° (porque 360° - 100° = 260°)
    is_correct: true
  - text: 80°
    is_correct: false
  - text: 180°
    is_correct: false
  - text: 280°
    is_correct: false
  explanation: El ángulo conjugado exterior se calcula como 360° - 100° = 260°, el
    cual es cóncavo (260° (porque 360° - 100° = 260°)).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o calcular la abertura angular exterior $\theta$.'
- 'Paso 2: Comprobar que $\theta$ cumple $180^\circ < \theta < 360^\circ$.'
- 'Paso 3: Clasificar como ángulo cóncavo o reflejo.'
errores_correccion: No confundas el ángulo interior menor a 180° con el ángulo exterior
  cóncavo que supera los 180°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes ángulos es cóncavo?
  alternativas:
  - $210^\circ$
  - $170^\circ$
  - $90^\circ$
  respuesta: $210^\circ$
  solucion_pasos:
  - $210^\circ$ es mayor que $180^\circ$ y menor que $360^\circ$, por lo tanto es
    cóncavo.
- titulo: Ejemplo 2
  enunciado: Si un ángulo cóncavo mide $300^\circ$, ¿cuánto mide su ángulo convexo
    conjugado?
  alternativas:
  - $60^\circ$
  - $90^\circ$
  - $120^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $360^\circ - 300^\circ = 60^\circ$ (un ángulo agudo).
- titulo: ¿Un ángulo de 200° es un ángulo cóncavo?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque 200° es estrictamente mayor que 180° y menor que 360°.
- titulo: ¿Un ángulo de 180° es cóncavo?
  respuesta: 'No'
  solucion_pasos:
  - No, 180° exactos es un ángulo extendido o llano.
errores_frecuentes:
- Confundir ángulos cóncavos ($>180^\circ$) con ángulos obtusos ($90^\circ < \theta
  < 180^\circ$).
- Medir por error el ángulo interior agudo/obtuso en vez del arco exterior solicitado.
- Incluir 180° o 360° en la clasificación de cóncavos.
- Olvidar que todo ángulo cóncavo suma 360° con su contraparte convexa.
- Usar el término "cóncavo" para referirse a ángulos menores que 90°.
afirmaciones_verdaderas:
- Un ángulo cóncavo mide más de $180^\circ$ y menos de $360^\circ$.
- Todo ángulo cóncavo tiene un ángulo conjugado convexo con el que suma $360^\circ$.
al_terminar_debes_poder: '**QUÉ:** Identificar, calcular y clasificar ángulos cóncavos
  (reflejos) de medida entre $180^\circ$ y $360^\circ$.


  **CÓMO:** Verificando la desigualdad $180^\circ < \theta < 360^\circ$ y aplicando
  relaciones de ángulos conjugados $\theta + \alpha = 360^\circ$.


  ![Resumen de Ángulo Cóncavo](/static/img/nodos/angulo-concavo-con-medida-mayor-que-180-y-menor-que-360-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
