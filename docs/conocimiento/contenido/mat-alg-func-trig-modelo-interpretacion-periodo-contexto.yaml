semantic_id: MAT.ALG.FUNC_TRIG_MODELO.INTERPRETACION_PERIODO_CONTEXTO
resumen_inicial: 'Interpretación contextual del período en un modelo trigonométrico:
  círculo unitario, amplitud, período y transformaciones de Modelamiento trigonométrico
  y extensiones.'
explicacion_simple: El periodo de un modelo de contexto tiene unidades reales, como
  horas o días, y representa cuánto tiempo pasa antes de que el fenómeno repita su
  comportamiento.
explicacion_formal: '### Definición formal


  Si un fenómeno tarda $T$ unidades de tiempo en repetir exactamente su comportamiento,
  el periodo del modelo trigonométrico correspondiente es $T$, y el parámetro $b$
  se calcula como $b=2\pi/T$.


  ### Desarrollo didáctico


  Las mareas suben y bajan completando un ciclo aproximadamente cada $12{,}4$ horas:
  ese es el periodo del modelo. Para construir el modelo, se calcula $b=2\pi/12{,}4\approx0{,}507$.'
definiciones_clave: '- **Interpretación contextual del período en un modelo trigonométrico**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a interpretación contextual del período en un modelo trigonométrico.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    interpretación contextual del período en un modelo trigonométrico.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de interpretación contextual del período en un modelo
    trigonométrico.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
