procedimiento:
- 'Paso 1: Identifica el tiempo (o distancia) que tarda el fenómeno en repetir su
  comportamiento.'
- 'Paso 2: Ese valor es el periodo $T$ del modelo.'
- 'Paso 3: Calcula $b=2\pi/T$ si se necesita construir la función completa.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en interpretación contextual
  del período en un modelo trigonométrico.
ejemplos:
- titulo: Identificación del periodo a partir de una descripción
  enunciado: Un ciclo respiratorio completo dura $4$ segundos. ¿Cuál es el periodo
    del modelo correspondiente?
  solucion_pasos:
  - Se identifica directamente el tiempo del ciclo completo.
  - El periodo es $T=4$ segundos.
- titulo: Cálculo de $b$ a partir del periodo
  enunciado: Si el periodo de un fenómeno es $T=8$ horas, calcula $b$.
  solucion_pasos:
  - 'Se aplica la fórmula: $b=2\pi/8=\pi/4$.'
  - El valor de $b$ es $\pi/4$.
- titulo: ¿El periodo puede expresarse en unidades distintas de tiempo?
  enunciado: ¿El periodo de un modelo de contexto puede expresarse en unidades distintas
    al tiempo, como distancia?
  respuesta: Sí
  solucion_pasos:
  - Depende de la variable independiente del modelo; puede ser tiempo, distancia u
    otra magnitud continua.
- titulo: ¿Un periodo más corto implica un fenómeno que oscila más rápido?
  enunciado: ¿Un periodo más corto significa que el fenómeno completa sus ciclos más
    rápidamente?
  respuesta: Sí
  solucion_pasos:
  - A menor tiempo para completar un ciclo, más rápida es la oscilación del fenómeno.
errores_frecuentes:
- Confundir el periodo con la amplitud del modelo.
- Calcular mal el valor de $b$ a partir del periodo, invirtiendo la fórmula.
- No identificar correctamente cuánto tiempo tarda un ciclo completo, confundiéndolo
  con medio ciclo.
- Ignorar las unidades del periodo al interpretar el resultado en contexto.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_ponder: Analizar, graficar y modelar fenómenos periódicos aplicando
  interpretación contextual del período en un modelo trigonométrico.
