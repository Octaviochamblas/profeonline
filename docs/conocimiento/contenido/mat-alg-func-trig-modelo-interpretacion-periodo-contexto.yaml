semantic_id: MAT.ALG.FUNC_TRIG_MODELO.INTERPRETACION_PERIODO_CONTEXTO
resumen_inicial: 'Interpretación contextual del período $T = \frac{2\pi}{|B|}$ como la duración temporal o espacial de un ciclo completo de repetición.'
explicacion_simple: |
  En problemas del mundo real, el **período** ($T$) es el tiempo o la distancia que se necesita para que todo el proceso vuelva exactamente al punto de partida. Si modelas las estaciones del año, el período es $12$ meses. Si modelas un latido del corazón, el período puede ser $0.8$ segundos. Si modelas las vueltas de una rueda de bicicleta, el período es la distancia de una vuelta completa. En la ecuación $y(t) = A\sin(Bt + C) + D$, el período no es directamente el número $B$, sino que se calcula dividiendo $2\pi$ entre $B$ ($T = \frac{2\pi}{|B|}$).
explicacion_formal: |
  ### Definición formal
  En un modelo trigonométrico contextual $y(t) = A\sin(Bt + C) + D$ o $y(t) = A\cos(Bt + C) + D$, el **período contextual $T$** es la constante real positiva de tiempo (o distancia):
  $$T = \frac{2\pi}{|B|}$$
  que representa el **intervalo mínimo de tiempo (o espacio)** necesario para que el sistema complete un ciclo u oscilación integral y retorne al mismo estado físico con la misma tendencia de cambio.

  ### Desglose simbólico
  - Unidades físicas: Posee las unidades de la **variable independiente $t$** (ejemplo: segundos, minutos, horas, días, meses, metros).
  - Frecuencia del fenómeno: La cantidad de ciclos por unidad de tiempo es $f = \frac{1}{T} = \frac{|B|}{2\pi}$.

  ### Síntesis didáctica
  El período da sentido temporal al modelo. Nos indica "cada cuánto tiempo ocurre todo de nuevo". Para calcular $T$ a partir de la fórmula algebraica, aislamos el coeficiente $B$ y resolvemos $T = \frac{2\pi}{|B|}$.
definiciones_clave: |
  - **Período contextual ($T$)**: Tiempo o espacio completo empleado en ejecutar una oscilación o ciclo entero.
  - **Ciclo completo en contexto**: Secuencia completa de eventos desde un pico hasta el siguiente pico equivalente.
  - **Frecuencia temporal ($f = \frac{1}{T}$)**: Número de repeticiones del evento ocurridas en una unidad de tiempo.
propiedades_relaciones: |
  - **Independencia de la magnitud de variación**: La duración del período $T$ es independiente de la amplitud $|A|$ y de la línea media $D$.
  - **Relación con la velocidad angular**: Si el fenómeno proviene de un movimiento circular, $B = \omega$ representa la velocidad de rotación en radianes por unidad de tiempo.
ejemplo_guiado:
  enunciado: 'La altura de la marea en un puerto se modela mediante $h(t) = 2.5\sin\left(\frac{\pi}{6}t\right) + 4$, donde $h$ es la altura en metros y $t$ es el tiempo en horas. Calcula e interpreta el período del fenómeno.'
  pasos:
    - 'Paso 1: Identificar el coeficiente multiplicativo de la variable temporal $t$: $B = \frac{\pi}{6}$.'
    - 'Paso 2: Aplicar la fórmula del período contextual: $T = \frac{2\pi}{|B|} = \frac{2\pi}{\frac{\pi}{6}}$.'
    - 'Paso 3: Resolver la división: $T = 2\pi \cdot \frac{6}{\pi} = 12$ horas.'
    - 'Paso 4: Interpretar el resultado en su contexto: La marea realiza un ciclo completo de subida y bajada cada $12$ horas (habiendo dos pleamares al día).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la corriente eléctrica en un circuito oscila según $I(t) = 10\cos(100\pi t)$ (con $t$ en segundos), ¿cuánto tarda la corriente en completar un ciclo entero?'
    choices:
      - {text: '$0.02$ segundos (o $\frac{1}{50}$ s)', is_correct: true}
      - {text: '$100$ segundos', is_correct: false}
      - {text: '$50$ segundos', is_correct: false}
      - {text: '$2\pi$ segundos', is_correct: false}
    explanation: 'La alternativa correcta es ''$0.02$ segundos (o $\frac{1}{50}$ s)''. $T = \frac{2\pi}{100\pi} = \frac{1}{50} = 0.02$ segundos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un respirador médico, el volumen de aire en los pulmones oscila con un período de $4$ segundos. ¿Cuál es el valor de la frecuencia angular $B$ en el modelo senoidal?'
    choices:
      - {text: '$B = \frac{\pi}{2}$', is_correct: true}
      - {text: '$B = 4$', is_correct: false}
      - {text: '$B = 2\pi$', is_correct: false}
      - {text: '$B = \frac{\pi}{4}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$B = \frac{\pi}{2}$''. Despejando $B$: $B = \frac{2\pi}{T} = \frac{2\pi}{4} = \frac{\pi}{2}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable independiente del contexto (usualmente tiempo $t$ o distancia $x$).'
  - 'Paso 2: Extraer el coeficiente multiplicativo $B$ de la variable independiente.'
  - 'Paso 3: Calcular el período mediante $T = \frac{2\pi}{|B|}$.'
  - 'Paso 4: Redactar la conclusión contextual declarando que el fenómeno repite su ciclo completo cada $T$ unidades de tiempo o espacio.'
errores_correccion: |
  - **Error 1:** Afirmar que el parámetro $B$ de la fórmula es directamente el período del fenómeno. **Cómo corregirlo:** El parámetro $B$ es la frecuencia angular. El período temporal es el cociente $T = \frac{2\pi}{|B|}$.
  - **Error 2:** Asignar a $T$ las unidades de la variable de salida (como metros o voltios). **Cómo corregirlo:** El período $T$ se mide en el eje horizontal del tiempo o espacio, por lo que lleva unidades temporales (segundos, horas) o espaciales (metros).
ejemplos:
  - titulo: 'Período en modelo de luz solar'
    enunciado: 'En el modelo de horas de luz solar $L(t) = 3\sin\left(\frac{2\pi}{365}t\right) + 12$ (con $t$ en días), ¿cuál es el período del fenómeno?'
    alternativas:
      - '$365$ días (1 año)'
      - '$12$ días'
      - '$3$ días'
    respuesta: '$365$ días (1 año)'
    solucion_pasos:
      - '1. $B = \frac{2\pi}{365}$.'
      - '2. $T = \frac{2\pi}{2\pi/365} = 365$ días.'
  - titulo: 'Frecuencia de latidos cardíacos'
    enunciado: 'Si un corazón latiente tiene un período de $T = 0.75$ segundos, ¿cuántos latidos realiza por minuto?'
    alternativas:
      - '$80$ latidos por minuto'
      - '$60$ latidos por minuto'
      - '$75$ latidos por minuto'
    respuesta: '$80$ latidos por minuto'
    solucion_pasos:
      - '1. Latidos por segundo $= \frac{1}{0.75} = \frac{4}{3}$.'
      - '2. Latidos por minuto $= \frac{4}{3} \times 60 = 80$ latidos/min.'
  - titulo: 'Unidades del período'
    enunciado: '¿El período en un modelo de oscilación marina en función del tiempo en minutos se expresa en minutos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el período hereda las unidades de la variable independiente del tiempo.'
  - titulo: 'Constancia temporal'
    enunciado: '¿El tiempo que tarda una rueda en dar una vuelta a velocidad constante cambia de una vuelta a la otra?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la velocidad constante garantiza un período $T$ rigurosamente constante.'
errores_frecuentes:
  - 'La afirmación de que el coeficiente $B$ en un modelo de contexto representa directamente el tiempo en horas que dura un ciclo.'
  - 'La afirmación de que el período $T$ se mide en las mismas unidades que la amplitud del fenómeno.'
  - 'La afirmación de que el desplazamiento de la línea media $D$ altera el número de horas que tarda en completarse un ciclo.'
  - 'La afirmación de que si $B$ aumenta, el período temporal $T$ del fenómeno se vuelve más largo.'
  - 'La afirmación de que el período de una onda senoidal en un contexto real depende de la condición de inicio $C$.'
afirmaciones_verdaderas:
  - 'El período contextual $T = \frac{2\pi}{|B|}$ representa el intervalo de tiempo o espacio necesario para que un fenómeno complete un ciclo u oscilación entera.'
  - 'El período se expresa en las unidades de la variable independiente del modelo (segundos, horas, meses) y es independiente de la amplitud y del desplazamiento vertical.'
al_terminar_debes_poder: |
  QUÉ: Interpretar el significado físico del período $T$ en modelos trigonométricos aplicados.
  CÓMO: Evaluar el cociente $T = \frac{2\pi}{|B|}$ y explicar el valor resultante como la duración temporal o espacial de una oscilación completa.
