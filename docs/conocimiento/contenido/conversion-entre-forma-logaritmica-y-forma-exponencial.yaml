semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.EQUIVALENCIA_EXPONENCIAL
resumen_inicial: La conversión entre forma logarítmica y forma exponencial establece la equivalencia $\log_b(a) = c \Longleftrightarrow b^c = a$, transformando expresiones con logaritmos en ecuaciones de potencias y viceversa para despejar incógnitas.
explicacion_simple: "![La conversión entre forma logarítmica y forma exponencial establece la equivalencia $\\log_b(a) = c \\Longleftrightarrow b^c = a$, transformando expresiones con logaritmos en ecuaciones de potencias y viceversa para despejar incógnitas](/static/img/nodos/conversion-entre-forma-logaritmica-y-forma-exponencial-intro.svg)\n\n\nLa **forma logarítmica** y la **forma exponencial** son dos caras de la misma moneda:\n\n- **El truco de la base que empuja:**\n  $$\\log_{\\mathbf{b}}(a) = c \\quad \\Longleftrightarrow \\quad a = \\mathbf{b}^c$$\n  - La base $b$ empuja hacia el otro lado y se lleva a $c$ al exponente.\n- **Ejemplos de ida y vuelta:**\n  - $\\log_2(16) = 4 \\quad \\Longleftrightarrow \\quad 2^4 = 16$.\n  - $\\log_3(9) = 2 \\quad \\Longleftrightarrow \\quad 3^2 = 9$.\n  - $10^3 = 1000 \\quad \\Longleftrightarrow \\quad \\log_{10}(1000) = 3$.\n  - $5^{-1} = 0,2 \\quad \\Longleftrightarrow \\quad \\log_5(0,2) = -1$."
explicacion_formal: 'Dada la correspondencia biunívoca entre el semigrupo multiplicativo $\mathbb{R}^+$ y el grupo aditivo $\mathbb{R}$ inducida por la base $b \in \mathbb{R}^+ \setminus \{1\}$, el **isomorfismo de coordenadas** se enuncia como:

  $$\mathcal{E}: (b, c, a) \in (\mathbb{R}^+ \setminus \{1\}) \times \mathbb{R} \times \mathbb{R}^+ \implies \left[ \log_b(a) = c \iff b^c = a \right]$$


  **Mapeo de elementos**:

  1. **Base**: Permanece idéntica en ambas formas ($b$).

  2. **Exponente**: Es el valor aislado en la forma logarítmica ($c = \log_b(a)$).

  3. **Potencia / Argumento**: Es el valor evaluado en la forma exponencial ($a = b^c$).'
definiciones_clave: '- **Forma logarítmica**: Expresión donde el exponente está despejado como $\log_b(a) = c$.

  - **Forma exponencial**: Expresión donde la potencia está evaluada como $b^c = a$.'
propiedades_relaciones: '- **Despeje algebraico de incógnitas**: Si la incógnita está en el argumento, se pasa a exponencial ($a = b^c$); si está en el exponente, se pasa a logarítmica ($c = \log_b(a)$).

  - **Invarianza de base**: La base nunca cambia de número durante la conversión.'
ejemplo_guiado:
  enunciado: '![Ejemplo La conversión entre forma logarítmica y forma exponencial establece la equivalencia $\log_b(a) = c \Longleftrightarrow b^c = a$, transformando expresiones con logaritmos en ecuaciones de potencias y viceversa para despejar incógnitas](/static/img/nodos/conversion-entre-forma-logaritmica-y-forma-exponencial-ejemplos.svg)



    Realiza las siguientes conversiones:

    1) Convierte a forma exponencial: $\log_6(216) = 3$

    2) Convierte a forma logarítmica: $2^{-4} = \frac{1}{16}$

    3) Despeja $x$ en: $\log_3(x) = 4$'
  pasos:
  - 'Paso 1: Convertir $\log_6(216) = 3$ a forma exponencial:

    - La base es 6, el exponente es 3 y el argumento es 216.

    - **$6^3 = 216$**.'
  - 'Paso 2: Convertir $2^{-4} = 1/16$ a forma logarítmica:

    - La base es 2, el argumento es $1/16$ y el exponente es $-4$.

    - **$\log_2\left(\frac{1}{16}\right) = -4$**.'
  - 'Paso 3: Despejar $x$ en $\log_3(x) = 4$:

    - Pasar a forma exponencial: $x = 3^4$.

    - Calcular: $x = 81$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma exponencial equivalente a $\log_4(x) = 3$?
  choices:
  - text: 4³ = x (por lo tanto x = 64)
    is_correct: true
  - text: x³ = 4
    is_correct: false
  - text: 3⁴ = x
    is_correct: false
  - text: 4 · 3 = x
    is_correct: false
  explanation: La alternativa correcta es '4³ = x (por lo tanto x = 64)'. La base 4 se eleva al resultado 3 para obtener el argumento $x = 4^3 = 64$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se escribe la igualdad $10^{-2} = 0,01$ en forma logarítmica?
  choices:
  - text: log₁₀(0,01) = -2
    is_correct: true
  - text: log₁₀(-2) = 0,01
    is_correct: false
  - text: log₀,₀₁(10) = -2
    is_correct: false
  - text: log₁₀(2) = -0,01
    is_correct: false
  explanation: La alternativa correcta es 'log₁₀(0,01) = -2'. La base es 10, el argumento es 0,01 y el exponente despejado es -2.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con claridad la base $b$, el argumento $a$ y el exponente $c$.'
- 'Paso 2: Para pasar de logarítmica a exponencial, formular la potencia $b^c = a$.'
- 'Paso 3: Para pasar de exponencial a logarítmica, formular el logaritmo $\log_b(a) = c$.'
- 'Paso 4: Verificar la coherencia numérica evaluando la potencia resultante.'
errores_correccion: '- **Error común:** Intercambiar la base con el exponente al convertir (ej: $\log_2(8) = 3 \implies 3^2 = 8$).

  - **Cómo corregirlo:** La base del logaritmo **sigue siendo la base de la potencia**: $\mathbf{2}^3 = 8$.'
ejemplos:
- titulo: 'Ejemplo 1: De logarítmica a exponencial'
  enunciado: 'La forma exponencial de $\log_5(625) = 4$ es:'
  alternativas:
  - 5⁴ = 625
  - 4⁵ = 625
  - 5 · 4 = 20
  - 625⁴ = 5
  respuesta: 5⁴ = 625
  solucion_pasos:
  - 'Paso 1: $\log_5(625) = 4 \iff 5^4 = 625$.'
- titulo: 'Ejemplo 2: De exponencial a logarítmica'
  enunciado: 'La forma logarítmica de $3^5 = 243$ es:'
  alternativas:
  - log₃(243) = 5
  - log₅(243) = 3
  - log₂₄₃(3) = 5
  - log₃(5) = 243
  respuesta: log₃(243) = 5
  solucion_pasos:
  - 'Paso 1: $3^5 = 243 \iff \log_3(243) = 5$.'
- titulo: 'Ejemplo 3: Despeje de base incógnita'
  enunciado: Si $\log_b(49) = 2$, ¿cuánto vale la base $b$ ($b > 0$)?
  alternativas:
  - '7'
  - 49/2
  - '14'
  - 24,5
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: $b^2 = 49 \implies b = \sqrt{49} = 7$.'
- titulo: 'Ejemplo 4: Despeje de argumento'
  enunciado: Si $\log_2(x) = -3$, ¿cuál es el valor de $x$?
  alternativas:
  - 1/8 (o 0,125)
  - '-6'
  - '-8'
  - 1/6
  respuesta: 1/8 (o 0,125)
  solucion_pasos:
  - 'Paso 1: $x = 2^{-3} = 1/2^3 = 1/8$.'
errores_frecuentes:
- Invertir la base y el argumento al formular la potencia.
- Olvidar que la base de la potencia y la del logaritmo deben ser exactamente iguales.
- Asignar signo negativo a la base al convertir logaritmos con resultado negativo.
afirmaciones_verdaderas:
- Toda igualdad logarítmica log_b(a) = c equivale exactamente a la potencia b^c = a.
- La conversión a forma exponencial es el método canónico para despejar incógnitas dentro del argumento logarítmico.
al_terminar_debes_poder: '**QUÉ:** Convertir fluidamente entre la forma logarítmica y la forma exponencial.


  **CÓMO:** Aplicando la equivalencia log_b(a) = c ⟺ b^c = a para despejar bases, exponentes o argumentos.


