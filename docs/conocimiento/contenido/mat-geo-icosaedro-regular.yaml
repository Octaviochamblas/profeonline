semantic_id: MAT.GEO.POLIEDROS_PRISMAS.ICOSAEDRO_REGULAR
resumen_inicial: 'Identificación del icosaedro regular: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'El icosaedro regular es el sólido platónico con más caras: veinte
  triángulos equiláteros idénticos ensamblados formando un cuerpo casi esférico.'
explicacion_formal: '![Icosaedro regular (esquema)](/static/img/geometria/espacio-cuerpos/icosaedro-regular.svg)


  ### Definición formal


  El icosaedro regular es uno de los cinco sólidos platónicos. Tiene 20 caras (todas
  triángulos equiláteros congruentes), 12 vértices y 30 aristas. En cada vértice concurren
  exactamente 5 caras.


  ### Desarrollo didáctico


  El esquema muestra la vista desde un vértice del icosaedro: 5 triángulos equiláteros
  se encuentran exactamente en ese punto central, formando un patrón de ''abanico''
  pentagonal. Esta es precisamente la figura de vértice característica del icosaedro.'
definiciones_clave: '- **Identificación del icosaedro regular**: Elemento o propiedad
  fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del icosaedro regular.'
