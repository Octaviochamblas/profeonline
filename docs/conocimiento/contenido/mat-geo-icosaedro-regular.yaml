procedimiento:
- 'Paso 1: Verifica que el cuerpo tenga exactamente 20 caras triangulares.'
- 'Paso 2: Verifica que las 20 caras sean triángulos equiláteros congruentes entre
  sí.'
- 'Paso 3: Confirma que en cada uno de los 12 vértices concurran exactamente 5 caras.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del icosaedro regular.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del icosaedro regular para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
