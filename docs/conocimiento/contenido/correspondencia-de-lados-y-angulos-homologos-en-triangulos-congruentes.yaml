semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CORRESPONDENCIA_LADOS_ANGULOS
resumen_inicial: 'En triángulos congruentes, los lados homólogos son aquellos que tienen igual longitud por corresponder a las mismas posiciones, y los ángulos homólogos son aquellos que tienen igual amplitud.'
explicacion_simple: |
  ![Lados y Ángulos Homólogos en Triángulos Congruentes](/static/img/nodos/correspondencia-de-lados-y-angulos-homologos-en-triangulos-congruentes-intro.svg)

  Los lados que están en la misma posición miden lo mismo, y los ángulos en las mismas esquinas miden exactamente los mismos grados.
explicacion_formal: |
  ### Teorema formal (Partes Homólogas)
  Si dos triángulos $\Delta ABC$ y $\Delta DEF$ son congruentes ($\Delta ABC \cong \Delta DEF$), entonces se satisfacen las siguientes seis igualdades métricas:

  $$\begin{cases} \|\overline{AB}\| = \|\overline{DE}\| \\ \|\overline{BC}\| = \|\overline{EF}\| \\ \|\overline{CA}\| = \|\overline{FD}\| \end{cases} \quad \land \quad \begin{cases} m(\angle A) = m(\angle D) \\ m(\angle B) = m(\angle E) \\ m(\angle C) = m(\angle F) \end{cases}$$

  ### Desglose simbólico y geométrico
  - Lados opuestos a ángulos congruentes: Si $\angle A \cong \angle D$, entonces el lado opuesto $\overline{BC}$ es homólogo y congruente a $\overline{EF}$.
  - Invarianza de perímetros: $P(\Delta ABC) = a + b + c = d + e + f = P(\Delta DEF)$.
  - Elementos secundarios: Alturas homólogas ($h_a = h_d$), transversales de gravedad ($t_a = t_d$) y radios ($R = R', r = r'$) son estrictamente iguales.

  ### Síntesis didáctica
  Demostrar la congruencia entre dos triángulos permite transferir de inmediato medidas lineales y angulares de una figura a la otra.
definiciones_clave: |
  - **Congruencia de figuras ($\cong$)**: Relación geométrica donde dos figuras tienen idéntica forma y tamaño.
  - **Isometría**: Transformación del plano (traslación, rotación o reflexión) que conserva distancias y ángulos.
  - **Vértices homólogos**: Vértices que ocupan la misma posición relativa en figuras congruentes.
  - **Lados y ángulos homólogos**: Elementos correspondientes que tienen exactamente la misma medida.
propiedades_relaciones: |
  - **CPCTC**: Las partes correspondientes de triángulos congruentes son congruentes entre sí.
  - **Invarianza métrica**: Si $\Delta ABC \cong \Delta DEF$, entonces $P(\Delta ABC) = P(\Delta DEF)$ y $\text{Área}(\Delta ABC) = \text{Área}(\Delta DEF)$.
  - **Cuatro Criterios Básicos**: LLL, LAL, ALA y $\text{LLA}_{>}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Lados y Ángulos Homólogos en Triángulos Congruentes](/static/img/nodos/correspondencia-de-lados-y-angulos-homologos-en-triangulos-congruentes-ejemplos.svg)

    Identifica la correspondencia de vértices y aplica los criterios de congruencia para deducir las medidas y relaciones solicitadas.
  pasos:
  - 'Paso 1: Analizar los datos geométricos dados (lados, ángulos y su posición relativa).'
  - 'Paso 2: Establecer la correspondencia de vértices homólogos entre ambos triángulos.'
  - 'Paso 3: Verificar qué criterio de congruencia (LLL, LAL, ALA o $\text{LLA}_{>}$) se cumple.'
  - 'Paso 4: Concluir formalmente $\Delta ABC \cong \Delta DEF$.'
  - 'Paso 5: Transferir las medidas incógnitas mediante el principio CPCTC.'
