procedimiento:
- 'Paso 1: Identifica las distancias recorridas por cada embarcación y el ángulo entre
  sus rumbos.'
- 'Paso 2: Modela la situación como un triángulo con esos dos lados y el ángulo comprendido
  entre ellos.'
- 'Paso 3: Aplica la ley de cosenos para calcular la distancia entre las embarcaciones
  (o la ley de senos si se busca un ángulo).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
