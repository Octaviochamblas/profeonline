semantic_id: MAT.GEO.TRIG_APLICA_REAL.NAVEGACION
resumen_inicial: 'Resolución de problemas de navegación mediante leyes trigonométricas:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: En navegación, las embarcaciones recorren distancias en distintas
  direcciones (rumbos), formando triángulos oblicuángulos entre sus posiciones y el
  punto de partida, que se resuelven con las leyes trigonométricas.
explicacion_formal: '![Problemas de navegación](/static/img/geometria/trigonometria/trigreal-navegacion.svg)


  ### Definición formal


  Si dos embarcaciones parten de un mismo punto con rumbos que forman un ángulo conocido,
  y cada una recorre una distancia conocida, la distancia entre ambas se calcula con
  la ley de cosenos (configuración LAL).


  ### Desarrollo didáctico


  Por ejemplo, dos barcos parten de un puerto: uno navega 40 km en un rumbo, y el
  otro 55 km en un rumbo que forma un ángulo de 65° con el primero. La distancia entre
  ambos barcos se calcula como $\sqrt{40^2+55^2-2\times40\times55\times\cos65°}$.'
definiciones_clave: '- **Resolución de problemas de navegación mediante leyes trigonométricas**:
