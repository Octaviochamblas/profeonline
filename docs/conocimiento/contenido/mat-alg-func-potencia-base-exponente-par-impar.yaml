  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determina si el exponente $n$ es par o impar.'
- 'Paso 2: Si es par, anticipa que el resultado será siempre positivo o cero, sin
  importar el signo de $x$.'
- 'Paso 3: Si es impar, anticipa que el resultado conservará el signo de $x$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en distinción entre exponentes pares e impares en funciones potencia.
ejemplos:
- titulo: Evaluación con exponente par
  enunciado: Evalúa $f(x)=x^4$ en $x=-2$ y $x=2$.
  solucion_pasos:
  - '$(-2)^4=16$ y $2^4=16$: ambos resultados son iguales y positivos.'
  - Se confirma el comportamiento típico de exponente par.
- titulo: Evaluación con exponente impar
  enunciado: Evalúa $f(x)=x^5$ en $x=-2$ y $x=2$.
  solucion_pasos:
  - '$(-2)^5=-32$ y $2^5=32$: los resultados son opuestos.'
  - Se confirma que la función conserva el signo de $x$, típico de exponente impar.
- titulo: ¿Puede $x^n$ ser negativo si $n$ es par?
  enunciado: ¿Puede $x^n$ tomar un valor negativo cuando $n$ es un entero par?
  respuesta: 'No'
  solucion_pasos:
  - Con exponente par, el resultado siempre es mayor o igual a $0$, sin importar el
    signo de $x$.
- titulo: ¿$x^n$ puede ser negativo si $n$ es impar y $x$ es negativo?
  enunciado: ¿Puede $x^n$ ser negativo si $n$ es impar y $x$ es un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Con exponente impar, el signo del resultado coincide con el signo de la base.
errores_frecuentes:
- Suponer que $(-x)^n$ siempre da el mismo resultado que $x^n$, sin importar la paridad
  de $n$.
- Declarar la paridad del exponente con la paridad del coeficiente $a$.
- Aplicar el comportamiento de exponente par a un exponente impar, o viceversa.
- Omitir verificar el signo de $x$ antes de calcular el resultado con exponente impar.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  distinción entre exponentes pares e impares en funciones potencia.
