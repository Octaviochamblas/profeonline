semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_PAR_IMPAR
resumen_inicial: 'La paridad del exponente $n$ divide las funciones potencia en dos grandes familias: las de exponente par (simétricas respecto al eje $y$) y las de exponente impar (simétricas respecto al origen).'
explicacion_simple: |
  Para entender el comportamiento de una función potencia $f(x) = a x^n$, la prueba clave es saber si el exponente $n$ es par ($2, 4, 6\dots$) o impar ($1, 3, 5\dots$). Si $n$ es par, la potencia elimina los signos negativos de la $x$ (porque $(-x)^2 = x^2$), produciendo una gráfica idéntica en ambos lados del eje vertical (como los dos brazos de una copa). Si $n$ es impar, la potencia conserva el signo negativo de la $x$ (porque $(-x)^3 = -x^3$), haciendo que un lado de la gráfica apunte hacia arriba y el otro lado apunte hacia abajo (como una curva en S).
explicacion_formal: |
  ### Definición formal
  La **clasificación por paridad del exponente** $n \in \mathbb{Z} \setminus \{0\}$ establece dos clases algebraicas de equivalencia funcional en la familia $f(x) = a x^n$:

  1. **Familia de Exponente Par ($n = 2k, k \in \mathbb{Z} \setminus \{0\}$)**:
     - **Propiedad de Simetría**: Función Par. Satisface $f(-x) = a(-x)^{2k} = a x^{2k} = f(x)$ para todo $x \in \operatorname{Dom}(f)$.
     - **Geometría**: Simetría axial respecto al eje $y$ (recta $x = 0$).
     - **Conservación de Signo de la Salida**: Si $a > 0$, la ordenada $y \ge 0$ para todo $x$. Si $a < 0$, la ordenada $y \le 0$ para todo $x$.

  2. **Familia de Exponente Impar ($n = 2k+1, k \in \mathbb{Z}$)**:
     - **Propiedad de Simetría**: Función Impar. Satisface $f(-x) = a(-x)^{2k+1} = -a x^{2k+1} = -f(x)$ para todo $x \in \operatorname{Dom}(f)$.
     - **Geometría**: Simetría central respecto al origen de coordenadas $(0, 0)$.
     - **Inversión de Signo de la Salida**: Las ordenadas para $x < 0$ poseen signo estrictamente opuesto a las ordenadas para $x > 0$.

  ### Síntesis didáctica
  Matriz de comparación de paridades para $n > 0$:
  - Par ($n=2,4$): Dominio $\mathbb{R}$, Recorrido $[0, +\infty[$ (si $a>0$), Simetría en Eje $y$, Monotonía no monótona global.
  - Impar ($n=3,5$): Dominio $\mathbb{R}$, Recorrido $\mathbb{R}$, Simetría en Origen $(0, 0)$, Monotonía estrictamente monótona.
definiciones_clave: |
  - **Función par ($n$ par)**: Cumple $f(-x) = f(x)$ y genera gráfica simétrica respecto al eje $y$.
  - **Función impar ($n$ impar)**: Cumple $f(-x) = -f(x)$ y genera gráfica simétrica respecto al origen $(0, 0)$.
  - **Simetría axial vs central**: Simetría especular de eje ($y$) frente a simetría de rotación en 180° respecto a un punto ($(0, 0)$).
propiedades_relaciones: |
  - **Monotonía global**: Las funciones potencia de exponente impar entero positivo son estrictamente monótonas en todo $\mathbb{R}$ (no tienen máximos ni mínimos locales).
  - **Extremos absolutos**: Las funciones potencia de exponente par entero positivo poseen un extremo absoluto en el origen: mínimo absoluto en $(0, 0)$ si $a > 0$, o máximo absoluto en $(0, 0)$ si $a < 0$.
ejemplo_guiado:
  enunciado: 'Evalúa las funciones $f(x) = 2x^4$ y $g(x) = 2x^5$ en $x = 3$ y $x = -3$, determina su paridad y describe la simetría de sus gráficas.'
  pasos:
    - 'Paso 1: Evaluamos $f(x) = 2x^4$: $f(3) = 2(3)^4 = 2(81) = 162$. Para $x = -3$: $f(-3) = 2(-3)^4 = 2(81) = 162$.'
    - 'Paso 2: Como $f(-3) = f(3) = 162$, **$f(x)$ es una función par** con exponente par $n = 4$, simétrica respecto al eje $y$.'
    - 'Paso 3: Evaluamos $g(x) = 2x^5$: $g(3) = 2(3)^5 = 2(243) = 486$. Para $x = -3$: $g(-3) = 2(-3)^5 = 2(-243) = -486$.'
    - 'Paso 4: Como $g(-3) = -g(3) = -486$, **$g(x)$ es una función impar** con exponente impar $n = 5$, simétrica respecto al origen $(0, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una función potencia cumple la condición $f(-x) = -f(x)$ para todo $x \in \mathbb{R}$, ¿qué podemos afirmar con certeza sobre su exponente $n$ y la simetría de su gráfica?'
    choices:
      - {text: 'El exponente $n$ es un número impar y su gráfica presenta simetría central respecto al origen de coordenadas $(0, 0)$', is_correct: true}
      - {text: 'El exponente $n$ es un número par y su gráfica presenta simetría axial respecto al eje $y$', is_correct: false}
      - {text: 'El exponente $n$ es negativo y su gráfica es constante', is_correct: false}
      - {text: 'El coeficiente $a$ debe ser necesariamente igual a cero', is_correct: false}
    explanation: 'La alternativa correcta es ''El exponente $n$ es un número impar y su gráfica presenta simetría central respecto al origen de coordenadas $(0, 0)$''. La identidad $f(-x) = -f(x)$ define una función impar.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función potencia $f(x) = 3x^6$ arroja el mismo resultado positivo tanto para $x = 2$ como para $x = -2$?'
    choices:
      - {text: 'Porque el exponente 6 es par, lo que elimina el signo negativo al elevar $(-2)^6 = 64 = 2^6$, dando $f(-2) = f(2) = 192$', is_correct: true}
      - {text: 'Porque el coeficiente 3 convierte todos los números en positivos', is_correct: false}
      - {text: 'Porque las funciones potencia solo aceptan números positivos', is_correct: false}
      - {text: 'Porque $x = -2$ no se puede evaluar en la función', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el exponente 6 es par, lo que elimina el signo negativo al elevar $(-2)^6 = 64 = 2^6$, dando $f(-2) = f(2) = 192$''. Las potencias de exponente par anulan el signo del argumento.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Inspeccionar el exponente $n$ de la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Si $n$ es par, aplicar la propiedad $f(-x) = f(x)$, declarar función par y simetría respecto al eje $y$.'
  - 'Paso 3: Si $n$ es impar, aplicar la propiedad $f(-x) = -f(x)$, declarar función impar y simetría respecto al origen $(0, 0)$.'
  - 'Paso 4: Utilizar la paridad para determinar el recorrido y la presencia de extremos absolutos.'
errores_correccion: |
  - **Error 1:** Afirmar que $(-x)^3 = x^3$ en un exponente impar. **Cómo corregirlo:** Una potencia de exponente impar conserva el signo negativo de la base: $(-x)^3 = (-1)^3 x^3 = -x^3$.
  - **Error 2:** Confundir la simetría del origen (impar) con la simetría del eje $y$ (par). **Cómo corregirlo:** La simetría del eje $y$ dobla la gráfica por la mitad vertical (par). La simetría del origen rota la gráfica 180° pasando por el centro (impar).
ejemplos:
  - titulo: 'Comprobación de paridad en exponente par'
    enunciado: 'Para $f(x) = -5x^2$, ¿$f(-4)$ es igual a $f(4)$?'
    alternativas:
      - 'Sí, ambos dan $-80$'
      - 'No, uno da $+80$ y el otro $-80$'
      - 'No se puede calcular'
    respuesta: 'Sí, ambos dan $-80$'
    solucion_pasos:
      - '1. $f(4) = -5(4)^2 = -5(16) = -80$.'
      - '2. $f(-4) = -5(-4)^2 = -5(16) = -80$. Cumple $f(-x) = f(x)$.'
  - titulo: 'Comprobación de paridad en exponente impar'
    enunciado: 'Para $g(x) = x^3$, ¿$g(-2)$ es igual a $-g(2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(2) = 8$ y $g(-2) = -8$, cumpliendo $g(-2) = -g(2)$.'
  - titulo: 'Recorrido completo en exponentes impares'
    enunciado: '¿El recorrido de $f(x) = a x^3$ para $n$ impar positivo es todo el conjunto $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al conservar el signo, genera valores tanto positivos como negativos de $-\infty$ a $+\infty$.'
  - titulo: 'Presencia de extremo absoluto en pares'
    enunciado: '¿La función $f(x) = 4x^4$ tiene su valor mínimo absoluto en $(0, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que $4x^4 \ge 0$ para todo $x$, la menor altura es $y = 0$ alcanzada en $x = 0$.'
errores_frecuentes:
  - 'Una función potencia de exponente par como $f(x) = x^4$ produce valores de salida negativos para entradas $x < 0$ si $a > 0$.'
  - 'Las funciones de exponente impar son simétricas respecto al eje vertical $y$.'
  - 'Evaluar un número negativo en $(-x)^5$ elimina el signo negativo.'
  - 'Las funciones potencia de exponente par tienen como recorrido todos los números reales $\mathbb{R}$.'
  - 'Una función potencia de exponente impar posee un mínimo absoluto en el origen.'
afirmaciones_verdaderas:
  - 'Las funciones potencia de exponente par son funciones pares ($f(-x) = f(x)$) con simetría respecto al eje $y$, mientras que las de exponente impar son funciones impares ($f(-x) = -f(x)$) con simetría respecto al origen.'
  - 'Para exponente positivo, las funciones de exponente impar tienen como recorrido a todo $\mathbb{R}$, mientras que las de exponente par tienen un recorrido acotado por un extremo absoluto en el origen.'
al_terminar_debes_poder: |
  QUÉ: Diferenciar la simetría y comportamiento gráfico de funciones potencia con exponente par o impar.
  CÓMO: Identificar simetría respecto al eje Y en exponentes pares ($f(-x) = f(x)$) y simetría al origen en impares ($f(-x) = -f(x)$).
