semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_PAR_IMPAR
resumen_inicial: 'Distinción entre exponentes pares e impares en funciones potencia:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Definición y análisis
  de parámetros.'
explicacion_simple: Que un exponente sea par o impar cambia radicalmente cómo se comporta
  la función frente a valores negativos de $x$.
explicacion_formal: '### Definición formal


  Para $n$ par, $(-x)^n=x^n$ para todo $x$, así que $f(-x)=f(x)$: la función es par
  y su resultado nunca es negativo. Para $n$ impar, $(-x)^n=-x^n$, así que $f(-x)=-f(x)$:
  la función es impar y su resultado conserva el signo de $x$.


  ### Desarrollo didáctico


  Con $n=2$: $(-3)^2=9$ y $3^2=9$, el mismo resultado positivo. Con $n=3$: $(-3)^3=-27$
  y $3^3=27$, resultados opuestos que conservan el signo de la base original.'
definiciones_clave: '- **Distinción entre exponentes pares e impares en funciones
  potencia**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a distinción entre exponentes pares e impares en funciones potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de distinción entre exponentes pares e impares en funciones potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de distinción entre exponentes
    pares e impares en funciones potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
