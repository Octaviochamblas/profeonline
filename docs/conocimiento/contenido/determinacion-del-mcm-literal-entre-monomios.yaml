semantic_id: MAT.ALG.MCM_ALGEBRAICO.PARTE_LITERAL_MONOMIOS
resumen_inicial: La determinación del m.c.m. literal entre monomios consiste en reunir todas las variables presentes en cualquiera
  de los monomios, elevadas a su mayor exponente.
explicacion_simple: "Para hallar el **m.c.m. literal** (de las letras) entre varios monomios (ej: $x^4y^2$, $x^2z^3$, $y^5w$):\n\
  - **DOS REGLAS DE ORO**:\n  1. **Incluye TODAS las letras que aparezcan** (comunes y no comunes):\n     - Aparecen las letras\
  \ $x, y, z$ y $w$. ¡Las incluyes TODAS!\n  2. **Elige el MAYOR exponente de cada letra**:\n     - Para $x$: exponentes $4,\
  \ 2 \\implies$ mayor exponente es **$4$** ($x^4$).\n     - Para $y$: exponentes $2, 5 \\implies$ mayor exponente es **$5$**\
  \ ($y^5$).\n     - Para $z$: exponente unico $3 \\implies$ mayor exponente es **$3$** ($z^3$).\n     - Para $w$: exponente\
  \ unico $1 \\implies$ mayor exponente es **$1$** ($w^1$).\n  3. **Respuesta final del m.c.m. literal**: $\\mathbf{x^4y^5z^3w}$.\n\
  \n![Determinación del m.c.m. literal entre monomios](/static/img/nodos/determinacion-del-mcm-literal-entre-monomios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $M_1, M_2, \dots, M_k$ monomios en $n$ variables con partes literales $L_i = \prod_{j=1}^n x_j^{e_{i,j}}$ donde $e_{i,j}
  \ge 0$. El **m.c.m. de las partes literales** se define como la envolvente superior del retículo de potencias:


  $$\operatorname{mcm}(L_1, L_2, \dots, L_k) = \prod_{j=1}^n x_j^{\max_i(e_{i,j})}$$


  ### Análisis del Exponente Máximo

  Dado que $\max_i(e_{i,j}) \ge e_{i,j}$ para todo monomio $i \in \{1, 2, \dots, k\}$, la propiedad de orden exponencial garantiza
  que la división $\frac{\operatorname{mcm}(L_1, \dots, L_k)}{L_i} = x_j^{\max(e) - e_{i,j}}$ da exponentes enteros no negativos,
  asegurando la **divisibilidad exacta**.


  ### Síntesis didáctica

  La parte literal del m.c.m. reúne absolutamente todas las variables observadas en los monomios, elevando cada una a su exponente
  máximo.

  '
definiciones_clave: '- **m.c.m. literal**: Producto de todas las variables (comunes y no comunes) elevadas a su mayor grado.

  - **Variables no comunes**: Letras que figuran en algunos monomios pero no en todos, las cuales deben incluirse obligatoriamente
  en el m.c.m.

  - **Exponente literal máximo ($\max(e_j)$)**: Potencia más grande observada para una variable determinada en la lista de
  monomios.

  '
propiedades_relaciones: '- **Grado total del m.c.m.**: El grado total del m.c.m. literal es la suma de los exponentes máximos
  de todas las distintas variables presentes.

  '
ejemplo_guiado:
  enunciado: Calcula el m.c.m. literal entre los tres monomios $M_1 = a^3 b^2$, $M_2 = b^4 c^5$ y $M_3 = a^2 c^3 d$.
  pasos:
  - 'Paso 1: Listamos todas las letras presentes en cualquiera de los monomios: - Letra $a$ (en $M_1$ y $M_3$). - Letra $b$
    (en $M_1$ y $M_2$). - Letra $c$ (en $M_2$ y $M_3$). - Letra $d$ (en $M_3$). - **¡Incluimos las cuatro letras ($a, b, c,
    d$)!**'
  - 'Paso 2: Comparamos los exponentes para cada una de las letras y elegimos el **mayor**: - Para $a$: exponentes son $3$
    y $2 \implies$ mayor es **$3$** ($a^3$). - Para $b$: exponentes son $2$ y $4 \implies$ mayor es **$4$** ($b^4$). - Para
    $c$: exponentes son $5$ y $3 \implies$ mayor es **$5$** ($c^5$). - Para $d$: exponente único es **$1$** ($d^1$).'
  - 'Paso 3: Multiplicamos todas las letras elegidas con su mayor exponente: $a^3 b^4 c^5 d$.'
  - 'Conclusión: El m.c.m. literal es **$a^3 b^4 c^5 d$**.'
  imagen: /static/img/nodos/determinacion-del-mcm-literal-entre-monomios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el m.c.m. literal entre los monomios $x^3 y^2$, $y^4 z^3$ y $x^5 z^2$?
  choices:
  - text: El m.c.m. literal es $x^5 y^4 z^3$, incluyendo todas las variables ($x, y, z$) elevadas a su mayor exponente ($5,
      4, 3$)
    is_correct: true
  - text: El m.c.m. literal es $x^3 y^2 z^2$
    is_correct: false
  - text: El m.c.m. literal es 1
    is_correct: false
  - text: El m.c.m. literal es $x^8 y^6 z^5$
    is_correct: false
  explanation: 'La alternativa correcta es ''El m.c.m. literal es $x^5 y^4 z^3$, incluyendo todas las variables ($x, y, z$)
    elevadas a su mayor exponente ($5, 4, 3$)''. Mínimo común múltiplo literal: $\max(x)=5, \max(y)=4, \max(z)=3 \implies
    x^5 y^4 z^3$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos monomios son $a^4 b^2$ y $c^3$, ¿cuál es su m.c.m. literal?
  choices:
  - text: Su m.c.m. literal es $a^4 b^2 c^3$, porque deben incluirse todas las letras no comunes
    is_correct: true
  - text: Su m.c.m. literal es 1
    is_correct: false
  - text: Su m.c.m. literal es 0
    is_correct: false
  - text: No se puede determinar
    is_correct: false
  explanation: La alternativa correcta es 'Su m.c.m. literal es $a^4 b^2 c^3$, porque deben incluirse todas las letras no
    comunes'. El m.c.m. incluye todas las variables presentes.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elaborar un inventario completo con cada una de las variables que aparezcan en los monomios.'
- 'Paso 2: Para cada variable del inventario, revisar los exponentes con los que figura en cada monomio.'
- 'Paso 3: Seleccionar la potencia más alta observada para cada variable.'
- 'Paso 4: Multiplicar las variables con sus mayores exponentes para formar el m.c.m. literal.'
errores_correccion: '- **Error 1:** Excluir las letras que aparecen en un solo monomio. **Cómo corregirlo:** En el m.c.m.
  literal **SE DEBEN INCLUIR TODAS LAS VARIABLES QUE APAREZCAN EN CUALQUIERA DE LOS MONOMIOS**.

  - **Error 2:** Seleccionar el menor exponente en lugar del mayor. **Cómo corregirlo:** Para el m.c.m. **CADA VARIABLE DEBE
  ELEVARSE A SU MAYOR EXPONENTES OBSERVADO**.

  '
ejemplos:
- titulo: Una sola variable
  enunciado: Para $x^2$, $x^6$ y $x^4$, ¿es el m.c.m. literal $x^6$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el mayor exponente es 6.
- titulo: Variables disjuntas
  enunciado: Para $a^3$ y $b^2$, ¿es el m.c.m. $a^3b^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, se unen todas las letras.
- titulo: Variables mixtas
  enunciado: Para $x^3y$ y $xy^4$, ¿es el m.c.m. $x^3y^4$?
  respuesta: Sí
  solucion_pasos:
  - Sí, mayores exponentes 3 y 4.
- titulo: Tres monomios
  enunciado: Para $a^2b$, $b^2c$ y $c^2a$, ¿es el m.c.m. $a^2b^2c^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, mayores exponentes de cada una.
errores_frecuentes:
- Las variables no compartidas no son escritas en la expresión del m.c.m. literal.
- Elegir el menor exponente de las letras en lugar de seleccionar el mayor exponente.
- Sumar los exponentes de las letras iguales en lugar de elegir el máximo exponente.
- Intercambiar las reglas del m.c.m. literal con las del M.C.D. literal.
- Olvidar que todas las letras de cada monomio deben quedar contenidas en el m.c.m.
afirmaciones_verdaderas:
- El m.c.m. literal incluye todas las distintas variables observadas en los monomios.
- Cada variable del m.c.m. literal se eleva a la mayor potencia con la que figura en los monomios.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/determinacion-del-mcm-literal-entre-monomios-resumen.svg)


  QUÉ: Determinar el m.c.m. literal entre varios monomios reuniendo todas las variables con su mayor exponente.

  CÓMO: Listar la totalidad de las variables algebraicas presentes en cualquiera de los monomios y elevar cada una a la potencia
  máxima observada ($\prod x_j^{\max(e_{i,j})}$).

  '
