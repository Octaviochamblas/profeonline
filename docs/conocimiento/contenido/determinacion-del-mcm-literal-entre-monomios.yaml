semantic_id: MAT.ALG.MCM_ALGEBRAICO.PARTE_LITERAL_MONOMIOS
resumen_inicial: El m.c.m. de la parte literal entre monomios se obtiene multiplicando
  todas las variables presentes (comunes y no comunes), elevadas a su mayor exponente.
explicacion_simple: 'Para hallar únicamente la parte literal (las letras) del m.c.m.
  entre varios monomios, seguimos dos reglas:

  1. Recopilamos TODAS las variables que aparezcan al menos en uno de los monomios.
  No descartamos ninguna letra aunque no esté repetida en los demás.

  2. A cada letra de la lista le asignamos el exponente más alto con el que figura
  entre todos los monomios.

  De este modo nos aseguramos de que las letras del m.c.m. puedan ser divididas por
  la parte literal de cada monomio original.'
explicacion_formal: 'Dadas las partes literales de un conjunto de monomios $M_1, M_2,
  \dots, M_k$, expresadas como $L_i = \prod_j x_j^{e_{i,j}}$, el **m.c.m. literal**
  se define formalmente como:


  $$\text{m.c.m.}_{\text{literal}} = \prod_{x_j \text{ en algún monomio}} x_j^{\max_i(e_{i,j})}$$


  **Desglose de la fórmula:**

  - $\prod_{x_j \text{ en algún monomio}}$: Indica que el producto se realiza sobre
  la unión de todas las variables $x_j$ presentes en el conjunto de monomios (comunes
  y no comunes).

  - $\max_i(e_{i,j})$: Señala que para cada variable $x_j$, se escoge el exponente
  máximo entre todos los monomios $i$ donde aparece la variable.'
definiciones_clave: '- **Unión de variables**: Conjunto formado por todas las letras
  distintas que aparecen en cualquiera de los monomios.

  - **Exponente máximo de variable**: La potencia más alta registrada para una determinada
  letra entre todos los monomios analizados.'
propiedades_relaciones: '- **Inclusión de variables no comunes**: Si una letra figura
  en un solo monomio, entra en el m.c.m. literal conservando su exponente intacto.

  - **Divisibilidad literal**: La parte literal del m.c.m. es divisible por la parte
  literal de cualquiera de los monomios originales.'
ejemplo_guiado:
  enunciado: Dos señales digitales tienen partes literales dadas por $a^3b^2$ y $a^2b^4c$.
    Identifica la parte literal del m.c.m. entre ambas expresiones ($a^3b^4c$) y evalúa
    su valor numérico para $a = 2$, $b = 1$ y $c = 5$.
  pasos:
  - 'Paso 1: Listar todas las variables presentes en al menos uno de los términos:
    $a$, $b$ y $c$.'
  - 'Paso 2: Seleccionar los mayores exponentes para cada variable. Para $a$: $\max(3,
    2) = 3$; para $b$: $\max(2, 4) = 4$; para $c$: $\max(0, 1) = 1$. La parte literal
    del m.c.m. es $a^3b^4c$.'
  - 'Paso 3: Sustituir $a = 2$, $b = 1$ y $c = 5$: $(2)^3 \cdot (1)^4 \cdot (5)^1
    = 8 \cdot 1 \cdot 5 = 40$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se seleccionan los exponentes de las variables al calcular el m.c.m.
    literal entre monomios?
  choices:
  - text: Se incluyen todas las variables (comunes y no comunes) elevadas a su mayor
      exponente.
    is_correct: true
  - text: Se incluyen solo las variables comunes elevadas a su menor exponente.
    is_correct: false
  - text: Se multiplican los exponentes de las variables iguales.
    is_correct: false
  - text: Se omiten las variables que no aparecen en todos los monomios.
    is_correct: false
  explanation: La alternativa correcta es 'Se incluyen todas las variables (comunes
    y no comunes) elevadas a su mayor exponente.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la parte literal m.c.m. igual a $a^3b^4c$ con $a = 2$, $b = 1$ y
    $c = 5$, ¿cuál es el valor numérico resultante?
  choices:
  - text: $40$
    is_correct: true
  - text: $20$
    is_correct: false
  - text: $80$
    is_correct: false
  - text: $120$
    is_correct: false
  explanation: La alternativa correcta es '$40$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hacer un inventario de todas las letras que aparezcan en cualquiera de
  los monomios.'
- 'Paso 2: Comparar las potencias de cada letra en todos los términos donde figura.'
- 'Paso 3: Seleccionar para cada letra la mayor potencia registrada.'
- 'Paso 4: Escribir el producto de todas las letras seleccionadas elevadas a sus respectivos
  exponentes máximos.'
errores_correccion: '- **Error común:** Descartar una variable porque solo aparece
  en un monomio del grupo.

  - **Cómo corregirlo:** Recuerda que para ser MÚLTIPLO de ese monomio, el m.c.m.
  debe obligatoriamente contener la variable de dicho monomio.'
ejemplos:
- titulo: 'Ejemplo 1: m.c.m. literal con tres monomios'
  enunciado: Determina el m.c.m. literal de $x^4y$, $x^2y^3z$ y $y^2w^3$.
  alternativas:
  - $x^4y^3z w^3$
  - $x^2y$
  - $x^4y^3$
  respuesta: $x^4y^3z w^3$
  solucion_pasos:
  - '1. Todas las variables presentes: $x, y, z, w$.'
  - '2. Mayores exponentes: para $x$ es $4$, para $y$ es $3$, para $z$ es $1$, para
    $w$ es $3$.'
  - '3. m.c.m. literal: $x^4y^3z w^3$.'
- titulo: 'Ejemplo 2: Variables comunes y no comunes'
  enunciado: ¿Cuál es el m.c.m. literal entre $m^3n^2$ y $m^2p^4$?
  alternativas:
  - $m^3n^2p^4$
  - $m^2$
  - $m^5n^2p^4$
  respuesta: $m^3n^2p^4$
  solucion_pasos:
  - '1. Variables presentes: $m$, $n$ y $p$.'
  - '2. Mayor exponente para $m$: $3$. Para $n$: $2$. Para $p$: $4$.'
  - '3. m.c.m. literal: $m^3n^2p^4$.'
- titulo: ¿Si dos monomios son $x^3$ e $y^4$, su m.c.m. literal es el producto $x^3y^4$?
  respuesta: Sí
  solucion_pasos:
  - 'Sí. Al no compartir variables, el m.c.m. literal junta todas las letras a su
    mayor exponente: $x^3y^4$.'
- titulo: ¿El exponente de la variable $x$ en el m.c.m. literal entre $x^5$ y $x^2$
    es igual a $5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el m.c.m. literal se selecciona siempre el mayor exponente entre los términos
    ($5$).
errores_frecuentes:
- El m.c.m. literal de $x^4y^2$ y $x^2y^5$ es $x^2y^2$ porque toma los exponentes
  menores.
- En el m.c.m. literal de $a^2b$ y $b^3c$, la variable $c$ no se incluye por no ser
  común.
- El m.c.m. literal de $m^3$ y $m^2$ es $m^6$ al multiplicar los exponentes.
- Las variables no comunes en los monomios se reemplazan por un 1 en el m.c.m. literal.
- El m.c.m. literal de $x^2$ y $x^3$ es $x$.
afirmaciones_verdaderas:
- El m.c.m. literal se construye con el producto de todas las variables distintas
  presentes en los monomios, elevadas a sus mayores exponentes.
- Cualquier monomio del conjunto divide exactamente a la parte literal del m.c.m.
  obtenido.
al_terminar_debes_poder: Al finalizar este recurso podrás hallar la parte literal
  del m.c.m. de cualquier grupo de monomios seleccionando las variables y mayores
  potencias requeridas.
