procedimiento:
- 'Paso 1: Haz una lista con TODAS las letras distintas que aparezcan, sin excluir
  ninguna.'
- 'Paso 2: Revisa los exponentes que tiene cada letra en los distintos monomios.'
- 'Paso 3: Asígnale a cada letra de tu lista el exponente MÁS GRANDE que hayas encontrado.'
- 'Paso 4: Multiplica todas las letras resultantes.'
- Es la definición técnica de inclusión máxima (MCM).
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en determinación del m.c.m. literal entre monomios.
ejemplos:
- titulo: Halla el MCM literal de $m^3 n^2$, $m^5 p$ y $n^4 p^2$
  enunciado: Halla el MCM literal de $m^3 n^2$, $m^5 p$ y $n^4 p^2$.
  solucion_pasos:
  - 'Letras totales: m, n, p.'
  - 'Mayor exp de m: 5 ($m^5$).'
  - 'Mayor exp de n: 4 ($n^4$).'
  - 'Mayor exp de p: 2 ($p^2$).'
  - El MCM literal es $m^5 n^4 p^2$.
- titulo: MCM literal de $a^2$ y $b^3$.
  solucion_pasos:
  - 'Se incluyen ambas variables sin alterar sus exponentes porque no hay competencia:
    $a^2 b^3$.'
- titulo: 'Respecto de «Determinación del m.c.m. literal entre monomios»: ¿Describe
    adecuadamente el co'
  enunciado: 'Respecto de «Determinación del m.c.m. literal entre monomios»: ¿Describe
    adecuadamente el concepto esta frase? «Para obtener la parte literal del MCM,
    escribe TODAS las bases (letras) diferentes que aparezcan en los monomios, y eleva
    cada una a su MAYOR exponente presente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para obtener la parte literal
    del MCM, escribe TODAS las bases (letras) diferentes que aparezcan en los monomios,
    y eleva cada una a su MAYOR exponente presente.'
- titulo: 'Respecto de «Determinación del m.c.m. literal entre monomios»: ¿Se puede
    aceptar esta afirma'
  enunciado: 'Respecto de «Determinación del m.c.m. literal entre monomios»: ¿Se puede
    aceptar esta afirmación? «Descartar letras que no son comunes a todos los términos
    (es el error fatal más común, contamina el MCM con lógica de MCD)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para obtener la parte literal
    del MCM, escribe TODAS las bases (letras) diferentes que aparezcan en los monomios,
    y eleva cada una a su MAYOR exponente presente.'
errores_frecuentes:
- Descartar letras que no son comunes a todos los términos (es el error fatal más
  común, contamina el MCM con lógica de MCD).
- Elegir el exponente más pequeño.
- Para «La regla de oro para el MCM literal indica que se escogen:», la respuesta
  correcta es Solo las letras comunes al mayor exponente.
- Para «La regla de oro para el MCM literal indica que se escogen:», la respuesta
  correcta es Las letras comunes y no comunes al menor exponente.
- Las letras multiplicadas entre sí.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando determinación
  del m.c.m. literal entre monomios.
