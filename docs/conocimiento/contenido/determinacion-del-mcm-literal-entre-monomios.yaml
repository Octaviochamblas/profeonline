semantic_id: MAT.ALG.MCM_ALGEBRAICO.PARTE_LITERAL_MONOMIOS
resumen_inicial: 'Determinación del m.c.m. literal entre monomios: concepto, reglas
  operativas y simplificación en m.c.m. algebraico.'
explicacion_simple: ¿Y qué hay de las letras en el MCM? Aquí reina la inclusión absoluta.
  Si una letra aparece, sin importar si está sola o en todos lados, debe estar en
  el MCM. Y si hay competencia de exponentes, gana siempre el más fuerte.
explicacion_formal: "### Definición formal\n\nLas letras comunes y no comunes al mayor\
  \ exponente.\n\n### Desarrollo didáctico\n\nLa construcción de la parte literal\
  \ del MCM requiere ser generoso, al contrario del MCD que era estricto.\n\n**Regla\
  \ del MCM Literal:** Se toman TODAS las bases (letras) que aparezcan, ya sea que\
  \ se repitan o no, y a cada una se le asigna el MAYOR exponente con el que aparezca.\n\
  \nEjemplo: Tenemos $A = x^3 y^2$ y $B = x^2 y^4 z$.\n- **Paso 1 (Todas las letras):**\
  \ ¿Qué letras existen en total? Tenemos $x$, $y$, y $z$. Tomamos las tres.\n- **Paso\
  \ 2 (Mayor exponente):**\n  - Para $x$: Aparece como $x^3$ y $x^2$. El mayor es\
  \ 3. Tomamos $x^3$.\n  - Para $y$: Aparece como $y^2$ y $y^4$. El mayor es 4. Tomamos\
  \ $y^4$.\n  - Para $z$: Solo aparece como $z^1$. Tomamos $z^1$.\n\nResultado: El\
  \ MCM es $x^3 y^4 z$. Fíjate cómo tanto A como B 'caben' perfectamente dentro de\
  \ este resultado."
definiciones_clave: '- **Determinación del m.c.m. literal entre monomios**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a determinación del m.c.m. literal
  entre monomios.'
