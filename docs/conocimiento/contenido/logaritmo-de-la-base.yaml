procedimiento:
  - 'Paso 1: Comprobar que el número de la base $b$ y el número del argumento sean idénticos.'
  - 'Paso 2: Verificar que la base cumpla las restricciones de existencia ($b > 0, b \neq 1$).'
  - 'Paso 3: Sustituir la expresión logarítmica directamente por el valor entero $1$.'
  - 'Paso 4: Operar aritméticamente el 1 dentro de la expresión algebraica completa.'
errores_correccion: |
  - **Error 1:** Confundir el logaritmo de la base con el logaritmo de 1 (ej: escribir $\log_5(5) = 0$). **Cómo corregirlo:** El logaritmo de la unidad da cero ($\log_5(1) = 0$), pero el logaritmo de la base da **uno**: $\log_5(5) = 1$.
  - **Error 2:** Creer que $\log_b(b) = b$. **Cómo corregirlo:** El logaritmo no devuelve la base; el logaritmo es el **exponente**, y como $b^1 = b$, la respuesta es siempre el exponente **1**.
ejemplos:
  - titulo: 'Logaritmo de la base 10'
    enunciado: '¿El valor de $\log_{10}(10)$ es igual a $1$?'
    alternativas:
      - 'Sí, pues $10^1 = 10$'
      - 'No, es igual a 0'
      - 'No, es igual a 10'
    respuesta: 'Sí, pues $10^1 = 10$'
    solucion_pasos:
      - '1. Aplicamos la regla $\log_b(b) = 1$.'
      - '2. Como la base es 10 y el argumento es 10, resulta $1$.'
  - titulo: 'Logaritmo de la base fraccionaria'
    enunciado: '¿El valor de $\log_{1/2}(1/2)$ es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1/2)^1 = 1/2 \implies \log_{1/2}(1/2) = 1$.'
  - titulo: 'Punto de la gráfica de la función'
    enunciado: '¿La gráfica de la función $f(x) = \log_3(x)$ pasa por el punto $(3, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluando en $x = 3 \implies f(3) = \log_3(3) = 1$.'
  - titulo: 'Resta de logaritmo de la base'
    enunciado: '¿La expresión $10 - \log_7(7)$ equivale a $9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10 - 1 = 9$.'
