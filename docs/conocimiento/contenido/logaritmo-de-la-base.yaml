semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DE_LA_BASE
resumen_inicial: 'El logaritmo de la base es siempre igual a uno: $\log_b(b) = 1$, porque cualquier número elevado al exponente 1 da como resultado el mismo número ($b^1 = b$).'
explicacion_simple: '![Logaritmo de la base](/static/img/nodos/logaritmo-de-la-base-intro.svg)


  Cuando la base y el argumento coinciden, el resultado siempre es $1$:

  - ¿A qué exponente debes elevar $5$ para obtener $5$? ¡A $1$! ($5^1 = 5$).

  - Por eso: $\log_5(5) = 1$, $\log_{10}(10) = 1$ y $\ln(e) = 1$.

  - Más aún, para cualquier potencia de la base: $\log_b(b^k) = k$.'
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$. Por la propiedad del elemento neutro del exponente en los números reales ($b^1 = b$), se deduce inmediatamente la **propiedad del logaritmo de la base**:


  $$\log_b(b) = 1$$


  **Generalización a Potencias:**

  Para todo exponente $k \in \mathbb{R}$:

  $$\log_b(b^k) = k \cdot \log_b(b) = k \cdot 1 = k$$


  Esta regla permite simplificar instantáneamente logaritmos cuyos argumentos son potencias directas de la base.'
definiciones_clave: '- **Logaritmo de la base**: Identidad $\log_b(b) = 1$.

  - **Extracción de potencia**: Identidad $\log_b(b^k) = k$.

  - **Elemento neutro del exponente**: Propiedad $b^1 = b$.'
propiedades_relaciones: '- **Cancelación unívoca**: El operador logarítmico y la base se neutralizan dejando solo el exponente.

  - **Logaritmo decimal y natural**: $\log(10) = 1$ y $\ln(e) = 1$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de la base](/static/img/nodos/logaritmo-de-la-base-ejemplos.svg)


    Calcule el valor de $\log_5(5)$, $\log(10)$ y $\ln(e)$.'
  pasos:
  - 'Paso 1: Para $\log_5(5)$: Como $5^1 = 5$, se tiene $\log_5(5) = 1$.'
  - 'Paso 2: Para $\log(10)$: Como $10^1 = 10$, se tiene $\log(10) = 1$.'
  - 'Paso 3: Para $\ln(e)$: Como $e^1 = e$, se tiene $\ln(e) = 1$.'
  - 'Conclusión: El logaritmo de la base es idénticamente 1 en todos los sistemas.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_7(7^9)$?
  choices:
  - text: $9$ (porque $\log_b(b^k) = k$)
    is_correct: true
  - text: $7$
    is_correct: false
  - text: $63$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$9$ (porque $\log_b(b^k) = k$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expresión $E = 3\log_4(4) - \log(10) + \ln(e)$, ¿cuál es el resultado final?
  choices:
  - text: $3$ (porque $3(1) - 1 + 1 = 3$)
    is_correct: true
  - text: $4$
    is_correct: false
  - text: $2$
    is_correct: false
  - text: $0$
    is_correct: false
  explanation: La alternativa correcta es '$3$ (porque $3(1) - 1 + 1 = 3$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Detectar si el argumento coincide con la base o es una potencia directa de ella.'
- 'Paso 2: Si el argumento es $b$, reemplazar directamente por 1: $\log_b(b) = 1$.'
- 'Paso 3: Si el argumento es $b^k$, extraer el exponente: $\log_b(b^k) = k$.'
errores_correccion: "- **Error 1: Pensar que $\\log_b(b) = 0$.** **Cómo corregirlo:** $\\log_b(1) = 0$, pero cuando coinciden argumento y base, el exponente es 1 ($b^1 = b \\implies \\log_b(b) = 1$).\n- **Error 2: Olvidar multiplicar el exponente extraído.** **Cómo corregirlo:** En $2\\log_3(3^4)$, el cálculo es $2 \times 4 = 8$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $\log_{12}(12)$?
  alternativas:
  - $1$
  - $12$
  - $0$
  respuesta: $1$
  solucion_pasos:
  - $12^1 = 12 \implies \log_{12}(12) = 1$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\log_2(2^{-5})$?
  alternativas:
  - $-5$
  - $5$
  - $1/32$
  respuesta: $-5$
  solucion_pasos:
  - Por extracción directa $\log_b(b^k) = k$, el resultado es $-5$.
- titulo: ¿Es log(10) = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la base tácita es 10 y $10^1 = 10$.
  alternativas:
  - texto: Sí, log(10) = 1
    es_correcta: true
    retroalimentacion: ¡Correcto! Logaritmo decimal de la base.
  - texto: No, es 0
    es_correcta: false
    retroalimentacion: Incorrecto, el que vale 0 es $\log(1)$.
  - texto: No, es 10
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente es 1.
- titulo: ¿Es ln(e) = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $e^1 = e$.
  alternativas:
  - texto: Sí, ln(e) = 1
    es_correcta: true
    retroalimentacion: ¡Correcto! Logaritmo natural de su base.
  - texto: No, es e
    es_correcta: false
    retroalimentacion: Incorrecto, $e$ es la base.
  - texto: No, es 0
    es_correcta: false
    retroalimentacion: Incorrecto, $\ln(1) = 0$.
errores_frecuentes:
- Confundir $\log_b(b) = 1$ con $\log_b(1) = 0$.
- Creer que $\log_b(b) = b$.
- No aplicar la propiedad en bases compuestas o algebraicas.
- Multiplicar la base por el argumento.
afirmaciones_verdaderas:
- 'El logaritmo de la base es idénticamente igual a uno: $\log_b(b) = 1$.'
- Para cualquier exponente real $k$, se cumple $\log_b(b^k) = k$.
- En logaritmos decimales y naturales, $\log(10) = 1$ y $\ln(e) = 1$.
al_terminar_debes_poder: '![Síntesis de logaritmo de la base](/static/img/nodos/logaritmo-de-la-base-resumen.svg)


  QUÉ: Comprender y aplicar la propiedad de identidad $\log_b(b) = 1$ y su generalización $\log_b(b^k) = k$.


  CÓMO: Reconociendo la coincidencia entre la base y el argumento para simplificar directamente a 1 o extraer el exponente correspondiente.'
