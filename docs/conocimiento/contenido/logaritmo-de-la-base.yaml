semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DE_LA_BASE
resumen_inicial: 'El logaritmo de la base es siempre igual a uno: $\log_b(b) = 1$, puesto que cualquier número elevado al exponente 1 permanece igual ($b^1 = b$).'
explicacion_simple: |
  Cuando la base del logaritmo y el número del argumento son exactamente iguales (como en $\log_5(5)$ o $\log_{10}(10)$), el resultado SIEMPRE es igual a 1. La razón es que la pregunta matemática es: *"¿A qué exponente elevas la base $b$ para obtener la misma base $b$?"*. El único exponente que deja a un número exactamente igual a sí mismo es el exponente 1 ($b^1 = b$).
explicacion_formal: |
  ### Definición formal
  La **propiedad del logaritmo de la base** establece que para toda base real $b > 0, b \neq 1$:
  $$\log_b(b) = 1$$

  ### Demostración analítica
  Por la definición fundamental del logaritmo $\log_b(a) = c \iff b^c = a$:
  1. Asignamos el argumento igual a la base: $a = b \implies \log_b(b) = c \iff b^c = b$.
  2. Por la propiedad del exponente unitario de las potencias reales: $b^1 = b$.
  3. Al comparar los exponentes de $b^c = b^1$, se concluye que $c = 1$.
  4. Por lo tanto, $\log_b(b) = 1$.

  ### Síntesis didáctica
  - Propiedad de identidad: Coincidencia entre la base del subíndice y el argumento.
  - Coordenada en la función: Determina que la gráfica de $f(x) = \log_b(x)$ contiene obligatoriamente al punto $(b, 1)$.
definiciones_clave: |
  - **Logaritmo de la base**: Resultado unitario $\log_b(b) = 1$ obtenido cuando el argumento coincide exactamente con la base.
  - **Punto de control $(b, 1)$**: Coordenada cartesiana que depende de la base y permite graficar la función logarítmica.
  - **Exponente unitario $b^1 = b$**: Propiedad de potencias que sustenta la igualdad.
propiedades_relaciones: |
  - **Simplificación de expresiones compuestas**: Permite reducir logaritmos como $\log_2(2) = 1$ o $\log_a(a) = 1$ en simplificaciones algebraicas.
  - **Identidad con la función identidad**: Es el caso particular de $\log_b(b^x) = x$ cuando $x = 1$.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico de la expresión $M = \frac{\log_4(4) + \log_9(9)}{\log_6(6)}$.'
  pasos:
    - 'Paso 1: Aplicamos la propiedad al primer término del numerador: $\log_4(4) = 1$ pues $4^1 = 4$.'
    - 'Paso 2: Aplicamos la propiedad al segundo término del numerador: $\log_9(9) = 1$ pues $9^1 = 9$.'
    - 'Paso 3: Aplicamos la propiedad al denominador: $\log_6(6) = 1$ pues $6^1 = 6$.'
    - 'Paso 4: Sustituimos en la fracción y resolvemos: $M = \frac{1 + 1}{1} = \frac{2}{1} = 2$.'
checkpoints:
