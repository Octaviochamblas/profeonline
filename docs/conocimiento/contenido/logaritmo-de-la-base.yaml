afirmaciones_verdaderas:
  - 'El logaritmo de la base en cualquier sistema logarítmico válido es numéricamente igual a uno: $\log_b(b) = 1$.'
  - 'La propiedad $\log_b(b) = 1$ determina que la curva de la función logarítmica $f(x) = \log_b(x)$ pasa siempre por el punto $(b, 1)$.'
al_terminar_debes_poder: 'Identificar y calcular el valor unitario de cualquier logaritmo cuyo argumento coincida con su base ($\log_b(b) = 1$).'
