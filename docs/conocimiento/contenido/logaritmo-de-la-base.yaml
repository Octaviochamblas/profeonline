semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DE_LA_BASE
resumen_inicial: El logaritmo de la base es siempre igual a uno ($\log_b(b) = 1$ para
  $b > 0, b \neq 1$).
explicacion_simple: 'Como cualquier número elevado al exponente 1 da exactamente el
  mismo número ($b^1 = b$), el logaritmo donde el argumento es igual a la base vale
  siempre 1:

  - $\log_3(3) = 1$

  - $\log_{10}(10) = 1$

  - $\ln(e) = 1$'
explicacion_formal: Para todo $b > 0, b \neq 1$, la propiedad de identidad del exponente
  establece $b^1 = b$. Por la definición de logaritmo se concluye $\log_b(b) = 1$.
definiciones_clave: '- **Propiedad del logaritmo de la base**: $\log_b(b) = 1$.'
propiedades_relaciones: '- **Identidad fundamental**: Identifica la coincidencia entre
  base y argumento.'
ejemplo_guiado:
  enunciado: Simplifica la expresión $\frac{\log_4(4) + \log_9(9)}{\log_6(6)}$.
  pasos:
  - 'Aplicar $\log_b(b) = 1$ a cada término:'
  - $\log_4(4) = 1$
  - $\log_9(9) = 1$
  - $\log_6(6) = 1$
  - 'Sustituir y calcular: $\frac{1 + 1}{1} = \frac{2}{1} = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_{50}(50)$?
  choices:
  - text: '1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '50'
    is_correct: false
  - text: '25'
    is_correct: false
  explanation: 'La correcta es: 1. El logaritmo de la base siempre es 1.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\ln(e)$.
  choices:
  - text: '1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: e
    is_correct: false
  - text: '10'
    is_correct: false
  explanation: 'La correcta es: 1. $\ln(e) = \log_e(e) = 1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si el argumento y la base son exactamente el mismo número.'
- 'Paso 2: Reemplazar la expresión por 1.'
errores_correccion: No confundas $\log_b(b) = 1$ con $\log_b(1) = 0$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_8(8)$.
  alternativas:
  - '1'
  - '0'
  - '8'
  respuesta: '1'
  solucion_pasos:
  - $\log_8(8) = 1$.
errores_frecuentes:
- Confundir el resultado 1 con 0.
afirmaciones_verdaderas:
- $\log_b(b) = 1$ para todo $b > 0, b \neq 1$.
al_terminar_debes_poder: Evaluar instantáneamente logaritmos cuya base coincide con
  el argumento.
fuente: Texto escolar MINEDUC.
estado: publicado
