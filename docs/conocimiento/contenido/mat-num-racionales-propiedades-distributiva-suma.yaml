semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.DISTRIBUTIVA_SUMA
resumen_inicial: La propiedad distributiva de la multiplicación respecto de la suma establece que $q_1 \cdot (q_2 + q_3) = (q_1 \cdot q_2) + (q_1 \cdot q_3)$.
explicacion_simple: 'La propiedad distributiva nos permite multiplicar un número racional por una suma de dos maneras distintas: resolviendo primero la suma de los paréntesis y luego multiplicando, o multiplicando el racional por cada uno de los sumandos por separado y sumando los productos obtenidos al final.


  ![Propiedad distributiva del producto respecto de la suma](/static/img/nodos/propiedad-distributiva-del-producto-respecto-de-la-suma-intro.svg)'
explicacion_formal: 'Para cualesquiera tres racionales $q_1, q_2, q_3 \in \mathbb{Q}$, la **Distributividad del Producto respecto a la Suma** establece:


  $$q_1 \cdot (q_2 + q_3) = (q_1 \cdot q_2) + (q_1 \cdot q_3)$$


  **Desglose de la fórmula:**

  - Desarrollo de paréntesis: Distribución directa del factor $q_1$ sobre cada sumando del paréntesis.

  - Factorización (factor común): Proceso inverso $(q_1 \cdot q_2) + (q_1 \cdot q_3) = q_1 \cdot (q_2 + q_3)$.


  > **Complemento didáctico:** Es la propiedad fundamental que sostiene los métodos de factorización de algebra sobre los números racionales.'
definiciones_clave: '- **Propiedad distributiva respecto a la suma**: Regla $q_1 \cdot (q_2 + q_3) = q_1 q_2 + q_1 q_3$ que conecta la multiplicación y la adición.'
propiedades_relaciones: '- **Conexión operacional**: Enlaza algebraicamente las operaciones de adición y multiplicación en $\mathbb{Q}$.'
ejemplo_guiado:
  enunciado: 'Verifique la propiedad distributiva evaluando $\frac{1}{2} \cdot \left(\frac{1}{3} + \frac{1}{4}\right)$ de dos formas distintas.


    ![Ejemplo Propiedad distributiva del producto respecto de la suma](/static/img/nodos/propiedad-distributiva-del-producto-respecto-de-la-suma-ejemplos.svg)'
  pasos:
  - 'Paso 1: Vía paréntesis directo: $\frac{1}{3} + \frac{1}{4} = \frac{7}{12} \implies \frac{1}{2} \cdot \frac{7}{12} = \frac{7}{24}$.'
  - 'Paso 2: Vía distribución: $\left(\frac{1}{2} \cdot \frac{1}{3}\right) + \left(\frac{1}{2} \cdot \frac{1}{4}\right) = \frac{1}{6} + \frac{1}{8}$.'
  - 'Paso 3: Sumar homogenizando a 24-avos: $\frac{4}{24} + \frac{3}{24} = \frac{7}{24}$.'
  - 'Conclusión: Ambos métodos entregan exactamente $\frac{7}{24}$, confirmando la distributividad.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión de la propiedad distributiva del producto respecto de la suma?
  choices:
  - text: q1 · (q2 + q3) = q1 · q2 + q1 · q3
    is_correct: true
  - text: q1 + (q2 · q3) = (q1 + q2) · (q1 + q3)
    is_correct: false
  - text: q1 · (q2 + q3) = q1 + q2 + q3
    is_correct: false
  - text: q1 · (q2 + q3) = q2 · q3
    is_correct: false
  explanation: La alternativa correcta es 'q1 · (q2 + q3) = q1 · q2 + q1 · q3'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 1/2 · (1/3 + 1/4), ¿cuál fue el resultado idéntico obtenido por ambos caminos?
  choices:
  - text: 7/24
    is_correct: true
  - text: 2/12
    is_correct: false
  - text: 1/2
    is_correct: false
  - text: 5/24
    is_correct: false
  explanation: La alternativa correcta es '7/24'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar el factor exterior por el primer sumando del paréntesis ($q_1 \cdot q_2$).'
- 'Paso 2: Multiplicar el factor exterior por el segundo sumando del paréntesis ($q_1 \cdot q_3$).'
- 'Paso 3: Sumar ambos productos resultantes para obtener $(q_1 \cdot q_2) + (q_1 \cdot q_3)$.'
errores_correccion: '- **Error 1: Multiplicar el factor exterior solo por el primer sumando ($q_1 \cdot (q_2 + q_3) = q_1 q_2 + q_3$).** **Cómo corregirlo:** El factor $q_1$ DEBE multiplicarse por TODOS los sumandos dentro del paréntesis.


  - **Error 2: Intentar distribuir una suma sobre un producto ($q_1 + (q_2 \cdot q_3)$).** **Cómo corregirlo:** Es la MULTIPLICACIÓN la que se distribuye sobre la suma, no al revés.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplique la propiedad distributiva a $2 \cdot (1/4 + 3/4)$.
  alternativas:
  - 2 · 1/4 + 2 · 3/4 = 2/4 + 6/4 = 8/4 = 2
  - 2 · 4/4 = 8/4
  - 2 + 1 = 3
  respuesta: 2 · 1/4 + 2 · 3/4 = 2/4 + 6/4 = 8/4 = 2
  solucion_pasos:
  - 'Distribuyendo: $2/4 + 6/4 = 8/4 = 2$.'
- titulo: Ejemplo 2
  enunciado: ¿Es la expresión $(3/5 \cdot 1/2) + (3/5 \cdot 1/2)$ equivalente a $3/5 \cdot (1/2 + 1/2)$ por factor común?
  alternativas:
  - Sí, factorizando por el término común 3/5
  - No, son distintas
  - Solo si es impar
  respuesta: Sí, factorizando por el término común 3/5
  solucion_pasos:
  - 'Factorización de la propiedad distributiva: $3/5 \cdot (1/2 + 1/2) = 3/5 \cdot 1 = 3/5$.'
- titulo: ¿Se cumple q1 · (q2 + q3) = q1 · q2 + q1 · q3 para cualesquiera tres racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación distribuye sobre la adición en $\mathbb{Q}$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
- titulo: ¿Es 1/3 · (3 + 6) igual a 1/3 · 3 + 1/3 · 6?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos lados evalúan exactamente al entero 3.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
errores_frecuentes:
- Multiplicar una fracción por un paréntesis con suma requiere multiplicar únicamente el primer término.
- La adición se distribuye sobre la multiplicación según la regla $a + (b \cdot c) = (a + b) \cdot (a + c)$.
- Distribuir una multiplicación altera el valor final de la expresión respecto a resolver el paréntesis.
- La propiedad distributiva solo aplica cuando las fracciones tienen denominadores primos.
- Factorizar por un término común invierte los signos negativos del paréntesis.
afirmaciones_verdaderas:
- 'La multiplicación en $\mathbb{Q}$ es distributiva respecto a la adición: $q_1 \cdot (q_2 + q_3) = q_1 q_2 + q_1 q_3$.'
- La propiedad permite expandir expresiones algebraicas o factorizar sacando el término común $q_1$.
al_terminar_debes_poder: '**QUÉ:** Expandir y factorizar expresiones racionales aplicando la distributividad del producto respecto de la suma.


  **CÓMO:** Aplicando la igualdad $a \cdot (b + c) = a \cdot b + a \cdot c$ hacia adelante para distribuir multiplicadores, o en sentido inverso $a \cdot b + a \cdot c = a \cdot (b + c)$ para extraer factor común racional.


  ![Resumen Propiedad distributiva del producto respecto de la suma](/static/img/nodos/propiedad-distributiva-del-producto-respecto-de-la-suma-resumen.svg)'
