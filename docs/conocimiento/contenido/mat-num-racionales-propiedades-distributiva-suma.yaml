semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.DISTRIBUTIVA_SUMA
resumen_inicial: "La propiedad distributiva del producto respecto de la suma establece que multiplicar un número racional por una suma equivale a multiplicar dicho número por cada sumando y luego sumar los productos."
explicacion_simple: |
  La **propiedad distributiva** conecta la multiplicación con la suma. Si tienes que calcular $\frac{1}{2} \times \left(\frac{1}{3} + \frac{1}{4}\right)$, tienes dos caminos idénticos para llegar al resultado:
  1. O resuelves primero la suma entre paréntesis y luego multiplicas.
  2. O 'distribuyes' la multiplicación: multiplicas $\frac{1}{2} \times \frac{1}{3}$ y le sumas $\frac{1}{2} \times \frac{1}{4}$.
  Ambos caminos te darán exactamente el mismo resultado final ($\frac{7}{24}$). Esta propiedad también funciona al revés para 'sacar factor común'.
explicacion_formal: |
  Formalmente, el conjunto de los números racionales $\mathbb{Q}$ satisface la **propiedad distributiva del producto respecto de la adición**:
  $$\forall q_1, q_2, q_3 \in \mathbb{Q}, \quad q_1 \cdot (q_2 + q_3) = q_1 \cdot q_2 + q_1 \cdot q_3$$

  Por conmutatividad del producto, la distributividad por la derecha también se cumple:
  $$(q_2 + q_3) \cdot q_1 = q_2 \cdot q_1 + q_3 \cdot q_1$$

  Operación inversa (Factorización por Factor Común):
  $$q_1 \cdot q_2 + q_1 \cdot q_3 = q_1 \cdot (q_2 + q_3)$$
definiciones_clave: |
  - **Propiedad distributiva del producto respecto a la suma**: Ley estructural $q_1 \cdot (q_2 + q_3) = q_1 \cdot q_2 + q_1 \cdot q_3$.
  - **Factorización por factor común**: Procedimiento inverso que extrae un factor racional compartido $q_1$ hacia fuera de un paréntesis.
  - **Expansión de paréntesis**: Aplicación directa de la distributividad para eliminar un paréntesis multiplicativo.
propiedades_relaciones: |
  - **Unificación de operaciones en el cuerpo $\mathbb{Q}$**: Es el único axioma que vincula de manera directa las dos operaciones fundamentales $(+)$ y $(\cdot)$.
  - **Simplificación de sumas algebraicas**: Permite factorizar numeradores o denominadores en polinomios y expresiones con fracciones.
  - **Uso en cálculo mental**: Permite resolver productos de racionales por números mixtos $a \cdot \left(B + \frac{c}{d}\right) = a \cdot B + a \cdot \frac{c}{d}$.
ejemplo_guiado:
  enunciado: "Calcula de dos maneras la expresión $\\frac{3}{5} \\cdot \\left(\\frac{1}{2} + \\frac{1}{3}\\right)$ para comprobar la propiedad distributiva."
  pasos:
    - 'Camino 1 (Directo con paréntesis): resolver la suma interna $\frac{1}{2} + \frac{1}{3} = \frac{3 + 2}{6} = \frac{5}{6}$.'
    - 'Multiplicar: $\frac{3}{5} \cdot \frac{5}{6} = \frac{15}{30} = \frac{1}{2}$.'
    - 'Camino 2 (Distributivo): distribuir $\frac{3}{5} \cdot \frac{1}{2} + \frac{3}{5} \cdot \frac{1}{3}$.'
    - 'Calcular productos: $\frac{3}{10} + \frac{3}{15} = \frac{3}{10} + \frac{1}{5}$.'
    - 'Sumar homogenizando a $10$: $\frac{3}{10} + \frac{2}{10} = \frac{5}{10} = \frac{1}{2}$.'
    - 'Concluir: en ambos caminos el resultado es $\frac{1}{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la expresión equivalente a $q_1 \\cdot (q_2 + q_3)$ según la propiedad distributiva en $\\mathbb{Q}$?"
    choices:
      - {text: "$q_1 \\cdot q_2 + q_1 \\cdot q_3$", is_correct: true}
      - {text: "$q_1 + q_2 \\cdot q_3$", is_correct: false}
      - {text: "$(q_1 + q_2) \\cdot (q_1 + q_3)$", is_correct: false}
      - {text: "$q_1 \\cdot q_2 \\cdot q_3$", is_correct: false}
    explanation: 'La correcta es $q_1 \cdot q_2 + q_1 \cdot q_3$: distribuye el factor $q_1$ a cada uno de los sumandos.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cómo se simplifica la suma $\\frac{4}{7} \\cdot \\frac{2}{9} + \\frac{4}{7} \\cdot \\frac{7}{9}$ aplicando factor común?"
    choices:
      - {text: '\$\frac{4}{7}$ \\cdot \\left(\$\frac{2}{9}$ + \$\frac{7}{9}$\\right) = \$\frac{4}{7}$ \\cdot 1 = \$\frac{4}{7}$', is_correct: true}
      - {text: '\$\frac{8}{63}$ + \$\frac{28}{63}$ = \$\frac{36}{63}$', is_correct: false}
      - {text: '\$\frac{4}{7}$ + \$\frac{9}{9}$', is_correct: false}
      - {text: "1", is_correct: false}
    explanation: "La correcta es \\frac{4}{7} \\cdot \\left(\\frac{2}{9} + \\frac{7}{9}\\right) = \\frac{4}{7} \\cdot 1 = \\frac{4}{7}: al factorizar por $\\frac{4}{7}$, la suma interna resulta $\\frac{9}{9} = 1$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el factor multiplicativo $q_1$ y la suma entre paréntesis $(q_2 + q_3)$."
  - 'Paso 2: Multiplicar $q_1$ por el primer sumando: $q_1 \cdot q_2$.'
  - 'Paso 3: Multiplicar $q_1$ por el segundo sumando: $q_1 \cdot q_3$.'
  - 'Paso 4: Sumar ambos productos parciales: $q_1 \cdot q_2 + q_1 \cdot q_3$.'
  - "Paso 5: Simplificar el resultado final."
errores_correccion: |
  Un error clásico al aplicar la distributiva es multiplicar el factor solo por el primer término del paréntesis y olvidar multiplicarlo por el segundo (hacer $a \cdot (b + c) = a \cdot b + c$). ¡Recuerda que **el factor se distribuye a TODOS los términos dentro del paréntesis**!
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Aplica la propiedad distributiva a $\\frac{2}{3} \\cdot \\left(\\frac{3}{4} + \\frac{6}{5}\\right)$."
    alternativas:
      - '\$\frac{2}{3}$ \\cdot \$\frac{3}{4}$ + \$\frac{2}{3}$ \\cdot \$\frac{6}{5}$ = \$\frac{1}{2}$ + \$\frac{4}{5}$ = \$\frac{13}{10}$'
      - '\$\frac{2}{3}$ \\cdot \$\frac{3}{4}$ + \$\frac{6}{5}$'
      - '\$\frac{2}{3}$ + \$\frac{3}{4}$ \\cdot \$\frac{6}{5}$'
    respuesta: '\$\frac{2}{3}$ \\cdot \$\frac{3}{4}$ + \$\frac{2}{3}$ \\cdot \$\frac{6}{5}$ = \$\frac{1}{2}$ + \$\frac{4}{5}$ = \$\frac{13}{10}$'
    solucion_pasos:
      - 'Distribución: $\frac{2}{3} \cdot \frac{3}{4} + \frac{2}{3} \cdot \frac{6}{5}$.'
      - 'Primer producto: $\frac{6}{12} = \frac{1}{2}$.'
      - 'Segundo producto: $\frac{12}{15} = \frac{4}{5}$.'
      - 'Suma: $\frac{1}{2} + \frac{4}{5} = \frac{5+8}{10} = \frac{13}{10}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Factoriza mediante factor común la expresión $\\frac{5}{8} \\cdot \\frac{3}{7} + \\frac{5}{8} \\cdot \\frac{4}{7}$."
    alternativas:
      - '\$\frac{5}{8}$'
      - '\$\frac{35}{56}$'
      - '\$\frac{5}{7}$'
    respuesta: '\$\frac{5}{8}$'
    solucion_pasos:
      - 'Factor común $\frac{5}{8}$: $\frac{5}{8} \cdot \left(\frac{3}{7} + \frac{4}{7}\right)$.'
      - 'Suma interna: $\frac{3+4}{7} = \frac{7}{7} = 1$.'
      - 'Resultado: $\frac{5}{8} \cdot 1 = \frac{5}{8}$.'
  - titulo: "¿Se aplica la propiedad distributiva del producto sobre la suma de tres o más sumandos dentro del paréntesis?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, $q_1 \cdot (a + b + c) = q_1 \cdot a + q_1 \cdot b + q_1 \cdot c$.'
  - titulo: "¿Es la adición distributiva respecto de la multiplicación?"
    respuesta: "No"
    solucion_pasos:
      - 'No, $a + (b \cdot c) \neq (a + b) \cdot (a + c)$ en $\mathbb{Q}$.'
errores_frecuentes:
  - "Multiplicar el factor exterior solo por el primer sumando del paréntesis."
  - "Sumar en lugar de multiplicar al distribuir."
  - "Confundir la propiedad distributiva del producto sobre la suma con una supuesta distributividad de la suma sobre el producto."
  - "No reconocer la posibilidad de sacar factor común para simplificar cálculos."
  - "Olvidar los signos negativos al distribuir un factor negativo."
afirmaciones_verdaderas:
  - "La multiplicación de números racionales es distributiva respecto de la adición."
  - 'La expresión $q_1 \cdot (q_2 + q_3)$ es equivalente a $q_1 \cdot q_2 + q_1 \cdot q_3$.'
al_terminar_debes_ponder: |
  Debes ser capaz de aplicar la propiedad distributiva del producto respecto de la suma tanto para expandir paréntesis como para extraer factores comunes.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
