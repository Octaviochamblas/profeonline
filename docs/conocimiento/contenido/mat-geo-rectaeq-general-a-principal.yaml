semantic_id: MAT.GEO.RECTA_ECUACIONES.GENERAL_A_PRINCIPAL
resumen_inicial: 'Conversión de la ecuación general a la forma principal: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Para identificar rápidamente la pendiente y el coeficiente de
  posición de una recta dada en forma general, conviene despejar y para obtener su
  forma principal equivalente.
explicacion_formal: '![Conversión: forma general a principal](/static/img/geometria/analitica/rectaeq-general-a-principal.svg)


  ### Definición formal


  De $Ax+By+C=0$, despejando $y$: $By=-Ax-C$, por lo que $y=-\dfrac{A}{B}x-\dfrac{C}{B}$,
  siempre que $B\neq0$.


  ### Desarrollo didáctico


  Para la ecuación $3x+2y-6=0$: despejando, $2y=-3x+6$, por lo que $y=-1{,}5x+3$,
  obteniendo $m=-1{,}5$ y $b=3$.'
definiciones_clave: '- **Conversión de la ecuación general a la forma principal**:
  Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a conversión de la ecuación general a la forma
  principal.'
ejemplo_guiado:
  enunciado: En la resolución de conversión de la ecuación general a la forma principal,
    se considera la recta que pasa por $P(7, 7)$ con parámetro o pendiente $m = 1228$.
    Determina la ecuación o valor característico.
  pasos:
  - Aplicar la ecuación o fórmula propia de conversión de la ecuación general a la
    forma principal.
  - Sustituir el punto $P(7, 7)$ y el parámetro $m = 1228$.
  - Obtener el resultado final para conversión de la ecuación general a la forma principal.
