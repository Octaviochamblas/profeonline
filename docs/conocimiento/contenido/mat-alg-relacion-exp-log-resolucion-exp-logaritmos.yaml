semantic_id: MAT.ALG.RELACION_EXP_LOG.RESOLUCION_EXP_LOGARITMOS
resumen_inicial: 'La resolución de ecuaciones exponenciales con bases incompatibles aplica logaritmos a ambos miembros para bajar los exponentes mediante la propiedad $\log(u^v) = v \cdot \log(u)$.'
explicacion_simple: |
  Cuando nos enfrentamos a una ecuación exponencial donde las bases de ambos lados son completamente distintas y no se pueden igualar (como $2^x = 5^{x-1}$), el método infalible consiste en aplicar logaritmos (decimales $\log$ o naturales $\ln$) a ambos lados de la igualdad. Al hacer esto, usamos la propiedad de la potencia para "bajar" las variables de los exponentes y resolver una ecuación lineal tradicional.
explicacion_formal: |
  ### Definición formal
  El procedimiento analítico de **resolución de ecuaciones exponenciales heterogéneas** $A^{P(x)} = B^{Q(x)}$ con $A \neq B$ se fundamenta en la aplicación de la función logarítmica monótona e inyectiva a ambos miembros:
  $$A^{P(x)} = B^{Q(x)} \iff \ln\left(A^{P(x)}\right) = \ln\left(B^{Q(x)}\right)$$
  Aplicando la propiedad del logaritmo de una potencia:
  $$P(x) \cdot \ln(A) = Q(x) \cdot \ln(B)$$
  lo que convierte la ecuación exponencial trascendente en una ecuación sintáctica lineal o cuadrática en $x$.

  ### Desglose simbólico
  - Ecuaciones de dos potencias heterogéneas simples $A^x = B$:
    $$\ln(A^x) = \ln(B) \implies x \ln(A) = \ln(B) \implies x = \frac{\ln(B)}{\ln(A)}$$
  - Ecuaciones con exponentes lineales compuestos $A^{kx + m} = B^{px + q}$:
    $$(kx + m) \ln(A) = (px + q) \ln(B) \implies k \ln(A) \cdot x + m \ln(A) = p \ln(B) \cdot x + q \ln(B)$$
    Despejando $x$:
    $$x [k \ln(A) - p \ln(B)] = q \ln(B) - m \ln(A) \implies x = \frac{q \ln(B) - m \ln(A)}{k \ln(A) - p \ln(B)}$$

  ### Síntesis didáctica
  Elección indistinta de la base logarítmica: Se puede aplicar logaritmo decimal $\log_{10}$ o logaritmo natural $\ln$. El resultado numérico final $x$ es exactamente idéntico. En la práctica universitaria y PAES M2, se prefiere el uso del logaritmo natural $\ln$.
definiciones_clave: |
  - **Ecuaciones exponenciales heterogéneas**: Igualdades exponenciales con bases que no comparten una potencia prima común.
  - **Aplicación de logaritmos a miembros**: Operación de tomar $\ln(\cdot)$ a ambos lados preservando la igualdad.
  - **Bajada del exponente $P(x) \cdot \ln(A)$**: Aplicación de la regla de la potencia para linealizar la incógnita.
propiedades_relaciones: |
  - **Invariancia del valor real por base de logaritmo**: La solución $x = \frac{\log(B)}{\log(A)}$ es idéntica a $x = \frac{\ln(B)}{\ln(A)}$ por la fórmula de cambio de base.
  - **Condición de positivismo de las bases**: Exige que las bases $A > 0$ y $B > 0$ sean números estrictamente positivos.
ejemplo_guiado:
  enunciado: 'Resuelve exactamente la ecuación exponencial con bases distintas $3^x = 7^{x - 1}$ mediante la aplicación de logaritmos naturales.'
  pasos:
    - 'Paso 1: Aplicamos $\ln$ a ambos miembros de la ecuación: $\ln(3^x) = \ln(7^{x - 1})$.'
    - 'Paso 2: Bajamos los exponentes multiplicando por fuera: $x \cdot \ln(3) = (x - 1) \cdot \ln(7)$.'
    - 'Paso 3: Distribuimos el miembro derecho: $x \cdot \ln(3) = x \cdot \ln(7) - \ln(7)$.'
    - 'Paso 4: Agrupamos los términos con $x$ a un solo lado: $\ln(7) = x \cdot \ln(7) - x \cdot \ln(3)$.'
    - 'Paso 5: Factorizamos $x$: $\ln(7) = x [\ln(7) - \ln(3)] \implies x = \frac{\ln(7)}{\ln(7) - \ln(3)}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la solución exacta de la ecuación exponencial $5^x = 12$ obtenida al aplicar logaritmos naturales?'
    choices:
      - {text: '$x = \frac{\ln(12)}{\ln(5)}$', is_correct: true}
      - {text: '$x = \frac{\ln(5)}{\ln(12)}$', is_correct: false}
      - {text: '$x = \ln(12) - \ln(5)$', is_correct: false}
      - {text: '$x = \frac{12}{5}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{\ln(12)}{\ln(5)}$''. Aplicando $\ln$ a ambos lados: $\ln(5^x) = \ln(12) \implies x \ln(5) = \ln(12) \implies x = \frac{\ln(12)}{\ln(5)}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación $2^{x + 1} = 3^x$, ¿cuál es la expresión despejada de $x$?'
    choices:
      - {text: '$x = \frac{\ln(2)}{\ln(3) - \ln(2)}$', is_correct: true}
      - {text: '$x = \frac{\ln(3)}{\ln(2)}$', is_correct: false}
      - {text: '$x = \ln(2) \cdot \ln(3)$', is_correct: false}
      - {text: '$x = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{\ln(2)}{\ln(3) - \ln(2)}$''. Tomamos $\ln$: $(x+1)\ln(2) = x \ln(3) \implies x \ln(2) + \ln(2) = x \ln(3) \implies \ln(2) = x(\ln 3 - \ln 2) \implies x = \frac{\ln(2)}{\ln(3) - \ln(2)}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que la ecuación exponencial posea bases que no se pueden reducir a una base común entera.'
  - 'Paso 2: Aplicar logaritmo natural $\ln(\cdot)$ o decimal $\log(\cdot)$ a ambos miembros de la ecuación.'
  - 'Paso 3: Extraer los exponentes multiplicando por fuera de los logaritmos mediante la propiedad $\ln(A^k) = k \cdot \ln(A)$.'
  - 'Paso 4: Distribuir los paréntesis, agrupar todos los términos con la variable $x$ a un lado, factorizar $x$ y despejar.'
errores_correccion: |
  - **Error 1:** Intentar restar o dividir las bases directamente (ej: en $2^x = 5^x$ decir que $x = 5 - 2 = 3$). **Cómo corregirlo:** Las bases no se pueden operar directamente si tienen exponentes variables. Se deben aplicar logaritmos para bajar los exponentes.
  - **Error 2:** Olvidar distribuir el logaritmo al bajar un exponente compuesto (ej: escribir $\ln(7^{x-1})$ como $x - 1 \ln(7)$ sin paréntesis). **Cómo corregirlo:** El exponente compuesto debe llevar paréntesis obligatorio: $(x - 1) \cdot \ln(7) = x \ln(7) - \ln(7)$.
ejemplos:
  - titulo: 'Despeje con logaritmo decimal'
    enunciado: '¿La solución de $4^x = 15$ es $x = \frac{\log(15)}{\log(4)}$?'
    alternativas:
      - 'Sí'
      - 'No, es $x = \frac{\log(4)}{\log(15)}$'
      - 'No, es $x = \frac{15}{4}$'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Aplicamos $\log$: $\log(4^x) = \log(15) \implies x \log(4) = \log(15)$.'
      - '2. Despejamos: $x = \frac{\log(15)}{\log(4)}$.'
  - titulo: 'Ecuación con base e e incompatible'
    enunciado: 'Para $e^x = 2^x \cdot 5$, ¿aplicar $\ln$ ayuda a despejar $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\ln(e^x) = \ln(2^x \cdot 5) \implies x = x \ln(2) + \ln(5) \implies x(1 - \ln 2) = \ln(5) \implies x = \frac{\ln 5}{1 - \ln 2}$.'
  - titulo: 'Igualdad de resultados por cualquier base'
    enunciado: '¿El resultado de resolver $3^x = 10$ da el mismo número al usar $\ln$ o $\log$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{\ln(10)}{\ln(3)} = \frac{\log(10)}{\log(3)}$ por la propiedad de cambio de base.'
  - titulo: 'Factorización de la variable'
    enunciado: 'En $x \ln(5) - x \ln(2) = \ln(7)$, ¿factorizar $x(\ln 5 - \ln 2)$ permite despejar $x = \frac{\ln 7}{\ln(5/2)}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x(\ln 5 - \ln 2) = x \ln(5/2) = \ln(7) \implies x = \frac{\ln(7)}{\ln(5/2)}$.'
errores_frecuentes:
  - 'La solución de la ecuación $2^x = 3$ se calcula dividiendo $3 / 2 = 1.5$.'
  - 'Al bajar el exponente compuesto en $\ln(5^{x+2})$, se escribe $x + 2 \ln(5)$ olvidando los paréntesis.'
  - 'Aplicar logaritmo natural $\ln$ a la ecuación $4^x = 9$ da un resultado distinto que aplicar logaritmo decimal $\log$.'
  - 'En la ecuación $3^x = 5^{x+1}$, se pueden cancelar las $x$ dividiendo ambos lados por $x$.'
  - 'Para despejar $x$ en $2^x = -5$, se aplica logaritmo obteniendo $x = \frac{\ln(-5)}{\ln(2)}$.'
afirmaciones_verdaderas:
  - 'Para resolver ecuaciones exponenciales con bases heterogéneas $A^{P(x)} = B^{Q(x)}$, se aplican logaritmos a ambos miembros para linealizar los exponentes.'
  - 'La solución obtenida $x = \frac{\ln(B)}{\ln(A)}$ es independiente de la base del logaritmo utilizado debido a la propiedad de cambio de base.'
al_terminar_debes_poder: 'Resolver ecuaciones exponenciales con bases heterogéneas aplicando logaritmos y distribuyendo términos algebraicos.'
