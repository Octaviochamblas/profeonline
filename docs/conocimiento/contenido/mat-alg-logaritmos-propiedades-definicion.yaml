semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.DEFINICION
resumen_inicial: 'El logaritmo $\log_b(a) = c$ es el exponente $c$ al cual se debe elevar una base $b > 0, b \neq 1$ para obtener un argumento $a > 0$.'
explicacion_simple: |
  Un logaritmo responde a la pregunta de un exponente desconocido: *¿a qué número debo elevar esta base para obtener este resultado?* Por ejemplo, si nos preguntan cuánto vale $\log_2(8)$, estamos buscando el exponente al que hay que elevar el 2 para llegar a 8. Como $2^3 = 8$, el resultado del logaritmo es 3. El logaritmo es simplemente la operación inversa de elevar a una potencia.
explicacion_formal: |
  ### Definición formal
  El **logaritmo** en base $b$ de un número $a$ se define como la función biyectiva inversa de la función exponencial. Dados $a \in \mathbb{R}^+$ y $b \in \mathbb{R}^+ \setminus \{1\}$, el valor $c = \log_b(a)$ es el único número real que satisface la equivalencia fundamental:
  $$\log_b(a) = c \iff b^c = a$$

  ### Desglose simbólico
  - $b$: **Base del logaritmo** ($b > 0, b \neq 1$).
  - $a$: **Argumento del logaritmo** ($a > 0$).
  - $c$: **Valor del logaritmo** ($c \in \mathbb{R}$), el cual representa el exponente.
  - Logaritmo decimal (base 10): $\log_{10}(a) = \log(a)$.
  - Logaritmo natural (base $e$): $\log_e(a) = \ln(a)$.

  ### Síntesis didáctica
  Relación de tríada algebraica: La ecuación exponencial $b^c = a$, la ecuación radical $\sqrt[c]{a} = b$ y la ecuación logarítmica $\log_b(a) = c$ representan exactamente la misma relación entre tres números, despejando el resultado, la base o el exponente respectivamente.
definiciones_clave: |
  - **Logaritmo $\log_b(a)$**: Exponente $c$ necesario para elevar la base $b$ y obtener $a$.
  - **Argumento del logaritmo**: Expresión o valor $a > 0$ evaluado dentro de la función logarítmica.
  - **Base del logaritmo**: Subíndice $b > 0, b \neq 1$ que define la escala de potenciación.
propiedades_relaciones: |
  - **Inversión funcional**: $b^{\log_b(a)} = a$ y $\log_b(b^c) = c$ para todo $a > 0$ y $c \in \mathbb{R}$.
  - **Identidad de argumento 1**: $\log_b(1) = 0$ debido a la regla de potencias $b^0 = 1$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto de los siguientes logaritmos aplicando la definición formal: A) $\log_3(81)$, B) $\log_5\left(\frac{1}{25}\right)$, C) $\log_{10}(1000)$.'
  pasos:
    - 'Paso 1: Para $\log_3(81) = c$, planteamos la forma exponencial $3^c = 81$. Como $3^4 = 81$, concluimos que $c = 4$.'
    - 'Paso 2: Para $\log_5\left(\frac{1}{25}\right) = c$, planteamos $5^c = \frac{1}{25} = 5^{-2}$. Igualando exponentes obtenemos $c = -2$.'
    - 'Paso 3: Para $\log_{10}(1000) = c$, planteamos $10^c = 1000 = 10^3$, por lo que $c = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del logaritmo $\log_2(64)$ aplicando la definición formal de logaritmo?'
    choices:
      - {text: '$6$, porque $2^6 = 64$', is_correct: true}
      - {text: '$32$, porque $64 / 2 = 32$', is_correct: false}
      - {text: '$8$, porque $8^2 = 64$', is_correct: false}
      - {text: '$128$, porque $2 \cdot 64 = 128$', is_correct: false}
    explanation: 'La alternativa correcta es ''$6$, porque $2^6 = 64$''. El logaritmo $\log_2(64)$ es el exponente al que elevamos la base 2 para obtener 64.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si sabemos que $4^{-3} = \frac{1}{64}$, ¿cómo se expresa esta igualdad en forma de logaritmo?'
    choices:
      - {text: '$\log_4\left(\frac{1}{64}\right) = -3$', is_correct: true}
      - {text: '$\log_{-3}(4) = \frac{1}{64}$', is_correct: false}
      - {text: '$\log_{1/64}(-3) = 4$', is_correct: false}
      - {text: '$\log_4(-3) = \frac{1}{64}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\log_4\left(\frac{1}{64}\right) = -3$''. La base 4 pasa a ser subíndice, el resultado $\frac{1}{64}$ es el argumento y $-3$ es el valor del logaritmo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la base $b$ y el argumento $a$ en la expresión $\log_b(a)$.'
  - 'Paso 2: Plantear la ecuación exponencial equivalente $b^c = a$.'
  - 'Paso 3: Expresar el argumento $a$ como una potencia de la base $b$ ($a = b^k$).'
  - 'Paso 4: Igualar los exponentes para concluir que $\log_b(a) = k$.'
errores_correccion: |
  - **Error 1:** Dividir el argumento por la base en lugar de buscar el exponente (ej: decir $\log_2(8) = 4$ porque $8 / 2 = 4$). **Cómo corregirlo:** El logaritmo no es una división. Es la búsqueda del exponente $c$ tal que $b^c = a$. Puesto que $2^3 = 8$, $\log_2(8) = 3$.
  - **Error 2:** Creer que un logaritmo no puede dar como resultado un número negativo. **Cómo corregirlo:** El valor del logaritmo $c$ sí puede ser negativo cuando el argumento es una fracción positiva menor que 1 (ej: $\log_2(0.5) = -1$).
ejemplos:
  - titulo: 'Cálculo de logaritmo entero'
    enunciado: '¿Cuánto vale $\log_5(125)$?'
    alternativas:
      - '$3$'
      - '$25$'
      - '$5$'
    respuesta: '$3$'
    solucion_pasos:
      - '1. Planteamos $5^c = 125$.'
      - '2. Como $5^3 = 125$, el resultado es $3$.'
  - titulo: 'Logaritmo de una fracción'
    enunciado: '¿Cuál es el valor de $\log_3\left(\frac{1}{9}\right)$?'
    respuesta: '-2'
    solucion_pasos:
      - '1. Planteamos $3^c = \frac{1}{9} = 3^{-2}$.'
      - '2. Por lo tanto, $c = -2$.'
  - titulo: 'Logaritmo decimal sin base escrita'
    enunciado: 'Si se escribe $\log(100)$ sin subíndice, ¿se asume base 10 dando como resultado 2?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cuando la base no se escribe, corresponde al logaritmo decimal $\log_{10}(100) = 2$ pues $10^2 = 100$.'
  - titulo: 'Logaritmo de argumento fraccionario'
    enunciado: '¿El logaritmo $\log_2(\sqrt{2})$ es igual a $\frac{1}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Escribimos $\sqrt{2} = 2^{1/2} \implies \log_2\left(2^{1/2}\right) = \frac{1}{2}$.'
errores_frecuentes:
  - 'El valor de $\log_3(9)$ es igual a 3 porque 9 dividido por 3 es igual a 3.'
  - 'Un logaritmo no puede dar como resultado un número real negativo.'
  - 'En la expresión $\log_b(a) = c$, el número $a$ representa la base del logaritmo.'
  - 'El logaritmo decimal $\log(1000)$ es igual a 100.'
  - 'La expresión $\log_2(8) = 3$ equivale a la potencia $3^2 = 8$.'
afirmaciones_verdaderas:
  - 'La equivalencia fundamental $\log_b(a) = c \iff b^c = a$ establece que el logaritmo calcula el exponente de la base $b$.'
  - 'El valor resultante de un logaritmo puede ser cualquier número real (positivo, negativo o cero).'
al_terminar_debes_poder: 'Aplicar la definición formal de logaritmo para calcular valores numéricos y convertir expresiones entre forma exponencial y logarítmica.'
