- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en teorema general
  de tales en rectas paralelas cortadas por transversales.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en teorema general
  de tales en rectas paralelas cortadas por transversales.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de teorema
  general de tales en rectas paralelas cortadas por transversales.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
