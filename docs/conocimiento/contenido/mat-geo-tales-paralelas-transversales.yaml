semantic_id: MAT.GEO.TEOREMA_TALES.PARALELAS_TRANSVERSALES
resumen_inicial: 'Teorema general de Tales en rectas paralelas cortadas por transversales:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: Cuando un conjunto de rectas paralelas es atravesado por dos rectas
  transversales, se genera una relación de proporcionalidad muy útil entre los segmentos
  formados, conocida como teorema de Tales.
explicacion_formal: '![Teorema de Tales en rectas paralelas](/static/img/geometria/congruencia-semejanza/tales-paralelas-transversales.svg)


  ### Definición formal


  Si las rectas paralelas $L_1$, $L_2$, $L_3$ son cortadas por las transversales $t_1$
  y $t_2$ en los puntos A, B, C (en $t_1$) y A'', B'', C'' (en $t_2$), entonces $\frac{AB}{BC}=\frac{A''B''}{B''C''}$.


  ### Desarrollo didáctico


  Este teorema es la base de la proporcionalidad en geometría: no importa la distancia
  entre las paralelas ni el ángulo de las transversales, la razón entre segmentos
  correspondientes se mantiene siempre igual.'
definiciones_clave: '- **Teorema general de Tales en rectas paralelas cortadas por
  transversales**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a teorema general de tales en rectas paralelas
  cortadas por transversales.'
ejemplo_guiado:
  enunciado: En la aplicación de teorema general de tales en rectas paralelas cortadas
    por transversales, se establece una razón $k = 2.4$ entre dos figuras homólogas
    de longitud original $L = 20\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de teorema general de tales en rectas paralelas
    cortadas por transversales.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.4 \cdot 20$.'
  - Concluir que la medida obtenida en teorema general de tales en rectas paralelas
    cortadas por transversales es $L' = 48.0\text{ cm}$.
