- titulo: ¿Se cumple siempre la propiedad principal de teorema general de tales en
    rectas paralelas cortadas por transversales en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede teorema general de tales en rectas paralelas cortadas por transversales
    asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en teorema general de tales en rectas
