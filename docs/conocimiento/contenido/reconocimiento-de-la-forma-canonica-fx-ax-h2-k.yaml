semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_CANONICA
resumen_inicial: 'La forma canónica de una función cuadrática representa su regla mediante la expresión $f(x) = a(x - h)^2 + k$, visibilizando de manera directa las coordenadas de su vértice $V(h, k)$.'
explicacion_simple: |
  La forma canónica es una manera alternativa y muy conveniente de escribir una función cuadrática. En lugar de tener tres términos sumados como en la forma general, la forma canónica utiliza un binomio al cuadrado con la estructura $a(x - h)^2 + k$. Su ventaja principal es que permite leer la ubicación del vértice $V(h, k)$ de inmediato sin hacer cálculos adicionales.
explicacion_formal: |
  ### Definición formal
  La **forma canónica** (o forma vértice) de una función cuadrática es la expresión algebraica equivalente dada por:
  $$f(x) = a(x - h)^2 + k$$
  donde $a \in \mathbb{R} \setminus \{0\}$, y el par ordenado $(h, k) \in \mathbb{R}^2$ representa exactamente las coordenadas del vértice de la parábola.

  ### Desglose simbólico
  - $a$: Coeficiente multiplicativo idéntico al de la forma general que gobierna la concavidad y apertura de las ramas.
  - $h$: Abscisa del vértice. En la notación $(x - h)^2$, la resta muestra el desplazamiento horizontal respecto al origen.
  - $k$: Ordenada del vértice. Representa la constante libre que traslada verticalmente la gráfica.

  ### Síntesis didáctica
  Toda función cuadrática $f(x) = ax^2 + bx + c$ puede expresarse en forma canónica mediante el método de completación de cuadrados o utilizando las fórmulas $h = -\frac{b}{2a}$ y $k = f(h)$.
definiciones_clave: |
  - **Forma canónica**: Expresión funcional del tipo $f(x) = a(x - h)^2 + k$ centrada en el vértice.
  - **Parámetro de desplazamiento horizontal $h$**: Valor que traslada la parábola $h$ unidades hacia la derecha (si $h > 0$) o hacia la izquierda (si $h < 0$).
  - **Parámetro de desplazamiento vertical $k$**: Valor que traslada la parábola $k$ unidades hacia arriba (si $k > 0$) o hacia abajo (si $k < 0$).
propiedades_relaciones: |
  - **Traslación rígida de la parábola patrón**: La gráfica de $f(x) = a(x - h)^2 + k$ es una traslación rígida de la parábola base $y = ax^2$, desplazada $h$ unidades horizontalmente y $k$ unidades verticalmente.
  - **Eje de simetría inmediato**: La recta del eje de simetría se extrae directamente del paréntesis cuadrado como $x = h$.
ejemplo_guiado:
  enunciado: 'Verifica que la función $f(x) = 2(x - 3)^2 + 1$ está escrita en forma canónica, identifica los valores de los parámetros $a$, $h$ y $k$, y especifica la ubicación de su vértice $V(h, k)$.'
  pasos:
    - 'Paso 1: Comparamos la estructura dada $f(x) = 2(x - 3)^2 + 1$ con la forma canónica patrón $a(x - h)^2 + k$.'
    - 'Paso 2: Identificamos el coeficiente externo $a = 2$.'
    - 'Paso 3: Identificamos el término dentro del binomio al cuadrado: $(x - 3) = (x - h) \implies h = 3$.'
    - 'Paso 4: Identificamos la constante sumada externamente $k = 1$.'
    - 'Paso 5: Concluimos que la función está en forma canónica con $a = 2$, $h = 3$, $k = 1$, y su vértice es $V(3, 1)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dada la función cuadrática $g(x) = -4(x + 5)^2 - 2$, ¿cuáles son los valores de los parámetros $h$ y $k$ de su forma canónica?'
    choices:
      - {text: '$h = -5$ y $k = -2$', is_correct: true}
      - {text: '$h = 5$ y $k = -2$', is_correct: false}
      - {text: '$h = -5$ y $k = 2$', is_correct: false}
      - {text: '$h = 4$ y $k = -2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$h = -5$ y $k = -2$''. Reescribimos el binomio como $(x - (-5))^2$, de donde $h = -5$, mientras que la constante externa es $k = -2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué información geométrica entrega de forma inmediata la forma canónica $f(x) = a(x - h)^2 + k$ sin realizar cálculos adicionales?'
    choices:
      - {text: 'Las coordenadas del vértice $V(h, k)$ y el eje de simetría $x = h$', is_correct: true}
      - {text: 'Los dos ceros de la función en el eje $x$', is_correct: false}
      - {text: 'La intersección con el eje $y$ únicamente', is_correct: false}
      - {text: 'El grado polinomial y la cantidad de asíntotas', is_correct: false}
    explanation: 'La alternativa correcta es ''Las coordenadas del vértice $V(h, k)$ y el eje de simetría $x = h$''. La forma canónica está diseñada para leer directamente el vértice.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reconocer la presencia de un binomio de primer grado elevado al cuadrado $(x - h)^2$.'
  - 'Paso 2: Identificar el coeficiente multiplicativo $a$ fuera del paréntesis y la constante libre $k$ sumada o restada.'
  - 'Paso 3: Extraer las coordenadas del vértice $V(h, k)$ considerando la inversión de signo del número dentro del paréntesis cuadrático.'
errores_correccion: |
  - **Error 1:** Confundir el signo de la abscisa $h$ al leer la forma canónica (ej: en $(x + 2)^2$ decir que $h = 2$). **Cómo corregirlo:** La fórmula base exige un signo menos $(x - h)^2$. Por lo tanto, $(x + 2)^2 = (x - (-2))^2$, haciendo que $h = -2$.
  - **Error 2:** Creer que la constante $k$ de la forma canónica representa la intersección con el eje $y$. **Cómo corregirlo:** La constante $k$ representa la ordenada del vértice. La intersección con el eje $y$ se obtiene evaluando $f(0) = a(-h)^2 + k = ah^2 + k$.
ejemplos:
  - titulo: 'Identificación de la forma canónica'
    enunciado: '¿Cuál de las siguientes expresiones corresponde a una función cuadrática en forma canónica?'
    alternativas:
      - '$f(x) = 3(x - 1)^2 + 4$'
      - '$f(x) = 3x^2 - 6x + 7$'
      - '$f(x) = 3(x - 1)(x + 2)$'
    respuesta: '$f(x) = 3(x - 1)^2 + 4$'
    solucion_pasos:
      - '1. La forma canónica exige la estructura $a(x - h)^2 + k$.'
      - '2. La expresión $3(x - 1)^2 + 4$ contiene el binomio al cuadrado $(x - 1)^2$ y la constante externa $+4$.'
      - '3. Por lo tanto, es la única en forma canónica.'
  - titulo: 'Forma canónica con k = 0'
    enunciado: '¿La función $g(x) = -2(x - 7)^2$ se encuentra en forma canónica?'
    alternativas:
      - 'Sí, con $a = -2$, $h = 7$ y $k = 0$'
      - 'No, le falta el término independiente'
      - 'No, es una función lineal'
    respuesta: 'Sí, con $a = -2$, $h = 7$ y $k = 0$'
    solucion_pasos:
      - '1. Reescribimos $g(x) = -2(x - 7)^2 + 0$.'
      - '2. Mantiene la estructura canónica con constante $k = 0$ y vértice $V(7, 0)$.'
  - titulo: 'Preservación del coeficiente a'
    enunciado: '¿El coeficiente $a$ en la forma canónica $f(x) = a(x - h)^2 + k$ es igual al coeficiente $a$ de la forma general $f(x) = ax^2 + bx + c$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El parámetro $a$ multiplicativo es idéntico en todas las representaciones cuadráticas de la misma función.'
  - titulo: 'Eje de simetría en forma canónica'
    enunciado: 'Dada $f(x) = 5(x - 2)^2 - 9$, ¿la recta $x = 2$ representa su eje de simetría?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La abscisa $h = 2$ del paréntesis determina directamente la recta del eje de simetría $x = 2$.'
errores_frecuentes:
  - 'En la forma canónica $f(x) = (x + 3)^2 + 5$, la abscisa del vértice es $h = 3$.'
  - 'La constante $k$ de la forma canónica $f(x) = a(x - h)^2 + k$ representa la intersección de la parábola con el eje $y$.'
  - 'La forma canónica $f(x) = a(x - h)^2 + k$ se convierte en función cubica al elevar al cuadrado.'
  - 'Si el parámetro $h = 0$, la función deja de estar en forma canónica.'
  - 'El coeficiente $a$ en la forma canónica adquiere un valor diferente al de la forma general.'
afirmaciones_verdaderas:
  - 'La forma canónica $f(x) = a(x - h)^2 + k$ permite extraer de forma directa las coordenadas del vértice $V(h, k)$.'
  - 'El parámetro $h$ en $(x - h)^2$ invierte su signo visible al determinar la abscisa del vértice.'
