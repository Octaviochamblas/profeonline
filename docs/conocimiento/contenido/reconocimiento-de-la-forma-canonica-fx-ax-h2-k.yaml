semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_CANONICA
resumen_inicial: 'Reconocimiento de la forma canónica f(x) = a(x - h)² + k: parábola,
  vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Existe una manera de escribir una función cuadrática donde el
  vértice de su parábola queda "a la vista", sin necesidad de calcularlo con fórmulas
  adicionales.
explicacion_formal: '### Definición formal


  La forma canónica de una función cuadrática es $f(x)=a(x-h)^2+k$, con $a \neq 0$
  y $h,k \in \mathbb{R}$. Esta forma es algebraicamente equivalente a la forma general
  $ax^2+bx+c$, pero expone directamente las coordenadas del vértice como el par $(h,k)$.


  ### Desarrollo didáctico


  Al observar una función en forma canónica, basta con identificar los valores de
  $h$ y $k$ (prestando atención al signo de $h$, ya que aparece restado dentro del
  paréntesis) para conocer inmediatamente el vértice.


  En $f(x)=2(x-3)^2+5$: el vértice es $(3,5)$, leído directamente de los valores $h=3$
  y $k=5$.'
definiciones_clave: '- **Reconocimiento de la forma canónica f(x) = a(x - h)² + k**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  reconocimiento de la forma canónica f(x) = a(x - h)² + k.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando reconocimiento
    de la forma canónica f(x) = a(x - h)² + k.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a reconocimiento
    de la forma canónica f(x) = a(x - h)² + k.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
