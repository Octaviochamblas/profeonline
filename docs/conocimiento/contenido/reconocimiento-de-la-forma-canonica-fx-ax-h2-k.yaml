procedimiento:
- 'Paso 1: Verifica que la función esté expresada como $a(x-h)^2+k$.'
- 'Paso 2: Identifica el valor de $h$, recordando que en la forma canónica aparece
  con signo restado.'
- 'Paso 3: Identifica el valor de $k$, que aparece sumado fuera del paréntesis.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en reconocimiento de la forma canónica f(x) = a(x
  - h)² + k.
ejemplos:
- titulo: Reconocimiento de una función en forma canónica
  enunciado: ¿Está $f(x)=-3(x+2)^2-1$ en forma canónica?
  solucion_pasos:
  - Tiene la estructura $a(x-h)^2+k$, con $a=-3$.
  - Sí, está en forma canónica.
- titulo: Reconocimiento de una función que no está en forma canónica
  enunciado: ¿Está $f(x)=x^2+4x+3$ en forma canónica?
  solucion_pasos:
  - No tiene la estructura de un binomio al cuadrado más una constante.
  - No, está en forma general.
- titulo: ¿La forma canónica y la forma general representan siempre la misma función?
  enunciado: ¿La forma canónica y la forma general representan siempre la misma función?
  respuesta: Sí
  solucion_pasos:
  - Ambas formas son algebraicamente equivalentes; solo difieren en cómo se presenta
    la misma regla.
- titulo: ¿El valor de $h$ en la forma canónica aparece con el mismo signo dentro
    del paréntesis?
  enunciado: ¿El valor de $h$ en la forma canónica aparece con el mismo signo dentro
    del paréntesis?
  respuesta: 'No'
  solucion_pasos:
  - $h$ aparece restado en $(x-h)$; si la función tiene $(x+2)$, entonces $h=-2$,
    no $2$.
errores_frecuentes:
- Confundir el signo de $h$ al leerlo directamente de $(x+2)^2$ en vez de reescribirlo
  como $(x-(-2))^2$.
- Confundir la forma canónica con la forma factorizada de la función.
- Olvidar el coeficiente $a$ al identificar la forma canónica, asumiendo siempre $a=1$.
- No reconocer una función en forma canónica cuando $k=0$ y el término no aparece
  explícitamente.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  reconocimiento de la forma canónica f(x) = a(x - h)² + k.
