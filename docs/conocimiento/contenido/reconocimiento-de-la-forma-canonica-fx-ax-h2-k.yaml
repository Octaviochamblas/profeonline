semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_CANONICA
resumen_inicial: La forma canónica o de vértice $f(x) = a(x - h)^2 + k$ es la representación de la función cuadrática que explicita directamente las coordenadas del vértice $V(h, k)$ y el factor de dilatación/concavidad $a$ ($a \neq 0$).
explicacion_simple: "![La forma canónica o de vértice $f(x) = a(x - h)^2 + k$ es la representación de la función cuadrática que explicita directamente las coordenadas del vértice $V(h, k)$ y el factor de dilatación/concavidad $a$ ($a \\neq 0$)](/static/img/nodos/reconocimiento-de-la-forma-canonica-fx-ax-h2-k-intro.svg)\n\n\nLa **forma canónica** (o forma de vértice) es la manera más cómoda de escribir una parábola si quieres saber dónde está su vértice de inmediato:\n$$f(x) = a(x - h)^2 + k$$\n\n- **El vértice se lee a simple vista:** Es el punto **$(h, k)$**.\n- **¡Cuidado con la trampa del signo!**\n  - El número dentro del paréntesis tiene un signo menos por defecto $(x - h)$.\n  - Si ves $f(x) = 2(x - 3)^2 + 5 \\implies$ el vértice es **$(3, 5)$**.\n  - Si ves $f(x) = 2(x + 4)^2 - 7 \\implies$ el vértice es **$(-4, -7)$** (porque $+4 = -(-4)$)."
explicacion_formal: 'Sea $f: \mathbb{R} \to \mathbb{R}$ una función cuadrática. Su **forma canónica traslacional** es:

  $$f(x) = a(x - h)^2 + k, \quad a \in \mathbb{R} \setminus \{0\}, \; h, k \in \mathbb{R}$$


  **Propiedades algebraicas y geométricas**:

  1. **Invarianza de vértice**: La función alcanza su único extremo en $x = h$ con valor $f(h) = a(0)^2 + k = k$, fijando $V(h, k)$.

  2. **Eje de simetría inmediato**: La recta vertical es $\mathcal{L}: x = h$.

  3. **Generación por transformaciones rígidas**: $f(x)$ resulta de trasladar la parábola base $y = ax^2$ en $h$ unidades horizontalmente y $k$ unidades verticalmente.'
definiciones_clave: '- **Forma canónica de vértice**: Expresión $a(x - h)^2 + k$ que parametriza la parábola por su punto extremo $(h, k)$.

  - **Vector de traslación**: Vector $\vec{v} = (h, k)$ que desplaza el vértice desde el origen $(0, 0)$.'
propiedades_relaciones: '- **Equivalencia canónica**: $ax^2 + bx + c \equiv a(x - h)^2 + k$ con $h = -\frac{b}{2a}$ y $k = c - \frac{b^2}{4a}$.

  - **Recorrido inmediato**: Si $a > 0 \implies \text{Rec}(f) = [k, +\infty[$; si $a < 0 \implies \text{Rec}(f) = ]-\infty, k]$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La forma canónica o de vértice $f(x) = a(x - h)^2 + k$ es la representación de la función cuadrática que explicita directamente las coordenadas del vértice $V(h, k)$ y el factor de dilatación/concavidad $a$ ($a \neq 0$)](/static/img/nodos/reconocimiento-de-la-forma-canonica-fx-ax-h2-k-ejemplos.svg)



    Reconoce la forma canónica, identifica los parámetros $(a, h, k)$ y enuncia el vértice de la función $f(x) = -3(x - 4)^2 + 10$.'
  pasos:
  - 'Paso 1: Comparar con el modelo general $a(x - h)^2 + k$:

    - Coeficiente principal fuera del binomio: $a = -3$.

    - Término dentro del binomio $(x - 4) \implies h = 4$.

    - Constante exterior sumada: $k = 10$.'
  - 'Paso 2: Formular el vértice: $V(h, k) = V(4, 10)$.'
  - 'Paso 3: Analizar la concavidad: Como $a = -3 < 0$, la parábola abre hacia abajo y $V(4, 10)$ es un **máximo absoluto**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el vértice de la función cuadrática $f(x) = 5(x + 2)^2 - 9$?
  choices:
  - text: V(-2, -9)
    is_correct: true
  - text: V(2, -9)
    is_correct: false
  - text: V(-2, 9)
    is_correct: false
  - text: V(2, 9)
    is_correct: false
  explanation: La alternativa correcta es 'V(-2, -9)'. Como $(x + 2) = (x - (-2))$, $h = -2$ y $k = -9 \implies V(-2, -9)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene vértice en (6, -1) y coeficiente a = -1, ¿cuál es su forma canónica?
  choices:
  - text: f(x) = -(x - 6)² - 1
    is_correct: true
  - text: f(x) = -(x + 6)² - 1
    is_correct: false
  - text: f(x) = (x - 6)² - 1
    is_correct: false
  - text: f(x) = -(x - 1)² + 6
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = -(x - 6)² - 1'. Sustituyendo $a = -1, h = 6, k = -1$ se obtiene $-(x - 6)^2 - 1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la función esté estructurada en la forma $f(x) = a(x - h)^2 + k$.'
- 'Paso 2: Extraer el coeficiente exterior $a$.'
- 'Paso 3: Extraer la abscisa $h$ cambiando el signo del término dentro del paréntesis.'
- 'Paso 4: Extraer la ordenada $k$ conservando su signo exacto.'
- 'Paso 5: Escribir el vértice $V(h, k)$.'
errores_correccion: '- **Error común:** Escribir $h = 3$ para la función $(x + 3)^2$.

  - **Cómo corregirlo:** La fórmula es $(x - h)$, por lo que **$(x + 3)$ corresponde a $h = -3$**.'
ejemplos:
- titulo: 'Ejemplo 1: Vértice directo con signos negativos'
  enunciado: En $f(x) = 4(x - 7)^2 - 12$, ¿cuál es el vértice?
  alternativas:
  - V(7, -12)
  - V(-7, -12)
  - V(7, 12)
  - V(-7, 12)
  respuesta: V(7, -12)
  solucion_pasos:
  - 'Paso 1: $h = 7, k = -12 \implies V(7, -12)$.'
- titulo: 'Ejemplo 2: Vértice con binomio sumado'
  enunciado: Para $g(x) = -(x + 1)^2 + 8$, ¿dónde está el vértice?
  alternativas:
  - V(-1, 8)
  - V(1, 8)
  - V(-1, -8)
  - V(1, -8)
  respuesta: V(-1, 8)
  solucion_pasos:
  - 'Paso 1: $h = -1, k = 8 \implies V(-1, 8)$.'
- titulo: 'Ejemplo 3: Parábola sin traslación vertical'
  enunciado: ¿Qué vértice tiene $h(x) = 3(x - 5)^2$?
  alternativas:
  - V(5, 0)
  - V(-5, 0)
  - V(0, 5)
  - V(5, 3)
  respuesta: V(5, 0)
  solucion_pasos:
  - 'Paso 1: $k = 0 \implies V(5, 0)$.'
- titulo: 'Ejemplo 4: Parábola sin traslación horizontal'
  enunciado: ¿Qué vértice tiene $f(x) = -2x^2 + 9$?
  alternativas:
  - V(0, 9)
  - V(9, 0)
  - V(0, -9)
  - V(-2, 9)
  respuesta: V(0, 9)
  solucion_pasos:
  - 'Paso 1: $h = 0, k = 9 \implies V(0, 9)$.'
errores_frecuentes:
- No invertir el signo de h al extraer la abscisa.
- Invertir innecesariamente el signo de k.
- Confundir la forma canónica con la factorizada.
afirmaciones_verdaderas:
- La forma canónica f(x) = a(x - h)² + k revela directamente el vértice V(h, k).
- El eje de simetría de la función en forma canónica es la recta vertical x = h.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar la forma canónica de vértice f(x) = a(x - h)² + k.


  **CÓMO:** Identificando los parámetros a, h y k para deducir el vértice V(h, k) y el eje de simetría x = h.


