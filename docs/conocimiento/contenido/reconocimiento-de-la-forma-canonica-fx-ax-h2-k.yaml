semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_CANONICA
resumen_inicial: La forma canónica expresa la función cuadrática como $f(x) = a(x - h)^2 + k$, visibilizando directamente el vértice $V(h, k)$.
explicacion_simple: |
  La **forma canónica o forma del vértice** es una manera especial de escribir una función cuadrática:

  $$f(x) = a(x - h)^2 + k$$

  **¿Por qué es tan útil?**
  - Porque te muestra **DE INMEDIATO LAS COORDENADAS DEL VÉRTICE $V(h, k)$** sin tener que hacer fórmulas ni cálculos.
  - **Ejemplo**: En $f(x) = 2(x - 3)^2 + 5$:
    - El vértice es directamente **$V(3, 5)$**.
    - El coeficiente $a = 2$ te indica que es cóncava hacia arriba.
explicacion_formal: |
  Sea la función cuadrática $f: \mathbb{R} \to \mathbb{R}$. La **forma canónica (o canónica del vértice)** representa la función mediante la expresión binómica trasladada:

  $$f(x) = a(x - h)^2 + k \quad \text{con } a \neq 0, \, h, k \in \mathbb{R}$$

  **Interpretación geométrica de los parámetros:**
  - $a$: Coeficiente cuadrático de dilatación/compresión y signo de concavidad.
  - $h$: Desplazamiento horizontal de la parábola base $y = ax^2$, definiendo la recta del eje de simetría $x = h$.
  - $k$: Desplazamiento vertical de la parábola base, definiendo la altura del extremo $y = k$.
definiciones_clave: |
  - **Forma canónica**: Expresión funcional $f(x) = a(x - h)^2 + k$ que explicita las transformaciones geométricas y las coordenadas del vértice $V(h, k)$.
propiedades_relaciones: |
  - **Equivalencia con la forma general**: Desarrollando el cuadrado de binomio $a(x - h)^2 + k = a(x^2 - 2hx + h^2) + k = ax^2 - 2ahx + (ah^2 + k)$, se recupera la forma general $ax^2 + bx + c$.
ejemplo_guiado:
  enunciado: 'Reconoce si la función $f(x) = -3(x + 4)^2 - 2$ está en forma canónica y determina su vértice y concavidad.'
  pasos:
    - 'Paso 1: Verificar la estructura $a(x - h)^2 + k$: coincide con $a = -3$, $h = -4$ y $k = -2$.'
    - 'Paso 2: Concluir que la expresión efectivamente corresponde a la forma canónica.'
    - 'Paso 3: Identificar las coordenadas del vértice: $V(h, k) = V(-4, -2)$.'
    - 'Paso 4: Identificar la concavidad: como $a = -3 < 0$, la parábola es cóncava hacia abajo.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ventaja principal ofrece presentar una función cuadrática en forma canónica $f(x) = a(x - h)^2 + k$?'
    choices:
      - {text: 'Permite leer de manera inmediata las coordenadas del vértice $V(h, k)$', is_correct: true}
      - {text: 'Entrega directamente los puntos de corte con el eje X sin operar.', is_correct: false}
      - {text: 'Muestra directamente el término independiente $c$ de la forma general.', is_correct: false}
      - {text: 'Anula el coeficiente cuadrático $a$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Permite leer de manera inmediata las coordenadas del vértice $V(h, k)$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la función en forma canónica $f(x) = 5(x - 1)^2 + 8$, ¿cuál es el valor del parámetro $h$?'
    choices:
      - {text: '$h = 1$', is_correct: true}
      - {text: '$h = -1$', is_correct: false}
      - {text: '$h = 5$', is_correct: false}
      - {text: '$h = 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$h = 1$''. Como la fórmula es $a(x - h)^2 + k$, el término $(x - 1)$ implica $h = 1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Observar si la función presenta la estructura $a(x - h)^2 + k$ con un binomio al cuadrado.'
  - 'Paso 2: Comparar la expresión dada con la fórmula modelo $f(x) = a(x - h)^2 + k$.'
  - 'Paso 3: Extraer los valores numéricos de $a$, $h$ y $k$.'
  - 'Paso 4: Enunciar el vértice $V(h, k)$ y la concavidad según el signo de $a$.'
errores_correccion: |
  - **Error común:** Confundir el signo de $h$ en la expresión $(x - h)^2$ (ej. en $(x + 3)^2$ pensar que $h = +3$).
  - **Cómo corregirlo:** El signo dentro del binomio está invertido: **$(x - 3)^2 \implies h = +3$** y **$(x + 3)^2 \implies h = -3$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Reconocimiento de canónica con h positivo.
    alternativas:
      - 'Forma canónica con V(2, 7) y a = 4'
      - 'Forma canónica con V(-2, 7) y a = 4'
      - 'Forma general con c = 7'
    respuesta: 'Forma canónica con V(2, 7) y a = 4'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Reconocimiento de canónica con h negativo.
    alternativas:
      - 'Forma canónica con V(-5, -1) y a = -1'
      - 'Forma canónica con V(5, -1) y a = -1'
      - 'Forma factorizada'
    respuesta: 'Forma canónica con V(-5, -1) y a = -1'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 2(x + 3)^2 - 5$, es correcto afirmar que la abscisa de su vértice es $h = 3$.'
  - 'La forma canónica $f(x) = a(x - h)^2 + k$ carece del coeficiente cuadrático $a$ de la función.'
  - 'La suposición de que el parámetro $k$ de la forma canónica representa el punto de corte con el eje Y.'
  - 'El intercambio entre los valores de $h$ y $k$ escribiendo la coordenada del vértice como $V(k, h)$.'
  - 'Afirmar que la forma canónica solo existe para funciones cuadráticas con discriminante positivo.'
afirmaciones_verdaderas:
  - 'La forma canónica $f(x) = a(x - h)^2 + k$ explicita de forma inmediata las coordenadas del vértice $V(h, k)$.'
  - 'En la expresión $(x - h)^2$, un signo positivo interno $(x + c)^2$ indica que la abscisa del vértice es negativa $h = -c$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer la forma canónica $f(x) = a(x - h)^2 + k$ y extraer sus componentes principales.
  CÓMO: Identificar la estructura binómica al cuadrado, extraer $a, h, k$ y formular las coordenadas del vértice $V(h, k)$.
