semantic_id: MAT.GEO.TRIG_NOTABLES.SENO_COSENO_COMPLEMENTARIOS
resumen_inicial: 'Relación entre seno y coseno de ángulos complementarios: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo Rectángulo.'
explicacion_simple: En un triángulo rectángulo, los dos ángulos agudos son complementarios
  (suman 90°), y esto genera una relación directa entre el seno de uno y el coseno
  del otro.
explicacion_formal: '![Complementariedad seno-coseno](/static/img/geometria/trigonometria/razon-notable-seno-coseno-complementarios.svg)


  ### Definición formal


  En un triángulo rectángulo, los ángulos agudos $\theta$ y $90°-\theta$ son complementarios.
  El cateto opuesto a $\theta$ es exactamente el cateto adyacente a $90°-\theta$ (y
  viceversa), lo que da como resultado $\sin\theta=\cos(90°-\theta)$.


  ### Desarrollo didáctico


  Por ejemplo, $\sin30°=\cos60°=0{,}5$, ya que $30°$ y $60°$ son ángulos complementarios
  (suman 90°). Esta relación permite deducir un valor trigonométrico a partir de otro
  ya conocido.'
definiciones_clave: '- **Relación entre seno y coseno de ángulos complementarios**:
  Elemento o propiedad fundamental en el estudio de trigonometría en el triángulo
  rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre seno y coseno de ángulos complementarios.'
ejemplo_guiado:
  enunciado: En el estudio de relación entre seno y coseno de ángulos complementarios,
    un triángulo posee ángulos interiores de medidas $36^\circ$, $4862^\circ$ y $\gamma$.
    Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de relación entre seno y coseno de ángulos complementarios
    y la suma de ángulos interiores.
  - 'Plantear la suma: $36^\circ + 4862^\circ + \gamma = 180^\circ \implies 4898^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4898^\circ = -4718^\circ$.
