procedimiento:
- 'Paso 1: Identifica el ángulo agudo θ y su complementario (90°-θ).'
- 'Paso 2: Reconoce que el cateto opuesto a uno de los ángulos es el adyacente al
  otro (y viceversa).'
- 'Paso 3: Aplica la relación sinθ=cos(90°-θ) para deducir un valor a partir del otro.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con relación entre seno y coseno de ángulos complementarios.
