semantic_id: MAT.GEO.TRIGONOMETRIA_BASICA.TANGENTE_DEFINICION
resumen_inicial: 'Definición de la tangente de un ángulo agudo como razón cateto opuesto
  / cateto adyacente: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: La tercera razón trigonométrica fundamental es la tangente, que
  a diferencia del seno y el coseno, relaciona los dos catetos entre sí, sin involucrar
  la hipotenusa.
explicacion_formal: '![Definición de la tangente](/static/img/geometria/areas-pitagoras/trig-tangente-definicion.svg)


  ### Definición formal


  Dado un ángulo agudo $\alpha$ en un triángulo rectángulo, $\tan(\alpha)=\frac{\text{cateto
  opuesto a }\alpha}{\text{cateto adyacente a }\alpha}=\frac{\text{sen}(\alpha)}{\cos(\alpha)}$.


  ### Desarrollo didáctico


  En un triángulo rectángulo con cateto opuesto a α de 3 cm y cateto adyacente de
  4 cm, $\tan(\alpha)=\frac{3}{4}=0,75$. A diferencia del seno y coseno, la tangente
  puede tomar cualquier valor positivo, ya que no está limitada por la hipotenusa
  como denominador.'
definiciones_clave: '- **Definición de la tangente de un ángulo agudo como razón cateto
  opuesto / cateto adyacente**: Elemento o propiedad fundamental en el estudio de
  perímetros, áreas y teoremas.'
