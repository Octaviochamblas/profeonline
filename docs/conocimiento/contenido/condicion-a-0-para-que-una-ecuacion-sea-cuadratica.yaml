semantic_id: MAT.ALG.EC_CUADR_BASE.CONDICION_A_NO_CERO
resumen_inicial: El coeficiente cuadrático $a$ debe ser obligatoriamente distinto
  de cero ($a \neq 0$) para garantizar la existencia del término de segundo grado.
explicacion_simple: 'En la forma general $a x^2 + b x + c = 0$:

  - Si el coeficiente $a$ fuera cero ($a = 0$), el término $0 \cdot x^2$ desaparecería
  por completo.

  - La ecuación se convertiría en $b x + c = 0$, que es una ecuación lineal de primer
  grado.

  - Por esta razón, la condición indispensable e inviolable de toda ecuación cuadrática
  es **$a \neq 0$**.'
explicacion_formal: 'Sea la expresión $a x^2 + b x + c = 0$. La **condición de existencia
  cuadrática** es el axioma de no anulación del coeficiente principal:


  $$a \in \mathbb{R} \setminus \{0\} \iff a \neq 0$$


  **Desglose de la fórmula:**

  - Si $a = 0 \implies 0 \cdot x^2 + b x + c = 0 \implies b x + c = 0$ (degeneración
  de grado 2 a grado 1).'
definiciones_clave: '- **Coeficiente principal ($a$)**: Coeficiente numérico que multiplica
  al término cuadrático $x^2$.

  - **Degeneración de grado**: Pérdida de la naturaleza cuadrática por anulación del
  coeficiente principal.'
propiedades_relaciones: '- **Independencia de $b$ y $c$**: Los coeficientes $b$ y
  $c$ sí pueden ser cero ($b = 0$ o $c = 0$), pero $a$ JAMÁS puede ser cero.'
ejemplo_guiado:
  enunciado: Determina los valores del parámetro $k$ para los cuales la ecuación $(k
    - 3)x^2 + 5x - 7 = 0$ es efectivamente de segundo grado.
  pasos:
  - 'Paso 1: Identificar el coeficiente cuadrático principal: $a = k - 3$.Paso 2:
    Imponer la condición indispensable de existencia cuadrática: $a \neq 0$.Paso 3:
    Plantear la inecuación de restricción: $k - 3 \neq 0$.Paso 4: Despejar $k$: $k
    \neq 3$.Paso 5: Concluir que la ecuación es de segundo grado para todo $k \in
    \mathbb{R} \setminus \{3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Para que la ecuación $(k - 3)x^2 + 5x - 7 = 0$ sea una ecuación de segundo
    grado, ¿qué restricción debe cumplir $k$?
  choices:
  - text: $k \neq 3$
    is_correct: true
  - text: $k = 3$
    is_correct: false
  - text: $k = 0$
    is_correct: false
  - text: $k > 3$
    is_correct: false
  explanation: La alternativa correcta es '$k \neq 3$'. (Puesto que si $k = 3 \implies
    a = 0$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con la ecuación $a x^2 + b x + c = 0$ si el coeficiente $a$
    toma el valor $0$?
  choices:
  - text: Se degenera en una ecuación de primer grado (lineal) $b x + c = 0$.
    is_correct: true
  - text: Se convierte en una ecuación de tercer grado.
    is_correct: false
  - text: Se transforma en una identidad matemática sin solución.
    is_correct: false
  - text: No le ocurre absolutamente nada y sigue siendo cuadrática.
    is_correct: false
  explanation: La alternativa correcta es 'Se degenera en una ecuación de primer grado
    (lineal) $b x + c = 0$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el coeficiente $a$ que acompaña a $x^2$.'
- 'Paso 2: Si el coeficiente contiene un parámetro, igualarlo a cero para hallar el
  valor prohibido.'
- 'Paso 3: Excluir dicho valor declarando $a \neq 0$.'
errores_correccion: '- **Error común:** Pensar que si $b = 0$ o $c = 0$, la ecuación
  deja de ser de segundo grado.

  - **Cómo corregirlo:** ÚNICAMENTE el coeficiente $a$ debe ser no nulo ($a \neq 0$).
  Si $b=0$ o $c=0$, la ecuación sigue siendo cuadrática (incompleta).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
