semantic_id: MAT.ALG.EC_CUADR_BASE.CONDICION_A_NO_CERO
resumen_inicial: 'Condición a ≠ 0 para que una ecuación sea cuadrática: concepto,
  discriminante, soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: Si el coeficiente que acompaña a $x^2$ vale cero, ese término
  simplemente desaparece, y con él, todo lo que hace "cuadrática" a la ecuación.
explicacion_formal: '### Definición formal


  En la forma general $ax^2+bx+c=0$, la condición $a\neq0$ es parte constitutiva de
  la definición de ecuación de segundo grado. Si $a=0$, la expresión se reduce a $bx+c=0$,
  que es una ecuación de primer grado (si $b\neq0$) o una proposición sin incógnita
  (si además $b=0$).


  ### Desarrollo didáctico


  Antes de aplicar cualquier método propio de ecuaciones cuadráticas (fórmula general,
  discriminante, etc.), conviene verificar que el coeficiente cuadrático realmente
  sea distinto de cero, incluso después de simplificar.


  En $0x^2+4x-8=0$, el coeficiente $a=0$ elimina el término cuadrático, dejando $4x-8=0$,
  que es lineal, no cuadrática.'
definiciones_clave: '- **Condición a ≠ 0 para que una ecuación sea cuadrática**: Elemento
  o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en condición
  a ≠ 0 para que una ecuación sea cuadrática.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando condición a ≠ 0 para
    que una ecuación sea cuadrática.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a condición a ≠ 0 para
    que una ecuación sea cuadrática.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
