procedimiento:
- 'Paso 1: Identifica el coeficiente $a$ que acompaña al término $x^2$.'
- 'Paso 2: Verifica que $a$ sea distinto de cero, incluso tras simplificar la ecuación
  si es necesario.'
- 'Paso 3: Si $a=0$, trata la ecuación como de primer grado (o como una proposición
  sin incógnita), no como cuadrática.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en condición a ≠ 0 para que una ecuación sea cuadrática.
ejemplos:
- titulo: Verificación de la condición sobre a
  enunciado: ¿La ecuación $(k-2)x^2+3x-1=0$ es cuadrática para $k=2$?
  solucion_pasos:
  - Si $k=2$, el coeficiente de $x^2$ es $k-2=0$.
  - No es cuadrática para $k=2$; se reduce a una ecuación lineal.
- titulo: Determinación del valor excluido de un parámetro
  enunciado: ¿Para qué valor de $m$ deja de ser cuadrática la ecuación $(m+5)x^2-x+2=0$?
  solucion_pasos:
  - Se necesita que $m+5=0$.
  - Para $m=-5$, la ecuación deja de ser cuadrática.
- titulo: ¿Una ecuación con $a=0$ y $b=0$ puede seguir teniendo solución en $x$?
  enunciado: ¿Una ecuación con $a=0$ y $b=0$ puede seguir teniendo solución en $x$?
  respuesta: 'No'
  solucion_pasos:
  - Se reduce a una proposición del tipo $c=0$, que no depende de $x$ y no es una
    ecuación en la incógnita.
- titulo: ¿La condición $a \neq 0$ también aplica a $b$ y $c$?
  enunciado: ¿La condición $a \neq 0$ también aplica a $b$ y $c$?
  respuesta: 'No'
  solucion_pasos:
  - Los coeficientes $b$ y $c$ sí pueden valer cero sin afectar que la ecuación siga
    siendo cuadrática.
errores_frecuentes:
- Aplicar la fórmula general o el discriminante a una ecuación donde en realidad $a=0$
  (por ejemplo, tras simplificar un parámetro).
- No verificar el valor de $a$ cuando depende de un parámetro literal.
- Confundir la condición sobre $a$ con una condición sobre $b$ o $c$.
- Asumir que toda ecuación escrita con "$x^2$" visible es automáticamente cuadrática,
  sin revisar el valor real del coeficiente.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando condición
  a ≠ 0 para que una ecuación sea cuadrática.
