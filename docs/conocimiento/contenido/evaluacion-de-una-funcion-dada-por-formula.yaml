procedimiento:
- 'Paso 1: Identifica las subexpresiones de la fórmula (numerador, denominador, radicando,
  etc.).'
- 'Paso 2: Sustituye el valor dado en cada subexpresión.'
- 'Paso 3: Simplifica cada subexpresión de forma independiente.'
- 'Paso 4: Combina los resultados parciales según la estructura de la fórmula original.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar evaluación de una función dada por fórmula.
ejemplos:
- titulo: Evaluación de una fracción algebraica
  enunciado: Si $f(x) = \frac{x^2-1}{x+1}$, calcula $f(4)$.
  solucion_pasos:
  - 'Numerador: $4^2-1 = 15$.'
  - 'Denominador: $4+1 = 5$.'
  - $f(4) = 15/5 = 3$.
- titulo: Evaluación con raíz cuadrada
  enunciado: Si $g(x) = \sqrt{2x+3}$, calcula $g(11)$.
  solucion_pasos:
  - 'Radicando: $2(11)+3 = 25$.'
  - $g(11) = \sqrt{25} = 5$.
- titulo: ¿En $f(x) = \frac{3}{x-2}$, se puede evaluar $f(2)$?
  enunciado: ¿En $f(x) = \frac{3}{x-2}$, se puede evaluar $f(2)$?
  respuesta: 'No'
  solucion_pasos:
  - En x=2 el denominador se anula, x=2 no pertenece al dominio de f.
- titulo: ¿Se debe evaluar el radicando completo antes de extraer la raíz?
  enunciado: ¿Se debe evaluar el radicando completo antes de extraer la raíz?
  respuesta: Sí
  solucion_pasos:
  - La raíz actúa sobre el resultado final del radicando, no sobre cada término por
    separado.
errores_frecuentes:
- Dividir antes de terminar de simplificar completamente el numerador o el denominador.
- Extraer la raíz de cada término del radicando por separado en vez de simplificar
  la suma completa primero.
- Olvidar verificar que el valor sustituido pertenezca al dominio antes de evaluar.
- No usar paréntesis al sustituir en fórmulas con varios términos, causando errores
  de signo.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando evaluación
  de una función dada por fórmula.
