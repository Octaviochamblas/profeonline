semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_FORMULA
resumen_inicial: Evaluar una función dada por una fórmula algebraica permite hallar
  la imagen de constantes o de expresiones compuestas.
explicacion_simple: 'Cuando tenemos una función expresada mediante una fórmula (como
  $f(x) = 3x + 2$), podemos evaluar no solo números simples, sino también expresiones
  algebraicas como $f(a + 1)$ o $f(2x)$.

  Para evaluar $f(a + 1)$, simplemente reemplazamos toda la $x$ de la fórmula por
  la nueva expresión $(a + 1)$:

  $f(a + 1) = 3(a + 1) + 2 = 3a + 3 + 2 = 3a + 5$.'
explicacion_formal: 'Dada la fórmula $f(x)$, la **evaluación sobre una expresión algebraica
  $g(t)$** se define como el mapeo compuesto:


  $$f(g(t)) = \left. f(x) \right|_{x = g(t)}$$


  **Desglose de la fórmula:**

  - Reemplazo simbólico del bloque algebraico $g(t)$ en el lugar de la variable de
  entrada $x$, seguido de la simplificación por distribución.'
definiciones_clave: '- **Evaluación algebraica compuestas**: Sustitución de una expresión
  de variables dentro de la fórmula de otra función.'
propiedades_relaciones: '- **Linealización por distributiva**: Tras sustituir la expresión,
  se aplican las propiedades algebraicas distributivas y de términos semejantes.'
ejemplo_guiado:
  enunciado: Dada la función $f(x) = 5x - 2$, halla la expresión simplificada para
    $f(x + 3)$.
  pasos:
  - 'Paso 1: Tomar la regla de la función $f(x) = 5x - 2$.Paso 2: Reemplazar la variable
    $x$ por el bloque $(x + 3)$: $f(x + 3) = 5(x + 3) - 2$.Paso 3: Aplicar la propiedad
    distributiva: $5 \cdot x + 5 \cdot 3 - 2 = 5x + 15 - 2$.Paso 4: Reducir los términos
    constantes: $5x + 13$.Paso 5: Concluir que $f(x + 3) = 5x + 13$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $f(x + 3)$ en la función $f(x) = 5x - 2$, ¿cuál es la expresión
    reducida resultante?
  choices:
  - text: $f(x + 3) = 5x + 13$
    is_correct: true
  - text: $f(x + 3) = 5x + 15$
    is_correct: false
  - text: $f(x + 3) = 5x + 1$
    is_correct: false
  - text: $f(x + 3) = 15x - 2$
    is_correct: false
  explanation: La alternativa correcta es '$f(x + 3) = 5x + 13$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué propiedad algebraica es fundamental aplicar tras sustituir una expresión
    compuesta en la fórmula?
  choices:
  - text: La propiedad distributiva para eliminar los paréntesis.
    is_correct: true
  - text: La propiedad de tricotomía.
    is_correct: false
  - text: La extracción de raíz cuadrada.
    is_correct: false
  - text: La división por cero.
    is_correct: false
  explanation: La alternativa correcta es 'La propiedad distributiva para eliminar
    los paréntesis.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la estructura de la función reemplazando $x$ por un paréntesis
  grande.'
- 'Paso 2: Introducir la nueva expresión dada dentro de los paréntesis.'
- 'Paso 3: Aplicar la propiedad distributiva o potencias según corresponda.'
- 'Paso 4: Sumar o restar los términos semejantes.'
errores_correccion: '- **Error común:** Escribir $f(x + 3) = f(x) + 3$ (pensar que
  evaluar $x+3$ es simplemente sumar 3 al final).

  - **Cómo corregirlo:** Evaluar $f(x+3)$ requiere multiplicar TODO el bloque $(x+3)$
  por el coeficiente de la función.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de evaluación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de evaluación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Evaluar una función consiste en reemplazar la preimagen x en la fórmula
    y calcular y?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de valorización funcional.
- titulo: ¿Se debe verificar que el número pertenezca al dominio antes de evaluar
    una raíz par?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar raíces de números negativos en $\\mathbb{R}$.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir números negativos al elevar a potencias pares.
- Confundir la búsqueda de una imagen (evaluar $f(a)$) con la búsqueda de una preimagen
  (igualar $f(x) = b$).
- Pensar que la notación $f(x+3)$ equivale simplemente a sumar $3$ al resultado final
  de $f(x)$.
- Intentar evaluar valores que no pertenecen al dominio provocando divisiones por
  cero o raíces pares negativas.
- Buscar preimágenes en el eje vertical $Y$ o imágenes en el eje horizontal $X$ al
  interpretar un gráfico.
afirmaciones_verdaderas:
- Para evaluar una función $f(x)$ se reemplaza la variable $x$ por el valor dado respetando
  la jerarquía operacional.
- Para hallar la preimagen $x$ correspondiente a una imagen $y_0$ se debe resolver
  la ecuación $f(x) = y_0$.
al_terminar_debes_poder: Al finalizar este recurso podrás evaluar funciones a partir
  de fórmulas, tablas o gráficos, y determinar preimágenes respetando las restricciones
  del dominio.
