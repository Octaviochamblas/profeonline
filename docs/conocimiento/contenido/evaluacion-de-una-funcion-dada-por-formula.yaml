semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_FORMULA
resumen_inicial: Evaluar una función dada por fórmula consiste en reemplazar la variable independiente por un valor o expresión dada y simplificar algebraicamente.
explicacion_simple: |
  Evaluar una función $f(x)$ significa tomar el valor que nos entregan y colocarlo exactamente en cada lugar donde aparezca la letra $x$.

  Si $f(x) = x^2 - 3x$, para evaluar en $x = -2$:
  $$f(-2) = (-2)^2 - 3(-2) = 4 + 6 = 10$$

  Es indispensable usar paréntesis para evitar errores de signos en números negativos o potencias.
explicacion_formal: |
  Dada la función $f(x)$ definida por una fórmula explícita en $x$, la **evaluación funcional** en el argumento $a$ se denota por $f(a)$ y representa la imagen calculada mediante la sustitución directa:

  $$f(a) = \text{Regla}(x) \Big|_{x = a}$$

  **Desglose de la fórmula:**
  - $a$: Puede ser una constante numérica ($a \in \mathbb{R}$) o una expresión algebraica (ejemplo $a = x + h$).
definiciones_clave: |
  - **Sustitución directa**: Acción de reemplazar cada presencia de la variable independiente por la expresión de entrada.
propiedades_relaciones: |
  - **Uso de paréntesis en bases negativas**: $(-a)^2 = a^2$, mientras que $-a^2 = -(a^2)$.
ejemplo_guiado:
  enunciado: "Dada la función $f(x) = -2x^2 + 5x - 3$, evalúa la función en $x = -3$."
  pasos:
    - 'Paso 1: Sustituir $x$ por $(-3)$ utilizando paréntesis: $f(-3) = -2(-3)^2 + 5(-3) - 3$.'
    - 'Paso 2: Desarrollar la potencia primero: $(-3)^2 = 9$.'
    - 'Paso 3: Realizar las multiplicaciones: $-2(9) = -18$ y $5(-3) = -15$.'
    - 'Paso 4: Operar las sumas: $f(-3) = -18 - 15 - 3 = -36$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Dada $f(x) = -2x^2 + 5x - 3$, ¿cuál es el resultado de evaluar $f(-3)$?"
    choices:
      - {text: "$-36$", is_correct: true}
      - {text: "$0$", is_correct: false}
      - {text: "$30$", is_correct: false}
      - {text: "$-18$", is_correct: false}
    explanation: "La alternativa correcta es '$-36$'. $-2(-3)^2 + 5(-3) - 3 = -2(9) - 15 - 3 = -18 - 15 - 3 = -36$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si $f(x) = 3x^2$, ¿cuál es el resultado de evaluar $f(2a)$?"
    choices:
      - {text: "$12a^2$", is_correct: true}
      - {text: "$6a^2$", is_correct: false}
      - {text: "$6a$", is_correct: false}
      - {text: "$3a^2$", is_correct: false}
    explanation: "La alternativa correcta es '$12a^2$'. $f(2a) = 3(2a)^2 = 3(4a^2) = 12a^2$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la regla o fórmula explícita de $f(x)$.'
  - 'Paso 2: Escribir el nuevo argumento encerrado entre paréntesis.'
  - 'Paso 3: Sustituir cada $x$ en la fórmula por dicho paréntesis.'
  - 'Paso 4: Operar respetando jerarquía de operaciones y reducir términos semejantes.'
errores_correccion: |
  - **Error común:** Escribir $-3^2 = 9$ sin paréntesis en lugar de $(-3)^2 = 9$.
  - **Cómo corregirlo:** Toda base negativa sustituida en una potencia DEBE llevar paréntesis obligatorio.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de evaluación funcional.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de evaluación funcional.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Al evaluar $f(x) = -x^2$ en $x = -3$, la potencia se calcula como $(-3)^2 = 9$ sin aplicar el signo negativo exterior.'
  - 'Evaluar $f(x + h)$ en $f(x) = x^2$ equivale a la expresión no simplificada $x^2 + h$.'
  - 'En la fórmula $f(x) = 2x - 8$, la evaluación en $x = 0$ devuelve el resultado $x = 4$.'
  - 'Sustituir una variable negativa exige omitir los paréntesis en la base de la potencia.'
  - 'La evaluación funcional modifica la regla de correspondencia original del problema.'
afirmaciones_verdaderas:
  - 'Evaluar una función dada por fórmula consiste en reemplazar la variable independiente por la constante o expresión asignada respetando las reglas algebraicas.'
  - 'El uso de paréntesis al sustituir bases negativas o expresiones compuestas previene errores de signo y distribución.'
al_terminar_debes_poder: |
  QUÉ: Evaluar funciones definidas mediante expresiones algebraicas o fórmulas simbólicas.
  CÓMO: Sustituir la incógnita por el valor o expresión dada empleando paréntesis, efectuar las operaciones respetando la jerarquía y simplificar.
fuente: 'Texto escolar MINEDUC — Álgebra / Evaluación de Funciones'
estado: publicado
