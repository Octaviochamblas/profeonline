semantic_id: MAT.ALG.FUNCION_EVALUACION.EVALUACION_DESDE_FORMULA
resumen_inicial: 'Evaluación de una función dada por fórmula: conceptos, representación
  y propiedades en Evaluación de funciones.'
explicacion_simple: 'Las fórmulas más elaboradas exigen más cuidado, pero el método
  sigue siendo el mismo: sustituir y simplificar, respetando la estructura completa
  de la expresión.'
explicacion_formal: '### Definición formal


  Dada una función $f(x)$ definida mediante una expresión algebraica con múltiples
  operaciones (sumas, productos, cocientes, potencias, raíces), la evaluación en $x=a$
  requiere sustituir $a$ en cada subexpresión y resolver respetando la jerarquía de
  operaciones y las agrupaciones indicadas por paréntesis, corchetes o líneas de fracción.


  ### Desarrollo didáctico


  Cuando la fórmula tiene una fracción, primero evalúa numerador y denominador por
  separado, y luego divide.


  Si $f(x) = \frac{2x+1}{x-3}$ y buscas $f(5)$: numerador $= 2(5)+1 = 11$; denominador
  $= 5-3=2$; entonces $f(5) = \frac{11}{2}$.


  Si hay raíces, evalúa primero el radicando completo antes de extraer la raíz: $g(x)
  = \sqrt{x+7}$, $g(9) = \sqrt{9+7} = \sqrt{16} = 4$.'
definiciones_clave: '- **Evaluación de una función dada por fórmula**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a evaluación de una función dada por fórmula.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a evaluación de una
    función dada por fórmula.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a evaluación de una función dada
    por fórmula.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
