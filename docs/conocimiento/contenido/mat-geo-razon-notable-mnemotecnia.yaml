semantic_id: MAT.GEO.TRIG_NOTABLES.MNEMOTECNIA_VALORES_NOTABLES
resumen_inicial: 'Regla mnemotécnica para construir la tabla de valores trigonométricos
  notables: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: En vez de memorizar cada valor por separado, existe un patrón
  simple que genera automáticamente toda la tabla de senos y cosenos notables.
explicacion_formal: '![Regla mnemotécnica de valores trigonométricos notables](/static/img/geometria/trigonometria/razon-notable-mnemotecnia.svg)


  ### Definición formal


  Para los ángulos 30°, 45° y 60°, el seno sigue el patrón $\sin\theta=\dfrac{\sqrt{n}}{2}$,
  donde $n=1,2,3$ respectivamente (dando $\frac12,\frac{\sqrt2}{2},\frac{\sqrt3}{2}$).
  El coseno de esos mismos ángulos sigue el patrón inverso: $\frac{\sqrt3}{2},\frac{\sqrt2}{2},\frac12$.


  ### Desarrollo didáctico


  Esta regla es útil para reconstruir rápidamente la tabla completa sin necesidad
  de memorizar cada valor de forma aislada: basta con recordar la secuencia creciente
  $\sqrt1,\sqrt2,\sqrt3$ sobre 2 para el seno, y la secuencia decreciente para el
  coseno.'
definiciones_clave: '- **Regla mnemotécnica para construir la tabla de valores trigonométricos
  notables**: Elemento o propiedad fundamental en el estudio de trigonometría en el
  triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a regla mnemotécnica para construir la tabla
  de valores trigonométricos notables.'
ejemplo_guiado:
  enunciado: En el estudio de regla mnemotécnica para construir la tabla de valores
    trigonométricos notables, un triángulo posee ángulos interiores de medidas $29^\circ$,
    $4858^\circ$ y $\gamma$. Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de regla mnemotécnica para construir la tabla de valores
    trigonométricos notables y la suma de ángulos interiores.
  - 'Plantear la suma: $29^\circ + 4858^\circ + \gamma = 180^\circ \implies 4887^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4887^\circ = -4707^\circ$.
