    valores trigonométricos notables.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de regla mnemotécnica para construir
    la tabla de valores trigonométricos notables y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de regla mnemotécnica para construir la tabla
    de valores trigonométricos notables.
- titulo: ¿Se cumple siempre la propiedad principal de regla mnemotécnica para construir
    la tabla de valores trigonométricos notables en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede regla mnemotécnica para construir la tabla de valores trigonométricos
    notables asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en regla mnemotécnica para construir
  la tabla de valores trigonométricos notables.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en regla mnemotécnica
  para construir la tabla de valores trigonométricos notables.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en regla mnemotécnica
  para construir la tabla de valores trigonométricos notables.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de regla
  mnemotécnica para construir la tabla de valores trigonométricos notables.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
