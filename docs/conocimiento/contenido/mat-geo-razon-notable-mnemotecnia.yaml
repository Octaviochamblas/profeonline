procedimiento:
- 'Paso 1: Ordena los ángulos notables de menor a mayor: 30°, 45°, 60°.'
- 'Paso 2: Para el seno, asigna las fracciones √1/2, √2/2, √3/2 en ese mismo orden
  creciente.'
- 'Paso 3: Para el coseno, asigna las mismas fracciones pero en orden decreciente
  (√3/2, √2/2, √1/2).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con regla mnemotécnica para construir la tabla de valores trigonométricos
  notables.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de regla mnemotécnica para construir la tabla de
