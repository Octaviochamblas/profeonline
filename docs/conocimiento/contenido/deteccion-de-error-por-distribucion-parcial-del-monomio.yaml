resumen_inicial: La detección de error por distribución parcial del monomio aplica
  rigurosamente las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con detección de error por distribución parcial del
  monomio, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Detección de error por distribución
  parcial del monomio** viene dada por:


  $$\text{"el error 2x(x + 3) = 2x^2 + 3"} \implies El error es no multiplicar el
  monomio 2x por el segundo término 3 (da +6x)$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Detección de error por distribución parcial del monomio**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule detección de error por distribución parcial del monomio para:
    ''el error 2x(x + 3) = 2x^2 + 3''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es El error es no multiplicar el monomio 2x por
    el segundo término 3 (da +6x).'
