  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene El error es no multiplicar el
    monomio 2x por el segundo término 3 (da +6x).
- titulo: ¿Da el producto de 'el error 2x(x + 3) = 2x^2 + 3' un resultado igual a
