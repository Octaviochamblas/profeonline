procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante detección de error por distribución parcial del monomio.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de detección de error por distribución parcial
    del monomio en 'el error 2x(x + 3) = 2x^2 + 3'?
  alternativas:
  - El error es no multiplicar el monomio 2x por el segundo término 3 (da +6x)
  - El error es sumar 3
  - El error es elevar x
  - No hay error
  respuesta: El error es no multiplicar el monomio 2x por el segundo término 3 (da
    +6x)
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener El error es no multiplicar el monomio 2x por el segundo término 3 (da
    +6x).
- titulo: Ejemplo 2
  enunciado: Al calcular 'el error 2x(x + 3) = 2x^2 + 3' por detección de error por
    distribución parcial del monomio, ¿qué expresión resulta?
  alternativas:
  - El error es no multiplicar el monomio 2x por el segundo término 3 (da +6x)
  - El error es sumar 3
  - El error es elevar x
  - No hay error
  respuesta: El error es no multiplicar el monomio 2x por el segundo término 3 (da
    +6x)
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir El error es no multiplicar el monomio 2x por el segundo término 3
