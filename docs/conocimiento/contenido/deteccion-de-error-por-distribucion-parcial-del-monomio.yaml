semantic_id: MAT.ALG.MULT_MON_POL.DISTRIBUCION_PARCIAL_ERROR
resumen_inicial: 'Detección de error por distribución parcial del monomio: leyes,
  procedimiento y aplicación en Multiplicación de monomio por polinomio.'
explicacion_simple: Un error muy clásico al resolver paréntesis es repartir el número
  de afuera solo al primer término de adentro y olvidarse de los demás. No dejes a
  los otros términos sin su multiplicación.
explicacion_formal: '### Definición formal


  Sean $M$ un monomio y $P=\sum_{i=1}^{n}T_i$ un polinomio con $n\geq2$. La distributividad
  exige la identidad

  $$M\cdot P=\sum_{i=1}^{n}M\cdot T_i.$$

  Existe distribución parcial cuando el factor $M$ se aplica únicamente a los términos
  cuyos índices pertenecen a un subconjunto propio de $\{1,\ldots,n\}$ y los restantes
  se conservan sin multiplicar. Esa transformación no es algebraicamente equivalente
  al producto original, salvo casos degenerados en los que los términos omitidos o
  el efecto de la multiplicación sobre ellos sean nulos.


  ### Desarrollo didáctico


  La propiedad distributiva establece que la multiplicación se distribuye sobre la
  adición y la sustracción. Esto significa que el factor externo actúa como un multiplicador
  universal para todo lo contenido en el paréntesis.


  Si tenemos $3x(2x + 5y - 4)$, el error de distribución parcial daría como resultado
  $6x^2 + 5y - 4$. El estudiante operó correctamente $3x \cdot 2x$, pero se olvidó
  del $5y$ y del $-4$.


  El resultado correcto requiere realizar tres multiplicaciones separadas:

  $(3x \cdot 2x) + (3x \cdot 5y) + (3x \cdot -4) = 6x^2 + 15xy - 12x$.'
definiciones_clave: '- **Detección de error por distribución parcial del monomio**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a detección de error por distribución parcial del
  monomio.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de detección de error por
    distribución parcial del monomio.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de detección de error por distribución parcial
    del monomio.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
