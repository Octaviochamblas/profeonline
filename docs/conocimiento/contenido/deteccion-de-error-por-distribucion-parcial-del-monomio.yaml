procedimiento:
- 'Para asegurar una distribución completa:

  1. Cuenta cuántos términos tiene el polinomio dentro del paréntesis.

  2. Haz una marca (como un arco) por cada término, partiendo desde el monomio exterior.

  3. Realiza tantas multiplicaciones como arcos hayas dibujado.

  4. Verifica que el resultado final tenga el mismo número de términos que el polinomio
  original (antes de reducir términos semejantes, si los hay).'
- El error clásico es $a(b+c) = ab+c$, olvidando multiplicar $a$ por $c$.
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en detección de error por distribución parcial del monomio.
ejemplos:
- titulo: Identificación de una distribución incompleta
  enunciado: 'Identifica el error en este cálculo: $-4(2a - 3b + 1) = -8a - 3b + 1$.'
  solucion_pasos:
  - El estudiante solo multiplicó el $-4$ por el primer término $2a$.
  - Olvidó multiplicar el $-4$ por el $-3b$ y por el $1$.
  - 'El resultado correcto debe ser: $-8a + 12b - 4$.'
- titulo: Corrección de una distribución sobre tres términos
  enunciado: Resuelve correctamente $5m(m^2 - 2m + 3)$.
  solucion_pasos:
  - Hay 3 términos en el paréntesis. Haremos 3 multiplicaciones.
  - $(5m)(m^2) = 5m^3$
  - $(5m)(-2m) = -10m^2$
  - $(5m)(3) = 15m$
  - 'Resultado: $5m^3 - 10m^2 + 15m$.'
- titulo: Relación entre cantidad de términos y distribución
  enunciado: Si multiplicamos un monomio por un trinomio, el resultado siempre tendrá
    tres términos, asumiendo que no hay reducción posible.
  solucion_pasos:
  - Al distribuir, se hace una multiplicación por cada término del trinomio.
  - Al ser tres multiplicaciones distintas, se generarán tres términos.
  - Por lo tanto, la afirmación es Verdadera.
- titulo: 'Respecto de «Detección de error por distribución parcial del monomio»:
    ¿Es correcta esta car'
  enunciado: 'Respecto de «Detección de error por distribución parcial del monomio»:
    ¿Es correcta esta caracterización? «La distribución parcial es un error frecuente
    donde el monomio exterior solo multiplica al primer término del polinomio y se
    deja el resto inalterado»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La distribución parcial es un
    error frecuente donde el monomio exterior solo multiplica al primer término del
    polinomio y se deja el resto inalterado.'
- titulo: 'Respecto de «Detección de error por distribución parcial del monomio»:
    ¿Es válida esta afirm'
  enunciado: 'Respecto de «Detección de error por distribución parcial del monomio»:
    ¿Es válida esta afirmación? «Multiplicar únicamente el primer término y transcribir
    el resto igual»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La distribución parcial es un
    error frecuente donde el monomio exterior solo multiplica al primer término del
    polinomio y se deja el resto inalterado.'
errores_frecuentes:
- Multiplicar únicamente el primer término y transcribir el resto igual.
- Distribuir correctamente los números pero olvidar distribuir la variable.
- Detener la distribución al encontrar un signo negativo.
- Para «El error de distribución parcial al resolver $a(b + c)$ consiste en:», la
  respuesta correcta es Multiplicar $b$ por $c$ y luego por $a$.
- Sumar $a$, $b$ y $c$.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
al_terminar_debes_ponder: Resolver productos algebraicos utilizando detección de error
  por distribución parcial del monomio.
