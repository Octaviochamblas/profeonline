semantic_id: MAT.ALG.TRIG_COORDENADAS.SIGNO_COSENO_CUADRANTES
resumen_inicial: 'Análisis del signo algebráico de la función coseno según la ubicación cuadrantal del ángulo en el plano cartesiano.'
explicacion_simple: |
  Como el coseno de un ángulo en el círculo unitario equivale a la coordenada horizontal $x$ del punto, su signo algebráico depende exclusivamente de si el punto está a la derecha o a la izquierda del eje vertical (eje $Y$):
  - En los cuadrantes **I y IV** (donde $x > 0$), el coseno es **positivo** ($+$).
  - En los cuadrantes **II y III** (donde $x < 0$), el coseno es **negativo** ($-$).
explicacion_formal: |
  ### Definición formal
  La **variación del signo del coseno por cuadrante** se deriva de la definición $\cos \theta = x$ en la circunferencia goniométrica $\mathcal{C}: x^2 + y^2 = 1$:
  $$\operatorname{sgn}(\cos \theta) = \operatorname{sgn}(x) = \begin{cases} +1 & \text{si } \theta \in \text{I C} \cup \text{IV C} \quad (x > 0) \\ -1 & \text{si } \theta \in \text{II C} \cup \text{III C} \quad (x < 0) \\ 0 & \text{si } \theta = \frac{\pi}{2} + k\pi \quad (x = 0) \end{cases}$$

  ### Desglose simbólico
  - **Cuadrante I** ($0 < \theta < 90^\circ$): $x > 0 \implies \cos \theta > 0$ (Positivo).
  - **Cuadrante II** ($90^\circ < \theta < 180^\circ$): $x < 0 \implies \cos \theta < 0$ (Negativo).
  - **Cuadrante III** ($180^\circ < \theta < 270^\circ$): $x < 0 \implies \cos \theta < 0$ (Negativo).
  - **Cuadrante IV** ($270^\circ < \theta < 360^\circ$): $x > 0 \implies \cos \theta > 0$ (Positivo).

  ### Síntesis didáctica
  Para recordar el signo del coseno se debe visualizar la mitad derecha e izquierda del plano cartesiano: toda posición ubicada a la derecha del eje Y ($x > 0$) genera coseno positivo, y toda posición a la izquierda ($x < 0$) genera coseno negativo.
definiciones_clave: |
  - **Signo de la abscisa**: Polaridad algebráica del eje horizontal $X$ que gobierna al coseno.
  - **Coseno positivo**: Región comprendida en la mitad derecha del plano (cuadrantes I y IV).
  - **Coseno negativo**: Región comprendida en la mitad izquierda del plano (cuadrantes II y III).
propiedades_relaciones: |
  - **Paridad trigonométrica**: El coseno es una función par, por lo que refutaciones horizontales preservan el signo: $\cos(-\theta) = \cos(\theta)$.
  - **Continuidad de signos**: El coseno permanece positivo durante todo el arco derecho de $-\frac{\pi}{2}$ a $\frac{\pi}{2}$ ($270^\circ$ a $90^\circ$) y negativo en todo el arco izquierdo de $\frac{\pi}{2}$ a $\frac{3\pi}{2}$ ($90^\circ$ a $270^\circ$).
ejemplo_guiado:
  enunciado: 'Determina el signo algebráico de $\cos(140^\circ)$ justificando la respuesta mediante su ubicación cartesiana.'
  pasos:
    - 'Paso 1: Evaluar la magnitud del ángulo: $90^\circ < 140^\circ < 180^\circ$.'
    - 'Paso 2: Identificar el cuadrante: el lado terminal de $140^\circ$ se ubica en el **Segundo Cuadrante (II C)**.'
    - 'Paso 3: Analizar la coordenada horizontal en el II cuadrante: las abscisas están situadas a la izquierda del eje Y ($x < 0$).'
    - 'Paso 4: Concluir que el signo de $\cos(140^\circ)$ es **negativo** ($-$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuáles cuadrantes del plano cartesiano la función coseno toma valores positivos?'
    choices:
      - {text: 'Primer y Cuarto cuadrante (I C y IV C)', is_correct: true}
      - {text: 'Primer y Segundo cuadrante (I C y II C)', is_correct: false}
      - {text: 'Segundo y Tercer cuadrante (II C y III C)', is_correct: false}
      - {text: 'Tercer y Cuarto cuadrante (III C y IV C)', is_correct: false}
    explanation: 'La alternativa correcta es ''Primer y Cuarto cuadrante (I C y IV C)''. Corresponde a la mitad derecha del plano donde la abscisa $x$ es positiva ($x > 0$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el signo del coseno para un ángulo de $\theta = 200^\circ$ ubicado en el tercer cuadrante?'
    choices:
      - {text: 'Negativo ($-$) ', is_correct: true}
      - {text: 'Positivo ($+$)', is_correct: false}
      - {text: 'Cero', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
    explanation: 'La alternativa correcta es ''Negativo ($-$) ''. En el tercer cuadrante las abscisas están a la izquierda del eje Y ($x < 0$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Ubicar el cuadrante del ángulo $\theta$ en el plano cartesiano.'
  - 'Paso 2: Observar si el rayo se encuentra a la derecha ($x > 0$) o a la izquierda ($x < 0$) del eje Y.'
  - 'Paso 3: Asignar signo positivo $(+)$ para cuadrantes I y IV.'
  - 'Paso 4: Asignar signo negativo $(-)$ para cuadrantes II y III.'
errores_correccion: |
  - **Error 1:** Asociar el signo del coseno a la coordenada vertical $y$. **Cómo corregirlo:** La coordenada vertical $y$ rige al seno. El coseno se rige estrictamente por la abscisa horizontal $x$.
  - **Error 2:** Creer que el coseno en el cuarto cuadrante es negativo por ser el último cuadrante. **Cómo corregirlo:** En el IV cuadrante las abscisas son positivas ($x > 0$), por lo que $\cos \theta > 0$.
ejemplos:
  - titulo: 'Signo en el cuarto cuadrante'
    enunciado: '¿Cuál es el signo de $\cos(330^\circ)$?'
    alternativas:
      - 'Positivo ($+$)'
      - 'Negativo ($-$)'
      - 'Cero'
    respuesta: 'Positivo ($+$)'
    solucion_pasos:
      - '1. $330^\circ$ está en el IV Cuadrante.'
      - '2. En IV C la abscisa $x > 0$.'
      - '3. Por lo tanto, $\cos(330^\circ) > 0$ (positivo).'
  - titulo: 'Signo en el tercer cuadrante'
    enunciado: '¿Es $\cos(225^\circ)$ una cantidad negativa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $225^\circ$ está en el III Cuadrante donde la abscisa $x < 0$.'
  - titulo: 'Coseno positivo en 60 grados'
    enunciado: '¿El coseno de $60^\circ$ es positivo por pertenecer al primer cuadrante?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el I cuadrante la abscisa $x$ es positiva.'
  - titulo: 'Coseno positivo en ángulos negativos del IV cuadrante'
    enunciado: '¿Un ángulo de $-30^\circ$ (IV cuadrante) posee coseno positivo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al girar en sentido horario cae en el IV Cuadrante donde $x > 0$.'
errores_frecuentes:
  - 'La afirmación de que el coseno es negativo en el cuarto cuadrante del plano cartesiano.'
  - 'La afirmación de que el coseno es positivo en el segundo y tercer cuadrante.'
  - 'La afirmación de que el signo del coseno se rige por la coordenada vertical $y$.'
  - 'La afirmación de que el coseno de un ángulo negativo es siempre un número negativo.'
  - 'La afirmación de que en el primer cuadrante el coseno toma un valor negativo.'
afirmaciones_verdaderas:
  - 'La función coseno es positiva en los cuadrantes I y IV ($x > 0$) y negativa en los cuadrantes II y III ($x < 0$).'
  - 'El signo del coseno depende exclusivamente de la posición horizontal de la abscisa $x$ sobre el plano cartesiano.'
al_terminar_debes_poder: |
  QUÉ: Identificar y justificar el signo algebráico de la función coseno en los cuatro cuadrantes.
  CÓMO: Evaluar el signo de la abscisa $x$ según la región cartesiana en que se ubica el ángulo.
