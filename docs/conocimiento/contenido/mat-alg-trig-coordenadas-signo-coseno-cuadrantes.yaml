  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el cuadrante donde se ubica el ángulo $\theta$.'
- 'Paso 2: Si está en el primer o cuarto cuadrante, el coseno es positivo.'
- 'Paso 3: Si está en el segundo o tercer cuadrante, el coseno es negativo.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en análisis del signo del
  coseno según el cuadrante.
ejemplos:
- titulo: Signo del coseno en el segundo cuadrante
  enunciado: ¿Cuál es el signo de $\cos(150°)$?
  solucion_pasos:
  - $150°$ está en el segundo cuadrante.
  - El coseno es negativo en ese cuadrante.
- titulo: Signo del coseno en el cuarto cuadrante
  enunciado: ¿Cuál es el signo de $\cos(330°)$?
  solucion_pasos:
  - $330°$ está en el cuarto cuadrante.
  - El coseno es positivo en ese cuadrante.
- titulo: ¿El coseno es positivo en el tercer cuadrante?
  enunciado: ¿El coseno es positivo para ángulos del tercer cuadrante?
  respuesta: 'No'
  solucion_pasos:
  - En el tercer cuadrante, la coordenada $x$ es negativa, así que el coseno también
    lo es.
- titulo: ¿El coseno tiene el mismo signo en el primer y cuarto cuadrante?
  enunciado: ¿El coseno tiene el mismo signo (positivo) tanto en el primer como en
    el cuarto cuadrante?
  respuesta: Sí
  solucion_pasos:
  - En ambos cuadrantes la coordenada $x$ es positiva.
errores_frecuentes:
- Declarar el signo del coseno con el del seno en cada cuadrante.
- Aplicar el signo correcto de un cuadrante a otro por error.
- No relacionar el signo del coseno con el signo de la coordenada $x$.
- Omitir que el signo puede cambiar incluso si el ángulo de referencia es el mismo.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  análisis del signo del coseno según el cuadrante.
