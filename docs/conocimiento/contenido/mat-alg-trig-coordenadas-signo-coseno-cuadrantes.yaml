semantic_id: MAT.ALG.TRIG_COORDENADAS.SIGNO_COSENO_CUADRANTES
resumen_inicial: 'Análisis del signo del coseno según el cuadrante: círculo unitario,
  amplitud, período y transformaciones de Seno y coseno en el círculo unitario.'
explicacion_simple: Como el coseno corresponde a la coordenada $x$, su signo cambia
  exactamente igual que el signo de esa coordenada en cada cuadrante.
explicacion_formal: '### Definición formal


  Como $\cos(\theta)=x$, el signo del coseno coincide con el signo de la coordenada
  $x$ del punto asociado. En el primer cuadrante ($0°<\theta<90°$) y el cuarto ($270°<\theta<360°$),
  $x>0$; en el segundo ($90°<\theta<180°$) y el tercero ($180°<\theta<270°$), $x<0$.


  ### Desarrollo didáctico


  $\cos(45°)$ (primer cuadrante) es positivo; $\cos(135°)$ (segundo cuadrante) es
  negativo, con el mismo valor absoluto que $\cos(45°)$; $\cos(315°)$ (cuarto cuadrante)
  es positivo.'
definiciones_clave: '- **Análisis del signo del coseno según el cuadrante**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a análisis del signo del coseno según el cuadrante.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    análisis del signo del coseno según el cuadrante.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de análisis del signo del coseno según el cuadrante.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
