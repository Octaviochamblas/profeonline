semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.RADIO_INSCRITO_TRIANGULO_RECTANGULO
resumen_inicial: 'En todo triángulo rectángulo con catetos $a$ y $b$ e hipotenusa
  $c$, el radio de la circunferencia inscrita ($r$) se calcula de forma directa mediante
  el Teorema de Poncelet: $r = \frac{a + b - c}{2}$.'
explicacion_simple: '![Teorema de Poncelet](/static/img/nodos/calculo-del-radio-inscrito-en-un-triangulo-rectangulo-mediante-r-a-b-c-2-intro.svg)


  En los triángulos con una esquina de $90^\circ$ (rectángulos) hay un truco muy rápido
  y directo llamado **Teorema de Poncelet**:


  - **Fórmula directa**: Sumas los dos catetos, le restas la hipotenusa y divides
  el resultado entre 2: $r = \frac{a + b - c}{2}$.

  - **No necesitas calcular el área**: Encuentras el inradio de inmediato usando solo
  las medidas de los tres lados.

  - **Cuadrado en la esquina**: El incentro forma un cuadrado perfecto de lado $r
  \times r$ en el vértice del ángulo recto.

  '
explicacion_formal: '### Teorema de Poncelet

  En todo triángulo rectángulo $\Delta ABC$ con catetos $a, b$ e hipotenusa $c$, el
  inradio $r$ se calcula directamente mediante la semisuma de los catetos menos la
  hipotenusa:


  $$a + b = c + 2r \iff r = \frac{a + b - c}{2}$$


  ### Desglose simbólico y geométrico

  - $a, b$: Longitudes de los catetos perpendiculares.

  - $c$: Longitud de la hipotenusa.

  - Cuadrado en el vértice recto: Los radios de tangencia forman un cuadrado de lado
  $r$ en la esquina de $90^\circ$, de donde los segmentos tangentes en la hipotenusa
  suman $c = (a - r) + (b - r) = a + b - 2r$.


  ### Síntesis didáctica

  El teorema de Poncelet simplifica el cálculo del inradio en triángulos rectángulos
  a una sencilla fórmula algebraica lineal sin raíces ni áreas intermedias.'
definiciones_clave: '- **Teorema de Poncelet**: Teorema geométrico que establece que
  la suma de los catetos de un triángulo rectángulo es igual a la hipotenusa más dos
  veces el inradio ($a + b = c + 2r$).

  - **Catetos ($a, b$)**: Lados que forman el ángulo recto ($90^\circ$).

  - **Hipotenusa ($c$)**: Lado opuesto al ángulo recto y de mayor longitud en el triángulo
  rectángulo.

  '
propiedades_relaciones: '- **Ecuación de Poncelet**: $a + b = c + 2r$.

  - **Inradio despejado**: $r = \frac{a + b - c}{2}$.

  - **Equivalencia con área**: $r = \frac{\text{Área}}{s} = \frac{(a \cdot b)/2}{(a
  + b + c)/2} = \frac{a \cdot b}{a + b + c} = \frac{a + b - c}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Poncelet](/static/img/nodos/calculo-del-radio-inscrito-en-un-triangulo-rectangulo-mediante-r-a-b-c-2-ejemplos.svg)


    En un triángulo rectángulo, los catetos miden $a = 6\text{ cm}$ y $b = 8\text{
    cm}$. Calcula la hipotenusa $c$ y luego aplica el Teorema de Poncelet para encontrar
    el radio de la circunferencia inscrita ($r$).

    '
  pasos:
  - 'Paso 1: Calcular la hipotenusa por Pitágoras: $c = \sqrt{a^2 + b^2} = \sqrt{6^2
    + 8^2} = \sqrt{36 + 64} = \sqrt{100} = 10\text{ cm}$.'
  - 'Paso 2: Aplicar el Teorema de Poncelet: $r = \frac{a + b - c}{2}$.'
  - 'Paso 3: Sustituir los valores: $r = \frac{6 + 8 - 10}{2} = \frac{14 - 10}{2}
    = \frac{4}{2} = 2\text{ cm}$.'
  - 'Paso 4: Concluir que el radio de la circunferencia inscrita es $2\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula del Teorema de Poncelet para calcular el inradio r
    en un triángulo rectángulo?
  choices:
  - text: $r = \frac{a + b - c}{2}$
    is_correct: true
  - text: $r = \frac{a + b + c}{2}$
    is_correct: false
  - text: $r = \frac{c - a - b}{2}$
    is_correct: false
  - text: $r = \frac{a \cdot b}{2}$
    is_correct: false
  explanation: El Teorema de Poncelet establece que el inradio es $r = \frac{a + b
    - c}{2}$ (suma de catetos menos hipotenusa dividido por 2).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo de catetos 5 cm y 12 cm con hipotenusa 13 cm,
    ¿cuánto mide el inradio r?
  choices:
  - text: $2\text{ cm}$
    is_correct: true
  - text: $4\text{ cm}$
    is_correct: false
  - text: $1\text{ cm}$
    is_correct: false
  - text: $3\text{ cm}$
    is_correct: false
  explanation: El inradio mide $2\text{ cm}$, pues $r = \frac{5 + 12 - 13}{2} = \frac{4}{2}
    = 2\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el triángulo es rectángulo e identificar los dos catetos
  ($a, b$) y la hipotenusa ($c$).'
- 'Paso 2: Si no se conoce la hipotenusa, calcularla mediante el teorema de Pitágoras:
  $c = \sqrt{a^2 + b^2}$.'
- 'Paso 3: Aplicar el Teorema de Poncelet: $r = \frac{a + b - c}{2}$.'
- 'Paso 4: Verificar que el valor obtenido sea positivo ($r > 0$) y asignar las unidades.'
errores_correccion: Recuerda que en la fórmula de Poncelet se restan los catetos de
  la hipotenusa ($a + b - c$) y NO al revés.
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo rectángulo de catetos $9\text{ cm}$ y $12\text{ cm}$
    e hipotenusa $15\text{ cm}$, ¿cuánto mide el inradio $r$?
  alternativas:
  - $3\text{ cm}$
  - $6\text{ cm}$
  - $1.5\text{ cm}$
  respuesta: $3\text{ cm}$
  solucion_pasos:
  - 'Por Poncelet: $r = \frac{9 + 12 - 15}{2} = \frac{21 - 15}{2} = \frac{6}{2} =
    3\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: Si la suma de los catetos de un triángulo rectángulo es $17\text{ cm}$
    y la hipotenusa mide $13\text{ cm}$, ¿cuál es el radio del incírculo?
  alternativas:
  - $2\text{ cm}$
  - $4\text{ cm}$
  - $1\text{ cm}$
  respuesta: $2\text{ cm}$
  solucion_pasos:
  - $r = \frac{(a + b) - c}{2} = \frac{17 - 13}{2} = \frac{4}{2} = 2\text{ cm}$.
- titulo: ¿El Teorema de Poncelet es aplicable a cualquier tipo de triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, el Teorema de Poncelet solo es válido para triángulos rectángulos.
- titulo: ¿En un triángulo rectángulo el inradio es igual a la suma de los catetos
    menos la hipotenusa dividido por 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, esa es la formulación exacta de $r = \frac{a + b - c}{2}$.
errores_frecuentes:
- Aplicar el Teorema de Poncelet a triángulos acutángulos u obtusángulos.
- Sumar la hipotenusa en vez de restarla ($a + b + c$ en lugar de $a + b - c$).
- Olvidar dividir el resultado entre 2.
- Confundir los catetos con la hipotenusa.
- Calcular la hipotenusa con signos incorrectos en Pitágoras.
afirmaciones_verdaderas:
- 'En todo triángulo rectángulo se cumple el Teorema de Poncelet: $a + b = c + 2r$.'
- El inradio de un triángulo rectángulo es igual a la suma de los catetos menos la
  hipotenusa dividido por dos.
al_terminar_debes_poder: '**QUÉ:** Calcular el radio de la circunferencia inscrita
  en triángulos rectángulos mediante el Teorema de Poncelet.


  **CÓMO:** Identificando los catetos ($a, b$) y la hipotenusa ($c$), y aplicando
  la relación $r = \frac{a + b - c}{2}$.


  ![Resumen de Teorema de Poncelet](/static/img/nodos/calculo-del-radio-inscrito-en-un-triangulo-rectangulo-mediante-r-a-b-c-2-resumen.svg)

  '
