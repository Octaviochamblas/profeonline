semantic_id: MAT.NUM.PROP_COMPUESTA.CONCEPTO
resumen_inicial: 'Concepto de proporcionalidad compuesta: concepto y propiedades fundamentales
  en Proporcionalidad compuesta.'
explicacion_simple: 'Hasta ahora hemos visto problemas donde solo dos cosas cambian: pintores
  y días. Pero, ¿qué pasa si agregamos una tercera variable, como la cantidad de casas a pintar?
  Bienvenido a la proporcionalidad compuesta.'
explicacion_formal: 'Una **proporcionalidad compuesta** ocurre cuando una variable depende
  de múltiples factores simultáneamente. Por ejemplo, el costo de transporte depende del peso
  de la carga y de la distancia a recorrer.


  Para resolverla, la técnica no es memorizar una fórmula mágica, sino fijar la magnitud que
  tiene la incógnita y compararla independientemente con cada una de las otras magnitudes
  para ver si la relación es directa o inversa.'
definiciones_clave: '- **Concepto de proporcionalidad compuesta**: Elemento central dentro
  del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a concepto de proporcionalidad compuesta.'
ejemplo_guiado:
  enunciado: Si 3 grifos llenan 2 estanques en 4 horas, ¿cuántas magnitudes intervienen y
    cuál es la incógnita si preguntamos cuántas horas demorarán 6 grifos en llenar 5 estanques?
  pasos:
  - 'Identifico las magnitudes: número de grifos, número de estanques, y horas.'
  - 'Identifico la incógnita: las horas para la nueva situación, con 6 grifos y 5 estanques.'
  - Concluyo que es un problema de proporcionalidad compuesta porque intervienen tres magnitudes
    relacionadas simultáneamente, no solo dos.
checkpoints:
