  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica todas las magnitudes (ej: horas, obreros, metros).'
- 'Paso 2: Ubica cuál magnitud contiene la incógnita (la pregunta).'
- 'Paso 3: Compara esa magnitud incógnita con las demás, *una por una*, asumiendo que el resto
  no cambia.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de proporcionalidad
  compuesta.
ejemplos:
- titulo: Identificando magnitudes compuestas
  enunciado: Si 5 hornos consumen 10 balones de gas en 20 días, ¿cuántas variables hay?
  solucion_pasos:
  - 'Hay 3 magnitudes: cantidad de hornos, balones de gas, y días.'
  - Es un problema de proporción compuesta.
- titulo: Ejemplo 2
  enunciado: ¿Cuántas magnitudes intervienen si 4 obreros construyen 30 metros de cerca en
    5 días?
  alternativas:
  - '3'
  - '2'
  - '4'
  respuesta: '3'
  solucion_pasos:
  - Obreros, metros y días son las tres magnitudes del problema.
- titulo: Ejemplo 3
  enunciado: ¿Cuál situación es un problema de proporcionalidad compuesta?
  alternativas:
  - El costo de un flete según el peso y la distancia
  - El precio de 5 kilos de arroz
  - La razón entre dos números
  respuesta: El costo de un flete según el peso y la distancia
  solucion_pasos:
  - 'Involucra tres magnitudes a la vez: costo, peso y distancia.'
- titulo: ¿Un problema de proporcionalidad compuesta puede resolverse comparando las magnitudes
    de a pares?
  respuesta: Sí
  solucion_pasos:
  - El método consiste en fijar una magnitud a la vez y comparar la incógnita con cada una
    de las otras.
errores_frecuentes:
- Intentar cruzar todos los datos a la vez sin separar las relaciones.
- Creer que si son 3 variables, todas son inversas o todas son directas.
- No fijar mentalmente las demás variables al analizar un par de ellas.
- Intentar resolver un problema de tres o más variables usando una regla de tres simple, que
  solo compara dos magnitudes.
- No identificar correctamente cuál de las magnitudes es la incógnita antes de analizar las
  relaciones.
afirmaciones_verdaderas:
- La propiedad de concepto de proporcionalidad compuesta preserva la consistencia lógica.
- Un problema de proporcionalidad compuesta involucra tres o más magnitudes relacionadas simultáneamente
  con la incógnita.
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de proporcionalidad
  compuesta.
