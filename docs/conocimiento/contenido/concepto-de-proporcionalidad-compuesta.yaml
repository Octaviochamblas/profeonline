semantic_id: MAT.NUM.PROP_COMPUESTA.CONCEPTO
resumen_inicial: La proporcionalidad compuesta estudia situaciones matemáticas donde intervienen tres o más magnitudes vinculadas entre sí mediante relaciones que pueden ser directas, inversas o mixtas respecto a una magnitud incógnita central.
explicacion_simple: "![Concepto de proporcionalidad compuesta](/static/img/nodos/concepto-de-proporcionalidad-compuesta-intro.svg)\n\nLa **proporcionalidad compuesta** aparece cuando un problema involucra **$3$ o más magnitudes al mismo tiempo**:\n- **Ejemplo típico:** Obreros trabajando cierta cantidad de horas al día para construir una cantidad de metros de muro en un número determinado de días.\n- **¿Cómo se resuelve?**\n  1. Identificamos cuál es la **magnitud incógnita** (la que queremos calcular, ej: Días).\n  2. Comparamos cada una de las demás magnitudes **por separado** con la incógnita:\n     - Si es **Directa**: La razón se mantiene igual $\\left(\\frac{B_1}{B_2}\\right)$.\n     - Si es **Inversa**: La razón se invierte $\\left(\\frac{C_2}{C_1}\\right)$.\n  3. La razón de la incógnita es igual a la multiplicación de todas las razones:\n  $$\\frac{A_1}{A_2} = \\left(\\frac{B_1}{B_2}\\right) \\cdot \\left(\\frac{C_2}{C_1}\\right)$$"
explicacion_formal: 'Sean $n \ge 3$ magnitudes físicas o económicas $M_1, M_2, \dots, M_n$, donde $M_1$ es la variable dependiente (incógnita).


  **Estructura del Teorema de Proporcionalidad Compuesta:**

  $M_1$ es conjuntamente proporcional a $M_2, \dots, M_k$ e inversamente proporcional a $M_{k+1}, \dots, M_n$ si existe una constante de acoplamiento global $k_g > 0$ tal que:


  $$M_1 = k_g \cdot \frac{M_2 \cdot M_3 \dots M_k}{M_{k+1} \cdot M_{k+2} \dots M_n}$$


  **Formulación en Razones de Estado:**

  Para dos estados del sistema $(1)$ y $(2)$:


  $$\frac{M_{1}^{(1)}}{M_{1}^{(2)}} = \prod_{i=2}^{k} \left(\frac{M_i^{(1)}}{M_i^{(2)}}\right) \cdot \prod_{j=k+1}^{n} \left(\frac{M_j^{(2)}}{M_j^{(1)}}\right)$$'
definiciones_clave: '- **Proporcionalidad compuesta**: Sistema multivariable donde $\ge 3$ magnitudes interactúan funcionalmente.

  - **Magnitud incógnita**: Variable objetivo cuyo valor final se desea despejar.

  - **Razón de estado**: Cociente entre el valor inicial y el valor final de una magnitud.'
propiedades_relaciones: '- **Principio de Superposición Multiplicativa**: El efecto de cada variable se combina multiplicando sus respectivas razones.

  - **Independencia Ceteris Paribus**: El tipo de relación (directa/inversa) se analiza aislando pares de variables mientras las demás permanecen constantes.'
ejemplo_guiado:
  enunciado: '![Ejemplos de proporcionalidad compuesta](/static/img/nodos/concepto-de-proporcionalidad-compuesta-ejemplos.svg)


    Identifique las relaciones de la variable incógnita Días ($D$) frente a Obreros ($O$) y Obra ($M$), y plantee la ecuación para calcular cuántos días tardan $6$ obreros en hacer $150\text{ m}$ de muro si $4$ obreros hacen $100\text{ m}$ en $6\text{ días}$.'
  pasos:
  - 'Paso 1: Analizar Días vs Obreros (a obra fija): A más obreros, menos días $\implies$ INVERSA (se invierte a $\frac{6}{4}$).'
  - 'Paso 2: Analizar Días vs Obra (a obreros fijos): A más metros de obra, más días $\implies$ DIRECTA (se mantiene $\frac{100}{150}$).'
  - 'Paso 3: Formular la proporción compuesta: $\frac{6}{x} = \left(\frac{6}{4}\right) \cdot \left(\frac{100}{150}\right)$.'
  - 'Paso 4: Simplificar: $\left(\frac{3}{2}\right) \cdot \left(\frac{2}{3}\right) = 1 \implies \frac{6}{x} = 1 \implies x = 6\text{ días}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se combinan las diferentes magnitudes en la fórmula de proporcionalidad compuesta?
  choices:
  - text: Multiplicando la razón de cada magnitud (directa tal cual e inversa invertida) igualada a la razón de la incógnita
    is_correct: true
  - text: Sumando todas las magnitudes y dividiéndolas por el número de variables
    is_correct: false
  - text: Multiplicando todas las variables en cruz simultáneamente
    is_correct: false
  - text: Restando las variables inversas de las directas
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando la razón de cada magnitud (directa tal cual e inversa invertida) igualada a la razón de la incógnita'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la razón de obreros se escribió como 6/4 en lugar de 4/6?
  choices:
  - text: Porque obreros y días tienen una relación inversamente proporcional y su razón debe invertirse
    is_correct: true
  - text: Porque 6 es mayor que 4
    is_correct: false
  - text: Porque los obreros son números pares
    is_correct: false
  - text: Por una regla arbitraria de redondeo
    is_correct: false
  explanation: La alternativa correcta es 'Porque obreros y días tienen una relación inversamente proporcional y su razón debe invertirse'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Organizar todos los datos en una tabla de doble entrada señalando claramente la columna de la incógnita.'
- 'Paso 2: Comparar individualmente cada columna de datos contra la columna incógnita para clasificarla como Directa o Inversa.'
- 'Paso 3: Escribir la proporción igualando la razón de la incógnita con el producto de las razones auxiliares y despejar $x$.'
errores_correccion: "- **Error 1: Comparar magnitudes auxiliares entre sí.** **Cómo corregirlo:** Se debe comparar SIEMPRE cada magnitud auxiliar DIRECTAMENTE CONTRA LA INCÓGNITA.\n- **Error 2: No invertir las razones inversas.** **Cómo corregirlo:** Si la relación con la incógnita es inversa, se DEBE intercambiar numerador y denominador ($\frac{C_2}{C_1}$)."
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si una magnitud $A$ es directa con $B$ e inversa con $C$, ¿cuál es la estructura de la proporción compuesta?
  alternativas:
  - $\frac{A_1}{A_2} = \frac{B_1}{B_2} \cdot \frac{C_2}{C_1}$
  - $\frac{A_1}{A_2} = \frac{B_1}{B_2} \cdot \frac{C_1}{C_2}$
  - $\frac{A_1}{A_2} = \frac{B_2}{B_1} \cdot \frac{C_2}{C_1}$
  respuesta: $\frac{A_1}{A_2} = \frac{B_1}{B_2} \cdot \frac{C_2}{C_1}$
  solucion_pasos:
  - $B$ es directa (se mantiene $B_1/B_2$) y $C$ es inversa (se invierte $C_2/C_1$).
- titulo: Ejemplo 2
  enunciado: 3 secretarias escriben 15 informes en 2 días. ¿Cuántos días tardan 6 secretarias en escribir 60 informes?
  alternativas:
  - $4\text{ días}$
  - $8\text{ días}$
  - $2\text{ días}$
  respuesta: $4\text{ días}$
  solucion_pasos:
  - $\frac{2}{x} = \frac{6}{3} \cdot \frac{15}{60} = 2 \cdot \frac{1}{4} = \frac{1}{2} \implies x = 4\text{ días}$.
- titulo: ¿Intervienen al menos tres magnitudes en la proporcionalidad compuesta?
  respuesta: Sí
  solucion_pasos:
  - Sí, la proporcionalidad compuesta involucra 3 o más variables.
  alternativas:
  - texto: Sí, es la definición de sistema proporcional multivariable
    es_correcta: true
    retroalimentacion: ¡Correcto! $\ge 3$ magnitudes.
  - texto: No, solo intervienen 2
    es_correcta: false
    retroalimentacion: Incorrecto, con 2 variables es proporcionalidad simple.
  - texto: No, requiere exactamente 10
    es_correcta: false
    retroalimentacion: Incorrecto, aplica desde 3 en adelante.
- titulo: ¿Se pueden mezclar relaciones directas e inversas en un mismo problema?
  respuesta: Sí
  solucion_pasos:
  - Sí, es lo que se conoce como proporcionalidad compuesta mixta.
  alternativas:
  - texto: Sí, cada magnitud se ajusta según sea directa o inversa con la incógnita
    es_correcta: true
    retroalimentacion: ¡Correcto! Proporcionalidad mixta.
  - texto: No, todas deben ser directas o todas inversas
    es_correcta: false
    retroalimentacion: Incorrecto, coexisten magnitudes de ambos tipos.
  - texto: No, se anulan mutuamente
    es_correcta: false
    retroalimentacion: Incorrecto, se combinan multiplicativamente.
errores_frecuentes:
- Comparar magnitudes entre sí en vez de compararlas con la incógnita.
- Olvidar invertir las razones de tipo inverso.
- No simplificar fracciones antes de despejar.
- 'Mezclar unidades temporales (ej: días y horas sin homogeneizar).'
afirmaciones_verdaderas:
- La proporcionalidad compuesta modela la interacción simultánea de 3 o más magnitudes.
- La razón de la incógnita es igual al producto de las razones directas por las razones inversas invertidas.
- Cada relación se determina aislando pares de variables mediante la condición ceteris paribus.
al_terminar_debes_poder: '![Síntesis de proporcionalidad compuesta](/static/img/nodos/concepto-de-proporcionalidad-compuesta-resumen.svg)


  QUÉ: Comprender y formular sistemas de proporcionalidad compuesta con tres o más magnitudes.


  CÓMO: Clasificando cada magnitud auxiliar respecto a la incógnita mediante ceteris paribus y estructurando la proporción $\frac{A_1}{A_2} = \prod \left(\frac{B_1}{B_2}\right) \cdot \prod \left(\frac{C_2}{C_1}\right)$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
