resumen_inicial: La proporcionalidad compuesta estudia la relación entre tres o más
  variables simultáneas, donde la variable incógnita se relaciona directa o inversamente
  de forma independiente con cada una de las demás magnitudes.
explicacion_simple: La proporcionalidad compuesta se usa cuando en un problema participan
  tres o más magnitudes al mismo tiempo (como personas, horas diarias y metros construidos).
  Para resolverla, analizamos cómo influye cada magnitud individualmente sobre la
  variable que queremos calcular.
explicacion_formal: 'Dadas las magnitudes $A, B, C, \dots$, la **Proporcionalidad
  Compuesta** establece que el comportamiento de la variable principal $A$ respecto
  al conjunto de variables $\{B, C, \dots\}$ se modela como:


  $$A = k \cdot \frac{B_d \cdot C_d \dots}{X_i \cdot Y_i \dots} \iff \frac{A \cdot
  X_i \cdot Y_i \dots}{B_d \cdot C_d \dots} = k$$


  donde las variables numeradas en el denominador son directamente proporcionales
  a $A$ y las del numerador son inversamente proporcionales.'
definiciones_clave: '- **Proporcionalidad compuesta**: Relación simultánea entre tres
  o más magnitudes vinculadas de forma directa e inversa.'
propiedades_relaciones: '- **Independencia operacional**: El efecto de cada variable
  sobre la incógnita se analiza manteniendo fijas las demás.'
ejemplo_guiado:
  enunciado: Analice las relaciones entre Obreros ($A$), Días ($B$) y Metros de muro
    ($C$).
  pasos:
  - 'Paso 1: Analizar Obreros y Metros (fijando Días): a más obreros, más metros $\implies$
    Proporción Directa.'
  - 'Paso 2: Analizar Obreros y Días (fijando Metros): a más obreros, menos días $\implies$
    Proporción Inversa.'
  - 'Paso 3: Unir en la constante compuesta: $\frac{\text{Obreros} \cdot \text{Días}}{\text{Metros}}
    = k$.'
  - 'Conclusión: La expresión constante es $\frac{A \cdot B}{C} = k$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza a un problema de proporcionalidad compuesta frente a
    uno simple?
  choices:
  - text: La intervención simultánea de tres o más magnitudes relacionadas directa
      o inversamente
    is_correct: true
  - text: El uso exclusivo de números decimales
    is_correct: false
  - text: Que solo participan dos magnitudes
    is_correct: false
  - text: Que no existe constante de proporcionalidad
    is_correct: false
  explanation: La alternativa correcta es 'La intervención simultánea de tres o más
    magnitudes relacionadas directa o inversamente'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para Obreros (A), Días (B) y Metros (C), ¿cuál fue
    la fórmula de la constante k?
  choices:
  - text: (A · B) / C = k
    is_correct: true
  - text: A · B · C = k
    is_correct: false
  - text: A / (B · C) = k
    is_correct: false
  - text: (A + B) / C = k
    is_correct: false
  explanation: La alternativa correcta es '(A · B) / C = k'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_ponder: Al terminar serás capaz de definir y estructurar relaciones
  de proporcionalidad compuesta evaluando tres o más magnitudes simultáneas.
al_terminar_debes_poder: Al terminar serás capaz de definir y estructurar relaciones
  de proporcionalidad compuesta evaluando tres o más magnitudes simultáneas.
semantic_id: MAT.NUM.PROP_COMPUESTA.CONCEPTO
procedimiento:
- 'Paso 1: Identificar la variable incógnita y comparar individualmente cada magnitud
  auxiliar con ella (fijando las demás).'
- 'Paso 2: Clasificar cada magnitud como directamente proporcional (mantener razón)
  o inversamente proporcional (invertir razón).'
- 'Paso 3: Formar la ecuación generalizada y calcular la respuesta reduciendo los
  factores multiplicativos.'
errores_correccion: '- **Error 1: Comparar las magnitudes auxiliares entre sí en lugar
  de compararlas con la variable incógnita.** **Cómo corregirlo:** La comparación
  de proporcionalidad directa o inversa se DEBE hacer siempre respecto a la columna
  de la INCÓGNITA.


  - **Error 2: No invertir la razón de las magnitudes inversas al armar la fórmula.**
  **Cómo corregirlo:** Las magnitudes inversas cambian su posición $\frac{a_1}{a_2}
  \to \frac{a_2}{a_1}$ al multiplicar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_COMPUESTA.CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las leyes de proporcionalidad compuesta.
- titulo: Ejemplo 2
  enunciado: Verificación de la fórmula del producto de razones.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por producto de razones.
- titulo: ¿Se invierten las razones de las magnitudes inversas en la fórmula generalizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, para compensar la variación inversamente proporcional.
- titulo: ¿Es necesario congelar las otras variables al clasificar una magnitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, para aislar el efecto puro de esa variable sobre la incógnita.
errores_frecuentes:
- Comparar dos magnitudes auxiliares entre sí en lugar de analizar su relación individual
  con la incógnita.
- Mantener sin invertir la fracción correspondiente a una magnitud de relación inversamente
  proporcional.
- Multiplicar todos los datos numéricos del problema sin distinguir su carácter directo
  o inverso.
- Omitir congelar mentalmente las demás variables al determinar si una relación es
  directa o inversa.
- Declarar que si participan más de tres variables la relación es siempre directamente
  proporcional.
afirmaciones_verdaderas:
- La proporcionalidad compuesta combina tres o más magnitudes analizando la relación
  directa o inversa de cada una con la incógnita.
- En la fórmula generalizada de resolución, la razón de una magnitud inversa se invierte
  respecto a su estado inicial.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
