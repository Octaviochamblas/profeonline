semantic_id: MAT.NUM.PROP_COMPUESTA.CONCEPTO
resumen_inicial: 'La proporcionalidad compuesta estudia las relaciones cuantitativas donde intervienen tres o más magnitudes interconectadas, combinando relaciones de proporción directa e inversa.'
explicacion_simple: |
  En la vida real, muchos problemas no dependen solo de dos cosas, sino de tres o más al mismo tiempo. Por ejemplo, la cantidad de alimento que consume un grupo de animales depende de cuántos animales son Y de cuántos días se alimentan. La proporcionalidad compuesta permite analizar y resolver estas situaciones donde intervienen tres o más variables simultáneamente, comparando cada una con la incógnita principal manteniendo las demás fijas.
explicacion_formal: |
  ### Definición formal
  Se denomina **proporcionalidad compuesta** a la relación funcional entre tres o más variables cuantitativas $X_1, X_2, \dots, X_n, Y$ donde la variable dependiente $Y$ satisface simultáneamente relaciones de proporcionalidad directa o inversa con cada una de las variables independientes $X_i$.

  ### Estructura general de la relación
  Si $Y$ es directamente proporcional a $X_1, X_2$ e inversamente proporcional a $X_3$, la constante de proporcionalidad compuesta $k \in \mathbb{R}^+$ viene dada por:
  $$k = \frac{Y \cdot X_3}{X_1 \cdot X_2} \iff Y = k \cdot \frac{X_1 \cdot X_2}{X_3}$$

  ### Análisis por congelamiento de variables (Ceteris Paribus)
  Para clasificar la relación de cada variable $X_i$ con la incógnita $Y$, se supone que **todas las demás variables permanecen constantes**:
  - Si al aumentar $X_1$ (con $X_2, X_3$ fijos), $Y$ aumenta $\implies$ Proporción Directa.
  - Si al aumentar $X_3$ (con $X_1, X_2$ fijos), $Y$ disminuye $\implies$ Proporción Inversa.

  ### Síntesis didáctica
  - Ámbito: Tres o más magnitudes dependientes.
  - Técnica: Comparación por partes congelando variables secundarias.
definiciones_clave: |
  - **Proporcionalidad compuesta**: Relación funcional simultánea entre tres o más magnitudes cuantitativas.
  - **Ceteris Paribus (Fijación de variables)**: Método analítico que mantiene constantes las demás magnitudes para aislar la relación entre dos variables.
  - **Constante compuesta $k$**: Expresión combinada de multiplicación y división que vincula a todas las magnitudes del problema.
propiedades_relaciones: |
  - **Superposición de razones**: El cambio total en la variable dependiente $Y$ es igual al producto de los factores de cambio individuales de cada variable independiente.
  - **Conservación de la constante global**: El cociente de productos $\frac{Y \cdot \text{Inversos}}{\text{Directos}} = k$ se conserva invariante en todos los estados del sistema.
ejemplo_guiado:
  enunciado: 'Identifica la estructura de proporcionalidad entre la masa de alimento necesaria ($Y$), el número de caballos ($X_1$) y la cantidad de días ($X_2$).'
  pasos:
    - 'Paso 1: Analizamos la masa de alimento ($Y$) respecto al número de caballos ($X_1$) manteniendo los días fijos: a más caballos, se requiere más alimento $\implies$ **Relación Directa**.'
    - 'Paso 2: Analizamos la masa de alimento ($Y$) respecto al número de días ($X_2$) manteniendo los caballos fijos: a más días, se requiere más alimento $\implies$ **Relación Directa**.'
    - 'Paso 3: Formulamos la relación global: $Y$ es directamente proporcional a $X_1$ y a $X_2$.'
    - 'Paso 4: Escribimos la fórmula de la constante compuesta: $k = \frac{Y}{X_1 \cdot X_2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué método se utiliza para determinar si una magnitud es directa o inversamente proporcional a la incógnita en un contexto compuesto?'
    choices:
      - {text: 'Analizar cómo varía la incógnita al modificar esa magnitud manteniendo todas las demás variables constantes', is_correct: true}
      - {text: 'Sumar todas las magnitudes del problema', is_correct: false}
      - {text: 'Asumir que todas las magnitudes son siempre directamente proporcionales', is_correct: false}
      - {text: 'Multiplicar todas las variables entre sí independientemente de su tipo', is_correct: false}
    explanation: 'La alternativa correcta es ''Analizar cómo varía la incógnita al modificar esa magnitud manteniendo todas las demás variables constantes''. Es el método del congelamiento de variables.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un problema donde intervienen obreros, horas de trabajo diarias y días totales para completar una obra, ¿cuántas magnitudes independientes se relacionan?'
    choices:
      - {text: 'Dos magnitudes independientes (obreros y horas diarias) que determinan el tiempo total en días', is_correct: true}
      - {text: 'Una sola magnitud', is_correct: false}
      - {text: 'Cuatro magnitudes completamente desconectadas', is_correct: false}
      - {text: 'Cero magnitudes', is_correct: false}
    explanation: 'La alternativa correcta es ''Dos magnitudes independientes (obreros y horas diarias) que determinan el tiempo total en días''. Las variables obreros y horas diarias influyen sobre los días.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Listar todas las magnitudes involucradas en el problema (3 o más).'
  - 'Paso 2: Identificar cuál de las magnitudes contiene la incógnita principal a despejar.'
  - 'Paso 3: Comparar la magnitud de la incógnita con cada una de las otras magnitudes por separado, suponiendo las demás constantes.'
  - 'Paso 4: Clasificar cada relación individual como "Directa" o "Inversa" para armar la ecuación global.'
errores_correccion: |
  - **Error 1:** Modificar todas las variables al mismo tiempo al intentar determinar si una relación es directa o inversa. **Cómo corregirlo:** Para evaluar la relación entre dos variables, debes **mantener estrictamente congeladas (fijas)** las demás magnitudes del problema.
  - **Error 2:** Creer que la proporcionalidad compuesta solo admite relaciones directamente proporcionales. **Cómo corregirlo:** La proporcionalidad compuesta puede combinar **relaciones directas e inversas simultáneamente** en el mismo ejercicio.
ejemplos:
  - titulo: 'Estructura de obreros, horas y días'
    enunciado: 'En la construcción de un muro, ¿los días de trabajo ($Y$) son inversamente proporcionales a los obreros ($X_1$) e inversamente proporcionales a las horas diarias ($X_2$)?'
    alternativas:
      - 'Sí, pues a más obreros menos días, y a más horas diarias menos días'
      - 'No, ambas son directas'
      - 'No, una es directa y otra inversa'
    respuesta: 'Sí, pues a más obreros menos días, y a más horas diarias menos días'
    solucion_pasos:
      - '1. Obreros vs Días (horas fijas): a más obreros, menos días $\implies$ Inversa.'
      - '2. Horas vs Días (obreros fijos): a más horas, menos días $\implies$ Inversa.'
  - titulo: 'Estructura de consumo de combustible'
    enunciado: 'El consumo de combustible de un motor ($Y$) respecto a la potencia ($X_1$) y a las horas de uso ($X_2$), ¿es directamente proporcional a ambas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A mayor potencia más consumo, y a mayor tiempo de uso más consumo.'
  - titulo: 'Constante compuesta en física'
    enunciado: 'Si $Y = k \cdot \frac{X_1}{X_2}$, ¿la constante es $k = \frac{Y \cdot X_2}{X_1}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Despejando $k$ multiplicando por $X_2$ y dividiendo por $X_1$.'
  - titulo: 'Evaluación con 4 variables'
    enunciado: '¿La proporcionalidad compuesta se puede aplicar a problemas con 4 o más magnitudes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El principio de comparación por partes se aplica a cualquier número de variables.'
errores_frecuentes:
  - 'Modificar múltiples variables simultáneamente al intentar determinar si una relación es directa o inversa.'
  - 'La presencia de más de tres variables en un problema implica que todas son directamente proporcionales.'
  - 'Sumar los coeficientes de las magnitudes en lugar de combinar multiplicaciones y divisiones.'
  - 'Ignorar las relaciones inversas tratando a todas las variables como si fueran directas.'
  - 'La magnitud de la incógnita principal se puede reemplazar libremente por cualquiera de las independientes.'
afirmaciones_verdaderas:
  - 'La proporcionalidad compuesta estudia situaciones donde tres o más magnitudes cuantitativas se relacionan mediante proporciones directas o inversas.'
  - 'Para aislar la relación entre una variable e incógnita en un sistema compuesto, se supone que las demás magnitudes permanecen constantes.'
al_terminar_debes_poder: 'Identificar y analizar problemas de proporcionalidad compuesta clasificando las relaciones entre múltiples magnitudes cuantitativas.'
