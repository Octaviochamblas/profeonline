procedimiento:
- 'Paso 1: Identifica el radio (r) de las bases y la altura (h) del cilindro.'
- 'Paso 2: Calcula el área de las dos bases circulares: 2πr².'
- 'Paso 3: Calcula el área lateral (2πrh) y súmala al resultado anterior para obtener
  el área total.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del área total del cilindro.
