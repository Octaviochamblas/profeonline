semantic_id: MAT.GEO.CUERPOS_REDONDOS_METRICA.CILINDRO_AREA
resumen_inicial: 'Cálculo del área total del cilindro: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'El área total de un cilindro se obtiene ''desenrollando'' su
  superficie: dos círculos (las bases) más un rectángulo (la superficie lateral desenrollada).'
explicacion_formal: '![Área total del cilindro](/static/img/geometria/espacio-cuerpos/cilindro-area.svg)


  ### Definición formal


  El área total de un cilindro es la suma del área de sus dos bases circulares ($2\pi
  r^2$) más el área lateral ($2\pi r h$, que corresponde al rectángulo que se obtiene
  al ''desenrollar'' la superficie curva, con base igual a la circunferencia de la
  base y altura igual a $h$): $A_T=2\pi r^2+2\pi rh$.


  ### Desarrollo didáctico


  Si un cilindro tiene radio 4 cm y altura 10 cm, su área total es $A_T=2\pi(4)^2+2\pi(4)(10)=32\pi+80\pi=112\pi\approx351,86$
  cm² (usando π≈3,14).'
