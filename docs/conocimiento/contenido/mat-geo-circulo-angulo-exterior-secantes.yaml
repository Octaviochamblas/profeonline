ejemplo_guiado:
  enunciado: Para analizar medida de un ángulo exterior formado por dos secantes trazadas
    desde un punto exterior, considera un ángulo $\alpha = 112^\circ$ ubicado en la
    posición dada. Determina el valor de la medida asociada sabiendo que $x + 1043^\circ
    = 112^\circ$.
  pasos:
  - Identificar la propiedad de medida de un ángulo exterior formado por dos secantes
    trazadas desde un punto exterior referida a $\alpha = 112^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1043 = 112 \implies x = 112 - 1043$.'
  - Concluir que la medida calculada para medida de un ángulo exterior formado por
    dos secantes trazadas desde un punto exterior es $x = -931^\circ$.
