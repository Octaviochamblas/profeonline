- titulo: ¿Se cumple siempre la propiedad principal de medida de un ángulo exterior
    formado por dos secantes trazadas desde un punto exterior en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede medida de un ángulo exterior formado por dos secantes trazadas desde
    un punto exterior asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
