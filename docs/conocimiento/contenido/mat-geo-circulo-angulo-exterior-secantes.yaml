procedimiento:
- 'Paso 1: Identifica el punto exterior P y las dos secantes trazadas desde él.'
- 'Paso 2: Identifica el arco lejano (entre los dos puntos más alejados de P) y el
  arco cercano (entre los dos puntos más próximos a P).'
- 'Paso 3: Resta el arco cercano al arco lejano y divide el resultado entre 2 para
  obtener la medida del ángulo en P.'
