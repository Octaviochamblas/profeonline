semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_EXTERIOR_SECANTES
resumen_inicial: 'Medida de un ángulo exterior formado por dos secantes trazadas desde
  un punto exterior: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: Desde un punto fuera de un círculo se pueden trazar dos secantes,
  cada una cortando la circunferencia en dos puntos; el ángulo entre ellas depende
  de la diferencia de los arcos que abarcan.
explicacion_formal: '![Ángulo exterior formado por dos secantes](/static/img/geometria/circunferencia-circulo/circulo-angulo-exterior-secantes.svg)


  ### Definición formal


  Si desde un punto exterior $P$ se trazan dos secantes a una circunferencia, cortándola
  en $A,B$ (la primera) y $C,D$ (la segunda), con $B$ y $D$ los puntos más alejados
  de $P$, entonces $m(\angle P)=\frac{m(\text{arco }BD)-m(\text{arco }AC)}{2}$, es
  decir, la semidiferencia entre el arco lejano y el arco cercano.


  ### Desarrollo didáctico


  Si el arco lejano $BD$ mide 100° y el arco cercano $AC$ mide 30°, el ángulo en $P$
  mide $\frac{100°-30°}{2}=35°$. Esta relación se demuestra trazando la cuerda auxiliar
  $BC$ y usando la propiedad del ángulo exterior de un triángulo junto con el teorema
  del ángulo inscrito.'
definiciones_clave: '- **Medida de un ángulo exterior formado por dos secantes trazadas
  desde un punto exterior**: Elemento o propiedad fundamental en el estudio de circunferencia
  y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
