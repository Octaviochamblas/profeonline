semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.DE_MORGAN_DISYUNCION
resumen_inicial: 'Definición y aplicación de la Ley de De Morgan para la negación de una disyunción: $\neg(p \lor q) \equiv \neg p \land \neg q$.'
explicacion_simple: |
  La **Segunda Ley de De Morgan** nos enseña cómo negar correctamente una frase que tiene la palabra "o" (una disyunción). Si alguien afirma: "No es verdad que vaya al cine o vaya al teatro", significa que **no fue al cine Y TAMPOCO fue al teatro**. En símbolos lógicos: **$\neg(p \lor q) \equiv \neg p \land \neg q$**. Al introducir la negación dentro del paréntesis, **se niega cada proposición por separado y el conector "o" ($\lor$) se transforma en "y" ($\land$)**.
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, la **Ley de De Morgan para la disyunción** es el teorema de dualidad lógica que establece la equivalencia semántica:
  $$\neg(p \lor q) \equiv \neg p \land \neg q \quad \iff \quad \models \neg(p \lor q) \leftrightarrow (\neg p \land \neg q)$$
  En la teoría de conjuntos, corresponde al complemento de la unión: $(A \cup B)^c = A^c \cap B^c$.

  ### Desglose simbólico
  - Transformación estructural: El operador unario exterior $\neg$ se distribuye invirtiendo los literales ($p \mapsto \neg p$, $q \mapsto \neg q$) y conmuta el operador disyuntor ($\lor$) por el conjuntor ($\land$).
  - Vector de salida conjunto:
    - $\mathbf{v}(p \lor q) = [V, V, V, F]^T \implies \mathbf{v}(\neg(p \lor q)) = [F, F, F, V]^T$.
    - $\mathbf{v}(\neg p \land \neg q) = [F \land F, F \land V, V \land F, V \land V]^T = [F, F, F, V]^T$.

  ### Síntesis didáctica
  Para negar que ocurra al menos una de dos alternativas, es imprescindible exigir que no ocurra ninguna de ellas simultáneamente.
definiciones_clave: |
  - **Ley de De Morgan para la disyunción**: Teorema lógico formalizado por $\neg(p \lor q) \equiv \neg p \land \neg q$.
  - **Dualidad de operadores**: Principio por el cual la disyunción se transforma en conjunción al aplicar la negación exterior.
  - **Complemento de la unión**: Interpretación conjuntista homomorfa a la segunda ley de De Morgan.
propiedades_relaciones: |
  - **Generalización a $n$ términos**: $\neg(p_1 \lor p_2 \lor \dots \lor p_n) \equiv \neg p_1 \land \neg p_2 \land \dots \land \neg p_n$.
  - **Forma normal conjuntiva**: Permite expresar negaciones de disyunciones como cláusulas conjuntivas atómicas.
ejemplo_guiado:
  enunciado: 'Demuestra mediante tabla de verdad que la fórmula $\neg(p \lor q)$ es lógicamente equivalente a $\neg p \land \neg q$.'
  pasos:
    - 'Paso 1: Disponer las $4$ combinaciones canónicas de entrada para $p$ y $q$.'
    - 'Paso 2: Calcular la subcolumna $p \lor q$: $[V, V, V, F]^T$.'
    - 'Paso 3: Calcular el lado izquierdo $\neg(p \lor q)$: Invertir la columna anterior, obteniendo $[F, F, F, V]^T$.'
    - 'Paso 4: Calcular el lado derecho $\neg p \land \neg q$:
      - Fila 1 ($F \land F$): $F$
      - Fila 2 ($F \land V$): $F$
      - Fila 3 ($V \land F$): $F$
      - Fila 4 ($V \land V$): $V$. Vector: $[F, F, F, V]^T$.'
    - 'Paso 5: Comparar los vectores: Como $[F, F, F, V]^T = [F, F, F, V]^T$, se demuestra formalmente la Segunda Ley de De Morgan.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A cuál de las siguientes expresiones es lógicamente equivalente la negación de la disyunción $\neg(p \lor q)$?'
    choices:
      - {text: '$\neg p \land \neg q$', is_correct: true}
      - {text: '$\neg p \lor \neg q$', is_correct: false}
      - {text: '$p \land q$', is_correct: false}
      - {text: '$\neg p \to q$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\neg p \land \neg q$''. Al aplicar De Morgan, el conectivo $\lor$ se transforma obligatoriamente en $\land$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la negación lógica formal del enunciado "El número $x$ es positivo o es igual a cero"?'
    choices:
      - {text: 'El número $x$ no es positivo y no es igual a cero', is_correct: true}
      - {text: 'El número $x$ no es positivo o no es igual a cero', is_correct: false}
      - {text: 'El número $x$ es estrictamente positivo', is_correct: false}
      - {text: 'El número $x$ es mayor que cero', is_correct: false}
    explanation: 'La alternativa correcta es ''El número $x$ no es positivo y no es igual a cero''. La negación de "o" produce un "y" entre los términos negados.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar una fórmula con estructura de disyunción negada: $\neg(A \lor B)$.'
  - 'Paso 2: Negar individualmente el primer término $A \mapsto \neg A$.'
  - 'Paso 3: Sustituir el conectivo de disyunción $\lor$ por el de conjunción $\land$.'
  - 'Paso 4: Negar individualmente el segundo término $B \mapsto \neg B$.'
  - 'Paso 5: Escribir la expresión equivalente resultante: $\neg A \land \neg B$.'
errores_correccion: |
  - **Error 1:** Mantener el conector "o" al negar: escribir $\neg(p \lor q) \equiv \neg p \lor \neg q$. **Cómo corregirlo:** La Ley de De Morgan para la disyunción exige transformar el operador $\lor$ en el operador $\land$.
  - **Error 2:** Confundir la negación de la disyunción con la de la conjunción. **Cómo corregirlo:** $\neg(p \lor q)$ genera conjunción ($\neg p \land \neg q$), mientras que $\neg(p \land q)$ genera disyunción ($\neg p \lor \neg q$).
ejemplos:
  - titulo: 'Negación de disyunción geométrica'
    enunciado: '¿Cómo se niega "El triángulo es equilátero o es isósceles"?'
    alternativas:
      - 'El triángulo no es equilátero y no es isósceles'
      - 'El triángulo no es equilátero o no es isósceles'
      - 'El triángulo es escaleno'
    respuesta: 'El triángulo no es equilátero y no es isósceles'
    solucion_pasos:
      - '1. Se niegan ambas partes afirmativas.'
      - '2. El conector "o" se transforma en "y".'
  - titulo: 'Aplicación con variable negada'
    enunciado: '¿A qué equivale $\neg(\neg p \lor q)$ aplicando De Morgan y doble negación?'
    respuesta: '$p \land \neg q$'
    solucion_pasos:
      - '1. $\neg(\neg p \lor q) \equiv \neg(\neg p) \land \neg q$.'
      - '2. Por doble negación: $p \land \neg q$.'
  - titulo: 'Vector de verdad'
    enunciado: '¿El vector de salida de $\neg(p \lor q)$ es $[F, F, F, V]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la inversión del vector canónico de la disyunción $[V, V, V, F]^T$.'
  - titulo: 'Equivalencia tautológica'
    enunciado: '¿La fórmula $\neg(p \lor q) \leftrightarrow (\neg p \land \neg q)$ es una tautología?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser una ley lógica universal su bicondicional es siempre tautológico.'
errores_frecuentes:
  - 'La afirmación de que la negación de una disyunción $\neg(p \lor q)$ es lógicamente equivalente a $\neg p \lor \neg q$.'
  - 'La afirmación de que la tabla de verdad de $\neg(p \lor q)$ contiene tres combinaciones verdaderas.'
  - 'La afirmación de que al aplicar De Morgan a una disyunción el símbolo $\lor$ se mantiene intacto.'
  - 'La afirmación de que la fórmula $\neg(p \lor q)$ produce el mismo vector de salida que $\neg(p \land q)$.'
  - 'La afirmación de que la Ley de De Morgan para la disyunción no es aplicable a expresiones con más de dos variables.'
afirmaciones_verdaderas:
  - 'La Ley de De Morgan para la disyunción establece que la negación de una disyunción es equivalente a la conjunción de las proposiciones negadas: $\neg(p \lor q) \equiv \neg p \land \neg q$.'
  - 'La tabla de verdad de $\neg(p \lor q)$ y la de $\neg p \land \neg q$ comparten exactamente el mismo vector columna de salida $[F, F, F, V]^T$.'
al_terminar_debes_poder: |
  QUÉ: Conocer, demostrar y aplicar la Ley de De Morgan para la negación de una disyunción ($\neg(p \lor q) \equiv \neg p \land \neg q$).
  CÓMO: Distribuir la negación sobre los operandos, transformar el operador $\lor$ en $\land$ y validar la equivalencia mediante tablas de verdad.
