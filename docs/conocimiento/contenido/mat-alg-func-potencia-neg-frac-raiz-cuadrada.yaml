semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RAIZ_CUADRADA
resumen_inicial: 'La gráfica de la función potencia con exponente un medio $f(x) = a x^{1/2} = a \sqrt{x}$ es una semiparábola de eje horizontal naciente en el origen $(0, 0)$ y definida en $[0, +\infty[$.'
explicacion_simple: |
  La función potencia con exponente un medio $f(x) = x^{1/2}$ es la conocida función raíz cuadrada $f(x) = \sqrt{x}$. Su gráfica parece la mitad superior de una parábola acostada hacia la derecha. Nace exactamente en el punto $(0, 0)$ y se extiende hacia la derecha abarcando solo números positivos o cero. A medida que $x$ crece, la curva sube pero cada vez de forma más suave y aplanada, pasando por puntos claves como $(1, 1)$, $(4, 2)$ y $(9, 3)$.
explicacion_formal: |
  ### Definición formal
  La **función potencia con exponente un medio** $f: [0, +\infty[ \to [0, +\infty[$ se define por la regla de correspondencia:
  $$f(x) = a \cdot x^{1/2} \equiv a \cdot \sqrt{x}$$
  para un parámetro de escala $a \neq 0$.

  ### Propiedades analíticas y geométricas
  1. **Dominio de Definición Real**: Exige la restricción de subradical no negativo: $\operatorname{Dom}(f) = [0, +\infty[$.
  2. **Inversa de la Función Cuadrática**: Es la función inversa de la rama restringida $y = \left(\frac{x}{a}\right)^2$ para $x \ge 0$.
  3. **Pendiente Tangente no Limitada en el Origen**: La derivada primera $f'(x) = \frac{a}{2\sqrt{x}}$ satisface $\lim_{x \to 0^+} f'(x) = +\infty$, lo que significa que la gráfica parte con una tangente completamente vertical en $(0, 0)$.
  4. **Concavidad permanente (Cóncava hacia abajo)**: La derivada segunda $f''(x) = -\frac{a}{4 x^{3/2}} < 0$ (para $a > 0$), lo que demuestra que la velocidad de crecimiento se desacelera continuamente a medida que $x \to +\infty$.

  ### Síntesis didáctica
  Puntos pivote característicos para $y = \sqrt{x}$:
  - $(0, 0)$, $(1, 1)$, $(4, 2)$, $(9, 3)$, $(16, 4)$.
definiciones_clave: |
  - **Función potencia exponente $1/2$**: Representación como potencia de la función raíz cuadrada principal.
  - **Semiparábola horizontal**: Forma geométrica resultante de la inversión de la mitad de una parábola cuadrática.
  - **Tangente vertical inicial**: Recta tangente en el punto $(0, 0)$ coincidente con el eje $y$.
propiedades_relaciones: |
  - **Invariancia por el signo de $a$**: Si $a > 0$, habita en el cuadrante I con recorrido $[0, +\infty[$. Si $a < 0$, habita en el cuadrante IV con recorrido $]-\infty, 0]$.
  - **Monotonía estricta**: Si $a > 0$, es estrictamente creciente en todo su dominio $[0, +\infty[$.
ejemplo_guiado:
  enunciado: 'Grafica cualitativamente y evalúa los puntos característicos de la función potencia $f(x) = 2x^{1/2}$ para $x \in \{0, 1, 4, 9\}$, indicando su dominio y recorrido.'
  pasos:
    - 'Paso 1: Evaluamos los puntos: $f(0) = 2\sqrt{0} = 0$, $f(1) = 2\sqrt{1} = 2$, $f(4) = 2\sqrt{4} = 4$, $f(9) = 2\sqrt{9} = 6$.'
    - 'Paso 2: Puntos cartesiano: $(0, 0)$, $(1, 2)$, $(4, 4)$, $(9, 6)$.'
    - 'Paso 3: Dominio: No acepta números negativos $\implies \operatorname{Dom}(f) = [0, +\infty[$.'
    - 'Paso 4: Recorrido: Como $a = 2 > 0$, las imágenes van desde 0 hasta $+\infty \implies \operatorname{Rec}(f) = [0, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué aspecto geométrico y dominio caracteriza a la gráfica de la función potencia $f(x) = 3x^{1/2} = 3\sqrt{x}$?'
    choices:
      - {text: 'Una semiparábola horizontal naciente en $(0, 0)$ que crece suavemente hacia la derecha, definida exclusivamente en $[0, +\infty[$', is_correct: true}
      - {text: 'Una parábola completa en forma de U definida en todo $\mathbb{R}$', is_correct: false}
      - {text: 'Una hipérbola con asíntota vertical en $x = 0$', is_correct: false}
      - {text: 'Una recta inclinada que pasa por los cuadrantes III y I', is_correct: false}
    explanation: 'La alternativa correcta es ''Una semiparábola horizontal naciente en $(0, 0)$ que crece suavemente hacia la derecha, definida exclusivamente en $[0, +\infty[$''. La función raíz cuadrada $x^{1/2}$ es una semiparábola acostada.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué le ocurre a la gráfica de la función potencia $f(x) = a x^{1/2}$ si el parámetro de escala es un número negativo como $a = -4$?'
    choices:
      - {text: 'La semiparábola horizontal se refleja hacia abajo en el cuadrante IV, teniendo un recorrido de reales no positivos $]-\infty, 0]$', is_correct: true}
      - {text: 'La gráfica se traslada a la izquierda habitando los números negativos del eje $x$', is_correct: false}
      - {text: 'Se transforma en una curva en forma de S', is_correct: false}
      - {text: 'La función se indefine en todos sus puntos', is_correct: false}
    explanation: 'La alternativa correcta es ''La semiparábola horizontal se refleja hacia abajo en el cuadrante IV, teniendo un recorrido de reales no positivos $]-\infty, 0]$''. El signo $a < 0$ invierte la curva verticalmente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que la función potencia sea de la forma $f(x) = a x^{1/2} = a\sqrt{x}$.'
  - 'Paso 2: Fijar el inicio de la curva en el punto origen $(0, 0)$.'
  - 'Paso 3: Calcular puntos pivote usando cuadrados perfectos ($x = 1, 4, 9, 16$).'
  - 'Paso 4: Trazar una semiparábola acostada suave hacia la derecha en el cuadrante I (si $a > 0$) o en el cuadrante IV (si $a < 0$).'
errores_correccion: |
  - **Error 1:** Dibujar la gráfica de la raíz cuadrada en el lado de los números negativos del eje $x$. **Cómo corregirlo:** La raíz cuadrada de números negativos en $\mathbb{R}$ no existe. El dominio está estrictamente restringido a $[0, +\infty[$.
  - **Error 2:** Dibujar dos ramas (una arriba y otra abajo) para $y = \sqrt{x}$. **Cómo corregirlo:** La función potencia $f(x) = x^{1/2}$ es la función raíz principal (valor positivo único), de modo que sólo consta de una semiparábola superior.
ejemplos:
  - titulo: 'Forma de gráfica de raíz cuadrada mónica'
    enunciado: '¿La gráfica de $f(x) = x^{1/2}$ pasa por $(4, 2)$?'
    alternativas:
      - 'Sí, porque $\sqrt{4} = 2$'
      - 'No, pasa por $(4, 16)$'
      - 'No, no está definida en 4'
    respuesta: 'Sí, porque $\sqrt{4} = 2$'
    solucion_pasos:
      - '1. Evaluamos $f(4) = 4^{1/2} = \sqrt{4} = 2$.'
      - '2. El punto $(4, 2)$ pertenece a la semiparábola.'
  - titulo: 'Dominio de exponente un medio'
    enunciado: '¿El dominio de $g(x) = 5 x^{1/2}$ son los reales no negativos $[0, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exige subradical no negativo: $\operatorname{Dom}(g) = [0, +\infty[$.'
  - titulo: 'Recorrido con coeficiente positivo'
    enunciado: '¿El recorrido de $f(x) = 3x^{1/2}$ es $[0, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con $a = 3 > 0$, las imágenes se extienden de 0 a $+\infty$.'
  - titulo: 'Desaceleración de la curva'
    enunciado: '¿La pendiente de $y = \sqrt{x}$ en $x = 100$ es más plana que en $x = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Su derivada $f''(x) = \frac{1}{2\sqrt{x}}$ disminuye a medida que $x$ crece, aplanando la curva.'
