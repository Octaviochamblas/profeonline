semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RAIZ_CUADRADA
resumen_inicial: 'Gráfica de la función potencia con exponente un medio: forma general
  $f(x) = a x^n$, simetría, dominio y recorrido en Exponentes negativos y fraccionarios.'
explicacion_simple: La función raíz cuadrada, tan conocida desde cursos anteriores,
  es en realidad un caso particular de función potencia con exponente $1/2$.
explicacion_formal: '### Definición formal


  $f(x)=\sqrt{x}=x^{1/2}$ está definida para $x\geq0$, ya que la raíz cuadrada de
  un número negativo no es real. Es estrictamente creciente en su dominio, con $f(0)=0$
  como valor mínimo y sin límite superior.


  ### Desarrollo didáctico


  $f(4)=2$, $f(9)=3$, $f(16)=4$: la función crece, pero cada vez más lentamente, ya
  que se necesitan incrementos cada vez mayores de $x$ para lograr el mismo aumento
  en $f(x)$.'
definiciones_clave: '- **Gráfica de la función potencia con exponente un medio**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a gráfica de la función potencia con exponente un medio.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de gráfica de la función potencia con exponente un medio.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de gráfica de la función
    potencia con exponente un medio.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar gráfica de la función potencia con exponente un medio?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en exponentes negativos y fraccionarios
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en exponentes negativos y fraccionarios.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en gráfica de la función potencia con exponente un medio?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconoce que $\sqrt{x}$ equivale a $x^{1/2}$, con exponente fraccionario.'
- 'Paso 2: Verifica que el dominio se restringe a $x\geq0$.'
- 'Paso 3: Evalúa algunos valores para confirmar el crecimiento lento característico.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en gráfica de la función potencia con exponente un medio.
ejemplos:
- titulo: Evaluación de la raíz cuadrada
  enunciado: Evalúa $f(x)=\sqrt{x}$ en $x=25$ y $x=100$.
  solucion_pasos:
  - Se calcula $f(25)=5$ y $f(100)=10$.
  - Aunque $x$ se cuadruplicó, $f(x)$ solo se duplicó, mostrando el crecimiento lento.
- titulo: Reescritura como exponente fraccionario
  enunciado: Reescribe $f(x)=\sqrt{x}$ en notación de exponente.
  solucion_pasos:
  - Se aplica la equivalencia entre raíz cuadrada y exponente $1/2$.
  - Se obtiene $f(x)=x^{1/2}$.
- titulo: ¿$f(x)=\sqrt{x}$ está definida para $x=-4$?
  enunciado: ¿La función $f(x)=\sqrt{x}$ está definida para $x=-4$?
  respuesta: 'No'
  solucion_pasos:
  - La raíz cuadrada de un número negativo no es un número real.
- titulo: ¿La función raíz cuadrada es decreciente en algún tramo de su dominio?
  enunciado: ¿La función $f(x)=\sqrt{x}$ es decreciente en algún intervalo de su dominio?
  respuesta: 'No'
  solucion_pasos:
  - Es estrictamente creciente en todo su dominio $[0,+\infty)$, sin tramos decrecientes.
errores_frecuentes:
- Suponer que la raíz cuadrada está definida para números negativos.
- Declarar el crecimiento lento de la raíz cuadrada con un comportamiento decreciente.
- No reconocer la equivalencia entre $\sqrt{x}$ y $x^{1/2}$ al resolver problemas.
- Omitir que $f(0)=0$ es el valor mínimo, no un punto excluido del dominio.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  gráfica de la función potencia con exponente un medio.
