  - 'La función $f(x) = x^{1/2}$ tiene dos ramas, una positiva y otra negativa al mismo tiempo.'
  - 'El origen $(0, 0)$ no forma parte de la gráfica de la raíz cuadrada.'
  - 'Una función con exponente $1/2$ tiene como dominio a todos los números reales $\mathbb{R}$.'
  - 'La velocidad de crecimiento de $y = \sqrt{x}$ se acelera al aumentar $x$.'
afirmaciones_verdaderas:
  - 'La función potencia con exponente un medio $f(x) = a x^{1/2} = a\sqrt{x}$ representa una semiparábola horizontal naciente en $(0, 0)$ y definida en $[0, +\infty[$.'
  - 'La derivada primera de la raíz cuadrada tiende a $+\infty$ en la cercanía del cero, haciendo que la semiparábola parta con una línea tangente vertical en el origen.'
