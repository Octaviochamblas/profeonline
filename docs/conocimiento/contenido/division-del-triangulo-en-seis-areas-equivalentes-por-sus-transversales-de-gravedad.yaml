semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.SEIS_AREAS_EQUIVALENTES
resumen_inicial: Al trazar las tres transversales de gravedad de un triángulo, este
  queda dividido en seis triángulos menores de áreas exactamente iguales ($S = \frac{1}{6}\text{Área}$).
  Asimismo, al unir el baricentro con los tres vértices se obtienen tres triángulos
  de área $\frac{1}{3}\text{Área}$.
explicacion_simple: '![Seis Áreas Equivalentes](/static/img/nodos/division-del-triangulo-en-seis-areas-equivalentes-por-sus-transversales-de-gravedad-intro.svg)


  Si trazas las 3 transversales de gravedad completas, el triángulo se parte en 6
  porciones triangulares:


  - **Las 6 porciones tienen la misma área**: Aunque algunos se vean más alargados
  y otros más anchos, los 6 tienen **exactamente la misma superficie** ($S = \frac{\text{Área
  total}}{6}$).

  - **Área equivalente no es forma idéntica**: Tienen igual cantidad de espacio adentro
  (misma área), aunque no tengan los mismos lados.

  - **En grupos de dos**: Si juntas dos porciones vecinas hacia un lado, obtienes
  $\frac{1}{3}$ del área total del triángulo.

  '
explicacion_formal: '### Teorema de las 6 áreas equivalentes

  Las tres transversales de gravedad dividen al triángulo $\Delta ABC$ en exactamente
  seis triángulos menores disjuntos de **igual área** (superficies equivalentes):


  $$S_1 = S_2 = S_3 = S_4 = S_5 = S_6 = \frac{1}{6} \operatorname{Área}(\Delta ABC)$$


  ### Desglose simbólico y geométrico

  - $S_i$: Área de cada uno de los 6 subtriángulos formados por el baricentro y los
  puntos medios.

  - Demostración por bases y alturas iguales: Cada par comparte base igual ($a/2$)
  y la misma altura respecto a $G$.

  - Equivalencia de superficie: Tienen igual área $\frac{A}{6}$, aunque en triángulos
  escalenos sus formas no son congruentes.


  ### Síntesis didáctica

  Las transversales de gravedad distribuyen la superficie del triángulo en 6 porciones
  perfectamente equitativas de un sexto del área total.'
definiciones_clave: '- **Áreas equivalentes**: Figuras geométricas que poseen exactamente
  la misma medida de superficie o área.

  - **Partición baricéntrica**: División del triángulo en 6 regiones de área $S =
  \text{Área}/6$.

  - **Triángulos baricéntricos principales**: Los tres triángulos formados al unir
  $G$ con los vértices ($\Delta GAB, \Delta GBC, \Delta GCA$), cada uno de área $\text{Área}/3$.

  '
propiedades_relaciones: '- **Área de cada uno de los 6 triángulos**: $S = \frac{1}{6}\text{Área}(\Delta
  ABC)$.

  - **Áreas de los 3 triángulos con base en los lados**: $\text{Área}(\Delta GAB)
  = \text{Área}(\Delta GBC) = \text{Área}(\Delta GCA) = \frac{1}{3}\text{Área}(\Delta
  ABC)$.

  - **Área del cuadrilátero medial**: El cuadrilátero formado por $G, M_a, C, M_b$
  tiene área $2S = \frac{1}{3}\text{Área}(\Delta ABC)$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Seis Áreas](/static/img/nodos/division-del-triangulo-en-seis-areas-equivalentes-por-sus-transversales-de-gravedad-ejemplos.svg)


    Un triángulo $ABC$ tiene un área total de $90\text{ cm}^2$. Se trazan sus tres
    transversales de gravedad, cortándose en el baricentro $G$. Calcula el área de
    uno de los 6 triángulos pequeños formados y el área del triángulo $\Delta GBC$.

    '
  pasos:
  - 'Paso 1: Identificar la fórmula del área de cada uno de los 6 triángulos pequeños:
    $S = \frac{\text{Área total}}{6}$.'
  - 'Paso 2: Calcular el área de un triángulo pequeño: $S = \frac{90\text{ cm}^2}{6}
    = 15\text{ cm}^2$.'
  - 'Paso 3: Calcular el área del triángulo $\Delta GBC$: está compuesto por 2 triángulos
    pequeños, luego $\text{Área}(\Delta GBC) = 2 \times 15 = 30\text{ cm}^2 = \frac{90}{3}\text{
    cm}^2$.'
  - 'Paso 4: Concluir que cada triángulo pequeño mide $15\text{ cm}^2$ y el triángulo
    $\Delta GBC$ mide $30\text{ cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En cuántos triángulos de áreas iguales dividen al triángulo sus tres
    transversales de gravedad?
  choices:
  - text: En 6 triángulos de áreas iguales
    is_correct: true
  - text: En 3 triángulos de áreas iguales
    is_correct: false
  - text: En 4 triángulos de áreas iguales
    is_correct: false
  - text: En 8 triángulos de áreas iguales
    is_correct: false
  explanation: Las tres transversales de gravedad dividen al triángulo en 6 triángulos
    de áreas iguales.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el área total de un triángulo es 54 cm², ¿cuánto mide el área del triángulo
    formado por el baricentro G y dos vértices (por ejemplo, ΔGAB)?
  choices:
  - text: $18\text{ cm}^2$
    is_correct: true
  - text: $9\text{ cm}^2$
    is_correct: false
  - text: $27\text{ cm}^2$
    is_correct: false
  - text: $13.5\text{ cm}^2$
    is_correct: false
  explanation: El área mide $18\text{ cm}^2$, ya que corresponde a un tercio del área
    total ($54 / 3 = 18\text{ cm}^2$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el área total del triángulo original.'
- 'Paso 2: Para hallar el área de uno de los 6 triángulos menores, dividir el área
  total entre 6: $S = \frac{\text{Área}}{6}$.'
- 'Paso 3: Para hallar el área de un triángulo con vértice en $G$ y base en un lado
  ($\Delta GBC$), multiplicar $S \times 2 = \frac{\text{Área}}{3}$.'
- 'Paso 4: Para cuadriláteros formados por dos triángulos menores, sumar sus áreas
  ($2S$).'
errores_correccion: No confundas áreas equivalentes (igual número de cm²) con congruencia
  de triángulos (misma forma geométrica).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si uno de los 6 triángulos pequeños determinados por las transversales
    de gravedad mide $7\text{ cm}^2$, ¿cuál es el área total del triángulo?
  alternativas:
  - $42\text{ cm}^2$
  - $21\text{ cm}^2$
  - $14\text{ cm}^2$
  respuesta: $42\text{ cm}^2$
  solucion_pasos:
  - $\text{Área total} = 6 \times 7 = 42\text{ cm}^2$.
- titulo: Ejemplo 2
  enunciado: ¿Los 6 triángulos formados por las tres transversales de gravedad son
    siempre congruentes entre sí?
  alternativas:
  - No, tienen igual área pero diferente forma en general
  - Sí, siempre son idénticos en forma y tamaño
  - Solo si el triángulo es escaleno
  respuesta: No, tienen igual área pero diferente forma en general
  solucion_pasos:
  - Tienen igual área ($S = \text{Área}/6$), pero solo son congruentes si el triángulo
    original es equilátero.
- titulo: ¿Las tres transversales de gravedad dividen al triángulo en seis regiones
    de igual área?
  respuesta: Sí
  solucion_pasos:
  - Sí, cada región tiene exactamente un sexto del área total.
- titulo: ¿El triángulo ΔGBC formado por el baricentro y la base tiene la mitad del
    área total?
  respuesta: 'No'
  solucion_pasos:
  - No, tiene un tercio ($\frac{1}{3}$) del área total (2 de las 6 regiones).
errores_frecuentes:
- Creer que los 6 triángulos deben ser idénticos en forma (congruentes) para tener
  la misma área.
- Dividir el área total entre 3 cuando se pregunta por uno de los 6 triángulos menores.
- Dividir el área total entre 6 cuando se pregunta por el triángulo $\Delta GBC$ (ese
  mide un tercio).
- Olvidar las unidades cuadradas en la respuesta.
- Asumir que esta propiedad solo se cumple en triángulos equiláteros.
afirmaciones_verdaderas:
- Las tres transversales de gravedad dividen al triángulo en seis triángulos de áreas
  equivalentes ($S = \frac{\text{Área}}{6}$).
- Los tres triángulos formados al unir el baricentro con los vértices tienen cada
  uno un tercio del área total.
al_terminar_debes_poder: '**QUÉ:** Calcular áreas de regiones triangulares y poligonales
  determinadas por las transversales de gravedad.


  **CÓMO:** Dividiendo el área total en 6 partes equivalentes ($S = \frac{\text{Área}}{6}$)
  y agrupándolas según las regiones solicitadas ($\Delta GBC = 2S = \frac{\text{Área}}{3}$).


  ![Resumen de 6 Áreas](/static/img/nodos/division-del-triangulo-en-seis-areas-equivalentes-por-sus-transversales-de-gravedad-resumen.svg)

  '
