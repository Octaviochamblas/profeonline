semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_DIRECTO
resumen_inicial: 'El reparto proporcional directo distribuye una cantidad total $C$ entre varios beneficiarios en partes directamente proporcionales a sus coeficientes o aportes $a_1, a_2, \dots, a_n$.'
explicacion_simple: |
  El reparto proporcional directo responde a la idea de justicia: *"quien aporta más o trabaja más, recibe una tajada más grande"*. Para repartir un pozo de dinero $C$ entre personas que aportaron cantidades $a, b, c$:
  1. Sumas los aportes de todos para saber el total de partes ($S = a + b + c$).
  2. Calculas la constante de repartición $k = \frac{C}{S}$ (cuánto dinero vale cada parte).
  3. Multiplicas esa constante $k$ por el aporte de cada persona.
explicacion_formal: |
  ### Definición formal
  El **reparto proporcional directo** de una cantidad escalar $C \in \mathbb{R}^+$ en $n$ partes $\{x_1, x_2, \dots, x_n\}$ proporcionales a los índices $\{a_1, a_2, \dots, a_n\}$ ($a_i > 0$) satisface el sistema de ecuaciones:
  $$\frac{x_1}{a_1} = \frac{x_2}{a_2} = \dots = \frac{x_n}{a_n} = k \quad \text{con} \quad \sum_{i=1}^n x_i = C$$

  ### Cálculo de la constante de reparto $k$
  Por la propiedad de adición de razones equivalentes:
  $$k = \frac{x_1 + x_2 + \dots + x_n}{a_1 + a_2 + \dots + a_n} = \frac{C}{\sum_{i=1}^n a_i}$$

  ### Determinación de cada parte
  Cada cuota individual asignada viene dada directamente por:
  $$x_i = k \cdot a_i = \left(\frac{C}{\sum_{j=1}^n a_j}\right) \cdot a_i$$

  ### Síntesis didáctica
  - Suma de índices: $S = a_1 + a_2 + \dots + a_n$.
  - Constante unitaria: $k = \frac{C}{S}$.
  - Parte individual: $x_i = k \cdot a_i$.
definiciones_clave: |
  - **Reparto proporcional directo**: Distribución equitativa de una suma total donde cada asignación es múltiplo de un índice individual.
  - **Constante de repartición $k$**: Valor monetario o numérico asignado a cada unidad entera de la suma de índices.
  - **Índices de reparto**: Números que representan el mérito, tiempo, horas o inversión de cada participante.
propiedades_relaciones: |
  - **Propiedad de suma total**: La suma de todas las partes calculadas $x_1 + x_2 + \dots + x_n$ es exactamente igual al total repartido $C$.
  - **Invariancia por escalamiento de índices**: Si todos los índices $a_i$ se multiplican o dividen por una constante $m \neq 0$, las partes resultantes $x_i$ no sufren ningún cambio.
ejemplo_guiado:
  enunciado: 'Tres socios invierten $\$2.000$, $\$3.000$ y $\$5.000$ respectivamente en un negocio. Si la ganancia total a repartir es de $\$60.000$, calcula cuánto dinero le corresponde a cada socio.'
  pasos:
    - 'Paso 1: Sumamos los índices de inversión: $S = 2.000 + 3.000 + 5.000 = 10.000$.'
    - 'Paso 2: Calculamos la constante de repartición $k = \frac{60.000}{10.000} = 6$. (Cada peso invertido genera $\$6$ de ganancia).'
    - 'Paso 3: Multiplicamos la constante $k=6$ por la inversión de cada socio:\n- Socio 1: $x_1 = 6 \cdot 2.000 = \$12.000$.\n- Socio 2: $x_2 = 6 \cdot 3.000 = \$18.000$.\n- Socio 3: $x_3 = 6 \cdot 5.000 = \$30.000$.'
    - 'Paso 4: Verificamos sumando las partes: $12.000 + 18.000 + 30.000 = \$60.000$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula la constante de repartición $k$ en un reparto proporcional directo de un total $C$ con índices $a, b, c$?'
    choices:
      - {text: 'Dividiendo la cantidad total $C$ entre la suma de los índices ($k = \frac{C}{a + b + c}$)', is_correct: true}
      - {text: 'Multiplicando la cantidad total $C$ por la suma de los índices', is_correct: false}
      - {text: 'Restando la suma de los índices al total $C$', is_correct: false}
      - {text: 'Dividiendo el primer índice $a$ entre el total $C$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividiendo la cantidad total $C$ entre la suma de los índices ($k = \frac{C}{a + b + c}$)''. La constante $k$ es la razón $C / \text{Suma}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se reparten $\$30.000$ entre dos hermanos en razón $2 : 3$, ¿cuánto dinero recibe el segundo hermano?'
    choices:
      - {text: '$\$18.000$, pues la suma de índices es $5$, $k = 30.000 / 5 = 6.000$, y $3 \cdot 6.000 = 18.000$', is_correct: true}
      - {text: '$\$12.000$, correspondiente al primer hermano', is_correct: false}
      - {text: '$\$15.000$, repartiendo en partes iguales', is_correct: false}
      - {text: '$\$20.000$, restando $30.000 - 10.000$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$18.000$, pues la suma de índices es $5$, $k = 30.000 / 5 = 6.000$, y $3 \cdot 6.000 = 18.000$''. $k = 6.000$, parte del 2º: $3 \cdot 6.000 = 18.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sumar todos los números o índices de reparto $S = a_1 + a_2 + \dots + a_n$.'
  - 'Paso 2: Dividir la cantidad total a repartir $C$ entre la suma obtenida para hallar $k = \frac{C}{S}$.'
  - 'Paso 3: Multiplicar la constante $k$ por cada uno de los índices individuales ($x_i = k \cdot a_i$).'
  - 'Paso 4: Comprobar que la suma de todas las partes calculadas sea estrictamente igual al total repartido $C$.'
errores_correccion: |
  - **Error 1:** Repartir en partes iguales una cantidad sin considerar los coeficientes o aportes. **Cómo corregirlo:** En un reparto proporcional, la cuota asignada debe ser **multiplicada por el coeficiente de cada participante**: $x_i = k \cdot a_i$.
  - **Error 2:** Dividir el total repartido entre el número de personas en lugar de entre la suma de los índices. **Cómo corregirlo:** La constante $k$ se obtiene dividiendo entre la **suma de los índices ($a + b + c$)**, jamás por la cantidad de personas.
ejemplos:
  - titulo: 'Reparto de premio por boletos comprados'
    enunciado: 'Se reparten $\$90.000$ según boletos comprados ($1, 3, 5$). ¿La constante es $k = 10.000$?'
    alternativas:
      - 'Sí, pues $90.000 / (1+3+5) = 90.000 / 9 = 10.000$'
      - 'No, la constante es 30.000'
      - 'No, es 9.000'
    respuesta: 'Sí, pues $90.000 / (1+3+5) = 90.000 / 9 = 10.000$'
    solucion_pasos:
      - '1. Suma de índices: $1 + 3 + 5 = 9$.'
      - '2. Constante: $k = 90.000 / 9 = 10.000$.'
  - titulo: 'Cálculo de la parte mayor'
    enunciado: 'En el reparto anterior de $k=10.000$ con índices $1, 3, 5$, ¿la parte mayor es $\$50.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $5 \cdot 10.000 = \$50.000$.'
  - titulo: 'Simplificación de índices de reparto'
    enunciado: 'Si los aportes son $\$20.000, \$40.000, \$60.000$, ¿se pueden simplificar a los índices $1, 2, 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividiendo todos por 20.000 se conservan las mismas razones.'
  - titulo: 'Verificación de suma total'
    enunciado: 'Si tres partes calculadas son $10.000$, $30.000$ y $50.000$, ¿suman exactamente el total de $90.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10.000 + 30.000 + 50.000 = 90.000$.'
errores_frecuentes:
  - 'Dividir el monto total entre la cantidad de participantes en lugar de sumar los índices de reparto.'
  - 'La constante de reparto $k$ debe ser diferente para cada uno de los beneficiarios.'
  - 'Sumar los índices y restar la suma a la cantidad total repartida.'
  - 'Invertir los índices asignando la mayor parte al beneficiario que aportó menos.'
  - 'La suma de las partes calculadas difiere del total disponible para repartir.'
afirmaciones_verdaderas:
  - 'El reparto proporcional directo asigna partes $x_i = k \cdot a_i$, donde la constante $k$ es el cociente entre el total repartido y la suma de los índices.'
  - 'La suma de todas las partes individuales asignadas en un reparto proporcional es idéntica al total repartido $C$.'
al_terminar_debes_poder: 'Calcular repartos proporcionales directos distribuyendo un total $C$ según los índices $a_i$ mediante la constante $k = \frac{C}{\sum a_i}$.'
