semantic_id: MAT.NUM.RAZONES_PROPORCIONES.REPARTO_DIRECTO
resumen_inicial: El reparto proporcional directo distribuye una cantidad total $T$ en partes $x_1, x_2, \dots, x_n$ proporcionales a una serie de índices $c_1, c_2, \dots, c_n$, calculando la cuota unitaria $k = \frac{T}{\sum c_i}$ y asignando a cada parte $x_i = c_i \cdot k$.
explicacion_simple: '![Reparto proporcional directo](/static/img/nodos/calculo-de-reparto-proporcional-directo-intro.svg)


  El **reparto proporcional directo** consiste en repartir una cantidad total $T$ de manera justa entre varios participantes, donde **a mayor índice (horas trabajadas, dinero aportado o edad), mayor es la parte recibida**:


  1. **Paso 1: Sumar todos los índices de reparto**:

  $$S = c_1 + c_2 + c_3 + \dots$$

  2. **Paso 2: Calcular la constante unitaria $k$ (el valor de cada parte)**:

  $$k = \frac{\text{Total } T}{c_1 + c_2 + c_3 + \dots}$$

  3. **Paso 3: Calcular cada parte individual**:

  $$\text{Parte } 1 = c_1 \cdot k, \quad \text{Parte } 2 = c_2 \cdot k, \quad \text{Parte } 3 = c_3 \cdot k$$

  - **Comprobación:** La suma de todas las partes obtenidas DEBE ser exactamente igual al total $T$ repartido.'
explicacion_formal: 'Sea una cantidad escalar $T \in \mathbb{R}^+$ que se desea particionar en $n$ sumandos $x_1, x_2, \dots, x_n$ tales que:


  $$\sum_{i=1}^{n} x_i = T \quad \text{y} \quad \frac{x_1}{c_1} = \frac{x_2}{c_2} = \dots = \frac{x_n}{c_n} = k \quad (c_i \in \mathbb{R}^+, \forall i)$$


  **Teorema Fundamental del Reparto Directo:**

  Por la propiedad de la serie de razones iguales:


  $$k = \frac{\sum_{i=1}^{n} x_i}{\sum_{i=1}^{n} c_i} = \frac{T}{\sum_{i=1}^{n} c_i}$$


  de donde se deduce unívocamente la asignación para cada componente:


  $$x_i = c_i \cdot \left(\frac{T}{\sum_{j=1}^{n} c_j}\right) \quad (\forall i \in \{1, \dots, n\})$$'
definiciones_clave: '- **Total a repartir ($T$)**: Magnitud global sujeta a partición proporcional.

  - **Índices de reparto ($c_i$)**: Coeficientes que determinan el peso relativo de cada cuota.

  - **Constante unitaria ($k$)**: Cociente $k = \frac{T}{\sum c_i}$ que representa el valor de 1 unidad de índice.'
propiedades_relaciones: '- **Conservación aditiva**: $\sum x_i = T$ de forma estricta.

  - **Invarianza por escala**: Si todos los índices $c_i$ se simplifican o multiplican por una constante común $m$, las partes resultantes $x_i$ permanecen idénticas.'
ejemplo_guiado:
  enunciado: '![Ejemplos de reparto directo](/static/img/nodos/calculo-de-reparto-proporcional-directo-ejemplos.svg)


    Reparta $\$100.000$ entre tres personas en razón $2 : 3 : 5$, y calcule cuánto le corresponde a dos hermanos de $12$ y $16$ años si se reparten $\$72.000$ directamente proporcional a sus edades.'
  pasos:
  - 'Paso 1: Para el reparto $2:3:5$: Suma de índices $= 2 + 3 + 5 = 10$.'
  - 'Paso 2: Calcular cuota $k = \frac{100000}{10} = \$10.000$. Partes: $2k = \$20.000$, $3k = \$30.000$, $5k = \$50.000$.'
  - 'Paso 3: Para las edades: Simplificar razón $12 : 16 \implies 3 : 4$ (suma $= 7$).'
  - 'Paso 4: Calcular $k = \frac{72000}{7} \implies 3k = \$30.857$ y $4k = \$41.143$ (suma $= \$72.000$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la constante unitaria $k$ en un reparto proporcional directo?
  choices:
  - text: $k = \frac{T}{\sum c_i}$ (Total dividido por la suma de los índices)
    is_correct: true
  - text: $k = T \cdot \sum c_i$
    is_correct: false
  - text: $k = \frac{\sum c_i}{T}$
    is_correct: false
  - text: $k = T - \sum c_i$
    is_correct: false
  explanation: La alternativa correcta es '$k = \frac{T}{\sum c_i}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la persona con índice 5 recibió $50.000 del total de $100.000?
  choices:
  - text: Porque su índice 5 representa exactamente la mitad (5/10) del total de partes a repartir
    is_correct: true
  - text: Porque fue la primera persona en la lista
    is_correct: false
  - text: Porque 50.000 es un número redondo
    is_correct: false
  - text: Por casualidad aritmética
    is_correct: false
  explanation: La alternativa correcta es 'Porque su índice 5 representa exactamente la mitad (5/10) del total de partes a repartir'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sumar todos los coeficientes o índices de reparto $S = c_1 + c_2 + \dots + c_n$.'
- 'Paso 2: Dividir el total $T$ entre la suma $S$ para hallar la constante unitaria $k = \frac{T}{S}$.'
- 'Paso 3: Multiplicar cada índice individual por $k$ ($x_i = c_i \cdot k$) y verificar que la suma coincida con $T$.'
errores_correccion: '- **Error 1: Dividir entre el número de personas en vez de la suma de partes.** **Cómo corregirlo:** La división es $k = \frac{T}{\sum c_i}$ (ponderada por los índices).

  - **Error 2: Olvidar comprobar la suma.** **Cómo corregirlo:** Sumar $x_1 + x_2 + \dots + x_n$ para asegurar que dé exactamente $T$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Repartir $\$60.000$ entre dos socios en razón $1 : 3$. ¿Cuánto recibe el segundo socio?'
  alternativas:
  - $\$45.000$
  - $\$15.000$
  - $\$30.000$
  respuesta: $\$45.000$
  solucion_pasos:
  - Suma $= 1 + 3 = 4 \implies k = \frac{60000}{4} = 15000 \implies 3k = \$45.000$.
- titulo: Ejemplo 2
  enunciado: Tres agricultores aportan $2$, $3$ y $5\text{ hectáreas}$. Si reciben un subsidio total de $\$800.000$, ¿cuánto recibe el primero?
  alternativas:
  - $\$160.000$
  - $\$240.000$
  - $\$400.000$
  respuesta: $\$160.000$
  solucion_pasos:
  - Suma $= 10 \implies k = 80.000 \implies 2k = \$160.000$.
- titulo: ¿Es la suma de las partes siempre igual al total repartido?
  respuesta: Sí
  solucion_pasos:
  - Sí, la conservación de la suma total $\sum x_i = T$ es obligatoria.
  alternativas:
  - texto: Sí, es el principio de conservación aditiva del reparto
    es_correcta: true
    retroalimentacion: ¡Correcto! Cierre de suma exacto.
  - texto: No, se pierde un porcentaje por cálculo
    es_correcta: false
    retroalimentacion: Incorrecto, la partición matemática es exacta.
  - texto: No, puede ser mayor al total
    es_correcta: false
    retroalimentacion: Incorrecto, violaría la conservación aditiva.
- titulo: ¿Se pueden simplificar los índices de reparto antes de calcular k?
  respuesta: Sí
  solucion_pasos:
  - Sí, simplificar los índices preserva exactamente la razón geométrica.
  alternativas:
  - texto: Sí, simplificar los índices por un divisor común no altera las cuotas finales
    es_correcta: true
    retroalimentacion: ¡Correcto! Invarianza por escala.
  - texto: No, altera los montos finales
    es_correcta: false
    retroalimentacion: Incorrecto, la proporción se mantiene idéntica.
  - texto: No, solo está permitido amplificar
    es_correcta: false
    retroalimentacion: Incorrecto, cualquier multiplicación o división escalar es válida.
errores_frecuentes:
- Dividir el total entre la cantidad de participantes ignorando las ponderaciones.
- Asignar la mayor cuota al menor índice.
- Cometer errores de cálculo en la suma de los índices.
- No verificar la suma de las partes resultantes.
afirmaciones_verdaderas:
- En el reparto directo, a mayor índice corresponde mayor parte asignada.
- La constante unitaria se obtiene mediante $k = \frac{T}{\sum c_i}$.
- La suma de todas las partes obtenidas es estrictamente igual al total repartido.
al_terminar_debes_poder: '![Síntesis de reparto directo](/static/img/nodos/calculo-de-reparto-proporcional-directo-resumen.svg)


  QUÉ: Calcular repartos proporcionales directos de cantidades continuas o discretas.


  CÓMO: Determinando la constante unitaria $k = \frac{T}{\sum c_i}$ y multiplicándola por cada índice de reparto $x_i = c_i \cdot k$, verificando la conservación $\sum x_i = T$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
