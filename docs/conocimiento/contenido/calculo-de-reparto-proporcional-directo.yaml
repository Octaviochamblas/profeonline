semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_DIRECTO
resumen_inicial: 'Cálculo de reparto proporcional directo: concepto y propiedades fundamentales
  en Reparto proporcional y escalas.'
explicacion_simple: Si tú pones $10.000 para comprar un boleto de lotería y tu amigo pone
  $5.000, ¿es justo que se dividan el premio en partes iguales? El reparto directo asegura
  que quien más pone, más recibe, de forma matemáticamente exacta.
explicacion_formal: "El **reparto directo** consiste en distribuir una cantidad total ($T$)\
  \ entre varias partes ($A, B, C...$) de modo que estas partes reciban cantidades proporcionales\
  \ a sus respectivos índices de participación ($a, b, c...$).\n\nEl método de la **Constante\
  \ de Reparto ($K$)** es el más rápido:\n1. Suma todos los índices: $S = a + b + c$\n2. Divide\
  \ el Total a repartir por esta suma para hallar $K$: $K = T / S$\n3. La porción de cada\
  \ uno es su índice multiplicado por $K$: \n   - Parte de A $= a \\cdot K$\n   - Parte de\
  \ B $= b \\cdot K$"
definiciones_clave: '- **Cálculo de reparto proporcional directo**: Elemento central dentro
  del estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de reparto proporcional directo.'
ejemplo_guiado:
  enunciado: 'Reparte 90.000 pesos de premio entre tres socios según su inversión: 1, 2 y
    6 partes respectivamente.'
  pasos:
  - 'Sumo los índices de reparto: 1 más 2 más 6 es igual a 9.'
  - 'Calculo la constante K: 90.000 dividido entre 9 es igual a 10.000.'
  - 'Calculo cada parte: el primer socio recibe 1 por 10.000, o sea 10.000; el segundo, 2
    por 10.000, o sea 20.000; el tercero, 6 por 10.000, o sea 60.000.'
