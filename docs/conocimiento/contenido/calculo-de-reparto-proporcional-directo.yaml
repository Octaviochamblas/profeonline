resumen_inicial: El reparto proporcional directo distribuye una cantidad total $T$
  entre varias partes en forma directamente proporcional a una serie de índices $\{a,
  b, c, \dots\}$, asignando a cada parte $x_i = k \cdot a_i$ donde $k = \frac{T}{\sum
  a_i}$.
explicacion_simple: Repartir directamente significa que quien aporta o tiene un número
  mayor de partes recibe una tajada proporcionalmente más grande del total. Para hacerlo,
  sumamos todos los números de participación, dividimos la cantidad total entre esa
  suma para hallar la constante $k$, y multiplicamos $k$ por cada número de participación.
explicacion_formal: 'Para una cantidad total $T > 0$ a repartir entre las partes $\{x,
  y, z\}$ en razón directa a los coeficientes $\{a, b, c\}$, la **Fórmula de Reparto
  Proporcional Directo** se define por la constante común $k$:


  $$k = \frac{T}{a + b + c} \implies x = k \cdot a, \quad y = k \cdot b, \quad z =
  k \cdot c$$


  **Verificación de conservación de la suma:**

  $$x + y + z = k(a + b + c) = \left( \frac{T}{a + b + c} \right) (a + b + c) = T$$'
definiciones_clave: '- **Reparto proporcional directo**: Distribución de $T$ proporcional
  a índices de reparto directos $x_i = k \cdot a_i$.'
propiedades_relaciones: '- **Constante de reparto $k$**: $k = \frac{\text{Total}}{\text{Suma
  de índices}}$.'
ejemplo_guiado:
  enunciado: Reparta \$90.000 entre tres personas en forma directamente proporcional
    a $2$, $3$ y $4$.
  pasos:
  - 'Paso 1: Sumar los índices de reparto: $2 + 3 + 4 = 9$.'
  - 'Paso 2: Calcular la constante $k = \frac{90.000}{9} = 10.000$.'
  - 'Paso 3: Multiplicar la constante por cada índice:

    - Primera persona: $2 \cdot 10.000 = 20.000$

    - Segunda persona: $3 \cdot 10.000 = 30.000$

    - Tercera persona: $4 \cdot 10.000 = 40.000$.'
  - 'Conclusión: Las partes son \$20.000, \$30.000 y \$40.000 (verificable: $20.000+30.000+40.000=90.000$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la constante de reparto k en un reparto proporcional
    directo de un total T entre índices a, b, c?
  choices:
  - text: 'Dividiendo el total entre la suma de los índices: k = T / (a + b + c)'
    is_correct: true
  - text: Multiplicando k = T · (a + b + c)
    is_correct: false
  - text: Restando k = T - a - b - c
    is_correct: false
  - text: Sumando k = a + b + c
    is_correct: false
  explanation: 'La alternativa correcta es ''Dividiendo el total entre la suma de
    los índices: k = T / (a + b + c)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para $90.000 en razón 2 : 3 : 4, ¿cuál fue la parte
    de la tercera persona?'
  choices:
  - text: 40.000 $
    is_correct: true
  - text: 20.000 $
    is_correct: false
  - text: 30.000 $
    is_correct: false
  - text: 10.000 $
    is_correct: false
  explanation: La alternativa correcta es '40.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de efectuar el reparto proporcional
  directo de una cantidad total $T$ multiplicando la constante $k = \frac{T}{\sum
  a_i}$ por cada índice.
semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_DIRECTO
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.REPARTO_DIRECTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
