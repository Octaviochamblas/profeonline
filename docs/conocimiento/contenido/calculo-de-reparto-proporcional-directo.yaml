procedimiento:
- 'Paso 1: Suma todos los valores base o índices de reparto.'
- 'Paso 2: Divide la cantidad total a repartir entre esa suma. El resultado es el valor de
  ''una cuota'' ($K$).'
- 'Paso 3: Multiplica el índice de cada participante por la cuota $K$ para saber cuánto le
  toca.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de reparto
  proporcional directo.
ejemplos:
- titulo: Reparto de ganancias
  enunciado: Repartir $60.000 de ganancia entre Ana (trabajó 2 horas) y Luis (trabajó 4 horas).
  solucion_pasos:
  - 'Suma de índices (horas totales): $2 + 4 = 6$ horas.'
  - 'Calculamos la constante: $K = 60.000 / 6 = 10.000$ (pagan 10 mil por hora).'
  - 'Ana recibe: $2 \cdot 10.000 = 20.000$.'
  - 'Luis recibe: $4 \cdot 10.000 = 40.000$.'
- titulo: Ejemplo 2
  enunciado: Reparte 40.000 pesos entre dos personas en razón 3:5. ¿Cuánto recibe la de mayor
    índice?
  alternativas:
  - '25.000'
  - '15.000'
  - '20.000'
  respuesta: '25.000'
  solucion_pasos:
  - K es igual a 40.000 dividido entre 8, o sea 5.000; 5 por 5.000 es igual a 25.000.
- titulo: Ejemplo 3
  enunciado: Reparte 180.000 pesos entre tres personas en razón 2:3:4. ¿Cuánto recibe la de
    índice 3?
  alternativas:
  - '60.000'
  - '40.000'
  - '80.000'
  respuesta: '60.000'
  solucion_pasos:
  - K es igual a 180.000 dividido entre 9, o sea 20.000; 3 por 20.000 es igual a 60.000.
- titulo: ¿La constante K se calcula dividiendo el total entre la suma de los índices?
  respuesta: Sí
  solucion_pasos:
  - Esa es la base del método del reparto proporcional directo.
errores_frecuentes:
- Repartir en partes iguales ignorando los índices.
- Dividir el total por cada índice de forma aislada, en vez de sumarlos primero.
- Sumar mal los índices y arrastrar el error al cálculo de $K$.
- Repartir el total en partes iguales entre los participantes, ignorando sus índices.
- Dividir el total entre cada índice por separado, en vez de sumarlos primero.
afirmaciones_verdaderas:
- La propiedad de cálculo de reparto proporcional directo preserva la consistencia lógica.
- En un reparto proporcional directo, la constante K representa cuánto corresponde a cada
  unidad de índice.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de reparto proporcional
  directo.
