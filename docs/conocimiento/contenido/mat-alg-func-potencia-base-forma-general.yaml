semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.FORMA_GENERAL
resumen_inicial: 'El reconocimiento de la forma general $f(x) = a x^n$ exige aislar el coeficiente multiplicativo $a$ y el exponente $n$ de la base $x$.'
explicacion_simple: |
  Para analizar cualquier función potencia en forma general $f(x) = a x^n$, debemos saber leer e interpretar dos números: el coeficiente $a$ que está multiplicando al frente de la variable, y el exponente $n$ que está volando arriba de la $x$. Por ejemplo, en $f(x) = -4x^3$, el coeficiente es $a = -4$ y el exponente es $n = 3$. Si no hay ningún número escrito al frente (como en $x^5$), el coeficiente vale $1$.
explicacion_formal: |
  ### Definición formal
  La **forma general canónica monómica** de la función potencia real se expresa mediante la igualdad formal:
  $$f(x) = a \cdot x^n$$
  donde los componentes del modelo funcional se descomponen analíticamente en:
  1. **Coeficiente $a \in \mathbb{R}^*$**: Factor de escala escalar que determina la dilatación, contracción o inversión respecto al eje $x$.
  2. **Base $x \in \mathbb{R}$**: Variable independiente del dominio.
  3. **Exponente $n \in \mathbb{R}^*$**: Grado numérico fijado que condiciona la simetría, paridad y monotonía de la gráfica.

  ### Expresión de formas no canónicas
  - Forma fraccionaria o recíproca: $f(x) = \frac{a}{x^m} \equiv a \cdot x^{-m}$.
  - Forma radical: $f(x) = a \sqrt[m]{x^k} \equiv a \cdot x^{k/m}$.
  - Forma factorizada mónica: $f(x) = a (1 \cdot x)^n \equiv a x^n$.

  ### Síntesis didáctica
  Identificación de coeficientes implícitos:
  - Si $f(x) = x^n \implies a = 1$.
  - Si $f(x) = -x^n \implies a = -1$.
  - Si $f(x) = \frac{x^n}{k} \implies a = \frac{1}{k}$.
definiciones_clave: |
  - **Forma general $f(x) = a x^n$**: Expresión canónica monómica de la función potencia.
  - **Coeficiente implícito**: Valor de $a = 1$ o $a = -1$ cuando no se escribe un número explícito frente a $x$.
  - **Exponente canónico**: Número $n$ obtenido tras convertir radicales o fracciones a potencia simple.
propiedades_relaciones: |
  - **Invariancia del exponente en el origen**: Para todo $n > 0$ y todo $a \neq 0$, la función cumple $f(0) = a \cdot 0^n = 0$.
  - **Punto de evaluación unitario**: Para $x = 1$, la función entrega directamente el coeficiente: $f(1) = a \cdot 1^n = a$.
ejemplo_guiado:
  enunciado: 'Extrae el coeficiente $a$ y el exponente $n$ de las siguientes funciones potencia expresándolas en su forma general $f(x) = a x^n$: A) $f(x) = -x^7$, B) $g(x) = \frac{x^4}{5}$, C) $h(x) = \frac{-2}{x^5}$.'
  pasos:
    - 'Paso 1: Para $f(x) = -x^7$, el signo menos representa un coeficiente $a = -1$. El exponente es $n = 7$. Forma: $f(x) = (-1)x^7$.'
    - 'Paso 2: Para $g(x) = \frac{x^4}{5}$, dividiendo por 5 equivale a multiplicar por $\frac{1}{5}$. Coeficiente $a = \frac{1}{5}$, exponente $n = 4$. Forma: $g(x) = \frac{1}{5} x^4$.'
    - 'Paso 3: Para $h(x) = \frac{-2}{x^5}$, pasamos la potencia del denominador al numerador cambiando el signo del exponente: $h(x) = -2 x^{-5}$. Coeficiente $a = -2$, exponente $n = -5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son el coeficiente $a$ y el exponente $n$ de la función potencia $f(x) = -\frac{3x^6}{2}$ al llevarla a su forma general $f(x) = a x^n$?'
    choices:
      - {text: 'Coeficiente $a = -\frac{3}{2}$ y exponente $n = 6$', is_correct: true}
      - {text: 'Coeficiente $a = -3$ y exponente $n = 6$', is_correct: false}
      - {text: 'Coeficiente $a = 2$ y exponente $n = -6$', is_correct: false}
      - {text: 'Coeficiente $a = -1$ y exponente $n = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''Coeficiente $a = -\frac{3}{2}$ y exponente $n = 6$''. Reordenamos la constante multiplicativa como un único coeficiente $a = -\frac{3}{2}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué valor entrega la función potencia $f(x) = a x^n$ al ser evaluada en $x = 1$?'
    choices:
      - {text: 'Entrega exactamente el valor del coeficiente $a$, pues $f(1) = a \cdot 1^n = a$', is_correct: true}
      - {text: 'Entrega el valor del exponente $n$', is_correct: false}
      - {text: 'Entrega siempre cero', is_correct: false}
      - {text: 'Entrega el valor $a + n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Entrega exactamente el valor del coeficiente $a$, pues $f(1) = a \cdot 1^n = a$''. Evaluar en 1 aísla el parámetro $a$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reescribir la expresión de la función agrupando todas las constantes numéricas que multiplican a $x$.'
  - 'Paso 2: Expresar los denominadores o raíces en forma de exponente entero o fraccionario en el numerador.'
  - 'Paso 3: Identificar el coeficiente multiplicativo resultante como el parámetro $a$.'
  - 'Paso 4: Identificar el número en la potencia de $x$ como el parámetro $n$.'
errores_correccion: |
  - **Error 1:** Afirmar que en $f(x) = x^4$ no existe coeficiente $a$. **Cómo corregirlo:** Si no se escribe un número explícito antes de $x^n$, el coeficiente es el elemento neutro de la multiplicación $a = 1$.
  - **Error 2:** Confundir el divisor con el exponente (ej: en $f(x) = \frac{x^3}{4}$ decir que $a = 4$). **Cómo corregirlo:** El número 4 está dividiendo, por lo que el coeficiente multiplicativo es la fracción $a = \frac{1}{4}$.
ejemplos:
  - titulo: 'Extracción en término negativo'
    enunciado: '¿Cuáles son los parámetros en $f(x) = -x^8$?'
    alternativas:
      - '$a = -1, n = 8$'
      - '$a = 0, n = 8$'
      - '$a = -8, n = 1$'
    respuesta: '$a = -1, n = 8$'
    solucion_pasos:
      - '1. El signo negativo indica $a = -1$.'
      - '2. La potencia en $x$ es 8 $\implies n = 8$.'
  - titulo: 'Extracción en fracción'
    enunciado: '¿En $g(x) = \frac{x^2}{3}$, el coeficiente $a$ es $\frac{1}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividir por 3 equivale a multiplicar por $\frac{1}{3}$.'
  - titulo: 'Reescritura de fracción negativa'
    enunciado: '¿La función $h(x) = \frac{5}{x^4}$ equivale a $a = 5$ y $n = -4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al subir $x^4$ al numerador queda $5x^{-4}$.'
  - titulo: 'Punto de evaluación $x=1$'
    enunciado: 'Si $f(x) = -7x^5$, ¿evaluar en $x = 1$ resulta en $-7$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(1) = -7(1)^5 = -7$.'
errores_frecuentes:
  - 'En la función $f(x) = x^6$, el coeficiente $a$ es igual a cero.'
  - 'En la función $f(x) = \frac{x^5}{2}$, el coeficiente $a$ es igual a 2.'
  - 'En la función $f(x) = -x^3$, el exponente $n$ es $-3$.'
  - 'Evaluar $f(x) = a x^n$ en $x = 1$ da como resultado $1$.'
  - 'El coeficiente $a$ y el exponente $n$ deben ser siempre números enteros positivos.'
afirmaciones_verdaderas:
  - 'La forma general $f(x) = a x^n$ descompone la función en un coeficiente multiplicativo $a$ y un exponente $n$.'
  - 'Evaluar la función potencia en $x = 1$ entrega exactamente el valor del coeficiente $a$ ($f(1) = a$).'
al_terminar_debes_poder: 'Reconocer y extraer los parámetros $a$ y $n$ de cualquier función potencia dada en su forma general.'
