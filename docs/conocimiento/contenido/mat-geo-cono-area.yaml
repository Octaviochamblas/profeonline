- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de cálculo del área total del cono y
    elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
