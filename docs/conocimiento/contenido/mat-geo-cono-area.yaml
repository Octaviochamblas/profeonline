procedimiento:
- 'Paso 1: Identifica el radio (r) y la altura (h) del cono, y calcula la generatriz
  g=√(r²+h²) si no se conoce directamente.'
- 'Paso 2: Calcula el área de la base circular: πr².'
- 'Paso 3: Calcula el área lateral (πrg) y súmala al resultado anterior para obtener
  el área total.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del área total del cono.
