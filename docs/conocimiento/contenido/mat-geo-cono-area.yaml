semantic_id: MAT.GEO.CUERPOS_REDONDOS_METRICA.CONO_AREA
resumen_inicial: 'Cálculo del área total del cono: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El área total de un cono se obtiene sumando el área de su base
  circular más el área lateral (un sector circular que se forma al 'desenrollar' la
  superficie curva).
explicacion_formal: '![Área total del cono](/static/img/geometria/espacio-cuerpos/cono-area.svg)


  ### Definición formal


  El área total de un cono es la suma del área de su base circular ($\pi r^2$) más
  el área lateral ($\pi r g$, donde $g$ es la generatriz): $A_T=\pi r^2+\pi rg$. La
  generatriz se calcula mediante el teorema de Pitágoras: $g=\sqrt{r^2+h^2}$.


  ### Desarrollo didáctico


  Si un cono tiene radio 3 cm y altura 4 cm, primero se calcula la generatriz: $g=\sqrt{3^2+4^2}=5$
  cm. Luego, el área total es $A_T=\pi(3)^2+\pi(3)(5)=9\pi+15\pi=24\pi\approx75,36$
  cm² (usando π≈3,14).'
