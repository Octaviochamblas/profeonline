semantic_id: MAT.ALG.FRACCIONES_DIV.FACTORIZACION_PREVIA
resumen_inicial: 'Factorización previa en división de fracciones algebraicas: concepto,
  reglas operativas y simplificación en División de fracciones algebraicas.'
explicacion_simple: Al igual que en la multiplicación, la clave de la división es
  factorizar todo. El mejor momento para hacerlo es justo después de haber 'volteado'
  la segunda fracción.
explicacion_formal: '### Definición formal


  La cancelación cruzada solo es válida en multiplicaciones. En divisiones, los factores
  están en posiciones invertidas matemáticamente.


  ### Desarrollo didáctico


  Al igual que en la multiplicación, lanzarse a multiplicar el resultado del ''producto
  recíproco'' sin factorizar es un suicidio algebraico.


  El orden estricto de ejecución para divisiones complejas es:

  1. Aplica la regla ''Mantener, Cambiar, Voltear'' para transformar la división en
  multiplicación.

  2. Inmediatamente después, **factoriza absolutamente todos** los numeradores y denominadores
  resultantes.

  3. Ahora que todo son puros factores (paréntesis) multiplicándose, busca paréntesis
  idénticos arriba y abajo para simplificarlos (tacharlos).


  Si te saltas el paso 2 y multiplicas primero, crearás polinomios masivos que te
  harán perder el tiempo en exámenes.'
definiciones_clave: '- **Factorización previa en división de fracciones algebraicas**:
  Procedimiento o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
