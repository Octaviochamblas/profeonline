semantic_id: MAT.ALG.FRACCIONES_DIV.FACTORIZACION_PREVIA
resumen_inicial: Factorizar todos los polinomios antes de invertir y multiplicar simplifica la división de fracciones algebraicas.
explicacion_simple: |
  Al dividir fracciones algebraicas compuestas por polinomios, es clave **factorizar cada numerador y denominador desde el comienzo**.

  Una vez que todos los componentes están expresados en sus factores primos (paréntesis), invertimos la segunda fracción para convertir la división en multiplicación.

  Esto permite cancelar los factores comunes de inmediato antes de realizar cualquier producto extenso.
explicacion_formal: |
  ### Definición formal
  Dadas $\frac{P_1(x)}{Q_1(x)} \div \frac{P_2(x)}{Q_2(x)}$, la **factorización previa en división** descompone los polinomios en factores primos $P_i(x) = c_i \prod F_{i,j}(x)$ y $Q_i(x) = k_i \prod G_{i,j}(x)$ antes de realizar la inversión:

  $$\frac{P_1(x)}{Q_1(x)} \div \frac{P_2(x)}{Q_2(x)} = \frac{\prod F_{1,j}(x)}{\prod G_{1,j}(x)} \cdot \frac{\prod G_{2,j}(x)}{\prod F_{2,j}(x)}$$

  ### Desglose de la fórmula
  - $\prod F_{1,j}(x)$: Factores descompuestos del primer numerador.
  - $\prod G_{2,j}(x)$: Factores descompuestos del segundo denominador que pasan al numerador al invertir.

  ### Síntesis didáctica
  Factorizar antes de invertir expone directamente los paréntesis idénticos cruzados y verticales para cancelarlos de inmediato.
definiciones_clave: |
  - **Factorización previa en división**: Descomposición inicial de polinomios para simplificar términos inmediatamente al invertir el divisor.
  - **Simplificación anticipada**: Eliminación de factores comunes reduciendo el grado del dividendo y divisor resultantes.
propiedades_relaciones: |
  - **Optimización operativa**: Evita multiplicar polinomios de grado 2 o 3 para formar expresiones complejas de grado alto.
  - **Registro de restricciones acumuladas**: Se deben excluir los valores que anulen $Q_1(x)$, $Q_2(x)$ y $P_2(x)$.
ejemplo_guiado:
  enunciado: 'Resuelve la división de fracciones algebraicas $\frac{x^2 - 1}{x + 3} \div \frac{x - 1}{x^2 - 9}$ mediante factorización previa, y evalúa el resultado para $x = 5$.'
  pasos:
    - 'Paso 1: Factorizar el primer numerador $x^2 - 1 = (x - 1)(x + 1)$.'
    - 'Paso 2: Factorizar el segundo denominador $x^2 - 9 = (x - 3)(x + 3)$.'
    - 'Paso 3: Convertir a producto invirtiendo la segunda fracción: $\frac{(x - 1)(x + 1)}{x + 3} \cdot \frac{(x - 3)(x + 3)}{x - 1}$.'
    - 'Paso 4: Cancelar los factores comunes $(x - 1)$ y $(x + 3)$.'
    - 'Paso 5: Obtener la expresión simplificada: $(x + 1)(x - 3) = x^2 - 2x - 3$ para $x \notin \{-3, 1, 3\}$.'
    - 'Paso 6: Evaluar para $x = 5$: $(5 + 1)(5 - 3) = 6 \cdot 2 = 12$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al resolver $\frac{x^2 - 1}{x + 3} \div \frac{x - 1}{x^2 - 9}$, ¿cuál es la expresión reducida resultante?'
    choices:
      - {text: '$(x + 1)(x - 3)$', is_correct: true}
      - {text: '$(x - 1)(x + 3)$', is_correct: false}
      - {text: '$\frac{x + 1}{x - 3}$', is_correct: false}
      - {text: '$\frac{x - 3}{x + 1}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(x + 1)(x - 3)$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la expresión simplificada $(x + 1)(x - 3)$ para $x = 5$, ¿cuál es el valor numérico obtenido?'
    choices:
      - {text: '$12$', is_correct: true}
      - {text: '$6$', is_correct: false}
      - {text: '$24$', is_correct: false}
      - {text: '$16$', is_correct: false}
    explanation: 'La alternativa correcta es ''$12$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar completamente numeradores y denominadores de ambas fracciones.'
  - 'Paso 2: Invertir la segunda fracción factorizada convirtiendo la división en multiplicación.'
  - 'Paso 3: Cancelar todos los factores idénticos presentes en numeradores y denominadores.'
  - 'Paso 4: Multiplicar los factores restantes para escribir el resultado irreducible final.'
errores_correccion: |
  - **Error 1:** Invertir la segunda fracción sin factorizar previamente y multiplicar polinomios desplegados. **Cómo corregirlo:** Se debe **FACTORIZAR PRIMERO CADA POLINOMIO EN SUS FACTORES PRIMOS ANTES DE INVERTIR Y MULTIPLICAR**.
  - **Error 2:** Desarrollar los productos de los paréntesis factorizados antes de realizar la cancelación. **Cómo corregirlo:** Mantener los polinomios **EN FORMA FACTORIZADA HASTA COMPLETAR TODAS LAS CANCELACIONES**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Al aplicar la factorización previa a $\frac{x^2 - 4}{x} \div \frac{x + 2}{x^2}$, ¿cuál es el resultado simplificado?'
    alternativas:
      - '$x(x - 2)$'
      - '$x(x + 2)$'
      - '$\frac{x - 2}{x}$'
    respuesta: '$x(x - 2)$'
    solucion_pasos:
      - '1. Factorizar $x^2 - 4 = (x-2)(x+2)$.'
      - '2. Invertir divisor: $\frac{(x-2)(x+2)}{x} \cdot \frac{x^2}{x+2}$.'
      - '3. Cancelar $(x+2)$ y $x$: resulta $x(x-2)$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al simplificar $\frac{2x + 6}{5} \div \frac{x + 3}{10}$, ¿cuál es el cociente obtenido?'
    alternativas:
      - '$4$'
      - '$2$'
      - '$\frac{4}{x+3}$'
    respuesta: '$4$'
    solucion_pasos:
      - '1. Factorizar $2x + 6 = 2(x+3)$.'
      - '2. Invertir: $\frac{2(x+3)}{5} \cdot \frac{10}{x+3}$.'
      - '3. Cancelar $(x+3)$ y simplificar $\frac{2 \cdot 10}{5} = 4$.'
  - titulo: 'Inversión de factores'
    enunciado: '¿Al invertir la fracción divisor se invierten también sus factores primos descompuestos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, todo el numerador factorizado pasa al denominador y viceversa.'
  - titulo: 'Cancelación directa'
    enunciado: '¿La factorización previa permite cancelar paréntesis idénticos inmediatamente tras la inversión?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, evita la expansión polinomial de grado alto.'
errores_frecuentes:
  - 'La división $\frac{x^2-4}{x+1} \div \frac{x+2}{x-2}$ exige expandir primero los polinomios como $\frac{x^3+2x^2-4x-8}{x^2-x-2}$ antes de factorizar.'
  - 'Al multiplicar factores primos descompuestos se deben expandir primero los paréntesis antes de simplificar.'
  - 'En el polinomio $3x+9$, la extracción del factor común $3$ no es necesaria al invertir la fracción divisor.'
  - 'En la fracción $\frac{(x+2)(y+3)}{(x+5)(z+3)}$, se puede cancelar el término $+3$ presente dentro de los paréntesis.'
  - 'El conjunto de restricciones de la división no requiere incluir los valores que anulan el numerador del divisor.'
afirmaciones_verdaderas:
  - 'La factorización previa descompone todos los componentes en factores primos facilitando la cancelación tras la inversión.'
  - 'El dominio de la división exige restringir los ceros del primer denominador y de ambos componentes del divisor.'
al_terminar_debes_poder: |
  QUÉ: Resolver divisiones de fracciones algebraicas mediante factorización previa.
  CÓMO: Factorizar previamente numeradores y denominadores para cancelar factores comunes inmediatamente tras invertir la fracción divisor.
