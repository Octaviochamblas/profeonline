procedimiento:
- 'Paso 1: Transforma la división en multiplicación invirtiendo la segunda fracción.'
- 'Paso 2: Factoriza el numerador de la primera fracción.'
- 'Paso 3: Factoriza el denominador de la primera fracción.'
- 'Paso 4: Factoriza los polinomios de la fracción ya invertida.'
- 'Paso 5: Procede a tachar factores comunes.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en factorización previa en división de fracciones algebraicas.
ejemplos:
- titulo: 'Factoriza y prepara: $\frac{x^2-25}{3} \div \frac{x+5}{6}$'
  enunciado: 'Factoriza y prepara: $\frac{x^2-25}{3} \div \frac{x+5}{6}$.'
  solucion_pasos:
  - 'Invertir: $\frac{x^2-25}{3} \cdot \frac{6}{x+5}$.'
  - 'Factorizar: $\frac{(x-5)(x+5)}{3} \cdot \frac{2 \cdot 3}{x+5}$.'
  - Listo para cancelar.
- titulo: Invertida y factorizada, ¿cómo se ve $\frac{x^2+2x}{y} \div \frac{x+2}{y^2}$?
  solucion_pasos:
  - Factorizamos x(x+2) e invertimos la segunda.
- titulo: 'Respecto de «Factorización previa en división de fracciones algebraicas»:
    ¿Describe adecuada'
  enunciado: 'Respecto de «Factorización previa en división de fracciones algebraicas»:
    ¿Describe adecuadamente el concepto esta frase? «En una división, primero aplica
    la regla de voltear (para volverlo multiplicación), y luego factoriza absolutamente
    todos los numeradores y denominadores»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En una división, primero aplica
    la regla de voltear (para volverlo multiplicación), y luego factoriza absolutamente
    todos los numeradores y denominadores.'
- titulo: 'Respecto de «Factorización previa en división de fracciones algebraicas»:
    ¿Se puede aceptar'
  enunciado: 'Respecto de «Factorización previa en división de fracciones algebraicas»:
    ¿Se puede aceptar esta afirmación? «Intentar cancelar cruzado ANTES de voltear
    la segunda fracción (gravísimo error)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En una división, primero aplica
    la regla de voltear (para volverlo multiplicación), y luego factoriza absolutamente
    todos los numeradores y denominadores.'
errores_frecuentes:
- Intentar cancelar cruzado ANTES de voltear la segunda fracción (gravísimo error).
- Olvidar factorizar un polinomio por la prisa de tachar.
- Para «¿Cuál es un error fatal al intentar simplificar una división de fracciones
  algebraicas», la respuesta correcta es Factorizar antes de invertir.
- Invertir la segunda fracción.
- Convertir la división en multiplicación.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando factorización
  previa en división de fracciones algebraicas.
