semantic_id: MAT.ALG.FRACCIONES_DIV.FACTORIZACION_PREVIA
resumen_inicial: Factorizar todos los polinomios antes de invertir y multiplicar simplifica
  la división de fracciones algebraicas.
explicacion_simple: 'Al dividir fracciones algebraicas compuestas por polinomios largos,
  es fundamental factorizar cada numerador y cada denominador desde el primer momento.

  Una vez que todos los polinomios están expresados en paréntesis factorizados, invertimos
  la segunda fracción y realizamos la cancelación inmediata de los factores comunes
  arriba y abajo.'
explicacion_formal: 'Dadas $\frac{P_1(x)}{Q_1(x)} \div \frac{P_2(x)}{Q_2(x)}$, la
  **factorización previa en división** se expresa como:


  $$\frac{A(x) \cdot C(x)}{B(x) \cdot D(x)} \div \frac{A(x) \cdot E(x)}{F(x) \cdot
  D(x)} = \frac{A(x) \cdot C(x)}{B(x) \cdot D(x)} \cdot \frac{F(x) \cdot D(x)}{A(x)
  \cdot E(x)} = \frac{C(x) \cdot F(x)}{B(x) \cdot E(x)}$$


  **Desglose de la fórmula:**

  - $A(x), D(x)$: Factores polinomiales comunes que al ser factorizados previamente
  se identifican y cancelan fácilmente tras la inversión del divisor.'
definiciones_clave: '- **Factorización previa en división**: Descomposición inicial
  de polinomios para simplificar términos inmediatamente al invertir el divisor.

  - **Simplificación anticipada**: Eliminación de factores comunes reduciendo el grado
  del dividendo y divisor resultantes.'
propiedades_relaciones: '- **Optimización operativa**: Evita multiplicar polinomios
  de grado 2 o 3 para formar expresiones complejas de grado 4 o 5.

  - **Registro de restricciones acumuladas**: Se deben excluir los valores que anulen
  $Q_1(x)$, $Q_2(x)$ y $P_2(x)$.'
ejemplo_guiado:
  enunciado: Resuelve la división de fracciones algebraicas $\frac{x^2 - 1}{x + 3}
    \div \frac{x - 1}{x^2 - 9}$ mediante factorización previa, y evalúa el resultado
    para $x = 5$.
  pasos:
  - 'Paso 1: Factorizar el primer numerador $x^2 - 1 = (x - 1)(x + 1)$.Paso 2: Factorizar
    el segundo denominador $x^2 - 9 = (x - 3)(x + 3)$.Paso 3: Convertir a producto
    invirtiendo la segunda fracción: $\frac{(x - 1)(x + 1)}{x + 3} \cdot \frac{(x
    - 3)(x + 3)}{x - 1}$.Paso 4: Cancelar los factores comunes $(x - 1)$ y $(x + 3)$.Paso
    5: Obtener la expresión simplificada: $(x + 1)(x - 3) = x^2 - 2x - 3$ para $x
    \notin \{-3, 1, 3\}$.Paso 6: Evaluar para $x = 5$: $(5 + 1)(5 - 3) = 6 \cdot 2
    = 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $\frac{x^2 - 1}{x + 3} \div \frac{x - 1}{x^2 - 9}$, ¿cuál
    es la expresión reducida resultante?
  choices:
  - text: $(x + 1)(x - 3)$
    is_correct: true
  - text: $(x - 1)(x + 3)$
    is_correct: false
  - text: $\frac{x + 1}{x - 3}$
    is_correct: false
  - text: $\frac{x - 3}{x + 1}$
    is_correct: false
  explanation: La alternativa correcta es '$(x + 1)(x - 3)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la expresión simplificada $(x + 1)(x - 3)$ para $x = 5$, ¿cuál
    es el valor numérico obtenido?
  choices:
  - text: $12$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $24$
    is_correct: false
  - text: $16$
    is_correct: false
  explanation: La alternativa correcta es '$12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente numeradores y denominadores de ambas fracciones.'
- 'Paso 2: Invertir la segunda fracción factorizada convirtiendo la división en multiplicación.'
- 'Paso 3: Cancelar todos los factores idénticos presentes en numeradores y denominadores.'
- 'Paso 4: Multiplicar los factores restantes para escribir el resultado irreducible
  final.'
errores_correccion: '- **Error común:** Invertir la segunda fracción SIN haber factorizado
  antes y multiplicar polinomios largos sin simplificar.

  - **Cómo corregirlo:** Factoriza PRIMERO todas las partes. Trabajar con paréntesis
  factorizados hace que la simplificación tras invertir sea inmediata.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de división.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de división.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se invierte la segunda fracción al dividir?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla estándar.
- titulo: ¿La división de fracciones es conmutativa?
  respuesta: 'No'
  solucion_pasos:
  - No, el orden de las fracciones altera el resultado.
errores_frecuentes:
- Invertir la primera fracción en lugar de la segunda al dividir.
- Cambiar de signo los términos en vez de permutar numerador y denominador.
- Olvidar restringir del dominio los ceros del segundo numerador.
- Multiplicar en cruz las fracciones habiendo invertido previamente el divisor.
- Desarrollar productos de polinomios antes de factorizar.
afirmaciones_verdaderas:
- La división de fracciones algebraicas equivale a multiplicar la primera fracción
  por el inverso de la segunda.
- El dominio de una división de fracciones excluye los ceros del primer denominador,
  segundo denominador y segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver divisiones de fracciones
  algebraicas mediante la inversión del divisor y simplificación del cociente.
