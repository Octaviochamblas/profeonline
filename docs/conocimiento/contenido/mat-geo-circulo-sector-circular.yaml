semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.SECTOR_CIRCULAR_DEFINICION
resumen_inicial: 'Definición de sector circular como región delimitada por dos radios
  y un arco: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: 'Dentro del círculo, es posible identificar regiones parciales
  muy características, delimitadas por elementos ya conocidos: los radios y los arcos.'
explicacion_formal: '![Sector circular: región entre dos radios y un arco](/static/img/geometria/circunferencia-circulo/circulo-sector-circular.svg)


  ### Definición formal


  Dados dos radios $OA$ y $OB$ de una circunferencia de centro $O$, el sector circular
  es la región plana delimitada por esos dos radios y el arco $\overset{\frown}{AB}$
  comprendido entre ellos.


  ### Desarrollo didáctico


  Un sector circular es análogo a una porción de pizza o pastel: dos cortes rectos
  (los radios) desde el centro hasta el borde, y el arco de borde entre esos dos cortes.
  El tamaño del sector depende del ángulo entre los dos radios.'
