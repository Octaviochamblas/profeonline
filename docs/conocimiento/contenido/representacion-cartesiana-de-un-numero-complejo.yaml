resumen_inicial: La representación cartesiana o par ordenado de un número complejo
  $z = a + bi$ asigna a la cantidad las coordenadas $(a, b) \in \mathbb{R}^2$.
explicacion_simple: Cualquier número complejo se puede escribir como un punto o par
  ordenado $(a, b)$ de dos coordenadas, donde el primer número es la parte real y
  el segundo número es la parte imaginaria.
explicacion_formal: 'La **Forma Cartesiana** de $z \in \mathbb{C}$ expresa el número
  como el par ordenado plano:


  $$z = (a, b) \in \mathbb{R} \times \mathbb{R}$$


  **Isomorfismo plano:**

  - Existe una biyección $f(a + bi) = (a, b)$ entre $\mathbb{C}$ y el plano euclidiano
  $\mathbb{R}^2$.'
definiciones_clave: '- **Forma cartesiana**: Par ordenado $(a, b)$ representativo
  de $z = a + bi$.'
propiedades_relaciones: '- **Par ordenado**: Coordenada $(a,b)$ en $\mathbb{R}^2$.'
ejemplo_guiado:
  enunciado: Convierta a forma cartesiana $z_1 = 6 - 2i$ y a forma binomial $z_2 =
    (-3, 7)$.
  pasos:
  - 'Paso 1: Para $z_1 = 6 - 2i$, $a=6$ y $b=-2 \implies z_1 = (6, -2)$.'
  - 'Paso 2: Para $z_2 = (-3, 7)$, $a=-3$ y $b=7 \implies z_2 = -3 + 7i$.'
  - 'Conclusión: $z_1 = (6, -2)$ y $z_2 = -3 + 7i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa el número complejo z = a + bi en forma de par ordenado
    cartesiano?
  choices:
  - text: Como el par ordenado (a, b)
    is_correct: true
  - text: Como el par (a, bi)
    is_correct: false
  - text: Como (a + b, i)
    is_correct: false
  - text: Como (a · b, 0)
    is_correct: false
  explanation: La alternativa correcta es 'Como el par ordenado (a, b)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para z_2 = (-3, 7), ¿cuál fue la forma binomial?
  choices:
  - text: -3 + 7i
    is_correct: true
  - text: 7 - 3i
    is_correct: false
  - text: -3 - 7i
    is_correct: false
  - text: 4i
    is_correct: false
  explanation: La alternativa correcta es '-3 + 7i'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de convertir bidireccionalmente números
  complejos entre su forma binomial $z = a + bi$ y su forma cartesiana $(a, b)$.
semantic_id: MAT.NUM.COMPLEJOS.REPRESENTACION_CARTESIANA
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.REPRESENTACION_CARTESIANA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
estado: publicado
