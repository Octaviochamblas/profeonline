semantic_id: MAT.NUM.COMPLEJOS.REPRESENTACION_CARTESIANA
resumen_inicial: 'La representación cartesiana o par ordenado expresa a todo número complejo como un par de valores reales $z = (a, b)$, donde $a$ es la abscisa real y $b$ es la ordenada imaginaria.'
explicacion_simple: |
  Además de la forma binomial ($3 + 4i$), un número complejo se puede escribir como un punto o par ordenado de coordenadas, tal como en geometría: $z = (3, 4)$. La primera coordenada ($3$) es la parte real y va en el eje horizontal. La segunda coordenada ($4$) es la parte imaginaria y va en el eje vertical. Observa que en la forma cartesiana la letra $i$ no se escribe, porque la posición de la segunda coordenada indica automáticamente que es la parte imaginaria.
explicacion_formal: |
  ### Definición formal
  La **representación cartesiana (o como par ordenado)** de un número complejo $z \in \mathbb{C}$ es el elemento del producto cartesiano $\mathbb{R} \times \mathbb{R}$:
  $$z = (a, b) \quad (a, b \in \mathbb{R})$$
  donde:
  - **$a = \operatorname{Re}(z)$**: Primera componente (coordenada en el eje real horizontal).
  - **$b = \operatorname{Im}(z)$**: Segunda componente (coordenada en el eje imaginario vertical).

  ### Equivalencia de representaciones
  Existe un isomorfismo directo entre la forma binomial y la cartesiana:
  $$\text{Forma Binomial: } a + bi \iff \text{Forma Cartesiana: } (a, b)$$

  ### Operaciones en notación de pares ordenados
  Dada $z_1 = (a, b)$ y $z_2 = (c, d)$:
  1. **Suma**: $z_1 + z_2 = (a + c, b + d)$
  2. **Multiplicación**: $z_1 \cdot z_2 = (ac - bd, ad + bc)$

  ### Síntesis didáctica
  - Ausencia de $i$: La forma cartesiana elimina la escritura explícita de $i$, utilizando la segunda componente del par para indicar la magnitud imaginaria.
definiciones_clave: |
  - **Representación cartesiana $(a, b)$**: Expresión de un complejo como par ordenado de coordenadas en el plano.
  - **Isomorfismo vectorial**: Identidad estructural entre el conjunto $\mathbb{C}$ y el espacio vectorial bidimensional $\mathbb{R}^2$.
  - **Abscisa y Ordenada complejas**: Componentes horizontal real $a$ y vertical imaginaria $b$.
propiedades_relaciones: |
  - **Números reales e imaginarios puros en par ordenado**:
    - Número real puro $a \in \mathbb{R} \iff (a, 0)$.
    - Número imaginario puro $bi \in \mathbb{I} \iff (0, b)$.
  - **Origen del plano**: El número complejo nulo $0 = 0 + 0i$ corresponde al origen de coordenadas $(0, 0)$.
ejemplo_guiado:
  enunciado: 'Convierte el número complejo escrito en forma binomial $z = -6 + 8i$ a su representación cartesiana o par ordenado.'
  pasos:
    - 'Paso 1: Identificamos la parte real del complejo: $a = \operatorname{Re}(z) = -6$.'
    - 'Paso 2: Identificamos la parte imaginaria del complejo aislando su coeficiente escalar: $b = \operatorname{Im}(z) = 8$.'
    - 'Paso 3: Construimos el par ordenado con la estructura $(a, b)$ colocando $a$ en la primera posición y $b$ en la segunda.'
    - 'Paso 4: Escribimos el resultado omitiendo la letra $i$: $z = (-6, 8)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se escribe el número complejo $z = 5 - 2i$ en su representación cartesiana como par ordenado?'
    choices:
      - {text: '$(5, -2)$, omitiendo la letra $i$ en la segunda componente', is_correct: true}
      - {text: '$(5, -2i)$, manteniendo la letra $i$ dentro del paréntesis', is_correct: false}
      - {text: '$(-2, 5)$, invirtiendo el orden de las componentes', is_correct: false}
      - {text: '$(5, 2)$, omitiendo el signo negativo', is_correct: false}
    explanation: 'La alternativa correcta es ''$(5, -2)$, omitiendo la letra $i$ en la segunda componente''. La forma cartesiana exige eliminar la $i$ del par ordenado $(a, b)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma binomial equivalente al par ordenado cartesiano $z = (0, 7)$?'
    choices:
      - {text: '$7i$, por ser un número imaginario puro con parte real nula ($0 + 7i$)', is_correct: true}
      - {text: '$7$, como un número real puro', is_correct: false}
      - {text: '$7 + 0i$, invirtiendo las partes', is_correct: false}
      - {text: '$0.7i$, dividiendo entre 10', is_correct: false}
    explanation: 'La alternativa correcta es ''$7i$, por ser un número imaginario puro con parte real nula ($0 + 7i$)''. La primera componente 0 indica $a=0$ y la segunda 7 indica $b=7$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$ del número complejo.'
  - 'Paso 2: Abrir un paréntesis y anotar la parte real $a$ como la primera componente.'
  - 'Paso 3: Anotar una coma separadora y colocar el escalar $b$ como la segunda componente (sin la $i$).'
  - 'Paso 4: Cerrar el paréntesis obteniendo la notación $(a, b)$.'
errores_correccion: |
  - **Error 1:** Escribir la unidad imaginaria $i$ dentro del par ordenado cartesiano (ej: escribir $z = (3, 4i)$). **Cómo corregirlo:** En la notación cartesiana $(a, b)$, la posición de la segunda componente **ya indica que es imaginaria**, por lo que se prohíbe escribir la letra $i$.
  - **Error 2:** Invertir la posición de la parte real y la parte imaginaria al formar el par (ej: convertir $z = 2 + 5i$ como $(5, 2)$). **Cómo corregirlo:** El orden canónico del par ordenado es siempre **$(\text{Parte Real}, \text{Parte Imaginaria})$**: $(2, 5)$.
ejemplos:
  - titulo: 'Conversión a par ordenado cartesiano'
    enunciado: '¿La forma cartesiana de $z = -3 - 4i$ es el par ordenado $(-3, -4)$?'
    alternativas:
      - 'Sí, pues $a = -3$ y $b = -4$'
      - 'No, es $(-3, -4i)$'
      - 'No, es $(-4, -3)$'
    respuesta: 'Sí, pues $a = -3$ y $b = -4$'
    solucion_pasos:
      - '1. Extraemos $a = -3$ y $b = -4$.'
      - '2. Formamos el par sin la unidad $i$: $(-3, -4)$.'
  - titulo: 'Representación de número real puro'
    enunciado: '¿El número real $z = 9$ se representa en cartesiana como $(9, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a = 9$ y $b = 0 \implies (9, 0)$.'
  - titulo: 'Suma de pares ordenados complejos'
    enunciado: '¿La suma de $(2, 5) + (1, -3)$ es igual al par ordenado $(3, 2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(2+1, 5+(-3)) = (3, 2)$.'
  - titulo: 'Origen de coordenadas'
    enunciado: '¿El número complejo nulo $z = 0 + 0i$ equivale al par ordenado $(0, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Corresponde al origen del plano complejo.'
errores_frecuentes:
  - 'Escribir la letra $i$ dentro de la segunda componente del par ordenado $(a, bi)$.'
  - 'Invertir el orden de las componentes escribiendo en primer lugar la parte imaginaria.'
  - 'La forma cartesiana $(a, b)$ representa un intervalo continuo de números reales entre $a$ y $b$.'
  - 'Al convertir un número real o imaginario puro a cartesiana se omiten las componentes nulas escribiendo sólo un valor.'
  - 'Sumar las dos componentes del par ordenado para convertirlas en un escalar único.'
afirmaciones_verdaderas:
  - 'La representación cartesiana expresa a un número complejo como un par ordenado de números reales $(a, b)$, donde $a = \operatorname{Re}(z)$ y $b = \operatorname{Im}(z)$.'
  - 'En la forma cartesiana $(a, b)$ la unidad imaginaria $i$ se omite explícitamente porque su posición fija en la segunda componente indica su carácter imaginario.'
al_terminar_debes_poder: 'Convertir números complejos entre la forma binomial $a + bi$ y la forma cartesiana $(a, b)$.'
