semantic_id: MAT.NUM.COMPLEJOS.REPRESENTACION_CARTESIANA
resumen_inicial: La representación cartesiana o par ordenado de un número complejo $z = a
  + bi$ es el par ordenado $(a, b) \in \mathbb{R}^2$.
explicacion_simple: 'Todo número complejo se puede escribir como un punto o par ordenado en
  un plano de coordenadas:

  - Forma binomial: $z = 3 - 5i$

  - Forma cartesiana: $z = (3, -5)$

  El primer valor es la parte real y el segundo valor es la parte imaginaria.'
explicacion_formal: Existe un isomorfismo natural entre el cuerpo $\mathbb{C}$ y el espacio
  vectorial $\mathbb{R}^2$ dado por la biyección $a + bi \longleftrightarrow (a, b)$.
definiciones_clave: '- **Par ordenado $(a, b)$**: Representación cartesiana del complejo $z
  = a + bi$.'
propiedades_relaciones: '- **Eje X (Real) y Eje Y (Imaginario)**: El primer componente $a$
  se asocia al eje horizontal y $b$ al eje vertical.'
ejemplo_guiado:
  enunciado: Convierte A) $z_1 = -4 + 2i$ a par ordenado y B) $z_2 = (0, -3)$ a forma binomial.
  pasos:
  - 'Para A: $z_1 = -4 + 2i \implies (-4, 2)$.'
  - 'Para B: $z_2 = (0, -3) \implies 0 - 3i = -3i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el par ordenado cartesiano equivalente a $z = 8 - 3i$?
  choices:
  - text: (8, -3)
    is_correct: true
  - text: (8, -3i)
    is_correct: false
  - text: (-3, 8)
    is_correct: false
  - text: (8, 3)
    is_correct: false
  explanation: 'La correcta es: (8, -3). Par ordenado $(a, b) = (8, -3)$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué forma binomial corresponde el par ordenado $(-5, 0)$?
  choices:
  - text: '-5'
    is_correct: true
  - text: -5i
    is_correct: false
  - text: 5i
    is_correct: false
  - text: (0, -5)
    is_correct: false
  explanation: 'La correcta es: -5. $(-5, 0) \implies -5 + 0i = -5$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$.'
- 'Paso 2: Escribir el par entre paréntesis separado por coma: $(a, b)$.'
errores_correccion: No pongas la letra $i$ dentro del par ordenado. Escribe $(3, 4)$, NUNCA
  $(3, 4i)$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Expresa $z = 1 + 6i$ en forma cartesiana.
  alternativas:
  - (1, 6)
  - (1, 6i)
  - (6, 1)
  respuesta: (1, 6)
  solucion_pasos:
  - $z = (1, 6)$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el par ordenado de z=-7-2i?
  alternativas:
  - (-7,-2)
  - (-2,-7)
  - (-7,-2i)
  respuesta: (-7,-2)
  solucion_pasos:
  - 'La parte real va primero: -7, y la imaginaria segundo: -2.'
- titulo: Ejemplo 3
  enunciado: ¿A qué forma binomial corresponde el par ordenado (0,6)?
  alternativas:
  - 6i
  - '6'
  - 0+6
  respuesta: 6i
  solucion_pasos:
  - Parte real 0 y parte imaginaria 6, entonces z=6i.
- titulo: ¿Es correcto escribir el par ordenado como (3,4i)?
  respuesta: 'No'
  solucion_pasos:
  - Las coordenadas deben ser números reales sin incluir la letra i.
errores_frecuentes:
- Escribir la letra $i$ dentro de las coordenadas del par ordenado.
- Invertir el orden de las coordenadas, colocando la parte imaginaria primero.
- Incluir la letra i dentro de las coordenadas del par ordenado.
- Confundir la representación cartesiana con las coordenadas polares.
- Omitir el 0 al convertir un número imaginario puro o un real a par ordenado.
afirmaciones_verdaderas:
- $a + bi \longleftrightarrow (a, b)$.
- 'El orden de las coordenadas en el par ordenado (a,b) importa: el primer valor siempre corresponde
  a la parte real.'
al_terminar_debes_poder: Convertir entre forma binomial y cartesiana en números complejos.
fuente: Texto escolar MINEDUC.
estado: publicado
