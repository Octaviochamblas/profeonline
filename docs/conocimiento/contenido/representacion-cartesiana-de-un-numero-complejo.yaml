semantic_id: MAT.NUM.COMPLEJOS.REPRESENTACION_CARTESIANA
resumen_inicial: La representación cartesiana de un número complejo es el par ordenado de números reales $z = (a, b)$, donde $a = \operatorname{Re}(z)$ es la abscisa y $b = \operatorname{Im}(z)$ es la ordenada.
explicacion_simple: '![Representación cartesiana de un número complejo](/static/img/nodos/representacion-cartesiana-de-un-numero-complejo-intro.svg)


  Además de la forma binómica ($a + bi$), un número complejo se puede escribir como un **par ordenado de coordenadas**:

  - Se escribe $z = (a, b)$.

  - La **primera coordenada** ($a$) es la parte real $\operatorname{Re}(z)$.

  - La **segunda coordenada** ($b$) es la parte imaginaria $\operatorname{Im}(z)$ (¡sin la letra $i$!).

  - Ejemplo: $z = -3 + 8i \iff z = (-3, 8)$.

  - Para un número real: $5 \iff (5, 0)$. Para un imaginario puro: $-6i \iff (0, -6)$.'
explicacion_formal: 'La **forma cartesiana o de par ordenado** define formalmente a los números complejos como elementos del producto cartesiano $\mathbb{R}^2 = \mathbb{R} \times \mathbb{R}$:


  $$z = (a, b) \quad (a, b \in \mathbb{R})$$


  **Axiomas de Cuerpo en Forma Cartesiana:**

  1. **Suma:** $(a, b) + (c, d) = (a + c, b + d)$

  2. **Producto:** $(a, b) \cdot (c, d) = (ac - bd, ad + bc)$

  3. **Unidad Real:** $(1, 0) = 1$

  4. **Unidad Imaginaria:** $(0, 1) = i$, verificando $(0, 1) \cdot (0, 1) = (0 - 1, 0 + 0) = (-1, 0) = -1$.'
definiciones_clave: '- **Forma cartesiana ($(a, b)$)**: Representación de $z$ como par ordenado en $\mathbb{R}^2$.

  - **Abscisa real ($a$)**: Primera componente del par ordenado.

  - **Ordenada imaginaria ($b$)**: Segunda componente del par ordenado.'
propiedades_relaciones: '- **Equivalencia canónica**: $(a, b) \longleftrightarrow a + bi$.

  - **Definición histórica de Hamilton**: Fundamentación formal de $\mathbb{C}$ como pares ordenados sin recurrir a $\sqrt{-1}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de forma cartesiana](/static/img/nodos/representacion-cartesiana-de-un-numero-complejo-ejemplos.svg)


    Convierta el complejo $z_1 = -3 + 8i$ a par ordenado y el par $z_2 = (0, -6)$ a forma binomial.'
  pasos:
  - 'Paso 1: Para $z_1 = -3 + 8i$: Parte real $a = -3$, parte imaginaria $b = 8 \implies (-3, 8)$.'
  - 'Paso 2: Para $z_2 = (0, -6)$: Parte real $a = 0$, parte imaginaria $b = -6$.'
  - 'Paso 3: Escribir en forma $a + bi$: $0 + (-6)i = -6i$.'
  - 'Conclusión: Las formas correspondientes son $(-3, 8)$ y $-6i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación cartesiana del número complejo $z = 4 - 7i$?
  choices:
  - text: $(4, -7)$
    is_correct: true
  - text: $(4, -7i)$
    is_correct: false
  - text: $(-7, 4)$
    is_correct: false
  - text: $(4, 7)$
    is_correct: false
  explanation: La alternativa correcta es '$(4, -7)$'. En el par ordenado solo se colocan los coeficientes reales.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿a qué forma binomial corresponde el par $(0, -6)$?
  choices:
  - text: $-6i$ (imaginario puro)
    is_correct: true
  - text: $-6$
    is_correct: false
  - text: $6i$
    is_correct: false
  - text: $0 - 6$
    is_correct: false
  explanation: La alternativa correcta es '$-6i$ (imaginario puro)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$ del complejo.'
- 'Paso 2: Escribir el par ordenado $(a, b)$ ubicando a $a$ en la primera posición y a $b$ en la segunda.'
- 'Paso 3: Asegurarse de no colocar la letra $i$ dentro del paréntesis.'
errores_correccion: '- **Error 1: Colocar la letra ''i'' en el par ordenado ($(a, bi)$).** **Cómo corregirlo:** La forma cartesiana utiliza **únicamente números reales**: $(a, b)$.

  - **Error 2: Invertir el orden de las coordenadas ($(b, a)$).** **Cómo corregirlo:** El primer elemento es obligatoriamente la parte real y el segundo la parte imaginaria.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma cartesiana del número complejo $z = -14$?
  alternativas:
  - $(-14, 0)$
  - $(0, -14)$
  - $(-14, -14)$
  respuesta: $(-14, 0)$
  solucion_pasos:
  - $z = -14 + 0i \implies (-14, 0)$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se representa en forma binómica el par ordenado $(5, -1)$?
  alternativas:
  - $5 - i$
  - $5 + i$
  - $-1 + 5i$
  respuesta: $5 - i$
  solucion_pasos:
  - $a = 5, b = -1 \implies 5 + (-1)i = 5 - i$.
- titulo: ¿Es (0, 1) la representación cartesiana de la unidad imaginaria i?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $i = 0 + 1i \implies (0, 1)$.
  alternativas:
  - texto: Sí, i equivale exactamente a (0, 1)
    es_correcta: true
    retroalimentacion: ¡Correcto! Definición de la unidad imaginaria en $\mathbb{R}^2$.
  - texto: No, es (1, 0)
    es_correcta: false
    retroalimentacion: Incorrecto, $(1, 0)$ es el número real 1.
  - texto: No, es (1, 1)
    es_correcta: false
    retroalimentacion: Incorrecto, $(1, 1)$ equivale a $1 + i$.
- titulo: ¿Son equivalentes las operaciones (a, b) + (c, d) y (a + bi) + (c + di)?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambas dan $(a + c, b + d) = (a + c) + (b + d)i$.
  alternativas:
  - texto: Sí, ambas formas son isomorfas y equivalentes
    es_correcta: true
    retroalimentacion: ¡Correcto! Isomorfismo del cuerpo complejo.
  - texto: No, dan resultados distintos
    es_correcta: false
    retroalimentacion: Incorrecto, representan la misma operación matemática.
  - texto: No, solo se puede operar en forma binómica
    es_correcta: false
    retroalimentacion: Incorrecto, la suma cartesiana es estándar.
errores_frecuentes:
- Escribir la letra $i$ dentro del par ordenado.
- Invertir la posición de la parte real con la imaginaria.
- Confundir un número real $(a, 0)$ con un imaginario puro $(0, a)$.
- Olvidar los signos negativos en las coordenadas.
afirmaciones_verdaderas:
- La forma cartesiana expresa a un número complejo como el par ordenado $z = (a, b)$.
- La unidad imaginaria $i$ corresponde al par ordenado $(0, 1)$.
- La forma cartesiana permite vincular la aritmética compleja con la geometría analítica del plano.
al_terminar_debes_poder: '![Síntesis de forma cartesiana](/static/img/nodos/representacion-cartesiana-de-un-numero-complejo-resumen.svg)


  QUÉ: Expresar y convertir números complejos entre su forma cartesiana $(a, b)$ y binomial $a + bi$.


  CÓMO: Asignando la parte real $a = \operatorname{Re}(z)$ a la primera coordenada y la parte imaginaria $b = \operatorname{Im}(z)$ a la segunda coordenada sin incluir la letra $i$.'
