procedimiento:
- 'Paso 1: Identifica los dos ángulos α y β que se están sumando.'
- 'Paso 2: Aplica la fórmula cos(α+β)=cosα·cosβ-sinα·sinβ, sustituyendo los valores
  conocidos.'
- 'Paso 3: Calcula el resultado, prestando especial atención al signo negativo entre
  los términos.'
