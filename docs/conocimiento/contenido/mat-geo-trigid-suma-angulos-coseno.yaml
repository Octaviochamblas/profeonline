semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.SUMA_ANGULOS_COSENO
resumen_inicial: 'Identidad del coseno de una suma de ángulos: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Al igual que el seno, el coseno de una suma de ángulos no es la
  suma de los cosenos; existe una fórmula específica, con un signo negativo entre
  los términos.
explicacion_formal: '![Coseno de una suma de ángulos](/static/img/geometria/trigonometria/trigid-suma-angulos-coseno.svg)


  ### Definición formal


  Para ángulos $\alpha$ y $\beta$ cualesquiera, $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$.


  ### Desarrollo didáctico


  En la figura, α=25° y β=45°, con suma α+β=70°. Se puede verificar que cos70°=cos25°cos45°-sin25°sin45°,
  notando el signo negativo entre los términos (a diferencia del seno de la suma,
  que usa signo positivo).'
definiciones_clave: '- **Identidad del coseno de una suma de ángulos**: Elemento o
  propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identidad del coseno de una suma de ángulos.'
ejemplo_guiado:
  enunciado: Para analizar identidad del coseno de una suma de ángulos, considera
    un ángulo $\alpha = 169^\circ$ ubicado en la posición dada. Determina el valor
    de la medida asociada sabiendo que $x + 1394^\circ = 169^\circ$.
  pasos:
  - Identificar la propiedad de identidad del coseno de una suma de ángulos referida
    a $\alpha = 169^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1394 = 169 \implies x = 169 - 1394$.'
  - Concluir que la medida calculada para identidad del coseno de una suma de ángulos
    es $x = -1225^\circ$.
