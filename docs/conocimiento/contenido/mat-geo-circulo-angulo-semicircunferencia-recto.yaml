procedimiento:
- 'Paso 1: Verifica que el lado opuesto al vértice del ángulo inscrito sea un diámetro
  de la circunferencia.'
- 'Paso 2: Aplica que el arco subtendido por ese diámetro mide 180°.'
- 'Paso 3: Concluye que el ángulo inscrito mide 180°/2 = 90°, sin necesidad de más
  cálculos.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
