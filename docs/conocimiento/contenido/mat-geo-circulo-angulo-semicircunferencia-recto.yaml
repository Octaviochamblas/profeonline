- titulo: ¿Se cumple siempre la propiedad principal de ángulo inscrito en una semicircunferencia
    como ángulo recto en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede ángulo inscrito en una semicircunferencia como ángulo recto asumir
    un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
