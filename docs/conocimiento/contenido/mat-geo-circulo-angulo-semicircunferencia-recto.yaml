ejemplo_guiado:
  enunciado: Para analizar ángulo inscrito en una semicircunferencia como ángulo recto,
    considera un ángulo $\alpha = 147^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1048^\circ = 147^\circ$.
  pasos:
  - Identificar la propiedad de ángulo inscrito en una semicircunferencia como ángulo
    recto referida a $\alpha = 147^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1048 = 147 \implies x = 147 - 1048$.'
  - Concluir que la medida calculada para ángulo inscrito en una semicircunferencia
    como ángulo recto es $x = -901^\circ$.
