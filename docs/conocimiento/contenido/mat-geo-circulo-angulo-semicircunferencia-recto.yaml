semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_SEMICIRCUNFERENCIA_RECTO
resumen_inicial: 'Ángulo inscrito en una semicircunferencia como ángulo recto: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Cuando un ángulo inscrito 'abraza' exactamente media circunferencia
  (un diámetro), siempre mide 90°, sin importar dónde esté ubicado el vértice.
explicacion_formal: '![Ángulo inscrito en semicircunferencia es recto](/static/img/geometria/circunferencia-circulo/circulo-angulo-semicircunferencia-recto.svg)


  ### Definición formal


  Si $AB$ es un diámetro de la circunferencia, el arco $AB$ (por cualquiera de los
  dos lados) mide 180°. Como el ángulo inscrito mide la mitad de su arco subtendido,
  $m(\angle ACB)=\frac{180°}{2}=90°$ para cualquier punto $C$ de la circunferencia
  distinto de $A$ y $B$.


  ### Desarrollo didáctico


  Este resultado, conocido también como el teorema de Tales del ángulo inscrito, es
  un caso particular directo de la relación entre ángulo inscrito y mitad del arco:
  como el diámetro divide la circunferencia en dos arcos de 180° cada uno, el ángulo
  inscrito correspondiente siempre es de 90°, sin importar la posición exacta de $C$
  sobre la semicircunferencia.'
definiciones_clave: '- **Ángulo inscrito en una semicircunferencia como ángulo recto**:
