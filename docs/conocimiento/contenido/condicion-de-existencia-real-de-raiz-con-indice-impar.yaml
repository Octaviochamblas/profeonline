semantic_id: MAT.NUM.RAICES_CONCEPTO.EXISTENCIA_INDICE_IMPAR
resumen_inicial: Una raíz de índice impar $\sqrt[2k+1]{a}$ existe en los números reales
  $\mathbb{R}$ para cualquier radicando $a \in \mathbb{R}$, conservando exactamente
  el mismo signo del radicando.
explicacion_simple: A diferencia de las raíces pares, las raíces de índice impar (como
  la raíz cúbica o quinta) SÍ existen para números negativos. Por ejemplo, la raíz
  cúbica de $-8$ es $-2$, porque $(-2) \cdot (-2) \cdot (-2) = -8$.
explicacion_formal: 'Para todo orden impar $n = 2k+1$ ($k \in \mathbb{N}$), la **Existencia
  Universal de Raíz Impar** garantiza:


  $$\forall a \in \mathbb{R}, \quad \exists! b \in \mathbb{R} \text{ tal que } \sqrt[2k+1]{a}
  = b$$


  **Propiedad del signo impar:**

  $$\sqrt[2k+1]{-a} = - \sqrt[2k+1]{a} \quad (a > 0)$$'
definiciones_clave: '- **Existencia universal de índice impar**: Propiedad donde $\sqrt[2k+1]{a}$
  está definida en $\mathbb{R}$ para todo radicando $a$ conservando su signo.'
propiedades_relaciones: '- **Conservación de signo**: $\sqrt[2k+1]{-a} = -\sqrt[2k+1]{a}$.'
ejemplo_guiado:
  enunciado: Calcule el valor de las raíces cúbicas $\sqrt[3]{27}$ y $\sqrt[3]{-27}$.
  pasos:
  - 'Paso 1: Para $\sqrt[3]{27}$, buscar $b$ tal que $b^3 = 27 \implies 3^3 = 27 \implies
    \sqrt[3]{27} = 3$.'
  - 'Paso 2: Para $\sqrt[3]{-27}$, buscar $b$ tal que $b^3 = -27 \implies (-3)^3 =
    -27 \implies \sqrt[3]{-27} = -3$.'
  - 'Conclusión: Ambas existen en $\mathbb{R}$; $\sqrt[3]{27} = 3$ y $\sqrt[3]{-27}
    = -3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Para qué valores del radicando a está definida en los reales una raíz
    con índice impar (como la raíz cúbica)?
  choices:
  - text: Para todo número real a (positivos, cero y negativos)
    is_correct: true
  - text: Solo para números mayores a cero
    is_correct: false
  - text: Solo para el número cero
    is_correct: false
  - text: No está definida nunca
    is_correct: false
  explanation: La alternativa correcta es 'Para todo número real a (positivos, cero
    y negativos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt[3]{-27}, ¿cuál fue el resultado?
  choices:
  - text: '-3'
    is_correct: true
  - text: '+3'
    is_correct: false
  - text: No existe en los reales
    is_correct: false
  - text: '-9'
    is_correct: false
  explanation: La alternativa correcta es '-3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el índice de la raíz sea un número entero impar ($3, 5, 7,
  \dots$).'
- 'Paso 2: Conservar el signo del radicando $a$ en el resultado.'
- 'Paso 3: Encontrar la base real $b$ tal que $b^n = a$.'
errores_correccion: '- **Error 1: Creer que $\sqrt[3]{-8}$ no existe en los reales.**
  **Cómo corregirlo:** Las raíces IMPARES sí aceptan radicandos negativos en $\mathbb{R}$
  ($\sqrt[3]{-8} = -2$).


  - **Error 2: Cambiar el signo del resultado a positivo en una raíz impar negativa.**
  **Cómo corregirlo:** La raíz de índice impar CONSERVA el signo negativo del radicando.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\sqrt[3]{-64}$.
  alternativas:
  - '-4'
  - '4'
  - No existe
  respuesta: '-4'
  solucion_pasos:
  - $(-4)^3 = -64 \implies \sqrt[3]{-64} = -4$.
- titulo: Ejemplo 2
  enunciado: Calcule $\sqrt[5]{-1}$.
  alternativas:
  - '-1'
  - '1'
  - '5'
  respuesta: '-1'
  solucion_pasos:
  - $(-1)^5 = -1 \implies \sqrt[5]{-1} = -1$.
- titulo: ¿Existe la raíz cúbica de cualquier número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio de existencia de las raíces impares es todo $\mathbb{R}$.
- titulo: ¿Es sqrt[3]{-125} igual a -5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-5)^3 = -125$.
errores_frecuentes:
- Las raíces de índice impar de números negativos no están definidas en el conjunto
  real.
- La raíz cúbica de un número negativo entrega un resultado positivo por la ley de
  signos.
- La expresión $\sqrt[3]{-1}$ es una indeterminación matemática idéntica a $0/0$.
- Restringir el radicando a valores no negativos en raíces con índice 3, 5 y 7.
- Elevar una raíz de índice impar al cubo convierte el resultado en un número complejo.
afirmaciones_verdaderas:
- Toda raíz de índice impar $\sqrt[2k+1]{a}$ está definida para cualquier radicando
  real $a \in \mathbb{R}$.
- 'Las raíces de índice impar conservan el signo del radicando: $\sqrt[2k+1]{-a} =
  -\sqrt[2k+1]{a}$.'
al_terminar_debes_poder: Al terminar serás capaz de evaluar raíces de índice impar
  para cualquier radicando real $a \in \mathbb{R}$, conservando adecuadamente el signo
  del radicando.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
