semantic_id: MAT.NUM.RAICES_CONCEPTO.EXISTENCIA_INDICE_IMPAR
resumen_inicial: Una raíz de índice impar (como la raíz cúbica $\sqrt[3]{}$ o quinta
  $\sqrt[5]{}$) existe SIEMPRE en los números reales para todo radicando real, positivo,
  negativo o cero.
explicacion_simple: 'Como un número negativo elevado a un exponente impar da resultado
  negativo (ej: $(-2)^3 = -8$), las raíces de índice impar de números negativos **SÍ
  existen en $\mathbb{R}$** y conservan su signo negativo:

  - $\sqrt[3]{27} = 3$ (porque $3^3 = 27$)

  - $\sqrt[3]{-27} = -3$ (porque $(-3)^3 = -27$)'
explicacion_formal: Sea $n = 2k+1$ con $k \in \mathbb{N}_0$ (índice impar). La función
  $f(x) = x^{2k+1}$ es una biyección de $\mathbb{R}$ en $\mathbb{R}$. Por lo tanto,
  para todo $a \in \mathbb{R}$, $\sqrt[2k+1]{a}$ existe de forma única en $\mathbb{R}$,
  cumpliendo $\sqrt[2k+1]{-a} = -\sqrt[2k+1]{a}$.
definiciones_clave: '- **Dominio sin restricción**: $\text{Dom}(\sqrt[2k+1]{x}) =
  \mathbb{R}$.'
propiedades_relaciones: '- **Imparidad**: $\sqrt[n]{-a} = -\sqrt[n]{a}$ para $n$ impar.'
ejemplo_guiado:
  enunciado: Calcula A) $\sqrt[3]{64}$ y B) $\sqrt[3]{-64}$.
  pasos:
  - 'Para A: $\sqrt[3]{64} = 4$ porque $4^3 = 64$.'
  - 'Para B: $\sqrt[3]{-64} = -4$ porque $(-4)^3 = -64$.'
  - Concluir que ambas raíces existen en $\mathbb{R}$ y conservan el signo de su radicando.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\sqrt[3]{-125}$ en los números reales?
  choices:
  - text: '-5'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: No existe en R
    is_correct: false
  - text: '-25'
    is_correct: false
  explanation: 'La correcta es: -5. Al ser el índice impar (3), la raíz existe en
    $\mathbb{R}$ y es negativa: $(-5)^3 = -125$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $\sqrt[5]{-1}$?
  choices:
  - text: '-1'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: No existe en R
    is_correct: false
  - text: '-5'
    is_correct: false
  explanation: 'La correcta es: -1. $(-1)^5 = -1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar que el índice $n$ sea impar ($3, 5, 7, \dots$).'
- 'Paso 2: Extraer la raíz del valor absoluto del radicando.'
- 'Paso 3: Asignar al resultado el mismo signo que tenía el radicando original.'
errores_correccion: No digas que $\sqrt[3]{-8}$ no existe en los reales por ser negativa.
  La restricción de no tener solución real **aplica solo a índices pares**, no a los
  impares.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\sqrt[5]{-32}$.
  alternativas:
  - '-2'
  - '2'
  - No existe
  respuesta: '-2'
  solucion_pasos:
  - $(-2)^5 = -32 \implies \sqrt[5]{-32} = -2$.
errores_frecuentes:
- Confundir restricciones de índice par con raíces de índice impar.
afirmaciones_verdaderas:
- Las raíces de índice impar están definidas para todo número real.
al_terminar_debes_ponder: Calcular raíces de índice impar para radicandos positivos
  y negativos.
fuente: Texto escolar MINEDUC.
estado: publicado
