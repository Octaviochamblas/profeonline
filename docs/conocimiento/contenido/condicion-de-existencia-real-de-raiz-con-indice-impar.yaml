semantic_id: MAT.NUM.RAICES_CONCEPTO.EXISTENCIA_INDICE_IMPAR
resumen_inicial: 'Una raíz con índice impar existe siempre en el conjunto de los números reales para cualquier valor del radicando: $\sqrt[2k+1]{a} \in \mathbb{R}$ para todo $a \in \mathbb{R}$.'
explicacion_simple: '![Existencia con índice impar en ℝ](/static/img/nodos/condicion-de-existencia-real-de-raiz-con-indice-impar-intro.svg)


  A diferencia de las raíces pares, las raíces con **índice impar** (cúbicas $\sqrt[3]{\cdot}$, quintas $\sqrt[5]{\cdot}$, etc.) no tienen ninguna restricción: **¡existen para todos los números reales!**

  - Si el radicando es positivo, la raíz es positiva: $\sqrt[3]{+8} = +2$.

  - Si el radicando es negativo, la raíz es negativa: $\sqrt[3]{-8} = -2$ (porque $(-2)^3 = -8$).

  - Si el radicando es cero, la raíz es cero: $\sqrt[3]{0} = 0$.'
explicacion_formal: 'Sean $a \in \mathbb{R}$ y $n = 2k+1$ con $k \in \mathbb{N}$ un número natural impar ($n \in \{3, 5, 7, 9, \dots\}$). El **Teorema de Existencia Universal** establece:


  $$\sqrt[2k+1]{a} \in \mathbb{R} \quad (\forall a \in \mathbb{R})$$


  **Demostración analítica:**

  La función potencia $f(x) = x^{2k+1}$ es estrictamente creciente, continua y biyectiva de $\mathbb{R}$ en $\mathbb{R}$:

  - $\lim_{x \to -\infty} x^{2k+1} = -\infty$ y $\lim_{x \to +\infty} x^{2k+1} = +\infty$.

  - Por el Teorema del Valor Intermedio y la inyectividad, para todo $a \in \mathbb{R}$ existe un **único** $b \in \mathbb{R}$ tal que $b^{2k+1} = a$.


  > **Propiedad de Factorización del Signo:**

  > $$\sqrt[2k+1]{-a} = -\sqrt[2k+1]{a} \quad (\forall a \in \mathbb{R})$$'
definiciones_clave: '- **Dominio irrestricto**: Conjunto $\mathbb{R} = (-\infty, +\infty)$ sin restricciones algebraicas.

  - **Biyección de potencia impar**: Propiedad de tener solución única para todo valor real.

  - **Imparidad funcional**: $\sqrt[n]{-x} = -\sqrt[n]{x}$ para $n$ impar.'
propiedades_relaciones: '- **Preservación estricta de signo**: $\operatorname{sgn}(\sqrt[2k+1]{a}) = \operatorname{sgn}(a)$.

  - **Extracción de negativos**: El signo menos puede salir libremente del radical impar.'
ejemplo_guiado:
  enunciado: '![Ejemplos de existencia con índice impar](/static/img/nodos/condicion-de-existencia-real-de-raiz-con-indice-impar-ejemplos.svg)


    Calcule los valores de $\sqrt[3]{-64}$, $\sqrt[5]{-\frac{1}{32}}$ y $\sqrt[7]{-1}$ en los números reales.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt[3]{-64}$: Índice $3$ impar. Como $(-4)^3 = -64$, entonces $\sqrt[3]{-64} = -4 \in \mathbb{R}$.'
  - 'Paso 2: Evaluar $\sqrt[5]{-\frac{1}{32}}$: Índice $5$ impar. Como $\left(-\frac{1}{2}\right)^5 = -\frac{1}{32}$, entonces $\sqrt[5]{-\frac{1}{32}} = -\frac{1}{2} \in \mathbb{R}$.'
  - 'Paso 3: Evaluar $\sqrt[7]{-1}$: Índice $7$ impar. Como $(-1)^7 = -1$, entonces $\sqrt[7]{-1} = -1 \in \mathbb{R}$.'
  - 'Conclusión: Los resultados son $-4$, $-\frac{1}{2}$ y $-1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = \sqrt[3]{x - 8}$ en los números reales?
  choices:
  - text: Todos los números reales $\mathbb{R}$ (porque el índice $3$ es impar y no impone restricciones)
    is_correct: true
  - text: $x \ge 8$
    is_correct: false
  - text: $x \le 8$
    is_correct: false
  - text: $x > 0$
    is_correct: false
  explanation: La alternativa correcta es 'Todos los números reales $\mathbb{R}$ (porque el índice $3$ es impar y no impone restricciones)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\sqrt[5]{-\frac{1}{32}} = -\frac{1}{2}$?
  choices:
  - text: Porque $\left(-\frac{1}{2}\right)^5 = -\frac{1}{32}$ y el índice impar conserva el signo negativo
    is_correct: true
  - text: Porque el exponente negativo invierte la fracción
    is_correct: false
  - text: Porque se divide por $5$
    is_correct: false
  - text: Porque no existe en $\mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $\left(-\frac{1}{2}\right)^5 = -\frac{1}{32}$ y el índice impar conserva el signo negativo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el índice $n$ sea un número impar ($3, 5, 7, \dots$).'
- 'Paso 2: Reconocer que el radicando puede ser cualquier número real ($a \in \mathbb{R}$).'
- 'Paso 3: Calcular la raíz conservando el mismo signo del radicando.'
errores_correccion: '- **Error 1: Creer que $\sqrt[3]{-8}$ no tiene solución en $\mathbb{R}$.** **Cómo corregirlo:** Las raíces de índice IMPAR de negativos sí existen en $\mathbb{R}$ y son negativas ($\sqrt[3]{-8} = -2$).

  - **Error 2: Quitar el signo menos al resultado de una raíz impar de un negativo.** **Cómo corregirlo:** $\sqrt[3]{-27} = -3$, nunca $+3$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\sqrt[3]{-125}$?
  alternativas:
  - $-5$
  - $5$
  - No existe en $\mathbb{R}$
  respuesta: $-5$
  solucion_pasos:
  - $(-5)^3 = -125 \implies \sqrt[3]{-125} = -5$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el dominio en $\mathbb{R}$ de $\sqrt[5]{2x - 10}$?
  alternativas:
  - Todo $\mathbb{R}$
  - $x \ge 5$
  - $x > 0$
  respuesta: Todo $\mathbb{R}$
  solucion_pasos:
  - Índice 5 impar $\implies$ dominio $(-\infty, +\infty)$.
- titulo: ¿Existe ∛(-27) en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt[3]{-27} = -3 \in \mathbb{R}$.
  alternativas:
  - texto: Sí, es igual a -3
    es_correcta: true
    retroalimentacion: ¡Correcto! $(-3)^3 = -27$.
  - texto: No, los números negativos no tienen raíces
    es_correcta: false
    retroalimentacion: Incorrecto, solo en índice par no tienen raíz real.
  - texto: No, es un número imaginario
    es_correcta: false
    retroalimentacion: Incorrecto, pertenece enteramente a ℝ.
- titulo: ¿Es ∛(-x) igual a -∛x para todo x real?
  respuesta: Sí
  solucion_pasos:
  - Sí, por imparidad funcional $\sqrt[3]{-x} = -\sqrt[3]{x}$.
  alternativas:
  - texto: Sí, el signo negativo se puede factorizar en raíces de índice impar
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad exclusiva de índices impares.
  - texto: No, el signo menos no puede salir de la raíz
    es_correcta: false
    retroalimentacion: Incorrecto, en impares siempre se puede extraer.
  - texto: No, solo si x es entero
    es_correcta: false
    retroalimentacion: Incorrecto, es válido para todo número real.
errores_frecuentes:
- Creer que todas las raíces con radicando negativo son imaginarias.
- Cambiar a positivo el resultado de una raíz impar con radicando negativo.
- Restringir el dominio de funciones con raíces de índice impar.
- Confundir las reglas de signos entre índices pares e impares.
- Olvidar que $\sqrt[3]{0} = 0$.
afirmaciones_verdaderas:
- Las raíces con índice impar están definidas para la totalidad de los números reales.
- El resultado de una raíz impar tiene exactamente el mismo signo que su radicando.
- El signo menos se puede factorizar fuera del radical en cualquier índice impar.
al_terminar_debes_poder: '![Síntesis de existencia con índice impar](/static/img/nodos/condicion-de-existencia-real-de-raiz-con-indice-impar-resumen.svg)


  QUÉ: Comprender y calcular raíces con índice impar en los números reales sin restricciones de signo.


  CÓMO: Reconociendo el dominio universal $\mathbb{R}$, conservando el signo del radicando en el resultado y aplicando la propiedad $\sqrt[2k+1]{-a} = -\sqrt[2k+1]{a}$.'
