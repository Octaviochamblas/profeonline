semantic_id: MAT.NUM.NOTACION_CIENTIFICA.DIVISION
resumen_inicial: 'Para dividir números en notación científica $\frac{a \cdot 10^m}{b
  \cdot 10^n}$, se dividen los coeficientes $\left(\frac{a}{b}\right)$ y se restan
  los exponentes de las potencias de diez: $\left(\frac{a}{b}\right) \cdot 10^{m-n}$
  ($b \neq 0$).'
explicacion_simple: Para dividir en notación científica, dividimos de forma independiente
  los números decimales de la izquierda y restamos los exponentes de las potencias
  de diez (el de arriba menos el de abajo).
explicacion_formal: 'Dados $x = a \cdot 10^m$ y $y = b \cdot 10^n$ ($b \neq 0$), el
  **Cociente en Notación Científica** satisface:


  $$\frac{x}{y} = \left(\frac{a}{b}\right) \cdot 10^{m-n}$$


  **Desglose del reajuste:**

  - Si el cociente de coeficientes $\frac{a}{b} < 1$, se reescribe ajustando la coma
  a la derecha y restando 1 al exponente.


  > **Complemento didáctico:** Ejemplo: $\frac{2 \cdot 10^7}{8 \cdot 10^3} = 0,25
  \cdot 10^4 = 2,5 \cdot 10^3$.'
definiciones_clave: '- **División en notación científica**: Operación $\left(\frac{a}{b}\right)
  \cdot 10^{m-n}$ ajustando la mantisa al intervalo $[1, 10)$.'
propiedades_relaciones: '- **Agrupación de cociente**: Divide coeficientes y resta
  exponentes.'
ejemplo_guiado:
  enunciado: Divida $\frac{2 \cdot 10^8}{5 \cdot 10^3}$ y exprese el resultado en
    notación científica estándar.
  pasos:
  - 'Paso 1: Dividir los coeficientes: $2 : 5 = 0,4$.'
  - 'Paso 2: Restar los exponentes de diez: $10^{8-3} = 10^5$. Expresión intermedia:
    $0,4 \cdot 10^5$.'
  - 'Paso 3: Reajustar la mantisa $0,4 < 1$ moviendo la coma $1$ lugar a la derecha
    ($4 \cdot 10^{-1}$): $(4 \cdot 10^{-1}) \cdot 10^5 = 4 \cdot 10^4$.'
  - 'Conclusión: El cociente es $4 \cdot 10^4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué se hace con las potencias de diez al dividir números en notación
    científica?
  choices:
  - text: Se conservan las bases de diez y se restan sus exponentes (10^{m-n})
    is_correct: true
  - text: Se dividen los exponentes
    is_correct: false
  - text: Se multiplican los exponentes
    is_correct: false
  - text: Se eliminan las potencias de diez
    is_correct: false
  explanation: La alternativa correcta es 'Se conservan las bases de diez y se restan
    sus exponentes (10^{m-n})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (2 · 10^8) / (5 · 10^3), ¿cuál fue el resultado
    estándar final?
  choices:
  - text: 4 · 10^4
    is_correct: true
  - text: 0,4 · 10^5
    is_correct: false
  - text: 4 · 10^5
    is_correct: false
  - text: 0,4 · 10^4
    is_correct: false
  explanation: La alternativa correcta es '4 · 10^4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el coeficiente del numerador entre el del denominador ($a / b$).'
- 'Paso 2: Restar el exponente del denominador al del numerador ($m - n$).'
- 'Paso 3: Reajustar la mantisa si resulta $< 1$ o $\ge 10$ modificando el exponente.'
errores_correccion: '- **Error 1: Dejar la mantisa menor a 1 ($0,4 \cdot 10^5$).**
  **Cómo corregirlo:** Correr la coma a la derecha a $4$ y restar 1 al exponente ($4
  \cdot 10^4$).


  - **Error 2: Sumar exponentes en lugar de restarlos al dividir.** **Cómo corregirlo:**
  En la división los exponentes se RESTAN (numerador menos denominador).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\frac{8 \cdot 10^6}{2 \cdot 10^2}$.
  alternativas:
  - 4 · 10^4
  - 4 · 10^8
  - 4 · 10^3
  respuesta: 4 · 10^4
  solucion_pasos:
  - $(8/2) \cdot 10^{6-2} = 4 \cdot 10^4$.
- titulo: Ejemplo 2
  enunciado: Calcule $\frac{1,5 \cdot 10^3}{3 \cdot 10^5}$.
  alternativas:
  - 5 · 10^{-3}
  - 0,5 · 10^{-2}
  - 5 · 10^{-2}
  respuesta: 5 · 10^{-3}
  solucion_pasos:
  - $(1,5/3) \cdot 10^{3-5} = 0,5 \cdot 10^{-2} = 5 \cdot 10^{-3}$.
- titulo: ¿Es (9 · 10^4) / (3 · 10^4) igual a 3 · 10^0 (o 3)?
  respuesta: Sí
  solucion_pasos:
  - Sí, $9/3 = 3$ y $4-4 = 0 \implies 3 \cdot 10^0 = 3$.
- titulo: ¿Requiere un coeficiente de 0,2 mover la coma a la derecha y restar 1 al
    exponente?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0,2 \cdot 10^n = 2 \cdot 10^{n-1}$.
errores_frecuentes:
- Dejar el coeficiente menor a 1 al resolver la división sin reajustar el exponente
  de diez.
- Sumar los exponentes de las potencias de diez al calcular una división en notación
  científica.
- Dividir las potencias de diez mediante la división directa de sus exponentes.
- La división $\frac{6 \cdot 10^4}{2 \cdot 10^2}$ es igual a $3 \cdot 10^2$ sin modificar
  exponentes.
- Aplicar la regla del cociente cuando el divisor es igual a cero.
afirmaciones_verdaderas:
- 'Al dividir en notación científica se dividen los coeficientes y se restan los exponentes
  de diez: $(a/b) \cdot 10^{m-n}$ ($b \neq 0$).'
- Si la mantisa resultante es $< 1$, se mueve la coma 1 posición a la derecha y se
  resta $1$ al exponente.
al_terminar_debes_poder: Al terminar serás capaz de dividir números en notación científica,
  dividiendo coeficientes, restando exponentes y reajustando la mantisa al rango $1
  \le |k| < 10$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
