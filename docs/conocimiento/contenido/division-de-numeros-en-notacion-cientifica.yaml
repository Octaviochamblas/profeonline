semantic_id: MAT.NUM.NOTACION_CIENTIFICA.DIVISION
resumen_inicial: 'Para dividir números en notación científica, se dividen las mantisas entre sí y se restan los exponentes de las potencias de diez: $\frac{a \cdot 10^m}{b \cdot 10^n} = \left(\frac{a}{b}\right) \cdot 10^{m-n}$, normalizando si el cociente es menor a 1.'
explicacion_simple: '![División en notación científica](/static/img/nodos/division-de-numeros-en-notacion-cientifica-intro.svg)


  Dividir números en notación científica es muy directo:

  1. **Divides los números de adelante** (las mantisas $a : b$).

  2. **Restas los exponentes de diez** ($10^{m-n}$) aplicando la ley de cociente de potencias de igual base.

  3. **Paso final de normalización:** Si el cociente de las mantisas te da menor a $1$ (por ejemplo $0,4$), mueves la coma un lugar a la derecha y restas $1$ al exponente: $0,4 \cdot 10^3 = 4 \cdot 10^2$.'
explicacion_formal: "Sean $x = a \\cdot 10^m$ e $y = b \\cdot 10^n$ dos números en notación científica con $b \\neq 0$ ($1 \\le a, b < 10$ y $m, n \\in \\mathbb{Z}$). El **Cociente en Notación Científica** se define formalmente como:\n\n$$\\frac{x}{y} = \\left(\\frac{a}{b}\\right) \\cdot 10^{m-n}$$\n\n**Fase de Renormalización:**\nComo $1 \\le a < 10$ y $1 \\le b < 10$, el cociente $\\frac{a}{b}$ satisface $0,1 < \\frac{a}{b} < 10$:\n- **Si $1 \\le \\frac{a}{b} < 10$:** La expresión ya está en forma normalizada.\n- **Si $0,1 < \\frac{a}{b} < 1$:** Se define $k = \\left(\\frac{a}{b}\\right) \\cdot 10 \\in [1, 10)$ y se decrementa el exponente:\n  $$\\frac{x}{y} = k \\cdot 10^{(m-n)-1}$$"
definiciones_clave: '- **Cociente de mantisas ($a/b$)**: División directa del dividendo por el divisor.

  - **Renormalización descendente**: Ajuste $k = (a/b) \cdot 10$ con exponente $(m-n-1)$ cuando el cociente es $< 1$.'
propiedades_relaciones: '- **Resta de negativos en el divisor**: $\frac{10^m}{10^{-k}} = 10^{m - (-k)} = 10^{m+k}$.

  - **División por cero excluida**: Requiere obligatoriamente $b \neq 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de división en notación científica](/static/img/nodos/division-de-numeros-en-notacion-cientifica-ejemplos.svg)


    Calcule el cociente de las expresiones $\frac{9 \cdot 10^8}{3 \cdot 10^3}$, $\frac{1,2 \cdot 10^4}{4 \cdot 10^{-2}}$ y $\frac{3,5 \cdot 10^{-5}}{7 \cdot 10^2}$ en notación científica normalizada.'
  pasos:
  - 'Paso 1: Evaluar $\frac{9 \cdot 10^8}{3 \cdot 10^3}$: Dividir mantisas $9 : 3 = 3$. Restar exponentes: $8 - 3 = 5$. Resultado: $3 \cdot 10^5$ (normalizado).'
  - 'Paso 2: Evaluar $\frac{1,2 \cdot 10^4}{4 \cdot 10^{-2}}$: Dividir mantisas $1,2 : 4 = 0,3$. Restar exponentes: $4 - (-2) = 6$. Queda $0,3 \cdot 10^6$. Normalizar: $0,3 = 3 \cdot 10^{-1} \implies 3 \cdot 10^5$.'
  - 'Paso 3: Evaluar $\frac{3,5 \cdot 10^{-5}}{7 \cdot 10^2}$: Dividir mantisas $3,5 : 7 = 0,5$. Restar exponentes: $-5 - 2 = -7$. Queda $0,5 \cdot 10^{-7}$. Normalizar: $0,5 = 5 \cdot 10^{-1} \implies 5 \cdot 10^{-8}$.'
  - 'Conclusión: Los resultados son $3 \cdot 10^5$, $3 \cdot 10^5$ y $5 \cdot 10^{-8}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado normalizado de $\frac{2 \cdot 10^7}{5 \cdot 10^3}$?
  choices:
  - text: '$4 \cdot 10^3$ (porque $2 : 5 = 0,4 = 4 \cdot 10^{-1}$ y $7 - 3 - 1 = 3$)'
    is_correct: true
  - text: $0,4 \cdot 10^4$
    is_correct: false
  - text: $4 \cdot 10^4$
    is_correct: false
  - text: $0,4 \cdot 10^{10}$
    is_correct: false
  explanation: 'La alternativa correcta es ''$4 \cdot 10^3$ (porque $2 : 5 = 0,4 = 4 \cdot 10^{-1}$ y $7 - 3 - 1 = 3$)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\frac{1,2 \cdot 10^4}{4 \cdot 10^{-2}}$ dio como exponente previo $6$?
  choices:
  - text: 'Porque al restar un exponente negativo se convierte en suma: $4 - (-2) = 4 + 2 = 6$'
    is_correct: true
  - text: Porque $4 - 2 = 2$
    is_correct: false
  - text: Porque se multiplicaron los exponentes
    is_correct: false
  - text: Porque $1,2$ es decimal
    is_correct: false
  explanation: 'La alternativa correcta es ''Porque al restar un exponente negativo se convierte en suma: $4 - (-2) = 4 + 2 = 6$''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir la mantisa del numerador por la del denominador: $a / b$.'
- 'Paso 2: Restar los exponentes de diez: $(\text{exp. numerador}) - (\text{exp. denominador})$.'
- 'Paso 3: Si el cociente $a / b < 1$, desplazar la coma un lugar a la derecha y restar $1$ al exponente final.'
errores_correccion: '- **Error 1: Dejar el cociente menor a 1 sin normalizar ($0,2 \cdot 10^5$).** **Cómo corregirlo:** La mantisa debe ser $\ge 1$. Reescribir $2 \cdot 10^4$.

  - **Error 2: Error de signos al restar exponentes negativos en el divisor.** **Cómo corregirlo:** Recordar $m - (-n) = m + n$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\frac{8 \cdot 10^6}{2 \cdot 10^2}$?
  alternativas:
  - $4 \cdot 10^4$
  - $4 \cdot 10^3$
  - $4 \cdot 10^8$
  respuesta: $4 \cdot 10^4$
  solucion_pasos:
  - '$(8 : 2) \cdot 10^{6-2} = 4 \cdot 10^4$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado normalizado de $\frac{1 \cdot 10^5}{4 \cdot 10^2}$?
  alternativas:
  - $2,5 \cdot 10^2$
  - $0,25 \cdot 10^3$
  - $2,5 \cdot 10^3$
  respuesta: $2,5 \cdot 10^2$
  solucion_pasos:
  - '$1 : 4 = 0,25 \implies 0,25 \cdot 10^3 = 2,5 \cdot 10^2$.'
- titulo: ¿Es (6 · 10⁴) / (3 · 10⁻²) igual a 2 · 10⁶?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $6 : 3 = 2$ y $4 - (-2) = 6 \implies 2 \cdot 10^6$.'
  alternativas:
  - texto: Sí, 4 - (-2) = 6 dando 2 · 10⁶
    es_correcta: true
    retroalimentacion: ¡Correcto! Restar un exponente negativo suma.
  - texto: No, es igual a 2 · 10²
    es_correcta: false
    retroalimentacion: Incorrecto, olvidaste el cambio de signo de la resta.
  - texto: No, es igual a 2 · 10⁻²
    es_correcta: false
    retroalimentacion: Incorrecto, $4 - (-2) = 6$.
- titulo: ¿Es (4 · 10⁵) / (8 · 10²) igual a 5 · 10²?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $4 : 8 = 0,5$ y $5 - 2 = 3 \implies 0,5 \cdot 10^3 = 5 \cdot 10^2$.'
  alternativas:
  - texto: Sí, 0,5 · 10³ normalizado es 5 · 10²
    es_correcta: true
    retroalimentacion: ¡Correcto! $0,5 \cdot 10^3 = 5 \cdot 10^2$.
  - texto: No, es igual a 0,5 · 10³
    es_correcta: false
    retroalimentacion: Incorrecto, $0,5$ no está normalizado.
  - texto: No, es igual a 2 · 10³
    es_correcta: false
    retroalimentacion: Incorrecto, $4/8 = 0,5$ y no $2$.
errores_frecuentes:
- Dividir los exponentes en lugar de restarlos.
- Olvidar renormalizar cuando la división de mantisas resulta menor que 1.
- Sumar 1 en lugar de restar 1 al exponente tras mover la coma a la derecha.
- Cometer errores de doble signo al restar exponentes negativos.
- Invertir el orden de la división (dividir denominador por numerador).
afirmaciones_verdaderas:
- Para dividir números en notación científica se dividen las mantisas y se restan los exponentes.
- Si la división de mantisas es menor a 1, se resta 1 al exponente final tras desplazar la coma.
- La división por potencias con exponente negativo se traduce en una suma de exponentes.
al_terminar_debes_poder: '![Síntesis de división](/static/img/nodos/division-de-numeros-en-notacion-cientifica-resumen.svg)


  QUÉ: Dividir números expresados en notación científica.


  CÓMO: Dividiendo las mantisas $(a / b)$, restando algebraicamente los exponentes de diez $(m - n)$ y renormalizando el resultado si el cociente resulta ser menor que uno ($a / b < 1$).'
