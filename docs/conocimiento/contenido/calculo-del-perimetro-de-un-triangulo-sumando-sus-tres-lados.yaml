semantic_id: MAT.GEO.TRIANGULOS_METRICA.PERIMETRO_CALCULO
resumen_inicial: El cálculo del perímetro de un triángulo se realiza sumando directamente
  las tres longitudes de sus lados, adaptándose a fórmulas particulares según su tipo
  y permitiendo despejar lados desconocidos.
explicacion_simple: '![Cálculo de Perímetro](/static/img/nodos/calculo-del-perimetro-de-un-triangulo-sumando-sus-tres-lados-intro.svg)


  Para calcular el perímetro de cualquier triángulo solo debes **sumar sus tres lados**:
  - Si es **equilátero**: multiplica el lado por 3 ($P = 3L$). - Si es **isósceles**:
  multiplica el lado repetido por 2 y suma la base ($P = 2L + b$). - Si es **escaleno**:
  suma los tres lados distintos ($P = a + b + c$). Y si te dan el perímetro total
  y te falta un lado, ¡solo réstale los lados que ya conoces!'
explicacion_formal: '### Algoritmo formal

  El cálculo analítico del perímetro $P$ consiste en la evaluación de la forma lineal
  aditiva sobre los tres lados del triángulo:


  $$P = a + b + c$$


  $$\begin{cases} \text{Equilátero } (a=b=c=L): & P = 3L \iff L = \frac{P}{3} \\ \text{Isósceles
  } (a=b=L): & P = 2L + c \iff c = P - 2L \\ \text{Escaleno:} & P = a + b + c \end{cases}$$


  ### Desglose simbólico y geométrico

  - Operación aditiva directa de magnitudes escalares homogéneas.

  - Despeje inverso: Para hallar un lado desconocido conociendo $P_0$: $c = P_0 -
  a - b$.


  ### Síntesis didáctica

  El cálculo de perímetros ejercita la suma directa y el despeje algebraico de lados
  según el grado de simetría métrica del triángulo.'
definiciones_clave: '- **Cálculo directo**: Operación de adición escalar $P = a +
  b + c$.

  - **Fórmula de isósceles**: $P = 2L + b$.

  - **Fórmula de equilátero**: $P = 3L$.

  - **Despeje de incógnita**: $c = P - a - b$. '
propiedades_relaciones: '- **Relación con semiperímetro**: $s = P / 2 = \frac{a +
  b + c}{2}$.

  - **Perímetro en triángulos semejantes**: Si $\triangle ABC \sim \triangle A''B''C''$
  con razón de semejanza $k$, sus perímetros cumplen exactamente $P'' = k \cdot P$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cálculo de Perímetro](/static/img/nodos/calculo-del-perimetro-de-un-triangulo-sumando-sus-tres-lados-ejemplos.svg)


    Un triángulo isósceles tiene un perímetro de $34\text{ cm}$ y su base mide $10\text{
    cm}$. Calcula la longitud de cada uno de sus dos lados iguales.'
  pasos:
  - 'Paso 1: Recordar la fórmula del perímetro del triángulo isósceles: $P = 2L +
    b$.'
  - 'Paso 2: Sustituir los datos conocidos: $34 = 2L + 10$.'
  - 'Paso 3: Despejar $2L$: $2L = 34 - 10 = 24\text{ cm}$.'
  - 'Paso 4: Dividir entre 2 para hallar $L$: $L = 24 / 2 = 12\text{ cm}$.'
  - 'Paso 5: Comprobar: $12 + 12 + 10 = 34\text{ cm}$.'
  - 'Paso 6: Concluir que cada uno de los lados iguales mide $12\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el perímetro de un triángulo equilátero de lado L?
  choices:
  - text: P = 3L (multiplicando la medida del lado por 3)
    is_correct: true
  - text: P = L^3
    is_correct: false
  - text: P = 2L + 3
    is_correct: false
  - text: P = L / 3
    is_correct: false
  explanation: Por tener tres lados iguales, se calcula como P = 3L (multiplicando
    la medida del lado por 3).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el perímetro de un triángulo es 28 cm y dos de sus lados miden 9 cm
    y 11 cm, ¿cuánto mide el tercer lado?
  choices:
  - text: 8 cm (porque 28 - (9 + 11) = 28 - 20 = 8 cm)
    is_correct: true
  - text: 10 cm
    is_correct: false
  - text: 20 cm
    is_correct: false
  - text: 48 cm
    is_correct: false
  explanation: Restando la suma de los lados conocidos del perímetro se obtiene 8
    cm (porque 28 - (9 + 11) = 28 - 20 = 8 cm).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el tipo de triángulo (escaleno, isósceles o equilátero).'
- 'Paso 2: Si se conocen todos los lados, aplicar la suma $P = a + b + c$ o su versión
  simplificada ($3L$, $2L+b$).'
- 'Paso 3: Si se conoce el perímetro y falta un lado, restar los lados conocidos del
  perímetro total.'
errores_correccion: 'Ten cuidado al despejar: si el triángulo es isósceles, recuerda
  restar la base primero y luego dividir el resultado por 2.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el perímetro de un triángulo equilátero cuyos lados miden $7.5\text{
    cm}$?
  alternativas:
  - $22.5\text{ cm}$
  - $15\text{ cm}$
  - $56.25\text{ cm}$
  respuesta: $22.5\text{ cm}$
  solucion_pasos:
  - $P = 3 \times 7.5\text{ cm} = 22.5\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: En un triángulo escaleno de lados $3x$, $4x$ y $5x$, el perímetro es
    $36\text{ cm}$. ¿Cuánto mide el lado mayor?
  alternativas:
  - $15\text{ cm}$
  - $12\text{ cm}$
  - $9\text{ cm}$
  respuesta: $15\text{ cm}$
  solucion_pasos:
  - $3x + 4x + 5x = 36 \implies 12x = 36 \implies x = 3\text{ cm}$. El lado mayor
    es $5(3) = 15\text{ cm}$.
- titulo: ¿El perímetro de un triángulo de lados 6 cm, 8 cm y 10 cm es 24 cm?
  respuesta: Sí
  solucion_pasos:
  - Sí, $6 + 8 + 10 = 24\text{ cm}$.
- titulo: ¿Para hallar el lado de un triángulo equilátero de perímetro 27 cm se divide
    entre 2?
  respuesta: 'No'
  solucion_pasos:
  - No, se divide entre 3 ($27 / 3 = 9\text{ cm}$).
errores_frecuentes:
- Dividir entre 2 en lugar de 3 al despejar el lado de un equilátero.
- Olvidar restar la base antes de dividir entre 2 en un isósceles.
- Confundir la fórmula del perímetro con la de cuadriláteros.
- Errores aritméticos básicos de suma o resta.
- Despejar incógnitas lineales sin agrupar términos semejantes.
afirmaciones_verdaderas:
- El perímetro de cualquier triángulo se obtiene sumando las medidas de sus tres lados.
- Conociendo el perímetro total y dos lados, el tercer lado se calcula mediante $c
  = P - (a + b)$.
al_terminar_debes_poder: '**QUÉ:** Calcular el perímetro de cualquier triángulo y
  despejar longitudes de lados desconocidos.


  **CÓMO:** Aplicando las fórmulas $P = a + b + c$, $P = 2L + b$ y $P = 3L$ según
  la clasificación métrica del triángulo.


  ![Resumen de Cálculo de Perímetro](/static/img/nodos/calculo-del-perimetro-de-un-triangulo-sumando-sus-tres-lados-resumen.svg)'
