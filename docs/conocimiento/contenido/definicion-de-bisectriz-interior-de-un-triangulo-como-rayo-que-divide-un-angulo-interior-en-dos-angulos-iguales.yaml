semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.BISECTRIZ_INTERIOR_DEFINICION
resumen_inicial: La bisectriz interior de un triángulo es el rayo o segmento de recta
  que parte desde un vértice y divide su ángulo interior en dos ángulos de exactamente
  la misma medida ($\alpha/2$).
explicacion_simple: '![Bisectriz Interior](/static/img/nodos/definicion-de-bisectriz-interior-de-un-triangulo-como-rayo-que-divide-un-angulo-interior-en-dos-angulos-iguales-intro.svg)


  Imagina que tienes una esquina (un ángulo) de un triángulo y trazas una línea recta
  justo por la mitad exacta:


  - **Corta el ángulo en dos mitades idénticas**: Si el ángulo original mide $60^\circ$,
  la bisectriz lo parte en dos ángulos iguales de $30^\circ$ cada uno.

  - **Llega al lado de al frente**: Comienza en el vértice y termina en un punto $D$
  sobre el lado opuesto.

  - **Tres bisectrices**: Como el triángulo tiene 3 esquinas, tiene 3 bisectrices
  interiores ($b_\alpha, b_\beta, b_\gamma$).

  '
explicacion_formal: '### Definición formal

  En un triángulo $\Delta ABC$, la **bisectriz interior** correspondiente al vértice
  $A$ ($b_a$) es el segmento $\overline{AD}$ trazado desde el vértice $A$ hasta el
  lado opuesto $\overline{BC}$ que divide al ángulo interior $\alpha$ en dos ángulos
  congruentes:


  $$b_a = \overline{AD} \quad \text{con} \quad D \in \overline{BC} \quad \land \quad
  \mu(\angle BAD) = \mu(\angle CAD) = \frac{\alpha}{2}$$


  $$\frac{BD}{DC} = \frac{c}{b} \quad (\text{Teorema de la Bisectriz Interior})$$


  ### Desglose simbólico y geométrico

  - $A$: Vértice del ángulo bisecado.

  - $D$: Pie de la bisectriz sobre el lado opuesto $\overline{BC}$.

  - Teorema de Apolonio / Bisectriz: Divide al lado opuesto en segmentos proporcionales
  a los lados adyacentes.


  ### Síntesis didáctica

  La bisectriz interior divide el ángulo en dos mitades simétricas y particiona el
  lado opuesto en razón proporcional a los lados adyacentes.'
definiciones_clave: '- **Bisectriz interior**: Segmento que biseca un ángulo interior
  y une el vértice con el lado opuesto.

  - **Pie de la bisectriz**: Punto $D$ de intersección entre la bisectriz y el lado
  opuesto.

  - **Ángulos congruentes**: Dos ángulos que poseen exactamente la misma amplitud
  angular.

  '
propiedades_relaciones: '- **Bisección angular**: $\angle BAD = \angle CAD = \frac{\alpha}{2}$.

  - **Teorema de la bisectriz interior**: $\frac{BD}{DC} = \frac{c}{b} = \frac{AB}{AC}$.

  - **Pertenencia interior**: Las tres bisectrices interiores están completamente
  contenidas en el cierre convexo del triángulo.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Bisectriz Interior](/static/img/nodos/definicion-de-bisectriz-interior-de-un-triangulo-como-rayo-que-divide-un-angulo-interior-en-dos-angulos-iguales-ejemplos.svg)


    En un triángulo $ABC$, el ángulo interior en el vértice $A$ mide $84^\circ$. Se
    traza la bisectriz interior $\overline{AD}$ hacia el lado opuesto $\overline{BC}$.
    ¿Cuál es la medida de los dos ángulos generados en el vértice $A$?

    '
  pasos:
  - 'Paso 1: Identificar la definición de bisectriz interior: divide el ángulo en
    dos partes congruentes.'
  - 'Paso 2: Establecer la ecuación de división: $\angle BAD = \angle CAD = \frac{\angle
    A}{2}$.'
  - 'Paso 3: Sustituir el valor del ángulo: $\frac{84^\circ}{2} = 42^\circ$.'
  - 'Paso 4: Concluir que los dos ángulos formados miden exactamente $42^\circ$ cada
    uno.'
checkpoints:
- placement: after_explicacion_formal
  question: Si un ángulo interior de un triángulo mide 76°, ¿cuánto mide cada uno
    de los dos ángulos formados por su bisectriz interior?
  choices:
  - text: $38^\circ$
    is_correct: true
  - text: $76^\circ$
    is_correct: false
  - text: $152^\circ$
    is_correct: false
  - text: $90^\circ$
    is_correct: false
  explanation: Cada ángulo mide $38^\circ$, ya que la bisectriz interior divide el
    ángulo de 76° en dos partes iguales ($76^\circ / 2 = 38^\circ$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué propiedad geométrica cumple cualquier punto sobre la bisectriz interior
    de un ángulo?
  choices:
  - text: Equidista de los dos lados que forman dicho ángulo
    is_correct: true
  - text: Es el punto medio del lado opuesto
    is_correct: false
  - text: Forma un ángulo recto con el lado opuesto
    is_correct: false
  - text: Está fuera del triángulo
    is_correct: false
  explanation: Todo punto de la bisectriz equidista de los dos lados que forman dicho
    ángulo, siendo este su lugar geométrico.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el vértice desde el cual se traza la bisectriz y conocer la
  medida de su ángulo interior $\alpha$.'
- 'Paso 2: Dividir la medida angular exactamente entre 2: $\frac{\alpha}{2}$.'
- 'Paso 3: Trazar el segmento desde el vértice hasta cortar el lado opuesto en el
  punto $D$.'
- 'Paso 4: Si se conocen las longitudes de los lados, aplicar el teorema de la bisectriz
  $\frac{BD}{DC} = \frac{AB}{AC}$.'
errores_correccion: 'No confundas bisectriz con mediana: la bisectriz divide el ángulo
  en partes iguales, mientras que la mediana divide el lado opuesto en partes iguales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo $ABC$, el ángulo en el vértice $B$ mide $50^\circ$. Si
    se traza la bisectriz interior $BE$, ¿cuánto mide el ángulo $\angle ABE$?
  alternativas:
  - $25^\circ$
  - $50^\circ$
  - $100^\circ$
  respuesta: $25^\circ$
  solucion_pasos:
  - 'La bisectriz divide el ángulo de $50^\circ$ en dos partes iguales: $50^\circ
    / 2 = 25^\circ$.'
- titulo: Ejemplo 2
  enunciado: En un triángulo con lados $AB = 6\text{ cm}$ y $AC = 9\text{ cm}$, se
    traza la bisectriz $AD$. ¿En qué razón divide el punto $D$ al lado $BC$?
  alternativas:
  - 'En razón $2 : 3$'
  - 'En razón $1 : 1$'
  - 'En razón $3 : 2$'
  respuesta: 'En razón $2 : 3$'
  solucion_pasos:
  - 'Por el teorema de la bisectriz: $\frac{BD}{DC} = \frac{AB}{AC} = \frac{6}{9}
    = \frac{2}{3}$.'
- titulo: ¿La bisectriz de un triángulo divide siempre el ángulo en dos partes iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición geométrica estricta de bisectriz.
- titulo: ¿La bisectriz interior de un triángulo siempre llega al punto medio del
    lado opuesto?
  respuesta: 'No'
  solucion_pasos:
  - No, solo llega al punto medio en triángulos isósceles (desde el vértice principal)
    o equiláteros. En un triángulo escaleno no divide el lado en partes iguales.
errores_frecuentes:
- Asumir que la bisectriz siempre es perpendicular al lado opuesto.
- Confundir la bisectriz con la transversal de gravedad o mediana.
- Creer que la bisectriz divide el área del triángulo en dos mitades iguales en cualquier
  triángulo.
- Restar el ángulo de 180° en lugar de dividirlo por 2.
- Olvidar que existen 3 bisectrices interiores en todo triángulo.
afirmaciones_verdaderas:
- La bisectriz interior divide un ángulo interior en dos ángulos congruentes de medida
  $\alpha/2$.
- El pie de la bisectriz interior divide al lado opuesto en segmentos proporcionales
  a los lados adyacentes.
al_terminar_debes_poder: '**QUÉ:** Definir, trazar y aplicar las propiedades de la
  bisectriz interior de un triángulo.


  **CÓMO:** Dividiendo la amplitud angular en dos mitades congruentes ($\alpha/2$)
  y aplicando el teorema de la bisectriz proporcional ($\frac{BD}{DC} = \frac{c}{b}$).


  ![Resumen de Bisectriz Interior](/static/img/nodos/definicion-de-bisectriz-interior-de-un-triangulo-como-rayo-que-divide-un-angulo-interior-en-dos-angulos-iguales-resumen.svg)

  '
