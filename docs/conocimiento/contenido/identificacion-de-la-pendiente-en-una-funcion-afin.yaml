semantic_id: MAT.ALG.FUNCION_AFIN.PENDIENTE_PARAMETRO
resumen_inicial: 'Identificación de la pendiente en una función afín: conceptos, representación
  y propiedades en Función afín.'
explicacion_simple: 'En $f(x) = mx + n$, el primer parámetro cumple exactamente el
  mismo rol que en la función lineal: controla qué tan inclinada está la recta.'
explicacion_formal: '### Definición formal


  Dada $f(x) = mx+n$, la pendiente $m$ cumple la misma función que en la recta lineal:
  para dos puntos cualesquiera $(x_1, f(x_1))$ y $(x_2, f(x_2))$ de la gráfica, se
  cumple $m = \dfrac{f(x_2)-f(x_1)}{x_2-x_1}$, independientemente del valor de $n$.


  ### Desarrollo didáctico


  Sumar el término $n$ no cambia la inclinación de la recta, solo la desplaza verticalmente;
  por eso $m$ sigue siendo el único responsable de qué tan empinada e inclinada se
  ve la recta.


  Comparando $f(x)=3x+5$ y $g(x)=3x-10$: ambas tienen la misma pendiente ($m=3$) y
  por tanto son paralelas entre sí, aunque estén ubicadas en alturas distintas.'
definiciones_clave: '- **Identificación de la pendiente en una función afín**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación de la pendiente en una función
  afín.'
