semantic_id: MAT.ALG.FUNCION_AFIN.PENDIENTE_PARAMETRO
resumen_inicial: Identificar la pendiente $m$ en una función afín permite determinar el ritmo de cambio constante y la orientación de la recta en el plano.
explicacion_simple: |
  En una función afín $f(x) = mx + b$:

  - La **pendiente es el número $m$ que multiplica a la $x$**.
  - No te confundas por el orden: por ejemplo, en $f(x) = 5 - 2x$, la pendiente es **$m = -2$** (el coeficiente que acompaña a la $x$).
  - La pendiente te indica si la recta sube ($m > 0$) o baja ($m < 0$).
explicacion_formal: |
  Dada la expresión algebraica de una función afín $f(x) = mx + b$, el parámetro **$m$** se define formalmente como el coeficiente diferencial o tasa marginal de cambio:

  $$m = \frac{d}{dx}[mx + b] = \frac{\Delta y}{\Delta x}$$

  **Criterio de identificación:**
  - En la forma explícita $y = mx + b$, $m$ es el coeficiente de la variable independiente $x$.
  - En la forma general $Ax + By + C = 0$, la pendiente se obtiene aislando $y$: $m = -\frac{A}{B}$.
definiciones_clave: |
  - **Pendiente en función afín**: Coeficiente multiplicativo $m$ asociado a la variable $x$ que rige la tasa de variación continua de la función.
propiedades_relaciones: |
  - **Paralelismo**: Dos funciones afines $f(x) = m_1 x + b_1$ y $g(x) = m_2 x + b_2$ son **paralelas** si y solo si tienen la misma pendiente: $m_1 = m_2$.
ejemplo_guiado:
  enunciado: "Identifica la pendiente de las funciones $f(x) = 4x - 9$ y $g(x) = 12 - 7x$, y determina su monotonía."
  pasos:
    - 'Paso 1: Para $f(x) = 4x - 9$: el número que acompaña a $x$ es $4 \implies$ pendiente $m = 4$. Como $m > 0$, $f$ es creciente.'
    - 'Paso 2: Para $g(x) = 12 - 7x$: el número que acompaña a $x$ es $-7 \implies$ pendiente $m = -7$. Como $m < 0$, $g$ es decreciente.'
    - 'Paso 3: Concluir que las pendientes son $m_f = 4$ (creciente) y $m_g = -7$ (decreciente).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el valor de la pendiente $m$ en la función afín $g(x) = 12 - 7x$?"
    choices:
      - {text: "$m = -7$", is_correct: true}
      - {text: "$m = 12$", is_correct: false}
      - {text: "$m = 7$", is_correct: false}
      - {text: "$m = 5$", is_correct: false}
    explanation: "La alternativa correcta es '$m = -7$'. La pendiente es el coeficiente que multiplica a $x$, por lo que $m = -7$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué condición deben cumplir las pendientes de dos funciones afines para que sus gráficas sean paralelas?"
    choices:
      - {text: "Deben ser exactamente iguales ($m_1 = m_2$).", is_correct: true}
      - {text: "Deben sumar cero ($m_1 + m_2 = 0$).", is_correct: false}
      - {text: "Su producto debe ser igual a $-1$.", is_correct: false}
      - {text: "Una debe ser el doble de la otra.", is_correct: false}
    explanation: "La alternativa correcta es 'Deben ser exactamente iguales ($m_1 = m_2$).'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reordenar la expresión en forma explícita $f(x) = mx + b$ agrupando el término con $x$ al inicio.'
  - 'Paso 2: Identificar el número numérico que multiplica a $x$ (incluyendo su signo).'
  - 'Paso 3: Declarar dicho valor como la pendiente $m$.'
  - 'Paso 4: Clasificar la dirección de la recta según el signo de $m$.'
errores_correccion: |
  - **Error común:** Asumir que la pendiente es siempre el "primer número" que aparece escrito en la fórmula.
  - **Cómo corregirlo:** La pendiente es el coeficiente que **MULTIPLICA A LA VARIABLE $X$**, sin importar si está escrito al principio o al final (ej. en $8 - 3x$, $m = -3$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la función afín $f(x) = 8 - 3x$, la pendiente es la constante $m = 8$ por ser el primer término.'
  - 'La pendiente de la función afín $f(x) = \frac{x}{2} + 5$ es igual a $m = 1$.'
  - 'Identificar la pendiente de una función afín requiere calcular la derivada de segundo orden.'
  - 'Si la pendiente de una función afín es un número fraccionario, la gráfica no se puede trazar en el plano.'
  - 'Dos rectas afines con la misma pendiente $m_1 = m_2$ son siempre perpendiculares entre sí.'
afirmaciones_verdaderas:
  - 'En una función afín $f(x) = mx + b$, la pendiente $m$ es el coeficiente que multiplica a la variable independiente $x$, determinando la tasa de cambio de la función.'
  - 'Dos funciones afines poseen rectas paralelas si y solo si comparten el mismo valor de pendiente $m_1 = m_2$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer la pendiente $m$ de cualquier expresión de función afín.
  CÓMO: Ubicar el coeficiente que multiplica a la variable $x$ en la forma explícita $y = mx + b$ e interpretar su signo.
