semantic_id: MAT.ALG.FUNCION_AFIN.PENDIENTE_PARAMETRO
resumen_inicial: En la función afín $f(x) = m x + n$, la pendiente $m$ es el coeficiente
  de $x$ y determina el ritmo de variación de la función.
explicacion_simple: 'Para encontrar la **pendiente $m$** en una función afín dada
  por su fórmula:

  - Identificamos el número que multiplica directamente a la variable $x$.

  - No importa en qué orden esté escrita la expresión: en $f(x) = 7 - 3x$, el número
  que multiplica a la $x$ es $-3$, luego la pendiente es $m = -3$.'
explicacion_formal: 'En la representación canónica de la función afín $f(x) = m x
  + n$:


  $$m = \frac{\mathrm{d}f}{\mathrm{d}x} = \frac{f(x + 1) - f(x)}{1}$$


  **Desglose de la fórmula:**

  - Coeficiente de variación marginal que mide el incremento o decrecimiento exacto
  de $f(x)$ por cada unidad que aumenta $x$.'
definiciones_clave: '- **Pendiente ($m$)**: Parámetro multiplicativo de $x$ que rige
  la tasa de cambio de la función afín.'
propiedades_relaciones: '- **Paralelismo**: Dos funciones afines $f(x) = m_1 x + n_1$
  y $g(x) = m_2 x + n_2$ representan rectas paralelas si y solo si sus pendientes
  son iguales ($m_1 = m_2$).'
ejemplo_guiado:
  enunciado: Dada la función $f(x) = 8 - 5x$, identifica su pendiente $m$ y determina
    si la función es creciente o decreciente.
  pasos:
  - 'Paso 1: Reordenar la fórmula a la forma canónica $m x + n$: $f(x) = -5x + 8$.Paso
    2: Identificar el coeficiente de $x$: $m = -5$.Paso 3: Analizar el signo de la
    pendiente: como $m = -5 < 0$, es negativa.Paso 4: Concluir que la función afín
    es estrictamente decreciente.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función afín $f(x) = 8 - 5x$, ¿cuál es el valor exacto de su pendiente
    $m$?
  choices:
  - text: $m = -5$
    is_correct: true
  - text: $m = 8$
    is_correct: false
  - text: $m = 5$
    is_correct: false
  - text: $m = -8$
    is_correct: false
  explanation: La alternativa correcta es '$m = -5$'. (Es el número que multiplica
    directamente a la variable $x$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación tienen las gráficas de las funciones afines $f(x) = 3x +
    1$ y $g(x) = 3x - 7$?
  choices:
  - text: Son rectas paralelas porque ambas tienen la misma pendiente $m = 3$.
    is_correct: true
  - text: Son rectas perpendiculares.
    is_correct: false
  - text: Se intersectan en el origen.
    is_correct: false
  - text: Son la misma recta idéntica.
    is_correct: false
  explanation: La alternativa correcta es 'Son rectas paralelas porque ambas tienen
    la misma pendiente $m = 3$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reescribir la función si es necesario en el orden $f(x) = m x + n$.'
- 'Paso 2: Aislar el coeficiente numérico de la variable $x$ respetando su signo.'
- 'Paso 3: Declarar dicho valor como la pendiente $m$.'
errores_correccion: '- **Error común:** Asumir que la pendiente es el primer número
  que aparece en la expresión (pensar que en $8 - 5x$ la pendiente es 8).

  - **Cómo corregirlo:** La pendiente es SIEMPRE el número que acompaña multiplicando
  a la letra $x$, sin importar si está primero o segundo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
