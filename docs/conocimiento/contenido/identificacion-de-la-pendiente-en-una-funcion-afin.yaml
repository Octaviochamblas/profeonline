semantic_id: MAT.ALG.FUNCION_AFIN.PENDIENTE_PARAMETRO
resumen_inicial: La pendiente $m$ en una función afín es el coeficiente numérico que multiplica a la variable independiente $x$ en la forma explícita $y = mx + n$.
explicacion_simple: '![La pendiente $m$ en una función afín es el coeficiente numérico que multiplica a la variable independiente $x$ en la forma explícita $y = mx + n$](/static/img/nodos/identificacion-de-la-pendiente-en-una-funcion-afin-intro.svg)



  Para encontrar la **pendiente** de una función afín:

  1. Asegúrate de que la función esté despejada en la forma $y = mx + n$.

  2. Mira el número que está multiplicando directamente a la $x$.

  3. Ese número es la pendiente $m$.


  **¡Ojo!** La pendiente es solo el número, **no incluyas la letra $x$** (si tienes $y = 7x + 2$, la pendiente es $m = 7$, no $7x$).'
explicacion_formal: 'Dada una función afín en su forma canónica explícita $f(x) = mx + n$, el parámetro **pendiente** $m$ se define analíticamente como la derivada de primer orden o la tasa de variación constante:

  $$m = \frac{df}{dx} = \text{constante}, \quad m \in \mathbb{R} \setminus \{0\}$$


  **Casos de formas no explícitas:**

  - **Forma desordenada**: $f(x) = b + ax \implies m = a$.

  - **Forma con denominador común**: $f(x) = \frac{ax + b}{c} \implies m = \frac{a}{c}$.

  - **Forma general**: $Ax + By + C = 0 \implies y = -\frac{A}{B}x - \frac{C}{B} \implies m = -\frac{A}{B}$.'
definiciones_clave: '- **Pendiente $m$**: Factor de escala y razón de cambio constante de la variable dependiente respecto a la independiente.

  - **Forma explícita**: Expresión donde la variable dependiente $y$ se encuentra despejada con coeficiente $+1$.'
propiedades_relaciones: '- **Invarianza aditiva**: El valor de $m$ no se ve afectado por el coeficiente de posición $n$.

  - **Inclinación angular**: $m = \tan(\theta)$, donde $\theta$ es el ángulo de inclinación.'
ejemplo_guiado:
  enunciado: '![Ejemplo La pendiente $m$ en una función afín es el coeficiente numérico que multiplica a la variable independiente $x$ en la forma explícita $y = mx + n$](/static/img/nodos/identificacion-de-la-pendiente-en-una-funcion-afin-ejemplos.svg)



    Determina la pendiente de las siguientes funciones:

    1) $f(x) = 5 - 2x$

    2) $g(x) = \frac{3x - 1}{4}$

    3) $2x + 5y = 10$'
  pasos:
  - 'Paso 1: Para $f(x) = 5 - 2x$: reescribir como $f(x) = -2x + 5$. La pendiente es $m = -2$.'
  - 'Paso 2: Para $g(x) = \frac{3x - 1}{4}$: separar términos $g(x) = \frac{3}{4}x - \frac{1}{4}$. La pendiente es $m = \frac{3}{4}$.'
  - 'Paso 3: Para $2x + 5y = 10$: despejar $y \implies 5y = -2x + 10 \implies y = -\frac{2}{5}x + 2$. La pendiente es $m = -\frac{2}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la pendiente de la función afín $f(x) = 9 - 4x$?
  choices:
  - text: m = -4
    is_correct: true
  - text: m = 9
    is_correct: false
  - text: m = 4
    is_correct: false
  - text: m = -4x
    is_correct: false
  explanation: La alternativa correcta es 'm = -4'. El coeficiente que multiplica a $x$ es $-4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $3x - 2y = 8$, ¿cuál es la pendiente de la recta?
  choices:
  - text: 3/2
    is_correct: true
  - text: -3/2
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '-2'
    is_correct: false
  explanation: 'La alternativa correcta es ''3/2''. Al despejar: $-2y = -3x + 8 \implies y = \frac{3}{2}x - 4$, luego $m = 3/2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Despejar totalmente la variable $y$ si la ecuación está implícita.'
- 'Paso 2: Distribuir denominadores comunes entre cada término.'
- 'Paso 3: Identificar el número real que multiplica a la variable independiente $x$.'
- 'Paso 4: Reportar la pendiente $m$ con su signo correspondiente sin incluir la letra $x$.'
errores_correccion: '- **Error común:** Escribir la pendiente como $m = 3x$ en vez de $m = 3$.

  - **Cómo corregirlo:** La pendiente es un **coeficiente numérico escalar**, nunca lleva la variable $x$.'
ejemplos:
- titulo: 'Ejemplo 1: Pendiente fraccionaria negativa'
  enunciado: ¿Cuál es la pendiente de $f(x) = \frac{7 - 5x}{2}$?
  alternativas:
  - -5/2
  - 7/2
  - '-5'
  - 5/2
  respuesta: -5/2
  solucion_pasos:
  - 'Paso 1: Separar: $f(x) = -\frac{5}{2}x + \frac{7}{2}$.'
  - 'Paso 2: $m = -\frac{5}{2}$.'
- titulo: 'Ejemplo 2: Pendiente unitaria con signo'
  enunciado: En $g(x) = 6 - x$, ¿cuál es el valor de $m$?
  alternativas:
  - '-1'
  - '1'
  - '6'
  - '-6'
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: $g(x) = -1x + 6 \implies m = -1$.'
- titulo: 'Ejemplo 3: Despeje desde ecuación simétrica'
  enunciado: Halla la pendiente en $4x + 2y = -6$.
  alternativas:
  - '-2'
  - '2'
  - '-4'
  - '-3'
  respuesta: '-2'
  solucion_pasos:
  - 'Paso 1: $2y = -4x - 6 \implies y = -2x - 3 \implies m = -2$.'
- titulo: 'Ejemplo 4: Coeficiente decimal'
  enunciado: Si $h(x) = 0.75x - 1.2$, ¿cuál es la pendiente en forma de fracción?
  alternativas:
  - 3/4
  - 4/3
  - -6/5
  - 75/10
  respuesta: 3/4
  solucion_pasos:
  - 'Paso 1: $0.75 = \frac{75}{100} = \frac{3}{4}$.'
errores_frecuentes:
- Incluir la variable x al indicar la pendiente.
- No despejar la variable y antes de extraer el coeficiente.
- Olvidar distribuir los denominadores en fracciones algebraicas.
afirmaciones_verdaderas:
- La pendiente m es el factor numérico que acompaña a la variable independiente x en la forma explícita y = mx + n.
- Para encontrar la pendiente a partir de una ecuación implícita, es indispensable despejar la variable dependiente y.
al_terminar_debes_poder: '**QUÉ:** Identificar y extraer correctamente la pendiente m en funciones afines.


  **CÓMO:** Despejando la ecuación a su forma explícita y = mx + n y aislando el coeficiente numérico de x.


  ![Resumen La pendiente $m$ en una función afín es el coeficiente numérico que multiplica a la variable independiente $x$ en la forma explícita $y = mx + n$](/static/img/nodos/identificacion-de-la-pendiente-en-una-funcion-afin-resumen.svg)'
