semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DELTA_CERO
resumen_inicial: La interpretación de discriminante cero ($\Delta = 0$) demuestra que la ecuación posee una única solución real doble dada por $x = -b / (2a)$.
explicacion_simple: |
  Cuando el discriminante de una ecuación cuadrática vale **exactamente cero** ($\Delta = 0$):

  - En la fórmula general $x = \frac{-b \pm \sqrt{0}}{2a}$, la raíz de cero es cero ($\sqrt{0} = 0$).
  - Sumar cero o restar cero da exactamente el mismo resultado:
    $$x_1 = \frac{-b + 0}{2a} = -\frac{b}{2a} \quad \text{y} \quad x_2 = \frac{-b - 0}{2a} = -\frac{b}{2a}$$
  - **Conclusión**: No hay dos soluciones distintas, sino **UNA SOLA SOLUCIÓN REAL DOBLE** ($x_1 = x_2$).
  - **Geometría**: La parábola roza al eje $X$ en un solo punto (el vértice toca el eje $X$).
explicacion_formal: |
  Sea la ecuación cuadrática $ax^2 + bx + c = 0$ con $a \neq 0$. Si el discriminante satisface la condición escalar $\Delta = b^2 - 4ac = 0$:

  1. **Polinomio Cuadrado Perfecto:** El trinomio $ax^2 + bx + c$ se puede factorizar en la forma de un único binomio al cuadrado:
     $$ax^2 + bx + c = a\left(x + \frac{b}{2a}\right)^2 = 0$$

  2. **Multiplicidad Algebraica:** La ecuación posee una raíz real $x_0 \in \mathbb{R}$ con multiplicidad 2 (raíz doble):
     $$x_1 = x_2 = -\frac{b}{2a} \implies S = \left\{-\frac{b}{2a}\right\}$$
definiciones_clave: |
  - **Raíz real doble (multiplicidad 2)**: Solución única de una ecuación cuadrática donde las dos soluciones teóricas coinciden numéricamente en $x = -b/(2a)$ debido a $\Delta = 0$.
propiedades_relaciones: |
  - **Tangencia de la parábola**: Gráficamente, $\Delta = 0$ es la condición de tangencia entre la función cuadrática $f(x) = ax^2 + bx + c$ y el eje de las abscisas, ubicándose el punto de contacto exactamente en el vértice $(V_x, 0) = (-b/(2a), 0)$.
ejemplo_guiado:
  enunciado: 'Demuestra analíticamente que la ecuación $4x^2 - 12x + 9 = 0$ tiene una única solución real doble y calcula su valor.'
  pasos:
    - 'Paso 1: Calcular el discriminante con $a = 4$, $b = -12$, $c = 9$: $\Delta = (-12)^2 - 4(4)(9) = 144 - 144 = 0$.'
    - 'Paso 2: Como $\Delta = 0$, confirmar la existencia de una única solución real doble.'
    - 'Paso 3: Calcular el valor de la raíz utilizando la fórmula reducida $x = -\frac{b}{2a}$: $x = -\frac{-12}{2(4)} = \frac{12}{8} = \frac{3}{2}$.'
    - 'Paso 4: Escribir el conjunto solución: $S = \{3/2\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué fórmula simplificada permite calcular la solución real doble de $ax^2 + bx + c = 0$ cuando $\Delta = 0$?'
    choices:
      - {text: '$x = -\frac{b}{2a}$', is_correct: true}
      - {text: '$x = \frac{c}{a}$', is_correct: false}
      - {text: '$x = \sqrt{\frac{b}{a}}$', is_correct: false}
      - {text: '$x = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = -\frac{b}{2a}$''. Al anularse el radical $\sqrt{0}$, la fórmula general se reduce a esta fracción.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con la gráfica de la parábola $f(x) = x^2 - 4x + 4$ con respecto al eje $X$?'
    choices:
      - {text: 'Es tangente al eje $X$ en un único punto $(2,0)$ porque su discriminante es $\Delta = 0$.', is_correct: true}
      - {text: 'Corta al eje $X$ en dos puntos distantes.', is_correct: false}
      - {text: 'No toca ni interseca al eje $X$ en ningún punto.', is_correct: false}
      - {text: 'Corta al eje $Y$ en el origen $(0,0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Es tangente al eje $X$ en un único punto $(2,0)$ porque su discriminante es $\Delta = 0$.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Evaluar la condición del discriminante $\Delta = b^2 - 4ac$ verificando que su valor sea idénticamente cero.'
  - 'Paso 2: Concluir que el polinomio corresponde a un trinomio cuadrado perfecto de la forma $a(x - x_0)^2 = 0$.'
  - 'Paso 3: Calcular el valor de la raíz doble única aplicando la fórmula $x_0 = -\frac{b}{2a}$.'
  - 'Paso 4: Declarar el conjunto solución como un singleton $S = \{x_0\}$.'
errores_correccion: |
  - **Error común:** Afirmar que si $\Delta = 0$, la solución de la ecuación cuadrática es siempre $x = 0$.
  - **Cómo corregirlo:** $\Delta = 0$ significa que la **CANTIDAD DE SOLUCIONES DISTINTAS ES UNA**; el valor de esa solución es $x = -b/(2a)$, no necesariamente cero.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Raíz doble entera.
    alternativas:
      - '$S = \{3\}$ (solución doble)'
      - '$S = \{-3, 3\}$'
      - '$S = \{0\}$'
    respuesta: '$S = \{3\}$ (solución doble)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Raíz doble fraccionaria.
    alternativas:
      - '$S = \{1/2\}$ (solución doble)'
      - '$S = \{-1/2, 1/2\}$'
      - '$\emptyset$'
    respuesta: '$S = \{1/2\}$ (solución doble)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La deducción errónea de que un discriminante igual a cero implica que la solución de la ecuación debe ser el número cero.'
  - 'Escribir dos soluciones distintas $x_1$ y $x_2$ cuando el discriminante vale cero.'
  - 'La idea de que si la parábola es tangente al eje $X$, el término independiente $c$ debe ser igual a cero.'
  - 'La aplicación de la fórmula $x = -b/(2a)$ cuando el discriminante es estrictamente positivo.'
  - 'Afirmar que un discriminante nulo impide la factorización del polinomio cuadrático.'
afirmaciones_verdaderas:
  - 'Un discriminante nulo ($\Delta = 0$) caracteriza a las ecuaciones cuadráticas que representan trinomios cuadrados perfectos con una única solución real doble $x = -b/(2a)$.'
  - 'Geométricamente, $\Delta = 0$ representa el caso donde la parábola toca tangencialmente al eje de las abscisas en su vértice.'
al_terminar_debes_poder: |
  QUÉ: Interpretar y calcular las soluciones de ecuaciones cuadráticas con discriminante igual a cero ($\Delta = 0$).
  CÓMO: Verificar $\Delta = 0$, identificar la presencia de una raíz real doble con multiplicidad 2 y calcular $x = -b/(2a)$.
