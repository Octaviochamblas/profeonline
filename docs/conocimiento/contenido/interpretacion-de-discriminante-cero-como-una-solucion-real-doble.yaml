semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DELTA_CERO
resumen_inicial: Cuando el discriminante es exactamente cero ($\Delta = 0$), la ecuación cuadrática posee una única solución real de multiplicidad dos (raíz doble $x_1 = x_2 = -b/(2a)$), lo que geométricamente representa la tangencia de la parábola con el eje $X$ en su vértice.
explicacion_simple: "![Cuando el discriminante es exactamente cero ($\\Delta = 0$), la ecuación cuadrática posee una única solución real de multiplicidad dos (raíz doble $x_1 = x_2 = -b/(2a)$), lo que geométricamente representa la tangencia de la parábola con el eje $X$ en su vértice](/static/img/nodos/interpretacion-de-discriminante-cero-como-una-solucion-real-doble-intro.svg)\n\n\nCuando calculas el discriminante y el resultado da exactamente **cero ($\\Delta = 0$)**:\n- En la fórmula general, $\\sqrt{0} = 0$, por lo que sumar o restar cero da exactamente lo mismo:\n  $$x = \\frac{-b \\pm 0}{2a} = -\\frac{b}{2a}$$\n- Ambas ramas colapsan en **una sola respuesta repetida** llamada **raíz doble** ($x_1 = x_2$).\n- **Equivalencia algebraica:** Toda ecuación con $\\Delta = 0$ viene de un **trinomio cuadrado perfecto**: $(px + q)^2 = 0$.\n- **En el gráfico:** La parábola no cruza el eje X, sino que **lo besa o toca en un solo punto (el vértice)**."
explicacion_formal: "Sea $P(x) = ax^2 + bx + c = 0$ con $a \\neq 0$. Si $\\Delta = b^2 - 4ac = 0$, se verifican las siguientes propiedades fundamentales:\n\n1. **Factorización como cuadrado perfecto**:\n   $$P(x) = a\\left(x + \\frac{b}{2a}\\right)^2 = 0$$\n2. **Solución única doble**:\n   $$x_0 = -\\frac{b}{2a} \\quad \\text{con multiplicidad algebraica } m = 2$$\n3. **Cardinalidad del conjunto solución**: $\\text{Card}(\\mathcal{S}) = 1$.\n4. **Geometría de tangencia**: La recta $y = 0$ (eje $X$) es la recta tangente a la parábola en su vértice $V\\left(-\\frac{b}{2a}, 0\\right)$."
definiciones_clave: '- **Raíz doble / Solución única**: Raíz de un polinomio con orden de multiplicidad algebraica $m = 2$.

  - **Punto de tangencia**: Punto único de contacto entre la parábola y el eje $X$ donde la curva no atraviesa el eje.'
propiedades_relaciones: '- **Ubicación del vértice**: La coordenada $y$ del vértice es estrictamente $y_v = 0$.

  - **Condición necesaria de trinomio cuadrado perfecto**: $b^2 = 4ac$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Cuando el discriminante es exactamente cero ($\Delta = 0$), la ecuación cuadrática posee una única solución real de multiplicidad dos (raíz doble $x_1 = x_2 = -b/(2a)$), lo que geométricamente representa la tangencia de la parábola con el eje $X$ en su vértice](/static/img/nodos/interpretacion-de-discriminante-cero-como-una-solucion-real-doble-ejemplos.svg)



    Analiza analítica y geométricamente la ecuación $4x^2 - 12x + 9 = 0$ utilizando el discriminante.'
  pasos:
  - 'Paso 1: Identificar coeficientes: $a = 4, b = -12, c = 9$.'
  - 'Paso 2: Calcular el discriminante: $\Delta = (-12)^2 - 4(4)(9) = 144 - 144 = 0$.'
  - 'Paso 3: Interpretar algebraicamente: $\Delta = 0$ indica una única raíz real doble.'
  - 'Paso 4: Calcular la raíz doble: $x_1 = x_2 = -\frac{-12}{2(4)} = \frac{12}{8} = \frac{3}{2}$.'
  - 'Paso 5: Comprobar la factorización: $(2x - 3)^2 = 0 \implies x = 3/2$.'
  - 'Paso 6: Interpretar geométricamente: La parábola es tangente al eje X en el punto $(3/2, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el discriminante de una ecuación cuadrática es Δ = 0, ¿cuántas soluciones reales tiene?
  choices:
  - text: Una solucion real doble (multiplicidad 2).
    is_correct: true
  - text: Cero soluciones reales.
    is_correct: false
  - text: Dos soluciones reales distintas.
    is_correct: false
  - text: Infinitas soluciones.
    is_correct: false
  explanation: La alternativa correcta es 'Una solucion real doble (multiplicidad 2).'. $\Delta = 0$ colapsa la resolvente en una única raíz $x = -b/(2a)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué punto toca al eje X la parábola $y = x^2 - 8x + 16$?
  choices:
  - text: En el punto (4, 0)
    is_correct: true
  - text: En los puntos (4, 0) y (-4, 0)
    is_correct: false
  - text: En el punto (0, 16)
    is_correct: false
  - text: No toca el eje X.
    is_correct: false
  explanation: La alternativa correcta es 'En el punto (4, 0)'. $\Delta = 64 - 64 = 0$, vértice en $(4, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar el discriminante $\Delta = b^2 - 4ac$.'
- 'Paso 2: Comprobar que $\Delta = 0$.'
- 'Paso 3: Concluir la existencia de una raíz doble con multiplicidad 2.'
- 'Paso 4: Calcular el valor numérico de la solución única mediante la fórmula reducida $x = -\frac{b}{2a}$.'
errores_correccion: '- **Error común:** Decir que $\Delta = 0$ significa que "no hay solución".

  - **Cómo corregirlo:** $\Delta = 0$ significa que **SÍ hay solución**, y es **una solución real única repetida (raíz doble)**.'
ejemplos:
- titulo: 'Ejemplo 1: Trinomio cuadrado perfecto básico'
  enunciado: Resuelve $x^2 - 6x + 9 = 0$ identificando su discriminante.
  alternativas:
  - Δ = 0, raíz doble x = 3
  - Δ = 0, sin solución
  - Δ > 0, raíces x = 3 y x = -3
  - Δ < 0, raíces complejas
  respuesta: Δ = 0, raíz doble x = 3
  solucion_pasos:
  - 'Paso 1: $\Delta = 36 - 36 = 0 \implies x = 6/2 = 3$.'
- titulo: 'Ejemplo 2: Coeficiente cuadrático no unitario'
  enunciado: En $25x^2 + 20x + 4 = 0$, ¿cuál es la solución?
  alternativas:
  - x = -2/5 (raíz doble)
  - x = 2/5 (raíz doble)
  - x = 2 y x = 5
  - Sin solución real
  respuesta: x = -2/5 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $\Delta = 400 - 400 = 0 \implies x = -20/50 = -2/5$.'
- titulo: 'Ejemplo 3: Tangencia geométrica'
  enunciado: 'La parábola $y = ax^2 + bx + c$ toca al eje X en un solo punto si y solo si:'
  alternativas:
  - b² - 4ac = 0
  - b² - 4ac > 0
  - b² - 4ac < 0
  - a = 0
  respuesta: b² - 4ac = 0
  solucion_pasos:
  - 'Paso 1: La condición de tangencia con el eje X es $\Delta = 0$.'
- titulo: 'Ejemplo 4: Parábola cóncava hacia abajo'
  enunciado: En $-x^2 + 10x - 25 = 0$, ¿cuál es la raíz?
  alternativas:
  - x = 5 (raíz doble)
  - x = -5 (raíz doble)
  - x = 5 y x = -5
  - Sin solución
  respuesta: x = 5 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $\Delta = 100 - 4(-1)(-25) = 100 - 100 = 0 \implies x = -10/(-2) = 5$.'
errores_frecuentes:
- Confundir discriminante cero con ausencia de soluciones reales.
- Olvidar que la raíz doble es x = -b/(2a).
- No reconocer la estructura de trinomio cuadrado perfecto asociada.
afirmaciones_verdaderas:
- Un discriminante igual a cero indica que la ecuación tiene una única solución real doble.
- Geométricamente, Δ = 0 representa la tangencia de la parábola con el eje horizontal X en su vértice.
al_terminar_debes_poder: '**QUÉ:** Interpretar el caso Δ = 0 como la existencia de una raíz real única de multiplicidad dos.


  **CÓMO:** Calculando la solución doble x = -b/(2a) y comprendiendo la tangencia geométrica con el eje X.


