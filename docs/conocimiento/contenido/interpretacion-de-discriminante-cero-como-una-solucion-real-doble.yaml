semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DELTA_CERO
resumen_inicial: 'Interpretación de discriminante cero como una solución real doble:
  concepto, discriminante, soluciones y modelamiento en El discriminante y la naturaleza
  de las raíces.'
explicacion_simple: Cuando el discriminante da exactamente cero, la raíz cuadrada
  que aparece en la fórmula general desaparece, y el signo $\pm$ deja de generar dos
  resultados distintos.
explicacion_formal: '### Definición formal


  Cuando $\Delta=0$, la fórmula general $x=\dfrac{-b\pm\sqrt{\Delta}}{2a}$ se reduce
  a $x=\dfrac{-b}{2a}$, pues $\sqrt{0}=0$ elimina la parte variable del $\pm$. Esta
  única solución se denomina raíz doble (multiplicidad 2).


  ### Desarrollo didáctico


  Un discriminante cero señala que la parábola asociada es tangente al eje $x$: lo
  toca en un único punto, sin cruzarlo.


  En $x^2-4x+4=0$, $\Delta=16-16=0$, por lo que hay una única solución: $x=\dfrac{4}{2}=2$
  (raíz doble).'
definiciones_clave: '- **Interpretación de discriminante cero como una solución real
  doble**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en interpretación
  de discriminante cero como una solución real doble.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando interpretación de
    discriminante cero como una solución real doble.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a interpretación de discriminante
    cero como una solución real doble.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
