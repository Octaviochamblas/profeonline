procedimiento:
- 'Paso 1: Calcula el discriminante $\Delta=b^2-4ac$.'
- 'Paso 2: Verifica que $\Delta=0$.'
- 'Paso 3: Calcula la única solución mediante $x=\dfrac{-b}{2a}$.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en interpretación de discriminante cero como una solución real doble.
ejemplos:
- titulo: Interpretación con discriminante cero
  enunciado: Sin resolver completamente, determina cuántas soluciones reales distintas
    tiene $x^2+6x+9=0$.
  solucion_pasos:
  - $\Delta=6^2-4(1)(9)=36-36=0$.
  - Tiene una única solución real (raíz doble).
- titulo: Cálculo de la raíz doble
  enunciado: Encuentra la solución de $4x^2-4x+1=0$, sabiendo que $\Delta=0$.
  solucion_pasos:
  - $a=4$, $b=-4$.
  - $x=\dfrac{-(-4)}{2(4)}=\dfrac{4}{8}=\dfrac{1}{2}$.
- titulo: ¿Una raíz doble cuenta como dos soluciones distintas?
  enunciado: ¿Una raíz doble cuenta como dos soluciones distintas?
  respuesta: 'No'
  solucion_pasos:
  - Es un único valor numérico repetido con multiplicidad 2, no dos valores diferentes.
- titulo: ¿Un discriminante igual a cero implica que la parábola es tangente al eje
    $x$?
  enunciado: ¿Un discriminante igual a cero implica que la parábola es tangente al
    eje $x$?
  respuesta: Sí
  solucion_pasos:
  - La parábola toca al eje $x$ en un único punto, sin cruzarlo, cuando $\Delta=0$.
errores_frecuentes:
- Reportar dos soluciones iguales como si fueran distintas en un contexto que pide
  contar soluciones diferentes.
- Confundir $\Delta=0$ con $\Delta<0$ (ausencia total de soluciones reales).
- Olvidar dividir por $2a$ al calcular la raíz doble.
- No verificar que efectivamente $\Delta$ sea exactamente cero antes de aplicar la
  fórmula simplificada.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando interpretación
  de discriminante cero como una solución real doble.
