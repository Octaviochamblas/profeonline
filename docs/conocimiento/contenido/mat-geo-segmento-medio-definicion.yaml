semantic_id: MAT.GEO.SEGMENTO_MEDIO.DEFINICION
resumen_inicial: 'Definición de segmento medio como segmento que une los puntos medios
  de dos lados de un triángulo: conceptos, teoremas, propiedades geométricas y cálculo
  en Elementos Secundarios del Triángulo.'
explicacion_simple: 'Además de los segmentos que parten de un vértice, hay un segmento
  notable que ni siquiera toca ningún vértice: el que une los puntos medios de dos
  lados.'
explicacion_formal: '![Segmento medio de un triángulo](/static/img/geometria/elementos-secundarios/segmento-medio-definicion.svg)


  ### Definición formal


  Si M y N son los puntos medios de los lados AB y AC de un triángulo ABC, el segmento
  MN es el segmento medio relativo al lado BC.


  ### Desarrollo didáctico


  Cada triángulo tiene tres segmentos medios, uno por cada par de lados. El segmento
  medio MN (que une los puntos medios de AB y AC) es el segmento medio relativo al
  tercer lado, BC.'
definiciones_clave: '- **Definición de segmento medio como segmento que une los puntos
  medios de dos lados de un triángulo**: Elemento o propiedad fundamental en el estudio
  de elementos secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
