semantic_id: MAT.GEO.SEGMENTO_MEDIO.MEDIDA_MITAD_TERCER_LADO
resumen_inicial: 'La longitud del segmento medio de un triángulo es exactamente igual
  a la mitad de la longitud del tercer lado al cual es paralelo: $M_c M_b = \frac{1}{2}
  BC = \frac{a}{2}$.'
explicacion_simple: '![Medida del Segmento Medio](/static/img/nodos/propiedad-de-medida-del-segmento-medio-como-mitad-del-tercer-lado-intro.svg)


  La regla más famosa del segmento medio es súper simple:


  - **Mide la mitad que la base**: Si el lado de abajo mide $20\text{ cm}$, el segmento
  medio mide exactamente $10\text{ cm}$.

  - **La base mide el doble**: Si el segmento medio mide $6\text{ cm}$, la base mide
  $12\text{ cm}$.

  - **Los tres segmentos medios**: Cada uno de los 3 segmentos medios mide la mitad
  de su lado paralelo ($\frac{a}{2}, \frac{b}{2}, \frac{c}{2}$).

  '
explicacion_formal: '### Teorema de la base media (Medida)

  La longitud de cualquier segmento medio en un triángulo es exactamente igual a la
  **mitad** de la longitud del lado al cual es paralelo:


  $$M_c M_b = \frac{1}{2} BC = \frac{a}{2} \iff BC = 2 \cdot M_c M_b$$


  ### Desglose simbólico y geométrico

  - Razón lineal $k = 1/2$: Homología directa de lados semejantes $\frac{M_c M_b}{BC}
  = \frac{1}{2}$.

  - Perímetro del triángulo medial: $\operatorname{Perímetro}(\Delta M_a M_b M_c)
  = \frac{a+b+c}{2} = \frac{1}{2} \operatorname{Perímetro}(\Delta ABC)$.


  ### Síntesis didáctica

  La regla de la mitad permite calcular longitudes basales y segmentos medios de forma
  directa duplicando o dividiendo por 2.'
definiciones_clave: '- **Teorema de la base media (Medida)**: Teorema métrico que
  establece que $M_c M_b = \frac{1}{2} BC$.

  - **Razón de escala ($k = 1/2$)**: Proporción constante entre los lados del triángulo
  medial y el triángulo original.

  - **Lados homólogos**: Lados correspondientes entre dos figuras semejantes.

  '
propiedades_relaciones: '- **Fórmulas de medida**: $M_c M_b = \frac{a}{2}$, $M_a M_c
  = \frac{b}{2}$, $M_a M_b = \frac{c}{2}$.

  - **Despeje de lados del triángulo**: $a = 2 \cdot M_c M_b$, $b = 2 \cdot M_a M_c$,
  $c = 2 \cdot M_a M_b$.

  - **Perímetro del triángulo medial**: $\text{Perímetro}(\Delta M_a M_b M_c) = \frac{a}{2}
  + \frac{b}{2} + \frac{c}{2} = \frac{1}{2}\text{Perímetro}(\Delta ABC)$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Medida](/static/img/nodos/propiedad-de-medida-del-segmento-medio-como-mitad-del-tercer-lado-ejemplos.svg)


    En un triángulo $ABC$, los tres lados miden $a = 18\text{ cm}$, $b = 24\text{
    cm}$ y $c = 20\text{ cm}$. Se trazan los tres segmentos medios formando el triángulo
    medial. Calcula las longitudes de los tres segmentos medios y el perímetro del
    triángulo medial.

    '
  pasos:
  - 'Paso 1: Aplicar la fórmula de medida para cada segmento medio: dividir cada lado
    entre 2.'
  - 'Paso 2: Calcular el segmento medio paralelo a $a$: $M_c M_b = \frac{18}{2} =
    9\text{ cm}$.'
  - 'Paso 3: Calcular el segmento medio paralelo a $b$: $M_a M_c = \frac{24}{2} =
    12\text{ cm}$.'
  - 'Paso 4: Calcular el segmento medio paralelo a $c$: $M_a M_b = \frac{20}{2} =
    10\text{ cm}$.'
  - 'Paso 5: Calcular el perímetro sumando los tres segmentos medios: $9 + 12 + 10
    = 31\text{ cm} = \frac{62}{2}\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si la base de un triángulo mide 26 cm, ¿cuánto mide el segmento medio
    paralelo a dicha base?
  choices:
  - text: $13\text{ cm}$
    is_correct: true
  - text: $26\text{ cm}$
    is_correct: false
  - text: $52\text{ cm}$
    is_correct: false
  - text: $6.5\text{ cm}$
    is_correct: false
  explanation: Mide $13\text{ cm}$, ya que el segmento medio es exactamente la mitad
    de la base ($26 / 2 = 13\text{ cm}$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un segmento medio de un triángulo mide 9 cm, ¿cuánto mide el lado del
    triángulo al cual es paralelo?
  choices:
  - text: $18\text{ cm}$
    is_correct: true
  - text: $9\text{ cm}$
    is_correct: false
  - text: $4.5\text{ cm}$
    is_correct: false
  - text: $27\text{ cm}$
    is_correct: false
  explanation: El lado mide $18\text{ cm}$, ya que es el doble de la longitud del
    segmento medio ($2 \times 9 = 18\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el lado del triángulo al cual es paralelo el segmento medio.'
- 'Paso 2: Si se conoce el lado original, dividir por 2: $\text{Segmento Medio} =
  \frac{\text{Lado}}{2}$.'
- 'Paso 3: Si se conoce el segmento medio, multiplicar por 2: $\text{Lado} = 2 \cdot
  \text{Segmento Medio}$.'
- 'Paso 4: Asignar las unidades métricas correspondientes.'
errores_correccion: Asegúrate de emparejar el segmento medio con su lado opuesto paralelo
  y no con los lados que tocan sus extremos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: El perímetro de un triángulo es $40\text{ cm}$. ¿Cuál es el perímetro
    del triángulo medial formado por sus tres segmentos medios?
  alternativas:
  - $20\text{ cm}$
  - $40\text{ cm}$
  - $10\text{ cm}$
  respuesta: $20\text{ cm}$
  solucion_pasos:
  - 'El perímetro del triángulo medial es exactamente la mitad del perímetro original:
    $40 / 2 = 20\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: En un triángulo equilátero de lado $12\text{ cm}$, ¿cuánto mide cada
    uno de sus tres segmentos medios?
  alternativas:
  - $6\text{ cm}$
  - $12\text{ cm}$
  - $3\text{ cm}$
  respuesta: $6\text{ cm}$
  solucion_pasos:
  - 'Cada segmento medio mide la mitad del lado: $12 / 2 = 6\text{ cm}$.'
- titulo: ¿El segmento medio mide la mitad de la longitud del tercer lado?
  respuesta: Sí
  solucion_pasos:
  - Sí, esa es la propiedad métrica fundamental del segmento medio.
- titulo: ¿El perímetro del triángulo medial es igual al perímetro del triángulo original?
  respuesta: 'No'
  solucion_pasos:
  - No, es exactamente la mitad ($\frac{1}{2}$) del perímetro original.
errores_frecuentes:
- Multiplicar en lugar de dividir al calcular el segmento medio desde la base.
- Dividir el lado entre 4 en lugar de entre 2.
- Asumir que el segmento medio mide lo mismo que los otros dos lados.
- Confundir el perímetro del triángulo medial (es la mitad) con el área (es la cuarta
  parte).
- Olvidar relacionar el segmento medio con su lado paralelo.
afirmaciones_verdaderas:
- La longitud del segmento medio es igual a la mitad de la longitud del tercer lado.
- El perímetro del triángulo medial es igual a la mitad del perímetro del triángulo
  original.
al_terminar_debes_poder: '**QUÉ:** Calcular longitudes de segmentos medios, lados
  del triángulo y perímetros mediales.


  **CÓMO:** Aplicando la relación métrica $M_c M_b = \frac{a}{2}$ y el factor de escala
  de perímetro $\text{Perímetro}_{\text{medial}} = \frac{1}{2}\text{Perímetro}_{\text{total}}$.


  ![Resumen de Medida](/static/img/nodos/propiedad-de-medida-del-segmento-medio-como-mitad-del-tercer-lado-resumen.svg)

  '
