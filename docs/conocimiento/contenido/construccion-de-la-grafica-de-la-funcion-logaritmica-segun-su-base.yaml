semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.GRAFICA
resumen_inicial: La construcción de la gráfica de la función logarítmica según su base sistematiza el trazado cartesiano mediante la tabulación de potencias exactas $x \in \{b^{-2}, b^{-1}, 1, b, b^2\}$, la fijación de la asíntota vertical $x = 0$ y el intercepto canónico $(1, 0)$.
explicacion_simple: "![La construcción de la gráfica de la función logarítmica según su base sistematiza el trazado cartesiano mediante la tabulación de potencias exactas $x \\in \\{b^{-2}, b^{-1}, 1, b, b^2\\}$, la fijación de la asíntota vertical $x = 0$ y el intercepto canónico $(1, 0)$](/static/img/nodos/construccion-de-la-grafica-de-la-funcion-logaritmica-segun-su-base-intro.svg)\n\n\nPara graficar cualquier función logarítmica con precisión perfecta y sin sufrir con decimales raros:\n\n**El truco de oro: Elige valores de $x$ que sean POTENCIAS DE LA BASE**:\n\n| $x$ (Potencia de $b$) | $y = \\log_b(x)$ | Punto cartesiano |\n|---|---|---|\n| $x = 1/b^2 = b^{-2}$ | $-2$ | $(1/b^2, -2)$ |\n| $x = 1/b = b^{-1}$ | $-1$ | $(1/b, -1)$ |\n| $x = 1 = b^0$ | $0$ | **$(1, 0)$ (Intercepto X)** |\n| $x = b = b^1$ | $1$ | **$(b, 1)$ (Punto clave)** |\n| $x = b^2$ | $2$ | $(b^2, 2)$ |\n\n- **Los 3 pasos del trazado:**\n  1. Dibuja la línea punteada de la **asíntota vertical en $x = 0$** (el eje $Y$).\n\
  \  2. Marca los puntos tabulados en el plano cartesiano.\n  3. Une los puntos con una curva suave y continua."
explicacion_formal: 'Sea $f: \mathbb{R}^+ \to \mathbb{R}$ dada por $f(x) = \log_b(x)$. La representación cartesiana $\operatorname{Gr}(f) = \{(x, \log_b(x)) \in \mathbb{R}^2 \mid x > 0\}$ se caracteriza por los siguientes elementos geométricos:

  1. **Asíntota vertical $\mathcal{A}_V$**: Recta $x = 0$ delimitando el semiplano $x > 0$.

  2. **Punto canónico de corte**: $P_0(1, 0)$.

  3. **Punto de escala de base**: $P_1(b, 1)$ y $P_{-1}(1/b, -1)$.

  4. **Curvatura**: Cóncava hacia abajo si $b > 1$ ($f''''(x) < 0$); convexa hacia arriba si $0 < b < 1$ ($f''''(x) > 0$).'
definiciones_clave: '- **Puntos canónicos de control**: Conjunto $\{(1/b, -1), (1, 0), (b, 1)\}$ que determina unívocamente la gráfica.

  - **Línea de referencia asintótica**: Recta vertical $x = 0$ trazada con línea segmentada.'
propiedades_relaciones: '- **Monotonía visual**: Curva ascendente de izquierda a derecha si $b > 1$; curva descendente si $0 < b < 1$.

  - **Reflexión respecto a la identidad**: Simetría con la gráfica de $y = b^x$ respecto a $y = x$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La construcción de la gráfica de la función logarítmica según su base sistematiza el trazado cartesiano mediante la tabulación de potencias exactas $x \in \{b^{-2}, b^{-1}, 1, b, b^2\}$, la fijación de la asíntota vertical $x = 0$ y el intercepto canónico $(1, 0)$](/static/img/nodos/construccion-de-la-grafica-de-la-funcion-logaritmica-segun-su-base-ejemplos.svg)



    Construye una tabla de valores y describe los pasos para graficar $f(x) = \log_2(x)$.'
  pasos:
  - 'Paso 1: Seleccionar potencias de base 2 como entradas de $x$:

    - $x = 1/4 = 2^{-2} \implies y = -2 \implies (0{,}25, -2)$.

    - $x = 1/2 = 2^{-1} \implies y = -1 \implies (0{,}5, -1)$.

    - $x = 1 = 2^0 \implies y = 0 \implies (1, 0)$.

    - $x = 2 = 2^1 \implies y = 1 \implies (2, 1)$.

    - $x = 4 = 2^2 \implies y = 2 \implies (4, 2)$.

    - $x = 8 = 2^3 \implies y = 3 \implies (8, 3)$.'
  - 'Paso 2: Trazar la asíntota vertical en la recta $x = 0$ (eje $Y$).'
  - 'Paso 3: Ubicar los puntos cartesianos en el plano.'
  - 'Paso 4: Unir los puntos con una curva suave que asciende desde $-\infty$ y crece hacia $+\infty$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los 3 puntos canónicos fundamentales para graficar $f(x) = \log_3(x)$?
  choices:
  - text: (1/3, -1), (1, 0) y (3, 1)
    is_correct: true
  - text: (0, 1), (1, 3) y (3, 9)
    is_correct: false
  - text: (-3, -1), (0, 0) y (3, 1)
    is_correct: false
  - text: (1, 0), (2, 1) y (3, 2)
    is_correct: false
  explanation: La alternativa correcta es '(1/3, -1), (1, 0) y (3, 1)'. Corresponden a evaluar $x = 3^{-1}, 3^0, 3^1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al graficar $f(x) = \log_b(x)$, ¿por qué es mejor elegir valores de x como potencias de la base en lugar de números enteros consecutivos 1, 2, 3, 4?
  choices:
  - text: Porque las potencias de la base generan valores enteros exactos en y
    is_correct: true
  - text: Porque no se pueden usar enteros en el dominio
    is_correct: false
  - text: Porque el logaritmo solo existe para potencias
    is_correct: false
  - text: Para evitar números negativos
    is_correct: false
  explanation: La alternativa correcta es 'Porque las potencias de la base generan valores enteros exactos en y'. Al elegir $x = b^k$, el resultado es simplemente el exponente entero $k$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ de la función.'
- 'Paso 2: Generar una tabla de valores eligiendo $x = b^k$ para $k \in \{-2, -1, 0, 1, 2, 3\}$.'
- 'Paso 3: Trazar en el plano cartesiano la asíntota vertical segmentada $x = 0$.'
- 'Paso 4: Marcar los puntos $(b^k, k)$ y unirlos mediante un trazo curvo continuo asintótico.'
errores_correccion: '- **Error común:** Unir los puntos con segmentos rectos poligonales en lugar de una curva suave.

  - **Cómo corregirlo:** La función logarítmica es **completamente suave y continua**: debe trazarse con **curvatura uniforme** aproximándose asintóticamente a $x = 0$.'
ejemplos:
- titulo: 'Ejemplo 1: Punto característico de base 5'
  enunciado: ¿Qué punto pertenece a la gráfica de $f(x) = \log_5(x)$?
  alternativas:
  - (5, 1)
  - (1, 5)
  - (0, 5)
  - (5, 0)
  respuesta: (5, 1)
  solucion_pasos:
  - 'Paso 1: $f(5) = \log_5(5) = 1 \implies (5, 1)$.'
- titulo: 'Ejemplo 2: Punto característico en base fraccionaria'
  enunciado: ¿Qué punto pertenece a la gráfica de $g(x) = \log_{1/2}(x)$?
  alternativas:
  - (2, -1)
  - (2, 1)
  - (1/2, -1)
  - (0, 1/2)
  respuesta: (2, -1)
  solucion_pasos:
  - 'Paso 1: $g(2) = \log_{1/2}(2) = -1 \implies (2, -1)$.'
- titulo: 'Ejemplo 3: Identificación de base desde la gráfica'
  enunciado: Si una gráfica logarítmica básica pasa por $(4, 1)$, ¿cuál es su base?
  alternativas:
  - b = 4
  - b = 2
  - b = 1/4
  - b = 16
  respuesta: b = 4
  solucion_pasos:
  - 'Paso 1: Como pasa por $(b, 1) = (4, 1)$, la base es $b = 4$.'
- titulo: 'Ejemplo 4: Punto de abscisa fraccionaria'
  enunciado: En $f(x) = \log_3(x)$, ¿cuál es el par ordenado para $x = 1/9$?
  alternativas:
  - (1/9, -2)
  - (1/9, 2)
  - (1/9, -3)
  - (9, -2)
  respuesta: (1/9, -2)
  solucion_pasos:
  - 'Paso 1: $\log_3(3^{-2}) = -2 \implies (1/9, -2)$.'
errores_frecuentes:
- Dibujar la curva cruzando hacia el semiplano negativo x < 0.
- Graficar una curva lineal recta uniendo los puntos.
- Invertir los ejes trazando la función exponencial en su lugar.
afirmaciones_verdaderas:
- La gráfica de f(x) = log_b(x) pasa siempre por los puntos canónicos (1/b, -1), (1, 0) y (b, 1).
- La curva se aproxima infinitamente al eje Y sin tocarlo ni cruzarlo jamás.
al_terminar_debes_poder: '**QUÉ:** Construir y representar con precisión la gráfica de la función logarítmica según su base.


  **CÓMO:** Tabulando puntos cartesianos exactos x = bᵏ, trazando la asíntota vertical x = 0 y el corte (1, 0).


