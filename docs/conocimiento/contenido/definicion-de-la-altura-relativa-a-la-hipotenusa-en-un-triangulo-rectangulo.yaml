semantic_id: MAT.GEO.RELACIONES_TR.ALTURA_SOBRE_HIPOTENUSA
resumen_inicial: 'La altura relativa a la hipotenusa ($h_c$) es el segmento perpendicular trazado desde el vértice del ángulo recto hacia la hipotenusa, dividiendo al triángulo rectángulo en dos subtriángulos semejantes entre sí y al triángulo original.'
explicacion_simple: |
  ![Altura sobre la Hipotenusa](/static/img/nodos/definicion-de-la-altura-relativa-a-la-hipotenusa-en-un-triangulo-rectangulo-intro.svg)

  Si apoyas un triángulo rectángulo sobre su lado más largo (hipotenusa) y dejas caer una línea recta hacia abajo desde la esquina de $90^\circ$:

  - **Esa línea es la altura sobre la hipotenusa ($h_c$)**: Cae formando una escuadra perfecta de $90^\circ$ sobre la hipotenusa.
  - **Divide el triángulo en dos**: Se forman dos triángulos rectángulos más pequeños.
  - **Son gemelos a escala (semejantes)**: Los dos triángulos pequeños tienen exactamente los mismos ángulos que el triángulo grande original, lo que permite relacionar todas sus medidas mediante el Teorema de Euclides.
explicacion_formal: |
  ### Definición y teorema formal
  En un triángulo rectángulo $\Delta ABC$ con ángulo recto en $C$ ($\gamma = 90^\circ$), la **altura relativa a la hipotenusa** es el segmento cerrado $h_c = \overline{CD}$ tal que $D \in \overline{AB}$ y $\overline{CD} \perp \overline{AB}$:

  $$h_c = \overline{CD} \quad \text{con} \quad \overleftrightarrow{CD} \perp \overleftrightarrow{AB} \quad \land \quad D \in \overline{AB}$$

  Por el criterio Ángulo-Ángulo (AA), la altura descompone al triángulo en dos subtriángulos directamente semejantes entre sí y semejantes al triángulo original:

  $$\Delta ADC \sim \Delta CDB \sim \Delta ACB$$

  ### Desglose simbólico y geométrico
  - $C$: Vértice del ángulo recto ($90^\circ$).
  - $D$: Pie de la altura sobre la hipotenusa $\overline{AB}$, que particiona a la hipotenusa en dos segmentos $AD = p$ y $DB = q$ ($p + q = c$).
  - Conservación del área euclidiana: $\operatorname{Área}(\Delta ABC) = \frac{1}{2} c \cdot h_c = \frac{1}{2} a \cdot b \implies c \cdot h_c = a \cdot b$.
  - Fórmula del producto de catetos: $h_c = \frac{a \cdot b}{c}$.

  ### Síntesis didáctica
  La altura relativa a la hipotenusa es el eje estructural del Teorema de Euclides, cuyas proporciones geométricas originan todas las relaciones métricas del triángulo rectángulo.
definiciones_clave: |
  - **Altura relativa a la hipotenusa ($h_c$)**: Segmento ortogonal trazado desde el vértice recto $C$ hacia la hipotenusa $\overline{AB}$.
  - **Pie de la altura ($D$)**: Punto de intersección perpendicular de la altura sobre la hipotenusa.
  - **Triángulos semejantes generados**: Los tres triángulos rectángulos $\Delta ADC$, $\Delta CDB$ y $\Delta ACB$ comparten sus tres ángulos interiores.
propiedades_relaciones: |
  - **Semejanza triple**: $\Delta ADC \sim \Delta CDB \sim \Delta ACB$.
  - **Relación de área**: $c \cdot h_c = a \cdot b \iff h_c = \frac{ab}{c}$.
  - **Partición ortogonal**: $D$ divide a la hipotenusa en dos proyecciones $p$ y $q$ tales que $p + q = c$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Altura sobre la Hipotenusa](/static/img/nodos/definicion-de-la-altura-relativa-a-la-hipotenusa-en-un-triangulo-rectangulo-ejemplos.svg)

    Un triángulo rectángulo tiene catetos $a = 6\text{ cm}$, $b = 8\text{ cm}$ e hipotenusa $c = 10\text{ cm}$. Calcula la longitud exacta de la altura relativa a la hipotenusa $h_c$.
  pasos:
  - 'Paso 1: Identificar los datos: catetos $a = 6\text{ cm}, b = 8\text{ cm}$ e hipotenusa $c = 10\text{ cm}$.'
  - 'Paso 2: Utilizar la relación de área $c \cdot h_c = a \cdot b$.'
  - 'Paso 3: Despejar la altura: $h_c = \frac{a \cdot b}{c}$.'
  - 'Paso 4: Sustituir los valores: $h_c = \frac{6 \times 8}{10} = \frac{48}{10} = 4{,}8\text{ cm}$.'
  - 'Paso 5: Concluir que la altura sobre la hipotenusa mide exactamente $4{,}8\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación de semejanza se cumple al trazar la altura hc sobre la hipotenusa en un triángulo rectángulo ΔABC?
  choices:
  - text: Los dos subtriángulos formados son semejantes entre sí y semejantes al triángulo original
    is_correct: true
  - text: Los subtriángulos son siempre congruentes e idénticos
    is_correct: false
  - text: La altura divide al triángulo en dos triángulos equiláteros
    is_correct: false
  - text: No existe relación de semejanza entre los subtriángulos
    is_correct: false
  explanation: 'Se cumple que Los dos subtriángulos formados son semejantes entre sí y semejantes al triángulo original ($\Delta ADC \sim \Delta CDB \sim \Delta ACB$) por el criterio de semejanza AA.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo rectángulo tiene catetos de 3 cm y 4 cm, e hipotenusa de 5 cm, ¿cuánto mide la altura relativa a la hipotenusa?
  choices:
  - text: $2{,}4\text{ cm}$
    is_correct: true
  - text: $3{,}5\text{ cm}$
    is_correct: false
  - text: $5\text{ cm}$
    is_correct: false
  - text: $1{,}2\text{ cm}$
    is_correct: false
  explanation: 'Mide $2{,}4\text{ cm}$, ya que $h_c = \frac{a \cdot b}{c} = \frac{3 \times 4}{5} = \frac{12}{5} = 2{,}4\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el vértice del ángulo recto ($90^\circ$) y la hipotenusa $c$.'
- 'Paso 2: Trazar el segmento perpendicular desde dicho vértice a la hipotenusa para obtener $h_c$.'
- 'Paso 3: Identificar los dos subtriángulos rectángulos generados y el pie de la altura $D$.'
- 'Paso 4: Utilizar la fórmula $h_c = \frac{ab}{c}$ cuando se conocen los catetos y la hipotenusa.'
errores_correccion: 'No confundas la altura sobre la hipotenusa con los catetos. Los catetos son perpendiculares entre sí, mientras que $h_c$ es perpendicular a la hipotenusa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo rectángulo de catetos $5\text{ cm}$ y $12\text{ cm}$ con hipotenusa $13\text{ cm}$, ¿cuál es la longitud de la altura sobre la hipotenusa?
  alternativas:
  - $\frac{60}{13}\text{ cm}$
  - $\frac{13}{60}\text{ cm}$
  - $6\text{ cm}$
  respuesta: $\frac{60}{13}\text{ cm}$
  solucion_pasos:
  - '$h_c = \frac{a \cdot b}{c} = \frac{5 \times 12}{13} = \frac{60}{13}\text{ cm} \approx 4{,}62\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿La altura relativa a la hipotenusa siempre cae en el interior de la hipotenusa?
  alternativas:
  - Sí, siempre cae en un punto interior del segmento hipotenusa
  - No, cae fuera del triángulo
  - Solo en triángulos equiláteros
  respuesta: Sí, siempre cae en un punto interior del segmento hipotenusa
  solucion_pasos:
  - 'En todo triángulo rectángulo, el pie de la altura sobre la hipotenusa es estrictamente interior al segmento hipotenusa.'
- titulo: ¿La fórmula hc = (a · b) / c permite calcular la altura sobre la hipotenusa?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, proviene de igualar el área calculada como base por altura: $(c \cdot h_c)/2 = (a \cdot b)/2$.'
- titulo: ¿La altura sobre la hipotenusa divide a la hipotenusa siempre en dos partes de igual medida?
  respuesta: 'No'
  solucion_pasos:
  - 'No, solo la divide en dos partes iguales si el triángulo rectángulo es isósceles ($45^\circ-45^\circ-90^\circ$). En escalenos, las partes $p$ y $q$ son desiguales.'
errores_frecuentes:
- 'Asumir que la altura sobre la hipotenusa es siempre la mitad de la hipotenusa.'
- 'Creer que el pie de la altura divide a la hipotenusa en partes iguales en cualquier triángulo.'
- 'Confundir la altura sobre la hipotenusa con la transversal de gravedad.'
- 'Olvidar dividir por la hipotenusa al usar la relación de áreas $a \cdot b / c$.'
- 'No verificar la perpendicularidad en el punto $D$.'
afirmaciones_verdaderas:
- 'La altura relativa a la hipotenusa es perpendicular a la hipotenusa y concurre en el vértice del ángulo recto.'
- 'La altura sobre la hipotenusa genera dos triángulos rectángulos semejantes al triángulo original.'
al_terminar_debes_poder: |
  **QUÉ:** Definir e identificar la altura relativa a la hipotenusa y sus propiedades de semejanza.

  **CÓMO:** Trazando el segmento ortogonal $\overline{CD} \perp \overline{AB}$ y aplicando la relación $h_c = \frac{ab}{c}$.

  ![Resumen de Altura sobre la Hipotenusa](/static/img/nodos/definicion-de-la-altura-relativa-a-la-hipotenusa-en-un-triangulo-rectangulo-resumen.svg)
