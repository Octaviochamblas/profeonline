semantic_id: MAT.ALG.RESOLUCION_LINEAL.TRANSPOSICION_TERMINOS
resumen_inicial: 'Aplicación de la regla de transposición de términos: propiedades,
  resolución y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: Aplicar formalmente la propiedad aditiva sumando y restando a
  ambos lados en cada paso es matemáticamente perfecto, pero se vuelve muy largo.
  El 'atajo' oficial se llama Transposición de Términos.
explicacion_formal: '### Definición formal


  La transposición es una abreviatura operativa de aplicar la misma operación inversa
  en ambos miembros de una ecuación. La igualdad se conserva porque ambos miembros
  se transforman de manera equivalente.


  ### Desarrollo didáctico


  Visualiza el signo $=$ como un transformación algebraica que transforma a los números
  en su ''opuesto'' operativo.


  - **Suma y Resta (Términos completos):**

  Si un término está sumando (tiene un $+$ delante), se resta la misma cantidad en
  ambos miembros ($-$):

  $x + 8 = 10 \rightarrow x = 10 \mathbf{- 8}$


  Si está restando ($-$), se suma la misma cantidad en ambos miembros ($+$):

  $y - 5 = 12 \rightarrow y = 12 \mathbf{+ 5}$


  - **Multiplicación y División (Coeficientes):**

  Si un número está multiplicando a toda la incógnita, cruza dividiendo a TODO el
  otro lado:

  $3x = 15 \rightarrow x = \frac{15}{\mathbf{3}}$


  Si está dividiendo, cruza multiplicando:

  $\frac{m}{4} = 8 \rightarrow m = 8 \cdot \mathbf{4}$


  Cuidado. Solo puedes transponer ''multiplicaciones'' o ''divisiones'' si el número
  afecta a TODO el miembro entero. Si tienes $2x + 1 = 7$, no puedes pasar el $2$
  dividiendo todavía. Primero se van los términos sumando/restando.'
definiciones_clave: '- **Aplicación de la regla de transposición de términos**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a aplicación de la regla de transposición
  de términos.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando aplicación de la
    regla de transposición de términos.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de aplicación de la regla
    de transposición de términos.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
