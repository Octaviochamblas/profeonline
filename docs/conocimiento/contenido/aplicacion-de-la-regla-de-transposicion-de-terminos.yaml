semantic_id: MAT.ALG.RESOLUCION_LINEAL.TRANSPOSICION_TERMINOS
resumen_inicial: La transposición de términos consiste en trasladar términos de un miembro a otro de la ecuación aplicando la operación inversa.
explicacion_simple: |
  La transposición de términos es la regla práctica para despejar una ecuación de forma ágil y sistemática.

  Establece que cualquier término que esté sumando en un miembro se traslada restando al miembro opuesto, y cualquier término que esté restando se traslada sumando.

  Del mismo modo, un coeficiente o factor que esté multiplicando a toda la expresión pasa dividiendo al otro miembro conservando su signo, y un divisor pasa multiplicando.
explicacion_formal: |
  ### Definición formal
  La **transposición de términos** es la regla operacional abreviada de la aplicación rigurosa de las propiedades aditiva y multiplicativa de la igualdad:

  $$A + T = B \iff A = B - T$$

  $$A \cdot K = B \iff A = \frac{B}{K} \quad (K \neq 0)$$

  ### Desglose de la fórmula
  - $+ T \implies - T$: Un sumando se traslada al miembro opuesto mediante su inverso o opuesto aditivo.
  - $\cdot K \implies \div K$: Un factor multiplicativo no nulo se traslada al miembro opuesto conservando su valor y signo.

  ### Síntesis didáctica
  La transposición permite agrupar todos los términos que contienen la incógnita en un miembro (usualmente el primero) y las constantes independientes en el segundo miembro.
definiciones_clave: |
  - **Transposición de términos**: Algoritmo para reorganizar expresiones en una ecuación aplicando operaciones inversas.
  - **Operación inversa**: Operación que deshace a otra (adición $\leftrightarrow$ sustracción, multiplicación $\leftrightarrow$ división).
propiedades_relaciones: |
  - **Conservación del signo en factores**: Al trasponer un factor multiplicativo $K \cdot x = B \implies x = \frac{B}{K}$, el signo del número $K$ no cambia.
  - **Invarianza del conjunto solución**: La transposición genera siempre una ecuación equivalente con el mismo conjunto solución $S$.
ejemplo_guiado:
  enunciado: 'Aplica la regla de transposición de términos para despejar $x$ en la ecuación $4x - 9 = 15$ y evalúa la solución.'
  pasos:
    - 'Paso 1: Identificar el término $-9$ que resta en el primer miembro y trasponerlo sumando al segundo miembro: $4x = 15 + 9$.'
    - 'Paso 2: Calcular la suma constante en el segundo miembro: $4x = 24$.'
    - 'Paso 3: Trasponer el coeficiente $4$ que multiplica a $x$ dividiendo al segundo miembro: $x = \frac{24}{4}$.'
    - 'Paso 4: Obtener la solución final: $x = 6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el paso de transposición correcto para el término $-9$ en la ecuación $4x - 9 = 15$?'
    choices:
      - {text: 'Trasponerlo sumando como $+9$ al segundo miembro: $4x = 15 + 9$.', is_correct: true}
      - {text: 'Trasponerlo restando como $-9$ al segundo miembro: $4x = 15 - 9$.', is_correct: false}
      - {text: 'Trasponerlo dividiendo como $\frac{15}{9}$.', is_correct: false}
      - {text: 'Multiplicarlo por $15$ en el primer miembro.', is_correct: false}
    explanation: 'La alternativa correcta es ''Trasponerlo sumando como $+9$ al segundo miembro: $4x = 15 + 9$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al completar la transposición de términos en la ecuación $4x - 9 = 15$, ¿cuál es la solución obtenida para $x$?'
    choices:
      - {text: '$x = 6$', is_correct: true}
      - {text: '$x = 4$', is_correct: false}
      - {text: '$x = 24$', is_correct: false}
      - {text: '$x = 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 6$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar en la ecuación los términos con incógnita y los términos independientes.'
  - 'Paso 2: Trasponer los términos independientes al segundo miembro invirtiendo su signo aditivo.'
  - 'Paso 3: Trasponer los términos con incógnita al primer miembro invirtiendo su signo aditivo.'
  - 'Paso 4: Reducir los términos semejantes en ambos miembros.'
  - 'Paso 5: Trasponer el coeficiente multiplicativo de la incógnita dividiendo al segundo miembro con su mismo signo.'
errores_correccion: |
  - **Error 1:** Cambiar de signo al coeficiente multiplicativo al trasponerlo dividiendo (ejemplo: trasponer $-3x = 12$ como $x = \frac{12}{+3}$). **Cómo corregirlo:** Al trasponer un factor multiplicativo, **EL SIGNO DEL NÚMERO NO CAMBIA; PASA DIVIDIENDO CONSERVANDO SU SIGNO ORIGINAL ($x = \frac{12}{-3} = -4$)**.
  - **Error 2:** Trasponer un término sumando sin invertir su signo al pasar al otro miembro. **Cómo corregirlo:** Todo término sumando o restando **CAMBIA AL SIGNO OPUESTO AL CRUZAR LA IGUALDAD ($+T \implies -T$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el primer paso de transposición para resolver $3x + 8 = 23$?'
    alternativas:
      - 'Trasponer $+8$ restando: $3x = 23 - 8$'
      - 'Trasponer $+8$ sumando: $3x = 23 + 8$'
      - 'Trasponer $3$ dividiendo: $x + 8 = \frac{23}{3}$'
    respuesta: 'Trasponer $+8$ restando: $3x = 23 - 8$'
    solucion_pasos:
      - '1. Opuesto aditivo de $+8$ es $-8$.'
      - '2. $3x = 23 - 8 = 15$.'
      - '3. $x = \frac{15}{3} = 5$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al despejar $-5x = 20$, ¿cuál es el resultado de la transposición del coeficiente?'
    alternativas:
      - '$x = \frac{20}{-5} = -4$'
      - '$x = \frac{20}{5} = 4$'
      - '$x = 20 + 5 = 25$'
    respuesta: '$x = \frac{20}{-5} = -4$'
    solucion_pasos:
      - '1. Trasponer el coeficiente $-5$ dividiendo con su signo.'
      - '2. $x = \frac{20}{-5} = -4$.'
  - titulo: 'Inversión de adición'
    enunciado: '¿Un término que suma en el primer miembro pasa restando al segundo miembro?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la regla de transposición basada en el opuesto aditivo.'
  - titulo: 'Signo en la división'
    enunciado: '¿Un coeficiente multiplicativo negativo cambia a positivo al pasar dividiendo?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la división conserva el signo original del divisor.'
errores_frecuentes:
  - 'Trasponer un término sumando sin invertir su signo al pasar al otro miembro.'
  - 'Invertir el signo de un coeficiente multiplicativo al pasar dividiendo.'
  - 'Trasponer un sumando dividiendo en lugar de restar.'
  - 'Cambiar de signo a un término que se mantiene en el mismo miembro sin haber cruzado la igualdad.'
  - 'Omitir la división del coeficiente principal tras reducir los términos de la ecuación.'
afirmaciones_verdaderas:
  - 'La transposición de términos traslada sumandos al miembro opuesto aplicando su opuesto aditivo.'
  - 'El coeficiente multiplicativo pasa dividiendo al miembro opuesto conservando su signo.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones lineales de primer grado mediante la regla de transposición de términos.
  CÓMO: Reorganizar sumandos y factores aplicando las operaciones inversas correspondientes hasta despejar la incógnita.
