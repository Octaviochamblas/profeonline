semantic_id: MAT.ALG.RESOLUCION_LINEAL.TRANSPOSICION_TERMINOS
resumen_inicial: La transposición de términos consiste en trasladar términos de un
  miembro a otro de la ecuación aplicando la operación inversa.
explicacion_simple: 'La transposición de términos es la regla práctica para despejar
  una ecuación de forma ágil.

  Establece que cualquier término que esté sumando en un lado pasa restando al otro
  lado, y cualquier término que esté restando pasa sumando.

  Del mismo modo, un factor que esté multiplicando pasa dividiendo, y un divisor pasa
  multiplicando.'
explicacion_formal: 'La **transposición de términos** es la simplificación directa
  de aplicar las propiedades aditiva y multiplicativa de la igualdad:


  $$A + T = B \iff A = B - T$$

  $$A \cdot K = B \iff A = \frac{B}{K} \quad (K \neq 0)$$


  **Desglose de la fórmula:**

  - $+ T \implies - T$: Un término sumando se traslada como su opuesto aditivo en
  el otro miembro.

  - $\cdot K \implies \div K$: Un factor multiplicativo no nulo se traslada como divisor
  en el otro miembro.'
definiciones_clave: '- **Transposición de términos**: Regla operativa para mover sumandos
  o factores entre miembros cambiando su operación.

  - **Operación inversa**: Operación matemática contraria (suma $\leftrightarrow$
  resta, multiplicación $\leftrightarrow$ división).'
propiedades_relaciones: '- **Agrupación de la incógnita**: Se reúnen todos los términos
  con la incógnita $x$ en el primer miembro y todos los términos constantes independientes
  en el segundo miembro.'
ejemplo_guiado:
  enunciado: Aplica la regla de transposición de términos para despejar $x$ en la
    ecuación $4x - 9 = 15$ y evalúa la solución.
  pasos:
  - 'Paso 1: Identificar el término $-9$ que resta en el primer miembro y trasponerlo
    sumando al segundo miembro: $4x = 15 + 9$.Paso 2: Sumar la constante en el segundo
    miembro: $4x = 24$.Paso 3: Trasponer el coeficiente $4$ que multiplica a $x$ dividiendo
    al segundo miembro: $x = \frac{24}{4}$.Paso 4: Obtener la solución final: $x =
    6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de transposición correcta para el término $-9$ en la
    ecuación $4x - 9 = 15$?
  choices:
  - text: 'Pasa sumando como $+9$ al segundo miembro: $4x = 15 + 9$.'
    is_correct: true
  - text: 'Pasa restando como $-9$ al segundo miembro: $4x = 15 - 9$.'
    is_correct: false
  - text: Pasa dividiendo como $\frac{15}{9}$.
    is_correct: false
  - text: Se multiplica por $15$ en el primer miembro.
    is_correct: false
  explanation: 'La alternativa correcta es ''Pasa sumando como $+9$ al segundo miembro:
    $4x = 15 + 9$.''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al completar la transposición de términos en $4x - 9 = 15$, ¿cuál es el
    valor de $x$?
  choices:
  - text: $x = 6$
    is_correct: true
  - text: $x = 4$
    is_correct: false
  - text: $x = 24$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los términos que contienen la incógnita y los términos independientes.'
- 'Paso 2: Trasponer los términos independientes al segundo miembro cambiando su signo.'
- 'Paso 3: Trasponer los términos con la incógnita al primer miembro cambiando su
  signo.'
- 'Paso 4: Reducir términos en ambos miembros.'
- 'Paso 5: Trasponer el coeficiente de la incógnita dividiendo al segundo miembro.'
errores_correccion: '- **Error común:** Trasponer un número que está multiplicando
  y cambiarle también el signo menos (ejemplo: si $-3x = 12$, trasponer $x = \frac{12}{+3}$).

  - **Cómo corregirlo:** Al trasponer un factor multiplicativo, el signo del número
  NO cambia. Pasa dividiendo conservando su signo: $x = \frac{12}{-3} = -4$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
