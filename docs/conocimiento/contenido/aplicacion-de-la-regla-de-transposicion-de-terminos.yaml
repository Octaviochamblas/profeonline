procedimiento:
- 'Paso 1: Identifica tu objetivo: dejar a la incógnita completamente sola.'
- 'Paso 2: Localiza los términos que acompañan a la incógnita sumando o restando y
  pásalos al otro miembro con el signo contrario.'
- 'Paso 3: Si queda un coeficiente multiplicando a la incógnita (ej: 4x), pásalo dividiendo
  a TODO el otro miembro.'
- 'Paso 4: Realiza las operaciones aritméticas en el miembro de los números para hallar
  la respuesta final.'
- 'Esta es la regla esencial de la transposición: suma a resta, multiplicación a división,
  etc.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en aplicación de la regla de transposición de términos.
ejemplos:
- titulo: 'Resuelve usando transposición: $2x - 5 = 11$'
  enunciado: 'Resuelve usando transposición: $2x - 5 = 11$'
  solucion_pasos:
  - 'Paso 1: Mueve el término -5 al lado derecho como +5.'
  - $2x = 11 + 5$
  - $2x = 16$
  - 'Paso 2: El 2 está multiplicando, pasa al lado derecho dividiendo.'
  - $x = 16 / 2$
  - $x = 8$
- titulo: 'Despeja la ''a'' en: $\frac{a}{3} + 4 = 10$'
  solucion_pasos:
  - 'El +4 pasa como -4: a/3 = 10 - 4 -> a/3 = 6.'
  - 'El 3 que divide pasa multiplicando: a = 6 * 3 = 18.'
- titulo: 'Respecto de «Aplicación de la regla de transposición de términos»: ¿Se
    ajusta a la definició'
  enunciado: 'Respecto de «Aplicación de la regla de transposición de términos»: ¿Se
    ajusta a la definición esta afirmación? «La transposición es una regla práctica
    que indica: cualquier término puede ''saltar'' al otro lado del signo igual, siempre
    y cuando cambie a su operación matemática inversa (suma a resta, multiplicación
    a división, etc.)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La transposición es una regla
    práctica que indica: cualquier término puede ''saltar'' al otro lado del signo
    igual, siempre y cuando cambie a su operación matemática inversa (suma a resta,
    multiplicación a división, etc.).'
- titulo: 'Respecto de «Aplicación de la regla de transposición de términos»: ¿Es
    compatible con el pro'
  enunciado: 'Respecto de «Aplicación de la regla de transposición de términos»: ¿Es
    compatible con el procedimiento esta afirmación? «Pasar un número multiplicando
    o dividiendo ANTES de haber movido las sumas y restas libres»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La transposición es una regla
    práctica que indica: cualquier término puede ''saltar'' al otro lado del signo
    igual, siempre y cuando cambie a su operación matemática inversa (suma a resta,
    multiplicación a división, etc.).'
errores_frecuentes:
- Pasar un número multiplicando o dividiendo ANTES de haber movido las sumas y restas
  libres.
- 'Pasar un número negativo que está multiplicando (ej: $-3x = 12$) como $+3$ al otro
  lado. ¡El $-3$ entero pasa dividiendo! La operación principal es multiplicar, no
  restar.'
- Cambia su signo a positivo sin importar cuál tenía.
- Se convierte en fracción.
- Se le suma un uno automáticamente.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando aplicación
  de la regla de transposición de términos.
