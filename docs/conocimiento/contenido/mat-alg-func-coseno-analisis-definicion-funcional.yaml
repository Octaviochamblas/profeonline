semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.DEFINICION_FUNCIONAL
resumen_inicial: 'Definición de la función coseno como relación entre ángulo y coordenada
  x: círculo unitario, amplitud, período y transformaciones de Análisis de la función
  coseno.'
explicacion_simple: Igual que con el seno, el coseno se convierte en función tratando
  su argumento como cualquier número real, no solo como un ángulo entre $0°$ y $360°$.
explicacion_formal: '### Definición formal


  $f:\mathbb{R}\to\mathbb{R}$, $f(x)=\cos(x)$, donde $x$ se interpreta como la medida
  en radianes de un ángulo en posición estándar, y $f(x)$ es la coordenada $x$ del
  punto donde el lado terminal corta al círculo unitario.


  ### Desarrollo didáctico


  $f(0)=\cos(0)=1$; $f(\pi/2)=\cos(\pi/2)=0$; $f(\pi)=\cos(\pi)=-1$. A diferencia
  del seno, que comienza en $0$, el coseno comienza en su valor máximo.'
definiciones_clave: '- **Definición de la función coseno como relación entre ángulo
  y coordenada x**: Función periódica fundamentada en las coordenadas del círculo
  unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a definición de la función coseno como relación entre ángulo y coordenada
  x.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    definición de la función coseno como relación entre ángulo y coordenada x.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de definición de la función coseno como relación entre
    ángulo y coordenada x.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
