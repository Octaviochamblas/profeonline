semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.DEFINICION_FUNCIONAL
resumen_inicial: 'Definición de la función coseno $f(x) = \cos(x)$ como la relación funcional que asigna a cada ángulo real $x$ la abscisa $x$ del círculo unitario.'
explicacion_simple: |
  Imagina que observas la distancia horizontal desde el centro del círculo unitario a medida que el ángulo abre. La función coseno, escrita como $f(x) = \cos(x)$, toma la medida del ángulo $x$ en radianes y entrega la posición horizontal del punto sobre la circunferencia unitaria. Cuando el ángulo es $0$, la posición horizontal es máxima ($1$). Al avanzar los ángulos, la función disminuye, pasa por cero en $\frac{\pi}{2}$, cae a $-1$ en $\pi$ y vuelve a subir en una onda perfecta continua.
explicacion_formal: |
  ### Definición formal
  La **función coseno fundamental** es la función real de variable real $f: \mathbb{R} \to [-1, 1]$ definida por:
  $$f(x) = \cos(x)$$
  donde a cada número real $x \in \mathbb{R}$ (que representa la medida de un ángulo en radianes en posición estándar) le asigna la abscisa $x_{\text{cart}}$ del punto intersección $P(x_{\text{cart}}, y_{\text{cart}})$ entre el lado terminal del ángulo y la circunferencia unitaria $\mathcal{C}: x^2 + y^2 = 1$.

  ### Desglose simbólico
  - $x \in \mathbb{R}$: Variable independiente que representa la apertura del ángulo medida en radianes.
  - $y = f(x) = \cos(x)$: Variable dependiente que representa la proyección horizontal del punto sobre la circunferencia unitaria.
  - Dominio: $\operatorname{Dom}(f) = \mathbb{R} = (-\infty, \infty)$.
  - Recorrido: $\operatorname{Rec}(f) = [-1, 1]$.

  ### Síntesis didáctica
  La función coseno es una traslación horizontal de la función seno (desfasada en $\frac{\pi}{2}$ radianes). Al inicio del movimiento ($x = 0$), el coseno comienza en su valor máximo positivo $y = 1$, a diferencia del seno que inicia en el origen $(0,0)$.
definiciones_clave: |
  - **Función coseno ($f(x) = \cos x$)**: Relación funcional real que asigna a cada ángulo $x$ en radianes su proyección horizontal en el círculo unitario.
  - **Onda cosenoidal**: Curva suave periódica idéntica en forma a la sinusoide pero desfasada en $\frac{\pi}{2}$ radianes.
  - **Variable angular $x$**: Argumento real de la función trigonométrica expresado en radianes.
propiedades_relaciones: |
  - **Relación de desfase con el seno**: Para todo $x \in \mathbb{R}$, se verifica la identidad $\cos(x) = \sin\left(x + \frac{\pi}{2}\right)$.
  - **Continuidad universal**: La función $f(x) = \cos(x)$ es continua y derivable en todo su dominio $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Evalúa la función coseno $f(x) = \cos(x)$ en el valor $x = \frac{2\pi}{3}$ y determina la abscisa correspondiente en el círculo unitario.'
  pasos:
    - 'Paso 1: Identificar el argumento angular dado en radianes: $x = \frac{2\pi}{3}$ (equivalente a $120^\circ$).'
    - 'Paso 2: Determinar el ángulo de referencia en el segundo cuadrante: $x_r = \pi - \frac{2\pi}{3} = \frac{\pi}{3}$ (equivalente a $60^\circ$).'
    - 'Paso 3: Evaluar el valor del coseno para el ángulo de referencia: $\cos\left(\frac{\pi}{3}\right) = \frac{1}{2}$.'
    - 'Paso 4: Asignar el signo del segundo cuadrante (en II C las abscisas son negativas, $x_{\text{cart}} < 0$): $f\left(\frac{2\pi}{3}\right) = \cos\left(\frac{2\pi}{3}\right) = -\frac{1}{2}$. El valor en la gráfica es $y = -0.5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué representa la variable independiente $x$ en la función coseno real $f(x) = \cos(x)$?'
    choices:
      - {text: 'La medida del ángulo en radianes en el plano cartesiano', is_correct: true}
      - {text: 'La ordenada vertical del punto en el círculo unitario', is_correct: false}
      - {text: 'El área encerrada por el círculo de radio 1', is_correct: false}
      - {text: 'La tangente del ángulo en posición estándar', is_correct: false}
    explanation: 'La alternativa correcta es ''La medida del ángulo en radianes en el plano cartesiano''. En la función $f(x) = \cos(x)$, $x$ es el argumento angular real.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se evalúa la función coseno en $x = 0$, ¿cuál es el valor resultante $f(0)$?'
    choices:
      - {text: '$1$', is_correct: true}
      - {text: '$0$', is_correct: false}
      - {text: '$-1$', is_correct: false}
      - {text: '$\frac{\sqrt{2}}{2}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$1$''. En $x = 0$, el punto del círculo unitario es $(1,0)$, por lo que $\cos(0) = 1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar el valor del ángulo $x$ expresado en radianes.'
  - 'Paso 2: Ubicar el punto $P(x_{\text{cart}}, y_{\text{cart}}) = (\cos x, \sin x)$ sobre la circunferencia unitaria.'
  - 'Paso 3: Extraer la abscisa horizontal $x_{\text{cart}}$ del punto $P$.'
  - 'Paso 4: Asignar $f(x) = x_{\text{cart}}$ como el valor resultante de la función coseno.'
errores_correccion: |
  - **Error 1:** Confundir la función coseno $f(x) = \cos(x)$ con la ordenada vertical $y$ del círculo unitario. **Cómo corregirlo:** La función coseno asigna la proyección horizontal como respuesta. La proyección vertical corresponde a la función seno.
  - **Error 2:** Creer que la función coseno inicia en el origen $(0,0)$ como la función seno. **Cómo corregirlo:** En $x = 0$, el coseno alcanza su valor máximo $+1$, por lo que interseca al eje Y en el punto $(0,1)$.
ejemplos:
  - titulo: 'Evaluación del coseno en pi'
    enunciado: '¿Cuál es el valor de $f(\pi)$ para la función $f(x) = \cos(x)$?'
    alternativas:
      - '$-1$'
      - '$0$'
      - '$1$'
    respuesta: '$-1$'
    solucion_pasos:
      - '1. En $x = \pi$ ($180^\circ$), el punto del círculo unitario es $(-1,0)$.'
      - '2. La abscisa es $x_{\text{cart}} = -1 \implies f(\pi) = -1$.'
  - titulo: 'Evaluación del coseno en pi medios'
    enunciado: '¿Cuánto vale $f\left(\frac{\pi}{2}\right)$ para $f(x) = \cos(x)$?'
    alternativas:
      - '$0$'
      - '$1$'
      - '$-1$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. En $x = \frac{\pi}{2}$ ($90^\circ$), el punto es $(0,1)$.'
      - '2. La abscisa es $x_{\text{cart}} = 0 \implies f\left(\frac{\pi}{2}\right) = 0$.'
  - titulo: 'Coseno de dos pi'
    enunciado: '¿El valor de $f(2\pi)$ en la función coseno es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al completar $2\pi$ radianes la abscisa retorna al valor máximo $y = 1$.'
  - titulo: 'Acotación del coseno base'
    enunciado: '¿Es imposible que la función $f(x) = \cos(x)$ devuelva el valor $-1.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el recorrido del coseno base está acotado estrictamente en el intervalo $[-1, 1]$.'
errores_frecuentes:
  - 'La afirmación de que la función coseno $f(x) = \cos(x)$ asigna la ordenada vertical $y$ como resultado.'
  - 'La afirmación de que la gráfica de la función coseno pasa por el origen $(0,0)$.'
  - 'La afirmación de que el coseno de $0$ radianes es igual a cero.'
  - 'La afirmación de que la función coseno se interrumpe en los ángulos cuadrantales.'
  - 'La afirmación de que el coseno de un ángulo real carece de representación en el plano cartesiano.'
afirmaciones_verdaderas:
  - 'La función coseno $f(x) = \cos(x)$ asigna a cada número real $x$ la abscisa horizontal del punto correspondiente en el círculo unitario.'
  - 'La gráfica de la función coseno interseca al eje vertical Y en el punto $(0,1)$ y es una traslación horizontal de la sinusoide.'
al_terminar_debes_poder: |
  QUÉ: Definir e interpretar la función coseno $f(x) = \cos(x)$ como relación funcional real.
  CÓMO: Asociar la variable $x$ al ángulo en radianes y el valor $f(x)$ a la abscisa cartesiana del círculo unitario.
