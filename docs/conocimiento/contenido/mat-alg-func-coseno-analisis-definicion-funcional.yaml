procedimiento:
- 'Paso 1: Interpreta el valor de $x$ como una medida angular en radianes.'
- 'Paso 2: Ubica el punto correspondiente en el círculo unitario.'
- 'Paso 3: Lee la coordenada $x$ de ese punto como el valor de $f(x)$.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en definición de la función
  coseno como relación entre ángulo y coordenada x.
ejemplos:
- titulo: Evaluación de la función coseno en un valor simple
  enunciado: Evalúa $f(x)=\cos(x)$ en $x=\pi$.
  solucion_pasos:
  - Se interpreta $\pi$ como un ángulo de $180°$.
  - Se obtiene $f(\pi)=-1$.
- titulo: Evaluación de la función coseno en cero
  enunciado: Evalúa $f(x)=\cos(x)$ en $x=0$.
  solucion_pasos:
  - El punto asociado a $0$ radianes es $(1,0)$.
  - Se obtiene $f(0)=1$.
- titulo: ¿El coseno, como el seno, se interpreta habitualmente en radianes en el
    análisis funcional?
  enunciado: ¿En el análisis funcional de $f(x)=\cos(x)$, el argumento $x$ se interpreta
    habitualmente en radianes?
  respuesta: Sí
  solucion_pasos:
  - Es la convención estándar al tratar el coseno como función de variable real.
- titulo: ¿La función coseno está definida para cualquier número real?
  enunciado: ¿La función $f(x)=\cos(x)$ está definida para cualquier valor real de
    $x$?
  respuesta: Sí
  solucion_pasos:
  - Todo número real puede interpretarse como una medida angular en radianes.
errores_frecuentes:
- Declarar grados con radianes al evaluar la función.
- Suponer que el coseno comienza en $0$, confundiéndolo con el seno.
- No relacionar el valor de $f(x)$ con la coordenada $x$ del círculo unitario.
- Omitir que $x$ puede tomar valores negativos o mayores que $2\pi$.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  definición de la función coseno como relación entre ángulo y coordenada x.
