semantic_id: MAT.NUM.ENTEROS_OPERATORIA.PAPOMUDAS_ORDEN
resumen_inicial: "PAPOMUDAS fija el orden para resolver operaciones combinadas: Paréntesis, Potencias, Multiplicación/División (izq. a der.), Adición/Sustracción (izq. a der.)."
explicacion_simple: |
  Si armas un mueble sin seguir el orden de las instrucciones, ¡puede quedar cojo! En
  matemáticas pasa lo mismo al combinar sumas, restas, multiplicaciones, divisiones y
  paréntesis: necesitamos un orden para que todos lleguemos al mismo resultado. Ese orden
  se recuerda con PAPOMUDAS: PArale-ntesis, POtencias, MUltiplicación, División, Adición,
  Sustracción.
explicacion_formal: |
  El orden de prioridad es: 1) Paréntesis (del más interno al más externo), 2) Potencias,
  3) Multiplicación y División —misma prioridad, se resuelven de izquierda a derecha—,
  4) Adición y Sustracción —misma prioridad, de izquierda a derecha—. El orden de las
  letras en "PAPOMUDAS" no implica que la multiplicación siempre vaya antes que la
  división: ambas tienen igual jerarquía.
definiciones_clave: |
  **PAPOMUDAS**: acrónimo para el orden de prioridad de operaciones. **Prioridad igual**:
  multiplicación/división entre sí, y adición/sustracción entre sí, se resuelven en el
  orden en que aparecen (izquierda a derecha), no por tipo de operación.
propiedades_relaciones: |
  Multiplicación y división NO se resuelven "primero todas las multiplicaciones y luego
  todas las divisiones"; se resuelven en el orden de aparición. Lo mismo aplica para suma
  y resta.
ejemplo_guiado:
  enunciado: "Resuelve $20 \\div (-4) \\cdot 3$."
  pasos:
    - "División y multiplicación tienen igual prioridad: se resuelven de izquierda a derecha."
    - "Primero la división: $20\\div(-4)=-5$."
    - "Luego la multiplicación: $-5\\cdot3=-15$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Es correcto resolver siempre todas las multiplicaciones antes que las divisiones?"
    choices:
      - {text: "Sí, siempre", is_correct: false}
      - {text: "No, tienen igual prioridad y se resuelven de izquierda a derecha", is_correct: true}
      - {text: "No, la división siempre va primero", is_correct: false}
      - {text: "Depende del signo de los números", is_correct: false}
    explanation: "La correcta es No, tienen igual prioridad y se resuelven de izquierda a derecha: el orden de las letras en PAPOMUDAS no indica prioridad entre ellas."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $18 \\div (-3) \\cdot 2$?"
    choices:
      - {text: "$-12$", is_correct: true}
      - {text: "$12$", is_correct: false}
      - {text: "$-3$", is_correct: false}
      - {text: "$3$", is_correct: false}
    explanation: "La correcta es $-12$: primero $18\\div(-3)=-6$, luego $-6\\cdot2=-12$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Examina la expresión y resuelve primero las operaciones dentro de los paréntesis (PA).'
  - 'Paso 2: Resuelve las potencias (PO) presentes.'
  - 'Paso 3: Identifica las multiplicaciones y divisiones (MU-D) y resuélvelas en el orden en que aparecen de izquierda a derecha.'
  - 'Paso 4: Identifica las sumas y restas (A-S) y resuélvelas de izquierda a derecha.'
errores_correccion: |
  Un error frecuente es resolver todas las multiplicaciones antes que todas las
  divisiones (o viceversa) por el orden de las letras del acrónimo; en realidad tienen
  igual prioridad y van en orden de aparición. Otro error es resolver de izquierda a
  derecha ignorando por completo la jerarquía.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Resuelve la operación combinada: $5 + (-3) \cdot 4 - 12 \div (-6)$'
    alternativas:
      - "$-5$"
      - "$5$"
      - "$-9$"
    respuesta: "$-5$"
    solucion_pasos:
      - 'Paso a: Buscamos paréntesis con operaciones dentro. No hay (los paréntesis solo protegen los signos negativos).'
      - 'Paso b: Resolvemos multiplicaciones y divisiones de izquierda a derecha. Primero la multiplicación: $(-3) \cdot 4 = -12$. La expresión queda: $5 + (-12) - 12 \div (-6)$.'
      - 'Paso c: Resolvemos la división: $12 \div (-6) = -2$. La expresión queda: $5 + (-12) - (-2)$.'
      - 'Paso d: Resolvemos sumas y restas de izquierda a derecha: $5 - 12 = -7$. Luego $-7 - (-2) = -7 + 2 = -5$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la expresión: $24 \div (-4) \cdot 2$'
    alternativas:
      - "$-12$"
      - "$12$"
      - "$-3$"
    respuesta: "$-12$"
    solucion_pasos:
      - 'Paso a: Identificamos que la división y la multiplicación tienen la misma prioridad.'
      - 'Paso b: Resolvemos estrictamente de izquierda a derecha, comenzando con la división: $24 \div (-4) = -6$.'
      - 'Paso c: Multiplicamos el resultado por 2: $-6 \cdot 2 = -12$.'
  - titulo: '¿Da el mismo resultado resolver $(8 + 2) \cdot 3$ que $8 + 2 \cdot 3$?'
    respuesta: 'No'
    solucion_pasos:
      - 'En $(8 + 2) \cdot 3$, el paréntesis tiene prioridad: $10 \cdot 3 = 30$.'
      - 'En $8 + 2 \cdot 3$, la multiplicación tiene prioridad: $8 + 6 = 14$.'
      - 'Los resultados son distintos ($30$ y $14$), lo que resalta la importancia de la jerarquía.'
  - titulo: '¿Es correcto resolver siempre las multiplicaciones antes que las divisiones?'
    respuesta: 'No'
    solucion_pasos:
      - 'La multiplicación y la división tienen exactamente el mismo nivel de prioridad.'
      - 'Deben resolverse en el orden en que aparecen de izquierda a derecha.'
errores_frecuentes:
  - 'Resolver las operaciones en el orden físico de lectura (de izquierda a derecha) sin respetar las prioridades (ej: en $2 + 3 \cdot 4$, calcular primero $2 + 3 = 5$ y luego $5 \cdot 4 = 20$).'
  - 'Realizar siempre las multiplicaciones antes que las divisiones por el orden de las letras en PAPOMUDAS.'
  - 'Ignorar la prioridad de los paréntesis y resolver primero lo que está fuera.'
  - 'Aplicar mal las reglas de signos al juntar los resultados intermedios.'
  - 'Olvidar resolver de izquierda a derecha cuando quedan operaciones del mismo nivel (como restas consecutivas).'
al_terminar_debes_poder: |
  Resolver operaciones combinadas de enteros respetando estrictamente la jerarquía
  PAPOMUDAS, incluyendo el orden de izquierda a derecha entre operaciones de igual
  prioridad.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 50"
estado: publicado
