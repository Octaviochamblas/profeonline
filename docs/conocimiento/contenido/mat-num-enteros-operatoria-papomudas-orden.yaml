semantic_id: MAT.NUM.ENTEROS_OPERATORIA.PAPOMUDAS_ORDEN
resumen_inicial: 'La prioridad de operaciones sigue el orden PAPOMUDAS: Paréntesis,
  Potencias, Multiplicación/División y Adición/Sustracción.'
explicacion_simple: 'Cuando en una misma expresión aparecen varias operaciones combinadas,
  existe una jerarquía estricta que debemos respetar para obtener el resultado correcto.
  El acrónimo PAPOMUDAS nos recuerda el orden obligatorio: primero los paréntesis,
  luego las potencias, después las multiplicaciones y divisiones (de izquierda a derecha),
  y finalmente las sumas y restas.'
explicacion_formal: 'La **Jerarquía de Operaciones Combinadas** establece el orden
  de evaluación unívoco sobre el árbol de sintaxis de una expresión $E$:


  $$\text{Orden Estricto: } \text{Paréntesis} \to \text{Potencias} \to \text{Multiplicación
  / División} \to \text{Adición / Sustracción}$$


  **Desglose de la fórmula:**

  - $\text{Paréntesis (PA)}$: Bloques delimitados $(), [], \{\}$ resueltos prioritariamente
  desde el nivel más interno.

  - $\text{Potencias (PO)}$: Evaluación de exponentes sobre sus bases correspondientes.

  - $\text{Multiplicación / División (MU - D)}$: Operadores de igual jerarquía ejecutados
  en orden de aparición de izquierda a derecha.

  - $\text{Adición / Sustracción (A - S)}$: Operadores finales de menor jerarquía
  ejecutados de izquierda a derecha.


  > **Complemento didáctico:** En $5 + 3 \cdot 4$, se multiplica primero $3 \cdot
  4 = 12$ y luego se suma $5 + 12 = 17$ (calcular $5+3=8$ y luego $8 \cdot 4=32$ es
  un error grave).'
definiciones_clave: '- **PAPOMUDAS**: Acrónimo mnemotécnico que fija la jerarquía
  operativa en expresiones combinadas.

  - **Igual jerarquía**: Multiplicación y división comparten nivel y se resuelven
  en orden de lectura (izquierda a derecha).'
propiedades_relaciones: '- **Lectura de izquierda a derecha**: En operadores de idéntica
  jerarquía ($a : b \cdot c$), se resuelve la primera operación que aparece.'
ejemplo_guiado:
  enunciado: 'Calcule la expresión combinada $10 - 2 \cdot (8 - 3)^2 : 5$ aplicando
    PAPOMUDAS.'
  pasos:
  - 'Paso 1: Paréntesis: $(8 - 3) = 5$. La expresión queda $10 - 2 \cdot 5^2 : 5$.'
  - 'Paso 2: Potencia: $5^2 = 25$. La expresión queda $10 - 2 \cdot 25 : 5$.'
  - 'Paso 3: Multiplicación y División de izquierda a derecha: $2 \cdot 25 = 50$,
    luego $50 : 5 = 10$. La expresión queda $10 - 10$.'
  - 'Paso 4: Adición y Sustracción: $10 - 10 = 0$.'
  - 'Conclusión: El resultado final es $0$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la expresión 6 + 4 · 3, ¿qué operación se debe realizar primero?
  choices:
  - text: La multiplicación 4 · 3
    is_correct: true
  - text: La suma 6 + 4
    is_correct: false
  - text: Es indiferente el orden
    is_correct: false
  - text: Restar 3 a 6
    is_correct: false
  explanation: La alternativa correcta es 'La multiplicación 4 · 3' por la jerarquía
    PAPOMUDAS.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado final de la expresión combinada?
  choices:
  - text: '0'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '80'
    is_correct: false
  - text: '-10'
    is_correct: false
  explanation: La alternativa correcta es '0'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver las operaciones dentro de los paréntesis más internos.'
- 'Paso 2: Calcular el valor de todas las potencias.'
- 'Paso 3: Resolver multiplicaciones y divisiones en orden de aparición de izquierda
  a derecha.'
- 'Paso 4: Resolver sumas y restas en orden de aparición de izquierda a derecha.'
errores_correccion: '- **Error 1: Sumar antes de multiplicar en expresiones sin paréntesis
  ($5 + 2 \cdot 3$).** **Cómo corregirlo:** La multiplicación tiene mayor jerarquía;
  se hace $2 \cdot 3 = 6$ y luego $5 + 6 = 11$.


  - **Error 2: Resolver multiplicaciones antes que divisiones cuando la división está
  a la izquierda ($12 : 3 \cdot 2$).** **Cómo corregirlo:** Multiplicación y división
  tienen la misma jerarquía; se resuelven de izquierda a derecha ($12 : 3 = 4 \implies
  4 \cdot 2 = 8$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Calcule $18 - 6 : 2 + 5$.'
  alternativas:
  - '20'
  - '11'
  - '10'
  respuesta: '20'
  solucion_pasos:
  - 'División primero: $6 : 2 = 3$. Luego resta y suma: $18 - 3 + 5 = 20$.'
- titulo: Ejemplo 2
  enunciado: 'Calcule $16 : 4 \cdot 2$.'
  alternativas:
  - '8'
  - '2'
  - '1'
  respuesta: '8'
  solucion_pasos:
  - 'Igual jerarquía, de izquierda a derecha: $16 : 4 = 4 \implies 4 \cdot 2 = 8$.'
- titulo: ¿Se debe resolver la multiplicación antes que la suma en una expresión combinada?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación tiene mayor jerarquía que la adición.
- titulo: '¿En la expresión 12 : 4 · 3 se debe hacer la multiplicación 4 · 3 antes
    que la división?'
  respuesta: 'No'
  solucion_pasos:
  - No, al tener igual jerarquía se resuelve de izquierda a derecha ($12:4=3 \implies
    3·3=9$).
errores_frecuentes:
- En una expresión sin paréntesis se deben resolver las adiciones antes que las multiplicaciones.
- La multiplicación tiene siempre una jerarquía estrictamente superior a la división
  en PAPOMUDAS.
- Resolver operaciones de izquierda a derecha se aplica únicamente cuando hay paréntesis.
- Las potencias se calculan al final después de resolver todas las sumas y restas.
- Los paréntesis se deben eliminar resolviendo las sumas exteriores en primer lugar.
afirmaciones_verdaderas:
- El orden PAPOMUDAS exige resolver paréntesis, potencias, multiplicaciones/divisiones
  y sumas/restas.
- Multiplicación y división tienen la misma jerarquía y se resuelven en orden de izquierda
  a derecha.
al_terminar_debes_poder: Al terminar serás capaz de resolver operaciones combinadas
  con enteros aplicando la jerarquía PAPOMUDAS, resolviendo paréntesis, potencias,
  multiplicaciones/divisiones y sumas/restas en el orden correspondiente.
