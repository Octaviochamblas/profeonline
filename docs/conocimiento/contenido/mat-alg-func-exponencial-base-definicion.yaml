semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DEFINICION
resumen_inicial: 'La función exponencial es una regla matemática de la forma $f(x) = a \cdot b^x$, donde la variable independiente $x$ se encuentra en el exponente de una base constante positiva $b \neq 1$.'
explicacion_simple: |
  Una función exponencial es aquella en la que la variable $x$ se ubica en el exponente de una potencia, mientras que la base es un número fijo. A diferencia de las funciones algebraicas comunes donde la variable está abajo y se eleva a un número (como $x^2$), en la función exponencial la base está fija y el número de arriba varía (como $2^x$). Esto produce aumentos o disminuciones muy rápidos.
explicacion_formal: |
  ### Definición formal
  Una **función exponencial** real es una función $f: \mathbb{R} \to \mathbb{R}$ definida por la estructura:
  $$f(x) = a \cdot b^x$$
  donde $a \in \mathbb{R} \setminus \{0\}$ representa el coeficiente de escala inicial y $b \in \mathbb{R}$ es la base de la potencia que debe cumplir estrictamente dos condiciones:
  1. $b > 0$ (base estrictamente positiva).
  2. $b \neq 1$ (base distinta de la unidad).

  ### Desglose simbólico
  - Ubicación de la variable: $x \in \mathbb{R}$ actúa como el exponente real.
  - Tasa de crecimiento constante multiplicativa: Para incrementos unitarios de $x$ ($x \to x + 1$), la función se multiplica por el factor constante $b$: $f(x+1) = b \cdot f(x)$.

  ### Síntesis didáctica
  Diferenciar función exponencial de función potencia: En la función potencia $f(x) = x^n$, la base es la variable $x$ y el exponente es fijo ($n$). En la función exponencial $f(x) = b^x$, la base es constante ($b$) y la variable es el exponente ($x$).
definiciones_clave: |
  - **Función exponencial**: Expresión funcional $f(x) = a \cdot b^x$ con la variable en el exponente.
  - **Base de la potencia $b$**: Constante real estrictamente positiva y distinta de 1 ($b > 0, b \neq 1$).
  - **Coeficiente de escala $a$**: Número real no nulo que multiplica a la potencia exponencial.
propiedades_relaciones: |
  - **Propiedad del producto exponencial**: $f(x + y) = a \cdot b^{x+y} = a \cdot b^x \cdot b^y$.
  - **Monotonía estricta**: Si $b > 1$, la función es estrictamente creciente. Si $0 < b < 1$, la función es strictly decreciente.
ejemplo_guiado:
  enunciado: 'Determina si las siguientes expresiones corresponden a funciones exponenciales reales y justifica tu respuesta: A) $f(x) = 5 \cdot 3^x$, B) $g(x) = x^3$, C) $h(x) = (-2)^x$.'
  pasos:
    - 'Paso 1: Para $f(x) = 5 \cdot 3^x$, la variable $x$ está en el exponente, la base es $b = 3 > 0$ y $3 \neq 1$. Es una función exponencial válida.'
    - 'Paso 2: Para $g(x) = x^3$, la variable $x$ está en la base y el exponente es constante. Corresponde a una función potencia de grado 3, no a una exponencial.'
    - 'Paso 3: Para $h(x) = (-2)^x$, la base es $b = -2 < 0$. No es una función exponencial real porque no está definida en $\mathbb{R}$ para exponentes fraccionarios como $x = \frac{1}{2}$.'
    - 'Paso 4: Conclusión: Únicamente la opción A es una función exponencial real.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones corresponde correctamente a la definición de una función exponencial real?'
    choices:
      - {text: '$f(x) = 4 \cdot \left(\frac{1}{2}\right)^x$', is_correct: true}
      - {text: '$f(x) = 4x^2$', is_correct: false}
      - {text: '$f(x) = 4 \cdot 1^x$', is_correct: false}
      - {text: '$f(x) = 4 \cdot (-3)^x$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = 4 \cdot \left(\frac{1}{2}\right)^x$''. La variable $x$ está en el exponente, la base es $b = \frac{1}{2} > 0$ y $b \neq 1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $g(x) = 7 \cdot 1^x$ NO se considera una función exponencial?'
    choices:
      - {text: 'Porque al ser la base $b = 1$, la función resulta la constante $g(x) = 7$ perdiendo el comportamiento exponencial', is_correct: true}
      - {text: 'Porque el coeficiente 7 es un número primo', is_correct: false}
      - {text: 'Porque la variable $x$ se ubica en el exponente', is_correct: false}
      - {text: 'Porque el dominio no incluye los números negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al ser la base $b = 1$, la función resulta la constante $g(x) = 7$ perdiendo el comportamiento exponencial''. La base $1^x = 1$ convierte la función en una constante lineal.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la posición de la variable independiente $x$ en la fórmula funcional.'
  - 'Paso 2: Verificar que $x$ se encuentra ubicada exactamente en el exponente de una expresión.'
  - 'Paso 3: Inspeccionar el valor de la base constante $b$ y corroborar que cumpla simultáneamente $b > 0$ y $b \neq 1$.'
  - 'Paso 4: Concluir si la expresión representa o no una función exponencial real.'
errores_correccion: |
  - **Error 1:** Clasificar la función polinomio $x^5$ como una función exponencial. **Cómo corregirlo:** En $x^5$ la variable es la base y el exponente es fijo (función potencia). En una exponencial como $5^x$, la variable se ubica en el exponente.
  - **Error 2:** Considerar válida una base negativa como en $f(x) = (-4)^x$. **Cómo corregirlo:** Si la base es negativa, al evaluar exponentes como $x = 0.5 = \frac{1}{2}$ resulta $\sqrt{-4}$, el cual no es un número real.
ejemplos:
  - titulo: 'Identificación de función exponencial mónica'
    enunciado: '¿La función $f(x) = 10^x$ es una función exponencial?'
    alternativas:
      - 'Sí, con base $b = 10$ y escala $a = 1$'
      - 'No, porque le falta el parámetro $a$'
      - 'No, es una función cuadrática'
    respuesta: 'Sí, con base $b = 10$ y escala $a = 1$'
    solucion_pasos:
      - '1. La variable $x$ está en el exponente.'
      - '2. La base es $b = 10 > 0$ y $10 \neq 1$. El coeficiente es $a = 1$.'
      - '3. Es una función exponencial válida.'
  - titulo: 'Diferencia con función potencia'
    enunciado: '¿Es $f(x) = x^4$ una función exponencial?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. En $x^4$, la variable $x$ está en la base (función potencia).'
  - titulo: 'Base fraccionaria positiva'
    enunciado: '¿La función $g(x) = \left(\frac{1}{3}\right)^x$ es exponencial?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La base $b = \frac{1}{3}$ cumple $0 < \frac{1}{3} < 1$, por lo que es una función exponencial decreciente.'
  - titulo: 'Constancia de la base'
    enunciado: 'En la función $f(x) = 3 \cdot 2^x$, ¿la base $b = 2$ se mantiene constante para cualquier valor de $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La base es una constante fija ($b = 2$), mientras que el exponente $x$ es la variable dependiente.'
errores_frecuentes:
  - 'La expresión $f(x) = x^3$ corresponde a una función exponencial con base $x$.'
  - 'En la función exponencial $f(x) = a \cdot b^x$, la base $b$ puede ser un número real negativo cualquiera.'
  - 'La función $f(x) = 5 \cdot 1^x$ es una función exponencial estrictamente creciente.'
  - 'En una función exponencial, la variable $x$ se ubica siempre en la base de la potencia.'
  - 'Una función exponencial con coeficiente $a = 2$ y base $b = 3$ es idéntica a la función $f(x) = 6^x$.'
afirmaciones_verdaderas:
  - 'Una función exponencial $f(x) = a \cdot b^x$ exige que la variable $x$ esté en el exponente y la base cumpla $b > 0$ con $b \neq 1$.'
  - 'Multiplicar la base por el coeficiente $a$ antes de resolver la potencia $(a \cdot b)^x$ viola el orden de las operaciones algebraicas.'
al_terminar_debes_poder: 'Reconocer e identificar la definición formal de una función exponencial real $f(x) = a \cdot b^x$.'
