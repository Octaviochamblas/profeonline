semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DEFINICION
resumen_inicial: 'Definición de función exponencial: conceptos, asíntotas, propiedades
  e inversidad en Conceptos de la función exponencial.'
explicacion_simple: Hasta ahora la variable siempre estaba en la base de una potencia
  (como $x^2$); en la función exponencial, los papeles se invierten y la variable
  pasa a ocupar el exponente.
explicacion_formal: '### Definición formal


  Una función $f:\mathbb{R} \to \mathbb{R}$ es exponencial si puede expresarse como
  $f(x)=a\cdot b^x$, con $a\neq0$, $b>0$ y $b\neq1$. El nombre "exponencial" refleja
  que la variable $x$ ocupa la posición del exponente, no de la base.


  ### Desarrollo didáctico


  Para reconocer una función exponencial, se busca la variable en la posición del
  exponente; si la variable está en la base de la potencia (como en $x^3$), la función
  no es exponencial, sino potencial o polinómica.


  $f(x)=3\cdot2^x$ es exponencial, porque $x$ está en el exponente. En cambio, $g(x)=x^3$
  no es exponencial, porque la variable está en la base.'
definiciones_clave: '- **Definición de función exponencial**: Concepto fundamental
  en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a definición de función exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de definición
    de función exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de definición de función exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    definición de función exponencial?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en conceptos de la
      función exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en conceptos de la función exponencial. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en definición de función exponencial?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observa la regla de la función.'
- 'Paso 2: Identifica si la variable $x$ aparece como exponente de una base constante.'
- 'Paso 3: Si es así, y la base es positiva y distinta de 1, la función es exponencial.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en definición
  de función exponencial.
ejemplos:
- titulo: Reconocimiento de una función exponencial
  enunciado: ¿Es $f(x)=5\cdot3^x$ una función exponencial?
  solucion_pasos:
  - La variable $x$ está en el exponente, con base $3>0$ y $3\neq1$.
  - Sí, es una función exponencial.
- titulo: Reconocimiento de una función que no es exponencial
  enunciado: ¿Es $g(x)=x^5$ una función exponencial?
  solucion_pasos:
  - La variable $x$ está en la base, no en el exponente.
  - No, es una función potencial, no exponencial.
- titulo: ¿Toda función con un exponente es necesariamente exponencial?
  enunciado: ¿Toda función con un exponente es necesariamente exponencial?
  respuesta: 'No'
  solucion_pasos:
  - Solo lo es si la variable independiente ocupa la posición del exponente; si el
    exponente es un número fijo, la función es potencial, no exponencial.
- titulo: ¿Puede la base de una función exponencial ser un número negativo?
  enunciado: ¿Puede la base de una función exponencial ser un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - La base debe ser positiva para que la función esté bien definida para todo $x$
    real.
errores_frecuentes:
- Confundir una función exponencial ($a\cdot b^x$) con una función potencial ($a\cdot
  x^n$).
- No verificar que la base sea positiva y distinta de 1.
- Confundir la posición de la variable, asumiendo que puede estar en la base o en
  el exponente indistintamente.
- Clasificar como exponencial una función donde el exponente es constante y no contiene
  la variable.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando definición de función exponencial.
