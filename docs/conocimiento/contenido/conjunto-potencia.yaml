semantic_id: MAT.FUND.CONJUNTOS_BASICOS.CONJUNTO_POTENCIA
resumen_inicial: 'Definición, construcción y propiedades del conjunto potencia ($\mathcal{P}(A)$ o $2^A$) como el conjunto formado por todos los subconjuntos de $A$.'
explicacion_simple: |
  El **conjunto potencia** (o conjunto de las partes de un conjunto, escrito como **$\mathcal{P}(A)$** o **$2^A$**) es una "gran bolsa" que contiene **todos los posibles subconjuntos** que se pueden formar con los elementos de $A$. Siempre incluye obligatoriamente al **conjunto vacío ($\emptyset$)** y al **propio conjunto original ($A$)**, además de todos los subconjuntos de 1 elemento, de 2 elementos, etc. Por ejemplo, para $A = \{1, 2\}$, su conjunto potencia es **$\mathcal{P}(A) = \{\emptyset, \{1\}, \{2\}, \{1, 2\}\}$**.
explicacion_formal: |
  ### Definición formal
  En la teoría axiomática de conjuntos ($\text{ZFC}$), la existencia del **conjunto potencia** está garantizada por el **Axioma del Conjunto Potencia**:
  $$\forall A \, \exists \mathcal{P}(A) \, \forall X \, (X \in \mathcal{P}(A) \leftrightarrow X \subseteq A)$$
  Para cualquier conjunto $A$, $\mathcal{P}(A)$ es la colección de todos sus subconjuntos:
  $$\mathcal{P}(A) = \{X \mid X \subseteq A\}$$

  ### Desglose simbólico
  - Símbolos equivalentes: $\mathcal{P}(A) \equiv \wp(A) \equiv 2^A$.
  - Elementos extremos universales: Para todo conjunto $A$, se cumple que:
    $$\emptyset \in \mathcal{P}(A) \quad \land \quad A \in \mathcal{P}(A)$$
  - Relación fundamental de niveles: $X \subseteq A \iff X \in \mathcal{P}(A)$.

  ### Síntesis didáctica
  El conjunto potencia eleva el nivel ontológico: lo que era una relación de subconjunto ($\subseteq$) en el nivel base de $A$, se convierte en una relación de pertenencia ($\in$) dentro de $\mathcal{P}(A)$.
definiciones_clave: |
  - **Conjunto potencia ($\mathcal{P}(A)$)**: Conjunto cuyos elementos son exactamente todos los subconjuntos posibles de $A$.
  - **Axioma del conjunto potencia**: Axioma de $\text{ZFC}$ que postula la existencia del conjunto de partes para cualquier conjunto.
  - **Conversión de inclusión a pertenencia**: Principio que establece que $X \subseteq A \iff X \in \mathcal{P}(A)$.
propiedades_relaciones: |
  - **Teorema de Cantor**: Para cualquier conjunto $A$, no existe una función sobreyectiva de $A$ sobre $\mathcal{P}(A)$, demostrando que $|\mathcal{P}(A)| > |A|$.
  - **Monotonía**: Si $A \subseteq B$, entonces $\mathcal{P}(A) \subseteq \mathcal{P}(B)$.
ejemplo_guiado:
  enunciado: 'Dado el conjunto $A = \{a, b, c\}$, construye de forma sistemática y ordenada todos los elementos de su conjunto potencia $\mathcal{P}(A)$.'
  pasos:
    - 'Paso 1: Identificar los subconjuntos de cardinalidad $0$ (conjunto vacío):
      - Subconjuntos de 0 elementos: $\emptyset$.'
    - 'Paso 2: Identificar los subconjuntos de cardinalidad $1$ (subconjuntos unitarios):
      - Subconjuntos de 1 elemento: $\{a\}, \{b\}, \{c\}$.'
    - 'Paso 3: Identificar los subconjuntos de cardinalidad $2$ (pares):
      - Subconjuntos de 2 elementos: $\{a, b\}, \{a, c\}, \{b, c\}$.'
    - 'Paso 4: Identificar los subconjuntos de cardinalidad $3$ (el conjunto completo):
      - Subconjuntos de 3 elementos: $\{a, b, c\}$.'
    - 'Paso 5: Reunir todos los subconjuntos dentro de un gran conjunto de llaves:
      - $\mathcal{P}(A) = \{\emptyset, \{a\}, \{b\}, \{c\}, \{a, b\}, \{a, c\}, \{b, c\}, \{a, b, c\}\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué dos elementos están siempre presentes en el conjunto potencia $\mathcal{P}(A)$ de cualquier conjunto $A$?'
    choices:
      - {text: 'El conjunto vacío $\emptyset$ y el propio conjunto $A$', is_correct: true}
      - {text: 'El número $0$ y el número $1$', is_correct: false}
      - {text: 'El conjunto universal y el número $2$', is_correct: false}
      - {text: 'Únicamente los subconjuntos unitarios', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto vacío $\emptyset$ y el propio conjunto $A$''. Ambos son siempre subconjuntos de $A$ ($\emptyset \subseteq A$ y $A \subseteq A$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el conjunto potencia del conjunto vacío $\mathcal{P}(\emptyset)$?'
    choices:
      - {text: '$\{\emptyset\}$', is_correct: true}
      - {text: '$\emptyset$', is_correct: false}
      - {text: '$\{0\}$', is_correct: false}
      - {text: '$\{\{\emptyset\}\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\{\emptyset\}$''. El único subconjunto de $\emptyset$ es $\emptyset$, por lo que $\mathcal{P}(\emptyset) = \{\emptyset\}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Contar los elementos del conjunto base $|A| = n$ para saber que se obtendrán $2^n$ subconjuntos.'
  - 'Paso 2: Escribir el conjunto vacío $\emptyset$ como primer subconjunto.'
  - 'Paso 3: Escribir todos los subconjuntos unitarios tomando los elementos de 1 en 1.'
  - 'Paso 4: Escribir todos los subconjuntos combinando los elementos de 2 en 2, de 3 en 3, hasta llegar a $n$.'
  - 'Paso 5: Agrupar todos los subconjuntos hallados dentro de las llaves exteriores $\{\dots\}$ de $\mathcal{P}(A)$.'
errores_correccion: |
  - **Error 1:** Escribir los elementos individuales en vez de subconjuntos dentro de $\mathcal{P}(A)$ (ej. poner $\{1, 2\}$ en vez de $\{\emptyset, \{1\}, \{2\}, \{1, 2\}\}$). **Cómo corregirlo:** Los elementos del conjunto potencia son subconjuntos, por lo que deben llevar llaves individuales: $\{1\}, \{2\}$, etc.
  - **Error 2:** Omitir el conjunto vacío $\emptyset$ o el propio conjunto $A$. **Cómo corregirlo:** $\emptyset$ y $A$ son obligatorios en todo conjunto potencia; para verificar, el total de elementos de $\mathcal{P}(A)$ debe ser siempre $2^n$.
ejemplos:
  - titulo: 'Potencia de conjunto de un elemento'
    enunciado: '¿Cuál es el conjunto potencia de $S = \{x\}$?'
    alternativas:
      - '$\{\emptyset, \{x\}\}$'
      - '$\{x\}$'
      - '$\{\emptyset\}$'
    respuesta: '$\{\emptyset, \{x\}\}$'
    solucion_pasos:
      - '1. Sus subconjuntos son $\emptyset$ y $\{x\}$.'
      - '2. $\mathcal{P}(S) = \{\emptyset, \{x\}\}$.'
  - titulo: 'Potencia de dos elementos'
    enunciado: '¿Cuántos elementos tiene $\mathcal{P}(\{1, 2\})$?'
    respuesta: '$4$ elementos'
    solucion_pasos:
      - 'Tiene $2^2 = 4$ elementos: $\emptyset, \{1\}, \{2\}, \{1, 2\}$.'
  - titulo: 'Pertenencia en la potencia'
    enunciado: 'Si $X \subseteq A$, ¿es verdadera la proposición $X \in \mathcal{P}(A)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la definición formal del conjunto potencia establece $X \subseteq A \iff X \in \mathcal{P}(A)$.'
  - titulo: 'Inclusión en la potencia'
    enunciado: '¿Se cumple que $\{\emptyset\} \subseteq \mathcal{P}(A)$ para todo conjunto $A$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, como $\emptyset \in \mathcal{P}(A)$, entonces $\{\emptyset\} \subseteq \mathcal{P}(A)$.'
errores_frecuentes:
  - 'La afirmación de que el conjunto vacío no es elemento del conjunto potencia de un conjunto no vacío.'
  - 'La afirmación de que el conjunto potencia del conjunto vacío es el conjunto vacío $\emptyset$.'
  - 'La afirmación de que los elementos de $\mathcal{P}(A)$ son los elementos sueltos de $A$ sin llaves.'
  - 'La afirmación de que un conjunto de 3 elementos tiene 6 subconjuntos en su conjunto potencia.'
  - 'La afirmación de que el conjunto original $A$ no pertenece a su propio conjunto potencia $\mathcal{P}(A)$.'
afirmaciones_verdaderas:
  - 'El conjunto potencia $\mathcal{P}(A)$ es la colección formada por la totalidad de los subconjuntos de $A$ ($X \in \mathcal{P}(A) \iff X \subseteq A$).'
  - 'Para cualquier conjunto $A$, el conjunto vacío y el conjunto $A$ son siempre elementos de $\mathcal{P}(A)$ ($\emptyset \in \mathcal{P}(A) \land A \in \mathcal{P}(A)$).'
al_terminar_debes_poder: |
  QUÉ: Definir, construir e interpretar el conjunto potencia ($\mathcal{P}(A)$) de cualquier conjunto.
  CÓMO: Enumerar sistemáticamente todos los subconjuntos por tamaño (desde $\emptyset$ hasta $A$) y agruparlos en la estructura formal $\mathcal{P}(A)$.
