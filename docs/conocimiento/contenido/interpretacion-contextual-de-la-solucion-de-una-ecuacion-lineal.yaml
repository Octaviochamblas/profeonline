semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.INTERPRETACION_SOLUCION
resumen_inicial: La interpretación contextual traduce el valor numérico obtenido a una respuesta verbal completa redactada
  en el lenguaje y unidades propias del problema.
explicacion_simple: 'Resolver algebraicamente la ecuación y obtener un valor como $x = 8$ no concluye el proceso de resolución
  de un problema verbal.


  La **interpretación contextual** consiste en dar una respuesta completa redactada en lenguaje verbal que responda exactamente
  a la pregunta del enunciado, añadiendo la unidad de medida adecuada (por ejemplo: "La edad actual de María es de $8\text{
  años}$" o "El costo del lápiz es de $\$1.500$").


  Un valor numérico desprovisto de unidades o contexto carece de significado práctico en la resolución de problemas reales.


  ![Interpretación contextual](/static/img/nodos/interpretacion-contextual-de-la-solucion-de-una-ecuacion-lineal-intro.svg)

  '
explicacion_formal: '### Definición formal

  La **interpretación contextual** es la función de reconversión $M^{-1}$ que traduce la solución algebraica $x = c \in \mathbb{R}$
  en una proposición verídica en lenguaje natural:


  $$x = c \implies \text{Respuesta contextualizada: "La magnitud buscada equivale a } c \text{ } U\text{"}$$


  ### Desglose de la fórmula

  - $c$: Valor cuantitativo obtenido al resolver la ecuación lineal.

  - $U$: Unidad de medida (financiera, métrica, temporal o de conteo) definida por el contexto del problema.


  ### Síntesis didáctica

  La respuesta final debe ser una oración explícita que conteste la pregunta formulada en el texto incorporando su dimensión
  física o económica.

  '
definiciones_clave: '- **Respuesta contextualizada**: Declaración verbal completa que combina el número hallado con su significado
  y sus unidades de medida en el problema.

  - **Unidades de medida contextuales**: Magnitudes estándar como pesos ($\$$), metros ($\text{m}$), años, litros ($\text{L}$),
  personas o unidades de tiempo.

  '
propiedades_relaciones: '- **Validación práctica del resultado**: La respuesta contextual debe verificar que la magnitud calculada
  concuerda con las leyes del dominio real.

  - **Diferencia entre incógnita y respuesta**: Si la pregunta pide $x + 4$, la interpretación contextual exige reportar la
  suma $c + 4$ y no únicamente el número $c$.

  '
ejemplo_guiado:
  enunciado: Un estanque contiene $120\text{ litros}$ de agua y se vacía a razón constante de $15\text{ litros}$ por minuto.
    Se plantea la ecuación $120 - 15t = 0$. Resuelve para $t$ e interpreta contextualmente el resultado.
  pasos:
  - 'Paso 1: Resolver la ecuación lineal: $120 = 15t \implies t = \frac{120}{15} = 8$.'
  - 'Paso 2: Identificar la unidad de medida asociada a la variable $t$: minutos.'
  - 'Paso 3: Redactar la interpretación contextual completa: "El estanque tardará exactamente $8\text{ minutos}$ en vaciarse
    por completo".'
  - 'Paso 4: Comprobar en el contexto real: en $8\text{ minutos}$ se vacían $8 \cdot 15 = 120\text{ L}$, dejando el estanque
    con $0\text{ L}$.'
  imagen: /static/img/nodos/interpretacion-contextual-de-la-solucion-de-una-ecuacion-lineal-ejemplos.svg
