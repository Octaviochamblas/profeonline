procedimiento:
- 'Paso 1: Obtener la solución numérico-algebraica $x = c$.'
- 'Paso 2: Releer atentamente la pregunta original del problema para confirmar qué cantidad se pide.'
- 'Paso 3: Calcular la expresión final solicitada si difiere de la variable sola $x$.'
- 'Paso 4: Añadir la unidad de medida correspondiente ($U$).'
- 'Paso 5: Redactar una respuesta completa estructurada como oración en lenguaje verbal.'
errores_correccion: '- **Error 1:** Escribir un número aislado como resultado final (por ejemplo "$8$") sin indicar su unidad
  ni redactar la frase. **Cómo corregirlo:** Toda respuesta a un problema verbal **DEBE ESTRUCTURARSE COMO UNA ORACIÓN COMPLETA
  QUE INCLUYA LA UNIDAD DE MEDIDA ($8\text{ minutos}, $\$1.500$, 8\text{ metros}$)**.

  - **Error 2:** Confundir la unidad de la respuesta reportando unidades de otra magnitud (como responder "$8\text{ litros}$"
  en vez de "$8\text{ minutos}$"). **Cómo corregirlo:** Verificar **LA NATURALEZA DE LA VARIABLE DESPEJADA: SI MIDE TIEMPO,
  LA UNIDAD DEBE SER MINUTOS U HORAS**.

  '
ejemplos:
- titulo: 'Ejemplo 1: Problema financiero'
  enunciado: Si la solución a un problema de compras da $x = 2500$, ¿cuál es la interpretación contextual?
  alternativas:
  - El producto cuesta $\$2.500$
  - Se adquirieron $2.500$ artículos
  - Asistieron $2.500$ compradores
  respuesta: El producto cuesta $\$2.500$
  solucion_pasos:
  - 1. Asignar la unidad monetaria (pesos) a la variable $x$.
  - '2. Redactar: "El producto cuesta $\$2.500$".'
- titulo: 'Ejemplo 2: Distancia recorrida'
  enunciado: En la fórmula de movimiento $d = 80t$, si $t = 3\text{ h}$, la solución es $d = 240$. ¿Qué representa?
  alternativas:
  - La distancia recorrida es de $240\text{ km}$
  - La velocidad promedio es de $240\text{ km/h}$
  - El tiempo invertido fue de $240\text{ horas}$
  respuesta: La distancia recorrida es de $240\text{ km}$
  solucion_pasos:
  - 1. $d$ representa la distancia en kilómetros.
  - '2. Redactar: "La distancia recorrida es de $240\text{ km}$".'
- titulo: Unidades obligatorias
  enunciado: ¿Es obligatorio acompañar la cifra numérica final con su correspondiente unidad de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, un número aislado carece de significado práctico en un contexto real.
- titulo: Respuestas dirigidas
  enunciado: ¿La interpretación contextual debe responder exactamente a la pregunta formulada en el texto?
  respuesta: Sí
  solucion_pasos:
  - Sí, debe adecuarse al requerimiento específico del enunciado.
errores_frecuentes:
- Entregar como respuesta final un número escalar aislado sin redactar una frase ni incluir la unidad de medida.
- 'Confundir la unidad de medida de la respuesta reportando unidades de otra magnitud (ej: litros en vez de minutos).'
- Limitar la interpretación contextual a reportar únicamente el valor de $x$ cuando se pide una expresión compuesta.
- Expresar magnitudes en unidades de velocidad cuando se solicita una distancia o un tiempo.
- Redactar conclusiones contradictorias que declaran magnitudes físicas como valores negativos.
afirmaciones_verdaderas:
- La interpretación contextual traduce la solución matemática en una respuesta verbal con sus unidades correspondientes.
- El resultado numérico debe asociarse a la pregunta del enunciado para entregar una respuesta completa.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/interpretacion-contextual-de-la-solucion-de-una-ecuacion-lineal-resumen.svg)


  QUÉ: Redactar la interpretación contextual de la solución de una ecuación lineal.

  CÓMO: Releer la pregunta del texto, asociar la unidad de medida a la magnitud calculada ($8\\text{ minutos}, \\$1.500$)
  y construir una oración explicativa completa en lenguaje natural.

  '
