semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.INTERPRETACION_SOLUCION
resumen_inicial: 'Interpretación contextual de la solución de una ecuación lineal:
  propiedades, resolución y modelamiento en Modelamiento con ecuaciones lineales.'
explicacion_simple: 'Si entregas ''$x=10$'' como respuesta en una prueba, podrías
  tenerlo malo. Debes volver a tu diccionario inicial:'
explicacion_formal: '### Definición formal


  El valor numérico $x=k$ obtenido al resolver la ecuación no es, por sí mismo, la
  respuesta al problema: la solución final se obtiene sustituyendo $k$ en cada expresión
  definida en función de $x$ durante el modelamiento, y redactando esos valores en
  los términos que pedía la pregunta original.


  ### Desarrollo didáctico


  Si entregas ''$x=10$'' como respuesta en una prueba, podrías tenerlo malo. Debes
  volver a tu diccionario inicial:

  - Habíamos dicho que Juan = $x$. Entonces Juan tiene 10 años.

  - Habíamos dicho que Pedro = $2x$. Entonces Pedro tiene $2 \cdot 10 = 20$ años.


  La respuesta correcta y completa es ''Juan tiene 10 años y Pedro tiene 20 años''.
  Siempre debes responder a la pregunta específica que te hicieron.'
definiciones_clave: '- **Interpretación contextual de la solución de una ecuación
  lineal**: Herramienta matemática para determinar valores desconocidos que satisfacen
  la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a interpretación contextual de la solución
  de una ecuación lineal.'
