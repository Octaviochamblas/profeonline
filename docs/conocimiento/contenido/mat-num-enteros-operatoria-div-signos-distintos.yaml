semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DIV_SIGNOS_DISTINTOS
resumen_inicial: 'La división de dos enteros de distinto signo resulta siempre en
  un cociente negativo: $(+) : (-) = -$ y $(-) : (+) = -$.'
explicacion_simple: Cuando dividimos un número positivo entre uno negativo (o viceversa),
  el cociente obtenido es siempre un número negativo. Esto se fundamenta en que al
  comprobar mediante multiplicación, solo un número negativo por uno positivo puede
  recuperar el dividendo original.
explicacion_formal: 'Para dos enteros $a, b \in \mathbb{Z}$ con $b \neq 0$ y $\operatorname{sgn}(a)
  \neq \operatorname{sgn}(b)$ donde $b \mid a$, la **División de Signos Distintos**
  se define como:


  $$a : b = -\left( |a| : |b| \right) < 0$$


  **Desglose de la fórmula:**

  - $|a| : |b|$: Cociente entre los módulos de dividendo y divisor.

  - $-(\dots)$: Signo negativo resultante en el cociente debido a la diferencia de
  polaridad.


  > **Complemento didáctico:** $(-30) : 5 = -6$, ya que $(-6) \cdot (+5) = -30$ satisface
  la prueba de la división.'
definiciones_clave: '- **División exacta de signos distintos**: Operación cociente
  entre números de polaridad opuesta que entrega un resultado negativo.'
propiedades_relaciones: '- **Ubicación del signo menos en fracciones**: $\frac{-a}{b}
  = \frac{a}{-b} = -\frac{a}{b}$.'
ejemplo_guiado:
  enunciado: Calcule el cociente entre el entero negativo $-40$ y el entero positivo
    $8$.
  pasos:
  - 'Paso 1: Identificar los signos: $-40$ es negativo y $8$ es positivo.'
  - 'Paso 2: Aplicar la regla de signos distintos: $(-) : (+) = -$.'
  - 'Paso 3: Dividir las magnitudes absolutas: $40 : 8 = 5$.'
  - 'Conclusión: $(-40) : 8 = -5$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es el resultado de la división 54 : (-9)?'
  choices:
  - text: '-6'
    is_correct: true
  - text: '6'
    is_correct: false
  - text: '-45'
    is_correct: false
  - text: '45'
    is_correct: false
  explanation: La alternativa correcta es '-6', ya que la división de distinto signo
    da resultado negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado (-40) : 8, ¿cuál es el resultado final?'
  choices:
  - text: '-5'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '-32'
    is_correct: false
  - text: '32'
    is_correct: false
  explanation: La alternativa correcta es '-5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir los valores absolutos del dividendo y divisor.'
- 'Paso 2: Comprobar que dividendo y divisor tengan signos opuestos.'
- 'Paso 3: Asignar un signo negativo ($-$) al cociente final.'
errores_correccion: '- **Error 1: Pensar que el signo del cociente lo decide el número
  de mayor valor absoluto.** **Cómo corregirlo:** En la división de distinto signo,
  el resultado es SIEMPRE negativo.


  - **Error 2: Cambiar el signo al dividir entre 1 positivo.** **Cómo corregirlo:**
  Dividir entre $+1$ conserva el número y su signo intactos ($a : 1 = a$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Calcule $72 : (-8)$.'
  alternativas:
  - '-9'
  - '9'
  - '-64'
  respuesta: '-9'
  solucion_pasos:
  - '$(+) : (-) = -$. $72 : 8 = 9 \implies -9$.'
- titulo: Ejemplo 2
  enunciado: 'Si una deuda de $30.000$ pesos se divide entre 6 meses, ¿cuánto se amortiza
    mensualmente $(-30000) : 6$?'
  alternativas:
  - -5.000 pesos
  - 5.000 pesos
  - -36.000 pesos
  respuesta: -5.000 pesos
  solucion_pasos:
  - '$(-30000) : 6 = -5000$ pesos.'
- titulo: '¿El cociente (-20) : 4 da como resultado un entero negativo?'
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $(-) : (+) = -$.'
- titulo: '¿Es el resultado de 15 : (-3) un número positivo?'
  respuesta: 'No'
  solucion_pasos:
  - 'No, $15 : (-3) = -5$.'
errores_frecuentes:
- La división de dos enteros de distinto signo resulta en un cociente positivo si
  el dividendo es mayor.
- Dividir un entero positivo entre uno negativo da como resultado el entero cero.
- El signo del cociente en divisiones de distinto signo depende de la resta de sus
  magnitudes.
- Dividir un entero negativo entre 1 invierte su signo a positivo.
- Las fracciones con signo menos en el denominador no se pueden evaluar en $\mathbb{Z}$.
afirmaciones_verdaderas:
- La división de dos números enteros de distinto signo resulta siempre en un cociente
  negativo.
- Las expresiones $\frac{-a}{b}$ y $\frac{a}{-b}$ equivalen al mismo cociente negativo
  $-\frac{a}{b}$.
al_terminar_debes_poder: Al terminar serás capaz de calcular la división de dos enteros
  de distinto signo, dividiendo sus valores absolutos y asignando un signo negativo
  al cociente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
