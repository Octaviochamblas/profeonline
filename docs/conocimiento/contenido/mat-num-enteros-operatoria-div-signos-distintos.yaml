semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DIV_SIGNOS_DISTINTOS
resumen_inicial: "Al dividir dos enteros de distinto signo, el cociente siempre es negativo: $(+)\\div(-)=(-)$."
explicacion_simple: |
  Si dividimos dos números que no "se ponen de acuerdo" en el signo (uno positivo y uno
  negativo), el resultado siempre es negativo, sin importar cuál sea más grande.
  $15\div(-3)=-5$ y $-15\div3=-5$: el signo del cociente siempre es menos.
explicacion_formal: |
  $\frac{+a}{-b} = -(a\div b)$ y $\frac{-a}{+b} = -(a\div b)$. Si $-24\div6=c$, entonces
  $c\cdot6=-24$, y el único $c$ que cumple eso es $c=-4$ (negativo).
definiciones_clave: |
  **Signos distintos en la división**: un dividendo positivo y divisor negativo (o
  viceversa), cuyo cociente siempre es negativo.
propiedades_relaciones: |
  La regla de signos de la división es idéntica a la de la multiplicación, ya que la
  división es su operación inversa.
ejemplo_guiado:
  enunciado: "Calcula $(-84) \\div 12$."
  pasos:
    - "Los signos son distintos: $-84$ y $12$."
    - 'Se dividen los valores absolutos: $84\div12=7$.'
    - "El resultado es negativo: $-7$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué signo tiene siempre el cociente de un entero positivo dividido por uno negativo?"
    choices:
      - {text: "Positivo", is_correct: false}
      - {text: "Negativo", is_correct: true}
      - {text: "Depende de la magnitud", is_correct: false}
      - {text: "No está definido", is_correct: false}
    explanation: "La correcta es Negativo: dividir signos distintos siempre da un cociente negativo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-63) \\div 9$?"
    choices:
      - {text: "$-7$", is_correct: true}
      - {text: "$7$", is_correct: false}
      - {text: "$-54$", is_correct: false}
      - {text: "$54$", is_correct: false}
    explanation: "La correcta es $-7$: se dividen los valores absolutos ($63\\div9=7$) y el resultado es negativo por tener signos distintos."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica el dividendo y el divisor de la operación y verifica que tengan distinto signo (uno positivo y otro negativo).'
  - 'Paso 2: Realiza la división de sus valores absolutos (sin considerar los signos).'
  - 'Paso 3: Asigna un signo negativo ($-$) al resultado final, de acuerdo con la ley de signos para signos distintos.'
errores_correccion: |
  Un error frecuente es aplicar la regla de la suma (el signo del mayor valor absoluto
  domina) en vez de la regla propia de la división. Otro error es olvidar escribir el
  signo negativo en el resultado final.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el resultado de la división $(-42) \div 7$.'
    alternativas:
      - "$-6$"
      - "$6$"
      - "$-49$"
    respuesta: "$-6$"
    solucion_pasos:
      - 'Paso a: Identificamos los signos. El dividendo es negativo ($-42$) y el divisor es positivo ($7$). Tienen signos distintos.'
      - 'Paso b: Dividimos sus valores absolutos: $42 \div 7 = 6$.'
      - 'Paso c: Como los signos son distintos, el resultado es negativo: $-6$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la expresión $\frac{80}{-16}$.'
    alternativas:
      - "$-5$"
      - "$5$"
      - "$-64$"
    respuesta: "$-5$"
    solucion_pasos:
      - 'Paso a: Representa una división entre el entero positivo $80$ y el entero negativo $-16$.'
      - 'Paso b: Dividimos los valores absolutos: $80 \div 16 = 5$.'
      - 'Paso c: Aplicando la regla de signos distintos, el resultado es $-5$.'
  - titulo: '¿Es el resultado de $(-45) \div 9$ un número entero positivo?'
    respuesta: 'No'
    solucion_pasos:
      - 'El dividendo es negativo ($-45$) y el divisor es positivo ($9$).'
      - 'Al tener signos distintos, el cociente debe ser negativo.'
      - 'El resultado es $-5$, el cual es un número entero negativo.'
  - titulo: '¿Da el mismo resultado dividir $36 \div (-4)$ que dividir $(-36) \div 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Para $36 \div (-4)$, los signos son distintos, lo que resulta en $-9$.'
      - 'Para $(-36) \div 4$, los signos también son distintos, resultando en $-9$.'
      - 'Ambas expresiones dan el mismo cociente de $-9$.'
errores_frecuentes:
  - 'Aplicar de forma errónea la regla de la adición (creer que el resultado lleva el signo del número con mayor valor absoluto, por ejemplo, decir que $10 \div (-2) = +5$ porque $10$ es mayor).'
  - 'Olvidar el signo negativo en el resultado final, escribiéndolo como un entero positivo.'
  - 'Confundir las reglas de signos y creer que signos distintos en la división dan un resultado positivo.'
  - 'Intentar dividir por cero si el divisor con signo distinto es nulo (el cero no tiene signo y la división no está definida).'
  - 'Resolver operaciones combinadas de izquierda a derecha sin agrupar adecuadamente los signos negativos.'
afirmaciones_verdaderas:
  - "Al dividir un número positivo por uno negativo, el cociente es negativo."
  - "(-12)÷4 da como resultado un número negativo."
al_terminar_debes_poder: |
  Dividir dos enteros de distinto signo aplicando correctamente la regla de que el
  cociente siempre es negativo.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 48"
estado: publicado
