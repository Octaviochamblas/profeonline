semantic_id: MAT.GEO.TRIG_IDENTIDADES.SECANTE_TANGENTE
resumen_inicial: 'Identidad pitagórica recíproca: uno más tangente cuadrado igual
  a secante cuadrado: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: Esta identidad se obtiene dividiendo la identidad pitagórica fundamental
  por el coseno al cuadrado, transformando seno y coseno en tangente y secante.
explicacion_formal: '![Identidad pitagórica: 1+tan²θ=sec²θ](/static/img/geometria/trigonometria/razon-identidad-secante-tangente.svg)


  ### Definición formal


  Partiendo de $\sin^2\theta+\cos^2\theta=1$ y dividiendo ambos lados por $\cos^2\theta$:
  $\dfrac{\sin^2\theta}{\cos^2\theta}+1=\dfrac{1}{\cos^2\theta}$, es decir, $\tan^2\theta+1=\sec^2\theta$.


  ### Desarrollo didáctico


  Si $\tan\theta=0{,}75$, entonces $\sec^2\theta=1+0{,}75^2=1+0{,}5625=1{,}5625$,
  por lo que $\sec\theta=1{,}25$ (coincidiendo con el recíproco del coseno de ese
  mismo ángulo).'
definiciones_clave: '- **Identidad pitagórica recíproca: uno más tangente cuadrado
