semantic_id: MAT.ALG.FRACCIONES_RESTA.PARENTESIS_NUMERADOR
resumen_inicial: Encerrar entre paréntesis el numerador del sustraendo es el mecanismo
  indispensable para evitar errores en la resta de fracciones.
explicacion_simple: 'Cuando restamos una fracción que tiene varios términos arriba,
  la resta afecta al grupo entero.

  Colocar un paréntesis alrededor del segundo numerador inmediatamente después del
  signo menos es la mejor protección matemática.

  Este paréntesis nos recuerda que al eliminarlo debemos cambiar el signo de cada
  uno de los términos que estaban dentro.'
explicacion_formal: 'Dada la sustracción $\frac{A(x)}{D(x)} - \frac{B(x)}{D(x)}$,
  la **regla del paréntesis protector** establece:


  $$\frac{A(x) - B(x)}{D(x)} \equiv \frac{A(x) - (b_1 x^k + b_2 x^{k-1} + \dots +
  b_0)}{D(x)}$$


  **Desglose de la fórmula:**

  - $-(b_1 x^k + \dots + b_0)$: Garantiza que la negación afecte uniformemente a todos
  los coeficientes del polinomio sustraendo.'
definiciones_clave: '- **Paréntesis protector**: Uso de paréntesis en el polinomio
  sustraendo para garantizar la aplicación de la ley de signos.'
propiedades_relaciones: '- **Prioridad de operaciones**: La distribución de signos
  del paréntesis se realiza antes de cualquier suma o reducción de términos semejantes.'
ejemplo_guiado:
  enunciado: Utiliza paréntesis para restar $\frac{6x + 7}{x + 3} - \frac{x - 2}{x
    + 3}$ y evalúa la suma reducida para $x = 1$.
  pasos:
  - 'Paso 1: Proteger el segundo numerador con paréntesis: $\frac{(6x + 7) - (x -
    2)}{x + 3}$.Paso 2: Distribuir el signo menos: $6x + 7 - x + 2$.Paso 3: Reducir
    términos semejantes: $6x - x = 5x$ y $7 + 2 = 9 \implies \frac{5x + 9}{x + 3}$
    para $x \neq -3$.Paso 4: Evaluar para $x = 1$: $\frac{5(1) + 9}{1 + 3} = \frac{14}{4}
    = \frac{7}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente tras proteger con paréntesis y reducir
    $\frac{6x + 7}{x + 3} - \frac{x - 2}{x + 3}$?
  choices:
  - text: $\frac{5x + 9}{x + 3}$
    is_correct: true
  - text: $\frac{5x + 5}{x + 3}$
    is_correct: false
  - text: $\frac{7x + 9}{x + 3}$
    is_correct: false
  - text: $\frac{5x + 9}{2x + 6}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{5x + 9}{x + 3}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta $\frac{5x + 9}{x + 3}$ para $x = 1$, ¿cuál es el resultado
    simplificado?
  choices:
  - text: $\frac{7}{2}$
    is_correct: true
  - text: $\frac{14}{2}$
    is_correct: false
  - text: $7$
    is_correct: false
  - text: $\frac{5}{2}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{7}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar la barra de fracción con el denominador común.'
- 'Paso 2: Escribir el primer numerador y colocar el signo de resta $-$.'
- 'Paso 3: Abrir un paréntesis y escribir el polinomio del segundo numerador.'
- 'Paso 4: Eliminar el paréntesis cambiando el signo a cada uno de sus términos.'
- 'Paso 5: Reducir los términos semejantes.'
errores_correccion: '- **Error común:** Quitar el paréntesis dejando el signo original
  del segundo término.

  - **Cómo corregirlo:** Recuerda que al quitar el paréntesis precedido por $-$, todos
  los signos interiores deben invertirse.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
