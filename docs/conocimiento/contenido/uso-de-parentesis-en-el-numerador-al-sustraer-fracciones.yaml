semantic_id: MAT.ALG.FRACCIONES_RESTA.PARENTESIS_NUMERADOR
resumen_inicial: Encerrar entre paréntesis el numerador del sustraendo es el mecanismo indispensable para evitar errores en
  la resta de fracciones.
explicacion_simple: 'Cuando restamos una fracción que tiene varios términos en su numerador, la sustracción afecta al grupo
  completo.


  Colocar un paréntesis alrededor del segundo numerador inmediatamente después del signo menos es la mejor regla de protección
  matemática.


  Este paréntesis nos garantiza que al eliminarlo debemos cambiar el signo de cada uno de los términos que se encontraban
  en su interior.


  ![Uso de paréntesis en el numerador al sustraer](/static/img/nodos/uso-de-parentesis-en-el-numerador-al-sustraer-fracciones-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la sustracción $\frac{A(x)}{D(x)} - \frac{B(x)}{D(x)}$, la **regla del paréntesis protector** establece:


  $$\frac{A(x) - B(x)}{D(x)} \equiv \frac{A(x) - (b_1 x^k + b_2 x^{k-1} + \dots + b_0)}{D(x)}$$


  ### Desglose de la fórmula

  - $-(b_1 x^k + \dots + b_0)$: Garantiza que la negación afecte uniformemente a todos los coeficientes del polinomio sustraendo.


  ### Síntesis didáctica

  Proteger el sustraendo con paréntesis asegura que el operador negativo distribuya la inversión de signo sobre cada sumando
  del numerador.

  '
definiciones_clave: '- **Paréntesis protector**: Uso de paréntesis en el polinomio sustraendo para garantizar la aplicación
  de la ley de signos.

  '
propiedades_relaciones: '- **Prioridad de operaciones**: La distribución de signos del paréntesis se realiza antes de cualquier
  suma o reducción de términos semejantes.

  '
ejemplo_guiado:
  enunciado: Utiliza paréntesis para restar $\frac{6x + 7}{x + 3} - \frac{x - 2}{x + 3}$ y evalúa la suma reducida para $x
    = 1$.
  pasos:
  - 'Paso 1: Proteger el segundo numerador con paréntesis: $\frac{(6x + 7) - (x - 2)}{x + 3}$.'
  - 'Paso 2: Distribuir el signo menos: $6x + 7 - x + 2$.'
  - 'Paso 3: Reducir términos semejantes: $6x - x = 5x$ y $7 + 2 = 9 \implies \frac{5x + 9}{x + 3}$ para $x \neq -3$.'
  - 'Paso 4: Evaluar para $x = 1$: $\frac{5(1) + 9}{1 + 3} = \frac{14}{4} = \frac{7}{2}$.'
  imagen: /static/img/nodos/uso-de-parentesis-en-el-numerador-al-sustraer-fracciones-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente tras proteger con paréntesis y reducir $\frac{6x + 7}{x + 3} - \frac{x - 2}{x
    + 3}$?
  choices:
  - text: $\frac{5x + 9}{x + 3}$
    is_correct: true
  - text: $\frac{5x + 5}{x + 3}$
    is_correct: false
  - text: $\frac{7x + 9}{x + 3}$
    is_correct: false
  - text: $\frac{5x + 9}{2x + 6}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{5x + 9}{x + 3}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta $\frac{5x + 9}{x + 3}$ para $x = 1$, ¿cuál es el resultado simplificado?
  choices:
  - text: $\frac{7}{2}$
    is_correct: true
  - text: $\frac{14}{2}$
    is_correct: false
  - text: $7$
    is_correct: false
  - text: $\frac{5}{2}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{7}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar la barra de fracción con el denominador común.'
- 'Paso 2: Escribir el primer numerador y colocar el signo de resta $-$.'
- 'Paso 3: Abrir un paréntesis protector y escribir dentro el polinomio del segundo numerador.'
- 'Paso 4: Eliminar el paréntesis invirtiendo el signo de cada uno de sus términos.'
- 'Paso 5: Reducir los términos semejantes.'
errores_correccion: '- **Error 1:** Omitir el paréntesis y dejar el signo original del término independiente (escribir $-(x
  - 2) = -x - 2$). **Cómo corregirlo:** Al eliminar un paréntesis precedido de un signo menos, **TODOS LOS SIGNOS INTERIORES
  SE INVIERTEN: $-(x - 2) = -x + 2$**.

  - **Error 2:** Aplicar la inversión de signos a los términos del primer numerador. **Cómo corregirlo:** El primer numerador
  **SE CONSERVA CON SUS SIGNOS ORIGINALES; SOLO EL SUSTRAENDO CAMBIA DE SIGNO**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo queda el numerador tras aplicar el paréntesis protector en $5x - (2x - 7)$?
  alternativas:
  - $3x + 7$
  - $3x - 7$
  - $7x + 7$
  respuesta: $3x + 7$
  solucion_pasos:
  - '1. Invertir signos: $5x - 2x + 7$.'
  - '2. Reducir: $3x + 7$.'
- titulo: Ejemplo 2
  enunciado: Al sustraer $(x^2 + 4) - (x^2 - 4)$ en el numerador, ¿cuál es el resultado simplificado?
  alternativas:
  - $8$
  - $0$
  - $2x^2$
  respuesta: $8$
  solucion_pasos:
  - '1. Invertir signos: $x^2 + 4 - x^2 + 4$.'
  - 2. Cancelar $x^2 - x^2 = 0$ y sumar $4 + 4 = 8$.
- titulo: Uso obligatorio del paréntesis
  enunciado: ¿Es indispensable escribir entre paréntesis el numerador sustraído antes de simplificar?
  respuesta: Sí
  solucion_pasos:
  - Sí, evita la omisión del cambio de signo en los términos secundarios.
- titulo: Afectación del primer numerador
  enunciado: ¿El signo menos de la resta altera los signos del primer numerador?
  respuesta: 'No'
  solucion_pasos:
  - No, únicamente afecta al segundo numerador (sustraendo).
errores_frecuentes:
- La eliminación del paréntesis en $-(x-2)$ produce la expresión $-x-2$.
- En la resta $\frac{5x}{D} - \frac{2x-7}{D}$, el signo negativo afecta únicamente al primer término resultando $3x-7$.
- El signo menos que antecede a un paréntesis protector invierte también los signos del primer numerador.
- Al calcular $x^2 + 4 - (x^2 - 4)$, el resultado reducido es $0$.
- La expresión $A - (B + C)$ equivale a $A - B + C$ al retirar los paréntesis.
afirmaciones_verdaderas:
- El paréntesis en el sustraendo garantiza que el signo menos invierta la totalidad de sus términos.
- La eliminación de un paréntesis precedido por signo negativo transforma positivos en negativos y viceversa.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/uso-de-parentesis-en-el-numerador-al-sustraer-fracciones-resumen.svg)


  QUÉ: Aplicar la regla del paréntesis protector en el numerador sustraído.

  CÓMO: Encerrar entre paréntesis el polinomio del segundo numerador tras el operador $-$, distribuir la negación a todos
  sus términos ($A(x) - (B_1 x + B_0) = A(x) - B_1 x - B_0$) y reducir coeficientes semejantes.

  '
