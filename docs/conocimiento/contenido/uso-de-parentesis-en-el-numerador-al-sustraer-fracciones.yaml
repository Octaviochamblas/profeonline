procedimiento:
- 'Paso 1: Escribe el denominador común.'
- 'Paso 2: Escribe el primer numerador.'
- 'Paso 3: Pon un signo menos y ABRE PARÉNTESIS.'
- 'Paso 4: Escribe el segundo numerador dentro del paréntesis.'
- 'Paso 5: En el siguiente renglón, quita el paréntesis cambiando TODOS los signos
  interiores.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en uso de paréntesis en el numerador al sustraer fracciones.
ejemplos:
- titulo: Resta $\frac{a + 4}{2} - \frac{a - 2}{2}$
  enunciado: Resta $\frac{a + 4}{2} - \frac{a - 2}{2}$.
  solucion_pasos:
  - 'Escribimos: $\frac{a + 4 - (a - 2)}{2}$.'
  - 'Distribuimos el menos: $\frac{a + 4 - a + 2}{2}$.'
  - 'Reducimos: las ''a'' se van, $4+2=6$.'
  - Queda $\frac{6}{2} = 3$.
- titulo: Calcula $\frac{3x}{5} - \frac{x+1}{5}$.
  solucion_pasos:
  - El negativo afecta a la 'x' y al '1'. Queda 3x - x - 1 = 2x - 1.
- titulo: 'Respecto de «Uso de paréntesis en el numerador al sustraer fracciones»:
    ¿Describe adecuadame'
  enunciado: 'Respecto de «Uso de paréntesis en el numerador al sustraer fracciones»:
    ¿Describe adecuadamente el concepto esta frase? «Al restar una fracción cuyo numerador
    es un polinomio, debes colocar todo ese polinomio entre paréntesis precedido por
    el signo menos, lo cual cambiará el signo de TODOS sus términos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al restar una fracción cuyo
    numerador es un polinomio, debes colocar todo ese polinomio entre paréntesis precedido
    por el signo menos, lo cual cambiará el signo de TODOS sus términos.'
- titulo: 'Respecto de «Uso de paréntesis en el numerador al sustraer fracciones»:
    ¿Se puede aceptar es'
  enunciado: 'Respecto de «Uso de paréntesis en el numerador al sustraer fracciones»:
    ¿Se puede aceptar esta afirmación? «El ''error del francotirador miope'': restarle
    solo al primer término del segundo numerador y copiar el resto igual»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al restar una fracción cuyo
    numerador es un polinomio, debes colocar todo ese polinomio entre paréntesis precedido
    por el signo menos, lo cual cambiará el signo de TODOS sus términos.'
errores_frecuentes:
- 'El ''error del francotirador miope'': restarle solo al primer término del segundo
