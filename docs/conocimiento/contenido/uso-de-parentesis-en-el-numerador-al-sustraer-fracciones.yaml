semantic_id: MAT.ALG.FRACCIONES_RESTA.PARENTESIS_NUMERADOR
resumen_inicial: 'Uso de paréntesis en el numerador al sustraer fracciones: concepto,
  reglas operativas y simplificación en Sustracción de fracciones algebraicas.'
explicacion_simple: Aquí es donde mueren el 90% de los ejercicios de resta algebraica.
  El signo de resta que separa las fracciones NO ataca solo a la primera letra del
  numerador que le sigue, ataca a TODA la casa.
explicacion_formal: "### Definición formal\n\nEl signo de resta es para toda la fracción,\
  \ lo que equivale a multiplicar el numerador entero por -1.\n\n### Desarrollo didáctico\n\
  \nCuando juntas dos fracciones con una resta, debes activar una alarma roja de emergencia\
  \ en tu cerebro.\n\nEl signo menos ($-$) que estaba entre las fracciones, ahora\
  \ se va a aplicar al segundo numerador. La regla estricta es: **Coloca paréntesis\
  \ invisibles a todo el segundo numerador** antes de aplicarle el menos.\n\nEjemplo\
  \ visual de la trampa:\n$\\frac{3x}{5} - \\frac{x - 2}{5}$\n- Forma incorrecta:\
  \ Conservas el 5 y escribes $3x - x - 2$. (El menos solo afectó a la x). Resultado\
  \ erróneo: $2x-2$.\n- Forma magistral: Conservas el 5 y escribes $3x - (x - 2)$.\
  \ El menos afecta a TODOS los términos dentro del paréntesis.\n  Queda: $3x - x\
  \ + 2$ (el -2 se vuelve +2 por la regla de signos).\n  Resultado correcto: $\\frac{2x\
  \ + 2}{5}$.\n\nEl 90% de los errores en las pruebas al restar fracciones ocurren\
  \ exactamente aquí."
definiciones_clave: '- **Uso de paréntesis en el numerador al sustraer fracciones**:
