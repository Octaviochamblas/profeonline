guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.02.02'
  title: 'Construcción de los reales como unión de racionales e irracionales'
  description: 'Comprende la estructura conjuntista de los números reales como la unión de dos conjuntos mutuamente excluyentes (disjuntos).'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'construccion-de-los-reales-como-union-de-racionales-e-irracionales'
semantic_id: 'MAT.NUM.REALES.UNION_RACIONALES_IRRACIONALES'
titulo: 'Construcción de los reales como unión de racionales e irracionales'
objetivo: 'Demostrar y aplicar la propiedad de partición del conjunto $\mathbb{R}$ a través de los subconjuntos disjuntos $\mathbb{Q}$ e $\mathbb{I}$.'
introduccion: 'Imagina que colocas sobre una mesa todos los números enteros y todas las fracciones conocidas. Aunque pongas infinitas fracciones entre cada par de números, la recta numérica sigue teniendo huecos donde se ubican longitudes no medibles por fracciones, como $\sqrt{2}$ o $\pi$. Para tapar absolutamente todas las fisuras y lograr una recta continua, la matemática une el conjunto de los racionales ($\mathbb{Q}$) con el de los irracionales ($\mathbb{I}$).'
resumen: 'La estructura de los números reales se define conjuntistamente por dos condiciones fundamentales: 1) **Unión completa:** $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$. 2) **Intersección vacía (Disjuntos):** $\mathbb{Q} \cap \mathbb{I} = \emptyset$. Ningún número puede ser simultáneamente racional e irracional.'
requisitos:
  - 'Operaciones básicas con conjuntos (Unión $\cup$, Intersección $\cap$, Conjunto vacío $\emptyset$).'
  - 'Diferencia conceptual entre números racionales e irracionales.'
objetivos:
  - 'Comprender la partición del conjunto $\mathbb{R}$ en $\mathbb{Q}$ e $\mathbb{I}$.'
  - 'Aplicar la propiedad de disyunción ($\mathbb{Q} \cap \mathbb{I} = \emptyset$) en la resolución de problemas.'
que_aprenderas:
  - 'Por qué un número real pertenece a $\mathbb{Q}$ o a $\mathbb{I}$, pero nunca a ambos.'
  - 'La notación de complemento $\mathbb{I} = \mathbb{R} \setminus \mathbb{Q}$.'
  - 'Cómo se distribuyen los diferentes subconjuntos numéricos dentro de $\mathbb{R}$.'
al_terminar_debes_poder:
  - 'Clasificar un número real dado de forma unívoca en $\mathbb{Q}$ o en $\mathbb{I}$.'
  - 'Resolver operaciones algebraicas entre subconjuntos de los números reales.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: 'Si un número $x$ pertenece al conjunto de los números reales ($\mathbb{R}$) y sabemos que $x \notin \mathbb{Q}$, ¿a qué conjunto pertenece $x$ obligatoriamente?'
    choices:
      - {text: 'Al conjunto de los números enteros $\mathbb{Z}$.', is_correct: false}
      - {text: 'Al conjunto de los números irracionales $\mathbb{I}$ (o $\mathbb{R} \setminus \mathbb{Q}$).', is_correct: true}
      - {text: 'Al conjunto de los números imaginarios puro.', is_correct: false}
      - {text: 'No es posible determinarlo.', is_correct: false}
    explanation: 'La correcta es: Al conjunto de los números irracionales $\mathbb{I}$ (o $\mathbb{R} \setminus \mathbb{Q}$). Puesto que $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$ y $\mathbb{Q} \cap \mathbb{I} = \emptyset$, cualquier real que no sea racional es necesariamente irracional.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: '¿Cuál es el resultado de la intersección entre el conjunto de los números racionales $\mathbb{Q}$ y el de los irracionales $\mathbb{I}$?'
    choices:
      - {text: 'El número cero $\{0\}$.', is_correct: false}
      - {text: 'El conjunto de los números reales $\mathbb{R}$.', is_correct: false}
      - {text: 'El conjunto vacío $\emptyset$.', is_correct: true}
      - {text: 'El conjunto de los números enteros $\mathbb{Z}$.', is_correct: false}
    explanation: 'La correcta es: El conjunto vacío $\emptyset$. Los racionales y los irracionales son conjuntos disjuntos; no comparten ningún elemento.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Recordar la definición de partición: $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$ con $\mathbb{Q} \cap \mathbb{I} = \emptyset$.'
  - 'Paso 2: Evaluar la representación del número: si se puede expresar como $\frac{a}{b}$ de enteros, situarlo en $\mathbb{Q}$.'
  - 'Paso 3: Si no es expresable como fracción de enteros, situarlo en $\mathbb{I}$. Concluir su pertenencia a $\mathbb{R}$.'
errores_frecuentes:
  - 'Creer que el número $0$ o el $1$ están en la intersección $\mathbb{Q} \cap \mathbb{I}$.'
  - 'Pensar que existen números reales que no son ni racionales ni irracionales.'
errores_correccion: 'Es un error común pensar que números especiales como el $0$ "no son ni racionales ni irracionales". El $0$ es un número entero ($0 = \frac{0}{1}$), por lo tanto **es estrictamente racional** y pertenece a $\mathbb{Q}$. Todo real pertenece a uno de los dos grupos.'
ejemplos:
  - titulo: 'Operaciones de conjuntos numéricos'
    enunciado: 'Dado el universo $U = \mathbb{R}$, simplifica la expresión de conjuntos $(\mathbb{Q} \cup \mathbb{I}) \cap \mathbb{Q}$.'
    alternativas:
      - '$\mathbb{I}$'
      - '$\mathbb{R}$'
      - '$\mathbb{Q}$'
      - '$\emptyset$'
    respuesta: '$\mathbb{Q}$'
    solucion_pasos:
      - 'Sabemos que la unión $\mathbb{Q} \cup \mathbb{I} = \mathbb{R}$.'
      - 'Sustituyendo en la expresión: $\mathbb{R} \cap \mathbb{Q}$.'
      - 'Dado que $\mathbb{Q} \subset \mathbb{R}$, la intersección entre $\mathbb{R}$ y $\mathbb{Q}$ es simplemente el conjunto $\mathbb{Q}$.'
  - titulo: 'Diferencia de conjuntos en los reales'
    enunciado: '¿A qué es igual el conjunto resultante de la resta $\mathbb{R} \setminus \mathbb{I}$?'
    alternativas:
      - '$\mathbb{Q}$'
      - '$\mathbb{Z}$'
      - '$\mathbb{I}$'
      - '$\emptyset$'
    respuesta: '$\mathbb{Q}$'
    solucion_pasos:
      - 'La resta $\mathbb{R} \setminus \mathbb{I}$ representa todos los elementos que están en $\mathbb{R}$ pero no están en $\mathbb{I}$.'
      - 'Como los reales están formados únicamente por racionales e irracionales, al quitar los irracionales nos queda exactamente el conjunto de los números racionales $\mathbb{Q}$.'
comprobacion_rapida:
  - afirmacion: 'No existe ningún número real que sea simultáneamente racional e irracional.'
    respuesta: true
    explicacion: 'Correcto. Los conjuntos son mutuamente excluyentes ($\mathbb{Q} \cap \mathbb{I} = \emptyset$).'
  - afirmacion: 'El conjunto de los números irracionales se puede denotar formalmente como $\mathbb{R} \setminus \mathbb{Q}$.'
    respuesta: true
    explicacion: 'Correcto. Los irracionales son el complemento de los racionales respecto al universo real.'
  - afirmacion: 'Si un número real no se puede escribir como fracción de enteros, entonces pertenece a $\mathbb{Q}$.'
    respuesta: false
    explicacion: 'Falso. Si no se puede escribir como fracción de enteros, por definición pertenece al conjunto de los irracionales $\mathbb{I}$.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales.'
estado: 'publicado'
