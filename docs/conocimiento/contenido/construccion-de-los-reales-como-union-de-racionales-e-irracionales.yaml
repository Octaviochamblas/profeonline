semantic_id: MAT.NUM.REALES.UNION_RACIONALES_IRRACIONALES
resumen_inicial: Los números racionales (con decimales finitos o periódicos) y los
  irracionales (con decimales infinitos aperiódicos) se unen sin traslape para construir
  el conjunto $\mathbb{R}$.
explicacion_simple: 'Imagínate la recta numérica completa:

  - Los números racionales $\mathbb{Q}$ llenan muchísimos puntos (enteros, fracciones,
  decimales periódicos).

  - Sin embargo, quedan infinitos ''huecos'' entre ellos (como $\sqrt{2}$ o $\pi$).

  - Los números irracionales $\mathbb{I}$ rellenan exactamente todos esos huecos.

  Al juntar $\mathbb{Q}$ y $\mathbb{I}$, la recta queda **100% llena y continua**.'
explicacion_formal: 'La unión disjunta $\mathbb{R} = \mathbb{Q} \sqcup \mathbb{I}$
  es la propiedad de partición del sistema real. Todo $x \in \mathbb{R}$ satisface
  exactamente una de las dos condiciones: $x \in \mathbb{Q}$ o $x \in \mathbb{I}$.'
definiciones_clave: '- **Partición de los reales**: División de $\mathbb{R}$ en dos
  subconjuntos disjuntos $\mathbb{Q}$ e \mathbb{I}$.'
propiedades_relaciones: '- **Complementariedad**: $\mathbb{I} = \mathbb{R} \setminus
  \mathbb{Q}$ y $\mathbb{Q} = \mathbb{R} \setminus \mathbb{I}$.'
ejemplo_guiado:
  enunciado: 'Dada la lista de números: $\{-3; 0{,}5; \sqrt{2}; 7; \pi\}$, sepáralos
    en $\mathbb{Q}$ e $\mathbb{I}$.'
  pasos:
  - 'Identificar racionales $\mathbb{Q}$: $-3$ (entero), $0{,}5 = 1/2$ (decimal finito),
    $7$ (entero). Luego $\mathbb{Q} = \{-3; 0{,}5; 7\}$.'
  - 'Identificar irracionales $\mathbb{I}$: $\sqrt{2}$ (raíz no exacta), $\pi$ (constante
    aperiódica). Luego $\mathbb{I} = \{\sqrt{2}; \pi\}$.'
  - Verificar que la unión de ambos conjuntos recupera la lista original.
checkpoints:
- placement: after_explicacion_formal
  question: Si tomamos la intersección del conjunto Q con el conjunto I, ¿qué resultado
    se obtiene?
  choices:
  - text: El conjunto vacío (∅)
    is_correct: true
  - text: El conjunto de los números enteros Z
    is_correct: false
  - text: El conjunto de los números reales R
    is_correct: false
  - text: El número cero {0}
    is_correct: false
  explanation: 'La correcta es: El conjunto vacío (∅). No existe ningún número que
    sea racional e irracional al mismo tiempo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué conjunto se obtiene si a los Números Reales R le restamos los Números
    Racionales Q?
  choices:
  - text: El conjunto de los Números Irracionales (I)
    is_correct: true
  - text: El conjunto de los Números Enteros (Z)
    is_correct: false
  - text: El conjunto de los Números Naturales (N)
    is_correct: false
  - text: El conjunto vacío
    is_correct: false
  explanation: 'La correcta es: El conjunto de los Números Irracionales (I). Por definición
    $\mathbb{R} \setminus \mathbb{Q} = \mathbb{I}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar las características decimales o fraccionarias de cada número.'
- 'Paso 2: Asignar a $\mathbb{Q}$ si es racional o a $\mathbb{I}$ si es irracional.'
- 'Paso 3: Confirmar que la unión da el conjunto total de los reales.'
errores_correccion: No pongas ningún elemento en común entre $\mathbb{Q}$ e $\mathbb{I}$.
  Su intersección es siempre vacía.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿$\mathbb{Q} \cup \mathbb{I} = \mathbb{R}$?
  alternativas:
  - Verdadero
  - Falso
  respuesta: Verdadero
  solucion_pasos:
  - La unión de racionales e irracionales conforma los números reales.
errores_frecuentes:
- Pensar que hay números que pertenecen simultáneamente a $\mathbb{Q}$ y a $\mathbb{I}$.
afirmaciones_verdaderas:
- $\mathbb{Q} \cap \mathbb{I} = \emptyset$ y $\mathbb{Q} \cup \mathbb{I} = \mathbb{R}$.
al_terminar_debes_poder: Clasificar números en los subconjuntos disjuntos $\mathbb{Q}$
  e $\mathbb{I}$.
fuente: Texto escolar MINEDUC.
estado: publicado
