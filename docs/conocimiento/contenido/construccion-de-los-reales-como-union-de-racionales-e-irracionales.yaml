semantic_id: MAT.NUM.REALES.UNION_RACIONALES_IRRACIONALES
resumen_inicial: La construcción de $\mathbb{R}$ como unión $\mathbb{Q} \cup \mathbb{I}$
  establece una partición perfecta del universo real, donde cada real es o racional
  o irracional pero jamás ambos.
explicacion_simple: Si tomamos todos los números racionales (fracciones, decimales
  exactos y periódicos) y los juntamos con todos los números irracionales (decimales
  infinitos sin patrón), formamos el conjunto completo de los números reales. No queda
  ningún número real fuera de esta unión, ni tampoco ningún número que pertenezca
  a ambos a la vez.
explicacion_formal: 'La **Partición de los Reales** establece que los subconjuntos
  $\mathbb{Q}$ e $\mathbb{I}$ forman una cobertura disjunta exacta de $\mathbb{R}$:


  $$\mathbb{R} = \mathbb{Q} \cup \mathbb{I} \quad \wedge \quad \mathbb{Q} \cap \mathbb{I}
  = \emptyset$$


  **Desglose de la fórmula:**

  - Cobertura completa: $\forall x \in \mathbb{R}, \, (x \in \mathbb{Q}) \lor (x \in
  \mathbb{I})$.

  - Mutua exclusión: $\neg (x \in \mathbb{Q} \wedge x \in \mathbb{I})$. Todo real
  pertenece a uno y solo uno de los dos subconjuntos.


  > **Complemento didáctico:** Esta partición permite clasificar cualquier número
  real mediante la prueba de representación en fracción de enteros.'
definiciones_clave: '- **Unión disjunta $\mathbb{Q} \cup \mathbb{I}$**: Propiedad
  estructural que divide a $\mathbb{R}$ en dos clases mutuamente excluyentes y exhaustivas.'
propiedades_relaciones: '- **Exclusión mutua**: Ningún número real puede pertenecer
  simultáneamente a $\mathbb{Q}$ y a $\mathbb{I}$.'
ejemplo_guiado:
  enunciado: Verifique la pertenencia disjunta en la partición $\mathbb{R} = \mathbb{Q}
    \cup \mathbb{I}$ para los números $0,75$ y $\sqrt{3}$.
  pasos:
  - 'Paso 1: Analizar $0,75$: equivale a la fracción $\frac{3}{4} \in \mathbb{Q}$.
    Por lo tanto $0,75 \notin \mathbb{I}$.'
  - 'Paso 2: Analizar $\sqrt{3}$: es una raíz no exacta $\in \mathbb{I}$. Por lo tanto
    $\sqrt{3} \notin \mathbb{Q}$.'
  - 'Paso 3: Unir ambos conjuntos: ambos números pertenecen a la unión $\mathbb{Q}
    \cup \mathbb{I} = \mathbb{R}$.'
  - 'Conclusión: Queda demostrada la pertenencia disjunta a $\mathbb{Q}$ o $\mathbb{I}$
    dentro de $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre si intentamos encontrar la intersección entre el conjunto
    Q de racionales y el conjunto I de irracionales?
  choices:
  - text: Es el conjunto vacío (Q n I = vacio), no comparten ningún elemento
    is_correct: true
  - text: Es el número 0
    is_correct: false
  - text: Es el conjunto de los enteros
    is_correct: false
  - text: Es igual a todos los reales
    is_correct: false
  explanation: La alternativa correcta es 'Es el conjunto vacío (Q n I = vacio), no
    comparten ningún elemento'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 0,75 y sqrt(3) confirman la partición de
    R?
  choices:
  - text: Porque 0,75 es racional y sqrt(3) es irracional, perteneciendo ambos a R
      sin solaparse
    is_correct: true
  - text: Porque los dos son racionales
    is_correct: false
  - text: Porque los dos son enteros
    is_correct: false
  - text: No la confirman
    is_correct: false
  explanation: La alternativa correcta es 'Porque 0,75 es racional y sqrt(3) es irracional,
    perteneciendo ambos a R sin solaparse'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar si el número se puede escribir como fracción $a/b$ ($a,b \in
  \mathbb{Z}$).'
- 'Paso 2: Asignarlo al subconjunto correspondiente ($\mathbb{Q}$ si es fraccionario,
  $\mathbb{I}$ si es decimal no periódico).'
- 'Paso 3: Concluir que pertenece al conjunto unión $\mathbb{R} = \mathbb{Q} \cup
  \mathbb{I}$.'
errores_correccion: '- **Error 1: Creer que existen números reales que no son ni racionales
  ni irracionales.** **Cómo corregirlo:** $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$
  es exhaustivo; TODO número real pertenece a alguno de los dos.


  - **Error 2: Pensar que pi pertenece a $\mathbb{Q} \cap \mathbb{I}$.** **Cómo corregirlo:**
  La intersección es VACÍA; $\pi$ es puramente irracional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué subconjunto de $\mathbb{R}$ pertenece $-2/3$?
  alternativas:
  - A los números racionales Q
  - A los números irracionales I
  - A ambos simultáneamente
  respuesta: A los números racionales Q
  solucion_pasos:
  - $-2/3 \in \mathbb{Q} \subset \mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: Si $x \in \mathbb{R}$ y $x \notin \mathbb{Q}$, ¿qué se puede deducir
    de $x$?
  alternativas:
  - Que x pertenece obligatoriamente al conjunto I de los irracionales
  - Que x no existe
  - Que x es un entero
  respuesta: Que x pertenece obligatoriamente al conjunto I de los irracionales
  solucion_pasos:
  - Por ser la unión disjunta $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.
- titulo: ¿Es la unión de Q e I igual al conjunto R?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\mathbb{Q} \cup \mathbb{I} = \mathbb{R}$ por definición de construcción.
- titulo: ¿Puede un número ser racional e irracional al mismo tiempo?
  respuesta: 'No'
  solucion_pasos:
  - No, son conjuntos mutuamente excluyentes ($\mathbb{Q} \cap \mathbb{I} = \emptyset$).
errores_frecuentes:
- Existen números reales que pertenecen al mismo tiempo al conjunto Q y al conjunto
  I.
- La unión de los racionales y los irracionales produce el conjunto de los números
  imaginarios.
- Un número real puede no ser ni racional ni irracional dentro del sistema real.
- La intersección entre los racionales e irracionales contiene a todas las fracciones
  negativas.
- Unir racionales e irracionales exige eliminar los números enteros.
afirmaciones_verdaderas:
- Los conjuntos $\mathbb{Q}$ e $\mathbb{I}$ forman una partición disjunta y completa
  del conjunto $\mathbb{R}$.
- Todo número real es o bien un número racional o bien un número irracional de forma
  excluyente.
al_terminar_debes_poder: Al terminar serás capaz de clasificar cualquier número real
  dentro de la partición disjunta $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$, fundamentando
  su pertenencia a $\mathbb{Q}$ o $\mathbb{I}$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
