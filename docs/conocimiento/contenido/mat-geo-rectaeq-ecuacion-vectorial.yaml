semantic_id: MAT.GEO.RECTA_ECUACIONES.ECUACION_VECTORIAL
resumen_inicial: 'Reconocimiento de la ecuación vectorial de la recta en el plano:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La ecuación vectorial expresa la recta en términos de un punto
  de referencia y un vector director, permitiendo generar todos los puntos de la recta
  al variar un parámetro.
explicacion_formal: '![Ecuación vectorial de la recta](/static/img/geometria/analitica/rectaeq-ecuacion-vectorial.svg)


  ### Definición formal


  La ecuación vectorial de una recta es $(x,y)=(x_0,y_0)+t\cdot(d_1,d_2)$, donde $(x_0,y_0)$
  es un punto conocido de la recta, $(d_1,d_2)$ es su vector director, y $t$ es un
  parámetro real que genera todos los puntos de la recta al variar.


  ### Desarrollo didáctico


  Para la recta que pasa por $(0,1)$ con vector director $(4,3)$: $(x,y)=(0,1)+t(4,3)$.
  Si $t=1$, se obtiene el punto $(4,4)$; si $t=-1$, se obtiene $(-4,-2)$.'
definiciones_clave: '- **Reconocimiento de la ecuación vectorial de la recta en el
