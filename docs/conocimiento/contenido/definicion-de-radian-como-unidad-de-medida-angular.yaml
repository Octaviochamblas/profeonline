semantic_id: MAT.GEO.MEDICION_ANGULAR.RADIAN_DEFINICION
resumen_inicial: El radián es la unidad de medida angular del Sistema Internacional
  (SI), definido como el ángulo central que subtiende un arco de circunferencia cuya
  longitud es igual a su radio.
explicacion_simple: '![Definición de Radián](/static/img/nodos/definicion-de-radian-como-unidad-de-medida-angular-intro.svg)


  Imagina que tomas una cuerda que mide exactamente lo mismo que el radio de un círculo
  y la colocas sobre el borde (circunferencia). El ángulo que se abre desde el centro
  hacia los extremos de esa cuerda mide exactamente **1 radián** (aproximadamente
  $57{,}3^\circ$).'
explicacion_formal: '### Definición formal

  El **radián** (rad) es la unidad de medida angular del Sistema Internacional (SI),
  definida como el ángulo central que subtiende un arco de circunferencia cuya longitud
  de arco $s$ es exactamente igual al radio $r$ de dicha circunferencia:


  $$\theta = \frac{s}{r} \text{ rad} \iff s = \theta \cdot r \quad (\text{con } \theta
  \text{ en radianes})$$


  $$\text{Para } s = r \implies \theta = 1 \text{ rad} \approx 57{,}2958^\circ$$


  ### Desglose simbólico y geométrico

  - $s$: Longitud de la trayectoria del arco subtendido.

  - $r$: Longitud del radio de la circunferencia.

  - Magnitud adimensional: Al ser cociente de dos longitudes ($[L]/[L]$), el radián
  es una unidad pura adimensional.


  ### Síntesis didáctica

  El radián es la unidad natural del análisis matemático porque simplifica el cálculo
  diferencial e integral de funciones trigonométricas y fórmulas de longitud de arco.'
definiciones_clave: '- **Radián ($\text{rad}$)**: Ángulo central cuyo arco mide igual
  que el radio ($s = r$).

  - **Unidad adimensional**: Razón de longitudes $\frac{\text{longitud}}{\text{longitud}}$
  sin dimensión física. '
propiedades_relaciones: '- **Fórmula del arco**: Permite calcular la longitud de un
  arco circular como $s = r \cdot \theta$ (con $\theta$ en radianes).

  - **Valor numérico en grados**: $1\text{ rad} = \frac{180^\circ}{\pi} \approx 57{,}2958^\circ
  \approx 57^\circ 17'' 45''''$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Radián](/static/img/nodos/definicion-de-radian-como-unidad-de-medida-angular-ejemplos.svg)


    En una circunferencia de radio $r = 6\text{ cm}$, un ángulo central subtiende
    un arco de longitud $s = 18\text{ cm}$. ¿Cuánto mide el ángulo central en radianes?'
  pasos:
  - 'Paso 1: Recordar la definición de ángulo en radianes: $\theta = \frac{s}{r}$.'
  - 'Paso 2: Sustituir los valores dados: $\theta = \frac{18\text{ cm}}{6\text{ cm}}$.'
  - 'Paso 3: Simplificar el cociente: $\theta = 3\text{ rad}$.'
  - 'Paso 4: Concluir que el ángulo central mide $3\text{ radianes}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente la medida de un ángulo en radianes?
  choices:
  - text: Como el cociente entre la longitud del arco y el radio (s / r)
    is_correct: true
  - text: Como el producto del radio por el diámetro
    is_correct: false
  - text: Como la división de 360 entre el radio
    is_correct: false
  - text: Como el área del sector circular
    is_correct: false
  explanation: Como el cociente entre la longitud del arco y el radio (s / r).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Aproximadamente cuántos grados sexagesimales mide 1 radián?
  choices:
  - text: Aproximadamente 57,3° (porque 180° / π ≈ 57,2958°)
    is_correct: true
  - text: Exactamente 1°
    is_correct: false
  - text: Exactamente 90°
    is_correct: false
  - text: Exactamente 180°
    is_correct: false
  explanation: Un radián equivale a 180° / π, es decir aproximadamente 57,3° (porque
    180° / π ≈ 57,2958°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la longitud del arco $s$ y el radio $r$ de la circunferencia.'
- 'Paso 2: Aplicar la fórmula del radián $\theta = \frac{s}{r}$.'
- 'Paso 3: Expresar el resultado con la unidad $\text{rad}$.'
errores_correccion: 'No confundas 1 radián con 1 grado: 1 radián es casi 57,3 veces
  más grande que 1 grado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en una circunferencia de radio $r = 5\text{ cm}$ el arco mide $s =
    5\text{ cm}$, ¿cuánto mide el ángulo central?
  alternativas:
  - $1\text{ rad}$
  - $5\text{ rad}$
  - $0{,}5\text{ rad}$
  respuesta: $1\text{ rad}$
  solucion_pasos:
  - $ heta = \frac{s}{r} = \frac{5}{5} = 1\text{ rad}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos radianes mide una vuelta completa alrededor de un círculo?
  alternativas:
  - $2\pi\text{ rad}$
  - $\pi\text{ rad}$
  - $4\pi\text{ rad}$
  respuesta: $2\pi\text{ rad}$
  solucion_pasos:
  - El perímetro es $2\pi r$, luego $ heta = \frac{2\pi r}{r} = 2\pi\text{ rad}$.
- titulo: ¿Un radián es la unidad de medida angular del Sistema Internacional?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la unidad derivada estándar para ángulos en el SI.
- titulo: ¿Un radián mide exactamente 1°?
  respuesta: 'No'
  solucion_pasos:
  - No, $1\text{ rad} \approx 57{,}3^\circ$.
errores_frecuentes:
- Creer que $1\text{ rad} = 1^\circ$.
- Usar la fórmula $s = r \cdot \theta$ ingresando $\theta$ en grados sin convertirlo
  a radianes.
- Olvidar que una vuelta completa son $2\pi\text{ rad}$ y no $\pi\text{ rad}$.
- Confundir el radián con el gradian ($^\text{g}$).
- Calcular el cociente invirtiendo los términos (hacer $r/s$ en vez de $s/r$).
afirmaciones_verdaderas:
- Un radián es el ángulo central donde el arco mide igual que el radio.
- Una circunferencia completa mide exactamente $2\pi\text{ rad}$.
al_terminar_debes_poder: '**QUÉ:** Comprender la definición geométrica y analítica
  del radián.


  **CÓMO:** Calculando ángulos centrales como la razón arco/radio $\theta = \frac{s}{r}$.


  ![Resumen de la Definición de Radián](/static/img/nodos/definicion-de-radian-como-unidad-de-medida-angular-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
