- titulo: ¿Se cumple siempre la propiedad principal de definición de mediana del trapecio
    en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede definición de mediana del trapecio asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en definición de mediana del trapecio.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en definición
