semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.MEDIANA_TRAPECIO_DEFINICION
resumen_inicial: 'Definición de mediana del trapecio: conceptos, teoremas, propiedades
  geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Así como un triángulo tiene medianas hacia sus vértices, el trapecio
  tiene un segmento especial, también llamado mediana, con una ubicación y propiedades
  particulares.
explicacion_formal: '![Mediana de un trapecio](/static/img/geometria/poligonos-cuadrilateros/trapecios-mediana-definicion.svg)


  ### Definición formal


  En un trapecio $ABCD$ con lados laterales $AD$ y $BC$, la mediana es el segmento
  que une el punto medio de $AD$ con el punto medio de $BC$.


  ### Desarrollo didáctico


  A diferencia de la mediana de un triángulo (que va de un vértice al punto medio
  del lado opuesto), la mediana del trapecio conecta los puntos medios de los dos
  lados no paralelos, y resulta ser paralela a ambas bases.'
definiciones_clave: '- **Definición de mediana del trapecio**: Elemento o propiedad
  fundamental en el estudio de polígonos y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de mediana del trapecio.'
