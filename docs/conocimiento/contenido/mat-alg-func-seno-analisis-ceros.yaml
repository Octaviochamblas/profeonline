semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.CEROS
resumen_inicial: 'Identificación de los ceros o raíces de la función seno $f(x) = \sin(x)$ como el conjunto de múltiplos enteros de $\pi$.'
explicacion_simple: |
  Los **ceros** o raíces de una función son los puntos en el eje horizontal ($x$) donde la gráfica toca o cruza la altura cero ($y = 0$). En el círculo unitario, la altura es cero en la derecha ($0$) y en la izquierda ($\pi$). Al dar vueltas completas hacia la derecha o hacia la izquierda, la función seno vuelve a valer cero en $0, \pi, 2\pi, 3\pi, 4\pi, \dots$ y también en $-\pi, -2\pi, -3\pi, \dots$. Es decir, los ceros del seno ocurren exactamente en todos los múltiplos enteros del número $\pi$.
explicacion_formal: |
  ### Definición formal
  El **conjunto de ceros (o raíces)** de la función seno fundamental $f(x) = \sin(x)$ es el conjunto discreto infinito de números reales definidos por la solución de la ecuación trigonométrica $\sin(x) = 0$:
  $$\mathcal{Z}(\sin) = \{x \in \mathbb{R} : \sin(x) = 0\} = \{k\pi : k \in \mathbb{Z}\}$$
  donde $k$ representa cualquier número entero ($\dots, -2, -1, 0, 1, 2, \dots$).

  ### Desglose simbólico
  - $x = 0$ ($k = 0$): Cero en el origen $(0,0)$.
  - $x = \pi$ ($k = 1$): Cero en la mitad del primer ciclo $(\pi, 0)$.
  - $x = 2\pi$ ($k = 2$): Cero al completar un ciclo $(2\pi, 0)$.
  - $x = -\pi$ ($k = -1$): Cero en el sentido negativo $(-\pi, 0)$.

  ### Síntesis didáctica
  Los ceros dividen a la sinusoide en semi-ondas alternadas por encima e inferior al eje horizontal. La distancia entre dos ceros consecutivos de la función seno base es exactamente constante e igual a $\pi$ radianes ($180^\circ$).
definiciones_clave: |
  - **Ceros / Raíces de la función**: Puntos del dominio donde el valor de la función se anula ($f(x) = 0$).
  - **Conjunto discreto $k\pi$**: Expresión analítica universal que representa todos los múltiplos enteros de $\pi$.
  - **Intersecciones con el eje X**: Puntos cartesianos de la forma $(k\pi, 0)$.
propiedades_relaciones: |
  - **Espaciamiento equidistante**: La distancia horizontal entre cualquier par de ceros consecutivos es siempre de $\pi$ unidades.
  - **Puntos de inflexión**: Todos los ceros de la función seno base $f(x) = \sin(x)$ son simultáneamente puntos de inflexión donde cambia la concavidad de la curva.
ejemplo_guiado:
  enunciado: 'Encuentra los ceros de la función $f(x) = \sin(2x)$ en el intervalo $[0, 2\pi]$.'
  pasos:
    - 'Paso 1: Plantear la ecuación de ceros igualando el argumento a la fórmula general $k\pi$: $2x = k\pi$.'
    - 'Paso 2: Despejar la variable $x$: $x = \frac{k\pi}{2}$ para $k \in \mathbb{Z}$.'
    - 'Paso 3: Sustituir valores enteros de $k$ para encontrar las soluciones en $[0, 2\pi]$:
      - $k = 0 \implies x = 0$
      - $k = 1 \implies x = \frac{\pi}{2}$
      - $k = 2 \implies x = \pi$
      - $k = 3 \implies x = \frac{3\pi}{2}$
      - $k = 4 \implies x = 2\pi$'
    - 'Paso 4: Concluir que los ceros en dicho intervalo son $\left\{0, \frac{\pi}{2}, \pi, \frac{3\pi}{2}, 2\pi\right\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la expresión analítica que representa a todos los ceros de la función seno base $f(x) = \sin(x)$?'
    choices:
      - {text: '$x = k\pi$ con $k \in \mathbb{Z}$', is_correct: true}
      - {text: '$x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = 2k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = \frac{k\pi}{4}$ con $k \in \mathbb{Z}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = k\pi$ con $k \in \mathbb{Z}$''. La función seno se anula en todos los múltiplos enteros de $\pi$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la distancia constante entre dos ceros consecutivos de la función seno base?'
    choices:
      - {text: '$\pi$ radianes ($180^\circ$)', is_correct: true}
      - {text: '$2\pi$ radianes ($360^\circ$)', is_correct: false}
      - {text: '$\frac{\pi}{2}$ radianes ($90^\circ$)', is_correct: false}
      - {text: '$\frac{\pi}{4}$ radianes ($45^\circ$)', is_correct: false}
    explanation: 'La alternativa correcta es ''$\pi$ radianes ($180^\circ$)''. Los ceros consecutivos (como $0, \pi, 2\pi$) distan exactamente $\pi$ entre sí.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Igualar la función a cero: $\sin(\text{argumento}) = 0$.'
  - 'Paso 2: Asignar al argumento la expresión general de los ceros: $\text{argumento} = k\pi$ para $k \in \mathbb{Z}$.'
  - 'Paso 3: Despejar la variable $x$ de la ecuación algebráica.'
  - 'Paso 4: Seleccionar las soluciones pertenecientes al intervalo específico solicitado en el problema.'
errores_correccion: |
  - **Error 1:** Confundir los ceros del seno con los ceros del coseno (creer que el seno es cero en $\frac{\pi}{2}$). **Cómo corregirlo:** En $\frac{\pi}{2}$ el seno alcanza su valor máximo $+1$. El seno se anula únicamente en los múltiplos de $\pi$ ($0, \pi, 2\pi, \dots$).
  - **Error 2:** Considerar únicamente las soluciones positivas u olvidar el cero en el origen. **Cómo corregirlo:** El conjunto de ceros abarca a todos los enteros $k \in \mathbb{Z}$, incluyendo $k = 0$ ($x = 0$) y los enteros negativos ($x = -\pi, -2\pi$).
ejemplos:
  - titulo: 'Cero en el origen'
    enunciado: '¿Es el punto $(0,0)$ un cero de la función $f(x) = \sin(x)$?'
    alternativas:
      - 'Sí, pues $\sin(0) = 0$'
      - 'No, el primer cero es $\pi$'
      - 'No, el seno no pasa por el origen'
    respuesta: 'Sí, pues $\sin(0) = 0$'
    solucion_pasos:
      - '1. Evaluamos $f(0) = \sin(0) = 0$.'
      - '2. Corta al eje X en $(0,0)$.'
  - titulo: 'Ceros en un ciclo base'
    enunciado: '¿Cuántos ceros tiene la función seno base en el intervalo cerrado $[0, 2\pi]$?'
    alternativas:
      - '3 ceros ($0, \pi, 2\pi$)'
      - '2 ceros ($\pi, 2\pi$)'
      - '1 cero ($\pi$)'
    respuesta: '3 ceros ($0, \pi, 2\pi$)'
    solucion_pasos:
      - '1. En $[0, 2\pi]$, $k = 0 \implies x = 0$, $k = 1 \implies x = \pi$, $k = 2 \implies x = 2\pi$.'
      - '2. Hay 3 intersecciones con el eje X.'
  - titulo: 'Cero en ángulo negativo'
    enunciado: '¿Es $x = -3\pi$ un cero de la función seno base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $-3\pi = (-3)\pi$, donde $k = -3 \in \mathbb{Z}$.'
  - titulo: 'Evaluación en pi medios'
    enunciado: '¿El valor $x = \frac{\pi}{2}$ es un cero de la función seno base?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, en $x = \frac{\pi}{2}$ el seno alcanza su valor máximo $y = 1$, no cero.'
errores_frecuentes:
  - 'La afirmación de que los ceros de la función seno ocurren en los múltiplos de $\frac{\pi}{2}$.'
  - 'La afirmación de que el origen $(0,0)$ no es un cero de la función seno.'
  - 'La afirmación de que la función seno posee un número finito de ceros en todo el plano real.'
  - 'La afirmación de que los ceros del seno y del coseno ocurren en los mismos puntos exactamente.'
  - 'La afirmación de que los ceros negativos no existen para la función seno.'
afirmaciones_verdaderas:
  - 'Los ceros de la función seno base $f(x) = \sin(x)$ coinciden de forma exacta con el conjunto de los múltiplos enteros de $\pi$ ($x = k\pi$ con $k \in \mathbb{Z}$).'
  - 'La distancia horizontal entre cualquier par de ceros consecutivos de la función seno base es constante e igual a $\pi$ radianes.'
al_terminar_debes_poder: |
  QUÉ: Identificar y resolver ecuaciones para encontrar los ceros de la función seno y sus transformaciones.
  CÓMO: Igualar el argumento de la función a la expresión analítica $k\pi$ ($k \in \mathbb{Z}$) y despejar la variable $x$.
