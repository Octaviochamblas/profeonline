semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CRITERIO_ALA
resumen_inicial: 'Criterio de congruencia ALA: ángulo, lado comprendido, ángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'El tercer criterio abreviado de congruencia invierte el rol de
  lados y ángulos respecto a LAL: en vez de un ángulo entre dos lados, se usan dos
  ángulos y el lado entre ellos.'
explicacion_formal: '![Criterio de congruencia ALA](/static/img/geometria/congruencia-semejanza/congruencia-criterio-ala.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C''$ se cumple $\angle B=\angle B''$, $BC=B''C''$
  y $\angle C=\angle C''$ (con el lado BC comprendido entre los ángulos B y C), entonces
  $\triangle ABC\cong\triangle A''B''C''$.


  ### Desarrollo didáctico


  Al igual que en LAL, la posición del lado importa: debe estar exactamente entre
  los dos ángulos conocidos. Este criterio es muy usado cuando se conocen dos ángulos
  de un triángulo (y por lo tanto el tercero, por suma 180°) junto con la longitud
  de un lado entre dos de ellos.'
definiciones_clave: '- **Criterio de congruencia ALA: ángulo, lado comprendido, ángulo**:
  Elemento o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a criterio de congruencia ala: ángulo, lado
  comprendido, ángulo.'
ejemplo_guiado:
  enunciado: 'Para analizar criterio de congruencia ala: ángulo, lado comprendido,
    ángulo, considera un ángulo $\alpha = 100^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1087^\circ = 100^\circ$.'
  pasos:
  - 'Identificar la propiedad de criterio de congruencia ala: ángulo, lado comprendido,
    ángulo referida a $\alpha = 100^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1087 = 100 \implies x = 100 - 1087$.'
  - 'Concluir que la medida calculada para criterio de congruencia ala: ángulo, lado
    comprendido, ángulo es $x = -987^\circ$.'
