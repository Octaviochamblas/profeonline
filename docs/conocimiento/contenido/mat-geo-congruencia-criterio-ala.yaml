procedimiento:
- 'Paso 1: Identifica dos ángulos de cada triángulo que quieras comparar.'
- 'Paso 2: Verifica que el lado comprendido entre esos dos ángulos también sea igual
  en ambos triángulos.'
- 'Paso 3: Si los dos ángulos y el lado comprendido coinciden, concluye congruencia
  por ALA.'
