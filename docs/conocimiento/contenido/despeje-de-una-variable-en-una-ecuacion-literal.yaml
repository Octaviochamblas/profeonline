semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_VARIABLE
resumen_inicial: Despejar una variable consiste en aislarla por completo en un miembro
  de la ecuación utilizando operaciones inversas.
explicacion_simple: 'Despejar una variable en una ecuación literal significa dejar
  a esa letra completamente ''sola'' y positiva en un lado del signo igual.

  Para lograrlo, aplicamos las reglas habituales de transposición de términos:

  lo que está sumando pasa restando, lo que está restando pasa sumando, y si la incógnita
  figura en varios términos, factorizamos la letra para aislarla.'
explicacion_formal: 'Dada la ecuación con la variable en múltiples términos $a x +
  b x = c + d$, el **despeje por factorización** se realiza mediante:


  $$(a + b) x = c + d \implies x = \frac{c + d}{a + b} \quad \text{con } a + b \neq
  0$$


  **Desglose de la fórmula:**

  - Factorización de la incógnita $x$ como factor común $x(a + b)$.

  - División entre el binomio parámetro resultante $(a + b)$.'
definiciones_clave: '- **Despeje de variable**: Secuencia de transformaciones algebraicas
  para aislar la incógnita en un miembro con coeficiente 1.

  - **Factor común de la incógnita**: Técnica para agrupar $x$ cuando aparece en más
  de un término de la ecuación.'
propiedades_relaciones: '- **Restricción de división**: Dividir entre una suma de
  parámetros $(a + b)$ exige la condición explícita $a + b \neq 0$.'
ejemplo_guiado:
  enunciado: Despeja la variable $x$ en la ecuación literal $a x + 5 = c - b x$ indicando
    las restricciones paramétricas.
  pasos:
  - 'Paso 1: Agrupar los términos con la incógnita $x$ en el primer miembro: $a x
    + b x + 5 = c$.Paso 2: Trasponer la constante $+5$ al segundo miembro: $a x +
    b x = c - 5$.Paso 3: Factorizar la incógnita $x$ como factor común en el primer
    miembro: $x(a + b) = c - 5$.Paso 4: Trasponer $(a + b)$ dividiendo: $x = \frac{c
    - 5}{a + b}$ para $a + b \neq 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $x$ en la ecuación $a x + b x = c - 5$, ¿cuál es la expresión
    resultante?
  choices:
  - text: $x = \frac{c - 5}{a + b}$
    is_correct: true
  - text: $x = \frac{c - 5}{a \cdot b}$
    is_correct: false
  - text: $x = (c - 5)(a + b)$
    is_correct: false
  - text: $x = \frac{c + 5}{a - b}$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{c - 5}{a + b}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para que el despeje $x = \frac{c - 5}{a + b}$ sea válido en los números
    reales, ¿qué restricción deben cumplir los parámetros?
  choices:
  - text: $a + b \neq 0$
    is_correct: true
  - text: $c - 5 \neq 0$
    is_correct: false
  - text: $a \cdot b \neq 0$
    is_correct: false
  - text: $x \neq 0$
    is_correct: false
  explanation: La alternativa correcta es '$a + b \neq 0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trasponer todos los términos que contengan a la variable a despejar hacia
  un mismo miembro.'
- 'Paso 2: Trasponer todos los demás términos independientes hacia el otro miembro.'
- 'Paso 3: Extraer la variable deseada como factor común.'
- 'Paso 4: Pasar dividiendo la expresión que multiplica a la variable factorizada.'
- 'Paso 5: Declarar que el divisor paramétrico debe ser distinto de cero.'
errores_correccion: '- **Error común:** Intentar pasar a dividir un parámetro mientras
  la variable sigue atrapada en otros términos.

  - **Cómo corregirlo:** Si la variable aparece en dos términos, junta primero ambas
  variables en un lado y FACTORÍZALA.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de despeje.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de despeje.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se pueden usar las reglas comunes de transposición en ecuaciones literales?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros se comportan exactamente igual que los números.
- titulo: ¿Dividir entre un parámetro exige la condición de ser distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la indefinición por cero.
errores_frecuentes:
- Confundir la incógnita a despejar con las letras que actúan como parámetros.
- Olvidar factorizar la incógnita cuando aparece en más de un término.
- Sumar o trasponer parámetros cambiando su operación equivocadamente.
- Dividir entre un parámetro sin aclarar la restricción de ser no nulo.
- Tratar las variables físicas con subíndices como si fueran términos idénticos.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o
  parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para
  realizar su despeje.
al_terminar_debes_poder: Al finalizar este recurso podrás despejar cualquier variable
  en ecuaciones literales y fórmulas científicas indicando sus restricciones.
