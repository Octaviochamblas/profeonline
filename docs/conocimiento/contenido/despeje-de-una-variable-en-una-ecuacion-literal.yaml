semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_VARIABLE
resumen_inicial: Despejar una variable consiste en aislarla por completo en uno de los miembros de la ecuación utilizando operaciones inversas y factorización.
explicacion_simple: |
  Despejar una variable en una ecuación literal significa dejar a esa letra aislada, positiva y con coeficiente 1 en uno de los miembros del signo igual.

  Para lograrlo, aplicamos las reglas algebraicas de transposición de términos y operaciones inversas: lo que suma pasa restando, lo que resta pasa sumando, y lo que multiplica pasa dividiendo.

  Si la incógnita figura en múltiples términos, debemos agrupar esos términos en un mismo lado y extraer la incógnita como factor común antes de trasponer su coeficiente.
explicacion_formal: |
  ### Definición formal
  Dada una ecuación literal con la incógnita $x$ presente en múltiples términos $a x + b x = c + d$, el **algoritmo de despeje por factorización** establece:

  $$a x + b x = c + d \iff (a + b) x = c + d \iff x = \frac{c + d}{a + b} \quad \text{con } a + b \neq 0$$

  ### Desglose de la fórmula
  - Factorización por factor común: Transformación de la suma de términos $a x + b x$ en el producto $(a + b) x$.
  - División por binomio parámetro: Trasposición del factor $(a + b)$ al segundo miembro declarando la condición de existencia $a + b \neq 0$.

  ### Síntesis didáctica
  Agrupar en un solo miembro todos los términos que contienen la incógnita es el requisito previo indispensable para aplicar el factor común.
definiciones_clave: |
  - **Despeje de variable**: Transformación algebraica equivalente que aísla la incógnita objetivo en el primer miembro con coeficiente unitario positivo.
  - **Factorización por factor común**: Técnica que agrupa la variable $x$ expresándola como multiplicando de una suma de coeficientes paramétricos.
propiedades_relaciones: |
  - **Restricción de divisor paramétrico**: Trasponer un divisor paramétrico expresado como suma o binomio $(a + b)$ exige la condición explícita $a + b \neq 0$.
  - **Invariancia operacional**: Las reglas de transposición aplicadas a parámetros simbólicos sonidénticas a las aplicadas a constantes numéricas reales.
ejemplo_guiado:
  enunciado: 'Despeja la variable $x$ en la ecuación literal $a x + 5 = c - b x$ indicando las restricciones paramétricas correspondientes.'
  pasos:
    - 'Paso 1: Agrupar los términos que contienen la incógnita $x$ en el primer miembro: $a x + b x + 5 = c$.'
    - 'Paso 2: Trasponer el término independiente $+5$ al segundo miembro: $a x + b x = c - 5$.'
    - 'Paso 3: Factorizar la incógnita $x$ como factor común en el primer miembro: $x(a + b) = c - 5$.'
    - 'Paso 4: Trasponer el binomio $(a + b)$ dividiendo al segundo miembro: $x = \frac{c - 5}{a + b}$ declarando $a + b \neq 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al despejar la incógnita $x$ en la ecuación $a x + b x = c - 5$, ¿cuál es la expresión paramétrica resultante?'
    choices:
      - {text: '$x = \frac{c - 5}{a + b}$', is_correct: true}
      - {text: '$x = \frac{c - 5}{a \cdot b}$', is_correct: false}
      - {text: '$x = (c - 5)(a + b)$', is_correct: false}
      - {text: '$x = \frac{c + 5}{a - b}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{c - 5}{a + b}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para que la expresión despejada $x = \frac{c - 5}{a + b}$ sea válida en los números reales, ¿qué restricción deben cumplir los parámetros?'
    choices:
      - {text: '$a + b \neq 0$', is_correct: true}
      - {text: '$c - 5 \neq 0$', is_correct: false}
      - {text: '$a \cdot b \neq 0$', is_correct: false}
      - {text: '$x \neq 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a + b \neq 0$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar de forma explícita la variable que se desea despejar.'
  - 'Paso 2: Trasponer hacia el primer miembro todos los términos que contienen dicha variable.'
  - 'Paso 3: Trasponer hacia el segundo miembro todos los términos paramétricos independientes.'
  - 'Paso 4: Extraer la variable objetivo como factor común.'
  - 'Paso 5: Trasponer la expresión coeficiente dividiendo y declarar su condición de no-nulidad.'
errores_correccion: |
  - **Error 1:** Intentar trasponer a dividir un coeficiente multiplicativo mientras la incógnita sigue presente en otros términos dispersos. **Cómo corregirlo:** Si la variable figura en dos o más términos, **PRIMERO DEBEN AGRUPARSE TODOS ESOS TÉRMINOS EN UN MISMO MIEMBRO Y EXTRAER LA VARIABLE COMO FACTOR COMÚN ($x(a + b)$)**.
  - **Error 2:** Omitir la restricción de no-nulidad al trasponer una suma o diferencia de parámetros como divisor. **Cómo corregirlo:** Toda expresión paramétrica que pasa dividiendo **REQUIERE DECLARAR EXPLÍCITAMENTE LA CONDICIÓN DE EXISTENCIA RESTRICCIÓN DE NO-NULIDAD ($a + b \neq 0$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Despeja $x$ en la ecuación $p x - q x = r$.'
    alternativas:
      - '$x = \frac{r}{p - q}$'
      - '$x = \frac{r}{p + q}$'
      - '$x = r(p - q)$'
    respuesta: '$x = \frac{r}{p - q}$'
    solucion_pasos:
      - '1. Factorizar $x$: $x(p - q) = r$.'
      - '2. Trasponer divisor con $p - q \neq 0$: $x = \frac{r}{p - q}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Despeja $y$ en la ecuación $a y + b = c y$.'
    alternativas:
      - '$y = \frac{b}{c - a}$'
      - '$y = \frac{b}{a - c}$'
      - '$y = b(c - a)$'
    respuesta: '$y = \frac{b}{c - a}$'
    solucion_pasos:
      - '1. Agrupar $y$: $b = c y - a y \implies b = y(c - a)$.'
      - '2. Despejar $y$: $y = \frac{b}{c - a}$ con $c - a \neq 0$.'
  - titulo: 'Factor común mandatorio'
    enunciado: '¿La extracción de factor común es la técnica requerida cuando la variable a despejar figura en más de un término?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, permite convertir sumas con la incógnita en un único producto aislable.'
  - titulo: 'Restricción de suma en divisor'
    enunciado: '¿El despeje $x = \frac{d}{a + b}$ requiere exigir que $a + b \neq 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la división entre cero es indefinida.'
errores_frecuentes:
  - 'Intentar dividir por un coeficiente mientras la variable sigue presente en otro término.'
  - 'Omitir la extracción de factor común cuando la incógnita aparece en múltiples sumandos.'
  - 'Dividir entre expresiones paramétricas sin declarar la condición de no-nulidad.'
  - 'Alterar los signos de los parámetros al cambiar de miembro la incógnita.'
  - 'Confundir las constantes independientes con términos que contienen la incógnita.'
afirmaciones_verdaderas:
  - 'Despejar una variable presente en varios términos exige agruparlos en un miembro y extraer la variable como factor común.'
  - 'Toda división entre una expresión paramétrica requiere declarar explícitamente que dicha expresión es distinta de cero.'
al_terminar_debes_poder: |
  QUÉ: Despejar una variable en ecuaciones literales de primer grado.
  CÓMO: Agrupar los términos con la incógnita en un miembro, extraer la variable como factor común, trasponer la expresión coeficiente dividiendo y fijar las restricciones de no-nulidad.
