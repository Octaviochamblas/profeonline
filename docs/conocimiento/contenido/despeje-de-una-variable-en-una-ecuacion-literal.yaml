semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_VARIABLE
resumen_inicial: 'Despeje de una variable en una ecuación literal: propiedades, resolución
  y modelamiento en Ecuaciones literales y despeje.'
explicacion_simple: Debes deshacerte de los operaciones que acompañan a la variable
  desde afuera hacia adentro.
explicacion_formal: '### Definición formal


  Despejar la incógnita $x$ en una ecuación literal $f(x,a,b,c,\dots)=0$ consiste
  en aplicar, en orden inverso al que fueron aplicadas sobre $x$, las operaciones
  aritméticas cuyos operandos son los parámetros $a, b, c, \dots$ (tratados como constantes),
  hasta dejar $x$ aislada en un miembro de la igualdad.


  ### Desarrollo didáctico


  Debes deshacerte de los operaciones que acompañan a la variable desde afuera hacia
  adentro.

  Ejemplo: Tienes $\frac{ax - b}{c} = d$.

  1. Operación externa: El $/c$ que divide a todo. Pasa multiplicando: $ax - b = cd$.

  2. Operación intermedia: El $-b$ que resta. Pasa sumando: $ax = cd + b$.

  3. Coeficiente adyacente: La ''a'' que multiplica. Pasa dividiendo a TODO lo del
  otro lado: $x = \frac{cd + b}{a}$.


  La variable queda aislada. Y tienes tu fórmula.'
definiciones_clave: '- **Despeje de una variable en una ecuación literal**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a despeje de una variable en una ecuación
  literal.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando despeje de una
    variable en una ecuación literal.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de despeje de una variable
    en una ecuación literal.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
