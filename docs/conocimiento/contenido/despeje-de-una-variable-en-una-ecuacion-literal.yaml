procedimiento:
- Elimina denominadores multiplicando (si los hay).
- Agrupa todos los términos que contengan a la incógnita 'x' en un solo lado de la
  igualdad, y manda todo el resto (los parámetros puros) al otro lado.
- Si hay varias 'x', factoriza (extrae factor común 'x').
- Divide por el coeficiente o paréntesis que acompañe a la 'x'.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en despeje de una variable en una ecuación literal.
ejemplos:
- titulo: $\frac{ax - b}{c} = d$ y $ax - b = cd$
  enunciado: Analiza el caso $\frac{ax - b}{c} = d$ y $ax - b = cd$ y explica cómo
    se aplica el criterio estudiado.
  solucion_pasos:
  - 'Debes deshacerte de los operaciones que acompañan a la variable desde afuera
    hacia adentro.

    Ejemplo: Tienes $\frac{ax - b}{c} = d$.

    1. Operación externa: El $/c$ que divide a todo. Pasa multiplicando: $ax - b =
    cd$.

    2. Operación intermedia: El $-b$ que resta. Pasa sumando: $ax = cd + b$.

    3. Coeficiente adyacente: La ''a'' que multiplica. Pasa dividiendo a TODO lo del
    otro lado: $x = \frac{cd + b}{a}$.'
  - Elimina denominadores multiplicando (si los hay).
- titulo: $a$
  enunciado: Resuelve o interpreta $a$ usando las condiciones de este recurso.
  solucion_pasos:
  - El arte de despejar se basa en el orden de las operaciones en reversa. Imagina
    que la 'x' es la variable que debe aislarse, y los parámetros ($a$, $b$, $c$)
    son los operaciones que acompañan a la variable.
  - Agrupa todos los términos que contengan a la incógnita 'x' en un solo lado de
    la igualdad, y manda todo el resto (los parámetros puros) al otro lado.
- titulo: 'Respecto de «Despeje de una variable en una ecuación literal»: ¿Es correcta
    esta caracteriza'
  enunciado: 'Respecto de «Despeje de una variable en una ecuación literal»: ¿Es correcta
    esta caracterización? «El arte de despejar se basa en el orden de las operaciones
    en reversa»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El arte de despejar se basa
    en el orden de las operaciones en reversa.'
- titulo: 'Respecto de «Despeje de una variable en una ecuación literal»: ¿Es válida
    esta afirmación? «'
  enunciado: 'Respecto de «Despeje de una variable en una ecuación literal»: ¿Es válida
    esta afirmación? «Puede omitirse esta condición sin cambiar el resultado: «Elimina
    denominadores multiplicando (si los hay)»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El arte de despejar se basa
    en el orden de las operaciones en reversa.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Elimina denominadores
  multiplicando (si los hay)».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Agrupa todos los
  términos que contengan a la incógnita ''x'' en un solo lado de la igualdad, y manda
  todo el resto (los parámetros puros) al otro lado».'
- La definición sigue cumpliéndose aunque no se considere que el arte de despejar
  se basa en el orden de las operaciones en reversa. Imagina que la 'x' es la variable
  que debe aislarse, y los parámetros ($a$, $b$, $c$) son los operaciones que acompañan
  a la variable.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Divide
  por el coeficiente o paréntesis que acompañe a la 'x'».
- La comprobación del resultado vuelve innecesaria la condición «Elimina denominadores
  multiplicando (si los hay)».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando despeje
  de una variable en una ecuación literal.
