semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RAIZ_CUADRADA
resumen_inicial: La gráfica de la función potencia con exponente un medio $f(x) = x^{1/2} = \sqrt{x}$ describe la rama superior de una parábola horizontal con vértice en el origen $(0, 0)$, definida exclusivamente en el primer cuadrante con $\operatorname{Dom}(f) = [0, +\infty[$ y $\operatorname{Rec}(f) = [0, +\infty[$.
explicacion_simple: "![La gráfica de la función potencia con exponente un medio $f(x) = x^{1/2} = \\sqrt{x}$ describe la rama superior de una parábola horizontal con vértice en el origen $(0, 0)$, definida exclusivamente en el primer cuadrante con $\\operatorname{Dom}(f) = [0, +\\infty[$ y $\\operatorname{Rec}(f) = [0, +\\infty[$](/static/img/nodos/grafica-de-la-funcion-potencia-con-exponente-un-medio-intro.svg)\n\n\nLa función **$f(x) = x^{1/2} = \\sqrt{x}$ (raíz cuadrada)** es literalmente una **media parábola acostada horizontalmente**:\n\n- **¿Cómo nace la curva?**\n  - Empieza en el origen **$(0, 0)$**.\n  - Pasa por los puntos notables: **$(1, 1)$, $(4, 2)$, $(9, 3)$, $(16, 4)$**.\n  - Solo vive en el **primer cuadrante** (tanto $x$ como $y$ son mayores o iguales a cero).\n- **¿Cómo crece?**\n  - Sube hacia la derecha pero **cada vez más despacio y aplanada** (es cóncava hacia abajo $\\cap$).\n  - En el punto de inicio $(0, 0)$, la curva sale con una **recta tangente perfectamente\
  \ vertical**."
explicacion_formal: "Sea $f: [0, +\\infty[ \\to [0, +\\infty[$ definida por $f(x) = x^{1/2} = \\sqrt{x}$.\nPor definición de la función raíz cuadrada principal, $f$ es la inversa de la función cuadrática restringida $g(x) = x^2$ para $x \\ge 0$.\n\n**Análisis diferencial y convexidad**:\n1. **Primera derivada (Monotonía)**:\n   $$f'(x) = \\frac{1}{2\\sqrt{x}} > 0, \\quad \\forall x > 0$$\n   La función es estrictamente creciente en $]0, +\\infty[$ con $\\lim_{x \\to 0^+} f'(x) = +\\infty$ (tangente vertical en el origen).\n2. **Segunda derivada (Concavidad)**:\n   $$f''(x) = -\\frac{1}{4x^{3/2}} = -\\frac{1}{4\\sqrt{x^3}} < 0, \\quad \\forall x > 0$$\n   La función es estrictamente cóncava hacia abajo en todo su dominio.\n3. **Espacios fundamentales**:\n   $$\\operatorname{Dom}(f) = [0, +\\infty[, \\quad \\operatorname{Rec}(f) = [0, +\\infty[$$"
definiciones_clave: '- **Semi-parábola horizontal**: Curva obtenida al restringir la inversa de la parábola estándar al semiplano superior $y \ge 0$.

  - **Tangente vertical en el origen**: Pendiente infinita en $x = 0$ debida a $\lim_{x \to 0^+} f''(x) = +\infty$.'
propiedades_relaciones: '- **Simetría con $y = x^2$**: La curva $y = \sqrt{x}$ es la reflexión especular de $y = x^2$ ($x \ge 0$) respecto a la recta diagonal $y = x$.

  - **Dilatación vertical**: En $g(x) = a\sqrt{x}$, el parámetro $a > 0$ escala verticalmente las alturas.'
ejemplo_guiado:
  enunciado: '![Ejemplo La gráfica de la función potencia con exponente un medio $f(x) = x^{1/2} = \sqrt{x}$ describe la rama superior de una parábola horizontal con vértice en el origen $(0, 0)$, definida exclusivamente en el primer cuadrante con $\operatorname{Dom}(f) = [0, +\infty[$ y $\operatorname{Rec}(f) = [0, +\infty[$](/static/img/nodos/grafica-de-la-funcion-potencia-con-exponente-un-medio-ejemplos.svg)



    Analiza y grafica la función $f(x) = 2\sqrt{x}$:

    1) Halla los puntos para $x = 0, 1, 4, 9, 16$.

    2) Describe el dominio, recorrido y concavidad.

    3) Compara la altura de $f(x)$ con la raíz cuadrada estándar en $x = 9$.'
  pasos:
  - 'Paso 1: Puntos evaluados:

    - $f(0) = 2(0) = \mathbf{0} \implies (0, 0)$.

    - $f(1) = 2(1) = \mathbf{2} \implies (1, 2)$.

    - $f(4) = 2(2) = \mathbf{4} \implies (4, 4)$.

    - $f(9) = 2(3) = \mathbf{6} \implies (9, 6)$.

    - $f(16) = 2(4) = \mathbf{8} \implies (16, 8)$.'
  - 'Paso 2: $\operatorname{Dom}(f) = [0, +\infty[$, $\operatorname{Rec}(f) = [0, +\infty[$, estrictamente creciente y cóncava hacia abajo.'
  - 'Paso 3: En $x = 9$, $\sqrt{9} = 3$, mientras que $f(9) = 6$ (el doble de altura por el factor $a = 2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la concavidad de la función raíz cuadrada $f(x) = \sqrt{x}$ en todo su dominio?
  choices:
  - text: Cóncava hacia abajo (f''(x) < 0)
    is_correct: true
  - text: Convexa hacia arriba (f''(x) > 0)
    is_correct: false
  - text: Lineal sin curvatura
    is_correct: false
  - text: Cambia de concavidad en x = 1
    is_correct: false
  explanation: La alternativa correcta es 'Cóncava hacia abajo (f''(x) < 0)'. Al aumentar $x$, la velocidad de crecimiento disminuye progresivamente.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué cuadrante se encuentra graficada la función $f(x) = \sqrt{x}$?
  choices:
  - text: Únicamente en el primer cuadrante
    is_correct: true
  - text: En los cuadrantes I y II
    is_correct: false
  - text: En los cuadrantes I y IV
    is_correct: false
  - text: En los cuatro cuadrantes
    is_correct: false
  explanation: La alternativa correcta es 'Únicamente en el primer cuadrante'. Tanto el dominio como el recorrido son $[0, +\infty[$, por lo que $x \ge 0$ e $y \ge 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Marcar el punto de inicio en el origen $(0, 0)$.'
- 'Paso 2: Evaluar cuadrados perfectos $x \in \{1, 4, 9, 16\}$ para obtener coordenadas enteras.'
- 'Paso 3: Trazar una curva suave en el primer cuadrante que inicie verticalmente en $(0, 0)$ y se curve hacia la derecha.'
- 'Paso 4: Verificar que el dominio y recorrido sean ambos $[0, +\infty[$.'
errores_correccion: '- **Error común:** Dibujar dos ramas (arriba y abajo) en $y = \sqrt{x}$.

  - **Cómo corregirlo:** La raíz cuadrada como **FUNCIÓN** toma **únicamente el valor positivo principal**: solo existe la rama superior en el **primer cuadrante**.'
ejemplos:
- titulo: 'Ejemplo 1: Punto notable'
  enunciado: Si $x = 25$, ¿cuánto vale $f(x) = \sqrt{x}$?
  alternativas:
  - '5'
  - ±5
  - '25'
  - 12,5
  respuesta: '5'
  solucion_pasos:
  - 'Paso 1: $f(25) = \sqrt{25} = 5$ (raíz positiva principal).'
- titulo: 'Ejemplo 2: Tangente en el origen'
  enunciado: ¿Cómo es la recta tangente a $y = \sqrt{x}$ en el punto $(0, 0)$?
  alternativas:
  - Completamente vertical (pendiente infinita)
  - Completamente horizontal
  - Tiene pendiente 1
  - No existe recta tangente
  respuesta: Completamente vertical (pendiente infinita)
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to 0^+} f''(x) = +\infty \implies$ tangente vertical.'
- titulo: 'Ejemplo 3: Reflexión vertical'
  enunciado: ¿En qué cuadrante se ubica la gráfica de $g(x) = -\sqrt{x}$?
  alternativas:
  - Cuarto cuadrante (x ≥ 0, y ≤ 0)
  - Segundo cuadrante
  - Tercer cuadrante
  - Primer cuadrante
  respuesta: Cuarto cuadrante (x ≥ 0, y ≤ 0)
  solucion_pasos:
  - 'Paso 1: Radicando $x \ge 0$ y salida $y = -\sqrt{x} \le 0 \implies$ Cuadrante IV.'
- titulo: 'Ejemplo 4: Monotonía de la raíz'
  enunciado: 'La función $f(x) = \sqrt{x}$ en $[0, +\infty[$ es:'
  alternativas:
  - Estrictamente creciente
  - Estrictamente decreciente
  - Constante
  - No monótona
  respuesta: Estrictamente creciente
  solucion_pasos:
  - 'Paso 1: A mayor $x$, mayor es $\sqrt{x} \implies$ estrictamente creciente.'
errores_frecuentes:
- Graficar la rama negativa en la función raíz cuadrada principal.
- Intentar evaluar números negativos en x.
- Asumir que la curva se detiene o tiene asíntota horizontal (crece sin cota hacia +infinito).
afirmaciones_verdaderas:
- La gráfica de f(x) = √x es una semi-parábola ubicada en el primer cuadrante con inicio en (0, 0).
- Su dominio y recorrido son idénticamente el intervalo cerrado [0, +∞[.
al_terminar_debes_poder: '**QUÉ:** Graficar y caracterizar la función potencia con exponente un medio f(x) = √x.


  **CÓMO:** Muestreando cuadrados perfectos, trazando la semi-parábola cóncava y estableciendo Dom = Rec = [0, +∞[.


