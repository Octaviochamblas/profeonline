- titulo: 'Respecto de «Multiplicación de polinomios por coeficientes separados»:
    ¿Es válida esta afirm'
  enunciado: 'Respecto de «Multiplicación de polinomios por coeficientes separados»:
    ¿Es válida esta afirmación? «Para «Para multiplicar por el método de coeficientes
    separados, ¿qué condición deben cumplir los polinomios respecto a los términos
    faltantes», la respuesta correcta es Se omiten y se escriben juntos los que quedan»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Los ceros guardan el espacio
    del grado correspondiente, igual que en el sistema decimal.'
errores_frecuentes:
- Para «Para multiplicar por el método de coeficientes separados, ¿qué condición deben
  cumplir los polinomios respecto a los términos faltantes», la respuesta correcta
  es Se omiten y se escriben juntos los que quedan.
- Para «Para multiplicar por el método de coeficientes separados, ¿qué condición deben
  cumplir los polinomios respecto a los términos faltantes», la respuesta correcta
  es Se rellenan con coeficiente 1.
- El método no se puede usar si faltan términos.
- Porque en álgebra las reservas se restan.
- Para «¿Por qué no se 'lleva reserva' al multiplicar coeficientes separados, a diferencia
  de la multiplicación aritmética tradicional», la respuesta correcta es Porque los
  coeficientes siempre son menores a 10.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
