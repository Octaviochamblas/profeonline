resumen_inicial: La multiplicación de polinomios por coeficientes separados aplica
  rigurosamente las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con multiplicación de polinomios por coeficientes
  separados, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Multiplicación de polinomios
  por coeficientes separados** viene dada por:


  $$\text{"el producto de (2x + 3)(x - 4) por coeficientes [2, 3] * [1, -4]"} \implies
  2x^2 - 5x - 12$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Multiplicación de polinomios por coeficientes separados**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule multiplicación de polinomios por coeficientes separados para:
    ''el producto de (2x + 3)(x - 4) por coeficientes [2, 3] * [1, -4]''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 2x^2 - 5x - 12.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar multiplicación de polinomios por coeficientes
    separados a 'el producto de (2x + 3)(x - 4) por coeficientes [2, 3] * [1, -4]'?
  choices:
  - text: 2x^2 - 5x - 12
    is_correct: true
  - text: 2x^2 + 5x - 12
    is_correct: false
  - text: 2x^2 - 12
    is_correct: false
  - text: x^2 - 5x - 12
    is_correct: false
  explanation: La alternativa correcta es '2x^2 - 5x - 12'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto de (2x + 3)(x - 4) por coeficientes
    [2, 3] * [1, -4]', ¿qué expresión resultante se obtuvo?
  choices:
  - text: 2x^2 - 5x - 12
    is_correct: true
  - text: 2x^2 + 5x - 12
    is_correct: false
  - text: 2x^2 - 12
    is_correct: false
  - text: x^2 - 5x - 12
    is_correct: false
  explanation: La alternativa correcta es '2x^2 - 5x - 12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante multiplicación de polinomios por coeficientes separados.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de multiplicación de polinomios por coeficientes
    separados en 'el producto de (2x + 3)(x - 4) por coeficientes [2, 3] * [1, -4]'?
  alternativas:
  - 2x^2 - 5x - 12
  - 2x^2 + 5x - 12
  - 2x^2 - 12
  - x^2 - 5x - 12
  respuesta: 2x^2 - 5x - 12
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 2x^2 - 5x - 12.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto de (2x + 3)(x - 4) por coeficientes [2, 3] *
    [1, -4]' por multiplicación de polinomios por coeficientes separados, ¿qué expresión
    resulta?
  alternativas:
  - 2x^2 - 5x - 12
  - 2x^2 + 5x - 12
  - 2x^2 - 12
  - x^2 - 5x - 12
  respuesta: 2x^2 - 5x - 12
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 2x^2 - 5x - 12.
- titulo: ¿Es la multiplicación en 'el producto de (2x + 3)(x - 4) por coeficientes
    [2, 3] * [1, -4]' equivalente a 2x^2 - 5x - 12?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 2x^2 - 5x - 12.
- titulo: ¿Da el producto de 'el producto de (2x + 3)(x - 4) por coeficientes [2,
    3] * [1, -4]' un resultado igual a 2x^2 + 5x - 12?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 2x^2 - 5x - 12.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar multiplicación de polinomios
  por coeficientes separados.
- Omitir distribuir el monomio o término sobre todos los sumandos en multiplicación
  de polinomios por coeficientes separados.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La multiplicación de polinomios por coeficientes separados requiere sumar los exponentes
  de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la multiplicación de
  polinomios por coeficientes separados aplicando distributividad, ley de signos y
  suma de exponentes.
