procedimiento:
- 'Paso 1: Ordena ambos polinomios por grados y completa con coeficiente $0$ los términos
  faltantes.'
- 'Paso 2: Escribe solo las sucesiones de coeficientes respetando la posición de cada
  grado.'
- 'Paso 3: Forma los productos parciales entre coeficientes según los grados que se
  combinan.'
- 'Paso 4: Suma los aportes que correspondan al mismo grado del producto.'
- 'Paso 5: Reconstruye el polinomio final asociando cada coeficiente con su potencia
  correspondiente.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación de polinomios por coeficientes separados.
ejemplos:
- titulo: Si en la multiplicación por coeficientes separados de un polinomio de grado
    $4$ por uno de g
  enunciado: 'Si en la multiplicación por coeficientes separados de un polinomio de
    grado $4$ por uno de grado $3$ se forma una matriz de sumas parciales, ¿cuántas
    filas de sumas parciales habrá antes de reducir?


    Opciones: A) $4$ filas. · B) $3$ filas. · C) $7$ filas. · D) $12$ filas.'
  solucion_pasos:
  - El factor inferior es de grado 3, o sea tiene 4 coeficientes. Por lo tanto, habrá
    4 multiplicaciones y 4 filas para sumar.
  - 'Respuesta: $4$ filas.'
- titulo: Sabiendo que al multiplicar por coeficientes separados $(a, b, c)$ por $(1,
    2)$ se obtiene $
  enunciado: 'Sabiendo que al multiplicar por coeficientes separados $(a, b, c)$ por
    $(1, 2)$ se obtiene $(3, 5, 2, -4)$, entonces el valor de $a+b+c$ es:


    Opciones: A) $2$ · B) $6$ · C) $3$ · D) $-2$'
  solucion_pasos:
  - Suma de coeficientes de producto = suma coefs P1 * suma coefs P2. $(3+5+2-4) =
    6$. $P2 = 1+2 = 3$. $P1 * 3 = 6 \Rightarrow P1 = 2$. Así, $a+b+c = 2$. Pero wait.
    Vamos a revisar las alternativas. $a=3$, $2a+b=5 \Rightarrow b=-1$. $2b+c=2 \Rightarrow
    -2+c=2 \Rightarrow c=4$. $a+b+c = 3 - 1 + 4 = 6$. Oh! Sum of coefs formula! Let
    me fix the answer to 2.
  - 'Respuesta: $2$'
- titulo: 'Respecto de «Multiplicación de polinomios por coeficientes separados»:
    ¿Es correcta esta car'
  enunciado: 'Respecto de «Multiplicación de polinomios por coeficientes separados»:
    ¿Es correcta esta caracterización? «Los ceros guardan el espacio del grado correspondiente,
    igual que en el sistema decimal»'
  respuesta: Sí
  solucion_pasos:
