semantic_id: MAT.ALG.MULT_POLINOMIOS.COEFICIENTES_SEPARADOS
resumen_inicial: 'Multiplicación de polinomios por coeficientes separados: leyes,
  procedimiento y aplicación en Multiplicación de polinomios.'
explicacion_simple: Separar temporalmente los coeficientes numéricos de las partes
  literales ayuda a ordenar productos extensos y a comprobar cada operación sin perder
  términos.
explicacion_formal: '### Definición formal


  Sea $P(x)=a_nx^n+a_{n-1}x^{n-1}+\cdots+a_0$ y $Q(x)=b_mx^m+b_{m-1}x^{m-1}+\cdots+b_0$,
  completando con coeficiente $0$ los grados faltantes cuando sea necesario. El método
  de coeficientes separados asocia a estos polinomios las sucesiones ordenadas $(a_n,\ldots,a_0)$
  y $(b_m,\ldots,b_0)$.

  El coeficiente del término de grado $k$ en el producto $P(x)Q(x)$ viene dado por

  $$c_k=\sum_{i+j=k} a_i b_j,$$

  de modo que el producto corresponde a la convolución de las sucesiones de coeficientes.
  Los ceros no alteran el polinomio: solo conservan la posición de los grados ausentes
  para que la correspondencia entre coeficientes y potencias quede bien determinada.


  ### Desarrollo didáctico


  No hay relación de ''10 unidades forman 1 de la siguiente'' entre $x$ y $x^2$. Son
  variables independientes numéricamente.


  Los coeficientes asignan potencias desde 3 hasta 0: $2x^3, -5x^2, 0x^1, 4x^0$. O
  sea $2x^3 - 5x^2 + 4$.


  Grados 4, 3, 2, 1, 0. Coeficientes: $3 (para\ x^4)$, $0 (x^3)$, $-1 (x^2)$, $0 (x^1)$,
  $5 (x^0)$.'
