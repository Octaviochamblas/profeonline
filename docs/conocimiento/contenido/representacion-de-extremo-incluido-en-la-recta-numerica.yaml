semantic_id: MAT.ALG.INTERVALOS.EXTREMO_INCLUIDO
resumen_inicial: Un extremo incluido se representa en la recta numérica mediante un
  punto o círculo completamente relleno (óvalo negro).
explicacion_simple: 'Cuando un número límite SÍ forma parte de la solución (como en
  $\le$ o $\ge$, o corchete cerrado $[$ ), dibujamos sobre ese número en la recta
  un **círculo o punto totalmente pintado (relleno)**.

  Ese punto negro indica que el número exacto del borde está incluido dentro del conjunto
  de respuestas válidas.'
explicacion_formal: 'Sea el extremo $a \in [a, b]$. La **convención gráfica de inclusión**
  se simboliza mediante:


  $$a \in I \implies \bullet \quad (\text{círculo cerrado u óvalo relleno sobre el
  valor } x = a)$$


  **Desglose de la fórmula:**

  - Notación gráfica indiscutible que comunica visualmente la inclusión de la cota
  $a$.'
definiciones_clave: '- **Punto relleno ($\bullet$)**: Marcador gráfico sobre la recta
  real que indica que el extremo pertenece al intervalo.

  - **Extremo cerrado**: Límite que satisface la condición no estricta de pertenencia.'
propiedades_relaciones: '- **Correspondencia lógica**: El punto relleno $\bullet$
  se corresponde con los operadores $\le, \ge$ y los corchetes cerrados $[, ]$.'
ejemplo_guiado:
  enunciado: Muestra la representación del extremo $x = 3$ en la gráfica de la desigualdad
    $x \ge 3$.
  pasos:
  - 'Paso 1: Ubicar el número $3$ en la recta numérica real.'
  - 'Paso 2: Dibujar sobre el número $3$ un punto o círculo totalmente relleno ($\bullet$)
    por tener el signo $\ge$.'
  - 'Paso 3: Sombrear hacia la derecha hacia $+\infty$.'
  - 'Paso 4: Concluir que el punto relleno confirma que $3$ es una solución válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué símbolo gráfico se dibuja en la recta numérica para indicar que un
    extremo SÍ pertenece al intervalo?
  choices:
  - text: Un círculo totalmente relleno o pintado ($\bullet$).
    is_correct: true
  - text: Un círculo transparente sin rellenar ($\circ$).
    is_correct: false
  - text: Una cruz roja.
    is_correct: false
  - text: Una flecha apuntando a cero.
    is_correct: false
  explanation: La alternativa correcta es 'Un círculo totalmente relleno o pintado
    ($\bullet$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al graficar $x \ge 3$, ¿por qué se utiliza un punto relleno en el número
    3?
  choices:
  - text: Porque el operador es no estricto ($\ge$) e incluye al 3 como solución válida.
    is_correct: true
  - text: Porque 3 es el único número del conjunto.
    is_correct: false
  - text: Porque 3 es un número positivo.
    is_correct: false
  - text: Es una elección estética sin significado matemático.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el operador es no estricto ($\ge$)
    e incluye al 3 como solución válida.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la desigualdad tenga signo igual ($\le, \ge$) o el intervalo
  sea cerrado.'
- 'Paso 2: Ubicar el número en la recta numérica.'
- 'Paso 3: Rellenar por completo el círculo con lápiz ($\bullet$).'
errores_correccion: '- **Error común:** Usar un círculo transparente (vacío) para
  una desigualdad que incluye el igual ($\ge$).

  - **Cómo corregirlo:** Si la desigualdad incluye el igual ($\ge$ ó $\le$), el punto
  sobre la recta DEBE estar relleno.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
  - 'En la recta numérica, un extremo incluido se dibuja mediante un punto abierto sin rellenar.'
  - 'La gráfica de la desigualdad $x \ge 3$ sobre la recta real usa un círculo vacante en el extremo $3$.'
  - 'Un círculo relleno o punto negro sobre la recta real representa la exclusión estricta del valor frontera.'
  - 'Los extremos graficados con puntos cerrados corresponden a notaciones de corchetes invertidos $], [$.'
  - 'El punto cerrado sobre el valor $x = 3$ indica que la relación de orden asociada es del tipo estricto $x > 3$.'
afirmaciones_verdaderas:
  - 'En la representación gráfica de un intervalo sobre la recta real, un extremo incluido se marca con un punto o círculo totalmente relleno.'
  - 'Un punto cerrado en la recta numérica corresponde a desigualdades no estrictas ($\le, \ge$) y a corchetes hacia adentro ($[, ]$).'
al_terminar_debes_poder: |
  QUÉ: Representar e interpretar extremos incluidos en la recta numérica.
  CÓMO: Dibujar círculos o puntos totalmente rellenados sobre el valor frontera, asociándolos a desigualdades no estrictas ($\le, \ge$) y corchetes cerrados ($[, ]$).
fuente: 'Texto escolar MINEDUC — Álgebra / Intervalos Reales'
estado: publicado
