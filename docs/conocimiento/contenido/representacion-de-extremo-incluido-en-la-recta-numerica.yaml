semantic_id: MAT.ALG.INTERVALOS.EXTREMO_INCLUIDO
resumen_inicial: 'Representación de extremo incluido en la recta numérica: relaciones
  de orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: El uso correcto de los paréntesis y los corchetes determina si
  un valor frontera forma parte o no de un intervalo de números reales, lo cual es
  crítico en análisis y resolución de inecuaciones.
explicacion_formal: '### Definición formal

  Un intervalo $I$ tiene un extremo izquierdo cerrado $a$ si $a \\in I$, correspondiendo
  a $x \\geq a$ y se denota con $[a$. Tiene un extremo izquierdo abierto si $a \\notin
  I$, correspondiendo a $x > a$ y se denota con $(a$. Análogamente, se define para
  los extremos derechos $b$.

  ### Desarrollo didáctico

  Es fácil confundir la sintaxis de los intervalos. Un recurso mnemotécnico es visualizar
  el corchete como una ''caja'' recta y fuerte que atrapa al número, mientras que
  el paréntesis es suave y lo deja escapar. Si la inecuación incluye el signo igual,
  el valor está atrapado por el conjunto.'
definiciones_clave: '- **Representación de extremo incluido en la recta numérica**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a representación de extremo incluido en
  la recta numérica.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de representación
    de extremo incluido en la recta numérica.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de representación de extremo incluido en la
    recta numérica, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
