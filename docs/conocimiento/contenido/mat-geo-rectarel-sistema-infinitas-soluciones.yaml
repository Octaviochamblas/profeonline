semantic_id: MAT.GEO.RECTA_RELACIONES.SISTEMA_INFINITAS_SOLUCIONES
resumen_inicial: 'Interpretación de sistema con infinitas soluciones como rectas coincidentes:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Cuando dos ecuaciones aparentemente distintas describen en realidad
  la misma recta, cualquier punto de esa recta satisface ambas ecuaciones simultáneamente,
  dando infinitas soluciones.
explicacion_formal: '![Sistema con infinitas soluciones](/static/img/geometria/analitica/rectarel-sistema-infinitas-soluciones.svg)


  ### Definición formal


  Si $m_1=m_2$ y $b_1=b_2$, ambas ecuaciones representan la misma recta, por lo que
  todo punto de ella satisface el sistema: hay infinitas soluciones.


  ### Desarrollo didáctico


  El sistema formado por $2x-2y+2=0$ y $x-y+1=0$ tiene infinitas soluciones, ya que
  ambas ecuaciones representan la misma recta $y=x+1$.'
definiciones_clave: '- **Interpretación de sistema con infinitas soluciones como rectas
