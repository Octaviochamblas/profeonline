semantic_id: MAT.NUM.SERIE_GEOMETRICA.SERIE_INFINITA_CONCEPTO
resumen_inicial: 'Una serie geométrica infinita es la suma conceptual de infinitos términos de una progresión geométrica: $\sum_{k=1}^\infty a_1 r^{k-1} = a_1 + a_1 r + a_1 r^2 + \dots$, cuyo valor depende del comportamiento del límite cuando $n \to \infty$.'
explicacion_simple: |
  ¿Es posible **sumar infinitos números** y obtener un número finito en la vida real?
  - Imagina que caminas hacia una pared que está a $1$ metro:
    1. Primer paso: caminas la mitad ($1/2$ metro).
    2. Segundo paso: caminas la mitad de lo que queda ($1/4$ metro).
    3. Tercer paso: caminas la mitad de lo que queda ($1/8$ metro).
    4. Y así infinitamente: $\frac{1}{2} + \frac{1}{4} + \frac{1}{8} + \frac{1}{16} + \dots$
  - ¡Aunque estés sumando infinitos pedacitos, la suma total de las distancias **nunca pasa de $1$ metro**!
  - Ese es el concepto de una **serie geométrica infinita**: la suma infinita se va acercando cada vez más a una meta fija.
explicacion_formal: |
  ### Definición formal
  Una **serie geométrica infinita** es la expresión analítica definida por el límite de la secuencia de sumas parciales $S_n$ cuando el número de términos tiende a infinito:
  $$S = \sum_{k=1}^\infty a_1 r^{k-1} = \lim_{n \to \infty} S_n = \lim_{n \to \infty} \left[ a_1 \cdot \frac{1 - r^n}{1 - r} \right]$$

  ### Comportamiento del término $r^n$ según la razón $r$
  1. **Si $|r| < 1$ (Razón propia en valor absoluto)**:
     $$\lim_{n \to \infty} r^n = 0 \implies S = a_1 \cdot \frac{1 - 0}{1 - r} = \frac{a_1}{1 - r}$$
     La serie es **convergente** y su suma infinita es el número finito $S = \frac{a_1}{1 - r}$.
  2. **Si $|r| \ge 1$**:
     El término $r^n$ no tiende a cero (oscila o crece sin límite) $\implies$ La serie es **divergente** (su suma no existe en $\mathbb{R}$).

  ### Síntesis didáctica
  - Notación infinita: $\sum_{k=1}^\infty a_1 r^{k-1}$.
  - Condición de número finito: $|r| < 1 \implies S = \frac{a_1}{1 - r}$.
definiciones_clave: |
  - **Serie infinita**: Suma de una cantidad ilimitada de términos de una sucesión.
  - **Convergencia de una serie**: Propiedad por la cual la suma infinita da como resultado un número real finito $S$.
  - **Divergencia de una serie**: Propiedad por la cual la suma infinita crece hacia $\pm \infty$ o no se aproxima a ningún número real.
propiedades_relaciones: |
  - **Paradojas del infinito (Zeno)**: El concepto de serie geométrica infinita resuelve la famosa paradoja de Aquiles y la Tortuga mediante el cálculo de límites.
  - **Expresión como fracción de decimales periódicos**: Cualquier número decimal periódico como $0,333\dots = 0,\overline{3}$ se define exactamente como una serie geométrica infinita convergente ($\frac{3}{10} + \frac{3}{100} + \dots = \frac{1}{3}$).
ejemplo_guiado:
  enunciado: 'Analiza el concepto de serie infinita para la suma de distancias $S = \frac{1}{2} + \frac{1}{4} + \frac{1}{8} + \frac{1}{16} + \dots$ e identifica el valor al que converge.'
  pasos:
    - 'Paso 1: Identificamos el primer término $a_1 = \frac{1}{2}$ y la razón geométrica $r = \frac{1/4}{1/2} = \frac{1}{2}$.'
    - 'Paso 2: Verificamos si la razón cumple $|r| < 1$: $|1/2| = 0,5 < 1$, por lo que la serie **es convergente**.'
    - 'Paso 3: Aplicamos la fórmula de la suma infinita: $S = \frac{a_1}{1 - r} = \frac{1/2}{1 - 1/2}$.'
    - 'Paso 4: Evaluamos el denominador $1 - 1/2 = 1/2$. Dividimos: $S = \frac{1/2}{1/2} = 1$. La suma infinita de todas las fracciones **converge exactamente a $1$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Bajo qué condición una serie geométrica infinita de razón $r$ tiene una suma total que es un número real finito?'
    choices:
      - {text: 'Cuando el valor absoluto de la razón es estrictamente menor que 1 ($|r| < 1$)', is_correct: true}
      - {text: 'Cuando la razón es un número entero mayor que 10', is_correct: false}
      - {text: 'Cuando el primer término es igual a 0', is_correct: false}
      - {text: 'Todas las series geométricas infinitas suman siempre un valor finito', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando el valor absoluto de la razón es estrictamente menor que 1 ($|r| < 1$)''. Para $|r|<1$, $r^n \to 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una serie geométrica infinita $a_1 = 6$ y la razón es $r = \frac{1}{3}$, ¿cuál es la suma infinita $S$?'
    choices:
      - {text: '$S = 9$, calculando $\frac{6}{1 - 1/3} = \frac{6}{2/3} = 6 \cdot \frac{3}{2} = 9$', is_correct: true}
      - {text: '$S = 18$, multiplicando $6 \cdot 3$', is_correct: false}
      - {text: '$S = 4$, restando $6 - 2$', is_correct: false}
      - {text: '$S = 2$, dividiendo $6 / 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = 9$, calculando $\frac{6}{1 - 1/3} = \frac{6}{2/3} = 6 \cdot \frac{3}{2} = 9$''. $6 / (2/3) = 9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$ y la razón $r$ de la serie infinita.'
  - 'Paso 2: Evaluar la condición de convergencia $|r| < 1$.'
  - 'Paso 3: Si $|r| < 1$, aplicar la fórmula de suma infinita $S = \frac{a_1}{1 - r}$.'
  - 'Paso 4: Si $|r| \ge 1$, declarar que la serie es divergente y no posee una suma real finita.'
errores_correccion: |
  - **Error 1:** Intentar usar la fórmula de la suma finita con un $n$ determinado al trabajar con el concepto de serie infinita. **Cómo corregirlo:** La suma de una serie infinita convergente se calcula directamente con **$S = \frac{a_1}{1-r}$** (sin el término $r^n$).
  - **Error 2:** Restar $1-r$ al revés en el denominador (hacer $r-1$). **Cómo corregirlo:** En la suma infinita convergente el denominador es **$(1-r)$**.
ejemplos:
  - titulo: 'Serie infinita convergente básica'
    enunciado: 'Para $a_1 = 4$ y $r = 1/2$, ¿la suma infinita es $S = \frac{4}{1 - 1/2} = \frac{4}{1/2} = 8$?'
    alternativas:
      - 'Sí, converge a 8'
      - 'No, da infinito'
      - 'No, da 4'
    respuesta: 'Sí, converge a 8'
    solucion_pasos:
      - '1. $|r| = 1/2 < 1 \implies$ Converge.'
      - '2. $S = 4 / (1/2) = 8$.'
  - titulo: 'Serie infinita divergente'
    enunciado: 'Para la serie $2 + 4 + 8 + 16 + \dots$ ($r=2$), ¿la suma es infinita (divergente)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $|r| = 2 \ge 1$, los términos crecen sin límite $\implies$ Diverge.'
  - titulo: 'Representación de decimal periódico 0,999...'
    enunciado: '¿El decimal $0,999\dots = \frac{9}{10} + \frac{9}{100} + \dots$ es una serie geométrica infinita que converge a 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_1 = 0,9, r = 0,1 \implies S = 0,9 / (1 - 0,1) = 0,9 / 0,9 = 1$.'
  - titulo: 'Serie infinita con razón negativa'
    enunciado: 'Para $a_1 = 3$ y $r = -1/2$, ¿la suma infinita es $S = \frac{3}{1 - (-1/2)} = \frac{3}{3/2} = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 - (-1/2) = 3/2 \implies 3 / (3/2) = 2$.'
errores_frecuentes:
  - 'La suma de una cantidad infinita de números positivos debe ser siempre infinitamente grande.'
  - 'La suma de una serie geométrica infinita siempre entrega un número entero positivo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Escribir el denominador de la suma infinita como $(r-1)$ invirtiendo el signo del resultado.'
  - 'Aplicar la fórmula de suma infinita sobre series donde la razón es mayor que 1.'
afirmaciones_verdaderas:
  - 'Una serie geométrica infinita de razón $r$ converge a un valor finito $S = \frac{a_1}{1 - r}$ si y solo si $|r| < 1$.'
  - 'Sumar infinitos números reales positivos puede dar como resultado un número real finito cuando los términos disminuyen suficientemente rápido.'
al_terminar_debes_poder: 'Comprender el concepto de serie geométrica infinita $\sum_{k=1}^\infty a_1 r^{k-1}$ y verificar su convergencia.'
