semantic_id: MAT.NUM.SERIE_GEOMETRICA.SERIE_INFINITA_CONCEPTO
resumen_inicial: 'Concepto de serie geométrica infinita: concepto y desarrollo dentro de Serie
  geométrica finita e infinita.'
explicacion_simple: Si sumas números positivos para siempre, el resultado debería ser infinito,
  ¿verdad? ¡Sorpresa matemática! Si los números se achican lo suficientemente rápido, sumar
  infinitos números te dará un total pequeño y cerrado. Rompamos la mente con el infinito.
explicacion_formal: 'Imagina que caminas hacia la pared. Primero avanzas 1 metro, luego medio
  metro, luego un cuarto de metro, luego un octavo... Si haces esto infinitas veces, ¡nunca
  superarás los 2 metros totales! Te estancarás (convergerás) en 2 metros exactos.


  Para que la magia del infinito funcione:

  1. La razón debe ser **menor a 1 y mayor a -1** (Ej: $r = 1/2, r = -0.3, r = 2/3$). Si $r=2$,
  los números crecen y la suma sí explota al infinito.

  2. La fórmula de suma infinita colapsa a la mínima expresión matemática:

  $S_{\infty} = \frac{a_1}{1 - r}$


  Es tan simple porque el término enorme $(r^n)$ de la fórmula antigua, al ser ''r'' una fracción
  minúscula elevada al infinito, se vuelve prácticamente CERO, desapareciendo de la ecuación.'
definiciones_clave: '- **Concepto de serie geométrica infinita**: Concepto fundamental dentro
  del estudio de Serie geométrica finita e infinita.'
propiedades_relaciones: '- **Propiedades de Concepto de serie geométrica infinita**: Relaciones
  de cambio y fórmulas estructurales de serie geométrica finita e infinita.'
ejemplo_guiado:
  enunciado: Calcula el total de la suma infinita de la serie 40 más 20 más 10 más 5, y así
    sucesivamente.
  pasos:
  - 'Identifico a_1 igual a 40 y calculo la razón: 20 dividido entre 40 es igual a 0,5.'
  - Verifico que la razón está entre -1 y 1, por lo tanto la serie converge.
  - 'Aplico la fórmula: S infinito igual a 40 dividido entre (1 menos 0,5), es decir 40 dividido
    entre 0,5, igual a 80.'
