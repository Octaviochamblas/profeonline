procedimiento:
- 'Paso 1: Revisa que la razón ''r'' esté entre -1 y 1 (obligatorio).'
- 'Paso 2: Identifica el primer término ($a_1$).'
- 'Paso 3: Resta (1 - r) para el denominador.'
- 'Paso 4: Divide $a_1$ por ese denominador. El resultado es el techo máximo al que llegará
  la suma infinita.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en concepto de serie geométrica infinita.
ejemplos:
- titulo: Sumando polvo de estrellas
  enunciado: Calcula el total de la suma infinita de 100 + 50 + 25 + 12.5 + ...
  solucion_pasos:
  - a1 = 100. La razón es 0.5 (o 1/2).
  - Como 0.5 está entre -1 y 1, SÍ se puede calcular.
  - S_inf = 100 / (1 - 0.5)
  - S_inf = 100 / 0.5
  - S_inf = 200.
  - Sumar infinitos términos de esta secuencia dará exactamente 200.
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la suma infinita de 8 más 4 más 2 más 1, y así sucesivamente?
  alternativas:
  - '16'
  - '12'
  - '20'
  respuesta: '16'
  solucion_pasos:
  - a_1 es 8 y r es 0,5; 8 dividido entre (1 menos 0,5) es igual a 16.
- titulo: Ejemplo 2
  enunciado: ¿Para cuál de estas razones sí se puede calcular una suma infinita?
  alternativas:
  - r igual a 1/4
  - r igual a 2
  - r igual a -3
  respuesta: r igual a 1/4
  solucion_pasos:
  - Solo 1/4 tiene valor absoluto menor que 1.
- titulo: ¿Se puede calcular la suma infinita de una serie con razón 1,5?
  respuesta: 'No'
  solucion_pasos:
  - La razón supera a 1 en valor absoluto, por lo que la serie diverge.
- titulo: ¿El primer término a_1 es necesario para calcular la suma infinita?
  respuesta: Sí
  solucion_pasos:
  - Junto a la razón r, es uno de los dos únicos datos de la fórmula.
errores_frecuentes:
- Intentar aplicar la fórmula del infinito a una progresión creciente donde $r>1$ (esto te
  dará un número negativo absurdo, cuando en realidad la suma es matemáticamente 'Infinito').
- 'Equivocarse en la resta del denominador cuando $r$ es negativa, olvidando la regla de signos:
  $1 - (-0.5) = 1.5$.'
- Intentar aplicar la fórmula de suma infinita cuando la razón es mayor o igual a 1 en valor
  absoluto.
- Olvidar convertir 1 en una fracción equivalente al restar la razón en el denominador.
- Confundir la fórmula de suma infinita con la de suma finita, usando el exponente n.
afirmaciones_verdaderas:
- La formulación de concepto de serie geométrica infinita mantiene la regularidad de la sucesión.
- Una serie geométrica infinita solo tiene un valor de suma finito cuando el valor absoluto
  de la razón es menor que 1.
