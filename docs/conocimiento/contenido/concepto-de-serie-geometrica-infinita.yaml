semantic_id: MAT.NUM.SERIE_GEOMETRICA.SERIE_INFINITA_CONCEPTO
resumen_inicial: 'Concepto de serie geométrica infinita: concepto y desarrollo dentro
  de Serie geométrica finita e infinita.'
explicacion_simple: Si sumas números positivos para siempre, el resultado debería
  ser infinito, ¿verdad? ¡Sorpresa matemática! Si los números se achican lo suficientemente
  rápido, sumar infinitos números te dará un total pequeño y cerrado. Rompamos la
  mente con el infinito.
explicacion_formal: 'Imagina que caminas hacia la pared. Primero avanzas 1 metro,
  luego medio metro, luego un cuarto de metro, luego un octavo... Si haces esto infinitas
  veces, ¡nunca superarás los 2 metros totales! Te estancarás (convergerás) en 2 metros
  exactos.


  Para que la magia del infinito funcione:

  1. La razón debe ser **menor a 1 y mayor a -1** (Ej: $r = 1/2, r = -0.3, r = 2/3$).
  Si $r=2$, los números crecen y la suma sí explota al infinito.

  2. La fórmula de suma infinita colapsa a la mínima expresión matemática:

  $S_{\infty} = \frac{a_1}{1 - r}$


  Es tan simple porque el término enorme $(r^n)$ de la fórmula antigua, al ser ''r''
  una fracción minúscula elevada al infinito, se vuelve prácticamente CERO, desapareciendo
  de la ecuación.'
