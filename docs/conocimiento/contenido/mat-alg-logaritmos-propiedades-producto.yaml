semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.PRODUCTO
resumen_inicial: 'Aplicación de la propiedad del logaritmo de un producto: conceptos,
  asíntotas, propiedades e inversidad en Logaritmos y sus propiedades.'
explicacion_simple: Igual que las potencias transforman productos en sumas de exponentes,
  los logaritmos transforman productos de argumentos en sumas de logaritmos.
explicacion_formal: '### Definición formal


  Para $b>0$, $b\neq1$, $x>0$ e $y>0$, se cumple $\log_b(xy)=\log_b(x)+\log_b(y)$.
  Se demuestra definiendo $m=\log_b(x)$ y $n=\log_b(y)$, de modo que $b^m=x$ y $b^n=y$;
  al multiplicar, $xy=b^{m+n}$, y aplicando el logaritmo se obtiene la igualdad.


  ### Desarrollo didáctico


  $\log_2(4\cdot8)=\log_2(4)+\log_2(8)=2+3=5$, lo mismo que calcular directamente
  $\log_2(32)=5$. En álgebra, esto permite separar $\log_b(x^2y)$ en $\log_b(x^2)+\log_b(y)$,
  preparando la expresión para simplificaciones posteriores.'
definiciones_clave: '- **Aplicación de la propiedad del logaritmo de un producto**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a aplicación de la propiedad del logaritmo de un producto.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de aplicación
    de la propiedad del logaritmo de un producto.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de aplicación de la propiedad
    del logaritmo de un producto.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    aplicación de la propiedad del logaritmo de un producto?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en logaritmos y sus
      propiedades
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en logaritmos y sus propiedades. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en aplicación de la propiedad del logaritmo de un producto?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el producto dentro del argumento del logaritmo.'
- 'Paso 2: Separa el logaritmo en una suma de logaritmos, uno por cada factor.'
- 'Paso 3: Verifica que cada factor sea positivo antes de dar por válida la separación.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en aplicación
  de la propiedad del logaritmo de un producto.
ejemplos:
- titulo: Separación de un producto numérico
  enunciado: Aplica la propiedad del producto a $\log_3(9\cdot27)$.
  solucion_pasos:
  - Se separa en $\log_3(9)+\log_3(27)$.
  - 'Se calcula: $2+3=5$, igual a $\log_3(243)$.'
- titulo: Separación de un producto algebraico
  enunciado: Aplica la propiedad del producto a $\log_5(x\cdot y^2)$.
  solucion_pasos:
  - Se separa en $\log_5(x)+\log_5(y^2)$.
  - La expresión queda lista para simplificar $\log_5(y^2)$ con la propiedad de la
    potencia.
- titulo: ¿Se puede aplicar la propiedad del producto con factores negativos?
  enunciado: ¿Es válido separar $\log_2((-3)\cdot(-4))$ como $\log_2(-3)+\log_2(-4)$?
  respuesta: 'No'
  solucion_pasos:
  - Cada factor debe ser positivo por separado; $-3$ y $-4$ no cumplen esa condición.
- titulo: ¿La propiedad del producto combina o separa términos?
  enunciado: ¿Puede usarse $\log_b(x)+\log_b(y)=\log_b(xy)$ para combinar dos logaritmos
    en uno solo?
  respuesta: Sí
  solucion_pasos:
  - La propiedad funciona en ambos sentidos: separar un producto o combinar una suma
      de logaritmos.
errores_frecuentes:
- Confundir la propiedad del producto con $\log_b(x)\cdot\log_b(y)$, que no es una
  identidad válida.
- Aplicar la separación sin verificar que ambos factores sean positivos.
- Olvidar que la propiedad solo aplica a productos, no a sumas dentro del argumento.
- Combinar logaritmos de distinta base como si compartieran la misma propiedad.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando aplicación de la propiedad del logaritmo de un producto.
