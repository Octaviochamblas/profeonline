semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.PRODUCTO
resumen_inicial: 'El logaritmo de un producto es igual a la suma de los logaritmos de cada uno de sus factores: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$.'
explicacion_simple: |
  Los logaritmos tienen la maravillosa propiedad de transformar operaciones difíciles en operaciones más sencillas. En particular, transforman una multiplicación dentro del argumento en una suma por fuera. Si tenemos el logaritmo de una multiplicación como $\log_2(4 \cdot 8)$, podemos separarlo en la suma de dos logaritmos simples: $\log_2(4) + \log_2(8) = 2 + 3 = 5$. También funciona al revés: una suma de logaritmos de igual base se puede juntar en un solo logaritmo multiplicando sus argumentos.
explicacion_formal: |
  ### Definición formal
  Para toda base $b \in \mathbb{R}^+ \setminus \{1\}$ y cualesquiera argumentos estrictamente positivos $x, y \in \mathbb{R}^+$, la **propiedad del logaritmo de un producto** establece la identidad isomórfica:
  $$\log_b(x \cdot y) = \log_b(x) + \log_b(y)$$

  ### Demostración formal
  Sean $u = \log_b(x)$ y $v = \log_b(y)$. Por definición exponencial:
  $$x = b^u \quad \text{y} \quad y = b^v$$
  Multiplicando ambas expresiones miembro a miembro:
  $$x \cdot y = b^u \cdot b^v = b^{u + v}$$
  Aplicando la definición de logaritmo a la igualdad $x \cdot y = b^{u + v}$:
  $$\log_b(x \cdot y) = u + v = \log_b(x) + \log_b(y) \quad \blacksquare$$

  ### Síntesis didáctica
  Regla de doble sentido:
  - **Expansión**: Convertir un logaritmo producto en suma de logaritmos: $\log_b(x \cdot y) \to \log_b(x) + \log_b(y)$.
  - **Compresión**: Condensar una suma de logaritmos de igual base en un único logaritmo: $\log_b(x) + \log_b(y) \to \log_b(x \cdot y)$.
definiciones_clave: |
  - **Propiedad del producto $\log_b(xy) = \log_b(x) + \log_b(y)$**: Identidad que convierte el producto de argumentos positivos en suma de logaritmos.
  - **Isomorfismo de grupos**: Transformación que convierte la estructura multiplicativa del argumento en la estructura aditiva de las salidas.
  - **Compresión de logaritmos**: Agrupación de múltiples términos aditivos en un solo logaritmo multiplicativo.
propiedades_relaciones: |
  - **Requisito de bases idénticas**: Para agrupar la suma $\log_b(x) + \log_b(y)$ en $\log_b(x \cdot y)$, ambas expresiones deben compartir exactamente la misma base $b$.
  - **Generalización a $n$ factores**: $\log_b(x_1 \cdot x_2 \cdots x_n) = \log_b(x_1) + \log_b(x_2) + \dots + \log_b(x_n)$.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad del producto en los siguientes casos: A) Descompón $\log_6(216 \cdot 36)$, B) Comprime la suma $\log_2(5) + \log_2(6.4)$, C) Simplifica $\log_3(x) + \log_3(y) - \log_3(z)$.'
  pasos:
    - 'Paso 1: Para $\log_6(216 \cdot 36)$, aplicamos expansión: $\log_6(216) + \log_6(36) = 3 + 2 = 5$.'
    - 'Paso 2: Para $\log_2(5) + \log_2(6.4)$, como comparten base 2, comprimimos multiplicando argumentos: $\log_2(5 \cdot 6.4) = \log_2(32) = 5$.'
    - 'Paso 3: Para $\log_3(x) + \log_3(y)$, agrupamos los términos sumados como producto: $\log_3(x \cdot y)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el resultado de comprimir en un solo logaritmo la suma $\log_6(4) + \log_6(9)$?'
    choices:
      - {text: '$\log_6(36) = 2$, multiplicando los argumentos $4 \cdot 9 = 36$', is_correct: true}
      - {text: '$\log_6(13)$, sumando los argumentos $4 + 9 = 13$', is_correct: false}
      - {text: '$\log_{12}(36)$, sumando las bases', is_correct: false}
      - {text: '$\log_6(4/9)$, dividiendo los argumentos', is_correct: false}
    explanation: 'La alternativa correcta es ''$\log_6(36) = 2$, multiplicando los argumentos $4 \cdot 9 = 36$''. La suma de logaritmos de igual base equivale al logaritmo del producto de sus argumentos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si sabemos que $\log_b(2) = 0.3$ y $\log_b(5) = 0.7$, ¿cuál es el valor numérico exacto de $\log_b(10)$?'
    choices:
      - {text: '$1.0$, aplicando $\log_b(2 \cdot 5) = \log_b(2) + \log_b(5) = 0.3 + 0.7 = 1.0$', is_correct: true}
      - {text: '$0.21$, multiplicando $0.3 \cdot 0.7$', is_correct: false}
      - {text: '$0.4$, restando $0.7 - 0.3$', is_correct: false}
      - {text: '$2.33$, dividiendo $0.7 / 0.3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$1.0$, aplicando $\log_b(2 \cdot 5) = \log_b(2) + \log_b(5) = 0.3 + 0.7 = 1.0$''. Como $10 = 2 \cdot 5$, el logaritmo del producto es la suma de los logaritmos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Para expandir $\log_b(x \cdot y)$, escribir el primer factor como $\log_b(x)$ y sumarle el segundo factor como $\log_b(y)$.'
  - 'Paso 2: Para comprimir $\log_b(x) + \log_b(y)$, verificar que las bases sean idénticas.'
  - 'Paso 3: Escribir un único logaritmo en esa base y multiplicar los argumentos dentro del paréntesis: $\log_b(x \cdot y)$.'
  - 'Paso 4: Simplificar el valor numérico resultante si es posible.'
errores_correccion: |
  - **Error 1:** Afirmar que el logaritmo de una suma es la suma de logaritmos (ej: escribir $\log_b(x + y) = \log_b(x) + \log_b(y)$). **Cómo corregirlo:** La propiedad del producto actúa sobre la **multiplicación interna**: $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$. El logaritmo de una suma $\log_b(x + y)$ no se puede separar.
  - **Error 2:** Multiplicar los logaritmos al comprimir una suma (ej: escribir $\log_b(x) + \log_b(y) = \log_b(x) \cdot \log_b(y)$). **Cómo corregirlo:** Al sumar dos logaritmos se genera un solo logaritmo cuyo argumento es el producto de las partes: $\log_b(x \cdot y)$.
ejemplos:
  - titulo: 'Compresión de suma logarítmica'
    enunciado: '¿A qué equivale la suma $\log_2(3) + \log_2(5)$?'
    alternativas:
      - '$\log_2(15)$'
      - '$\log_2(8)$'
      - '$\log_4(15)$'
    respuesta: '$\log_2(15)$'
    solucion_pasos:
      - '1. Aplicamos propiedad del producto: $\log_2(3 \cdot 5) = \log_2(15)$.'
  - titulo: 'Descomposición en producto de primos'
    enunciado: '¿La expresión $\log(30)$ se puede descomponer como $\log(2) + \log(3) + \log(5)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $30 = 2 \cdot 3 \cdot 5$, el logaritmo de 30 equivale a la suma de sus logaritmos primos.'
  - titulo: 'Compresión con tres términos'
    enunciado: '¿La suma $\ln(2) + \ln(3) + \ln(4)$ es igual a $\ln(24)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Multiplicamos los tres argumentos: $2 \cdot 3 \cdot 4 = 24 \implies \ln(24)$.'
  - titulo: 'Imposibilidad en bases distintas'
    enunciado: '¿Se pueden agrupar directamente en un solo logaritmo la expresión $\log_2(5) + \log_3(5)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Las bases son distintas ($2 \neq 3$), por lo que no se puede aplicar la propiedad del producto directa.'
errores_frecuentes:
  - 'La expresión $\log_b(x + y)$ se puede separar como $\log_b(x) + \log_b(y)$.'
  - 'Sumar dos logaritmos de igual base $\log_b(x) + \log_b(y)$ produce la multiplicación de los logaritmos $\log_b(x) \cdot \log_b(y)$.'
  - 'Al agrupar la suma $\log_2(3) + \log_2(4)$, se suman las bases dando $\log_4(12)$.'
  - 'La propiedad del producto del logaritmo permite multiplicar los argumentos cuando los logaritmos tienen bases distintas.'
  - 'El logaritmo de un producto $\log_b(x \cdot y)$ equivale a multiplicar los valores individuales de cada logaritmo.'
afirmaciones_verdaderas:
  - 'La propiedad del logaritmo de un producto establece que $\log_b(x \cdot y) = \log_b(x) + \log_b(y)$ para argumentos estrictamente positivos.'
  - 'La compresión de una suma de logaritmos requiere obligatoriamente que todos los términos involucrados posean la misma base.'
al_terminar_debes_poder: 'Aplicar la propiedad del producto para expandir o comprimir expresiones logarítmicas con precisión matemática.'
