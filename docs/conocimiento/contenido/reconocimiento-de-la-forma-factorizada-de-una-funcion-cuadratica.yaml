semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_FACTORIZADA
resumen_inicial: 'Reconocimiento de la forma factorizada de una función cuadrática:
  parábola, vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Así como la forma canónica expone el vértice, existe otra forma
  que expone directamente los puntos donde la parábola cruza el eje $x$.
explicacion_formal: '### Definición formal


  La forma factorizada de una función cuadrática es $f(x)=a(x-r_1)(x-r_2)$, con $a
  \neq 0$ y $r_1, r_2$ los ceros de la función. Esta forma existe siempre que la función
  tenga ceros reales, es decir, cuando el discriminante de la ecuación asociada es
  no negativo.


  ### Desarrollo didáctico


  Al observar una función en forma factorizada, los ceros se leen directamente cambiando
  el signo de los números dentro de cada paréntesis.


  En $f(x)=2(x-3)(x+5)$: los ceros son $x=3$ y $x=-5$, leídos directamente de los
  factores.'
definiciones_clave: '- **Reconocimiento de la forma factorizada de una función cuadrática**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  reconocimiento de la forma factorizada de una función cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando reconocimiento
    de la forma factorizada de una función cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a reconocimiento
    de la forma factorizada de una función cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
