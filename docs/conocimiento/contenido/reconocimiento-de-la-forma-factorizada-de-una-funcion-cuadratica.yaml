semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_FACTORIZADA
resumen_inicial: 'La forma factorizada de una función cuadrática expresa la regla funcional mediante el producto de binomios $f(x) = a(x - x_1)(x - x_2)$, revelando directamente sus ceros reales $x_1$ y $x_2$.'
explicacion_simple: |
  La forma factorizada expresa una función cuadrática como una multiplicación de factores: el coeficiente $a$ por dos binomios simples en la forma $a(x - x_1)(x - x_2)$. Su gran utilidad radica en que permite ver al instante los números $x_1$ y $x_2$ donde la parábola corta al eje horizontal $x$, sin necesidad de aplicar la fórmula cuadrática.
explicacion_formal: |
  ### Definición formal
  La **forma factorizada** (o forma de ceros/raíces) de una función cuadrática con ceros reales es la representación polinomial expresada como producto de factores lineales:
  $$f(x) = a(x - x_1)(x - x_2)$$
  donde $a \in \mathbb{R} \setminus \{0\}$, y $x_1, x_2 \in \mathbb{R}$ corresponden a los ceros o raíces reales de la función.

  ### Desglose simbólico
  - $a$: Coeficiente cuadrático multiplicativo idéntico al de la forma general y canónica.
  - $x_1, x_2$: Ceros reales tales que $f(x_1) = 0$ y $f(x_2) = 0$.
  - Condición de existencia en $\mathbb{R}$: La forma factorizada con coeficientes reales existe **si y solo si el discriminante es no negativo** ($\Delta = b^2 - 4ac \ge 0$).

  ### Síntesis didáctica
  Si una función cuadrática flota por encima del eje $x$ o yace completamente por debajo sin cortarlo ($\Delta < 0$), no posee raíces reales y por lo tanto **no se puede expresar en forma factorizada dentro del conjunto de los números reales $\mathbb{R}$**.
definiciones_clave: |
  - **Forma factorizada**: Expresión funcional $f(x) = a(x - x_1)(x - x_2)$ que expone los ceros reales de la función.
  - **Ceros o raíces $x_1, x_2$**: Preimágenes que anulan los binomios factores $(x - x_1) = 0$ o $(x - x_2) = 0$.
  - **Factor lineal**: Término de primer grado de la forma $(x - x_k)$.
propiedades_relaciones: |
  - **Caso de raíz doble**: Si $\Delta = 0 \implies x_1 = x_2 = h$, la forma factorizada coincide con la forma canónica con $k = 0$: $f(x) = a(x - x_1)^2$.
  - **Eje de simetría desde la forma factorizada**: El eje de simetría se obtiene como el promedio aritmético de las raíces expuestas: $x = \frac{x_1 + x_2}{2}$.
ejemplo_guiado:
  enunciado: 'Verifica que la función $f(x) = -3(x - 2)(x + 4)$ está en forma factorizada, identifica el coeficiente $a$ y extrae los ceros reales $x_1$ y $x_2$.'
  pasos:
    - 'Paso 1: Comparamos $f(x) = -3(x - 2)(x + 4)$ con la forma factorizada estándar $a(x - x_1)(x - x_2)$.'
    - 'Paso 2: Identificamos el factor multiplicativo externo $a = -3$.'
    - 'Paso 3: Del primer binomio $(x - 2) = (x - x_1)$, extraemos el cero $x_1 = 2$.'
    - 'Paso 4: Del segundo binomio $(x + 4) = (x - (-4)) = (x - x_2)$, extraemos el cero $x_2 = -4$.'
    - 'Paso 5: Concluimos que está en forma factorizada con $a = -3$, y sus ceros reales son $x_1 = 2$ y $x_2 = -4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dada la función cuadrática $g(x) = 5(x + 3)(x - 7)$, ¿cuáles son los ceros reales $x_1$ y $x_2$ extraídos de su forma factorizada?'
    choices:
      - {text: '$x_1 = -3$ y $x_2 = 7$', is_correct: true}
      - {text: '$x_1 = 3$ y $x_2 = -7$', is_correct: false}
      - {text: '$x_1 = 5$ y $x_2 = 21$', is_correct: false}
      - {text: '$x_1 = -3$ y $x_2 = -7$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = -3$ y $x_2 = 7$''. Al igualar cada binomio a cero obtenemos $x + 3 = 0 \implies x_1 = -3$ y $x - 7 = 0 \implies x_2 = 7$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Bajo qué condición sobre el discriminante $\Delta = b^2 - 4ac$ es posible expresar una función cuadrática en forma factorizada real?'
    choices:
      - {text: 'Únicamente cuando el discriminante es mayor o igual a cero ($\Delta \ge 0$)', is_correct: true}
      - {text: 'Únicamente cuando el discriminante es estrictamente negativo ($\Delta < 0$)', is_correct: false}
      - {text: 'Únicamente cuando $a = 1$', is_correct: false}
      - {text: 'Para cualquier valor del discriminante sin restricción', is_correct: false}
    explanation: 'La alternativa correcta es ''Únicamente cuando el discriminante es mayor o igual a cero ($\Delta \ge 0$)''. Si $\Delta < 0$, las raíces son complejas no reales.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reconocer la estructura multiplicativa $a(x - x_1)(x - x_2)$ compuesta por dos binomios en $x$.'
  - 'Paso 2: Extraer el coeficiente principal $a$ que multiplica a los factores.'
  - 'Paso 3: Igualar cada factor a cero para extraer los ceros reales $x_1$ y $x_2$ invirtiendo el signo mostrado en los binomios.'
errores_correccion: |
  - **Error 1:** Creer que toda función cuadrática se puede expresar en forma factorizada con números reales. **Cómo corregirlo:** Si $\Delta < 0$, la parábola no corta al eje $x$ y no posee raíces reales, por lo que carece de forma factorizada en $\mathbb{R}$.
  - **Error 2:** Olvidar incluir el coeficiente multiplicativo $a$ al escribir la forma factorizada (ej: escribir $(x - 2)(x - 5)$ para una función con $a = 3$). **Cómo corregirlo:** La forma factorizada requiere incluir el escalar $a$ delante de los factores: $3(x - 2)(x - 5)$.
ejemplos:
  - titulo: 'Identificación de la forma factorizada'
    enunciado: '¿Cuál de las siguientes expresiones corresponde a una función cuadrática en forma factorizada?'
    alternativas:
      - '$f(x) = -2(x - 1)(x + 5)$'
      - '$f(x) = -2(x - 1)^2 + 5$'
      - '$f(x) = -2x^2 + 8x - 10$'
    respuesta: '$f(x) = -2(x - 1)(x + 5)$'
    solucion_pasos:
      - '1. La forma factorizada presenta el producto de dos binomios en $x$.'
      - '2. La expresión $-2(x - 1)(x + 5)$ cumple exactamente la estructura $a(x - x_1)(x - x_2)$.'
  - titulo: 'Forma factorizada con raíz doble'
    enunciado: '¿Cómo se expresa en forma factorizada la función $g(x) = 4(x - 3)^2$?'
    alternativas:
      - '$g(x) = 4(x - 3)(x - 3)$'
      - '$g(x) = 4x(x - 3)$'
      - '$g(x) = (4x - 12)(x + 3)$'
    respuesta: '$g(x) = 4(x - 3)(x - 3)$'
    solucion_pasos:
      - '1. El binomio al cuadrado equivale a multiplicar el factor por sí mismo.'
      - '2. $g(x) = 4(x - 3)(x - 3)$ exhibe una raíz doble en $x_1 = x_2 = 3$.'
  - titulo: 'Preservación del signo de a'
    enunciado: '¿El parámetro $a$ en la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ determina la concavidad de la parábola?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El factor $a$ es el mismo coeficiente cuadrático principal que fija si abre hacia arriba ($a > 0$) o hacia abajo ($a < 0$).'
  - titulo: 'Ceros como puntos de corte'
    enunciado: 'Dada $f(x) = 2(x - 1)(x - 4)$, ¿los puntos de corte con el eje $x$ son $(1, 0)$ y $(4, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Los ceros extraídos $x_1 = 1$ y $x_2 = 4$ dan directamente las coordenadas $(1, 0)$ y $(4, 0)$.'
errores_frecuentes:
  - 'La función cuadrática $f(x) = x^2 + 9$ se expresa en el conjunto real como $f(x) = (x + 3)(x - 3)$.'
  - 'Los ceros reales extraídos de $f(x) = (x + 5)(x - 2)$ son $x_1 = 5$ y $x_2 = -2$.'
  - 'La forma factorizada $f(x) = a(x - x_1)(x - x_2)$ no requiere escribir el coeficiente $a$.'
  - 'Toda parábola cuadrática posee forma factorizada real sin importar su discriminante.'
  - 'Los ceros $x_1$ y $x_2$ en la forma factorizada representan las coordenadas del vértice.'
afirmaciones_verdaderas:
  - 'La forma factorizada $f(x) = a(x - x_1)(x - x_2)$ expone explícitamente los ceros reales $x_1$ y $x_2$ de la función cuadrática.'
  - 'Una función cuadrática sólo posee representación factorizada en los números reales si su discriminante satisface $\Delta \ge 0$.'
al_terminar_debes_poder: 'Reconocer e interpretar la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ identificando sus raíces reales.'
