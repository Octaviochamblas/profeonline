procedimiento:
- 'Paso 1: Verifica que la función esté expresada como $a(x-r_1)(x-r_2)$.'
- 'Paso 2: Identifica $r_1$ y $r_2$, reescribiendo cada binomio si es necesario para
  leer su signo correctamente.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en reconocimiento de la forma factorizada de una
  función cuadrática.
ejemplos:
- titulo: Reconocimiento de una función en forma factorizada
  enunciado: ¿Está $f(x)=-2(x-1)(x-6)$ en forma factorizada?
  solucion_pasos:
  - Tiene la estructura $a(x-r_1)(x-r_2)$, con $a=-2$.
  - Sí, está en forma factorizada.
- titulo: Identificación de los ceros desde la forma factorizada
  enunciado: ¿Cuáles son los ceros de $f(x)=3(x+2)(x-7)$?
  solucion_pasos:
  - 'Reescribiendo $(x+2)$ como $(x-(-2))$: un cero es $x=-2$.'
  - El otro cero es $x=7$.
- titulo: ¿Toda función cuadrática admite forma factorizada con números reales?
  enunciado: ¿Toda función cuadrática admite forma factorizada con números reales?
  respuesta: 'No'
  solucion_pasos:
  - Solo si la función tiene al menos un cero real, es decir, si el discriminante
    de la ecuación asociada es no negativo.
- titulo: ¿El coeficiente $a$ en la forma factorizada es el mismo que en la forma
    general?
  enunciado: ¿El coeficiente $a$ en la forma factorizada es el mismo que en la forma
    general?
  respuesta: Sí
  solucion_pasos:
  - El coeficiente principal se conserva idéntico entre todas las formas equivalentes
    de la misma función.
errores_frecuentes:
- Leer los ceros con el signo incorrecto al no reescribir el binomio en la forma $(x-r)$.
- Confundir la forma factorizada con la forma canónica.
- Asumir que toda función tiene forma factorizada con números reales, sin verificar
  el discriminante.
- Olvidar el coeficiente $a$ al escribir o interpretar la forma factorizada.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  reconocimiento de la forma factorizada de una función cuadrática.
