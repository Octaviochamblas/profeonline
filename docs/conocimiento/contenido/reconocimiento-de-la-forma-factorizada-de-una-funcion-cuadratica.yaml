semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_FACTORIZADA
resumen_inicial: La forma factorizada $f(x) = a(x - x_1)(x - x_2)$ es la representación de la función cuadrática que explicita directamente sus ceros reales $x_1$ y $x_2$, existiendo exclusivamente cuando el discriminante es no negativo ($\Delta \ge 0$).
explicacion_simple: "![La forma factorizada $f(x) = a(x - x_1)(x - x_2)$ es la representación de la función cuadrática que explicita directamente sus ceros reales $x_1$ y $x_2$, existiendo exclusivamente cuando el discriminante es no negativo ($\\Delta \\ge 0$)](/static/img/nodos/reconocimiento-de-la-forma-factorizada-de-una-funcion-cuadratica-intro.svg)\n\n\nLa **forma factorizada** es la manera más útil de escribir una parábola si lo que te interesa es saber **dónde corta al eje horizontal $X$**:\n$$f(x) = a(x - x_1)(x - x_2)$$\n\n- **Los ceros se leen directamente:** Son **$x_1$** y **$x_2$**.\n- Los puntos de corte con el eje $X$ son **$(x_1, 0)$** y **$(x_2, 0)$**.\n- *Ejemplo:* Si $f(x) = 3(x - 2)(x + 5)$:\n  - Corta en $x = 2$ (punto $(2, 0)$).\n  - Corta en $x = -5$ (punto $(-5, 0)$).\n- **Condición necesaria:** Solo se puede escribir así si la parábola realmente toca o cruza el eje $X$ (es decir, si $\\Delta \\ge 0$)."
explicacion_formal: 'Sea $f(x) = ax^2 + bx + c$ con $a \neq 0$ y discriminante $\Delta = b^2 - 4ac \ge 0$. Por el Teorema Fundamental del Álgebra, el polinomio se descompone en factores lineales sobre $\mathbb{R}$:

  $$f(x) = a(x - x_1)(x - x_2), \quad x_{1,2} = \frac{-b \pm \sqrt{\Delta}}{2a} \in \mathbb{R}$$


  **Casos estructurales**:

  1. **$\Delta > 0$ (Ceros reales simples distintos)**: $f(x) = a(x - x_1)(x - x_2)$ con $x_1 \neq x_2$.

  2. **$\Delta = 0$ (Cero real doble / Tangencia)**: $f(x) = a(x - x_0)^2$.

  3. **$\Delta < 0$ (Sin ceros reales)**: La función **no posee forma factorizada en el cuerpo de los números reales $\mathbb{R}$**.'
definiciones_clave: '- **Forma factorizada real**: Representación $a(x - x_1)(x - x_2)$ que explicita las raíces de la función.

  - **Factor lineal**: Binomio de primer grado $(x - x_i)$ asociado al cero $x_i$.'
propiedades_relaciones: '- **Eje de simetría inmediato**: $x_v = \frac{x_1 + x_2}{2}$.

  - **Ordenada al origen**: $f(0) = a(-x_1)(-x_2) = a x_1 x_2 = c$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La forma factorizada $f(x) = a(x - x_1)(x - x_2)$ es la representación de la función cuadrática que explicita directamente sus ceros reales $x_1$ y $x_2$, existiendo exclusivamente cuando el discriminante es no negativo ($\Delta \ge 0$)](/static/img/nodos/reconocimiento-de-la-forma-factorizada-de-una-funcion-cuadratica-ejemplos.svg)



    Determina si la función $f(x) = -2(x - 1)(x - 7)$ está en forma factorizada, extrae sus parámetros y calcula el eje de simetría.'
  pasos:
  - 'Paso 1: Reconocer la estructura: $f(x) = a(x - x_1)(x - x_2)$ con $a = -2, x_1 = 1, x_2 = 7$.

    - **Sí está en forma factorizada**.'
  - 'Paso 2: Identificar los cortes con el eje $X$:

    - $x_1 = 1 \implies (1, 0)$.

    - $x_2 = 7 \implies (7, 0)$.'
  - 'Paso 3: Calcular el eje de simetría promediando los ceros:

    $x_v = \frac{1 + 7}{2} = \frac{8}{2} = 4$.

    - Ecuación del eje de simetría: $x = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Bajo qué condición matemática puede una función cuadrática expresarse en forma factorizada real?
  choices:
  - text: Cuando su discriminante es no negativo (Δ ≥ 0).
    is_correct: true
  - text: Solo cuando a > 0.
    is_correct: false
  - text: Solo cuando c = 0.
    is_correct: false
  - text: Siempre, para cualquier función cuadrática.
    is_correct: false
  explanation: La alternativa correcta es 'Cuando su discriminante es no negativo (Δ ≥ 0).'. Si $\Delta < 0$, las raíces son complejas conjugadas y no existe factorización sobre $\mathbb{R}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función factorizada $f(x) = 4(x + 3)(x - 5)$, ¿dónde corta la curva al eje X?
  choices:
  - text: En (-3, 0) y (5, 0)
    is_correct: true
  - text: En (3, 0) y (-5, 0)
    is_correct: false
  - text: En (0, -3) y (0, 5)
    is_correct: false
  - text: En (-3, 5)
    is_correct: false
  explanation: La alternativa correcta es 'En (-3, 0) y (5, 0)'. Los ceros son $x = -3$ y $x = 5$, dando los puntos $(-3, 0)$ y $(5, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si la función está escrita como producto de binomios $a(x - x_1)(x - x_2)$.'
- 'Paso 2: Extraer el coeficiente principal $a$.'
- 'Paso 3: Extraer los ceros $x_1$ y $x_2$ invirtiendo los signos dentro de cada binomio.'
- 'Paso 4: Escribir las coordenadas de corte con el eje $X$ como $(x_1, 0)$ y $(x_2, 0)$.'
errores_correccion: '- **Error común:** Olvidar que $(x + k)$ genera un cero en $-k$.

  - **Cómo corregirlo:** Para hallar el cero, **iguala el factor a cero**: $x + k = 0 \implies x = -k$.'
ejemplos:
- titulo: 'Ejemplo 1: Ceros enteros directos'
  enunciado: En $f(x) = 5(x - 3)(x - 8)$, ¿cuáles son los ceros?
  alternativas:
  - x = 3 y x = 8
  - x = -3 y x = -8
  - x = 5 y x = 3
  - x = 3 y x = -8
  respuesta: x = 3 y x = 8
  solucion_pasos:
  - 'Paso 1: $x_1 = 3, x_2 = 8$.'
- titulo: 'Ejemplo 2: Cero en el origen'
  enunciado: ¿Qué ceros tiene $g(x) = -2x(x + 9)$?
  alternativas:
  - x = 0 y x = -9
  - x = 0 y x = 9
  - x = -2 y x = -9
  - Solo x = -9
  respuesta: x = 0 y x = -9
  solucion_pasos:
  - 'Paso 1: El factor $x$ da $x = 0$; $(x + 9)$ da $x = -9$.'
- titulo: 'Ejemplo 3: Raíz doble'
  enunciado: Para $h(x) = 3(x - 4)^2$, ¿cómo es el corte con el eje X?
  alternativas:
  - Un único punto tangente en (4, 0)
  - Dos puntos en (4, 0) y (-4, 0)
  - Corta en (0, 4)
  - No corta al eje X
  respuesta: Un único punto tangente en (4, 0)
  solucion_pasos:
  - 'Paso 1: $x_1 = x_2 = 4 \implies$ contacto tangente en $(4, 0)$.'
- titulo: 'Ejemplo 4: Coeficiente cuadrático a'
  enunciado: En $f(x) = -7(x - 1)(x + 2)$, ¿cuánto vale el coeficiente principal a?
  alternativas:
  - '-7'
  - '7'
  - '1'
  - '-2'
  respuesta: '-7'
  solucion_pasos:
  - 'Paso 1: $a = -7$.'
errores_frecuentes:
- No cambiar el signo de los ceros al extraerlos de los binomios.
- Olvidar el cero x = 0 cuando hay factor común x.
- Ignorar el coeficiente a ubicado fuera de los factores.
afirmaciones_verdaderas:
- La forma factorizada f(x) = a(x - x₁)(x - x₂) explicita inmediatamente los ceros de la función.
- Una función cuadrática tiene forma factorizada real si y solo si su discriminante satisface Δ ≥ 0.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar la forma factorizada f(x) = a(x - x₁)(x - x₂).


  **CÓMO:** Identificando los ceros reales x₁ y x₂ y el factor de concavidad a.


