semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FORMA_FACTORIZADA
resumen_inicial: La forma factorizada expresa la función cuadrática como $f(x) = a(x - x_1)(x - x_2)$, visibilizando directamente las raíces reales $x_1$ y $x_2$.
explicacion_simple: |
  La **forma factorizada o forma de las raíces** expresa una función cuadrática mediante la multiplicación de dos factores lineales:

  $$f(x) = a(x - x_1)(x - x_2)$$

  **¿Por qué es útil?**
  - Porque te muestra **DE INMEDIATO DÓNDE LA PARÁBOLA CORTA AL EJE X** ($x_1$ y $x_2$) sin tener que resolver ecuaciones.
  - **Ejemplo**: En $f(x) = 2(x - 3)(x - 7)$:
    - Las raíces son **$x_1 = 3$** y **$x_2 = 7$**.
    - La parábola corta al eje X en los puntos **$(3, 0)$ y $(7, 0)$**.
  - **Condición**: Solo existe para funciones cuadráticas que tienen soluciones o raíces reales ($\Delta \ge 0$).
explicacion_formal: |
  Sea la función $f(x) = ax^2 + bx + c$ con discriminante no negativo $\Delta = b^2 - 4ac \ge 0$. Por el Teorema Fundamental del Álgebra, el polinomio se descompone en el producto de factores de primer grado sobre $\mathbb{R}$:

  $$f(x) = a(x - x_1)(x - x_2) \quad \text{con } a \neq 0, \, x_1, x_2 \in \mathbb{R}$$

  **Propiedades estructurales:**
  - $a$: Coeficiente cuadrático idéntico al de la forma general.
  - $x_1, x_2$: Ceros reales de la función ($f(x_1) = 0$ y $f(x_2) = 0$).
  - Si $\Delta < 0$, la función **no posee representación factorizada** en el cuerpo de los números reales $\mathbb{R}$.
definiciones_clave: |
  - **Forma factorizada**: Expresión funcional de segundo grado $f(x) = a(x - x_1)(x - x_2)$ basada en la multiplicación del coeficiente $a$ por los factores lineales de sus raíces reales.
propiedades_relaciones: |
  - **Ubicación del eje de simetría**: En la forma factorizada, el eje de simetría $x = h$ se calcula directamente como la media aritmética de las raíces: $h = \frac{x_1 + x_2}{2}$.
ejemplo_guiado:
  enunciado: 'Reconoce si $f(x) = -3(x + 2)(x - 5)$ está en forma factorizada, identifica $a$ y halla los cortes con el eje X.'
  pasos:
    - 'Paso 1: Observar la estructura $a(x - x_1)(x - x_2)$: es el producto de dos binomios lineales multiplicados por $-3$.'
    - 'Paso 2: Aislar el coeficiente principal: $a = -3$.'
    - 'Paso 3: Obtener las raíces invirtiendo el signo de los términos internos: $x_1 = -2$ y $x_2 = 5$.'
    - 'Paso 4: Concluir que los cortes con el eje X ocurren en los puntos $(-2, 0)$ y $(5, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué requisito fundamental debe cumplirse para que una función cuadrática se pueda expresar en forma factorizada real $a(x - x_1)(x - x_2)$?'
    choices:
      - {text: 'El discriminante debe ser mayor o igual a cero ($\Delta \ge 0$)', is_correct: true}
      - {text: 'El coeficiente cuadrático $a$ debe ser obligatoriamente positivo.', is_correct: false}
      - {text: 'El término independiente $c$ debe ser cero.', is_correct: false}
      - {text: 'El vértice debe ubicarse en el origen $(0,0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El discriminante debe ser mayor o igual a cero ($\Delta \ge 0$)''. Solo así existen raíces reales.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la función factorizada $f(x) = 4(x - 8)(x + 3)$, ¿cuáles son los ceros o raíces de la función?'
    choices:
      - {text: '$x_1 = 8$ y $x_2 = -3$', is_correct: true}
      - {text: '$x_1 = -8$ y $x_2 = 3$.', is_correct: false}
      - {text: '$x_1 = 4$ y $x_2 = 8$.', is_correct: false}
      - {text: '$x_1 = 8$ y $x_2 = 3$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = 8$ y $x_2 = -3$''. Despejando $x - 8 = 0 \implies x = 8$ y $x + 3 = 0 \implies x = -3$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Comprobar que la función se presente como el producto de dos factores binómicos de primer grado $(x - x_1)(x - x_2)$ multiplicados por $a$.'
  - 'Paso 2: Aislar el coeficiente numérico frontal $a$.'
  - 'Paso 3: Igualar cada paréntesis a cero para despejar las raíces reales $x_1$ y $x_2$.'
  - 'Paso 4: Escribir las intersecciones con el eje X como las parejas ordenadas $(x_1, 0)$ y $(x_2, 0)$.'
errores_correccion: |
  - **Error común:** Confundir los signos de las raíces en $(x - x_1)(x - x_2)$ (ej. en $(x + 4)$ pensar que la raíz es $x = +4$).
  - **Cómo corregirlo:** La raíz es el número que **ANULA EL PARÉNTESIS**: para que $(x + 4) = 0$, la raíz debe ser **$x = -4$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Forma factorizada con raíces positivas.
    alternativas:
      - 'a = 1, raíces x = 2 y x = 6'
      - 'a = 1, raíces x = -2 y x = -6'
      - 'a = 2, raíces x = 6 y x = 0'
    respuesta: 'a = 1, raíces x = 2 y x = 6'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Forma factorizada con raíz doble.
    alternativas:
      - 'Raíz única doble x = 3 (Vértice en el eje X)'
      - 'Dos raíces distintas x = 3 y x = -3'
      - 'Sin raíces reales'
    respuesta: 'Raíz única doble x = 3 (Vértice en el eje X)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = (x + 5)(x - 2)$, es correcto afirmar que sus raíces reales son $x_1 = 5$ y $x_2 = -2$.'
  - 'La creencia de que cualquier función cuadrática puede ser escrita en forma factorizada sobre el conjunto de los números reales.'
  - 'La ausencia del coeficiente multiplicador $a$ al escribir la forma factorizada asumiendo que siempre vale 1.'
  - 'La equiparación de las raíces $x_1, x_2$ de la forma factorizada con las coordenadas del vértice $V(h, k)$.'
  - 'Afirmar que la forma factorizada entrega directamente el valor del corte con el eje Y.'
afirmaciones_verdaderas:
  - 'La forma factorizada $f(x) = a(x - x_1)(x - x_2)$ revela de forma inmediata las raíces reales $x_1$ y $x_2$ donde la parábola corta al eje X.'
  - 'Una función cuadrática posee forma factorizada en los reales si y solo si su discriminante satisface $\Delta \ge 0$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ e identificar sus ceros reales.
  CÓMO: Verificar la presencia de factores lineales, igualar cada paréntesis a cero para despejar $x_1, x_2$ y extraer $a$.
