semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_CUADRADA
resumen_inicial: Racionalizar una fracción con denominador $\sqrt{a}$ consiste en
  amplificar el numerador y el denominador por $\sqrt{a}$ para eliminar la raíz del
  denominador ($\frac{A}{\sqrt{a}} = \frac{A\sqrt{a}}{a}$).
explicacion_simple: 'Para eliminar una raíz cuadrada del denominador de una fracción:

  1. Multiplicas arriba y abajo por esa misma raíz cuadrada.

  2. Abajo $\sqrt{a} \cdot \sqrt{a} = a$, desapareciendo el radical.

  3. Arriba queda la raíz multiplicando al numerador.

  Ejemplo: $\frac{6}{\sqrt{3}} = \frac{6 \cdot \sqrt{3}}{\sqrt{3} \cdot \sqrt{3}}
  = \frac{6\sqrt{3}}{3} = 2\sqrt{3}$.'
explicacion_formal: 'Para todo $A \in \mathbb{R}$ y $a > 0$, la racionalización del
  monomio $\sqrt{a}$ se define amplificando por $\frac{\sqrt{a}}{\sqrt{a}} = 1$:

  $$\frac{A}{\sqrt{a}} = \frac{A \cdot \sqrt{a}}{\sqrt{a} \cdot \sqrt{a}} = \frac{A\sqrt{a}}{a}$$'
definiciones_clave: '- **Factor racionalizante**: Expresión $\sqrt{a}$ que elimina
  la raíz cuadrada del denominador al multiplicarse por sí misma.'
propiedades_relaciones: '- **Conservación del valor**: La fracción amplificada posee
  exactamente el mismo valor numérico que la fracción original.'
ejemplo_guiado:
  enunciado: Racionaliza el denominador de $\frac{10}{\sqrt{5}}$.
  pasos:
  - 'Identificar la raíz del denominador: $\sqrt{5}$.'
  - 'Amplificar la fracción por $\frac{\sqrt{5}}{\sqrt{5}}$: $\frac{10 \cdot \sqrt{5}}{\sqrt{5}
    \cdot \sqrt{5}}$.'
  - 'Calcular el denominador: $\sqrt{5} \cdot \sqrt{5} = 5$.'
  - 'Formar la fracción $\frac{10\sqrt{5}}{5}$ y simplificar entre 5: $2\sqrt{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión racionalizada de $\frac{4}{\sqrt{2}}$?
  choices:
  - text: 2\sqrt{2}
    is_correct: true
  - text: 4\sqrt{2}
    is_correct: false
  - text: '2'
    is_correct: false
  - text: \sqrt{2} / 2
    is_correct: false
  explanation: 'La correcta es: 2\sqrt{2}. $\frac{4\sqrt{2}}{2} = 2\sqrt{2}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Racionaliza $\frac{3}{\sqrt{3}}$.
  choices:
  - text: \sqrt{3}
    is_correct: true
  - text: 3\sqrt{3}
    is_correct: false
  - text: '1'
    is_correct: false
  - text: 9\sqrt{3}
    is_correct: false
  explanation: 'La correcta es: \sqrt{3}. $\frac{3\sqrt{3}}{3} = \sqrt{3}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la raíz cuadrada $\sqrt{a}$ en el denominador.'
- 'Paso 2: Multiplicar numerador y denominador por $\sqrt{a}$.'
- 'Paso 3: Reemplazar $\sqrt{a} \cdot \sqrt{a}$ por $a$ en el denominador.'
- 'Paso 4: Simplificar el coeficiente del numerador con el entero del denominador
  si es posible.'
errores_correccion: No olvides simplificar los enteros tras eliminar la raíz. $\frac{10\sqrt{5}}{5}$
  debe reducirse a $2\sqrt{5}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Racionaliza $\frac{1}{\sqrt{2}}$.
  alternativas:
  - \sqrt{2}/2
  - \sqrt{2}
  - 1/2
  respuesta: \sqrt{2}/2
  solucion_pasos:
  - $\frac{1 \cdot \sqrt{2}}{\sqrt{2} \cdot \sqrt{2}} = \frac{\sqrt{2}}{2}$.
errores_frecuentes:
- Olvidar simplificar el numerador con el denominador.
afirmaciones_verdaderas:
- $\frac{A}{\sqrt{a}} = \frac{A\sqrt{a}}{a}$ para $a > 0$.
al_terminar_debes_poder: Racionalizar denominadores con raíces cuadradas simples.
fuente: Texto escolar MINEDUC.
estado: publicado
