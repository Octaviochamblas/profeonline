resumen_inicial: 'La racionalización de un denominador monomio con raíz cuadrada $\frac{a}{\sqrt{b}}$
  se realiza multiplicando numerador y denominador por $\frac{\sqrt{b}}{\sqrt{b}}$,
  transformando el denominador en un entero racional: $\frac{a\sqrt{b}}{b}$ ($b >
  0$).'
explicacion_simple: Racionalizar una fracción con una raíz cuadrada en la parte de
  abajo significa eliminar esa raíz del denominador sin alterar el valor de la fracción.
  Para lograrlo, multiplicamos la fracción completa (arriba y abajo) por esa misma
  raíz cuadrada.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $b > 0$, la **Racionalización
  de Raíz Cuadrada Simple** se define amplificando por el elemento neutro $1 = \frac{\sqrt{b}}{\sqrt{b}}$:


  $$\frac{a}{\sqrt{b}} = \frac{a}{\sqrt{b}} \cdot \frac{\sqrt{b}}{\sqrt{b}} = \frac{a
  \cdot \sqrt{b}}{\left(\sqrt{b}\right)^2} = \frac{a\sqrt{b}}{b}$$


  **Demostración de preservación de valor:**

  Como $\frac{\sqrt{b}}{\sqrt{b}} = 1$, la operación es una amplificación que elimina
  el radical irracional del denominador sin alterar el valor real de la fracción.


  > **Complemento didáctico:** Si el denominador es de la forma $c\sqrt{b}$, solo
  se necesita amplificar por la raíz $\sqrt{b}$, obteniendo $\frac{a\sqrt{b}}{c \cdot
  b}$.'
definiciones_clave: '- **Racionalización monomio cuadrado**: Transformación $\frac{a}{\sqrt{b}}
  = \frac{a\sqrt{b}}{b}$ que convierte el denominador en el entero $b > 0$.'
propiedades_relaciones: '- **Elemento neutro multiplicativo**: Amplificación por $\frac{\sqrt{b}}{\sqrt{b}}
  = 1$.'
ejemplo_guiado:
  enunciado: Racionalice el denominador de las expresiones $\frac{6}{\sqrt{3}}$ y
    $\frac{5}{2\sqrt{5}}$.
  pasos:
  - 'Paso 1: Para $\frac{6}{\sqrt{3}}$, amplificar por $\frac{\sqrt{3}}{\sqrt{3}}$:
    $\frac{6 \cdot \sqrt{3}}{\sqrt{3} \cdot \sqrt{3}} = \frac{6\sqrt{3}}{3}$.'
  - 'Paso 2: Simplificar la fracción entre $6$ y $3$: $\frac{6}{3}\sqrt{3} = 2\sqrt{3}$.'
  - 'Paso 3: Para $\frac{5}{2\sqrt{5}}$, amplificar por $\frac{\sqrt{5}}{\sqrt{5}}$:
    $\frac{5\sqrt{5}}{2 \cdot 5} = \frac{5\sqrt{5}}{10} = \frac{\sqrt{5}}{2}$.'
  - 'Conclusión: $\frac{6}{\sqrt{3}} = 2\sqrt{3}$ y $\frac{5}{2\sqrt{5}} = \frac{\sqrt{5}}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué factor se amplifica la fracción a / sqrt(b) para eliminar la
    raíz cuadrada del denominador (b > 0)?
  choices:
  - text: Se amplifica por el factor neutro sqrt(b) / sqrt(b)
    is_correct: true
  - text: Se amplifica por b / b
    is_correct: false
  - text: Se multiplica únicamente el numerador por b
    is_correct: false
  - text: Se resta sqrt(b) en el denominador
    is_correct: false
  explanation: La alternativa correcta es 'Se amplifica por el factor neutro sqrt(b)
    / sqrt(b)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 6 / sqrt(3), ¿cuál fue la forma racionalizada
    y simplificada final?
  choices:
  - text: 2 · sqrt(3)
    is_correct: true
  - text: 6 · sqrt(3)
    is_correct: false
  - text: sqrt(3) / 2
    is_correct: false
  - text: '18'
    is_correct: false
  explanation: La alternativa correcta es '2 · sqrt(3)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de racionalizar denominadores monomios
  de raíz cuadrada $\frac{a}{\sqrt{b}} = \frac{a\sqrt{b}}{b}$, eliminando la raíz
  del denominador mediante la amplificación por $\frac{\sqrt{b}}{\sqrt{b}}$.
semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_CUADRADA
procedimiento:
- 'Paso 1: Identificar la estructura del denominador (monomio de raíz cuadrada, monomio
  $n$-ésimo o binomio).'
- 'Paso 2: Determinar el factor de amplificación conveniente (raíz idéntica, raíz
  de exponente complementario o conjugado).'
- 'Paso 3: Amplificar la fracción (numerador y denominador) por dicho factor.'
- 'Paso 4: Simplificar los radicales del denominador y reducir los coeficientes resultantes.'
errores_correccion: '- **Error 1: Multiplicar solo el denominador olvidando el numerador.**
  **Cómo corregirlo:** La racionalización es una AMPLIFICACIÓN de fracción; se DEBE
  multiplicar numerador y denominador por el mismo factor.


  - **Error 2: Amplificar un binomio $(\sqrt{a} + \sqrt{b})$ por la misma suma en
  lugar del conjugado.** **Cómo corregirlo:** El cuadrado de binomio deja el término
  $2\sqrt{ab}$; se debe amplificar por el CONJUGADO $(\sqrt{a} - \sqrt{b})$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de racionalización para MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_CUADRADA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del procedimiento de racionalización.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia numéríca.
  alternativas:
  - Conserva el valor
  - Altera el valor
  - Indeterminado
  respuesta: Conserva el valor
  solucion_pasos:
  - Demostración por amplificación por el elemento neutro 1.
- titulo: ¿Elimina la racionalización el valor irracional del denominador?
  respuesta: Sí
  solucion_pasos:
  - Sí, transforma el denominador en un número entero racional.
- titulo: ¿Altera la racionalización el valor cuantitativo de la fracción?
  respuesta: 'No'
  solucion_pasos:
  - No, es una amplificación equivalente por el número 1.
errores_frecuentes:
- Multiplicar únicamente la raíz del denominador sin modificar el numerador de la
  fracción.
- Amplificar un denominador de raíz $n$-ésima por la misma raíz sin usar el exponente
  complementario.
- Usar el cuadrado de binomio para racionalizar una suma de raíces cuadradas.
- La racionalización de $\frac{1}{\sqrt{2}}$ equivale al entero 2 tras eliminar la
  raíz.
- Cambiar los signos de los numeradores al aplicar el conjugado del denominador.
afirmaciones_verdaderas:
- La racionalización consiste en transformar una fracción con radicales en el denominador
  a una fracción equivalente con denominador racional.
- Amplificar por el factor de racionalización no altera el valor de la fracción por
  ser equivalente a multiplicar por 1.
