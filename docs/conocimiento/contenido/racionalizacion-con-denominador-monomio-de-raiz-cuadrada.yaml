semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_CUADRADA
resumen_inicial: 'La racionalización de una fracción con denominador monomio de raíz cuadrada consiste en amplificar la fracción multiplicando numerador y denominador por dicha raíz cuadrada: $\frac{a}{\sqrt{b}} = \frac{a\sqrt{b}}{b}$, eliminando el radical del divisor.'
explicacion_simple: '![Racionalización con denominador monomio de raíz cuadrada](/static/img/nodos/racionalizacion-con-denominador-monomio-de-raiz-cuadrada-intro.svg)


  En matemáticas, tener una raíz inexacta en el denominador (como en $\frac{6}{\sqrt{3}}$) resulta incómodo para sumar fracciones o estimar valores.

  - **¿Cómo se soluciona?** Multiplicas arriba y abajo por la misma raíz cuadrada (que equivale a multiplicar por $1$):

  $$\frac{6}{\sqrt{3}} \cdot \frac{\sqrt{3}}{\sqrt{3}} = \frac{6\sqrt{3}}{(\sqrt{3})^2} = \frac{6\sqrt{3}}{3} = 2\sqrt{3}$$

  - La raíz cuadrada se cancela en el denominador porque $(\sqrt{b})^2 = b$, y simplificas los números racionales resultantes.

  - **¡Importante en la PAES!** Las opciones de respuesta en la prueba oficial siempre aparecen racionalizadas.'
explicacion_formal: 'Sea la fracción algebraica o numérica $\frac{a}{\sqrt{b}}$ con $a \in \mathbb{R}$ y $b \in \mathbb{R}^+$. El **Teorema de Racionalización Cuadrática Monomial** establece la equivalencia de fracciones mediante el elemento neutro multiplicativo $1 = \frac{\sqrt{b}}{\sqrt{b}}$:


  $$\frac{a}{\sqrt{b}} = \frac{a}{\sqrt{b}} \cdot \frac{\sqrt{b}}{\sqrt{b}} = \frac{a\sqrt{b}}{(\sqrt{b})^2} = \frac{a\sqrt{b}}{b}$$


  **Extensión a denominadores con coeficientes escalares ($k\sqrt{b}$):**

  $$\frac{a}{k\sqrt{b}} = \frac{a}{k\sqrt{b}} \cdot \frac{\sqrt{b}}{\sqrt{b}} = \frac{a\sqrt{b}}{k \cdot b} \quad (k \in \mathbb{R} \setminus \{0\})$$

  Solo es necesario amplificar por el factor radical puro $\sqrt{b}$, evitando multiplicar innecesariamente por el escalar $k$.'
definiciones_clave: '- **Racionalización**: Proceso algebraico mediante el cual se transforma una fracción con radicales en el denominador en una fracción equivalente con denominador racional entero.

  - **Factor racionalizante**: Expresión por la cual se amplifica la fracción para eliminar el radical. Para monomios cuadráticos es $\sqrt{b}$.

  - **Forma racionalizada canónica**: Expresión $\frac{a\sqrt{b}}{b}$ simplificada al máximo.'
propiedades_relaciones: '- **Preservación del valor numérico**: Multiplicar por $\frac{\sqrt{b}}{\sqrt{b}}$ no altera el valor de la fracción original.

  - **Raíz cuadrada del inverso**: $\frac{1}{\sqrt{a}} = \frac{\sqrt{a}}{a}$ para todo $a > 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de racionalización cuadrática](/static/img/nodos/racionalizacion-con-denominador-monomio-de-raiz-cuadrada-ejemplos.svg)


    Racionalice y simplifique las fracciones $\frac{6}{\sqrt{3}}$, $\frac{10}{3\sqrt{5}}$ y $\frac{\sqrt{2}}{\sqrt{7}}$.'
  pasos:
  - 'Paso 1: Racionalizar $\frac{6}{\sqrt{3}}$: Amplificar por $\frac{\sqrt{3}}{\sqrt{3}} \implies \frac{6\sqrt{3}}{3} = 2\sqrt{3}$.'
  - 'Paso 2: Racionalizar $\frac{10}{3\sqrt{5}}$: Amplificar por $\frac{\sqrt{5}}{\sqrt{5}} \implies \frac{10\sqrt{5}}{3 \cdot 5} = \frac{10\sqrt{5}}{15} = \frac{2\sqrt{5}}{3}$.'
  - 'Paso 3: Racionalizar $\frac{\sqrt{2}}{\sqrt{7}}$: Amplificar por $\frac{\sqrt{7}}{\sqrt{7}} \implies \frac{\sqrt{2} \cdot \sqrt{7}}{7} = \frac{\sqrt{14}}{7}$.'
  - 'Conclusión: Las formas racionalizadas son $2\sqrt{3}$, $\frac{2\sqrt{5}}{3}$ y $\frac{\sqrt{14}}{7}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma racionalizada de $\frac{8}{\sqrt{2}}$?
  choices:
  - text: $4\sqrt{2}$ (porque $\frac{8\sqrt{2}}{2} = 4\sqrt{2}$)
    is_correct: true
  - text: $\frac{8}{2} = 4$
    is_correct: false
  - text: $8\sqrt{2}$
    is_correct: false
  - text: $\frac{4}{\sqrt{2}}$
    is_correct: false
  explanation: La alternativa correcta es '$4\sqrt{2}$ (porque $\frac{8\sqrt{2}}{2} = 4\sqrt{2}$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se racionalizó $\frac{10}{3\sqrt{5}}$?
  choices:
  - text: Multiplicando solo por $\frac{\sqrt{5}}{\sqrt{5}}$, dando $\frac{10\sqrt{5}}{15}$ y simplificando por $5$ a $\frac{2\sqrt{5}}{3}$
    is_correct: true
  - text: Elevando al cuadrado toda la fracción
    is_correct: false
  - text: Eliminando la raíz directamente
    is_correct: false
  - text: Multiplicando por $3\sqrt{5}$ arriba y abajo
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando solo por $\frac{\sqrt{5}}{\sqrt{5}}$, dando $\frac{10\sqrt{5}}{15}$ y simplificando por $5$ a $\frac{2\sqrt{5}}{3}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la raíz cuadrada $\sqrt{b}$ presente en el denominador.'
- 'Paso 2: Multiplicar tanto el numerador como el denominador por $\sqrt{b}$.'
- 'Paso 3: Sustituir en el denominador $(\sqrt{b})^2 = b$ y simplificar las fracciones numéricas resultantes entre el numerador y el denominador.'
errores_correccion: "- **Error 1: Multiplicar solo el denominador por la raíz ($\frac{a}{\\sqrt{b}} = \frac{a}{b}$).** **Cómo corregirlo:** La fracción debe amplificarse arriba y abajo por $\\sqrt{b}$ para mantener la igualdad numérica.\n- **Error 2: Olvidar simplificar los coeficientes tras racionalizar ($\frac{6\\sqrt{3}}{3}$ sin simplificar a $2\\sqrt{3}$).** **Cómo corregirlo:** Dividir el coeficiente del numerador por el denominador racionalizado."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la expresión racionalizada de $\frac{4}{\sqrt{2}}$?
  alternativas:
  - $2\sqrt{2}$
  - $4\sqrt{2}$
  - $2$
  respuesta: $2\sqrt{2}$
  solucion_pasos:
  - $\frac{4\sqrt{2}}{2} = 2\sqrt{2}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\frac{15}{\sqrt{5}}$ racionalizado?
  alternativas:
  - $3\sqrt{5}$
  - $5\sqrt{3}$
  - $15\sqrt{5}$
  respuesta: $3\sqrt{5}$
  solucion_pasos:
  - $\frac{15\sqrt{5}}{5} = 3\sqrt{5}$.
- titulo: ¿Es 1 / √2 equivalente a √2 / 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{1}{\sqrt{2}} \cdot \frac{\sqrt{2}}{\sqrt{2}} = \frac{\sqrt{2}}{2}$.
  alternativas:
  - texto: Sí, 1/√2 = √2/2
    es_correcta: true
    retroalimentacion: ¡Correcto! Racionalización básica de 1/√2.
  - texto: No, 1/√2 es mayor
    es_correcta: false
    retroalimentacion: Incorrecto, son exactamente iguales en valor numérico.
  - texto: No, es igual a 2/√2
    es_correcta: false
    retroalimentacion: Incorrecto, el 2 queda en el denominador.
- titulo: ¿Es 12 / (2√3) igual a 2√3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{12}{2\sqrt{3}} = \frac{6}{\sqrt{3}} = \frac{6\sqrt{3}}{3} = 2\sqrt{3}$.
  alternativas:
  - texto: Sí, 12 / (2√3) = 6/√3 = 2√3
    es_correcta: true
    retroalimentacion: ¡Correcto! Simplificación previa y racionalización.
  - texto: No, es igual a 6√3
    es_correcta: false
    retroalimentacion: Incorrecto, falta dividir por 3 en el denominador.
  - texto: No, es igual a 4√3
    es_correcta: false
    retroalimentacion: 'Incorrecto, $6 : 3 = 2$.'
errores_frecuentes:
- Multiplicar únicamente el denominador y alterar el valor numérico.
- Olvidar simplificar los factores numéricos al finalizar.
- Amplificar innecesariamente por el coeficiente exterior en denominadores $k\sqrt{b}$.
- Confundir la raíz cuadrada con el número entero en el denominador.
- No reconocer que $1/\sqrt{2} = \sqrt{2}/2$.
afirmaciones_verdaderas:
- La racionalización de monomios cuadráticos consiste en multiplicar numerador y denominador por $\sqrt{b}$.
- El proceso no modifica el valor de la fracción porque se amplifica por la unidad ($1 = \sqrt{b}/\sqrt{b}$).
- El denominador resultante es siempre un número racional entero positivo.
al_terminar_debes_poder: '![Síntesis de racionalización cuadrática](/static/img/nodos/racionalizacion-con-denominador-monomio-de-raiz-cuadrada-resumen.svg)


  QUÉ: Racionalizar fracciones cuyo denominador sea un monomio con raíz cuadrada.


  CÓMO: Amplificando la fracción por $\frac{\sqrt{b}}{\sqrt{b}}$, cancelando la raíz en el denominador $(\sqrt{b})^2 = b$ y simplificando la fracción racional resultante $\frac{a\sqrt{b}}{b}$.'
