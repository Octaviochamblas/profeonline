semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_CUADRADA
resumen_inicial: 'La racionalización de un denominador monomio de raíz cuadrada elimina el radical del denominador multiplicando el numerador y denominador por dicha raíz: $\frac{a}{\sqrt{b}} = \frac{a\sqrt{b}}{b}$.'
explicacion_simple: |
  En matemáticas se prefiere no dejar raíces irracionales en el divisor (abajo de la fracción). Para quitar una raíz cuadrada del denominador sin alterar el valor del número, amplificas la fracción multiplicando tanto arriba como abajo por esa misma raíz cuadrada. Al multiplicar $\sqrt{b} \cdot \sqrt{b}$, la raíz del denominador desaparece convirtiéndose en el número entero $b$. Por ejemplo, $\frac{6}{\sqrt{3}} = \frac{6 \cdot \sqrt{3}}{\sqrt{3} \cdot \sqrt{3}} = \frac{6\sqrt{3}}{3} = 2\sqrt{3}$.
explicacion_formal: |
  ### Definición formal
  La **racionalización de un monomio de raíz cuadrada** es el proceso algebraico que transforma una fracción de denominador irracional en una expresión equivalente con denominador entero $b \in \mathbb{Z}^+$ ($b \neq 0$):
  $$\frac{a}{\sqrt{b}} = \frac{a}{\sqrt{b}} \cdot \frac{\sqrt{b}}{\sqrt{b}} = \frac{a \cdot \sqrt{b}}{\left(\sqrt{b}\right)^2} = \frac{a\sqrt{b}}{b}$$

  ### Justificación mediante la propiedad del elemento neutro
  Amplificar la fracción por $\frac{\sqrt{b}}{\sqrt{b}} = 1$ no altera el valor del número real, pero elimina la raíz subradical utilizando la propiedad $(\sqrt{b})^2 = b$:
  $$\frac{a}{c\sqrt{b}} = \frac{a \cdot \sqrt{b}}{c\sqrt{b} \cdot \sqrt{b}} = \frac{a\sqrt{b}}{c \cdot b}$$

  ### Síntesis didáctica
  - Factor de amplificación: $\frac{\sqrt{b}}{\sqrt{b}}$.
  - Resultado en el numerador: $a\sqrt{b}$ (retiene el radical).
  - Resultado en el denominador: $b$ (entero libre de raíces).
definiciones_clave: |
  - **Racionalización**: Procedimiento que transforma denominadores irracionales en números racionales o enteros.
  - **Factor racionalizante $\sqrt{b}$**: Expresión radical por la cual se amplifica la fracción para eliminar el signo radical inferior.
  - **Fracción equivalente racionalizada**: Expresión final donde el denominador es un número entero sin raíces.
propiedades_relaciones: |
  - **Caso base de racionalización**: Es el primer tipo de racionalización y el fundamento para denominadores con raíces enésimas o binomios.
  - **Simplificación posterior**: Tras racionalizar, siempre se debe verificar si el coeficiente del numerador $a$ se puede simplificar con el entero del denominador $b$.
ejemplo_guiado:
  enunciado: 'Racionaliza el denominador de la expresión fraccionaria $F = \frac{10}{\sqrt{5}}$ y simplifica el resultado final.'
  pasos:
    - 'Paso 1: Identificamos la raíz cuadrada del denominador $\sqrt{5}$, que servirá como factor racionalizante.'
    - 'Paso 2: Amplificamos la fracción multiplicando numerador y denominador por $\sqrt{5}$: $F = \frac{10}{\sqrt{5}} \cdot \frac{\sqrt{5}}{\sqrt{5}}$.'
    - 'Paso 3: Realizamos las multiplicaciones: en el numerador obtenemos $10\sqrt{5}$ y en el denominador $\sqrt{5} \cdot \sqrt{5} = (\sqrt{5})^2 = 5$.'
    - 'Paso 4: Escribimos la fracción racionalizada $F = \frac{10\sqrt{5}}{5}$ y simplificamos los números enteros dividiendo $10 / 5 = 2 \implies F = 2\sqrt{5}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué expresión debe amplificarse una fracción de la forma $\frac{a}{\sqrt{b}}$ para eliminar la raíz cuadrada de su denominador?'
    choices:
      - {text: 'Por la misma raíz cuadrada $\frac{\sqrt{b}}{\sqrt{b}}$, pues $(\sqrt{b})^2 = b$ elimina el radical inferior', is_correct: true}
      - {text: 'Por el cuadrado del numerador $\frac{a^2}{a^2}$', is_correct: false}
      - {text: 'Por la raíz inversa $\frac{1/\sqrt{b}}{1/\sqrt{b}}$', is_correct: false}
      - {text: 'Por el número entero $b$ sin raíz $\frac{b}{b}$', is_correct: false}
    explanation: 'La alternativa correcta es ''Por la misma raíz cuadrada $\frac{\sqrt{b}}{\sqrt{b}}$, pues $(\sqrt{b})^2 = b$ elimina el radical inferior''. Multiplicar $\sqrt{b} \cdot \sqrt{b}$ transforma el denominador en el entero $b$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor simplificado al racionalizar la expresión $\frac{12}{\sqrt{3}}$?'
    choices:
      - {text: '$4\sqrt{3}$, pues $\frac{12\sqrt{3}}{3} = 4\sqrt{3}$', is_correct: true}
      - {text: '$12\sqrt{3}$, olvidando dividir por 3', is_correct: false}
      - {text: '$\sqrt{3}$, dividiendo $12 / 4$', is_correct: false}
      - {text: '$4$, borrando la raíz de 3', is_correct: false}
    explanation: 'La alternativa correcta es ''$4\sqrt{3}$, pues $\frac{12\sqrt{3}}{3} = 4\sqrt{3}$''. Amplificamos por $\sqrt{3}$ obteniendo $\frac{12\sqrt{3}}{3} = 4\sqrt{3}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la raíz cuadrada $\sqrt{b}$ en el denominador de la fracción.'
  - 'Paso 2: Multiplicar el numerador y el denominador por el factor racionalizante $\sqrt{b}$.'
  - 'Paso 3: Resolver el producto del denominador reduciendo $(\sqrt{b})^2$ al número entero $b$.'
  - 'Paso 4: Simplificar los coeficientes enteros de la fracción $\frac{a}{b}$ si admiten divisores comunes.'
errores_correccion: |
  - **Error 1:** Multiplicar sólo el denominador por la raíz y no el numerador (ej: escribir $\frac{a}{\sqrt{b}} = \frac{a}{b}$). **Cómo corregirlo:** Para mantener el valor de la fracción equivalente debes amplificar multiplicando **tanto arriba como abajo** por $\sqrt{b}$: $\frac{a\sqrt{b}}{b}$.
  - **Error 2:** Cancelar la raíz del numerador con la del denominador tras amplificar (ej: $\frac{a\sqrt{b}}{\sqrt{b}} = a$). **Cómo corregirlo:** Tras amplificar, la raíz del denominador se convierte en un entero $b$; la raíz $\sqrt{b}$ del numerador permanece en el resultado final.
ejemplos:
  - titulo: 'Racionalización monomio simple'
    enunciado: '¿La racionalización de $\frac{1}{\sqrt{2}}$ equivale a $\frac{\sqrt{2}}{2}$?'
    alternativas:
      - 'Sí, pues $\frac{1 \cdot \sqrt{2}}{\sqrt{2} \cdot \sqrt{2}} = \frac{\sqrt{2}}{2}$'
      - 'No, equivale a $2\sqrt{2}$'
      - 'No, equivale a $\frac{2}{\sqrt{2}}$'
    respuesta: 'Sí, pues $\frac{1 \cdot \sqrt{2}}{\sqrt{2} \cdot \sqrt{2}} = \frac{\sqrt{2}}{2}$'
    solucion_pasos:
      - '1. Amplificamos por $\sqrt{2}$: $\frac{1 \cdot \sqrt{2}}{\sqrt{2} \cdot \sqrt{2}}$.'
      - '2. El denominador se vuelve $2 \implies \frac{\sqrt{2}}{2}$.'
  - titulo: 'Racionalización con simplificación numérica'
    enunciado: '¿La racionalización de $\frac{15}{\sqrt{5}}$ resulta en $3\sqrt{5}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{15\sqrt{5}}{5} = 3\sqrt{5}$.'
  - titulo: 'Racionalización con coeficiente en denominador'
    enunciado: '¿Al racionalizar $\frac{6}{2\sqrt{3}}$ se obtiene $\sqrt{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{6\sqrt{3}}{2 \cdot 3} = \frac{6\sqrt{3}}{6} = \sqrt{3}$.'
  - titulo: 'Valor de la fracción equivalente'
    enunciado: '¿El valor decimal numérico de $\frac{1}{\sqrt{2}}$ es exactamente igual al de $\frac{\sqrt{2}}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Son fracciones equivalentes que representan el mismo número real $\approx 0.7071$.'
errores_frecuentes:
  - 'La racionalización de $\frac{a}{\sqrt{b}}$ se realiza eliminando el signo de la raíz directamente dando $\frac{a}{b}$.'
  - 'Amplificar únicamente el denominador por la raíz cuadrada dejando el numerador inalterado.'
  - 'Cancelar el número entero del numerador con el número que está dentro del radical.'
  - 'Al multiplicar $\sqrt{b} \cdot \sqrt{b}$ en el denominador, se obtiene $b^2$ dentro de una raíz cuadrada.'
  - 'La racionalización modifica el valor numérico absoluto de la fracción original.'
afirmaciones_verdaderas:
  - 'La racionalización de un monomio de raíz cuadrada consiste en amplificar la fracción por $\frac{\sqrt{b}}{\sqrt{b}}$ para transferir el radical al numerador y dejar un entero en el denominador.'
  - 'Amplificar una fracción por $\frac{\sqrt{b}}{\sqrt{b}}$ es equivalente a multiplicar por el elemento neutro $1$, preservando el valor exacto de la expresión original.'
al_terminar_debes_poder: 'Racionalizar fracciones con denominador monomio de raíz cuadrada amplificando por el radical para eliminar la raíz del denominador.'
