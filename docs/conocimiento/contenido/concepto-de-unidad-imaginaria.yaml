semantic_id: MAT.NUM.IMAGINARIOS.UNIDAD_IMAGINARIA
resumen_inicial: 'La unidad imaginaria $i$ es la solución fundamental definida para la ecuación $x^2 = -1$, lo que permite ampliar el sistema numérico extendiendo las raíces cuadradas de números negativos.'
explicacion_simple: |
  En el conjunto de los números reales ($\mathbb{R}$), ninguna multiplicación de un número por sí mismo puede dar como resultado un valor negativo ($3 \cdot 3 = 9$ y $(-3) \cdot (-3) = 9$). Por este motivo, ecuaciones como $x^2 = -1$ no tienen solución en los números reales. Para resolver este problema, los matemáticos crearon un nuevo número especial llamado la **unidad imaginaria**, representado con la letra $i$, tal que $i = \sqrt{-1}$. Gracias a $i$, podemos calcular raíces de números negativos como $\sqrt{-9} = \sqrt{9 \cdot (-1)} = 3i$.
explicacion_formal: |
  ### Definición formal
  La **unidad imaginaria** $i$ se define formalmente como el ente algebraico que satisface el axioma:
  $$i^2 = -1 \quad \implies \quad i = \sqrt{-1}$$

  ### Estructura de un número imaginario puro
  Un **número imaginario puro** es la expresión algebraica resultante de multiplicar un número real $b \neq 0$ por la unidad imaginaria $i$:
  $$z = b \cdot i \quad (b \in \mathbb{R} \setminus \{0\})$$

  ### Descomposición de raíces par negativas en $\mathbb{C}$
  Para cualquier número real positivo $a > 0$:
  $$\sqrt{-a} = \sqrt{a \cdot (-1)} = \sqrt{a} \cdot \sqrt{-1} = \sqrt{a} \cdot i$$

  ### Síntesis didáctica
  - Definición axiomática: $i = \sqrt{-1}$.
  - Utilidad matemática: Permite definir el cuerpo de los números complejos $\mathbb{C} = \{a + bi \mid a,b \in \mathbb{R}\}$.
definiciones_clave: |
  - **Unidad imaginaria $i$**: Símbolo matemático que representa a la raíz cuadrada principal de $-1$.
  - **Número imaginario puro**: Número de la forma $bi$ con $b \in \mathbb{R}, b \neq 0$.
  - **Extensión numérica $\mathbb{C}$**: Conjunto de los números complejos que engloba a los reales $\mathbb{R}$ y a los imaginarios $\mathbb{I}$.
propiedades_relaciones: |
  - **Conjunto disjunto en $\mathbb{R}$**: La unidad imaginaria $i$ no pertenece al conjunto de los números reales ($i \notin \mathbb{R}$).
  - **Representación gráfica**: En el plano complejo (Plano de Argand), $i$ representa una rotación de $90^\circ$ en sentido antihorario respecto al eje real positivo.
ejemplo_guiado:
  enunciado: 'Expresa la raíz cuadrada de número negativo $\sqrt{-25}$ en términos de la unidad imaginaria $i$.'
  pasos:
    - 'Paso 1: Aplicamos la propiedad de descomposición subradical separando el signo negativo como el factor $-1$: $\sqrt{-25} = \sqrt{25 \cdot (-1)}$.'
    - 'Paso 2: Distribuimos el signo radical entre ambos factores positivos e imaginarios: $\sqrt{25} \cdot \sqrt{-1}$.'
    - 'Paso 3: Calculamos la raíz real positiva $\sqrt{25} = 5$ y sustituimos el valor axiomático $\sqrt{-1} = i$.'
    - 'Paso 4: Multiplicamos los resultados obtenidos para expresar el número imaginario puro: $\sqrt{-25} = 5i$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la definición axiomática fundamental de la unidad imaginaria $i$?'
    choices:
      - {text: '$i = \sqrt{-1}$, siendo el número cuyo cuadrado es igual a $-1$ ($i^2 = -1$)', is_correct: true}
      - {text: '$i = -1$, siendo el número entero negativo $-1$', is_correct: false}
      - {text: '$i = 0$, anulación de la raíz cuadrada', is_correct: false}
      - {text: '$i = \sqrt{1} = 1$, unidad positiva real', is_correct: false}
    explanation: 'La alternativa correcta es ''$i = \sqrt{-1}$, siendo el número cuyo cuadrado es igual a $-1$ ($i^2 = -1$)''. La unidad imaginaria se define axiomáticamente como la raíz de $-1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo se expresa simplificadamente la raíz cuadrada $\sqrt{-49}$ utilizando la unidad imaginaria $i$?'
    choices:
      - {text: '$7i$, pues $\sqrt{49} \cdot \sqrt{-1} = 7i$', is_correct: true}
      - {text: '$-7$, pues elimina el signo negativo', is_correct: false}
      - {text: '$49i$, conservando el radicando original', is_correct: false}
      - {text: '$-49$, manteniendo el número real', is_correct: false}
    explanation: 'La alternativa correcta es ''$7i$, pues $\sqrt{49} \cdot \sqrt{-1} = 7i$''. Extraemos la raíz real $\sqrt{49}=7$ y multiplicamos por $i$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el signo negativo dentro del radicando de una raíz cuadrada.'
  - 'Paso 2: Descomponer el radicando negativo como el producto de un número positivo por $-1$: $\sqrt{-a} = \sqrt{a \cdot (-1)}$.'
  - 'Paso 3: Extraer la raíz cuadrada real del número positivo $a$.'
  - 'Paso 4: Reemplazar el factor $\sqrt{-1}$ por la unidad imaginaria $i$ obteniendo la forma $bi$.'
errores_correccion: |
  - **Error 1:** Afirmar que $\sqrt{-a} = -\sqrt{a}$ en los números reales (ej: $\sqrt{-9} = -3$). **Cómo corregirlo:** La raíz de un número negativo no existe en $\mathbb{R}$ y jamás es igual a un real negativo porque $(-3)^2 = +9 \neq -9$. Debe expresarse usando la unidad imaginaria: $\sqrt{-9} = 3i$.
  - **Error 2:** Multiplicar dos raíces negativas directamente violando la propiedad de raíces en $\mathbb{R}$ (ej: $\sqrt{-4} \cdot \sqrt{-9} = \sqrt{(-4)(-9)} = \sqrt{36} = 6$). **Cómo corregirlo:** **Primero debes convertir a la notación $i$**: $\sqrt{-4} \cdot \sqrt{-9} = (2i) \cdot (3i) = 6i^2 = 6(-1) = -6$.
ejemplos:
  - titulo: 'Descomposición de raíz negativa perfecta'
    enunciado: '¿El resultado de evaluar $\sqrt{-16}$ es numéricamente igual a $4i$?'
    alternativas:
      - 'Sí, pues $\sqrt{16} \cdot i = 4i$'
      - 'No, es igual a -4'
      - 'No, es igual a -16'
    respuesta: 'Sí, pues $\sqrt{16} \cdot i = 4i$'
    solucion_pasos:
      - '1. Separamos en factores: $\sqrt{16} \cdot \sqrt{-1}$.'
      - '2. Evaluamos $\sqrt{16} = 4$ y $\sqrt{-1} = i \implies 4i$.'
  - titulo: 'Descomposición de raíz inexacta'
    enunciado: '¿La raíz cuadrada $\sqrt{-5}$ equivale a $\sqrt{5}i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Extraemos $i$ de la raíz dejando el radical real $\sqrt{5}i$.'
  - titulo: 'Suma de imaginarios puros'
    enunciado: '¿La suma $\sqrt{-9} + \sqrt{-36}$ equivale a $9i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $3i + 6i = 9i$.'
  - titulo: 'Perttenencia de conjuntos'
    enunciado: '¿La unidad imaginaria $i$ pertenece al conjunto de los números reales $\mathbb{R}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Es un número no real perteneciendo a los imaginarios puros $\mathbb{I} \subset \mathbb{C}$.'
errores_frecuentes:
  - 'La raíz cuadrada de un número negativo $\sqrt{-a}$ se calcula anteponiendo un signo menos al resultado real $-\sqrt{a}$.'
  - 'La unidad imaginaria $i$ es equivalente al número real $-1$.'
  - 'Multiplicar directamente dos raíces con radicandos negativos aplicando $\sqrt{a} \cdot \sqrt{b} = \sqrt{a \cdot b}$ en $\mathbb{R}$.'
  - 'La ecuación $x^2 = -1$ tiene dos soluciones reales en el eje cartesiano $X$.'
  - 'Tratar la letra $i$ como una variable indeterminada algebraica en lugar de una constante numérica fija $i = \sqrt{-1}$.'
afirmaciones_verdaderas:
  - 'La unidad imaginaria $i$ se define como el número especial que satisface $i = \sqrt{-1}$ y $i^2 = -1$.'
  - 'Toda raíz cuadrada de un número negativo $-\text{a}$ con $a > 0$ se descompone en el conjunto de los complejos como el número imaginario puro $\sqrt{a}i$.'
al_terminar_debes_poder: 'Expresar raíces cuadradas de números negativos en términos de la unidad imaginaria $i$ aplicando la descomposición $\sqrt{-a} = \sqrt{a}i$.'
