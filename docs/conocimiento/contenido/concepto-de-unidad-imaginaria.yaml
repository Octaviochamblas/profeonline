resumen_inicial: 'La unidad imaginaria $i$ se define como el número matemático cuya
  elevación al cuadrado resulta exactamente en $-1$: $i^2 = -1$.'
explicacion_simple: Como ningún número real al multiplicarse por sí mismo da un resultado
  negativo, los matemáticos crearon un nuevo número especial llamado la unidad imaginaria
  $i$. Este número permite dar solución a raíces de números negativos que antes no
  se podían resolver.
explicacion_formal: 'La **Unidad Imaginaria $i$** es el elemento fundamental que satisface
  la ecuación algebráica fundamental:


  $$i^2 = -1 \quad \iff \quad i = \sqrt{-1}$$


  **Propiedades clave:**

  - Extensión numérica: Permite extender el cuerpo de los números reales $\mathbb{R}$
  al cuerpo complejo $\mathbb{C}$.

  - Representación de reales negativos bajo radical: $\sqrt{-a} = \sqrt{a} \cdot i$
  para $a > 0$.


  > **Complemento didáctico:** El símbolo $i$ fue introducido formalmente por Leonhard
  Euler en 1777.'
definiciones_clave: '- **Unidad imaginaria $i$**: Número definido por $i^2 = -1$ o
  $i = \sqrt{-1}$.'
propiedades_relaciones: '- **Definición axiomática**: $i^2 = -1$.'
ejemplo_guiado:
  enunciado: Exprese la raíz cuadrada negativa $\sqrt{-9}$ en términos de la unidad
    imaginaria $i$.
  pasos:
  - 'Paso 1: Descomponer el radicando negativo: $\sqrt{9 \cdot (-1)}$.'
  - 'Paso 2: Aplicar la distributividad radical: $\sqrt{9} \cdot \sqrt{-1}$.'
  - 'Paso 3: Reemplazar $\sqrt{9} = 3$ y $\sqrt{-1} = i \implies 3i$.'
  - 'Conclusión: $\sqrt{-9} = 3i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la igualdad algebraica fundamental que define a la unidad imaginaria
    i?
  choices:
  - text: i^2 = -1 (o i = sqrt{-1})
    is_correct: true
  - text: i^2 = +1
    is_correct: false
  - text: i = 0
    is_correct: false
  - text: i^2 = 2
    is_correct: false
  explanation: La alternativa correcta es 'i^2 = -1 (o i = sqrt{-1})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(-9), ¿cuál fue la expresión resultante?
  choices:
  - text: 3i
    is_correct: true
  - text: '-3'
    is_correct: false
  - text: 9i
    is_correct: false
  - text: '-9'
    is_correct: false
  explanation: La alternativa correcta es '3i'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir la unidad imaginaria $i^2
  = -1$ y expresar raíces de números negativos en términos de $i$.
semantic_id: MAT.NUM.IMAGINARIOS.UNIDAD_IMAGINARIA
procedimiento:
- 'Paso 1: Identificar las expresiones con raíces negativas o potencias de $i$.'
- 'Paso 2: Aplicar la definición fundamental $i^2 = -1$ o el ciclo periódico modular
  $4$.'
- 'Paso 3: Simplificar la expresión resultando en un número imaginario puro o real.'
errores_correccion: '- **Error 1: Aplicar la propiedad $\sqrt{ab} = \sqrt{a}\sqrt{b}$
  a dos números negativos ($(\sqrt{-2})(\sqrt{-8}) = \sqrt{16} = 4$).** **Cómo corregirlo:**
  Se DEBE pasar primero a forma imaginaria ($i\sqrt{2} \cdot i\sqrt{8} = i^2 \sqrt{16}
  = -4$).


  - **Error 2: Confundir $i^2$ con $+1$.** **Cómo corregirlo:** La definición fundamental
  exige que $i^2 = -1$ (signo negativo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.IMAGINARIOS.UNIDAD_IMAGINARIA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de los números imaginarios.
- titulo: Ejemplo 2
  enunciado: Verificación de la unidad imaginaria.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal con i^2 = -1.
- titulo: ¿Es i^4 igual al número entero 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $i^4 = (i^2)^2 = (-1)^2 = 1$.
- titulo: ¿Permite la unidad imaginaria resolver ecuaciones como x^2 + 1 = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2 = -1 \implies x = \pm i$.
errores_frecuentes:
- Afirmar que la elevación de la unidad imaginaria al cuadrado $i^2$ resulta en el
  entero positivo $+1$.
- Multiplicar dos raíces de números negativos aplicando directamente el producto radical
  sin extraer la unidad imaginaria $i$.
- Intentar las potencias de la unidad imaginaria como una secuencia lineal sin periodicidad
  de 4 pasos.
- La expresión $\sqrt{-16}$ equivale numéricamente al entero real $-4$.
- Sumar las potencias de $i$ de exponentes consecutivos sin simplificar sus residuos
  modulares.
afirmaciones_verdaderas:
- La unidad imaginaria $i$ se define mediante la igualdad fundamental $i^2 = -1$ o
  $i = \sqrt{-1}$.
- 'Las potencias enteras de $i$ se repiten en un ciclo periódico de cuatro valores:
  $i, -1, -i, 1$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
