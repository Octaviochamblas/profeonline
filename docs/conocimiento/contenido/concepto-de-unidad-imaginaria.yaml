semantic_id: MAT.NUM.IMAGINARIOS.UNIDAD_IMAGINARIA
resumen_inicial: La unidad imaginaria, denotada por $i$, es el objeto matemático definido
  por la propiedad fundamental $i^2 = -1$ o $i = \sqrt{-1}$.
explicacion_simple: 'En los números reales no existe ninguna raíz cuadrada de números
  negativos (como $\sqrt{-1}$). Para resolver este problema, la matemática inventó
  una constante llamada la **unidad imaginaria** $i$:

  $$i = \sqrt{-1} \implies i^2 = -1$$

  Gracias a $i$, ahora podemos expresar raíces de cualquier número negativo: $\sqrt{-9}
  = \sqrt{9} \cdot \sqrt{-1} = 3i$.'
explicacion_formal: Se define la unidad imaginaria $i \in \mathbb{C}$ como una solución
  de la ecuación $x^2 + 1 = 0$, de modo que $i^2 = -1$. Permite extender la recta
  real al plano complejo.
definiciones_clave: '- **Unidad imaginaria ($i$)**: Constante fundamental que satisface
  $i^2 = -1$.'
propiedades_relaciones: '- **Raíces de negativos**: $\sqrt{-k} = \sqrt{k} \cdot i$
  para todo $k > 0$.'
ejemplo_guiado:
  enunciado: Expresa $\sqrt{-16}$ en términos de la unidad imaginaria $i$.
  pasos:
  - 'Descomponer el radicando: $\sqrt{-16} = \sqrt{16 \cdot (-1)}$.'
  - 'Separar radicales: $\sqrt{16} \cdot \sqrt{-1}$.'
  - Calcular la raíz real $\sqrt{16} = 4$ y reemplazar $\sqrt{-1} = i$.
  - 'Obtener como resultado final: $4i$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor por definición de $i^2$?
  choices:
  - text: '-1'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: i
    is_correct: false
  explanation: 'La correcta es: -1. Por definición de la unidad imaginaria $i^2 =
    -1$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Expresa $\sqrt{-25}$ en términos de $i$.
  choices:
  - text: 5i
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: -5i
    is_correct: false
  - text: 25i
    is_correct: false
  explanation: 'La correcta es: 5i. $\sqrt{-25} = \sqrt{25} \cdot \sqrt{-1} = 5i$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar una raíz cuadrada de un número negativo $\sqrt{-k}$.'
- 'Paso 2: Separar en $\sqrt{k} \cdot \sqrt{-1}$.'
- 'Paso 3: Reemplazar $\sqrt{-1}$ por $i$ y calcular la raíz positiva de $k$.'
errores_correccion: No confundas $i$ con $-1$. Recuerda que $i$ es $\sqrt{-1}$ y su
  cuadrado $i^2$ es $-1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Expresa $\sqrt{-4}$ con $i$.
  alternativas:
  - 2i
  - '-2'
  - 4i
  respuesta: 2i
  solucion_pasos:
  - $\sqrt{4} \cdot i = 2i$.
errores_frecuentes:
- Creer que $i = -1$ en lugar de $i = \sqrt{-1}$.
afirmaciones_verdaderas:
- $i^2 = -1$ por definición.
al_terminar_debes_poder: Representar raíces de números negativos en términos de la
  unidad imaginaria $i$.
fuente: Texto escolar MINEDUC.
estado: publicado
