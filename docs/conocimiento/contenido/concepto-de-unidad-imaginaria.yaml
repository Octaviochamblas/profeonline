semantic_id: MAT.NUM.IMAGINARIOS.UNIDAD_IMAGINARIA
resumen_inicial: La unidad imaginaria $i$ es un ente matemático definido formalmente por la propiedad $i^2 = -1$ (o $i = \sqrt{-1}$), lo que permite extender el cuerpo de los números reales $\mathbb{R}$ al cuerpo de los números complejos $\mathbb{C}$.
explicacion_simple: '![Concepto de unidad imaginaria](/static/img/nodos/concepto-de-unidad-imaginaria-intro.svg)


  En los números reales, no existe ningún número que elevado al cuadrado dé un valor negativo (porque todo número real al cuadrado es $\ge 0$).

  - Para resolver ecuaciones como $x^2 + 1 = 0$ ($x^2 = -1$), los matemáticos definieron la **unidad imaginaria $i$**, donde $i^2 = -1$.

  - Un **número imaginario puro** es cualquier producto de un número real $b$ por la unidad imaginaria: $z = b \cdot i$ (por ejemplo: $3i$, $-5i$, $\frac{1}{2}i$).

  - La combinación de una parte real con una parte imaginaria da origen a los números complejos $\mathbb{C}$.'
explicacion_formal: 'Se define la **unidad imaginaria**, denotada por el símbolo $i$, como el elemento generador de la extensión algebraica del cuerpo real $\mathbb{R}$, satisfaciendo el axioma:


  $$i^2 = -1 \quad (\text{o equivalentemente } i = \sqrt{-1})$$


  **Conjunto de los Números Imaginarios Puros ($\mathbb{I}$):**

  $$\mathbb{I} = \{z = b \cdot i \mid b \in \mathbb{R}, b \neq 0\}$$


  **Estructura del Cuerpo Complejo ($\mathbb{C}$):**

  Todo número complejo $z \in \mathbb{C}$ se expresa de manera única en forma binómica como $z = a + bi$, con $a = \operatorname{Re}(z) \in \mathbb{R}$ y $b = \operatorname{Im}(z) \in \mathbb{R}$.'
definiciones_clave: '- **Unidad imaginaria ($i$)**: Símbolo fundamental que satisface $i^2 = -1$.

  - **Número imaginario puro ($bi$)**: Número complejo cuya parte real es nula ($a = 0, b \neq 0$).

  - **Cuerpo complejo ($\mathbb{C}$)**: Extensión algebraica $\mathbb{R}[i] / \langle x^2 + 1 \rangle$.'
propiedades_relaciones: '- **Cierre algebraico**: Permite que todo polinomio de grado $n$ tenga exactamente $n$ raíces (Teorema Fundamental del Álgebra).

  - **Inexistencia de orden**: En $\mathbb{C}$ y en los números imaginarios no existe una relación de orden compatible ($<$ o $>$ no aplican a $i$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de unidad imaginaria](/static/img/nodos/concepto-de-unidad-imaginaria-ejemplos.svg)


    Resuelva la ecuación $x^2 + 9 = 0$ en el conjunto de los números complejos y clasifique el coeficiente imaginario de $-7i$.'
  pasos:
  - 'Paso 1: Para $x^2 + 9 = 0$: Despejar $x^2 = -9$.'
  - 'Paso 2: Aplicar raíz cuadrada: $x = \pm \sqrt{-9} = \pm \sqrt{9} \cdot \sqrt{-1} = \pm 3i$.'
  - 'Paso 3: Para $-7i$: Comparar con la forma $z = bi$, identificando $b = -7 \in \mathbb{R}$.'
  - 'Conclusión: Las soluciones son $x = 3i$ y $x = -3i$, y $-7i$ es un imaginario puro con coeficiente $-7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la propiedad que define formalmente a la unidad imaginaria $i$?
  choices:
  - text: $i^2 = -1$ (su cuadrado es igual a menos uno)
    is_correct: true
  - text: $i^2 = 1$
    is_correct: false
  - text: $i = 0$
    is_correct: false
  - text: $i^2 = -i$
    is_correct: false
  explanation: La alternativa correcta es '$i^2 = -1$ (su cuadrado es igual a menos uno)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuáles son las dos soluciones de $x^2 + 9 = 0$?
  choices:
  - text: $x = 3i$ y $x = -3i$
    is_correct: true
  - text: $x = 3$ y $x = -3$
    is_correct: false
  - text: $x = 9i$ y $x = -9i$
    is_correct: false
  - text: $x = \sqrt{3}i$ y $x = -\sqrt{3}i$
    is_correct: false
  explanation: La alternativa correcta es '$x = 3i$ y $x = -3i$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar expresiones con radicales negativos o ecuaciones del tipo $x^2 = -k$ con $k > 0$.'
- 'Paso 2: Descomponer el factor negativo extrayendo la unidad imaginaria: $\sqrt{-k} = \sqrt{k} \cdot i$.'
- 'Paso 3: Expresar el resultado final en la forma imaginaria pura $bi$ con $b \in \mathbb{R}$.'
errores_correccion: '- **Error 1: Tratar a ''i'' como una variable desconocida (como ''x'').** **Cómo corregirlo:** La letra $i$ representa una **constante matemática fija** que cumple $i^2 = -1$.

  - **Error 2: Intentar ordenar números imaginarios ($2i < 3i$).** **Cómo corregirlo:** Los números imaginarios y complejos **no tienen orden** en la recta numérica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la solución de la ecuación $x^2 + 16 = 0$ en $\mathbb{C}$?
  alternativas:
  - $x = \pm 4i$
  - $x = \pm 4$
  - $x = \pm 16i$
  respuesta: $x = \pm 4i$
  solucion_pasos:
  - $x^2 = -16 \implies x = \pm \sqrt{16}i = \pm 4i$.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de número es $z = 0 + 5i$?
  alternativas:
  - Un número imaginario puro
  - Un número real positivo
  - Un número racional
  respuesta: Un número imaginario puro
  solucion_pasos:
  - Tiene parte real nula ($a = 0$) y parte imaginaria no nula ($b = 5$).
- titulo: ¿Es i un número real?
  respuesta: 'No'
  solucion_pasos:
  - No, $i \notin \mathbb{R}$; pertenece al conjunto de los números complejos $\mathbb{C}$.
  alternativas:
  - texto: No, pertenece a los números complejos
    es_correcta: true
    retroalimentacion: ¡Correcto! $i$ no tiene posición en la recta real.
  - texto: Sí, es un número real negativo
    es_correcta: false
    retroalimentacion: Incorrecto, ningún real al cuadrado da -1.
  - texto: Sí, es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los irracionales forman parte de los reales.
- titulo: ¿Son las soluciones de x² + 25 = 0 los números ±5i?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $(5i)^2 = 25i^2 = -25$ y $(-5i)^2 = 25i^2 = -25$.
  alternativas:
  - texto: Sí, x = ±5i
    es_correcta: true
    retroalimentacion: ¡Correcto! Soluciones imaginarias conjugadas.
  - texto: No, es x = ±5
    es_correcta: false
    retroalimentacion: Incorrecto, $5^2 = 25$, no $-25$.
  - texto: No, no tiene solución en ningún conjunto
    es_correcta: false
    retroalimentacion: Incorrecto, sí tiene solución en $\mathbb{C}$.
errores_frecuentes:
- Creer que las ecuaciones con raíces negativas no tienen solución en ningún conjunto.
- Asignar signo o comparación de orden ($<, >$) a números imaginarios.
- Olvidar escribir la letra $i$ al extraer raíces cuadradas negativas.
- Confundir la unidad imaginaria $i$ con el número 1.
afirmaciones_verdaderas:
- La unidad imaginaria $i$ se define mediante la propiedad axiomática $i^2 = -1$.
- Un número imaginario puro tiene la forma $bi$ con $b \in \mathbb{R}$ y $b \neq 0$.
- La introducción de $i$ permite resolver cualquier ecuación cuadrática con discriminante negativo.
al_terminar_debes_poder: '![Síntesis de concepto de unidad imaginaria](/static/img/nodos/concepto-de-unidad-imaginaria-resumen.svg)


  QUÉ: Comprender la definición y el rol fundamental de la unidad imaginaria $i$ en los números complejos.


  CÓMO: Aplicando la relación $i^2 = -1$ y expresando raíces cuadradas de números negativos en la forma imaginaria pura $bi$ con $b \in \mathbb{R}$.'
fuente: Texto escolar MINEDUC — Matemática 3° Medio / Álgebra Superior.
