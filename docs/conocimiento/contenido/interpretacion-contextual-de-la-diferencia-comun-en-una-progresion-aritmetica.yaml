procedimiento:
- 'Paso 1: Localiza el número que está multiplicando a la variable del tiempo o la
  posición (el que sería ''d'').'
- 'Paso 2: Observa su signo. (+) es aumento, (-) es disminución.'
- 'Paso 3: Acompáñalo de las unidades del problema. (Ej: ''d=3'' significa ''crece
  3 metros por cada día'').'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en interpretación contextual de la diferencia común en una progresión aritmética.
ejemplos:
- titulo: Traduce al mundo real
  enunciado: La temperatura de una máquina al apagarse se modela con T_n = 200 - 15n
    (en grados Celsius, cada minuto n). ¿Qué significa el '-15'?
  solucion_pasos:
  - El -15 ocupa el lugar de 'd' en la progresión aritmética.
  - Como es negativo, la temperatura está bajando.
  - 'Significa: ''La máquina se enfría a una tasa constante de 15 grados por cada
    minuto que pasa''.'
errores_frecuentes:
- 'Confundir el significado de ''d'' con el del valor inicial ''a_1'' (ej: decir que
  -15 es la temperatura inicial).'
- Ignorar el signo negativo al dar la respuesta verbal, olvidando especificar que
  es una 'caída' o 'pérdida'.
afirmaciones_verdaderas:
- La formulación de interpretación contextual de la diferencia común en una progresión
  aritmética mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando interpretación contextual
