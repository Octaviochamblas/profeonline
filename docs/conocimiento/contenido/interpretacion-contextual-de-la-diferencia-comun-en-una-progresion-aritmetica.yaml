resumen_inicial: La interpretación contextual de la diferencia común $d$ identifica
  su significado físico, económico o práctico como el ritmo de aumento o decremento
  constante por cada unidad de tiempo o etapa del problema.
explicacion_simple: 'En un problema real, la diferencia $d$ representa el valor práctico
  del cambio: si ahorramos \$5.000 al mes, $d = +5.000$; si un estanque pierde 3 litros
  por hora, $d = -3$.'
explicacion_formal: 'En un contexto real, la **Diferencia Común $d$** cuantifica la
  velocidad o razón de cambio discreta por período:


  $$d = \frac{\Delta \text{Magnitud}}{\Delta \text{Período}} = a_{n+1} - a_n$$


  **Significado del signo en contexto:**

  - $d > 0$: Tasa de producción, acumulación o ahorro mensual.

  - $d < 0$: Tasa de desgaste, consumo o depreciación constante.'
definiciones_clave: '- **Interpretación de $d$ en contexto**: Razón de cambio física
  o económica por período.'
propiedades_relaciones: '- **Sentido del signo**: Representa crecimiento ($d>0$) o
  decrecimiento ($d<0$) en el dominio del problema.'
ejemplo_guiado:
  enunciado: Un estanque de agua contiene $500$ litros y pierde $15$ litros por cada
    hora transcurrida. Interprete el valor y signo de $d$.
  pasos:
  - 'Paso 1: Escribir la variación: como pierde $15$ litros por hora, la diferencia
    constante es $d = -15$.'
  - 'Paso 2: Interpretación del signo negativo: indica un decrecimiento o consumo
    constante de agua.'
  - 'Paso 3: Interpretación del valor absoluto ($15$): representa la tasa horaria
    de vaciado.'
  - 'Conclusión: $d = -15$ representa la velocidad constante de consumo de $15\text{
    litros/hora}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el signo negativo en la diferencia d en un problema de
    contexto real?
  choices:
  - text: Representa una tasa de disminución, consumo o desgaste constante por cada
      unidad de tiempo
    is_correct: true
  - text: Representa un aumento exponencial
    is_correct: false
  - text: Indica que el problema está mal formulado
    is_correct: false
  - text: Representa una ganancia de dinero
    is_correct: false
  explanation: La alternativa correcta es 'Representa una tasa de disminución, consumo
    o desgaste constante por cada unidad de tiempo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para la pérdida de 15 litros por hora, ¿cuál fue
    el valor interpretado de d?
  choices:
  - text: d = -15 (tasa constante de vaciado)
    is_correct: true
  - text: d = +15
    is_correct: false
  - text: d = -500
    is_correct: false
  - text: d = 0
    is_correct: false
  explanation: La alternativa correcta es 'd = -15 (tasa constante de vaciado)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de interpretar el significado práctico
  de la diferencia común $d$ en problemas reales según su magnitud y signo.
semantic_id: MAT.NUM.PROG_ARITMETICA.INTERPRETACION_DIFERENCIA_CONTEXTO
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.INTERPRETACION_DIFERENCIA_CONTEXTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
