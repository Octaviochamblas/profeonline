semantic_id: MAT.NUM.PROG_ARITMETICA.INTERPRETACION_DIFERENCIA_CONTEXTO
resumen_inicial: 'La interpretación contextual de la diferencia común asigna un significado físico, económico o práctico al parámetro $d = a_{n+1} - a_n$, representando la tasa marginal constante de variación por unidad de tiempo.'
explicacion_simple: |
  En los problemas aplicados, la **diferencia común ($d$)** no es solo un número: representa una **tasa de cambio en la vida real**:
  - **$d > 0$ (Positivo)**: Significa **ganancia, crecimiento o acumulación constante** (por ejemplo, ganar $\$5.000$ por hora trabajada).
  - **$d < 0$ (Negativo)**: Significa **gasto, consumo, desgaste o depreciación constante** (por ejemplo, gastar $2$ litros de bencina por cada $10$ km).
  - **$d = 0$ (Cero)**: Significa **estabilidad o estado estacionario** (por ejemplo, pagar una cuota fija de $\$0$ de interés).
explicacion_formal: |
  ### Definición formal
  En un modelo de progresión aritmética contextualizado $y(n) = a_1 + (n - 1)d$, el parámetro de **diferencia común $d$** representa la derivada discreta de primer orden respecto al dominio temporal:
  $$d = \frac{\Delta y}{\Delta n} = \frac{a_{n+1} - a_n}{1} \quad \left[\frac{\text{Unidades de } y}{\text{Unidad de tiempo/etapa } n}\right]$$

  ### Matriz de Interpretación Contextual
  | Signo de $d$ | Significado Físico / Económico | Ejemplo Práctico |
  | :--- | :--- | :--- |
  | **$d > 0$** | Tasa constante de crecimiento, ingreso o adición | Ahorro semanal constante ($\$+/ \text{semana}$) |
  | **$d < 0$** | Tasa constante de consumo, pérdida o descuento | Vaciado de un estanque ($- \text{litros}/ \text{minuto}$) |
  | **$d = 0$** | Tasa nula de variación, valor constante | Tarifa plana sin cobro por consumo |

  ### Relación con la pendiente en economía e ingeniería
  El valor numérico de $d$ refleja la **tasa marginal constante**: cuántas unidades varía la variable dependiente $y$ al avanzar exactamente 1 período en el tiempo.

  ### Síntesis didáctica
  - $d$ es la **tasa unitaria de cambio**.
  - Signo $+ \implies$ Crecimiento; Signo $- \implies$ Decrecimiento.
definiciones_clave: |
  - **Tasa marginal constante ($d$)**: Variación que experimenta una magnitud al transcurrir una unidad de tiempo.
  - **Unidad dimensional de $d$**: Cociente entre las unidades de la variable dependiente y las del índice ($\text{unidad}(y)/\text{unidad}(n)$).
  - **Tasa de consumo ($d < 0$)**: Ritmo a la cual disminuye una reserva de recurso.
propiedades_relaciones: |
  - **Independencia del período**: La diferencia $d$ mantiene exactamente la misma magnitud marginal en el período 1 que en el período 100.
  - **Equivalencia con la pendiente lineal**: En el contexto de modelos gráficos, $d$ es la pendiente $m$ de la recta de evolución.
ejemplo_guiado:
  enunciado: 'Un tanque de agua contiene $1.200$ litros y se abre una llave de desagüe que retira $40$ litros por minuto de forma constante. Escribe el modelo de P.A., interpreta el significado contextual de $d = -40$ y calcula en cuántos minutos se vacía el tanque.'
  pasos:
    - 'Paso 1: Identificamos $a_1 = 1.200$ litros en el minuto 1 ($n=1 \implies 1.200$). La diferencia común es $d = -40$.'
    - 'Paso 2: Interpretamos $d = -40$: Significa que por cada minuto que transcurre, la reserva de agua **disminuye en $40$ litros**.'
    - 'Paso 3: Escribimos el modelo de volumen en el minuto $n$: $a_n = 1.200 + (n - 1)(-40) = 1.240 - 40n$.'
    - 'Paso 4: Para vaciar el tanque ($a_n = 0$), igualamos $1.240 - 40n = 0 \implies 40n = 1.240 \implies n = 31$. El tanque se vacía en **$31$ minutos**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un problema sobre el saldo de una cuenta bancaria modelado por una P.A., ¿qué significa contextualmente que la diferencia común sea $d = -15.000$ pesochilenos por mes?'
    choices:
      - {text: 'Significa que cada mes el saldo de la cuenta disminuye en $\$15.000$ debido a un gasto o cobro constante', is_correct: true}
      - {text: 'Significa que el saldo total final de la cuenta es de $\$15.000$', is_correct: false}
      - {text: 'Significa que la cuenta bancaria ganará un 15% de interés anual', is_correct: false}
      - {text: 'Significa que se han realizado 15 transacciones en el banco', is_correct: false}
    explanation: 'La alternativa correcta es ''Significa que cada mes el saldo de la cuenta disminuye en $\$15.000$ debido a un gasto o cobro constante''. $d < 0$ representa un ritmo constante de disminución.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un modelo de producción agrícola la diferencia común es $d = +500$ kg/ha por año, ¿cómo se interpreta esta cifra?'
    choices:
      - {text: 'Cada año el rendimiento de la hectárea aumenta en $500$ kg respecto al año anterior', is_correct: true}
      - {text: 'La producción total histórica es de 500 kg', is_correct: false}
      - {text: 'El primer año la producción fue de 500 kg', is_correct: false}
      - {text: 'La producción se multiplica por 500 cada año', is_correct: false}
    explanation: 'La alternativa correcta es ''Cada año el rendimiento de la hectárea aumenta en $500$ kg respecto al año anterior''. $d > 0$ indica tasa de crecimiento aditivo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las unidades de medida de la variable de estado ($y$) y del índice temporal ($n$).'
  - 'Paso 2: Extraer el valor numérico y el signo de la diferencia común $d$.'
  - 'Paso 3: Expresar $d$ como la tasa unitaria de cambio en lenguaje natural (ej: "aumento de $X$ unidades por período").'
  - 'Paso 4: Utilizar la interpretación de $d$ para predecir comportamientos o resolver problemas de agotamiento/saturación.'
errores_correccion: |
  - **Error 1:** Confundir el valor total acumulado con la tasa de cambio $d$. **Cómo corregirlo:** La diferencia $d$ es la **variación POR CADA PERÍODO**, no el valor total.
  - **Error 2:** Omitir el signo negativo al interpretar $d < 0$. **Cómo corregirlo:** Si $d$ es negativo, la interpretación **debe reflejar una disminución, pérdida o reducción**.
ejemplos:
  - titulo: 'Interpretación de velocidad en física'
    enunciado: 'Si una P.A. de posiciones tiene $d = +8$ m/s, ¿significa que el móvil recorre 8 metros más en cada segundo?'
    alternativas:
      - 'Sí, es la tasa constante de incremento espacial por segundo'
      - 'No, significa que la posición inicial es 8'
      - 'No, significa que tarda 8 segundos'
    respuesta: 'Sí, es la tasa constante de incremento espacial por segundo'
    solucion_pasos:
      - '1. Unidad de $d$: metros / segundo.'
      - '2. Signo $+ \implies$ Incremento de 8 m en cada segundo.'
  - titulo: 'Interpretación de consumo de combustible'
    enunciado: 'En la P.A. de combustible disponible $a_n$, si $d = -2,5$ litros/km, ¿el auto consume 2,5 litros por cada km?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El signo negativo indica consumo o reducción del estanque.'
  - titulo: 'Interpretación de cuota de crédito'
    enunciado: 'Si una deuda disminuye según una P.A. con $d = -\$50.000$/mes, ¿la cuota mensual pagada es de $\$50.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reduce la deuda en $\$50.000$ cada mes.'
  - titulo: 'Interpretación de tarifa plana'
    enunciado: 'Si $d = 0$ en el cobro de un servicio por mes, ¿significa que el cobro no cambia mes a mes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $d = 0$ representa un valor constante.'
errores_frecuentes:
  - 'La diferencia común $d$ representa el valor total acumulado $S_n$ alcanzado en el período final.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Ignorar las unidades de medida asociadas a la tasa de cambio en la redacción de la respuesta.'
  - 'Tratar la diferencia común como un porcentaje en lugar de una magnitud aditiva absoluta.'
afirmaciones_verdaderas:
  - 'En un contexto real, la diferencia común $d$ representa la tasa constante de variación de la magnitud por unidad de tiempo o etapa.'
  - 'Un valor de $d > 0$ indica crecimiento o acumulación, mientras que $d < 0$ indica consumo, desgaste o reducción.'
al_terminar_debes_poder: 'Interpretar el significado contextual y las unidades de la diferencia común $d$ en problemas del mundo real.'
