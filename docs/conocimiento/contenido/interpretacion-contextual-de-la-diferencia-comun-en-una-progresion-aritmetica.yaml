  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localiza el número que está multiplicando a la variable del tiempo o la posición
  (el que sería ''d'').'
- 'Paso 2: Observa su signo. (+) es aumento, (-) es disminución.'
- 'Paso 3: Acompáñalo de las unidades del problema. (Ej: ''d=3'' significa ''crece 3 metros
  por cada día'').'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en interpretación contextual de la diferencia común en una progresión aritmética.
ejemplos:
- titulo: Traduce al mundo real
  enunciado: La temperatura de una máquina al apagarse se modela con T_n = 200 - 15n (en grados
    Celsius, cada minuto n). ¿Qué significa el '-15'?
  solucion_pasos:
  - El -15 ocupa el lugar de 'd' en la progresión aritmética.
  - Como es negativo, la temperatura está bajando.
  - 'Significa: ''La máquina se enfría a una tasa constante de 15 grados por cada minuto que
    pasa''.'
- titulo: Ejemplo 1
  enunciado: En P_n igual a 500 menos 20n, la población de peces de un estanque en la semana
    n, ¿qué representa el 20?
  alternativas:
  - La disminución constante de 20 peces por semana
  - La cantidad inicial de peces del estanque
  - El número de semanas transcurridas
  respuesta: La disminución constante de 20 peces por semana
  solucion_pasos:
  - El 20 acompaña a n con signo negativo, por lo tanto es la diferencia d, y su signo indica
    disminución.
- titulo: Ejemplo 2
  enunciado: En C_n igual a 8.000 más 250n, el costo de un evento según n invitados, ¿qué
    representa el 8.000?
  alternativas:
  - El costo fijo independiente del número de invitados
  - El costo por cada invitado adicional
  - El número de invitados
  respuesta: El costo fijo independiente del número de invitados
  solucion_pasos:
  - El 8.000 no depende de n, por lo tanto es el valor base o costo fijo del contexto.
- titulo: ¿Un valor de d positivo siempre representa crecimiento en el contexto del problema?
  respuesta: Sí
  solucion_pasos:
  - Un signo positivo en d indica que la magnitud modelada aumenta con cada unidad de n.
- titulo: ¿Es suficiente responder solo con el número, sin mencionar las unidades del contexto?
  respuesta: 'No'
  solucion_pasos:
  - Una interpretación completa debe incluir qué representa el número y en qué unidades, por
    ejemplo pesos por mes o grados por minuto.
errores_frecuentes:
- 'Confundir el significado de ''d'' con el del valor inicial ''a_1'' (ej: decir que -15 es
  la temperatura inicial).'
- Ignorar el signo negativo al dar la respuesta verbal, olvidando especificar que es una 'caída'
  o 'pérdida'.
- Interpretar el número que acompaña a n como si fuera el valor inicial del fenómeno.
- Dar una interpretación numérica sin mencionar las unidades del contexto, como centímetros,
  pesos o litros.
- No relacionar el signo negativo de d con una disminución o pérdida en el contexto del problema.
afirmaciones_verdaderas:
- La formulación de interpretación contextual de la diferencia común en una progresión aritmética
  mantiene la regularidad de la sucesión.
- El signo de la diferencia d indica si la magnitud modelada aumenta o disminuye con el tiempo.
al_terminar_debes_poder: Resolver problemas prácticos utilizando interpretación contextual
  de la diferencia común en una progresión aritmética.
