semantic_id: MAT.NUM.PROG_ARITMETICA.INTERPRETACION_DIFERENCIA
resumen_inicial: 'La interpretación contextual de la diferencia común $d$ analiza su significado como tasa de variación marginal unitaria, identificando su signo y unidades físicas o monetarias en situaciones aplicadas.'
explicacion_simple: |
  En problemas de aplicación real, la diferencia común ($d$) nunca es solo un número: tiene **unidades y significado**:
  - Si un taxi cobra $\$300$ por cada kilómetro recorrido, la diferencia es $d = +\$300/\text{km}$ (es la tarifa por distancia).
  - Si una vela de cera pierde $1,5\text{ cm}$ de altura por cada hora encendida, la diferencia es $d = -1,5\text{ cm}/\text{hora}$ (tasa de consumo).
  - Si una máquina se deprecia $\$500.000$ al año, la diferencia es $d = -\$500.000/\text{año}$ (pérdida de valor anual).
  - El **signo** te indica si se gana ($+$) o se pierde ($-$) y las **unidades** le dan sentido físico al resultado.

  ![Interpretación contextual de la diferencia común](/static/img/nodos/interpretacion-contextual-de-la-diferencia-comun-en-una-progresion-aritmetica-intro.svg)
explicacion_formal: |
  ### Definición formal y Significado Físico-Económico
  En el contexto de las ciencias aplicadas y la economía, la **diferencia común ($d$)** representa la **tasa de cambio marginal discreta**:
  $$d = \frac{\Delta Y}{\Delta X} = \frac{Y(n+1) - Y(n)}{1} \quad [\text{Unidades de } Y / \text{Unidad de } X]$$

  ### Análisis Dimensional y Semántico
  - **Dimensión de $d$**: $[d] = \frac{[a_n]}{[n]}$, por ejemplo: $\text{pesos}/\text{mes}$, $\text{litros}/\text{km}$, $\text{metros}/\text{segundo}$.
  - **Interpretación del Signo**:
    - $d > 0$: Crecimiento, velocidad de ingreso, aceleración aditiva, recarga.
    - $d = 0$: Régimen estacionario, equilibrio estático.
    - $d < 0$: Depreciación, velocidad de vaciado, tasa de consumo, desgaste.

  ### Comparación con el Concepto de Pendiente en el Continuo
  En el cálculo continuo, la diferencia común $d$ es el análogo directo de la derivada constante de primer orden $\frac{dy}{dx}$ en funciones lineales.

  ### Síntesis didáctica
  - Tasa unitaria: $d = \Delta \text{Magnitud} / 1 \text{ período}$.
  - Sentido: Magnitud de cambio por paso + Signo de tendencia.
definiciones_clave: |
  - **Tasa de cambio marginal**: Incremento o disminución en la variable dependiente al avanzar exactamente un período completo.
  - **Análisis dimensional**: Determinación de las unidades físicas o monetarias compuestas que definen a la diferencia.
  - **Pendiente discreta**: Inclinación y sentido de la trayectoria que une los puntos sucesivos del modelo.
propiedades_relaciones: |
  - **Sensibilidad del modelo**: Una pequeña variación en la tasa $d$ genera divergencias acumuladas de orden $n \cdot \Delta d$ a largo plazo.
  - **Invarianza temporal**: La constancia de $d$ implica que el impacto marginal del paso 1 al 2 es idéntico al del paso 99 al 100.
ejemplo_guiado:
  enunciado: 'Un automóvil nuevo cuesta $\$12.000.000$ y su valor comercial se deprecia a razón de $\$800.000$ cada año. Expresa la diferencia común con su signo y unidades correspondientes, y determina el valor comercial del vehículo tras 5 años.'
  imagen: '/static/img/nodos/interpretacion-contextual-de-la-diferencia-comun-en-una-progresion-aritmetica-ejemplos.svg'
  pasos:
    - 'Paso 1: Al tratarse de una depreciación (pérdida de valor), la diferencia es negativa: $d = -\$800.000/\text{año}$.'
    - 'Paso 2: El valor inicial al cabo del año 1 es $a_1 = \$12.000.000 - \$800.000 = \$11.200.000$.'
    - 'Paso 3: Evaluamos tras 5 años ($n=5$): $a_5 = a_1 + (5 - 1) \cdot d = \$11.200.000 + 4 \cdot (-\$800.000) = \$11.200.000 - \$3.200.000$.'
    - 'Paso 4: El valor tras 5 años es **$\$8.000.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un estanque con 500 litros de agua que se vacía a razón de 15 litros por minuto, ¿cuál es la diferencia común $d$ de la progresión que modela el volumen restante?'
    choices:
      - {text: '$d = -15\text{ litros/minuto}$, con signo negativo por tratarse de un vaciado', is_correct: true}
      - {text: '$d = +15\text{ litros/minuto}$', is_correct: false}
      - {text: '$d = 500\text{ litros}$', is_correct: false}
      - {text: '$d = -500/15$', is_correct: false}
    explanation: 'La alternativa correcta es ''$d = -15\text{ litros/minuto}$, con signo negativo por tratarse de un vaciado''. La pérdida de volumen por unidad de tiempo exige signo negativo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un plan telefónico el costo aumenta en $\$2.500$ por cada gigabyte adicional consumido, ¿qué representa el valor $\$2.500$?'
    choices:
      - {text: 'La diferencia común $d$, que representa el costo marginal por cada unidad de gigabyte consumida', is_correct: true}
      - {text: 'El costo fijo inicial del plan', is_correct: false}
      - {text: 'El consumo total de gigabytes', is_correct: false}
      - {text: 'El término general $a_n$', is_correct: false}
    explanation: 'La alternativa correcta es ''La diferencia común $d$, que representa el costo marginal por cada unidad de gigabyte consumida''. Es el incremento por unidad.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las magnitudes involucradas y determinar las unidades del cociente $[a_n]/[n]$.'
  - 'Paso 2: Evaluar si la magnitud aumenta (signo positivo) o disminuye (signo negativo).'
  - 'Paso 3: Formular $d$ como la tasa de variación unitaria constante.'
  - 'Paso 4: Explicar el impacto de $d$ en el contexto del problema (ganancia, costo por unidad, desgaste, consumo).'
errores_correccion: |
  - **Error 1:** Omitir las unidades de medida de la diferencia en la respuesta contextual. **Cómo corregirlo:** La diferencia común en problemas aplicados **debe incluir sus unidades compuestas** (ej: $\$ / \text{mes}$, $\text{litros}/\text{hora}$).
  - **Error 2:** Asignar signo positivo a tasas de depreciación o gasto. **Cómo corregirlo:** Las pérdidas, desgastes o gastos **se representan siempre con signo negativo** ($d < 0$).
ejemplos:
  - titulo: 'Interpretación de consumo por distancia'
    enunciado: 'Un camión consume 0,25 litros de diésel por cada kilómetro recorrido. ¿Cuál es la diferencia común $d$ del combustible restante en el tanque?'
    alternativas:
      - '$d = -0,25\text{ L/km}$'
      - '$d = +0,25\text{ L/km}$'
      - '$d = -4\text{ km/L}$'
    respuesta: '$d = -0,25\text{ L/km}$'
    solucion_pasos:
      - '1. Al disminuir el combustible, la tasa es negativa: $-0,25\text{ L/km}$.'
  - titulo: 'Interpretación de salario con bono'
    enunciado: 'Un trabajador gana un sueldo base más $\$15.000$ por cada hora extra trabajada. ¿Qué representa $\$15.000$?'
    alternativas:
      - 'La diferencia común $d = +\$15.000/\text{hora extra}$'
      - 'El sueldo base $a_1$'
      - 'El sueldo total'
    respuesta: 'La diferencia común $d = +\$15.000/\text{hora extra}$'
    solucion_pasos:
      - '1. Corresponde al incremento marginal por unidad de tiempo extra.'
  - titulo: 'Significado físico del signo'
    enunciado: '¿Una diferencia común de $d = -20\text{ metros/segundo}$ en un móvil indica que su posición o velocidad disminuye a tasa constante?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. El signo negativo denota reducción cuantitativa por unidad de tiempo.'
  - titulo: 'Invarianza de la tasa marginal'
    enunciado: '¿En una progresión aritmética el valor de la diferencia $d$ se mantiene idéntico en todos los períodos?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. La constancia de la diferencia común es la propiedad fundamental de la PA.'
errores_frecuentes:
  - 'La diferencia común en un contexto físico se expresa como un número puro sin unidades de medida.'
  - 'Las situaciones de consumo, pérdida o depreciación se expresan con diferencia común positiva.'
  - 'La diferencia común $d$ se confunde con el valor total acumulado tras $n$ períodos.'
  - 'Se asume que la tasa de cambio marginal puede variar entre un período y otro en una progresión aritmética.'
  - 'La unidad de la diferencia común se confunde con la unidad del número de período $n$.'
afirmaciones_verdaderas:
  - 'En problemas contextualizados la diferencia común $d$ representa la tasa de variación unitaria compuesta $\frac{[\text{Unidad de Magnitud}]}{[\text{Unidad de Período}]}$.'
  - 'El signo de la diferencia común describe el sentido del fenómeno: positivo para acumulación/crecimiento y negativo para consumo/depreciación.'
