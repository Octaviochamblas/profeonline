semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NULA
resumen_inicial: Una pendiente nula ($m = 0$) caracteriza a las funciones constantes, donde no hay variación vertical ($\Delta y = 0$) y la gráfica es perfectamente horizontal.
explicacion_simple: '![Una pendiente nula ($m = 0$) caracteriza a las funciones constantes, donde no hay variación vertical ($\Delta y = 0$) y la gráfica es perfectamente horizontal](/static/img/nodos/interpretacion-de-pendiente-nula-como-funcion-constante-intro.svg)



  Si una recta tiene **pendiente igual a cero** ($m = 0$):

  - Significa que **no tiene inclinación**: no sube ni baja.

  - La fórmula general $y = mx + n$ se convierte en $y = 0 \cdot x + n \implies y = n$.

  - Es una **función constante** cuya gráfica es una recta horizontal a la altura $y = n$.'
explicacion_formal: 'Una función afín $f(x) = mx + n$ se reduce a una **función constante** si y solo si su pendiente es nula ($m = 0$):

  $$m = 0 \Longleftrightarrow f(x) = 0x + n = n, \quad \forall x \in \mathbb{R}$$


  **Propiedades analíticas:**

  - **Variación nula**: $\Delta y = y_2 - y_1 = n - n = 0$ para cualquier $\Delta x \neq 0$.

  - **Ángulo de inclinación**: $\theta = 0^\circ$ (recta paralela al eje $X$).

  - **Ausencia de monotonía estricta**: No es estrictamente creciente ni estrictamente decreciente (es monótona no estricta).'
definiciones_clave: '- **Pendiente nula ($m = 0$)**: Tasa de cambio igual a cero entre cualquier par de puntos.

  - **Línea de nivel constante**: Recta que mantiene invariante su cota vertical en todo el dominio.'
propiedades_relaciones: '- **Derivada nula**: En cálculo diferencial, la derivada de toda función constante es idénticamente cero.

  - **Distinción con pendiente indefinida**: $m = 0$ es una recta horizontal (es función); pendiente indefinida es una recta vertical (no es función).'
ejemplo_guiado:
  enunciado: '![Ejemplo Una pendiente nula ($m = 0$) caracteriza a las funciones constantes, donde no hay variación vertical ($\Delta y = 0$) y la gráfica es perfectamente horizontal](/static/img/nodos/interpretacion-de-pendiente-nula-como-funcion-constante-ejemplos.svg)



    Calcula la pendiente de la recta que une los puntos $A(-4, 6)$ y $B(5, 6)$ y determina su ecuación funcional.'
  pasos:
  - 'Paso 1: Aplicar la fórmula de la pendiente: $m = \frac{6 - 6}{5 - (-4)} = \frac{0}{9} = 0$.'
  - 'Paso 2: Como $m = 0$, la recta no tiene variación vertical.'
  - 'Paso 3: Escribir la ecuación funcional: $f(x) = 0x + 6 = 6$.'
  - 'Paso 4: Concluir que se trata de una función constante de altura 6.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa algebraicamente una pendiente $m = 0$ en la ecuación $y = mx + n$?
  choices:
  - text: Una función constante y = n
    is_correct: true
  - text: Una función lineal y = x
    is_correct: false
  - text: Una recta vertical x = n
    is_correct: false
  - text: Una recta inclinada a 45 grados
    is_correct: false
  explanation: La alternativa correcta es 'Una función constante y = n'. Al ser $m = 0$, el término en $x$ se anula dejando solo la constante.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la pendiente de la recta horizontal $y = -9$?
  choices:
  - text: '0'
    is_correct: true
  - text: '-9'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: Indefinida
    is_correct: false
  explanation: La alternativa correcta es '0'. Toda recta horizontal posee pendiente nula.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la pendiente entre dos puntos y comprobar que $m = 0$.'
- 'Paso 2: Reconocer que la variación vertical $\Delta y$ es nula.'
- 'Paso 3: Sustituir $m = 0$ en la ecuación afín para obtener la forma $f(x) = n$.'
- 'Paso 4: Concluir que la gráfica es una recta horizontal sin crecimiento ni decrecimiento.'
errores_correccion: '- **Error común:** Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente no definida (división por cero, recta vertical).

  - **Cómo corregirlo:** $m = \frac{0}{k} = 0$ es perfectamente legal y describe una **recta horizontal**; $\frac{k}{0}$ es indefinida y describe una **recta vertical**.'
ejemplos:
- titulo: 'Ejemplo 1: Cálculo con puntos alineados horizontalmente'
  enunciado: ¿Cuál es la pendiente de la recta que pasa por $(1, 3)$ y $(8, 3)$?
  alternativas:
  - '0'
  - '3'
  - '7'
  - Indefinida
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $m = \frac{3 - 3}{8 - 1} = \frac{0}{7} = 0$.'
- titulo: 'Ejemplo 2: Identificación de fórmula'
  enunciado: En la función $f(x) = 15$, ¿cuánto vale la pendiente?
  alternativas:
  - '0'
  - '15'
  - '1'
  - No existe
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: La función se escribe como $f(x) = 0x + 15$, luego $m = 0$.'
- titulo: 'Ejemplo 3: Inclinación geométrica'
  enunciado: ¿Qué inclinación tiene una recta con pendiente $m = 0$ respecto a la horizontal?
  alternativas:
  - 0 grados
  - 90 grados
  - 180 grados
  - 45 grados
  respuesta: 0 grados
  solucion_pasos:
  - 'Paso 1: $\theta = \arctan(0) = 0^\circ$.'
- titulo: 'Ejemplo 4: Monotonía'
  enunciado: ¿Es una función de pendiente nula creciente o decreciente?
  alternativas:
  - Ninguna de las dos, es constante
  - Estrictamente creciente
  - Estrictamente decreciente
  - Ambas a la vez estrictamente
  respuesta: Ninguna de las dos, es constante
  solucion_pasos:
  - 'Paso 1: Al no haber cambio en las imágenes, se clasifica como constante.'
errores_frecuentes:
- Confundir pendiente nula con pendiente indefinida.
- Asignar la constante n como si fuera el valor de la pendiente.
- Clasificar una recta horizontal como estrictamente creciente.
afirmaciones_verdaderas:
- Una pendiente m = 0 define una función constante de ecuación y = n.
- Toda recta horizontal tiene pendiente cero y ángulo de inclinación de 0°.
al_terminar_debes_poder: '**QUÉ:** Identificar e interpretar la pendiente nula en funciones y rectas horizontales.


  **CÓMO:** Verificando que m = 0, constatando la variación vertical nula y relacionándola con la función constante.


  ![Resumen Una pendiente nula ($m = 0$) caracteriza a las funciones constantes, donde no hay variación vertical ($\Delta y = 0$) y la gráfica es perfectamente horizontal](/static/img/nodos/interpretacion-de-pendiente-nula-como-funcion-constante-resumen.svg)'
