semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NULA
resumen_inicial: Una pendiente nula ($m = 0$) indica que la tasa de cambio es cero
  y la función es constante (línea horizontal).
explicacion_simple: 'Cuando la pendiente de una recta es exactamente cero ($m = 0$):

  - La tasa de cambio vertical es nula (la recta ni sube ni baja).

  - La recta es completamente horizontal.

  - Corresponde a la **función constante** $f(x) = 0x + c = c$.'
explicacion_formal: 'Dada la recta de ecuación $f(x) = m x + c$ con $m = 0$:


  $$m = 0 \iff f(x) = c \quad \forall x \in \mathbb{R}$$


  **Desglose of la fórmula:**

  - $\Delta y = y_2 - y_1 = 0 \implies m = \frac{0}{\Delta x} = 0$.

  - Inclinación nula $\theta = 0^\circ$ (recta paralela al eje $X$).'
definiciones_clave: '- **Pendiente nula ($m = 0$)**: Ausencia total de variación vertical
  en el comportamiento de la recta.'
propiedades_relaciones: '- **Paralelismo con el eje $X$**: Toda recta con $m = 0$
  es paralela o coincidente con el eje de las abscisas.'
ejemplo_guiado:
  enunciado: Calcula la pendiente de la recta que pasa por los puntos $P_1(2, 5)$
    y $P_2(7, 5)$ e identifica el tipo de función.
  pasos:
  - 'Paso 1: Identificar las coordenadas: $x_1 = 2, y_1 = 5, x_2 = 7, y_2 = 5$.Paso
    2: Aplicar la fórmula: $m = \frac{5 - 5}{7 - 2} = \frac{0}{5} = 0$.Paso 3: Identificar
    la pendiente $m = 0$ como pendiente nula.Paso 4: Concluir que representa a la
    función constante $f(x) = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la fórmula de la pendiente a los puntos $(2, 5)$ y $(7, 5)$,
    ¿cuál es el resultado de $m$?
  choices:
  - text: $m = 0$ (pendiente nula)
    is_correct: true
  - text: $m = 5$
    is_correct: false
  - text: $m = 1$
    is_correct: false
  - text: La pendiente no existe (indefinida).
    is_correct: false
  explanation: La alternativa correcta es '$m = 0$ (pendiente nula)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué tipo de función representa una recta cuya pendiente es exactamente
    $m = 0$?
  choices:
  - text: Una función constante.
    is_correct: true
  - text: Una función lineal estrictamente creciente.
    is_correct: false
  - text: Una función cuadrática.
    is_correct: false
  - text: Una relación que no es función.
    is_correct: false
  explanation: La alternativa correcta es 'Una función constante.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la diferencia de ordenadas $y_2 - y_1$.'
- 'Paso 2: Si $y_2 - y_1 = 0$, la pendiente resulta $m = 0$.'
- 'Paso 3: Clasificar la recta como horizontal o función constante.'
errores_correccion: '- **Error común:** Confundir pendiente nula ($m = 0$, recta horizontal)
  con pendiente indefinida ($m = \frac{k}{0}$, recta vertical).

  - **Cómo corregirlo:** La recta horizontal tiene $m = 0$ (SÍ es función constante).
  La recta vertical tiene la división por cero (NO es función).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
