semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NULA
resumen_inicial: La pendiente nula $m = 0$ indica la ausencia total de variación vertical, caracterizando a la función constante.
explicacion_simple: |
  Una **pendiente nula** ($m = 0$) significa que la recta no sube ni baja:

  - La línea es completamente plana (horizontal).
  - Al cambiar $x$, la altura $y$ no sufre ningún cambio ($\Delta y = 0$).
  - La función es una **función constante** $f(x) = c$.
explicacion_formal: |
  Sea la recta de ecuación $y = mx + b$. Si la pendiente es nula ($m = 0$), la variación de la variable dependiente para cualquier $\Delta x \neq 0$ satisface:

  $$\Delta y = m \cdot \Delta x = 0 \cdot \Delta x = 0$$

  Lo anterior implica que $y_2 - y_1 = 0 \implies y_2 = y_1 = c$, transformando la regla en la **función constante** $f(x) = c$.

  **Propiedad geométrica:**
  - Ángulo de inclinación $\alpha = 0^\circ \iff \tan(0^\circ) = 0$.
definiciones_clave: |
  - **Pendiente nula ($m = 0$)**: Tasa de variación igual a cero que representa una recta horizontal plana.
propiedades_relaciones: |
  - **Paralelismo con eje X**: Toda recta con pendiente nula es paralela al eje de las abscisas ($X$) o coincide con él.
ejemplo_guiado:
  enunciado: "Un automóvil se desplaza a una velocidad constante de $80$ km/h. Escribe la función $V(t)$ de la velocidad en el tiempo e interpreta su pendiente."
  pasos:
    - 'Paso 1: Escribir la regla de la función: $V(t) = 80$ para todo $t \ge 0$.'
    - 'Paso 2: Expresar en forma general $y = mt + b \implies V(t) = 0t + 80$.'
    - 'Paso 3: Identificar la pendiente: $m = 0$.'
    - 'Paso 4: Concluir que la pendiente nula representa que la velocidad no cambia con el tiempo.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué representa una pendiente nula ($m = 0$) en una función de variable real?"
    choices:
      - {text: "Que la variable dependiente se mantiene constante sin variar.", is_correct: true}
      - {text: "Que la gráfica es una recta vertical indefinida.", is_correct: false}
      - {text: "Que la función crece a ritmo acelerado.", is_correct: false}
      - {text: "Que la función no tiene dominio real.", is_correct: false}
    explanation: "La alternativa correcta es 'Que la variable dependiente se mantiene constante sin variar.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el ángulo de inclinación $\\alpha$ de una recta con pendiente nula respecto al eje $X$?"
    choices:
      - {text: "$\\alpha = 0^\\circ$", is_correct: true}
      - {text: "$\\alpha = 90^\\circ$", is_correct: false}
      - {text: "$\\alpha = 45^\\circ$", is_correct: false}
      - {text: "$\\alpha = 180^\\circ$", is_correct: false}
    explanation: "La alternativa correcta es '$\\alpha = 0^\\circ$'. $m = \\tan(0^\\circ) = 0$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Verificar que la diferencia de ordenadas entre dos puntos sea cero ($\Delta y = 0$).'
  - 'Paso 2: Calcular la pendiente $m = \frac{0}{\Delta x} = 0$.'
  - 'Paso 3: Redactar la función como $f(x) = c$.'
  - 'Paso 4: Graficar la recta horizontal paralela al eje $X$ a la altura $c$.'
errores_correccion: |
  - **Error común:** Confundir pendiente nula ($m = 0$) con pendiente indefinida (división por cero).
  - **Cómo corregirlo:** La pendiente es NULA ($m = 0$) para rectas **HORIZONTALES**; es INDEFINIDA para rectas **VERTICALES**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una recta con pendiente nula $m = 0$ representa una recta vertical indefinida.'
  - 'La ecuación de una recta de pendiente nula que pasa por $(0, 4)$ es $x = 4$.'
  - 'Una pendiente $m = 0$ significa que la función crece de forma imperceptible hacia el infinito.'
  - 'Si una función tiene pendiente nula, no se puede evaluar en valores negativos del dominio.'
  - 'El ángulo de inclinación de una recta con pendiente nula es de $90^\circ$.'
afirmaciones_verdaderas:
  - 'Una pendiente nula ($m = 0$) indica que no hay variación vertical ($\Delta y = 0$), por lo que la función es constante ($f(x) = c$).'
  - 'Geométricamente, una pendiente nula corresponde a una recta totalmente horizontal, paralela al eje $X$, con un ángulo de inclinación de $0^\circ$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e interpretar la pendiente nula como la característica fundamental de la función constante.
  CÓMO: Asociar $m = 0$ a la ausencia de cambio vertical, redactar la ecuación $y = c$ y representar la recta horizontal.
