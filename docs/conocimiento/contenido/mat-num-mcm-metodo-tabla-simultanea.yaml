semantic_id: MAT.NUM.MINIMO_COMUN_MULTIPLO.METODO_TABLA_SIMULTANEA
resumen_inicial: El m.c.m. por tabla simultánea divide progresivamente los números
  por primos hasta reducir todas las columnas a 1.
explicacion_simple: El método de la tabla simultánea nos permite calcular el m.c.m.
  de varios números al mismo tiempo. Escribimos los números en fila a la izquierda,
  los vamos dividiendo entre números primos a la derecha (si un número no es divisible,
  se baja igual), y al llegar a puros unos abajo, multiplicamos todos los primos de
  la derecha.
explicacion_formal: 'En la **Tabla de Factorización Simultánea**, para un vector de
  números $(a_1, a_2, \dots, a_k)$, se aplican divisiones por primos $p_j$ produciendo
  la matriz de cocientes hasta que:


  $$\text{Fila final: } (1, 1, \dots, 1) \implies \operatorname{mcm}(a_1, \dots, a_k)
  = \prod_{j=1}^m p_j$$


  **Desglose de la fórmula:**

  - $p_j$: Primo que divide a al menos una de las entradas de la fila actual.

  - Regla de descenso: Si $p_j \nmid a_i$, el valor $a_i$ se copia intacto a la siguiente
  fila.

  - $\prod p_j$: El m.c.m. es la multiplicación de todos los primos anotados en la
  columna derecha.


  > **Complemento didáctico:** No se exige que el primo divida a todos los números
  a la vez; basta que divida a al menos uno de ellos.'
definiciones_clave: '- **Tabla simultánea de m.c.m.**: Algoritmo que reduce todos
  los números a 1 en paralelo dividiendo por primos.'
ejemplo_guiado:
  enunciado: Calcule el $\operatorname{mcm}(12, 15)$ mediante la tabla de descomposición
    simultánea.
  pasos:
  - 'Paso 1: Fila 1 (12, 15). Dividir por 2: 12 da 6, 15 baja igual $\implies$ Fila
    2 (6, 15). Primo: 2.'
  - 'Paso 2: Fila 2 (6, 15). Dividir por 2: 6 da 3, 15 baja igual $\implies$ Fila
    3 (3, 15). Primo: 2.'
  - 'Paso 3: Fila 3 (3, 15). Dividir por 3: 3 da 1, 15 da 5 $\implies$ Fila 4 (1,
    5). Primo: 3.'
  - 'Paso 4: Fila 4 (1, 5). Dividir por 5: 1 baja igual, 5 da 1 $\implies$ Fila 5
    (1, 1). Primo: 5.'
  - 'Paso 5: Multiplicar los primos anotados a la derecha: $2 \cdot 2 \cdot 3 \cdot
    5 = 60$.'
  - 'Conclusión: $\operatorname{mcm}(12, 15) = 60$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la tabla simultánea para el m.c.m., ¿qué se hace con un número que
    no es divisible exactamente por el primo elegido?
  choices:
  - text: Se baja igual a la siguiente fila sin modificarlo
    is_correct: true
  - text: Se convierte en cero
    is_correct: false
  - text: Se elimina de la tabla
    is_correct: false
  - text: Se divide por decimales
    is_correct: false
  explanation: La alternativa correcta es 'Se baja igual a la siguiente fila sin modificarlo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 12 y 15, ¿cuál fue el resultado final del m.c.m.?
  choices:
  - text: '60'
    is_correct: true
  - text: '180'
    is_correct: false
  - text: '30'
    is_correct: false
  - text: '15'
    is_correct: false
  explanation: La alternativa correcta es '60'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar los números en fila separados por comas.'
- 'Paso 2: Dividir por un primo que divida a al menos uno de los números; bajar igual
  a los que no sean divisibles.'
- 'Paso 3: Continuar dividiendo hasta que todas las columnas contengan el valor 1.'
- 'Paso 4: Multiplicar todos los primos de la columna derecha para obtener el m.c.m.'
errores_correccion: '- **Error 1: Exigir que el primo divida a TODOS los números para
  poder usarlo.** **Cómo corregirlo:** En el m.c.m. basta con que el primo divida
  a AL MENOS UNO de los números.


  - **Error 2: Olvidar bajar un número que no se dividió.** **Cómo corregirlo:** Si
  un número no es divisible, se escribe exactamente igual en la fila inferior.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el m.c.m.(8, 10) usando la tabla simultánea.
  alternativas:
  - '40'
  - '80'
  - '18'
  respuesta: '40'
  solucion_pasos:
  - 'Primos usados: 2, 2, 2, 5. Producto: $2 \cdot 2 \cdot 2 \cdot 5 = 40$.'
- titulo: Ejemplo 2
  enunciado: ¿Qué se obtiene al multiplicar la columna derecha de la tabla simultánea?
  alternativas:
  - El mínimo común múltiplo (m.c.m.)
  - El máximo común divisor
  - La suma de los números
  respuesta: El mínimo común múltiplo (m.c.m.)
  solucion_pasos:
  - El producto de todos los primos utilizados en la tabla da el m.c.m.
- titulo: ¿Finaliza la tabla simultánea cuando todos los números de la izquierda se
    reducen a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, la fila final debe ser $(1, 1, \dots, 1)$.
- titulo: ¿Se pueden usar números compuestos en la columna derecha de la tabla simultánea?
  respuesta: 'No'
  solucion_pasos:
  - No, se deben utilizar únicamente números primos.
errores_frecuentes:
- En la tabla simultánea del m.c.m. el primo elegido debe dividir obligatoriamente
  a todos los números.
- Si un número no es divisible por el primo actual debe reemplazarse por el número
  cero.
- La tabla simultánea finaliza cuando el producto de los números de la izquierda es
  igual a 100.
- Colocar números compuestos en la columna de división de la tabla mantiene correcto
  el m.c.m.
- El m.c.m. se obtiene sumando los primos anotados en la columna derecha de la tabla.
afirmaciones_verdaderas:
- El método de la tabla simultánea requiere reducir todas las columnas al valor 1
  dividiendo por primos.
- Multiplicar todos los factores primos utilizados en la columna derecha calcula el
  m.c.m.
al_terminar_debes_poder: Al terminar serás capaz de calcular el m.c.m. mediante la
  tabla de descomposición simultánea por primos, reduciendo todas las columnas a 1
  y multiplicando los divisores.
