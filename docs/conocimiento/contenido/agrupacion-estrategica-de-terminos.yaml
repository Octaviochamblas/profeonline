semantic_id: MAT.ALG.FACTOR_AGRUPACION.AGRUPACION_TERMINOS
resumen_inicial: 'La agrupación estratégica de términos consiste en organizar los sumandos de un polinomio entre paréntesis respetando rigurosamente los signos algebraicos intermedios para preparar la extracción parcial.'
explicacion_simple: |
  Para agrupar los términos de un polinomio de 4 términos (ej: $2x^2 - 4x + 3x - 6$):
  - **CUIDADO CRÍTICO CON LOS SIGNOS AL AGRUPAR**:
    1. **Agrupación con Signo Positivo $(+)$**:
       - Si juntas $+ (3x - 6)$, los signos de los términos dentro del paréntesis se mantienen **exactamente iguales**.
    2. **Agrupación con Signo Negativo $(-)$**:
       - Si pones un signo menos fuera del paréntesis, ¡los signos de adentro **DEBEN CAMBIAR**:
       - Ejemplo: Para agrupar $-4x + 6$ con un signo menos afuera $\implies \mathbf{-(4x - 6)}$.
       - ¡Recuerda que al distribuir el menos $- \cdot 4x = -4x$ y $- \cdot (-6) = +6$, recuperas la expresión original!
explicacion_formal: |
  ### Definición formal
  Sea la sumatoria de términos $P = \sum_{i=1}^4 T_i \in \mathbb{R}[x]$. La **agrupación estratégica de términos** define la aplicación de la propiedad asociativa de la adición en $\mathbb{R}$:

  $$P = (T_1 + T_2) + (T_3 + T_4)$$

  ### Regla de Inserción de Paréntesis bajo Signo Negativo
  Cuando la agrupación involucra la colocación de un signo negativo exterior precediendo a un subgrupo $-(A + B)$:

  $$- T_3 - T_4 = - (T_3 + T_4)$$
  $$- T_3 + T_4 = - (T_3 - T_4)$$

  Esta equivalencia se demuestra rigurosamente por el axioma del elemento opuesto distributivo $(-1) \cdot (a + b) = -a - b$.

  ### Síntesis didáctica
  Agrupar no es más que colocar paréntesis asociativos cuidando que, al deshacerlos mentalmente mediante distribución de signos, se obtenga exactamente el polinomio inicial.
definiciones_clave: |
  - **Asociatividad algebraica**: Propiedad $(a+b)+c = a+(b+c)$ que permite agrupar términos en pares sin alterar el valor numérico.
  - **Inversión de signos por paréntesis negativo**: Regla por la cual anteceder un paréntesis con un signo menos exige invertir los signos de todos los términos contenidos.
  - **Control de equivalencia**: Verificación por distribución de signos para validar que la agrupación preserva la expresión original.
propiedades_relaciones: |
  - **Preservación del valor cuantitativo**: La inserción de paréntesis asociativos no modifica la evaluación del polinomio para ningún número real.
ejemplo_guiado:
  enunciado: 'Agrupa estratégicamente los términos del polinomio $ax - ay - bx + by$ formando dos pares.'
  pasos:
    - 'Paso 1: Observamos los 4 términos: $ax, -ay, -bx, +by$.'
    - 'Paso 2: Agrupamos los dos primeros términos entre paréntesis:
       $(ax - ay)$.'
    - 'Paso 3: Observamos los dos últimos términos: $-bx + by$.'
    - 'Paso 4: Colocamos un signo menos fuera del segundo paréntesis e invertimos sus signos internos:
       $- (bx - by)$ (¡porque $- \cdot bx = -bx$ y $- \cdot (-by) = +by$!).'
    - 'Paso 5: Unimos ambas agrupaciones: $(ax - ay) - (bx - by)$.'
    - 'Conclusión: La agrupación estratégica correcta es **$(ax - ay) - (bx - by)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al agrupar los términos $-3x + 6$ antecediéndolos por un signo negativo exterior $-(\dots)$, ¿cómo deben escribirse los términos dentro del paréntesis?'
    choices:
      - {text: 'Deben escribirse con los signos invertidos como $-(3x - 6)$, para que al distribuir el signo menos se recupere $-3x + 6$', is_correct: true}
      - {text: 'Deben escribirse como $-(3x + 6)$', is_correct: false}
      - {text: 'Deben escribirse como $-(-3x + 6)$', is_correct: false}
      - {text: 'No se pueden agrupar', is_correct: false}
    explanation: 'La alternativa correcta es ''Deben escribirse con los signos invertidos como $-(3x - 6)$, para que al distribuir el signo menos se recupere $-3x + 6$''. Inversión de signos por paréntesis precedido de signo menos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la agrupación estratégica correcta para los términos $x^2 - xy - xz + yz$ separándolos en dos parejas con un signo menos al centro?'
    choices:
      - {text: 'La agrupación es $(x^2 - xy) - (xz - yz)$', is_correct: true}
      - {text: 'La agrupación es $(x^2 - xy) - (xz + yz)$', is_correct: false}
      - {text: 'La agrupación es $(x^2 + xy) - (xz - yz)$', is_correct: false}
      - {text: 'La agrupación es $(x^2 - xy) + (xz - yz)$', is_correct: false}
    explanation: 'La alternativa correcta es ''La agrupación es $(x^2 - xy) - (xz - yz)$''. Distribución del signo menos: $-(xz - yz) = -xz + yz$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Seleccionar los términos que compondrán el primer paréntesis.'
  - 'Paso 2: Escribir el primer paréntesis conservando los signos de sus términos.'
  - 'Paso 3: Determinar el signo del centro ($+$ o $-$) que conectará con el segundo paréntesis.'
  - 'Paso 4: Si el signo central es $-$, cambiar el signo de cada término al introducirlo en el segundo paréntesis.'
errores_correccion: |
  - **Error 1:** Manterner los signos internos iguales al anteceder un paréntesis por un signo menos (escribir $-3x + 6 = -(3x + 6)$). **Cómo corregirlo:** El signo menos exterior **EXIGE INVERTIR TODOS LOS SIGNOS DENTRO DEL PARÉNTESIS ($-3x + 6 = -(3x - 6)$)**.
  - **Error 2:** Alterar el orden o los signos de los términos del primer paréntesis. **Cómo corregirlo:** El primer paréntesis debe **CONSERVAR FIELMENTE SUS SIGNOS ORIGINALES**.
ejemplos:
  - titulo: 'Agrupación con positivo'
    enunciado: 'Para $2x + 4y$, ¿es la agrupación $+ (2x + 4y)$ idéntica en signos a los términos originales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el signo positivo no altera los signos.'
  - titulo: 'Agrupación con negativo'
    enunciado: 'Para $-a + b$, ¿equivale a $- (a - b)$ cambiando el signo de ambos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-a+b = -(a-b)$.'
  - titulo: 'Comprobación por distribución'
    enunciado: '¿Recupera $- (x - 2y)$ los términos $-x + 2y$ al multiplicar por $-1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-1 \cdot x = -x$ y $-1 \cdot (-2y) = +2y$.'
  - titulo: 'Agrupación de 4 términos'
    enunciado: 'En $m^2 - mn - mp + np$, ¿es $(m^2 - mn) - (mp - np)$ una agrupación equivalente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-(mp - np) = -mp + np$.'
errores_frecuentes:
  - 'El cambio de los signos internos de los términos al colocarlos dentro de un paréntesis precedido por un signo menos no se realiza.'
  - 'Alterar los signos de los términos del primer grupo sin justificación matemática.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La escritura del signo central (+ o -) entre las dos parejas de paréntesis no se realiza.'
  - 'Mezclar términos de distintos grupos rompiendo la estructura de parejas.'
afirmaciones_verdaderas:
  - 'Al agrupar términos precedidos por un signo negativo, se deben invertir los signos de todos los elementos encerrados.'
  - 'La agrupación de términos utiliza la propiedad asociativa de la adición para organizar la expresión en subgrupos.'
al_terminar_debes_poder: 'Agrupar estratégicamente términos algebraicos entre paréntesis aplicando correctamente la inversión de signos bajo el signo menos.'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
