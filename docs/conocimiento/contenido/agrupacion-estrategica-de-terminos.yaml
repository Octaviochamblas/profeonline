resumen_inicial: La agrupación estratégica de términos es el proceso de reordenar
  y asociar los sumandos de un polinomio entre paréntesis para facilitar la aparición
  del factor común deseado.
explicacion_simple: 'A veces los términos no vienen ordenados de la mejor manera.
  Si tienes $ax + by + ay + bx$, reordenas junta las parejas que comparten letras:
  $(ax + ay) + (bx + by)$. Este cambio de orden mediante las propiedades conmutativa
  y asociativa es la agrupación estratégica.'
explicacion_formal: 'Dado un polinomio $P = \sum_{i=1}^{2m} t_i$, la **Agrupación
  Estratégica de Términos** utiliza las propiedades conmutativa ($a+b=b+a$) y asociativa
  ($a+(b+c)=(a+b)+c$) de la adición en $\mathbb{R}$ para redefinir el polinomio como
  la suma de subconjuntos de términos $G_j$:


  $$P = \sum_{j=1}^k G_j = (t_{\sigma(1)} + \dots + t_{\sigma(m)}) + (t_{\sigma(m+1)}
  + \dots + t_{\sigma(2m)})$$


  **Desglose simbólico:**

  - $\sigma$: Permutación del orden inicial de los índices de los términos.

  - $(ax + ay)$: Primer paréntesis asociado con factor común $a$.

  - $(bx + by)$: Segundo paréntesis asociado con factor común $b$.


  > **Complemento didáctico:** El signo que antecede a cada paréntesis agrupa los
  términos preservando rigurosamente las leyes de los signos.'
definiciones_clave: '- **Agrupación asociativa**: Uso del paréntesis para delimitar
  sumandos sin alterar el valor de la expresión.

  - **Permutación de términos**: Reordenamiento conmutativo de los sumandos antes
  de asociar.'
propiedades_relaciones: '- **Preservación del signo**: Si se antepone un signo negativo
  a un paréntesis de agrupación, se DEBEN invertir todos los signos de su interior.'
ejemplo_guiado:
  enunciado: Reordene y agrupe estratégicamente el polinomio $mx - ny + my - nx$.
  pasos:
  - 'Paso 1: Observar el polinomio desordenado: $mx - ny + my - nx$.'
  - 'Paso 2: Reordenar los términos juntando los que tienen $m$ y los que tienen $n$:
    $mx + my - nx - ny$.'
  - 'Paso 3: Asociar los primeros dos términos entre paréntesis: $(mx + my)$.'
  - 'Paso 4: Asociar los últimos dos términos anteponiendo el signo menos: $-(nx +
    ny)$.'
  - 'Paso 5: Comprobar los signos interiores: $-nx - ny$ coincide con la expresión
    descompuesta.'
  - 'Conclusión: La agrupación estratégica es $(mx + my) - (nx + ny)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al anteponer un signo negativo a un paréntesis de agrupación, ¿qué cambio
    debe aplicarse a los términos interiores?
  choices:
  - text: Se deben cambiar los signos de todos los términos dentro del paréntesis
    is_correct: true
  - text: Se deben mantener exactamente los mismos signos
    is_correct: false
  - text: Se cambia únicamente el signo del primer término
    is_correct: false
  - text: Se eleva cada término al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Se deben cambiar los signos de todos los
    términos dentro del paréntesis'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la agrupación estratégica correcta con signo negativo exterior
    para $-nx - ny$?
  choices:
  - text: $-(nx + ny)$
    is_correct: true
  - text: $-(nx - ny)$
    is_correct: false
  - text: $+(nx + ny)$
    is_correct: false
  - text: $-nx(+ny)$
    is_correct: false
  explanation: La alternativa correcta es '$-(nx + ny)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar o reordenar conmutativamente los términos según las variables o
  coeficientes compartidos.'
- 'Paso 2: Asociar los términos en pares o grupos dentro de paréntesis.'
- 'Paso 3: Ajustar cuidadosamente los signos internos si se extrae un signo menos
  al inicio de un paréntesis.'
errores_correccion: '- **Error 1: Anteponer un signo negativo al paréntesis sin cambiar
  el signo del segundo término dentro de él.** **Cómo corregirlo:** La propiedad distributiva
  del signo negativo exige que $-(A + B) = -A - B$; si el término original era $-ny$,
  dentro de $-(nx + ...)$ DEBE ser $+ny$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Agrupe los términos de $2a + 2b - xa - xb$.
  alternativas:
  - $(2a + 2b) - (xa + xb)$
  - $(2a + 2b) - (xa - xb)$
  - $(2a - 2b) + (xa + xb)$
  respuesta: $(2a + 2b) - (xa + xb)$
  solucion_pasos:
  - 1. Anteponiendo signo $-$, los términos $-xa - xb$ pasan a ser $+xa + xb$ dentro
    del paréntesis.
- titulo: Ejemplo 2
  enunciado: Reordene $5x + 3y + 5y + 3x$ asociando por el coeficiente numérico.
  alternativas:
  - $(5x + 5y) + (3x + 3y)$
  - $(5x + 3x) + (5y + 3y)$
  - Ambas son opciones de agrupación válidas
  respuesta: Ambas son opciones de agrupación válidas
  solucion_pasos:
  - 1. Ambas permutaciones permiten factorizar por agrupación exitosamente.
- titulo: ¿Es la conmutatividad aditiva la que permite cambiar el orden de los sumandos
    antes de agrupar?
  respuesta: Sí
  solucion_pasos:
  - Sí, la propiedad conmutativa $a+b=b+a$ autoriza la reordenación.
- titulo: ¿Cambia la suma total de un polinomio si agrupamos sus términos mediante
    paréntesis adecuadamente signados?
  respuesta: 'No'
  solucion_pasos:
  - No, la propiedad asociativa garantiza que el valor algebraico permanece idéntico.
errores_frecuentes:
- Mantener el mismo signo en el segundo término dentro del paréntesis cuando se antepone
  un signo negativo.
- Declarar que los términos deben agruparse estrictamente en el orden de aparición
  original.
- Alterar los signos de los términos al reordenarlos conmutativamente.
- Declarar que un paréntesis de agrupación realiza multiplicaciones entre sus propios
  miembros.
- Colocar un signo de multiplicación entre los paréntesis agrupados en lugar del signo
  de adición o sustracción original.
afirmaciones_verdaderas:
- La reordenación conmutativa de términos permite formar grupos con coeficientes o
  variables comunes.
- Anteponer un signo negativo a un paréntesis requiere invertir el signo de cada término
  agrupado.
al_terminar_debes_poder: Al terminar serás capaz de reordenar y agrupar estratégicamente
  los términos de un polinomio resguardando las leyes de signos.
