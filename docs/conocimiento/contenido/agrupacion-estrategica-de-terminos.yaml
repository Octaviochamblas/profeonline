procedimiento:
- 'Paso 1: Verifica que el polinomio no tenga un factor común global.'
- 'Paso 2: Cuenta la cantidad de términos. (Generalmente debe ser un número par como
  4 o 6).'
- 'Paso 3: Agrupa los términos en pares (o tríos) asegurándote de que cada grupo comparta
  algo en común.'
- 'Paso 4: Escríbelos encerrados en paréntesis, unidos siempre por un signo de suma
  (+).'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en agrupación estratégica de términos.
ejemplos:
- titulo: Agrupa los términos del polinomio $2x^2 - 4x + xy - 2y$ en dos pares
  enunciado: Agrupa los términos del polinomio $2x^2 - 4x + xy - 2y$ en dos pares.
  solucion_pasos:
  - El primer y segundo término comparten números pares y la 'x'.
  - El tercer y cuarto término comparten la 'y'.
  - 'Agrupamos: $(2x^2 - 4x) + (xy - 2y)$.'
- titulo: ¿Cómo agruparías $ab + ac - b - c$ asegurando no alterar signos?
  solucion_pasos:
  - Al usar un + en medio, el - de la 'b' se mantiene intacto dentro del segundo paréntesis.
- titulo: 'Respecto de «Agrupación estratégica de términos»: ¿Es correcta esta caracterización?
    «La agr'
  enunciado: 'Respecto de «Agrupación estratégica de términos»: ¿Es correcta esta
    caracterización? «La agrupación de términos consiste en asociar los términos de
    un polinomio en grupos (normalmente pares) que compartan un factor común parcial,
    como paso preparatorio para una factorización mayor»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La agrupación de términos consiste
    en asociar los términos de un polinomio en grupos (normalmente pares) que compartan
    un factor común parcial, como paso preparatorio para una factorización mayor.'
- titulo: 'Respecto de «Agrupación estratégica de términos»: ¿Es válida esta afirmación?
    «Poner un sign'
  enunciado: 'Respecto de «Agrupación estratégica de términos»: ¿Es válida esta afirmación?
    «Poner un signo negativo entre los grupos sin cambiar los signos del segundo paréntesis.
    Ej: $(ax) - (by+...)$ incorrectamente»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La agrupación de términos consiste
    en asociar los términos de un polinomio en grupos (normalmente pares) que compartan
    un factor común parcial, como paso preparatorio para una factorización mayor.'
errores_frecuentes:
- 'Poner un signo negativo entre los grupos sin cambiar los signos del segundo paréntesis.
  Ej: $(ax) - (by+...)$ incorrectamente.'
- Agrupar términos que no tienen absolutamente nada en común.
- Sumar los términos semejantes.
- Para «¿Cuál es el propósito principal de agrupar términos en un polinomio largo»,
  la respuesta correcta es Eliminar variables.
- Para «¿Cuál es el propósito principal de agrupar términos en un polinomio largo»,
  la respuesta correcta es Convertir el polinomio en un monomio.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando agrupación estratégica de términos.
