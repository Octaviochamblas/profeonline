procedimiento:
- 'Paso 1: Identifica los valores a y b en la ecuación x/a+y/b=1.'
- 'Paso 2: Interpreta a como la coordenada x del intercepto con el eje x: el punto
  (a,0).'
- 'Paso 3: Interpreta b como la coordenada y del intercepto con el eje y: el punto
  (0,b).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con interpretación de los interceptos en la ecuación segmentaria.
