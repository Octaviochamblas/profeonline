semantic_id: MAT.GEO.RECTA_ECUACIONES.INTERCEPTOS_SEGMENTARIA
resumen_inicial: 'Interpretación de los interceptos en la ecuación segmentaria: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'Los valores a y b no son solo coeficientes algebraicos: representan
  directamente las coordenadas de los puntos de corte con los ejes, lo que facilita
  graficar la recta rápidamente.'
explicacion_formal: '![Interceptos en la forma segmentaria](/static/img/geometria/analitica/rectaeq-interceptos-segmentaria.svg)


  ### Definición formal


  Evaluando $\dfrac{x}{a}+\dfrac{y}{b}=1$ en $y=0$: $\dfrac{x}{a}=1$, por lo que $x=a$,
  confirmando el intercepto $(a,0)$. Evaluando en $x=0$: $\dfrac{y}{b}=1$, por lo
  que $y=b$, confirmando el intercepto $(0,b)$.


  ### Desarrollo didáctico


  En la figura, la recta $\dfrac{x}{5}+\dfrac{y}{3}=1$ corta el eje x exactamente
  en $(5,0)$ y el eje y exactamente en $(0,3)$, permitiendo graficarla trazando solo
  esos dos puntos y uniéndolos.'
definiciones_clave: '- **Interpretación de los interceptos en la ecuación segmentaria**:
  Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
