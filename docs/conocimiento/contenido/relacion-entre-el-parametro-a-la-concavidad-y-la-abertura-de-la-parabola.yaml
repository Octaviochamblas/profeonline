semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.EFECTO_PARAMETRO_A
resumen_inicial: La relación del parámetro $a$ sintetiza cómo su signo rige la concavidad ($\cup$ o $\cap$) y su magnitud $|a|$ rige la abertura de la parábola.
explicacion_simple: |
  El parámetro **$a$** es el verdadero "ADN" de la forma de la parábola. Gobierna **dos propiedades geométricas simultáneamente**:

  1. **Su signo ($\text{sgn}(a)$) decide la concavidad (hacia dónde apunta)**:
     - **$a > 0$**: Ramas hacia arriba $\cup$ (parábola cóncava hacia arriba, tiene un mínimo).
     - **$a < 0$**: Ramas hacia abajo $\cap$ (parábola cóncava hacia abajo, tiene un máximo).
  2. **Su valor absoluto ($|a|$) decide la abertura (cuán gorda o flaca es)**:
     - **$|a| > 1$**: Parábola **estrecha** (se pega al eje Y).
     - **$|a| < 1$**: Parábola **ancha** (se abre hacia el eje X).
explicacion_formal: |
  Dada la expresión cuadrática en forma canónica $f(x) = a(x - h)^2 + k$, el **coeficiente cuadrático principal $a \in \mathbb{R} \setminus \{0\}$** determina analíticamente la geometría diferencial del grafo $G(f)$:

  **Matriz funcional del parámetro $a$:**
  - **Dirección del vector curvatura:**
    $$\text{sgn}(a) = \frac{a}{|a|} \implies \begin{cases} +1 & \implies f''(x) = 2a > 0 \text{ (Convexa / Cóncava hacia arriba)} \\ -1 & \implies f''(x) = 2a < 0 \text{ (Cóncava / Cóncava hacia abajo)} \end{cases}$$
  - **Tasa de dilatación espectral:**
    $$\lim_{|a| \to \infty} \text{Abertura} = 0 \quad \text{y} \quad \lim_{|a| \to 0} \text{Abertura} = \infty$$
definiciones_clave: |
  - **Coeficiente principal $a$**: Parámetro cuadrático que determina de forma única la orientación vertical de las ramas y el factor de escala de abertura de la parábola.
propiedades_relaciones: |
  - **Invariancia bajo traslaciones**: Las traslaciones horizontales y verticales ($h$ y $k$) no alteran el parámetro $a$, conservando inalterados el signo de concavidad y la magnitud de abertura.
ejemplo_guiado:
  enunciado: 'Analiza completamente el efecto del parámetro $a = -5$ en la función cuadrática $f(x) = -5(x - 1)^2 + 4$.'
  pasos:
    - 'Paso 1: Evaluar el signo de $a$: $a = -5 < 0$, la concavidad es negativa (ramas abiertas hacia abajo $\cap$).'
    - 'Paso 2: Evaluar la magnitud de $a$: $|a| = |-5| = 5 > 1$.'
    - 'Paso 3: Determinar la abertura: al ser $|a| = 5 > 1$, la parábola sufre una dilatación vertical resultando muy estrecha.'
    - 'Paso 4: Concluir que se trata de una parábola **cóncava hacia abajo y muy estrecha**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una parábola se abre hacia arriba y es más ancha que $y = x^2$, ¿cuál de las siguientes opciones describe los valores posibles del parámetro $a$?'
    choices:
      - {text: '$0 < a < 1$', is_correct: true}
      - {text: '$a > 1$.', is_correct: false}
      - {text: '$-1 < a < 0$.', is_correct: false}
      - {text: '$a < -1$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$0 < a < 1$''. Cóncava hacia arriba impone $a > 0$, y más ancha impone $|a| < 1$, luego $0 < a < 1$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dadas las funciones $f(x) = -2x^2 + 1$ y $g(x) = 2x^2 - 9$, ¿qué relación existe entre la abertura de sus dos parábolas?'
    choices:
      - {text: 'Tienen exactamente la misma abertura porque $|-2| = |2| = 2$', is_correct: true}
      - {text: 'La función $g(x)$ es más ancha porque su coeficiente es positivo.', is_correct: false}
      - {text: 'La función $f(x)$ es más estrecha porque incluye un término positivo.', is_correct: false}
      - {text: 'No es posible comparar sus aberturas.', is_correct: false}
    explanation: 'La alternativa correcta es ''Tienen exactamente la misma abertura porque $|-2| = |2| = 2$''. La abertura solo depende del valor absoluto.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer el coeficiente $a$ que acompaña al término cuadrático.'
  - 'Paso 2: Observar el signo para fijar concavidad hacia arriba ($a > 0$) o abajo ($a < 0$).'
  - 'Paso 3: Calcular $|a|$ para determinar si es estrecha ($|a| > 1$) o ancha ($|a| < 1$).'
  - 'Paso 4: Combinar ambas conclusiones en una descripción geométrica completa.'
errores_correccion: |
  - **Error común:** Creer que si un número es negativo y grande en módulo (ej. $a = -8$), la parábola es "ancha" por ser menor que 0.
  - **Cómo corregirlo:** Separa los dos conceptos: el signo menos dice **"HACIA ABAJO"**, y el 8 dice **"MUY ESTRECHA"**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Concavidad positiva y dilatación.
    alternativas:
      - 'Parábola cóncava hacia arriba y estrecha'
      - 'Parábola cóncava hacia abajo y ancha'
      - 'Parábola cóncava hacia arriba y ancha'
    respuesta: 'Parábola cóncava hacia arriba y estrecha'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Concavidad negativa y contracción.
    alternativas:
      - 'Parábola cóncava hacia abajo y ancha'
      - 'Parábola cóncava hacia abajo y estrecha'
      - 'Parábola cóncava hacia arriba y ancha'
    respuesta: 'Parábola cóncava hacia abajo y ancha'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = -4x^2$, es correcto afirmar que la gráfica es ancha por tener coeficiente negativo.'
  - 'La confusión entre el papel del signo de $a$ (concavidad) y el valor absoluto $|a|$ (abertura).'
  - 'La suposición de que al cambiar las coordenadas del vértice $(h, k)$ se modifica el valor del coeficiente $a$.'
  - 'La suposición de que parábolas con la misma abertura tienen obligatoriamente la misma concavidad.'
  - 'Afirmar que un coeficiente cuadrático igual a cero produce una parábola infinitamente ancha.'
afirmaciones_verdaderas:
  - 'El signo del parámetro $a$ rige la concavidad de la parábola y el valor absoluto $|a|$ determina cuán ancha o estrecha es su abertura.'
  - 'Dos parábolas con coeficientes cuadráticos de igual valor absoluto $|a_1| = |a_2|$ poseen exactamente la misma abertura geométrica.'
al_terminar_debes_poder: |
  QUÉ: Analizar globalmente el efecto dual del parámetro $a$ sobre la concavidad y abertura de la parábola.
  CÓMO: Isolar $a$, evaluar $\text{sgn}(a)$ para concavidad, calcular $|a|$ para la abertura y redactar la caracterización geométrica.
