procedimiento:
- 'Paso 1: Analiza el signo de $a$ para determinar la concavidad (arriba o abajo).'
- 'Paso 2: Analiza el valor absoluto de $a$ para determinar la abertura (más angosta
  o más ancha que $x^2$).'
- 'Paso 3: Combina ambos análisis para describir completamente la forma de la parábola.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en relación entre el parámetro a, la concavidad
  y la abertura de la parábola.
ejemplos:
- titulo: Análisis combinado con a negativo y grande
  enunciado: Describe completamente el efecto de $a$ en $f(x)=-6x^2$.
  solucion_pasos:
  - Concavidad hacia abajo, pues $a=-6<0$.
  - Más angosta que $x^2$, pues $|a|=6>1$.
- titulo: Análisis combinado con a positivo y pequeño
  enunciado: Describe completamente el efecto de $a$ en $f(x)=0{,}2x^2$.
  solucion_pasos:
  - Concavidad hacia arriba, pues $a=0{,}2>0$.
  - Más ancha que $x^2$, pues $|a|=0{,}2<1$.
- titulo: ¿Son independientes el efecto del signo y del valor absoluto de $a$?
  enunciado: ¿Son independientes el efecto del signo y del valor absoluto de $a$?
  respuesta: Sí
  solucion_pasos:
  - El signo determina exclusivamente la concavidad, y el valor absoluto determina
    exclusivamente la abertura; son análisis separados.
- titulo: ¿Dos parábolas con el mismo $|a|$ pero signo opuesto tienen la misma abertura?
  enunciado: ¿Dos parábolas con el mismo $|a|$ pero signo opuesto tienen la misma
    abertura?
  respuesta: Sí
  solucion_pasos:
  - La abertura depende solo del valor absoluto de $a$, por lo que sería idéntica
    aunque las concavidades sean opuestas.
errores_frecuentes:
- Analizar solo el signo de $a$ sin considerar el efecto de su valor absoluto en la
  abertura.
- Analizar solo el valor absoluto sin considerar el efecto del signo en la concavidad.
- Declarar "parábola angosta" con "parábola con concavidad hacia abajo", que son propiedades
  independientes.
- No combinar correctamente ambos efectos al describir completamente una parábola.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  relación entre el parámetro a, la concavidad y la abertura de la parábola.
