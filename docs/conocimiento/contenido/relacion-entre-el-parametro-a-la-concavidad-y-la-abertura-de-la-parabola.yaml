semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.EFECTO_PARAMETRO_A
resumen_inicial: 'Relación entre el parámetro a, la concavidad y la abertura de la
  parábola: parábola, vértice, concavidad y formas de Traslaciones y transformaciones.'
explicacion_simple: 'El coeficiente $a$ hace dos trabajos a la vez: su signo decide
  hacia dónde abre la parábola, y su valor absoluto decide qué tan abierta o cerrada
  se ve.'
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2$, el parámetro $a$ tiene dos efectos independientes: el signo de
  $a$ determina la concavidad (hacia arriba si $a>0$, hacia abajo si $a<0$), y el
  valor $|a|$ determina la abertura (contracción si $|a|>1$, dilatación si $0<|a|<1$).


  ### Desarrollo didáctico


  Para analizar completamente el efecto de $a$, conviene separar el análisis en dos
  preguntas independientes: ¿cuál es el signo de $a$? y ¿cuál es el valor de $|a|$?
  Ambas respuestas se combinan para describir completamente la parábola.


  Para $f(x)=-3x^2$: el signo negativo indica concavidad hacia abajo; el valor absoluto
  $3>1$ indica que la parábola es más angosta que $x^2$. Combinando ambos efectos,
  es una parábola angosta que abre hacia abajo.'
definiciones_clave: '- **Relación entre el parámetro a, la concavidad y la abertura
  de la parábola**: Elemento o parámetro esencial en la representación de la función
  cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  relación entre el parámetro a, la concavidad y la abertura de la parábola.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando relación entre
    el parámetro a, la concavidad y la abertura de la parábola.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a relación
    entre el parámetro a, la concavidad y la abertura de la parábola.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
