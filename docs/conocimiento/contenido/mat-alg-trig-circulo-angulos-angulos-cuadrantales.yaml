semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.ANGULOS_CUADRANTALES
resumen_inicial: 'Identificación de los ángulos cuadrantales cuya posición terminal coincide exactamente con los ejes del plano cartesiano.'
explicacion_simple: |
  En el círculo unitario, los ejes cartesiano dividen al plano en cuatro zonas llamadas cuadrantes. Los ángulos cuyos rayos finales caen justo encima de las líneas de los ejes se llaman **ángulos cuadrantales**. Como no quedan atrapados dentro de ningún cuadrante sino sobre las fronteras, sus valores principales son los múltiplos de $90^\circ$ (o $\frac{\pi}{2} \text{ rad}$): $0^\circ$, $90^\circ$, $180^\circ$, $270^\circ$ y $360^\circ$. Sus coordenadas sobre el círculo unitario son exclusivamente $0, 1$ o $-1$.
explicacion_formal: |
  ### Definición formal
  Un ángulo $\theta$ en posición estándar se denomina **ángulo cuadrantal** si su lado terminal coincide con uno de los semiejes del sistema cartesiano. Analíticamente, se expresan como múltiplos enteros de un ángulo recto:
  $$\theta = k \cdot 90^\circ = k \cdot \frac{\pi}{2} \text{ rad} \quad (k \in \mathbb{Z})$$

  ### Desglose simbólico
  - $k = 0 \implies \theta = 0^\circ = 0 \text{ rad}$: Semieje $+X$, punto $(1,0)$.
  - $k = 1 \implies \theta = 90^\circ = \frac{\pi}{2} \text{ rad}$: Semieje $+Y$, punto $(0,1)$.
  - $k = 2 \implies \theta = 180^\circ = \pi \text{ rad}$: Semieje $-X$, punto $(-1,0)$.
  - $k = 3 \implies \theta = 270^\circ = \frac{3\pi}{2} \text{ rad}$: Semieje $-Y$, punto $(0,-1)$.
  - $k = 4 \implies \theta = 360^\circ = 2\pi \text{ rad}$: Semieje $+X$, punto $(1,0)$.

  ### Síntesis didáctica
  Los ángulos cuadrantales sirven de fronteras divisorias entre cuadrantes. Sus razones trigonométricas producen valores extremos simples ($1, 0, -1$) o indefiniciones por división entre cero (como la tangente a $90^\circ$), actuando como puntos clave para graficar ondas sinusoides.
definiciones_clave: |
  - **Ángulo cuadrantal**: Ángulo en posición estándar cuyo lado terminal descansa sobre uno de los ejes coordenados.
  - **Múltiplo cuadrantal**: Ángulo expresado de la forma $k \cdot \frac{\pi}{2}$ para algún entero $k \in \mathbb{Z}$.
  - **Puntos extremos cuadrantales**: Coordenadas $(1,0)$, $(0,1)$, $(-1,0)$ y $(0,-1)$ ubicadas en los cortes axiales.
propiedades_relaciones: |
  - **Pertenencia cuadrantal**: Los ángulos cuadrantales **no pertenecen a ningún cuadrante**, sino que separan un cuadrante del siguiente.
  - **Identidades de valor extremo**:
    - En $0^\circ$ y $180^\circ$: El seno vale $0$ y el coseno vale $1$ o $-1$.
    - En $90^\circ$ y $270^\circ$: El coseno vale $0$ y el seno vale $1$ o $-1$.
ejemplo_guiado:
  enunciado: 'Determina si el ángulo $\theta = 450^\circ$ es un ángulo cuadrantal, halla su múltiplo $k$ y determina su punto equivalente sobre el círculo unitario.'
  pasos:
    - 'Paso 1: Dividir el ángulo por $90^\circ$ para evaluar el cociente: $\frac{450^\circ}{90^\circ} = 5$.'
    - 'Paso 2: Como el resultado es un número entero exacto ($k = 5$), $\theta = 450^\circ$ es un **ángulo cuadrantal**.'
    - 'Paso 3: Restar un giro completo para hallar su posición básica: $450^\circ - 360^\circ = 90^\circ$.'
    - 'Paso 4: El lado terminal coincide con el semieje positivo Y en el punto de coordenadas $(0, 1)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones caracteriza a todos los ángulos cuadrantales?'
    choices:
      - {text: '$\theta = k \cdot 90^\circ$ con $k \in \mathbb{Z}$', is_correct: true}
      - {text: '$\theta = k \cdot 45^\circ$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$\theta = k \cdot 60^\circ$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$\theta = k \cdot 180^\circ + 45^\circ$ con $k \in \mathbb{Z}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\theta = k \cdot 90^\circ$ con $k \in \mathbb{Z}$''. Todos los ángulos cuadrantales son múltiplos enteros de $90^\circ$ o $\frac{\pi}{2} \text{ rad}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué punto del círculo unitario corresponde el ángulo cuadrantal de $\pi \text{ rad}$ ($180^\circ$)?'
    choices:
      - {text: '$(-1, 0)$', is_correct: true}
      - {text: '$(0, -1)$', is_correct: false}
      - {text: '$(1, 0)$', is_correct: false}
      - {text: '$(0, 1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(-1, 0)$''. Corresponde a la intersección del círculo unitario con el semieje negativo X.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar la medida del ángulo $\theta$ en grados o radianes.'
  - 'Paso 2: Dividir la magnitud entre $90^\circ$ (o entre $\frac{\pi}{2}$).'
  - 'Paso 3: Si la división resulta en un número entero $k \in \mathbb{Z}$, confirmar que se trata de un ángulo cuadrantal.'
  - 'Paso 4: Identificar las coordenadas del punto de corte sobre el eje: $(1,0)$, $(0,1)$, $(-1,0)$ o $(0,-1)$.'
errores_correccion: |
  - **Error 1:** Asignar un ángulo cuadrantal como $90^\circ$ al primer cuadrante o al segundo cuadrante. **Cómo corregirlo:** Los ángulos cuadrantales constituyen las fronteras y no pertenecen a ningún cuadrante en particular.
  - **Error 2:** Creer que ángulos notables como $45^\circ$ o $60^\circ$ son ángulos cuadrantales. **Cómo corregirlo:** Los ángulos cuadrantales caen exactamente sobre los ejes; $45^\circ$ o $60^\circ$ caen en el interior del cuadrante.
ejemplos:
  - titulo: 'Evaluación de 270 grados'
    enunciado: '¿Es $\theta = 270^\circ$ un ángulo cuadrantal?'
    alternativas:
      - 'Sí, es el múltiplo $k = 3$ de $90^\circ$'
      - 'No, pertenece al tercer cuadrante'
      - 'No, porque su seno vale $-1$'
    respuesta: 'Sí, es el múltiplo $k = 3$ de $90^\circ$'
    solucion_pasos:
      - '1. Evaluamos $270^\circ / 90^\circ = 3$.'
      - '2. Como el cociente es entero, es un ángulo cuadrantal sobre el semieje $-Y$.'
  - titulo: 'Evaluación de 135 grados'
    enunciado: '¿El ángulo de $135^\circ$ es un ángulo cuadrantal?'
    alternativas:
      - 'No, pues no es múltiplo de $90^\circ$'
      - 'Sí, porque es múltiplo de $45^\circ$'
      - 'Sí, porque está en el segundo cuadrante'
    respuesta: 'No, pues no es múltiplo de $90^\circ$'
    solucion_pasos:
      - '1. $135 / 90 = 1.5$ (no es entero).'
      - '2. El ángulo se ubica dentro del II Cuadrante, no sobre los ejes.'
  - titulo: 'Ángulo cuadrantal negativo'
    enunciado: '¿Es el ángulo de $-90^\circ$ un ángulo cuadrantal?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $-90^\circ = -1 \cdot 90^\circ$ ($k = -1$), cayendo sobre el semieje $-Y$.'
  - titulo: 'Punto cuadrantal en el origen de rotación'
    enunciado: '¿El ángulo de $0^\circ$ corresponde al punto cuadrantal $(1,0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $0^\circ = 0 \cdot 90^\circ$ ($k = 0$) e intersecta al eje $+X$ en $(1,0)$.'
errores_frecuentes:
  - 'La afirmación de que el ángulo de $90^\circ$ pertenece de forma simultánea al primer y segundo cuadrante.'
  - 'La afirmación de que el ángulo de $45^\circ$ es un ángulo cuadrantal por ser la mitad de $90^\circ$.'
  - 'La afirmación de que los ángulos cuadrantales poseen ordenadas y abscisas con valores decimales infinitos.'
  - 'La afirmación de que los ángulos cuadrantales negativos no se ubican sobre los ejes cartesianos.'
  - 'La afirmación de que el punto $(-1,0)$ corresponde al ángulo cuadrantal de $90^\circ$.'
afirmaciones_verdaderas:
  - 'Los ángulos cuadrantales son los múltiplos enteros de $90^\circ$ (o $\frac{\pi}{2} \text{ rad}$) cuyo lado terminal coincide exactamente con uno de los ejes coordenados.'
  - 'Los puntos sobre el círculo unitario correspondientes a los ángulos cuadrantales poseen únicamente coordenadas $0$, $1$ o $-1$.'
al_terminar_debes_poder: |
  QUÉ: Identificar ángulos cuadrantales y determinar sus coordenadas en el círculo unitario.
  CÓMO: Verificar si el ángulo es múltiplo entero de $90^\circ$ ($\frac{\pi}{2} \text{ rad}$) y asociar su punto de intersección axial.
