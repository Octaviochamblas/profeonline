procedimiento:
- 'Paso 1: Verifica si el ángulo dado es un múltiplo de $90°$ (o $\pi/2$ radianes).'
- 'Paso 2: Si lo es, identifica sobre qué semieje cae el lado terminal.'
- 'Paso 3: Determina el punto correspondiente sobre el círculo unitario.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en identificación de ángulos
  cuadrantales en el círculo unitario.
ejemplos:
- titulo: Identificación del punto para $180°$
  enunciado: ¿Cuál es el punto del círculo unitario asociado al ángulo cuadrantal
    $180°$?
  solucion_pasos:
  - El lado terminal coincide con el semieje negativo $x$.
  - El punto asociado es $(-1,0)$.
- titulo: Identificación de un ángulo cuadrantal en radianes
  enunciado: ¿Es $\dfrac{3\pi}{2}$ un ángulo cuadrantal?
  solucion_pasos:
  - Se verifica que corresponde a $270°$, múltiplo de $90°$.
  - Sí, es un ángulo cuadrantal, con punto asociado $(0,-1)$.
- titulo: ¿$45°$ es un ángulo cuadrantal?
  enunciado: ¿El ángulo $45°$ se considera un ángulo cuadrantal?
  respuesta: 'No'
  solucion_pasos:
  - No es múltiplo de $90°$, así que su lado terminal cae dentro de un cuadrante,
    no sobre un eje.
- titulo: ¿$360°$ y $0°$ corresponden al mismo punto en el círculo unitario?
  enunciado: ¿Los ángulos $360°$ y $0°$ tienen asociado el mismo punto en el círculo
    unitario?
  respuesta: Sí
  solucion_pasos:
  - Ambos tienen el lado terminal sobre el semieje positivo $x$, correspondiendo al
    punto $(1,0)$.
errores_frecuentes:
- Declarar un ángulo cuadrantal con un ángulo que simplemente pertenece a un cuadrante.
- Asociar el punto incorrecto a cada ángulo cuadrantal.
- No reconocer los ángulos cuadrantales expresados en radianes.
- Omitir que $360°$ y $0°$ representan el mismo punto sobre el círculo.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  identificación de ángulos cuadrantales en el círculo unitario.
