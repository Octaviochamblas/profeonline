semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.ANGULOS_CUADRANTALES
resumen_inicial: 'Identificación de ángulos cuadrantales en el círculo unitario: círculo
  unitario, amplitud, período y transformaciones de Círculo unitario y sistemas de
  medida.'
explicacion_simple: Algunos ángulos son especiales porque su lado terminal cae exactamente
  sobre uno de los ejes coordenados, en vez de quedar dentro de un cuadrante.
explicacion_formal: '### Definición formal


  Un ángulo es cuadrantal si su lado terminal coincide con el semieje positivo $x$
  ($0°$), el semieje positivo $y$ ($90°$), el semieje negativo $x$ ($180°$), o el
  semieje negativo $y$ ($270°$). Cada uno corresponde a un múltiplo de $90°$ (o $\pi/2$
  radianes).


  ### Desarrollo didáctico


  El punto asociado a $0°$ es $(1,0)$; a $90°$ es $(0,1)$; a $180°$ es $(-1,0)$; a
  $270°$ es $(0,-1)$. En radianes, estos ángulos son $0$, $\pi/2$, $\pi$ y $3\pi/2$
  respectivamente.'
definiciones_clave: '- **Identificación de ángulos cuadrantales en el círculo unitario**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de ángulos cuadrantales en el círculo unitario.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de ángulos cuadrantales en el círculo unitario.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de ángulos cuadrantales en el círculo
    unitario.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
