semantic_id: MAT.ALG.POLINOMIOS.POLINOMIOS_IDENTICOS
resumen_inicial: 'Dos polinomios son idénticos si tienen el mismo grado y los coeficientes de sus términos de igual grado son respectivamente iguales.'
explicacion_simple: |
  - Dos polinomios son **idénticos** ($P(x) \equiv Q(x)$) si son **exactamente la misma expresión matemática**, aunque estén escritos de forma distinta.
  - Por ejemplo: $(x + 3)^2$ y $x^2 + 6x + 9$ son polinomios idénticos:
    - Si reemplazamos $x = 2$: $(2+3)^2 = 25$ y $2^2 + 6(2) + 9 = 25$.
    - ¡Dan el mismo resultado para **cualquier número** que elijamos!
  - **Diferencia con una ecuación normal:**
    - Una ecuación (como $2x + 1 = 7$) solo es verdadera para un valor ($x = 3$).
    - Una identidad ($2(x + 1) \equiv 2x + 2$) es verdadera para **todos los números reales**.

  ![Polinomios Idénticos](/static/img/nodos/identificacion-de-polinomios-identicos-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sean $P(x) = \sum_{i=0}^n a_i x^i$ y $Q(x) = \sum_{i=0}^n b_i x^i$ dos polinomios en $\mathbb{K}[x]$.
  $P$ y $Q$ son **polinomios idénticos** (denotado $P(x) \equiv Q(x)$) si y solo si todos sus coeficientes homólogos son iguales:

  $$P(x) \equiv Q(x) \iff \forall i \in \{0, 1, \dots, n\}, \quad a_i = b_i$$

  ### Teorema de equivalencia funcional
  En cuerpos infinitos ($\mathbb{R}$ o $\mathbb{C}$), dos polinomios de grado a lo sumo $n$ son idénticos si y solo si coinciden en su valor numérico en al menos $n + 1$ puntos distintos:

  $$P(x_k) = Q(x_k) \quad \text{para } k = 1, 2, \dots, n+1 \implies P(x) \equiv Q(x)$$

  ### Criterio de la diferencia nula
  $$P(x) \equiv Q(x) \iff P(x) - Q(x) \equiv \mathbf{0} \quad (\text{Polinomio nulo})$$
definiciones_clave: |
  - **Polinomios idénticos**: Polinomios con idénticos coeficientes en términos del mismo grado ($P \equiv Q$).
  - **Identidad polinomial**: Igualdad algebraica que se cumple universalmente para todo $x \in \mathbb{R}$.
  - **Coeficientes homólogos**: Coeficientes que acompañan a la misma potencia de la variable en ambos polinomios.
propiedades_relaciones: |
  - **Relación de equivalencia**: La identidad polinomial es reflexiva ($P \equiv P$), simétrica ($P \equiv Q \iff Q \equiv P$) y transitiva ($P \equiv Q \land Q \equiv R \implies P \equiv R$).
  - **Base de productos notables**: Todas las fórmulas de productos notables y factorizaciones son identidades polinomiales.
ejemplo_guiado:
  enunciado: 'Demuestra si los polinomios $P(x) = (x - 2)(x + 2) + 5$ y $Q(x) = x^2 + 1$ son idénticos.'
  imagen: '/static/img/nodos/identificacion-de-polinomios-identicos-ejemplos.svg'
  pasos:
    - 'Paso 1: Desarrollamos y reducimos el polinomio $P(x)$:'
    - '  - $(x - 2)(x + 2) = x^2 - 4$ (Diferencia de cuadrados).'
    - '  - $P(x) = x^2 - 4 + 5 = **x^2 + 1$**.'
    - 'Paso 2: Escribimos el polinomio $Q(x)$: **$Q(x) = x^2 + 1$**.'
    - 'Paso 3: Comparamos los coeficientes homólogos:'
    - '  - Coeficiente de $x^2$: $1 = 1$.'
    - '  - Coeficiente de $x$: $0 = 0$.'
    - '  - Término independiente: $1 = 1$.'
    - 'Paso 4: Conclusión: Como todos los coeficientes correspondientes son iguales, **$P(x) \equiv Q(x)$ son polinomios idénticos**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición garantiza formalmente que dos polinomios reducidos sean idénticos?'
    choices:
      - text: 'Que tengan el mismo grado y los coeficientes de sus términos de igual grado sean respectivamente iguales'
        is_correct: true
      - text: 'Que den el mismo resultado al evaluarse en $x = 0$ únicamente'
        is_correct: false
      - text: 'Que tengan la misma cantidad de letras'
        is_correct: false
      - text: 'Que ambos tengan grado par'
        is_correct: false
    explanation: 'La alternativa correcta es ''Que tengan el mismo grado y los coeficientes de sus términos de igual grado sean respectivamente iguales''. Es la definición canónica de polinomios idénticos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si dos polinomios de segundo grado coinciden en 3 puntos distintos, ¿qué se concluye?'
    choices:
      - text: 'Son polinomios idénticos para todo número real'
        is_correct: true
      - text: 'Solo son iguales en esos 3 puntos'
        is_correct: false
      - text: 'Uno es el doble del otro'
        is_correct: false
      - text: 'No se puede concluir nada'
        is_correct: false
    explanation: 'La alternativa correcta es ''Son polinomios idénticos para todo número real''. Por el teorema fundamental, dos polinomios de grado $n$ que coinciden en $n+1$ puntos son idénticos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar productos y reducir términos semejantes en ambos polinomios.'
  - 'Paso 2: Escribir ambos polinomios en forma ordenada canónica (descendente).'
  - 'Paso 3: Comparar término a término los coeficientes de cada potencia de $x$.'
  - 'Paso 4: Si todos los coeficientes homólogos coinciden, confirmar la identidad $P(x) \equiv Q(x)$.'
errores_correccion: |
  - **Error 1:** Afirmar que dos polinomios son idénticos probando solo un valor (ej. $x=1$). **Cómo corregirlo:** Deben coincidir **todos los coeficientes homólogos** o verificarse en $n+1$ puntos.
  - **Error 2:** Confundir igualdad condicional (ecuación) con identidad formal. **Cómo corregirlo:** La identidad lleva el símbolo **$\equiv$** y es válida para todo $\mathbb{R}$.
ejemplos:
  - titulo: 'Identidad de binomio al cuadrado'
    enunciado: '¿Son $(x + 5)^2$ y $x^2 + 10x + 25$ polinomios idénticos?'
    alternativas:
      - 'Sí, porque el desarrollo algebraico produce los mismos coeficientes'
      - 'No, porque uno está factorizado y el otro no'
      - 'Solo cuando $x = 0$'
    respuesta: 'Sí, porque el desarrollo algebraico produce los mismos coeficientes'
    solucion_pasos:
      - '1. $(x+5)^2 = x^2 + 2(5)x + 25 = x^2 + 10x + 25$.'
      - '2. Los coeficientes homólogos coinciden: (1, 10, 25).'
      - '3. Son idénticos.'
  - titulo: 'Diferencia no nula'
    enunciado: '¿Son $x^2 + 4$ y $(x + 2)^2$ polinomios idénticos?'
    alternativas:
      - 'No, porque $(x+2)^2 = x^2 + 4x + 4$, que tiene el término $+4x$'
      - 'Sí, son iguales'
      - 'Solo si $x = 2$'
    respuesta: 'No, porque $(x+2)^2 = x^2 + 4x + 4$, que tiene el término $+4x$'
    solucion_pasos:
      - '1. $(x+2)^2 = x^2 + 4x + 4$.'
      - '2. El coeficiente de $x$ en el primero es 0 y en el segundo es 4 ($0 \neq 4$).'
      - '3. No son idénticos.'
  - titulo: 'Identidad en todo el dominio'
    enunciado: '¿Se cumple una identidad polinomial $P(x) \equiv Q(x)$ para cualquier número real que tome la variable $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por definición de identidad formal en $\mathbb{R}[x]$.'
      - '2. Es válida para todo $x \in \mathbb{R}$.'
  - titulo: 'Ecuación vs Identidad'
    enunciado: '¿Es la igualdad $3x - 6 = 0$ una identidad polinomial?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Solo es verdadera cuando $x = 2$.'
      - '2. Es una ecuación condicional, no una identidad.'
errores_frecuentes:
  - 'Concluir que dos polinomios son idénticos evaluando en un solo valor numérico.'
  - 'Confundir una ecuación condicional que se satisface para pocos valores con una identidad.'
  - 'Comparar polinomios antes de desarrollar todos los paréntesis y productos notables.'
  - 'Ignorar diferencias en términos intermedios cuando los extremos coinciden (ej: $(x+y)^2$ vs $x^2+y^2$).'
  - 'Suponer que dos polinomios de distinto grado pueden ser idénticos.'
afirmaciones_verdaderas:
  - 'Dos polinomios son idénticos si y solo si los coeficientes de sus términos de igual grado son respectivamente iguales.'
  - 'Toda identidad polinomial $P(x) \equiv Q(x)$ es válida para cualquier número real del dominio.'
al_terminar_debes_poder: |
  ![Resumen de Polinomios Idénticos](/static/img/nodos/identificacion-de-polinomios-identicos-resumen.svg)

  QUÉ: Identificar y verificar identidades polinomiales ($P(x) \equiv Q(x)$), diferenciándolas de ecuaciones condicionales.
  CÓMO: Desarrollando productos, reduciendo términos semejantes y constatando la igualdad de todos los coeficientes homólogos ($a_i = b_i$).
