procedimiento:
- 'Paso 1: Asegúrate de que ambos polinomios estén reducidos y ordenados de la misma
  manera (ej. descendente).'
- 'Paso 2: Iguala el coeficiente del término de mayor grado del primero, con el del
  segundo.'
- 'Paso 3: Continúa emparejando término a término (los x^2 con los x^2, las x con
  las x, etc).'
- 'Paso 4: Resuelve las pequeñas ecuaciones que se formen de esos emparejamientos.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de polinomios idénticos.
ejemplos:
- titulo: El juego de los gemelos
  enunciado: Si (m-1)x^2 + 4x es idéntico a 7x^2 + nx, descubre m y n.
  solucion_pasos:
  - 'Emparejamos las x^2: m - 1 = 7. Despejando: m = 8.'
  - 'Emparejamos las x: 4 = n. Despejando: n = 4.'
  - Los valores son m=8, n=4.
- titulo: Un software de criptografía requiere igualar un polinomio cifrado con la
    clave maestra para
  enunciado: 'Un software de criptografía requiere igualar un polinomio cifrado con
    la clave maestra para destrabar un archivo. El polinomio cifrado es $Kx^2 + (W-2)x
    + 5$ y la clave maestra es la estructura polinomial $-3x^2 + 8x + 5$. Si el software
    impone la condición de que ambos sean polinomios idénticos, ¿qué valores numéricos
    tomarán los parámetros $K$ y $W$ respectivamente en el núcleo del programa? (v1)


    Opciones: A) $K = -3$ y $W = 10$. · B) $K = -3$ y $W = 8$. · C) $K = 3$ y $W =
    6$. · D) $K = 8$ y $W = -3$.'
  solucion_pasos:
  - 'Emparejamos grado 2: $K = -3$. Emparejamos grado 1: $W-2 = 8 \rightarrow W =
    10$.'
  - 'Respuesta: $K = -3$ y $W = 10$.'
- titulo: 'Respecto de «Identificación de polinomios idénticos»: ¿Se ajusta a la definición
    esta afirma'
  enunciado: 'Respecto de «Identificación de polinomios idénticos»: ¿Se ajusta a la
    definición esta afirmación? «Dos **Polinomios son Idénticos** ($P(x) \equiv Q(x)$)
    si tienen exactamente **los mismos coeficientes para sus términos semejantes**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Dos **Polinomios son Idénticos**
    ($P(x) \equiv Q(x)$) si tienen exactamente **los mismos coeficientes para sus
    términos semejantes**.'
- titulo: 'Respecto de «Identificación de polinomios idénticos»: ¿Es compatible con
    el procedimiento es'
  enunciado: 'Respecto de «Identificación de polinomios idénticos»: ¿Es compatible
    con el procedimiento esta afirmación? «Intentar ''despejar la x'' como si fuera
    una ecuación normal, pasando términos de un lado al otro para aislarla, arruinando
    el emparejamiento»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Dos **Polinomios son Idénticos**
    ($P(x) \equiv Q(x)$) si tienen exactamente **los mismos coeficientes para sus
    términos semejantes**.'
errores_frecuentes:
- Intentar 'despejar la x' como si fuera una ecuación normal, pasando términos de
  un lado al otro para aislarla, arruinando el emparejamiento.
- Olvidar los signos al igualar los coeficientes.
- Para «Si dos polinomios de la misma variable se declaran como 'Idénticos' ($P(x)
  \equiv Q(x)$), ¿qué propiedad operativa se deriva de esta afirmación teórica? (v1)»,
  la respuesta correcta es Que al sumar ambos polinomios el resultado es un polinomio
  nulo.
- Que las raíces (o soluciones) de ambos polinomios son cero.
- Para «Si dos polinomios de la misma variable se declaran como 'Idénticos' ($P(x)
  \equiv Q(x)$), ¿qué propiedad operativa se deriva de esta afirmación teórica? (v1)»,
  la respuesta correcta es Que ambos polinomios son reducibles a un solo monomio.
afirmaciones_verdaderas:
- La notación de identificación de polinomios idénticos sigue las convenciones del
  lenguaje algebraico.
al_terminar_debes_poder: Identificar y operar con conceptos relativos a identificación
