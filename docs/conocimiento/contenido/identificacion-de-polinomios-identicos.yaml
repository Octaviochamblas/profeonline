resumen_inicial: Dos polinomios son idénticos si y solo si adoptan exactamente los
  mismos valores numéricos para cualquier asignación de sus variables.
explicacion_simple: Dos polinomios son idénticos (se escribe $P(x) \equiv Q(x)$) si
  son gemelos exactos. No importa qué número le demos a $x$, ambos polinomios entregan
  exactamente la misma respuesta. Esto ocurre cuando los términos de igual grado en
  ambos polinomios tienen exactamente los mismos números coeficientes.
explicacion_formal: 'Dados $P(x) = \sum_{k=0}^n a_k x^k$ y $Q(x) = \sum_{k=0}^n b_k
  x^k$, la **Identidad Polinómica** $P(x) \equiv Q(x)$ establece:


  $$P(x) \equiv Q(x) \iff \forall x \in \mathbb{R}, \quad P(x) = Q(x)$$


  **Teorema de Coeficientes Iguales:**

  $$P(x) \equiv Q(x) \iff \forall k \in \{0, 1, \dots, n\}, \quad a_k = b_k$$


  > **Complemento didáctico:** La identidad de polinomios va más allá de una igualdad
  condicional; exige la coincidencia formal de coeficientes en todos los grados.'
definiciones_clave: '- **Polinomios idénticos $P(x) \equiv Q(x)$**: Polinomios del
  mismo grado cuyos coeficientes homólogos son iguales.'
propiedades_relaciones: '- **Diferencia nula**: $P(x) \equiv Q(x) \iff P(x) - Q(x)
  \equiv \mathbf{0}$.'
ejemplo_guiado:
  enunciado: Verifique si $P(x) = 2(x + 3) + 4$ y $Q(x) = 2x + 10$ son idénticos.
  pasos:
  - 'Paso 1: Expandir el polinomio $P(x)$: $2x + 6 + 4 = 2x + 10$.'
  - 'Paso 2: Comparar término a término con $Q(x) = 2x + 10$:

    - Coeficiente de $x^1$: $2 = 2$.

    - Término independiente: $10 = 10$.'
  - 'Conclusión: Dado que los coeficientes homólogos son idénticos, $P(x) \equiv Q(x)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición necesaria y suficiente caracteriza a dos polinomios idénticos
    P(x) y Q(x)?
  choices:
  - text: Que los coeficientes de sus términos semejantes de igual grado son idénticos
      entre sí (a_k = b_k)
    is_correct: true
  - text: Que tienen el mismo número de letras pero distintos coeficientes
    is_correct: false
  - text: Que su suma es igual a 100
    is_correct: false
  - text: Que sus grados son cero
    is_correct: false
  explanation: La alternativa correcta es 'Que los coeficientes de sus términos semejantes
    de igual grado son idénticos entre sí (a_k = b_k)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué se confirmó que 2(x + 3) + 4 y 2x + 10
    son idénticos?
  choices:
  - text: Porque al expandir P(x) se obtuvo exactamente 2x + 10, coincidiendo coeficiente
      a coeficiente con Q(x)
    is_correct: true
  - text: Porque ambos tienen la variable x
    is_correct: false
  - text: Porque 3 + 4 es 7
    is_correct: false
  - text: Porque se evaluaron únicamente en 1
    is_correct: false
  explanation: La alternativa correcta es 'Porque al expandir P(x) se obtuvo exactamente
    2x + 10, coincidiendo coeficiente a coeficiente con Q(x)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar y reducir al máximo ambos polinomios.'
- 'Paso 2: Ordenar ambos polinomios en forma descendente respecto a la misma variable.'
- 'Paso 3: Comprobar que los coeficientes de los términos de igual grado sean exactamente
  iguales.'
errores_correccion: '- **Error 1: Declarar que dos polinomios son idénticos por coincidir
  al evaluarse en un solo número.** **Cómo corregirlo:** La identidad exige coincidencia
  para TODOS los reales (o igualdad término a término).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es el polinomio P(x) = (x + 2)^2 idéntico a Q(x) = x^2 + 4x + 4?
  alternativas:
  - Sí, porque la expansión de (x+2)^2 resulta en x^2 + 4x + 4
  - No, le falta un término
  - No, son distintos
  - Indeterminado
  respuesta: Sí, porque la expansión de (x+2)^2 resulta en x^2 + 4x + 4
  solucion_pasos:
  - '1. Expandir P(x): x^2 + 4x + 4.'
  - 2. Coincide término a término con Q(x). Son idénticos.
- titulo: Ejemplo 2
  enunciado: ¿Es P(x) = 3x + 5 idéntico a Q(x) = 3x - 5?
  alternativas:
  - No, porque sus términos independientes tienen signos opuestos (+5 != -5)
  - Sí, son iguales
  - Sí, si x = 0
  - Indeterminado
  respuesta: No, porque sus términos independientes tienen signos opuestos (+5 !=
    -5)
  solucion_pasos:
  - '1. Coeficiente de x: 3 = 3.'
  - '2. Término independiente: +5 != -5.'
  - 3. Al no coincidir en los términos independientes, NO son idénticos.
- titulo: ¿Son idénticos dos polinomios cuya resta resulta en el polinomio nulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, P(x) - Q(x) = 0 implica que P(x) = Q(x) para todo x.
- titulo: ¿Son idénticos los polinomios x^2 + 4 y x^2 + 4x?
  respuesta: 'No'
  solucion_pasos:
  - No, el primero tiene término independiente 4 y el segundo tiene término lineal
    4x.
errores_frecuentes:
- Declarar una ecuación (igualdad condicional) con una identidad polinómica absoluta.
- Declarar idénticos a dos polinomios comparando coeficientes de grados distintos.
- Ignorar las diferencias de signo entre los coeficientes homólogos de ambos polinomios.
- Concluir la identidad tras probar únicamente dos valores numéricos particulares.
- Declarar idénticos dos polinomios de distinto grado absoluto.
afirmaciones_verdaderas:
- Dos polinomios son idénticos si y solo si los coeficientes de sus términos de igual
  grado son iguales.
- La resta de dos polinomios idénticos produce el polinomio nulo.
al_terminar_debes_poder: Al terminar serás capaz de identificar si dos polinomios
  son idénticos reduciendo ambas expresiones e igualando sus coeficientes homólogos.
