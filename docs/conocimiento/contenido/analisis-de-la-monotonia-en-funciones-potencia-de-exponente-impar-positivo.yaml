semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.MONOTONIA_IMPAR
resumen_inicial: 'El análisis de la monotonía en funciones potencia con exponente impar positivo ($n = 2k+1$) demuestra que la función posee monotonía global uniforme en todo $\mathbb{R}$: es estrictamente creciente en $]-\infty, +\infty[$ si $a > 0$ y estrictamente decreciente en $]-\infty, +\infty[$ si $a < 0$, sin cambiar de sentido en ningún punto.'
explicacion_simple: "![El análisis de la monotonía en funciones potencia con exponente impar positivo ($n = 2k+1$) demuestra que la función posee monotonía global uniforme en todo $\\mathbb{R}$: es estrictamente creciente en $]-\\infty, +\\infty[$ si $a > 0$ y estrictamente decreciente en $]-\\infty, +\\infty[$ si $a < 0$, sin cambiar de sentido en ningún punto](/static/img/nodos/analisis-de-la-monotonia-en-funciones-potencia-de-exponente-impar-positivo-intro.svg)\n\n\nA diferencia de las funciones pares, las potencias con **exponente impar positivo ($x^1, x^3, x^5...$) NUNCA cambian de sentido**:\n\n- **Si $a > 0$ (como $x^3, 2x^5$):**\n  - **¡Es ESTRICTAMENTE CRECIENTE en TODO $\\mathbb{R}$!** $\\nearrow$\n  - A medida que avanzas hacia la derecha en el eje $X$, la curva **siempre sube** (en los negativos, en el cero y en los positivos).\n- **Si $a < 0$ (como $-x^3, -5x^7$):**\n  - **¡Es ESTRICTAMENTE DECRECIENTE en TODO $\\mathbb{R}$!** $\\searrow$\n  - A medida que avanzas hacia la derecha,\
  \ la curva **siempre baja**.\n- **¿Qué pasa en $x = 0$?** Aunque la curva se aplana horizontalmente por un instante, la función **sigue creciendo (o decreciendo)** de forma continua."
explicacion_formal: 'Sea $f(x) = a \cdot x^{2k+1}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Calculando la primera derivada:

  $$f''(x) = (2k+1)a \cdot x^{2k}$$

  Dado que $2k$ es un entero par, $x^{2k} > 0$ para todo $x \neq 0$, y $x^{2k} = 0$ únicamente en $x = 0$. Por lo tanto:

  $$\operatorname{sgn}(f''(x)) = \operatorname{sgn}(a), \quad \forall x \in \mathbb{R} \setminus \{0\}$$


  **Teorema de monotonía global estricta**:

  1. Si $a > 0 \implies f''(x) > 0$ para todo $x \neq 0$ y $f''(0) = 0$. Dado que el conjunto de ceros de $f''$ es un conjunto aislado $\{0\}$ (de medida nula), $f$ es **estrictamente creciente en todo $\mathbb{R} = ]-\infty, +\infty[$**.

  2. Si $a < 0 \implies f''(x) < 0$ para todo $x \neq 0$, siendo **estrictamente decreciente en todo $\mathbb{R} = ]-\infty, +\infty[$**.'
definiciones_clave: '- **Monotonía global uniforme**: Conservación del sentido de variación en todo el dominio $\mathbb{R}$.

  - **Punto estacionario no extremo**: Punto $(0, 0)$ donde la derivada se anula ($f''(0) = 0$) sin generar máximos ni mínimos locales.'
propiedades_relaciones: '- **Biyectividad e inyectividad**: Al ser estrictamente monótona en todo $\mathbb{R}$, $f(x_1) = f(x_2) \iff x_1 = x_2$.

  - **Conservación de desigualdades**: Si $a > 0$, $x_1 < x_2 \iff f(x_1) < f(x_2)$ para todo par de reales.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la monotonía en funciones potencia con exponente impar positivo ($n = 2k+1$) demuestra que la función posee monotonía global uniforme en todo $\mathbb{R}$: es estrictamente creciente en $]-\infty, +\infty[$ si $a > 0$ y estrictamente decreciente en $]-\infty, +\infty[$ si $a < 0$, sin cambiar de sentido en ningún punto](/static/img/nodos/analisis-de-la-monotonia-en-funciones-potencia-de-exponente-impar-positivo-ejemplos.svg)



    Analiza la monotonía y el comportamiento diferencial de:

    1) $f(x) = 4x^3$

    2) $g(x) = -2x^5$

    3) Explica qué ocurre en $x = 0$ con la derivada.'
  pasos:
  - 'Paso 1: Para $f(x) = 4x^3$:

    - Derivada: $f''(x) = 12x^2 \ge 0$.

    - Como $a = 4 > 0$, $f(x)$ es **estrictamente creciente en todo $\mathbb{R}$**.'
  - 'Paso 2: Para $g(x) = -2x^5$:

    - Derivada: $g''(x) = -10x^4 \le 0$.

    - Como $a = -2 < 0$, $g(x)$ es **estrictamente decreciente en todo $\mathbb{R}$**.'
  - 'Paso 3: En $x = 0$, $f''(0) = 0$, lo que significa que la recta tangente es perfectamente horizontal ($y = 0$), pero la curva no se devuelve, manteniendo su crecimiento continuo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo es la monotonía de la función $f(x) = 7x^5$ en toda la recta real?
  choices:
  - text: Estrictamente creciente en todo ℝ
    is_correct: true
  - text: Decreciente en los negativos y creciente en los positivos
    is_correct: false
  - text: Estrictamente decreciente en todo ℝ
    is_correct: false
  - text: Constante en x = 0
    is_correct: false
  explanation: La alternativa correcta es 'Estrictamente creciente en todo ℝ'. Al ser $n = 5$ impar y $a = 7 > 0$, su derivada $35x^4 \ge 0$ no cambia de signo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $x_1 < x_2$, ¿qué relación se cumple siempre para la función $g(x) = -3x^3$?
  choices:
  - text: g(x₁) > g(x₂) (es estrictamente decreciente)
    is_correct: true
  - text: g(x₁) < g(x₂)
    is_correct: false
  - text: g(x₁) = g(x₂)
    is_correct: false
  - text: Depende de si x es positivo o negativo
    is_correct: false
  explanation: La alternativa correcta es 'g(x₁) > g(x₂) (es estrictamente decreciente)'. Al ser impar con $a = -3 < 0$, entradas mayores producen salidas menores.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el exponente $n$ sea un entero impar positivo ($n = 2k+1$).'
- 'Paso 2: Evaluar el signo del coeficiente principal $a$.'
- 'Paso 3: Si $a > 0$, declarar que la función es estrictamente creciente en todo $\mathbb{R} = ]-\infty, +\infty[$.'
- 'Paso 4: Si $a < 0$, declarar que la función es estrictamente decreciente en todo $\mathbb{R} = ]-\infty, +\infty[$.'
errores_correccion: '- **Error común:** Dividir la función impar en dos tramos pensando que decrece antes de cero y crece después.

  - **Cómo corregirlo:** En una función impar con $a > 0$, para $x = -2 \to -8$, para $x = -1 \to -1$, para $x = 0 \to 0$, para $x = 1 \to 1$: **los valores SIEMPRE AUMENTAN en toda la recta real**.'
ejemplos:
- titulo: 'Ejemplo 1: Crecimiento en potencia cúbica'
  enunciado: 'La función $f(x) = 0{,}5x^3$ es:'
  alternativas:
  - Estrictamente creciente en todo R
  - Estrictamente decreciente en todo R
  - Creciente solo para x > 0
  - Decreciente solo para x < 0
  respuesta: Estrictamente creciente en todo R
  solucion_pasos:
  - 'Paso 1: Exponente 3 impar y $a = 0{,}5 > 0 \implies$ estrictamente creciente en $\mathbb{R}$.'
- titulo: 'Ejemplo 2: Decrecimiento en grado 9'
  enunciado: 'La función $g(x) = -4x^9$ es:'
  alternativas:
  - Estrictamente decreciente en todo R
  - Estrictamente creciente en todo R
  - Par
  - No monótona
  respuesta: Estrictamente decreciente en todo R
  solucion_pasos:
  - 'Paso 1: Exponente 9 impar y $a = -4 < 0 \implies$ estrictamente decreciente en $\mathbb{R}$.'
- titulo: 'Ejemplo 3: Comparación de orden'
  enunciado: 'Para $f(x) = 2x^3$, si $-4 < -1$, entonces:'
  alternativas:
  - f(-4) = -128 < f(-1) = -2 (crece en los negativos)
  - f(-4) > f(-1)
  - f(-4) = f(-1)
  - No se puede comparar
  respuesta: f(-4) = -128 < f(-1) = -2 (crece en los negativos)
  solucion_pasos:
  - 'Paso 1: $-128 < -2$, confirmando que la función sigue creciendo en los negativos.'
- titulo: 'Ejemplo 4: Inyectividad como consecuencia'
  enunciado: Debido a su monotonía uniforme, ¿cuántas soluciones reales tiene $x^5 = c$ para cualquier constante $c$?
  alternativas:
  - Exactamente 1 solución real
  - 2 soluciones reales
  - 5 soluciones reales
  - 0 soluciones si c < 0
  respuesta: Exactamente 1 solución real
  solucion_pasos:
  - 'Paso 1: Al ser estrictamente monótona sobreyectiva, tiene exactamente 1 solución real.'
errores_frecuentes:
- Dividir funciones impares en tramos de crecimiento y decrecimiento.
- Creer que f'(0) = 0 implica un cambio de sentido como en las parábolas.
- Olvidar que a < 0 hace decreciente a toda la función en R.
afirmaciones_verdaderas:
- Toda función potencia con exponente impar positivo conserva una monotonía global uniforme en todo ℝ.
- Si a > 0 la función es estrictamente creciente en todo ℝ, y si a < 0 es estrictamente decreciente en todo ℝ.
al_terminar_debes_poder: '**QUÉ:** Analizar y argumentar la monotonía global en funciones potencia con exponente impar positivo.


  **CÓMO:** Demostrando la no alternancia de signo en la derivada f''(x) = (2k+1)a x^(2k) para concluir crecimiento o decrecimiento uniforme en ℝ.


