semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_25
resumen_inicial: "Un número es divisible por 25 si sus dos últimas cifras son 00, 25, 50 o 75."
explicacion_simple: |
  Imagina que estás coleccionando monedas de 25 centavos. Si juntas varias monedas, ¿qué
  cantidades puedes formar al final de los centavos? Podrías tener 00, 25, 50 o 75
  centavos. ¡No hay otras opciones! Por eso, para saber si un número grande se puede
  dividir en partes iguales de 25, solo debes fijarte si sus dos últimas cifras terminan
  en uno de estos cuatro casos mágicos.
explicacion_formal: |
  Como $100=25\times4$, cualquier cantidad de centenas es divisible por 25. Descomponiendo
  $N=$ centenas $+$ últimas dos cifras, la parte de las centenas siempre es divisible por
  25. Por lo tanto, la divisibilidad de $N$ por 25 depende solo de sus dos últimas cifras,
  que deben ser $00$, $25$, $50$ o $75$ (los únicos múltiplos de 25 menores que 100).
definiciones_clave: |
  **Dos últimas cifras**: el número de dos dígitos formado por las decenas y unidades. Para
  el criterio del 25, debe ser $00$, $25$, $50$ o $75$.
propiedades_relaciones: |
  Todo número divisible por 25 también es divisible por 5, ya que $25=5\times5$. Este
  criterio es análogo al del 4 (usa dos cifras) pero compara contra cuatro terminaciones
  fijas en vez de comprobar divisibilidad directa.
ejemplo_guiado:
  enunciado: "Determina si 6.750 es divisible por 25."
  pasos:
    - "Las dos últimas cifras son $50$."
    - "$50$ está en la lista de terminaciones válidas (00, 25, 50, 75)."
    - "Conclusión: 6.750 es divisible por 25."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué basta con revisar las dos últimas cifras para el criterio del 25?"
    choices:
      - {text: "Porque 100 es divisible por 25", is_correct: true}
      - {text: "Porque 25 es divisible por 5", is_correct: false}
      - {text: "Porque 25 es un número redondo", is_correct: false}
      - {text: "No hay razón matemática, es una convención", is_correct: false}
    explanation: "La correcta es Porque 100 es divisible por 25: cualquier cantidad de centenas ya es múltiplo de 25."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 3.820 divisible por 25?"
    choices:
      - {text: "No, termina en 20", is_correct: true}
      - {text: "Sí, termina en cifra par", is_correct: false}
      - {text: "Sí, porque es múltiplo de 5", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, termina en 20: 20 no está en la lista de terminaciones válidas (00, 25, 50, 75)."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
- 'Paso 1: Identifica las dos últimas cifras del número (las unidades y las decenas).'
- 'Paso 2: Comprueba si esas dos cifras son 00, 25, 50 o 75. Si coinciden con alguna de estas combinaciones, el número es divisible por 25. En caso contrario, no lo es.'
errores_correccion: |
  Un error frecuente es analizar solo la última cifra en vez de las dos últimas. Otro
  error es confundir las decenas con las centenas al aislar las cifras que se deben
  comparar con la lista de terminaciones válidas.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Determina si el número $1,475$ es divisible por $25$.
  alternativas:
    - "Sí, termina en 75"
    - "No, termina en cifra inválida"
    - "No se puede determinar"
  respuesta: "Sí, termina en 75"
  solucion_pasos:
  - 'Paso a: Observamos las dos últimas cifras del número $1,475$, que son $75$.'
  - 'Paso b: Comparamos estas cifras con la lista de terminaciones permitidas ($00$, $25$, $50$, $75$). Al terminar en $75$, cumple el criterio.'
  - 'Paso c: Concluimos que $1,475$ es divisible por $25$.'
- titulo: Ejemplo 2
  enunciado: Verifica si el número $350$ es divisible por $25$.
  alternativas:
    - "Sí, termina en 50"
    - "No, termina en cifra inválida"
    - "No se puede determinar"
  respuesta: "Sí, termina en 50"
  solucion_pasos:
  - 'Paso a: Extraemos las dos últimas cifras de $350$, que corresponden a $50$.'
  - 'Paso b: Como $50$ es una de las terminaciones válidas para la divisibilidad por $25$, la división es exacta.'
  - 'Paso c: Concluimos que $350$ es divisible por $25$.'
- titulo: ¿Es el número $9,820$ divisible por $25$?
  respuesta: No
  solucion_pasos:
  - 'Identificamos las dos últimas cifras del número $9,820$, que son $20$.'
  - 'Comprobamos si $20$ es una de las terminaciones requeridas ($00, 25, 50, 75$). Como no lo es, determinamos que $9,820$ no es divisible por $25$.'
- titulo: ¿Es el número $10,200$ divisible por $25$?
  respuesta: Sí
  solucion_pasos:
  - 'Fijamos la atención en las dos últimas cifras de $10,200$, que son $00$.'
  - 'La regla indica que si un número termina en dos ceros, es divisible por $25$.'
  - 'Por ende, $10,200$ es divisible por $25$.'
errores_frecuentes:
- 'Creer que un número divisible por 5 ya es divisible por 25 sin comprobar las dos últimas cifras.'
- 'Analizar solo la última cifra en lugar de las dos últimas.'
- 'Creer que un número de menos de tres cifras no puede ser analizado con este método (se
    aplica directamente verificando si es 25, 50 o 75).'
- 'Olvidar que la terminación 00 es válida para la divisibilidad por 25.'
- 'Confundir las decenas con centenas al aislar las cifras de análisis.'
afirmaciones_verdaderas:
  - "Un número es divisible por 25 si sus dos últimas cifras son 00, 25, 50 o 75."
  - "El número 6.750 es divisible por 25."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 25 de cualquier número observando solo sus dos últimas
  cifras.
fuente: Teoría de Números
estado: publicado
