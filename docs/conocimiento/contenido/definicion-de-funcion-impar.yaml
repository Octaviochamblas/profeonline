semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_DEFINICION
resumen_inicial: Una función es impar si al evaluar un número negativo $-x$ devuelve
  el opuesto del resultado de $x$, cumpliendo $f(-x) = -f(x)$.
explicacion_simple: 'Una **función impar** cambia el signo de la salida cuando le
  cambias el signo a la entrada:

  - Si $f(3) = 8$, entonces $f(-3) = -8$.

  - Ejemplo principal: $f(x) = x^3$, donde $3^3 = 27$ y $(-3)^3 = -27$.

  - Su gráfica es **simétrica respecto al origen de coordenadas $(0, 0)$** (si la
  rotas $180^\circ$ alrededor del centro, queda igual).'
explicacion_formal: 'Una función real $f: D \to \mathbb{R}$ con dominio simétrico
  es **impar** si y solo si:


  $$f(-x) = -f(x) \quad \forall x \in D$$


  **Desglose de la fórmula:**

  - Invariancia anti-simétrica: invertir el signo del argumento equivale a sacar el
  signo negativo fuera de la función completa.'
definiciones_clave: '- **Función impar**: Función real que satisface la identidad
  $f(-x) = -f(x)$.'
propiedades_relaciones: '- **Paso por el origen (si $0 \in D$)**: Toda función impar
  bien definida en cero cumple $f(0) = 0$ obligatoriamente.'
ejemplo_guiado:
  enunciado: Demuestra algebraicamente que la función $f(x) = 5x^3 - 2x$ es impar.
  pasos:
  - 'Paso 1: Evaluar $f(-x)$: $f(-x) = 5(-x)^3 - 2(-x)$.Paso 2: Desarrollar las potencias
    impares: $(-x)^3 = -x^3$ y $-2(-x) = +2x$.Paso 3: Sustituir los signos: $f(-x)
    = -5x^3 + 2x$.Paso 4: Factorizar el signo negativo $-1$: $f(-x) = -(5x^3 - 2x)$.Paso
    5: Notar que $5x^3 - 2x = f(x) \implies f(-x) = -f(x)$, confirmando que la función
    es IMPAR.'
checkpoints:
- placement: after_explicacion_formal
  question: Al factorizar el signo negativo en $f(-x) = -5x^3 + 2x$, ¿cuál es la conclusión
    obtenida?
  choices:
  - text: $f(-x) = -(5x^3 - 2x) = -f(x)$, demostrando que es una función impar.
    is_correct: true
  - text: $f(-x) = f(x)$, demostrando que es par.
    is_correct: false
  - text: $f(-x) = 0$, demostrando que es nula.
    is_correct: false
  - text: No se puede factorizar.
    is_correct: false
  explanation: La alternativa correcta es '$f(-x) = -(5x^3 - 2x) = -f(x)$, demostrando
    que es una función impar.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una función impar está definida para $x = 0$, ¿cuál debe ser obligatoriamente
    el valor de $f(0)$?
  choices:
  - text: $f(0) = 0$ obligatoriamente.
    is_correct: true
  - text: $f(0) = 1$
    is_correct: false
  - text: $f(0) = -1$
    is_correct: false
  - text: Puede tomar cualquier valor real.
    is_correct: false
  explanation: La alternativa correcta es '$f(0) = 0$ obligatoriamente.'. (Puesto
    que $f(-0) = -f(0) \implies f(0) = -f(0) \implies 2f(0) = 0$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar $f(-x)$ sustituyendo $x$ por $(-x)$.'
- 'Paso 2: Desarrollar los signos utilizando potencias impares.'
- 'Paso 3: Factorizar un signo menos de toda la expresión.'
- 'Paso 4: Si el paréntesis resultante coincide con la función original, la función
  es impar.'
errores_correccion: '- **Error común:** Creer que toda función que tiene un exponente
  impar es impar (ejemplo: $f(x) = x^3 + 5$).

  - **Cómo corregirlo:** La constante $+5$ rompe la imparidad: $f(-x) = (-x)^3 + 5
  = -x^3 + 5 \neq -(x^3 + 5)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
