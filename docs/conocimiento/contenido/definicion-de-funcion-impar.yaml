semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_DEFINICION
resumen_inicial: Una función es impar si al evaluar en $-x$ se obtiene el opuesto del valor original, satisfaciendo $f(-x) = -f(x)$.
explicacion_simple: |
  Una **función impar** es aquella que cambia de signo cuando le cambias el signo a la entrada:

  - Si ingresas $3$ y obtienes $8$ ($f(3) = 8$).
  - Al ingresar $-3$, obtienes el signo opuesto $-8$ ($f(-3) = -8$).
  - **Simetría visual**: Su gráfica es simétrica respecto al **origen de coordenadas $(0,0)$** (si la giras $180^\circ$ sobre el centro, queda idéntica).
  - Ejemplo clásico: $f(x) = x^3$ o $f(x) = x$.
explicacion_formal: |
  Sea $f: D \subseteq \mathbb{R} \to \mathbb{R}$ una función cuyo dominio es simétrico respecto al origen ($x \in D \implies -x \in D$). $f$ es una **función impar** si y solo si satisface la identidad algebraica:

  $$f(-x) = -f(x) \quad \forall x \in D$$

  **Propiedad gráfica:**
  La gráfica $G_f$ es invariante bajo una rotación de $180^\circ$ con centro en el origen $(0,0)$, lo que implica que $(a, b) \in G_f \iff (-a, -b) \in G_f$.
definiciones_clave: |
  - **Función impar**: Relación funcional que satisface la propiedad antisimétrica $f(-x) = -f(x)$ para todo elemento del dominio.
propiedades_relaciones: |
  - **Paso por el origen**: Si $x = 0$ pertenece al dominio de una función impar continua, entonces $f(0) = 0$ de forma obligatoria.
ejemplo_guiado:
  enunciado: 'Demuestra algebraicamente si la función $f(x) = 4x^3 - 5x$ es impar.'
  pasos:
    - 'Paso 1: Evaluar la función en el valor opuesto $-x$: $f(-x) = 4(-x)^3 - 5(-x)$.'
    - 'Paso 2: Desarrollar las potencias y signos: $4(-x^3) + 5x = -4x^3 + 5x$.'
    - 'Paso 3: Factorizar el signo menos $-1$: $-(4x^3 - 5x)$.'
    - 'Paso 4: Comparar con la función original: como $- (4x^3 - 5x) = -f(x)$, se concluye que $f(x)$ es impar.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la relación algebraica fundamental que define a una función impar $f(x)$?'
    choices:
      - {text: '$f(-x) = -f(x)$', is_correct: true}
      - {text: '$f(-x) = f(x)$', is_correct: false}
      - {text: '$f(x) = 0$', is_correct: false}
      - {text: '$f(-x) = 1/f(x)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(-x) = -f(x)$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué tipo de simetría geométrica presenta la gráfica de cualquier función impar?'
    choices:
      - {text: 'Simetría respecto al origen de coordenadas $(0,0)$.', is_correct: true}
      - {text: 'Simetría respecto al eje vertical Y.', is_correct: false}
      - {text: 'Simetría respecto al eje horizontal X.', is_correct: false}
      - {text: 'Simetría respecto a la recta $y = 5$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Simetría respecto al origen de coordenadas $(0,0)$.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reemplazar cada variable $x$ de la fórmula por $(-x)$.'
  - 'Paso 2: Desarrollar potencias y simplificar signos.'
  - 'Paso 3: Factorizar un signo menos de toda la expresión.'
  - 'Paso 4: Si la expresión resultante equivale a $-f(x)$, declarar la función como impar.'
errores_correccion: |
  - **Error común:** Confundir la función impar con una función decreciente o pensar que "impar" significa que evalúa números impares.
  - **Cómo corregirlo:** Impar se refiere a la **PROPIEDAD DE ALGEBRA DE SIGNOS $f(-x) = -f(x)$**, no a la paridad de los números enteros.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función impar es aquella cuyos valores de entrada son exclusivamente números impares del conjunto entero.'
  - 'La gráfica de una función impar es simétrica respecto al eje vertical de las ordenadas.'
  - 'Evaluar una función impar en $x = -2$ produce el mismo resultado escalar exacto que evaluarla en $x = 2$.'
  - 'Toda función polinómica de grado 3 es impar sin importar si tiene término independiente constante.'
  - 'La función cuadrática básica $f(x) = x^2$ es un ejemplo característico de función impar.'
afirmaciones_verdaderas:
  - 'Una función $f$ es impar si y solo si satisface la identidad $f(-x) = -f(x)$ para todo elemento $x$ de su dominio.'
  - 'La gráfica de una función impar posee simetría puntual respecto al origen de coordenadas cartesiano $(0,0)$.'
al_terminar_debes_poder: |
  QUÉ: Definir y verificar analítica y gráficamente la propiedad de imparidad en funciones.
  CÓMO: Comprobar la identidad $f(-x) = -f(x)$ y verificar la simetría puntual respecto al origen $(0,0)$.
