semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_DEFINICION
resumen_inicial: Una función es impar si su dominio es simétrico respecto al origen y satisface $f(-x) = -f(x)$ para todo $x$, lo que equivale geométricamente a una simetría central de $180^\circ$ respecto al origen $(0, 0)$.
explicacion_simple: '![Una función es impar si su dominio es simétrico respecto al origen y satisface $f(-x) = -f(x)$ para todo $x$, lo que equivale geométricamente a una simetría central de $180^\circ$ respecto al origen $(0, 0)$](/static/img/nodos/definicion-de-funcion-impar-intro.svg)



  Una función es **impar** cuando cambiar el signo de la entrada **hace cambiar exactamente el signo de la salida**:

  $$f(-x) = -f(x)$$


  Por ejemplo, para $f(x) = x^3$:

  - Si evalúas en $x = 2$, obtienes $2^3 = 8$.

  - Si evalúas en $x = -2$, obtienes $(-2)^3 = -8$.


  ¡El resultado es el opuesto exacto ($-8$ en vez de $8$)!

  Además, si una función impar está definida en $x = 0$, **pasa obligatoriamente por el origen $(0, 0)$**.'
explicacion_formal: 'Sea $f: D \to \mathbb{R}$ una función con dominio simétrico ($x \in D \implies -x \in D$). Se define que $f$ es una **función impar** si y solo si:

  $$f(-x) = -f(x), \quad \forall x \in D$$


  **Propiedades analíticas:**

  - **Cero en el origen**: Si $0 \in D$, entonces $f(-0) = -f(0) \implies f(0) = -f(0) \implies 2f(0) = 0 \implies f(0) = 0$.

  - **Polinomios impares**: Polinomios compuestos exclusivamente por potencias de exponente impar ($x^1, x^3, x^5, \dots$) sin término constante son funciones impares.

  - **Suma y producto**: La suma de impares es impar; el producto de dos funciones impares es una función **par** ($- \times - = +$).'
definiciones_clave: '- **Función impar**: Aplicación que satisface $f(-x) = -f(x)$ en todo su dominio simétrico.

  - **Simetría central**: Invarianza bajo una rotación puntual de media vuelta ($180^\circ$) en torno al origen.'
propiedades_relaciones: '- **Pares simétricos opuestos**: Si $(a, b) \in \text{Graf}(f)$, entonces $(-a, -b) \in \text{Graf}(f)$.

  - **Integral simétrica**: La integral de una función impar continua en $[-a, a]$ es siempre idéntica a cero.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una función es impar si su dominio es simétrico respecto al origen y satisface $f(-x) = -f(x)$ para todo $x$, lo que equivale geométricamente a una simetría central de $180^\circ$ respecto al origen $(0, 0)$](/static/img/nodos/definicion-de-funcion-impar-ejemplos.svg)



    Demuestra algebraicamente si la función $f(x) = 2x^5 - 7x^3 + 4x$ es impar en $\mathbb{R}$.'
  pasos:
  - 'Paso 1: Verificar el dominio: $\text{Dom}(f) = \mathbb{R}$, simétrico respecto al origen.'
  - 'Paso 2: Evaluar la función en $-x$: $f(-x) = 2(-x)^5 - 7(-x)^3 + 4(-x)$.'
  - 'Paso 3: Aplicar potencias impares: $(-x)^5 = -x^5$, $(-x)^3 = -x^3$, $(-x) = -x$.'
  - 'Paso 4: Simplificar: $f(-x) = -2x^5 + 7x^3 - 4x$.'
  - 'Paso 5: Factorizar el signo negativo: $f(-x) = -(2x^5 - 7x^3 + 4x) = -f(x)$.'
  - 'Paso 6: Concluir que $f$ es formalmente una función impar.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición algebraica fundamental de una función impar?
  choices:
  - text: f(-x) = -f(x) para todo x en el dominio.
    is_correct: true
  - text: f(-x) = f(x).
    is_correct: false
  - text: f(x) = -x.
    is_correct: false
  - text: f(0) = 1.
    is_correct: false
  explanation: La alternativa correcta es 'f(-x) = -f(x) para todo x en el dominio.'. Extrae el signo negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $f$ es una función impar definida en los reales y $f(6) = 42$, ¿cuál es el valor de $f(-6)$ y de $f(0)$?
  choices:
  - text: f(-6) = -42 y f(0) = 0
    is_correct: true
  - text: f(-6) = 42 y f(0) = 0
    is_correct: false
  - text: f(-6) = -42 y f(0) = 6
    is_correct: false
  - text: f(-6) = 0 y f(0) = 42
    is_correct: false
  explanation: La alternativa correcta es 'f(-6) = -42 y f(0) = 0'. Por definición $f(-6) = -f(6) = -42$ y obligatoriamente $f(0) = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar la simetría del dominio respecto al cero.'
- 'Paso 2: Evaluar la función en $(-x)$ colocando paréntesis en cada variable.'
- 'Paso 3: Desarrollar los signos algebraicos.'
- 'Paso 4: Factorizar un signo negativo global y comparar con la expresión $-f(x)$.'
errores_correccion: '- **Error común:** Pensar que $f(x) = 3x + 2$ es impar porque $3x$ es de grado 1.

  - **Cómo corregirlo:** Al evaluar $f(-x) = -3x + 2$, esto **no es igual a $-(3x + 2) = -3x - 2$** debido al $+2$. Para ser impar, **no puede tener término constante distinto de cero**.'
ejemplos:
- titulo: 'Ejemplo 1: Función lineal pura'
  enunciado: ¿Es impar la función $f(x) = -6x$?
  alternativas:
  - Sí, porque f(-x) = -6(-x) = 6x = -(-6x) = -f(x)
  - No, porque la pendiente es negativa
  - Es par
  - No tiene paridad
  respuesta: Sí, porque f(-x) = -6(-x) = 6x = -(-6x) = -f(x)
  solucion_pasos:
  - 'Paso 1: $f(-x) = 6x = -(-6x) = -f(x)$, es impar.'
- titulo: 'Ejemplo 2: Hipérbola'
  enunciado: Para $g(x) = \frac{5}{x}$ con $x \neq 0$, ¿es impar?
  alternativas:
  - Sí, porque 5/(-x) = -(5/x)
  - No, porque es una división
  - Es par
  - Solo para x > 0
  respuesta: Sí, porque 5/(-x) = -(5/x)
  solucion_pasos:
  - 'Paso 1: $g(-x) = \frac{5}{-x} = -\frac{5}{x} = -g(x)$.'
- titulo: 'Ejemplo 3: Polinomio mixto'
  enunciado: ¿Es impar $h(x) = x^3 - 4$?
  alternativas:
  - No, porque h(-x) = -x^3 - 4 != -(x^3 - 4)
  - Sí, porque tiene grado 3
  - Es par
  - Solo en x = 0
  respuesta: No, porque h(-x) = -x^3 - 4 != -(x^3 - 4)
  solucion_pasos:
  - 'Paso 1: El término constante $-4$ rompe la imparidad (además $h(0) = -4 \neq 0$).'
- titulo: 'Ejemplo 4: Producto de dos funciones impares'
  enunciado: Si $f$ y $g$ son impares, ¿cómo es su producto $P(x) = f(x) \cdot g(x)$?
  alternativas:
  - Es una función par
  - Es una función impar
  - No tiene paridad
  - Es la función nula
  respuesta: Es una función par
  solucion_pasos:
  - 'Paso 1: $P(-x) = f(-x)g(-x) = (-f(x))(-g(x)) = f(x)g(x) = P(x)$ (par).'
errores_frecuentes:
- Creer que funciones afines con intercepto no nulo son impares.
- Olvidar que f(0) debe ser 0 en toda función impar definida en el origen.
- Asumir que el producto de impares sigue siendo impar.
afirmaciones_verdaderas:
- Una función es impar si f(-x) = -f(x) para todo x en su dominio.
- Toda función impar definida en x = 0 satisface f(0) = 0.
al_terminar_debes_poder: '**QUÉ:** Definir, demostrar y evaluar funciones impares.


  **CÓMO:** Verificando la condición algebraica f(-x) = -f(x) y constatando que f(0) = 0 cuando 0 pertenece al dominio.


