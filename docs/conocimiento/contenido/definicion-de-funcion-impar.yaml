semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_IMPAR_DEFINICION
resumen_inicial: 'Definición de función impar: conceptos, representación y propiedades
  en Simetrías y funciones especiales.'
explicacion_simple: 'En otras funciones, evaluar en el opuesto de un número produce
  exactamente el opuesto del resultado original: ese comportamiento define a las funciones
  impares.'
explicacion_formal: '### Definición formal


  Una función $f$ con dominio simétrico respecto al origen es impar si $f(-x) = -f(x)$
  para todo $x \in \text{Dom}(f)$. Equivalentemente, $f(-x) + f(x) = 0$ para todo
  $x$.


  ### Desarrollo didáctico


  El procedimiento de verificación es análogo al de las funciones pares: sustituir
  $-x$, simplificar, y esta vez comparar con $-f(x)$ (la fórmula original con signo
  cambiado).


  Si $f(x)=x^3$: $f(-x)=(-x)^3=-x^3=-f(x)$. Se confirma que es impar. En cambio, para
  $g(x)=x^2+1$: $g(-x)=x^2+1=g(x) \neq -g(x)$, por lo que no es impar.'
definiciones_clave: '- **Definición de función impar**: Elemento central en el estudio
  de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a definición de función impar.'
