semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_AREAS
resumen_inicial: 'Resolución de problemas de áreas geométricas usando ecuaciones cuadráticas:
  concepto, discriminante, soluciones y modelamiento en Modelamiento y resolución
  de problemas.'
explicacion_simple: Cada vez que el área de un rectángulo, un cuadrado o una figura
  compuesta depende de una dimensión desconocida elevada al cuadrado (o de un producto
  de dos expresiones con esa incógnita), aparece naturalmente una ecuación cuadrática.
explicacion_formal: '### Definición formal


  Dada una figura cuya área $A$ depende de una dimensión desconocida $x$ (por ejemplo,
  un rectángulo de lados $x$ y $x+k$), se plantea la ecuación $A(x)=A_0$, donde $A_0$
  es el área conocida, obteniendo una ecuación de segundo grado en $x$.


  ### Desarrollo didáctico


  Es fundamental primero identificar cómo se expresan las dimensiones de la figura
  en términos de la incógnita, y luego aplicar la fórmula de área correspondiente
  antes de igualar al valor conocido.


  Un rectángulo tiene un largo que es el doble de su ancho $x$, y su área es $50 \text{
  m}^2$. Se plantea $x(2x)=50$, es decir $2x^2=50$, cuya solución positiva es $x=5$.'
definiciones_clave: '- **Resolución de problemas de áreas geométricas usando ecuaciones
  cuadráticas**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de problemas de áreas geométricas usando ecuaciones cuadráticas.'
