- placement: after_ejemplo_guiado
  question: Un jardín cuadrado aumenta su lado en 3 m y su nueva área es 64 m². ¿Cuánto medía el lado original?
  choices:
  - text: 5 m
    is_correct: true
  - text: 8 m
    is_correct: false
  - text: 11 m
    is_correct: false
  - text: 55 m
    is_correct: false
  explanation: La alternativa correcta es '5 m'. $(x + 3)^2 = 64 \implies x + 3 = 8 \implies x = 5\text{ m}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asignar la incógnita $x$ a la dimensión desconocida.'
- 'Paso 2: Escribir la fórmula de área correspondiente en términos de $x$.'
- 'Paso 3: Plantear e igualar la ecuación al valor del área dada.'
- 'Paso 4: Resolver la ecuación cuadrática obteniendo las soluciones algebraicas.'
- 'Paso 5: Descartar las soluciones negativas o no admisibles y responder con la unidad de medida.'
errores_correccion: '- **Error común:** Dar la raíz negativa como solución de una medida geométrica.

  - **Cómo corregirlo:** En geometría, **las longitudes son siempre positivas ($x > 0$)**, por lo que la raíz negativa se descarta explícitamente.'
ejemplos:
- titulo: 'Ejemplo 1: Rectángulo con área 48 m²'
  enunciado: El largo de un rectángulo supera en 2 m a su ancho. Si el área es 48 m², ¿cuánto mide el ancho?
  alternativas:
  - 6 m
  - -8 m
  - 8 m
  - 4 m
  respuesta: 6 m
  solucion_pasos:
  - 'Paso 1: $x(x + 2) = 48 \implies x^2 + 2x - 48 = (x + 8)(x - 6) = 0 \implies x = 6\text{ m}$.'
- titulo: 'Ejemplo 2: Triángulo rectángulo e hipotenusa'
  enunciado: En un triángulo rectángulo, los catetos miden $x$ y $x + 1$, y la hipotenusa mide 5. ¿Cuánto vale x?
  alternativas:
  - '3'
  - '4'
  - '-4'
  - 3 y -4
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $x^2 + (x + 1)^2 = 25 \implies 2x^2 + 2x - 24 = 0 \implies x^2 + x - 12 = (x + 4)(x - 3) = 0 \implies x = 3$.'
- titulo: 'Ejemplo 3: Cuadrado modificado'
  enunciado: Si un lado de un cuadrado se reduce en 2 m y el contiguo se aumenta en 2 m, el área resultante es 45 m². ¿Cuánto medía el lado original?
  alternativas:
  - 7 m
  - 9 m
  - 5 m
  - 49 m
  respuesta: 7 m
  solucion_pasos:
  - 'Paso 1: $(x - 2)(x + 2) = 45 \implies x^2 - 4 = 45 \implies x^2 = 49 \implies x = 7\text{ m}$.'
- titulo: 'Ejemplo 4: Terreno con perímetro y área'
  enunciado: Un terreno rectangular tiene semiperímetro 15 m y área 54 m². ¿Cuáles son sus dimensiones?
  alternativas:
  - 6 m y 9 m
  - 5 m y 10 m
  - 3 m y 18 m
  - 4 m y 11 m
  respuesta: 6 m y 9 m
  solucion_pasos:
  - 'Paso 1: $x(15 - x) = 54 \implies x^2 - 15x + 54 = (x - 6)(x - 9) = 0 \implies 6\text{ m y } 9\text{ m}$.'
errores_frecuentes:
- Aceptar raíces negativas para longitudes.
- Olvidar multiplicar el área por 2 al despejar triángulos.
- Confundir perímetro con área al formular la ecuación.
afirmaciones_verdaderas:
- Las dimensiones geométricas físicas de longitud y área deben ser estrictamente positivas.
- El modelamiento del área rectangular x(x + k) = A genera una ecuación cuadrática con exactamente una raíz positiva válida.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas de áreas geométricas aplicando ecuaciones de segundo grado.


  **CÓMO:** Formulando ecuaciones de área A(x) = K, resolviendo algebraicamente y filtrando las soluciones x > 0.


