semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_AREAS
resumen_inicial: La resolución de problemas de áreas geométricas usando ecuaciones cuadráticas modela el área bidimensional $\mathcal{A} = b \cdot h$ en función de una variable lineal, resolviendo la ecuación cuadrática resultante y seleccionando exclusivamente las soluciones reales positivas $x > 0$.
explicacion_simple: "![La resolución de problemas de áreas geométricas usando ecuaciones cuadráticas modela el área bidimensional $\\mathcal{A} = b \\cdot h$ en función de una variable lineal, resolviendo la ecuación cuadrática resultante y seleccionando exclusivamente las soluciones reales positivas $x > 0$](/static/img/nodos/resolucion-de-problemas-de-areas-geometricas-usando-ecuaciones-cuadraticas-intro.svg)\n\n\nEn geometría, el área casi siempre genera ecuaciones cuadráticas porque multiplicas dos longitudes (largo $\\times$ ancho):\n\n**Pasos para resolver problemas de áreas:**\n1. **Dibuja la figura y anota sus lados:** Ancho $= x$, Largo $= x + 5$.\n2. **Aplica la fórmula del área:** $\\text{Área} = x(x + 5) = 84$.\n3. **Resuelve la ecuación cuadrática:**\n   $$x^2 + 5x - 84 = 0 \\implies (x + 12)(x - 7) = 0 \\implies x_1 = 7, \\; x_2 = -12$$\n4. **¡Filtro de la realidad!** Una distancia física nunca puede medir $-12$ metros, por lo que **descartas $-12$ y la respuesta correcta es\
  \ $x = 7$ metros**.\n5. Las dimensiones son: Ancho $= 7\\text{ m}$ y Largo $= 12\\text{ m}$."
explicacion_formal: 'Sea un dominio bidimensional $\Omega \subset \mathbb{R}^2$ con medida de Lebesgue (área) $\mathcal{A}(\Omega) = K > 0$. Las relaciones geométricas fundamentales definen funcionales cuadráticos:


  1. **Rectángulo**: $\mathcal{A}(x) = x(x + k) = K \implies x^2 + kx - K = 0$.

  2. **Triángulo**: $\mathcal{A}(x) = \frac{x(x + k)}{2} = K \implies x^2 + kx - 2K = 0$.

  3. **Marco / Corona rectangular**: $\mathcal{A}_{\text{marco}} = (A + 2x)(B + 2x) - AB = K \implies 4x^2 + 2(A + B)x - K = 0$.


  **Restricción métrica euclidiana**:

  $$\mathcal{S}_{\text{geom}} = \{x \in \mathcal{S} \mid x > 0 \land \forall L_i(x) > 0\}$$'
definiciones_clave: '- **Restricción métrica**: Condición $L(x) > 0$ impuesta por la naturaleza no negativa de las distancias en el espacio euclidiano.

  - **Problema del marco uniforme**: Problema geométrico clásico que modela una franja perimetral de ancho constante $x$.'
propiedades_relaciones: '- **Descarte unívoco**: En ecuaciones de la forma $x^2 + kx - K = 0$ con $K > 0$, el producto de raíces es $-K < 0$, garantizando exactamente **una raíz positiva y una raíz negativa**.

  - **Teorema de Pitágoras**: Genera ecuaciones cuadráticas de lados en triángulos rectángulos: $a^2 + b^2 = c^2$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de problemas de áreas geométricas usando ecuaciones cuadráticas modela el área bidimensional $\mathcal{A} = b \cdot h$ en función de una variable lineal, resolviendo la ecuación cuadrática resultante y seleccionando exclusivamente las soluciones reales positivas $x > 0$](/static/img/nodos/resolucion-de-problemas-de-areas-geometricas-usando-ecuaciones-cuadraticas-ejemplos.svg)



    Una fotografía de $10\text{ cm} \times 15\text{ cm}$ se coloca en un marco de ancho uniforme $x$. Si el área total combinada de la foto y el marco es de $204\text{ cm}^2$, calcula el ancho del marco $x$.'
  pasos:
  - 'Paso 1: Dimensiones totales incluyendo el marco: Largo $= 15 + 2x$, Ancho $= 10 + 2x$.'
  - 'Paso 2: Plantear la ecuación del área total: $(15 + 2x)(10 + 2x) = 204$.'
  - 'Paso 3: Desarrollar el producto: $150 + 30x + 20x + 4x^2 = 204 \implies 4x^2 + 50x + 150 = 204$.'
  - 'Paso 4: Igualar a cero y simplificar dividiendo por 2: $4x^2 + 50x - 54 = 0 \implies 2x^2 + 25x - 27 = 0$.'
  - 'Paso 5: Factorizar el trinomio: $(2x + 27)(x - 1) = 0 \implies x_1 = 1, \; x_2 = -\frac{27}{2}$.'
  - 'Paso 6: Aplicar el filtro físico ($x > 0$): Se descarta $-13,5$ y se concluye que el ancho del marco es $x = 1\text{ cm}$.'
