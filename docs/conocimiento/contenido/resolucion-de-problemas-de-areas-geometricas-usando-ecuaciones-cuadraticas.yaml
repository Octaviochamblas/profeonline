semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_AREAS
resumen_inicial: La resolución de problemas de áreas geométricas modela superficies mediante $A = \text{base} \cdot \text{altura}$, generando ecuaciones cuadráticas reales.
explicacion_simple: |
  Los problemas de **áreas geométricas** en figuras planas (rectángulos, triángulos, cuadrados) frecuentemente llevan a ecuaciones de segundo grado:

  - **Área de un rectángulo**: $\text{Área} = \text{base} \cdot \text{altura}$.
  - **Área de un triángulo**: $\text{Área} = \frac{\text{base} \cdot \text{altura}}{2}$.
  - **Ejemplo**: Si la base de un rectángulo mide $x+2$ y su altura mide $x$, y el área es de $24 \text{ cm}^2$:
    $$x(x + 2) = 24 \implies x^2 + 2x - 24 = 0$$
    - Factorizando: $(x + 6)(x - 4) = 0 \implies x_1 = -6 \quad \text{y} \quad x_2 = 4$.
    - Como las longitudes **NO PUEDEN SER NEGATIVAS**, descartas $x = -6$.
    - La respuesta es que el ancho mide $4 \text{ cm}$ y el largo mide $6 \text{ cm}$.
explicacion_formal: |
  Sea una región plana poligonal cuyo área $A \in \mathbb{R}^+$ viene expresada por el producto de dos funciones de dimensión lineal $f(x)$ y $g(x)$. La **ecuación de área cuadrática** se define analíticamente por:

  $$f(x) \cdot g(x) = A \iff ax^2 + bx + c = 0$$

  **Restricciones geométricas de validez (Dominio Físico):**
  Para que una solución matemática $x \in \mathbb{R}$ constituya una solución geométrica válida, debe satisfacer la condición de positividad estricta de todas las dimensiones involucradas:

  $$\begin{cases} f(x) > 0 \\ g(x) > 0 \end{cases}$$
definiciones_clave: |
  - **Modelamiento de áreas geométricas**: Aplicación de ecuaciones cuadráticas para resolver magnitudes de longitud o superficie en figuras geométricas planas.
propiedades_relaciones: |
  - **Dominio positivo de dimensiones**: En geometría, longitudes o distancias negativas ($x < 0$) carecen de sentido físico, exigiendo descartar la raíz matemática negativa.
ejemplo_guiado:
  enunciado: 'Un terreno rectangular tiene un área de $180 \text{ m}^2$. Si el largo mide 3 metros más que el ancho, calcula las dimensiones del terreno.'
  pasos:
    - 'Paso 1: Definir la variable: sea $x$ el ancho ($x > 0$), por lo que el largo es $x + 3$.'
    - 'Paso 2: Formular la ecuación del área: $x(x + 3) = 180 \implies x^2 + 3x - 180 = 0$.'
    - 'Paso 3: Factorizar la ecuación: $(x + 15)(x - 12) = 0 \implies x_1 = -15$ y $x_2 = 12$.'
    - 'Paso 4: Descartar $x = -15$ por ser negativo. Las dimensiones son: ancho $= 12 \text{ m}$ y largo $= 15 \text{ m}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la solución negativa $x = -8$ debe descartarse al resolver un problema de áreas geométricas?'
    choices:
      - {text: 'Porque las longitudes de los lados geométricos deben ser estrictamente positivas ($x > 0$).', is_correct: true}
      - {text: 'Porque las ecuaciones de segundo grado solo aceptan números pares.', is_correct: false}
      - {text: 'Porque el área de la figura debe ser igual a cero.', is_correct: false}
      - {text: 'Porque el discriminante de la ecuación es negativo.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque las longitudes de los lados geométricos deben ser estrictamente positivas ($x > 0$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Un triángulo tiene una base que mide $x+4$ cm y una altura que mide $x$ cm. Si su área es de $16 \text{ cm}^2$, ¿cuál es la ecuación cuadrática reducida que la modela?'
    choices:
      - {text: '$x^2 + 4x - 32 = 0$', is_correct: true}
      - {text: '$x^2 + 4x - 16 = 0$', is_correct: false}
      - {text: '$2x^2 + 8x - 16 = 0$', is_correct: false}
      - {text: '$x^2 - 4x - 32 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 + 4x - 32 = 0$''. Se plantea $\frac{x(x+4)}{2} = 16 \implies x^2 + 4x = 32 \implies x^2 + 4x - 32 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Asignar la variable $x$ a una de las dimensiones de la figura geométrica.'
  - 'Paso 2: Expresar la otra dimensión en términos de $x$ y plantear la fórmula del área correspondiente.'
  - 'Paso 3: Desarrollar e igualar a cero para formar la ecuación cuadrática $ax^2 + bx + c = 0$.'
  - 'Paso 4: Resolver la ecuación, descartar las raíces negativas o incoherentes y verificar las dimensiones finales.'
errores_correccion: |
  - **Error común:** Olvidar dividir entre 2 al calcular el área de un triángulo ($\text{Área} = \frac{b \cdot h}{2}$).
  - **Cómo corregirlo:** La fórmula del área del triángulo **SIEMPRE LLEVA DIVISIÓN POR 2**; multiplica por 2 el área antes de resolver la cuadrática.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Terreno rectangular.
    alternativas:
      - 'Ancho = 5 m, Largo = 12 m'
      - 'Ancho = 6 m, Largo = 10 m'
      - 'Ancho = 4 m, Largo = 15 m'
    respuesta: 'Ancho = 5 m, Largo = 12 m'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Cuadrado modificado.
    alternativas:
      - 'Lado original = 8 cm'
      - 'Lado original = 10 cm'
      - 'Lado original = 6 cm'
    respuesta: 'Lado original = 8 cm'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La falta de división por 2 en la fórmula del área del triángulo al construir la ecuación cuadrática.'
  - 'Aceptar soluciones numéricas negativas como medidas válidas para los lados de una figura geométrica.'
  - 'La equiparación de unidades cuadradas del área ($m^2$) con elevar al cuadrado la constante total de la ecuación.'
  - 'La falta de adición o sustracción de la constante de margen al calcular las dimensiones finales del problema.'
  - 'La creencia de que si la ecuación cuadrática tiene dos soluciones reales positivas, ambas satisfacen el contexto físico sin verificar.'
afirmaciones_verdaderas:
  - 'La resolución de problemas de áreas mediante ecuaciones cuadráticas exige descartar soluciones $x \le 0$ que violen el principio de positividad de las dimensiones.'
  - 'El área de un triángulo de base $f(x)$ y altura $g(x)$ genera la ecuación cuadrática $f(x) \cdot g(x) = 2A$.'
al_terminar_debes_poder: |
  QUÉ: Modelar y resolver problemas de áreas geométricas mediante ecuaciones de segundo grado.
  CÓMO: Plantear la fórmula del área correspondiente, resolver $ax^2 + bx + c = 0$, descartar raíces incoherentes y dar las dimensiones geométricas.
