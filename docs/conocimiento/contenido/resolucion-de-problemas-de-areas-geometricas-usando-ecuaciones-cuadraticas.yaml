procedimiento:
- 'Paso 1: Expresa las dimensiones de la figura en función de una incógnita $x$.'
- 'Paso 2: Aplica la fórmula de área correspondiente a la figura.'
- 'Paso 3: Iguala esa expresión al área conocida y normaliza la ecuación resultante.'
- 'Paso 4: Resuelve la ecuación y selecciona la solución válida según el contexto
  geométrico.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en resolución de problemas de áreas geométricas usando ecuaciones cuadráticas.
ejemplos:
- titulo: Área de un rectángulo con dimensiones relacionadas
  enunciado: El largo de un rectángulo es 4 m más que su ancho $x$, y su área es $32
    \text{ m}^2$. Plantea y resuelve la ecuación.
  solucion_pasos:
  - $x(x+4)=32$, equivalente a $x^2+4x-32=0$.
  - Resolviendo, $x=4$ o $x=-8$; se descarta la solución negativa.
  - El ancho es $4$ m y el largo es $8$ m.
- titulo: Área de un cuadrado aumentado
  enunciado: El lado de un cuadrado se aumenta en 3 cm, y la nueva área es $64 \text{
    cm}^2$. Encuentra el lado original.
  solucion_pasos:
  - $(x+3)^2=64$.
  - $x+3=\pm8$, dando $x=5$ o $x=-11$; se descarta la solución negativa.
  - El lado original es $5$ cm.
- titulo: ¿En problemas de áreas, ambas soluciones de la ecuación cuadrática son siempre
    válidas?
  enunciado: ¿En problemas de áreas, ambas soluciones de la ecuación cuadrática son
    siempre válidas?
  respuesta: 'No'
  solucion_pasos:
  - Las dimensiones de una figura deben ser positivas, por lo que las soluciones negativas
    se descartan.
- titulo: ¿Es necesario expresar las dimensiones de la figura en función de una sola
    incógnita?
  enunciado: ¿Es necesario expresar las dimensiones de la figura en función de una
    sola incógnita?
  respuesta: Sí
  solucion_pasos:
  - Solo así el área queda expresada como una ecuación en una única variable, resoluble
    mediante los métodos habituales.
errores_frecuentes:
- Aceptar como válida una solución negativa para una longitud o dimensión.
- Aplicar incorrectamente la fórmula de área de la figura correspondiente.
- Confundir el planteamiento del área con el del perímetro de la figura.
- No verificar la solución sustituyéndola de nuevo en el problema original.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
