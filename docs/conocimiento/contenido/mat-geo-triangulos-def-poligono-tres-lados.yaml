semantic_id: MAT.GEO.TRIANGULOS_DEF.POLIGONO_TRES_LADOS
resumen_inicial: El triángulo es la figura geométrica plana más simple y rígida formada
  por tres segmentos de recta interconectados; constituye la estructura base de puentes
  y grúas.
explicacion_simple: Imagina tres barras de madera unidas por los extremos. Forman
  una figura cerrada de 3 lados que no se deforma al empujarla. Esa rigidez indestructible
  es la propiedad principal del triángulo.
explicacion_formal: Un **triángulo** es un polígono de tres lados definido como la
  unión de los tres segmentos $\overline{AB}, \overline{BC}, \overline{CA}$ determinados
  por tres puntos no colineales $A, B, C$ en el plano.
definiciones_clave: '- **Polígono rígido**: Figura plana de tres lados indeformable
  por fuerzas aplicadas en sus vértices.

  - **Puntos no colineales**: Puntos que no yacen sobre una misma recta lineal.'
propiedades_relaciones: '- **Rigidez estructural**: Es el único polígono cuyo número
  de lados ($n=3$) impide deformaciones angulares sin cambiar la longitud de sus lados.

  - **Mínimo polígono**: Es el polígono convexo con la menor cantidad posible de lados
  y vértices.'
ejemplo_guiado:
  enunciado: Una estructura metálica triangular tiene lados que miden $a = 10\text{
    m}$, $b = 15\text{ m}$ y $c = 20\text{ m}$. Verifica si forma un polígono cerrado
    de 3 lados y calcula su perímetro.
  pasos:
  - 'Paso 1: Identificar que los 3 segmentos interconectan sus vértices formando un
    polígono rígido.'
  - 'Paso 2: Aplicar la fórmula del perímetro: $P = a + b + c = 10 + 15 + 20$.'
  - 'Paso 3: Concluir que el perímetro total de la estructura es $P = 45\text{ m}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el triángulo es considerado la estructura geométrica más rígida?
  choices:
  - text: Porque no puede deformar sus ángulos sin alterar la longitud de sus tres
      lados
    is_correct: true
  - text: Porque sus tres lados deben medir siempre la misma longitud
    is_correct: false
  - text: Porque contiene cuatro vértices internos articulados
    is_correct: false
  - text: Porque su área es siempre igual a 100 metros cuadrados
    is_correct: false
  explanation: La alternativa correcta es 'Porque no puede deformar sus ángulos sin
    alterar la longitud de sus tres lados'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los lados de la estructura triangular miden 10 m, 15 m y 20 m, ¿cuál
    es su perímetro?
  choices:
  - text: 45 m
    is_correct: true
  - text: 25 m
    is_correct: false
  - text: 30 m
    is_correct: false
  - text: 40 m
    is_correct: false
  explanation: La alternativa correcta es '45 m', por la suma de sus tres lados.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 75° y 60°, ¿cuánto mide
    el tercero?
  alternativas:
  - 45°
  - 135°
  - 90°
  respuesta: 45°
  solucion_pasos:
  - Despejar $x = 180 - (75 + 60) = 45^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 10 cm y 15 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 23 cm
  - 30 cm
  - 0 cm
  respuesta: 23 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 25 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de definición de triángulo como polígono de tres lados resolviendo problemas
  geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
estado: publicado
