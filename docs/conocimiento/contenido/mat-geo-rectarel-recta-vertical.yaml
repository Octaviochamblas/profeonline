semantic_id: MAT.GEO.RECTA_RELACIONES.RECTA_VERTICAL
resumen_inicial: 'Identificación de rectas verticales como caso sin pendiente definida:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: A diferencia de todas las demás rectas, las verticales no pueden
  describirse con una pendiente numérica, porque cualquier intento de calcularla produce
  una división por cero.
explicacion_formal: '![Recta vertical](/static/img/geometria/analitica/rectarel-recta-vertical.svg)


  ### Definición formal


  En una recta vertical, todos los puntos tienen la misma coordenada x, por lo que
  $x_2-x_1=0$ para cualquier par de puntos, haciendo que $m=\dfrac{y_2-y_1}{x_2-x_1}$
  no esté definida (división por cero).


  ### Desarrollo didáctico


  La recta $x=2$ es vertical: para cualquier valor de $y$ (positivo, negativo o cero),
  el valor de $x$ siempre es 2.'
definiciones_clave: '- **Identificación de rectas verticales como caso sin pendiente
