procedimiento:
- 'Paso 1: Verifica si todos los puntos de la recta comparten la misma coordenada
  x.'
- 'Paso 2: Si es así, reconoce que la recta es vertical, con ecuación x=k.'
- 'Paso 3: Recuerda que esta recta no tiene pendiente definida ni forma principal
  y=mx+b.'
