semantic_id: MAT.ALG.POLINOMIOS.POLINOMIO_HOMOGENEO
resumen_inicial: 'Identificación de polinomio homogéneo: concepto y propiedades en
  Grado, ordenamiento e igualdad de polinomios.'
explicacion_simple: ¿Alguna vez has visto un equipo de levantamiento de pesas donde
  todos levantan exactamente los mismos kilos? En álgebra, a ese equipo perfectamente
  equilibrado en peso se le llama Homogéneo.
explicacion_formal: "### Definición formal\n\nLa homogeneidad polinomial se refiere\
  \ al equilibrio perfecto de grados absolutos a través de toda la expresión.\n\n\
  ### Desarrollo didáctico\n\nHomo significa 'igual' o 'mismo'. Para saber si es homogéneo,\
  \ debemos pesar (calcular el grado absoluto) de cada vagón por separado.\n- Polinomio:\
  \ $x^3 + x^2y - xy^2 + y^3$\n  - Vagón 1 ($x^3$): Grado $3$.\n  - Vagón 2 ($x^2y$):\
  \ Grado $2+1 = 3$.\n  - Vagón 3 ($-xy^2$): Grado $1+2 = 3$.\n  - Vagón 4 ($y^3$):\
  \ Grado $3$.\nTodos los vagones pesan $3$. Es un polinomio homogéneo de tercer grado.\n\
  \nSi tan solo un término tuviera un grado distinto, la homogeneidad se rompe al\
  \ instante."
definiciones_clave: '- **Identificación de polinomio homogéneo**: Elemento fundamental
  del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de polinomio homogéneo**:
