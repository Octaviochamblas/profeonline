resumen_inicial: Un polinomio es homogéneo si absolutamente todos sus términos monómicos
  poseen el mismo grado absoluto.
explicacion_simple: En un polinomio homogéneo, al sumar los exponentes de las letras
  de CADA término, siempre nos da exactamente el mismo resultado. Por ejemplo, en
  $3x^3 + 2x^2y - 5xy^2 + y^3$, cada uno de los 4 términos tiene grado absoluto $3$.
  Ese número común se llama grado de homogeneidad.
explicacion_formal: 'Un polinomio multivariable $P(x_1, \dots, x_m) = \sum_{k=1}^n
  T_k$ es **Homogéneo de Grado** $d$ si y solo si:


  $$\forall k \in \{1, \dots, n\}, \quad G.A.(T_k) = d$$


  **Propiedad de Escalamiento Multiplicativo:**

  $$P(\lambda x_1, \lambda x_2, \dots, \lambda x_m) = \lambda^d P(x_1, x_2, \dots,
  x_m) \quad \forall \lambda \in \mathbb{R}$$


  > **Complemento didáctico:** La homogeneidad garantiza la invarianza de escala del
  polinomio, propiedad fundamental en física matemática y curvas algebraicas homogéneas.'
definiciones_clave: '- **Polinomio homogéneo**: Polinomio cuyos términos comparten
  todos el mismo grado absoluto $d$.

  - **Grado de homogeneidad**: El valor constante $d$ que representa el grado absoluto
  de cada término.'
propiedades_relaciones: '- **Escalamiento $\lambda^d$**: $P(\lambda X) = \lambda^d
  P(X)$ para todo vector de variables $X$.'
ejemplo_guiado:
  enunciado: Verifique si $P(x,y) = 2x^4 - 5x^3y + 7x^2y^2 - xy^3$ es homogéneo.
  pasos:
  - 'Paso 1: Grado término 1 ($2x^4$): exponente $4$.'
  - 'Paso 2: Grado término 2 ($-5x^3y$): $3 + 1 = 4$.'
  - 'Paso 3: Grado término 3 ($7x^2y^2$): $2 + 2 = 4$.'
  - 'Paso 4: Grado término 4 ($-xy^3$): $1 + 3 = 4$.'
  - 'Paso 5: Comparar los grados: $4 = 4 = 4 = 4$.'
  - 'Conclusión: Todos los términos tienen grado absoluto 4, por lo que SÍ es un polinomio
    homogéneo de grado 4.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir los términos de un polinomio para que sea
    homogéneo?
  choices:
  - text: Todos sus términos monómicos deben tener exactamente el mismo grado absoluto
    is_correct: true
  - text: Todos sus coeficientes numéricos deben ser iguales
    is_correct: false
  - text: Debe tener un término independiente distinto de cero
    is_correct: false
  - text: Todos los exponentes deben ser números pares
    is_correct: false
  explanation: La alternativa correcta es 'Todos sus términos monómicos deben tener
    exactamente el mismo grado absoluto'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2x^4 - 5x^3y + 7x^2y^2 - xy^3, ¿cuál fue su
    grado de homogeneidad?
  choices:
  - text: '4'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el grado absoluto de cada término sumando sus exponentes.'
- 'Paso 2: Comprobar si todos los grados calculados son numéricamente iguales.'
- 'Paso 3: Si coinciden todos, declarar que el polinomio es homogéneo.'
errores_correccion: '- **Error 1: Incluir un término independiente no nulo en un polinomio
  homogéneo de grado $d > 0$.** **Cómo corregirlo:** El término independiente tiene
  grado $0$; si los otros términos tienen grado $d > 0$, el polinomio deja de ser
  homogéneo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es homogéneo el polinomio Q(x, y) = 3x^2y + 5x^3 - 8y^3?
  alternativas:
  - Sí, es homogéneo de grado 3
  - No, porque 3x^2y tiene grado 2
  - No, porque no tiene término independiente
  - Indeterminado
  respuesta: Sí, es homogéneo de grado 3
  solucion_pasos:
  - '1. Grado de 3x^2y: 2 + 1 = 3.'
  - '2. Grado de 5x^3: 3.'
  - '3. Grado de -8y^3: 3.'
  - 4. Como 3 = 3 = 3, es homogéneo de grado 3.
- titulo: Ejemplo 2
  enunciado: ¿Por qué R(x, y) = x^3 + y^3 + 5 no es homogéneo?
  alternativas:
  - Porque la constante +5 tiene grado 0 mientras que x^3 e y^3 tienen grado 3
  - Porque tiene dos variables distintas
  - Porque el coeficiente de x^3 es 1
  - Porque falta la variable z
  respuesta: Porque la constante +5 tiene grado 0 mientras que x^3 e y^3 tienen grado
    3
  solucion_pasos:
  - '1. Grado de x^3 y de y^3: 3.'
  - '2. Grado de la constante 5: 0.'
  - 3. Al no ser todos los grados iguales (3 != 0), no es homogéneo.
- titulo: ¿Es el polinomio 6x^2y^2 - 4xy^3 + 9x^3y homogéneo de grado 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, los tres términos tienen grado absoluto 4 (2+2=4, 1+3=4, 3+1=4).
- titulo: ¿Puede un polinomio homogéneo de grado 2 incluir una constante numérica
    distinta de cero?
  respuesta: 'No'
  solucion_pasos:
  - No, porque cualquier constante tiene grado 0, lo que rompería la igualdad de grado
    2 en todos los términos.
errores_frecuentes:
- Declarar homogéneo a un polinomio guiándose únicamente por los exponentes de una
  sola variable.
- Ignorar que una constante no nula tiene grado 0 al verificar la homogeneidad de
  un polinomio de grado mayor.
- Declarar la homogeneidad basándose en que todos los coeficientes numéricos son idénticos.
- Sumar todos los grados absolutos de los términos para definir el grado de homogeneidad.
- Declarar la homogeneidad de grado con la completitud respecto a una variable.
afirmaciones_verdaderas:
- Un polinomio es homogéneo si y solo si todos sus términos tienen el mismo grado
  absoluto.
- Al evaluar P(\lambda x, \lambda y) en un polinomio homogéneo de grado d, el resultado
  es \lambda^d P(x, y).
al_terminar_debes_poder: Al terminar serás capaz de determinar si un polinomio es
  homogéneo verificando que cada uno de sus términos posea exactamente el mismo grado
  absoluto.
