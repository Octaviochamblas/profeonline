semantic_id: MAT.ALG.POLINOMIOS.POLINOMIO_HOMOGENEO
resumen_inicial: 'Un polinomio es homogéneo cuando todos y cada uno de sus términos monomios poseen exactamente el mismo grado absoluto.'
explicacion_simple: |
  - Un polinomio es **homogéneo** si **todos sus términos suman lo mismo en sus exponentes**.
  - Por ejemplo, en $P(x, y) = 3x^3 - 5x^2y + 2xy^2 - y^3$:
    - Primer término: $3$ ($x^3$).
    - Segundo término: $2 + 1 = 3$ ($x^2y$).
    - Tercer término: $1 + 2 = 3$ ($xy^2$).
    - Cuarto término: $3$ ($y^3$).
    - ¡Todos los términos tienen grado absoluto $3$!
  - A este valor común se le llama **grado de homogeneidad** del polinomio.

  ![Polinomio Homogéneo](/static/img/nodos/identificacion-de-polinomio-homogeneo-intro.svg)
explicacion_formal: |
  ### Definición formal
  Un polinomio $P(x_1, \dots, x_n) \in \mathbb{K}[x_1, \dots, x_n]$ es **homogéneo de grado $k$** si todos sus monomios componentes no nulos $T_j$ tienen idéntico grado absoluto:

  $$\forall T_j \in \operatorname{supp}(P), \quad \operatorname{GA}(T_j) = k$$

  ### Teorema de homogeneidad de Euler
  Una función polinomial $P(x_1, \dots, x_n)$ es homogénea de grado $k$ si y solo si para todo escalar $t \in \mathbb{R}$:

  $$P(t x_1, t x_2, \dots, t x_n) = t^k \cdot P(x_1, x_2, \dots, x_n)$$

  ### Propiedades estructurales
  1. **Término independiente:** Todo polinomio homogéneo de grado $k \ge 1$ tiene término independiente nulo (no puede tener números sueltos).
  2. **Cierre de operaciones:** El producto de dos polinomios homogéneos de grados $k_1$ y $k_2$ es un polinomio homogéneo de grado $k_1 + k_2$.
definiciones_clave: |
  - **Polinomio homogéneo**: Polinomio cuyos términos tienen todos el mismo grado absoluto.
  - **Grado de homogeneidad**: Valor constante común del grado absoluto de todos sus monomios.
  - **Factor de escala ($t^k$)**: Potencia escalar que factoriza el polinomio al multiplicar todas las variables por $t$.
propiedades_relaciones: |
  - **Formas cuadráticas y cúbicas**: Las formas algebraicas puras en geometría y física (como $Ax^2 + Bxy + Cy^2$) son polinomios homogéneos de grado 2.
  - **Descomposición en componentes homogéneas**: Cualquier polinomio general puede descomponerse de forma única como la suma de polinomios homogéneos de grados crecientes.
ejemplo_guiado:
  enunciado: 'Determina si el polinomio $P(x, y) = 4x^4 - 7x^3y + 2x^2y^2 - 9y^4$ es homogéneo y calcula su grado de homogeneidad.'
  imagen: '/static/img/nodos/identificacion-de-polinomio-homogeneo-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos el grado absoluto del término $4x^4$: grado **$4$**.'
    - 'Paso 2: Calculamos el grado absoluto del término $-7x^3y$: $3 + 1 = **4$**.'
    - 'Paso 3: Calculamos el grado absoluto del término $2x^2y^2$: $2 + 2 = **4$**.'
    - 'Paso 4: Calculamos el grado absoluto del término $-9y^4$: grado **$4$**.'
    - 'Paso 5: Comparamos los grados: todos los términos tienen exactamente grado absoluto $4$.'
    - 'Paso 6: Conclusión: $P(x, y)$ **es un polinomio homogéneo** con grado de homogeneidad igual a **$4$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de los siguientes polinomios es homogéneo?'
    choices:
      - text: '$x^3 + 3x^2y + 3xy^2 + y^3$'
        is_correct: true
      - text: '$x^3 + x^2 + x + 1$'
        is_correct: false
      - text: '$2x^2y - 4xy + 5$'
        is_correct: false
      - text: '$x^4 + y^2$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$x^3 + 3x^2y + 3xy^2 + y^3$''. Todos sus términos tienen exactamente grado absoluto 3.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un polinomio homogéneo $P(x, y)$ de grado 3 sustituimos $(x, y)$ por $(2x, 2y)$, ¿por cuánto queda multiplicado el valor del polinomio?'
    choices:
      - text: 'Por $2^3 = 8$'
        is_correct: true
      - text: 'Por 2'
        is_correct: false
      - text: 'Por 6'
        is_correct: false
      - text: 'Por 3'
        is_correct: false
    explanation: 'La alternativa correcta es ''Por $2^3 = 8$''. Por el teorema de Euler, $P(tx, ty) = t^k P(x, y)$, y para $t=2, k=3$ resulta $2^3 = 8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el grado absoluto de cada monomio del polinomio sumando sus exponentes.'
  - 'Paso 2: Comparar los grados absolutos de todos los términos.'
  - 'Paso 3: Si todos los grados son idénticos, clasificar como polinomio homogéneo e indicar el grado común.'
  - 'Paso 4: Si al menos un término tiene grado distinto, clasificar como heterogéneo.'
errores_correccion: |
  - **Error 1:** Creer que un polinomio con término constante no nulo (como $x^2 + y^2 + 5$) puede ser homogéneo. **Cómo corregirlo:** La constante tiene grado 0, por lo que **rompe la homogeneidad**.
  - **Error 2:** Confundir homogeneidad con igualdad de coeficientes. **Cómo corregirlo:** La homogeneidad depende exclusivamente de **los grados de las letras**, no de los números coeficientes.
ejemplos:
  - titulo: 'Forma cuadrática homogénea'
    enunciado: '¿Es $P(x, y) = 3x^2 - 4xy + 5y^2$ un polinomio homogéneo de segundo grado?'
    alternativas:
      - 'Sí, porque todos sus términos tienen grado 2'
      - 'No, porque los coeficientes son distintos'
      - 'No, porque el término central tiene dos variables'
    respuesta: 'Sí, porque todos sus términos tienen grado 2'
    solucion_pasos:
      - '1. $\operatorname{GA}(3x^2) = 2$.'
      - '2. $\operatorname{GA}(-4xy) = 1 + 1 = 2$.'
      - '3. $\operatorname{GA}(5y^2) = 2$.'
      - '4. Es homogéneo de grado 2.'
  - titulo: 'Polinomio no homogéneo por constante'
    enunciado: '¿Por qué $x^3 + y^3 - 8$ no es homogéneo?'
    alternativas:
      - 'Porque el número $-8$ tiene grado 0 mientras los otros términos tienen grado 3'
      - 'Porque tiene signo menos'
      - 'Porque tiene 3 términos'
    respuesta: 'Porque el número $-8$ tiene grado 0 mientras los otros términos tienen grado 3'
    solucion_pasos:
      - '1. Grados de los términos: 3, 3 y 0.'
      - '2. Como $0 \neq 3$, no es homogéneo.'
  - titulo: 'Producto notable como homogéneo'
    enunciado: '¿Es el desarrollo de $(x + y)^2 = x^2 + 2xy + y^2$ un polinomio homogéneo?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Los tres términos tienen grado absoluto 2.'
      - '2. Es homogéneo de segundo grado.'
  - titulo: 'Homogeneidad en una variable'
    enunciado: '¿Puede un polinomio de una sola variable con dos o más términos no nulos ser homogéneo?'
    respuesta: 'No'
    solucion_pasos:
      - '1. En una variable, dos términos de igual grado son semejantes y se reducen a un solo monomio.'
      - '2. Un polinomio de una variable con $\ge 2$ términos irreducibles es siempre heterogéneo.'
errores_frecuentes:
  - 'Olvidar que las constantes numéricas no nulas tienen grado cero y rompen la homogeneidad.'
  - 'Confundir polinomios homogéneos con polinomios que tienen coeficientes numéricos iguales.'
  - 'Creer que un polinomio de una sola variable (ej: $x^3 + x^2$) puede ser homogéneo.'
  - 'No sumar los exponentes de todas las variables en términos multivariables como $x^2y^2$.'
  - 'Suponer que cambiar los signos de los términos altera la propiedad de homogeneidad.'
afirmaciones_verdaderas:
  - 'Un polinomio es homogéneo si todos sus términos componentes tienen exactamente el mismo grado absoluto.'
  - 'Todo polinomio homogéneo $P(x, y)$ de grado $k$ satisface la identidad de escala $P(tx, ty) = t^k P(x, y)$.'
al_terminar_debes_poder: |
  ![Resumen de Polinomio Homogéneo](/static/img/nodos/identificacion-de-polinomio-homogeneo-resumen.svg)

  QUÉ: Identificar polinomios homogéneos, calcular su grado de homogeneidad y aplicar la propiedad de escalamiento de Euler ($P(tx, ty) = t^k P(x, y)$).
  CÓMO: Verificando la igualdad estricta de grados absolutos en todos los monomios ($\operatorname{GA}(T_j) = k$) en expresiones como $3x^3 - 5x^2y + 2xy^2 - y^3$.
