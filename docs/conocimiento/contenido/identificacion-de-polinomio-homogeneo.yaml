procedimiento:
- 'Paso 1: Calcula el grado absoluto (suma de exponentes de las letras) del primer
  término.'
- 'Paso 2: Haz lo mismo con el segundo término.'
- 'Paso 3: Continúa hasta el final.'
- 'Paso 4: Si todos los resultados numéricos son idénticos, es Homogéneo.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de polinomio homogéneo.
ejemplos:
- titulo: Prueba de equilibrio
  enunciado: Determina si a^4 + a^2b^2 - b^4 es homogéneo.
  solucion_pasos:
  - 'Término 1 (a^4): Grado 4.'
  - 'Término 2 (a^2b^2): Grado 2+2 = 4.'
  - 'Término 3 (-b^4): Grado 4.'
  - Todos tienen grado 4. Sí, es un polinomio homogéneo.
- titulo: En el diseño de curvas aerodinámicas, las ecuaciones deben ser 'homogéneas
    de grado $4$' par
  enunciado: 'En el diseño de curvas aerodinámicas, las ecuaciones deben ser ''homogéneas
    de grado $4$'' para no alterar la escala tridimensional. Un ingeniero propone
    la fórmula $F(x,y) = 3x^4 - 2x^2y^2 + 5y^4 - 10$. El sistema arroja un error de
    escala. ¿Por qué la fórmula no es homogénea? (v1)


    Opciones: A) Porque contiene el término independiente $-10$, el cual tiene grado
    $0$, rompiendo la homogeneidad de grado $4$ del resto de los términos. · B) Porque
    el término $2x^2y^2$ tiene grado $2$, no $4$. · C) Porque los coeficientes numéricos
    $3, -2, 5, -10$ son diferentes entre sí. · D) Porque una fórmula homogénea no
    puede tener signos negativos.'
  solucion_pasos:
  - T1(4), T2(4), T3(4). Todo iba bien hasta el -10, que es T4(0). Un solo término
    con grado distinto destruye la homogeneidad.
  - 'Respuesta: Porque contiene el término independiente $-10$, el cual tiene grado
    $0$, rompiendo la homogeneidad de grado $4$ del resto de los términos.'
- titulo: 'Respecto de «Identificación de polinomio homogéneo»: ¿Se ajusta a la definición
    esta afirmac'
  enunciado: 'Respecto de «Identificación de polinomio homogéneo»: ¿Se ajusta a la
    definición esta afirmación? «Un **Polinomio Homogéneo** es aquel en el que **todos
    y cada uno de sus términos tienen exactamente el mismo grado absoluto**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Polinomio Homogéneo** es
    aquel en el que **todos y cada uno de sus términos tienen exactamente el mismo
    grado absoluto**.'
- titulo: 'Respecto de «Identificación de polinomio homogéneo»: ¿Es compatible con
    el procedimiento est'
  enunciado: 'Respecto de «Identificación de polinomio homogéneo»: ¿Es compatible
    con el procedimiento esta afirmación? «Creer que ''homogéneo'' significa que todos
    los términos deben tener la misma letra (eso sería tener una sola variable, no
    ser homogéneo)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Polinomio Homogéneo** es
    aquel en el que **todos y cada uno de sus términos tienen exactamente el mismo
    grado absoluto**.'
errores_frecuentes:
- Creer que 'homogéneo' significa que todos los términos deben tener la misma letra
  (eso sería tener una sola variable, no ser homogéneo).
- Olvidarse de sumar los exponentes ocultos ('1') y clasificar mal un término mixto,
  rompiendo falsamente la homogeneidad.
- Que todos sus términos tienen coeficientes numéricos iguales.
- Que está formado exclusivamente por una sola variable.
- Que todos sus términos son positivos.
afirmaciones_verdaderas:
- La notación de identificación de polinomio homogéneo sigue las convenciones del
  lenguaje algebraico.
