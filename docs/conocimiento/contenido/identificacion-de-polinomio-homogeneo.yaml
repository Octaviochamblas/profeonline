semantic_id: MAT.ALG.POLINOMIOS.POLINOMIO_HOMOGENEO
resumen_inicial: 'La identificación de polinomio homogéneo consiste en verificar que todos los términos algebraicos del polinomio posean exactamente el mismo grado absoluto.'
explicacion_simple: |
  Un polinomio se llama **homogéneo** si **todos y cada uno de sus términos tienen exactamente la misma "potencia total" (grado absoluto)**:
  - "Homo" significa "igual" y "géneo" significa "tipo o grado".
  - Ejemplo: En $P(x,y) = 4x^3 - 5x^2 y + 2xy^2 - 8y^3$:
    - Grado de $4x^3 \implies 3$.
    - Grado de $-5x^2 y \implies 2 + 1 = 3$.
    - Grado de $2xy^2 \implies 1 + 2 = 3$.
    - Grado de $-8y^3 \implies 3$.
  - Como **todos los términos son de grado $3$**, el polinomio es **homogéneo de grado 3**.
  - Este grado común se conoce como el **grado de homogeneidad** del polinomio.
explicacion_formal: |
  ### Definición formal
  Un polinomio $P(x_1, \dots, x_k) = \sum_{i=1}^n M_i \in \mathbb{R}[x_1, \dots, x_k]$ es **homogéneo de grado $d$** (o una forma de grado $d$) si y solo si todos sus monomios constituyentes no nulos poseen el mismo grado absoluto $d$:

  $$\forall i \in \{1, \dots, n\}, \quad \operatorname{grabs}(M_i) = d$$

  ### Teorema de la Escala de Euler para Funciones Homogéneas
  Una función polinómica $P(x_1, \dots, x_k)$ es homogénea de grado $d$ si y solo si al escalar todas sus variables por una constante $\lambda \in \mathbb{R}$, el resultado se escala por $\lambda^d$:

  $$P(\lambda x_1, \lambda x_2, \dots, \lambda x_k) = \lambda^d \cdot P(x_1, x_2, \dots, x_k)$$

  ### Síntesis didáctica
  La homogeneidad garantiza invarianza geométrica bajo dilataciones cartesianas. Es un concepto central en la física (ecuaciones dimensionales) y en el cálculo multivariable.
definiciones_clave: |
  - **Polinomio homogéneo**: Polinomio en el cual todos sus términos poseen el mismo grado absoluto.
  - **Grado de homogeneidad ($d$)**: Valor numérico común del grado absoluto de todos los monomios de un polinomio homogéneo.
  - **Forma algebraica**: Denominación tradicional dada a un polinomio homogéneo multivariable.
propiedades_relaciones: |
  - **Producto de polinomios homogéneos**: El producto de un polinomio homogéneo de grado $d_1$ por uno de grado $d_2$ es un polinomio homogéneo de grado $d_1 + d_2$.
  - **Ausencia de término independiente constante**: Todo polinomio homogéneo de grado $d \ge 1$ carece de término independiente no nulo (salvo que todas las variables sean cero).
ejemplo_guiado:
  enunciado: 'Verifica si el polinomio $P(a,b) = 5a^4 - 2a^3 b + 7a^2 b^2 - b^4$ es un polinomio homogéneo y determina su grado de homogeneidad.'
  pasos:
    - 'Paso 1: Calculamos el grado del 1.er término $5a^4$: Exponente $4 \implies$ Grado $4$.'
    - 'Paso 2: Calculamos el grado del 2.º término $-2a^3 b$: Exponentes $3 + 1 \implies$ Grado $4$.'
    - 'Paso 3: Calculamos el grado del 3.er término $7a^2 b^2$: Exponentes $2 + 2 \implies$ Grado $4$.'
    - 'Paso 4: Calculamos el grado del 4.º término $-b^4$: Exponente $4 \implies$ Grado $4$.'
    - 'Paso 5: Comparamos: Todos los términos tienen grado igual a $4$.'
    - 'Conclusión: **Es un polinomio homogéneo de grado de homogeneidad $4$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad matemática debe cumplirse en un polinomio para ser clasificado como homogéneo?'
    choices:
      - {text: 'Todos sus términos algebraicos componentes deben poseer exactamente el mismo grado absoluto', is_correct: true}
      - {text: 'Todos sus coeficientes numéricos deben ser iguales entre sí', is_correct: false}
      - {text: 'Debe estar compuesto únicamente por una sola variable', is_correct: false}
      - {text: 'El término independiente debe ser igual a cero y tener coeficientes impares', is_correct: false}
    explanation: 'La alternativa correcta es ''Todos sus términos algebraicos componentes deben poseer exactamente el mismo grado absoluto''. Definición de polinomio homogéneo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Es el polinomio $Q(x,y) = 3x^2 y^3 - 8x^4 y + 6y^5$ un polinomio homogéneo? ¿Por qué?'
    choices:
      - {text: 'Sí, porque todos sus términos tienen grado absoluto igual a $5$ ($3+2=5, 4+1=5, 5$)', is_correct: true}
      - {text: 'No, porque las letras $x$ e $y$ tienen exponentes distintos en cada término', is_correct: false}
      - {text: 'No, porque el segundo término es negativo', is_correct: false}
      - {text: 'Sí, porque posee tres términos en total', is_correct: false}
    explanation: 'La alternativa correcta es ''Sí, porque todos sus términos tienen grado absoluto igual a $5$ ($3+2=5, 4+1=5, 5$)''. Homogéneo de grado 5.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el grado absoluto de cada uno de los términos del polinomio sumando sus exponentes literales.'
  - 'Paso 2: Comparar los grados absolutos obtenidos en todos los términos.'
  - 'Paso 3: Si todos los términos arrojan exactamente el mismo valor $d$, declarar que es un polinomio homogéneo de grado $d$.'
  - 'Paso 4: Si al menos un término arroja un grado absoluto distinto, declarar que no es homogéneo (heterogéneo).'
errores_correccion: |
  - **Error 1:** Evaluar sólo los exponentes de una letra en lugar del grado absoluto total del término (ej: en $x^2 y^2 + x^3 y$ decir que no es homogéneo porque $x^2 \neq x^3$). **Cómo corregirlo:** La homogeneidad exige comparar la **SUMA de todos los exponentes de cada término** ($2+2=4$ y $3+1=4 \implies$ homogéneo).
  - **Error 2:** Declarar que un polinomio homogéneo exige coeficientes numéricos iguales. **Cómo corregirlo:** Los coeficientes pueden ser números reales **totalmente distintos**; lo único igual debe ser el grado de las letras.
ejemplos:
  - titulo: 'Homogeneidad de grado 2'
    enunciado: '¿Es $x^2 + 2xy + y^2$ un polinomio homogéneo?'
    alternativas:
      - 'Sí, es homogéneo de grado 2 (grados: 2, 1+1=2, 2)'
      - 'No, porque el término central tiene coeficiente 2'
      - 'No, es heterogéneo'
    respuesta: 'Sí, es homogéneo de grado 2 (grados: 2, 1+1=2, 2)'
    solucion_pasos:
      - '1. Grados: $x^2 \to 2$, $2xy \to 1+1=2$, $y^2 \to 2$.'
      - '2. Es homogéneo de grado 2.'
  - titulo: 'Escala de Euler'
    enunciado: 'Si en el polinomio homogéneo de grado 3 $P(x,y) = x^3 + y^3$ reemplazamos $x \to 2x, y \to 2y$, ¿el resultado se multiplica por $2^3 = 8$?'
    alternativas:
      - 'Sí, $P(2x, 2y) = 8 P(x,y)$ por la propiedad de homogeneidad'
      - 'No, se multiplica por 2'
      - 'No, el resultado se duplica'
    respuesta: 'Sí, $P(2x, 2y) = 8 P(x,y)$ por la propiedad de homogeneidad'
    solucion_pasos:
      - '1. $(2x)^3 + (2y)^3 = 8x^3 + 8y^3 = 8(x^3 + y^3)$.'
      - '2. Cumple la escala de Euler.'
  - titulo: 'Polinomio heterogéneo descartado'
    enunciado: 'El polinomio $x^3 + y^2$, ¿es un polinomio homogéneo?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, los grados absolutos son $3$ y $2$ (diferentes).'
  - titulo: 'Producto de homogéneos'
    enunciado: 'Al multiplicar dos polinomios homogéneos de grado $2$ y grado $3$, ¿se obtiene un polinomio homogéneo de grado $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el producto suma sus grados de homogeneidad $2+3=5$.'
errores_frecuentes:
  - 'Un polinomio homogéneo requiere que todos sus coeficientes numéricos sean exactamente iguales.'
  - 'La homogeneidad de un polinomio se verifica comparando los exponentes de una sola variable.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Un polinomio homogéneo de grado superior a cero incluye un término independiente constante no nulo.'
  - 'Sumar dos polinomios homogéneos del mismo grado produce un polinomio de grado doble.'
afirmaciones_verdaderas:
  - 'Un polinomio es homogéneo si todos sus términos poseen exactamente el mismo grado absoluto.'
  - 'El escalamiento de las variables de un polinomio homogéneo de grado d por una constante k produce el factor k^d.'
al_terminar_debes_poder: 'Identificar polinomios homogéneos calculando el grado absoluto de cada término y comprobando la igualdad del grado de homogeneidad.'
