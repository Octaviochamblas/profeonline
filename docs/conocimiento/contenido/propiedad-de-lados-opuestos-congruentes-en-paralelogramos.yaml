semantic_id: MAT.GEO.PARALELOGRAMOS.LADOS_OPUESTOS_CONGRUENTES
resumen_inicial: 'En todo paralelogramo, los lados opuestos son congruentes de a pares: AB ≅ CD y BC ≅ DA.'
explicacion_simple: 'Una de las propiedades más útiles y directas de los paralelogramos es que sus lados opuestos miden exactamente lo mismo. Si el lado de abajo mide 8 cm, el lado de arriba medirá obligatoriamente 8 cm. Y si el lado izquierdo mide 5 cm, el derecho también medirá 5 cm.


  Esta igualdad ocurre porque al trazar una línea diagonal, el paralelogramo se corta en dos triángulos que son clones perfectos (congruentes). Por lo tanto, nunca verás un paralelogramo con lados opuestos de distinto tamaño.


  ![Lados opuestos congruentes en paralelogramos](/static/img/nodos/propiedad-de-lados-opuestos-congruentes-en-paralelogramos-intro.svg)

  '
explicacion_formal: '### Teorema de los lados opuestos

  Sea $\mathcal{ABCD}$ un paralelogramo con $\overline{AB} \parallel \overline{CD}$ y $\overline{BC} \parallel \overline{DA}$. Entonces, los segmentos opuestos son congruentes:

  $$\overline{AB} \cong \overline{CD} \quad \wedge \quad \overline{BC} \cong \overline{DA} \iff \text{long}(AB) = \text{long}(CD) \quad \wedge \quad \text{long}(BC) = \text{long}(DA)$$


  ### Demostración geométrica

  1. Trácese la diagonal $\overline{AC}$.

  2. Dado que $\overline{AB} \parallel \overline{CD}$, por ángulos alternos internos entre paralelas se tiene $\angle BAC \cong \angle DCA$.

  3. Dado que $\overline{BC} \parallel \overline{DA}$, por alternos internos se tiene $\angle BCA \cong \angle DAC$.

  4. Como el lado $\overline{AC}$ es común a ambos triángulos, por el criterio **ALA** (Ángulo-Lado-Ángulo) se concluye que $\triangle ABC \cong \triangle CDA$.

  5. Por homología entre elementos de triángulos congruentes: $\overline{AB} \cong \overline{CD}$ y $\overline{BC} \cong \overline{DA}$.


  > **Complemento didáctico:** Esta propiedad funciona en ambos sentidos: si te dan una figura de 4 lados y demuestras que los lados de arriba y abajo son iguales Y los de los lados son iguales, ya demostraste automáticamente que es un paralelogramo.

  '
definiciones_clave: '- **Congruencia de segmentos**: Dos segmentos son congruentes si tienen exactamente la misma longitud métrica.

  - **Criterio ALA**: Criterio de congruencia de triángulos basado en un lado y sus dos ángulos adyacentes.

  - **Ángulos alternos internos**: Pares de ángulos situados en lados opuestos de una recta transversal que corta dos paralelas.

  '
propiedades_relaciones: '- **Recíproco del teorema**: Si en un cuadrilátero convexo los lados opuestos son congruentes de a pares, el cuadrilátero es un paralelogramo.

  - **Cálculo de perímetro**: Gracias a esta propiedad, el perímetro de cualquier paralelogramo se simplifica a $P = 2(a + b)$.

  - **Paralelismo y congruencia conjunta**: Si un cuadrilátero tiene un solo par de lados opuestos que son SIMULTÁNEAMENTE paralelos y congruentes, es un paralelogramo.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de lados opuestos](/static/img/nodos/propiedad-de-lados-opuestos-congruentes-en-paralelogramos-ejemplos.svg)


    En un paralelogramo $ABCD$, el lado $AB$ mide $3x + 2$ cm y el lado opuesto $CD$ mide $17$ cm. Asimismo, el lado $BC$ mide $2y - 1$ cm y su lado opuesto $DA$ mide $9$ cm. Determina los valores de $x$, $y$ y el perímetro del paralelogramo.'
  pasos:
  - 'Paso 1: Plantear la ecuación para el primer par de lados opuestos: Por propiedad, $AB = CD \implies 3x + 2 = 17$.'
  - 'Paso 2: Despejar $x$: $3x = 15 \implies x = 5$.'
  - 'Paso 3: Plantear la ecuación para el segundo par: $BC = DA \implies 2y - 1 = 9 \implies 2y = 10 \implies y = 5$.'
  - 'Paso 4: Calcular el perímetro: $P = 2(AB + BC) = 2(17 + 9) = 2(26) = 52$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: Si en un paralelogramo un lado mide 14 cm, ¿cuánto mide obligatoriamente su lado opuesto?
  choices:
  - text: 14 cm.
    is_correct: true
  - text: 7 cm.
    is_correct: false
  - text: 28 cm.
    is_correct: false
  - text: No se puede saber sin conocer la altura.
    is_correct: false
  explanation: La alternativa correcta es '14 cm.' En todo paralelogramo, los lados opuestos son rigurosamente congruentes entre sí.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un paralelogramo, los lados adyacentes miden 8 cm y 12 cm. ¿Cuál es su perímetro?
  choices:
  - text: 40 cm.
    is_correct: true
  - text: 20 cm.
    is_correct: false
  - text: 96 cm.
    is_correct: false
  - text: 48 cm.
    is_correct: false
  explanation: La alternativa correcta es '40 cm.' Aplicando $P = 2(a + b) = 2(8 + 12) = 2(20) = 40$ cm.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar cuáles lados son opuestos entre sí en el paralelogramo.

  2. Igualar las expresiones algebraicas de los lados opuestos ($L_{\text{arriba}} = L_{\text{abajo}}$ y $L_{\text{izq}} = L_{\text{der}}$).

  3. Despejar las incógnitas lineales.

  4. Verificar longitudes positivas y calcular el perímetro si se requiere.

  '
errores_correccion: '- **Error común 1:** Igualar lados adyacentes en un paralelogramo oblicuo. **Corrección:** Los lados adyacentes no tienen por qué ser iguales (solo en el rombo y cuadrado); los que siempre son iguales son los OPUESTOS.

  - **Error común 2:** Olvidar que la congruencia de opuestos es bidireccional. **Corrección:** Si dos pares de lados opuestos son congruentes, el cuadrilátero es automáticamente un paralelogramo.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de lado en paralelogramo
  enunciado: En un paralelogramo $ABCD$, si el lado $AB = 2x - 4$ y el lado opuesto $CD = 10$, ¿cuál es el valor de $x$?
  alternativas:
  - text: $x = 7$.
    is_correct: true
  - text: $x = 3$.
    is_correct: false
  - text: $x = 5$.
    is_correct: false
  - text: $x = 14$.
    is_correct: false
  explicacion: 'Igualando lados opuestos: $2x - 4 = 10 \implies 2x = 14 \implies x = 7$.'
- tipo: B
  titulo: Lados opuestos desiguales
  enunciado: ¿Puede un paralelogramo tener un lado de 10 cm y su lado opuesto de 12 cm?
  respuesta: 'No'
  explicacion: No. En todo paralelogramo los lados opuestos son estrictamente congruentes.
errores_frecuentes:
- '''Igualar dos lados contiguos en un romboide asumiendo que todos los lados son iguales.'''
- '''Sumar solo dos lados al calcular el perímetro olvidando duplicar la suma.'''
- '''Creer que los lados opuestos solo son congruentes si los ángulos son rectos.'''
afirmaciones_verdaderas:
- '''En todo paralelogramo, los lados opuestos tienen la misma medida métrica.'''
- '''Un cuadrilátero con lados opuestos congruentes de a pares es un paralelogramo.'''
- '''La diagonal de un paralelogramo divide a la figura en dos triángulos congruentes.'''
al_terminar_debes_poder: '**QUÉ:** Aplicar la congruencia de lados opuestos para resolver ecuaciones geométricas y calcular perímetros.


  **CÓMO:** Planteando igualdades algebraicas $\overline{AB} \cong \overline{CD}$ y $\overline{BC} \cong \overline{DA}$ derivadas del criterio ALA.


  ![Síntesis de lados opuestos](/static/img/nodos/propiedad-de-lados-opuestos-congruentes-en-paralelogramos-resumen.svg)

  '
