semantic_id: MAT.NUM.ENTEROS_OPERATORIA.PARENTESIS_MENOS
resumen_inicial: Un signo $-$ que antecede a un paréntesis exige invertir el signo
  de todos los términos interiores al suprimirlo.
explicacion_simple: 'Cuando un paréntesis está precedido por un signo negativo $-$,
  dicho signo actúa como un inversor general. Al eliminar los paréntesis, debemos
  cambiar el signo de cada uno de los números que están adentro: los positivos se
  vuelven negativos y los negativos se vuelven positivos.'
explicacion_formal: 'Para cualquier expresión interior $P(x)$, la **Regla de Eliminación
  de Paréntesis Negativo** establece la distribución del opuesto aditivo:


  $$-\left( a + b - c \right) = -a - b + c$$


  **Desglose de la fórmula:**

  - $-(a + b - c)$: Paréntesis precedido por el signo de resta o negativo exterior.

  - $-a - b + c$: Inversión obligatoria del signo de TODOS los términos interiores
  tras suprimir las barras del paréntesis.


  > **Complemento didáctico:** En $10 - (-4 + 6)$, distribuimos el menos: $10 + 4
  - 6 = 8$.'
definiciones_clave: '- **Paréntesis negativo**: Paréntesis precedido por el signo
  $-$, cuya eliminación invierte la polaridad de todos sus términos.'
propiedades_relaciones: '- **Distribución del opuesto**: $-(x) = (-1) \cdot x$.'
ejemplo_guiado:
  enunciado: Elimine los paréntesis en la expresión $15 - (-8 + 3 - 5)$ y calcule
    el resultado.
  pasos:
  - 'Paso 1: Observar que el paréntesis está antecedido por el signo $-$.'
  - 'Paso 2: Invertir el signo de cada término interior al quitar los paréntesis:
    $15 + 8 - 3 + 5$.'
  - 'Paso 3: Sumar y restar de izquierda a derecha: $23 - 3 + 5 = 20 + 5 = 25$.'
  - 'Conclusión: El resultado es $25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con los signos dentro de un paréntesis al eliminarlo si está
    precedido por un signo -?
  choices:
  - text: Todos los signos interiores invierten su polaridad (positivos a negativos
      y viceversa)
    is_correct: true
  - text: Se mantienen exactamente igual
    is_correct: false
  - text: Solo el primer término cambia de signo
    is_correct: false
  - text: Todos los términos se vuelven positivos
    is_correct: false
  explanation: La alternativa correcta es 'Todos los signos interiores invierten su
    polaridad (positivos a negativos y viceversa)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la expresión equivalente tras eliminar
    el paréntesis -(-8 + 3 - 5)?
  choices:
  - text: 15 + 8 - 3 + 5
    is_correct: true
  - text: 15 - 8 + 3 - 5
    is_correct: false
  - text: 15 - 8 - 3 - 5
    is_correct: false
  - text: 15 + 8 + 3 + 5
    is_correct: false
  explanation: La alternativa correcta es '15 + 8 - 3 + 5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el signo anterior al paréntesis es $-$.'
- 'Paso 2: Suprimir el signo $-$ exterior y las barras del paréntesis.'
- 'Paso 3: Cambiar el signo de cada uno de los términos interiores y resolver la operación.'
errores_correccion: '- **Error 1: Cambiar el signo solo del primer término dentro
  del paréntesis.** En $-(4 - 3)$, escribir $-4 - 3$. **Cómo corregirlo:** El signo
  $-$ afecta a TODOS los términos dentro ($-(4 - 3) = -4 + 3 = -1$).


  - **Error 2: Olvidar cambiar los signos cuando hay varios sumandos.** **Cómo corregirlo:**
  Revisar cada término uno a uno al quitar los paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $20 - (5 - 8)$.
  alternativas:
  - '23'
  - '17'
  - '7'
  respuesta: '23'
  solucion_pasos:
  - $20 - 5 + 8 = 23$.
- titulo: Ejemplo 2
  enunciado: Elimine paréntesis en $-(-6 + 2)$.
  alternativas:
  - '4'
  - '-4'
  - '-8'
  respuesta: '4'
  solucion_pasos:
  - $+6 - 2 = 4$.
- titulo: ¿Un signo - antecedente a un paréntesis cambia el signo de todos sus términos
    internos?
  respuesta: Sí
  solucion_pasos:
  - Sí, la supresión de paréntesis negativos invierte todos los signos interiores.
- titulo: ¿La expresión -(a - b) equivale a -a - b?
  respuesta: 'No'
  solucion_pasos:
  - No, $-(a - b) = -a + b$.
errores_frecuentes:
- Un signo $-$ antes de un paréntesis solo cambia el signo del primer término interior.
- Eliminar un paréntesis precedido por $-$ conserva intactos todos los signos de su
  interior.
- Un signo $-$ delante de un paréntesis transforma todos los términos en números positivos.
- La regla de inversión de signos solo se aplica cuando el paréntesis contiene multiplicaciones.
- Eliminar paréntesis precedidos por $-$ exige elevar los números al cuadrado.
afirmaciones_verdaderas:
- Un signo $-$ antecedente obliga a cambiar el signo de todos los términos dentro
  del paréntesis al suprimirlo.
- La expresión $a - (b - c)$ se convierte en $a - b + c$.
al_terminar_debes_poder: Al terminar serás capaz de eliminar paréntesis precedidos
  por un signo $-$, cambiando el signo de cada uno de los términos interiores y resolviendo
  la suma resultante.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
