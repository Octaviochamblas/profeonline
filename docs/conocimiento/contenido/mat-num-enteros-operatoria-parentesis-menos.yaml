semantic_id: MAT.NUM.ENTEROS_OPERATORIA.PARENTESIS_MENOS
resumen_inicial: "Un paréntesis precedido por signo $-$ se elimina cambiando el signo de todos los términos interiores."
explicacion_simple: |
  El signo menos ($-$) antes de un paréntesis es travieso: actúa como un interruptor que
  invierte todo. Si un número adentro es positivo, se vuelve negativo, y viceversa. Por
  ejemplo, $15-(-5)$: el signo menos cambia el $-5$ a $+5$, quedando $15+5=20$. No olvides
  cambiar TODOS los términos que estén dentro.
explicacion_formal: |
  Para $a,b\in\mathbb{Z}$: $a-(+b)=a-b$ y $a-(-b)=a+b$. Si el paréntesis agrupa varios
  términos, $a-(b-c+d)=a-b+c-d$. Equivale a multiplicar la expresión interior por $-1$:
  $a-(b-c)=a+(-1)\cdot b+(-1)\cdot(-c)=a-b+c$.
definiciones_clave: |
  **Eliminación de paréntesis con signo $-$**: se retira el paréntesis y el signo $-$
  exterior, cambiando cada término interior a su signo opuesto.
propiedades_relaciones: |
  Un signo $-$ antes de un paréntesis equivale a multiplicar la expresión interior por
  $-1$, lo que explica por qué todos los signos internos se invierten.
ejemplo_guiado:
  enunciado: "Elimina el paréntesis en $10 - (-4 + 6)$."
  pasos:
    - "El paréntesis está precedido por $-$: se invierten los signos internos."
    - "El $-4$ pasa a $+4$, y el $+6$ pasa a $-6$: queda $10+4-6$."
    - "Se resuelve: $10+4=14$, luego $14-6=8$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Al eliminar un paréntesis precedido por signo $-$, ¿qué pasa con los signos interiores?"
    choices:
      - {text: "Se mantienen igual", is_correct: false}
      - {text: "Se invierten todos", is_correct: true}
      - {text: "Solo se invierte el último", is_correct: false}
      - {text: "Se vuelven todos negativos", is_correct: false}
    explanation: "La correcta es Se invierten todos: un signo $-$ delante del paréntesis cambia cada término interior a su opuesto."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $8 - (-3 + 5)$?"
    choices:
      - {text: "$6$", is_correct: true}
      - {text: "$-6$", is_correct: false}
      - {text: "$10$", is_correct: false}
      - {text: "$0$", is_correct: false}
    explanation: "La correcta es $6$: se invierten los signos internos ($8+3-5$), y $8+3=11$, $11-5=6$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Localiza el paréntesis en la expresión y verifica si está antecedido por un signo negativo ($-$).'
  - 'Paso 2: Retira el paréntesis y el signo $-$ exterior.'
  - 'Paso 3: Cambia el signo de cada uno de los términos que estaban dentro al opuesto ($+$ pasa a $-$, y $-$ pasa a $+$).'
  - 'Paso 4: Resuelve las adiciones y sustracciones resultantes.'
errores_correccion: |
  Un error frecuente es cambiar de signo solo al primer número dentro del paréntesis y
  dejar los demás iguales. Otro error es no invertir el signo del primer término si es
  positivo e implícito.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Elimina los paréntesis y resuelve la expresión: $12 - (-5 + 8)$'
    alternativas:
      - "$9$"
      - "$-9$"
      - "$15$"
    respuesta: "$9$"
    solucion_pasos:
      - 'Paso a: El paréntesis está antecedido por un signo menos ($-$).'
      - 'Paso b: Eliminamos el paréntesis invirtiendo los signos interiores: el $-5$ pasa a $+5$, y el $+8$ pasa a $-8$. La expresión queda: $12 + 5 - 8$.'
      - 'Paso c: Calculamos de izquierda a derecha: $12 + 5 = 17$, luego $17 - 8 = 9$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve simplificando los paréntesis: $-3 - (4 - (-2))$'
    alternativas:
      - "$-9$"
      - "$9$"
      - "$-1$"
    respuesta: "$-9$"
    solucion_pasos:
      - 'Paso a: Primero simplificamos el paréntesis más interno: $-(-2) = +2$. La expresión es $-3 - (4 + 2)$.'
      - 'Paso b: Quitamos el paréntesis restante antecedido por $-$, cambiando signos internos: $-3 - 4 - 2$.'
      - 'Paso c: Sumamos los enteros negativos: $-3 - 4 = -7$, luego $-7 - 2 = -9$.'
  - titulo: '¿Es equivalente escribir $8 - (-3)$ que $8 + 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'El signo menos exterior cambia el signo del $-3$ a su opuesto, que es $+3$.'
      - 'Por ende, $8 - (-3) = 8 + 3 = 11$.'
  - titulo: '¿Es correcto afirmar que $-(-10) = -10$?'
    respuesta: 'No'
    solucion_pasos:
      - 'El signo menos exterior cambia el signo del término interior.'
      - 'El opuesto de $-10$ es $+10$, por lo tanto $-(-10) = +10 = 10$.'
      - 'Mantener $-10$ implicaría ignorar la regla de eliminación de paréntesis con signo negativo.'
errores_frecuentes:
  - 'Cambiar de signo solo al primer número dentro del paréntesis y dejar los demás iguales (ej: $10 - (3 - 5) = 10 - 3 - 5$ en lugar de $10 - 3 + 5$).'
  - 'No cambiar el signo del primer término si es positivo e implícito (ej: $- ( 4 - 2 )$ transformarlo en $-4 - 2$ en lugar de $-4 + 2$).'
  - 'Confundir la regla de la multiplicación de signos con la de la suma.'
  - 'Mantener el signo menos de afuera después de haber cambiado los de adentro.'
  - 'Aplicar la regla del signo negativo solo cuando el paréntesis contiene dos o más términos, ignorando que también aplica a un solo término como $-(-5)$.'
afirmaciones_verdaderas:
  - "Un paréntesis precedido por un signo - cambia el signo de todos los términos internos al eliminarse."
  - "-(3-5) es igual a -3+5."
al_terminar_debes_poder: |
  Eliminar paréntesis precedidos por signo $-$ invirtiendo correctamente el signo de todos
  los términos internos.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 50"
estado: publicado
