    is_correct: false
  explanation: La alternativa correcta es 'Término central negativo ($-$), término
    independiente positivo ($+$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expansión de $(x - 8)(x + 3)$, ¿por qué el producto de los no comunes
    resultó $-24$?
  choices:
  - text: 'Por la ley de signos de la multiplicación: $(-8) \cdot (+3) = -24$'
    is_correct: true
  - text: Porque $-8 + 3 = -24$
    is_correct: false
  - text: Por la suma de los cuadrados
    is_correct: false
  - text: Por una convención arbitraria
    is_correct: false
  explanation: 'La alternativa correcta es ''Por la ley de signos de la multiplicación:
