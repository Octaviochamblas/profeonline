resumen_inicial: El manejo de signos en los términos no comunes rige la determinación
  exacta de los signos de la suma $(a + b)$ y del producto $ab$ según los signos de
  las constantes.
explicacion_simple: 'Cuando los números no comunes tienen signos distintos o ambos
  negativos, como $(x - 7)(x + 3)$, debes tener cuidado con las reglas de signos:
  para el centro sumas los números $(-7 + 3 = -4)$, dando $-4x$; para el final los
  multiplicas $(-7 \cdot 3 = -21)$, dando $-21$. El resultado es $x^2 - 4x - 21$.'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ constantes con combinaciones de signos
  arbitrarias en $(x + a)(x + b) = x^2 + (a + b)x + ab$. La regla de signos opera
  según cuatro casos disjuntos:


  1. **Ambos positivos ($a>0, b>0$):** Suma $(a+b)>0$, Producto $ab>0 \to x^2 + Sx
  + P$.

  2. **Ambos negativos ($a<0, b<0$):** Suma $(a+b)<0$, Producto $ab>0 \to x^2 - Sx
  + P$.

  3. **Signos opuestos con $|a| > |b|$ ($a<0, b>0$):** Suma $(a+b)<0$, Producto $ab<0
  \to x^2 - Sx - P$.

  4. **Signos opuestos con $|a| < |b|$ ($a>0, b<0$):** Suma $(a+b)>0$, Producto $ab<0
  \to x^2 + Sx - P$.


  > **Complemento didáctico:** Garantiza que el estudiante no memorice signos fijos,
  sino que aplique las reglas de adición y multiplicación en $\mathbb{R}$.'
definiciones_clave: '- **Suma algebraica de no comunes**: Cálculo de $a + b$ respetando
  los signos de los sumandos.

  - **Leyes de signos para producto**: $+ \cdot + = +$, $- \cdot - = +$, y $+ \cdot
  - = -$.'
propiedades_relaciones: '- **Regla de signos de Descartes**: Los cambios de signo
  en $x^2 + Sx + P$ determinan la naturaleza de las raíces de la ecuación correspondiente.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(x - 8)(x + 3)$ aplicando las reglas de signos
    para los términos no comunes.
  pasos:
  - 'Paso 1: Identificar $a = -8$ y $b = +3$.'
  - 'Paso 2: Calcular el término común al cuadrado: $x^2$.'
  - 'Paso 3: Calcular la suma algebraica no común: $-8 + 3 = -5 \to -5x$.'
  - 'Paso 4: Calcular el producto no común: $(-8) \cdot (+3) = -24$.'
  - 'Paso 5: Ensamblar los términos: $x^2 - 5x - 24$.'
  - 'Conclusión: El desarrollo correcto es $x^2 - 5x - 24$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si ambos términos no comunes son negativos ($a < 0$ y $b < 0$), ¿cuáles
    son los signos del término central y del término independiente?
  choices:
  - text: Término central negativo ($-$), término independiente positivo ($+$)
    is_correct: true
  - text: 'Ambos términos son negativos ($-$), ($-$) '
    is_correct: false
  - text: Ambos términos son positivos ($+$), ($+$)
    is_correct: false
