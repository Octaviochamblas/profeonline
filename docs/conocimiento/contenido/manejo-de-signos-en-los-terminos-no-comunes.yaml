semantic_id: MAT.ALG.TERMINO_COMUN.MANEJO_SIGNOS_NO_COMUNES
resumen_inicial: 'El manejo de signos en los términos no comunes consiste en sistematizar la determinación de la signatura del término central y del término independiente en el desarrollo de binomios con término común.'
explicacion_simple: |
  Para dominar los **signos en los binomios con término común** $(x + a)(x + b)$, aprende las **4 combinaciones posibles de signos**:

  1. **Ambos no comunes POSITIVOS** ($(x + 3)(x + 5)$):
     - Suma: $+3 + 5 = \mathbf{+8x}$.
     - Producto: $(+3)(+5) = \mathbf{+15}$.
     - Signos del trinomio: **$(+, +, +) \implies x^2 + 8x + 15$**.
  2. **Ambos no comunes NEGATIVOS** ($(x - 3)(x - 5)$):
     - Suma: $-3 - 5 = \mathbf{-8x}$.
     - Producto: $(-3)(-5) = \mathbf{+15}$.
     - Signos del trinomio: **$(+, -, +) \implies x^2 - 8x + 15$**.
  3. **Mayor POSITIVO y menor NEGATIVO** ($(x + 7)(x - 2)$):
     - Suma: $+7 - 2 = \mathbf{+5x}$.
     - Producto: $(+7)(-2) = \mathbf{-14}$.
     - Signos del trinomio: **$(+, +, -) \implies x^2 + 5x - 14$**.
  4. **Mayor NEGATIVO y menor POSITIVO** ($(x - 7)(x + 2)$):
     - Suma: $-7 + 2 = \mathbf{-5x}$.
     - Producto: $(-7)(+2) = \mathbf{-14}$.
     - Signos del trinomio: **$(+, -, -) \implies x^2 - 5x - 14$**.
explicacion_formal: |
  ### Definición formal
  Sea la familia de polinomios trinomios $P_{a,b}(x) = x^2 + S(a,b)x + P(a,b)$ generados por el producto $(x+a)(x+b)$. Se define la **matriz de signatura de trinomios mónicos** $\mathbf{\Sigma}(a,b) = \left( \operatorname{sgn}(1), \operatorname{sgn}(S), \operatorname{sgn}(P) \right) \in \{-1, +1\}^3$:

  $$\mathbf{\Sigma}(a,b) = \begin{cases}
  (+, +, +) & \text{si } a > 0, b > 0 \\
  (+, -, +) & \text{si } a < 0, b < 0 \\
  (+, +, -) & \text{si } a \cdot b < 0 \land |a_{\text{pos}}| > |b_{\text{neg}}| \\
  (+, -, -) & \text{si } a \cdot b < 0 \land |a_{\text{neg}}| > |b_{\text{pos}}|
  \end{cases}$$

  ### Análisis del Dominio de Signatura
  El signo del término lineal $\operatorname{sgn}(S) = \operatorname{sgn}(a+b)$ depende del término dominante en magnitud absoluta $\max(|a|, |b|)$, mientras que $\operatorname{sgn}(P) = \operatorname{sgn}(a \cdot b)$ está determinado unívocamente por el número de factores negativos.

  ### Síntesis didáctica
  Memorizar las 4 combinaciones del vector de signatura $\mathbf{\Sigma}$ proporciona un control rápido para validar expansiones y factorizaciones cuadráticas.
definiciones_clave: |
  - **Vector de signatura $\mathbf{\Sigma}$**: Triada de signos $(+, \operatorname{sgn}(S), \operatorname{sgn}(P))$ correspondiente a los tres términos del trinomio.
  - **Dominancia por magnitud absoluta**: Criterio por el cual el número de mayor valor absoluto impone su signo a la suma $S = a+b$.
  - **Cuatro estados de signatura**: Clasificación exhaustiva de los trinomios mónicos según las 4 combinaciones posibles de signos de $a$ y $b$.
propiedades_relaciones: |
  - **Indicador de factorización**:
    - Si el término constante $P$ es **positivo (+)**, los dos números de la factorización deben tener el **mismo signo**.
    - Si el término constante $P$ es **negativo (-)**, los dos números deben tener **signos contrarios**.
ejemplo_guiado:
  enunciado: 'Determina el vector de signatura y desarrolla el producto $(x - 9) \cdot (x + 4)$.'
  pasos:
    - 'Paso 1: Identificamos los no comunes: $a = -9$ y $b = +4$.'
    - 'Paso 2: Evaluamos los signos: Tienen **signos contrarios** ($a \cdot b < 0$) y el negativo es mayor en magnitud ($|-9| > |+4|$).'
    - 'Paso 3: Predecimos el vector de signatura: **$(+, -, -)$**.'
    - 'Paso 4: Calculamos la suma $S$: $-9 + 4 = \mathbf{-5} \implies -5x$.'
    - 'Paso 5: Calculamos el producto $P$: $(-9)(+4) = \mathbf{-36}$.'
    - 'Paso 6: Unimos los términos: $x^2 - 5x - 36$.'
    - 'Conclusión: El trinomio es **$x^2 - 5x - 36$** (coincidiendo con la signatura $(+, -, -)$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en un producto de binomios con término común ambos términos no comunes son negativos (ej: $(x-4)(x-6)$), ¿cuál es el vector de signatura del trinomio resultante?'
    choices:
      - {text: 'El vector de signatura es $(+, -, +)$, porque el término lineal es la suma de dos negativos (-) y el término constante es el producto de dos negativos (+)', is_correct: true}
      - {text: 'El vector de signatura es $(-, -, -)$', is_correct: false}
      - {text: 'El vector de signatura es $(+, +, +)$', is_correct: false}
      - {text: 'El vector de signatura es $(+, +, -)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El vector de signatura es $(+, -, +)$, porque el término lineal es la suma de dos negativos (-) y el término constante es el producto de dos negativos (+)''. Signatura $(+, -, +)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al expandir $(x + 8)(x - 3)$, ¿qué combinación de signos tendrá el trinomio final?'
    choices:
      - {text: 'Tendrá la combinación $(+, +, -) \implies x^2 + 5x - 24$, porque $+8 - 3 = +5$ y $(+8)(-3) = -24$', is_correct: true}
      - {text: 'Tendrá la combinación $(+, -, +) \implies x^2 - 5x + 24$', is_correct: false}
      - {text: 'Tendrá la combinación $(+, -, -) \implies x^2 - 5x - 24$', is_correct: false}
      - {text: 'Tendrá la combinación $(+, +, +) \implies x^2 + 5x + 24$', is_correct: false}
    explanation: 'La alternativa correcta es ''Tendrá la combinación $(+, +, -) \implies x^2 + 5x - 24$, porque $+8 - 3 = +5$ y $(+8)(-3) = -24$''. $S = +5, P = -24 \implies (+, +, -)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Observar los signos de los dos términos no comunes $a$ y $b$.'
  - 'Paso 2: Si tienen el mismo signo, sumar sus valores absolutos y colocar signo $+$ a su producto $P$.'
  - 'Paso 3: Si tienen signos contrarios, restar sus valores absolutos asignando a $S$ el signo del mayor y colocar signo $-$ a $P$.'
  - 'Paso 4: Escribir el trinomio verificando el cumplimiento de una de las 4 estructuraciones de signatura.'
errores_correccion: |
  - **Error 1:** Asignar signo positivo al término constante cuando los no comunes tienen signos contrarios. **Cómo corregirlo:** Si los no comunes tienen diferente signo, el producto **ES SIEMPRE NEGATIVO (-)**.
  - **Error 2:** Colocar el signo del número menor en la suma de no comunes de distinto signo. **Cómo corregirlo:** La suma de números con distinto signo **HEREDA EL SIGNO DEL NÚMERO DE MAYOR VALOR ABSOLUTO**.
ejemplos:
  - titulo: 'Signatura (+, +, +)'
    enunciado: 'Para $(x + 4)(x + 2)$, ¿es el trinomio $x^2 + 6x + 8$ con signatura $(+, +, +)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Suma: $+4 + 2 = +6$.'
      - '2. Producto: $(+4)(+2) = +8$.'
      - '3. Signos: todos positivos.'
  - titulo: 'Signatura (+, -, +)'
    enunciado: 'Para $(x - 7)(x - 1)$, ¿cuál es el trinomio resultante?'
    alternativas:
      - '$x^2 - 8x + 7$'
      - '$x^2 - 8x - 7$'
      - '$x^2 + 8x + 7$'
    respuesta: '$x^2 - 8x + 7$'
    solucion_pasos:
      - '1. Suma: $-7 - 1 = -8$.'
      - '2. Producto: $(-7)(-1) = +7$.'
      - '3. Resultado: $x^2 - 8x + 7$.'
  - titulo: 'Signatura (+, -, -)'
    enunciado: 'En $(x - 10)(x + 3)$, ¿es el término central $-7x$ y la constante $-30$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-10 + 3 = -7$ y $(-10)(+3) = -30$.'
  - titulo: 'Criterio de factorización'
    enunciado: 'Si un trinomio termina en constante negativa $-15$, ¿provienen sus no comunes de dos números con signos opuestos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el producto de signos contrarios es negativo.'
errores_frecuentes:
  - 'Asignar un término constante positivo al multiplicar dos no comunes con distinto signo.'
  - 'Asignar al término central el signo del número de menor valor absoluto al sumar no comunes con distinto signo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar las reglas de adición y multiplicación de enteros en los no comunes.'
  - 'Escribir todos los términos negativos cuando ambos no comunes son negativos.'
afirmaciones_verdaderas:
  - 'Existen 4 combinaciones posibles de signos para los trinomios mónicos según los signos de sus términos no comunes.'
  - 'El término constante es positivo si los no comunes tienen el mismo signo y negativo si tienen distinto signo.'
al_terminar_debes_poder: 'Manejar sistemáticamente las 4 combinaciones de signos en el producto de binomios con término común.'
