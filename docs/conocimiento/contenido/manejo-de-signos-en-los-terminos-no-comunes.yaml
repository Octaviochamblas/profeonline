  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer $a$ y $b$ conservando estrictamente su signo positivo o negativo.'
- 'Paso 2: Calcular la suma algebraica $a + b$ para fijar el signo y coeficiente de
  $x$.'
- 'Paso 3: Calcular el producto $a \cdot b$ aplicando la ley de signos para fijar
  el último término.'
errores_correccion: '- **Error 1: Asignar signo negativo al término independiente
  al multiplicar dos números negativos.** **Cómo corregirlo:** La multiplicación de
  dos números negativos da un resultado POSITIVO ($(-a) \cdot (-b) = +ab$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle el producto $(x - 6)(x - 4)$.
  alternativas:
  - $x^2 - 10x + 24$
  - $x^2 - 10x - 24$
  - $x^2 + 10x + 24$
  respuesta: $x^2 - 10x + 24$
  solucion_pasos:
  - '1. Suma: $-6 + (-4) = -10$.'
  - '2. Producto: $(-6)(-4) = +24$.'
  - '3. Resultado: $x^2 - 10x + 24$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(y + 9)(y - 2)$?
  alternativas:
  - $y^2 + 7y - 18$
  - $y^2 - 7y - 18$
  - $y^2 + 7y + 18$
  respuesta: $y^2 + 7y - 18$
  solucion_pasos:
  - '1. Suma: $+9 - 2 = +7$.'
  - '2. Producto: $(+9)(-2) = -18$.'
  - '3. Resultado: $y^2 + 7y - 18$.'
- titulo: ¿El producto de $(m - 5)(m - 2)$ da como resultado $m^2 - 7m + 10$ con signo
    positivo al final?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-5) \cdot (-2) = +10$, por lo que el término independiente es positivo.
- titulo: ¿Si dos números tienen signos opuestos, su producto puede ser positivo?
  respuesta: 'No'
  solucion_pasos:
  - No, el producto de dos números reales de distinto signo es estrictamente negativo.
errores_frecuentes:
- Asignar signo negativo al término independiente cuando ambos términos no comunes
  son negativos.
- Sumar los valores absolutos de los no comunes ignorando el signo negativo de uno
  de ellos.
- Declarar que $(x - 5)(x + 2)$ produce un término independiente positivo $+10$.
- Multiplicar los signos en la suma del término central en lugar de restar los valores
  absolutos.
- Declarar que el signo del término central siempre es positivo.
afirmaciones_verdaderas:
- Al multiplicar dos binomios con no comunes negativos, el término independiente resulta
  estrictamente positivo.
- El signo del término central depende del signo del sumando no común de mayor valor
  absoluto.
al_terminar_debes_poder: Al terminar serás capaz de determinar los signos exactos
  del trinomio resultante para cualquier combinación de signos en los no comunes.
