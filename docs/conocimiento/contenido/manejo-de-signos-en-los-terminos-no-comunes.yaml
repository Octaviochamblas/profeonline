procedimiento:
- 'Paso 1: Si los signos son distintos:'
- 'Paso 2: Para el medio: Resta los valores absolutos. Ponle el signo del número mayor.'
- 'Paso 3: Para el final: Multiplica los valores y pon siempre signo negativo.'
- 'Suma: $-6 + 2 = -4$. Producto: $-6 \cdot 2 = -12$. Resulta: $y^2 - 4y - 12$.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en manejo de signos en los términos no comunes.
ejemplos:
- titulo: Signos opuestos, mayor positivo
  enunciado: Calcula $(x + 9)(x - 4)$.
  solucion_pasos:
  - 'Suma de no comunes: $9 + (-4) = +5$.'
  - 'Producto de no comunes: $9 \\\\\\cdot (-4) = -36$.'
  - 'Resultado: $x^2 + 5x - 36$.'
- titulo: Encuentra el valor de $(p - 11)(p - 3)$
  enunciado: 'Encuentra el valor de $(p - 11)(p - 3)$.


    Opciones: A) $p^2 - 14p + 33$ · B) $p^2 - 14p - 33$ · C) $p^2 + 14p + 33$ · D)
    $p^2 + 8p - 33$'
  solucion_pasos:
  - 'Suma: $-11 + -3 = -14$. Producto: $(-11)(-3) = +33$.'
  - 'Respuesta: $p^2 - 14p + 33$'
- titulo: 'Respecto de «Manejo de signos en los términos no comunes»: ¿Es correcta
    esta caracterización'
  enunciado: 'Respecto de «Manejo de signos en los términos no comunes»: ¿Es correcta
    esta caracterización? «En el producto $(x+a)(x-b)$: - La **suma algebraica** de
    los no comunes define el coeficiente lineal: $(a - b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En el producto $(x+a)(x-b)$:
    - La **suma algebraica** de los no comunes define el coeficiente lineal: $(a -
    b)$.'
- titulo: 'Respecto de «Manejo de signos en los términos no comunes»: ¿Es válida esta
    afirmación? «Apli'
  enunciado: 'Respecto de «Manejo de signos en los términos no comunes»: ¿Es válida
    esta afirmación? «Aplicar la regla de los signos de la multiplicación a la suma,
    asumiendo que el término central siempre será negativo si los signos difieren»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En el producto $(x+a)(x-b)$:
    - La **suma algebraica** de los no comunes define el coeficiente lineal: $(a -
    b)$.'
errores_frecuentes:
- Aplicar la regla de los signos de la multiplicación a la suma, asumiendo que el
