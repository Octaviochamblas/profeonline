semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.RESTRICCION_FUNCION_INTERNA
resumen_inicial: El análisis de la restricción del dominio de la función interna establece el primer filtro de valores permitidos para la variable independiente $x$.
explicacion_simple: |
  En la composición **$(f \circ g)(x) = f(g(x))$**:

  - La función **$g(x)$ es la primera en actuar** sobre la entrada $x$.
  - Si un número $x$ **no se puede ingresar en $g(x)$** (por ejemplo, porque causa una división por cero en $g$), ese número queda eliminado de inmediato.
  - El proceso de evaluación ni siquiera puede comenzar si $x$ está fuera del dominio de la función interna $g$.
explicacion_formal: |
  Dada la expresión compuesta $(f \circ g)(x) = f(g(x))$, la primera condición del dominio compuesto establece la pertenencia obligatoria al dominio de la función interna:

  $$\text{Dom}(f \circ g) \subseteq \text{Dom}(g)$$

  **Formalización matemática:**
  Si $x \notin \text{Dom}(g)$, la evaluación $g(x)$ es indefinida en $\mathbb{R}$, lo que imposibilita la posterior aplicación de la función externa $f$.
definiciones_clave: |
  - **Restricción de la función interna**: Conjunto de restricciones algebraicas sobre $x$ impuestas directamente por la fórmula de $g(x)$.
propiedades_relaciones: |
  - **Primer filtro del dominio compuesto**: Todo elemento del dominio de la composición $(f \circ g)$ debe pertenecer necesariamente al dominio de $g$.
ejemplo_guiado:
  enunciado: 'Dadas $g(x) = \frac{1}{x - 2}$ y $f(u) = 3u + 1$, analiza la restricción inicial del dominio impuesta por la función interna $g$.'
  pasos:
    - 'Paso 1: Examinar la fórmula de la función interna $g(x) = \frac{1}{x - 2}$.'
    - 'Paso 2: Identificar posibles indefiniciones (división por cero): $x - 2 = 0 \implies x = 2$.'
    - 'Paso 3: Excluir dicho valor del dominio de $g$: $\text{Dom}(g) = \mathbb{R} \setminus \{2\}$.'
    - 'Paso 4: Concluir que el valor $x = 2$ queda excluido automáticamente del dominio de la composición $(f \circ g)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la composición $(f \circ g)(x)$, ¿cuál es la primera condición que debe cumplir la variable $x$?'
    choices:
      - {text: 'Debe pertenecer al dominio de la función interna g.', is_correct: true}
      - {text: 'Debe ser un número entero positivo.', is_correct: false}
      - {text: 'Debe hacer que la función externa valga cero.', is_correct: false}
      - {text: 'Debe pertenecer al recorrido de f.', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe pertenecer al dominio de la función interna g.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si $g(x) = \frac{1}{x - 2}$ y $f(u) = 3u + 1$, ¿qué valor de $x$ está excluido del dominio de $(f \circ g)$ por la función interna?'
    choices:
      - {text: '$x = 2$', is_correct: true}
      - {text: '$x = 0$', is_correct: false}
      - {text: '$x = -3$', is_correct: false}
      - {text: '$x = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 2$''. $g(2)$ no está definida en $\mathbb{R}$ por división por cero.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Observar la fórmula de la función interna $g(x)$.'
  - 'Paso 2: Identificar valores de $x$ que produzcan divisiones por cero, raíces de índice par negativas o logaritmos de números no positivos.'
  - 'Paso 3: Explicitar el dominio de la función interna $\text{Dom}(g)$.'
  - 'Paso 4: Conservar la restricción $x \in \text{Dom}(g)$ como requisito obligatorio para el dominio total de $(f \circ g)$.'
errores_correccion: |
  - **Error común:** Omitir las restricciones de la función interna $g$ si estas "desaparecen" algebraicamente al simplificar la fórmula de la composición.
  - **Cómo corregirlo:** Las restricciones de la función interna se deben respetar **SIEMPRE**, incluso si la fórmula final simplificada parece no tenerlas.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de composición de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de composición de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La restricción del dominio de la función interna $g(x)$ deja de ser válida si la fórmula final de la composición se puede simplificar.'
  - 'En la composición $(f \circ g)(x)$, la variable $x$ se ingresa primero en la función externa $f$.'
  - 'Si la función interna es $g(x) = \sqrt{x}$, el valor $x = -4$ se puede evaluar sin inconvenientes en la composición.'
  - 'El dominio de la función interna $g$ no afecta la existencia de la función compuesta $(f \circ g)$.'
  - 'Cualquier número real $x$ puede evaluarse en $(f \circ g)(x)$ independientemente de si $g(x)$ existe.'
afirmaciones_verdaderas:
  - 'La primera restricción obligatoria para el dominio de una función compuesta $(f \circ g)(x)$ es que la variable $x$ pertenezca al dominio de la función interna $g$.'
  - 'Las restricciones del dominio de la función interna deben conservarse aun cuando la expresión algebraica simplificada de $(f \circ g)(x)$ oculte dicha restricción.'
al_terminar_debes_poder: |
  QUÉ: Identificar y aplicar la restricción de dominio proveniente de la función interna en una composición.
  CÓMO: Hallar $\text{Dom}(g)$ detectando indefiniciones en $g(x)$ e incluir dicho conjunto como condición base para el dominio de $(f \circ g)$.
fuente: 'Texto escolar MINEDUC — Álgebra / Composición de Funciones'
