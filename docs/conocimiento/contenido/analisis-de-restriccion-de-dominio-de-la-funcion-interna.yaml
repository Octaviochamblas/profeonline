semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.RESTRICCION_FUNCION_INTERNA
resumen_inicial: Toda restricción del dominio de la función interna $g$ se transfiere obligatoriamente a la función compuesta $(f \circ g)$, ya que si un valor no puede ser evaluado por $g$, el proceso compuesto no puede iniciarse.
explicacion_simple: '![Toda restricción del dominio de la función interna $g$ se transfiere obligatoriamente a la función compuesta $(f \circ g)$, ya que si un valor no puede ser evaluado por $g$, el proceso compuesto no puede iniciarse](/static/img/nodos/analisis-de-restriccion-de-dominio-de-la-funcion-interna-intro.svg)



  La función interna $g$ es la **primera puerta de entrada** de la cadena:

  - Si un número $x$ está prohibido en $g$ (por ejemplo, porque divide por cero o genera una raíz negativa en $g$), **queda automáticamente prohibido para toda la composición**.

  - No importa qué tan sencilla o bonita quede la fórmula final después de simplificar: si el número no podía entrar a $g$, **tampoco puede entrar a $(f \circ g)$**.'
explicacion_formal: 'Sea $(f \circ g)(x) = f(g(x))$. Por definición formal de composición:

  $$x \notin \text{Dom}(g) \implies g(x) \text{ no está definido} \implies f(g(x)) \text{ no existe}$$


  Esto establece el principio de **herencia incondicional de restricciones internas**:

  $$\text{Dom}(f \circ g) \subseteq \text{Dom}(g)$$


  **El peligro de las simplificaciones algebraicas aparentes:**

  - Sea $g(x) = \sqrt{x}$ (con $\text{Dom}(g) = [0, +\infty[$) y $f(u) = u^2$ (con $\text{Dom}(f) = \mathbb{R}$).

  - La expresión algebraica parece simplificarse a $f(g(x)) = (\sqrt{x})^2 = x$.

  - Sin embargo, $\text{Dom}(f \circ g) = [0, +\infty[$ y **no todo $\mathbb{R}$**, porque los números negativos no pueden pasar por la raíz inicial.'
definiciones_clave: '- **Herencia de restricciones**: Principio por el cual los valores excluidos de $g$ quedan indefectiblemente excluidos de $f \circ g$.

  - **Simplificación condicionada**: Reducción algebraica cuya validez queda acotada al dominio original pre-simplificación.'
propiedades_relaciones: '- **Puntos no removibles**: Las asíntotas verticales o discontinuidades de $g$ persisten como agujeros de dominio en la composición.

  - **Condición necesaria**: $x \in \text{Dom}(g)$ es una condición necesaria (aunque no siempre suficiente) para que exista $(f \circ g)(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Toda restricción del dominio de la función interna $g$ se transfiere obligatoriamente a la función compuesta $(f \circ g)$, ya que si un valor no puede ser evaluado por $g$, el proceso compuesto no puede iniciarse](/static/img/nodos/analisis-de-restriccion-de-dominio-de-la-funcion-interna-ejemplos.svg)



    Analiza el dominio de la función compuesta $(f \circ g)(x)$ para $g(x) = \frac{1}{x - 3}$ y $f(u) = 2u + 5$.'
  pasos:
  - 'Paso 1: Analizar la función interna $g(x) = \frac{1}{x - 3}$.'
  - 'Paso 2: Identificar la restricción del denominador: $x - 3 \neq 0 \implies x \neq 3$.'
  - 'Paso 3: Establecer el dominio de la interna: $\text{Dom}(g) = \mathbb{R} \setminus \{3\}$.'
  - "Paso 4: Analizar la función externa: $f(u) = 2u + 5$ es polinómica y no impone restricciones adicionales ($\text{Dom}(f) = \\mathbb{R}$)."
  - 'Paso 5: Concluir que el dominio resultante hereda la restricción de $g$: $\text{Dom}(f \circ g) = \mathbb{R} \setminus \{3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $g(x) = \sqrt{x}$ y $f(u) = u^2$, ¿cuál es el dominio exacto de $(f \circ g)(x)$?
  choices:
  - text: '[0, +inf[ (los numeros reales no negativos).'
    is_correct: true
  - text: Todos los numeros reales R porque (sqrt(x))^2 = x.
    is_correct: false
  - text: ']0, +inf[.'
    is_correct: false
  - text: El conjunto vacio.
    is_correct: false
  explanation: La alternativa correcta es '[0, +inf[ (los numeros reales no negativos).'. Se hereda la restricción de existencia de la raíz interna.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con un valor $x_0$ que anula el denominador de la función interna $g(x)$?
  choices:
  - text: Queda excluido obligatoriamente del dominio de la composicion.
    is_correct: true
  - text: Se puede incluir si la externa no tiene fracciones.
    is_correct: false
  - text: Se convierte en una raiz de la funcion compuesta.
    is_correct: false
  - text: Depende del signo de x0.
    is_correct: false
  explanation: La alternativa correcta es 'Queda excluido obligatoriamente del dominio de la composicion.'. La cadena no puede iniciarse.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar la fórmula de la función interna $g(x)$ en busca de denominadores, raíces pares o logaritmos.'
- 'Paso 2: Calcular el conjunto $\text{Dom}(g)$ determinando todos los valores prohibidos de $x$.'
- 'Paso 3: Registrar que ningún valor fuera de $\text{Dom}(g)$ puede formar parte del dominio compuesto.'
- 'Paso 4: Proceder a analizar las restricciones adicionales de la función externa.'
errores_correccion: '- **Error común:** Afirmar que como $(\sqrt{x})^2 = x$ es una recta, su dominio son todos los reales $\mathbb{R}$.

  - **Cómo corregirlo:** La simplificación algebraica solo es válida **dentro del dominio de la función que actúa primero** ($x \ge 0$).'
ejemplos:
- titulo: 'Ejemplo 1: Raíz en función interna'
  enunciado: Para $g(x) = \sqrt{x - 5}$ y $f(u) = 3u - 1$, ¿cuál es el dominio de $f \circ g$?
  alternativas:
  - '[5, +inf['
  - R \ {5}
  - ']-inf, 5]'
  - Todos los reales R
  respuesta: '[5, +inf['
  solucion_pasos:
  - 'Paso 1: $x - 5 \ge 0 \implies x \ge 5$, $f$ no agrega restricciones, luego $[5, +\infty[$.'
- titulo: 'Ejemplo 2: Denominador en función interna'
  enunciado: Si $g(x) = \frac{2}{x + 7}$ y $f(u) = u^3$, ¿qué valor de $x$ no pertenece al dominio?
  alternativas:
  - x = -7
  - x = 7
  - x = 0
  - x = -2
  respuesta: x = -7
  solucion_pasos:
  - 'Paso 1: $x + 7 = 0 \implies x = -7$ está prohibido en $g$ y en la composición.'
- titulo: 'Ejemplo 3: Raíz par de índice cuatro'
  enunciado: Si $g(x) = \sqrt[4]{2 - x}$ y $f(u) = 5u + 2$, ¿cuál es el dominio?
  alternativas:
  - ']-inf, 2]'
  - '[2, +inf['
  - R \ {2}
  - '[-2, 2]'
  respuesta: ']-inf, 2]'
  solucion_pasos:
  - 'Paso 1: $2 - x \ge 0 \implies x \le 2 \implies ]-\infty, 2]$.'
- titulo: 'Ejemplo 4: Fracción algebraica interna'
  enunciado: Si $g(x) = \frac{x - 1}{x - 4}$ y $f(u) = 10u$, ¿cuál es el dominio de $f \circ g$?
  alternativas:
  - R \ {4}
  - R \ {1}
  - R \ {1, 4}
  - Todos los reales R
  respuesta: R \ {4}
  solucion_pasos:
  - 'Paso 1: El denominador de $g$ no puede ser cero ($x \neq 4$).'
errores_frecuentes:
- Ignorar las restricciones de g tras simplificar la expresión.
- Olvidar que las raíces de índice par exigen radicando mayor o igual a cero.
- Asumir que si f es afín, el dominio de la composición siempre es R.
afirmaciones_verdaderas:
- Cualquier valor excluido del dominio de la función interna queda excluido de la función compuesta.
- La simplificación algebraica de (f o g)(x) preserva las restricciones de dominio originales de g(x).
al_terminar_debes_poder: '**QUÉ:** Identificar y justificar las restricciones heredadas de la función interna en una composición.


  **CÓMO:** Determinando Dom(g) y aplicando el principio Dom(f ∘ g) ⊆ Dom(g) para descartar valores no permitidos.


