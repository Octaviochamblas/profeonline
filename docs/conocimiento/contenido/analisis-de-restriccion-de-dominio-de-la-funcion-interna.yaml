semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.RESTRICCION_FUNCION_INTERNA
resumen_inicial: Cualquier restricción del dominio de la función interna $g$ se hereda
  directamente en el dominio de la composición $(f \circ g)(x)$.
explicacion_simple: 'Si un número $x$ destruye o anula a la **función interna $g$**,
  ese número queda **ELIMINADO AUTOMÁTICAMENTE** del dominio de toda la composición
  $(f \circ g)(x)$.

  - Si $g(x) = \frac{1}{x}$, sabemos que $x = 0$ está prohibido para $g$.

  - Por lo tanto, sin importar qué tan simple sea la función externa $f$, $x = 0$
  jamás podrá formar parte del dominio de $(f \circ g)(x)$.'
explicacion_formal: Definición formal de restricción en composición de funciones.
definiciones_clave: '- **Restricción funcional**: Condición algebraica que limita
  los valores de entrada de una composición.'
propiedades_relaciones: '- **Heredabilidad de restricciones**: Las restricciones de
  la función interna se transfieren íntegramente a la función compuesta.'
ejemplo_guiado:
  enunciado: Análisis de restricciones en composición de funciones.
  pasos:
  - 'Paso 1: Identificar las restricciones de la función interna.'
  - 'Paso 2: Identificar las restricciones de la función externa.'
  - 'Paso 3: Intersecar ambas condiciones.'
  - 'Paso 4: Concluir el dominio restringido.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo afectan las restricciones de la función interna al dominio de la
    composición?
  choices:
  - text: Se heredan directamente excluyendo dichos valores del dominio de la composición.
    is_correct: true
  - text: Se eliminan y desaparecen.
    is_correct: false
  - text: Se multiplican por dos.
    is_correct: false
  - text: No tienen ningún efecto.
    is_correct: false
  explanation: La alternativa correcta es 'Se heredan directamente excluyendo dichos
    valores del dominio de la composición.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué condición debe cumplir la salida $g(x)$ para entrar en la función
    externa $f(u) = \sqrt{u}$?
  choices:
  - text: La salida $g(x)$ debe ser mayor o igual a cero ($g(x) \ge 0$).
    is_correct: true
  - text: La salida debe ser strictly negativa.
    is_correct: false
  - text: La salida debe ser igual a cero obligatoriamente.
    is_correct: false
  - text: No requiere cumplir ninguna condición.
    is_correct: false
  explanation: La alternativa correcta es 'La salida $g(x)$ debe ser mayor o igual
    a cero ($g(x) \ge 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analizar las restricciones de la función de entrada.'
- 'Paso 2: Analizar las restricciones sobre la salida intermedia.'
- 'Paso 3: Excluir los valores no permitidos.'
errores_correccion: '- **Error común:** Ignorar la restricción de la función interna
  si la fórmula simplificada la disimula.

  - **Cómo corregirlo:** La restricción de la función interna nunca puede anularse
  en la composición.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
fuente: Texto escolar MINEDUC — Álgebra / Composición de Funciones
