semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.RESTRICCION_FUNCION_INTERNA
resumen_inicial: 'Análisis de restricción de dominio de la función interna: conceptos,
  representación y propiedades en Composición de funciones.'
explicacion_simple: La primera regla que nunca se puede saltar en una composición
  es respetar las restricciones propias de la función que actúa primero.
explicacion_formal: '### Definición formal


  Para que $(f\circ g)(x)$ tenga sentido, se requiere primero que $x \in \text{Dom}(g)$;
  esta es una condición necesaria (aunque no suficiente por sí sola) para que la composición
  esté definida en $x$.


  ### Desarrollo didáctico


  Si la función interna $g$ ya tiene restricciones propias (como una raíz o una fracción),
  esas restricciones se heredan automáticamente a la composición completa, sin importar
  qué tan simple sea la función externa $f$.


  Si $g(x)=\sqrt{x-4}$ (dominio $[4,+\infty[$) y $f(x)=x+10$ (sin restricciones):
  la composición $(f\circ g)(x)=\sqrt{x-4}+10$ hereda la restricción $x\geq4$ directamente
  de $g$, aunque $f$ no imponga ninguna restricción propia.'
definiciones_clave: '- **Análisis de restricción de dominio de la función interna**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a análisis de restricción de dominio de la
  función interna.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a análisis de restricción
    de dominio de la función interna.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a análisis de restricción de dominio
    de la función interna.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    análisis de restricción de dominio de la función interna?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en composición de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en composición de funciones. Es la condición de
    existencia y unicidad en análisis de restricción de dominio de la función interna.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en análisis de restricción
    de dominio de la función interna, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica las restricciones propias de la función interna $g$ (divisiones,
  raíces de índice par, etc.).'
- 'Paso 2: Esas restricciones deben cumplirse siempre, sin importar la función externa
  $f$.'
- 'Paso 3: Inclúyelas como parte del dominio final de la composición.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar análisis de restricción de dominio de la función interna.
ejemplos:
- titulo: Restricción heredada de una raíz
  enunciado: Si $g(x)=\sqrt{x+6}$ y $f(x)=2x$, ¿qué restricción del dominio de $g$
    se hereda a $(f\circ g)(x)$?
  solucion_pasos:
  - El dominio de $g$ exige $x+6\geq0$, es decir $x\geq-6$.
  - Esta restricción se hereda directamente a la composición.
- titulo: Restricción heredada de una fracción
  enunciado: Si $g(x)=\frac{1}{x-3}$ y $f(x)=x^2$, ¿qué restricción del dominio de
    $g$ se hereda a $(f\circ g)(x)$?
  solucion_pasos:
  - El dominio de $g$ exige $x\neq3$.
  - Esta restricción se hereda a la composición, independiente de que $f$ no tenga
    restricciones.
- titulo: ¿Las restricciones de la función interna siempre se heredan a la composición?
  enunciado: ¿Las restricciones de la función interna siempre se heredan a la composición?
  respuesta: Sí
  solucion_pasos:
  - Son una condición necesaria para que $x$ sea siquiera evaluable en $g$, el primer
    paso de la composición.
- titulo: ¿Puede una función externa sin restricciones eliminar las restricciones
    heredadas de la interna?
  enunciado: ¿Puede una función externa sin restricciones eliminar las restricciones
    heredadas de la interna?
  respuesta: 'No'
  solucion_pasos:
  - Las restricciones de la función interna siempre deben respetarse, independientemente
    de las propiedades de la función externa.
errores_frecuentes:
- Ignorar las restricciones propias de la función interna al determinar el dominio
  de la composición.
- Suponer que si la función externa no tiene restricciones, la composición tampoco
  las tiene.
- Confundir las restricciones de la función interna con las de la externa.
- Olvidar intersectar esta restricción con las que eventualmente imponga la función
  externa.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando análisis
  de restricción de dominio de la función interna.
