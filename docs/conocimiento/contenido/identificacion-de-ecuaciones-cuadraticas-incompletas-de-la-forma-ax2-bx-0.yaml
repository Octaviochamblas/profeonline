semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_BINOMIA
resumen_inicial: Una ecuación cuadrática es incompleta binomia de la forma $a x^2
  + b x = 0$ cuando su término independiente es cero ($c = 0$).
explicacion_simple: 'Una **ecuación cuadrática incompleta binomia** se caracteriza
  porque le falta el número suelto constante ($c = 0$):

  - Tiene la estructura $a x^2 + b x = 0$.

  - Ejemplo: $3x^2 - 12x = 0$ (donde $a = 3$, $b = -12$ y $c = 0$).

  - Todos sus términos contienen la variable $x$, por lo que se puede resolver fácilmente
  sacando $x$ como factor común.'
explicacion_formal: 'La **ecuación cuadrática incompleta de la forma $a x^2 + b x
  = 0$** es la restricción canónica con constante nula:


  $$a x^2 + b x = 0 \quad \text{con } a \neq 0, \quad b \neq 0 \quad \land \quad c
  = 0$$


  **Desglose de la fórmula:**

  - Factorización elemental por factor común: $x(a x + b) = 0 \implies x_1 = 0 \quad
  \lor \quad x_2 = -\frac{b}{a}$.'
definiciones_clave: '- **Incompleta binomia ($a x^2 + b x = 0$)**: Ecuación de dos
  términos con $c = 0$ donde la variable $x$ es factor común de la expresión.'
propiedades_relaciones: '- **Raíz nula garantizada**: Toda ecuación de la forma $a
  x^2 + b x = 0$ admite siempre como una de sus soluciones a $x = 0$.'
ejemplo_guiado:
  enunciado: Identifica los coeficientes y clasifica la ecuación cuadrática $6x^2
    = 18x$.
  pasos:
  - 'Paso 1: Trasponer el término $18x$ al miembro izquierdo: $6x^2 - 18x = 0$.Paso
    2: Extraer coeficientes: $a = 6$, $b = -18$ y $c = 0$.Paso 3: Notar la ausencia
    del término constante ($c = 0$).Paso 4: Concluir que es una ECUACIÓN INCOMPLETA
    BINOMIA de la forma $a x^2 + b x = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reordenar $6x^2 = 18x$ como $6x^2 - 18x = 0$, ¿qué tipo de ecuación
    cuadrática se identifica?
  choices:
  - text: Incompleta binomia de la forma $a x^2 + b x = 0$, con $c = 0$.
    is_correct: true
  - text: Incompleta pura de la forma $a x^2 + c = 0$.
    is_correct: false
  - text: Completa.
    is_correct: false
  - text: Monomia.
    is_correct: false
  explanation: La alternativa correcta es 'Incompleta binomia de la forma $a x^2 +
    b x = 0$, con $c = 0$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué solución real está SIEMPRE presente en cualquier ecuación cuadrática
    de la forma $a x^2 + b x = 0$?
  choices:
  - text: $x = 0$
    is_correct: true
  - text: $x = 1$
    is_correct: false
  - text: $x = -1$
    is_correct: false
  - text: No tiene soluciones reales.
    is_correct: false
  explanation: La alternativa correcta es '$x = 0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Llevar la ecuación a la forma general igualando a cero.'
- 'Paso 2: Verificar que el término constante $c$ sea igual a 0.'
- 'Paso 3: Comprobar que contenga término cuadrático y lineal ($a \neq 0$ y $b \neq
  0$).'
- 'Paso 4: Clasificar como incompleta binomia $a x^2 + b x = 0$.'
errores_correccion: '- **Error común:** Simplificar dividiendo por $x$ a ambos lados
  (hacer $6x^2 = 18x \implies 6x = 18 \implies x = 3$).

  - **Cómo corregirlo:** JAMÁS dividas una ecuación entre la incógnita $x$; al hacerlo
  eliminas y pierdes la solución fundamental $x = 0$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado
estado: publicado
