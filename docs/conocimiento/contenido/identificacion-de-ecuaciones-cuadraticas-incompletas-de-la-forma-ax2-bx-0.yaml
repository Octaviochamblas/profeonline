semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_BINOMIA
resumen_inicial: 'Identificación de ecuaciones cuadráticas incompletas de la forma
  ax² + bx = 0: concepto, discriminante, soluciones y modelamiento en Conceptos y
  formas de la ecuación cuadrática.'
explicacion_simple: Cuando a una ecuación cuadrática le falta el número suelto (el
  término independiente), quedan solo dos términos con la incógnita presente en ambos.
explicacion_formal: '### Definición formal


  Una ecuación de segundo grado es incompleta binomia si tiene la forma $ax^2+bx=0$,
  es decir, $c=0$ mientras $a \neq 0$ y $b \neq 0$. El término independiente está
  ausente.


  ### Desarrollo didáctico


  Se reconoce porque, al ordenar la ecuación en forma general, no queda ningún número
  suelto: solo aparecen los términos con $x^2$ y con $x$.


  La ecuación $3x^2-12x=0$ es incompleta binomia: no hay término independiente, pero
  sí están presentes tanto $x^2$ como $x$.'
definiciones_clave: '- **Identificación de ecuaciones cuadráticas incompletas de la
  forma ax² + bx = 0**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  de ecuaciones cuadráticas incompletas de la forma ax² + bx = 0.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando identificación de
    ecuaciones cuadráticas incompletas de la forma ax² + bx = 0.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a identificación de ecuaciones
    cuadráticas incompletas de la forma ax² + bx = 0.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
