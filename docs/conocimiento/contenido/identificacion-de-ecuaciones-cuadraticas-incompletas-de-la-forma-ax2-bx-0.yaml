semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_BINOMIA
resumen_inicial: Una ecuación incompleta binomia de la forma $ax^2 + bx = 0$ carece de término independiente ($c = 0$) y siempre tiene a $x = 0$ como una de sus soluciones.
explicacion_simple: |
  Una **ecuación cuadrática incompleta binomia** es aquella donde **falta el término independiente** ($c = 0$):

  $$ax^2 + bx = 0 \quad \text{con } a \neq 0 \text{ y } b \neq 0$$

  - **Ejemplo**: $3x^2 - 12x = 0$.
  - Como no hay número suelto ($c = 0$), se puede **factorizar fácilmente por $x$**:
    $$x(3x - 12) = 0$$
  - De esta factorización se obtiene de forma inmediata que **una solución es siempre $x_1 = 0$**, y la otra solución se halla igualando a cero el paréntesis ($3x - 12 = 0 \implies x_2 = 4$).
explicacion_formal: |
  Dada la ecuación cuadrática $ax^2 + bx + c = 0$, se clasifica como **incompleta binomia** a la expresión donde el constante es nulo pero el coeficiente lineal es no nulo:

  $$a \neq 0, \ b \neq 0, \ c = 0 \implies ax^2 + bx = 0$$

  **Propiedad estructural de raíces:**
  Al aplicar el Teorema del Factor Cero sobre la factorización $x(ax + b) = 0$, el conjunto solución $S$ satisface obligatoriamente:

  $$S = \left\{0, -\frac{b}{a}\right\}$$
definiciones_clave: |
  - **Ecuación cuadrática incompleta binomia**: Ecuación de segundo grado donde el término independiente es cero ($c = 0$) y el coeficiente lineal es distinto de cero ($b \neq 0$).
propiedades_relaciones: |
  - **Raíz nula garantizada**: Toda ecuación de la forma $ax^2 + bx = 0$ posee invariablemente como una de sus soluciones reales al número cero ($x_1 = 0$).
ejemplo_guiado:
  enunciado: 'Identifica la estructura de la ecuación $5x^2 + 20x = 0$, verifica si es incompleta binomia y encuentra su conjunto solución.'
  pasos:
    - 'Paso 1: Extraer coeficientes: $a = 5 \neq 0$, $b = 20 \neq 0$, $c = 0$.'
    - 'Paso 2: Confirmar clasificación: como $c = 0$ y $b \neq 0$, es una ecuación incompleta binomia.'
    - 'Paso 3: Factorizar por $x$: $x(5x + 20) = 0$.'
    - 'Paso 4: Igualar factores a cero: $x_1 = 0$ y $5x + 20 = 0 \implies x_2 = -4$. Conjunto solución $S = \{0, -4\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué solución real está SIEMPRE presente en cualquier ecuación cuadrática de la forma $ax^2 + bx = 0$?'
    choices:
      - {text: 'La solución $x = 0$', is_correct: true}
      - {text: 'La solución $x = 1$', is_correct: false}
      - {text: 'La solución $x = -1$', is_correct: false}
      - {text: 'No tiene ninguna solución real', is_correct: false}
    explanation: 'La alternativa correcta es ''La solución $x = 0$''. Al factorizar por $x$, $x = 0$ es siempre raíz.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son los coeficientes de la ecuación incompleta binomia $2x^2 - 8x = 0$?'
    choices:
      - {text: '$a = 2$, $b = -8$, $c = 0$', is_correct: true}
      - {text: '$a = 2$, $b = 0$, $c = -8$', is_correct: false}
      - {text: '$a = 2$, $b = -8$, $c = 1$', is_correct: false}
      - {text: '$a = 0$, $b = 2$, $c = -8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = 2$, $b = -8$, $c = 0$''. Carece de término independiente $c$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Transponer los términos para igualar la ecuación a cero en la forma $ax^2 + bx = 0$.'
  - 'Paso 2: Verificar que $a \neq 0$, $b \neq 0$ y $c = 0$.'
  - 'Paso 3: Factorizar la variable $x$ como factor común: $x(ax + b) = 0$.'
  - 'Paso 4: Obtener las dos soluciones: $x_1 = 0$ y $x_2 = -\frac{b}{a}$.'
errores_correccion: |
  - **Error común:** Cancelar o simplificar la $x$ dividiendo toda la ecuación entre $x$ (ej. simplificar $3x^2 = 6x$ a $3x = 6$).
  - **Cómo corregirlo:** **NUNCA DIVIDAS POR LA VARIABLE $x$**, porque al hacerlo eliminas y pierdes la solución fundamental $x = 0$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Resolución de ecuación binomia.
    alternativas:
      - '$S = \{0, 5\}$'
      - '$S = \{5\}$'
      - '$S = \{-5, 5\}$'
    respuesta: '$S = \{0, 5\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Raíces de $4x^2 + 12x = 0$.
    alternativas:
      - '$S = \{0, -3\}$'
      - '$S = \{0, 3\}$'
      - '$S = \{-3\}$'
    respuesta: '$S = \{0, -3\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La simplificación de la ecuación $x^2 = 4x$ mediante la división por la variable $x$ es una operación que conserva todas las soluciones.'
  - 'Una ecuación incompleta binomia de la forma $ax^2 + bx = 0$ carece de soluciones en el conjunto de los números reales.'
  - 'El conjunto solución de la ecuación $2x^2 - 6x = 0$ está formado únicamente por el valor numérico $x = 3$.'
  - 'En una ecuación incompleta binomia, el coeficiente lineal $b$ debe valer cero obligatoriamente.'
  - 'La factorización por factor común $x$ exige que el término independiente $c$ sea un número positivo.'
afirmaciones_verdaderas:
  - 'Una ecuación cuadrática incompleta binomia tiene la forma $ax^2 + bx = 0$ con $c = 0$, teniendo siempre a $x = 0$ como una de sus raíces.'
  - 'Las dos soluciones reales de la ecuación incompleta binomia $ax^2 + bx = 0$ son $x_1 = 0$ y $x_2 = -\frac{b}{a}$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y resolver ecuaciones cuadráticas incompletas binomias de la forma $ax^2 + bx = 0$.
  CÓMO: Comprobar que $c = 0$, factorizar por $x$ y determinar las soluciones $x_1 = 0$ y $x_2 = -\frac{b}{a}$ sin cancelar variables.
