semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_BINOMIA
resumen_inicial: Una ecuación cuadrática incompleta de la forma $ax^2 + bx = 0$ (binomia) se caracteriza por la ausencia del término independiente ($c = 0$), teniendo siempre a $x = 0$ como una de sus dos raíces reales.
explicacion_simple: "![Una ecuación cuadrática incompleta de la forma $ax^2 + bx = 0$ (binomia) se caracteriza por la ausencia del término independiente ($c = 0$), teniendo siempre a $x = 0$ como una de sus dos raíces reales](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-incompletas-de-la-forma-ax2-bx-0-intro.svg)\n\n\nUna ecuación cuadrática es **incompleta binomia** cuando le falta el número suelto (**$c = 0$**), teniendo solo dos términos con $x$:\n$$ax^2 + bx = 0$$\n\n**Propiedad mágica:**\n- Como ambos términos tienen la letra $x$, se resuelve rapidísimo **factorizando por $x$**:\n  $$x(ax + b) = 0$$\n- Para que una multiplicación dé cero, uno de los factores debe ser cero:\n  - O bien **$x = 0$** (¡siempre es una solución garantizada!).\n  - O bien $ax + b = 0 \\implies$ **$x = -\\frac{b}{a}$**."
explicacion_formal: 'Una ecuación cuadrática $P(x) = 0$ es **incompleta binomia** si su término independiente es nulo y su coeficiente lineal es no nulo:

  $$ax^2 + bx = 0 \quad \text{con } a \neq 0, \; b \neq 0, \; c = 0$$


  **Resolución analítica por el Teorema del Factor Nulo** ($A \cdot B = 0 \iff A = 0 \lor B = 0$):

  $$x(ax + b) = 0 \Longleftrightarrow x = 0 \quad \lor \quad ax + b = 0 \implies x = -\frac{b}{a}$$


  **Conjunto solución universal**:

  $$\mathcal{S} = \left\{ 0, -\frac{b}{a} \right\}$$


  **Propiedades notables:**

  - **Siempre tiene dos soluciones reales distintas** (ya que $b \neq 0 \implies -b/a \neq 0$).

  - **Paso por el origen**: La gráfica de la parábola asociada corta al eje $Y$ exactamente en el origen de coordenadas $(0, 0)$.'
definiciones_clave: '- **Ecuación incompleta binomia**: Ecuación cuadrática de dos términos donde $c = 0$ y $b \neq 0$.

  - **Teorema del factor nulo**: Propiedad algebraica donde un producto es nulo si y solo si al menos uno de sus factores es cero.'
propiedades_relaciones: '- **Peligro de división por $x$**: Está estrictamente prohibido simplificar dividiendo entre $x$ ($ax^2 = -bx \implies ax = -b$), ya que esto cancela y elimina la solución fundamental $x = 0$.

  - **Simetría del vértice**: El vértice se ubica en $x_v = -\frac{b}{2a}$, que es el punto medio exacto entre las dos raíces $0$ y $-b/a$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una ecuación cuadrática incompleta de la forma $ax^2 + bx = 0$ (binomia) se caracteriza por la ausencia del término independiente ($c = 0$), teniendo siempre a $x = 0$ como una de sus dos raíces reales](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-incompletas-de-la-forma-ax2-bx-0-ejemplos.svg)



    Resuelve la ecuación cuadrática incompleta $4x^2 - 12x = 0$ identificando sus coeficientes y aplicando factor común.'
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 4, b = -12, c = 0$ (es incompleta binomia).'
  - 'Paso 2: Factorizar por el factor común $4x$: $4x(x - 3) = 0$.'
  - 'Paso 3: Aplicar el teorema del factor nulo: $4x = 0 \lor x - 3 = 0$.'
  - 'Paso 4: Despejar cada factor: $x_1 = 0$ y $x_2 = 3$.'
  - 'Paso 5: Concluir el conjunto solución: $\mathcal{S} = \{0, 3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las soluciones de la ecuación cuadrática incompleta $ax^2 + bx = 0$ con $a, b \neq 0$?
  choices:
  - text: x1 = 0 y x2 = -b/a
    is_correct: true
  - text: x1 = b y x2 = -b
    is_correct: false
  - text: x1 = 1 y x2 = -1
    is_correct: false
  - text: Solo x = 0
    is_correct: false
  explanation: La alternativa correcta es 'x1 = 0 y x2 = -b/a'. Factorizando $x(ax + b) = 0$ se obtienen directamente ambas raíces.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué error grave se comete al resolver $5x^2 = 15x$ dividiendo ambos lados entre x para obtener $5x = 15 \implies x = 3$?
  choices:
  - text: Se pierde la solucion x = 0 al dividir entre una variable que puede ser cero.
    is_correct: true
  - text: El resultado x = 3 es incorrecto.
    is_correct: false
  - text: No se comete ningun error.
    is_correct: false
  - text: Se cambia el signo del resultado.
    is_correct: false
  explanation: La alternativa correcta es 'Se pierde la solucion x = 0 al dividir entre una variable que puede ser cero.'. Dividir por una incógnita elimina raíces.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Llevar la ecuación a la forma $ax^2 + bx = 0$ con $c = 0$.'
- 'Paso 2: Factorizar la expresión extrayendo la incógnita $x$ como factor común ($x(ax + b) = 0$).'
- 'Paso 3: Igualar a cero el primer factor para obtener la primera raíz $x_1 = 0$.'
- 'Paso 4: Igualar a cero el factor lineal interior $ax + b = 0$ y despejar $x_2 = -\frac{b}{a}$.'
errores_correccion: '- **Error común:** Dividir ambos miembros por $x$ ($2x^2 = 8x \implies 2x = 8 \implies x = 4$) perdiendo una solución.

  - **Cómo corregirlo:** **Nunca dividas por la incógnita $x$**; factoriza como $2x(x - 4) = 0$ para conservar **ambas soluciones: $x = 0$ y $x = 4$**.'
ejemplos:
- titulo: 'Ejemplo 1: Factorización con coeficientes enteros'
  enunciado: Resuelve $3x^2 - 9x = 0$.
  alternativas:
  - x = 0 y x = 3
  - x = 3 y x = -3
  - Solo x = 3
  - x = 0 y x = -3
  respuesta: x = 0 y x = 3
  solucion_pasos:
  - 'Paso 1: $3x(x - 3) = 0 \implies x = 0 \lor x = 3$.'
- titulo: 'Ejemplo 2: Coeficientes con suma'
  enunciado: Halla las raíces de $2x^2 + 10x = 0$.
  alternativas:
  - x = 0 y x = -5
  - x = 0 y x = 5
  - x = -5 y x = 5
  - Solo x = -5
  respuesta: x = 0 y x = -5
  solucion_pasos:
  - 'Paso 1: $2x(x + 5) = 0 \implies x_1 = 0, x_2 = -5$.'
- titulo: 'Ejemplo 3: Coeficiente mónic'
  enunciado: Resuelve $x^2 - x = 0$.
  alternativas:
  - x = 0 y x = 1
  - x = 1 y x = -1
  - Solo x = 1
  - No tiene solución
  respuesta: x = 0 y x = 1
  solucion_pasos:
  - 'Paso 1: $x(x - 1) = 0 \implies x = 0 \lor x = 1$.'
- titulo: 'Ejemplo 4: Coeficiente cuadrático negativo'
  enunciado: Resuelve $-5x^2 + 20x = 0$.
  alternativas:
  - x = 0 y x = 4
  - x = 0 y x = -4
  - x = 4 y x = -4
  - Solo x = 4
  respuesta: x = 0 y x = 4
  solucion_pasos:
  - 'Paso 1: $-5x(x - 4) = 0 \implies x = 0 \lor x = 4$.'
errores_frecuentes:
- Dividir la ecuación entre x eliminando la raíz x = 0.
- Usar la fórmula cuadrática general cuando una simple factorización por x toma 5 segundos.
- Olvidar que x = 0 es siempre una de las raíces en este tipo de ecuaciones.
afirmaciones_verdaderas:
- 'Toda ecuación cuadrática incompleta de la forma ax² + bx = 0 posee siempre dos soluciones reales: x1 = 0 y x2 = -b/a.'
- La factorización por factor común x es el método más directo y eficiente para resolver ax² + bx = 0.
al_terminar_debes_poder: '**QUÉ:** Identificar y resolver ecuaciones cuadráticas incompletas de la forma ax² + bx = 0.


  **CÓMO:** Factorizando por factor común x(ax + b) = 0 y deduciendo las soluciones x = 0 y x = -b/a.


