semantic_id: MAT.FUND.OPERACIONES_CONJUNTOS.UNION
resumen_inicial: 'Definición, propiedades algebraicas, representación en diagrama de Venn y cálculo de la unión de conjuntos ($A \cup B$).'
explicacion_simple: |
  La **unión de dos conjuntos** (escrita como **$A \cup B$**, con el símbolo de una "copa" $\cup$) es la operación que **junta o reúne todos los elementos** de $A$ y todos los elementos de $B$ en un solo gran conjunto. Un elemento pertenece a la unión si está en $A$, o está en $B$, o está en ambos a la vez (disyunción lógica inclusiva "o"). Si un elemento se repite en ambos, se anota una sola vez. En un diagrama de Venn, la unión se representa **sombreando o pintando por completo el interior de ambos círculos**.
explicacion_formal: |
  ### Definición formal
  En la teoría axiomática de conjuntos ($\text{ZFC}$), la **unión** de dos conjuntos $A$ y $B$ se define mediante el Axioma de Unión y el esquema de comprensión:
  $$A \cup B = \{x \in \mathcal{U} \mid x \in A \lor x \in B\}$$
  Para una familia arbitraria o infinita de conjuntos $\{A_i\}_{i \in I}$:
  $$\bigcup_{i \in I} A_i = \{x \in \mathcal{U} \mid \exists i \in I \, (x \in A_i)\}$$

  ### Desglose simbólico
  - Conectivo lógico subyacente: Disyunción inclusiva ($\lor$).
  - Propiedades algebraicas (Álgebra de Boole):
    - Conmutatividad: $A \cup B = B \cup A$.
    - Asociatividad: $(A \cup B) \cup C = A \cup (B \cup C)$.
    - Idempotencia: $A \cup A = A$.
    - Elemento neutro: $A \cup \emptyset = A$.
    - Elemento absorbente: $A \cup \mathcal{U} = \mathcal{U}$.
  - Principio de Inclusión-Exclusión: $|A \cup B| = |A| + |B| - |A \cap B|$.

  ### Síntesis didáctica
  La unión es la menor cota superior (supremo) en el retículo de subconjuntos ordenados por inclusión: $A \subseteq (A \cup B)$ y $B \subseteq (A \cup B)$.
definiciones_clave: |
  - **Unión de conjuntos ($A \cup B$)**: Conjunto que agrupa todos los elementos que pertenecen al menos a uno de los conjuntos operados.
  - **Disyunción inclusiva ($\lor$)**: Operador lógico que es verdadero si al menos una de las proposiciones componentes es verdadera.
  - **Principio de inclusión-exclusión**: Regla de corrección aditiva que descuenta los elementos duplicados de la intersección.
propiedades_relaciones: |
  - **Monotonía con la inclusión**: $A \subseteq B \iff A \cup B = B$.
  - **Leyes de De Morgan**: $(A \cup B)^c = A^c \cap B^c$.
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{1, 2, 3, 4\}$ y $B = \{3, 4, 5, 6\}$, calcula $A \cup B$, determina su cardinalidad y descríbelo en un diagrama de Venn.'
  pasos:
    - 'Paso 1: Listar todos los elementos presentes en $A$: $1, 2, 3, 4$.'
    - 'Paso 2: Listar todos los elementos presentes en $B$: $3, 4, 5, 6$.'
    - 'Paso 3: Reunir todos los elementos en un solo conjunto eliminando duplicados:
      - Los elementos $3$ y $4$ están en ambos, por lo que se escriben una sola vez.
      - $A \cup B = \{1, 2, 3, 4, 5, 6\}$.'
    - 'Paso 4: Contar la cardinalidad resultante: $|A \cup B| = 6$.'
    - 'Paso 5: Verificar con el principio de inclusión-exclusión:
      - $|A| = 4, |B| = 4, |A \cap B| = |\{3, 4\}| = 2$.
      - $|A \cup B| = 4 + 4 - 2 = 6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué conectivo lógico define formalmente la condición de pertenencia de un elemento a la unión $A \cup B$?'
    choices:
      - {text: 'La disyunción inclusiva: $x \in A \lor x \in B$', is_correct: true}
      - {text: 'La conjunción: $x \in A \land x \in B$', is_correct: false}
      - {text: 'La implicación material: $x \in A \to x \in B$', is_correct: false}
      - {text: 'La negación conjunta: $\neg(x \in A) \land \neg(x \in B)$', is_correct: false}
    explanation: 'La alternativa correcta es ''La disyunción inclusiva: $x \in A \lor x \in B$''. Basta que el elemento resida en al menos uno de los dos conjuntos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $|A| = 12$, $|B| = 15$ y $|A \cap B| = 5$, ¿cuál es la cardinalidad de la unión $|A \cup B|$?'
    choices:
      - {text: '$22$ elementos ($12 + 15 - 5$)', is_correct: true}
      - {text: '$27$ elementos', is_correct: false}
      - {text: '$17$ elementos', is_correct: false}
      - {text: '$32$ elementos', is_correct: false}
    explanation: 'La alternativa correcta es ''$22$ elementos ($12 + 15 - 5$)''. Se aplica inclusión-exclusión para corregir el doble conteo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todos los elementos del primer conjunto $A$.'
  - 'Paso 2: Identificar todos los elementos del segundo conjunto $B$.'
  - 'Paso 3: Escribir un nuevo conjunto entre llaves conteniendo los elementos de ambos.'
  - 'Paso 4: Colapsar cualquier elemento repetido en una única instancia.'
  - 'Paso 5: En el diagrama de Venn, sombrear conjuntamente las regiones "Solo $A$", "$A \cap B$" y "Solo $B$".'
errores_correccion: |
  - **Error 1:** Duplicar elementos al escribir la unión (ej. $\{1, 2, 2, 3\}$). **Cómo corregirlo:** En la teoría de conjuntos estándar los elementos repetidos colapsan a una sola instancia: $\{1, 2, 3\}$.
  - **Error 2:** Creer que $A \cup B$ exige que los elementos estén en ambos conjuntos. **Cómo corregirlo:** La condición es disyuntiva inclusiva ($A$ o $B$); estar en ambos corresponde a la intersección $A \cap B$.
ejemplos:
  - titulo: 'Unión de conjuntos disjuntos'
    enunciado: 'Si $A = \{1, 2\}$ y $B = \{3, 4\}$, ¿cuál es $A \cup B$?'
    alternativas:
      - '$\{1, 2, 3, 4\}$'
      - '$\{1, 2\}$'
      - '$\emptyset$'
    respuesta: '$\{1, 2, 3, 4\}$'
    solucion_pasos:
      - '1. Al no haber elementos repetidos, se listan todos: $\{1, 2, 3, 4\}$.'
  - titulo: 'Unión con el conjunto vacío'
    enunciado: '¿Cuánto vale $\{a, b\} \cup \emptyset$?'
    respuesta: '$\{a, b\}$'
    solucion_pasos:
      - 'El conjunto vacío es el elemento neutro de la unión.'
  - titulo: 'Unión cuando un conjunto está contenido'
    enunciado: 'Si $A \subseteq B$, ¿a qué es igual $A \cup B$?'
    respuesta: '$B$'
    solucion_pasos:
      - 'El conjunto mayor $B$ absorbe a su subconjunto $A$.'
  - titulo: 'Unión de intervalos reales'
    enunciado: '¿Cuál es la unión de $(0, 3)$ y $[2, 5]$?'
    respuesta: '$(0, 5]$'
    solucion_pasos:
      - 'Cubre todos los reales desde más de 0 hasta 5 inclusive.'
errores_frecuentes:
  - 'La afirmación de que la unión de conjuntos exige que los elementos pertenezcan simultáneamente a ambos conjuntos.'
  - 'La afirmación de que los elementos repetidos deben contabilizarse múltiples veces en la cardinalidad de la unión.'
  - 'La afirmación de que la unión de un conjunto con el conjunto vacío da como resultado el conjunto vacío.'
  - 'La afirmación de que la unión de dos conjuntos no es conmutativa ($A \cup B \neq B \cup A$).'
  - 'La afirmación de que la cardinalidad de la unión siempre es igual a la suma directa de cardinalidades sin importar si comparten elementos.'
afirmaciones_verdaderas:
  - 'La unión $A \cup B$ es el conjunto formado por todos los elementos que pertenecen a $A$, a $B$ o a ambos simultáneamente ($\{x \mid x \in A \lor x \in B\}$).'
  - 'El conjunto vacío es el elemento neutro de la unión ($A \cup \emptyset = A$) y el conjunto universal es el elemento absorbente ($A \cup \mathcal{U} = \mathcal{U}$).'
al_terminar_debes_poder: |
  QUÉ: Definir, calcular y sombrear en diagramas de Venn la unión de conjuntos ($A \cup B$).
  CÓMO: Aplicar el conectivo disyuntivo $\lor$, eliminar duplicados por extensionalidad y calcular cardinalidades mediante el principio de inclusión-exclusión.
