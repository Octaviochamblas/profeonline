semantic_id: MAT.GEO.POLIGONOS_BASE.VERTICES
resumen_inicial: 'Identificación de los vértices de un polígono: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Cada polígono tiene puntos característicos donde sus lados se
  encuentran, y a estos puntos se les llama vértices.
explicacion_formal: '![Vértices de un polígono](/static/img/geometria/poligonos-cuadrilateros/poligonos-vertices.svg)


  ### Definición formal


  En un polígono de $n$ lados, existen exactamente $n$ vértices, cada uno formado
  por la intersección de dos lados consecutivos.


  ### Desarrollo didáctico


  Un pentágono (5 lados) tiene exactamente 5 vértices, generalmente nombrados con
  letras mayúsculas consecutivas (A, B, C, D, E). El número de vértices siempre coincide
  con el número de lados del polígono.'
definiciones_clave: '- **Identificación de los vértices de un polígono**: Elemento
  o propiedad fundamental en el estudio de polígonos y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de los vértices de un polígono.'
