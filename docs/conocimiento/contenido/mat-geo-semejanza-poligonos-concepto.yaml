semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.SEMEJANZA_POLIGONOS_CONCEPTO
resumen_inicial: 'Concepto de semejanza de polígonos: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'El concepto de semejanza no se limita a los triángulos: se extiende
  de forma natural a cualquier polígono, sin importar su número de lados.'
explicacion_formal: '![Semejanza de polígonos](/static/img/geometria/congruencia-semejanza/semejanza-poligonos-concepto.svg)


  ### Definición formal


  Dos polígonos con $n$ lados son semejantes si existe una correspondencia entre sus
  vértices tal que todos los ángulos correspondientes sean iguales y todos los lados
  correspondientes sean proporcionales, con la misma razón de proporcionalidad para
  todos los pares.


  ### Desarrollo didáctico


  A diferencia de los triángulos (donde basta con verificar ángulos O lados en ciertos
  criterios abreviados), en polígonos de más de tres lados se deben verificar AMBAS
  condiciones (ángulos iguales Y lados proporcionales) de forma independiente, ya
  que una sola no garantiza la otra.'
definiciones_clave: '- **Concepto de semejanza de polígonos**: Elemento o propiedad
