semantic_id: MAT.ALG.FRACCIONES_BASE.RESTRICCIONES_DOMINIO
resumen_inicial: La determinación de restricciones antes de simplificar establece la regla fundamental por la cual el dominio
  de una fracción algebraica debe calcularse obligatoriamente sobre la expresión original sin simplificar.
explicacion_simple: "Existe un **REGLA DE ORO DE GOBERNANZA ALGEBRAICA** al trabajar con fracciones algebraicas:\n- **RESTRICCIONES\
  \ ANTES DE CANCELAR**:\n  $$\\mathbf{\text{Las restricciones SE DETERMINAN SIEMPRE SOBRE EL DENOMINADOR ORIGINAL antes\
  \ de simplificar.}}$$\n- **¿Por qué es esto tan importante?**:\n  - Considera la fracción: $f(x) = \frac{(x - 2)(x + 3)}{x\
  \ - 2}$.\n  - Si cancelas el factor $(x - 2)$ de inmediato, te queda la expresión simple: $x + 3$.\n  - ¡Si miras $x + 3$,\
  \ parecería que $x = 2$ es un número perfectamente válido!\n  - **¡PERO NO LO ES!** En la fracción original, si $x = 2$,\
  \ el denominador vale $0$ ($2 - 2 = 0$) y la fracción se rompe.\n  - Por lo tanto, la restricción **$x \neq 2$** debe conservarse\
  \ para siempre.\n\n![Determinación de restricciones antes de simplificar](/static/img/nodos/determinacion-de-restricciones-antes-de-simplificar-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la función racional $f(x) = \frac{P(x)}{Q(x)}$ con $Q(x) = D(x) \cdot K(x)$. Al simplificar el factor común $K(x)$,
  se obtiene la función reducida $g(x) = \frac{P_1(x)}{D(x)}$. El **Principio de Equivalencia de Dominio** establece que $f(x)$
  y $g(x)$ son algebraicamente idénticas si y sólo si se restringe explícitamente el dominio de $g(x)$ al de $f(x)$:


  $$\operatorname{Dom}(f) = \{x \in \mathbb{R} \mid D(x) \neq 0 \land K(x) \neq 0\} \neq \operatorname{Dom}(g)$$


  ### Paradoja de la Extensión Dominial

  Simplificar sin registrar previamente las restricciones equivale a **extender artificialmente el dominio de la función original**
  ($\operatorname{Dom}(f) \subset \operatorname{Dom}(g)$), alterando la estructura del conjunto solución y generando agujeros
  de discontinuidad no detectados.


  ### Síntesis didáctica

  Las restricciones de existencia son heredadas por la fracción original y deben fijarse sobre todos los factores del denominador
  antes de realizar cualquier cancelación.

  '
definiciones_clave: '- **Restricciones iniciales del dominio**: Exclusión de raíces calculadas sobre el denominador antes
  de cualquier transformación o simplificación.

  - **Extensión artificial del dominio**: Error algebraico consistente en permitir valores prohibidos tras cancelar un factor
  del denominador.

  - **Discontinuidad evitable**: Punto $x = r$ que anula al denominador original y genera una restricción persistente tras
  la simplificación.

  '
propiedades_relaciones: '- **Preservación de la equivalencia matemática**: Dos expresiones algebraicas sólo son idénticas
  si coinciden tanto en su forma simplificada como en su conjunto de restricciones.

  '
ejemplo_guiado:
  enunciado: Determina las restricciones de dominio y simplifica la fracción algebraica $\frac{x^2 - 5x + 6}{x^2 - 9}$.
  pasos:
  - 'Paso 1: Factorizamos completamente el numerador y el denominador originales: - Numerador: $x^2 - 5x + 6 = (x - 2)(x -
    3)$. - Denominador: $x^2 - 9 = (x - 3)(x + 3)$. - Fracción factorizada: $\frac{(x - 2)(x - 3)}{(x - 3)(x + 3)}$.'
  - 'Paso 2: **DETERMINAMOS LAS RESTRICCIONES AHORA** (antes de simplificar): - Igualamos el denominador completo a cero:
    $(x - 3)(x + 3) = 0$. - Obtenemos las restricciones: **$x \neq 3$ y $x \neq -3$**.'
  - 'Paso 3: Cancelamos el factor común $(x - 3)$ en el numerador y denominador: $\frac{(x - 2)\cancel{(x - 3)}}{\cancel{(x
    - 3)}(x + 3)} = \mathbf{\frac{x - 2}{x + 3}}$.'
  - 'Paso 4: Escribimos el resultado simplificado adjuntando TODAS las restricciones iniciales.'
  - 'Conclusión: La expresión simplificada es **$\frac{x - 2}{x + 3}$ con $x \neq 3$ y $x \neq -3$**.'
  imagen: /static/img/nodos/determinacion-de-restricciones-antes-de-simplificar-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Dada la fracción $\frac{x^2 - 4x}{x - 4}$, si la simplificamos obteniendo la expresión $x$, ¿por qué debemos conservar
    la restricción $x \neq 4$?
  choices:
  - text: Porque en la fracción original $x = 4$ produce una división entre cero ($4-4=0$), por lo que las restricciones se
      determinan siempre antes de simplificar
    is_correct: true
  - text: Porque el número 4 es el resultado de la simplificación
    is_correct: false
  - text: Porque las restricciones cambian después de cancelar
    is_correct: false
  - text: No es necesario conservar la restricción
    is_correct: false
  explanation: La alternativa correcta es 'Porque en la fracción original $x = 4$ produce una división entre cero ($4-4=0$),
    por lo que las restricciones se determinan siempre antes de simplificar'. Principio de conservación del dominio original.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué momento exacto del procedimiento de simplificación se deben registrar los valores excluidos de la variable?
  choices:
  - text: Inmediatamente después de factorizar el denominador original y ANTES de cancelar cualquier factor común
    is_correct: true
  - text: Al final de todo el procedimiento sobre la expresión ya simplificada
    is_correct: false
  - text: Únicamente sobre el numerador
    is_correct: false
  - text: No importa el momento
    is_correct: false
  explanation: La alternativa correcta es 'Inmediatamente después de factorizar el denominador original y ANTES de cancelar
    cualquier factor común'. Regla innegociable de cálculo de restricciones.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente tanto el numerador como el denominador de la fracción original.'
- 'Paso 2: Igualar a cero cada uno de los factores presentes en el denominador descompuesto.'
- 'Paso 3: Despejar la variable para hallar todas las raíces del denominador y declarar las restricciones ($x \neq r_i$).'
- 'Paso 4: Cancelar los factores comunes presentes en el numerador y denominador.'
- 'Paso 5: Presentar la fracción simplificada final acompañada de las restricciones calculadas en el Paso 3.'
errores_correccion: '- **Error 1:** Calcular las restricciones de existencia sobre la fracción que ya ha sido simplificada.
  **Cómo corregirlo:** Las restricciones de la variable **SE DEBEN DETERMINAR OBLIGATORIAMENTE SOBRE EL DENOMINADOR ORIGINAL
  FACTORIZADO, ANTES DE CANCELAR NINGÚN FACTOR**.

  - **Error 2:** Descartar la restricción de un factor cancelado creyendo que ya no afecta a la expresión. **Cómo corregirlo:**
  La simplificación de un factor **NO ELIMINA SU RESTRICCIÓN DE EXISTENCIA EN EL DOMINIO DE LA FRACCIÓN DE ORIGEN**.

  '
ejemplos:
- titulo: Simplificación con restricción heredada
  enunciado: Para $\frac{x(x-5)}{x-5} = x$, ¿se exige la restricción $x \neq 5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5$ anula la fracción inicial.
- titulo: Factorización de denominador
  enunciado: En $\frac{x-2}{(x-2)(x+1)}$, ¿son las restricciones $x \neq 2$ y $x \neq -1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambas raíces del denominador.
- titulo: Restricción sobre factor eliminado
  enunciado: Al simplificar $\frac{x-2}{(x-2)(x+1)} = \frac{1}{x+1}$, ¿se conserva $x \neq 2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la restricción pertenece a la fracción inicial.
- titulo: Dominio de fracción constante
  enunciado: Para $\frac{2(x-3)}{x-3} = 2$, ¿sigue estando indefinida en $x=3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2(0)/0$ es indefinido.
errores_frecuentes:
- Calcular las restricciones de existencia sobre la versión ya simplificada de la fracción.
- Eliminar la restricción de un factor cancelado creyendo que deja de afectar al dominio.
- Cancelar factores en el denominador antes de haber anotado los valores prohibidos.
- Olvidar que la simplificación extiende artificialmente el dominio si no se preservan las restricciones.
- Declarar que un factor cancelado permite evaluar la fracción en su raíz.
afirmaciones_verdaderas:
- Las restricciones de una fracción algebraica se determinan sobre el denominador original antes de simplificar.
- Cancelar un factor del denominador no elimina su restricción de existencia en el dominio.
