semantic_id: MAT.ALG.FRACCIONES_BASE.RESTRICCIONES_DOMINIO
resumen_inicial: Las restricciones del dominio deben determinarse en la expresión
  original antes de realizar cualquier simplificación o cancelación de factores.
explicacion_simple: 'Cuando simplificamos una fracción algebraica cancelando factores
  repetidos arriba y abajo, la expresión resultante parece más sencilla.

  Sin embargo, el dominio de la fracción depende del denominador ORIGINAL, no de la
  versión simplificada.

  Si cancelamos un factor antes de anotar su restricción, podríamos permitir por error
  un valor de la variable que originalmente dividía por cero.'
explicacion_formal: 'Dada una fracción algebraica $F(x) = \frac{P(x) \cdot C(x)}{Q(x)
  \cdot C(x)}$, su simplificación es $G(x) = \frac{P(x)}{Q(x)}$. El **dominio válido**
  para la equivalencia $F(x) = G(x)$ exige:


  $$\operatorname{Dom}(F) = \{x \in \mathbb{R} \mid Q(x) \neq 0 \quad \land \quad
  C(x) \neq 0\}$$


  **Desglose de la fórmula:**

  - $C(x)$: Factor común en numerador y denominador que se cancela en la simplificación.

  - $C(x) \neq 0$: Restricción obligatoria derivada de la expresión original, que
  debe conservarse aunque $C(x)$ haya desaparecido en la expresión reducida $G(x)$.'
definiciones_clave: '- **Restricción previa**: Condición de existencia calculada sobre
  el denominador inicial sin simplificar.

  - **Dominio de equivalencia**: El conjunto de valores reales donde la fracción original
  y su versión simplificada producen exactamente el mismo resultado.'
propiedades_relaciones: '- **Pérdida de restricciones**: Cancelar factores sin registrar
  restricciones altera el dominio verdadero de la función o expresión.

  - **Discontinuidades evitables**: En análisis de funciones, los ceros cancelados
  del denominador corresponden a puntos o ''huecos'' en la gráfica.'
ejemplo_guiado:
  enunciado: Dada la fracción $F(x) = \frac{(x - 3)(x + 2)}{x - 3}$, determina las
    restricciones del dominio antes de simplificar y calcula su valor simplificado
    en el dominio permitido.
  pasos:
  - 'Paso 1: Analizar el denominador original $Q(x) = x - 3$. Exigir $x - 3 \neq 0
    \implies x \neq 3$.Paso 2: Registrar la restricción $x \neq 3$ ANTES de cancelar
    ningún factor.Paso 3: Cancelar el factor común $(x - 3)$ en numerador y denominador:
    $\frac{(x - 3)(x + 2)}{x - 3} = x + 2$ para todo $x \neq 3$.Paso 4: Evaluar para
    $x = 5$: $5 + 2 = 7$ (válido pues $5 \neq 3$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué momento deben establecerse las restricciones del dominio al trabajar
    con una fracción algebraica?
  choices:
  - text: En la fracción original, antes de cancelar cualquier factor común.
    is_correct: true
  - text: Después de simplificar totalmente la fracción al mínimo.
    is_correct: false
  - text: Solo al momento de resolver la ecuación final.
    is_correct: false
  - text: Únicamente si el numerador resulta ser constante.
    is_correct: false
  explanation: La alternativa correcta es 'En la fracción original, antes de cancelar
    cualquier factor común.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la fracción $\frac{(x - 3)(x + 2)}{x - 3}$, ¿cuál es la restricción
    que debe registrarse obligatoriamente antes de simplificar?
  choices:
  - text: $x \neq 3$
    is_correct: true
  - text: $x \neq -2$
    is_correct: false
  - text: $x \neq 0$
    is_correct: false
  - text: No tiene restricciones pues se cancela.
    is_correct: false
  explanation: La alternativa correcta es '$x \neq 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la fracción algebraica original completa.'
- 'Paso 2: Factorizar el denominador original si es un polinomio compuesto.'
- 'Paso 3: Igualar a cero cada factor del denominador original y declarar todas las
  restricciones $x \neq \text{raíces}$.'
- 'Paso 4: Proceder a cancelar factores comunes en el numerador y denominador.'
- 'Paso 5: Escribir la expresión simplificada acompañada de sus restricciones originales.'
errores_correccion: '- **Error común:** Simplificar $\frac{x^2 - 4}{x - 2}$ a $x +
  2$ y afirmar que no hay restricciones porque el denominador final desapareció.

  - **Cómo corregirlo:** La expresión simplificada $x + 2$ solo es equivalente a la
  original si se añade la restricción $x \neq 2$.'
ejemplos:
- titulo: 'Ejemplo 1: Factor cancelado en el denominador'
  enunciado: Determina el dominio de equivalencia al simplificar $\frac{x(x - 5)}{x
    - 5}$.
  alternativas:
  - $x$ para todo $x \neq 5$
  - $x$ para todo $x \in \mathbb{R}$
  - $x - 5$ para todo $x \neq 0$
  respuesta: $x$ para todo $x \neq 5$
  solucion_pasos:
  - '1. Denominador original $x - 5 \neq 0 \implies x \neq 5$.2. Cancelar $(x - 5)$:
    resultado $x$ con la restricción $x \neq 5$.'
- titulo: 'Ejemplo 2: Dos factores en el denominador'
  enunciado: ¿Qué restricciones deben anotarse antes de simplificar $\frac{x - 1}{(x
    - 1)(x + 4)}$?
  alternativas:
  - $x \neq 1$ y $x \neq -4$
  - Solo $x \neq -4$
  - Solo $x \neq 1$
  respuesta: $x \neq 1$ y $x \neq -4$
  solucion_pasos:
  - 1. Denominador original $(x - 1)(x + 4)$.2. Factores nulos para $x = 1$ y $x =
    -4$.3. Ambas restricciones $x \neq 1$ y $x \neq -4$ deben establecerse antes de
    cancelar $(x - 1)$.
- titulo: ¿La expresión $\frac{x^2 - 9}{x - 3}$ es equivalente a $x + 3$ para el valor
    $x = 3$?
  respuesta: 'No'
  solucion_pasos:
  - No. Para $x = 3$, la fracción original indefine por división entre cero $0/0$,
    por lo que no hay equivalencia en $x = 3$.
- titulo: ¿Es necesario mantener la restricción $x \neq 0$ al simplificar $\frac{5x}{x^2}$
    a $\frac{5}{x}$?
  respuesta: Sí
  solucion_pasos:
  - Sí. El denominador original $x^2$ se anula en $x = 0$, por lo que la restricción
    $x \neq 0$ debe conservarse.
errores_frecuentes:
- Al simplificar $\frac{x(x-2)}{x-2}$ a $x$, la restricción $x \neq 2$ desaparece.
- Las restricciones se calculan sobre el numerador simplificado.
- Si un factor del denominador se cancela totalmente, la fracción se define para todos
  los reales.
- Las restricciones solo importan si la variable $x$ es un número negativo.
- Simplificar una fracción algebraica no altera nunca su dominio original.
afirmaciones_verdaderas:
- Las restricciones del dominio deben determinarse sobre el denominador de la fracción
  original antes de cualquier simplificación.
- Una fracción simplificada solo es matemáticamente equivalente a la original si se
  especifican las restricciones del denominador inicial.
al_terminar_debes_poder: Al finalizar este recurso podrás determinar las restricciones
  del dominio en la fracción original antes de efectuar cualquier simplificación.
