procedimiento:
- 'Paso 1: Ignora completamente el numerador.'
- 'Paso 2: Toma la expresión del denominador y plantéala igual a cero ($Denominador
  = 0$).'
- 'Paso 3: Resuelve la ecuación (generalmente requerirá factorizar si es cuadrática).'
- 'Paso 4: Los números resultantes son las restricciones ($variable \neq número$).'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en determinación de restricciones antes de simplificar.
ejemplos:
- titulo: Determina las restricciones de $\frac{x+1}{2x - 8}$
  enunciado: Determina las restricciones de $\frac{x+1}{2x - 8}$.
  solucion_pasos:
  - 'Tomamos el denominador: $2x - 8$.'
  - 'Lo igualamos a cero: $2x - 8 = 0$.'
  - 'Resolvemos: $2x = 8 \rightarrow x = 4$.'
  - La restricción es $x \neq 4$.
- titulo: ¿Qué valores no puede tomar 'y' en $\frac{3}{y(y-2)}$?
  solucion_pasos:
  - 'Igualamos el denominador a cero: y(y-2) = 0. Esto se cumple si y=0 o si y=2.'
- titulo: 'Respecto de «Determinación de restricciones antes de simplificar»: ¿La
    siguiente formulación'
  enunciado: 'Respecto de «Determinación de restricciones antes de simplificar»: ¿La
    siguiente formulación es correcta? «Para encontrar las restricciones de una fracción,
    se toma el denominador, se iguala a cero, y se resuelve la ecuación resultante»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para encontrar las restricciones
    de una fracción, se toma el denominador, se iguala a cero, y se resuelve la ecuación
    resultante.'
- titulo: 'Respecto de «Determinación de restricciones antes de simplificar»: ¿La
    siguiente conclusión'
  enunciado: 'Respecto de «Determinación de restricciones antes de simplificar»: ¿La
    siguiente conclusión es correcta? «Calcular las restricciones usando el numerador
    en lugar del denominador»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para encontrar las restricciones
    de una fracción, se toma el denominador, se iguala a cero, y se resuelve la ecuación
    resultante.'
errores_frecuentes:
- Calcular las restricciones usando el numerador en lugar del denominador.
- Si el denominador es una letra sola ($x$), pensar que no hay restricciones (la restricción
  es $x \neq 0$).
- Para «¿Qué representa el 'dominio' en el contexto de una fracción algebraica», la
  respuesta correcta es Los valores que hacen que el numerador sea cero.
- El grado máximo del polinomio.
- Los valores que dan como resultado una fracción negativa.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando determinación
  de restricciones antes de simplificar.
