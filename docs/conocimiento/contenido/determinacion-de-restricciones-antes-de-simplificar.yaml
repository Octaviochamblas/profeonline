semantic_id: MAT.ALG.FRACCIONES_BASE.RESTRICCIONES_DOMINIO
resumen_inicial: 'Determinación de restricciones antes de simplificar: concepto, reglas
  operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: Debido a la regla de oro (no dividirás por cero), cada vez que
  te entreguen una fracción algebraica debes ponerle una etiqueta de advertencia indicando
  qué valores son 'tóxicos' para ella. A esto le llamamos restricciones.
explicacion_formal: '### Definición formal


  El dominio es el conjunto de valores "seguros" o permitidos para la variable.


  ### Desarrollo didáctico


  Para encontrar todas las restricciones (valores prohibidos) de una fracción algebraica,
  debes realizar una ''interrogación'' rigurosa a su denominador.


  El procedimiento es sistemático:

  1. **Toma solo el denominador:** Ignora por completo el numerador (el numerador
  sí puede ser cero, no hay problema con eso).

  2. **Plantea una ecuación:** Iguala el denominador a cero. Ej: $x^2 - 9 = 0$.

  3. **Resuelve la ecuación:** Factoriza y despeja la incógnita. En este caso: $(x-3)(x+3)
  = 0$, por lo que $x=3$ y $x=-3$.

  4. **Declara las restricciones:** Los números que encontraste son la ''lista de
  restricciones''. Debes indicar explícitamente que la fracción existe para todos
  los números reales **excepto** esos valores. Se anota: $x \neq 3$ y $x \neq -3$.


  Si no indicas las restricciones al simplificar, estás mintiendo matemáticamente,
  ya que la expresión original no era válida para esos números.'
definiciones_clave: '- **Determinación de restricciones antes de simplificar**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a determinación de restricciones antes
  de simplificar.'
