al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/determinacion-de-restricciones-antes-de-simplificar-resumen.svg)


  QUÉ: Determinar las restricciones de existencia sobre el denominador original antes de simplificar cualquier fracción.

  CÓMO: Factorizar completamente el denominador inicial $Q_{\text{original}}(x)$, fijar todas las raíces como valores excluidos
  ($x \neq r_i$) y conservarlas adjuntas a la expresión simplificada final.

  '
