- titulo: ¿Se cumple siempre la propiedad principal de completación de cuadrados en
    la variable y para transformar la ecuación general en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede completación de cuadrados en la variable y para transformar la ecuación
    general asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
