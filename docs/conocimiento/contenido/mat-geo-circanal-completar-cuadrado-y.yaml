semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.COMPLETAR_CUADRADO_Y
resumen_inicial: 'Completación de cuadrados en la variable y para transformar la ecuación
  general: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: El mismo procedimiento aplicado a los términos en x se repite
  de forma idéntica para los términos en y, ya que ambas variables juegan un papel
  simétrico en la ecuación de la circunferencia.
explicacion_formal: '![Completación de cuadrado en y](/static/img/geometria/analitica/circanal-completar-cuadrado-y.svg)


  ### Definición formal


  Dado $y^2+Ey$, se agrega el término $\left(\dfrac{E}{2}\right)^2$ para completar
  el cuadrado perfecto: $y^2+Ey+\left(\dfrac{E}{2}\right)^2=\left(y+\dfrac{E}{2}\right)^2$.


  ### Desarrollo didáctico


  Para $y^2+4y$: la mitad de 4 es 2, y su cuadrado es 4. Entonces $y^2+4y+4=(y+2)^2$,
  restando ese mismo 4 en algún otro lugar de la ecuación.'
