- titulo: ¿Se cumple siempre la propiedad principal de definición de la ecuación general
    de la recta ax + by + c = 0 en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede definición de la ecuación general de la recta ax + by + c = 0 asumir
