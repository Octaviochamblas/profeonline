semantic_id: MAT.GEO.RECTA_ECUACIONES.FORMA_GENERAL
resumen_inicial: 'Definición de la ecuación general de la recta Ax + By + C = 0: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: A diferencia de la forma principal, que no puede representar rectas
  verticales, la forma general puede expresar cualquier recta del plano cartesiano.
explicacion_formal: '![Ecuación general de la recta](/static/img/geometria/analitica/rectaeq-forma-general.svg)


  ### Definición formal


  Toda recta del plano cartesiano puede escribirse en la forma $Ax+By+C=0$, con $A,B,C\in\mathbb{R}$
  y no ambos $A$ y $B$ iguales a cero. Si $B\neq0$, se puede despejar $y$ para obtener
  la forma principal.


  ### Desarrollo didáctico


  La recta $y=1{,}5x+1$ puede escribirse en forma general como $1{,}5x-y+1=0$, o equivalentemente
  $3x-2y+2=0$ (multiplicando por 2 para evitar decimales).'
definiciones_clave: '- **Definición de la ecuación general de la recta Ax + By + C
  = 0**: Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
