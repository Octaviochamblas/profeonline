semantic_id: MAT.NUM.RAICES_PROPIEDADES.ADICION_RADICALES_SEMEJANTES
resumen_inicial: 'La adición de radicales semejantes se efectúa sumando los coeficientes exteriores y conservando intacto el radical común: $a\sqrt[n]{x} + b\sqrt[n]{x} = (a + b)\sqrt[n]{x}$.'
explicacion_simple: |
  Sumar raíces semejantes es idéntico a sumar objetos del mismo tipo en la vida real. Si tienes $3$ manzanas y le sumas $4$ manzanas, obtienes $7$ manzanas. De la misma forma, si tienes $3\sqrt{5} + 4\sqrt{5}$, simplemente sumas los números de afuera ($3 + 4 = 7$) y mantienes la raíz $\sqrt{5}$ exactamente como está: $7\sqrt{5}$. Si las raíces no son semejantes desde el inicio, primero debes descomponerlas para ver si esconden la misma raíz.
explicacion_formal: |
  ### Definición formal
  La **adición de radicales semejantes** se fundamenta analíticamente en la propiedad distributiva del producto respecto a la suma en el cuerpo de los números reales $\mathbb{R}$:
  $$a \cdot \sqrt[n]{x} + b \cdot \sqrt[n]{x} = (a + b) \cdot \sqrt[n]{x}$$

  ### Algoritmo de adición con simplificación previa
  Para expresiones con radicandos descomponibles:
  1. Simplificar cada término radical a su forma irreducible: $R_i = c_i \sqrt[n]{x}$.
  2. Agrupar los términos que resulten ser semejantes.
  3. Sumar los coeficientes $c_i$ de los términos semejantes factorizando el radical común.
  4. Dejar expresados como sumandos independientes los términos que no compartan semejanza.

  ### Síntesis didáctica
  - Coeficiente resultante: $(a + b)$.
  - Radical resultante: Permanece **intacto** como $\sqrt[n]{x}$ (no se multiplican ni se suman los radicandos).
definiciones_clave: |
  - **Adición de radicales semejantes**: Operación de combinación de términos con raíz reducida al término algebraico común.
  - **Factorización del radical común**: Aplicación de la propiedad distributiva $(a+b)\sqrt[n]{x}$.
  - **Coeficiente suma $(a + b)$**: Resultado de la adición aritmética de los números reales exteriores.
propiedades_relaciones: |
  - **Imposibilidad de adición subradical directa**: En general, $\sqrt[n]{a} + \sqrt[n]{b} \neq \sqrt[n]{a + b}$. La raíz no es distributiva sobre la suma.
  - **Conexión con el álgebra polinomial**: Funciona de forma idéntica a la suma de monomios semejantes $a x + b x = (a + b)x$.
ejemplo_guiado:
  enunciado: 'Calcula el valor simplificado de la suma de radicales $S = \sqrt{12} + \sqrt{27} + 5\sqrt{3}$.'
  pasos:
    - 'Paso 1: Simplificamos cada radical: $\sqrt{12} = \sqrt{4 \cdot 3} = 2\sqrt{3}$.'
    - 'Paso 2: Simplificamos el segundo término: $\sqrt{27} = \sqrt{9 \cdot 3} = 3\sqrt{3}$.'
    - 'Paso 3: Reescribimos la suma con todos los términos en forma irreducible: $S = 2\sqrt{3} + 3\sqrt{3} + 5\sqrt{3}$.'
    - 'Paso 4: Factorizamos el radical común $\sqrt{3}$ y sumamos los coeficientes: $S = (2 + 3 + 5)\sqrt{3} = 10\sqrt{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué manera se realiza la adición de dos radicales semejantes $a\sqrt[n]{x}$ y $b\sqrt[n]{x}$?'
    choices:
      - {text: 'Se suman los coeficientes exteriores $(a + b)$ manteniendo intacto el radical común $\sqrt[n]{x}$', is_correct: true}
      - {text: 'Se suman los radicandos dentro de la raíz obteniendo $\sqrt[n]{x + x}$', is_correct: false}
      - {text: 'Se multiplican los coeficientes y se duplica el índice', is_correct: false}
      - {text: 'Se eliminan los radicales de ambos términos', is_correct: false}
    explanation: 'La alternativa correcta es ''Se suman los coeficientes exteriores $(a + b)$ manteniendo intacto el radical común $\sqrt[n]{x}$''. La propiedad distributiva factoriza la raíz común $(a+b)\sqrt[n]{x}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de la suma $\sqrt{20} + \sqrt{45}$?'
    choices:
      - {text: '$5\sqrt{5}$, ya que $2\sqrt{5} + 3\sqrt{5} = 5\sqrt{5}$', is_correct: true}
      - {text: '$\sqrt{65}$, sumando los radicandos directamente', is_correct: false}
      - {text: '$6\sqrt{5}$, sumando mal los coeficientes', is_correct: false}
      - {text: '$25$, elevando al cuadrado los términos', is_correct: false}
    explanation: 'La alternativa correcta es ''$5\sqrt{5}$, ya que $2\sqrt{5} + 3\sqrt{5} = 5\sqrt{5}$''. Descomponemos $\sqrt{20} = 2\sqrt{5}$ y $\sqrt{45} = 3\sqrt{5}$, sumando $2 + 3 = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Descomponer y simplificar todos los radicales a su forma irreducible para revelar semejanzas.'
  - 'Paso 2: Identificar y agrupar los términos que contengan exactamente el mismo radical $\sqrt[n]{x}$.'
  - 'Paso 3: Sumar numéricamente los coeficientes exteriores de los términos semejantes.'
  - 'Paso 4: Escribir el coeficiente suma junto al radical común, conservando los términos no semejantes.'
errores_correccion: |
  - **Error 1:** Sumar los radicandos dentro de una sola raíz (ej: escribir $\sqrt{2} + \sqrt{8} = \sqrt{10}$). **Cómo corregirlo:** La raíz **no es distributiva respecto a la suma**. Debes simplificar primero $\sqrt{8} = 2\sqrt{2}$ y luego sumar coeficientes: $1\sqrt{2} + 2\sqrt{2} = 3\sqrt{2}$.
  - **Error 2:** Sumar los índices de los radicales al adicionar (ej: $3\sqrt{5} + 4\sqrt{5} = 7\sqrt[4]{5}$). **Cómo corregirlo:** El radical común $\sqrt{5}$ no cambia en absoluto de índice ni de radicando tras la suma.
ejemplos:
  - titulo: 'Suma directa de radicales semejantes'
    enunciado: '¿La suma $4\sqrt{7} + 3\sqrt{7}$ es igual a $7\sqrt{7}$?'
    alternativas:
      - 'Sí, pues $(4 + 3)\sqrt{7} = 7\sqrt{7}$'
      - 'No, es $\sqrt{14}$'
      - 'No, es $7\sqrt{14}$'
    respuesta: 'Sí, pues $(4 + 3)\sqrt{7} = 7\sqrt{7}$'
    solucion_pasos:
      - '1. Verificamos que sean semejantes: ambos contienen $\sqrt{7}$.'
      - '2. Sumamos coeficientes: $4 + 3 = 7 \implies 7\sqrt{7}$.'
  - titulo: 'Suma con descomposición previa'
    enunciado: '¿La suma $\sqrt{8} + \sqrt{18}$ resulta en $5\sqrt{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{8} = 2\sqrt{2}$ y $\sqrt{18} = 3\sqrt{2} \implies 2\sqrt{2} + 3\sqrt{2} = 5\sqrt{2}$.'
  - titulo: 'Suma con término de coeficiente 1'
    enunciado: '¿La suma $\sqrt{5} + 2\sqrt{5}$ equivale a $3\sqrt{5}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El coeficiente de $\sqrt{5}$ es $1 \implies (1 + 2)\sqrt{5} = 3\sqrt{5}$.'
  - titulo: 'Imposibilidad de sumar no semejantes'
    enunciado: '¿La expresión $\sqrt{2} + \sqrt{3}$ se puede simplificar a una sola raíz?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Al no ser semejantes y estar en forma irreducible, la suma queda expresada como $\sqrt{2} + \sqrt{3}$.'
errores_frecuentes:
  - 'Afirmar que la suma $\sqrt{a} + \sqrt{b}$ es igual a la raíz del producto $\sqrt{a + b}$.'
  - 'Sumar los índices de dos radicales idénticos al realizar una adición.'
  - 'Un radical sin coeficiente escrito por fuera equivale a un coeficiente igual a 0 al realizar adiciones.'
  - 'Intentar sumar coeficientes de radicales que tienen radicandos diferentes sin simplificar.'
  - 'Elevar al cuadrado cada término de una suma para eliminar los radicales.'
afirmaciones_verdaderas:
  - 'La adición de radicales semejantes se realiza sumando los coeficientes exteriores y conservando intacto el radical común: $a\sqrt[n]{x} + b\sqrt[n]{x} = (a+b)\sqrt[n]{x}$.'
  - 'Para sumar expresiones radicales no semejantes en su forma inicial, se deben descomponer previamente a su forma irreducible para identificar radicales comunes.'
al_terminar_debes_poder: 'Efectuar adiciones de expresiones radicales sumando sus coeficientes exteriores tras simplificar los términos a radicales semejantes.'
