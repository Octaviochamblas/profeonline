semantic_id: MAT.NUM.RAICES_PROPIEDADES.ADICION_RADICALES_SEMEJANTES
resumen_inicial: 'Para sumar radicales semejantes, se suman sus coeficientes numéricos exteriores y se conserva la parte radical común intacta: $p\sqrt[n]{c} + q\sqrt[n]{c} = (p + q)\sqrt[n]{c}$.'
explicacion_simple: '![Adición de radicales semejantes](/static/img/nodos/adicion-de-radicales-semejantes-intro.svg)


  Sumar raíces semejantes es idéntico a sumar términos semejantes en álgebra:

  - La raíz común (como $\sqrt{7}$) actúa como una etiqueta o variable común que **no se toca**.

  - **Solo sumas los números de adelante (los coeficientes)**:

  $$5\sqrt{7} + 3\sqrt{7} = (5 + 3)\sqrt{7} = 8\sqrt{7}$$

  - **¡ADVERTENCIA CRÍTICA!** Está estrictamente prohibido sumar los números de adentro de las raíces:

  $$\sqrt{9} + \sqrt{16} \neq \sqrt{25} \quad (3 + 4 = 7 \neq 5)$$

  Si las raíces no parecen semejantes al inicio (como $\sqrt{12} + \sqrt{27}$), primero las simplificas: $2\sqrt{3} + 3\sqrt{3} = 5\sqrt{3}$.'
explicacion_formal: 'Sean $p, q \in \mathbb{R}$ y $\sqrt[n]{c}$ un radical real bien definido. Por la propiedad distributiva de la multiplicación respecto a la adición en $\mathbb{R}$:


  $$p \sqrt[n]{c} + q \sqrt[n]{c} = (p + q) \sqrt[n]{c}$$


  **Teorema de No Linealidad Subradical:**

  Para todo $a, b > 0$:

  $$\sqrt[n]{a} + \sqrt[n]{b} \neq \sqrt[n]{a + b}$$


  **Algoritmo General de Adición:**

  1. Descomponer cada radicando a su forma canónica irreducible $K_i \sqrt[n]{c_i}$.

  2. Agrupar los términos que compartan el mismo radical base $\sqrt[n]{c}$.

  3. Sumar los coeficientes de cada grupo conservando la parte radical.'
definiciones_clave: '- **Factor común radical**: Extracción de la raíz idéntica $\sqrt[n]{c}$ en la suma.

  - **Reducción de términos radicales**: Suma de coeficientes asociados a la misma base.

  - **No distributividad de la raíz**: Imposibilidad de unir sumandos bajo un solo radical.'
propiedades_relaciones: '- **Neutro aditivo**: $0 + p\sqrt[n]{c} = p\sqrt[n]{c}$.

  - **Suma de no semejantes**: $\sqrt{2} + \sqrt{3}$ no admite reducción racional (queda expresado).'
ejemplo_guiado:
  enunciado: '![Ejemplos de adición de radicales](/static/img/nodos/adicion-de-radicales-semejantes-ejemplos.svg)


    Calcule y reduzca las sumas $5\sqrt{7} + 3\sqrt{7}$, $\sqrt{12} + \sqrt{27}$ y $\sqrt{8} + \sqrt{18} + \sqrt{50}$.'
  pasos:
  - 'Paso 1: Evaluar $5\sqrt{7} + 3\sqrt{7}$: Semejantes directos $\implies (5 + 3)\sqrt{7} = 8\sqrt{7}$.'
  - 'Paso 2: Evaluar $\sqrt{12} + \sqrt{27}$: Simplificar: $\sqrt{12} = 2\sqrt{3}$ y $\sqrt{27} = 3\sqrt{3}$. Sumar: $(2 + 3)\sqrt{3} = 5\sqrt{3}$.'
  - 'Paso 3: Evaluar $\sqrt{8} + \sqrt{18} + \sqrt{50}$: Simplificar: $2\sqrt{2} + 3\sqrt{2} + 5\sqrt{2} = (2 + 3 + 5)\sqrt{2} = 10\sqrt{2}$.'
  - 'Conclusión: Los resultados son $8\sqrt{7}$, $5\sqrt{3}$ y $10\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué $\sqrt{9} + \sqrt{16} \neq \sqrt{25}$?
  choices:
  - text: Porque $\sqrt{9} + \sqrt{16} = 3 + 4 = 7$, mientras que $\sqrt{25} = 5$ (la raíz no es distributiva sobre la suma)
    is_correct: true
  - text: Porque $9 + 16$ no es $25$
    is_correct: false
  - text: Porque falta multiplicar por $2$
    is_correct: false
  - text: Porque las raíces cuadradas siempre dan cero
    is_correct: false
  explanation: La alternativa correcta es 'Porque $\sqrt{9} + \sqrt{16} = 3 + 4 = 7$, mientras que $\sqrt{25} = 5$ (la raíz no es distributiva sobre la suma)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se resolvió $\sqrt{12} + \sqrt{27}$?
  choices:
  - text: Simplificando a $2\sqrt{3} + 3\sqrt{3}$ para sumar sus coeficientes y obtener $5\sqrt{3}$
    is_correct: true
  - text: Sumando $\sqrt{12 + 27} = \sqrt{39}$
    is_correct: false
  - text: Multiplicando $12 \times 27$
    is_correct: false
  - text: Dejándolo como $\sqrt{39}$
    is_correct: false
  explanation: La alternativa correcta es 'Simplificando a $2\sqrt{3} + 3\sqrt{3}$ para sumar sus coeficientes y obtener $5\sqrt{3}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar individualmente cada radical extrayendo todos los factores posibles.'
- 'Paso 2: Identificar los grupos de términos que tengan idéntica parte radical $\sqrt[n]{c}$.'
- 'Paso 3: Sumar los coeficientes de cada grupo y conservar la parte radical común.'
errores_correccion: '- **Error 1: Sumar los números dentro del radical ($\sqrt{2} + \sqrt{8} = \sqrt{10}$).** **Cómo corregirlo:** Simplificar primero: $\sqrt{2} + 2\sqrt{2} = (1+2)\sqrt{2} = 3\sqrt{2}$.

  - **Error 2: Olvidar el coeficiente 1 implícito ($3\sqrt{5} + \sqrt{5} = 3\sqrt{10}$).** **Cómo corregirlo:** $\sqrt{5}$ tiene coeficiente $1$: $(3 + 1)\sqrt{5} = 4\sqrt{5}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $4\sqrt{3} + \sqrt{3}$?
  alternativas:
  - $5\sqrt{3}$
  - $4\sqrt{6}$
  - $5\sqrt{6}$
  respuesta: $5\sqrt{3}$
  solucion_pasos:
  - $(4 + 1)\sqrt{3} = 5\sqrt{3}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor reducido de $\sqrt{20} + \sqrt{45}$?
  alternativas:
  - $5\sqrt{5}$
  - $\sqrt{65}$
  - $6\sqrt{5}$
  respuesta: $5\sqrt{5}$
  solucion_pasos:
  - $2\sqrt{5} + 3\sqrt{5} = 5\sqrt{5}$.
- titulo: ¿Es √32 + √18 igual a 7√2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4\sqrt{2} + 3\sqrt{2} = (4 + 3)\sqrt{2} = 7\sqrt{2}$.
  alternativas:
  - texto: Sí, 4√2 + 3√2 = 7√2
    es_correcta: true
    retroalimentacion: ¡Correcto! Simplificación y adición perfecta.
  - texto: No, es igual a √50
    es_correcta: false
    retroalimentacion: Incorrecto, $7\sqrt{2} = \sqrt{98} \neq \sqrt{50}$.
  - texto: No, no se pueden sumar
    es_correcta: false
    retroalimentacion: Incorrecto, son semejantes tras simplificar.
- titulo: ¿Es √2 + √3 igual a √5?
  respuesta: 'No'
  solucion_pasos:
  - No, la raíz no es distributiva con la suma ($\sqrt{2} + \sqrt{3} \approx 1,414 + 1,732 = 3,146 \neq \sqrt{5} \approx 2,236$).
  alternativas:
  - texto: No, no se pueden sumar radicandos (queda √2 + √3)
    es_correcta: true
    retroalimentacion: ¡Correcto! Son radicales no semejantes.
  - texto: Sí, 2 + 3 = 5 dando √5
    es_correcta: false
    retroalimentacion: Incorrecto, los radicandos nunca se suman.
  - texto: Sí, por propiedad asociativa
    es_correcta: false
    retroalimentacion: Incorrecto, no existe tal propiedad en sumas.
errores_frecuentes:
- Sumar directamente los radicandos dentro de una sola raíz.
- Olvidar que $\sqrt{x}$ tiene coeficiente 1.
- Sumar raíces con distinto radicando tras simplificar.
- Multiplicar los coeficientes en lugar de sumarlos.
- Intentar sumar raíces de distinto índice.
afirmaciones_verdaderas:
- Para sumar radicales semejantes se suman sus coeficientes y se mantiene el radical común.
- La radicación no es distributiva respecto a la adición ($\sqrt{a} + \sqrt{b} \neq \sqrt{a+b}$).
- La simplificación previa de términos es indispensable para poder agrupar radicales semejantes.
al_terminar_debes_poder: '![Síntesis de adición de radicales](/static/img/nodos/adicion-de-radicales-semejantes-resumen.svg)


  QUÉ: Sumar expresiones radicales mediante la identificación y reducción de términos semejantes.


  CÓMO: Simplificando cada radical a su forma irreducible, agrupando los que compartan el radical base $\sqrt[n]{c}$ y sumando sus coeficientes numéricos mediante la propiedad distributiva.'
