semantic_id: MAT.NUM.RAICES_PROPIEDADES.ADICION_RADICALES_SEMEJANTES
resumen_inicial: Para sumar radicales semejantes, se suman sus coeficientes exteriores
  y se conserva el radical común ($a\sqrt[n]{x} + b\sqrt[n]{x} = (a+b)\sqrt[n]{x}$).
explicacion_simple: 'Sumar radicales semejantes es como sumar manzanas con manzanas
  o variables iguales en álgebra:

  - $3\sqrt{5} + 4\sqrt{5} = (3 + 4)\sqrt{5} = 7\sqrt{5}$

  Si los radicales no son semejantes, primero se simplifican; si siguen sin serlo,
  la suma queda expresada y no se puede juntar.'
explicacion_formal: 'Por la propiedad distributiva del factor común radical $\sqrt[n]{x}$,
  para $a, b \in \mathbb{R}$:

  $$a \sqrt[n]{x} + b \sqrt[n]{x} = (a + b) \sqrt[n]{x}$$'
definiciones_clave: '- **Suma de coeficientes**: Adición $(a + b)$ aplicada únicamente
  a los términos exteriores.'
propiedades_relaciones: '- **Conservación del radical**: El término $\sqrt[n]{x}$
  permanece inalterado.'
ejemplo_guiado:
  enunciado: Calcula la suma $\sqrt{12} + \sqrt{27}$.
  pasos:
  - 'Simplificar cada radical: $\sqrt{12} = 2\sqrt{3}$ y $\sqrt{27} = 3\sqrt{3}$.'
  - Verificar que ahora son radicales semejantes (mismo $\sqrt{3}$).
  - 'Sumar los coeficientes exteriores: $(2 + 3)\sqrt{3} = 5\sqrt{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de $5\sqrt{2} + 3\sqrt{2}$?
  choices:
  - text: 8\sqrt{2}
    is_correct: true
  - text: 8\sqrt{4}
    is_correct: false
  - text: 15\sqrt{2}
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: 'La correcta es: 8\sqrt{2}. Sumamos coeficientes ($5+3=8$) y mantenemos
    $\sqrt{2}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\sqrt{8} + \sqrt{18}$.
  choices:
  - text: 5\sqrt{2}
    is_correct: true
  - text: \sqrt{26}
    is_correct: false
  - text: 6\sqrt{2}
    is_correct: false
  - text: 5\sqrt{4}
    is_correct: false
  explanation: 'La correcta es: 5\sqrt{2}. $2\sqrt{2} + 3\sqrt{2} = 5\sqrt{2}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar todos los radicales de la suma.'
- 'Paso 2: Identificar los términos que tengan radicales semejantes.'
- 'Paso 3: Sumar los coeficientes exteriores de los términos semejantes.'
- 'Paso 4: Mantener el radical común intacto.'
errores_correccion: ¡Nunca sumes los radicandos! $\sqrt{2} + \sqrt{3} \neq \sqrt{5}$.
  Las raíces no son distributivas sobre la suma.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $4\sqrt{7} + 2\sqrt{7}$.
  alternativas:
  - 6\sqrt{7}
  - 6\sqrt{14}
  - 8\sqrt{7}
  respuesta: 6\sqrt{7}
  solucion_pasos:
  - $(4+2)\sqrt{7} = 6\sqrt{7}$.
errores_frecuentes:
- Sumar los radicandos dentro de la raíz.
afirmaciones_verdaderas:
- $a\sqrt[n]{x} + b\sqrt[n]{x} = (a+b)\sqrt[n]{x}$.
al_terminar_debes_ponder: Sumar radicales semejantes simplificando los términos previamente.
fuente: Texto escolar MINEDUC.
estado: publicado
