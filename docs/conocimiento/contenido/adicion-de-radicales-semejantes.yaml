resumen_inicial: 'Para sumar radicales semejantes $a \sqrt[n]{x} + b \sqrt[n]{x}$,
  se suman sus coeficientes exteriores $(a + b)$ y se conserva intacto el radical
  común: $(a + b) \sqrt[n]{x}$.'
explicacion_simple: Para sumar raíces semejantes, sumamos los números de afuera y
  dejamos la misma raíz compartida por detrás, igual como cuando sumamos peras o manzanas
  ($3\sqrt{2} + 4\sqrt{2} = 7\sqrt{2}$).
explicacion_formal: 'Para todo coeficiente $a, b \in \mathbb{R}$ y radical común $\sqrt[n]{x}$,
  la **Adición por Factorización** satisface:


  $$a \sqrt[n]{x} + b \sqrt[n]{x} = (a + b) \sqrt[n]{x}$$


  > **Complemento didáctico:** NUNCA se suman los radicandos: $\sqrt{a} + \sqrt{b}
  \neq \sqrt{a+b}$.'
definiciones_clave: '- **Adición de radicales semejantes**: Operación $(a + b) \sqrt[n]{x}$
  que factoriza el radical idéntico.'
propiedades_relaciones: '- **Suma de coeficientes**: $(a+b)\sqrt[n]{x}$ factoriza
  la raíz común.'
ejemplo_guiado:
  enunciado: Calcule la suma $4\sqrt{5} + 3\sqrt{5}$ y simplifique $\sqrt{12} + \sqrt{27}$.
  pasos:
  - 'Paso 1: Para $4\sqrt{5} + 3\sqrt{5}$, sumar coeficientes: $(4 + 3)\sqrt{5} =
    7\sqrt{5}$.'
  - 'Paso 2: Para $\sqrt{12} + \sqrt{27}$, descomponer previamente: $2\sqrt{3} + 3\sqrt{3}$.'
  - 'Paso 3: Sumar los radicales semejantes obtenidos: $(2 + 3)\sqrt{3} = 5\sqrt{3}$.'
  - 'Conclusión: Las sumas valen $7\sqrt{5}$ y $5\sqrt{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento se ejecuta al sumar dos radicales semejantes a · sqrt[n]{x}
    + b · sqrt[n]{x}?
  choices:
  - text: Se suman los coeficientes exteriores (a + b) manteniendo el radical común
      (sqrt[n]{x})
    is_correct: true
  - text: Se suman los radicandos x + x bajo la raíz
    is_correct: false
  - text: Se multiplican los coeficientes
    is_correct: false
  - text: Se elevan las raíces al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Se suman los coeficientes exteriores (a
    + b) manteniendo el radical común (sqrt[n]{x})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4 · sqrt(5) + 3 · sqrt(5), ¿cuál fue el resultado?
  choices:
  - text: 7 · sqrt(5)
    is_correct: true
  - text: 7 · sqrt(10)
    is_correct: false
  - text: 12 · sqrt(5)
    is_correct: false
  - text: sqrt(35)
    is_correct: false
  explanation: La alternativa correcta es '7 · sqrt(5)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de efectuar la adición de radicales
  semejantes $(a + b)\sqrt[n]{x}$, sumando sus coeficientes y conservando la raíz
  común.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.ADICION_RADICALES_SEMEJANTES
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.ADICION_RADICALES_SEMEJANTES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
