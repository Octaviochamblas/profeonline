semantic_id: MAT.NUM.INTERES_COMPUESTO.COMPARACION_REGIMENES
resumen_inicial: 'La comparación entre regímenes de interés contrasta el crecimiento lineal afín del interés simple ($M_s = C(1 + in)$) frente a la curva exponencial del interés compuesto ($M_c = C(1 + i)^n$).'
explicacion_simple: |
  ¿Cuál régimen hace crecer más rápido tu dinero?
  - En el **primer año ($n = 1$)**: Ambos regímenes rinden exactamente lo mismo, porque el $10\%$ de $\$100.000$ es $\$10.000$ en los dos.
  - A partir del **segundo año ($n > 1$)**: El interés compuesto supera al simple con una ventaja que se agranda cada vez más rápido, porque los intereses ganados empiezan a generar sus propios intereses.

  ![Comparación entre regímenes de interés](/static/img/nodos/comparacion-entre-regimenes-de-interes-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sean $M_s(n)$ y $M_c(n)$ las funciones de valor acumulado para un mismo capital $C > 0$ y tasa periódica $i > 0$:
  - **Régimen Simple (Función Afín Lineal)**:
    $$M_s(n) = C \cdot (1 + i \cdot n)$$
  - **Régimen Compuesto (Función Exponencial)**:
    $$M_c(n) = C \cdot (1 + i)^n$$

  ### Análisis de Puntos Críticos y Desigualdad
  1. **En $n = 0$ (Momento inicial)**:
     $$M_s(0) = M_c(0) = C$$
  2. **En $n = 1$ (Primer período de capitalización)**:
     $$M_s(1) = M_c(1) = C \cdot (1 + i)$$
  3. **Para plazos intermedios ($0 < n < 1$)**:
     $$M_s(n) > M_c(n)$$
  4. **Para plazos superiores ($n > 1$)**:
     $$M_c(n) > M_s(n) \quad \text{(Efecto bola de nieve exponencial)}$$

  ### Síntesis didáctica
  - $n = 1 \implies M_s = M_c$.
  - $n > 1 \implies M_c > M_s$.
  - Curvatura: Recta constante vs. curva exponencial acelerada.
definiciones_clave: |
  - **Punto de indiferencia temporal ($n = 1$)**: Plazo en el cual ambos regímenes financieros producen exactamente el mismo monto final.
  - **Excedente de capitalización**: Diferencia positiva $M_c(n) - M_s(n) = C[(1+i)^n - (1+in)]$ obtenida para todo $n > 1$.
propiedades_relaciones: |
  - **Desigualdad de Bernoulli**: Establece formalmente que $(1 + i)^n > 1 + i \cdot n$ para todo $i > 0$ y $n \in \mathbb{N}, n \ge 2$.
  - **Divergencia asintótica**: Cuando $n \to \infty$, la razón $\frac{M_c(n)}{M_s(n)} \to \infty$.
ejemplo_guiado:
  enunciado: 'Un inversionista evalúa colocar $\$100.000$ al $10\%$ anual durante $3$ años. Compara el monto final y el interés generado bajo régimen simple versus régimen compuesto.'
  imagen: '/static/img/nodos/comparacion-entre-regimenes-de-interes-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos interés simple: $M_s = 100.000 \cdot (1 + 0,10 \cdot 3) = 100.000 \cdot 1,30 = $\$130.00$0$ ($I_s = $\$30.00$0$).'
    - 'Paso 2: Calculamos interés compuesto: $M_c = 100.000 \cdot (1,10)^3 = 100.000 \cdot 1,331 = $\$133.10$0$ ($I_c = $\$33.10$0$).'
    - 'Paso 3: Comparamos: El régimen compuesto rinde $\$3.100$ adicionales respecto al simple.'
    - 'Paso 4: Conclusión: $M_c > M_s$ para $n = 3$, confirmando la ventaja exponencial.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Para qué valor del número de períodos $n$ los montos acumulados por interés simple e interés compuesto son exactamente iguales?'
    choices:
      - {text: 'En $n = 0$ (inicio) y en $n = 1$ (primer período)', is_correct: true}
      - {text: 'En todos los valores de $n$', is_correct: false}
      - {text: 'Únicamente cuando $n \ge 10$', is_correct: false}
      - {text: 'Nunca son iguales', is_correct: false}
    explanation: 'La alternativa correcta es ''En $n = 0$ (inicio) y en $n = 1$ (primer período)''. Para $n=1$, $(1+i)^1 = 1+i(1) = 1+i$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para una inversión a $5$ años con la misma tasa positiva, ¿cuál régimen genera mayor rendimiento acumulado?'
    choices:
      - {text: 'El régimen de interés compuesto, pues $n = 5 > 1$ ($M_c > M_s$)', is_correct: true}
      - {text: 'El régimen de interés simple', is_correct: false}
      - {text: 'Ambos entregan exactamente el mismo resultado', is_correct: false}
      - {text: 'Depende únicamente de la moneda utilizada', is_correct: false}
    explanation: 'La alternativa correcta es ''El régimen de interés compuesto, pues $n = 5 > 1$ ($M_c > M_s$)''. Por la desigualdad de Bernoulli, $(1+i)^5 > 1+5i$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Evaluar el monto simple $M_s = C(1 + i \cdot n)$.'
  - 'Paso 2: Evaluar el monto compuesto $M_c = C(1 + i)^n$.'
  - 'Paso 3: Contrastar ambos valores determinando la diferencia $M_c - M_s$.'
  - 'Paso 4: Verificar la consistencia con el horizonte temporal ($n=1 \implies M_s=M_c$; $n>1 \implies M_c>M_s$).'
errores_correccion: |
  - **Error 1:** Afirmar que el interés compuesto siempre supera al simple para todo valor de $n$ (olvidar $n=1$ y $0<n<1$). **Cómo corregirlo:** En $n=1$ los montos son **idénticos** y para fracciones de período $0<n<1$ el régimen simple es mayor.
  - **Error 2:** Comparar los regímenes utilizando tasas de distinta base temporal. **Cómo corregirlo:** Ambos cálculos deben emplear **la misma tasa periódica efectiva $i$**.
ejemplos:
  - titulo: 'Comparación a 2 períodos'
    enunciado: 'Para $\$50.000$ al $10\%$ anual en 2 años, ¿cuál es la diferencia de ganancia a favor del interés compuesto?'
    alternativas:
      - '$\$500$'
      - '$\$5.000$'
      - '$\$0$'
    respuesta: '$\$500$'
    solucion_pasos:
      - '1. Simple: $I_s = 50.000 \cdot 0,10 \cdot 2 = 10.000$.'
      - '2. Compuesto: $I_c = 50.000 \cdot (1,21 - 1) = 10.500$.'
      - '3. Diferencia: $10.500 - 10.000 = $\$50$0$.'
  - titulo: 'Equivalencia en el primer período'
    enunciado: '¿El monto acumulado al término del primer año ($n=1$) al $8\%$ sobre $\$100.000$ es $\$108.000$ en ambos regímenes?'
    alternativas:
      - 'Sí, pues $100.000 \cdot (1 + 0,08) = 100.000 \cdot (1,08)^1 = $\$108.00$0$'
      - 'No, el compuesto rinde $\$116.640$'
      - 'No, el simple rinde $\$104.000$'
    respuesta: 'Sí, pues $100.000 \cdot (1 + 0,08) = 100.000 \cdot (1,08)^1 = $\$108.00$0$'
    solucion_pasos:
      - '1. Para $n=1$, $M_s = M_c = C(1+i) = $\$108.00$0$.'
  - titulo: 'Comportamiento a largo plazo'
    enunciado: '¿A medida que el plazo $n$ aumenta, la diferencia monetaria entre el interés compuesto y el simple se incrementa exponencialmente?'
    alternativas:
      - 'Sí, debido a la divergencia asintótica entre una función exponencial y una función afín'
      - 'No, la diferencia se mantiene constante'
      - 'No, la diferencia disminuye con el tiempo'
    respuesta: 'Sí, debido a la divergencia asintótica entre una función exponencial y una función afín'
    solucion_pasos:
      - '1. La tasa de crecimiento del interés compuesto acelera con cada período adicional.'
  - titulo: 'Interés fraccionario (0 < n < 1)'
    enunciado: 'Para un plazo de medio año ($n = 0,5$) al $10\%$ anual, ¿el interés simple supera ligeramente al compuesto?'
    alternativas:
      - 'Sí, pues $(1 + 0,05) = 1,05 > \sqrt{1,10} \approx 1,0488$'
      - 'No, el compuesto siempre es mayor en cualquier intervalo'
      - 'No, son exactamente iguales'
    respuesta: 'Sí, pues $(1 + 0,05) = 1,05 > \sqrt{1,10} \approx 1,0488$'
    solucion_pasos:
      - '1. Simple: $1 + 0,10 \cdot 0,5 = 1,05$.'
      - '2. Compuesto: $(1,10)^{0,5} = \sqrt{1,10} \approx 1,0488$.'
      - '3. $1,05 > 1,0488$.'
errores_frecuentes:
  - 'El interés compuesto produce un monto final estrictamente superior al interés simple para cualquier valor positivo de $n$, incluyendo $n=1$.'
  - 'La gráfica del interés compuesto es una recta paralela ubicada por encima de la recta de interés simple.'
  - 'En el primer año de inversión ($n=1$), el interés compuesto genera mayores ganancias que el régimen simple.'
  - 'La diferencia entre ambos regímenes se reduce a cero cuando el plazo de inversión se extiende a más de diez años.'
  - 'Los modelos simple y compuesto comparten la misma fórmula de factor de acumulación lineal.'
afirmaciones_verdaderas:
  - 'Para $n = 1$, los montos acumulados bajo régimen simple y compuesto son exactamente iguales ($M_s(1) = M_c(1) = C(1+i)$).'
  - 'Para cualquier plazo $n > 1$ con tasa positiva, el monto final por interés compuesto es estrictamente mayor que el monto por interés simple ($M_c > M_s$).'
