  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado.
    Paso clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lee si el problema te pide comparar resultados en el primer periodo ($t=1$)
  o a largo plazo ($t>1$).'
- 'Paso 2: Si $t=1$, asume que los montos son idénticos.'
- 'Paso 3: Si $t>1$, asume que el Compuesto es matemáticamente mayor que el Simple.'
errores_correccion: Evita confundir los datos de entrada al operar con comparación
  entre regímenes de interés.
ejemplos:
- titulo: La carrera de los intereses
  enunciado: Sofía invierte $100.000 al 5% simple anual. Tomás invierte $100.000 al
    5% compuesto anual. ¿Quién tendrá más dinero al final del primer año y quién al
    final del segundo año?
  solucion_pasos:
  - 'Año 1: Ambos tendrán $100.000 + 5.000 = 105.000. Tienen lo MISMO.'
  - 'Año 2 (Sofía): $105.000 + 5.000 = 110.000. (Creció lineal).'
  - 'Año 2 (Tomás): El 5% de $105.000 es 5.250. Él tendrá $105.000 + 5.250 = 110.250.'
  - Tomás gana en el año 2 debido a la capitalización.
errores_frecuentes:
- Creer que el interés compuesto siempre es mayor desde el día 1 (en el periodo 1
  son exactamente iguales).
- Tratar de calcular las cifras exactas en preguntas teóricas de la PAES que solo
  buscan que reconozcas cuál es mayor.
afirmaciones_verdaderas:
- La propiedad de comparación entre regímenes de interés preserva la consistencia
  lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren comparación
  entre regímenes de interés.
