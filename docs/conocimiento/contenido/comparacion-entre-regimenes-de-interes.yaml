  question: ¿Cuál es el aspecto fundamental al trabajar con comparación entre regímenes
    de interés?
  choices:
  - text: Identificar correctamente la relación de interés compuesto
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de interés compuesto.
    Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de comparación entre regímenes de interés,
