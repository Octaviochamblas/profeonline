semantic_id: MAT.NUM.INTERES_COMPUESTO.COMPARACION_REGIMENES
resumen_inicial: 'Comparación entre regímenes de interés: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: Imagina que el simple es una bicicleta y el compuesto es un auto. En la
  primera cuadra ambos van iguales, pero si la carrera es larga, el auto te pasará por encima.
explicacion_formal: "Comparar el interés simple con el compuesto es un clásico problema de\
  \ la prueba:\n\n- **Si $t=1$ (Ej. el primer mes de una inversión a tasa mensual):**\n  -\
  \ Interés Simple: Ganas el $10\\%$ sobre tu capital.\n  - Interés Compuesto: Ganas el $10\\\
  %$ sobre tu capital.\n  - **Conclusión:** En $t=1$, ambos regímenes son **IGUALES**.\n\n\
  - **Si $t>1$ (A partir del segundo mes/año):**\n  - Interés Simple: Sigues ganando el mismo\
  \ $10\\%$ sobre el capital inicial (crecimiento lineal).\n  - Interés Compuesto: Ganas el\
  \ $10\\%$ sobre el capital inicial MÁS los intereses del mes anterior (crecimiento exponencial).\n\
  \  - **Conclusión:** El Interés Compuesto siempre generará **MÁS DINERO** (mayor ganancia\
  \ si es inversión, mayor deuda si es préstamo)."
definiciones_clave: '- **Comparación entre regímenes de interés**: Elemento central dentro
  del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a comparación entre regímenes de interés.'
ejemplo_guiado:
  enunciado: María invierte 80.000 pesos al 4% simple anual. Pedro invierte 80.000 pesos al
    4% compuesto anual. Compara cuánto tiene cada uno al final del año 1 y del año 2.
  pasos:
  - 'Calculo el año 1 para ambos: 80.000 más el 4% de 80.000, es decir 3.200, es igual a 83.200
    para ambos. En el año 1 tienen lo mismo.'
  - 'Calculo el año 2 de María, régimen simple: 83.200 más otros 3.200 es igual a 86.400.'
  - 'Calculo el año 2 de Pedro, régimen compuesto: el 4% de 83.200 es 3.328, así que Pedro
    tiene 83.200 más 3.328, igual a 86.528, más que María.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con comparación entre regímenes de
    interés?
  choices:
  - text: Identificar correctamente la relación de interés compuesto
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de interés compuesto.
    Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de comparación entre regímenes de interés, ¿qué
    paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
