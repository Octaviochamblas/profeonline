semantic_id: MAT.NUM.INTERES_COMPUESTO.COMPARACION_REGIMENES
resumen_inicial: 'Comparación entre regímenes de interés: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: Imagina que el simple es una bicicleta y el compuesto es un auto.
  En la primera cuadra ambos van iguales, pero si la carrera es larga, el auto te
  pasará por encima.
explicacion_formal: "Comparar el interés simple con el compuesto es un clásico problema\
  \ de la prueba:\n\n- **Si $t=1$ (Ej. el primer mes de una inversión a tasa mensual):**\n\
  \  - Interés Simple: Ganas el $10\\%$ sobre tu capital.\n  - Interés Compuesto:\
  \ Ganas el $10\\%$ sobre tu capital.\n  - **Conclusión:** En $t=1$, ambos regímenes\
  \ son **IGUALES**.\n\n- **Si $t>1$ (A partir del segundo mes/año):**\n  - Interés\
  \ Simple: Sigues ganando el mismo $10\\%$ sobre el capital inicial (crecimiento\
  \ lineal).\n  - Interés Compuesto: Ganas el $10\\%$ sobre el capital inicial MÁS\
  \ los intereses del mes anterior (crecimiento exponencial).\n  - **Conclusión:**\
  \ El Interés Compuesto siempre generará **MÁS DINERO** (mayor ganancia si es inversión,\
  \ mayor deuda si es préstamo)."
definiciones_clave: '- **Comparación entre regímenes de interés**: Elemento central
  dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a comparación entre regímenes de interés.'
ejemplo_guiado:
  enunciado: Aplica el concepto de comparación entre regímenes de interés en un ejercicio
    paso a paso.
  pasos:
  - Identificar los datos dados en el problema.
  - Aplicar la regla o fórmula correspondiente a comparación entre regímenes de interés.
  - Efectuar los cálculos aritméticos necesarios.
  - Concluir con el resultado final simplificado.
checkpoints:
