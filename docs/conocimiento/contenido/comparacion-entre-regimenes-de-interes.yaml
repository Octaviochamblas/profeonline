  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lee si el problema te pide comparar resultados en el primer periodo ($t=1$) o a
  largo plazo ($t>1$).'
- 'Paso 2: Si $t=1$, asume que los montos son idénticos.'
- 'Paso 3: Si $t>1$, asume que el Compuesto es matemáticamente mayor que el Simple.'
errores_correccion: Evita confundir los datos de entrada al operar con comparación entre regímenes
  de interés.
ejemplos:
- titulo: La carrera de los intereses
  enunciado: Sofía invierte $100.000 al 5% simple anual. Tomás invierte $100.000 al 5% compuesto
    anual. ¿Quién tendrá más dinero al final del primer año y quién al final del segundo año?
  solucion_pasos:
  - 'Año 1: Ambos tendrán $100.000 + 5.000 = 105.000. Tienen lo MISMO.'
  - 'Año 2 (Sofía): $105.000 + 5.000 = 110.000. (Creció lineal).'
  - 'Año 2 (Tomás): El 5% de $105.000 es 5.250. Él tendrá $105.000 + 5.250 = 110.250.'
  - Tomás gana en el año 2 debido a la capitalización.
- titulo: Ejemplo 2
  enunciado: En el año 1, ¿el interés simple y el compuesto generan el mismo monto?
  alternativas:
  - Sí
  - No, el compuesto es mayor
  - No, el simple es mayor
  respuesta: Sí
  solucion_pasos:
  - En el primer periodo ambos regímenes coinciden exactamente.
- titulo: Ejemplo 3
  enunciado: A largo plazo, ¿cuál régimen genera más dinero para un inversionista?
  alternativas:
  - El interés compuesto
  - El interés simple
  - Ambos generan lo mismo
  respuesta: El interés compuesto
  solucion_pasos:
  - El compuesto crece exponencialmente y supera al simple después del primer periodo.
- titulo: ¿El interés compuesto también genera una deuda mayor que el simple si se trata de
    un préstamo?
  respuesta: Sí
  solucion_pasos:
  - El mismo efecto de crecimiento exponencial aplica tanto a inversiones como a deudas.
errores_frecuentes:
- Creer que el interés compuesto siempre es mayor desde el día 1 (en el periodo 1 son exactamente
  iguales).
- Tratar de calcular las cifras exactas en preguntas teóricas de la PAES que solo buscan que
  reconozcas cuál es mayor.
- Creer que el interés compuesto siempre es mayor que el simple desde el primer periodo, cuando
  en el periodo 1 son exactamente iguales.
- Intentar calcular cifras exactas en preguntas teóricas que solo piden identificar cuál régimen
  genera más dinero.
- Confundir cuál de los dos regímenes crece más rápido a largo plazo.
afirmaciones_verdaderas:
- La propiedad de comparación entre regímenes de interés preserva la consistencia lógica.
- En el primer periodo (t=1), el interés simple y el interés compuesto generan exactamente
  el mismo monto; la diferencia aparece a partir del segundo periodo.
al_terminar_debes_poder: Resolver problemas aplicados que involucren comparación entre regímenes
  de interés.
