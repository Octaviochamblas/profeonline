resumen_inicial: La comparación entre regímenes demuestra que para $t = 1$ ambos devuelven
  el mismo monto, pero para $t > 1$ el interés compuesto supera estrictamente al simple
  debido a la capitalización periódica.
explicacion_simple: Si comparamos el interés simple y el compuesto en el primer período,
  ambos dan exactamente la misma ganancia. Sin embargo, a partir del segundo período
  en adelante, el interés compuesto siempre le gana al simple porque calcula intereses
  sobre los intereses ya ganados.
explicacion_formal: 'Para un capital $C$ y tasa $i$, la **Comparación entre Montos
  $M_s(t)$ y $M_c(t)$** satisface las tres condiciones de dominio:


  1. Para $t = 0$: $M_s(0) = M_c(0) = C$.

  2. Para $t = 1$: $M_s(1) = M_c(1) = C(1 + i)$.

  3. Para $t > 1$: $M_c(t) > M_s(t) \iff C(1+i)^t > C(1+i \cdot t)$.'
definiciones_clave: '- **Comparación de regímenes**: Demostración de dominancia del
  interés compuesto $M_c > M_s$ para $t > 1$.'
propiedades_relaciones: '- **Punto de corte en $t=1$**: Coincidencia exacta de rendimientos
  al final del primer período.'
ejemplo_guiado:
  enunciado: Compare el monto alcanzado por \$100.000 al $10\%$ anual en régimen simple
    vs compuesto para $t=1$ y $t=3$ años.
  pasos:
  - 'Paso 1: Para $t=1$ año:

    - Simple: $M_s = 100.000 \cdot (1 + 0,10) = 110.000$.

    - Compuesto: $M_c = 100.000 \cdot (1 + 0,10)^1 = 110.000$.

    - Resultado: $M_s = M_c = 110.000$.'
  - 'Paso 2: Para $t=3$ años:

    - Simple: $M_s = 100.000 \cdot (1 + 0,30) = 130.000$.

    - Compuesto: $M_c = 100.000 \cdot 1,10^3 = 133.100$.

    - Resultado: $M_c > M_s$ (ganancia adicional de \$3.100 en compuesto).'
  - 'Conclusión: Coinciden en $t=1$, pero el compuesto domina para $t > 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué momento temporal coinciden exactamente los montos acumulados por
    el interés simple y el compuesto?
  choices:
  - text: Al finalizar el primer período de capitalización (t = 1)
    is_correct: true
  - text: Al cabo de 10 años
    is_correct: false
  - text: Nunca coinciden
    is_correct: false
  - text: Siempre coinciden en todos los períodos
    is_correct: false
  explanation: La alternativa correcta es 'Al finalizar el primer período de capitalización
    (t = 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $100.000 al 10% a 3 años, ¿cuál fue la diferencia
    a favor del interés compuesto?
  choices:
  - text: 3.100 $ adicionales (133.100 $ vs 130.000 $)
    is_correct: true
  - text: 10.000 $ adicionales
    is_correct: false
  - text: Cero diferencia
    is_correct: false
  - text: 30.000 $ adicionales
    is_correct: false
  explanation: La alternativa correcta es '3.100 $ adicionales (133.100 $ vs 130.000
    $)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de comparar numéricamente y gráficamente
  los regímenes de interés simple y compuesto evaluando la dominancia para $t > 1$.
semantic_id: MAT.NUM.INTERES_COMPUESTO.COMPARACION_REGIMENES
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.COMPARACION_REGIMENES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
