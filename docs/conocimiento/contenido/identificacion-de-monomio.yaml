resumen_inicial: Un monomio es un tipo especial de expresión algebraica formada por
  un solo término donde las variables tienen exponentes enteros no negativos.
explicacion_simple: 'Un monomio es la expresión algebraica más simple que existe:
  consta de un único bloque multiplicativo (como $-7x^4y^2$). No lleva sumas ni restas
  fuera del término, y sus exponentes deben ser números enteros positivos o cero (no
  se permiten letras dividiendo ni dentro de raíces).'
explicacion_formal: 'Un **Monomio** $M(x_1, \dots, x_m)$ es una expresión algebraica
  de un único término de la forma:


  $$M = c \cdot x_1^{e_1} x_2^{e_2} \dots x_m^{e_m} \quad \text{con } c \in \mathbb{R},
  \quad e_j \in \mathbb{N}_0 = \{0, 1, 2, \dots\}$$


  > **Complemento didáctico:** El monomio actúa como la unidad irreducible en la construcción
  de los polinomios.'
definiciones_clave: '- **Monomio**: Expresión de término único con exponentes enteros
  no negativos.

  - **Grado del monomio**: Suma de los exponentes de sus variables.'
propiedades_relaciones: '- **Restricción de exponentes**: Exponentes negativos o fraccionarios
  impiden que una expresión sea un monomio.'
ejemplo_guiado:
  enunciado: Determine cuál de las expresiones $A = -4x^3y^5$, $B = 3x^{-2}$ y $C
    = x + y$ es un monomio.
  pasos:
  - 'Paso 1: Analizar $A = -4x^3y^5$: 1 solo término, exponentes $3$ y $5$ enteros
    positivos $\to$ SÍ es monomio.'
  - 'Paso 2: Analizar $B = 3x^{-2}$: 1 término, pero exponente $-2$ es negativo $\to$
    NO es monomio entero.'
  - 'Paso 3: Analizar $C = x + y$: tiene $2$ términos separados por suma $\to$ NO
    es monomio.'
  - 'Conclusión: Únicamente $A = -4x^3y^5$ cumple con ser monomio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir los exponentes de las variables en un monomio?
  choices:
  - text: Deben ser números enteros no negativos (0, 1, 2, 3, ...)
    is_correct: true
  - text: Deben ser obligatoriamente números racionales negativos
    is_correct: false
  - text: Deben ser mayores que 100
    is_correct: false
  - text: Deben ser números pares de forma estricta
    is_correct: false
  explanation: La alternativa correcta es 'Deben ser números enteros no negativos
    (0, 1, 2, 3, ...)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la expresión 3x^-2 fue descartada como
    monomio entero?
  choices:
  - text: Porque su exponente es un número negativo (-2)
    is_correct: true
  - text: Porque tiene tres términos
    is_correct: false
  - text: Porque su coeficiente es 3
    is_correct: false
  - text: Porque carece de constante
    is_correct: false
  explanation: La alternativa correcta es 'Porque su exponente es un número negativo
    (-2)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Contar la cantidad de términos (debe ser exactamente 1).'
- 'Paso 2: Inspeccionar los exponentes de las letras.'
- 'Paso 3: Si son enteros mayores o iguales a cero, declarar que es un monomio.'
errores_correccion: '- **Error 1: Clasificar $\frac{5}{x}$ como monomio.** **Cómo
  corregirlo:** $\frac{5}{x} = 5x^{-1}$, posee un exponente negativo, por lo que no
  es un monomio polinómico.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes elementos es un monomio?
  alternativas:
  - -9a^4b^2
  - a^2 + b^2
  - 5/x^3
  - 2x - 1
  respuesta: -9a^4b^2
  solucion_pasos:
  - 1. -9a^4b^2 es un solo término con exponentes enteros positivos (4 y 2). Es un
    monomio.
- titulo: Ejemplo 2
  enunciado: ¿Por qué 4x^3 + 2 no es un monomio?
  alternativas:
  - Porque posee dos términos separados por el operador de suma +
  - Porque el exponente es 3
  - Porque su coeficiente es 4
  - Porque falta la variable y
  respuesta: Porque posee dos términos separados por el operador de suma +
  solucion_pasos:
  - 1. La presencia de la suma separa la expresión en dos términos (binomio), no en
    un monomio.
- titulo: ¿Es la constante numérica 12 un monomio de grado 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, una constante no nula es un monomio con exponente 0 en su variable.
- titulo: ¿Es la expresión 3x^2y^-1 un monomio en los polinomios?
  respuesta: 'No'
  solucion_pasos:
  - No, el exponente -1 en la variable y no es no negativo.
errores_frecuentes:
- Declarar como monomio a expresiones con exponentes negativos o fraccionarios en
  las letras.
- Clasificar como monomio a expresiones de dos o más términos aditivos.
- Declarar que una constante sola (como 8) no es un monomio.
- Declarar la parte literal del monomio con la cantidad total de sus términos.
- Declarar que los coeficientes fraccionarios impiden que una expresión sea un monomio.
afirmaciones_verdaderas:
- Un monomio consta de un único término con exponentes enteros no negativos.
- Una constante numéricamente real es un monomio de grado cero.
al_terminar_debes_poder: Al terminar serás capaz de identificar un monomio comprobando
  que la expresión tenga un solo término y sus exponentes sean enteros positivos o
  cero.
