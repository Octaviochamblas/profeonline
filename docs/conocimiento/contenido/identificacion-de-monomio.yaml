semantic_id: MAT.ALG.EXPRESIONES.IDENTIFICACION_MONOMIO
resumen_inicial: 'Un monomio es una expresión algebraica entera compuesta por un único término donde las variables tienen exponentes enteros no negativos.'
explicacion_simple: |
  - Un **monomio** es un término algebraico formado **únicamente por multiplicaciones** entre números y letras.
  - **Condiciones obligatorias para ser monomio:**
    1. Debe tener **un solo término** (no hay signos $+$ o $-$ sumando bloques externos).
    2. Los exponentes de todas las variables deben ser **números enteros positivos o cero** ($0, 1, 2, 3, \dots$).
    3. Las variables **no pueden estar en el denominador** ni dentro de raíces (por ejemplo, $\frac{3}{x}$ y $\sqrt{x}$ **NO** son monomios).
  - Ejemplos válidos: $-5x^3y^2$, $\frac{2}{3}a^4b$, $7z$, $12$ (constante).

  ![Identificación de Monomio](/static/img/nodos/identificacion-de-monomio-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $\mathbb{K}$ un cuerpo de coeficientes. Un **monomio** en las variables $x_1, x_2, \dots, x_n$ es una expresión algebraica entera de la forma:

  $$M(x_1, \dots, x_n) = c \cdot x_1^{e_1} x_2^{e_2} \cdots x_n^{e_n}$$

  Donde:
  - $c \in \mathbb{K} \setminus \{0\}$ es el coeficiente numérico.
  - $\forall i \in \{1, \dots, n\}, \quad e_i \in \mathbb{N}_0 = \{0, 1, 2, 3, \dots\}$.

  ### Criterios de exclusión
  No son monomios:
  - Expresiones con sumas o restas externas: $2x + 3y$ (es binomio).
  - Expresiones con variables divisorias: $\frac{4}{x} = 4x^{-1}$ (exponente $-1 \notin \mathbb{N}_0$).
  - Expresiones con variables bajo radical: $\sqrt{x} = x^{1/2}$ (exponente racional no entero).
definiciones_clave: |
  - **Monomio**: Expresión algebraica de un solo término con exponentes enteros no negativos.
  - **Grado de un monomio**: Suma de los exponentes naturales de todas sus variables.
  - **Monomio constante**: Número real puro sin variables literales ($GA = 0$).
propiedades_relaciones: |
  - **Cierre bajo el producto**: El producto de dos monomios es siempre otro monomio.
  - **Condición de suma**: La suma de dos monomios es otro monomio si y solo si son términos semejantes.
ejemplo_guiado:
  enunciado: 'Clasifica cuáles de las siguientes expresiones son monomios y justifica en cada caso: a) $-8x^4y^3$, b) $\frac{5x^2}{y}$, c) $3\sqrt{x}$, d) $-\frac{2}{7}a^5b$.'
  imagen: '/static/img/nodos/identificacion-de-monomio-ejemplos.svg'
  pasos:
    - 'Paso 1: $-8x^4y^3$ tiene un solo término y exponentes $4, 3 \in \mathbb{N}_0 \implies$ **Sí es monomio**.'
    - 'Paso 2: $\frac{5x^2}{y} = 5x^2y^{-1}$ tiene la variable $y$ en el denominador (exponente $-1$) $\implies$ **NO es monomio** (es expresión racional fraccionaria).'
    - 'Paso 3: $3\sqrt{x} = 3x^{1/2}$ tiene exponente fraccionario $\implies$ **NO es monomio** (es expresión irracional).'
    - 'Paso 4: $-\frac{2}{7}a^5b$ tiene coeficiente fraccionario $-\frac{2}{7}$ pero exponentes enteros $5, 1 \in \mathbb{N}_0 \implies$ **Sí es monomio**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones algebraicas califica formalmente como un monomio?'
    choices:
      - text: '$-\frac{4}{9}x^3y^5$'
        is_correct: true
      - text: '$\frac{3x}{y^2}$'
        is_correct: false
      - text: '$2x^2 + 5x$'
        is_correct: false
      - text: '$5\sqrt{x^3}$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$-\frac{4}{9}x^3y^5$''. Es un solo término multiplicativo con exponentes enteros positivos (3 y 5).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la expresión $7x^{-2}y^4$ NO es un monomio?'
    choices:
      - text: 'Porque la variable $x$ tiene un exponente negativo ($-2$), lo que no cumple la condición de entero no negativo'
        is_correct: true
      - text: 'Porque tiene dos variables'
        is_correct: false
      - text: 'Porque su coeficiente es 7'
        is_correct: false
      - text: 'Porque el exponente 4 es par'
        is_correct: false
    explanation: 'La alternativa correcta es ''Porque la variable $x$ tiene un exponente negativo ($-2$), lo que no cumple la condición de entero no negativo''. Los monomios exigen $e_i \in \mathbb{N}_0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comprobar que la expresión esté formada por un único término (sin sumas o restas separando bloques).'
  - 'Paso 2: Verificar que ninguna variable se encuentre en un denominador divisor.'
  - 'Paso 3: Verificar que ninguna variable esté afectada por radicales o exponentes fraccionarios.'
  - 'Paso 4: Confirmar que todos los exponentes literales pertenezcan a $\mathbb{N}_0 = \{0, 1, 2, \dots\}$.'
errores_correccion: |
  - **Error 1:** Descartar como monomio términos con coeficientes fraccionarios como $\frac{1}{2}x^3$. **Cómo corregirlo:** La restricción de enteros aplica a los **exponentes de las variables**, no al coeficiente numérico.
  - **Error 2:** Considerar que $\frac{5}{x^2}$ es un monomio. **Cómo corregirlo:** La variable en el denominador equivale a $5x^{-2}$, lo cual **invalida la condición de monomio**.
ejemplos:
  - titulo: 'Monomio multivariable con coeficiente real'
    enunciado: '¿Es $\sqrt{3}x^2y^4z$ un monomio válido?'
    alternativas:
      - 'Sí, porque el radical solo afecta al coeficiente numérico constante'
      - 'No, porque contiene un signo de raíz cuadrada'
      - 'No, porque tiene tres variables'
    respuesta: 'Sí, porque el radical solo afecta al coeficiente numérico constante'
    solucion_pasos:
      - '1. El coeficiente es el número real $\sqrt{3}$.'
      - '2. Las variables $x, y, z$ tienen exponentes $2, 4, 1 \in \mathbb{N}_0$.'
      - '3. Es un monomio válido.'
  - titulo: 'Identificación de exponente negativo'
    enunciado: '¿Por qué la expresión $4a^3b^{-1}$ no califica como monomio?'
    alternativas:
      - 'Porque la variable $b$ tiene exponente negativo $-1$'
      - 'Porque tiene coeficiente 4'
      - 'Porque $a$ está al cubo'
    respuesta: 'Porque la variable $b$ tiene exponente negativo $-1$'
    solucion_pasos:
      - '1. Un monomio exige exponentes enteros $\ge 0$.'
      - '2. Como el exponente es $-1$, es una expresión fraccionaria $\frac{4a^3}{b}$.'
  - titulo: 'Monomio constante'
    enunciado: '¿Es el número entero 8 un monomio de grado cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $8 = 8x^0$, con exponente $0 \in \mathbb{N}_0$.'
      - '2. Las constantes numéricas son monomios de grado 0.'
  - titulo: 'Binomio disfrazado'
    enunciado: '¿Es la expresión $x^2 + y^2$ un monomio de segundo grado?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Contiene un signo $+$ que separa dos términos.'
      - '2. Es un binomio, no un monomio.'
errores_frecuentes:
  - 'Creer que un coeficiente numérico negativo o fraccionario impide que el término sea un monomio.'
  - 'Clasificar como monomio expresiones con letras en el denominador (como $\frac{3}{x}$).'
  - 'Confundir un monomio con un binomio cuyos términos tienen el mismo grado ($x^2 + y^2$).'
  - 'Aceptar exponentes negativos o fraccionarios en las variables de un monomio.'
  - 'Suponer que una constante numérica pura como el 5 no es un monomio.'
afirmaciones_verdaderas:
  - 'Un monomio es un término algebraico único donde todas las variables tienen exponentes enteros no negativos.'
  - 'Toda constante numérica real no nula es un monomio de grado cero.'
al_terminar_debes_poder: |
  ![Resumen de Monomio](/static/img/nodos/identificacion-de-monomio-resumen.svg)

  QUÉ: Identificar y verificar rigurosamente si una expresión algebraica es un monomio analizando la cantidad de términos y los exponentes literales.
  CÓMO: Comprobando que exista un solo término multiplicativo ($c \cdot X$) y que todos los exponentes pertenezcan a $\mathbb{N}_0$ en monomios como $-5x^3y^2$.
