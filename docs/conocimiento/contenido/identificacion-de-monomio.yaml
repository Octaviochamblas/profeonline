semantic_id: MAT.ALG.EXPRESIONES.IDENTIFICACION_MONOMIO
resumen_inicial: 'La identificación de monomio consiste en reconocer aquellas expresiones algebraicas compuestas por un único término algebraico, donde los coeficientes y variables están unidos exclusivamente por multiplicación o exponentes enteros no negativos.'
explicacion_simple: |
  Un **monomio** es una expresión algebraica formada por **UN SOLO TÉRMINO**:
  - La palabra "mono" significa "uno solo".
  - Ejemplos de monomios: $7x$, $-5x^2 y^3$, $\frac{2}{3}a^4$, $-12$.
  - **¿Cómo reconocer que SÍ es un monomio?**
    - No debe haber signos $+$ o $-$ fuera del coeficiente inicial.
    - Las variables deben tener **exponentes enteros positivos o cero** ($1, 2, 3...$), nunca exponentes negativos ni variables dentro de raíces o denominadores.
  - Ejemplo de lo que NO es monomio: $3x + 2y$ (tiene 2 términos), $\frac{5}{x}$ (variable en el denominador).
explicacion_formal: |
  ### Definición formal
  Un **monomio** en las variables $x_1, \dots, x_k$ es un polinomio $P(x_1, \dots, x_k) \in \mathbb{R}[x_1, \dots, x_k]$ compuesto por un único término de la forma:

  $$M(x_1, \dots, x_k) = c \cdot x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$$

  donde $c \in \mathbb{R}$ es el coeficiente escalar real y $\alpha_1, \dots, \alpha_k \in \mathbb{N}_0 = \{0, 1, 2, 3, \dots\}$ son exponentes enteros no negativos.

  ### Criterios de Exclusión (No son monomios)
  1. **Variables en denominador**: $\frac{c}{x} = c \cdot x^{-1} \implies \alpha = -1 \notin \mathbb{N}_0$.
  2. **Variables bajo radical**: $\sqrt{x} = x^{1/2} \implies \alpha = \frac{1}{2} \notin \mathbb{N}_0$.
  3. **Sustracción o Adición explícita**: $a + b \implies$ Expresión multitérmino (binomio).

  ### Síntesis didáctica
  El monomio es la forma polinómica de grado atómico. Constituye la unidad base para definir binomios, trinomios y polinomios generales.
definiciones_clave: |
  - **Monomio**: Expresión algebraica formada por un solo término con exponentes enteros no negativos en sus variables.
  - **Grado de un monomio**: Suma de los exponentes de sus variables (grado absoluto del término).
  - **Monomio semejante**: Monomios que comparten la misma parte literal.
propiedades_relaciones: |
  - **Cierre bajo multiplicación**: El producto de dos monomios es siempre otro monomio.
  - **Cierre bajo adición restringida**: La suma de dos monomios es otro monomio si y solo si los monomios son **semejantes**.
ejemplo_guiado:
  enunciado: 'De las siguientes 4 expresiones algebraicas, determina cuáles son monomios válidos y cuáles no: a) $-9x^4 y^2$, b) $3x + 8$, c) $\frac{5}{a}$, d) $-14$.'
  pasos:
    - 'Paso 1: Analizamos a) $-9x^4 y^2$: Es un único término y sus exponentes ($4$ y $2$) son enteros positivos $\implies$ **Es monomio**.'
    - 'Paso 2: Analizamos b) $3x + 8$: El signo $+$ separa dos términos $\implies$ **No es monomio** (es un binomio).'
    - 'Paso 3: Analizamos c) $\frac{5}{a}$: La variable $a$ está en el denominador ($5a^{-1}$) $\implies$ **No es monomio**.'
    - 'Paso 4: Analizamos d) $-14$: Es un número constante sin letras (exponente de variable $0 \in \mathbb{N}_0$) $\implies$ **Es monomio** (monomio constante).'
    - 'Conclusión: Únicamente **a) y d) son monomios**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes condiciones es INDISPENSABLE para que una expresión sea clasificada como un monomio en álgebra?'
    choices:
      - {text: 'Tener un único término algebraico con exponentes enteros no negativos en sus variables', is_correct: true}
      - {text: 'Contener un signo de suma ($+$) entre sus variables', is_correct: false}
      - {text: 'Tener variables en el denominador con exponentes negativos', is_correct: false}
      - {text: 'Tener exactamente tres letras distintas', is_correct: false}
    explanation: 'La alternativa correcta es ''Tener un único término algebraico con exponentes enteros no negativos en sus variables''. Criterio formal de monomio.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la expresión algebraica $\frac{7}{x^2}$ NO es un monomio?'
    choices:
      - {text: 'Porque la variable $x$ está en el denominador, lo que equivale a un exponente negativo $x^{-2}$', is_correct: true}
      - {text: 'Porque el número 7 es impar', is_correct: false}
      - {text: 'Porque tiene dos coeficientes numéricos distintos', is_correct: false}
      - {text: 'Porque le falta el signo de suma', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la variable $x$ está en el denominador, lo que equivale a un exponente negativo $x^{-2}$''. Los exponentes deben ser enteros no negativos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Contar los términos de la expresión verificando que no existan signos $+$ o $-$ separando partes.'
  - 'Paso 2: Comprobar que no existan variables en el denominador de una fracción.'
  - 'Paso 3: Verificar que los exponentes de todas las variables sean números enteros no negativos ($0, 1, 2, 3...$).'
  - 'Paso 4: Confirmar que las variables no estén dentro de una raíz cuadrada o radical.'
errores_correccion: |
  - **Error 1:** Clasificar expresiones con variables en el denominador como $\frac{3}{x}$ como si fueran monomios. **Cómo corregirlo:** Para ser un monomio, **las variables no pueden estar en el denominador**.
  - **Error 2:** Declarar que un número constante solo como $-8$ no es un monomio. **Cómo corregirlo:** Un número constante **SÍ es un monomio** de grado cero.
ejemplos:
  - titulo: 'Reconocimiento de monomio multivariable'
    enunciado: '¿Es la expresión $-12a^3 b^5 c$ un monomio válido?'
    alternativas:
      - 'Sí, porque es un solo término con exponentes enteros positivos'
      - 'No, porque tiene tres letras distintas'
      - 'No, porque el coeficiente es negativo'
    respuesta: 'Sí, porque es un solo término con exponentes enteros positivos'
    solucion_pasos:
      - '1. Posee un solo término.'
      - '2. Sus exponentes son $3, 5$ y $1$ (enteros no negativos).'
      - '3. Es un monomio.'
  - titulo: 'Monomio constante'
    enunciado: '¿El número $25$ se clasifica como un monomio constante de grado cero?'
    alternativas:
      - 'Sí'
      - 'No, requiere llevar al menos una letra'
      - 'Indeterminado'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $25 = 25x^0$.'
      - '2. Es un monomio de grado cero.'
  - titulo: 'Rechazo por variable bajo raíz'
    enunciado: 'La expresión $4\sqrt{x}$, ¿es un monomio algebraico polinómico?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la raíz cuadrada equivale a exponente fraccionario $x^{1/2}$, no entero.'
  - titulo: 'Producto de monomios'
    enunciado: 'Al multiplicar el monomio $2x$ por el monomio $3x^2$, ¿el resultado $6x^3$ sigue siendo un monomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el producto de monomios da como resultado otro monomio.'
errores_frecuentes:
  - 'Una expresión con variables en el denominador es un monomio si su coeficiente numérico es entero.'
  - 'Un número constante solo sin letras no se considera un monomio.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Un monomio negativo pierde su categoría al ser elevado a un exponente impar.'
  - 'Sumar dos monomios no semejantes da como resultado un monomio de grado superior.'
afirmaciones_verdaderas:
  - 'Un monomio es un polinomio de un solo término con exponentes enteros no negativos en sus variables.'
  - 'Los números constantes sin variables son monomios de grado cero.'
al_terminar_debes_poder: 'Identificar monomios comprobando la existencia de un solo término y la ausencia de variables en denominadores o bajo radicales.'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Nomenclatura.'
