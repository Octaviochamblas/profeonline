semantic_id: MAT.ALG.EXPRESIONES.IDENTIFICACION_MONOMIO
resumen_inicial: 'Identificación de monomio: concepto y propiedades en Expresiones
  algebraicas y polinomios básicos.'
explicacion_simple: En el lenguaje cotidiano, 'mono' significa uno (monociclo, monolito,
  monopolio). En álgebra ocurre exactamente lo mismo.
explicacion_formal: '### Definición formal


  Mono significa uno. Un monomio es un bloque de un solo término (sin + ni - como
  separadores).


  ### Desarrollo didáctico


  Para saber si estás frente a un monomio, busca los signos + y -.

  - $5x$: Es un monomio (no hay sumas ni restas sueltas).

  - $-3a^2b$: Es un monomio. Espera. ¿No hay un signo menos ahí? Sí, pero ese signo
  le pertenece al coeficiente numérico ($-3$), no está *separando* a la $a$ de la
  $b$. Es un solo bloque sólido.

  - $\frac{x^2y}{4z}$: Es un monomio (el bloque es gigante, pero está todo pegado
  por divisiones y multiplicaciones).

  - $a + b$: ALERTA. Hay un signo + libre en el medio. Son dos vagones separados.
  Esto NO es un monomio.'
definiciones_clave: '- **Identificación de monomio**: Elemento fundamental del lenguaje
  algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de monomio**: Reglas de
  notación y clasificación en expresiones algebraicas y polinomios básicos.'
ejemplo_guiado:
