semantic_id: MAT.ALG.INECUACIONES_LINEALES.INECUACION_TODO_REAL
resumen_inicial: Una inecuación tiene solución real total ($S = \mathbb{R}$) cuando las variables se cancelan y se obtiene una identidad numérica verdadera.
explicacion_simple: '![Reconocimiento de inecuación lineal con solución real total](/static/img/nodos/reconocimiento-de-inecuacion-lineal-con-solucion-real-total-intro.svg)


  Si al reducir una inecuación (como $3x + 10 > 3x + 2$), las $x$ se cancelan por completo ($3x - 3x = 0$) y nos queda una verdad indiscutible como $10 > 2$.

  Como $10 > 2$ es SIEMPRE verdadero independientemente del valor de $x$, concluimos que **TODOS LOS NÚMEROS REALES SON SOLUCIÓN** y su conjunto solución es $S = \mathbb{R}$ (o $]-\infty, +\infty[$).'
explicacion_formal: 'Dada la inecuación reducida $0 \cdot x < b - a$ donde $b - a > 0$, el **conjunto solución total** se formaliza como:


  $$0 < k \quad (\text{con } k > 0) \implies \text{Tautología / Identidad verdadera } \implies S = \mathbb{R} = ]-\infty, +\infty[$$


  **Desglose de la fórmula:**

  - $S = \mathbb{R}$: Todos los infinitos puntos de la recta real satisfacen la inecuación.'
definiciones_clave: '- **Inecuación tautológica / universal**: Inecuación que se verifica para absolutamente cualquier número real ($S = \mathbb{R}$).

  - **Identidad verdadera en inecuaciones**: Desigualdad constante válida resultante de la supresión de variables (como $10 > 2$).'
propiedades_relaciones: '- **Totalidad del conjunto real**: El conjunto solución abarca desde $-\infty$ hasta $+\infty$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Reconocimiento de inecuación lineal con solución real total](/static/img/nodos/reconocimiento-de-inecuacion-lineal-con-solucion-real-total-ejemplos.svg)


    Resuelve la inecuación $5x + 12 > 5x + 3$, analiza la verdad numérica y determina el conjunto solución $S$.'
  pasos:
  - 'Paso 1: Trasponer $5x$ al primer miembro: $5x - 5x + 12 > 3$.Paso 2: Cancelar las variables: $0x + 12 > 3 \implies 12 > 3$.Paso 3: Analizar la desigualdad numérica $12 > 3$: es una verdad matemática indiscutible (VERDADERO).Paso 4: Concluir que cualquier número real satisface la inecuación, luego $S = \mathbb{R} = ]-\infty, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reducir la inecuación $5x + 12 > 5x + 3$, se obtiene la verdad $12 > 3$. ¿Cuál es el conjunto solución $S$?
  choices:
  - text: $S = \mathbb{R}$ (o $]-\infty, +\infty[$)
    is_correct: true
  - text: $S = \emptyset$
    is_correct: false
  - text: $S = ]3, 12[$
    is_correct: false
  - text: $S = \{12\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \mathbb{R}$ (o $]-\infty, +\infty[$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre si probamos los números $x = -100$ ó $x = 500$ en la inecuación $5x + 12 > 5x + 3$?
  choices:
  - text: Ambos números satisfacen la inecuación porque todos los reales son solución.
    is_correct: true
  - text: Ambos números fallan la prueba.
    is_correct: false
  - text: Solo los números positivos satisfacen la inecuación.
    is_correct: false
  - text: El resultado da cero.
    is_correct: false
  explanation: La alternativa correcta es 'Ambos números satisfacen la inecuación porque todos los reales son solución.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar las variables $x$ en un miembro.'
- 'Paso 2: Notar que las variables se cancelan ($0x = 0$).'
- 'Paso 3: Evaluar la veracidad de la constante numérica restante.'
- 'Paso 4: Si la constante es Verdadera, declarar $S = \mathbb{R}$.'
errores_correccion: '- **Error común:** Pensar que si la variable se cancela, la inecuación carece de solución.

  - **Cómo corregirlo:** Si se cancela la variable y la constante resultante es VERDADERA, la solución son TODOS los números reales ($S = \mathbb{R}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Al simplificar una inecuación a la proposición verdadera $0x > -5$, se concluye que no existe solución en $\mathbb{R}$.
- Una inecuación lineal que se reduce a la desigualdad numéricamente válida $4 > 1$ tiene como solución exclusiva el conjunto vacío $\emptyset$.
- Las inecuaciones lineales de primer grado siempre poseen cotas o restricciones y nunca pueden tener a $\mathbb{R}$ como solución.
- La expresión $x + 3 > x$ se evalúa como una inecuación con solución única $x = 0$.
- La condición de solución real total $S = \mathbb{R}$ exige que todos los coeficientes de la inecuación original sean positivos.
afirmaciones_verdaderas:
- Si el despeje de una inecuación elimina la incógnita y resulta en una desigualdad numéricamente verdadera ($0x < k$ con $k > 0$), el conjunto solución es $\mathbb{R}$.
- Cualquier número real satisface una inecuación cuya reducción lógica conduce a una identidad verdadera universal.
al_terminar_debes_poder: '**QUÉ:** Reconocer inecuaciones lineales con solución universal en todos los números reales ($S = \mathbb{R}$).


  **CÓMO:** Identificando la anulación de la incógnita ($0x$) que conduce a una desigualdad numérica siempre verdadera (ej: $0 < 7$).


  ![Resumen Reconocimiento de inecuación lineal con solución real total](/static/img/nodos/reconocimiento-de-inecuacion-lineal-con-solucion-real-total-resumen.svg)'
