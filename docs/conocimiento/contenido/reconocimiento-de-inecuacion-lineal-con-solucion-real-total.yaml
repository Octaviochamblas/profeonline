semantic_id: MAT.ALG.INECUACIONES_LINEALES.INECUACION_TODO_REAL
resumen_inicial: 'Reconocimiento de inecuación lineal con solución real total: relaciones
  de orden, intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: A veces, al simplificar una inecuación lineal, la variable desaparece
  dejando una afirmación matemática que es siempre cierta. En estos escenarios, cualquier
  valor real que tome la variable satisfará la desigualdad inicial.
explicacion_formal: '### Definición formal

  Considerando una inecuación lineal $ax + b < cx + d$, si $a = c$ y la constante
  $b$ es estrictamente menor que $d$ ($b < d$), la expresión se transforma en una
  proposición lógica verdadera. Como esta verdad es independiente de la variable $x$,
  el conjunto solución corresponde a la totalidad de los números reales, lo cual se
  denota como $S = \\mathbb{R}$ o $S = (-\\infty, \\infty)$.


  ### Desarrollo didáctico

  Al enfrentarse a una inecuación, el paso regular es trasladar todos los términos
  dependientes de la variable a un lado y los términos independientes al otro. Si
  las variables poseen los mismos coeficientes en ambos lados, se cancelan.

  El resultado es una desigualdad puramente numérica. Si esta desigualdad es lógicamente
  correcta (por ejemplo, $2 < 5$ o $-1 \\leq 0$), indica que la relación inicial se
  mantiene siempre. Por consiguiente, cualquier número que se reemplace en la variable
  $x$ hará que la desigualdad original sea correcta.'
definiciones_clave: '- **Reconocimiento de inecuación lineal con solución real total**:
