procedimiento:
- Desarrollar y simplificar las expresiones en ambos miembros de la inecuación.
- Reunir los términos con la variable en un solo lado de la desigualdad.
- Verificar si los coeficientes de las variables son iguales, causando su anulación
  ($0x$).
- Evaluar la desigualdad numérica resultante; si es una proposición verdadera, concluir
  que la solución son todos los números reales.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en reconocimiento de inecuación
  lineal con solución real total.
ejemplos:
- titulo: Inecuación con proposición verdadera
  enunciado: Determinar el conjunto solución de $4x - 1 < 4x + 3$.
  solucion_pasos:
  - Restar $4x$ en ambos miembros para agrupar las incógnitas - $4x - 4x - 1 < 3$.
  - Simplificar los términos algebraicos - $-1 < 3$.
  - Observar que $-1 < 3$ es una afirmación siempre verdadera.
  - Concluir que el conjunto solución abarca a todos los reales - $S = \\mathbb{R}$.
- titulo: Resolución con distribución de coeficientes
  enunciado: Resolver la inecuación $5(x + 1) \\geq 5x + 5$.
  solucion_pasos:
  - Distribuir el coeficiente $5$ en el miembro izquierdo - $5x + 5 \\geq 5x + 5$.
  - Restar $5x$ en ambos lados - $5 \\geq 5$.
  - Analizar la proposición numérica resultante - $5$ es igual a $5$, por lo que la
    relación "mayor o igual" se cumple.
  - Concluir que cualquier número real satisface la inecuación - $S = \\mathbb{R}$.
- titulo: Pregunta sobre cancelación de variables con resultado verdadero
  respuesta: Verdadero
  solucion_pasos:
  - Identificar que al restar los términos con la variable obtenemos una desigualdad
    puramente numérica.
  - Si el resultado es una proposición lógicamente verdadera como $0 < 8$, la desigualdad
    se cumple sin importar el valor de la variable.
  - Por lo tanto, es correcto que la solución sean todos los números reales.
- titulo: Pregunta sobre igualdad estricta
  respuesta: Falso
  solucion_pasos:
  - Si al reducir términos obtenemos una expresión como $7 < 7$, debemos evaluarla
    estrictamente.
  - El número $7$ no es menor que $7$, por lo que es falso.
  - Si la afirmación preguntaba si esto indica que la solución son todos los reales,
    la respuesta es negativa, pues en este caso no habría solución.
errores_frecuentes:
- Confundir una proposición verdadera con una falsa, llegando a concluir que no hay
  solución.
- Creer que porque la variable se canceló, la solución debe ser obligatoriamente $x
  = 0$.
- Expresar la solución indicando "infinito" pero omitiendo que se refiere al conjunto
  de los números reales $\\mathbb{R}$.
- Pensar que una desigualdad del tipo $3 \\geq 3$ es falsa y deducir erróneamente
  un conjunto vacío.
- Tratar de despejar la variable inexistente y crear divisiones por cero como $0/0$.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  reconocimiento de inecuación lineal con solución real total.
