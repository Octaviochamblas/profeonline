semantic_id: MAT.ALG.INECUACIONES_LINEALES.INECUACION_TODO_REAL
resumen_inicial: Una inecuación tiene solución real total ($S = \mathbb{R}$) cuando
  las variables se cancelan y se obtiene una identidad numérica verdadera.
explicacion_simple: 'Si al reducir una inecuación (como $3x + 10 > 3x + 2$), las $x$
  se cancelan por completo ($3x - 3x = 0$) y nos queda una verdad indiscutible como
  $10 > 2$.

  Como $10 > 2$ es SIEMPRE verdadero independientemente del valor de $x$, concluimos
  que **TODOS LOS NÚMEROS REALES SON SOLUCIÓN** y su conjunto solución es $S = \mathbb{R}$
  (o $]-\infty, +\infty[$).'
explicacion_formal: 'Dada la inecuación reducida $0 \cdot x < b - a$ donde $b - a
  > 0$, el **conjunto solución total** se formaliza como:


  $$0 < k \quad (\text{con } k > 0) \implies \text{Tautología / Identidad verdadera
  } \implies S = \mathbb{R} = ]-\infty, +\infty[$$


  **Desglose de la fórmula:**

  - $S = \mathbb{R}$: Todos los infinitos puntos de la recta real satisfacen la inecuación.'
definiciones_clave: '- **Inecuación tautológica / universal**: Inecuación que se verifica
  para absolutamente cualquier número real ($S = \mathbb{R}$).

  - **Identidad verdadera en inecuaciones**: Desigualdad constante válida resultante
  de la supresión de variables (como $10 > 2$).'
propiedades_relaciones: '- **Totalidad del conjunto real**: El conjunto solución abarca
  desde $-\infty$ hasta $+\infty$.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación $5x + 12 > 5x + 3$, analiza la verdad numérica
    y determina el conjunto solución $S$.
  pasos:
  - 'Paso 1: Trasponer $5x$ al primer miembro: $5x - 5x + 12 > 3$.Paso 2: Cancelar
    las variables: $0x + 12 > 3 \implies 12 > 3$.Paso 3: Analizar la desigualdad numérica
    $12 > 3$: es una verdad matemática indiscutible (VERDADERO).Paso 4: Concluir que
    cualquier número real satisface la inecuación, luego $S = \mathbb{R} = ]-\infty,
    +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reducir la inecuación $5x + 12 > 5x + 3$, se obtiene la verdad $12
    > 3$. ¿Cuál es el conjunto solución $S$?
  choices:
  - text: $S = \mathbb{R}$ (o $]-\infty, +\infty[$)
    is_correct: true
  - text: $S = \emptyset$
    is_correct: false
  - text: $S = ]3, 12[$
    is_correct: false
  - text: $S = \{12\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \mathbb{R}$ (o $]-\infty, +\infty[$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre si probamos los números $x = -100$ ó $x = 500$ en la inecuación
    $5x + 12 > 5x + 3$?
  choices:
  - text: Ambos números satisfacen la inecuación porque todos los reales son solución.
    is_correct: true
  - text: Ambos números fallan la prueba.
    is_correct: false
  - text: Solo los números positivos satisfacen la inecuación.
    is_correct: false
  - text: El resultado da cero.
    is_correct: false
  explanation: La alternativa correcta es 'Ambos números satisfacen la inecuación
    porque todos los reales son solución.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar las variables $x$ en un miembro.'
- 'Paso 2: Notar que las variables se cancelan ($0x = 0$).'
- 'Paso 3: Evaluar la veracidad de la constante numérica restante.'
- 'Paso 4: Si la constante es Verdadera, declarar $S = \mathbb{R}$.'
errores_correccion: '- **Error común:** Pensar que si la variable se cancela, la inecuación
  carece de solución.

  - **Cómo corregirlo:** Si se cancela la variable y la constante resultante es VERDADERA,
  la solución son TODOS los números reales ($S = \mathbb{R}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Olvidar invertir el sentido del símbolo de desigualdad al dividir o multiplicar
  por un coeficiente negativo.
- Confundir la solución de una inecuación con una solución puntual única propia de
  una ecuación.
- Multiplicar por el m.c.m. los términos fraccionarios pero omitir los términos enteros
  independientes.
- Poner corchete cerrado en las cotas infinitas $+\infty$ ó $-\infty$.
- Confundir una inecuación sin solución ($S = \emptyset$) con una que tiene solución
  real total ($S = \mathbb{R}$).
afirmaciones_verdaderas:
- Una inecuación lineal de primer grado es una desigualdad algebraica cuya solución
  se expresa comúnmente como un intervalo real.
- Si las variables se cancelan por completo y resulta una constante numérica verdadera,
  el conjunto solución abarca a todos los números reales ($S = \mathbb{R}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver analíticamente
  cualquier inecuación lineal, expresando su conjunto solución en notación de intervalo
  y gráfica.
