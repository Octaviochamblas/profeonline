semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_DEFINICION
resumen_inicial: 'Definición de trapecio como cuadrilátero con un par de lados paralelos:
  conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: A diferencia de los paralelogramos (con dos pares de lados paralelos),
  existe otra familia de cuadriláteros que solo cumple esta condición para un único
  par de lados.
explicacion_formal: '![Trapecio: cuadrilátero con un par de lados paralelos](/static/img/geometria/poligonos-cuadrilateros/trapecios-definicion.svg)


  ### Definición formal


  Un cuadrilátero $ABCD$ es un trapecio si $AB\parallel CD$, pero $BC$ no es paralelo
  a $AD$. Los lados paralelos se llaman bases (mayor y menor), y los otros dos lados
  se llaman lados no paralelos o laterales.


  ### Desarrollo didáctico


  A diferencia del paralelogramo, el trapecio no tiene lados opuestos congruentes
  en general, ni ángulos opuestos congruentes: solo garantiza el paralelismo de un
  par de lados.'
