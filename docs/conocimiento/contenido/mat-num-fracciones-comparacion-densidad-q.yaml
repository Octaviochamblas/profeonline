semantic_id: MAT.NUM.FRACCIONES_COMPARACION.DENSIDAD_Q
resumen_inicial: 'El conjunto de los racionales $\mathbb{Q}$ es denso: entre dos racionales
  distintos $q_1 < q_2$ existen infinitos racionales, destacando el punto medio $m
  = \frac{q_1 + q_2}{2}$.'
explicacion_simple: A diferencia de los enteros (donde entre el 2 y el 3 no hay otro
  número entero), los números racionales son densos. Esto significa que entre dos
  fracciones cualesquiera, por más cercanas que estén, siempre se puede encontrar
  otra fracción intermedia, permitiendo meter infinitas fracciones en medio.
explicacion_formal: 'El conjunto $(\mathbb{Q}, <)$ satisface la **Propiedad de Densidad
  Aritmética**:


  $$\forall q_1, q_2 \in \mathbb{Q} \text{ con } q_1 < q_2, \quad \exists q_3 \in
  \mathbb{Q} \quad \text{tal que } q_1 < q_3 < q_2$$


  **Desglose de la fórmula:**

  - Punto medio de Cantor: $q_3 = \frac{q_1 + q_2}{2} \in \mathbb{Q}$ demuestra constructivamente
  la existencia de al menos un elemento intermedio.

  - Infinitud densa: Al iterar la fórmula del punto medio se generan infinitos racionales
  en el intervalo $(q_1, q_2)$.


  > **Complemento didáctico:** Por la densidad, en los números racionales carece de
  sentido hablar del ''sucesor'' o del ''antecesor'' de una fracción.'
definiciones_clave: '- **Densidad en $\mathbb{Q}$**: Propiedad estructural por la
  que siempre existe un racional comprendido entre dos racionales distintos.

  - **Punto medio racional**: La media aritmética $m = \frac{q_1 + q_2}{2}$ que reside
  entre $q_1$ y $q_2$.'
propiedades_relaciones: '- **Punto medio**: $m = \frac{q_1 + q_2}{2}$ está estrictamente
  comprendido entre $q_1$ y $q_2$.'
ejemplo_guiado:
  enunciado: Encuentre un número racional comprendido entre $\frac{1}{3}$ y $\frac{1}{2}$
    aplicando el método del punto medio.
  pasos:
  - 'Paso 1: Sumar los racionales dados: $\frac{1}{3} + \frac{1}{2} = \frac{2 + 3}{6}
    = \frac{5}{6}$.'
  - 'Paso 2: Dividir la suma entre 2 (multiplicar por $\frac{1}{2}$): $\frac{5}{6}
    \cdot \frac{1}{2} = \frac{5}{12}$.'
  - 'Paso 3: Homogenizar para comprobar: $\frac{1}{3} = \frac{4}{12}$ y $\frac{1}{2}
    = \frac{6}{12}$.'
  - 'Conclusión: Como $\frac{4}{12} < \frac{5}{12} < \frac{6}{12}$, $\frac{5}{12}$
    es un racional exactamente intermedio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad de densidad del conjunto de los números racionales
    Q?
  choices:
  - text: Que entre dos racionales distintos siempre existen infinitos racionales
      intermedios
    is_correct: true
  - text: Que entre dos racionales no hay ningún número
    is_correct: false
  - text: Que solo existen 10 racionales en total
    is_correct: false
  - text: Que todo racional tiene un sucesor entero inmediato
    is_correct: false
  explanation: La alternativa correcta es 'Que entre dos racionales distintos siempre
    existen infinitos racionales intermedios'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre 1/3 y 1/2, ¿cuál fue el punto medio racional
    calculado?
  choices:
  - text: 5/12
    is_correct: true
  - text: 2/5
    is_correct: false
  - text: 1/5
    is_correct: false
  - text: 5/6
    is_correct: false
  explanation: La alternativa correcta es '5/12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar dos racionales distintos $q_1$ y $q_2$ con $q_1 < q_2$.'
- 'Paso 2: Sumar ambas fracciones $q_1 + q_2$.'
- 'Paso 3: Dividir la suma por 2 para obtener el punto medio $m = \frac{q_1 + q_2}{2}$
  garantizado en $(q_1, q_2)$.'
errores_correccion: '- **Error 1: Buscar el ''sucesor inmediato'' de una fracción
  como $\frac{1}{2}$.** **Cómo corregirlo:** En racionales NO EXISTE el concepto de
  sucesor o antecesor inmediato por la densidad.


  - **Error 2: Sumar numeradores y denominadores directamente al buscar el punto medio.**
  **Cómo corregirlo:** El punto medio formal es la media aritmética $\frac{q_1 + q_2}{2}$
  usando la suma racional correcta.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Halle una fracción entre 2/5 y 3/5 amplificando por 2.
  alternativas:
  - 5/10 (que es 1/2)
  - 1/5
  - 4/5
  respuesta: 5/10 (que es 1/2)
  solucion_pasos:
  - $2/5 = 4/10$ y $3/5 = 6/10$. Entre $4/10$ y $6/10$ se encuentra $5/10 = 1/2$.
- titulo: Ejemplo 2
  enunciado: ¿Existe el 'siguiente número racional' inmediatamente después de 0,5?
  alternativas:
  - No, por la propiedad de densidad de Q
  - Sí, es 0,6
  - Sí, es 0,51
  respuesta: No, por la propiedad de densidad de Q
  solucion_pasos:
  - Entre 0,5 y cualquier propuesta siempre hay infinitos racionales.
- titulo: ¿Es el conjunto de los enteros Z un conjunto denso?
  respuesta: 'No'
  solucion_pasos:
  - No, en $\mathbb{Z}$ entre el 2 y el 3 no existe ningún otro entero.
- titulo: ¿Es la media aritmética m = (q1 + q2)/2 un método constructivo para demostrar
    densidad en Q?
  respuesta: Sí
  solucion_pasos:
  - Sí, el punto medio demuestra la presencia de al menos un racional intermedio.
errores_frecuentes:
- Entre dos números racionales distintos existe una cantidad finita y contable de
  tres fracciones.
- El número racional $1/2$ tiene como sucesor inmediato e indivisible a la fracción
  $2/3$.
- El conjunto de los números enteros se clasifica como un conjunto denso en las matemáticas.
- Calcular el punto medio de dos racionales entrega como resultado un número irracional.
- La densidad en los racionales significa que todos los denominadores son iguales
  a 1.
afirmaciones_verdaderas:
- 'El conjunto $\mathbb{Q}$ es denso: entre cualesquiera dos racionales distintos
  existen infinitos racionales.'
- En el conjunto de los racionales no existe la noción de elemento sucesor ni antecesor
  inmediato.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad de densidad
  en $\mathbb{Q}$, hallando racionales intermedios entre cualquier par de fracciones
  mediante el método del punto medio o la amplificación.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
