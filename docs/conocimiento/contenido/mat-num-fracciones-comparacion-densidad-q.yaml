semantic_id: MAT.NUM.FRACCIONES_COMPARACION.DENSIDAD_Q
resumen_inicial: "La propiedad de densidad establece que entre cualesquiera dos números racionales distintos siempre existe al menos otro número racional (y por ende infinitos)."
explicacion_simple: |
  Imagina los números enteros: entre el 2 y el 3 no hay ningún otro número entero. Pero con las fracciones pasa algo asombroso llamado **densidad**. Si tomas dos fracciones, por muy cercanas que parezcan (como $\frac{1}{2}$ y $\frac{2}{3}$), siempre puedes encontrar otra fracción justo al medio de las dos (como $\frac{7}{12}$). Y entre esa nueva fracción y la primera, puedes volver a meter otra más, ¡y así infinitamente! Los números racionales están tan apretados en la recta que jamás hay huecos vacíos entre dos de ellos.
explicacion_formal: |
  Formalmente, el conjunto de los números racionales $(\mathbb{Q}, <)$ posee la propiedad de **orden denso**:
  $$\forall q_1, q_2 \in \mathbb{Q} \quad \text{con } q_1 < q_2, \quad \exists q_3 \in \mathbb{Q} \quad \text{tal que} \quad q_1 < q_3 < q_2$$

  Demostración constructiva (Punto Medio o Media Aritmética): dado $q_1 < q_2$, el promedio o punto medio $q_3 = \frac{q_1 + q_2}{2}$ cumple estrictamente la condición:
  1. $q_3 \in \mathbb{Q}$ por la clausura de $\mathbb{Q}$ bajo adición y división por $2 \neq 0$.
  2. $q_1 < \frac{q_1 + q_2}{2} < q_2$.

  Por inducción matemática, al repetir este proceso infinitas veces se demuestra la existencia de infinitos números racionales en cualquier intervalo abierto $(q_1, q_2)$.
definiciones_clave: |
  - **Propiedad de densidad en $\mathbb{Q}$**: Principio por el cual no existen racionales "consecutivos"; entre cualesquiera dos racionales hay infinitos otros racionales.
  - **Punto medio (Promedio)**: Método constructivo $q_3 = \frac{q_1 + q_2}{2}$ para hallar un racional intercalado entre $q_1$ y $q_2$.
  - **Ausencia de sucesor inmediato**: A diferencia de $\mathbb{Z}$, en $\mathbb{Q}$ un número racional no posee un "siguiente" racional bien definido.
propiedades_relaciones: |
  - **Diferencia estructural con los enteros ($\mathbb{Z}$)**: En $\mathbb{Z}$ cada número $n$ tiene un sucesor único $n+1$. En $\mathbb{Q}$, la noción de "sucesor de un número" carece de sentido matemático.
  - **Homogenización por amplificación**: Para hallar racionales intermedios entre dos fracciones de igual denominador como $\frac{a}{c}$ y $\frac{a+1}{c}$, basta amplificar ambas por $k > 1$ obteniendo el intervalo con margen $(\frac{a \cdot k}{c \cdot k}, \frac{(a+1) \cdot k}{c \cdot k})$.
  - **Incompleitud continua**: A pesar de ser denso, $\mathbb{Q}$ posee "huecos" geométricos correspondientes a los números irracionales (como $\sqrt{2}$ o $\pi$).
ejemplo_guiado:
  enunciado: "Demuestra la densidad de $\\mathbb{Q}$ hallando un número racional comprendido estrictamente entre $\\frac{1}{3}$ y $\\frac{1}{2}$ utilizando dos métodos distintos: punto medio y homogenización por amplificación."
  pasos:
    - "Método 1 (Punto Medio / Promedio): sumar las fracciones y dividir por $2$."
    - 'Sumar: $\frac{1}{3} + \frac{1}{2} = \frac{2 + 3}{6} = \frac{5}{6}$.'
    - 'Dividir por $2$: $\frac{5/6}{2} = \frac{5}{12}$. Se verifica que $\frac{1}{3} = \frac{4}{12} < \frac{5}{12} < \frac{6}{12} = \frac{1}{2}$.'
    - 'Método 2 (Homogenización por amplificación): escribir $\frac{1}{3} = \frac{10}{30}$ y $\frac{1}{2} = \frac{15}{30}$.'
    - 'Elegir cualquier numerador entre $10$ y $15$, por ejemplo $11$: se obtiene la fracción intercalada $\frac{11}{30}$, verificando $\frac{10}{30} < \frac{11}{30} < \frac{15}{30}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué demuestra la fórmula del punto medio $q_3 = \\frac{q_1 + q_2}{2}$ cuando se aplica a dos racionales distintos $q_1 < q_2$?"
    choices:
      - {text: "Demuestra que entre cualesquiera dos racionales siempre existe otro racional intercalado ($q_1 < q_3 < q_2$), probando que $\\mathbb{Q}$ es denso.", is_correct: true}
      - {text: "Demuestra que los números racionales son finitos y se pueden contar de uno en uno.", is_correct: false}
      - {text: "Demuestra que el resultado se convierte en un entero negativo.", is_correct: false}
      - {text: "Demuestra que el sucesor inmediato de $q_1$ es exactamente $q_2$.", is_correct: false}
    explanation: "La correcta es Demuestra que entre cualesquiera dos racionales siempre existe otro racional intercalado ($q_1 < q_3 < q_2$), probando que $\\mathbb{Q}$ es denso.: el promedio siempre se ubica estrictamente entre ambos números."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Usando el método de amplificación, ¿cuál de las siguientes fracciones se encuentra estrictamente entre $\\frac{3}{5}$ y $\\frac{4}{5}$?"
    choices:
      - {text: '\$\frac{7}{10}$', is_correct: true}
      - {text: '\$\frac{2}{5}$', is_correct: false}
      - {text: '\$\frac{5}{5}$', is_correct: false}
      - {text: "No existe ninguna porque son fracciones consecutivas.", is_correct: false}
    explanation: "La correcta es \\frac{7}{10}: amplificando por $2$ se obtiene $\\frac{6}{10}$ y $\\frac{8}{10}$; la fracción $\\frac{7}{10}$ está justo entre ambas."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar las dos fracciones racionales de partida $q_1$ y $q_2$ (con $q_1 < q_2$)."
  - 'Paso 2 (Método del Promedio): Calcular $q_3 = \frac{q_1 + q_2}{2}$.'
  - "Paso 3 (Método de Amplificación): Llevar ambas fracciones a un denominador común más grande de modo que haya enteros disponibles entre sus numeradores."
  - "Paso 4: Verificar que la nueva fracción satisface $q_1 < q_3 < q_2$."
errores_correccion: |
  Un error conceptual muy extendido es creer que existen 'fracciones consecutivas' (pensar que no hay nada entre $\frac{3}{5}$ y $\frac{4}{5}$ porque 4 viene después de 3). Recuerda que **en las fracciones no existe el concepto de número consecutivo**: amplificando siempre encontrarás infinitas fracciones intermedias.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Encuentra una fracción comprendida entre $\\frac{1}{4}$ y $\\frac{2}{4}$."
    alternativas:
      - '\$\frac{3}{8}$, hallada al amplificar ambas por 2 a \$\frac{2}{8}$ y \$\frac{4}{8}$.'
      - "No existe ninguna."
      - '\$\frac{3}{4}$.'
    respuesta: '\$\frac{3}{8}$, hallada al amplificar ambas por 2 a \$\frac{2}{8}$ y \$\frac{4}{8}$.'
    solucion_pasos:
      - 'Amplificamos por 2: $\frac{1}{4} = \frac{2}{8}$ y $\frac{2}{4} = \frac{4}{8}$.'
      - 'Entre 2 y 4 está el 3, obteniendo $\frac{3}{8}$.'
      - 'Se cumple $\frac{2}{8} < \frac{3}{8} < \frac{4}{8}$.'
  - titulo: "Ejemplo 2"
    enunciado: "¿Cuántos números racionales existen dentro del intervalo abierto $]\\frac{1}{10}, \\frac{2}{10}[$?"
    alternativas:
      - "Infinitos números racionales."
      - "Cero números racionales."
      - "Un solo número racional."
    respuesta: "Infinitos números racionales."
    solucion_pasos:
      - 'Por la propiedad de densidad de $\mathbb{Q}$, el proceso de intercalación por punto medio o amplificación se puede repetir sin fin.'
      - "Por lo tanto, entre cualesquiera dos racionales hay infinitos racionales."
  - titulo: "¿Existe el concepto de 'sucesor inmediato' en el conjunto de los números racionales $\\mathbb{Q}$?"
    respuesta: "No"
    solucion_pasos:
      - "No, dado que entre cualquier racional $q$ y un supuesto sucesor siempre se puede intercalar otro racional más cercano."
  - titulo: "¿La suma de dos números racionales dividida por 2 produce siempre otro número racional?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, por la propiedad de clausura de los racionales ante la adición y división por números enteros no nulos."
errores_frecuentes:
  - "Creer que existen fracciones consecutivas como en los enteros."
  - 'Afirmar que no hay fracciones entre $\frac{a}{c}$ y $\frac{a+1}{c}$ sin haberlas amplificado previamente.'
  - 'Confundir la densidad de $\mathbb{Q}$ con la completitud de $\mathbb{R}$ (olvidar que existen vacíos correspondientes a irracionales).'
  - "Cometer errores al sumar las fracciones al calcular el punto medio."
  - "Pensar que la densidad solo aplica si el intervalo entre los racionales es grande."
afirmaciones_verdaderas:
  - 'El conjunto de los números racionales $\mathbb{Q}$ es denso, lo que significa que entre cualquier par de racionales distintos existen infinitos racionales.'
  - "El promedio de dos números racionales $q_1$ y $q_2$ es siempre otro racional ubicado exactamente en la mitad del intervalo $(q_1, q_2)$."
al_terminar_debes_ponder: |
  Debes ser capaz de explicar el concepto de densidad en $\mathbb{Q}$, encontrar fracciones intermedias entre dos cualesquiera mediante promedios o amplificación, y justificar la ausencia de sucesores inmediatos.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
