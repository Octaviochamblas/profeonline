semantic_id: MAT.GEO.CIRCULO_METRICA.AREA_SEMICIRCULO
resumen_inicial: 'Cálculo del área de un semicírculo: conceptos, teoremas, propiedades
  geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Un semicírculo, al ser exactamente la mitad de un círculo, tiene
  una fórmula de área que se deriva directamente de la fórmula del círculo completo.
explicacion_formal: '![Área de un semicírculo: πr²/2](/static/img/geometria/circunferencia-circulo/circulo-area-semicirculo.svg)


  ### Definición formal


  Un semicírculo es exactamente la mitad de un círculo (delimitado por un diámetro),
  por lo que su área es $A=\frac{\pi r^2}{2}$.


  ### Desarrollo didáctico


  Un semicírculo de radio 8 cm tiene área $A=\frac{\pi\times64}{2}=32\pi\approx100,5$
  cm², exactamente la mitad del área de un círculo completo de igual radio ($64\pi\approx201,1$
  cm²).'
definiciones_clave: '- **Cálculo del área de un semicírculo**: Elemento o propiedad
  fundamental en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del área de un semicírculo.'
