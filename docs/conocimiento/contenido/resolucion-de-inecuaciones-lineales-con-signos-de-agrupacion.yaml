semantic_id: MAT.ALG.INECUACIONES_LINEALES.SIGNOS_AGRUPACION
resumen_inicial: Para resolver inecuaciones con paréntesis se aplica la propiedad
  distributiva para eliminarlos antes de trasponer términos.
explicacion_simple: 'Cuando una inecuación tiene paréntesis (como $2(x - 3) \le 8$):

  1. Aplicamos la propiedad distributiva multiplicando el factor externo por los términos
  de adentro ($2x - 6 \le 8$).

  2. Cuidamos los signos si el factor externo es negativo.

  3. Una vez sin paréntesis, despejamos $x$ de forma habitual.'
explicacion_formal: 'Dada la inecuación $k(a x + b) \ R \ c$, la **eliminación de
  paréntesis** por distribución establece:


  $$k \cdot a x + k \cdot b \ R \ c$$


  **Desglose de la fórmula:**

  - Si el escalar $k > 0$, el operador $R$ no cambia. Si el escalar externo $k < 0$,
  el operador $R$ se invierte al distribuir o despejar.'
definiciones_clave: '- **Propiedad distributiva en inecuaciones**: Multiplicación
  de un factor externo por cada sumando encerrado en un paréntesis.'
propiedades_relaciones: '- **Prioridad algebraica**: Los paréntesis deben suprimirse
  antes de intentar despejar las variables.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación $3(2x - 1) \le 15$ eliminando los paréntesis y
    determina el conjunto solución $S$.
  pasos:
  - 'Paso 1: Aplicar distributiva en el primer miembro: $3 \cdot 2x - 3 \cdot 1 =
    6x - 3$.Paso 2: Escribir la inecuación reducida: $6x - 3 \le 15$.Paso 3: Trasponer
    $-3$ sumando: $6x \le 15 + 3 \implies 6x \le 18$.Paso 4: Trasponer $6$ dividiendo:
    $x \le \frac{18}{6} \implies x \le 3$.Paso 5: Escribir el conjunto solución: $S
    = ]-\infty, 3]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la propiedad distributiva en $3(2x - 1) \le 15$, ¿cuál es la
    inecuación equivalente obtenida?
  choices:
  - text: $6x - 3 \le 15$
    is_correct: true
  - text: $6x - 1 \le 15$
    is_correct: false
  - text: $5x - 3 \le 15$
    is_correct: false
  - text: $6x - 3 \ge 15$
    is_correct: false
  explanation: La alternativa correcta es '$6x - 3 \le 15$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $3(2x - 1) \le 15$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = ]-\infty, 3]$
    is_correct: true
  - text: $S = [3, +\infty[$
    is_correct: false
  - text: $S = ]-\infty, 3[$
    is_correct: false
  - text: $S = ]-\infty, 5]$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-\infty, 3]$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los factores situados fuera de los paréntesis.'
- 'Paso 2: Multiplicar por cada término interior respetando la ley de los signos.'
- 'Paso 3: Reducir términos semejantes.'
- 'Paso 4: Despejar la variable y presentar la solución.'
errores_correccion: '- **Error común:** Multiplicar el número exterior únicamente
  por el primer término del paréntesis.

  - **Cómo corregirlo:** La propiedad distributiva exige multiplicar por TODOS los
  términos dentro del paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Olvidar invertir el sentido del símbolo de desigualdad al dividir o multiplicar
  por un coeficiente negativo.
- Confundir la solución de una inecuación con una solución puntual única propia de
  una ecuación.
- Multiplicar por el m.c.m. los términos fraccionarios pero omitir los términos enteros
  independientes.
- Poner corchete cerrado en las cotas infinitas $+\infty$ ó $-\infty$.
- Confundir una inecuación sin solución ($S = \emptyset$) con una que tiene solución
  real total ($S = \mathbb{R}$).
afirmaciones_verdaderas:
- Una inecuación lineal de primer grado es una desigualdad algebraica cuya solución
  se expresa comúnmente como un intervalo real.
- Si las variables se cancelan por completo y resulta una constante numérica verdadera,
  el conjunto solución abarca a todos los números reales ($S = \mathbb{R}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver analíticamente
  cualquier inecuación lineal, expresando su conjunto solución en notación de intervalo
  y gráfica.
