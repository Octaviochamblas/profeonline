resumen_inicial: El modelamiento de situaciones de cambio lineal discreto utiliza
  progresiones aritméticas donde el valor inicial $a_1$ representa la cantidad inicial
  y la diferencia $d$ representa la tasa constante de variación por período.
explicacion_simple: Muchos problemas reales (como ahorrar una cantidad fija al mes,
  pagar una cuota sin interés o llenar una piscina a ritmo constante) se comportan
  como progresiones aritméticas porque crecen de forma lineal paso a paso.
explicacion_formal: 'Una situación de **Cambio Lineal Discreto** se modela mediante
  la P.A. $a_n = a_1 + (n-1)d$, donde:


  - $n$: Número de período o etapa ($n=1, 2, 3, \dots$).

  - $a_1$: Nivel o valor de la variable en el primer período.

  - $d$: Tasa de cambio o incremento por período ($\,\Delta a = d\,$).'
definiciones_clave: '- **Modelo de cambio lineal**: Aplicación $a_n = a_1 + (n-1)d$
  para fenómenos de variación constante por etapa.'
propiedades_relaciones: '- **Equivalencia afín discreta**: Análoga a la función afín
  $y = mx + b$ ajustada a dominio entero.'
ejemplo_guiado:
  enunciado: Un estudiante ahorra \$10.000 el primer mes y decide agregar \$3.000
    adicionales cada mes. Construya el modelo P.A. y calcule cuánto ahorrará el mes
    12.
  pasos:
  - 'Paso 1: Identificar $a_1 = 10.000$ y $d = 3.000$.'
  - 'Paso 2: Escribir el modelo de término general: $a_n = 10.000 + (n - 1) \cdot
    3.000$.'
  - 'Paso 3: Evaluar para $n = 12$: $a_{12} = 10.000 + 11 \cdot 3.000 = 10.000 + 33.000
    = 43.000$.'
  - 'Conclusión: El ahorro del mes 12 será de \$43.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se modela un problema de cambio lineal discreto mediante una P.A.?
  choices:
  - text: Asignando la cantidad inicial al primer término a1 y el incremento constante
      por período a la diferencia d
    is_correct: true
  - text: Multiplicando la cantidad inicial por el tiempo al cuadrado
    is_correct: false
  - text: Restando la tasa al número de meses
    is_correct: false
  - text: Dividiendo el ahorro entre 100
    is_correct: false
  explanation: La alternativa correcta es 'Asignando la cantidad inicial al primer
    término a1 y el incremento constante por período a la diferencia d'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado del ahorro mensual con a1 = 10.000 y d = 3.000, ¿cuánto
    ahorró en el mes 12?
  choices:
  - text: 43.000 $
    is_correct: true
  - text: 46.000 $
    is_correct: false
  - text: 36.000 $
    is_correct: false
  - text: 40.000 $
    is_correct: false
  explanation: La alternativa correcta es '43.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de construir modelos de cambio lineal
  mediante $a_n = a_1 + (n-1)d$ resolviendo problemas del entorno.
semantic_id: MAT.NUM.PROG_ARITMETICA.MODELO_CAMBIO_LINEAL
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.MODELO_CAMBIO_LINEAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
