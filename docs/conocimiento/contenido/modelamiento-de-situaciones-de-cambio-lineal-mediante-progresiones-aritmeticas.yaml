  QUÉ: Modelar y resolver situaciones cotidianas y financieras de cambio lineal discreto mediante progresiones aritméticas.
  CÓMO: Identificar $a_1$ y la tasa fija $d$, formulando $a_n = a_1 + (n - 1)d$ y la suma acumulada $S_n = \frac{n(a_1 + a_n)}{2}$.
