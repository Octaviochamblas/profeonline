semantic_id: MAT.NUM.PROG_ARITMETICA.MODELO_CAMBIO_LINEAL
resumen_inicial: 'El modelamiento de situaciones de cambio lineal mediante progresiones aritméticas traduce problemas del mundo real caracterizados por variaciones aditivas constantes a ecuaciones del tipo $a_n = a_1 + (n - 1)d$ o $S_n$.'
explicacion_simple: |
  Muchas situaciones de la vida diaria crecen o decrecen en una **cantidad fija por cada período de tiempo** (cambio lineal constante):
  - **Ahorro fijo**: Si empiezas con $\$10.000$ en tu alcancía y guardas $\$2.000$ todas las semanas, tu dinero forma una progresión aritmética:
    $$\text{Semana 1: } \$10.000, \quad \text{Semana 2: } \$12.000, \quad \text{Semana 3: } \$14.000$$
  - **Depreciación constante**: Un auto pierde $\$500.000$ de valor por año.
  - **Planes de entrenamiento**: Correr $500$ metros adicionales cada día.
  Cualquier fenómeno que sume o reste una cantidad constante en cada etapa se modela con una P.A.
explicacion_formal: |
  ### Definición formal
  Un fenómeno discreto de cambio lineal en el tiempo $n \in \mathbb{N}$ se define por una tasa de variación instantánea discreta constante:
  $$\frac{\Delta y}{\Delta n} = d \quad (\text{Constante aditiva})$$
  Su dinámica temporal se modela mediante el sistema discreto de P.A.:
  $$y(n) = a_n = a_1 + (n - 1)d$$
  donde:
  - $a_1$ es el estado inicial en el período $n=1$.
  - $d$ es la tasa constante de incremento ($d > 0$) o amortización ($d < 0$).
  - $n$ representa la etapa, período o ciclo temporal discreto.

  ### Identificación del modelo adecuado
  - **Cálculo de estado en la etapa $n$**: Usar término general $a_n = a_1 + (n - 1)d$.
  - **Cálculo del acumulado total en $n$ etapas**: Usar serie aritmética $S_n = \frac{n(a_1 + a_n)}{2}$.

  ### Síntesis didáctica
  - Estado individual en etapa $n \implies a_n$.
  - Acumulado total de todas las etapas $\implies S_n$.
definiciones_clave: |
  - **Cambio lineal discreto**: Variación donde el incremento por período $\Delta y$ permanece constante.
  - **Tasa de variación constante ($d$)**: Magnitud física o financiera que se suma o resta en cada ciclo.
  - **Acumulación total ($S_n$)**: Consolidado de todas las cantidades producidas o consumidas a lo largo de $n$ períodos.
propiedades_relaciones: |
  - **Isomorfismo con la función afín**: Las situaciones de cambio lineal discreto ($a_n$) corresponden a la restricción entera del dominio de las funciones afines continuas ($f(x) = mx + c$).
  - **Previsibilidad de estados**: Permite calcular con exactitud estados futuros sin necesidad de simulación paso a paso.
ejemplo_guiado:
  enunciado: 'Un deportista decide entrenar corriendo $2.000$ metros el primer día, y aumentar $400$ metros su recorrido en cada uno de los días siguientes. Determina cuántos metros correrá el día 15 y el total acumulado de metros recorridos en los 15 días.'
  pasos:
    - 'Paso 1: Identificamos las variables del modelo: $a_1 = 2.000$, $d = 400$ y $n = 15$.'
    - 'Paso 2: Calculamos los metros del día 15 con el término general: $a_{15} = 2.000 + (15 - 1) \cdot 400 = 2.000 + 14 \cdot 400 = 2.000 + 5.600 = 7.600$ metros.'
    - 'Paso 3: Calculamos la distancia acumulada en los 15 días con la suma: $S_{15} = \frac{15 \cdot (a_1 + a_{15})}{2} = \frac{15 \cdot (2.000 + 7.600)}{2}$.'
    - 'Paso 4: Evaluamos: $S_{15} = \frac{15 \cdot 9.600}{2} = 15 \cdot 4.800 = 72.000$ metros. El día 15 correrá **$7.600$ m** y en total habrá recorrido **$72.000$ m**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un problema contextualizado, ¿cuándo se debe utilizar la fórmula de la suma $S_n$ en lugar del término general $a_n$?'
    choices:
      - {text: 'Cuando la pregunta pide la cantidad acumulada o total producida durante todos los $n$ períodos', is_correct: true}
      - {text: 'Cuando se requiere saber el valor exacto alcanzado únicamente en la etapa $n$', is_correct: false}
      - {text: 'Cuando la diferencia común $d$ es un número negativo', is_correct: false}
      - {text: 'Cuando la situación no tiene un valor inicial $a_1$', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando la pregunta pide la cantidad acumulada o total producida durante todos los $n$ períodos''. $S_n$ representa el gran total acumulado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una alcancía contiene $\$5.000$ inicialmente ($n=1$) y se le agregan $\$1.500$ cada semana ($d = 1.500$). ¿Cuánto dinero habrá en la alcancía en la semana 10?'
    choices:
      - {text: '$\$18.500$, calculando $a_{10} = 5.000 + (10 - 1) \cdot 1.500 = 5.000 + 13.500 = 18.500$', is_correct: true}
      - {text: '$\$20.000$, multiplicando por 10 directamente', is_correct: false}
      - {text: '$\$15.000$, multiplicando $1.500 \cdot 10$', is_correct: false}
      - {text: '$\$13.500$, omitiendo el dinero inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$18.500$, calculando $a_{10} = 5.000 + (10 - 1) \cdot 1.500 = 5.000 + 13.500 = 18.500$''. $5.000 + 9(1.500) = 18.500$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer atentamente el contexto e identificar si la cantidad inicial representa $a_1$.'
  - 'Paso 2: Identificar la razón de cambio por período como la diferencia común $d$ (positiva si aumenta, negativa si disminuye).'
  - 'Paso 3: Determinar si el problema consulta por un estado puntual en la etapa $n$ ($a_n$) o por un acumulado global ($S_n$).'
  - 'Paso 4: Sustituir los valores en la fórmula correspondiente ($a_n = a_1 + (n-1)d$ o $S_n = \frac{n(a_1+a_n)}{2}$) y redactar la respuesta con sus unidades.'
errores_correccion: |
  - **Error 1:** Confundir la solicitud del valor en la etapa $n$ ($a_n$) con el acumulado total ($S_n$). **Cómo corregirlo:** Si la pregunta dice **"cuánto hay en la etapa $n$" es $a_n$**; si dice **"cuánto en TOTAL se reunió en las $n$ etapas" es $S_n$**.
  - **Error 2:** Multiplicar $d$ por $n$ omitiendo la resta $(n-1)$ al calcular el estado final. **Cómo corregirlo:** La fórmula exige **$(n-1)$ saltos de incremento**: $a_n = a_1 + (n-1)d$.
ejemplos:
  - titulo: 'Modelo de ahorro semanal'
    enunciado: 'Para $a_1 = \$10.000$ y ahorro de $\$2.000$/semana, ¿en la semana 5 el monto es $a_5 = 10.000 + 4(2.000) = \$18.000$?'
    alternativas:
      - 'Sí, en la semana 5 hay $18.000'
      - 'No, hay $20.000'
      - 'No, hay $10.000'
    respuesta: 'Sí, en la semana 5 hay $18.000'
    solucion_pasos:
      - '1. $a_1 = 10.000, d = 2.000, n = 5$.'
      - '2. $a_5 = 10.000 + 4(2.000) = 10.000 + 8.000 = \$18.000$.'
  - titulo: 'Modelo de depreciación'
    enunciado: 'Un bien de $\$1.000.000$ se deprecia en $\$80.000$ por año. ¿En el año 6 vale $a_6 = 1.000.000 + 5(-80.000) = \$600.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1.000.000 - 400.000 = \$600.000$.'
  - titulo: 'Producción total acumulada'
    enunciado: 'Una fábrica produce 100 unidades el día 1, y aumenta 10 unidades por día. ¿En 5 días produce en total $S_5 = \frac{5(100 + 140)}{2} = 600$ unidades?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_5 = 100 + 40 = 140 \implies S_5 = 5(240)/2 = 600$.'
  - titulo: 'Capacidad de asientos en anfiteatro'
    enunciado: 'Fila 1 tiene 20 asientos, cada fila posterior suma 2 asientos. ¿La fila 15 tiene $20 + 14(2) = 48$ asientos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_{15} = 20 + 28 = 48$.'
errores_frecuentes:
  - 'El valor individual alcanzado en la etapa $a_n$ es conceptualmente idéntico a la suma acumulada $S_n$.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Multiplicar la tasa de variación por la cantidad de períodos sin restar 1 al número de etapa.'
  - 'Considerar que los problemas de depreciación constante deben resolverse con modelos de decremento porcentual.'
afirmaciones_verdaderas:
  - 'Las situaciones del mundo real que involucran incrementos o decrementos aditivos constantes por período se modelan mediante progresiones aritméticas.'
  - 'La cantidad acumulada total en $n$ períodos de un fenómeno lineal se calcula mediante la fórmula de la serie aritmética $S_n$.'
