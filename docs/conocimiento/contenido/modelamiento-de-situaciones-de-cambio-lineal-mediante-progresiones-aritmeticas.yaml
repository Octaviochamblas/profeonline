procedimiento:
- 'Paso 1: Lee el problema y confirma que los aumentos o disminuciones sean SIEMPRE por el
  mismo número absoluto (no porcentajes).'
- 'Paso 2: Traduce el ''ritmo de cambio'' a la diferencia ''d''.'
- 'Paso 3: Traduce el primer evento al término $a_1$.'
- 'Paso 4: Usa las fórmulas de P.A. para proyectar al futuro (Término General) o totalizar
  (Suma Finita).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en modelamiento de situaciones de cambio lineal mediante progresiones aritméticas.
ejemplos:
- titulo: Ahorro bajo el colchón
  enunciado: Juana tiene $\$10.000$ y decide guardar $\$2.000$ extras cada mes. ¿Cuánto dinero
    total tendrá ahorrado justo al cumplirse el mes 6?
  solucion_pasos:
  - 'Cuidado: El mes 1 no empieza con 10.000. Ese es el mes cero.'
  - 'Mes 1 ahorra y llega a: 10.000 + 2.000 = 12.000 (a1 = 12.000).'
  - La diferencia es d = 2.000.
  - Me piden cuánto tiene en el mes 6 (a6).
  - a6 = 12.000 + (6-1)*2.000 = 12.000 + 10.000 = 22.000.
  - Tendrá $22.000.
- titulo: Ejemplo 1
  enunciado: Un plan de celular cobra 3.000 pesos fijos más 500 pesos por cada minuto hablado.
    ¿Cuál es a_1, el cobro al hablar 1 minuto?
  alternativas:
  - '3.500'
  - '3.000'
  - '500'
  respuesta: '3.500'
  solucion_pasos:
  - 3.000 más 500 es igual a 3.500.
- titulo: Ejemplo 2
  enunciado: Con d igual a 500, ¿cuánto se paga por 4 minutos hablados?
  alternativas:
  - '5.000'
  - '4.500'
  - '5.500'
  respuesta: '5.000'
  solucion_pasos:
  - 3.500 más (4 menos 1) por 500 es igual a 3.500 más 1.500, o sea 5.000.
- titulo: ¿Un cobro que aumenta un 10 por ciento cada mes se puede modelar como progresión
    aritmética?
  respuesta: 'No'
  solucion_pasos:
  - Un aumento porcentual corresponde a una progresión geométrica, no a una aritmética.
- titulo: ¿El cargo fijo de un problema siempre corresponde exactamente a a_1?
  respuesta: 'No'
  solucion_pasos:
  - A veces el cargo fijo es un punto de partida anterior al primer término, y hay que sumarle
    d una vez para obtener a_1.
errores_frecuentes:
- Confundir el 'término cero' (cargo fijo) con el $a_1$ de la fórmula. Si $a_1$ es el valor
  al mes 1, a veces hay que sumarle una vez 'd' al valor base para hallar $a_1$.
- Usar P.A. para problemas de intereses compuestos o poblaciones de bacterias (que crecen
  multiplicando, no sumando).
- Modelar como progresión aritmética una situación donde el cambio es un porcentaje, en vez
  de una cantidad fija.
- Confundir el cargo fijo inicial con el primer término a_1 cuando en realidad corresponde
  a un momento anterior.
- Olvidar identificar correctamente qué representa n en el contexto del problema, como horas,
  meses o unidades vendidas.
afirmaciones_verdaderas:
- La formulación de modelamiento de situaciones de cambio lineal mediante progresiones aritméticas
  mantiene la regularidad de la sucesión.
- Un problema de cambio lineal se puede modelar como progresión aritmética cuando el aumento
  o la disminución es siempre la misma cantidad fija.
al_terminar_debes_poder: Resolver problemas prácticos utilizando modelamiento de situaciones
  de cambio lineal mediante progresiones aritméticas.
