semantic_id: MAT.NUM.PROG_ARITMETICA.MODELO_CAMBIO_LINEAL
resumen_inicial: 'El modelamiento de situaciones de cambio lineal utiliza progresiones aritméticas para representar problemas discretos reales donde una magnitud experimenta aumentos o disminuciones fijas por período.'
explicacion_simple: |
  Muchos problemas de la vida cotidiana siguen una **progresión aritmética**:
  - **Ahorro con cuota fija**: Si tienes $\$10.000$ en tu alcancía y cada mes agregas $\$2.000$, la cantidad acumulada cada mes es una PA con $d = +\$2.000$.
  - **Depreciación constante**: Si compras un teléfono en $\$300.000$ y cada año pierde $\$30.000$ de valor, su precio forma una PA con $d = -\$30.000$.
  - **Filas de un teatro o estadio**: Si la primera fila tiene 20 asientos y cada fila siguiente tiene 2 asientos más, el número de asientos es una PA con $a_1 = 20$ y $d = 2$.

  ![Modelamiento de situaciones de cambio lineal](/static/img/nodos/modelamiento-de-situaciones-de-cambio-lineal-mediante-progresiones-aritmeticas-intro.svg)
explicacion_formal: |
  ### Definición formal y Proceso de Modelamiento
  Un fenómeno discreto temporal o espacial $M(t)$ ($t \in \mathbb{N}$) se modela mediante una **progresión aritmética** si su tasa de variación media por período unitario es constante:
  $$\frac{\Delta M}{\Delta t} = \frac{M(t+1) - M(t)}{1} = d \quad (\text{constante})$$

  ### Etapas del Modelamiento Lineal
  1. **Identificación de variables y unidades**:
     - Variable independiente ($n$ o $t$): Período, mes, día, etapa ordinal.
     - Magnitud ($a_n$): Dinero, distancia, piezas producidas, asientos.
  2. **Determinación del estado inicial ($a_1$ o condición base)**:
     - Distinguir entre el valor inicial en $t=0$ ($C_0$) y el valor tras el primer período $t=1$ ($a_1 = C_0 + d$).
  3. **Identificación de la diferencia ($d$)**:
     - Incremento fijo $\implies d > 0$.
     - Desgaste, consumo o retiro fijo $\implies d < 0$.
  4. **Resolución y extrapolación**:
     - Valor en el período $n$: $a_n = a_1 + (n - 1)d$.
     - Acumulación total en $n$ períodos: $S_n = \frac{n(a_1 + a_n)}{2}$.

  ### Síntesis didáctica
  - Ecuación de estado: $a_n = a_1 + (n - 1)d$.
  - Ecuación de acumulación: $S_n = \frac{n(a_1 + a_n)}{2}$.
definiciones_clave: |
  - **Cambio lineal discreto**: Variación cuantitativa donde la magnitud se modifica en una cantidad aditiva fija en cada intervalo regular.
  - **Tasa de variación constante ($d$)**: Cantidad fija de magnitud añadida o sustraída por unidad de paso.
  - **Período de capitalización/aporte**: Intervalo temporal regular en el que se ejecuta la adición o sustracción.
propiedades_relaciones: |
  - **Diferenciación con el modelo exponencial**: Si el cambio es una cantidad fija en dinero ($\$5.000$/mes), es PA lineal; si el cambio es un porcentaje fijo ($5\%$/mes), es PG exponencial.
  - **Planificación financiera**: Las PA permiten predecir metas de ahorro y presupuestos a corto y mediano plazo.
ejemplo_guiado:
  enunciado: 'Un estudiante abre una cuenta de ahorro con $\$15.000$ y decide depositar $\$3.500$ al final de cada mes de forma constante. ¿Cuánto dinero habrá depositado en el mes 12 y cuál será el saldo total acumulado al finalizar el primer año (12 meses)?'
  imagen: '/static/img/nodos/modelamiento-de-situaciones-de-cambio-lineal-mediante-progresiones-aritmeticas-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el saldo al final del primer mes: $a_1 = \$15.000 + \$3.500 = \$18.500$.'
    - 'Paso 2: La diferencia constante de ahorro mensual es $d = \$3.500$.'
    - 'Paso 3: Calculamos el saldo al mes 12: $a_{12} = a_1 + (12 - 1) \cdot d = \$18.500 + 11 \cdot \$3.500 = \$18.500 + \$38.500 = \$57.000$.'
    - 'Paso 4: El saldo total al cabo de 12 meses es **$\$57.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de situación real se modela correctamente mediante una progresión aritmética?'
    choices:
      - {text: 'Ahorrar una cantidad fija constante de $\$5.000$ todos los meses', is_correct: true}
      - {text: 'Un capital bancario que gana un $10\%$ de interés compuesto anual', is_correct: false}
      - {text: 'La reproducción de una colonia de bacterias que se duplica cada hora', is_correct: false}
      - {text: 'La desintegración radiactiva donde se reduce a la mitad periódicamente', is_correct: false}
    explanation: 'La alternativa correcta es ''Ahorrar una cantidad fija constante de $\$5.000$ todos los meses''. Las adiciones de cantidades constantes corresponden a modelos aditivos lineales (PA).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un teatro tiene 25 filas. La primera fila tiene 18 asientos y cada fila sucesiva tiene 2 asientos más que la anterior. ¿Cuántos asientos tiene la última fila ($n=25$)?'
    choices:
      - {text: '$66$ asientos, calculando $18 + (25 - 1) \cdot 2 = 18 + 48 = 66$', is_correct: true}
      - {text: '$68$ asientos, multiplicando $18 + 25 \cdot 2$', is_correct: false}
      - {text: '$50$ asientos', is_correct: false}
      - {text: '$36$ asientos', is_correct: false}
    explanation: 'La alternativa correcta es ''$66$ asientos, calculando $18 + (25 - 1) \cdot 2 = 18 + 48 = 66$''. Aplicando el término general $a_{25} = 18 + 24(2) = 66$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer el enunciado e identificar si el cambio es aditivo fijo (PA).'
  - 'Paso 2: Determinar el valor de la condición inicial $a_1$ y la diferencia común $d$.'
  - 'Paso 3: Definir la incógnita: si se pide el valor en un período ($a_n$) o la acumulación total ($S_n$).'
  - 'Paso 4: Resolver la ecuación correspondiente y contextualizar el resultado con sus unidades.'
errores_correccion: |
  - **Error 1:** Modelar aumentos porcentuales con PA en lugar de progresión geométrica. **Cómo corregirlo:** Los porcentajes representan **crecimiento multiplicativo (PG)**, mientras que las PA requieren **sumas de montos fijos en dinero o unidades**.
  - **Error 2:** Confundir el valor del término $a_n$ con la suma acumulada $S_n$. **Cómo corregirlo:** $a_n$ es el **monto en ese mes específico**, mientras que $S_n$ es el **total acumulado sumando todos los meses**.
ejemplos:
  - titulo: 'Plan de entrenamiento progresivo'
    enunciado: 'Un atleta corre 5 km el día 1 y aumenta 500 m (0,5 km) cada día. ¿Cuántos km corre el día 10?'
    alternativas:
      - '$9,5\text{ km}$'
      - '$10\text{ km}$'
      - '$9\text{ km}$'
    respuesta: '$9,5\text{ km}$'
    solucion_pasos:
      - '1. $a_1 = 5, d = 0,5$.'
      - '2. $a_{10} = 5 + 9(0,5) = 5 + 4,5 = 9,5\text{ km}$.'
  - titulo: 'Producción industrial escalonada'
    enunciado: 'Una fábrica produce 100 piezas el día 1 y suma 10 piezas cada día. ¿Cuántas piezas produce el día 20?'
    alternativas:
      - '$290\text{ piezas}$'
      - '$300\text{ piezas}$'
      - '$280\text{ piezas}$'
    respuesta: '$290\text{ piezas}$'
    solucion_pasos:
      - '1. $a_{20} = 100 + 19(10) = 100 + 190 = 290$.'
  - titulo: 'Identificación de modelo lineal'
    enunciado: '¿Una deuda que se amortiza pagando una cuota de capital fija de $\$25.000$ mensuales sigue un modelo de progresión aritmética?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. La amortización constante de capital reduce la deuda a una tasa aditiva fija.'
  - titulo: 'Diferenciación entre PA y PG'
    enunciado: '¿Un aumento de sueldo del $5\%$ anual corresponde a una progresión aritmética?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Los incrementos porcentuales corresponden a progresiones geométricas multiplicativas.'
errores_frecuentes:
  - 'Los aumentos o variaciones expresados en porcentaje constante se modelan como progresiones aritméticas.'
  - 'En problemas contextuales de ahorro se confunde el monto ahorrado en un mes determinado con el total acumulado en el tiempo.'
  - 'Se omite el valor base inicial en el cálculo del estado final del sistema.'
  - 'Al modelar procesos de desgaste o consumo se asigna signo positivo a la tasa de variación unitaria.'
  - 'El número de períodos transcurridos se confunde con la suma total de elementos.'
afirmaciones_verdaderas:
  - 'Las situaciones del mundo real con tasas de cambio constante aditivas se modelan mediante progresiones aritméticas lineales.'
  - 'Las variaciones multiplicativas constantes (porcentajes) no son progresiones aritméticas, sino progresiones geométricas.'
