semantic_id: MAT.NUM.PROG_ARITMETICA.MODELO_CAMBIO_LINEAL
resumen_inicial: 'Modelamiento de situaciones de cambio lineal mediante progresiones aritméticas:
  concepto y desarrollo dentro de Progresión aritmética.'
explicacion_simple: ¿Acaso el taxímetro del Uber usa sucesiones numéricas? ¿La cuenta de la
  luz? ¡Sí! Cuando algo cobra un cargo fijo más un extra por cada kilómetro o minuto, estás
  frente a una progresión aritmética disfrazada.
explicacion_formal: "No vas a ir por la calle calculando $a_n$. Vas a calcular tarifas de\
  \ celular, depreciación de autos o crecimiento de plantas. \n\nPara modelar un problema\
  \ real con P.A:\n1. **Identifica la Diferencia ($d$):** Busca las palabras clave 'por cada',\
  \ 'aumento mensual de', 'baja a un ritmo de'. Ese es el número que siempre se suma o resta.\n\
  2. **Identifica el Inicio ($a_1$):** ¡Ojo aquí! A veces el 'cargo fijo' actúa como el término\
  \ inicial, pero otras veces el cargo fijo ocurre *antes* del primer paso. Debes leer con\
  \ cuidado si el primer evento real incluye ya un aumento o es solo la base.\n\nEjemplo:\
  \ Un plan de teléfono cobra $\\$5000$ fijos al mes, más $\\$100$ por cada minuto hablado.\n\
  - Si hablas 1 min: Pagas $5000 + 100 = 5100$ ($a_1$).\n- Si hablas 2 min: Pagas $5000 +\
  \ 200 = 5200$ ($a_2$).\nLa diferencia es $d=100$. Es una progresión aritmética perfecta."
definiciones_clave: '- **Modelamiento de situaciones de cambio lineal mediante progresiones
  aritméticas**: Concepto fundamental dentro del estudio de Progresión aritmética.'
propiedades_relaciones: '- **Propiedades de Modelamiento de situaciones de cambio lineal mediante
  progresiones aritméticas**: Relaciones de cambio y fórmulas estructurales de progresión
  aritmética.'
ejemplo_guiado:
  enunciado: Un estacionamiento cobra 2.000 pesos por la primera hora y 1.000 pesos por cada
    hora adicional. ¿Cuánto se paga por 5 horas?
  pasos:
  - Identifico a_1 igual a 2.000, el cobro de la primera hora, y d igual a 1.000, el cobro
    por cada hora adicional.
  - 'Aplico la fórmula del término general: a_5 igual a 2.000 más (5 menos 1) por 1.000.'
  - Calculo 4 por 1.000 igual a 4.000, y 2.000 más 4.000 igual a 6.000. Se pagan 6.000 pesos
    por 5 horas.
