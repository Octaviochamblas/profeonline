semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_RECTANGULO
resumen_inicial: 'Ubicación del circuncentro en el punto medio de la hipotenusa de
  un triángulo rectángulo: conceptos, teoremas, propiedades geométricas y cálculo
  en Elementos Secundarios del Triángulo.'
explicacion_simple: En un triángulo rectángulo, la hipotenusa actúa como diámetro
  de la circunferencia circunscrita, así que su centro es justamente el punto medio
  de la hipotenusa.
explicacion_formal: '![Circuncentro en el punto medio de la hipotenusa](/static/img/geometria/elementos-secundarios/simetral-circuncentro-circuncentro-rectangulo.svg)


  ### Definición formal


  Si un triángulo ABC tiene ángulo recto en A, el circuncentro O coincide con el punto
  medio de BC (la hipotenusa), y el circunradio es la mitad de la hipotenusa.


  ### Desarrollo didáctico


  Esto se debe a que todo ángulo inscrito en una semicircunferencia es recto: si BC
  es diámetro de una circunferencia y A está sobre ella, el ángulo en A es de 90°.
  Por lo tanto, el círculo de diámetro BC es exactamente la circunferencia circunscrita
  del triángulo rectángulo.'
definiciones_clave: '- **Ubicación del circuncentro en el punto medio de la hipotenusa
  de un triángulo rectángulo**: Elemento o propiedad fundamental en el estudio de
  elementos secundarios del triángulo.'
