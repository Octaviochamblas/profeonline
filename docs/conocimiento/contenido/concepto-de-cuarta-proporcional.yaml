semantic_id: MAT.NUM.PROPORCIONES.CUARTA_PROPORCIONAL
resumen_inicial: La cuarta proporcional es el cuarto término $x$ en una proporción
  discreta donde los tres primeros términos $a, b, c$ son conocidos y distintos ($\frac{a}{b}
  = \frac{c}{x}$).
explicacion_simple: 'Cuando te dan tres números en orden ($a, b, c$) y te piden hallar
  la **cuarta proporcional** ($x$), planteas la ecuación en ese orden estricto:

  $$\frac{a}{b} = \frac{c}{x} \implies x = \frac{b \cdot c}{a}$$

  Ejemplo: La cuarta proporcional entre $2, 5$ y $6$ es $\frac{2}{5} = \frac{6}{x}
  \implies x = \frac{5 \cdot 6}{2} = 15$.'
explicacion_formal: Dados $a, b, c \in \mathbb{R} \setminus \{0\}$, se denomina cuarta
  proporcional entre $a, b$ y $c$ al número $x$ que satisface la proporción discreta
  $\frac{a}{b} = \frac{c}{x}$, resultando $x = \frac{b \cdot c}{a}$.
definiciones_clave: '- **Cuarta proporcional ($x$)**: Cuarto término de una proporción
  discreta con tres datos dados.'
propiedades_relaciones: '- **Proporción discreta**: Proporción donde los cuatro términos
  son distintos dos a dos.'
ejemplo_guiado:
  enunciado: Calcula la cuarta proporcional entre $3$, $8$ y $9$.
  pasos:
  - 'Plantear la proporción en el orden dado: $\frac{3}{8} = \frac{9}{x}$.'
  - 'Aplicar multiplicación cruzada: $3 \cdot x = 8 \cdot 9$.'
  - 'Calcular el producto: $3x = 72$.'
  - 'Despejar $x$: $x = \frac{72}{3} = 24$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la cuarta proporcional entre 2, 4 y 6?
  choices:
  - text: '12'
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '24'
    is_correct: false
  explanation: 'La correcta es: 12. $\frac{2}{4} = \frac{6}{x} \implies x = \frac{4
    \cdot 6}{2} = 12$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Halla la cuarta proporcional de 5, 10 y 15.
  choices:
  - text: '30'
    is_correct: true
  - text: '20'
    is_correct: false
  - text: '75'
    is_correct: false
  - text: '15'
    is_correct: false
  explanation: 'La correcta es: 30. $\frac{5}{10} = \frac{15}{x} \implies x = \frac{10
    \cdot 15}{5} = 30$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la proporción $\frac{a}{b} = \frac{c}{x}$ en el orden mencionado.'
- 'Paso 2: Multiplicar el segundo y tercer término ($b \cdot c$).'
- 'Paso 3: Dividir entre el primer término $a$ para hallar $x$.'
errores_correccion: Respeta rigurosamente el orden de los números dados al armar la
  proporción.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula la cuarta proporcional entre 1, 3 y 4.
  alternativas:
  - '12'
  - '7'
  - 3/4
  respuesta: '12'
  solucion_pasos:
  - $x = \frac{3 \cdot 4}{1} = 12$.
errores_frecuentes:
- Cambiar el orden de los tres números iniciales dados.
afirmaciones_verdaderas:
- La cuarta proporcional satisface $\frac{a}{b} = \frac{c}{x}$.
al_terminar_debes_ponder: Calcular la cuarta proporcional en problemas de proporciones
  discretas.
fuente: Texto escolar MINEDUC.
estado: publicado
