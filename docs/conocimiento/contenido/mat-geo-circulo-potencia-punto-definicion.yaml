semantic_id: MAT.GEO.CIRCULO_TEOREMAS.POTENCIA_PUNTO_DEFINICION
resumen_inicial: 'Definición de potencia de un punto respecto de una circunferencia:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: La potencia de un punto es un número que resume, en una sola fórmula,
  si un punto está dentro, fuera o justo sobre una circunferencia, y sirve de base
  para los teoremas de cuerdas, secantes y tangentes.
explicacion_formal: '![Potencia de un punto: los tres casos](/static/img/geometria/circunferencia-circulo/circulo-potencia-punto-definicion.svg)


  ### Definición formal


  Dada una circunferencia de centro $O$ y radio $r$, la potencia de un punto $P$ respecto
  de ella es $\text{pot}(P)=PO^2-r^2$, donde $PO$ es la distancia de $P$ al centro.
  Si $P$ es exterior ($PO>r$), la potencia es positiva; si $P$ es interior ($PO<r$),
  es negativa; si $P$ está sobre la circunferencia ($PO=r$), la potencia es exactamente
  cero.


  ### Desarrollo didáctico


  Esta definición unifica los teoremas de cuerdas, secantes y tangente-secante: en
  todos los casos, el producto de segmentos (o su negativo, según la posición) es
  igual al valor absoluto de la potencia del punto. Así, $\text{pot}(P)$ es una única
  fórmula que sintetiza los tres teoremas de proporcionalidad métrica en la circunferencia.'
