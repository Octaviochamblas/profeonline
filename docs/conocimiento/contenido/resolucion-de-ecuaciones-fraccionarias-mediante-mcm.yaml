semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.USO_MCM
resumen_inicial: Multiplicar ambos miembros por el m.c.m. de los denominadores elimina las fracciones y convierte la ecuación en una ecuación lineal entera.
explicacion_simple: |
  Para resolver ecuaciones fraccionarias que contienen polinomios con la variable en el denominador, utilizamos el m.c.m. de los denominadores.

  Al multiplicar la ecuación completa por este m.c.m. polinomial, los denominadores que contienen a la variable se simplifican por completo.

  Este proceso nos proporciona una ecuación entera de primer grado que podemos despejar aplicando las reglas tradicionales de transposición de términos.
explicacion_formal: |
  ### Definición formal
  Dada la ecuación fraccionaria $\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)} = C(x)$, sea $M(x) = \operatorname{mcm}(P(x), Q(x))$. La **eliminación por m.c.m. polinomial** establece la cadena de equivalencias:

  $$M(x) \cdot \left(\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}\right) = M(x) \cdot C(x)$$

  $$A(x) \cdot \left(\frac{M(x)}{P(x)}\right) + B(x) \cdot \left(\frac{M(x)}{Q(x)}\right) = M(x) \cdot C(x)$$

  ### Desglose de la fórmula
  - $\frac{M(x)}{P(x)}$ y $\frac{M(x)}{Q(x)}$: Cocientes polinomiales exactos enteros que suprimen completamente las fracciones en cada término.

  ### Síntesis didáctica
  Multiplicar por el m.c.m. exige distribuir el factor $M(x)$ a todos los términos de la ecuación, incluidas las constantes enteras sin denominador aparente.
definiciones_clave: |
  - **m.c.m. polinomial de denominadores**: Expresión algebraica de menor grado que contiene a todos los denominadores como factores divisores exactos.
  - **Enterización algebraica**: Transformación de una ecuación fraccionaria en una ecuación entera sobre el dominio $\operatorname{Dom} = \mathbb{R} \setminus V_p$.
propiedades_relaciones: |
  - **Preservación de equivalencia**: En el dominio permitido, la ecuación entera resultante posee exactamente el mismo conjunto solución $S$ que la ecuación fraccionaria inicial.
  - **Productos cruzados en proporciones**: Si la ecuación es de la forma $\frac{A(x)}{B(x)} = \frac{C(x)}{D(x)}$, el m.c.m. genera el producto cruzado $A(x)D(x) = B(x)C(x)$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación fraccionaria $\frac{4}{x - 1} = \frac{6}{x + 2}$ multiplicando por el m.c.m. de los denominadores y evalúa la solución.'
  pasos:
    - 'Paso 1: Identificar las restricciones de dominio: $x - 1 \neq 0 \implies x \neq 1$ y $x + 2 \neq 0 \implies x \neq -2$.'
    - 'Paso 2: Determinar el m.c.m. polinomial: $M(x) = (x - 1)(x + 2)$.'
    - 'Paso 3: Multiplicar ambos miembros por el m.c.m.: $4(x + 2) = 6(x - 1)$.'
    - 'Paso 4: Aplicar la propiedad distributiva: $4x + 8 = 6x - 6$.'
    - 'Paso 5: Trasponer y reducir: $8 + 6 = 6x - 4x \implies 14 = 2x \implies x = 7$.'
    - 'Paso 6: Comprobar que $x = 7$ satisface el dominio ($7 \neq 1, 7 \neq -2$) y sustituir: $\frac{4}{7 - 1} = \frac{4}{6} = \frac{2}{3}$ y $\frac{6}{7 + 2} = \frac{6}{9} = \frac{2}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al multiplicar la ecuación $\frac{4}{x - 1} = \frac{6}{x + 2}$ por el m.c.m. $(x - 1)(x + 2)$, ¿cuál es la ecuación entera obtenida?'
    choices:
      - {text: '$4(x + 2) = 6(x - 1)$', is_correct: true}
      - {text: '$4(x - 1) = 6(x + 2)$', is_correct: false}
      - {text: '$4x + 2 = 6x - 1$', is_correct: false}
      - {text: '$4 + x + 2 = 6 + x - 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4(x + 2) = 6(x - 1)$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación $\frac{4}{x - 1} = \frac{6}{x + 2}$, ¿cuál es el valor de la solución $x$?'
    choices:
      - {text: '$x = 7$', is_correct: true}
      - {text: '$x = 14$', is_correct: false}
      - {text: '$x = 2$', is_correct: false}
      - {text: '$x = 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 7$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar completamente cada uno de los denominadores y fijar las restricciones del dominio.'
  - 'Paso 2: Construir el m.c.m. polinomial tomando todos los factores comunes y no comunes con su mayor exponente.'
  - 'Paso 3: Multiplicar cada sumando de la ecuación por el m.c.m. dividiéndolo entre su respectivo denominador.'
  - 'Paso 4: Expandir los productos resultantes mediante propiedad distributiva y resolver la ecuación entera.'
  - 'Paso 5: Verificar que la solución pertenezca al dominio permitido $\operatorname{Dom}$.'
errores_correccion: |
  - **Error 1:** Olvidar multiplicar el m.c.m. por las constantes independientes que no poseen denominador fraccionario (ejemplo: al resolver $\frac{1}{x} + 2 = 3$, escribir $1 + 2 = 3x$). **Cómo corregirlo:** La propiedad multiplicativa **EXIGE MULTIPLICAR ABSOLUTAMENTE TODOS LOS TÉRMINOS DE AMBOS MIEMBROS POR EL M.C.M., INCLUIDAS LAS CONSTANTES ENTERAS ($1 + 2x = 3x$)**.
  - **Error 2:** Olvidar colocar paréntesis alrededor de los numeradores compuestos al eliminar denominadores. **Cómo corregirlo:** Al eliminar el denominador, **EL COCIENTE RESULTANTE MULTIPLICA A TODO EL NUMERADOR USANDO PARÉNTESIS MANDATORIOS**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el m.c.m. de los denominadores en la ecuación $\frac{3}{x} + \frac{2}{x - 1} = 5$?'
    alternativas:
      - '$x(x - 1)$'
      - '$2x - 1$'
      - '$x + x - 1$'
    respuesta: '$x(x - 1)$'
    solucion_pasos:
      - '1. Denominadores: $x$ y $(x - 1)$.'
      - '2. Factores no comunes: $x(x - 1)$.'
      - '3. m.c.m. = $x(x - 1)$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al enterizar $\frac{2}{x} = \frac{5}{x + 3}$, ¿cuál es la solución obtenida?'
    alternativas:
      - '$x = 2$'
      - '$x = 6$'
      - '$x = 3$'
    respuesta: '$x = 2$'
    solucion_pasos:
      - '1. Multiplicación cruzada: $2(x + 3) = 5x$.'
      - '2. Expandir: $2x + 6 = 5x \implies 3x = 6 \implies x = 2$.'
      - '3. Verificar restricciones: $2 \neq 0$ y $2 \neq -3$. Solución válida.'
  - titulo: 'Proporciones simples'
    enunciado: '¿En una igualdad de dos fracciones $\frac{A}{B} = \frac{C}{D}$, la eliminación de denominadores equivale al producto cruzado $A \cdot D = B \cdot C$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es una consecuencia directa de multiplicar por el m.c.m. $B \cdot D$.'
  - titulo: 'Constante sin denominador'
    enunciado: '¿Multiplicar la ecuación $\frac{1}{x} + 4 = 6$ por el m.c.m. $x$ produce $1 + 4x = 6x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la constante $4$ se multiplica por $x$.'
errores_frecuentes:
  - 'Multiplicar el m.c.m. solo por los términos con fracción y no por las constantes enteras.'
  - 'Omitir paréntesis en numeradores binomios al suprimir denominadores.'
  - 'Multiplicar el m.c.m. por el denominador en vez de dividirlo.'
  - 'Aceptar soluciones extrañas que coinciden con las restricciones de dominio de la ecuación original.'
  - 'Calcular un m.c.m. incorrecto que no elimina todos los factores polinomiales del denominador.'
afirmaciones_verdaderas:
  - 'Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la convierte en una ecuación entera equivalente en $\operatorname{Dom}$.'
  - 'Todas las constantes independientes de la ecuación deben multiplicarse rigurosamente por el m.c.m. de los denominadores.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones fraccionarias de primer grado mediante multiplicación por el m.c.m. de sus denominadores.
  CÓMO: Hallar el m.c.m. polinomial de los denominadores, distribuirlo a cada término, enterizar la ecuación, despejar la variable y validar que pertenezca al dominio.
