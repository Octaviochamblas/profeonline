semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.USO_MCM
resumen_inicial: Multiplicar ambos miembros por el m.c.m. de los denominadores elimina
  las fracciones y convierte la ecuación en una ecuación lineal entera.
explicacion_simple: 'Para resolver ecuaciones fraccionarias con polinomios en el denominador,
  usamos el m.c.m. de los denominadores.

  Al multiplicar toda la ecuación por este m.c.m., los denominadores con variable
  se simplifican por completo.

  Esto nos deja una ecuación entera de primer grado que podemos resolver despejando
  la incógnita como de costumbre.'
explicacion_formal: 'Dada la ecuación fraccionaria $\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}
  = C(x)$, sea $M(x) = \operatorname{mcm}(P(x), Q(x))$. La **eliminación por m.c.m.
  polinomial** establece:


  $$M(x) \cdot \left(\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}\right) = M(x) \cdot C(x)$$


  $$A(x) \cdot \left(\frac{M(x)}{P(x)}\right) + B(x) \cdot \left(\frac{M(x)}{Q(x)}\right)
  = M(x) \cdot C(x)$$


  **Desglose de la fórmula:**

  - $\frac{M(x)}{P(x)}$ y $\frac{M(x)}{Q(x)}$: Factores polinomiales enteros exactos
  que eliminan las fracciones.'
definiciones_clave: '- **m.c.m. polinomial de denominadores**: Mínimo común múltiplo
  de menor grado que contiene a todos los denominadores como factores divisorios.'
propiedades_relaciones: '- **Transformación equivalente**: La ecuación entera resultante
  es equivalente a la fraccionaria dentro del dominio permitido $\operatorname{Dom}
  = \mathbb{R} \setminus V_p$.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación fraccionaria $\frac{4}{x - 1} = \frac{6}{x + 2}$
    multiplicando por el m.c.m. de los denominadores y evalúa la solución.
  pasos:
  - 'Paso 1: Identificar restricciones: $x \neq 1$ y $x \neq -2$.Paso 2: Determinar
    m.c.m. de los denominadores: $M(x) = (x - 1)(x + 2)$.Paso 3: Multiplicar ambos
    miembros por el m.c.m. (multiplicación en cruz equivalente): $4(x + 2) = 6(x -
    1)$.Paso 4: Aplicar la propiedad distributiva: $4x + 8 = 6x - 6$.Paso 5: Trasponer
    y reducir: $8 + 6 = 6x - 4x \implies 14 = 2x \implies x = 7$.Paso 6: Comprobar
    que $x = 7$ respeta el dominio ($7 \neq 1, 7 \neq -2$) y sustituir: $\frac{4}{7
    - 1} = \frac{4}{6} = \frac{2}{3}$ y $\frac{6}{7 + 2} = \frac{6}{9} = \frac{2}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al multiplicar la ecuación $\frac{4}{x - 1} = \frac{6}{x + 2}$ por su
    m.c.m. $(x - 1)(x + 2)$, ¿cuál es la ecuación entera obtenida?
  choices:
  - text: $4(x + 2) = 6(x - 1)$
    is_correct: true
  - text: $4(x - 1) = 6(x + 2)$
    is_correct: false
  - text: $4x + 2 = 6x - 1$
    is_correct: false
  - text: $4 + x + 2 = 6 + x - 1$
    is_correct: false
  explanation: La alternativa correcta es '$4(x + 2) = 6(x - 1)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $\frac{4}{x - 1} = \frac{6}{x + 2}$, ¿cuál es el valor de
    la solución $x$?
  choices:
  - text: $x = 7$
    is_correct: true
  - text: $x = 14$
    is_correct: false
  - text: $x = 2$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 7$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar los denominadores y determinar las restricciones del dominio.'
- 'Paso 2: Calcular el m.c.m. de los denominadores.'
- 'Paso 3: Multiplicar cada término de la ecuación por el m.c.m. simplificando los
  denominadores.'
- 'Paso 4: Resolver la ecuación lineal entera sin denominadores.'
- 'Paso 5: Comprobar que la solución pertenezca al dominio permitido.'
errores_correccion: '- **Error común:** Olvidar multiplicar el m.c.m. por las constantes
  sueltas que no tienen denominador.

  - **Cómo corregirlo:** Si la ecuación tiene un $+ 3$ o $= 0$, el $+ 3$ también DEBE
  multiplicarse por el m.c.m.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
