semantic_id: MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_DESCUENTO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: El valor final con descuento porcentual se calcula mediante el producto
  directo $V_f = V_i \cdot (1 - d_{\text{dec}})$, y el precio de lista original se
  recupera con $V_i = \frac{V_f}{1 - d_{\text{dec}}}$.
explicacion_simple: 'Para calcular directamente cuánto pagarás con un descuento, multiplicas
  el precio de lista por el factor complementario: con $20\%$ de descuento multiplicas
  por $0,80$; con $35\%$ por $0,65$. Si sabes lo que pagaste y quieres saber el precio
  original de lista, divides lo pagado entre ese factor decimal complementario.


  ![calculo-del-valor-final-con-descuento-porcentual](/static/img/nodos/calculo-del-valor-final-con-descuento-porcentual-intro.svg)

  '
explicacion_formal: 'Para un valor inicial de lista $V_i$ y una tasa de descuento
  $d > 0$ (con $d < 100$), las fórmulas directa e inversa son:


  $$V_f = V_i \cdot \left(1 - \frac{d}{100}\right) = V_i \cdot (1 - d_{\text{dec}})$$


  $$V_i = \frac{V_f}{1 - \frac{d}{100}} = \frac{V_f}{1 - d_{\text{dec}}}$$


  Donde $(1 - d_{\text{dec}})$ es el factor de pago efectivo respecto al precio de
  catálogo.'
definiciones_clave: '- **Cálculo directo de $V_f$**: Multiplicación del precio de
  lista por el factor complementario $(1 - d_{\text{dec}})$.

  - **Cálculo inverso de $V_i$**: División del precio rebajado por $(1 - d_{\text{dec}})$
  para reconstituir el precio de lista.'
propiedades_relaciones: '- **Asimetría de rebajas**: Para recuperar el precio original,
  no se suma el $d\%$ al precio final, sino que se divide por $(1 - d_{\text{dec}})$.

  - **Monotonía**: A mayor porcentaje de descuento $d$, menor es el factor $(1 - d_{\text{dec}})$
  y menor el valor final a pagar.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-valor-final-con-descuento-porcentual-resumen.svg)


  QUÉ: Calcular el valor final y el precio de lista en situaciones de descuento comercial.
  CÓMO: Aplicando $V_f = V_i \cdot (1 - d_{\text{dec}})$ para cálculo directo y $V_i
  = \frac{V_f}{1 - d_{\text{dec}}}$ para recuperar el precio original.'
