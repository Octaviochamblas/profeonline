procedimiento:
- 'Paso 1: Determinar el factor complementario $F = 1 - \frac{d}{100}$.'
- 'Paso 2: Para calcular el precio rebajado, multiplicar $V_f = V_i \cdot F$.'
- 'Paso 3: Para recuperar el precio de lista original, dividir $V_i = \frac{V_f}{F}$.'
ejemplo_guiado:
  enunciado: Un cliente pagó $\$24.000$ por una prenda que tenía un $20\%$ de descuento.
    ¿Cuál era el precio original de lista de la prenda?
  pasos:
  - 'Paso 1: Identificar el precio pagado $V_f = 24.000$ y el descuento $d = 20\%$.'
  - 'Paso 2: Determinar el factor complementario: $F = 1 - 0,20 = 0,80$.'
  - 'Paso 3: Aplicar la fórmula inversa dividiendo por el factor: $V_i = \frac{24.000}{0,80}$.'
  - 'Paso 4: Resolver la división: $\frac{24.000}{0,80} = 30.000$.'
  - 'Conclusión: El precio original de lista era de $\$30.000$.'
  imagen: /static/img/nodos/calculo-del-valor-final-con-descuento-porcentual-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por cuál factor decimal se debe dividir el precio final para recuperar
    el precio original si hubo un descuento del $30\%$?
  choices:
  - text: $0,70$
    is_correct: true
  - text: $1,30$
    is_correct: false
  - text: $0,30$
    is_correct: false
  - text: $0,80$
    is_correct: false
  explanation: El factor complementario es $1 - 0,30 = 0,70$, por lo que $V_i = \frac{V_f}{0,70}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un producto pagado a $\$45.000$ tenía un $10\%$ de descuento. ¿Cuál era
    su precio de lista?
  choices:
  - text: $\$50.000$
    is_correct: true
  - text: $\$49.500$
    is_correct: false
  - text: $\$55.000$
    is_correct: false
  - text: $\$48.000$
    is_correct: false
  explanation: $V_i = \frac{45.000}{0,90} = 50.000$ pesos.
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Sumar el porcentaje al precio con descuento para
  hallar el original (ej: $24.000 + 20\% = 28.800$).** **Cómo corregirlo:** La base
  original es mayor, por lo que se debe dividir exactamente por $(1 - d_{\text{dec}})
  = 0,80$.

  - **Error 2: Confundir el porcentaje de ahorro con el porcentaje pagado.** **Cómo
  corregirlo:** Si el descuento es $d\%$, se paga el $(100 - d)\%$.'
ejemplos:
- titulo: Compra con cupón de descuento
  enunciado: Un artículo de $\$60.000$ se compra aplicando un cupón del $15\%$. ¿Cuál
    es el precio final pagado?
  alternativas:
  - $\$51.000$
  - $\$54.000$
  - $\$45.000$
  - $\$52.500$
  respuesta: $\$51.000$
  solucion_pasos:
  - 'Factor complementario: $1 - 0,15 = 0,85$.'
  - 'Multiplicar: $V_f = 60.000 \cdot 0,85 = 51.000$ pesos.'
- titulo: Hallar precio de lista de un mueble
  enunciado: Un mueble se vende a $\$140.000$ tras aplicar una rebaja del $30\%$. ¿Cuál
    era su precio original?
  alternativas:
  - $\$200.000$
  - $\$182.000$
  - $\$190.000$
  - $\$170.000$
  respuesta: $\$200.000$
  solucion_pasos:
  - 'Factor: $1 - 0,30 = 0,70$.'
  - 'Dividir: $V_i = \frac{140.000}{0,70} = 200.000$ pesos.'
- titulo: ¿Si un producto tiene 25% de descuento, se divide el precio final por 0,75
    para hallar el original?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $V_i = \frac{V_f}{1 - 0,25} = \frac{V_f}{0,75}$.
- titulo: ¿Sumar 30% a un producto con 30% de descuento restituye su precio de lista?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $0,70 \cdot 1,30 = 0,91$, quedando un $9\%$ por debajo del precio original.
errores_frecuentes:
- Sumar el porcentaje al precio final para intentar recuperar el precio original.
- Dividir por $(1 + d)$ en lugar de dividir por $(1 - d)$.
- Olvidar que la base original siempre es mayor que el precio con descuento.
afirmaciones_verdaderas:
- El precio original de lista se recupera dividiendo el precio con descuento entre
  $(1 - d_{\text{dec}})$.
- El factor $(1 - d/100)$ permite calcular el precio final rebajado en una sola multiplicación.
