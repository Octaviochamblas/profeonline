resumen_inicial: 'El valor final tras un descuento porcentual $d\%$ se calcula directamente
  multiplicando el precio inicial $P_i$ por el factor de pago neto: $P_f = P_i \cdot
  \left(1 - \frac{d}{100}\right)$.'
explicacion_simple: Para calcular el precio rebajado en un solo paso, tomamos el precio
  inicial y lo multiplicamos por el porcentaje que realmente terminamos pagando expresado
  en decimal (por ejemplo, precio por $0,70$ para un $30\%$ de descuento).
explicacion_formal: 'Para un precio inicial $P_i > 0$ con un descuento del $d\%$,
  el **Valor Final con Descuento $P_f$** satisface:


  $$P_f = P_i \cdot (1 - d_{dec}) \quad \text{donde } d_{dec} = \frac{d}{100}$$


  **Ejemplo de factor:**

  - Un descuento del $25\% \implies P_f = P_i \cdot 0,75$.'
definiciones_clave: '- **Valor final con descuento**: Producto $P_f = P_i \cdot \left(1
  - \frac{d}{100}\right)$.'
propiedades_relaciones: '- **Factor $1-d$**: Escalador directo para precios rebajados.'
ejemplo_guiado:
  enunciado: Un par de zapatillas de \$60.000 tiene un descuento del $30\%$. Calcule
    el precio final.
  pasos:
  - 'Paso 1: Identificar el factor neto a pagar: $1 - 0,30 = 0,70$.'
  - 'Paso 2: Multiplicar $P_f = 60.000 \cdot 0,70 = 42.000$.'
  - 'Conclusión: El precio final a pagar es \$42.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué factor directo se multiplica un precio Pi para aplicarle un 30%
    de descuento?
  choices:
  - text: Por el factor 0,70
    is_correct: true
  - text: Por el factor 0,30
    is_correct: false
  - text: Por 1,30
    is_correct: false
  - text: Por 30
    is_correct: false
  explanation: La alternativa correcta es 'Por el factor 0,70'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para las zapatillas de $60.000 con 30% de descuento,
    ¿cuál fue el precio final?
  choices:
  - text: 42.000 $
    is_correct: true
  - text: 18.000 $
    is_correct: false
  - text: 45.000 $
    is_correct: false
  - text: 50.000 $
    is_correct: false
  explanation: La alternativa correcta es '42.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el valor final $P_f =
  P_i \cdot (1 - d_{dec})$ tras aplicar una rebaja o descuento porcentual.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_DESCUENTO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_DESCUENTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
