semantic_id: MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_DESCUENTO
resumen_inicial: 'Cálculo del valor final con descuento porcentual: concepto y propiedades
  fundamentales en Variaciones porcentuales.'
explicacion_simple: ¿Apurado en la caja de la tienda? No calcules cuánto dinero te ahorras
  para luego restarlo. Calcula directamente lo que debes pagar multiplicando por el porcentaje
  complementario.
explicacion_formal: 'Al igual que con el aumento, existe un **factor multiplicador** para
  los descuentos. Si a un total del $100\%$ le quitas un descuento $D\%$, lo que pagarás realmente
  es el $(100 - D)\%$.


  La fórmula directa para el Valor Final con descuento es:

  $\text{Valor Final} = \text{Valor Inicial} \cdot \left( 1 - \frac{D}{100} \right)$


  - Si te hacen un $20\%$ de descuento, pagas el $80\%$. El factor es $1 - 0.20 = 0.80$.

  - Si la liquidación es del $45\%$, pagas el $55\%$. Multiplicas por $0.55$.'
definiciones_clave: '- **Cálculo del valor final con descuento porcentual**: Elemento central
  dentro del estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del valor final con descuento porcentual.'
ejemplo_guiado:
  enunciado: Una chaqueta de $70.000 tiene un 25% de descuento. Calcula el precio final con
    el factor multiplicador.
  pasos:
  - Identifico que si el descuento es 25%, se paga el 75% del precio.
  - 'Convierto a factor decimal: 0,75.'
  - 'Multiplico: 70.000 por 0,75 es igual a 52.500. Ese es el precio final.'
