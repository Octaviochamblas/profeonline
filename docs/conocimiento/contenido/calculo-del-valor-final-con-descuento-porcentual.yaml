  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el porcentaje de descuento ($D\%$).'
- 'Paso 2: Resta ese porcentaje a 100 para saber qué porcentaje sí vas a pagar.'
- 'Paso 3: Convierte ese número a decimal y multiplica por el precio original.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del valor final
  con descuento porcentual.
ejemplos:
- titulo: Zapatillas en oferta
  enunciado: Zapatillas de $60.000 con 30% de descuento. ¿Cuánto pagas en caja?
  solucion_pasos:
  - Si el descuento es 30%, pagamos el 70%.
  - El factor decimal es $0.70$.
  - 'Multiplicamos: $60.000 \cdot 0.70 = 42.000$.'
  - El precio final es $42.000.
- titulo: Ejemplo 2
  enunciado: Un pantalón de $25.000 tiene 40% de descuento. ¿Cuál es el precio final?
  alternativas:
  - '15.000'
  - '10.000'
  - '22.500'
  respuesta: '15.000'
  solucion_pasos:
  - 25.000 por 0,60 es igual a 15.000.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el factor multiplicador de un descuento del 35%?
  alternativas:
  - 0,65
  - 1,35
  - 0,35
  respuesta: 0,65
  solucion_pasos:
  - 1 menos 0,35 es igual a 0,65.
- titulo: ¿El factor multiplicador de un descuento siempre es menor que 1?
  respuesta: Sí
  solucion_pasos:
  - Porque se está pagando menos del 100% del precio original.
errores_frecuentes:
- Multiplicar por $0.30$ y creer que ese es el precio a pagar (eso es el dinero que te ahorras).
- Dividir el precio por el porcentaje de descuento.
- Multiplicar por el decimal del descuento, 0,25, y creer que ese es el precio final, en vez
  de calcular el complemento.
- Dividir el precio por el porcentaje de descuento en vez de multiplicar por el factor complementario.
- Confundir el factor de un descuento del 20% (0,80) con el de un 80% (0,20).
afirmaciones_verdaderas:
- La propiedad de cálculo del valor final con descuento porcentual preserva la consistencia
  lógica.
- El factor multiplicador para calcular el valor final tras un descuento siempre se obtiene
  restando el porcentaje en decimal a 1.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del valor final
  con descuento porcentual.
