semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_RECTANGULO
resumen_inicial: En un triángulo rectángulo, los dos catetos son perpendiculares entre
  sí y coinciden con dos de las alturas. Por esta razón, el ortocentro ($H$) coincide
  exactamente con el vértice del ángulo recto ($90^\circ$).
explicacion_simple: '![Ortocentro en Triángulo Rectángulo](/static/img/nodos/ubicacion-del-ortocentro-en-el-vertice-del-angulo-recto-de-un-triangulo-rectangulo-intro.svg)


  En un **triángulo rectángulo**, encontrar el ortocentro es inmediato y no requiere
  cálculos:


  - **Los catetos son alturas**: El cateto vertical es la altura del horizontal, y
  el cateto horizontal es la altura del vertical.

  - **Se cruzan en la esquina de $90^\circ$**: Como ambos catetos nacen en la esquina
  recta, el ortocentro **$H$ es el vértice del ángulo recto**.

  - **Propiedad única**: Es el único tipo de triángulo donde el ortocentro se ubica
  sobre uno de los vértices del triángulo.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo rectángulo $\Delta ABC$ con ángulo recto en el vértice $C$ ($\gamma
  = 90^\circ$), el ortocentro $H$ coincide exactamente con dicho **vértice del ángulo
  recto**:


  $$\gamma = 90^\circ \implies H \equiv C$$


  ### Desglose simbólico y geométrico

  - Altura $h_a$: Coincide con el cateto $\overline{AC}$ ($h_a = b$).

  - Altura $h_b$: Coincide con el cateto $\overline{BC}$ ($h_b = a$).

  - Altura $h_c$: Segmento perpendicular trazado desde $C$ a la hipotenusa.

  - Intersección: La concurrencia de los dos catetos ocurre en el vértice común $C$,
  fijando $H = C$.


  ### Síntesis didáctica

  En el triángulo rectángulo no es necesario calcular la posición del ortocentro:
  reside de forma inmediata en la esquina de $90^\circ$.'
definiciones_clave: '- **Triángulo rectángulo**: Triángulo que posee un ángulo interior
  recto ($90^\circ$).

  - **Catetos como alturas**: Propiedad por la cual cada cateto es la altura relativa
  al otro cateto.

  - **Ortocentro en el vértice recto**: Identidad geométrica $H = C$ donde $C$ es
  el vértice del ángulo recto.

  '
propiedades_relaciones: '- **Coincidencia exacta**: $\angle C = 90^\circ \iff H =
  C$.

  - **Dualidad con el circuncentro**: En el triángulo rectángulo, el ortocentro $H$
  está en el vértice recto y el circuncentro $O$ está en el punto medio de la hipotenusa
  ($HO = c/2$).

  - **Altura a la hipotenusa**: $h_c = \frac{a \cdot b}{c}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ortocentro en Rectángulo](/static/img/nodos/ubicacion-del-ortocentro-en-el-vertice-del-angulo-recto-de-un-triangulo-rectangulo-ejemplos.svg)


    En un triángulo rectángulo $ABC$, el ángulo recto está en el vértice $B$. Los
    catetos miden $AB = 6\text{ cm}$ y $BC = 8\text{ cm}$. Identifica las coordenadas/posición
    del ortocentro $H$ y calcula la distancia desde el ortocentro hasta el circuncentro
    $O$ del triángulo.

    '
  pasos:
  - 'Paso 1: Identificar la posición del ortocentro: en un triángulo rectángulo, el
    ortocentro $H$ coincide con el vértice del ángulo recto, por lo que $H = B$.'
  - 'Paso 2: Calcular la hipotenusa $AC$ por Pitágoras: $AC = \sqrt{6^2 + 8^2} = \sqrt{36
    + 64} = \sqrt{100} = 10\text{ cm}$.'
  - 'Paso 3: Recordar que el circuncentro $O$ se ubica en el punto medio de la hipotenusa
    $AC$.'
  - 'Paso 4: La distancia $HO$ es el radio de la circunferencia circunscrita: $R =
    \frac{AC}{2} = \frac{10}{2} = 5\text{ cm}$.'
  - 'Paso 5: Concluir que el ortocentro es el vértice $B$ y la distancia hasta el
    circuncentro es $5\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un triángulo rectángulo DEF con ángulo recto en el vértice E, ¿dónde
    se ubica exactamente el ortocentro?
  choices:
  - text: Coincide exactamente con el vértice E del ángulo recto
    is_correct: true
  - text: En el punto medio de la hipotenusa DF
    is_correct: false
  - text: En el baricentro interior
    is_correct: false
  - text: En el exterior del triángulo
    is_correct: false
  explanation: El ortocentro coincide exactamente con el vértice E del ángulo recto,
    ya que los catetos que concurren en E son a la vez alturas.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la distancia entre el ortocentro y el circuncentro en un triángulo
    rectángulo cuya hipotenusa mide 20 cm?
  choices:
  - text: $10\text{ cm}$
    is_correct: true
  - text: $20\text{ cm}$
    is_correct: false
  - text: $5\text{ cm}$
    is_correct: false
  - text: $0\text{ cm}$
    is_correct: false
  explanation: La distancia es $10\text{ cm}$, pues la distancia del ortocentro (vértice
    recto) al circuncentro (punto medio de la hipotenusa) es la mitad de la hipotenusa
    ($20/2 = 10\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar cuál de los tres vértices del triángulo corresponde al ángulo
  recto ($90^\circ$).'
- 'Paso 2: Reconocer que los dos lados que forman dicho ángulo recto (los catetos)
  actúan como alturas.'
- 'Paso 3: Declarar directamente dicho vértice recto como el ortocentro $H$ del triángulo.'
- 'Paso 4: Si se requiere la altura hacia la hipotenusa, calcularla mediante $h =
  \frac{a \cdot b}{c}$.'
errores_correccion: 'No confundas el ortocentro con el circuncentro: en el triángulo
  rectángulo, el ortocentro está en el vértice recto y el circuncentro está en el
  punto medio de la hipotenusa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene vértices en $(0,0)$, $(4,0)$ y $(0,3)$ en el plano
    cartesiano, ¿cuáles son las coordenadas de su ortocentro?
  alternativas:
  - $(0, 0)$
  - $(2, 1.5)$
  - $(4, 3)$
  respuesta: $(0, 0)$
  solucion_pasos:
  - Los catetos descansan sobre los ejes cartesianos formando el ángulo recto en el
    origen $(0,0)$, por lo que el ortocentro es $H = (0,0)$.
- titulo: Ejemplo 2
  enunciado: En un triángulo rectángulo de catetos $5\text{ cm}$ y $12\text{ cm}$,
    ¿cuánto mide la distancia desde el ortocentro a la hipotenusa (altura $h_c$)?
  alternativas:
  - $\frac{60}{13}\text{ cm}$
  - $6\text{ cm}$
  - $\frac{65}{12}\text{ cm}$
  respuesta: $\frac{60}{13}\text{ cm}$
  solucion_pasos:
  - Hipotenusa $c = \sqrt{5^2 + 12^2} = 13\text{ cm}$.
  - 'Altura a la hipotenusa: $h_c = \frac{a \cdot b}{c} = \frac{5 \times 12}{13} =
    \frac{60}{13}\text{ cm}$.'
- titulo: ¿El ortocentro de un triángulo rectángulo está ubicado en el interior del
    triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, está ubicado sobre la frontera (perímetro) del triángulo, exactamente en el
    vértice del ángulo recto.
- titulo: ¿Los dos catetos de un triángulo rectángulo son a la vez dos de sus alturas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque cada cateto es perpendicular al otro cateto.
errores_frecuentes:
- Confundir el ortocentro con el circuncentro en el triángulo rectángulo.
- Intentar calcular la posición de $H$ como si fuera un punto interior.
- Olvidar que los catetos son perpendiculares y por ende son alturas.
- Creer que en el triángulo rectángulo no existe ortocentro.
- Confundir la altura a la hipotenusa con uno de los catetos.
afirmaciones_verdaderas:
- En todo triángulo rectángulo el ortocentro coincide exactamente con el vértice del
  ángulo recto.
- La distancia entre el ortocentro y el circuncentro en un triángulo rectángulo es
  igual a la mitad de la hipotenusa.
al_terminar_debes_poder: '**QUÉ:** Identificar y aplicar la ubicación del ortocentro
  en triángulos rectángulos.


  **CÓMO:** Reconociendo que los catetos son alturas y concluyendo que el ortocentro
  coincide con el vértice del ángulo recto ($H = C$).


  ![Resumen de Ortocentro en Rectángulo](/static/img/nodos/ubicacion-del-ortocentro-en-el-vertice-del-angulo-recto-de-un-triangulo-rectangulo-resumen.svg)

  '
