semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.INTERSECCION_SOLUCIONES
resumen_inicial: La solución final de un sistema de inecuaciones es el conjunto intersección
  $S = S_1 \cap S_2$ formado por la zona común de ambos intervalos.
explicacion_simple: 'Una vez que tenemos los dos intervalos individuales (por ejemplo
  $S_1 = ]3, +\infty[$ y $S_2 = ]-\infty, 4]$), buscamos la **zona común** donde se
  cruzan ambos conjuntos.

  Los números que están a la vez en $S_1$ y en $S_2$ son los mayores que $3$ y menores
  o iguales que $4$.

  Por lo tanto, la intersección final es el intervalo $S = ]3, 4]$.'
explicacion_formal: 'Dado el sistema con soluciones individuales $S_1$ y $S_2$, la
  **intersección de conjuntos solución** se formaliza mediante la operación de conjuntos:


  $$S = S_1 \cap S_2 = \{x \in \mathbb{R} \mid x \in S_1 \quad \land \quad x \in S_2\}$$


  **Desglose de la fórmula:**

  - Conector lógico $\land$ (Y simultáneo): Exige pertenencia a ambos intervalos reales.'
definiciones_clave: '- **Intersección de intervalos ($S_1 \cap S_2$)**: Operación
  de conjuntos que extrae la franja de números reales comunes entre $S_1$ y $S_2$.

  - **Simultaneidad lógica ($\land$)**: Condición por la cual un número real debe
  ser elemento de todos los subconjuntos del sistema.'
propiedades_relaciones: '- **Conmutatividad de la intersección**: $S_1 \cap S_2 =
  S_2 \cap S_1$.'
ejemplo_guiado:
  enunciado: Calcula la intersección de los intervalos $S_1 = ]3, +\infty[$ y $S_2
    = ]-\infty, 4]$ para determinar el conjunto solución global $S$.
  pasos:
  - 'Paso 1: Analizar la restricción de $S_1$: $x > 3$ (números mayores que 3).Paso
    2: Analizar la restricción de $S_2$: $x \le 4$ (números menores o iguales a 4).Paso
    3: Unir ambas restricciones en la condición simultánea: $3 < x \le 4$.Paso 4:
    Escribir el intervalo intersección: $S = ]3, 4]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al calcular la intersección entre $S_1 = ]3, +\infty[$ y $S_2 = ]-\infty,
    4]$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = ]3, 4]$
    is_correct: true
  - text: $S = [3, 4[$
    is_correct: false
  - text: $S = ]-\infty, +\infty[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]3, 4]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué conector lógico fundamenta la operación de intersección $S_1 \cap
    S_2$?
  choices:
  - text: La conjunción lógica 'Y' simultánea ($\land$).
    is_correct: true
  - text: La disyunción inclusiva 'O' ($ \lor $).
    is_correct: false
  - text: La negación total.
    is_correct: false
  - text: La implicación condicional.
    is_correct: false
  explanation: La alternativa correcta es 'La conjunción lógica 'Y' simultánea ($\land$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener los intervalos individuales $S_1$ y $S_2$.'
- 'Paso 2: Graficar ambos intervalos en la misma recta numérica.'
- 'Paso 3: Identificar el segmento donde se cruzan o superponen ambos sombreados.'
- 'Paso 4: Escribir el intervalo resultante $S = S_1 \cap S_2$.'
errores_correccion: '- **Error común:** Calcular la UNIÓN de los intervalos en lugar
  de la intersección.

  - **Cómo corregirlo:** Los sistemas de inecuaciones requieren la INTERSECCIÓN (solo
  la zona común donde se cruzan ambos rayados).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de un sistema de inecuaciones requiere calcular la intersección
    de soluciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se exige la simultaneidad de todas las desigualdades.
- titulo: ¿Si dos intervalos no se cruzan en la recta numérica el sistema no tiene
    solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección es vacía ($S = \\emptyset$).
errores_frecuentes:
- Calcular la unión de intervalos en lugar de la intersección al resolver un sistema
  de inecuaciones.
- Intentar sumar o restar las inecuaciones del sistema como si fuera un sistema de
  ecuaciones lineales.
- Creer que basta con que un número cumpla una sola inecuación para ser solución del
  sistema.
- Olvidar invertir el símbolo al despejar coeficientes negativos dentro de alguna
  inecuación individual.
- Inventar un intervalo arbitrario cuando los sombreados de los intervalos van en
  direcciones opuestas sin cruzarse.
afirmaciones_verdaderas:
- La solución final de un sistema de inecuaciones lineales es la intersección de los
  conjuntos solución individuales de cada inecuación.
- Si las regiones de solución de las inecuaciones no tienen puntos comunes en la recta
  numérica, el sistema no tiene solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver sistemas de inecuaciones
  lineales con una incógnita, determinando su conjunto intersección en notación de
  intervalo y gráfica.
