procedimiento:
- Resolver cada inecuación del sistema de forma independiente, despejando la incógnita.
- Expresar el conjunto solución de cada inecuación en forma de intervalo o mediante
  representación gráfica en la recta numérica real.
- Determinar la intersección de todos los intervalos obtenidos, identificando la región
  donde se superponen todos los conjuntos solución.
- Expresar el resultado final como un único intervalo, unión de intervalos, o indicar
  que es el conjunto vacío si no hay superposición.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en determinación de la intersección
  de soluciones.
ejemplos:
- titulo: Sistema con solución acotada
  enunciado: Resuelva el sistema compuesto por las inecuaciones $2x - 4 < 0$ y $x
    + 1 \\geq 0$.
  solucion_pasos:
  - Para la primera inecuación - $2x < 4 \\implies x < 2$. Su solución es $S_1 = ]-\\infty,
    2[$.
  - Para la segunda inecuación - $x \\geq -1$. Su solución es $S_2 = [-1, +\\infty[$.
  - La intersección de ambos conjuntos es $S_1 \\cap S_2 = ]-\\infty, 2[ \\cap [-1,
    +\\infty[ = [-1, 2[$.
  - El conjunto solución del sistema es el intervalo $[-1, 2[$.
- titulo: Sistema sin solución real
  enunciado: Determine el conjunto solución del sistema formado por $3x + 6 \\leq
    0$ y $2x - 2 > 4$.
  solucion_pasos:
  - Resolviendo la primera inecuación - $3x \\leq -6 \\implies x \\leq -2$. Solución
    - $S_1 = ]-\\infty, -2]$.
  - Resolviendo la segunda inecuación - $2x > 6 \\implies x > 3$. Solución - $S_2
    = ]3, +\\infty[$.
  - La intersección es $S_1 \\cap S_2 = ]-\\infty, -2] \\cap ]3, +\\infty[ = \\emptyset$.
  - Como no hay superposición, el sistema no tiene solución real.
- titulo: ¿El número $0$ pertenece al conjunto solución del sistema compuesto por
    $x > -2$ y $x < 1$?
  respuesta: Verdadero
  solucion_pasos:
  - Se evalúa $x = 0$ en la primera inecuación - $0 > -2$, lo cual es verdadero.
  - Se evalúa $x = 0$ en la segunda inecuación - $0 < 1$, lo cual es verdadero.
  - Dado que el valor satisface ambas inecuaciones simultáneamente, pertenece al conjunto
    solución.
- titulo: ¿El conjunto solución del sistema $x > 5$ y $x > 8$ es el intervalo $]5,
    8[$?
  respuesta: Falso
  solucion_pasos:
  - La solución de la primera inecuación es el intervalo $]5, +\\infty[$.
  - La solución de la segunda inecuación es el intervalo $]8, +\\infty[$.
  - La intersección de ambos intervalos es la región donde ambos se superponen, es
    decir, los valores mayores que $8$.
  - Por lo tanto, la solución correcta es el intervalo $]8, +\\infty[$, no $]5, 8[$.
errores_frecuentes:
- Unir los conjuntos solución de cada inecuación en lugar de intersectarlos para encontrar
  la solución del sistema.
- Considerar que si una de las inecuaciones no tiene solución, el sistema aún puede
  tener solución basándose en las demás inecuaciones.
- Incluir los extremos de los intervalos en la solución final del sistema cuando provienen
  de inecuaciones con desigualdades estrictas ($<$ o $>$).
- Asumir que un sistema de dos inecuaciones siempre tendrá como solución un intervalo
  cerrado y acotado.
- Multiplicar o dividir una inecuación por un número negativo sin invertir el sentido
  de la desigualdad, afectando el intervalo a intersectar.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  determinación de la intersección de soluciones.
