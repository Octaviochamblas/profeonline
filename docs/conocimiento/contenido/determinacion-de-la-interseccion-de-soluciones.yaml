semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.INTERSECCION_SOLUCIONES
resumen_inicial: La solución final de un sistema de inecuaciones es el conjunto intersección $S = S_1 \cap S_2$ formado por la zona común de ambos intervalos.
explicacion_simple: '![Determinación de la intersección de soluciones](/static/img/nodos/determinacion-de-la-interseccion-de-soluciones-intro.svg)


  Una vez que tenemos los dos intervalos individuales (por ejemplo $S_1 = ]3, +\infty[$ y $S_2 = ]-\infty, 4]$), buscamos la **zona común** donde se cruzan ambos conjuntos.


  Los números que están a la vez en $S_1$ y en $S_2$ son los mayores que $3$ y menores o iguales que $4$.


  Por lo tanto, la intersección final es el intervalo $S = ]3, 4]$.'
explicacion_formal: 'Dado el sistema con soluciones individuales $S_1$ y $S_2$, la **intersección de conjuntos solución** se formaliza mediante la operación de conjuntos:


  $$S = S_1 \cap S_2 = \{x \in \mathbb{R} \mid x \in S_1 \quad \land \quad x \in S_2\}$$


  **Desglose de la fórmula:**

  - Conector lógico $\land$ (Y simultáneo): Exige pertenencia a ambos intervalos reales.

  '
definiciones_clave: '- **Intersección de intervalos ($S_1 \cap S_2$)**: Operación de conjuntos que extrae la franja de números reales comunes entre $S_1$ y $S_2$.

  - **Simultaneidad lógica ($\land$)**: Condición por la cual un número real debe ser elemento de todos los subconjuntos del sistema.

  '
propiedades_relaciones: '- **Conmutatividad de la intersección**: $S_1 \cap S_2 = S_2 \cap S_1$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Determinación de la intersección de soluciones](/static/img/nodos/determinacion-de-la-interseccion-de-soluciones-ejemplos.svg)


    Calcula la intersección de los intervalos $S_1 = ]3, +\infty[$ y $S_2 = ]-\infty, 4]$ para determinar el conjunto solución global $S$.'
  pasos:
  - 'Paso 1: Analizar la restricción de $S_1$: $x > 3$ (números mayores que 3).'
  - 'Paso 2: Analizar la restricción de $S_2$: $x \le 4$ (números menores o iguales a 4).'
  - 'Paso 3: Unir ambas restricciones en la condición simultánea: $3 < x \le 4$.'
  - 'Paso 4: Escribir el intervalo intersección: $S = ]3, 4]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al calcular la intersección entre $S_1 = ]3, +\infty[$ y $S_2 = ]-\infty, 4]$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = ]3, 4]$
    is_correct: true
  - text: $S = [3, 4[$
    is_correct: false
  - text: $S = ]-\infty, +\infty[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]3, 4]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué conector lógico fundamenta la operación de intersección $S_1 \cap S_2$?
  choices:
  - text: La conjunción lógica "Y" simultánea ($\land$).
    is_correct: true
  - text: La disyunción inclusiva "O" ($\lor$).
    is_correct: false
  - text: La negación total.
    is_correct: false
  - text: La implicación condicional.
    is_correct: false
  explanation: La alternativa correcta es 'La conjunción lógica "Y" simultánea ($\land$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener los intervalos individuales $S_1$ y $S_2$.'
- 'Paso 2: Graficar ambos intervalos en la misma recta numérica.'
- 'Paso 3: Identificar el segmento donde se cruzan o superponen ambos sombreados.'
- 'Paso 4: Escribir el intervalo resultante $S = S_1 \cap S_2$.'
errores_correccion: '- **Error común:** Calcular la UNIÓN de los intervalos en lugar de la intersección.

  - **Cómo corregirlo:** Los sistemas de inecuaciones requieren la INTERSECCIÓN (solo la zona común donde se cruzan ambos rayados).

  '
ejemplos:
- titulo: 'Ejemplo 1: Intersección acotada'
  enunciado: Si $S_1 = ]2, +\infty[$ y $S_2 = ]-\infty, 7]$, ¿cuál es $S_1 \cap S_2$?
  alternativas:
  - $]2, 7]$
  - $[2, 7]$
  - $]2, 7[$
  - $[2, 7[$
  respuesta: $]2, 7]$
  solucion_pasos:
  - 'Paso 1: La zona común va desde $2$ abierto hasta $7$ cerrado.'
  - 'Paso 2: $S = ]2, 7]$.'
- titulo: 'Ejemplo 2: Intersección de semirrectas en el mismo sentido'
  enunciado: Si $S_1 = [1, +\infty[$ y $S_2 = ]3, +\infty[$, ¿cuál es la intersección?
  alternativas:
  - $]3, +\infty[$
  - $[1, +\infty[$
  - $[1, 3]$
  - $]1, 3[$
  respuesta: $]3, +\infty[$
  solucion_pasos:
  - 'Paso 1: La condición más restrictiva es $x > 3$.'
  - 'Paso 2: $S = ]3, +\infty[$.'
- titulo: 'Ejemplo 3: Extremo abierto vs cerrado'
  enunciado: Si $S_1 = ]-\infty, 4[$ y $S_2 = [4, +\infty[$, ¿cuál es $S_1 \cap S_2$?
  alternativas:
  - $\emptyset$
  - $\{4\}$
  - $]-\infty, +\infty[$
  - $[4, 4]$
  respuesta: $\emptyset$
  solucion_pasos:
  - 'Paso 1: $S_1$ no incluye el $4$ y $S_2$ empieza en $4$.'
  - 'Paso 2: No comparten ningún elemento: $S = \emptyset$.'
- titulo: 'Ejemplo 4: Intersección con negativos'
  enunciado: Calcula $S_1 \cap S_2$ para $S_1 = [-5, +\infty[$ y $S_2 = ]-\infty, 0]$.
  alternativas:
  - $[-5, 0]$
  - $]-5, 0[$
  - $[-5, 0[$
  - $]-5, 0]$
  respuesta: $[-5, 0]$
  solucion_pasos:
  - 'Paso 1: Ambos extremos son cerrados: $-5 \le x \le 0$.'
  - 'Paso 2: $S = [-5, 0]$.'
errores_frecuentes:
- La intersección entre los intervalos $S_1 = ]-\infty, 5[$ y $S_2 = [2, +\infty[$ es la unión $]-\infty, +\infty[$.
- Intersecar las soluciones $x > 3$ y $x > 7$ resulta en el intervalo $]3, 7[$.
- La intersección de dos conjuntos solución sin elementos en común devuelve el número cero ($S = \{0\}$).
- Al calcular $S_1 \cap S_2$, si un número pertenece a $S_1$ pero no a $S_2$, ingresa de todas formas al conjunto solución final.
- La intersección del intervalo abierto $]2, 8[$ con el intervalo cerrado $[8, 12]$ es el conjunto singleton $\{8\}$.
afirmaciones_verdaderas:
- La intersección de soluciones $S_1 \cap S_2$ contiene únicamente a los números reales que pertenecen simultáneamente a ambos intervalos.
- Si los intervalos de solución individual no poseen región solapada común, la intersección es el conjunto vacío $S = \emptyset$.
al_terminar_debes_poder: '**QUÉ:** Calcular la intersección de los conjuntos solución individuales.


  **CÓMO:** Identificando la región de números reales que satisface simultáneamente todas las condiciones del sistema ($S = S_1 \cap S_2$).


  ![Resumen Determinación de la intersección de soluciones](/static/img/nodos/determinacion-de-la-interseccion-de-soluciones-resumen.svg)'
