semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.INTERSECCION_SOLUCIONES
resumen_inicial: 'Determinación de la intersección de soluciones: relaciones de orden,
  intervalos y resolución en Sistemas de inecuaciones lineales con una incógnita.'
explicacion_simple: Un sistema de inecuaciones lineales con una incógnita agrupa dos
  o más inecuaciones que deben cumplirse de manera simultánea. La solución del sistema
  corresponde a los valores que satisfacen todas las inecuaciones al mismo tiempo,
  lo que geométricamente representa la intersección de los intervalos solución de
  cada inecuación en la recta real.
explicacion_formal: '### Definición formal

  Sea un sistema de $n$ inecuaciones lineales con una incógnita $x$, cuyos conjuntos
  solución individuales son $S_1, S_2, \dots, S_n$. El conjunto solución del sistema,
  denotado como $S_{total}$, está dado por la intersección de todos los conjuntos
  solución individuales - $S_{total} = S_1 \cap S_2 \cap \dots \cap S_n$. Si la intersección
  es vacía ($S_{total} = \emptyset$), el sistema no tiene solución en los números
  reales.


  ### Desarrollo didáctico

  Para comprender la solución de un sistema de inecuaciones, es fundamental visualizar
  cada inecuación como una condición independiente. Al graficar el conjunto solución
  de cada inecuación en una misma recta numérica, se observan zonas donde los intervalos
  se superponen. Esta región de superposición contiene los valores que cumplen con
  todas las condiciones impuestas simultáneamente. Es posible que los intervalos no
  se superpongan en absoluto; en tal situación, no existe ningún número real que satisfaga
  el sistema completo, concluyendo que el conjunto solución es el conjunto vacío.'
definiciones_clave: '- **Determinación de la intersección de soluciones**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a determinación de la intersección de soluciones.'
ejemplo_guiado:
