semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.ASINTOTA_HORIZONTAL
resumen_inicial: 'La asíntota horizontal de la función exponencial básica es la recta de ecuación $y = 0$ (eje $x$), hacia la cual la curva se aproxima infinitamente sin llegar a tocarla.'
explicacion_simple: |
  Una asíntota es como una línea límite invisible hacia la cual la curva se va pegando cada vez más sin llegar a tocarla ni cruzarla jamás. En la función exponencial básica $f(x) = a \cdot b^x$, esa línea invisible es el propio eje horizontal $x$ (la recta $y = 0$). Si la curva va decreciendo, los valores de $y$ se vuelven números pequeñísimos (como $0.0001$), pero nunca se convierten en cero ni pasan al otro lado.
explicacion_formal: |
  ### Definición formal
  La **asíntota horizontal** de la función exponencial no trasladada $f(x) = a \cdot b^x$ es la recta frontera de ecuación cartesiana:
  $$y = 0 \quad (\text{eje } x)$$
  determinada analíticamente por la existencia de límites al infinito:
  - **Para $b > 1$ (creciente)**: $\lim_{x \to -\infty} a \cdot b^x = 0 \implies$ Asíntota horizontal a la izquierda ($x \to -\infty$).
  - **Para $0 < b < 1$ (decreciente)**: $\lim_{x \to +\infty} a \cdot b^x = 0 \implies$ Asíntota horizontal a la derecha ($x \to +\infty$).

  ### Desglose simbólico
  - Comportamiento asintótico de aproximación: $\forall x \in \mathbb{R}, f(x) \neq 0$, pero $|f(x) - 0| < \varepsilon$ para $|x|$ suficientemente grande.
  - Distancia tendiente a cero: La distancia vertical entre el punto de la curva $(x, f(x))$ y la recta $y = 0$ es $|a \cdot b^x|$, la cual tiende a $0$ cuando $x \to \pm\infty$.

  ### Síntesis didáctica
  Diferenciar asíntota horizontal de asíntota vertical: Las funciones exponenciales **no poseen asíntotas verticales** (su dominio es todo $\mathbb{R}$). Únicamente poseen una asíntota horizontal dada por el eje $x$ ($y = 0$).
definiciones_clave: |
  - **Asíntota horizontal**: Recta de ecuación $y = c$ hacia la que converge el valor de la función al alejarse en el eje $x$.
  - **Comportamiento límite**: Tendencia numérica de las salidas $f(x)$ cuando la variable $x$ tiende a $+\infty$ o a $-\infty$.
  - **Inalcanzabilidad del límite**: Propiedad por la cual la curva jamás toca la recta asíntota en ningún punto finito.
propiedades_relaciones: |
  - **Invariancia por la base $b$ y el coeficiente $a$**: Todas las funciones exponenciales no trasladadas de la forma $a \cdot b^x$ comparten exactamente la misma asíntota horizontal $y = 0$.
  - **Efecto de la traslación vertical**: Si se traslada la función verticalmente a $g(x) = a \cdot b^x + k$, la asíntota horizontal se desplaza paralelamente a la recta $y = k$.
ejemplo_guiado:
  enunciado: 'Identifica la ecuación de la asíntota horizontal y describe el comportamiento asintótico para las funciones $f(x) = 2 \cdot 5^x$ y $g(x) = 4 \cdot (0.2)^x$.'
  pasos:
    - 'Paso 1: Para $f(x) = 2 \cdot 5^x$, la función es no trasladada ($k = 0$). Su asíntota horizontal es la recta $y = 0$.'
    - 'Paso 2: Como $b = 5 > 1$, la curva crece hacia la derecha y se aproxima asintóticamente a $y = 0$ a la izquierda cuando $x \to -\infty$.'
    - 'Paso 3: Para $g(x) = 4 \cdot (0.2)^x$, la función tampoco está trasladada ($k = 0$). Su asíntota horizontal es la recta $y = 0$.'
    - 'Paso 4: Como $b = 0.2 < 1$, la curva decrece hacia la derecha y se aproxima asintóticamente a $y = 0$ a la derecha cuando $x \to +\infty$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación algebraica de la asíntota horizontal de la función exponencial básica $f(x) = -8 \cdot 3^x$?'
    choices:
      - {text: 'La recta horizontal de ecuación $y = 0$', is_correct: true}
      - {text: 'La recta vertical de ecuación $x = 0$', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = -8$', is_correct: false}
      - {text: 'La recta diagonal de ecuación $y = 3x$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal de ecuación $y = 0$''. Toda función exponencial no trasladada posee como asíntota horizontal la recta $y = 0$ (el eje $x$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la función exponencial creciente $f(x) = 2^x$, ¿hacia qué extremo del eje $x$ se aproxima la curva a su asíntota horizontal $y = 0$?'
    choices:
      - {text: 'Hacia el extremo izquierdo de los números negativos ($x \to -\infty$)', is_correct: true}
      - {text: 'Hacia el extremo derecho de los números positivos ($x \to +\infty$)', is_correct: false}
      - {text: 'Hacia el origen de coordenadas ($x = 0$)', is_correct: false}
      - {text: 'Hacia el eje de las ordenadas ($y \to +\infty$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Hacia el extremo izquierdo de los números negativos ($x \to -\infty$)''. Al ser $b = 2 > 1$, la curva disminuye asintóticamente hacia cero a la izquierda.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar si la función exponencial se encuentra en la forma básica no trasladada $f(x) = a \cdot b^x$.'
  - 'Paso 2: Declarar que la asíntota horizontal corresponde a la recta $y = 0$ (el propio eje de las abscisas).'
  - 'Paso 3: Analizar la base $b$: si $b > 1$, la aproximación asintótica ocurre a la izquierda ($x \to -\infty$); si $0 < b < 1$, ocurre a la derecha ($x \to +\infty$).'
errores_correccion: |
  - **Error 1:** Confundir la asíntota horizontal (recta $y = 0$) con la asíntota vertical (recta $x = 0$). **Cómo corregirlo:** La asíntota de la función exponencial es una recta horizontal que limita las alturas $y$. Se escribe $y = 0$ y nunca $x = 0$.
  - **Error 2:** Creer que la gráfica llega a tocar o cruzar la recta asíntota $y = 0$ en algún punto lejano. **Cómo corregirlo:** La propiedad $b^x > 0$ garantiza que $f(x)$ jamás sea cero. La aproximación es infinta pero sin intersección.
ejemplos:
  - titulo: 'Identificación de asíntota básica'
    enunciado: '¿Cuál es la asíntota de $f(x) = (0.5)^x$?'
    alternativas:
      - 'La recta $y = 0$'
      - 'La recta $x = 0$'
      - 'La recta $y = 0.5$'
    respuesta: 'La recta $y = 0$'
    solucion_pasos:
      - '1. Es una función exponencial no trasladada.'
      - '2. Su asíntota horizontal es el eje $x$, de ecuación $y = 0$.'
  - titulo: 'Aproximación en base mayor a 1'
    enunciado: 'En la función $g(x) = 10^x$, ¿qué ocurre con el valor de la función cuando $x = -100$?'
    respuesta: 'Se aproxima a 0'
    solucion_pasos:
      - ' $10^{-100} = \frac{1}{10^{100}} = 0.00\dots 01$, un número extremadamente cercano a 0 pero positivo.'
  - titulo: 'Ausencia de asíntotas verticales'
    enunciado: '¿La función exponencial $f(x) = 3^x$ posee alguna asíntota vertical?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Al estar definida para todo $x \in \mathbb{R}$, no presenta indefinciones ni asíntotas verticales.'
  - titulo: 'Independencia de la escala'
    enunciado: '¿Las funciones $f(x) = 2^x$ y $g(x) = 100 \cdot 2^x$ tienen la misma asíntota horizontal $y = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En ambas la constante de traslación vertical es $k = 0$, por lo que comparten la asíntota $y = 0$.'
errores_frecuentes:
  - 'La asíntota horizontal de la función exponencial $f(x) = 2^x$ es la recta vertical $x = 0$.'
  - 'La curva de la función exponencial $f(x) = 3^x$ cruza su asíntota horizontal cuando $x = -1000$.'
  - 'Una función exponencial con coeficiente $a = 5$ tiene una asíntota horizontal en la recta $y = 5$.'
  - 'Las funciones exponenciales poseen dos asíntotas: una vertical y una horizontal.'
  - 'La asíntota horizontal de la función exponencial $f(x) = (0.2)^x$ no existe porque la base es menor que 1.'
afirmaciones_verdaderas:
