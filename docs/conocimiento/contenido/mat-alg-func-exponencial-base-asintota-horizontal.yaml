semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.ASINTOTA_HORIZONTAL
resumen_inicial: 'Identificación de la asíntota horizontal de la función exponencial
  básica: conceptos, asíntotas, propiedades e inversidad en Conceptos de la función
  exponencial.'
explicacion_simple: A medida que el exponente se hace muy negativo (o muy positivo,
  según la base), la curva exponencial se acerca cada vez más a una recta horizontal,
  sin nunca llegar a tocarla.
explicacion_formal: '### Definición formal


  Una asíntota horizontal es una recta a la que la gráfica de una función se aproxima
  indefinidamente sin tocarla. Para $f(x)=a\cdot b^x$ sin traslación vertical, cuando
  $x\to-\infty$ (si $b>1$) o $x\to+\infty$ (si $0<b<1$), el valor de $f(x)$ se acerca
  a $0$ sin alcanzarlo nunca, por lo que la asíntota horizontal es $y=0$.


  ### Desarrollo didáctico


  Geométricamente, esta asíntota corresponde exactamente al eje $x$ del plano cartesiano,
  en la dirección hacia la cual la curva "se aplana" cada vez más.


  Para $f(x)=2\cdot3^x$ (creciente, pues $b=3>1$): a medida que $x\to-\infty$, $f(x)\to0$,
  aproximándose a la asíntota $y=0$ sin tocarla nunca.'
definiciones_clave: '- **Identificación de la asíntota horizontal de la función exponencial
  básica**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a identificación de la asíntota horizontal de la función exponencial básica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de identificación
    de la asíntota horizontal de la función exponencial básica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de identificación de la asíntota
    horizontal de la función exponencial básica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    identificación de la asíntota horizontal de la función exponencial básica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en conceptos de la
      función exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en conceptos de la función exponencial. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en identificación de la asíntota horizontal de la función exponencial básica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la función exponencial no tenga traslación vertical.'
- 'Paso 2: Concluye que la asíntota horizontal es la recta $y=0$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en identificación
  de la asíntota horizontal de la función exponencial básica.
ejemplos:
- titulo: Identificación de asíntota en función creciente
  enunciado: Identifica la asíntota horizontal de $f(x)=4\cdot5^x$.
  solucion_pasos:
  - No hay traslación vertical.
  - La asíntota horizontal es $y=0$.
- titulo: Identificación de asíntota en función decreciente
  enunciado: Identifica la asíntota horizontal de $f(x)=7\cdot0{,}2^x$.
  solucion_pasos:
  - No hay traslación vertical.
  - La asíntota horizontal es $y=0$.
- titulo: ¿La gráfica de una función exponencial básica toca alguna vez su asíntota
    horizontal?
  enunciado: ¿La gráfica de una función exponencial básica toca alguna vez su asíntota
    horizontal?
  respuesta: 'No'
  solucion_pasos:
  - La curva se aproxima indefinidamente a la asíntota sin tocarla, ya que la función
    nunca alcanza el valor cero.
- titulo: ¿La asíntota horizontal depende del valor de la base $b$?
  enunciado: ¿La asíntota horizontal depende del valor de la base $b$?
  respuesta: 'No'
  solucion_pasos:
  - Sin importar si $b>1$ o $0<b<1$, la asíntota horizontal de la función exponencial
    básica es siempre $y=0$.
errores_frecuentes:
- Declarar la asíntota horizontal con el intercepto con el eje $y$.
- Declarar que la gráfica cruza su asíntota horizontal en algún punto.
- Declarar asíntota horizontal (recta $y=\ldots$) con asíntota vertical (recta $x=\ldots$).
- No reconocer que, sin traslación vertical, la asíntota siempre coincide con el eje
  $x$.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando identificación de la asíntota horizontal de la función exponencial básica.
