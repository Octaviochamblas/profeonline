semantic_id: MAT.NUM.REALES.ORDEN
resumen_inicial: El orden en los números reales se fundamenta en la ley de tricotomía, la compatibilidad con las operaciones algebraicas y técnicas de comparación por elevación al cuadrado.
explicacion_simple: '![Orden en los números reales](/static/img/nodos/orden-de-numeros-reales-intro.svg)


  Dados dos números reales cualesquiera $a$ y $b$, siempre podemos compararlos: o $a$ es menor que $b$, o son iguales, o $a$ es mayor que $b$. Para comparar expresiones con raíces sin usar calculadora, una técnica muy potente es elevar al cuadrado ambos valores positivos; el que tenga mayor cuadrado será el número mayor.'
explicacion_formal: "El cuerpo $\\mathbb{R}$ es un **Cuerpo Totalmente Ordenado** bajo la relación de orden estricto $<$ que satisface los siguientes axiomas fundamentales:\n\n1. **Ley de Tricotomía:** Para todo $a, b \\in \\mathbb{R}$, se cumple una y solo una de las tres proposiciones:\n   $$a < b \\quad \\lor \\quad a = b \\quad \\lor \\quad a > b$$\n2. **Transitividad:** Si $a < b$ y $b < c$, entonces $a < c$.\n3. **Monotonía de la Suma:** $a < b \\implies a + c < b + c$ para todo $c \\in \\mathbb{R}$.\n4. **Monotonía de la Multiplicación:**\n   - Si $c > 0$: $a < b \\implies a \\cdot c < b \\cdot c$.\n   - Si $c < 0$: $a < b \\implies a \\cdot c > b \\cdot c$ (se invierte el sentido de la desigualdad).\n5. **Criterio de Cuadrados para Reales Positivos ($a, b > 0$):**\n   $$a < b \\iff a^2 < b^2 \\iff \\sqrt{a} < \\sqrt{b}$$"
definiciones_clave: '- **Ley de tricotomía**: Principio que asegura que cualquier par de números reales siempre puede compararse unívocamente.

  - **Inversión de desigualdad**: Cambio de sentido de $<$ a $>$ al multiplicar o dividir por un número negativo.

  - **Comparación por cuadrados**: Método algebraico para ordenar expresiones radicales sin calcular decimales.'
propiedades_relaciones: '- **Ingreso bajo el radical**: $k\sqrt{A} = \sqrt{k^2 \cdot A}$ para todo $k > 0$.

  - **Acotamiento estándar de constantes**: $\sqrt{2} \approx 1,41 < \phi \approx 1,62 < \sqrt{3} \approx 1,73 < e \approx 2,72 < \pi \approx 3,14$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de orden en números reales](/static/img/nodos/orden-de-numeros-reales-ejemplos.svg)


    Compare y ordene de menor a mayor los números reales $2\sqrt{3}$, $3\sqrt{2}$ y $\sqrt{17}$.'
  pasos:
  - 'Paso 1: Elevar al cuadrado cada término positivo: $(2\sqrt{3})^2 = 2^2 \cdot 3 = 4 \cdot 3 = 12$.'
  - 'Paso 2: Elevar al cuadrado el segundo término: $(3\sqrt{2})^2 = 3^2 \cdot 2 = 9 \cdot 2 = 18$.'
  - 'Paso 3: Elevar al cuadrado el tercer término: $(\sqrt{17})^2 = 17$.'
  - 'Paso 4: Comparar los cuadrados resultantes: $12 < 17 < 18$.'
  - 'Paso 5: Aplicar la equivalencia de orden: Como $12 < 17 < 18$, se concluye que $2\sqrt{3} < \sqrt{17} < 3\sqrt{2}$.'
  - 'Conclusión: El orden creciente es $2\sqrt{3} < \sqrt{17} < 3\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con el sentido de una desigualdad al multiplicar ambos miembros por un número real negativo?
  choices:
  - text: El sentido de la desigualdad se invierte (de < a >)
    is_correct: true
  - text: El sentido de la desigualdad se mantiene igual
    is_correct: false
  - text: La desigualdad se transforma en igualdad
    is_correct: false
  - text: El resultado siempre es cero
    is_correct: false
  explanation: La alternativa correcta es 'El sentido de la desigualdad se invierte (de < a >)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál de los tres números resultó ser el mayor?
  choices:
  - text: $3\sqrt{2}$ (su cuadrado es 18)
    is_correct: true
  - text: $2\sqrt{3}$ (su cuadrado es 12)
    is_correct: false
  - text: $\sqrt{17}$ (su cuadrado es 17)
    is_correct: false
  - text: Son todos iguales
    is_correct: false
  explanation: La alternativa correcta es '$3\sqrt{2}$ (su cuadrado es 18)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar todos los números a comparar en una forma compatible (fracciones con común denominador, ingresar factores bajo la raíz cuadrada o elevar al cuadrado).'
- 'Paso 2: Si los números son positivos, comparar sus cuadrados: $a < b \iff a^2 < b^2$.'
- 'Paso 3: Si intervienen signos negativos, aplicar la regla de inversión ($a < b \iff -a > -b$) para establecer el orden definitivo.'
errores_correccion: '- **Error 1: Olvidar invertir el signo de desigualdad al multiplicar por negativos.** **Cómo corregirlo:** Si $-2x < 6$, al dividir por $-2$ se DEBE invertir: $x > -3$.

  - **Error 2: Comparar raíces sumando coeficientes (pensar que $2\sqrt{3} > 3\sqrt{2}$ porque $2+3 = 5$).** **Cómo corregirlo:** Usar SIEMPRE el cuadrado: $(2\sqrt{3})^2 = 12$ vs $(3\sqrt{2})^2 = 18 \implies 2\sqrt{3} < 3\sqrt{2}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Cuál número es mayor: $\sqrt{10}$ o $3$?'
  alternativas:
  - $\sqrt{10}$, porque $(\sqrt{10})^2 = 10 > 3^2 = 9$
  - 3, porque es un número entero
  - Son iguales
  respuesta: $\sqrt{10}$, porque $(\sqrt{10})^2 = 10 > 3^2 = 9$
  solucion_pasos:
  - $(\sqrt{10})^2 = 10$ y $3^2 = 9 \implies 10 > 9 \implies \sqrt{10} > 3$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se ordenan de menor a mayor $-\sqrt{5}$ y $-2$?
  alternativas:
  - $-\sqrt{5} < -2$
  - $-2 < -\sqrt{5}$
  - $-\sqrt{5} = -2$
  respuesta: $-\sqrt{5} < -2$
  solucion_pasos:
  - $\sqrt{5} > 2 \implies -\sqrt{5} < -2$ (inversión por signo negativo).
- titulo: ¿Es cierto que entre dos números reales siempre se cumple la ley de tricotomía?
  respuesta: Sí
  solucion_pasos:
  - Sí, dados $a, b \in \mathbb{R}$, exactamente una de las relaciones ($a < b$, $a = b$, $a > b$) es verdadera.
  alternativas:
  - texto: Sí, es un axioma fundamental del orden en R
    es_correcta: true
    retroalimentacion: ¡Correcto! R es un cuerpo totalmente ordenado.
  - texto: No, hay números incomparables
    es_correcta: false
    retroalimentacion: Incorrecto, todos los números reales son comparables entre sí.
  - texto: Solo si son números racionales
    es_correcta: false
    retroalimentacion: Incorrecto, aplica a todo el conjunto $\mathbb{R}$.
- titulo: ¿Es 2 * sqrt(5) mayor que sqrt(20)?
  respuesta: 'No'
  solucion_pasos:
  - No, $2\sqrt{5} = \sqrt{2^2 \cdot 5} = \sqrt{20}$, por lo que son exactamente iguales.
  alternativas:
  - texto: No, son exactamente iguales ($2\sqrt{5} = \sqrt{20}$)
    es_correcta: true
    retroalimentacion: ¡Correcto! $(2\sqrt{5})^2 = 20$ y $(\sqrt{20})^2 = 20$.
  - texto: Sí, $2\sqrt{5}$ es mayor
    es_correcta: false
    retroalimentacion: Incorrecto, el factor 2 ingresa al radicando como $2^2 = 4$.
  - texto: No, $\sqrt{20}$ es mayor
    es_correcta: false
    retroalimentacion: Incorrecto, son expresiones algebraicamente equivalentes.
errores_frecuentes:
- No invertir el sentido de la desigualdad al multiplicar por un factor negativo.
- Comparar solo los números fuera de la raíz sin elevarlos al cuadrado.
- Olvidar que en números negativos, el que tiene mayor valor absoluto es el menor.
- Asumir que $\pi < 3$ o que $e > 3$.
- Intentar ordenar raíces calculando divisiones largas con decimales imprecisos.
afirmaciones_verdaderas:
- Para números reales positivos, el orden se conserva al elevar al cuadrado ($a < b \iff a^2 < b^2$).
- 'La ley de tricotomía establece que todo par de reales satisface exactamente una de las relaciones: $a < b$, $a = b$ o $a > b$.'
- Multiplicar una desigualdad por un número negativo invierte el sentido del signo de orden.
al_terminar_debes_poder: '![Síntesis de orden en números reales](/static/img/nodos/orden-de-numeros-reales-resumen.svg)


  QUÉ: Comparar y ordenar números reales racionales e irracionales.


  CÓMO: Aplicando la ley de tricotomía, utilizando el método algebraico de comparación por cuadrados para radicales positivos ($a < b \iff a^2 < b^2$), e invirtiendo el sentido de orden al operar con factores negativos.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
