guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.02.05'
  title: 'Orden de números reales'
  description: 'Compara y ordena números reales en sus distintas representaciones (fracciones, decimales, radicales) usando propiedades de desigualdad.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'orden-de-numeros-reales'
semantic_id: 'MAT.NUM.REALES.ORDEN'
titulo: 'Orden de números reales'
objetivo: 'Comparar y ordenar números reales en expresiones heterogéneas (combinando fracciones, raíces e irracionales) mediante diversas estrategias de comparación.'
introduccion: 'Para determinar cuál de dos números reales es mayor (por ejemplo, comparar $\sqrt{3}$ con $\frac{7}{4}$ o $\pi$ con $\sqrt{10}$), no siempre basta con mirar a simple vista. Dado que el conjunto de los números reales es un **conjunto totalmente ordenado**, para cualquier par de números reales $a$ y $b$ se cumple exactamente una de las tres relaciones: $a < b$, $a = b$ o $a > b$ (Ley de Tricotomía). Existen diversas estrategias efectivas para compararlos, como elevar al cuadrado o convertir a representaciones decimales comunes.'
resumen: 'El conjunto $\mathbb{R}$ cumple la **Ley de Tricotomía**. Para comparar números reales en forma de radicales $\sqrt{x}$ y $\sqrt{y}$ (positivos), se cumple que $x < y \iff \sqrt{x} < \sqrt{y}$. Para comparar un racional con un radical $\sqrt{x}$ positivo, una estrategia infalible es elevar ambos términos al cuadrado.'
requisitos:
  - 'Comparación y relaciones de orden en números racionales.'
  - 'Propiedades de las desigualdades y elevación al cuadrado de números positivos.'
objetivos:
  - 'Aplicar la relación de orden en $\mathbb{R}$ para comparar expresiones numéricas heterogéneas.'
  - 'Utilizar la técnica de elevación a potencias para comparar raíces cuadradas.'
que_aprenderas:
  - 'La Ley de Tricotomía en los números reales.'
  - 'Estrategias de comparación: elevación al cuadrado, acotación por cuadrados perfectos y expansión decimal.'
  - 'Cómo afecta el signo negativo a la relación de orden en la recta real.'
al_terminar_debes_poder:
  - 'Ordenar un conjunto de números reales mixtos de menor a mayor o de mayor a menor.'
  - 'Demostrar rigurosamente si $a < b$, $a = b$ o $a > b$ para cualquier par de reales.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: 'Si queremos comparar los números reales $A = \sqrt{7}$ y $B = 2{,}6$, ¿cuál es la relación de orden correcta entre ellos?'
    choices:
      - {text: '$A < B$, porque $7$ es menor que $26$.', is_correct: false}
      - {text: '$A > B$, porque $A^2 = 7$ y $B^2 = 6{,}76$, y como $7 > 6{,}76$, resulta $\sqrt{7} > 2{,}6$.', is_correct: true}
      - {text: '$A = B$, porque ambos se aproximan a $2{,}6$.', is_correct: false}
      - {text: 'No se pueden comparar por ser de distinto tipo.', is_correct: false}
    explanation: 'La correcta es: $A > B$, porque $A^2 = 7$ y $B^2 = 6{,}76$, y como $7 > 6{,}76$, resulta $\sqrt{7} > 2{,}6$. Elevar ambos números positivos al cuadrado es un método exacto de comparación.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: 'Al comparar los números reales negativos $X = -\sqrt{5}$ y $Y = -2{,}3$, ¿cuál desigualdad es la correcta?'
    choices:
      - {text: '$X < Y$, porque $-\sqrt{5} \approx -2{,}236$ y $-2{,}236 < -2{,}3$.', is_correct: false}
      - {text: '$X > Y$, porque $-\sqrt{5} \approx -2{,}236$ y en los negativos el número más cercano al cero es el mayor ($-2{,}236 > -2{,}300$).', is_correct: true}
      - {text: '$X = Y$.', is_correct: false}
      - {text: '$X < Y$, porque $5 > 2{,}3$.', is_correct: false}
    explanation: 'La correcta es: $X > Y$, porque $-\sqrt{5} \approx -2{,}236$ y en los negativos el número más cercano al cero es el mayor ($-2{,}236 > -2{,}300$). En la recta numérica, $-2{,}236$ está a la derecha de $-2{,}300$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Asegurarse de considerar los signos de los números a comparar (todo número positivo es mayor que cualquier número negativo).'
  - 'Paso 2: Para comparar números positivos con raíces cuadradas, elevar ambos términos al cuadrado o acotar la raíz entre enteros.'
  - 'Paso 3: Para números negativos, recordar que el número de menor valor absoluto (más cercano a cero) es el mayor.'
errores_frecuentes:
  - 'Olvidar invertir el signo de la desigualdad al comparar números negativos.'
  - 'Asumir que un número con raíz siempre es mayor que un número sin raíz (por ejemplo, pensar que $\sqrt{2} > 2$).'
errores_correccion: |
  Un error clásico es comparar negativos usando la misma intuición que con los positivos. Recuerda que con números negativos, **cuanto mayor es el valor absoluto, menor es el número**. Por ejemplo, como $2{,}5 > 2{,}2$, al aplicar el signo negativo se invierte la relación: $-2{,}5 < -2{,}2$.
ejemplos:
  - titulo: 'Comparación mediante elevación al cuadrado'
    enunciado: 'Compara los números $P = 3\sqrt{2}$ y $Q = 2\sqrt{5}$. ¿Cuál de las siguientes afirmaciones es correcta?'
    alternativas:
      - '$P < Q$, porque $3 < 5$'
      - '$P > Q$, porque $P^2 = 18$ y $Q^2 = 20$, luego $18 < 20$'
      - '$P < Q$, porque $P^2 = 18$ y $Q^2 = 20$, y como $18 < 20$ se tiene $P < Q$'
      - '$P = Q$'
    respuesta: '$P < Q$, porque $P^2 = 18$ y $Q^2 = 20$, y como $18 < 20$ se tiene $P < Q$'
    solucion_pasos:
      - 'Como $P$ y $Q$ son positivos, elevamos ambos al cuadrado:'
      - '$P^2 = (3\sqrt{2})^2 = 3^2 \cdot (\sqrt{2})^2 = 9 \cdot 2 = 18$.'
      - '$Q^2 = (2\sqrt{5})^2 = 2^2 \cdot (\sqrt{5})^2 = 4 \cdot 5 = 20$.'
      - 'Como $18 < 20$, concluimos que $P < Q$ (es decir, $3\sqrt{2} < 2\sqrt{5}$).'
  - titulo: 'Ordenamiento de reales mixtos'
    enunciado: 'Ordena de menor a mayor los siguientes números reales: $a = \sqrt{3}$, $b = \frac{5}{3}$, $c = 1{,}7$.'
    alternativas:
      - '$b < c < a$'
      - '$b < a < c$'
      - '$a < b < c$'
      - '$c < a < b$'
    respuesta: '$b < a < c$'
    solucion_pasos:
      - 'Convertimos a decimales aproximados:'
      - '$b = \frac{5}{3} = 1{,}6666\dots = 1{,}\overline{6}$'
      - '$a = \sqrt{3} \approx 1{,}73205\dots$'
      - '$c = 1{,}7000$'
      - 'Comparando las cifras decimales:'
      - '$1{,}666\dots < 1{,}7000 < 1{,}73205\dots$'
      - 'Por lo tanto: $b < c < a$.'
      - 'Verificando con precisión: $b = 1{,}666\dots$, $c = 1{,}7$, $a \approx 1{,}732$. El orden correcto es $b < c < a$.'
comprobacion_rapida:
  - afirmacion: 'Para dos números reales positivos $a$ y $b$, si $a^2 > b^2$, entonces $a > b$.'
    respuesta: true
    explicacion: 'Correcto. La función $x^2$ es estrictamente creciente para números reales positivos.'
  - afirmacion: 'El número $\pi$ es estrictamente menor que $\sqrt{10}$.'
    respuesta: true
    explicacion: 'Correcto. $\pi^2 \approx 9{,}8696$, mientras que $(\sqrt{10})^2 = 10$. Puesto que $9{,}8696 < 10$, $\pi < \sqrt{10}$.'
  - afirmacion: 'El número $-3$ es mayor que $-\sqrt{7}$.'
    respuesta: false
    explicacion: 'Falso. $-\sqrt{7} \approx -2{,}645$. Como $-3$ está más a la izquierda en la recta real que $-2{,}645$, $-3 < -\sqrt{7}$.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales.'
estado: 'publicado'
