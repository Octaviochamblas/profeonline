semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.TABLA_VALORES
resumen_inicial: 'La tabla de valores es la herramienta numérica que registra pares ordenados $(x, f(x))$ mediante la sustitución de abscisas clave en la función potencia $f(x) = a x^n$.'
explicacion_simple: |
  Para dibujar o comprender exactamente cómo se comporta una función potencia como $f(x) = 2x^3$, construimos una tabla de valores. Elegimos números sencillos para la $x$ (como $-2, -1, 0, 1, 2$), reemplazamos cada número en la fórmula respetando el orden de las operaciones (primero elevamos al exponente y al final multiplicamos por el coeficiente $a$), y anotamos los resultados de $y$. Luego, cada pareja $(x, y)$ se ubica como un punto en el plano cartesiano.
explicacion_formal: |
  ### Definición formal
  La **construcción de una tabla de valores cartesiana** para una función potencia $f(x) = a x^n$ es la tabulación de la relación funcional discreta $T = \{(x_k, f(x_k)) \mid x_k \in \operatorname{Dom}(f)\}$ procesada mediante el operador sintáctico de dos pasos:
  1. **Potenciación**: Calculamos $x_k^n$ respetando la paridad del exponente y el signo de la abscisa.
  2. **Escalamiento**: Multiplicamos por la constante $a$: $y_k = a \cdot (x_k^n)$.

  ### Puntos nodales estratégicos para la tabla
  Para garantizar un bosquejo preciso de la gráfica, la selección de abscisas $x_k$ debe incluir obligatoriamente:
  - **Punto central u Origen ($x = 0$)**: $f(0) = 0$ (para $n > 0$).
  - **Puntos unitarios simétricos ($x = 1$ y $x = -1$)**:
    - En $x = 1 \implies f(1) = a$.
    - En $x = -1 \implies f(-1) = a(-1)^n = a$ (si $n$ es par) o $-a$ (si $n$ es impar).
  - **Puntos de extensión ($x = 2$ y $x = -2$)**: $f(\pm 2) = a(\pm 2)^n$.

  ### Síntesis didáctica
  Orden de operaciones indispensable: Jamás multiplicar $a \cdot x$ antes de elevar a la potencia. La regla Jerárquica indica: primero elevar $x^n$, y el resultado multiplicarlo por $a$.
definiciones_clave: |
  - **Tabla de valores**: Matriz de dos columnas que asocia entradas $x$ con sus salidas $y = f(x)$.
  - **Puntos nodales pivote**: Conjunto $\{(0, 0), (1, a), (-1, f(-1))\}$ que determinan la escala y paridad.
  - **Jerarquía operacional de evaluación**: Regla $a \cdot (x^n)$ donde la potencia antecede al producto.
propiedades_relaciones: |
  - **Detección de paridad en la tabla**: Si $f(-x_k) = f(x_k)$, la tabla confirma simetría respecto al eje $y$. Si $f(-x_k) = -f(x_k)$, la tabla confirma simetría respecto al origen.
  - **Comprobación del parámetro $a$**: La ordenada asociada a la fila $x = 1$ coincide siempre exactamente con el coeficiente $a$.
ejemplo_guiado:
  enunciado: 'Construye la tabla de valores para la función potencia $f(x) = -3x^2$ utilizando el conjunto de entradas $x \in \{-2, -1, 0, 1, 2\}$, indicando los pares ordenados resultantes.'
  pasos:
    - 'Paso 1: Para $x = -2 \implies f(-2) = -3(-2)^2 = -3(4) = -12$. Par: $(-2, -12)$.'
    - 'Paso 2: Para $x = -1 \implies f(-1) = -3(-1)^2 = -3(1) = -3$. Par: $(-1, -3)$.'
    - 'Paso 3: Para $x = 0 \implies f(0) = -3(0)^2 = -3(0) = 0$. Par: $(0, 0)$.'
    - 'Paso 4: Para $x = 1 \implies f(1) = -3(1)^2 = -3(1) = -3$. Par: $(1, -3)$.'
    - 'Paso 5: Para $x = 2 \implies f(2) = -3(2)^2 = -3(4) = -12$. Par: $(2, -12)$.'
    - 'Paso 6: Tabla resultante: $\{(-2, -12), (-1, -3), (0, 0), (1, -3), (2, -12)\}$. Se observa la paridad $f(-x) = f(x)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al construir la tabla de valores para la función potencia $f(x) = -4x^3$, ¿cuál es el par ordenado de salida correcto cuando la variable toma la entrada $x = -2$?'
    choices:
      - {text: 'El par ordenado $(-2, 32)$, porque $f(-2) = -4(-2)^3 = -4(-8) = +32$', is_correct: true}
      - {text: 'El par ordenado $(-2, -32)$, porque el coeficiente es negativo', is_correct: false}
      - {text: 'El par ordenado $(-2, 48)$, multiplicando $-4 \cdot -2 = 8$ y elevando al cubo', is_correct: false}
      - {text: 'El par ordenado $(-2, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El par ordenado $(-2, 32)$, porque $f(-2) = -4(-2)^3 = -4(-8) = +32$''. Primero elevamos $(-2)^3 = -8$ y luego multiplicamos por $-4$, obteniendo $+32$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En cualquier tabla de valores construida para la función potencia $f(x) = a x^n$ con exponente positivo $n > 0$, ¿qué par ordenado aparece de forma invariable en la fila donde $x = 1$?'
    choices:
      - {text: 'El par ordenado $(1, a)$, donde la salida $y$ toma exactamente el valor del coeficiente $a$', is_correct: true}
      - {text: 'El par ordenado $(1, 1)$, independientemente del valor de $a$', is_correct: false}
      - {text: 'El par ordenado $(1, 0)$', is_correct: false}
      - {text: 'El par ordenado $(1, n)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El par ordenado $(1, a)$, donde la salida $y$ toma exactamente el valor del coeficiente $a$''. Al evaluar en $x = 1$, $f(1) = a(1)^n = a$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Seleccionar un conjunto de abscisas representativas $x \in \{-2, -1, 0, 1, 2\}$.'
  - 'Paso 2: Para cada valor de $x$, resolver primero la potencia $x^n$ conservando el signo según la paridad.'
  - 'Paso 3: Multiplicar el resultado de la potencia por el coeficiente $a$.'
  - 'Paso 4: Formar el par ordenado $(x, f(x))$ y verificar las propiedades de simetría esperadas.'
errores_correccion: |
  - **Error 1:** Multiplicar el coeficiente $a$ por la base $x$ antes de elevar a la potencia (ej: en $f(x) = 3x^2$ para $x = 2$, calcular $(3 \cdot 2)^2 = 36$). **Cómo corregirlo:** Se debe elevar primero la potencia: $x^2 = 2^2 = 4$, y luego multiplicar por el coeficiente: $3 \cdot 4 = 12$.
  - **Error 2:** Olvidar el paréntesis al elevar números negativos a exponentes pares (ej: escribir $-2^2 = -4$ en lugar de $(-2)^2 = 4$). **Cómo corregirlo:** La variable $x = -2$ sustituye la base completa, requiriendo paréntesis: $(-2)^2 = +4$.
ejemplos:
  - titulo: 'Evaluación jerárquica correcta'
    enunciado: 'Para $f(x) = 5x^2$, ¿cuál es la salida para $x = -3$?'
    alternativas:
      - '$f(-3) = 45$'
      - '$f(-3) = -45$'
      - '$f(-3) = -225$'
    respuesta: '$f(-3) = 45$'
    solucion_pasos:
      - '1. Elevamos $(-3)^2 = 9$.'
      - '2. Multiplicamos por $a = 5$: $5 \cdot 9 = 45$.'
  - titulo: 'Evaluación en origen'
    enunciado: '¿El par ordenado $(0, 0)$ pertenece a la tabla de $f(x) = -10x^4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(0) = -10(0)^4 = 0$, generando el punto $(0, 0)$.'
  - titulo: 'Fila $x = 1$ de la tabla'
    enunciado: 'En la tabla de $g(x) = -\frac{1}{2}x^3$, ¿para $x = 1$ la salida es $y = -\frac{1}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(1) = -\frac{1}{2}(1)^3 = -\frac{1}{2}$.'
  - titulo: 'Detección de simetría impar en la tabla'
    enunciado: 'Si una tabla contiene a $(-2, -16)$ y a $(2, 16)$, ¿sugiere una función impar?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cumple $f(-2) = -16 = -f(2)$, característico de simetría respecto al origen.'
errores_frecuentes:
  - 'Al evaluar $f(x) = 2x^3$ para $x = -3$, se calcula $(2 \cdot -3)^3 = (-6)^3 = -216$.'
  - 'En la tabla de valores de $f(x) = -x^2$, evaluar $x = -2$ da como resultado $+4$.'
  - 'La fila $x = 1$ de una tabla de valores entrega siempre el número 1 sin importar el coeficiente $a$.'
  - 'Al construir la tabla de una función potencia de exponente negativo, la entrada $x = 0$ entrega $y = 0$.'
  - 'En las potencias de exponente impar, la tabla entrega siempre valores de $y$ positivos.'
afirmaciones_verdaderas:
  - 'La construcción de la tabla de valores exige respetar la jerarquía de operaciones: resolver primero la potencia $x^n$ y luego multiplicar por el coeficiente $a$.'
  - 'La fila correspondiente a $x = 1$ en la tabla de valores explicita directamente el valor del coeficiente $a$ ($f(1) = a$).'
al_terminar_debes_poder: |
  QUÉ: Construir y graficar una tabla de valores para una función potencia $f(x) = a \cdot x^n$.
  CÓMO: Evaluar abscisas seleccionadas en el dominio respetando la jerarquía de operaciones (potenciación antes de multiplicar por $a$).
