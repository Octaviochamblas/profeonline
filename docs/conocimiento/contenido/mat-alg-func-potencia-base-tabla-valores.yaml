semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.TABLA_VALORES
resumen_inicial: 'Construcción de una tabla de valores para una función potencia:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Definición y análisis
  de parámetros.'
explicacion_simple: Antes de identificar propiedades más abstractas, calcular algunos
  valores concretos ayuda a visualizar cómo se comporta la función potencia en la
  práctica.
explicacion_formal: '### Definición formal


  Dada $f(x)=a\cdot x^n$, una tabla de valores es un conjunto de pares ordenados $(x,f(x))$
  obtenidos evaluando la función en una selección representativa de valores de $x$
  dentro de su dominio, típicamente incluyendo valores negativos, positivos, y cero
  cuando pertenece al dominio.


  ### Desarrollo didáctico


  Para $f(x)=2x^2$: $f(-2)=8$, $f(-1)=2$, $f(0)=0$, $f(1)=2$, $f(2)=8$. La tabla revela
  de inmediato la simetría respecto al eje $y$, propia del exponente par, antes de
  siquiera trazar la gráfica.'
definiciones_clave: '- **Construcción de una tabla de valores para una función potencia**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a construcción de una tabla de valores para una función potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de construcción de una tabla de valores para una función potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de construcción de una
    tabla de valores para una función potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar construcción de una tabla de valores para una función potencia?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en definición y análisis de parámetros
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en definición y análisis de parámetros.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en construcción de una tabla de valores para una función potencia?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elige un conjunto de valores representativos de $x$ dentro del dominio
  de la función.'
- 'Paso 2: Evalúa $f(x)=a\cdot x^n$ para cada valor elegido.'
- 'Paso 3: Organiza los pares $(x,f(x))$ en una tabla para identificar patrones.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en construcción de una tabla de valores para una función potencia.
ejemplos:
- titulo: Tabla de valores con exponente impar
  enunciado: Construye una tabla de valores de $f(x)=x^3$ para $x=-2,-1,0,1,2$.
  solucion_pasos:
  - 'Se evalúa: $f(-2)=-8$, $f(-1)=-1$, $f(0)=0$, $f(1)=1$, $f(2)=8$.'
  - La tabla revela que los resultados conservan el signo de $x$, propio del exponente
    impar.
- titulo: Tabla de valores con exponente negativo
  enunciado: Construye una tabla de valores de $f(x)=x^{-1}$ para $x=-2,-1,1,2$ (excluyendo
    $x=0$).
  solucion_pasos:
  - 'Se evalúa: $f(-2)=-0{,}5$, $f(-1)=-1$, $f(1)=1$, $f(2)=0{,}5$.'
  - Se excluye $x=0$ porque no pertenece al dominio de esta función.
- titulo: ¿Se debe incluir $x=0$ en la tabla de valores de $f(x)=x^{-2}$?
  enunciado: ¿Corresponde incluir $x=0$ al construir la tabla de valores de $f(x)=x^{-2}$?
  respuesta: 'No'
  solucion_pasos:
  - $x=0$ no pertenece al dominio de esta función, por lo que no puede incluirse en
    la tabla.
- titulo: ¿Una tabla de valores puede revelar la simetría de una función potencia
    antes de graficarla?
  enunciado: ¿Puede una tabla de valores mostrar patrones de simetría antes de trazar
    la gráfica?
  respuesta: Sí
  solucion_pasos:
  - Comparar los valores de $f(-x)$ y $f(x)$ en la tabla permite anticipar si la función
    es par o impar.
errores_frecuentes:
- Incluir valores de $x$ que no pertenecen al dominio de la función.
- Elegir solo valores positivos, sin considerar cómo se comporta la función con $x$
  negativo.
- No organizar los resultados de forma que se puedan comparar fácilmente para detectar
  simetrías.
- Cometer errores aritméticos al evaluar potencias con exponentes negativos o fraccionarios.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  construcción de una tabla de valores para una función potencia.
