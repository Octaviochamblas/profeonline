procedimiento:
- 'Paso 1: Siempre que veas una fracción, mira su denominador.'
- 'Paso 2: Recuerda la regla: ese denominador jamás puede tomar el valor cero.'
- 'Paso 3: Esta regla prevalece incluso antes de intentar simplificar o resolver cualquier
  cosa.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en reconocimiento de denominador no nulo.
ejemplos:
- titulo: 'Concepto: Si tenemos $\frac{5}{x-3}$, ¿qué pasa si la variable ''x'' vale
    3'
  enunciado: 'Concepto: Si tenemos $\frac{5}{x-3}$, ¿qué pasa si la variable ''x''
    vale 3?'
  solucion_pasos:
  - Si $x = 3$, el denominador sería $3 - 3 = 0$.
  - La fracción se convertiría en $\frac{5}{0}$.
  - Esto es matemáticamente imposible (indefinido).
- titulo: Si el denominador es 'a', ¿qué valor está prohibido para 'a'?
  solucion_pasos:
  - '''a'' no puede ser 0, porque dividiríamos por 0.'
- titulo: 'Respecto de «Reconocimiento de denominador no nulo»: ¿Es correcta esta
    caracterización? «En'
  enunciado: 'Respecto de «Reconocimiento de denominador no nulo»: ¿Es correcta esta
    caracterización? «En cualquier fracción matemática o algebraica, el valor del
    denominador nunca puede ser cero, porque la división por cero no está definida»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En cualquier fracción matemática
    o algebraica, el valor del denominador nunca puede ser cero, porque la división
    por cero no está definida.'
- titulo: 'Respecto de «Reconocimiento de denominador no nulo»: ¿Es válida esta afirmación?
    «Creer que'
  enunciado: 'Respecto de «Reconocimiento de denominador no nulo»: ¿Es válida esta
    afirmación? «Creer que dividir por cero da cero»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En cualquier fracción matemática
    o algebraica, el valor del denominador nunca puede ser cero, porque la división
    por cero no está definida.'
errores_frecuentes:
- Creer que dividir por cero da cero.
- Creer que dividir por cero da infinito en álgebra básica (en cálculo diferencial
  se analiza el límite, pero en álgebra estática está simplemente indefinido).
- Para «En matemáticas, la división por cero:», la respuesta correcta es Es siempre
  cero.
- Para «En matemáticas, la división por cero:», la respuesta correcta es Da como resultado
  1.
- Para «En matemáticas, la división por cero:», la respuesta correcta es Es igual
  al numerador.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando reconocimiento
  de denominador no nulo.
