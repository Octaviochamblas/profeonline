semantic_id: MAT.ALG.FRACCIONES_BASE.DENOMINADOR_NO_NULO
resumen_inicial: 'Reconocimiento de denominador no nulo: concepto, reglas operativas
  y simplificación en Fracciones algebraicas base.'
explicacion_simple: 'En álgebra hay una regla que nunca, bajo ninguna circunstancia,
  se puede romper: la división por cero no existe. Esta prohibición matemática pura
  es la base de todas las restricciones en fracciones algebraicas.'
explicacion_formal: '### Definición formal


  No existe ningún número que multiplicado por cero dé un número distinto de cero.


  ### Desarrollo didáctico


  En el universo de las matemáticas, hay un operación que no está definida: **dividir
  por cero**. Es una operación matemáticamente indefinida (no existe respuesta).


  Dado que una fracción algebraica es una división disfrazada, el denominador (la
  parte de abajo) jamás puede ser igual a cero. Si el denominador llega a valer cero,
  la expresión deja de estar definida.


  Por ejemplo, en la fracción $\frac{x+5}{x-2}$:

  Si la $x$ toma el valor adecuado de $2$, el denominador se vuelve $(2 - 2) = 0$.
  La fracción quedaría $\frac{7}{0}$, lo cual es un absurdo matemático. Por lo tanto,
  debes declarar inmediatamente que para esta fracción, **$x$ no puede ser 2** ($x
  \neq 2$).


  A esto se le llama calcular el ''dominio'' o las ''restricciones'' de la fracción.'
definiciones_clave: '- **Reconocimiento de denominador no nulo**: Procedimiento o
  concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a reconocimiento de denominador no
  nulo.'
ejemplo_guiado:
