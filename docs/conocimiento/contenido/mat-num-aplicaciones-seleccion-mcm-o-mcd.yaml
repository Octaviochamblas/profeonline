semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.SELECCION_MCM_O_MCD
resumen_inicial: La decisión entre m.c.m. o M.C.D. depende de si el problema requiere
  amplificar ciclos futuros (m.c.m.) o fragmentar en partes máximas (M.C.D.).
explicacion_simple: 'Para decidir correctamente si un problema de la vida real se
  resuelve con m.c.m. o con M.C.D., debemos hacernos una pregunta simple: ¿buscamos
  un resultado más grande donde las cantidades se repitan hacia adelante (m.c.m.),
  o buscamos dividir o acortar las cantidades en partes iguales más pequeñas (M.C.D.)?'
explicacion_formal: 'La **Criterio de Selección de Herramienta** analiza la orientación
  del modelo algebraico:


  $$\text{Objetivo} = \begin{cases} \text{Amplificación / Coincidencia periódica }
  \implies \text{Usar } \operatorname{mcm} \ge \max(a_i) \\ \text{Fraccionamiento
  / Reparto máximo común } \implies \text{Usar } \operatorname{MCD} \le \min(a_i)
  \end{cases}$$


  **Desglose de la fórmula:**

  - Si el resultado esperado debe ser mayor o igual que las cantidades originales
  $\implies \operatorname{mcm}$.

  - Si el resultado esperado debe ser menor o igual que las cantidades originales
  $\implies \operatorname{MCD}$.


  > **Complemento didáctico:** Analizar si el resultado del problema debe ser más
  grande que los datos (m.c.m.) o más pequeño que los datos (M.C.D.) es la estrategia
  más infalible.'
definiciones_clave: '- **Criterio de escala**: Regla que compara el resultado buscado
  respecto a la magnitud de los datos de entrada.'
ejemplo_guiado:
  enunciado: 'Analice el problema: ''Un carpintero tiene listones de 120 cm y 180
    cm y desea cortarlos en trozos iguales sin desperdiciar nada y del mayor tamaño
    posible''. Determine si se usa m.c.m. o M.C.D.'
  pasos:
  - 'Paso 1: Analizar la acción requerida: ''cortar en trozos sin desperdiciar''.Paso
    2: Analizar la restricción: ''del mayor tamaño posible''.Paso 3: Evaluar la magnitud
    del resultado: el trozo cortado debe ser MENOR que 120 cm y 180 cm.'
  - 'Conclusión: Se trata de un problema de división máxima, por lo que se debe usar
    el M.C.D.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se decide si un problema exige m.c.m. o M.C.D.?
  choices:
  - text: Usar m.c.m. si se busca una coincidencia/acumulación futura mayor; usar
      M.C.D. si se busca dividir en partes máximas menores
    is_correct: true
  - text: Usar siempre m.c.m. si los números son pares
    is_correct: false
  - text: Usar siempre M.C.D. si hay tres números
    is_correct: false
  - text: Es completamente indistinto usar cualquiera
    is_correct: false
  explanation: La alternativa correcta es 'Usar m.c.m. si se busca una coincidencia/acumulación
    futura mayor; usar M.C.D. si se busca dividir en partes máximas menores'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado del carpintero que corta listones, ¿por qué se eligió
    el M.C.D.?
  choices:
  - text: Porque el problema requiere cortar/dividir en trozos menores del mayor tamaño
      posible
    is_correct: true
  - text: Porque habla de tiempo futuro
    is_correct: false
  - text: Porque sumó las longitudes
    is_correct: false
  - text: Porque los números eran impares
    is_correct: false
  explanation: La alternativa correcta es 'Porque el problema requiere cortar/dividir
    en trozos menores del mayor tamaño posible'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado e identificar la pregunta principal.'
- 'Paso 2: Determinar si se busca repetir/coincidir hacia adelante (m.c.m.) o dividir/repartir
  hacia abajo (M.C.D.).'
- 'Paso 3: Aplicar el algoritmo correspondiente para resolver el problema.'
errores_correccion: '- **Error 1: Guiarse solo por la palabra ''máximo'' para aplicar
  M.C.D. sin entender la acción.** **Cómo corregirlo:** Si pide ''máxima coincidencia
  en tiempo'', se usa m.c.m.; la palabra debe analizarse en el contexto de la acción
  (dividir vs repetir).


  - **Error 2: Aplicar cualquier técnica al azar.** **Cómo corregirlo:** Comparar
  si el resultado esperado es mayor que los datos (m.c.m.) o menor que los datos (M.C.D.).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Si el problema dice: ''¿Cuándo volverán a sonar juntas tres campanas?'',
    ¿qué se calcula?'
  alternativas:
  - El m.c.m.
  - El M.C.D.
  - La promedio de tiempos
  respuesta: El m.c.m.
  solucion_pasos:
  - Coincidencia de repetición periódica $\implies$ m.c.m.
- titulo: Ejemplo 2
  enunciado: 'Si el problema dice: ''¿Cuál es la menor cantidad de baldosas cuadradas
    iguales para cubrir una pared?'', ¿qué se calcula?'
  alternativas:
  - El M.C.D. para el tamaño de baldosa
  - El m.c.m. para el área
  - La resta
  respuesta: El M.C.D. para el tamaño de baldosa
  solucion_pasos:
  - Menor cantidad de baldosas $\implies$ mayor tamaño por baldosa $\implies$ M.C.D.
- titulo: ¿Si el resultado buscado debe ser mayor que los datos originales se debe
    usar el m.c.m.?
  respuesta: Sí
  solucion_pasos:
  - Sí, los múltiplos son de mayor o igual magnitud.
- titulo: ¿Si el resultado buscado es la longitud de un trozo cortado de una barra
    se debe usar el M.C.D.?
  respuesta: Sí
  solucion_pasos:
  - Sí, cortar en partes es una división $\implies$ M.C.D.
errores_frecuentes:
- La presencia de la palabra 'máximo' en el enunciado implica siempre calcular el
  M.C.D. sin importar la acción.
- El m.c.m. produce resultados menores que los datos originales del problema.
- La elección entre m.c.m. o M.C.D. depende únicamente de si los números dados son
  pares o impares.
- Cualquier problema de aplicación en aritmética se puede resolver usando indistintamente
  m.c.m. o M.C.D.
- Dividir varias cantidades en partes iguales exige calcular obligatoriamente el m.c.m.
afirmaciones_verdaderas:
- Se utiliza el m.c.m. cuando el problema involucra coincidencias o repeticiones periódicas
  en el tiempo.
- Se utiliza el M.C.D. cuando el problema involucra cortar, fraccionar o repartir
  en partes iguales de máximo tamaño.
al_terminar_debes_poder: Al terminar serás capaz de decidir de forma justificada si
  un problema requiere m.c.m. o M.C.D., analizando si exige acumular repeticiones
  periódicas o fraccionar en partes máximas.
