semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.PLANTEAMIENTO_INECUACION
resumen_inicial: 'Planteamiento de una inecuación desde un enunciado: relaciones de
  orden, intervalos y resolución en Modelamiento con desigualdades.'
explicacion_simple: En muchas situaciones cotidianas, las restricciones no son igualdades
  exactas, sino límites o condiciones de "al menos", "como máximo", "mayor que" o
  "menor que". El planteamiento de inecuaciones nos permite representar y resolver
  estos escenarios de manera matemática.
explicacion_formal: '### Definición formal

  Una inecuación es una expresión algebraica que relaciona variables y constantes
  mediante los signos de desigualdad $<$, $>$, $\\leq$ o $\\geq$. Modelar una situación
  implica definir una variable $x$ y construir una inecuación de la forma $ax + b
  < c$, u otra equivalente, que represente fielmente las restricciones del problema.


  ### Desarrollo didáctico

  Para plantear una inecuación, es fundamental identificar las palabras clave en el
  enunciado. Expresiones como "como máximo" o "a lo más" se traducen en $\\leq$; "como
  mínimo" o "al menos" corresponden a $\\geq$; "menor que" o "no supera" indican $<$;
  y "mayor que" o "supera" implican $>$. Al definir claramente qué representa la variable,
  se puede estructurar la desigualdad paso a paso.'
definiciones_clave: '- **Planteamiento de una inecuación desde un enunciado**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a planteamiento de una inecuación desde
  un enunciado.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de planteamiento
    de una inecuación desde un enunciado.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de planteamiento de una inecuación desde un
    enunciado, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
