semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.PLANTEAMIENTO_INECUACION
resumen_inicial: Plantear una inecuación desde un enunciado requiere traducir la estructura gramatical a una expresión algebraica de orden.
explicacion_simple: '![Planteamiento de una inecuación desde un enunciado](/static/img/nodos/planteamiento-de-una-inecuacion-desde-un-enunciado-intro.svg)


  Para resolver problemas escritos:

  1. Leemos atentamente y definimos claramente la incógnita $x$.

  2. Expresamos algebraicamente las condiciones del problema a la izquierda y derecha.

  3. Colocamos el operador de inecuación correcto ($<, >, \le, \ge$).

  4. Despejamos $x$ para obtener el rango de respuesta.'
explicacion_formal: 'El **algoritmo de traducción de enunciados verbales a inecuaciones** se define como la función de modelado:


  $$f: \text{Enunciado Verbal} \longrightarrow (P(x) \ R \ Q(x)) \quad \text{con } R \in \{<, >, \le, \ge\}$$


  **Desglose de la fórmula:**

  - $P(x)$: Modelo de ingresos, costos o cantidades combinadas.

  - $Q(x)$: Cota o meta límite impuesta.

  '
definiciones_clave: '- **Modelamiento inecuacional**: Construcción de una inecuación algebraica a partir de una situación verbal contextualizada.

  '
propiedades_relaciones: '- **Fidelidad al contexto**: Garantiza que el conjunto de soluciones respete las condiciones reales del enunciado.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Planteamiento de una inecuación desde un enunciado](/static/img/nodos/planteamiento-de-una-inecuacion-desde-un-enunciado-ejemplos.svg)


    Un plan telefónico cobra un cargo fijo mensual de $\$6.000$ más $\$50$ por cada minuto de llamada $x$. ¿Cuántos minutos se pueden hablar como máximo con un presupuesto mensual de $\$15.000$?'
  pasos:
  - 'Paso 1: Definir la variable: $x = \text{minutos hablados en el mes}$.'
  - 'Paso 2: Formular el costo total: $50x + 6000$.'
  - 'Paso 3: Plantear la inecuación de presupuesto: $50x + 6000 \le 15000$.'
  - 'Paso 4: Despejar $x$: $50x \le 9000 \implies x \le \frac{9000}{50} \implies x \le 180$.'
  - 'Paso 5: Concluir que se pueden hablar como máximo $180$ minutos.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar la inecuación del plan telefónico $50x + 6000 \le 15000$, ¿cuál es el número máximo de minutos hablados?
  choices:
  - text: $180$ minutos
    is_correct: true
  - text: $300$ minutos
    is_correct: false
  - text: $150$ minutos
    is_correct: false
  - text: $900$ minutos
    is_correct: false
  explanation: La alternativa correcta es '$180$ minutos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la inecuación planteada es $50x + 6000 \le 15000$ y no una igualdad exacta?
  choices:
  - text: Porque el presupuesto de $\$15.000$ es un tope máximo y se permite gastar menos.
    is_correct: true
  - text: Porque los minutos de llamada son gratuitos.
    is_correct: false
  - text: Porque la tarifa telefónica cambia cada día.
    is_correct: false
  - text: Porque siempre se debe hablar más de 180 minutos.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el presupuesto de $\$15.000$ es un tope máximo y se permite gastar menos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Declarar la incógnita con sus unidades (ejemplo: $x$ minutos).'
- 'Paso 2: Traducir los costos o consumos variables y fijos.'
- 'Paso 3: Formular la inecuación de restricción.'
- 'Paso 4: Resolver la inecuación y responder en palabras la pregunta del problema.'
errores_correccion: '- **Error común:** Olvidar sumar el cargo fijo al formular la inecuación del costo.

  - **Cómo corregirlo:** Lee atentamente el enunciado: el costo total incluye el cargo fijo MÁS la parte variable.

  '
ejemplos:
- titulo: 'Ejemplo 1: Costo total con cargo fijo'
  enunciado: Un servicio de encomiendas cobra $\$3.000\text{ pesos}$ fijos más $\$500\text{ pesos}$ por kilogramo. Si el cliente dispone de $\$15.000\text{ pesos}$, ¿cuál es la inecuación para los kilogramos $x$?
  alternativas:
  - $3000 + 500x \leq 15000$
  - $3000x + 500 \leq 15000$
  - $3000 + 500x \geq 15000$
  - $500x - 3000 \leq 15000$
  respuesta: $3000 + 500x \leq 15000$
  solucion_pasos:
  - 'Paso 1: Gasto = Cargo fijo ($3000$) + Variable ($500x$).'
  - 'Paso 2: La inecuación es $3000 + 500x \le 15000$.'
- titulo: 'Ejemplo 2: Despeje de unidades'
  enunciado: Al resolver $3000 + 500x \leq 15000$, ¿cuántos kilogramos enteros como máximo puede enviar?
  alternativas:
  - $24\text{ kg}$
  - $25\text{ kg}$
  - $30\text{ kg}$
  - $20\text{ kg}$
  respuesta: $24\text{ kg}$
  solucion_pasos:
  - 'Paso 1: $500x \le 12000$.'
  - 'Paso 2: $x \le \frac{12000}{500} = 24\text{ kg}$.'
- titulo: 'Ejemplo 3: Ganancia mínima requerida'
  enunciado: Fabricar cada producto cuesta $\$4.000\text{ pesos}$ y se vende a $\$7.000\text{ pesos}$. Se pagan $\$60.000\text{ pesos}$ de costos fijos. ¿Qué inecuación asegura una ganancia de al menos $\$90.000\text{ pesos}$?
  alternativas:
  - $3000x - 60000 \geq 90000$
  - $7000x - 60000 \geq 90000$
  - $4000x + 60000 \geq 90000$
  - $3000x + 60000 \leq 90000$
  respuesta: $3000x - 60000 \geq 90000$
  solucion_pasos:
  - 'Paso 1: Margen unitario = $7000 - 4000 = 3000$.'
  - 'Paso 2: Ganancia = $3000x - 60000 \ge 90000$.'
- titulo: 'Ejemplo 4: Unidades mínimas de venta'
  enunciado: Resolviendo $3000x - 60000 \geq 90000$, ¿cuántos productos se deben vender como mínimo?
  alternativas:
  - $50\text{ unidades}$
  - $45\text{ unidades}$
  - $30\text{ unidades}$
  - $60\text{ unidades}$
  respuesta: $50\text{ unidades}$
  solucion_pasos:
  - 'Paso 1: $3000x \ge 150000$.'
  - 'Paso 2: $x \ge \frac{150000}{3000} = 50\text{ unidades}$.'
errores_frecuentes:
- La frase "un número disminuido en 8 es mayor o igual que 15" se plantea como $8 - x \ge 15$.
- Traducir el enunciado "el triple de un número supera a su doble en más de 4" genera la ecuación de igualdad $3x = 2x + 4$.
- La expresión "no supera los 100 dólares" se traduce mediante el operador de desigualdad estricta $> 100$.
- Plantear una inecuación verbal no requiere asignar un símbolo de variable a la cantidad desconocida.
- El orden de las palabras en un enunciado verbal no altera el orden de los términos en la inecuación planteada.
afirmaciones_verdaderas:
- Plantear una inecuación consiste en traducir relaciones verbales de cantidad u orden a expresiones matemáticas estructuradas con variables y operadores.
- Expresiones como "supera a", "es mayor que" se traducen como $>$, mientras que "no excede", "a lo sumo" se traducen como $\le$.
al_terminar_debes_poder: '**QUÉ:** Plantear inecuaciones lineales a partir de enunciados verbales contextualizados.


  **CÓMO:** Definiendo explícitamente la incógnita $x$ y traduciendo expresiones como «como máximo», «a lo sumo» y «al menos» a relaciones de desigualdad algebraicas.


  ![Resumen Planteamiento de una inecuación desde un enunciado](/static/img/nodos/planteamiento-de-una-inecuacion-desde-un-enunciado-resumen.svg)'
