procedimiento:
- Leer comprensivamente el problema e identificar la incógnita principal, asignándole
  una letra (por ejemplo, $x$).
- Identificar las palabras clave que determinan el tipo de desigualdad ($<, >, \\leq,
  \\geq$).
- Relacionar los datos numéricos con la incógnita formando la expresión algebraica
  correspondiente a un lado de la desigualdad.
- Escribir la inecuación completa estableciendo la relación entre la expresión obtenida
  y la restricción dada.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en planteamiento de una inecuación
  desde un enunciado.
ejemplos:
- titulo: Presupuesto para compras
  enunciado: Juan tiene $50000 para comprar cuadernos que cuestan $1500 cada uno y
    una mochila de $20000. ¿Cuál es la inecuación que modela la cantidad máxima de
    cuadernos que puede comprar?
  solucion_pasos:
  - Sea $x$ la cantidad de cuadernos a comprar.
  - El costo de los cuadernos es $1500x$ y el de la mochila $20000$.
  - El costo total es $1500x + 20000$.
  - Como tiene $50000 en total, el costo no puede superar esta cantidad ($\leq$).
  - La inecuación es $1500x + 20000 \leq 50000$.
- titulo: Puntaje para aprobar
  enunciado: En un curso, la nota final se calcula sumando tres pruebas. María tiene
    65 y 70 en las dos primeras. Si necesita al menos 200 puntos en total para aprobar,
    ¿qué inecuación representa la nota que debe obtener en la tercera prueba?
  solucion_pasos:
  - Sea $x$ la nota de la tercera prueba.
  - La suma de las notas es $65 + 70 + x$, es decir, $135 + x$.
  - Necesita 'al menos' 200 puntos, lo que significa $\geq$.
  - La inecuación resultante es $135 + x \geq 200$.
- titulo: Identificación de la desigualdad "al menos"
  respuesta: Verdadero
  solucion_pasos:
  - 'El enunciado dice: Un ascensor soporta al menos 400 kg.'
  - La expresión 'al menos' incluye el 400 y todos los valores mayores.
  - Por lo tanto, se modela con el símbolo $\geq$.
  - La inecuación correcta para el peso $P$ sería $P \geq 400$.
- titulo: Identificación de la desigualdad "no supera"
  respuesta: Falso
  solucion_pasos:
  - 'El enunciado dice: La velocidad de un vehículo no supera los 80 km/h.'
  - La frase 'no supera' significa que puede ser 80 o menos, lo que corresponde a
    $\leq$.
  - Representarlo con $>$ sería incorrecto.
  - La inecuación correcta para la velocidad $v$ es $v \leq 80$.
errores_frecuentes:
- Traducir 'a lo sumo' o 'como máximo' usando el símbolo de mayor que ($>$).
- Confundir las expresiones 'menor que' ($<$) con 'menor o igual a' ($\leq$) al plantear
  el problema.
- Olvidar definir claramente qué representa la variable antes de armar la inecuación.
- Ignorar los valores fijos o constantes en el problema y multiplicar la variable
  por el total.
- Invertir el orden de los términos en una resta, como traducir 'la diferencia entre
  5 y $x$' como $x - 5$.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  planteamiento de una inecuación desde un enunciado.
