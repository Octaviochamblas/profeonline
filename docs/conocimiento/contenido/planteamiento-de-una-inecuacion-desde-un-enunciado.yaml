semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.PLANTEAMIENTO_INECUACION
resumen_inicial: Plantear una inecuación desde un enunciado requiere traducir la estructura
  gramatical a una expresión algebraica de orden.
explicacion_simple: 'Para resolver problemas escritos:

  1. Leemos atentamente y definimos claramente la incógnita $x$.

  2. Expresamos algebraicamente las condiciones del problema a la izquierda y derecha.

  3. Colocamos el operador de inecuación correcto ($<, >, \le, \ge$).

  4. Despejamos $x$ para obtener el rango de respuesta.'
explicacion_formal: 'El **algoritmo de traducción de enunciados verbales a inecuaciones**
  se define como la función de modelado:


  $$f: \text{Enunciado Verbal} \longrightarrow (P(x) \ R \ Q(x)) \quad \text{con }
  R \in \{<, >, \le, \ge\}$$


  **Desglose de la fórmula:**

  - $P(x)$: Modelo de ingresos, costos o cantidades combinadas.

  - $Q(x)$: Cota o meta límite impuesta.'
definiciones_clave: '- **Modelamiento inecuacional**: Construcción de una inecuación
  algebraica a partir de una situación verbal contextualizada.'
propiedades_relaciones: '- **Fidelidad al contexto**: Garantiza que el conjunto de
  soluciones respete las condiciones reales del enunciado.'
ejemplo_guiado:
  enunciado: Un plan telefónico cobra un cargo fijo mensual de $\$6.000$ más $\$50$
    por cada minuto de llamada $x$. ¿Cuántos minutos se pueden hablar como máximo
    con un presupuesto mensual de $\$15.000$?
  pasos:
  - 'Paso 1: Definir la variable: $x = \text{minutos hablados en el mes}$.Paso 2:
    Formular el costo total: $50x + 6000$.Paso 3: Plantear la inecuación de presupuesto:
    $50x + 6000 \le 15000$.Paso 4: Despejar $x$: $50x \le 9000 \implies x \le \frac{9000}{50}
    \implies x \le 180$.Paso 5: Concluir que se pueden hablar como máximo $180$ minutos.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar la inecuación del plan telefónico $50x + 6000 \le 15000$,
    ¿cuál es el número máximo de minutos hablados?
  choices:
  - text: $180$ minutos
    is_correct: true
  - text: $300$ minutos
    is_correct: false
  - text: $150$ minutos
    is_correct: false
  - text: $900$ minutos
    is_correct: false
  explanation: La alternativa correcta es '$180$ minutos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la inecuación planteada es $50x + 6000 \le 15000$ y no una igualdad
    exacta?
  choices:
  - text: Porque el presupuesto de $\$15.000$ es un tope máximo y se permite gastar
      menos.
    is_correct: true
  - text: Porque los minutos de llamada son gratuitos.
    is_correct: false
  - text: Porque la tarifa telefónica cambia cada día.
    is_correct: false
  - text: Porque siempre se debe hablar más de 180 minutos.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el presupuesto de $\$15.000$ es
    un tope máximo y se permite gastar menos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Declarar la incógnita con sus unidades (ejemplo: $x$ minutos).'
- 'Paso 2: Traducir los costos o consumos variables y fijos.'
- 'Paso 3: Formular la inecuación de restricción.'
- 'Paso 4: Resolver la inecuación y responder en palabras la pregunta del problema.'
errores_correccion: '- **Error común:** Olvidar sumar el cargo fijo al formular la
  inecuación del costo.

  - **Cómo corregirlo:** Lee atentamente el enunciado: el costo total incluye el cargo
  fijo MÁS la parte variable.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento con desigualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Frases como 'como máximo' se traducen con la desigualdad no estricta \\le?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'como máximo' fija un límite superior inclusivo ($\\le$).
- titulo: ¿Es necesario descartar soluciones negativas al modelar magnitudes físicas
    reales como masa o personas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el dominio físico impone restricciones de no negatividad ($x \\ge 0$).
errores_frecuentes:
- Usar el signo igual (=) en lugar de una desigualdad al modelar restricciones contextuales
  de límites máximos o mínimos.
- Sumar directamente porcentajes de concentración o aleación en lugar de calcular
  las masas de componente puro.
- Olvidar que la masa o volumen agregado afecta tanto al numerador (fino) como al
  denominador (total) de la mezcla.
- Redondear soluciones discretas en la dirección contraria a la exigida por la inecuación
  de restricción.
- Aceptar soluciones matemáticas negativas en problemas que involucran variables físicas
  reales como tiempo, masa o personas.
afirmaciones_verdaderas:
- Al modelar restricciones de presupuesto o capacidad máxima se deben emplear desigualdades
  del tipo $M(x) \le K$.
- El conjunto solución matemáticamente obtenido debe filtrarse con el dominio físico
  real descartando valores negativos o incompatibles.
al_terminar_debes_poder: Al finalizar este recurso podrás modelar problemas contextuales
  mediante inecuaciones, interpretando y descartando soluciones según la realidad
  física.
