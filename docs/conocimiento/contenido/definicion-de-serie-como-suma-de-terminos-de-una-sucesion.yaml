semantic_id: MAT.NUM.SERIE_GEOMETRICA.CONCEPTO_SERIE
resumen_inicial: 'Definición de serie como suma de términos de una sucesión: concepto y desarrollo
  dentro de Serie geométrica finita e infinita.'
explicacion_simple: En el lenguaje cotidiano, 'sucesión' y 'serie' parecen sinónimos (como
  una 'serie de televisión' con episodios sucesivos). Pero en matemáticas, son dos animales
  completamente distintos. No cometas el error de confundirlos en la prueba.
explicacion_formal: "Visualicemos la diferencia:\n\n- **La Sucesión:** Es como mirar tu cuenta\
  \ corriente mes a mes.\n  - Mes 1: $\\$10.000$\n  - Mes 2: $\\$20.000$\n  - Mes 3: $\\$40.000$\n\
  \  - Sucesión (lista): $10.000, 20.000, 40.000$.\n\n- **La Serie:** Es como meter todo ese\
  \ dinero en una gran alcancía y contar el total.\n  - Total = $10.000 + 20.000 + 40.000\
  \ = $\\$70.000$.\n  - Serie (suma): $70.000$.\n\nCuando veas la palabra 'Serie' en un problema\
  \ de matemáticas, tu cerebro debe encender una alerta de neón que diga: **'¡TENGO QUE SUMAR,\
  \ VOY A USAR LA FÓRMULA DE $S_n$!'**"
definiciones_clave: '- **Definición de serie como suma de términos de una sucesión**: Concepto
  fundamental dentro del estudio de Serie geométrica finita e infinita.'
propiedades_relaciones: '- **Propiedades de Definición de serie como suma de términos de una
  sucesión**: Relaciones de cambio y fórmulas estructurales de serie geométrica finita e infinita.'
ejemplo_guiado:
  enunciado: La sucesión es 3, 6, 12, 24. Indica cuál es el cuarto término de la sucesión
    y cuál es el valor de la serie de esos 4 términos.
  pasos:
  - 'Para el término de la sucesión, busco el cuarto elemento de la lista: es 24.'
  - 'Para la serie, sumo todos los términos: 3 más 6 más 12 más 24.'
  - 'Calculo la suma: 3 más 6 es 9, más 12 es 21, más 24 es igual a 45. El término es 24 y
    la serie es 45.'
