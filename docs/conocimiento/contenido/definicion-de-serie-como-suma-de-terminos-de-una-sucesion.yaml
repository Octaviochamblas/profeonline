  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lee el enunciado. Si te piden encontrar un número específico en una posición, trabajas
  con una SUCESIÓN (fórmula de a_n).'
- 'Paso 2: Si el problema habla de ''acumulado'', ''total'', ''recorrido completo'' o dice
  literalmente ''SERIE'', entonces es una SUMA (fórmula de S_n).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en definición de serie como suma de términos de una sucesión.
ejemplos:
- titulo: Aclarando el vocabulario
  enunciado: La P.G. es 2, 4, 8, 16. ¿Cuál es el valor del 4to término de la sucesión, y cuál
    es el valor de la serie finita de 4 términos?
  solucion_pasos:
  - 'Sucesión: Buscamos el elemento en la posición 4. Miramos la lista: es el 16.'
  - 'Serie: Buscamos la suma de los 4 elementos. 2 + 4 + 8 + 16 = 30.'
- titulo: Ejemplo 1
  enunciado: La sucesión es 5, 10, 20. ¿Cuál es el valor de la serie de estos 3 términos?
  alternativas:
  - '35'
  - '20'
  - '15'
  respuesta: '35'
  solucion_pasos:
  - 5 más 10 más 20 es igual a 35.
- titulo: Ejemplo 2
  enunciado: ¿Cuál palabra en un problema indica que se debe calcular una serie y no solo
    un término?
  alternativas:
  - Total acumulado
  - Posición
  - Razón
  respuesta: Total acumulado
  solucion_pasos:
  - Palabras como 'total', 'acumulado' o 'suma' indican que se pide una serie, no un término
    individual.
- titulo: ¿Una serie es lo mismo que una sucesión?
  respuesta: 'No'
  solucion_pasos:
  - La sucesión es la lista ordenada de términos; la serie es la suma de esos términos.
- titulo: ¿El resultado de una serie finita siempre es un único número?
  respuesta: Sí
  solucion_pasos:
  - Es el resultado de sumar todos los términos considerados, no una lista.
errores_frecuentes:
- Entregar el valor del término $a_n$ cuando el problema pedía calcular 'la serie'.
- Entregar el total acumulado cuando el problema solo pedía 'el valor del término de la sucesión'.
- Responder con la lista completa de números cuando el problema pide el valor de la serie.
- Sumar solo algunos términos y omitir otros al calcular la serie.
- Usar la fórmula de la sucesión (a_n) cuando el problema en realidad pide la suma (S_n).
afirmaciones_verdaderas:
- La formulación de definición de serie como suma de términos de una sucesión mantiene la
  regularidad de la sucesión.
- Una serie siempre es un único número, resultado de sumar todos los términos considerados
  de una sucesión.
al_terminar_debes_poder: Resolver problemas prácticos utilizando definición de serie como
  suma de términos de una sucesión.
