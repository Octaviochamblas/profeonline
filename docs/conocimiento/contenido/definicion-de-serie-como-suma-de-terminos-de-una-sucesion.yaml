  QUÉ: Definir e interpretar una serie numérica distinguiéndola de una sucesión y operando con sumatorias.
  CÓMO: Representar la suma de términos mediante la notación sigma $\sum_{k=1}^n a_k$ y calcular la sucesión de sumas parciales $(S_n)$.
