semantic_id: MAT.NUM.SERIE_GEOMETRICA.CONCEPTO_SERIE
resumen_inicial: 'Una serie es la suma formal de los términos de una sucesión numérica, denotada mediante el operador de sumatoria $\sum_{k=1}^n a_k = a_1 + a_2 + \dots + a_n$.'
explicacion_simple: |
  Es fundamental distinguir entre una **sucesión** y una **serie**:
  - Una **sucesión** es la *lista ordenada de números*: $2, 4, 8, 16, 32, \dots$
  - Una **serie** es el *resultado de sumar los números de esa lista*:
    $$S_5 = 2 + 4 + 8 + 16 + 32 = 62$$
  El símbolo matemático de la suma es la letra griega mayúscula Sigma ($\sum$).
explicacion_formal: |
  ### Definición formal
  Dada una sucesión de números reales $(a_k)_{k \in \mathbb{N}}$, la **serie asociada** es la secuencia de sumas parciales $(S_n)_{n \in \mathbb{N}}$ definida por:
  $$S_n = \sum_{k=1}^n a_k = a_1 + a_2 + a_3 + \dots + a_n$$
  donde:
  - $\sum$: Operador de sumatoria.
  - $k$: Índice de suma o variable muda que varía desde el límite inferior $k=1$ hasta el límite superior $k=n$.
  - $a_k$: Término general de la sucesión subordinada.
  - $S_n$: $n$-ésima suma parcial de la serie.

  ### Distinción estructural
  - **Sucesión**: Conjunto ordenado o mapa $a: \mathbb{N} \to \mathbb{R}$.
  - **Serie Finita**: Escalar $S_n \in \mathbb{R}$ obtenido tras adición finita de $n$ términos.
  - **Serie Infinita**: Objeto analítico $\sum_{k=1}^\infty a_k = \lim_{n \to \infty} S_n$.

  ### Síntesis didáctica
  - Sucesión $\implies$ Lista $\{a_1, a_2, \dots, a_n\}$.
  - Serie $\implies$ Suma $a_1 + a_2 + \dots + a_n = \sum_{k=1}^n a_k$.
definiciones_clave: |
  - **Serie numérica**: Operación de adición aplicada a los elementos de una sucesión.
  - **Operador Sumatoria ($\sum$)**: Notación compacta para expresar la adición consecutiva de términos.
  - **Suma parcial ($S_n$)**: Resultado numérico de sumar los primeros $n$ términos de una sucesión.
propiedades_relaciones: |
  - **Relación funcional $S_n - S_{n-1} = a_n$**: La diferencia entre dos sumas parciales consecutivas devuelve el término $a_n$ en esa posición.
  - **Linearidad del operador $\sum$**: $\sum (c \cdot a_k) = c \cdot \sum a_k$ y $\sum (a_k + b_k) = \sum a_k + \sum b_k$.
ejemplo_guiado:
  enunciado: 'Dada la sucesión $a_k = 2^k$, expresa en notación de sumatoria la serie de los primeros $4$ términos y calcula su suma parcial $S_4$.'
  pasos:
    - 'Paso 1: Identificamos los primeros 4 términos evaluando $k=1, 2, 3, 4$: $a_1 = 2^1 = 2$, $a_2 = 2^2 = 4$, $a_3 = 2^3 = 8$, $a_4 = 2^4 = 16$.'
    - 'Paso 2: Escribimos la serie en notación de sumatoria: $S_4 = \sum_{k=1}^4 2^k$.'
    - 'Paso 3: Expandimos la adición: $S_4 = 2 + 4 + 8 + 16$.'
    - 'Paso 4: Sumamos los valores: $2 + 4 + 8 + 16 = 30$. La suma parcial es **$S_4 = 30$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la diferencia fundamental entre una sucesión numérica $(a_n)$ y una serie numérica $S_n$?'
    choices:
      - {text: 'Una sucesión es la lista ordenada de elementos, mientras que una serie es la suma acumulada de dichos elementos', is_correct: true}
      - {text: 'Una sucesión se multiplica y una serie se resta', is_correct: false}
      - {text: 'Son términos exactamente sinónimos que representan el mismo objeto', is_correct: false}
      - {text: 'Una serie es siempre un número negativo y una sucesión es siempre positiva', is_correct: false}
    explanation: 'La alternativa correcta es ''Una sucesión es la lista ordenada de elementos, mientras que una serie es la suma acumulada de dichos elementos''. Lista vs Suma.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la suma parcial $S_3 = 12$ y la suma parcial $S_4 = 20$, ¿cuál es el valor del cuarto término $a_4$ de la sucesión?'
    choices:
      - {text: '$a_4 = 8$, calculando la resta $S_4 - S_3 = 20 - 12 = 8$', is_correct: true}
      - {text: '$a_4 = 32$, sumando $20 + 12$', is_correct: false}
      - {text: '$a_4 = 5$, dividiendo $20 / 4$', is_correct: false}
      - {text: '$a_4 = 240$, multiplicando $20 \cdot 12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_4 = 8$, calculando la resta $S_4 - S_3 = 20 - 12 = 8$''. Propiedad $S_n - S_{n-1} = a_n$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los términos de la sucesión $a_k$ que se van a adicionar.'
  - 'Paso 2: Escribir la expresión en notación de sumatoria $\sum_{k=1}^n a_k$.'
  - 'Paso 3: Expandir cada uno de los $n$ términos desde $k=1$ hasta $k=n$.'
  - 'Paso 4: Realizar la adición de los términos para hallar el valor escalar de la suma parcial $S_n$.'
errores_correccion: |
  - **Error 1:** Tratar a una serie como si fuera una simple lista ordenada sin efectuar las adiciones. **Cómo corregirlo:** La serie **exige efectuar la SUMA** de los elementos de la sucesión.
  - **Error 2:** Confundir el índice de suma $k$ con el límite superior $n$. **Cómo corregirlo:** La variable $k$ es el **contador móvil** ($1, 2, \dots, n$), mientras que $n$ es el **límite final fijo**.
ejemplos:
  - titulo: 'Sumatoria de números naturales'
    enunciado: '¿La serie $\sum_{k=1}^5 k$ representa la suma $1 + 2 + 3 + 4 + 5 = 15$?'
    alternativas:
      - 'Sí, sustituyendo $k=1, 2, 3, 4, 5$'
      - 'No, da 25'
      - 'No, da 5'
    respuesta: 'Sí, sustituyendo $k=1, 2, 3, 4, 5$'
    solucion_pasos:
      - '1. Expandimos: $1 + 2 + 3 + 4 + 5$.'
      - '2. Sumamos: $15$.'
  - titulo: 'Suma parcial S3 de impares'
    enunciado: 'Para $a_k = 2k - 1$, ¿la suma parcial $S_3 = 1 + 3 + 5 = 9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_1=1, a_2=3, a_3=5 \implies 1+3+5 = 9$.'
  - titulo: 'Cálculo de término mediante restas de sumas'
    enunciado: 'Si $S_5 = 50$ y $S_4 = 35$, ¿el término $a_5 = 50 - 35 = 15$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_5 = S_5 - S_4 = 15$.'
  - titulo: 'Sumatoria de constantes'
    enunciado: '¿La serie $\sum_{k=1}^4 3$ equivale a $3 + 3 + 3 + 3 = 12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $4 \cdot 3 = 12$.'
errores_frecuentes:
  - 'Considerar que la notación de serie representa una lista inerte de números sin operar adición.'
  - 'La resta entre sumas parciales consecutivas $S_n - S_{n-1}$ entrega el promedio de los términos.'
  - 'Sumar únicamente el primer y el último término ignorando los elementos intermedios de la serie.'
  - 'Sustituir el límite superior $n$ dentro de la variable muda $k$ antes de efectuar la expansión.'
  - 'Toda serie finita debe ser calculada evaluando e incorporando individualmente cada uno de sus términos.'
afirmaciones_verdaderas:
  - 'Una serie es la suma parcial o total de los elementos que componen una sucesión numérica.'
  - 'La diferencia entre las sumas parciales consecutivas $S_n - S_{n-1}$ es igual al término $a_n$.'
al_terminar_debes_poder: 'Definir el concepto de serie como la suma de términos de una sucesión y expresarla mediante $\sum_{k=1}^n a_k$.'
