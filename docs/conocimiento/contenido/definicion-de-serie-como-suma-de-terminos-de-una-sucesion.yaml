procedimiento:
- 'Paso 1: Lee el enunciado. Si te piden encontrar un número específico en una posición,
  trabajas con una SUCESIÓN (fórmula de a_n).'
- 'Paso 2: Si el problema habla de ''acumulado'', ''total'', ''recorrido completo''
  o dice literalmente ''SERIE'', entonces es una SUMA (fórmula de S_n).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en definición de serie como suma de términos de una sucesión.
ejemplos:
- titulo: Aclarando el vocabulario
  enunciado: La P.G. es 2, 4, 8, 16. ¿Cuál es el valor del 4to término de la sucesión,
    y cuál es el valor de la serie finita de 4 términos?
  solucion_pasos:
  - 'Sucesión: Buscamos el elemento en la posición 4. Miramos la lista: es el 16.'
  - 'Serie: Buscamos la suma de los 4 elementos. 2 + 4 + 8 + 16 = 30.'
errores_frecuentes:
- Entregar el valor del término $a_n$ cuando el problema pedía calcular 'la serie'.
- Entregar el total acumulado cuando el problema solo pedía 'el valor del término
  de la sucesión'.
afirmaciones_verdaderas:
- La formulación de definición de serie como suma de términos de una sucesión mantiene
  la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando definición de serie
  como suma de términos de una sucesión.
