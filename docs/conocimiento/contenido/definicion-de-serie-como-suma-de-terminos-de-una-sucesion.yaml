semantic_id: MAT.NUM.SERIE_GEOMETRICA.CONCEPTO_SERIE
resumen_inicial: 'Una serie numérica es la suma indicada de los términos de una sucesión $(a_n)$, representada formalmente mediante el operador de sumatoria $\sum_{k=1}^n a_k$ o como el límite de la sucesión de sumas parciales $(S_n)$.'
explicacion_simple: |
  Es muy importante distinguir entre una **sucesión** y una **serie**:
  - Una **sucesión** es una lista ordenada de números separados por comas:
    $$2, 4, 6, 8, 10, \dots$$
  - Una **serie** es la **suma acumulada** de esos números:
    $$2 + 4 + 6 + 8 + 10 + \dots$$
  - Para escribir sumas largas de forma compacta usamos el símbolo griego **sigma** ($\sum$):
    $$S_4 = \sum_{k=1}^4 (2k) = 2(1) + 2(2) + 2(3) + 2(4) = 2 + 4 + 6 + 8 = 20$$
  - Las sumas que vas obteniendo paso a paso ($S_1, S_2, S_3, \dots$) se llaman **sumas parciales**.

  ![Definición de serie numérica](/static/img/nodos/definicion-de-serie-como-suma-de-terminos-de-una-sucesion-intro.svg)
explicacion_formal: |
  ### Definición formal
  Dada una sucesión de números reales $(a_n)_{n \in \mathbb{N}}$, se define la **serie formal** asociada como el par ordenado constituido por la sucesión generadora $(a_n)$ y su **sucesión de sumas parciales** $(S_n)_{n \in \mathbb{N}}$, donde:
  $$S_n = \sum_{k=1}^n a_k = a_1 + a_2 + a_3 + \dots + a_n$$

  ### Componentes de la Notación Sigma ($\sum$)
  $$\sum_{k=m}^n a_k$$
  - **Índice de suma ($k$)**: Variable muda que recorre correlativamente los enteros desde el límite inferior hasta el superior.
  - **Límite inferior ($m$)**: Valor inicial de indexación (habitualmente $m=1$).
  - **Límite superior ($n$)**: Valor final de indexación.
  - **Término general ($a_k$)**: Expresión algebraica que se evalúa en cada paso.

  ### Relación Recurrente entre Serie y Sucesión
  $$S_1 = a_1, \quad S_n = S_{n-1} + a_n \quad (n \ge 2) \iff a_n = S_n - S_{n-1}$$

  ### Síntesis didáctica
  - Concepto: $S_n = \sum_{k=1}^n a_k$.
  - Dinámica: La serie transforma una lista en una acumulación sumatoria.
definiciones_clave: |
  - **Serie numérica**: Suma formal de los elementos de una sucesión.
  - **Suma parcial ($S_n$)**: Resultado obtenido al sumar los primeros $n$ términos de la sucesión.
  - **Notación Sigma ($\sum$)**: Operador matemático que compacta la escritura de adiciones sucesivas.
propiedades_relaciones: |
  - **Linealidad del operador suma**: $\sum_{k=1}^n (c \cdot a_k + b_k) = c \sum_{k=1}^n a_k + \sum_{k=1}^n b_k$.
  - **Descomposición de intervalos**: $\sum_{k=1}^n a_k = \sum_{k=1}^m a_k + \sum_{k=m+1}^n a_k$ para $1 \le m < n$.
ejemplo_guiado:
  enunciado: 'Para la sucesión con término general $a_n = 3n - 1$, calcula las tres primeras sumas parciales $S_1, S_2, S_3$ y expresa $S_4$ utilizando la notación sigma.'
  imagen: '/static/img/nodos/definicion-de-serie-como-suma-de-terminos-de-una-sucesion-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos los primeros términos de la sucesión: $a_1 = 3(1)-1=2, a_2 = 3(2)-1=5, a_3 = 3(3)-1=8, a_4 = 3(4)-1=11$.'
    - 'Paso 2: Primera suma parcial: $S_1 = a_1 = **2$**.'
    - 'Paso 3: Segunda suma parcial: $S_2 = a_1 + a_2 = 2 + 5 = **7$**.'
    - 'Paso 4: Tercera suma parcial: $S_3 = S_2 + a_3 = 7 + 8 = **15$**.'
    - 'Paso 5: En notación sigma, la suma de cuatro términos es: **$S_4 = \sum_{k=1}^4 (3k - 1) = 15 + 11 = 26$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la diferencia fundamental entre una sucesión y una serie en matemáticas?'
    choices:
      - {text: 'La sucesión es una lista ordenada de números $(a_n)$ y la serie es la suma acumulada de esos términos $(\sum a_k)$', is_correct: true}
      - {text: 'La sucesión es una suma y la serie es una multiplicación', is_correct: false}
      - {text: 'Son términos exactamente equivalentes que se pueden intercambiar sin distinción', is_correct: false}
      - {text: 'La serie solo existe para números enteros negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''La sucesión es una lista ordenada de números $(a_n)$ y la serie es la suma acumulada de esos términos $(\sum a_k)$''. La serie es la operación de adición sobre los términos de la sucesión.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si las sumas parciales de una serie son $S_1 = 3, S_2 = 8, S_3 = 15$, ¿cuál es el valor del tercer término de la sucesión $a_3$?'
    choices:
      - {text: '$a_3 = 7$, calculando $S_3 - S_2 = 15 - 8 = 7$', is_correct: true}
      - {text: '$a_3 = 15$, confundiéndolo con la suma acumulada', is_correct: false}
      - {text: '$a_3 = 5$', is_correct: false}
      - {text: '$a_3 = 23$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_3 = 7$, calculando $S_3 - S_2 = 15 - 8 = 7$''. El término individual es la diferencia entre sumas parciales consecutivas: $a_n = S_n - S_{n-1}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la regla de correspondencia de los términos de la sucesión $a_k$.'
  - 'Paso 2: Evaluar correlativamente los términos para los índices requeridos.'
  - 'Paso 3: Calcular las sumas parciales acumulando los valores: $S_n = S_{n-1} + a_n$.'
  - 'Paso 4: Escribir la expresión compacta mediante el operador sumatoria $\sum_{k=1}^n a_k$.'
errores_correccion: |
  - **Error 1:** Confundir el valor del término $a_n$ con la suma acumulada $S_n$. **Cómo corregirlo:** $a_n$ es **un solo número de la lista**, mientras que $S_n$ es la **suma de todos los números desde el primero hasta el $n$**.
  - **Error 2:** Interpretar el símbolo sigma $\sum$ como una multiplicación de factores. **Cómo corregirlo:** $\sum$ representa estrictamente **adición (suma)** de términos.
ejemplos:
  - titulo: 'Cálculo de suma parcial sigma'
    enunciado: '¿Cuál es el valor de $\sum_{k=1}^3 k^2$?'
    alternativas:
      - '$14$'
      - '$9$'
      - '$36$'
    respuesta: '$14$'
    solucion_pasos:
      - '1. $\sum_{k=1}^3 k^2 = 1^2 + 2^2 + 3^2 = 1 + 4 + 9 = 14$.'
  - titulo: 'Obtención de término a partir de sumas'
    enunciado: 'Si $S_4 = 30$ y $S_5 = 45$, ¿cuál es el valor de $a_5$?'
    alternativas:
      - '$15$'
      - '$75$'
      - '$30$'
    respuesta: '$15$'
    solucion_pasos:
      - '1. $a_5 = S_5 - S_4 = 45 - 30 = 15$.'
  - titulo: 'Primera suma parcial'
    enunciado: '¿En toda serie la primera suma parcial $S_1$ es exactamente igual al primer término $a_1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por definición, $S_1 = \sum_{k=1}^1 a_k = a_1$.'
  - titulo: 'Linealidad de la suma'
    enunciado: '¿La expresión $\sum_{k=1}^n (a_k + b_k)$ es igual a $\sum_{k=1}^n a_k + \sum_{k=1}^n b_k$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. La sumatoria cumple la propiedad distributiva de la adición.'
errores_frecuentes:
  - 'El término individual $a_n$ de una sucesión se considera idéntico a la suma parcial $S_n$.'
  - 'El operador sumatoria sigma se interpreta como una multiplicación iterada de términos.'
  - 'El índice de suma en la notación sigma puede saltar valores enteros de forma arbitraria.'
  - 'Al calcular el término $a_n$ a partir de sumas parciales se divide $S_n$ por el número de términos.'
  - 'Una serie finita no puede tener un valor total negativo.'
afirmaciones_verdaderas:
  - 'Una serie numérica es la suma acumulada de los términos de una sucesión: $S_n = \sum_{k=1}^n a_k$.'
  - 'El término individual $a_n$ se recupera a partir de las sumas parciales mediante la resta $a_n = S_n - S_{n-1}$ para todo $n \ge 2$.'
