semantic_id: MAT.ALG.MCM_ALGEBRAICO.CONCEPTO_MCM
resumen_inicial: El concepto de mínimo común múltiplo (m.c.m.) algebraico consiste en identificar la expresión de menor grado
  y coeficientes posibles que es divisible exactamente por dos o más expresiones algebraicas dadas.
explicacion_simple: "El **mínimo común múltiplo (m.c.m.) algebraico** entre varias expresiones (monomios o polinomios) es\
  \ la expresión algebraicamente **más pequeña** que puede ser dividida exactamente por cada una de ellas:\n- **REGLA DE ORO\
  \ DEL m.c.m. ALGEBRAICO**:\n  1. **Factores comunes y NO comunes**: El m.c.m. incluye **TODOS** los elementos numéricos\
  \ y algebraicos que aparezcan en cualquiera de las expresiones. (No requiere que estén en todas).\n  2. **El MAYOR exponente**:\
  \ De los factores que se repitan, el m.c.m. elige la potencia de **mayor exponente**.\n- **Ejemplo entre monomios ($4x^3$\
  \ y $6x^2y$)**:\n  - m.c.m. numérico de $4$ y $6$: **$12$**.\n  - Letra $x$: común en ambos, mayor exponente $\\implies\
  \ \\mathbf{x^3}$.\n  - Letra $y$: sólo en el segundo, ¡se incluye igual! $\\implies \\mathbf{y^1}$.\n  - **m.c.m. final**:\
  \ $\\mathbf{12x^3y}$.\n\n![Concepto de m.c.m. algebraico](/static/img/nodos/concepto-de-mcm-algebraico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea un conjunto de polinomios $P_1(x), P_2(x), \dots, P_k(x) \in \mathbb{K}[x]$ sobre un cuerpo $\mathbb{K}$. Un polinomio
  $M(x) \in \mathbb{K}[x]$ es el **mínimo común múltiplo (m.c.m.)** de dichos polinomios, denotado $M(x) = \operatorname{mcm}(P_1,
  P_2, \dots, P_k)$, si cumple las propiedades fundamentales de múltiplo común:


  1. **Múltiplo común**: $P_i(x) \mid M(x)$ para todo $i \in \{1, 2, \dots, k\}$ ($M(x)$ es divisible por cada polinomio original).

  2. **Mínima multiplicidad**: Si existe otro polinomio $S(x) \in \mathbb{K}[x]$ tal que $P_i(x) \mid S(x)$ para todo $i$,
  entonces $M(x) \mid S(x)$, garantizando que $\operatorname{grado}(M) \le \operatorname{grado}(S)$.


  ### Relación Fundamental con el M.C.D.

  Para dos polinomios $P(x)$ y $Q(x)$, el producto de su M.C.D. y su m.c.m. es idéntico al producto de los polinomios (salvo
  constante):


  $$\operatorname{mcm}(P, Q) \cdot \operatorname{MCD}(P, Q) = P(x) \cdot Q(x)$$


  ### Síntesis didáctica

  El m.c.m. algebraico es el polinomio divisible por todos los demás de menor grado posible formado por el producto de factores
  comunes y no comunes elevados a su mayor exponente.

  '
definiciones_clave: '- **m.c.m. algebraico**: Expresión de mínimo grado divisible exactamente por cada uno de los polinomios
  dados.

  - **Múltiplo común**: Expresión cuadrática o polinomial que contiene a los factores de todas las expresiones evaluadas.

  - **Factores comunes y no comunes de mayor exponente**: Todos los bloques de factores presentes en la descomposición tomados
  con su mayor exponente.

  '
propiedades_relaciones: '- **Denominador común mínimo**: El m.c.m. de los denominadores es el Mínimo Común Denominador necesario
  para efectuar sumas y restas de fracciones algebraicas.

  '
ejemplo_guiado:
  enunciado: Determina el m.c.m. entre las expresiones factorizadas $P(x) = (x - 1)^2(x + 3)$ y $Q(x) = (x - 1)(x + 3)^3(x
    + 7)$.
  pasos:
  - 'Paso 1: Identificamos todos los factores presentes en ambas expresiones: $(x - 1)$, $(x + 3)$ y $(x + 7)$.'
  - 'Paso 2: Incluimos todos los factores (comunes y no comunes): - $(x - 1)$ es común. - $(x + 3)$ es común. - $(x + 7)$
    no es común, **pero se incluye obligatoriamente**.'
  - 'Paso 3: Asignamos a cada factor su **mayor exponente**: - Para $(x - 1)$: Comparamos $2$ y $1 \implies$ mayor exponente
    es **$2$**. - Para $(x + 3)$: Comparamos $1$ y $3 \implies$ mayor exponente es **$3$**. - Para $(x + 7)$: Exponente único
    es **$1$**.'
  - 'Paso 4: Multiplicamos todos los factores seleccionados: $(x - 1)^2(x + 3)^3(x + 7)$.'
  - 'Conclusión: El m.c.m. algebraico es **$(x - 1)^2(x + 3)^3(x + 7)$**.'
  imagen: /static/img/nodos/concepto-de-mcm-algebraico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué diferencia principal existe entre la regla para construir el M.C.D. y el m.c.m. algebraico respecto a los
    factores y sus exponentes?
  choices:
  - text: El M.C.D. toma sólo factores comunes de menor exponente, mientras que el m.c.m. toma todos los factores (comunes
      y no comunes) de mayor exponente
    is_correct: true
  - text: El M.C.D. toma los factores no comunes y el m.c.m. sólo los comunes
    is_correct: false
  - text: Ambos toman exactamente los mismos factores
    is_correct: false
  - text: El m.c.m. sólo usa números y el M.C.D. sólo letras
    is_correct: false
  explanation: La alternativa correcta es 'El M.C.D. toma sólo factores comunes de menor exponente, mientras que el m.c.m.
    toma todos los factores (comunes y no comunes) de mayor exponente'. Diferencia conceptual M.C.D. vs m.c.m.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para dos polinomios $A(x)$ y $B(x)$, si su $\operatorname{MCD}(A, B) = (x - 2)$ y su producto es $A(x) \cdot B(x)
    = (x - 2)^3(x + 4)$, ¿cuál es su $\operatorname{mcm}(A, B)$?
  choices:
  - text: Su m.c.m. es $(x - 2)^2(x + 4)$, dividiendo el producto entre el M.C.D.
    is_correct: true
  - text: Su m.c.m. es $(x - 2)^4(x + 4)$
    is_correct: false
  - text: Su m.c.m. es $(x + 4)$
    is_correct: false
  - text: Su m.c.m. es $(x - 2)$
    is_correct: false
  explanation: 'La alternativa correcta es ''Su m.c.m. es $(x - 2)^2(x + 4)$, dividiendo el producto entre el M.C.D.''. Relación
    fundamental: $\operatorname{mcm} = \frac{A \cdot B}{\operatorname{MCD}} = \frac{(x-2)^3(x+4)}{(x-2)} = (x-2)^2(x+4)$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar por completo cada uno de los polinomios o expresiones algebraicas.'
- 'Paso 2: Hacer una lista con todos los factores que aparezcan en al menos una de las expresiones.'
- 'Paso 3: Seleccionar para cada factor el exponente más alto con el que figure en las descomposiciones.'
- 'Paso 4: Multiplicar todos los factores seleccionados para construir el m.c.m. algebraico.'
errores_correccion: '- **Error 1:** Excluir los factores no comunes al construir el m.c.m. **Cómo corregirlo:** El m.c.m.
  **DEBE INCLUIR TODOS LOS FACTORES, SEAN COMUNES O NO COMUNES**.

  - **Error 2:** Seleccionar el menor exponente en lugar del mayor exponente. **Cómo corregirlo:** Para el m.c.m. **SE ELIGE
  OBLIGATORIAMENTE LA POTENCIA DE MAYOR EXPONENTE (el menor exponente es para el M.C.D.)**.

  '
ejemplos:
- titulo: Factores no comunes incluidos
  enunciado: Para $x^2$ y $y^3$, ¿es su m.c.m. igual a $x^2y^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, se incluyen ambos factores.
- titulo: Mayor exponente
  enunciado: Entre $a^3$ y $a^5$, ¿es el m.c.m. $a^5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el mayor exponente es 5.
- titulo: Constante y variable
  enunciado: Para $2x$ y $3y$, ¿es el m.c.m. $6xy$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{mcm}(2,3)=6$ y letras $xy$.
- titulo: Producto por M.C.D.
  enunciado: ¿Cumple la relación $\operatorname{mcm} \cdot \operatorname{MCD} = P \cdot Q$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad fundamental.
errores_frecuentes:
- Excluir factores no comunes de la expresión del m.c.m.
- Seleccionar el menor exponente de los factores compartidos en lugar del mayor exponente.
- Intercambiar la regla del m.c.m. con la del M.C.D.
- Los factores constantes numéricos no son incluidos en el m.c.m.
- Olvidar que $\operatorname{mcm}(P, Q) \cdot \operatorname{MCD}(P, Q) = P(x) \cdot Q(x)$.
afirmaciones_verdaderas:
- El m.c.m. algebraico está formado por el producto de todos los factores comunes y no comunes de mayor exponente.
- El producto de dos expresiones algebraicas es igual al producto de su M.C.D. por su m.c.m.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/concepto-de-mcm-algebraico-resumen.svg)


  QUÉ: Comprender el concepto de m.c.m. algebraico y construir expresiones múltiplos comunes de menor grado.

  CÓMO: Verificar que $P_i(x) \mid M(x)$ e integrar todos los factores comunes y no comunes elevados a su máxima potencia
  ($\prod [F_{\text{todos}}]^{\max(e_i)}$).

  '
