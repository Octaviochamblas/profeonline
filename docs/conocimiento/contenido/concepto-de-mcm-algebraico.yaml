semantic_id: MAT.ALG.MCM_ALGEBRAICO.CONCEPTO_MCM
resumen_inicial: El Mínimo Común Múltiplo (m.c.m.) algebraico de dos o más expresiones
  es la expresión de menor grado y menor coeficiente que es divisible exactamente
  por cada una de ellas.
explicacion_simple: 'El Mínimo Común Múltiplo algebraico es la expresión más pequeña
  posible que contiene exactamente a todas las expresiones dadas dentro de sí.

  A diferencia del M.C.D. (donde buscamos divisores comunes de menor exponente), en
  el m.c.m. recopilamos todos los factores presentes (comunes y no comunes) tomando
  siempre el mayor exponente con el que figuran.

  Esto nos asegura que cada una de las expresiones originales pueda dividir al m.c.m.
  sin dejar residuos ni variables en el denominador.'
explicacion_formal: 'El **m.c.m. Algebraico** de un conjunto de polinomios o monomios
  $\{P_1(x), P_2(x), \dots, P_k(x)\}$ se define formalmente como la expresión mónica
  de menor grado $M(x)$ que satisface:


  $$\text{m.c.m.}(P_1, P_2, \dots, P_k) = M(x) \quad \text{tal que} \quad P_i(x) \mid
  M(x) \quad \forall i \in \{1, 2, \dots, k\}$$


  **Desglose de la fórmula:**

  - $M(x)$: Representa la expresión común múltiplo de menor grado posible y coeficiente
  principal positivo.

  - $P_i(x) \mid M(x)$: Simboliza que cada expresión $P_i(x)$ divide exactamente a
  $M(x)$, de modo que la división $\frac{M(x)}{P_i(x)}$ es un polinomio o término
  entero.

  - $\forall i \in \{1, 2, \dots, k\}$: Exige que la condición de múltiplo se cumpla
  para todas las expresiones del conjunto simultáneamente.


  > **Complemento didáctico:** El m.c.m. contiene el producto de todos los factores
  primos numéricos y literales únicos presentes en el grupo, cada uno elevado a su
  máxima potencia registrada.'
definiciones_clave: '- **Mínimo Común Múltiplo (m.c.m.)**: Expresión de menor grado
  y coeficiente que es dividida exactamente por un conjunto de expresiones algebraicas.

  - **Múltiplo algebraico**: Expresión formada al multiplicar una expresión dada por
  otra expresión entera.'
propiedades_relaciones: '- **Relación con el M.C.D.**: Para dos expresiones $A$ y
  $B$, se cumple que $A \cdot B = \text{M.C.D.}(A,B) \cdot \text{m.c.m.}(A,B)$.

  - **Mayor potencia**: En el m.c.m. se seleccionan siempre las mayores potencias
  de los factores comunes y no comunes.'
ejemplo_guiado:
  enunciado: Dos sensores emiten señales cíclicas con periodos representados por $6x^2y$
    y $8xy^3$ segundos. Determina el m.c.m. algebraico entre ambos periodos y evalúa
    su valor numérico para $x = 2$ e $y = 3$.
  pasos:
  - 'Paso 1: Calcular el m.c.m. numérico entre $6$ y $8$. Como $6 = 2 \cdot 3$ y $8
    = 2^3$, tomamos $2^3 \cdot 3 = 24$. El m.c.m. numérico es $24$.'
  - 'Paso 2: Determinar todas las variables presentes con sus mayores exponentes.
    Para $x$, la mayor potencia es $x^2$; para $y$, la mayor potencia es $y^3$. La
    parte literal del m.c.m. es $x^2y^3$.'
  - 'Paso 3: Unir coeficiente y parte literal: el m.c.m. algebraico es $24x^2y^3$.'
  - 'Paso 4: Sustituir $x = 2$ e $y = 3$: $24 \cdot (2)^2 \cdot (3)^3 = 24 \cdot 4
    \cdot 27 = 2592\text{ segundos}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición fundamental define al m.c.m. de un conjunto de expresiones
    algebraicas?
  choices:
  - text: Es la expresión de menor grado que es dividida exactamente por cada una
      de las expresiones del conjunto.
    is_correct: true
  - text: Es la expresión de mayor grado que divide a todas las expresiones del conjunto.
    is_correct: false
  - text: Es la resta de las variables de menor exponente de cada término.
    is_correct: false
  - text: Es el producto de los coeficientes dividido por el número de términos.
    is_correct: false
  explanation: La alternativa correcta es 'Es la expresión de menor grado que es dividida
    exactamente por cada una de las expresiones del conjunto.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el m.c.m. de dos expresiones resulta ser $24x^2y^3$, ¿cuál es su valor
    numérico cuando $x = 2$ e $y = 3$?
  choices:
  - text: $2592$
    is_correct: true
  - text: $1296$
    is_correct: false
  - text: $648$
    is_correct: false
  - text: $5184$
    is_correct: false
  explanation: La alternativa correcta es '$2592$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer los coeficientes numéricos y las partes literales o polinomios
  en factores primos e irreductibles.'
- 'Paso 2: Listar todos los factores presentes en al menos una de las expresiones
  (factores comunes y no comunes).'
- 'Paso 3: Asignar a cada factor la mayor potencia con la que figura en las expresiones
  dadas.'
- 'Paso 4: Multiplicar todos los factores elevados a sus mayores potencias para obtener
  el m.c.m. final.'
errores_correccion: '- **Error común:** Confundir el m.c.m. con el M.C.D. seleccionando
  las menores potencias o descartando los factores no comunes.

  - **Cómo corregirlo:** En el m.c.m. debes INCLUIR TODOS los factores que aparezcan
  en cualquier término, elevados a su MAYOR exponente.'
ejemplos:
- titulo: 'Ejemplo 1: Concepto con monomios simples'
  enunciado: ¿Cuál es el m.c.m. entre $4a^2b$ y $6ab^3$?
  alternativas:
  - $12a^2b^3$
  - $2ab$
  - $24a^3b^4$
  respuesta: $12a^2b^3$
  solucion_pasos:
  - '1. m.c.m. numérico entre $4$ y $6$: $12$.'
  - '2. Mayores potencias de variables: $a^2$ y $b^3$.'
  - 3. El m.c.m. resultante es $12a^2b^3$.
- titulo: 'Ejemplo 2: Inclusión de variables no comunes'
  enunciado: Entre $5x^3$ y $10y^2$, ¿por qué ambas variables $x^3$ e $y^2$ deben
    figurar en el m.c.m.?
  alternativas:
  - Porque el m.c.m. debe incluir todas las variables presentes elevadas a su mayor
    exponente.
  - Porque $x$ e $y$ son variables equivalentes.
  - Porque las variables se multiplican sumando sus exponentes.
  respuesta: Porque el m.c.m. debe incluir todas las variables presentes elevadas
    a su mayor exponente.
  solucion_pasos:
  - 1. Para ser múltiplo de $5x^3$, la expresión debe contener $x^3$.
  - 2. Para ser múltiplo de $10y^2$, debe contener $y^2$. Por tanto, el m.c.m. es
    $10x^3y^2$.
- titulo: ¿Es cierto que para dos monomios $A$ y $B$, el producto $A \cdot B$ equivale
    a $\text{M.C.D.}(A,B) \cdot \text{m.c.m.}(A,B)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad fundamental de la divisibilidad algebraica de monomios y
    polinomios.
- titulo: ¿El m.c.m. algebraico siempre tiene un grado mayor o igual que cualquiera
    de las expresiones originales?
  respuesta: Sí
  solucion_pasos:
  - Sí. Al contener a todas las expresiones como factores, el grado del m.c.m. jamás
    puede ser menor al de las expresiones que lo componen.
errores_frecuentes:
- El m.c.m. de $x^3$ y $x^5$ es $x^3$ porque es la potencia menor.
- Las variables no comunes deben ser descartadas al calcular el m.c.m. algebraico.
- El m.c.m. de $4x$ y $6x$ es $24x^2$.
- El m.c.m. de dos polinomios se obtiene dividiendo sus grados.
- Si dos expresiones no comparten variables, su m.c.m. es igual a $1$.
afirmaciones_verdaderas:
- El m.c.m. algebraico incluye todos los factores primos comunes y no comunes elevados
  a sus mayores exponentes.
- Cada una de las expresiones algebraicas originales divide exactamente a su m.c.m.
al_terminar_debes_poder: Al finalizar este recurso podrás definir el concepto de m.c.m.
  algebraico e identificar las reglas para construir múltiplos comunes de menor grado.
