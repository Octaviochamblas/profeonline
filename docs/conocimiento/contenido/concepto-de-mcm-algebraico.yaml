procedimiento:
- 'Paso 1: El MCM debe actuar como un contenedor que incluye la totalidad de las expresiones
  dadas.'
- 'Paso 2: La regla fundamental es juntar TODO tipo de letra o factor que aparezca
  en cualquier lugar.'
- 'Paso 3: Si un factor se repite, se debe elegir aquel que tenga el MAYOR exponente.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en concepto de m.c.m. algebraico.
ejemplos:
- titulo: Conceptualmente, ¿cuál es el MCM de $(x+1)$ y $(x-2)$
  enunciado: Conceptualmente, ¿cuál es el MCM de $(x+1)$ y $(x-2)$?
  solucion_pasos:
  - Son dos bloques distintos, sin nada en común.
  - El MCM debe contenerlos a ambos.
  - 'Por lo tanto, se multiplican: el MCM es $(x+1)(x-2)$.'
- titulo: ¿Cuál es el MCM de $x$ y $x^2$?
  solucion_pasos:
  - Buscamos el mayor exponente de la variable en común, para asegurarnos de que la
    otra quepa dentro. $x^2$ alberga a $x$ y a $x^2$.
- titulo: 'Respecto de «Concepto de m.c.m. algebraico»: ¿Es correcta esta caracterización?
    «El Mínimo C'
  enunciado: 'Respecto de «Concepto de m.c.m. algebraico»: ¿Es correcta esta caracterización?
    «El Mínimo Común Múltiplo (MCM) de varias expresiones algebraicas es la expresión
    de menor grado y coeficiente que las contiene a todas como factores»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El Mínimo Común Múltiplo (MCM)
    de varias expresiones algebraicas es la expresión de menor grado y coeficiente
    que las contiene a todas como factores.'
- titulo: 'Respecto de «Concepto de m.c.m. algebraico»: ¿Es válida esta afirmación?
    «Confundir MCM con'
  enunciado: 'Respecto de «Concepto de m.c.m. algebraico»: ¿Es válida esta afirmación?
    «Confundir MCM con MCD (elegir solo lo común, o el exponente menor)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El Mínimo Común Múltiplo (MCM)
    de varias expresiones algebraicas es la expresión de menor grado y coeficiente
    que las contiene a todas como factores.'
errores_frecuentes:
- Confundir MCM con MCD (elegir solo lo común, o el exponente menor).
- Olvidarse de incluir letras o paréntesis que no son comunes. ¡El MCM no perdona
  exclusiones, debe llevarlo todo!
- El divisor más grande.
- Para «En álgebra, ¿qué representa el MCM de dos polinomios», la respuesta correcta
  es La resta de los polinomios.
- Para «En álgebra, ¿qué representa el MCM de dos polinomios», la respuesta correcta
  es El mayor polinomio posible.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando concepto
  de m.c.m. algebraico.
