semantic_id: MAT.GEO.NOTABLES_COINCIDENCIA.EQUILATERO_RECTAS_NOTABLES
resumen_inicial: 'Coincidencia de alturas, bisectrices, simetrales y transversales
  de gravedad en un triángulo equilátero: conceptos, teoremas, propiedades geométricas
  y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: 'El triángulo equilátero lleva al extremo la propiedad que se
  observaba en el isósceles: como sus tres vértices son ''apicales'' a la vez (por
  la simetría total de la figura), las cuatro rectas notables de cada vértice se funden
  en una sola.'
explicacion_formal: '![Rectas notables coincidentes en triángulo equilátero](/static/img/geometria/elementos-secundarios/notables-coincidencia-equilatero-rectas-notables.svg)


  ### Definición formal


  En un triángulo equilátero ABC, el segmento desde cualquier vértice hasta el punto
  medio del lado opuesto es simultáneamente altura, bisectriz, transversal de gravedad
  (desde ese vértice) y simetral (del lado opuesto).


  ### Desarrollo didáctico


  Esto ocurre porque un triángulo equilátero es isósceles respecto a cualquiera de
  sus tres vértices a la vez (todos sus lados son iguales), así que la coincidencia
  que en el isósceles ocurría solo en el vértice apical, en el equilátero ocurre en
  los tres vértices simultáneamente.'
definiciones_clave: '- **Coincidencia de alturas, bisectrices, simetrales y transversales
  de gravedad en un triángulo equilátero**: Elemento o propiedad fundamental en el
  estudio de elementos secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a coincidencia de alturas, bisectrices, simetrales
  y transversales de gravedad en un triángulo equilátero.'
ejemplo_guiado:
  enunciado: En el estudio de coincidencia de alturas, bisectrices, simetrales y transversales
    de gravedad en un triángulo equilátero, un triángulo posee ángulos interiores
    de medidas $109^\circ$, $4538^\circ$ y $\gamma$. Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de coincidencia de alturas, bisectrices, simetrales y
    transversales de gravedad en un triángulo equilátero y la suma de ángulos interiores.
  - 'Plantear la suma: $109^\circ + 4538^\circ + \gamma = 180^\circ \implies 4647^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4647^\circ = -4467^\circ$.
