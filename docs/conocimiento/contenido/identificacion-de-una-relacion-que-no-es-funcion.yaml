semantic_id: MAT.ALG.FUNCION_CONCEPTOS.RELACION_NO_FUNCION
resumen_inicial: Una relación no es una función si al menos un elemento del dominio
  carece de imagen o si posee múltiples imágenes asignadas.
explicacion_simple: 'Para identificar una relación que **NO ES FUNCIÓN** buscamos
  cualquiera de estos dos fallos:

  1. **Fallo de asignación múltiple:** Una entrada $x$ tiene dos o más salidas (ejemplo:
  en un diagrama de flechas, de un punto salen 2 flechas).

  2. **Fallo de existencia:** Un elemento del conjunto de partida se queda sin asignar
  (no tiene flecha de salida).'
explicacion_formal: 'Una relación $R \subset A \times B$ **NO es una función** si
  se cumple la negación de la definición de función:


  $$\exists x \in A \quad \text{tal que} \quad |\{y \in B \mid (x, y) \in R\}| \neq
  1$$


  **Desglose de la fórmula:**

  - $|\{y \in B \mid (x, y) \in R\}| = 0$: Elemento de $A$ sin imagen (falla la existencia).

  - $|\{y \in B \mid (x, y) \in R\}| \ge 2$: Elemento de $A$ con múltiples imágenes
  (falla la unicidad).'
definiciones_clave: '- **Relación no funcional**: Subconjunto de pares ordenados $A
  \times B$ que infringe los criterios formales de existencia o unicidad.'
propiedades_relaciones: '- **Visualización de falla**: Gráfica que es cortada por
  una línea vertical en dos o más puntos.'
ejemplo_guiado:
  enunciado: Dada la ecuación $x^2 + y^2 = 9$ (circunferencia de radio 3 centrada
    en el origen), demuestra que no define a $y$ como función de $x$.
  pasos:
  - 'Paso 1: Tomar un valor del dominio, por ejemplo $x = 0$.Paso 2: Sustituir $x
    = 0$ en la ecuación: $0^2 + y^2 = 9 \implies y^2 = 9$.Paso 3: Resolver para $y$:
    $y = \pm \sqrt{9} \implies y_1 = 3 \quad \text{e} \quad y_2 = -3$.Paso 4: Notar
    que a la entrada $x = 0$ le corresponden dos salidas distintas ($3$ y $-3$).Paso
    5: Concluir que la relación $x^2 + y^2 = 9$ NO es una función de $x$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $x = 0$ en la ecuación $x^2 + y^2 = 9$, ¿por qué la relación
    NO es una función de $x$?
  choices:
  - text: Porque a $x = 0$ le corresponden dos imágenes distintas ($y = 3$ e $y =
      -3$).
    is_correct: true
  - text: Porque 9 es un número impar.
    is_correct: false
  - text: Porque la gráfica es un círculo perfecto.
    is_correct: false
  - text: Porque no contiene variables.
    is_correct: false
  explanation: La alternativa correcta es 'Porque a $x = 0$ le corresponden dos imágenes
    distintas ($y = 3$ e $y = -3$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué método gráfico permite identificar si una curva en el plano cartesiano
    NO es una función?
  choices:
  - text: Si una recta vertical corta a la curva en dos o más puntos.
    is_correct: true
  - text: Si la curva pasa por el origen $(0,0)$.
    is_correct: false
  - text: Si una recta horizontal corta a la curva en un punto.
    is_correct: false
  - text: Si la curva es una línea recta inclinada.
    is_correct: false
  explanation: La alternativa correcta es 'Si una recta vertical corta a la curva
    en dos o más puntos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar un valor de entrada $x$.Paso 2: Calcular sus salidas posibles
  $y$.Paso 3: Si se obtienen 2 o más respuestas $y$ distintas, o ninguna, declarar
  que la relación no es función.'
errores_correccion: '- **Error común:** Creer que las circunferencias o elipses son
  funciones.

  - **Cómo corregirlo:** Las curvas cerradas como la circunferencia NO son funciones
  porque una recta vertical las corta en dos puntos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
