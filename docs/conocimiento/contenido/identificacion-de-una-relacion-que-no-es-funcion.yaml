semantic_id: MAT.ALG.FUNCION_CONCEPTOS.RELACION_NO_FUNCION
resumen_inicial: 'Identificación de una relación que no es función: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: No toda flecha entre dos conjuntos merece llamarse función. Cuando
  alguna regla básica se rompe, solo queda una relación general.
explicacion_formal: '### Definición formal


  Una relación $R \subseteq A \times B$ no es una función de $A$ en $B$ si viola al
  menos una de las dos condiciones que definen a las funciones: existe algún $x \in
  A$ tal que no hay $y \in B$ con $(x,y) \in R$ (falla de existencia), o existe algún
  $x \in A$ con dos pares $(x,y_1), (x,y_2) \in R$ tales que $y_1 \neq y_2$ (falla
  de unicidad).


  ### Desarrollo didáctico


  Para detectar una relación que no es función, basta con encontrar **un solo** contraejemplo:
  un elemento del dominio sin imagen, o un elemento con dos imágenes distintas.


  Gráficamente, si alguna recta vertical no toca la curva en ningún punto (falla de
  existencia) o la toca en más de uno (falla de unicidad), la curva representa una
  relación, pero no una función.'
definiciones_clave: '- **Identificación de una relación que no es función**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación de una relación que no es
  función.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación de
    una relación que no es función.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación de una relación
    que no es función.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    identificación de una relación que no es función?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en identificación de una relación que no es función.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en identificación de una
    relación que no es función, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Revisa si todo elemento del conjunto de partida tiene al menos una imagen
  asignada.'
- 'Paso 2: Revisa si algún elemento del conjunto de partida tiene más de una imagen
  asignada.'
- 'Paso 3: Si alguna de las dos revisiones falla, la correspondencia es una relación,
  pero no una función.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación de una relación que no es función.
ejemplos:
- titulo: Falla por elemento sin imagen
  enunciado: En $A=\{1,2,3\}$, la relación $\{(1,4), (2,5)\}$, ¿es función de $A$
    en $B$?
  solucion_pasos:
  - El elemento $3 \in A$ no tiene ninguna imagen asignada en la relación.
  - Se viola la condición de existencia; no es una función de $A$ en $B$.
- titulo: Falla por elemento con dos imágenes
  enunciado: La relación $\{(1,2), (1,6), (3,4)\}$, ¿es una función?
  solucion_pasos:
  - El elemento $1$ tiene asignadas dos imágenes distintas, $2$ y $6$.
  - Se viola la condición de unicidad; no es una función.
- titulo: ¿Una circunferencia completa en el plano cartesiano representa una función?
  enunciado: ¿Una circunferencia completa en el plano cartesiano representa una función?
  respuesta: Falso
  solucion_pasos:
  - Existen valores de $x$ (el diámetro horizontal) donde una recta vertical corta
    la circunferencia en dos puntos, violando la unicidad.
- titulo: ¿Basta con encontrar un solo elemento del dominio con dos imágenes para
    descartar que sea función?
  enunciado: ¿Basta con encontrar un solo elemento del dominio con dos imágenes para
    descartar que sea función?
  respuesta: Verdadero
  solucion_pasos:
  - Un único contraejemplo de falla de unicidad (o de existencia) es suficiente para
    descartar que la relación sea función.
errores_frecuentes:
- Concluir que una relación es función solo por revisar unos pocos elementos, sin
  verificar todos.
- No distinguir entre falla de existencia y falla de unicidad al justificar por qué
  algo no es función.
- Aplicar el criterio de la línea vertical usando una línea horizontal.
- Suponer que toda relación entre números reales definida por una ecuación es automáticamente
  una función.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando identificación
  de una relación que no es función.
