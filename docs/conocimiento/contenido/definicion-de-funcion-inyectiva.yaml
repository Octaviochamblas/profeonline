semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_DEFINICION
resumen_inicial: 'Una función es inyectiva o uno a uno si a elementos distintos del dominio les corresponden imágenes distintas en el codominio: $f(a) = f(b) \implies a = b$.'
explicacion_simple: '![Una función es inyectiva o uno a uno si a elementos distintos del dominio les corresponden imágenes distintas en el codominio: $f(a) = f(b) \implies a = b$](/static/img/nodos/definicion-de-funcion-inyectiva-intro.svg)



  Una función es **inyectiva** (o *uno a uno*) cuando **nunca dos entradas distintas dan el mismo resultado**:

  - Cada imagen $y$ tiene a lo más una sola preimagen $x$.

  - No hay dos flechas del dominio que apunten al mismo elemento de llegada.


  Por ejemplo, $f(x) = 3x$ es inyectiva porque números distintos siempre dan resultados distintos. Pero $g(x) = x^2$ en los reales **no es inyectiva**, porque $(-3)^2 = 9$ y $3^2 = 9$ (dos entradas distintas dan la misma salida $9$).'
explicacion_formal: 'Sea $f: A \to B$ una función real. Se define formalmente que $f$ es **inyectiva** si y solo si satisface cualquiera de las dos condiciones lógicamente equivalentes:

  1. **Condición directa**: $\forall x_1, x_2 \in A, \; x_1 \neq x_2 \implies f(x_1) \neq f(x_2)$.

  2. **Condición contrapositiva**: $\forall x_1, x_2 \in A, \; f(x_1) = f(x_2) \implies x_1 = x_2$.


  **Propiedades analíticas:**

  - **Inyectividad de funciones afines**: Toda función $f(x) = mx + n$ con $m \neq 0$ es inyectiva en $\mathbb{R}$.

  - **Monotonía estricta**: Si $f$ es estrictamente creciente o decreciente en un intervalo $I$, entonces es inyectiva en $I$.'
definiciones_clave: '- **Función inyectiva (1 a 1)**: Aplicación donde ninguna imagen es compartida por múltiples preimágenes.

  - **Contrapositiva de inyectividad**: Demostración algebraica asumiendo $f(a) = f(b)$ para concluir $a = b$.'
propiedades_relaciones: '- **Unicidad de preimagen**: Cada elemento del recorrido posee cardinalidad de preimágenes $|f^{-1}(\{y\})| = 1$.

  - **Composición inyectiva**: Si $f$ y $g$ son inyectivas, su composición $g \circ f$ es inyectiva.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una función es inyectiva o uno a uno si a elementos distintos del dominio les corresponden imágenes distintas en el codominio: $f(a) = f(b) \implies a = b$](/static/img/nodos/definicion-de-funcion-inyectiva-ejemplos.svg)



    Demuestra algebraicamente si la función afín $f(x) = 4x - 9$ es inyectiva en $\mathbb{R}$.'
  pasos:
  - 'Paso 1: Plantear la hipótesis de partida: suponer $f(a) = f(b)$ para dos reales $a, b \in \mathbb{R}$.'
  - 'Paso 2: Sustituir en la regla de la función: $4a - 9 = 4b - 9$.'
  - 'Paso 3: Sumar 9 a ambos lados de la igualdad: $4a = 4b$.'
  - 'Paso 4: Dividir ambos miembros por 4: $a = b$.'
  - 'Paso 5: Concluir formalmente que $f$ es inyectiva en $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición algebraica formal para demostrar que una función es inyectiva?
  choices:
  - text: f(a) = f(b) implica necesariamente que a = b.
    is_correct: true
  - text: f(a) = f(b) implica que a = -b.
    is_correct: false
  - text: f(0) = 0.
    is_correct: false
  - text: Rec(f) = Codominio(f).
    is_correct: false
  explanation: La alternativa correcta es 'f(a) = f(b) implica necesariamente que a = b.'. Es la definición contrapositiva de inyectividad.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la función $g(x) = x^2 - 1$ con dominio $\mathbb{R}$ NO es inyectiva?
  choices:
  - text: Porque preimagenes distintas como x = 2 y x = -2 tienen la misma imagen y = 3.
    is_correct: true
  - text: Porque no pasa por el origen.
    is_correct: false
  - text: Porque su grafico es una curva y no una recta.
    is_correct: false
  - text: Porque el vertice esta en el eje Y.
    is_correct: false
  explanation: La alternativa correcta es 'Porque preimagenes distintas como x = 2 y x = -2 tienen la misma imagen y = 3.'. Falla la condición de unicidad de imagen.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la igualdad $f(a) = f(b)$ con dos variables hipotéticas $a$ y $b$.'
- 'Paso 2: Desarrollar algebraicamente cancelando términos constantes y factores.'
- 'Paso 3: Verificar si se deduce de manera única que $a = b$.'
- 'Paso 4: Si surgen soluciones alternativas (como $a = -b$), la función no es inyectiva.'
errores_correccion: '- **Error común:** Afirmar que una función es inyectiva probando solo con dos números particulares.

  - **Cómo corregirlo:** La demostración debe ser **general** para todo $a, b \in \text{Dom}(f)$ mediante álgebra ($f(a) = f(b) \implies a = b$).'
ejemplos:
- titulo: 'Ejemplo 1: Función lineal'
  enunciado: ¿Es inyectiva la función $f(x) = -5x$ en $\mathbb{R}$?
  alternativas:
  - Sí, porque -5a = -5b implica a = b
  - No, porque la pendiente es negativa
  - No, porque pasa por el origen
  - Solo para números positivos
  respuesta: Sí, porque -5a = -5b implica a = b
  solucion_pasos:
  - 'Paso 1: $-5a = -5b \implies a = b$, luego es inyectiva.'
- titulo: 'Ejemplo 2: Función valor absoluto'
  enunciado: ¿Es inyectiva $h(x) = |x|$ en $\mathbb{R}$?
  alternativas:
  - No, porque h(-4) = h(4) = 4 con -4 != 4
  - Sí, porque el valor absoluto es positivo
  - Sí, porque es simétrica
  - Solo para números negativos
  respuesta: No, porque h(-4) = h(4) = 4 con -4 != 4
  solucion_pasos:
  - 'Paso 1: Las preimágenes $-4$ y $4$ comparten la misma imagen $4$, no es inyectiva.'
- titulo: 'Ejemplo 3: Función cúbica'
  enunciado: ¿Es inyectiva $f(x) = x^3$ en $\mathbb{R}$?
  alternativas:
  - Sí, porque a^3 = b^3 implica a = b en los números reales
  - No, porque tiene grado 3
  - No, porque corta al eje X en 0
  - Solo para enteros
  respuesta: Sí, porque a^3 = b^3 implica a = b en los números reales
  solucion_pasos:
  - 'Paso 1: Al extraer raíz cúbica real: $a^3 = b^3 \implies a = b$.'
- titulo: 'Ejemplo 4: Restricción de dominio'
  enunciado: Si $g(x) = x^2$ se define en $[0, +\infty[$, ¿es inyectiva?
  alternativas:
  - Sí, porque en los reales no negativos a^2 = b^2 implica a = b
  - No, las funciones cuadráticas nunca son inyectivas
  - No, porque g(0) = 0
  - Depende del codominio
  respuesta: Sí, porque en los reales no negativos a^2 = b^2 implica a = b
  solucion_pasos:
  - 'Paso 1: Al no haber preimágenes negativas, $a^2 = b^2 \implies a = b$.'
errores_frecuentes:
- Confundir la prueba de inyectividad con la prueba de existencia de función.
- Olvidar que restringir el dominio puede transformar una función no inyectiva en inyectiva.
- Asumir que las funciones constantes son inyectivas.
afirmaciones_verdaderas:
- Una función es inyectiva si cada elemento del recorrido tiene una única preimagen.
- Toda función polinómica de primer grado f(x) = mx + n con m != 0 es inyectiva en R.
al_terminar_debes_poder: '**QUÉ:** Comprender, definir y demostrar formalmente la inyectividad de funciones reales.


  **CÓMO:** Aplicando el criterio algebraico contrapositivo f(a) = f(b) ⟹ a = b y analizando la unicidad de preimágenes.


  ![Resumen Una función es inyectiva o uno a uno si a elementos distintos del dominio les corresponden imágenes distintas en el codominio: $f(a) = f(b) \implies a = b$](/static/img/nodos/definicion-de-funcion-inyectiva-resumen.svg)'
