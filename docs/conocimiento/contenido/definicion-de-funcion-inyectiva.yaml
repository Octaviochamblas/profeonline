semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_DEFINICION
resumen_inicial: 'Definición de función inyectiva: conceptos, representación y propiedades
  en Tipos de funciones y función inversa.'
explicacion_simple: 'Hay funciones donde nunca dos entradas distintas producen la
  misma salida: cada resultado "delata" exactamente de qué entrada vino. Esa propiedad
  se llama inyectividad.'
explicacion_formal: '### Definición formal


  Una función $f\colon A \to B$ es inyectiva (o uno a uno) si para todo $x_1, x_2
  \in A$, $f(x_1) = f(x_2) \implies x_1 = x_2$. Equivalentemente, $x_1 \neq x_2 \implies
  f(x_1) \neq f(x_2)$: no existen dos elementos distintos del dominio con la misma
  imagen.


  ### Desarrollo didáctico


  La forma más práctica de verificarlo algebraicamente es plantear la ecuación $f(x_1)=f(x_2)$
  y comprobar que la única solución posible es $x_1=x_2$.


  Para $f(x)=2x+1$: si $2x_1+1=2x_2+1$, entonces $2x_1=2x_2$, y por tanto $x_1=x_2$.
  Se confirma que $f$ es inyectiva. En cambio, para $g(x)=x^2$: $g(2)=g(-2)=4$ con
  $2\neq-2$, así que $g$ no es inyectiva.'
definiciones_clave: '- **Definición de función inyectiva**: Elemento central en el
  estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a definición de función inyectiva.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a definición de función
    inyectiva.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a definición de función inyectiva.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
