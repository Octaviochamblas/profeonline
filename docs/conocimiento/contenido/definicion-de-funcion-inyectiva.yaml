semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_DEFINICION
resumen_inicial: Una función es inyectiva (uno a uno) si a preimágenes distintas les
  corresponden imágenes distintas ($f(x_1) = f(x_2) \implies x_1 = x_2$).
explicacion_simple: 'Una **función inyectiva** (o ''uno a uno'') garantiza que ningún
  resultado $y$ se repita para dos entradas distintas.

  - Si $f(2) = 5$, NINGÚN OTRO NÚMERO puede dar como resultado $5$.

  - Gráficamente, cumple el **criterio de la línea horizontal**: cualquier línea horizontal
  corta a la gráfica a lo sumo en UN PUNTO.'
explicacion_formal: 'Una función $f: A \to B$ es **inyectiva** si y solo si:


  $$\forall x_1, x_2 \in A, \quad f(x_1) = f(x_2) \implies x_1 = x_2$$

  $$\text{o equivalentemente: } x_1 \neq x_2 \implies f(x_1) \neq f(x_2)$$


  **Desglose de la fórmula:**

  - Implicación lógica de unicidad inversa: la igualdad de salidas exige la estricta
  identidad de las entradas.'
definiciones_clave: '- **Función inyectiva (uno a uno)**: Mapeo funcional donde cada
  elemento del recorrido posee exactamente una preimagen única.'
propiedades_relaciones: '- **Criterio de la línea horizontal**: En el plano real,
  ninguna recta horizontal corta al gráfico en más de un punto.'
ejemplo_guiado:
  enunciado: Demuestra algebraicamente si la función $f(x) = 4x - 7$ en $\mathbb{R}$
    es inyectiva.
  pasos:
  - 'Paso 1: Asumir que $f(x_1) = f(x_2)$ para dos entradas $x_1, x_2 \in \mathbb{R}$.Paso
    2: Sustituir la fórmula: $4x_1 - 7 = 4x_2 - 7$.Paso 3: Sumar $7$ a ambos lados:
    $4x_1 = 4x_2$.Paso 4: Dividir entre $4$: $x_1 = x_2$.Paso 5: Concluir que como
    $f(x_1) = f(x_2) \implies x_1 = x_2$, la función $f(x) = 4x - 7$ es inyectiva.'
checkpoints:
- placement: after_explicacion_formal
  question: Al aplicar la definición formal $f(x_1) = f(x_2)$ a la función $f(x) =
    4x - 7$, ¿cuál es la conclusión obtenida?
  choices:
  - text: Como $4x_1 - 7 = 4x_2 - 7 \implies x_1 = x_2$, la función es inyectiva.
    is_correct: true
  - text: Como $x_1 = -x_2$, la función no es inyectiva.
    is_correct: false
  - text: Como la constante es $-7$, es una función par.
    is_correct: false
  - text: La función no es inyectiva porque no pasa por el origen.
    is_correct: false
  explanation: La alternativa correcta es 'Como $4x_1 - 7 = 4x_2 - 7 \implies x_1
    = x_2$, la función es inyectiva.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué prueba gráfica valida si una función en el plano cartesiano es inyectiva?
  choices:
  - text: El criterio de la línea horizontal.
    is_correct: true
  - text: El criterio de la línea vertical.
    is_correct: false
  - text: El test del punto medio.
    is_correct: false
  - text: Verificar si corta al origen $(0,0)$.
    is_correct: false
  explanation: La alternativa correcta es 'El criterio de la línea horizontal.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la igualdad $f(x_1) = f(x_2)$.'
- 'Paso 2: Simplificar la ecuación algebraicamente.'
- 'Paso 3: Si se concluye únicamente $x_1 = x_2$, la función es inyectiva.'
- 'Paso 4: Si se obtiene una alternativa como $x_1 = \pm x_2$, no es inyectiva.'
errores_correccion: '- **Error común:** Confundir inyectividad (línea horizontal)
  con ser función (línea vertical).

  - **Cómo corregirlo:** La línea vertical determina si ES FUNCIÓN; la línea horizontal
  determina si es INYECTIVA.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
fuente: Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa
