semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_DEFINICION
resumen_inicial: Una función es inyectiva (o uno a uno) si elementos distintos del dominio poseen imágenes distintas en el codominio.
explicacion_simple: |
  Una **función inyectiva** significa que **no hay repetición de resultados**:

  - Si ingresas dos números de entrada distintos ($x_1 \neq x_2$), obtendrás dos respuestas distintas ($f(x_1) \neq f(x_2)$).
  - Dos personas distintas nunca tendrán la misma respuesta.
  - Ejemplo: $f(x) = x^2$ con $x \in \mathbb{R}$ **NO es inyectiva** porque $f(2) = 4$ y $f(-2) = 4$ (dan la misma respuesta $4$).
explicacion_formal: |
  Sea $f: A \to B$ una función. $f$ es **inyectiva** (o uno a uno) si satisface cualquiera de las dos condiciones equivalentes:

  $$\forall x_1, x_2 \in A, \quad x_1 \neq x_2 \implies f(x_1) \neq f(x_2)$$

  o su forma contrarecíproca usual para pruebas algebraicas:

  $$\forall x_1, x_2 \in A, \quad f(x_1) = f(x_2) \implies x_1 = x_2$$

  **Prueba geométrica (Criterio de la línea horizontal):**
  Cualquier recta horizontal $y = c$ intersecta a la gráfica de $f$ en **a lo sumo un punto**.
definiciones_clave: |
  - **Función inyectiva (uno a uno)**: Mapeo funcional que preserva la distinción de los elementos del dominio.
propiedades_relaciones: |
  - **Monotonía estricta**: Toda función real de variable real estrictamente creciente o estrictamente decreciente es inyectiva.
ejemplo_guiado:
  enunciado: 'Determina si la función $f(x) = 5x - 3$ es inyectiva mediante demostración algebraica.'
  pasos:
    - 'Paso 1: Supón que $f(x_1) = f(x_2)$.'
    - 'Paso 2: Sustituir en la regla: $5x_1 - 3 = 5x_2 - 3$.'
    - 'Paso 3: Sumar $3$ a ambos lados: $5x_1 = 5x_2$.'
    - 'Paso 4: Dividir entre $5$: $x_1 = x_2$.'
    - 'Paso 5: Concluir que $f$ es una función inyectiva.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la definición formal contrarecíproca de una función inyectiva?'
    choices:
      - {text: 'Si $f(x_1) = f(x_2)$, entonces $x_1 = x_2$', is_correct: true}
      - {text: 'Si $x_1 = x_2$, entonces $f(x_1) = 0$', is_correct: false}
      - {text: 'Si $f(x) = 0$, entonces $x = 1$', is_correct: false}
      - {text: 'Para todo $y$, existe un único $x$', is_correct: false}
    explanation: 'La alternativa correcta es ''Si $f(x_1) = f(x_2)$, entonces $x_1 = x_2$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $f(x) = x^2$ definida sobre los números reales $\mathbb{R}$ no es inyectiva?'
    choices:
      - {text: 'Porque entradas distintas como $x = 2$ y $x = -2$ producen la misma salida $y = 4$', is_correct: true}
      - {text: 'Porque no pasa por el origen $(0,0)$', is_correct: false}
      - {text: 'Porque su pendiente es constante', is_correct: false}
      - {text: 'Porque su recorrido abarca los números reales negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque entradas distintas como $x = 2$ y $x = -2$ producen la misma salida $y = 4$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Plantear la igualdad $f(x_1) = f(x_2)$.'
  - 'Paso 2: Reemplazar la expresión algebraica de la función para $x_1$ y $x_2$.'
  - 'Paso 3: Simplificar algebraicamente mediante operaciones inversas.'
  - 'Paso 4: Si se deduce $x_1 = x_2$ como única posibilidad, declarar que la función es inyectiva.'
errores_correccion: |
  - **Error común:** Confundir la prueba de inyectividad con la prueba de ser función (línea vertical vs línea horizontal).
  - **Cómo corregirlo:** Para verificar si es FUNCIÓN se usan líneas VERTICALES; para verificar si es INYECTIVA se usan líneas **HORIZONTALES**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función inyectiva.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función inyectiva.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función es inyectiva si dos preimágenes distintas producen siempre la misma imagen idéntica.'
  - 'La función cuadrática $f(x) = x^2 + 1$ definida en todo $\mathbb{R}$ es una función inyectiva.'
  - 'El criterio de la línea vertical se utiliza para determinar si una gráfica corresponde a una función inyectiva.'
  - 'Toda función constante $f(x) = c$ es un ejemplo clásico de función inyectiva.'
  - 'Si una función es inyectiva, su recorrido debe ser obligatoriamente igual al conjunto vacío.'
afirmaciones_verdaderas:
  - 'Una función $f$ es inyectiva si y solo si preimágenes distintas producen imágenes distintas: $x_1 \neq x_2 \implies f(x_1) \neq f(x_2)$.'
  - 'Geométricamente, una función es inyectiva si ninguna recta horizontal intersecta a su gráfica en más de un punto.'
al_terminar_debes_poder: |
  QUÉ: Definir y verificar la propiedad de inyectividad en funciones.
  CÓMO: Aplicar la prueba algebraica $f(a) = f(b) \implies a = b$ o el criterio de la línea horizontal en el gráfico.
