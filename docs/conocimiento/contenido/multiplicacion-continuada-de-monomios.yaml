semantic_id: MAT.ALG.MULT_MONOMIOS.MULTIPLES_MONOMIOS
resumen_inicial: 'Multiplicación continuada de monomios: leyes, procedimiento y aplicación
  en Multiplicación de monomios.'
explicacion_simple: Cuando multiplicas tres o más números, como $2 \times 3 \times
  5$, multiplicas dos de ellos y luego el resultado por el tercero. Al multiplicar
  tres o más monomios, hacemos exactamente lo mismo combinando todos los números y
  todas las letras juntas.
explicacion_formal: '### Definición formal


  Signos: $(-)(+)(-)=+$. Exponentes de $a$: $2+1+2=5$. Coeficientes: $3 \times 2 \times
  1 = 6$. Resultado completo: $6a^5b^4$.


  ### Desarrollo didáctico


  Calcula: $(-2x^2)(3y)(-5x^3y^2)$.


  Paso 1: Signo. 2 negativos (par) → $+$.

  Paso 2: Coeficientes. $2 \times 3 \times 5 = 30$.

  Paso 3: Variable $x$. $x^2 \cdot x^3 = x^5$.

  Paso 4: Variable $y$. $y^1 \cdot y^2 = y^3$.


  Resultado combinado: $30x^5y^3$.'
definiciones_clave: '- **Multiplicación continuada de monomios**: Propiedad o regla
  fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación continuada de monomios.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de multiplicación continuada
    de monomios.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de multiplicación continuada de monomios.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
checkpoints:
