semantic_id: MAT.ALG.MULT_MONOMIOS.MULTIPLES_MONOMIOS
resumen_inicial: 'La multiplicación continuada de monomios consiste en calcular el producto de tres o más monomios multiplicando todos sus coeficientes y acumulando la suma de exponentes por cada variable.'
explicacion_simple: |
  Cuando multiplicas **tres o más monomios continuados** (ej: $(2x^2) \cdot (-3x^4) \cdot (4x)$):
  - **Procedimiento directo de un solo paso**:
    1. **Signo global**: Cuenta los factores negativos (si hay una cantidad impar $\implies -$, si es par $\implies +$).
    2. **Coeficiente global**: Multiplica todos los coeficientes numéricos ($2 \cdot 3 \cdot 4 = \mathbf{24}$).
    3. **Exponentes globales**: Suma TODOS los exponentes de cada variable presente ($x^{2 + 4 + 1} = \mathbf{x^7}$).
  - **Resultado unificado**: **$-24x^7$**.
  - **Ventaja**: No necesitas hacer multiplicaciones parciales parejas por parejas; lo resuelves todo de una vez.
explicacion_formal: |
  ### Definición formal
  Sea la secuencia de $k$ monomios $\{M_j\}_{j=1}^k$ en $\mathbb{R}[x_1, \dots, x_n]$, donde $M_j = c_j \prod_{i=1}^n x_i^{\alpha_{ji}}$. La **multiplicación continuada de monomios** extiende el operador producto bilineal a la forma n-aria mediante la composición asociativa:

  $$\prod_{j=1}^k M_j = \left( \prod_{j=1}^k c_j \right) \cdot \prod_{i=1}^n x_i^{\sum_{j=1}^k \alpha_{ji}}$$

  ### Demostración por Inducción sobre el Número de Monomios $k$
  1. Para $k=2$, la fórmula se reduce al producto bilineal estándar $c_1 c_2 x_i^{\alpha_{1i} + \alpha_{2i}}$.
  2. Asumiendo la validez para $k=m$, multiplicar por $M_{m+1}$ extiende el coeficiente a $\left(\prod_{j=1}^m c_j\right) c_{m+1} = \prod_{j=1}^{m+1} c_j$ y el exponente a $\sum_{j=1}^m \alpha_{ji} + \alpha_{(m+1)i} = \sum_{j=1}^{m+1} \alpha_{ji}$.

  ### Síntesis didáctica
  La adición continuada de exponentes consolida la parte literal de múltiples factores en un solo monomio irreducible.
definiciones_clave: |
  - **Multiplicación continuada de monomios**: Producto n-ario donde intervienen tres o más expresiones monómicas consecutivas.
  - **Acumulador de exponentes ($\sum \alpha_{ji}$)**: Sumatoria total de las potencias asociadas a una variable a lo largo de todos los factores.
  - **Signatura acumulada**: Determinación del signo del monomio resultante según la cantidad total de monomios negativos.
propiedades_relaciones: |
  - **Invarianza por reagrupadura**: La asociatividad permite multiplicar los coeficientes en cualquier orden conservando el producto.
  - **Presencia de factor nulo**: Si cualquier monomio de la secuencia continuada es el monomio nulo $0$, el producto global es $0$.
ejemplo_guiado:
  enunciado: 'Calcula la multiplicación continuada $(-2a^3 b) \cdot (-3a b^2) \cdot (-4a^2 b^4) \cdot (+2b)$.'
  pasos:
    - 'Paso 1: Contamos los factores negativos: Hay 3 factores negativos (impar) $\implies$ El signo global es **negativo ($-$)**.'
    - 'Paso 2: Multiplicamos los coeficientes numéricos en valor absoluto:
       $2 \cdot 3 \cdot 4 \cdot 2 = \mathbf{48}$.'
    - 'Paso 3: Acumulamos la suma de exponentes para la variable $a$:
       $a^3 \cdot a^1 \cdot a^2 = a^{3 + 1 + 2} = \mathbf{a^6}$.'
    - 'Paso 4: Acumulamos la suma de exponentes para la variable $b$:
       $b^1 \cdot b^2 \cdot b^4 \cdot b^1 = b^{1 + 2 + 4 + 1} = \mathbf{b^8}$.'
    - 'Paso 5: Consolidamos el monomio resultante: $-48a^6 b^8$.'
    - 'Conclusión: La multiplicación continuada resulta en **$-48a^6 b^8$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se determina el exponente de cada variable en el resultado de una multiplicación continuada de 4 monomios?'
    choices:
      - {text: 'Sumando los exponentes de esa variable en cada uno de los 4 monomios multiplicandos', is_correct: true}
      - {text: 'Multiplicando todos los exponentes entre sí', is_correct: false}
      - {text: 'Tomando sólo el exponente mayor', is_correct: false}
      - {text: 'Restando los exponentes del primer y último monomio', is_correct: false}
    explanation: 'La alternativa correcta es ''Sumando los exponentes de esa variable en cada uno de los 4 monomios multiplicandos''. Acumulador de exponentes $\sum \alpha_{ji}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de la multiplicación continuada $(x) \cdot (2x^2) \cdot (-3x^3)$?'
    choices:
      - {text: 'El resultado es $-6x^6$, multiplicando $1 \cdot 2 \cdot (-3) = -6$ y sumando $1 + 2 + 3 = 6$', is_correct: true}
      - {text: 'El resultado es $-6x^5$', is_correct: false}
      - {text: 'El resultado es $+6x^6$', is_correct: false}
      - {text: 'El resultado es $-5x^6$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $-6x^6$, multiplicando $1 \cdot 2 \cdot (-3) = -6$ y sumando $1 + 2 + 3 = 6$''. Coeficientes $-6$, exponentes $1+2+3=6 \implies -6x^6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Contar los signos negativos presentes entre todos los monomios para fijar el signo ($+$ o $-$) del resultado.'
  - 'Paso 2: Multiplicar en cadena todos los coeficientes numéricos de la secuencia.'
  - 'Paso 3: Para cada variable distinta, sumar sus exponentes a lo largo de todos los monomios de la cadena.'
  - 'Paso 4: Escribir el monomio final unificando el signo, el coeficiente y las potencias acumuladas.'
errores_correccion: |
  - **Error 1:** Perder el exponente 1 de los monomios lineales intermedios al sumar la cadena (escribir $x^2 \cdot x \cdot x^3 = x^5$). **Cómo corregirlo:** La variable sin exponente **TIENE EXPONENTE 1 ($2 + 1 + 3 = 6 \implies x^6$)**.
  - **Error 2:** Multiplicar los exponentes al hacer multiplicaciones continuadas largas. **Cómo corregirlo:** Independientemente de la cantidad de factores **LOS EXPONENTES SIEMPRE SE SUMAN**.
ejemplos:
  - titulo: 'Tres monomios simples'
    enunciado: '¿Cuál es el resultado de $(2a) \cdot (3a^2) \cdot (4a^3)$?'
    alternativas:
      - '$24a^6$'
      - '$9a^6$'
      - '$24a^{24}$'
    respuesta: '$24a^6$'
    solucion_pasos:
      - '1. Coeficientes: $2 \cdot 3 \cdot 4 = 24$.'
      - '2. Exponentes: $1 + 2 + 3 = 6$.'
      - '3. Resultado: $24a^6$.'
  - titulo: 'Cuatro monomios alternados'
    enunciado: '¿Cuál es el resultado de $(-x) \cdot (y) \cdot (-2x) \cdot (3y)$?'
    alternativas:
      - '$6x^2 y^2$'
      - '$-6x^2 y^2$'
      - '$6xy$'
    respuesta: '$6x^2 y^2$'
    solucion_pasos:
      - '1. Negativos: 2 (par) $\implies +$.'
      - '2. Coeficientes: $1 \cdot 1 \cdot 2 \cdot 3 = 6$.'
      - '3. Variable $x$: $x^{1+1} = x^2$.'
      - '4. Variable $y$: $y^{1+1} = y^2$.'
      - '5. Resultado: $6x^2 y^2$.'
  - titulo: 'Presencia de factor nulo continuado'
    enunciado: 'Para $(3x^2) \cdot (-4x) \cdot 0 \cdot (5x^3)$, ¿es el resultado $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, cualquier multiplicación que contenga el factor cero da cero.'
  - titulo: 'Acumulación de variables'
    enunciado: 'En la cadena $a \cdot b \cdot c \cdot a \cdot b$, ¿obtenemos $a^2 b^2 c$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $a^{1+1} = a^2$, $b^{1+1} = b^2$ y $c^1$.'
errores_frecuentes:
  - 'Las variables solitarias en cadenas multiplicativas no son tomadas con su exponente 1.'
  - 'Multiplicar los exponentes de las potencias al haber muchos factores monómicos.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Desorientarse con el signo global al multiplicar secuencialmente de a parejas.'
  - 'Las variables presentes en factores intermedios no son incluidas en la reducción.'
afirmaciones_verdaderas:
  - 'La multiplicación continuada de monomios requiere multiplicar todos los coeficientes y sumar los exponentes por cada variable.'
  - 'La cantidad de monomios en la cadena no altera la regla de que los exponentes de potencias de igual base se suman.'
al_terminar_debes_poder: 'Resolver multiplicaciones continuadas de tres o más monomios acumulando coeficientes y exponentes globales.'
