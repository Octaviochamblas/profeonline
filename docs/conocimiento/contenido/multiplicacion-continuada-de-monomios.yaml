  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el cálculo paso a paso de multiplicación continuada de monomios, ¿qué
    procedimiento con los exponentes se debe realizar?
  choices:
  - text: Sumar los exponentes de las mismas bases y multiplicar los coeficientes
    is_correct: true
  - text: Restar los exponentes de las variables multiplicadas
    is_correct: false
  - text: Dividir los coeficientes entre los exponentes
    is_correct: false
  - text: Mantener los coeficientes y borrar las variables
    is_correct: false
  explanation: 'La alternativa correcta es: Sumar los exponentes de las mismas bases
