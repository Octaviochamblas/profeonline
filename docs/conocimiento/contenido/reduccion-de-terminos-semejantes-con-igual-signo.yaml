semantic_id: MAT.ALG.REDUCCION_OPERATIVA.MISMO_SIGNO
resumen_inicial: La reducción de términos semejantes con igual signo consiste en sumar los valores absolutos de los coeficientes numéricos, conservar el signo común y mantener inalterado el factor literal.
explicacion_simple: "Para reducir dos o más términos semejantes que tienen el **mismo signo** (ambos positivos o ambos negativos):\n- **Paso 1: Sumar** los coeficientes numéricos en valor absoluto.\n- **Paso 2: Conservar el signo común** delante del resultado ($+$ si eran positivos, $-$ si eran negativos).\n- **Paso 3: Conservar el mismo factor literal** (las letras y sus exponentes no cambian).\n- **Ejemplo 1 (Positivos)**: $4x + 9x$\n  - Sumamos coeficientes: $4 + 9 = 13$.\n  - Signo común: $+$.\n  - Resultado: **$13x$**.\n- **Ejemplo 2 (Negativos)**: $-5a^2 - 3a^2$\n  - Sumamos coeficientes: $5 + 3 = 8$.\n  - Signo común: $-$.\n  - Resultado: **$-8a^2$**.\n\n![Reducción de Términos con Igual Signo](/static/img/nodos/reduccion-de-terminos-semejantes-con-igual-signo-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\mathcal{T} = \{c_1 M, c_2 M, \dots, c_k M\}$ un conjunto de monomios semejantes que comparten el factor literal $M = \prod x_i^{a_i}$, donde todos los coeficientes $c_i \in \mathbb{R}$ poseen la misma signatura ($\operatorname{sgn}(c_i) = \sigma \in \{-1, +1\}$). Por la **propiedad distributiva de la multiplicación sobre la adición en $\mathbb{R}$**:


  $$\sum_{i=1}^k c_i M = \left( \sum_{i=1}^k c_i \right) M = \sigma \left( \sum_{i=1}^k |c_i| \right) M$$


  ### Principio de Invarianza del Factor Literal

  La reducción aditiva opera de forma exclusiva sobre el cuerpo de coeficientes $\mathbb{R}$, dejando estrictamente invariante el espacio de potencias del factor literal $M$:


  $$\deg_{x_j}\left( \sum_{i=1}^k c_i M \right) = \deg_{x_j}(M) = a_j \quad \forall j$$


  ### Síntesis didáctica

  Reducir términos de igual signo es la base de la acumulación de magnitudes físicas idénticas y simplificación de expresiones polinómicas.

  '
definiciones_clave: '- **Reducción por mismo signo**: Adición algebraica de coeficientes con igual signatura conservando la parte literal.

  - **Signo común ($\sigma$)**: Orientación positiva ($+$) o negativa ($-$) compartida por todos los términos a reducir.

  - **Factor literal invariante**: Preservación sin cambios de las variables y sus exponentes en el término resultante.

  '
propiedades_relaciones: '- **Acumulación de magnitud**: Al reducir términos de igual signo, el valor absoluto del coeficiente resultante es estrictamente mayor que el de cualquiera de los términos individuales ($|\sum c_i| > |c_j|$).

  - **Distribución hacia la izquierda**: Factorización implícita del factor literal común: $c_1 M + c_2 M = (c_1 + c_2)M$.

  '
ejemplo_guiado:
  enunciado: Reduce la expresión $-7x^3 y^2 - 12x^3 y^2 - 5x^3 y^2$.
  pasos:
  - 'Paso 1: Verificamos la semejanza de los términos: Todos comparten el factor literal $x^3 y^2$.'
  - 'Paso 2: Verificamos los signos de los coeficientes: $-7, -12, -5$ son todos negativos (mismo signo).'
  - 'Paso 3: Sumamos los valores absolutos de los coeficientes: $7 + 12 + 5 = 24$.'
  - 'Paso 4: Asignamos el signo negativo común al resultado: $-24$.'
  - 'Paso 5: Agregamos el factor literal sin alterar sus exponentes: $-24x^3 y^2$.'
  - 'Conclusión: La expresión reducida es **$-24x^3 y^2$**.'
  imagen: /static/img/nodos/reduccion-de-terminos-semejantes-con-igual-signo-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con los exponentes del factor literal al reducir dos términos semejantes de igual signo?
  choices:
  - text: Los exponentes se mantienen exactamente iguales sin alteración alguna
    is_correct: true
  - text: Los exponentes se suman entre sí
    is_correct: false
  - text: Los exponentes se multiplican por dos
    is_correct: false
  - text: Los exponentes se convierten en cero
    is_correct: false
  explanation: La alternativa correcta es 'Los exponentes se mantienen exactamente iguales sin alteración alguna'. Invarianza del factor literal.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de reducir la expresión $-6a^2 - 4a^2$?
  choices:
  - text: El resultado es $-10a^2$, sumando $6 + 4 = 10$ y conservando el signo negativo
    is_correct: true
  - text: El resultado es $+10a^2$
    is_correct: false
  - text: El resultado es $-2a^2$
    is_correct: false
  - text: El resultado es $-10a^4$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $-10a^2$, sumando $6 + 4 = 10$ y conservando el signo negativo'. Suma de coeficientes negativos $-6 - 4 = -10$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que todos los términos compartan idéntico factor literal.'
- 'Paso 2: Comprobar que todos los coeficientes numéricos tengan la misma signatura (todos $+$ o todos $-$).'
- 'Paso 3: Sumar los valores absolutos de los coeficientes.'
- 'Paso 4: Escribir el resultado con el signo común acompañado del factor literal original.'
errores_correccion: '- **Error 1:** Sumar los exponentes de las variables al reducir los términos (escribir $4x^2 + 5x^2 = 9x^4$). **Cómo corregirlo:** La reducción **NO CAMBIA LOS EXPONENTES ($4x^2 + 5x^2 = 9x^2$)**; la suma de exponentes es sólo para multiplicaciones.

  - **Error 2:** Aplicar la regla de signos de la multiplicación y cambiar dos negativos a positivo (escribir $-3a - 4a = +7a$). **Cómo corregirlo:** En la suma de negativos **EL SIGNO PERMANECE NEGATIVO ($-3 - 4 = -7$)**.

  '
ejemplos:
- titulo: Reducción positiva
  enunciado: ¿Cuál es la reducción de $8m + 15m$?
  alternativas:
  - $23m$
  - $23m^2$
  - $120m$
  respuesta: $23m$
  solucion_pasos:
  - '1. Coeficientes: $8 + 15 = 23$.'
  - '2. Mismo signo y factor literal: $23m$.'
- titulo: Reducción negativa
  enunciado: ¿Cuál es la reducción de $-9p^3 - 7p^3$?
  alternativas:
  - $-16p^3$
  - $+16p^3$
  - $-16p^6$
  respuesta: $-16p^3$
  solucion_pasos:
  - '1. Suma de negativos: $-9 - 7 = -16$.'
  - '2. Mantiene exponente: $-16p^3$.'
- titulo: Tres términos positivos
  enunciado: ¿Es la reducción de $2x + 5x + 3x$ igual a $10x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2 + 5 + 3 = 10 \implies 10x$.
- titulo: Conservación de exponente
  enunciado: Al reducir $-4y^5 - 8y^5 = -12y^5$, ¿permanece el exponente de $y$ en $5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el factor literal $y^5$ no sufre modificación.
errores_frecuentes:
- Sumar los exponentes de las variables al reducir términos semejantes de igual signo.
- Aplicar erróneamente la regla de signos del producto convirtiendo la suma de dos negativos en positivo.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- La variable no es incluida en el resultado final escribiendo únicamente la suma de los coeficientes.
- Multiplicar los coeficientes en lugar de sumarlos al reducir los términos.
afirmaciones_verdaderas:
- Al reducir términos semejantes de igual signo se suman sus coeficientes en valor absoluto y se mantiene el signo común.
- El factor literal y sus exponentes se conservan exactamente iguales al efectuar la reducción aditiva.
al_terminar_debes_poder: '![Resumen de reducción con igual signo](/static/img/nodos/reduccion-de-terminos-semejantes-con-igual-signo-resumen.svg)


  QUÉ: Reducir monomios semejantes que comparten el mismo signo algebraico.


  CÓMO: Sumar los valores absolutos de los coeficientes, anteponer el signo común $(+ \text{ o } -)$ y conservar intacto el factor literal $aX + bX = (a+b)X$.'
