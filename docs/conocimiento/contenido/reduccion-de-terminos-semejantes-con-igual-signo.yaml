resumen_inicial: La reducción de términos semejantes con el mismo signo se efectúa
  sumando los valores absolutos de los coeficientes y anteponiendo el signo común
  al factor literal.
explicacion_simple: Cuando tenemos dos o más términos semejantes que comparten el
  mismo signo (ambos positivos o ambos negativos), sumamos sus números y conservamos
  el signo que tienen en común. Por ejemplo, $3x + 5x = 8x$, y de la misma manera
  $-4a^2 - 3a^2 = -7a^2$.
explicacion_formal: 'Dados $T_1 = c_1 L$ y $T_2 = c_2 L$ con $\text{sgn}(c_1) = \text{sgn}(c_2)
  = s$, la **Reducción de Igual Signo** aplica la regla distributiva:


  $$T_1 + T_2 = (c_1 + c_2)L = s(|c_1| + |c_2|)L$$


  > **Complemento didáctico:** La adición de términos de igual signo acumula magnitudes
  escalares manteniendo la orientación en la recta numérica.'
definiciones_clave: '- **Reducción de mismo signo**: Suma de coeficientes conservando
  el signo común y la parte literal idéntica.'
propiedades_relaciones: '- **Monotonía aditiva**: La suma de términos de igual signo
  incrementa la magnitud del coeficiente resultante en la dirección del signo.'
ejemplo_guiado:
  enunciado: Reduzca la expresión $E = -6a^3b^2 - 4a^3b^2 - 5a^3b^2$.
  pasos:
  - 'Paso 1: Identificar el factor literal común: $L = a^3b^2$.

    - Paso 2: Identificar los coeficientes: $-6, -4, -5$ (todos de signo negativo).'
  - 'Paso 3: Sumar las magnitudes absolutas: $6 + 4 + 5 = 15$.'
  - 'Paso 4: Anteponer el signo común negativo: $-15$.'
  - 'Paso 5: Multiplicar por el factor literal común: $-15a^3b^2$.'
  - 'Conclusión: La expresión reducida es $-15a^3b^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué regla se aplica al reducir términos semejantes que tienen el mismo
    signo?
  choices:
  - text: Se suman los valores absolutos de los coeficientes y se antepone el signo
      común a la parte literal
    is_correct: true
  - text: Se restan los coeficientes siempre
    is_correct: false
  - text: Se multiplican los exponentes de las letras
    is_correct: false
  - text: El resultado da cero
    is_correct: false
  explanation: La alternativa correcta es 'Se suman los valores absolutos de los coeficientes
    y se antepone el signo común a la parte literal'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -6a^3b^2 - 4a^3b^2 - 5a^3b^2, ¿cuál fue el resultado
    final?
  choices:
  - text: -15a^3b^2
    is_correct: true
  - text: 15a^3b^2
    is_correct: false
  - text: -7a^3b^2
    is_correct: false
  - text: -15a^9b^6
    is_correct: false
  explanation: La alternativa correcta es '-15a^3b^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que todos los términos compartan exactamente la misma parte literal.'
- 'Paso 2: Sumar los valores absolutos de los coeficientes numéricos.'
- 'Paso 3: Escribir el resultado conservando el signo común junto al factor literal.'
errores_correccion: '- **Error 1: Sumar o alterar los exponentes al reducir términos
  semejantes (decir $3x^2 + 5x^2 = 8x^4$).** **Cómo corregirlo:** La reducción opera
  ÚNICAMENTE sobre los coeficientes; la parte literal $x^2$ permanece inalterada.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Reduzca la expresión 7xy + 12xy.
  alternativas:
  - 19xy
  - 19x^2y^2
  - 5xy
  - 84xy
  respuesta: 19xy
  solucion_pasos:
  - '1. Coeficientes de igual signo positivo: 7 + 12 = 19.'
  - '2. Conservar parte literal: 19xy.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de reducir -8m^2 - 5m^2?
  alternativas:
  - -13m^2
  - 13m^2
  - -3m^2
  - -13m^4
  respuesta: -13m^2
  solucion_pasos:
  - '1. Coeficientes de igual signo negativo: -(8 + 5) = -13.'
  - '2. Resultado: -13m^2.'
- titulo: ¿Es el resultado de sumar -4a^3 y -9a^3 igual a -13a^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, -(4 + 9) = -13, conservando a^3.
- titulo: ¿Al reducir 2x + 3x se deben sumar los exponentes para obtener 5x^2?
  respuesta: 'No'
  solucion_pasos:
  - No, al sumar términos semejantes los exponentes de las letras no se modifican
    (da 5x).
errores_frecuentes:
- Sumar los exponentes de la parte literal durante la reducción aditiva de términos
  semejantes.
- Cambiar el signo común negativo a positivo al sumar dos coeficientes negativos.
- Multiplicar los coeficientes en lugar de sumarlos aditivamente.
- Omitir la parte literal en el resultado final escribiendo sólo el coeficiente numérico.
- Declarar que los términos negativos de igual signo se anulan entre sí.
afirmaciones_verdaderas:
- Al reducir términos de igual signo se suman sus coeficientes y se mantiene la misma
  parte literal.
- Los exponentes de las variables permanecen completamente inalterados durante la
  suma aditiva.
al_terminar_debes_poder: Al terminar serás capaz de reducir términos semejantes de
  igual signo sumando sus coeficientes y conservando la parte literal e idéntica polaridad.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Reducción.
estado: publicado
semantic_id: MAT.ALG.REDUCCION_OPERATIVA.MISMO_SIGNO
