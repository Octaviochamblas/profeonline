semantic_id: MAT.ALG.REDUCCION_OPERATIVA.MISMO_SIGNO
resumen_inicial: 'Reducción de términos semejantes con igual signo: procedimiento
  y reglas en Reducción de términos semejantes.'
explicacion_simple: Cuando en una expresión algebraica aparecen varios términos que
  son de la misma familia y además tienen el mismo signo (todos positivos o todos
  negativos), reducirlos es tan simple como contar.
explicacion_formal: '### Definición formal


  La reducción de semejantes es una suma de coeficientes. El factor literal no cambia.


  ### Desarrollo didáctico


  Considera $3x + 5x + 2x$.

  Todos son de la familia $x$ y todos son positivos.

  Sumamos los coeficientes: $3 + 5 + 2 = 10$.

  El resultado es $10x$.


  En el caso negativo: $-4a - 7a$.

  Ambos son de la familia $a$ y ambos son negativos.

  Sumamos los valores absolutos: $4 + 7 = 11$.

  Como todos eran negativos, el resultado conserva el signo negativo: $-11a$.'
definiciones_clave: '- **Reducción de términos semejantes con igual signo**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a reducción de términos semejantes con igual signo.'
ejemplo_guiado:
  enunciado: Aplica reducción de términos semejantes con igual signo en una expresión
    algebraica.
  pasos:
