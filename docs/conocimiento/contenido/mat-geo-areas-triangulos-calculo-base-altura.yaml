semantic_id: MAT.GEO.AREAS_TRIANGULOS.CALCULO_BASE_ALTURA
resumen_inicial: 'Cálculo del área de un triángulo dada la base y la altura: conceptos,
  teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Con la fórmula A=(base×altura)/2 ya establecida, es momento de
  aplicarla directamente a ejercicios numéricos concretos.
explicacion_formal: '![Cálculo del área con base 9 y altura 6](/static/img/geometria/areas-pitagoras/areas-triangulos-calculo-base-altura.svg)


  ### Definición formal


  Dados base $b=9$ cm y altura $h=6$ cm, el área es $A=\frac{9\times6}{2}=\frac{54}{2}=27$
  cm².


  ### Desarrollo didáctico


  Este cálculo es una aplicación numérica directa de la fórmula A=(base×altura)/2,
  útil en cualquier problema donde se dan ambos datos explícitamente.'
