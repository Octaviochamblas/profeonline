propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del área de un triángulo dada la base
  y la altura.'
ejemplo_guiado:
  enunciado: Para analizar cálculo del área de un triángulo dada la base y la altura,
    considera un ángulo $\alpha = 124^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 999^\circ = 124^\circ$.
  pasos:
  - Identificar la propiedad de cálculo del área de un triángulo dada la base y la
    altura referida a $\alpha = 124^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 999 = 124 \implies x = 124 - 999$.'
  - Concluir que la medida calculada para cálculo del área de un triángulo dada la
    base y la altura es $x = -875^\circ$.
