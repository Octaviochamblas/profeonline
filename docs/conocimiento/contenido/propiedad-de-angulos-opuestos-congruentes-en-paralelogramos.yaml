semantic_id: MAT.GEO.PARALELOGRAMOS.ANGULOS_OPUESTOS_CONGRUENTES
resumen_inicial: En todo paralelogramo, los ángulos opuestos son congruentes y los ángulos consecutivos son suplementarios.
explicacion_simple: 'En un paralelogramo las esquinas opuestas son gemelas: tienen exactamente el mismo ángulo. Si una esquina mide 70°, la esquina del frente también medirá 70°.


  ¿Y cuánto miden las otras dos esquinas? Como los lados son paralelos, dos esquinas vecinas (consecutivas) siempre forman una línea continua y deben sumar **$180^\circ$**. Por eso, si una esquina mide 70°, la vecina medirá $180^\circ - 70^\circ = 110^\circ$. ¡Conocer un solo ángulo te permite descubrir de inmediato las cuatro esquinas!


  ![Ángulos opuestos y suplementarios en paralelogramos](/static/img/nodos/propiedad-de-angulos-opuestos-congruentes-en-paralelogramos-intro.svg)

  '
explicacion_formal: '### Teorema de los ángulos en el paralelogramo

  Sea $\mathcal{ABCD}$ un paralelogramo. Se verifican de manera simultánea e invariable dos leyes angulares:

  1. **Congruencia de ángulos opuestos:**

  $$\angle A \cong \angle C \quad \wedge \quad \angle B \cong \angle D$$

  2. **Suplementariedad de ángulos consecutivos:**

  $$\alpha + \beta = 180^\circ \quad (\angle A + \angle B = 180^\circ, \quad \angle B + \angle C = 180^\circ, \quad \text{etc.})$$


  ### Demostración geométrica

  - Como $\overline{AB} \parallel \overline{CD}$ y $\overline{AD}$ es secante transversal, los ángulos $\angle A$ y $\angle D$ son ángulos colaterales internos entre paralelas, lo que exige $\angle A + \angle D = 180^\circ$.

  - Análogamente, considerando $\overline{AD} \parallel \overline{BC}$ con secante $\overline{AB}$, se tiene $\angle A + \angle B = 180^\circ$.

  - Igualando ambas sumas: $\angle A + \angle D = \angle A + \angle B \implies \angle D = \angle B$.

  - Repitiendo el razonamiento para los vértices restantes se demuestra que $\angle A = \angle C$.


  > **Complemento didáctico:** Recuerda la regla mnemotécnica: ''Opuestos son iguales, vecinos suman 180°''. Nunca intentes sumar dos esquinas opuestas para que te den 180°; son las contiguas las que se complementan.

  '
definiciones_clave: '- **Ángulos opuestos**: Vértices no conectados directamente por un lado del paralelogramo.

  - **Ángulos consecutivos**: Vértices adyacentes que comparten un mismo lado de la figura.

  - **Ángulos suplementarios**: Dos ángulos cuya suma algebraica es exactamente $180^\circ$.

  - **Ángulos colaterales internos**: Ángulos situados en el mismo lado de la secante entre dos rectas paralelas.

  '
propiedades_relaciones: '- **Suma interior total**: Como en todo cuadrilátero, la suma de los cuatro ángulos es $2\alpha + 2\beta = 2(180^\circ) = 360^\circ$.

  - **Recíproco del teorema**: Si un cuadrilátero tiene sus ángulos opuestos congruentes de a pares, es garantizadamente un paralelogramo.

  - **Caso particular rectángulo**: Si un paralelogramo tiene un solo ángulo de $90^\circ$, sus cuatro ángulos serán obligatoriamente de $90^\circ$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulos opuestos](/static/img/nodos/propiedad-de-angulos-opuestos-congruentes-en-paralelogramos-ejemplos.svg)


    En un paralelogramo $ABCD$, el ángulo interior en el vértice $A$ mide $3x + 10^\circ$ y el ángulo interior consecutivo en el vértice $B$ mide $2x + 20^\circ$. Determina la medida de los cuatro ángulos del paralelogramo.'
  pasos:
  - 'Paso 1: Aplicar la propiedad de ángulos consecutivos suplementarios: $\angle A + \angle B = 180^\circ$.'
  - 'Paso 2: Plantear la ecuación: $(3x + 10^\circ) + (2x + 20^\circ) = 180^\circ \implies 5x + 30^\circ = 180^\circ$.'
  - 'Paso 3: Despejar $x$: $5x = 150^\circ \implies x = 30^\circ$.'
  - 'Paso 4: Calcular las medidas: $\angle A = 3(30^\circ) + 10^\circ = 100^\circ$; $\angle B = 2(30^\circ) + 20^\circ = 80^\circ$.'
  - 'Paso 5: Concluir con los opuestos: $\angle C = \angle A = 100^\circ$ y $\angle D = \angle B = 80^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un paralelogramo, uno de sus ángulos interiores mide 65°. ¿Cuánto mide cada uno de sus ángulos opuestos y consecutivos?
  choices:
  - text: El opuesto mide 65° y los dos consecutivos miden 115° cada uno.
    is_correct: true
  - text: El opuesto mide 115° y los consecutivos miden 65° cada uno.
    is_correct: false
  - text: Los cuatro ángulos deben medir obligatoriamente 65°.
    is_correct: false
  - text: El opuesto mide 180° y los consecutivos miden 90°.
    is_correct: false
  explanation: La alternativa correcta es 'El opuesto mide 65° y los dos consecutivos miden 115° cada uno.' Los ángulos opuestos son iguales ($65^\circ$) y los consecutivos son suplementarios ($180^\circ - 65^\circ = 115^\circ$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Si dos ángulos consecutivos de un paralelogramo están en la razón 1 : 3, ¿cuánto mide el menor de ellos?'
  choices:
  - text: 45°.
    is_correct: true
  - text: 60°.
    is_correct: false
  - text: 30°.
    is_correct: false
  - text: 90°.
    is_correct: false
  explanation: 'La alternativa correcta es ''45°.'' Como son suplementarios: $x + 3x = 180^\circ \implies 4x = 180^\circ \implies x = 45^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Reconocer si los ángulos dados son opuestos o consecutivos.

  2. Si son opuestos, plantear la igualdad: $\angle_1 = \angle_2$.

  3. Si son consecutivos, plantear la suma suplementaria: $\angle_1 + \angle_2 = 180^\circ$.

  4. Despejar las incógnitas y verificar que la suma de los 4 ángulos sea $360^\circ$.

  '
errores_correccion: '- **Error común 1:** Sumar ángulos opuestos buscando que den $180^\circ$. **Corrección:** Los opuestos son iguales; los que suman $180^\circ$ son los consecutivos.

  - **Error común 2:** Pensar que si un ángulo mide $90^\circ$, el vecino puede medir algo distinto. **Corrección:** Si un ángulo es $90^\circ$, el vecino es $180^\circ - 90^\circ = 90^\circ$, convirtiendo la figura en rectángulo.

  '
ejemplos:
- tipo: A
  titulo: Ángulo opuesto en paralelogramo
  enunciado: En un paralelogramo, un ángulo agudo mide $54^\circ$. ¿Cuánto mide su ángulo obtuso consecutivo?
  alternativas:
  - text: $126^\circ$.
    is_correct: true
  - text: $54^\circ$.
    is_correct: false
  - text: $136^\circ$.
    is_correct: false
  - text: $90^\circ$.
    is_correct: false
  explicacion: 'Por suplementariedad: $180^\circ - 54^\circ = 126^\circ$.'
- tipo: B
  titulo: Ángulos consecutivos iguales
  enunciado: ¿Pueden dos ángulos consecutivos de un paralelogramo ser iguales?
  respuesta: Sí
  explicacion: Sí, ocurre cuando cada uno mide $90^\circ$ (en el rectángulo y en el cuadrado).
errores_frecuentes:
- '''Confundir la relación de igualdad de los opuestos con la de suplementariedad de los consecutivos.'''
- '''Calcular la suma interior de un paralelogramo como si fuera un triángulo ($180^\circ$ en vez de $360^\circ$).'''
- '''Restar de $90^\circ$ en lugar de $180^\circ$ al buscar el ángulo adyacente.'''
afirmaciones_verdaderas:
- '''En todo paralelogramo, los ángulos opuestos son de igual medida.'''
- '''Los ángulos consecutivos de un paralelogramo siempre suman $180^\circ$.'''
- '''Si un paralelogramo tiene un ángulo recto, los cuatro ángulos son rectos.'''
al_terminar_debes_poder: '**QUÉ:** Calcular las medidas de todos los ángulos interiores de un paralelogramo conociendo uno de ellos o una relación algebraica.


  **CÓMO:** Aplicando las propiedades $\angle A \cong \angle C$ y $\alpha + \beta = 180^\circ$ derivadas del paralelismo entre rectas.


  ![Síntesis de ángulos opuestos](/static/img/nodos/propiedad-de-angulos-opuestos-congruentes-en-paralelogramos-resumen.svg)

  '
