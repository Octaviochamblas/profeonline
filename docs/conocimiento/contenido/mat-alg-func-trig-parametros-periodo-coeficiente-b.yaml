semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.PERIODO_COEFICIENTE_B
resumen_inicial: 'Cálculo analítico del período fundamental $T$ en funciones senoidales y cosenoidales mediante la fórmula $T = \frac{2\pi}{|B|}$.'
explicacion_simple: |
  El coeficiente **$B$** dentro de una función trigonométrica (como en $\sin(Bx)$ o $\cos(Bx)$) actúa como un acelerador del tiempo o de la distancia. Si $B$ es mayor que 1 (ejemplo: $\sin(2x)$), la onda viaja el doble de rápido y se **aprieta horizontalmente**, por lo que necesita menos espacio para completar un ciclo completo. Si $B$ es una fracción menor que 1 (ejemplo: $\sin(0.5x)$), la onda viaja más lento y se **estira horizontalmente**. El nuevo período $T$ se calcula siempre dividiendo $2\pi$ entre $|B|$.
explicacion_formal: |
  ### Definición formal
  Sea la función periódica armónica $f(x) = A\sin(Bx + C) + D$ o $g(x) = A\cos(Bx + C) + D$ con $B \in \mathbb{R} \setminus \{0\}$. El **período fundamental** $T$ (longitud de la menor ventana de repetición) se obtiene mediante la ecuación de escalamiento horizontal:
  $$T = \frac{2\pi}{|B|}$$

  ### Desglose simbólico
  - $|B| > 1$: Compresión horizontal por un factor de $\frac{1}{|B|} \implies$ Período $T < 2\pi$.
  - $0 < |B| < 1$: Dilatación horizontal por un factor de $\frac{1}{|B|} \implies$ Período $T > 2\pi$.
  - $|B| = 1$: Período base $T = 2\pi$.

  ### Síntesis didáctica
  Existe una **relación inversamente proporcional** entre la magnitud del coeficiente $|B|$ y la longitud del período $T$. Al duplicar el coeficiente $B$, el período se reduce a la mitad; al triplicar $B$, el período se reduce a la tercera parte.
definiciones_clave: |
  - **Frecuencia angular ($B$)**: Coeficiente multiplicativo de la variable independiente $x$ dentro del argumento trigonométrico.
  - **Período fundamental ($T$)**: Menor intervalo continuo del eje X necesario para trazar una oscilación completa.
  - **Relación inversa**: Regla matemática por la cual mayor valor de $|B|$ implica menor longitud de período $T$.
propiedades_relaciones: |
  - **Forma extendida de funciones con $\pi$**: Si $B$ contiene al número $\pi$ (ejemplo: $f(x) = \sin(2\pi x)$), el período resulta ser un número racional sin $\pi$ ($T = \frac{2\pi}{2\pi} = 1$).
  - **Independencia de $A, C, D$**: Ningún otro parámetro ($A$, $C$ o $D$) altera el cálculo del período.
ejemplo_guiado:
  enunciado: 'Calcula el período fundamental $T$ de la función $f(x) = 3\sin\left(\frac{4\pi}{3}x - \frac{\pi}{6}\right) + 2$.'
  pasos:
    - 'Paso 1: Identificar el coeficiente multiplicativo de la variable $x$: $B = \frac{4\pi}{3}$.'
    - 'Paso 2: Aplicar la fórmula del período fundamental: $T = \frac{2\pi}{|B|} = \frac{2\pi}{\frac{4\pi}{3}}$.'
    - 'Paso 3: Resolver la división de fracciones: $T = 2\pi \cdot \frac{3}{4\pi}$.'
    - 'Paso 4: Simplificar la constante $\pi$ y los factores numéricos: $T = \frac{6}{4} = \frac{3}{2} = 1.5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el período fundamental de la función senoidal $f(x) = \sin(5x)$?'
    choices:
      - {text: '$T = \frac{2\pi}{5}$', is_correct: true}
      - {text: '$T = 5\pi$', is_correct: false}
      - {text: '$T = \frac{\pi}{5}$', is_correct: false}
      - {text: '$T = 10\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$T = \frac{2\pi}{5}$''. Aplicando la fórmula $T = \frac{2\pi}{|B|}$ con $B = 5$, resulta $T = \frac{2\pi}{5}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función coseno tiene la forma $g(x) = \cos(\pi x)$, ¿cuál es el valor exacto de su período $T$?'
    choices:
      - {text: '$2$', is_correct: true}
      - {text: '$2\pi$', is_correct: false}
      - {text: '$\pi$', is_correct: false}
      - {text: '$1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$2$''. Aplicando $T = \frac{2\pi}{\pi}$, el número $\pi$ se simplifica dando $T = 2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar y aislar el coeficiente $B$ que multiplica directamente a la variable $x$.'
  - 'Paso 2: Tomar la magnitud positiva aplicando el valor absoluto $|B|$.'
  - 'Paso 3: Plantear el cociente $T = \frac{2\pi}{|B|}$.'
  - 'Paso 4: Simplificar la fracción algebraica para expresar $T$ en su forma más reducida.'
errores_correccion: |
  - **Error 1:** Multiplicar $2\pi$ por $B$ en lugar de dividir. **Cómo corregirlo:** La relación entre la frecuencia $B$ y la longitud del período es inversa: a mayor $B$, menor $T$. Por lo tanto, se debe dividir $2\pi / |B|$.
  - **Error 2:** Incluir los parámetros $A$ o $D$ en el cálculo del período. **Cómo corregirlo:** $A$ y $D$ controlan el eje vertical Y; el período $T$ se mide en el eje horizontal X y depende únicamente de $B$.
ejemplos:
  - titulo: 'Período con coeficiente fractional'
    enunciado: '¿Cuál es el período de $f(x) = \cos\left(\frac{x}{4}\right)$?'
    alternativas:
      - '$8\pi$'
      - '$2\pi$'
      - '$\frac{\pi}{2}$'
    respuesta: '$8\pi$'
    solucion_pasos:
      - '1. $B = \frac{1}{4}$.'
      - '2. $T = \frac{2\pi}{1/4} = 8\pi$.'
  - titulo: 'Período con B negativo'
    enunciado: '¿Cuál es el período de $g(x) = \sin(-3x)$?'
    alternativas:
      - '$\frac{2\pi}{3}$'
      - '$-\frac{2\pi}{3}$'
      - '$6\pi$'
    respuesta: '$\frac{2\pi}{3}$'
    solucion_pasos:
      - '1. Tomamos $|B| = |-3| = 3$.'
      - '2. $T = \frac{2\pi}{3}$. El período es siempre una cantidad positiva.'
  - titulo: 'Compresión horizontal'
    enunciado: '¿Al aumentar $B$ de $1$ a $10$, la gráfica completa más ciclos en el mismo intervalo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues el período se reduce a $T = \frac{2\pi}{10} = \frac{\pi}{5}$, comprimiendo la onda.'
  - titulo: 'Independencia de desfase'
    enunciado: '¿Las funciones $\sin(2x)$ y $\sin(2x + 100)$ tienen exactamente el mismo período $T = \pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el parámetro $C = 100$ desplaza la gráfica pero no altera su período $T = \frac{2\pi}{2} = \pi$.'
errores_frecuentes:
  - 'La afirmación de que el período fundamental de una función trigonométrica se calcula multiplicando $2\pi \cdot B$.'
  - 'La afirmación de que si el coeficiente $B$ es negativo, el período resultante es una cantidad negativa.'
  - 'La afirmación de que el aumento de la amplitud $A$ altera la longitud del período horizontal de la gráfica.'
  - 'La afirmación de que para la función $y = \sin(3x)$ la gráfica realiza un ciclo completo cada $6\pi$ unidades.'
  - 'La afirmación de que el parámetro de desplazamiento vertical $D$ acorta el período de la onda.'
afirmaciones_verdaderas:
  - 'El período fundamental de las funciones senoidales y cosenoidales viene dado estrictamente por la fórmula de escalamiento $T = \frac{2\pi}{|B|}$.'
  - 'Existe una relación inversamente proporcional entre el coeficiente $|B|$ y el período $T$: a mayor valor de $|B|$, menor es la longitud horizontal del ciclo.'
al_terminar_debes_poder: |
  QUÉ: Calcular e interpretar el período fundamental $T$ a partir del coeficiente de frecuencia $B$.
  CÓMO: Extraer el coeficiente $|B|$ de la variable $x$ y evaluar la fórmula $T = \frac{2\pi}{|B|}$.
