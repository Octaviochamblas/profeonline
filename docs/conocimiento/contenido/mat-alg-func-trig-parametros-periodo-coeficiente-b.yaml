semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.PERIODO_COEFICIENTE_B
resumen_inicial: 'Cálculo del período según el coeficiente B: círculo unitario, amplitud,
  período y transformaciones de Parámetros y transformaciones de funciones periódicas.'
explicacion_simple: El coeficiente que multiplica a la variable dentro del seno o
  coseno controla qué tan rápido se completa cada ciclo de la oscilación.
explicacion_formal: '### Definición formal


  Para que $f(x+T)=f(x)$, se necesita que $b(x+T)=bx+2\pi$ (una vuelta completa adicional),
  lo que da $bT=2\pi$, y despejando, $T=\dfrac{2\pi}{|b|}$. Si $b=1$, se recupera
  el periodo básico $2\pi$.


  ### Desarrollo didáctico


  $f(x)=\sin(2x)$ tiene periodo $T=2\pi/2=\pi$: completa un ciclo el doble de rápido
  que $\sin(x)$. $f(x)=\cos(x/2)$ tiene periodo $T=2\pi/(1/2)=4\pi$: completa un ciclo
  el doble de lento.'
definiciones_clave: '- **Cálculo del período según el coeficiente B**: Función periódica
  fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a cálculo del período según el coeficiente b.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    cálculo del período según el coeficiente b.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de cálculo del período según el coeficiente b.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
