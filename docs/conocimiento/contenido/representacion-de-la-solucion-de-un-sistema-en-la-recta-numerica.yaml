semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.REPRESENTACION_RECTA
resumen_inicial: Representar un sistema en la recta numérica consiste en dibujar los sombreados de ambas inecuaciones e identificar la zona donde se traslapan.
explicacion_simple: '![Representación de la solución de un sistema en la recta numérica](/static/img/nodos/representacion-de-la-solucion-de-un-sistema-en-la-recta-numerica-intro.svg)


  Para graficar un sistema de inecuaciones en la recta real:

  1. Dibujamos el primer intervalo $S_1$ con un tipo de rayado o color.

  2. Dibujamos el segundo intervalo $S_2$ con otro tipo de rayado o color en la misma recta.

  3. La zona donde coinciden **ambos rayados a la vez** es la gráfica de la solución final del sistema.'
explicacion_formal: 'La **representación visual del sistema** es la superposición sobre la recta real de las regiones $S_1, S_2 \subset \mathbb{R}$:


  $$S_{\text{gráfica}} = \text{Región con doble rayado cruzado } S_1 \cap S_2$$


  **Desglose de la fórmula:**

  - Utiliza marcas de extremo en $a$ y $b$ (puntos llenos $\bullet$ o vacíos $\circ$) delimitando el tramo con doble sombreado.'
definiciones_clave: '- **Doble rayado / traslape**: Región gráfica de la recta real donde se cruzan simultáneamente los sombreados de todas las inecuaciones del sistema.'
propiedades_relaciones: '- **Verificación visual del borde**: Si en un borde un intervalo tiene punto vacío ($\circ$) y el otro punto lleno ($\bullet$), la intersección en ese borde es ABIERTA.'
ejemplo_guiado:
  enunciado: '![Ejemplo Representación de la solución de un sistema en la recta numérica](/static/img/nodos/representacion-de-la-solucion-de-un-sistema-en-la-recta-numerica-ejemplos.svg)


    Grafica el sistema con soluciones $S_1 = ]1, +\infty[$ y $S_2 = ]-\infty, 6]$ en la recta numérica e identifica la región de doble rayado.'
  pasos:
  - 'Paso 1: Dibujar la recta real ubicando los números $1$ y $6$.Paso 2: Trazar el rayado de $S_1$: desde $1$ (círculo vacío $\circ$) hacia la derecha.Paso 3: Trazar el rayado de $S_2$: desde $6$ (punto lleno $\bullet$) hacia la izquierda.Paso 4: Identificar la zona donde se cruzan ambos rayados: el tramo comprendido entre $1$ y $6$.Paso 5: Concluir que la gráfica del sistema es el intervalo $]1, 6]$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la gráfica de un sistema de inecuaciones, ¿qué región representa la solución final?
  choices:
  - text: La franja de la recta donde se superponen ambos rayados a la vez.
    is_correct: true
  - text: Toda la recta numérica completa.
    is_correct: false
  - text: Solo las zonas donde hay un solo rayado.
    is_correct: false
  - text: El espacio en blanco sin rayar.
    is_correct: false
  explanation: La alternativa correcta es 'La franja de la recta donde se superponen ambos rayados a la vez.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al graficar $S_1 = ]1, +\infty[$ y $S_2 = ]-\infty, 6]$, ¿cómo quedan las marcas en los extremos $1$ y $6$ de la solución final?
  choices:
  - text: Círculo vacío en $1$ y punto relleno en $6$.
    is_correct: true
  - text: Punto relleno en $1$ y círculo vacío en $6$.
    is_correct: false
  - text: Ambos puntos rellenos.
    is_correct: false
  - text: Ambos círculos vacíos.
    is_correct: false
  explanation: La alternativa correcta es 'Círculo vacío en $1$ y punto relleno en $6$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar una recta numérica real y marcar todas las cotas numéricas del sistema.'
- 'Paso 2: Sombrear el conjunto $S_1$ con líneas inclinadas a la derecha.'
- 'Paso 3: Sombrear el conjunto $S_2$ con líneas inclinadas a la izquierda.'
- 'Paso 4: Destacar el tramo con el entramado cruzado de doble rayado.'
errores_correccion: '- **Error común:** Tomar como solución del sistema las zonas que tienen un único rayado.

  - **Cómo corregirlo:** La solución exige pertenecer a AMBAS inecuaciones; por ende, solo sirve la zona con DOBLE RAYADO.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de un sistema de inecuaciones requiere calcular la intersección de soluciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se exige la simultaneidad de todas las desigualdades.
- titulo: ¿Si dos intervalos no se cruzan en la recta numérica el sistema no tiene solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección es vacía ($S = \\emptyset$).
errores_frecuentes:
- En la gráfica de un sistema, la solución global se representa mediante la suma de todas las zonas sombreadas aunque no se crucen.
- Al graficar el sistema $x > 1$ y $x \le 6$, la región solución es la zona no sombreada de la recta.
- Para visualizar la solución de un sistema se deben dibujar dos rectas numéricas paralelas en planos distintos.
- La representación gráfica de la solución de un sistema utiliza puntos cerrados únicamente si el sistema no tiene solución.
- Un tramo con doble sombreado sobre la recta real representa el conjunto de valores que violan el sistema.
afirmaciones_verdaderas:
- La solución de un sistema en la recta numérica corresponde a la región que cuenta con el solapamiento o doble sombreado de todas las inecuaciones.
- Graficar todas las desigualdades en un mismo eje permite visualizar rápidamente los límites superior e inferior de la intersección.
al_terminar_debes_poder: '**QUÉ:** Graficar e interpretar la solución del sistema en la recta numérica.


  **CÓMO:** Superponiendo los sombreados de cada inecuación en una misma recta y destacando el tramo con doble rayado.


  ![Resumen Representación de la solución de un sistema en la recta numérica](/static/img/nodos/representacion-de-la-solucion-de-un-sistema-en-la-recta-numerica-resumen.svg)'
