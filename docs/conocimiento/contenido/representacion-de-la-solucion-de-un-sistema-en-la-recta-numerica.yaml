procedimiento:
- Resolver cada inecuación del sistema por separado hasta obtener su intervalo solución.
- Trazar una recta numérica marcando los valores críticos obtenidos.
- Graficar sobre la recta cada intervalo con distintos trazos o alturas, prestando
  atención al uso de puntos abiertos (sin incluir) y cerrados (incluidos).
- Identificar visualmente la región de la recta que está cubierta por las gráficas
  de todas las inecuaciones.
- Escribir el intervalo correspondiente a esa región común como el conjunto solución
  del sistema.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en representación de la solución
  de un sistema en la recta numérica.
ejemplos:
- titulo: Sistema con solución acotada
  enunciado: Resuelve gráficamente el sistema formado por $x > 2$ y $x \\leq 5$.
  solucion_pasos:
  - En la recta numérica, marcamos un círculo abierto en $2$ y sombreamos hacia la
    derecha.
  - Marcamos un círculo cerrado en $5$ y sombreamos hacia la izquierda.
  - La zona donde ambos sombreados coinciden es desde el $2$ (sin incluir) hasta el
    $5$ (incluido).
  - El conjunto solución es $(2, 5]$.
- titulo: Sistema sin solución
  enunciado: Representa y resuelve el sistema dado por $x < -1$ y $x \\geq 3$.
  solucion_pasos:
  - Dibujamos la recta numérica. Desde $-1$, con círculo abierto, sombreamos hacia
    la izquierda.
  - Desde $3$, con círculo cerrado, sombreamos hacia la derecha.
  - Observamos que no existe ninguna región superpuesta entre ambos gráficos.
  - El sistema no tiene solución (conjunto vacío $\\emptyset$).
- titulo: ¿Corresponde el intervalo a la intersección?
  respuesta: Verdadero
  solucion_pasos:
  - Analizamos el sistema $2x \\geq 4$ y $x < 6$.
  - Resolvemos la primera - $x \\geq 2$. La segunda ya está despejada - $x < 6$.
  - La representación visual de $x \\geq 2$ y $x < 6$ se solapa entre el $2$ y el
    $6$.
  - La intersección es correcta - $[2, 6)$.
- titulo: ¿Es correcto el gráfico resultante?
  respuesta: Falso
  solucion_pasos:
  - Sistema - $x > 0$ y $x > 4$. Se afirma que la solución es el intervalo $(0, 4)$.
  - Trazamos $x > 0$ (derecha desde $0$) y $x > 4$ (derecha desde $4$).
  - La región donde ambos coinciden inicia en $4$ y continúa hasta el infinito.
  - El conjunto solución real es $(4, \\infty)$, no $(0, 4)$.
errores_frecuentes:
- Unir (sumar) los intervalos en lugar de buscar la zona de intersección.
- Confundir los puntos abiertos y cerrados al leer la intersección gráfica en los
  extremos.
- Asumir erróneamente que un sistema siempre tiene solución.
- Olvidar resolver las inecuaciones previamente y tratar de graficar directamente
  expresiones sin despejar.
- Identificar como solución una zona donde se cumple solo una inecuación de un sistema
  de tres o más.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  representación de la solución de un sistema en la recta numérica.
