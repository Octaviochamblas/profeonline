semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.REPRESENTACION_RECTA
resumen_inicial: 'Representación de la solución de un sistema en la recta numérica:
  relaciones de orden, intervalos y resolución en Sistemas de inecuaciones lineales
  con una incógnita.'
explicacion_simple: Un sistema de inecuaciones lineales se compone de varias inecuaciones
  que deben cumplirse simultáneamente. Su resolución requiere encontrar los valores
  comunes que satisfacen todas las condiciones, siendo la recta numérica la herramienta
  gráfica ideal para visualizar esta intersección.
explicacion_formal: '### Definición formal

  Dado un sistema formado por inecuaciones $\\{ I_1, I_2, \\dots, I_n \\}$ con conjuntos
  solución respectivos $S_1, S_2, \\dots, S_n$, el conjunto solución del sistema $S$
  es la intersección de estos conjuntos - $S = S_1 \\cap S_2 \\cap \\dots \\cap S_n$.
  Gráficamente, esto equivale al segmento de la recta real que está sombreado simultáneamente
  por todos los intervalos involucrados.


  ### Desarrollo didáctico

  Para visualizar un sistema, dibujamos una única recta real. Asignamos a cada inecuación
  una representación gráfica sobre ella, utilizando un círculo vacío para desigualdades
  estrictas ($<$ o $>$) y un círculo relleno para aquellas que incluyen la igualdad
  ($\\leq$ o $\\geq$). A partir de cada punto crítico, extendemos una línea o zona
  sombreada hacia la dirección que indique la desigualdad. La solución final del sistema
  corresponde exclusivamente a aquella parte de la recta donde todas las líneas coinciden
  o se superponen. Si no existe ninguna zona de superposición total, el sistema no
  tiene solución (conjunto vacío).'
definiciones_clave: '- **Representación de la solución de un sistema en la recta numérica**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a representación de la solución de un sistema
  en la recta numérica.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de representación
    de la solución de un sistema en la recta numérica.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de representación de la solución de un sistema
    en la recta numérica, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
