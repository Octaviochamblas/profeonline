semantic_id: MAT.NUM.NOTACION_CIENTIFICA.ADICION_SUSTRACCION
resumen_inicial: 'Para sumar o restar números en notación científica con igual exponente, se operan las mantisas y se conserva la potencia de diez común: $a \cdot 10^n \pm b \cdot 10^n = (a \pm b) \cdot 10^n$.'
explicacion_simple: '![Adición y sustracción en notación científica con igual exponente](/static/img/nodos/adicion-y-sustraccion-en-notacion-cientifica-con-igual-exponente-intro.svg)


  Sumar o restar números en notación científica cuando tienen **el mismo exponente** de diez es exactamente como sumar términos semejantes en álgebra:

  - La potencia $10^n$ se comporta como una variable común que se mantiene intacta.

  - Solo sumas o restas los números de adelante (las mantisas $a \pm b$).

  - **¡Regla de oro!** Los exponentes de diez **NUNCA se suman ni se restan** en la suma ($2 \cdot 10^3 + 4 \cdot 10^3 = 6 \cdot 10^3$, no $6 \cdot 10^6$). Si tras la suma la mantisa queda $\ge 10$, se renormaliza sumando $1$ al exponente.'
explicacion_formal: "Sean $x = a \\cdot 10^n$ e $y = b \\cdot 10^n$ dos números en notación científica con idéntico orden de magnitud $n \\in \\mathbb{Z}$. Por la propiedad distributiva de la multiplicación respecto a la adición y sustracción en $\\mathbb{R}$:\n\n$$x \\pm y = (a \\pm b) \\cdot 10^n$$\n\n**Fase de Renormalización del resultado:**\n- **En la adición ($a + b$):** Como $1 \\le a, b < 10$, la suma satisface $2 \\le a + b < 20$.\n  - Si $a + b \\ge 10$: Se define $k = \\frac{a+b}{10}$ y la suma normalizada es $k \\cdot 10^{n+1}$.\n- **En la sustracción ($a - b$):** Si $|a - b| < 1$, se traslada la coma a la derecha y se decrementa el exponente: $k \\cdot 10^{n-1}$."
definiciones_clave: '- **Factorización por potencia común**: Extracción de $10^n$ como factor común de la operación.

  - **Términos semejantes de orden $n$**: Cantidades que comparten la misma escala decimal.'
propiedades_relaciones: '- **Preservación estricta de escala**: $10^n \pm 10^n \neq 10^{2n}$ (la suma no altera el orden de magnitud salvo desborde por acarreo).

  - **Distributividad**: $(a + b) \cdot 10^n = a \cdot 10^n + b \cdot 10^n$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de suma y resta con igual exponente](/static/img/nodos/adicion-y-sustraccion-en-notacion-cientifica-con-igual-exponente-ejemplos.svg)


    Calcule y exprese en notación científica normalizada las operaciones $4,2 \cdot 10^5 + 3,1 \cdot 10^5$, $8,5 \cdot 10^{-3} - 3,2 \cdot 10^{-3}$ y $7,5 \cdot 10^4 + 6,5 \cdot 10^4$.'
  pasos:
  - 'Paso 1: Evaluar $4,2 \cdot 10^5 + 3,1 \cdot 10^5$: Exponente común $5$. Sumar mantisas: $(4,2 + 3,1) \cdot 10^5 = 7,3 \cdot 10^5$ (ya normalizado).'
  - 'Paso 2: Evaluar $8,5 \cdot 10^{-3} - 3,2 \cdot 10^{-3}$: Exponente común $-3$. Restar mantisas: $(8,5 - 3,2) \cdot 10^{-3} = 5,3 \cdot 10^{-3}$.'
  - 'Paso 3: Evaluar $7,5 \cdot 10^4 + 6,5 \cdot 10^4$: Sumar mantisas: $7,5 + 6,5 = 14$. Queda $14 \cdot 10^4$. Normalizar: $14 = 1,4 \cdot 10^1 \implies 1,4 \cdot 10^5$.'
  - 'Conclusión: Los resultados son $7,3 \cdot 10^5$, $5,3 \cdot 10^{-3}$ y $1,4 \cdot 10^5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de calcular $3 \cdot 10^4 + 5 \cdot 10^4$?
  choices:
  - text: $8 \cdot 10^4$ (sumando las mantisas $3 + 5 = 8$ y conservando $10^4$)
    is_correct: true
  - text: $8 \cdot 10^8$
    is_correct: false
  - text: $15 \cdot 10^4$
    is_correct: false
  - text: $8 \cdot 100^4$
    is_correct: false
  explanation: La alternativa correcta es '$8 \cdot 10^4$ (sumando las mantisas $3 + 5 = 8$ y conservando $10^4$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $7,5 \cdot 10^4 + 6,5 \cdot 10^4$ terminó con exponente $5$?
  choices:
  - text: Porque $7,5 + 6,5 = 14$, y al normalizar $14$ a $1,4$ se sumó $1$ al exponente ($4 + 1 = 5$)
    is_correct: true
  - text: Porque los exponentes $4 + 4$ se sumaron
    is_correct: false
  - text: Porque siempre se aumenta el exponente en sumas
    is_correct: false
  - text: Fue un error de aproximación
    is_correct: false
  explanation: La alternativa correcta es 'Porque $7,5 + 6,5 = 14$, y al normalizar $14$ a $1,4$ se sumó $1$ al exponente ($4 + 1 = 5$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que ambos términos compartan el mismo exponente en la potencia de diez ($10^n$).'
- 'Paso 2: Sumar o restar los coeficientes manteniendo la potencia de diez como factor común: $(a \pm b) \cdot 10^n$.'
- 'Paso 3: Verificar la mantisa resultante y renormalizar desplazando la coma si $(a \pm b) \ge 10$ o $< 1$.'
errores_correccion: '- **Error 1: Sumar los exponentes de diez ($2 \cdot 10^3 + 3 \cdot 10^3 = 5 \cdot 10^6$).** **Cómo corregirlo:** La potencia $10^3$ es un factor común ($2000 + 3000 = 5000 = 5 \cdot 10^3$). ¡Los exponentes NO se suman!

  - **Error 2: No renormalizar tras sumas que superan 10 ($6 \cdot 10^4 + 8 \cdot 10^4 = 14 \cdot 10^4$).** **Cómo corregirlo:** Escribir $1,4 \cdot 10^5$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $5,1 \cdot 10^6 + 2,3 \cdot 10^6$?
  alternativas:
  - $7,4 \cdot 10^6$
  - $7,4 \cdot 10^{12}$
  - $74 \cdot 10^5$
  respuesta: $7,4 \cdot 10^6$
  solucion_pasos:
  - $(5,1 + 2,3) \cdot 10^6 = 7,4 \cdot 10^6$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de $9 \cdot 10^{-4} - 4 \cdot 10^{-4}$?
  alternativas:
  - $5 \cdot 10^{-4}$
  - $5 \cdot 10^{-8}$
  - $5 \cdot 10^0$
  respuesta: $5 \cdot 10^{-4}$
  solucion_pasos:
  - $(9 - 4) \cdot 10^{-4} = 5 \cdot 10^{-4}$.
- titulo: ¿Es 3 · 10² + 4 · 10² igual a 7 · 10⁴?
  respuesta: 'No'
  solucion_pasos:
  - No, $300 + 400 = 700 = 7 \cdot 10^2$, el exponente no se suma.
  alternativas:
  - texto: No, el exponente común se conserva (es 7 · 10² = 700)
    es_correcta: true
    retroalimentacion: ¡Correcto! Los exponentes nunca se suman en la adición.
  - texto: Sí, se suman las mantisas y los exponentes
    es_correcta: false
    retroalimentacion: Incorrecto, $7 \cdot 10^4 = 70.000 \neq 700$.
  - texto: No, es igual a 12 · 10²
    es_correcta: false
    retroalimentacion: Incorrecto, las mantisas se suman ($3 + 4 = 7$).
- titulo: ¿Es 8 · 10⁵ + 7 · 10⁵ igual a 1,5 · 10⁶?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(8 + 7) \cdot 10^5 = 15 \cdot 10^5 = 1,5 \cdot 10^6$.
  alternativas:
  - texto: Sí, 15 · 10⁵ normalizado es 1,5 · 10⁶
    es_correcta: true
    retroalimentacion: ¡Correcto! Al superar 10 se suma 1 al exponente.
  - texto: No, es igual a 15 · 10⁵
    es_correcta: false
    retroalimentacion: Incorrecto, falta normalizar la mantisa.
  - texto: No, es igual a 1,5 · 10¹⁰
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes no se duplican.
errores_frecuentes:
- Sumar o restar los exponentes de diez al sumar las cantidades.
- Olvidar normalizar cuando la suma de mantisas es mayor o igual a 10.
- Olvidar renormalizar cuando la resta de mantisas es menor a 1.
- Intentar sumar directamente números con exponentes distintos sin igualar escalas.
- Multiplicar las potencias de diez en vez de factorizarlas.
afirmaciones_verdaderas:
- Para sumar números en notación científica con igual exponente se operan las mantisas y se conserva $10^n$.
- La potencia común $10^n$ actúa algebraicamente como un término semejante.
- Si la adición de mantisas genera un valor $\ge 10$, se normaliza sumando 1 al exponente.
al_terminar_debes_poder: '![Síntesis de suma y resta](/static/img/nodos/adicion-y-sustraccion-en-notacion-cientifica-con-igual-exponente-resumen.svg)


  QUÉ: Sumar y restar números en notación científica que comparten el mismo exponente.


  CÓMO: Factorizando la potencia común $10^n$, sumando o restando las mantisas $(a \pm b) \cdot 10^n$, conservando inalterado el exponente y renormalizando el resultado si la mantisa obtenida no pertenece al intervalo $[1, 10)$.'
