semantic_id: MAT.NUM.NOTACION_CIENTIFICA.ADICION_SUSTRACCION
resumen_inicial: Para sumar o restar números en notación científica que tienen el
  MISMO exponente en la potencia de 10, se suman o restan los coeficientes y se mantiene
  la potencia común ($a \cdot 10^n \pm b \cdot 10^n = (a \pm b) \cdot 10^n$).
explicacion_simple: 'Para sumar o restar números en notación científica cuando los
  10 tienen el mismo exponente:

  1. Sumas o restas los coeficientes principales.

  2. Mantienes la potencia de 10 exactamente igual.

  3. Si el resultado deja de cumplir $1 \le k < 10$, se reajusta la coma.

  Ejemplo: $3{,}2 \cdot 10^5 + 4{,}1 \cdot 10^5 = (3{,}2 + 4{,}1) \cdot 10^5 = 7{,}3
  \cdot 10^5$.'
explicacion_formal: 'Por la propiedad distributiva del factor común $10^n$, se tiene:

  $$a \cdot 10^n \pm b \cdot 10^n = (a \pm b) \cdot 10^n$$

  Esta operación exige que los exponentes sean estrictamente idénticos.'
definiciones_clave: '- **Factorización de la potencia común**: Extracción de $10^n$
  como factor común en sumas o restas.'
propiedades_relaciones: '- **Exponente constante**: En la suma o resta con igual exponente,
  la potencia $10^n$ no cambia su exponente.'
ejemplo_guiado:
  enunciado: Calcula $5{,}4 \cdot 10^6 - 2{,}1 \cdot 10^6$.
  pasos:
  - Verificar que las potencias de 10 tengan el mismo exponente ($n = 6$).
  - 'Restar los coeficientes: $5{,}4 - 2{,}1 = 3{,}3$.'
  - Conservar la potencia $10^6$.
  - 'Escribir el resultado: $3{,}3 \cdot 10^6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual la suma $2{,}5 \cdot 10^4 + 3{,}5 \cdot 10^4$ en notación
    científica?
  choices:
  - text: 6 · 10^4
    is_correct: true
  - text: 6 · 10^8
    is_correct: false
  - text: 5,0 · 10^4
    is_correct: false
  - text: 60 · 10^4
    is_correct: false
  explanation: 'La correcta es: 6 · 10^4. Sumamos coeficientes ($2{,}5 + 3{,}5 = 6$)
    y mantenemos $10^4$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $8 \cdot 10^3 + 5 \cdot 10^3$ en notación científica estándar.
  choices:
  - text: 1,3 · 10^4
    is_correct: true
  - text: 13 · 10^3
    is_correct: false
  - text: 1,3 · 10^3
    is_correct: false
  - text: 13 · 10^6
    is_correct: false
  explanation: 'La correcta es: 1,3 · 10^4. $8 + 5 = 13$, de modo que $13 \cdot 10^3
    = 1{,}3 \cdot 10^4$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que las potencias de 10 compartan el mismo exponente.'
- 'Paso 2: Sumar o restar los coeficientes numéricos.'
- 'Paso 3: Conservar la potencia $10^n$ sin alterar su exponente.'
- 'Paso 4: Normalizar el resultado final si la mantisa obtenida no está en el rango
  $[1, 10[$.'
errores_correccion: No sumes ni restes los exponentes de 10. $3 \cdot 10^4 + 2 \cdot
  10^4 = 5 \cdot 10^4$, NUNCA $5 \cdot 10^8$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $7 \cdot 10^5 - 4 \cdot 10^5$.
  alternativas:
  - 3 · 10^5
  - 3 · 10^0
  - 3 · 10^{10}
  respuesta: 3 · 10^5
  solucion_pasos:
  - $(7 - 4) \cdot 10^5 = 3 \cdot 10^5$.
errores_frecuentes:
- Sumar los exponentes al sumar números en notación científica.
afirmaciones_verdaderas:
- $a \cdot 10^n \pm b \cdot 10^n = (a \pm b) \cdot 10^n$.
al_terminar_debes_ponder: Sumar y restar términos en notación científica con exponente
  común.
fuente: Texto escolar MINEDUC.
estado: publicado
