semantic_id: MAT.NUM.NOTACION_CIENTIFICA.ADICION_SUSTRACCION
resumen_inicial: 'Para sumar o restar números en notación científica con igual exponente
  $(a \cdot 10^n) \pm (b \cdot 10^n)$, se suman o restan los coeficientes $(a \pm
  b)$ y se factoriza la potencia de diez común: $(a \pm b) \cdot 10^n$.'
explicacion_simple: Si los números en notación científica tienen exactamente el mismo
  exponente en el 10, podemos sumar o restar directamente los números de adelante
  y dejar la misma potencia de 10 como factor común. Si los exponentes son distintos,
  primero hay que igualarlos.
explicacion_formal: 'Dados $x = a \cdot 10^n$ y $y = b \cdot 10^n$, la **Adición/Sustracción
  por Factor Común** cumple:


  $$x \pm y = (a \pm b) \cdot 10^n$$


  **Desglose operativo:**

  - Homogeneización de exponentes: Si los exponentes difieren ($m \neq n$), se desplaza
  la coma del coeficiente de uno de los términos para igualar las potencias antes
  de factorizar.


  > **Complemento didáctico:** Ejemplo con igual exponente: $(3,2 \cdot 10^4) + (4,5
  \cdot 10^4) = (3,2 + 4,5) \cdot 10^4 = 7,7 \cdot 10^4$.'
definiciones_clave: '- **Adición y sustracción en notación científica**: Operación
  $(a \pm b) \cdot 10^n$ requiriendo igual exponente previo.'
propiedades_relaciones: '- **Factorización común**: $(a \cdot 10^n) \pm (b \cdot 10^n)
  = (a \pm b) \cdot 10^n$.'
ejemplo_guiado:
  enunciado: Calcule $(4,2 \cdot 10^5) + (3,6 \cdot 10^5)$ y $(8,5 \cdot 10^3) - (2,1
    \cdot 10^3)$.
  pasos:
  - 'Paso 1: Para la suma, verificar exponente común $10^5$: $(4,2 + 3,6) \cdot 10^5
    = 7,8 \cdot 10^5$.'
  - 'Paso 2: Para la resta, verificar exponente común $10^3$: $(8,5 - 2,1) \cdot 10^3
    = 6,4 \cdot 10^3$.'
  - 'Conclusión: La suma es $7,8 \cdot 10^5$ y la resta es $6,4 \cdot 10^3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición previa se requiere para sumar o restar directamente los
    coeficientes a y b en notación científica?
  choices:
  - text: Que las potencias de diez tengan exactamente el mismo exponente n
    is_correct: true
  - text: Que los coeficientes a y b sean iguales
    is_correct: false
  - text: Que el exponente sea cero
    is_correct: false
  - text: Que las bases sean negativas
    is_correct: false
  explanation: La alternativa correcta es 'Que las potencias de diez tengan exactamente
    el mismo exponente n'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para la suma (4,2 · 10^5) + (3,6 · 10^5), ¿cuál fue
    el resultado?
  choices:
  - text: 7,8 · 10^5
    is_correct: true
  - text: 7,8 · 10^{10}
    is_correct: false
  - text: 15,12 · 10^5
    is_correct: false
  - text: 7,8 · 10^0
    is_correct: false
  explanation: La alternativa correcta es '7,8 · 10^5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los dos términos tengan el mismo exponente en la potencia
  de diez.'
- 'Paso 2: Sumar o restar los coeficientes de la parte decimal ($a \pm b$).'
- 'Paso 3: Conservar la potencia de diez común $10^n$ y reajustar el coeficiente si
  no cumple $1 \le |k| < 10$.'
errores_correccion: '- **Error 1: Sumar los exponentes de diez al sumar las expresiones
  ($(3 \cdot 10^4) + (2 \cdot 10^4) = 5 \cdot 10^8$).** **Cómo corregirlo:** En la
  suma o resta, la potencia de diez se MANTIENE como factor común ($5 \cdot 10^4$).


  - **Error 2: Sumar directamente coeficientes cuando los exponentes son distintos.**
  **Cómo corregirlo:** Se DEBEN igualar primero los exponentes desplazando la coma
  de un coeficiente antes de sumar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(1,5 \cdot 10^6) + (2,3 \cdot 10^6)$.
  alternativas:
  - 3,8 · 10^6
  - 3,8 · 10^{12}
  - 3,45 · 10^6
  respuesta: 3,8 · 10^6
  solucion_pasos:
  - $(1,5 + 2,3) \cdot 10^6 = 3,8 \cdot 10^6$.
- titulo: Ejemplo 2
  enunciado: Calcule $(9,4 \cdot 10^{-2}) - (4,1 \cdot 10^{-2})$.
  alternativas:
  - 5,3 · 10^{-2}
  - 5,3 · 10^{-4}
  - 13,5 · 10^{-2}
  respuesta: 5,3 · 10^{-2}
  solucion_pasos:
  - $(9,4 - 4,1) \cdot 10^{-2} = 5,3 \cdot 10^{-2}$.
- titulo: ¿Es (2 · 10^3) + (3 · 10^3) igual a 5 · 10^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2+3) \cdot 10^3 = 5 \cdot 10^3$.
- titulo: ¿Se conserva el exponente de diez al sumar términos con igual exponente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la potencia $10^n$ se factoriza como término común.
errores_frecuentes:
- Sumar los exponentes de diez al resolver la adición de números en notación científica.
- Sumar los coeficientes numéricos directamente cuando los exponentes de diez son
  diferentes.
- Multiplicar la potencia de diez común por dos al sumar expresiones en notación científica.
- La suma $(4 \cdot 10^3) + (2 \cdot 10^3)$ equivale numéricamente a $6 \cdot 10^6$.
- Restar las potencias de diez al restar los coeficientes decimales.
afirmaciones_verdaderas:
- Para sumar o restar números en notación científica con igual exponente se operan
  los coeficientes y se mantiene el factor común $10^n$.
- Si los exponentes difieren, se debe transformar previamente uno de los términos
  para igualar sus potencias de diez.
al_terminar_debes_poder: Al terminar serás capaz de sumar y restar números en notación
  científica $(a \cdot 10^n) \pm (b \cdot 10^n) = (a \pm b) \cdot 10^n$, factorizando
  la potencia de diez común.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
