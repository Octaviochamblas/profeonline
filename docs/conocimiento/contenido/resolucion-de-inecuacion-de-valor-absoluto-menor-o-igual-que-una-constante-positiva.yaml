semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MENOR_IGUAL_POSITIVO
resumen_inicial: Una inecuación del tipo $|X| \le k$ con $k > 0$ equivale a una desigualdad
  doble inclusiva $-k \le X \le k$.
explicacion_simple: 'Cuando la inecuación incluye el signo igual ($|X| \le k$ con
  $k > 0$):

  La regla es idéntica a la del menor que, pero incluyendo a los números de los bordes
  $-k$ y $k$.

  Se transforma en la desigualdad doble: **$-k \le X \le k$**, y su solución es el
  intervalo cerrado $[ -k, k ]$.'
explicacion_formal: 'Para toda expresión $X$ y constante $k \ge 0$:


  $$|X| \le k \iff -k \le X \le k$$


  **Desglose de la fórmula:**

  - Inclusión de los extremos de la frontera en los números reales.

  - Conjunto solución en formato de intervalo cerrado: $S = [-k, k]$.'
definiciones_clave: '- **Propiedad de acotamiento inclusivo $|X| \le k$**: Regla que
  convierte una inecuación de valor absoluto no estricta en una desigualdad doble
  con bordes cerrados.'
propiedades_relaciones: '- **Inclusión de bordes**: Los límites $-k$ y $k$ satisfacen
  la igualdad $|-k| = k$ y $|k| = k$.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación con valor absoluto $|x - 4| \le 6$ y expresa el
    resultado como intervalo.
  pasos:
  - 'Paso 1: Aplicar la propiedad $|X| \le k \iff -k \le X \le k$: $-6 \le x - 4 \le
    6$.Paso 2: Sumar $4$ a los tres miembros: $-6 + 4 \le x \le 6 + 4$.Paso 3: Reducir
    los valores: $-2 \le x \le 10$.Paso 4: Escribir el conjunto solución como intervalo
    cerrado: $S = [-2, 10]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $|x - 4| \le 6$, ¿cuál es el intervalo solución $S$ obtenido?
  choices:
  - text: $S = [-2, 10]$
    is_correct: true
  - text: $S = ]-2, 10[$
    is_correct: false
  - text: $S = ]-\infty, -2] \ \cup \ [10, +\infty[$
    is_correct: false
  - text: $S = [-6, 6]$
    is_correct: false
  explanation: La alternativa correcta es '$S = [-2, 10]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la solución $S = [-2, 10]$, ¿por qué los extremos $-2$ y $10$ llevan
    corchetes cerrados?
  choices:
  - text: Porque la inecuación original incluye el operador no estricto $\le$.
    is_correct: true
  - text: Porque son números enteros pares.
    is_correct: false
  - text: Porque la suma da 8.
    is_correct: false
  - text: Es una convención arbitraria.
    is_correct: false
  explanation: La alternativa correcta es 'Porque la inecuación original incluye el
    operador no estricto $\le$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir $-k \le \text{expresión} \le k$.'
- 'Paso 2: Despejar $x$ simultáneamente en los tres lados.'
- 'Paso 3: Presentar el conjunto solución entre corchetes cerrados $[a, b]$.'
errores_correccion: '- **Error común:** Poner corchetes abiertos en la solución de
  $|X| \le k$.

  - **Cómo corregirlo:** Si la inecuación tiene el signo igual ($\le$), los corchetes
  DEBEN ir cerrados hacia adentro $[ ]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
fuente: Texto escolar MINEDUC — Álgebra / Inecuaciones con Valor Absoluto
