semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MENOR_IGUAL_POSITIVO
resumen_inicial: Las inecuaciones del tipo $|E| \le k$ con $k \ge 0$ se resuelven transformando el valor absoluto en una doble desigualdad continua acotada.
explicacion_simple: '![Resolución de inecuación de valor absoluto menor o igual que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-menor-o-igual-que-una-constante-positiva-intro.svg)


  Para resolver $|x| \le 3$, buscamos los números cuya distancia a cero sea **como máximo 3**.


  Estos números están encerrados entre $-3$ y $3$ inclusive:

  $$-3 \le x \le 3$$


  Por lo tanto, la solución es el **intervalo cerrado continuo** $S = [-3, 3]$.'
explicacion_formal: 'Para $k \ge 0$ y $E(x)$ una expresión algebraica:


  $$|E(x)| \le k \iff -k \le E(x) \le k$$


  **Desglose de la fórmula:**

  - Cadena continua de desigualdades: Equivale a la intersección simultánea $-k \le E(x) \quad \land \quad E(x) \le k$.

  - Conjunto solución global $S = [-k, k]$.

  '
definiciones_clave: '- **Propiedad del emparedado para valor absoluto**: Regla por la cual el operador $\le k$ confina el argumento $E$ dentro de los límites $[-k, k]$.

  '
propiedades_relaciones: '- **Inclusión de los extremos**: El operador no estricto $\le$ exige corchetes cerrados en ambos límites del intervalo.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución de inecuación de valor absoluto menor o igual que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-menor-o-igual-que-una-constante-positiva-ejemplos.svg)


    Resuelve la inecuación $|3x - 5| \le 4$ y expresa la solución en notación de intervalo.'
  pasos:
  - 'Paso 1: Aplicar la propiedad de doble desigualdad: $-4 \le 3x - 5 \le 4$.'
  - 'Paso 2: Sumar 5 a los tres miembros: $-4 + 5 \le 3x \le 4 + 5 \implies 1 \le 3x \le 9$.'
  - 'Paso 3: Dividir entre 3 los tres miembros: $\frac{1}{3} \le x \le 3$.'
  - 'Paso 4: Escribir el intervalo cerrado solución: $S = [\frac{1}{3}, 3]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $|3x - 5| \le 4$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = [\frac{1}{3}, 3]$
    is_correct: true
  - text: $S = ]\frac{1}{3}, 3[$
    is_correct: false
  - text: $S = ]-\infty, \frac{1}{3}] \cup [3, +\infty[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = [\frac{1}{3}, 3]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué estructura algebraica se obtiene al desglosar $|E| \le k$ con $k > 0$?
  choices:
  - text: Una doble desigualdad continua $-k \le E \le k$.
    is_correct: true
  - text: La unión de dos intervalos separados.
    is_correct: false
  - text: Una igualdad estricta $E = k$.
    is_correct: false
  - text: El conjunto vacío siempre.
    is_correct: false
  explanation: La alternativa correcta es 'Una doble desigualdad continua $-k \le E \le k$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que la constante $k$ sea mayor o igual a cero ($k \ge 0$).'
- 'Paso 2: Escribir la doble desigualdad $-k \le E \le k$.'
- 'Paso 3: Realizar las mismas operaciones de despeje (sumar, restar, dividir) en los tres miembros simultáneamente.'
- 'Paso 4: Escribir el intervalo cerrado $S = [a, b]$.'
errores_correccion: '- **Error común:** Desglosar $|E| \le k$ como una unión con el conector "O" ($\lor$).

  - **Cómo corregirlo:** Las desigualdades con menor o igual ($\le$) forman un bloque continuo "Y" ($\land$) entre $-k$ y $k$.

  '
ejemplos:
- titulo: 'Ejemplo 1: Caso básico'
  enunciado: ¿Cuál es la solución de $|x| \leq 5$?
  alternativas:
  - $[-5, 5]$
  - $]-5, 5[$
  - $]-\infty, 5]$
  - $[5, +\infty[$
  respuesta: $[-5, 5]$
  solucion_pasos:
  - 'Paso 1: $-5 \le x \le 5$.'
  - 'Paso 2: Corchetes cerrados en ambos extremos: $S = [-5, 5]$.'
- titulo: 'Ejemplo 2: Con traslación'
  enunciado: Resuelve $|x + 3| \leq 2$.
  alternativas:
  - $[-5, -1]$
  - $]-5, -1[$
  - $[-1, 5]$
  - $]-1, 5[$
  respuesta: $[-5, -1]$
  solucion_pasos:
  - 'Paso 1: $-2 \le x + 3 \le 2$.'
  - 'Paso 2: Restar $3$: $-5 \le x \le -1 \implies S = [-5, -1]$.'
- titulo: 'Ejemplo 3: Con factor y fracción'
  enunciado: Resuelve $|3x - 1| \leq 8$.
  alternativas:
  - $\left[-\frac{7}{3}, 3\right]$
  - $[-3, 3]$
  - $\left]-\frac{7}{3}, 3\right[$
  - $[-8, 8]$
  respuesta: $\left[-\frac{7}{3}, 3\right]$
  solucion_pasos:
  - 'Paso 1: $-8 \le 3x - 1 \le 8$.'
  - 'Paso 2: Sumar $1$: $-7 \le 3x \le 9$.'
  - 'Paso 3: Dividir entre $3$: $-\frac{7}{3} \le x \le 3$.'
- titulo: 'Ejemplo 4: Evaluación en bordes'
  enunciado: ¿Pertenece $x = 5$ a la solución de $|x| \leq 5$?
  alternativas:
  - Sí, porque satisface la igualdad $|5| = 5 \leq 5$
  - No, los extremos se excluyen
  - Solo si $x > 0$
  - Depende del signo
  respuesta: Sí, porque satisface la igualdad $|5| = 5 \leq 5$
  solucion_pasos:
  - 'Paso 1: La relación $\le$ incluye la condición de igualdad.'
  - 'Paso 2: Por lo tanto, $5 \in S$.'
errores_frecuentes:
- Al resolver $|x - 4| \le 3$, se desglosa en la disyunción $x - 4 \le -3$ o $x - 4 \ge 3$.
- La inecuación $|x| \le 5$ excluye a los números reales negativos del conjunto solución.
- El desglosamiento simultáneo de $|E| \le k$ con $k > 0$ se escribe como $-k \le E \ge k$.
- La solución de $|x + 2| \le 6$ es la unión de dos semirrectas infinitas.
- En $|x| \le k$, los extremos $-k$ y $k$ se escriben con corchetes abiertos en notación de intervalo.
afirmaciones_verdaderas:
- Para $k \ge 0$, la desigualdad $|E| \le k$ es equivalente a la cadena continua de desigualdades $-k \le E \le k$.
- El conjunto solución de $|E| \le k$ corresponde a un único intervalo cerrado acotado $[-k, k]$.
al_terminar_debes_poder: '**QUÉ:** Resolver inecuaciones de la forma $|f(x)| \le k$ con $k > 0$.


  **CÓMO:** Desdoblando en una doble desigualdad continua con inclusión de bordes $-k \le f(x) \le k$ para obtener un intervalo cerrado acotado.


  ![Resumen Resolución de inecuación de valor absoluto menor o igual que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-menor-o-igual-que-una-constante-positiva-resumen.svg)'
