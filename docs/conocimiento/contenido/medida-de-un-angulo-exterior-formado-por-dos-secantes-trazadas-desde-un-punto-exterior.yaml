- '''Restar el arco mayor del menor obteniendo un valor negativo.'''
afirmaciones_verdaderas:
- '''La medida del ángulo exterior por secantes es igual a la semidiferencia de los arcos interceptados.'''
- "'El arco mayor se obtiene duplicando el ángulo exterior y sumando el arco menor ($\text{Mayor} = 2\\epsilon + \text{Menor}$).'"
- '''El vértice del ángulo exterior se encuentra estrictamente fuera de la circunferencia.'''
