semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_EXTERIOR_SECANTES
resumen_inicial: 'La medida de un ángulo exterior formado por dos secantes trazadas desde un punto exterior es igual a la semidiferencia de los arcos interceptados: ε = (Arco Mayor - Arco Menor) / 2.'
explicacion_simple: 'Imagina una cámara de vigilancia colocada en una esquina fuera de una plaza redonda (un punto exterior $P$). Su campo de visión entra por dos líneas secantes que atraviesan la plaza: al hacerlo, la cámara ve dos arcos a la vez: un **arco lejano más grande** (al fondo) y un **arco cercano más pequeño** (en la entrada).


  Para calcular cuánto mide el ángulo exterior de esa cámara, la regla matemática es la **semidiferencia**: **restas el arco mayor menos el arco menor y divides el resultado entre dos**:

  $$\epsilon = \frac{\overset{\frown}{\text{Arco Mayor}} - \overset{\frown}{\text{Arco Menor}}}{2}$$


  ¡Grábate la regla: **Ángulo EXTERIOR lleva RESTA**! Si el arco mayor mide $110^\circ$ y el menor mide $30^\circ$, el ángulo exterior mide $(110^\circ - 30^\circ) / 2 = 80^\circ / 2 = 40^\circ$.


  ![Ángulo exterior por secantes](/static/img/nodos/medida-de-un-angulo-exterior-formado-por-dos-secantes-trazadas-desde-un-punto-exterior-intro.svg)

  '
explicacion_formal: '### Teorema del ángulo exterior por dos secantes

  Sea $P$ un punto exterior a la circunferencia $\mathcal{C}$ ($d(P, O) > r$). Se trazan dos rectas secantes desde $P$ que intersecan a la circunferencia en los puntos $C, A$ y $D, B$ respectivamente (con $A, B$ más lejanos a $P$ que $C, D$). La medida del ángulo exterior $\epsilon = \angle APB$ es la semidiferencia de las medidas de los arcos interceptados $\overset{\frown}{AB}$ (mayor) y $\overset{\frown}{CD}$ (menor):

  $$\epsilon = \frac{\text{med}(\overset{\frown}{AB}) - \text{med}(\overset{\frown}{CD})}{2} \iff 2\epsilon = \text{med}(\overset{\frown}{AB}) - \text{med}(\overset{\frown}{CD})$$


  ### Demostración geométrica mediante ángulo exterior de un triángulo

  1. Trácese la cuerda auxiliar $\overline{BC}$. Se forma el triángulo $\triangle PBC$.

  2. En $\triangle PBC$, el ángulo inscrito $\angle ACB$ es un ángulo exterior en el vértice $C$.

  3. Por el teorema del ángulo exterior:

  $$\angle ACB = \epsilon + \angle PBC \implies \epsilon = \angle ACB - \angle PBC$$

  4. Pero $\angle ACB$ es un ángulo inscrito que subtiende el arco mayor $\overset{\frown}{AB}$:

  $$\angle ACB = \frac{\text{med}(\overset{\frown}{AB})}{2}$$

  5. Y $\angle PBC$ es un ángulo inscrito que subtiende el arco menor $\overset{\frown}{CD}$:

  $$\angle PBC = \frac{\text{med}(\overset{\frown}{CD})}{2}$$

  6. Sustituyendo ambas medidas:

  $$\epsilon = \frac{\text{med}(\overset{\frown}{AB})}{2} - \frac{\text{med}(\overset{\frown}{CD})}{2} = \frac{\text{med}(\overset{\frown}{AB}) - \text{med}(\overset{\frown}{CD})}{2}$$


  > **Complemento didáctico:** No lo olvides jamás: el ángulo interior es una **suma** ($+$) y el ángulo exterior es una **resta** ($-$). Al restar en el ángulo exterior, asegúrate siempre de colocar primero el arco mayor para que el ángulo resultante sea estrictamente positivo.

  '
definiciones_clave: '- **Ángulo exterior**: Ángulo cuyo vértice se encuentra fuera del círculo y sus lados intersecan a la circunferencia.

  - **Arco mayor**: Arco más alejado del vértice exterior comprendido entre los lados.

  - **Arco menor**: Arco más próximo al vértice exterior comprendido entre los lados.

  '
propiedades_relaciones: '- **Semidiferencia positiva**: Como $\overset{\frown}{AB} > \overset{\frown}{CD}$, $\epsilon > 0^\circ$.

  - **Despeje de arco mayor**: $\text{med}(\overset{\frown}{AB}) = 2\epsilon + \text{med}(\overset{\frown}{CD})$.

  - **Despeje de arco menor**: $\text{med}(\overset{\frown}{CD}) = \text{med}(\overset{\frown}{AB}) - 2\epsilon$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo exterior por secantes](/static/img/nodos/medida-de-un-angulo-exterior-formado-por-dos-secantes-trazadas-desde-un-punto-exterior-ejemplos.svg)


    Desde un punto exterior $P$ se trazan dos secantes que cortan a una circunferencia delimitando un arco mayor de $110^\circ$ y un arco menor de $30^\circ$. Calcula la medida del ángulo exterior $\epsilon$. Además, si otro ángulo exterior mide $35^\circ$ y su arco menor mide $20^\circ$, halla el arco mayor.'
  pasos:
  - 'Paso 1: Aplicar la fórmula de la semidiferencia: $\epsilon = \frac{110^\circ - 30^\circ}{2}$.'
  - 'Paso 2: Restar y dividir: $\epsilon = \frac{80^\circ}{2} = 40^\circ$.'
  - 'Paso 3: Para el segundo ejercicio, plantear la ecuación con $\epsilon = 35^\circ$ y arco menor de $20^\circ$: $35^\circ = \frac{x - 20^\circ}{2}$.'
  - 'Paso 4: Multiplicar por 2 y despejar el arco mayor $x$: $70^\circ = x - 20^\circ \implies x = 70^\circ + 20^\circ = 90^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la medida de un ángulo exterior formado por dos secantes?
  choices:
  - text: ε = (Arco Mayor - Arco Menor) / 2.
    is_correct: true
  - text: ε = (Arco Mayor + Arco Menor) / 2.
    is_correct: false
  - text: ε = Arco Mayor - Arco Menor.
    is_correct: false
  - text: ε = (Arco Mayor · Arco Menor) / 360°.
    is_correct: false
  explanation: La alternativa correcta es 'ε = (Arco Mayor - Arco Menor) / 2.' La medida del ángulo exterior es la semidiferencia de los arcos que encierra.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los arcos interceptados por dos secantes desde un punto exterior miden 130° y 50°, ¿cuánto mide el ángulo exterior?
  choices:
  - text: 40°.
    is_correct: true
  - text: 90°.
    is_correct: false
  - text: 80°.
    is_correct: false
  - text: 45°.
    is_correct: false
  explanation: 'La alternativa correcta es ''40°.'' Aplicando la semidiferencia: $\frac{130^\circ - 50^\circ}{2} = \frac{80^\circ}{2} = 40^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el arco mayor (lejano) y el arco menor (cercano) interceptados por las secantes.

  2. Restar la medida del arco menor a la del arco mayor.

  3. Dividir la diferencia resultante entre 2: $\epsilon = \frac{\overset{\frown}{\text{Mayor}} - \overset{\frown}{\text{Menor}}}{2}$.

  4. Para despejar el arco mayor, duplicar el ángulo exterior y sumarle el arco menor: $\text{Mayor} = 2\epsilon + \text{Menor}$.

  '
errores_correccion: '- **Error común 1:** Sumar los arcos en lugar de restarlos. **Corrección:** La suma es para el ángulo interior; el exterior se calcula con una RESTA.

  - **Error común 2:** Invertir el orden de la resta y obtener un ángulo negativo. **Corrección:** Siempre se resta el arco mayor menos el arco menor.

  '
ejemplos:
- tipo: A
  titulo: Ángulo exterior con arcos dados
  enunciado: Desde un punto $P$ exterior, dos secantes interceptan arcos de $120^\circ$ y $40^\circ$. ¿Cuánto mide el ángulo exterior?
  alternativas:
  - text: $40^\circ$.
    is_correct: true
  - text: $80^\circ$.
    is_correct: false
  - text: $160^\circ$.
    is_correct: false
  - text: $20^\circ$.
    is_correct: false
  explicacion: $\epsilon = \frac{120^\circ - 40^\circ}{2} = \frac{80^\circ}{2} = 40^\circ$.
- tipo: B
  titulo: Semidiferencia de arcos
  enunciado: ¿Es la medida de un ángulo exterior por secantes siempre igual a la mitad de la resta entre el arco mayor y el arco menor?
  respuesta: Sí
  explicacion: Sí. Por el teorema del ángulo exterior, su medida equivale a la semidiferencia de los arcos interceptados.
