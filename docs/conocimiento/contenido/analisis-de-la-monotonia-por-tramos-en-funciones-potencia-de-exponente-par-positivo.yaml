semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.MONOTONIA_PAR
resumen_inicial: 'El análisis de la monotonía por tramos en funciones potencia con exponente par positivo ($n = 2k$) establece que la función no es monótona global en $\mathbb{R}$, sino que cambia de sentido de variación en el vértice $x = 0$: para $a > 0$ es estrictamente decreciente en $]-\infty, 0]$ y creciente en $[0, +\infty[$, invirtiendo los tramos para $a < 0$.'
explicacion_simple: "![El análisis de la monotonía por tramos en funciones potencia con exponente par positivo ($n = 2k$) establece que la función no es monótona global en $\\mathbb{R}$, sino que cambia de sentido de variación en el vértice $x = 0$: para $a > 0$ es estrictamente decreciente en $]-\\infty, 0]$ y creciente en $[0, +\\infty[$, invirtiendo los tramos para $a < 0$](/static/img/nodos/analisis-de-la-monotonia-por-tramos-en-funciones-potencia-de-exponente-par-positivo-intro.svg)\n\n\nUna función con exponente par ($x^2, x^4, x^6$) **no sube siempre ni baja siempre: CAMBIA DE DIRECCIÓN en el origen $(0, 0)$**:\n\n- **Caso 1: Si $a > 0$ (Copa normal $\\cup$):**\n  - **Tramo izquierdo ($]-\\infty, 0]$):** La curva viene cayendo $\\searrow$ (**Estrictamente Decreciente**).\n  - **En $x = 0$:** Llega al fondo (mínimo absoluto).\n  - **Tramo derecho ($[0, +\\infty[$):** La curva empieza a subir $\\nearrow$ (**Estrictamente Creciente**).\n- **Caso 2: Si $a < 0$ (Copa invertida $\\cap$):**\n\
  \  - **Tramo izquierdo ($]-\\infty, 0]$):** Sube hacia la cúspide $\\nearrow$ (**Estrictamente Creciente**).\n  - **Tramo derecho ($[0, +\\infty[$):** Cae hacia abajo $\\searrow$ (**Estrictamente Decreciente**)."
explicacion_formal: "Sea $f(x) = a \\cdot x^{2k}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$. La derivada primera viene dada por:\n$$f'(x) = 2ka \\cdot x^{2k-1}$$\nDado que $2k-1$ es un entero impar, el término $x^{2k-1}$ conserva estrictamente el signo algebraico de $x$:\n$$\\operatorname{sgn}(f'(x)) = \\operatorname{sgn}(a) \\cdot \\operatorname{sgn}(x)$$\n\n**Análisis de intervalos de monotonía**:\n1. **Régimen $a > 0$**:\n   - Para $x < 0 \\implies f'(x) = (+) \\cdot (-) < 0 \\implies f$ es estrictamente decreciente en $]-\\infty, 0]$.\n   - Para $x > 0 \\implies f'(x) = (+) \\cdot (+) > 0 \\implies f$ es estrictamente creciente en $[0, +\\infty[$.\n2. **Régimen $a < 0$**:\n   - Para $x < 0 \\implies f'(x) = (-) \\cdot (-) > 0 \\implies f$ es estrictamente creciente en $]-\\infty, 0]$.\n   - Para $x > 0 \\implies f'(x) = (-) \\cdot (+) < 0 \\implies f$ es estrictamente decreciente en $[0, +\\infty[$."
definiciones_clave: '- **Monotonía por tramos**: Propiedad de funciones diferenciables cuyos intervalos de crecimiento y decrecimiento están delimitados por puntos críticos.

  - **Punto de cambio de monotonía**: Abscisa $x = 0$ donde la derivada se anula y cambia de signo.'
propiedades_relaciones: '- **Criterio de la primera derivada**: $f''(0) = 0$ con cambio de signo garantiza un extremo relativo en $(0, 0)$.

  - **No inyectividad global**: Al tener monotonía opuesta en semiplanos complementarios, la función no puede ser inyectiva en $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la monotonía por tramos en funciones potencia con exponente par positivo ($n = 2k$) establece que la función no es monótona global en $\mathbb{R}$, sino que cambia de sentido de variación en el vértice $x = 0$: para $a > 0$ es estrictamente decreciente en $]-\infty, 0]$ y creciente en $[0, +\infty[$, invirtiendo los tramos para $a < 0$](/static/img/nodos/analisis-de-la-monotonia-por-tramos-en-funciones-potencia-de-exponente-par-positivo-ejemplos.svg)



    Determina los intervalos de crecimiento y decrecimiento para:

    1) $f(x) = 3x^6$

    2) $g(x) = -4x^4$'
  pasos:
  - 'Paso 1: Para $f(x) = 3x^6$ ($n = 6$ par, $a = 3 > 0$):

    - Derivada: $f''(x) = 18x^5$.

    - Si $x < 0 \implies f''(x) < 0$ $\implies$ **Estrictamente decreciente en $]-\infty, 0]$**.

    - Si $x > 0 \implies f''(x) > 0$ $\implies$ **Estrictamente creciente en $[0, +\infty[$**.'
  - 'Paso 2: Para $g(x) = -4x^4$ ($n = 4$ par, $a = -4 < 0$):

    - Derivada: $g''(x) = -16x^3$.

    - Si $x < 0 \implies g''(x) > 0$ $\implies$ **Estrictamente creciente en $]-\infty, 0]$**.

    - Si $x > 0 \implies g''(x) < 0$ $\implies$ **Estrictamente decreciente en $[0, +\infty[$**.'
checkpoints:
- placement: after_explicacion_formal
  question: En el intervalo $]-\infty, 0]$, ¿cómo se comporta la función $f(x) = 5x^4$?
  choices:
  - text: Es estrictamente decreciente
    is_correct: true
  - text: Es estrictamente creciente
    is_correct: false
  - text: Es constante
    is_correct: false
  - text: No está definida
    is_correct: false
  explanation: La alternativa correcta es 'Es estrictamente decreciente'. Al avanzar hacia la derecha en los números negativos hacia 0, las alturas van disminuyendo ($(-2)^4 = 16 \to (-1)^4 = 1 \to 0$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué intervalo es creciente la función $f(x) = -2x^6$?
  choices:
  - text: ']-∞, 0]'
    is_correct: true
  - text: '[0, +∞['
    is_correct: false
  - text: En todo ℝ
    is_correct: false
  - text: En ningún intervalo
    is_correct: false
  explanation: La alternativa correcta es ']-∞, 0]'. Como $a = -2 < 0$, la curva asciende desde abajo hacia la cúspide en $(0, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el exponente $n$ sea par positivo ($2, 4, 6...$).'
- 'Paso 2: Identificar el signo del coeficiente principal $a$.'
- 'Paso 3: Si $a > 0$: declarar decreciente en $]-\infty, 0]$ y creciente en $[0, +\infty[$.'
- 'Paso 4: Si $a < 0$: declarar creciente en $]-\infty, 0]$ y decreciente en $[0, +\infty[$.'
errores_correccion: '- **Error común:** Afirmar que $f(x) = x^4$ es creciente en todo su dominio $\mathbb{R}$.

  - **Cómo corregirlo:** En los números negativos, al aumentar $x$ (ej: de $-3$ a $-1$), la función pasa de $81$ a $1$ (disminuye): **en $]-\infty, 0]$ es DECRECIENTE**.'
ejemplos:
- titulo: 'Ejemplo 1: Intervalo de crecimiento con a > 0'
  enunciado: ¿Dónde es estrictamente creciente $f(x) = 8x^2$?
  alternativas:
  - '[0, +inf['
  - ']-inf, 0]'
  - En todo R
  - ']-inf, +inf['
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Con $a = 8 > 0$, crece en $[0, +\infty[$.'
- titulo: 'Ejemplo 2: Intervalo de decrecimiento con a < 0'
  enunciado: ¿Dónde es estrictamente decreciente $g(x) = -x^8$?
  alternativas:
  - '[0, +inf['
  - ']-inf, 0]'
  - En todo R
  - En ningun tramo
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Con $a = -1 < 0$, desciende a la derecha de cero en $[0, +\infty[$.'
- titulo: 'Ejemplo 3: Punto de cambio de variación'
  enunciado: ¿En qué abscisa cambia el sentido de monotonía de $f(x) = 6x^4$?
  alternativas:
  - x = 0
  - x = 6
  - x = 4
  - x = 1
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: El cambio de monotonía ocurre en el vértice $x = 0$.'
- titulo: 'Ejemplo 4: Comparación de valores en tramo decreciente'
  enunciado: 'Para $f(x) = x^2$, compara $f(-5)$ y $f(-2)$:'
  alternativas:
  - f(-5) = 25 > f(-2) = 4 (confirma decrecimiento)
  - f(-5) < f(-2)
  - f(-5) = f(-2)
  - Son iguales
  respuesta: f(-5) = 25 > f(-2) = 4 (confirma decrecimiento)
  solucion_pasos:
  - 'Paso 1: Como $-5 < -2$ pero $f(-5) > f(-2)$, la función decrece en los negativos.'
errores_frecuentes:
- Generalizar el crecimiento a toda la recta real.
- Olvidar que a < 0 invierte los tramos respecto a a > 0.
- No incluir el cero en los extremos cerrados de los intervalos de monotonía.
afirmaciones_verdaderas:
- Las funciones potencia con exponente par positivo no son monótonas globales, sino monótonas por tramos.
- El origen x = 0 es el punto crítico donde la derivada se anula y la monotonía invierte su sentido.
al_terminar_debes_poder: '**QUÉ:** Analizar y determinar los intervalos de monotonía por tramos en funciones potencia pares.


  **CÓMO:** Utilizando el signo de la derivada f''(x) = 2ka x^(2k-1) y el vértice x = 0 como punto de cambio de variación.


