semantic_id: MAT.FUND.LOGICA_BASICA.PROPOSICION_MATEMATICA
resumen_inicial: 'Definición de proposición matemática como una oración declarativa de la que se puede afirmar objetivamente si es verdadera o falsa.'
explicacion_simple: |
  Una **proposición matemática** es cualquier oración declarativa (una frase que afirma o niega algo) de la cual podemos decir con total certeza y sin ambigüedad si es **verdadera** o **falsa**, pero nunca las dos cosas al mismo tiempo. Por ejemplo, "El número $8$ es par" es una proposición verdadera. En cambio, las preguntas ("¿Qué hora es?"), las órdenes ("¡Silencio!") o las opiniones ("El helado es rico") no son proposiciones porque no son afirmaciones con un valor de verdad objetivo.

  ![Introducción didáctica: Proposición matemática](/static/img/nodos/definicion-de-proposicion-matematica-intro.svg)
explicacion_formal: |
  ### Definición formal
  En lógica matemática y teoría de conjuntos, una **proposición** es una expresión lingüística o enunciado declarativo $p$ que satisface el **Principio del Tercero Excluido** y el **Principio de No Contradicción**. Formalmente, a toda proposición $p$ se le asigna un único **valor de verdad** $v(p)$ perteneciente al conjunto binario de valores de verdad $\mathbb{V} = \{V, F\}$ (o $\{1, 0\}$):
  $$v: \mathcal{P} \to \{V, F\}$$
  tal que para todo enunciado proposicional $p \in \mathcal{P}$, se cumple que $v(p) = V$ o $v(p) = F$, de forma mutuamente excluyente ($v(p) = V \iff v(p) \neq F$).

  ### Desglose simbólico
  - $p, q, r \in \mathcal{P}$: Variables proposicionales que representan enunciados declarativos.
  - $v(p) \in \{V, F\}$: Función de evaluación de verdad de la proposición.
  - Principio de No Contradicción: Ninguna proposición $p$ puede ser verdadera y falsa simultáneamente ($v(p \land \neg p) = F$).
  - Principio del Tercero Excluido: Toda proposición $p$ es o bien verdadera o bien falsa; no existe una tercera opción ($v(p \lor \neg p) = V$).

  > **Complemento didáctico:** Para determinar si un enunciado es una proposición matemática basta comprobar dos condiciones: 1) que sea una oración declarativa (que afirme o niegue una propiedad), y 2) que su valor de verdad sea unívoco y objetivo (independiente de opiniones o del contexto del observador).
definiciones_clave: |
  - **Proposición matemática**: Enunciado aseverativo que posee un valor de verdad único bien definido (Verdadero o Falso).
  - **Valor de verdad ($v(p)$)**: Calificación lógica de un enunciado como verdadero ($V$) o falso ($F$).
  - **Enunciado abierto / Función proposicional**: Expresión con variables libres (como $x + 2 = 5$) que no es proposición hasta que se asigna un valor a la variable o se aplica un cuantificador.
propiedades_relaciones: |
  - **Bivalencia del sistema**: La lógica clásica es bivalente; solo admite dos valores de verdad ($V$ y $F$).
  - **Independencia del conocimiento empírico**: Una afirmación declarativa objetiva (como "Existe vida unicelular en Marte") es una proposición lógica aunque actualmente la humanidad desconozca su valor de verdad exacto.
ejemplo_guiado:
  enunciado: |
    Determina si cada una de las siguientes expresiones es una proposición matemática y justifica: 1) "$17$ es un número primo", 2) "¿Cuál es el valor de $x$?", 3) "$x + 4 = 10$".

    ![Ejemplos prácticos: Proposiciones](/static/img/nodos/definicion-de-proposicion-matematica-ejemplos.svg)
  pasos:
    - 'Paso 1: Analizar "$17$ es un número primo": Es una oración declarativa y su valor de verdad es unívocamente Verdadero ($V$). Por lo tanto, **sí es una proposición**.'
    - 'Paso 2: Analizar "¿Cuál es el valor de $x$?: Es una oración interrogativa (una pregunta). No afirma ni niega nada y carece de valor de verdad. Por lo tanto, **no es una proposición**.'
    - 'Paso 3: Analizar "$x + 4 = 10$": Es un enunciado abierto con una variable libre $x$. Su verdad depende del valor que tome $x$ (es $V$ si $x=6$ y $F$ si $x=2$). Sin contexto o cuantificador, **no es una proposición**.'
    - 'Paso 4: Concluir que únicamente la primera expresión cumple los criterios formales de proposición.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de los siguientes enunciados constituye una proposición matemática válida?'
    choices:
      - {text: 'El número $15$ es divisible por $3$', is_correct: true}
      - {text: '¡Por favor resuelve el ejercicio!', is_correct: false}
      - {text: '¿Existe algún número par?', is_correct: false}
      - {text: 'La matemática es la materia más entretenida', is_correct: false}
    explanation: 'La alternativa correcta es ''El número $15$ es divisible por $3$''. Es una oración declarativa con un valor de verdad objetivo ($V$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la frase "El número $9$ es un número par" es considerada una proposición matemática?'
    choices:
      - {text: 'Porque es una oración declarativa con valor de verdad objetivo (falsa)', is_correct: true}
      - {text: 'Porque es una afirmación matemáticamente verdadera', is_correct: false}
      - {text: 'Porque contiene números enteros positivos', is_correct: false}
      - {text: 'Porque se puede resolver despejando una variable', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque es una oración declarativa con valor de verdad objetivo (falsa)''. Que sea falsa no impide que sea proposición.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el tipo de oración (declarativa, interrogativa, exclamativa, imperativa o desiderativa).'
  - 'Paso 2: Verificar la presencia de variables libres sin cuantificar o sin asignar.'
  - 'Paso 3: Determinar si es posible asignar de forma objetiva un único valor de verdad ($V$ o $F$).'
  - 'Paso 4: Concluir que es una proposición si y solo si es declarativa, carece de variables libres y posee un valor de verdad unívoco.'
errores_correccion: |
  - **Error 1:** Creer que las proposiciones falsas no son proposiciones matemáticas. **Cómo corregirlo:** Una proposición matemática solo requiere tener un valor de verdad definido; las afirmaciones falsas (como "$2+2=5$") son proposiciones lógicas válidas cuyo valor de verdad es Falso ($F$).
  - **Error 2:** Confundir los enunciados abiertos con proposiciones. **Cómo corregirlo:** Expresiones con variables libres como "$x > 3$" no son proposiciones hasta que se especifique el valor de $x$ o se anteponga un cuantificador.
ejemplos:
  - titulo: 'Proposición matemática verdadera'
    enunciado: '¿Es el enunciado "Todo triángulo rectángulo tiene un ángulo de $90^\circ$" una proposición?'
    alternativas:
      - 'Sí, es una proposición verdadera'
      - 'No, es una definición geométrica'
      - 'No, requiere saber las medidas de los lados'
    respuesta: 'Sí, es una proposición verdadera'
    solucion_pasos:
      - '1. Es una afirmación declarativa en geometría.'
      - '2. Su valor de verdad es indiscutiblemente Verdadero ($V$).'
  - titulo: 'Oración imperativa u orden'
    enunciado: '¿Es el enunciado "Cierra la puerta inmediatamente" una proposición?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, las órdenes o instrucciones no pueden ser evaluadas como verdaderas o falsas.'
  - titulo: 'Enunciado con valor de verdad falso'
    enunciado: '¿Es el enunciado "$3 + 5 = 10$" una proposición matemática?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es un enunciado declarativo matemático con valor de verdad Falso ($F$).'
  - titulo: 'Opinión subjetiva'
    enunciado: '¿Es "El álgebra es más fácil que la geometría" una proposición matemática?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, depende de la opinión personal de cada observador y carece de valor de verdad objetivo.'
errores_frecuentes:
  - 'La afirmación de que un enunciado matemático falso no se clasifica como una proposición lógica.'
  - 'La afirmación de que las preguntas y las órdenes constituyen proposiciones matemáticas con valor de verdad $F$.'
  - 'La afirmación de que una expresión con variable libre como $x + 3 = 7$ es una proposición sin fijar el valor de $x$.'
  - 'La afirmación de que los juicios de valor u opiniones subjetivas poseen valor de verdad unívoco.'
  - 'La afirmación de que una proposición puede ser verdadera y falsa simultáneamente en la lógica clásica.'
afirmaciones_verdaderas:
  - 'Una proposición matemática es un enunciado declarativo del cual se puede afirmar objetivamente que es verdadero o falso, de manera mutuamente excluyente.'
  - 'Toda afirmación declarativa con valor de verdad Falso es una proposición lógica tan válida como una afirmación verdadera.'
al_terminar_debes_poder: |
  QUÉ: Identificar y clasificar enunciados distinguiendo proposiciones matemáticas de expresiones no proposicionales.
  CÓMO: Comprobar la naturaleza declarativa de la oración, la ausencia de variables libres y la existencia de un valor de verdad único ($V$ o $F$).

  ![Cuadro resumen: Proposición matemática](/static/img/nodos/definicion-de-proposicion-matematica-resumen.svg)
