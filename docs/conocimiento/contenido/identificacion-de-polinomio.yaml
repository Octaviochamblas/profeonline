procedimiento:
- 'Paso 1: Simplifica la expresión si es posible (junta términos semejantes).'
- 'Paso 2: Cuenta cuántos ''puentes'' libres de suma o resta (+, -) existen.'
- 'Paso 3: El número de bloques resultantes te da la clasificación: 2 (binomio), 3
  (trinomio), 4+ (polinomio genérico).'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de polinomio.
ejemplos:
- titulo: Clasificando el tren
  enunciado: 'Clasifica la expresión: 5x^2 - 4y + z/2'
  solucion_pasos:
  - 'Separador 1: el menos antes del 4y.'
  - 'Separador 2: el más antes de z/2.'
  - 'Bloques totales: 3.'
  - 'Conclusión: Es un Trinomio (y por ende, también pertenece a la familia general
    de los polinomios).'
- titulo: La base de la pirámide central del museo depende de una ecuación de diseño
    definida como $P(
  enunciado: 'La base de la pirámide central del museo depende de una ecuación de
    diseño definida como $P(x) = x^2 + 5x + 6$. Para encargar el software de corte,
    el ingeniero debe seleccionar el módulo matemático adecuado. ¿Qué módulo específico
    debe usar para procesar $P(x)$? (v1)


    Opciones: A) Módulo de Trinomios Cuadráticos. · B) Módulo de Binomios. · C) Módulo
    de Monomios Multivariables. · D) Módulo de Polinomios de cuatro términos.'
  solucion_pasos:
  - La expresión $x^2 + 5x + 6$ tiene tres términos inmiscibles separados por signos
    +. Su forma estructural clasifica directamente como Trinomio.
  - 'Respuesta: Módulo de Trinomios Cuadráticos.'
- titulo: 'Respecto de «Identificación de polinomio»: ¿Se ajusta a la definición esta
    afirmación? «Un *'
  enunciado: 'Respecto de «Identificación de polinomio»: ¿Se ajusta a la definición
    esta afirmación? «Un **Polinomio** es una expresión algebraica que consta de **más
    de un término**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Polinomio** es una expresión
    algebraica que consta de **más de un término**.'
- titulo: 'Respecto de «Identificación de polinomio»: ¿Es compatible con el procedimiento
    esta afirmaci'
  enunciado: 'Respecto de «Identificación de polinomio»: ¿Es compatible con el procedimiento
    esta afirmación? «Contar variables en vez de términos (ej. en $a+b+c$ hay tres
    términos, pero en $abc$ hay un solo término con tres letras)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Polinomio** es una expresión
    algebraica que consta de **más de un término**.'
errores_frecuentes:
- Contar variables en vez de términos (ej. en $a+b+c$ hay tres términos, pero en $abc$
  hay un solo término con tres letras).
- Pensar que un binomio NO es un polinomio. 'Polinomio' es la familia de todo lo que
  tenga 2 o más. El binomio es solo un sub-tipo de polinomio.
- Para «¿Cuál de las siguientes es la definición correcta de un 'Trinomio' en el marco
  teórico del álgebra polinomial? (v1)», la respuesta correcta es Es un monomio que
  contiene exactamente tres variables distintas (letras).
- Es un término cuyo grado absoluto es igual a tres.
- Para «¿Cuál de las siguientes es la definición correcta de un 'Trinomio' en el marco
  teórico del álgebra polinomial? (v1)», la respuesta correcta es Es un polinomio
  elevado a la tercera potencia.
afirmaciones_verdaderas:
- La notación de identificación de polinomio sigue las convenciones del lenguaje algebraico.
al_terminar_debes_ponder: Identificar y operar con conceptos relativos a identificación
