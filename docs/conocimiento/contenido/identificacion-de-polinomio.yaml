resumen_inicial: Un polinomio es la suma algebraica finita de dos o más monomios no
  semejantes.
explicacion_simple: Un polinomio es una cadena formada por varios monomios sumados
  o restados (como $4x^3 - 2x^2 + 5x - 8$). Todas sus variables deben tener exponentes
  enteros positivos o cero, y no pueden estar dividiendo ni dentro de signos de raíz.
explicacion_formal: 'En $\mathbb{R}[x_1, \dots, x_m]$, un **Polinomio** $P$ es la
  combinación lineal finita de $n$ monomios $T_k$:


  $$P(x_1, \dots, x_m) = \sum_{k=1}^n c_k x_1^{e_{k,1}} \dots x_m^{e_{k,m}} \quad
  \text{con } c_k \in \mathbb{R}, \quad e_{k,j} \in \mathbb{N}_0$$


  > **Complemento didáctico:** El polinomio representa la clase fundamental de expresiones
  continuas y diferenciables en el análisis algebraico.'
definiciones_clave: '- **Polinomio**: Suma finita de monomios con exponentes enteros
  no negativos.'
propiedades_relaciones: '- **Dominio continuo**: Los polinomios se pueden evaluar
  para todo valor real de sus variables.'
ejemplo_guiado:
  enunciado: Verifique si $P(x) = 3x^4 - 7x^2 + \frac{5}{x}$ es un polinomio.
  pasos:
  - 'Paso 1: Analizar término $1$: $3x^4 \to$ exponente $4$ (entero positivo).

    - Paso 2: Analizar término $2$: $-7x^2 \to$ exponente $2$ (entero positivo).

    - Paso 3: Analizar término $3$: $\frac{5}{x} = 5x^{-1} \to$ exponente $-1$ (negativo).'
  - 'Conclusión: Debido a la presencia del exponente negativo en $\frac{5}{x}$, la
    expresión NO es un polinomio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición inhabilita a una expresión algebraica para ser clasificada
    como polinomio?
  choices:
  - text: Tener variables en el denominador (exponentes negativos) o dentro de raíces
    is_correct: true
  - text: Tener coeficientes negativos
    is_correct: false
  - text: Tener más de 3 términos
    is_correct: false
  - text: Contener constantes fraccionarias
    is_correct: false
  explanation: La alternativa correcta es 'Tener variables en el denominador (exponentes
    negativos) o dentro de raíces'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3x^4 - 7x^2 + 5/x, ¿por qué NO se consideró
    un polinomio?
  choices:
  - text: Porque la variable x aparece en un denominador (5/x = 5x^-1)
    is_correct: true
  - text: Porque el coeficiente 3 es impar
    is_correct: false
  - text: Porque no tiene variables en y
    is_correct: false
  - text: Porque sus exponentes son enteros positivos
    is_correct: false
  explanation: La alternativa correcta es 'Porque la variable x aparece en un denominador
    (5/x = 5x^-1)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Separar los términos de la expresión.'
- 'Paso 2: Comprobar que ninguna letra esté dividiendo o dentro de una raíz.'
- 'Paso 3: Verificar que los exponentes de todas las variables sean enteros no negativos.'
errores_correccion: '- **Error 1: Clasificar $2x^2 - 3\sqrt{x} + 1$ como polinomio.**
  **Cómo corregirlo:** La raíz $\sqrt{x} = x^{1/2}$ tiene exponente fraccionario,
  lo que impide que sea un polinomio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes expresiones es un polinomio?
  alternativas:
  - 2x^3 - 5x^2 + x - 9
  - 4x^2 + 1/x
  - sqrt(x) + 3
  - x^-2 + 5
  respuesta: 2x^3 - 5x^2 + x - 9
  solucion_pasos:
  - 1. 2x^3 - 5x^2 + x - 9 posee exponentes 3, 2, 1 y 0 todos enteros no negativos.
    Es un polinomio.
- titulo: Ejemplo 2
  enunciado: ¿Es 7x^5 - 3x^2y + 4y^3 un polinomio en dos variables?
  alternativas:
  - Sí, porque es una suma finita de monomios enteros
  - No, porque tiene dos letras
  - No, le faltan términos
  - Indeterminado
  respuesta: Sí, porque es una suma finita de monomios enteros
  solucion_pasos:
  - 1. Todos sus términos son monómicos con exponentes enteros positivos (5, 2+1=3,
    3). Es un polinomio.
- titulo: ¿Es la expresión 6x^4 - 2x^2 + 8 un polinomio válido?
  respuesta: Sí
  solucion_pasos:
  - Sí, sus exponentes (4, 2, 0) son enteros mayores o iguales a cero.
- titulo: ¿Es x^3 - 4/x^2 + 1 un polinomio?
  respuesta: 'No'
  solucion_pasos:
  - No, 4/x^2 = 4x^-2 contiene un exponente negativo.
errores_frecuentes:
- Clasificar expresiones con letras dividiendo como polinomios.
- Declarar que la presencia de raíces en las letras no altera la definición de polinomio.
- Declarar que los polinomios no pueden incluir coeficientes negativos o fraccionarios.
- Declarar un polinomio de varias variables con una expresión irracional.
- Exigir que un polinomio contenga un número infinito de términos.
afirmaciones_verdaderas:
- Un polinomio es la suma finita de monomios con exponentes enteros no negativos.
- Las letras en un polinomio no pueden estar en denominadores ni dentro de signos
  radicales.
al_terminar_debes_poder: Al terminar serás capaz de identificar un polinomio verificando
  que todos sus términos posean exponentes enteros no negativos sin letras en denominadores
  ni radicales.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Polinomios.
