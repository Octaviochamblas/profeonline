semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.CONDICION_BASE
resumen_inicial: 'La base $b$ de una función logarítmica $f(x) = \log_b(x)$ debe satisfacer obligatoriamente $b > 0$ y $b \neq 1$ para asegurar que la función esté bien definida en todo su dominio.'
explicacion_simple: |
  Para que la función logarítmica $f(x) = \log_b(x)$ exista sin problemas en el plano cartesiano, su base $b$ debe cumplir dos reglas imprescindibles: primero, ser positiva ($b > 0$), y segundo, ser distinta del número 1 ($b \neq 1$). Si la base fuera 1 o un número negativo, no podríamos construir una curva continua ni tendríamos soluciones únicas para la variable de salida.
explicacion_formal: |
  ### Definición formal
  Las **restricciones de existencia sobre la base** $b \in \mathbb{R}$ en la función logarítmica $f(x) = a \cdot \log_b(cx + d) + k$ corresponden al conjunto no conexo:
  $$b \in ]0, 1[ \cup ]1, +\infty[$$
  justificado analíticamente por la conservación de la inversa de la función exponencial:
  1. **Principio de Continuidad Real ($b > 0$)**: Imposibilidad de definir potencias de exponente continuo para bases negativas en el conjunto de los números reales.
  2. **Principio de Inyectividad ($b \neq 1$)**: La función constante $g(x) = 1^x = 1$ no es inyectiva, por lo que carece de función inversa real.

  ### Desglose simbólico
  - $0 < b < 1 \implies$ Función logarítmica básica decreciente ($\forall x_1 < x_2 \implies f(x_1) > f(x_2)$).
  - $b > 1 \implies$ Función logarítmica básica creciente ($\forall x_1 < x_2 \implies f(x_1) < f(x_2)$).
  - $b \le 0 \lor b = 1 \implies$ Inexistencia de la función logarítmica real.

  ### Síntesis didáctica
  Diferenciar dos regímenes de monotonía según la base:
  - Base $b > 1$: Curva ascendente de izquierda a derecha.
  - Base $0 < b < 1$: Curva descendente de izquierda a derecha.
definiciones_clave: |
  - **Dominio de la base $b \in ]0, 1[ \cup ]1, +\infty[$**: Condición algebraica indispensable para definir la función logarítmica.
  - **Base creciente $b > 1$**: Rango de bases que generan monotonía ascendente.
  - **Base decreciente $0 < b < 1$**: Rango de bases que generan monotonía descendente.
propiedades_relaciones: |
  - **Simetría axial por base recíproca**: Las funciones $f(x) = \log_b(x)$ y $g(x) = \log_{1/b}(x) = -\log_b(x)$ son reflejos simétricos una de la otra respecto al eje $x$.
  - **Invariancia del intercepto $x$**: Sin importar si $b > 1$ o $0 < b < 1$, todas las funciones logarítmicas mónicas básicas cruzan el eje $x$ en el punto $(1, 0)$.
ejemplo_guiado:
  enunciado: 'Clasifica las siguientes funciones logarítmicas según su monotonía o declara si no están definidas en $\mathbb{R}$: A) $f(x) = \log_7(x)$, B) $g(x) = \log_{0.4}(x)$, C) $h(x) = \log_{-3}(x)$, D) $p(x) = \log_1(x)$.'
  pasos:
    - 'Paso 1: Para $f(x) = \log_7(x)$, la base es $b = 7 > 1$. Es una función logarítmica **estrictamente creciente**.'
    - 'Paso 2: Para $g(x) = \log_{0.4}(x)$, la base es $0 < b = 0.4 < 1$. Es una función logarítmica **estrictamente decreciente**.'
    - 'Paso 3: Para $h(x) = \log_{-3}(x)$, la base es $b = -3 < 0$. **No está definida en $\mathbb{R}$** por violar la condición $b > 0$.'
    - 'Paso 4: Para $p(x) = \log_1(x)$, la base es $b = 1$. **No está definida en $\mathbb{R}$** por violar la condición $b \neq 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de los siguientes intervalos representa de forma exhaustiva los valores válidos para la base $b$ de la función logarítmica $f(x) = \log_b(x)$?'
    choices:
      - {text: '$b \in ]0, 1[ \cup ]1, +\infty[$', is_correct: true}
      - {text: '$b \in [0, +\infty[$', is_correct: false}
      - {text: '$b \in \mathbb{R}$', is_correct: false}
      - {text: '$b > 1$ exclusivamente', is_correct: false}
    explanation: 'La alternativa correcta es ''$b \in ]0, 1[ \cup ]1, +\infty[$''. La base de una función logarítmica debe ser estrictamente positiva y distinta de 1.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si comparamos las funciones logarítmicas $f(x) = \log_2(x)$ y $g(x) = \log_{0.5}(x)$, ¿cómo se relacionan sus gráficas en el plano cartesiano?'
    choices:
      - {text: 'Son reflejos simétricos entre sí respecto al eje $x$, porque $\log_{0.5}(x) = -\log_2(x)$', is_correct: true}
      - {text: 'Son dos rectas paralelas de igual pendiente', is_correct: false}
      - {text: 'Son reflejos simétricos respecto al eje $y$', is_correct: false}
      - {text: 'Son exactamente idénticas', is_correct: false}
    explanation: 'La alternativa correcta es ''Son reflejos simétricos entre sí respecto al eje $x$, porque $\log_{0.5}(x) = -\log_2(x)$''. Las bases recíprocas invierten el signo de la función generando una reflexión vertical.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la base $b$ de la función logarítmica.'
  - 'Paso 2: Verificar que $b > 0$ y $b \neq 1$. Si no cumple, declarar que la función no existe en $\mathbb{R}$.'
  - 'Paso 3: Si $b > 1$, clasificar la función básica como estrictamente creciente.'
  - 'Paso 4: Si $0 < b < 1$, clasificar la función básica como estrictamente decreciente.'
errores_correccion: |
  - **Error 1:** Afirmar que las funciones logarítmicas con base decimal entre 0 y 1 (como $b = 0.5$) no están definidas. **Cómo corregirlo:** Las bases $0 < b < 1$ son totalmente válidas; generan funciones logarítmicas decrecientes perfectamente definidas.
  - **Error 2:** Creer que la condición $b > 0, b \neq 1$ aplica al argumento de la función logarítmica. **Cómo corregirlo:** La base tiene dos restricciones ($b > 0, b \neq 1$). El argumento $x$ tiene solo una restricción ($x > 0$), de modo que el argumento sí puede ser igual a 1 (dando $\log_b(1) = 0$).
ejemplos:
  - titulo: 'Validación de base decimal'
    enunciado: '¿La función $f(x) = \log_{0.1}(x)$ es una función logarítmica válida y decreciente?'
    alternativas:
      - 'Sí, porque $0 < 0.1 < 1$'
      - 'No, porque la base es menor que 1'
      - 'No, es una función creciente'
    respuesta: 'Sí, porque $0 < 0.1 < 1$'
    solucion_pasos:
      - '1. La base es $b = 0.1 > 0$ y $0.1 \neq 1$.'
      - '2. Al estar entre 0 y 1, es una función logarítmica decreciente válida.'
  - titulo: 'Rechazo de base unitaria'
    enunciado: '¿La expresión $f(x) = \log_1(x)$ define una función en $\mathbb{R}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La base $b = 1$ viola la condición $b \neq 1$, indefiniendo la función.'
  - titulo: 'Base del logaritmo natural'
    enunciado: '¿La función $f(x) = \ln(x)$ es estrictamente creciente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Su base es $e \approx 2.718 > 1$, por lo que la función es estrictamente creciente.'
  - titulo: 'Reflexión por base recíproca'
    enunciado: '¿La gráfica de $g(x) = \log_{1/3}(x)$ es igual a $-\log_3(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por propiedad de cambio de base, $\log_{1/3}(x) = \frac{\log_3(x)}{\log_3(1/3)} = \frac{\log_3(x)}{-1} = -\log_3(x)$.'
errores_frecuentes:
  - 'Una función logarítmica con base $b = 0.2$ no existe en el conjunto de los números reales.'
  - 'La base de una función logarítmica puede tomar el valor $b = 1$ si el argumento es mayor que 1.'
  - 'Las funciones logarítmicas con base $b > 1$ son estrictamente decrecientes.'
  - 'Una base negativa como $b = -2$ genera una función logarítmica con gráfica oscilante.'
  - 'La restricción $b \neq 1$ impide que el argumento de la función logarítmica tome el valor $x = 1$.'
afirmaciones_verdaderas:
  - 'La base $b$ de la función logarítmica $f(x) = \log_b(x)$ debe satisfacer obligatoriamente $b > 0$ y $b \neq 1$.'
  - 'Las bases $b > 1$ determinan funciones logarítmicas crecientes, mientras que las bases $0 < b < 1$ determinan funciones logarítmicas decrecientes.'
al_terminar_debes_poder: |
  QUÉ: Determinar las condiciones de existencia de la base $b$ en la función logarítmica.
  CÓMO: Exigir $b > 0$ y $b \neq 1$ para asegurar la biyectividad y la definición funcional en los números reales.
