semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.CONDICION_BASE
resumen_inicial: 'Condición de base positiva y distinta de uno en la función logarítmica:
  conceptos, asíntotas, propiedades e inversidad en Análisis de la función logarítmica.'
explicacion_simple: Estas condiciones sobre la base son heredadas directamente de
  la función exponencial, ya que la logarítmica es su inversa y no puede tener más
  sentido del que tiene la función que invierte.
explicacion_formal: '### Definición formal


  Como $f(x)=\log_b(x)$ es la inversa de $g(x)=b^x$, las condiciones sobre $b$ deben
  ser idénticas: $b>0$ (para que $g$ esté definida en todo $\mathbb{R}$) y $b\neq1$
  (para que $g$ no sea constante, lo cual impediría que tuviera una inversa).


  ### Desarrollo didáctico


  Si $b=1$, la función exponencial $g(x)=1^x=1$ sería constante, y una función constante
  no es inyectiva, por lo que no tendría inversa; de ahí que $\log_1(x)$ no esté definido.


  Para $\log_b(x)$ con $b=-2$: no existe una función exponencial válida con base $-2$,
  por lo que tampoco existe su inversa logarítmica.'
definiciones_clave: '- **Condición de base positiva y distinta de uno en la función
  logarítmica**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a condición de base positiva y distinta de uno en la función logarítmica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de condición
    de base positiva y distinta de uno en la función logarítmica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de condición de base positiva
    y distinta de uno en la función logarítmica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    condición de base positiva y distinta de uno en la función logarítmica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en condición de base positiva y distinta de uno en la función logarítmica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la base propuesta sea un número positivo.'
- 'Paso 2: Verifica que la base sea distinta de 1.'
- 'Paso 3: Si ambas condiciones se cumplen, la base es válida para una función logarítmica.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en condición
  de base positiva y distinta de uno en la función logarítmica.
ejemplos:
- titulo: Verificación de base válida
  enunciado: ¿Es válida la base de $f(x)=\log_9(x)$?
  solucion_pasos:
  - $b=9$ es positivo y distinto de 1.
  - Sí, es una base válida.
- titulo: Verificación de base inválida
  enunciado: ¿Es válida la base de $f(x)=\log_1(x)$?
  solucion_pasos:
  - $b=1$ no cumple la condición $b\neq1$.
  - No es una base válida.
- titulo: ¿Las condiciones sobre la base de la función logarítmica son las mismas
    que las de la exponencial?
  enunciado: ¿Las condiciones sobre la base de la función logarítmica son las mismas
    que las de la exponencial?
  respuesta: Sí
  solucion_pasos:
  - Como son funciones inversas entre sí, ambas exigen exactamente las mismas condiciones
    sobre la base.
- titulo: ¿Puede la base de un logaritmo ser un número negativo?
  enunciado: ¿Puede la base de un logaritmo ser un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - No existe una función exponencial válida con base negativa que pudiera tener esa
    función logarítmica como inversa.
errores_frecuentes:
- Aceptar como válida una base negativa o igual a cero para un logaritmo.
- Aceptar $b=1$ como base válida sin reconocer que impediría la existencia de la función
  inversa.
- Confundir la condición sobre la base con la restricción sobre el argumento (que
  debe ser positivo).
- No relacionar la condición sobre $b$ con la de la función exponencial correspondiente.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando condición de base positiva y distinta de uno en la función logarítmica.
