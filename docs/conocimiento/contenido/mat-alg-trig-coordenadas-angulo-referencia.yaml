  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el cuadrante donde se ubica el ángulo $\theta$.'
- 'Paso 2: Aplica la fórmula correspondiente a ese cuadrante para calcular el ángulo
  de referencia.'
- 'Paso 3: Usa el ángulo de referencia junto con el signo del cuadrante para obtener
  el valor trigonométrico.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en uso del ángulo de referencia
  para calcular seno y coseno.
ejemplos:
- titulo: Ángulo de referencia en el segundo cuadrante
  enunciado: Determina el ángulo de referencia de $135°$.
  solucion_pasos:
  - Está en el segundo cuadrante, así que se aplica $180°-\theta$.
  - $180°-135°=45°$.
- titulo: Ángulo de referencia en el tercer cuadrante
  enunciado: Determina el ángulo de referencia de $210°$.
  solucion_pasos:
  - Está en el tercer cuadrante, así que se aplica $\theta-180°$.
  - $210°-180°=30°$.
- titulo: ¿El ángulo de referencia siempre está entre $0°$ y $90°$?
  enunciado: ¿El ángulo de referencia de cualquier ángulo $\theta$ está siempre entre
    $0°$ y $90°$?
  respuesta: Sí
  solucion_pasos:
  - Es la definición del ángulo de referencia: siempre un ángulo agudo.
- titulo: ¿El ángulo de referencia determina el signo del valor trigonométrico?
  enunciado: ¿El ángulo de referencia por sí solo determina el signo de $\sin(\theta)$
    o $\cos(\theta)$?
  respuesta: 'No'
  solucion_pasos:
  - El signo depende del cuadrante donde se ubique $\theta$, no solo del ángulo de
    referencia.
errores_frecuentes:
- Aplicar la fórmula del cuadrante incorrecto al calcular el ángulo de referencia.
- Olvidar ajustar el signo del resultado según el cuadrante original de $\theta$.
- Confundir el ángulo de referencia con el ángulo coterminal.
- Calcular mal la resta o suma correspondiente al cuadrante.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  uso del ángulo de referencia para calcular seno y coseno.
