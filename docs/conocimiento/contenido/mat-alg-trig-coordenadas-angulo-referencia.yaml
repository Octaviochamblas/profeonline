semantic_id: MAT.ALG.TRIG_COORDENADAS.ANGULO_REFERENCIA
resumen_inicial: "Cálculo del ángulo de referencia $\\theta'$ (agudo y positivo) para hallar el seno y coseno en cualquier cuadrante."
explicacion_simple: |
  Cuando un ángulo $\theta$ está en el segundo, tercer o cuarto cuadrante, no necesitas aprenderte una tabla nueva de memoria. Simplemente calculas su **ángulo de referencia** $\theta'$, que es el ángulo agudo positivo formado entre el lado terminal y el eje horizontal (eje $X$). El valor numérico del seno y del coseno será idéntico al de su ángulo de referencia; únicamente deberás ajustar el signo ($+$ o $-$) según el cuadrante en que haya caído el ángulo original.
explicacion_formal: |
  ### Definición formal
  El **ángulo de referencia** $\theta'$ asociado a un ángulo $\theta$ en posición estándar es el menor ángulo agudo formado entre el lado terminal de $\theta$ y el **eje de las abscisas ($X$)**. Satisface estrictamente $0^\circ \le \theta' \le 90^\circ$ ($0 \le \theta' \le \frac{\pi}{2}$) según las fórmulas cuadrantales:
  - **Cuadrante I**: $\theta' = \theta$
  - **Cuadrante II**: $\theta' = 180^\circ - \theta = \pi - \theta$
  - **Cuadrante III**: $\theta' = \theta - 180^\circ = \theta - \pi$
  - **Cuadrante IV**: $\theta' = 360^\circ - \theta = 2\pi - \theta$

  ### Desglose simbólico
  - $\theta'$: Ángulo de referencia siempre positivo e inferior o igual a $90^\circ$.
  - $|\sin \theta| = \sin \theta'$ y $|\cos \theta| = \cos \theta'$.
  - Determinación de signos: $\sin \theta = \pm \sin \theta'$ y $\cos \theta = \pm \cos \theta'$ según el cuadrante de $\theta$.

  ### Síntesis didáctica
  El ángulo de referencia reduce la evaluación de cualquier ángulo real al estudio del primer cuadrante. Su regla clave es medir la apertura siempre con respecto al **eje X** (jamás con respecto al eje Y).
definiciones_clave: |
  - **Ángulo de referencia ($\theta'$)**: Ángulo agudo positivo formado entre el lado terminal y el eje horizontal $X$.
  - **Reducción al primer cuadrante**: Técnica algebraica para calcular razones trigonométricas usando el ángulo de referencia.
  - **Distancia al eje X**: Separación angular mínima respecto a $0^\circ, 180^\circ$ o $360^\circ$.
propiedades_relaciones: |
  - **Invariancia absoluta de magnitudes**: El valor absoluto de cualquier función trigonométrica coincide exactamente con el valor de dicha función aplicada a su ángulo de referencia.
  - **Regla del eje X**: Medir con el eje Y altera el seno por el coseno (co-funciones); por ello el ángulo de referencia se mide siempre con el eje X.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto de $\sin(150^\circ)$ y $\cos(150^\circ)$ utilizando su ángulo de referencia.'
  pasos:
    - "Paso 1: Identificar el cuadrante de $\\theta = 150^\\circ$: como $90^\\circ < 150^\\circ < 180^\\circ$, se ubica en el **Segundo Cuadrante (II C)**."
    - "Paso 2: Aplicar la fórmula del II cuadrante para el ángulo de referencia: $\\theta' = 180^\\circ - 150^\\circ = 30^\\circ$."
    - "Paso 3: Evaluar las razones para $\\theta' = 30^\\circ$: $\\sin(30^\\circ) = \\frac{1}{2}$ y $\\cos(30^\\circ) = \\frac{\\sqrt{3}}{2}$."
    - "Paso 4: Asignar los signos del II cuadrante (en II C: $y > 0 \\implies \\sin > 0$, $x < 0 \\implies \\cos < 0$): $\\sin(150^\\circ) = +\\frac{1}{2}$ y $\\cos(150^\\circ) = -\\frac{\\sqrt{3}}{2}$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Con qué eje del plano cartesiano se debe medir siempre el ángulo de referencia $\\theta'$?"
    choices:
      - {text: 'Con el eje horizontal $X$ (eje de abscisas)', is_correct: true}
      - {text: 'Con el eje vertical $Y$ (eje de ordenadas)', is_correct: false}
      - {text: 'Con la recta bisectriz $y = x$', is_correct: false}
      - {text: 'Con cualquier eje indistintamente', is_correct: false}
    explanation: 'La alternativa correcta es ''Con el eje horizontal $X$ (eje de abscisas)''. Es la regla fundamental para no alterar las funciones seno y coseno.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el ángulo de referencia $\\theta'$ para un ángulo de $\\theta = 225^\\circ$ en el tercer cuadrante?"
    choices:
      - {text: '$45^\circ$', is_correct: true}
      - {text: '$35^\circ$', is_correct: false}
      - {text: '$60^\circ$', is_correct: false}
      - {text: '$135^\circ$', is_correct: false}
    explanation: "La alternativa correcta es '$45^\\circ$'. En el III cuadrante: $\\theta' = \\theta - 180^\\circ = 225^\\circ - 180^\\circ = 45^\\circ$."
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar el cuadrante en el que se ubica el lado terminal del ángulo $\theta$.'
  - "Paso 2: Calcular el ángulo de referencia agudo $\\theta'$ midiendo la distancia angular al eje X ($180^\\circ$ o $360^\\circ$)."
  - "Paso 3: Obtener el valor de la función trigonométrica para el ángulo de referencia $\\theta'$."
  - 'Paso 4: Anteponer el signo $(+)$ o $(-)$ según los signos cartesiano del cuadrante original.'
errores_correccion: |
  - **Error 1:** Medir el ángulo de referencia con respecto al eje vertical $Y$ (ejemplo: hacer $90^\circ - \theta$). **Cómo corregirlo:** La apertura debe medirse siempre contra el eje $X$ ($180^\circ$ o $360^\circ$). Medir con el eje $Y$ invierte el seno por el coseno.
  - **Error 2:** Asignar un valor negativo al ángulo de referencia $\theta'$. **Cómo corregirlo:** Por definición, el ángulo de referencia es siempre un ángulo geométrico agudo positivo ($0^\circ \le \theta' \le 90^\circ$).
ejemplos:
  - titulo: 'Ángulo de referencia en el cuarto cuadrante'
    enunciado: '¿Cuál es el ángulo de referencia para $\theta = 300^\circ$?'
    alternativas:
      - '$60^\circ$'
      - '$30^\circ$'
      - '$120^\circ$'
    respuesta: '$60^\circ$'
    solucion_pasos:
      - "1. En el IV cuadrante: $\\theta' = 360^\\circ - \\theta$."
      - "2. $\\theta' = 360^\\circ - 300^\\circ = 60^\\circ$."
  - titulo: 'Cálculo de coseno usando ángulo de referencia'
    enunciado: '¿Cuánto vale $\cos(240^\circ)$?'
    alternativas:
      - '$-\frac{1}{2}$'
      - '$\frac{1}{2}$'
      - '$-\frac{\sqrt{3}}{2}$'
    respuesta: '$-\frac{1}{2}$'
    solucion_pasos:
      - "1. En III C, $\\theta' = 240^\\circ - 180^\\circ = 60^\\circ$."
      - '2. $\cos(60^\circ) = \frac{1}{2}$.'
      - '3. En III C el coseno es negativo: $\cos(240^\circ) = -\frac{1}{2}$.'
  - titulo: 'Rango del ángulo de referencia'
    enunciado: "¿El ángulo de referencia $\\theta'$ es siempre mayor o igual a $0^\\circ$ y menor o igual a $90^\\circ$?"
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por definición es siempre un ángulo agudo no negativo.'
  - titulo: 'Ángulo de referencia para 120 grados'
    enunciado: '¿El ángulo de referencia de $120^\circ$ es $60^\circ$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $180^\circ - 120^\circ = 60^\circ$.'
errores_frecuentes:
  - 'La afirmación de que el ángulo de referencia puede ser medido desde el eje vertical Y.'
  - 'La afirmación de que el ángulo de referencia de $210^\circ$ es igual a $-30^\circ$.'
  - 'La afirmación de que el ángulo de referencia de un ángulo del cuarto cuadrante se obtiene restando $180^\circ$.'
  - 'La afirmación de que las razones trigonométricas del ángulo de referencia tienen signos diferentes a las del ángulo original.'
  - 'La afirmación de que el ángulo de referencia puede ser mayor a $90^\circ$.'
afirmaciones_verdaderas:
  - "El ángulo de referencia $\\theta'$ es el menor ángulo agudo y positivo formado entre el lado terminal y el eje horizontal X."
  - "Las razones trigonométricas de cualquier ángulo $\\theta$ coinciden en valor absoluto con las de su ángulo de referencia $\\theta'$, difiriendo únicamente en el signo cuadrantal."
al_terminar_debes_poder: |
  QUÉ: Calcular el ángulo de referencia $\theta'$ para cualquier ángulo en el plano cartesiano.
  CÓMO: Medir la distancia angular positiva al eje horizontal X y determinar las razones trigonométricas con el signo correspondiente al cuadrante.
