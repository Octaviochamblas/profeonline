semantic_id: MAT.ALG.TRIG_COORDENADAS.ANGULO_REFERENCIA
resumen_inicial: 'Uso del ángulo de referencia para calcular seno y coseno: círculo
  unitario, amplitud, período y transformaciones de Seno y coseno en el círculo unitario.'
explicacion_simple: Para no memorizar valores trigonométricos de cada ángulo posible,
  conviene relacionarlo con su ángulo agudo equivalente más cercano al eje $x$.
explicacion_formal: '### Definición formal


  El ángulo de referencia $\theta_R$ de un ángulo $\theta$ se calcula según el cuadrante:
  en el segundo cuadrante, $\theta_R=180°-\theta$; en el tercero, $\theta_R=\theta-180°$;
  en el cuarto, $\theta_R=360°-\theta$. En el primer cuadrante, $\theta_R=\theta$.


  ### Desarrollo didáctico


  Para $\theta=150°$ (segundo cuadrante): $\theta_R=180°-150°=30°$. Esto significa
  que $|\sin(150°)|=\sin(30°)$ y $|\cos(150°)|=\cos(30°)$, ajustando el signo según
  el cuadrante.'
definiciones_clave: '- **Uso del ángulo de referencia para calcular seno y coseno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a uso del ángulo de referencia para calcular seno y coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    uso del ángulo de referencia para calcular seno y coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de uso del ángulo de referencia para calcular seno y coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
