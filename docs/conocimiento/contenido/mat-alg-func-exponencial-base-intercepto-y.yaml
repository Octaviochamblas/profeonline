  - 'Para calcular la intersección de una función exponencial con el eje $y$ se debe resolver la ecuación $a \cdot b^x = 0$.'
  - 'El intercepto con el eje $y$ de la función $f(x) = b^x$ cambia de posición cuando cambia el valor de la base $b$.'
  - 'La función exponencial básica $f(x) = a \cdot b^x$ posee dos interceptos distintos con el eje de las ordenadas.'
  - 'El intercepto con el eje $y$ de $f(x) = -3 \cdot 4^x$ se ubica en el punto $(-3, 0)$.'
afirmaciones_verdaderas:
  - 'Toda función exponencial básica $f(x) = a \cdot b^x$ corta al eje $y$ en el único punto cartesiano de coordenadas $(0, a)$.'
  - 'La evaluación en $x = 0$ convierte la potencia $b^0$ en 1, haciendo que el corte en $y$ sea independiente del valor de la base $b$.'
