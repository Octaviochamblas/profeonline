semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.INTERCEPTO_Y
resumen_inicial: 'Cálculo del intercepto de la gráfica exponencial con el eje Y: conceptos,
  asíntotas, propiedades e inversidad en Conceptos de la función exponencial.'
explicacion_simple: Toda gráfica exponencial cruza exactamente una vez el eje vertical,
  y ese punto siempre coincide con el parámetro $a$ de la función.
explicacion_formal: '### Definición formal


  La intersección de la gráfica de $f(x)=a\cdot b^x$ con el eje $y$ ocurre en $x=0$.
  Evaluando, $f(0)=a\cdot b^0=a\cdot1=a$. Por lo tanto, el intercepto con el eje $y$
  es siempre el punto $(0,a)$.


  ### Desarrollo didáctico


  Este cálculo es el más directo entre todos los relacionados con la gráfica exponencial:
  basta con identificar el coeficiente $a$, sin necesidad de ninguna operación adicional.


  Para $f(x)=9\cdot0{,}3^x$, el intercepto con el eje $y$ es el punto $(0,9)$, leído
  directamente del coeficiente $a$.'
definiciones_clave: '- **Cálculo del intercepto de la gráfica exponencial con el eje
  Y**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a cálculo del intercepto de la gráfica exponencial con el eje y.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de cálculo del
    intercepto de la gráfica exponencial con el eje y.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de cálculo del intercepto de
    la gráfica exponencial con el eje y.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    cálculo del intercepto de la gráfica exponencial con el eje y?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en conceptos de la
      función exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en conceptos de la función exponencial. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en cálculo del intercepto de la gráfica exponencial con el eje y?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el coeficiente $a$ de la función exponencial.'
- 'Paso 2: El intercepto con el eje $y$ es el punto $(0,a)$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en cálculo
  del intercepto de la gráfica exponencial con el eje y.
ejemplos:
- titulo: Cálculo directo del intercepto con el eje y
  enunciado: Determina el intercepto con el eje $y$ de $f(x)=6\cdot4^x$.
  solucion_pasos:
  - $a=6$.
  - El intercepto es el punto $(0,6)$.
- titulo: Cálculo con coeficiente negativo
  enunciado: Determina el intercepto con el eje $y$ de $f(x)=-3\cdot2^x$.
  solucion_pasos:
  - $a=-3$.
  - El intercepto es el punto $(0,-3)$.
- titulo: ¿Toda función exponencial interseca al eje $y$ exactamente una vez?
  enunciado: ¿Toda función exponencial interseca al eje $y$ exactamente una vez?
  respuesta: Sí
  solucion_pasos:
  - Como el dominio es todo $\mathbb{R}$, siempre existe (y es único) el valor $f(0)$.
- titulo: ¿El intercepto con el eje $y$ depende del valor de la base $b$?
  enunciado: ¿El intercepto con el eje $y$ depende del valor de la base $b$?
  respuesta: 'No'
  solucion_pasos:
  - Como $b^0=1$ para cualquier base válida, el intercepto depende únicamente del
    coeficiente $a$.
errores_frecuentes:
- Confundir el intercepto con el eje $y$ con la asíntota horizontal de la función.
- Reportar solo el valor $a$ como respuesta, en vez del punto completo $(0,a)$.
- Calcular incorrectamente $f(0)$, olvidando que $b^0=1$ para cualquier base válida.
- Confundir el parámetro $a$ con la base $b$ al identificar el intercepto.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando cálculo del intercepto de la gráfica exponencial con el eje y.
