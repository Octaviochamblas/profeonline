semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.INTERCEPTO_Y
resumen_inicial: 'El intercepto con el eje $y$ de la función exponencial básica es el punto cartesiano $(0, a)$, obtenido al evaluar la variable independiente en $x = 0$.'
explicacion_simple: |
  Para averiguar exactamente en qué lugar la curva de una función exponencial cruza el eje vertical $y$, simplemente reemplazamos la variable $x$ por el número 0. Como cualquier base elevada a la potencia 0 siempre da 1 ($b^0 = 1$), la fórmula $a \cdot b^0$ da como resultado el número $a$. Así, la intersección con el eje vertical siempre ocurre en las coordenadas $(0, a)$.
explicacion_formal: |
  ### Definición formal
  En la función exponencial $f(x) = a \cdot b^x$, el **intercepto u ordenada al origen** es el único punto de intersección de la gráfica con el eje de las ordenadas (eje $y$), determinado por la evaluación funcional en la abscisa nula:
  $$P_y = (0, f(0)) = (0, a \cdot b^0) = (0, a \cdot 1) = (0, a)$$

  ### Desglose simbólico
  - Evaluación algebraica: $x = 0 \implies b^0 = 1 \implies y = a \cdot 1 = a$.
  - Unicidad del corte: Dado que $\operatorname{Dom}(f) = \mathbb{R}$ y $x = 0$ es un elemento bien definido, existe **un solo punto** de intersección con el eje $y$.
  - Independencia de la base $b$: El punto de intersección $(0, a)$ es invariante respecto al valor de la base $b$. Toda familia de funciones $f_k(x) = a \cdot b_k^x$ comparte el mismo punto $(0, a)$.

  ### Síntesis didáctica
  Diferenciar intersección con eje $y$ de intersección con eje $x$: La función exponencial básica $f(x) = a \cdot b^x$ posee **exactamente una** intersección con el eje $y$ en $(0, a)$, pero **cero** intersecciones con el eje $x$.
definiciones_clave: |
  - **Intercepto con el eje $y$**: Punto cartesiano $(0, a)$ donde la gráfica corta al eje vertical.
  - **Propiedad del exponente nulo $b^0 = 1$**: Regla de potencias que convierte la base en la unidad al evaluar en $x = 0$.
  - **Invariancia por base**: Propiedad por la cual la base $b$ no altera las coordenadas del corte en el origen.
propiedades_relaciones: |
  - **Familia de curvas concurrente**: Todas las funciones exponenciales mónicas básicas de la forma $f(x) = b^x$ (con $a = 1$) concurren en el punto común $(0, 1)$.
  - **Desplazamiento por traslación vertical**: Si la función se traslada verticalmente en $k$ unidades ($f(x) = a \cdot b^x + k$), el nuevo intercepto se desplaza al punto $(0, a + k)$.
ejemplo_guiado:
  enunciado: 'Calcula el punto de intersección con el eje $y$ para las siguientes funciones exponenciales: A) $f(x) = 7 \cdot 3^x$, B) $g(x) = -2.5 \cdot (0.4)^x$, C) $h(x) = 5^{x+2}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 7 \cdot 3^x$, evaluamos en $x = 0 \implies f(0) = 7 \cdot 3^0 = 7 \cdot 1 = 7$. El punto de corte es $(0, 7)$.'
    - 'Paso 2: Para $g(x) = -2.5 \cdot (0.4)^x$, evaluamos en $x = 0 \implies g(0) = -2.5 \cdot (0.4)^0 = -2.5 \cdot 1 = -2.5$. El punto de corte es $(0, -2.5)$.'
    - 'Paso 3: Para $h(x) = 5^{x+2}$, evaluamos en $x = 0 \implies h(0) = 5^{0+2} = 5^2 = 25$. El punto de corte es $(0, 25)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las coordenadas del punto de corte de la gráfica $f(x) = -9 \cdot 2^x$ con el eje de las ordenadas (eje $y$)?'
    choices:
      - {text: '$(0, -9)$', is_correct: true}
      - {text: '$(0, 2)$', is_correct: false}
      - {text: '$(-9, 0)$', is_correct: false}
      - {text: '$(0, -18)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(0, -9)$''. Evaluamos $x = 0 \implies f(0) = -9 \cdot 2^0 = -9 \cdot 1 = -9$, lo que genera el punto de corte en $(0, -9)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función exponencial se expresa como $g(x) = 3 \cdot 4^x$, ¿cuál es el resultado de evaluar su intercepto con el eje $y$?'
    choices:
      - {text: 'El punto cartesiano $(0, 3)$', is_correct: true}
      - {text: 'El punto cartesiano $(0, 12)$', is_correct: false}
      - {text: 'El punto cartesiano $(0, 4)$', is_correct: false}
      - {text: 'El punto cartesiano $(3, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto cartesiano $(0, 3)$''. Evaluando $x = 0 \implies g(0) = 3 \cdot 4^0 = 3 \cdot 1 = 3$, obteniendo $(0, 3)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sustituir la variable independiente $x$ por el número 0 en la fórmula funcional.'
  - 'Paso 2: Aplicar la regla de potencias $b^0 = 1$ para simplificar el término exponencial.'
  - 'Paso 3: Multiplicar el resultado por el coeficiente multiplicativo $a$.'
  - 'Paso 4: Escribir el par ordenado del punto de intersección en la forma $(0, f(0))$.'
errores_correccion: |
  - **Error 1:** Reemplazar $y = 0$ para buscar el intercepto con el eje $y$. **Cómo corregirlo:** La intersección con el eje $y$ requiere $x = 0$. Reemplazar $y = 0$ busca intersecciones con el eje $x$ (las cuales no existen en la función exponencial básica).
  - **Error 2:** Multiplicar el coeficiente $a$ por la base $b$ antes de elevar a cero (ej: en $4 \cdot 3^0$ escribir $12^0 = 1$). **Cómo corregirlo:** La propiedad de exponentes actúa sobre la base: $3^0 = 1$. Luego se multiplica por $a$: $4 \cdot 1 = 4$.
ejemplos:
  - titulo: 'Cálculo de intercepto en función mónica'
    enunciado: '¿Dónde cruza al eje $y$ la función $f(x) = 10^x$?'
    alternativas:
      - 'En el punto $(0, 1)$'
      - 'En el punto $(0, 10)$'
      - 'En el punto $(1, 0)$'
    respuesta: 'En el punto $(0, 1)$'
    solucion_pasos:
      - '1. Evaluamos $x = 0 \implies f(0) = 10^0 = 1$.'
      - '2. El punto de corte es $(0, 1)$.'
  - titulo: 'Intercepto con coeficiente negativo'
    enunciado: '¿El intercepto con el eje $y$ de $g(x) = -6 \cdot 3^x$ se ubica en $(0, -6)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(0) = -6 \cdot 3^0 = -6 \cdot 1 = -6$. El punto es $(0, -6)$.'
  - titulo: 'Punto común de familias mónicas'
    enunciado: '¿Las funciones $f(x) = 2^x$, $g(x) = 5^x$ y $h(x) = 0.3^x$ se intersectan todas en el punto $(0, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser todas mónicas ($a = 1$), cumplen $f(0) = g(0) = h(0) = 1$.'
  - titulo: 'Invariancia por la base'
    enunciado: '¿Cambiar la base de $f(x) = 8 \cdot 2^x$ a $g(x) = 8 \cdot 9^x$ altera el punto de corte con el eje $y$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. En ambas funciones $a = 8$, por lo que ambas cortan al eje $y$ exactamente en $(0, 8)$.'
