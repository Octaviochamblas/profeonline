semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CRITERIO_LAL
resumen_inicial: 'Criterio de congruencia LAL: lado, ángulo comprendido, lado: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Un segundo criterio abreviado de congruencia, aún más económico
  en cuanto a datos necesarios en ciertos contextos, es el criterio LAL, que combina
  dos lados y el ángulo entre ellos.
explicacion_formal: '![Criterio de congruencia LAL](/static/img/geometria/congruencia-semejanza/congruencia-criterio-lal.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C''$ se cumple $AB=A''B''$, $\angle A=\angle
  A''$ y $AC=A''C''$ (con el ángulo A comprendido entre los lados AB y AC), entonces
  $\triangle ABC\cong\triangle A''B''C''$.


  ### Desarrollo didáctico


  Es esencial que el ángulo usado sea el que está exactamente entre los dos lados
  conocidos (el ángulo "comprendido"); si se usa un ángulo distinto, no se puede garantizar
  la congruencia con solo esos tres datos.'
definiciones_clave: '- **Criterio de congruencia LAL: lado, ángulo comprendido, lado**:
  Elemento o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a criterio de congruencia lal: lado, ángulo
  comprendido, lado.'
