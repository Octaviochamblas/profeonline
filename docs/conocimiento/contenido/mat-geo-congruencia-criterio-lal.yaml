    lado referida a $\alpha = 107^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1088 = 107 \implies x = 107 - 1088$.'
  - 'Concluir que la medida calculada para criterio de congruencia lal: lado, ángulo
    comprendido, lado es $x = -981^\circ$.'
