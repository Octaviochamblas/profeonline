procedimiento:
- 'Paso 1: Identifica dos lados de cada triángulo que quieras comparar.'
- 'Paso 2: Verifica que el ángulo comprendido entre esos dos lados también sea igual
  en ambos triángulos.'
- 'Paso 3: Si los dos lados y el ángulo comprendido coinciden, concluye congruencia
  por LAL.'
