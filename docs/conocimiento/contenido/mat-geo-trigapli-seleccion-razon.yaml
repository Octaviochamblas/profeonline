semantic_id: MAT.GEO.TRIG_APLICACIONES.SELECCION_RAZON_TRIGONOMETRICA
resumen_inicial: 'Selección de la razón trigonométrica adecuada según los datos del
  problema: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: 'Una vez modelado el triángulo rectángulo, el paso siguiente es
  decidir qué razón trigonométrica conviene usar, lo que depende exclusivamente de
  qué dos lados (o qué lado y qué ángulo) están involucrados: los conocidos y el que
  se busca.'
explicacion_formal: '![Selección de la razón trigonométrica](/static/img/geometria/trigonometria/trigapli-seleccion-razon.svg)


  ### Definición formal


  Si los datos involucran el cateto opuesto y la hipotenusa, se usa $\sin\theta$.
  Si involucran el cateto adyacente y la hipotenusa, se usa $\cos\theta$. Si involucran
  el cateto opuesto y el cateto adyacente (sin la hipotenusa), se usa $\tan\theta$.


  ### Desarrollo didáctico


  Por ejemplo, si se conoce la hipotenusa y se busca el cateto opuesto, se debe usar
  $\sin\theta=\dfrac{\text{opuesto}}{\text{hipotenusa}}$, despejando el opuesto. En
  cambio, si se conocen ambos catetos, no es necesario usar razones trigonométricas
  para encontrar el tercer lado directamente, aunque sí para encontrar el ángulo mediante
  $\tan\theta=\dfrac{\text{opuesto}}{\text{adyacente}}$.'
definiciones_clave: '- **Selección de la razón trigonométrica adecuada según los datos
  del problema**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a selección de la razón trigonométrica adecuada
  según los datos del problema.'
