procedimiento:
- 'Paso 1: Identifica, respecto del ángulo dado, cuáles de los tres lados (opuesto,
  adyacente, hipotenusa) son datos conocidos y cuál es la incógnita.'
- 'Paso 2: Si los dos lados involucrados son opuesto e hipotenusa, usa seno; si son
  adyacente e hipotenusa, usa coseno; si son opuesto y adyacente, usa tangente.'
- 'Paso 3: Plantea la ecuación con la razón elegida y despeja la incógnita.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con selección de la razón trigonométrica adecuada según los
  datos del problema.
