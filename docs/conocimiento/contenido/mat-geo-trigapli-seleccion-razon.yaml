    cateto $a = 1377\text{ cm}$ e hipotenusa $c = 4132\text{ cm}$. Calcula el valor
    de la función trigonométrica.
  pasos:
  - Aplicar la definición trigonométrica de selección de la razón trigonométrica adecuada
    según los datos del problema.
  - Sustituir los lados $a = 1377$ y $c = 4132$.
  - Calcular el valor exacto o aproximado de la razón.
