semantic_id: MAT.NUM.SERIE_GEOMETRICA.INTERPRETACION_LIMITE
resumen_inicial: 'Interpretación de la suma infinita como valor límite: concepto y
  desarrollo dentro de Serie geométrica finita e infinita.'
explicacion_simple: En la vida real, nadie puede sumar 'infinitas' veces. La paradoja
  de Zenón decía que Aquiles nunca alcanzaría a la tortuga porque siempre habría una
  distancia a la mitad que recorrer. Las matemáticas lo resolvieron con el concepto
  de 'Límite'.
explicacion_formal: 'Imagina que tienes una torta. El primer día comes la mitad (1/2).
  El segundo día comes la mitad de lo que quedó (1/4). El tercero la mitad de eso
  (1/8)....

  - Serie: $1/2 + 1/4 + 1/8 \dots$

  - Cálculo: $S = \frac{1/2}{1 - 1/2} = \frac{1/2}{1/2} = 1$.


  La fórmula dice que el total es ''1 torta entera''.

  - ¿Te la comerás toda alguna vez en la realidad? **NO.** Siempre quedará una miguita
  que partirás a la mitad al día siguiente.

  - Entonces, ¿qué significa ese ''1''? Es tu **Techo Insuperable**. Significa que
  jamás necesitarás ir a comprar una segunda torta, no importa cuántos días repitas
  el proceso.


  En PAES, las preguntas no siempre te pedirán calcular, sino interpretar qué significa
  ese techo en el contexto del problema (capacidad máxima de un estanque, distancia
  límite, etc).'
definiciones_clave: '- **Interpretación de la suma infinita como valor límite**: Concepto
