procedimiento:
- 'Paso 1: Calcula el valor de la serie infinita.'
- 'Paso 2: Acompáñalo verbalmente con palabras clave como ''límite'', ''techo'', ''no
  se superará'', o ''tiende a''.'
- 'Paso 3: Aplica esta idea al contexto (Ej: ''La población de abejas no superará
  los 1000 ejemplares'').'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en interpretación de la suma infinita como valor límite.
ejemplos:
- titulo: El estanque de químicos
  enunciado: A un estanque se le vierten 100L de químico, luego 50L, luego 25L, al
    infinito. Si el estanque hace 200L, ¿se rebalsará?
  solucion_pasos:
  - Calculamos S = 100 / (1 - 0.5) = 200.
  - La serie infinita da 200.
  - 'Interpretación: Al infinito, el volumen tenderá a 200L. Pero jamás los superará.
    No se rebalsará.'
errores_frecuentes:
- Creer que en algún paso específico 'n' se alcanza el valor de la serie infinita
  (Nunca se alcanza en un paso 'n' finito).
- Interpretar el límite como un promedio o un valor constante, en vez de entenderlo
  como el 'acumulado tope'.
afirmaciones_verdaderas:
- La formulación de interpretación de la suma infinita como valor límite mantiene
  la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando interpretación de
