procedimiento:
- 'Paso 1: Calcula el valor de la serie infinita.'
- 'Paso 2: Acompáñalo verbalmente con palabras clave como ''límite'', ''techo'', ''no se superará'',
  o ''tiende a''.'
- 'Paso 3: Aplica esta idea al contexto (Ej: ''La población de abejas no superará los 1000
  ejemplares'').'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en interpretación de la suma infinita como valor límite.
ejemplos:
- titulo: El estanque de químicos
  enunciado: A un estanque se le vierten 100L de químico, luego 50L, luego 25L, al infinito.
    Si el estanque hace 200L, ¿se rebalsará?
  solucion_pasos:
  - Calculamos S = 100 / (1 - 0.5) = 200.
  - La serie infinita da 200.
  - 'Interpretación: Al infinito, el volumen tenderá a 200L. Pero jamás los superará. No se
    rebalsará.'
- titulo: Ejemplo 1
  enunciado: Una serie infinita da como resultado 50 metros. ¿Qué significa este valor?
  alternativas:
  - Es el límite que la suma acumulada nunca superará
  - Es el valor del último término sumado
  - Es el promedio de los términos
  respuesta: Es el límite que la suma acumulada nunca superará
  solucion_pasos:
  - El resultado de una serie infinita convergente representa un techo insuperable, no un
    término individual.
- titulo: Ejemplo 2
  enunciado: Un estanque recibe una serie infinita de líquido que suma 150 litros, y su capacidad
    es 200 litros. ¿Se rebalsará?
  alternativas:
  - 'No'
  - Sí
  - Falta información
  respuesta: 'No'
  solucion_pasos:
  - El acumulado tiende a 150 litros, que es menor que la capacidad de 200 litros.
- titulo: ¿El valor límite de una suma infinita se alcanza en un paso n finito?
  respuesta: 'No'
  solucion_pasos:
  - Nunca se alcanza exactamente en un paso finito, solo se aproxima cada vez más.
- titulo: ¿Es correcto interpretar el valor límite como la capacidad máxima acumulada del
    fenómeno modelado?
  respuesta: Sí
  solucion_pasos:
  - Esa es la interpretación estándar del techo insuperable de una serie convergente.
errores_frecuentes:
- Creer que en algún paso específico 'n' se alcanza el valor de la serie infinita (Nunca se
  alcanza en un paso 'n' finito).
- Interpretar el límite como un promedio o un valor constante, en vez de entenderlo como el
  'acumulado tope'.
- Creer que el valor límite se alcanza exactamente en algún término finito de la suma.
- Interpretar la suma infinita como un promedio de los términos, en vez de un acumulado tope.
- Olvidar mencionar las unidades del contexto al interpretar el resultado.
afirmaciones_verdaderas:
- La formulación de interpretación de la suma infinita como valor límite mantiene la regularidad
  de la sucesión.
- El valor de una suma infinita convergente representa un techo o límite que la suma acumulada
  nunca supera, aunque se acerque cada vez más.
al_terminar_debes_poder: Resolver problemas prácticos utilizando interpretación de la suma
  infinita como valor límite.
