semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.ANTEPERIODO_IDENTIFICACION
resumen_inicial: El anteperíodo es el bloque de cifras decimales situadas entre la coma decimal y el comienzo del período en un decimal semiperiódico.
explicacion_simple: 'El anteperíodo son aquellos números que están a la derecha de la coma decimal pero que no llevan barra arriba porque no se repiten. Es el ''tramo inicial'' de la parte decimal antes de que empiece la repetición infinita del período.


  ![Identificación del anteperíodo decimal](/static/img/nodos/identificacion-del-anteperiodo-decimal-intro.svg)'
explicacion_formal: 'En la representación de un decimal semiperiódico $d = a_0, c_1 c_2 \dots c_m \overline{p_1 \dots p_k}$, el **Anteperíodo** $\mathcal{A}$ se define como el bloque de cifras:


  $$\mathcal{A} = (c_1, c_2, \dots, c_m) \quad (m \ge 1, \, c_j \in \{0,1,\dots,9\})$$


  **Desglose de la fórmula:**

  - $m$: Longitud o cantidad de dígitos que integran el anteperíodo.

  - Posición relativa: Ubicado estrictamente a la derecha de la coma y a la izquierda de la barra periódica.


  > **Complemento didáctico:** En $4,58333... = 4,58\overline{3}$, el anteperíodo es $58$ (tiene 2 dígitos), mientras que el período es $3$.'
definiciones_clave: '- **Anteperíodo decimal**: Conjunto de cifras decimales no repetitivas comprendidas entre la coma decimal y la barra periódica.'
propiedades_relaciones: '- **Extensión infalible**: Determina el número de ceros en el denominador de la fracción generatriz.'
ejemplo_guiado:
  enunciado: 'Identifique el anteperíodo y su longitud en el número $0,47898989... = 0,47\overline{89}$.


    ![Ejemplo Identificación del anteperíodo decimal](/static/img/nodos/identificacion-del-anteperiodo-decimal-ejemplos.svg)'
  pasos:
  - 'Paso 1: Ubicar la coma decimal y la barra del período.'
  - 'Paso 2: Extraer las cifras decimales comprendidas entre la coma y la barra: $47$.'
  - 'Paso 3: Contar el número de cifras extraídas: $2$ cifras ($4$ y $7$).'
  - 'Conclusión: El anteperíodo es $47$ y su longitud es de $2$ dígitos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se sitúa el anteperíodo en la expresión de un número decimal?
  choices:
  - text: Entre la coma decimal y el inicio de la barra del período
    is_correct: true
  - text: Debajo de la barra del período
    is_correct: false
  - text: A la izquierda de la coma decimal
    is_correct: false
  - text: En el lugar del entero
    is_correct: false
  explanation: La alternativa correcta es 'Entre la coma decimal y el inicio de la barra del período'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "En el ejemplo guiado para 0,47\bar{89}, ¿cuántas cifras forman el anteperíodo?"
  choices:
  - text: 2 cifras (el bloque 47)
    is_correct: true
  - text: 4 cifras
    is_correct: false
  - text: 0 cifras
    is_correct: false
  - text: 1 cifra
    is_correct: false
  explanation: La alternativa correcta es '2 cifras (el bloque 47)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la coma decimal y el símbolo de barra periódica.'
- 'Paso 2: Isolar la secuencia de dígitos decimales que NO llevan barra.'
- 'Paso 3: Declarar dichos dígitos como anteperíodo y contar su cantidad para determinar los ceros generatrices.'
errores_correccion: '- **Error 1: Creer que la parte entera del número forma parte del anteperíodo.** **Cómo corregirlo:** El anteperíodo incluye ÚNICAMENTE dígitos ubicados a la DERECHA de la coma decimal sin barra.


  - **Error 2: Pensar que los decimales periódicos puros tienen anteperíodo.** **Cómo corregirlo:** Los decimales periódicos puros NO TIENEN anteperíodo (su anteperíodo tiene longitud 0).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el anteperíodo en $3,5\overline{12}$?
  alternativas:
  - '5'
  - '35'
  - '12'
  respuesta: '5'
  solucion_pasos:
  - La única cifra entre la coma y la barra es $5 \implies$ anteperíodo 5.
- titulo: Ejemplo 2
  enunciado: ¿Tiene el número $0,\overline{7}$ anteperíodo?
  alternativas:
  - No, su anteperíodo tiene longitud cero
  - Sí, es 0
  - Sí, es 7
  respuesta: No, su anteperíodo tiene longitud cero
  solucion_pasos:
  - Por ser periódico puro, no posee anteperíodo.
- titulo: ¿Determina la cantidad de cifras del anteperíodo la cantidad de ceros en el denominador generatriz?
  respuesta: Sí
  solucion_pasos:
  - Sí, cada cifra del anteperíodo aporta un cero tras los nueves en el denominador.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
- titulo: ¿Es 01 el anteperíodo en $0,01\overline{6}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, las cifras entre la coma y la barra son $01$ (dos cifras).
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
errores_frecuentes:
- La parte entera situada a la izquierda de la coma forma parte del anteperíodo decimal.
- Los decimales periódicos puros poseen anteperíodos compuestos por números nueves.
- El anteperíodo es la cifra que se repite infinitas veces debajo de la barra.
- Cada cifra del anteperíodo genera un nueve en el denominador de su fracción generatriz.
- Un decimal finito carece de parte decimal por no tener anteperíodo.
afirmaciones_verdaderas:
- El anteperíodo consiste en las cifras decimales no repetitivas ubicadas entre la coma y la barra periódica.
- La cantidad de dígitos del anteperíodo determina el número de ceros agregados en el denominador de la fracción generatriz.
al_terminar_debes_poder: '**QUÉ:** Identificar y cuantificar las cifras del anteperíodo en un número decimal semiperiódico.


  **CÓMO:** Seleccionando exclusivamente las $m$ cifras decimales ubicadas a la derecha de la coma decimal y antes del inicio del período, deduciendo que la cantidad $m$ determina el número de ceros finales en el denominador generatriz ($\dots9900\dots0$).


  ![Resumen Identificación del anteperíodo decimal](/static/img/nodos/identificacion-del-anteperiodo-decimal-resumen.svg)'
