semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.PIE_ALTURA
resumen_inicial: 'Identificación del pie de la altura en un triángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: 'El segmento de la altura tiene un punto de llegada específico
  sobre la recta del lado opuesto; ese punto tiene nombre propio: pie de la altura.'
explicacion_formal: '![Pie de la altura](/static/img/geometria/elementos-secundarios/altura-ortocentro-pie-altura.svg)


  ### Definición formal


  Si la altura desde A cae sobre la recta BC en el punto H'', ese punto H'' es el
  pie de la altura desde A.


  ### Desarrollo didáctico


  En un triángulo acutángulo, el pie de cada altura cae dentro del lado correspondiente.
  En un triángulo obtusángulo, el pie de dos de las alturas cae fuera del segmento,
  sobre la prolongación de la recta.'
definiciones_clave: '- **Identificación del pie de la altura en un triángulo**: Elemento
  o propiedad fundamental en el estudio de elementos secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del pie de la altura en un
  triángulo.'
