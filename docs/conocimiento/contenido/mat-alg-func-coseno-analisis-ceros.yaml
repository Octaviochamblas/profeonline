semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.CEROS
resumen_inicial: 'Identificación de los ceros de la función coseno: círculo unitario,
  amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: A diferencia del seno, la curva del coseno cruza el eje $x$ en
  posiciones desplazadas medio ángulo recto respecto al origen.
explicacion_formal: '### Definición formal


  $\cos(x)=0$ exactamente cuando el punto asociado al ángulo $x$ tiene coordenada
  $x=0$, lo que ocurre cuando el lado terminal cae sobre el eje $y$, es decir, cuando
  $x=\pi/2+n\pi$ para algún entero $n$.


  ### Desarrollo didáctico


  $\cos(\pi/2)=0$ ($n=0$), $\cos(3\pi/2)=0$ ($n=1$), $\cos(-\pi/2)=0$ ($n=-1$). Todos
  estos valores están espaciados exactamente $\pi$ unidades entre sí, igual que los
  ceros del seno, pero desplazados $\pi/2$.'
definiciones_clave: '- **Identificación de los ceros de la función coseno**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de los ceros de la función coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de los ceros de la función coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de los ceros de la función coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
