semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.CEROS
resumen_inicial: 'Identificación de los ceros o raíces de la función coseno $f(x) = \cos(x)$ como el conjunto de múltiplos impares de $\frac{\pi}{2}$.'
explicacion_simple: |
  Los **ceros** o raíces de una función son los puntos en el eje horizontal ($x$) donde la gráfica toca o cruza la altura cero ($y = 0$). En el círculo unitario, la posición horizontal es cero arriba ($\frac{\pi}{2}$) y abajo ($\frac{3\pi}{2}$). Al dar vueltas completas hacia la derecha o hacia la izquierda, la función coseno vuelve a valer cero en $\frac{\pi}{2}, \frac{3\pi}{2}, \frac{5\pi}{2}, \dots$ y en $-\frac{\pi}{2}, -\frac{3\pi}{2}, \dots$. Es decir, los ceros del coseno ocurren exactamente en todos los múltiplos impares de $\frac{\pi}{2}$.
explicacion_formal: |
  ### Definición formal
  El **conjunto de ceros (o raíces)** de la función coseno fundamental $f(x) = \cos(x)$ es el conjunto discreto infinito de números reales definidos por la solución de la ecuación trigonométrica $\cos(x) = 0$:
  $$\mathcal{Z}(\cos) = \{x \in \mathbb{R} : \cos(x) = 0\} = \left\{\frac{\pi}{2} + k\pi : k \in \mathbb{Z}\right\} = \left\{\frac{(2k + 1)\pi}{2} : k \in \mathbb{Z}\right\}$$
  donde $k$ representa cualquier número entero ($\dots, -2, -1, 0, 1, 2, \dots$).

  ### Desglose simbólico
  - $x = \frac{\pi}{2}$ ($k = 0$): Primer cero positivo en $\left(\frac{\pi}{2}, 0\right)$.
  - $x = \frac{3\pi}{2}$ ($k = 1$): Segundo cero positivo en $\left(\frac{3\pi}{2}, 0\right)$.
  - $x = -\frac{\pi}{2}$ ($k = -1$): Primer cero negativo en $\left(-\frac{\pi}{2}, 0\right)$.
  - $x = -\frac{3\pi}{2}$ ($k = -2$): Segundo cero negativo en $\left(-\frac{3\pi}{2}, 0\right)$.

  ### Síntesis didáctica
  Los ceros del coseno dividen a la onda cosenoidal en semi-ondas alternadas. La distancia entre dos ceros consecutivos de la función coseno base es constante e igual a $\pi$ radianes ($180^\circ$).
definiciones_clave: |
  - **Ceros / Raíces de la función**: Puntos del dominio donde el valor de la función se anula ($f(x) = 0$).
  - **Conjunto de múltiplos impares $\frac{(2k+1)\pi}{2}$**: Expresión analítica universal que representa los ceros del coseno.
  - **Intersecciones con el eje X**: Puntos cartesianos de la forma $\left(\frac{\pi}{2} + k\pi, 0\right)$.
propiedades_relaciones: |
  - **Espaciamiento equidistante**: La distancia horizontal entre cualquier par de ceros consecutivos es siempre de $\pi$ unidades.
  - **Puntos de inflexión**: Todos los ceros de la función coseno base $f(x) = \cos(x)$ son simultáneamente puntos de inflexión donde cambia la concavidad de la curva.
ejemplo_guiado:
  enunciado: 'Encuentra los ceros de la función $f(x) = \cos(2x)$ en el intervalo $[0, \pi]$.'
  pasos:
    - 'Paso 1: Plantear la ecuación de ceros igualando el argumento a la fórmula general $\frac{\pi}{2} + k\pi$: $2x = \frac{\pi}{2} + k\pi$.'
    - 'Paso 2: Despejar la variable $x$: $x = \frac{\pi}{4} + \frac{k\pi}{2}$ para $k \in \mathbb{Z}$.'
    - 'Paso 3: Sustituir valores enteros de $k$ para encontrar las soluciones en $[0, \pi]$:
      - $k = 0 \implies x = \frac{\pi}{4}$
      - $k = 1 \implies x = \frac{\pi}{4} + \frac{\pi}{2} = \frac{3\pi}{4}$'
    - 'Paso 4: Concluir que los ceros en dicho intervalo son $\left\{\frac{\pi}{4}, \frac{3\pi}{4}\right\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la expresión analítica que representa a todos los ceros de la función coseno base $f(x) = \cos(x)$?'
    choices:
      - {text: '$x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$', is_correct: true}
      - {text: '$x = k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = 2k\pi$ con $k \in \mathbb{Z}$', is_correct: false}
      - {text: '$x = \frac{k\pi}{3}$ con $k \in \mathbb{Z}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$''. La función coseno se anula en los múltiplos impares de $\frac{\pi}{2}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Es el origen $(0,0)$ un cero de la función coseno base $f(x) = \cos(x)$?'
    choices:
      - {text: 'No, el origen no es un cero pues $\cos(0) = 1$', is_correct: true}
      - {text: 'Sí, pues toda función trigonométrica pasa por $(0,0)$', is_correct: false}
      - {text: 'Sí, pues $\cos(0) = 0$', is_correct: false}
      - {text: 'No, porque el coseno no interseca al eje X', is_correct: false}
    explanation: 'La alternativa correcta es ''No, el origen no es un cero pues $\cos(0) = 1$''. Puesto que $\cos(0) = 1$, en $x = 0$ la función vale $1$, no cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Igualar la función a cero: $\cos(\text{argumento}) = 0$.'
  - 'Paso 2: Asignar al argumento la expresión general de los ceros: $\text{argumento} = \frac{\pi}{2} + k\pi$ para $k \in \mathbb{Z}$.'
  - 'Paso 3: Despejar la variable $x$ de la ecuación algebráica.'
  - 'Paso 4: Seleccionar las soluciones pertenecientes al intervalo específico solicitado en el problema.'
errores_correccion: |
  - **Error 1:** Confundir los ceros del coseno con los ceros del seno (creer que el coseno es cero en $x = 0$ o $x = \pi$). **Cómo corregirlo:** En $x = 0$ el coseno vale $1$ y en $x = \pi$ vale $-1$. El coseno se anula únicamente en los múltiplos impares de $\frac{\pi}{2}$ ($\frac{\pi}{2}, \frac{3\pi}{2}, \dots$).
  - **Error 2:** Considerar únicamente las soluciones positivas u olvidar los ceros en el sentido negativo. **Cómo corregirlo:** El conjunto de ceros abarca a todos los enteros $k \in \mathbb{Z}$, incluyendo enteros negativos ($x = -\frac{\pi}{2}, -\frac{3\pi}{2}$).
ejemplos:
  - titulo: 'Primer cero positivo'
    enunciado: '¿En qué valor del primer cuadrante el coseno se anula por primera vez?'
    alternativas:
      - '$x = \frac{\pi}{2}$'
      - '$x = 0$'
      - '$x = \pi$'
    respuesta: '$x = \frac{\pi}{2}$'
    solucion_pasos:
      - '1. $\cos\left(\frac{\pi}{2}\right) = 0$.'
      - '2. El primer cero positivo es $x = \frac{\pi}{2}$ ($90^\circ$).'
  - titulo: 'Ceros en un ciclo base'
    enunciado: '¿Cuántos ceros tiene la función coseno base en el intervalo $[0, 2\pi]$?'
    alternativas:
      - '2 ceros ($\frac{\pi}{2}$ y $\frac{3\pi}{2}$)'
      - '3 ceros ($0, \pi, 2\pi$)'
      - '1 cero ($\pi$)'
    respuesta: '2 ceros ($\frac{\pi}{2}$ y $\frac{3\pi}{2}$)'
    solucion_pasos:
      - '1. En $[0, 2\pi]$, $k = 0 \implies x = \frac{\pi}{2}$ y $k = 1 \implies x = \frac{3\pi}{2}$.'
      - '2. Hay 2 ceros en dicho intervalo.'
  - titulo: 'Cero en ángulo negativo'
    enunciado: '¿Es $x = -\frac{\pi}{2}$ un cero de la función coseno base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\cos\left(-\frac{\pi}{2}\right) = \cos\left(\frac{\pi}{2}\right) = 0$.'
  - titulo: 'Distancia entre ceros del coseno'
    enunciado: '¿La distancia entre el cero en $\frac{\pi}{2}$ y el cero en $\frac{3\pi}{2}$ es igual a $\pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\frac{3\pi}{2} - \frac{\pi}{2} = \frac{2\pi}{2} = \pi$.'
errores_frecuentes:
  - 'La afirmación de que los ceros de la función coseno ocurren en los múltiplos enteros de $\pi$.'
  - 'La afirmación de que el origen $(0,0)$ es un cero de la función coseno base.'
  - 'La afirmación de que la función coseno posee un número finito de ceros en todo el plano real.'
  - 'La afirmación de que los ceros del coseno y del seno ocurren exactamente en los mismos puntos.'
  - 'La afirmación de que en $x = \frac{\pi}{2}$ la función coseno alcanza su punto máximo.'
afirmaciones_verdaderas:
  - 'Los ceros de la función coseno base $f(x) = \cos(x)$ coinciden de forma exacta con el conjunto de los múltiplos impares de $\frac{\pi}{2}$ ($x = \frac{\pi}{2} + k\pi$ con $k \in \mathbb{Z}$).'
  - 'La distancia horizontal entre cualquier par de ceros consecutivos de la función coseno base es constante e igual a $\pi$ radianes.'
al_terminar_debes_poder: |
  QUÉ: Identificar y resolver ecuaciones para encontrar los ceros de la función coseno y sus transformaciones.
  CÓMO: Igualar el argumento de la función a la expresión analítica $\frac{\pi}{2} + k\pi$ ($k \in \mathbb{Z}$) y despejar la variable $x$.
