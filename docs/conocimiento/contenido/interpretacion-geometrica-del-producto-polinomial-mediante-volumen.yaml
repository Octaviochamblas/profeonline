procedimiento:
- 'Paso 1: Identifica las dimensiones o factores que componen el producto polinomial.'
- 'Paso 2: Descompón cada dimensión en sus términos y asocia cada combinación posible
  a un subvolumen.'
- 'Paso 3: Calcula cada subvolumen multiplicando un término de cada factor involucrado.'
- 'Paso 4: Suma todos los subvolúmenes parciales respetando sus signos y grados.'
- 'Paso 5: Reduce los términos semejantes y expresa el volumen total como un único
  polinomio.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en interpretación geométrica del producto polinomial mediante volumen.
ejemplos:
- titulo: Si en la cuadrícula de $(x^2 + ax + 3)(x - 2)$ la suma de los términos en
    $x$ resulta ser $0
  enunciado: 'Si en la cuadrícula de $(x^2 + ax + 3)(x - 2)$ la suma de los términos
    en $x$ resulta ser $0$, el valor de $a$ es:


    Opciones: A) $1.5$ · B) $3$ · C) $-1.5$ · D) $-3$'
  solucion_pasos:
  - 'Términos en $x$: $(ax)(-2) = -2ax$ y $(3)(x) = 3x$. Suma es $(3 - 2a)x = 0$.
    Entonces $2a = 3 \Rightarrow a = 1.5$.'
  - 'Respuesta: $1.5$'
- titulo: Al calcular el volumen de un prisma $(x^2-2x+5)(3x-1)$, el coeficiente de
    $x^2$ y el término
  enunciado: 'Al calcular el volumen de un prisma $(x^2-2x+5)(3x-1)$, el coeficiente
    de $x^2$ y el término constante del polinomio resultante son, respectivamente:


    Opciones: A) $-7$ y $-5$ · B) $-7$ y $5$ · C) $7$ y $-5$ · D) $-1$ y $-5$'
  solucion_pasos:
  - 'Término en $x^2$: $(-2x)(3x) + (x^2)(-1) = -6x^2 - x^2 = -7x^2$. Constante: $(5)(-1)
    = -5$.'
  - 'Respuesta: $-7$ y $-5$'
- titulo: 'Respecto de «Interpretación geométrica del producto polinomial mediante
    volumen»: ¿Describe'
  enunciado: 'Respecto de «Interpretación geométrica del producto polinomial mediante
    volumen»: ¿Describe adecuadamente el concepto esta frase? «Un factor tiene 3 términos
    (3 columnas) y el otro 2 términos (2 filas)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un factor tiene 3 términos (3
    columnas) y el otro 2 términos (2 filas).'
- titulo: 'Respecto de «Interpretación geométrica del producto polinomial mediante
    volumen»: ¿Se puede'
  enunciado: 'Respecto de «Interpretación geométrica del producto polinomial mediante
    volumen»: ¿Se puede aceptar esta afirmación? «Para «Al utilizar una cuadrícula
    para multiplicar un trinomio por un binomio, ¿qué tamaño tendrá la tabla», la
    respuesta correcta es $3 \times 3$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un factor tiene 3 términos (3
    columnas) y el otro 2 términos (2 filas).'
errores_frecuentes:
- Para «Al utilizar una cuadrícula para multiplicar un trinomio por un binomio, ¿qué
  tamaño tendrá la tabla», la respuesta correcta es $3 \times 3$.
- Para «Al utilizar una cuadrícula para multiplicar un trinomio por un binomio, ¿qué
  tamaño tendrá la tabla», la respuesta correcta es $2 \times 2$.
- Para «Al utilizar una cuadrícula para multiplicar un trinomio por un binomio, ¿qué
  tamaño tendrá la tabla», la respuesta correcta es $6 \times 6$.
- Las multiplicaciones siempre darán cero en las esquinas.
- Para «Si los polinomios están ordenados por grado, ¿cuál es la gran ventaja de organizar
  sus términos en los bordes de la cuadrícula», la respuesta correcta es Se puede
  omitir la fila de en medio.
