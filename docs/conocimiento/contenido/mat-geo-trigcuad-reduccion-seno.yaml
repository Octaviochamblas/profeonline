semantic_id: MAT.GEO.TRIG_CUADRANTES.REDUCCION_SENO
resumen_inicial: 'Reducción del seno al primer cuadrante usando ángulo de referencia:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: En vez de memorizar el seno de todos los ángulos posibles, basta
  con conocer el seno de ángulos agudos (primer cuadrante) y aplicar el signo correcto
  según el cuadrante del ángulo original.
explicacion_formal: '![Reducción del seno al primer cuadrante](/static/img/geometria/trigonometria/trigcuad-reduccion-seno.svg)


  ### Definición formal


  Si $\alpha$ es el ángulo de referencia de $\theta$, entonces $|\sin\theta|=\sin\alpha$,
  y el signo de $\sin\theta$ se determina según el cuadrante de $\theta$ (positivo
  en I y II, negativo en III y IV).


  ### Desarrollo didáctico


  Para $\theta=150°$ (segundo cuadrante), el ángulo de referencia es $\alpha=30°$.
  Como el seno es positivo en el segundo cuadrante, $\sin150°=+\sin30°=0{,}5$.'
definiciones_clave: '- **Reducción del seno al primer cuadrante usando ángulo de referencia**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a reducción del seno al primer cuadrante usando
  ángulo de referencia.'
ejemplo_guiado:
  enunciado: Para evaluar la razón o relación en reducción del seno al primer cuadrante
    usando ángulo de referencia, se considera un triángulo rectángulo con cateto $a
    = 1383\text{ cm}$ e hipotenusa $c = 4150\text{ cm}$. Calcula el valor de la función
    trigonométrica.
  pasos:
  - Aplicar la definición trigonométrica de reducción del seno al primer cuadrante
    usando ángulo de referencia.
  - Sustituir los lados $a = 1383$ y $c = 4150$.
  - Calcular el valor exacto o aproximado de la razón.
