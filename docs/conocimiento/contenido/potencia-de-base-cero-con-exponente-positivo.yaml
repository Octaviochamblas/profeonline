semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_CERO_EXPONENTE_POSITIVO
resumen_inicial: El cero elevado a cualquier exponente real positivo es siempre igual a cero
  ($0^n = 0$ para $n > 0$).
explicacion_simple: 'Cuando la base es cero y el exponente es positivo, multiplicas cero por
  sí mismo varias veces:

  - $0^2 = 0 \cdot 0 = 0$

  - $0^5 = 0 \cdot 0 \cdot 0 \cdot 0 \cdot 0 = 0$

  El resultado siempre es $0$.'
explicacion_formal: Para todo $n \in \mathbb{R}^+$ (exponente estrictamente positivo), se
  define $0^n = 0$. Dado que el cero es el elemento absorbente de la multiplicación, el producto
  de $n$ factores nulos resulta en 0.
definiciones_clave: '- **Absorción de la base cero**: $0^n = 0$ para $n > 0$.'
propiedades_relaciones: '- **Exponente positivo obligatorio**: Esta regla requiere estrictamente
  que el exponente sea $n > 0$.'
ejemplo_guiado:
  enunciado: Calcula $0^8$.
  pasos:
  - Identificar base $a = 0$ y exponente $n = 8 > 0$.
  - 'Aplicar la regla de base cero con exponente positivo: $0^8 = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de $0^{12}$?
  choices:
  - text: '0'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '12'
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: 'La correcta es: 0. Cero elevado a cualquier exponente positivo resulta 0.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué valor se obtiene al calcular $0^{0{,}5}$ (raíz de cero)?
  choices:
  - text: '0'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '0.5'
    is_correct: false
  - text: No existe
    is_correct: false
  explanation: 'La correcta es: 0. Como el exponente $0{,}5 > 0$, $0^{0{,}5} = 0$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que la base es igual a 0.'
- 'Paso 2: Verificar que el exponente sea estrictamente mayor que 0.'
- 'Paso 3: Concluir que el valor de la potencia es 0.'
errores_correccion: No confundir la base cero con el exponente cero. $0^5 = 0$, pero $5^0
  = 1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $0^1$.
  alternativas:
  - '0'
  - '1'
  - Indefinido
  respuesta: '0'
  solucion_pasos:
  - $0^1 = 0$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de 0^7?
  alternativas:
  - '0'
  - '1'
  - '7'
  respuesta: '0'
  solucion_pasos:
  - La base 0 elevada a cualquier exponente positivo da 0.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de 0^(1/2) (raíz cuadrada de 0)?
  alternativas:
  - '0'
  - '1'
  - No existe
  respuesta: '0'
  solucion_pasos:
  - El exponente 1/2 es positivo, por lo que 0^(1/2) = 0.
- titulo: ¿Es 0^3 igual a 3^0?
  respuesta: 'No'
  solucion_pasos:
  - 0^3 = 0, mientras que 3^0 = 1; son resultados distintos.
errores_frecuentes:
- Confundir base cero con exponente cero.
- Aplicar la regla 0^n=0 al caso en que el exponente también es cero.
- Pensar que 0 elevado a cualquier número negativo también da 0.
- Confundir el resultado de 0^n con el de n^0.
- Creer que el valor del exponente no afecta el resultado cuando la base es 0.
afirmaciones_verdaderas:
- $0^n = 0$ para todo $n > 0$.
- La regla 0^n=0 exige que el exponente n sea estrictamente positivo.
al_terminar_debes_poder: Resolver de forma inmediata potencias de base cero con exponente
  positivo.
fuente: Texto escolar MINEDUC.
estado: publicado
