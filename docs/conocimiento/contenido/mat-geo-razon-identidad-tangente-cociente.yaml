semantic_id: MAT.GEO.TRIG_IDENTIDADES.TANGENTE_COCIENTE
resumen_inicial: 'Identidad de la tangente como cociente entre seno y coseno: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo Rectángulo.'
explicacion_simple: Como el seno y el coseno comparten la misma hipotenusa en el denominador,
  al dividir uno por el otro esa hipotenusa se cancela, dejando exactamente la tangente.
explicacion_formal: '![Identidad de la tangente como cociente](/static/img/geometria/trigonometria/razon-identidad-tangente-cociente.svg)


  ### Definición formal


  Como $\sin\theta=\dfrac{\text{opuesto}}{\text{hipotenusa}}$ y $\cos\theta=\dfrac{\text{adyacente}}{\text{hipotenusa}}$,
  al dividir: $\dfrac{\sin\theta}{\cos\theta}=\dfrac{\text{opuesto}/\text{hipotenusa}}{\text{adyacente}/\text{hipotenusa}}=\dfrac{\text{opuesto}}{\text{adyacente}}=\tan\theta$.


  ### Desarrollo didáctico


  Si $\sin\theta=0{,}6$ y $\cos\theta=0{,}8$, entonces $\tan\theta=\dfrac{0{,}6}{0{,}8}=0{,}75$,
  coincidiendo con el valor calculado directamente desde los catetos.'
definiciones_clave: '- **Identidad de la tangente como cociente entre seno y coseno**:
  Elemento o propiedad fundamental en el estudio de trigonometría en el triángulo
  rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
