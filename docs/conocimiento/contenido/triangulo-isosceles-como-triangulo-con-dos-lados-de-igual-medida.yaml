semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ISOSCELES
resumen_inicial: Un triángulo isósceles es aquel polígono de tres lados que tiene
  al menos dos lados de igual medida, lo que implica necesariamente que los dos ángulos
  opuestos a dichos lados sean congruentes.
explicacion_simple: '![Triángulo Isósceles](/static/img/nodos/triangulo-isosceles-como-triangulo-con-dos-lados-de-igual-medida-intro.svg)


  Un **triángulo isósceles** es como un techo simétrico o una pirámide: tiene **dos
  lados que miden exactamente lo mismo** y un tercer lado que suele ser diferente
  (llamado base). Por tener dos lados iguales, también tiene **dos ángulos iguales**
  en la parte inferior.'
explicacion_formal: '### Definición formal

  Un triángulo $\Delta ABC$ es **isósceles** si posee al menos dos lados de igual
  longitud (lados congruentes o laterales), denominándose **base** al tercer lado:


  $$\Delta ABC \text{ es isósceles} \iff \exists \, (u, v) \in \{a, b, c\}^2, \; u
  = v$$


  $$AB = AC = b \quad (\text{Lados iguales}) \quad \land \quad BC = a \quad (\text{Base})$$


  ### Desglose simbólico y geométrico

  - Lados congruentes ($b$): Los dos lados de igual medida que confluyen en el vértice
  principal.

  - Base ($a$): Lado basal opuesto al vértice principal.

  - Eje de simetría axial: Posee exactamente un eje de simetría perpendicular a la
  base.


  ### Síntesis didáctica

  El triángulo isósceles combina simetría axial con flexibilidad métrica, sirviendo
  de base en la construcción de polígonos regulares y estructuras simétricas.'
definiciones_clave: '- **Triángulo isósceles**: Triángulo con dos lados de igual medida.

  - **Lados congruentes (piernas)**: Los dos lados iguales del triángulo.

  - **Base**: El lado opuesto al vértice principal.

  - **Ángulos basales**: Los dos ángulos congruentes adyacentes a la base. '
propiedades_relaciones: '- **Eje de simetría**: Posee una recta de simetría que pasa
  por el vértice principal y corta perpendicularmente a la base en su punto medio.

  - **Perímetro**: $P = 2L + b$, donde $L$ es la longitud de los lados iguales y $b$
  es la base. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Isósceles](/static/img/nodos/triangulo-isosceles-como-triangulo-con-dos-lados-de-igual-medida-ejemplos.svg)


    En un triángulo isósceles, los lados iguales miden $8\text{ cm}$ cada uno y el
    perímetro total es $22\text{ cm}$. Calcula la longitud de la base y determina
    los ángulos si el ángulo del vértice principal mide $50^\circ$.'
  pasos:
  - 'Paso 1: Plantear la fórmula del perímetro: $P = 2L + b$.'
  - 'Paso 2: Sustituir los valores conocidos: $22 = 2(8) + b = 16 + b$.'
  - 'Paso 3: Despejar la base: $b = 22 - 16 = 6\text{ cm}$.'
  - 'Paso 4: Calcular los ángulos basales sabiendo que $\alpha = 50^\circ$ y $\beta
    = \gamma$: $2\beta = 180^\circ - 50^\circ = 130^\circ \implies \beta = 65^\circ$.'
  - 'Paso 5: Concluir que la base mide $6\text{ cm}$ y los ángulos basales miden $65^\circ$
    cada uno.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la propiedad fundamental que define a un triángulo isósceles?
  choices:
  - text: Tener al menos dos lados de igual medida (congruentes)
    is_correct: true
  - text: Tener sus tres lados distintos
    is_correct: false
  - text: Tener obligatoriamente un ángulo de 90°
    is_correct: false
  - text: Tener sus tres ángulos iguales a 60°
    is_correct: false
  explanation: Por definición geométrica, un triángulo isósceles se caracteriza por
    tener al menos dos lados de igual medida (congruentes).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo isósceles el ángulo principal mide 40°, ¿cuánto mide
    cada ángulo basal?
  choices:
  - text: 70° cada uno (porque (180° - 40°) / 2 = 70°)
    is_correct: true
  - text: 40° cada uno
    is_correct: false
  - text: 60° cada uno
    is_correct: false
  - text: 80° cada uno
    is_correct: false
  explanation: Restando 40° de 180° y dividiendo por 2 se obtiene 70° cada uno (porque
    (180° - 40°) / 2 = 70°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos lados congruentes $L_1 = L_2$.'
- 'Paso 2: Reconocer el tercer lado como la base $b$.'
- 'Paso 3: Aplicar la igualdad de ángulos basales $\beta = \gamma = (180^\circ - \alpha)/2$.'
- 'Paso 4: Calcular el perímetro mediante $P = 2L + b$.'
errores_correccion: Recuerda que los ángulos iguales son los que están en la base
  (frente a los lados iguales), no el del vértice principal.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene lados de $10\text{ cm}, 10\text{ cm}$ y $6\text{
    cm}$, ¿cómo se clasifica?
  alternativas:
  - Triángulo isósceles
  - Triángulo escaleno
  - Triángulo equilátero
  respuesta: Triángulo isósceles
  solucion_pasos:
  - Tiene dos lados congruentes de $10\text{ cm}$, por lo que es isósceles.
- titulo: Ejemplo 2
  enunciado: En un triángulo isósceles, un ángulo basal mide $55^\circ$. ¿Cuánto mide
    el ángulo del vértice principal?
  alternativas:
  - $70^\circ$
  - $55^\circ$
  - $90^\circ$
  respuesta: $70^\circ$
  solucion_pasos:
  - Ambos ángulos basales miden $55^\circ$. El vértice principal mide $180^\circ -
    2(55^\circ) = 180^\circ - 110^\circ = 70^\circ$.
- titulo: ¿Un triángulo con dos lados de 8 cm y uno de 5 cm es isósceles?
  respuesta: Sí
  solucion_pasos:
  - Sí, tiene dos lados iguales a 8 cm.
- titulo: ¿Un triángulo isósceles puede tener tres ángulos todos distintos?
  respuesta: 'No'
  solucion_pasos:
  - No, obligatoriamente tiene al menos dos ángulos iguales opuestos a sus lados congruentes.
errores_frecuentes:
- Confundir el ángulo del vértice principal con los ángulos basales.
- Creer que la base siempre debe estar apoyada horizontalmente.
- Olvidar dividir por 2 al calcular los ángulos basales.
- Despejar erróneamente el perímetro $P = 2L + b$.
- 'Creer que un triángulo no puede ser isósceles y rectángulo a la vez (sí puede:
  $45^\circ, 45^\circ, 90^\circ$).'
afirmaciones_verdaderas:
- Un triángulo isósceles tiene al menos dos lados de igual medida.
- Los ángulos opuestos a los lados congruentes son de igual medida.
al_terminar_debes_poder: '**QUÉ:** Identificar, caracterizar y resolver problemas
  con triángulos isósceles.


  **CÓMO:** Reconociendo los dos lados congruentes, calculando el perímetro ($2L +
  b$) y aplicando la igualdad de ángulos basales.


  ![Resumen de Triángulo Isósceles](/static/img/nodos/triangulo-isosceles-como-triangulo-con-dos-lados-de-igual-medida-resumen.svg)'
