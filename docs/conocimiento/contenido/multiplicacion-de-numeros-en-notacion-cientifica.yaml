semantic_id: MAT.NUM.NOTACION_CIENTIFICA.MULTIPLICACION
resumen_inicial: 'Para multiplicar números en notación científica, se multiplican las mantisas entre sí y se suman los exponentes de las potencias de diez: $(a \cdot 10^m) \cdot (b \cdot 10^n) = (a \cdot b) \cdot 10^{m+n}$, normalizando el resultado final.'
explicacion_simple: '![Multiplicación en notación científica](/static/img/nodos/multiplicacion-de-numeros-en-notacion-cientifica-intro.svg)


  Multiplicar números en notación científica es un proceso de dos partes:

  1. **Multiplicas los números de adelante** (las mantisas $a \cdot b$).

  2. **Sumas los exponentes de diez** ($10^{m+n}$) gracias a las leyes de potencias de igual base.

  3. **Paso final obligatorio:** Si el resultado de las mantisas te da $10$ o más (por ejemplo $20$), debes normalizarlo moviendo la coma a la izquierda y sumando $1$ al exponente: $20 \cdot 10^7 = 2 \cdot 10^8$.'
explicacion_formal: "Sean $x = a \\cdot 10^m$ e $y = b \\cdot 10^n$ dos números en notación científica ($1 \\le a, b < 10$ y $m, n \\in \\mathbb{Z}$). El **Producto en Notación Científica** se define por asociatividad y conmutatividad en $\\mathbb{R}$:\n\n$$x \\cdot y = (a \\cdot b) \\cdot 10^{m+n}$$\n\n**Fase de Renormalización:**\nComo $1 \\le a < 10$ y $1 \\le b < 10$, el producto $a \\cdot b$ satisface $1 \\le a \\cdot b < 100$:\n- **Si $1 \\le a \\cdot b < 10$:** La expresión ya está normalizada.\n- **Si $10 \\le a \\cdot b < 100$:** Se define $k = \\frac{a \\cdot b}{10} \\in [1, 10)$ y se incrementa el exponente:\n  $$x \\cdot y = k \\cdot 10^{(m+n)+1}$$"
definiciones_clave: '- **Producto de mantisas ($a \cdot b$)**: Multiplicación directa de los coeficientes decimales.

  - **Renormalización ascendente**: Ajuste $k = (a \cdot b)/10$ con exponente $(m+n+1)$ cuando el producto es $\ge 10$.'
propiedades_relaciones: '- **Exponentes negativos**: Aplica la suma algebraica normal: $10^{-3} \cdot 10^7 = 10^{-3+7} = 10^4$.

  - **Conmutatividad**: $(a \cdot 10^m) \cdot (b \cdot 10^n) = (b \cdot 10^n) \cdot (a \cdot 10^m)$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de multiplicación en notación científica](/static/img/nodos/multiplicacion-de-numeros-en-notacion-cientifica-ejemplos.svg)


    Calcule el producto de $(3 \cdot 10^4) \cdot (2 \cdot 10^5)$, $(6 \cdot 10^{-3}) \cdot (4 \cdot 10^7)$ y $(1,5 \cdot 10^{-2}) \cdot (2 \cdot 10^{-4})$ en notación científica normalizada.'
  pasos:
  - 'Paso 1: Evaluar $(3 \cdot 10^4) \cdot (2 \cdot 10^5)$: Multiplicar mantisas $3 \cdot 2 = 6$. Sumar exponentes: $4 + 5 = 9$. Resultado: $6 \cdot 10^9$ (ya normalizado).'
  - 'Paso 2: Evaluar $(6 \cdot 10^{-3}) \cdot (4 \cdot 10^7)$: Multiplicar mantisas $6 \cdot 4 = 24$. Sumar exponentes: $-3 + 7 = 4$. Queda $24 \cdot 10^4$. Normalizar: $24 = 2,4 \cdot 10^1 \implies 2,4 \cdot 10^5$.'
  - 'Paso 3: Evaluar $(1,5 \cdot 10^{-2}) \cdot (2 \cdot 10^{-4})$: Multiplicar mantisas $1,5 \cdot 2 = 3$. Sumar exponentes: $-2 + (-4) = -6$. Resultado: $3 \cdot 10^{-6}$.'
  - 'Conclusión: Los resultados son $6 \cdot 10^9$, $2,4 \cdot 10^5$ y $3 \cdot 10^{-6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado simplificado y normalizado de $(5 \cdot 10^3) \cdot (4 \cdot 10^6)$?
  choices:
  - text: $2 \cdot 10^{10}$ (porque $5 \cdot 4 = 20 = 2 \cdot 10^1$ y $1 + 3 + 6 = 10$)
    is_correct: true
  - text: $20 \cdot 10^9$
    is_correct: false
  - text: $2 \cdot 10^9$
    is_correct: false
  - text: $20 \cdot 10^{18}$
    is_correct: false
  explanation: La alternativa correcta es '$2 \cdot 10^{10}$ (porque $5 \cdot 4 = 20 = 2 \cdot 10^1$ y $1 + 3 + 6 = 10$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(6 \cdot 10^{-3}) \cdot (4 \cdot 10^7)$ dio como exponente final $5$ y no $4$?
  choices:
  - text: Porque $6 \cdot 4 = 24$, y al normalizar $24$ a $2,4$ se suma $1$ al exponente ($4 + 1 = 5$)
    is_correct: true
  - text: Porque se restaron los exponentes
    is_correct: false
  - text: Porque $7 - 3 + 1 = 5$
    is_correct: false
  - text: Porque el $4$ es par
    is_correct: false
  explanation: La alternativa correcta es 'Porque $6 \cdot 4 = 24$, y al normalizar $24$ a $2,4$ se suma $1$ al exponente ($4 + 1 = 5$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los coeficientes $a$ y $b$ entre sí.'
- 'Paso 2: Sumar algebraicamente los exponentes de diez: $m + n$.'
- 'Paso 3: Si el producto $a \cdot b \ge 10$, desplazar la coma un lugar a la izquierda y sumar $1$ al exponente final.'
errores_correccion: '- **Error 1: Dejar el resultado sin normalizar ($25 \cdot 10^6$).** **Cómo corregirlo:** La notación científica exige $1 \le k < 10$. Escribir $2,5 \cdot 10^7$.

  - **Error 2: Multiplicar los exponentes en vez de sumarlos.** **Cómo corregirlo:** Por leyes de potencias de igual base, los exponentes se SUMAN: $10^m \cdot 10^n = 10^{m+n}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de $(2 \cdot 10^3) \cdot (3 \cdot 10^4)$?
  alternativas:
  - $6 \cdot 10^7$
  - $6 \cdot 10^{12}$
  - $5 \cdot 10^7$
  respuesta: $6 \cdot 10^7$
  solucion_pasos:
  - $(2 \cdot 3) \cdot 10^{3+4} = 6 \cdot 10^7$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado normalizado de $(4 \cdot 10^5) \cdot (5 \cdot 10^3)$?
  alternativas:
  - $2 \cdot 10^9$
  - $20 \cdot 10^8$
  - $2 \cdot 10^8$
  respuesta: $2 \cdot 10^9$
  solucion_pasos:
  - $4 \cdot 5 = 20 \implies 20 \cdot 10^8 = 2 \cdot 10^9$.
- titulo: ¿Es (2 · 10³) · (5 · 10⁻³) igual a 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2 \cdot 5) \cdot 10^{3 + (-3)} = 10 \cdot 10^0 = 10 \cdot 1 = 10$ ($1 \cdot 10^1$).
  alternativas:
  - texto: Sí, 10 · 10⁰ = 10 (1 · 10¹)
    es_correcta: true
    retroalimentacion: ¡Correcto! Los exponentes se anulan $3 - 3 = 0$ y $2 \cdot 5 = 10$.
  - texto: No, es igual a 10 · 10⁶
    es_correcta: false
    retroalimentacion: 'Incorrecto, los exponentes se suman algebraicamente: $3 + (-3) = 0$.'
  - texto: No, es igual a 1
    es_correcta: false
    retroalimentacion: Incorrecto, $2 \cdot 5 = 10$.
- titulo: ¿Es (3 · 10⁴) · (3 · 10⁴) igual a 9 · 10⁸?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot 3 = 9$ y $4 + 4 = 8 \implies 9 \cdot 10^8$.
  alternativas:
  - texto: Sí, 3·3 = 9 y 4+4 = 8 dando 9 · 10⁸
    es_correcta: true
    retroalimentacion: ¡Correcto! $(a \cdot 10^m)^2 = a^2 \cdot 10^{2m}$.
  - texto: No, es igual a 9 · 10¹⁶
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes se suman, no se multiplican.
  - texto: No, es igual a 6 · 10⁸
    es_correcta: false
    retroalimentacion: Incorrecto, las mantisas se multiplican ($3 \cdot 3 = 9$).
errores_frecuentes:
- Multiplicar los exponentes de las potencias de diez en vez de sumarlos.
- Olvidar normalizar cuando el producto de las mantisas es mayor o igual a 10.
- Restar 1 en lugar de sumar 1 al exponente tras desplazar la coma a la izquierda.
- Cometer errores de signo al sumar exponentes negativos.
- Sumar las mantisas en lugar de multiplicarlas.
afirmaciones_verdaderas:
- Para multiplicar números en notación científica se multiplican las mantisas y se suman los exponentes.
- Si el producto de mantisas es $\ge 10$, se incrementa en 1 el exponente final.
- La multiplicación en notación científica es conmutativa y asociativa.
al_terminar_debes_poder: '![Síntesis de multiplicación](/static/img/nodos/multiplicacion-de-numeros-en-notacion-cientifica-resumen.svg)


  QUÉ: Multiplicar números expresados en notación científica.


  CÓMO: Multiplicando las mantisas $(a \cdot b)$, sumando algebraicamente los exponentes de diez $(m + n)$ y renormalizando el resultado si el producto de las mantisas resulta ser mayor o igual a diez ($a \cdot b \ge 10$).'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
