semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.PARAMETRO_A_SIGNO
resumen_inicial: 'El análisis del signo del coeficiente $a$ en la función potencia $f(x) = a \cdot x^n$ establece la orientación espacial de la gráfica: $a > 0$ mantiene la orientación canónica positiva, mientras que $a < 0$ produce una reflexión especular respecto al eje $X$ invirtiendo el sentido de todas las ramas.'
explicacion_simple: "![El análisis del signo del coeficiente $a$ en la función potencia $f(x) = a \\cdot x^n$ establece la orientación espacial de la gráfica: $a > 0$ mantiene la orientación canónica positiva, mientras que $a < 0$ produce una reflexión especular respecto al eje $X$ invirtiendo el sentido de todas las ramas](/static/img/nodos/analisis-del-signo-del-coeficiente-a-en-la-orientacion-de-la-grafica-intro.svg)\n\n\nEl **signo de $a$** decide hacia dónde apuntan los brazos de la curva:\n\n- **Si $a > 0$ (Positivo):**\n  - En exponentes pares ($x^2, x^4$): Los dos brazos **apuntan hacia arriba** (cuadrantes I y II).\n  - En exponentes impares ($x^3, x^5$): La curva **sube de izquierda a derecha** (va desde el cuadrante III hacia el I).\n- **Si $a < 0$ (Negativo):**\n  - **¡Todo se da vuelta de cabeza!** (Reflexión vertical respecto al eje $X$):\n  - En exponentes pares ($-x^2, -x^4$): Los brazos **apuntan hacia abajo** (cuadrantes III y IV).\n  - En exponentes impares ($-x^3, -x^5$):\
  \ La curva **baja de izquierda a derecha** (va desde el cuadrante II hacia el IV)."
explicacion_formal: "Sea $f(x) = a \\cdot x^n$ con $a \\in \\mathbb{R}^*$ y $n \\in \\mathbb{Z}^*$. Sea $g(x) = x^n$ el monomio base canónico.\nLa relación entre ambas funciones viene dada por la transformación lineal de ordenadas:\n$$f(x) = a \\cdot g(x)$$\n\n**Análisis por paridad de exponente**:\n1. **Para $n$ par ($n = 2k$)**:\n   - $g(x) \\ge 0, \\; \\forall x \\in \\mathbb{R}$.\n   - Si $a > 0 \\implies f(x) \\ge 0 \\implies \\operatorname{Rec}(f) = [0, +\\infty[$ (ramas en cuadrantes I y II).\n   - Si $a < 0 \\implies f(x) \\le 0 \\implies \\operatorname{Rec}(f) = ]-\\infty, 0]$ (ramas en cuadrantes III y IV).\n2. **Para $n$ impar ($n = 2k+1$)**:\n   - Si $a > 0 \\implies \\operatorname{sgn}(f(x)) = \\operatorname{sgn}(x)$ (cuadrantes III $\\to$ I, estrictamente creciente).\n   - Si $a < 0 \\implies \\operatorname{sgn}(f(x)) = -\\operatorname{sgn}(x)$ (cuadrantes II $\\to$ IV, estrictamente decreciente)."
definiciones_clave: '- **Orientación de ramas**: Dirección hacia la cual divergen los extremos de la gráfica.

  - **Reflexión respecto al eje $X$**: Transformación isométrica $(x, y) \mapsto (x, -y)$ inducida por el signo negativo de $a$.'
propiedades_relaciones: '- **Monotonía en impares**: $n$ impar con $a > 0$ es estrictamente creciente; con $a < 0$ es estrictamente decreciente.

  - **Inversión del recorrido par**: $a > 0 \implies [0, +\infty[$ vs $a < 0 \implies ]-\infty, 0]$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis del signo del coeficiente $a$ en la función potencia $f(x) = a \cdot x^n$ establece la orientación espacial de la gráfica: $a > 0$ mantiene la orientación canónica positiva, mientras que $a < 0$ produce una reflexión especular respecto al eje $X$ invirtiendo el sentido de todas las ramas](/static/img/nodos/analisis-del-signo-del-coeficiente-a-en-la-orientacion-de-la-grafica-ejemplos.svg)



    Determina la orientación de las ramas, los cuadrantes principales y el recorrido para:

    1) $f(x) = 4x^6$

    2) $g(x) = -3x^6$

    3) $h(x) = -2x^5$'
  pasos:
  - 'Paso 1: Para $f(x) = 4x^6$:

    - $n = 6$ (par) y $a = 4 > 0$.

    - **Ramas hacia arriba en cuadrantes I y II; Recorrido: $[0, +\infty[$**.'
  - 'Paso 2: Para $g(x) = -3x^6$:

    - $n = 6$ (par) y $a = -3 < 0$.

    - **Ramas hacia abajo en cuadrantes III y IV; Recorrido: $]-\infty, 0]$**.'
  - 'Paso 3: Para $h(x) = -2x^5$:

    - $n = 5$ (impar) y $a = -2 < 0$.

    - **Curva decreciente cruzando cuadrantes II y IV; Recorrido: $\mathbb{R}$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué cuadrantes se ubican las ramas de la función $f(x) = -5x^4$?
  choices:
  - text: Cuadrantes III y IV (hacia abajo)
    is_correct: true
  - text: Cuadrantes I y II (hacia arriba)
    is_correct: false
  - text: Cuadrantes I y III
    is_correct: false
  - text: Cuadrantes II y IV
    is_correct: false
  explanation: La alternativa correcta es 'Cuadrantes III y IV (hacia abajo)'. Como el exponente es par y $a = -5 < 0$, las alturas son siempre menores o iguales a cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo es la monotonía de la función cúbica $f(x) = -x^3$?
  choices:
  - text: Estrictamente decreciente en todo ℝ
    is_correct: true
  - text: Estrictamente creciente en todo ℝ
    is_correct: false
  - text: Creciente en los positivos y decreciente en los negativos
    is_correct: false
  - text: Constante
    is_correct: false
  explanation: La alternativa correcta es 'Estrictamente decreciente en todo ℝ'. Al multiplicar $x^3$ por $a = -1 < 0$, la curva se refleja e invierte su sentido de crecimiento.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la paridad del exponente $n$ (par o impar).'
- 'Paso 2: Evaluar el signo del coeficiente principal $a$ ($a > 0$ o $a < 0$).'
- 'Paso 3: Si $n$ es par: $a > 0 \implies$ ramas hacia arriba ($[0, +\infty[$); $a < 0 \implies$ ramas hacia abajo ($]-\infty, 0]$).'
- 'Paso 4: Si $n$ es impar: $a > 0 \implies$ creciente (III a I); $a < 0 \implies$ decreciente (II a IV).'
errores_correccion: '- **Error común:** Pensar que una función impar con $a < 0$ abre hacia abajo como una parábola.

  - **Cómo corregirlo:** Las funciones impares **atraviesan el origen de cuadrante a cuadrante**: con $a < 0$ **descienden del cuadrante II al IV**.'
ejemplos:
- titulo: 'Ejemplo 1: Exponente par negativo exterior'
  enunciado: ¿Cuál es el recorrido de $f(x) = -7x^2$?
  alternativas:
  - ']-inf, 0]'
  - '[0, +inf['
  - R
  - ']-inf, -7]'
  respuesta: ']-inf, 0]'
  solucion_pasos:
  - 'Paso 1: Par con $a = -7 < 0 \implies \operatorname{Rec}(f) = ]-\infty, 0]$.'
- titulo: 'Ejemplo 2: Exponente impar positivo exterior'
  enunciado: 'La gráfica de $g(x) = 3x^7$ se ubica principalmente en los cuadrantes:'
  alternativas:
  - I y III
  - I y II
  - II y IV
  - III y IV
  respuesta: I y III
  solucion_pasos:
  - 'Paso 1: Impar con $a > 0 \implies$ cuadrantes I y III.'
- titulo: 'Ejemplo 3: Reflexión par'
  enunciado: ¿Qué transformación geométrica relaciona $y = 2x^4$ con $y = -2x^4$?
  alternativas:
  - Reflexión respecto al eje X
  - Reflexión respecto al eje Y
  - Traslación hacia abajo de 4 unidades
  - Rotación de 90°
  respuesta: Reflexión respecto al eje X
  solucion_pasos:
  - 'Paso 1: Multiplicar por $-1$ genera una reflexión vertical en el eje X.'
- titulo: 'Ejemplo 4: Signo en ramas impares'
  enunciado: Si $f(x) = -4x^3$, ¿cuánto vale $f(-2)$?
  alternativas:
  - +32 (positivo en x negativo)
  - '-32'
  - '+24'
  - '-24'
  respuesta: +32 (positivo en x negativo)
  solucion_pasos:
  - 'Paso 1: $f(-2) = -4(-8) = +32$ (cuadrante II).'
errores_frecuentes:
- Confundir la orientación de potencias pares con impares al cambiar de signo a.
- Creer que a < 0 cambia el dominio de la función.
- Olvidar que las impares siempre tienen recorrido R independientemente del signo de a.
afirmaciones_verdaderas:
- El signo de a determina si las ramas de una función potencia par abren hacia arriba (a > 0) o hacia abajo (a < 0).
- En funciones con exponente impar, a > 0 genera curvas crecientes y a < 0 genera curvas decrecientes.
al_terminar_debes_poder: '**QUÉ:** Analizar el impacto del signo de a en la orientación y cuadrantes de la gráfica.


  **CÓMO:** Identificando a > 0 (orientación directa) y a < 0 (reflexión respecto al eje X) según la paridad de n.


