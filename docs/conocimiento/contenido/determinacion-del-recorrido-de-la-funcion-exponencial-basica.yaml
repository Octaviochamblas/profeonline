semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.RECORRIDO_BASE
resumen_inicial: La determinación del recorrido de la exponencial básica establece que todas las imágenes son números positivos estrictos ($\text{Rec}(f) = \mathbb{R}^+$).
explicacion_simple: |
  Aunque le des a $x$ cualquier valor (positivo, cero o negativo), el resultado de elevar una base positiva $b > 0$ a la potencia $x$ **SIEMPRE DA UN NÚMERO POSITIVO**:

  - $2^3 = 8 > 0$
  - $2^0 = 1 > 0$
  - $2^{-5} = \frac{1}{32} > 0$

  Por esta razón:
  - **La función exponencial básica NUNCA DA CERO** ($b^x \neq 0$).
  - **La función exponencial básica NUNCA DA NÚMEROS NEGATIVOS** ($b^x > 0$).
  - Su **recorrido son todos los números reales estrictamente positivos**: $\text{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$.
explicacion_formal: |
  Dada la función exponencial básica $f: \mathbb{R} \to \mathbb{R}$ definida por $f(x) = b^x$ con $b \in \mathbb{R}^+ \setminus \{1\}$, la caracterización analítica de su **conjunto recorrido (o imagen)** $\text{Rec}(f)$ establece:

  $$\text{Rec}(f) = \{y \in \mathbb{R} \mid \exists x \in \mathbb{R}, \, y = b^x\} = \mathbb{R}^+ = ]0, +\infty[$$

  **Propiedades de la imagen exponencial:**
  1. **Acotación Inferior Estricta:** $\forall x \in \mathbb{R}, \, b^x > 0$. La recta $y = 0$ es la cota inferior infimal de la función.
  2. **Inexistencia de Raíces Reales:** La ecuación $b^x = 0$ no tiene solución en $\mathbb{R}$, por lo que la gráfica de la función básica nunca toca ni cruza el eje X.
  3. **Inexistencia de Imágenes Negativas:** Para la función básica $b^x$, no existen valores de $x$ tal que $b^x \le 0$.
definiciones_clave: |
  - **Recorrido exponencial básico ($\text{Rec}(f)$)**: Conjunto de imágenes producidas por $f(x) = b^x$, correspondiente al intervalo abierto $]0, +\infty[$.
propiedades_relaciones: |
  - **Asíntota como límite del recorrido**: El extremo abierto del recorrido en $y = 0$ coincide exactamente con la asíntota horizontal $y = 0$ de la función.
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de la función exponencial $f(x) = 8^x$ y justifica por qué $y = -5$ no pertenece a su imagen.'
  pasos:
    - 'Paso 1: Identificar la estructura exponencial básica con base $b = 8 > 0$.'
    - 'Paso 2: Aplicar el teorema del recorrido: $\text{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$.'
    - 'Paso 3: Analizar el valor $y = -5$: la ecuación $8^x = -5$ no tiene solución real porque toda potencia de base positiva es estrictamente positiva.'
    - 'Paso 4: Concluir que el recorrido contiene únicamente los números reales positivos $y > 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función exponencial básica $f(x) = (1/3)^x$?'
    choices:
      - {text: 'El intervalo de números reales estrictamente positivos $]0, +\infty[$', is_correct: true}
      - {text: 'Todos los números reales $\mathbb{R}$.', is_correct: false}
      - {text: 'El intervalo cerrado $[0, +\infty[$.', is_correct: false}
      - {text: 'El intervalo de números negativos $]-\infty, 0[$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo de números reales estrictamente positivos $]0, +\infty[$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué el número cero ($y = 0$) NO forma parte del recorrido de la función exponencial básica $f(x) = 4^x$?'
    choices:
      - {text: 'Porque no existe ningún exponente real $x$ que haga que $4^x = 0$', is_correct: true}
      - {text: 'Porque $4^0 = 1$.', is_correct: false}
      - {text: 'Porque la base es mayor que cuatro.', is_correct: false}
      - {text: 'Porque la función es decreciente.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque no existe ningún exponente real $x$ que haga que $4^x = 0$''. $y=0$ es su asíntota.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Verificar que la función sea exponencial básica $f(x) = b^x$ con $b > 0$.'
  - 'Paso 2: Recordar que la potencia de una base positiva siempre genera resultados estrictamente mayores que cero.'
  - 'Paso 3: Excluir el cero y los números negativos del conjunto de salida.'
  - 'Paso 4: Expresar el recorrido como el intervalo abierto $\text{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$.'
errores_correccion: |
  - **Error común:** Incluir el cero en el recorrido escribiendo el intervalo cerrado $[0, +\infty[$.
  - **Cómo corregirlo:** El recorrido es un intervalo **ABIERTO $]0, +\infty[$** porque la función se acerca infinitamente al cero pero **NUNCA LLEGA A VALER CERO**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Recorrido de base entera.
    alternativas:
      - 'Rec(f) = ]0, +\infty['
      - 'Rec(f) = [0, +\infty['
      - 'Rec(f) = \mathbb{R}'
    respuesta: 'Rec(f) = ]0, +\infty['
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Recorrido de base fraccionaria.
    alternativas:
      - 'Rec(f) = ]0, +\infty['
      - 'Rec(f) = ]-\infty, 0['
      - 'Rec(f) = \{0\}'
    respuesta: 'Rec(f) = ]0, +\infty['
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 9^x$, la afirmación de que para un exponente negativo $x = -100$ el resultado es un número negativo.'
  - 'La inclusión del número cero $y = 0$ dentro del conjunto recorrido de la función exponencial básica.'
  - 'La confusión entre el recorrido de la función básica $f(x) = b^x$ ($y > 0$) y la función multiplicada por coeficiente negativo $g(x) = -b^x$ ($y < 0$).'
  - 'La afirmación de que el recorrido depende de si la función exponencial es creciente o decreciente.'
  - 'La afirmación de que la curva exponencial toca el eje X en el infinito lejano.'
afirmaciones_verdaderas:
  - 'El recorrido de la función exponencial básica $f(x) = b^x$ es el intervalo abierto de los números reales positivos $]0, +\infty[$.'
  - 'Toda potencia $b^x$ con base positiva $b > 0$ genera de forma absoluta resultados estrictamente mayores que cero para cualquier $x \in \mathbb{R}$.'
al_terminar_debes_poder: |
  QUÉ: Determinar e interpretar el recorrido de la función exponencial básica $f(x) = b^x$.
  CÓMO: Justificar por qué $b^x > 0$, excluir el cero y los negativos, y escribir $\text{Rec}(f) = ]0, +\infty[$.
