semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.RECORRIDO_BASE
resumen_inicial: La determinación del recorrido de la función exponencial básica $f(x) = b^x$ ($b > 0, b \neq 1$) establece que $\operatorname{Rec}(f) = \mathbb{R}^+ = ]0, +\infty[$, demostrando que cualquier potencia de base positiva es estrictamente mayor que cero.
explicacion_simple: "![La determinación del recorrido de la función exponencial básica $f(x) = b^x$ ($b > 0, b \\neq 1$) establece que $\\operatorname{Rec}(f) = \\mathbb{R}^+ = ]0, +\\infty[$, demostrando que cualquier potencia de base positiva es estrictamente mayor que cero](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-exponencial-basica-intro.svg)\n\n\nEl **recorrido** son todas las alturas ($y$) que alcanza la gráfica:\n\n- **¿Por qué la función exponencial básica NUNCA da cero ni números negativos?**\n  - Toma un número positivo como el 2:\n    - $2^3 = 8 > 0$.\n    - $2^0 = 1 > 0$.\n    - $2^{-5} = \\frac{1}{2^5} = \\frac{1}{32} = 0,03125 > 0$.\n    - $2^{-100} = \\frac{1}{2^{100}} > 0$ (un número pequeñísimo, pero sigue siendo positivo).\n  - **¡Nunca llega a tocar el 0!** Por eso el recorrido va desde un poquito más arriba de cero hasta el infinito:\n    $$\\operatorname{Rec}(f) = \\mathbf{]0, +\\infty[} = \\mathbb{R}^+$$\n- ¡Ojo con el corchete abierto en el cero!"
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ con $f(x) = b^x$ ($b > 0, b \\neq 1$). Por el axioma de positividad de la función exponencial en el cuerpo ordenado real:\n$$\\forall x \\in \\mathbb{R}: \\quad b^x > 0$$\n\n**Demostración del conjunto imagen**:\n1. **Cota inferior estricta**: $0$ es el ínfimo de la imagen ($\\inf_{x \\in \\mathbb{R}} b^x = 0$), pero no pertenece al conjunto imagen ya que $\\nexists x \\in \\mathbb{R}$ tal que $b^x = 0$.\n2. **No acotación superior**: $\\sup_{x \\in \\mathbb{R}} b^x = +\\infty$.\n3. **Conexidad por continuidad**: Por el Teorema del Valor Intermedio (TVI), la imagen de la función continua $f(\\mathbb{R})$ es el intervalo abierto conexo:\n   $$\\operatorname{Rec}(f) = f(\\mathbb{R}) = ]0, +\\infty[ = \\mathbb{R}^+$$"
definiciones_clave: '- **Recorrido exponencial básico**: Intervalo de reales estrictamente positivos $\mathbb{R}^+ = ]0, +\infty[$.

  - **Positividad estricta**: Propiedad por la cual $b^x > 0$ para todo $x \in \mathbb{R}$.'
propiedades_relaciones: '- **Ausencia de raíces reales**: Como $0 \notin \operatorname{Rec}(f)$, la ecuación $b^x = 0$ no tiene solución en $\mathbb{R}$ y la curva nunca corta al eje $X$.

  - **Impacto de la escala $a$**: Si $f(x) = a \cdot b^x$, con $a > 0 \implies \operatorname{Rec}(f) = ]0, +\infty[$; con $a < 0 \implies \operatorname{Rec}(f) = ]-\infty, 0[$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido de la función exponencial básica $f(x) = b^x$ ($b > 0, b \neq 1$) establece que $\operatorname{Rec}(f) = \mathbb{R}^+ = ]0, +\infty[$, demostrando que cualquier potencia de base positiva es estrictamente mayor que cero](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-exponencial-basica-ejemplos.svg)



    Determina el recorrido de las siguientes funciones exponenciales justificando formalmente:

    1) $f(x) = 6^x$

    2) $g(x) = -2 \cdot 4^x$'
  pasos:
  - 'Paso 1: Para $f(x) = 6^x$:

    - La base es $b = 6 > 0$ y el coeficiente es $a = 1 > 0$.

    - Para todo $x \in \mathbb{R}$, $6^x > 0$.

    - Recorrido: $\operatorname{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$.'
  - 'Paso 2: Para $g(x) = -2 \cdot 4^x$:

    - $4^x > 0$ para todo $x \in \mathbb{R}$.

    - Al multiplicar por el coeficiente negativo $a = -2$, todas las imágenes se vuelven estrictamente negativas: $-2 \cdot 4^x < 0$.

    - Recorrido: $\operatorname{Rec}(g) = ]-\infty, 0[ = \mathbb{R}^-$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función exponencial básica $f(x) = (0,3)^x$?
  choices:
  - text: ']0, +∞[ (reales estrictamente positivos)'
    is_correct: true
  - text: '[0, +∞[ (cerrado en cero)'
    is_correct: false
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']-∞, 0['
    is_correct: false
  explanation: La alternativa correcta es ']0, +∞[ (reales estrictamente positivos)'. Aunque la base sea fraccionaria, cualquier potencia de base positiva produce valores estrictamente positivos mayores a cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Existe algún número real x tal que $2^x = 0$?
  choices:
  - text: No, porque 2ˣ > 0 para todo x real (la curva nunca toca el cero)
    is_correct: true
  - text: Sí, para x = 0
    is_correct: false
  - text: Sí, para x = -2
    is_correct: false
  - text: Sí, para x = -1
    is_correct: false
  explanation: La alternativa correcta es 'No, porque 2ˣ > 0 para todo x real (la curva nunca toca el cero)'. $2^0 = 1 \neq 0$, y ningún exponente real anula una base positiva.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el signo del coeficiente multiplicativo $a$ en $f(x) = a \cdot b^x$.'
- 'Paso 2: Si $a > 0$, concluir que $\operatorname{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$.'
- 'Paso 3: Si $a < 0$, concluir que $\operatorname{Rec}(f) = ]-\infty, 0[ = \mathbb{R}^-$.'
- 'Paso 4: Asegurarse de usar corchete abierto en el cero (el valor 0 no se alcanza).'
errores_correccion: '- **Error común:** Escribir el recorrido con corchete cerrado $[0, +\infty[$.

  - **Cómo corregirlo:** La función **nunca vale exactamente cero**; por lo tanto, el corchete en el cero **debe ser ABIERTO: $]0, +\infty[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido básico positivo'
  enunciado: En $f(x) = 9^x$, ¿cuál es el recorrido?
  alternativas:
  - ']0, +inf['
  - '[0, +inf['
  - R
  - '[1, +inf['
  respuesta: ']0, +inf['
  solucion_pasos:
  - 'Paso 1: $9^x > 0, \; \forall x \implies \operatorname{Rec}(f) = ]0, +\infty[$.'
- titulo: 'Ejemplo 2: Pertenencia al recorrido'
  enunciado: Si $f(x) = 3^x$, ¿cuál de los siguientes números NO pertenece a su recorrido?
  alternativas:
  - '-5'
  - 0,001
  - '1'
  - '1000'
  respuesta: '-5'
  solucion_pasos:
  - 'Paso 1: $-5 \le 0$, por lo que no pertenece al conjunto imagen $\mathbb{R}^+$.'
- titulo: 'Ejemplo 3: Recorrido con factor negativo'
  enunciado: ¿Cuál es el recorrido de $g(x) = -5 \cdot 2^x$?
  alternativas:
  - ']-inf, 0['
  - ']0, +inf['
  - ']-inf, -5]'
  - R
  respuesta: ']-inf, 0['
  solucion_pasos:
  - 'Paso 1: $a = -5 < 0 \implies \operatorname{Rec}(g) = ]-\infty, 0[$.'
- titulo: 'Ejemplo 4: Intersección con eje X'
  enunciado: ¿Por qué la gráfica de $f(x) = 2^x$ no corta al eje X?
  alternativas:
  - Porque 0 no pertenece al recorrido (2ˣ nunca se hace 0)
  - Porque el dominio es R
  - Porque corta en el eje Y
  - Porque es creciente
  respuesta: Porque 0 no pertenece al recorrido (2ˣ nunca se hace 0)
  solucion_pasos:
  - 'Paso 1: Cortar al eje $X$ exigiría $f(x) = 0$, lo cual no tiene solución real.'
errores_frecuentes:
- Colocar corchete cerrado en cero al escribir el intervalo del recorrido.
- Creer que al evaluar en números negativos la función arroja resultados negativos.
- Confundir el recorrido de bˣ con el de funciones trasladas verticalmente.
afirmaciones_verdaderas:
- El recorrido de la función exponencial básica f(x) = bˣ es el conjunto de los reales estrictamente positivos ]0, +∞[.
- La curva de una función exponencial básica f(x) = bˣ nunca intersecta al eje X.
al_terminar_debes_poder: '**QUÉ:** Determinar el recorrido de la función exponencial básica.


  **CÓMO:** Formulando el intervalo ]0, +∞[ a partir de la positividad estricta de las potencias de base positiva.


  ![Resumen La determinación del recorrido de la función exponencial básica $f(x) = b^x$ ($b > 0, b \neq 1$) establece que $\operatorname{Rec}(f) = \mathbb{R}^+ = ]0, +\infty[$, demostrando que cualquier potencia de base positiva es estrictamente mayor que cero](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-exponencial-basica-resumen.svg)'
