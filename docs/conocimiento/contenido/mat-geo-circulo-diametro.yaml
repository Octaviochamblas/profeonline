semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.DIAMETRO
resumen_inicial: 'Identificación del diámetro como cuerda que pasa por el centro:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Entre todas las posibles cuerdas de una circunferencia, existe
  una en particular que se distingue por atravesar el centro exacto de la figura.
explicacion_formal: '![Diámetro: cuerda que pasa por el centro](/static/img/geometria/circunferencia-circulo/circulo-diametro.svg)


  ### Definición formal


  El diámetro es el segmento $\overline{AB}$ donde $A$ y $B$ son puntos de la circunferencia,
  y el centro $O$ pertenece al segmento $AB$ (siendo su punto medio).


  ### Desarrollo didáctico


  El diámetro divide a la circunferencia en dos arcos exactamente iguales (dos semicircunferencias),
  y también divide al círculo en dos semicírculos idénticos; es la única cuerda que
  tiene esta propiedad de división exacta por la mitad.'
definiciones_clave: '- **Identificación del diámetro como cuerda que pasa por el centro**:
  Elemento o propiedad fundamental en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del diámetro como cuerda que
  pasa por el centro.'
ejemplo_guiado:
