semantic_id: MAT.GEO.PARALELOGRAMOS.RECTANGULO_ANGULOS_RECTOS
resumen_inicial: El rectángulo es el paralelogramo equiángulo con cuatro ángulos de 90° y dos diagonales congruentes.
explicacion_simple: 'El rectángulo es una figura que todos conocemos: tiene forma de puerta, ventana o pantalla. Su característica definitoria es que **sus cuatro esquinas forman ángulos rectos perfectos de $90^\circ$**.


  Gracias a que sus esquinas son rectas, si trazas sus dos diagonales descubrirás una propiedad maravillosa: **ambas diagonales miden exactamente lo mismo** ($d_1 = d_2$). Puedes calcular cuánto mide cada diagonal usando el famoso Teorema de Pitágoras con la base y la altura: **$d = \sqrt{a^2 + b^2}$**.


  ![Cuatro ángulos rectos en el rectángulo](/static/img/nodos/propiedad-de-cuatro-angulos-rectos-en-el-rectangulo-intro.svg)

  '
explicacion_formal: '### Definición formal del rectángulo

  Un **rectángulo** es un paralelogramo cuyos cuatro ángulos interiores son congruentes (equiángulo):

  $$\angle A = \angle B = \angle C = \angle D = 90^\circ$$


  ### Teorema de las diagonales congruentes

  En todo paralelogramo, las diagonales son congruentes si y solo si el paralelogramo es un rectángulo:

  $$\mathcal{ABCD} \text{ es rectángulo} \iff \overline{AC} \cong \overline{BD} \iff d_1 = d_2$$


  ### Demostración geométrica y métrica

  1. Considérense los triángulos rectángulos $\triangle ABC$ y $\triangle DCB$.

  2. Tienen el cateto $\overline{BC}$ en común.

  3. Sus lados opuestos son congruentes: $\overline{AB} \cong \overline{DC} = a$.

  4. Sus ángulos comprendidos son rectos: $\angle B = \angle C = 90^\circ$.

  5. Por criterio **LAL**, $\triangle ABC \cong \triangle DCB$.

  6. En consecuencia, sus hipotenusas (diagonales) son congruentes: $AC = BD = \sqrt{a^2 + b^2}$.

  7. Al dimidiarse en $M$, las cuatro semidiagonales son iguales: $AM = BM = CM = DM = \frac{d}{2}$. Por tanto, los vértices están sobre una circunferencia circunscrita de radio $R = \frac{d}{2}$.


  > **Complemento didáctico:** Mucho cuidado: en el rectángulo las diagonales miden lo mismo ($d_1 = d_2$), pero NO son perpendiculares (salvo que sea un cuadrado). Tampoco bisecan los ángulos a $45^\circ$ (dividen al ángulo en dos partes desiguales).

  '
definiciones_clave: '- **Rectángulo**: Paralelogramo equiángulo de cuatro ángulos rectos.

  - **Diagonales congruentes**: Propiedad definitoria por la cual ambas diagonales poseen la misma medida lineal.

  - **Radio circunscrito**: Distancia constante desde el centro de las diagonales hasta cualquier vértice ($R = d/2$).

  '
propiedades_relaciones: '- **Área y perímetro**: $A = a \cdot b$ y $P = 2(a + b)$.

  - **Triángulos interiores**: Las diagonales dividen al rectángulo en dos pares de triángulos isósceles opuestos por el vértice.

  - **Inscripción en circunferencia**: Todo rectángulo es un cuadrilátero cíclico (sus 4 esquinas tocan una circunferencia común).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de diagonales en el rectángulo](/static/img/nodos/propiedad-de-cuatro-angulos-rectos-en-el-rectangulo-ejemplos.svg)


    Un rectángulo tiene lados que miden $a = 6$ cm y $b = 8$ cm. Calcula la longitud de sus diagonales y la distancia desde el punto donde se cortan las diagonales hasta cualquiera de sus vértices.'
  pasos:
  - 'Paso 1: Identificar los catetos del triángulo rectángulo formado por los lados y la diagonal: $a = 6$ cm y $b = 8$ cm.'
  - 'Paso 2: Aplicar el Teorema de Pitágoras: $d = \sqrt{a^2 + b^2} = \sqrt{6^2 + 8^2} = \sqrt{36 + 64} = \sqrt{100} = 10$ cm.'
  - 'Paso 3: Concluir para ambas diagonales: Como es un rectángulo, ambas diagonales miden $d_1 = d_2 = 10$ cm.'
  - 'Paso 4: Calcular la distancia desde el centro a los vértices: Las diagonales se dimidian, luego la distancia es la semidiagonal $\frac{d}{2} = \frac{10}{2} = 5$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la propiedad fundamental que distingue a las diagonales de un rectángulo de las de un paralelogramo general?
  choices:
  - text: Las dos diagonales son congruentes (tienen la misma longitud).
    is_correct: true
  - text: Las diagonales se cruzan formando obligatoriamente un ángulo de 90°.
    is_correct: false
  - text: Una diagonal mide el doble de la otra diagonal.
    is_correct: false
  - text: Las diagonales no se cortan dentro de la figura.
    is_correct: false
  explanation: La alternativa correcta es 'Las dos diagonales son congruentes (tienen la misma longitud).' Esta igualdad es la característica definitoria de las diagonales del rectángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una diagonal de un rectángulo mide 15 cm, ¿cuánto mide la otra diagonal?
  choices:
  - text: 15 cm.
    is_correct: true
  - text: 7,5 cm.
    is_correct: false
  - text: 30 cm.
    is_correct: false
  - text: No se puede saber sin conocer la base.
    is_correct: false
  explanation: La alternativa correcta es '15 cm.' En todo rectángulo, las dos diagonales son congruentes entre sí ($d_1 = d_2$).
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Verificar que el cuadrilátero tiene 4 ángulos de $90^\circ$ (rectángulo).

  2. Para calcular la diagonal conocidos los lados $a$ y $b$, aplicar $d = \sqrt{a^2 + b^2}$.

  3. Igualar ambas diagonales ($d_1 = d_2$).

  4. Para hallar la distancia del centro a cualquier esquina, calcular $d / 2$.

  '
errores_correccion: '- **Error común 1:** Asumir que las diagonales del rectángulo son perpendiculares. **Corrección:** Solo son perpendiculares si los lados contiguos son iguales (caso del cuadrado).

  - **Error común 2:** Creer que la diagonal biseca el ángulo de $90^\circ$ en $45^\circ$ y $45^\circ$. **Corrección:** Solo ocurre si el rectángulo es un cuadrado; en general los ángulos son desiguales (por ejemplo, $30^\circ$ y $60^\circ$ o $37^\circ$ y $53^\circ$).

  '
ejemplos:
- tipo: A
  titulo: Cálculo de diagonal en rectángulo
  enunciado: En un rectángulo de lados $5$ cm y $12$ cm, ¿cuál es la longitud de sus diagonales?
  alternativas:
  - text: $13$ cm.
    is_correct: true
  - text: $17$ cm.
    is_correct: false
  - text: $10$ cm.
    is_correct: false
  - text: $169$ cm.
    is_correct: false
  explicacion: $d = \sqrt{5^2 + 12^2} = \sqrt{25 + 144} = \sqrt{169} = 13$ cm.
- tipo: B
  titulo: Diagonales perpendiculares en rectángulo
  enunciado: ¿En cualquier rectángulo las diagonales se cruzan formando un ángulo recto?
  respuesta: 'No'
  explicacion: No. Las diagonales solo son perpendiculares si el rectángulo es un cuadrado (lados iguales).
errores_frecuentes:
- '''Creer erróneamente que las diagonales de un rectángulo dividen a sus ángulos rectos en dos partes iguales de $45^\circ$.'''
- '''Afirmar que las diagonales de un rectángulo son perpendiculares entre sí.'''
- '''Olvidar que ambas diagonales son congruentes al resolver problemas de geometría analítica o métrica.'''
afirmaciones_verdaderas:
- '''Todo rectángulo posee cuatro ángulos interiores de $90^\circ$.'''
- '''En todo rectángulo, sus dos diagonales tienen exactamente la misma medida.'''
- '''El punto de intersección de las diagonales equidista de los cuatro vértices del rectángulo.'''
al_terminar_debes_poder: '**QUÉ:** Calcular diagonales, dimensiones y ángulos en rectángulos aprovechando su equiangularidad y congruencia diagonal.


  **CÓMO:** Utilizando el Teorema de Pitágoras $d = \sqrt{a^2 + b^2}$ y la igualdad $d_1 = d_2$.


  ![Síntesis de ángulos en el rectángulo](/static/img/nodos/propiedad-de-cuatro-angulos-rectos-en-el-rectangulo-resumen.svg)

  '
