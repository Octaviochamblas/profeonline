semantic_id: MAT.NUM.PROG_GEOMETRICA.DEFINICION
resumen_inicial: 'Una progresión geométrica (P.G.) es una sucesión numérica en la que cada término, a partir del segundo, se obtiene multiplicando al anterior por una constante no nula fija denominada razón geométrica $r$: $a_n = a_{n-1} \cdot r$.'
explicacion_simple: |
  Una **progresión geométrica** es una secuencia de números donde pasas de un número al siguiente **multiplicando siempre por la misma cantidad**:
  - Si empiezas en $3$ y multiplicas por $2$ cada vez: $3, 6, 12, 24, 48, \dots$
  - Esa cantidad multiplicativa fija ($\cdot 2$) se llama **razón geométrica ($r$)**.
  - Si la razón es mayor que 1 ($r > 1$), los números crecen muy rápido (crecimiento exponencial).
  - Si la razón es una fracción entre 0 y 1 (por ejemplo $r = 1/2$), los números se van achicando a la mitad: $80, 40, 20, 10, 5, \dots$
explicacion_formal: |
  ### Definición formal
  Una sucesión de números reales $(a_n)_{n \ge 1}$ con $a_1 \neq 0$ es una **progresión geométrica** si existe una constante real no nula $r \in \mathbb{R} \setminus \{0\}$ tal que:
  $$\frac{a_n}{a_{n-1}} = r \quad (\forall n \ge 2)$$
  o equivalente mediante la ecuación por recurrencia multiplicativa:
  $$a_n = a_{n-1} \cdot r$$

  ### Clasificación según el valor de la razón geométrica ($r$)
  - **Creciente ($r > 1$ con $a_1 > 0$)**: Los términos aumentan en magnitud.
  - **Decreciente ($0 < r < 1$ con $a_1 > 0$)**: Los términos disminuyen asintóticamente hacia cero.
  - **Alternada o Oscilante ($r < 0$)**: Los signos de los términos cambian alternadamente entre positivo y negativo.
  - **Constante ($r = 1$)**: Todos los términos son idénticos al valor inicial $a_1$.

  ### Síntesis didáctica
  - Ecuación recurrente: $a_n = a_{n-1} \cdot r$.
  - Razón cociente: $r = \frac{a_{n+1}}{a_n}$.
definiciones_clave: |
  - **Progresión Geométrica (P.G.)**: Sucesión numérica generada por el producto repetido de una razón constante.
  - **Razón geométrica ($r$)**: Factor multiplicativo constante obtenido mediante el cociente $r = \frac{a_{n+1}}{a_n}$.
  - **Primer término ($a_1$)**: Elemento inicial no nulo que sirve de base multiplicativa.
propiedades_relaciones: |
  - **Comportamiento exponencial**: A diferencia de las progresiones aritméticas (que forman una recta), la progresión geométrica sigue una curva exponencial discreta.
  - **Prohibición del cero**: Ni el primer término $a_1$ ni la razón $r$ pueden ser nulos para evitar la degeneración de la sucesión.
ejemplo_guiado:
  enunciado: 'Verifica si la sucesión $5, 15, 45, 135, 405, \dots$ es una progresión geométrica, identifica su primer término $a_1$ y el valor de su razón geométrica $r$.'
  pasos:
    - 'Paso 1: Identificamos el primer término: $a_1 = 5$.'
    - 'Paso 2: Calculamos el cociente entre el segundo término y el primero: $\frac{15}{5} = 3$.'
    - 'Paso 3: Calculamos el cociente entre el tercer término y el segundo: $\frac{45}{15} = 3$, y entre el cuarto y el tercero: $\frac{135}{45} = 3$.'
    - 'Paso 4: Como el cociente entre términos consecutivos es constante e igual a $3$, la sucesión **es una progresión geométrica con $a_1 = 5$ y $r = 3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación matemática conecta dos términos consecutivos cualesquiera en una progresión geométrica?'
    choices:
      - {text: 'La multiplicación por una constante no nula fija llamada razón geométrica ($a_n = a_{n-1} \cdot r$)', is_correct: true}
      - {text: 'La suma de una cantidad constante fija llamada diferencia', is_correct: false}
      - {text: 'La elevación al cuadrado del término anterior', is_correct: false}
      - {text: 'La extracción de la raíz cuadrada de la posición ordinal', is_correct: false}
    explanation: 'La alternativa correcta es ''La multiplicación por una constante no nula fija llamada razón geométrica ($a_n = a_{n-1} \cdot r$)''. Es la definición de P.G.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la sucesión $64, 32, 16, 8, 4, \dots$, ¿cuál es el valor del primer término $a_1$ y de la razón $r$?'
    choices:
      - {text: 'Primer término $a_1 = 64$ y razón geométrica $r = \frac{1}{2}$', is_correct: true}
      - {text: 'Primer término $a_1 = 64$ y razón geométrica $r = 2$', is_correct: false}
      - {text: 'Primer término $a_1 = 4$ y razón geométrica $r = -32$', is_correct: false}
      - {text: 'Primer término $a_1 = 32$ y razón geométrica $r = \frac{1}{4}$', is_correct: false}
    explanation: 'La alternativa correcta es ''Primer término $a_1 = 64$ y razón geométrica $r = \frac{1}{2}$''. $a_1 = 64$ y $32 / 64 = 1/2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer elemento de la lista como $a_1$.'
  - 'Paso 2: Dividir cada término entre el término que le antecede inmediatamente ($\frac{a_2}{a_1}, \frac{a_3}{a_2}, \frac{a_4}{a_3}$).'
  - 'Paso 3: Verificar que todos los cocientes obtenidos den exactamente el mismo valor $r$.'
  - 'Paso 4: Concluir que es una P.G. e indicar si es creciente ($r>1$), decreciente ($0<r<1$) u oscilante ($r<0$).'
errores_correccion: |
  - **Error 1:** Restar los términos en lugar de dividirlos al buscar la razón geométrica. **Cómo corregirlo:** La progresión geométrica se define mediante la **DIVISIÓN de términos consecutivos: $r = \frac{a_{n+1}}{a_n}$**.
  - **Error 2:** Creer que una razón fraccionaria entre 0 y 1 ($0 < r < 1$) genera números negativos. **Cómo corregirlo:** Una razón fraccionaria positiva **hace que los términos disminuyan acercándose a 0, pero siguen siendo positivos**.
ejemplos:
  - titulo: 'P.G. multiplicativa por 3'
    enunciado: 'Para $2, 6, 18, 54, \dots$, ¿el primer término es $a_1 = 2$ y la razón es $r = 3$?'
    alternativas:
      - 'Sí, pues $6 / 2 = 3$ y $18 / 6 = 3$'
      - 'No, la razón es 4'
      - 'No, el primer término es 3'
    respuesta: 'Sí, pues $6 / 2 = 3$ y $18 / 6 = 3$'
    solucion_pasos:
      - '1. Primer término: $a_1 = 2$.'
      - '2. Razón: $6 / 2 = 3$.'
  - titulo: 'P.G. con razón fraccionaria'
    enunciado: 'Para $100, 50, 25, 12,5, \dots$, ¿la razón es $r = \frac{1}{2} = 0,5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $50 / 100 = 0,5$. Es decreciente hacia cero.'
  - titulo: 'P.G. alternada por razón negativa'
    enunciado: 'Para $4, -12, 36, -108, \dots$, ¿la razón es $r = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $-12 / 4 = -3$, $36 / (-12) = -3$. Los signos van alternando.'
  - titulo: 'P.G. constante'
    enunciado: 'Para $7, 7, 7, 7, \dots$, ¿es una P.G. con razón $r = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $7 / 7 = 1$.'
errores_frecuentes:
  - 'Restar el término anterior al posterior al calcular la razón geométrica.'
  - 'Una razón geométrica menor que 1 genera términos negativos en la secuencia.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Considerar que las progresiones geométricas avanzan por adición constante.'
  - 'Evaluar únicamente la división del primer par de términos para declarar que toda la sucesión es geométrica.'
afirmaciones_verdaderas:
  - 'En una progresión geométrica, la razón $r = \frac{a_{n+1}}{a_n}$ permanece constante para todo $n \ge 1$.'
  - 'Si la razón geométrica está comprendida entre 0 y 1 ($0 < r < 1$) con $a_1 > 0$, la progresión es decreciente.'
al_terminar_debes_poder: 'Definir una progresión geométrica $a_n = a_{n-1} \cdot r$ e identificar su primer término $a_1$ y su razón $r$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
