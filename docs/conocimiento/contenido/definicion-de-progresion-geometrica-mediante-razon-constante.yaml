procedimiento:
- 'Paso 1: Para probar si una secuencia es Geométrica, toma el segundo término y divídelo
  por el primero ($a_2 / a_1$).'
- 'Paso 2: Toma el tercer término y divídelo por el segundo ($a_3 / a_2$).'
- 'Paso 3: Si ambos dan el mismo cociente exacto, entonces el patrón es multiplicativo por
  ese número ''r''.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en definición de progresión geométrica mediante razón constante.
ejemplos:
- titulo: ¿Aritmética o Geométrica?
  enunciado: Verifica si la sucesión 5, 15, 45, 135 es aritmética o geométrica.
  solucion_pasos:
  - 'Prueba Aritmética (Restar): 15 - 5 = 10. 45 - 15 = 30. 10 y 30 son distintos. NO es Aritmética.'
  - 'Prueba Geométrica (Dividir): 15 / 5 = 3. 45 / 15 = 3. 135 / 45 = 3. Dan igual. SÍ es
    Geométrica (r=3).'
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la razón de la progresión geométrica 100, 20, 4?
  alternativas:
  - 1/5
  - '5'
  - '4'
  respuesta: 1/5
  solucion_pasos:
  - 20 dividido entre 100 es igual a 1/5, y esa misma división se repite entre los siguientes
    términos.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes sucesiones es una progresión geométrica?
  alternativas:
  - 2, 6, 18, 54
  - 2, 6, 10, 14
  - 1, 4, 9, 16
  respuesta: 2, 6, 18, 54
  solucion_pasos:
  - En esta la razón entre términos consecutivos es siempre 3.
- titulo: ¿La razón r de una progresión geométrica puede ser negativa?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo en 3, -6, 12, -24, la razón es -2.
- titulo: ¿La sucesión 5, 10, 15, 20 es una progresión geométrica?
  respuesta: 'No'
  solucion_pasos:
  - El cociente entre términos no es constante (10 entre 5 es 2, pero 15 entre 10 es 1,5);
    es una progresión aritmética.
errores_frecuentes:
- Confundirlas con las aritméticas y tratar de buscar una 'suma constante' cuando en realidad
  crecen demasiado rápido para ser lineales.
- Dividir al revés (el primero dividido por el segundo), calculando la razón invertida.
- Restar los términos en vez de dividirlos al buscar la razón.
- Confundir la razón de una progresión geométrica con la diferencia de una aritmética.
- Creer que la razón siempre debe ser mayor que 1.
afirmaciones_verdaderas:
- La formulación de definición de progresión geométrica mediante razón constante mantiene
  la regularidad de la sucesión.
- Si la razón r está entre 0 y 1, los términos de la progresión geométrica se van acercando
  a cero.
al_terminar_debes_poder: Resolver problemas prácticos utilizando definición de progresión
