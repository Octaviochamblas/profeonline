semantic_id: MAT.NUM.PROG_GEOMETRICA.DEFINICION
resumen_inicial: 'Definición de progresión geométrica mediante razón constante: concepto y
  desarrollo dentro de Progresión geométrica.'
explicacion_simple: Mientras la progresión aritmética camina, la progresión geométrica vuela.
  Los virus, el interés compuesto de los bancos y las reacciones nucleares crecen de forma
  explosiva multiplicándose a sí mismas.
explicacion_formal: "A diferencia de las aritméticas (que suman paso a pasito), las **Progresiones\
  \ Geométricas** se inflan rápidamente.\n\n- **La Prueba de Fuego:** Toma un término de la\
  \ fila y divídelo por el que está a su izquierda (Ej: $a_2 / a_1$). Si repites esto para\
  \ cada par y siempre te da el mismo resultado, es una P.G.\n- **La Razón ($r$):** Es ese\
  \ factor por el cual se va multiplicando la fila. \n  - Si $r > 1$, la secuencia explota\
  \ y crece gigante (Ej: $2, 4, 8, 16\\dots$ aquí $r=2$).\n  - Si $0 < r < 1$ (una fracción\
  \ como $1/2$), la secuencia se va encogiendo hacia cero (Ej: $100, 50, 25, 12.5\\dots$ aquí\
  \ $r=0.5$).\n  - Si $r$ es negativo, la secuencia salta de positivo a negativo locamente\
  \ (Ej: $3, -6, 12, -24\\dots$ aquí $r=-2$)."
definiciones_clave: '- **Definición de progresión geométrica mediante razón constante**: Concepto
  fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Definición de progresión geométrica mediante razón
  constante**: Relaciones de cambio y fórmulas estructurales de progresión geométrica.'
ejemplo_guiado:
  enunciado: Verifica si la secuencia 4, 12, 36, 108 es una progresión geométrica y, si lo
    es, indica su razón.
  pasos:
  - 'Divido el segundo término entre el primero: 12 dividido entre 4 es igual a 3.'
  - 'Compruebo con el tercero entre el segundo: 36 dividido entre 12 es igual a 3, y el cuarto
    entre el tercero: 108 dividido entre 36 también es 3.'
  - Como los tres cocientes son iguales, sí es una progresión geométrica con razón r igual
    a 3.
