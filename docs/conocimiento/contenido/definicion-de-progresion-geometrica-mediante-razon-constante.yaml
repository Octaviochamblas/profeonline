semantic_id: MAT.NUM.PROG_GEOMETRICA.DEFINICION
resumen_inicial: 'Una progresión geométrica (PG) es una sucesión donde cada término se obtiene multiplicando el término anterior por una constante no nula $r \in \mathbb{R}^*$ llamada razón geométrica: $a_{n+1} = a_n \cdot r$.'
explicacion_simple: |
  Una **progresión geométrica** es una lista de números donde cada número se obtiene **multiplicando** al anterior por un factor constante llamado **razón** ($r$):
  - Si empiezas en $2$ y multiplicas por $3$ en cada paso:
    $$2, 6, 18, 54, 162, \dots \quad (r = 3, \text{crecimiento rápido})$$
  - Si empiezas en $64$ y multiplicas por $\frac{1}{2}$ (dividir por 2):
    $$64, 32, 16, 8, 4, 2, \dots \quad (r = 0,5, \text{decreciente})$$
  - Si multiplicas por un número negativo como $-2$:
    $$3, -6, 12, -24, 48, \dots \quad (r = -2, \text{signos alternados})$$

  ![Definición de progresión geométrica](/static/img/nodos/definicion-de-progresion-geometrica-mediante-razon-constante-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una sucesión de números reales no nulos $(a_n)_{n \in \mathbb{N}}$ es una **progresión geométrica (PG)** si y solo si existe una constante $r \in \mathbb{R} \setminus \{0\}$, denominada **razón geométrica**, tal que:
  $$a_{n+1} = a_n \cdot r \quad \forall n \ge 1 \iff \frac{a_{n+1}}{a_n} = r$$

  ### Clasificación según la Razón Geométrica ($r$) para $a_1 > 0$
  - **Creciente**: $r > 1 \implies a_1 < a_2 < a_3 < \dots$
  - **Constante**: $r = 1 \implies a_1 = a_2 = a_3 = \dots$
  - **Decreciente**: $0 < r < 1 \implies a_1 > a_2 > a_3 > \dots > 0$
  - **Alternante u Oscilante**: $r < 0 \implies$ los signos de los términos se alternan consecutivamente.

  ### Término General
  El término general de la progresión geométrica es una función exponencial discreta:
  $$a_n = a_1 \cdot r^{n-1}$$

  ### Síntesis didáctica
  - Ecuación de recurrencia: $a_{n+1} = a_n \cdot r$.
  - Crecimiento: Modelo multiplicativo exponencial.
definiciones_clave: |
  - **Progresión Geométrica (PG)**: Sucesión donde el cociente entre cualquier término y su predecesor es constante.
  - **Razón geométrica ($r$)**: Factor multiplicativo no nulo que genera la transición entre términos consecutivos.
  - **Factor alternante**: Comportamiento oscilatorio de signos generado cuando $r < 0$.
propiedades_relaciones: |
  - **Isomorfismo exponencial**: Si $(a_n)$ es una PG con razón $r > 0$, entonces la sucesión $\ln(a_n)$ es una PA con diferencia común $d = \ln(r)$.
  - **Equidistancia geométrica**: Para todo trío consecutivo, el cuadrado del término medio es igual al producto de los extremos: $(a_k)^2 = a_{k-1} \cdot a_{k+1}$.
ejemplo_guiado:
  enunciado: 'Dada la progresión geométrica con primer término $a_1 = 5$ y razón geométrica $r = 2$, determina sus primeros cuatro términos y clasifica su tipo de crecimiento.'
  imagen: '/static/img/nodos/definicion-de-progresion-geometrica-mediante-razon-constante-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el término inicial: $a_1 = 5$.'
    - 'Paso 2: Multiplicamos por la razón $r = 2$ sucesivamente:'
    - '  - $a_2 = 5 \cdot 2 = 10$'
    - '  - $a_3 = 10 \cdot 2 = 20$'
    - '  - $a_4 = 20 \cdot 2 = 40$'
    - 'Paso 3: Como $a_1 > 0$ y $r = 2 > 1$, la progresión es **estrictamente creciente**.'
    - 'Conclusión: Los cuatro primeros términos son **$5, 10, 20, 40$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la relación matemática que define a una progresión geométrica de razón $r$?'
    choices:
      - {text: 'El cociente entre términos consecutivos es constante: $\frac{a_{n+1}}{a_n} = r$', is_correct: true}
      - {text: 'La resta entre términos consecutivos es constante: $a_{n+1} - a_n = r$', is_correct: false}
      - {text: 'La suma de términos consecutivos es constante', is_correct: false}
      - {text: 'El producto de todos los términos es igual a 1', is_correct: false}
    explanation: 'La alternativa correcta es ''El cociente entre términos consecutivos es constante: $\frac{a_{n+1}}{a_n} = r$''. Es la propiedad definitoria de las progresiones geométricas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una PG tiene $a_1 = 3$ y razón $r = -2$, ¿cuál es el valor del tercer término $a_3$?'
    choices:
      - {text: '$12$, calculando $a_2 = -6$ y $a_3 = -6 \cdot (-2) = 12$', is_correct: true}
      - {text: '$-12$, olvidando la regla de los signos', is_correct: false}
      - {text: '$-6$', is_correct: false}
      - {text: '$24$', is_correct: false}
    explanation: 'La alternativa correcta es ''$12$, calculando $a_2 = -6$ y $a_3 = -6 \cdot (-2) = 12$''. El producto de dos números negativos da un resultado positivo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$ y la razón geométrica $r \neq 0$.'
  - 'Paso 2: Multiplicar sucesivamente por $r$ para obtener cada nuevo término ($a_{n+1} = a_n \cdot r$).'
  - 'Paso 3: Analizar la magnitud y signo de $r$ para clasificar la progresión (creciente, decreciente, alternante o constante).'
errores_correccion: |
  - **Error 1:** Confundir la progresión geométrica con la aritmética (sumar la razón en vez de multiplicar). **Cómo corregirlo:** En la PG **se multiplica por el factor constante $r$** en cada paso.
  - **Error 2:** Creer que una razón negativa genera solo números negativos. **Cómo corregirlo:** Una razón negativa **alterna los signos** ($+, -, +, -, \dots$) debido a la regla de los signos en la multiplicación.
ejemplos:
  - titulo: 'PG con razón entera mayor a 1'
    enunciado: 'Para $a_1 = 4$ y $r = 3$, ¿cuáles son los tres primeros términos?'
    alternativas:
      - '$4, 12, 36$'
      - '$4, 7, 10$'
      - '$4, 16, 64$'
    respuesta: '$4, 12, 36$'
    solucion_pasos:
      - '1. $a_1 = 4, a_2 = 4 \cdot 3 = 12, a_3 = 12 \cdot 3 = 36$.'
  - titulo: 'PG con razón fraccionaria'
    enunciado: 'Para $a_1 = 80$ y $r = \frac{1}{2}$, ¿cuál es el cuarto término $a_4$?'
    alternativas:
      - '$10$'
      - '$20$'
      - '$5$'
    respuesta: '$10$'
    solucion_pasos:
      - '1. $a_1 = 80, a_2 = 40, a_3 = 20, a_4 = 10$.'
  - titulo: 'Signos alternados'
    enunciado: '¿La sucesión $2, -4, 8, -16, 32$ es una progresión geométrica con razón $r = -2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $-4/2 = -2, 8/-4 = -2, -16/8 = -2$.'
  - titulo: 'Razón unitaria'
    enunciado: '¿La sucesión constante $7, 7, 7, 7, \dots$ es una progresión geométrica con razón $r = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $7/7 = 1$ en todos los términos.'
errores_frecuentes:
  - 'En una progresión geométrica cada término se obtiene sumando una cantidad constante al término anterior.'
  - 'Una progresión geométrica con razón $r = -1$ tiene todos sus términos con valor numérico negativo.'
  - 'La razón geométrica $r$ puede ser igual a cero en una progresión geométrica estándar.'
  - 'Una progresión geométrica con razón fraccionaria $0 < r < 1$ es estrictamente creciente.'
  - 'El cociente entre términos consecutivos de una PG varía en función de la posición $n$.'
afirmaciones_verdaderas:
  - 'En una progresión geométrica el cociente entre cualquier término y su predecesor inmediato es constante: $\frac{a_{n+1}}{a_n} = r$.'
  - 'Si la razón geométrica es negativa ($r < 0$), los signos de los términos se alternan estrictamente entre positivos y negativos.'
