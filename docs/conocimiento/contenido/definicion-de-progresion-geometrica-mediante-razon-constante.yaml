resumen_inicial: 'Una progresión geométrica (P.G.) es una sucesión numérica en la
  que cada término se obtiene multiplicando el término inmediatamente anterior por
  una cantidad constante fija $r \neq 0$ (llamada razón geométrica): $a_n = a_{n-1}
  \cdot r$.'
explicacion_simple: Una progresión geométrica es una secuencia de números en la que
  cada paso se calcula multiplicando el número anterior por un mismo valor fijo llamado
  razón. Si la razón es mayor que 1 los números crecen multiplicándose, y si la razón
  está entre 0 y 1 los números se reducen progresivamente.
explicacion_formal: 'Una sucesión $(a_n)_{n \in \mathbb{N}^+}$ es una **Progresión
  Geométrica (P.G.)** si y solo si el cociente entre cualquier término y su antecedente
  es constante para todo $n \ge 1$:


  $$\frac{a_{n+1}}{a_n} = r = cst \neq 0 \quad \forall n \in \mathbb{N}^+$$


  **Clasificación según la razón $r$ (con $a_1 > 0$):**

  - Creciente: $r > 1$.

  - Decreciente: $0 < r < 1$.

  - Alternante: $r < 0$ (los signos alternan entre positivo y negativo).

  - Constante: $r = 1$.'
definiciones_clave: '- **Progresión geométrica**: Sucesión con razón multiplicativa
  constante $\frac{a_{n+1}}{a_n} = r$.'
propiedades_relaciones: '- **Razón multiplicativa $r$**: Factor constante de escala
  entre términos consecutivos.'
ejemplo_guiado:
  enunciado: Verifique si la sucesión $(3, 6, 12, 24, 48)$ es una progresión geométrica
    e identifique la razón $r$.
  pasos:
  - 'Paso 1: Calcular la razón $\frac{a_2}{a_1} = \frac{6}{3} = 2$.'
  - 'Paso 2: Calcular la razón $\frac{a_3}{a_2} = \frac{12}{6} = 2$.'
  - 'Paso 3: Calcular la razón $\frac{a_4}{a_3} = \frac{24}{12} = 2$.'
  - 'Conclusión: Como todos los cocientes son iguales a $2$, es una P.G. con razón
    $r=2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación debe cumplirse entre términos consecutivos en una progresión
    geométrica?
  choices:
  - text: El cociente entre cualquier término y su anterior (an+1 / an) debe ser una
      constante fija r distinto de cero
    is_correct: true
  - text: La resta entre términos debe ser constante
    is_correct: false
  - text: La suma de los términos debe ser cero
    is_correct: false
  - text: Los términos deben dividirse por 100
    is_correct: false
  explanation: La alternativa correcta es 'El cociente entre cualquier término y su
    anterior (an+1 / an) debe ser una constante fija r distinto de cero'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (3, 6, 12, 24, 48), ¿cuál fue la razón geométrica
    r obtenida?
  choices:
  - text: r = 2
    is_correct: true
  - text: r = 3
    is_correct: false
  - text: r = 6
    is_correct: false
  - text: r = 0,5
    is_correct: false
  explanation: La alternativa correcta es 'r = 2'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir una progresión geométrica
  comprobando que el cociente consecutivo $\frac{a_{n+1}}{a_n} = r$ sea una constante
  multiplicativa.
semantic_id: MAT.NUM.PROG_GEOMETRICA.DEFINICION
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una razón multiplicativa constante
  $r = \frac{a_{n+1}}{a_n}$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 \cdot r^{n-1}$ o de la
  suma $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
- 'Paso 3: Resolver numéricamente o con logaritmos el parámetro solicitado ($a_n,
  a_1, r, n$ o $S_n$).'
errores_correccion: '- **Error 1: Elevar la razón $r$ a la potencia $n$ en lugar de
  $(n-1)$ en el término general ($a_n = a_1 \cdot r^n$).** **Cómo corregirlo:** La
  razón $r$ se aplica a partir de la segunda posición, por lo que el exponente correcto
  es $(n-1)$.


  - **Error 2: Usar la fórmula de la suma de progresión aritmética en una progresión
  geométrica.** **Cómo corregirlo:** En la P.G. la suma DEBE utilizar el factor multiplicativo
  $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_GEOMETRICA.DEFINICION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión geométrica.
- titulo: Ejemplo 2
  enunciado: Verificación de la razón constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} / a_n = r$.
- titulo: ¿Es constante el cociente entre términos consecutivos en una P.G.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión geométrica.
- titulo: ¿Corresponde la P.G. a una función exponencial discreta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a_n = a_1 \cdot r^{n-1}$ es una potencia de base $r$.
errores_frecuentes:
- Elevar la razón r al exponente n en lugar de multiplicar por r^(n-1) al calcular
  an.
- Restar los términos en lugar de calcular el cociente de división para determinar
  la razón r.
- Usar la fórmula del promedio de Gauss propia de la progresión aritmética en una
  progresión geométrica.
- Declarar que una razón geométrica menor que 1 genera términos negativos en la secuencia.
- Declarar la razón porcentual P% con el factor multiplicativo r = 1 + P/100.
afirmaciones_verdaderas:
- Una progresión geométrica tiene una razón constante $r = \frac{a_{n+1}}{a_n}$ entre
  términos consecutivos.
- El término general de una P.G. se calcula mediante la función exponencial $a_n =
  a_1 \cdot r^{n-1}$.
