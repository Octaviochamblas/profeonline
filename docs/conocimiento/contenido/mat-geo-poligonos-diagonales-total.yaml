semantic_id: MAT.GEO.POLIGONOS_METRICA.DIAGONALES_TOTAL
resumen_inicial: 'Cálculo de la cantidad total de diagonales de un polígono mediante
  n(n - 3) / 2: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos
  y Cuadriláteros.'
explicacion_simple: Con la cantidad de diagonales por vértice ya conocida, es posible
  deducir una fórmula para el número total de diagonales de todo el polígono.
explicacion_formal: '![Total de diagonales de un polígono](/static/img/geometria/poligonos-cuadrilateros/poligonos-diagonales-total.svg)


  ### Definición formal


  Si cada uno de los $n$ vértices tiene $(n-3)$ diagonales, el producto $n(n-3)$ cuenta
  cada diagonal dos veces (una desde cada extremo), por lo que se divide entre 2:
  $D=\frac{n(n-3)}{2}$.


  ### Desarrollo didáctico


  Un hexágono ($n=6$) tiene $\frac{6\times3}{2}=\frac{18}{2}=9$ diagonales en total.
  Esta fórmula combina el resultado de diagonales por vértice (n-3) con el ajuste
  necesario para no contar cada diagonal dos veces.'
definiciones_clave: '- **Cálculo de la cantidad total de diagonales de un polígono
  mediante n(n - 3) / 2**: Elemento o propiedad fundamental en el estudio de polígonos
  y cuadriláteros.'
