semantic_id: MAT.GEO.PITAGORAS.CALCULO_CATETO
resumen_inicial: 'Cálculo de un cateto dados la hipotenusa y el otro cateto: conceptos,
  teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Cuando falta uno de los catetos pero se conocen la hipotenusa
  y el otro cateto, el teorema de Pitágoras también permite despejar el dato faltante,
  esta vez restando en vez de sumando.
explicacion_formal: '![Cálculo de un cateto](/static/img/geometria/areas-pitagoras/pitagoras-calculo-cateto.svg)


  ### Definición formal


  Si un triángulo rectángulo tiene hipotenusa $c$ y cateto conocido $b$, el otro cateto
  es $a=\sqrt{c^2-b^2}$.


  ### Desarrollo didáctico


  Con hipotenusa 5 y un cateto 4: $a=\sqrt{5^2-4^2}=\sqrt{25-16}=\sqrt{9}=3$.'
definiciones_clave: '- **Cálculo de un cateto dados la hipotenusa y el otro cateto**:
  Elemento o propiedad fundamental en el estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo de un cateto dados la hipotenusa y
  el otro cateto.'
