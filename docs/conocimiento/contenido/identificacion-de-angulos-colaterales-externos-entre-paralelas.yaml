semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.COLATERALES_EXTERNOS_IDENTIFICACION
resumen_inicial: Los ángulos colaterales externos (o conjugados externos) son aquellos
  situados en la región exterior (fuera de las dos paralelas) y al mismo lado de la
  recta transversal.
explicacion_simple: '![Identificación de Colaterales Externos](/static/img/nodos/identificacion-de-angulos-colaterales-externos-entre-paralelas-intro.svg)


  Son los ángulos que se encuentran afuera de las dos rectas paralelas y que comparten
  el mismo lado respecto a la recta secante: uno está arriba a la izquierda y el otro
  está abajo a la izquierda.'
explicacion_formal: '### Definición formal

  Dadas dos rectas paralelas $L_1 \parallel L_2$ y una transversal $T$, los **ángulos
  colaterales externos** son aquellos situados en el mismo lado de la transversal
  (mismo semiplano) y en la región exterior a las paralelas:


  $$\operatorname{Colat\_Ext}(L_1, L_2, T) = \{(\alpha, \beta) \mid \text{mismo lado
  de } T \land \text{exteriores a } L_1, L_2\}$$


  ### Desglose simbólico y geométrico

  - Región exterior superior e inferior del sistema de paralelas.

  - Sin alternancia: Ambos en el mismo semiplano respecto a la transversal $T$.


  ### Síntesis didáctica

  Los colaterales externos constituyen la contraparte exterior de los colaterales
  internos, manteniendo idénticas propiedades algebraicas de suma.'
definiciones_clave: '- **Ángulos colaterales externos**: Pareja de ángulos exteriores
  ubicados al mismo lado de la secante.

  - **Región exterior homolateral**: Zonas exteriores situadas en un mismo semiplano
  respecto a $T$. '
propiedades_relaciones: '- **Dos pares colaterales externos**: $(\angle 2, \angle
  7)$ en el lado izquierdo y $(\angle 1, \angle 8)$ en el lado derecho.

  - **Composición**: Un ángulo agudo y otro obtuso que suman $180^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Colaterales Externos](/static/img/nodos/identificacion-de-angulos-colaterales-externos-entre-paralelas-ejemplos.svg)


    En una figura de paralelas con ángulos numerados del 1 al 8, si $\angle 1$ es
    el ángulo exterior superior derecho, identifica su correspondiente ángulo colateral
    externo.'
  pasos:
  - 'Paso 1: Identificar la posición de $\angle 1$: exterior superior, lado derecho
    de $T$.'
  - 'Paso 2: Buscar en la recta inferior un ángulo que esté en la región exterior.'
  - 'Paso 3: Mantener el mismo lado respecto a la transversal: lado derecho de $T$.'
  - 'Paso 4: Identificar que dicho ángulo es $\angle 8$ (exterior inferior derecho).'
  - 'Paso 5: Concluir que $\angle 1$ y $\angle 8$ forman una pareja de ángulos colaterales
    externos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubican los ángulos colaterales externos?
  choices:
  - text: Fuera de las rectas paralelas y al mismo lado de la transversal
    is_correct: true
  - text: Fuera de las rectas paralelas y a lados opuestos de la transversal
    is_correct: false
  - text: Entre las dos paralelas y al mismo lado
    is_correct: false
  - text: En el mismo vértice de cruce
    is_correct: false
  explanation: Por definición se ubican fuera de las rectas paralelas y al mismo lado
    de la transversal.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ángulo 2 es el ángulo exterior superior izquierdo, ¿cuál es su colateral
    externo?
  choices:
  - text: El ángulo 7 (exterior inferior izquierdo)
    is_correct: true
  - text: El ángulo 8 (exterior inferior derecho)
    is_correct: false
  - text: El ángulo 1 (exterior superior derecho)
    is_correct: false
  - text: El ángulo 6 (interior izquierdo)
    is_correct: false
  explanation: El ángulo exterior al mismo lado izquierdo es el ángulo 7 (exterior
    inferior izquierdo).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$ y la secante $T$.'
- 'Paso 2: Seleccionar los cuatro ángulos exteriores (arriba de $L_1$ y abajo de $L_2$).'
- 'Paso 3: Emparejar los dos ángulos exteriores situados al mismo lado de la secante.'
errores_correccion: No confundas colaterales externos (mismo lado de T) con alternos
  externos (lados opuestos de T).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\angle 1$ está arriba a la derecha, ¿cuál es su colateral externo?
  alternativas:
  - $\angle 8$ (abajo a la derecha)
  - $\angle 7$ (abajo a la izquierda)
  - $\angle 5$ (interior arriba a la derecha)
  respuesta: $\angle 8$ (abajo a la derecha)
  solucion_pasos:
  - Está en el exterior y al mismo lado (derecho): $\angle 8$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos pares de ángulos colaterales externos se forman en total?
  alternativas:
  - 2 pares
  - 4 pares
  - 1 par
  respuesta: 2 pares
  solucion_pasos:
  - Uno en el lado izquierdo y otro en el derecho (2 pares en total).
- titulo: ¿Los ángulos colaterales externos están fuera de las paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de externos están en las regiones exteriores a $L_1$ y $L_2$.
- titulo: ¿Los ángulos colaterales externos son alternos?
  respuesta: 'No'
  solucion_pasos:
  - No, los colaterales están al mismo lado; los alternos están en lados opuestos.
errores_frecuentes:
- Confundir colaterales externos con alternos externos.
- Seleccionar ángulos de la región interior.
- Asumir que son congruentes en vez de suplementarios.
- Emparejar ángulos del mismo vértice.
- Olvidar que están en el mismo semiplano de $T$.
afirmaciones_verdaderas:
- Los ángulos colaterales externos están fuera de las paralelas y al mismo lado de
  la secante.
- Existen exactamente dos pares de ángulos colaterales externos.
al_terminar_debes_poder: '**QUÉ:** Identificar y reconocer pares de ángulos colaterales
  externos en rectas paralelas y transversales.


  **CÓMO:** Verificando la pertenencia a las regiones exteriores y la ubicación al
  mismo lado de la secante $T$.


  ![Resumen de Identificación de Colaterales Externos](/static/img/nodos/identificacion-de-angulos-colaterales-externos-entre-paralelas-resumen.svg)'
