semantic_id: MAT.GEO.PARALELOGRAMOS.ROMBO_LADOS_CONGRUENTES
resumen_inicial: 'Propiedad de cuatro lados congruentes en el rombo: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: El rombo es otro caso particular de paralelogramo, caracterizado
  esta vez por una propiedad de sus lados, similar a la del cuadrado pero sin exigir
  ángulos rectos.
explicacion_formal: '![Cuatro lados congruentes en el rombo](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-rombo-lados-congruentes.svg)


  ### Definición formal


  Un rombo es un paralelogramo con $AB=BC=CD=DA$. A diferencia del cuadrado, el rombo
  no exige que sus ángulos sean rectos, solo que los cuatro lados sean iguales.


  ### Desarrollo didáctico


  Un rombo con lado de 7 cm tiene sus cuatro lados iguales a 7 cm, pero sus ángulos
  pueden ser distintos de 90° (por ejemplo, dos ángulos de 60° y dos de 120°). Esto
  lo distingue del cuadrado, que además exige ángulos rectos.'
