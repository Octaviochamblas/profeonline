- titulo: ¿Se cumple siempre la propiedad principal de propiedad de cuatro lados congruentes
    en el rombo en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
