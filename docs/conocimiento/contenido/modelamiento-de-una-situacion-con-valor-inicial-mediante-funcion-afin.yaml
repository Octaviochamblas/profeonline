semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_AFIN_CONTEXTUAL
resumen_inicial: El modelamiento de situaciones con valor inicial mediante una función afín integra un costo o estado base no nulo con una tasa de variación constante.
explicacion_simple: |
  Para construir un **modelo afín $f(x) = mx + b$** a partir de un enunciado:

  1. Busca el **valor inicial o fijo**: ese número es **$b$** (la altura de partida cuando $x = 0$).
  2. Busca el **ritmo o tasa constante por unidad**: ese número es **$m$** (la pendiente que multiplica a $x$).
  3. Junta ambos elementos: **$\text{Total} = (\text{Tasa}) \cdot x + (\text{Valor Inicial})$**.
explicacion_formal: |
  Sea un sistema cuyo estado dependiente $y$ cambia a una razón constante $m = \frac{\Delta y}{\Delta x}$ y posee una condición inicial conocida $y(0) = b \neq 0$. El **modelo afín contextual** se define por la ecuación diferencial ordinaria con condición inicial:

  $$\frac{dy}{dx} = m, \quad y(0) = b \implies y = mx + b$$

  **Componentes del modelo:**
  - $b$: Valor base o estado inicial no nulo del sistema.
  - $m$: Tasa de cambio constante (positiva o negativa).
definiciones_clave: |
  - **Modelo afín contextual**: Representación mediante la regla $f(x) = mx + b$ de un fenómeno con condición inicial fija $b \neq 0$ y variación constante $m$.
propiedades_relaciones: |
  - **No proporcionalidad directa**: Debido a la existencia de la constante inicial $b \neq 0$, la razón $\frac{y}{x}$ NO es constante, rompiendo la proporcionalidad directa estricta.
ejemplo_guiado:
  enunciado: 'Un servicio de encomiendas cobra un cargo fijo de envío de $\$3.500$ más $\$800$ por cada kilogramo de peso del paquete. Construye la función de costo $C(p)$ para un paquete de $p$ kg.'
  pasos:
    - 'Paso 1: Identificar la cuota fija inicial: $b = 3.500$.'
    - 'Paso 2: Identificar la tasa variable por kilogramo: $m = 800$.'
    - 'Paso 3: Formar la expresión de la función afín: $C(p) = 800p + 3.500$.'
    - 'Paso 4: Concluir que la tarifa se modela mediante la función afín $C(p) = 800p + 3.500$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si el envío cuesta un cargo fijo de $3.500 más $800 por kilogramo, ¿cuál es la función de costo $C(p)$?'
    choices:
      - {text: '$C(p) = 800p + 3.500$', is_correct: true}
      - {text: '$C(p) = 3.500p + 800$', is_correct: false}
      - {text: '$C(p) = 4.300p$', is_correct: false}
      - {text: '$C(p) = 800p - 3.500$', is_correct: false}
    explanation: 'La alternativa correcta es ''$C(p) = 800p + 3.500$''. Tasa $m = 800$ y fijo $b = 3500$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué el costo total $C(p) = 800p + 3.500$ no representa una proporcionalidad directa?'
    choices:
      - {text: 'Porque la razón $C(p)/p$ no es constante debido al cargo fijo de $3.500.', is_correct: true}
      - {text: 'Porque la pendiente $800$ es un número par.', is_correct: false}
      - {text: 'Porque el peso $p$ no se puede medir en decimales.', is_correct: false}
      - {text: 'Porque la recta pasa por el origen $(0,0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la razón $C(p)/p$ no es constante debido al cargo fijo de $3.500.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Detectar en la situación el valor fijo o inicial $b$ ($x = 0$).'
  - 'Paso 2: Detectar el ritmo de variación unitario $m$ asignando su signo correspondiente.'
  - 'Paso 3: Escribir la expresión analítica $f(x) = mx + b$.'
  - 'Paso 4: Validar el modelo evaluando casos conocidos de entrada.'
errores_correccion: |
  - **Error común:** Sumar la tasa y el valor inicial en un solo número (por ejemplo, escribir $C(p) = 4300p$).
  - **Cómo corregirlo:** La tasa $m$ se **MULTIPLICA por la variable $x$** ($800p$), mientras que el cargo fijo $b$ se **SUMA por separado** ($+ 3.500$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En un modelo afín con valor inicial $C(p) = 800p + 3.500$, la tarifa por 2 kg es el doble de la tarifa por 1 kg.'
  - 'El valor inicial $b$ de una situación se calcula multiplicando la tasa de cambio por la variable de entrada $x$.'
  - 'Un problema con cuota inicial fija y variación constante se modela siempre mediante una función cuadrática.'
  - 'Si la cuota inicial de un contrato es de $\$10.000$, la gráfica del modelo atraviesa el origen cartesiano.'
  - 'Sumar la cuota inicial y la tasa unitaria antes de multiplicar por $x$ es una simplificación algebraica válida.'
afirmaciones_verdaderas:
  - 'Una situación con un valor base inicial $b \neq 0$ y una tasa de variación constante $m$ por unidad se representa mediante una función afín $f(x) = mx + b$.'
  - 'La presencia del valor inicial $b$ provoca que la relación entre las variables no sea de proporcionalidad directa estricta.'
al_terminar_debes_poder: |
  QUÉ: Modelar situaciones problemáticas con valor inicial mediante funciones afines.
  CÓMO: Asignar el parámetro $b$ a la constante inicial, $m$ a la tasa unitaria y construir la ecuación $f(x) = mx + b$.
