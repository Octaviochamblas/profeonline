semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_AFIN_CONTEXTUAL
resumen_inicial: Modelar una situación con valor inicial mediante una función afín consiste en estructurar la magnitud total como $f(x) = mx + n$, combinando un cargo fijo $n$ con un costo variable $mx$.
explicacion_simple: '![Modelar una situación con valor inicial mediante una función afín consiste en estructurar la magnitud total como $f(x) = mx + n$, combinando un cargo fijo $n$ con un costo variable $mx$](/static/img/nodos/modelamiento-de-una-situacion-con-valor-inicial-mediante-funcion-afin-intro.svg)



  Muchas cuentas y tarifas de la vida real tienen dos partes:

  1. **Un costo fijo o base ($n$):** Lo pagas aunque no consumas nada (por ejemplo, el cargo fijo del agua o la bajada de bandera del taxi).

  2. **Un costo variable ($m \cdot x$):** Lo que pagas por cada unidad consumida (por cada kilómetro, litro o minuto).


  El total a pagar se modela con una **función afín**:

  $$\text{Total} = (\text{Precio por unidad} \times \text{Cantidad}) + \text{Cargo fijo} \implies f(x) = mx + n$$'
explicacion_formal: 'Una situación con condición inicial no nula y tasa constante se modela como una función afín $f: \text{Dom}(f) \to \mathbb{R}$ dada por:

  $$f(x) = mx + n, \quad m \neq 0, \ n \neq 0$$


  **Componentes del modelo:**

  - **Intercepto $n = f(0)$**: Estado basal, costo fijo o valor inicial presente antes de cualquier incremento de $x$.

  - **Pendiente $m = \frac{\Delta f}{\Delta x}$**: Tasa marginal de crecimiento o decrecimiento por unidad de $x$.

  - **Estructura aditiva**: Permite descomponer el total en componente fija y componente variable.'
definiciones_clave: '- **Cargo fijo / Valor inicial ($n$)**: Magnitud predeterminada independiente del consumo $x$.

  - **Costo marginal / Tasa ($m$)**: Incremento en la magnitud dependiente por cada unidad adicional consumida.'
propiedades_relaciones: '- **No proporcionalidad**: El cociente $\frac{f(x)}{x} = m + \frac{n}{x}$ disminuye a medida que $x$ crece (economía de escala por dilución del costo fijo).

  - **Restricción de positividad**: En contextos económicos o físicos, se restringe a $x \ge 0$ e $y \ge n$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Modelar una situación con valor inicial mediante una función afín consiste en estructurar la magnitud total como $f(x) = mx + n$, combinando un cargo fijo $n$ con un costo variable $mx$](/static/img/nodos/modelamiento-de-una-situacion-con-valor-inicial-mediante-funcion-afin-ejemplos.svg)



    Una compañía telefónica cobra un plan mensual con un cargo fijo de $\$5.990$ más $\$40$ por cada giga adicional de navegación. Escribe la función del costo mensual $C(x)$ para $x$ gigas adicionales y calcula la cuenta si se consumen $25\text{ gigas}$ extras.'
  pasos:
  - 'Paso 1: Identificar el cargo fijo (coeficiente de posición): $n = \$5.990$.'
  - 'Paso 2: Identificar la tasa variable por giga (pendiente): $m = \$40/\text{giga}$.'
  - 'Paso 3: Formar la función afín: $C(x) = 40x + 5.990$.'
  - 'Paso 4: Evaluar en $x = 25$: $C(25) = 40(25) + 5.990 = 1.000 + 5.990 = \$6.990$.'
  - 'Paso 5: Concluir que el costo total es de $\$6.990$.'
checkpoints:
- placement: after_explicacion_formal
  question: Un servicio de encomiendas cobra $\$2.000$ fijos por envío más $\$800$ por cada kilogramo. ¿Qué función modela el costo total $C(x)$ para $x\text{ kg}$?
  choices:
  - text: C(x) = 800x + 2000
    is_correct: true
  - text: C(x) = 2000x + 800
    is_correct: false
  - text: C(x) = 2800x
    is_correct: false
  - text: C(x) = 800x
    is_correct: false
  explanation: La alternativa correcta es 'C(x) = 800x + 2000'. El costo variable es $800x$ y el cargo fijo es $2000$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función de cobro de taxi $T(x) = 600x + 450$, ¿qué representa el número $450$?
  choices:
  - text: La bajada de bandera o cargo fijo inicial al subirse al taxi.
    is_correct: true
  - text: El precio por cada kilometro recorrido.
    is_correct: false
  - text: La velocidad del taxi.
    is_correct: false
  - text: El kilometraje maximo.
    is_correct: false
  explanation: La alternativa correcta es 'La bajada de bandera o cargo fijo inicial al subirse al taxi.'. Es el intercepto $n = T(0) = 450$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor fijo o inicial que no depende de la cantidad consumida ($n$).'
- 'Paso 2: Identificar la tasa de cobro o variación unitaria ($m$).'
- 'Paso 3: Escribir la fórmula afín $f(x) = mx + n$.'
- 'Paso 4: Sustituir valores de $x$ para evaluar costos totales o igualar a un monto dado para calcular consumos.'
errores_correccion: '- **Error común:** Multiplicar el cargo fijo por la cantidad consumida (escribir $C(x) = 5990x + 40$).

  - **Cómo corregirlo:** La variable $x$ multiplica **únicamente a la tasa unitaria** ($40x$); el cargo fijo ($5.990$) se suma **solo una vez** al final.'
ejemplos:
- titulo: 'Ejemplo 1: Tarifa eléctrica'
  enunciado: Una cuenta de luz tiene un cargo fijo de $\$1.200$ y cobra $\$130$ por cada $\text{kWh}$. Si se consumieron $150\text{ kWh}$, ¿cuánto se paga?
  alternativas:
  - $20.700
  - $19.500
  - $21.200
  - $18.300
  respuesta: $20.700
  solucion_pasos:
  - 'Paso 1: $C(x) = 130x + 1200$.'
  - 'Paso 2: $C(150) = 130(150) + 1200 = 19500 + 1200 = \$20.700$.'
- titulo: 'Ejemplo 2: Salario base más comisión'
  enunciado: Un vendedor gana un sueldo base de $\$400.000$ más $\$15.000$ por cada artículo vendido. ¿Cuál es su función de ingreso $I(x)$?
  alternativas:
  - I(x) = 15000x + 400000
  - I(x) = 400000x + 15000
  - I(x) = 415000x
  - I(x) = 15000x
  respuesta: I(x) = 15000x + 400000
  solucion_pasos:
  - 'Paso 1: Comisión variable $15.000x$ + base fija $\$400.000$: $I(x) = 15.000x + 400.000$.'
- titulo: 'Ejemplo 3: Cálculo inverso de consumo'
  enunciado: Si $C(x) = 500x + 1500$ y la cuenta total fue de $\$9.000$, ¿cuántas unidades se consumieron?
  alternativas:
  - 15 unidades
  - 18 unidades
  - 12 unidades
  - 20 unidades
  respuesta: 15 unidades
  solucion_pasos:
  - 'Paso 1: $500x + 1500 = 9000 \implies 500x = 7500 \implies x = 15$.'
- titulo: 'Ejemplo 4: Impresión de libros'
  enunciado: La matriz de impresión cuesta $\$50.000$ y cada libro impreso cuesta $\$3.500$. ¿Cuánto cuesta imprimir 100 libros?
  alternativas:
  - $400.000
  - $350.000
  - $450.000
  - $300.000
  respuesta: $400.000
  solucion_pasos:
  - 'Paso 1: $C(100) = 3.500(100) + 50.000 = 350.000 + 50.000 = \$400.000$.'
errores_frecuentes:
- Intercambiar la pendiente m con el intercepto n en la fórmula.
- Sumar el cargo fijo y la tasa unitaria antes de multiplicar por x.
- Olvidar restar el costo fijo al despejar x en cálculos inversos.
afirmaciones_verdaderas:
- Toda situación con un valor base inicial y una tasa de cambio constante se modela como una función afín f(x) = mx + n.
- El cargo fijo corresponde a la evaluación de la función en consumo cero f(0) = n.
al_terminar_debes_poder: '**QUÉ:** Modelar y resolver problemas contextuales con condiciones iniciales mediante funciones afines.


  **CÓMO:** Identificando el cargo base n y la tasa marginal m para construir la ecuación canónica f(x) = mx + n y resolver cálculos directos e inversos.


  ![Resumen Modelar una situación con valor inicial mediante una función afín consiste en estructurar la magnitud total como $f(x) = mx + n$, combinando un cargo fijo $n$ con un costo variable $mx$](/static/img/nodos/modelamiento-de-una-situacion-con-valor-inicial-mediante-funcion-afin-resumen.svg)'
