semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_AFIN_CONTEXTUAL
resumen_inicial: Una situación que combina un costo fijo o valor de partida con una
  tarifa variable por unidad se modela mediante una función afín $f(x) = m x + n$.
explicacion_simple: 'Muchos servicios reales cobran en dos partes:

  1. Un **cargo fijo de entrada** o costo de suscripción (que se paga aunque no consumas
  nada, $n$).

  2. Un **cargo variable** por cada unidad consumida (multiplicado por $x$, $m x$).

  La suma de ambas partes genera el **modelo afín**: $C(x) = m x + n$.'
explicacion_formal: 'Un sistema dinámico lineal desfasado responde al **modelo afín
  contextual**:


  $$C(x) = m x + n$$


  **Desglose de la fórmula:**

  - $n = C(0) \neq 0$: Costo fijo, tarifa base o condición inicial en $x = 0$.

  - $m = \frac{\Delta C}{\Delta x}$: Costo marginal por unidad adicional consumida.'
definiciones_clave: '- **Modelo afín contextual**: Ecuación $f(x) = m x + n$ con cargo
  fijo $n$ y costo variable $m x$.

  - **Cargo fijo / Tarifa base**: Valor del intercepto $n$ independiente del volumen
  de consumo.'
propiedades_relaciones: '- **Costo total**: Suma del costo variable ($m x$) más el
  costo fijo ($n$).'
ejemplo_guiado:
  enunciado: Un plan de telefonía móvil cobra un cargo fijo mensual de $\$7.000$ más
    $\$50$ por cada giga adicional consumido. Escribe la función de costo total $C(g)$
    y calcula la cuenta para un consumo de $12\text{ gigas}$.
  pasos:
  - 'Paso 1: Identificar el cargo fijo (intercepto): $n = 7.000$.Paso 2: Identificar
    el costo por giga adicional (pendiente): $m = 50$.Paso 3: Formar la función afín
    del costo: $C(g) = 50g + 7.000$.Paso 4: Evaluar para $g = 12$: $C(12) = 50(12)
    + 7.000 = 600 + 7.000 = 7.600$.Paso 5: Concluir que el total a pagar por $12\text{
    gigas}$ es $\$7.600$.'
checkpoints:
- placement: after_explicacion_formal
  question: En el plan de telefonía con cargo fijo de $\$7.000$ y $\$50$ por giga
    extra, ¿cuál es el costo total para un consumo de $12\text{ gigas}$?
  choices:
  - text: $\$7.600$
    is_correct: true
  - text: $\$600$
    is_correct: false
  - text: $\$84.600$
    is_correct: false
  - text: $\$7.050$
    is_correct: false
  explanation: La alternativa correcta es '$\$7.600$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa el número $7.000$ en la función de costo $C(g) = 50g +
    7.000$?
  choices:
  - text: El cargo fijo mensual obligatorio que se paga incluso consumiendo 0 gigas.
    is_correct: true
  - text: El costo de un solo giga.
    is_correct: false
  - text: El número de gigas contratados.
    is_correct: false
  - text: El impuesto de telefonía.
    is_correct: false
  explanation: La alternativa correcta es 'El cargo fijo mensual obligatorio que se
    paga incluso consumiendo 0 gigas.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cuota fija o constante inicial $n$.'
- 'Paso 2: Identificar la tasa variable de cobro por unidad $m$.'
- 'Paso 3: Construir la expresión afín $C(x) = m x + n$.'
- 'Paso 4: Reemplazar el consumo $x$ para calcular la cuenta total.'
errores_correccion: '- **Error común:** Multiplicar la variable $x$ por el cargo fijo
  en lugar de multiplicarla por la tarifa variable.

  - **Cómo corregirlo:** La variable $x$ multiplica UNICAMENTE al costo unitario variable
  $m$. El cargo fijo $n$ se suma suelto al final.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
