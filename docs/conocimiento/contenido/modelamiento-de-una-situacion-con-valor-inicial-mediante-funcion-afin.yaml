semantic_id: MAT.ALG.MODELAMIENTO_AFIN.MODELO_AFIN_CONTEXTUAL
resumen_inicial: 'Modelamiento de una situación con valor inicial mediante función
  afín: conceptos, representación y propiedades en Modelamiento lineal y afín.'
explicacion_simple: Cuando hay algo que "ya viene incluido" antes de empezar a contar,
  y además una tasa fija por unidad, el modelo necesita ambos ingredientes, un valor
  inicial y una pendiente.
explicacion_formal: '### Definición formal


  Si una situación cumple $y=n\neq0$ cuando $x=0$ (existe un valor de partida) y además
  la razón de cambio $\Delta y/\Delta x$ es constante e igual a $m$, el modelo correcto
  es $f(x)=mx+n$.


  ### Desarrollo didáctico


  El proceso de modelamiento tiene dos preguntas clave: "¿Cuánto hay cuando $x=0$?"
  (da $n$) y "¿Cuánto cambia por cada unidad de $x$?" (da $m$).


  Si un plan de celular cuesta \$5000 fijos más \$100 por minuto adicional: al no
  usar minutos ($x=0$) igual se paga \$5000 ($n=5000$), y cada minuto agrega \$100
  ($m=100$). El modelo es $C(x)=100x+5000$.'
definiciones_clave: '- **Modelamiento de una situación con valor inicial mediante
  función afín**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a modelamiento de una situación con valor
  inicial mediante función afín.'
