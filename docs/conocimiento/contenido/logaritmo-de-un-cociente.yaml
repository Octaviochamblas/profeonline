semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.COCIENTE
resumen_inicial: El logaritmo de un cociente o división es igual a la resta del logaritmo
  del dividendo menos el del divisor ($\log_b(x / y) = \log_b(x) - \log_b(y)$).
explicacion_simple: 'Cuando tienes una división dentro de un logaritmo, puedes separarla restando
  el logaritmo de arriba menos el de abajo:

  $$\log_3\left(\frac{81}{3}\right) = \log_3(81) - \log_3(3) = 4 - 1 = 3$$

  Comprobación directa: $\log_3(81/3) = \log_3(27) = 3$.'
explicacion_formal: 'Para $b > 0, b \neq 1$ y $x, y > 0$, se cumple:

  $$\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$$

  Esta regla proviene de la ley de exponentes $b^{m-n} = \frac{b^m}{b^n}$.'
definiciones_clave: '- **Transformación de cociente a resta**: Propiedad que convierte divisiones
  subradicales en sustracciones de logaritmos.'
propiedades_relaciones: '- **Resta ordenada**: El logaritmo del denominador es siempre el
  que se resta.'
ejemplo_guiado:
  enunciado: Sabiendo que $\log(8) \approx 0{,}903$ y $\log(2) \approx 0{,}301$, calcula $\log(4)$.
  pasos:
  - Escribir 4 como la división $8 / 2$.
  - 'Aplicar la propiedad del logaritmo de un cociente: $\log(8 / 2) = \log(8) - \log(2)$.'
  - 'Sustituir los valores: $0{,}903 - 0{,}301 = 0{,}602$.'
  - Concluir que $\log(4) \approx 0{,}602$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\log_2(a / b)$?
  choices:
  - text: \log_2(a) - \log_2(b)
    is_correct: true
  - text: \log_2(a) / \log_2(b)
    is_correct: false
  - text: \log_2(a - b)
    is_correct: false
  - text: \log_2(a) + \log_2(b)
    is_correct: false
  explanation: 'La correcta es: \log_2(a) - \log_2(b). El logaritmo de una división es la
    resta de logaritmos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\log_5(100) - \log_5(4)$.
  choices:
  - text: '2'
    is_correct: true
  - text: '25'
    is_correct: false
  - text: \log_5(96)
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La correcta es: 2. $\log_5(100/4) = \log_5(25) = 2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la división dentro del argumento del logaritmo.'
- 'Paso 2: Escribir la diferencia entre el logaritmo del numerador y el del denominador.'
- 'Paso 3: Evaluar los logaritmos resultantes.'
errores_correccion: No confundas $\log\left(\frac{x}{y}\right)$ con $\frac{\log(x)}{\log(y)}$.
  Esta última es un cambio de base, no la propiedad del cociente.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_2(32) - \log_2(4)$.
  alternativas:
  - '3'
  - '4'
  - '8'
  respuesta: '3'
  solucion_pasos:
  - $\log_2(32/4) = \log_2(8) = 3$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale log base 2 de (64/8)?
  alternativas:
  - '3'
  - log base 2 de 56
  - '4'
  respuesta: '3'
  solucion_pasos:
  - log base 2 de 64 - log base 2 de 8 = 6-3=3.
- titulo: Ejemplo 3
  enunciado: Sabiendo que log(20)≈1,301 y log(4)≈0,602, ¿cuál es el valor de log(5)?
  alternativas:
  - ≈0,699
  - ≈1,903
  - ≈0,602
  respuesta: ≈0,699
  solucion_pasos:
  - log(20/4)=log(20)-log(4)=1,301-0,602=0,699.
- titulo: ¿Es correcto que log(x/y) es igual a log(x) dividido log(y)?
  respuesta: 'No'
  solucion_pasos:
  - log(x/y) es la resta de logaritmos, no su división.
errores_frecuentes:
- Confundir $\log(x/y)$ con la división de dos logaritmos.
- Sumar los logaritmos en lugar de restarlos al aplicar esta propiedad.
- Invertir el orden de la resta, restando el logaritmo del numerador al del denominador.
- Confundir el logaritmo de un cociente con el cociente de dos logaritmos.
- Olvidar que ambos logaritmos deben compartir la misma base.
afirmaciones_verdaderas:
- $\log_b(x/y) = \log_b(x) - \log_b(y)$.
- Esta propiedad exige que tanto el dividendo como el divisor sean estrictamente positivos.
al_terminar_debes_poder: Aplicar la propiedad del logaritmo de un cociente en simplificaciones
  algebraicas.
fuente: Texto escolar MINEDUC.
estado: publicado
