resumen_inicial: 'El logaritmo de un cociente o división de dos números positivos
  $\log_b\left(\frac{x}{y}\right)$ es igual a la diferencia del logaritmo del numerador
  menos el logaritmo del denominador: $\log_b(x) - \log_b(y)$ ($x, y > 0$).'
explicacion_simple: Cuando tenemos una división o fracción dentro de un logaritmo,
  podemos separarla restando el logaritmo de la parte de arriba menos el logaritmo
  de la parte de abajo.
explicacion_formal: 'Para todo $x, y > 0$ y base $b > 0, b \neq 1$, el **Logaritmo
  de un Cociente** satisface la identidad:


  $$\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$$


  **Demostración exponencial:**

  Sean $u = \log_b(x)$ y $v = \log_b(y) \implies b^u = x$ y $b^v = y$.

  El cociente es $\frac{x}{y} = \frac{b^u}{b^v} = b^{u-v}$.

  Aplicando logaritmo: $\log_b\left(\frac{x}{y}\right) = u - v = \log_b(x) - \log_b(y)$.


  > **Complemento didáctico:** El orden de la resta es estricto: numerador menos denominador.'
definiciones_clave: '- **Logaritmo de un cociente**: Identidad $\log_b(x / y) = \log_b(x)
  - \log_b(y)$ para $x, y > 0$.'
propiedades_relaciones: '- **Transformación de cociente a resta**: Convierte divisiones
  internas en restas de logaritmos.'
ejemplo_guiado:
  enunciado: Calcule el valor de $\log_3\left(\frac{81}{9}\right)$ aplicando la propiedad
    del cociente.
  pasos:
  - 'Paso 1: Expandir como la resta de logaritmos: $\log_3(81) - \log_3(9)$.'
  - 'Paso 2: Evaluar los logaritmos: $\log_3(81) = 4$ y $\log_3(9) = 2$.'
  - 'Paso 3: Restar los valores: $4 - 2 = 2$.'
  - 'Conclusión: $\log_3(81/9) = \log_3(9) = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se expande el logaritmo de un cociente log_b(x/y) para x, y > 0?
  choices:
  - text: Como la resta log_b(x) - log_b(y)
    is_correct: true
  - text: Como la división log_b(x) / log_b(y)
    is_correct: false
  - text: Como la suma log_b(x) + log_b(y)
    is_correct: false
  - text: Como log_b(x - y)
    is_correct: false
  explanation: La alternativa correcta es 'Como la resta log_b(x) - log_b(y)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para log_3(81/9), ¿cuál fue el resultado de la resta?
  choices:
  - text: 2 (porque 4 - 2 = 2)
    is_correct: true
  - text: '6'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: '72'
    is_correct: false
  explanation: La alternativa correcta es '2 (porque 4 - 2 = 2)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de expandir y agrupar logaritmos
  de un cociente $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$, transformando
  divisiones en sustracciones.
semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.COCIENTE
procedimiento:
- 'Paso 1: Identificar la propiedad logarítmica correspondiente a la estructura del
  argumento o las bases.'
- 'Paso 2: Aplicar la ley algebraica transformando el logaritmo según la regla.'
- 'Paso 3: Evaluar y reducir numéricamente la expresión simplificada.'
errores_correccion: '- **Error 1: Confundir el logaritmo de una suma con la suma de
  logaritmos (escribir $\log(x+y) = \log(x) + \log(y)$).** **Cómo corregirlo:** El
  logaritmo NO es distributivo sobre la suma; la suma de logaritmos proviene del PRODUCTO
  ($\log(x \cdot y) = \log(x) + \log(y)$).


  - **Error 2: Confundir el cociente de logaritmos con el logaritmo del cociente.**
  **Cómo corregirlo:** $\log\left(\frac{x}{y}\right) = \log(x) - \log(y)$, mientras
  $\frac{\log(x)}{\log(y)}$ es la fórmula de cambio de base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de aplicación de MAT.NUM.LOGARITMOS_PROPIEDADES.COCIENTE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de validez formal.
  alternativas:
  - Cumple la propiedad
  - No cumple
  - Indeterminado
  respuesta: Cumple la propiedad
  solucion_pasos:
  - Demostración de equivalencia en R.
- titulo: ¿Es distributivo el logaritmo respecto a la adición?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(x+y) \neq \log(x) + \log(y)$.
- titulo: ¿Conserva el resultado la igualdad matemática original?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las propiedades de los logaritmos.
errores_frecuentes:
- Distribuir el logaritmo sobre los términos de una suma escribiendo $\log_b(x+y)
  = \log_b(x) + \log_b(y)$.
- Multiplicar los logaritmos individuales al calcular el logaritmo de un producto.
- Dividir los logaritmos individuales al calcular el logaritmo de un cociente.
- La expresión $\log(x^2)$ equivale numéricamente a elevar al cuadrado todo el logaritmo
  $(\log(x))^2$.
- Restar las bases al aplicar el cambio de base en un logaritmo.
afirmaciones_verdaderas:
- Las propiedades de los logaritmos transforman productos en sumas, cocientes en restas
  y potencias en multiplicaciones.
- 'El logaritmo de un producto es la suma de los logaritmos de sus factores: $\log_b(x
  \cdot y) = \log_b(x) + \log_b(y)$ ($x,y>0$).'
