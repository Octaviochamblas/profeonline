semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.COCIENTE
resumen_inicial: 'El logaritmo de un cociente es igual a la resta entre el logaritmo del numerador y el logaritmo del denominador: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$ ($x, y > 0$).'
explicacion_simple: '![Propiedad del logaritmo de un cociente](/static/img/nodos/logaritmo-de-un-cociente-intro.svg)


  Los logaritmos transforman divisiones en restas:

  - Cuando divides dentro del logaritmo $\log_2\left(\frac{8}{4}\right)$, se descompone en el logaritmo de arriba menos el logaritmo de abajo: $\log_2(8) - \log_2(4) = 3 - 2 = 1$.

  - Esto concuerda con la regla de potencias: al dividir potencias de igual base, los exponentes se restan ($2^3 : 2^2 = 2^{3-2} = 2^1$).

  - En sentido inverso, una resta de logaritmos de igual base se condensa dividiendo sus argumentos: $\log(50) - \log(5) = \log\left(\frac{50}{5}\right) = \log(10) = 1$.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$ y $x, y \in \mathbb{R}^+$. La **propiedad del logaritmo de un cociente** establece que:


  $$\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$$


  **Demostración Analítica:**

  1. Sean $u = \log_b(x)$ y $v = \log_b(y)$, lo que implica $x = b^u$ y $y = b^v$.

  2. Dividiendo miembro a miembro: $\frac{x}{y} = \frac{b^u}{b^v} = b^{u - v}$.

  3. Aplicando el operador logarítmico: $\log_b\left(\frac{x}{y}\right) = u - v$.

  4. Reemplazando $u$ y $v$: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$. $\blacksquare$'
definiciones_clave: '- **Logaritmo de un cociente**: Identidad $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$.

  - **Numerador logarítmico**: Término positivo $\log_b(x)$.

  - **Denominador logarítmico**: Término sustractivo $-\log_b(y)$.'
propiedades_relaciones: '- **Logaritmo del inverso**: $\log_b\left(\frac{1}{x}\right) = \log_b(1) - \log_b(x) = -\log_b(x)$.

  - **División de potencias**: Corresponde a la regla exponencial $b^{u-v} = \frac{b^u}{b^v}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de un cociente](/static/img/nodos/logaritmo-de-un-cociente-ejemplos.svg)


    Calcule el valor de $\log_3(54) - \log_3(2)$ y expanda la expresión $\log_5\left(\frac{25}{125}\right)$.'
  pasos:
  - 'Paso 1: Para $\log_3(54) - \log_3(2)$: Condensar en división vertical $\log_3\left(\frac{54}{2}\right)$.'
  - 'Paso 2: Simplificar el cociente: $\frac{54}{2} = 27 \implies \log_3(27) = 3$.'
  - 'Paso 3: Para $\log_5\left(\frac{25}{125}\right)$: Separar en $\log_5(25) - \log_5(125)$.'
  - 'Paso 4: Evaluar potencias: $2 - 3 = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a $\log_b\left(\frac{x}{y}\right)$?
  choices:
  - text: $\log_b(x) - \log_b(y)$ (el numerador resta al denominador)
    is_correct: true
  - text: $\frac{\log_b(x)}{\log_b(y)}$
    is_correct: false
  - text: $\log_b(x - y)$
    is_correct: false
  - text: $\log_b(y) - \log_b(x)$
    is_correct: false
  explanation: La alternativa correcta es '$\log_b(x) - \log_b(y)$ (el numerador resta al denominador)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado de $\log_3(54) - \log_3(2)$?
  choices:
  - text: $3$, porque $\log_3\left(\frac{54}{2}\right) = \log_3(27) = 3$
    is_correct: true
  - text: $27$
    is_correct: false
  - text: $52$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$3$, porque $\log_3\left(\frac{54}{2}\right) = \log_3(27) = 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambos logaritmos tengan la misma base $b$ y estén conectados por una resta.'
- 'Paso 2: Formar la fracción vertical con el argumento positivo arriba y el argumento que resta abajo: $\frac{x}{y}$.'
- 'Paso 3: Escribir la expresión condensada $\log_b\left(\frac{x}{y}\right)$ y calcular el resultado final.'
errores_correccion: "- **Error 1: Dividir los logaritmos ($\\log_b(x) - \\log_b(y) = \frac{\\log_b(x)}{\\log_b(y)}$).** **Cómo corregirlo:** La resta de logaritmos se condensa dividiendo los **argumentos dentro de un solo logaritmo**: $\\log_b(x/y)$.\n- **Error 2: Invertir el orden de la resta.** **Cómo corregirlo:** El argumento con signo menos va siempre en el denominador: $\\log_b(x) - \\log_b(y) = \\log_b(x/y)$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\log_2(40) - \log_2(5)$?
  alternativas:
  - $3$
  - $8$
  - $35$
  respuesta: $3$
  solucion_pasos:
  - $\log_2\left(\frac{40}{5}\right) = \log_2(8) = 3$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\log\left(\frac{1}{100}\right)$?
  alternativas:
  - $-2$
  - $2$
  - $1/2$
  respuesta: $-2$
  solucion_pasos:
  - $\log(1) - \log(100) = 0 - 2 = -2$.
- titulo: ¿Es log(300) - log(3) = 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\log\left(\frac{300}{3}\right) = \log(100) = 2$.
  alternativas:
  - texto: Sí, log(300/3) = log(100) = 2
    es_correcta: true
    retroalimentacion: ¡Correcto! Condensación exacta en base 10.
  - texto: No, es log(297)
    es_correcta: false
    retroalimentacion: Incorrecto, los argumentos se dividen, no se restan.
  - texto: No, es 100
    es_correcta: false
    retroalimentacion: Incorrecto, falta calcular el logaritmo de 100.
- titulo: ¿Es log_b(x/y) = log_b(x) - log_b(y) aplicable a bases distintas?
  respuesta: 'No'
  solucion_pasos:
  - No, la propiedad exige estrictamente que ambos logaritmos tengan la misma base $b$.
  alternativas:
  - texto: No, deben tener estrictamente la misma base
    es_correcta: true
    retroalimentacion: ¡Correcto! Misma base obligatoria.
  - texto: Sí, se puede aplicar con cualquier base
    es_correcta: false
    retroalimentacion: Incorrecto, con bases distintas se debe cambiar de base primero.
  - texto: Sí, restando también las bases
    es_correcta: false
    retroalimentacion: Incorrecto, las bases no se restan.
errores_frecuentes:
- Confundir la resta de logaritmos con la división de operadores $\frac{\log(x)}{\log(y)}$.
- Intentar desglosar el logaritmo de una resta $\log_b(x - y)$.
- Restar logaritmos con bases distintas sin unificar la base.
- Invertir el numerador con el denominador.
afirmaciones_verdaderas:
- El logaritmo de un cociente es igual a la resta del logaritmo del numerador menos el del denominador.
- El logaritmo del inverso multiplicativo cumple $\log_b(1/x) = -\log_b(x)$.
- La propiedad es el equivalente logarítmico de la división de potencias de igual base.
al_terminar_debes_poder: '![Síntesis de logaritmo de un cociente](/static/img/nodos/logaritmo-de-un-cociente-resumen.svg)


  QUÉ: Aplicar con solvencia la propiedad del logaritmo de un cociente para expandir o condensar expresiones.


  CÓMO: Empleando la equivalencia $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$, asegurando que el término sustractivo corresponda al denominador y que $b > 0, b \neq 1, x, y > 0$.'
