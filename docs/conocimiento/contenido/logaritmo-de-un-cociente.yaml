semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.COCIENTE
resumen_inicial: 'El logaritmo de un cociente es igual a la resta del logaritmo del numerador menos el logaritmo del denominador: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$ ($x, y > 0$).'
explicacion_simple: |
  Los logaritmos convierten divisiones o fracciones en restas sencillas. Si dentro de un logaritmo tienes una fracción (como $\log_2\left(\frac{16}{4}\right)$), puedes separar la división restando el logaritmo del número de arriba (numerador) menos el logaritmo del número de abajo (denominador): $\log_2(16) - \log_2(4) = 4 - 2 = 2$. Esto concuerda con la regla de exponentes donde al dividir potencias de igual base se restan los exponentes ($b^u / b^v = b^{u-v}$).
explicacion_formal: |
  ### Definición formal
  La **propiedad del logaritmo de un cociente** establece que para toda base real $b > 0, b \neq 1$ y números reales estrictamente positivos $x, y \in \mathbb{R}^+$:
  $$\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$$

  ### Demostración analítica
  Sean $u = \log_b(x)$ y $v = \log_b(y)$. Por la definición exponencial:
  1. $x = b^u$ y $y = b^v$.
  2. Dividiendo ambas igualdades: $\frac{x}{y} = \frac{b^u}{b^v} = b^{u - v}$.
  3. Aplicando la definición de logaritmo a la potencia resultante $\frac{x}{y} = b^{u - v}$:
     $$\log_b\left(\frac{x}{y}\right) = u - v$$
  4. Sustituyendo $u$ y $v$: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$.

  ### Síntesis didáctica
  - Transformación operacional: La división interna $\frac{x}{y}$ se convierte en la resta externa $\log_b(x) - \log_b(y)$.
  - Orden de la resta: Logaritmo del **numerador** menos logaritmo del **denominador**.
definiciones_clave: |
  - **Logaritmo de un cociente**: Propiedad expansiva que desglosa el logaritmo de una fracción en la resta de dos logaritmos.
  - **Condensación de restas**: Propiedad inversa $\log_b(x) - \log_b(y) = \log_b\left(\frac{x}{y}\right)$ que unifica una resta de logaritmos en una sola fracción sublogarítmica.
  - **Exponente resta**: Relación directa con la división de potencias de igual base $b^{u-v}$.
propiedades_relaciones: |
  - **Logaritmo del recíproco**: $\log_b\left(\frac{1}{x}\right) = \log_b(1) - \log_b(x) = 0 - \log_b(x) = -\log_b(x)$.
  - **Simplificación de fracciones algebraicas**: Permite evaluar razones de grandes magnitudes (como escalas decibélicas o diferencias de pH).
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico simplificado de la resta de logaritmos $R = \log_5(500) - \log_5(4)$ condensando la expresión.'
  pasos:
    - 'Paso 1: Verificamos que ambos logaritmos tengan la misma base $b = 5$ y estén conectados por una resta.'
    - 'Paso 2: Aplicamos la propiedad de condensación del cociente dividiendo los argumentos: $R = \log_5\left(\frac{500}{4}\right)$.'
    - 'Paso 3: Realizamos la división interna: $\frac{500}{4} = 125 \implies R = \log_5(125)$.'
    - 'Paso 4: Calculamos el logaritmo resultante buscando la potencia $5^c = 125 \implies c = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se desglosa el logaritmo de un cociente $\log_b\left(\frac{x}{y}\right)$?'
    choices:
      - {text: '$\log_b(x) - \log_b(y)$, restando el logaritmo del numerador menos el del denominador', is_correct: true}
      - {text: '$\frac{\log_b(x)}{\log_b(y)}$, dividiendo los dos logaritmos entre sí', is_correct: false}
      - {text: '$\log_b(x - y)$, restando los argumentos dentro de una sola raíz', is_correct: false}
      - {text: '$\log_b(x) \cdot \log_b(y)$, multiplicando los dos logaritmos', is_correct: false}
    explanation: 'La alternativa correcta es ''$\log_b(x) - \log_b(y)$, restando el logaritmo del numerador menos el del denominador''. La división sublogarítmica se convierte en la resta externa de logaritmos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de evaluar la expresión $\log_3(54) - \log_3(2)$?'
    choices:
      - {text: '$3$, ya que $\log_3\left(\frac{54}{2}\right) = \log_3(27) = 3$', is_correct: true}
      - {text: '$27$, olvidando calcular la potencia', is_correct: false}
      - {text: '$52$, restando directamente los argumentos', is_correct: false}
      - {text: '$1$, dividiendo la respuesta entre 3', is_correct: false}
    explanation: 'La alternativa correcta es ''$3$, ya que $\log_3\left(\frac{54}{2}\right) = \log_3(27) = 3$''. Condensamos la resta dividiendo $54 / 2 = 27$ y calculamos $\log_3(27) = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comprobar que los logaritmos tengan la misma base $b$ y estén conectados por una resta.'
  - 'Paso 2: Colocar el argumento del logaritmo positivo en el numerador y el del logaritmo restado en el denominador.'
  - 'Paso 3: Escribir el logaritmo condensado de la fracción $\log_b\left(\frac{x}{y}\right)$.'
  - 'Paso 4: Resolver la división sublogarítmica y evaluar el valor final del logaritmo.'
errores_correccion: |
  - **Error 1:** Confundir el logaritmo de un cociente con la división de dos logaritmos (ej: escribir $\log_b\left(\frac{x}{y}\right) = \frac{\log_b(x)}{\log_b(y)}$). **Cómo corregirlo:** La división de logaritmos $\frac{\log_b(x)}{\log_b(y)}$ es la fórmula del **cambio de base**. El logaritmo de una fracción es la **resta**: $\log_b(x) - \log_b(y)$.
  - **Error 2:** Restar los argumentos dentro de un solo logaritmo (ej: $\log_b(x) - \log_b(y) = \log_b(x - y)$). **Cómo corregirlo:** La resta de logaritmos se condensa en la **división** de sus argumentos: $\log_b\left(\frac{x}{y}\right)$.
ejemplos:
  - titulo: 'Condensación con logaritmo decimal'
    enunciado: '¿La resta $\log(500) - \log(5)$ es igual a $2$?'
    alternativas:
      - 'Sí, pues $\log(500 / 5) = \log(100) = 2$'
      - 'No, es igual a $\log(495)$'
      - 'No, es igual a 100'
    respuesta: 'Sí, pues $\log(500 / 5) = \log(100) = 2$'
    solucion_pasos:
      - '1. Condensamos la resta: $\log(500 / 5) = \log(100)$.'
      - '2. Calculamos $\log_{10}(100) = 2$.'
  - titulo: 'Logaritmo del recíproco'
    enunciado: '¿La expresión $\log_2(1/8)$ equivale a $-\log_2(8) = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\log_2(1) - \log_2(8) = 0 - 3 = -3$.'
  - titulo: 'Resta en base 3'
    enunciado: '¿La resta $\log_3(18) - \log_3(2)$ resulta en $2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\log_3(18 / 2) = \log_3(9) = 2$.'
  - titulo: 'Orden de los términos'
    enunciado: '¿Invertir el orden de la resta $\log_b(y) - \log_b(x)$ genera el logaritmo de la fracción invertida $\log_b(y/x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El argumento positivo siempre es el numerador y el sustraído el denominador.'
