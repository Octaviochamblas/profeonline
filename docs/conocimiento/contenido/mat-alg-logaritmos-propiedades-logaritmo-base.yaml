semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.LOGARITMO_BASE
resumen_inicial: 'Cálculo del logaritmo de la base: conceptos, asíntotas, propiedades
  e inversidad en Logaritmos y sus propiedades.'
explicacion_simple: Cuando el argumento de un logaritmo es exactamente igual a su
  base, el resultado siempre es el mismo valor fijo, sin importar cuál sea esa base.
explicacion_formal: '### Definición formal


  Para todo $b>0$, $b\neq1$, se cumple $\log_b(b)=1$, pues $b^1=b$. Esta propiedad
  permite simplificar de inmediato cualquier término de una expresión algebraica donde
  el argumento sea idéntico a la base del logaritmo.


  ### Desarrollo didáctico


  Al simplificar $\log_7(x)+\log_7(7)$, se reemplaza $\log_7(7)$ por $1$, quedando
  $\log_7(x)+1$. Reconocer esta coincidencia entre base y argumento evita cálculos
  innecesarios.'
definiciones_clave: '- **Cálculo del logaritmo de la base**: Concepto fundamental
  en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a cálculo del logaritmo de la base.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de cálculo del
    logaritmo de la base.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de cálculo del logaritmo de la
    base.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    cálculo del logaritmo de la base?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en logaritmos y sus
      propiedades
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en logaritmos y sus propiedades. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en cálculo del logaritmo de la base?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localiza cualquier término donde el argumento coincida exactamente con
  la base del logaritmo.'
- 'Paso 2: Reemplázalo directamente por $1$.'
- 'Paso 3: Simplifica la expresión resultante integrando ese valor constante.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en cálculo
  del logaritmo de la base.
ejemplos:
- titulo: Simplificación directa de $\log_b(b)$
  enunciado: Simplifica $\log_4(4)+\log_4(x)$.
  solucion_pasos:
  - Se reemplaza $\log_4(4)$ por $1$.
  - La expresión se reduce a $1+\log_4(x)$.
- titulo: Uso dentro de una expresión con resta
  enunciado: Simplifica $\log_3(x)-\log_3(3)$.
  solucion_pasos:
  - Se reemplaza $\log_3(3)$ por $1$.
  - La expresión queda $\log_3(x)-1$, equivalente a $\log_3(x/3)$.
- titulo: ¿Es cierto que $\log_b(b)=1$ para toda base válida?
  enunciado: ¿La igualdad $\log_b(b)=1$ se cumple para cualquier base $b>0$, $b\neq1$?
  respuesta: Sí
  solucion_pasos:
  - Se deriva directamente de que $b^1=b$ para cualquier base.
- titulo: ¿$\log_b(b)$ puede ser distinto de $1$ para alguna base?
  enunciado: ¿Existe alguna base válida $b$ para la cual $\log_b(b)\neq1$?
  respuesta: 'No'
  solucion_pasos:
  - El resultado siempre es $1$, sin importar qué base válida se use.
errores_frecuentes:
- Declarar $\log_b(b)=1$ con $\log_b(1)=0$, invirtiendo los resultados de ambas propiedades.
- No reconocer el término $\log_b(b)$ cuando aparece disfrazado dentro de una expresión
  más compleja.
- Suponer que el resultado depende del valor específico de la base.
- Omitir verificar que la base cumpla $b>0$, $b\neq1$ antes de aplicar la propiedad.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando cálculo del logaritmo de la base.
