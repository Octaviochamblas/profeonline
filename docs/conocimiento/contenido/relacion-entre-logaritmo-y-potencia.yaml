semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RELACION_CON_POTENCIA
resumen_inicial: 'La relación entre logaritmo y potencia establece que la logaritmación es la operación inversa de la exponenciación encargada de aislar y despejar el exponente.'
explicacion_simple: |
  En una potencia común como $2^3 = 8$, tienes tres partes: la base (2), el exponente (3) y el resultado o potencia (8). Si conoces la base y el exponente, calculas la potencia ($2^3 = 8$). Si conoces la potencia y el exponente, calculas la raíz ($\sqrt[3]{8} = 2$). Pero si conoces la base y la potencia y necesitas averiguar el exponente, usas el logaritmo: $\log_2(8) = 3$.
explicacion_formal: |
  ### Definición formal
  La **triangulación de operaciones de potencia, raíz y logaritmo** sobre la igualdad fundamental $b^c = a$ establece tres operaciones inversas según el elemento desconocido:
  1. **Exponenciación (Conocidos $b$ y $c$)**:
     $$a = b^c$$
  2. **Radicación (Conocidos $a$ y $c$)**:
     $$b = \sqrt[c]{a}$$
  3. **Logaritmación (Conocidos $b$ y $a$)**:
     $$c = \log_b(a)$$

  ### Identidades fundamentales de inversión
  Dado que la función logarítmica $f(x) = \log_b(x)$ y la función exponencial $g(x) = b^x$ son funciones inversas entre sí:
  $$\log_b\left(b^x\right) = x \quad \text{y} \quad b^{\log_b(x)} = x \quad (x > 0)$$

  ### Síntesis didáctica
  - Operaciones exponenciales: La base $b$ elevada al logaritmo destruye el radical o logaritmo devolviendo el argumento $x$.
definiciones_clave: |
  - **Operación inversa**: Operación matemática que revierte el efecto de otra (como el logaritmo revierte la exponenciación).
  - **Identidad de cancelación $b^{\log_b(x)} = x$**: Propiedad por la cual una base elevada a su propio logaritmo simplifica al argumento.
  - **Triangulación operacional**: Relación de equivalencia entre las tres operaciones de potencias, raíces y logaritmos.
propiedades_relaciones: |
  - **Dominio y Recorrido cruzados**: El dominio de la función exponencial $\mathbb{R}$ es el recorrido de la función logarítmica; el recorrido de la exponencial $\mathbb{R}^+$ es el dominio de la logarítmica.
  - **Resolución de ecuaciones exponenciales**: Los logaritmos son la herramienta fundamental para despejar incógnitas que se encuentran en el exponente ($b^x = a \implies x = \log_b(a)$).
ejemplo_guiado:
  enunciado: 'Aplica la identidad de cancelación de logaritmos y potencias para simplificar la expresión numérica $K = 7^{\log_7(49)}$.'
  pasos:
    - 'Paso 1: Identificamos la base de la potencia $b = 7$ y la base del logaritmo en el exponente $b = 7$.'
    - 'Paso 2: Reconocemos que las bases coinciden ($7$ y $7$), por lo que podemos aplicar la propiedad de funciones inversas $b^{\log_b(x)} = x$.'
    - 'Paso 3: Alternativamente, calculamos el logaritmo del exponente: $\log_7(49) = 2$ pues $7^2 = 49$.'
    - 'Paso 4: Sustituimos el exponente: $K = 7^2 = 49$, confirmando que la base y el logaritmo se cancelan dejando el argumento $49$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el resultado de simplificar la expresión $b^{\log_b(x)}$ para cualquier $x > 0$?'
    choices:
      - {text: '$x$, pues la base exponencial y la base logarítmica son operaciones inversas que se cancelan', is_correct: true}
      - {text: '$b$, conservando únicamente la base', is_correct: false}
      - {text: '$\log_b(x)$, conservando el exponente', is_correct: false}
      - {text: '$1$, anulando la expresión', is_correct: false}
    explanation: 'La alternativa correcta es ''$x$, pues la base exponencial y la base logarítmica son operaciones inversas que se cancelan''. La identidad fundamental establece $b^{\log_b(x)} = x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué elemento de la estructura de potencia $b^c = a$ desabla y despeja la operación logarítmica $\log_b(a)$?'
    choices:
      - {text: 'El exponente $c$', is_correct: true}
      - {text: 'La base $b$', is_correct: false}
      - {text: 'El argumento $a$', is_correct: false}
      - {text: 'El producto $b \cdot a$', is_correct: false}
    explanation: 'La alternativa correcta es ''El exponente $c$''. La logaritmación es la operación diseñada para aislar el exponente $c = \log_b(a)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la ecuación en forma de potencia $b^c = a$ o forma de logaritmo $\log_b(a) = c$.'
  - 'Paso 2: Reconocer a la base $b$ como el elemento fijo común en ambas operaciones.'
  - 'Paso 3: Aplicar la propiedad de cancelación $b^{\log_b(x)} = x$ o $\log_b(b^x) = x$ según corresponda.'
  - 'Paso 4: Comprobar el resultado mediante la sustitución en la ecuación exponencial original.'
errores_correccion: |
  - **Error 1:** Creer que el logaritmo de una potencia es igual a multiplicar la base por el exponente (ej: $2^{\log_2(8)} = 2 \cdot 8 = 16$). **Cómo corregirlo:** La base $2$ elevada a $\log_2(8)$ se cancela dejando directamente el argumento: $2^{\log_2(8)} = 8$.
  - **Error 2:** Confundir la operación de radicación con la logaritmación al despejar una potencia. **Cómo corregirlo:** La radicación despeja la **base** ($b = \sqrt[c]{a}$); la logaritmación despeja el **exponente** ($c = \log_b(a)$).
ejemplos:
  - titulo: 'Cancelación exponencial logarítmica'
    enunciado: '¿La expresión $5^{\log_5(12)}$ es igual a $12$?'
    alternativas:
      - 'Sí, por ser operaciones inversas $b^{\log_b(x)} = x$'
      - 'No, es igual a 5'
      - 'No, es igual a 60'
    respuesta: 'Sí, por ser operaciones inversas $b^{\log_b(x)} = x$'
    solucion_pasos:
      - '1. Verificamos coincidencia de bases: 5.'
      - '2. Aplicamos identidad $5^{\log_5(12)} = 12$.'
  - titulo: 'Logaritmo de una potencia de la misma base'
    enunciado: '¿La expresión $\log_3\left(3^5\right)$ resulta en $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\log_b(b^x) = x \implies \log_3(3^5) = 5$.'
  - titulo: 'Despeje de exponente desconocido'
    enunciado: 'En la ecuación $10^x = 500$, ¿el valor del exponente $x$ viene dado por $\log_{10}(500)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Aplicando logaritmo a ambos lados $x = \log_{10}(500)$.'
  - titulo: 'Operaciones inversas en $\mathbb{R}^+$'
    enunciado: '¿La función exponencial $f(x) = b^x$ y la función logarítmica $g(x) = \log_b(x)$ son funciones inversas mutuas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Sus gráficas son simétricas respecto a la recta diagonal $y = x$.'
errores_frecuentes:
  - 'La operación de radicación y la de logaritmación despejan exactamente el mismo elemento de una potencia.'
  - 'La expresión $b^{\log_b(x)}$ resulta en $b \cdot x$.'
  - 'Al simplificar $\log_b(b^x)$ se obtiene $b^x$ multiplicando por el logaritmo.'
  - 'La función logarítmica es la inversa de la función polinomial cuadrática.'
  - 'Elevar una base a su propio logaritmo anula el argumento dando como resultado 0.'
afirmaciones_verdaderas:
  - 'La logaritmación es la operación inversa de la exponenciación destinada a calcular el exponente $c$ de la igualdad $b^c = a$.'
  - 'Las identidades fundamentales de inversión establecen que $\log_b(b^x) = x$ y $b^{\log_b(x)} = x$ para todo argumento positivo $x > 0$.'
al_terminar_debes_poder: 'Relacionar logaritmos y potencias aplicando las identidades de inversión $b^{\log_b(x)} = x$ y $\log_b(b^x) = x$.'
