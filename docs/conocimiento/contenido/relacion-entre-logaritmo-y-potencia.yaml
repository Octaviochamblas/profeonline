resumen_inicial: 'El logaritmo y la potencia son representaciones equivalentes de
  la misma relación matemática: la base elevada al resultado da el argumento $b^c
  = a \iff \log_b(a) = c$.'
explicacion_simple: Las potencias y los logaritmos dicen exactamente lo mismo desde
  dos perspectivas distintas. La potencia calcula la cantidad final $a = b^c$, mientras
  que el logaritmo calcula el exponente $c = \log_b(a)$.
explicacion_formal: 'Para todo $a > 0, b > 0, b \neq 1$, la relación de **Dualidad
  Potencia-Logaritmo** establece la identidad mutua:


  $$b^{\log_b(a)} = a \quad \text{y} \quad \log_b\left(b^c\right) = c$$


  **Cancelación funcional:**

  - La función exponencial $f(x) = b^x$ y la función logarítmica $g(x) = \log_b(x)$
  son funciones inversas sobre su dominio.'
definiciones_clave: '- **Relación potencia-logaritmo**: Cancelación reciproca $b^{\log_b(a)}
  = a$ y $\log_b(b^c) = c$.'
propiedades_relaciones: '- **Identidad de cancelación**: La función exponencial cancela
  a la logarítmica de igual base.'
ejemplo_guiado:
  enunciado: Verifique la cancelación en $2^{\log_2(8)}$ y $\log_3(3^5)$.
  pasos:
  - 'Paso 1: Para $2^{\log_2(8)}$, calcular el exponente $\log_2(8) = 3$. Evaluar
    $2^3 = 8$.'
  - 'Paso 2: Para $\log_3(3^5)$, la base del logaritmo ($3$) y de la potencia ($3$)
    coinciden $\implies$ resultado $5$.'
  - 'Conclusión: $2^{\log_2(8)} = 8$ y $\log_3(3^5) = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué valor resulta al evaluar la expresión b^{log_b(a)} para a > 0 y base
    válida b?
  choices:
  - text: Resulta en el argumento a por cancelación directa
    is_correct: true
  - text: Resulta en cero
    is_correct: false
  - text: Resulta en b
    is_correct: false
  - text: Resulta en log(a)
    is_correct: false
  explanation: La alternativa correcta es 'Resulta en el argumento a por cancelación
    directa'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para log_3(3^5), ¿cuál fue el resultado final?
  choices:
  - text: '5'
    is_correct: true
  - text: '243'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '15'
    is_correct: false
  explanation: La alternativa correcta es '5'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de aplicar la dualidad entre potencias
  y logaritmos $b^{\log_b(a)} = a$, simplificando expresiones exponenciales.
semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RELACION_CON_POTENCIA
procedimiento:
- 'Paso 1: Verificar que el argumento $a > 0$ y la base $b > 0, b \neq 1$ cumplan
  las restricciones.'
- 'Paso 2: Formular la equivalencia de potencia $b^c = a$.'
- 'Paso 3: Calcular el valor del exponente $c$ o simplificar la expresión logarítmica.'
errores_correccion: '- **Error 1: Intentar calcular logaritmos de números negativos
  o cero ($\log_2(-4)$ o $\log_2(0)$).** **Cómo corregirlo:** El argumento debe ser
  estrictamente positivo ($a > 0$); en $\mathbb{R}$ no existen.


  - **Error 2: Confundir la base con el argumento (escribir $\log_2(8) = 8^2 = 64$).**
  **Cómo corregirlo:** La base $2$ se eleva al RESULTADO para dar el argumento ($2^3
  = 8 \implies \log_2(8) = 3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.LOGARITMOS_CONCEPTO.RELACION_CON_POTENCIA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la definición logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en R.
- titulo: ¿Cumple el logaritmo las restricciones de base y argumento?
  respuesta: Sí
  solucion_pasos:
  - Sí, $b > 0, b \neq 1$ y $a > 0$.
- titulo: ¿Es log_b(1) siempre igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $b^0 = 1$ para toda base válida.
errores_frecuentes:
- '[''Calcular logaritmos con bases negativas en el conjunto de los números reales.'',
  ''Evaluar el logaritmo de cero o de números negativos obteniendo números reales
  negativos.'', ''Utilizar el número 1 como la base de un logaritmo en expresiones
  algebraicas.'', ''El logaritmo de uno $\\log_b(1)$ es numéricamente igual a la base
  $b$.'', ''Declarar la sigla del logaritmo decimal $\\log$ con la sigla del logaritmo
  natural $\\ln$.'']'
afirmaciones_verdaderas:
- El logaritmo $\log_b(a) = c$ se define formalmente mediante la ecuación exponencial
  $b^c = a$ para $b > 0, b \neq 1, a > 0$.
- El logaritmo de 1 en cualquier base válida es 0 y el logaritmo de la base es 1.
