semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RELACION_CON_POTENCIA
resumen_inicial: 'El logaritmo y la potencia son operaciones inversas que expresan la misma relación matemática: la base se mantiene idéntica, el exponente es el resultado del logaritmo y la potencia es su argumento.'
explicacion_simple: '![Relación entre logaritmo y potencia](/static/img/nodos/relacion-entre-logaritmo-y-potencia-intro.svg)


  La potencia y el logaritmo son dos formas de mirar la misma ecuación:

  - En la **potencia** $2^3 = 8$, conoces la base ($2$) y el exponente ($3$) y buscas el resultado ($8$).

  - En el **logaritmo** $\log_2(8) = 3$, conoces la base ($2$) y el resultado ($8$) y buscas el exponente ($3$).

  - Se cancelan mutuamente: $b^{\log_b(a)} = a$ y $\log_b(b^c) = c$.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$ y $a \in \mathbb{R}^+$. La función exponencial $f(x) = b^x$ y la función logarítmica $g(x) = \log_b(x)$ son **funciones biyectivas e inversas mutuas** en sus respectivos dominios.


  **Identidades de Cancelación Inversa:**

  1. **Composición exponencial-logaritmo:**

  $$b^{\log_b(a)} = a \quad (\forall a > 0)$$

  2. **Composición logaritmo-exponencial:**

  $$\log_b(b^c) = c \quad (\forall c \in \mathbb{R})$$


  Esta reciprocidad asegura que cualquier afirmación exponencial posee una transcripción logarítmica exacta.'
definiciones_clave: '- **Operaciones inversas**: Par de transformaciones que se neutralizan recíprocamente ($f(g(x)) = x$).

  - **Identidad de cancelación**: $b^{\log_b(a)} = a$ y $\log_b(b^c) = c$.

  - **Doble implicación**: $b^c = a \iff \log_b(a) = c$.'
propiedades_relaciones: '- **Conservación de la base**: La base $b$ ocupa la misma posición estructural en ambas operaciones.

  - **Gráfica simétrica**: Las funciones $y = b^x$ e $y = \log_b(x)$ son simétricas respecto a la recta identidad $y = x$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de relación potencia-logaritmo](/static/img/nodos/relacion-entre-logaritmo-y-potencia-ejemplos.svg)


    Verifique y traduzca las igualdades $2^5 = 32$, $10^{-3} = 0,001$ y $7^0 = 1$ a su forma logarítmica equivalente.'
  pasos:
  - 'Paso 1: $2^5 = 32$: Base 2, exponente 5, potencia 32 $\implies \log_2(32) = 5$.'
  - 'Paso 2: $10^{-3} = 0,001$: Base 10, exponente -3, potencia 0,001 $\implies \log(0,001) = -3$.'
  - 'Paso 3: $7^0 = 1$: Base 7, exponente 0, potencia 1 $\implies \log_7(1) = 0$.'
  - 'Conclusión: Todas las igualdades exponenciales se traducen unívocamente a forma logarítmica.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor simplificado de $5^{\log_5(19)}$?
  choices:
  - text: $19$ (por la identidad de cancelación $b^{\log_b(a)} = a$)
    is_correct: true
  - text: $5$
    is_correct: false
  - text: $1$
    is_correct: false
  - text: $95$
    is_correct: false
  explanation: La alternativa correcta es '$19$ (por la identidad de cancelación $b^{\log_b(a)} = a$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿a qué forma logarítmica equivale $10^{-3} = 0,001$?
  choices:
  - text: $\log(0,001) = -3$
    is_correct: true
  - text: $\log(-3) = 0,001$
    is_correct: false
  - text: $\log(10) = -3$
    is_correct: false
  - text: $\log(0,001) = 3$
    is_correct: false
  explanation: La alternativa correcta es '$\log(0,001) = -3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los tres componentes en la potencia $b^c = a$ (base $b$, exponente $c$, resultado $a$).'
- 'Paso 2: Escribir la expresión $\log_b(a) = c$.'
- 'Paso 3: Comprobar mediante las identidades de cancelación $b^{\log_b(a)} = a$ o $\log_b(b^c) = c$.'
errores_correccion: '- **Error 1: Cambiar de base al pasar de potencia a logaritmo.** **Cómo corregirlo:** La base de la potencia es exactamente la base del logaritmo ($2^5 = 32 \implies \log_2(32) = 5$).

  - **Error 2: Confundir exponente con argumento.** **Cómo corregirlo:** El exponente es siempre el resultado aislado del logaritmo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma logarítmica de $3^4 = 81$?
  alternativas:
  - $\log_3(81) = 4$
  - $\log_4(81) = 3$
  - $\log_3(4) = 81$
  respuesta: $\log_3(81) = 4$
  solucion_pasos:
  - Base 3, argumento 81, exponente 4 $\implies \log_3(81) = 4$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $2^{\log_2(15)}$?
  alternativas:
  - $15$
  - $2$
  - $30$
  respuesta: $15$
  solucion_pasos:
  - Por cancelación inmediata $b^{\log_b(x)} = x$, el resultado es $15$.
- titulo: ¿Es 6^log₆(11) = 11?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de cancelación inversa $b^{\log_b(a)} = a$.
  alternativas:
  - texto: Sí, 6^log₆(11) = 11
    es_correcta: true
    retroalimentacion: ¡Correcto! Cancelación de funciones inversas.
  - texto: No, es 66
    es_correcta: false
    retroalimentacion: Incorrecto, no se multiplican.
  - texto: No, es 6
    es_correcta: false
    retroalimentacion: Incorrecto, la base y el logaritmo se neutralizan.
- titulo: ¿Es log₅(5⁷) = 7?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\log_b(b^c) = c$.
  alternativas:
  - texto: Sí, log₅(5⁷) = 7
    es_correcta: true
    retroalimentacion: ¡Correcto! Extracción directa del exponente.
  - texto: No, es 35
    es_correcta: false
    retroalimentacion: Incorrecto, $5 \times 7$ no es la operación correcta.
  - texto: No, es 5
    es_correcta: false
    retroalimentacion: Incorrecto, el resultado es el exponente 7.
errores_frecuentes:
- Invertir los roles del argumento y del exponente.
- Desconocer las identidades de cancelación directa.
- Creer que la base cambia al traducir entre formatos.
- No reconocer que el logaritmo despeja incógnitas en los exponentes.
afirmaciones_verdaderas:
- La potenciación y la logaritmación son operaciones inversas.
- La expresión $b^{\log_b(a)}$ es idénticamente igual a $a$ para todo $a > 0$.
- La expresión $\log_b(b^c)$ es idénticamente igual a $c$ para todo $c \in \mathbb{R}$.
al_terminar_debes_poder: '![Síntesis de relación potencia y logaritmo](/static/img/nodos/relacion-entre-logaritmo-y-potencia-resumen.svg)


  QUÉ: Relacionar y operar fluidamente entre la forma exponencial y la forma logarítmica.


  CÓMO: Aplicando la dualidad estructural $b^c = a \iff \log_b(a) = c$ y utilizando las identidades de cancelación $b^{\log_b(a)} = a$ y $\log_b(b^c) = c$.'
