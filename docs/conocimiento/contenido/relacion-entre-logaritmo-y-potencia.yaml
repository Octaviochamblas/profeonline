semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RELACION_CON_POTENCIA
resumen_inicial: La potencia y el logaritmo son expresiones equivalentes de la misma relación
  matemática entre base, exponente y resultado.
explicacion_simple: 'Toda igualdad en forma de potencia se puede traducir a forma de logaritmo
  y viceversa:

  - Potencia: $\text{Base}^{\text{Exponente}} = \text{Resultado}$

  - Logaritmo: $\log_{\text{Base}}(\text{Resultado}) = \text{Exponente}$

  Ejemplo: Como $3^4 = 81$, su equivalente logarítmico es $\log_3(81) = 4$.'
explicacion_formal: Dada la relación $y = b^x$, se define la función inversa $x = \log_b(y)$
  para $b > 0, b \neq 1$ y $y > 0$. Las identidades de cancelación son $b^{\log_b(x)} = x$
  y $\log_b(b^x) = x$.
definiciones_clave: '- **Forma exponencial**: $b^c = a$.

  - **Forma logarítmica**: $\log_b(a) = c$.'
propiedades_relaciones: '- **Cancelación cruzada**: $b^{\log_b(a)} = a$.'
ejemplo_guiado:
  enunciado: Traduce la igualdad $10^3 = 1000$ a notación logarítmica.
  pasos:
  - Identificar base $b = 10$, exponente $c = 3$ y resultado $a = 1000$.
  - Ubicar en la estructura $\log_b(a) = c$.
  - Escribir $\log_{10}(1000) = 3$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma logarítmica equivalente a $2^6 = 64$?
  choices:
  - text: \log_2(64) = 6
    is_correct: true
  - text: \log_6(64) = 2
    is_correct: false
  - text: \log_{64}(2) = 6
    is_correct: false
  - text: \log_2(6) = 64
    is_correct: false
  explanation: 'La correcta es: \log_2(64) = 6. La base es 2, el argumento es 64 y el exponente
    resultado es 6.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué equivale $5^{\log_5(12)}$?
  choices:
  - text: '12'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '60'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La correcta es: 12. Por la propiedad de cancelación $b^{\log_b(x)} = x$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar base, exponente y resultado en la expresión dada.'
- 'Paso 2: Reorganizar los términos pasando el exponente al resultado del logaritmo.'
errores_correccion: No intercambies el rol de la base y del argumento al convertir.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\log_3(x) = 2$, halla $x$.
  alternativas:
  - '9'
  - '6'
  - '8'
  respuesta: '9'
  solucion_pasos:
  - $3^2 = x \implies x = 9$.
- titulo: Ejemplo 2
  enunciado: Si 4^3 = 64, ¿cuál es su forma logarítmica equivalente?
  alternativas:
  - log base 4 de 64 es igual a 3
  - log base 64 de 4 es igual a 3
  - log base 3 de 64 es igual a 4
  respuesta: log base 4 de 64 es igual a 3
  solucion_pasos:
  - La base de la potencia es la base del logaritmo, y el exponente es el resultado.
- titulo: Ejemplo 3
  enunciado: ¿A qué equivale 7 elevado a (log base 7 de 20)?
  alternativas:
  - '20'
  - '7'
  - '140'
  respuesta: '20'
  solucion_pasos:
  - Por la propiedad de cancelación, b elevado a (log base b de x) es igual a x.
- titulo: ¿Es correcto que log base 5 de x es igual a 3 implica que x=15?
  respuesta: 'No'
  solucion_pasos:
  - Implica que 5^3=x, es decir x=125, no 15.
errores_frecuentes:
- Confundir el argumento con la base.
- Intercambiar el rol de la base y el argumento al pasar de potencia a logaritmo.
- Aplicar la propiedad de cancelación con bases distintas en la potencia y en el logaritmo.
- Confundir el exponente resultado con el argumento del logaritmo.
- Olvidar verificar que la base sea válida antes de aplicar la equivalencia.
afirmaciones_verdaderas:
- $\log_b(a) = c \iff b^c = a$.
- La propiedad b elevado a (log base b de x) es igual a x se cumple para todo x positivo.
al_terminar_debes_poder: Convertir fluidamente entre expresiones exponenciales y logarítmicas.
fuente: Texto escolar MINEDUC.
estado: publicado
