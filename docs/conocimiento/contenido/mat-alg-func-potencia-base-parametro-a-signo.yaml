semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.PARAMETRO_A_SIGNO
resumen_inicial: 'Análisis del signo del coeficiente a en la orientación de la gráfica:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Definición y análisis
  de parámetros.'
explicacion_simple: Igual que en la función cuadrática, el signo del coeficiente principal
  determina si la curva se refleja respecto al eje $x$.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot x^n$ y $g(x)=x^n$, se cumple $f(x)=a\cdot g(x)$. Si $a<0$, entonces
  $f(x)=-|a|\cdot g(x)$, lo que invierte el signo de cada valor de $g(x)$: geométricamente,
  esto refleja la gráfica de $g$ respecto al eje $x$.


  ### Desarrollo didáctico


  Compara $f(x)=x^2$ con $g(x)=-x^2$: mientras $f$ toma solo valores mayores o iguales
  a $0$ (abre hacia arriba), $g$ toma solo valores menores o iguales a $0$ (abre hacia
  abajo), siendo su reflejo exacto respecto al eje $x$.'
definiciones_clave: '- **Análisis del signo del coeficiente a en la orientación de
  la gráfica**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis del signo del coeficiente a en la orientación de
  la gráfica.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis del signo del coeficiente a en la orientación de la gráfica.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis del signo del
    coeficiente a en la orientación de la gráfica.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
