semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.PARAMETRO_A_SIGNO
resumen_inicial: 'El signo del parámetro $a$ en la función potencia $f(x) = a x^n$ determina la orientación vertical de la gráfica y la reflexión respecto al eje $x$.'
explicacion_simple: |
  En una función potencia $f(x) = a x^n$, el signo del coeficiente $a$ funciona como un interruptor de orientación vertical. Si $a$ es positivo ($a > 0$), la gráfica conserva su posición natural (por ejemplo, una parábola que abre hacia arriba). Si $a$ es negativo ($a < 0$), la gráfica entera se da vuelta patas arriba, reflejándose verticalmente a través del eje horizontal $x$ (por ejemplo, una parábola que abre hacia abajo).
explicacion_formal: |
  ### Definición formal
  El **signo del coeficiente multiplicativo** $\operatorname{sgn}(a) \in \{-1, +1\}$ en la función potencia $f(x) = a x^n$ determina la orientación geométrica de sus ramas en el plano cartesiano mediante una transformación de reflexión axial:
  - **Caso $a > 0$ (Positivo)**: Conserva la orientación estándar del modelo $y = x^n$. Las ramas principales se dirigen hacia las ordenadas positivas ($y > 0$) en el primer cuadrante.
  - **Caso $a < 0$ (Negativo)**: Aplica una **reflexión vertical respecto al eje $x$**:
    $$f_{a<0}(x) = -|a| x^n = - ( |a| x^n )$$
    invirtiendo el signo de todas las ordenadas ($y \to -y$).

  ### Desglose por paridad del exponente $n$
  - Exponente $n$ par positivo:
    - $a > 0 \implies$ Gráfica con forma de "U" abriendo hacia **arriba** (cuadrantes I y II).
    - $a < 0 \implies$ Gráfica con forma de "U" invertida abriendo hacia **abajo** (cuadrantes III y IV).
  - Exponente $n$ impar positivo:
    - $a > 0 \implies$ Gráfica en forma de "S" que sube de izquierda a derecha (cuadrantes III a I).
    - $a < 0 \implies$ Gráfica en forma de "S" que baja de izquierda a derecha (cuadrantes II a IV).

  ### Síntesis didáctica
  Regla de los cuadrantes para exponente positivo:
  - $n$ par: $a > 0$ habita en cuadrantes I y II; $a < 0$ habita en cuadrantes III y IV.
  - $n$ impar: $a > 0$ habita en cuadrantes I y III; $a < 0$ habita en cuadrantes II y IV.
definiciones_clave: |
  - **Signo del parámetro $a$**: Propiedad del coeficiente que rige la dirección vertical de las ramas gráficas.
  - **Reflexión respecto al eje $x$**: Transformación isométrica producida por un cambio de signo positivo a negativo en $a$.
  - **Orientación de ramas**: Dirección de apertura o recorrido global de la curva hacia $+\infty$ o $-\infty$.
propiedades_relaciones: |
  - **Inversión del conjunto recorrido**: Para exponente $n$ par positivo, pasar de $a > 0$ a $a < 0$ invierte el recorrido desde $[0, +\infty[$ hacia $]-\infty, 0]$.
  - **Simetría por cambio de signo**: Las gráficas de $f(x) = a x^n$ y $g(x) = -a x^n$ son simétricas entre sí respecto al eje $x$.
ejemplo_guiado:
  enunciado: 'Compara la orientación gráfica y ubica los cuadrantes ocupados por las siguientes funciones potencia: A) $f(x) = 2x^2$ y $g(x) = -2x^2$, B) $h(x) = 3x^3$ y $p(x) = -3x^3$.'
  pasos:
    - 'Paso 1: Para $f(x) = 2x^2$, $n=2$ (par) y $a = 2 > 0$. Abre hacia arriba en los cuadrantes I y II.'
    - 'Paso 2: Para $g(x) = -2x^2$, $n=2$ (par) y $a = -2 < 0$. Es el reflejo de $f(x)$ respecto al eje $x$; abre hacia abajo en cuadrantes III y IV.'
    - 'Paso 3: Para $h(x) = 3x^3$, $n=3$ (impar) y $a = 3 > 0$. Es creciente, transitando desde el cuadrante III al cuadrante I.'
    - 'Paso 4: Para $p(x) = -3x^3$, $n=3$ (impar) y $a = -3 < 0$. Es decreciente, transitando desde el cuadrante II al cuadrante IV.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué efecto geométrico produce cambiar el signo del coeficiente de $a = 4$ a $a = -4$ en la función potencia $f(x) = a x^4$?'
    choices:
      - {text: 'Refleja la gráfica verticalmente respecto al eje $x$, haciendo que pase de abrir hacia arriba a abrir hacia abajo', is_correct: true}
      - {text: 'Refleja la gráfica horizontalmente respecto al eje $y$', is_correct: false}
      - {text: 'Desplaza la gráfica 4 unidades hacia la izquierda', is_correct: false}
      - {text: 'No produce ningún cambio en la gráfica', is_correct: false}
    explanation: 'La alternativa correcta es ''Refleja la gráfica verticalmente respecto al eje $x$, haciendo que pase de abrir hacia arriba a abrir hacia abajo''. Multiplicar por un signo negativo invierte el signo de todas las ordenadas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué cuadrantes del plano cartesiano se ubica la gráfica de la función potencia $f(x) = -5 x^3$?'
    choices:
      - {text: 'En los cuadrantes II y IV', is_correct: true}
      - {text: 'En los cuadrantes I y III', is_correct: false}
      - {text: 'En los cuadrantes I y II', is_correct: false}
      - {text: 'En los cuadrantes III y IV', is_correct: false}
    explanation: 'La alternativa correcta es ''En los cuadrantes II y IV''. Con exponente impar $n=3$ y coeficiente negativo $a=-5 < 0$, para $x>0$ da $y<0$ (cuadrante IV) y para $x<0$ da $y>0$ (cuadrante II).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el signo del parámetro $a$ en la función $f(x) = a x^n$.'
  - 'Paso 2: Observar si el exponente $n$ es par o impar.'
  - 'Paso 3: Si $a > 0$, mantener la orientación estándar (hacia $+y$).'
  - 'Paso 4: Si $a < 0$, aplicar una reflexión vertical sobre el eje $x$ invirtiendo la dirección de las ramas hacia $-y$.'
errores_correccion: |
  - **Error 1:** Creer que un coeficiente negativo en exponente impar la vuelve positiva. **Cómo corregirlo:** En exponente impar $(-x)^3 = -x^3$, y si $a < 0$, $(-a)(-x^3) = ax^3 > 0$ para $x < 0$. El parámetro $a < 0$ invierte la curva en todos los puntos respecto a $a > 0$.
  - **Error 2:** Confundir la reflexión respecto al eje $x$ (producida por el signo de $a$) con la reflexión respecto al eje $y$ (producida por cambios en $x$). **Cómo corregirlo:** El signo de $a$ afecta por fuera a las salidas de la función ($y$), invirtiendo la gráfica verticalmente a través del eje $x$.
ejemplos:
  - titulo: 'Orientación de parábola invertida'
    enunciado: '¿La función $f(x) = -3x^2$ abre hacia abajo?'
    alternativas:
      - 'Sí, porque $a = -3 < 0$'
      - 'No, abre hacia arriba'
      - 'Abre hacia la derecha'
    respuesta: 'Sí, porque $a = -3 < 0$'
    solucion_pasos:
      - '1. Exponente par $n = 2$ indica forma de U.'
      - '2. Coeficiente $a = -3 < 0$ invierte la U hacia abajo.'
  - titulo: 'Cuadrantes para exponente impar positivo'
    enunciado: '¿La función $g(x) = 4x^5$ ocupa los cuadrantes I y III?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con $a = 4 > 0$ y $n=5$ impar, para $x>0 \implies y>0$ (I) y para $x<0 \implies y<0$ (III).'
  - titulo: 'Reflexión exacta por signo opuesto'
    enunciado: '¿Las gráficas de $f(x) = 6x^4$ y $g(x) = -6x^4$ son el reflejo simétrico una de la otra respecto al eje $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al cambiar solo el signo de $a$, todas las alturas $y$ cambian de signo.'
  - titulo: 'Monotonía invertida en impares'
    enunciado: '¿La función $h(x) = -2x^3$ es decreciente en todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $a = -2 < 0$, la curva en S se invierte pasando a ser estrictamente decreciente.'
errores_frecuentes:
  - 'Un coeficiente $a < 0$ desplaza la gráfica de la función potencia hacia la izquierda en el eje $x$.'
  - 'La función potencia $f(x) = -x^2$ abre hacia arriba porque la potencia de un número negativo es positiva.'
  - 'El signo del parámetro $a$ no altera los cuadrantes ocupados por la gráfica de la función potencia.'
  - 'Una función potencia con $a < 0$ y exponente impar se ubica en los cuadrantes I y III.'
  - 'Cambiar el signo de $a$ equivale a girar la gráfica 90 grados en sentido horario.'
afirmaciones_verdaderas:
  - 'El signo del parámetro $a$ rige la orientación vertical de la función potencia: si $a > 0$ mantiene su orientación canónica, mientras que si $a < 0$ la gráfica se refleja verticalmente respecto al eje $x$.'
  - 'Para exponentes pares, $a > 0$ genera curvas que abren hacia arriba (cuadrantes I y II), mientras que $a < 0$ genera curvas que abren hacia abajo (cuadrantes III y IV).'
