semantic_id: MAT.GEO.ANGULOS_APLICACIONES.MANECILLA_HORARIA_AVANCE
resumen_inicial: La manecilla horaria de un reloj analógico avanza a una rapidez constante
  de 0,5° por cada minuto (30° por hora), moviéndose de forma continua entre cada
  número de la carátula.
explicacion_simple: '![Avance de la Manecilla Horaria](/static/img/nodos/avance-angular-de-la-manecilla-horaria-05-por-minuto-intro.svg)


  Entre dos números consecutivos del reloj (por ejemplo del 12 al 1) hay $30^\circ$
  ($360^\circ / 12 = 30^\circ$). Como la aguja pequeña (horario) tarda 60 minutos
  en recorrer ese espacio de $30^\circ$, avanza exactamente **medio grado ($0{,}5^\circ$)
  por cada minuto**.'
explicacion_formal: '### Definición formal

  La manecilla horaria de un reloj de esfera circular recorre una vuelta completa
  ($360^\circ$) en 12 horas ($720 \text{ minutos}$). Su **velocidad angular media
  constante** $\omega_h$ se determina mediante:


  $$\omega_h = \frac{360^\circ}{720 \text{ min}} = \frac{30^\circ}{60 \text{ min}}
  = 0{,}5^\circ/\text{min} = \frac{1}{2}^\circ/\text{min}$$


  $$\theta_h(H, M) = 30 \cdot H + 0{,}5 \cdot M \quad (H \text{ horas, } M \text{
  minutos})$$


  ### Desglose simbólico y geométrico

  - $\omega_h = 0{,}5^\circ/\text{min}$: Tasa angular del horario (avanza exactamente
  medio grado por cada minuto que transcurre).

  - $30^\circ/\text{hora}$: Ángulo subtendido entre dos números consecutivos de la
  esfera ($360^\circ / 12 = 30^\circ$).


  ### Síntesis didáctica

  Modelar el avance continuo del horario a $0{,}5^\circ$ por minuto es esencial para
  evitar el error clásico de asumir que la aguja horaria permanece inmóvil sobre el
  número de la hora.'
definiciones_clave: '- **Velocidad angular horaria ($v_h$)**: Rapidez constante de
  $0{,}5^\circ/\text{min}$ ($30^\circ/\text{h}$).

  - **Sector de 1 hora**: Ángulo central de $30^\circ$ entre dos marcas numéricas
  adyacentes.

  - **Posición horaria instantánea**: $\theta_h = 30^\circ \cdot H + \frac{M}{2}^\circ$. '
propiedades_relaciones: '- **Razón de velocidades**: El minutero se mueve 12 veces
  más rápido que la manecilla horaria ($\frac{v_m}{v_h} = \frac{6^\circ}{0{,}5^\circ}
  = 12$).

  - **Avance en media hora**: En 30 minutos, la aguja horaria avanza exactamente $30
  \times 0{,}5^\circ = 15^\circ$ (la mitad exacta entre dos números). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Avance del Horario](/static/img/nodos/avance-angular-de-la-manecilla-horaria-05-por-minuto-ejemplos.svg)


    ¿Qué ángulo respecto a las 12:00 marca la manecilla horaria a las 4:30?'
  pasos:
  - 'Paso 1: Identificar las horas enteras $H = 4$ y los minutos transcurridos $M
    = 30$.'
  - 'Paso 2: Calcular el ángulo debido a las 4 horas completas: $4 \times 30^\circ
    = 120^\circ$.'
  - 'Paso 3: Calcular el avance adicional debido a los 30 minutos: $30 \times 0{,}5^\circ
    = 15^\circ$.'
  - 'Paso 4: Sumar ambos desplazamientos: $\theta_h = 120^\circ + 15^\circ = 135^\circ$.'
  - 'Paso 5: Concluir que a las 4:30 la manecilla horaria se encuentra a $135^\circ$
    de las 12:00.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto avanza la manecilla horaria de un reloj en 1 minuto?
  choices:
  - text: Avanza exactamente 0,5° (medio grado)
    is_correct: true
  - text: Avanza 6°
    is_correct: false
  - text: Avanza 1°
    is_correct: false
  - text: No se mueve hasta que cambie de hora
    is_correct: false
  explanation: Por cálculo de velocidad angular (30° / 60 min), avanza exactamente
    0,5° (medio grado).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos grados avanza la aguja horaria en 20 minutos?
  choices:
  - text: 10° (porque 20 × 0,5° = 10°)
    is_correct: true
  - text: 20°
    is_correct: false
  - text: 5°
    is_correct: false
  - text: 120°
    is_correct: false
  explanation: Multiplicando 20 por 0,5° se obtiene 10° (porque 20 × 0,5° = 10°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la hora base $H$ y los minutos $M$.'
- 'Paso 2: Multiplicar la hora por $30^\circ$ ($30^\circ \cdot H$).'
- 'Paso 3: Multiplicar los minutos por $0{,}5^\circ$ ($0{,}5^\circ \cdot M$).'
- 'Paso 4: Sumar ambos valores para obtener la posición total respecto a las 12:00.'
errores_correccion: 'No olvides sumar el avance de los minutos: a las 4:30 el horario
  no está en el 4 (120°), sino a mitad de camino hacia el 5 (135°).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué ángulo respecto a las 12:00 tiene la manecilla horaria a las 6:00?
  alternativas:
  - $180^\circ$
  - $90^\circ$
  - $150^\circ$
  respuesta: $180^\circ$
  solucion_pasos:
  - $6 \times 30^\circ = 180^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Cuánto avanza el horario entre las 3:00 y las 3:50?
  alternativas:
  - $25^\circ$
  - $50^\circ$
  - $15^\circ$
  respuesta: $25^\circ$
  solucion_pasos:
  - En 50 minutos: $50 \times 0{,}5^\circ = 25^\circ$.
- titulo: ¿La aguja horaria avanza medio grado cada minuto?
  respuesta: Sí
  solucion_pasos:
  - Sí, $30^\circ / 60\text{ min} = 0{,}5^\circ/\text{min}$.
- titulo: ¿A las 5:30 la manecilla horaria apunta exactamente al número 5?
  respuesta: 'No'
  solucion_pasos:
  - No, ha avanzado $30 \times 0{,}5^\circ = 15^\circ$ más allá del 5 (justo en el
    medio entre el 5 y el 6).
errores_frecuentes:
- Asumir que la manecilla horaria permanece fija en el número de la hora.
- Confundir $0{,}5^\circ/\text{min}$ con $5^\circ/\text{min}$.
- Multiplicar las horas por 6 en lugar de 30.
- No considerar que el minutero se desplaza 12 veces más rápido.
- Olvidar que una vuelta completa del horario toma 12 horas y no 24 en un reloj convencional.
afirmaciones_verdaderas:
- La velocidad angular de la manecilla horaria es $0{,}5^\circ$ por minuto ($30^\circ$
  por hora).
- La posición angular del horario a las $H:M$ es $30^\circ H + 0{,}5^\circ M$.
al_terminar_debes_poder: '**QUÉ:** Determinar con precisión la posición y el desplazamiento
  angular de la manecilla horaria.


  **CÓMO:** Aplicando la fórmula $\theta_h = 30^\circ \cdot H + 0{,}5^\circ \cdot
  M$.


  ![Resumen de Manecilla Horaria](/static/img/nodos/avance-angular-de-la-manecilla-horaria-05-por-minuto-resumen.svg)'
