semantic_id: MAT.GEO.ANGULOS_APLICACIONES.MANECILLA_HORARIA_AVANCE
resumen_inicial: La manecilla minutera de un reloj gira a una velocidad angular constante
  de 6° por cada minuto, permitiendo calcular giros en función del tiempo.
explicacion_simple: 'Al trabajar con avance angular de la manecilla horaria: 0,5°
  por minuto, analizamos la relación entre aberturas angulares y cómo se aplican las
  reglas geométricas para encontrar valores desconocidos.'
explicacion_formal: 'En la teoría geométrica de avance angular de la manecilla horaria:
  0,5° por minuto, se aplican teoremas y relaciones algebraicas sobre rectas y vértices
  para estructurar demostraciones e igualdades angulares precisas.'
definiciones_clave: '- **Avance angular de la manecilla horaria: 0,5° por minuto**:
  Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en avance angular de la manecilla horaria: 0,5° por minuto se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: La aguja horaria de un reloj avanza a una velocidad constante de $0{,}5^\circ$
    por minuto. Calcula el ángulo recorrido por la aguja horaria en 40 minutos.
  pasos:
  - 'Paso 1: Identificar la tasa angular de la aguja horaria: $\omega = 0{,}5^\circ/\text{min}$.'
  - 'Paso 2: Multiplicar la tasa angular por el tiempo transcurrido: $\theta = 0{,}5^\circ
    \cdot 40$.'
  - 'Paso 3: Concluir que en 40 minutos la aguja horaria avanza $20^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es el principio geométrico central de avance angular de la manecilla
    horaria: 0,5° por minuto?'
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos grados avanza la aguja horaria en 40 minutos si gira a 0.5° por
    minuto?
  choices:
  - text: 20°
    is_correct: true
  - text: 40°
    is_correct: false
  - text: 240°
    is_correct: false
  - text: 10°
    is_correct: false
  explanation: La alternativa correcta es '20°', calculada como $0.5 \cdot 40 = 20^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en avance angular de la manecilla horaria:
  0,5° por minuto.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: 'Recuerda revisar siempre que los resultados en avance angular
  de la manecilla horaria: 0,5° por minuto sean coherentes y tengan sentido geométrico.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 97^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 83°
  - 97°
  - 90°
  respuesta: 83°
  solucion_pasos:
  - Despejando $x = 180 - 97 = 83^\circ$.
- titulo: Ejemplo 2
  enunciado: 'En avance angular de la manecilla horaria: 0,5° por minuto, si dos ángulos
    son suplementarios y uno mide 97°, ¿cuánto mide el otro?'
  alternativas:
  - 83°
  - 73°
  - 360°
  respuesta: 83°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 97 = 83^\circ$.
- titulo: '¿Se aplican ecuaciones algebraicas para calcular ángulos en avance angular
    de la manecilla horaria: 0,5° por minuto?'
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: '¿La suma de los ángulos suplementarios en avance angular de la manecilla
    horaria: 0,5° por minuto es igual a 90°?'
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: 'Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de avance angular de la manecilla horaria: 0,5°
  por minuto.'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
