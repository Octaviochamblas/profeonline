semantic_id: MAT.GEO.POLIGONOS_METRICA.DIAGONALES_TOTAL
resumen_inicial: El número total de diagonales de un polígono de n lados es D = n(n - 3) / 2.
explicacion_simple: |
  Si un polígono tiene $n$ esquinas (vértices) y sabemos que desde cada una de ellas salen $n - 3$ diagonales, parece tentador multiplicar simplemente $n \cdot (n - 3)$.

  Sin embargo, si calculamos así, estaremos contando cada diagonal dos veces: una vez desde la esquina de inicio y otra vez desde la esquina de llegada (la diagonal que va de $A$ a $C$ es exactamente la misma que va de $C$ a $A$). Para corregir este conteo doble, dividimos obligatoriamente por 2, obteniendo la fórmula universal: **$D = \frac{n(n - 3)}{2}$**.

  ![Cantidad total de diagonales de un polígono](/static/img/nodos/calculo-de-la-cantidad-total-de-diagonales-de-un-poligono-mediante-nn-3-2-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $\mathcal{P}$ un polígono simple convexo de $n$ vértices. El cardinal del conjunto total de diagonales $\mathcal{D}$, denotado por $D$, viene dado por la expresión combinatoria:
  $$D = \binom{n}{2} - n = \frac{n(n - 1)}{2} - n = \frac{n^2 - n - 2n}{2} = \frac{n(n - 3)}{2}$$

  ### Desglose simbólico
  - $n$: Número de lados o vértices del polígono ($n \geq 3$).
  - $\binom{n}{2} = \frac{n(n - 1)}{2}$: Total de pares no ordenados $\{V_i, V_j\}$ posibles entre los $n$ vértices (total de segmentos unibles).
  - $- n$: Resta de los $n$ pares consecutivos que representan los lados de la frontera poligonal.
  - Factor $\frac{1}{2}$: Corrección de simetría axial, ya que el segmento no dirigido $\overline{V_i V_j}$ coincide idénticamente con $\overline{V_j V_i}$.
  - Caso notable $n = 5$: $D = \frac{5(5-3)}{2} = \frac{10}{2} = 5$. El pentágono es el único polígono donde el número de lados es idéntico a su número total de diagonales ($n = D$).

  > **Complemento didáctico:** ¿Por qué se divide entre 2 en $D = \frac{n(n-3)}{2}$? Porque cada cuerda tiene dos extremos. Si multiplicas $n(n-3)$, estás contando cada diagonal una vez por cada punta. Al dividir por 2, dejas el conteo real y limpio.
definiciones_clave: |
  - **Total de diagonales ($D$)**: Cantidad de todos los segmentos diagonales distintos que pueden trazarse dentro de un polígono.
  - **Conteo combinatorio $\binom{n}{2}$**: Número de combinaciones de $n$ elementos tomados de a 2.
  - **Grado de un vértice respecto a diagonales**: Cantidad de diagonales que concurren en un vértice ($d_v = n - 3$).
propiedades_relaciones: |
  - **Tabla de valores canónicos**:
    - Triángulo ($n = 3$): $D = \frac{3(0)}{2} = 0$.
    - Cuadrilátero ($n = 4$): $D = \frac{4(1)}{2} = 2$.
    - Pentágono ($n = 5$): $D = \frac{5(2)}{2} = 5$.
    - Hexágono ($n = 6$): $D = \frac{6(3)}{2} = 9$.
    - Octágono ($n = 8$): $D = \frac{8(5)}{2} = 20$.
    - Decágono ($n = 10$): $D = \frac{10(7)}{2} = 35$.
    - Dodecágono ($n = 12$): $D = \frac{12(9)}{2} = 54$.
  - **Crecimiento cuadrático**: Al crecer $n$, $D$ crece con orden de magnitud $O(n^2)$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplos de total de diagonales](/static/img/nodos/calculo-de-la-cantidad-total-de-diagonales-de-un-poligono-mediante-nn-3-2-ejemplos.svg)

    Calcula la cantidad total de diagonales de un heptágono ($n = 7$) y de un decágono ($n = 10$).
  pasos:
    - 'Paso 1: Para el heptágono ($n = 7$): Calcular $n - 3 = 7 - 3 = 4$.'
    - 'Paso 2: Aplicar la fórmula: $D = \frac{7 \cdot 4}{2} = \frac{28}{2} = 14$ diagonales.'
    - 'Paso 3: Para el decágono ($n = 10$): Calcular $n - 3 = 10 - 3 = 7$.'
    - 'Paso 4: Aplicar la fórmula: $D = \frac{10 \cdot 7}{2} = \frac{70}{2} = 35$ diagonales.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuántas diagonales totales tiene un hexágono (polígono de 6 lados)?"
    choices:
      - text: "$9$ diagonales."
        is_correct: true
      - text: "$18$ diagonales."
