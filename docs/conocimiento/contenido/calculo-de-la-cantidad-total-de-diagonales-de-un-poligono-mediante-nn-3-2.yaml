        is_correct: false
    explanation: "La alternativa correcta es '$9$ diagonales.' Aplicando la fórmula $D = \\frac{n(n - 3)}{2}$ con $n = 6$: $D = \\frac{6(6 - 3)}{2} = \\frac{6 \\cdot 3}{2} = 9$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si un polígono tiene en total 20 diagonales, ¿cuántos lados tiene la figura?"
    choices:
      - text: "$8$ lados (un octágono)."
        is_correct: true
      - text: "$10$ lados (un decágono)."
        is_correct: false
      - text: "$6$ lados (un hexágono)."
        is_correct: false
      - text: "$5$ lados (un pentágono)."
        is_correct: false
    explanation: "La alternativa correcta es '$8$ lados (un octágono).' Planteando la ecuación: $\\frac{n(n - 3)}{2} = 20 \\implies n(n - 3) = 40$. Evaluando factores: $8 \\cdot (8 - 3) = 8 \\cdot 5 = 40$, luego $n = 8$."
    reinforcement_section: "Ejemplo guiado"
procedimiento: |
  1. Identificar el número de lados o vértices $n$ del polígono.
  2. Calcular el número de diagonales por vértice: $d_v = n - 3$.
  3. Multiplicar por el número de vértices: $n \cdot (n - 3)$.
  4. Dividir el producto entre 2 para descontar duplicados: $D = \frac{n(n - 3)}{2}$.
errores_correccion: |
  - **Error común 1:** Olvidar dividir por 2 y responder $n(n - 3)$. **Corrección:** Cada diagonal tiene dos extremos y se cuenta dos veces si no se divide entre 2.
  - **Error común 2:** Usar $n(n - 2) / 2$. **Corrección:** El término correcto es $n - 3$, ya que un vértice no puede trazar diagonales ni a sí mismo ni a sus dos adyacentes.
ejemplos:
  - tipo: "A"
    titulo: "Polígono con igual número de lados y diagonales"
    enunciado: "¿En cuál de los siguientes polígonos el número de lados es igual al total de diagonales?"
    alternativas:
      - text: "Pentágono ($n = 5$)."
        is_correct: true
      - text: "Cuadrilátero ($n = 4$)."
        is_correct: false
      - text: "Hexágono ($n = 6$)."
        is_correct: false
      - text: "Octágono ($n = 8$)."
        is_correct: false
    explicacion: "En el pentágono $n = 5$: $D = \\frac{5(5 - 3)}{2} = \\frac{5 \\cdot 2}{2} = 5$. Lados = Diagonales = 5."
  - tipo: "B"
    titulo: "Diagonales de un polígono de 20 lados"
    enunciado: "¿Un icoságono ($n = 20$) tiene más de 150 diagonales?"
    respuesta: "Sí"
    explicacion: "Sí. Para $n = 20$, $D = \\frac{20(17)}{2} = 10 \\cdot 17 = 170$ diagonales, lo cual es estrictamente mayor que 150."
errores_frecuentes:
  - 'Omitir la división por 2 y calcular el doble de diagonales ($n(n - 3)$).'
  - 'Confundir el total de diagonales $D = \\frac{n(n - 3)}{2}$ con las de un solo vértice $d_v = n - 3$.'
  - 'Cometer errores algebraicos al resolver la ecuación cuadrática $n^2 - 3n - 2D = 0$.'
afirmaciones_verdaderas:
  - 'El total de diagonales de un polígono de $n$ lados se obtiene mediante $D = \\frac{n(n - 3)}{2}$.'
  - 'El pentágono es el único polígono donde el número de lados coincide con el total de diagonales ($n = D = 5$).'
  - 'Un decágono ($n = 10$) posee exactamente $35$ diagonales en total.'
al_terminar_debes_poder: |
  **QUÉ:** Calcular y deducir la cantidad total de diagonales de cualquier polígono convexo y despejar el número de lados correspondiente.

  **CÓMO:** Empleando la fórmula combinatoria $D = \frac{n(n - 3)}{2}$ y resolviendo ecuaciones asociadas a pares no adyacentes de vértices.

  ![Síntesis de total de diagonales](/static/img/nodos/calculo-de-la-cantidad-total-de-diagonales-de-un-poligono-mediante-nn-3-2-resumen.svg)
