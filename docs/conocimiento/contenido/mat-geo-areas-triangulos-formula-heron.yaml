semantic_id: MAT.GEO.AREAS_TRIANGULOS.FORMULA_HERON
resumen_inicial: 'Fórmula de Herón: A = √(s(s−a)(s−b)(s−c)): conceptos, teoremas,
  propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: A veces no conoces la altura de un triángulo, solo sus tres lados.
  Para esos casos existe una fórmula especial, descubierta por el matemático griego
  Herón, que permite calcular el área sin necesitar la altura.
explicacion_formal: '![Fórmula de Herón](/static/img/geometria/areas-pitagoras/areas-triangulos-formula-heron.svg)


  ### Definición formal


  Dado un triángulo de lados $a$, $b$, $c$ y semiperímetro $s=\frac{a+b+c}{2}$, su
  área se calcula como

  $A=\sqrt{s(s-a)(s-b)(s-c)}$.


  ### Desarrollo didáctico


  Esta fórmula es especialmente útil cuando no se conoce la altura del triángulo,
  ya que solo requiere las

  tres longitudes de sus lados para obtener el área directamente.'
definiciones_clave: '- **Fórmula de Herón: A = √(s(s−a)(s−b)(s−c))**: Elemento o propiedad
  fundamental en el estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a fórmula de herón: a = √(s(s−a)(s−b)(s−c)).'
