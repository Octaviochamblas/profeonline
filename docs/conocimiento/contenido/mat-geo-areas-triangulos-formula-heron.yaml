procedimiento:
- 'Paso 1: Calcula el semiperímetro $s=\frac{a+b+c}{2}$.'
- 'Paso 2: Calcula las diferencias $s-a$, $s-b$ y $s-c$.'
- 'Paso 3: Multiplica $s$ por esas tres diferencias y calcula la raíz cuadrada del
  resultado.'
