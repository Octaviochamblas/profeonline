    a $\alpha = 166^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1005 = 166 \implies x = 166 - 1005$.'
  - 'Concluir que la medida calculada para fórmula de herón: a = √(s(s−a)(s−b)(s−c))
    es $x = -839^\circ$.'
