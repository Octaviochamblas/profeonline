semantic_id: MAT.GEO.HOMOTECIA.RAZON_LONGITUDES
resumen_inicial: 'Relación entre longitudes homólogas en una homotecia: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Consecuencia directa del paralelismo de segmentos homólogos es
  la relación exacta entre sus longitudes, determinada por la razón de homotecia.
explicacion_formal: '![Razón entre longitudes homólogas](/static/img/geometria/congruencia-semejanza/homotecia-razon-longitudes.svg)


  ### Definición formal


  Si $AB$ es un segmento y $A''B''$ su homólogo bajo una homotecia de razón $k$, entonces
  $\overline{A''B''}=|k|\times\overline{AB}$.


  ### Desarrollo didáctico


  Un segmento de 6 cm bajo una homotecia de razón $k=-2,5$ tiene su imagen con longitud
  $|-2,5|\times6=15$ cm; el signo negativo de $k$ afecta la posición (inversión),
  pero no la longitud, que siempre es un valor positivo.'
definiciones_clave: '- **Relación entre longitudes homólogas en una homotecia**: Elemento
  o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre longitudes homólogas en una
  homotecia.'
ejemplo_guiado:
  enunciado: En la aplicación de relación entre longitudes homólogas en una homotecia,
    se establece una razón $k = 2.8$ entre dos figuras homólogas de longitud original
    $L = 50\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
