semantic_id: MAT.FUND.DIAGRAMAS_VENN.DIAGRAMA_DOS_CONJUNTOS_DISJUNTOS
resumen_inicial: 'Estructura gráfica de un diagrama de Venn para dos conjuntos disjuntos ($A \cap B = \emptyset$), caracterizada por dos círculos separados que generan 3 regiones disjuntas.'
explicacion_simple: |
  Cuando dos conjuntos **no tienen ningún elemento en común** ($A \cap B = \emptyset$), su diagrama de Venn se dibuja con **dos círculos completamente separados** (que no se tocan ni se cruzan) dentro del rectángulo universal $\mathcal{U}$. Esta disposición divide al rectángulo en **$3$ regiones distintas**:
  1. **El interior del círculo $A$**: solo los elementos de $A$.
  2. **El interior del círculo $B$**: solo los elementos de $B$.
  3. **La región exterior**: los elementos de $\mathcal{U}$ que no están ni en $A$ ni en $B$ ($(A \cup B)^c$).
explicacion_formal: |
  ### Definición formal
  En la lógica gráfica de conjuntos, el **diagrama de Venn para dos conjuntos disjuntos** ($A \cap B = \emptyset$) es la configuración topológica donde las curvas cerradas simples de $A$ y $B$ no se intersectan:
  $$\partial A \cap \partial B = \emptyset \quad \land \quad A \cap B = \emptyset$$
  Esta geometría induce una partición del universo $\mathcal{U}$ en exactamente **$3$ regiones disjuntas**:
  1. $R_A = A \setminus B = A$.
  2. $R_B = B \setminus A = B$.
  3. $R_{\text{ext}} = (A \cup B)^c = \mathcal{U} \setminus (A \cup B)$.

  ### Desglose simbólico
  - Ausencia de región central: $A \cap B = \emptyset$ ($|A \cap B| = 0$).
  - Conservación de cardinalidad total:
    $$|\mathcal{U}| = |A| + |B| + |(A \cup B)^c|$$
  - Cardinalidad de la unión: $|A \cup B| = |A| + |B|$.

  ### Síntesis didáctica
  La separación espacial de los círculos expresa visualmente la incompatibilidad lógica y probabilística de dos categorías disjuntas.
definiciones_clave: |
  - **Diagrama de conjuntos disjuntos**: Representación gráfica con curvas cerradas no secantes que ilustra la exclusión mutua.
  - **Región exterior del diagrama ($(A \cup B)^c$)**: Espacio dentro del rectángulo que agrupa los objetos que no pertenecen a ninguno de los dos conjuntos.
  - **Partición en tres regiones**: División $\{A, B, (A \cup B)^c\}$ que recubre exhaustivamente a $\mathcal{U}$.
propiedades_relaciones: |
  - **Principio aditivo visual**: La unión $A \cup B$ es simplemente la agregación directa de las áreas de ambos círculos.
  - **Diferencias simétricas**: $A \bigtriangleup B = A \cup B$.
ejemplo_guiado:
  enunciado: 'En un curso de $30$ estudiantes ($\mathcal{U}$), $12$ practican solo natación ($N$) y $10$ practican solo atletismo ($A$). Si ningún estudiante practica ambos deportes a la vez ($N \cap A = \emptyset$), representa la situación en un diagrama de Venn y halla cuántos estudiantes no practican ninguno.'
  pasos:
    - 'Paso 1: Dibujar el rectángulo universal $\mathcal{U}$ y trazar dos círculos separados rotulados como $N$ y $A$.'
    - 'Paso 2: Colocar la cantidad de natación en el círculo $N$: $|N| = 12$.'
    - 'Paso 3: Colocar la cantidad de atletismo en el círculo $A$: $|A| = 10$.'
    - 'Paso 4: Calcular la cantidad total de estudiantes que practican algún deporte: $|N \cup A| = 12 + 10 = 22$.'
    - 'Paso 5: Calcular la cantidad de estudiantes en la región exterior: $|(N \cup A)^c| = 30 - 22 = 8$ estudiantes.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuántas regiones disjuntas divide al universo $\mathcal{U}$ un diagrama de Venn de dos conjuntos disjuntos?'
    choices:
      - {text: 'Exactamente $3$ regiones ($A$, $B$ y la región exterior $(A \cup B)^c$)', is_correct: true}
      - {text: '$4$ regiones con intersección central', is_correct: false}
      - {text: '$2$ regiones', is_correct: false}
      - {text: '$1$ sola región continua', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente $3$ regiones ($A$, $B$ y la región exterior $(A \cup B)^c$)''. Al no cruzarse los círculos, se generan 3 áreas disjuntas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $|\mathcal{U}| = 50$, $A$ y $B$ son disjuntos con $|A| = 15$ y $|B| = 20$, ¿cuántos elementos contiene la región exterior $(A \cup B)^c$?'
    choices:
      - {text: '$15$ elementos', is_correct: true}
      - {text: '$35$ elementos', is_correct: false}
      - {text: '$5$ elementos', is_correct: false}
      - {text: '$50$ elementos', is_correct: false}
    explanation: 'La alternativa correcta es ''$15$ elementos''. Se calcula como $50 - (15 + 20) = 50 - 35 = 15$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dibujar el rectángulo para el conjunto universal $\mathcal{U}$.'
  - 'Paso 2: Trazar dos círculos separados sin contacto físico, identificados como $A$ y $B$.'
  - 'Paso 3: Colocar los elementos de $A$ dentro del primer círculo.'
  - 'Paso 4: Colocar los elementos de $B$ dentro del segundo círculo.'
  - 'Paso 5: Colocar los elementos de $(A \cup B)^c$ en la región exterior dentro del rectángulo.'
errores_correccion: |
  - **Error 1:** Dibujar los círculos cruzados con una zona de intersección cuando los conjuntos son disjuntos. **Cómo corregirlo:** Si $A \cap B = \emptyset$, los círculos deben dibujarse estrictamente separados sin solapamiento alguno.
  - **Error 2:** Olvidar ubicar los elementos que no pertenecen ni a $A$ ni a $B$. **Cómo corregirlo:** Los elementos de $(A \cup B)^c$ deben anotarse explícitamente en el espacio exterior a los círculos dentro del rectángulo $\mathcal{U}$.
ejemplos:
  - titulo: 'Vocales y consonantes en alfabeto de 7 letras'
    enunciado: 'Si $\mathcal{U} = \{a, b, c, d, e, f, g\}$, $V = \{a, e\}$ y $C = \{b, c, d\}$, ¿qué elementos quedan en la región exterior?'
    alternativas:
      - '$\{f, g\}$'
      - '$\{a, e\}$'
      - '$\emptyset$'
    respuesta: '$\{f, g\}$'
    solucion_pasos:
      - '1. $V \cup C = \{a, b, c, d, e\}$.'
      - '2. Región exterior: $\mathcal{U} \setminus (V \cup C) = \{f, g\}$.'
  - titulo: 'Intersección vacía'
    enunciado: '¿Cuánto vale el área de solapamiento entre los círculos de conjuntos disjuntos?'
    respuesta: '$0$'
    solucion_pasos:
      - 'No existe región de solapamiento puesto que $A \cap B = \emptyset$.'
  - titulo: 'Cardinalidad del universo disjunto'
    enunciado: 'Si $|A| = 5$, $|B| = 8$ y la región exterior tiene $7$, ¿cuánto vale $|\mathcal{U}|$?'
    respuesta: '$20$'
    solucion_pasos:
      - '$|\mathcal{U}| = 5 + 8 + 7 = 20$.'
  - titulo: 'Representación probabilística'
    enunciado: '¿El diagrama de círculos separados representa eventos mutuamente excluyentes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la representación gráfica estándar de la incompatibilidad de eventos.'
errores_frecuentes:
  - 'La afirmación de que los círculos de conjuntos disjuntos deben dibujarse solapados colocando un cero en el centro.'
  - 'La afirmación de que el diagrama de dos conjuntos disjuntos genera cuatro regiones independientes.'
  - 'La afirmación de que la región exterior a los círculos no forma parte del conjunto universal.'
  - 'La afirmación de que la cardinalidad de la unión de conjuntos disjuntos requiere deducir elementos comunes.'
  - 'La afirmación de que dos conjuntos disjuntos pueden contener un elemento compartido si se agranda el rectángulo.'
afirmaciones_verdaderas:
  - 'El diagrama de Venn de dos conjuntos disjuntos se compone de dos curvas cerradas sin intersección que dividen a $\mathcal{U}$ en exactamente $3$ regiones disjuntas.'
  - 'En un diagrama de dos conjuntos disjuntos, la cardinalidad de $\mathcal{U}$ es la suma exacta de las tres regiones: $|\mathcal{U}| = |A| + |B| + |(A \cup B)^c|$.'
al_terminar_debes_poder: |
  QUÉ: Estructurar, dibujar e interpretar diagramas de Venn para dos conjuntos disjuntos.
  CÓMO: Dibujar círculos separados, distribuir datos en las 3 regiones ($A$, $B$, $(A \cup B)^c$) y aplicar el principio aditivo de cardinalidad.
