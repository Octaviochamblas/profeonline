semantic_id: MAT.GEO.POLIGONOS_METRICA.DIAGONALES_VERTICE
resumen_inicial: 'Cálculo de diagonales trazadas desde un solo vértice mediante n
  - 3: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Antes de calcular el total de diagonales de un polígono, es útil
  primero entender cuántas se pueden trazar desde un solo vértice.
explicacion_formal: '![Diagonales trazadas desde un vértice](/static/img/geometria/poligonos-cuadrilateros/poligonos-diagonales-vertice.svg)


  ### Definición formal


  Desde cualquier vértice de un polígono de $n$ lados, se pueden trazar diagonales
  hacia todos los demás vértices, excepto hacia sí mismo y hacia sus dos vértices
  adyacentes; esto da $n-3$ diagonales posibles.


  ### Desarrollo didáctico


  En un hexágono ($n=6$), desde un vértice se pueden trazar $6-3=3$ diagonales: hacia
  los 3 vértices que no son el propio vértice ni sus dos vecinos inmediatos.'
definiciones_clave: '- **Cálculo de diagonales trazadas desde un solo vértice mediante
