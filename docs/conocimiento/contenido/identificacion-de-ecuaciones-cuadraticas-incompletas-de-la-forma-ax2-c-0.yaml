procedimiento:
- 'Paso 1: Escribe la ecuación en su forma general $ax^2+bx+c=0$.'
- 'Paso 2: Verifica que el coeficiente lineal $b$ sea igual a cero.'
- 'Paso 3: Verifica que tanto $a$ como $c$ sean distintos de cero; de ser así, es
  incompleta pura.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en identificación de ecuaciones cuadráticas incompletas de la forma ax² + c = 0.
ejemplos:
- titulo: Reconocimiento de ecuación incompleta pura
  enunciado: ¿Es $4x^2-25=0$ una ecuación incompleta pura?
  solucion_pasos:
  - $a=4$, $b=0$, $c=-25$.
  - Sí, es incompleta pura.
- titulo: Reconocimiento de ecuación que no es pura
  enunciado: ¿Es $x^2+7x=0$ una ecuación incompleta pura?
  solucion_pasos:
  - $a=1$, $b=7$, $c=0$.
  - No es pura, porque el término independiente está ausente, no el lineal.
- titulo: ¿Toda ecuación incompleta pura tiene soluciones reales?
  enunciado: ¿Toda ecuación incompleta pura tiene soluciones reales?
  respuesta: 'No'
  solucion_pasos:
  - Si al despejar $x^2=-c/a$ el resultado es negativo, no existen soluciones reales.
- titulo: ¿Las soluciones de una ecuación incompleta pura son siempre opuestas entre
    sí?
  enunciado: ¿Las soluciones de una ecuación incompleta pura son siempre opuestas
    entre sí?
  respuesta: Sí
  solucion_pasos:
  - Al despejar $x=\pm\sqrt{-c/a}$, cuando existen soluciones reales, estas son siempre
    un par de números opuestos.
errores_frecuentes:
- Confundir la ecuación incompleta pura (falta $b$) con la incompleta binomia (falta
  $c$).
- Olvidar el signo $\pm$ al despejar la raíz cuadrada, perdiendo una de las dos soluciones.
- No verificar si el valor bajo la raíz es negativo, lo que indicaría ausencia de
  soluciones reales.
- Aplicar factorización por término común cuando en realidad no hay término lineal
  que factorizar.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando identificación
  de ecuaciones cuadráticas incompletas de la forma ax² + c = 0.
