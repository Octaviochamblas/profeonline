semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_PURA
resumen_inicial: Una ecuación incompleta pura de la forma $ax^2 + c = 0$ carece de término lineal ($b = 0$) y sus soluciones son números opuestos $\pm \sqrt{-c/a}$.
explicacion_simple: |
  Una **ecuación cuadrática incompleta pura** es aquella donde **falta el término lineal con $x$** ($b = 0$):

  $$ax^2 + c = 0 \quad \text{con } a \neq 0 \text{ y } c \neq 0$$

  - **Ejemplo**: $2x^2 - 18 = 0$.
  - Como no hay término con $x$, se puede **despejar directamente $x^2$**:
    $$2x^2 = 18 \implies x^2 = 9$$
  - Al extraer raíz cuadrada a ambos lados, se obtienen **dos soluciones simétricas (opuestas en signo)**:
    $$x = \pm \sqrt{9} \implies x_1 = 3 \quad \text{y} \quad x_2 = -3$$
explicacion_formal: |
  Dada la ecuación cuadrática general $ax^2 + bx + c = 0$, se clasifica como **incompleta pura** cuando el coeficiente lineal es nulo pero el término independiente es no nulo:

  $$a \neq 0, \ b = 0, \ c \neq 0 \implies ax^2 + c = 0$$

  **Análisis del conjunto solución en $\mathbb{R}$:**
  Al despejar $x^2 = -\frac{c}{a}$:
  - Si $-\frac{c}{a} > 0$ (es decir, $a$ y $c$ tienen signos opuestos), existen dos soluciones reales simétricas opuestas: $S = \left\{+\sqrt{-\frac{c}{a}}, -\sqrt{-\frac{c}{a}}\right\}$.
  - Si $-\frac{c}{a} < 0$ (es decir, $a$ y $c$ tienen el mismo signo), no existen soluciones en los números reales $\mathbb{R}$ (las raíces son números imaginarios).
definiciones_clave: |
  - **Ecuación cuadrática incompleta pura**: Ecuación de segundo grado donde el coeficiente lineal es cero ($b = 0$) y el término independiente es distinto de cero ($c \neq 0$).
propiedades_relaciones: |
  - **Simetría de soluciones**: Cuando existen soluciones reales en una ecuación incompleta pura, estas son siempre números reales opuestos de igual módulo ($x_1 = -x_2 \implies x_1 + x_2 = 0$).
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación incompleta pura $3x^2 - 48 = 0$ e interpreta sus coeficientes.'
  pasos:
    - 'Paso 1: Identificar los coeficientes: $a = 3$, $b = 0$, $c = -48$. Como $b = 0$, es incompleta pura.'
    - 'Paso 2: Despejar el término cuadrático: $3x^2 = 48 \implies x^2 = \frac{48}{3} = 16$.'
    - 'Paso 3: Extraer raíz cuadrada considerando ambos signos: $x = \pm \sqrt{16}$.'
    - 'Paso 4: Escribir las soluciones opuestas: $x_1 = 4$ y $x_2 = -4$. Conjunto solución $S = \{-4, 4\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad presentan las soluciones reales de cualquier ecuación cuadrática incompleta pura $ax^2 + c = 0$?'
    choices:
      - {text: 'Son dos números reales opuestos de igual valor absoluto ($x = \pm k$).', is_correct: true}
      - {text: 'Una de las soluciones es siempre el número cero.', is_correct: false}
      - {text: 'Son dos números positivos distintos.', is_correct: false}
      - {text: 'Ambas soluciones valen siempre 1.', is_correct: false}
    explanation: 'La alternativa correcta es ''Son dos números reales opuestos de igual valor absoluto ($x = \pm k$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el conjunto solución de la ecuación incompleta pura $x^2 + 25 = 0$ en el conjunto de los números reales $\mathbb{R}$?'
    choices:
      - {text: 'El conjunto vacío $\emptyset$ (no tiene soluciones reales).', is_correct: true}
      - {text: 'El conjunto $S = \{-5, 5\}$.', is_correct: false}
      - {text: 'El conjunto $S = \{5\}$.', is_correct: false}
      - {text: 'El conjunto $S = \{0\}$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto vacío $\emptyset$ (no tiene soluciones reales).''. Al despejar $x^2 = -25$, no existe ningún número real cuyo cuadrado sea negativo.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Transponer el término independiente al miembro derecho: $ax^2 = -c$.'
  - 'Paso 2: Dividir ambos lados entre el coeficiente cuadrático $a$: $x^2 = -\frac{c}{a}$.'
  - 'Paso 3: Verificar el signo de la constante $-\frac{c}{a}$.'
  - 'Paso 4: Si es positivo, extraer raíz cuadrada y escribir $x = \pm \sqrt{-\frac{c}{a}}$; si es negativo, declarar que no posee soluciones reales.'
errores_correccion: |
  - **Error común:** Olvidar el doble signo $\pm$ al extraer la raíz cuadrada (decir solo $x = 3$ en vez de $x = \pm 3$).
  - **Cómo corregirlo:** La ecuación cuadrática $x^2 = k$ tiene **DOS SOLUCIONES**: la raíz positiva $+\sqrt{k}$ y la raíz negativa $-\sqrt{k}$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Resolución de ecuación pura.
    alternativas:
      - '$S = \{-3, 3\}$'
      - '$S = \{3\}$'
      - '$S = \{9\}$'
    respuesta: '$S = \{-3, 3\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Ecuación sin solución en los reales.
    alternativas:
      - '$\emptyset$'
      - '$S = \{-2, 2\}$'
      - '$S = \{0\}$'
    respuesta: '$\emptyset$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Al extraer la raíz cuadrada en la ecuación $x^2 = 25$, la única solución válida en álgebra es el número positivo $x = 5$.'
  - 'La ecuación incompleta pura $x^2 + 16 = 0$ posee como soluciones reales a los números $x_1 = 4$ y $x_2 = -4$.'
  - 'Una ecuación cuadrática incompleta pura carece del coeficiente cuadrático $a$.'
  - 'Las soluciones de una ecuación incompleta pura de la forma $ax^2 + c = 0$ suman siempre un resultado mayor que cero.'
  - 'En una ecuación incompleta pura, el coeficiente lineal $b$ debe ser un número negativo distinto de cero.'
afirmaciones_verdaderas:
  - 'Una ecuación cuadrática incompleta pura tiene la forma $ax^2 + c = 0$ con $b = 0$, y cuando admite soluciones en $\mathbb{R}$, estas son simétricas y opuestas ($x = \pm \sqrt{-c/a}$).'
  - 'Si los coeficientes $a$ y $c$ tienen el mismo signo, la ecuación incompleta pura $ax^2 + c = 0$ no posee soluciones en los números reales.'
al_terminar_debes_poder: |
  QUÉ: Identificar y resolver ecuaciones cuadráticas incompletas puras de la forma $ax^2 + c = 0$.
  CÓMO: Comprobar que $b = 0$, despejar $x^2 = -c/a$, verificar el signo de la constante y extraer la raíz cuadrada con doble signo $\pm$.
