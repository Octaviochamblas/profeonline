semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_PURA
resumen_inicial: Una ecuación cuadrática incompleta de la forma $ax^2 + c = 0$ (pura) se caracteriza por la ausencia del término lineal ($b = 0$), resolviéndose por despeje directo $x^2 = -c/a$ y produciendo dos soluciones simétricas opuestas si $-c/a > 0$.
explicacion_simple: "![Una ecuación cuadrática incompleta de la forma $ax^2 + c = 0$ (pura) se caracteriza por la ausencia del término lineal ($b = 0$), resolviéndose por despeje directo $x^2 = -c/a$ y produciendo dos soluciones simétricas opuestas si $-c/a > 0$](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-incompletas-de-la-forma-ax2-c-0-intro.svg)\n\n\nUna ecuación cuadrática es **incompleta pura** cuando no tiene término con $x$ (**$b = 0$**), teniendo solo el término al cuadrado y el número suelto:\n$$ax^2 + c = 0$$\n\n**¿Cómo se resuelve de forma directa?**\n1. Despejas $x^2$ pasando el número al otro lado y dividiendo: **$x^2 = -\\frac{c}{a}$**.\n2. Sacas raíz cuadrada a ambos lados recordando poner el **signo doble $\\pm$**:\n   $$x = \\pm \\sqrt{-\\frac{c}{a}}$$\n- Si el número es **positivo** $\\implies$ obtienes dos soluciones gemelas opuestas (como $+3$ y $-3$).\n- Si el número es **negativo** $\\implies$ la ecuación **no tiene solución real** (porque ningún número\
  \ real al cuadrado da negativo)."
explicacion_formal: "Una ecuación cuadrática $P(x) = 0$ es **incompleta pura** si y solo si su coeficiente lineal es nulo y su término independiente es no nulo:\n$$ax^2 + c = 0 \\quad \\text{con } a \\neq 0, \\; b = 0, \\; c \\neq 0$$\n\n**Resolución analítica por despeje de potencia cuadrática**:\n$$ax^2 = -c \\Longleftrightarrow x^2 = -\\frac{c}{a}$$\n\n**Discusión del conjunto solución en $\\mathbb{R}$ según el signo de $-\\frac{c}{a}$**:\n1. **Si $-\\frac{c}{a} > 0$** ($a$ y $c$ de signos contrarios, $ac < 0$):\n   $$\\mathcal{S} = \\left\\{ -\\sqrt{-\\frac{c}{a}}, \\; +\\sqrt{-\\frac{c}{a}} \\right\\} \\quad (\\text{Dos soluciones reales simétricas opuestas})$$\n2. **Si $-\\frac{c}{a} < 0$** ($a$ y $c$ del mismo signo, $ac > 0$):\n   $$\\mathcal{S} = \\emptyset \\quad (\\text{Sin soluciones reales; dos soluciones imaginarias puras } \\pm i\\sqrt{c/a})$$"
definiciones_clave: '- **Ecuación incompleta pura**: Ecuación cuadrática donde $b = 0$ y $c \neq 0$.

  - **Soluciones simétricas opuestas**: Par de raíces reales que satisfacen $x_1 = -x_2$, con suma $x_1 + x_2 = 0$.'
propiedades_relaciones: '- **Eje de simetría en el eje Y**: Al ser $b = 0$, el vértice de la parábola está siempre sobre el eje vertical en el punto $(0, c)$.

  - **Diferencia de cuadrados**: Si $-c/a > 0$, la ecuación también se puede resolver factorizando como diferencia de cuadrados $(x - k)(x + k) = 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una ecuación cuadrática incompleta de la forma $ax^2 + c = 0$ (pura) se caracteriza por la ausencia del término lineal ($b = 0$), resolviéndose por despeje directo $x^2 = -c/a$ y produciendo dos soluciones simétricas opuestas si $-c/a > 0$](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-incompletas-de-la-forma-ax2-c-0-ejemplos.svg)



    Resuelve las siguientes dos ecuaciones cuadráticas puras en el conjunto de los números reales $\mathbb{R}$:

    1) $3x^2 - 48 = 0$

    2) $2x^2 + 18 = 0$'
  pasos:
  - 'Paso 1: Para $3x^2 - 48 = 0$:

    - Despejar $x^2$: $3x^2 = 48 \implies x^2 = \frac{48}{3} = 16$.

    - Aplicar raíz cuadrada con doble signo: $x = \pm \sqrt{16} = \pm 4$.

    - Conjunto solución real: $\mathcal{S} = \{-4, 4\}$.'
  - 'Paso 2: Para $2x^2 + 18 = 0$:

    - Despejar $x^2$: $2x^2 = -18 \implies x^2 = \frac{-18}{2} = -9$.

    - Analizar el radicando: $-9 < 0$; no existe ningún número real cuyo cuadrado sea negativo.

    - Concluir que no tiene solución en los números reales: $\mathcal{S} = \emptyset$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las soluciones reales de la ecuación $x^2 - 25 = 0$?
  choices:
  - text: x = 5 y x = -5
    is_correct: true
  - text: Solo x = 5
    is_correct: false
  - text: x = 0 y x = 25
    is_correct: false
  - text: No tiene solucion real.
    is_correct: false
  explanation: La alternativa correcta es 'x = 5 y x = -5'. $x^2 = 25 \implies x = \pm \sqrt{25} = \pm 5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con las soluciones en $\mathbb{R}$ de la ecuación $x^2 + 36 = 0$?
  choices:
  - text: No tiene soluciones reales porque x^2 = -36 no es posible en R.
    is_correct: true
  - text: Tiene como soluciones x = 6 y x = -6.
    is_correct: false
  - text: Tiene solucion unica x = 0.
    is_correct: false
  - text: Tiene solucion x = -36.
    is_correct: false
  explanation: La alternativa correcta es 'No tiene soluciones reales porque x^2 = -36 no es posible en R.'. El cuadrado de un número real es siempre no negativo.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Transponer el término independiente al miembro derecho de la ecuación ($ax^2 = -c$).'
- 'Paso 2: Dividir ambos lados entre el coeficiente cuadrático $a$ para aislar $x^2 = -\frac{c}{a}$.'
- 'Paso 3: Analizar el signo del valor resultante $-\frac{c}{a}$.'
- 'Paso 4: Si es positivo o cero, aplicar raíz cuadrada considerando ambas ramas $x = \pm \sqrt{-\frac{c}{a}}$.'
- 'Paso 5: Si es estrictamente negativo, declarar que la ecuación no posee soluciones en $\mathbb{R}$.'
errores_correccion: '- **Error común:** Olvidar el signo $\pm$ y escribir solo la raíz positiva ($x^2 = 9 \implies x = 3$).

  - **Cómo corregirlo:** Recuerda que tanto $(+3)^2 = 9$ como $(-3)^2 = 9$, por lo que **siempre debes escribir $x = \pm 3$**.'
ejemplos:
- titulo: 'Ejemplo 1: Cuadrado perfecto entero'
  enunciado: Resuelve $4x^2 - 64 = 0$.
  alternativas:
  - x = 4 y x = -4
  - Solo x = 4
  - x = 16 y x = -16
  - x = 0 y x = 4
  respuesta: x = 4 y x = -4
  solucion_pasos:
  - 'Paso 1: $4x^2 = 64 \implies x^2 = 16 \implies x = \pm 4$.'
- titulo: 'Ejemplo 2: Raíz inexacta irracional'
  enunciado: Resuelve $x^2 - 7 = 0$.
  alternativas:
  - x = sqrt(7) y x = -sqrt(7)
  - x = 7 y x = -7
  - x = 3.5 y x = -3.5
  - No tiene solución
  respuesta: x = sqrt(7) y x = -sqrt(7)
  solucion_pasos:
  - 'Paso 1: $x^2 = 7 \implies x = \pm \sqrt{7}$.'
- titulo: 'Ejemplo 3: Ecuación sin solución real'
  enunciado: ¿Tiene solución en $\mathbb{R}$ la ecuación $5x^2 + 45 = 0$?
  alternativas:
  - No, porque x^2 = -9 no tiene raíz real
  - Sí, x = 3 y x = -3
  - Sí, x = 9 y x = -9
  - Solo x = 0
  respuesta: No, porque x^2 = -9 no tiene raíz real
  solucion_pasos:
  - 'Paso 1: $5x^2 = -45 \implies x^2 = -9 < 0$, sin solución en $\mathbb{R}$.'
- titulo: 'Ejemplo 4: Fracción en término cuadrático'
  enunciado: Resuelve $\frac{x^2}{3} - 12 = 0$.
  alternativas:
  - x = 6 y x = -6
  - x = 4 y x = -4
  - x = 36
  - Solo x = 6
  respuesta: x = 6 y x = -6
  solucion_pasos:
  - 'Paso 1: $\frac{x^2}{3} = 12 \implies x^2 = 36 \implies x = \pm 6$.'
errores_frecuentes:
- Omitir la solución negativa al extraer raíz cuadrada.
- Intentar calcular raíces cuadradas de números negativos dentro de los reales.
- Confundir la incompleta pura (b = 0) con la binomia (c = 0).
afirmaciones_verdaderas:
- Una ecuación cuadrática pura ax² + c = 0 tiene dos soluciones reales simétricas opuestas si -c/a > 0.
- Si a y c tienen el mismo signo, la ecuación ax² + c = 0 no posee soluciones en el conjunto de los números reales.
al_terminar_debes_poder: '**QUÉ:** Identificar y resolver ecuaciones cuadráticas incompletas puras de la forma ax² + c = 0.


  **CÓMO:** Despejando x² = -c/a y extrayendo la raíz cuadrada de doble signo x = ±√(-c/a) en los reales.


