semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_PURA
resumen_inicial: Una ecuación cuadrática es incompleta pura de la forma $a x^2 + c
  = 0$ cuando su coeficiente lineal es cero ($b = 0$).
explicacion_simple: 'Una **ecuación cuadrática incompleta pura** carece de término
  lineal con $x$ ($b = 0$):

  - Tiene la estructura $a x^2 + c = 0$.

  - Ejemplo: $2x^2 - 18 = 0$ (donde $a = 2$, $b = 0$ y $c = -18$).

  - Se puede resolver de forma inmediata despejando directamente la potencia $x^2$
  y aplicando raíz cuadrada.'
explicacion_formal: 'La **ecuación cuadrática incompleta de la forma $a x^2 + c =
  0$** es el caso simétrico con coeficiente lineal nulo:


  $$a x^2 + c = 0 \quad \text{con } a \neq 0, \quad b = 0 \quad \land \quad c \neq
  0$$


  **Desglose de la fórmula:**

  - Despeje directo de la incógnita: $x^2 = -\frac{c}{a} \implies x = \pm \sqrt{-\frac{c}{a}}$.'
definiciones_clave: '- **Incompleta pura ($a x^2 + c = 0$)**: Ecuación de dos términos
  con $b = 0$ constituida únicamente por el término cuadrático y el independiente.'
propiedades_relaciones: '- **Soluciones simétricas / opuestas**: Si $a$ y $c$ tienen
  signos opuestos ($-\frac{c}{a} > 0$), las soluciones son dos números reales simétricos
  $x = \pm k$.'
ejemplo_guiado:
  enunciado: Identifica los coeficientes y clasifica la ecuación cuadrática $5x^2
    = 45$.
  pasos:
  - 'Paso 1: Trasponer el 45 al lado izquierdo: $5x^2 - 45 = 0$.Paso 2: Extraer coeficientes:
    $a = 5$, $b = 0$ y $c = -45$.Paso 3: Notar la ausencia del término lineal con
    $x$ ($b = 0$).Paso 4: Concluir que es una ECUACIÓN INCOMPLETA PURA de la forma
    $a x^2 + c = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reordenar $5x^2 = 45$ como $5x^2 - 45 = 0$, ¿cuál es su clasificación?
  choices:
  - text: Incompleta pura de la forma $a x^2 + c = 0$, con $b = 0$.
    is_correct: true
  - text: Incompleta binomia de la forma $a x^2 + b x = 0$.
    is_correct: false
  - text: Completa.
    is_correct: false
  - text: Monomia.
    is_correct: false
  explanation: La alternativa correcta es 'Incompleta pura de la forma $a x^2 + c
    = 0$, con $b = 0$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación existe entre las dos raíces de una ecuación incompleta pura
    $a x^2 + c = 0$ que admite soluciones reales?
  choices:
  - text: Son números reales opuestos o simétricos ($x_1 = k$ y $x_2 = -k$).
    is_correct: true
  - text: Una raíz siempre es cero.
    is_correct: false
  - text: Son números iguales del mismo signo.
    is_correct: false
  - text: No guardan relación entre sí.
    is_correct: false
  explanation: La alternativa correcta es 'Son números reales opuestos o simétricos
    ($x_1 = k$ y $x_2 = -k$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trasponer términos para igualar a cero.'
- 'Paso 2: Verificar la ausencia del término de primer grado con la variable $x$ ($b
  = 0$).'
- 'Paso 3: Comprobar que $a \neq 0$ y $c \neq 0$.'
- 'Paso 4: Clasificar como incompleta pura de la forma $a x^2 + c = 0$.'
errores_correccion: '- **Error común:** Olvidar el signo doble $\pm$ al extraer la
  raíz cuadrada en $x^2 = k$.

  - **Cómo corregirlo:** Recordar que $x^2 = 9$ produce dos soluciones reales: $x
  = +3$ y $x = -3$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
