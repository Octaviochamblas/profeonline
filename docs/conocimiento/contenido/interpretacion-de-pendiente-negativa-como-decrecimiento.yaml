semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NEGATIVA
resumen_inicial: Una pendiente estrictamente negativa ($m < 0$) indica que la función
  es estrictamente decreciente (al aumentar $x$, disminuye $y$).
explicacion_simple: 'Cuando la pendiente de una recta es un número negativo ($m <
  0$):

  - Si miramos la recta de izquierda a derecha, la gráfica **VA BAJANDO** hacia la
  derecha.

  - Esto significa que la función es **decreciente**: a medida que aumenta la entrada
  $x$, la salida $y$ se vuelve más pequeña.'
explicacion_formal: 'Dada la función $f(x) = m x + b$ con $m < 0$:


  $$m < 0 \iff \forall x_1 < x_2 \implies f(x_1) > f(x_2)$$


  **Desglose de la fórmula:**

  - Definición formal de función estrictamente decreciente en $\mathbb{R}$.'
definiciones_clave: '- **Pendiente negativa ($m < 0$)**: Tasa de variación negativa
  que determina una disminución de $y$ ante incrementos en $x$.'
propiedades_relaciones: '- **Ángulo obtuso**: El ángulo de inclinación $\theta$ pertenece
  al segundo cuadrante ($90^\circ < \theta < 180^\circ$).'
ejemplo_guiado:
  enunciado: Dada la función $f(x) = -2x$, demuestra su comportamiento decreciente
    comparando las evaluaciones para $x_1 = 1$ y $x_2 = 4$.
  pasos:
  - 'Paso 1: Identificar la pendiente: $m = -2 < 0$ (negativa).Paso 2: Evaluar $x_1
    = 1$: $f(1) = -2(1) = -2$.Paso 3: Evaluar $x_2 = 4$: $f(4) = -2(4) = -8$.Paso
    4: Comprobar que como $1 < 4$, la relación se invierte: $f(1) > f(4)$ (puesto
    que $-2 > -8$).Paso 5: Concluir que la pendiente negativa confirma que la función
    es decreciente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué comportamiento tiene la gráfica de una función lineal cuando su pendiente
    es negativa ($m < 0$)?
  choices:
  - text: Es estrictamente decreciente (baja de izquierda a derecha).
    is_correct: true
  - text: Es estrictamente creciente (sube de izquierda a derecha).
    is_correct: false
  - text: Es una línea recta horizontal.
    is_correct: false
  - text: Es una parábola hacia abajo.
    is_correct: false
  explanation: La alternativa correcta es 'Es estrictamente decreciente (baja de izquierda
    a derecha).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comparar $-2$ y $-8$ en la evaluación de $f(x) = -2x$, ¿cuál es la
    relación de orden correcta entre las imágenes?
  choices:
  - text: $f(1) > f(4)$ puesto que $-2 > -8$.
    is_correct: true
  - text: $f(1) < f(4)$ puesto que $-2 < -8$.
    is_correct: false
  - text: $f(1) = f(4)$.
    is_correct: false
  - text: No se pueden comparar.
    is_correct: false
  explanation: La alternativa correcta es '$f(1) > f(4)$ puesto que $-2 > -8$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar que la pendiente $m$ tiene signo negativo.'
- 'Paso 2: Declarar que la función es estrictamente decreciente.'
- 'Paso 3: Trazar o verificar la inclinación descendente hacia la derecha en el plano.'
errores_correccion: '- **Error común:** Creer que una función decreciente no puede
  tener imágenes positivas.

  - **Cómo corregirlo:** La función decreciente baja continuamente, por lo que pasa
  de imágenes positivas a negativas a medida que $x$ avanza a la derecha.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
fuente: Texto escolar MINEDUC — Álgebra / Función Constante y Función Lineal
