semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NEGATIVA
resumen_inicial: La pendiente negativa $m < 0$ indica que la función es decreciente y su gráfica desciende al avanzar de izquierda a derecha.
explicacion_simple: |
  Una **pendiente negativa** ($m < 0$) significa que la recta va **hacia abajo**:

  - A medida que te mueves a la derecha (aumentas $x$), el valor de $y$ **disminuye**.
  - Si caminas sobre la recta de izquierda a derecha, vas cuesta abajo.
  - En un problema real, representa una pérdida, consumo o disminución (como un vaciado de agua o depreciación).
explicacion_formal: |
  Sea la recta $f(x) = mx + b$ con $m < 0$. Para dos valores de entrada cualesquiera $x_1, x_2 \in \text{Dom}(f)$:

  $$x_1 < x_2 \implies f(x_1) > f(x_2)$$

  lo que constituye la definición formal de una función **estrictamente decreciente**.

  **Interpretación de la tasa:**
  - $\Delta x > 0 \implies \Delta y = m \cdot \Delta x < 0$.
definiciones_clave: |
  - **Pendiente negativa ($m < 0$)**: Tasa de variación negativa que modela decrementos constantes en la variable dependiente.
propiedades_relaciones: |
  - **Ángulo obtuso**: La recta forma un ángulo obtuso $\alpha \in ]90^\circ, 180^\circ[$ con el semi-eje positivo $X$.
ejemplo_guiado:
  enunciado: "El volumen de agua en un estanque que se vacía viene dado por $V(t) = 500 - 25t$, donde $t$ son los minutos. Interpreta el valor de la pendiente $m = -25$."
  pasos:
    - 'Paso 1: Identificar la pendiente: $m = -25$.'
    - 'Paso 2: Observar el signo negativo: $m = -25 < 0 \implies$ la función es decreciente.'
    - 'Paso 3: Interpretar la tasa: por cada minuto que transcurre ($\Delta t = +1$), el estanque pierde $25$ litros ($\Delta V = -25$).'
    - 'Paso 4: Concluir que el volumen disminuye a razón constante de $25$ litros por minuto.'
checkpoints:
  - placement: after_explicacion_formal
    question: "En el modelo de vaciado $V(t) = 500 - 25t$, ¿qué significa que la pendiente sea $m = -25$?"
    choices:
      - {text: "Que el estanque pierde 25 litros por cada minuto que transcurre", is_correct: true}
      - {text: "Que el estanque gana 25 litros cada minuto", is_correct: false}
      - {text: "Que el estanque se vacía en 25 minutos en total", is_correct: false}
      - {text: "Que la capacidad total del estanque es 25 litros", is_correct: false}
    explanation: "La alternativa correcta es 'Que el estanque pierde 25 litros por cada minuto que transcurre'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Cómo se comporta visualmente de izquierda a derecha la gráfica de una recta con pendiente negativa?"
    choices:
      - {text: "Desciende de forma continua (va cuesta abajo)", is_correct: true}
      - {text: "Asciende de forma continua (va cuesta arriba)", is_correct: false}
      - {text: "Se mantiene totalmente horizontal", is_correct: false}
      - {text: "Es una recta vertical perfectamente derecha", is_correct: false}
    explanation: "La alternativa correcta es 'Desciende de forma continua (va cuesta abajo)'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la pendiente $m$ de la función $f(x) = mx + b$.'
  - 'Paso 2: Verificar que $m < 0$.'
  - 'Paso 3: Clasificar la función como estrictamente decreciente.'
  - 'Paso 4: Interpretar la pérdida de $m$ unidades en $y$ por cada incremento unitario en $x$.'
errores_correccion: |
  - **Error común:** Pensar que una pendiente negativa significa que los resultados $y$ deben ser obligatoriamente números negativos.
  - **Cómo corregirlo:** La pendiente negativa indica que $y$ **DISMINUYE**, pero los valores de $y$ pueden ser perfectamente positivos (por ejemplo, el estanque tiene 475 litros a los 1 minuto).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una recta con pendiente negativa $m < 0$ sube de izquierda a derecha en el plano cartesiano.'
  - 'Si la pendiente de una función es $m = -3$, al aumentar $x$ en 1 unidad, el valor de $y$ aumenta en 3 unidades.'
  - 'Una función lineal decreciente posee un recorrido limitado únicamente a números reales negativos.'
  - 'La pendiente negativa indica que la recta es perpendicular al eje horizontal.'
  - 'Evaluar $f(x) = -2x$ en valores positivos de $x$ genera imágenes siempre crecientes.'
afirmaciones_verdaderas:
  - 'Una pendiente negativa ($m < 0$) indica que la función es strictly decreciente: al aumentar $x$, el valor de $y = f(x)$ disminuye.'
  - 'Geométricamente, una recta con pendiente negativa desciende de izquierda a derecha formando un ángulo obtuso ($90^\circ < \alpha < 180^\circ$) con el eje $X$ positivo.'
al_terminar_debes_poder: |
  QUÉ: Interpretar el significado del signo negativo en la pendiente de una función lineal.
  CÓMO: Identificar $m < 0$, declarar la monotonía decreciente de la recta y graficar su descenso de izquierda a derecha.
