semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NEGATIVA
resumen_inicial: 'Interpretación de pendiente negativa como decrecimiento: conceptos,
  representación y propiedades en Función constante y función lineal.'
explicacion_simple: Cuando una recta baja de izquierda a derecha, es porque cada avance
  en $x$ le resta valor a $y$, el reflejo numérico de una pendiente negativa.
explicacion_formal: '### Definición formal


  Para una función lineal o afín $f(x) = mx + n$ con $m < 0$, se cumple que $x_1 <
  x_2 \implies f(x_1) > f(x_2)$ para todo $x_1, x_2$ del dominio; es decir, $f$ es
  estrictamente decreciente en todo su dominio.


  ### Desarrollo didáctico


  Piensa en bajar una escalera: cada paso hacia la derecha (aumento de $x$) corresponde
  a un paso hacia abajo (disminución de $y$).


  Si $m=-3$, cada aumento de una unidad en $x$ produce una disminución de 3 unidades
  en $y$. La recta, vista de izquierda a derecha, siempre baja.'
definiciones_clave: '- **Interpretación de pendiente negativa como decrecimiento**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de pendiente negativa como
  decrecimiento.'
ejemplo_guiado:
