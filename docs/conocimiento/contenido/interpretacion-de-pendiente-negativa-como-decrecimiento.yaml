semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_NEGATIVA
resumen_inicial: Una pendiente negativa ($m < 0$) indica que la función lineal o afín es estrictamente decreciente en todo su dominio real.
explicacion_simple: '![Una pendiente negativa ($m < 0$) indica que la función lineal o afín es estrictamente decreciente en todo su dominio real](/static/img/nodos/interpretacion-de-pendiente-negativa-como-decrecimiento-intro.svg)



  Cuando una recta tiene **pendiente negativa** ($m < 0$):

  - Al moverte de **izquierda a derecha**, la gráfica **baja continuamente**.

  - Si la variable $x$ aumenta, la imagen $y$ disminuye (invierte el orden).

  - A mayor valor absoluto $|m|$ con $m < 0$, más rápida y empinada es la caída de la recta.'
explicacion_formal: 'Una función afín o lineal $f(x) = mx + n$ es **estrictamente decreciente** en $\mathbb{R}$ si y solo si su pendiente satisface $m < 0$:

  $$m < 0 \Longleftrightarrow \forall x_1, x_2 \in \mathbb{R}, \ x_1 < x_2 \implies f(x_1) > f(x_2)$$


  **Demostración analítica:**

  $$f(x_2) - f(x_1) = m(x_2 - x_1)$$

  Como $x_2 > x_1 \implies (x_2 - x_1) > 0$. Al multiplicar por $m < 0$, el producto resulta estrictamente negativo: $f(x_2) - f(x_1) < 0 \implies f(x_2) < f(x_1)$.'
definiciones_clave: '- **Función decreciente**: Relación donde un incremento en las preimágenes genera una disminución en las imágenes.

  - **Pendiente negativa ($m < 0$)**: Tasa de cambio negativa constante.'
propiedades_relaciones: '- **Inversión de desigualdades**: Al aplicar una función con $m < 0$, el sentido de las desigualdades se invierte.

  - **Ángulo obtuso**: Su ángulo de inclinación $\theta$ cumple $90^\circ < \theta < 180^\circ$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una pendiente negativa ($m < 0$) indica que la función lineal o afín es estrictamente decreciente en todo su dominio real](/static/img/nodos/interpretacion-de-pendiente-negativa-como-decrecimiento-ejemplos.svg)



    Demuestra que la función $f(x) = -3x + 10$ es estrictamente decreciente evaluando en $x_1 = 1$ y $x_2 = 4$.'
  pasos:
  - 'Paso 1: Identificar la pendiente: $m = -3 < 0$.'
  - 'Paso 2: Evaluar en $x_1 = 1$: $f(1) = -3(1) + 10 = 7$.'
  - 'Paso 3: Evaluar en $x_2 = 4$: $f(4) = -3(4) + 10 = -12 + 10 = -2$.'
  - 'Paso 4: Comparar: como $1 < 4$ pero $7 > -2$, se comprueba que $f(1) > f(4)$ (orden invertido).'
  - 'Paso 5: Concluir que la función es estrictamente decreciente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones es estrictamente decreciente?
  choices:
  - text: f(x) = -5x + 12
    is_correct: true
  - text: f(x) = 5x - 12
    is_correct: false
  - text: f(x) = 12
    is_correct: false
  - text: f(x) = x/5
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = -5x + 12'. Su pendiente es $m = -5 < 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una función con pendiente $m = -2$, si la entrada $x$ aumenta en 3 unidades, ¿qué le ocurre a la salida $y$?
  choices:
  - text: Disminuye en 6 unidades
    is_correct: true
  - text: Aumenta en 6 unidades
    is_correct: false
  - text: Disminuye en 2 unidades
    is_correct: false
  - text: Se mantiene igual
    is_correct: false
  explanation: La alternativa correcta es 'Disminuye en 6 unidades'. $\Delta y = m \cdot \Delta x = -2(3) = -6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la pendiente $m$ como el coeficiente de $x$.'
- 'Paso 2: Comprobar que $m < 0$.'
- 'Paso 3: Concluir que la función es estrictamente decreciente en todo $\mathbb{R}$.'
- 'Paso 4: Trazar o interpretar la gráfica como una recta que desciende de izquierda a derecha.'
errores_correccion: '- **Error común:** Pensar que una función decreciente no puede tener imágenes positivas.

  - **Cómo corregirlo:** La función decrece en su trayectoria, pero para valores de $x$ suficientemente negativos, $f(x) = -2x$ produce salidas positivas (ej: $f(-5) = 10$).'
ejemplos:
- titulo: 'Ejemplo 1: Clasificación de monotonía'
  enunciado: La función $g(x) = 4 - x$, ¿es creciente o decreciente?
  alternativas:
  - Decreciente, porque el coeficiente de x es -1
  - Creciente, porque empieza con 4 positivo
  - Constante, por tener resta
  - No lineal
  respuesta: Decreciente, porque el coeficiente de x es -1
  solucion_pasos:
  - 'Paso 1: Reescribir en forma canónica: $g(x) = -1x + 4$.'
  - 'Paso 2: $m = -1 < 0 \implies$ estrictamente decreciente.'
- titulo: 'Ejemplo 2: Inversión de desigualdades'
  enunciado: Si $f(x) = -4x + 1$ y $u < v$, ¿qué afirmación es correcta?
  alternativas:
  - f(u) > f(v)
  - f(u) < f(v)
  - f(u) = f(v)
  - f(u) + f(v) = 0
  respuesta: f(u) > f(v)
  solucion_pasos:
  - 'Paso 1: Por ser decreciente ($m = -4 < 0$), invierte el orden.'
- titulo: 'Ejemplo 3: Gráfica descendente'
  enunciado: Una recta pasa por $(0, 5)$ y $(4, 1)$. ¿Qué signo tiene su pendiente?
  alternativas:
  - Negativo
  - Positivo
  - Cero
  - No se puede saber
  respuesta: Negativo
  solucion_pasos:
  - 'Paso 1: $m = \frac{1 - 5}{4 - 0} = \frac{-4}{4} = -1 < 0$.'
- titulo: 'Ejemplo 4: Tasa de variación negativa'
  enunciado: Si $f(x) = -2.5x$, ¿cuál es la variación en $y$ cuando $x$ aumenta en 4?
  alternativas:
  - '-10'
  - '10'
  - '-6.5'
  - '-2.5'
  respuesta: '-10'
  solucion_pasos:
  - 'Paso 1: $\Delta y = -2.5(4) = -10$.'
errores_frecuentes:
- Confundir el signo del término independiente con el de la pendiente.
- Olvidar que las funciones decrecientes invierten el orden de las desigualdades.
- Asumir que las imágenes de una función decreciente deben ser siempre negativas.
afirmaciones_verdaderas:
- Una función afín o lineal es estrictamente decreciente si y solo si su pendiente m es estrictamente menor que cero.
- En una función decreciente, un aumento en la variable independiente produce una disminución en la variable dependiente.
al_terminar_debes_poder: '**QUÉ:** Interpretar y justificar el decrecimiento de funciones lineales y afines con pendiente negativa.


  **CÓMO:** Comprobando que m < 0 y aplicando la inversión del orden de desigualdades y la trayectoria descendente de la recta.


  ![Resumen Una pendiente negativa ($m < 0$) indica que la función lineal o afín es estrictamente decreciente en todo su dominio real](/static/img/nodos/interpretacion-de-pendiente-negativa-como-decrecimiento-resumen.svg)'
