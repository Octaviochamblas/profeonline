semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.INTERPRETACION_SOLUCION
resumen_inicial: Interpretar el conjunto solución consiste en responder a la pregunta
  del problema en el lenguaje del contexto real.
explicacion_simple: 'Obtener $x \le 180$ en la hoja de cálculo no es la respuesta
  final de un problema contextual.

  La **interpretación contextual** consiste en redactar con palabras lo que significa
  ese resultado:

  ''Para no exceder el presupuesto de $\$15.000$, la persona puede hablar desde $0$
  hasta un máximo de $180$ minutos en el mes''.'
explicacion_formal: 'Dada la solución matemática $S \subset \mathbb{R}$, la **función
  de interpretación contextual** asigna:


  $$g: S \longrightarrow \text{Respuesta contextual válida en } \mathbb{R}^+ \cap
  \mathbb{Z}$$


  **Desglose de la fórmula:**

  - Filtra el intervalo $S$ asegurando la compatibilidad física con el contexto real
  (por ejemplo, cantidades enteras o no negativas).'
definiciones_clave: '- **Interpretación contextual**: Explicación verbal del significado
  práctico del conjunto solución en la situación del problema.'
propiedades_relaciones: '- **Significado físico**: Convierte la notación de intervalos
  en decisiones o recomendaciones concretas.'
ejemplo_guiado:
  enunciado: La resolución de una inecuación de ventas da como resultado $x \ge 42{,}3$
    cajas. Interpreta este resultado si solo se pueden vender cajas completas.
  pasos:
  - 'Paso 1: Analizar la restricción matemática: se necesitan vender al menos $42{,}3$
    cajas.'
  - 'Paso 2: Reconocer la restricción contextual: las cajas son objetos discretos
    ($x \in \mathbb{Z}^+$).Paso 3: Redondear al entero superior inmediato que satisface
    la desigualdad: $x = 43$.Paso 4: Redactar la interpretación: ''Se deben vender
    como mínimo $43$ cajas completas para lograr la meta''.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el cálculo da $x \ge 42{,}3$ cajas completas, ¿cuál es el número mínimo
    de cajas que se deben vender en el contexto real?
  choices:
  - text: $43$ cajas
    is_correct: true
  - text: $42$ cajas
    is_correct: false
  - text: $42{,}3$ cajas
    is_correct: false
  - text: $40$ cajas
    is_correct: false
  explanation: La alternativa correcta es '$43$ cajas'. Vender 42 cajas no alcanzaría
    el mínimo exigido de 42,3.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué en este contexto real no sirve como respuesta el número decimal
    $42{,}3$?
  choices:
  - text: Porque las cajas son bienes discretos que solo se comercializan enteras.
    is_correct: true
  - text: Porque los números decimales no existen en álgebra.
    is_correct: false
  - text: Porque $42{,}3$ es un número negativo.
    is_correct: false
  - text: Porque la inecuación era una igualdad.
    is_correct: false
  explanation: La alternativa correcta es 'Porque las cajas son bienes discretos que
    solo se comercializan enteras.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener el intervalo matemático de solución $S$.'
- 'Paso 2: Verificar la naturaleza de la variable (si es discreta como personas/cajas
  o continua como litros/metros).'
- 'Paso 3: Ajustar los límites al primer entero válido si la variable es discreta.'
- 'Paso 4: Escribir la conclusión en una frase completa.'
errores_correccion: '- **Error común:** Redondear $42{,}3$ hacia abajo a $42$ por
  reglas estándar de redondeo.

  - **Cómo corregirlo:** En desigualdades $x \ge 42{,}3$, vender 42 no cumple la condición;
  debes subir obligatoriamente al entero $43$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento con desigualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Frases como 'como máximo' se traducen con la desigualdad no estricta \\le?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'como máximo' fija un límite superior inclusivo ($\\le$).
- titulo: ¿Es necesario descartar soluciones negativas al modelar magnitudes físicas
    reales como masa o personas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el dominio físico impone restricciones de no negatividad ($x \\ge 0$).
errores_frecuentes:
- Usar el signo igual (=) en lugar de una desigualdad al modelar restricciones contextuales
  de límites máximos o mínimos.
- Sumar directamente porcentajes de concentración o aleación en lugar de calcular
  las masas de componente puro.
- Olvidar que la masa o volumen agregado afecta tanto al numerador (fino) como al
  denominador (total) de la mezcla.
- Redondear soluciones discretas en la dirección contraria a la exigida por la inecuación
  de restricción.
- Aceptar soluciones matemáticas negativas en problemas que involucran variables físicas
  reales como tiempo, masa o personas.
afirmaciones_verdaderas:
- Al modelar restricciones de presupuesto o capacidad máxima se deben emplear desigualdades
  del tipo $M(x) \le K$.
- El conjunto solución matemáticamente obtenido debe filtrarse con el dominio físico
  real descartando valores negativos o incompatibles.
al_terminar_debes_poder: Al finalizar este recurso podrás modelar problemas contextuales
  mediante inecuaciones, interpretando y descartando soluciones según la realidad
  física.
fuente: Texto escolar MINEDUC — Álgebra / Modelamiento con Desigualdades
