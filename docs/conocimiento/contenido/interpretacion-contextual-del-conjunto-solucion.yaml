  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en interpretación contextual del conjunto solución?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en modelamiento con desigualdades
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en modelamiento con desigualdades.
    Es la propiedad fundamental de orden en interpretación contextual del conjunto
    solución.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en interpretación
