  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resuelve la desigualdad y escribe su conjunto solución algebraico.'
- 'Paso 2: Revisa qué representa la variable en el contexto del problema.'
- 'Paso 3: Determina si el contexto exige condiciones extra, como enteros, no negatividad
  o cantidades discretas.'
- 'Paso 4: Interseca la solución algebraica con esas condiciones contextuales.'
- 'Paso 5: Redacta la respuesta final en lenguaje del problema, no solo en lenguaje
  simbólico.'
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en interpretación contextual
  del conjunto solución.
ejemplos:
- titulo: Compra mínima de entradas
  enunciado: Si la solución algebraica de un problema es $x > 3$ y $x$ representa
    la cantidad de entradas, interpreta el resultado en el contexto.
  solucion_pasos:
  - Algebraicamente, la desigualdad permite cualquier número real mayor que $3$.
  - Como $x$ representa cantidad de entradas, solo tienen sentido valores enteros
    y no negativos.
  - La interpretación contextual correcta es: se deben comprar 4 o más entradas.
- titulo: Temperatura permitida
  enunciado: Una sustancia debe mantenerse con temperatura $T \leq 8$. Explica cómo
    se interpreta ese conjunto solución.
  solucion_pasos:
  - La desigualdad indica que toda temperatura menor o igual que $8$ cumple la condición.
  - Como la variable representa temperatura, no es necesario restringirse a enteros.
  - La interpretación contextual es: la temperatura puede ser cualquier valor real
      que no exceda los $8$ grados.
- titulo: ¿El conjunto $x \geq 5$ siempre se interpreta como "5 o más objetos"?
  respuesta: 'No'
  solucion_pasos:
  - La interpretación depende del significado de la variable.
  - Si $x$ representa objetos, probablemente se restringe a enteros; si representa
    tiempo o masa, puede admitir reales.
- titulo: ¿Para interpretar una solución hay que volver al significado de la variable?
  respuesta: Sí
  solucion_pasos:
  - El mismo intervalo puede significar cosas distintas según lo que represente la
    variable.
  - Sin volver al contexto, la respuesta queda algebraicamente correcta pero pedagógicamente
    incompleta.
errores_frecuentes:
- Dar el intervalo algebraico como respuesta final sin traducirlo al contexto.
- Aceptar valores fraccionarios cuando la variable representa cantidades discretas.
- Descartar valores reales válidos cuando la magnitud sí admite medición continua.
- Olvidar imponer no negatividad cuando el contexto la exige.
- Confundir la interpretación verbal con una nueva resolución algebraica.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  interpretación contextual del conjunto solución.
