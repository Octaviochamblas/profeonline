semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.INTERPRETACION_SOLUCION
resumen_inicial: Interpretar el conjunto solución implica traducir el intervalo matemático a una conclusión práctica expresada en las unidades del problema.
explicacion_simple: |
  Resolver la inecuación matemática da un intervalo de números (por ejemplo $x > 14{,}2$).

  Pero si $x$ representa **cajas de mercadería**, no podemos comprar $14{,}2$ cajas.

  Interpretar la solución significa entender que la cantidad mínima entera de cajas a comprar para cumplir la condición es **15 cajas**.
explicacion_formal: |
  Dada la solución matemática $S_{\text{math}} = ]a, +\infty[$ con $a \in \mathbb{R} \setminus \mathbb{Z}$ y la restricción discreta $x \in \mathbb{Z}^+$, el **mínimo entero contextual** $x_{\min}$ se define como:

  $$x_{\min} = \lceil a \rceil \ = \min \{k \in \mathbb{Z} \mid k > a\}$$

  **Desglose de la fórmula:**
  - $\lceil a \rceil$: Función techo (redondeo hacia arriba al entero inmediatamente superior).
  - Determina la primera cantidad discreta válida en el contexto real.
definiciones_clave: |
  - **Interpretación contextual**: Traducción de los límites numéricos de una desigualdad a la respuesta verbal que contesta la pregunta del problema.
  - **Redondeo contextual por restricción**: Selección del entero inferior o superior adecuado según la dirección de la desigualdad ($\le$ ó $\ge$).
propiedades_relaciones: |
  - **Cota inferior estricta discreta ($x > 14{,}2$)**: Exige tomar el entero superior $15$.
  - **Cota superior discreta ($x \le 25{,}7$)**: Exige tomar el entero inferior $25$ para no transgredir el límite.
ejemplo_guiado:
  enunciado: Un comerciante necesita obtener una ganancia de al menos $\$100.000$. Si gana $\$7.000$ por cada artículo vendido $x$, la inecuación resulta en $x \ge 14{,}28$. Interpreta el resultado en el contexto del negocio.
  pasos:
    - 'Paso 1: Identificar la solución matemática: $x \ge 14{,}28$.'
    - 'Paso 2: Reconocer la naturaleza de la variable: los artículos vendidos $x$ son números enteros positivos.'
    - 'Paso 3: Analizar el redondeo: vender 14 artículos da $14 \cdot 7000 = $\$98.00$0$ (no alcanza $\$100.000$).'
    - 'Paso 4: Seleccionar el entero superior: para ganar al menos $\$100.000$ debe vender como mínimo $15$ artículos.'
    - 'Paso 5: Redactar la respuesta contextual: "El comerciante debe vender 15 o más artículos".'
checkpoints:
  - placement: after_explicacion_formal
    question: Si la solución matemática de artículos a producir es $x > 14{,}2$, ¿cuál es la cantidad entera mínima de artículos a vender?
    choices:
      - {text: 15 artículos., is_correct: true}
      - {text: 14 artículos., is_correct: false}
      - {text: 14,2 artículos., is_correct: false}
      - {text: 10 artículos., is_correct: false}
    explanation: La alternativa correcta es '15 artículos.'. Vender 14 no supera 14,2.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: Si la capacidad de personas de un salón satisface $x \le 25{,}7$, ¿cuál es el número máximo de personas permitidas?
    choices:
      - {text: 25 personas., is_correct: true}
      - {text: 26 personas., is_correct: false}
      - {text: 25,7 personas., is_correct: false}
      - {text: 30 personas., is_correct: false}
    explanation: La alternativa correcta es '25 personas.'. Redondear a 26 sobrepasa el límite máximo permitido.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Resolver la inecuación matemática.'
  - 'Paso 2: Identificar si la variable es continua (tiempo, masa) o discreta (objetos, personas).'
  - 'Paso 3: Si es discreta, aplicar el redondeo hacia arriba ($\ge$) o hacia abajo ($\le$).'
  - 'Paso 4: Redactar la conclusión final en las unidades del enunciado.'
errores_correccion: |
  - **Error común:** Redondear $x > 14{,}2$ a $14$ por la regla decimal común de aproximación.
  - **Cómo corregirlo:** En desigualdades, el redondeo depende de la restricción: si requieres MÁS de $14{,}2$, el primer entero válido es $15$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento con desigualdades.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Al obtener la solución de inecuación $x > 14{,}2$ para cajas enteras de mercancía, el número mínimo de cajas requeridas se interpreta como $14$.'
  - 'Si el despeje da $t \ge 3{,}8$ minutos, el tiempo entero mínimo necesario es de $3$ minutos.'
  - 'La interpretación contextual del intervalo $[10, 50]$ en ventas exige incluir valores imaginarios.'
  - 'Interpretar un conjunto solución consiste únicamente en copiar el intervalo $[a, b]$ sin redactar una respuesta referida a las unidades del problema.'
  - 'En un problema de capacidad de personas, el resultado $x \le 25{,}7$ se redondea hacia arriba a $26$ personas sobrepasando el límite de seguridad.'
afirmaciones_verdaderas:
  - 'Interpretar contextualmente un conjunto solución consiste en responder la pregunta del enunciado ajustando los valores continuos al conjunto discreto o real del contexto.'
  - 'En problemas discretos (personas, objetos), se aplica el redondeo adecuado para respetar el sentido de la desigualdad ($x > 14{,}2 \implies 15$ objetos).'
al_terminar_debes_poder: |
  QUÉ: Interpretar el conjunto solución algebraico en el contexto práctico del enunciado.
  CÓMO: Analizar la naturaleza discreta o continua de la variable, evaluar cotas superiores o inferiores y redactar la conclusión respondiendo a las preguntas del problema.
