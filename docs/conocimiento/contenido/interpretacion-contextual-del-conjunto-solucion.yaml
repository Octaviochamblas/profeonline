semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.INTERPRETACION_SOLUCION
resumen_inicial: 'Interpretación contextual del conjunto solución: relaciones de orden,
  intervalos y resolución en Modelamiento con desigualdades.'
explicacion_simple: Resolver una desigualdad entrega un conjunto de valores posibles,
  pero el problema no termina ahí. Hay que leer qué significan esos valores dentro
  de la situación original.
explicacion_formal: '### Definición formal


  Sea $S \subseteq \mathbb{R}$ el conjunto solución algebraico de una desigualdad
  y sea $D$ el dominio admisible del contexto. La interpretación contextual del resultado
  corresponde al conjunto

  $$S_{\text{ctx}} = S \cap D,$$

  junto con el significado concreto que cada valor de $S_{\text{ctx}}$ tiene dentro
  del problema. Por ello, interpretar una solución no consiste solo en leer un intervalo,
  sino en decidir qué valores son posibles y cómo se expresan en términos del contexto
  modelado.


  ### Desarrollo didáctico


  El álgebra puede decir "todos los números mayores que 3", pero el contexto puede
  exigir "todas las cantidades enteras de productos mayores o iguales que 4". La forma
  simbólica y la interpretación verbal no siempre coinciden uno a uno.

  Por eso, después de resolver, conviene volver a la pregunta original: ¿qué representa
  la variable y cómo se expresa la respuesta en ese lenguaje?'
definiciones_clave: '- **Interpretación contextual del conjunto solución**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a interpretación contextual del conjunto
  solución.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de interpretación
    contextual del conjunto solución.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de interpretación contextual del conjunto
    solución, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
