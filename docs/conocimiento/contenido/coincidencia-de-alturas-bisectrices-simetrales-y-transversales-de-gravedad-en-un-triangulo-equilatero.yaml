semantic_id: MAT.GEO.NOTABLES_COINCIDENCIA.EQUILATERO_RECTAS_NOTABLES
resumen_inicial: En todo triángulo equilátero de lado $a$, las tres alturas, tres
  bisectrices interiores, tres simetrales y tres transversales de gravedad coinciden
  totalmente en tres únicas rectas o segmentos, cada uno de los cuales mide exactamente
  $h = \frac{a\sqrt{3}}{2}$.
explicacion_simple: '![Líneas Notables en Equilátero](/static/img/nodos/coincidencia-de-alturas-bisectrices-simetrales-y-transversales-de-gravedad-en-un-triangulo-equilatero-intro.svg)


  Como el triángulo equilátero tiene sus 3 lados y sus 3 ángulos idénticos ($60^\circ$):


  - **Todas las líneas son la misma**: En cada esquina, la altura, la bisectriz, la
  transversal y la simetral son **exactamente la misma línea**.

  - **Solo hay 3 líneas maestras**: Las 3 líneas notables miden lo mismo y son los
  3 ejes de simetría de la figura.

  - **Fórmula de la altura**: Cada una mide $h = \frac{a\sqrt{3}}{2}$.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo equilátero $\Delta ABC$ de lado $a$, las tres alturas, tres bisectrices
  interiores, tres simetrales y tres transversales de gravedad coinciden totalmente
  en tres únicas rectas maestras de simetría:


  $$h_i = b_i = t_i = S_i = \frac{a\sqrt{3}}{2} \quad (\text{para } i = 1, 2, 3)$$


  ### Desglose simbólico y geométrico

  - Fusión de 12 líneas notables en 3 ejes de simetría axial.

  - Longitud universal: Cada una mide exactamente $h = \frac{a\sqrt{3}}{2}$.

  - Triángulos rectángulos notables: Cada eje divide al triángulo en dos semi-equiláteros
  $30^\circ-60^\circ-90^\circ$.


  ### Síntesis didáctica

  En el triángulo equilátero la simetría total fusiona todas las líneas notables en
  3 ejes perfectos de idéntica longitud.'
definiciones_clave: '- **Triángulo equilátero**: Polígono regular de tres lados congruentes
  y tres ángulos interiores de $60^\circ$.

  - **Líneas notables coincidentes**: Fenómeno geométrico por el cual altura, bisectriz,
  transversal y simetral se superponen en una misma recta.

  - **Triángulo notable $30^\circ-60^\circ-90^\circ$**: Triángulo rectángulo resultante
  de trazar una altura en el triángulo equilátero.

  '
propiedades_relaciones: '- **Identidad en los tres ejes**: $h = b = t = S = \frac{a\sqrt{3}}{2}$.

  - **Área del triángulo equilátero**: $\text{Área} = \frac{a \cdot h}{2} = \frac{a^2\sqrt{3}}{4}$.

  - **Simetría de orden 3**: Posee 3 ejes de simetría axial que coinciden con las
  tres líneas notables.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Equilátero](/static/img/nodos/coincidencia-de-alturas-bisectrices-simetrales-y-transversales-de-gravedad-en-un-triangulo-equilatero-ejemplos.svg)


    Un triángulo equilátero tiene lados de longitud $a = 8\text{ cm}$. Calcula la
    longitud común de su altura, bisectriz interior y transversal de gravedad, y determina
    el área del triángulo.

    '
  pasos:
  - 'Paso 1: Aplicar la fórmula de las líneas notables en el equilátero: $h = \frac{a\sqrt{3}}{2}$.'
  - 'Paso 2: Sustituir $a = 8$: $h = \frac{8\sqrt{3}}{2} = 4\sqrt{3}\text{ cm}$.'
  - 'Paso 3: Concluir que la altura, bisectriz y transversal miden todas exactamente
    $4\sqrt{3}\text{ cm}$.'
  - 'Paso 4: Calcular el área mediante $\text{Área} = \frac{a^2\sqrt{3}}{4} = \frac{8^2\sqrt{3}}{4}
    = \frac{64\sqrt{3}}{4} = 16\sqrt{3}\text{ cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula de la longitud de la altura (y de todas las líneas
    notables) en un triángulo equilátero de lado a?
  choices:
  - text: $h = \frac{a\sqrt{3}}{2}$
    is_correct: true
  - text: $h = \frac{a}{2}$
    is_correct: false
  - text: $h = \frac{a^2\sqrt{3}}{4}$
    is_correct: false
  - text: $h = a\sqrt{2}$
    is_correct: false
  explanation: La longitud de la altura en un triángulo equilátero de lado a es $h
    = \frac{a\sqrt{3}}{2}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la transversal de gravedad de un triángulo equilátero mide 6√3 cm,
    ¿cuánto mide el lado del triángulo?
  choices:
  - text: $12\text{ cm}$
    is_correct: true
  - text: $6\text{ cm}$
    is_correct: false
  - text: $18\text{ cm}$
    is_correct: false
  - text: $24\text{ cm}$
    is_correct: false
  explanation: El lado mide $12\text{ cm}$, ya que $h = \frac{a\sqrt{3}}{2} \implies
    6\sqrt{3} = \frac{a\sqrt{3}}{2} \implies a = 12\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el triángulo es equilátero (3 lados iguales o 3 ángulos de
  $60^\circ$).'
- 'Paso 2: Reconocer que altura, bisectriz, transversal de gravedad y simetral son
  idénticas.'
- 'Paso 3: Calcular su longitud mediante la fórmula $h = \frac{a\sqrt{3}}{2}$.'
- 'Paso 4: Si se conoce la altura, despejar el lado mediante $a = \frac{2h}{\sqrt{3}}$.'
errores_correccion: No confundas la fórmula de la altura ($a\sqrt{3}/2$) con la fórmula
  del área ($a^2\sqrt{3}/4$).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántas rectas notables distintas existen en total en un triángulo equilátero?
  alternativas:
  - Exactamente 3 rectas maestras
  - 12 rectas distintas
  - 4 rectas
  respuesta: Exactamente 3 rectas maestras
  solucion_pasos:
  - Las 4 familias de 3 líneas cada una (12 en total) se fusionan en exactamente 3
    rectas maestras de simetría.
- titulo: Ejemplo 2
  enunciado: En un triángulo equilátero de lado $6\text{ cm}$, ¿cuánto mide la bisectriz
    interior de cualquiera de sus vértices?
  alternativas:
  - $3\sqrt{3}\text{ cm}$
  - $6\text{ cm}$
  - $3\text{ cm}$
  respuesta: $3\sqrt{3}\text{ cm}$
  solucion_pasos:
  - $b = h = \frac{6\sqrt{3}}{2} = 3\sqrt{3}\text{ cm}$.
- titulo: ¿En un triángulo equilátero las tres alturas tienen exactamente la misma
    longitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, las tres alturas miden exactamente $\frac{a\sqrt{3}}{2}$.
- titulo: ¿En un triángulo equilátero la altura es diferente de la transversal de
    gravedad?
  respuesta: 'No'
  solucion_pasos:
  - No, en el triángulo equilátero la altura coincide perfectamente con la transversal
    de gravedad.
errores_frecuentes:
- Olvidar incluir la raíz de 3 ($\sqrt{3}$) en la fórmula de la altura.
- Confundir la fórmula lineal $h = a\sqrt{3}/2$ con la fórmula cuadrática del área
  $A = a^2\sqrt{3}/4$.
- Creer que en el equilátero la simetral no pasa por los vértices (sí pasa, coincide
  con las otras).
- Asumir que las coincidencias ocurren en cualquier triángulo acutángulo (solo en
  el equilátero).
- Equivocar el despeje de $a$ a partir de $h$.
afirmaciones_verdaderas:
- En todo triángulo equilátero, las alturas, bisectrices, simetrales y transversales
  de gravedad coinciden en tres únicas rectas de simetría.
- La longitud de cada una de las líneas notables en un triángulo equilátero de lado
  $a$ es $h = \frac{a\sqrt{3}}{2}$.
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular las líneas notables coincidentes
  en el triángulo equilátero.


  **CÓMO:** Aplicando la identidad $h = b = t = S = \frac{a\sqrt{3}}{2}$ y utilizando
  la partición angular en $30^\circ-60^\circ-90^\circ$.


  ![Resumen de Líneas en Equilátero](/static/img/nodos/coincidencia-de-alturas-bisectrices-simetrales-y-transversales-de-gravedad-en-un-triangulo-equilatero-resumen.svg)

  '
