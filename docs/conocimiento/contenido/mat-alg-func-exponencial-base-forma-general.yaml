semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.FORMA_GENERAL
resumen_inicial: 'La forma general de la función exponencial es $f(x) = a \cdot b^x$, donde $a \neq 0$ es el factor de escala inicial y $b > 0, b \neq 1$ es la base de la tasa multiplicativa.'
explicacion_simple: |
  En la fórmula $f(x) = a \cdot b^x$, cada letra cumple una función específica: el número $a$ es la cantidad de inicio o factor de partida (lo que obtenemos al evaluar $x = 0$), mientras que el número $b$ es la base por la cual se multiplica esa cantidad cada vez que $x$ aumenta en una unidad. Es muy importante no multiplicar $a \cdot b$ antes de calcular el exponente.
explicacion_formal: |
  ### Definición formal
  La **forma general canónica** de una función exponencial no trasladada se expresa mediante la ecuación funcional:
  $$f(x) = a \cdot b^x$$
  con $a \in \mathbb{R} \setminus \{0\}$, $b \in \mathbb{R}^+ \setminus \{1\}$ y $x \in \mathbb{R}$.

  ### Desglose simbólico
  - Parámetro $a$: Coeficiente multiplicativo de escala externa. Satisface $f(0) = a \cdot b^0 = a \cdot 1 = a$ (intersección con el eje $y$).
  - Parámetro $b$: Base o razón exponencial constante. Satisface $b = \frac{f(x+1)}{f(x)}$.
  - Prioridad de operaciones: $a \cdot b^x \neq (a \cdot b)^x$. La potencia $b^x$ se evalúa antes de la multiplicación por $a$.

  ### Síntesis didáctica
  Diferenciar el rol de $a$ y $b$: Si $a$ cambia de positivo a negativo, la gráfica se refleja verticalmente respecto al eje $x$. Si $b$ cambia de $b > 1$ a $0 < b < 1$, la curva pasa de crecer a decrecer.
definiciones_clave: |
  - **Forma general $a \cdot b^x$**: Representación de la función exponencial mediante coeficiente $a$ y base $b$.
  - **Factor de escala $a$**: Valor inicial de la función evaluada en $x = 0$.
  - **Razón multiplicativa $b$**: Factor por el que se escala la función ante un incremento de una unidad en $x$.
propiedades_relaciones: |
  - **Evaluación en enteros**: Para $x = 1 \implies f(1) = a \cdot b$. Para $x = 2 \implies f(2) = a \cdot b^2$.
  - **Conversión a base natural $e$**: Toda función exponencial $a \cdot b^x$ se puede reescribir en base $e$ como $f(x) = a \cdot e^{k x}$, con $k = \ln(b)$.
ejemplo_guiado:
  enunciado: 'Identifica los parámetros $a$ y $b$ en las funciones exponenciales $f(x) = 3 \cdot 2^x$ y $g(x) = -0.5 \cdot (4)^x$, y calcula el valor de cada función en $x = 0$ y $x = 2$.'
  pasos:
    - 'Paso 1: En $f(x) = 3 \cdot 2^x$, el coeficiente de escala es $a = 3$ y la base es $b = 2$.'
    - 'Paso 2: Evaluamos $f(0) = 3 \cdot 2^0 = 3 \cdot 1 = 3$. Evaluamos $f(2) = 3 \cdot 2^2 = 3 \cdot 4 = 12$.'
    - 'Paso 3: En $g(x) = -0.5 \cdot (4)^x$, el coeficiente de escala es $a = -0.5$ y la base es $b = 4$.'
    - 'Paso 4: Evaluamos $g(0) = -0.5 \cdot 4^0 = -0.5 \cdot 1 = -0.5$. Evaluamos $g(2) = -0.5 \cdot 4^2 = -0.5 \cdot 16 = -8$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función exponencial dada por la regla $f(x) = 8 \cdot 5^x$, ¿cuáles son los valores exactos de los parámetros $a$ y $b$?'
    choices:
      - {text: '$a = 8$ y $b = 5$', is_correct: true}
      - {text: '$a = 5$ y $b = 8$', is_correct: false}
      - {text: '$a = 40$ y $b = 5$', is_correct: false}
      - {text: '$a = 8$ y $b = 40$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = 8$ y $b = 5$''. El número que multiplica por fuera a la potencia es $a = 8$, y la base que se eleva a $x$ es $b = 5$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función exponencial se expresa como $h(x) = 6 \cdot 3^x$, ¿cuál es el valor de $h(2)$?'
    choices:
      - {text: '$54$', is_correct: true}
      - {text: '$36$', is_correct: false}
      - {text: '$324$', is_correct: false}
      - {text: '$18$', is_correct: false}
    explanation: 'La alternativa correcta es ''$54$''. Primero calculamos la potencia $3^2 = 9$, y luego multiplicamos por $a = 6$: $h(2) = 6 \cdot 9 = 54$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comparar la expresión dada con la forma canónica $f(x) = a \cdot b^x$.'
  - 'Paso 2: Extraer el coeficiente $a$ que multiplica a la potencia exponencial.'
  - 'Paso 3: Extraer la base $b$ sobre la que se aplica el exponente $x$.'
  - 'Paso 4: Calcular $f(0) = a$ para verificar la correcta identificación del parámetro inicial.'
errores_correccion: |
  - **Error 1:** Multiplicar $a \cdot b$ antes de calcular la potencia (ej: en $3 \cdot 2^x$ escribir $(3 \cdot 2)^x = 6^x$). **Cómo corregirlo:** La jerarquía de operaciones exige calcular la potencia $2^x$ en primer lugar y luego multiplicar el resultado por 3.
  - **Error 2:** Confundir el coeficiente $a$ con la base $b$. **Cómo corregirlo:** La base $b$ es la que sostiene al exponente $x$. El coeficiente $a$ es el número libre que multiplica por fuera.
ejemplos:
  - titulo: 'Extracción de parámetros a y b'
    enunciado: '¿Cuáles son los parámetros en $f(x) = \frac{1}{2} \cdot 10^x$?'
    alternativas:
      - '$a = \frac{1}{2}$ y $b = 10$'
      - '$a = 10$ y $b = \frac{1}{2}$'
      - '$a = 5$ y $b = 10$'
    respuesta: '$a = \frac{1}{2}$ y $b = 10$'
    solucion_pasos:
      - '1. El término multiplicativo es $a = \frac{1}{2}$.'
      - '2. La base de la potencia es $b = 10$.'
  - titulo: 'Forma general mónica'
    enunciado: 'En la función $g(x) = 7^x$, ¿el coeficiente $a$ es igual a 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reescribimos $g(x) = 1 \cdot 7^x$, donde $a = 1$ y $b = 7$.'
  - titulo: 'Prioridad de la potencia'
    enunciado: '¿Evaluar $f(x) = 2 \cdot 3^x$ en $x = 3$ resulta $54$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $3^3 = 27$, y $2 \cdot 27 = 54$.'
  - titulo: 'Signo del coeficiente a'
    enunciado: 'En $h(x) = -4 \cdot 2^x$, ¿el signo negativo pertenece al coeficiente $a = -4$ y no a la base $b = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La base es $b = 2 > 0$, y el coeficiente de escala es $a = -4$.'
errores_frecuentes:
  - 'La función $f(x) = 4 \cdot 3^x$ se puede simplificar como $f(x) = 12^x$.'
  - 'En la función exponencial $f(x) = 5 \cdot 2^x$, la base es el número $5$.'
  - 'El parámetro $a$ en la forma general $a \cdot b^x$ no afecta el intercepto con el eje $y$.'
  - 'La expresión $f(x) = -3^x$ tiene una base negativa $b = -3$.'
  - 'Para evaluar $f(2)$ en $f(x) = 3 \cdot 4^x$, se multiplica $3 \cdot 4 = 12$ y luego se eleva al cuadrado obteniendo $144$.'
afirmaciones_verdaderas:
  - 'En la forma general $f(x) = a \cdot b^x$, el parámetro $a$ representa la imagen en $x = 0$ y $b$ es la base de la potencia.'
  - 'Por jerarquía de operaciones, en la expresión $a \cdot b^x$ la potencia $b^x$ debe calcularse antes de multiplicar por el coeficiente $a$.'
al_terminar_debes_poder: 'Reconocer e interpretar la forma general $f(x) = a \cdot b^x$ identificando adecuadamente los parámetros $a$ y $b$.'
