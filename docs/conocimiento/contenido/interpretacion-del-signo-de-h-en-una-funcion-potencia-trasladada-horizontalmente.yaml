semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: La interpretación del signo de $h$ en una función potencia $f(x) = a(x - h)^n$ establece que un binomio $(x - h)$ con $h > 0$ genera un desplazamiento hacia las abscisas positivas (derecha), mientras que $(x + c)$ con $c > 0$ genera un desplazamiento hacia las abscisas negativas (izquierda, $h = -c$).
explicacion_simple: "![La interpretación del signo de $h$ en una función potencia $f(x) = a(x - h)^n$ establece que un binomio $(x - h)$ con $h > 0$ genera un desplazamiento hacia las abscisas positivas (derecha), mientras que $(x + c)$ con $c > 0$ genera un desplazamiento hacia las abscisas negativas (izquierda, $h = -c$)](/static/img/nodos/interpretacion-del-signo-de-h-en-una-funcion-potencia-trasladada-horizontalmente-intro.svg)\n\n\n¿Por qué $(x - 3)$ mueve la gráfica hacia la DERECHA ($+3$) y $(x + 3)$ la mueve hacia la IZQUIERDA ($-3$)?\n\n- **El secreto de la compensación:**\n  - En la función base $y = x^4$, el punto más bajo está en $x = 0$ porque $0^4 = 0$.\n  - Para que $(x - 3)^4$ valga cero, necesitas que **$x - 3 = 0 \\implies x = +3$**. ¡Tuviste que avanzar hasta $+3$ para lograr lo que antes ocurría en $0$!\n  - Para que $(x + 5)^4$ valga cero, necesitas que **$x + 5 = 0 \\implies x = -5$**.\n- **Regla mnemotécnica:** La nueva posición del centro es siempre la **solución\
  \ de la ecuación $x - h = 0$**."
explicacion_formal: 'Sea $f(x) = x^n$ y $g(x) = f(x - h) = (x - h)^n$. La preimagen que produce el valor crítico $f(0) = 0$ satisface:

  $$x - h = 0 \Longleftrightarrow x = h$$

  Por lo tanto:

  1. Si $h > 0$: El argumento $(x - h)$ exige que la variable aumente en $h$ para evaluar las mismas imágenes de $f$, desplazando el conjunto de puntos en el sentido del vector positivo $\vec{v} = (+h, 0)$.

  2. Si $h = -c < 0$ ($c > 0$): El argumento $(x - (-c)) = (x + c)$ exige que la variable disminuya en $c$, desplazando los puntos en el sentido del vector negativo $\vec{v} = (-c, 0)$.'
definiciones_clave: '- **Ecuación de anulación de argumento**: Condición $x - h = 0$ que localiza la coordenada $x$ del centro transformado.

  - **Compensación de preimagen**: Mecanismo algebraico donde un retraso en el argumento requiere mayores valores de $x$.'
propiedades_relaciones: '- **Dualidad signo-sentido**: Binomio negativo $(x - h) \iff$ desplazamiento a la derecha $+h$; binomio positivo $(x + h) \iff$ desplazamiento a la izquierda $-h$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación del signo de $h$ en una función potencia $f(x) = a(x - h)^n$ establece que un binomio $(x - h)$ con $h > 0$ genera un desplazamiento hacia las abscisas positivas (derecha), mientras que $(x + c)$ con $c > 0$ genera un desplazamiento hacia las abscisas negativas (izquierda, $h = -c$)](/static/img/nodos/interpretacion-del-signo-de-h-en-una-funcion-potencia-trasladada-horizontalmente-ejemplos.svg)



    Resuelve la ecuación de anulación e interpreta el sentido del desplazamiento para:

    1) $f(x) = (x - 12)^6$

    2) $g(x) = (x + 8)^5$'
  pasos:
  - 'Paso 1: Para $f(x) = (x - 12)^6$:

    - Resolver: $x - 12 = 0 \implies \mathbf{x = +12}$.

    - Conclusión: Desplazamiento de **12 unidades hacia la DERECHA** ($h = +12$).'
  - 'Paso 2: Para $g(x) = (x + 8)^5$:

    - Resolver: $x + 8 = 0 \implies \mathbf{x = -8}$.

    - Conclusión: Desplazamiento de **8 unidades hacia la IZQUIERDA** ($h = -8$).'
checkpoints:
- placement: after_explicacion_formal
  question: Dada la función $f(x) = 3(x + 10)^4$, ¿cuál es el valor del parámetro de traslación horizontal h?
  choices:
  - text: h = -10 (desplazamiento a la izquierda)
    is_correct: true
  - text: h = +10 (desplazamiento a la derecha)
    is_correct: false
  - text: h = 3
    is_correct: false
  - text: h = 4
    is_correct: false
  explanation: La alternativa correcta es 'h = -10 (desplazamiento a la izquierda)'. En la forma canónica $a(x - h)^n$, $(x + 10) = (x - (-10))$, luego $h = -10$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué valor de x alcanza su mínimo la función $f(x) = (x - 4)^2$?
  choices:
  - text: En x = 4
    is_correct: true
  - text: En x = -4
    is_correct: false
  - text: En x = 0
    is_correct: false
  - text: En x = 16
    is_correct: false
  explanation: 'La alternativa correcta es ''En x = 4''. El mínimo ocurre cuando el binomio se hace cero: $x - 4 = 0 \implies x = 4$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el binomio elevado a la potencia $(x \pm c)$.'
- 'Paso 2: Igualar el interior del paréntesis a cero: $x \pm c = 0$.'
- 'Paso 3: Despejar $x$ para obtener el valor con signo de $h$.'
- 'Paso 4: Asignar la dirección: si $x = +c \implies$ Derecha; si $x = -c \implies$ Izquierda.'
errores_correccion: '- **Error común:** Pensar que $h$ es simplemente el número que se ve escrito sin cambiar de signo.

  - **Cómo corregirlo:** La forma estándar tiene un signo menos obligatorio $a(x - \mathbf{h})^n$. Por eso, si ves $(x + 4)$, debes descomponerlo como $(x - (\mathbf{-4}))$, concluyendo que $h = -4$.'
ejemplos:
- titulo: 'Ejemplo 1: Signo negativo en binomio'
  enunciado: 'En $f(x) = (x - 15)^3$, el valor de $h$ es:'
  alternativas:
  - h = 15
  - h = -15
  - h = 3
  - h = 0
  respuesta: h = 15
  solucion_pasos:
  - 'Paso 1: $x - 15 = 0 \implies h = 15$.'
- titulo: 'Ejemplo 2: Signo positivo en binomio'
  enunciado: 'En $g(x) = 2(x + 6)^4$, el valor de $h$ es:'
  alternativas:
  - h = -6
  - h = 6
  - h = 2
  - h = 4
  respuesta: h = -6
  solucion_pasos:
  - 'Paso 1: $x + 6 = 0 \implies h = -6$.'
- titulo: 'Ejemplo 3: Dirección de traslación'
  enunciado: 'La curva $y = (x + 2{,}5)^6$ se desplazó respecto a $y = x^6$ hacia:'
  alternativas:
  - La izquierda en 2,5 unidades
  - La derecha en 2,5 unidades
  - Arriba en 2,5 unidades
  - Abajo en 2,5 unidades
  respuesta: La izquierda en 2,5 unidades
  solucion_pasos:
  - 'Paso 1: $h = -2{,}5 \implies$ hacia la izquierda.'
- titulo: 'Ejemplo 4: Raíz del binomio'
  enunciado: ¿Para qué valor de $x$ se anula el término de potencia en $f(x) = -(x - 100)^3$?
  alternativas:
  - x = 100
  - x = -100
  - x = 0
  - x = 300
  respuesta: x = 100
  solucion_pasos:
  - 'Paso 1: $x - 100 = 0 \implies x = 100$.'
errores_frecuentes:
- Olvidar cambiar el signo del número dentro del paréntesis.
- Asociar el signo más (+) con movimiento hacia la derecha en el eje X.
- Confundir la traslación del eje X con la del eje Y.
afirmaciones_verdaderas:
- El centro de la función se ubica en el valor de x que satisface x - h = 0.
- Un binomio (x + c) corresponde a un parámetro h = -c y desplaza la gráfica a la izquierda.
al_terminar_debes_poder: '**QUÉ:** Interpretar rigurosamente el signo de h en una función potencia trasladada horizontalmente.


  **CÓMO:** Resolviendo la ecuación x - h = 0 para deducir la posición y dirección exacta del centro sobre el eje X.


