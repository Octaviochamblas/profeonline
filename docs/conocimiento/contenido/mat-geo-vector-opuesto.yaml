semantic_id: MAT.GEO.VECTORES_BASE.VECTOR_OPUESTO
resumen_inicial: 'Concepto de vector opuesto: conceptos, teoremas, propiedades geométricas
  y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'El vector opuesto de un vector es como su ''reflejo'': mismo
  tamaño, misma línea, pero apuntando exactamente hacia el lado contrario.'
explicacion_formal: '![Vector opuesto](/static/img/geometria/cartesiano-vectores/vector-opuesto.svg)


  ### Definición formal


  Si $\vec{v}=(v_x,v_y)$, su vector opuesto es $-\vec{v}=(-v_x,-v_y)$: se invierte
  el signo de cada componente, manteniendo el mismo módulo y dirección, pero sentido
  opuesto.


  ### Desarrollo didáctico


  En la figura, el vector $\vec{v}=(4,3)$ y su opuesto $-\vec{v}=(-4,-3)$ están sobre
  la misma línea (misma dirección) y tienen igual longitud (mismo módulo), pero apuntan
  hacia lados contrarios.'
definiciones_clave: '- **Concepto de vector opuesto**: Elemento o propiedad fundamental
  en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de vector opuesto.'
