procedimiento:
- 'Paso 1: Identifica las componentes del vector original v=(vx,vy).'
- 'Paso 2: Invierte el signo de cada componente para obtener -v=(-vx,-vy).'
- 'Paso 3: Verifica que el vector opuesto tenga el mismo módulo que el original, pero
  sentido contrario.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de vector opuesto.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de concepto de vector opuesto para determinar la
    medida solicitada.
  alternativas:
