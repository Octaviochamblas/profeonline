semantic_id: MAT.ALG.MCM_ALGEBRAICO.DENOMINADOR_COMUN
resumen_inicial: El m.c.m. algebraico de los denominadores actúa como el Mínimo Común
  Denominador para homogeneizar y operar fracciones algebraicas.
explicacion_simple: 'Para sumar o restar fracciones algebraicas que tienen distinto
  denominador:

  1. Calculamos el m.c.m. de todos sus denominadores. Este m.c.m. se convertirá en
  el denominador común de la operación.

  2. Dividimos el m.c.m. entre cada denominador original para hallar el factor de
  amplificación de esa fracción.

  3. Multiplicamos cada numerador por su respectivo factor de amplificación y sumamos
  o restamos los resultados sobre el m.c.m. común.'
explicacion_formal: 'Dada una suma o resta de fracciones algebraicas $\frac{A(x)}{P(x)}
  \pm \frac{B(x)}{Q(x)}$, se define el **Mínimo Común Denominador** $M(x) = \operatorname{mcm}(P(x),
  Q(x))$ para homogeneizar las fracciones:


  $$\frac{A(x)}{P(x)} \pm \frac{B(x)}{Q(x)} = \frac{A(x) \cdot C_1(x) \pm B(x) \cdot
  C_2(x)}{M(x)}$$


  donde $C_1(x) = \frac{M(x)}{P(x)}$ y $C_2(x) = \frac{M(x)}{Q(x)}$ son los factores
  de amplificación polinomiales enteros.


  > **Complemento didáctico:** Usar el m.c.m. como denominador común evita sobrecargar
  los numeradores con grados innecesariamente altos, garantizando la expresión homogeneizada
  más simple posible.'
definiciones_clave: '- **Mínimo Común Denominador (M.C.D.n.)**: El m.c.m. de los denominadores
  de un conjunto de fracciones algebraicas.

  - **Factor de amplificación**: Expresión por la cual se multiplica el numerador
  de una fracción al convertir su denominador al m.c.m. común.'
propiedades_relaciones: '- **Simplificación de operaciones**: El m.c.m. como denominador
  común produce numeradores de menor grado comparado con multiplicar todos los denominadores
  a ciegas.

  - **Preservación del valor**: Amplificar cada fracción por $C_i(x) / C_i(x) = 1$
  no altera el valor numérico de las fracciones originales.'
ejemplo_guiado:
  enunciado: Homogeneiza y expresa como una sola fracción la suma $\frac{3}{2x} +
    \frac{5}{3x^2}$. Determina la fracción resultante ($\frac{9x + 10}{6x^2}$) y evalúa
    su valor para $x = 2$.
  pasos:
  - 'Paso 1: Hallar el m.c.m. de los denominadores $2x$ y $3x^2$. Coeficientes m.c.m.(2,3)=6;
    variables $x^2$. El denominador común es $6x^2$.Paso 2: Calcular los factores
    de amplificación: para la primera fracción $6x^2 \div 2x = 3x$; para la segunda
    $6x^2 \div 3x^2 = 2$.Paso 3: Amplificar numeradores y sumar: $\frac{3(3x) + 5(2)}{6x^2}
    = \frac{9x + 10}{6x^2}$.Paso 4: Evaluar para $x = 2$: $\frac{9(2) + 10}{6(2)^2}
    = \frac{18 + 10}{6(4)} = \frac{28}{24} = \frac{7}{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión homogeneizada de $\frac{3}{2x} + \frac{5}{3x^2}$
    con denominador común m.c.m.?
  choices:
  - text: $\frac{9x + 10}{6x^2}$
    is_correct: true
  - text: $\frac{8}{5x^3}$
    is_correct: false
  - text: $\frac{15x + 6}{6x^2}$
    is_correct: false
  - text: $\frac{9x + 10}{5x^3}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{9x + 10}{6x^2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la fracción $\frac{9x + 10}{6x^2}$ para $x = 2$, ¿cuál es el
    resultado simplificado?
  choices:
  - text: $\frac{7}{6}$
    is_correct: true
  - text: $\frac{28}{12}$
    is_correct: false
  - text: $\frac{5}{3}$
    is_correct: false
  - text: $\frac{7}{12}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{7}{6}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar todos los denominadores de las fracciones a sumar o restar.'
- 'Paso 2: Calcular el m.c.m. de los denominadores para obtener el denominador común.'
- 'Paso 3: Para cada fracción, dividir el m.c.m. entre su denominador original para
  encontrar el factor de amplificación.'
- 'Paso 4: Multiplicar cada numerador por su factor de amplificación y combinar los
  términos sobre el denominador común.'
errores_correccion: '- **Error común:** Sumar los numeradores y los denominadores
  directamente (ejemplo: $\frac{a}{b} + \frac{c}{d} = \frac{a+c}{b+d}$).

  - **Cómo corregirlo:** Jamás sumes denominadores. Primero debes encontrar el m.c.m.
  de los denominadores y homogenizar las fracciones antes de sumar numeradores.'
ejemplos:
- titulo: 'Ejemplo 1: Denominador común con binomios simples'
  enunciado: ¿Cuál es el denominador común m.c.m. para sumar $\frac{1}{x - 1}$ y $\frac{2}{x
    + 1}$?
  alternativas:
  - $(x - 1)(x + 1)$
  - $x^2 + 1$
  - $2x$
  respuesta: $(x - 1)(x + 1)$
  solucion_pasos:
  - '1. Denominadores: $(x - 1)$ y $(x + 1)$.2. Al ser primos entre sí, su m.c.m.
    es el producto $(x - 1)(x + 1) = x^2 - 1$.'
- titulo: 'Ejemplo 2: Amplificación de numerador'
  enunciado: Al convertir $\frac{4}{x + 2}$ al denominador común $(x + 2)(x - 3)$,
    ¿cuál es el nuevo numerador amplificado?
  alternativas:
  - $4(x - 3)$
  - $4(x + 2)$
  - $4x - 3$
  respuesta: $4(x - 3)$
  solucion_pasos:
  - '1. Denominador común: $(x + 2)(x - 3)$.2. Factor de amplificación: $(x + 2)(x
    - 3) \div (x + 2) = (x - 3)$.3. Nuevo numerador: $4(x - 3) = 4x - 12$.'
- titulo: ¿El m.c.m. de los denominadores evita trabajar con numeradores de grado
    innecesariamente alto?
  respuesta: Sí
  solucion_pasos:
  - Sí. El m.c.m. es el menor denominador común, lo que previene sobre-amplificar
    las fracciones.
- titulo: ¿Al homogeneizar $\frac{1}{x} + \frac{1}{x^2}$, el denominador común m.c.m.
    es $x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el m.c.m. entre $x$ y $x^2$ toma la mayor potencia de $x$, que es $x^2$.
errores_frecuentes:
- Sumar numeradores y denominadores directamente sin hallar denominador común.
- Usar el producto de denominadores cuando el m.c.m. permitiría un denominador de
  menor grado.
- Olvidar multiplicar el numerador por el factor de amplificación tras cambiar el
  denominador.
- Simplificar términos del numerador con el denominador común antes de realizar la
  suma.
- Confundir el M.C.D. de los denominadores con el m.c.m. de los denominadores.
afirmaciones_verdaderas:
- El m.c.m. algebraico de los denominadores constituye el denominador común más simple
  para sumar o restar fracciones.
- Cada numerador debe multiplicarse por el resultado de dividir el m.c.m. común entre
  el denominador original de su fracción.
al_terminar_debes_poder: Al finalizar este recurso podrás usar el m.c.m. algebraico
  como denominador común para homogeneizar y operar sumas o restas de fracciones algebraicas.
