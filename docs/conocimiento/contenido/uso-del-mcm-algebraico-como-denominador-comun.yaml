procedimiento:
- 'Paso 1: Si tienes una suma/resta de fracciones, toma solo la parte inferior (los
  denominadores).'
- 'Paso 2: Factorízalos completamente (cada uno por separado).'
- 'Paso 3: Extrae el MCM de esos denominadores factorizados.'
- 'Paso 4: Dibuja una línea de fracción larga y escribe tu MCM en la parte inferior.
  Estás listo para amplificar.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en uso del m.c.m. algebraico como denominador común.
ejemplos:
- titulo: Determina el denominador común para $\frac{5}{3x} + \frac{2}{x^2}$
  enunciado: Determina el denominador común para $\frac{5}{3x} + \frac{2}{x^2}$.
  solucion_pasos:
  - Los denominadores son $3x$ y $x^2$.
  - MCM numérico de 3 y 1 es 3.
  - MCM de las letras es $x^2$ (mayor exponente).
  - El denominador común será $3x^2$.
- titulo: Halla el denominador común para $\frac{1}{a} - \frac{1}{a+b}$.
  solucion_pasos:
  - 'Los denominadores son ''a'' y ''(a+b)''. Son factores distintos, por lo que el
    MCM es su producto: $a(a+b)$.'
- titulo: 'Respecto de «Uso del m.c.m. algebraico como denominador común»: ¿La siguiente
    formulación es'
  enunciado: 'Respecto de «Uso del m.c.m. algebraico como denominador común»: ¿La
    siguiente formulación es correcta? «Al sumar o restar fracciones algebraicas con
    denominadores distintos, el MCM de esos denominadores se convierte en el nuevo
    denominador común, garantizando la expresión más simplificada posible»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al sumar o restar fracciones
    algebraicas con denominadores distintos, el MCM de esos denominadores se convierte
    en el nuevo denominador común, garantizando la expresión más simplificada posible.'
- titulo: 'Respecto de «Uso del m.c.m. algebraico como denominador común»: ¿La siguiente
    conclusión es'
  enunciado: 'Respecto de «Uso del m.c.m. algebraico como denominador común»: ¿La
    siguiente conclusión es correcta? «Creer que el denominador común SIEMPRE es la
    simple multiplicación de todos los denominadores juntos. (Multiplicarlos funciona
    matemáticamente, pero a menudo no es el MÍNIMO y resultará en un monstruo gigante
    imposible de reducir después)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al sumar o restar fracciones
    algebraicas con denominadores distintos, el MCM de esos denominadores se convierte
    en el nuevo denominador común, garantizando la expresión más simplificada posible.'
errores_frecuentes:
- Creer que el denominador común SIEMPRE es la simple multiplicación de todos los
  denominadores juntos. (Multiplicarlos funciona matemáticamente, pero a menudo no
  es el MÍNIMO y resultará en un monstruo gigante imposible de reducir después).
- Porque permite multiplicar las fracciones más rápido.
- Para simplificar la fracción final a cero.
- Para «¿Por qué es crucial calcular el Mínimo Común Múltiplo al sumar fracciones
  algebraicas», la respuesta correcta es Es un paso opcional sin importancia.
- $m-n$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
