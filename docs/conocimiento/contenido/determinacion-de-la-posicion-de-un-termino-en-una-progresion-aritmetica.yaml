procedimiento:
- 'Paso 1: Resta el término final menos el término inicial ($a_n - a_1$).'
- 'Paso 2: Divide ese resultado por la diferencia constante ''d''.'
- 'Paso 3: Súmale 1 al resultado de la división.'
- 'Paso 4: Comprueba que tu respuesta sea un número natural (no puede existir la posición
  3.5 o -2).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en determinación de la posición de un término en una progresión aritmética.
ejemplos:
- titulo: ¿Qué número de cliente eres?
  enunciado: La sucesión es 15, 20, 25... ¿En qué posición se encuentra el número 105?
  solucion_pasos:
  - a1 = 15, d = 5. Destino an = 105.
  - 'Distancia total: 105 - 15 = 90.'
  - 'Pasos dados: 90 / 5 = 18.'
  - 'Posición final: 18 + 1 = 19.'
  - El 105 está en la posición 19.
- titulo: Ejemplo 1
  enunciado: En 3, 7, 11, ¿qué posición ocupa el término 39?
  alternativas:
  - '10'
  - '9'
  - '11'
  respuesta: '10'
  solucion_pasos:
  - (39 menos 3) dividido entre 4, más 1, es igual a 9 más 1, o sea 10.
- titulo: Ejemplo 2
  enunciado: En 50, 45, 40, ¿qué posición ocupa el término 5?
  alternativas:
  - '10'
  - '9'
  - '11'
  respuesta: '10'
  solucion_pasos:
  - (5 menos 50) dividido entre (-5), más 1, es igual a 9 más 1, o sea 10.
- titulo: ¿Si el cálculo de n da un número decimal, ese valor pertenece a la progresión?
  respuesta: 'No'
  solucion_pasos:
  - Si n no es un número natural, ese valor no forma parte de la progresión.
- titulo: ¿Se puede calcular la posición de un término sin conocer d?
  respuesta: 'No'
  solucion_pasos:
  - d es indispensable para saber cuántos pasos se dieron desde el primer término.
errores_frecuentes:
- Olvidar sumar el '+1' al final del despeje, entregando como respuesta solo el número de
  'saltos'.
- Dividir por 'd' antes de haber hecho la resta $a_n - a_1$ (error de jerarquía de fracciones).
- Olvidar sumar 1 al final del cálculo.
- Dividir por d antes de haber restado a_1.
- No verificar que el resultado sea un número entero positivo, lo que indicaría un error en
  los datos.
afirmaciones_verdaderas:
- La formulación de determinación de la posición de un término en una progresión aritmética
  mantiene la regularidad de la sucesión.
- El resultado de calcular la posición n en una progresión aritmética siempre debe ser un
  número natural.
