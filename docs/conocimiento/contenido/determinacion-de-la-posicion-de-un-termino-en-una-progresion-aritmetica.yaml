semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_POSICION
resumen_inicial: 'La determinación de la posición $n$ de un término despeja el índice mediante $n = \frac{a_n - a_1}{d} + 1$, exigiendo que $n$ pertenezca a los números naturales ($n \in \mathbb{N}$) como criterio de pertenencia.'
explicacion_simple: |
  Si te dan un número y quieres saber **en qué lugar de la fila está**:
  - Despejamos la posición ($n$) con esta regla:
    $$n = \frac{a_n - a_1}{d} + 1$$
  - Pasos a seguir:
    1. Restas el número menos el primer término ($a_n - a_1$).
    2. Divides ese resultado entre el paso ($d$).
    3. Al final, **sumas $1$**.
  - **Importante:** La posición $n$ debe ser un número entero positivo ($1, 2, 3, \dots$). Si te da un número decimal, significa que ese número **no pertenece a la progresión**.

  ![Determinación de la posición de un término](/static/img/nodos/determinacion-de-la-posicion-de-un-termino-en-una-progresion-aritmetica-intro.svg)
explicacion_formal: |
  ### Deducción formal por Despeje
  A partir de la ecuación canónica de la progresión aritmética:
  $$a_n = a_1 + (n - 1)d$$
  1. Restamos $a_1$ a ambos miembros: $a_n - a_1 = (n - 1)d$.
  2. Dividimos por $d$ ($d \neq 0$): $\frac{a_n - a_1}{d} = n - 1$.
  3. Sumamos $1$:
     $$n = \frac{a_n - a_1}{d} + 1$$

  ### Criterio de Pertenencia a la Progresión
  Un número real $x \in \mathbb{R}$ pertenece a la progresión aritmética $(a_n)$ si y solo si el valor resultante de la evaluación:
  $$n(x) = \frac{x - a_1}{d} + 1$$
  satisface que **$n(x) \in \mathbb{N} = \{1, 2, 3, \dots\}$**. Si $n(x) \notin \mathbb{N}$, el valor $x$ no forma parte de la secuencia.

  ### Síntesis didáctica
  - Ecuación de posición: $n = \frac{a_n - a_1}{d} + 1$.
  - Validación: $n \in \{1, 2, 3, \dots\}$.
definiciones_clave: |
  - **Posición ordinal ($n$)**: Índice entero positivo que ubica al término en la sucesión.
  - **Criterio de pertenencia**: Condición algebraica que exige que $(a_n - a_1)$ sea un múltiplo entero exacto de $d$.
  - **Término objetivo ($a_n$)**: Valor numérico cuya ubicación en la secuencia se desea determinar.
propiedades_relaciones: |
  - **Divisibilidad estricta**: $x$ está en la PA si y solo si $d$ divide exactamente a $(x - a_1)$ con cociente mayor o igual a cero.
  - **Biyección posicional**: Para cada valor que pertenece a la PA le corresponde una única posición $n$.
ejemplo_guiado:
  enunciado: 'En la progresión aritmética $(5, 9, 13, 17, \dots)$, determina qué posición ocupa el número $81$ y averigua si el número $95$ pertenece a la progresión.'
  imagen: '/static/img/nodos/determinacion-de-la-posicion-de-un-termino-en-una-progresion-aritmetica-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $a_1 = 5$ y $d = 9 - 5 = 4$.'
    - 'Paso 2: Para $a_n = 81$: $n = \frac{81 - 5}{4} + 1 = \frac{76}{4} + 1 = 19 + 1 = 20$. Como $20 \in \mathbb{N}$, el número $81$ ocupa la **posición $n = 20$**.'
    - 'Paso 3: Para el número $95$: $n = \frac{95 - 5}{4} + 1 = \frac{90}{4} + 1 = 22,5 + 1 = 23,5$.'
    - 'Paso 4: Como $23,5 \notin \mathbb{N}$, el número $95$ **no pertenece** a la progresión aritmética.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre si al despejar la posición $n$ de un valor en una PA se obtiene un número decimal como $14,4$?'
    choices:
      - {text: 'El valor evaluado no pertenece a la progresión aritmética, ya que $n$ debe ser un número entero positivo', is_correct: true}
      - {text: 'Se redondea al entero más cercano ($n=14$)', is_correct: false}
      - {text: 'La progresión tiene un error de cálculo en su fórmula', is_correct: false}
      - {text: 'Significa que ocupa dos posiciones simultáneamente', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor evaluado no pertenece a la progresión aritmética, ya que $n$ debe ser un número entero positivo''. El dominio de las sucesiones está restringido a $\mathbb{N}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la PA $(7, 12, 17, 22, \dots)$, ¿qué lugar ocupa el término $62$?'
    choices:
      - {text: '$n = 12$, calculando $\frac{62 - 7}{5} + 1 = \frac{55}{5} + 1 = 11 + 1 = 12$', is_correct: true}
      - {text: '$n = 11$, olvidando sumar 1 al final', is_correct: false}
      - {text: '$n = 10$', is_correct: false}
      - {text: '$n = 62$', is_correct: false}
    explanation: 'La alternativa correcta es ''$n = 12$, calculando $\frac{62 - 7}{5} + 1 = \frac{55}{5} + 1 = 11 + 1 = 12$''. Con $a_1=7$ y $d=5$, la posición es 12.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$, la diferencia común $d$ y el valor a evaluar $a_n$.'
  - 'Paso 2: Restar $a_n - a_1$.'
  - 'Paso 3: Dividir la resta entre la diferencia $d$.'
  - 'Paso 4: Sumar 1 al cociente obtenido: $n = \frac{a_n - a_1}{d} + 1$.'
  - 'Paso 5: Comprobar que $n$ sea un número natural ($n \in \{1, 2, 3, \dots\}$).'
errores_correccion: |
  - **Error 1:** Olvidar sumar 1 al final del despeje (calcular solo $\frac{a_n - a_1}{d}$). **Cómo corregirlo:** La fórmula de la posición es **$n = \frac{a_n - a_1}{d} + 1$** (sumar obligatoriamente 1).
  - **Error 2:** Redondear decimales para forzar la pertenencia de un número que no está en la progresión. **Cómo corregirlo:** Si $n$ no es entero, **el número no pertenece a la sucesión**.
ejemplos:
  - titulo: 'Posición de un término dado'
    enunciado: 'En la PA $(4, 10, 16, 22, \dots)$, ¿qué posición ocupa el número $100$?'
    alternativas:
      - '$n = 17$'
      - '$n = 16$'
      - '$n = 18$'
    respuesta: '$n = 17$'
    solucion_pasos:
      - '1. $a_1 = 4, d = 6$.'
      - '2. $n = (100 - 4)/6 + 1 = 96/6 + 1 = 16 + 1 = 17$.'
  - titulo: 'Verificación de pertenencia'
    enunciado: '¿El número $50$ pertenece a la progresión aritmética $3, 7, 11, 15, \dots$?'
    alternativas:
      - 'No, porque $(50-3)/4 + 1 = 47/4 + 1 = 12,75$ (no es entero)'
      - 'Sí, ocupa la posición 12'
      - 'Sí, ocupa la posición 13'
    respuesta: 'No, porque $(50-3)/4 + 1 = 47/4 + 1 = 12,75$ (no es entero)'
    solucion_pasos:
      - '1. $47$ no es divisible por $4 \implies n \notin \mathbb{N}$.'
  - titulo: 'Posición con diferencia negativa'
    enunciado: 'En la PA $(50, 45, 40, \dots)$, ¿el término $0$ ocupa la posición $n=11$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $n = (0 - 50)/(-5) + 1 = -50/-5 + 1 = 10 + 1 = 11$.'
  - titulo: 'Condición de posición entera'
    enunciado: '¿La posición de un término en una progresión aritmética puede ser un número fraccionario como $\frac{7}{2}$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Las posiciones ordinales deben ser números enteros positivos $\mathbb{N}$.'
errores_frecuentes:
  - 'Al despejar la posición $n$ de un término se omite sumar uno al resultado de dividir $(a_n - a_1)$ por $d$.'
  - 'Cuando el cálculo de la posición entrega un número decimal, este se redondea al entero más cercano.'
  - 'La posición $n$ puede admitir valores negativos en una progresión con términos negativos.'
  - 'Al evaluar la pertenencia en una PA decreciente, se omite el signo negativo de la diferencia común.'
  - 'Un número siempre pertenece a una PA sin importar si $(a_n - a_1)$ es múltiplo de la diferencia común.'
afirmaciones_verdaderas:
  - 'La posición de un término se obtiene mediante $n = \frac{a_n - a_1}{d} + 1$ y debe ser un número entero positivo ($n \in \mathbb{N}$).'
  - 'Un número real pertenece a una progresión aritmética si y solo si la diferencia $(x - a_1)$ es un múltiplo exacto no negativo de $d$.'
