ejemplo_guiado:
  enunciado: En la progresión aritmética 4, 9, 14, ¿en qué posición se encuentra el término
    74?
  pasos:
  - Identifico a_1 igual a 4 y d igual a 5.
  - 'Aplico la fórmula despejada: n igual a (74 menos 4) dividido entre 5, más 1.'
  - Calculo 70 dividido entre 5 igual a 14, más 1 igual a 15. El término 74 ocupa la posición
    15.
