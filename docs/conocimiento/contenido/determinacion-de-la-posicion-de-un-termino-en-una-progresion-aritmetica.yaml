resumen_inicial: 'La determinación de la posición o índice $n$ de un valor $a_n$ despeja
  el número de orden en la fórmula general: $n = \frac{a_n - a_1}{d} + 1$.'
explicacion_simple: Si nos dan un número de la secuencia y queremos averiguar en qué
  lugar o posición está ubicado, le restamos el primer número, dividimos por la diferencia
  y al resultado le sumamos 1.
explicacion_formal: 'Dado un valor de término $a_n$, el primer término $a_1$ y la
  diferencia $d \neq 0$, la **Posición Ordinal $n$** se despeja mediante:


  $$a_n - a_1 = (n - 1) \cdot d \implies n - 1 = \frac{a_n - a_1}{d} \implies n =
  \frac{a_n - a_1}{d} + 1$$


  **Criterio de pertenencia:**

  - El valor $n$ obtenido DEBE ser un número entero positivo ($n \in \mathbb{N}^+$)
  para pertenecer verdaderamente a la progresión.'
definiciones_clave: '- **Cálculo del índice $n$**: Despeje posicional $n = \frac{a_n
  - a_1}{d} + 1$.'
propiedades_relaciones: '- **Condición de entero positivo**: $n$ debe resultar entero
  para que el término pertenezca a la P.A.'
ejemplo_guiado:
  enunciado: En la P.A. $(4, 7, 10, 13, \dots)$, determine qué posición $n$ ocupa
    el número $31$.
  pasos:
  - 'Paso 1: Identificar $a_1 = 4$, $d = 3$ y $a_n = 31$.'
  - 'Paso 2: Aplicar el despeje de $n$: $n = \frac{a_n - a_1}{d} + 1 = \frac{31 -
    4}{3} + 1$.'
  - 'Paso 3: Resolver la fracción: $n = \frac{27}{3} + 1 = 9 + 1 = 10$.'
  - 'Conclusión: El número $31$ ocupa la posición décima ($n = 10$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para despejar la posición n de un término an en una
    P.A.?
  choices:
  - text: n = ((an - a1) / d) + 1
    is_correct: true
  - text: n = (an - a1) · d
    is_correct: false
  - text: n = an / (a1 · d)
    is_correct: false
  - text: n = (an + a1) / d
    is_correct: false
  explanation: La alternativa correcta es 'n = ((an - a1) / d) + 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el número 31 en la P.A. (4, 7, 10, ...), ¿qué
    posición n ocupó?
  choices:
  - text: Posición n = 10
    is_correct: true
  - text: Posición n = 9
    is_correct: false
  - text: Posición n = 11
    is_correct: false
  - text: Posición n = 8
    is_correct: false
  explanation: La alternativa correcta es 'Posición n = 10'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de determinar la posición ordinal
  $n = \frac{a_n - a_1}{d} + 1$ de un término dentro de una P.A.
semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_INDICE
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.CALCULO_INDICE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
estado: publicado
