semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_INDICE
resumen_inicial: 'Determinación de la posición de un término en una progresión aritmética:
  concepto y desarrollo dentro de Progresión aritmética.'
explicacion_simple: ¿A qué hora llegará el tren a la estación número 50? Ya sabemos calcular
  el número conociendo la posición, pero ¿y si te dan el número y te preguntan en qué asiento
  va sentado? Esto requiere encontrar la incógnita 'n'.
explicacion_formal: 'Supongamos que el primer término es 3 ($a_1=3$) y vas sumando 4 ($d=4$).
  De repente encuentras el número 43. ¿Qué posición ocupa en la lista?


  Volvemos a nuestra fiel ecuación $a_n = a_1 + (n-1)d$, pero ahora la incógnita es ''$n$''.

  **Fórmula despejada para el índice:**

  $n = \frac{a_n - a_1}{d} + 1$


  Traducción lógica: ''Resto mi destino menos el inicio para saber la distancia total. Divido
  por el tamaño del paso para saber cuántos pasos di. Y le sumo 1 porque ya estaba parado
  en el primer casillero''.


  Resolviendo el ejemplo:

  - $n = \frac{43 - 3}{4} + 1$

  - $n = \frac{40}{4} + 1$

  - $n = 10 + 1 = 11$

  El número 43 está en la 11va posición.'
definiciones_clave: '- **Determinación de la posición de un término en una progresión aritmética**:
  Concepto fundamental dentro del estudio de Progresión aritmética.'
propiedades_relaciones: '- **Propiedades de Determinación de la posición de un término en
  una progresión aritmética**: Relaciones de cambio y fórmulas estructurales de progresión
