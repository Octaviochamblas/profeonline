semantic_id: MAT.NUM.PROG_ARITMETICA.CALCULO_INDICE
resumen_inicial: 'La determinación de la posición de un término despeja la variable de posición ordinal $n$ en la fórmula del término general: $n = \frac{a_n - a_1}{d} + 1$.'
explicacion_simple: |
  Si sabes que en una lista de números está el valor $77$ (por ejemplo, en la secuencia $5, 9, 13, 17, \dots$) y quieres averiguar **en qué casilla o número de lugar ($n$) está ubicado**:
  1. Restas ese número menos el primero: $77 - 5 = 72$.
  2. Divides el resultado por la diferencia entre números ($d = 4$): $72 \div 4 = 18$.
  3. Le sumas $1$ para obtener la posición: $18 + 1 = 19$.
  El número $77$ ocupa el **lugar 19** de la progresión ($a_{19} = 77$).
explicacion_formal: |
  ### Definición formal
  La **posición ordinal $n$** correspondiente a un valor real $a_n$ en una progresión aritmética se obtiene aislando la variable discreta $n$ en la ecuación canónica:
  $$a_n = a_1 + (n - 1)d \implies a_n - a_1 = (n - 1)d \implies \frac{a_n - a_1}{d} = n - 1 \implies n = \frac{a_n - a_1}{d} + 1$$

  ### Condición de Pertenencia a la Progresión
  Un número $V \in \mathbb{R}$ pertenece a la progresión aritmética $(a_n)$ si y solo si la posición calculada $n$ satisface:
  $$n = \frac{V - a_1}{d} + 1 \in \mathbb{N} = \{1, 2, 3, \dots\}$$
  - Si $n$ resulta ser un entero positivo, $V$ pertenece a la P.A. y ocupa el lugar $n$.
  - Si $n$ resulta ser un número decimal, fraccionario o no positivo ($n \le 0$), el valor $V$ **no pertenece** a la progresión.

  ### Síntesis didáctica
  - Ecuación del índice: $n = \frac{a_n - a_1}{d} + 1$.
  - Criterio de pertenencia: $n \in \mathbb{Z}^+$.
definiciones_clave: |
  - **Índice de posición ($n$)**: Número natural que indica la ubicación ordinal del término.
  - **Criterio de pertenencia integrática**: Exigencia algebraica de que $n$ sea un entero estrictamente positivo.
  - **Despeje de variable discreta**: Aislamiento de $n$ en el exponente/multiplicador de la ecuación afín.
propiedades_relaciones: |
  - **Divisibilidad exacta**: Para que un número $V$ pertenezca a la P.A., la diferencia $(V - a_1)$ debe ser divisible de forma exacta entre $d$.
  - **Biyección de posiciones**: Cada valor válido de la progresión se asocia a un único lugar $n$ unívoco.
ejemplo_guiado:
  enunciado: 'En la progresión aritmética $8, 14, 20, 26, \dots$, determina qué lugar ocupa el número $116$ y comprueba si el número $50$ pertenece a la secuencia.'
  pasos:
    - 'Paso 1: Identificamos $a_1 = 8$ y la diferencia $d = 14 - 8 = 6$.'
    - 'Paso 2: Para el número $116$, aplicamos la fórmula del índice: $n = \frac{116 - 8}{6} + 1 = \frac{108}{6} + 1 = 18 + 1 = 19$. El número 116 ocupa el **lugar 19**.'
    - 'Paso 3: Para el número $50$, aplicamos la fórmula: $n = \frac{50 - 8}{6} + 1 = \frac{42}{6} + 1 = 7 + 1 = 8$. El número 50 ocupa el **lugar 8**.'
    - 'Paso 4: Ambos valores pertenecen a la secuencia por ser **enteros positivos**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la posición ordinal $n$ de un término $a_n$ en una progresión aritmética?'
    choices:
      - {text: 'Dividir la resta del término menos el primero entre la diferencia y sumar 1 ($n = \frac{a_n - a_1}{d} + 1$)', is_correct: true}
      - {text: 'Multiplicar el término por la diferencia y restar el primer término', is_correct: false}
      - {text: 'Dividir el término directamente entre la posición deseada', is_correct: false}
      - {text: 'Restar el primer término al número de posición $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir la resta del término menos el primero entre la diferencia y sumar 1 ($n = \frac{a_n - a_1}{d} + 1$)''. Despeja $n$ de $a_n = a_1 + (n-1)d$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al calcular la posición de un número en una P.A. obtienes $n = 12,4$, ¿qué concluyes sobre la pertenencia de dicho número a la progresión?'
    choices:
      - {text: 'El número no pertenece a la progresión aritmética porque la posición $n$ debe ser un número entero positivo', is_correct: true}
      - {text: 'El número ocupa la posición 12 redondeando hacia abajo', is_correct: false}
      - {text: 'El número ocupa la posición 13 redondeando hacia arriba', is_correct: false}
      - {text: 'La progresión es decreciente y de diferencia negativa', is_correct: false}
    explanation: 'La alternativa correcta es ''El número no pertenece a la progresión aritmética porque la posición $n$ debe ser un número entero positivo''. Las posiciones deben ser enteros.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$, la diferencia común $d$ y el valor numérico $a_n$.'
  - 'Paso 2: Restar el primer término al valor numérico: $(a_n - a_1)$.'
  - 'Paso 3: Dividir el resultado entre la diferencia común: $\frac{a_n - a_1}{d}$.'
  - 'Paso 4: Sumar 1 al cociente obtenido para hallar la posición $n$, e interpretar si $n \in \mathbb{N}$.'
errores_correccion: |
  - **Error 1:** Olvidar sumar la constante 1 al final del despeje (quedarse con $\frac{a_n - a_1}{d}$). **Cómo corregirlo:** La expresión $\frac{a_n - a_1}{d}$ equivale a $(n-1)$; **DEBES sumar 1 para despejar la posición $n$**.
  - **Error 2:** Aceptar posiciones decimales o negativas como válidas. **Cómo corregirlo:** Las posiciones ordinales **son números enteros positivos**: si da decimal, el número no pertenece a la P.A.
ejemplos:
  - titulo: 'Cálculo de posición exacta'
    enunciado: 'En $a_1 = 3$ y $d = 5$, ¿el número $48$ ocupa la posición $n = \frac{48 - 3}{5} + 1 = \frac{45}{5} + 1 = 9 + 1 = 10$?'
    alternativas:
      - 'Sí, ocupa la posición 10'
      - 'No, ocupa la posición 9'
      - 'No, no pertenece a la P.A.'
    respuesta: 'Sí, ocupa la posición 10'
    solucion_pasos:
      - '1. Resta: $48 - 3 = 45$.'
      - '2. División: $45 / 5 = 9$.'
      - '3. Suma 1: $9 + 1 = 10$.'
  - titulo: 'Prueba de no pertenencia'
    enunciado: 'En la P.A. anterior ($a_1 = 3, d = 5$), ¿el número $20$ pertenece a la progresión?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. $n = (20 - 3)/5 + 1 = 17/5 + 1 = 3,4 + 1 = 4,4 \notin \mathbb{N}$.'
  - titulo: 'Posición con diferencia negativa'
    enunciado: 'En $a_1 = 50$ y $d = -4$, ¿qué posición ocupa el término $a_n = 10$?'
    respuesta: 'Posición n = 11'
    solucion_pasos:
      - 'Sí. $n = \frac{10 - 50}{-4} + 1 = \frac{-40}{-4} + 1 = 10 + 1 = 11$.'
  - titulo: 'Lugar del primer término'
    enunciado: 'Para $a_n = a_1$, ¿la fórmula entrega $n = \frac{a_1 - a_1}{d} + 1 = 0 + 1 = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El primer término ocupa la posición 1.'
errores_frecuentes:
  - 'La posición $n$ se obtiene directamente del cociente $\frac{a_n - a_1}{d}$ sin necesidad de sumar 1.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Aceptar posiciones decimales o fraccionarias como respuestas válidas a problemas de conteo.'
  - 'Invertir el numerador haciendo $a_1 - a_n$ afectando el signo de la división.'
afirmaciones_verdaderas:
  - 'La posición $n$ de un término $a_n$ en una P.A. se calcula mediante $n = \frac{a_n - a_1}{d} + 1$.'
  - 'Un valor numérico pertenece a una progresión aritmética si y solo si la posición $n$ calculada resulta ser un número entero positivo.'
