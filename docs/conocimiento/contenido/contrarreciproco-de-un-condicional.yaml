semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.CONDICIONAL_CONTRARRECIPROCO
resumen_inicial: 'Definición, demostración y aplicaciones de la ley del contrarrecíproco: $p \to q \equiv \neg q \to \neg p$, base del método de demostración por contraposición.'
explicacion_simple: 'El **contrarrecíproco** (o contrapositivo) es una de las reglas más poderosas y útiles de toda la matemática. Se obtiene haciendo dos cosas a la vez: **intercambiar el orden de las frases Y negar ambas frases**. A partir de "Si $p$, entonces $q$" ($p \to q$), formamos **"Si no $q$, entonces no $p$" ($\neg q \to \neg p$)**. A diferencia del recíproco y del inverso, **el contrarrecíproco SÍ es 100% equivalente al condicional directo**. Por ejemplo: "Si llueve, hay nubes" significa exactamente lo mismo que "Si no hay nubes, no llueve".


  ![Infografía: Contrarrecíproco de un Condicional](/static/img/nodos/contrarreciproco-de-un-condicional-intro.svg)'
explicacion_formal: "### Definición formal\nDado un condicional directo $\\Phi = p \\to q$, su **proposición contrarrecíproca (o contrapositiva)** es la fórmula resultante de invertir el sentido de implicación y negar simultáneamente ambos literales:\n$$\\text{Contrarrecíproco}(p \\to q) = \\neg q \\to \\neg p$$\nEn el cálculo proposicional clásico, la **Ley del Contrarrecíproco (o Ley de Contraposición)** establece una equivalencia lógica estricta:\n$$p \\to q \\equiv \\neg q \\to \\neg p \\quad \\iff \\quad \\models (p \\to q) \\leftrightarrow (\\neg q \\to \\neg p)$$\n\n### Desglose simbólico\n- Vector de salida directo: $\\mathbf{v}(p \\to q) = [V, F, V, V]^T$.\n- Vector de salida contrarrecíproco: $\\mathbf{v}(\\neg q \\to \\neg p) = [F \\to F, V \\to F, F \\to V, V \\to V]^T = [V, F, V, V]^T$.\n- Demostración algebraica:\n  $$\\neg q \\to \\neg p \\equiv \\neg(\\neg q) \\lor \\neg p \\equiv q \\lor \\neg p \\equiv \\neg p \\lor q \\equiv p \\to q$$\n\n### Síntesis didáctica\nDemostrar\
  \ un teorema en su forma directa $p \\implies q$ es matemáticamente indistinguible de demostrar su forma contrapositiva $\\neg q \\implies \\neg p$.\n"
definiciones_clave: '- **Contrarrecíproco ($\neg q \to \neg p$)**: Proposición condicional formada al permutar y negar a la vez el antecedente y el consecuente.

  - **Ley de Contraposición**: Teorema lógico que establece la equivalencia $p \to q \equiv \neg q \to \neg p$.

  - **Demostración por contraposición**: Método de prueba matemática indirecta donde se asume $\neg q$ para deducir $\neg p$.

  '
propiedades_relaciones: "- **Relación canónica entre las 4 variantes**:\n  - Directo: $p \\to q$ (equivalente al Contrarrecíproco).\n  - Recíproco: $q \\to p$ (equivalente al Inverso).\n  - Inverso: $\\neg p \\to \\neg q$ (equivalente al Recíproco).\n  - Contrarrecíproco: $\\neg q \\to \\neg p$ (equivalente al Directo).\n"
ejemplo_guiado:
  enunciado: 'Demuestra mediante tabla de verdad que la fórmula condicional $p \to q$ es lógicamente equivalente a su contrarrecíproco $\neg q \to \neg p$.


    ![Diagrama: Contrarrecíproco de un Condicional](/static/img/nodos/contrarreciproco-de-un-condicional-ejemplos.svg)'
  pasos:
  - 'Paso 1: Colocar las $4$ combinaciones canónicas de entrada para $p$ y $q$.'
  - 'Paso 2: Calcular el condicional directo $p \to q$: $[V, F, V, V]^T$.'
  - 'Paso 3: Calcular las negaciones $\neg q = [F, V, F, V]^T$ y $\neg p = [F, F, V, V]^T$.'
  - 'Paso 4: Evaluar el contrarrecíproco $\neg q \to \neg p$: - Fila 1 ($F \to F$): $V$ - Fila 2 ($V \to F$): $F$ - Fila 3 ($F \to V$): $V$ - Fila 4 ($V \to V$): $V$. Vector: $[V, F, V, V]^T$.'
  - 'Paso 5: Comparar los vectores: Como $[V, F, V, V]^T = [V, F, V, V]^T$, se demuestra formalmente la Ley del Contrarrecíproco.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A cuál de las siguientes fórmulas proposicionales es lógicamente equivalente el condicional directo $p \to q$?
  choices:
  - text: A su contrarrecíproco $\neg q \to \neg p$
    is_correct: true
  - text: A su recíproco $q \to p$
    is_correct: false
  - text: A su inverso $\neg p \to \neg q$
    is_correct: false
  - text: A la conjunción $p \land q$
    is_correct: false
  explanation: La alternativa correcta es 'A su contrarrecíproco $\neg q \to \neg p$'. El contrarrecíproco comparte exactamente la misma tabla de verdad que el directo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el contrarrecíproco del enunciado "Si $x^2$ es impar, entonces $x$ es impar"?
  choices:
  - text: Si $x$ no es impar (es par), entonces $x^2$ no es impar (es par)
    is_correct: true
  - text: Si $x$ es impar, entonces $x^2$ es impar
    is_correct: false
  - text: Si $x^2$ es par, entonces $x$ es par
    is_correct: false
  - text: $x^2$ es impar si y solo si $x$ es impar
    is_correct: false
  explanation: La alternativa correcta es 'Si $x$ no es impar (es par), entonces $x^2$ no es impar (es par)'. Se permutan y niegan ambas afirmaciones ($\neg q \to \neg p$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el antecedente $p$ y el consecuente $q$ de la fórmula directa $p \to q$.'
- 'Paso 2: Negar el consecuente para colocarlo como nuevo antecedente: $\neg q$.'
- 'Paso 3: Negar el antecedente para colocarlo como nuevo consecuente: $\neg p$.'
- 'Paso 4: Estructurar la fórmula contrarrecíproca resultante: $\neg q \to \neg p$.'
- 'Paso 5: Usar indistintamente $p \to q$ o $\neg q \to \neg p$ en deducciones y demostraciones lógicas.'
errores_correccion: '- **Error 1:** Creer que el contrarrecíproco es solo intercambiar el orden sin negar ($q \to p$). **Cómo corregirlo:** Intercambiar sin negar es el recíproco; el contrarrecíproco exige obligatoriamente intercambiar Y negar ambas proposiciones ($\neg q \to \neg p$).

  - **Error 2:** Dudar de si una demostración por contraposición es tan rigurosa como una directa. **Cómo corregirlo:** La contraposición es 100% equivalente al condicional directo; demostrar $\neg q \implies \neg p$ constituye una prueba formal perfecta de $p \implies q$.

  '
ejemplos:
- titulo: Contrarrecíproco en geometría
  enunciado: ¿Cuál es el contrarrecíproco de "Si un cuadrilátero es rombo, tiene 4 lados iguales"?
  alternativas:
  - Si un cuadrilátero no tiene 4 lados iguales, entonces no es rombo
  - Si tiene 4 lados iguales, es rombo
  - Si no es rombo, no tiene 4 lados iguales
  respuesta: Si un cuadrilátero no tiene 4 lados iguales, entonces no es rombo
  solucion_pasos:
  - '1. Negar y permutar consecuente: "no tiene 4 lados iguales".'
  - '2. Negar antecedente: "no es rombo".'
  - '3. Contrarrecíproco: "Si no tiene 4 lados iguales, no es rombo".'
- titulo: Vector del contrarrecíproco
  enunciado: ¿El vector de salida canónico de $\neg q \to \neg p$ es $[V, F, V, V]^T$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es exactamente idéntico al vector del condicional directo $p \to q$.
- titulo: Bicondicional tautológico
  enunciado: ¿La fórmula $(p \to q) \leftrightarrow (\neg q \to \neg p)$ es una tautología?
  respuesta: Sí
  solucion_pasos:
  - Sí, al coincidir en las 4 filas el bicondicional arroja $[V, V, V, V]^T$.
- titulo: Método indirecto de prueba
  enunciado: ¿Probar que $\neg q \to \neg p$ es verdadero demuestra automáticamente que $p \to q$ es verdadero?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la equivalencia lógica estricta entre ambas fórmulas.
errores_frecuentes:
- La afirmación de que el contrarrecíproco $\neg q \to \neg p$ tiene una tabla de verdad diferente al condicional directo.
- La afirmación de que el contrarrecíproco se obtiene únicamente permutando las proposiciones sin negarlas.
- La afirmación de que una demostración por contraposición no valida el teorema condicional directo original.
- La afirmación de que el contrarrecíproco de una implicación verdadera puede ser falso.
- La afirmación de que el contrarrecíproco coincide sintácticamente con el inverso del condicional.
afirmaciones_verdaderas:
- El contrarrecíproco de un condicional $p \to q$ es la proposición $\neg q \to \neg p$, formada al intercambiar y negar simultáneamente antecedente y consecuente.
- Por la Ley de Contraposición, un condicional y su contrarrecíproco son estrictamente equivalentes ($p \to q \equiv \neg q \to \neg p$) y comparten el vector $[V, F, V, V]^T$.
al_terminar_debes_poder: '![Cuadro resumen: Contrarrecíproco de un Condicional](/static/img/nodos/contrarreciproco-de-un-condicional-resumen.svg)


  QUÉ: Conocer, formular y aplicar el contrarrecíproco de un condicional ($\neg q \to \neg p$).

  CÓMO: Permutar y negar antecedente y consecuente, validar la equivalencia mediante tablas de verdad y emplearlo en demostraciones por contraposición.'
