procedimiento:
- 'Paso 1: Identifica el conjunto de partida (dominio) y de llegada (codominio).'
- 'Paso 2: Verifica que todo elemento del dominio tenga al menos una imagen asignada
  (existencia).'
- 'Paso 3: Verifica que ningún elemento del dominio tenga más de una imagen asignada
  (unicidad).'
- 'Paso 4: Si ambas condiciones se cumplen, la correspondencia es una función.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar concepto de función como regla de asignación única.
ejemplos:
- titulo: Verificación por pares ordenados
  enunciado: Determina si la correspondencia $\{(1,2), (2,3), (3,2), (4,5)\}$ es una
    función.
  solucion_pasos:
  - Cada primer componente (1, 2, 3, 4) aparece una sola vez en la lista.
  - No hay dos pares con la misma primera componente y distinta segunda componente.
  - Se cumple existencia y unicidad. Es una función.
- titulo: Detección de falla de unicidad
  enunciado: Determina si la correspondencia $\{(1,2), (1,5), (2,3)\}$ es una función.
  solucion_pasos:
  - El elemento $1$ aparece dos veces, asociado a $2$ y a $5$.
  - Esto viola la condición de unicidad de la imagen.
  - No es una función.
- titulo: ¿Toda relación entre dos conjuntos es una función?
  enunciado: ¿Toda relación entre dos conjuntos es una función?
  respuesta: 'No'
  solucion_pasos:
  - Una relación solo es función si cumple existencia y unicidad de imagen para cada
    elemento del dominio.
  - Muchas relaciones asignan dos o más imágenes a un mismo elemento, o dejan elementos
    sin imagen.
- titulo: ¿Puede un elemento del dominio quedar sin imagen asignada en una función?
  enunciado: ¿Puede un elemento del dominio quedar sin imagen asignada en una función?
  respuesta: 'No'
  solucion_pasos:
  - La condición de existencia exige que todo elemento del dominio tenga asignada
    al menos una imagen.
  - Si algún elemento queda sin imagen, la correspondencia no es una función sobre
    ese dominio.
errores_frecuentes:
- Creer que basta con que "la mayoría" de los elementos tengan una sola imagen; la
  unicidad debe cumplirse para todos sin excepción.
- Confundir función con relación biunívoca, asumiendo que también el codominio necesita
  unicidad de preimagen.
- Pensar que dos elementos distintos del dominio no pueden compartir la misma imagen
  (eso sí está permitido en una función general).
- Olvidar verificar la condición de existencia y centrarse solo en la unicidad.
- Asumir que una fórmula algebraica siempre define una función sin revisar restricciones
  de dominio.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando concepto
  de función como regla de asignación única.
