semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DEFINICION_ASIGNACION_UNICA
resumen_inicial: Una función es una regla de correspondencia que asigna a cada elemento
  de un conjunto inicial un único elemento de un conjunto final.
explicacion_simple: 'Imagina una función como una máquina procesadora matemática:

  - Le ingresas un valor de entrada $x$ (del conjunto de partida $A$).

  - La máquina le aplica una regla matemática y devuelve **UN ÚNICO** valor de salida
  $y = f(x)$ (en el conjunto de llegada $B$).

  Si una entrada tuviera dos salidas distintas, la máquina NO sería una función.'
explicacion_formal: 'Una relación $f \subset A \times B$ es una **función de $A$ en
  $B$** (denotado $f: A \to B$) si satisface la condición de existencia y unicidad:


  $$\forall x \in A, \quad \exists! y \in B \quad \text{tal que } y = f(x)$$


  **Desglose de la fórmula:**

  - $\forall x \in A$: Todos y cada uno de los elementos del dominio $A$ deben tener
  una asignación.

  - $\exists! y \in B$: Existe un único elemento asignado en el conjunto de llegada
  $B$.'
definiciones_clave: '- **Función ($f: A \to B$)**: Regla de asignación entre conjuntos
  que relaciona cada preimagen $x$ con una sola imagen $y$.

  - **Unicidad de la asignación**: Condición obligatoria por la cual un elemento $x$
  del dominio no puede tener más de una salida.'
propiedades_relaciones: '- **Diferencia entre relación y función**: Toda función es
  una relación, pero no toda relación matemática es una función.'
ejemplo_guiado:
  enunciado: Analiza la regla $f(x) = 2x + 3$ sobre el conjunto $A = \{1, 2, 3\}$
    y verifica si define una función asignando un único valor a cada elemento.
  pasos:
  - 'Paso 1: Evaluar para $x = 1$: $f(1) = 2(1) + 3 = 5$ (salida única $y = 5$).Paso
    2: Evaluar para $x = 2$: $f(2) = 2(2) + 3 = 7$ (salida única $y = 7$).Paso 3:
    Evaluar para $x = 3$: $f(3) = 2(3) + 3 = 9$ (salida única $y = 9$).Paso 4: Concluir
    que a cada preimagen de $A$ le corresponde exactamente una imagen en $B$, definiendo
    una función válida.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es la condición fundamental que debe cumplir una relación para
    ser considerada una función $f: A \to B$?'
  choices:
  - text: A cada elemento del conjunto $A$ le debe corresponder un único elemento
      en el conjunto $B$.
    is_correct: true
  - text: Cada elemento del conjunto $B$ debe tener al menos dos preimágenes en $A$.
    is_correct: false
  - text: El conjunto de partida debe estar formado solo por números pares.
    is_correct: false
  - text: La regla debe ser obligatoriamente una ecuación de segundo grado.
    is_correct: false
  explanation: La alternativa correcta es 'A cada elemento del conjunto $A$ le debe
    corresponder un único elemento en el conjunto $B$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar $f(x) = 2x + 3$ al elemento $x = 2$, ¿cuál es la única imagen
    asignada?
  choices:
  - text: $y = 7$
    is_correct: true
  - text: $y = 5$
    is_correct: false
  - text: $y = 9$
    is_correct: false
  - text: $y = 4$
    is_correct: false
  explanation: La alternativa correcta es '$y = 7$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto de partida $A$ (dominio) y la regla de asignación
  $f(x)$.'
- 'Paso 2: Aplicar la regla a cada elemento $x \in A$.'
- 'Paso 3: Verificar que no quede ningún elemento de $A$ sin asignar.'
- 'Paso 4: Confirmar que ningún elemento de $A$ tenga asignada más de una imagen.'
errores_correccion: '- **Error común:** Pensar que dos preimágenes distintas no pueden
  tener la misma imagen (creer que si $f(2) = 5$ y $f(-2) = 5$, entonces no es función).

  - **Cómo corregirlo:** La regla exige unicidad DE SALIDA para cada entrada. Varias
  entradas pueden compartir la misma salida sin violar la definición de función.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
estado: publicado
