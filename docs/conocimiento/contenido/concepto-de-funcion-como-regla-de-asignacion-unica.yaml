semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DEFINICION_ASIGNACION_UNICA
resumen_inicial: El concepto de función establece una regla de correspondencia que asigna a cada elemento del dominio un único elemento en el codominio.
explicacion_simple: '![El concepto de función establece una regla de correspondencia que asigna a cada elemento del dominio un único elemento en el codominio](/static/img/nodos/concepto-de-funcion-como-regla-de-asignacion-unica-intro.svg)



  Una **función** es como una máquina bien programada que procesa elementos de entrada.


  Si introduces un valor de entrada $x$ (del conjunto de partida o dominio), la máquina te devuelve **exactamente un único** valor de salida $y$ (del conjunto de llegada o codominio).


  Si a una misma entrada $x$ le correspondieran dos o más salidas distintas, o si algún elemento del dominio quedara sin salida, **la relación NO es una función**.'
explicacion_formal: 'Sean $A$ y $B$ dos conjuntos no vacíos. Una **función** $f$ de $A$ en $B$, denotada por $f: A \to B$, es una relación que satisface dos condiciones fundamentales:


  1. **Existencia**: $\forall x \in A, \ \exists y \in B \ \mid \ (x, y) \in f$

  2. **Unicidad**: $\forall x \in A, \ (x, y_1) \in f \ \land \ (x, y_2) \in f \implies y_1 = y_2$


  **Desglose de la definición:**

  - $A$: Dominio de la función ($x \in A$).

  - $B$: Codominio de la función ($y \in B$).

  - Cada $x \in A$ se relaciona con una y solo una imagen $y = f(x) \in B$.'
definiciones_clave: '- **Función ($f: A \to B$)**: Regla de asignación que conecta cada elemento del dominio con un único elemento del codominio.

  - **Asignación única**: Propiedad indispensable que impide que un elemento del conjunto de partida tenga dos o más imágenes distintas.'
propiedades_relaciones: '- **Dominio completo**: Todo elemento del conjunto $A$ debe tener imagen obligatoriamente.

  - **Compatibilidad con imágenes compartidas**: Dos o más preimágenes distintas pueden tener la misma imagen (ej: $f(2) = 4$ y $f(-2) = 4$).'
ejemplo_guiado:
  enunciado: '![Ejemplo El concepto de función establece una regla de correspondencia que asigna a cada elemento del dominio un único elemento en el codominio](/static/img/nodos/concepto-de-funcion-como-regla-de-asignacion-unica-ejemplos.svg)



    Determina si la relación $R = \{(1, 4), (2, 5), (3, 5)\}$ definida del conjunto $A = \{1, 2, 3\}$ en $B = \{4, 5, 6\}$ constituye una función válida.'
  pasos:
  - 'Paso 1: Verificar el dominio: todos los elementos de $A$ ($1, 2, 3$) aparecen como primer componente de algún par.'
  - 'Paso 2: Verificar la unicidad: a $1$ le corresponde $4$; a $2$ le corresponde $5$; a $3$ le corresponde $5$. Ningún elemento de $A$ tiene dos salidas distintas.'
  - 'Paso 3: Observar que dos elementos distintos ($2$ y $3$) tengan la misma imagen ($5$) es perfectamente válido en una función.'
  - 'Paso 4: Concluir que $R$ SÍ es una función válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la relación $R = \{(1, 4), (2, 5), (3, 5)\}$ es una función válida de $A = \{1, 2, 3\}$ en $B$?
  choices:
  - text: Porque cada elemento del dominio tiene una y solo una imagen asociada.
    is_correct: true
  - text: Porque todos los elementos del codominio se utilizan como imagen.
    is_correct: false
  - text: Porque no se repite ningún valor en la segunda componente.
    is_correct: false
  - text: Porque es una relación biyectiva uno a uno.
    is_correct: false
  explanation: La alternativa correcta es 'Porque cada elemento del dominio tiene una y solo una imagen asociada.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si a la relación $R$ se le agrega el par $(1, 6)$, ¿sigue siendo una función?
  choices:
  - text: No, porque el elemento 1 tendría dos imágenes distintas (4 y 6).
    is_correct: true
  - text: Sí, porque el conjunto de partida A no cambia.
    is_correct: false
  - text: Sí, porque el número 6 pertenece al conjunto de llegada B.
    is_correct: false
  - text: Depende de si el par se ubica al principio o al final.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque el elemento 1 tendría dos imágenes distintas (4 y 6).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto de partida $A$ (dominio) y el de llegada $B$ (codominio).'
- 'Paso 2: Comprobar que CADA elemento del dominio tenga al menos una asignación.'
- 'Paso 3: Verificar que NINGÚN elemento del dominio tenga más de una asignación.'
- 'Paso 4: Declarar la validez de la función.'
errores_correccion: '- **Error común:** Creer que dos preimágenes distintas no pueden tener la misma imagen.

  - **Cómo corregirlo:** Varios elementos de entrada pueden compartir la misma salida (ejemplo $f(x) = x^2$ da $f(2) = 4$ y $f(-2) = 4$); lo que está estrictamente prohibido es que una misma entrada tenga dos salidas distintas.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación tabular'
  enunciado: 'La tabla muestra una relación con pares $(x, y)$: $(1, 3)$, $(2, 5)$, $(3, 3)$. ¿Es una función?'
  alternativas:
  - Sí, porque cada valor de x tiene exactamente un valor de y asignado
  - No, porque el valor y = 3 se repite
  - No, porque faltan valores negativos
  - Solo si x e y son números pares
  respuesta: Sí, porque cada valor de x tiene exactamente un valor de y asignado
  solucion_pasos:
  - 'Paso 1: Los valores de $x$ son $1, 2, 3$ (ninguno se repite con distinto $y$).'
  - 'Paso 2: Que $y = 3$ se repita para $x = 1$ y $x = 3$ es completamente válido.'
  - 'Paso 3: La relación es una función válida.'
- titulo: 'Ejemplo 2: Detección de no-función'
  enunciado: ¿Cuál de los siguientes conjuntos de pares ordenados NO representa una función?
  alternativas:
  - '{(2, 1), (2, 4), (3, 5)}'
  - '{(1, 2), (2, 2), (3, 2)}'
  - '{(0, 0), (1, 1), (2, 4)}'
  - '{(-1, 3), (0, 4), (1, 5)}'
  respuesta: '{(2, 1), (2, 4), (3, 5)}'
  solucion_pasos:
  - 'Paso 1: En $\{(2, 1), (2, 4), (3, 5)\}$, la preimagen $x = 2$ tiene dos imágenes distintas ($1$ y $4$).'
  - 'Paso 2: Viola el principio de unicidad, por lo que NO es función.'
- titulo: 'Ejemplo 3: Función constante'
  enunciado: Si $f(x) = 7$ para todo $x \in \mathbb{R}$, ¿es $f$ una función?
  alternativas:
  - Sí, porque a cada número real le asigna un único valor (el 7)
  - No, porque la salida nunca cambia
  - No, porque no contiene la variable x en la regla
  - Solo para x = 7
  respuesta: Sí, porque a cada número real le asigna un único valor (el 7)
  solucion_pasos:
  - 'Paso 1: Para cualquier $x$, la salida es un único número ($7$).'
  - 'Paso 2: Cumple existencia y unicidad en todo $\mathbb{R}$.'
- titulo: 'Ejemplo 4: Diagrama sagital'
  enunciado: En un diagrama de flechas de $A=\{a, b\}$ a $B=\{1, 2\}$, del punto $a$ salen dos flechas hacia $1$ y $2$. ¿Es función?
  alternativas:
  - No, porque una preimagen no puede tener más de una imagen
  - Sí, porque todos los elementos de B reciben flechas
  - Sí, porque a y b están conectados
  - Depende de cuántas flechas salgan de b
  respuesta: No, porque una preimagen no puede tener más de una imagen
  solucion_pasos:
  - 'Paso 1: La preimagen $a$ tiene dos imágenes simultáneas.'
  - 'Paso 2: Falla la condición de unicidad; no es función.'
errores_frecuentes:
- Creer que una función exige que no se repitan los valores de salida.
- Confundir la condición de unicidad de imagen con la inyectividad.
- Asumir que si la fórmula es constante no califica como función.
afirmaciones_verdaderas:
- Una función asocia a cada elemento de su dominio una y solo una imagen en el codominio.
- Distintas preimágenes pueden compartir legalmente la misma imagen en una función.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar el concepto de función matemática como una regla de asignación unívoca.


  **CÓMO:** Verificando que cada elemento del conjunto de partida tenga exactamente una sola imagen en el conjunto de llegada ($f: A \to B$).


  ![Resumen El concepto de función establece una regla de correspondencia que asigna a cada elemento del dominio un único elemento en el codominio](/static/img/nodos/concepto-de-funcion-como-regla-de-asignacion-unica-resumen.svg)'
