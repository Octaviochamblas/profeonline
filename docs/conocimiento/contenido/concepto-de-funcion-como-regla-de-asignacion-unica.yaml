semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DEFINICION_ASIGNACION_UNICA
resumen_inicial: El concepto de función establece una regla de correspondencia que asigna a cada elemento de un conjunto inicial un único elemento en un conjunto final.
explicacion_simple: |
  Una **función** es como una máquina bien programada.

  Si le introduces un valor de entrada $x$ (del conjunto de partida), la máquina te devuelve **UN ÚNICO** valor de salida $y$ (del conjunto de llegada).

  Si a una misma entrada $x$ le correspondieran dos o más salidas distintas, **NO es una función**.
explicacion_formal: |
  Sean $A$ y $B$ dos conjuntos no vacíos. Una **función** $f$ de $A$ en $B$, denotada por $f: A \to B$, es una relación que satisface dos condiciones fundamentales:

  1. **Existencia**: $\forall x \in A, \ \exists y \in B \ \mid \ (x, y) \in f$
  2. **Unicidad**: $\forall x \in A, \ (x, y_1) \in f \ \land \ (x, y_2) \in f \implies y_1 = y_2$

  **Desglose de la fórmula:**
  - $A$: Dominio de la función.
  - $B$: Codominio de la función.
  - Cada $x \in A$ se relaciona con un único $y = f(x) \in B$.
definiciones_clave: |
  - **Función ($f: A \to B$)**: Regla de asignación que conecta cada elemento del dominio con un único elemento del codominio.
  - **Asignación única**: Propiedad indispensable que impide que un elemento del conjunto de partida tenga dos o más imágenes.
propiedades_relaciones: |
  - **Dominio completo**: Todo elemento del conjunto $A$ debe tener imagen obligatoriamente.
ejemplo_guiado:
  enunciado: Considera la relación $R$ del conjunto $A = \{1, 2, 3\}$ al conjunto $B = \{4, 5, 6\}$ definida por los pares ordenados $R = \{(1, 4), (2, 5), (3, 5)\}$. Determina si $R$ es una función.
  pasos:
    - 'Paso 1: Verificar el dominio: todos los elementos de $A$ ($1, 2, 3$) aparecen como primer componente.'
    - 'Paso 2: Verificar la unicidad: a $1$ le corresponde $4$; a $2$ le corresponde $5$; a $3$ le corresponde $5$. Ningún elemento de $A$ tiene dos salidas distintas.'
    - 'Paso 3: Observar que dos elementos distintos ($2$ y $3$) tengan la misma imagen ($5$) es perfectamente válido en una función.'
    - 'Paso 4: Concluir que $R$ SÍ es una función.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Por qué la relación $R = \{(1, 4), (2, 5), (3, 5)\}$ es una función válida de $A = \{1, 2, 3\}$ en $B$?
    choices:
      - {text: 'Porque cada elemento del dominio tiene una y solo una imagen asociada.', is_correct: true}
      - {text: 'Porque todos los elementos del codominio se utilizan.', is_correct: false}
      - {text: 'Porque no se repite ningún valor en la segunda componente.', is_correct: false}
      - {text: 'Porque es una relación uno a uno.', is_correct: false}
    explanation: La alternativa correcta es 'Porque cada elemento del dominio tiene una y solo una imagen asociada.'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: Si a la relación $R$ se le agrega el par $(1, 6)$, ¿sigue siendo una función?
    choices:
      - {text: 'No, porque el elemento 1 tendría dos imágenes distintas (4 y 6).', is_correct: true}
      - {text: 'Sí, porque el conjunto de partida A no cambia.', is_correct: false}
      - {text: 'Sí, porque el número 6 pertenece al conjunto de llegada B.', is_correct: false}
      - {text: 'Es imposible agregar más pares ordenados.', is_correct: false}
    explanation: La alternativa correcta es 'No, porque el elemento 1 tendría dos imágenes distintas (4 y 6).'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el conjunto de partida $A$ (dominio) y el de llegada $B$ (codominio).'
  - 'Paso 2: Comprobar que CADA elemento del dominio tenga al menos una asignación.'
  - 'Paso 3: Verificar que NINGÚN elemento del dominio tenga más de una asignación.'
  - 'Paso 4: Declarar la validez de la función.'
errores_correccion: |
  - **Error común:** Creer que dos preimágenes distintas no pueden tener la misma imagen.
  - **Cómo corregirlo:** Varios elementos de entrada pueden compartir la misma salida (ejemplo $f(x) = x^2$ da $f(2) = 4$ y $f(-2) = 4$); lo que está prohibido es que una entrada tenga dos salidas distintas.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una relación donde un elemento del dominio se asocia a dos elementos distintos del codominio es una función válida.'
  - 'Para que una relación sea función, todos los elementos del codominio deben poseer al menos una preimagen.'
  - 'La regla de asignación de una función exige que elementos distintos del dominio tengan obligatoriamente imágenes distintas.'
  - 'En una función $f: A \to B$, pueden existir elementos del conjunto de partida $A$ sin imagen asignada.'
  - 'Una función real se define únicamente cuando la regla de asignación es un polinomio de grado par.'
afirmaciones_verdaderas:
  - 'Una función $f: A \to B$ es una regla de correspondencia que asigna a cada elemento del dominio $A$ un único elemento en el codominio $B$.'
  - 'La unicidad de la imagen garantiza que ningún elemento del dominio posee más de una imagen asociada.'
al_terminar_debes_poder: |
  QUÉ: Definir y caracterizar una función como regla de asignación única entre dos conjuntos.
  CÓMO: Verificar que cada elemento del dominio tenga una y solo una imagen en el codominio, y declarar si la relación es función.
