semantic_id: MAT.ALG.FUNCION_CONCEPTOS.DEFINICION_ASIGNACION_UNICA
resumen_inicial: 'Concepto de función como regla de asignación única: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: 'Ya conoces las relaciones entre conjuntos. Una función es un
  tipo especial de relación con una regla estricta de unicidad: cada entrada produce
  una única salida, nunca dos.'
explicacion_formal: '### Definición formal


  Sea $A$ y $B$ dos conjuntos no vacíos. Una función $f\colon A \to B$ es un subconjunto
  de pares ordenados $(x, y) \in A \times B$ tal que para todo $x \in A$ existe un
  único $y \in B$ con $(x,y) \in f$; se escribe $y = f(x)$. La condición de existencia
  exige que todo elemento de $A$ tenga imagen, y la de unicidad exige que no tenga
  más de una.


  ### Desarrollo didáctico


  Imagina una máquina expendedora: cada botón (dominio) entrega siempre el mismo producto
  (imagen), y nunca dos productos distintos con el mismo botón. Eso es exactamente
  lo que exige una función.


  Dos condiciones deben cumplirse simultáneamente:

  1. **Existencia:** todo elemento del dominio debe tener asignada una imagen (nadie
  se queda sin salida).

  2. **Unicidad:** ningún elemento del dominio puede tener dos imágenes distintas
  (nadie recibe dos salidas).


  Si alguna de las dos falla, la correspondencia es una simple relación, pero no una
  función.'
definiciones_clave: '- **Concepto de función como regla de asignación única**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
