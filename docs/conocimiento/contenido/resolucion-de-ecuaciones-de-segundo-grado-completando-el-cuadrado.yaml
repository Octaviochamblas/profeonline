semantic_id: MAT.ALG.EC_CUADR_METODOS.COMPLETAR_CUADRADO
resumen_inicial: 'Resolución de ecuaciones de segundo grado completando el cuadrado:
  concepto, discriminante, soluciones y modelamiento en Métodos algebraicos de resolución.'
explicacion_simple: 'Antes de que existiera la fórmula general, este era el método
  clásico para resolver ecuaciones cuadráticas: reescribir la expresión como el cuadrado
  de un binomio.'
explicacion_formal: '### Definición formal


  Completar el cuadrado transforma $x^2+px+q=0$ (con $a=1$) en $\left(x+\dfrac{p}{2}\right)^2
  = \dfrac{p^2}{4}-q$, sumando y restando el término $\left(\dfrac{p}{2}\right)^2$
  que hace que los primeros dos términos formen un cuadrado perfecto.


  ### Desarrollo didáctico


  El procedimiento consiste en aislar los términos con $x$, sumar el cuadrado de la
  mitad del coeficiente lineal a ambos lados, factorizar el trinomio resultante como
  un binomio al cuadrado, y despejar mediante raíz cuadrada.


  Para $x^2+6x-7=0$: se aísla $x^2+6x=7$; se suma $9$ (el cuadrado de la mitad de
  $6$) a ambos lados: $x^2+6x+9=16$; se factoriza: $(x+3)^2=16$; se despeja: $x+3=\pm4$,
  dando $x=1$ o $x=-7$.'
definiciones_clave: '- **Resolución de ecuaciones de segundo grado completando el
  cuadrado**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones de segundo grado completando el cuadrado.'
