semantic_id: MAT.ALG.EC_CUADR_METODOS.COMPLETAR_CUADRADO
resumen_inicial: La resolución por completación del cuadrado consiste en transformar la ecuación en la forma $(x + p/2)^2 = K$ sumando $(p/2)^2$ a ambos miembros, permitiendo despejar la incógnita por extracción directa de raíz.
explicacion_simple: '![La resolución por completación del cuadrado consiste en transformar la ecuación en la forma $(x + p/2)^2 = K$ sumando $(p/2)^2$ a ambos miembros, permitiendo despejar la incógnita por extracción directa de raíz](/static/img/nodos/resolucion-de-ecuaciones-de-segundo-grado-completando-el-cuadrado-intro.svg)



  El método de **completar el cuadrado** es una técnica geométrica y algebraica elegante:

  1. Tienes $x^2 + px = q$ (la $x^2$ y la $x$ a la izquierda, el número a la derecha).

  2. **El truco mágico:** Tomas el número del medio ($p$), lo divides por $2$ y lo elevas al cuadrado: **$\left(\frac{p}{2}\right)^2$**.

  3. **Sumas ese valor en AMBOS lados** de la balanza para no alterarla.

  4. La izquierda se convierte mágicamente en un cuadrado perfecto: **$\left(x + \frac{p}{2}\right)^2$**.

  5. Sacas raíz cuadrada en ambos lados y despejas la $x$.


  *Ejemplo:* $x^2 + 6x = 7 \implies$ la mitad de $6$ es $3$, $3^2 = 9$. Sumas $9$: $x^2 + 6x + 9 = 7 + 9 \implies (x + 3)^2 = 16 \implies x + 3 = \pm 4 \implies x = 1$ ó $x = -7$.'
explicacion_formal: "Sea la ecuación cuadrática mónic $x^2 + px + q = 0$ con $p, q \\in \\mathbb{R}$. El **algoritmo de completación de cuadrados** se fundamenta en la identidad del trinomio cuadrado perfecto:\n$$x^2 + 2kx + k^2 = (x + k)^2$$\n\n**Desarrollo formal del método**:\n1. **Aislamiento de monomios variables**: $x^2 + px = -q$.\n2. **Determinación del término complementario**: $k = \\frac{p}{2} \\implies k^2 = \\left(\\frac{p}{2}\\right)^2 = \\frac{p^2}{4}$.\n3. **Adición simétrica del término complementario**:\n   $$x^2 + px + \\left(\\frac{p}{2}\\right)^2 = -q + \\left(\\frac{p}{2}\\right)^2$$\n4. **Factorización del trinomio cuadrado perfecto**:\n   $$\\left(x + \\frac{p}{2}\\right)^2 = \\frac{p^2 - 4q}{4}$$\n5. **Extracción de raíz cuadrada y despeje**:\n   $$x + \\frac{p}{2} = \\pm \\frac{\\sqrt{p^2 - 4q}}{2} \\Longleftrightarrow x = -\\frac{p}{2} \\pm \\frac{\\sqrt{p^2 - 4q}}{2}$$"
definiciones_clave: '- **Completación del cuadrado**: Técnica que genera un trinomio cuadrado perfecto sumando $(p/2)^2$.

  - **Trinomio cuadrado perfecto (TCP)**: Trinomio factorizable como el cuadrado exacto de un binomio $(x + k)^2$.'
propiedades_relaciones: '- **Origen de la fórmula general**: La resolvente general se demuestra aplicando este método a la ecuación general $ax^2 + bx + c = 0$.

  - **Forma canónica del vértice**: Permite reescribir parábolas en la forma vértice $y = a(x - h)^2 + k$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución por completación del cuadrado consiste en transformar la ecuación en la forma $(x + p/2)^2 = K$ sumando $(p/2)^2$ a ambos miembros, permitiendo despejar la incógnita por extracción directa de raíz](/static/img/nodos/resolucion-de-ecuaciones-de-segundo-grado-completando-el-cuadrado-ejemplos.svg)



    Resuelve la ecuación cuadrática $x^2 - 8x + 11 = 0$ mediante el método de completación de cuadrados.'
  pasos:
  - 'Paso 1: Aislar los términos con variable pasando la constante: $x^2 - 8x = -11$.'
  - 'Paso 2: Calcular el término que completa el cuadrado: $\left(\frac{-8}{2}\right)^2 = (-4)^2 = 16$.'
  - 'Paso 3: Sumar 16 en ambos lados de la ecuación: $x^2 - 8x + 16 = -11 + 16$.'
  - 'Paso 4: Factorizar el miembro izquierdo como cuadrado de binomio: $(x - 4)^2 = 5$.'
  - 'Paso 5: Extraer raíz cuadrada con doble signo: $x - 4 = \pm \sqrt{5}$.'
  - 'Paso 6: Despejar $x$: $x = 4 \pm \sqrt{5} \implies x_1 = 4 + \sqrt{5}, \; x_2 = 4 - \sqrt{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué número se debe sumar en ambos lados para completar el cuadrado en $x^2 + 10x = 3$?
  choices:
  - text: 25 (la mitad de 10 al cuadrado)
    is_correct: true
  - text: 100 (10 al cuadrado)
    is_correct: false
  - text: 5 (la mitad de 10)
    is_correct: false
  - text: '9'
    is_correct: false
  explanation: La alternativa correcta es '25 (la mitad de 10 al cuadrado)'. $(10/2)^2 = 5^2 = 25$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al completar cuadrados en $x^2 - 6x - 16 = 0$, ¿qué ecuación equivalente se obtiene?
  choices:
  - text: (x - 3)^2 = 25
    is_correct: true
  - text: (x - 6)^2 = 16
    is_correct: false
  - text: (x - 3)^2 = 16
    is_correct: false
  - text: (x + 3)^2 = 25
    is_correct: false
  explanation: La alternativa correcta es '(x - 3)^2 = 25'. $x^2 - 6x + 9 = 16 + 9 \implies (x - 3)^2 = 25$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si $a \neq 1$, dividir toda la ecuación entre $a$ para obtener la forma mónic.'
- 'Paso 2: Transponer el término independiente al miembro derecho ($x^2 + px = -q$).'
- 'Paso 3: Calcular el valor complementario $(p/2)^2$ y sumarlo en ambos miembros de la ecuación.'
- 'Paso 4: Factorizar el miembro izquierdo como el cuadrado de binomio $(x + p/2)^2$.'
- 'Paso 5: Aplicar raíz cuadrada en ambos lados $x + p/2 = \pm \sqrt{K}$ y despejar $x$.'
errores_correccion: '- **Error común:** Sumar $(p/2)^2$ únicamente al lado izquierdo olvidando sumarlo a la derecha.

  - **Cómo corregirlo:** La ecuación es una balanza: **todo lo que sumas a la izquierda debes sumarlo exactamente igual a la derecha**.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente par entero'
  enunciado: Resuelve $x^2 + 4x - 5 = 0$ completando el cuadrado.
  alternativas:
  - x = 1 y x = -5
  - x = -1 y x = 5
  - x = 2 y x = -3
  - x = 5 y x = -5
  respuesta: x = 1 y x = -5
  solucion_pasos:
  - 'Paso 1: $x^2 + 4x + 4 = 5 + 4 \implies (x + 2)^2 = 9 \implies x + 2 = \pm 3 \implies x = 1 \lor x = -5$.'
- titulo: 'Ejemplo 2: Raíz irracional'
  enunciado: Resuelve $x^2 - 6x + 2 = 0$ completando cuadrados.
  alternativas:
  - x = 3 ± sqrt(7)
  - x = -3 ± sqrt(7)
  - x = 6 ± sqrt(7)
  - x = 3 ± 7
  respuesta: x = 3 ± sqrt(7)
  solucion_pasos:
  - 'Paso 1: $x^2 - 6x + 9 = -2 + 9 \implies (x - 3)^2 = 7 \implies x = 3 \pm \sqrt{7}$.'
- titulo: 'Ejemplo 3: Coeficiente cuadrático a = 2'
  enunciado: Resuelve $2x^2 + 8x - 10 = 0$ dividiendo por 2 primero.
  alternativas:
  - x = 1 y x = -5
  - x = -1 y x = 5
  - x = 2 y x = -10
  - x = 1 y x = 5
  respuesta: x = 1 y x = -5
  solucion_pasos:
  - 'Paso 1: $x^2 + 4x - 5 = 0 \implies (x + 2)^2 = 9 \implies x = 1 \lor x = -5$.'
- titulo: 'Ejemplo 4: Coeficiente lineal impar'
  enunciado: ¿Qué término completa el cuadrado en $x^2 + 3x = 10$?
  alternativas:
  - 9/4
  - 3/2
  - '9'
  - '6'
  respuesta: 9/4
  solucion_pasos:
  - 'Paso 1: $(3/2)^2 = 9/4$.'
errores_frecuentes:
- Olvidar sumar el término al lado derecho de la ecuación.
- No dividir por a cuando el coeficiente cuadrático es distinto de 1.
- Cometer errores de signo en el binomio al cuadrado resultante.
afirmaciones_verdaderas:
- El método de completación de cuadrados suma (p/2)² en ambos lados para formar (x + p/2)² = K.
- La fórmula general cuadrática se demuestra formalmente completando el cuadrado en ax² + bx + c = 0.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones cuadráticas mediante el método de completación del cuadrado.


  **CÓMO:** Sumando (p/2)² en ambos miembros, factorizando el trinomio cuadrado perfecto y despejando la variable.


