semantic_id: MAT.ALG.EC_CUADR_METODOS.COMPLETAR_CUADRADO
resumen_inicial: La resolución completando el cuadrado transforma la expresión en $(x + k)^2 = d$ sumando el cuadrado de la mitad del coeficiente lineal $(b/2)^2$.
explicacion_simple: |
  **Completar el cuadrado** es una técnica geométrica y algebraica para convertir cualquier ecuación cuadrática en un binomio al cuadrado:

  - **Paso 1**: Tienes $x^2 + 6x - 7 = 0$. Pasas la constante al lado derecho $\implies x^2 + 6x = 7$.
  - **Paso 2**: Tomas la mitad del número que acompaña a la $x$ ($6 / 2 = 3$) y lo elevas al cuadrado ($3^2 = 9$).
  - **Paso 3**: Sumas ese $9$ en **AMBOS LADOS** de la igualdad:
    $$x^2 + 6x + 9 = 7 + 9 \implies x^2 + 6x + 9 = 16$$
  - **Paso 4**: El lado izquierdo ahora es un binomio perfecto $(x + 3)^2 = 16$.
  - **Paso 5**: Sacas raíz cuadrada $\implies x + 3 = \pm 4 \implies x_1 = 1$ y $x_2 = -7$.
explicacion_formal: |
  Dada la ecuación cuadrática mónica $x^2 + bx + c = 0$, el método de **completar el trinomio cuadrado perfecto** aplica la identidad $(x + k)^2 = x^2 + 2kx + k^2$:

  1. Transposición del término independiente: $x^2 + bx = -c$.
  2. Adición de la constante cuadrática $k^2 = \left(\frac{b}{2}\right)^2$ a ambos lados:
     $$x^2 + bx + \left(\frac{b}{2}\right)^2 = -c + \left(\frac{b}{2}\right)^2$$
  3. Factorización del trinomio cuadrado perfecto en la forma canónica:
     $$\left(x + \frac{b}{2}\right)^2 = \frac{b^2 - 4c}{4}$$
  4. Extracción de raíz cuadrada con doble signo: $x + \frac{b}{2} = \pm \sqrt{\frac{b^2 - 4c}{4}}$.
definiciones_clave: |
  - **Completar el cuadrado**: Procedimiento algebraico que añade la constante $(b/2)^2$ para convertir los términos cuadrático y lineal en un binomio elevado al cuadrado.
propiedades_relaciones: |
  - **Origen de la fórmula general**: La aplicación del método de completar el cuadrado sobre la ecuación cuadrática arbitraria $ax^2 + bx + c = 0$ constituye la demostración analítica directa de la fórmula general resolvente.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática $x^2 - 8x + 12 = 0$ completando el trinomio cuadrado perfecto.'
  pasos:
    - 'Paso 1: Pasarla a la forma $x^2 - 8x = -12$.'
    - 'Paso 2: Calcular el término completador: la mitad de $-8$ es $-4$, y $(-4)^2 = 16$.'
    - 'Paso 3: Sumar 16 a ambos lados: $x^2 - 8x + 16 = -12 + 16 \implies (x - 4)^2 = 4$.'
    - 'Paso 4: Extraer raíz cuadrada y despejar: $x - 4 = \pm \sqrt{4} = \pm 2 \implies x_1 = 4 + 2 = 6$ y $x_2 = 4 - 2 = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué número debe sumarse a ambos lados de la expresión $x^2 + 10x = 3$ para completar el trinomio cuadrado perfecto?'
    choices:
      - {text: 'El número 25 (correspondiente a $(10/2)^2 = 5^2$).', is_correct: true}
      - {text: 'El número 10.', is_correct: false}
      - {text: 'El número 100.', is_correct: false}
      - {text: 'El número 5.', is_correct: false}
    explanation: 'La alternativa correcta es ''El número 25 (correspondiente a $(10/2)^2 = 5^2$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Al completar el cuadrado en $x^2 - 6x = 7$, ¿en qué ecuación expresada con binomio al cuadrado se transforma?'
    choices:
      - {text: '$(x - 3)^2 = 16$', is_correct: true}
      - {text: '$(x - 6)^2 = 16$', is_correct: false}
      - {text: '$(x - 3)^2 = 7$', is_correct: false}
      - {text: '$(x + 3)^2 = 16$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(x - 3)^2 = 16$''. Sumando $(6/2)^2 = 9$ a ambos lados: $x^2 - 6x + 9 = 7 + 9 = 16 \implies (x-3)^2 = 16$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Asegurarse de que el coeficiente cuadrático $a = 1$ (si $a \neq 1$, dividir toda la ecuación por $a$).'
  - 'Paso 2: Transponer la constante $c$ al miembro derecho ($x^2 + bx = -c$).'
  - 'Paso 3: Calcular la constante de completamiento $\left(\frac{b}{2}\right)^2$ y sumarla a ambos lados.'
  - 'Paso 4: Factorizar el lado izquierdo como $\left(x + \frac{b}{2}\right)^2$, extraer raíz cuadrada $\pm$ y despejar $x$.'
errores_correccion: |
  - **Error común:** Sumar la constante $(b/2)^2$ únicamente al lado izquierdo sin sumarla al lado derecho de la igualdad.
  - **Cómo corregirlo:** La igualdad se desequilibra si solo sumas a un lado; **DEBES SUMAR EL MISMO NÚMERO EN AMBOS MIEMBROS** de la ecuación.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Completamiento con coeficiente par.
    alternativas:
      - '$S = \{1, 3\}$'
      - '$S = \{-1, -3\}$'
      - '$S = \{0, 4\}$'
    respuesta: '$S = \{1, 3\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Completamiento con constante negativa.
    alternativas:
      - '$S = \{-5, 1\}$'
      - '$S = \{5, -1\}$'
      - '$S = \{-6, 2\}$'
    respuesta: '$S = \{-5, 1\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La adición del término $(b/2)^2$ exclusivamente al lado izquierdo de la ecuación conservando inalterado el lado derecho.'
  - 'Completar el cuadrado cuando el coeficiente cuadrático principal $a \neq 1$ sin haber dividido previamente toda la expresión entre $a$.'
  - 'Elevar al cuadrado el coeficiente lineal $b^2$ sin haberlo dividido entre 2 para hallar la constante de completamiento.'
  - 'La omisión del signo $\pm$ al extraer la raíz cuadrada final de la constante del miembro derecho.'
  - 'La técnica de completar el cuadrado sólo se puede aplicar cuando el término independiente $c$ es igual a cero.'
afirmaciones_verdaderas:
  - 'Completar el cuadrado requiere sumar $(b/2)^2$ en ambos lados de la ecuación $x^2 + bx = -c$ para formar el trinomio $(x + b/2)^2$.'
  - 'Si el coeficiente cuadrático $a \neq 1$, se debe dividir toda la ecuación por $a$ antes de calcular el término completador $(b/2)^2$.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones de segundo grado mediante la técnica de completar el trinomio cuadrado perfecto.
  CÓMO: Aislar $x^2 + bx = -c$, sumar $(b/2)^2$ en ambos lados, factorizar como $(x + b/2)^2$ y despejar $x$ con doble signo $\pm$.
