procedimiento:
- 'Paso 1: Si $a\neq1$, divide toda la ecuación por $a$.'
- 'Paso 2: Aísla los términos con $x$ en un lado de la igualdad.'
- 'Paso 3: Suma el cuadrado de la mitad del coeficiente lineal a ambos lados de la
  igualdad.'
- 'Paso 4: Factoriza el trinomio resultante como un binomio al cuadrado y despeja
  extrayendo raíz cuadrada.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en resolución de ecuaciones de segundo grado completando el cuadrado.
ejemplos:
- titulo: Completar el cuadrado con coeficiente lineal par
  enunciado: Resuelve $x^2+4x-5=0$ completando el cuadrado.
  solucion_pasos:
  - $x^2+4x=5$.
  - 'Sumando $4$ a ambos lados: $x^2+4x+4=9$, es decir $(x+2)^2=9$.'
  - $x+2=\pm3$, por lo que $x=1$ o $x=-5$.
- titulo: Completar el cuadrado con coeficiente a distinto de 1
  enunciado: Resuelve $2x^2+8x-10=0$ completando el cuadrado.
  solucion_pasos:
  - 'Dividiendo por 2: $x^2+4x-5=0$.'
  - 'Completando el cuadrado como antes: $(x+2)^2=9$.'
  - $x=1$ o $x=-5$.
- titulo: ¿Se puede completar el cuadrado en cualquier ecuación cuadrática?
  enunciado: ¿Se puede completar el cuadrado en cualquier ecuación cuadrática?
  respuesta: Sí
  solucion_pasos:
  - Es un método general, aplicable a cualquier ecuación de la forma $ax^2+bx+c=0$
    con $a\neq0$.
- titulo: ¿Completar el cuadrado y aplicar la fórmula general dan siempre el mismo
    resultado?
  enunciado: ¿Completar el cuadrado y aplicar la fórmula general dan siempre el mismo
    resultado?
  respuesta: Sí
  solucion_pasos:
  - La fórmula general se deduce precisamente completando el cuadrado sobre la forma
    general, por lo que ambos métodos son equivalentes.
errores_frecuentes:
- Olvidar dividir por $a$ antes de completar el cuadrado cuando $a\neq1$.
- Sumar el término que completa el cuadrado solo a un lado de la igualdad, rompiendo
  la equivalencia.
- Calcular incorrectamente el cuadrado de la mitad del coeficiente lineal.
- Olvidar el signo $\pm$ al despejar la raíz cuadrada del binomio al cuadrado.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando resolución
