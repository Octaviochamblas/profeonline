semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DEFINICION
resumen_inicial: 'La función logarítmica $f(x) = \log_b(x)$ asigna a cada entrada real positiva $x > 0$ el exponente $y$ al que se debe elevar la base $b > 0, b \neq 1$.'
explicacion_simple: |
  Una función logarítmica es una regla matemática que toma un número positivo $x$ y nos devuelve el exponente al que hay que elevar una base fija $b$ para obtener ese número. Por ejemplo, en $f(x) = \log_2(x)$, si le entregamos el valor 8, la función responde 3 (porque $2^3 = 8$). Gráficamente, la función logarítmica es la imagen reflejada en espejo de la función exponencial respecto a la recta diagonal $y = x$.
explicacion_formal: |
  ### Definición formal
  La **función logarítmica real de base $b$** se define analíticamente como la función biyectiva $f: \mathbb{R}^+ \to \mathbb{R}$ tal que:
  $$f(x) = \log_b(x), \quad \text{con } b \in \mathbb{R}^+ \setminus \{1\}$$
  correspondiente a la función inversa de la función exponencial $g(x) = b^x$:
  $$y = \log_b(x) \iff b^y = x$$

  ### Desglose simbólico
  - Dominio estricto: $\operatorname{Dom}(f) = ]0, +\infty[ = \mathbb{R}^+$.
  - Recorrido completo: $\operatorname{Rec}(f) = ]-\infty, +\infty[ = \mathbb{R}$.
  - Relación de simetría axial: La gráfica de $f(x) = \log_b(x)$ es simétrica a la gráfica de $g(x) = b^x$ respecto a la bisectriz del primer y tercer cuadrante (recta $y = x$).

  ### Síntesis didáctica
  Diferenciar el rol de las variables: En la función exponencial $y = b^x$, la variable $x$ es el exponente. En la función logarítmica $y = \log_b(x)$, la salida $y$ es el exponente.
definiciones_clave: |
  - **Función logarítmica $f(x) = \log_b(x)$**: Función real que calcula el exponente de la base $b$ para cada entrada positiva $x$.
  - **Inversa de la exponencial**: Propiedad por la cual $f(g(x)) = \log_b(b^x) = x$ y $g(f(x)) = b^{\log_b(x)} = x$.
  - **Simetría respecto a $y = x$**: Propiedad geométrica entre funciones inversas en el plano cartesiano.
propiedades_relaciones: |
  - **Continuidad e inyectividad**: La función logarítmica es continua y estrictamente monótona en todo su dominio $]0, +\infty[$.
  - **Bases canónicas**: Se destaca la función logarítmica decimal $f(x) = \log_{10}(x)$ y la función logarítmica natural $f(x) = \ln(x) = \log_e(x)$.
ejemplo_guiado:
  enunciado: 'Dada la función logarítmica $f(x) = \log_3(x)$, calcula las imágenes para las entradas $x = 1, 3, 9, \frac{1}{3}, \sqrt{3}$ y confirma su relación con la función exponencial $g(x) = 3^x$.'
  pasos:
    - 'Paso 1: Evaluamos $f(1) = \log_3(1) = 0$, pues $3^0 = 1$. Punto: $(1, 0)$.'
    - 'Paso 2: Evaluamos $f(3) = \log_3(3) = 1$, pues $3^1 = 3$. Punto: $(3, 1)$.'
    - 'Paso 3: Evaluamos $f(9) = \log_3(9) = 2$, pues $3^2 = 9$. Punto: $(9, 2)$.'
    - 'Paso 4: Evaluamos $f(1/3) = \log_3(1/3) = -1$, pues $3^{-1} = 1/3$. Punto: $(1/3, -1)$.'
    - 'Paso 5: Evaluamos $f(\sqrt{3}) = \log_3(3^{1/2}) = 1/2$. Punto: $(\sqrt{3}, 1/2)$. Los pares son las coordenadas invertidas de $g(x) = 3^x$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué el dominio de la función logarítmica $f(x) = \log_b(x)$ está restringido a los números reales positivos $]0, +\infty[$?'
    choices:
      - {text: 'Porque es la función inversa de la exponencial $g(x) = b^x$, cuyo recorrido son los reales positivos $]0, +\infty[$', is_correct: true}
      - {text: 'Porque las bases menores que cero son imposibles de calcular', is_correct: false}
      - {text: 'Porque los números negativos se convierten en cero al aplicar logaritmos', is_correct: false}
      - {text: 'Porque la función logarítmica es una parábola cuadrática', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque es la función inversa de la exponencial $g(x) = b^x$, cuyo recorrido son los reales positivos $]0, +\infty[$''. El dominio de una función inversa equivale exactamente al recorrido de la función original.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto $(2, 16)$ pertenece a la gráfica de la función exponencial $g(x) = 4^x$, ¿qué punto pertenece a la gráfica de su función inversa $f(x) = \log_4(x)$?'
    choices:
      - {text: 'El punto de coordenadas $(16, 2)$', is_correct: true}
      - {text: 'El punto de coordenadas $(-2, -16)$', is_correct: false}
      - {text: 'El punto de coordenadas $(2, 4)$', is_correct: false}
      - {text: 'El punto de coordenadas $(4, 16)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(16, 2)$''. La función inversa intercambia los roles de las coordenadas $(x, y) \to (y, x)$, evaluando $f(16) = \log_4(16) = 2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la regla de asignación de la función logarítmica $f(x) = \log_b(x)$.'
  - 'Paso 2: Sustituir la variable independiente $x$ por valores reales estrictamente positivos.'
  - 'Paso 3: Resolver el exponente $y$ que satisface la ecuación de potencia $b^y = x$.'
  - 'Paso 4: Escribir el par ordenado cartesiano $(x, y)$ correspondiente a la gráfica de la función.'
errores_correccion: |
  - **Error 1:** Confundir la función logarítmica con su función inversa exponencial (ej: evaluar $f(x) = \log_2(x)$ en $x = 3$ haciendo $2^3 = 8$ y concluyendo $f(3) = 8$). **Cómo corregirlo:** La función logarítmica busca el exponente. Para $x = 3$, $f(3) = \log_2(3) \approx 1.58$. Elevar $2^3 = 8$ es evaluar la función exponencial $g(3)$.
  - **Error 2:** Evaluar la función logarítmica en números negativos o cero. **Cómo corregirlo:** $\operatorname{Dom}(f) = ]0, +\infty[$. Intentar evaluar $f(0)$ o $f(-5)$ no está definido en los números reales.
ejemplos:
  - titulo: 'Evaluación en la base'
    enunciado: '¿Cuál es la imagen de $x = 5$ en la función $f(x) = \log_5(x)$?'
    alternativas:
      - '$1$'
      - '$5$'
      - '$0$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. $f(5) = \log_5(5) = 1$ pues $5^1 = 5$.'
  - titulo: 'Punto de corte universal'
    enunciado: '¿La gráfica de la función $f(x) = \ln(x)$ pasa por el punto $(1, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(1) = \ln(1) = 0$, generando el par cartesiano $(1, 0)$.'
  - titulo: 'Evaluación en argumento fraccionario'
    enunciado: 'En la función $f(x) = \log_2(x)$, ¿la imagen de $x = 0.25$ es $-2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0.25 = \frac{1}{4} = 2^{-2} \implies f(0.25) = \log_2(2^{-2}) = -2$.'
  - titulo: 'Simetría con la recta y = x'
    enunciado: '¿La gráfica de $f(x) = \log_{10}(x)$ es la simétrica de $g(x) = 10^x$ respecto a la diagonal $y = x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por ser funciones inversas entre sí, sus gráficas se reflejan respecto a $y = x$.'
errores_frecuentes:
  - 'La función logarítmica $f(x) = \log_2(x)$ evaluada en $x = 4$ es igual a 16.'
  - 'El dominio de la función logarítmica abarca la totalidad de los números reales $\mathbb{R}$.'
  - 'La gráfica de la función logarítmica es idéntica a la gráfica de la función exponencial.'
  - 'La función logarítmica $f(x) = \log_b(x)$ cruza el eje vertical $y$ en el punto $(0, 1)$.'
  - 'Evaluar $x = 0$ en la función $f(x) = \ln(x)$ resulta en el valor numérico 0.'
afirmaciones_verdaderas:
  - 'La función logarítmica $f(x) = \log_b(x)$ es la función inversa de la función exponencial $g(x) = b^x$, teniendo como dominio los reales positivos $]0, +\infty[$.'
  - 'Las gráficas de $y = \log_b(x)$ y de $y = b^x$ son reflejos simétricos a través de la recta diagonal $y = x$.'
al_terminar_debes_poder: 'Definir analítica y gráficamente la función logarítmica $f(x) = \log_b(x)$ como la inversa de la función exponencial.'
