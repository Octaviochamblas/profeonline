semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DEFINICION
resumen_inicial: 'Definición de función logarítmica: conceptos, asíntotas, propiedades
  e inversidad en Análisis de la función logarítmica.'
explicacion_simple: 'Si la función exponencial responde "¿cuánto vale $b$ elevado
  a $x$?", la función logarítmica responde la pregunta opuesta: "¿a qué exponente
  hay que elevar $b$ para obtener $x$?".'
explicacion_formal: '### Definición formal


  Una función $f:\mathbb{R}^+ \to \mathbb{R}$ es logarítmica si puede expresarse como
  $f(x)=\log_b(x)$, con $b>0$ y $b\neq1$, donde $y=\log_b(x)$ significa que $b^y=x$.
  Es, por construcción, la función inversa de $g(x)=b^x$.


  ### Desarrollo didáctico


  Para interpretar $\log_b(x)$, conviene traducirlo mentalmente a la pregunta: "¿a
  qué potencia elevo $b$ para obtener $x$?".


  $\log_2(8)=3$, porque $2^3=8$. En cambio, $\log_5(x)$ para $x\leq0$ no tiene sentido,
  ya que ninguna potencia de $5$ (positivo) puede dar un resultado no positivo.'
definiciones_clave: '- **Definición de función logarítmica**: Concepto fundamental
  en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a definición de función logarítmica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de definición
    de función logarítmica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de definición de función logarítmica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    definición de función logarítmica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en definición de función logarítmica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la base $b$ y el argumento $x$ de la expresión logarítmica.'
- 'Paso 2: Traduce $\log_b(x)$ como la pregunta "¿a qué exponente se eleva $b$ para
  obtener $x$?".'
- 'Paso 3: Verifica que $b>0$, $b\neq1$ y $x>0$ para que la expresión esté bien definida.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en definición
  de función logarítmica.
ejemplos:
- titulo: Interpretación directa de un logaritmo
  enunciado: Interpreta el significado de $\log_3(9)$.
  solucion_pasos:
  - Se pregunta a qué exponente se eleva $3$ para obtener $9$.
  - Como $3^2=9$, entonces $\log_3(9)=2$.
- titulo: Reconocimiento de una expresión no definida
  enunciado: ¿Está definido $\log_4(-2)$?
  solucion_pasos:
  - No existe ninguna potencia de $4$ (base positiva) que dé un resultado negativo.
  - No, no está definido dentro de los números reales.
- titulo: ¿La función logarítmica es la inversa de la función exponencial?
  enunciado: ¿La función logarítmica es la inversa de la función exponencial?
  respuesta: Sí
  solucion_pasos:
  - Por construcción, $\log_b(x)$ deshace la operación de elevar $b$ a una potencia.
- titulo: ¿Puede el argumento de un logaritmo ser igual a cero?
  enunciado: ¿Puede el argumento de un logaritmo ser igual a cero?
  respuesta: 'No'
  solucion_pasos:
  - Ninguna potencia de una base positiva puede dar como resultado cero.
errores_frecuentes:
- Confundir $\log_b(x)$ con una división o resta entre $b$ y $x$.
- Aplicar la función logarítmica a argumentos negativos o iguales a cero.
- Olvidar que la base debe cumplir las mismas restricciones que en la función exponencial.
- Confundir el orden de base y argumento al leer la notación $\log_b(x)$.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando definición de función logarítmica.
