semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.RESOLUCION_MEDIDAS_INCOGNITAS
resumen_inicial: En el sistema de 8 ángulos formado por dos rectas paralelas y una
  secante existen solo dos valores angulares distintos (los 4 agudos iguales y los
  4 obtusos iguales), que son suplementarios entre sí.
explicacion_simple: '![Resolución de Ángulos en Paralelas](/static/img/nodos/resolucion-de-medidas-angulares-incognitas-usando-paralelas-y-transversal-intro.svg)


  En un cruce de dos rectas paralelas con una transversal solo hay dos tipos de ángulos:
  los "chicos" (agudos) y los "grandes" (obtusos). Todos los chicos miden exactamente
  lo mismo, todos los grandes miden exactamente lo mismo, y al juntar uno chico con
  uno grande siempre suman 180°.'
explicacion_formal: '### Método formal

  Dada una configuración de rectas paralelas $L_1 \parallel L_2$ cortadas por una
  transversal $T$, se generan exactamente **dos clases de equivalencia angular** $\{\alpha,
  \beta\}$ tales que cualquier ángulo del sistema mide $\alpha$ o mide $\beta = 180^\circ
  - \alpha$:


  $$\text{Medidas posibles} = \{\alpha, 180^\circ - \alpha\} \quad \text{con} \quad
  \alpha + \beta = 180^\circ$$


  $$\begin{cases} \text{Ángulos congruentes (agudos u obtusos):} & \alpha_i = \alpha_j
  \\ \text{Ángulos suplementarios:} & \alpha_i + \beta_k = 180^\circ \end{cases}$$


  ### Desglose simbólico y geométrico

  - De los 8 ángulos formados, 4 son congruentes entre sí y los otros 4 son sus suplementos
  congruentes entre sí.

  - Regla de decisión: Si dos ángulos son del mismo tipo (ambos agudos o ambos obtusos),
  se igualan ($A = B$). Si uno es agudo y el otro obtuso, se suman a $180^\circ$ ($A
  + B = 180^\circ$).


  ### Síntesis didáctica

  Esta bipartición angular simplifica la resolución de cualquier incógnita en sistemas
  de paralelas, reduciendo el problema a una simple ecuación lineal de igualdad o
  suplementariedad.'
definiciones_clave: '- **Clases de congruencia angular**: Grupos de 4 ángulos de exactamente
  igual medida en la configuración de paralelas.

  - **Regla de oro de resolución**: Dos ángulos cualesquiera en este sistema son iguales
  entre sí (si son del mismo tipo) o suman $180^\circ$ (si uno es agudo y el otro
  obtuso). '
propiedades_relaciones: '- **Determinación total**: Conociendo el valor numérico de
  un solo ángulo no recto, quedan determinados los 7 ángulos restantes.

  - **Criterio visual inmediato**: Si visualmente ambos ángulos son agudos, se igualan
  ($\alpha_1 = \alpha_2$); si uno es agudo y el otro obtuso, se suman a $180^\circ$
  ($\alpha + \beta = 180^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Resolución Integral](/static/img/nodos/resolucion-de-medidas-angulares-incognitas-usando-paralelas-y-transversal-ejemplos.svg)


    En una figura con $L_1 \parallel L_2$ y secante $T$, un ángulo obtuso mide $128^\circ$.
    Determina la medida de los 7 ángulos restantes del sistema y clasifícalos según
    su amplitud.'
  pasos:
  - 'Paso 1: Identificar que el ángulo dado es obtuso: $\beta = 128^\circ$.'
  - 'Paso 2: Calcular el ángulo suplementario agudo: $\alpha = 180^\circ - 128^\circ
    = 52^\circ$.'
  - 'Paso 3: Asignar la medida de $128^\circ$ a los otros 3 ángulos obtusos (su opuesto
    por el vértice, su correspondiente y su alterno externo).'
  - 'Paso 4: Asignar la medida de $52^\circ$ a los 4 ángulos agudos del sistema.'
  - 'Paso 5: Concluir que el sistema está compuesto por cuatro ángulos de $52^\circ$
    y cuatro ángulos de $128^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas medidas angulares distintas como máximo existen entre dos rectas
    paralelas cortadas por una transversal?
  choices:
  - text: Como máximo 2 medidas distintas (los agudos y los obtusos)
    is_correct: true
  - text: 8 medidas distintas
    is_correct: false
  - text: 4 medidas distintas
    is_correct: false
  - text: 16 medidas distintas
    is_correct: false
  explanation: En este sistema existen como máximo 2 medidas distintas (los agudos
    y los obtusos).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en una figura de paralelas cortadas por una transversal un ángulo agudo
    mide 42°, ¿cuánto miden todos los ángulos obtusos del sistema?
  choices:
  - text: 138° cada uno (porque 180° - 42° = 138°)
    is_correct: true
  - text: 42° cada uno
    is_correct: false
  - text: 48° cada uno
    is_correct: false
  - text: 90° cada uno
    is_correct: false
  explanation: 'Todos los ángulos obtusos son suplementarios al agudo: 180° - 42°
    = 138°, por lo que miden 138° cada uno (porque 180° - 42° = 138°).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si los dos ángulos involucrados son del mismo tipo (ambos agudos
  o ambos obtusos) o de distinto tipo.'
- 'Paso 2: Si son del mismo tipo, formular la ecuación de igualdad $\alpha_1 = \alpha_2$.'
- 'Paso 3: Si son de distinto tipo, formular la ecuación de suplementariedad $\alpha_1
  + \alpha_2 = 180^\circ$.'
- 'Paso 4: Despejar la incógnita y calcular el valor de cada ángulo.'
errores_correccion: Asegúrate de no igualar un ángulo agudo con uno obtuso; si son
  distintos, siempre suman 180°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un sistema de paralelas y transversal un ángulo mide 60°, ¿cuánto
    miden los 4 ángulos obtusos?
  alternativas:
  - $120^\circ$ cada uno
  - $60^\circ$ cada uno
  - $30^\circ$ cada uno
  respuesta: $120^\circ$ cada uno
  solucion_pasos:
  - $180^\circ - 60^\circ = 120^\circ$. Los cuatro ángulos obtusos miden $120^\circ$
    cada uno.
- titulo: Ejemplo 2
  enunciado: Si un ángulo agudo mide $2x$ y un ángulo obtuso mide $3x + 30^\circ$
    en rectas paralelas, ¿cuánto vale $x$?
  alternativas:
  - $30^\circ$
  - $20^\circ$
  - $40^\circ$
  respuesta: $30^\circ$
  solucion_pasos:
  - Por ser de distinto tipo suman $180^\circ$: $2x + 3x + 30^\circ = 180^\circ \implies
      5x = 150^\circ \implies x = 30^\circ$.
- titulo: ¿Conocer un solo ángulo permite conocer los 7 restantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque 4 son iguales a ese ángulo y los otros 4 son su suplemento a 180°.
- titulo: ¿Dos ángulos de distinto tipo en paralelas pueden ser iguales?
  respuesta: 'No'
  solucion_pasos:
  - No, un ángulo agudo y uno obtuso nunca son iguales salvo en el caso límite en
    que ambos son rectos de 90°.
errores_frecuentes:
- Igualar un ángulo agudo con un ángulo obtuso.
- Sumar a $180^\circ$ dos ángulos que son ambos agudos o ambos obtusos.
- Cometer errores algebraicos en el despeje de ecuaciones combinadas.
- Confundir la posición de los 8 ángulos en el esquema.
- No comprobar sumando las parejas para asegurar que totalicen $180^\circ$.
afirmaciones_verdaderas:
- Los 8 ángulos se dividen en 4 ángulos de una medida y 4 de su suplemento.
- Si dos ángulos son del mismo tipo visual, son congruentes.
al_terminar_debes_poder: '**QUÉ:** Resolver cualquier problema angular y algebraico
  en configuraciones de rectas paralelas y transversales.


  **CÓMO:** Identificando si los ángulos son congruentes (mismo tipo) o suplementarios
  (distinto tipo: $\alpha + \beta = 180^\circ$).


  ![Resumen de Resolución Integral](/static/img/nodos/resolucion-de-medidas-angulares-incognitas-usando-paralelas-y-transversal-resumen.svg)'
