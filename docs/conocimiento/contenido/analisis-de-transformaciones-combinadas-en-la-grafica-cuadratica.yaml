semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.COMBINACION_TRANSFORMACIONES
resumen_inicial: El análisis de transformaciones combinadas rastrea la evolución de la parábola base $y = x^2$ a través de traslaciones, reflexiones y escalas.
explicacion_simple: |
  Cuando la función cuadrática combina varias transformaciones al mismo tiempo $g(x) = a(x - h)^2 + k$, puedes analizar la parábola paso a paso a partir de la parábola estándar $y = x^2$:

  1. **Escala y Reflexión ($a$)**:
     - Determinas la abertura con $|a|$ (estrecha o ancha).
     - Si $a < 0$, reflejas la curva boca abajo ($\cap$).
  2. **Traslación Horizontal ($h$)**:
     - Desplazas la curva $h$ unidades hacia la derecha (si $-h$) o hacia la izquierda (si $+h$).
  3. **Traslación Vertical ($k$)**:
     - Desplazas la curva $k$ unidades hacia arriba (si $+k$) o hacia abajo (si $-k$).

  **Resultado final**: El vértice se ubica en **$V(h, k)$** y la abertura/concavidad la da **$a$**.
explicacion_formal: |
  Dada la función cuadrática canónica $g(x) = a(x - h)^2 + k$, la transformación geométrica afín compuesta $\mathcal{T}: \mathbb{R}^2 \to \mathbb{R}^2$ mapea la curva madre $y = x^2$ al grafo final mediante la cadena de operadores:

  $$\mathcal{T} = \mathcal{T}_{\text{traslación } (h,k)} \circ \mathcal{S}_{\text{escala } a} \circ \mathcal{R}_{\text{reflexión si } a < 0}$$

  **Composición paso a paso del grafo:**
  1. $y_1 = x^2$ (Parábola madre en el origen).
  2. $y_2 = |a| x^2$ (Escalamiento vertical por $|a|$).
  3. $y_3 = a x^2$ (Reflexión respecto al eje X si $a < 0$).
  4. $y_4 = a(x - h)^2$ (Traslación horizontal de $h$ unidades).
  5. $y_5 = a(x - h)^2 + k$ (Traslación vertical de $k$ unidades).
definiciones_clave: |
  - **Transformaciones combinadas**: Secuencia ordenada de movimientos rígidos (traslaciones) y no rígidos (escalamiento/reflexión) aplicados a una gráfica base.
propiedades_relaciones: |
  - **Conmutatividad de traslaciones**: Las traslaciones horizontales y verticales conmutan entre sí, permitiendo mover el vértice $V(0,0) \to V(h, k)$ en cualquier orden sin alterar la parábola final.
ejemplo_guiado:
  enunciado: 'Describe la secuencia de transformaciones necesarias para convertir $f(x) = x^2$ en $g(x) = -3(x - 2)^2 + 7$.'
  pasos:
    - 'Paso 1: Analizar $a = -3$: dilatación vertical de factor 3 (más estrecha) y reflexión respecto al eje X (cóncava hacia abajo).'
    - 'Paso 2: Analizar $h = 2$: traslación horizontal de 2 unidades hacia la derecha.'
    - 'Paso 3: Analizar $k = 7$: traslación vertical de 7 unidades hacia arriba.'
    - 'Paso 4: Concluir que el nuevo vértice es $V(2, 7)$ con abertura reducida y ramas hacia abajo.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para pasar de $y = x^2$ a $g(x) = 0.5(x + 4)^2 - 1$, ¿qué transformaciones exactas se aplicaron?'
    choices:
      - {text: 'Contracción vertical por factor 0.5, traslación de 4 unidades a la izquierda y 1 hacia abajo', is_correct: true}
      - {text: 'Dilatación vertical por factor 0.5, traslación de 4 unidades a la derecha y 1 hacia arriba.', is_correct: false}
      - {text: 'Reflexión respecto al eje X, traslación de 4 unidades a la izquierda y 1 hacia abajo.', is_correct: false}
      - {text: 'Traslación únicamente horizontal de 4 unidades.', is_correct: false}
    explanation: 'La alternativa correcta es ''Contracción vertical por factor 0.5, traslación de 4 unidades a la izquierda y 1 hacia abajo''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si a la función $f(x) = -x^2 + 3$ se le aplica una traslación de 2 unidades a la derecha y 5 hacia abajo, ¿cuál es la nueva función $g(x)$?'
    choices:
      - {text: '$g(x) = -(x - 2)^2 - 2$', is_correct: true}
      - {text: '$g(x) = -(x + 2)^2 - 2$.', is_correct: false}
      - {text: '$g(x) = -(x - 2)^2 + 8$.', is_correct: false}
      - {text: '$g(x) = (x - 2)^2 - 2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = -(x - 2)^2 - 2$''. Reemplazando $x \to x-2$ y restando 5: $-(x-2)^2 + 3 - 5 = -(x-2)^2 - 2$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el estado inicial de la parábola madre $y = x^2$.'
  - 'Paso 2: Determinar la escala $|a|$ y la concavidad según el signo de $a$.'
  - 'Paso 3: Determinar el desplazamiento horizontal $h$ e interpretar la dirección a la derecha ($h > 0$) o izquierda ($h < 0$).'
  - 'Paso 4: Determinar el desplazamiento vertical $k$ hacia arriba ($k > 0$) o abajo ($k < 0$) y ubicar el vértice final $V(h, k)$.'
errores_correccion: |
  - **Error común:** Aplicar la traslación vertical antes de la multiplicación por $a$ al realizar cálculos paso a paso.
  - **Cómo corregirlo:** Sigue el orden de operaciones (PEMDAS): **PRIMERO MULTIPLICA POR $a$ (Escala/Reflexión)** y **AL FINAL SUMA $k$ (Traslación vertical)**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Traslación combinada completa.
    alternativas:
      - 'Estiramiento factor 2, traslación 1 a la derecha y 3 arriba, V(1, 3)'
      - 'Compresión factor 2, traslación 1 a la izquierda y 3 abajo'
      - 'Reflexión respecto al eje X'
    respuesta: 'Estiramiento factor 2, traslación 1 a la derecha y 3 arriba, V(1, 3)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Combinación con reflexión.
    alternativas:
      - 'Reflexión respecto a X, traslación 6 a la izquierda y 2 abajo, V(-6, -2)'
      - 'Traslación 6 a la derecha y 2 arriba'
      - 'Sin cambio de concavidad'
    respuesta: 'Reflexión respecto a X, traslación 6 a la izquierda y 2 abajo, V(-6, -2)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $g(x) = -2(x - 3)^2 + 4$, es correcto decir que la parábola es cóncava hacia arriba por tener $+4$ fuera del binomio.'
  - 'La aplicación del desplazamiento vertical $k$ antes de efectuar el escalamiento del coeficiente cuadrático $a$.'
  - 'La suposición de que traslaciones combinadas modifican el valor absoluto de la abertura $|a|$.'
  - 'La suposición de que el orden de análisis de las traslaciones altera la ubicación final del vértice $V(h, k)$.'
  - 'La equivalencia errónea entre las transformaciones en el eje X (que invierten signo) y las transformaciones en el eje Y (que conservan signo).'
afirmaciones_verdaderas:
  - 'La forma canónica $g(x) = a(x - h)^2 + k$ condensa de forma directa la secuencia completa de escala ($a$), traslación horizontal ($h$) y vertical ($k$).'
  - 'El vértice final de la parábola tras aplicar la combinación de transformaciones es invariablemente el punto $V(h, k)$.'
al_terminar_debes_poder: |
  QUÉ: Analizar y construir la secuencia de transformaciones combinadas de una función cuadrática.
  CÓMO: Isolar $a, h, k$, determinar escala, reflexión, traslaciones horizontal y vertical, y fijar el vértice $V(h, k)$.
