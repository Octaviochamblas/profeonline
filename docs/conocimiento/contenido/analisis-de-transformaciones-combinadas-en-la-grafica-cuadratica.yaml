semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.COMBINACION_TRANSFORMACIONES
resumen_inicial: 'El análisis de transformaciones combinadas descompone la función canónica $f(x) = a(x - h)^2 + k$ en una secuencia jerárquica de transformaciones geométricas sobre la parábola matriz $y = x^2$: escalamiento vertical por $|a|$, reflexión si $a < 0$, y traslación rígida al nuevo vértice $V(h, k)$.'
explicacion_simple: '![El análisis de transformaciones combinadas descompone la función canónica $f(x) = a(x - h)^2 + k$ en una secuencia jerárquica de transformaciones geométricas sobre la parábola matriz $y = x^2$: escalamiento vertical por $|a|$, reflexión si $a < 0$, y traslación rígida al nuevo vértice $V(h, k)$](/static/img/nodos/analisis-de-transformaciones-combinadas-en-la-grafica-cuadratica-intro.svg)



  Cualquier parábola del universo cuadrático se puede construir a partir de la parábola más simple $y = x^2$ siguiendo estos **4 pasos en orden**:


  1. **Paso 1 (Escala $|a|$):** Estírala verticalmente si $|a| > 1$ o aplánala si $|a| < 1$.

  2. **Paso 2 (Reflexión):** Si $a$ tiene signo negativo, voltéala de cabeza (reflejo respecto al eje $X$).

  3. **Paso 3 (Traslación horizontal $h$):** Muévela a la derecha (si $x - h$) o a la izquierda (si $x + h$).

  4. **Paso 4 (Traslación vertical $k$):** Súbela (si $+k$) o bájala (si $-k$).

  - El vértice original $(0, 0)$ viaja directamente al punto **$V(h, k)$**.'
explicacion_formal: 'Sea la parábola elemental $f_0(x) = x^2$. La **forma canónica general de Jordan** $f(x) = a(x - h)^2 + k$ representa la composición del grupo afín de transformaciones en el plano $\mathbb{R}^2$:


  $$f = \mathcal{T}_{(h, k)} \circ \mathcal{R}_X^{\delta} \circ \mathcal{S}_{|a|} (f_0), \quad \delta = \begin{cases} 0 & \text{si } a > 0 \\ 1 & \text{si } a < 0 \end{cases}$$


  **Secuencia constructiva canónica**:

  1. $y_1 = |a| x^2$ (Escalamiento de amplitud vertical).

  2. $y_2 = a x^2 = \operatorname{sgn}(a) |a| x^2$ (Reflexión de orientación axial).

  3. $y_3 = a(x - h)^2$ (Desplazamiento horizontal del eje de simetría a $x = h$).

  4. $y_4 = a(x - h)^2 + k$ (Desplazamiento vertical del extremo a $y = k$).'
definiciones_clave: '- **Transformación compuesta afín**: Secuencia ordenada de homotecias, reflexiones y traslaciones rígidas en el plano.

  - **Parábola matriz fundamental**: Curva $y = x^2$ con vértice en el origen y $a = 1$.'
propiedades_relaciones: '- **Comutatividad de traslaciones**: Trasladar primero en $X$ y luego en $Y$ produce exactamente el mismo resultado que trasladar primero en $Y$ y luego en $X$.

  - **No comutatividad entre escalamiento y traslación vertical**: Escalar después de trasladar altera la cota vertical.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de transformaciones combinadas descompone la función canónica $f(x) = a(x - h)^2 + k$ en una secuencia jerárquica de transformaciones geométricas sobre la parábola matriz $y = x^2$: escalamiento vertical por $|a|$, reflexión si $a < 0$, y traslación rígida al nuevo vértice $V(h, k)$](/static/img/nodos/analisis-de-transformaciones-combinadas-en-la-grafica-cuadratica-ejemplos.svg)



    Describe detalladamente la secuencia completa de 4 transformaciones geométricas que convierten a $y = x^2$ en la función $f(x) = -3(x - 2)^2 + 7$.'
  pasos:
  - 'Paso 1: Identificar parámetros: $a = -3$ ($|a| = 3, \text{signo } -$), $h = 2, k = 7$.'
  - 'Paso 2: Transformación 1 (Escalamiento): Dilatación vertical por un factor de 3 (la parábola se hace 3 veces más estrecha, $y_1 = 3x^2$).'
  - 'Paso 3: Transformación 2 (Reflexión): Reflexión respecto al eje $X$ debido al signo negativo (las ramas apuntan hacia abajo, $y_2 = -3x^2$).'
  - 'Paso 4: Transformación 3 (Traslación horizontal): Desplazamiento de 2 unidades hacia la DERECHA ($y_3 = -3(x - 2)^2$).'
  - 'Paso 5: Transformación 4 (Traslación vertical): Desplazamiento de 7 unidades hacia ARRIBA ($f(x) = -3(x - 2)^2 + 7$).'
  - 'Paso 6: Estado final: Vértice máximo en $V(2, 7)$, eje de simetría $x = 2$, cóncava hacia abajo y estrecha.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué función resulta de dilatar $y = x^2$ por un factor de 2, reflejarla sobre el eje X, trasladarla 5 unidades a la izquierda y 1 hacia abajo?
  choices:
  - text: f(x) = -2(x + 5)² - 1
    is_correct: true
  - text: f(x) = -2(x - 5)² - 1
    is_correct: false
  - text: f(x) = 2(x + 5)² - 1
    is_correct: false
  - text: f(x) = -2(x + 5)² + 1
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = -2(x + 5)² - 1'. Factor 2 y reflejada $\implies a = -2$; 5 a la izquierda $\implies h = -5 \implies (x + 5)^2$; 1 abajo $\implies k = -1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función $g(x) = \frac{1}{2}(x - 4)^2 + 6$, ¿cuáles son las traslaciones aplicadas respecto a $y = x^2$?
  choices:
  - text: 4 unidades a la derecha y 6 unidades hacia arriba
    is_correct: true
  - text: 4 unidades a la izquierda y 6 hacia arriba
    is_correct: false
  - text: 4 unidades a la derecha y 6 hacia abajo
    is_correct: false
  - text: Solo una dilatación
    is_correct: false
  explanation: La alternativa correcta es '4 unidades a la derecha y 6 unidades hacia arriba'. $(x - 4) \implies h = 4$ (derecha), $+6 \implies k = 6$ (arriba).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer los parámetros $a, h, k$ de la forma canónica $a(x - h)^2 + k$.'
- 'Paso 2: Identificar la dilatación o contracción según $|a|$.'
- 'Paso 3: Identificar la existencia de reflexión según el signo de $a$.'
- 'Paso 4: Identificar la traslación horizontal según $h$ (derecha si $h > 0$, izquierda si $h < 0$).'
- 'Paso 5: Identificar la traslación vertical según $k$ (arriba si $k > 0$, abajo si $k < 0$).'
- 'Paso 6: Enunciar la posición final del vértice $V(h, k)$ y el eje $x = h$.'
errores_correccion: '- **Error común:** Mezclar el orden de las transformaciones aplicando la traslación antes que la escala.

  - **Cómo corregirlo:** La secuencia correcta aplica **primero la escala y reflexión sobre la forma base $x^2$** y **luego traslada el vértice a $(h, k)$**.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de transformaciones múltiples'
  enunciado: ¿Qué transformaciones componen $f(x) = -4(x + 1)^2 - 9$?
  alternativas:
  - Dilatación por 4, reflexión en X, 1 u a la izq y 9 u abajo
  - Dilatación por 4, 1 u a la der y 9 u abajo
  - Contracción por 4, reflexión en X, 1 u a la izq y 9 u arriba
  - Traslación pura
  respuesta: Dilatación por 4, reflexión en X, 1 u a la izq y 9 u abajo
  solucion_pasos:
  - 'Paso 1: $|a|=4$ (dilatación), $a<0$ (reflexión), $h=-1$ (izq), $k=-9$ (abajo).'
- titulo: 'Ejemplo 2: Reconstrucción desde enunciado'
  enunciado: 'Parábola $y = x^2$ aplanada a la mitad, 6 u a la der y 3 u arriba:'
  alternativas:
  - y = 0,5(x - 6)^2 + 3
  - y = 2(x - 6)^2 + 3
  - y = 0,5(x + 6)^2 + 3
  - y = 0,5(x - 6)^2 - 3
  respuesta: y = 0,5(x - 6)^2 + 3
  solucion_pasos:
  - 'Paso 1: $a = 0,5, h = 6, k = 3 \implies y = 0,5(x - 6)^2 + 3$.'
- titulo: 'Ejemplo 3: Vértice de curva transformada'
  enunciado: Si $y = x^2$ se traslada 8 u a la izq y 2 u abajo, ¿cuál es su vértice?
  alternativas:
  - V(-8, -2)
  - V(8, -2)
  - V(-8, 2)
  - V(8, 2)
  respuesta: V(-8, -2)
  solucion_pasos:
  - 'Paso 1: $h = -8, k = -2 \implies V(-8, -2)$.'
- titulo: 'Ejemplo 4: Efecto sobre el eje de simetría'
  enunciado: En $g(x) = -5(x - 7)^2 + 10$, ¿cuál es el eje de simetría?
  alternativas:
  - x = 7
  - x = -7
  - x = 10
  - x = -5
  respuesta: x = 7
  solucion_pasos:
  - 'Paso 1: La traslación horizontal fija el eje en $x = h = 7$.'
errores_frecuentes:
- Alterar el orden de las transformaciones confundiendo los efectos.
- Invertir el signo de la traslación vertical k.
- Olvidar incluir la reflexión cuando el coeficiente principal a es negativo.
afirmaciones_verdaderas:
- Toda parábola f(x) = a(x - h)² + k se obtiene aplicando escala, reflexión y traslaciones sobre y = x².
- El vértice V(h, k) es el resultado directo de aplicar la traslación vectorial (h, k) sobre el origen.
al_terminar_debes_poder: '**QUÉ:** Analizar, descomponer y formular transformaciones combinadas de una parábola.


  **CÓMO:** Identificando en f(x) = a(x - h)² + k la dilatación/contracción (|a|), la reflexión (signo de a), la traslación horizontal (h) y la traslación vertical (k).


