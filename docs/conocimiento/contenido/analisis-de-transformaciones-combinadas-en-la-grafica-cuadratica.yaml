semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.COMBINACION_TRANSFORMACIONES
resumen_inicial: 'Análisis de transformaciones combinadas en la gráfica cuadrática:
  parábola, vértice, concavidad y formas de Traslaciones y transformaciones.'
explicacion_simple: La forma canónica $a(x-h)^2+k$ concentra en una sola expresión
  las cuatro transformaciones posibles; saber leerlas todas juntas permite anticipar
  la gráfica completa sin necesidad de graficar punto por punto.
explicacion_formal: '### Definición formal


  Dada $f(x)=a(x-h)^2+k$, la gráfica se obtiene a partir de $y=x^2$ aplicando, en
  cualquier orden lógico: una dilatación o contracción vertical según $|a|$, una reflexión
  respecto al eje $x$ si $a<0$, una traslación horizontal de $h$ unidades, y una traslación
  vertical de $k$ unidades.


  ### Desarrollo didáctico


  Para describir la transformación completa, conviene enumerar cada efecto por separado:
  el valor de $a$ (concavidad y abertura), y las coordenadas $(h,k)$ del vértice resultante.


  Para $f(x)=-2(x-3)^2+5$: parábola contraída (pues $|a|=2>1$), cóncava hacia abajo
  (pues $a=-2<0$), con vértice trasladado a $(3,5)$.'
definiciones_clave: '- **Análisis de transformaciones combinadas en la gráfica cuadrática**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  análisis de transformaciones combinadas en la gráfica cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando análisis de
    transformaciones combinadas en la gráfica cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a análisis
    de transformaciones combinadas en la gráfica cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
