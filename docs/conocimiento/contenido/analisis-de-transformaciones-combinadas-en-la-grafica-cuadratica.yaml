semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.COMBINACION_TRANSFORMACIONES
resumen_inicial: 'El análisis de transformaciones combinadas descompone la función $g(x) = a(x - h)^2 + k$ en una secuencia ordenada de traslaciones, reflexiones y cambios de escala aplicados sobre $f(x) = x^2$.'
explicacion_simple: |
  Una función cuadrática compleja en forma canónica como $g(x) = -3(x - 2)^2 + 5$ se puede entender como una receta de pasos aplicados a la parábola básica $y = x^2$: primero la corremos 2 unidades a la derecha, luego la hacemos 3 veces más flaca, la damos vuelta hacia abajo (reflejamos), y finalmente la subimos 5 unidades. Analizar en orden cada cambio permite dibujar la gráfica exacta sin cometer errores.
explicacion_formal: |
  ### Definición formal
  Toda función cuadrática expresada en forma canónica $g(x) = a(x - h)^2 + k$ es el resultado de aplicar la **composición de transformaciones geométricas** $T = T_{\text{vert}} \circ T_{\text{escala}} \circ T_{\text{refl}} \circ T_{\text{horiz}}$ sobre la parábola base $f(x) = x^2$:

  ### Desglose simbólico
  Secuencia estándar de transformaciones sobre $f(x) = x^2$:
  1. **Traslación horizontal $T_{\text{horiz}}$**: $x \to (x - h)$. Mueve el vértice a $(h, 0)$.
  2. **Escala vertical $T_{\text{escala}}$**: Multiplicación por $|a|$. Modifica la apertura de las ramas.
  3. **Reflexión respecto al eje $x$ $T_{\text{refl}}$**: Multiplicación por $\operatorname{sgn}(a)$. Si $a < 0$, invierte la concavidad.
  4. **Traslación vertical $T_{\text{vert}}$**: Adición de $+k$. Mueve el vértice al punto definitivo $V(h, k)$.

  ### Síntesis didáctica
  Analizar transformaciones combinadas conecta el álgebra con la geometría cartesiana. Permite deducir inmediatamente la posición del vértice $V(h, k)$, la concavidad de la curva y su recorrido $\operatorname{Rec}(g)$ a partir de la inspección de la fórmula.
definiciones_clave: |
  - **Transformaciones combinadas**: Aplicación sucesiva de dos o más transformaciones geométricas sobre una función base.
  - **Secuencia de transformación**: Orden lógico (traslación horizontal, escala, reflexión y traslación vertical) para construir la gráfica.
  - **Función base / patrón**: Parábola estándar $f(x) = x^2$ centrada en el origen $(0,0)$.
propiedades_relaciones: |
  - **Invariancia del orden de parámetros**: Los parámetros $a$, $h$ y $k$ actúan de manera independiente en sus respectivas direcciones: $h$ en abscisas, $k$ en ordenadas, y $a$ en escala/concavidad.
  - **Recorrido final combinado**: El conjunto recorrido resulta $\operatorname{Rec}(g) = [k, +\infty[$ (si $a > 0$) o $\operatorname{Rec}(g) = ]-\infty, k]$ (si $a < 0$).
ejemplo_guiado:
  enunciado: 'Describe en orden secuencial la totalidad de las transformaciones geométricas aplicadas sobre $f(x) = x^2$ para obtener la función $g(x) = -4(x + 3)^2 - 7$, y especifica su vértice y recorrido.'
  pasos:
    - 'Paso 1: Identificamos los parámetros: $a = -4$, $h = -3$, $k = -7$.'
    - 'Paso 2: Paso 1 (Traslación horizontal): Se desplaza 3 unidades hacia la izquierda por $h = -3$.'
    - 'Paso 3: Paso 2 (Escala vertical): Se comprime horizontalmente (se estrecha 4 veces) por $|a| = 4 > 1$.'
    - 'Paso 4: Paso 3 (Reflexión): Se refleja respecto al eje $x$ (abre hacia abajo) por $a = -4 < 0$.'
    - 'Paso 5: Paso 4 (Traslación vertical): Se desplaza 7 unidades hacia abajo por $k = -7$.'
    - 'Paso 6: Conclusión: Vértice en $V(-3, -7)$ y recorrido $\operatorname{Rec}(g) = ]-\infty, -7]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué secuencia de transformaciones aplicadas sobre $y = x^2$ produce la función $g(x) = \frac{1}{2}(x - 5)^2 + 3$?'
    choices:
      - {text: 'Traslación 5 unidades a la derecha, dilatación horizontal (más ancha) por factor $0.5$, y traslación 3 unidades arriba', is_correct: true}
      - {text: 'Traslación 5 unidades a la izquierda, contracción por factor $0.5$, y traslación 3 unidades abajo', is_correct: false}
      - {text: 'Reflexión respecto al eje $x$, traslación 5 unidades arriba, y traslación 3 unidades derecha', is_correct: false}
      - {text: 'Traslación 5 unidades a la derecha, reflexión respecto al eje $y$, y traslación 3 unidades arriba', is_correct: false}
    explanation: 'La alternativa correcta es ''Traslación 5 unidades a la derecha, dilatación horizontal (más ancha) por factor $0.5$, y traslación 3 unidades arriba''. Se identifica $h = 5$, $a = 0.5$, $k = 3$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la parábola patrón $y = x^2$ se traslada 2 unidades a la izquierda, se refleja respecto al eje $x$ y se sube 8 unidades, ¿cuál es su expresión algebraica?'
    choices:
      - {text: '$y = -(x + 2)^2 + 8$', is_correct: true}
      - {text: '$y = -(x - 2)^2 + 8$', is_correct: false}
      - {text: '$y = (x + 2)^2 + 8$', is_correct: false}
      - {text: '$y = -(x + 8)^2 + 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = -(x + 2)^2 + 8$''. 2 unidades a la izquierda da $(x + 2)^2$, la reflexión da el signo menos, y subir 8 unidades agrega $+8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer los parámetros $a$, $h$ y $k$ de la forma canónica $a(x - h)^2 + k$.'
  - 'Paso 2: Describir la traslación horizontal ($h$ a la derecha si $h > 0$, o $|h|$ a la izquierda si $h < 0$).'
  - 'Paso 3: Describir el cambio de escala ($|a| > 1 \implies$ estrecha; $0 < |a| < 1 \implies$ ancha) y la reflexión si $a < 0$.'
  - 'Paso 4: Describir la traslación vertical ($k$ arriba si $k > 0$, o $|k|$ abajo si $k < 0$).'
errores_correccion: |
  - **Error 1:** Aplicar la traslación vertical antes de la reflexión o escala alterando el valor final de $k$. **Cómo corregirlo:** En la forma canónica $a(x - h)^2 + k$, la constante $k$ se suma libremente al final del término cuadrático ya escalado y reflejado.
  - **Error 2:** Omitir la reflexión cuando $a$ es un número negativo. **Cómo corregirlo:** Un coeficiente $a < 0$ incluye siempre la transformación de reflexión respecto al eje $x$, haciendo que la parábola abra hacia abajo.
ejemplos:
  - titulo: 'Análisis de transformaciones combinadas'
    enunciado: '¿Cuáles son las transformaciones en $f(x) = -2(x - 1)^2 - 4$ respecto a $y = x^2$?'
    alternativas:
      - 'Traslación 1 a la derecha, estrechamiento por 2, reflexión abajo y traslación 4 abajo'
      - 'Traslación 1 a la izquierda, ensanchamiento por 2, y traslación 4 arriba'
      - 'Traslación 4 a la derecha y 1 arriba'
    respuesta: 'Traslación 1 a la derecha, estrechamiento por 2, reflexión abajo y traslación 4 abajo'
    solucion_pasos:
      - '1. $h = 1 \implies$ 1 a la derecha.'
      - '2. $|a| = 2 \implies$ estrechamiento por factor 2.'
      - '3. $a = -2 < 0 \implies$ reflexión (abre hacia abajo).'
      - '4. $k = -4 \implies$ 4 abajo.'
  - titulo: 'Reconstrucción de ecuación desde transformaciones'
    enunciado: '¿Cuál es la función obtenida al trasladar $y = x^2$ en 3 unidades a la derecha y 5 unidades hacia arriba?'
    alternativas:
      - '$y = (x - 3)^2 + 5$'
      - '$y = (x + 3)^2 + 5$'
      - '$y = (x - 5)^2 + 3$'
    respuesta: '$y = (x - 3)^2 + 5$'
    solucion_pasos:
      - '1. 3 a la derecha $\implies (x - 3)^2$.'
      - '2. 5 arriba $\implies + 5$.'
      - '3. Obtenemos $y = (x - 3)^2 + 5$.'
  - titulo: 'Ubicación final del vértice'
    enunciado: '¿El vértice de una función con transformaciones combinadas coincide exactamente con el punto $V(h, k)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La composición de traslaciones horizontal $h$ y vertical $k$ sitúa el vértice de la curva en $V(h, k)$.'
  - titulo: 'Independencia de la escala'
    enunciado: '¿Aplicar una traslación horizontal de 10 unidades altera el valor de la cota vertical del vértice $k$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Las traslaciones horizontales actúan de forma totalmente independiente sobre la variable $x$, conservando $k$.'
errores_frecuentes:
  - 'La función $g(x) = -3(x + 2)^2 - 5$ traslada la parábola $y = x^2$ en 2 unidades hacia la derecha.'
  - 'Aplicar una reflexión respecto al eje $x$ modifica la traslación horizontal $h$ a $-h$.'
  - 'En la función $f(x) = 2(x - 4)^2 + 6$, el parámetro de escala $a = 2$ hace que la parábola sea más ancha.'
  - 'El vértice de una parábola sometida a transformaciones combinadas no depende del parámetro $k$.'
  - 'Combinar traslaciones horizontales y verticales altera la concavidad dada por el parámetro $a$.'
afirmaciones_verdaderas:
  - 'Toda función cuadrática en forma canónica $g(x) = a(x - h)^2 + k$ se descompone en traslaciones horizontales $h$, escala y reflexión $a$, y traslaciones verticales $k$.'
  - 'Las transformaciones combinadas posicionan el vértice de la parábola en $V(h, k)$ y determinan el intervalo del conjunto recorrido.'
