procedimiento:
- 'Paso 1: Verifica que el vértice del ángulo esté sobre la circunferencia (no en
  el centro ni fuera de ella).'
- 'Paso 2: Identifica las dos cuerdas que forman los lados del ángulo.'
- 'Paso 3: Reconoce el arco subtendido: el arco comprendido entre los extremos de
  las cuerdas que NO contiene al vértice.'
