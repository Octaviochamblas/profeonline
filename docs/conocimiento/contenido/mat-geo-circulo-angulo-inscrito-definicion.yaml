semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_INSCRITO_DEFINICION
resumen_inicial: 'Definición de ángulo inscrito en una circunferencia: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Cuando el vértice de un ángulo se ubica sobre la propia circunferencia
  (en vez de en el centro), y sus lados son cuerdas, se forma un ángulo inscrito.
explicacion_formal: '![Ángulo inscrito en la circunferencia](/static/img/geometria/circunferencia-circulo/circulo-angulo-inscrito-definicion.svg)


  ### Definición formal


  Un ángulo inscrito es un ángulo cuyo vértice $C$ está sobre la circunferencia y
  cuyos lados son dos cuerdas, $CA$ y $CB$, que unen el vértice con otros dos puntos
  de la circunferencia. El arco $AB$ que no contiene a $C$ se llama arco subtendido
  por el ángulo inscrito.


  ### Desarrollo didáctico


  En la figura, $C$ es un punto de la circunferencia distinto de $A$ y $B$. El ángulo
  $\angle ACB$, formado por las cuerdas $CA$ y $CB$, es un ángulo inscrito que subtiende
  el arco $AB$ (el arco que no contiene a $C$).'
definiciones_clave: '- **Definición de ángulo inscrito en una circunferencia**: Elemento
