    de triángulos, considera un ángulo $\alpha = 164^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1279^\circ =
    164^\circ$.
  pasos:
  - Identificar la propiedad de modelamiento de problemas de perspectiva usando semejanza
    de triángulos referida a $\alpha = 164^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1279 = 164 \implies x = 164 - 1279$.'
  - Concluir que la medida calculada para modelamiento de problemas de perspectiva
    usando semejanza de triángulos es $x = -1115^\circ$.
