semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.MODELAMIENTO_PERSPECTIVA
resumen_inicial: 'Modelamiento de problemas de perspectiva usando semejanza de triángulos:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: 'Además de las sombras, otra aplicación clásica de la semejanza
  de triángulos es la perspectiva: estimar distancias o alturas usando la línea de
  visión de un observador.'
explicacion_formal: '![Modelamiento de perspectiva con semejanza](/static/img/geometria/congruencia-semejanza/semejanza-modelamiento-perspectiva.svg)


  ### Definición formal


  Si un observador sostiene un objeto de referencia de altura $h_1$ a distancia $d_1$
  de su ojo, y observa un objeto lejano de altura $h_2$ (desconocida) a distancia
  $d_2$, alineados en la misma línea de visión, se cumple $\frac{h_1}{d_1}=\frac{h_2}{d_2}$
  (triángulos semejantes por AA).


  ### Desarrollo didáctico


  Esta técnica es usada, por ejemplo, en topografía y navegación: un observador sostiene
  una regla de 10 cm a 50 cm de su ojo, y esta cubre exactamente un árbol lejano ubicado
  a 20 m. La altura del árbol es $h_2=\frac{10\times2000}{50}=400$ cm=4 m.'
definiciones_clave: '- **Modelamiento de problemas de perspectiva usando semejanza
