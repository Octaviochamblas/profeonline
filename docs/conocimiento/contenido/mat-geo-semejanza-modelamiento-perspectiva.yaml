- titulo: ¿Se cumple siempre la propiedad principal de modelamiento de problemas de
    perspectiva usando semejanza de triángulos en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede modelamiento de problemas de perspectiva usando semejanza de triángulos
    asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
