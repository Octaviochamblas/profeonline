semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.EQUILATERO
resumen_inicial: Un triángulo equilátero es el polígono regular de tres lados caracterizado
  por tener sus tres lados de idéntica longitud y sus tres ángulos interiores exactamente
  iguales a 60°.
explicacion_simple: '![Triángulo Equilátero](/static/img/nodos/triangulo-equilatero-como-triangulo-de-tres-lados-de-igual-medida-intro.svg)


  Un **triángulo equilátero** es la figura triangular más perfecta y simétrica: sus
  **tres lados miden exactamente lo mismo** (por ejemplo $6\text{ cm}$ cada uno).
  Su perímetro se calcula simplemente multiplicando el lado por tres ($P = 3L$), y
  sus tres esquinas de adentro siempre miden **$60^\circ$** cada una.'
explicacion_formal: '### Definición formal

  Un triángulo $\Delta ABC$ es **equilátero** (o regular) si y solo si sus tres lados
  tienen exactamente la misma longitud métrica:


  $$\Delta ABC \text{ es equilátero} \iff a = b = c = L \quad (L > 0)$$


  $$\overline{AB} \cong \overline{BC} \cong \overline{CA}$$


  ### Desglose simbólico y geométrico

  - $L$: Longitud común de los tres lados.

  - Perímetro: $P = 3L$.

  - Altura canónica: $h = \frac{L\sqrt{3}}{2}$.

  - Área euclidiana: $A = \frac{L^2\sqrt{3}}{4}$.

  - Simetría: Grupo diedral $D_3$ con 3 ejes de reflexión y simetría rotacional de
  $120^\circ$.


  ### Síntesis didáctica

  El triángulo equilátero es el polígono regular de 3 lados, caracterizado por la
  máxima simetría espacial y congruencia total de todos sus elementos.'
definiciones_clave: '- **Triángulo equilátero**: Polígono regular de 3 lados y 3 ángulos
  iguales.

  - **Equiangularidad**: Condición de tener todos los ángulos interiores iguales ($60^\circ$).

  - **Perímetro de polígono regular**: $P = 3L$. '
propiedades_relaciones: '- **Caso especial de isósceles**: Todo triángulo equilátero
  cumple la definición de isósceles (tiene al menos dos lados iguales), pero con mayor
  simetría.

  - **Simetría dihedral ($D_3$)**: Posee 3 ejes de simetría axial y simetría rotacional
  de orden 3 ($120^\circ, 240^\circ, 360^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Equilátero](/static/img/nodos/triangulo-equilatero-como-triangulo-de-tres-lados-de-igual-medida-ejemplos.svg)


    El perímetro de un triángulo equilátero es $27\text{ cm}$. Calcula la longitud
    de cada uno de sus lados y comprueba la medida de sus ángulos interiores.'
  pasos:
  - 'Paso 1: Recordar la fórmula del perímetro del triángulo equilátero: $P = 3L$.'
  - 'Paso 2: Plantear la ecuación: $3L = 27\text{ cm}$.'
  - 'Paso 3: Despejar $L$: $L = 27 / 3 = 9\text{ cm}$.'
  - 'Paso 4: Comprobar que los tres lados miden $9\text{ cm}$ ($9 + 9 + 9 = 27\text{
    cm}$).'
  - 'Paso 5: Verificar los ángulos: como es equilátero, cada ángulo interior mide
    exactamente $60^\circ$ ($60^\circ + 60^\circ + 60^\circ = 180^\circ$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto mide cada ángulo interior de cualquier triángulo equilátero?
  choices:
  - text: Exactamente 60° (porque 180° / 3 = 60°)
    is_correct: true
  - text: 90°
    is_correct: false
  - text: 45°
    is_correct: false
  - text: Depende de la longitud del lado
    is_correct: false
  explanation: Por el teorema de equiangularidad, cada ángulo interior mide exactamente
    60° (porque 180° / 3 = 60°).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el lado de un triángulo equilátero mide 8 cm, ¿cuál es su perímetro?
  choices:
  - text: 24 cm (porque 3 x 8 = 24)
    is_correct: true
  - text: 16 cm
    is_correct: false
  - text: 64 cm
    is_correct: false
  - text: 32 cm
    is_correct: false
  explanation: Multiplicando el lado por 3 se obtiene 24 cm (porque 3 x 8 = 24).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los tres lados tengan la misma longitud $L$.'
- 'Paso 2: Calcular el perímetro mediante la fórmula directa $P = 3L$.'
- 'Paso 3: Asignar a cada uno de los tres ángulos interiores la medida constante de
  $60^\circ$.'
errores_correccion: 'No intentes calcular ángulos distintos para un equilátero: en
  el plano euclidiano siempre miden exactamente 60° cada uno.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene sus tres ángulos iguales, ¿cómo se clasifica según
    sus lados?
  alternativas:
  - Triángulo equilátero
  - Triángulo escaleno
  - Triángulo rectángulo
  respuesta: Triángulo equilátero
  solucion_pasos:
  - Un triángulo equiangular es forzosamente equilátero (tres lados iguales).
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el perímetro de un triángulo equilátero de lado $11\text{ cm}$?
  alternativas:
  - $33\text{ cm}$
  - $22\text{ cm}$
  - $121\text{ cm}$
  respuesta: $33\text{ cm}$
  solucion_pasos:
  - $P = 3 \times 11\text{ cm} = 33\text{ cm}$.
- titulo: ¿Un triángulo equilátero es a la vez equiangular y acutángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, sus ángulos son iguales a 60°, que son agudos (< 90°).
- titulo: ¿Un triángulo equilátero puede tener un ángulo recto de 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, sus tres ángulos son invariablemente iguales a 60°.
errores_frecuentes:
- Creer que el tamaño de los lados modifica la medida de los ángulos de 60°.
- Confundir la fórmula del perímetro ($3L$) con el área o con $L^3$.
- No reconocer que el equilátero es un caso especial de isósceles.
- Intentar construir un triángulo equilátero rectángulo u obtusángulo.
- Olvidar que posee 3 ejes de simetría.
afirmaciones_verdaderas:
- En todo triángulo equilátero sus tres lados miden lo mismo ($P = 3L$).
- En todo triángulo equilátero sus tres ángulos interiores miden exactamente $60^\circ$.
al_terminar_debes_poder: '**QUÉ:** Caracterizar, clasificar y calcular propiedades
  de triángulos equiláteros.


  **CÓMO:** Aplicando la igualdad de lados $a = b = c = L$, el perímetro $P = 3L$
  y los ángulos constantes de $60^\circ$.


  ![Resumen de Triángulo Equilátero](/static/img/nodos/triangulo-equilatero-como-triangulo-de-tres-lados-de-igual-medida-resumen.svg)'
