semantic_id: MAT.NUM.FRACCION_DECIMAL.DETECCION_DECIMAL_FINITO
resumen_inicial: Una fracción irreductible $\frac{a}{b}$ da origen a un decimal finito si y solo si la descomposición en primos de $b$ no contiene factores distintos de $2$ y $5$.
explicacion_simple: '![Detección de decimal finito desde la fracción irreductible](/static/img/nodos/deteccion-de-decimal-finito-desde-la-fraccion-irreductible-intro.svg)


  Podemos saber con certeza si una fracción se convertirá en un decimal finito antes de hacer la división. Para lograrlo, primero simplificamos la fracción hasta que sea irreductible y luego descomponemos en factores primos el denominador: si solo aparecen los factores primos $2$, $5$ o ambos, el decimal será definitivamente finito.'
explicacion_formal: 'Dada la fracción irreductible $\frac{a}{b}$ con $\operatorname{MCD}(a, b) = 1$, el **Teorema de Caracterización del Decimal Finito** establece que:


  $$\frac{a}{b} \text{ genera un decimal finito} \iff b = 2^m \cdot 5^n \quad (m, n \in \mathbb{N}_0)$$


  **Desglose formal de la fórmula:**

  - **$\operatorname{MCD}(a, b) = 1$:** Condición previa de irreductibilidad estricta para evitar factores espurios en el denominador.

  - **$2^m \cdot 5^n$:** Primos que dividen a la base decimal ($10 = 2 \cdot 5$), lo que asegura que la fracción pueda amplificarse a una fracción decimal con denominador $10^{\max(m,n)}$.

  - **Cantidad de cifras decimales:** El número exacto de cifras decimales finitas que tendrá el número es $k = \max(m, n)$.


  > **Complemento didáctico:** Si el denominador simplificado contiene algún factor primo distinto ($3, 7, 11, 13, \dots$), la fracción generará obligatoriamente un decimal infinito periódico.'
definiciones_clave: '- **Fracción irreductible**: Fracción $\frac{a}{b}$ donde $a$ y $b$ son coprimos (su máximo común divisor es $1$).

  - **Criterio de factores primos $2$ y $5$**: Condición necesaria y suficiente para que un número racional tenga expansión decimal finita.

  - **Exponente máximo**: $\max(m,n)$ que determina la cantidad exacta de dígitos tras la coma.'
propiedades_relaciones: '- **Teorema de clausura en base 10**: Solo los divisores de las potencias de 10 generan representaciones decimales finitas.

  - **Longitud finita**: La cantidad de cifras decimales es exactamente $\max(m, n)$ en $b = 2^m \cdot 5^n$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de detección de decimal finito](/static/img/nodos/deteccion-de-decimal-finito-desde-la-fraccion-irreductible-ejemplos.svg)


    Determine sin dividir si la fracción $\frac{9}{40}$ genera un decimal finito y cuántas cifras decimales tendrá.'
  pasos:
  - 'Paso 1: Verificar irreductibilidad: $\operatorname{MCD}(9, 40) = 1$.'
  - 'Paso 2: Descomponer el denominador en factores primos: $40 = 8 \cdot 5 = 2^3 \cdot 5^1$.'
  - 'Paso 3: Analizar primos: solo contiene los factores $2$ y $5 \implies$ es un decimal finito.'
  - 'Paso 4: Hallar la cantidad de cifras decimales: $\max(3, 1) = 3$ cifras decimales.'
  - 'Conclusión: $\frac{9}{40}$ genera un decimal finito de exactamente 3 cifras decimales ($0,225$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué indica el exponente máximo $\max(m, n)$ en $b = 2^m \cdot 5^n$ de la fracción irreductible?
  choices:
  - text: La cantidad exacta de cifras decimales finitas que tendrá el número resultante
    is_correct: true
  - text: La cantidad de ceros en la parte entera
    is_correct: false
  - text: La longitud del período
    is_correct: false
  - text: El valor del numerador
    is_correct: false
  explanation: La alternativa correcta es 'La cantidad exacta de cifras decimales finitas que tendrá el número resultante'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $\frac{9}{40}$ (con $40 = 2^3 \cdot 5^1$), ¿cuántas cifras decimales finitas se determinaron?
  choices:
  - text: 3 cifras decimales (porque $\max(3, 1) = 3$)
    is_correct: true
  - text: 1 cifra decimal
    is_correct: false
  - text: 4 cifras decimales
    is_correct: false
  - text: 2 cifras decimales
    is_correct: false
  explanation: La alternativa correcta es '3 cifras decimales (porque $\max(3, 1) = 3$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reducir la fracción a su expresión irreductible $\frac{a}{b}$.'
- 'Paso 2: Descomponer el denominador $b$ en factores primos $b = 2^m \cdot 5^n \cdot p_1 \dots$'
- 'Paso 3: Si los únicos factores primos son $2$ y/o $5$, concluir que es un decimal finito de $\max(m,n)$ cifras decimales.'
errores_correccion: '- **Error 1: Aplicar la prueba a una fracción no simplificada (ej: $\frac{6}{15}$).** **Cómo corregirlo:** $15 = 3 \cdot 5$ parece generar período, pero al simplificar $\frac{6}{15} = \frac{2}{5}$ se comprueba que SÍ es finito ($0,4$).

  - **Error 2: Confundir los factores primos con la paridad de los números.** **Cómo corregirlo:** La regla se basa estrictamente en los primos $\{2, 5\}$, no en si el denominador es par o impar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\frac{7}{20}$ un decimal finito?
  alternativas:
  - Sí, porque $20 = 2^2 \cdot 5$
  - No, es un decimal periódico
  - Solo si se amplifica por 3
  respuesta: Sí, porque $20 = 2^2 \cdot 5$
  solucion_pasos:
  - $20 = 2^2 \cdot 5 \implies$ solo primos 2 y 5 $\implies$ finito ($0,35$).
- titulo: Ejemplo 2
  enunciado: ¿Es $\frac{11}{30}$ un decimal finito?
  alternativas:
  - No, porque $30 = 2 \cdot 3 \cdot 5$ incluye al primo 3
  - Sí, porque termina en cero
  - Sí, porque 30 es par
  respuesta: No, porque $30 = 2 \cdot 3 \cdot 5$ incluye al primo 3
  solucion_pasos:
  - La presencia del primo 3 en el denominador irreductible impide que sea finito.
- titulo: ¿Genera la fracción $\frac{1}{16}$ un decimal finito?
  respuesta: Sí
  solucion_pasos:
  - Sí, $16 = 2^4 \implies$ decimal finito de 4 cifras ($0,0625$).
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! $16 = 2^4$ solo contiene el factor primo 2, generando exactamente 4 cifras decimales ($0,0625$).
  - texto: No, es periódico
    es_correcta: false
    retroalimentacion: Incorrecto, las potencias de 2 siempre generan decimales finitos.
  - texto: Solo si se divide entre 4
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad es intrínseca a la fracción irreductible.
- titulo: ¿Es $\frac{3}{50}$ un decimal finito de 2 cifras decimales?
  respuesta: Sí
  solucion_pasos:
  - Sí, $50 = 2 \cdot 5^2 \implies \max(1,2) = 2$ cifras ($0,06$).
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! $50 = 2^1 \cdot 5^2$, por lo que tiene $\max(1,2) = 2$ cifras decimales ($0,06$).
  - texto: No, tiene 3 cifras
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente máximo entre 1 y 2 es 2.
  - texto: No, es semiperiódico
    es_correcta: false
    retroalimentacion: Incorrecto, 50 solo contiene a los primos 2 y 5.
errores_frecuentes:
- Evaluar los factores primos del denominador sin haber simplificado la fracción previamente.
- Considerar que cualquier fracción con un denominador impar dará como resultado un decimal finito.
- El número de cifras decimales de una fracción generada por $2^m \cdot 5^n$ equivale a la suma de $m + n$.
- Las fracciones de denominador $8$ producen siempre decimales infinitos periódicos puros.
- Un denominador que contenga el factor primo 3 genera un decimal finito de una cifra.
afirmaciones_verdaderas:
- Una fracción irreductible $a/b$ genera un decimal finito si y solo si los factores primos de $b$ son solo 2 y/o 5.
- La cantidad de cifras decimales del decimal finito es igual a $\max(m, n)$ donde $b = 2^m \cdot 5^n$.
- Simplificar la fracción a su forma irreductible es un paso obligatorio antes de factorizar el denominador.
al_terminar_debes_poder: '![Síntesis de detección de decimal finito](/static/img/nodos/deteccion-de-decimal-finito-desde-la-fraccion-irreductible-resumen.svg)


  QUÉ: Determinar a priori si una fracción genera un decimal finito y calcular su cantidad exacta de cifras decimales sin efectuar la división.


  CÓMO: Reduciendo la fracción a su forma irreductible $\frac{a}{b}$, factorizando el denominador en primos ($b = 2^m \cdot 5^n$) y comprobando que no existan factores primos distintos de 2 y 5, con una cantidad de cifras decimales igual a $\max(m, n)$.'
