semantic_id: MAT.NUM.FRACCION_DECIMAL.DETECCION_DECIMAL_FINITO
resumen_inicial: "Una fracción irreductible genera un decimal finito si y solo si la descomposición en factores primos de su denominador contiene exclusivamente a los números 2 y/o 5."
explicacion_simple: |
  ¿Sabías que puedes saber si una fracción dará un decimal finito **sin necesidad de hacer la división**? El truco matemático es el siguiente:
  1. Simplifica la fracción hasta que sea irreductible (ya no se pueda simplificar más).
  2. Mira el número de abajo (denominador) y descarrólalo en sus factores primos.
  3. Si en esa multiplicación **solo aparecen doses (2) y/o cincos (5)**, la fracción dará un **decimal finito** obligado. Si aparece algún otro primo (como 3, 7 u 11), no será un decimal finito.
explicacion_formal: |
  Formalmente, dada una fracción $\frac{a}{b} \in \mathbb{Q}$ en su forma irreductible ($\text{MCD}(a, b) = 1$ y $b \in \mathbb{Z}^+$), el desarrollo decimal de $\frac{a}{b}$ es finito si y solo si la descomposición canónica en primos de $b$ es de la forma:
  $$b = 2^{\alpha} \cdot 5^{\beta}, \quad \text{con } \alpha, \beta \in \mathbb{N}_0$$

  Demostración: como el sistema de numeración es en base 10 ($10 = 2 \cdot 5$), un denominador $b$ admite una constante $k \in \mathbb{N}$ tal que $b \cdot k = 10^{\max(\alpha, \beta)}$, lo que permite amplificar $\frac{a}{b} = \frac{a \cdot k}{10^{\max(\alpha, \beta)}}$, demostrando que posee exactamente $\max(\alpha, \beta)$ cifras decimales finitas.
definiciones_clave: |
  - **Prerrequisito de irreductibilidad ($\text{MCD}(a,b)=1$)**: Condición previa indispensable de simplificar la fracción al máximo antes de analizar el denominador.
  - **Factores primos permitidos ($2$ y $5$)**: Únicos divisores primos de la base $10$ que garantizan la terminación del residuo.
  - **Cifras decimales máximas ($\max(\alpha, \beta)$)**: La cantidad de cifras decimales finitas coincide con el exponente máximo entre la potencia de 2 y la de 5 en la descomposición del denominador.
propiedades_relaciones: |
  - **Relación con potencias de 10**: Permite predecir la potencia $10^{\max(\alpha,\beta)}$ necesaria para convertir la fracción a fracción decimal.
  - **Independencia del numerador**: Siempre que la fracción esté simplificada, el numerador no afecta la condición de finitud del decimal.
  - **Exclusión de periódicos**: Si $b = 2^{\alpha} \cdot 5^{\beta}$, la probabilidad de obtener un período repetitivo es cero.
ejemplo_guiado:
  enunciado: 'Determina sin dividir si la fracción $\frac{21}{84}$ da origen a un decimal finito, indicando cuántas cifras decimales tendrá.'
  pasos:
    - 'Paso 1: Simplificar la fracción hasta hacerla irreductible:'
    - '   $\\text{MCD}(21, 84) = 21 \\implies \\frac{21 \\div 21}{84 \\div 21} = \\frac{1}{4}$.'
    - 'Paso 2: Factorizar el denominador irreductible $4$ en primos:'
    - '   $4 = 2^2 = 2^2 \\cdot 5^0 \\implies \\alpha = 2, \\beta = 0$.'
    - 'Paso 3: Analizar primos: como los únicos factores primos son $2$, la fracción genera un decimal finito.'
    - 'Paso 4: Calcular cantidad de decimales: $\\max(2, 0) = 2$ cifras decimales.'
    - 'Verificación: $1 \\div 4 = 0.25$ (efectivamente 2 decimales finitos).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué es absolutamente obligatorio simplificar una fracción hasta hacerla irreductible antes de examinar los factores primos de su denominador?"
    choices:
      - {text: "Porque factores 'prohibidos' en el denominador no simplificado podrían cancelarse con el numerador.", is_correct: true}
      - {text: "Porque la simplificación multiplica la fracción por 10.", is_correct: false}
      - {text: "Porque solo las fracciones impropias se pueden factorizar.", is_correct: false}
      - {text: "Porque los números primos cambian al simplificar.", is_correct: false}
    explanation: "La correcta es Porque factores 'prohibidos' en el denominador no simplificado podrían cancelarse con el numerador.: como en $\\frac{3}{15} = \\frac{1}{5}$, el factor 3 desaparece al simplificar."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes fracciones simplificadas genera un decimal finito?'
    choices:
      - {text: "$\\frac{7}{40}$", is_correct: true}
      - {text: "$\\frac{4}{15}$", is_correct: false}
      - {text: "$\\frac{2}{21}$", is_correct: false}
      - {text: "$\\frac{5}{18}$", is_correct: false}
    explanation: "La correcta es \\frac{7}{40}: $40 = 2^3 \\cdot 5^1$ (solo factores 2 y 5)."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Simplificar la fracción dada $\frac{a}{b}$ calculando su forma irreductible dividiendo por el $\text{MCD}(a,b)$.'
  - "Paso 2: Extraer el denominador de la fracción irreductible."
  - "Paso 3: Descomponer dicho denominador en factores primos."
  - "Paso 4: Verificar si en la descomposición aparecen ÚNICAMENTE los factores primos $2$ y/o $5$."
  - 'Paso 5: Si la condición se cumple, confirmar que es un decimal finito. La cantidad de dígitos decimales será $\max(\alpha, \beta)$.'
errores_correccion: |
  Un error clásico es analizar la fracción SIN haberla simplificado previamente (por ejemplo en $\frac{9}{30}$, ver que $30 = 2 \cdot 3 \cdot 5$ y decir que NO es finito por culpa del 3). ¡El 3 se simplifica con el 9 quedándote $\frac{3}{10}$! **SIMPLIFICA SIEMPRE PRIMERO**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: '¿Es $\frac{13}{250}$ un decimal finito?'
    alternativas:
      - "Sí, de 3 cifras decimales."
      - "No, es infinito periódico."
      - "Sí, de 2 cifras decimales."
    respuesta: "Sí, de 3 cifras decimales."
    solucion_pasos:
      - '$\text{MCD}(13, 250) = 1$, irreductible.'
      - '$250 = 2^1 \cdot 5^3$.'
      - 'Primos: solo $2$ y $5 \implies$ es decimal finito.'
      - 'Cifras decimales: $\max(1, 3) = 3$ cifras ($0.052$).'
  - titulo: "Ejemplo 2"
    enunciado: '¿Genera $\frac{6}{30}$ un decimal finito?'
    alternativas:
      - "Sí, es 0.2."
      - "No, por tener 3 en el denominador 30."
      - "No, es periódico."
    respuesta: "Sí, es 0.2."
    solucion_pasos:
      - 'Simplificar: $\frac{6 \div 6}{30 \div 6} = \frac{1}{5}$.'
      - 'Denominador $5 = 5^1 \implies$ finito.'
      - 'Decimal: $0.2$.'
  - titulo: "¿Puede una fracción irreductible con denominador 16 generar un decimal finito?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, porque $16 = 2^4$ solo contiene al primo 2.'
  - titulo: "¿Cuántas cifras decimales tendrá el desarrollo de $\\frac{1}{32}$?"
    respuesta: "5 cifras decimales"
    solucion_pasos:
      - 'Como $32 = 2^5$, la cantidad de cifras decimales es $\max(5,0) = 5$ ($0.03125$).'
errores_frecuentes:
  - "Analizar los factores primos del denominador sin simplificar la fracción primero."
  - "Confundir divisores del número con sus factores primos."
  - "Creer que la presencia del número 10 en el denominador no permite decimal finito."
  - "Asumir que si el numerador es impar la fracción no puede ser decimal finito."
  - "Olvidar que el 1 (denominador entero) produce 0 cifras decimales (finito)."
afirmaciones_verdaderas:
  - "Una fracción irreductible genera un decimal finito si su denominador solo posee factores primos 2 y/o 5."
  - "El mayor exponente entre el 2 y el 5 en el denominador determina la cantidad exacta de cifras decimales."
al_terminar_debes_ponder: |
  Debes ser capaz de predecir la finitud del desarrollo decimal de cualquier fracción mediante la factorización prima de su denominador irreductible.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
