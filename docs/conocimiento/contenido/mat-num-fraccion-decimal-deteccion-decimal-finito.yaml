semantic_id: MAT.NUM.FRACCION_DECIMAL.DETECCION_DECIMAL_FINITO
resumen_inicial: Una fracción irreductible $\frac{a}{b}$ da origen a un decimal finito
  si y solo si la descomposición en primos de $b$ no contiene factores distintos de
  $2$ y $5$.
explicacion_simple: 'Podemos saber si una fracción se convertirá en un decimal finito
  antes de hacer la división. Para lograrlo, primero simplificamos la fracción por
  completo y luego miramos el número de abajo: si al descomponerlo solo aparecen los
  números primos 2, 5 o ambos, entonces el decimal será definitivamente finito.'
explicacion_formal: 'Dada la fracción irreductible $\frac{a}{b}$ con $\operatorname{MCD}(a,
  b) = 1$, la **Caracterización Teórica del Decimal Finito** establece que:


  $$\frac{a}{b} \text{ genera un decimal finito} \iff b = 2^m \cdot 5^n \quad (m,
  n \in \mathbb{N}_0)$$


  **Desglose de la fórmula:**

  - $\operatorname{MCD}(a, b) = 1$: Condición previa de irreductibilidad indispensable.

  - $2^m \cdot 5^n$: Los únicos factores primos de la base 10 ($10 = 2 \cdot 5$),
  garantizando que exista una amplificación tal que $b \cdot k = 10^{\max(m,n)}$.


  > **Complemento didáctico:** La cantidad de cifras decimales finitas que tendrá
  el número será exactamente igual al mayor exponente entre el 2 y el 5 en la descomposición
  del denominador: $\max(m, n)$.'
definiciones_clave: '- **Criterio del denominador para decimal finito**: Teorema algebraico
  que restringe la naturaleza de los factores primos de $b$ a la familia $\{2, 5\}$.'
propiedades_relaciones: '- **Criterio de exponente máximo**: El número de decimales
  es $\max(m, n)$ en $b = 2^m \cdot 5^n$.'
ejemplo_guiado:
  enunciado: Determine sin dividir si la fracción $\frac{9}{40}$ genera un decimal
    finito y cuántas cifras decimales tendrá.
  pasos:
  - 'Paso 1: Verificar irreductibilidad: $\operatorname{MCD}(9, 40) = 1$.'
  - 'Paso 2: Descomponer el denominador: $40 = 8 \cdot 5 = 2^3 \cdot 5^1$.'
  - 'Paso 3: Analizar primos: solo contiene los primos $2$ y $5 \implies$ es un decimal
    finito.'
  - 'Paso 4: Hallar la cantidad de cifras decimales: $\max(3, 1) = 3$ cifras decimales.'
  - 'Conclusión: $\frac{9}{40}$ dará un decimal finito de exactamente 3 cifras decimales
    ($0,225$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué indica el exponente máximo max(m, n) en b = 2^m · 5^n de la fracción
    irreductible?
  choices:
  - text: La cantidad exacta de cifras decimales finitas que tendrá el número resultante
    is_correct: true
  - text: La cantidad de ceros en la parte entera
    is_correct: false
  - text: La longitud del período
    is_correct: false
  - text: El valor del numerador
    is_correct: false
  explanation: La alternativa correcta es 'La cantidad exacta de cifras decimales
    finitas que tendrá el número resultante'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 9/40 (con 40 = 2^3 · 5^1), ¿cuántas cifras decimales
    finitas se determinaron?
  choices:
  - text: 3 cifras decimales (porque max(3, 1) = 3)
    is_correct: true
  - text: 1 cifra decimal
    is_correct: false
  - text: 4 cifras decimales
    is_correct: false
  - text: 2 cifras decimales
    is_correct: false
  explanation: La alternativa correcta es '3 cifras decimales (porque max(3, 1) =
    3)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reducir la fracción a su expresión irreductible $\frac{a}{b}$.'
- 'Paso 2: Descomponer el denominador $b$ en factores primos $b = p_1^{e_1} \cdot
  p_2^{e_2} \dots$'
- 'Paso 3: Si $p_i \in \{2, 5\}$ para todos los factores, concluir que es un decimal
  finito.'
errores_correccion: '- **Error 1: Aplicar la prueba a una fracción no simplificada
  (ej: $\frac{6}{15}$).** **Cómo corregirlo:** $15 = 3 \cdot 5$ parece no finito,
  pero al simplificar $\frac{6}{15} = \frac{2}{5}$ se comprueba que SÍ es finito ($0,4$).


  - **Error 2: Confundir los factores primos con los números pares o impares.** **Cómo
  corregirlo:** La regla se basa estrictamente en la descomposicón prima $\{2, 5\}$,
  no en la paridad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es 7/20 un decimal finito?
  alternativas:
  - Sí, porque 20 = 2^2 · 5
  - No, es un decimal periódico
  - Solo si se amplifica por 3
  respuesta: Sí, porque 20 = 2^2 · 5
  solucion_pasos:
  - $20 = 2^2 \cdot 5 \implies$ solo primos 2 y 5 $\implies$ finito ($0,35$).
- titulo: Ejemplo 2
  enunciado: ¿Es 11/30 un decimal finito?
  alternativas:
  - No, porque 30 = 2 · 3 · 5 incluye al factor 3
  - Sí, porque termina en cero
  - Sí, porque 30 es par
  respuesta: No, porque 30 = 2 · 3 · 5 incluye al factor 3
  solucion_pasos:
  - La presencia del primo 3 impide que sea finito.
- titulo: ¿Genera la fracción 1/16 un decimal finito?
  respuesta: Sí
  solucion_pasos:
  - Sí, $16 = 2^4 \implies 0,0625$.
- titulo: ¿Es 3/50 un decimal finito de 2 cifras decimales?
  respuesta: Sí
  solucion_pasos:
  - Sí, $50 = 2 \cdot 5^2 \implies \max(1,2) = 2$ cifras ($0,06$).
errores_frecuentes:
- Evaluar los factores primos del denominador sin haber simplificado la fracción previamente.
- Considerar que cualquier fracción con un denominador impar dará como resultado un
  decimal finito.
- El número de cifras decimales de una fracción generada por $2^m \cdot 5^n$ equivale
  a la suma de $m + n$.
- Las fracciones de denominador $8$ producen siempre decimales infinitos periódicos
  puros.
- Un denominador que contenga el factor primo 3 genera un decimal finito de una cifra.
afirmaciones_verdaderas:
- Una fracción irreductible $a/b$ genera un decimal finito si y solo si los factores
  primos de $b$ son solo 2 y/o 5.
- La cantidad de cifras decimales del decimal finito es igual a $\max(m, n)$ donde
  $b = 2^m \cdot 5^n$.
al_terminar_debes_poder: Al terminar serás capaz de detectar preventivamente si una
  fracción genera un decimal finito analizando los factores primos del denominador
  de su forma irreductible.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
