semantic_id: MAT.GEO.PARALELOGRAMOS.DEFINICION
resumen_inicial: Un paralelogramo es un cuadrilátero que tiene sus dos pares de lados opuestos paralelos entre sí.
explicacion_simple: 'Imagina una figura de cuatro lados donde los lados de arriba y abajo apuntan en la misma dirección y nunca se van a chocar, y los lados de la izquierda y derecha hacen exactamente lo mismo. Esa figura es un **paralelogramo**.


  La clave absoluta para pertenecer a esta familia es tener **dos pares** de lados paralelos. Si una figura tiene solo un par de lados paralelos (como una falda o pantalla de lámpara), no es un paralelogramo, sino un **trapecio**. Y si ningún par es paralelo, es un **trapezoide**.


  ![Definición de paralelogramo](/static/img/nodos/definicion-de-paralelogramo-como-cuadrilatero-con-dos-pares-de-lados-paralelos-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea $\mathcal{Q} = (A, B, C, D)$ un cuadrilátero simple en el plano euclidiano $\mathbb{R}^2$. Se define $\mathcal{Q}$ como un **paralelogramo** si y solo si sus lados opuestos son paralelos de a pares:

  $$\mathcal{Q} \text{ es paralelogramo} \iff \overline{AB} \parallel \overline{CD} \quad \wedge \quad \overline{BC} \parallel \overline{DA}$$


  ### Desglose simbólico y relaciones fundamentales

  - $\overline{AB} \parallel \overline{CD}$: Los segmentos opuestos horizontalmente no poseen puntos de intersección en sus rectas directrices continuas.

  - $\overline{BC} \parallel \overline{DA}$: Los segmentos opuestos laterales comparten vectores directores colineales.

  - Condición necesaria y suficiente: Todo cuadrilátero con dos pares de lados opuestos paralelos cumple automáticamente con la congruencia de lados opuestos, la congruencia de ángulos opuestos y la bisección de sus diagonales.

  - Jerarquía de cuadriláteros: La familia de los paralelogramos agrupa al cuadrado, rectángulo, rombo y romboide.


  > **Complemento didáctico:** Para clasificar un cuadrilátero en la PAES, la pregunta decisiva es: ¿cuántos pares de lados opuestos paralelos tiene? Si tiene dos pares, es un paralelogramo. Si tiene solo uno, es un trapecio. Si no tiene ninguno, es un trapezoide.

  '
definiciones_clave: '- **Paralelogramo**: Cuadrilátero convexo con dos pares de lados opuestos paralelos.

  - **Lados opuestos**: Par de lados que no comparten ningún vértice común en el cuadrilátero.

  - **Trapecio**: Cuadrilátero que cuenta con solo un par de lados paralelos (denominados bases).

  - **Trapezoide**: Cuadrilátero que no tiene ningún par de lados paralelos.

  '
propiedades_relaciones: '- **Simetría central**: Todo paralelogramo posee centro de simetría en el punto de corte de sus diagonales.

  - **Conservación métrica**: El paralelismo de lados implica directamente que los lados opuestos son congruentes ($AB = CD$ y $BC = DA$).

  - **Suplementariedad angular**: Los ángulos adyacentes a cualquier lado suman obligatoriamente $180^\circ$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos guiados de definición de paralelogramo](/static/img/nodos/definicion-de-paralelogramo-como-cuadrilatero-con-dos-pares-de-lados-paralelos-ejemplos.svg)


    En un cuadrilátero $ABCD$, se sabe que la recta que contiene a $\overline{AB}$ es paralela a la recta de $\overline{CD}$, y la recta de $\overline{BC}$ es secante a la recta de $\overline{DA}$ (se cortan en un punto exterior). Clasifica la figura geométrica.'
  pasos:
  - 'Paso 1: Evaluar el paralelismo del primer par de lados opuestos: $\overline{AB} \parallel \overline{CD}$, por lo que existe un par de lados paralelos.'
  - 'Paso 2: Evaluar el segundo par de lados opuestos: Las rectas $\overline{BC}$ y $\overline{DA}$ son secantes, lo que significa que no son paralelas ($\overline{BC} \not\parallel \overline{DA}$).'
  - 'Paso 3: Concluir la clasificación: Al tener exactamente un par de lados opuestos paralelos, la figura no es un paralelogramo, sino un trapecio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición geométrica que define formalmente a un paralelogramo?
  choices:
  - text: Tener dos pares de lados opuestos paralelos.
    is_correct: true
  - text: Tener cuatro lados de exactamente la misma medida.
    is_correct: false
  - text: Tener un solo par de lados opuestos paralelos denominados bases.
    is_correct: false
  - text: Tener sus cuatro ángulos interiores rectos.
    is_correct: false
  explanation: La alternativa correcta es 'Tener dos pares de lados opuestos paralelos.' Por definición euclidiana, un cuadrilátero es paralelogramo si y solo si sus dos pares de lados opuestos son paralelos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué diferencia a un paralelogramo de un trapecio?
  choices:
  - text: El paralelogramo tiene 2 pares de lados paralelos, mientras que el trapecio tiene solo 1 par paralelo.
    is_correct: true
  - text: El paralelogramo tiene 4 ángulos rectos y el trapecio no tiene ninguno.
    is_correct: false
  - text: El paralelogramo no puede ser dividido en triángulos mediante diagonales.
    is_correct: false
  - text: El trapecio siempre tiene lados de mayor longitud que un paralelogramo.
    is_correct: false
  explanation: La alternativa correcta es 'El paralelogramo tiene 2 pares de lados paralelos, mientras que el trapecio tiene solo 1 par paralelo.' Esta es la distinción clasificatoria central de la geometría euclidiana.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las rectas soporte de los cuatro lados del cuadrilátero.

  2. Comprobar si el primer par de lados opuestos es paralelo ($L_1 \parallel L_3$).

  3. Comprobar si el segundo par de lados opuestos es paralelo ($L_2 \parallel L_4$).

  4. Si ambos pares son paralelos, catalogar la figura rigurosamente como paralelogramo.

  '
errores_correccion: '- **Error común 1:** Creer que un trapecio es un paralelogramo porque ''tiene lados paralelos''. **Corrección:** Para ser paralelogramo se exigen estrictamente DOS pares de lados paralelos, no solo uno.

  - **Error común 2:** Pensar que los rectángulos o rombos no son paralelogramos. **Corrección:** Tanto el rectángulo, el rombo y el cuadrado son paralelogramos especiales.

  '
ejemplos:
- tipo: A
  titulo: Clasificación de cuadriláteros
  enunciado: Un cuadrilátero tiene lados opuestos $AB \parallel CD$ y $BC \parallel DA$. ¿A qué familia geométrica pertenece?
  alternativas:
  - text: Paralelogramo.
    is_correct: true
  - text: Trapecio isósceles.
    is_correct: false
  - text: Trapezoide asimétrico.
    is_correct: false
  - text: Deltoide no paralelogramo.
    is_correct: false
  explicacion: Al tener dos pares de lados opuestos paralelos, pertenece a la familia de los paralelogramos.
- tipo: B
  titulo: Trapecio como paralelogramo
  enunciado: ¿Puede un trapecio con solo un par de lados paralelos clasificarse como paralelogramo?
  respuesta: 'No'
  explicacion: No. Por definición, el paralelogramo exige que sus dos pares de lados opuestos sean paralelos.
errores_frecuentes:
- '''Confundir un trapecio con un paralelogramo por el hecho de tener un par de bases paralelas.'''
- '''Creer que para ser paralelogramo los cuatro lados deben ser obligatoriamente iguales.'''
- '''Excluir al cuadrado y al rectángulo de la categoría de paralelogramos.'''
afirmaciones_verdaderas:
- '''Todo cuadrilátero con dos pares de lados opuestos paralelos es un paralelogramo.'''
- '''El cuadrado, el rectángulo y el rombo son paralelogramos.'''
- '''En un paralelogramo, los lados opuestos nunca se cortan en el plano euclidiano.'''
al_terminar_debes_poder: '**QUÉ:** Identificar, clasificar y distinguir a los paralelogramos de otros cuadriláteros como trapecios y trapezoides.


  **CÓMO:** Verificando algebraicamente y geométricamente la condición de paralelismo dual $\overline{AB} \parallel \overline{CD} \wedge \overline{BC} \parallel \overline{DA}$.


  ![Síntesis de definición de paralelogramo](/static/img/nodos/definicion-de-paralelogramo-como-cuadrilatero-con-dos-pares-de-lados-paralelos-resumen.svg)

  '
