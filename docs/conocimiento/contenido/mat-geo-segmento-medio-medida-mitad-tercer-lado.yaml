semantic_id: MAT.GEO.SEGMENTO_MEDIO.MEDIDA_MITAD_TERCER_LADO
resumen_inicial: 'Propiedad de medida del segmento medio como mitad del tercer lado:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: 'Además de ser paralelo al tercer lado, el segmento medio tiene
  una relación numérica exacta con él: siempre mide exactamente la mitad.'
explicacion_formal: '![Segmento medio, mitad del tercer lado](/static/img/geometria/elementos-secundarios/segmento-medio-medida-mitad-tercer-lado.svg)


  ### Definición formal


  Si M y N son los puntos medios de AB y AC en un triángulo ABC, entonces $MN=\frac{BC}{2}$.


  ### Desarrollo didáctico


  Si el lado BC mide 10 cm, el segmento medio MN (relativo a BC) mide exactamente
  10/2=5 cm, sin importar la forma del triángulo.'
definiciones_clave: '- **Propiedad de medida del segmento medio como mitad del tercer
