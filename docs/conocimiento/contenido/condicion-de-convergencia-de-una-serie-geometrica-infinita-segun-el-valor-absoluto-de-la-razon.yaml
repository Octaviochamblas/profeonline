procedimiento:
- 'Paso 1: Calcula la razón ''r'' dividiendo el 2do término por el 1ro.'
- 'Paso 2: Quítale el signo (toma su valor absoluto).'
- 'Paso 3: Pregúntate: ¿Es estrictamente menor que 1?'
- 'Paso 4: Si es Sí, la serie converge y puedes usar la fórmula. Si es No, la serie
  diverge (su suma es infinito o no existe).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en condición de convergencia de una serie geométrica infinita según el valor
  absoluto de la razón.
ejemplos:
- titulo: El portero matemático
  enunciado: Determina si la serie infinita 5 - 10 + 20 - 40... se puede sumar con
    la fórmula.
  solucion_pasos:
  - 'Calculamos r: -10 / 5 = -2.'
  - Valor absoluto de r es 2.
  - Como 2 es mayor que 1, el portero la rechaza.
  - 'Respuesta: NO converge, no se puede calcular un total fijo.'
- titulo: Ejemplo 1
  enunciado: ¿Cuál razón permite que una serie geométrica infinita converja?
  alternativas:
  - r igual a -0,4
  - r igual a -2
  - r igual a 5
  respuesta: r igual a -0,4
  solucion_pasos:
  - Su valor absoluto, 0,4, es menor que 1.
- titulo: Ejemplo 2
  enunciado: ¿La serie con razón r igual a 1 converge?
  alternativas:
  - 'No'
  - Sí
  - Solo si a_1 es positivo
  respuesta: 'No'
  solucion_pasos:
  - El valor absoluto de 1 no es estrictamente menor que 1, por lo tanto no converge.
- titulo: ¿Una razón r igual a -0,9 permite que la serie converja?
  respuesta: Sí
  solucion_pasos:
  - Su valor absoluto, 0,9, es menor que 1.
- titulo: ¿El signo de la razón determina por sí solo si la serie converge?
  respuesta: 'No'
  solucion_pasos:
  - Lo que determina la convergencia es el valor absoluto de la razón, no su signo.
errores_frecuentes:
- Afirmar que si la razón es negativa, automáticamente la serie diverge (Las razones
  negativas pequeñas como -0.5 convergen perfectamente).
- Forzar la fórmula con $r > 1$ y entregar ciegamente el resultado negativo como respuesta
  válida.
- Afirmar que toda razón negativa hace que la serie diverja, sin calcular su valor
  absoluto.
- Declarar 'converge' con 'crece', pensando que una serie que converge no puede tener
  términos grandes al principio.
- Aplicar la fórmula de suma infinita sin verificar antes la condición de convergencia.
afirmaciones_verdaderas:
- La formulación de condición de convergencia de una serie geométrica infinita según
  el valor absoluto de la razón mantiene la regularidad de la sucesión.
- La condición de convergencia depende únicamente del valor absoluto de la razón,
  sin importar si esta es positiva o negativa.
al_terminar_debes_poder: Resolver problemas prácticos utilizando condición de convergencia
