semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.ASINTOTA_VERTICAL
resumen_inicial: 'Identificación de la asíntota vertical de la función logarítmica
  básica: conceptos, asíntotas, propiedades e inversidad en Análisis de la función
  logarítmica.'
explicacion_simple: A medida que $x$ se acerca a $0$ por la derecha, el logaritmo
  crece o decrece sin límite, pero nunca llega a tocar el eje $y$. Esa barrera invisible
  es la asíntota vertical.
explicacion_formal: '### Definición formal


  La recta $x=0$ es asíntota vertical de $f(x)=\log_b(x)$ porque, cuando $x\to0^+$,
  se cumple que $f(x)\to+\infty$ si $b>1$, o $f(x)\to-\infty$ si $0<b<1$; en ambos
  casos la gráfica se aproxima a la recta sin cruzarla, ya que $x=0$ no pertenece
  al dominio.


  ### Desarrollo didáctico


  Prueba con $b=2$: si $x=0{,}1$, entonces $\log_2(0{,}1)\approx-3{,}32$; si $x=0{,}0001$,
  entonces $\log_2(0{,}0001)\approx-13{,}29$. Mientras más se acerca $x$ a $0$, más
  negativo se vuelve el logaritmo, pero $x$ nunca llega a ser $0$ ni negativo dentro
  del dominio.'
definiciones_clave: '- **Identificación de la asíntota vertical de la función logarítmica
  básica**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a identificación de la asíntota vertical de la función logarítmica básica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de identificación
    de la asíntota vertical de la función logarítmica básica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de identificación de la asíntota
    vertical de la función logarítmica básica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    identificación de la asíntota vertical de la función logarítmica básica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis de la
      función logarítmica
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis de la función logarítmica. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en identificación de la asíntota vertical de la función logarítmica básica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica que el dominio de $f(x)=\log_b(x)$ excluye $x=0$ y todo valor
  negativo.'
- 'Paso 2: Evalúa la función con valores de $x$ cada vez más cercanos a $0$ por la
  derecha.'
- 'Paso 3: Observa que los valores de $f(x)$ crecen o decrecen sin cota, señalando
  la asíntota en $x=0$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en identificación
  de la asíntota vertical de la función logarítmica básica.
ejemplos:
- titulo: Comportamiento cerca de la asíntota
  enunciado: Describe qué ocurre con $f(x)=\log_2(x)$ cuando $x$ se acerca a $0$ por
    la derecha.
  solucion_pasos:
  - Se evalúan valores decrecientes de $x$: $0{,}1$, $0{,}01$, $0{,}001$.
  - Los resultados $-3{,}32$, $-6{,}64$, $-9{,}97$ se vuelven cada vez más negativos
    sin límite.
- titulo: Identificación de la ecuación de la asíntota
  enunciado: ¿Cuál es la ecuación de la asíntota vertical de $f(x)=\log_5(x)$?
  solucion_pasos:
  - El dominio de cualquier función logarítmica excluye $x=0$.
  - La asíntota vertical es siempre la recta $x=0$, independiente de la base.
- titulo: ¿La función logarítmica corta la asíntota vertical?
  enunciado: ¿La gráfica de $f(x)=\log_b(x)$ llega a tocar la recta $x=0$?
  respuesta: 'No'
  solucion_pasos:
  - $x=0$ no pertenece al dominio de la función logarítmica.
- titulo: ¿La asíntota vertical depende del valor de la base?
  enunciado: ¿La posición de la asíntota vertical cambia según el valor de la base
    $b$?
  respuesta: 'No'
  solucion_pasos:
  - Para toda base válida $b>0$, $b\neq1$, la asíntota vertical siempre es $x=0$.
errores_frecuentes:
- Declarar la asíntota vertical de la función logarítmica con la asíntota horizontal
  de la exponencial.
- Afirmar que la gráfica puede tocar o cruzar el eje $y$ para valores muy pequeños
  de $x$.
- Declarar que la posición de la asíntota depende de la base $b$.
- Omitir mencionar que la asíntota es vertical y no horizontal al describir la gráfica.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando identificación de la asíntota vertical de la función logarítmica básica.
