semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.ASINTOTA_VERTICAL
resumen_inicial: 'La asíntota vertical de la función logarítmica básica es la recta de ecuación $x = 0$ (eje $y$), hacia la cual la curva se aproxima infinitamente al acercarse al origen.'
explicacion_simple: |
  Una asíntota vertical es una línea frontera erguida hacia la cual la gráfica se va pegando cada vez más sin llegar a tocarla. En la función logarítmica básica $f(x) = \log_b(x)$, esa línea vertical es el propio eje $y$ (la recta $x = 0$). Cuando probamos números positivos cada vez más cercanos a cero (como $0.001$), el logaritmo nos da números negativos gigantescos (como $-10$), haciendo que la curva caiga verticalmente pegada al eje $y$.
explicacion_formal: |
  ### Definición formal
  La **asíntota vertical** de la función logarítmica básica $f(x) = \log_b(x)$ es la recta frontera de ecuación cartesiana:
  $$x = 0 \quad (\text{eje } y)$$
  determinada analíticamente por la evaluación del límite lateral cuando la variable $x$ se aproxima al origen por la derecha ($x \to 0^+$):
  - **Para $b > 1$ (creciente)**: $\lim_{x \to 0^+} \log_b(x) = -\infty$.
  - **Para $0 < b < 1$ (decreciente)**: $\lim_{x \to 0^+} \log_b(x) = +\infty$.

  ### Desglose simbólico
  - Inalcanzabilidad del eje $y$: Como el dominio es $]0, +\infty[$, el valor $x = 0$ no pertenece a la función, por lo que la curva jamás interseca a la recta $x = 0$.
  - Desplazamiento por transformaciones: Para la función general $f(x) = a \cdot \log_b(cx + d) + k$, la asíntota vertical se desplaza a la recta de solución del argumento nulo:
    $$cx + d = 0 \implies x = -\frac{d}{c}$$

  ### Síntesis didáctica
  Diferenciar asíntota vertical de asíntota horizontal: La función exponencial posee una asíntota horizontal $y = 0$. Su función inversa logarítmica intercambia los ejes, poseyendo una asíntota vertical $x = 0$.
definiciones_clave: |
  - **Asíntota vertical**: Recta vertical $x = c$ hacia la que converge el comportamiento límite de la función cuando la variable se acerca a $c$.
  - **Límite por la derecha $x \to 0^+$**: Aproximación a cero considerando únicamente valores estrictamente positivos.
  - **Divergencia asintótica**: Caída ilimitada hacia $-\infty$ o elevación hacia $+\infty$ bordeando la recta $x = 0$.
propiedades_relaciones: |
  - **Unicidad de la asíntota vertical**: La función logarítmica posee exactamente una asíntota vertical en toda su gráfica.
  - **Cota del dominio**: La posición de la asíntota vertical $x = x_{\text{asint}}$ marca el punto límite fronterizo del dominio de definición.
ejemplo_guiado:
  enunciado: 'Identifica la asíntota vertical y describe el comportamiento límite cuando $x \to 0^+$ para las siguientes funciones: A) $f(x) = \log_2(x)$, B) $g(x) = \log_{0.5}(x)$, C) $h(x) = \ln(x - 3)$.'
  pasos:
    - 'Paso 1: Para $f(x) = \log_2(x)$, la asíntota vertical es el eje $y$ (recta $x = 0$). Como $b = 2 > 1$, la curva tiende a $-\infty$ cuando $x \to 0^+$.'
    - 'Paso 2: Para $g(x) = \log_{0.5}(x)$, la asíntota vertical es la recta $x = 0$. Como $b = 0.5 < 1$, la curva tiende a $+\infty$ cuando $x \to 0^+$.'
    - 'Paso 3: Para $h(x) = \ln(x - 3)$, igualamos argumento a cero: $x - 3 = 0 \implies x = 3$. La asíntota vertical se desplaza a la recta $x = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación de la asíntota vertical de la función logarítmica básica $f(x) = \log_5(x)$ y qué ocurre con su valor cuando $x$ se aproxima a cero por la derecha?'
    choices:
      - {text: 'Asíntota vertical $x = 0$, y la función tiende hacia $-\infty$ al aproximarse $x \to 0^+$', is_correct: true}
      - {text: 'Asíntota horizontal $y = 0$, y la función tiende a cero', is_correct: false}
      - {text: 'Asíntota vertical $x = 5$, y la función se anula', is_correct: false}
      - {text: 'La función no posee asíntotas de ningún tipo', is_correct: false}
    explanation: 'La alternativa correcta es ''Asíntota vertical $x = 0$, y la función tiende hacia $-\infty$ al aproximarse $x \to 0^+$''. Con base $5 > 1$, al acercarnos a $x = 0$ por la derecha, las potencias requeridas son exponentes negativos cada vez mayores en magnitud.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función logarítmica se expresa como $f(x) = \log_2(x - 6)$, ¿cuál es la recta de su asíntota vertical?'
    choices:
      - {text: 'La recta de ecuación $x = 6$', is_correct: true}
      - {text: 'La recta de ecuación $x = 0$', is_correct: false}
      - {text: 'La recta de ecuación $y = 6$', is_correct: false}
      - {text: 'La recta de ecuación $y = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta de ecuación $x = 6$''. La asíntota vertical ocurre en el valor de $x$ que anula el argumento del logaritmo: $x - 6 = 0 \implies x = 6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Para la función básica $f(x) = \log_b(x)$, declarar la asíntota vertical en la recta $x = 0$.'
  - 'Paso 2: Para una función trasladada $f(x) = \log_b(cx + d)$, igualar el argumento a cero: $cx + d = 0$.'
  - 'Paso 3: Despejar $x$ para obtener la ecuación de la recta asíntota vertical $x = -\frac{d}{c}$.'
  - 'Paso 4: Analizar la base $b$ y el signo de $a$ para determinar si el extremo asintótico cae a $-\infty$ o sube a $+\infty$.'
errores_correccion: |
  - **Error 1:** Escribir la asíntota de la función logarítmica como una recta horizontal $y = 0$. **Cómo corregirlo:** La asíntota de la función logarítmica es una recta **vertical** de ecuación $x = c$. Es la función exponencial la que posee asíntota horizontal $y = 0$.
  - **Error 2:** Creer que la gráfica de la función logarítmica toca o cruza su asíntota vertical. **Cómo corregirlo:** El valor de la asíntota anula el argumento ($\log_b(0)$), el cual no existe. La aproximación es infinita pero sin intersección.
ejemplos:
  - titulo: 'Asíntota en logaritmo natural'
    enunciado: '¿Cuál es la asíntota vertical de $f(x) = \ln(x)$?'
    alternativas:
      - 'La recta $x = 0$'
      - 'La recta $y = 0$'
      - 'La recta $x = 1$'
    respuesta: 'La recta $x = 0$'
    solucion_pasos:
      - '1. Es la función logarítmica natural mónica.'
      - '2. Su asíntota vertical es el eje $y$, de ecuación $x = 0$.'
  - titulo: 'Asíntota en traslación a la derecha'
    enunciado: '¿La asíntota vertical de $g(x) = \log_3(x - 4)$ es la recta $x = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Igualamos $x - 4 = 0 \implies x = 4$.'
  - titulo: 'Comportamiento en base menor a 1'
    enunciado: 'Para $h(x) = \log_{0.2}(x)$, ¿el límite cuando $x \to 0^+$ es igual a $+\infty$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser la base $0.2 < 1$, al acercarnos a $x = 0$ por la derecha la gráfica se eleva a $+\infty$.'
  - titulo: 'Invariancia por la traslación vertical'
    enunciado: '¿Sumar $+10$ al final de $f(x) = \log_2(x) + 10$ modifica la asíntota vertical $x = 0$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La traslación vertical no altera la posición horizontal de la asíntota $x = 0$.'
errores_frecuentes:
  - 'La asíntota de la función logarítmica $f(x) = \log_2(x)$ es la recta horizontal $y = 0$.'
  - 'La función logarítmica $f(x) = \ln(x)$ interseca a su asíntota vertical en el origen de coordenadas $(0, 0)$.'
  - 'La asíntota vertical de $f(x) = \log_3(x - 8)$ se ubica en la recta $y = 8$.'
  - 'Las funciones logarítmicas no poseen asíntotas verticales.'
  - 'La asíntota vertical de la función logarítmica se desplaza cuando cambia el valor de la base $b$.'
afirmaciones_verdaderas:
  - 'La gráfica de la función logarítmica básica $f(x) = \log_b(x)$ posee una asíntota vertical en la recta $x = 0$ (el eje $y$).'
  - 'La asíntota vertical de una función logarítmica trasladada $f(x) = a \cdot \log_b(cx + d) + k$ viene dada por la recta $x = -\frac{d}{c}$, donde el argumento se anula.'
al_terminar_debes_poder: 'Identificar la asíntota vertical $x = c$ de cualquier función logarítmica analizando su comportamiento límite.'
