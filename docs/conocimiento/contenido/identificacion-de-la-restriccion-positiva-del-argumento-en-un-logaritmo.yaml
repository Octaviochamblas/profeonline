semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.RESTRICCION_ARGUMENTO
resumen_inicial: La restricción positiva del argumento en un logaritmo establece que $\log_b(a)$ existe en los reales si y solo si $a > 0$, dado que ninguna potencia de base positiva $b > 0$ puede arrojar como resultado cero o un número negativo.
explicacion_simple: "![La restricción positiva del argumento en un logaritmo establece que $\\log_b(a)$ existe en los reales si y solo si $a > 0$, dado que ninguna potencia de base positiva $b > 0$ puede arrojar como resultado cero o un número negativo](/static/img/nodos/identificacion-de-la-restriccion-positiva-del-argumento-en-un-logaritmo-intro.svg)\n\n\nEl **argumento** (lo que metes dentro del logaritmo) tiene una regla inquebrantable:\n\n$$\\log_b(\\mathbf{a}) \\quad \\implies \\quad \\mathbf{a > 0} \\quad (\\text{Estrictamente Mayor que Cero})$$\n\n- **¿Por qué?**\n  - Porque el logaritmo busca potencias de bases positivas ($b > 0$).\n  - Piensa en el 2:\n    - $2^3 = 8 > 0$.\n    - $2^{-5} = 1/32 > 0$.\n    - $2^{-100} > 0$.\n  - **¡NUNCA DA CERO NI NEGATIVO!**\n- **Consecuencias:**\n  - $\\log(0) = \\text{NO EXISTE en los reales}$.\n  - $\\log(-5) = \\text{NO EXISTE en los reales}$.\n  - $\\log(0,00001) = -5$ (¡Totalmente válido porque es positivo!)."
explicacion_formal: "Sea $b \\in \\mathbb{R}^+ \\setminus \\{1\\}$. Por la caracterización del recorrido de la función exponencial $\\operatorname{Rec}(\\exp_b) = \\mathbb{R}^+ = ]0, +\\infty[$:\n$$\\operatorname{Dom}(\\log_b) = \\operatorname{Rec}(\\exp_b) = \\mathbb{R}^+ = \\{x \\in \\mathbb{R} \\mid x > 0\\}$$\n\n**Imposibilidad analítica en $\\mathbb{R}$**:\n1. **Para $a = 0$**:\n   $\\lim_{x \\to 0^+} \\log_b(x) = \\pm\\infty$, lo que genera una asíntota vertical en $x = 0$ y demuestra que $0 \\notin \\operatorname{Dom}(\\log_b)$.\n2. **Para $a < 0$**:\n   La ecuación $b^c = a < 0$ carece de soluciones en el cuerpo ordenado real $\\mathbb{R}$ (requiere el cuerpo complejo $\\mathbb{C}$ con ramas logarítmicas multivaluadas $\\operatorname{Ln}(z) = \\ln|z| + i \\operatorname{Arg}(z)$)."
definiciones_clave: '- **Dominio logarítmico real**: Conjunto de reales estrictamente positivos $\mathbb{R}^+ = ]0, +\infty[$.

  - **Asíntota vertical canónica**: Recta $x = 0$ hacia la cual la curva logarítmica desciende o asciende asintóticamente.'
propiedades_relaciones: '- **Desigualdad de existencia**: Para cualquier expresión $\log_b(g(x))$, la condición de existencia es la inecuación estricta $g(x) > 0$.

  - **Exclusión del cero**: $\log_b(0)$ no está definido en $\mathbb{R}$ bajo ninguna base.'
ejemplo_guiado:
  enunciado: '![Ejemplo La restricción positiva del argumento en un logaritmo establece que $\log_b(a)$ existe en los reales si y solo si $a > 0$, dado que ninguna potencia de base positiva $b > 0$ puede arrojar como resultado cero o un número negativo](/static/img/nodos/identificacion-de-la-restriccion-positiva-del-argumento-en-un-logaritmo-ejemplos.svg)



    Determina el dominio de existencia real para las siguientes funciones logarítmicas:

    1) $f(x) = \log_2(2x - 8)$

    2) $g(x) = \ln(9 - x^2)$'
  pasos:
  - 'Paso 1: Para $f(x) = \log_2(2x - 8)$:

    - Exigir positividad estricta del argumento: $2x - 8 > 0$.

    - Resolver: $2x > 8 \implies x > 4$.

    - Dominio: $\operatorname{Dom}(f) = ]4, +\infty[$.'
  - 'Paso 2: Para $g(x) = \ln(9 - x^2)$:

    - Exigir: $9 - x^2 > 0 \implies x^2 < 9$.

    - Resolver desigualdad cuadrática: $-3 < x < 3$.

    - Dominio: $\operatorname{Dom}(g) = ]-3, 3[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = \log(x + 6)$?
  choices:
  - text: ']-6, +∞[ (todos los reales mayores que -6)'
    is_correct: true
  - text: '[-6, +∞[ (incluyendo el -6)'
    is_correct: false
  - text: ']0, +∞['
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: 'La alternativa correcta es '']-6, +∞[ (todos los reales mayores que -6)''. El argumento debe ser estrictamente positivo: $x + 6 > 0 \implies x > -6$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la expresión $\log_3(x - 2)$ no existe para x = 2?
  choices:
  - text: Porque al evaluar x = 2 el argumento se vuelve cero (log₃(0) no existe en ℝ)
    is_correct: true
  - text: Porque da 1
    is_correct: false
  - text: Porque 2 es par
    is_correct: false
  - text: Porque la base es 3
    is_correct: false
  explanation: La alternativa correcta es 'Porque al evaluar x = 2 el argumento se vuelve cero (log₃(0) no existe en ℝ)'. El argumento debe ser estrictamente mayor que cero ($> 0$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar la expresión algebraica contenida en el argumento del logaritmo.'
- 'Paso 2: Plantear la inecuación estricta $\text{Argumento} > 0$.'
- 'Paso 3: Resolver la inecuación lineal, cuadrática o racional obtenida.'
- 'Paso 4: Escribir el dominio en notación de intervalos abiertos sin incluir los puntos de anulación.'
errores_correccion: '- **Error común:** Colocar $\ge 0$ (mayor o igual) al plantear el dominio de un logaritmo.

  - **Cómo corregirlo:** El argumento **NUNCA puede ser cero**; debe ser **estrictamente mayor que cero ($> 0$)** con corchetes abiertos.'
ejemplos:
- titulo: 'Ejemplo 1: Argumento lineal'
  enunciado: ¿Para qué valores existe $\log_5(3x - 12)$?
  alternativas:
  - x > 4
  - x ≥ 4
  - x > 12
  - x > 0
  respuesta: x > 4
  solucion_pasos:
  - 'Paso 1: $3x - 12 > 0 \implies 3x > 12 \implies x > 4$.'
- titulo: 'Ejemplo 2: Argumento con signo negativo'
  enunciado: 'Encuentra el dominio de $f(x) = \log(10 - x)$:'
  alternativas:
  - ']-inf, 10['
  - ']10, +inf['
  - '[10, +inf['
  - R
  respuesta: ']-inf, 10['
  solucion_pasos:
  - 'Paso 1: $10 - x > 0 \implies x < 10 \implies ]-\infty, 10[$.'
- titulo: 'Ejemplo 3: Argumento decimal positivo'
  enunciado: ¿Existe $\log_2(0{,}0004)$ en los números reales?
  alternativas:
  - Sí, porque 0,0004 > 0 (su resultado es un número real negativo)
  - No, es muy pequeño
  - No, los decimales no tienen logaritmo
  - Da cero
  respuesta: Sí, porque 0,0004 > 0 (su resultado es un número real negativo)
  solucion_pasos:
  - 'Paso 1: Como $0{,}0004 > 0$, el logaritmo existe y pertenece a $\mathbb{R}$.'
- titulo: 'Ejemplo 4: Argumento con valor absoluto sin cero'
  enunciado: ¿Cuál es el dominio de $g(x) = \ln|x - 5|$?
  alternativas:
  - R \ {5}
  - ']5, +inf['
  - R
  - '[5, +inf['
  respuesta: R \ {5}
  solucion_pasos:
  - 'Paso 1: $|x - 5| > 0$ para todo $x \neq 5 \implies \mathbb{R} \setminus \{5\}$.'
errores_frecuentes:
- Incluir el cero en el dominio del logaritmo usando corchetes cerrados.
- 'Asumir que si el argumento tiene un signo menos (ej: -x) nunca existe (existe para x < 0).'
- Confundir la negatividad del resultado del logaritmo con la del argumento.
afirmaciones_verdaderas:
- El argumento de un logaritmo real debe ser estrictamente positivo (a > 0).
- El logaritmo de cero no está definido en el cuerpo de los números reales.
al_terminar_debes_poder: '**QUÉ:** Determinar y justificar la restricción de argumento positivo a > 0 en logaritmos.


  **CÓMO:** Formulando y resolviendo la inecuación estricta Argumento > 0 para definir dominios reales admisibles.


