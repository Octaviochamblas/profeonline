semantic_id: MAT.NUM.DIVISIBILIDAD.DIVISION_EXACTA
resumen_inicial: La divisibilidad entre dos enteros exige que la división tenga residuo cero en el algoritmo de Euclides.
explicacion_simple: 'La divisibilidad es la propiedad que nos indica si un número se deja dividir por otro sin dejar ningún resto sobrante. Cuando al hacer la división formal el resto final es cero, afirmamos que el primer número es divisible por el segundo.


  ![Divisibilidad como división exacta](/static/img/nodos/divisibilidad-como-division-exacta-intro.svg)'
explicacion_formal: 'En el **Algoritmo de la División de Euclides**, para $a, b \in \mathbb{Z}$ con $b \neq 0$, existen únicos $q, r \in \mathbb{Z}$ tales que:


  $$a = b \cdot q + r \quad \text{con } 0 \le r < |b|$$


  **Definición de Divisibilidad:**

  $$a \text{ es divisible por } b \iff r = 0 \iff a = b \cdot q$$


  **Desglose de la fórmula:**

  - $q$: Cociente entero de la división.

  - $r$: Residuo de la división ($r=0 \implies$ divisibilidad exacta).


  > **Complemento didáctico:** Si $r > 0$, la división es inexacta y el residuo indica cuánto le falta o sobrepasa la cantidad para ser un múltiplo exacto.'
definiciones_clave: '- **Divisibilidad**: Propiedad matemática de producir un residuo nulo ($r = 0$) en el algoritmo euclidiano.

  - **Residuo ($r$)**: Cantidad sobrante $0 \le r < |b|$ tras dividir entero entre entero.'
propiedades_relaciones: '- **Aritmética modular**: $a$ es divisible por $b \iff a \equiv 0 \pmod b$.'
ejemplo_guiado:
  enunciado: 'Determine si $45$ es divisible por $6$ aplicando el algoritmo de la división euclidiana.


    ![Ejemplo Divisibilidad como división exacta](/static/img/nodos/divisibilidad-como-division-exacta-ejemplos.svg)'
  pasos:
  - 'Paso 1: Plantear la división euclidiana: $45 = 6 \cdot q + r$.'
  - 'Paso 2: Calcular el cociente entero máximo: $q = 7$ ($6 \cdot 7 = 42$).'
  - 'Paso 3: Obtener el residuo: $r = 45 - 42 = 3$.'
  - 'Conclusión: Como el residuo $r = 3 \neq 0$, $45$ NO es divisible por $6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué valor debe tener el residuo r para que una división sea exacta y exista divisibilidad?
  choices:
  - text: r = 0
    is_correct: true
  - text: r = 1
    is_correct: false
  - text: r = b
    is_correct: false
  - text: Cualquier valor menor que 10
    is_correct: false
  explanation: La alternativa correcta es 'r = 0'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado 45 : 6, ¿cuál fue el residuo r obtenido?'
  choices:
  - text: '3'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '7'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '3', por lo que no es divisible.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la división de $a$ por $b$ para obtener el cociente $q$ y el resto $r$.'
- 'Paso 2: Evaluar si el resto $r$ es exactamente igual a cero.'
- 'Paso 3: Declarar divisibilidad si $r=0$, o falta de divisibilidad si $r>0$.'
errores_correccion: '- **Error 1: Confundir divisibilidad con obtener un resultado decimal.** **Cómo corregirlo:** La divisibilidad exige que el cociente sea ENTERO sin decimales y el resto nulo.


  - **Error 2: Aceptar residuos negativos en la división euclidiana.** **Cómo corregirlo:** El residuo debe ser estrictamente no negativo ($0 \le r < |b|$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es 56 divisible por 8?
  alternativas:
  - Sí, porque 56 = 8 · 7 con residuo 0
  - No, el residuo es 1
  - No, porque es impar
  respuesta: Sí, porque 56 = 8 · 7 con residuo 0
  solucion_pasos:
  - '$56 : 8 = 7$ exacto con residuo $r = 0$.'
- titulo: Ejemplo 2
  enunciado: Al dividir 29 entre 4, ¿cuál es el cociente $q$ y el residuo $r$?
  alternativas:
  - q = 7, r = 1
  - q = 6, r = 5
  - q = 7, r = 0
  respuesta: q = 7, r = 1
  solucion_pasos:
  - $29 = 4 \cdot 7 + 1$.
- titulo: ¿Si una división tiene residuo 0 se cumple que el dividendo es divisible por el divisor?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de divisibilidad en Euclides.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
- titulo: ¿Es 33 divisible por 5?
  respuesta: 'No'
  solucion_pasos:
  - No, $33 = 5 \cdot 6 + 3$ (residuo $r = 3 \neq 0$).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
errores_frecuentes:
- Una división es exacta aun cuando deje un residuo decimal en la calculadora.
- El residuo en el algoritmo de Euclides puede tomar valores negativos arbitrarios.
- Un número $a$ es divisible por $b$ si la división da como resultado un número racional no entero.
- El cociente de una división exacta entre dos enteros puede ser indeterminado.
- Si el residuo de $a:b$ es 2, significa que $a$ es un múltiplo exacto de $b$.
afirmaciones_verdaderas:
- La divisibilidad exige que el residuo en el algoritmo euclidiano sea idénticamente cero.
- Si $a = b \cdot q$, entonces $a$ es divisible por $b$ y por $q$.
al_terminar_debes_poder: '**QUÉ:** Reconocer la divisibilidad como la condición necesaria y suficiente de división euclídea exacta.


  **CÓMO:** Aplicando el algoritmo de la división $D = d \cdot c + r$ con la condición estricta $r = 0$, y utilizando relaciones modulares $D \equiv 0 \pmod d$.


  ![Resumen Divisibilidad como división exacta](/static/img/nodos/divisibilidad-como-division-exacta-resumen.svg)'
