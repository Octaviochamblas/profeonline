semantic_id: MAT.NUM.PROPORCIONES.MEDIA_PROPORCIONAL
resumen_inicial: La media proporcional (o media geométrica) entre dos números positivos
  $a$ y $c$ es el valor $b$ que se repite en los medios de una proporción continua
  ($\frac{a}{b} = \frac{b}{c} \implies b = \sqrt{a \cdot c}$).
explicacion_simple: 'La **media proporcional** es el número central positivo $b$ que
  cumple que $a, b, c$ están en proporción continua:

  $$\frac{a}{b} = \frac{b}{c} \implies b^2 = a \cdot c \implies b = \sqrt{a \cdot
  c}$$

  Es exactamente igual a la **media geométrica** entre $a$ y $c$.

  Ejemplo: La media proporcional entre $4$ y $9$ es $b = \sqrt{4 \cdot 9} = \sqrt{36}
  = 6$.'
explicacion_formal: 'Dados $a, c \in \mathbb{R}^+$, la media proporcional entre $a$
  y $c$ es el número real positivo $b$ que satisface $\frac{a}{b} = \frac{b}{c}$.
  Se calcula mediante la raíz cuadrada del producto de los extremos: $b = \sqrt{a
  \cdot c}$.'
definiciones_clave: '- **Media proporcional / geométrica ($b$)**: Término medio positivo
  $b = \sqrt{a \cdot c}$.'
propiedades_relaciones: '- **Media geométrica**: Coincidencia total con la definición
  de media geométrica de dos números positivos.'
ejemplo_guiado:
  enunciado: Calcula la media proporcional entre $2$ y $18$.
  pasos:
  - 'Plantear la proporción continua: $\frac{2}{b} = \frac{b}{18}$.'
  - 'Aplicar la propiedad fundamental: $b^2 = 2 \cdot 18$.'
  - 'Multiplicar los extremos: $b^2 = 36$.'
  - 'Extraer la raíz cuadrada positiva: $b = \sqrt{36} = 6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la media proporcional entre 3 y 12?
  choices:
  - text: '6'
    is_correct: true
  - text: 7,5
    is_correct: false
  - text: '36'
    is_correct: false
  - text: '9'
    is_correct: false
  explanation: 'La correcta es: 6. $b = \sqrt{3 \cdot 12} = \sqrt{36} = 6$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Halla la media proporcional entre 5 y 20.
  choices:
  - text: '10'
    is_correct: true
  - text: 12,5
    is_correct: false
  - text: '100'
    is_correct: false
  - text: '15'
    is_correct: false
  explanation: 'La correcta es: 10. $b = \sqrt{5 \cdot 20} = \sqrt{100} = 10$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los dos números dados ($a \cdot c$).'
- 'Paso 2: Extraer la raíz cuadrada del producto ($b = \sqrt{a \cdot c}$).'
errores_correccion: No confundas la media proporcional (geométrica) con el promedio
  aritmético. La media aritmética de 4 y 9 es $6{,}5$, pero su media proporcional
  es $\sqrt{36} = 6$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula la media proporcional de 1 y 16.
  alternativas:
  - '4'
  - 8,5
  - '8'
  respuesta: '4'
  solucion_pasos:
  - $b = \sqrt{1 \cdot 16} = 4$.
errores_frecuentes:
- Calcular la media aritmética en lugar de la media geométrica.
afirmaciones_verdaderas:
- La media proporcional de $a$ y $c$ es $b = \sqrt{ac}$.
al_terminar_debes_ponder: Calcular la media proporcional de dos números positivos.
fuente: Texto escolar MINEDUC.
