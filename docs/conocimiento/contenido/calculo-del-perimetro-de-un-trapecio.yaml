semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.PERIMETRO_TRAPECIO
resumen_inicial: 'El perímetro de un trapecio es la suma de las longitudes de sus cuatro lados exteriores: P = B + b + c₁ + c₂.'
explicacion_simple: 'El perímetro mide el contorno completo de la figura. Para rodear un trapecio por su borde exterior, tienes que sumar sus cuatro costados: la base de abajo ($B$), la base de arriba ($b$), y los dos lados laterales ($c_1$ y $c_2$): **$P = B + b + c_1 + c_2$**.


  Si el trapecio es isósceles, como los dos lados laterales son gemelos, la fórmula queda aún más compacta: **$P = B + b + 2c$**. La única regla que jamás debes romper es: **usa siempre los lados exteriores oblicuos, nunca la altura interior**.


  ![Cálculo del perímetro de un trapecio](/static/img/nodos/calculo-del-perimetro-de-un-trapecio-intro.svg)

  '
explicacion_formal: '### Definición métrica del perímetro

  Sea $\mathcal{ABCD}$ un trapecio simple con base mayor $B$, base menor $b$ y lados no paralelos $c_1$ y $c_2$. La función perímetro $P$ es la suma del contorno lineal:

  $$P = B + b + c_1 + c_2$$


  ### Casos particulares

  1. **Trapecio isósceles ($c_1 = c_2 = c$):**

  $$P = B + b + 2c$$

  2. **Trapecio rectángulo ($c_1 = h$, $c_2 = \sqrt{h^2 + (B - b)^2}$):**

  $$P = B + b + h + \sqrt{h^2 + (B - b)^2}$$


  ### Despeje de incógnitas laterales

  En situaciones donde un lado lateral no es provisto de forma explícita, se debe resolver previamente mediante el Teorema de Pitágoras empleando la proyección lateral correspondiente antes de calcular la suma perimetral.


  > **Complemento didáctico:** Trampa clásica de examen: te dibujan un trapecio con una línea punteada interior que dice $h = 4\text{ cm}$ y te piden el perímetro. ¡Cuidado! Esa línea punteada es interior y no forma parte del contorno. Solo se suman los bordes exteriores.

  '
definiciones_clave: '- **Perímetro del trapecio ($P$)**: Suma total de las cuatro fronteras lineales de la figura.

  - **Borde exterior**: Segmentos que delimitan la región plana del trapecio con respecto al exterior.

  - **Lado oblicuo**: Segmento lateral que conecta las bases y aporta longitud al perímetro.

  '
propiedades_relaciones: '- **Desigualdad perimetral**: En todo trapecio no rectángulo, $P > B + b + 2h$, ya que cada lado oblicuo es mayor que la altura ($c > h$).

  - **Escalamiento lineal**: Si las dimensiones del trapecio se multiplican por un factor $k > 0$, el perímetro resultante se multiplica por $k$.

  - **Relación con la mediana**: Como $B + b = 2M$, el perímetro también puede expresarse como $P = 2M + c_1 + c_2$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de perímetro de trapecio](/static/img/nodos/calculo-del-perimetro-de-un-trapecio-ejemplos.svg)


    Un trapecio isósceles tiene base mayor $B = 18$ cm, base menor $b = 10$ cm y altura $h = 3$ cm. Calcula su perímetro.'
  pasos:
  - 'Paso 1: Hallar la proyección lateral $x$: $x = \frac{B - b}{2} = \frac{18 - 10}{2} = 4$ cm.'
  - 'Paso 2: Calcular el lado lateral $c$ con Pitágoras: $c = \sqrt{h^2 + x^2} = \sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$ cm.'
  - 'Paso 3: Aplicar la fórmula del perímetro para trapecio isósceles: $P = B + b + 2c$.'
  - 'Paso 4: Calcular el resultado: $P = 18 + 10 + 2(5) = 28 + 10 = 38$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el perímetro de un trapecio isósceles de bases B y b, y lado no paralelo c?
  choices:
  - text: P = B + b + 2c.
    is_correct: true
  - text: P = B + b + c.
    is_correct: false
  - text: P = (B + b) · c.
    is_correct: false
  - text: P = 2(B + b) + c.
    is_correct: false
  explanation: La alternativa correcta es 'P = B + b + 2c.' Al ser isósceles, tiene dos lados laterales de medida $c$, sumando $B + b + c + c = B + b + 2c$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un trapecio tiene lados que miden 12 cm, 5 cm, 6 cm y 7 cm. ¿Cuál es su perímetro?
  choices:
  - text: 30 cm.
    is_correct: true
  - text: 15 cm.
    is_correct: false
  - text: 35 cm.
    is_correct: false
  - text: 60 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''30 cm.'' Sumando los 4 lados: $P = 12 + 5 + 6 + 7 = 30$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las cuatro medidas exteriores del trapecio ($B, b, c_1, c_2$).

  2. Si falta un lado lateral, deducirlo con Pitágoras utilizando la altura y la proyección de bases.

  3. Sumar los cuatro lados: $P = B + b + c_1 + c_2$.

  4. Verificar que no se haya sumado por error la altura perpendicular interior.

  '
errores_correccion: '- **Error común 1:** Sumar la altura en vez del lado oblicuo. **Corrección:** La altura es una cota interior; el perímetro solo incluye el contorno exterior.

  - **Error común 2:** Olvidar duplicar el lado lateral en el trapecio isósceles. **Corrección:** Hay dos lados laterales iguales, se debe sumar $2c$.

  '
ejemplos:
- tipo: A
  titulo: Perímetro con mediana
  enunciado: En un trapecio, la mediana mide $11\text{ cm}$ y los lados no paralelos miden $5\text{ cm}$ y $7\text{ cm}$. ¿Cuál es su perímetro?
  alternativas:
  - text: $34\text{ cm}$.
    is_correct: true
  - text: $23\text{ cm}$.
    is_correct: false
  - text: $46\text{ cm}$.
    is_correct: false
  - text: $28\text{ cm}$.
    is_correct: false
  explicacion: Como $M = 11$, la suma de bases es $B + b = 2M = 22\text{ cm}$. Luego $P = 22 + 5 + 7 = 34\text{ cm}$.
- tipo: B
  titulo: Inclusión de la altura en el perímetro
  enunciado: ¿Debe sumarse la altura perpendicular al calcular el perímetro de un trapecio escaleno?
  respuesta: 'No'
  explicacion: No. La altura es interior y no forma parte del contorno perimetral.
errores_frecuentes:
- '''Sumar la altura $h$ confundiéndola con el lado lateral $c$.'''
- '''Olvidar que en trapecios isósceles se deben sumar ambos lados laterales ($2c$).'''
- '''Confundir la fórmula del perímetro con la del área.'''
afirmaciones_verdaderas:
- '''El perímetro de cualquier trapecio es la suma de sus cuatro lados exteriores.'''
- '''En un trapecio isósceles, el perímetro equivale a $P = B + b + 2c$.'''
- '''El perímetro puede calcularse a partir de la mediana mediante $P = 2M + c_1 + c_2$.'''
al_terminar_debes_poder: '**QUÉ:** Calcular con precisión el perímetro de cualquier trapecio deduciendo lados desconocidos si es necesario.


  **CÓMO:** Utilizando $P = B + b + c_1 + c_2$ y apoyándose en el Teorema de Pitágoras.


  ![Síntesis de perímetro de trapecio](/static/img/nodos/calculo-del-perimetro-de-un-trapecio-resumen.svg)

  '
