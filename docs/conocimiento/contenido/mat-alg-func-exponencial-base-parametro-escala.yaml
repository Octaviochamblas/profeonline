semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_ESCALA
resumen_inicial: 'El parámetro $a$ es el coeficiente de escala que multiplica a la potencia exponencial, determinando la ordenada al origen $f(0) = a$ y la orientación vertical de la gráfica.'
explicacion_simple: |
  En la función $f(x) = a \cdot b^x$, el parámetro $a$ es la cantidad de partida o valor inicial. Si evaluamos en $x = 0$, la potencia $b^0$ se convierte en 1, por lo que la función vale exactamente $a$. Además de fijar el punto donde la curva cruza el eje vertical $y$, el signo de $a$ decide si la curva está por encima del eje $x$ (si $a > 0$) o reflejada patas arriba por debajo del eje $x$ (si $a < 0$).
explicacion_formal: |
  ### Definición formal
  En la función exponencial $f(x) = a \cdot b^x$, el **parámetro de escala o amplicación** $a \in \mathbb{R} \setminus \{0\}$ se define analíticamente mediante la condición de frontera en el origen:
  $$f(0) = a \cdot b^0 = a \cdot 1 = a$$
  lo que fija el punto de corte con el eje ordenado en $(0, a)$.

  ### Desglose simbólico
  - Efecto de magnitud $|a|$:
    - $|a| > 1 \implies$ Dilatación vertical de la gráfica en un factor $|a|$.
    - $0 < |a| < 1 \implies$ Contracción vertical de la gráfica por el factor $|a|$.
  - Efecto de signo $\operatorname{sgn}(a)$:
    - $a > 0 \implies$ La curva yace completamente sobre el semiplano superior de ordenadas ($y > 0$).
    - $a < 0 \implies$ La curva se refleja respecto al eje $x$ y yace en el semiplano inferior ($y < 0$).

  ### Síntesis didáctica
  Diferenciar el rol de $a$ del de la base $b$: El parámetro $a$ es un factor puramente multiplicativo externo. No altera la tasa de crecimiento o decrecimiento dada por la base $b$, pero escala y orienta verticalmente toda la gráfica.
definiciones_clave: |
  - **Parámetro de escala $a$**: Coeficiente multiplicativo real no nulo que fija la cota inicial $f(0) = a$.
  - **Intersección $(0, a)$**: Punto único de corte con el eje vertical $y$.
  - **Reflexión vertical**: Inversión espectral de la curva a través del eje $x$ cuando $a < 0$.
propiedades_relaciones: |
  - **Determinación del signo del recorrido**: Si $a > 0$, el recorrido de $f(x) = a \cdot b^x$ es $]0, +\infty[$. Si $a < 0$, el recorrido es $]-\infty, 0[$.
  - **Invariancia de la asíntota**: El parámetro $a$ altera la distancia de los puntos a la asíntota, pero la recta asíntota horizontal sigue siendo el eje $x$ ($y = 0$).
ejemplo_guiado:
  enunciado: 'Dadas las funciones $f(x) = 4 \cdot 3^x$ y $g(x) = -2 \cdot 3^x$, determina el intercepto con el eje $y$, el semiplano donde yacen sus gráficas y su valor en $x = 1$.'
  pasos:
    - 'Paso 1: Para $f(x) = 4 \cdot 3^x$, el parámetro de escala es $a = 4$. El intercepto con el eje $y$ es $(0, 4)$.'
    - 'Paso 2: Como $a = 4 > 0$, la gráfica yace completamente por encima del eje $x$ ($y > 0$). Evaluamos $f(1) = 4 \cdot 3^1 = 12$.'
    - 'Paso 3: Para $g(x) = -2 \cdot 3^x$, el parámetro de escala es $a = -2$. El intercepto con el eje $y$ es $(0, -2)$.'
    - 'Paso 4: Como $a = -2 < 0$, la gráfica se refleja patas arriba y yace por debajo del eje $x$ ($y < 0$). Evaluamos $g(1) = -2 \cdot 3^1 = -6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué punto cartesiano cruza la gráfica de la función exponencial $f(x) = -7 \cdot 4^x$ al eje de las ordenadas (eje $y$)?'
    choices:
      - {text: '$(0, -7)$', is_correct: true}
      - {text: '$(0, 4)$', is_correct: false}
      - {text: '$(0, -28)$', is_correct: false}
      - {text: '$(-7, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(0, -7)$''. Al evaluar $x = 0$, obtenemos $f(0) = -7 \cdot 4^0 = -7 \cdot 1 = -7$, fijando el punto de corte en $(0, -7)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función exponencial tiene coeficiente de escala $a = -0.5$ y base $b = 2$, ¿cuál es el conjunto recorrido de la función $f(x) = -0.5 \cdot 2^x$?'
    choices:
      - {text: '$\operatorname{Rec}(f) = ]-\infty, 0[$', is_correct: true}
      - {text: '$\operatorname{Rec}(f) = ]0, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
      - {text: '$\operatorname{Rec}(f) = [-0.5, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Rec}(f) = ]-\infty, 0[$''. Puesto que $a = -0.5 < 0$, todos los valores de salida resultan estrictamente negativos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el número $a$ que multiplica libremente por fuera de la potencia exponencial.'
  - 'Paso 2: Evaluar $x = 0$ para confirmar que el punto de corte con el eje $y$ es el par $(0, a)$.'
  - 'Paso 3: Analizar el signo de $a$ para determinar si la función toma imágenes positivas ($a > 0$) o negativas ($a < 0$).'
  - 'Paso 4: Deducir el conjunto recorrido de la función según el signo de $a$.'
errores_correccion: |
  - **Error 1:** Afirmar que el intercepto con el eje $y$ depende de la base $b$. **Cómo corregirlo:** La base evaluada en cero siempre da $b^0 = 1$. Por lo tanto, el intercepto depende exclusivamente del valor del coeficiente $a$.
  - **Error 2:** Creer que la gráfica cruza el eje $x$ cuando $a$ es negativo. **Cómo corregirlo:** Un coeficiente $a < 0$ invierte la gráfica colocándola por debajo del eje $x$, pero la curva nunca toca ni cruza la asíntota $y = 0$.
ejemplos:
  - titulo: 'Cálculo de intercepto con el eje y'
    enunciado: '¿Cuál es la ordenada de corte con el eje $y$ de $f(x) = 15 \cdot 2^x$?'
    alternativas:
      - '$y = 15$'
      - '$y = 30$'
      - '$y = 2$'
    respuesta: '$y = 15$'
    solucion_pasos:
      - '1. Evaluamos $x = 0 \implies f(0) = 15 \cdot 2^0 = 15 \cdot 1 = 15$.'
      - '2. La ordenada de corte es $y = 15$.'
  - titulo: 'Interpretación de a = 1'
    enunciado: 'En la función mónica $g(x) = 5^x$, ¿el corte con el eje $y$ ocurre en el punto $(0, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $a = 1$, la curva cruza el eje $y$ en el punto $(0, 1)$.'
  - titulo: 'Escala fraccionaria'
    enunciado: 'Si $a = \frac{1}{4}$, ¿el valor de la función en $x = 0$ es igual a $0.25$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(0) = \frac{1}{4} \cdot b^0 = \frac{1}{4} = 0.25$.'
  - titulo: 'Conservación del signo'
    enunciado: 'Para $f(x) = -3 \cdot 2^x$, ¿todas las imágenes $f(x)$ son números negativos para todo $x \in \mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que $2^x > 0$ para todo $x$, multiplicar por $-3$ hace que las salidas sean siempre negativas.'
errores_frecuentes:
  - 'En la función $f(x) = 6 \cdot 2^x$, el corte con el eje $y$ se ubica en el punto $(0, 2)$.'
  - 'Un parámetro de escala negativo como $a = -4$ hace que la base $b$ cambie a negativa.'
  - 'Si $a = 5$, la función exponencial corta al eje $x$ en el punto $(5, 0)$.'
  - 'El valor de $a$ se obtiene elevando la base $b$ al cuadrado.'
  - 'Una función exponencial con $a < 0$ corta al eje $x$ en dos puntos reales.'
afirmaciones_verdaderas:
  - 'El parámetro de escala $a$ determina exactamente la ordenada al origen de la función exponencial en el punto $(0, a)$.'
  - 'El signo de $a$ establece si el recorrido de la función exponencial básica son los reales positivos ($a > 0$) o los reales negativos ($a < 0$).'
