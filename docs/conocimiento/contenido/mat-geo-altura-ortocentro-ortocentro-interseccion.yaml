semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_INTERSECCION
resumen_inicial: 'Definición de ortocentro como punto de intersección de las alturas:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: 'Aunque un triángulo tiene tres alturas distintas, las tres siempre
  se cruzan en un mismo punto: el ortocentro.'
explicacion_formal: '![Ortocentro, intersección de las alturas](/static/img/geometria/elementos-secundarios/altura-ortocentro-ortocentro-interseccion.svg)


  ### Definición formal


  Dado un triángulo ABC, el ortocentro H es el punto común a las tres rectas que contienen
  las alturas desde A, B y C.


  ### Desarrollo didáctico


  Al trazar las tres alturas de un triángulo, se observa que, sin importar la forma
  del triángulo, siempre se cruzan en un único punto H, el ortocentro.'
definiciones_clave: '- **Definición de ortocentro como punto de intersección de las
