semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.MEDIANA_TRAPECIO_DEFINICION
resumen_inicial: La mediana (o base media) de un trapecio es el segmento que une los puntos medios de sus dos lados no paralelos.
explicacion_simple: 'Si tomas un trapecio y marcas el punto medio exacto del lado izquierdo ($M$) y el punto medio exacto del lado derecho ($N$), y luego trazas una línea que conecte esos dos puntos, habrás dibujado la **mediana del trapecio** (también llamada base media).


  Este segmento tiene una propiedad geométrica asombrosa: **es perfectamente paralelo a las dos bases** ($MN \parallel B \parallel b$). Actúa como una repisa nivelada colocada justo a la mitad de la altura de la figura.


  ![Definición de mediana del trapecio](/static/img/nodos/definicion-de-mediana-del-trapecio-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea $\mathcal{ABCD}$ un trapecio con bases $\overline{AB} \parallel \overline{CD}$ y lados no paralelos $\overline{AD}$ y $\overline{BC}$. Sean $M$ el punto medio de $\overline{AD}$ y $N$ el punto medio de $\overline{BC}$. Se define el segmento $\overline{MN}$ como la **mediana** o **base media** del trapecio:

  $$\overline{MN} \iff M \in \overline{AD} \ (AM \cong MD) \quad \wedge \quad N \in \overline{BC} \ (BN \cong NC)$$


  ### Teorema del paralelismo de la mediana

  La mediana de un trapecio es estrictamente paralela a ambas bases:

  $$\overline{MN} \parallel \overline{AB} \quad \wedge \quad \overline{MN} \parallel \overline{CD}$$


  ### Demostración geométrica

  1. Trácese la recta que pasa por los puntos $D$ y $N$, prolongándola hasta intersecar la prolongación de la base $\overline{AB}$ en el punto $E$.

  2. En los triángulos $\triangle CND$ y $\triangle BNE$: $CN = NB$ (por ser $N$ punto medio), $\angle CND \cong \angle BNE$ (opuestos por el vértice) y $\angle NCD \cong \angle NBE$ (alternos internos entre $\overline{CD} \parallel \overline{AE}$).

  3. Por criterio **ALA**, $\triangle CND \cong \triangle BNE$.

  4. En consecuencia, $DN = NE$, lo que demuestra que $N$ es el punto medio del segmento $\overline{DE}$, y además $CD = BE$.

  5. En el triángulo $\triangle ADE$, el segmento $\overline{MN}$ une los puntos medios de los lados $\overline{AD}$ y $\overline{DE}$.

  6. Por el Teorema de la Base Media en triángulos, $\overline{MN} \parallel \overline{AE}$ (luego $\overline{MN} \parallel \overline{AB} \parallel \overline{CD}$).


  > **Complemento didáctico:** Mucho ojo con el vocabulario: en el triángulo, la ''mediana'' une un vértice con el punto medio opuesto. Pero en el trapecio, la ''mediana'' une los puntos medios de los dos lados laterales. ¡No te confundas!

  '
definiciones_clave: '- **Mediana (base media)**: Segmento cuyos extremos son los puntos medios de los lados no paralelos del trapecio.

  - **Punto medio lateral**: Punto que divide a un lado oblicuo en dos segmentos congruentes.

  - **Teorema de la base media**: Teorema fundamental que garantiza el paralelismo de la mediana con respecto a las bases.

  '
propiedades_relaciones: '- **Paralelismo simultáneo**: $\overline{MN} \parallel \text{Base Mayor} \parallel \text{Base Menor}$.

  - **Bisección de la altura**: La mediana corta a cualquier segmento de altura perpendicular en su punto medio exacto ($h/2$).

  - **Bisección de diagonales**: La mediana interseca a ambas diagonales del trapecio en sus respectivos puntos medios.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de definición de mediana](/static/img/nodos/definicion-de-mediana-del-trapecio-ejemplos.svg)


    En un trapecio $ABCD$ de bases $AB \parallel CD$, el lado lateral $AD$ mide $10$ cm y el lado lateral $BC$ mide $12$ cm. Si $MN$ es la mediana del trapecio, determina las longitudes de los segmentos $AM$ y $CN$.'
  pasos:
  - 'Paso 1: Identificar la definición de mediana: Los extremos $M$ y $N$ son los puntos medios de los lados laterales $AD$ y $BC$.'
  - 'Paso 2: Calcular $AM$: Al ser $M$ punto medio de $AD$, divide al lado en dos mitades iguales: $AM = \frac{AD}{2} = \frac{10}{2} = 5$ cm.'
  - 'Paso 3: Calcular $CN$: Al ser $N$ punto medio de $BC$, divide al lado en dos mitades iguales: $CN = \frac{BC}{2} = \frac{12}{2} = 6$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los puntos que une la mediana de un trapecio?
  choices:
  - text: Los puntos medios de los lados no paralelos.
    is_correct: true
  - text: Los puntos medios de las dos bases paralelas.
    is_correct: false
  - text: Un vértice del trapecio con el centro de la base mayor.
    is_correct: false
  - text: Los puntos de intersección de las diagonales con la altura.
    is_correct: false
  explanation: La alternativa correcta es 'Los puntos medios de los lados no paralelos.' Por definición euclidiana, la mediana del trapecio conecta los puntos medios de sus lados laterales.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación posicional tiene la mediana respecto a las bases de un trapecio?
  choices:
  - text: Es rigurosamente paralela a ambas bases.
    is_correct: true
  - text: Es perpendicular a la base mayor y oblicua a la base menor.
    is_correct: false
  - text: Se corta con las bases formando un ángulo de 45°.
    is_correct: false
  - text: No guarda ninguna relación de paralelismo con las bases.
    is_correct: false
  explanation: 'La alternativa correcta es ''Es rigurosamente paralela a ambas bases.'' Demostrado por el Teorema de la Base Media: $\overline{MN} \parallel \overline{AB} \parallel \overline{CD}$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Localizar los lados laterales no paralelos del trapecio.

  2. Identificar sus respectivos puntos medios $M$ y $N$.

  3. Trazar el segmento $\overline{MN}$ uniendo dichos puntos medios.

  4. Aplicar el paralelismo $\overline{MN} \parallel b_1 \parallel b_2$ para resolver ángulos o relaciones de Tales.

  '
errores_correccion: '- **Error común 1:** Creer que la mediana une los puntos medios de las bases. **Corrección:** El segmento que une los puntos medios de las bases no es la mediana; la mediana une los lados laterales.

  - **Error común 2:** Confundir la mediana del trapecio con la mediana de un triángulo. **Corrección:** En el triángulo parte desde un vértice; en el trapecio une dos lados.

  '
ejemplos:
- tipo: A
  titulo: Puntos medios en trapecio
  enunciado: Si $M$ es el punto medio del lado lateral izquierdo de un trapecio y $N$ es el del lado derecho, ¿cómo se llama el segmento $\overline{MN}$?
  alternativas:
  - text: Mediana o base media del trapecio.
    is_correct: true
  - text: Diagonal secundaria.
    is_correct: false
  - text: Apotema del trapecio.
    is_correct: false
  - text: Eje de simetría oblicuo.
    is_correct: false
  explicacion: El segmento que une los puntos medios de los lados laterales es la mediana o base media.
- tipo: B
  titulo: Paralelismo de la mediana
  enunciado: ¿Es la mediana de un trapecio paralela a sus bases?
  respuesta: Sí
  explicacion: Sí. La mediana es estrictamente paralela a ambas bases del trapecio.
errores_frecuentes:
- '''Confundir la mediana del trapecio con el segmento que une las bases.'''
- '''Asumir que la mediana solo es paralela a las bases en el trapecio isósceles.'''
- '''Creer que la mediana tiene la misma medida que la altura del trapecio.'''
afirmaciones_verdaderas:
- '''La mediana del trapecio une los puntos medios de sus lados no paralelos.'''
- '''La mediana es paralela a ambas bases del trapecio.'''
- '''La mediana corta a la altura del trapecio exactamente por la mitad.'''
al_terminar_debes_poder: '**QUÉ:** Definir y trazar la mediana de un trapecio identificando sus puntos medios y relaciones de paralelismo.


  **CÓMO:** Verificando que sus extremos pertenezcan a los lados no paralelos y satisfagan $\overline{MN} \parallel b_1 \parallel b_2$.


  ![Síntesis de definición de mediana](/static/img/nodos/definicion-de-mediana-del-trapecio-resumen.svg)

  '
