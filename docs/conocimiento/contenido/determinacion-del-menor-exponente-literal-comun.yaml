resumen_inicial: La determinación del menor exponente literal común establece que,
  para una variable presente en todos los términos, el factor común debe elevarse
  estrictamente al exponente más pequeño con el que figura.
explicacion_simple: 'Si tienes $x^7 + x^4 - x^2$, la variable $x$ aparece en los tres
  términos con exponentes 7, 4 y 2. El exponente más pequeño es 2. Por lo tanto, el
  factor común literal es $x^2$. Divides cada término por $x^2$ restando exponentes:
  $x^2(x^5 + x^2 - 1)$.'
explicacion_formal: 'Dada la expresión literal $P(x) = c_1 x^{a_1} + c_2 x^{a_2} +
  \dots + c_n x^{a_n}$ con $a_i \in \mathbb{N}$, la **Determinación del Menor Exponente
  Literal** exige seleccionar el grado $m$:


  $$m = \min(a_1, a_2, \dots, a_n) \implies P(x) = x^m \cdot \sum_{i=1}^n c_i x^{a_i
  - m}$$


  **Desglose simbólico:**

  - $x^m$: Monomio literal común de grado máximo divisor.

  - $a_i - m \ge 0$: Garantiza que los exponentes resultantes dentro del paréntesis
  sean enteros no negativos (polinomio bien definido en $\mathbb{R}[x]$).


  > **Complemento didáctico:** Si se eligiera un exponente mayor que el mínimo, aparecerían
  exponentes negativos ($x^{-k}$), violando la definición de polinomio.'
definiciones_clave: '- **Menor exponente común**: Exponente mínimo de una variable
  compartida por todos los sumandos.

  - **Exponente entero no negativo**: Condición $a_i - m \ge 0$ necesaria para mantener
  términos polinomiales.'
propiedades_relaciones: '- **Invarianza de no-negatividad**: Elegir el menor exponente
  asegura que ningún residuo quede como una fracción del tipo $\frac{1}{x^k}$.'
ejemplo_guiado:
  enunciado: Factorice el polinomio $x^8y^3 - x^5y^4 + x^3y^6$ seleccionando el menor
    exponente de cada variable literal.
  pasos:
  - 'Paso 1: Analizar la variable $x$: exponentes son $8, 5, 3 \to \min = 3 \implies
    x^3$.'
  - 'Paso 2: Analizar la variable $y$: exponentes son $3, 4, 6 \to \min = 3 \implies
    y^3$.'
  - 'Paso 3: Formar el factor común literal: $x^3y^3$.'
  - 'Paso 4: Dividir restando exponentes: $x^{8-3}y^{3-3} - x^{5-3}y^{4-3} + x^{3-3}y^{6-3}
    = x^5 - x^2y + y^3$.'
  - 'Paso 5: Escribir el polinomio factorizado: $x^3y^3(x^5 - x^2y + y^3)$.'
  - 'Conclusión: El factor común literal con menor exponente es $x^3y^3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es obligatorio elegir el menor exponente de la variable al extraer
    un factor común literal en un polinomio?
  choices:
  - text: Para asegurar que los exponentes del paréntesis sean enteros no negativos
      ($a_i - m \ge 0$)
    is_correct: true
  - text: Para que la variable se elimine por completo
    is_correct: false
  - text: Para obtener coeficientes racionales
    is_correct: false
  - text: Por convención sin justificación matemática
    is_correct: false
  explanation: La alternativa correcta es 'Para asegurar que los exponentes del paréntesis
    sean enteros no negativos ($a_i - m \ge 0$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el polinomio $x^8y^3 - x^5y^4 + x^3y^6$, ¿cuál es el factor común literal?
  choices:
  - text: $x^3y^3$
    is_correct: true
  - text: $x^8y^6$
    is_correct: false
  - text: $x^5y^4$
    is_correct: false
  - text: $x y$
    is_correct: false
  explanation: La alternativa correcta es '$x^3y^3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las letras que aparecen en la totalidad de los sumandos.'
- 'Paso 2: Comparar los exponentes de cada letra común y tomar el menor de ellos.'
- 'Paso 3: Anteponer el monomio común y restar su exponente a cada término original.'
errores_correccion: '- **Error 1: Extraer un exponente mayor que el mínimo dejando
  exponentes negativos dentro del paréntesis.** **Cómo corregirlo:** Se DEBE seleccionar
  el menor exponente para que los residuos tengan exponentes $\ge 0$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice $a^9 + a^6 + a^4$.
  alternativas:
  - $a^4(a^5 + a^2 + 1)$
  - $a^6(a^3 + 1 + a^{-2})$
  - $a(a^8 + a^5 + a^3)$
  respuesta: $a^4(a^5 + a^2 + 1)$
  solucion_pasos:
  - '1. Menor exponente: $a^4$.'
  - '2. Restando exponentes: $a^{9-4} + a^{6-4} + a^{4-4} = a^5 + a^2 + 1$.'
  - '3. Resultado: $a^4(a^5 + a^2 + 1)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el menor exponente común de la variable $m$ en $m^4n^2 - m^2n^5
    + m^3n^3$?
  alternativas:
  - $m^2$
  - $m^4$
  - $m^3$
  respuesta: $m^2$
  solucion_pasos:
  - '1. Exponentes de $m$: $4, 2, 3$. El menor es 2 $\to m^2$.'
- titulo: ¿Es $y^2(y^4 - 1)$ la factorización correcta por menor exponente de $y^6
    - y^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el menor exponente es 2, dejando $y^{6-2} - y^{2-2} = y^4 - 1$.
- titulo: Si el menor exponente de una variable es 1, ¿debe escribirse explícitamente
    el exponente 1 en la variable extraída?
  respuesta: 'No'
  solucion_pasos:
  - No, por convención $x^1 = x$, no se requiere escribir el 1.
errores_frecuentes:
- Seleccionar el mayor exponente de una variable provocando exponentes negativos dentro
  del paréntesis.
- Sumar los exponentes de la misma variable en lugar de identificar el exponente mínimo.
- Multiplicar los exponentes al realizar la división en lugar de restarlos.
- Declarar que cuando una variable tiene exponente 1 no se puede extraer como factor
  común.
- Reemplazar por 0 el residuo de la división cuando la resta de exponentes resulta
  cero ($x^0 = 1$).
afirmaciones_verdaderas:
- El factor común literal de una variable se forma únicamente con su menor exponente
  en el polinomio.
- Al dividir por la variable del menor exponente, los exponentes resultantes en el
  paréntesis son siempre $\ge 0$.
al_terminar_debes_poder: Al terminar serás capaz de seleccionar el menor exponente
  literal para factorizar expresiones algebraicas.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / Factorización.
