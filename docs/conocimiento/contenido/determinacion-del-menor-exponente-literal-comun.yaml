semantic_id: MAT.ALG.FACTOR_COMUN.MENOR_EXPONENTE_LITERAL
resumen_inicial: 'Determinación del menor exponente literal común: concepto, método
  de descomposición y reglas en Factor común.'
explicacion_simple: Una potencia literal puede extraerse solo hasta el menor exponente
  presente en todos los términos. Ese criterio garantiza que los cocientes mantengan
  exponentes no negativos.
explicacion_formal: '### Definición formal


  Si una variable $x$ aparece en los términos de un polinomio con exponentes $e_1,
  e_2, \dots, e_n$, el mayor exponente que puede extraerse como factor común es $\min(e_1,
  e_2, \dots, e_n)$: extraer un exponente mayor dejaría exponentes negativos en al
  menos un término del cociente.


  ### Desarrollo didáctico


  Siempre seleccionamos el menor exponente presente.


  Todo número o variable sin exponente explícito está elevado a la potencia 1.


  El término central es ''-w'', que equivale a ''-w^1''. Su exponente es 1.'
definiciones_clave: '- **Determinación del menor exponente literal común**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en determinación del menor exponente literal
  común.'
ejemplo_guiado:
