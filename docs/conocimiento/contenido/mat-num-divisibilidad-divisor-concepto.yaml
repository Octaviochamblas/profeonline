semantic_id: MAT.NUM.DIVISIBILIDAD.DIVISOR_CONCEPTO
resumen_inicial: 'Un entero $d$ es divisor de $n$ ($d \mid n$) si la división $n :
  d$ es exacta sin residuo.'
explicacion_simple: Un número es divisor de otro cuando cabe en él una cantidad exacta
  de veces sin que sobre nada. Decimos que 3 es divisor de 12 porque podemos repartir
  12 objetos en grupos de 3 de forma perfecta, sin que quede ningún elemento suelto.
explicacion_formal: 'Dados dos enteros $d, n \in \mathbb{Z}$ con $d \neq 0$, se dice
  que $d$ es **Divisor** de $n$ (denotado por $d \mid n$) si existe un entero $k \in
  \mathbb{Z}$ tal que:


  $$n = d \cdot k \quad \iff \quad n \equiv 0 \pmod d$$


  **Desglose de la fórmula:**

  - $d \mid n$: Notación de divisibilidad '' $d$ divide a $n$ ''.

  - $k \in \mathbb{Z}$: Cociente entero de la división exacta $n : d = k$.

  - $n \equiv 0 \pmod d$: Residuo cero en el algoritmo de la división.


  > **Complemento didáctico:** El 1 es divisor de todos los números enteros ($1 \mid
  n$), y todo número entero $n \neq 0$ es divisor de sí mismo ($n \mid n$).'
definiciones_clave: '- **Divisor de un número**: Entero $d$ que divide exactamente
  a $n$ dejando residuo cero.

  - **Notación de divisibilidad ($d \mid n$)**: Símbolo vertical que indica que $d$
  divide a $n$.'
propiedades_relaciones: '- **Finitud del conjunto**: El conjunto de divisores de un
  entero no nulo es siempre finito y acotado por $[-|n|, |n|]$.'
ejemplo_guiado:
  enunciado: Verifique si el número $6$ es divisor del entero $24$ aplicando la condición
    de división exacta.
  pasos:
  - 'Paso 1: Realizar la división $24 : 6 = 4$.'
  - 'Paso 2: Comprobar el residuo: el cociente es $4$ entero exacto y el residuo es
    $0$.'
  - 'Conclusión: Como el residuo es $0$, $6$ es un divisor de $24$ ($6 \mid 24$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué significa la notación d | n en teoría de números?
  choices:
  - text: Que d divide exactamente a n sin dejar residuo
    is_correct: true
  - text: Que d es mayor que n
    is_correct: false
  - text: Que d se resta con n
    is_correct: false
  - text: Que d es la raíz cuadrada de n
    is_correct: false
  explanation: La alternativa correcta es 'Que d divide exactamente a n sin dejar
    residuo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 6 es divisor de 24?
  choices:
  - text: 'Porque 24 : 6 = 4 es una división exacta con residuo cero'
    is_correct: true
  - text: Porque 6 es menor que 24
    is_correct: false
  - text: Porque 24 + 6 es par
    is_correct: false
  - text: Porque ambos terminan en número par
    is_correct: false
  explanation: 'La alternativa correcta es ''Porque 24 : 6 = 4 es una división exacta
    con residuo cero''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el entero $n$ entre el supuesto divisor $d$.'
- 'Paso 2: Comprobar si el residuo de la división es estrictamente cero.'
- 'Paso 3: Concluir que $d$ es divisor de $n$ si la división es exacta.'
errores_correccion: '- **Error 1: Afirmar que el cero es divisor de los números.**
  **Cómo corregirlo:** La división por cero no está definida; el cero NUNCA puede
  ser divisor.


  - **Error 2: Pensar que los divisores de un número son infinitos.** **Cómo corregirlo:**
  Los divisores son acotados y finitos (ej: divisores de 12 son solo {1, 2, 3, 4,
  6, 12}).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números NO es divisor de 20?
  alternativas:
  - '3'
  - '4'
  - '5'
  respuesta: '3'
  solucion_pasos:
  - '$20 : 3 = 6$ con residuo 2 (no exacta), por ende 3 no es divisor de 20.'
- titulo: Ejemplo 2
  enunciado: ¿Cuáles son los divisores triviales de cualquier número entero $n > 1$?
  alternativas:
  - 1 y el propio n
  - 0 y 1
  - 2 y n
  respuesta: 1 y el propio n
  solucion_pasos:
  - Todo número entero mayor que 1 es divisible al menos por 1 y por sí mismo.
- titulo: ¿Es el número 1 divisor de todo número entero?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $n : 1 = n$ exactamente.'
- titulo: ¿Es el número 0 un divisor de 8?
  respuesta: 'No'
  solucion_pasos:
  - No, la división por cero no está definida.
errores_frecuentes:
- El número cero se clasifica como un divisor universal para todos los enteros.
- El conjunto de los divisores positivos de un número entero es un conjunto infinito.
- Un número entero $n$ no puede ser divisor de sí mismo.
- Si $d$ es divisor de $n$, entonces $d$ debe ser obligatoriamente un número primo.
- Los divisores de un entero positivo pueden ser mayores que el propio número.
afirmaciones_verdaderas:
- 'Un número $d$ es divisor de $n$ si la división $n : d$ deja residuo cero.'
- El conjunto de divisores positivos de un entero es siempre un conjunto finito.
al_terminar_debes_poder: 'Al terminar serás capaz de determinar si un entero $d$ es
  divisor de $n$, verificando que la división $n : d$ sea exacta con residuo cero.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
