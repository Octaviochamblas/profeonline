semantic_id: MAT.NUM.DIVISIBILIDAD.DIVISOR_CONCEPTO
resumen_inicial: "Un divisor de $b$ es un número que lo divide exactamente, sin resto. A diferencia de los múltiplos, los divisores de un número son finitos."
explicacion_simple: |
  Si tienes 12 dulces y los repartes entre 3 amigos, a cada uno le tocan 4 exactos: eso
  significa que 3 es divisor de 12. Un divisor de un número es cualquier número que lo
  divide exactamente, sin que sobre nada. El 12 tiene varios divisores: 1, 2, 3, 4, 6 y
  12. A diferencia de los múltiplos (infinitos), los divisores de un número son limitados.
explicacion_formal: |
  $a$ es divisor de $b$ ($a \mid b$) si existe un natural $k$ tal que $b=a\cdot k$, es
  decir, si $b\div a$ es exacto. El conjunto $D(b)$ de todos los divisores de $b$ es
  finito, a diferencia del conjunto de múltiplos.
definiciones_clave: |
  **Divisor**: número que divide exactamente a otro. **$D(b)$**: conjunto finito de todos
  los divisores de $b$. **Notación** $a\mid b$: "$a$ divide a $b$".
propiedades_relaciones: |
  El $1$ es divisor de todo número natural. Todo número es divisor de sí mismo. Todo
  divisor de $b$ es menor o igual que $b$. Si $a\mid b$, el complementario $b/a$ también
  es divisor de $b$.
ejemplo_guiado:
  enunciado: "Determina si 7 es divisor de 84."
  pasos:
    - 'Se calcula $84\div7=12$ con resto $0$.'
    - 'El cociente es exacto y $84=7\cdot12$.'
    - 'Conclusión: 7 sí es divisor de 84, es decir, $7\mid84$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estas afirmaciones sobre el conjunto de divisores $D(b)$ es correcta?"
    choices:
      - {text: "Es siempre infinito", is_correct: false}
      - {text: "Es siempre finito", is_correct: true}
      - {text: "Solo tiene un elemento", is_correct: false}
      - {text: "Nunca incluye al 1", is_correct: false}
    explanation: "La correcta es Es siempre finito: a diferencia de los múltiplos, el conjunto de divisores de cualquier número es limitado."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 11 divisor de 88?"
    choices:
      - {text: "Sí, $88=11\\times8$", is_correct: true}
      - {text: "No, sobra 1", is_correct: false}
      - {text: "No se puede determinar", is_correct: false}
      - {text: "Sí, porque 88 es par", is_correct: false}
    explanation: "La correcta es Sí, $88=11\\times8$: la división $88\\div11=8$ es exacta."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Dividir $b \div a$ y calcular el resto.'
  - 'Paso 2: Si el resto es 0, entonces $a$ es divisor de $b$ ($a \mid b$).'
  - 'Paso 3: Si el resto es distinto de 0, $a$ no divide a $b$ ($a \nmid b$).'
errores_correccion: |
  Un error frecuente es creer que si $a$ es divisor de $b$, entonces $b$ también es
  divisor de $a$; en general esto no se cumple. Otro error es olvidar que $1$ y el propio
  número siempre son divisores (divisores triviales).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si 9 es divisor de 72."
    alternativas:
      - 'Sí, $72=9\times8$'
      - "No, sobra 3"
      - "No se puede determinar"
    respuesta: "Sí, $72=9\\times8$"
    solucion_pasos:
      - 'Se calcula $72 \div 9 = 8$ con resto $0$.'
      - 'El cociente es exacto y $72 = 9 \cdot 8$.'
      - 'Conclusión: 9 sí es divisor de 72, es decir, $9 \mid 72$.'
  - titulo: "Ejemplo 2"
    enunciado: "Determina si 8 es divisor de 50."
    alternativas:
      - "No, sobra 2"
      - 'Sí, $50=8\times6$'
      - "No se puede determinar"
    respuesta: "No, sobra 2"
    solucion_pasos:
      - 'Se calcula $50 \div 8 = 6$ con resto $2$ (ya que $8 \cdot 6 = 48$ y $50 - 48 = 2$).'
      - 'El resto es $2 \neq 0$.'
      - 'Conclusión: 8 no es divisor de 50, es decir, $8 \nmid 50$.'
  - titulo: "¿El número 1 es divisor de todo número natural?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Para cualquier $b$ natural, se cumple $b = 1 \cdot b$.'
      - 'Esto significa que $b \div 1 = b$ con resto 0.'
      - "Por lo tanto, 1 divide a cualquier número natural."
  - titulo: "¿Si $a$ divide a $b$, entonces $b$ también divide a $a$?"
    respuesta: "No"
    solucion_pasos:
      - 'Contraejemplo: $3 \mid 12$ porque $12 = 3 \cdot 4$. Pero $12 \nmid 3$ porque $3 < 12$.'
      - 'En general, si $a < b$ y $a \mid b$, entonces $b$ no puede dividir a $a$.'
      - "La divisibilidad no es una relación simétrica en general."
errores_frecuentes:
  - "El mayor divisor de $n$ (distinto de $n$) es siempre $n/2$."
  - "Si $a$ divide a $b$ y $b$ divide a $c$, entonces $a$ no divide a $c$."
  - "El número 0 es divisor de cualquier número natural."
  - "Un número primo tiene exactamente un divisor."
  - "Todos los divisores de un número son siempre menores que ese número."
afirmaciones_verdaderas:
  - "3 es divisor de 12."
  - "El 1 es divisor de todos los números enteros."
al_terminar_debes_poder: |
  Determinar si un número es divisor de otro, y explicar por qué el conjunto de divisores
  de cualquier número natural es siempre finito, a diferencia del de múltiplos.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
