semantic_id: MAT.NUM.RAZONES_PROPORCIONES.MODELO_PROP_DIRECTA
resumen_inicial: El modelamiento algebraico de la proporcionalidad directa expresa la relación funcional entre dos variables mediante la fórmula $y = f(x) = k \cdot x$, donde $k = \frac{y}{x}$ es la constante de proporcionalidad.
explicacion_simple: "![Modelamiento algebraico directo](/static/img/nodos/modelamiento-algebraico-de-la-proporcion-directa-intro.svg)\n\nEl **modelamiento algebraico** consiste en escribir una fórmula matemática que describa el fenómeno proporcional:\n- La fórmula universal es:\n$$y = k \\cdot x$$\n- **¿Cómo se construye el modelo?**\n  1. Identificamos un dato conocido $(x_0, y_0)$.\n  2. Calculamos la constante: $k = \\frac{y_0}{x_0}$.\n  3. Escribimos la ecuación reemplazando solo el número $k$.\n- **Ejemplo:** Si por $15\\text{ m}^3$ de agua potable se pagan $\\$18.000$:\n  - $k = \\frac{18.000}{15} = 1.200\\text{ \\$/m}^3$.\n  - El modelo del costo es: $C(x) = 1.200 \\cdot x$.\n  - Ahora podemos predecir el costo para cualquier consumo: para $40\\text{ m}^3 \\implies C(40) = 1.200 \\cdot 40 = \\$48.000$."
explicacion_formal: 'Sea un fenómeno físico o económico donde la variable dependiente $y$ es proporcional a la independiente $x$.


  **Formulación del Modelo Lineal Homogéneo:**

  Se define la función modelo $f: \mathbb{R}^+ \to \mathbb{R}^+$ como:


  $$y = f(x) = k \cdot x$$


  con parámetro estructural:

  $$k = \frac{y_0}{x_0} \in \mathbb{R}^+$$


  **Capacidades del Modelo:**

  1. **Evaluación Directa (Predicción):** $y = f(x_{\text{nuevo}}) = k \cdot x_{\text{nuevo}}$.

  2. **Evaluación Inversa (Control):** $x = f^{-1}(y_{\text{meta}}) = \frac{y_{\text{meta}}}{k}$.

  3. **Tasa Marginal Constante:** $\frac{df}{dx} = k$ (la tasa de cambio es constante e invariante en todo el dominio).'
definiciones_clave: '- **Modelo proporcional directo**: Función lineal $y = kx$.

  - **Parámetro $k$**: Factor de escala que calibra el modelo con datos empíricos.

  - **Función inversa ($f^{-1}(y) = y/k$)**: Ecuación para despejar la entrada $x$.'
propiedades_relaciones: '- **Linealidad estricta**: $f(a + b) = f(a) + f(b)$ y $f(c \cdot x) = c \cdot f(x)$.

  - **Ausencia de término independiente**: $n = 0$ en $y = mx + n$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de modelamiento algebraico](/static/img/nodos/modelamiento-algebraico-de-la-proporcion-directa-ejemplos.svg)


    Construya el modelo algebraico del costo de agua $C(x)$ sabiendo que $15\text{ m}^3$ cuestan $\$18.000$, y calcule el costo de consumir $40\text{ m}^3$.'
  pasos:
  - 'Paso 1: Calcular la constante $k$: $k = \frac{18.000}{15} = 1.200\text{ \$/m}^3$.'
  - 'Paso 2: Estructurar la función modelo: $C(x) = 1.200 \cdot x$.'
  - 'Paso 3: Evaluar el modelo en $x = 40$: $C(40) = 1.200 \cdot 40 = 48.000$.'
  - 'Paso 4: Conclusión: El costo por $40\text{ m}^3$ es de $\$48.000$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la estructura algebraica general de un modelo de proporcionalidad directa?
  choices:
  - text: $y = k \cdot x$
    is_correct: true
  - text: $y = k \cdot x + n$ (con $n \neq 0$)
    is_correct: false
  - text: $y = \frac{k}{x}$
    is_correct: false
  - text: $y = k \cdot x^2$
    is_correct: false
  explanation: La alternativa correcta es '$y = k \cdot x$'. Función lineal homogénea.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se predijo el costo de 40 m³ de agua?
  choices:
  - text: Evaluando x = 40 en la fórmula modelo $C(x) = 1.200 \times 40 = 48.000$
    is_correct: true
  - text: Sumando 18.000 + 40
    is_correct: false
  - text: Dividiendo 40 entre 1.200
    is_correct: false
  - text: Multiplicando 18.000 por 40
    is_correct: false
  explanation: La alternativa correcta es 'Evaluando x = 40 en la fórmula modelo $C(x) = 1.200 \times 40 = 48.000$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables dependiente ($y$) e independiente ($x$) del problema.'
- 'Paso 2: Calcular el valor numérico de la constante $k = \frac{y_0}{x_0}$ con un dato inicial.'
- 'Paso 3: Escribir la ecuación funcional $y = k \cdot x$ y utilizarla para resolver preguntas directas o inversas.'
errores_correccion: '- **Error 1: Añadir una constante fija no justificada ($y = kx + C$).** **Cómo corregirlo:** La proporción directa pura NO tiene sumandos independientes; es estrictamente $y = kx$.

  - **Error 2: Usar variables invertidas.** **Cómo corregirlo:** Definir claramente qué magnitud es la entrada $x$ y cuál la salida $y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un resorte se estira $12\text{ cm}$ con una masa de $3\text{ kg}$, ¿cuál es el modelo $E(m)$ de su estiramiento?
  alternativas:
  - $E(m) = 4m$
  - $E(m) = 3m + 12$
  - $E(m) = 36m$
  respuesta: $E(m) = 4m$
  solucion_pasos:
  - $k = \frac{12}{3} = 4\text{ cm/kg} \implies E(m) = 4m$.
- titulo: Ejemplo 2
  enunciado: Usando el modelo $E(m) = 4m$, ¿cuántos kg se necesitan para estirar el resorte $36\text{ cm}$?
  alternativas:
  - $9\text{ kg}$
  - $144\text{ kg}$
  - $12\text{ kg}$
  respuesta: $9\text{ kg}$
  solucion_pasos:
  - $m = \frac{E}{k} = \frac{36}{4} = 9\text{ kg}$.
- titulo: ¿Permite el modelo y = kx predecir valores continuos fuera de la tabla?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la función predictiva principal del modelamiento matemático.
  alternativas:
  - texto: Sí, permite evaluar cualquier valor del dominio
    es_correcta: true
    retroalimentacion: ¡Correcto! Capacidad de interpolación y extrapolación.
  - texto: No, solo funciona con los números de la tabla
    es_correcta: false
    retroalimentacion: Incorrecto, el modelo es válido para todo el dominio real positivo.
  - texto: No, solo funciona para números pares
    es_correcta: false
    retroalimentacion: Incorrecto, aplica a reales continuos.
- titulo: ¿Es la función de costo C(x) = 500x un modelo de proporcionalidad directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, tiene la forma $y = kx$ con $k = 500$ y sin término independiente.
  alternativas:
  - texto: Sí, es una función lineal homogénea con k = 500
    es_correcta: true
    retroalimentacion: ¡Correcto! Proporcionalidad directa.
  - texto: No, es una función afín
    es_correcta: false
    retroalimentacion: Incorrecto, no tiene término libre $n$.
  - texto: No, es una función exponencial
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente de $x$ es 1.
errores_frecuentes:
- Confundir la variable de entrada con la de salida al plantear el modelo.
- Olvidar que $k$ es el factor que multiplica a la variable.
- Cometer errores al despejar $x = y / k$.
- Incluir costos fijos dentro de modelos de proporcionalidad directa pura.
afirmaciones_verdaderas:
- El modelamiento algebraico de la proporción directa adopta la forma $y = k \cdot x$.
- La constante $k$ se calcula a partir de cualquier par conocido $(x_0, y_0)$ mediante $k = \frac{y_0}{x_0}$.
- Permite resolver tanto evaluaciones directas como despejes inversos.
al_terminar_debes_poder: '![Síntesis de modelamiento algebraico](/static/img/nodos/modelamiento-algebraico-de-la-proporcion-directa-resumen.svg)


  QUÉ: Modelar fenómenos y relaciones de proporcionalidad directa mediante ecuaciones algebraicas funcionales.


  CÓMO: Determinando la constante $k = \frac{y_0}{x_0}$, formulando la función $y = k \cdot x$ y utilizándola para predecir o controlar variables en contexto.'
