semantic_id: MAT.NUM.PROP_DIRECTA.MODELO_ALGEBRAICO
resumen_inicial: 'El modelo algebraico de la proporcionalidad directa expresado como función lineal es $y = k \cdot x$, donde $y$ es la variable dependiente, $x$ la independiente y $k$ la constante de proporcionalidad.'
explicacion_simple: |
  La fórmula algebraica de la proporción directa te permite calcular rápidamente cualquier valor futuro. La ecuación general es $y = k \cdot x$. Si sabes que cada hora de trabajo ($x$) te paga $\$10.000$ ($k = 10.000$), el modelo algebraico del sueldo $y$ es $y = 10.000 \cdot x$. Para calcular el sueldo de 8 horas, simplemente reemplazas $x = 8$ en la fórmula: $y = 10.000 \cdot 8 = \$80.000$.
explicacion_formal: |
  ### Definición formal
  El **modelo algebraico canónico** de una relación de proporcionalidad directa entre dos variables real-valoricadas $x$ e $y$ viene dado por la **función lineal homogénea**:
  $$y(x) = k \cdot x \quad (k \in \mathbb{R}^+)$$

  ### Componentes de la ecuación funcional
  - **$x$**: Variable independiente (dominio de entrada).
  - **$y$**: Variable dependiente (codominio de salida).
  - **$k$**: Constante de proporcionalidad fija que actúa como coeficiente multiplicativo.

  ### Propiedad de homogeneidad de primer grado
  La función $f(x) = kx$ es una transformación homogénea de grado 1, lo cual satisface para cualquier escalar real $c$:
  $$f(c \cdot x) = k \cdot (c \cdot x) = c \cdot (k \cdot x) = c \cdot f(x)$$

  ### Comparación de modelos algebraicos
  - Proporcionalidad directa: $y = kx$.
  - Función afín (no proporcional): $y = kx + n \quad (n \neq 0)$.
  - Proporcionalidad inversa: $y = \frac{k}{x}$.

  ### Síntesis didáctica
  - Ecuación del modelo: $y = k \cdot x$.
  - Método de construcción: 1. Hallar $k = \frac{y}{x} \implies$ 2. Escribir $y = k \cdot x$.
definiciones_clave: |
  - **Modelo algebraico $y = kx$**: Expresión matemática que relaciona de forma explícita el comportamiento de dos variables proporcionales.
  - **Función lineal homogénea**: Función matemática sin término independiente ($n=0$) cuyo gráfico pasa por el origen.
  - **Coeficiente de proporcionalidad**: Factor numérico $k$ que multiplica a la variable independiente en el modelo.
propiedades_relaciones: |
  - **Despeje de la variable independiente**: A partir del modelo $y = kx$, se puede despejar la variable independiente como $x = \frac{y}{k}$.
  - **Composición funcional**: La composición de dos modelos directos $y = k_1 x$ y $z = k_2 y$ resulta en un nuevo modelo directo $z = (k_1 \cdot k_2) x$.
ejemplo_guiado:
  enunciado: 'Un estanque contiene agua y se sabe que $4\text{ minutos}$ de llenado equivalen a $120\text{ litros}$. Construye el modelo algebraico $y = kx$ y calcula cuántos litros $y$ habrán tras $15\text{ minutos}$.'
  pasos:
    - 'Paso 1: Calculamos la constante de proporcionalidad $k$ dividiendo el volumen entre el tiempo: $k = \frac{120}{4} = 30$.'
    - 'Paso 2: Escribimos la ecuación del modelo algebraico sustituyendo $k = 30$: $y = 30x$.'
    - 'Paso 3: Sustituimos el nuevo valor del tiempo independiente $x = 15$ en la fórmula modelada: $y = 30 \cdot 15$.'
    - 'Paso 4: Resolvemos la multiplicación: $y = 450\text{ litros}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la estructura del modelo algebraico de la proporcionalidad directa expresado como función lineal?'
    choices:
      - {text: '$y = k \cdot x$, donde $k$ es la constante de proporcionalidad multiplicativa', is_correct: true}
      - {text: '$y = k \cdot x + n$, agregando un término constante $n$', is_correct: false}
      - {text: '$y = \frac{k}{x}$, dividiendo la constante por la variable', is_correct: false}
      - {text: '$y = x^2 + k$, elevando la variable al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = k \cdot x$, donde $k$ es la constante de proporcionalidad multiplicativa''. Es la función lineal homogénea canónica.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el modelo algebraico del costo de un producto es $y = 250x$, ¿cuál es el costo $y$ al comprar $8$ unidades?'
    choices:
      - {text: '$\$2.000$, reemplazando $x = 8$ en la fórmula: $y = 250 \cdot 8 = 2.000$', is_correct: true}
      - {text: '$\$258$, sumando $250 + 8$', is_correct: false}
      - {text: '$\$31.25$, dividiendo $250 / 8$', is_correct: false}
      - {text: '$\$1.600$, multiplicando por 200', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$2.000$, reemplazando $x = 8$ en la fórmula: $y = 250 \cdot 8 = 2.000$''. Reemplazamos $x=8 \implies y = 250 \cdot 8 = 2.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las variables cuantitativas del problema ($x$ independiente, $y$ dependiente).'
  - 'Paso 2: Calcular la constante de proporcionalidad $k$ dividiendo un valor conocido de $y$ por su correspondiente $x$ ($k = \frac{y}{x}$).'
  - 'Paso 3: Escribir la fórmula del modelo sustituyendo la constante hallada: $y = k \cdot x$.'
  - 'Paso 4: Evaluar la ecuación sustituyendo nuevos valores de $x$ o $y$ según se solicite.'
errores_correccion: |
  - **Error 1:** Agregar un término aditivo $+ n$ en el modelo de proporcionalidad directa (ej: escribir $y = 3x + 100$). **Cómo corregirlo:** La proporcionalidad directa exige que el término independiente sea estrictamente cero ($n=0$). El modelo es puramente multiplicativo: **$y = kx$**.
  - **Error 2:** Reemplazar el valor de la variable dependiente $y$ en la posición de la variable independiente $x$ al evaluar el modelo. **Cómo corregirlo:** Asegúrate de identificar claramente cuál variable representa la entrada ($x$) y cuál la salida ($y$).
ejemplos:
  - titulo: 'Modelo algebraico de salario por horas'
    enunciado: 'Si el pago por hora es de $\$8.000$, ¿el modelo algebraico del sueldo es $y = 8.000x$?'
    alternativas:
      - 'Sí, con $k = 8.000$'
      - 'No, es $y = 8.000 + x$'
      - 'No, es $y = x / 8.000$'
    respuesta: 'Sí, con $k = 8.000$'
    solucion_pasos:
      - '1. Identificamos la constante $k = 8.000$.'
      - '2. Escribimos la fórmula lineal: $y = 8.000x$.'
  - titulo: 'Modelo de distancia a velocidad constante'
    enunciado: 'Para un vehículo que viaja a $90\text{ km/h}$, ¿el modelo de la distancia recorrida es $d(t) = 90t$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $d = v \cdot t \implies d = 90t$.'
  - titulo: 'Despeje de variable independiente en el modelo'
    enunciado: 'En el modelo $y = 5x$, si $y = 45$, ¿el valor de $x$ es $9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x = y / k = 45 / 5 = 9$.'
  - titulo: 'Comprobación de modelo en el origen'
    enunciado: 'En el modelo $y = 12x$, si $x = 0$, ¿el valor de $y$ es $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $y = 12 \cdot 0 = 0$.'
errores_frecuentes:
  - 'Agregar términos aditivos constantes $+ n$ al modelo algebraico de la proporción directa.'
  - 'Escribir la variable en el denominador $y = k / x$ confundiendo el modelo directo con el inverso.'
  - 'Invertir las posiciones de $x$ e $y$ al evaluar valores numéricos en la ecuación modelada.'
  - 'Considerar que la constante $k$ en la fórmula $y = kx$ varía según el valor asignado a $x$.'
  - 'Cuando se conoce la variable dependiente $y$, la variable $x$ se calcula multiplicando $y \cdot k$.'
afirmaciones_verdaderas:
  - 'El modelo algebraico de la proporcionalidad directa es la función lineal $y = k \cdot x$, donde $k$ es la constante de proporcionalidad.'
  - 'A partir del modelo $y = kx$, la variable independiente se calcula como $x = \frac{y}{k}$.'
al_terminar_debes_poder: 'Construir y evaluar el modelo algebraico $y = k \cdot x$ para resolver situaciones de proporcionalidad directa.'
