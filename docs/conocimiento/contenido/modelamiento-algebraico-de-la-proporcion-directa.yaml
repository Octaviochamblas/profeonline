procedimiento:
- 'Paso 1: Calcula la constante $k$ dividiendo un par conocido $y/x$.'
- 'Paso 2: Escribe la ecuación sustituyendo $k$ por el número encontrado.'
- 'Paso 3: Utiliza $y = kx$ para encontrar valores desconocidos de forma inmediata.'
errores_correccion: Evita confundir los datos de entrada al operar con modelamiento algebraico
  de la proporción directa.
ejemplos:
- titulo: Construyendo el modelo
  enunciado: Si 2 cajas pesan 10 kilos, escribe el modelo algebraico del peso en función de
    las cajas.
  solucion_pasos:
  - Calculamos $k = 10 / 2 = 5$.
  - Planteamos la fórmula general $y = k \cdot x$.
  - El modelo es $y = 5x$ (el peso es 5 veces el número de cajas).
- titulo: ¿Puedo despejar x?
  respuesta: Sí
  solucion_pasos:
  - Del modelo $y = kx$, se deduce que $x = y / k$ si necesitamos calcular el antecedente.
- titulo: Ejemplo 3
  enunciado: ¿El modelo y igual a 5x más 2 representa una proporción directa?
  alternativas:
  - 'No'
  - Sí
  - Depende del valor de x
  respuesta: 'No'
  solucion_pasos:
  - Tiene un término independiente (más 2), por lo que es una función afín, no una proporción
    directa.
- titulo: Ejemplo 4
  enunciado: Si el modelo es y igual a 12x, ¿cuánto vale y cuando x es 3?
  alternativas:
  - '36'
  - '15'
  - '4'
  respuesta: '36'
  solucion_pasos:
  - 12 por 3 es igual a 36.
errores_frecuentes:
- Plantear el modelo como $y = k + x$.
- Intercambiar variables escribiendo $x = ky$ sin adaptar el valor de la constante.
- Olvidar calcular $k$ antes de armar la ecuación final.
- Agregar un término libre (ej. $y = kx + n$), convirtiéndolo en función afín.
- Agregar un número constante al modelo, como y igual a kx más n, lo que lo convierte en una
  función afín y ya no en una proporción directa.
afirmaciones_verdaderas:
- La propiedad de modelamiento algebraico de la proporción directa preserva la consistencia
  lógica.
- El modelo algebraico de una proporción directa siempre tiene la forma y igual a k por x,
  sin ningún término independiente sumado.
al_terminar_debes_poder: Resolver problemas aplicados que involucren modelamiento algebraico
  de la proporción directa.
