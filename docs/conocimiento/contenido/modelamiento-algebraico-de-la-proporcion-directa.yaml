semantic_id: MAT.NUM.PROP_DIRECTA.MODELO_ALGEBRAICO
resumen_inicial: 'Modelamiento algebraico de la proporción directa: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: Una vez que conoces la constante de proporcionalidad, ya no necesitas
  resolver regla de tres cada vez. Puedes crear una 'máquina matemática' en forma de ecuación
  que calcule cualquier valor de forma instantánea.
explicacion_formal: 'Al saber que $y/x = k$, podemos multiplicar a ambos lados de la igualdad
  por $x$ para despejar $y$. Esto nos entrega el **modelo algebraico** de la proporción:


  $$y = k \cdot x$$


  Esta ecuación nos dice que para hallar cualquier valor de $y$ (magnitud dependiente), simplemente
  multiplicamos el valor de $x$ (magnitud independiente) por nuestra constante $k$. Es equivalente
  a una función lineal $f(x) = kx$.'
definiciones_clave: '- **Modelamiento algebraico de la proporción directa**: Elemento central
  dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a modelamiento algebraico de la proporción directa.'
ejemplo_guiado:
  enunciado: Si 3 entradas cuestan 9.000 pesos, escribe el modelo algebraico del costo en
    función del número de entradas y calcula el costo de 7 entradas.
  pasos:
  - 'Calculo la constante: k igual a 9.000 dividido entre 3, o sea 3.000.'
  - 'Planteo el modelo: y igual a 3.000 por x.'
  - 'Calculo el costo de 7 entradas: y igual a 3.000 por 7, o sea 21.000 pesos.'
