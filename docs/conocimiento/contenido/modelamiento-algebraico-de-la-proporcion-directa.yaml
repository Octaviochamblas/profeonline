resumen_inicial: 'El modelo algebraico de una relación de proporcionalidad directa
  expresa la variable dependiente $y$ como el producto de la constante $k$ por la
  variable independiente $x$: $y = k \cdot x$.'
explicacion_simple: Modelar algebraicamente significa escribir una fórmula matemática
  $y = k \cdot x$ que nos permita calcular el valor de $y$ para cualquier $x$ de forma
  automática multiplicando por la constante $k$.
explicacion_formal: 'El **Modelo Algebraico Directo** rige la función lineal de la
  forma:


  $$f(x) = y = k \cdot x \quad (k > 0)$$


  **Propiedades de la función:**

  - Cero funcional: $f(0) = 0$.

  - Homogeneidad multiplicativa: $f(\alpha x) = \alpha f(x)$ para todo $\alpha \in
  \mathbb{R}$.'
definiciones_clave: '- **Modelo algebraico directo**: Ecuación $y = k \cdot x$ que
  vincula linealmente a dos variables sin término independiente $c=0$.'
propiedades_relaciones: '- **Función lineal homogénea**: $f(x) = kx$.'
ejemplo_guiado:
  enunciado: Escriba el modelo algebraico para el cobro de agua si cada metro cúbico
    $x$ cuesta \$450.
  pasos:
  - 'Paso 1: Identificar la constante de costo unitario $k = 450$.'
  - 'Paso 2: Plantear la ecuación funcional $y = k \cdot x \implies y = 450x$.'
  - 'Paso 3: Calcular el costo para $x = 10\text{ m}^3 \implies y = 450 \cdot 10 =
    4.500$.'
  - 'Conclusión: El modelo algebraico es $y = 450x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión del modelo algebraico general de proporcionalidad
    directa entre x e y?
  choices:
  - text: y = k · x (sin sumar término independiente)
    is_correct: true
  - text: y = k / x
    is_correct: false
  - text: y = x + k
    is_correct: false
  - text: y = k · x^2
    is_correct: false
  explanation: La alternativa correcta es 'y = k · x (sin sumar término independiente)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para k = 450 $/m^3, ¿cuál fue la ecuación del modelo?
  choices:
  - text: y = 450x
    is_correct: true
  - text: y = x / 450
    is_correct: false
  - text: y = 450 + x
    is_correct: false
  - text: y = 4.500x
    is_correct: false
  explanation: La alternativa correcta es 'y = 450x'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de construir y evaluar el modelo
  algebraico $y = k \cdot x$ de una relación de proporcionalidad directa.
semantic_id: MAT.NUM.PROP_DIRECTA.MODELO_ALGEBRAICO
procedimiento:
- 'Paso 1: Verificar que el cociente $y / x = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = k \cdot x$ o el gráfico de recta que pasa por
  $(0,0)$.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Creer que una recta con desfase $y = kx + c$ ($c
  \neq 0$) representa proporcionalidad directa.** **Cómo corregirlo:** La proporcionalidad
  directa exige obligatoriamente pasar por el origen $(0,0)$, sin término independiente
  $c$.


  - **Error 2: Usar el producto $x \cdot y$ en lugar del cociente $y / x$ para hallar
  $k$.** **Cómo corregirlo:** El producto constante corresponde a proporcionalidad
  INVERSA; la directa usa el cociente $y/x = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_DIRECTA.MODELO_ALGEBRAICO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad directa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de cociente.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por cociente constante y/x.
- titulo: ¿Pasa la gráfica de una proporción directa por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $x=0 \implies y=0$.
- titulo: ¿Permite el modelo y = kx calcular valores desconocidos?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicando el valor de $x$ por la constante $k$.
errores_frecuentes:
- Clasificar como proporcionalidad directa una relación cuya gráfica es una recta
  que no pasa por el origen $(0,0)$.
- Multiplicar las variables entre sí ($x \cdot y$) pretendiendo obtener la constante
  de proporcionalidad directa.
- Sumar una cantidad fija a ambas variables pensando que se mantiene la relación de
  proporción.
- Declarar que si una variable aumenta y la otra también aumenta, existe proporcionalidad
  directa sin comprobar la constancia de $y/x$.
- Omitir incluir la unidad de medida compuesta en el valor de la constante de proporcionalidad
  $k$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante:
  $\frac{y}{x} = k$.'
- El gráfico de una relación de proporcionalidad directa es siempre una línea recta
  que pasa por el origen $(0,0)$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
