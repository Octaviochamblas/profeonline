semantic_id: MAT.NUM.INTERES_COMPUESTO.CALCULO_MONTO
resumen_inicial: 'Cálculo del monto en interés compuesto: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: Si inviertes dinero en la bolsa a largo plazo, no calculas tu ganancia
  sumando el mismo billete año tras año. Para ver el futuro, usas la fórmula mágica del crecimiento
  exponencial.
explicacion_formal: 'En el interés compuesto, la fórmula principal nos da directamente el
  **Monto Final Total** (Capital + Intereses sumados):


  $$M = C \cdot (1 + i)^t$$


  - **$C$:** Capital Inicial.

  - **$i$:** Tasa de interés (en decimal, ej: $0.05$).

  - **$t$:** Cantidad de períodos de capitalización.


  Notar que el factor de aumento $(1 + i)$ no se multiplica por $t$ (como en el simple), sino
  que se **eleva** a $t$. Multiplicar un número por sí mismo repetidas veces es lo que genera
  la curva exponencial que hace crecer el dinero agresivamente en el tiempo.'
definiciones_clave: '- **Cálculo del monto en interés compuesto**: Elemento central dentro
  del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del monto en interés compuesto.'
ejemplo_guiado:
  enunciado: Se invierten 40.000 pesos al 8% de interés compuesto anual durante 2 años. Calcula
    el monto final.
  pasos:
  - 'Identifico los datos: C igual a 40.000, i igual a 0,08, t igual a 2.'
  - 'Aplico la fórmula: M igual a C por (1 más i) elevado a t, es decir 40.000 por 1,08 elevado
    a 2.'
  - 'Calculo: 1,08 elevado a 2 es igual a 1,1664, y 40.000 por 1,1664 es igual a 46.656. El
    monto final es 46.656 pesos.'
