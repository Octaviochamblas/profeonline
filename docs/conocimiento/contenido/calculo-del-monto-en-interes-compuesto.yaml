resumen_inicial: 'El cálculo del monto final $M$ en interés compuesto eleva el factor
  $(1 + i)$ al número de períodos $n$ y lo multiplica por el capital inicial: $M =
  C \cdot (1 + i)^n$.'
explicacion_simple: Para saber cuánto dinero acumularemos en total tras varios períodos
  en interés compuesto, tomamos la tasa en decimal, le sumamos 1, la elevamos al número
  de períodos $n$ y multiplicamos ese resultado por el dinero depositado al principio.
explicacion_formal: 'La **Fórmula del Monto Compuesto $M$** para una tasa periódica
  $i$ y $n$ períodos de capitalización es:


  $$M = C \cdot (1 + i)^n = C \cdot \left(1 + \frac{r}{100}\right)^n$$


  **Capitalización subanual:**

  - Si la tasa anual es $r\%$ y se capitaliza $m$ veces al año durante $t$ años: $M
  = C \cdot \left(1 + \frac{r}{100 \cdot m}\right)^{m \cdot t}$.'
definiciones_clave: '- **Monto compuesto $M$**: Valor acumulado $M = C \cdot (1 +
  i)^n$.'
propiedades_relaciones: '- **Frecuencia de capitalización**: Eleva el número total
  de períodos $n = m \cdot t$ adaptando la tasa periódica $i = r / m$.'
ejemplo_guiado:
  enunciado: Calcule el monto acumulado por un capital de \$200.000 depositado al
    $5\%$ compuesto anual durante $3$ años.
  pasos:
  - 'Paso 1: Identificar $C = 200.000$, $i = 0,05$ y $n = 3$.'
  - 'Paso 2: Calcular el factor $(1 + 0,05)^3 = 1,05^3 = 1,157625$.'
  - 'Paso 3: Multiplicar $M = 200.000 \cdot 1,157625 = 231.525$.'
  - 'Conclusión: El monto final acumulado es \$231.525.'
