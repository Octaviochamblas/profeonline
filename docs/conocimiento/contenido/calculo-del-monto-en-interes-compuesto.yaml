procedimiento:
- 'Paso 1: Convierte la tasa de interés a decimal ($i$).'
- 'Paso 2: Suma 1 a la tasa para obtener el factor de crecimiento ($1 + i$).'
- 'Paso 3: Eleva ese factor a la potencia $t$ (el número de periodos).'
- 'Paso 4: Multiplica el resultado por el Capital Inicial.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del monto en
  interés compuesto.
ejemplos:
- titulo: Depósito a plazo compuesto
  enunciado: Se invierten $100.000 al 5% de interés compuesto anual durante 3 años. ¿Cuánto
    dinero hay al final?
  solucion_pasos:
  - C = 100.000, i = 0.05, t = 3.
  - Factor = $(1 + 0.05) = 1.05$.
  - 'Elevamos a t: $(1.05)^3 = 1.05 \cdot 1.05 \cdot 1.05 = 1.157625$.'
  - 'Multiplicamos por C: $100.000 \cdot 1.157625 = 115.762,5$.'
  - El monto final es aproximadamente $115.763.
- titulo: Ejemplo 2
  enunciado: Con capital 10.000, tasa 0,10 y tiempo 2 años, ¿cuál es el monto final?
  alternativas:
  - '12.100'
  - '12.000'
  - '11.000'
  respuesta: '12.100'
  solucion_pasos:
  - 10.000 por (1,10 elevado a 2) es igual a 10.000 por 1,21, o sea 12.100.
- titulo: Ejemplo 3
  enunciado: Con capital 5.000, tasa 0,05 y tiempo 3 años, ¿cuál es el monto final aproximado?
  alternativas:
  - '5.788'
  - '5.750'
  - '5.500'
  respuesta: '5.788'
  solucion_pasos:
  - 5.000 por (1,05 elevado a 3), aproximadamente 5.000 por 1,1576, es igual a 5.788.
- titulo: ¿El factor (1+i) siempre debe ser mayor que 1 para que el capital crezca?
  respuesta: Sí
  solucion_pasos:
  - Porque la tasa de interés es positiva.
errores_frecuentes:
- Multiplicar $(1 + i)$ por $t$ en lugar de usar potencias (confundir la fórmula con interés
  simple).
- Olvidar sumar el 1 antes de elevar a la potencia (calcular $0.05^3$ destruirá el capital
  en lugar de hacerlo crecer).
- Multiplicar (1+i) por t en lugar de elevarlo a la potencia t, confundiendo la fórmula con
  la de interés simple.
- Olvidar sumar el 1 antes de elevar a la potencia, lo que destruye el capital en vez de hacerlo
  crecer.
- Redondear el factor (1+i) elevado a t antes de multiplicarlo por el capital, perdiendo precisión
  en el resultado.
afirmaciones_verdaderas:
- La propiedad de cálculo del monto en interés compuesto preserva la consistencia lógica.
- En la fórmula del monto compuesto, el factor (1+i) se eleva a la potencia t, nunca se multiplica
  por t como en el interés simple.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del monto en
  interés compuesto.
