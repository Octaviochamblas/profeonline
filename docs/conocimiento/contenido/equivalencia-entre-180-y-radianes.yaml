semantic_id: MAT.GEO.MEDICION_ANGULAR.EQUIVALENCIA_GRADOS_RADIANES
resumen_inicial: La equivalencia fundamental entre el sistema sexagesimal y los radianes
  establece que media vuelta completa equivale a 180° o exactamente π radianes (180°
  = π rad).
explicacion_simple: '![Equivalencia 180° = π rad](/static/img/nodos/equivalencia-entre-180-y-radianes-intro.svg)


  Como el perímetro de un círculo completo es $2\pi r$, una vuelta entera en radianes
  es $2\pi\text{ rad}$ ($360^\circ$). Por lo tanto, media vuelta ($180^\circ$) equivale
  exactamente a $\pi\text{ radianes}$. Esta es la regla maestra para convertir entre
  grados y radianes.'
explicacion_formal: '### Teorema formal

  En una circunferencia de radio $r$, el perímetro completo es $C = 2\pi r$. Por consiguiente,
  media vuelta ($180^\circ$) subtiende un arco de longitud $\pi r$, estableciendo
  la **equivalencia fundamental**:


  $$180^\circ \equiv \pi \text{ rad} \iff 360^\circ \equiv 2\pi \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\pi \approx 3{,}14159265...$: Constante trascendente que relaciona la longitud
  de una circunferencia con su diámetro.

  - Factor unitario de conversión: $\frac{\pi \text{ rad}}{180^\circ} = 1$ y $\frac{180^\circ}{\pi
  \text{ rad}} = 1$.


  ### Síntesis didáctica

  La relación $180^\circ = \pi \text{ rad}$ es el puente matemático universal para
  transformar cualquier magnitud angular entre el sistema sexagesimal y el sistema
  radial.'
definiciones_clave: '- **Equivalencia angular fundamental**: $180^\circ = \pi\text{
  rad}$.

  - **Ángulos notables en radianes**: Fracciones exactas de $\pi$ asociadas a $30^\circ,
  45^\circ, 60^\circ, 90^\circ$. '
propiedades_relaciones: '- **Proporcionalidad directa**: Duplicar, triplicar o dividir
  por un entero preserva la equivalencia ($k \times 180^\circ = k\pi\text{ rad}$).

  - **Cálculo de límites y trigonometría**: En cálculo superior, todas las funciones
  trigonométricas requieren que el argumento esté medido en radianes. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Notables con π](/static/img/nodos/equivalencia-entre-180-y-radianes-ejemplos.svg)


    Determina a cuántos radianes equivale exactamente un ángulo de $45^\circ$ expresado
    como fracción de $\pi$.'
  pasos:
  - 'Paso 1: Recordar la equivalencia base: $180^\circ = \pi\text{ rad}$.'
  - 'Paso 2: Expresar $45^\circ$ como fracción de $180^\circ$: $\frac{45^\circ}{180^\circ}$.'
  - 'Paso 3: Simplificar dividiendo por 45: $\frac{45}{180} = \frac{1}{4}$.'
  - 'Paso 4: Multiplicar por $\pi$: $\frac{1}{4}\pi = \frac{\pi}{4}\text{ rad}$.'
  - 'Paso 5: Concluir que $45^\circ = \frac{\pi}{4}\text{ rad}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A cuántos radianes equivale exactamente un ángulo llano de 180°?
  choices:
  - text: Exactamente π radianes
    is_correct: true
  - text: Exactamente 2π radianes
    is_correct: false
  - text: Exactamente π/2 radianes
    is_correct: false
  - text: Exactamente 1 radián
    is_correct: false
  explanation: Por equivalencia fundamental, un ángulo llano equivale a exactamente
    π radianes.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué ángulo sexagesimal equivale una medida de π/2 radianes?
  choices:
  - text: 90° (porque 180° / 2 = 90°)
    is_correct: true
  - text: 180°
    is_correct: false
  - text: 45°
    is_correct: false
  - text: 270°
    is_correct: false
  explanation: Como π = 180°, π/2 equivale a 90° (porque 180° / 2 = 90°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Recordar que $180^\circ \equiv \pi\text{ rad}$.'
- 'Paso 2: Dividir $180^\circ$ por el denominador dado o calcular la fracción $\frac{\theta}{180^\circ}$.'
- 'Paso 3: Simplificar la fracción irreducible multiplicada por $\pi$.'
errores_correccion: Recuerda que π rad equivale a 180° (media vuelta), no a 360° (que
  son 2π rad).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué ángulo en radianes equivale $30^\circ$?
  alternativas:
  - $\frac{\pi}{6}\text{ rad}$
  - $\frac{\pi}{3}\text{ rad}$
  - $\frac{\pi}{4}\text{ rad}$
  respuesta: $\frac{\pi}{6}\text{ rad}$
  solucion_pasos:
  - $\frac{30}{180}\pi = \frac{1}{6}\pi = \frac{\pi}{6}\text{ rad}$.
- titulo: Ejemplo 2
  enunciado: ¿A cuántos grados sexagesimales equivale $\frac{\pi}{3}\text{ rad}$?
  alternativas:
  - $60^\circ$
  - $30^\circ$
  - $90^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $\frac{180^\circ}{3} = 60^\circ$.
- titulo: ¿Media vuelta completa equivale a π radianes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $180^\circ = \pi\text{ rad}$.
- titulo: ¿Un ángulo de 90° equivale a π radianes?
  respuesta: 'No'
  solucion_pasos:
  - No, equivale a $\frac{\pi}{2}\text{ rad}$ (medio pi).
errores_frecuentes:
- Creer que $360^\circ = \pi\text{ rad}$ en lugar de $2\pi\text{ rad}$.
- Confundir $\frac{\pi}{3}$ ($60^\circ$) con $\frac{\pi}{6}$ ($30^\circ$).
- Olvidar simplificar la fracción con $\pi$.
- Sustituir $\pi$ por $3{,}1416$ cuando se pide el valor exacto en múltiplos de $\pi$.
- Dividir por $360$ en lugar de $180$.
afirmaciones_verdaderas:
- $180^\circ$ sexagesimales equivalen a $\pi$ radianes.
- $90^\circ = \frac{\pi}{2}\text{ rad}$ y $360^\circ = 2\pi\text{ rad}$.
al_terminar_debes_poder: '**QUÉ:** Conocer y aplicar la equivalencia fundamental $180^\circ
  = \pi\text{ rad}$.


  **CÓMO:** Relacionando ángulos notables y fracciones de vuelta entre grados sexagesimales
  y radianes.


  ![Resumen de Equivalencia 180° = π rad](/static/img/nodos/equivalencia-entre-180-y-radianes-resumen.svg)'
