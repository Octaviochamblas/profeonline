semantic_id: MAT.GEO.MEDICION_ANGULAR.EQUIVALENCIA_GRADOS_RADIANES
resumen_inicial: El radián conecta la medida del ángulo con la longitud del arco de
  la circunferencia, constituyendo la unidad natural en cálculo y física.
explicacion_simple: Imagina tomar el radio de una rueda y doblarlo a lo largo del
  borde de la rueda. El ángulo formado por ese pedazo de borde igual al radio es un
  radián. Una vuelta entera equivale a $2\pi$ radianes.
explicacion_formal: 'Un **radián** es el ángulo central que subtiende un arco de circunferencia
  cuya longitud es igual al radio de dicha circunferencia. La equivalencia fundamental
  con el sistema sexagesimal es:


  $$\pi\text{ rad} = 180^\circ \implies 1\text{ rad} = \frac{180^\circ}{\pi} \approx
  57{,}3^\circ$$'
definiciones_clave: '- **Equivalencia entre 180° y π radianes**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en equivalencia entre 180° y π radianes se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Demuestra mediante la fórmula de equivalencia fundamental a cuántos grados
    sexagesimales equivale un ángulo plano de $\frac{\pi}{4}\text{ rad}$.
  pasos:
  - 'Paso 1: Reemplazar $\pi\text{ rad}$ por su equivalente sexagesimal de $180^\circ$.'
  - 'Paso 2: Realizar la división: $\frac{180^\circ}{4}$.'
  - 'Paso 3: Concluir que $\frac{\pi}{4}\text{ rad} = 45^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de equivalencia entre 180° y
    π radianes?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos grados sexagesimales equivale π/4 radianes?
  choices:
  - text: 45°
    is_correct: true
  - text: 90°
    is_correct: false
  - text: 30°
    is_correct: false
  - text: 60°
    is_correct: false
  explanation: La alternativa correcta es '45°', ya que $180^\circ / 4 = 45^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en equivalencia entre 180° y π radianes.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en equivalencia entre
  180° y π radianes sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 48^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 132°
  - 48°
  - 90°
  respuesta: 132°
  solucion_pasos:
  - Despejando $x = 180 - 48 = 132^\circ$.
- titulo: Ejemplo 2
  enunciado: En equivalencia entre 180° y π radianes, si dos ángulos son suplementarios
    y uno mide 48°, ¿cuánto mide el otro?
  alternativas:
  - 132°
  - 42°
  - 360°
  respuesta: 132°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 48 = 132^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en equivalencia
    entre 180° y π radianes?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en equivalencia entre 180° y π radianes
    es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de equivalencia entre 180° y π radianes.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
