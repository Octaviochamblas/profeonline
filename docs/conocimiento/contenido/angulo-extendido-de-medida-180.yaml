semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.EXTENDIDO
resumen_inicial: Un ángulo extendido es aquel cuya medida es exactamente 180° (π rad),
  formado por dos rayos opuestos que forman una línea recta continua.
explicacion_simple: '![Ángulo Extendido](/static/img/nodos/angulo-extendido-de-medida-180-intro.svg)


  Observa el horizonte sobre el mar o una regla apoyada sobre una mesa. Cuando dos
  rayos con origen común apuntan en sentidos opuestos formando una línea recta perfecta,
  la abertura es exactamente de 180°, denominado ángulo extendido.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **extendido** (o llano) si sus rayos directores son opuestos
  y colineales, formando una línea recta continua que subtiende exactamente media
  vuelta:


  $$\mu(\angle AOB) = 180^\circ = \pi \text{ rad} \iff \vec{OA} = -\lambda \vec{OB}
  \quad (\lambda > 0)$$


  ### Desglose simbólico y geométrico

  - $\vec{OA}$ y $\vec{OB}$: Rayos opuestos que comparten el vértice $O$ y pertenecen
  a la misma recta soporte.

  - Semiplanos: El ángulo extendido divide al plano euclidiano en dos semiplanos disjuntos.

  - Coseno extremal: $\cos(180^\circ) = -1$ y $\sin(180^\circ) = 0$.


  ### Síntesis didáctica

  El ángulo extendido es la referencia fundamental de los pares lineales y la base
  geométrica para la suma de ángulos adyacentes sobre una recta.'
definiciones_clave: '- **Ángulo extendido**: Ángulo de medida exacta $\theta = 180^\circ$.

  - **Rayos opuestos**: Dos rayos con el mismo origen que forman una línea recta de
  $180^\circ$. '
propiedades_relaciones: '- **Semicírculo**: Abarca exactamente la mitad de una rotación
  completa ($360^\circ / 2 = 180^\circ$).

  - **Suplementariedad**: Dos ángulos adyacentes que forman un par lineal suman siempre
  $180^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Extendido](/static/img/nodos/angulo-extendido-de-medida-180-ejemplos.svg)


    Sobre una recta se traza un rayo desde el punto $O$, dividiendo el ángulo extendido
    en dos ángulos contiguos $\alpha$ y $\beta$. Si $\alpha = 70^\circ$, determina
    la medida de $\beta$.'
  pasos:
  - 'Paso 1: Identificar que los ángulos forman un par lineal sobre una recta, sumando
    $180^\circ$.'
  - 'Paso 2: Plantear la ecuación: $\alpha + \beta = 180^\circ$.'
  - 'Paso 3: Reemplazar $\alpha = 70^\circ$: $70^\circ + \beta = 180^\circ$.'
  - 'Paso 4: Despejar $\beta = 180^\circ - 70^\circ = 110^\circ$, concluyendo que
    $\beta$ es un ángulo obtuso de $110^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto mide exactamente un ángulo extendido?
  choices:
  - text: Exactamente 180°
    is_correct: true
  - text: Exactamente 90°
    is_correct: false
  - text: Exactamente 360°
    is_correct: false
  - text: Entre 90° y 180°
    is_correct: false
  explanation: Un ángulo extendido mide exactamente 180°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué figura geométrica forman los dos rayos que componen un ángulo extendido?
  choices:
  - text: Una línea recta continua
    is_correct: true
  - text: Un cuadrado perpendicular
    is_correct: false
  - text: Una curva circular completa
    is_correct: false
  - text: Dos segmentos paralelos desconectados
    is_correct: false
  explanation: Los rayos opuestos de un ángulo extendido forman una línea recta continua
    de 180°.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si los rayos son opuestos colineales o si la medida es $180^\circ$.'
- 'Paso 2: Aplicar la suma de ángulos adyacentes $\sum \theta_i = 180^\circ$ en pares
  lineales.'
- 'Paso 3: Clasificar como ángulo extendido.'
errores_correccion: No confundas el ángulo extendido (180°, recta) con el ángulo completo
  (360°, círculo).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos ángulos rectos equivalen a un ángulo extendido?
  alternativas:
  - 2 ángulos rectos
  - 4 ángulos rectos
  - 1 ángulo recto
  respuesta: 2 ángulos rectos
  solucion_pasos:
  - $2 \times 90^\circ = 180^\circ$, por lo que equivale a 2 ángulos rectos.
- titulo: Ejemplo 2
  enunciado: Si tres ángulos sobre una recta miden $x$, $2x$ y $3x$, ¿cuánto vale
    $x$?
  alternativas:
  - $30^\circ$
  - $45^\circ$
  - $60^\circ$
  respuesta: $30^\circ$
  solucion_pasos:
  - $x + 2x + 3x = 180^\circ \implies 6x = 180^\circ \implies x = 30^\circ$.
- titulo: ¿Un ángulo extendido mide 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición geométrica mide exactamente 180°.
- titulo: ¿Un ángulo de 360° es un ángulo extendido?
  respuesta: 'No'
  solucion_pasos:
  - No, 360° es un ángulo completo o de giro completo.
errores_frecuentes:
- Confundir ángulo extendido ($180^\circ$) con ángulo nulo ($0^\circ$).
- Confundir ángulo extendido ($180^\circ$) con ángulo completo ($360^\circ$).
- Creer que una recta no tiene ángulo (tiene un ángulo de $180^\circ$).
- Tratar un ángulo de $179^\circ$ como si fuera extendido.
- Olvidar que la suma de los ángulos interiores de cualquier triángulo es igual a
  un ángulo extendido ($180^\circ$).
afirmaciones_verdaderas:
- Un ángulo extendido mide exactamente $180^\circ$.
- Los lados de un ángulo extendido son dos rayos opuestos colineales.
al_terminar_debes_poder: '**QUÉ:** Identificar, calcular y aplicar propiedades de
  ángulos extendidos de $180^\circ$ en geometría.


  **CÓMO:** Reconociendo la colinealidad de rayos opuestos y aplicando la suma de
  pares lineales $\alpha + \beta = 180^\circ$.


  ![Resumen de Ángulo Extendido](/static/img/nodos/angulo-extendido-de-medida-180-resumen.svg)'
