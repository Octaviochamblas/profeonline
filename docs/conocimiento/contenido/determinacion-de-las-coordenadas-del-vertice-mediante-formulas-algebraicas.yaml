semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.COORDENADAS_VERTICE
resumen_inicial: La determinación de las coordenadas del vértice $V(x_v, y_v)$ se realiza calculando la abscisa $x_v = -\frac{b}{2a}$ y evaluando la función $y_v = f(x_v) = -\frac{b^2 - 4ac}{4a}$, fijando el par ordenado exacto en el plano cartesiano.
explicacion_simple: "![La determinación de las coordenadas del vértice $V(x_v, y_v)$ se realiza calculando la abscisa $x_v = -\frac{b}{2a}$ y evaluando la función $y_v = f(x_v) = -\frac{b^2 - 4ac}{4a}$, fijando el par ordenado exacto en el plano cartesiano](/static/img/nodos/determinacion-de-las-coordenadas-del-vertice-mediante-formulas-algebraicas-intro.svg)\n\n\nPara encontrar las dos coordenadas $(x_v, y_v)$ del vértice:\n\n1. **Paso 1 (Calcular $x_v$):**\n   $$x_v = -\frac{b}{2a}$$\n2. **Paso 2 (Calcular $y_v$):**\n   - Toma el número que te dio en el Paso 1 y mételo dentro de la función $f(x)$ (cambia todas las $x$ por ese número):\n     $$y_v = f(x_v)$$\n3. **Paso 3 (Escribir el par ordenado):**\n   - Junta ambos valores: **$V(x_v, y_v)$**.\n- *Ejemplo:* Para $f(x) = x^2 - 6x + 5$:\n  - $x_v = -\frac{-6}{2(1)} = 3$.\n  - $y_v = f(3) = 3^2 - 6(3) + 5 = 9 - 18 + 5 = -4$.\n  - El vértice es el punto **$V(3, -4)$**."
explicacion_formal: 'Dada $f(x) = ax^2 + bx + c$ con $a \neq 0$, las **coordenadas canónicas del vértice** $V(x_v, y_v) \in \mathbb{R}^2$ se deducen completando cuadrados sobre el polinomio canónico:

  $$f(x) = a\left(x + \frac{b}{2a}\right)^2 + \left(c - \frac{b^2}{4a}\right) = a(x - x_v)^2 + y_v$$


  **Fórmulas algebraicas equivalentes**:

  $$\begin{cases} x_v = -\frac{b}{2a} \\ y_v = f\left(-\frac{b}{2a}\right) = c - \frac{b^2}{4a} = -\frac{\Delta}{4a} = \frac{4ac - b^2}{4a} \end{cases}$$


  **Estructura métrica**:

  - Si $a > 0 \implies y_v = -\frac{\Delta}{4a}$ es el ínfimo global de la imagen.

  - Si $a < 0 \implies y_v = -\frac{\Delta}{4a}$ es el supremo global de la imagen.'
definiciones_clave: '- **Coordenadas del vértice**: Par ordenado $V(x_v, y_v)$ que ubica el extremo absoluto de la parábola.

  - **Evaluación funcional de vértice**: Procedimiento $y_v = f(x_v)$ para calcular la cota vertical.'
propiedades_relaciones: '- **Interacción con el discriminante**: $y_v = -\frac{\Delta}{4a}$. Si $\Delta = 0 \implies y_v = 0$ (vértice apoyado sobre el eje $X$).

  - **Invarianza por traslación**: La traslación de $f(x)$ a $f(x - h) + k$ desplaza el vértice a $(x_v + h, y_v + k)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación de las coordenadas del vértice $V(x_v, y_v)$ se realiza calculando la abscisa $x_v = -\frac{b}{2a}$ y evaluando la función $y_v = f(x_v) = -\frac{b^2 - 4ac}{4a}$, fijando el par ordenado exacto en el plano cartesiano](/static/img/nodos/determinacion-de-las-coordenadas-del-vertice-mediante-formulas-algebraicas-ejemplos.svg)



    Determina las coordenadas del vértice de la función $f(x) = -2x^2 + 12x - 10$ utilizando tanto la evaluación funcional como la fórmula de discriminante.'
  pasos:
  - 'Paso 1: Identificar coeficientes: $a = -2, b = 12, c = -10$.'
  - 'Paso 2: Calcular la abscisa $x_v$:

    $x_v = -\frac{12}{2(-2)} = -\frac{12}{-4} = 3$.'
  - 'Paso 3: Método 1 (Evaluación funcional $f(3)$):

    $y_v = -2(3)^2 + 12(3) - 10 = -2(9) + 36 - 10 = -18 + 36 - 10 = 8$.'
  - 'Paso 4: Método 2 (Fórmula de discriminante $-\Delta/(4a)$):

    $\Delta = 12^2 - 4(-2)(-10) = 144 - 80 = 64$.

    $y_v = -\frac{64}{4(-2)} = -\frac{64}{-8} = 8$.'
  - 'Paso 5: Conclusión: Las coordenadas del vértice son $V(3, 8)$ (vértice máximo).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las coordenadas del vértice de la función $f(x) = x^2 - 4x + 9$?
  choices:
  - text: V(2, 5)
    is_correct: true
  - text: V(-2, 5)
    is_correct: false
  - text: V(2, 9)
    is_correct: false
  - text: V(4, 5)
    is_correct: false
  explanation: La alternativa correcta es 'V(2, 5)'. $x_v = -(-4)/(2(1)) = 2$, $y_v = f(2) = 4 - 8 + 9 = 5 \implies V(2, 5)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene $b = 0$, ¿cuál es la forma de sus coordenadas del vértice?
  choices:
  - text: V(0, c)
    is_correct: true
  - text: V(c, 0)
    is_correct: false
  - text: V(0, 0)
    is_correct: false
  - text: V(a, c)
    is_correct: false
  explanation: La alternativa correcta es 'V(0, c)'. Si $b = 0$, $x_v = 0$ y $y_v = f(0) = c \implies V(0, c)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los coeficientes $a, b, c$ de la función cuadrática.'
- 'Paso 2: Calcular la abscisa del vértice mediante $x_v = -\frac{b}{2a}$.'
- 'Paso 3: Calcular la ordenada evaluando $y_v = f(x_v)$ o aplicando $y_v = -\frac{b^2 - 4ac}{4a}$.'
- 'Paso 4: Escribir el par ordenado resultante $V(x_v, y_v)$.'
errores_correccion: '- **Error común:** Calcular $y_v$ usando $-\Delta/(2a)$ en vez de $-\Delta/(4a)$.

  - **Cómo corregirlo:** La fórmula del discriminante lleva un **$4a$ en el denominador**: **$y_v = -\frac{\Delta}{4a}$**, o más simplemente evaluando $f(x_v)$.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficientes mónicos'
  enunciado: Determina el vértice de $f(x) = x^2 - 8x + 12$.
  alternativas:
  - V(4, -4)
  - V(-4, -4)
  - V(4, 12)
  - V(8, -4)
  respuesta: V(4, -4)
  solucion_pasos:
  - 'Paso 1: $x_v = 4$; $y_v = 16 - 32 + 12 = -4 \implies V(4, -4)$.'
- titulo: 'Ejemplo 2: Coeficiente principal negativo'
  enunciado: ¿Cuáles son las coordenadas del vértice de $g(x) = -x^2 + 2x + 3$?
  alternativas:
  - V(1, 4)
  - V(-1, 4)
  - V(1, 3)
  - V(-1, 0)
  respuesta: V(1, 4)
  solucion_pasos:
  - 'Paso 1: $x_v = -2/(2(-1)) = 1$; $y_v = -(1)^2 + 2(1) + 3 = 4 \implies V(1, 4)$.'
- titulo: 'Ejemplo 3: Vértice fraccionario'
  enunciado: En $h(x) = 2x^2 - 6x + 1$, ¿cuál es la abscisa $x_v$?
  alternativas:
  - 3/2
  - -3/2
  - '3'
  - '-6'
  respuesta: 3/2
  solucion_pasos:
  - 'Paso 1: $x_v = -(-6)/(2(2)) = 6/4 = 3/2$.'
- titulo: 'Ejemplo 4: Vértice en el eje Y'
  enunciado: ¿Qué vértice tiene $f(x) = 3x^2 - 12$?
  alternativas:
  - V(0, -12)
  - V(0, 12)
  - V(2, 0)
  - V(-2, 0)
  respuesta: V(0, -12)
  solucion_pasos:
  - 'Paso 1: $b = 0 \implies x_v = 0, y_v = -12 \implies V(0, -12)$.'
errores_frecuentes:
- Cometer errores de signos al evaluar números negativos en x_v².
- Confundir la abscisa x_v con la ordenada y_v.
- Dividir por 2 en vez de 4a al aplicar la fórmula de discriminante.
afirmaciones_verdaderas:
- Las coordenadas del vértice son siempre V(-b/(2a), f(-b/(2a))).
- La ordenada del vértice es idéntica a -Δ/(4a).
al_terminar_debes_poder: '**QUÉ:** Determinar analíticamente las coordenadas del vértice V(x_v, y_v) de una función cuadrática.


  **CÓMO:** Calculando x_v = -b/(2a) y evaluando y_v = f(x_v) para formular el par ordenado V(x_v, y_v).


