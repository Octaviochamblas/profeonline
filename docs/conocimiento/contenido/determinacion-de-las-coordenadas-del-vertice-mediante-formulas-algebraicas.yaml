semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.COORDENADAS_VERTICE
resumen_inicial: 'Las coordenadas del vértice $V(h, k)$ de una función cuadrática se determinan algebraicamente mediante la evaluación $h = -\frac{b}{2a}$ y $k = f(h)$ o la fórmula directa del discriminante.'
explicacion_simple: |
  Para hallar la ubicación exacta del punto más alto o más bajo de la parábola (el vértice), se realiza un proceso en dos pasos: primero se calcula la coordenada horizontal $h$ con la fórmula $h = -\frac{b}{2a}$. Luego, se toma ese valor de $h$ y se reemplaza en la regla de la función para calcular la coordenada vertical $k = f(h)$. El resultado se escribe como el par ordenado $(h, k)$.
explicacion_formal: |
  ### Definición formal
  Para una función cuadrática $f(x) = ax^2 + bx + c$, el punto extremo del **vértice** se calcula mediante el operador de evaluación o la fórmula explícita:
  $$V(h, k) = V\left(-\frac{b}{2a}, \quad f\left(-\frac{b}{2a}\right)\right) = V\left(-\frac{b}{2a}, \quad \frac{4ac - b^2}{4a}\right)$$

  ### Desglose simbólico
  - $h = -\frac{b}{2a}$: Abscisa del vértice.
  - $k = f(h) = a h^2 + b h + c$: Ordenada del vértice calculada por sustitución directa.
  - $k = \frac{4ac - b^2}{4a} = -\frac{\Delta}{4a}$: Expresión alternativa directa en función del discriminante $\Delta = b^2 - 4ac$.

  ### Síntesis didáctica
  Ambos caminos algebraicos (evaluar $f(h)$ o aplicar la fórmula del discriminante $\frac{4ac - b^2}{4a}$) entregan exactamente el mismo resultado numérico para $k$. La evaluación directa $f(h)$ suele ser computacionalmente más rápida cuando $h$ es un número entero simple.
definiciones_clave: |
  - **Fórmula de la abscisa del vértice**: Expresión $h = -\frac{b}{2a}$ para determinar la posición $x$ del vértice.
  - **Evaluación funcional del vértice**: Proceso de calcular $k = f(h)$ introduciendo la abscisa $h$ en la fórmula.
  - **Fórmula de la ordenada del vértice**: Expresión $k = \frac{4ac - b^2}{4a}$ para hallar la coordenada $y$ directamente de los coeficientes.
propiedades_relaciones: |
  - **Forma canónica**: La forma canónica $f(x) = a(x - h)^2 + k$ exhibe directamente las coordenadas del vértice sin necesidad de fórmulas adicionales.
  - **Completación de cuadrados**: Técnica algebraica para transformar la forma general $ax^2 + bx + c$ a la forma canónica $a(x - h)^2 + k$.
ejemplo_guiado:
  enunciado: 'Calcula las coordenadas exactas del vértice $V(h, k)$ para la función cuadrática $f(x) = -x^2 + 4x + 5$ utilizando ambos métodos (evaluación funcional y fórmula directa de la ordenada).'
  pasos:
    - 'Paso 1: Identificamos los coeficientes: $a = -1$, $b = 4$, $c = 5$.'
    - 'Paso 2: Calculamos la abscisa: $h = -\frac{b}{2a} = -\frac{4}{2(-1)} = -\frac{4}{-2} = 2$.'
    - 'Paso 3: Método 1 (evaluación funcional): $k = f(2) = -(2)^2 + 4(2) + 5 = -4 + 8 + 5 = 9$.'
    - 'Paso 4: Método 2 (fórmula directa): $k = \frac{4ac - b^2}{4a} = \frac{4(-1)(5) - (4)^2}{4(-1)} = \frac{-20 - 16}{-4} = \frac{-36}{-4} = 9$.'
    - 'Paso 5: Consolidamos el resultado: las coordenadas del vértice son $V(2, 9)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dada la función cuadrática $g(x) = 2x^2 - 12x + 10$, ¿cuáles son las coordenadas exactas de su vértice $V(h, k)$?'
    choices:
      - {text: '$V(3, -8)$', is_correct: true}
      - {text: '$V(-3, 8)$', is_correct: false}
      - {text: '$V(3, 10)$', is_correct: false}
      - {text: '$V(6, -8)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(3, -8)$''. Calculamos $h = -\frac{-12}{2(2)} = 3$. Evaluamos $g(3) = 2(3)^2 - 12(3) + 10 = 18 - 36 + 10 = -8$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al transformar una función a su forma canónica se obtiene $h(x) = 5(x + 1)^2 - 4$, ¿cuáles son las coordenadas de su vértice?'
    choices:
      - {text: '$V(-1, -4)$', is_correct: true}
      - {text: '$V(1, -4)$', is_correct: false}
      - {text: '$V(-1, 4)$', is_correct: false}
      - {text: '$V(5, -4)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(-1, -4)$''. Comparando con $a(x - h)^2 + k$, tenemos $x - h = x + 1 \implies h = -1$ y $k = -4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer los coeficientes $a$, $b$ y $c$ de la función cuadrática.'
  - 'Paso 2: Calcular $h = -\frac{b}{2a}$ para obtener la primera coordenada.'
  - 'Paso 3: Sustituir $x = h$ en la función original para hallar $k = f(h)$, o aplicar la fórmula $k = \frac{4ac - b^2}{4a}$.'
  - 'Paso 4: Escribir la solución ordenada como el punto $V(h, k)$.'
errores_correccion: |
  - **Error 1:** Elevar la abscisa al cuadrado sin respetar el signo negativo externo al evaluar $k = f(h)$ en funciones con $a < 0$. **Cómo corregirlo:** En la función $f(x) = -x^2$, evaluar $h = 3$ requiere escribir $f(3) = -(3^2) = -9$. El signo negativo multiplica al resultado de la potencia.
  - **Error 2:** Confundir el signo de $h$ al leer la forma canónica $a(x - h)^2 + k$. **Cómo corregirlo:** En la expresión $(x + 3)^2$, la abscisa es $h = -3$ debido a la estructura $(x - (-3))^2$.
ejemplos:
  - titulo: 'Cálculo de vértice con coeficientes racionales'
    enunciado: '¿Cuáles son las coordenadas del vértice de $f(x) = x^2 - 4x + 1$?'
    alternativas:
      - '$V(2, -3)$'
      - '$V(-2, 13)$'
      - '$V(2, 3)$'
    respuesta: '$V(2, -3)$'
    solucion_pasos:
      - '1. $h = -\frac{-4}{2(1)} = 2$.'
      - '2. $k = f(2) = (2)^2 - 4(2) + 1 = 4 - 8 + 1 = -3$.'
      - '3. El vértice es $V(2, -3)$.'
  - titulo: 'Vértice en función incompleta b = 0'
    enunciado: '¿Cuáles son las coordenadas del vértice de $g(x) = -3x^2 + 7$?'
    alternativas:
      - '$V(0, 7)$'
      - '$V(7, 0)$'
      - '$V(0, -3)$'
    respuesta: '$V(0, 7)$'
    solucion_pasos:
      - '1. Como $b = 0$, $h = 0$.'
      - '2. $k = g(0) = -3(0)^2 + 7 = 7$.'
      - '3. El vértice es $V(0, 7)$.'
  - titulo: 'Coincidencia entre evaluación y fórmula de k'
    enunciado: '¿Los métodos $k = f(h)$ y $k = \frac{4ac - b^2}{4a}$ producen siempre exactamente la misma ordenada del vértice?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas fórmulas son algebraicamente equivalentes demostradas a partir del desarrollo de la notación polinomial.'
  - titulo: 'Lectura directa desde la forma canónica'
    enunciado: 'Dada $f(x) = -2(x - 5)^2 + 3$, ¿las coordenadas del vértice son $V(5, 3)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En la forma canónica $a(x - h)^2 + k$, los parámetros $h = 5$ y $k = 3$ entregan directamente $V(5, 3)$.'
errores_frecuentes:
  - 'Las coordenadas del vértice de $f(x) = ax^2 + bx + c$ son $V(a, b)$.'
  - 'La ordenada del vértice $k$ se calcula mediante la fórmula $k = \frac{b^2 - 4ac}{2a}$.'
  - 'En la función $f(x) = (x + 4)^2 - 1$, el vértice se encuentra en $V(4, -1)$.'
  - 'El cálculo de $k = f(h)$ sólo es válido si el discriminante $\Delta$ es estrictamente positivo.'
  - 'La abscisa del vértice $h$ se calcula dividiendo el término independiente $c$ por el coeficiente $a$.'
afirmaciones_verdaderas:
  - 'Las coordenadas del vértice de la parábola se representan como $V(h, k)$, donde $h = -\frac{b}{2a}$ y $k = f(h)$.'
  - 'La ordenada del vértice también puede calcularse directamente de los coeficientes mediante la relación $k = \frac{4ac - b^2}{4a}$.'
al_terminar_debes_poder: 'Calcular con precisión las coordenadas cartesianas del vértice $V(h, k)$ para cualquier función cuadrática.'
