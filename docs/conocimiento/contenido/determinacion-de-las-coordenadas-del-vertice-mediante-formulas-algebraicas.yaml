semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.COORDENADAS_VERTICE
resumen_inicial: La determinación de las coordenadas del vértice calcula $V(h, k)$ aplicando $h = -b/(2a)$ y $k = f(h) = (4ac - b^2)/(4a)$.
explicacion_simple: |
  Para calcular numéricamente el punto del **vértice $V(h, k)$** de una función cuadrática $f(x) = ax^2 + bx + c$:

  1. **Calculas la coordenada $x$ (llamada $h$)** con la fórmula:
     $$h = -\frac{b}{2a}$$
  2. **Calculas la coordenada $y$ (llamada $k$)** reemplazando el resultado de $h$ en la función:
     $$k = f(h)$$
  3. **Ejemplo**: Para $f(x) = x^2 - 6x + 5$:
     - Coeficientes: $a = 1, b = -6, c = 5$.
     - Coordenada $h = -\frac{-6}{2(1)} = \frac{6}{2} = 3$.
     - Coordenada $k = f(3) = (3)^2 - 6(3) + 5 = 9 - 18 + 5 = -4$.
     - El vértice es **$V(3, -4)$**.
explicacion_formal: |
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, las coordenadas del **vértice $V(h, k) \in \mathbb{R}^2$** se obtienen analíticamente por completación de cuadrados o diferenciación:

  $$f(x) = a\left(x + \frac{b}{2a}\right)^2 + \frac{4ac - b^2}{4a} = a(x - h)^2 + k$$

  **Formulario estándar de coordenadas:**
  - Abscisa del vértice: $h = x_v = -\frac{b}{2a}$
  - Ordenada del vértice: $k = y_v = f(h) = c - \frac{b^2}{4a} = \frac{4ac - b^2}{4a} = -\frac{\Delta}{4a}$
definiciones_clave: |
  - **Coordenadas del vértice**: Par ordenado $(h, k)$ que especifica la ubicación espacial única del vértice en el plano cartesiano.
propiedades_relaciones: |
  - **Identidad con la forma canónica**: Al conocer las coordenadas $V(h, k)$, la función se puede escribir directamente en forma canónica como $f(x) = a(x - h)^2 + k$.
ejemplo_guiado:
  enunciado: 'Calcula las coordenadas del vértice de la función $f(x) = -2x^2 + 8x - 3$.'
  pasos:
    - 'Paso 1: Identificar coeficientes: $a = -2, b = 8, c = -3$.'
    - 'Paso 2: Aplicar la fórmula para la abscisa $h$: $h = -\frac{8}{2(-2)} = -\frac{8}{-4} = 2$.'
    - 'Paso 3: Evaluar $f(2)$ para la ordenada $k$: $k = f(2) = -2(2)^2 + 8(2) - 3 = -8 + 16 - 3 = 5$.'
    - 'Paso 4: Escribir las coordenadas del vértice: $V(2, 5)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la abscisa $h$ del vértice para la función cuadrática $f(x) = 2x^2 - 12x + 10$?'
    choices:
      - {text: '$h = 3$', is_correct: true}
      - {text: '$h = -3$', is_correct: false}
      - {text: '$h = 6$', is_correct: false}
      - {text: '$h = 12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$h = 3$''. Aplicando $h = -b/(2a) = -(-12)/(2 \cdot 2) = 12/4 = 3$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las coordenadas completas del vértice $V(h, k)$ de la función $f(x) = x^2 - 4x + 7$?'
    choices:
      - {text: '$V(2, 3)$', is_correct: true}
      - {text: '$V(-2, 19)$', is_correct: false}
      - {text: '$V(4, 7)$', is_correct: false}
      - {text: '$V(2, -1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(2, 3)$''. Calculando $h = -(-4)/2 = 2$ y $k = f(2) = 2^2 - 4(2) + 7 = 3$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer los coeficientes $a, b, c$ de la ecuación de la función.'
  - 'Paso 2: Calcular la primera componente con la fórmula $h = -\frac{b}{2a}$.'
  - 'Paso 3: Reemplazar el valor de $h$ obtenido dentro de la función para hallar $k = f(h)$.'
  - 'Paso 4: Enunciar el resultado final como el punto ordenado $V(h, k)$.'
errores_correccion: |
  - **Error común:** Olvidar el signo menos inicial de la fórmula $h = -\frac{b}{2a}$ o errar el signo de $b$.
  - **Cómo corregirlo:** Escribe **EL SIGNO MENOS AFUERA** y pon $b$ entre paréntesis: $h = -\frac{(b)}{2a}$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Vértice de función mónica.
    alternativas:
      - 'V(1, -9)'
      - 'V(-1, 9)'
      - 'V(2, -8)'
    respuesta: 'V(1, -9)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Vértice de parábola cóncava hacia abajo.
    alternativas:
      - 'V(3, 4)'
      - 'V(-3, -4)'
      - 'V(0, -5)'
    respuesta: 'V(3, 4)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La ausencia del signo negativo de la fórmula de la abscisa escribiendo $h = b / (2a)$.'
  - 'La equivalencia errónea entre el coeficiente $a$ del denominador multiplicando por $a$ en lugar de $2a$.'
  - 'Cometer errores aritméticos al evaluar las potencias para calcular la ordenada $k = f(h)$.'
  - 'El intercambio en la posición del punto escribiendo $V(k, h)$ en lugar de $V(h, k)$.'
  - 'La suposición de que si $b = 0$, la abscisa del vértice no se puede calcular por división por cero.'
afirmaciones_verdaderas:
  - 'La abscisa del vértice se calcula con $h = -b/(2a)$ y la ordenada se obtiene evaluando dicho resultado en la función $k = f(h)$.'
  - 'El vértice $V(h, k)$ une la recta del eje de simetría $x = h$ con el valor extremo de la función $y = k$.'
al_terminar_debes_poder: |
  QUÉ: Calcular algebraicamente las coordenadas del vértice $V(h, k)$ de cualquier función cuadrática.
  CÓMO: Aplicar $h = -b/(2a)$, evaluar $k = f(h)$ y escribir el par ordenado cartesiano resultante.
