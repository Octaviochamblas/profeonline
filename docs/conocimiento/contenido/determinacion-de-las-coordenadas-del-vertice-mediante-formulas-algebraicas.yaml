procedimiento:
- 'Paso 1: Identifica los coeficientes $a$ y $b$ de la función.'
- 'Paso 2: Calcula $x_v=-\dfrac{b}{2a}$.'
- 'Paso 3: Sustituye $x_v$ en la función original para obtener $y_v=f(x_v)$.'
- 'Paso 4: El vértice es el par ordenado $(x_v,y_v)$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en determinación de las coordenadas del vértice
  mediante fórmulas algebraicas.
ejemplos:
- titulo: Cálculo de coordenadas con a igual a 1
  enunciado: Determina el vértice de $f(x)=x^2+2x-3$.
  solucion_pasos:
  - $x_v=-\dfrac{2}{2(1)}=-1$.
  - $y_v=f(-1)=1-2-3=-4$.
  - El vértice es $(-1,-4)$.
- titulo: Cálculo de coordenadas con a distinto de 1
  enunciado: Determina el vértice de $f(x)=2x^2-8x+3$.
  solucion_pasos:
  - $x_v=-\dfrac{-8}{2(2)}=2$.
  - $y_v=f(2)=8-16+3=-5$.
  - El vértice es $(2,-5)$.
- titulo: ¿Es posible calcular la coordenada $y$ del vértice sin calcular primero
    la coordenada $x$?
  enunciado: ¿Es posible calcular la coordenada $y$ del vértice sin calcular primero
    la coordenada $x$?
  respuesta: 'No'
  solucion_pasos:
  - Se necesita el valor de $x_v$ para sustituirlo en la función y obtener $y_v$.
- titulo: ¿El vértice obtenido con esta fórmula coincide con el punto $(h,k)$ de la
    forma canónica?
  enunciado: ¿El vértice obtenido con esta fórmula coincide con el punto $(h,k)$ de
    la forma canónica?
  respuesta: Sí
  solucion_pasos:
  - Ambos métodos (fórmula algebraica o forma canónica) dan exactamente el mismo vértice
    para la misma función.
errores_frecuentes:
- Calcular solo la coordenada $x$ del vértice y omitir la coordenada $y$.
- Sustituir $x_v$ incorrectamente en la función original, cometiendo errores de cálculo.
- Cometer errores de signo al calcular $-b/(2a)$.
- Confundir el orden de las coordenadas, reportando $(y_v,x_v)$ en vez de $(x_v,y_v)$.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
