semantic_id: MAT.GEO.ANGULOS_APLICACIONES.DEPRESION_DEFINICION
resumen_inicial: El ángulo de depresión es el ángulo agudo formado entre la línea
  horizontal de visión del observador (ubicado en altura) y la línea visual dirigida
  hacia un objeto situado más abajo.
explicacion_simple: '![Ángulo de Depresión](/static/img/nodos/definicion-de-angulo-de-depresion-respecto-de-la-horizontal-intro.svg)


  Si estás en lo alto de un edificio o un faro y miras un barco en el agua, debes
  bajar la mirada. El ángulo que se forma entre la línea recta horizontal imaginaria
  que está a la altura de tus ojos y la línea inclinada hacia abajo con la que miras
  el barco es el **ángulo de depresión**.'
explicacion_formal: '### Definición formal

  El **ángulo de depresión** $\theta_{\text{dep}}$ es el ángulo formado entre la línea
  horizontal de referencia que pasa por el observador y su línea de visión dirigida
  hacia abajo en dirección a un objeto situado en una posición inferior:


  $$\theta_{\text{dep}} = \angle(\text{Línea Horizontal}, \text{Línea de Visión Descendente})
  \quad (\text{con } \theta_{\text{dep}} \in [0^\circ, 90^\circ])$$


  $$\theta_{\text{dep}} = \theta_{\text{elev}} \quad (\text{por ángulos alternos internos
  entre horizontales paralelas})$$


  ### Desglose simbólico y geométrico

  - Referencia horizontal superior: El ángulo se mide obligatoriamente hacia abajo
  a partir de la horizontal imaginaria que pasa por el observador.

  - Identidad con elevación: El ángulo de depresión con el que el observador mira
  al objeto es igual al ángulo de elevación con el que el objeto mira al observador.


  ### Síntesis didáctica

  La igualdad entre el ángulo de depresión y el de elevación simplifica los problemas
  de navegación y geodesia permitiendo resolverlos en el triángulo rectángulo inferior.'
definiciones_clave: '- **Línea horizontal superior**: Eje horizontal imaginario trazado
  a la altura del observador elevado.

  - **Línea visual descendente**: Trayectoria óptica recta hacia el objetivo situado
  más abajo.

  - **Ángulo de depresión ($\beta$)**: Abertura angular medida hacia abajo a partir
  de la horizontal superior. '
propiedades_relaciones: '- **Igualdad con el ángulo de elevación**: Por alternos internos
  entre paralelas, $\text{Ángulo de depresión (arriba)} = \text{Ángulo de elevación
  (abajo)}$.

  - **Relación trigonométrica**: $\tan(\beta) = \frac{\text{altura } h}{\text{distancia
  horizontal } d}$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo de Depresión](/static/img/nodos/definicion-de-angulo-de-depresion-respecto-de-la-horizontal-ejemplos.svg)


    Desde la cima de un acantilado de $40\text{ m}$ de altura, un vigía observa un
    barco con un ángulo de depresión de $45^\circ$. ¿A qué distancia horizontal de
    la base del acantilado se encuentra el barco?'
  pasos:
  - 'Paso 1: Identificar la altura $h = 40\text{ m}$ y el ángulo de depresión $\beta
    = 45^\circ$.'
  - 'Paso 2: Por alternos internos, el ángulo de elevación desde el barco hacia la
    cima también es de $45^\circ$.'
  - 'Paso 3: Plantear la tangente: $\tan(45^\circ) = \frac{h}{d} = \frac{40}{d}$.'
  - 'Paso 4: Como $\tan(45^\circ) = 1$, despejar $d$: $1 = \frac{40}{d} \implies d
    = 40\text{ m}$.'
  - 'Paso 5: Concluir que el barco está a $40\text{ metros}$ de la base del acantilado.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué razón geométrica el ángulo de depresión desde un faro hacia un
    barco es igual al ángulo de elevación desde el barco hacia el faro?
  choices:
  - text: Por ser ángulos alternos internos entre las dos líneas horizontales paralelas
    is_correct: true
  - text: Por ser ángulos opuestos por el vértice
    is_correct: false
  - text: Por ser ángulos suplementarios que suman 180°
    is_correct: false
  - text: Por ser ángulos complementarios que suman 90°
    is_correct: false
  explanation: Ambas líneas horizontales son paralelas, por lo que son iguales por
    ser ángulos alternos internos entre las dos líneas horizontales paralelas.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Desde qué línea de referencia se mide siempre el ángulo de depresión?
  choices:
  - text: Desde la línea horizontal del observador hacia abajo
    is_correct: true
  - text: Desde el muro vertical hacia el suelo
    is_correct: false
  - text: Desde el suelo hacia arriba
    is_correct: false
  - text: Desde la vertical hacia la derecha
    is_correct: false
  explanation: Por definición, el ángulo de depresión se mide desde la línea horizontal
    del observador hacia abajo.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar una línea horizontal imaginaria a la altura del observador en la
  cima.'
- 'Paso 2: Medir el ángulo de depresión $\beta$ hacia abajo desde dicha horizontal.'
- 'Paso 3: Trasladar el ángulo a la base del triángulo como ángulo de elevación usando
  la propiedad de alternos internos.'
- 'Paso 4: Aplicar la relación $\tan(\beta) = \frac{\text{altura}}{\text{distancia
  horizontal}}$ para calcular la variable buscada.'
errores_correccion: 'No cometas el error clásico de medir el ángulo de depresión pegado
  a la pared vertical: siempre se mide desde la línea horizontal.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si desde un helicóptero a $100\text{ m}$ de altura se observa un automóvil
    con un ángulo de depresión de $30^\circ$, ¿cuál es la distancia horizontal al
    automóvil?
  alternativas:
  - $d = \frac{100}{ an(30^\circ)} = 100\sqrt{3}\text{ m} \approx 173{,}2\text{ m}$
  - $d = 100 \cdot  an(30^\circ) = \frac{100\sqrt{3}}{3}\text{ m}$
  - $d = 100\text{ m}$
  respuesta: $d = \frac{100}{ an(30^\circ)} = 100\sqrt{3}\text{ m} \approx 173{,}2\text{
    m}$
  solucion_pasos:
  - $ an(30^\circ) = \frac{100}{d} \implies d = \frac{100}{ an(30^\circ)} = 100\sqrt{3}\text{
    m}$.
- titulo: Ejemplo 2
  enunciado: Si el ángulo de depresión de un objeto es $25^\circ$, ¿cuánto mide el
    ángulo de elevación con que ese objeto ve al observador?
  alternativas:
  - $25^\circ$
  - $65^\circ$
  - $155^\circ$
  respuesta: $25^\circ$
  solucion_pasos:
  - Por alternos internos entre paralelas horizontales, miden exactamente lo mismo: $25^\circ$.
- titulo: ¿El ángulo de depresión es igual al ángulo de elevación entre dos puntos?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser ángulos alternos internos entre rectas horizontales paralelas.
- titulo: ¿El ángulo de depresión se mide respecto a la pared vertical?
  respuesta: 'No'
  solucion_pasos:
  - No, se mide estrictamente a partir de la línea horizontal de visión superior.
errores_frecuentes:
- Medir el ángulo respecto a la pared vertical del edificio o acantilado.
- Confundir la posición de cateto opuesto y adyacente en la tangente.
- Olvidar que la línea de referencia horizontal superior es paralela al suelo.
- Restar el ángulo de $90^\circ$ incorrectamente en lugar de aplicar la igualdad por
  alternos internos.
- Confundir ángulo de depresión con elevación al redactar la respuesta final.
afirmaciones_verdaderas:
- El ángulo de depresión se mide desde la horizontal superior hacia abajo.
- Por alternos internos, el ángulo de depresión es idéntico al ángulo de elevación
  correspondiente.
al_terminar_debes_poder: '**QUÉ:** Comprender y aplicar el ángulo de depresión en
  problemas de trigonometría y geometría plana.


  **CÓMO:** Trazando la horizontal superior, aplicando alternos internos y resolviendo
  con razones trigonométricas ($ an(\beta) = \frac{h}{d}$).


  ![Resumen del Ángulo de Depresión](/static/img/nodos/definicion-de-angulo-de-depresion-respecto-de-la-horizontal-resumen.svg)'
