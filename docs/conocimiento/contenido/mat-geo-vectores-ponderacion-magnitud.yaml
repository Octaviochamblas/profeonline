semantic_id: MAT.GEO.VECTORES_OPERATORIA.PONDERACION_MAGNITUD
resumen_inicial: 'Efecto de la multiplicación escalar en la magnitud de un vector:
  conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Al 'estirar' o 'encoger' un vector mediante un escalar, su longitud
  cambia proporcionalmente al valor absoluto de ese escalar.
explicacion_formal: '![Efecto de la ponderación escalar en la magnitud](/static/img/geometria/cartesiano-vectores/vectores-ponderacion-magnitud.svg)


  ### Definición formal


  Para cualquier vector $\vec{v}$ y escalar $k$, se cumple $|k\vec{v}|=|k|\times|\vec{v}|$:
  el módulo del vector escalado es el valor absoluto del escalar multiplicado por
  el módulo original.


  ### Desarrollo didáctico


  Si $|\vec{v}|=1{,}8$ y se multiplica por $k=3$, el nuevo módulo es $|3\vec{v}|=3\times1{,}8=5{,}4$:
  exactamente el triple del módulo original, sin importar la dirección del vector.'
