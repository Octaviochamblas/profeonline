semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.RECTAS_PERPENDICULARES_DEFINICION
resumen_inicial: Dos rectas son perpendiculares si al intersecarse en el plano forman
  un ángulo recto de exactamente 90° (π/2 rad), denotándose como L₁ ⊥ L₂.
explicacion_simple: '![Definición de Rectas Perpendiculares](/static/img/nodos/definicion-de-rectas-perpendiculares-intro.svg)


  Dos rectas son perpendiculares cuando se cruzan formando una cruz perfecta con esquinas
  cuadradas de 90°. Por ejemplo, la línea del suelo y la pared de un edificio forman
  rectas perpendiculares.'
explicacion_formal: '### Definición formal

  Dos rectas coplanares $L_1$ y $L_2$ son **perpendiculares** (denotado $L_1 \perp
  L_2$) si se intersectan formando un ángulo recto ($90^\circ$ o $\frac{\pi}{2} \text{
  rad}$):


  $$L_1 \perp L_2 \iff \exists P \in L_1 \cap L_2 \quad \text{tal que} \quad \mu(\angle(L_1,
  L_2)) = 90^\circ$$


  ### Desglose simbólico y geométrico

  - Símbolo $\perp$: Operador de perpendicularidad u ortogonalidad geométrica.

  - Pendientes en geometría analítica: $m_1 \cdot m_2 = -1$ (para rectas no verticales).

  - Vectores directores ortogonales: $\vec{v}_1 \cdot \vec{v}_2 = 0$.


  ### Síntesis didáctica

  La perpendicularidad es la relación geométrica que define la menor distancia entre
  puntos y rectas, y rige el trazado de alturas y sistemas coordenados.'
definiciones_clave: '- **Perpendicularidad**: Relación entre dos rectas que se cortan
  formando un ángulo recto ($90^\circ$).

  - **Símbolo $\perp$**: Notación matemática estándar para indicar perpendicularidad
  ($L_1 \perp L_2$). '
propiedades_relaciones: '- **Simetría de la relación**: Si $L_1 \perp L_2$, entonces
  $L_2 \perp L_1$.

  - **Pendientes en geometría analítica**: En el plano cartesiano, el producto de
  sus pendientes es $-1$ ($m_1 \cdot m_2 = -1$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Rectas Perpendiculares](/static/img/nodos/definicion-de-rectas-perpendiculares-ejemplos.svg)


    Dos rectas $L_1$ y $L_2$ se cortan formando un ángulo de $90^\circ$. Escribe la
    notación matemática formal correspondiente y explica qué figura geométrica forma
    su vértice.'
  pasos:
  - 'Paso 1: Identificar que el ángulo de intersección es $90^\circ$.'
  - 'Paso 2: Aplicar la definición: dos rectas que forman $90^\circ$ son perpendiculares.'
  - 'Paso 3: Escribir la notación formal: $L_1 \perp L_2$.'
  - 'Paso 4: Explicar que en el vértice se forma una esquina ortogonal representada
    por el símbolo de ángulo recto (un pequeño cuadrado).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ángulo forman dos rectas perpendiculares al cortarse?
  choices:
  - text: Exactamente 90° (un ángulo recto)
    is_correct: true
  - text: Exactamente 180°
    is_correct: false
  - text: Exactamente 45°
    is_correct: false
  - text: Cualquier ángulo agudo
    is_correct: false
  explanation: Por definición geométrica, forman exactamente 90° (un ángulo recto).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el símbolo matemático que representa la perpendicularidad entre
    dos rectas L₁ y L₂?
  choices:
  - text: L₁ ⊥ L₂
    is_correct: true
  - text: L₁ ∥ L₂
    is_correct: false
  - text: L₁ = L₂
    is_correct: false
  - text: L₁ ~ L₂
    is_correct: false
  explanation: El símbolo estándar de perpendicularidad es ⊥ (L₁ ⊥ L₂).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o identificar el ángulo formado en la intersección de dos rectas.'
- 'Paso 2: Si el ángulo es igual a $90^\circ$, clasificar las rectas como perpendiculares.'
- 'Paso 3: Utilizar la notación $L_1 \perp L_2$.'
errores_correccion: No confundas el símbolo de perpendicularidad (⊥) con el símbolo
  de paralelismo (∥).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos rectas se cortan formando un ángulo de 90°, ¿cómo se llaman?
  alternativas:
  - Rectas perpendiculares
  - Rectas paralelas
  - Rectas secantes oblicuas
  respuesta: Rectas perpendiculares
  solucion_pasos:
  - Al formar $90^\circ$, son rectas perpendiculares.
- titulo: Ejemplo 2
  enunciado: ¿Qué símbolo matemático indica que la recta $R$ es perpendicular a la
    recta $S$?
  alternativas:
  - $R \perp S$
  - $R \parallel S$
  - $R = S$
  respuesta: $R \perp S$
  solucion_pasos:
  - El símbolo $\perp$ indica perpendicularidad: $R \perp S$.
- titulo: ¿Dos rectas perpendiculares siempre se cortan?
  respuesta: Sí
  solucion_pasos:
  - Sí, en geometría plana euclidiana se intersecan en un único punto formando 90°.
- titulo: ¿Dos rectas que forman un ángulo de 85° son perpendiculares?
  respuesta: 'No'
  solucion_pasos:
  - No, deben formar exactamente 90°. Si forman 85° son rectas secantes oblicuas.
errores_frecuentes:
- Confundir rectas perpendiculares ($90^\circ$) con rectas secantes oblicuas (distinto
  de $90^\circ$).
- Confundir la notación $\perp$ con la de paralelismo $\parallel$.
- Creer que las rectas perpendiculares solo pueden ser horizontales y verticales.
- Pensar que las rectas paralelas son un caso especial de perpendiculares.
- Olvidar marcar el símbolo de ángulo recto en los esquemas.
afirmaciones_verdaderas:
- Dos rectas perpendiculares se cortan formando un ángulo de $90^\circ$.
- La relación de perpendicularidad se denota con el símbolo $\perp$.
al_terminar_debes_poder: '**QUÉ:** Definir, identificar y simbolizar formalmente pares
  de rectas perpendiculares.


  **CÓMO:** Comprobando la formación de un ángulo recto de $90^\circ$ en su punto
  de intersección y empleando el operador $\perp$.


  ![Resumen de Definición de Perpendiculares](/static/img/nodos/definicion-de-rectas-perpendiculares-resumen.svg)'
