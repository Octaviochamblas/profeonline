semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.RECTAS_PERPENDICULARES_DEFINICION
resumen_inicial: 'Comprensión Didáctica y Aplicación Práctica de Definición de rectas
  perpendiculares: Importancia de su Medida y Relaciones en Geometría Plana.'
explicacion_simple: Al trabajar con definición de rectas perpendiculares, analizamos
  la relación entre aberturas angulares y cómo se aplican las reglas geométricas para
  encontrar valores desconocidos.
explicacion_formal: En la teoría geométrica de definición de rectas perpendiculares,
  se aplican teoremas y relaciones algebraicas sobre rectas y vértices para estructurar
  demostraciones e igualdades angulares precisas.
definiciones_clave: '- **Definición de rectas perpendiculares**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en definición de rectas perpendiculares se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Dos calles rectilíneas se intersectan de modo que uno de los cuatro ángulos
    formados en la esquina mide $90^\circ$. Aplica la definición geométrica para justificar
    si las dos calles son perpendiculares.
  pasos:
  - 'Paso 1: Recordar la definición: dos rectas son perpendiculares si al intersectarse
    forman al menos un ángulo recto ($90^\circ$).'
  - 'Paso 2: Verificar la medida dada de $90^\circ$ en la esquina del cruce.'
  - 'Paso 3: Concluir que las dos calles son estrictamente perpendiculares.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de definición de rectas perpendiculares?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos calles al intersectarse forman un ángulo de 90°, ¿cómo se definen
    geométricamente?
  choices:
  - text: Como rectas perpendiculares
    is_correct: true
  - text: Como rectas paralelas
    is_correct: false
  - text: Como rectas coincidentes
    is_correct: false
  - text: Como rectas oblicuas no perpendiculares
    is_correct: false
  explanation: La alternativa correcta es 'Como rectas perpendiculares', por definición
    de intersección a 90°.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en definición de rectas perpendiculares.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en definición de rectas
  perpendiculares sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 79^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 101°
  - 79°
  - 90°
  respuesta: 101°
  solucion_pasos:
  - Despejando $x = 180 - 79 = 101^\circ$.
- titulo: Ejemplo 2
  enunciado: En definición de rectas perpendiculares, si dos ángulos son suplementarios
    y uno mide 79°, ¿cuánto mide el otro?
  alternativas:
  - 101°
  - 11°
  - 360°
  respuesta: 101°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 79 = 101^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en definición de
    rectas perpendiculares?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en definición de rectas perpendiculares
    es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de definición de rectas perpendiculares.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
