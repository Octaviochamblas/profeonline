semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.DESPLAZAMIENTO_VERTICAL
resumen_inicial: 'Identificación del desplazamiento vertical de la gráfica trigonométrica:
  círculo unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: El parámetro $d$ mueve toda la curva hacia arriba o hacia abajo,
  sin alterar su forma, amplitud ni periodo.
explicacion_formal: '### Definición formal


  La función $f(x)=g(x)+d$, donde $g(x)=a\sin(bx)$, traslada verticalmente cada punto
  de $g$ en $d$ unidades. A diferencia del desplazamiento horizontal, el signo de
  $d$ coincide directamente con la dirección visual del movimiento.


  ### Desarrollo didáctico


  $f(x)=\sin(x)+3$ se desplaza $3$ unidades hacia arriba: oscila ahora entre $2$ y
  $4$, en vez de entre $-1$ y $1$. $f(x)=\cos(x)-2$ se desplaza $2$ unidades hacia
  abajo: oscila entre $-3$ y $-1$.'
definiciones_clave: '- **Identificación del desplazamiento vertical de la gráfica
  trigonométrica**: Función periódica fundamentada en las coordenadas del círculo
  unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación del desplazamiento vertical de la gráfica trigonométrica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación del desplazamiento vertical de la gráfica trigonométrica.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación del desplazamiento vertical de la gráfica
    trigonométrica.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
