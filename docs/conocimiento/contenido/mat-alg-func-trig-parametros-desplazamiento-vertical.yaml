semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.DESPLAZAMIENTO_VERTICAL
resumen_inicial: 'Identificación del desplazamiento vertical de la gráfica trigonométrica mediante el término independiente $D$.'
explicacion_simple: |
  El término constante **$D$** ubicado fuera de la función trigonométrica (como en $y = \sin(x) + 3$ o $y = 2\cos(x) - 5$) funciona como un elevador vertical. Toma a la sinusoide completa y la sube o la baja sin deformarla en lo absoluto. Si $D$ es positivo, la curva sube $D$ unidades; si $D$ es negativo, la curva baja. El valor de $D$ define la nueva posición de la **línea media** o eje central de equilibrio sobre el cual la onda sube y baja.
explicacion_formal: |
  ### Definición formal
  En las funciones trigonométricas $f(x) = A\sin(Bx + C) + D$ y $g(x) = A\cos(Bx + C) + D$, el parámetro independiente **$D \in \mathbb{R}$** representa la **traslación rígida vertical**.

  ### Desglose simbólico
  - Si $D > 0$: Traslación de $D$ unidades hacia **arriba**.
  - Si $D < 0$: Traslación de $|D|$ unidades hacia **abajo**.
  - Si $D = 0$: Sin desplazamiento vertical (línea media en el eje X $y = 0$).

  ### Síntesis didáctica
  El parámetro $D$ modifica el recorrido de la función desplazando simultáneamente ambas cotas extremas a $[D - |A|, D + |A|]$. La recta horizontal $y = D$ es el eje simétrico de oscilación de la onda.
definiciones_clave: |
  - **Desplazamiento vertical ($D$)**: Traslación rígida en el eje Y que eleva o desciende la gráfica completa.
  - **Línea media / Eje de oscilación ($y = D$)**: Recta horizontal equidistante del techo máximo y del piso mínimo.
  - **Extremos trasladados**: Valores límite $y_{\max} = D + |A|$ e $y_{\min} = D - |A|$.
propiedades_relaciones: |
  - **Conservación de la amplitud y del período**: El desplazamiento vertical es una transformación rígida que **no altera** la amplitud $|A|$, la frecuencia $B$ ni el período $T = \frac{2\pi}{|B|}$.
  - **Modificación de los ceros**: Al desplazar la función verticalmente ($D \neq 0$), los ceros ya no ocurren en los puntos base de $\sin(x) = 0$ o $\cos(x) = 0$, sino que se resuelven mediante la ecuación $A\sin(Bx+C) = -D$.
ejemplo_guiado:
  enunciado: 'Calcula el valor máximo, el valor mínimo y la línea media de la función $f(x) = 3\cos(2x) - 4$.'
  pasos:
    - 'Paso 1: Identificar los parámetros fundamentales: $A = 3$, $B = 2$, $D = -4$.'
    - 'Paso 2: Determinar la línea media: es la recta horizontal $y = D \implies y = -4$.'
    - 'Paso 3: Calcular el valor máximo: $y_{\max} = D + |A| = -4 + 3 = -1$.'
    - 'Paso 4: Calcular el valor mínimo: $y_{\min} = D - |A| = -4 - 3 = -7$. La gráfica oscila completamente por debajo del eje X en el recorrido $[-7, -1]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función $f(x) = \sin(x) + 5$, ¿cuál es la ecuación de la recta de equilibrio alrededor de la cual oscila la onda?'
    choices:
      - {text: 'La recta horizontal $y = 5$', is_correct: true}
      - {text: 'La recta vertical $x = 5$', is_correct: false}
      - {text: 'El eje X ($y = 0$)', is_correct: false}
      - {text: 'La recta diagonal $y = x + 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal $y = 5$''. El parámetro $D = 5$ desplaza la línea media a $y = 5$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función coseno tiene amplitud $2$ y desplazamiento vertical $D = 1$, ¿cuál es su valor máximo?'
    choices:
      - {text: '$y_{\max} = 3$', is_correct: true}
      - {text: '$y_{\max} = 2$', is_correct: false}
      - {text: '$y_{\max} = 1$', is_correct: false}
      - {text: '$y_{\max} = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y_{\max} = 3$''. El valor máximo es $D + |A| = 1 + 2 = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término constante $D$ sumado o restado fuera de la expresión trigonométrica.'
  - 'Paso 2: Establecer la línea media como la recta horizontal $y = D$.'
  - 'Paso 3: Calcular el límite superior $y_{\max} = D + |A|$ y el límite inferior $y_{\min} = D - |A|$.'
  - 'Paso 4: Escribir el nuevo recorrido de la función como $[D - |A|, D + |A|]$.'
errores_correccion: |
  - **Error 1:** Sumar el valor de $D$ dentro del argumento trigonométrico. **Cómo corregirlo:** El parámetro $D$ se encuentra **fuera** de los paréntesis de la función trigonométrica; si está dentro, se trata de una constante de desfase horizontal $C$.
  - **Error 2:** Creer que desplazar la función hacia arriba cambia su amplitud. **Cómo corregirlo:** El desplazamiento vertical sube toda la curva en bloque, manteniendo la semidistancia cresta-línea media exactamente igual a $|A|$.
ejemplos:
  - titulo: 'Desplazamiento hacia abajo'
    enunciado: '¿Cuál es el recorrido de la función $f(x) = \sin(x) - 2$?'
    alternativas:
      - '$[-3, -1]$'
      - '$[-2, 2]$'
      - '$[-1, 1]$'
    respuesta: '$[-3, -1]$'
    solucion_pasos:
      - '1. $A = 1$ y $D = -2$.'
      - '2. $y_{\min} = -2 - 1 = -3$ e $y_{\max} = -2 + 1 = -1$. Recorrido $[-3, -1]$.'
  - titulo: 'Coseno trasladado'
    enunciado: '¿Cuál es la línea media de $g(x) = 4\cos(x) + 7$?'
    alternativas:
      - 'La recta $y = 7$'
      - 'La recta $y = 4$'
      - 'La recta $y = 11$'
    respuesta: 'La recta $y = 7$'
    solucion_pasos:
      - '1. El parámetro de traslación es $D = 7$.'
      - '2. La línea media de oscilación es $y = 7$.'
  - titulo: 'Onda en el semiplano positivo'
    enunciado: '¿La gráfica de $y = \sin(x) + 2$ permanece completamente por encima del eje X?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues su recorrido es $[1, 3]$, por lo que todas sus ordenadas son positivas.'
  - titulo: 'Conservación de forma y tamaño'
    enunciado: '¿El desplazamiento vertical modifica el período o la amplitud de la onda?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, desplazar verticalmente es una traslación rígida que no deforma la onda.'
errores_frecuentes:
  - 'La afirmación de que el parámetro $D$ modifica la amplitud vertical de la oscilación.'
  - 'La afirmación de que el desplazamiento vertical altera la longitud del período fundamental de la función.'
  - 'La afirmación de que en la función $y = \sin(x) + 3$ la onda continúa teniendo su línea media en el eje X.'
  - 'La afirmación de que la constante $D$ debe sumarse dentro del argumento angular del seno.'
  - 'La afirmación de que desplazar una onda hacia arriba modifica la frecuencia de repetición de sus ciclos.'
afirmaciones_verdaderas:
  - 'El parámetro $D$ provoca una traslación rígida vertical de la gráfica trigonométrica, estableciendo la recta de equilibrio u oscilación media en $y = D$.'
  - 'El desplazamiento vertical altera el recorrido de la función al intervalo $[D - |A|, D + |A|]$, pero conserva intactos la amplitud $|A|$ y el período $T$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular el efecto del desplazamiento vertical $D$ en funciones trigonométricas.
  CÓMO: Ubicar la recta de equilibrio en $y = D$ y calcular las cotas del nuevo recorrido mediante $D \pm |A|$.
