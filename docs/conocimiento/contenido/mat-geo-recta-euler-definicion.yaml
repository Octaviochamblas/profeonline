semantic_id: MAT.GEO.RECTA_EULER.DEFINICION
resumen_inicial: 'Definición de recta de Euler como recta que contiene ortocentro,
  baricentro y circuncentro: conceptos, teoremas, propiedades geométricas y cálculo
  en Elementos Secundarios del Triángulo.'
explicacion_simple: Aunque el ortocentro, el baricentro y el circuncentro se definen
  de maneras completamente distintas (mediante alturas, transversales de gravedad
  y simetrales respectivamente), resulta que los tres siempre están alineados sobre
  una misma recta.
explicacion_formal: '![Recta de Euler: ortocentro, baricentro y circuncentro](/static/img/geometria/elementos-secundarios/recta-euler-definicion.svg)


  ### Definición formal


  Para todo triángulo (no equilátero), el ortocentro H, el baricentro G y el circuncentro
  O son colineales; la recta que los contiene se llama recta de Euler.


  ### Desarrollo didáctico


  Esta colinealidad es sorprendente porque H, G y O provienen de construcciones muy
  distintas (alturas, transversales de gravedad y simetrales), y sin embargo, siempre
  terminan alineados en la misma recta, sin importar la forma del triángulo.'
definiciones_clave: '- **Definición de recta de Euler como recta que contiene ortocentro,
  baricentro y circuncentro**: Elemento o propiedad fundamental en el estudio de elementos
  secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de recta de euler como recta que
  contiene ortocentro, baricentro y circuncentro.'
