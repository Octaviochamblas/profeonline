semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.ADICION_IGUAL_DENOMINADOR
resumen_inicial: 'La adición de fracciones de igual denominador suma los numeradores y mantiene exactamente el mismo denominador: $\frac{a}{b} + \frac{c}{b} = \frac{a + c}{b}$.'
explicacion_simple: 'Para sumar dos o más fracciones que tienen el mismo número abajo, simplemente sumamos los números de arriba y mantenemos el número de abajo exactamente igual. Como todas las partes son del mismo tamaño, basta con contar cuántos trozos juntamos en total.


  ![Adición de fracciones de igual denominador](/static/img/nodos/adicion-de-fracciones-de-igual-denominador-intro.svg)'
explicacion_formal: 'Para cualesquiera dos fracciones homogenizadas $\frac{a}{b}, \frac{c}{b} \in \mathbb{Q}$ con $b \neq 0$, la **Leyes de Adición Homogénea** se define como:


  $$\frac{a}{b} + \frac{c}{b} = \frac{a + c}{b}$$


  **Desglose de la fórmula:**

  - $a + c$: Suma algebraica de los numeradores en $\mathbb{Z}$.

  - $b$: Denominador común no nulo que se conserva idéntico.


  > **Complemento didáctico:** La propiedad se fundamenta en la distributividad de la multiplicación sobre la adición: $a \cdot \left(\frac{1}{b}\right) + c \cdot \left(\frac{1}{b}\right) = (a + c) \cdot \left(\frac{1}{b}\right)$.'
definiciones_clave: '- **Adición de fracciones homogéneas**: Suma directa de numeradores conservando el denominador común $b$.'
propiedades_relaciones: '- **Conmutatividad y asociatividad**: Heredadas directamente de la suma en $\mathbb{Z}$.'
ejemplo_guiado:
  enunciado: 'Calcule la suma de las fracciones $\frac{3}{7} + \frac{2}{7}$ y simplifique el resultado si corresponde.


    ![Ejemplo Adición de fracciones de igual denominador](/static/img/nodos/adicion-de-fracciones-de-igual-denominador-ejemplos.svg)'
  pasos:
  - 'Paso 1: Verificar el denominador común: en ambas es $7$.'
  - 'Paso 2: Sumar los numeradores: $3 + 2 = 5$.'
  - 'Paso 3: Conservar el denominador $7$: $\frac{5}{7}$.'
  - 'Conclusión: $\frac{3}{7} + \frac{2}{7} = \frac{5}{7}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de sumar dos fracciones a/b + c/b que tienen el mismo denominador?
  choices:
  - text: (a + c) / b (se suman los numeradores y se mantiene el denominador)
    is_correct: true
  - text: (a + c) / (b + b)
    is_correct: false
  - text: (a · c) / b
    is_correct: false
  - text: a / (b + c)
    is_correct: false
  explanation: La alternativa correcta es '(a + c) / b (se suman los numeradores y se mantiene el denominador)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3/7 + 2/7, ¿cuál fue la suma resultante?
  choices:
  - text: 5/7
    is_correct: true
  - text: 5/14
    is_correct: false
  - text: 6/7
    is_correct: false
  - text: 1/7
    is_correct: false
  explanation: La alternativa correcta es '5/7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que los denominadores sean idénticos.'
- 'Paso 2: Sumar los numeradores de las fracciones.'
- 'Paso 3: Mantener el mismo denominador en la fracción resultante y simplificar si es posible.'
errores_correccion: '- **Error 1: Sumar los denominadores entre sí (ej: $\frac{3}{7} + \frac{2}{7} = \frac{5}{14}$).** **Cómo corregirlo:** El denominador NUNCA se suma; se conserva intacto.


  - **Error 2: Olvidar simplificar la fracción resultante.** **Cómo corregirlo:** Si el resultado $\frac{a+c}{b}$ es simplificable, se debe reducir a su forma irreductible.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 4/9 + 1/9.
  alternativas:
  - 5/9
  - 5/18
  - 4/9
  respuesta: 5/9
  solucion_pasos:
  - $\frac{4+1}{9} = \frac{5}{9}$.
- titulo: Ejemplo 2
  enunciado: Calcule 5/12 + 3/12 y simplifique al máximo.
  alternativas:
  - 2/3 (tras simplificar 8/12)
  - 8/24
  - 8/12
  respuesta: 2/3 (tras simplificar 8/12)
  solucion_pasos:
  - $\frac{5+3}{12} = \frac{8}{12} = \frac{8:4}{12:4} = \frac{2}{3}$.
- titulo: ¿Se conserva el mismo denominador al sumar fracciones homogéneas?
  respuesta: Sí
  solucion_pasos:
  - Sí, se mantiene el mismo denominador en la fracción final.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
- titulo: ¿Es 1/5 + 2/5 igual a 3/10?
  respuesta: 'No'
  solucion_pasos:
  - No, los denominadores no se suman; es $3/5$.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
errores_frecuentes:
- Sumar fracciones de igual denominador exige sumar también los denominadores entre sí.
- El resultado de sumar dos fracciones homogéneas positivas es una fracción con denominador cero.
- Al sumar fracciones homogéneas se debe multiplicar los numeradores entre sí.
- Sumar dos fracciones de igual denominador exige amplificar previamente ambas fracciones.
- La suma de $1/4 + 1/4$ da como resultado $2/8$.
afirmaciones_verdaderas:
- La adición de fracciones de igual denominador se realiza sumando los numeradores y conservando el denominador.
- La suma $\frac{a}{b} + \frac{c}{b} = \frac{a+c}{b}$ se fundamenta en la propiedad distributiva de la unidad fraccionaria $\frac{1}{b}$.
al_terminar_debes_poder: '**QUÉ:** Sumar dos o más fracciones que comparten el mismo denominador.


  **CÓMO:** Conservando el denominador común $d$ y sumando algebraicamente sus numeradores enteros: $\frac{a}{d} + \frac{b}{d} = \frac{a+b}{d}$, simplificando la fracción resultante hasta su forma irreductible.


  ![Resumen Adición de fracciones de igual denominador](/static/img/nodos/adicion-de-fracciones-de-igual-denominador-resumen.svg)'
