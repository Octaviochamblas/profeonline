semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.ADICION_IGUAL_DENOMINADOR
resumen_inicial: "Para sumar fracciones con igual denominador, se suman directamente los numeradores y se conserva el mismo denominador común."
explicacion_simple: |
  Imagina que tienes dos platos. En el primero hay 2 rebanadas de pizza cortadas en octavos ($\frac{2}{8}$) y en el segundo hay 3 rebanadas también cortadas en octavos ($\frac{3}{8}$). Si juntas ambas en un solo plato, tienes $2 + 3 = 5$ rebanadas de octavos ($\frac{5}{8}$). Como el tamaño de cada rebanada es el mismo (el denominador no cambia), **solo sumas los números de arriba y mantienes el número de abajo**.
explicacion_formal: |
  Formalmente, dadas dos fracciones $\frac{a}{c}$ y $\frac{b}{c}$ con denominador común $c \in \mathbb{Z} \setminus \{0\}$ y numeradores $a, b \in \mathbb{Z}$:
  $$\frac{a}{c} + \frac{b}{c} = \frac{a + b}{c}$$

  Demostración basada en la propiedad distributiva del producto respecto de la suma sobre $\mathbb{Q}$:
  $$\frac{a}{c} + \frac{b}{c} = a \cdot \left(\frac{1}{c}\right) + b \cdot \left(\frac{1}{c}\right) = (a + b) \cdot \left(\frac{1}{c}\right) = \frac{a + b}{c}$$
definiciones_clave: |
  - **Adición de igual denominador**: Suma donde se mantiene el denominador $c$ y se calcula $a + b$.
  - **Denominador común ($c$)**: Término inferior idéntico que actúa como unidad de medida compartida.
  - **Numerador resultante ($a + b$)**: Suma aritmética de las partes acumuladas.
propiedades_relaciones: |
  - **Conservación de la unidad fraccionaria**: La operación preserva la escala $\frac{1}{c}$ sin modificar el tamaño de las partes.
  - **Conmutatividad**: $\frac{a}{c} + \frac{b}{c} = \frac{b}{c} + \frac{a}{c}$.
  - **Simplificación posterior**: El resultado final $\frac{a+b}{c}$ debe simplificarse a su forma irreductible si $a+b$ y $c$ comparten divisores comunes.
ejemplo_guiado:
  enunciado: "Suma las fracciones $\\frac{4}{15}$ y $\\frac{8}{15}$ y simplifica el resultado si es posible."
  pasos:
    - "Verificar que los denominadores sean iguales: $c = 15$."
    - "Sumar los numeradores: $4 + 8 = 12$."
    - "Escribir la fracción resultante conservando el denominador: $\\frac{12}{15}$."
    - "Simplificar por el común divisor $3$: $\\frac{12 \\div 3}{15 \\div 3} = \\frac{4}{5}$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la regla correcta para resolver la adición $\\frac{a}{c} + \\frac{b}{c}$ entre dos fracciones de igual denominador?"
    choices:
      - {text: "Sumar los numeradores y mantener el mismo denominador: $\\frac{a+b}{c}$.", is_correct: true}
      - {text: "Sumar los numeradores y sumar los denominadores: $\\frac{a+b}{c+c}$.", is_correct: false}
      - {text: "Multiplicar los numeradores en diagonal.", is_correct: false}
      - {text: "Restar el denominador del numerador.", is_correct: false}
    explanation: "La correcta es Sumar los numeradores y mantener el mismo denominador: $\\frac{a+b}{c}$.: al compartir la misma unidad fraccionaria, solo se acumulan los numeradores."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al sumar $\\frac{5}{12} + \\frac{1}{12}$, ¿cuál es la fracción simplificada irreductible del resultado?"
    choices:
      - {text: "$\\frac{1}{2}$", is_correct: true}
      - {text: "$\\frac{6}{12}$", is_correct: false}
      - {text: "$\\frac{6}{24}$", is_correct: false}
      - {text: "$\\frac{1}{4}$", is_correct: false}
    explanation: "La correcta es \\frac{1}{2}: $\\frac{5+1}{12} = \\frac{6}{12}$, que simplificada por $6$ resulta $\\frac{1}{2}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Confirmar que las fracciones tengan el mismo denominador $c$."
  - "Paso 2: Sumar los numeradores $a + b$."
  - "Paso 3: Escribir el nuevo numerador sobre el denominador común $c$."
  - 'Paso 4: Simplificar la fracción resultante dividiendo por $\text{MCD}(a+b, c)$ si es mayor que 1.'
errores_correccion: |
  El error más destructivo es sumar también los denominadores (hacer $\frac{2}{5} + \frac{1}{5} = \frac{3}{10}$). Recuerda: **los denominadores no se suman cuando son iguales**, solo representan de qué tamaño es la tajada.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $\\frac{3}{7} + \\frac{2}{7}$."
    alternativas:
      - "$\\frac{5}{7}$"
      - "$\\frac{5}{14}$"
      - "$\\frac{6}{7}$"
    respuesta: "$\\frac{5}{7}$"
    solucion_pasos:
      - "Mantenemos el denominador 7."
      - "Sumamos numeradores: $3 + 2 = 5$."
      - "Obtenemos $\\frac{5}{7}$."
  - titulo: "Ejemplo 2"
    enunciado: "Una botella contiene $\\frac{3}{10}$ L de agua y se le vierten $\\frac{4}{10}$ L más. ¿Qué fracción de litro contiene ahora?"
    alternativas:
      - "$\\frac{7}{10} L$"
      - "$\\frac{7}{20} L$"
      - "$\\frac{12}{10} L$"
    respuesta: "$\\frac{7}{10} L$"
    solucion_pasos:
      - "Denominador común 10."
      - "Sumamos los litros: $3 + 4 = 7$ décimos."
      - "Total: $\\frac{7}{10}$ L."
  - titulo: "¿Es $\\frac{1}{4} + \\frac{3}{4} = 1$ entero completo?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, $\\frac{1+3}{4} = \\frac{4}{4} = 1$."
  - titulo: "¿Se conserva esta misma regla para sumar más de dos fracciones de igual denominador?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, $\\frac{a}{c} + \\frac{b}{c} + \\frac{d}{c} = \\frac{a+b+d}{c}$."
errores_frecuentes:
  - "Sumar los denominadores entre sí (ejemplo: $\\frac{1}{3} + \\frac{1}{3} = \\frac{2}{6}$)."
  - "Olvidar simplificar el resultado final cuando no es irreductible."
  - "Multiplicar los numeradores en lugar de sumarlos."
  - "Convertir innecesariamente a números decimales dificultando el cálculo."
  - "Cambiar el denominador durante la suma."
afirmaciones_verdaderas:
  - "Para sumar fracciones de igual denominador, se suman únicamente los numeradores y se conserva el denominador común."
  - "La suma $\\frac{a}{c} + \\frac{b}{c}$ equivale a la fracción $\\frac{a+b}{c}$."
al_terminar_debes_ponder: |
  Debes ser capaz de sumar fracciones de igual denominador y simplificar el resultado obtenido a su representación irreductible.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
