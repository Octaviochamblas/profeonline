procedimiento:
- 'Paso 1: Convierte la medida real a la unidad en la que vas a dibujar (generalmente centímetros).'
- 'Paso 2: Toma la escala $1:E$ y fíjate en el número $E$.'
- 'Paso 3: Divide la medida real (ya convertida) por $E$. Ese es tu tamaño de dibujo.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de longitud
  en plano usando escala.
ejemplos:
- titulo: Dibujando una pared
  enunciado: Pared real de 5 metros. Escala 1:50. ¿Cuánto mide en el plano?
  solucion_pasos:
  - 'Convertimos 5 metros a centímetros: $5 \cdot 100 = 500$ cm.'
  - La escala dice $E = 50$.
  - 'Dividimos: $500 / 50 = 10$ cm. En el plano medirás 10 cm.'
- titulo: Ejemplo 2
  enunciado: Un terreno real de 12 metros se dibuja en escala 1:300. ¿Cuánto mide en el plano?
  alternativas:
  - 4 cm
  - 40 cm
  - 0,4 cm
  respuesta: 4 cm
  solucion_pasos:
  - 12 por 100 es igual a 1.200 cm; 1.200 dividido entre 300 es igual a 4 cm.
- titulo: Ejemplo 3
  enunciado: Una calle real de 250 metros se dibuja en escala 1:5.000. ¿Cuánto mide en el
    plano?
  alternativas:
  - 5 cm
  - 50 cm
  - 0,5 cm
  respuesta: 5 cm
  solucion_pasos:
  - 250 por 100 es igual a 25.000 cm; 25.000 dividido entre 5.000 es igual a 5 cm.
- titulo: ¿Se debe convertir la medida real a centímetros antes de dividir por el factor de
    la escala?
  respuesta: Sí
  solucion_pasos:
  - Esa conversión evita errores de unidades en el resultado.
errores_frecuentes:
- Dividir los metros sin convertirlos a centímetros (ej. $5/50 = 0.1$ cm).
- Multiplicar en lugar de dividir (obteniendo un plano más grande que la realidad).
- Dividir los metros directamente por E sin convertirlos antes a centímetros.
- Multiplicar en vez de dividir, obteniendo un plano más grande que la realidad.
- Olvidar el factor de conversión al pasar de metros o kilómetros a centímetros.
afirmaciones_verdaderas:
- La propiedad de cálculo de longitud en plano usando escala preserva la consistencia lógica.
- Para calcular la medida en el plano, siempre se debe convertir primero la medida real a
  la misma unidad del plano antes de dividir por E.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de longitud en
  plano usando escala.
