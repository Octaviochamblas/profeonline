resumen_inicial: 'La distancia o longitud dibujada en el plano $d$ se calcula multiplicando
  la distancia real $R$ por el valor numérico de la escala $E$: $d = E \cdot R = \frac{R}{n}$.'
explicacion_simple: Si sabemos la medida de un terreno en la realidad y queremos dibujarlo
  en un plano a escala $1:n$, convertimos la medida real a centímetros y la dividimos
  entre $n$ para saber cuántos centímetros dibujaremos.
explicacion_formal: 'Dada una longitud real $R$ y una escala de reducción $E = \frac{1}{n}$,
  la **Longitud Representada en el Plano $d$** se obtiene mediante:


  $$d = E \cdot R = \frac{R}{n} \quad (d, R \text{ en idéntica unidad})$$


  **Algoritmo de cálculo:**

  1. Convertir $R$ a la unidad deseada para el plano (ej: centímetros).

  2. Dividir la distancia convertida entre el denominador de escala $n$.'
definiciones_clave: '- **Longitud en plano $d$**: Medida en dibujo $d = \frac{R}{n}$.'
propiedades_relaciones: '- **Reducción de escala**: $d = R / n$ para escalas de tipo
  $1 : n$.'
ejemplo_guiado:
  enunciado: 'Calcule cuántos centímetros medirá en un plano a escala $1 : 200$ una
    pared real de $6\text{ metros}$ de largo.'
  pasos:
  - 'Paso 1: Convertir la longitud real a centímetros: $6\text{ m} = 600\text{ cm}$.'
  - 'Paso 2: Aplicar la fórmula $d = \frac{R}{n} = \frac{600}{200} = 3\text{ cm}$.'
  - 'Conclusión: La pared se debe dibujar con un segmento de $3\text{ cm}$ en el plano.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cómo se calcula la longitud d a dibujar en el plano a partir de la longitud
    real R y la escala 1 : n?'
  choices:
  - text: Dividiendo la longitud real (en la misma unidad) entre el factor n (d =
      R / n)
    is_correct: true
  - text: Multiplicando d = R · n
    is_correct: false
  - text: Restando d = n - R
    is_correct: false
  - text: Sumando d = R + n
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo la longitud real (en la misma
    unidad) entre el factor n (d = R / n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para una pared real de 6 m a escala 1 : 200, ¿cuánto
    medirá el dibujo en el plano?'
  choices:
  - text: 3 cm
    is_correct: true
  - text: 12 cm
    is_correct: false
  - text: 30 cm
    is_correct: false
  - text: 0,3 cm
    is_correct: false
  explanation: La alternativa correcta es '3 cm'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la longitud representada
  en el plano $d = \frac{R}{n}$ convirtiendo medidas reales a la escala dada.
semantic_id: MAT.NUM.REPARTO_ESCALAS.LONGITUD_PLANO
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.LONGITUD_PLANO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
