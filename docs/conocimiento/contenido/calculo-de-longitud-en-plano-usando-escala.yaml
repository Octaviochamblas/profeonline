semantic_id: MAT.NUM.REPARTO_ESCALAS.LONGITUD_PLANO
resumen_inicial: 'El cálculo de longitud en el plano o mapa ($d$) determina la medida dibujada dividiendo la medida real $R$ entre el denominador de la escala $N$: $d = \frac{R}{N}$.'
explicacion_simple: |
  Para saber cuántos centímetros mide en un plano o mapa una distancia de la vida real:
  1. Conviertes la medida real a centímetros.
  2. Divides esa cantidad entre el número de la escala (el denominador $N$).
  Por ejemplo, si una calle mide $50\text{ metros}$ en la realidad ($5.000\text{ cm}$) y la vas a dibujar a escala $1 : 500$, la longitud en el plano será $5.000 \div 500 = 10\text{ centímetros}$.
explicacion_formal: |
  ### Definición formal
  Dada una distancia real $R$ y una escala de reducción de la forma $E = \frac{1}{N}$ ($N > 1$), la **longitud representada en el plano $d$** viene dada por la transformación lineal:
  $$d = E \cdot R = \frac{1}{N} \cdot R = \frac{R}{N}$$

  ### Algoritmo de cálculo con conversión de unidades
  1. **Conversión de la dimensión real $R$ a la unidad del plano (habitualmente $\text{cm}$)**:
     - De kilómetros a centímetros: $R_{\text{cm}} = R_{\text{km}} \cdot 100.000$.
     - De metros a centímetros: $R_{\text{cm}} = R_{\text{m}} \cdot 100$.
  2. **División por el factor de escala $N$**:
     $$d_{\text{cm}} = \frac{R_{\text{cm}}}{N}$$

  ### Casos especiales
  - **Escala de ampliación ($N : 1$)**: $d = N \cdot R$.
  - **Cálculo de tolerancia gráfica**: Si $d < 0.2\text{ mm}$, la medida es gráficamente imperceptible en el plano a mano alzada.

  ### Síntesis didáctica
  - Ecuación: $d = \frac{R_{\text{real en cm}}}{N}$.
definiciones_clave: |
  - **Longitud en el plano $d$**: Dimensión representada en la hoja, maqueta o pantalla.
  - **Denominador de escala $N$**: Factor divisor que reduce el tamaño real a dimensiones de dibujo.
  - **Conversión métrica preliminar**: Cambio de unidades ($\text{km} \to \text{m} \to \text{cm}$) imprescindible antes de aplicar la división de escala.
propiedades_relaciones: |
  - **Proporcionalidad inversa con $N$**: A mayor denominador de escala $N$ (mapa más pequeño), menor es la longitud dibujada $d$ para una misma distancia real $R$.
  - **Linealidad estricta**: Duplicar la distancia real $R$ duplica exactamente la medida dibujada $d$ en el plano.
ejemplo_guiado:
  enunciado: 'Una avenida tiene una longitud real de $1.2\text{ kilómetros}$. Calcula cuántos centímetros medirá dicha avenida en un plano confeccionado a escala $1 : 20.000$.'
  pasos:
    - 'Paso 1: Convertimos la medida real de kilómetros a centímetros:\n$$R = 1.2\text{ km} = 1.2 \cdot 100.000 = 120.000\text{ cm}$$'
    - 'Paso 2: Identificamos el denominador de la escala $N = 20.000$.'
    - 'Paso 3: Aplicamos la fórmula de longitud en el plano: $d = \frac{R}{N} = \frac{120.000}{20.000}$.'
    - 'Paso 4: Simplificamos los ceros: $d = \frac{12}{2} = 6\text{ cm}$. La avenida medirá **6 centímetros en el plano**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula la medida en el plano $d$ a partir de la distancia real $R$ expresada en centímetros y la escala $1 : N$?'
    choices:
      - {text: 'Dividiendo la distancia real $R$ entre el denominador de la escala $N$ ($d = \frac{R}{N}$)', is_correct: true}
      - {text: 'Multiplicando la distancia real $R$ por el denominador $N$', is_correct: false}
      - {text: 'Restando el denominador $N$ a la distancia real $R$', is_correct: false}
      - {text: 'Sumando $R$ y $N$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividiendo la distancia real $R$ entre el denominador de la escala $N$ ($d = \frac{R}{N}$)''. La medida reducida es $R / N$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una habitación rectangular mide $6\text{ metros}$ de largo en la realidad. ¿Cuántos centímetros medirá en un plano a escala $1 : 100$?'
    choices:
      - {text: '$6\text{ cm}$, pues $6\text{ m} = 600\text{ cm}$, y $600 \div 100 = 6\text{ cm}$', is_correct: true}
      - {text: '$60\text{ cm}$, multiplicando por 10', is_correct: false}
      - {text: '$0.06\text{ cm}$, dividiendo por 10.000', is_correct: false}
      - {text: '$600\text{ cm}$, sin aplicar la escala', is_correct: false}
    explanation: 'La alternativa correcta es ''$6\text{ cm}$, pues $6\text{ m} = 600\text{ cm}$, y $600 \div 100 = 6\text{ cm}$''. $R = 600\text{ cm} \implies d = 600 / 100 = 6\text{ cm}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Convertir la medida real $R$ a centímetros (multiplicando por 100 si son metros o por 100.000 si son kilómetros).'
  - 'Paso 2: Identificar el denominador de la escala $N$ en el formato $1 : N$.'
  - 'Paso 3: Calcular la dimensión del plano dividiendo $d = \frac{R_{\text{cm}}}{N}$.'
  - 'Paso 4: Expresar la respuesta en centímetros u otra unidad solicitada.'
errores_correccion: |
  - **Error 1:** Dividir la medida real en metros directamente por $N$ sin convertir a centímetros (ej: hacer $6 / 100 = 0.06$ y decir que mide $0.06\text{ cm}$). **Cómo corregirlo:** Pasa **SIEMPRE la medida real a centímetros primero** antes de dividir entre $N$.
  - **Error 2:** Multiplicar la medida real por $N$ al buscar la longitud en el plano. **Cómo corregirlo:** Para pasar de la realidad al dibujo **se DIVIDE por $N$**; para pasar del dibujo a la realidad se multiplica.
ejemplos:
  - titulo: 'Cálculo de largo de muro en plano'
    enunciado: 'Un muro real de $15\text{ metros}$ ($1.500\text{ cm}$) a escala $1 : 50$, ¿mide $30\text{ cm}$ en el plano?'
    alternativas:
      - 'Sí, pues $1.500 / 50 = 30\text{ cm}$'
      - 'No, mide 3 cm'
      - 'No, mide 300 cm'
    respuesta: 'Sí, pues $1.500 / 50 = 30\text{ cm}$'
    solucion_pasos:
      - '1. Conversión: $15\text{ m} = 1.500\text{ cm}$.'
      - '2. División de escala: $d = 1.500 / 50 = 30\text{ cm}$.'
  - titulo: 'Cálculo de distancia entre ciudades en mapa'
    enunciado: 'Una distancia real de $40\text{ km}$ ($4.000.000\text{ cm}$) en un mapa a escala $1 : 500.000$, ¿mide $8\text{ cm}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $d = 4.000.000 / 500.000 = 8\text{ cm}$.'
  - titulo: 'Longitud en plano a escala natural'
    enunciado: 'A escala $1 : 1$, ¿una pieza de $12.5\text{ cm}$ mide exactamente $12.5\text{ cm}$ en el plano?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $d = 12.5 / 1 = 12.5\text{ cm}$.'
  - titulo: 'Variación de la medida en el plano al cambiar la escala'
    enunciado: 'Entre las escalas $1:50$ y $1:100$, ¿el plano a escala $1:50$ muestra un dibujo con el doble de tamaño en cm?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $N$ es la mitad ($50$), $d$ resulta el doble.'
errores_frecuentes:
  - 'La medida real siempre se puede dividir por N sin realizar conversiones previas de unidades.'
  - 'Para obtener la medida en el plano siempre se debe multiplicar la distancia real por el denominador de la escala.'
  - 'El resultado de la división $d = R/N$ entrega directamente la dimensión expresada en metros.'
  - 'La medida dibujada en el plano es mayor que la medida real en una escala de reducción.'
  - 'Invertir la división dividiendo el denominador de la escala $N$ por la medida real.'
afirmaciones_verdaderas:
  - 'La dimensión representada en un plano o mapa se calcula dividiendo la distancia real en cm por el denominador de la escala ($d = \frac{R_{\text{cm}}}{N}$).'
  - 'A menor denominador de escala $N$ (para una misma distancia real), mayor es el tamaño del dibujo obtenido en el plano.'
al_terminar_debes_poder: 'Calcular dimensiones en planos y mapas mediante la fórmula $d = \frac{R}{N}$ realizando conversiones de unidad previas.'
