semantic_id: MAT.NUM.REPARTO_ESCALAS.LONGITUD_PLANO
resumen_inicial: 'Cálculo de longitud en plano usando escala: concepto y propiedades fundamentales
  en Reparto proporcional y escalas.'
explicacion_simple: Si sabes que tu habitación mide 4 metros de largo y quieres dibujarla
  en un plano 1:100, ¿de cuántos centímetros debe ser la línea que traces? Convertir lo real
  a papel es clave en el diseño.
explicacion_formal: 'Al usar la fórmula $\text{Escala} = \frac{\text{Plano}}{\text{Realidad}}$,
  si queremos calcular la medida en el **Plano** despejamos:


  $\text{Plano} = \frac{\text{Realidad}}{E}$

  (donde $E$ es el consecuente de la escala $1:E$).


  **¡Cuidado con las unidades!** Si la realidad está en kilómetros o metros, primero debes
  convertirla a centímetros (la unidad típica del plano) multiplicando por $100.000$ o por
  $100$ respectivamente, y luego hacer la división.'
definiciones_clave: '- **Cálculo de longitud en plano usando escala**: Elemento central dentro
  del estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de longitud en plano usando escala.'
ejemplo_guiado:
  enunciado: Una pared real mide 8 metros. Se dibuja con escala 1:200. ¿Cuánto debe medir
    en el plano?
  pasos:
  - 'Convierto la medida real a centímetros: 8 por 100 es igual a 800 centímetros.'
  - 'Identifico el factor de la escala: E igual a 200.'
  - 'Divido: 800 dividido entre 200 es igual a 4. En el plano medirá 4 centímetros.'
