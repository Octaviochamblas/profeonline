semantic_id: MAT.ALG.FUNCION_CONCEPTOS.PREIMAGEN
resumen_inicial: La preimagen de un valor $y$ es el elemento del dominio $x$ que al ser procesado por la regla de correspondencia produce $y$ como imagen.
explicacion_simple: |
  Buscar una **preimagen** es hacer el camino inverso.

  Si nos dicen que la salida de la función fue $y = 11$ en $f(x) = 2x + 3$, nos preguntamos: "¿Qué valor de $x$ introduje para obtener 11?".

  Resolvemos $2x + 3 = 11 \implies 2x = 8 \implies x = 4$. Por lo tanto, **4 es la preimagen de 11**.
explicacion_formal: |
  Dado un elemento $y_0 \in \text{Rec}(f)$, la **preimagen** (o conjunto de preimágenes) de $y_0$ se define como el conjunto de elementos $x \in \text{Dom}(f)$ tales que:

  $$f(x) = y_0$$

  **Desglose de la fórmula:**
  - $y_0$: Valor conocido en el recorrido (salida).
  - $x$: Valor incógnita en el dominio (entrada) obtenido al resolver la ecuación $f(x) = y_0$.
definiciones_clave: |
  - **Preimagen**: Elemento del conjunto de partida que genera una imagen determinada al ser evaluado en la función.
propiedades_relaciones: |
  - **No necesidad de unicidad de la preimagen**: Un mismo valor de imagen $y_0$ puede tener múltiples preimágenes distintas (por ejemplo $y = 9$ en $f(x) = x^2$ tiene preimágenes $x = 3$ y $x = -3$).
ejemplo_guiado:
  enunciado: Dada la función $f(x) = 4x - 7$, encuentra la preimagen de $y = 13$.
  pasos:
    - 'Paso 1: Igualar la regla de correspondencia al valor dado de la imagen: $4x - 7 = 13$.'
    - 'Paso 2: Sumar 7 en ambos miembros: $4x = 13 + 7 \implies 4x = 20$.'
    - 'Paso 3: Dividir entre 4: $x = \frac{20}{4} = 5$.'
    - 'Paso 4: Concluir que la preimagen de $13$ es $x = 5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es la preimagen de $y = 13$ bajo la función $f(x) = 4x - 7$?
    choices:
      - {text: '$x = 5$', is_correct: true}
      - {text: '$x = 45$', is_correct: false}
      - {text: '$x = 3/2$', is_correct: false}
      - {text: '$x = 20$', is_correct: false}
    explanation: La alternativa correcta es '$x = 5$'. $4(5) - 7 = 13$.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: Dada la función $f(x) = x^2$, ¿cuáles son las preimágenes del valor $y = 16$?
    choices:
      - {text: '$x = 4$ y $x = -4$', is_correct: true}
      - {text: 'Solo $x = 4$', is_correct: false}
      - {text: '$x = 256$', is_correct: false}
      - {text: 'No tiene preimágenes.', is_correct: false}
    explanation: La alternativa correcta es '$x = 4$ y $x = -4$'. Ambos al cuadrado resultan en 16.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el valor de la imagen $y = b$.'
  - 'Paso 2: Plantear la ecuación $f(x) = b$.'
  - 'Paso 3: Despejar la variable $x$ mediante operaciones algebraicas equivalentes.'
  - 'Paso 4: Declarar las soluciones obtenidas como las preimágenes de $b$.'
errores_correccion: |
  - **Error común:** Reemplazar el valor $y$ en la variable $x$ de la función para "evaluar la preimagen".
  - **Cómo corregirlo:** Para hallar la preimagen no se evalúa $x$; se IGUALA toda la función al valor $y$ y se despeja $x$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La preimagen de $y = 7$ en $f(x) = 2x + 1$ es el resultado $f(7) = 15$.'
  - 'Una preimagen es el valor de salida obtenido al evaluar la función en el codominio.'
  - 'Todo elemento del codominio posee exactamente una única preimagen en el dominio.'
  - 'Determinar la preimagen de $b$ exige calcular $f(b)$ mediante sustitución directa.'
  - 'La preimagen de un valor no puede ser un número negativo o nulo.'
afirmaciones_verdaderas:
  - 'La preimagen de un valor $y$ en el recorrido es aquel elemento $x$ del dominio tal que $f(x) = y$.'
  - 'Determinar la preimagen de un valor exige resolver la ecuación $f(x) = y$ para despejar $x$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular la preimagen de un valor dado en el recorrido de una función.
  CÓMO: Igualar la regla de asignación al valor de la imagen $f(x) = y$, despejar la variable $x$ y verificar su pertenencia al dominio.
