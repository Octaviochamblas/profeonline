semantic_id: MAT.ALG.FUNCION_CONCEPTOS.PREIMAGEN
resumen_inicial: La preimagen de un valor $y$ es cualquier elemento $x$ del dominio que al evaluarse en la función produce dicho valor $y$.
explicacion_simple: '![La preimagen de un valor $y$ es cualquier elemento $x$ del dominio que al evaluarse en la función produce dicho valor $y$](/static/img/nodos/concepto-de-preimagen-de-una-funcion-intro.svg)



  Si la función es una máquina que transforma entradas en salidas:

  - La **salida** es la imagen.

  - La **entrada original** que produjo esa salida es la **preimagen**.


  Para hallar la preimagen de un número conocido $y_0$, no evaluamos la función en $y_0$, sino que **resolvemos la ecuación $f(x) = y_0$** para despejar el valor de $x$.'
explicacion_formal: 'Sea $f: A \to B$ y sea $b \in B$. Se dice que $a \in A$ es una **preimagen** de $b$ bajo $f$ si y solo si:

  $$f(a) = b$$


  **Propiedades de las preimágenes:**

  - El conjunto de todas las preimágenes de un valor $b$ se denota $f^{-1}(\{b\}) = \{x \in A \mid f(x) = b\}$.

  - Un elemento del codominio puede tener exactamente una preimagen (función inyectiva), múltiples preimágenes (ej: $f(x) = x^2$ para $y = 9$ tiene preimágenes $3$ y $-3$), o ninguna preimagen si $b \notin \text{Rec}(f)$.'
definiciones_clave: '- **Preimagen**: Elemento del dominio que origina una imagen determinada.

  - **Ecuación de preimagen**: Igualdad $f(x) = b$ cuya resolución permite encontrar los valores de $x$.'
propiedades_relaciones: '- **Ubicación**: Las preimágenes pertenecen siempre al dominio (eje $X$).

  - **Multiplicidad**: Una imagen puede tener varias preimágenes, pero cada preimagen solo puede tener una imagen.'
ejemplo_guiado:
  enunciado: '![Ejemplo La preimagen de un valor $y$ es cualquier elemento $x$ del dominio que al evaluarse en la función produce dicho valor $y$](/static/img/nodos/concepto-de-preimagen-de-una-funcion-ejemplos.svg)



    Dada la función cuadrática $f(x) = x^2 - 4$, determina las preimágenes de $12$.'
  pasos:
  - 'Paso 1: Plantear la ecuación $f(x) = 12$.'
  - 'Paso 2: Sustituir la fórmula de la función: $x^2 - 4 = 12$.'
  - 'Paso 3: Sumar 4 a ambos lados: $x^2 = 16$.'
  - 'Paso 4: Extraer raíz cuadrada recordando considerar ambas soluciones: $x = \pm \sqrt{16} = \pm 4$.'
  - 'Paso 5: Concluir que $12$ tiene dos preimágenes: $4$ y $-4$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $f(x) = 5x - 3$, ¿cuál es la preimagen de 17?
  choices:
  - text: '4'
    is_correct: true
  - text: '82'
    is_correct: false
  - text: '14'
    is_correct: false
  - text: '3.5'
    is_correct: false
  explanation: La alternativa correcta es '4'. Se resuelve $5x - 3 = 17 \implies 5x = 20 \implies x = 4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función $g(x) = x^2$, ¿cuántas preimágenes reales tiene el número -9?
  choices:
  - text: Ninguna, porque ningún número real al cuadrado da un resultado negativo.
    is_correct: true
  - text: 'Dos preimágenes: 3 y -3.'
    is_correct: false
  - text: 'Una preimagen: -3.'
    is_correct: false
  - text: Infinitas preimágenes.
    is_correct: false
  explanation: La alternativa correcta es 'Ninguna, porque ningún número real al cuadrado da un resultado negativo.'. La ecuación $x^2 = -9$ no tiene solución en $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor de la imagen $y_0$ dada en el enunciado.'
- 'Paso 2: Igualar la regla de asignación a dicho valor: $f(x) = y_0$.'
- 'Paso 3: Resolver la ecuación resultante despejando la incógnita $x$.'
- 'Paso 4: Verificar que las soluciones encontradas pertenezcan al dominio de la función.'
errores_correccion: '- **Error común:** Calcular $f(y_0)$ en vez de resolver $f(x) = y_0$.

  - **Cómo corregirlo:** Si piden ''la preimagen de $10$'', el $10$ es el resultado ($y$), por lo que debes resolver $f(x) = 10$, no sustituir $x$ por $10$.'
ejemplos:
- titulo: 'Ejemplo 1: Función lineal'
  enunciado: Halla la preimagen de $-1$ en la función $f(x) = 2x + 7$.
  alternativas:
  - '-4'
  - '5'
  - '-3'
  - '3'
  respuesta: '-4'
  solucion_pasos:
  - 'Paso 1: Plantear $2x + 7 = -1$.'
  - 'Paso 2: Despejar $x$: $2x = -8 \implies x = -4$.'
- titulo: 'Ejemplo 2: Raíz cuadrada'
  enunciado: ¿Cuál es la preimagen de $5$ en $g(x) = \sqrt{x + 9}$?
  alternativas:
  - '16'
  - '4'
  - '25'
  - '34'
  respuesta: '16'
  solucion_pasos:
  - 'Paso 1: Plantear $\sqrt{x + 9} = 5$.'
  - 'Paso 2: Elevar al cuadrado: $x + 9 = 25 \implies x = 16$.'
- titulo: 'Ejemplo 3: Preimágenes múltiples'
  enunciado: Determina todas las preimágenes de $0$ en $f(x) = x^2 - 25$.
  alternativas:
  - 5 y -5
  - Solo 5
  - Solo -5
  - 0 y 25
  respuesta: 5 y -5
  solucion_pasos:
  - 'Paso 1: Resolver $x^2 - 25 = 0 \implies x^2 = 25$.'
  - 'Paso 2: Las preimágenes son $x = 5$ y $x = -5$.'
- titulo: 'Ejemplo 4: Sin preimagen real'
  enunciado: Si $f(x) = |x| + 3$, ¿cuál es la preimagen de $1$?
  alternativas:
  - No existe preimagen real
  - -2 y 2
  - '-4'
  - '4'
  respuesta: No existe preimagen real
  solucion_pasos:
  - 'Paso 1: Plantear $|x| + 3 = 1 \implies |x| = -2$.'
  - 'Paso 2: El valor absoluto no puede ser negativo, por lo que no existe preimagen real.'
errores_frecuentes:
- Evaluar f(k) creyendo que se está calculando la preimagen de k.
- Omitir la raíz negativa al despejar ecuaciones cuadráticas de preimagen.
- Asumir que todo valor del codominio debe tener obligatoriamente una preimagen.
afirmaciones_verdaderas:
- Calcular la preimagen de un valor y consiste en resolver la ecuación f(x) = y para hallar x.
- Un valor de salida puede tener más de una preimagen en el dominio.
al_terminar_debes_poder: '**QUÉ:** Comprender y calcular preimágenes de funciones algebraicas.


  **CÓMO:** Planteando y resolviendo la ecuación $f(x) = y$ para determinar los valores de entrada correspondientes en el dominio.


  ![Resumen La preimagen de un valor $y$ es cualquier elemento $x$ del dominio que al evaluarse en la función produce dicho valor $y$](/static/img/nodos/concepto-de-preimagen-de-una-funcion-resumen.svg)'
