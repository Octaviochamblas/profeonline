semantic_id: MAT.ALG.FUNCION_CONCEPTOS.PREIMAGEN
resumen_inicial: 'Concepto de preimagen de una función: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: Si la imagen es "lo que sale", la preimagen es "lo que entró para
  producir ese resultado". A diferencia de la imagen, un valor puede tener varias
  preimágenes.
explicacion_formal: '### Definición formal


  Para $f\colon A \to B$ y $y \in B$, la preimagen de $y$ se define como $f^{-1}(\{y\})
  = \{x \in A \colon f(x) = y\}$. A diferencia de la imagen de un elemento (que es
  única por definición de función), la preimagen de un valor puede contener cero,
  uno o varios elementos.


  ### Desarrollo didáctico


  Buscar la preimagen de $y_0$ equivale a resolver la ecuación $f(x) = y_0$ para la
  variable $x$.


  Si $f(x) = x^2$ y buscas la preimagen de $9$, resuelves $x^2 = 9$, obteniendo $x
  = 3$ y $x = -3$: ambos valores son preimágenes de $9$. En cambio, la preimagen de
  $-9$ es el conjunto vacío, porque ningún real al cuadrado da un número negativo.'
definiciones_clave: '- **Concepto de preimagen de una función**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a concepto de preimagen de una función.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a concepto de preimagen
    de una función.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a concepto de preimagen de una función.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
