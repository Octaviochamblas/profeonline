semantic_id: MAT.ALG.FUNCION_CONCEPTOS.PREIMAGEN
resumen_inicial: Una preimagen es un valor de entrada $x$ perteneciente al dominio
  que produce una imagen específica $y = f(x)$.
explicacion_simple: 'Una **preimagen** es el valor original $x$ que entró a la función.

  Si sabemos que la salida es $y = 10$ para la función $f(x) = 2x$, para encontrar
  la preimagen nos preguntamos: ''¿qué número $x$ al multiplicarlo por $2$ me da $10$?''.

  Igualamos $2x = 10$ y despejamos $x = 5$. El número $5$ es la preimagen de $10$.'
explicacion_formal: 'Dada una función $f: A \to B$ y un valor de imagen $y_0 \in B$,
  la **preimagen o conjunto preimagen** $f^{-1}(\{y_0\})$ se define como:


  $$x_0 \in A \text{ es preimagen de } y_0 \iff f(x_0) = y_0$$


  **Desglose de la fórmula:**

  - Proceso inverso de evaluación donde la variable desconocida es el argumento de
  entrada $x_0$.'
definiciones_clave: '- **Preimagen ($x$)**: Elemento del dominio cuya evaluación en
  la función genera una imagen determinada.

  - **Búsqueda de preimagen**: Resolución de la ecuación $f(x) = y_0$ para hallar
  la variable de entrada.'
propiedades_relaciones: '- **Ubicación cartesiana**: Las preimágenes corresponden
  a las coordenadas en el eje horizontal $X$.'
ejemplo_guiado:
  enunciado: Dada la función $f(x) = 3x - 4$, halla la preimagen correspondiente a
    la imagen $y = 11$.
  pasos:
  - 'Paso 1: Igualar la fórmula de la función al valor de la imagen dada: $3x - 4
    = 11$.Paso 2: Trasponer el $-4$ sumando al segundo miembro: $3x = 11 + 4 \implies
    3x = 15$.Paso 3: Trasponer el $3$ dividiendo: $x = \frac{15}{3} \implies x = 5$.Paso
    4: Concluir que la preimagen de $11$ es $x = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al buscar la preimagen de $y = 11$ para la función $f(x) = 3x - 4$, ¿cuál
    es el valor de $x$ obtenido?
  choices:
  - text: $x = 5$
    is_correct: true
  - text: $x = 29$
    is_correct: false
  - text: $x = 3$
    is_correct: false
  - text: $x = 15$
    is_correct: false
  explanation: La alternativa correcta es '$x = 5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué eje de coordenadas corresponden los valores de las preimágenes
    en el plano cartesiano?
  choices:
  - text: Al eje horizontal $X$ (abscisas).
    is_correct: true
  - text: Al eje vertical $Y$ (ordenadas).
    is_correct: false
  - text: Al origen de coordenadas exclusivamente.
    is_correct: false
  - text: Al eje Z tridimensional.
    is_correct: false
  explanation: La alternativa correcta es 'Al eje horizontal $X$ (abscisas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor numérico de la imagen dada $y_0$.'
- 'Paso 2: Plantear la ecuación $f(x) = y_0$.'
- 'Paso 3: Resolver la ecuación despejando la incógnita $x$.'
- 'Paso 4: Declarar $x$ como la preimagen de $y_0$.'
errores_correccion: '- **Error común:** Reemplazar el $11$ en la $x$ (calcular $f(11)$
  en vez de despejar $x$).

  - **Cómo corregirlo:** Si te piden la PREIMAGEN de $11$, $11$ es la salida $y$;
  debes igualar la función a $11$ y despejar $x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
