semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.POLIGONOS_LADOS_PROPORCIONALES
resumen_inicial: 'Proporcionalidad de lados correspondientes en polígonos semejantes:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: La segunda condición que define la semejanza de polígonos, junto
  a la igualdad de ángulos, es que todos los lados correspondientes guarden la misma
  proporción entre sí.
explicacion_formal: '![Lados proporcionales en polígonos semejantes](/static/img/geometria/congruencia-semejanza/semejanza-poligonos-lados-proporcionales.svg)


  ### Definición formal


  Si los polígonos $P_1P_2...P_n$ y $P_1''P_2''...P_n'' son semejantes, entonces $\frac{P_1P_2}{P_1''''P_2''''$}$=\frac{P_2P_3}{P_2''P_3''}=...=\frac{P_nP_1}{P_n''P_1''}$,
  siendo esta razón constante la razón de semejanza.


  ### Desarrollo didáctico


  A diferencia de solo tener "algunos" lados proporcionales, la condición exige que
  TODOS los pares de lados correspondientes mantengan exactamente la misma razón;
  si un solo par no la mantiene, los polígonos no son semejantes.'
definiciones_clave: '- **Proporcionalidad de lados correspondientes en polígonos semejantes**:
