- titulo: ¿Se cumple siempre la propiedad principal de proporcionalidad de lados correspondientes
    en polígonos semejantes en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede proporcionalidad de lados correspondientes en polígonos semejantes
