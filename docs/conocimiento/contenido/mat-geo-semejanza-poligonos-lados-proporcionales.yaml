ejemplo_guiado:
  enunciado: Para analizar proporcionalidad de lados correspondientes en polígonos
    semejantes, considera un ángulo $\alpha = 32^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1283^\circ = 32^\circ$.
  pasos:
  - Identificar la propiedad de proporcionalidad de lados correspondientes en polígonos
    semejantes referida a $\alpha = 32^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1283 = 32 \implies x = 32 - 1283$.'
  - Concluir que la medida calculada para proporcionalidad de lados correspondientes
    en polígonos semejantes es $x = -1251^\circ$.
