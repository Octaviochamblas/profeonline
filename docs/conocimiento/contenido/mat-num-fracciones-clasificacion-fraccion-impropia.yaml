semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_IMPROPIA
resumen_inicial: Una fracción impropia es aquella en la que el numerador es mayor
  o igual que el denominador ($|a| \ge |b|$), representando un valor mayor o igual
  que la unidad ($|\frac{a}{b}| \ge 1$).
explicacion_simple: Una fracción impropia ocurre cuando tomamos una cantidad igual
  o mayor de partes que las que componen un solo entero. Esto significa que necesitamos
  completar uno o más enteros completos para representarla, por lo que el número de
  arriba es igual o más grande que el número de abajo.
explicacion_formal: 'Para un racional $q = \frac{a}{b}$ con $a, b \in \mathbb{Z}$
  y $b \neq 0$, se define como **Fracción Impropia** si sus valores absolutos cumplen
  la desigualdad:


  $$|a| \ge |b| \iff \left| \frac{a}{b} \right| \ge 1$$


  **Desglose de la fórmula:**

  - $|a| \ge |b|$: El numerador contiene al menos una vez completa al denominador.

  - $|q| \ge 1$: La magnitud de la fracción es igual o superior a la unidad.


  > **Complemento didáctico:** Toda fracción impropia no entera se puede transformar
  unívocamente en un número mixto compuesto por una parte entera y una fracción propia.'
definiciones_clave: '- **Fracción impropia**: Fracción con $|a| \ge |b|$ cuyo valor
  absoluto es mayor o igual a 1.'
propiedades_relaciones: '- **Conversión a mixto**: Si $a = b \cdot C + r$, entonces
  $\frac{a}{b} = C + \frac{r}{b}$.'
ejemplo_guiado:
  enunciado: Verifique si la fracción $\frac{11}{4}$ es una fracción impropia y exprésela
    en forma decimal.
  pasos:
  - 'Paso 1: Comparar numerador ($11$) y denominador ($4$): $11 \ge 4$.'
  - 'Paso 2: Como $11 > 4$, la fracción es una fracción impropia.'
  - 'Paso 3: Calcular su división decimal: $11 : 4 = 2,75$.'
  - 'Paso 4: Comprobar que $2,75 \ge 1$.'
  - 'Conclusión: $\frac{11}{4}$ es una fracción impropia de valor $2,75$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación cumplen el numerador y denominador en una fracción impropia?
  choices:
  - text: '|a| >= |b| (numerador mayor o igual que el denominador)'
    is_correct: true
  - text: '|a| < |b| (numerador menor que el denominador)'
    is_correct: false
  - text: El denominador es siempre cero
    is_correct: false
  - text: El numerador es siempre cero
    is_correct: false
  explanation: La alternativa correcta es '|a| >= |b| (numerador mayor o igual que
    el denominador)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 11/4, ¿por qué es una fracción impropia?
  choices:
  - text: Porque el numerador 11 es mayor que el denominador 4 y equivale a 2,75 >=
      1
    is_correct: true
  - text: Porque 11 es impar
    is_correct: false
  - text: Porque 4 es par
    is_correct: false
  - text: Es una fracción propia
    is_correct: false
  explanation: La alternativa correcta es 'Porque el numerador 11 es mayor que el
    denominador 4 y equivale a 2,75 >= 1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar los valores absolutos del numerador y del denominador.'
- 'Paso 2: Comprobar si $|a| \ge |b|$.'
- 'Paso 3: Declarar que es una fracción impropia si el numerador iguala o supera al
  denominador.'
errores_correccion: '- **Error 1: Considerar que $\frac{5}{5}$ es una fracción propia.**
  **Cómo corregirlo:** Como el numerador iguala al denominador ($5 = 5$), es impropia
  (y aparente igual a 1).


  - **Error 2: Pensar que una fracción impropia representa una porción de una sola
  unidad.** **Cómo corregirlo:** Representa una cantidad mayor o igual a una unidad
  entera completa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes expresiones es una fracción impropia?
  alternativas:
  - 8/3
  - 2/5
  - 1/9
  respuesta: 8/3
  solucion_pasos:
  - 8/3 tiene numerador 8 mayor que denominador 3 ($8 > 3$).
- titulo: Ejemplo 2
  enunciado: ¿Es la fracción 7/7 una fracción impropia?
  alternativas:
  - Sí, porque el numerador es igual al denominador (7 >= 7)
  - No, es propia
  - No es una fracción
  respuesta: Sí, porque el numerador es igual al denominador (7 >= 7)
  solucion_pasos:
  - Toda fracción con $|a| \ge |b|$ es impropia, incluyendo $7/7 = 1$.
- titulo: ¿Toda fracción impropia tiene un valor mayor o igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|a/b| \ge 1$ por definición.
- titulo: ¿Es 3/10 una fracción impropia?
  respuesta: 'No'
  solucion_pasos:
  - No, 3 es menor que 10 por lo que es una fracción propia.
errores_frecuentes:
- Una fracción impropia representa un valor estrictamente menor que la unidad.
- El numerador de una fracción impropia debe ser siempre un número entero menor que
  el denominador.
- Las fracciones de la forma $a/a$ con $a > 0$ se clasifican como fracciones propias.
- Una fracción impropia no se puede convertir en un número mixto.
- Dividir el numerador por el denominador en una fracción impropia resulta en un decimal
  que empieza por 0.
afirmaciones_verdaderas:
- Una fracción impropia tiene un numerador mayor o igual que su denominador en valor
  absoluto.
- Toda fracción impropia se puede representar como un número entero o como un número
  mixto.
al_terminar_debes_poder: Al terminar serás capaz de identificar fracciones impropias,
  verificando que el numerador iguale o supere al denominador ($|a| \ge |b|$) y su
  valor sea mayor o igual a 1.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
