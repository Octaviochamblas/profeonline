semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.FRACCION_IMPROPIA
resumen_inicial: Una fracción impropia es aquella cuyo numerador es estrictamente
  mayor que su denominador, representando una cantidad mayor que la unidad entera.
explicacion_simple: 'Imagina que compras pizzas divididas en 4 rebanadas iguales.
  Si en una fiesta se comen 9 rebanadas, la fracción de pizza consumida es $\frac{9}{4}$.
  Como comiste más de las 4 rebanadas de una sola pizza, tuviste que abrir más de
  una caja (te comiste 2 pizzas enteras y 1 rebanada más). Eso es una fracción impropia:
  cuando el número de arriba es más grande que el de abajo y por lo tanto representas
  más de 1 entero.

  '
explicacion_formal: 'Formalmente, una fracción $\frac{a}{b}$ con $a, b \in \mathbb{Z}^+$
  se clasifica como **fracción impropia** si el numerador es estrictamente mayor que
  el denominador:

  $$a > b$$


  En términos cuantitativos y geométricos, el valor de una fracción impropia positiva
  es estrictamente mayor que la unidad ($1$):

  $\frac{a}{b} > 1$

  Toda fracción impropia puede descomponerse de forma única en la suma de una parte
  entera $q \in \mathbb{Z}^+$ y una parte fraccionaria propia $\frac{r}{b}$ (con $0
  \le r < b$), dando origen a la representación como **número mixto**:

  $\frac{a}{b} = q + \frac{r}{b} = q$\frac{r}{b}$

  '
definiciones_clave: '- **Fracción impropia**: Fracción positivo-positiva en la que
  el numerador es estrictamente mayor que el denominador ($a > b$).

  - **Exceso sobre la unidad**: Propiedad numérica por la cual $\frac{a}{b} > 1$.

  - **Conversión a número mixto**: Descomposición mediante división entera $a = b
  \cdot q + r$ para expresar $\frac{a}{b}$ como $q\frac{r}{b}$.

  '
propiedades_relaciones: '- **Ubicación en la recta**: Toda fracción impropia positiva
  se posiciona estrictamente a la derecha del $1$ en la recta numérica ($]1, +\infty[$).

  - **Equivalencia a número mixto**: Toda fracción impropia que no sea múltiplo exacto
  del denominador equivale a un número mixto con parte entera no nula.

  - **Comportamiento ante potencias**: Al elevar una fracción impropia a un exponente
  entero $n > 1$, la potencia resultante es mayor que la base original ($\left(\frac{a}{b}\right)^n
  > \frac{a}{b}$).

  '
ejemplo_guiado:
  enunciado: Analiza la expresión $\frac{11}{4}$. Confirma si es una fracción impropia,
    determina cuántos enteros completos contiene y exprésala como número mixto.
  pasos:
  - 'Comparar numerador y denominador: $a = 11$ y $b = 4$. Como $11 > 4$, la fracción
    es impropia.'
  - 'Efectuar la división entera de $11$ entre $4$: $11 \div 4 = 2$ con residuo $3$
    ($11 = 4 \cdot 2 + 3$).'
  - 'Identificar la parte entera y la parte fraccionaria: el cociente $2$ es la parte
    entera y el residuo $3$ forma la fracción propia $\frac{3}{4}$.'
  - 'Escribir como número mixto: $\frac{11}{4} = 2\frac{3}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación numérica debe cumplirse entre el numerador $a$ y el denominador
    $b$ ($a,b > 0$) para que la fracción $\frac{a}{b}$ sea impropia?
  choices:
  - text: El numerador debe ser estrictamente mayor que el denominador ($a > b$),
      haciendo que $\frac{a}{b} > 1$.
    is_correct: true
  - text: El numerador debe ser menor que el denominador ($a < b$).
    is_correct: false
  - text: El numerador y el denominador deben ser iguales ($a = b$).
    is_correct: false
  - text: El denominador debe ser igual a cero ($b = 0$).
    is_correct: false
  explanation: 'La correcta es El numerador debe ser estrictamente mayor que el denominador
    ($a > b$), haciendo que $\frac{a}{b} > 1$.: es la condición que caracteriza a
    las fracciones impropias.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al convertir la fracción impropia $\frac{17}{5}$ en número mixto, ¿cuál
    es el resultado correcto?
  choices:
  - text: 3\$\frac{2}{5}$
    is_correct: true
  - text: 5\$\frac{2}{3}$
    is_correct: false
  - text: 2\$\frac{3}{5}$
    is_correct: false
  - text: 3\$\frac{5}{2}$
    is_correct: false
  explanation: 'La alternativa correcta es: 3\$\frac{2}{5}$. La correcta es 3\frac{2}{5}:
    al dividir $17 \div 5$, el cociente entero es $3$ y el residuo es $2$, formando
    $3\frac{2}{5}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador $a$ y el denominador $b$.'
- 'Paso 2: Comparar ambos términos y comprobar si $a > b$.'
- 'Paso 3: Para pasar a número mixto, dividir $a$ entre $b$ obteniendo cociente $q$
  y residuo $r$.'
- 'Paso 4: Escribir la representación mixta $q\frac{r}{b}$.'
errores_correccion: 'Un error frecuente es colocar el residuo como parte entera al
  convertir a número mixto. Recuerda siempre que el **cociente** de la división es
  la cantidad de enteros completos, mientras que el **residuo** es el nuevo numerador
  de la fracción propia remanente.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes expresiones corresponde a una fracción impropia?
  alternativas:
  - \$\frac{7}{3}$
  - \$\frac{3}{7}$
  - \$\frac{3}{3}$
  respuesta: \$\frac{7}{3}$
  solucion_pasos:
  - En $\frac{7}{3}$, el numerador 7 es estrictamente mayor que el denominador 3 ($7
    > 3$).
  - Por lo tanto, representa más de 2 enteros completos y es una fracción impropia.
- titulo: Ejemplo 2
  enunciado: Se preparan recipientes de jugo de $\frac{1}{2}$ litro cada uno. Si se
    tienen 15 de estos recipientes, ¿qué fracción de litro representa y cómo se expresa
    en enteros?
  alternativas:
  - Representa \$\frac{15}{2}$ litros y equivale a 7\$\frac{1}{2}$ litros.
  - Representa \$\frac{2}{15}$ litros y equivale a menos de 1 litro.
  - Representa \$\frac{15}{15}$ litros y equivale a 1 litro.
  respuesta: Representa \$\frac{15}{2}$ litros y equivale a 7\$\frac{1}{2}$ litros.
  solucion_pasos:
  - La cantidad total es $15 \cdot \frac{1}{2} = \frac{15}{2}$ litros.
  - Como $15 > 2$, dividimos $15 \div 2 = 7$ con residuo $1$, obteniendo $7\frac{1}{2}$
    litros.
- titulo: ¿Toda fracción impropia positiva es estrictamente mayor que 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, al ser $a > b$, la división $a \div b$ resulta en un valor mayor que $1$.
- titulo: ¿Se puede transformar cualquier fracción impropia en un número mixto?
  respuesta: Sí
  solucion_pasos:
  - Sí (salvo cuando es un entero exacto o fracción aparente, donde el residuo es
    0 y queda como un entero puro).
errores_frecuentes:
- Confundir fracción impropia con fracción propia invirtiendo la condición de desigualdad.
- Invertir el cociente y el residuo al expresar la fracción impropia como número mixto.
- Creer que una fracción impropia es un error de escritura y que siempre debe reducirse
  obligatoriamente.
- Asumir que si el numerador supera por 1 al denominador (como $\frac{6}{5}$), ya
  se trata de 2 enteros.
- Olvidar mantener el mismo denominador al pasar de fracción impropia a número mixto.
afirmaciones_verdaderas:
- Una fracción impropia positiva tiene un numerador estrictamente mayor que su denominador
  ($a > b$).
- Cualquier fracción impropia positiva representa una cantidad cuantitativamente mayor
  que $1$.
al_terminar_debes_poder: 'Debes ser capaz de reconocer una fracción impropia $\frac{a}{b}$,
  justificar la condición $a > b$ y realizar la conversión fluida entre fracción impropia
  y número mixto.

  '
