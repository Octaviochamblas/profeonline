semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_NUMEROS
resumen_inicial: La resolución de problemas numéricos plantea ecuaciones cuadráticas a partir de relaciones entre enteros, cuadrados, números consecutivos y cocientes.
explicacion_simple: |
  En los problemas numéricos de acertijos o enunciados algebraicos:

  - **Ejemplo**: "Busca un número entero positivo cuyo cuadrado más su doble sea igual a 35".
  - **Paso 1**: Defase la incógnita: sea $x$ el número buscado.
  - **Paso 2**: Traduces el enunciado:
    $$x^2 + 2x = 35 \implies x^2 + 2x - 35 = 0$$
  - **Paso 3**: Resuelves la ecuación cuadrática:
    $$(x + 7)(x - 5) = 0 \implies x_1 = -7 \quad \text{y} \quad x_2 = 5$$
  - **Paso 4**: Como el problema pedía específicamente un **entero positivo**, seleccionas $x = 5$ y descartas el $-7$.
explicacion_formal: |
  Sea el problema de encontrar uno o más números en un subconjunto numérico $\mathbb{Z}, \mathbb{N}$ o $\mathbb{Q}$ que satisfacen un operador no lineal. La **reducción a ecuación de segundo grado** plantea la forma canónica:

  $$P(x) = ax^2 + bx + c = 0$$

  **Criterio de pertenencia al conjunto numérico:**
  Las raíces $x_1, x_2$ obtenidas de la resolución formal deben ser evaluadas contra las restricciones numéricas impuestas en la premisa (ej. $x \in \mathbb{Z}^+$, $x \in \mathbb{N}$ o números impares consecutivos $2k+1$).
definiciones_clave: |
  - **Problemas numéricos cuadráticos**: Situaciones algebraicas abstractas centradas en propiedades puras de los números (cuadrados, productos, inversos aditivos/multiplicativos).
propiedades_relaciones: |
  - **Consecutivos de distinta paridad**: Dos enteros consecutivos cualesquiera se representan por $n$ y $n+1$; dos pares consecutivos por $2n$ y $2n+2$; dos impares consecutivos por $2n+1$ y $2n+3$.
ejemplo_guiado:
  enunciado: 'Halla dos números enteros consecutivos cuyo producto sea igual a 132.'
  pasos:
    - 'Paso 1: Plantear los números como $x$ y $x + 1$.'
    - 'Paso 2: Formular el producto: $x(x + 1) = 132 \implies x^2 + x - 132 = 0$.'
    - 'Paso 3: Factorizar: $(x + 12)(x - 11) = 0 \implies x_1 = -12$ y $x_2 = 11$.'
    - 'Paso 4: Dar las dos parejas de soluciones válidas en los enteros: los pares $(-12, -11)$ o $(11, 12)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué pareja de números enteros impares positivos consecutivos cumple que su producto es 63?'
    choices:
      - {text: 'Los números 7 y 9.', is_correct: true}
      - {text: 'Los números 3 y 21.', is_correct: false}
      - {text: 'Los números -7 y -9.', is_correct: false}
      - {text: 'Los números 1 y 63.', is_correct: false}
    explanation: 'La alternativa correcta es ''Los números 7 y 9.''. Se plantea $x(x+2) = 63 \implies x^2+2x-63=0 \implies (x+9)(x-7)=0 \implies x=7$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'La suma de un número con su inverso multiplicativo es $10/3$. ¿Cuál es la ecuación cuadrática reducida que determina dicho número $x$?'
    choices:
      - {text: '$3x^2 - 10x + 3 = 0$', is_correct: true}
      - {text: '$x^2 + x - 10 = 0$', is_correct: false}
      - {text: '$3x^2 + 10x - 3 = 0$', is_correct: false}
      - {text: '$x^2 - 10x + 3 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3x^2 - 10x + 3 = 0$''. Se plantea $x + \frac{1}{x} = \frac{10}{3} \implies \frac{x^2+1}{x} = \frac{10}{3} \implies 3x^2 - 10x + 3 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Definir la variable $x$ y representar los números involucrados según sus propiedades (consecutivos, pares, etc.).'
  - 'Paso 2: Formular la igualdad según la relación dada en el problema y desarrollar los productos o fracciones.'
  - 'Paso 3: Transponer todos los términos obteniendo la forma estándar $ax^2 + bx + c = 0$.'
  - 'Paso 4: Resolver la cuadrática y validar las raíces según la restricción del conjunto numérico ($\mathbb{Z}^+, \mathbb{N}, \mathbb{Q}$).'
errores_correccion: |
  - **Error común:** Asumir que "enteros consecutivos" solo pueden ser positivos y descartar la pareja de enteros negativos.
  - **Cómo corregirlo:** El conjunto de los números enteros $\mathbb{Z}$ **INCLUYE VALORES NEGATIVOS**; si el problema pide "enteros" sin especificar positivos, ambas parejas son respuestas válidas.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Producto de enteros consecutivos.
    alternativas:
      - '$(-10, -9)$ y $(9, 10)$'
      - 'Solo $(9, 10)$'
      - '$(-9, 10)$'
    respuesta: '$(-10, -9)$ y $(9, 10)$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Inverso multiplicativo.
    alternativas:
      - '$x = 2$ o $x = 1/2$'
      - '$x = 5$'
      - '$x = -2$'
    respuesta: '$x = 2$ o $x = 1/2$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Descartar arbitrariamente soluciones enteras negativas cuando el problema pide "enteros" en general sin restringir a positivos.'
  - 'Expresar impares consecutivos como $x$ y $x+1$ en lugar de utilizar un salto de dos unidades $x$ y $x+2$.'
  - 'La falta de multiplicación por la variable $x$ al trabajar con inversos multiplicativos $1/x$.'
  - 'La equiparación del inverso aditivo de un número $-x$ con su inverso multiplicativo $1/x$.'
  - 'Aceptar soluciones decimales cuando el problema exige estrictamente números enteros.'
afirmaciones_verdaderas:
  - 'Los problemas numéricos en los enteros $\mathbb{Z}$ aceptan parejas de soluciones negativas si la restricción no exige positividad estricta.'
  - 'Planteamientos con el inverso multiplicativo $1/x$ conducen a ecuaciones cuadráticas multiplicando por $x \neq 0$.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas numéricos sobre números enteros, consecutivos e inversos mediante ecuaciones cuadráticas.
  CÓMO: Representar las propiedades numéricas en $x$, construir $ax^2 + bx + c = 0$, resolver y filtrar según el conjunto numérico.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
