semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_NUMEROS
resumen_inicial: La resolución de problemas numéricos mediante ecuaciones cuadráticas analiza relaciones aritméticas sobre números enteros o racionales (como productos de consecutivos, sumas de cuadrados o recíprocos), evaluando la validez de las soluciones según el conjunto numérico pedido ($\mathbb{N}, \mathbb{Z}, \mathbb{Q}, \mathbb{R}$).
explicacion_simple: "![La resolución de problemas numéricos mediante ecuaciones cuadráticas analiza relaciones aritméticas sobre números enteros o racionales (como productos de consecutivos, sumas de cuadrados o recíprocos), evaluando la validez de las soluciones según el conjunto numérico pedido ($\\mathbb{N}, \\mathbb{Z}, \\mathbb{Q}, \\mathbb{R}$)](/static/img/nodos/resolucion-de-problemas-numericos-que-conducen-a-ecuaciones-cuadraticas-intro.svg)\n\n\nEn los problemas de números puros (sin geometría ni física), **las respuestas negativas SÍ pueden ser válidas si el enunciado habla de números enteros ($\\mathbb{Z}$)**.\n\n*Ejemplo clásico:* \"Encuentra dos números enteros consecutivos cuyo producto sea 56\".\n1. Los números son $x$ y $x + 1$.\n2. $x(x + 1) = 56 \\implies x^2 + x - 56 = 0 \\implies (x + 8)(x - 7) = 0$.\n3. Obtenemos dos soluciones matemáticas: $x_1 = 7$ y $x_2 = -8$.\n4. **¡Ambas son válidas!** Existen dos parejas de números que cumplen el problema:\n   - Pareja 1 (positiva):\
  \ **$7$ y $8$** ($7 \\times 8 = 56$).\n   - Pareja 2 (negativa): **$-8$ y $-7$** ($(-8) \\times (-7) = 56$).\n- **Regla:** Solo descartas la negativa si el problema dice explícitamente \"enteros positivos\" o \"números naturales\"."
explicacion_formal: 'Sea un problema formulado sobre el álgebra de números $\mathbb{K} \in \{\mathbb{N}, \mathbb{Z}, \mathbb{Q}, \mathbb{R}\}$. La formulación polinómica genera ecuaciones de la forma:

  $$P(x) = ax^2 + bx + c = 0$$


  **Condición de validez numérica**:

  $$\mathcal{S}_{\text{val}} = \mathcal{S} \cap \mathbb{K}$$

  - Si $\mathbb{K} = \mathbb{Z}$, las raíces negativas son válidas si satisfacen la paridad o consecutividad.

  - Si $\mathbb{K} = \mathbb{N} = \mathbb{Z}^+$, se descartan las soluciones no positivas.'
definiciones_clave: '- **Enteros consecutivos**: Par de números $x$ y $x + 1$ con diferencia unitaria.

  - **Conjunto numérico referencial**: Universo numérico $\mathbb{N}, \mathbb{Z}, \mathbb{Q}$ o $\mathbb{R}$ que delimita la validez de las soluciones.'
propiedades_relaciones: '- **Dualidad de signos en productos**: El producto de dos negativos es positivo ($(-a)(-b) = ab$), generando casi siempre pares simétricos de soluciones enteras.

  - **Suma de cuadrados**: $x^2 + (x+1)^2 = K$ siempre genera discriminante positivo si $K > 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de problemas numéricos mediante ecuaciones cuadráticas analiza relaciones aritméticas sobre números enteros o racionales (como productos de consecutivos, sumas de cuadrados o recíprocos), evaluando la validez de las soluciones según el conjunto numérico pedido ($\mathbb{N}, \mathbb{Z}, \mathbb{Q}, \mathbb{R}$)](/static/img/nodos/resolucion-de-problemas-numericos-que-conducen-a-ecuaciones-cuadraticas-ejemplos.svg)



    La suma de los cuadrados de dos números enteros consecutivos es 85. Encuentra todas las parejas de números que cumplen esta condición.'
  pasos:
  - 'Paso 1: Definir los números: $x$ y $x + 1$ con $x \in \mathbb{Z}$.'
  - 'Paso 2: Plantear la suma de sus cuadrados: $x^2 + (x + 1)^2 = 85$.'
  - 'Paso 3: Desarrollar el binomio al cuadrado: $x^2 + x^2 + 2x + 1 = 85 \implies 2x^2 + 2x + 1 = 85$.'
  - 'Paso 4: Llevar a la forma general: $2x^2 + 2x - 84 = 0$.'
  - 'Paso 5: Dividir por 2: $x^2 + x - 42 = 0$.'
  - 'Paso 6: Factorizar: $(x + 7)(x - 6) = 0 \implies x_1 = 6, \; x_2 = -7$.'
  - 'Paso 7: Formar las parejas enteras:

    - Si $x = 6 \implies$ pareja $(6, 7)$ (pues $36 + 49 = 85$).

    - Si $x = -7 \implies$ pareja $(-7, -6)$ (pues $49 + 36 = 85$).

    - Conclusión: Existen dos parejas válidas: $(6, 7)$ y $(-7, -6)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si un problema pide "dos enteros positivos cuyo producto es 42", ¿cuántas parejas válidas existen si x = 6 y x = -7?
  choices:
  - text: 'Una sola pareja: (6, 7), porque se descartan los negativos al pedir ''positivos''.'
    is_correct: true
  - text: 'Dos parejas: (6, 7) y (-7, -6).'
    is_correct: false
  - text: Ninguna pareja.
    is_correct: false
  - text: Cuatro parejas.
    is_correct: false
  explanation: 'La alternativa correcta es ''Una sola pareja: (6, 7), porque se descartan los negativos al pedir ''positivos''.''. La restricción ''positivos'' descarta la solución negativa.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el número positivo que sumado con su cuadrado da 30?
  choices:
  - text: '5'
    is_correct: true
  - text: '-6'
    is_correct: false
  - text: '6'
    is_correct: false
  - text: '25'
    is_correct: false
  explanation: La alternativa correcta es '5'. $x^2 + x = 30 \implies x^2 + x - 30 = (x + 6)(x - 5) = 0 \implies x = 5$ (positivo).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto numérico especificado en el problema ($\mathbb{N}, \mathbb{Z}, \mathbb{Q}, \mathbb{R}$).'
- 'Paso 2: Traducir las relaciones aritméticas a una ecuación cuadrática.'
- 'Paso 3: Resolver algebraicamente la ecuación.'
- 'Paso 4: Validar cuáles raíces pertenecen al conjunto numérico exigido.'
- 'Paso 5: Formar y presentar todas las soluciones numéricas válidas.'
errores_correccion: '- **Error común:** Descartar una solución negativa cuando el problema pide simplemente "números enteros".

  - **Cómo corregirlo:** En los enteros $\mathbb{Z}$, **los números negativos son totalmente válidos**; solo se descartan si el texto dice "enteros positivos" o "naturales".'
ejemplos:
- titulo: 'Ejemplo 1: Diferencia de cuadrados'
  enunciado: La diferencia entre el cuadrado de un número positivo y el triple de dicho número es 18. ¿Cuál es el número?
  alternativas:
  - '6'
  - '-3'
  - '9'
  - '3'
  respuesta: '6'
  solucion_pasos:
  - 'Paso 1: $x^2 - 3x = 18 \implies x^2 - 3x - 18 = (x - 6)(x + 3) = 0 \implies x = 6$ (positivo).'
- titulo: 'Ejemplo 2: Dos enteros impares consecutivos'
  enunciado: El producto de dos enteros impares positivos consecutivos es 35. ¿Cuáles son?
  alternativas:
  - 5 y 7
  - -7 y -5
  - 3 y 5
  - 7 y 9
  respuesta: 5 y 7
  solucion_pasos:
  - 'Paso 1: $x(x + 2) = 35 \implies x^2 + 2x - 35 = (x + 7)(x - 5) = 0 \implies x = 5 \implies 5\text{ y } 7$.'
- titulo: 'Ejemplo 3: Número y su inverso'
  enunciado: Un número sumado con su inverso multiplicativo da $2$. ¿Cuál es el número?
  alternativas:
  - 1 (raíz doble)
  - '2'
  - '-1'
  - '0'
  respuesta: 1 (raíz doble)
  solucion_pasos:
  - 'Paso 1: $x + 1/x = 2 \implies x^2 - 2x + 1 = 0 \implies (x - 1)^2 = 0 \implies x = 1$.'
- titulo: 'Ejemplo 4: Suma y producto simultáneo'
  enunciado: Dos números suman 11 y su producto es 24. ¿Cuáles son?
  alternativas:
  - 3 y 8
  - 4 y 6
  - 2 y 12
  - 1 y 24
  respuesta: 3 y 8
  solucion_pasos:
  - 'Paso 1: $x^2 - 11x + 24 = (x - 3)(x - 8) = 0 \implies 3\text{ y } 8$.'
errores_frecuentes:
- Descartar soluciones negativas en problemas de enteros donde sí son válidas.
- Desarrollar erróneamente cuadrados de sumas.
- No verificar si el número obtenido cumple la condición de paridad o imparidad.
afirmaciones_verdaderas:
- En problemas con números enteros relativos Z, las soluciones negativas son perfectamente válidas.
- La ecuación x² - Sx + P = 0 determina directamente los dos números que suman S y multiplican P.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas numéricos y aritméticos modelados por ecuaciones cuadráticas.


  **CÓMO:** Formulando ecuaciones de segundo grado y evaluando la pertinencia de las soluciones en N, Z o R.


