semantic_id: MAT.ALG.EC_CUADR_MODELO.PROBLEMAS_NUMEROS
resumen_inicial: 'Resolución de problemas numéricos que conducen a ecuaciones cuadráticas:
  concepto, discriminante, soluciones y modelamiento en Modelamiento y resolución
  de problemas.'
explicacion_simple: Muchos acertijos numéricos clásicos ("el cuadrado de un número...",
  "el producto de dos números consecutivos...") esconden, tras la traducción algebraica,
  una ecuación cuadrática que resolver.
explicacion_formal: '### Definición formal


  Un problema numérico se modela definiendo una incógnita $x$ para el número (o el
  menor de los números, si son varios relacionados), traduciendo la relación dada
  del enunciado en una igualdad algebraica, y resolviendo la ecuación de segundo grado
  resultante.


  ### Desarrollo didáctico


  Para números consecutivos, conviene representar el segundo como $x+1$ (o $x+2$ si
  son consecutivos pares o impares), evitando definir dos incógnitas independientes
  cuando en realidad están relacionadas.


  "La suma de los cuadrados de dos números consecutivos es 25" se traduce, con $x$
  y $x+1$, como $x^2+(x+1)^2=25$, que al desarrollar da $2x^2+2x-24=0$.'
definiciones_clave: '- **Resolución de problemas numéricos que conducen a ecuaciones
  cuadráticas**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de problemas numéricos que conducen a ecuaciones cuadráticas.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando resolución de problemas
    numéricos que conducen a ecuaciones cuadráticas.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a resolución de problemas
    numéricos que conducen a ecuaciones cuadráticas.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
