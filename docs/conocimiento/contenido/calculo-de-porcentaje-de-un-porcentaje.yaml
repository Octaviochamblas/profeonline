semantic_id: MAT.NUM.PORCENTAJES.PORCENTAJE_DE_PORCENTAJE
resumen_inicial: 'Cálculo de porcentaje de un porcentaje: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: Si hay una liquidación del 50% y sobre eso te hacen un 20% extra
  por ser socio, ¿es un 70% total? ¡NO! Es el 20% de lo que quedó. Entender los porcentajes
  encadenados evita que las tiendas te engañen.
explicacion_formal: "Calcular el porcentaje de otro porcentaje significa que la base\
  \ referencial (el Total) ha cambiado.\n\nPor ejemplo, el $50\\%$ del $20\\%$ no\
  \ es el $70\\%$. Matemáticamente, se traduce reemplazando el 'del' por una multiplicación:\n\
  \n$\\frac{50}{100} \\cdot \\frac{20}{100} = \\frac{1}{2} \\cdot \\frac{1}{5} = \\\
  frac{1}{10} = 10\\%$\n\n¡El 50% (la mitad) del 20% es lógicamente el 10% del total!\
  \ \nSi quieres saber el porcentaje único, siempre multiplica las fracciones porcentuales\
  \ y simplifica hasta que quede un único denominador 100."
definiciones_clave: '- **Cálculo de porcentaje de un porcentaje**: Elemento central
  dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
