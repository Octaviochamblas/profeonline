semantic_id: MAT.NUM.PORCENTAJES.PORCENTAJE_DE_PORCENTAJE
resumen_inicial: 'El porcentaje de un porcentaje determina el $a\%$ del $b\%$ de una cantidad $C$ multiplicando consecutivamente las razones o expresiones decimales de ambos porcentajes: $P = \left(\frac{a}{100}\right) \cdot \left(\frac{b}{100}\right) \cdot C$.'
explicacion_simple: |
  Cuando escuchas una frase como *"el $20\%$ del $50\%$ de una cantidad"*, estás aplicando un porcentaje sobre otro porcentaje previo. La forma más fácil de resolverlo es convertir ambos porcentajes a números decimales o fracciones y multiplicarlos todos juntos:
  - $20\% \to 0,20$
  - $50\% \to 0,50$
   Multiplicas $0,20 \cdot 0,50 = 0,10$, lo que significa que el $20\%$ del $50\%$ equivale al **$10\%$ final del total**.
explicacion_formal: |
  ### Definición formal
  El cálculo del **$a\%$ del $b\%$ de una cantidad $C$** es la composición de dos funciones lineales homogéneas porcentuales $f_a(x) = \frac{a}{100} x$ y $f_b(x) = \frac{b}{100} x$:
  $$P = (f_a \circ f_b)(C) = \left(\frac{a}{100}\right) \cdot \left(\frac{b}{100}\right) \cdot C = \left(\frac{a \cdot b}{10.000}\right) \cdot C$$

  ### Porcentaje único equivalente ($p_{\text{eq}}\%$)
  Dos porcentajes encadenados aplicados consecutivamente sobre una misma base equivalen a un **único porcentaje directo**:
  $$p_{\text{eq}}\% = \left(\frac{a \cdot b}{100}\right)\%$$

  ### Conmutatividad del encadenamiento porcentual
  Por la propiedad asociativa y conmutativa de la multiplicación real:
  $$\text{El } a\% \text{ del } b\% \text{ de } C = \text{El } b\% \text{ del } a\% \text{ de } C = \left(\frac{a \cdot b}{10.000}\right) \cdot C$$

  ### Síntesis didáctica
  - Ecuación del resultado: $P = d_a \cdot d_b \cdot C$.
  - Porcentaje equivalente: $p_{\text{eq}}\% = \frac{a \cdot b}{100}\%$.
definiciones_clave: |
  - **Porcentaje encadenado**: Aplicación sucesiva de dos o más tanto por cientos sobre un valor de origen.
  - **Porcentaje único equivalente ($p_{\text{eq}}\%$)**: Porcentaje individual que produce exactamente el mismo efecto que los porcentajes sucesivos.
  - **Composición porcentual**: Producto continuado de operadores fraccionarios $\frac{a}{100} \cdot \frac{b}{100}$.
propiedades_relaciones: |
  - **Reducción de la escala**: El porcentaje de un porcentaje (ambos menores al $100\%$) siempre resulta en un porcentaje equivalente estrictamente menor que cada uno de los porcentajes individuales ($p_{\text{eq}}\% < a\%$ y $p_{\text{eq}}\% < b\%$).
  - **Generalización a $n$ porcentajes**: Para $n$ porcentajes encadenados $p_1, p_2, \dots, p_n$, el factor final es $d_{\text{total}} = \prod_{i=1}^n \left(\frac{p_i}{100}\right)$.
ejemplo_guiado:
  enunciado: 'Calcula el $30\%$ del $40\%$ de $\$200.000$ y determina qué porcentaje único equivalente del total representa.'
  pasos:
    - 'Paso 1: Convertimos los dos porcentajes a su forma decimal: $30\% = 0,3$ y $40\% = 0,4$.'
    - 'Paso 2: Multiplicamos los decimales para hallar el porcentaje equivalente: $d_{\text{eq}} = 0,3 \cdot 0,4 = 0,12$.'
    - 'Paso 3: Convertimos a tanto por ciento: $0,12 \cdot 100 = 12\%$. (El $30\%$ del $40\%$ equivale al **$12\%$ directo**).'
    - 'Paso 4: Multiplicamos por la cantidad total $C = 200.000$: $P = 0,12 \cdot 200.000 = \$24.000$. El resultado es **$\$24.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué porcentaje único equivalente corresponde el $50\%$ del $50\%$ de una cantidad?'
    choices:
      - {text: 'Al $25\%$, multiplicando los decimales $0,5 \cdot 0,5 = 0,25 \implies 25\%$', is_correct: true}
      - {text: 'Al $100\%$, sumando los dos porcentajes', is_correct: false}
      - {text: 'Al $50\%$, sin cambios', is_correct: false}
      - {text: 'Al $10\%$, dividiendo $50 / 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''Al $25\%$, multiplicando los decimales $0,5 \cdot 0,5 = 0,25 \implies 25\%$''. $0.5 \cdot 0.5 = 0.25 = 25\%$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuánto es el $10\%$ del $20\%$ de $5.000$?'
    choices:
      - {text: '$100$, pues el porcentaje equivalente es el $2\%$ ($0,10 \cdot 0,20 = 0,02$), y $0,02 \cdot 5.000 = 100$', is_correct: true}
      - {text: '$1.000$, calculando solo el 20%', is_correct: false}
      - {text: '$500$, calculando solo el 10%', is_correct: false}
      - {text: '$300$, sumando $10 + 20 = 30\%$', is_correct: false}
    explanation: 'La alternativa correcta es ''$100$, pues el porcentaje equivalente es el $2\%$ ($0,10 \cdot 0,20 = 0,02$), y $0,02 \cdot 5.000 = 100$''. $0.1 \cdot 0.2 \cdot 5.000 = 100$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Convertir cada uno de los porcentajes dados $a\%$ y $b\%$ a sus números decimales equivalentes ($d_a = a/100, d_b = b/100$).'
  - 'Paso 2: Multiplicar los decimales para hallar el factor multiplicativo combinado ($d_{\text{eq}} = d_a \cdot d_b$).'
  - 'Paso 3: Si se pide el porcentaje equivalente, multiplicar $d_{\text{eq}} \cdot 100\%$.'
  - 'Paso 4: Multiplicar el factor $d_{\text{eq}}$ por la cantidad total $C$ para obtener el valor final en dinero o unidades.'
errores_correccion: |
  - **Error 1:** Sumar los porcentajes en lugar de multiplicarlos al calcular el porcentaje de un porcentaje (ej: pensar que el $20\%$ del $30\%$ es el $50\%$). **Cómo corregirlo:** La palabra "de" o "del" indica **MULTIPLICACIÓN**: $\frac{20}{100} \cdot \frac{30}{100} = \frac{6}{100} = 6\%$.
  - **Error 2:** Dividir por 100 una sola vez al multiplicar dos porcentajes (ej: hacer $\frac{20 \cdot 30}{100} = 60\%$). **Cómo corregirlo:** Cada porcentaje lleva su propio denominador 100; el producto tiene denominador **$10.000$**, lo que da $6\%$.
ejemplos:
  - titulo: 'Cálculo del 50% del 20%'
    enunciado: '¿El $50\%$ del $20\%$ de una cantidad equivale a su $10\%$?'
    alternativas:
      - 'Sí, pues $0.5 \cdot 0.2 = 0.10 \implies 10\%$'
      - 'No, equivale al 70%'
      - 'No, equivale al 30%'
    respuesta: 'Sí, pues $0.5 \cdot 0.2 = 0.10 \implies 10\%$'
    solucion_pasos:
      - '1. Decimales: $50\% = 0,5$ y $20\% = 0,2$.'
      - '2. Producto: $0,5 \cdot 0,2 = 0,10 \implies 10\%$.'
  - titulo: 'Cálculo del 25% del 40%'
    enunciado: '¿El $25\%$ del $40\%$ de $\$100.000$ es $\$10.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0.25 \cdot 0.40 = 0.10 \implies 0.10 \cdot 100.000 = \$10.000$.'
  - titulo: 'Porcentaje equivalente de tres porcentajes'
    enunciado: '¿El $10\%$ del $10\%$ del $10\%$ equivale al $0.1\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0,1 \cdot 0,1 \cdot 0,1 = 0,001 = 0,1\%$.'
  - titulo: 'Conmutatividad en el cálculo'
    enunciado: '¿El $15\%$ del $80\%$ de $500$ da el mismo resultado que el $80\%$ del $15\%$ de $500$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La multiplicación de reales es conmutativa ($0,15 \cdot 0,8 = 0,8 \cdot 0,15 = 0,12$).'
errores_frecuentes:
  - 'Sumar los porcentajes en lugar de multiplicarlos al calcular un porcentaje de un porcentaje.'
  - 'Dividir entre 100 una sola vez al encadenar dos o más razones porcentuales.'
  - 'Considerar que el porcentaje de un porcentaje produce una cifra mayor a los porcentajes originales.'
  - 'El porcentaje de un porcentaje es idéntico a la suma de dos descuentos porcentuales sucesivos.'
  - 'Restar los dos porcentajes para intentar hallar la proporción resultante.'
afirmaciones_verdaderas:
  - 'El $a\%$ del $b\%$ de una cantidad $C$ se calcula multiplicando $P = \left(\frac{a}{100}\right) \cdot \left(\frac{b}{100}\right) \cdot C$.'
  - 'El porcentaje único equivalente a dos porcentajes encadenados $a\%$ y $b\%$ es $p_{\text{eq}}\% = \left(\frac{a \cdot b}{100}\right)\%$.'
al_terminar_debes_poder: 'Calcular el porcentaje de un porcentaje mediante el producto de factores decimales $P = d_a \cdot d_b \cdot C$.'
