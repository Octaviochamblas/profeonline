procedimiento:
- 'Paso 1: Escribe cada porcentaje como una fracción sobre 100.'
- 'Paso 2: Multiplica ambas fracciones entre sí.'
- 'Paso 3: Simplifica la fracción resultante para que el denominador vuelva a ser 100. El
  numerador será el porcentaje real equivalente.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de porcentaje
  de un porcentaje.
ejemplos:
- titulo: Porcentaje de porcentaje
  enunciado: Calcula el 25% del 40% de una cantidad.
  solucion_pasos:
  - 'Escribimos las fracciones: $(25/100) \cdot (40/100)$.'
  - 'Simplificamos: $25/100$ es $1/4$. $40/100$ es $2/5$.'
  - 'Multiplicamos: $(1/4) \cdot (2/5) = 2/20$.'
  - 'Llevamos a denominador 100 multiplicando por 5 arriba y abajo: $10/100$.'
  - Equivale a calcular el 10% de la cantidad original.
- titulo: Ejemplo 2
  enunciado: ¿Cuánto es el 10% del 20% de una cantidad?
  alternativas:
  - 2%
  - 30%
  - 0,2%
  respuesta: 2%
  solucion_pasos:
  - (1/10) por (1/5) es igual a 1/50, o sea 2/100, es decir 2%.
- titulo: Ejemplo 3
  enunciado: ¿Cuánto es el 50% del 50% de una cantidad?
  alternativas:
  - 25%
  - 100%
  - 75%
  respuesta: 25%
  solucion_pasos:
  - (1/2) por (1/2) es igual a 1/4, es decir 25%.
- titulo: ¿El 20% del 30% de una cantidad es igual al 6% de esa cantidad?
  respuesta: Sí
  solucion_pasos:
  - (20/100) por (30/100) es igual a 6/100, es decir 6%.
errores_frecuentes:
- Sumar los porcentajes (ej. creer que el 20% del 30% es un 50%).
- Multiplicar los números enteros directamente sin dividir por $100 \cdot 100$ (ej. $20 \cdot
  30 = 600\%$ en lugar de $6\%$).
- Sumar los porcentajes en vez de multiplicarlos, creyendo que el 20% del 30% es un 50%.
- Multiplicar los números enteros directamente sin dividir por 100 dos veces, obteniendo un
  resultado 100 veces mayor al correcto.
- Olvidar simplificar la fracción resultante de vuelta a denominador 100 para leer el porcentaje
  final.
afirmaciones_verdaderas:
- La propiedad de cálculo de porcentaje de un porcentaje preserva la consistencia lógica.
- Al calcular un porcentaje de otro porcentaje, nunca se deben sumar los porcentajes directamente,
  sino multiplicar sus fracciones equivalentes.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de porcentaje
  de un porcentaje.
