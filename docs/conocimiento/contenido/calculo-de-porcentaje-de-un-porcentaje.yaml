procedimiento:
- 'Paso 1: Escribe cada porcentaje como una fracción sobre 100.'
- 'Paso 2: Multiplica ambas fracciones entre sí.'
- 'Paso 3: Simplifica la fracción resultante para que el denominador vuelva a ser
  100. El numerador será el porcentaje real equivalente.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de
  porcentaje de un porcentaje.
ejemplos:
- titulo: Porcentaje de porcentaje
  enunciado: Calcula el 25% del 40% de una cantidad.
  solucion_pasos:
  - 'Escribimos las fracciones: $(25/100) \cdot (40/100)$.'
  - 'Simplificamos: $25/100$ es $1/4$. $40/100$ es $2/5$.'
  - 'Multiplicamos: $(1/4) \cdot (2/5) = 2/20$.'
  - 'Llevamos a denominador 100 multiplicando por 5 arriba y abajo: $10/100$.'
  - Equivale a calcular el 10% de la cantidad original.
errores_frecuentes:
- Sumar los porcentajes (ej. creer que el 20% del 30% es un 50%).
- Multiplicar los números enteros directamente sin dividir por $100 \cdot 100$ (ej.
  $20 \cdot 30 = 600\%$ en lugar de $6\%$).
afirmaciones_verdaderas:
- La propiedad de cálculo de porcentaje de un porcentaje preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de porcentaje
  de un porcentaje.
