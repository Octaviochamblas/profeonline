resumen_inicial: 'El porcentaje de un porcentaje se calcula multiplicando las representaciones
  decimales o fraccionarias de cada porcentaje entre sí: $a\% \text{ del } b\% = \left(
  \frac{a}{100} \cdot \frac{b}{100} \right) \cdot 100\% = \frac{a \cdot b}{100}\%$.'
explicacion_simple: Cuando calculamos un porcentaje sobre otro porcentaje (por ejemplo,
  el 20% del 50%), estamos sacando una fracción de otra fracción. Para hallar el porcentaje
  final equivalente, multiplicamos los dos porcentajes expresados en decimales.
explicacion_formal: 'Para dos porcentajes $a\%$ y $b\%$, el **Porcentaje Compuesto
  Equivalente $P_{eq}\%$** sobre una cantidad $N$ se define como:


  $$V = \left( \frac{a}{100} \right) \cdot \left( \frac{b}{100} \right) \cdot N =
  \left( \frac{a \cdot b}{10000} \right) \cdot N$$


  $$P_{eq}\% = \left( \frac{a \cdot b}{100} \right)\%$$


  **Ejemplo de equivalencia:**

  - El $50\%$ del $40\%$ equivale al $\frac{50 \cdot 40}{100}\% = 20\%$ del total.'
definiciones_clave: '- **Porcentaje de un porcentaje**: Multiplicación de tasas $P_{eq}\%
  = \frac{a \cdot b}{100}\%$.'
propiedades_relaciones: '- **Multiplicación encadenada**: Equivale a aplicar factores
  decimales consecutivos $d_1 \cdot d_2$.'
ejemplo_guiado:
  enunciado: Calcule el $20\%$ del $30\%$ de \$50.000.
  pasos:
  - 'Paso 1: Convertir ambos porcentajes a decimales: $20\% = 0,2$ y $30\% = 0,3$.'
  - 'Paso 2: Calcular el porcentaje equivalente: $0,2 \cdot 0,3 = 0,06 \implies 6\%$.'
  - 'Paso 3: Aplicar el $6\%$ al total de \$50.000: $50.000 \cdot 0,06 = 3.000$.'
  - 'Conclusión: El $20\%$ del $30\%$ de \$50.000 es \$3.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué porcentaje único equivale calcular el a% del b%?
  choices:
  - text: Al porcentaje equivalente P = (a · b) / 100 %
    is_correct: true
  - text: A la suma (a + b) %
    is_correct: false
  - text: A la resta (a - b) %
    is_correct: false
  - text: Al producto a · b %
    is_correct: false
  explanation: La alternativa correcta es 'Al porcentaje equivalente P = (a · b) /
    100 %'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el 20% del 30% de $50.000, ¿cuál fue el resultado
    final?
  choices:
  - text: 3.000 $ (que es el 6% de 50.000)
    is_correct: true
  - text: 5.000 $
    is_correct: false
  - text: 15.000 $
    is_correct: false
  - text: 1.000 $
    is_correct: false
  explanation: La alternativa correcta es '3.000 $ (que es el 6% de 50.000)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular porcentajes de porcentajes
  multiplicando sus factores decimales o mediante el porcentaje equivalente $P_{eq}\%
  = \frac{a \cdot b}{100}\%$.
semantic_id: MAT.NUM.PORCENTAJES.PORCENTAJE_DE_PORCENTAJE
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.PORCENTAJE_DE_PORCENTAJE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
