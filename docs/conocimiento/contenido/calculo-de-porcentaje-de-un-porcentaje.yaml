semantic_id: MAT.NUM.PORCENTAJES.PORCENTAJE_DE_PORCENTAJE
resumen_inicial: El cálculo de porcentaje de un porcentaje consiste en aplicar sucesivamente
  dos o más porcentajes multiplicando sus expresiones decimales o fraccionarias ($a\%
  \text{ del } b\% \text{ de } N = \frac{a \cdot b}{10.000} \cdot N$).
explicacion_simple: '![Cálculo de porcentaje de un porcentaje](/static/img/nodos/calculo-de-porcentaje-de-un-porcentaje-intro.svg)


  Cuando te piden calcular el *"20% del 50% de una cantidad"*, **los porcentajes se
  multiplican entre sí, ¡NUNCA se suman!** Como la palabra *"de"* significa multiplicación,
  el cálculo es: $0,20 \cdot 0,50 = 0,10$, lo que equivale simplemente al $10\%$ del
  total. Así, el $20\%$ del $50\%$ de $\$100.000$ es $\$10.000$.

  '
explicacion_formal: '### Formulación algebraica del encadenamiento

  Sean $a\%, b\% \in \mathbb{R}^+$ dos tasas porcentuales y $N \in \mathbb{R}^+$ una
  cantidad base. La composición de operadores porcentuales se define como:

  $$P = a\% \left(b\%(N)\right) = \left(\frac{a}{100}\right) \cdot \left(\frac{b}{100}\right)
  \cdot N = \left(\frac{a \cdot b}{10.000}\right) \cdot N$$


  ### Tasa porcentual única equivalente

  La tasa única $c_{\text{eq}}\%$ que produce el mismo efecto que la aplicación compuesta
  de $a\%$ y $b\%$ es:

  $$c_{\text{eq}}\% = \left(\frac{a \cdot b}{100}\right)\%$$


  ### Generalización a $k$ porcentajes sucesivos

  $$p_1\% \text{ de } p_2\% \text{ de } \dots \text{ de } p_k\% \text{ de } N = \left(\prod_{i=1}^k
  \frac{p_i}{100}\right) \cdot N$$

  '
definiciones_clave: '- **Porcentajes encadenados**: Aplicación iterada de operadores
  porcentuales sobre resultados sucesivos.

  - **Tasa única equivalente**: Porcentaje único que resume el producto de las tasas
  decimales ($c_{\text{eq}} = \frac{a \cdot b}{100}$).

  - **Naturaleza multiplicativa**: Propiedad de los operadores de escala donde cada
  porcentaje actúa como factor multiplicador.

  '
propiedades_relaciones: '- **Conmutatividad del encadenamiento**: El $a\%$ del $b\%$
  es idéntico al $b\%$ del $a\%$: $\left(\frac{a}{100}\right)\left(\frac{b}{100}\right)
  = \left(\frac{b}{100}\right)\left(\frac{a}{100}\right)$.

  - **Reducción de magnitud**: Si $a, b < 100$, la tasa compuesta $\frac{a \cdot b}{100}$
  es estrictamente menor que cada tasa individual.

  '
ejemplo_guiado:
  enunciado: Calcula el $20\%$ del $40\%$ de $\$500.000$ y determina a qué porcentaje
    único equivalente corresponde.
  pasos:
  - 'Paso 1: Convertimos cada porcentaje a su número decimal: $20\% = 0,20$ y $40\%
    = 0,40$.'
  - 'Paso 2: Multiplicamos los factores decimales para hallar la tasa única equivalente:
    $0,20 \cdot 0,40 = 0,08$.'
  - 'Paso 3: Convertimos el decimal a porcentaje: $0,08 = 8\%$. El cálculo equivale
    al $8\%$ directo.'
  - 'Paso 4: Multiplicamos por el total: $0,08 \cdot 500.000 = $\$40.00$0$.'
  - 'Paso 5: Conclusión: El $20\%$ del $40\%$ de $\$500.000$ es **$40.000** (tasa
    equivalente del **8%**).'
  imagen: /static/img/nodos/calculo-de-porcentaje-de-un-porcentaje-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué porcentaje único equivalente corresponde el $50\%$ del $50\%$?
  choices:
  - text: $25\%$ (la mitad de la mitad)
    is_correct: true
  - text: $100\%$
    is_correct: false
  - text: $50\%$
    is_correct: false
  - text: $10\%$
    is_correct: false
  explanation: La alternativa correcta es $25\%$. $0,50 \cdot 0,50 = 0,25 \implies
    25\%$. La mitad de la mitad es un cuarto (25%).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el $10\%$ del $30\%$ de $2.000$?
  choices:
  - text: $60$
    is_correct: true
  - text: $600$
    is_correct: false
  - text: $6$
    is_correct: false
  - text: $800$
    is_correct: false
  explanation: La alternativa correcta es $60$. $0,10 \cdot 0,30 = 0,03$ ($3\%$).
    Luego, $0,03 \cdot 2.000 = 60$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar cada porcentaje como número decimal dividiendo por $100$.'
- 'Paso 2: Multiplicar todos los números decimales entre sí para obtener el factor
  decimal global.'
- 'Paso 3: Multiplicar el factor decimal global por la cantidad base total $N$.'
- 'Paso 4: Si se pide el porcentaje equivalente, multiplicar el factor decimal global
  por $100\%$.'
errores_correccion: '- **Error 1:** Sumar los porcentajes en lugar de multiplicarlos
  (ej: creer que el $20\%$ del $30\%$ es $50\%$ en vez del $6\%$). **Cómo corregirlo:**
  La preposición "de" indica producto: **$0,20 \cdot 0,30 = 0,06 = 6\%$**.

  - **Error 2:** Dividir por 100 solo una vez al final al operar con los números enteros
  (hacer $(20 \cdot 30)/100 = 600/100 = 6$ pero aplicarlo como $6$ entero en vez de
  $6\%$).

  '
ejemplos:
- titulo: Porcentaje equivalente compuesto
  enunciado: ¿A qué porcentaje único equivale el $25\%$ del $60\%$?
  alternativas:
  - $15\%$
  - $85\%$
  - $35\%$
  - $2,5\%$
  respuesta: $15\%$
  solucion_pasos:
  - '1. Multiplicamos decimales: $0,25 \cdot 0,60 = 0,15$.'
  - '2. Convertimos a porcentaje: $0,15 \cdot 100\% = 15\%$.'
- titulo: Porcentaje de porcentaje directo
  enunciado: ¿El $10\%$ del $10\%$ de $10.000$ es igual a $100$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $0,10 \cdot 0,10 = 0,01$ ($1\%$). Luego $0,01 \cdot 10.000 = 100$.
- titulo: Conmutatividad del encadenamiento
  enunciado: ¿El $30\%$ del $80\%$ de $X$ es igual al $80\%$ del $30\%$ de $X$?
  respuesta: Sí
  solucion_pasos:
  - Sí. En ambos casos la tasa equivalente es $0,30 \cdot 0,80 = 0,24 = 24\%$.
- titulo: Triple encadenamiento
  enunciado: ¿El $50\%$ del $50\%$ del $50\%$ de $800$ es igual a $100$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $(1/2) \cdot (1/2) \cdot (1/2) = 1/8$. Y $800 / 8 = 100$.
errores_frecuentes:
- Sumar los porcentajes en vez de multiplicarlos.
- Olvidar que cada porcentaje introduce un factor 1/100 en el producto.
- Creer que el resultado compuesto puede ser mayor que las tasas individuales.
afirmaciones_verdaderas:
- El a% del b% de N se calcula multiplicando (a/100) · (b/100) · N.
- El 50% del 50% de cualquier cantidad equivale a su cuarta parte (25%).
al_terminar_debes_poder: '![Resumen de cálculo de porcentaje de un porcentaje](/static/img/nodos/calculo-de-porcentaje-de-un-porcentaje-resumen.svg)


  QUÉ: Resolver problemas de porcentajes encadenados y determinar la tasa única equivalente.

  CÓMO: Multiplicando sucesivamente los factores decimales asociados ($P = a_{\text{dec}}
  \cdot b_{\text{dec}} \cdot N$), reconociendo la naturaleza puramente multiplicativa
  del encadenamiento.

  '
