resumen_inicial: El coeficiente numérico de un término algebraico es el factor constante
  escalar (entero, fraccionario o real) que multiplica a la parte literal.
explicacion_simple: El coeficiente numérico es el número que acompaña a las letras.
  En $-6x^2$, el coeficiente es $-6$. En $\frac{3}{4}ab$, el coeficiente es la fracción
  $\frac{3}{4}$. Si solo vemos letras como $x^3$, el coeficiente numérico es el número
  $1$ (que no hace falta escribir).
explicacion_formal: 'En el término $T = c \prod_{j=1}^m x_j^{e_j}$, el **Coeficiente
  Numérico** $c \in \mathbb{R}$ es el multiplicador escalar del bloque literal:


  $$c = \text{Coeff}(T) \in \mathbb{R}$$


  $$\text{Si } T = -x^k \implies c = -1$$

  $$\text{Si } T = x^k \implies c = +1$$


  > **Complemento didáctico:** El coeficiente numérico cuantifica la magnitud y escala
  del término dentro de la combinación lineal.'
definiciones_clave: '- **Coeficiente numérico**: Factor constante real que multiplica
  a las variables de un término.'
propiedades_relaciones: '- **Elemento neutro multiplicativo**: $1 \cdot L = L$, por
  lo que el coeficiente $1$ suele omitirse en la escritura.'
ejemplo_guiado:
  enunciado: Identifique el coeficiente numérico en los términos $T_1 = -\frac{5}{8}a^2b$
    y $T_2 = -x^3y$.
  pasos:
  - 'Paso 1: En $T_1 = -\frac{5}{8}a^2b$, el factor constante que multiplica a $a^2b$
    es la fracción $-\frac{5}{8}$.'
  - 'Paso 2: En $T_2 = -x^3y$, el prefijo negativo sobre la variable sin número escrito
    indica un coeficiente $-1$.'
  - 'Conclusión: Coeficiente de $T_1$ es $-\frac{5}{8}$ y de $T_2$ es $-1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el coeficiente numérico del término algebraico -x^5y^2?
  choices:
  - text: '-1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: '-5'
    is_correct: false
  explanation: La alternativa correcta es '-1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -(5/8)a^2b, ¿cuál fue su coeficiente numérico?
  choices:
  - text: -5/8
    is_correct: true
  - text: 5/8
    is_correct: false
  - text: '-5'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: La alternativa correcta es '-5/8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar el número constante ubicado a la izquierda de la parte literal.'
- 'Paso 2: Incluir el signo positivo o negativo que acompaña a dicho número.'
- 'Paso 3: Si no hay número escrito, asignar $1$ o $-1$ según el signo.'
errores_correccion: '- **Error 1: Declarar que el coeficiente de $x$ es 0.** **Cómo
  corregirlo:** Si el coeficiente fuera 0, el término valdría $0 \cdot x = 0$ y no
  existiría; por ende, su coeficiente es $1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el coeficiente numérico del término -12a^4b^3?
  alternativas:
  - '-12'
  - '12'
  - '4'
  - '7'
  respuesta: '-12'
  solucion_pasos:
  - '1. Factor constante a la izquierda: -12.'
  - 2. El coeficiente numérico es -12.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el coeficiente numérico del término (3/7)x^2?
  alternativas:
  - 3/7
  - '3'
  - '7'
  - '2'
  respuesta: 3/7
  solucion_pasos:
  - 1. La constante racional que multiplica a x^2 es 3/7.
- titulo: ¿Es el coeficiente numérico del término -y^4 igual a -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, la presencia del signo menos sin número delante de la variable representa
    el coeficiente -1.
- titulo: ¿Es el coeficiente numérico de 5x^3 igual a 3?
  respuesta: 'No'
  solucion_pasos:
  - No, 3 es el exponente de la variable x; el coeficiente numérico es 5.
errores_frecuentes:
- Declarar el exponente de una variable con el coeficiente numérico del término.
- Declarar que los términos sin número escrito tienen coeficiente igual a 0 en lugar
  de 1.
- Omitir el signo negativo al extraer el coeficiente numérico.
- Incluir a las variables dentro de la respuesta del coeficiente numérico.
- Sumar los números del coeficiente con los exponentes al extraer la constante.
afirmaciones_verdaderas:
- El coeficiente numérico es el factor escalar real que multiplica a las variables
  de un término.
- Un término con signo menos sin número explícito posee coeficiente igual a -1.
al_terminar_debes_poder: Al terminar serás capaz de identificar el coeficiente numérico
  entero, fraccionario o implícito de cualquier término algebraico.
