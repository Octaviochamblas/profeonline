semantic_id: MAT.ALG.TERMINO.COEFICIENTE_NUMERICO
resumen_inicial: 'La identificación del coeficiente numérico de un término algebraico consiste en extraer el factor constante cuantitativo (incluyendo su signo) que multiplica a la parte literal.'
explicacion_simple: |
  El **coeficiente numérico** es el número que acompaña y multiplica a las letras de un término:
  - En $-7x^2$, el coeficiente numérico es **$-7$**.
  - En $\frac{3}{5}ab$, el coeficiente numérico es la fracción **$\frac{3}{5}$**.
  - **¡El caso del 1 invisible!** Si ves una letra sola como $x$ o $-y$:
    - En $x$, hay un número $1$ invisible que la multiplica $\implies$ el coeficiente es **$1$** (es decir, $+1$).
    - En $-y$, hay un $-1$ invisible que la multiplica $\implies$ el coeficiente es **$-1$**.
  - El coeficiente incluye siempre el signo ($+$ o $-$) del término.
explicacion_formal: |
  ### Definición formal
  Dado un término algebraico $M(x_1, \dots, x_k) \in \mathbb{R}[x_1, \dots, x_k]$ expresado en la forma canónica $M = c \cdot X$, el **coeficiente numérico** es el elemento escalar único $c \in \mathbb{R}$ definido por la proyección del término sobre el anillo de coeficientes:

  $$c = M(1, 1, \dots, 1)$$

  ### Regla de la Unidad Escalar Implícita
  Por los axiomas de neutro multiplicativo en la estructura de cuerpo de $\mathbb{R}$:

  $$1 \cdot X = X \quad \implies \quad \operatorname{coef}(X) = 1$$
  $$-1 \cdot X = -X \quad \implies \quad \operatorname{coef}(-X) = -1$$

  ### Coeficientes Fraccionarios
  En cocientes de la forma $\frac{X}{d}$ con $d \in \mathbb{R} \setminus \{0\}$, el coeficiente se descompone como el factor multiplicativo inverso:

  $$\frac{X}{d} = \frac{1}{d} \cdot X \quad \implies \quad \operatorname{coef}\left(\frac{X}{d}\right) = \frac{1}{d}$$

  ### Síntesis didáctica
  El coeficiente numérico cuantifica cuántas veces se repite o escala la parte literal dentro de la estructura aditiva del polinomio.
definiciones_clave: |
  - **Coeficiente numérico**: Factor constante escalar (entero, fraccionario o irracional, positivo o negativo) que multiplica a la parte literal.
  - **Neutro multiplicativo ($1$)**: Propiedad por la cual un término literal sin cifra escrita posee un coeficiente explícito igual a $1$ o $-1$.
  - **Coeficiente fraccionario**: Escalar expresado como la división de dos enteros $\frac{a}{b}$ que multiplica a la parte literal.
propiedades_relaciones: |
  - **Operación entre términos semejantes**: Para sumar o restar términos semejantes se operan exclusivamente sus coeficientes numéricos conservando intacta la parte literal.
  - **Coeficiente nulo ($0$)**: Si el coeficiente numérico de un término es $0$, todo el término se anula ($0 \cdot X = 0$).
ejemplo_guiado:
  enunciado: 'Identifica el coeficiente numérico de los siguientes 4 términos algebraicos: a) $-9x^3$, b) $ab^2$, c) $-y$, d) $\frac{x^4}{7}$.'
  pasos:
    - 'Paso 1: Para $-9x^3$, la cifra multiplicativa constante con su signo es **$-9$**.'
    - 'Paso 2: Para $ab^2$, no hay cifra escrita $\implies$ aplicamos el neutro multiplicativo: el coeficiente es **$1$**.'
    - 'Paso 3: Para $-y$, no hay cifra escrita pero antecede un signo menos $\implies$ el coeficiente es **$-1$**.'
    - 'Paso 4: Para $\frac{x^4}{7}$, extraemos la fracción multiplicativa $\frac{1}{7} \cdot x^4 \implies$ el coeficiente es **$\frac{1}{7}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el coeficiente numérico de una parte literal que no tiene ninguna cifra escrita a su izquierda, como el término $-x^3 y$?'
    choices:
      - {text: 'El coeficiente numérico es $-1$', is_correct: true}
      - {text: 'El coeficiente numérico es $0$', is_correct: false}
      - {text: 'El coeficiente numérico es $-3$', is_correct: false}
      - {text: 'El término no posee coeficiente numérico', is_correct: false}
    explanation: 'La alternativa correcta es ''El coeficiente numérico es $-1$''. Por la regla del neutro multiplicativo, $-x^3 y = -1 \cdot x^3 y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término algebraico $\frac{5a^2 b}{3}$, ¿cuál es su coeficiente numérico?'
    choices:
      - {text: 'La fracción $\frac{5}{3}$', is_correct: true}
      - {text: 'El número entero $5$', is_correct: false}
      - {text: 'El número entero $3$', is_correct: false}
      - {text: 'El exponente $2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La fracción $\frac{5}{3}$''. Descomponiendo el término se obtiene $\frac{5}{3} \cdot a^2 b$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la parte literal con sus exponentes en el término.'
  - 'Paso 2: Aislar la constante o número que multiplica a dicha parte literal, incluyendo su signo.'
  - 'Paso 3: Si la parte literal está sola (ej: $x^2$), asignar el coeficiente $1$. Si es $-x^2$, asignar el coeficiente $-1$.'
  - 'Paso 4: Si la parte literal está dividida por un número $d$ (ej: $\frac{x}{d}$), expresar el coeficiente como la fracción $\frac{1}{d}$.'
errores_correccion: |
  - **Error 1:** Afirmar que términos como $x$ o $-a^2$ no tienen coeficiente numérico o que su coeficiente es $0$. **Cómo corregirlo:** La ausencia de número escrito **significa que el coeficiente es $1$ (o $-1$)**, jamás cero (si fuera cero, el término se anularía).
  - **Error 2:** Excluir el denominador al extraer el coeficiente de un término fraccionario (ej: declarar que el coeficiente de $\frac{x}{4}$ es $1$ en vez de $\frac{1}{4}$). **Cómo corregirlo:** El denominador **forma parte del coeficiente escalar** ($\frac{1}{4}$).
ejemplos:
  - titulo: 'Coeficiente negativo'
    enunciado: '¿Cuál es el coeficiente numérico de $-14w^5$?'
    alternativas:
      - '$-14$'
      - '$14$'
      - '$5$'
    respuesta: '$-14$'
    solucion_pasos:
      - '1. La cifra multiplicativa constante con su signo es $-14$.'
      - '2. El coeficiente es $-14$.'
  - titulo: 'Coeficiente fraccionario'
    enunciado: 'En el término $\frac{-2x}{9}$, ¿cuál es el coeficiente numérico?'
    alternativas:
      - '$-\frac{2}{9}$'
      - '$-2$'
      - '$9$'
    respuesta: '$-\frac{2}{9}$'
    solucion_pasos:
      - '1. Descomponemos $\frac{-2}{9} \cdot x$.'
      - '2. El coeficiente es la fracción $-\frac{2}{9}$.'
  - titulo: 'Coeficiente unitario invisible'
    enunciado: 'En el término $m^4 n^2$, ¿el coeficiente numérico es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por el neutro multiplicativo $1 \cdot m^4 n^2 = m^4 n^2$.'
  - titulo: 'Coeficiente decimal'
    enunciado: 'En el término $3,5 z$, ¿el número decimal $3,5$ es el coeficiente numérico?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, los números decimales son escalares reales válidos como coeficientes.'
errores_frecuentes:
  - 'Un término literal sin número escrito a su izquierda tiene un coeficiente numérico igual a cero.'
  - 'El coeficiente numérico de un término fraccionario sólo incluye el numerador ignorando el denominador.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El signo negativo de un término no pertenece al coeficiente numérico sino a la variable.'
  - 'Los coeficientes numéricos de dos términos semejantes se multiplican al realizar una adición.'
afirmaciones_verdaderas:
  - 'El coeficiente numérico es el factor constante (con su signo) que multiplica a la parte literal de un término.'
  - 'Un término algebraico literal sin cifra escrita posee un coeficiente numérico implícito igual a $1$ (o $-1$ si lo precede un signo menos).'
al_terminar_debes_poder: 'Identificar el coeficiente numérico de cualquier término algebraico (incluyendo coeficientes unitarios implícitos, negativos y fraccionarios).'
