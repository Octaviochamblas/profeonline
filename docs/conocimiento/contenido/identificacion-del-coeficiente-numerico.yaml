semantic_id: MAT.ALG.TERMINO.COEFICIENTE_NUMERICO
resumen_inicial: 'El coeficiente numérico es el factor cuantitativo constante (entero, fraccionario o decimal) que multiplica a la parte literal de un término, incluyendo su signo.'
explicacion_simple: |
  - El **coeficiente numérico** es el número que acompaña y multiplica a las letras en un término algebraico.
  - En $-6x^3y$, el coeficiente numérico es **$-6$** (indica que la parte literal $x^3y$ está multiplicada por $-6$).
  - **Casos especiales clave:**
    - Si una letra aparece sola, como en $a^2b$, su coeficiente es **$1$** (porque $1 \cdot a^2b = a^2b$).
    - Si aparece con signo menos pero sin número, como en $-x$, su coeficiente es **$-1$**.
    - Puede ser una fracción: en $\frac{3}{4}x^2$, el coeficiente es **$\frac{3}{4}$**; en $\frac{x}{5}$, el coeficiente es **$\frac{1}{5}$**.

  ![Coeficiente Numérico](/static/img/nodos/identificacion-del-coeficiente-numerico-intro.svg)
explicacion_formal: |
  ### Definición formal
  En un término algebraico $T = c \cdot X$, donde $X = \prod x_i^{e_i}$ es el producto monomial de variables, el escalar constante $c \in \mathbb{R}$ recibe el nombre de **coeficiente numérico**:

  $$c = \frac{T}{X} \in \mathbb{R} \setminus \{0\}$$

  ### Convenciones de coeficientes unitarios y fraccionarios
  1. **Coeficiente $1$ tácito:** $1 \cdot X \equiv X$.
  2. **Coeficiente $-1$ tácito:** $-1 \cdot X \equiv -X$.
  3. **División por constante:** $\frac{X}{k} \equiv \left(\frac{1}{k}\right) \cdot X$, con coeficiente $c = \frac{1}{k}$.
  4. **Signo integrado:** El signo del término está indisolublemente unido al coeficiente numérico ($c = -8$ en $-8x^2$).
definiciones_clave: |
  - **Coeficiente numérico**: Factor numérico constante que escala a la parte literal de un término.
  - **Coeficiente implícito (1 o -1)**: Valor numérico unitario que se omite en la escritura formal delante de variables solas.
  - **Coeficiente fraccionario**: Número racional $\frac{p}{q}$ que actúa como multiplicador escalar del término.
propiedades_relaciones: |
  - **Suma de términos semejantes**: Al reducir términos con idéntica parte literal, se suman algebraicamente sus coeficientes numéricos: $c_1 X + c_2 X = (c_1 + c_2)X$.
  - **Producto de términos**: Al multiplicar monomios, los coeficientes numéricos se multiplican directamente entre sí: $(c_1 X_1)(c_2 X_2) = (c_1 c_2)(X_1 X_2)$.
ejemplo_guiado:
  enunciado: 'Identifica el coeficiente numérico de cada uno de los siguientes términos: a) $-9x^4y$, b) $m^2n^3$, c) $-z$, d) $\frac{2a^3}{7}$.'
  imagen: '/static/img/nodos/identificacion-del-coeficiente-numerico-ejemplos.svg'
  pasos:
    - 'Paso 1: En $-9x^4y$, el número multiplicador con su signo es **$-9$**.'
    - 'Paso 2: En $m^2n^3$, no hay número escrito, por lo que el coeficiente tácito es **$1$**.'
    - 'Paso 3: En $-z$, figura únicamente el signo menos, por lo que el coeficiente es **$-1$**.'
    - 'Paso 4: En $\frac{2a^3}{7}$, extraemos la fracción numérica multiplicadora: $\frac{2}{7} \cdot a^3$, por lo que el coeficiente es **$\frac{2}{7}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el coeficiente numérico del término algebraico $-x^2y$?'
    choices:
      - text: '$-1$'
        is_correct: true
      - text: '$0$'
        is_correct: false
      - text: '$1$'
        is_correct: false
      - text: '$-2$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$-1$''. La presencia del signo menos sin número explícito denota un coeficiente unitario negativo $-1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término $\frac{x^3}{4}$, ¿cuál es el coeficiente numérico?'
    choices:
      - text: '$\frac{1}{4}$'
        is_correct: true
      - text: '$4$'
        is_correct: false
      - text: '$3$'
        is_correct: false
      - text: '$\frac{3}{4}$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$\frac{1}{4}$''. Dividir por 4 equivale a multiplicar por la fracción escalar $\frac{1}{4}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Separar la parte numérica de las letras en el término.'
  - 'Paso 2: Si no figura ningún número escrito, asignar $1$ si el término es positivo o $-1$ si es negativo.'
  - 'Paso 3: Si las letras están divididas por un número $k$, escribir el coeficiente como fracción $\frac{1}{k}$ o $\frac{p}{q}$.'
  - 'Paso 4: Conservar el signo correspondiente junto al número.'
errores_correccion: |
  - **Error 1:** Afirmar que el coeficiente de $x^3$ es 0. **Cómo corregirlo:** Si el coeficiente fuera 0, el término valdría $0 \cdot x^3 = 0$. El coeficiente es **$1$**.
  - **Error 2:** Omitir el denominador en términos como $\frac{5x}{2}$. **Cómo corregirlo:** El coeficiente es la fracción completa **$\frac{5}{2}$**, no solo el numerador $5$.
ejemplos:
  - titulo: 'Coeficiente en monomio fraccionario'
    enunciado: '¿Cuál es el coeficiente numérico del término $-\frac{3x^2y}{8}$?'
    alternativas:
      - '$-\frac{3}{8}$'
      - '$-3$'
      - '$\frac{3}{8}$'
    respuesta: '$-\frac{3}{8}$'
    solucion_pasos:
      - '1. Se extrae la fracción constante con su signo: $-\frac{3}{8}$.'
      - '2. La parte literal es $x^2y$.'
      - '3. El coeficiente es $-\frac{3}{8}$.'
  - titulo: 'Suma de términos semejantes'
    enunciado: 'Al reducir $4a^2 - 7a^2$, ¿cuál es el coeficiente numérico del resultado?'
    alternativas:
      - '$-3$'
      - '$3$'
      - '$-11$'
    respuesta: '$-3$'
    solucion_pasos:
      - '1. Se restan algebraicamente los coeficientes: $4 - 7 = -3$.'
      - '2. El término resultante es $-3a^2$, con coeficiente $-3$.'
  - titulo: 'Coeficiente unitario'
    enunciado: '¿Es el coeficiente numérico del término $ab^2c$ igual a 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. No hay número escrito explícitamente.'
      - '2. Por convención, el factor multiplicativo neutro es 1.'
  - titulo: 'Coeficiente nulo'
    enunciado: '¿Puede un término algebraico existente en una expresión reducida tener un coeficiente numérico igual a 0?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Cualquier cantidad multiplicada por 0 se anula ($0 \cdot X = 0$).'
      - '2. Un término con coeficiente 0 no existe en la expresión.'
errores_frecuentes:
  - 'Creer que una variable sin número explícito ($x$) tiene coeficiente numérico igual a 0.'
  - 'Omitir el denominador al identificar el coeficiente en fracciones como $\frac{x}{3}$ (decir 1 en vez de $\frac{1}{3}$).'
  - 'Separar el signo negativo del coeficiente numérico al enunciar su valor.'
  - 'Confundir el coeficiente numérico con el exponente de la variable ($3x$ confundido con $x^3$).'
  - 'Sumar los exponentes a los coeficientes al realizar una reducción de términos semejantes.'
afirmaciones_verdaderas:
  - 'El coeficiente numérico es el factor escalar constante que multiplica a la parte literal de un término.'
  - 'En todo término sin número escrito delante de las variables, el coeficiente numérico es 1 (o -1 si lleva signo menos).'
al_terminar_debes_poder: |
  ![Resumen de Coeficiente Numérico](/static/img/nodos/identificacion-del-coeficiente-numerico-resumen.svg)

  QUÉ: Identificar, extraer y operar el coeficiente numérico de cualquier término algebraico, reconociendo coeficientes enteros, fraccionarios y unitarios tácitos.
  CÓMO: Aislando el factor escalar constante con su signo ($c \in \mathbb{R}$) en términos como $-6x^3y \implies -6$, $a^2b \implies 1$ y $-\frac{2}{3}x^2 \implies -\frac{2}{3}$.
