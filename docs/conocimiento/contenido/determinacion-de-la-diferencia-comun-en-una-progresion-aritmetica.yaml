  QUÉ: Determinar la diferencia común $d$ de una progresión aritmética a partir de términos consecutivos o distantes.
  CÓMO: Aplicar el cociente de incrementos $d = \frac{a_q - a_p}{q - p}$ preservando los signos algebraicos de la variación.
