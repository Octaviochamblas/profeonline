semantic_id: MAT.NUM.PROG_ARITMETICA.DIFERENCIA_COMUN
resumen_inicial: 'Determinación de la diferencia común en una progresión aritmética: concepto
  y desarrollo dentro de Progresión aritmética.'
explicacion_simple: Si la Progresión Aritmética es un vehículo, la Diferencia Común 'd' es
  su motor. Nos dice a qué velocidad avanza la fila de números y, lo más importante, si va
  hacia adelante o en reversa.
explicacion_formal: 'El cálculo de la diferencia **$d$** es matemáticamente muy sencillo,
  pero es la principal causa de error en las pruebas por descuidos con los signos.


  **Regla de Oro:** Siempre toma el término de la DERECHA y réstale el de la IZQUIERDA. NUNCA
  al revés.

  - P.A: $12, 17, 22\dots$ $\rightarrow$ $d = 17 - 12 = 5$.

  - P.A: $8, 5, 2\dots$ $\rightarrow$ $d = 5 - 8 = -3$. (¡Es negativo!)

  - P.A con negativos: $-10, -6, -2\dots$ $\rightarrow$ $d = -6 - (-10) = -6 + 10 = 4$.


  Es recomendable hacer la resta con dos pares de números distintos (ej. $a_2 - a_1$ y luego
  $a_3 - a_2$) para comprobar que no te hayas equivocado en una resta básica.'
definiciones_clave: '- **Determinación de la diferencia común en una progresión aritmética**:
  Concepto fundamental dentro del estudio de Progresión aritmética.'
propiedades_relaciones: '- **Propiedades de Determinación de la diferencia común en una progresión
  aritmética**: Relaciones de cambio y fórmulas estructurales de progresión aritmética.'
ejemplo_guiado:
  enunciado: Calcula la diferencia común de la progresión aritmética -8, -3, 2, 7.
  pasos:
  - 'Tomo el segundo término menos el primero: -3 menos (-8) es igual a -3 más 8, o sea 5.'
  - 'Compruebo con el tercero menos el segundo: 2 menos (-3) es igual a 2 más 3, o sea 5.'
  - La diferencia común es d igual a 5.
checkpoints:
