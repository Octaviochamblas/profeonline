semantic_id: MAT.NUM.PROG_ARITMETICA.DIFERENCIA_COMUN
resumen_inicial: 'La determinación de la diferencia común $d$ calcula la tasa de cambio aditiva constante como la resta entre términos consecutivos $d = a_{n+1} - a_n$ o mediante la razón $d = \frac{a_q - a_p}{q - p}$.'
explicacion_simple: |
  La **diferencia común** ($d$) es el tamaño del paso entre los números de la progresión:
  - Si tienes términos seguidos: simplemente restas el de la derecha menos el de la izquierda:
    $$d = a_2 - a_1$$
  - Si tienes términos separados (por ejemplo, el término 3 y el término 7): divides la diferencia de sus valores entre la distancia de sus posiciones:
    $$d = \frac{a_7 - a_3}{7 - 3}$$
  - Si los números van subiendo, $d$ es positiva ($+$); si van bajando, $d$ es negativa ($-$).

  ![Determinación de la diferencia común](/static/img/nodos/determinacion-de-la-diferencia-comun-en-una-progresion-aritmetica-intro.svg?v=2)
explicacion_formal: |
  ### Definición formal
  En una progresión aritmética $(a_n)_{n \ge 1}$, la **diferencia común ($d$)** es el invariante aditivo definido por:
  $$d = a_{k+1} - a_k \quad \forall k \in \mathbb{N}$$

  ### Fórmula General para Términos No Consecutivos
  Dados dos términos cualesquiera $a_p$ y $a_q$ con índices $p, q \in \mathbb{N}$ ($q \neq p$):
  $$a_q = a_p + (q - p)d \implies d = \frac{a_q - a_p}{q - p}$$
  Esta fórmula corresponde a la pendiente discreta de la recta que conecta los puntos $(p, a_p)$ y $(q, a_q)$ en el plano cartesiano.

  ### Propiedades del Signo
  - $a_q > a_p$ para $q > p \implies d > 0$ (Creciente).
  - $a_q < a_p$ para $q > p \implies d < 0$ (Decreciente).

  ### Síntesis didáctica
  - Caso consecutivo: $d = a_2 - a_1$.
  - Caso general: $d = \frac{a_q - a_p}{q - p}$.
definiciones_clave: |
  - **Diferencia común ($d$)**: Valor constante que se suma a cada término para generar el siguiente.
  - **Pendiente discreta**: Cociente entre la variación de los valores y la variación de las posiciones ordinales.
  - **Términos no consecutivos**: Términos de la sucesión separados por más de una posición ($q - p > 1$).
propiedades_relaciones: |
  - **Invarianza de cálculo**: La diferencia común calculada entre cualquier par de términos congruentes produce exactamente el mismo valor real $d$.
  - **Número de pasos aditivos**: Entre $a_p$ y $a_q$ existen exactamente $q - p$ adiciones de la diferencia $d$.
ejemplo_guiado:
  enunciado: 'En una progresión aritmética, el tercer término es $a_3 = 11$ y el séptimo término es $a_7 = 27$. Determina el valor de la diferencia común $d$ y clasifica la progresión.'
  imagen: '/static/img/nodos/determinacion-de-la-diferencia-comun-en-una-progresion-aritmetica-ejemplos.svg?v=2'
  pasos:
    - 'Paso 1: Identificamos los datos: $p = 3, a_3 = 11, q = 7, a_7 = 27$.'
    - 'Paso 2: Aplicamos la fórmula para términos distantes: $d = \frac{a_7 - a_3}{7 - 3}$.'
    - 'Paso 3: Sustituimos los valores numéricos: $d = \frac{27 - 11}{4} = \frac{16}{4} = 4$.'
    - 'Paso 4: Como $d = 4 > 0$, la diferencia común es **$d = 4$** y la progresión es creciente.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la diferencia común $d$ a partir de dos términos distantes $a_p$ y $a_q$ ($q > p$)?'
    choices:
      - {text: '$d = \frac{a_q - a_p}{q - p}$', is_correct: true}
      - {text: '$d = \frac{a_q + a_p}{q + p}$', is_correct: false}
      - {text: '$d = (a_q - a_p) \cdot (q - p)$', is_correct: false}
      - {text: '$d = a_q - a_p$', is_correct: false}
    explanation: 'La alternativa correcta es ''$d = \frac{a_q - a_p}{q - p}$''. Representa la razón entre el incremento del valor y la distancia entre posiciones.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la progresión $(18, 14, 10, 6, \dots)$, ¿cuál es el valor de la diferencia común $d$?'
    choices:
      - {text: '$-4$, calculando $14 - 18 = -4$', is_correct: true}
      - {text: '$+4$, restando en orden invertido$', is_correct: false}
      - {text: '$-2$', is_correct: false}
      - {text: '$18$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-4$, calculando $14 - 18 = -4$''. Al ser decreciente, la resta del segundo término menos el primero da $14 - 18 = -4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los términos dados y sus respectivas posiciones $(p, a_p)$ y $(q, a_q)$.'
  - 'Paso 2: Restar los valores de los términos: $\Delta a = a_q - a_p$.'
  - 'Paso 3: Restar las posiciones ordinales correspondientes: $\Delta n = q - p$.'
  - 'Paso 4: Dividir $\Delta a / \Delta n$ para obtener el valor de la diferencia común $d$.'
errores_correccion: |
  - **Error 1:** Restar el término mayor menos el menor sin respetar el orden de los subíndices (perdiendo el signo negativo). **Cómo corregirlo:** La resta debe mantener el orden estricto **$a_q - a_p$ dividido por $q - p$**.
  - **Error 2:** Dividir los términos ($a_2 / a_1$) creyendo que la diferencia es un cociente. **Cómo corregirlo:** En progresiones aritméticas **la diferencia se obtiene restando**, no dividiendo.
ejemplos:
  - titulo: 'Diferencia con términos consecutivos'
    enunciado: 'Para la PA $(5, 12, 19, 26)$, ¿cuál es la diferencia común?'
    alternativas:
      - '$7$'
      - '$5$'
      - '$-7$'
    respuesta: '$7$'
    solucion_pasos:
      - '1. $d = a_2 - a_1 = 12 - 5 = 7$.'
  - titulo: 'Diferencia con términos separados'
    enunciado: 'Si $a_2 = 10$ y $a_6 = 22$, ¿cuál es la diferencia común $d$?'
    alternativas:
      - '$3$'
      - '$4$'
      - '$12$'
    respuesta: '$3$'
    solucion_pasos:
      - '1. $d = (22 - 10) / (6 - 2) = 12 / 4 = 3$.'
  - titulo: 'Diferencia negativa'
    enunciado: 'Si $a_1 = 30$ y $a_4 = 18$, ¿la diferencia común es $d = -4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $d = (18 - 30) / (4 - 1) = -12 / 3 = -4$.'
  - titulo: 'Diferencia fraccionaria'
    enunciado: 'Para $a_1 = 1$ y $a_3 = 2$, ¿la diferencia común es $d = \frac{1}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $d = (2 - 1) / (3 - 1) = 1/2$.'
errores_frecuentes:
  - 'La diferencia común se calcula dividiendo el término posterior entre el término anterior en una progresión aritmética.'
  - 'Al calcular $d$ entre términos no consecutivos se omite dividir por la distancia entre las posiciones $q - p$.'
  - 'La diferencia común de una progresión decreciente se considera positiva suprimiendo el signo menos.'
  - 'La diferencia común calculada entre los términos $a_1$ y $a_2$ puede ser distinta a la calculada entre $a_5$ y $a_6$ en una misma PA.'
  - 'La diferencia común $d$ no puede ser un número fraccionario.'
afirmaciones_verdaderas:
  - 'La diferencia común en una PA se calcula mediante $d = \frac{a_q - a_p}{q - p}$ para cualquier par de términos con posiciones $q \neq p$.'
  - 'La diferencia común $d$ es numéricamente igual a la pendiente de la recta discreta que modela a la progresión aritmética.'
