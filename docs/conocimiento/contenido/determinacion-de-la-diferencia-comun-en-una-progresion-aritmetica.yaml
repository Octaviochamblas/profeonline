semantic_id: MAT.NUM.PROG_ARITMETICA.DIFERENCIA_COMUN
resumen_inicial: 'La determinación de la diferencia común $d$ en una progresión aritmética se calcula mediante la resta directa entre dos términos consecutivos ($d = a_{n+1} - a_n$) o a partir de dos términos no consecutivos arbitrarios: $d = \frac{a_k - a_m}{k - m}$.'
explicacion_simple: |
  Para hallar la **diferencia común ($d$)** de una progresión aritmética:
  - Si tienes términos seguidos (por ejemplo, el término 3 que vale 11 y el término 4 que vale 15):
    Simplemente restas el posterior menos el anterior: $d = 15 - 11 = 4$.
  - Si los términos **no están seguidos** (por ejemplo, sabes que el término $a_2 = 8$ y el término $a_6 = 20$):
    Divides la resta de sus valores entre la resta de sus posiciones:
    $$d = \frac{a_6 - a_2}{6 - 2} = \frac{20 - 8}{4} = \frac{12}{4} = 3$$
explicacion_formal: |
  ### Definición formal
  La **diferencia común $d$** es la pendiente de cambio constante de una progresión aritmética.

  ### Métodos de Cálculo
  1. **A partir de términos consecutivos**:
     $$d = a_{n+1} - a_n \quad (\forall n \ge 1)$$
  2. **A partir de dos términos arbitrarios $a_m$ y $a_k$ (con $k \neq m$)**:
     Dado que $a_k = a_1 + (k-1)d$ y $a_m = a_1 + (m-1)d$:
     $$a_k - a_m = (k - m)d \implies d = \frac{a_k - a_m}{k - m}$$

  ### Propiedad de la Pendiente Lineal
  El valor de $d$ coincide exactamente con la pendiente $m$ de la función afín $f(x) = dx + (a_1 - d)$ que interpola la progresión en los números reales.

  ### Síntesis didáctica
  - Términos consecutivos: $d = a_{n+1} - a_n$.
  - Términos distantes: $d = \frac{a_k - a_m}{k - m}$.
definiciones_clave: |
  - **Diferencia común ($d$)**: Constante aditiva que marca el incremento o decremento por período en una P.A.
  - **Intervalo posicional ($k - m$)**: Cantidad de saltos o pasos existentes entre las posiciones $m$ y $k$.
  - **Variación de valor ($a_k - a_m$)**: Cambio numérico acumulado entre los términos $a_m$ y $a_k$.
propiedades_relaciones: |
  - **Invarianza del cociente**: La razón $\frac{a_k - a_m}{k - m}$ entrega exactamente la misma cifra $d$ independientemente del par de términos elegidos.
  - **Relación con la diferencia en $N$ pasos**: Para avanzar $N$ casillas en la progresión, se debe sumar $N \cdot d$ al término inicial: $a_{m+N} = a_m + N \cdot d$.
ejemplo_guiado:
  enunciado: 'En una progresión aritmética se conoce que el tercer término es $a_3 = 14$ y el octavo término es $a_8 = 39$. Determina el valor de la diferencia común $d$.'
  pasos:
    - 'Paso 1: Identificamos los datos: $m=3, a_3=14$ y $k=8, a_8=39$.'
    - 'Paso 2: Aplicamos la fórmula para términos no consecutivos: $d = \frac{a_8 - a_3}{8 - 3}$.'
    - 'Paso 3: Restamos los valores en el numerador: $a_8 - a_3 = 39 - 14 = 25$.'
    - 'Paso 4: Restamos las posiciones en el denominador: $8 - 3 = 5$. Dividimos: $d = \frac{25}{5} = 5$. La diferencia común es **$d = 5$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la diferencia común $d$ dados dos términos no consecutivos $a_m$ y $a_k$?'
    choices:
      - {text: 'Dividir la resta de los valores entre la resta de sus posiciones ($d = \frac{a_k - a_m}{k - m}$)', is_correct: true}
      - {text: 'Multiplicar los valores de ambos términos y dividir por 2', is_correct: false}
      - {text: 'Sumar las posiciones $k+m$ y restar el primer término', is_correct: false}
      - {text: 'Elevar el segundo término al cuadrado y restar el primero', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir la resta de los valores entre la resta de sus posiciones ($d = \frac{a_k - a_m}{k - m}$)''. Sale de aislar $d$ en $a_k - a_m = (k-m)d$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una progresión aritmética $a_2 = 10$ y $a_5 = 22$, ¿cuál es el valor de la diferencia común $d$?'
    choices:
      - {text: '$d = 4$, calculando $\frac{22 - 10}{5 - 2} = \frac{12}{3} = 4$', is_correct: true}
      - {text: '$d = 12$, restando únicamente los valores', is_correct: false}
      - {text: '$d = 3$, dividiendo entre el número de posición', is_correct: false}
      - {text: '$d = 6$, calculando la mitad de 12', is_correct: false}
    explanation: 'La alternativa correcta es ''$d = 4$, calculando $\frac{22 - 10}{5 - 2} = \frac{12}{3} = 4$''. $d = 12 / 3 = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si los términos proporcionados son consecutivos o distantes.'
  - 'Paso 2: Para términos consecutivos, calcular $d = a_{n+1} - a_n$.'
  - 'Paso 3: Para términos distantes $a_m$ y $a_k$, calcular la variación de valor $(a_k - a_m)$ y el intervalo de posiciones $(k - m)$.'
  - 'Paso 4: Calcular el cociente $d = \frac{a_k - a_m}{k - m}$ asegurando la coherencia de signos.'
errores_correccion: |
  - **Error 1:** Invertir las posiciones en el denominador al calcular términos distantes (ej: hacer $\frac{a_8 - a_3}{3 - 8}$). **Cómo corregirlo:** El orden en el denominador debe coincidir exactamente con el numerador: **$d = \frac{a_k - a_m}{k - m}$**.
  - **Error 2:** Dividir por la posición $k$ en lugar de la diferencia de posiciones $(k-m)$. **Cómo corregirlo:** Se debe **restar las dos posiciones en el denominador: $k - m$**.
ejemplos:
  - titulo: 'Diferencia con consecutivos'
    enunciado: 'Si $a_4 = 18$ y $a_5 = 23$, ¿la diferencia es $d = 23 - 18 = 5$?'
    alternativas:
      - 'Sí, restando el término 5 menos el término 4'
      - 'No, la diferencia es 18'
      - 'No, la diferencia es 23'
    respuesta: 'Sí, restando el término 5 menos el término 4'
    solucion_pasos:
      - '1. Aplicamos $d = a_5 - a_4$.'
      - '2. $d = 23 - 18 = 5$.'
  - titulo: 'Diferencia con términos distantes'
    enunciado: 'Si $a_1 = 4$ y $a_4 = 16$, ¿la diferencia es $d = \frac{16 - 4}{4 - 1} = \frac{12}{3} = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $d = 12 / 3 = 4$.'
  - titulo: 'Diferencia negativa con distantes'
    enunciado: 'Si $a_2 = 20$ y $a_6 = 8$, ¿la diferencia es $d = \frac{8 - 20}{6 - 2} = \frac{-12}{4} = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $d = -12 / 4 = -3$.'
  - titulo: 'Diferencia nula'
    enunciado: 'Si $a_3 = 7$ y $a_9 = 7$, ¿la diferencia es $d = \frac{7 - 7}{9 - 3} = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0 / 6 = 0$.'
errores_frecuentes:
  - 'Invertir el orden del subíndice en el denominador distorsionando el signo de la diferencia común.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Dividir el valor del término distante por su posición sin restar el término inicial.'
  - 'La diferencia entre términos no consecutivos es siempre un número entero positivo.'
afirmaciones_verdaderas:
  - 'La diferencia común en una P.A. dados dos términos distantes $a_m$ y $a_k$ es $d = \frac{a_k - a_m}{k - m}$.'
  - 'El valor de la diferencia común $d$ puede ser positivo, negativo o igual a cero.'
