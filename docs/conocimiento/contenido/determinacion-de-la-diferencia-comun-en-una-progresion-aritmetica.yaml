resumen_inicial: 'La diferencia común $d$ en una progresión aritmética se determina
  restando cualquier término conocido de su término inmediatamente posterior: $d =
  a_{n+1} - a_n = \frac{a_k - a_m}{k - m}$.'
explicacion_simple: La diferencia común es la distancia que hay entre dos números
  seguidos de la secuencia. Para hallarla basta con tomar un número de la lista y
  restarle el número que estaba justo antes de él.
explicacion_formal: 'En una P.A., la **Diferencia Común $d$** se calcula a partir
  de dos términos consecutivos o dos términos arbitrarios $a_k$ y $a_m$:


  $$d = a_{n+1} - a_n$$


  $$\text{Fórmula generalizada de diferencia: } d = \frac{a_k - a_m}{k - m} \quad
  (k \neq m)$$'
definiciones_clave: '- **Diferencia común $d$**: Valor escalar $d = \frac{a_k - a_m}{k
  - m}$ que determina el incremento por paso.'
propiedades_relaciones: '- **Pendiente discreta**: $d$ equivale a la pendiente de
  la recta discreta que une las posiciones.'
ejemplo_guiado:
  enunciado: En una P.A. se sabe que el tercer término es $a_3 = 12$ y el séptimo
    término es $a_7 = 28$. Calcule la diferencia común $d$.
  pasos:
  - 'Paso 1: Aplicar la fórmula generalizada de diferencia: $d = \frac{a_7 - a_3}{7
    - 3}$.'
  - 'Paso 2: Sustituir los valores conocidos: $d = \frac{28 - 12}{4} = \frac{16}{4}
    = 4$.'
  - 'Conclusión: La diferencia común es $d = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la diferencia común d dados dos términos
    am y ak?
  choices:
  - text: d = (ak - am) / (k - m)
    is_correct: true
  - text: d = (ak + am) / 2
    is_correct: false
  - text: d = ak · am
    is_correct: false
  - text: d = k - m
    is_correct: false
  explanation: La alternativa correcta es 'd = (ak - am) / (k - m)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a3 = 12 y a7 = 28, ¿cuál fue la diferencia d
    obtenida?
  choices:
  - text: d = 4
    is_correct: true
  - text: d = 16
    is_correct: false
  - text: d = 8
    is_correct: false
  - text: d = 2
    is_correct: false
  explanation: La alternativa correcta es 'd = 4'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de determinar la diferencia común
  $d = \frac{a_k - a_m}{k - m}$ a partir de dos términos conocidos cualesquiera.
semantic_id: MAT.NUM.PROG_ARITMETICA.DIFERENCIA_COMUN
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.DIFERENCIA_COMUN.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
