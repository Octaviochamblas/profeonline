  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica dos números consecutivos en la progresión (ojalá los más fáciles, sin
  fracciones o números grandes si es posible).'
- 'Paso 2: Al número que está más a la derecha, réstale el número que está a su izquierda.'
- 'Paso 3: Respeta la ley de los signos si el número de la izquierda es negativo (terminarás
  sumando).'
- 'Paso 4: El resultado de esa resta es ''d''.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en determinación de la diferencia común en una progresión aritmética.
ejemplos:
- titulo: Cuidado con los negativos
  enunciado: 'Calcula la diferencia de la P.A: 5, 1, -3, -7...'
  solucion_pasos:
  - 'Tomamos a2=1 y a1=5. Restamos: 1 - 5 = -4.'
  - 'Comprobamos con a3=-3 y a2=1. Restamos: -3 - 1 = -4.'
  - 'Comprobamos con a4=-7 y a3=-3. Restamos: -7 - (-3) = -7 + 3 = -4.'
  - La diferencia d es -4.
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la diferencia común de 4, 1, -2, -5?
  alternativas:
  - '-3'
  - '3'
  - '-2'
  respuesta: '-3'
  solucion_pasos:
  - 1 menos 4 es igual a -3.
- titulo: Ejemplo 2
  enunciado: En la progresión -10, -6, -2, ¿cuál es la diferencia d?
  alternativas:
  - '4'
  - '-4'
  - '6'
  respuesta: '4'
  solucion_pasos:
  - -6 menos (-10) es igual a -6 más 10, o sea 4.
- titulo: ¿La diferencia d puede ser un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Ocurre cuando la progresión es decreciente, como en 20, 15, 10, con d igual a -5.
- titulo: ¿Se puede calcular d restando el primer término menos el segundo?
  respuesta: 'No'
  solucion_pasos:
  - Siempre se resta el término de la derecha menos el de la izquierda, en ese orden.
errores_frecuentes:
- Restar el número mayor menos el menor, sin importar su orden (ej. en 10, 8, 6, restar 10-8=2
  en lugar de 8-10=-2).
- Olvidar los paréntesis al restar un número negativo, transformando $5 - (-2)$ en $5 - 2$.
- Olvidar el paréntesis al restar un término negativo, cambiando el signo del resultado.
- Calcular la diferencia usando términos que no son consecutivos.
- Invertir el orden de la resta al trabajar con números negativos.
afirmaciones_verdaderas:
- La formulación de determinación de la diferencia común en una progresión aritmética mantiene
  la regularidad de la sucesión.
- La diferencia común de una progresión aritmética puede calcularse restando cualquier par
  de términos consecutivos.
al_terminar_debes_poder: Resolver problemas prácticos utilizando determinación de la diferencia
  común en una progresión aritmética.
