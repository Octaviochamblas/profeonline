semantic_id: MAT.GEO.RECTA_RELACIONES.RECTAS_COINCIDENTES
resumen_inicial: 'Identificación de rectas coincidentes a partir de ecuaciones equivalentes:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Dos ecuaciones que parecen distintas pueden en realidad describir
  exactamente la misma recta, si sus coeficientes son proporcionales entre sí.
explicacion_formal: '![Rectas coincidentes](/static/img/geometria/analitica/rectarel-rectas-coincidentes.svg)


  ### Definición formal


  Dos rectas son coincidentes si una ecuación se obtiene multiplicando la otra por
  una constante no nula, es decir, si tienen la misma pendiente y el mismo coeficiente
  de posición.


  ### Desarrollo didáctico


  Las ecuaciones $2x-2y+2=0$ y $x-y+1=0$ representan la misma recta, ya que la primera
  es exactamente el doble de la segunda; ambas equivalen a $y=x+1$.'
definiciones_clave: '- **Identificación de rectas coincidentes a partir de ecuaciones
