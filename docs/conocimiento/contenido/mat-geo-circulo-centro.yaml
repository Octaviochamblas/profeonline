- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del centro de una circunferencia
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
