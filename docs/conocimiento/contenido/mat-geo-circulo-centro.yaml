semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CENTRO
resumen_inicial: 'Identificación del centro de una circunferencia: conceptos, teoremas,
  propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: El centro es el primer y más fundamental elemento de una circunferencia,
  del cual se derivan todos los demás.
explicacion_formal: '![Centro de una circunferencia](/static/img/geometria/circunferencia-circulo/circulo-centro.svg)


  ### Definición formal


  El centro $O$ de una circunferencia es el único punto del plano que cumple $\overline{OP}=r$
  para todo punto $P$ de la circunferencia, donde $r$ es el radio.


  ### Desarrollo didáctico


  El centro no es un punto de la circunferencia misma, sino un punto interior de referencia;
  de hecho, es el único punto del círculo que está exactamente a la misma distancia
  de cualquier punto del borde.'
definiciones_clave: '- **Identificación del centro de una circunferencia**: Elemento
  o propiedad fundamental en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del centro de una circunferencia.'
