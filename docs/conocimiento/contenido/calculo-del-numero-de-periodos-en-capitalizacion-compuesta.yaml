resumen_inicial: 'El cálculo del número de períodos $n$ despeja el exponente temporal
  aplicando logaritmos a la ecuación de capitalización compuesta: $n = \frac{\log(M/C)}{\log(1
  + i)}$.'
explicacion_simple: Para averiguar cuántos meses o años debemos dejar una inversión
  compuesta para alcanzar una meta de dinero $M$, aplicamos logaritmos dividiendo
  el logaritmo del cociente $(M/C)$ entre el logaritmo del factor $(1+i)$.
explicacion_formal: 'Dada la relación $M = C \cdot (1 + i)^n$, el **Despeje del Número
  de Períodos $n$** mediante logaritmos (base $10$ o natural) se expresa como:


  $$\frac{M}{C} = (1 + i)^n \implies \log\left(\frac{M}{C}\right) = n \cdot \log(1
  + i) \implies n = \frac{\log M - \log C}{\log(1 + i)}$$'
definiciones_clave: '- **Número de períodos $n$**: Despeje logarítmico $n = \frac{\log(M/C)}{\log(1
  + i)}$.'
propiedades_relaciones: '- **Despeje por logaritmo**: La propiedad $\log(a^n) = n
  \log a$ baja el exponente del tiempo.'
ejemplo_guiado:
  enunciado: '¿Cuántos años deben transcurrir para duplicar un capital ($M/C = 2$)
    colocado al $10\%$ compuesto anual ($i=0,10$)? (Datos: $\log 2 \approx 0,3010$,
    $\log 1,10 \approx 0,0414$).'
  pasos:
  - 'Paso 1: Escribir la relación logarítmica: $n = \frac{\log 2}{\log 1,10}$.'
  - 'Paso 2: Sustituir los valores numéricos: $n = \frac{0,3010}{0,0414} \approx 7,27$
    años.'
  - 'Conclusión: El tiempo necesario para duplicar el capital es aproximadamente $7,27$
    años.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula logarítmica para calcular el número de períodos n
    en interés compuesto?
  choices:
  - text: n = log(M / C) / log(1 + i)
    is_correct: true
  - text: n = (M / C) / (1 + i)
    is_correct: false
  - text: n = log(M - C) · i
    is_correct: false
  - text: n = M / (C · i)
    is_correct: false
  explanation: La alternativa correcta es 'n = log(M / C) / log(1 + i)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para duplicar un capital al 10% compuesto anual,
    ¿cuántos años aproximados se requirieron?
  choices:
  - text: 7,27 años
    is_correct: true
  - text: 10 años
    is_correct: false
  - text: 5 años
    is_correct: false
  - text: 20 años
    is_correct: false
  explanation: La alternativa correcta es '7,27 años'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el número de períodos
  de capitalización $n = \frac{\log(M/C)}{\log(1 + i)}$ aplicando propiedades de logaritmos.
semantic_id: MAT.NUM.INTERES_COMPUESTO.NUMERO_PERIODOS
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.NUMERO_PERIODOS.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
