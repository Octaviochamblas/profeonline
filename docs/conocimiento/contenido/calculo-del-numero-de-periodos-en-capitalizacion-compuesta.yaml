procedimiento:
- 'Paso 1: Identifica la duración total de la inversión en años.'
- 'Paso 2: Lee la frecuencia de capitalización (ej. Semestral).'
- 'Paso 3: Multiplica los años por cuántos periodos hay en un año (ej. $x 2$ para semestres).'
- 'Paso 4: El resultado será el número entero que pondrás como exponente.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del número
  de períodos en capitalización compuesta.
ejemplos:
- titulo: Contando los trimestres
  enunciado: Una inversión a 5 años plazo se capitaliza trimestralmente. ¿Cuál será el exponente
    en la fórmula?
  solucion_pasos:
  - Tiempo en años = 5.
  - En un año hay 4 trimestres.
  - Total de periodos (exponente t) = $5 \cdot 4 = 20$.
  - El exponente a usar es 20.
- titulo: Ejemplo 2
  enunciado: Una inversión a 6 años se capitaliza trimestralmente. ¿Cuál es el número de periodos?
  alternativas:
  - '24'
  - '6'
  - '18'
  respuesta: '24'
  solucion_pasos:
  - 6 años por 4 trimestres es igual a 24.
- titulo: Ejemplo 3
  enunciado: Una inversión a 2 años se capitaliza mensualmente. ¿Cuál es el número de periodos?
  alternativas:
  - '24'
  - '12'
  - '2'
  respuesta: '24'
  solucion_pasos:
  - 2 años por 12 meses es igual a 24.
- titulo: ¿El número de periodos t debe coincidir en frecuencia con la tasa periódica usada?
  respuesta: Sí
  solucion_pasos:
  - Ambos deben expresarse en la misma unidad de tiempo, como meses o trimestres.
errores_frecuentes:
- Poner directamente los 'años' como exponente sin fijarse en la capitalización.
- Confundir trimestral (multiplicar por 4) con cuatrimestral (multiplicar por 3).
- Poner directamente los años como exponente sin ajustar por la frecuencia de capitalización.
- Confundir capitalización trimestral, que multiplica por 4, con cuatrimestral, que multiplica
  por 3.
- Olvidar multiplicar los años por la cantidad de periodos por año al calcular el exponente
  total.
afirmaciones_verdaderas:
- La propiedad de cálculo del número de períodos en capitalización compuesta preserva la consistencia
  lógica.
- El número total de periodos, t, siempre debe estar en la misma frecuencia que la tasa periódica
  usada en la fórmula.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del número de
  períodos en capitalización compuesta.
