semantic_id: MAT.NUM.INTERES_COMPUESTO.NUMERO_PERIODOS
resumen_inicial: 'El cálculo del número de períodos $n$ en capitalización compuesta determina el plazo de inversión resolviendo la ecuación exponencial mediante logaritmos: $n = \frac{\log(M / C)}{\log(1 + i)}$.'
explicacion_simple: |
  Si quieres saber **cuántos años o períodos tardará un dinero $C$ en convertirse en una meta $M$** a una tasa compuesta $i$, debes resolver una ecuación donde la incógnita está en el exponente.
  Para bajar el exponente se usan los **logaritmos**:
  1. Divides el monto final entre el capital ($M / C$) y calculas su logaritmo: $\log(M / C)$.
  2. Calculas el logaritmo del factor de crecimiento: $\log(1 + i)$.
  3. Divides ambos logaritmos: $n = \frac{\log(M / C)}{\log(1 + i)}$.

  ![Cálculo del número de períodos en capitalización compuesta](/static/img/nodos/calculo-del-numero-de-periodos-en-capitalizacion-compuesta-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **número de períodos de capitalización $n$** es la variable temporal discreta que satisface la ecuación exponencial del monto compuesto:
  $$M = C \cdot (1 + i)^n \implies (1 + i)^n = \frac{M}{C}$$
  Aplicando logaritmo decimal o natural a ambos miembros:
  $$\log\left[(1 + i)^n\right] = \log\left(\frac{M}{C}\right) \implies n \cdot \log(1 + i) = \log\left(\frac{M}{C}\right)$$
  Despejando la variable $n$:
  $$n = \frac{\log\left(\frac{M}{C}\right)}{\log(1 + i)} = \frac{\log M - \log C}{\log(1 + i)}$$

  ### Síntesis didáctica
  - Ecuación logarítmica: $n = \frac{\log(M / C)}{\log(1 + i)}$.
  - Propiedad empleada: $\log(x^k) = k \cdot \log(x)$.
definiciones_clave: |
  - **Ecuación exponencial financiera**: Ecuación de la forma $a^n = b$ donde la incógnita es el número de períodos $n$.
  - **Cociente de logaritmos**: Operación que divide dos valores escalares reales para determinar el exponente exacto.
propiedades_relaciones: |
  - **Invariancia de base logarítmica**: El resultado de $n$ es idéntico utilizando logaritmos en base 10 ($\log$) o logaritmos naturales ($\ln$).
  - **Sensibilidad temporal**: Duplicar la tasa de interés $i$ reduce el tiempo necesario $n$ en más del $50\%$ debido a la curvatura exponencial.
ejemplo_guiado:
  enunciado: '¿Cuántos años debe permanecer depositado un capital de $\$100.000$ colocado al $10\%$ anual de interés compuesto para alcanzar un monto final de $\$133.100$?'
  imagen: '/static/img/nodos/calculo-del-numero-de-periodos-en-capitalizacion-compuesta-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $C = 100.000$, $M = 133.100$ e $i = 0,10 \implies 1 + i = 1,10$.'
    - 'Paso 2: Evaluamos la razón de acumulación: $\frac{M}{C} = \frac{133.100}{100.000} = 1,331$.'
    - 'Paso 3: Planteamos la ecuación exponencial: $(1,10)^n = 1,331$.'
    - 'Paso 4: Como $1,331 = (1,10)^3$, o aplicando $n = \frac{\log(1,331)}{\log(1,10)} = 3$. El tiempo requerido es de **$3$ años**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula correcta para calcular el número de períodos $n$ en régimen de interés compuesto?'
    choices:
      - {text: 'Dividir el logaritmo de la razón $M/C$ entre el logaritmo de $(1+i)$ ($n = \frac{\log(M/C)}{\log(1+i)}$)', is_correct: true}
      - {text: 'Dividir el monto entre el producto de capital por tasa ($n = \frac{M}{C \cdot i}$)', is_correct: false}
      - {text: 'Restar los logaritmos $\log(M/C) - \log(1+i)$', is_correct: false}
      - {text: 'Multiplicar la razón $M/C$ por la tasa $i$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir el logaritmo de la razón $M/C$ entre el logaritmo de $(1+i)$ ($n = \frac{\log(M/C)}{\log(1+i)}$)''. Aplicando logaritmos se despeja el exponente $n$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se busca duplicar un capital ($M/C = 2$) al $10\%$ anual compuesto con $\log 2 \approx 0,3010$ y $\log 1,10 \approx 0,0414$, ¿cuántos años se requieren?'
    choices:
      - {text: 'Aproximadamente $7,27$ años ($0,3010 / 0,0414 \approx 7,27$)', is_correct: true}
      - {text: '$10$ años exactos', is_correct: false}
      - {text: '$20$ años', is_correct: false}
      - {text: '$2$ años', is_correct: false}
    explanation: 'La alternativa correcta es ''Aproximadamente $7,27$ años ($0,3010 / 0,0414 \approx 7,27$)''. $n = 0,3010 / 0,0414 \approx 7,27\text{ años}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar capital inicial $C$, monto deseado $M$ y tasa periódica $i$.'
  - 'Paso 2: Calcular la razón de crecimiento $\frac{M}{C}$ y la base $(1 + i)$.'
  - 'Paso 3: Aplicar logaritmos a ambos términos: $\log(M/C)$ y $\log(1+i)$.'
  - 'Paso 4: Dividir los valores logarítmicos para obtener $n = \frac{\log(M/C)}{\log(1+i)}$.'
errores_correccion: |
  - **Error 1:** Restar los logaritmos creyendo que $\frac{\log A}{\log B} = \log A - \log B$. **Cómo corregirlo:** La resta de logaritmos equivale al logaritmo del cociente $\log(A/B)$; **la división $\frac{\log A}{\log B}$ es una división escalar normal**.
  - **Error 2:** Despejar $n$ mediante la fórmula de interés simple $n = \frac{M-C}{C \cdot i}$. **Cómo corregirlo:** La incógnita $n$ se encuentra en el exponente y **requiere obligatoriamente logaritmos**.
ejemplos:
  - titulo: 'Plazo con potencia entera'
    enunciado: '¿Cuántos años toma transformar $\$50.000$ en $\$60.500$ al $10\%$ anual compuesto?'
    alternativas:
      - '$2$ años'
      - '$3$ años'
      - '$1$ año'
    respuesta: '$2$ años'
    solucion_pasos:
      - '1. $60.500 / 50.000 = 1,21$.'
      - '2. $(1,10)^n = 1,21 = (1,10)^2 \implies n = 2\text{ años}$.'
  - titulo: 'Tiempo para duplicar al 10%'
    enunciado: 'Para duplicar un capital al $10\%$ compuesto, ¿se requieren aproximadamente $7,3$ años?'
    alternativas:
      - 'Sí, pues $n = \log 2 / \log 1,10 \approx 0,3010 / 0,0414 \approx 7,27\text{ años}$'
      - 'No, se requieren exactamente 10 años'
      - 'No, se requieren 5 años'
    respuesta: 'Sí, pues $n = \log 2 / \log 1,10 \approx 0,3010 / 0,0414 \approx 7,27\text{ años}$'
    solucion_pasos:
      - '1. $n = \log 2 / \log 1,10 \approx 7,27\text{ años}$.'
  - titulo: 'Invarianza de base logarítmica'
    enunciado: '¿El cálculo de $n$ entrega el mismo valor exacto utilizando logaritmo natural $\ln$ o logaritmo decimal $\log$?'
    alternativas:
      - 'Sí, debido a la propiedad de cambio de base logarítmica'
      - 'No, el logaritmo natural entrega un valor mayor'
      - 'No, el logaritmo decimal solo aplica a números enteros'
    respuesta: 'Sí, debido a la propiedad de cambio de base logarítmica'
    solucion_pasos:
      - '1. $\frac{\ln(M/C)}{\ln(1+i)} = \frac{\log(M/C)}{\log(1+i)} = \log_{1+i}(M/C)$.'
  - titulo: 'Tiempo para triplicar'
    enunciado: 'Si $\log 3 \approx 0,4771$ y la tasa es $10\%$ ($\log 1,10 \approx 0,0414$), ¿triplicar el capital toma $\approx 11,5$ años?'
    alternativas:
      - 'Sí, pues $0,4771 / 0,0414 \approx 11,52\text{ años}$'
      - 'No, toma 30 años'
      - 'No, toma 3 años'
    respuesta: 'Sí, pues $0,4771 / 0,0414 \approx 11,52\text{ años}$'
    solucion_pasos:
      - '1. $n = 0,4771 / 0,0414 \approx 11,52\text{ años}$.'
errores_frecuentes:
  - 'El cociente de logaritmos $\frac{\log(M/C)}{\log(1+i)}$ se resuelve de forma incorrecta como la resta $\log(M/C) - \log(1+i)$.'
  - 'El tiempo $n$ a interés compuesto se despeja dividiendo directamente el monto por el producto del capital y la tasa.'
  - 'El tiempo de duplicación a interés compuesto es numéricamente igual a $100$ dividido por la tasa porcentual.'
  - 'La aplicación de logaritmos a ambos lados de la ecuación altera el orden de magnitud de la solución.'
  - 'El cálculo del número de períodos omite la división entre el logaritmo de la base $(1+i)$.'
afirmaciones_verdaderas:
  - 'El número de períodos a interés compuesto se calcula mediante el cociente logarítmico $n = \frac{\log(M / C)}{\log(1 + i)}$.'
  - 'La propiedad logarítmica $\log[(1+i)^n] = n \cdot \log(1+i)$ permite transformar la ecuación exponencial en una ecuación lineal.'
