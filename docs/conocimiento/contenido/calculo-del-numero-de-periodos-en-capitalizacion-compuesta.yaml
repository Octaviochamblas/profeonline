semantic_id: MAT.NUM.INTERES_COMPUESTO.NUMERO_PERIODOS
resumen_inicial: 'Cálculo del número de períodos en capitalización compuesta: concepto
  y propiedades fundamentales en Interés compuesto.'
explicacion_simple: ¿Qué pasa si guardas plata por 5 años, pero el banco te paga los
  intereses cada mes? No puedes poner un '5' en la fórmula. Tienes que pensar cuántas
  veces pasará el camión de los intereses en total.
explicacion_formal: 'Al igual que tuvimos que ajustar la tasa, **debemos ajustar el
  tiempo** en la fórmula $M = C(1+i)^t$.


  - La letra $t$ NO significa necesariamente ''años''. Significa **Cantidad Total
  de Períodos**.

  - Si la inversión dura **3 años**, pero la cuenta es capitalizable **mensualmente**,
  significa que el interés se suma 12 veces por año.

  - ¿Cuántas veces se sumará el interés en total durante los 3 años?

  $$t = 3 \text{ años} \cdot 12 \text{ meses/año} = 36 \text{ períodos mensules}.$$


  En la PAES, la clave está en que la tasa periódica ($i_p$) y el exponente total
  de tiempo ($t$) DEBEN estar en la misma frecuencia de tiempo.'
definiciones_clave: '- **Cálculo del número de períodos en capitalización compuesta**:
  Elemento central dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del número de períodos en capitalización compuesta.'
