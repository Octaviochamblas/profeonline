procedimiento:
- 'Paso 1: Identifica la duración total de la inversión en años.'
- 'Paso 2: Lee la frecuencia de capitalización (ej. Semestral).'
- 'Paso 3: Multiplica los años por cuántos periodos hay en un año (ej. $x 2$ para
  semestres).'
- 'Paso 4: El resultado será el número entero que pondrás como exponente.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del
  número de períodos en capitalización compuesta.
ejemplos:
- titulo: Contando los trimestres
  enunciado: Una inversión a 5 años plazo se capitaliza trimestralmente. ¿Cuál será
    el exponente en la fórmula?
  solucion_pasos:
  - Tiempo en años = 5.
  - En un año hay 4 trimestres.
  - Total de periodos (exponente t) = $5 \cdot 4 = 20$.
  - El exponente a usar es 20.
errores_frecuentes:
- Poner directamente los 'años' como exponente sin fijarse en la capitalización.
- Confundir trimestral (multiplicar por 4) con cuatrimestral (multiplicar por 3).
afirmaciones_verdaderas:
- La propiedad de cálculo del número de períodos en capitalización compuesta preserva
  la consistencia lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren cálculo del
  número de períodos en capitalización compuesta.
