semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.AREA_TRIGONOMETRICA
resumen_inicial: 'Cálculo del área de un triángulo mediante dos lados y el ángulo
  comprendido: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  Ampliada.'
explicacion_simple: La fórmula tradicional del área (base por altura dividido en dos)
  requiere conocer la altura, que no siempre es un dato directo; esta fórmula trigonométrica
  la reemplaza usando el ángulo comprendido entre dos lados.
explicacion_formal: '![Área mediante dos lados y el ángulo comprendido](/static/img/geometria/trigonometria/oblicu-area-trigonometrica.svg)


  ### Definición formal


  Si se traza la altura desde el vértice C hasta el lado c (o su prolongación), esa
  altura mide $b\sin A$. Sustituyendo en la fórmula tradicional Área=(base×altura)/2,
  con base $c$, se obtiene $\text{Área}=\dfrac{1}{2}c\cdot b\sin A=\dfrac{1}{2}bc\sin
  A$.


  ### Desarrollo didáctico


  Si $b=8$, $c=10$ y $A=30°$, el área es $\dfrac{1}{2}\times8\times10\times\sin30°=\dfrac{1}{2}\times80\times0{,}5=20$.'
definiciones_clave: '- **Cálculo del área de un triángulo mediante dos lados y el
