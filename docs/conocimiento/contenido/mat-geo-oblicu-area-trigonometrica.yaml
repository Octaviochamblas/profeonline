ejemplo_guiado:
  enunciado: Para analizar cálculo del área de un triángulo mediante dos lados y el
    ángulo comprendido, considera un ángulo $\alpha = 158^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1141^\circ =
    158^\circ$.
  pasos:
  - Identificar la propiedad de cálculo del área de un triángulo mediante dos lados
    y el ángulo comprendido referida a $\alpha = 158^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1141 = 158 \implies x = 158 - 1141$.'
  - Concluir que la medida calculada para cálculo del área de un triángulo mediante
    dos lados y el ángulo comprendido es $x = -983^\circ$.
