semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.PUNTO_INTERIOR_CIRCUNFERENCIA
resumen_inicial: 'Determinación de un punto interior a una circunferencia mediante
  distancia al centro: conceptos, teoremas, propiedades geométricas y cálculo en Geometría
  Analítica Ampliada.'
explicacion_simple: Un punto está dentro de una circunferencia si está más cerca del
  centro que la longitud del radio; esta comparación se puede hacer sin necesidad
  de graficar, solo con la fórmula de distancia.
explicacion_formal: '![Punto interior a una circunferencia](/static/img/geometria/analitica/posrc-punto-interior-circunferencia.svg)


  ### Definición formal


  Un punto es interior a la circunferencia si su distancia al centro es estrictamente
  menor que el radio: $d(P,\text{centro})<r$.


  ### Desarrollo didáctico


  Para la circunferencia $x^2+y^2=16$ (centro (0,0), radio 4) y el punto $P(1,1)$:
  $d=\sqrt{1+1}=\sqrt2\approx1{,}41<4$, por lo que $P$ es interior a la circunferencia.'
