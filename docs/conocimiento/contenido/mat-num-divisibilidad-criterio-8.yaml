  - text: '3.125'
    is_correct: false
  - text: Ninguno de los anteriores
    is_correct: false
  explanation: La alternativa correcta es '3.120'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el beneficio de utilizar el criterio de divisibilidad por 8?
  choices:
  - text: Determinar la divisibilidad exacta sin necesidad de hacer la división larga
    is_correct: true
  - text: Calcular la raíz cuadrada del número
    is_correct: false
  - text: Cambiar el signo del número
    is_correct: false
  - text: Convertir el número a entero negativo
    is_correct: false
  explanation: La alternativa correcta es 'Determinar la divisibilidad exacta sin necesidad de hacer la división larga'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la regla específica del criterio: evaluar las tres últimas cifras.'
- 'Paso 2: Evaluar el resultado simplificado obtenido.'
- 'Paso 3: Concluir que el número es divisible si el resultado simplificado cumple la norma.'
errores_correccion: '- **Error 1: Un número es divisible por 8 si termina en la cifra 8.** **Cómo corregirlo:** Aplicar estrictamente la regla del criterio sobre las cifras especificadas en la definición formal.


  - **Error 2: Confundir los criterios de distintos números.** **Cómo corregirlo:** Memorizar la regla específica de cada divisor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál número es divisible según este criterio?
  alternativas:
  - '3.120'
  - '3.122'
  - '3.125'
  respuesta: '3.120'
  solucion_pasos:
  - Aplicando el criterio se verifica que 3.120 cumple la propiedad.
- titulo: Ejemplo 2
  enunciado: Verifique si la afirmación 'El número 2.000 es divisible por 8.' es verdadera o falsa.
  alternativas:
  - Verdadera
  - Falsa
  - Depende del día
  respuesta: Verdadera
  solucion_pasos:
  - Se aplica el criterio para corroborar la validez de la proposición.
- titulo: ¿Permite este criterio evaluar la divisibilidad sin realizar la división larga?
  respuesta: Sí
  solucion_pasos:
  - Sí, los criterios simplifican el proceso de verificación de divisibilidad.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
- titulo: ¿Aplica la regla de sumar dígitos para el criterio de divisibilidad por 2?
  respuesta: 'No'
  solucion_pasos:
  - No, el criterio del 2 evalúa únicamente la última cifra par, no la suma de dígitos.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
errores_frecuentes:
- Un número es divisible por 8 si termina en la cifra 8.
- Los criterios de divisibilidad se pueden aplicar únicamente a números enteros de dos dígitos.
- El criterio de divisibilidad por 8 requiere realizar la división larga completa en todos los casos.
- Un número impar puede ser divisible por un número par según los criterios de divisibilidad.
- Aplicar un criterio de divisibilidad cambia el valor numérico del número original.
afirmaciones_verdaderas:
- Un número es divisible por 8 si sus tres últimas cifras forman un múltiplo de 8 o son 000.
- Los criterios de divisibilidad permiten verificar la divisibilidad exacta de forma rápida sin hacer la división larga.
al_terminar_debes_ponder: Al terminar serás capaz de aplicar el criterio de divisibilidad por 8, aislando sus tres últimas cifras y verificando que formen un múltiplo de 8 o 000.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
al_terminar_debes_poder: '**QUÉ:** Evaluar la divisibilidad por 8 analizando las tres últimas cifras numéricas.


  **CÓMO:** Comprobando que el bloque de centenas, decenas y unidades forme un múltiplo de 8 o termine en ''000'', o aplicando la combinación lineal rápida $4c + 2d + u \in M(8)$.


  ![Resumen Criterio de divisibilidad por 8](/static/img/nodos/criterio-de-divisibilidad-por-8-resumen.svg)'
