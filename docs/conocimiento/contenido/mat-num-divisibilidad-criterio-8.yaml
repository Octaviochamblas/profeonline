semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_8
resumen_inicial: Un número es divisible por 8 si sus tres últimas cifras forman un
  múltiplo de 8 o son 000.
explicacion_simple: El criterio de divisibilidad por 8 nos permite determinar rápidamente
  si un número entero se puede dividir exactamente por dicho valor sin necesidad de
  realizar la división larga completa. Aplicamos una regla sobre las cifras del número.
explicacion_formal: 'Un entero $n$ es divisible por $8$ si el número formado por sus
  tres últimas cifras $100 a_2 + 10 a_1 + a_0$ es divisible por $8$.


  $$100 a_2 + 10 a_1 + a_0 \equiv 0 \pmod 8$$


  > **Complemento didáctico:** Los criterios de divisibilidad son simplificaciones
  algebraicas basadas en la aritmética modular sobre las potencias de 10.'
definiciones_clave: '- **Criterio de divisibilidad**: Regla rápida sobre las cifras
  de un número para verificar si la división es exacta.'
propiedades_relaciones: '- **Aritmética modular**: Simplificación de cálculos al trabajar
  con residuos de potencias de 10.'
ejemplo_guiado:
  enunciado: Aplique el criterio de divisibilidad por 8 para verificar si la cifra
    dada cumple la condición.
  pasos:
  - 'Paso 1: Identificar el procedimiento del criterio: evaluar las tres últimas cifras.'
  - 'Paso 2: Aplicar la prueba: 3.120 es divisible por 8 porque 120 es múltiplo de
    8 ($120 = 8 \cdot 15$)..'
  - 'Conclusión: El número cumple el criterio de divisibilidad.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de los siguientes números cumple el criterio de divisibilidad por
    8?
  choices:
  - text: '3.120'
    is_correct: true
  - text: '3.122'
    is_correct: false
  - text: '3.125'
    is_correct: false
  - text: Ninguno de los anteriores
    is_correct: false
  explanation: La alternativa correcta es '3.120'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el beneficio de utilizar el criterio de divisibilidad por 8?
  choices:
  - text: Determinar la divisibilidad exacta sin necesidad de hacer la división larga
    is_correct: true
  - text: Calcular la raíz cuadrada del número
    is_correct: false
  - text: Cambiar el signo del número
    is_correct: false
  - text: Convertir el número a entero negativo
    is_correct: false
  explanation: La alternativa correcta es 'Determinar la divisibilidad exacta sin
    necesidad de hacer la división larga'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la regla específica del criterio: evaluar las tres últimas cifras.'
- 'Paso 2: Evaluar el resultado simplificado obtenido.'
- 'Paso 3: Concluir que el número es divisible si el resultado simplificado cumple
  la norma.'
errores_correccion: '- **Error 1: Un número es divisible por 8 si termina en la cifra
  8.** **Cómo corregirlo:** Aplicar estrictamente la regla del criterio sobre las
  cifras especificadas en la definición formal.


  - **Error 2: Confundir los criterios de distintos números.** **Cómo corregirlo:**
  Memorizar la regla específica de cada divisor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál número es divisible según este criterio?
  alternativas:
  - '3.120'
  - '3.122'
  - '3.125'
  respuesta: '3.120'
  solucion_pasos:
  - Aplicando el criterio se verifica que 3.120 cumple la propiedad.
- titulo: Ejemplo 2
  enunciado: Verifique si la afirmación 'El número 2.000 es divisible por 8.' es verdadera
    o falsa.
  alternativas:
  - Verdadera
  - Falsa
  - Depende del día
  respuesta: Verdadera
  solucion_pasos:
  - Se aplica el criterio para corroborar la validez de la proposición.
- titulo: ¿Permite este criterio evaluar la divisibilidad sin realizar la división
    larga?
  respuesta: Sí
  solucion_pasos:
  - Sí, los criterios simplifican el proceso de verificación de divisibilidad.
- titulo: ¿Aplica la regla de sumar dígitos para el criterio de divisibilidad por
    2?
  respuesta: 'No'
  solucion_pasos:
  - No, el criterio del 2 evalúa únicamente la última cifra par, no la suma de dígitos.
errores_frecuentes:
- Un número es divisible por 8 si termina en la cifra 8.
- Los criterios de divisibilidad se pueden aplicar únicamente a números enteros de
  dos dígitos.
- El criterio de divisibilidad por 8 requiere realizar la división larga completa
  en todos los casos.
- Un número impar puede ser divisible por un número par según los criterios de divisibilidad.
- Aplicar un criterio de divisibilidad cambia el valor numérico del número original.
afirmaciones_verdaderas:
- Un número es divisible por 8 si sus tres últimas cifras forman un múltiplo de 8
  o son 000.
- Los criterios de divisibilidad permiten verificar la divisibilidad exacta de forma
  rápida sin hacer la división larga.
al_terminar_debes_ponder: Al terminar serás capaz de aplicar el criterio de divisibilidad
  por 8, aislando sus tres últimas cifras y verificando que formen un múltiplo de
  8 o 000.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
