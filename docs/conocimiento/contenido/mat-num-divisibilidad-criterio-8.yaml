semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_8
resumen_inicial: "Un número es divisible por 8 si sus tres últimas cifras forman un múltiplo de 8, o si termina en 000."
explicacion_simple: |
  Tienes un número gigantesco, como 154.240, y quieres saber si se puede agrupar
  exactamente en grupos de 8. ¡Hacer una división tan larga tomaría mucho tiempo! Por
  suerte, el 8 solo mira sus tres últimas cifras. Si esas tres cifras forman un número
  divisible por 8, ¡todo el número gigante también lo es!
explicacion_formal: |
  Como $1000=8\times125$, cualquier múltiplo de 1000 es divisible por 8. Escribiendo
  $N=$ miles $+$ últimas tres cifras, la parte de los miles siempre es divisible por 8.
  Por lo tanto, la divisibilidad de $N$ por 8 depende solo de si sus tres últimas cifras
  forman un múltiplo de 8 (o son $000$).
definiciones_clave: |
  **Tres últimas cifras**: el número de tres dígitos formado por centenas, decenas y
  unidades.
propiedades_relaciones: |
  Este criterio es análogo al del 4 (que usa dos cifras) pero para tres cifras, porque
  $1000$ (no $100$) es la primera potencia de 10 divisible por 8.
ejemplo_guiado:
  enunciado: "Determina si 47.256 es divisible por 8."
  pasos:
    - "Las tres últimas cifras son $256$."
    - '$256\div8=32$ con resto $0$.'
    - "Conclusión: 47.256 es divisible por 8."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué basta con revisar las tres últimas cifras para el criterio del 8?"
    choices:
      - {text: "Porque 1000 es divisible por 8", is_correct: true}
      - {text: "Porque 100 es divisible por 8", is_correct: false}
      - {text: "Porque el 8 es par", is_correct: false}
      - {text: "No hay una razón matemática, es una coincidencia", is_correct: false}
    explanation: "La correcta es Porque 1000 es divisible por 8: cualquier cantidad de miles ya es múltiplo de 8."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 12.340 divisible por 8?"
    choices:
      - {text: "No, $340\\div8$ no es exacto", is_correct: true}
      - {text: "Sí, $340\\div8$ es exacto", is_correct: false}
      - {text: "Sí, porque termina en 0", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, $340\\div8$ no es exacto: $340\\div8=42$ con resto $4$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identifica las tres últimas cifras del número a evaluar."
  - "Paso 2: Si las tres últimas cifras son 000, el número es divisible por 8. Si no, forma un número de tres cifras con ellas."
  - "Paso 3: Divide ese número de tres cifras por 8. Si la división es exacta (resto 0), el número original es divisible por 8. De lo contrario, no lo es."
errores_correccion: |
  Un error frecuente es confundir este criterio con el del 4 y analizar solo las dos
  últimas cifras en vez de las tres. Otro error es no considerar el caso especial de que
  un número terminado en 000 siempre es divisible por 8.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número $5.120$ es divisible por $8$."
    alternativas:
      - 'Sí, $120\div8$ es exacto'
      - 'No, $120\div8$ no es exacto'
      - "No se puede determinar"
    respuesta: "Sí, $120\\div8$ es exacto"
    solucion_pasos:
      - "Paso a: Identificamos las últimas tres cifras del número $5.120$, que son $120$."
      - 'Paso b: Realizamos la división de las tres últimas cifras por $8$: $120 \div 8 = 15$, de manera exacta.'
      - "Paso c: Como las tres últimas cifras forman un número divisible por $8$, entonces $5.120$ es divisible por $8$."
  - titulo: "Ejemplo 2"
    enunciado: "Verifica si el número $3.006$ es divisible por $8$."
    alternativas:
      - 'No, $6\div8$ no es exacto'
      - 'Sí, $6\div8$ es exacto'
      - "No se puede determinar"
    respuesta: "No, $6\\div8$ no es exacto"
    solucion_pasos:
      - "Paso a: Identificamos las últimas tres cifras de $3.006$, que son $006$ (es decir, el número $6$)."
      - "Paso b: Analizamos si el número $6$ es divisible por $8$. Como $6$ es menor que $8$ y no es cero, no es divisible por $8$."
      - "Paso c: Concluimos que $3.006$ no es divisible por $8$."
  - titulo: "¿Es el número $12.000$ divisible por $8$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Observamos las tres últimas cifras del número $12.000$."
      - "Las tres cifras finales son ceros ($000$)."
      - "De acuerdo con el criterio, cualquier número entero que termine en tres ceros es divisible por $8$. Por ende, $12.000$ es divisible por $8$."
  - titulo: "¿Es el número $7.118$ divisible por $8$?"
    respuesta: "No"
    solucion_pasos:
      - "Tomamos las tres últimas cifras de $7.118$, que forman el número $118$."
      - 'Dividimos $118$ por $8$: $118 \div 8 = 14$ con un residuo de $6$ (ya que $8 \cdot 14 = 112$).'
      - "Al no ser una división exacta, concluimos que $7.118$ no es divisible por $8$."
errores_frecuentes:
  - "Confundir el criterio de divisibilidad del 8 con el del 4, analizando solo las últimas dos cifras en lugar de las últimas tres."
  - "Creer que basta con que el número sea par para ser divisible por 8, sin revisar las tres últimas cifras."
  - "No considerar el caso especial de que un número terminado en 000 es siempre divisible por 8."
  - "Cometer errores de cálculo en la división mental de las tres últimas cifras por 8."
  - "Creer que un número de menos de tres cifras no se puede analizar con este criterio (para números de una o dos cifras se verifica la división directa)."
afirmaciones_verdaderas:
  - "Un número que termina en 000 siempre es divisible por 8."
  - "El número 1.000 es divisible por 8."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 8 de cualquier número observando solo sus tres últimas
  cifras.
fuente: "Teoría de Números"
estado: publicado
