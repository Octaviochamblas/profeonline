semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_8
resumen_inicial: Un número es divisible por 8 si sus tres últimas cifras forman un múltiplo de 8 o son 000.
explicacion_simple: 'El criterio de divisibilidad por 8 nos permite determinar rápidamente si un número entero se puede dividir exactamente por dicho valor sin necesidad de realizar la división larga completa. Aplicamos una regla sobre las cifras del número.


  ![Criterio de divisibilidad por 8](/static/img/nodos/criterio-de-divisibilidad-por-8-intro.svg)'
explicacion_formal: 'Un entero $n$ es divisible por $8$ si el número formado por sus tres últimas cifras $100 a_2 + 10 a_1 + a_0$ es divisible por $8$.


  $$100 a_2 + 10 a_1 + a_0 \equiv 0 \pmod 8$$


  > **Complemento didáctico:** Los criterios de divisibilidad son simplificaciones algebraicas basadas en la aritmética modular sobre las potencias de 10.'
definiciones_clave: '- **Criterio de divisibilidad**: Regla rápida sobre las cifras de un número para verificar si la división es exacta.'
propiedades_relaciones: '- **Aritmética modular**: Simplificación de cálculos al trabajar con residuos de potencias de 10.'
ejemplo_guiado:
  enunciado: 'Aplique el criterio de divisibilidad por 8 para verificar si la cifra dada cumple la condición.


    ![Ejemplo Criterio de divisibilidad por 8](/static/img/nodos/criterio-de-divisibilidad-por-8-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el procedimiento del criterio: evaluar las tres últimas cifras.'
  - 'Paso 2: Aplicar la prueba: 3.120 es divisible por 8 porque 120 es múltiplo de 8 ($120 = 8 \cdot 15$)..'
  - 'Conclusión: El número cumple el criterio de divisibilidad.'
