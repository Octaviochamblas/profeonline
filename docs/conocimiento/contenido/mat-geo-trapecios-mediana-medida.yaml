semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.MEDIANA_TRAPECIO_MEDIDA
resumen_inicial: 'Propiedad de medida de la mediana del trapecio como semisuma de
  las bases: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y
  Cuadriláteros.'
explicacion_simple: La mediana del trapecio no solo tiene una posición geométrica
  especial, sino también una longitud que se relaciona directamente con las dos bases.
explicacion_formal: '![Medida de la mediana: semisuma de las bases](/static/img/geometria/poligonos-cuadrilateros/trapecios-mediana-medida.svg)


  ### Definición formal


  Si $B$ es la base mayor y $b$ es la base menor de un trapecio, la mediana mide $m=\frac{B+b}{2}$,
  es decir, el promedio aritmético de ambas bases.


  ### Desarrollo didáctico


  Un trapecio con base mayor 20 cm y base menor 12 cm tiene mediana $m=\frac{20+12}{2}=\frac{32}{2}=16$
  cm. Esta propiedad es muy útil porque relaciona un segmento interior del trapecio
  con sus dos lados paralelos externos.'
