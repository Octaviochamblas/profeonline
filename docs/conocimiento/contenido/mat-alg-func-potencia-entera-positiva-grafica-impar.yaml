procedimiento:
- 'Paso 1: Verifica que el exponente $n$ sea un entero positivo impar.'
- 'Paso 2: Ubica el punto $(0,0)$ como punto de paso central de la curva.'
- 'Paso 3: Calcula puntos adicionales que confirmen el crecimiento continuo hacia
  ambos lados.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en gráfica de una función potencia con exponente impar positivo.
ejemplos:
- titulo: Descripción de la gráfica de $x^3$
  enunciado: Describe la forma general de la gráfica de $f(x)=x^3$.
  solucion_pasos:
  - El exponente $3$ es impar, así que la gráfica tiene forma de s alargada.
  - Pasa por el origen y crece de forma continua de izquierda a derecha.
- titulo: Comparación de dos exponentes impares
  enunciado: Compara la forma de $f(x)=x^3$ y $g(x)=x^5$ cerca del origen.
  solucion_pasos:
  - Ambas tienen forma de s y pasan por el origen.
  - $g(x)=x^5$ queda más aplanada cerca de $0$ que $f(x)=x^3$, pero crece más rápido
    lejos del origen.
- titulo: ¿La gráfica de $f(x)=x^5$ tiene un punto mínimo o máximo?
  enunciado: ¿La gráfica de $f(x)=x^5$ presenta algún punto mínimo o máximo?
  respuesta: 'No'
  solucion_pasos:
  - Con exponente impar positivo, la función es estrictamente creciente y no tiene
    extremos.
- titulo: ¿La curva de exponente impar se "dobla hacia atrás" en algún punto?
  enunciado: ¿La gráfica de una función potencia con exponente impar positivo se dobla
    hacia atrás en algún tramo?
  respuesta: 'No'
  solucion_pasos:
  - La curva crece de forma continua y monótona en todo su dominio, sin retroceder
    nunca.
errores_frecuentes:
- Confundir la forma de s del exponente impar con la forma de copa del exponente par.
- Suponer que la curva tiene un punto mínimo o máximo en el origen.
- No distinguir el comportamiento hacia $-\infty$ y $+\infty$, que en este caso son
  opuestos.
- Olvidar que el crecimiento es continuo, sin tramos planos ni descensos.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  gráfica de una función potencia con exponente impar positivo.
