semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.GRAFICA_IMPAR
resumen_inicial: 'Gráfica de una función potencia con exponente impar positivo: forma
  general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento con exponente
  entero positivo.'
explicacion_simple: Las funciones con exponente impar positivo, como $x^3$ o $x^5$,
  tienen una forma alargada de "s" que atraviesa el origen sin formar ni copa ni valle.
explicacion_formal: '### Definición formal


  Para $n\in\mathbb{Z}^+$ impar y $a>0$, la función $f(x)=a\cdot x^n$ es estrictamente
  creciente en todo $\mathbb{R}$, con $f(x)\to-\infty$ cuando $x\to-\infty$ y $f(x)\to+\infty$
  cuando $x\to+\infty$. No presenta máximos ni mínimos, y su único punto de inflexión
  visible en la forma básica está en el origen.


  ### Desarrollo didáctico


  $f(x)=x^3$ pasa de valores muy negativos a la izquierda, cruza el origen, y sigue
  hacia valores muy positivos a la derecha, sin nunca "doblarse" hacia atrás. Esa
  forma de "s" alargada es característica de todos los exponentes impares positivos.'
definiciones_clave: '- **Gráfica de una función potencia con exponente impar positivo**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a gráfica de una función potencia con exponente impar positivo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de gráfica de una función potencia con exponente impar positivo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de gráfica de una función
    potencia con exponente impar positivo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
