semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.GRAFICA_IMPAR
resumen_inicial: 'La gráfica de una función potencia de exponente entero impar positivo $f(x) = a x^{2k+1}$ ($k \ge 1$) posee forma de silla de montar o letra "S", simétrica respecto al origen $(0, 0)$.'
explicacion_simple: |
  Cuando una función potencia tiene un exponente entero impar positivo mayor a 1 (como $x^3, x^5, x^7$), su gráfica dibuja una curva suave en forma de "S" o "silla de montar". Si el número $a$ es positivo, la curva sube continuamente de izquierda a derecha (transitando del cuadrante III al cuadrante I). Si $a$ es negativo, la curva baja continuamente de izquierda a derecha (transitando del cuadrante II al cuadrante IV). Ambas ramas pasan cruzándose suavemente por el origen de coordenadas $(0, 0)$.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función potencia de exponente impar positivo** $f(x) = a x^n$ con $n = 2k + 1 (k \in \mathbb{Z}^+)$ se define como una curva monótona continua en el plano cartesiano $G = \{(x, a x^{2k+1}) \mid x \in \mathbb{R}\}$ caracterizada analíticamente por:
  1. **Comportamiento en el Origen**: Posee un punto de inflexión horizontal en $(0, 0)$ donde la pendiente tangente es nula ($f'(0) = 0$).
  2. **Comportamiento Asintótico Infinito**:
     - Si $a > 0 \implies \lim_{x \to -\infty} f(x) = -\infty$ y $\lim_{x \to +\infty} f(x) = +\infty$ (Transita del cuadrante III al I).
     - Si $a < 0 \implies \lim_{x \to -\infty} f(x) = +\infty$ y $\lim_{x \to +\infty} f(x) = -\infty$ (Transita del cuadrante II al IV).
  3. **Efecto de la magnitud del grado $n$**: A mayor exponente impar $n = 5, 7, 9$, la meseta en el origen se vuelve más plana en el intervalo $]-1, 1[$ y las ramas se elevan verticalmente más rápido para $|x| > 1$.

  ### Síntesis didáctica
  Puntos nodales universales para la forma mónica $y = x^{2k+1}$:
  - $(-1, -1)$, $(0, 0)$, $(1, 1)$.
definiciones_clave: |
  - **Curva en S / Silla de montar**: Forma geométrica propia de potencias de exponente impar positivo.
  - **Punto de inflexión en el origen**: Transición de concavidad cóncava a convexa en el punto $(0, 0)$.
  - **Monotonía permanente**: Ausencia de extremos locales; la función es estrictamente creciente (si $a > 0$) o decreciente (si $a < 0$).
propiedades_relaciones: |
  - **Simetría respecto al origen $(0, 0)$**: $f(-x) = -f(x)$ para todo $x \in \mathbb{R}$.
  - **Recorrido ilimitado $\mathbb{R}$**: Abarca todas las alturas verticales de $-\infty$ a $+\infty$.
ejemplo_guiado:
  enunciado: 'Grafica cualitativamente y compara los puntos representativos de la función potencia impar $f(x) = 2x^3$ para $x \in \{-2, -1, 0, 1, 2\}$, indicando la monotonía y los cuadrantes habitados.'
  pasos:
    - 'Paso 1: Evaluamos puntos: $f(-2) = 2(-2)^3 = 2(-8) = -16$, $f(-1) = 2(-1)^3 = -2$, $f(0) = 0$, $f(1) = 2$, $f(2) = 2(8) = 16$.'
    - 'Paso 2: Observamos que $f(-1) = -2$ y $f(1) = 2$, confirmando que $f(-1) = -f(1)$ (simetría impar respecto al origen).'
    - 'Paso 3: El punto de inflexión se ubica en el origen $(0, 0)$.'
    - 'Paso 4: Como $a = 2 > 0$, las imágenes crecen continuamente desde $-16$ hasta $+16$. Ocupa los cuadrantes III y I.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué aspecto geométrico caracteriza a la gráfica de una función potencia con exponente impar positivo como $f(x) = 3x^5$?'
    choices:
      - {text: 'Una curva continua en forma de S o silla de montar, simétrica respecto al origen $(0, 0)$, que transita desde el cuadrante III hacia el cuadrante I', is_correct: true}
      - {text: 'Una curva parabólica en forma de U simétrica respecto al eje $y$', is_correct: false}
      - {text: 'Una hipérbola de dos ramas separadas', is_correct: false}
      - {text: 'Una recta horizontal a la altura $y = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''Una curva continua en forma de S o silla de montar, simétrica respecto al origen $(0, 0)$, que transita desde el cuadrante III hacia el cuadrante I''. Los exponentes impares positivos $n = 3, 5, 7\dots$ generan curvas en forma de S.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué sucede con la gráfica de la función potencia $f(x) = a x^3$ cuando el coeficiente pasa de $a = 2$ a $a = -2$?'
    choices:
      - {text: 'Se invierte el sentido de la S, pasando de ser una curva estrictamente creciente (cuadrantes III a I) a una curva estrictamente decreciente (cuadrantes II a IV)', is_correct: true}
      - {text: 'Se transforma en una curva en forma de U', is_correct: false}
      - {text: 'La gráfica se desplaza 2 unidades hacia la derecha', is_correct: false}
      - {text: 'No sufre ninguna modificación gráfica', is_correct: false}
    explanation: 'La alternativa correcta es ''Se invierte el sentido de la S, pasando de ser una curva estrictamente creciente (cuadrantes III a I) a una curva estrictamente decreciente (cuadrantes II a IV)''. El coeficiente $a < 0$ invierte la monotonía de las potencias impares.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el exponente $n$ sea un número entero positivo impar ($n = 3, 5, 7\dots$).'
  - 'Paso 2: Ubicar el punto de inflexión horizontal en el origen cartesiano $(0, 0)$.'
  - 'Paso 3: Trazar la ordenada en $x = 1$ a la altura $y = a$ y en $x = -1$ a la altura $y = -a$.'
  - 'Paso 4: Dibujar la curva suave continua en forma de S simétrica respecto al origen, subiendo de III a I si $a > 0$, o bajando de II a IV si $a < 0$.'
errores_correccion: |
  - **Error 1:** Dibujar las dos ramas apuntando hacia el mismo lado positivo como si tuviera exponente par. **Cómo corregirlo:** En exponentes impares $(-x)^{2k+1} = -x^{2k+1}$, por lo que los valores de $y$ para entradas negativas tienen el signo opuesto a los de entradas positivas.
  - **Error 2:** Asumir que la función de exponente impar $n \ge 3$ es una recta como $y = x$. **Cómo corregirlo:** Aunque transita por cuadrantes similares a la recta $y = x$, la función potencia de grado impar $n \ge 3$ presenta una curva con aplanamiento en el origen y elevación muy empinada para $|x| > 1$.
ejemplos:
  - titulo: 'Forma de gráfica para exponente 3'
    enunciado: '¿La gráfica de $f(x) = x^3$ es una curva continua en forma de S?'
    alternativas:
      - 'Sí, por tener exponente impar positivo'
      - 'No, es una parábola'
      - 'No, es una recta'
    respuesta: 'Sí, por tener exponente impar positivo'
    solucion_pasos:
      - '1. Exponente $n = 3$ es impar positivo.'
      - '2. La gráfica es continua, en forma de S, simétrica respecto al origen.'
  - titulo: 'Gráfica impar con coeficiente negativo'
    enunciado: '¿La gráfica de $g(x) = -4x^5$ pasa por los cuadrantes II y IV?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -4 < 0$, para $x > 0 \implies y < 0$ (IV) y para $x < 0 \implies y > 0$ (II).'
  - titulo: 'Puntos nodales en impares'
    enunciado: '¿La curva de $y = 2x^3$ pasa por los puntos $(-1, -2)$, $(0, 0)$ y $(1, 2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Evaluamos: $f(-1) = -2$, $f(0) = 0$, $f(1) = 2$.'
  - titulo: 'Monotonía de potencias impares'
    enunciado: '¿La función $f(x) = 5x^7$ es estrictamente creciente en todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para $a = 5 > 0$ y $n=7$ impar, las imágenes aumentan continuamente de $-\infty$ a $+\infty$.'
errores_frecuentes:
  - 'La gráfica de la función potencia de exponente impar $f(x) = x^3$ abre hacia arriba en forma de U.'
  - 'Las funciones potencia de exponente impar positivo poseen un mínimo absoluto en el origen.'
  - 'Una función potencia de exponente impar con $a < 0$ transita desde el cuadrante III al cuadrante I.'
  - 'La gráfica de $f(x) = x^5$ tiene una asíntota vertical en $x = 0$.'
  - 'Las funciones de exponente impar no están definidas para números reales negativos.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero impar positivo $f(x) = a x^{2k+1}$ posee una gráfica continua en forma de S simétrica respecto al origen $(0, 0)$.'
  - 'Para $a > 0$, la gráfica de exponente impar es estrictamente creciente habitando los cuadrantes III y I; para $a < 0$, es estrictamente decreciente habitando los cuadrantes II y IV.'
