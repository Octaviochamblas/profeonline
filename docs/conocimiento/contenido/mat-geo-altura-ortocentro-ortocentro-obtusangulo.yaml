semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_OBTUSANGULO
resumen_inicial: 'Ubicación exterior del ortocentro en un triángulo obtusángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: Cuando uno de los ángulos del triángulo supera los 90°, dos de
  las alturas caen sobre la prolongación de sus lados opuestos, y su intersección
  queda fuera del triángulo.
explicacion_formal: '![Ortocentro exterior en triángulo obtusángulo](/static/img/geometria/elementos-secundarios/altura-ortocentro-ortocentro-obtusangulo.svg)


  ### Definición formal


  Si un triángulo tiene un ángulo interior mayor que 90°, el ortocentro H se ubica
  fuera de la región triangular, del lado opuesto al ángulo obtuso.


  ### Desarrollo didáctico


  En un triángulo obtusángulo, dos de las tres alturas tienen su pie fuera del lado
  correspondiente (sobre la prolongación), por lo que su punto de intersección también
  cae fuera de la figura.'
