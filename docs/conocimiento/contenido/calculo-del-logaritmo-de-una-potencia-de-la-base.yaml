semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.LOGARITMO_POTENCIA_BASE
resumen_inicial: El cálculo del logaritmo de una potencia de la base establece la propiedad de cancelación $\log_b(b^k) = k$ para todo $k \in \mathbb{R}$, manifestando que el logaritmo y la exponencial de igual base actúan como operadores inversos cancelativos.
explicacion_simple: "![El cálculo del logaritmo de una potencia de la base establece la propiedad de cancelación $\\log_b(b^k) = k$ para todo $k \\in \\mathbb{R}$, manifestando que el logaritmo y la exponencial de igual base actúan como operadores inversos cancelativos](/static/img/nodos/calculo-del-logaritmo-de-una-potencia-de-la-base-intro.svg)\n\n\nCuando el argumento es una **potencia que tiene la misma base que el logaritmo**, ¡la base y el logaritmo se cancelan y **solo sobrevive el exponente $k$**!:\n\n$$\\log_b(b^k) = \\mathbf{k}$$\n\n- **Ejemplos súper directos:**\n  - $\\log_2(2^{\\mathbf{5}}) = \\mathbf{5}$.\n  - $\\log_3(3^{\\mathbf{-4}}) = \\mathbf{-4}$.\n  - $\\ln(e^{\\mathbf{x}}) = \\mathbf{x}$.\n  - $\\log_{10}(10^{\\mathbf{8}}) = \\mathbf{8}$.\n  - $\\log_5(\\sqrt[3]{5}) = \\log_5(5^{\\mathbf{1/3}}) = \\mathbf{\\frac{1}{3}}$."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$ y $k \in \mathbb{R}$. Por la definición de composición de aplicaciones inversas $(\log_b \circ \exp_b): \mathbb{R} \to \mathbb{R}$:

  $$(\log_b \circ \exp_b)(k) = \log_b\left(b^k\right) = k$$


  **Propiedad de identidad dual inversa**:

  De forma complementaria, para todo $x \in \mathbb{R}^+$:

  $$(\exp_b \circ \log_b)(x) = b^{\log_b(x)} = x$$

  Ambas identidades confirman que $\log_b$ es el isomorfismo inverso estricto de $\exp_b$ sobre $\mathbb{R}$.'
definiciones_clave: '- **Propiedad cancelativa inversa**: Anulación mutua de las operaciones exponencial y logarítmica con bases idénticas.

  - **Identidad exponencial logarítmica**: Regla $b^{\log_b(x)} = x$ para todo $x > 0$.'
propiedades_relaciones: '- **Linealización de radicales**: $\log_b(\sqrt[n]{b^m}) = \log_b(b^{m/n}) = \frac{m}{n}$.

  - **Cancelación en base natural**: $\ln(e^k) = k$ y $e^{\ln(x)} = x$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo del logaritmo de una potencia de la base establece la propiedad de cancelación $\log_b(b^k) = k$ para todo $k \in \mathbb{R}$, manifestando que el logaritmo y la exponencial de igual base actúan como operadores inversos cancelativos](/static/img/nodos/calculo-del-logaritmo-de-una-potencia-de-la-base-ejemplos.svg)



    Calcula el valor exacto de las siguientes expresiones aplicando la propiedad de cancelación:

    1) $\log_2(2^9)$

    2) $\log_5\left(\frac{1}{5^4}\right)$

    3) $\log_3(\sqrt[5]{27})$

    4) $10^{\log(45)}$'
  pasos:
  - 'Paso 1: Para $\log_2(2^9)$: Bases idénticas se cancelan $\implies \mathbf{9}$.'
  - 'Paso 2: Para $\log_5(1/5^4)$: Escribir en forma de potencia: $\log_5(5^{-4}) \implies \mathbf{-4}$.'
  - 'Paso 3: Para $\log_3(\sqrt[5]{27})$:

    - Expresar 27 en base 3: $27 = 3^3$.

    - Escribir la raíz como exponente fraccionario: $\sqrt[5]{3^3} = 3^{3/5}$.

    - $\log_3(3^{3/5}) = \mathbf{\frac{3}{5}}$.'
  - 'Paso 4: Para $10^{\log(45)}$: Cancelación exponencial dual $\implies \mathbf{45}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_6(6^{14})$?
  choices:
  - text: 14 (las bases se cancelan mutuamente)
    is_correct: true
  - text: '84'
    is_correct: false
  - text: '6'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '14 (las bases se cancelan mutuamente)'. Por la propiedad cancelativa $\log_b(b^k) = k$, $\log_6(6^{14}) = 14$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto vale $\log_2(\sqrt{2})$?
  choices:
  - text: 1/2 (porque √2 = 2¹/²)
    is_correct: true
  - text: '2'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: √2
    is_correct: false
  explanation: La alternativa correcta es '1/2 (porque √2 = 2¹/²)'. $\log_2(2^{1/2}) = 1/2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar el argumento como una potencia de la misma base $b$ del logaritmo ($b^k$).'
- 'Paso 2: Si hay raíces, convertirlas a exponentes fraccionarios $\sqrt[n]{b^m} = b^{m/n}$.'
- 'Paso 3: Si hay fracciones, convertirlas a exponentes negativos $1/b^n = b^{-n}$.'
- 'Paso 4: Cancelar la base con el logaritmo y aislar el exponente $k$ como resultado final.'
errores_correccion: '- **Error común:** No convertir las raíces en exponentes fraccionarios antes de calcular.

  - **Cómo corregirlo:** Transforma siempre **las raíces en potencias fraccionarias**: $\sqrt[n]{b^m} = b^{m/n} \implies \log_b(b^{m/n}) = \mathbf{m/n}$.'
ejemplos:
- titulo: 'Ejemplo 1: Exponente entero'
  enunciado: 'Calcula $\log_4(4^8)$:'
  alternativas:
  - '8'
  - '32'
  - '4'
  - '2'
  respuesta: '8'
  solucion_pasos:
  - 'Paso 1: $\log_4(4^8) = 8$.'
- titulo: 'Ejemplo 2: Exponente negativo'
  enunciado: ¿Cuánto vale $\log_3(3^{-5})$?
  alternativas:
  - '-5'
  - '5'
  - 1/243
  - '-15'
  respuesta: '-5'
  solucion_pasos:
  - 'Paso 1: $\log_3(3^{-5}) = -5$.'
- titulo: 'Ejemplo 3: Raíz cúbica'
  enunciado: 'Calcula $\log_7(\sqrt[3]{7^2})$:'
  alternativas:
  - 2/3
  - 3/2
  - '6'
  - 1/3
  respuesta: 2/3
  solucion_pasos:
  - 'Paso 1: $\log_7(7^{2/3}) = 2/3$.'
- titulo: 'Ejemplo 4: Cancelación exponencial'
  enunciado: 'Calcula el valor de $e^{\ln(18)}$:'
  alternativas:
  - '18'
  - e
  - '1'
  - ln(18)
  respuesta: '18'
  solucion_pasos:
  - 'Paso 1: $e^{\ln(18)} = 18$ por identidad inversa.'
errores_frecuentes:
- Multiplicar la base por el exponente en vez de aislar directamente k.
- Olvidar invertir el signo al transformar denominadores a potencias negativas.
- Confundir el orden de la composición exponencial logarítmica.
afirmaciones_verdaderas:
- Para cualquier exponente real k se cumple la identidad log_b(bᵏ) = k.
- La base de una potencia y el logaritmo de igual base se cancelan mutuamente.
al_terminar_debes_poder: '**QUÉ:** Calcular el logaritmo de una potencia de la base aplicando la propiedad de cancelación.


  **CÓMO:** Transformando argumentos a la forma bᵏ (incluyendo exponentes fraccionarios y negativos) para obtener k directamente.


  ![Resumen El cálculo del logaritmo de una potencia de la base establece la propiedad de cancelación $\log_b(b^k) = k$ para todo $k \in \mathbb{R}$, manifestando que el logaritmo y la exponencial de igual base actúan como operadores inversos cancelativos](/static/img/nodos/calculo-del-logaritmo-de-una-potencia-de-la-base-resumen.svg)'
