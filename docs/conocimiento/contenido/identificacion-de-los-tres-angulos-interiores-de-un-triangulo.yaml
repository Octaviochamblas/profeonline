semantic_id: MAT.GEO.TRIANGULOS_DEF.ANGULOS_INTERIORES
resumen_inicial: Los ángulos interiores de un triángulo son las tres aberturas angulares
  ubicadas en su región interior delimitadas por pares de lados concurrentes, cuya
  suma es siempre igual a 180°.
explicacion_simple: '![Ángulos Interiores](/static/img/nodos/identificacion-de-los-tres-angulos-interiores-de-un-triangulo-intro.svg)


  Dentro de un triángulo hay tres esquinas interiores llamadas **ángulos interiores**
  (nombrados con letras griegas como $\alpha, \beta, \gamma$). Sin importar si el
  triángulo es pequeño, gigante, alargado o simétrico, al sumar sus tres ángulos de
  adentro siempre obtendrás exactamente **$180^\circ$**.'
explicacion_formal: '### Definición formal

  Los **ángulos interiores** de un triángulo $\Delta ABC$ son los tres ángulos convexos
  formados por los pares de rayos que contienen a los lados concurrentes en cada vértice,
  medidos en la región interior del polígono:


  $$\{\alpha, \beta, \gamma\} = \{\angle CAB, \; \angle ABC, \; \angle BCA\}$$


  ### Desglose simbólico y geométrico

  - $\alpha = \angle A$: Ángulo interior en el vértice $A$, subtendido por los rayos
  $\vec{AB}$ y $\vec{AC}$.

  - $\beta = \angle B$: Ángulo interior en el vértice $B$, subtendido por los rayos
  $\vec{BA}$ y $\vec{BC}$.

  - $\gamma = \angle C$: Ángulo interior en el vértice $C$, subtendido por los rayos
  $\vec{CA}$ y $\vec{CB}$.

  - Convexidad: Todo ángulo interior de un triángulo euclidiano es estrictamente convexo
  ($0^\circ < \alpha, \beta, \gamma < 180^\circ$).


  ### Síntesis didáctica

  Los ángulos interiores determinan la forma y proporciones angulares del triángulo,
  rigiendo los criterios de semejanza y trigonometría plana.'
definiciones_clave: '- **Ángulo interior**: Ángulo formado por dos lados contiguos
  en la región interior del polígono.

  - **Notación griega ($\alpha, \beta, \gamma$)**: Símbolos estándar para los ángulos
  en los vértices $A, B, C$.

  - **Teorema de la suma interior**: $\alpha + \beta + \gamma = 180^\circ$. '
propiedades_relaciones: '- **Cálculo del tercer ángulo**: Conociendo dos ángulos interiores,
  el tercero se obtiene de forma unívoca: $\gamma = 180^\circ - (\alpha + \beta)$.

  - **Restricción de obtusos**: Un triángulo puede tener a lo más un ángulo obtuso
  o recto (ya que si tuviera dos, su suma superaría $180^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Interiores](/static/img/nodos/identificacion-de-los-tres-angulos-interiores-de-un-triangulo-ejemplos.svg)


    En el triángulo $\triangle ABC$, dos de sus ángulos interiores miden $\alpha =
    42^\circ$ y $\beta = 68^\circ$. Determina la medida del tercer ángulo interior
    $\gamma$.'
  pasos:
  - 'Paso 1: Recordar el teorema fundamental: $\alpha + \beta + \gamma = 180^\circ$.'
  - 'Paso 2: Sumar los dos ángulos conocidos: $42^\circ + 68^\circ = 110^\circ$.'
  - 'Paso 3: Plantear la ecuación: $110^\circ + \gamma = 180^\circ$.'
  - 'Paso 4: Despejar $\gamma$: $\gamma = 180^\circ - 110^\circ = 70^\circ$.'
  - 'Paso 5: Concluir que el tercer ángulo interior mide $70^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto suman siempre los tres ángulos interiores de cualquier triángulo
    plano?
  choices:
  - text: Suman exactamente 180° (un ángulo llano)
    is_correct: true
  - text: Suman 360°
    is_correct: false
  - text: Suman 90°
    is_correct: false
  - text: Depende del tamaño del triángulo
    is_correct: false
  explanation: Por teorema fundamental euclidiano, los 3 ángulos interiores suman
    exactamente 180° (un ángulo llano).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene dos ángulos que miden 50° y 60°, ¿cuánto mide el
    tercer ángulo?
  choices:
  - text: 70° (porque 180° - 110° = 70°)
    is_correct: true
  - text: 80°
    is_correct: false
  - text: 60°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: Restando 110° de 180° se obtiene 70° (porque 180° - 110° = 70°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las medidas de los ángulos interiores dados.'
- 'Paso 2: Aplicar la relación $\alpha + \beta + \gamma = 180^\circ$.'
- 'Paso 3: Sumar los conocidos y restar el resultado de $180^\circ$ para despejar
  la incógnita.'
errores_correccion: No confundas la suma de los ángulos interiores (180°) con la de
  los exteriores (360°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo rectángulo tiene un ángulo agudo de $35^\circ$, ¿cuánto
    mide el otro ángulo agudo?
  alternativas:
  - $55^\circ$
  - $45^\circ$
  - $65^\circ$
  respuesta: $55^\circ$
  solucion_pasos:
  - En un triángulo rectángulo los dos agudos suman $90^\circ$: $90^\circ - 35^\circ
      = 55^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Puede existir un triángulo con ángulos interiores de $80^\circ$, $60^\circ$
    y $50^\circ$?
  alternativas:
  - No, porque la suma es 190° (supera 180°)
  - Sí, es un triángulo acutángulo
  - Sí, si los lados son suficientemente grandes
  respuesta: No, porque la suma es 190° (supera 180°)
  solucion_pasos:
  - $80^\circ + 60^\circ + 50^\circ = 190^\circ \neq 180^\circ$, por lo que es imposible
    formar un triángulo plano.
- titulo: ¿La suma de los ángulos interiores de todo triángulo es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un axioma derivado del postulado de las paralelas de Euclides.
- titulo: ¿Un triángulo puede tener dos ángulos interiores obtusos (mayores a 90°)?
  respuesta: 'No'
  solucion_pasos:
  - No, dos ángulos mayores a 90° sumarían más de 180°, dejando sin espacio al tercer
    ángulo.
errores_frecuentes:
- Sumar los ángulos interiores igualándolos a 360°.
- Creer que triángulos grandes tienen mayor suma angular que triángulos pequeños.
- Intentar construir triángulos con dos ángulos obtusos o dos rectos.
- Confundir la notación $\angle A$ con el lado $a$.
- No comprobar que la suma final dé exactamente $180^\circ$.
afirmaciones_verdaderas:
- Los tres ángulos interiores de cualquier triángulo plano suman $180^\circ$.
- Todo triángulo posee al menos dos ángulos agudos.
al_terminar_debes_poder: '**QUÉ:** Identificar, calcular y relacionar los tres ángulos
  interiores de un triángulo.


  **CÓMO:** Aplicando el teorema de la suma angular $\alpha + \beta + \gamma = 180^\circ$.


  ![Resumen de los Ángulos Interiores](/static/img/nodos/identificacion-de-los-tres-angulos-interiores-de-un-triangulo-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Geometría Euclidiana.
