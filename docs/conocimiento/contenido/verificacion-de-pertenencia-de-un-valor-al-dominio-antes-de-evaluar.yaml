semantic_id: MAT.ALG.FUNCION_EVALUACION.RESTRICCION_DOMINIO
resumen_inicial: 'Verificación de pertenencia de un valor al dominio antes de evaluar:
  conceptos, representación y propiedades en Evaluación de funciones.'
explicacion_simple: Antes de sustituir un número en una función, conviene preguntarse
  si ese número está realmente permitido. Evaluar sin verificar puede llevar a expresiones
  sin sentido matemático.
explicacion_formal: '### Definición formal


  Dada una función $f$ con dominio $\text{Dom}(f)$, un valor $a$ es evaluable en $f$
  si y solo si $a \in \text{Dom}(f)$. Verificar esta pertenencia antes de sustituir
  evita construir expresiones indefinidas, como divisiones por cero o raíces de índice
  par de números negativos.


  ### Desarrollo didáctico


  El chequeo previo consiste en identificar las restricciones de la fórmula (denominadores
  que no pueden anularse, radicandos que no pueden ser negativos) y comprobar que
  el valor a evaluar no las viole.


  Si $f(x) = \frac{1}{x-4}$ y te piden $f(4)$, primero verificas: $x-4=0$ cuando $x=4$,
  así que $4 \notin \text{Dom}(f)$. No se debe evaluar; la respuesta correcta es que
  $f(4)$ no está definida.'
definiciones_clave: '- **Verificación de pertenencia de un valor al dominio antes
  de evaluar**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a verificación de pertenencia de un valor
  al dominio antes de evaluar.'
