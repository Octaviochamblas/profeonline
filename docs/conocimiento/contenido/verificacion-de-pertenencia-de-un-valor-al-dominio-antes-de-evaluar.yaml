semantic_id: MAT.ALG.FUNCION_EVALUACION.RESTRICCION_DOMINIO
resumen_inicial: Antes de evaluar una función en un número $a$, se debe verificar
  que $a$ pertenezca al dominio de la función para evitar operaciones indefinidas.
explicacion_simple: 'No podemos evaluar a ciegas cualquier número en una función.

  Antes de reemplazar un valor $x = a$, debemos comprobar si pertenece a su dominio:

  - En $f(x) = \frac{1}{x - 3}$, no se puede evaluar $x = 3$ porque la división por
  cero no existe en $\mathbb{R}$.

  - En $f(x) = \sqrt{x - 5}$, no se puede evaluar $x = 1$ porque la raíz de $-4$ no
  es un número real.'
explicacion_formal: 'Para evaluar $f(a)$, la **condición de existencia de la imagen**
  exige la verificación previa:


  $$a \in \operatorname{Dom}(f) \iff f(a) \in \mathbb{R}$$

  $$\text{Si } a \notin \operatorname{Dom}(f) \implies f(a) \text{ no está definido
  en } \mathbb{R}$$


  **Desglose de la fórmula:**

  - Filtro preliminar de validez que previene indeterminaciones como $\frac{k}{0}$
  o $\sqrt{-\text{real}}$ en el cuerpo de los números reales.'
definiciones_clave: '- **Pertenencia al dominio ($a \in \operatorname{Dom}(f)$)**:
  Condición indispensable que garantiza que el cálculo de la imagen produce un resultado
  real válido.'
propiedades_relaciones: '- **Indeterminación matemática**: Evaluar un número fuera
  del dominio produce operaciones sin sentido en $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: Verifica si los números $a_1 = 7$ y $a_2 = 2$ pertenecen al dominio de
    la función $f(x) = \sqrt{x - 3}$ antes de intentar evaluarlos.
  pasos:
  - 'Paso 1: Identificar la restricción del dominio: por ser raíz cuadrada, se exige
    $x - 3 \ge 0 \implies x \ge 3$.Paso 2: Verificar $a_1 = 7$: como $7 \ge 3$, $7
    \in \operatorname{Dom}(f) \implies f(7) = \sqrt{7 - 3} = \sqrt{4} = 2$ (VÁLIDO).Paso
    3: Verificar $a_2 = 2$: como $2 < 3$, $2 \notin \operatorname{Dom}(f) \implies
    f(2) = \sqrt{2 - 3} = \sqrt{-1} \notin \mathbb{R}$ (INDEFINIDO).Paso 4: Concluir
    que la función solo se puede evaluar para valores $x \ge 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al intentar evaluar $x = 2$ en la función $f(x) = \sqrt{x - 3}$, ¿cuál
    es la conclusión correcta en $\mathbb{R}$?
  choices:
  - text: $f(2)$ no está definido en los números reales porque $2 \notin \operatorname{Dom}(f)$.
    is_correct: true
  - text: $f(2) = -1$
    is_correct: false
  - text: $f(2) = 1$
    is_correct: false
  - text: $f(2) = 0$
    is_correct: false
  explanation: La alternativa correcta es '$f(2)$ no está definido en los números
    reales porque $2 \notin \operatorname{Dom}(f)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué condición exige el dominio de una función con raíz cuadrada $\sqrt{g(x)}$
    en los números reales?
  choices:
  - text: Que la expresión interior sea mayor o igual a cero ($g(x) \ge 0$).
    is_correct: true
  - text: Que la expresión interior sea estrictamente negativa.
    is_correct: false
  - text: Que la expresión interior sea igual a cero obligatoriamente.
    is_correct: false
  - text: No exige ninguna condición.
    is_correct: false
  explanation: La alternativa correcta es 'Que la expresión interior sea mayor o igual
    a cero ($g(x) \ge 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la condición de existencia del dominio de la función.'
- 'Paso 2: Comprobar si el número candidato $a$ satisface dicha condición.'
- 'Paso 3: Si satisface la condición, proceder a calcular $f(a)$.'
- 'Paso 4: Si no la satisface, declarar que $f(a)$ no está definido en $\mathbb{R}$.'
errores_correccion: '- **Error común:** Intentar resolver $\sqrt{-1}$ dentro de $\mathbb{R}$
  y dar una respuesta errónea.

  - **Cómo corregirlo:** Si el argumento genera una raíz par negativa o una división
  por cero, debes declarar que la evaluación NO está definida en $\mathbb{R}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de evaluación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de evaluación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Evaluar una función consiste en reemplazar la preimagen x en la fórmula
    y calcular y?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de valorización funcional.
- titulo: ¿Se debe verificar que el número pertenezca al dominio antes de evaluar
    una raíz par?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar raíces de números negativos en $\\mathbb{R}$.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir números negativos al elevar a potencias pares.
- Confundir la búsqueda de una imagen (evaluar $f(a)$) con la búsqueda de una preimagen
  (igualar $f(x) = b$).
- Pensar que la notación $f(x+3)$ equivale simplemente a sumar $3$ al resultado final
  de $f(x)$.
- Intentar evaluar valores que no pertenecen al dominio provocando divisiones por
  cero o raíces pares negativas.
- Buscar preimágenes en el eje vertical $Y$ o imágenes en el eje horizontal $X$ al
  interpretar un gráfico.
afirmaciones_verdaderas:
- Para evaluar una función $f(x)$ se reemplaza la variable $x$ por el valor dado respetando
  la jerarquía operacional.
- Para hallar la preimagen $x$ correspondiente a una imagen $y_0$ se debe resolver
  la ecuación $f(x) = y_0$.
al_terminar_debes_poder: Al finalizar este recurso podrás evaluar funciones a partir
  de fórmulas, tablas o gráficos, y determinar preimágenes respetando las restricciones
  del dominio.
