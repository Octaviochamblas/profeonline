semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_IGUALACION
resumen_inicial: 'Resolución mediante el método de igualación: propiedades, resolución
  y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: 'Es muy mecánico: Tomas ambas ecuaciones y despejas la **misma**
  letra (por ejemplo, despejas la ''y'' en ambas).'
explicacion_formal: '### Definición formal


  El método de igualación consiste en despejar la misma incógnita en ambas ecuaciones
  del sistema y luego igualar las expresiones obtenidas. Si a partir de un sistema
  se obtiene

  $$x=f(y)\qquad \text{y}\qquad x=g(y),$$

  o bien

  $$y=f(x)\qquad \text{y}\qquad y=g(x),$$

  entonces, por transitividad de la igualdad, debe cumplirse $f=g$. Así se obtiene
  una ecuación de una variable cuya solución permite reconstruir después la otra incógnita.


  ### Desarrollo didáctico


  Es muy mecánico: Tomas ambas ecuaciones y despejas la **misma** letra (por ejemplo,
  despejas la ''y'' en ambas).

  Obtendrás dos identidades para la ''y'':

  - $y = \text{Expresión 1}$

  - $y = \text{Expresión 2}$


  Como ambas valen ''y'', las igualas entre sí: $\text{Expresión 1} = \text{Expresión
  2}$.

  Ahora tienes una sola ecuación con pura ''x''. La resuelves y listo.'
definiciones_clave: '- **Resolución mediante el método de igualación**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución mediante el método de igualación.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando resolución mediante
    el método de igualación.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de resolución mediante
    el método de igualación.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
