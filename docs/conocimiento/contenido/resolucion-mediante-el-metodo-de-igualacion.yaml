semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_IGUALACION
resumen_inicial: El método de igualación despeja la misma variable en ambas ecuaciones
  e iguala sus expresiones para hallar la solución.
explicacion_simple: 'Para resolver un sistema por **igualación**:

  1. Despejamos la MISMA letra (por ejemplo $y$) tanto en la primera como en la segunda
  ecuación.

  2. Dado que $y = y$, ''igualamos'' las dos expresiones algebraicas que obtuvimos.

  3. Resolvemos la ecuación lineal resultante para hallar la primera variable y sustituimos
  para encontrar la segunda.'
explicacion_formal: 'Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x +
  b_2 y = c_2 \end{cases}$, el **algoritmo de igualación** ejecuta:


  $$\text{1. Despejar } y \text{ en ambas: } y = \frac{c_1 - a_1 x}{b_1} \quad \text{y}
  \quad y = \frac{c_2 - a_2 x}{b_2}$$

  $$\text{2. Igualar expresiones: } \frac{c_1 - a_1 x}{b_1} = \frac{c_2 - a_2 x}{b_2}$$

  $$\text{3. Resolver la ecuación fraccionaria lineal resultante para hallar } x.$$'
definiciones_clave: '- **Método de igualación**: Técnica de resolución basada en la
  propiedad transitiva de la igualdad aplicada a despejes idénticos.'
propiedades_relaciones: '- **Propiedad transitiva**: Si $y = A(x)$ e $y = B(x)$, entonces
  $A(x) = B(x)$.'
ejemplo_guiado:
  enunciado: Resuelve por el método de igualación el sistema $\begin{cases} x + 2y
    = 8 \\ 3x - 2y = 4 \end{cases}$ despejando $2y$ en ambas ecuaciones y evalúa el
    par $(x, y)$.
  pasos:
  - 'Paso 1: Despejar $2y$ en la primera ecuación: $2y = 8 - x$.Paso 2: Despejar $2y$
    en la segunda ecuación: $2y = 3x - 4$.Paso 3: Igualar las dos expresiones: $8
    - x = 3x - 4$.Paso 4: Trasponer y reducir: $8 + 4 = 3x + x \implies 12 = 4x \implies
    x = 3$.Paso 5: Reemplazar $x = 3$ en el primer despeje: $2y = 8 - 3 = 5 \implies
    y = \frac{5}{2} = 2{,}5$.Paso 6: Concluir la solución $(x, y) = (3, 2{,}5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al igualar los despejes de $2y$ ($8 - x$ y $3x - 4$), ¿cuál es la ecuación
    obtenida en $x$?
  choices:
  - text: $8 - x = 3x - 4$
    is_correct: true
  - text: $8 + x = 3x + 4$
    is_correct: false
  - text: $2(8 - x) = 3x - 4$
    is_correct: false
  - text: $8 - x + 3x - 4 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$8 - x = 3x - 4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver el sistema por igualación, ¿cuál es el valor de $x$ obtenido?
  choices:
  - text: $x = 3$
    is_correct: true
  - text: $x = 4$
    is_correct: false
  - text: $x = 12$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elegir la misma variable a despejar en ambas ecuaciones.'
- 'Paso 2: Escribir los despejes de esa variable para ambas ecuaciones.'
- 'Paso 3: Igualar ambas expresiones entre sí.'
- 'Paso 4: Resolver la ecuación lineal resultante.'
- 'Paso 5: Sustituir la variable hallada en cualquiera de los despejes.'
errores_correccion: '- **Error común:** Despejar $x$ en la primera ecuación e $y$
  en la segunda antes de igualar.

  - **Cómo corregirlo:** La igualación exige despejar la MISMA variable en ambas ecuaciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
