semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_IGUALACION
resumen_inicial: El método de igualación consiste en despejar la misma variable en ambas ecuaciones del sistema e igualar sus expresiones resultantes para hallar la solución.
explicacion_simple: '![Resolución mediante el método de igualación](/static/img/nodos/resolucion-mediante-el-metodo-de-igualacion-intro.svg)


  Para resolver un sistema $2 \times 2$ mediante el método de **igualación**:


  1. Despejamos la **misma** variable (por ejemplo $y$) tanto en la primera como en la segunda ecuación.

  2. Puesto que $y = y$ por la propiedad reflexiva de la igualdad, "igualamos" las dos expresiones algebraicas obtenidas en los despejes.

  3. Resolvemos la ecuación de una sola variable resultante para hallar la primera coordenada y finalmente sustituimos ese valor en cualquiera de los despejes para hallar la segunda variable.'
explicacion_formal: '### Definición formal

  Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$, el **algoritmo algebraico de igualación** aplica la propiedad transitiva:


  $$\text{1. Despejar } y \text{ en Ecuación 1 y 2: } y = \frac{c_1 - a_1 x}{b_1} \quad \text{y} \quad y = \frac{c_2 - a_2 x}{b_2} \quad (b_1, b_2 \neq 0)$$


  $$\text{2. Igualación por transitividad: } \frac{c_1 - a_1 x}{b_1} = \frac{c_2 - a_2 x}{b_2}$$


  $$\text{3. Multiplicar en cruz y despejar: } b_2 (c_1 - a_1 x) = b_1 (c_2 - a_2 x) \implies x = x_0$$


  ### Síntesis didáctica

  Este método es ideal cuando una de las incógnitas ya figura despejada o presenta coeficientes numéricos idénticos en ambas ecuaciones.

  '
definiciones_clave: '- **Método de igualación**: Procedimiento algebraico de resolución basado en equiparar dos expresiones de la misma variable despejada en ecuaciones distintas.

  - **Propiedad transitiva de la igualdad**: Axioma matemático que establece que si $A = C$ y $B = C$, entonces $A = B$.

  '
propiedades_relaciones: '- **Requisito de variable idéntica**: Ambos despejes deben aislar rigurosamente la misma incógnita ($x$ en ambas o $y$ en ambas).

  - **Multiplicación cruzada de denominadores**: Al igualar fracciones $A/b_1 = B/b_2$, se multiplican de forma cruzada $b_2 A = b_1 B$ para enterizar la ecuación.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución mediante el método de igualación](/static/img/nodos/resolucion-mediante-el-metodo-de-igualacion-ejemplos.svg)


    Resuelve por el método de igualación el sistema $\begin{cases} x + 2y = 8 \\ 3x - 2y = 4 \end{cases}$ despejando $2y$ en ambas ecuaciones y evalúa el par $(x, y)$.'
  pasos:
  - 'Paso 1: Despejar $2y$ en la primera ecuación: $2y = 8 - x$.'
  - 'Paso 2: Despejar $2y$ en la segunda ecuación: $2y = 3x - 4$.'
  - 'Paso 3: Igualar las dos expresiones algebraicas por la transitividad de $2y$: $8 - x = 3x - 4$.'
  - 'Paso 4: Trasponer términos semejantes: $8 + 4 = 3x + x \implies 12 = 4x \implies x = 3$.'
  - 'Paso 5: Sustituir $x = 3$ en el primer despeje: $2y = 8 - 3 = 5 \implies y = \frac{5}{2} = 2{,}5$.'
  - 'Paso 6: Concluir que el par ordenado solución es $(x, y) = (3; 2{,}5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al igualar los despejes de la expresión $2y$ ($8 - x$ y $3x - 4$), ¿cuál es la ecuación lineal resultante en una sola variable?
  choices:
  - text: $8 - x = 3x - 4$
    is_correct: true
  - text: $8 + x = 3x + 4$
    is_correct: false
  - text: $2(8 - x) = 3x - 4$
    is_correct: false
  - text: $8 - x + 3x - 4 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$8 - x = 3x - 4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver la ecuación igualada $8 - x = 3x - 4$, ¿cuál es el valor de $x$ obtenido?
  choices:
  - text: $x = 3$
    is_correct: true
  - text: $x = 4$
    is_correct: false
  - text: $x = 12$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elegir una de las dos variables ($x$ o $y$) para aislarla en ambas ecuaciones.'
- 'Paso 2: Efectuar el despeje completo de esa variable en la Ecuación 1 y en la Ecuación 2.'
- 'Paso 3: Igualar las dos expresiones del segundo miembro estructurando una nueva ecuación.'
- 'Paso 4: Resolver la ecuación lineal de una sola variable eliminando denominadores mediante producto cruzado.'
- 'Paso 5: Reemplazar el valor hallado en cualquiera de las expresiones despejadas del Paso 2 para hallar la segunda variable.'
errores_correccion: '- **Error 1:** Despejar variables distintas en cada ecuación (despejar $x$ en la primera y despejar $y$ en la segunda) e igualar esas expresiones compuestas. **Cómo corregirlo:** La igualación **EXIGE DESPEJAR RIGUROSAMENTE LA MISMA VARIABLE EN AMBAS ECUACIONES ($y = A(x) \text{ e } y = B(x)$)**.

  - **Error 2:** Olvidar multiplicar por el denominador opuesto al despejar las fracciones igualadas. **Cómo corregirlo:** Al igualar $\frac{A}{b_1} = \frac{B}{b_2}$, **SE DEBE MULTIPLICAR EN CRUZ $b_2 A = b_1 B$ PARA ENTERIZAR LA IGUALDAD**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Resuelve por igualación el sistema $\begin{cases} y = 2x + 1 \\ y = -x + 7 \end{cases}$.
  alternativas:
  - $(2, 5)$
  - $(5, 2)$
  - $(3, 4)$
  respuesta: $(2, 5)$
  solucion_pasos:
  - '1. Igualar $y$: $2x + 1 = -x + 7$.'
  - 2. $3x = 6 \implies x = 2$.
  - '3. $y = 2(2) + 1 = 5$. Solución: $(2, 5)$.'
- titulo: Ejemplo 2
  enunciado: En el sistema $\begin{cases} x = 10 - 2y \\ x = 4 + y \end{cases}$, determina el valor de $y$.
  alternativas:
  - $y = 2$
  - $y = 3$
  - $y = 6$
  respuesta: $y = 2$
  solucion_pasos:
  - '1. Igualar $x$: $10 - 2y = 4 + y$.'
  - 2. $10 - 4 = 3y \implies 6 = 3y \implies y = 2$.
- titulo: Propiedad transitiva
  enunciado: ¿El método de igualación fundamenta su validez en la propiedad transitiva de la igualdad matemática?
  respuesta: Sí
  solucion_pasos:
  - Sí, dos cantidades iguales a una tercera son iguales entre sí.
- titulo: Misma variable despejada
  enunciado: ¿Se requiere aislar la misma incógnita en ambas ecuaciones antes de equiparar?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la condición necesaria para reducir a una sola variable.
errores_frecuentes:
- En el método de igualación, se despeja la variable $x$ en la primera ecuación y la variable $y$ en la segunda ecuación para luego igualar ambas expresiones.
- Al igualar las expresiones fraccionarias $\frac{8 - x}{2} = \frac{4 + 2y}{3}$, los denominadores se eliminan sumándolos en vez de realizar la multiplicación en cruz.
- Al trasponer los términos de la ecuación igualada $8 - x = 3x - 4$, los sumandos conservan sus signos produciendo $8 - 4 = 3x - x$.
- Al obtener el valor de la primera incógnita $x = 3$, la resolución se concluye omitiendo reemplazar $x$ en los despejes para determinar $y$.
- El método de igualación requiere que los coeficientes iniciales de ambas ecuaciones sean estrictamente iguales a 1.
afirmaciones_verdaderas:
- El método de igualación aísla la misma variable en las dos ecuaciones para equiparar sus expresiones equivalentes.
- La igualdad de dos expresiones con una misma incógnita reduce el sistema a una ecuación lineal de primer grado.
al_terminar_debes_poder: '**QUÉ:** Resolver sistemas de ecuaciones lineales 2x2 mediante el método de igualación.


  **CÓMO:** Despejando la misma incógnita en ambas ecuaciones, igualando algebraicamente las dos expresiones resultantes y hallando el valor de cada variable.


  ![Resumen Resolución mediante el método de igualación](/static/img/nodos/resolucion-mediante-el-metodo-de-igualacion-resumen.svg)'
