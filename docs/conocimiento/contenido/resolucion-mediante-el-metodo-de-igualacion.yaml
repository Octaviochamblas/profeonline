    de la igualdad en resolución mediante el método de igualación.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al obtener el valor de la incógnita en resolución mediante el método de
    igualación, ¿qué paso final se recomienda?
  choices:
