semantic_id: MAT.ALG.DESIG_PROPIEDADES.MULTIPLICACION_NEGATIVA
resumen_inicial: 'Multiplicación de una desigualdad por una cantidad negativa: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: El comportamiento de las desigualdades difiere del de las igualdades
  cuando se involucran multiplicaciones por valores menores a cero, requiriendo un
  cambio en la orientación del signo.
explicacion_formal: '### Definición formal

  Sean $a, b, c \in \mathbb{R}$, con $c < 0$. Si $a < b$, entonces $a \cdot c > b
  \cdot c$. Y si $a > b$, entonces $a \cdot c < b \cdot c$.


  ### Desarrollo didáctico

  Piensa en la recta numérica: los números positivos crecen hacia la derecha. Al multiplicar
  por un negativo, se refleja todo respecto al cero. Lo que estaba más a la derecha
  (era mayor), ahora queda más a la izquierda (es menor).'
definiciones_clave: '- **Multiplicación de una desigualdad por una cantidad negativa**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a multiplicación de una desigualdad por
  una cantidad negativa.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de multiplicación
    de una desigualdad por una cantidad negativa.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de multiplicación de una desigualdad por una
    cantidad negativa, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
