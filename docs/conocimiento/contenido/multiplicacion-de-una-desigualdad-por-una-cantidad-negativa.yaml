semantic_id: MAT.ALG.DESIG_PROPIEDADES.MULTIPLICACION_NEGATIVA
resumen_inicial: Multiplicar ambos miembros de una desigualdad por un número negativo
  exige invertir el sentido de la desigualdad.
explicacion_simple: '¡Esta es la regla de oro de las desigualdades!

  Si multiplicas ambos lados de una desigualdad por un número negativo (como por $-1$
  o $-3$), **DEBES INVERTIR EL SENTIDO DEL SÍMBOLO**:

  el símbolo menor que ($<$) se convierte en mayor que ($>$), y el símbolo mayor que
  ($>$) se convierte en menor que ($<$).

  Esto ocurre porque al multiplicar por un negativo, las posiciones en la recta numérica
  se reflejan en el lado opuesto del cero.'
explicacion_formal: 'Para todas las constantes $a, b, c \in \mathbb{R}$ con $c < 0$
  (estrictamente negativo):


  $$a < b \iff a \cdot c > b \cdot c \quad (c < 0)$$

  $$a \ge b \iff a \cdot c \le b \cdot c \quad (c < 0)$$


  **Desglose de la fórmula:**

  - $c < 0$: Inversión de la orientación espacial relativa en los números reales por
  simetría respecto al origen $0$.'
definiciones_clave: '- **Inversión de sentido**: Cambio obligatorio del operador de
  orden ($< \implies >, > \implies <, \le \implies \ge, \ge \implies \le$) al operar
  con negativos.

  - **Multiplicador negativo ($c < 0$)**: Escalar menor que cero que invierte el orden
  en $\mathbb{R}$.'
propiedades_relaciones: '- **Simetría respecto a cero**: Multiplicar por $-1$ voltea
  la recta numérica, invirtiendo la izquierda y la derecha.'
ejemplo_guiado:
  enunciado: Dada la desigualdad $2 < 5$, multiplica ambos miembros por el escalar
    negativo $c = -3$, invierte el sentido y comprueba el resultado.
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $2 < 5$.Paso 2: Multiplicar el primer
    miembro por $-3$: $2 \cdot (-3) = -6$.Paso 3: Multiplicar el segundo miembro por
    $-3$: $5 \cdot (-3) = -15$.Paso 4: Invertir el sentido del símbolo $<$ a $>$:
    $-6 > -15$.Paso 5: Comprobar en la recta numérica: $-6$ está a la derecha de $-15$,
    luego $-6 > -15$ es VERDADERO.'
checkpoints:
- placement: after_explicacion_formal
  question: Al multiplicar la desigualdad $2 < 5$ por el número negativo $-3$, ¿cuál
    es el resultado correcto al invertir el sentido?
  choices:
  - text: $-6 > -15$
    is_correct: true
  - text: $-6 < -15$
    is_correct: false
  - text: $6 > 15$
    is_correct: false
  - text: $-6 = -15$
    is_correct: false
  explanation: La alternativa correcta es '$-6 > -15$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es obligatorio invertir el símbolo al multiplicar por una cantidad
    negativa $c < 0$?
  choices:
  - text: Porque las posiciones en la recta numérica se invierten respecto al origen
      cero.
    is_correct: true
  - text: Porque las multiplicaciones siempre eliminan los símbolos de orden.
    is_correct: false
  - text: Porque los números negativos no existen en la recta.
    is_correct: false
  - text: Porque el resultado siempre debe dar positivo.
    is_correct: false
  explanation: La alternativa correcta es 'Porque las posiciones en la recta numérica
    se invierten respecto al origen cero.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el número multiplicador $c$ es negativo ($c < 0$).'
- 'Paso 2: Multiplicar el primer y el segundo miembro por $c$.'
- 'Paso 3: INVERTIR el sentido del símbolo de desigualdad ($< \implies >, \le \implies
  \ge$).'
- 'Paso 4: Verificar la validez del resultado en la recta numérica.'
errores_correccion: '- **Error común:** Multiplicar por un número negativo y mantener
  el mismo símbolo de desigualdad (escribir $-6 < -15$, lo cual es falso).

  - **Cómo corregirlo:** Grábate la regla de oro: SI MULTIPLICAS POR UN NEGATIVO,
  VOLTEA EL SÍMBOLO.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
  - 'Al multiplicar la desigualdad $3 < 7$ por el escalar negativo $c = -2$, la relación de orden resulta en $-6 < -14$.'
  - 'Multiplicar ambos miembros de una desigualdad por un número negativo $c < 0$ mantiene inalterada la orientación del símbolo.'
  - 'Dada la relación $a \le b$ y $c = -1$, la multiplicación directa produce la desigualdad $-a \le -b$.'
  - 'La regla de cambio de sentido al multiplicar por $c < 0$ se aplica también al multiplicar por el número cero $c = 0$.'
  - 'Al multiplicar la inecuación $-\frac{x}{4} > 2$ por $-4$, la respuesta correcta es $x > -8$.'
afirmaciones_verdaderas:
  - 'Multiplicar ambos miembros de una desigualdad por una cantidad negativa $c < 0$ invierte el sentido de la relación de orden.'
  - 'Si $a < b$ y $c < 0$, la multiplicación satisface la relación $a \cdot c > b \cdot c$.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la propiedad de multiplicación por cantidades negativas en desigualdades.
  CÓMO: Multiplicar ambos miembros por $c < 0$, invertir la orientación del símbolo de orden y evaluar la relación numérica en $\mathbb{R}$.
