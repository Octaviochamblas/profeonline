semantic_id: MAT.NUM.ENTEROS_OPERATORIA.SUSTRACCION_REGLA
resumen_inicial: "Restar un entero equivale a sumar su opuesto: $a-b=a+(-b)$. Así, dominar la suma alcanza para dominar la resta."
explicacion_simple: |
  En el fondo la resta no es una operación tan distinta de la suma. Restar un número es
  exactamente lo mismo que sumar su opuesto. Si te quitan 3 puntos a favor, es el mismo
  efecto que si te agregan 3 puntos de castigo (negativos). Para resolver $7-3$, lo
  transformas en $7+(-3)=4$. Una vez que sabes sumar enteros, ¡ya sabes restarlos!
explicacion_formal: |
  Para $a, b \in \mathbb{Z}$: $a - b = a + (-b)$, donde $-b$ es el opuesto de $b$. Restar
  un positivo equivale a sumar un negativo ($a-(+b)=a+(-b)$); restar un negativo equivale
  a sumar un positivo ($a-(-b)=a+b$).
definiciones_clave: |
  **Minuendo**: el primer término de una resta. **Sustraendo**: el término que se resta.
  **Transformación resta-suma**: $a-b=a+(-b)$.
propiedades_relaciones: |
  La sustracción no cumple las propiedades conmutativa ni asociativa, pero al
  transformarla en suma del opuesto se pueden reutilizar todas las reglas y propiedades de
  la adición.
ejemplo_guiado:
  enunciado: "Calcula $(-6) - (-15)$."
  pasos:
    - "El sustraendo es $-15$; su opuesto es $+15$."
    - "Se transforma la resta en suma: $(-6) + (+15)$."
    - "Signos distintos: se resta $15-6=9$ y se conserva el signo del mayor: el resultado es $+9$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Según la regla de la resta, ¿en qué se transforma $a - (-b)$?"
    choices:
      - {text: "$a + b$", is_correct: true}
      - {text: "$a - b$", is_correct: false}
      - {text: "$-a + b$", is_correct: false}
      - {text: "$-a - b$", is_correct: false}
    explanation: "La correcta es $a + b$: restar un negativo equivale a sumar su opuesto positivo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-4) - (-20)$?"
    choices:
      - {text: "$16$", is_correct: true}
      - {text: "$-16$", is_correct: false}
      - {text: "$-24$", is_correct: false}
      - {text: "$24$", is_correct: false}
    explanation: "La correcta es $16$: se transforma en $(-4)+(+20)$, y $20-4=16$ con signo positivo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el minuendo (primer término) y el sustraendo (segundo término, el que se está restando)."
  - "Paso 2: Escribir el minuendo idéntico, cambiar el signo de resta ($-$) por una suma ($+$), y reemplazar el sustraendo por su opuesto."
  - "Paso 3: Resolver la adición resultante utilizando las reglas de suma de enteros (igual signo o diferente signo)."
errores_correccion: |
  Un error frecuente es cambiar el signo del minuendo en vez del sustraendo. Otro error es
  cambiar el sustraendo a su opuesto pero olvidar convertir el signo de resta en signo de
  suma, dejando la operación mal planteada.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcular el resultado de la sustracción: $(-12) - (+5)$."
    alternativas:
      - "$-17$"
      - "$17$"
      - "$-7$"
    respuesta: "$-17$"
    solucion_pasos:
      - "Identificar los términos: el minuendo es $-12$, el sustraendo es $+5$."
      - "Transformar la resta en suma sumando el opuesto de $+5$: $(-12) + (-5)$."
      - "Resolver la suma: como ambos sumandos son negativos (mismo signo), sumamos sus valores absolutos ($12 + 5 = 17$) y conservamos el signo: $-17$."
  - titulo: "Ejemplo 2"
    enunciado: "Calcular el resultado de la sustracción: $(+8) - (-14)$."
    alternativas:
      - "$22$"
      - "$-22$"
      - "$-6$"
    respuesta: "$22$"
    solucion_pasos:
      - "Identificar los términos: el minuendo es $+8$, el sustraendo es $-14$."
      - "Transformar la resta en suma sumando el opuesto de $-14$, que es $+14$: $(+8) + (+14)$."
      - "Resolver la suma: ambos son positivos, por lo que el resultado es $+22$ (o $22$)."
  - titulo: "¿Es $(-10) - (-10)$ igual a cero?"
    respuesta: "Sí"
    solucion_pasos:
      - "Aplicamos la regla de la resta: $(-10) + (+10)$."
      - "Sumar un número con su opuesto da como resultado cero."
      - "Por lo tanto, $(-10) - (-10) = 0$."
  - titulo: "¿El resultado de restar un número de otro menor es siempre negativo?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sean $a, b \in \mathbb{Z}$ tales que $a < b$.'
      - "Al realizar $a - b$, estamos sumando al menor $a$ un número con mayor valor absoluto y signo negativo ($-b$)."
      - "Dado que $|-b| > |a|$ y el término con mayor valor absoluto es negativo, la suma $a + (-b)$ debe dar un resultado negativo."
errores_frecuentes:
  - "Cambiar el signo del minuendo en lugar del sustraendo (ej: transformar $5 - 8$ en $-5 + 8$)."
  - "No cambiar el signo de resta a suma al cambiar el signo del sustraendo (ej: dejar $5 - (-8)$ como $5 - 8$)."
  - "Creer que restar un número negativo da un resultado menor (ej: pensar que $5 - (-2) = 3$ en lugar de $7$)."
  - "Confundir la regla del opuesto en la resta con la regla de la multiplicación."
  - "Aplicar la propiedad conmutativa en la resta directamente (ej: decir que $3 - 9 = 9 - 3$)."
al_terminar_debes_poder: |
  Transformar cualquier sustracción de enteros en una suma del opuesto y resolverla
  correctamente aplicando las reglas de adición.
fuente: "Enteros"
estado: publicado
