semantic_id: MAT.NUM.ENTEROS_OPERATORIA.SUSTRACCION_REGLA
resumen_inicial: 'Restar un entero equivale a sumar su inverso aditivo: $a - b = a + (-b)$.'
explicacion_simple: 'En el conjunto de los enteros, la resta no se considera una operación diferente, sino una suma disfrazada. Restar un número es exactamente igual a sumar su opuesto aditivo. Por ejemplo, restar $+5$ equivale a sumar $-5$, y restar $-5$ equivale a sumar $+5$.


  ![Transformación de sustracción a suma por el inverso](/static/img/nodos/transformacion-de-sustraccion-a-suma-por-el-inverso-intro.svg)'
explicacion_formal: 'Para todo par de enteros $a, b \in \mathbb{Z}$, la **Definición de Sustracción** la transforma unívocamente en una adición con el inverso aditivo del sustraendo:


  $$a - b = a + (-b)$$


  **Desglose de la fórmula:**

  - $a$: Minuendo de la sustracción.

  - $b$: Sustraendo que se va a restar.

  - $a + (-b)$: Adición del minuendo $a$ con el inverso aditivo $-b$.


  > **Complemento didáctico:** Restar un entero negativo como $8 - (-3)$ se convierte en la suma de dos positivos: $8 + (+3) = 11$.'
definiciones_clave: '- **Transformación de sustracción**: Regla que convierte $a - b$ en $a + (-b)$.

  - **Minuendo y sustraendo**: Términos inicial y restado respectivamente en la sustracción.'
propiedades_relaciones: '- **No conmutativa**: $a - b \neq b - a$ en general.'
ejemplo_guiado:
  enunciado: 'Calcule la sustracción $7 - (-12)$ transformándola previamente en adición.


    ![Ejemplo Transformación de sustracción a suma por el inverso](/static/img/nodos/transformacion-de-sustraccion-a-suma-por-el-inverso-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el minuendo $7$ y el sustraendo $-12$.'
  - 'Paso 2: Reemplazar la resta por la suma del opuesto del sustraendo: $7 + (-(-12)) = 7 + 12$.'
  - 'Paso 3: Resolver la suma de enteros positivos: $7 + 12 = 19$.'
  - 'Conclusión: $7 - (-12) = 19$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué se transforma la resta 5 - (-3) según la regla de sustracción?
  choices:
  - text: En la suma 5 + 3 = 8
    is_correct: true
  - text: En la resta 5 - 3 = 2
    is_correct: false
  - text: En la multiplicación 5 · (-3)
    is_correct: false
  - text: En -5 - 3
    is_correct: false
  explanation: La alternativa correcta es 'En la suma 5 + 3 = 8'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado de 7 - (-12)?
  choices:
  - text: '19'
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: '-19'
    is_correct: false
  explanation: La alternativa correcta es '19'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Conservar el minuendo $a$ con su signo original.'
- 'Paso 2: Cambiar el signo de resta a suma y cambiar el signo del sustraendo $b$ a su opuesto $-b$.'
- 'Paso 3: Aplicar la regla de adición de enteros (igual signo o distinto signo).'
errores_correccion: '- **Error 1: Pensar que restar un número negativo siempre achica el resultado.** **Cómo corregirlo:** Restar un negativo equivale a sumar un positivo ($a - (-b) = a + b$), lo que aumenta el resultado.


  - **Error 2: Cambiar el signo del minuendo al transformar la resta.** **Cómo corregirlo:** El minuendo no cambia de signo; solo cambia el sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-10) - 14$.
  alternativas:
  - '-24'
  - '4'
  - '-4'
  respuesta: '-24'
  solucion_pasos:
  - $(-10) - 14 = (-10) + (-14) = -24$.
- titulo: Ejemplo 2
  enunciado: Si la temperatura inicial es $-3^\circ\text{C}$ y cae $8^\circ\text{C}$, ¿cuál es la temperatura final?
  alternativas:
  - -11°C
  - 5°C
  - -5°C
  respuesta: -11°C
  solucion_pasos:
  - $(-3) - 8 = (-3) + (-8) = -11^\circ\text{C}$.
- titulo: ¿Restar un número negativo equivale a sumar su valor positivo absoluto?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a - (-b) = a + b$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
- titulo: ¿Es la resta de enteros una operación conmutativa (a - b = b - a)?
  respuesta: 'No'
  solucion_pasos:
  - No, $5 - 3 = 2$ mientras que $3 - 5 = -2$.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
errores_frecuentes:
- Restar un entero negativo a una cantidad disminuye el valor final del resultado.
- La sustracción de números enteros es una operación que cumple la propiedad conmutativa.
- Al transformar una resta en suma se debe cambiar el signo tanto del minuendo como del sustraendo.
- Restar un entero positivo a un entero negativo resulta siempre en un entero positivo.
- La expresión $a - b$ es equivalente a la división de $a$ entre el inverso aditivo de $b$.
afirmaciones_verdaderas:
- 'Restar un entero $b$ a una cantidad $a$ equivale a sumar el inverso aditivo: $a - b = a + (-b)$.'
- Restar un número negativo incrementa el valor de la expresión original.
al_terminar_debes_poder: '**QUÉ:** Transformar y resolver cualquier sustracción de números enteros como una adición por el inverso.


  **CÓMO:** Aplicando la regla formal de conversión $a - b = a + (-b)$, en particular $a - (-b) = a + b$, y ejecutando las reglas de adición de enteros.


  ![Resumen Transformación de sustracción a suma por el inverso](/static/img/nodos/transformacion-de-sustraccion-a-suma-por-el-inverso-resumen.svg)'
