semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.CONDICION_BASE
resumen_inicial: La condición de base positiva y distinta de uno ($b > 0, b \neq 1$) en un logaritmo garantiza la inyectividad y existencia unívoca en el cuerpo real $\mathbb{R}$, excluyendo bases negativas que generan indeterminaciones complejas y base unitaria degenerada.
explicacion_simple: "![La condición de base positiva y distinta de uno ($b > 0, b \\neq 1$) en un logaritmo garantiza la inyectividad y existencia unívoca en el cuerpo real $\\mathbb{R}$, excluyendo bases negativas que generan indeterminaciones complejas y base unitaria degenerada](/static/img/nodos/identificacion-de-la-condicion-de-base-positiva-y-distinta-de-uno-en-un-logaritmo-intro.svg)\n\n\nLa **base $b$** de un logaritmo $\\log_b(a)$ tiene dos reglas obligatorias de supervivencia:\n\n1. **Debe ser estrictamente positiva ($b > 0$):**\n   - Si intentas $\\log_{-2}(8) = c \\implies (-2)^c = 8$, para números enteros impares puede dar $(-2)^3 = -8$ (signo cambiado) y para potencias fraccionarias $(-2)^{1/2} = \\sqrt{-2} \\notin \\mathbb{R}$. ¡No forma una función continua!\n2. **Debe ser distinta de 1 ($b \\neq 1$):**\n   - Si intentas $\\log_1(5) = c \\implies 1^c = 5$.\n   - Pero $1^c$ SIEMPRE DA 1 para cualquier número $c$. ¡Nunca puede dar 5!\n- Por eso, el conjunto de bases permitidas\
  \ es: **$b \\in ]0, 1[ \\cup ]1, +\\infty[$**."
explicacion_formal: "Sea el operador diferencial logarítmico $\\log_b(x) = \\frac{\\ln(x)}{\\ln(b)}$. Para que esté holomórficamente bien definido en $\\mathbb{R}^+$ sobre el cuerpo real $\\mathbb{R}$:\n\n1. **Existencia del denominador ($b > 0$)**:\n   El logaritmo natural $\\ln(b)$ existe en $\\mathbb{R}$ si y solo si $b > 0$.\n2. **No anulación del denominador ($b \\neq 1$)**:\n   Si $b = 1 \\implies \\ln(1) = 0$, produciendo una división por cero no acotada $\\frac{\\ln(x)}{0}$, lo que anula la existencia de la función inversa.\n3. **Monotonía estricta de la base**:\n   - Si $b > 1 \\implies \\ln(b) > 0 \\implies \\log_b(x)$ es estrictamente creciente.\n   - Si $0 < b < 1 \\implies \\ln(b) < 0 \\implies \\log_b(x)$ es estrictamente decreciente."
definiciones_clave: '- **Base admisible de logaritmo**: Elemento del conjunto $\mathcal{B} = \mathbb{R}^+ \setminus \{1\} = ]0, 1[ \cup ]1, +\infty[$.

  - **Indeterminación de base unitaria**: División por cero que surge al evaluar $\frac{\ln(a)}{\ln(1)}$.'
propiedades_relaciones: '- **Inyectividad asegurada**: Bajo $b > 0, b \neq 1$, $\log_b(x_1) = \log_b(x_2) \iff x_1 = x_2$.

  - **Bifurcación de signo**: Si $b > 1$, $\log_b(x) > 0$ para $x > 1$; si $0 < b < 1$, $\log_b(x) < 0$ para $x > 1$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La condición de base positiva y distinta de uno ($b > 0, b \neq 1$) en un logaritmo garantiza la inyectividad y existencia unívoca en el cuerpo real $\mathbb{R}$, excluyendo bases negativas que generan indeterminaciones complejas y base unitaria degenerada](/static/img/nodos/identificacion-de-la-condicion-de-base-positiva-y-distinta-de-uno-en-un-logaritmo-ejemplos.svg)



    Determina para qué valores reales de $x$ está bien definido el logaritmo $\log_{x - 3}(10)$.'
  pasos:
  - 'Paso 1: Identificar la base de la expresión: $b = x - 3$.'
  - 'Paso 2: Aplicar la condición de positividad estricta ($b > 0$):

    $x - 3 > 0 \implies x > 3$.'
  - 'Paso 3: Aplicar la condición de no degeneración ($b \neq 1$):

    $x - 3 \neq 1 \implies x \neq 4$.'
  - 'Paso 4: Intersectar ambas restricciones:

    $x \in ]3, +\infty[ \setminus \{4\} = ]3, 4[ \cup ]4, +\infty[$.'
  - 'Paso 5: Conclusión: La expresión está bien definida para todo $x \in ]3, 4[ \cup ]4, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué no existe $\log_1(7)$ en los números reales?
  choices:
  - text: Porque 1ᶜ = 1 para todo c real, siendo imposible obtener 7
    is_correct: true
  - text: Porque 7 no es múltiplo de 1
    is_correct: false
  - text: Porque el resultado es 0
    is_correct: false
  - text: Porque 1 es primo
    is_correct: false
  explanation: La alternativa correcta es 'Porque 1ᶜ = 1 para todo c real, siendo imposible obtener 7'. La base $b = 1$ no puede generar potencias distintas de 1.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Para qué valores de k es válida la base en $\log_{k + 2}(8)$?
  choices:
  - text: k > -2 y k ≠ -1
    is_correct: true
  - text: k > 0
    is_correct: false
  - text: k > -2
    is_correct: false
  - text: k ≠ 1
    is_correct: false
  explanation: La alternativa correcta es 'k > -2 y k ≠ -1'. Base $> 0 \implies k + 2 > 0 \implies k > -2$, y base $\neq 1 \implies k + 2 \neq 1 \implies k \neq -1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la base $b$ del logaritmo.'
- 'Paso 2: Plantear la desigualdad de positividad $b > 0$.'
- 'Paso 3: Plantear la restricción de diferencia $b \neq 1$.'
- 'Paso 4: Resolver el sistema de desigualdades e intersectar los intervalos resultantes.'
errores_correccion: '- **Error común:** Olvidar excluir el valor que hace la base igual a 1 (ej: en base $x$, solo decir $x > 0$ y olvidar $x \neq 1$).

  - **Cómo corregirlo:** La base **SIEMPRE debe excluir el valor 1**: $b \in ]0, 1[ \cup ]1, +\infty[$.'
ejemplos:
- titulo: 'Ejemplo 1: Base decimal válida'
  enunciado: ¿Es válida la base $b = 0{,}7$ en $\log_{0{,}7}(5)$?
  alternativas:
  - Sí, porque 0,7 > 0 y 0,7 ≠ 1
  - No, la base debe ser entera
  - No, es menor que 1
  - Solo si el argumento es entero
  respuesta: Sí, porque 0,7 > 0 y 0,7 ≠ 1
  solucion_pasos:
  - 'Paso 1: $0{,}7 \in ]0, 1[ \implies$ base válida.'
- titulo: 'Ejemplo 2: Base negativa rechazada'
  enunciado: ¿Por qué $\log_{-3}(9)$ no se define en $\mathbb{R}$?
  alternativas:
  - Porque la base es negativa (b < 0)
  - Porque 9 no es múltiplo de 3
  - Porque da 2
  - Porque no es potencia
  respuesta: Porque la base es negativa (b < 0)
  solucion_pasos:
  - 'Paso 1: Bases negativas generan discontinuidades no reales.'
- titulo: 'Ejemplo 3: Base algebraica'
  enunciado: En $\log_{2x - 6}(15)$, ¿cuál es la restricción para $x$?
  alternativas:
  - x > 3 y x ≠ 3,5
  - x > 3
  - x > 0
  - x ≠ 3
  respuesta: x > 3 y x ≠ 3,5
  solucion_pasos:
  - 'Paso 1: $2x - 6 > 0 \implies x > 3$, y $2x - 6 \neq 1 \implies 2x \neq 7 \implies x \neq 3{,}5$.'
- titulo: 'Ejemplo 4: Base unitaria rechazada'
  enunciado: ¿Qué problema presenta $\log_1(1)$?
  alternativas:
  - Es indeterminado porque 1ᶜ = 1 para cualquier número real c
  - Da 1
  - Da 0
  - Da infinito
  respuesta: Es indeterminado porque 1ᶜ = 1 para cualquier número real c
  solucion_pasos:
  - 'Paso 1: No existe un valor único $c$, perdiendo la inyectividad.'
errores_frecuentes:
- Olvidar la condición b ≠ 1 al determinar dominios de bases con variables.
- Permitir bases negativas cuando el exponente es entero par.
- Confundir las restricciones de la base con las del argumento.
afirmaciones_verdaderas:
- La base de un logaritmo real debe pertenecer estrictamente a ]0, 1[ ∪ ]1, +∞[.
- La base b = 1 se excluye formalmente para evitar divisiones por cero en ln(1).
al_terminar_debes_poder: '**QUÉ:** Identificar y fundamentar las condiciones de existencia de la base de un logaritmo.


  **CÓMO:** Verificando b > 0 y b ≠ 1 para garantizar la continuidad e inyectividad de la función en ℝ.


