semantic_id: MAT.ALG.TRIG_COORDENADAS.ANGULOS_NOTABLES_PRIMER_CUADRANTE
resumen_inicial: 'Valores exactos del seno y el coseno para los ángulos notables $30^\circ$, $45^\circ$ y $60^\circ$ en el primer cuadrante.'
explicacion_simple: |
  En el primer cuadrante existen tres ángulos geométricos fundamentales llamados **ángulos notables**: $30^\circ$ ($\frac{\pi}{6}$), $45^\circ$ ($\frac{\pi}{4}$) y $60^\circ$ ($\frac{\pi}{3}$). Sus valores de seno y coseno no requieren calculadora porque se deducen directamente de triángulos especiales (el triángulo equilátero cortado a la mitad y el triángulo rectángulo isósceles). Las respuestas exactas usan las raíces cuadradas de $1, 2, 3$ divididas entre $2$: $\frac{\sqrt{1}}{2} = \frac{1}{2}$, $\frac{\sqrt{2}}{2}$ y $\frac{\sqrt{3}}{2}$.
explicacion_formal: |
  ### Definición formal
  Los **valores exactos de seno y coseno en el primer cuadrante** corresponden a las coordenadas $P(\cos \theta, \sin \theta)$ para los ángulos notables $\theta \in \left\{30^\circ, 45^\circ, 60^\circ\right\}$:

  $$\begin{array}{|c|c|c|c|}
  \hline
  \theta \text{ (grados)} & \theta \text{ (radianes)} & \cos \theta \text{ (abscisa } x\text{)} & \sin \theta \text{ (ordenada } y\text{)} \\
  \hline
  30^\circ & \frac{\pi}{6} & \frac{\sqrt{3}}{2} & \frac{1}{2} \\
  45^\circ & \frac{\pi}{4} & \frac{\sqrt{2}}{2} & \frac{\sqrt{2}}{2} \\
  60^\circ & \frac{\pi}{3} & \frac{1}{2} & \frac{\sqrt{3}}{2} \\
  \hline
  \end{array}$$

  ### Desglose simbólico
  - Regla mnemotécnica para el seno: $\sin(0^\circ) = \frac{\sqrt{0}}{2} = 0$, $\sin(30^\circ) = \frac{\sqrt{1}}{2} = \frac{1}{2}$, $\sin(45^\circ) = \frac{\sqrt{2}}{2}$, $\sin(60^\circ) = \frac{\sqrt{3}}{2}$, $\sin(90^\circ) = \frac{\sqrt{4}}{2} = 1$.
  - Coseno inverso: Para los mismos ángulos, el coseno toma exactamente la secuencia invertida de valores.

  ### Síntesis didáctica
  Conocer la tabla de ángulos notables del primer cuadrante permite calcular el seno y el coseno de cualquier ángulo en los otros tres cuadrantes mediante la simetría de los signos cartesiano.
definiciones_clave: |
  - **Ángulos notables**: Ángulos de $30^\circ$, $45^\circ$ y $60^\circ$ cuyas razones trigonométricas son expresiones algebraicas exactas.
  - **Identidad complementaria**: Propiedad por la cual $\sin(30^\circ) = \cos(60^\circ) = \frac{1}{2}$ y $\sin(60^\circ) = \cos(30^\circ) = \frac{\sqrt{3}}{2}$.
  - **Simetría a $45^\circ$**: Ángulo en el cual el seno y el coseno toman el mismo valor exacto $\frac{\sqrt{2}}{2}$.
propiedades_relaciones: |
  - **Ángulos complementarios**: Si $\alpha + \beta = 90^\circ \implies \sin \alpha = \cos \beta$ y $\cos \alpha = \sin \beta$.
  - **Puntos sobre el círculo unitario**:
    - $P_{30^\circ} = \left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$
    - $P_{45^\circ} = \left(\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}\right)$
    - $P_{60^\circ} = \left(\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto de la expresión $E = 2 \cdot \cos(60^\circ) + \sqrt{2} \cdot \sin(45^\circ)$.'
  pasos:
    - 'Paso 1: Consultar los valores notables exactos: $\cos(60^\circ) = \frac{1}{2}$ y $\sin(45^\circ) = \frac{\sqrt{2}}{2}$.'
    - 'Paso 2: Sustituir los valores en la expresión: $E = 2 \cdot \left(\frac{1}{2}\right) + \sqrt{2} \cdot \left(\frac{\sqrt{2}}{2}\right)$.'
    - 'Paso 3: Resolver las multiplicaciones: $2 \cdot \frac{1}{2} = 1$ y $\sqrt{2} \cdot \frac{\sqrt{2}}{2} = \frac{2}{2} = 1$.'
    - 'Paso 4: Sumar los términos simplificados: $E = 1 + 1 = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las coordenadas $(x,y)$ exactas sobre el círculo unitario para un ángulo de $30^\circ$ ($\frac{\pi}{6}$ rad)?'
    choices:
      - {text: '$\left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$', is_correct: true}
      - {text: '$\left(\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$', is_correct: false}
      - {text: '$\left(\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}\right)$', is_correct: false}
      - {text: '$(1, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$''. $\cos(30^\circ) = \frac{\sqrt{3}}{2}$ (abscisa) y $\sin(30^\circ) = \frac{1}{2}$ (ordenada).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué ángulo del primer cuadrante el seno y el coseno tienen exactamente el mismo valor?'
    choices:
      - {text: '$45^\circ$ ($\frac{\pi}{4}$ rad)', is_correct: true}
      - {text: '$30^\circ$ ($\frac{\pi}{6}$ rad)', is_correct: false}
      - {text: '$60^\circ$ ($\frac{\pi}{3}$ rad)', is_correct: false}
      - {text: '$0^\circ$ ($0$ rad)', is_correct: false}
    explanation: 'La alternativa correcta es ''$45^\circ$ ($\frac{\pi}{4}$ rad)''. En $45^\circ$, tanto el seno como el coseno valen $\frac{\sqrt{2}}{2}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si el ángulo dado corresponde a $30^\circ$, $45^\circ$ o $60^\circ$ (o sus equivalentes en radianes).'
  - 'Paso 2: Aplicar la regla mnemotécnica de la raíz dividida por 2 ($\frac{\sqrt{n}}{2}$).'
  - 'Paso 3: Asignar el coseno a la coordenada $x$ y el seno a la coordenada $y$.'
  - 'Paso 4: Operar algebraicamente conservando los valores radicales exactos.'
errores_correccion: |
  - **Error 1:** Confundir los valores de $30^\circ$ y $60^\circ$ asignando $\sin(30^\circ) = \frac{\sqrt{3}}{2}$. **Cómo corregirlo:** En $30^\circ$ la altura es menor ($\sin(30^\circ) = \frac{1}{2}$) y la base es mayor ($\cos(30^\circ) = \frac{\sqrt{3}}{2}$). En $60^\circ$ ocurre lo opuesto.
  - **Error 2:** Reemplazar los valores radicales exactos como $\frac{\sqrt{3}}{2}$ por aproximaciones decimales como $0.866$. **Cómo corregirlo:** La trigonometría académica PAES exige trabajar con los valores racionales y radicales exactos.
ejemplos:
  - titulo: 'Seno de 60 grados'
    enunciado: '¿Cuál es el valor exacto de $\sin(60^\circ)$?'
    alternativas:
      - '$\frac{\sqrt{3}}{2}$'
      - '$\frac{1}{2}$'
      - '$\frac{\sqrt{2}}{2}$'
    respuesta: '$\frac{\sqrt{3}}{2}$'
    solucion_pasos:
      - '1. Para $60^\circ$, el cateto opuesto es el mayor.'
      - '2. Por lo tanto, $\sin(60^\circ) = \frac{\sqrt{3}}{2}$.'
  - titulo: 'Coseno de 45 grados'
    enunciado: '¿Cuánto vale $\cos\left(\frac{\pi}{4}\right)$?'
    alternativas:
      - '$\frac{\sqrt{2}}{2}$'
      - '$\frac{1}{2}$'
      - '$\frac{\sqrt{3}}{2}$'
    respuesta: '$\frac{\sqrt{2}}{2}$'
    solucion_pasos:
      - '1. $\frac{\pi}{4}$ equivale a $45^\circ$.'
      - '2. $\cos(45^\circ) = \frac{\sqrt{2}}{2}$.'
  - titulo: 'Igualdad de complemento'
    enunciado: '¿Es $\sin(30^\circ)$ igual a $\cos(60^\circ)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues ambos valen exactamente $\frac{1}{2}$ por ser ángulos complementarios.'
  - titulo: 'Suma de cuadrados en 45 grados'
    enunciado: '¿Se cumple que $\cos^2(45^\circ) + \sin^2(45^\circ) = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\left(\frac{\sqrt{2}}{2}\right)^2 + \left(\frac{\sqrt{2}}{2}\right)^2 = \frac{2}{4} + \frac{2}{4} = 1$.'
errores_frecuentes:
  - 'La afirmación de que el seno de $30^\circ$ es igual a $\frac{\sqrt{3}}{2}$.'
  - 'La afirmación de que en $45^\circ$ el coseno vale $\frac{1}{2}$.'
  - 'La afirmación de que $\cos(60^\circ)$ es mayor que $\cos(30^\circ)$.'
  - 'La afirmación de que las razones trigonométricas de ángulos notables requieren usar aproximaciones decimales.'
  - 'La afirmación de que la suma $\sin(30^\circ) + \cos(60^\circ)$ es igual a $\sqrt{3}$.'
afirmaciones_verdaderas:
  - 'Para los ángulos notables $30^\circ$, $45^\circ$ y $60^\circ$, los valores exactos de seno y coseno corresponden a combinaciones de $\frac{1}{2}$, $\frac{\sqrt{2}}{2}$ y $\frac{\sqrt{3}}{2}$.'
  - 'Los ángulos complementarios del primer cuadrante ($30^\circ$ y $60^\circ$) intercambian exactamente sus valores de seno y coseno.'
al_terminar_debes_poder: |
  QUÉ: Memorizar e interpretar los valores exactos de seno y coseno para los ángulos notables $30^\circ$, $45^\circ$ y $60^\circ$.
  CÓMO: Aplicar la tabla de radicales sobre 2 y las identidades de ángulos complementarios en el primer cuadrante.
