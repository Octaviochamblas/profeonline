semantic_id: MAT.ALG.TRIG_COORDENADAS.ANGULOS_NOTABLES_PRIMER_CUADRANTE
resumen_inicial: 'Determinación de valores exactos de seno y coseno para ángulos notables
  del primer cuadrante: círculo unitario, amplitud, período y transformaciones de
  Seno y coseno en el círculo unitario.'
explicacion_simple: Además de los ángulos cuadrantales, existen otros tres ángulos
  del primer cuadrante cuyos valores de seno y coseno se pueden calcular exactamente,
  sin usar calculadora.
explicacion_formal: '### Definición formal


  Los valores exactos son: $\sin(30°)=1/2$, $\cos(30°)=\sqrt{3}/2$; $\sin(45°)=\sqrt{2}/2$,
  $\cos(45°)=\sqrt{2}/2$; $\sin(60°)=\sqrt{3}/2$, $\cos(60°)=1/2$. Se derivan de un
  triángulo equilátero (para $30°$ y $60°$) y de un triángulo rectángulo isósceles
  (para $45°$).


  ### Desarrollo didáctico


  Nota que $\sin(30°)=\cos(60°)$ y $\sin(60°)=\cos(30°)$: los valores de seno y coseno
  de ángulos complementarios ($30°+60°=90°$) se intercambian, un patrón útil para
  memorizar la tabla completa.'
definiciones_clave: '- **Determinación de valores exactos de seno y coseno para ángulos
  notables del primer cuadrante**: Función periódica fundamentada en las coordenadas
  del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación de valores exactos de seno y coseno para ángulos notables
  del primer cuadrante.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación de valores exactos de seno y coseno para ángulos notables del primer
    cuadrante.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación de valores exactos de seno y coseno para
    ángulos notables del primer cuadrante.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
