semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_GENERAL
resumen_inicial: Resolver $a x^2 + b x + c = 0$ con $a \neq 1$ se efectúa descomponiendo
  el término central $b x$ mediante dos números que multipliquen $a \cdot c$ y sumen
  $b$.
explicacion_simple: 'Para factorizar una **ecuación completa donde $a \neq 1$ ($a
  x^2 + b x + c = 0$)**:

  1. Multiplicamos el primer coeficiente $a$ por el último término $c$, obteniendo
  un producto $P = a \cdot c$.

  2. Buscamos dos números que **multiplicados den $P = a \cdot c$** y **sumados den
  $b$**.

  3. Descomponemos el término central $b x$ en esos dos números y factorizamos por
  agrupación de términos (o usando el método de tijeras/descomposición).

  - Ejemplo: $2x^2 + 7x + 3 = 0 \implies a \cdot c = 2 \cdot 3 = 6$.

  - Buscamos números que multipliquen $6$ y sumen $7 \implies 6$ y $1$.

  - Descomponemos $7x$: $2x^2 + 6x + 1x + 3 = 0 \implies 2x(x + 3) + 1(x + 3) = 0
  \implies (2x + 1)(x + 3) = 0$.

  - Soluciones: $x_1 = -1/2$ y $x_2 = -3$.'
explicacion_formal: 'El **método de descomposición por agrupación (método $ac$)**
  para trinomios generales se expresa como:


  $$a x^2 + b x + c = 0 \quad \text{donde } b = m + n \quad \land \quad m \cdot n
  = a \cdot c$$

  $$a x^2 + m x + n x + c = 0 \implies (a_1 x + c_1)(a_2 x + c_2) = 0$$


  **Desglose de la fórmula:**

  - Extensión del axioma de distributividad mediante agrupación en dos pares binómicos
  con factor común compartido.'
definiciones_clave: '- **Método $ac$ / Descomposición de término medio**: Técnica
  algebraica de factorización para trinomios no mónicos ($a \neq 1$).'
propiedades_relaciones: '- **Equivalencia con fórmula general**: Todo trinomio general
  que admite factorización entera da como resultado raíces racionales en la fórmula
  general.'
ejemplo_guiado:
  enunciado: Resuelve por factorización la ecuación cuadrática $2x^2 + 7x + 3 = 0$.
  pasos:
  - 'Paso 1: Multiplicar $a \cdot c = 2 \cdot 3 = 6$.Paso 2: Buscar dos números que
    multiplicados den $6$ y sumados den $b = 7$: los números son $6$ y $1$.Paso 3:
    Reescribir $7x$ como $6x + 1x$: $2x^2 + 6x + x + 3 = 0$.Paso 4: Factorizar por
    agrupación de términos: $2x(x + 3) + 1(x + 3) = 0 \implies (2x + 1)(x + 3) = 0$.Paso
    5: Aplicar producto nulo: $2x + 1 = 0 \implies x_1 = -\frac{1}{2}$ y $x + 3 =
    0 \implies x_2 = -3$.'
checkpoints:
