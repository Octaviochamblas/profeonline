- placement: after_ejemplo_guiado
  question: En el método $ac$ para la ecuación $3x^2 - 5x - 2 = 0$, ¿cuál es el producto
    objetivo $a \cdot c$ que se debe formar?
  choices:
  - text: $a \cdot c = 3 \cdot (-2) = -6$
    is_correct: true
  - text: $a \cdot c = 6$
    is_correct: false
  - text: $a \cdot c = -5$
    is_correct: false
  - text: $a \cdot c = 1$
    is_correct: false
  explanation: La alternativa correcta es '$a \cdot c = 3 \cdot (-2) = -6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el producto $a \cdot c$.'
- 'Paso 2: Encontrar dos números $m, n$ tales que $m \cdot n = a \cdot c$ y $m + n
  = b$.'
- 'Paso 3: Reescribir el término $b x$ como $m x + n x$.'
- 'Paso 4: Agrupar de a pares, extraer factor común dos veces y despejar $x_1, x_2$
  con producto nulo.'
errores_correccion: '- **Error común:** Tratar de usar directamente los números $m$
  y $n$ como soluciones sin realizar la agrupación y el despeje del coeficiente $a$.

  - **Cómo corregirlo:** Como $a \neq 1$, las raíces tendrán denominadores que dependen
  de $a$; debes realizar todo el proceso de agrupación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución por factorización.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La propiedad del producto nulo exige que A * B = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, exige que el miembro derecho sea exactamente cero.
- titulo: ¿Toda ecuación incompleta ax^2 + bx = 0 admite la solución x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, al factorizar x(ax + b) = 0 se obtiene siempre x_1 = 0.
errores_frecuentes:
- Intentar aplicar la propiedad del producto nulo a una ecuación igualada a un número
  distinto de cero.
- Dividir una ecuación cuadrática entre la incógnita $x$ perdiendo la solución fundamental
  $x = 0$.
- Olvidar anteponer el doble signo $\pm$ al extraer raíz cuadrada en la resolución
  de $x^2 = k$.
- Confundir los números de los factores $(x+m)(x+n)$ con las soluciones reales de
  la ecuación (que tienen signos invertidos).
- Violar la jerarquía de operaciones al verificar raíces calculando multiplicaciones
  antes que potencias.
afirmaciones_verdaderas:
- La propiedad del producto nulo establece que $A \cdot B = 0 \iff A = 0 \lor B =
  0$.
- Toda ecuación incompleta binomia $a x^2 + b x = 0$ se resuelve por factor común
  $x(a x + b) = 0$ produciendo siempre la raíz $x = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones cuadráticas
  completas e incompletas mediante factorización de monomio común, trinomios simples,
  trinomios generales y verificación de raíces.
