semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_GENERAL
resumen_inicial: La resolución por trinomio general $ax^2 + bx + c = 0$ (con $a \neq 1$) aplica el método de agrupación multiplicando y dividiendo por el coeficiente principal $a$.
explicacion_simple: |
  Cuando la ecuación cuadrática tiene un coeficiente $a \neq 1$ delante de $x^2$ (ejemplo $2x^2 + 7x + 3 = 0$):

  1. Multiplicas el coeficiente $a$ por la constante $c$: $a \cdot c = 2 \cdot 3 = 6$.
  2. Buscas dos números que multiplicados den $6$ ($a \cdot c$) y sumados den $7$ ($b$): son $6$ y $1$.
  3. Descompones el término del medio $7x$ como $6x + 1x$:
     $$2x^2 + 6x + 1x + 3 = 0$$
  4. Factorizas por agrupación:
     $$2x(x + 3) + 1(x + 3) = 0 \implies (2x + 1)(x + 3) = 0$$
  5. Despejas las soluciones igualando cada factor a cero: $x_1 = -\frac{1}{2}$ y $x_2 = -3$.
explicacion_formal: |
  Sea el polinomio cuadrático no mónico $P(x) = ax^2 + bx + c$ con $a \neq 1$ y $a \neq 0$. El **método de factorización por agrupación (o método $a \cdot c$)** descompone el coeficiente lineal $b = m + n$ mediante un par de enteros $(m, n)$ que satisfacen:

  $$\begin{cases} m \cdot n = a \cdot c \\ m + n = b \end{cases}$$

  **Reestructuración del trinomio:**
  $$ax^2 + bx + c = ax^2 + mx + nx + c = 0$$
  Aplicando factorización por agrupación en pares de términos se obtiene el producto $(px + q)(rx + s) = 0$, cuyas raíces reales se determinan por $x = -\frac{q}{p}$ y $x = -\frac{s}{r}$.
definiciones_clave: |
  - **Trinomio general no mónico**: Polinomio de segundo grado cuyo coeficiente principal cuadrático es distinto de 1 ($a \neq 1$).
propiedades_relaciones: |
  - **Método de la Tijera o Aspa Simple**: Técnica gráfica equivalente para descomponer el término cuadrático $ax^2 = (a_1 x)(a_2 x)$ y el constante $c = (c_1)(c_2)$ de modo que la suma cruzada $a_1 c_2 + a_2 c_1 = b$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática no mónica $3x^2 - 5x - 2 = 0$ utilizando el método de agrupación $a \cdot c$.'
  pasos:
    - 'Paso 1: Multiplicar $a \cdot c = 3 \cdot (-2) = -6$.'
    - 'Paso 2: Buscar dos números que multiplicados den $-6$ y sumados den $-5$: los números son $-6$ y $+1$.'
    - 'Paso 3: Reescribir el término lineal $-5x$ como $-6x + 1x$: $3x^2 - 6x + 1x - 2 = 0$.'
    - 'Paso 4: Factorizar por agrupación: $3x(x - 2) + 1(x - 2) = (3x + 1)(x - 2) = 0$. Soluciones: $x_1 = -\frac{1}{3}$ y $x_2 = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el método $a \cdot c$ para factorizar $ax^2 + bx + c = 0$, ¿qué producto deben tener los dos números que descomponen a $b$?'
    choices:
      - {text: 'Su producto debe ser igual al resultado de $a \cdot c$.', is_correct: true}
      - {text: 'Su producto debe ser igual al coeficiente lineal $b$.', is_correct: false}
      - {text: 'Su producto debe ser igual a 1.', is_correct: false}
      - {text: 'Su producto debe ser siempre negativo.', is_correct: false}
    explanation: 'La alternativa correcta es ''Su producto debe ser igual al resultado de $a \cdot c$.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones reales de la ecuación $2x^2 + 5x + 3 = 0$?'
    choices:
      - {text: '$x_1 = -1$ y $x_2 = -\frac{3}{2}$', is_correct: true}
      - {text: '$x_1 = 1$ y $x_2 = \frac{3}{2}$', is_correct: false}
      - {text: '$x_1 = -2$ y $x_2 = -3$', is_correct: false}
      - {text: '$x_1 = 0$ y $x_2 = 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 = -1$ y $x_2 = -\frac{3}{2}$''. Al factorizar $(x+1)(2x+3)=0$, se obtienen $-1$ y $-3/2$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular el producto del coeficiente cuadrático por el término independiente ($a \cdot c$).'
  - 'Paso 2: Encontrar dos números $m$ y $n$ que multiplicados resulten $a \cdot c$ y sumados resulten $b$.'
  - 'Paso 3: Descomponer el término lineal $bx$ en $mx + nx$ y agrupar de a dos términos.'
  - 'Paso 4: Factorizar el factor común binomial $(px + q)(rx + s) = 0$ e igualar a cero cada paréntesis.'
errores_correccion: |
  - **Error común:** Buscar dos números que multiplicados den solo $c$ (en vez de $a \cdot c$) cuando el coeficiente $a \neq 1$.
  - **Cómo corregirlo:** Si $a \neq 1$, **SIEMPRE MULTIPLICA $a \cdot c$** para hallar los números que descomponen el término lineal.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Trinomio no mónico positivo.
    alternativas:
      - '$S = \{-2, -1/3\}$'
      - '$S = \{2, 1/3\}$'
      - '$S = \{-1, -2/3\}$'
    respuesta: '$S = \{-2, -1/3\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Trinomio con signos mixtos.
    alternativas:
      - '$S = \{3, -1/2\}$'
      - '$S = \{-3, 1/2\}$'
      - '$S = \{0, 3\}$'
    respuesta: '$S = \{3, -1/2\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Para factorizar el trinomio no mónico $2x^2 + 7x + 3 = 0$, basta con buscar dos números que multiplicados den $3$ y sumados den $7$.'
  - 'El método de agrupación $a \cdot c$ no es aplicable cuando el término independiente $c$ es un número negativo.'
  - 'En la ecuación $(2x + 3)(x - 4) = 0$, la solución correspondiente al primer paréntesis es el número $x = 3$.'
  - 'Dividir el coeficiente cuadrático $a$ por 2 es un requisito indispensable antes de iniciar la técnica del aspa simple.'
  - 'Toda ecuación cuadrática no mónica de coeficientes enteros admite raíces enteras o fraccionarias racionales.'
afirmaciones_verdaderas:
  - 'El método $a \cdot c$ para trinomios no mónicos $ax^2 + bx + c = 0$ encuentra dos números cuyo producto sea $a \cdot c$ y cuya suma sea $b$ para descomponer $bx$ por agrupación.'
  - 'Al igualar a cero el factor binomial $(px + q) = 0$, la solución correspondiente es la fracción $x = -\frac{q}{p}$.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones cuadráticas no mónicas $ax^2 + bx + c = 0$ mediante el método de agrupación $a \cdot c$ o aspa simple.
  CÓMO: Calcular $a \cdot c$, descomponer $bx = mx + nx$, agrupar términos, extraer binomio común e igualar factores a cero.
