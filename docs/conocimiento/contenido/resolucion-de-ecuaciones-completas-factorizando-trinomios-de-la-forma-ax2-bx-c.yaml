semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.TRINOMIO_GENERAL
resumen_inicial: 'Resolución de ecuaciones completas factorizando trinomios de la
  forma ax² + bx + c: concepto, discriminante, soluciones y modelamiento en Resolución
  por factorización.'
explicacion_simple: 'Cuando el coeficiente cuadrático no es 1, factorizar exige un
  paso adicional: descomponer el término lineal en dos partes que permitan agrupar
  la expresión.'
explicacion_formal: '### Definición formal


  Dada $ax^2+bx+c=0$ con $a\neq1$, se buscan $m,n$ tales que $m+n=b$ y $m \cdot n=a
  \cdot c$. Reescribiendo $bx=mx+nx$, el trinomio $ax^2+mx+nx+c$ se factoriza agrupando
  en dos pares de términos, obteniendo un factor común binomio.


  ### Desarrollo didáctico


  Este método, conocido como factorización por agrupación, transforma un trinomio
  de cuatro términos en un producto de dos binomios, cada uno con su propio factor
  común.


  Para $2x^2+7x+3=0$: $a \cdot c=6$; se buscan $m,n$ con $m+n=7$ y $m \cdot n=6$:
  son $1$ y $6$. Reescribiendo: $2x^2+x+6x+3=x(2x+1)+3(2x+1)=(2x+1)(x+3)=0$, dando
  $x=-1/2$ o $x=-3$.'
definiciones_clave: '- **Resolución de ecuaciones completas factorizando trinomios
  de la forma ax² + bx + c**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones completas factorizando trinomios de la forma ax² + bx + c.'
