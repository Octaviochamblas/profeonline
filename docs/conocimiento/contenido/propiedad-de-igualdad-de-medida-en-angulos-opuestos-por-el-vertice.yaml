procedimiento:
- 'Paso 1: Identificar los dos ángulos opuestos por el vértice en el cruce de rectas.'
- 'Paso 2: Plantear la ecuación de igualdad $\alpha = \beta$.'
- 'Paso 3: Despejar la incógnita y verificar calculando el valor numérico.'
errores_correccion: No confundas ángulos opuestos (que son iguales) con ángulos adyacentes
  (que suman 180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos opuestos por el vértice miden $4x$ y $80^\circ$, ¿cuánto
    vale $x$?
  alternativas:
  - $20^\circ$
  - $40^\circ$
  - $25^\circ$
  respuesta: $20^\circ$
  solucion_pasos:
  - $4x = 80^\circ \implies x = \frac{80^\circ}{4} = 20^\circ$.
- titulo: Ejemplo 2
  enunciado: Si un ángulo mide $50^\circ$, ¿cuánto miden los otros tres ángulos formados
    en el cruce de las dos rectas?
  alternativas:
  - $50^\circ$, $130^\circ$, $130^\circ$
  - $50^\circ$, $50^\circ$, $50^\circ$
  - $130^\circ$, $130^\circ$, $130^\circ$
  respuesta: $50^\circ$, $130^\circ$, $130^\circ$
  solucion_pasos:
  - El opuesto mide $50^\circ$ y los dos adyacentes suplementarios miden $180^\circ
    - 50^\circ = 130^\circ$.
- titulo: ¿Los ángulos opuestos por el vértice son congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, por teorema euclidiano siempre tienen igual medida.
- titulo: ¿Dos ángulos opuestos por el vértice siempre suman 180°?
  respuesta: 'No'
  solucion_pasos:
  - No, solo suman 180° si ambos son rectos de 90°. En general son iguales, no necesariamente
    suplementarios.
errores_frecuentes:
- Sumar los ángulos opuestos e igualar a $180^\circ$ en vez de igualarlos entre sí.
- Igualar ángulos contiguos que en realidad son suplementarios.
- Despejar mal al resolver ecuaciones con incógnitas en ambos lados.
- Pensar que la igualdad solo se cumple si las rectas son perpendiculares.
- Olvidar que la suma total de los cuatro ángulos es $360^\circ$.
afirmaciones_verdaderas:
- Los ángulos opuestos por el vértice son congruentes (tienen igual medida).
- Dos rectas secantes forman dos pares de ángulos congruentes.
al_terminar_debes_poder: '**QUÉ:** Aplicar el teorema de igualdad de ángulos opuestos
  por el vértice para resolver incógnitas geométricas.


  **CÓMO:** Igualando las medidas algebraicas $\alpha = \beta$ y calculando ángulos
  suplementarios contiguos.


