semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.OPUESTOS_VERTICE_IGUALDAD
resumen_inicial: Cuando dos rectas se intersectan, los ángulos opuestos por el vértice
  resultan idénticos en medida, facilitando la deducción inmediata de ángulos desconocidos.
explicacion_simple: Abre una tijera y mira la forma de 'X' que forman sus hojas y
  sus mangos. La abertura entre las dos hojas arriba mide exactamente lo mismo que
  la abertura entre los dos mangos abajo.
explicacion_formal: Cuando dos rectas se intersectan en un punto $O$, forman dos pares
  de **ángulos opuestos por el vértice**. El Teorema de los Ángulos Opuestos por el
  Vértice demuestra que ambos ángulos son estrictamente congruentes ($\alpha = \beta$).
definiciones_clave: '- **Propiedad de igualdad de medida en ángulos opuestos por el
  vértice**: Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en propiedad de igualdad de medida en ángulos opuestos por el vértice se mantiene
  invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Dos tijeras de podar se cruzan en un remache central formando ángulos
    opuestos que miden $3x - 15^\circ$ y $x + 45^\circ$. Calcula el valor de $x$ y
    la apertura de las hojas.
  pasos:
  - 'Paso 1: Igualar ambas expresiones por congruencia: $3x - 15 = x + 45$.'
  - 'Paso 2: Transponer términos: $2x = 60 \implies x = 30^\circ$.'
  - 'Paso 3: Sustituir $x = 30^\circ$: la apertura de las hojas es $3(30) - 15 = 75^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de propiedad de igualdad de medida
    en ángulos opuestos por el vértice?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $3x - 15^\circ = x + 45^\circ$, ¿cuál es el valor de x?
  choices:
  - text: 30°
    is_correct: true
  - text: 15°
    is_correct: false
  - text: 60°
    is_correct: false
  - text: 75°
    is_correct: false
  explanation: La alternativa correcta es '30°', ya que $2x = 60 \implies x = 30^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en propiedad de igualdad de medida en ángulos
  opuestos por el vértice.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en propiedad de igualdad
  de medida en ángulos opuestos por el vértice sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 58^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 122°
  - 58°
  - 90°
  respuesta: 122°
  solucion_pasos:
  - Despejando $x = 180 - 58 = 122^\circ$.
- titulo: Ejemplo 2
  enunciado: En propiedad de igualdad de medida en ángulos opuestos por el vértice,
    si dos ángulos son suplementarios y uno mide 58°, ¿cuánto mide el otro?
  alternativas:
  - 122°
  - 32°
  - 360°
  respuesta: 122°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 58 = 122^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en propiedad de
    igualdad de medida en ángulos opuestos por el vértice?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en propiedad de igualdad de medida
    en ángulos opuestos por el vértice es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de propiedad de igualdad de medida en ángulos
  opuestos por el vértice.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
