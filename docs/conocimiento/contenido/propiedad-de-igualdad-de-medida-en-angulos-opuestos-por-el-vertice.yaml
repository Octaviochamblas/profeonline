semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.OPUESTOS_VERTICE_IGUALDAD
resumen_inicial: Los ángulos opuestos por el vértice tienen exactamente la misma medida
  angular (son congruentes entre sí).
explicacion_simple: '![Igualdad de Opuestos por el Vértice](/static/img/nodos/propiedad-de-igualdad-de-medida-en-angulos-opuestos-por-el-vertice-intro.svg)


  Si dos rectas se cruzan como una tijera, cuando abres un lado, el lado opuesto se
  abre exactamente en la misma cantidad. Por eso, los dos ángulos enfrentados siempre
  miden lo mismo: si uno mide 60°, el que está justo frente a él también medirá 60°.'
explicacion_formal: '### Teorema formal

  En el plano euclidiano, dos ángulos opuestos por el vértice son estrictamente **congruentes**
  (tienen exactamente la misma medida angular):


  $$\angle AOB \text{ y } \angle COD \text{ opuestos por el vértice} \implies \mu(\angle
  AOB) = \mu(\angle COD)$$


  $$\alpha = \gamma \quad \land \quad \beta = \delta$$


  ### Desglose simbólico y geométrico

  - $\alpha + \beta = 180^\circ$ (par lineal sobre la primera recta).

  - $\gamma + \beta = 180^\circ$ (par lineal sobre la segunda recta).

  - Igualando ecuaciones: $\alpha + \beta = \gamma + \beta \implies \alpha = \gamma$.


  ### Síntesis didáctica

  El teorema de los ángulos opuestos por el vértice es un principio fundamental que
  garantiza la conservación de la medida angular a través de un cruce recto de líneas.'
definiciones_clave: '- **Congruencia angular**: Propiedad de tener la misma medida
  angular ($\alpha = \beta$).

  - **Demostración por suplemento común**: Método formal que demuestra la igualdad
  mediante el suplemento compartido $\gamma$. '
propiedades_relaciones: '- **Igualdad recíproca**: Ambos pares de ángulos opuestos
  satisfacen $\alpha_1 = \alpha_2$ y $\beta_1 = \beta_2$.

  - **Suma completa**: $2\alpha + 2\beta = 360^\circ \implies \alpha + \beta = 180^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Igualdad de Opuestos](/static/img/nodos/propiedad-de-igualdad-de-medida-en-angulos-opuestos-por-el-vertice-ejemplos.svg)


    Dos ángulos opuestos por el vértice están expresados algebraicamente como $\alpha
    = 3x - 10^\circ$ y $\beta = x + 50^\circ$. Determina el valor de $x$ y la medida
    de cada ángulo.'
  pasos:
  - 'Paso 1: Por ser opuestos por el vértice, igualar ambas expresiones: $3x - 10^\circ
    = x + 50^\circ$.'
  - 'Paso 2: Agrupar términos con $x$: $3x - x = 50^\circ + 10^\circ$.'
  - 'Paso 3: Resolver: $2x = 60^\circ \implies x = 30^\circ$.'
  - 'Paso 4: Calcular la medida del ángulo: $3(30^\circ) - 10^\circ = 90^\circ - 10^\circ
    = 80^\circ$.'
  - 'Paso 5: Verificar en el otro ángulo: $30^\circ + 50^\circ = 80^\circ$. Ambos
    miden $80^\circ$.'
