semantic_id: MAT.ALG.EC_CUADR_BASE.NORMALIZACION
resumen_inicial: 'Transformación de una ecuación cuadrática a la forma general: concepto,
  discriminante, soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: Muchas ecuaciones cuadráticas no llegan ya ordenadas en su forma
  estándar; antes de resolverlas o identificar sus coeficientes, hay que "limpiarlas"
  primero.
explicacion_formal: '### Definición formal


  Normalizar una ecuación de segundo grado significa aplicar operaciones algebraicas
  equivalentes (distribución, reducción de términos semejantes, traslado de términos)
  hasta expresarla en la forma general $ax^2+bx+c=0$, sin alterar su conjunto solución.


  ### Desarrollo didáctico


  El proceso típico consiste en desarrollar cualquier producto o paréntesis presente,
  agrupar los términos según su exponente y trasladar todo a un solo lado de la igualdad,
  dejando cero del otro lado.


  Para normalizar $x(x+3)=10$: se desarrolla el paréntesis, obteniendo $x^2+3x=10$,
  y luego se traslada el $10$, quedando $x^2+3x-10=0$, ya en forma general.'
definiciones_clave: '- **Transformación de una ecuación cuadrática a la forma general**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en transformación
  de una ecuación cuadrática a la forma general.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando transformación de
    una ecuación cuadrática a la forma general.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a transformación de una
    ecuación cuadrática a la forma general.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
checkpoints:
