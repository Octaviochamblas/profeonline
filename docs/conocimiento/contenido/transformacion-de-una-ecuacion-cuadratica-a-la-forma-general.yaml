semantic_id: MAT.ALG.EC_CUADR_BASE.NORMALIZACION
resumen_inicial: Transformar una ecuación a la forma general implica aplicar propiedades
  algebraicas para reducirla al formato $a x^2 + b x + c = 0$.
explicacion_simple: 'Muchas ecuaciones de segundo grado no vienen ordenadas de fábrica.

  - Para **normalizarlas a la forma general**:

  1. Elimina denominadores o paréntesis efectuando las operaciones algebraicas.

  2. Mueve todos los términos a un solo lado del signo igual ($=$).

  3. Junta y reduce los términos semejantes ($x^2$ con $x^2$, $x$ con $x$, constantes
  con constantes).

  4. Ordena los términos de mayor a menor exponente igualando a cero.'
explicacion_formal: 'Dada una igualdad de expresiones algebraicas $L(x) = R(x)$, el
  proceso de **normalización canónica** es el algoritmo de reducción:


  $$L(x) - R(x) = 0 \implies a x^2 + b x + c = 0$$


  **Desglose de la fórmula:**

  - Aplicación sucesiva de axiomas de cuerpo (distributividad, equivalencia aditiva
  y multiplicativa) para obtener un polinomio canónico de grado 2.'
definiciones_clave: '- **Normalización de ecuaciones**: Procedimiento de simplificación
  y reordenamiento de una ecuación hacia su forma estándar canónica.'
propiedades_relaciones: '- **Ecuaciones equivalentes**: Las soluciones de la ecuación
  original son idénticas a las soluciones de su forma general normalizada.'
ejemplo_guiado:
  enunciado: Transforma la ecuación $x(x - 4) = 5 - 2x$ a la forma general $a x^2
    + b x + c = 0$.
  pasos:
  - 'Paso 1: Aplicar la propiedad distributiva en el miembro izquierdo: $x^2 - 4x
    = 5 - 2x$.Paso 2: Trasponer todos los términos del lado derecho hacia el lado
    izquierdo: $x^2 - 4x - 5 + 2x = 0$.Paso 3: Reducir términos semejantes con $x$:
    $-4x + 2x = -2x$.Paso 4: Ordenar la expresión final: $x^2 - 2x - 5 = 0$.Paso 5:
    Identificar coeficientes: $a = 1$, $b = -2$, $c = -5$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reducir la ecuación $x(x - 4) = 5 - 2x$ a la forma general, ¿cuál es
    la ecuación cuadrática obtenida?
  choices:
  - text: $x^2 - 2x - 5 = 0$
    is_correct: true
  - text: $x^2 - 6x - 5 = 0$
    is_correct: false
  - text: $x^2 - 2x + 5 = 0$
    is_correct: false
  - text: $x^2 - 4x - 3 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$x^2 - 2x - 5 = 0$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el primer paso algebraico recomendado para normalizar la ecuación
    $\frac{x^2}{2} + x = 3$?
  choices:
  - text: Multiplicar toda la ecuación por 2 para eliminar la fracción.
    is_correct: true
  - text: Dividir todo entre x.
    is_correct: false
  - text: Elevar al cuadrado ambos miembros.
    is_correct: false
  - text: Restar x al lado derecho.
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicar toda la ecuación por 2 para
    eliminar la fracción.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver paréntesis y expandir productos notables.'
- 'Paso 2: Eliminar fracciones multiplicando la ecuación por el mínimo común múltiplo
  (mcm) de los denominadores.'
- 'Paso 3: Trasponer todos los términos al miembro izquierdo igualando a cero.'
- 'Paso 4: Reducir términos semejantes y ordenar en potencias decrecientes de $x$.'
errores_correccion: '- **Error común:** Cambiar mal los signos al trasponer términos
  de un miembro al otro del signo igual.

  - **Cómo corregirlo:** Recuerda que al trasponer un término que está sumando pasa
  restando, y el que está restando pasa sumando.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
