semantic_id: MAT.ALG.EC_CUADR_BASE.NORMALIZACION
resumen_inicial: La transformación a la forma general aplica operaciones algebraicas válidas para llevar cualquier ecuación cuadrática al formato $ax^2 + bx + c = 0$.
explicacion_simple: |
  Muchas ecuaciones cuadráticas no vienen listas en la forma $ax^2 + bx + c = 0$, sino desordenadas o con paréntesis:

  - **Ejemplo**: $2x(x - 3) = 5 - x$.
  - **Paso 1 (Eliminar paréntesis)**: Multiplicas $2x \cdot x - 2x \cdot 3 \implies 2x^2 - 6x = 5 - x$.
  - **Paso 2 (Transponer términos)**: Pasas todo a la izquierda cambiando signos $\implies 2x^2 - 6x + x - 5 = 0$.
  - **Paso 3 (Reducir semejantes)**: Sumas o restas los términos iguales $\implies 2x^2 - 5x - 5 = 0$.
explicacion_formal: |
  Sea una igualdad condicional cuadrática de la forma $f(x) = g(x)$ donde $f$ y $g$ son polinomios de grado a lo sumo 2. La **transformación a la forma general canónica** consiste en la aplicación sucesiva de axiomas de cuerpo (distributividad, asociatividad) y propiedades de la igualdad:

  $$f(x) - g(x) = 0 \iff ax^2 + bx + c = 0 \quad \text{con } a \neq 0$$

  **Criterio de normalización:**
  Se recomienda simplificar coeficientes fraccionarios multiplicando por el mínimo común múltiplo ($\text{m.c.m.}$) de los denominadores para trabajar con coeficientes enteros.
definiciones_clave: |
  - **Transformación o normalización de una ecuación**: Proceso algebraico mediante el cual una expresión equivalente es conducida al formato canónico $ax^2 + bx + c = 0$.
propiedades_relaciones: |
  - **Invariancia del conjunto solución**: Toda transformación equivalente realizada mediante adición de inversos aditivos o multiplicación por constantes no nulas preserva 100% las raíces de la ecuación original.
ejemplo_guiado:
  enunciado: 'Transforma la ecuación $\frac{x^2}{2} + 1 = \frac{x}{3}$ a la forma general con coeficientes enteros.'
  pasos:
    - 'Paso 1: Determinar el $\text{m.c.m.}$ de los denominadores $2$ y $3$, que es $6$.'
    - 'Paso 2: Multiplicar toda la ecuación por $6$: $6 \cdot \left(\frac{x^2}{2}\right) + 6 \cdot 1 = 6 \cdot \left(\frac{x}{3}\right) \implies 3x^2 + 6 = 2x$.'
    - 'Paso 3: Transponer el término $2x$ restando a ambos lados: $3x^2 - 2x + 6 = 0$.'
    - 'Paso 4: Verificar la forma general $ax^2 + bx + c = 0$ con $a = 3$, $b = -2$, $c = 6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué método es recomendable aplicar para eliminar denominadores fraccionarios en una ecuación cuadrática?'
    choices:
      - {text: 'Multiplicar toda la ecuación por el mínimo común múltiplo ($\text{m.c.m.}$) de los denominadores.', is_correct: true}
      - {text: 'Sumar 1 a ambos lados de la igualdad.', is_correct: false}
      - {text: 'Elevar al cuadrado ambos miembros de la ecuación.', is_correct: false}
      - {text: 'Igualar todos los numeradores a cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar toda la ecuación por el mínimo común múltiplo ($\text{m.c.m.}$) de los denominadores.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma general reducida de la ecuación $(x + 2)^2 = 9$?'
    choices:
      - {text: '$x^2 + 4x - 5 = 0$', is_correct: true}
      - {text: '$x^2 + 4 = 9$', is_correct: false}
      - {text: '$x^2 + 4x + 13 = 0$', is_correct: false}
      - {text: '$x^2 - 5 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 + 4x - 5 = 0$''. Al desarrollar $(x+2)^2 = x^2 + 4x + 4$, restando 9 queda $x^2 + 4x - 5 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Desarrollar productos notables, paréntesis y potencias presentes en ambos miembros.'
  - 'Paso 2: Eliminar fracciones multiplicando toda la igualdad por el mínimo común múltiplo de los denominadores.'
  - 'Paso 3: Transponer todos los términos al miembro izquierdo mediante sumas o restas de inversos aditivos.'
  - 'Paso 4: Reducir términos semejantes y ordenar en la secuencia descendente $ax^2 + bx + c = 0$.'
errores_correccion: |
  - **Error común:** Olvidar cambiar los signos de los términos al transponerlos de un lado a otro del igual.
  - **Cómo corregirlo:** Recuerda que transponer un término equivale a **SUMAR O RESTAR SU INVERSO ADITIVO** en ambos lados de la ecuación.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Desarrollo de binomio al cuadrado.
    alternativas:
      - '$x^2 - 6x + 5 = 0$'
      - '$x^2 + 9 = 4$'
      - '$x^2 - 6x - 13 = 0$'
    respuesta: '$x^2 - 6x + 5 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Eliminación de denominadores.
    alternativas:
      - '$x^2 - 6x + 8 = 0$'
      - '$x^2 - 3x + 4 = 0$'
      - '$2x^2 - 3x + 8 = 0$'
    respuesta: '$x^2 - 6x + 8 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Al transponer el término $+3x$ del lado derecho al lado izquierdo de una ecuación, su signo se mantiene positivo.'
  - 'Desarrollar el binomio al cuadrado $(x + 3)^2$ produce simplemente el resultado $x^2 + 9$ omitiendo el término doble $6x$.'
  - 'La ponderación por un número negativo altera y destruye el conjunto de soluciones reales de una ecuación.'
  - 'Al eliminar fracciones en una ecuación, solo es necesario multiplicar los términos que poseen denominador.'
  - 'La ecuación $(x - 1)(x + 2) = 0$ ya se encuentra escrita en su forma general canónica $ax^2 + bx + c = 0$.'
afirmaciones_verdaderas:
  - 'La transformación a la forma general requiere resolver paréntesis, eliminar fracciones e igualar a cero mediante operaciones algebraicas equivalentes.'
  - 'Desarrollar correctamente los productos notables y transponer los términos invirtiendo sus signos es indispensable para reducir una ecuación a $ax^2 + bx + c = 0$.'
al_terminar_debes_poder: |
  QUÉ: Normalizar y transformar cualquier ecuación cuadrática desordenada a la forma canónica $ax^2 + bx + c = 0$.
  CÓMO: Desarrollar productos, multiplicar por el $\text{m.c.m.}$, transponer términos cambiando signos y reducir términos semejantes.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
