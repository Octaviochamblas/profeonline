    is_correct: false
  explanation: 'La alternativa correcta es: Identificar correctamente los coeficientes
    a, b, c con sus respectivos signos en conceptos y formas de la ecuación cuadrática.
    Permite una sustitución precisa en transformación de una ecuación cuadrática a
    la forma general.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determina el número de soluciones reales al trabajar con transformación
    de una ecuación cuadrática a la forma general?
  choices:
  - text: Analizar el signo del discriminante b^2 - 4ac para determinar la cantidad
      de soluciones reales
    is_correct: true
  - text: Sumando las constantes b y c
    is_correct: false
  - text: Dividiendo c entre a directamente
    is_correct: false
  - text: Ignorando el término independiente c
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar el signo del discriminante b^2
    - 4ac para determinar la cantidad de soluciones reales. El discriminante indica
    si hay 2, 1 o 0 soluciones reales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desarrolla cualquier producto o paréntesis presente en la ecuación.'
- 'Paso 2: Reduce los términos semejantes en cada lado de la igualdad.'
- 'Paso 3: Traslada todos los términos a un mismo lado, dejando cero del otro lado.'
- 'Paso 4: Ordena los términos de mayor a menor exponente.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en transformación de una ecuación cuadrática a la forma general.
ejemplos:
- titulo: Normalización con paréntesis
  enunciado: Escribe en forma general la ecuación $2x(x-4)=6$.
  solucion_pasos:
  - Desarrollando el paréntesis, $2x^2-8x=6$.
  - Trasladando el $6$, se obtiene $2x^2-8x-6=0$.
- titulo: Normalización con términos en ambos lados
  enunciado: Escribe en forma general la ecuación $5x^2+2=3x^2-x+9$.
  solucion_pasos:
  - Trasladando todos los términos al lado izquierdo, $5x^2-3x^2+x+2-9=0$.
  - Reduciendo términos semejantes, $2x^2+x-7=0$.
- titulo: ¿Normalizar una ecuación cambia su conjunto solución?
  enunciado: ¿Normalizar una ecuación cambia su conjunto solución?
  respuesta: 'No'
  solucion_pasos:
  - Las operaciones usadas para normalizar (distribuir, reducir, trasladar) son equivalencias
    algebraicas que preservan las soluciones.
- titulo: ¿Es obligatorio desarrollar los paréntesis antes de identificar los coeficientes?
  enunciado: ¿Es obligatorio desarrollar los paréntesis antes de identificar los coeficientes?
  respuesta: Sí
  solucion_pasos:
  - Los coeficientes $a$, $b$ y $c$ solo se identifican correctamente una vez que
    la ecuación está en su forma general desarrollada.
errores_frecuentes:
- Olvidar distribuir correctamente un signo negativo al trasladar términos de un lado
  a otro.
- No desarrollar completamente un paréntesis antes de identificar los coeficientes.
- Reducir incorrectamente términos que no son semejantes (por ejemplo, sumar un término
  en $x^2$ con uno en $x$).
- Dejar la ecuación normalizada pero sin ordenar de mayor a menor exponente.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando transformación
  de una ecuación cuadrática a la forma general.
