semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.DISTRIBUTIVA_UNION_SOBRE_INTERSECCION
resumen_inicial: 'Demostración lógica, propiedades y aplicación de la propiedad distributiva de la unión sobre la intersección: $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$.'
explicacion_simple: 'La **propiedad distributiva de la unión sobre la intersección** funciona de manera similar a cómo se distribuye la multiplicación sobre la suma en álgebra: el conjunto $A$ "se reparte" con la unión $\cup$ hacia $B$ y hacia $C$:

  $$A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$$

  Esto significa que unir $A$ con la parte común de $B$ y $C$ es exactamente lo mismo que unir $A$ con $B$, unir $A$ con $C$, y luego buscar la parte común entre ambas uniones. Es una herramienta poderosa para simplificar expresiones complejas con conjuntos.


  ![propiedad-distributiva-de-la-union-sobre-la-interseccion](/static/img/nodos/propiedad-distributiva-de-la-union-sobre-la-interseccion-intro.svg)'
explicacion_formal: '### Definición formal

  En la teoría de conjuntos y el retículo distributivo booleano $(\mathcal{P}(\mathcal{U}), \cup, \cap)$, la unión distribuye sobre la intersección:

  $$\forall A, B, C \subseteq \mathcal{U}, \quad A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$$

  Demostración formal basada en la distributividad lógica de la disyunción sobre la conjunción ($\lor$ sobre $\land$):

  $$x \in (A \cup (B \cap C)) \iff x \in A \lor (x \in B \land x \in C) \iff (x \in A \lor x \in B) \land (x \in A \lor x \in C) \iff x \in ((A \cup B) \cap (A \cup C))$$

  Por el axioma de extensionalidad, se concluye la identidad de ambos conjuntos.


  ### Desglose simbólico

  - Ley lógica subyacente: $P \lor (Q \land R) \equiv (P \lor Q) \land (P \lor R)$.

  - Dualidad reticular: A diferencia del álgebra elemental de números reales (donde la suma no distribuye sobre el producto), en el álgebra de conjuntos **ambas operaciones distribuyen mutuamente**.

  - Generalización: $A \cup \left(\bigcap_{i \in I} B_i\right) = \bigcap_{i \in I} (A \cup B_i)$.


  ### Síntesis didáctica

  La distributividad permite factorizar o expandir expresiones conjuntistas mixtas para optimizar su cómputo o demostración.

  '
definiciones_clave: '- **Distributividad de la unión sobre la intersección**: Regla que expande $A \cup (B \cap C)$ en $(A \cup B) \cap (A \cup C)$.

  - **Retículo distributivo**: Estructura algebraica donde las dos operaciones binarias distribuyen mutuamente una sobre la otra.

  - **Dualidad de operadores**: Simetría estructural entre $\cup$ y $\cap$.

  '
propiedades_relaciones: '- **Factorización conjuntista**: $(A \cup B) \cap (A \cup C) = A \cup (B \cap C)$ (extraer $A \cup$ como factor común).

  - **Simplificación con subconjuntos**: Si $B \cap C = \emptyset$, entonces $(A \cup B) \cap (A \cup C) = A \cup \emptyset = A$.

  '
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{1, 2\}$, $B = \{2, 3\}$ y $C = \{2, 4\}$, verifica la propiedad distributiva calculando ambos lados de $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$.


    ![Ejemplo propiedad-distributiva-de-la-union-sobre-la-interseccion](/static/img/nodos/propiedad-distributiva-de-la-union-sobre-la-interseccion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Resolver el lado izquierdo $A \cup (B \cap C)$: - Calcular la intersección: $B \cap C = \{2, 3\} \cap \{2, 4\} = \{2\}$. - Unir con $A$: $A \cup (B \cap C) = \{1, 2\} \cup \{2\} = \{1, 2\}$.'
  - 'Paso 2: Resolver el lado derecho $(A \cup B) \cap (A \cup C)$: - Primera unión: $A \cup B = \{1, 2\} \cup \{2, 3\} = \{1, 2, 3\}$. - Segunda unión: $A \cup C = \{1, 2\} \cup \{2, 4\} = \{1, 2, 4\}$. - Intersectar ambas uniones: $\{1, 2, 3\} \cap \{1, 2, 4\} = \{1, 2\}$.'
  - 'Paso 3: Comparar ambos lados: $\{1, 2\} = \{1, 2\}$.'
  - 'Paso 4: Concluir formalmente que $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué expresión es equivalente $(A \cup B) \cap (A \cup C)$ al aplicar factorización conjuntista?
  choices:
  - text: $A \cup (B \cap C)$
    is_correct: true
  - text: $A \cap (B \cup C)$
    is_correct: false
  - text: $(A \cap B) \cup C$
    is_correct: false
  - text: $A \cup B \cup C$
    is_correct: false
  explanation: La alternativa correcta es '$A \cup (B \cap C)$'. Es la forma compacta factorizada de la propiedad distributiva.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $B$ y $C$ son conjuntos disjuntos ($B \cap C = \emptyset$), ¿a qué simplifica la expresión $(A \cup B) \cap (A \cup C)$?
  choices:
  - text: $A$
    is_correct: true
  - text: $\emptyset$
    is_correct: false
  - text: $B \cup C$
    is_correct: false
  - text: $\mathcal{U}$
    is_correct: false
  explanation: 'La alternativa correcta es ''$A$''. Al sustituir: $A \cup (B \cap C) = A \cup \emptyset = A$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto exterior $A$ y la operación de unión que afecta al paréntesis $(B \cap C)$.'
- 'Paso 2: Distribuir la unión con $A$ a cada miembro del paréntesis: $(A \cup B)$ y $(A \cup C)$.'
- 'Paso 3: Conectar ambos paréntesis mediante el operador de intersección central $\cap$.'
- 'Paso 4: Para el proceso inverso (factorización), extraer el término repetido $A \cup$ hacia afuera.'
errores_correccion: '- **Error 1:** Mantener el mismo operador dentro y fuera de los paréntesis al expandir. **Cómo corregirlo:** La distributividad alterna los operadores: la unión exterior entra a los paréntesis y la intersección interior se convierte en el operador principal intermedio.

  - **Error 2:** Creer que la unión no puede distribuirse sobre la intersección porque en álgebra real la suma no distribuye sobre el producto. **Cómo corregirlo:** El álgebra booleana de conjuntos es totalmente simétrica; la unión sí distribuye sobre la intersección.

  '
ejemplos:
- titulo: Distribución con conjuntos de letras
  enunciado: Si $A = \{x\}$, $B = \{y\}$, $C = \{z\}$, ¿cuál es $(A \cup B) \cap (A \cup C)$ sabiendo que $B \cap C = \emptyset$?
  alternativas:
  - $\{x\}$
  - $\{y, z\}$
  - $\emptyset$
  respuesta: $\{x\}$
  solucion_pasos:
  - 1. $(A \cup B) \cap (A \cup C) = A \cup (B \cap C) = \{x\} \cup \emptyset = \{x\}$.
- titulo: Simplificación de expresión
  enunciado: Simplifica $(M \cup N) \cap (M \cup N^c)$.
  respuesta: $M$
  solucion_pasos:
  - $M \cup (N \cap N^c) = M \cup \emptyset = M$.
  alternativas:
  - texto: $M$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Distribución con el universo
  enunciado: ¿$(A \cup \mathcal{U}) \cap (A \cup B)$ a qué equivale?
  respuesta: $A \cup B$
  solucion_pasos:
  - $\mathcal{U} \cap (A \cup B) = A \cup B$.
  alternativas:
  - texto: $A \cup B$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Factor común en conjuntos
  enunciado: ¿Cuál es la forma factorizada de $(P \cup Q) \cap (P \cup R)$?
  respuesta: $P \cup (Q \cap R)$
  solucion_pasos:
  - Se extrae el factor común $P \cup$.
  alternativas:
  - texto: $P \cup (Q \cap R)$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
