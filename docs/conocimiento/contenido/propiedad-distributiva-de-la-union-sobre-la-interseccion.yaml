errores_frecuentes:
- La afirmación de que la unión no distribuye sobre la intersección en la teoría de conjuntos.
- La afirmación de que $A \cup (B \cap C)$ es idéntico a $(A \cup B) \cup (A \cup C)$.
- La afirmación de que $(A \cup B) \cap (A \cup C)$ se reduce a la intersección $B \cap C$.
- La afirmación de que la propiedad distributiva de la unión solo es válida cuando los conjuntos son finitos.
- La afirmación de que distribuir la unión sobre la intersección altera la cardinalidad total del universo.
afirmaciones_verdaderas:
- La unión de conjuntos distribuye sobre la intersección según la ley $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$.
- La validez de esta propiedad se fundamenta en la tautología lógica $P \lor (Q \land R) \equiv (P \lor Q) \land (P \lor R)$.
al_terminar_debes_poder: 'QUÉ: Enunciar, demostrar y aplicar la propiedad distributiva de la unión sobre la intersección ($A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$).

  CÓMO: Expandir y factorizar expresiones booleanas conjuntistas y simplificar operaciones mediante la ley lógica $P \lor (Q \land R) \equiv (P \lor Q) \land (P \lor R)$.


