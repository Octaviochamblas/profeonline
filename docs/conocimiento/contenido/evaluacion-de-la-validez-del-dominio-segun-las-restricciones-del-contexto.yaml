semantic_id: MAT.ALG.FUNC_CUADR_MODELO.VALIDEZ_DOMINIO_CONTEXTO
resumen_inicial: La evaluación de la validez del dominio según las restricciones del contexto restringe el dominio algebraico $\mathbb{R}$ a un subconjunto $\mathcal{D}_{\text{contextual}} \subset \mathbb{R}$ donde las variables físicas, longitudes, tiempos y resultados mantienen estricto sentido real no degenerado.
explicacion_simple: "![La evaluación de la validez del dominio según las restricciones del contexto restringe el dominio algebraico $\\mathbb{R}$ a un subconjunto $\\mathcal{D}_{\\text{contextual}} \\subset \\mathbb{R}$ donde las variables físicas, longitudes, tiempos y resultados mantienen estricto sentido real no degenerado](/static/img/nodos/evaluacion-de-la-validez-del-dominio-segun-las-restricciones-del-contexto-intro.svg)\n\n\nEn matemáticas puras, en una parábola puedes poner cualquier número real de $-\\infty$ a $+\\infty$. Pero en la **vida real hay reglas que no se pueden romper**:\n\n- **1. El tiempo nunca es negativo:** $t \\ge 0$.\n- **2. Las longitudes deben ser positivas:** Si un lado mide $x$ y el otro mide $30 - x$, entonces $x > 0$ y además $30 - x > 0 \\implies x < 30$.\n  - El dominio real es solo el intervalo **$]0, 30[$ metros**.\n- **3. La altura no puede ser bajo el suelo:** $h(t) \\ge 0$.\n- Por eso, **el dominio contextual casi siempre es un intervalo acotado $[a,\
  \ b]$**, y no todo $\\mathbb{R}$."
explicacion_formal: 'Sea un modelo matemático $f: \mathbb{R} \to \mathbb{R}$. El **dominio contextual admisible** $\mathcal{D}_{\text{adm}} \subset \mathbb{R}$ es la intersección conjuntista de todas las restricciones impuestas por las leyes físicas y geométricas del problema:


  $$\mathcal{D}_{\text{adm}} = \{x \in \mathbb{R} \mid g_i(x) \ge 0, \; \forall i = 1, \dots, m\}$$


  **Tipos de restricciones canónicas**:

  1. **No negatividad de la variable de control**: $x \ge 0$ (tiempo, masa, unidades producidas).

  2. **Positividad geométrica dimensional**: $\text{Largo}(x) > 0 \land \text{Ancho}(x) > 0$.

  3. **Cota de existencia de la respuesta**: $f(x) \ge 0$ (altura sobre el suelo, inventario no negativo).


  **Consecuencia topológica**: $\mathcal{D}_{\text{adm}}$ es típicamente un intervalo compacto cerrado $[x_{\text{mín}}, x_{\text{máx}}]$ o abierto $]x_{\text{mín}}, x_{\text{máx}}[$.'
definiciones_clave: '- **Dominio contextual**: Subconjunto de números reales para los cuales el modelo tiene sentido físico o empírico.

  - **Restricción de positividad**: Condición que impide dimensiones, tiempos o cantidades negativas.'
propiedades_relaciones: '- **Subconjunto propio**: $\mathcal{D}_{\text{contextual}} \subsetneq \text{Dom}_{\text{mat}}(f) = \mathbb{R}$.

  - **Extremos en la frontera**: Si el vértice $x_v \notin \mathcal{D}_{\text{adm}}$, el valor óptimo del modelo se alcanza obligatoriamente en los bordes de la frontera del dominio.'
ejemplo_guiado:
  enunciado: '![Ejemplo La evaluación de la validez del dominio según las restricciones del contexto restringe el dominio algebraico $\mathbb{R}$ a un subconjunto $\mathcal{D}_{\text{contextual}} \subset \mathbb{R}$ donde las variables físicas, longitudes, tiempos y resultados mantienen estricto sentido real no degenerado](/static/img/nodos/evaluacion-de-la-validez-del-dominio-segun-las-restricciones-del-contexto-ejemplos.svg)



    Un rectángulo tiene perímetro de 40 metros. Su área es $\mathcal{A}(x) = x(20 - x)$, donde $x$ es el ancho en metros. Determina el dominio contextual válido para la variable $x$.'
  pasos:
  - 'Paso 1: Plantear la restricción para el ancho $x$:

    Para que exista una figura geométrica real, el ancho debe ser estrictamente positivo: $x > 0$.'
  - 'Paso 2: Plantear la restricción para el largo $y = 20 - x$:

    El largo también debe ser estrictamente positivo: $20 - x > 0 \implies x < 20$.'
  - 'Paso 3: Intersectar ambas restricciones:

    $x > 0 \quad \land \quad x < 20 \Longleftrightarrow 0 < x < 20$.'
  - 'Paso 4: Conclusión: El dominio contextual válido es el intervalo abierto $\mathcal{D}_{\text{contextual}} = ]0, 20[\text{ metros}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un problema donde la altura de un objeto es $h(t) = 45 - 5t^2$, ¿cuál es el dominio contextual para el tiempo t?
  choices:
  - text: '[0, 3] segundos'
    is_correct: true
  - text: ']-∞, +∞['
    is_correct: false
  - text: '[-3, 3] segundos'
    is_correct: false
  - text: '[3, +∞[ segundos'
    is_correct: false
  explanation: La alternativa correcta es '[0, 3] segundos'. Debe cumplirse $t \ge 0$ y $h(t) \ge 0 \implies 45 - 5t^2 \ge 0 \implies t^2 \le 9 \implies t \le 3$. Por tanto, $\mathcal{D} = [0, 3]\text{ s}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el dominio contextual de una longitud x en un terreno suele escribirse con corchetes ABIERTOS $]0, L[$?
  choices:
  - text: Porque si x = 0 o x = L el terreno se colapsa a una línea de área cero
    is_correct: true
  - text: Por convención arbitraria
    is_correct: false
  - text: Porque las parábolas no tocan el cero
    is_correct: false
  - text: Porque el discriminante es negativo
    is_correct: false
  explanation: La alternativa correcta es 'Porque si x = 0 o x = L el terreno se colapsa a una línea de área cero'. Una longitud cero produce una figura degenerada sin área.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar todas las restricciones físicas del problema ($x \ge 0$, longitudes $> 0$, $f(x) \ge 0$).'
- 'Paso 2: Resolver las desigualdades correspondientes a cada restricción.'
- 'Paso 3: Intersectar los intervalos resultantes en la recta numérica.'
- 'Paso 4: Expresar el dominio contextual en notación de intervalos con sus unidades físicas.'
errores_correccion: '- **Error común:** Afirmar que el dominio es $\mathbb{R}$ (todos los reales) en un problema de física o geometría.

  - **Cómo corregirlo:** En problemas reales **el dominio siempre está limitado por las restricciones físicas del contexto** ($t \ge 0, x > 0$).'
ejemplos:
- titulo: 'Ejemplo 1: Dominio de tiempo de proyectil'
  enunciado: Si $h(t) = 30t - 5t^2 \ge 0$ con $t \ge 0$, ¿cuál es el dominio?
  alternativas:
  - '[0, 6] segundos'
  - ']-inf, 6] segundos'
  - '[0, +inf['
  - R
  respuesta: '[0, 6] segundos'
  solucion_pasos:
  - 'Paso 1: $t(30 - 5t) \ge 0 \implies 0 \le t \le 6\text{ segundos}$.'
- titulo: 'Ejemplo 2: Dominio de lado de caja'
  enunciado: Al cortar esquinas de lado $x$ en una hoja de $20 \times 30\text{ cm}$, ¿cuál es el dominio de $x$?
  alternativas:
  - ']0, 10[ cm'
  - ']0, 15[ cm'
  - ']0, 20[ cm'
  - '[0, 30] cm'
  respuesta: ']0, 10[ cm'
  solucion_pasos:
  - 'Paso 1: $2x < 20 \implies x < 10\text{ cm} \implies ]0, 10[\text{ cm}$.'
- titulo: 'Ejemplo 3: Restricción de producción'
  enunciado: Si una máquina produce máximo 500 piezas diarias y $G(x) \ge 0$ para $x \ge 40$, ¿cuál es el dominio?
  alternativas:
  - '[40, 500] piezas'
  - '[0, 500] piezas'
  - '[40, +inf['
  - '[0, 40] piezas'
  respuesta: '[40, 500] piezas'
  solucion_pasos:
  - 'Paso 1: Intersección: $x \ge 40 \land x \le 500 \implies [40, 500]$.'
- titulo: 'Ejemplo 4: Dominio de radio'
  enunciado: En un cilindro de volumen fijo donde el radio no puede superar los 5 m, ¿cuál es el dominio de $r$?
  alternativas:
  - ']0, 5] metros'
  - '[0, 5] metros'
  - '[-5, 5] metros'
  - ']0, +inf['
  respuesta: ']0, 5] metros'
  solucion_pasos:
  - 'Paso 1: Radio estrictamente positivo $r > 0$ y $r \le 5 \implies ]0, 5]\text{ m}$.'
errores_frecuentes:
- Asignar el dominio matemático R sin evaluar las condiciones reales.
- Olvidar restringir a valores positivos las variables de tiempo o longitud.
- No intersectar todas las restricciones simultáneamente.
afirmaciones_verdaderas:
- El dominio contextual es un subconjunto del dominio matemático restringido por las leyes del problema.
- En problemas de física el tiempo t está restringido a t ≥ 0 y h(t) ≥ 0.
al_terminar_debes_poder: '**QUÉ:** Evaluar y determinar la validez del dominio según las restricciones del contexto.


  **CÓMO:** Intersectando las restricciones físicas de no negatividad y existencia geométrica para formular el intervalo admisible.


