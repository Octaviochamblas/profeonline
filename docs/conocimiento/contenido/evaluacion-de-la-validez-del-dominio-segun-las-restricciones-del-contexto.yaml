semantic_id: MAT.ALG.FUNC_CUADR_MODELO.VALIDEZ_DOMINIO_CONTEXTO
resumen_inicial: La evaluación del dominio contextual restringe los valores de $x$ a aquellos físicamente posibles ($x > 0$, $y \ge 0$, tiempos positivos).
explicacion_simple: |
  Matemáticamente, una función cuadrática $f(x) = ax^2 + bx + c$ acepta cualquier número real ($\text{Dom}(f) = \mathbb{R}$). Sin embargo, **EN LA VIDA REAL HAY RESTRICCIONES**:

  - **Tiempo ($t$)**: El tiempo no puede ser negativo ($t \ge 0$).
  - **Distancias y Áreas ($x, A$)**: Las medidas de terreno y las longitudes deben ser strictly positivas ($x > 0$).
  - **Alturas y Cantidades ($h, Q$)**: No se pueden fabricar $-15$ pelotas ni tener alturas negativas antes del lanzamiento.

  **Dominio restringido del contexto ($D_{ctx}$)**:
  Es el intervalo de números que **SÍ TIENEN SENTIDO EN EL MUNDO REAL**.
  - **Ejemplo**: Para $A(x) = x(20 - x)$, como el ancho $x > 0$ y el largo $(20 - x) > 0$, el dominio real del contexto es **$x \in ]0, 20[$**.
explicacion_formal: |
  Sea la función cuadrática pura $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$. Cuando $f$ actúa como modelo de una situación física, económica o geométrica, el **dominio contextual válido $D_{ctx} \subset \mathbb{R}$** es el subconjunto de abscisas que satisfacen el sistema simultáneo de inecuaciones de realidad:

  $$D_{ctx} = \{x \in \mathbb{R} \mid x \ge x_{\min} \land f(x) \ge 0 \land \text{Restricciones Físicas}\}$$

  **Principios de acotación del dominio contextual:**
  1. **Positividad espacial:** Longitudes, anchos y superficies requieren $x > 0$ y $f(x) > 0$.
  2. **Causalidad temporal:** Variables cinemáticas imponen $t \ge 0$.
  3. **Acotación por ligadura lineal:** En áreas con malla limitada $P$, la variable $x$ se acota superiormente por el semiperímetro $x < P/2$.
definiciones_clave: |
  - **Dominio contextual ($D_{ctx}$)**: Restricción física o económica del conjunto de entrada que descarta soluciones matemáticas absurdas para el mundo real.
propiedades_relaciones: |
  - **Divergencia entre dominio matemático y contextual**: Mientras que el dominio algebraico de cualquier función cuadrática es $\mathbb{R}$, el dominio contextual es invariablemente un intervalo acotado o semirrecta cerrada.
ejemplo_guiado:
  enunciado: 'Determina el dominio contextual válido para el área de un terreno rectangular de largo $(50 - x)$ metros y ancho $x$ metros.'
  pasos:
    - 'Paso 1: Establecer la restricción de positividad para el ancho: $x > 0$.'
    - 'Paso 2: Establecer la restricción de positividad para el largo: $50 - x > 0 \implies x < 50$.'
    - 'Paso 3: Intersecar ambas condiciones algebraicas: $0 < x < 50$.'
    - 'Paso 4: Declarar el dominio contextual: $D_{ctx} = ]0, 50[$ metros.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para un proyectil cuya altura viene dada por $h(t) = -5t^2 + 40t$ desde el suelo ($h \ge 0$), ¿cuál es su dominio contextual válido $D_{ctx}$?'
    choices:
      - {text: 'El intervalo cerrado $[0, 8]$ segundos', is_correct: true}
      - {text: 'Todos los números reales $\mathbb{R}$.', is_correct: false}
      - {text: 'El intervalo abierto $]-\infty, 8[$.', is_correct: false}
      - {text: 'Únicamente el valor $t = 4$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo cerrado $[0, 8]$ segundos''. El proyectil despega en $t = 0$ y cae a tierra en $t = 8$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si al resolver la ecuación de un problema de dimensiones de un terreno se obtienen las soluciones matemáticas $x_1 = -6$ y $x_2 = 12$, ¿qué valor pertenece al dominio contextual?'
    choices:
      - {text: 'Únicamente $x = 12$ metros, porque las dimensiones geométricas son positivas', is_correct: true}
      - {text: 'Únicamente $x = -6$ metros.', is_correct: false}
      - {text: 'Ambas soluciones por ser raíces algebraicas válidas.', is_correct: false}
      - {text: 'Ninguna de las dos soluciones.', is_correct: false}
    explanation: 'La alternativa correcta es ''Únicamente $x = 12$ metros, porque las dimensiones geométricas son positivas''. Se descarta $x = -6$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la naturaleza física de la variable de entrada $x$ (tiempo, longitud, precio).'
  - 'Paso 2: Plantear inecuaciones de positividad para todas las dimensiones y variables de salida del problema.'
  - 'Paso 3: Resolver el sistema de inecuaciones simultáneas para aislar el intervalo válido.'
  - 'Paso 4: Expresar el dominio contextual resultante $D_{ctx}$ en notación de intervalos y descartar soluciones algebraicas extrañas.'
errores_correccion: |
  - **Error común:** Considerar que el dominio de un problema real es $\mathbb{R}$ solo porque la función matemática es cuadrática.
  - **Cómo corregirlo:** La matemática acepta todo, pero **EL MUNDO REAL TIENE LÍMITES**; acota siempre $x$ con las restricciones físicas.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Dominio contextual de tiempo de vuelo.
    alternativas:
      - 'D_ctx = [0, 10] segundos'
      - 'D_ctx = \mathbb{R}'
      - 'D_ctx = ]-\infty, 10]'
    respuesta: 'D_ctx = [0, 10] segundos'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Dominio contextual de dimensiones geométricas.
    alternativas:
      - 'D_ctx = ]0, 30[ metros'
      - 'D_ctx = [-30, 30]'
      - 'D_ctx = ]0, +\infty['
    respuesta: 'D_ctx = ]0, 30[ metros'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada una función cuadrática aplicada a un problema de física, es correcto afirmar que su dominio contextual es todo el conjunto $\mathbb{R}$.'
  - 'La inclusión de valores de tiempo negativos dentro del conjunto de entrada en modelos de movimiento balístico.'
  - 'Aceptar dimensiones de longitud iguales o menores a cero al calcular el área de una figura geométrica.'
  - 'La falta de eliminación de raíces algebraicas matemáticas que caen fuera de los límites de positividad contextual.'
  - 'La equivalencia errónea entre las restricciones del dominio contextual en $x$ y los límites del recorrido en $y$.'
afirmaciones_verdaderas:
  - 'El dominio contextual $D_{ctx}$ restringe el dominio matemático $\mathbb{R}$ a los valores que satisfacen la realidad del problema (tiempo $\ge 0$, dimensiones $> 0$).'
  - 'Al resolver ecuaciones cuadráticas en contextos aplicados, las raíces negativas deben ser descartadas si la variable física no admite valores negativos.'
al_terminar_debes_poder: |
  QUÉ: Evaluar y determinar la validez del dominio contextual en problemas aplicados de funciones cuadráticas.
  CÓMO: Plantear inecuaciones de positividad ($x > 0, y \ge 0$), resolver la intersección de intervalos, definir $D_{ctx}$ y descartar soluciones inválidas.
