semantic_id: MAT.ALG.FUNC_CUADR_MODELO.VALIDEZ_DOMINIO_CONTEXTO
resumen_inicial: 'El dominio contextual restringe el dominio matemático abstracto $\mathbb{R}$ a un subconjunto práctico de valores reales coherentes con las limitaciones físicas de la realidad.'
explicacion_simple: |
  Aunque una fórmula matemática se pueda calcular para cualquier número positivo o negativo, en el mundo real existen límites infranqueables: el tiempo no corre hacia atrás ($t \ge 0$), las distancias o lados de un terreno no pueden ser negativos ni cero ($x > 0$), y una fábrica no puede producir una cantidad infinita de productos por capacidad de bodega. Evaluar el dominio contextual consiste en encontrar el rango de números con sentido práctico.
explicacion_formal: |
  ### Definición formal
  Dada una función cuadrática abstracta $f: \mathbb{R} \to \mathbb{R}$, el **dominio contextual o práctico** $D_{\text{práctico}} \subset \mathbb{R}$ es el subconjunto de números reales que satisface simultáneamente las restricciones físicas, geométricas y operativas del problema:
  $$D_{\text{práctico}} = \{x \in \mathbb{R} \mid x \ge x_{\text{mín}} \ \land \ x \le x_{\text{máx}} \ \land \ f(x) \ge y_{\text{mín}}\}$$

  ### Desglose simbólico
  - Restricción de no negatividad de variables físicas: $t \ge 0$ (tiempo) y $x > 0$ (longitudes).
  - Restricción de viabilidad de salidas: $f(x) \ge 0$ (alturas no subterráneas, áreas positivas o utilidades no deficitarias).
  - Restricción por capacidad finita de insumos: $x \le \text{Capacidad Máxima}$.
  - Intersección de intervalos: $D_{\text{práctico}} = D_{\text{matemático}} \cap I_{\text{físico}} \cap I_{\text{operativo}}$.

  ### Síntesis didáctica
  Diferenciar dominio matemático de dominio contextual: El dominio matemático de cualquier función cuadrática polinomial es siempre el conjunto completo de los números reales $\mathbb{R}$. El dominio contextual es un intervalo acotado de dicho conjunto.
definiciones_clave: |
  - **Dominio matemático**: Conjunto total de valores $x \in \mathbb{R}$ donde la fórmula algebraica está bien definida.
  - **Dominio contextual / práctico**: Intervalo acotado de valores $x$ que poseen significado real coherente.
  - **Cota de factibilidad**: Limite superior o inferior impuesto por la física o economía del entorno.
propiedades_relaciones: |
  - **Recorte del conjunto recorrido**: Al restringir el dominio al intervalo $D_{\text{práctico}}$, el conjunto recorrido resultante $\operatorname{Rec}_{\text{práctico}}(f)$ se acota únicamente a los valores alcanzables en dicho intervalo.
  - **Ubicación del óptimo en los extremos del dominio**: Si la abscisa del vértice $h \notin D_{\text{práctico}}$, el máximo o mínimo del modelo contextualizado ocurre en uno de los extremos del intervalo permitido.
ejemplo_guiado:
  enunciado: 'Un granjero cerca un terreno rectangular de ancho $x$ con 40 metros de malla mediante la función de área $A(x) = x(20 - x) = -x^2 + 20x$. Determina el dominio matemático abstracto y evalúa el dominio contextual válido para las dimensiones del terreno.'
  pasos:
    - 'Paso 1: El dominio matemático abstracto de la función cuadrática polinomial $A(x) = -x^2 + 20x$ es $\operatorname{Dom}(A) = \mathbb{R}$.'
    - 'Paso 2: Exigimos las restricciones geométricas reales: el ancho debe ser estrictamente positivo ($x > 0$).'
    - 'Paso 3: El largo $y = 20 - x$ también debe ser estrictamente positivo ($20 - x > 0 \implies x < 20$).'
    - 'Paso 4: Exigimos que el área resultante sea positiva ($A(x) > 0 \implies x \in ]0, 20[$).'
    - 'Paso 5: Concluimos que el dominio contextual válido es el intervalo abierto $D_{\text{práctico}} = ]0, 20[\text{ metros}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'La altura de un clavadista al saltar desde una plataforma viene dada por $h(t) = -5t^2 + 5t + 10$. El clavadista toca el agua a los 2 segundos. ¿Cuál es el dominio contextual válido para el tiempo $t$?'
    choices:
      - {text: 'El intervalo cerrado $D_{\text{práctico}} = [0, 2]\text{ segundos}$', is_correct: true}
      - {text: 'El conjunto completo de los números reales $\mathbb{R}$', is_correct: false}
      - {text: 'El intervalo no acotado $]-\infty, 2]$', is_correct: false}
      - {text: 'El intervalo no acotado $[2, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo cerrado $D_{\text{práctico}} = [0, 2]\text{ segundos}$''. El tiempo inicia en $t = 0$ (salto) y termina en $t = 2$ (entrada al agua).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la capacidad máxima de almacenamiento de un galpón es de 50 toneladas, y la función de costo es $C(x) = x^2 - 40x + 500$, ¿cuál es la cota superior del dominio contextual?'
    choices:
      - {text: '$x \le 50\text{ toneladas}$', is_correct: true}
      - {text: '$x \le 20\text{ toneladas}$', is_correct: false}
      - {text: '$x \le 500\text{ toneladas}$', is_correct: false}
      - {text: 'No posee cota superior', is_correct: false}
    explanation: 'La alternativa correcta es ''$x \le 50\text{ toneladas}$''. La restricción de infraestructura impone un límite superior insoslayable de 50 toneladas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el dominio matemático abstracto de la función cuadrática (siempre $\mathbb{R}$).'
  - 'Paso 2: Aplicar la condición de no negatividad sobre la variable de entrada ($x \ge 0$ o $t \ge 0$).'
  - 'Paso 3: Resolver la inecuación $f(x) \ge 0$ para garantizar que los resultados de salida tengan sentido real.'
  - 'Paso 4: Intersecar los intervalos obtenidos y las restricciones del problema para declarar $D_{\text{práctico}}$.'
errores_correccion: |
  - **Error 1:** Confundir el dominio matemático $\mathbb{R}$ con el dominio contextual acotado. **Cómo corregirlo:** La fórmula matemática acepta cualquier número, pero la realidad del problema impone límites físicos y geométricos que restringen las entradas a un intervalo factible.
  - **Error 2:** Incluir tiempos negativos en el dominio práctico de un proyectil argumentando que la gráfica se prolonga hacia el cuadrante II. **Cómo corregirlo:** El tiempo físico parte desde el instante de lanzamiento $t = 0$. Los valores $t < 0$ carecen de existencia en el experimento.
ejemplos:
  - titulo: 'Dominio de tiempo de vuelo'
    enunciado: 'Un proyectil despega en $t = 0$ y cae a tierra en $t = 6$. ¿Cuál es su dominio contextual?'
    alternativas:
      - '$[0, 6]$'
      - '$\mathbb{R}$'
      - '$[6, +\infty[$'
    respuesta: '$[0, 6]$'
    solucion_pasos:
      - '1. El evento ocurre únicamente entre el despegue ($t = 0$) y la caída ($t = 6$).'
      - '2. El dominio contextual es el intervalo cerrado $[0, 6]$.'
  - titulo: 'Dominio en problemas de geometría'
    enunciado: 'Para un rectángulo de lados $x$ y $(12 - x)$, ¿el valor $x = 15$ pertenece al dominio contextual?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Si $x = 15$, el otro lado mide $(12 - 15) = -3$, lo cual es una dimensión geométrica imposible.'
  - titulo: 'Dominio acotado por capacidad'
    enunciado: 'Si una máquina sólo puede operar un máximo de 8 horas diarias, ¿el dominio contextual del tiempo $t$ en horas se restringe a $[0, 8]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La capacidad operativa de la máquina impone la cota superior $t \le 8$.'
  - titulo: 'Diferencia entre dominios'
    enunciado: '¿El dominio contextual de un problema es un subconjunto del dominio matemático de la función cuadrática?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $D_{\text{práctico}} \subset \operatorname{Dom}(f) = \mathbb{R}$.'
errores_frecuentes:
  - 'El dominio contextual de una función de trayectoria de proyectil es el conjunto de todos los números reales $\mathbb{R}$.'
  - 'En un problema de área rectangular $A(x) = x(50 - x)$, se puede elegir un ancho $x = 60$ metros.'
  - 'Un tiempo negativo $t = -5$ segundos es perfectamente válido en el dominio práctico de un lanzamiento.'
  - 'El dominio contextual solo depende de la fórmula algebraica y no de las restricciones del texto.'
  - 'Si la función de costo está definida para $x \in \mathbb{R}$, una empresa puede producir una cantidad negativa de $-10$ artículos.'
afirmaciones_verdaderas:
  - 'El dominio contextual de una función cuadrática acota el conjunto de los números reales a un intervalo de valores físicamente factibles.'
  - 'Las restricciones de no negatividad de distancias, tiempos y capacidades imponen límites superiores e inferiores al dominio práctico.'
