procedimiento:
- 'Paso 1: Identifica qué representa la variable independiente en el problema.'
- 'Paso 2: Determina las restricciones naturales (positividad, límites físicos) que
  debe cumplir esa variable.'
- 'Paso 3: Expresa el dominio contextual como el subconjunto de $\mathbb{R}$ que cumple
  todas esas restricciones.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en evaluación de la validez del dominio según las
  restricciones del contexto.
ejemplos:
- titulo: Determinación de dominio contextual en un problema de área
  enunciado: Con $A(x)=x(20-x)$, donde $x$ es un lado de un rectángulo con perímetro
    fijo, determina el dominio contextual.
  solucion_pasos:
  - Ambos lados ($x$ y $20-x$) deben ser positivos.
  - El dominio contextual es $x \in ]0,20[$.
- titulo: Determinación de dominio contextual en un problema de tiempo
  enunciado: Con $h(t)=-5t^2+20t$, donde $t$ es el tiempo desde el lanzamiento, determina
    el dominio contextual.
  solucion_pasos:
  - El tiempo no puede ser negativo, y el objeto está en el aire solo hasta $t=4$
    (cuando toca el suelo).
  - El dominio contextual es $t \in [0,4]$.
- titulo: ¿El dominio contextual de un problema aplicado puede ser distinto del dominio
    matemático de la función?
  enunciado: ¿El dominio contextual de un problema aplicado puede ser distinto del
    dominio matemático de la función?
  respuesta: Sí
  solucion_pasos:
  - El dominio matemático siempre es $\mathbb{R}$, pero el contexto puede restringirlo
    significativamente.
- titulo: ¿Es necesario verificar el dominio contextual antes de aceptar una solución
    como válida?
  enunciado: ¿Es necesario verificar el dominio contextual antes de aceptar una solución
    como válida?
  respuesta: Sí
  solucion_pasos:
  - Una solución matemáticamente correcta puede no tener sentido si cae fuera del
    dominio contextual del problema.
errores_frecuentes:
- Declarar el dominio matemático (siempre $\mathbb{R}$) con el dominio contextual
  del problema aplicado.
- No identificar todas las restricciones relevantes impuestas por el contexto.
- Aceptar soluciones fuera del dominio contextual sin verificarlas.
- Restringir el dominio de forma incorrecta, excluyendo valores que sí son válidos
  según el contexto.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  evaluación de la validez del dominio según las restricciones del contexto.
