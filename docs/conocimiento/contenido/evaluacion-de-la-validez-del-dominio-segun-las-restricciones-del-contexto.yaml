semantic_id: MAT.ALG.FUNC_CUADR_MODELO.VALIDEZ_DOMINIO_CONTEXTO
resumen_inicial: 'Evaluación de la validez del dominio según las restricciones del
  contexto: parábola, vértice, concavidad y formas de Modelamiento y aplicaciones.'
explicacion_simple: Aunque toda función cuadrática tiene matemáticamente dominio $\mathbb{R}$,
  en un problema aplicado casi nunca todos esos valores tienen sentido real.
explicacion_formal: '### Definición formal


  Aunque el dominio matemático de $f(x)=ax^2+bx+c$ es siempre $\mathbb{R}$, el **dominio
  contextual** en un problema aplicado es el subconjunto de $\mathbb{R}$ que satisface
  las restricciones impuestas por la naturaleza de la variable $x$ (positividad, valores
  enteros, límites físicos del problema).


  ### Desarrollo didáctico


  Para determinar el dominio contextual, se debe identificar qué representa la variable
  y qué límites naturales o impuestos por el problema debe respetar, además de cualquier
  restricción explícita del enunciado.


  Si $x$ representa el ancho de un terreno rectangular con perímetro fijo de $40$
  m (y el otro lado es $20-x$), el dominio contextual es $x \in ]0,20[$, pues ambas
  dimensiones deben ser positivas.'
definiciones_clave: '- **Evaluación de la validez del dominio según las restricciones
  del contexto**: Elemento o parámetro esencial en la representación de la función
  cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  evaluación de la validez del dominio según las restricciones del contexto.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando evaluación
    de la validez del dominio según las restricciones del contexto.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a evaluación
    de la validez del dominio según las restricciones del contexto.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
