semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.SIGNO_BASE_NEGATIVA_EXPONENTE_PAR
resumen_inicial: Toda potencia de base negativa encerrada en paréntesis y elevada a un exponente par resulta en un número estrictamente positivo.
explicacion_simple: '![Signo de potencia con base negativa y exponente par](/static/img/nodos/signo-de-potencia-con-base-negativa-y-exponente-par-intro.svg)


  Cuando elevamos un número negativo entre paréntesis a un exponente par ($2, 4, 6, 8, 10...$), los signos negativos se agrupan en parejas perfectas. Como ''menos por menos es más'' ($(-) \cdot (-) = (+)$), cada pareja se convierte en positiva y el resultado final siempre es **positivo**. Por ejemplo: $(-2)^4 = (-2) \cdot (-2) \cdot (-2) \cdot (-2) = (+4) \cdot (+4) = +16$.'
explicacion_formal: "Sea $a \\in \\mathbb{R}$ con $a > 0$ y sea $n = 2k$ un número natural par con $k \\in \\mathbb{N}$. El **Teorema de Paridad Positiva** establece que:\n\n$$(-a)^{2k} = +a^{2k} > 0$$\n\n**Demostración algebraica:**\n$$(-a)^{2k} = [(-a)^2]^k = [(-1)^2 \\cdot a^2]^k = [1 \\cdot a^2]^k = (a^2)^k = a^{2k}$$\n\n**Propiedades derivadas:**\n1. **Identidad de cuadrados:** $(-x)^2 = x^2$ para todo $x \\in \\mathbb{R}$.\n2. **Potencias de la unidad negativa:**\n   $$(-1)^{2k} = 1 \\quad (\\forall k \\in \\mathbb{Z})$$\n3. **Bases fraccionarias negativas:** $\\left(-\\frac{a}{b}\\right)^{2k} = +\\frac{a^{2k}}{b^{2k}}$."
definiciones_clave: '- **Exponente par**: Número entero de la forma $2k$, divisible exactamente por 2.

  - **Teorema de paridad positiva**: Regla que garantiza signo positivo al elevar bases negativas a exponentes pares.'
propiedades_relaciones: '- **Simetría par**: $f(-x) = f(x)$ en funciones potenciales $f(x) = x^{2k}$.

  - **No negatividad**: Para todo $x \in \mathbb{R}$, $x^{2k} \ge 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de base negativa con exponente par](/static/img/nodos/signo-de-potencia-con-base-negativa-y-exponente-par-ejemplos.svg)


    Calcule el valor de $(-2)^6$, $\left(-\frac{1}{3}\right)^4$ y $(-1)^{200}$ verificando el signo positivo en cada resultado.'
  pasos:
  - 'Paso 1: Evaluar $(-2)^6$: El exponente $6$ es par. Desarrollo: $(-2)^6 = +2^6 = 64$.'
  - 'Paso 2: Evaluar $\left(-\frac{1}{3}\right)^4$: El exponente $4$ es par. Desarrollo: $+\frac{1^4}{3^4} = +\frac{1}{81}$.'
  - 'Paso 3: Evaluar $(-1)^{200}$: El exponente $200$ es par. Desarrollo: $(-1)^{200} = +1$.'
  - 'Conclusión: Los resultados son $+64$, $+\frac{1}{81}$ y $+1$, todos estrictamente positivos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué $(-a)^{2k}$ es siempre positivo para $a \neq 0$?
  choices:
  - text: Porque los signos negativos se agrupan en pares y $(-)(-) = (+)$
    is_correct: true
  - text: Porque el exponente elimina el número
    is_correct: false
  - text: Porque se suma en lugar de multiplicar
    is_correct: false
  - text: Solo es positivo si $a > 10$
    is_correct: false
  explanation: La alternativa correcta es 'Porque los signos negativos se agrupan en pares y $(-)(-) = (+)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado de $\left(-\frac{1}{3}\right)^4$?
  choices:
  - text: $+\frac{1}{81}$
    is_correct: true
  - text: $-\frac{1}{81}$
    is_correct: false
  - text: $+\frac{4}{12}$
    is_correct: false
  - text: $-\frac{4}{81}$
    is_correct: false
  explanation: La alternativa correcta es '$+\frac{1}{81}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base negativa esté entre paréntesis.'
- 'Paso 2: Comprobar que el exponente sea un número par ($2, 4, 6, 8...$).'
- 'Paso 3: Eliminar el signo negativo de la base y calcular la potencia positiva $a^{2k}$.'
errores_correccion: '- **Error 1: Asignar signo negativo por ver un signo menos dentro del paréntesis (pensar que $(-2)^4 = -16$).** **Cómo corregirlo:** Si el exponente es PAR, el resultado SIEMPRE es POSITIVO ($(-2)^4 = +16$).

  - **Error 2: Confundir $(-x)^2$ con $-x^2$.** **Cómo corregirlo:** $(-x)^2 = +x^2$, mientras que $-x^2 = -(x^2)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $(-3)^4$?
  alternativas:
  - $+81$
  - $-81$
  - $-12$
  respuesta: $+81$
  solucion_pasos:
  - Exponente par $4 \implies (-3)^4 = +3^4 = 81$.
- titulo: Ejemplo 2
  enunciado: ¿Cuánto es $\left(-\frac{2}{5}\right)^2$?
  alternativas:
  - $+\frac{4}{25}$
  - $-\frac{4}{25}$
  - $+\frac{4}{5}$
  respuesta: $+\frac{4}{25}$
  solucion_pasos:
  - $\left(-\frac{2}{5}\right)^2 = +\frac{2^2}{5^2} = \frac{4}{25}$.
- titulo: ¿Es (-5)⁸ un número positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, 8 es un número par, por lo que $(-5)^8 > 0$.
  alternativas:
  - texto: Sí, porque el exponente 8 es par
    es_correcta: true
    retroalimentacion: ¡Correcto! Toda base con paréntesis y exponente par es positiva.
  - texto: No, es negativo porque la base es -5
    es_correcta: false
    retroalimentacion: Incorrecto, la paridad del exponente vuelve positivo el resultado.
  - texto: Solo si se divide por 2
    es_correcta: false
    retroalimentacion: Incorrecto, la potencia en sí ya es positiva.
- titulo: ¿Es (-10)⁴ igual a -10.000?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-10)^4 = +10.000$, es positivo.
  alternativas:
  - texto: No, es igual a +10.000
    es_correcta: true
    retroalimentacion: ¡Correcto! $(-10)^4 = +10^4 = 10.000$.
  - texto: Sí, porque la base es negativa
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente 4 es par y anula el signo negativo.
  - texto: No, es igual a -40
    es_correcta: false
    retroalimentacion: Incorrecto, es una potencia, no una multiplicación.
errores_frecuentes:
- Creer que las bases negativas siempre dan resultados negativos.
- Olvidar que el signo menos sin paréntesis permanece negativo ($-2^4 = -16$).
- Multiplicar la base negativa por el exponente ($(-3)^2 = -6$).
- Pensar que $(-1)^{\text{par}} = -1$.
- Asumir que elevar al cuadrado una fracción negativa mantiene el signo negativo.
afirmaciones_verdaderas:
- Para todo $a \neq 0$ y todo $k \in \mathbb{Z}$, $(-a)^{2k} > 0$.
- El cuadrado de cualquier número real no nulo es estrictamente positivo.
- La potencia $(-1)^{2k} = 1$ para cualquier entero $k$.
al_terminar_debes_poder: '![Síntesis de base negativa con exponente par](/static/img/nodos/signo-de-potencia-con-base-negativa-y-exponente-par-resumen.svg)


  QUÉ: Determinar y justificar el signo positivo en potencias de base negativa con exponente par.


  CÓMO: Aplicando el teorema $(-a)^{2k} = +a^{2k}$, agrupando los factores negativos en parejas con producto positivo $(-)(-) = (+)$, y calculando el valor absoluto del resultado.'
